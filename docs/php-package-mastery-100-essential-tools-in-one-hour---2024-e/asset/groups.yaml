    Xlsx;\n// Creating a new spreadsheet\n$spreadsheet = new Spreadsheet();\n$sheet\
    \ = $spreadsheet->getActiveSheet();\n$sheet->setCellValue('A1', 'Hello World!');\n\
    // Writing to a file\n$writer = new Xlsx($spreadsheet);\n$writer->save('hello_world.xlsx');\n\
    ```\n\nThis code creates a new Excel file named 'hello_world.xlsx' containing\
    \ a single cell (A1) with the text 'Hello World!'.\n\nIn the provided example,\
    \ we start by requiring the Composer autoload file, which is essential for loading\
    \ the PhpSpreadsheet library classes. Then, we instantiate a new Spreadsheet object,\
    \ which serves as the primary container for our spreadsheet data. The getActiveSheet\
    \ method is used to fetch the current active worksheet. We then set the value\
    \ of cell 'A1' to \"Hello World!\" using the setCellValue method. This method\
    \ takes two parameters: the cell coordinate as the first parameter (in this case,\
    \ 'A1') and the value to be set as the second parameter. After setting the cell\
    \ value, we prepare to write our spreadsheet to a file. To do this, we create\
    \ a new Xlsx writer instance, passing our Spreadsheet object to the constructor.\
    \ The save method of the writer object is then called with the desired file name\
    \ ('hello_world.xlsx'). This action writes our spreadsheet data to an Excel file\
    \ in the XLSX format. This example demonstrates the basic process of creating\
    \ a spreadsheet, modifying its contents, and saving it to a file using PhpSpreadsheet,\
    \ which can be particularly useful for generating reports, exporting data, and\
    \ creating dynamic spreadsheet files through PHP.\n\n## 41. ParagonIE Sodium Compat\n\
    \nThis library is a polyfill for the libsodium library, providing cryptography\
    \ features for PHP projects, such as encryption, decryption, signatures, and secure\
    \ key exchange, particularly aiming to improve security practices.\n\n### Ex:ParagonIE\
    \ Sodium Compat\n\n```php\nrequire 'vendor/autoload.php';\nuse ParagonIE\\Sodium\\\
    Core\\Salsa20;\n$message = 'This is a secret message.';\n$key = \\random_bytes(Salsa20::KEYBYTES);\
    \ // Generate a random key\n$nonce = \\random_bytes(Salsa20::NONCEBYTES); // Generate\
    \ a random nonce\n// Encrypt the message\n$encrypted = \\ParagonIE\\Sodium\\Core\\\
    Salsa20::crypto_stream_xor($message, $nonce, $key);\n// Decrypt the message\n\
    $decrypted = \\ParagonIE\\Sodium\\Core\\Salsa20::crypto_stream_xor($encrypted,\
    \ $nonce, $key);\necho $decrypted;\n```\n\nThis is a secret message.\n\nIn this\
    \ code example, we use the ParagonIE\\Sodium\\Core\\Salsa20 class from the ParagonIE\
    \ Sodium Compat library for encryption and decryption. First, we include the library\
    \ using require 'vendor/autoload.php'; This autoload file is generated by Composer,\
    \ a dependency manager for PHP, which you need to have installed and used to install\
    \ paragonie/sodium_compat. We define a message that we want to keep secret. To\
    \ encrypt the message, we need a key and a nonce. The key is a fixed-size secret\
    \ key, and the nonce is a one-time number used to ensure that the encryption is\
    \ unique. We generate these using PHP's random_bytes() function, specifying the\
    \ size requirements using constants provided by the library (Salsa20::KEYBYTES\
    \ for the key and Salsa20::NONCEBYTES for the nonce). The encryption is performed\
    \ using the crypto_stream_xor method. This method applies the XOR operation between\
    \ the message and a keystream generated by Salsa20 algorithm, using the provided\
    \ key and nonce. The result is an encrypted message. To decrypt the message, we\
    \ apply the crypto_stream_xor method again with the same key and nonce to the\
    \ encrypted message. The XOR operation is reversible, so applying it again with\
    \ the same keystream regenerates the original message. This example demonstrates\
    \ a basic use of encryption and decryption, highlighting the ease of use of cryptographic\
    \ operations with the ParagonIE Sodium Compat library. The library ensures compatibility\
    \ across different versions of PHP, abstracting the complexity of directly using\
    \ cryptographic functions.\n\n## 42. PHPBench\n\nPHPBench is a benchmarking framework\
    \ designed for PHP, allowing developers to measure and compare the performance\
    \ of PHP code blocks systematically. It provides a way to write benchmarking tests\
    \ similar to unit tests, which can be integrated into a CI/CD pipeline for performance\
    \ monitoring.\n\n### Ex:PHPBench\n\n```php\nuse PhpBench\\Benchmark\\Metadata\\\
    Annotations\\BeforeMethods;\nuse PhpBench\\Benchmark\\Metadata\\Annotations\\\
    Benchmark;\nuse PhpBench\\Benchmark\\Metadata\\Annotations\\Iterations;\nclass\
    \ MyBenchmark\n{\nprivate $dataArray;\n/**\n * Initialize data before benchmarks.\n\
    \ */\npublic function init()\n{\n$this->dataArray = range(1, 1000);\n}\n/**\n\
    \ * @Benchmark\n * @Iterations(10)\n * @BeforeMethods({\"init\"})\n */\npublic\
    \ function benchArrayMap()\n{\narray_map(function ($item) {\nreturn $item * 2;\n\
    }, $this->dataArray);\n}\n}\n```\n\nBenchmark results will vary based on the system\
    \ and conditions under which they're run. Typically, output includes execution\
    \ time, memory usage, and iterations.\n\nThis code snippet demonstrates how to\
    \ create a simple benchmark test using PHPBench. The MyBenchmark class contains\
    \ a benchmark method benchArrayMap that measures the performance of applying a\
    \ function over each element of an array using array_map. Before running the benchmark,\
    \ we initialize some data in the init method, which in this case, creates an array\
    \ of 1000 integers. This method is specified to run before the benchmark test\
    \ with the @BeforeMethods annotation. The @Benchmark annotation marks the benchArrayMap\
    \ method as a benchmark test. The @Iterations(10) annotation indicates that the\
    \ test should be run 10 times. This repetition is essential for getting a more\
    \ accurate measurement by averaging the results. When you run this benchmark,\
    \ PHPBench executes the benchArrayMap method 10 times, each time measuring the\
    \ execution time and memory usage. After completing the runs, PHPBench provides\
    \ a report summarizing the performance metrics, which can be extremely useful\
    \ for identifying performance regressions or for comparing the performance impact\
    \ of code changes. This framework is beneficial for developers who need to ensure\
    \ their code performs well under different conditions and over time. Integrating\
    \ benchmark tests into your CI/CD pipeline can help catch performance issues early\
    \ in the development cycle.\n"
  mdcn: "\n在上面的代码示例中，第一步是使用 Composer 的自动加载功能引入 Faker 库。这使得 Faker 的所有类都可以在脚本中使用。创建\
