    \ `Mailer` 进行了类型提示，而 PHP-DI 识别了这一需求。\n-   **优点：** 使用像 PHP-DI 这样的 DI 容器可以简化对象的创建和管理，尤其是在复杂依赖的情况下。它通过将对象的实例化与其使用解耦，促进了更模块化且可测试的代码库。\n\
    -   **实例化与使用：** 示例中的最后一步涉及实际使用 `UserController`。使用 PHP-DI，获取一个已准备好使用且所有依赖均已正确注入的实例非常简单，如示例所示。此简化示例说明了使用\
