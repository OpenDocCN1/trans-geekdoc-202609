    # 46. Stomp PHP


    Stomp PHP is a client library for interacting with message brokers that support
    the STOMP protocol, allowing PHP applications to communicate with messaging systems
    for asynchronous messaging and integration patterns.


    Ex:Stomp PHP


    ```

    ```php

    // Example of using Stomp PHP to send a message to a queue

    use Stomp\Client;

    use Stomp\SimpleStomp;

    $stompClient = new Client(''tcp://broker.example.com:61613'');

    $stompClient->connect();

    $stomp = new SimpleStomp($stompClient);

    // Send a message to a queue

    $stomp->send(''/queue/test'', ''Hello, world!'');

    // Disconnecting

    $stompClient->disconnect();

    echo "Message sent!";

    ```

