  mdcn: "\n## 74. PHPStan\n\nPHPStan 是一个用于 PHP 的静态分析工具，专注于在不实际运行代码的情况下查找代码中的错误。它可以检测潜在的错误和不一致性，遵循现代开发实践以确保代码的可靠性和可维护性。它支持从基础到严格的各种分析级别，使开发人员能够逐步改进代码库。\n\
    \n示例：PHPStan\n\n```php\n// PHPStan is typically run from the command line, analyzing\
