    operations with time intervals and helps in defining, comparing, and adjusting
    time ranges.


    ### Ex: League\Period

    ```php

    use League\Period\Period;

    $period1 = Period::make(''2020-01-01'', ''2020-01-31''); // January 2020

    $period2 = Period::make(''2020-01-15'', ''2020-02-15''); // 15th Jan to 15th Feb

    $overlap = $period1->overlap($period2); // Get the overlapping period

    echo $overlap->getStartDate()->format(''Y-m-d'') . '' to '' . $overlap->getEndDate()->format(''Y-m-d'');

    ```


    In this code example, we''re using the League\Period library to work with periods
    of time: We first import the Period class. $period1 = Period::make(''2020-01-01'',
    ''2020-01-31''); creates a period that represents the entire month of January
    2020. $period2 = Period::make(''2020-01-15'', ''2020-02-15''); creates another
    period that starts in the middle of January 2020 and goes until the middle of
    February 2020. $overlap = $period1->overlap($period2); calculates the overlap
    between the two periods. The overlap method returns a new Period object that represents
    the time frame common to both periods. The final echo statement formats and displays
    the start and end dates of the overlapping period, showing "2020-01-15 to 2020-01-31".
