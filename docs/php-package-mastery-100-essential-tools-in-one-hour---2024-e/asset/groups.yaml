    \ JSON 表示。\n\n在上面的示例中，我们首先引入 vendor/autoload.php 文件，该文件由 Composer 生成，用于自动加载依赖项。然后我们使用数据库连接详细信息实例化一个\
    \ ExtendedPdo 对象。Aura.Sql 扩展了 PHP 原生的 PDO 类，在保持 PDO 简单性的同时增加了更多功能。fetchAll 方法用于执行\
    \ SELECT 查询并获取所有匹配的行。查询包含一个占位符 :user_ids，这是我们想要选择的用户 ID 数组。Aura.Sql 的 ExtendedPdo\
    \ 类允许我们直接为查询中的占位符传递数组，它将处理数组到适合 SQL 执行的字符串的转换和引用。此功能对于需要基于值列表过滤结果的查询特别有用，避免了手动拼接和引用数组值到\
    \ SQL 字符串中。最后，我们使用 json_encode 将结果集转换为 JSON 字符串以进行显示。这是在构建需要返回易于被 JavaScript 和其他语言消费的数据格式的\
    \ Web 应用程序或 API 时的常见做法。\n\n"
