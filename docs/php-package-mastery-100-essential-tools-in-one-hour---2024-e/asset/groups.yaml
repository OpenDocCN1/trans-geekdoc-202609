    # 8. RedBeanPHP


    RedBeanPHP is an ORM (Object Relational Mapping) tool for PHP. It creates and
    maintains database tables on the fly and requires no configuration. It''s designed
    to be simple and requires no model classes, allowing for rapid development and
    prototyping.


    Ex:RedBeanPHP


    ```

    ```php

    require ''path/to/rb.php'';

    // Setup connection

    R::setup(''mysql:host=localhost;dbname=mydatabase'', ''user'',

    ''password'');

    // Create a new bean (record)

    $book = R::dispense(''book'');

    $book->title = ''The Great Gatsby'';

    $book->author = ''F. Scott Fitzgerald'';

    // Store the bean in the database

    $id = R::store($book);

    // Retrieve the book

    $book = R::load(''book'', $id);

    echo $book->title . '' by '' . $book->author;

    ```

    ```


