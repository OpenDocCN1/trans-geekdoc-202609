    IdentityProviderException $e) {\n    exit('Failed to get authorization code: '\
    \ . $e->getMessage());\n}\n```\n\nAuthorization URL: http://brentertainment.com/oauth2/lockdin/authorize?client_id=demoapp&state=XYZ&response_type=code\n\
    \n在此代码片段中，我们使用 PHP League's OAuth2 Client 库来发起 OAuth 2.0 授权请求。此示例专门使用通用提供程序，可适配任何符合\
