  - '[PAGE 62]


    This PHP script demonstrates the use of the PCNTL extension to create a fork in
    your program. Forking is a concept where the current process creates a copy of
    itself. It''s like branching out on a road; both the parent and the child processes
    continue to execute the subsequent code independently. The pcntl_fork() function
    creates a child process. If the function returns -1, it means the fork failed.
    If it returns 0, it means the code is currently running in the child process.
    Any other positive number means the code is running in the parent process, and
    the number represents the child''s process ID. In the parent process ($pid is
    positive), pcntl_wait($status) is called to wait for the child process to finish.
    This is important to prevent zombie processes, which are processes that have completed
    execution but still have an entry in the process table. In the child process ($pid
    is 0), we simply print "Child Process". This process could do anything independently
    of the parent. Depending on the timing, the output might vary. Typically, the
    child process''s message is displayed first, followed by the parent''s message
    after it finishes waiting for the child process. The concept of forking is crucial
    in creating daemons or any background processes in PHP scripts running on Unix-like
    operating systems. Understanding PCNTL is key for advanced PHP programming, particularly
    for creating robust command-line applications that require process control.'
