    \ API 交互或获取 Web 资源至关重要。\n\n## 17. JSON\n\nPHP 中的 JSON 函数用于对 JSON 格式的数据进行编码和解码。这在\
    \ Web 开发中至关重要，尤其是在 API 和 Web 服务通信中。\n\n### 示例：JSON\n\n```php\n// Encode an array\
    \ to JSON string\n$array = ['name' => 'John', 'age' => 30];\n$jsonString = json_encode($array);\n\
    echo $jsonString;\n// Decode JSON string back to array\n$decodedArray = json_decode($jsonString,\
    \ true);\nprint_r($decodedArray);\n?>\n```\n\nArray\n(\n[name] => John\n[age]\
    \ => 30\n)\n\n此代码示例演示了 PHP JSON 扩展的两个主要函数：json_encode 和 json_decode。json_encode($array)：该函数接受一个\
    \ PHP 数组（或任何可转换为 JSON 的其他类型，如对象），并将其转换为 JSON 格式的字符串。在示例中，一个包含 name 和 age 的关联数组被转换为\
    \ JSON 字符串。json_decode($jsonString, true)：该函数将 JSON 格式的字符串转换回 PHP 变量。第二个参数设为 true\
    \ 时，确保结果为关联数组而不是对象。如果不设置该参数，默认输出将是一个对象。在示例中，JSON 字符串被转换回 PHP 数组，然后使用 print_r 打印出来，显示了其结构和数据。这些函数对于\
