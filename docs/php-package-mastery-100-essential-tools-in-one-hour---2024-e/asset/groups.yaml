    \ 在初始日期上增加 10 天。DateInterval 对象通过一个周期指示符（P）后跟天数（10D）来创建，表示“10 天的时间段”。DateInterval\
    \ 也可用于月、年、小时、分钟和秒。`echo $date->format('Y-m-d');` 根据提供的格式（`'Y-m-d'` 代表年-月-日）将修改后的日期格式化为字符串并输出。输出为“2024-03-30”，即初始日期后的第\
    \ 10 天。此示例演示了通过添加特定时间间隔然后格式化输出进行日期操作的方法，这是 Web 开发中实现有效期、定时发布或事件倒计时等功能的常见任务。\n\n\
    ## 9. Reflection\n\nPHP 中的反射用于内省类、接口、函数、方法和扩展。这种能力允许开发人员在运行时分析代码的结构，包括检查属性、方法和参数，这对于调试或需要以动态方式操作对象的系统特别有用。\n\
    \n### 示例：Reflection\n\n```php\nclass MyClass {\npublic $prop1 = 'Hello';\nprivate\
    \ $prop2 = 'World';\npublic function myMethod($arg1, $arg2) {\nreturn $arg1 .\
    \ ' . ' . $arg2;\n}\n}\n$reflectionClass = new ReflectionClass('MyClass');\n$methods\
    \ = $reflectionClass->getMethods();\nforeach ($methods as $method) {\necho $method->name\
    \ . \"\\n\";\n}\n$properties = $reflectionClass->getProperties();\nforeach ($properties\
    \ as $property) {\necho $property->name . \"\\n\";\n}\n```\n\n## 10. stream_context_create\n\
    \nPHP 中的该函数用于创建并返回一个流上下文资源，该资源可与文件系统或流函数一起使用。此上下文可以修改流函数的行为，允许进行自定义，例如设置 HTTP\
    \ 头、指定 SSL 选项，或为文件操作或数据传输配置代理设置。\n\n### 示例：stream_context_create\n\n```php\n$options\
    \ = array(\n    'http' => array(\n        'method' => \"GET\",\n        'header'\
    \ => \"Accept-language: en\\r\\n\" .\n        \"Cookie: foo=bar\\r\\n\"\n    )\n\
    );\n$context = stream_context_create($options);\n$result = file_get_contents('http://www.example.com/',\
    \ false,\n$context);\necho $result;\n?>\n```\n\n"
