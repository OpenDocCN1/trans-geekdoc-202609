    \ detailed diagnostic information, including the file and code line where the\
    \ error occurred, the call stack, and, if available, the relevant code snippet.\n\
    \nEx:Whoops\n\n```php\nrequire 'vendor/autoload.php';\n$whoops = new \\\\Whoops\\\
