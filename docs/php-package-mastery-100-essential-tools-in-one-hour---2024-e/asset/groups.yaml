    ## 59. Symfony Finder

    Symfony Finder component allows developers to build complex file and directory
    queries with an intuitive and fluent interface. It simplifies the task of searching
    for files and directories based on various criteria, such as name, date, size,
    and more.


    ### Ex: Symfony Finder

    ```php

    use Symfony\Component\Finder\Finder;

    $finder = new Finder();

    $finder->in(''/path/to/directory'')->files()->name(''*.php'');

    foreach ($finder as $file) {

    echo $file->getRealPath() . "\n";

    }

    ```

    /path/to/directory/subdirectory/example2.php


    In the provided code example, we start by importing the Finder component from
    the Symfony framework using the use statement. We create an instance of the Finder
    class and then chain several methods to define our search criteria. The in() method
    specifies the directory path where the search should take place. Here, ''/path/to/directory''
    is a placeholder for the actual path to your directory. The files() method filters
    the search to include only files (excluding directories). The name(''*.php'')
    method further narrows the search to files with a .php extension. The foreach
    loop iterates over each file found by the Finder instance. The $file->getRealPath()
    method retrieves the full path of the file, which is then echoed out, resulting
    in a list of paths to PHP files within the specified directory and its subdirectories.
    This example demonstrates a simple way to search for files matching specific criteria
