    \ 1 到 15 个字符之间。电子邮件必须是有效的电子邮件格式。\n\n`require 'vendor/autoload.php';` 包含 Composer\
    \ 自动加载文件，使 Respect\\Validation 库在我们的脚本中可用。`use Respect\\Validation\\Validator\
