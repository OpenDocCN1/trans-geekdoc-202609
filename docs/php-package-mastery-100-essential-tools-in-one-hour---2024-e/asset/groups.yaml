    ;\n}\n// close the FTP stream\nftp_close($conn_id);\n?>\n```\n\n如果成功，此脚本会打印 `\"\
    Connected to ftp.example.com, as username\"`。如果连接或登录失败，它会打印 `\"FTP connection\
    \ has failed!\"`。\n\n此示例直观地演示了如何使用 PHP 中的 FTP 扩展连接到 FTP 服务器。涉及的关键步骤如下：\n\n- 定义\
    \ FTP 服务器详细信息（服务器地址、用户名和密码）。\n- 使用 `ftp_connect()` 建立到 FTP 服务器的连接。该函数尝试与 FTP 服务器建立连接，成功时返回链接标识符，出错时返回\
    \ `false`。\n- 使用 `ftp_login()` 通过提供的凭据登录 FTP 服务器。该函数接受连接链接标识符、用户名和密码作为参数，登录成功返回\
    \ `true`，失败返回 `false`。\n- 检查连接和登录尝试的结果。如果连接建立失败或登录不成功，则打印错误消息并退出脚本。\n- 使用 `ftp_close()`\
    \ 关闭到 FTP 服务器的连接，该函数接受链接标识符作为其参数。\n\n此脚本封装了一个基本模式：发起与 FTP 服务器的连接，进行登录，验证这些操作是否成功，然后干净地关闭连接。\n\
    \n## 29. array_diff\n\narray_diff 用于比较两个或多个数组的值，并返回差异。该函数将第一个数组的值与一个或多个其他数组进行比较，并返回在第一个数组中存在但不在任何其他数组中出现的值。\n\
    \n示例：array_diff\n\n```php\n$array1 = ['apple', 'banana', 'cherry'];\n$array2 =\
    \ ['banana','durian'];\n$difference = array_diff($array1, $array2);\nprint_r($difference);\n\
    ```\n\n```text\nArray\n\n(\n[0] => apple\n[2] => cherry\n)\n```\n\n此代码片段演示了如何使用\
    \ array_diff 函数找出两个数组 `$array1` 和 `$array2` 之间的差异。该函数将 `$array1` 中的值与 `$array2`\
    \ 中的值进行比较。结果存储在 `$difference` 中，是一个包含 `$array1` 中所有在 `$array2` 中不存在的值的数组。当执行 `print_r($difference);`\
    \ 时，它会以人类可读的形式打印数组 `$difference`。这个结果显示，`$array1` 中的 `'apple'` 和 `'cherry'` 不在\
    \ `$array2` 中，因此它们包含在输出中。此示例说明了 array_diff 在比较数组和仅基于值提取差异方面的实用性，而不考虑与这些值关联的键。\n\
    \n## 30. array_map\n\narray_map 将一个回调函数应用于一个或多个数组的元素，并返回一个包含应用回调函数后所有元素的数组。\n\n\
    示例：array_map\n\n```php\nfunction square($n) {\nreturn $n * $n;\n}\n$numbers =\
    \ [1, 2, 3, 4];\n$squared = array_map('square', $numbers);\nprint_r($squared);\n\
    ```\n\n```text\nArray\n\n(\n[0] => 1\n[1] => 4\n[2] => 9\n[3] => 16\n)\n```\n\n\
    在这段代码中，我们定义了一个名为 `square` 的简单函数，用于计算一个数的平方。然后我们声明一个数组 `$numbers`，其元素为 1、2、3 和\
    \ 4。使用 array_map 函数将 square 函数应用于 `$numbers` 数组的每个元素。该操作的结果赋值给 `$squared` 数组。`print_r($squared);`\
    \ 命令打印数组 `$squared`，显示 `$numbers` 中原始数字的平方值。`$numbers` 数组的每个元素都会传递给 square 函数，该函数返回该数的平方。array_map\
    \ 函数将这些返回值收集到一个新数组 `$squared` 中，然后打印出来。这演示了如何使用 array_map 将函数应用于数组的每个元素，从而实现数组数据的高效批量转换。\n\
    \n## 第 3 章 外部库\n\n### 1. Guzzle\n\nGuzzle 是一个 PHP HTTP 客户端，它可以轻松发送 HTTP 请求，并让与\
    \ Web 服务的集成变得简单。\n\n示例：Guzzle\n\n```php\nrequire 'vendor/autoload.php';\n$client\
    \ = new \\GuzzleHttp\\Client();\n$response = $client->request('GET',\n'https://api.github.com/repos/guzzle/guzzle');\n\
    echo $response->getStatusCode(); // HTTP status code\necho $response->getBody();\
    \ // Body of the response\n```\n\n```text\n200\n\n// The actual JSON response\
    \ from GitHub about the Guzzle repository will be displayed here.\n```\n\n此示例演示了如何使用\
    \ Guzzle 向 GitHub 的 API 发出 GET 请求，以获取 Guzzle 仓库本身的信息。首先，你需要在项目中引入 Guzzle，这通常通过\
    \ PHP 的依赖管理器 Composer 完成。你可以在项目目录中运行 `composer require guzzlehttp/guzzle` 将 Guzzle\
    \ 添加到项目中。代码首先包含 Composer 的自动加载文件，这样就可以使用通过 Composer 安装的 Guzzle 和其他库，而无需手动包含。然后，它创建一个\
    \ Guzzle HTTP 客户端的新实例。使用这个客户端，我们向指定的 URL 发出 GET 请求，在本例中该 URL 是 GitHub 上 Guzzle\
    \ 仓库的 API 端点。request 方法返回一个响应对象，我们可以从中提取信息，例如使用 `$response->getStatusCode()` 获取\
    \ HTTP 状态码，使用 `$response->getBody()` 获取响应主体。在现实场景中，你可能会解析 JSON 主体以提取特定信息。此示例提供了在\
    \ PHP 中使用外部 API 的简单方法，展示了 Guzzle 如何抽象掉发起 HTTP 请求和处理响应时涉及的许多复杂性。\n\n"
