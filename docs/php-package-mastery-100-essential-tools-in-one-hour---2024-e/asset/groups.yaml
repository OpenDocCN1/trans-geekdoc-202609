    parseFile method reads an RDF file located at "example.rdf" and parses its contents
    into the graph. Next, we retrieve a specific resource from the graph using its
    URI (''http://example.org/people#me''). We then use the get method to obtain a
    specific property of the resource, in this case, ''foaf:name'', which stands for
