    There are numerous distinct speech synthesis strategies. Each strategy is divided
    into three categories: articulatory synthesis, formant synthesis, and concatenative
    synthesis.


    To simulate speech, articulatory synthesis employs mathematical functions of the
    vocal tract and glottis. It simulates articulatory movements as the tongue, lips,
    and glottis.


    Formant synthesis is primarily based on an analytical framework that assumes glottal
    supply is an unbiased filter of the vocal tract, using a number of rules that
    are applied to an extremely simplified source-filter configuration. In any filter,
    the control parameters affect the frequency and bandwidth. In the vocal tract
    each formant corresponds to a particular resonance.


