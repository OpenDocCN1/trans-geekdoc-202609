- pgno: 197
  md: '# Deep Learning for Hate Speech and Offensive Language Detection


    is an efficient process that generates highly accurate results. However, there
    are certain challenges that are involved in employing these automated tools.24
    These challenges may be inherently present due to the nature of the system or
    may arise from associated circumstances.


    Most common challenges encountered while using deep learning methods for the detection
    of HSOL are as follows.


    # 9.6.1 Conflating Speech with Offensive Language


    While "hate speech" and "offensive language" differ in theoretical terms, many
    studies and technologies tend to conflate the completely different types of content.
    Hate speech corresponds to offensive language, but all offensive content may not
    necessarily correspond to hate speech. For example, words like n**, b**ch and
    h**e are used in everyday conversations, rap songs and movies. These words, though
    offensive, cannot be classified as elements of hate speech. Conflating hate speech
    with offensive language or vice-versa, as a single entity, may give false positives
    by hate speech detector tools and classifiers the overall results may not be accurate.
    Hence, it is essential to develop and calibrate existing and new systems by incorporating
    algorithms that qualitatively differentiate between HSOL.


    # 9.6.2 Implicit Biases in Data-driven Systems


    Data-driven systems are vulnerable to a huge number of inherent biases due to
    their automatic working and lack of manual checks and balances. A few implicit
    biases in deep learning data-driven systems are:


    +   Sampling/selection bias – When the sample size of available data is not adequate,
    it cannot qualify as truly representative of the entire population. As a result,
    there can be misinterpretation of the results obtained.

    Overfitting/underfitting bias – Feeding large amount of inputs to the system results
    in automated learning from noise and useless data entries as well. This results
    in inefficient working of the system due to background noise and is called overfitting.
    Contrarily, when fewer data entries are fed to the system, accurate results are
    not obtained. Such a case is known as underfitting.

    Measurement bias – Measurement bias occurs when the system is fed with data that
    has quantitative inaccuracies, that is, there are inaccuracies related to measurements
    and assessments.

    Recall bias – Also known as false-positive bias, this bias occurs due to wrongful
    and inconsistent tagging of subjective information. Hence, the information may
    include more positives than the actual'
  merge: -1
  img_proc: true
- pgno: 198
  md: '5. Exclusion bias – Before data is fed to the system, it is subject to a preprocessing
    stage. This includes removal of unnecessary links, URLs, names, null values, etc.
    However, sometimes, useful information may also be filtered out and excluded from
    the final dataset. This may also lead to under-representation of excluded data.


    6. Racial bias – Racial or demographic bias occurs when the data is biased towards
    a certain demographic, such as a race or a community. Such a data is biased to
    identify that particular demographic and may not be efficient in identification
    of other demographics or races.


    Deep learning tools also suffer from inherent biases and no single system can
    help in identification of HSOL with 100% accuracy. When these biases get amplified
    over time, it starts reflecting not just in the output but in the society.


    # 9.6.3 Biases in Datasets and Embeddings


    In general terms, bias is defined as a prejudice for or against a person, group,
    idea or thing – particularly expressed in an unfair way. Word embeddings and datasets
    in deep learning models are fed upon general language data, which may include
    gender-based biases, discriminatory content, personal point of view, etc. Hence,
    there are chances that these biases may, subtly or blatantly, be expressed in
    the embeddings and datasets also. Such biases may result in overlooking of some
    HSOL content and the results thus obtained may not reflect true numbers.


    # 9.6.4 Availability and Inadequacy of Datasets


    In the previous sections we have studied about the different datasets that have
    been developed for deep learning tools. However, not all datasets are publicly
    available. This significantly hinders research in the advancement of deep learning
    tools. Also, datasets are inadequate contain sufficient repository of words for
    a comprehensive analysis. Most datasets developed till date have inputs from tweets,
    while the other public forums have been largely excluded. Coupled to this, here
    are multiple regional languages for which datasets are not yet developed which
    leaves a large percentage of content unregulated.


    # 9.6.5 Rise of Adversarial Content


    With a magnificent rise in the number of active internet users across the globe,
