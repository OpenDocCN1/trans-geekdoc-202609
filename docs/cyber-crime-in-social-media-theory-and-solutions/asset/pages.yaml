    # 2.3 Objectives of the Study


    The present study comprises the following two broad research objectives:


    +   1. The study of the level of awareness related to cybercrime with the usage
    of various social media platforms in India.

    2. To identify the congruence and divergence in the perception of various sociodemographic
    factors like age, gender, family income, usage rate, locale (urban and rural),
    education level, and so on, among youth concerning their awareness of fraudulent
    practices on social media platforms.


    # 2.4 Hypotheses of the Study


    The null hypotheses of the study based on research objectives are stated as under:


    +   H0₁: Opinions of different age groups of youth do not differ across the dimension
    of information, experience, and cybercrime awareness.

    H0_₂: Opinions of male and female youth do not differ across the dimension of
    information, experience, and cybercrime awareness.'
