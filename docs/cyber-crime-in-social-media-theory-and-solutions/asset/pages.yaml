    # 6.4.1 Proposed Approach


    Proposed CNN is shown in Figure 6.5 to classify the comment is bullying or not.
    At the first step, we remove all stopwords from the comments which are not too
    informative for detection of bullying event. Our model uses different embeddings:
    One-hot, pre-trained GloVe [22], and FastText [23] embeddings. To project each
    word into a vector space, we used 100 and 300 embedding layer dimensions for One-hot
    embedding and GloVe and FastText pre-trained embedding, respectively. Then we
    used one-dimensional Convolution (Conv 1D) layers to capture most meaningful information
    and single-dimensional global max pooling layer to capture higher-level features.
    Number of filters are used as 8, 16, and 64 for first, second, and third layer
    of convolution. The size of the filter is 4 and the window size of the max-pooling
    is also 4 for the experiment.- We used the Rectified Linear Unit (ReLU) activation
    function in every hidden layer. Finally, we used the Sigmoid activation function
    at the fully connected layer with two units, each corresponding to one of the
    classes. We used binary cross-entropy as a loss function and the Adam optimization
    algorithm for optimization. In order to test the quality of our model, we test
    80% of the'
