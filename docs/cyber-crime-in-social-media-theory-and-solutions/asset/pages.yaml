    # 7.3 Concept of Cybercrime


    The Internet is increasingly intertwined with modern life in the form of social
    communications, private and public services, and even critical infrastructure
    (Bergmann et al., 2018). Increasing technological integration has given rise to
    crimes that utilize or target computers, networks and systems, or the person utilizing
    these systems to emerge and be commonly dubbed cybercrimes (Chen et al., 2017;
    Reyns et al., 2016; Tsitsika et al., 2015). The phenomenon of technology-based
    crimes has been studied primarily in developed countries in North America and
    Europe, with some focusing on the meaning and nature of multiple forms of cybercrime
    (Rodriguez et al., 2017). The result of these studies has led to the development
