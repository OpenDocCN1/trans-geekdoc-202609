- pgno: 20
  md: '# Cybercrime in Social Media


    as the influence of others that causes us to comply in order to be liked and recognized
    by them (Deutsch and Gerard, 1955).


    **Social identity theory:** Social behavior (or intergroup behavior in a group)
    is impacted by the person''s character, goal/aim, and membership in a group/society.
    People seek to project a favorable picture of the groups to which they belong
    (Ashford and Loeb, 1989).


    **Availability cascade:** An availability cascade is a self-reinforcing process
    in which a certain attribute gains greater prominence in public discourse, increasing
    its availability to individuals and raising their likelihood to believe it and
    propagate it. For example, an availability cascade might arise when a news item
    sparks a wave of public conversation about a topic, such climate change, which
    leads to more stories and talks about the topic, culminating in a request for
    legislation to address the issue at hand (Zhou, 2022).


    **Confirmation bias:** Confirmation bias is a phenomenon that talks about the
    person''s propensity (i.e., habit of behaving in a particular way) to evaluate
    information by seeking out or interpreting in a way that validates or confirms
    one''s previous ideas/beliefs. This decision-making approach is sometimes unwanted
    and in the result of contradictory facts. Existing beliefs of a person revealed
    in the scenario of expectations and predictions before events. In case of an event,
    which is very necessary, or self-relevant, people try to find evidences to support
    their own opinions (Nickerson, 1998).


    **Desirability bias:** The propensity of survey respondents to answer questions
    in a way that will be seen by others is referred to as social-desirability bias.
    It might take the form of exaggerating positive conduct while downplaying negative
    or undesired behavior (Fisher, 1993).


    **Overconfidence effect:** The overconfidence effect is a bias in which an individual''s
    subjective confidence in his/her judgments is consistently higher/larger than
    their objective correctness, specifically when confidence is strong (Dunning et
    al., 1990).


    **Prospect theory:** According to prospect theory, decisions are more based on
    the rewards that people perceive rather losses. People observe the gains and losses
    differently.

    The main notion of the loss-aversion hypothesis is that if an individual is confronted
    with two alternatives, one presenting potential profits and the other presenting
    potential losses, the former option will be chosen” (Kahneman and Tversky, 2013b).


    **Contrast effect:** The contrast effect is a magnifying or dimming of perception
    caused by earlier exposure to something of lesser or better quality with the same
    basic qualities (Hovland et al., 1957).


    **Valence effect:** The valence effect of prediction refers to people''s tendency
    to overestimate the chance of nice happenings rather than terrible happenings.
    Valence refers to an object''s positive or negative emotional energy (Frijda,
    1986).'
