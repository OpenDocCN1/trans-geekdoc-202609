    # 12.3 Transformers with Attention Mechanism


    The components used by the attention mechanism in transformers are:


    +   1. $vand q$ denote the vectors of dimension, $D_v$ the queries and keys.

    2. $V$ denotes a vector of each dimension, $D_v$, contains the values.

    3. $Q, K$ and $V$ denote matrices query, keys and values.

    4. $Q^Z, Z^K$ and $Z^V$ represent projection matrices used in generating different
    subspace representations of the query, key and value matrices.

    5. $Z^O$ denotes a projection matrix for the multi-head output.


    The output of the transformer is weighted sum of values, where the weights are
    computed by a compatibility function of query $Q$, a mapping to a set of key value
    pairs $V$. This mapping is connected to the output $O$ which is an output of attention
    mechanism.


