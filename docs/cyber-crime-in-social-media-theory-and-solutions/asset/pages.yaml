  md: '# Fundamental Theories Behind the Detection of Fake News and Rumors


    Automatic fact-checking has two phases: (i) KB/KG construction and (ii) fact-checking
    (that is comparison of the data need-to-be-verified with the existing KB).


    To build a KB/KG, open web as “facts”, which is used as knowledge, must be processed
    further. Knowledge extraction or relation extraction are common terms used to
    describe this technique. Single-source and multi-source (open-source) knowledge
    extraction are two types of knowledge extraction. Single-source information extraction
    is generally efficient, although it frequently results in inadequate knowledge.
    Knowledge extraction from several sources combines all those knowledge is why
    it is less efficient than knowledge extraction from single-source. However, it
    is resulting in more complete knowledge. The retrieved raw facts must be cleaned
    up and finalized by resolving duplication, invalidity, conflicts, un (for credibility),
    and incompleteness.


    One can use large-scale, for example, YAGO, Freebase, NELL, PATTY, DBpedia, DeepDive,
    and Knowledge Vault, KB in place of constructing a new KG from scratch.


    We first convert the to-be-verified news/information in the format of SPO triples.
    We then compare these SPO triples with the facts to determine the validity of
    news stories (i.e., true knowledge). We may plausibly believe that the current
    triples in a KB (KG) represent all facts but it may be incomplete. KBs are ideal
    for supplying true values/information to detect news facts. Non-existing triples,
    on the other hand, refer to on assumptions such as (i) if it is not found in the
    KB, then it is false closed-world; (ii) if it is not found in the KB, then it
    will be treated as unknown (true or false) knowledge, (iii) if it is not found,
    then it is predicted/determined by some rules (probabilistically), referred as
    local closed-world.


    In general


    There are several unresolved difficulties and research opportunities. It has been
    proven that false news travels quicker than accurate news, emphasizing the significance
    of quick fact-checking in order to discover fake news early. Building KBs containing
    as many facts as feasible is the focus of current research (Zhou and Zafarani,
    2020).'
