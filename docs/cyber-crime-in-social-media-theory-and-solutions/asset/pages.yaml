    Likewise, vectors for “Queen” and “Woman” have been placed closely on the embedding,
    representing close relationship between the two groups.


    # 9.4.3.1 Prediction-based Embeddings (word2vec)


    In the prediction-based embeddings, word vectors are formed by improving the predictive
    ability between target word and context word, that is, through minimising the
    loss between target and context word. The most common prediction-based embedding
    is word2vec. This is one of the most recently developed word embedding models.
    It has been devised by the Google research team.* It has a massive corpus above
    a billion words.


    # 9.4.3.2 Count-based Embeddings (GloVe)


    In the count-based method, semantic relationships between words are established
    by formulating a co-occurrence frequency matrix. Words are classified into a matrix
    based on the frequency with which they occur together. The Global Vector for Word
    Representation (GloVe) embedding, developed by Pennington et al.,* is a type of
    count-based embedding. Count-based embeddings need larger storage capacity than
    prediction-based models and hence the latter is preferred in HSOL detection tools.'
