    **Information manipulation theory:** According to information manipulation theory,
    while misleading others, people play or manipulate significant information in
    a variety of ways inside their discourse. According to information manipulation
    theory, fraudulent signals reflect falsely because they break the principles that
    regulate conversational exchanges secretly. Given that conversational interactants
