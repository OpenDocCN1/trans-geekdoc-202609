    present the dataset with improvements (https://github.com/T-I-P/Hope-Speech-Detection-on-Social-Media-Platforms).


    The main contribution of this work focuses on:


    +   i. Dealing with anomalies in the original dataset by introducing a new label
    named “Neutral speech”.


    +   ii. Validating the updated dataset on various classifiers like Naive Bayes,
    Logistic Regression, Support Vector Machine (SVM), and a transformer learning
    technique such as Bidirectional Encoder Representations from BERT.


    +   iii. The proposed dataset could pave the path for further research endeavours.
    This dataset can also be used on platforms like YouTube, Facebook, Instagram,
    or for content moderation.


    The rest of the chapter is organized in the following manner: Section 4.2 briefly
    describes the related works in the area. Section 4.3 contains information about
    the dataset and the methods used for pre-processing and classification. Further,
    Section 4.4 discusses the results obtained, while Section 4.5 includes a Conclusion
    and Future Work.


    # 4.2 Related Works


    More recently, the identification of Hope Speech on social media has caught the
    research community’s interest. Previously, most studies on hate speech and fake
    news identification had been published, but Hope Speech incorporates all of these
    into a single spectrum. Hope Speech is something that spreads positivity, motivates
    others and raises hopes for a better tomorrow (Chakravarthi and Muralidaran, 2021).
    The antithesis of this is a Non-Hope Speech. Because Hope Speech identification
    in social media websites is a relatively new topic with few studies focusing on
    it, this section will address all studies relating to toxic content identification
    on social media websites. Several strategies for identifying harmful social media
    content have been discussed.


    # 4.2.1 Fake News Detection


    Detecting fake news has been part of various research in the past (Castillo et
    al., 2011). Biradar et al. (2022) discovered that lexical parameters such as word
    count, number of different words, and characters can help identify fake'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Cybercrime in Social Media


    content in a Twitter dataset. According to several types of research, in addition
    to linguistic features, syntactic features such as the number of keywords, sentiment
    score, polarity, and POS tagging are also helpful in distinguishing false news
    from authentic news (Hassan et al., 2010). Some studies have attempted to distinguish
    fake news by examining social aspects such as unique features and group attributes,
    along with individual characteristics such as "age", "sex", and "occupation".
    It also includes online behaviours such as "number of comments" and "number of
    followers" (Castillo et al., 2011). People have recently attempted to investigate
    propagation-based features for detecting fake news. Shu et al. (2020) created
    a hierarchical distribution network for fake and legitimate news and conducted
    a rigorous evaluation of structural, temporal, and linguistic features to identify
    fake news.


    # 4.2.2 Hate Speech Detection


    Another category of research focuses on hate speech identification (Biradar et
    al., 2021). Biradar and Saumya (2022) developed a translation-based approach for
    detecting objectionable text in Hindi-English coding mode Data researchers have
    also experimented with language models such as fine-tuned BERT to detect hate
    news (Mozafari et al., 2019). Chopra et al. (2020) explored how targeted hate
    embeddings with social-network-based characteristics outperform existing state-of-the-art
    models. Santosh and Arvind (2019) created a sub-word long short-term memory (LSTM)
    and hierarchical LSTM model with attention. Roy et al. (2020) used deep convolutional
    neural network and LSTM network to detect hate in Twitter data. Hate speech detection
    has also been extended to Dravidian languages by (Roy et al., 2022) using transformer-based
    models like m-BERT, distillBERT, and xlm-Rota that performed better than the ML
    and DL-based models.


    # 4.2.3 Hope Speech Detection


    In recent years, Hope Speech has replaced the aforementioned methodology. Chakravarthi
    (2020) made the first such effort; they created a Hope dataset in multiple languages,
    including Tamil, Malayalam, and English, as part of a shared task to support the
    study of positive content identification through social media. According to Dowlagar
    and Mamidi (2021) the transfer learning model mBERT combined with Convolution
    Neural Network was used to identify Hope Speech in English dataset. Researchers
    have focused on various ML and DL models and their ensemble settings, and ensemble
    settings have been discovered to provide better results for Hope Speech recognition
    (Saumya and Mishra, 2021). Roy et al. (2022) used ML techniques like Logistic
    Regression, Random Forest, Naïve Bayes, and Extreme Gradient Boosting. Kumar et
    al. (2022) used word-level tf-idf and character-level tf-idf features with an
    ensemble model to classify Hope


