    (BERT). Several studies investigated BERT performance in hate speech detect-

    (BERT). Several studies investigated BERT performance in hate speech detection,
    with nearly all authors concluding that the BERT model was superior to other deep
    learning models [44–46]. For example, Rasinghe et al. [47] compared BERT to FastText,
    CNN, and LSTM. Similarly, Saleh Alatawi et al. [45] compared BERT to BiLSTM and
    LSTM, and BERT showed a significant performance increase. Even in all multilingual
    tasks [48]. Some research compared different BERT models and discovered that combining
    two BERT models performs better than a single pre-trained BERT model [49]. In
    a recent competition for hate speech detection, BERT was used by seven of the
    ten best-performing models in a subtask.


