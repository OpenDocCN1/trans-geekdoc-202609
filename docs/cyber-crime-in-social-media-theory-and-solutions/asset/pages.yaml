    **Feature extraction:** Using the identified streamed file features like power,
    pitch, and vocal tract configuration are extracted.

    in addition, extensive feature extraction methods have been proposed and used
    successfully for forensic speech processing and analysis. Linear Predictive Coding
    (LPC), Linear Prediction Cepstral Coefficients (LPCC), and Mel Frequency Cepstral
    Coefficients (MFCC) are the three most popular feature extraction methods [5].
    The following requirements must be met by extracted features:


    +   - Easy to measure and unique

    - Should not be susceptible to mimicry

    - Adaptability to different speaking environment

    - Features should remain stable with changing time


    **Analysis:** After feature extraction, system analysis is performed with reference
    to speaker recognition, speech enhancement, and speech synthesis. Finally, the
    genuine output of suspected voice for further evaluation and producing in the
    court is generated.

    Three major tasks like speaker recognition, speech enhancement, and synthesis
    are discussed in detail in the following subsections.


    # 10.2.1 Speaker Recognition


    Speaker recognition is the method used in forensics to determine whether an individual''s
    voice is the source of a questioned voice recording.


    The block diagram of speaker recognition for forensics is analytically represented
    in Figure 10.2 matching of the suspected speech with questioned speech sample
    is realized in training and testing phase.


    In the training phase collection of suspected speech is maintained as a reference
    database. It is used for feature extraction and modelling. Various modelling approaches
    like phonetic, acoustic, and language modelling are used.


    The features are extracted from the questioned speech sample during the testing
    phase. They are then matched with a knowledge database. Matching techniques that
    are commonly used include the Gaussian mixture model, Hidden Markov Model, Vector
    Quantization, Support Vector Machine, Fuzzy logic, Artificial Neural Networks,
    and so on. The matching determines whether the questioned speech sample belongs
    to the suspect or not.


    The main scope of speaker recognition for forensics is the identification of forensic
    speakers. There is a need to recognize the suspects based on voice,'
