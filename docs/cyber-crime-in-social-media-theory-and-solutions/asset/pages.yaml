    # 5.3.2 Research on Hate Speech and Offensive Language Identification in Other
    Language


    While most hate speech identification approaches were proposed for English, other
    systems have been developed for hate speech detection in other languages [72,
    73, 76]. Datasets for other languages have been made available for research. The
    availability of these datasets and shared tasks organized on hate speech identification
    tasks of these languages contribute to a rich literature.


    In Arabic, Abinazadeh et al. [72] used a statistical learning approach to detect
    abusive language on Twitter. Haidar et al. [73] studied cyberbullying in Arabic
    tweets. Albadi et al. [74] investigated religious hate in Arabic tweets. Others
    hate speech in Arabic Twitter using CNN, GRU, CNN + GRU, and BERT, where the CNN-based
    model provides a better result. Duwairi et al. [76] use CNN, CNN-LSTM, and biLSTM-CNN
    for hate speech detection in Arabic text. In their experiment, CNN-LSTMCNN give
    a better result in the binary classification task. Both CNN and biLSTM-CNN give
    the biLSTM-CNN give a better result in a multi-class classification task.


    Accurately identifying hate speech in Bengali is a difficult task. Furthermore,
    there are only a few datasets on Bengali hate speech, which makes the task more
    difficult. Morfim et al. [77] presented a benchmark dataset for the Bengali language.
    Moreover, their experimentation on the data concluded with SVM-based model providing
    the best accuracy. Ishmam and Sharmin [78] presented another dataset for Bengali,
    and experiments on the data concluded with GRU-based model providing the best
    accuracy of 70%. Karim et al. [79] proposed FastText embeddings with multilingual
    Conv-LSTM architecture. Recently, Karim et al. [80] proposed another approach
    using BERT, which proves to be the best among other models.


    GermEval Shared Task on the identification of offensive language, for example,
    deals with detecting offensive comments in a set of German tweets. Participants
    employ a variety of classifiers, ranging from feature-based supervised learning
    [81] to more recent deep learning methods [82-85].'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Cybercrime in Social Media


    Deep learning was used by the majority of the top-performing systems in shared
    tasks. For example, Stammbach et al. [82] used Recurrent Neural Networks and CNNs
    to produce high-scoring results, whereas other systems use transfer learning [83,
    84]. The use of ensemble classification appears to improve classification approaches
    [81, 82] frequently.


    Researchers across the globe have developed corpora for speech in their native
    languages. Mosie and Wang [86] used traditional feature-based supervised learning,
    and Tesfaye and Kakeba [87] used LSTM for speech detection in the Amharic language.
    The authors in [88, 89] used traditional machine learning models and deep learning
    models to identify speech in the Greek language. The authors in [90] used the
    conventional machine learning model, and the authors in [91, 92] used deep learning
    models to identify speech in the Indonesian language. Laver et al. [93] proposed
    a BERT-based deep learning model to identify speech in Italian language corpora.
    Velankar et al. [94] proposed another BERT-based deep learning model to identify
    speech in Marathi language corpora. Firmino et al. [95] used a cross-lingual learning-based
    model for the identification of speech in Portuguese language corpora. Pelicon
    et al. [96] proposed a BERT-based deep learning model to identify speech in the
    Slovenian language.


    Plaza-del-Arco et al. [97] compared several pre-trained language models such as
    BERT, XLM, and BETO to identify speech in Spanish language corpora. Özberk and
    Ciceklik [98] proposed a BERT-based deep learning model to identify speech in
    the Turkish language dataset. De et al. [99] used a bi-LSTM-based deep learning
    model to identify speech in Vietnamese language corpora.


