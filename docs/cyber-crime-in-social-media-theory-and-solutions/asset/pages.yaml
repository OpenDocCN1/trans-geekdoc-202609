    been around for a long time in the public domain and several countries, including
    India, have formulated laws that prevent or censor aggressive content. In United
    States, United Kingdom, Canada and France, content that falls under the definition
    of hate speech is prohibited and convicts may lay under to several years in jail
    or face penalties. Social media giants, like Meta and Twitter, have also faced
    backlash for not developing appropriate filtering and accountability measures
    for such content.


    In India, hate speech is prohibited by several sections of the IPC, CrPC, IT Act
    and other laws imposing restrictions on freedom of expression. Some of these provisions
    are:


    +   Section 95 of the Code of Criminal Procedure provides the government to declare
    any publication(s) as “forfeited” if the “publication” appears to the State Government
    to contain any matter of which is punishable under Section 124A or Section 153A
    or Section 153B or Section 292 or Section 293 or Section 295A of the Indian Penal
    Code.


    +   Section 153A of IPC says that whoever (a) by words, either spoken or written,
    or by visible representations or otherwise, promotes or attempts to promote, on
    grounds of religion, place of birth, residence, caste or community or any other
    group whatsoever, disharmony or feelings of enmity, hatred or ill-will between
    religious, racial, language groups or castes or communities, or (b) commits any
    act which is prejudicial to the maintenance of harmony between different religious,
    racial, language or regional groups or castes or communities, and disturbs or
    is likely to disturb the public tranquillity, etc. shall be punished with imprisonment
    which may extend to three years, or with fine, or with both.


    +   Section 295A of the IPC reads that whoever, with deliberate and malicious
    intention of outrage the religious feelings of any class of [citizens of India],
    [by words, either spoken or written, or by visible representations or otherwise],
    insults or attempts to insult the religion or the religious beliefs of that class,
    shall be punished with imprisonment of either description for a class, which may
    extend to [three years], or with fine, or with both.


    +   Article 19 of the constitution allows government to put curbs on free speech
    on several grounds, including decency and morality and public order, inter-alia.'
