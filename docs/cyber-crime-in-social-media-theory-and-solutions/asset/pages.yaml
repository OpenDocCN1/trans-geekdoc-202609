    # 1.6 Results and Discussion


    This book chapter discusses the potential research work and highlights the key
    points. The fundamental theories are discussed across multiple disciplines to
    promote interdisciplinary research in the detection and intervention of fake news.
    Social and psychological factors such as validity effect, confirmation bias, selective
    exposure, desirability bias, bandwagon effect, and on are discussed in detail.
    Various definitions and terminologies related to fake news are explained. Multiple
    strategies, such as knowledge-based detection, style-based, source-based, and
    propagation pattern-based, are explained for manual and automatic detection. This
    article will facilitate cooperative research among experts of information science,
    social science, political science, history, and journalism.


