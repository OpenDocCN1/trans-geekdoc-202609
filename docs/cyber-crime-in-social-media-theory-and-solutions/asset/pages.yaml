    & Ford, 2006). Halder and Jaashankar (2011) presented a definition of the effects
    on the individual, which is directly or indirectly by an offender using modern
    telecommunications networks. This definition suggests a focus on the utilization
    of a telecommunication network with a human target and removes the network itself
