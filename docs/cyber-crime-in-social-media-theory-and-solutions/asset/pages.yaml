  md: 'Deep Learning for Hate Speech and Offensive Language Detection 173


    # 9.4 Deep Learning Detection Methods


    Deep learning and neural network architectures have expanded the course of artificial
    intelligence. In general terms, deep learning can be considered a subset of machine
    learning that eliminates human intervention in or feature extraction and automates
    the entire process. Such approaches a set of labelled data that can be employed
    to train the model. This automation helps in fast evaluation of large datasets,
    which is not possible with conventional methods. For example, if pictures of flowers
    are fed to a system, a human expert would determine their specific characteristics
    to distinguish flowers as “rose,” “lily” and “sunflower” in conventional methods.
    On the contrary, a deep learning model would automatically identify distinguishing
    or differentiating qualities that would classify different flowers in the respective
    categories without human intervention.


    Deep learning models use unstructured or unlabelled data and automatically determine
    characteristics. Deep models also possess the potential to identify patterns and
    cluster-related data together. In the above example, if multiple pictures of roses,
    lilies and sunflowers are given as input to a deep learning system, it would categorise
    them into distinct categories based on common features.


    Deep learning models rely on the input feature representations. Therefore, a major
    prerequisite for an efficient deep learning model is the input of large number
    of data points. The more the number of data points, the higher is the accuracy
    and precision of the system. A conventional system, on the other hand, relies
    on less data entries, since it is fed with characteristics manually.


    # 9.4.1 Neural Network Architectures


    Neural networks, also called artificial neural networks (ANNs) or simulated neural
    networks, form the backbone of deep learning model. These are artificial networks
    that mimic the neurological system of the human brain in essence. Neural networks
    consist of artificial elements called neurons. These neurons are capable of taking
    multiple inputs to produce a single output.


    Hence, neural networks convert the range of inputs provided to them into useful,
    meaningful output. Different neurons in an artificial neuron network are interconnected
    and work in cohesion.


    A neural network consists of multiple layers:


    +   1. Input layer


    The input layer is the first layer of an ANN. It consists of several data entry
    points from the various inputs that are entered into the system. Data fed into
    the input layer is raw, unclassified and unstructured.'
