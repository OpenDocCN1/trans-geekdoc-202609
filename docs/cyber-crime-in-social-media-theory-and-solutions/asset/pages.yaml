    The extant literature presents an array of approaches to the classification of
    cybercrimes; however, the underlying mechanism is generally based on categorizing
    the crimes according to the role/dependency/importance of technology in the execution
    of the crime. This is important as it demonstrates a recurring theme of nature’s
    technology to the nature of specific cybercrimes. Given the dominance of this
    style of classification, it is important to test its empirically to determine
    whether the theoretical assumption holds true to actual data. To create a deeper
    understanding of the applicability of the RAT toward cybercrime, crimes at varying
    ends of the spectrum of cybertechnology involvement should be examined and compared.
    A classification method that differentiates cybercrime based on the degree of
    involvement would be essential in such a study. This classification framework
    would create a comprehensive base to distinguish between the varying involvement
    of technology or closeness to traditional crime with specific groups of cybercrimes.
    Such an application of classifications can potentially show if traditional theory
    has differing abilities in predicting crimes with varying relationships to traditional
    crimes. This can help answer the question not only regarding the applicability
    of traditional theory but cybercrime’s relationship with traditional crime. Further,
    the empirical assessment of existing taxonomy can succeed in refining existing
    taxonomies to develop a single unified taxonomy. Such taxonomy could benefit a
    wide range of stakeholders in areas such as assessing risk, calculating the true
    cost of cybercrime, implementing statistical analysis in understanding existing
    and emerging trends, streamlining the allocation of duties and resources at the
    organizational and national levels, and development of theories to explain complex
    phenomena related to cybercrime in general and in specific classes (Agrafiototis
    et al., 2018; Land et al., 2013).


