  md: '# Deep Learning for Hate Speech and Offensive Language Detection


    # 9.4.3.3 Bidirectional Encoder Representations from Transformers (BERT)


    BERT is the most recently developed state-of-the-art word embedding that provides
    significant improvement over the word2vec GloVe embeddings.¹10 It utilises a bidirectional
    representation of words, extracting contexts from both left and right extractions.
    Hence, the embedding produced has better representations than the other static
    embeddings.


    # 9.4.4 Classifiers


    Classification is a process in machine learning in which the given data points
    are arranged into classes. Classification in deep learning may include classification
    of test data as hate and non-hate speech, offensive and non-offensive and hate
    speech, offensive and neither. Multiple algorithms have been devised for the classification
    process that also uses in speech detection systems. The most commonly used classifiers
    are as follows.¹11


    # 9.4.4.1 Naïve Bayes


    This classifier is built upon the Bayes theorem. It is a simple algorithm that
    is employed for large sets and provides good results. It is a probability-based
    classifier which calculates the likelihood of each data entry falling under one
    of the classes.


    # 9.4.4.2 Support Vector Machine (SVM)


    SVMs are predominantly used for classification, though they can also be used for
    regression purposes. The SVM algorithm attempts to establish an optimum boundary
    line for classification so that the data points can be readily classified into
    their respective classes. Such an optimum boundary is called hyperplane. T is
    a three-dimensional classification model.


    # 9.4.4.3 Logistic Regression


    It is the most extensively used classification algorithm in machine learning.
    It predicts a categorical variable from the complete set of independent variables.
    However, this algorithm can only be used when data is binary in nature. Hence,
    its disadvantage is its inability to be used for non-binary datasets.


    # 9.4.4.4 Random Forest


    It is a multi-use classifier that is used for both categorisation and regression.
    Also known as meta-estimator, it generates an average of multiple decision trees
    to produce more accurate results.'
