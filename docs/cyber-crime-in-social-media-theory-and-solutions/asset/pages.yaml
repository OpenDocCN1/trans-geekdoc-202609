    # 2.1 Introduction


    Cybercrime is defined as any illegal activity using a computer or network. While
    most cybercrimes are motivated by a desire to gain money for the perpetrators,
    some are motivated to hurt or destroy systems or equipment. Others use computers
    or networks to spread viruses, illicit data, images, or other content. Some cybercrime
    targets computers to infect them with viruses, which then spread to other computers,
    and in some instances, networks have a monetary cost. Ransomware assaults, email
    and internet fraud, identity theft, and attempts to steal bank accounts, credit
    cards, or other payment card information are all examples of cybercrime.


    DOI: 10.1201/9781003304180-2'
