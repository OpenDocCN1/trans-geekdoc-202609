    # 3.8 Conclusion


    Emotion detection from text is one of the well-known research domains in NLP and
    attracted many researchers. It has applications across several domains and hence
    becomes an important area of research. Due to a large number of social posts,
    handling the users'' posts to predict emotion becomes challenging. To detect the
    emotion from text, machine learning models are utilized in this. SVM, Decision
    Tree, and Random Forest classifier models were trained and tested. The model achieved
    considerable performance with an accuracy over 83%. To improve the performance,
    Random Forest with tuned parameter values are trained and then tested. The model
    obtained an accuracy value of 86.20% and is an increment in the model accuracy
    of about 3% and outperforms existing models. In the future, feature engineering
    and rule-based approaches can be applied that might perform better for emotion
    recognition. Also, the model can be tested for multilingual dataset by applying
    deep learning algorithms.


