    # 3.7 Results


    The performance of the proposed model is measured in terms of Precision, Recall,
    F-Score, and Accuracy [2, 3].


    Accuracy: The proportion of cases that are correctly classified over all cases
    is called accuracy.


    ```

    $Accuracy = \frac{TP + TN}{TP + TN + FP + FN} \quad (3.1)$

    ```


    Precision: The proportion of positive cases that are correctly identified positive
    over all cases classed as positive is how precision is measured.


    ```

    $Precision = \frac{TP}{TP + FP} \quad (3.2)$

    ```


    Recall: The percentage of positive instances that are accurately identified over
    all real positive cases is known as recall.


    ```

    $Recall = \frac{TP}{TP + FN} \quad (3.3)$

    ```


    F1-Score: It is a measure that combines precision and recall, so on F1-Score is
    the harmonic mean of precision and recall values for a classification problem.


    ```

    $F1 - Score = 2 * \frac{Precision Precision Recall}{Precision + Recall} \quad
    (3.4)$

    ```


