  md: '# 10.5.1 Cyber Security in Social Media


    The evolution of social media has resulted in a new communication and interaction
    paradigm. It has become an indispensable part of our social lives, enabling us
    to communicate with friends, family, co-workers, and others.


    We have seen how social media platforms like Facebook, Twitter, and WhatsApp have
    changed the way we use the internet for both personal and professional reasons.


    Despite security settings on social media platforms, people with malicious intent
    can gain access to sensitive personal information. As a result, we must comprehend
    social media cyber security, which directly affects how we use social media networks.


    Cyber security refers to the applied sciences and strategies that are designed
    to shield computers, networks, programmes and records from attack, unauthorized
    access, change or destruction [11].


    Cyber security is a serious issue that must be addressed. Any threats to a person''s
    social media account should be addressed as soon as possible, with the user''s
    safety in mind. Ignore and block the sender if you suspect you''ve received an
    email with malicious links and attachments. To ensure a safe working environment,
    companies should also invest in proper educational for their employees and consider
    hiring the services of brand protection companies.


    # 10.5.1.1 Social Media Cyber Security Measures That Work


    The measures listed below can help ensure social media cyber security [11]:


    +   - Social media users should use caution when sharing information with other
    users to protect their privacy and security. Customers can customize their privacy
    settings on most social media websites. They can choose who receives their information,
    such as "friends," "friends of friends" or "everyone," similar to how Facebook
    works.

    - Users must consider the following factors as effective steps to ensure digital
    communication, particularly on social media.

    - Keep non-public information private.

    - Consider earlier than you click: download legally and safely.

    - Buyers beware: shop with warning and caution.

