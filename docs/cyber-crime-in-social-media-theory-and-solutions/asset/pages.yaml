    - Malicious Codes, for example, malware and viruses

    - Interruption of Services, for example, distributed denial of service² (DDoS)

    - Theft or Misuse of Services, for example, theft of someone’s online account


    +   Type II – “...crimes where the computer, computer network, or electronic device
    is the tool used to commit or facilitate the crime” (Alkaebi et al., 2010)

    - Content Violation Offences, for example, child pornography and IP Offences

    - The unauthorized alteration of data, or software for personal or organizational
