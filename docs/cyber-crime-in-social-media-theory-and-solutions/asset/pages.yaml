    # 7.1 Introduction


    Technology over the last several decades has become integrated into every aspect
    of life revolutionizing the way we communicate, bank, shop, and how we control
    aspects of critical infrastructure (Bossler & Berenblum, 2019; Bossler & Holt,
    2014; Sarre et al., 2018). The Digital Economy Report 2019 also suggests that
