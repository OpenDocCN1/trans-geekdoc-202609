  md: '# Deep Learning for Hate Speech and Offensive Language Detection


    every minute, the task of filtering hateful and offensive content becomes tedious.
    Existing deep learning systems of identification and classification cannot keep
    pace with the enormous number of tweets, posts and blogs that are produced. As
    a result, there are huge delays between generation of spiteful content and its
    detection, which has potential to cause distress to both individuals and society
    at large. Social media giants like Meta and Twitter have often been condemned
    in the recent times for not investing in the development comprehensive and fast
    tools for HSOL detection.


    # 9.6.6 Potential Sources of Privacy Violations


    The extraction of test data from social networking sites like Twitter and YouTube
    is associated with privacy concerns. This data is collected and used without the
    permission of the person who created the content and thus can amount to privacy
    violations. Also, the raw, unprocessed data that is collected contains information
    pertaining to the user like the username, profile and post URL, etc. This data
    is extremely sensitive and vulnerable to misuse by unauthorised person(s). It
    is important that we address privacy concerns and establish protocols for ensuring
    the integrity of personal information before using it to develop datasets and
    deep learning.


    # 9.6.7 Legal and Ideological Challenges


    Finally, detection of hate speech and its removal has been under legal scrutiny.
    Although the Indian constitution and several subsequent laws allow the government
    to curb the fundamental freedom of expression on certain grounds, these curbs
    have drawn criticism from certain groups as an infringement of freedom of speech
    and expression. The classification of content as hate speech and non-hate speech
    has also been debated as social media sites have been called out for suppressing
    certain views in the name of hate speech, whilst allowing counter views that also
    contained targeted content.


    # 9.6.8 Code-mixed Language


    Code-mixed language refers to a mix of two different languages, related or unrelated.
    Most users use a combination of two or more languages on social media platforms,
    for example, Hindi-English, Tamil-English, Hindi-Tamil, Tamil-Malayalam and so
    on. Identification of HSOL with conventional datasets, which contain database
    of words from a single language, may not be completely accurate for generating
    results for posts containing code-mixed language. Researchers have been working
    to develop code-mixed datasets for different languages, for instance, a dataset
    for Dravidian languages (Tamil and Malayalam) has been recently developed.25'
