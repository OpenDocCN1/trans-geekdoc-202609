    comprising sample sentences from the original dataset. Each sentence had to be
    categorized as Hope, Non-Hope, or a Neutral sentence. Upon receiving the responses,
    the mode (measure of central tendency) was calculated to give a label to all the
    sentences.


    # 4.3.5 Data Pre-Processing


    The dataset was cleaned up and pre-processed before model implementation. The
    following steps were employed for the same:


    +   1. Unwanted texts such as HTML decoding, @mention, URL links, punctuation,
    and so on were removed.


    +   2. All the words were converted to lowercase. This was done because the words
    “Everything”, “everything”, and “EVERYTHING” are treated as different words, although
    they mean the same.


    +   3. All the abbreviations and short forms of words were expanded using contraction
    mapping. For example, BLM was expanded to Black Lives Matter, coz to because,
    and so on. This was also done to ensure words with the same meaning are treated
    as the words.


    +   4. Tokenization is applied to this dataset where the sentences are broken
    into tokens, and stop words are removed.


    +   5. These tokens are lemmatized by converting the words to their root words.
    For example, total, totally, and totalized were converted into total.


    Apart from the regular contractions used in English (such as isn’t, don’t, haven’t,
    we’ve, and so on), we found many contractions that are generally used on social
    platforms. Table 4.3 shows some of the many contractions discovered.


    In addition to these, there are 99 more contractions found during relabelling
    of the dataset.'
