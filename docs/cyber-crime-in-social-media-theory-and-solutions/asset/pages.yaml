  md: '# A Doubled-Edged Sword Called Cyberspace 129


    techno-centric (Type I) and people-centric (Type II) (Gordon & Ford, 2006). In
    this model, Type I and Type II crimes are at the two extremes of a continuum that
    dichotomizes cybercrimes based on the degree of involvement of the cyber-component
    versus the people-component of the crime (Ibrahim, 2016). Closely related to the
    techno-centric and people-centric classifications are the classifications of cyber-enabled
    crime and cyber-dependent crime (McGuire & Dowling, 2013). Cyber-enabled crimes
    are crimes that can be committed without the use of cybertechnology, that is,
    they are not dependent on cybertechnology and can be executed independently in
    the physical world, for example, stalking and bullying. While cyber-dependent
    crimes are those which can only be committed using cybertechnology such as computers
    or computer networks, for example, Hacking and Malware infection (Smith & Stamatakis,
    2021).


    Several other binary classifications exist, which are based on the degree of involvement
    of the cyber-component of the crime (Furnell, 2002; Koenig, 2002; Lewis, 2004;
    Wilson, 2008). For example, the Department of Foreign Affairs, Trade and Development¹,
    classifies crimes into two categories: crimes committed using computers and networks;
    and traditional crimes that are facilitated using computers (Ibrahim, 2016). While
    using the same designations of Type I and Type II as Gordon and Ford (2006), some
    researchers have also taken a slightly different approach to classification by
    basing theirs on the role of the computer in the crime (Alkaebi et al., 2010;
    Sarre et al., 2018). The two classifications and their subcategories are:


    +   Type I – “...crimes where the computer, computer network, or electronic device
