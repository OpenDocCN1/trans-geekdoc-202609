    and Non-Hope Speech. Junaida and Ajees (2021) have also worked with context-aware
    embeddings using RNN models. Finally, in addition to transformer models, a few
    researchers have focused on linguistic variables such as tf-idf and character
    N-grams, using classic ML algorithms such as LR and SVM to distinguish between
    Hope and Non-Hope Speech (Dave et al., 2021).


    # 4.2.4 Cyberbullying and Fake Profile Detection


    Detecting cyberbullying and fake profiles can also be considered harmful content
    detection. Roy et al. (2022a) have used an ensemble ML model to identify cyberbullying
    through various ML classifiers and voting-based ensemble learning. Roy et al.
    (2022b) have also used ML classifiers like Naive Bayes, Logistic Regression, and
    Random Forest to address the issue of cyberbullying.


    Fake accounts across various social media platforms are generally used for specific
    purposes. One such purpose is to target certain users to deliver harmful content
    to them. Roy and Chahar (2020) have summarized the recent technological advances
    to detect fake accounts and their challenges and limitations.


    # 4.3 Data and Methods


    # 4.3.1 Dataset Description


    The dataset (Chakravarthi) consists of data on recent topics of Equality, Diversity,
    and Inclusion, including women in STEM, LGBTQ, COVID-19, Black Lives Matter, United
    kingdom versus China, United States of America versus China from YouTube comments.
    The original dataset obtained from Hugging Face consists of three classes: hope,
