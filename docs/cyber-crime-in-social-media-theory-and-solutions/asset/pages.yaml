    in India were registered in 2017. Cyberbullying is the most unwanted and adverse
    effects of social web. It is an offensive, intentional act carried out by a group
    or individual, repeatedly and over time using electronic devices against a victim
    who cannot easily defend himself or herself [1]. Essentially, we are talking about
    events where teenagers use technology to identify, humiliate, haunt, or otherwise
    harm their peers. For example, online users post abusive, or offensive comments
    on social media. Repeated nasty comments about the personality, way of living,
    family, or cultural identity of a person and the circulation of unacceptable or
