    reputation, and the resulting loss of sales or employment (Nurse, 2018). Cybercrimes
    target systems, networks, or data to compromise their confidentiality, integrity,
    and availability, collectively referred to as the CIA Triad (Mohanty et al., 2018;
    Rouse, 2014; United Nations Office on Drugs'
