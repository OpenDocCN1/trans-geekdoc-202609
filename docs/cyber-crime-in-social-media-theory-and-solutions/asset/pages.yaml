    # 2.5 Methodology


    # 2.5.1 Primary Data and Sampling


    Population constitutes all the youth demographic across India. The sample includes
    the restrictive part of the population from where actual data collections were
    made. A total of 414 samples were drawn from the population pool with the purposive
    sampling method from different schools and universities in India. The inclusion
    criteria for selecting the sample covered age group between 13 and 25 years and
    education between 10th and post and graduate level. Data were collected between
