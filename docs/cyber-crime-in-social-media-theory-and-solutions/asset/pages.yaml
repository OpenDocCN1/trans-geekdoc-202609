  md: '# A Doubled-Edged Sword Called Cyberspace


    impact will increase. The intertwining of technology into our daily lives will
    make many activities and processes easier and increase opportunities, it will
    also increase the user’s vulnerability as their work, social life, entertainment,
    education, and finances are all connected to cyberspace. However, the ongoing
    issues with the conceptualization of cyberspace will likely continue to cause
    difficulties in estimating this form of criminality. This will not only potentially
    lead to an underestimation of the threat posed by cybercrime but foster the continued
    inconsistency of legislation across jurisdictions.


