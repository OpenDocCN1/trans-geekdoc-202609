    # 1.4.2.2 Machine Learning Approaches for Detection


    The detection of false information based on style features, both traditional machine
    learning and deep learning, is utilized.


    A collection of manually selected characteristics can be derived from news photos
    or text to represent news content. Machine learning models that use this format
    to determine news type (e.g., true or false) can be supervised, semi-supervised,
    or unsupervised. Style-based fake news detection has mostly depended on supervised
    approaches (i.e., classifiers). For example, style-based algorithms have relied
    on support vector machines, Random Forests, XGBoost, and others.


    When using a traditional machine learning framework to predict fake news, research
    findings suggest that non-latent features often give better result than latent
    features:


    +   (i) merging features across level give better result than single-level features,
    and (ii) (standardized) statistics of lexicons and rewrite (production rules)
    represent false information content style and perform better (but taking longer
    time for computation) compared to other feature groups.


    Convolutional neural networks (such as VGG-16/19), Text-CNN, Recurrent Neural
    Networks, Long Short-Term Memory Networks, Gated Recurrent Unit Networks, Bidirectional
