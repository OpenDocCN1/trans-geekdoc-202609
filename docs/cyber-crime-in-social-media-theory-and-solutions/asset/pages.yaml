  md: '# 9.7 Conclusion


    We have seen how the increased production of content with HSOL can be detrimental
    to individuals in general and society at large. Therefore, the detection of such
    content becomes highly important. Since the volumes of data generated are enormous,
    manual screening is not a viable option and automated systems must be employed
    for fast identification and accurate results. Various shallow and deep learning
    models have been developed in recent times, with deep learning methods proving
    significantly better than shallow methods of detection. Multiple arrays of datasets,
    embeddings and classifier algorithms have been developed and employed in deep
    learning models. However the inherent biases and several other challenges pose
    a need to build upon existing tools to devise better technologies that minimise
    biases and inaccuracies in results.


    Ongoing research in the area of deep learning for the detection of HSOL has proposed
    combinations of existing models, along with additional algorithms and concepts.
    These combinations have resulted in more accurate results than the conventional
