  md: '# A Doubled-Edged Sword Called Cyberspace


    various definitions for cybercrime being proposed by scholars (Gordon & Ford,
    2006; Rodriguez et al., 2017; Yar, 2006). However, confusion over the scope of
    cybercrime remains limited in its descriptive nature and only identifies an illicit
    activity related to ICT, which has led to a variety of criminal activities being
    classed as cybercrime (Jahankhani et al., 2014). The following paragraphs will
    introduce the concept of cybercrime by reviewing the various definitions and providing
    the reason for the variety.


    Cybercrime has no universally accepted definition; rather there currently exists
    a viable framework of disagreement (Phillips, 2015; Sarre et al., 2018; Warf,
    2018; Williams et al., 2018; Smith & Statamakis, 2020). The definitions differ
    based on the person''s or entity''s field, accessible data, location/jurisdiction,
    role of the entity (e.g., academic, law enforcement, or legislative) and whether
    the focus is to be on the victim or the offender (Gordon & Ford, 2006). This led
    to inconsistency in what is considered a criminal offense and how that offense
    may be weighted. Gordon & Ford (2006) define cybercrime as any crime that is facilitated
    or committed using a computer, networked technology, or associated hardware. It
    can also be defined as a crime involving only a computer (Moore, 2011), while
    cyber crime involves a computer and network. Other definitions highlight that
    cybercrime is distinct from conventional crime due to its dependence on networks
    and communication technology (Phillips, 2015; Warf, 2018). These definitions are
    broad; the former goes further by differentiating cybercrime from computer crime.
    Some researchers have attempted to include criminological theory into their definitions.
    Some writers have defined cybercrime as an invasion of computer or use of computers
    as instruments of crime, given a lack of guardians, resources, or knowledge to
    prevent or detect the crime (Gordon & Ford, 2006; Halder & Jahansankar, 2011;
    Jahankhani et al., 2014; Phillips, 2015). The use of the term “guardians” suggests
    a reference to the Routine Activities Theory of “capable guardianship,” which
    can act as a barrier to victimization (Cohen & Fisher, 1979).


    Several definitions have been designed to highlight the different levels of involvement
    of cybertechnology in various cybercrimes, that is, highlighting crimes that use
    cybertechnology and crimes that depend on cybertechnology (Choi, 2018; Chor &
    Schuster, 2008). Other definitions focus on identifying the type and degree of
    involvement of cybertechnology required for a specific criminal activity to be
    denoted as a cybercrime (Bergmann et al., 2018; Bossler & Berenlum, 2019; Grabovsky,
    2007; McGuire & Dowling, 2013). One such definition defines cybercrime as “a criminal
    act in which a computer is used as the principal tool” (Forester & Morrison, 2001).
    As it relates to criminological studies involving information technology, the
    definition describes cybercrime as incidents in which information technology is'
  merge: -1
