  md: '# 9.3 Detection Systems for HSOL


    There has been extensive research for devising systems that are capable of automated
    classification of input data into hate speech and non-hate speech classifications.
    Large-scale automated detection of HSOL content on social media is done through
    machine learning algorithms. These algorithms utilise a lexical dataset of words,
    expressions and phrases that may amount to HSOL and analyse given content to identify
    and detect elements of aggressive content. The lexicon is either created using
    dictionaries to identifying words that may be hateful or offensive by creating
    datasets from available posts, tweets, etc.


    Hate speech detection systems may be classified as seen in Figure 9.2:


    +   1. **Shallow methods** – Shallow methods are conventional methods that use
    traditional or manual word representation algorithms for designing and encoding
    phases and then employing the classifiers to assess the data provided for hateful
    content. Shallow methods use tf-idf (term frequency–inverse frequency) and n-grams
    for feature representation. Simple surface features, such as words, phrases, hashtags
    and so are used as primary features in identification of HSOL, which are then
    used by the classifiers. Support Vector Machine (SVM) is the most employed classifier.
    Other commonly used classifiers include Naive Bayes, Random Forest and Logistic
    Regression.


    +   2. **Deep learning methods** – Deep learning methods employ neural network
    architecture-based systems for hate speech detection. These help in automatic
    analysis of large layers of raw data to give out meaningful output. Deep learning
    models can further include word embeddings-based methods and transformer-based
    methods.


    ![](img/35f35467d9c54860b4a648d36d4a6db1_184_0.png)


    **FIGURE 9.2**

    Different methods in hate speech detection.'
