- pgno: 14
  md: '# Cybercrime in Social Media


    # 1.1 Introduction


    News stories are a great way to learn about what''s going on in the globe right
    now. But not news pieces are equally thorough/verified in their presentation of
    information (Sahu and Majumdar, 2017). The increasing growth of fake news has
    boosted demand for false news detection and intervention because of the damage
    caused to public confidence, democracy, and justice. Detect bogus news from four
    angles: the erroneous information it contains, its writing style, its dissemination
    patterns, and source''s legitimacy. False news theory and its detection require
    multidisciplinary study. This article identifies and discusses relevant theories
    across several fields. Collaboration amongst computer scientists, information
    science professionals, social scientists, political science professionals, and
    journalism experts to explore fake news/contents, with the goal of developing
    a system that is both efficient and explainable (Zhou and Zafarani, 2020).


    Fake news is now widely regarded as a serious challenge to democracy, journalism
    and free speech. Fake news is reducing public confidence in the political system.
    The fake news spread was very high during the presidential election of the United
    States in 2016. The top 20 most-discussed election articles/news on Facebook resulted
    in 8.7 million shares, responses, and comments. The top 20 most-discussed election
    reports on 19 major news websites generated 7.3 million shares, responses, and
    comments (Silverman, 2016). Fake news on social media platform such as Twitter
    is very often retweeted and spreads more quickly than the real or true news by
    considerably individuals (especially for political news), according to the research
    (Vousghi et al., 2018). Fake news is also connected to stock market changes and
    major trades. Our economic activities are not immune to fake news/information.
    As a specific event, the fake news reporting the president of the United States,
    Barack Obama, that he got injured in a bomb blast, affected the stock value of
    $130 billion (Rapoza, 2017). These types of incidents and losses have prompted
    study into false news and stir debate about it. There is a possibility that governments,
    political parties, corporate, and industrialists stand behind false desiring earnings
    and power. They clearly have higher incentive and capacity to create false information
    which is more compelling and indistinguishable from the fact (Zhou and Zafarani,
    2020).


    Even false news is an existing phenomenon since long, it is especially essential
    at this moment to ask why it is becoming a worldwide matter of concern. Why is
    drawing attention of public and researchers. Online social media platform provides
    an easy and cheap mechanism to create and publish false news/information compared
    to the traditional outlets, for example newspaper. Social media platform is easily
    accessible to everyone who fueled the fake news generation (Tandoc et al., 2018;
    Shu et al., 2017; Olteanu et al., 2019; Zafarani et al., 2014).'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Social media is a perfect venue for spreading false news because it breaks
    down physical barriers between people, provides robust platforms for voting, sharing,
    forwarding, and reviewing, and encourages users to participate and debate. This
    upward trend in social media platform news activity have serious consequences
    as significant political and economic losses/gains. Such large rewards incentivize
    hostile actors to generate, circulate false information (Zhou and Zafarani, 2020).
    The contributions of this book chapter are (i) reviews and evaluate strategies/methods
    for detecting fake news, (ii) discuss the various definitions of fake news and
    rumors that have been defined by various researchers in the field, and (iii) discuss
    the problems regarding the collection of data to perform fake news detection.


    # 1.1.1 Fake News Gain Public Trust, How?


    How can the public believe in false news? Social and psychological variables play
    a crucial role in acquiring public trust in false news and facilitating its dissemination.
    When the common mind encounters misleading information, it behaves very illogically
    and is very in bifurcation of truth and deception. The common mind''s capability
    to bifurcate truth and deception is just above the half (i.e., above the fifty-fifty
    chance). According to social psychology studies, normal truth accuracy rates exist
    in the range of 55% to 58% (the average accuracy is 54%) over one 1000 samples
    (i.e., participants) in 100 trials (Rubin, 2010). Fake news is in a worse predicament
    than to win public trust in the information, where one expects security and neutrality.
    The concepts such as validity effect, confirmation bias, selective exposure, desirability
    bias, bandagon effects (these theories are given in detail in the fundamental
    theories section) are the reason behind the public trust in fake news.


    # 1.2 Definitions


    Facts, conclusions from facts, interpretations, views, forecasts, beliefs, and
    other sorts of information can all be found in a news item. One of the fundamental
    phases in many different types of content analytics is identifying and classifying
    article components (Sahu and Majumdar, 2017). Nonfactual contents include inferences,
    interpretations, opinions, etc. A fact is anything that has happened or that is
    true. Events that have actually occurred and claims that purport to be true are
    factual in nature in news stories, but views and interpretations are not. An example
    is given below:'
  merge: -1
  img_proc: true
