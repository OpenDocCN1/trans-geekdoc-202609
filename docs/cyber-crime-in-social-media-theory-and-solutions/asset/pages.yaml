    and media (Ponemon Institute & Accenture Security, 2019). Eight years ago, the
    financial impact was already being examined and identified as a growing problem.
    Keith Alexander head of the National Security Agency and US Cyber-Command indicated
    a 44% increase in cyberattacks in only one year and that based on information
    he accounted for the “greatest transfer of wealth in history” (Henney, 2018; Rogin,
    2012). The 2012 Cost of Cybercrime Study sought to quantify the loss, estimating
    that cybercrime cost some companies over USD 8.9 million per year. Research by
    IBM using data from 350 companies in 11 countries shows a 23% increase in the
    total cost of data-breaches between 2013 and 2017. In 2017, reports suggest that
    cybercrime resulted in USD 100 billion per year of financial loss (Ali et al.,
    2017; Ngo & Jaishankar, 2017). However, other reports by the Center for Strategic
    and International Studies estimate that the global cost of cybercrime may be closer
    to USD 600 billion (Center for Strategic and International Studies, 2018). Cybersecurity
    Ventures and Harjevec Group (2019) with support from Frank Abigail renowned authority
    on financial crime and a Federal Bureau of Investigation consultant predicted
    that cybercrime costs associated with a growing need would be more than USD 6
    trillion in 2021 (Cybersecurity Ventures & Harjevec Group, 2019). The indirect
    cost of cybercrime associated with a growing need for cybersecurity is also forecasted
    to increase with values ranging from 8% to 15% year-over-year, giving an estimated
    total expenditure for the period 2017–2021 of USD 1 trillion (Cybersecurity Ventures
    & Harjevec Group, 2019).


    Research has shown that the global distribution of the cost of cybercrime is skewed
    based on factors of region, national income level, and cybersecurity maturity
    (Center for Strategic and International Studies, 2018; North America, Europe,
    and Asia currently experience the greatest recorded loss due to cybercrime, which
    accounts for almost 1% of their gross domestic product (GDP) in each instance
    (Center for Strategic and International Studies, 2018). However, Latin America
    and the Caribbean are not far behind with cybercrime costing up to 0.6% of the
    GDP. Studies by the United Nations Office of Drugs and Crime and the Center for
    Strategic and International Studies suggest that countries with larger GDPs and
    lower levels of cybersecurity maturity incur greater losses due to cybercrime
    (Center for Strategic and International Studies, 2018; Malby, 2013). This suggests
    that mid-range nations that are digitized but not yet to fully develop their cybersecurity
    infrastructure are at the greatest risk.'
