    # 1.3 Fundamental Theories


    Social sciences and economics studies provide the insights of human cognition
    and behavior, which explains the fake news phenomena. These ideas and theories
    can be used to construct explainable machine learning models for detecting false
    news and intervening. Fake news can be divided into two parts: (i) “news-related
    theories” and (ii) “user-related theories”.


    # 1.3.1 News-related Theories


    Theories about news illustrate the probable features of false news material vs
    actual content. False news differs mostly from the real news in the way of writing
    style, quality, quantity such as word count, and feelings communicated. It should
    be highlighted that these forensic psychology others target false comments or
    testimony (i.e., disinformation). However, these characteristics help develop
    models to automatically detect bogus/false news based on its writing style, as
    in a conventional supervised learning research (McCornack et al., 2014; Zhou et
    al., 2019).


    Deutsch hypothesis: According to events the Deutschth hypothesis, statements formed
    from recollection of real-life events differ greater in substance and quality
    from constrained or fake stories (Amado et al., 2015).


    Four-factor theory: According to the four-factor theory of deceit, deception consists
    of (a) generalized arousal, (b) worry, guilt, and other feelings associated with
    deception, (c) cognitive components, and (d) liars'' attempts to manage verbal
    and nonverbal signs to look honest. Deceptions are expressed in truth of (i) arousal,
    (ii) emotion, behavior control, and (iv) thinking from truth (Zuckerman et al.,
    1981). Arousal: Lying creates anxiety and arousal, either because of cognitive
    dissonance caused by opposing ideals and conduct, or because of dread of being
    detected. Lie detectors, see faults and hesitations, repetitions, fidgeting and
    displacement activity, blinking, increased voice tone, and pupil dilation can
    all be used to identify truth. *Emotion*: When we lie, our emotions shift. For
    instance, during enjoying, in which the liar secretly enjoys their seeming success.
    Guilt may also manifest. Facial muscle micro-movements can reveal concealed emotions.
    *Behavior control*: We attempt to reveal ourselves through our body language.
    In reality, this is impossible, and leakage occurs frequently, as when we are
    controlling our face and our legs give us away. *Thinking*: We'
