  md: 'Hate speech has been a lingering issue since the emergence of web 2.0, which
    enables websites to allow users to create and share content. It also allows a
    group of users to interact and collaborate with one another. Features like Facebook,
    Reddit, Twitter, and YouTube, the era of cyberbullying and hate speech begins.
    Moreover, the ability to share anything without revealing one’s identity (anonymity)
    provides a boon to these preachers of hate speech.


    Cyberbullying and hate speech affect Internet users and are a massive concern
    for governments and major firms. There are instances like one reported in [2],
    where major companies like Facebook came under fire for not doing much to prevent
    these activities. Major firms spent a significant chunk of money, time, and attention
    on content moderation to stop these activities. Developing a system for hate speech
    identification will help build a better society. However, building a strategy
    is much more tedious in the current scenario. Unlike the initial days of the Internet,
    when English was the only supported language, nowadays, everyone has the freedom
    to use a wide range of languages. Furthermore, there is a lot of content that
    is mixture (code-mixed). Moreover, the volume and velocity at which the contents
    are being generated on online platforms reduced the traditional method of content
    moderation as highly inefficient.


    So, this problem of content moderation has gained much attention from Natural
    Language Processing (NLP) researchers across the world. Initially, the research
    was focused on hate speech content in English only. With the growth of the Internet,
    when it started supporting other languages, research focused on hate speech identification
    in these languages began. And in the last few years, there has been significant
    research on hate speech identification in code-mixed content. So, this chapter
    presents a detailed review of the literature in the context of hate speech identification.
    There have been surveys present on this topic; however, this chapter aims at complementing
    the other work, by Lucas et al. [3], Schmidt and Wiegand [4], Fortuna and Nunes
    [5], and Poletto et al. [6]. Moreover, there has a lot of research on hate speech
    identification in recent years. So, we undertook the task of writing a systematic
    survey on the literature from the beginning to the current year.


    The remaining chapter is organized as follows. In Section 5.2, the problem is
    presented. Section 5.3 offers the entire literature explained, followed by a discussion
    in Section 5.4, and finally, the chapter is concluded in Section 5.5 with future
    directions.


