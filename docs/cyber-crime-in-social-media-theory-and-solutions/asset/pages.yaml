    **Support Vector Machine:** It is a supervised learning approach utilized for
    classification as well as regression. Finding a hyperplane in N-dimensional space
    that precisely classifies is the goal of the SVM method. The number of features
    determines the hyperplane''s size. The hyperplane is essentially a line if there
    are just two input characteristics. The hyperplane turns into a two-dimensional
    plane if there are three input characteristics. The hyperplane that shows the
    greatest gap between the two classes is an ideal choice for the best hyperplane.
    Advantages of SVM are as follows:


    +   - Efficient in instances with high dimensions.

    - Its memory efficiency comes from the decision function''s usage of support vectors,
    a subset of training points.

    - Possible to define some custom kernel functions.


    **Decision Tree:** It is a supervised learning method that may be used to solve
    classification and regression challenges, but it is mostly recommended for classification.
    It is a tree-structured classifier, where internal nodes stand for a dataset''s
    features, branches for the decision-making process, and each leaf node for the
    classification result. The Decision node and Leaf node are the two nodes of a
    Decision Tree. Leaf nodes are the results of decisions and do not have any more
    branches, Decision nodes are used to create decisions and have various branches.
    The provided dataset''s features are used to execute tests or make decisions.
    It is a pictorial representation for obtaining all feasible solutions to a decision
    or problem based on predetermined conditions. Advantages of Decision Tree Method
    are as follows:


    +   - It is easy to comprehend since it uses the same reasoning process that a
