  md: '# Emphasizing the Power of Natural Language Processing


    social media needs through understanding of cause and need of the rising crisis.
    Recent researches have reported the issues of cyberbullying or direct bullying.
    However, the need for a systematic solution to address the safety and protection
    of individuals is still question. This chapter aimed to explain the issue of cyberbullying
    with a case study on the classification task of machine learning. The exploratory
    analysis of new content''s reliable and unreliable category has shown the cause
    and need to arrest the spread of rumours on social media. Visualizing textual
    contents based on size and colour as word cloud has ensured the need for text
    analytics in cyberbullying The extraction of fake words based on weighted arithmetic(s)
    and their corresponding scores has illustrated the use of algorithmic techniques
    in detecting fake news. Further, the formulation of deep learning models in the
    classification of fake news using sequential models is left to work in future.


