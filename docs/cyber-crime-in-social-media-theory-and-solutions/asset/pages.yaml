    # 7.2 Review Methodology


    This chapter provides a broad review of key definitions, typologies, taxonomies,
    and the overall concept of cybercrime. Further, it provides a brief examination
    of the impact of cybercrime at the individual, organizational, and national levels.
    Since the aims of this chapter did not necessitate a systematic or qualitative
    assessment of the literature, a parameterized narrative literature review was
    utilized. However, to provide structure and focus to the review specific search
    parameters were adopted to approximate a systematic review approach.


