    # 5.4 Conclusion and Future Directions


    Identifying hate speech in social media content is not an easy task. The ambiguity
    in the definition of hate speech and the unavailability of an adequate dataset
    creates more problems for the people working on it. But with the advent of a new
    methodology and appropriate dataset, the content community will be able to provide
    better results in resolving this'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# A Multilingual Review of Hate Speech Detection


    social problem. In this regard, this chapter will give the new researcher of this
    community a language-oriented review of the existing literature.


    In this review we first explain hate speech in a different context and then a
    language-oriented brief review the existing literature along with the corpora
    of the dataset present. The majority of the datasets are present in the English
    language, with a significantly smaller number of datasets in a few other languages.
    But as the web is not confined to the English language anymore, the research community
    must develop more and more datasets on these languages to prevent this social
    ailment. Further, as people are using multiple languages over social media, content
    over social media is multilingual, code-mixed, and script-mixed. The research
    community must come up with datasets and methodologies to prevent the spread of
    hate speech over social media.


    Hate speech is an ever-evolving area with the addition of new languages and scripts
    make the task of hate speech identification more complicated. Additionally, the
    evolution of the behaviour the haters bring new challenges. Therefore, generalizing
    hate speech across contexts will be near impossible rather the community must
    work towards context-specific identification of hate speech. While a small dataset
    may the model prone to overfitting at the same time the biases in the dataset
    make the model translate it into the result. So, the NLP community needs to address
    these concerns to make social media a haterfree community.


