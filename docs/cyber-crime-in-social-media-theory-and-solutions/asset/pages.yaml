    # 10.1 Introduction


    Recent developments in computer vision, pattern recognition, and machine learning
    have motivated researchers to take up a lot of research in the speech processing
    and analysis for forensics domain as well as in cybercrime in social media. Forensics
    refers to the application of scientific methods and techniques for the investigation
    of crime incidents. Now with the enhancement inside the technological global,
    a lot of security attacks and frauds are carried out online where the evidences
    are in digital form. Digital forensics is an investigation technique that digital
    the evidences. Further, any criminal activity involving a computer, a networked
    device, or a network is considered a cybercrime.


    It has various applications such as cyber security in social media, military,
    law enforcement, and business domains. Each has its own sub-methods such as network,
    image, RAM, and speech forensics. In-depth and precise analysis is mandatory to
    be considered for processing and analysis using image, speech, audio, DNA fingerprint,
    palm print, foot print, finger print, and network digital evidences are employed
    [1]. Here the focus is on speech processing and analysis for digital forensics
    and cybercrime domain. Speech processing is the study of characteristics, processing
    methods, and analysis of the speech signals. Further, forensic and cybercrime
    speech processing is the study of characteristics, forensic and cybercrime speech
    processing is the specialization where speech samples are processed and analysed
    for legal investigations and proceedings.


    However, there are many research works and techniques under this domain as speaker
    recognition, speech enhancement, and synthesis for supporting the crime investigation.


    Speaker recognition is the technique of automatically recognizing the unknown
    speaker by extracting the speaker particular information included in human speech.
    However, forensic speaker recognition (FSR) is the automatic process to scientifically
    determine whether the recorded voice belongs to the suspect or not.


    Similarly, speech enhancement is the endeavour of taking a noisy speech input
    and producing a better speech output. In the similar way, the task of'
