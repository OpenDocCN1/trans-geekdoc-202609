    Social media has many merits, including access to opinions on various topics,
    meeting and getting to know different people, spreading art/culture and promoting
    talent, giving support and strength to the voiceless, and spreading awareness.
    However, it also comes with certain merits like spreading false information, hatred,
    cyberbullying, and manipulating people''s views, to name a few. The unfriendly
    content of social media has many consequences, as reducing one''s confidence,
    ruining mental health, degrading moral values, and so on. Thus, it is crucial
    and necessary to remove unfriendly content to fight out social media''s cons and
    make it a better platform for everyone.


    Over the last decade, the impact of social media on an individual has increased
    exponentially. People these days express their views on social media such as women
    in the fields of Science, Technology, Engineering, and Management (STEM). People
    belong to the Lesbian, Gay, Bisexual, Transgender, Intersex Queer/Questioning
    (LGBTQ) racial minorities or people with disabilities. Due to this freedom of
    speech, delicate issues such as discrimination against minorities, criticism,
    racism, and so on also increased. To preclude this, researchers have come with
    various methods such as hate speech detection (Wiegand et., 2017), offensive language
    identification (Zampieri et al., 2019), and abusive language detection (Lee et
    al., 2018). But these techniques are fallacious as they do not consider the potential
    biases of the dataset. Consequently, this bias in the dataset causes abusive language
    detection to be inclined one group over the other. Therefore, researchers have
    turned their work to promote Hope Speech rather than eliminating harmful content.


    Previous research has highlighted the importance of identifying unsavoury content
    on social media platforms and attempted to identify content like hate speech and
    news (Castillo et al., 2011; Hassan et al., 2010); Biradar et al., 2021; Biradar
    and Sauyya (2022). Still, promoting and encouraging content that offers support,
    reassurance, suggestion, and inspiration is also important. This promotion of
    righteous content would inspire people and prevent the spread of harmful content
    such as racial/sexual remarks, nationally motivated slurs, and so on.


    In the dataset published by Hugging Face to identify Hope Speech, the researchers
    have divided the dataset into two categories (Hope and Non-Hope). They have considered
    expressions that offer support, reassurance, suggestions, inspiration, and insight
    as the Hope Speech. Expressions that do not bring positivity, such as racial comments,
    comments on ethnicity, sexual comments, and nationally motivated slurs, as Non-Hope
    Speech. They have trained the dataset on various machine learning (ML) and deep
