  md: '# 4.4.2.1 Word Embeddings-based Methods


    In word embeddings-based methods, words are represented or embedded mathematically
    as vectors. A representation is called an embedding. Words with similar or identical
    meanings are clustered together and embedded closely in the vector space. These
    embeddings are then used for downstream data retrieval. The common techniques
    used in these methods include Convolutioned Neural Networks (CNNs), Long Short-Term
    Memory Network (LS-TM), Recurrent Neural Networks (RNNs) or a combination of these.
    These methods employ common word embeddings like GloVe, word2vec and FastText.
    These methods are based on static word embeddings. This implies that the embedding
    does not consider the overall or complete sentiment of the sentence, but only
    focuses on the single word.


    # 4.4.2.2 Transformer-based Methods


    Transformer-based methods use dynamic word embeddings. Transformers are a category
    of neural network architectures that can process whole sequence of words or sentences
    with higher accuracy and precision. Various transformer-based techniques have
    been developed in the recent times:


    +   - The most common technique is Bidirectional Encoder Representations from
    Transformers (BERT). It is pre-trained to represent unstructured text by comprehensively
    analysing the sentence from both its left and right context.

    - ELECTRA is another transformer-based model that is capable of identifying differences
    between real and fake input data.


    Transformer-based methods are used in combination with word embedding-based models
    like CNN and LS-TMN.


    # 4.4.3 Embeddings


    Embeddings are numerical representations of real-world data and abstract relationships
    represented as vectors with (x, y) coordinates. Words or relationships with closer
    meaning or belonging are grouped closer in the vector space than ones with different
    meaning. The computer is fed with X and Y matrices using neural network to make
    it understand the relationships between words and it automatically clusters related
    words together. A multitude of word embeddings have been created over the years,
    which include GloVe, word2vec and FastText.


    Let us understand this with the help of an example. A system is given the words
    “King”, “Queen”, “Man” and “Woman”. X and Y matrices are created'
