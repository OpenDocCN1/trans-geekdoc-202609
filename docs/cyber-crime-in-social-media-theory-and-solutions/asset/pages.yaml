  md: '# 134


    # Cybercrime in Social Media


    Cybercrime is increasing in size and complexity with corresponding increases in
    financial losses (Pononemon Institute & Accenture Security, 2019). Rather than
    decrease or approach a steady rate, the rate of increase in the losses associated
    with cybercrime is rising at a rapid rate with 72% increase over five years (Ponemon
    Institute & Accenture Security, 2019). Therefore, to successfully turn the tide
    of rapidly growing economic damages at the hands of cybercrime requires a human-centric
    approach, given that humans remain the weakest link with the end user being the
    root cause of successful cyberattacks (Coffey et al., 2018; Jalkanen, 2019; Jansen
    & Leukfeld, 2016; Ponemon Institute & Accenture Security, 2019). Research on identifying
    behaviors or characteristics that increases the end''s risk of victimization can
    contribute to harden strategies which will benefit the individual and by extension
    increase the cyber resilience of private and public enterprises and safeguard
    national interests.


    # 7.6 Conclusion


    This review introduced and consolidated key concepts related to the nature and
    definition of cybercrime, its typologies, taxonomy, and impact extracted from
    the exant literature. The lack of a standardized definition of cybercrime has
    several consequences with varying impact on cybercrime classification, legislation,
    policy, strategy, investigation, and academic research. Overall, the lack of a
    clear definition leads to ambiguity in what can be called a cybercrime and hence
    identifying cybercrime prevalence, patterns, and even in comparison of research
    data. The review has also demonstrated that a similar issue exists in relation
    to the classification of cybercrime different organizations and fields tend to
    classify based on their definition of cybercrime and the perceived functionality
    of their proposed classification method. However, no classification method appears
    to capture the range of activities that can be placed under the umbrella term
    of cybercrime as it relates to vectors, targets, or outcomes. The concept of strict
    separations may may the uniqueness of crimes or underestimate the dynamic nature
    of cybercrime victimization. Rather, it is quite possible that cyberimes may exist
    on a spectrum and that some crimes are sensitive to initial conditions and can
    fit into multiple categories given different conditions.


    Defining and classifying cybercrime is likely to remain a challenge as what constitutes
    a cybercrime is intrinsically linked to the ongoing evolution of cybertechnology
    and its integration into the daily activities of modern society. What is likely
    inescapable is with increased integration the reach of cyber-criminals/-deviants
    will expand and the potential'
