    # 6.6 Conclusion and Future Work


    This chapter presents a new angle to address bullying trace from the behaviour
    of online users. Only detecting whether an individual comment is bullying or not
    is an efficient way to address real-time cyberbullying tasks where comments come
    in sequence, and that sequence is more important to determine whether the problem
    is still open or has been. To address this problem, we have gone through an intensive
    analysis of bullying sequence in the Reddit online social networking site and
    found several observations from these data. Further, we have proposed CNN and
