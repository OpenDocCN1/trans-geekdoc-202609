- pgno: 100
  md: '# 5.3 Hate Speech Identification Approaches


    This study aims to understand the literature present in hate speech identification.
    To achieve this goal, we conducted a systematic review of the existing literature,
    which is more relevant to this topic of study.


    With web 2.0, the users can interact with other users of the Internet, and thus,
    the problem of hate speech arises. The early literature on this area can be traced
    back to the early phase of the last decade. Since then, there has been a lot of
    research on this area, but the problem has gained much attention during this COVID-19
    pandemic. In the early phase, most of the study is focused on the English language
    only. Towards the end of the last decade, when people could write content over
    the Internet using other languages, research on hate speech identification in
    languages other than English appeared in the literature. And in recent years,
    there has been a lot of research on language mixed or code-mixed present in the
    literature.


    In the literature, all the proposed approaches have used some machine learning/or
    deep learning to classify hate speech. So, there is a lot of exists using machine
    learning approaches like Logistic Regression [15], Support Vector Machine (SVM)
    [16], Random Forest [17], Decision Tree [18], and de deep learning approaches
    like Dense Neural Network [19], Convolutional Neural Network (CNN) [20], Long
    Short-Term Memory Network (LSTM) [21], n-gram approaches have used text features
    like Bag of Words (BoW) [22], n-word embedding, and so on. This is not the first
    instance of a survey on hate speech identification, but most of the surveys that
    exist on this topic categorized the literature based on the algorithm used and/or
    the features used. Lately, there been a lot of research on code-mixed language,
    and to the best of our knowledge, there exists no survey which categorizes literature
    based on language.


    So, in this study, we categorized the whole literature into three parts: a literature
    based on English, literature based on other languages, and literature based on
    code-mixed languages.


    # 5.3.1 Research on Hate Speech and Offensive Language Identification in the English
    Language


    Most of the initial studies on Hate Speech and offensive language identification
    are based on the English language. One of the first pieces of research done in
    this is by Razavi et.al. [24] in the year 2010. The authors used a three-phase
    classifier to classify abusive/offensive languages in this work. In the first
    classification phase, they used the Compliment Naive Bayes Classifier. In the
    second phase, they used Multinomial Updatable Naive Bayes Classifier, and in the
    third phase, they used Decision Tree/'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# A Multilingual Review of Hate Speech Detection


    Naïve Bayes Hybrid Classifier. Though the outcome of this research is not promising,
    the main contribution of this work is a Dictionary of 2,700 hand-labelled offensive
    words and phrases. In the same year, Xu and Zhu [25] proposed a sentence-semantics
    filtering approach using grammatical relations to remove offensive content from
    the comments. The significant contribution of this work is a hand-annotated dataset
    of 1,170 user comments from YouTube. The major shortcoming of this work is of
    the assumption that offensive expressions can only be expressed using abusive
    words. Similarly, Wagner and Hirschberg [26] proposed an approach using SVM with
    a linear kernel to detect hate speech. The proposed method achieved an accuracy
    of 94%.


    Most basic approaches use simple features as intensity, user intent, hate target
    [27], for hate speech identification. Furthermore, more popular approaches combine
    feature extraction and traditional machine learning algorithms for the same [28].
    They used frequency-inverse document frequency (tf-idf), semantic, lexical, topic
    modelling, sentiments, Bow, and embedding techniques such as FastText, GloVe,
    and Word2Vec for feature extraction [29]. Some authors have used dimensionality
    reduction to reduce time and complexity [30]. The authors in [31] used the BoW
    method in conjunction with Naïve Bayes Classifier. Smeat [32] used BoW in conjunction
    with SVM. However, because of the high-positive rates of BoW [33], others used
    more sophisticated methods to provide features for classical machine learning
    methods (e.g., SVM, Naïve Bayes, and Logistic Regression) [34]. Salminen et al.
    [35] experimented with additional classes (such as accusation, humiliation, and
    so on) and hate/non classification. They have proposed SVM with a linear kernel.


    Deep learning has gained significant traction in NLP following its success in
    computer vision, pattern recognition, and speech processing. The recent trend
    of using neural network-based approaches has been especially noticeable for English
    because several training datasets are available for this, allowing for more data-hungry
    approaches. One milestone is the introduction of word embedding [36], which proved
    helpful in combination with traditional machine learning algorithms for hate speech
    detection, and outperformed the BoW approach significantly [37]. Various neural
    network-based methods [5] have been presented, including CNN, LSTM, bidirectional
    (bi-LSTM), and Gated Recurrent Unit (GRU) Network. Most of these deep learning
    architectures have two steps [38]: a word embedding layer that used models like
    Word2Vec, FastText, and GloVe, followed by a deep learning layer. When the deep
    learning models were compared, the results were mixed regarding deep learning
    architecture best [39, 40]. However, several other papers suggested that combining
    two or more deep learning models outperforms a single deep learning model [41,
    42]. For example, CNN, along with LSTM, outperformed a single application of LSTM
    or CNN [43]. Another significant step was the addition of transformers,'
  merge: -1
  img_proc: true
