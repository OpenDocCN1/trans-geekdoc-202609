- pgno: 7
  md: '# Preface


    Social networks have become an essential tool for anyone who wants to share or
    receive information. Many important pieces of information are frequently disseminated
    via online social media before any news channel. As a result, people are demeaning
    and to become addicted to it. Facebook, Twitter, and other popular social networks
    are listed below. Almost every big name and organization set up an account to
    share information or announcements with their global connections. This, in turn,
    created a slew of issues. The majority of the issues affect teenagers in particular.


    People are misusing and abusing others on social media because there are fewer
    restrictions on what they can post. As a result, a robust mechanism is required
    to time this monitor and prevent it from being posted if the context of the message
    is not healthy. The Internet''s rapid growth enticed everyone to use it. As a
    result, every individual today uses social media to share personal and professional
    information. It is beneficial in many ways, such as making it easier to share,
    promote, and connect with relatives, friends, and business partners. However,
    it also invited a slew of unwanted issues, such as cyberbullying, hate speech,
    spamming, rumor, and others.


    To make the social media platform more usable and stress-free, we must address
    these issues. This book proposed a number of advanced models capable of effectively
    minimizing the social-cyber issues using the following techniques:


    +   - A Detailed study of different social-cyber issues

    - Impact of hate speech on minors

    - Natural language processing for cyberbullying

    - Deep learning-based framework to address cyberbullying

    - Machine learning-oriented emotion detection framework

    - Research on fake news and rumor detection


    This book will be very helpful for students because the chapters are structured
    in a way that makes it easy for advanced undergraduate and beginning graduate
    students to understand the ideas. The book also includes exercises at the conclusion
    of each chapter so readers can gauge their comprehension of the subject. In conclusion,
    this book is beneficial for anyone who wants to undertake research in this field
    or is interested in employing machine learning, deep learning, and other cutting-edge
    data science tools to address social-cyber concerns.


    I wish the very best to all the readers of this book.'
