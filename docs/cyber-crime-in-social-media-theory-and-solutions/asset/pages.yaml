    # 4.3.2 Revisiting the Dataset


    The original dataset was analysed using different techniques of Exploratory Data
    Analysis. One of these was to analyse the data using word clouds. It was found
    that words like Life, Matter, People, and so on almost the same size for both
    Hope and Non-Hope labels (meaning a similar number of occurrences in both), as
    shown in Figures 4.1 and 4.2.


    # 4.3.3 Reasons to Relabel the Dataset


    Building from the Exploratory Data Analysis, we delved deeply into the dataset
    to find the following vulnerabilities occurring frequently:


    +   1. The same comment has been labelled as Hope and Non-hope at different occurrences,
    making it difficult for the model to be trained accurately. For example, "Madonna
    is God" is labelled as both Hope and Non-hope.

    2. English comments are labelled as Not-English. For example, "@cubicPas123 it''s
    not the right time" is labelled as Not-English.

    3. Hope comments are labelled as Non-hope. For example, "God gave us a choice"
    is labelled as Non-hope.

    4. Non-hope comments are labelled as Hope. For example, "Democrats are racist"
    is labelled as Hope.

    5. Not-English comments are labelled as Hope or Non-hope. For example, "@jessica
    walker lo pas encantada" is labelled as Hope.


    # 4.3.4 Criteria of Relabelling


    To address these vulnerabilities and to make the dataset more precise, we relabelled
    the whole data accordingly. Text data showing inspiration, support, suggestion,
    well-being, joy, happiness, optimism, faith, and expression of'
