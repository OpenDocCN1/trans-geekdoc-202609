    # 6.2 Related Works


    Cyberbullying as stated earlier, is a serious issue on the social web and becomes
    a huge threat to adolescents and young adults. During the last few years, cyberbullying
    identification has been an increasingly popular topic. Various studies [2,3,4,5,6,7,8,9,10,12,13]
    have been proposed to tackle this problem. Here, we have discussed some of the
    potential works that have been done in cyberbullying domain. Yin et al. [10] used
    term frequency–inverse document frequency (tf-idf) as detection features to identify
    cyber harassment. Detvar detection features are popular among various researches
    [6,7]. Davdar and De Jong [7] used Support Vector Machine (SVM) classifier to
    detect cyberbullying on MySpace posts. They found that gender-specific features
    incorporated with textual features improve the accuracy of classifiers. Dinakar
    et al. [6] identify the cyberbullying specially concentrated on Lesbian, Gay,
    Bisexual, and Transgender type of cyberbullying. They used YouTube and Formspring
    datasets and found that SVM classifier F1-Score of 0.63. Nahar et al. [14] used
    a weighted graph-based approach to identify the bully from non-bully users. They
    found F1-Score of 0.92. To detect offensive content and online users, Chen et
    al. [15] used Lexical Syntactic Feature. They got 94% and 78% of recall values
    of text offensive and user offense methods, respectively. Alam et al. [16] used
    ensemble-based methods for cyberbullying detection and found that Logistic Regression
    and Bagging-based classifiers are performing well for their dataset.


    Some recent works [3,9,17,18,19,20] used machine learning and deep learning models
    to identify cyberbullying events. In these recent works, most of them found that
    their deep learning models performed better than simple learning models.


    The above-mentioned work mainly focused on the classification of each comment
    as bullying or not. None of them analysed the sequence of comments. So, we tried
    to analyse the bullying sequence for a better understanding of real-time bullying
    incidents specifically on the Reddit social networking site.'
