  md: '# Cybercrime in Social Media


    The energy sector performance reported decline in the production with natural
    gas (-6.9%) and crude oil (-3.3%). After a 17.9% increase in April, refineries
    saw a modest 1.2 percent increase in May. Industrial activities are relatively
    poor. A cause for concern is weak capital expenditure and construction. The pace
    of road construction is going up, which may be countered in a few months.


    **Factual contents:** (1) The energy sector performance reported decline in the
    production with natural gas (-6.9%) and crude oil (-3.3%). (2) After a 17.9% increase
    in April, refineries saw a modest 1.2% increase in May.


    **Nonfactual contents:** (1) Industrial activities are relatively poor. (2) A
    cause for concern is weak capital expenditure and construction. (3) The pace of
    road construction is going up, which may be countered in a few months.


    **Fake news:** The fake news is defined in two ways: (i) broad definition and
    (ii) narrow definition.


    *Broad Definition:* “Fake news is a false news” (Zhou and Zafarani, 2020).

    *Narrow Definition:* “Fake news is intentionally false” (Zhou and Zafarani, 2020).


    Speeches


    Note that deceptive news is more destructive and difficult to discern from carelessly
    false news, since the former claims to be true in order to deceive the audience
    more effectively. The restricted definition stresses news authenticity and goals,
    as well as ensuring that the content presented is by determining the outlet/publisher
    is a news organization. The assertions made by, or prominent persons and organizations
    are frequently published in the form of news articles having constituents, such
    as videos of the author, name, body text (information content), images, and videos
    (if any). The authenticity of fake news must be untrue under both meanings of
    literature. *Deceptive news* is a term used in fake news detect a news with intent
    to mislead (Allcott and Genzzkow, 2017; Shu et al., 2017; Lazer et al., 2018).


    *Misinformation:* In a macro scale, misinformation is erroneous information. It
    may be inaccurate or misleading information. It spreads accidentally as a result
    of honest mistakes or information updates that are not intended to deceive (Kucharski,
    2016; Lazer et al., 2018; Hernon, 1995).


    *Disinformation,* which lies within the narrow definition of fake news, is false
    information that purposefully deceives people to a specific goal (e.g., to confuse
    people in order to support a perceived agenda). It is purposely spread to deceive
    or mislead people, unlike misinformation. The researchers distinguish between
    two types of fake news: misinformation'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Fundamental Theories Behind the Detection of Fake News and Rumors


    and disinformation. The term “deception” is sometimes used interchangeably with
    ‘disinformation’. Disinformation is information that is (i) false and (2) spreads
    with the intent of deceiving and harming others. Text is commonly used to convey
    misinformation. However, the internet and social media allow for the use of several
    modalities that may make a disinformation message appealing as effective, as a
    meme or a video, which is much simpler to consume, draws much more attention,
    and spreads much further than text (Kmar et al., 2016; Volkova et al., 2017; Guo
    et al., 2020).


    Rumor: Rumor is unproven and important information that is being spread, and it
    can subsequently be validated as true, false, or unconfirmed. It has the potential
    to be spread among people and groups. Early, the process of identifying news as
    true or false was known as ‘rumour detection’. Now the same thing is popular as
    “fake new detection” (Peterson and Gist, 1951; Buntag and Golbeck, 2017; Zubiga
    et al., 2018). Hoaxes: Hoaxes are manufactured pieces of information that masquerade
    as truth. Because it involves highly intricate and large-scale fabrications, it
    frequently causes substantial harm to the victim (Kmar et al., 2016; Rubin et
    al., 2015).


    Satire: Satire, which contains sarcasm and comedy, is designed to enter or criticize
    the audience. Some websites, as SatireWire.com and The Onion, routinely post these
    news pieces. It might be damaging if parody news, regardless of content, is widely
    spread. “Parody” is a notion similar to satire, but it differs in that parody
    employs factual info to incite comedy (Brunmette et al., 2018; Tandoc et al.,
    2018). Hyperpartisan: In a political setting, hyperpartisan news is news that
    is excessively one-sided or prejudiced. Bias does not necessarily imply phony;
    however, several articles suggest that hyperpartisan news/contents are of high
    probability of being false in the targeted networks. The incorrect information
    is routinely eliminated in the alt-right/targeted community (Hine et al., 2017;
    Zannettou et al., 2018; Potthast et al., 2018).


    Propaganda: Propaganda is a type of persuasion that uses controlled broadcast
    of one-sided information to try affect the emotional activity, attention toward
    something, views, and actions of certain targeted population for political, ideological,
    and religious benefits/reasons. It has been utilized to sway election outcomes
    and attitudes in a political environment (Jowett, 2012; Lumeanu et al., 2012).


    Spam: Spam is manufactured information ranging from self-promotion to fake product
    announcements. Spam on review sites delivers baselessless evaluations just to
    justify the promotion of products or baseless reviews to competitor goods to harm
    their reputation. Spam on the social media platform targets people to spread viruses
    and spam messages promoting commercial websites (Jindal and Liu, 2008; Lee et
    al., 2010).


    Clickbait: Clickbait is an article with an enticing headline that is designed
    to draw the attention of readers and generate advertising income. Because the'
