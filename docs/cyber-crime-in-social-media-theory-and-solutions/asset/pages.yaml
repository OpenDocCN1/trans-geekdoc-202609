  md: '# 1.4.3 Propagation-based Fake News Detection


    Propagation-based fake news detection utilizes the information of the dissemination
    pattern of fake news. Determining false content based on propagation is also termed
    as a binary classification problem (or multi-label classification problem), similar
    to identification on fake news based on style. A propagation-based method''s input
    can be either a fake news tree or a self-defined graph. Cascade tree is a direct
    representation of propagation of news. Self-defined graph is an indirect representation
    that contains extra information of propagation pattern. Therefore, detection of
    fake news on the basis of propagation reduces to identifying cascade tree and
    self-defined graphs. A tree-like structure that tracks the spread of news piece
    across the social media network is called cascade tree. A cascade''s root node
    symbolizes the person who initially started the news piece; additional nodes in
    the cascade tree represent users who propagated the news by sharing it after it
    was published by their parent node, to whom they are connected by edges.


    Due to various beginnings, a single news story might result in multiple simultaneous
    cascades. Furthermore, news frequently consists of a variety of qualities and
    other information inside a cascade tree, for example, whether they are supporting
    or opposing that information, their personal information, past postings, and comments.
    Many supervised learning approaches, like Support Vector Machines, Decision Trees,
    Naive Bayes, Random Forest, and others, are used to categorize a cascade tree
    (which is encoded as a set of features). Fake news patterns found in empirical
    investigations can be used to inspire cascade features. For example, from 2006
    to 2017, a research work looked at the variations in dissemination patterns of
    confirmed factual and fake news items on Twitter (Vosoughi et al., 2018). In comparison
    to authentic news, fake news spreads quicker, further, and more broadly, and is
    famous quickly getting high structural value score. Particular with a bigger cascade
    depth, magnitude (average breadth at average depth), and structural vitality than
    authentic news (Goel et al., 2016). The features in the news cascade are cascade
    size (no. of nodes), cascade breadth (average breadth), cascade depth (of the
    cascade tree), structural vitality (degree of root and average degree of other
    nodes), spread speed (time taken to attain a certain size or depth, time between
    the parents and its child node), and cascade similarity (cascade tree and other
    trees similarity in the corpus) (Zhou and Zafarani, 2020). Deep learning strategies
    such as recursive neural network and recurrent units are also used.


    A flexible network is constructed by self-defined propagation graphs to capture
    false information dissemination, heterogeneous, or homogeneous. These networks
    might be hierarchical, heterogeneous, or homogeneous. Homogeneous networks are
    those that have only one kind of nodes and edges. A new spreader network (subgraph
    of a social network) of users is a network, where network itself'
