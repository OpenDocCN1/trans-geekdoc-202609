    # 7.4 Classification of Cybercrime


    Donalds and Osei-Bryan (2019) opine that current classification schemes while
    varied are consistently insufficient, fragmented, and often incompatible since
    the focus of each is on different perspectives or use varying terminologies to
    refer to the same concept, making consistent cybercrime classifications unlikely.
    The varying definitions of researchers due to differing academic backgrounds and
    goals have led to numerous proposed taxonomies (Choi, 2018; Madriaza & Palacio,
    2018; Wall, 2007). These taxonomies include comparisons to traditional crimes,
    assessment of victims, vectors of attacks, and technology used. Some are hybrid
    to create more intricate classifications. Among the existing classifications there
    are varying levels of overlap, however, there remains differences in contents,
    definition, and structure (Ghernaouti & Simms, 2014). Somer (2019) indicates that
    there continues to be no consensus on developing a single taxonomy of cybercrime.


    The overlap of classifications is seen in the extant literature, which categorizes
    cybercrime based on the computer''s relationship to the crime. The most well known
    of Wall''s (2001) early three-category typology, which divides cybercrimes into
    the following categories: cyber-trespass (e.g., hacking), cyber deception and
    theft (e.g., identity theft), cyber-porn and obesity (e.g., exploitation), and
    cyber-violence (e.g., cyberstalking) This typology by Wall (2001) can be simplified
    as crimes in the device, using the device and crimes against the device (Madriaza
    & Palacio, 2018; Wall, 2007). Crimes in the device relate to where the device''s
    content is prohibited or illegal and can lead to violence or hate crimes. Crimes
    using the device apply to where technology is used to engage or deceive the intended
    victim, that is, crimes against the individual (Wall, 2005). The final category
    of crimes against the device relates to situations where the device, system or
    network is compromised by directly attacking the factors of Confidentiality, Integrity,
    and Availability, is is called the CIA triad (Madriaza & Palacio, 2018; Mohanty
    et al., 2008). Subsequently, Yar (2006) added another activity to the four previously
