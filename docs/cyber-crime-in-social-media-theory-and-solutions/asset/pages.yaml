    # 1.3.2 User-related Theories


    These theories talk about the features or characteristics of people who take part
    in fake news activities such as publish, share/like, and comment. Pony news, unlike
    fake news, “attract” both malevolent and nonmalicious users. Malicious users (e.g.,
    certain social bots propagate bogus news purposefully and are driven by rewards.
    Some regular people (who we refer to as susceptible normal users) might mistakenly
    and routinely transmit bogus news without realizing it. Such psychological sensitivity
    reflects from both societal and self-impact (Hovland et al., 1957; Jindal and
    Liu, 2008; Kahneman and Tversky, 2013a; Ferrara et al., 2016; Shao et al., 2018).


    **Conservatism bias:** Individuals who are conservative to overestimate base rates
    and underreact to sample evidence. In conclusion, they fail to react in the same
    way a logical person would in the face of fresh data (Pompian, 2012).


    **Semmelweis reflex:** The Semmelweis reflex is a behavioral propensity to hold
    onto prior beliefs before dismissing new ideas that contradict (despite adequate
    evidence) (Bálint and Bálint, 2009).


    **Echo chamber effect:** Echo chamber effect is a phenomenon, in which “beliefs
    of people are amplified or reinforced by repeated communication inside a closed
    environment/group” (Hayes, 2009).


    **Bandwagon effect:** A psychological phenomenon in which people do the things
    because it is being done by others, without thinking about their own convictions.
    A herd mentality is defined as people''s ability to match/similar their thoughts
    and behavior with others in the group. The term “wagon effect” comes from political
    theory, but its applicability is lieber such as consumption and investment behavior
    of people (Leibenstein, 1950).


    **Normative influence theory:** Social influence that leads to compliance is known
    as normative social influence. In social psychology, it is described'
