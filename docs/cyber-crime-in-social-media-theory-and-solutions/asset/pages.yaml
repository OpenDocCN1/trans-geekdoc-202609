    # 6.3 Methodology


    This section describes the details of the dataset used in the current work as
    well as the details of the proposed approach.


    # 6.3.1 Dataset Collection, Labelling, and Preprocessing


    Data containing textual comments for the current research have been collected
    and labeled by ourselves from the freely released posts (discussion posted on
    the Reddit site from December 2005 to March 2017, freely released by the Reddit
    team.). The available data were comprehensive and covered a variety of topics.
    In order to gather probable information on bullying discussion, we use a naive
    approach to count cess (swear) words from the comment body to ensure that cuss
    words is more than equal to three words, we distinguished them as a bullying remark.
    Further, we manually checked those patterns and filtered bullying trace. From
    those traces, we collected all discussion to a specific thread which we named
    as sequence of bullying comments. Four undergraduate students are manually labelled
    each comments of the dataset into two categories, that is, bullying or non-bullying.
    Next, we labelled each discussion of bullying is resolved or still on ongoing
    problem from the bullying pattern.


    To get more meaningful information, we have removed all stopwords of English language
    from the comment by using Natural Language Toolkit.⁵ The details of dataset are
    given in Table 6.1.


    Initially, there was around an average of 2,197,500 (per month) crawled unprocessed
    data instances in hand. It was a comprehensive dataset of all the comments posted
    on Reddit from the December of the year 2005 to the March of the year 2017. The
    data available was diverse and it covered a variety of topics to make a proper
    large dataset that can give desirable results. The dataset initially was available
    in bz format. To follow further processing data was converted into CSV format.
    The dataset was still not fit for research and training as it was of very huge
    size. The size of the whole data was 354 GB, the size of per month data can come
