  md: '# Cybercrime in Social Media


    Cybercriminals may steal and resell data belonging to a person or an organization.


    Social networking services have been around for almost a decade. These websites
    have had a significant influence in both personal and professional contexts. Individuals
    may now use them to express themselves and organize for a worldwide revolution,
    rather than just keeping contact with old pals. Popular social networking services
    include Facebook and Twitter. Cybercriminals are using social media to perpetrate
    cybercrimes, putting personal and national security in danger due to these platforms’
    rapid expansion and influence. According to the National Investigation Agency,
    every six cybercrime in India is committed through social media. Between 2013
    and 2015, cybercrime rose by more than 70%, according to the National Crime Records
    Bureau (NCRB). According to Symantec, a security solutions provider, cyber targeting
    social media in India was second only to the United States in 2014. Identity theft,
    defamation, invasion of privacy, obscurity, and cyber terrorism are examples of
    today’s cybercrime (Pandey, 2017).


    Cybersecurity specialists are becoming more challenging to secure the global cyberspace
    as the number of internet-enabled devices rises rapidly. The internet’s pervasiveness
    in our daily lives, from banking to commerce to personal communication, has left
    us vulnerable to privacy and security threats. This is becoming a matter of major
    concern to spot and identify cybercrime, so as to protect oneself from the fraudulent
    practices. The current chapter is an attempt to examine the level of awareness
    of youth in relation to cybercrime while using various social media platforms.


