  md: '# 2.7 Result and Discussion


    The primary purpose is to investigate the degree of perception of social media
    crimes among India’s young group. The opinion differentials among youth after
    altering dem were explored using six hypotheses. All of the investigated hypotheses
    were statistically significant, resulting in the rejection of the null hypothesis
    and acceptance of the alternative hypothesis.


    +   1. The rejection of hypothesis H₀ suggests a difference in opinion for information,
    experience, and cybercrime among various age groups. It is worth noting that the
    mean scores for all aspects were shown to rise with the respondents'' age group.
    This indicates that adolescents in their early years are less conscious of cybercrime.
    They have less experience and are less knowledgeable about the situation. However,
    as kids get older, they become more mature and aware of all the components.


    +   2. The study''s hypothesis H₀ sought to determine the perceptual difference
    between female and male respondents for information, experience, and cybercrime.
    The hypothesis is rejected, indicating a statistically significant difference
    in score between the two groups. It is worth noting that female respondents had
    higher scores when the mean score for both groups was compared. As a result, female
    respondents are more knowledgeable and experienced, and they are more conscious
    of cybercrime than their male counterparts.


    +   3. Differences in opinion were also examined for various levels of family
    income, which were evaluated in the hypothesis (H₀), and the hypothesis was found
    to be rejected. The results indicated a statistically significant difference in
    the mean score of different income categories of households. When the mean scores
    for low-, medium-, and high-income groups were compared, it discovered that the
    scores for information, experience, and cybercrime dimensions were highest for
    the high-income group and lowest for the medium-income group, with the score for
    lower-income group falling in the middle of both of these groups. It indicates
    that individuals from better-income families are more informed and have more excellent
    expertise in dealing with social media platforms about cybercrime. Youth from
    lower-income families are somewhat aware of the issue. However, individuals from
    middle-income families have low knowledge levels and are less vulnerable to cybercrime
    through social media platforms.


    +   4. Hypothesis H₀ provided a comparison of social media platform user groupings.
    The rejection of the hypothesis indicated that the difference in information,
    experience, and cybercrime score between high and low social media use was statistically
    significant. It is worth noting that'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'most social media users are better informed and have more expertise. Their
    knowledge of social media cybercrime is likewise more significant than the lesser
    usage group.


    +   5. The hypothesis $H_0$ which sought to determine the perceptual differences
    between rural and urban adolescents regarding information, experience, and cyber
    score, was rejected. As a result, we may conclude a statistically significant
    difference in scores between these two groups. A comparison of mean scores reveals
    that urban adolescents are more information seekers and have a higher level of
    exposure than their rural counterparts. Furthermore, their knowledge of social
    media cybercrime is greater than that of the rural group.


    +   6. Hypothesis $H_0$ contrasts respondents'' information, experience, and cybercrime
    score across different levels of schooling. The findings revealed a statistically
    variation in perception for respondents with varying levels of education. When
    mean scores for all domains were compared, postgraduate groups had the highest
    mean score, followed by undergraduate groups, while those with 10-12th-grade schooling
    had the lowest score. It is incredible that as young people'' levels of education
    growth, so do their knowledge and sensitivity to social media cybercrime. Thus,
    a greater level of education is required to raise awareness among the young about
    social media platforms and cybercrime.


    # 2.8 Contribution of the Study


    The article is novel in its approach as it determines the existing level of awareness
    for increasing the level of awareness among youth in India. Further, it adds to
    the existing literature as few are available in the same area. All the collected
    data pertaining to the research in this study were made after obtaining the information
    consent from the participants, and there is no conflict of interest among the
    authors. The authors used their own resources for the execution of this study,
    and no funding was obtained from external agencies in this regard.


    # 2.9 Conclusion


    Individuals and society have suffered as a result of the increase in cybercrime,
    which has resulted in enormous financial and monetary losses. It is not only'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'corrode well, but it also calls into question the efficiency of government
    and legislative operations. As the number of individuals who use social media
    platforms rises, the possibility that they be exploited. Youth are the most regular
    users of social media, and as a consequence, they are more vulnerable to fraudulent
    practices than other groups. As a consequence, it is vital that they have a thorough
    understanding of the issue. The article performed a survey to establish young
    people''s level of understanding about cybercrime and uncovered some intriguing
    outcomes. Females were shown to have a higher level of awareness than men, and
    the level of awareness increased with age. Users in urban areas were shown to
    be more aware than those in rural regions. Higher usage rates and income groups
    were shown to be more conscious of their surroundings. Higher education has resulted
    in a rise in cybercrime knowledge among young youngsters.


