    # 1.4.1.2 (Knowledge-based) Crowd-crowdsourced Manual fact-checking


    It entails a huge number of ordinary people participating as experts/factcheckers
    (that is a collective effort). A huge population of fact-checkers may be found
    on popular crowd-sourcing marketplaces like Amazon Mechanical Turk, which has
    been used to create CREDBANK, a publicly available largescale news dataset (Mitra
    and Gilbert, 2021). Crowd-sourced factchecking is more difficult to administer
    than expert-based fact-checking. It has low credibility and accuracy due to fact-checkers''
    political bias and contradictory annotations, but greater scalability (but not
    sufficient). As a result, filtering non-credible people and resolving contradictory
    fact findings are frequently required in crowd-sourced fact-checking.


    Many websites have recently developed to better serve the public by allowing expert-based
    fact-checking. The websites for fact-checking crowdsourcing are in beginning stage
    of development. Fiskkit, for example, allows users to submit articles, rate phrases
    within them, and pick categories that best characterize the pieces. Article sources
    distinguish between different categories of material (e.g., news vs. non-news)
    and establish its reliability.


    # 1.4.1.3 (Knowledge-based) Automatic Fact-checking


    With the advent of social media platform, the manual fact-checking is not sufficient
    to deal with the high volume of generated information. Automatic fact-checking
    systems, which mainly rely on information retrieval, natural language processing
    (NLP), and learning techniques, as well graph theory, have been developed to solve
    scalability issue (Nickel et al., 2016).


    For the purpose of representing/validating correct fact, the first requirement
    is to represent the existing knowledge in some way, so that computer easily extract
    knowledge automatically and represent the same for latter use efficiently. The
    first step is to establish a standard representation of knowledge. This representation
    of knowledge has to have a form that can be processed by computer programs automatically.


    One way to represent information as “a set of (Subject, Predicate, Object) SPO
    triplets accurately reflect the information. This triplet is a representation
    of “knowledge”. Therefore a fact is a triplet (SPO) as truth. The set of these
    triplets is termed as knowledge base (KB). A graph structure that represents SPO,
    nodes representing entities and edges indicating associations (i.e., predicates),
    is termed as knowledge graph (KG).'
