    To vectorize the statements, we used tf-idf vectorization. tf-idf stands for term-frequency
    inverse frequency. It normalizes the number of times a particular term appears
    in the document by dividing the word count in a sentence by the times that word
    has appeared throughout the dataset.


    ```

    tf(t,D) = \frac{f_d(t)}{\max_{w\in D}f_d(w)}

    idf(t,D) = \ln \frac{|D|}{\|}{\{d \in D : t \in d\}|}\ntfidf(t,d,D) = tf(t,d)
    \cdot idf(t,D)

    tfidf''(t,d,D) = \frac{idf(t,D)}{|D|} + tfidf(t,d,D)

    f_d(t) := frequency of term in document

    D := corpus of documents

    ```


    # 4.3.6 Model Description


    The model consists of three units: the pre-processing unit, the feature extraction
    and data balancing unit, and the classification unit. In the pre-processing unit,
    the dataset is cleaned up by removing unwanted text portions, expanding the abbreviations,
    and using lemmatization to convert words to their root words. The output of this
    step is fed to the feature extraction unit that uses the tf-idf vectorization
    technique to identify the importance of specific words or phrases. Therefore,
    the sentences in the dataset are converted to vectors of different values. The
    vectors are then used to balance the dataset using data-balancing methods'
