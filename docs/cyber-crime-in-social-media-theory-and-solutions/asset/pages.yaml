    House Dem Aide: We Didn''t Even See Comey''s Letter Until Jason Chaffetz Tweeted
    It:


    [title] House Dem Aide: We Didn''t Even See Comey''s Letter Until Jason Chaffetz
    Tweeted It By Darrell Lucus on October 30, 2016 Subscribe Chaffetz on the stamp
    in American Fork, Utah (image courtesy Michael Jolley, available under a Creative
    Commons-BY license)

    With apologies to Kaiser Liebermann, there is no doubt who the Worst in the World
    is this week-FBI-agent Jason Chaffetz. But according to a House Democratic aide,
    it seems we also know that the second-worst person is all. It turns out that Comey
    sent his non-favorous letter announcing that the FBI was looking into emails related
    to Hillary Clinton''s emails deleted about her committee.

    As we know, Comey notified the Republican and Democratic ranking members of the
    House Intelligence, Judiciary, and Oversight committees that his agency had recently
    discovered in order to see if they contained classified information. Now long
    after this letter went out, the committees set ablaze with fire. FBI Dir just
    informed me, "The FBI has learned of the existence of emails that appear to be
    pertinent to the investigation.

    Case recognized

    - Jason Chaffetz (@jasoninthehome) October 26, 2016 - Comey was actually saying
    that it was reviewing the emails in light of "unrelated case-" which he now knew
    to be Anthony Weiner. But apparently so little things as facts didn''t matter
    to Chaffetz. The Utah Republican had already voted to initiate a raft of investigations
    on Hillary-wins at least two years'', and possibly an entire term of their. Apparently
    Chaffetz thought the credit for his-reward tweet that rolled the nation for cooler
    heads realized was a duty.

    But according to a senior House Democratic aide, misreading that letter may have
    been the least of Chaffetz''s sins. That aide told Sherblue that his boss and
    Democrats didn''t even see Comey''s letter at the time the committee met. In fact,
    the Democratic Ranking Members didn''t receive it until after the Chairman of
    the Oversight and Government Reform Committee, Jason Chaffetz, tweeted it out
    and made it public.

    So let us see if we can. The FBI Director tells the chairs and other GOP committee
    chairman about a major development in a potentially politically explosive investigation,
    and neither Chaffetz nor his colleagues had the courtesy to let their Democratic
    counterparts know about it instead, according to this aide, he made them find
    out it on Twitter.


