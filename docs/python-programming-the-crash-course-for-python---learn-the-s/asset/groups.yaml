    这也帮助我们对这里可能出现的任何真阳性或假阳性结果获得一些深刻的见解。但在某些情况下，使用一个比我们目前讨论的更简洁的指标会更好。


    为了帮助我们解决这个问题，我们首先需要花些时间来看代码带来的**精确率（Precision）**。这个精确率指标将告诉我们正类中准确的程度。这仅仅意味着它为我们提供一个概念以及一个衡量标准，即正类预测实际上准确的概率。为了帮助你在自己的矩阵中检查这一点，你需要使用以下代码：


    Precision = TP/(TP + FP)


    在这里你可以得到的最高分是1。这表示分类器完美地正确预测了正值。单看精确率可能没有那么帮助，因为它忽略了负类。这个指标你可能想要与**召回率（Recall）**指标配合使用。召回率也称为敏感性（Sensitivity）或真阳性率（True
    Positive Rate）。


    我们接下来需要看的是敏感性。这种敏感性非常重要，因为它可以帮助我们计算算法能够正确检测出的正类比例。这个指标是建模和观察正类的一种良好方法。计算敏感度的公式是：


    Recall = TP/(TP + FN)


    ## 如何在 TensorFlow 中使用线性分类器


    记得我们之前我们讨论过 TensorFlow 以及它随之而来的这一切吗？现在是时候更进一步，看看你实际上如何使用 TensorFlow，以及你如何通过这个
    Python 库真正利用机器学习来实现一些了不起的事情。


    现在是时候让我们看看通过 TensorFlow 库使用线性分类器可以完成的一些实际工作了。我们将以人口普查数据（census data）为例来说如何操作。执行这些步骤的目的是确保你使用人口普查数据集中的变量，以便我们可以查看已有的参与者，并对他们的收入做出预测。注意，在这个示例中，收入将成为我们的二分类变量。


    为了让这个模型生效，当个人的年收入高于 50,000 美时，我们将二分类变量设置为1。但如果某个参与者的年收入低于 50,000 美，那么他们的变量将显示为
    0。我们在这里处理的数据集可以分为分类变量，总共八个。这些包括：


    - 祖籍国家（Native country）

    - 性别（Sex）

    - 种族（Race）

    - 关系（Relationship）

    - 职业（Occupation）

    - 婚姻状况（Marital status）

    - 教育程度（Education）

    - 以及工作地点（place of work）


    在此基础上，我们来看六个连续变量。这些包括：


    - 每周工时（Hours_week）

    - 资本损失（Capital_loss）

    - 资本收益（Capital_gain）

    - 教育年限（Education_num）

    - 最终权重（Fnlwgt）

    - 年龄（Age）


    利用这些信息，我们可以调用 TensorFlow 扩展来帮助确定哪些客户（或数据集中的任何个人）将符合我们设置的两个分组。这些人将被分为我们之前设置的两个组（尽管你可以根据正在运行的程序类型添加任意数量的组）。在这个例子中，这两个组是根据个人的年收入高于或低于
    50,000 美元划分的。


    完成后，你就可以查看形成的组，并发现其中的一些背景信息，包括性别、种族、居住地、职业以及更多信息。这是许多企业正在转向并比以往任何时候都更加依赖的工具，因为它帮助他们了解新客户、潜在客户以及回头客，并提高整体的营销效率。


    ## 判别模型和生成式模型之间有什么区别？


    当我们处理线性分类器中找到某些参数时，会出现我们需要处理的两个独立类别或方法，这些方法目前是宽泛的，旨在帮助你确定参数应该设置在哪里。你拥有的选项是生成式模型（Generative
    model）或判别模型（Discriminative model）。


    符合生成式模型的方法被认为是条件密度函数。你将看到的这种算法的两个最大例子是类似于线性判别分析（Linear discriminant analysis）。这类似于朴素贝叶斯分类器（Naïve
    Bayes Classifier）或高斯条件密度模型。


    然后，程序员也有选择去使用所谓的**判别模型（Discriminative model）**。这些模型非常重要，因为它们的设计目标是确保当你进行新的一组训练时，输出结果尽可能高质量。训练中额外的术语可能是必要的，但这会增加整体成本，并可能对你的最终模型执行所谓的“正则化（Regularization）”。好消息是，该模型将为你提供几个选项以便于操作，这些选项包括：


    - 1. 逻辑回归（Logistic regression）：在假设观测到的训练集是由依赖于分类器输出的二项模型生成的条件下，这是线性分类器的似然估计。

    - 2. 感感知机（Perceptron）：这是你将使用的一种算法，因为它会尝试遍历并修复任何所有的错误。

    - 3. 支持向量机（Support vector machine）：这是我们之前讨论过的选项之一。它能够尽可能地极大训练集中样本与决策超平面之间的间隔。


    尽管名字如此，LDA（线性判别分析）并不属于判别模型。然而，当你能够将其与某些其他算法（例如主成分分析 PCA）进行比较时，LDA 是意义的。你会发现 LDA
    算法属于监督学习，并能够利用标签，但 PCA 是一种无监督学习算法，它刻意忽略了存在的标签。


