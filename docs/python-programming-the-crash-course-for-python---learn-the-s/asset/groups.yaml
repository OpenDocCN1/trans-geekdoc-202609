    to make predictions and can get stronger the more times they are exposed to inputs
    and can learn from them. Now we are going to take that a bit further and discuss
    another topic that is along the same lines, the idea of recurrent neural networks.


    When we are doing a study of the human brain, it is reasonable to know that when
    we think, this process isn’t going to restart from nothing every few seconds.
    We are going to keep building on what we were able to learn in the past. We remember
    what we learned as a child, or even yesterday when we went through a new process.
    And we can retain that information for a long time to come. We don’t have to relearn
    how to brush our teeth each day, we just remember how to do that so we can focus
