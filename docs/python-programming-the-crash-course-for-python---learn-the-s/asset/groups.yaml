    as possible, please enjoy!


    ## Chapter 1: What is Deep Learning and Artificial Intelligence


    There are a lot of different parts that can come with coding and working with
    computers in our modern world. Many people feel that if they don''t know how to
    do a complicated kind of coding, then they are not going to be able to do any
    at all. But this is just not true. There are many complex types of programming
    that you are able to do, and they are easier to complete than you may think. And
    in this guidebook, we are going to take some of our time to discuss many of them.


    To start out with in this chapter, we are going to take a look at deep learning
    and artificial intelligence. Both of these are going to be integral parts when
    we are looking at some of the topics that are in this guidebook, and knowing how
    to make them work, and what all we are able to do with them can make a difference
    in our coding and what we are able to do in the process. Some of the things that
    we need to know concerning deep learning and artificial intelligence will include
    the following:


    ### What is deep learning


    The first topic that we are going to spend some time on in this chapter is going
    to be deep learning. Deep learning is actually a type of machine learning (we
    will discuss more about that in the next chapter), that is going to be responsible
    for training our computer how to perform some of the life tasks that humans do.
    There are a variety of tasks that could fall into this category, but things like
    recognizing speech, identifying what is inside a picture, and making predictions
    can all fit into this idea.


    Instead of organizing the data to run through equations that are already defined,
    deep learning is going to set up some of the basic parameters that you need for
    the data, and then will train the computer to learn on its own by being able to
    see the patterns through many different layers of processing.


    Let''s dive into this a bit more. Deep learning is important here because it is
    going to be a foundation of AI, or artificial intelligence, and the current interest
    that we are seeing in this deep learning is due to how it is related to AI. Deep
    learning and some of the techniques that come with it have been able to improve
    the ability of machines to describe, detect, recognize, and classify things in
    a way that was previously thought to only work for humans.


    A good example of this is all of the different things that deep learning is already
    able to do in our world. We can find that many of the algorithms and techniques
    that work with it are great at describing the content that it is going to look
    through, at detecting objects, and recognizing the speech patterns of those using
    it, while recognizing what is inside one of the images that you present to it.
    There are many pieces of technology that use this, such as fraud detection, facial
    recognition, and systems like Cortana and Siri to name a few.


    There are already a few developments who are working on advancing what we see
    with deep learning. Some of these are going to include:


    - 1. The improvements that have been done on some of the algorithms have been
    able to boost up some of the methods that we see with deep learning.

    - 2. There are some newer approaches to deep learning that have ensured that the
    accuracy of the models is going to stay intact.

    - 3. There are even some neural networks that have new classes that are developed
    to fit well for some new applications, including the classification of images
    and the translation of text.

    - 4. There is a ton of information available from companies, much more than was
    there in the past. This helps us to build up some new neural networks with a lot
    of deep layers, including streaming data, physicians notes, investigative transcripts,
    and even some textual data that you could get from social media.

    - 5. There are also some computational advances of distributed cloud computing
    and graphics processing units which can give us all of the computing power that
    is needed in order to make sure the algorithms for deep learning can actually
