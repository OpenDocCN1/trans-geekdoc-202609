    理解这些可能是一项挑战。而且你目前进行的工作可能还没有进展多远，那么你该如何展示所有的这些信息呢？


    取决于你所关注的问题类型，你可能会有数百万个不同的数据点需要处理，在模型的早期阶段，很容易理解你为何会被这些信息淹没，但你仍然可以采取一些步骤来让每个人满意，并展示你将如何使用模型，即便是对于那些可能无法理解所有技术细节、但需要知道信息发生了什么的人也是如此。但这一切是如何实现的呢？


    我们将使用朴素贝叶斯（Naïve Bayes）算法，这是一种你可以使用的算法，它确保程序人员能够留在模型的早期阶段，在展示你当时所需的任何所有信息的同时，保持一个易于理解的模型。


    让我们通过苹果的例子来观察它是如何工作的。当你拿起一个被认为是平均水平的苹果时，你可以很容易地说出它具有一些区分特征。这可能包括苹果是红色的、是圆形的、而且直径大约三英寸。虽然这些特征有时可以在其他类型的水果中找到，但当所有这些特征同时出现时，我们就知道手中的水果是一个苹果。这是一种基本的思维方式，但它是使用朴素贝叶斯的一个例子。


    朴素贝叶斯模型旨在让你易于构建，它有时被用于帮助你以简化的方式处理非常大的的数据集。使用这种模型的优势之一是，尽管它很简单，但与你可以使用的其他更复杂的模型相比，它有时更好用。


    随着你学习更多关于如何使用这种算法，你会开始发现有越来越多的理由去使用它。这个模型非常易于使用，特别是如果你是深度学习和机器学习世界的初学者。你还会发现，当需要对我们的数据集以及它们最终属于哪一类进行某些预测时，它是非常有效的。这让你在整个过程中更容易地保持一切尽可能简单。尽管朴素贝叶斯算法非常易于操作，但你会发现它的表现其实非常好。事实上，与现有的一些高级算法以及一些看起来更复杂的算法相比，这一个的表现将是最好的。


    虽然我们花了一些时间讨论了朴素贝叶斯算法带来的不同优势，但也有一些我们需要留注意的负面因素。这些负面因素中的第一个是，当你使用这种会处理分类变量的算法时，你必须确保测试的任何数据都没有经过一组数据的训练。该算法在它所做的某些预测以及其中的准确性方面也会遇到困难。朴素贝叶斯主要依赖概率而非准确性，因此在处理这些数据时请记住这一点。


    你可以采取几个步骤来帮助应对这个问题，并确保事情按照你意愿的方式进行，有时知道如何处理这些步骤会令人困惑，许多初学者并不喜欢这样做。


    当然，即使有这些负面因素，当你进行某些机器学习工作时，朴素贝叶斯仍然是一个很好的选择。但它并不能在你每次开始编程时提供你所需的一切。对于那些想要将他们的信息以简化的方式设置、易于阅读且不需要你添加许多复杂代码（至少目前尚且）的编码人员来说，朴素贝叶斯模型就是适合你的。


    ## 与回归算法工作


    我们在这里将要关注的第二个 Python 机器学习算法被称为回归分析（regression analysis）。当你想要查看代码中的两个变量——预测变量和因变量之间是否存在任何关系以及什么种类型的关系时，这种算法将为你提供帮助。


    当你想要确保在变量的预测部分或时间序列建模中是否存在因果关系时，这种技术通常效果良好。程序人员想要使用回归算法的原因是，它可以获取你拥有的信息，然后将其拟合到一条简单的曲线上，而且通常尽可能地拟合。可能会有一些点离这条线非常远，但这条线或曲线的设计是为了尽可能处理大多数数据点。


    你会发现，回归算法现在被许多公司使用，因为它对于添加任何所需信息、然后对其进行排序并查看其中包含什么非常有帮助。例如，你可以添加有关当前经济的信息，甚至是过去经济的信息，然后这种算法将给出一个输出，作为对未来事物将如何呈现的预测。不过，你必须确保提供给算法的信息是最新的且准确的，否则这种预测将完全不准确。


    许多程序人员会喜欢使用回归算法的一点是，你可以向其中添加所需的任何类型的信息。你可以添加信息帮助你了解对利润的某些预测，帮助你看到它对公司可能发生的销售增长所做出的任何估计。如果加入了正确的信息，它甚至可以用来告诉我们更多关于经济的情况、市场表现如何，以及未来可能如何表现。


