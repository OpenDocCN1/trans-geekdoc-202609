  md: 'physicists into neuroscience to improve tools to probe the brain. As we learn
    more about the brain, and especially about the mechanisms underlying learning
    and memory, we will have a much better understanding of the principles of brain
    function.


    Although much about the brain is known at the molecular and cellular levels, we
    have not yet achieved a comparable understanding of how the brain is organized
    at higher levels. We know that different types of information are stored in widely
    distributed parts of the cortex, but we don''t know how all the disparate pieces
    of information can be retrieved so quickly to solve a complex problem like recognizing
    the name of a person from the image of that person''s face, which is stored in
    different parts of the cortex. This question is closely tied to the origin of
    consciousness in brains.


    My lab recently discovered global patterns of activity in sleeping human brains
    that may give us insight into how pieces of information distributed broadly in
    the cerebral cortex are linked together. In a stage of sleep intermediate between
    restorative slow-wave sleep and rapid eye movement (REM) dream sleep, highly synchronized
    spatiotemporal oscillations called “sleep spindles” dominate cortical activity.
    These 10–14-Hertz oscillations last for a few seconds and recur thousands of times
    during the night. There is experimental evidence that sleep spindles participate
    in memory consolidation while we are sleeping. In recordings from the human cortex,
    Lyle Muller, Sydney Cash, Giovanni Piantoni, Dominik Koller, Eric Halgren, and
    I discovered that sleep spindles are global, circular traveling waves of electrical
    activity that sweep through all sectors of the cortex (figure 15.7).12 We call
    them “Princess Leia waves” because they look like her hairstyle (figure 15.8).
    We speculated that sleep spindles may be a way for the cortex to integrate new
    information acquired during the day with previous memories, distributed widely
    in the cortex, by strengthening the long-distance connections between them. This
    is one of many research projects at the level of systems neuroscience spurred
    on by the BRAIN Initiative.


