    Another shortcoming of networks with spiking neurons is that gradient descent,
    which has propelled learning in networks of continuously valued neurons, is not
    possible because of the discontinuities at the spike times. This limits the complexity
    of what a spiking network can be taught. Gradient descent has been hugely successful
    in training deep networks with model neurons that have continuously varying output
    rates, so that the output function is differentiable, an essential feature for
    the backprop learning algorithm. Although nondifferentiable spiking networks have
    discontinuities when a spike occurs, this drawback was recently overcome by Ben
    Huh, a postdoctoral fellow in my lab, who found a way to make recurrent network
    models of spiking neurons perform complex tasks over long temporal sequences using
    gradient descent.13 This opens the door to training deep spiking networks.


    # No More Moore’s Law?


    As predicted by Moore’s law, computer power has increased more than a trillionfold
    since digital computers were invented in the 1950s. Never before has any technology
    been able to grow exponentially through so many orders of magnitude, which has
    resulted in the embedding of computers into almost every manufactured device,
    from toys to automobiles. Computers can automatically adjust the adaptive optics
    of modern telescopes to maximize their resolution; they can analyze the photons
    captured by modern microscopes to localize molecules with super-resolution. Every
    area of science and technology is now dependent on VLSI chips.


    Carver Mead predicted the rise of these chips based on the potential for shrinking
    the line width on them, but the width has now reached a physical limit: there
    are too few electrons in the wires, and they tend to leak out or be blocked by
    random charges, making even digital circuits unreliable.14 Is Moore’s law no more?
    A radically different architecture is needed'
