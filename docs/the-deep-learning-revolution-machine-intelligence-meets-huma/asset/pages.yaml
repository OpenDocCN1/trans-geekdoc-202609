- pgno: 46
  md: 'funding for artificial intelligence. Although this was the beginning of an
    AI winter for mainstream researchers, it didn''t affect me or the rest of my group,
    for whom the neural network spring had just begun.


    But our new approach to AI would take twenty-five years to deliver real-world
    applications in vision, speech, and language. Even in 1989, I should have known
    it would take this long. In 1978, when I was a graduate student at Princeton,
    I extrapolated Moore''s law for the exponential increase in computing power, doubling
    every 18 months, to see how long it would take to reach brain levels of computing
    power and concluded it would happen in 2015. Fortunately, that did not deter me
    from charging ahead. My belief in neural networks was based on my intuition that
    if nature had solved these problems, we should be able to learn from nature how
    to solve them, too. The twenty-five years I had to wait was not even a blink of
    the eye compared to the hundreds of millions of years it took nature.


    Inside the visual cortex, neurons are arranged in a hierarchy of layers. As sensory
    information is transformed cortical layer by cortical layer, the representation
    of the world becomes more and more abstract. Over the decades, as the number of
    layers in neural network models increased, their performance continued to improve
    until finally a critical threshold was reached that allowed us to solve problems
    we could only dream about solving in the 1980s. Deep learning automates the process
    of finding good features that distinguish different objects in an image, and that
    is why computer vision is so much better today than it was five years ago.


    By 2016, computers had become a million times faster and computer memory had increased
    by a billion times from megabytes to terabytes. It became possible to simulate
    neural networks with millions of units and billions of connections, compared with
    networks in the 1980s that had only hundreds of units and thousands of connections.
    Though still tiny by the standards of a human brain, which has a hundred billion
    neurons and a million billion synaptic connections, today''s networks are now
    large enough to demonstrate proof of principle in narrow domains.


    Deep learning in deep neural networks has arrived. But before there were deep
    networks, we had to learn how to train shallow networks.'
