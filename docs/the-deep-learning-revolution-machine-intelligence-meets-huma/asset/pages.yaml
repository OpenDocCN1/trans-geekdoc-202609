    performance. The misleading intuition that it would be easy to write a computer
    vision program is based on activities that we find easy to do, such as seeing,
    hearing, and moving around—but that took evolution millions of years to get right.
    Much to their chagrin, early AI pioneers found the computer vision problem to
    be extremely hard to solve. In contrast, they found it much easier to program
    computers to prove mathematical theorems—a process thought to require the highest
    levels of intelligence—because computers turn out to be much better at logic than
    we are. Being able to think logically is a late development in evolution and,
    even in humans, requires training to follow a long line of logical propositions
    to a rigorous conclusion, whereas, for most problems we need to solve to survive,
    generalizations from previous experiences work well for us most of the time.


    # Expert Systems


    Popular in the 1970s and 1980s, AI expert systems were developed to solve problems
    like medical diagnosis using a set of rules. Thus an early expert system, MYCIN,
    was developed to identify the bacteria responsible for infectious diseases such
    as meningitis.4 Following the expert system approach, MYCIN''s developers had
    first to collect facts and rules from infectious disease experts, as well as symptoms
    and medical histories from the patients, then to enter these into the system''s
    computer, and finally to program the'
