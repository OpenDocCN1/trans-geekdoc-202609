    University. Geoffrey Hinton is in the first row, third from right, flanked by
    Terry Sejnowski and James McClelland. This photo is a who’s who in neural computing
    today. Neural networks in the 1980s were a bit of twenty-first-century science
    in the twentieth century. Courtesy of Geoffrey Hinton.'
