  md: '# Francisco Crick in Paradiso


    Born and educated in South Africa, Sydney Brenner participated in the early days
    of molecular genetics at Cambridge University (figure 18.1). He shared an office
    at the Laboratory of Molecular Biology (LMB) with Francis Crick. What do you do
    for your next project after discovering the structure of DNA and working out the
    genetic code? Francis decided to focus on the human brain, and Sydney inaugurated
    a new model organism, *Caenorhabditis elegans* (*C. elegans*), a roundworm that
    lives in the soil, is only 1 millimeter long, and has only 302 neurons. This nematode
    has served as the starting point for many breakthroughs in understanding, by following
    every cell in the body over time, how a creature develops from an embryo, for
    which Sydney shared the Nobel Prize in Physiology or Medicine in 2002 (with H.
    Robert Horvitz and John E. Sulston). Brenner also is famous for his wit. In his
    Nobel speech, he praised the worm: “The title of my lecture is ‘Nature’s gift
    to Science.’ It is not a lecture about one scientific journal paying respects
    to another, but about how the great diversity of the living world can both inspire
    and serve innovation in biological research.”¹ Sydney Brenner, it would seem,
    was present at the Creation.


    The three lectures given by Brenner at the Salk Institute under the series title
    “Reading the Human Genome”² in 2009 were tour de forces, delivered without a single
    slide or prop. Noting that no human, but only computers, had ever read the entire
    human genome, base pair by base pair, Sydney took it as his goal to do just that,
    and when he did, he discovered all sorts of interesting similarities between stretches
    of DNA in different genes and across species.


    Sydney is peripatetic. He has an experimental project in Singapore; he was the
    founding president of the Okinawa Institute of Science and Technology; and he
    is a senior fellow at the Janelia Research Campus at the'
