    mathematician who once described how he finally solved a difficult mathematical
    problem he had been working on intensively for weeks without success. He took
    a vacation. As he was stepping onto a bus in the south of France, the solution
    to the problem suddenly came to him, unbidden, from a part of his brain that had
    continued to work on the problem while he was enjoying his vacation. He knew he
    had the right path to a proof and completed it when he returned to Paris. His
    intensive work on the problem before had prepared his brain so that his unconscious
    could work on it while he was relaxing. Both phases are equally important for
    creativity.


    Surprisingly, your brain can work on a problem even while you’re sleeping and
    not aware of anything. But it does this only if you concentrate on trying to solve
    the problem before falling asleep. In the morning, as often as not, a fresh insight
    will pop into your mind that can help you solve the problem. The intense effort
    before a vacation or falling asleep is important for priming your brain; otherwise,
    it’s just as likely to work on some other problem. There is nothing special about
    math or science in this regard—your brain will work just as hard solving social
    problems as on math and science problems if that is what has been on your mind
    recently.


    One of the most satisfying outcomes from “Learning How to Learn” was receiving
