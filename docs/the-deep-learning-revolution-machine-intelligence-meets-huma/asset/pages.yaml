  md: '# 11 Neural Information Processing Systems


    Tracing the origins of ideas is difficult because science is a collective activity
    of many individuals often widely distributed over space and time. The Neural Information
    Processing Systems (NIPS; figure 11.1) conferences have been a thread throughout
    the narrative of this book, and, by now, it should be clear that these conferences
    have had an enormous influence not only on me but on the field as well.¹ My future
    wife, Beatrice Golomb, gave her SEXNET talk at an early NIPS conference (1990),
    and it was at another, shortly after we married, that we almost broke up. NIPS
    conferences are total immersion, with formal sessions during the day and poster
    sessions in the evening, going strong well past midnight. When I came back to
    our room from one such session at 3 a.m. and could not find Beatrice, I knew I
    was in trouble. We are still together after twenty-eight years.


    Deep learning has a long bloodline that can be traced to the annual NIPS conferences
    and workshops and to earlier pioneers. In the 1980s, a diverse group of engineers,
    physicists, mathematicians, psychologists, and neuroscientists came together at
    the NIPS conferences to build a new approach to artificial intelligence. Rapid
    progress was spurred by advances made by physicists analyzing neural network models,
    psychologists modeling human cognition, neuroscientists modeling neural systems
    and analyzing neural recordings, statisticians exploring large data sets in high-dimensional
    spaces, and engineers building devices that could see and hear like humans.


    There were 400 attendees at the first NIPS conference in 1987 at the Denver Tech
    Center. Academic conferences typically focus on narrow areas of research, which
    are comfortable because everybody speaks the same jargon, but the scientific diversity
    at early NIPS conferences was truly breathtaking. Biologists speak in code when
    they are giving a talk to other biologists.² It is even worse with mathematicians
    and physicists, who talk only in equations. Engineers are somewhat better because
    they build things that speak for themselves. But because of these cultural barriers,
    interdisciplinary'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'research, though universally hoped for, is seldom achieved. At the early NIPS
    conferences, it was as if everyone was speaking in tongues.


    After the main conference in 1987, the attendees convened to a workshop at Keystone,
    a nearby ski resort, and self-organized into smaller group meetings on the spot.
    This is where communication between disciplines really began, in a more informal
    setting. I vividly remember a neuroscientist suggesting we have a workshop on
    the sea slug Aplysia while in a hot tub at Keystone.3 The gentleman next to me
    in the hot tub from the Department of Defense was probably wondering what Aplysia
    had to do with national security. Today, however, NIPS workshops are miniconferences
    with posters, some of which attract thousands of attendees.


    What kept NIPS together year after year was, first, the excitement in the air
    that we were on the verge of solving difficult computational problems based on
    biologically inspired learning algorithms and, second, Ed Posner (figure 11.2),
    an information theorist at Caltech and the chief technologist at the Jet Propulsion
    Lab, who had a long-term vision for the field and founded the Neural Information
    Processing Systems Foundation to manage the conferences.


    The culture of an organization is often a reflection of its founder; Ed gave NIPS
    a unique combination of wisdom, practical smarts, and sense of humor. He was an
    inspiring teacher and effective leader and was beloved at


