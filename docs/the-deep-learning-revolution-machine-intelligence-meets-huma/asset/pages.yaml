    # Predictive Coding


    In a communication system, change has high information value, whether the change
    is across space or over time. An image with uniform intensity carries little information,
    and neither does a signal that is not changing. Sensors that send signals to the
    brain mainly detect change, and we have already seen examples in the retina in
    chapter 5 and Tobias Delbrück’s DVS camera in chapter 14. Once stabilized on the
    retina, images fade away after a few seconds.⁷ Though we are unaware of it, our
    eyes make tiny jumps called “microsaccades” several times a second, each jump
    refreshing our internal model of the world. When something moves in the world,
    retinas duly report that upstream, and their reports update the brain’s world
    model, an operation diagrammed in figure 15.5. The brain’s model is a hierarchical
    one, and comparison between the incoming sensory information and the expectations
    of the model take place at multiple levels.⁸ A bright flash or loud noise gets
    your immediate attention by bottom-up saliency.'
