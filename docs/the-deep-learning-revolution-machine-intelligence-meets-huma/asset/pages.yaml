  md: '# # Neuromorphic Engineering


    In 1990, as a Fairchild distinguished scholar on sabbatical at Caltech, I enjoyed
    sitting in on lab meetings, especially those of Christof Koch, a computational
    neuroscientist with shared interests, and his colleagues, and of Carverand—Carver
    Mead’s research group—one of whose amazing projects was a silicon cochlea, which
    had frequency-tuned circuits similar to those of the cochleas in our ears. Other
    researchers were working on silicon synapses, including silicon mechanisms for
    synaptic plasticity, so that long-term changes in weights could be implemented
    on silicon chips. Students from Carverland have since gone forth and populated
    engineering departments around the world.


    In 1993, Christof Koch, Rodney Douglas, and I founded the Workshop on Neuromorphic
    Engineering, sponsored by the NSF, which continues to meet every July for three
    weeks in Telluride, Colorado. The workshop is international, with students and
    instructors coming from many different backgrounds and countries. Unlike most
    workshops, which are more talk than work, the Telluride workshop has rooms filled
    with students working on microchips and using them to build robots. There was
    a problem, though, with connecting a retina chip to a visual cortex chip, and
    cortex chips to motor output chips—too many wires were needed to connect them.


    A far better alternative to connecting up analog VLSI chips is to use spikes,
    which is what our brains do through the long-distance axons of the white matter
    that makes up half of the cerebral cortex. But it would not be feasible to connect
    up a retina chip and a cortex chip with a million wires. Fortunately, fast digital
    logic can be used to multiplex each wire, allowing many retinal cells to communicate
    with many cortical cells on the same wire. This is done by transmitting to the
    receiving chip the address from each originating spike in the sending chip, which
    is then decoded and routed to the units it connects to in what is called “address
    event representation.”


    Now at the University of Zurich’s Institute of Neuroinformatics, Tobias Delbrück
    (figure 14.4, top) was one of Carver Mead’s graduate students.<sup>7</sup> In
    2008, he developed a highly successful spiking retina chip called the “Dynamic
    Vision Sensor” (DVS) that greatly simplified tasks such as tracking moving objects
    and locating objects in depth with two cameras (figure 14.4, bottom).<sup>8</sup>
    Conventional digital cameras are frame based, storing a sequence of 26-millisecond
    snapshots. Information is lost within each frame: Imagine a spinning disc with
    a spot on it rotating at 200 revolutions'
