  md: 'consciousness by virtue of its central position. Only a handful of researchers
    had ever worked on the claustrum, and he called nearly every one of them to ask
    for further information. My visit was the last time I would ever see him. Francis
    died on July 28, 2004, while working to complete the manuscript of his last paper22
    and to finish his search for the origins of consciousness.


    Fifty years after he and James Watson discovered the structure of DNA in 1953,
    the human genome was sequenced. Crick told me it had never occurred to him that
    it would ever be possible. How far will we be fifty years from now on the problem
    of consciousness? By then, we will have machines that interact with us in much
    the same way that we now interact with one another, through speech, gestures,
    and facial expressions. It may be easier to create consciousness than to fully
    understand it.


    I suspect that we can make progress faster by first understanding unconscious
    processing—all the things we take for granted when we see, hear, and move. We
    have already made progress on understanding motivational systems, which strongly
    influence our decisions; and attentional systems, which help guide our search
    for information from the world. With a deeper understanding of the brain mechanisms
    that govern perception, decision making, and planning, the problem of understanding
    consciousness could disappear like the Cheshire cat, leaving only a broad grin.23'
