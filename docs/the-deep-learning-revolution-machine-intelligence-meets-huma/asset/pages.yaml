- pgno: 130
  md: 'more than $150 billion of fraudulent transactions per year. HNC Software Inc.
    used neural network learning algorithms to detect credit card fraud with much
    better accuracy than humans, saving credit card companies many billions of dollars
    per year. HNC was acquired for $1 billion by Fair Isaac and Company (FICO) in
    2002, famous for issuing credit scores.


    There is something magical about watching a network learn as it gets better and
    better by taking small steps. It can be a slow process, but if there are enough
    training examples and the network is big enough, learning algorithms can find
    a good representation that generalizes well to new inputs. When the process is
    repeated from a randomly chosen set of initial weights, a different network is
    learned each time, but all with similar performances. Many networks can solve
    the same problem; this has implications for what we should expect when we are
    able to reconstruct the complete set of connections for the brains of different
    individuals. If many networks yield the same behavior, the key to understanding
    them is the learning algorithms used by brains, which should be easier to discover.


    # Understanding Deep Learning


    Whereas, in convex optimization problems, there are no local minima and convergence
    is guaranteed to the global minimum, in nonconvex optimization problems, this
    is not the case. We were told by optimization experts that, because learning in
    networks with hidden units was a nonconvex optimization problem, we were wasting
    our time—our network would get trapped in local minima (figure 8.4). Empirical
    evidence suggested that they were wrong. But why? We now know that, in very high-dimensional
    spaces, local minima of the cost function are rare until the final stages of learning.
    At early stages, almost all directions are downhill, and, on the way down, there
    are saddle points, where some directions point up in error and other dimensions
    point down. The intuition that networks would get stuck in local minima is based
    on solving problems in low-dimensional spaces where there are fewer directions
    to escape.


    Current deep network models have millions of units and billions of weights. For
    statisticians, who traditionally analyze simple models with only a few parameters
    so they can prove theorems using small data sets, a billion-dimensional space
    was a nightmare. They assured us that, with so many parameters, we would hopelessly
    overfit the data: our network would simply memorize the training data and fail
    to generalize to new test inputs. But using regularization techniques, like forcing
    the weights to decay when they weren''t doing anything useful, we were able to
    alleviate overfitting.'
