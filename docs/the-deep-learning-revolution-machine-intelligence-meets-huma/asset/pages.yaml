- pgno: 96
  md: '![](img/dd452eef0506ea820c436fef2f776436_96_0.png)


    Figure 6.3 Independent component analysis filters derived from natural images.
    Small patches (12x12 pixels) from images of natural scenes in the left panel were
    used as inputs to an ICA network with 144 output units. The resulting independent
    components in the right panel resemble the simple cells found in the primary visual
    cortex: They are localized and oriented with positive regions (white) and negative
    regions (black), where gray is zero. It only takes a few of the filters to represent
    any given patch, a property called “sparsity.” Left: courtesy of Michael Lewicki;
    right: from Bell and Sejnowski, “The ‘Independent Components’ of Natural Scenes
    Are Edge Filters,” figure 4.


    The ICA network has an equal number of input and output units and a fully connected
    set of weights between them. To solve the blind source separation problem, the
    sounds from the microphones are played through the input layer, one input unit
    for every microphone, and the ICA learning algorithm, like the perceptron algorithm,
    iteratively modifies the weights to the output layer until they converge. But,
    unlike the perceptron, which is a supervised learning algorithm, independent component
    analysis is an unsupervised learning algorithm that uses a measure of the independence
    between the output units as a cost function; it does not know what the output
    target should be. As the weights are changed to make the outputs as independent
    as possible, the original sound sources become perfectly separated, or as “decorrelated”
    as possible if they are not independent. Unsupervised learning can discover previously
    unknown statistical structure in many different types of data sets.'
