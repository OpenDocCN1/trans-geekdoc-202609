- pgno: 262
  md: '# Poverty of Imagination


    Chomsky has since used the same rhetorical arguments many times, most notably
    in his argument for the innateness of language based on “poverty of the stimulus,”
    which asserts that a baby does not hear enough examples of sentences to be able
    to learn the rules of syntax. But a baby is not a computer getting a string of
    disembodied symbols from the world. A baby is immersed in a world of rich sensory
    experiences and is learning about the nature of the world at a breathtaking pace.
    The world is filled with meaningful experiences that are tied to sounds, which
    begin in the womb, a form of unsupervised learning, and it is only after this
    foundation is laid that language generation begins, first with babbling, then
    with single words, and much later with syntactically correct sequences of words.
    What is innate is not grammar, but the ability to learn language from experience
    and to absorb the higher-order statistical properties of utterances in a rich
    cognitive context.


    What Chomsky could not imagine was that, when coupled with deep learning of the
    environment and a deeply learned value function honed by a lifetime of experience,
    a weak learning system like reinforcement learning can indeed give rise to cognitive
    behaviors, including language. This was not at all obvious to me in the 1980s,
    although I should have realized that, if a tiny network like NETtalk could handle
    English pronunciation, it was likely that, in their representations of words,
    learning networks, whether model or cortical, would have a natural affinity for
    language. Chomsky’s position was based on a poverty of imagination, but it follows
    logically from Orgel’s second rule: evolution is cleverer than you are, and that
    includes experts like Chomsky. Indeed, when an expert tells you something in nature
    is impossible, beware—no matter how plausible or convincing the argument.


    Chomsky’s emphasis on word order and syntax became the dominant approach in linguistics
    in the latter half of the twentieth century. But even a “bag of words” model neural
    network that throws away word order does remarkably well at determining the topic
    of an article, such as sports or politics, and its performance can then be improved
    by taking into account the immediate neighborhoods of words in the article. The
    lesson from deep learning is that, even though word order carries some information,
    semantics, based on the meaning of words and their relationships with other words,
    is more important. Words are represented in the brain by a rich internal structure.
    And as we learn more about how words are semantically represented in deep learning
    networks, we may have the beginnings of a'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'new linguistics. Just as there is no reason why nature should burden us with
    knowing how we see, there is no reason why our intuition into how we use language
    should be any better.


    Let’s consider what the internal structure of words might look like in a model
    network trained on a natural language task. Although a network may be trained
    on a particular problem, the way the network represents its inputs can be used
    to solve other problems. A good example is a network trained to predict the next
    word in a sentence. The representations of words in the trained network have internal
    structure, in the form of patterns of activity of all the units in the network,
    that can be used to draw analogies between word pairs.¹¹ For example, when these
    activity patterns are projected onto a plane, vectors connecting countries to
    their capital cities are all the same. The network learned to automatically organize
    concepts and learn implicitly the relationships between them, without having any
    supervised information about what a capital city means (figure 17.4). This shows
    that the semantics of countries and capitals can be extracted from text using
    unsupervised learning.


    I once opened a presentation at MIT by declaring, “Language is too important to
    be left to the linguists.”¹² What I meant was that we shouldn’t stop at describing
    language at the behavioral level. We should seek to understand the biology of
    language, the underlying biological mechanisms, and how language ability evolved
    in *Homo sapiens*. This has become possible with noninvasive brain imaging and
    with recordings directly from the brains of epilepsy patients. Equally important
    are brain studies to understand the differences that made language possible by
    comparing human brains with those of chimpanzees and other higher primates; the
    ability to use language happened in an evolutionary instant compared to the earlier
    and much slower acquisition of sensorimotor skills. Powerful genetic tools will
    allow us to dissect the development of the brain and to understand how evolution
    gave rise to our innate ability to learn languages by tinkering with development.


    Language can be used to mislead and control by appealing to plausibility and by
    arguing from ignorance, which has unfortunate consequences far beyond science.
    History is filled with demagogues, who are eventually abandoned when the poverty
    of their imaginations is exposed. Fortunately, brains have been around a lot longer
    than language, and we will be better served if we rely on the parts of our brains
    that evolved long before language.¹³'
