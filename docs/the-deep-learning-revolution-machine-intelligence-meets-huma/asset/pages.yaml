  md: 'have received the Nobel Prize in Physiology or Medicine with David Hubel and
    Torsten Wiesel in 1981 for his discoveries in the retina, had he not died the
    year before. After moving to the Salk Institute in 1989, I would work with Francis
    Crick, who had shifted his research focus from molecular genetics to neuroscience
    in 1977 and was intent on finding the neural correlates of visual awareness. It
    was thus my privilege to be in the company of some of the greatest vision scientists
    of that time.


    # Vision from the Bottom Up


    If we follow the signals generated by an image into the brain, we can see how
    it is transformed over and over again as it passes from one stage of processing
    to the next (figure 5.1). Vision starts in the retina, where photoreceptors convert
    light into electrical signals. There are two layers of neurons within the retina
    that process the visual signals in space and time, ending with the ganglion cells
    that project out into the optic nerves.


    In a classic 1953 experiment whose results hold for all mammals, Stephen Kuffler
    (figure 5.2, left) recorded from the output neurons of the retina of a living
    cat while stimulating them to fire spikes in response to spots of light. He reported
    that some output neurons responded to a spot of light in their center when it
    went on, and others responded to a spot of light in their center when it went
    off. But, just outside the centers, the surrounding annulus had the opposite polarity:
    on-centers with off-surrounds and off-centers with on-surrounds (figure 5.3).
    The responses of ganglion cells to patterns of light are called “receptive field”
    properties.


    I once asked Kuffler, whose main scientific interest was in the properties of
    synapses between neurons, what motivated him to study the retina. He said that
    since his lab at Johns Hopkins was in the Wilmer Eye Institute at the time, he
    felt guilty he was not working on eyes. Having pioneered the study of single ganglion
    cells in the retina, he handed off the project to two postdoctoral fellows in
    his lab, David Hubel and Torsten Wiesel (figure 5.2, right and center), and advised
    them to follow the signals into the brain. In 1966, Kuffler and his postdoctoral
    fellows moved to Harvard Medical School to start a new Department of Neurobiology.


    # Vision in the Cerebral Cortex


    Hubel and Wiesel discovered that cortical neurons responded much better to oriented
    bars of light and contrast edges than to spots of light. The circuits in the cortex
    had transformed the input signals. They described'
