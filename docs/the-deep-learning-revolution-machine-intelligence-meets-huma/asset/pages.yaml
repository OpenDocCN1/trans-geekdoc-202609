    Self-driving cars will soon disrupt the livelihoods of millions of truck and taxi
    drivers. Eventually, there will be no need to own a car in a city when a self-driving
    car can show up in a minute and take you safely to your destination, without your
    having to park it. The average car today is only used 4 percent of the time, which
    means it needs to be parked somewhere 96 percent of the time. But because self-driving
    cars can be serviced and parked outside cities, vast stretches of city land now
    covered with parking lots can be repurposed for more productive uses. Urban planners
    are already'
