    Industrial robots have stiff joints and powerful servomotors, which makes them
    look and feel mechanical. In 2008, Brooks started Rethink Robotics, a company
    that built a robot called “Baxter” with pliant joints, so its arms could be moved
    around (figure 12.3). Instead of having to write a program to move Baxter’s arms,
    each arm could be moved through the desired motions, and it would program itself
    to repeat the sequence of motions.


    Movellan went one step further than Brooks and developed a robot baby called “Diego
    San” (manufactured in Japan), 15 whose motors were pneumatic (driven by air pressure)
    and all of whose forty-four joints were compliant compared to the stiff torque
    motors used in most industrial robots (figure 12.4). The motivation for making
    them so is that when we pick something up, every muscle in our bodies is involved
    to some extent (when we move only one joint at a time, we look like robots). This
    makes us better able to adapt to changing conditions of load and interaction with
    the world. The brain can smoothly control all of the degrees of freedom in the
    body—all the joints and muscles—at the same time and the goal of the Diego San
    project was to figure out how. Diego San’s face had twenty-seven moving parts
    and could express a wide range of human emotions. 16 The movements made by the
    robot baby were remarkably lifelike. Although Javier had several successful robot
    baby projects to his name, Diego San was not one of them, however. He simply didn’t
    know how to make the robot baby perform as fluidly as a human baby.


