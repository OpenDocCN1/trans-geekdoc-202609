  md: '# Independent Components in the Brain


    Tony Bell’s infomax ICA algorithm set off a sequence of Aha! moments, as others
    in my lab began to apply it to different types of recordings from the brain. Using
    The first electrical signals from the brain had been recorded from the scalp by
    Hans Berger in 1924 and was called “electroencephalography” (EEG). Neuroscientists
    have used these complex, oscillating signals to eavesdrop on our ever-changing
    brain states, which vary with our alertness and sensorimotor interactions. The
    electrical signal at an electrode on the scalp receives inputs from many different
    sources within the cerebral cortex as well as muscle and eye movement artifacts.
    Each scalp electrode receives a mixture of signals from the same set of sources
    in the brain, but with different amplitudes, which is formally the same as the
    cocktail party problem.


    Scott Makeig, who was a staff scientist in my lab at the Salk Institute in the
    1990s, used ICA to extract dozens of dipolar sources in the cortex and their time
    courses from EEG recordings (figure 6.4). A dipole is one of the simplest patterns
    a brain source can have, the simplest being a uniform pattern over the scalp,
    generated by a static point charge, and the second simplest, the dipole pattern
    generated by current moving in a straight line, which occurs in cortical pyramidal
    neurons. Think of the dipole as an arrow. The surface of the scalp is positive
    in the direction of the arrow’s head and negative in the direction of its tail;
    the pattern covers the entire head, which is why it is so difficult to separate
    many brain sources that are activated at the same time. Two sources extracted
    from EEG, IC2 and IC3, are approximately dipolar sources in figure 6.4. Independent
    component analysis also separates the artifacts, such as eye movements and electrode
    noise, which could then be subtracted out with high accuracy (IC1 and IC 4 in
    figure 6.4). Many thousands of papers have since been published using ICA to analyze
    EEG recordings, and important discoveries have been made using ICA to analyze
    a wide range of brain states.


    Martin McKeown, who was then a postdoctoral fellow in my lab with a background
    in neurology, figured out how to flip space and time to apply independent component
    analysis to functional magnetic resonance imaging recordings (figure 6.5).11 Brain
    imaging with fMRI measures the level of blood oxygenation, which is indirectly
    linked to neural activity, at tens of thousands of locations within the brain.
    In figure 6.5, the ICA sources were brain regions that had a common time course
    but were spatially independent of the other sources. Sparsity in the spatial domain
    means that at any given time, only a few regions are highly active.'
