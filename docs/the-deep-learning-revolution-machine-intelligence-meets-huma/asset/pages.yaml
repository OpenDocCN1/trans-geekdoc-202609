  md: 'networks. He had even built small networks from electronic parts to see how
    they behaved. The story I heard when I was a graduate student at Princeton in
    physics was that there wasn’t anyone in the Mathematics Department who was qualified
    to assess his dissertation,23 so they sent it to the mathematicians at the Institute
    for Advanced Study in Princeton who, it was said, talked to God. The reply that
    came back was, “If this isn’t mathematics today, someday it will be,” which was
    good enough to earn Minsky his Ph.D. And neural networks have indeed given rise
    to a new class of mathematical functions that are spurring new studies and are
    on their way to becoming a new branch of mathematics. The youthful Minsky was
    ahead of his time.


    # Passages


    Marvin Minsky died in 2016, steadfast in his belief that neural networks were
    a dead end on the way to achieving general artificial intelligence. In a thoughtful
    essay on his friendship with Minsky, Stephen Wolfram wrote: “And although I don’t
    think anyone could have known it then, we now know that the neural networks Marvin
    was investigating as early as 1951 were actually on a path that would ultimately
    lead to just the kind of impressive AI capabilities he was hoping for. It’s a
    pity it took so long, and Marvin barely got to see it.”24


    Shortly after Minsky’s death, Alex Graves, Greg Wayne, and colleagues, researchers
    at DeepMind, achieved the next step toward a general artificial intelligence based
    on deep learning by adding a dynamic external memory.25 Activity patterns can
    only be stored temporarily in a deep recurrent neural network, which makes it
    difficult to emulate reasoning and inference. By adding a stable memory to the
    network that can be written to and read back with the same flexibility as a digital
    computer memory, the researchers demonstrated a network trained with reinforcement
    learning that could answer questions that required reasoning. For example, one
    such network reasoned about paths in the London Underground and another answered
    questions about genealogical relationships in a family tree. The dynamic memory
    network was also able to master the Blocks World transfer task that had challenged
    the MIT AI Lab in the 1960s (figure 2.1). This brings us back to where we started
    in chapter 2.


    Francis Crick died in 2004 and Leslie Orgel shortly thereafter, in 2007, marking
    the end of an era at the Salk Institute. Now that these scientific giants are
    no longer with us, a new generation is forging ahead. I have'
