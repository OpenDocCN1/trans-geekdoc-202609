  md: '# Working Memory and Persistence of Activity


    Neuroscience has come a long way since the 1960s, and much can be gained from
    our current knowledge of the brain. In 1990, Patricia Goldman-Rakic taught a monkey
    to remember a location that was briefly cued with a light and to make an eye movement
    to the remembered location after a delay period.16 Recording from the monkey prefrontal
    cortex, she reported that some neurons that initially responded to the cue maintained
    their activity during the delay period. Psychologists call this “working memory”
    in humans, which is how we can keep 7 ± 2 items in mind while we are in the middle
    of performing a task, like dialing a phone number.


    The traditional feedforward network propagates inputs up the network, one layer
    at a time. Incorporating working memory would make it possible for a later input
    to interact with the trace left behind from a previous input to the network. For
    example, when translating a French sentence into English, the first French word
    into the network influences the order of subsequent English words. The simplest
    way to implement working memory in a network is to add recurrent connections,
    which are common in the human cortex. Recurrent connections in neural networks
    within a layer and feedback connections to previous layers allow temporal sequences
    of inputs to be temporally integrated. Such networks were explored in the 1980s
    and are used extensively in speech recognition.17 In practice, this works well
    for short-range dependencies, but poorly when the gap between inputs is large
    since the influence of an input tends to decay with time.


    In 1997, Sepp Hochreiter and Jürgen Schmidhuber found a way to overcome the decay
    problem, which they called “long short-term memory” (LSTM).18 LSTM passes the
    activity into the future without decay as a default, which is what happens during
    the delay period in the monkey prefrontal cortex, and it also has a complex scheme
    for deciding how to integrate the new incoming information with the old information.
    As a consequence, long-range dependencies are preserved selectively. This version
    of working memory in neural networks lay dormant for twenty years until it was
    awakened and implemented in deep learning networks, where it has been spectacularly
    successful in many domains that depend on learning sequences of inputs and outputs,
    such as movies, music, movements, and language.


    Schmidhuber is a codirector of the Dalle Molle Institute for Artificial Intelligence
    Research in Manno, a tiny town located in the Ticino district'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'of southern Switzerland, near some of the best hikes in the Alps.19 This creative
    and idiosyncratic Rodney Dangerfield of neural networks is convinced he doesn’t
    get enough credit for his creativity. Thus, at a panel discussion at the 2015
    NIPS Conference in Montreal, he introduced himself from the audience as “You again,
    Schmidhuber,” and, at the 2016 NIPS Conference in Barcelona, he harassed a tutorial
    speaker for five minutes for not paying enough attention to his ideas.


    In 2015, Kelvix Xu and colleagues coupled a deep learning network for identifying
    objects in images with a long short-term memory recurrent network to caption pictures.
    Using a first pass from a deep learning network that identified all the objects
    in the scene as input, they trained the recurrent LSTM network to output a string
    of English words that described the scene in a caption (figure 9.4). And they
    also trained the LSTM network to identify the location in the image corresponding
    to each word in the caption.20 What makes this application impressive is that
    the long short-term memory network was never trained to understand the meaning
    of the sentence in the caption, only to output a syntactically correct string
    of words based on the objects and their locations in the image. Together with
    the earlier NETtalk example in chapter 8, this is more evidence that neural networks
    seem to have an affinity for language for reasons we do not yet understand. Perhaps
    a new theory of language will emerge from analyzing LSTM networks that will illuminate
    both how the networks work and the nature of natural language.


    # Generative Adversarial Networks


    In chapter 7, the Boltzmann machine was presented as a generative model that can
    produce new input samples when the output is clamped to a category that it has
    been trained to recognize and the activity patterns percolate down to the input
    layer. Ian Goodfellow, Yoshua Bengio and their colleagues at the University of
    Montreal showed that it was possible to train feedforward networks to generate
    even better samples in an adversarial context.21 A generative convolutional network
    can be trained to produce good image samples by trying to fool another convolutional
    network that has to decide whether an input is a real image or a fake one. The
    output of the generative network is given as input to a discriminative convolutional
    network that is trained to give a single output: 1 if the input is a real image,
    and 0 if it is a fake image. These two networks compete against each other. The
    generative network tries to increase the error'
