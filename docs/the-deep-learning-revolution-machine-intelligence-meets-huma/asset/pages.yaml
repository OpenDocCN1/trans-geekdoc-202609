  md: 'visual stimulus was not changing. The experimenters then closed the loop by
    controlling the ratio of the two images in the mixture according to the firing
    rates of the neurons preferring the images, so the subjects could control the
    input—the ratio of the two faces—by imagining one or the other image. This illustrates
    that the process of recognition is not simply a passive process, but depends on
    active engagement of memory and internal attentional control.


    Despite this striking evidence, the grandmother cell hypothesis is unlikely to
    be the whole story of visual perception. According to the hypothesis, you perceive
    your grandmother when the cell is active, so it should not fire to any other stimulus.
    Only a few hundred pictures were tested, so we really don''t know how selective
    the “Halle Berry cell” was. Second, the likelihood that the electrode happened
    to record from the only Halle Berry neuron in the brain is low; it is more likely
    that there are many thousands of these cells in the brain. There must also be
    many copies of neurons that respond to other famous faces, and many more for everyone
    you know and every object you can recognize. Although there are billions of neurons
    in the brain, there aren''t enough to exclusively represent every object and name
    that a person knows by a large dedicated population of neurons. Finally, the response
    is only a correlation with the sensory stimulus and may not be causal. Equally
    important is the output of the neuron and its downstream impact on behavior (the
    projective field introduced in chapter 5). Nonetheless, the selectivity of the
    responses is striking. Before the recordings began, the patient was asked to identify
    a favorite celebrity, so Halle Barry might be overrepresented in the patient''s
    brain.


    Recordings from hundreds of cortical neurons simultaneously in mice, monkeys,
    and humans are leading to an alternative theory for how neurons collectively perceive
    and decide.⁷ In recordings from monkeys, stimuli and task-dependent signals are
    broadly distributed over large populations of neurons, each tuned to a different
    combination of features of the stimuli and task detail.⁸ Before long, it will
    be possible to record from millions of neurons and to manipulate their firing
    rates, as well as to distinguish different types of neurons and how they are connected
    with one another.⁹ This could lead to theories beyond the grandmother cell and
    a deeper understanding of how activity in populations of neurons gives rise to
    thoughts, emotions, plans, and decisions. Of course, there may be more than one
    way for neurons to represent faces and objects. With new recording techniques
    coming online, however, we should soon know the answer.


