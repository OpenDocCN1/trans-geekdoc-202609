    # Hebbian Synaptic Plasticity


    The surprise was that the Boltzmann machine learning algorithm turned out to have
    a long history in neuroscience, going back to the psychologist Donald O. Hebb,
    who in his book The Organization of Behavior postulated that when two neurons
    fired together, the synapse between them should strengthen:


    > Let us assume that the persistence or repetition of a reverberatory activity
    (or “trace”) tends to induce lasting cellular changes that add to its stability.
    When an axon of cell A is near enough to excite a cell B and repeatedly or persistently
    takes part in firing it, some growth process or metabolic change takes place in
    one or both cells such that A’s efficiency, as one of the cells firing B, is increased.¹⁶


    This may be the most famous prediction in all of neuroscience. Hebbian synaptic
    plasticity was later discovered in the hippocampus, an important brain area for
    long-term memory. When a hippocampal pyramidal cell receives a strong input at
    the same time the neuron is spiking, the strength of the synapse is increased.
    Subsequent experiments showed that the strengthening was based on the conjunction
    of transmitter release from the synapse and elevation of the voltage in the recipient
    neuron. Moreover, this conjunctive occurrence was recognized by a special receptor,
    the NMDA (N-methyl-D-aspartate) glutamate receptor that triggers long-term potentiation
    (LTP), which is rapid in onset and long lasting, a good candidate for the substrate
    of long-term memory. Hebbian plasticity at a synapse is governed by coincidences
    between inputs and outputs, just like the Boltzmann machine learning algorithm
    (see box 7.2).


    Even more amazing, the Boltzmann machine had to go to sleep to be able to learn.
    Its learning algorithm had two phases. In the first or “wake” phase, with the
    input and output patterns were clamped to the desired mapping, the units in the
    network were updated many times to settle down to'
