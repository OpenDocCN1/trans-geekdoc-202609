    on a theorem formulated by the eighteenth-century British mathematician Thomas
    Bayes that allows new evidence to update prior beliefs. Judea Pearl at the University
    of California, Los Angeles, had earlier introduced “belief networks”³ to artificial
    intelligence based on Bayesian analysis, which were strengthened and extended
    by developing methods for learning the probabilities in the networks from data.
    The algorithms of these and other networks built up a powerful armamentarium for
    machine learning researchers.


    As the processing capability of computers continued to rise exponentially, it
    became possible to train ever larger networks. It was generally thought that wider
    neural networks with a greater number of hidden units were more effective than
    deeper networks with a greater number of layers, but this was shown not to be
    the case for networks trained layer by layer,⁴ and the vanishing error gradient
    problem was identified, which slowed down learning near the input layer.⁵ When
    this problem was eventually overcome, however, it became possible to train deep
    backprop networks that performed favorably on benchmarks.⁶ And, as deep backprop
    networks began to challenge traditional approaches in computer vision, the word
    at the 2012 NIPS Conference was that the “Neural” was back in “Neural Information
    Processing Systems.”


    In computer vision, steady progress in recognizing objects in images over the
    last decade of the previous century and the first decade of the current one had
    improved performance on benchmarks (used to compare different methods) by a fraction
    of a percent per year. Methods improved slowly because each new category of objects
    requires a domain expert to identify the pose-invariant features needed to distinguish
    them from other objects. Then, in 2012, Geoffrey Hinton and two students, Alex
    Krizhevsky and Ilya Sutskever, submitted a paper to the NIPS conference on object
    recognition in images that used deep learning to train AlexNet, a deep convolutional
