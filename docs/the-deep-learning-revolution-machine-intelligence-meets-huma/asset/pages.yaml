- pgno: 89
  md: 'Cognitive neuroscience has grown into an important field that has attracted
    researchers from many areas of science, including social psychology and economics,
    which previously had little or no direct connection with neuroscience. What made
    this possible was the introduction of noninvasive methods for visualizing brain
    activity, in the early 1990s, especially functional magnetic resonance imaging
    (fMRI), which now has a spatial resolution of a few millimeters. The large fMRI
    data sets being generated are analyzed with new computational methods such as
    Independent Component Analysis (to be discussed in chapter 6).


    Since the brain can''t work without oxygen, and blood flow is tightly regulated
    at submillimeter levels, fMRI measures the blood oxygen level dependent (BOLD)
    signal as a surrogate for brain activity. The degree of oxygenation in the blood
    changes its magnetic properties, which can be monitored noninvasively with fMRI
    and used to produce dynamic images of brain activity with a time resolution of
    a few seconds, short enough to keep track of which parts of the brain are engaged
    during an experiment. Functional MRI has been used to explore the temporal integration
    time scale in different parts of the visual hierarchy.


    Uri Hasson at Princeton University performed an fMRI experiment designed to probe
    which parts of the visual hierarchy are involved in processing movies of different
    lengths.18 A Charlie Chaplin silent film was cut into segments, which were scrambled
    at time scales of 4, 12, and 36 seconds and presented to subjects. At 4 seconds,
    subjects could recognize a scene; at 12 seconds, connected actions; and at 36
    seconds, a story with beginning and end. The fMRI responses in the primary visual
    cortex at the bottom of the hierarchy were strong and reliable regardless of the
    time scale, but at higher levels of the visual hierarchy, only the longer time
    scales evoked a reliable response, and areas of prefrontal cortex at the top of
    the hierarchy required the longest time interval. This is consistent with other
    experiments showing that working memory, our ability to hold onto information
    like telephone numbers and elements of a task we are working on, is also organized
    in a hierarchy, with the longest working memory time scales in the prefrontal
    cortex.


    One of the most exciting areas of research in neuroscience, the study of learning
    in brains can be studied at many levels of investigation, from molecules to behavior.'
