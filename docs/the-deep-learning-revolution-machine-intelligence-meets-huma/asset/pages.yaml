  md: 'it should be 1), then the weights are changed slightly so that the next time
    the same input is given, it is closer to getting the correct answer (box 3.1).
    It is important that the changes occur gradually so that the weights can feel
    the tugs from all the training examples, and not just from the last one.


    If this explanation of perceptron learning isn’t clear, there is a much neater
    geometric way to understand how a perceptron learns to classify inputs. For the
    special case of two inputs, it is possible to plot the inputs on a two-dimensional
    graph. Each input is a point in the graph and the two weights in the network determine
    a straight line. The goal of learning is to move the line around so that it cleanly
    separates the positive and negative examples (figure 3.5). For three inputs, the
    space of inputs is three-dimensional, and the perceptron specifies a plane that
    separates the positive and negative training examples. The same principle holds
    even in the general case, when the dimensionality of the space of inputs can be
    quite high and impossible to visualize.


    Eventually, if a solution is possible, the weights will stop changing, which means
    the perceptron has correctly classified all of the examples in the training set.
    But, in what is called “overfitting,” it is also possible that there are not enough
    examples in the set, and the network has simply memorized the specific examples
    without being able to generalize to new ones. To avoid overfitting, it is important
    to have another set of examples,


