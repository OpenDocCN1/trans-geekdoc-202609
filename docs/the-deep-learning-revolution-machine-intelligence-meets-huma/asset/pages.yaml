- pgno: 241
  md: '# Box 15.1

    Operating System of a Digital Computer


    ![](img/dd452eef0506ea820c436fef2f776436_241_0.png)


    An operating system controls the programs that run on the hardware of a computer.
    If you are using a PC, the operating system is most often Windows; if you are
    using an iPhone, it is iOS; most servers are running some version of UNIX. The
    operating system allocates memory when needed by the programs; it also works behind
    the scenes to keep track of programs, using processes called “daemons,” which
    run in the background and keep track of utilities like printers and displays.
    The operating system is designed to work on any hardware, making your applications
    portable between computers.


    # It''s Information, All the Way Down


    The information explosion has transformed biology into a quantitative science.
    Biologists traditionally needed little mathematical training beyond an introductory
    course in statistics to analyze their data, which were few and hard won. At a
    symposium on molecular genetics held by the Cold Spring Harbor Laboratory on Long
    Island in 2002, I felt like a fish out of water because I was the only one giving
    a computational talk. Speaking before me was Leroy Hood, a molecular geneticist
    who was on the faculty at Caltech for many years. While on sabbatical at Caltech
    in 1987, I was astonished to find that Hood’s lab filled an entire building. Since
    then, he had moved to Seattle, where, in 2000, he cofounded the Institute for
    Systems Biology, a new field that is attempting to understand the complexity of
    all the molecular interactions within cells.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'In his talk, Hood said that one day he asked himself why he had more computer
    scientists than biologists on his payroll. The reason, he concluded, was that
    biology had become an information science and that computer scientists knew far
    more about analyzing information than did biologists, who had been overwhelmed
    by the vast amounts of data generated by modern techniques such as gene sequencing.
    I could not have asked for a better way to motivate my talk, which was about understanding
    how information is stored at synapses between neurons in the brain.


    Today systems biology is attracting many computer scientists and physicists to
    analyze and understand the information that is being generated by DNA sequencing
    and the signals in cells that are controlled by RNA and proteins. The 3 billion
    base pairs in the DNA of a human cell contain all the information the cell needs
    to survive, replicate, and specialize. Some base pairs are templates for making
    proteins, but other parts of the genome contain an abstract code to regulate genes
    that are used during development to guide the construction of the body and brain.
    Perhaps the most demanding construction project in the universe, the construction
    of brains is guided by algorithms embedded in the DNA that orchestrate the development
    of connections between thousands of different types of neurons in hundreds of
    different parts of the brain.


    # Playing the Long Game


    The commercialization of technology developed by basic science research typically
    takes about fifty years. The great discoveries that were made in relativity and
    quantum mechanics during the first decade of the twentieth century gave rise to
    CD players, GPS, and computers in the second half of that century. The discovery
    of DNA and the genetic code in the 1950s gave rise to applications in medicine
    and agribusiness that are having an economic impact today. The basic discoveries
    that the BRAIN Initiative and other brain research programs around the world are
    making today will lead to applications fifty years from now that would be considered
    science fiction today.13 We can expect AIs to have operating systems comparable
    to the one in our brain by 2050. But which companies and which countries will
    control this technology depends on investments and big bets being made today.'
