- pgno: 137
  md: 'which opened up a lively discussion. My move to La Jolla in 1989 marked an
    exciting transition from junior faculty at Johns Hopkins to senior faculty at
    the Salk Institute, and almost overnight many opportunities opened up, including
    an appointment with the Howard Hughes Medical Institute, which provided generous
    support for my research for twenty-six years.


    When I moved to UC, San Diego, in 1989, I was sorry that David Rumelhart, who
    taught us how to backpropagate, had already left for Stanford, and I only saw
    him sporadically after that. Over the years, I noticed that David''s behavior
    changed in ways that were disturbing. Eventually, he was diagnosed with frontotemporal
    dementia, a progressive loss of neurons in the frontal cortex that affects personality,
    behavior, and language. Rumelhart died in 2011 at age 68, no longer able to recognize
    family or friends.'
