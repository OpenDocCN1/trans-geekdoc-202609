  md: 'The question of simultaneity becomes even more vexing when we make cross-modal
    comparisons. When you watch someone chop down a tree, assuming you''re close enough,
    you simultaneously see and hear the axe hit the tree with each blow, even though
    the speed of sound is much slower than that of light. Moreover, the illusion of
    simultaneity is maintained as the distance from the tree increases,¹² even though
    the absolute delay between the visual and auditory signals as they reach your
    brain can vary more than 80 milliseconds before the illusion is broken, and the
    sound is no longer perceived as simultaneous with the axe hit (at about 100 feet
    away).


    Researchers who study the temporal aspects of vision have uncovered another phenomenon
    called the “flash-lag effect.” This can be observed when an airplane with a flashing
    taillight passes overhead and the flashes and tail don’t seem to line up—the flashes
    seem to lag behind the tail. Another common occurrence is at soccer matches when
    a running player appears to be ahead of a kicked ball (the flash), which can elicit
    an offside call from an assistant referee who has not compensated for the illusion.
    This can be studied in the lab with a visual stimulus illustrated in figure 16.3.
    In the flash-lag effect, a flash and a moving object at the same location appear
    to be offset.


    ![](img/dd452eef0506ea820c436fef2f776436_250_0.png)


    Figure 16.3 Flash-lag effect. (Top) An annulus moves from left to right (black).
    As it passes the center a light briefly flashes below it (yellow). (Bottom) Subjects
    report that the object appears to be displaced to the right at the time of the
    flash. Courtesy of David Eagleman.'
