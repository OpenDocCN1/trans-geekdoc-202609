    without depending on previous knowledge, and crystallized intelligence, which
    depends on previous knowledge and is what the standard IQ tests measure. Fluid
    intelligence follows a developmental trajectory, reaching a peak in early adulthood
    and decreasing with age, whereas crystallized intelligence increases slowly and
    asymptotically as you age until fairly late in life. AlphaGo displays both crystallized
