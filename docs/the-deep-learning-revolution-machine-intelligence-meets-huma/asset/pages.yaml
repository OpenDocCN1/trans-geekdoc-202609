- pgno: 17
  md: 'thinking ahead to the day when parking lots become parkland.³ Parking lanes
    along streets can become real bike lanes. Many other car-related businesses will
    be affected, including auto insurance agencies and body shops. No more speeding
    or parking tickets. There will be fewer deaths from drunk drivers and from drivers
    falling asleep at the wheel. Time wasted commuting to work will be freed for other
    purposes. According to the U.S. Census Bureau, in 2014, 139 million Americans
    spent an average of 52 minutes commuting to and from work each workday. That amounts
    to 29.6 billion hours per year, or an astounding 3.4 million years of human lives
    that could have been put to better use.⁴ Highway capacity will be increased by
    a factor of four by caravaning.⁵ And, once developed and widely used, self-driving
    cars that can drive themselves home without a steering wheel will put an end to
    grand theft auto. Although there are many regulatory and legal obstacles in the
    way, when self-driving cars finally become ubiquitous, we will indeed be living
    in a brave new world. Trucks will be the first to become autonomous, probably
    in 10 years; taxis in 15 years and passenger cars in 15 to 25 years from start
    to finish.


    The iconic position that cars have in our society will change in ways that we
    cannot imagine and a new car ecology will emerge. Just as the introduction of
    the automobile more than 100 years ago created many new industries and jobs, there
    is already a fast-growing ecosystem being created around self-driving cars. Waymo,
    the self-driving spin-off from Google, has invested $1 billion over 8 years and
    has constructed a secretive testing facility in California''s central valley with
    a 91-acre fake town, including fake bicycle riders and fake auto breakdowns.⁶
    The goal is to broaden the training data to include special and unusual circumstances,
    called edge cases. Rare driving events that occur on highways often lead to accidents.
    The difference with self-driving cars is that when one car experiences a rare
    event, the learning experience will propagate to all other self-driving cars,
    a form of collective intelligence. Many similar test facilities are being constructed
    by other self-driving car companies. These create new jobs that did not exist
    before, and new supply chains for the sensors and lasers that are needed to guide
    the cars.⁷


    Self-driving cars are just the most visible manifestation of a major shift in
    an economy being driven by information technology (IT). Information flows through
    the Internet like water through city pipes. Information accumulates in massive
    data centers run by Google, Amazon, Microsoft, and other IT companies that require
    so much electrical power that they need to be located near hydroelectric plants,
    and streaming information generates so much heat that it needs rivers to supply
    the coolant. In 2013, data'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'centers in the United States consumed 10 million megawatts, equivalent to the
    power generated by thirty-four large power plants.⁸ But what is now making an
    even bigger impact on the economy is how this information is used. Extracted from
    raw data, the information is being turned into knowledge about people and things:
    what we do, what we want, and who we are. And, more and more, computer-driven
    devices are using this knowledge to communicate with us through the spoken word.
    Unlike the passive knowledge in books that is externalized outside brains, knowledge
    in the cloud is an external intelligence that is becoming an active part of everyone’s
    lives.⁹


    # Learning How to Translate


    Deep learning is used at Google today in more than 100 services, from Street View
    to Inbox Smart Reply and voice search. Several years ago, engineers at Google
    realized that they had to scale up these compute-intensive applications to cloud
    levels. Setting out to design a special-purpose chip for deep learning, they cleverly
    designed the board to fit into a hard disk drive slot in their data center racks.
    Google’s tensor processing unit (TPU) is now deployed on servers around the world,
    delivering an order-of-magnitude improvement in performance for deep learning
    applications.


    An example of how quickly deep learning can change the landscape is the impact
    it has had on language translation—a holy grail for artificial intelligence since
    it depends on the ability to understand a sentence. The recently unveiled new
    version of Google Translate based on deep learning represents a quantum leap improvement
    in the quality of translation between natural languages. Almost overnight, language
    translation went from a fragmented hit-and-miss jumble of phrases to seamless
    sentences (figure 1.3). Previous computer methods searched for combinations of
    words that could be translated together, but deep learning looks for dependencies
    across whole sentences.


    Alerted about the sudden improvement of Google Translate, on November 18, 2016,
    Jun Rekimoto at the University of Tokyo tested the new system by having it translate
    the opening of Ernest Hemingway’s “The Snows of Kilimanjaro” into Japanese and
    then back into English—with the following result (guess which one is the original
    Hemingway):


    +   1: Kilimanjaro is a snow-covered mountain 19,710 feet high, and is said to
    be the highest mountain in Africa. Its western summit is called the Masai “Ngaje
    Ngai,” the House of God. Close to the western summit there is the dried and frozen
    carcss of a leopard. No one has explained what the leopard was seeking at that
    altitude.'
  merge: -1
  img_proc: true
