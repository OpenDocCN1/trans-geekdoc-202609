    South Building, located off the courtyard (left side of photo). You are greeted
    on the left with a wall-sized electron microscopic photo of the hippocampus, which
    looks like a cross-section of a plate of spaghetti; the entryway opens onto the
    tearoom, the heart of the Computational Neurobiology Laboratory.


