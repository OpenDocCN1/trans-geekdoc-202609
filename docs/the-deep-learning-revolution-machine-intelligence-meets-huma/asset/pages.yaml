- pgno: 251
  md: 'One leading explanation—which makes intuitive sense, and for which there is
    some evidence from brain recordings—is that the brain predicts where the moving
    spot is going to be a short time later. But perceptual experiments have shown
    that this cannot be the explanation for the flash-lag effect because the perception
    attributed to the time of the flash depends on events that occur in the 80 milliseconds
    after the flash, not those which occur before the flash (which would be used to
    make a prediction).13 This explanation for the flash-lag effect means that the
    brain is “postdictive” rather than predictive; that is, the brain is constantly
    revising history to make the conscious present consistent with the future. This
    is one example of how our brains generate plausible interpretations based on noisy
    and incomplete data, something that magicians have exploited for sleight-of-hand
    effects.14


    # Where in the Brain Is a Visual Object Perceived?


    Brain imaging gives us a global picture of our brains’ activity when we perceive
    something compared to when we don’t. Using experimental evidence, researchers
    have developed the particularly appealing hypothesis that we only become consciously
    aware of something when the level of brain activity in the front of the cortex,
    which is important for planning and making decisions, reaches a threshold level
    and ignites feedback pathways.15 Though intriguing, these observations are not
    compelling since they don’t establish causality, but only a correlation. If a
    neural correlate of consciousness is responsible for—causes—a conscious state,
    it should be possible by changing the NCC to change that conscious state. Doris
    Tsao has shown that this indeed was the case in her 2017 experiment; by stimulating
    face areas in the visual cortex of monkeys, she was able to interfere with their
    discrimination of faces.16 When a similar experiment was done in humans, subjects
    reported that faces looked as if they were melting.17 New techniques such as optogenetics18
    have recently become available to selectively manipulate the activity of neurons,
    which allows the causality of the NCCs to be tested. This may be difficult to
    do if perceptual states correspond to highly distributed patterns of activity,
    but, in principle, this approach could reveal how perceptions and other features
    of consciousness are formed.19


    # Learning Where to Look


    Visual search is a task that depends on both bottom-up sensory processing and
    top-down attentional processing driven by expectation (figure 16.4A).'
