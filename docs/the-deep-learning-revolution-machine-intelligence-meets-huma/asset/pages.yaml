    This illustrates the potential for fruitful symbiotic relationships between biology
    and deep learning.


    # Deep Learning Meets the Visual Hierarchy


    A philosopher of the mind, Patricia Churchland specializes in neurophilosophy
    at UC, San Diego.13 That knowledge ultimately depends on how the brain represents
    knowledge clearly has not stopped philosophers from thinking about knowledge as,
    in the words of Immanuel Kant, a “Ding an sich” (thing in itself), something independent
    of the world. But, just as clearly, grounded knowledge is essential if we (among
    other animals) are to survive in the real world. Motivated by the remarkable similarity
    in the patterns of activity among the hidden units of a trained multilayer'
