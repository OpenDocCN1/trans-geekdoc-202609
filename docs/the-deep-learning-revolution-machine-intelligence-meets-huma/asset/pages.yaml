    Spiking neurons open up new computational opportunities. For example, the timing
    of the spikes in a population of neurons can be used to regulate what kind of
    information is stored. In 1997, Henry Markram and Bert Sakmann in Germany reported
    that they could both increase and decrease synaptic strengths by repeated pairing
    of an input spike to a synapse with an output spike in the postsynaptic neuron.⁹
    If the input occurred within a 20-millisecond window before the output spike,
    there was long-term potentiation, but if the repeated pairing of the input spike
    occurred within a 20-millisecond window after the output spike, there was long-term
    depression (figure 14.6). “Spike-timing-dependent plasticity” (STDP), which has
    been reported in many parts of the brain of many species, is probably important
    for forming long-term memories of sequences of events—but, perhaps just as important,
    it offers a better interpretation of Hebb’s postulate (discussed in chapter 7).¹⁰


    The general view of Hebbian plasticity was that the strength of a synapse should
    increase when there was a simultaneous spike on the input and output of a neuron,
    a form of coincidence detection. But what Hebb actually said was “When an axon
    of cell A is near enough to excite a cell B and repeatedly or persistently takes
    part in firing it, some growth process or metabolic change takes place in one
    or both cells such that A’s efficiency, as one of the cells firing B, is increased.”¹¹
    For cell A to contribute to firing cell B, cell A has to fire a spike before the
    spike in cell B. As described by Hebb, this condition suggests causation, not
    just correlation. Although Hebb was silent on the conditions for decreasing the
    strength of a synapse, when an input spike occurs after the output spike, it is
    less likely to be causally connected to the output neuron, and disconnecting the
    synapse would make sense if increases and decreases in strength have to be balanced
    in the long run.


