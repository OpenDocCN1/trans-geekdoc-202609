- pgno: 292
  md: '# Glossary


    **adaptive signal processing** Methods that improve the quality of a signal, such
    as an automatic grain control or an adjustable filter that automatically reduces
    noise.


    **algorithm** A step-by-step recipe that you follow to achieve a goal, not unlike
    baking a cake.


    **backprop (backpropagation of errors)** Learning algorithm that optimizes a neural
    network by gradient descent to minimize a cost function and improve performance.


    **Bayes''s rule** Formula that updates the probability of an event based on new
    data and prior knowledge of conditions related to the event. More generally, Bayesian
    probabilities are beliefs about outcomes based on current and prior data.


    **Boltzmann machine** A neural network model consisting of interacting binary
    units in which the probability of a unit being in the active state depends on
    its integrated synaptic inputs. Named after Ludwig Boltzmann, a nineteenth-century
    physicist who laid the foundations for statistical mechanics.


    **constraints** Conditions that the solution to an optimization problem must satisfy
    to have a positive value.


    **convolution** Blending one function with another by computing the amount of
    overlap of the one as it is shifted over the other.


    **cost function** Function that specifies the goal of a network and quantifies
    its performance. The goal of learning is to reduce the cost function.


    **digital assistant** A virtual assistant that can help with tasks, like Alexa
    on Echo, Amazon''s smart speaker.


    **epoch** Update of weights during learning after the average gradient has been
    calculated from a specified number of examples.


    **equilibrium** Thermodynamic state in which there are no net macroscopic flows
    of matter or of energy. In a Boltzmann machine, where the units are probabilistic,
    the system settles down to an equilibrium state when the inputs are kept constant.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '**feedback** Connections that travel backward in a neural network from higher
    to lower layers creating a loop in the network that allows signals to circulate
    within it.


    **feedforward network** Layered neural network in which connectivity between layers
    is one way, starting at the input layer and ending at the output layer.


    **gradient descent** Optimization technique in which the parameters are changed
    on every epoch to reduce a cost function, which is a measure of how well a network
    model is performing.


    **Hopfield net** A fully connected neural network model introduced by John Hopfield.
    It was guaranteed to converge to a fixed attractor state, which depended on the
    starting state, and could be used to store and retrieve information. This network
    launched a thousand papers.


    **learning algorithm** Algorithm for changing the parameters of a function based
    on examples. Learning algorithms are said to be “supervised” when both inputs
    and desired outputs are given or “unsupervised” when only inputs are given. Reinforcement
    learning is a special case of a supervised learning algorithm when the only feedback
    is a reward for good performance.


    **logic** Mathematical inference based on assumptions that can only be true or
    false. Mathematicians use logic to prove theorems.


    **machine learning** Branch of computer science that gives computers the ability
    to learn to perform a task from data without being explicitly programmed.


    **millisecond** One thousandth of a second (0.001 sec). The time it takes for
    one cycle of a 1 kilohertz tone.


    **MOOC (massive open online course)** Course of lectures freely available over
    the Internet on any of a wide range of topics. The first MOOC was offered in 2006,
    and there are now more than 9,400 MOOCs attended by 91 million learners in January,
    2018.


    **neuron** Specialized brain cell that integrates inputs from other neurons and
    sends outputs to other neurons.


    **normalization** Maintaining the amplitude of a signal within fixed limits. One
    way to normalize a time-varying positive signal is to div it by its maximum value
    which is then bounded by 1.


    **optimization** Process of maximizing or minimizing a function by systematically
    searching through input values from within an allowed set to find the optimal
    value of the function.


    **overfitting** State reached by a learning algorithm when the number of adjustable
    parameters in a network model is much greater than the number of training data
    and the algorithm uses the excess capacity to memorize the examples. Although'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'overfitting greatly reduces a network’s ability to generalize to new examples,
    it can be reduced by regularization.


    **perceptron** A simple neural network model consisting of one unit and inputs
    with variable weights that can be trained to classify inputs into categories.


    **plasticity** Changes in a neuron that alter its function, such as changes in
    its connection strengths (“synaptic plasticity”) or in how the neuron responds
    to its inputs (“intrinsic plasticity”).


    **probability distribution** Function that specifies the probability of occurrence
    of all possible states of a system or outcomes in an experiment.


    **recurrent network** Neural network whose feedback connections allow signals
    to circulate within it.


    **regularization** Method to avoid overfitting a network model with many parameters
    when the training data are limited, such as weight decay, in which all the weights
    in the network decrease on every epoch of training, and only the weights with
    large positive gradients survive.


    **scaling** How the complexity of an algorithm scales with the size of the problem;;
    For example, adding up n number scales with n, but multiplying all pairs of n
    number scales with n².


    **skunk works** A group working on advanced or secret projects with a high degree
    of autonomy within an organization. Derived from the name of the moonshine factory
    in the comic strip Li’l Abner.


    **sparsity principle** A sparse representation of a signal, such as EEG and fMRI,
    is one that approximates the signal by the weighted sum of only a few fixed basis
    functions, which for independent component analysis are called sources. In a population
    of neurons, a sparse representation of an input is one where only a few neurons
    are highly active. This reduces interference with other patterns of activity that
    represent other inputs.


    **spine** Thorny excrescence on a dendrite of a neuron that serves as the postsynaptic
    site of a synapse.


    **synapse** Specialized junction between two neurons where a signal is passed
    from the presynaptic to the postsynaptic neuron.


    **training and test sets** Because performance on a training set is not a good
    estimate of how well a neural network will perform on new inputs, a test set not
    used during training gives a measure how well the network generalizes. When data
    sets are small, a single sample left out of the training set can be used to test
    the performance of the network trained on the remaining examples, and the process
    repeated for every sample to get an average test performance. This is a special
    case of cross-validation where n = 1, in which n subsamples are held out.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '**Turing machine** Hypothetical computer invented by Alan Turing (1937) as
    a simple model for mathematical calculation. A Turing machine consists of a “tape”
    that can be moved back and forth, a “head” that has a “state” that can change
    the property of the active cell beneath it, and a set of instructions for how
    the head should modify the active cell and move the tape. At each step, the machine
    may modify the property of the active cell and change the state of the head. After
    this, it moves the tape one unit.'
  merge: -1
