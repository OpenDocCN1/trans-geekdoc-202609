  md: 'time. To do this, it made use of the brain’s neural networks that, like the
    most powerful computers on the planet, have massively parallel processors. Algorithms
    that run efficiently on them will eventually win out.


    # Early Pioneers


    In the 1950s and 1960s, shortly after Norbert Wiener introduced cybernetics, based
    on communications and control systems in both machines and living creatures,³
    there was an explosion of interest in self-organizing systems. As a small sample
    of the ingenious creations that explosion gave rise to, Oliver Selfridge created
    Pandemonium,⁴ a pattern recognition device in which feature-detecting “demons”
    vied with one another for the right to represent objects in images (a metaphor
    for deep learning; figure 3.3); and Bernard Widrow and his student Ted Hoff at
    Stanford invented the LMS (least mean squares) learning algorithm,⁵ which, along
    with its successors, is used extensively for adaptive signal processing in numerous
    applications from noise cancellation to financial forecasting. Here I will focus
    on just one of the pioneers of those early decades, Frank Rosenblatt (figure 3.4),
    whose perceptron is the direct antecedent of deep learning.⁶


    # Learning from Examples


    Undeterred by our lack of understanding about brain function, neural network AI
    pioneers plunged ahead with cartoon versions of neurons and how they are connected
    with one another. Frank Rosenblatt at Cornell University (figure 3.4) was one
    of the earliest to mimic the architecture of our visual system for automatic pattern
    recognition.⁷ He invented a deceptively simple network called a “perceptron,”
    a learning algorithm that could learn how to classify patterns into categories,
    such as letters of the alphabet. Algorithms are step-by-step procedures that you
    follow to achieve particular goals, much as you would a recipe to bake a cake
    (chapter 13 will explain algorithms in general).


    If you understand the basic principles for how a perceptron learns to solve a
    pattern recognition problem, you are halfway to understanding how deep learning
    works. The goal of a perceptron is to determine whether an input pattern is a
    member of a category, such as cats, in an image. Box 3.1 explains how the inputs
    to a perceptron are transformed by a set of weights from the input units to the
    output unit. The weights are a measure of the influence that each input has on
    the final decision made by the output unit. But how can we find a set of weights
    that can correctly classify inputs?'
