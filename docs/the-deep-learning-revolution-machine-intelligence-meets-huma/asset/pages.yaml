- pgno: 102
  md: '# 7 The Hopfield Net and Boltzmann Machine


    Computer scientist Jerome Feldman was at the University of Rochester when he embraced
    a connectionist network approach to artificial intelligence in the 1980s. Ever
    the truth teller, Jerry pointed out that the algorithms being used in AI took
    billions of steps to reach an often incorrect conclusion, whereas the brain could
    reach a usually correct conclusion in around 100 steps.¹ Feldman’s “100-step rule”
    was not popular among AI researchers at the time, but a few, most notably Allen
    Newell at Carnegie Mellon, did use it as a constraint.


    Jerry once rescued me when I got stranded at the airport in Rochester, New York.
    I was on my way back to Baltimore from a visit to the General Electric Research
    Laboratory in Schenectady when the pilot started telling us about the weather
    in Rochester. I''d gotten on the wrong plane. After we landed and I booked the
    earliest flight to Baltimore, which didn''t leave until the next day, I bumped
    into Jerry, who was returning home from a committee meeting in Washington, D.C.
    He graciously invited me to stay with him that night. Jerry has since moved on
    to UC, Berkeley, but I think of him whenever I''m stranded at an airport.


    Jerry distinguished between “scruffy” and “neat” connectionist models. Scruffy
    models, like the ones that Geoffrey Hinton and I worked on, distributed the representation
    of objects and concepts across many units in the network, whereas neat models,
    like the ones Jerry believed in, provided a computationally compact representation
    of objects and concepts, with one label on one unit. In a broader context, scruffy
    science uses approximations to get qualitative answers, whereas neat science strives
    to pin down exact solutions to problems. In reality, both are needed to make progress.²
    I had no problem with getting a scruffy toehold, but made every effort to reach
    a neater explanation, and eventually it paid off: Geoffrey and I were about to
    hit the “neat” jackpot.'
