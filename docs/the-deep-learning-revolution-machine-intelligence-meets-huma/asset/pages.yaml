    I could walk to the coffeepot and back before the synaptic input to the neuron
    had reached a peak, which it would in around 1 minute, taking 10 minutes to recover.
    Synapses are the fundamental computational elements in the brain, and the diversity
    of synapse types is telling. This experience taught me that'
