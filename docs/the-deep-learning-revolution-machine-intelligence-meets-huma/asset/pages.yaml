    # The Science of Learning


    Twelve years ago, at the 2005 NIPS Conference in Vancouver, I sat down for breakfast
    with Gary Cottrell, a colleague in the Department of Computer Science and Engineering
    at UC, San Diego. Gary was a part of the original parallel distributed processing
    (PDP) group from the 1980s and is one of its last survivors at UCSD. He is also
    one of the last holdouts from the 1960s, with a ponytail and a beard gone gray.
    He had come across a National Science Foundation announcement requesting proposals
    for Science of Learning Centers. What caught his eye was the $5 million per year
    budget for five years, renewable for an additional five years. He wanted to submit
    a proposal and asked if I could help out. When he said that, if it was successful,
    he would never have to write another grant proposal, I told him that, if it was
    successful, this would be a career-ending grant. He chuckled and we started the
    ball rolling.'
