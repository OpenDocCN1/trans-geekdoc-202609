    However, our brains must continue to adapt to changing conditions, making us super-Turing.
    How this is done while maintaining previous knowledge and skills is an unsolved
    problem. Hava is the program manager for a DARPA project on Lifelong Learning.
    Her Lifelong Learning Program is funding advanced research aimed at creating a
