    A different learning model from classroom courses that are taken “all-or-none,”
    MOOCs are more like books you can pick up and read anytime, selectively: learners
    have a tendency to “graze” and selectively choose lectures that meet their immediate
    needs. Originally thought to be an alternative to the traditional classroom, MOOCs
    are finding a complementary place in the educational firmament that is different
    from other teaching venues, one that fulfills learners’ needs in a way more conventional
    educational approaches do not. Thus, for example, MOOCs have been adopted in flipped
    classes, in which students watch selected lectures on their own time and the teacher
    leads a discussion of the material in the class. Our educational system was designed
    for the industrial age, and the knowledge imparted in schools was all you needed
    to hold a job and be a productive citizen for the rest of your life. Today, the
    knowledge imparted by schools is already obsolete by the time students graduate.
    MOOCs are an end run around the educational system by going directly into homes.
    At Coursera, the peak in the demographics of those enrolling online is in the
    25–35 age bracket, and more than half of enrollees have a college education. These
    are young adults in the workforce who need new skills and are learning them online.
    More fundamental changes will be needed in our educational system to adapt our
    brains to rapidly expanding jobs in the information sector of the economy. For
    example, gathering information through the Internet requires judgment and basic
    skills in formulating search terms and sorting through false trails. Alas, there
    seems to be no time to teach basic'
