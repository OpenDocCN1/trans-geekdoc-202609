  md: '# Cool Chips


    I first met Carver Mead (figure 14.1) at a workshop held at a resort outside Pittsburgh
    in 1983. Geoffrey Hinton had assembled a small group to explore where neural networks
    were heading. Mead was famous for his major contributions in computer science.
    He was the first to realize that, as the transistors on very large-scale integration
    chips became smaller and smaller, the chips would become more and more efficient,
    and therefore computational power should continue to increase for a long time.
    He coined the term “Moore’s law,” based on Gordon Moore’s observation that the
    number of transistors on chips was doubling every eighteen months. He was already
    legendary for inventing, in 1981, the silicon compiler, a program that automatically
    laid out the pattern of wires and system-level functional modules on a chip.²
    Before the silicon compiler, each chip was handcrafted by engineers based on experience
    and intuition. In essence, Mead’s solution was to program computers to design
    their own chips. These were our first steps toward nanoscale engineering.


    Mead is a visionary. Even as we were huddling around a table in a small room at
    the workshop outside Pittsburgh, a supercomputer convention was


    ![](img/dd452eef0506ea820c436fef2f776436_218_0.png)


    Figure 14.1

    Carver Mead in 1976, around the time he created the first silicon compiler at
