- pgno: 258
  md: 'When the pioneers of computer vision set out to engineer vision, their goal
    was to create a complete internal model of the world from an image, a goal that
    has proven difficult to achieve. But a complete and accurate model may not be
    necessary for most practical purposes, and it might not even be possible given
    the low sampling rate of current video cameras.


    Based on evidence from psychophysics, physiology, and anatomy, Patricia Churchland,
    neuropsychologist V. S. Ramachandran, and I came to the conclusion that the brain
    represents only a limited part of the world, only the part needed at any moment
    to carry out the task at hand.4 This also makes it easier for reinforcement learning
    to narrow down the number of possible sensory inputs that contribute to obtaining
    rewards. The apparent modularity of vision (its relative separateness from other
    sensory processing streams) is also an illusion. The visual system integrates
    information from other streams, including signals from the reward system indicating
    the values of objects in the scene, and the motor system actively seeks information
    by repositioning sensors, such as moving eyes and, in some species, ears to gather
    information that may lead to rewarding actions.


    Brains evolved through a long process of progressive adaptation to the environment;
    nature could not afford to start with a clean slate but had to make do by modifying
    parts and pieces while keeping the current species viable. In his book *Evolving
    Brains*,5 John Allman illustrates progressive evolution on an urban human scale
    by recounting a visit to the boiler room of an old power plant in San Diego, where
    he noticed an intricate array of small pneumatic tubes next to a bank of vacuum
    tubes, alongside several generations of computer control systems. Because the
    plant was needed for continuous power output, it could not be shut down and retrofitted
    with each new technology, so the old control systems were left in place and the
    new ones integrated into them. So, too, with evolving brains: nature could not
    afford to throw out an old brain system, but tinkered with the current developmental
    plan, occasionally adding a new layer of control. Gene duplication was a favorite
    route for introducing a copy of a gene that could mutate for a new function. Whole
    genome duplication also occurred, which could lead to an entirely new species.


    # The Case against Noam Chomsky


    Psychologists who studied learning in the 1930s approached behavior as a transformation
    of sensory inputs into motor outputs and called themselves “behaviorists.” Associative
    learning was the focus for behaviorism, and many laws of learning were uncovered
    by training animals on different reward schedules. B. F. Skinner at Harvard University
    was a leader in this'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'field and wrote several popular books to explain the consequences of his discoveries
    for society.⁶ Interest about behaviorism was high in the popular press at that
    time.


    In 1971, the eminent linguist Noam Chomsky (figure 17.2) wrote a devastating attack
    on behaviorism in general, and B. F. Skinner in particular, in the New York Review
    of Books (figure 17.3).⁷ Here is a sample of his argument specifically on language:


    > But what does it mean to say that some sentence of English that I have never
    heard or produced belongs to my “repertoire,” but not any sentence of Chinese
    (so that the former has a higher “probability”)? Skinnerians, at this point in
    the discussion, appeal to “similarity” or “generalization,” but always without
    characterizing precisely the ways in which a new sentence is “similar” to familiar
    examples or “generalized” from them. The reason for this failure is simple. So
    far


    ![](img/dd452eef0506ea820c436fef2f776436_259_0.png)


    Figure 17.2 Noam Chomsky in 1977, after he wrote “The Case against B. F. Skinner”
    for the New York Review of Books. Chomsky’s essay had a profound impact on a generation
    of cognitive psychologists, who would embrace symbol processing as a conceptual
    framework for cognition and discount the essential role of brain development and
    learning in cognition and intelligence. Hans Peters/Anefoto.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/dd452eef0506ea820c436fef2f776436_260_0.png)


    **Figure 17.3**


    Cover headline for Noam Chomsky''s 1971 takedown of B. F. Skinner in the *New
    York Review of Books*. Chomsky''s essay would influence a generation of scientists
    to abandon behavioral learning and take up symbol processing as a way to explain
    cognition. But with the symbolic approach, artificial intelligence never achieved
    cognitive levels of performance. B. F. Skinner was on the right track with reinforcement
    learning, which Chomsky derided: today''s most compelling AI applications are
    based on learning, not logic. Courtesy of the *New York Review of Books*.'
