    **Figure 3.3** Pandemonium. Oliver Selfridge imagined that there were demons in
    the brain that were responsible for extracting successively more complex features
    and abstractions from sensory inputs, resulting in decisions. Each demon at each
    level is excited if it is a match to input from an earlier level. The decision
    demon weighs the degree of excitement and importance of its informants. This form
    of evidence evaluation is a metaphor for current deep learning networks, which
    have many more levels. From Peter H. Lindsay and Donald A. Norman, Human Information
    Processing: An Introduction to Psychology, 2nd ed. (New York: Academic Press,
    1977), figure 3-1. Wikipedia Commons: https://commons.wikimedia.org/wiki/File:Pande.jpg.


    The traditional way that an engineer solves this problem is to handcraft the weights
    based on analysis or an ad hoc procedure. This is labor intensive and often depends
    on intuition as much as on engineering. An alternative is to use an automatic
    procedure that learns from examples, the same way that we learn about objects
    in the world. Many examples are needed including those not in the category, especially
    if they are similar, such as dogs if the goal is to recognize cats. The examples
    are passed to the perceptron one at a time and corrections are automatically made
    to the weights if there is a classification error.


    The beauty of the perceptron learning algorithm is that it is guaranteed to find
    a set of weights automatically if such a set of weights exists and if enough examples
    are available. The learning takes place incrementally after each of the examples
    in the training set is presented and the output compared with the correct answer.
