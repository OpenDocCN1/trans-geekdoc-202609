- pgno: 252
  md: 'These two types of processing are intermingled in the brain and difficult to
    disentangle, but recently a novel search task was developed to tease them apart.20
    Participants were seated in front of a blank screen and told that their task was
    to explore the screen with their eyes to find a hidden target location that would
    sound a reward tone when their gaze fixated near it. The hidden target position
    varied from trial to trial and was drawn from a Gaussian distribution—a bell-shaped
    curve characterized by the position of its peak and width—that was not known to
    participants but remained constant during a session (figure 16.4D).


    At the start of a session, participants had no prior knowledge to inform their
    search. Once a fixation was rewarded, they could use that feedback to assist on
    the next trial. As the session proceeded, participants improved their success
    rates by developing an expectation for the distribution of hidden targets and
    using it to guide future searches. After approximately a dozen trials, the participants''
    visual fixations narrowed to the region with high target probability. A characterization
    of this effect for all participants is shown in figure 16.4D. The search region,
    initially broad, narrowed as the session progressed. Surprisingly, many of the
    subjects were not able to articulate their search strategy, even though their
    first saccade after a few trials was invariably to the center of the invisible
    target distribution.


    These experiments point toward unconscious control of actions that is guided by
    experience. By eliminating the visual input, the unconscious processes can be
    studied in isolation. The brain areas that are involved in this search task include
    the visual cortex and the superior colliculus, which controls the topographic
    map of the visual field and directs saccades to visual targets, respectively,
    working closely with other parts of the oculomotor system. Learning also involves
    the basal ganglia, an important part of the vertebrate brain that learns sequences
    of actions through reinforcement learning.21 The difference between the expected
    and received reward is signaled by a transient increase in the firing rate of
    dopamine neurons in the midbrain, which regulates synaptic plasticity and influences
    how decisions and plans are made at an unconscious level (as discussed in chapter
    10).


    # Passages


    Near the end of his life, Francis Crick invited me to visit him at his home to
