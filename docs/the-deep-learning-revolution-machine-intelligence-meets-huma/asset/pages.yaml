- pgno: 100
  md: 'Because independent component analysis is unsupervised, it can reveal networks
    of brain areas that work together, which goes beyond supervised techniques that
    try to relate the activity in an area to a sensory stimulus or motor response.
    For example, ICA has been used to uncover multiple resting states in fMRI recordings
    from subjects who are simply asked to stay still in the scanner and rest.¹² We
    still do not yet understand what these resting states mean, but they could represent
    combinations of brain areas that are responsible for what happens in our brains
    when we daydream, have a nagging concern in the back of our mind, or are planning
    dinner.


    The principle of maximum independence is related to principles of sparse coding.
    Although ICA uncovers many independent components, only a few of them were needed
    to reconstruct a given patch from a natural image. This principle also applies
    to the visual cortex, which has one hundred times more cells than the inputs coming
    from a retina. Each of our retinas has 1 million ganglion cells, and there are
    100 million neurons in the primary visual cortex, the first of many layers in
    the visual hierarchy in the cortex. The compact coding of visual signals in the
    retinas gets expanded in the cortex to a new code that is highly distributed and
    highly sparse. The expansion into a space of much higher dimensionality is exploited
    in other coding schemes, including those found in auditory cortex and olfactory
    cortex, and a new class of algorithms called “compressed sensing algorithms” has
    generalized the principle of sparsity to improve the efficiency of storing and
    analyzing complex data sets.¹³


    # Beyond Independent Component Analysis


    The story of ICA illustrates the importance of techniques in making new discoveries
    in science and engineering. We normally think of techniques as measuring devices
    like microscopes and amplifiers. But algorithms are also techniques, and they
    can allow new discoveries to be made with data from old instruments. EEG recordings
    have been around for nearly 100 years, but without independent component analysis,
    it wasn’t possible to pin down the underlying brain sources. The brain itself
    is a system of interlocking algorithms, and I would not be surprised if in some
    part of the brain nature discovered a way to implement ICA.¹⁴


    During the 1990s, many other advances were made in developing new learning algorithms
    for neural networks, many of which, like ICA, are now part of the mathematical
    toolbox in machine learning. These algorithms are embedded in many commonly used
    appliances, none of which say “neural networks inside.” Take headsets or cell
    phones, for example. Te-Won Lee'
