  md: 'Neural Networks for Pattern Recognition (Oxford University Press, 1995) by
    Christopher M. Bishop is a good place to learn the fundamentals of neural networks.
    The deep connection between information theory and learning algorithms is beautifully
    expounded in Information Theory, Inference, and Learning Algorithms (Cambridge
    University Press, 2003) by David J. C. MacKay. Deep learning is growing rapidly:
    Deep Learning: A Practitioner’s Approach (O’Reilly Media, 2017) by Josh Patterson
    and Adam Gibson is a good introduction, and Deep Learning (MIT Press, 2016) by
    Ian Goodfellow, Yoshua Bengio, and Aaron Courville is currently the definitive
    textbook, available online (http://www.deeplearningbook.org). Machine Learning:
    A Probabilistic Perspective (MIT Press, 2014) by Kevin P. Murphy is a compendium
    that covers the broader range of machine learning algorithms. Deep reinforcement
    learning is at the forefront of research, and the definitive textbook is Reinforcement
    Learning: An Introduction (MIT Press, 1998) by Richard S. Sutton and Andrew G.
    Barto (online draft of forthcoming second edition available at http://www.incompleteideas.net/sutton/book/the-book-2nd.html).'
