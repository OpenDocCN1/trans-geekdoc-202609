  md: '# Box 6.1

    How Independent Component Analysis Works


    ![](img/dd452eef0506ea820c436fef2f776436_95_0.png)


    Comparison between principal component analysis (PCA) and independent component
    analysis (ICA). The outputs from the two microphones in figure 6.1 are plotted
    against each other on the vertical and horizontal axes above. The coordinates
    of each dot are their values at a single time point. PCA is a popular unsupervised
    learning technique that picks out a direction that bisects the two signals, maximally
    mixing them, and the PCA axes are always perpendicular to each other. ICA finds
    the axes that fall along the directions of the dots, representing the separated
    signals, which may not be perpendicular.


    These results confirmed a conjecture made by Horace Barlow, a distinguished vision
    scientist, in the 1960s, when David Hubel and Torsten Wiesel discovered simple
    cells in the visual cortex. An image contains a great deal of redundancy because
    nearby pixels often have similar values (such as pixels in the sky). Barlow conjectured
    that, by reducing the redundancy in the representation of natural scenes,8 the
    simple cells were able to transmit the information in the image more efficiently.
    It took fifty years to develop the mathematical tools to confirm his intuition.


    Tony and I also showed that when independent component analysis is applied to
    natural sounds, the independent components are temporal filters with different
    frequencies and durations, similar to the filters found in the early stages of
    the auditory system.9 This gave us confidence that we were on the right track
    to understanding fundamental principles about how the sensory signals were represented
    in the earliest stages of processing in the visual cortex. By extending this principle
    to independent feature subspaces of linear filters, it was possible to model complex
    cells in visual cortex.10'
