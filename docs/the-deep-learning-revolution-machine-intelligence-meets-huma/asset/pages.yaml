  img_proc: true
- pgno: 107
  md: 'The energy function for the networks included the lengths of the paths and
    constraints on visiting each city once. After an initial transient, Hopfield and
    Tank''s network would settle down to a state of minimum energy that represented
    a good tour, though not always the best tour.


    # Finding the Global Energy Minimum


    Dana Ballard, who with Christopher Brown had written a classic book on computer
    vision in 1982, 11 was also at the 1983 workshop. Geoffrey Hinton and I were working
    with Dana on a review of a new approach to analyzing images for Nature.12 The
    idea was that the nodes in a network model represented features in the image and
    the connections in the network implemented constraints between the features; compatible
    nodes had positive interactions and inconsistent nodes had negative interactions
    with one another. In vision, a consistent interpretation of all the features must
    be found that satisfies all the constraints.


    Could the Hopfield net solve this constraint satisfaction problem? The energy
    function was a measure of how well the network satisfied all the constraints (See
    box 7.1). The vision problem required a solution that was the global energy minimum,
    the best solution, whereas the Hopfield net, by design, found only local minima
    of the energy. I had recently come across a paper in the journal Science by Scott
    Kirkpatrick, then at IBM''s Thomas J. Watson Research Center in Yorktown Heights,
    New York, that I thought could help.13 Kirkpatrick used a method called “simulated
    annealing” to get around local minima. Suppose you had a bunch of components in
    an electrical circuit that had to be mounted onto two circuit boards. What would
    be the best placement of the parts to minimize the number of wires needed to connect
    them?


    Poor solutions are found by initially randomizing the placement of the parts,
    then moving them back and forth one at a time to see which placement had fewest
    wires because the network can easily get trapped in a local minimum when there
    is no improvement by moving any single component. The way to escape the local
    minimum is to allow random jumps to a configuration with longer wire lengths.
    The probability of jumping out, though high at the beginning, gradually decreases
    so that, by the end, it is zero. If the decrease in probability is slow enough,
    the final placement of the parts will have a global minimum of connecting wires.
    In metallurgy, this process is called “annealing”; heating up a metal and slowly
    cooling it produces large crystals with minimal defects, which are what make the
    metal brittle and prone to cracks.'
