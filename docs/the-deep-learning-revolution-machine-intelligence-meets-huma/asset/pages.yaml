  md: '# # I Intelligence Reimagined


    # ## Timeline


    **1956—The Dartmouth Artificial Intelligence Summer Research Project** gave birth
    to the field of AI and motivated a generation of scientists to explore the potential
    for information technology to match the capabilities of humans.


    **1962—Frank Rosenblatt** published *Principles of Neurodynamics: Perceptrons
    and the Theory of Brain Mechanisms*, which introduced a learning algorithm for
    neural network models with a single layer of variable weights—the precursor of
    today’s learning algorithms for deep neural network models.


    **1962—David Hubel and Torsten Wiesel** published “Receptive Fields, Binocular
    Interaction and Functional Architecture in the Cat’s Visual Cortex,” which reported
    for the first time the response properties of single neurons recorded with a microelectrode.
    Deep learning networks have an architecture similar to the hierarchy of areas
    in the visual cortex.


    **1969—Marvin Minsky and Seymour Papert** published *Perceptrons*, which pointed
    out the computational limitations of a single artificial neuron and marked the
    beginning of a neural network winter.


    **1979—Geoffrey Hinton and James Anderson** organized the Parallel Models of Associative
    Memory workshop in La Jolla, California, which brought together a new generation
    of neural network pioneers and led to publication of Hinton and Anderson’s collected
    volume by the same title in 1981.


    **1987—The First Neural Information Processing Systems (NIPS) Conference and Workshop**
    was held at the Denver Tech Center, bringing together researchers from many fields.'
  merge: -1
  img_proc: true
