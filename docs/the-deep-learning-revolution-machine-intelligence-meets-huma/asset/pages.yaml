    Golomb (figure 15.3) of the University of Southern California, whose work on shift
    register sequences was fundamental to modern digital communication.² A shift register
    sequence is an algorithm that generates long pseudorandom sequences of 0s and
    1s. Every time you make a call on your cell phone you are using a shift register
    sequence. Golomb showed how to use a shift register sequence to efficiently encode
    signals, which could then be transmitted and decoded at the receiver. If you were
    to add up all the times that cell phones and other communications systems have
    generated a shift register sequence, the number would be staggering: more than
    an octillion times, which is 10²⁷, a billion billion billion (1,000,000,000,000,000,000,000,000,000).³


