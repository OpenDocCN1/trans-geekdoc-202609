- pgno: 132
  md: 'performance may not be degraded as much as you might imagine. The benefit for
    learning with dropout at the level of synapses may outweigh the cost in reduced
    accuracy. And since synapses take a lot of energy to operate, dropout also saves
    energy. Finally, because the cortex uses probabilities to compute likely—not certain—outcomes,
    using probabilistic components is an efficient way to represent a probability.


    However unreliable they may be, cortical synapses are surprisingly precise in
    their strength. The sizes of cortical synapses and their corresponding strengths
    vary over a factor of 100, and the strengths of single synapses can be increased
    or decreased within this range. Working with Kristen Harris, a neuroanatomist
    at the University of Texas at Austin, my lab recently reconstructed a small piece
    of the rat hippocampus, a brain area needed for forming long-term memories, which
    contained 450 synapses. Most axon formed a single synapse on a dendritic branch,
    but in a handful of cases, two synapses from a single axon contacted the same
    dendrite. To our surprise, these were nearly identical in size; from previous
    studies, we knew this meant they had nearly the same strength. Much is known about
    the conditions that lead to changes in the strengths of these synapses, which
    depend on the history of input spikes and the corresponding electrical activity
    of the dendrite, which was the same for the pair of synapses from the same axon
    on the same dendrite. From these observations, we inferred that the precision
    with which information is stored in the strengths of synapses is high, enough
    to store at least five bits of information.20 That learning algorithms for deep
    recurrent networks need only five bits to achieve high levels of performance may
    not be a coincidence.21


    The dimensionality of networks in the brain is so high that we do not even have
    a good estimate of how high. The total number of synapses in the cerebral cortex
    is around a hundred trillion, an astronomically high upper bound. A human lifetime
    is no more than a few billions seconds long. At that rate, you could afford to
    dedicate a hundred thousand synapses to each second of your life. In practice,
    neurons tend to have clustered local connections, such as those within a cortical
    column of one hundred thousand neurons connected by a billion synapses. Although
    this is still a large number, it is not an astronomical one. Long-range connections
    are much less common than local connections because neural wires take up precious
    volume and consume a lot of energy.


    The number of neurons that represent an object or concept in the cortex is an
    important number to pin down. A rough estimate for the number of synapses needed
    is about a billion, and the number of neurons needed is about one hundred thousand,
    distributed in ten cortical areas,22 allowing'
