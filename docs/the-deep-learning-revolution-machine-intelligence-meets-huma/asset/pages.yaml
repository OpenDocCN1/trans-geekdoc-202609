- pgno: 127
  md: 'to apply rules. Most English speakers will pronounce nonsense words like “brillig,”
    “slithy,” and “toves” from Lewis Carroll’s “Jabberwocky” without effort, the same
    way they would normal words, as will NETtalk. These pseudowords aren’t in any
    dictionary but trigger phonemes formed from related letter patterns in English.


    NETtalk made a deep impression on audiences, but now Charlie Rosenberg and I needed
    to analyze the network to figure out how it worked. To do that, we applied cluster
    analysis to the activity patterns in the hidden units and discovered that NETtalk
    had discovered the same grouping of similar vowels and consonants that linguists
    had identified. Mark Seidenberg and James McClelland used a similar approach as
    a starting point for a detailed comparison with the sequence of stages that children
    go through when they learn how to read.⁹


    NETtalk had an impact on the world in ways that no one could have anticipated.
    As a faculty member of the Thomas C. Jenkins Department of Biophysics at the Johns
    Hopkins University, I became interested in the problem of protein folding. Proteins
    are string of amino acids that fold up into complex shapes, endowing them with
    a wide range of functions, such as hemoglobin, which binds to oxygen in your red
    blood cells. Predicting the 3D shape of a protein from its amino acid sequence
    is a difficult computational problem that is unsolved for most proteins even with
    the most powerful computers. However, there are motifs that are more predictable,
    called secondary structures, in which the amino acids wind up in the shape of
    a helix, a flat sheet, or a random coil. The algorithms being used by biophysicists
    took into account the chemical nature of the different amino acids, but their
    predictions were not good enough to help with the 3D folding problem.


    Ning Qian was a first year graduate student in my lab who was one of the few chosen
    from all the physics students in China to come to the US for graduate studies
    in 1980. We wondered whether NETtalk could be used to take a string of amino acids
    and predict protein secondary structures, assigning alpha helix, a beta sheet,
    or a random coil to each amino acid. This is an important problem because the
    3D structure of a protein determines its function. Instead of a string of letters,
    the input was a string of amino acids, and instead of predicting phonemes, the
    network predicted the secondary structure. The training set was 3D structures
    determined by x-ray crystallography. To our surprise, the secondary structure
    predictions for new proteins were far better than the best methods based on biophysics.10
    This landmark study was the first application of machine learning to molecular
    sequences, a field that is now called bioinformatics.'
