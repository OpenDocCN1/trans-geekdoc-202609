- pgno: 65
  md: 'building an algorithm to solve the problem, and finally by implementing the
    algorithm in hardware. But, even though this may be a good way to explain things
    after you have figured them out, it isn''t such a good way to discover what''s
    going on in the brain. The difficulty is in the first step, in deciding on what
    problem the brain is solving. Our intuition is often misleading, particularly
    when it comes to vision; we are exceptionally good at seeing, but the brain hides
    all the details from us. As a consequence, a pure top-down strategy is flawed,
    but so is a pure bottom up strategy. (Later chapters will explore how progress
    was made in understanding vision working from the inside out with learning algorithms.)


    Also attending Hinton and Anderson''s workshop in La Jolla was Francis Crick (figure
    4.2, right), who with James Watson at Cambridge University had discovered the
    structure of DNA in 1953. Decades after his discovery, in 1977, Crick had moved
    to the Salk Institute for Biological Studies in La Jolla and shifted his research
    focus to neuroscience. He would invite researchers to visit him and have a long
    discussion on many topics in neuroscience, especially on vision, and David Marr
    was one of those visitors. At the end of Marr''s book, there is a revealing discussion
    in the form of a Socratic dialogue, a dialogue I later learned had arisen from
    Marr''s discussions with Crick. On moving to the Salk Institute in 1989, I, too,
    came to appreciate the value of having a dialogue with Crick.


    # George Boole and Machine Learning


    In 1854, a self-taught British schoolteacher who had five daughters, some of whom
    were mathematically inclined, wrote a book entitled *An Investigation of the Laws
    of Thought*, which was the mathematical foundation for what is now called “Boolean
    logic.” George Boole''s insights into how to manipulate logical expressions are
    at the heart of digital computing and were a natural starting point for fledging
    efforts in artificial intelligence in the 1950s. Geoffrey Hinton, who happens
    to be Boole''s great-great-grandson, is proud to have a pen once used by Boole
    and handed down in his family.


    In preparing a talk, I discovered that the full title of Boole''s famous book
    is *An Investigation of the Laws of Thought, on Which Are Founded the Mathematical
    Theories of Logic and Probabilities* (figure 4.3). Although best remembered for
    its insights into logic, *Investigation* also has much to say about probability
    theory, which is at the heart of modern machine learning and can describe the
    uncertainties in the real world far better than logic. So Boole is also one of
    the fathers of machine learning. What an irony that a forgotten side of his thinking
    should flower 250 years later through his great-great-grandson. Boole would have
    been proud of him.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '![](img/dd452eef0506ea820c436fef2f776436_66_0.png)


    Figure 4.3 Although *The Laws of Thought* by George Boole is famous for investigating
    logic as a basis for thinking, note that it is also about probabilities. These
    two areas of mathematics inspired symbol processing and machine learning approaches
    to artificial intelligence, respectively.


    # The Humpty Dumpty Project


    As a graduate student in the Physics Department at Princeton, I approached the
    problem of understanding the brain by writing down equations for networks of nonlinearly
    interacting neurons and by analyzing them,11 much as physicists have over the
    centuries used mathematics to understand the nature of gravity, light, electricity,
    magnetism, and nuclear forces. Every night before bed, I would pray: “Dear Lord,
    let the equations be linear, the noise be Gaussian, and the variables be separable.”
    These are the conditions that lead to analytic solutions, but because neural network
    equations turn out to be nonlinear, the noise associated with them non-Gaussian,
    and the variables nonseparable, they do not have explicit solutions. Moreover,
    simulating the equations on computers at that time was impossibly slow for large
    networks; even more discouraging, I had no idea whether I had the right equations.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Taking courses at Princeton, I discovered that exciting progress was being
    made by neuroscientists, whose relatively young science was founded forty-five
    years ago. Before that, research on the brain was carried out in many disciplines:
    biology, psychology, anatomy, physiology, pharmacology, neurology, psychiatry,
    bioengineering, and many others. At the first meeting of the Society for Neuroscience
    in 1971, Vernon Mountcastle personally greeted everyone at the door.¹² Today there
    are over 40,000 members of the society, and 30,000 show up at the annual meeting.
    I met this legendary neurophysiologist, who had discovered the cortical column
    and who had a formidable personality, at the Johns Hopkins University when I moved
    to the Department of Biophysics there for my first job in 1982.¹³ I would work
    closely with Mountcastle in planning the Mind/Brain Institute at Johns Hopkins,
    the first institute of its kind in the world, established in 1994.


    There are many different levels of investigation in the brain (figure 4.4), and
    important discoveries have been made at each of them; integrating all that knowledge
    is a formidable problem. This is reminiscent of the Humpty Dumpty nursery rhyme:


    > Humpty Dumpty sat on a wall,

    > Humpty Dumpty had a great fall.

    > All the king''s horses and all the king''s men

    > Couldn''t put Humpty together again.


    Although neuroscientists are very good at taking the brain apart, putting the
    pieces together poses a more difficult problem, one that requires synthesis rather
    than reduction, which is what I wanted to do. But first I had to know what the
    parts are, and the brain has lots of parts.


    In a graduate seminar taught by Charles Gross, a psychologist who studied the
    monkey visual system at Princeton, I was impressed with the progress that had
    been made by David Hubel and Torsten Wiesel at Harvard Medical School in recording
    from single neurons in the visual cortex. If physics wasn''t the royal road to
    understanding how the brain works, maybe neuroscience would be. For their pioneering
    work in the primary visual cortex, Hubel and Wiesel would receive a Nobel Prize
    in Physiology or Medicine in 1981. (Their discoveries, discussed in chapter 5,
    are the basis for deep learning, the subject of chapter 9.)


    # What I learned at Woods Hole


    After finishing my doctorate in physics at Princeton in 1978, I attended a ten-week,
    in-depth summer course on experimental neurobiology at the'
