  md: '# The Shifting Job Market


    Introduced by banks in the late 1960s to dispense cash to account holders 24/7,
    a much-welcomed convenience for those in need of cash before or after normal banking
    hours, automated teller machines (ATMs) have since acquired the ability to read
    handwritten checks. And though they reduced routine work for bank tellers, there
    are more bank tellers than before providing customers with personalized services
    such as mortgage and investment advice, and new ATM repair jobs—just as the steam
    engine displaced manual laborers, on the one hand, but gave rise to new jobs for
    skilled workers who could build and maintain steam engines and drive steam locomotives,
    on the other. So, too, Amazon’s online marketing has displaced many workers from
    local brick-and-mortar retail stores but has also created 380,000 new jobs for
    workers in the distribution and delivery of the goods sold by it and by the many
    businesses under its umbrella.43 And as jobs that now require human cognitive
    skills are taken over by automated AI systems, there will be new jobs for those
    who can create and maintain these systems.


    Job turnover is nothing new. Farmworkers in the nineteenth century were displaced
    by machines, and new jobs were created at city factories made possible by machines,
    all of which required an educational system to train workers in new skills. The
    difference is that, today, the new jobs being opened up by artificial intelligence
    will require new, different, and ever-changing skills in addition to traditional
    cognitive skills.44 So we will need to learn throughout our lifetimes. For this
    to happen, we will need a new educational system that is based at the home rather
    than the school.


    Fortunately, just as the need for finding new jobs has become acute, the Internet
    has made available free massive open online courses (MOOCs) to acquire new knowledge
    and skills. Though still in their infancy, MOOCs are evolving rapidly in the education
    ecosystem and hold great promise for delivering quality instruction to a wider
    range of people than ever before. When coupled with the next generation of digital
    assistants, MOOCs could be transformational. Barbara Oakley and I developed a
    popular MOOC called “Learning How to Learn” that teaches you how to become a better
    learner (figure 1.11) and a follow-up MOOC called “Mindshift” that teaches you
    how to reinvent yourself and change your lifestyle (both MOOCs will be described
    in chapter 12).


    As you interact with the Internet, you are generating big data about yourself
    that is machine readable. You are being targeted by ads generated'
