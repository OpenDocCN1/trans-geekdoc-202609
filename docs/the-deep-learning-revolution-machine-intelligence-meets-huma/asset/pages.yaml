  md: '# Rubi


    Javier Movellan (figure 12.1) is from Spain and was a faculty member and co-director
    of the Machine Perception Laboratory at the Institute for Neural Computation at
    UC, San Diego. He believed that we would learn more about cognition by building
    robots that interact with humans than by conducting traditional laboratory experiments.
    He built a robot baby that smiled at you when you smile at it, which was remarkably
    popular with passersby. Among Javier’s conclusions after studying babies interacting
    with their mothers was that babies maximize smiles from their moms while minimizing
    their own effort.¹


    Javier’s most famous social robot, Rubi, looks like a Teletubby, with an expressive
    face, eyebrows that rise to show interest, camera eyes that move around, and arms
    that grasp (figure 12.2). In the Early Childhood Education Center at UCSD, 18-month-old
    toddlers interacted with Rubi using the tablet that serves as Rubi’s tummy.


    Toddlers are difficult to please. They have very short attention spans. They play
    with a toy for a few minutes, then lose interest and toss it away. How would they
