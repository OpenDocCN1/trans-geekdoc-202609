  md: '# 14 Hello, Mr. Chips


    We are seeing the birth of a new architecture for the computer chip industry.
    The race is on to design and build a new generation of chips to run learning algorithms,
    whether deep, reinforcement, or other, thousands of times faster and more efficiently
    than the way they are now simulated on general-purpose computers. The new very
    large-scale integration (VLSI) chips have parallel processing architectures, with
    memory onboard to alleviate the bottleneck between memory and the central processing
    unit (CPU) in the sequential von Neumann architectures that have dominated computing
    for the last fifty years. We are still in an exploratory phase with regard to
    hardware, and each type of special-purpose VLSI chip has different strengths and
    limitations. Massive amounts of computer power will be needed to run the large-scale
    networks that are being developed for AI applications, and there is tremendous
    potential for profit in building efficient hardware.


    Major computer chip companies and startups alike are making substantial investments
    in developing chips for deep learning. In 2016, for example, Intel purchased Nervana,
    a small start-up company in San Diego that has designed special-purpose VLSI chips
    for deep learning, for $400 million; former Nervana CEO Naveen Rao is now heading
    Intel’s new AI Products Group, which reports directly to the CEO of Intel. In
    2017, Intel purchased Mobileye, a company that specializes in sensors and computer
    vision for self-driving cars, for $15.3 billion dollars. Nvidia, which developed
    special-purpose digital chips optimized for graphics applications and gaming,
    called “graphics processing units” (GPUs), is now selling more special-purpose
    chips for deep learning and cloud computing. And Google has designed a far more
    efficient special-purpose chip, the tensor processing unit (TPU), to power deep
    learning for its Internet services.


    But specialized software is equally important for developing deep learning applications.
    Google has made its TensorFlow program for running deep learning networks openly
    available, though this may not be as altruistic as'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'it seems. Making Android freely available, for example, gave Google control
    of the operating system now used on most smartphones around the world. But now
    there are openly available alternatives to TensorFlow: CNTK from Microsoft, MVNet,
    backed by Amazon and other major Internet companies, and other viable deep learning
    programs, such as Caffe, Theano, and PyTorch.


    # Hot Chips


    In 2011, I organized “Growing High Performance Computing in a Green Environment,”
    a symposium sponsored by the Kavli Foundation and held in Tromsø, Norway.¹ We
    estimated that, with current microprocessor technology, exascale computing (a
    thousand times more powerful than petascale computing) would require 50 megawatts—more
    power than needed to run the New York City subways. The next generation of supercomputers
    may therefore have to run on low-power chips like the ones developed and optimized
    for cell phones by the UK-based multinational semiconductor company Arm Holdings
    (ARM). Soon it will no longer be practical to use general-purpose digital computers
    for the most compute-intensive applications, and special-purpose chips will dominate,
    as they already have in cell phones.


    There are around 100 billion neurons in a human brain, each connected to around
    several thousand others, adding up to a thousand trillion (10¹⁵) synaptic connections.
    The power needed to run the brain is around 20 watts, or 20 percent of the power
    needed to run the entire body, even though the brain accounts for only 3 percent
    of the body’s mass. In contrast, a petascale supercomputer, which is not nearly
    as powerful as the brain, consumes 5 megawatts, or 250,000 times as much power.
    Nature accomplished this marvel of efficiency by miniaturizing the components
    of neurons needed for signaling and communicating down to the molecular level
    and by interconnecting the neurons in three dimensions (transistors on the surface
    of microchips are interconnected in only two), making it possible to minimize
    the volume needed. And because nature evolved these technologies long ago, we
    have plenty of catching up to do.


    Deep learning is highly compute intensive and is now done on centralized servers,
    with the results delivered to edge devices like cell phones. Ultimately, the edge
    devices should be autonomous, which will require radically different hardware—hardware
    that is much lighter and much less power hungry than cloud computing is. But,
    fortunately, such hardware already exists—neuromorphic chips, whose design was
    inspired by the brain.'
