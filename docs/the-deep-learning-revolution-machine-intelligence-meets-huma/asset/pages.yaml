    dysfunction. He famously dropped his pants during a lecture at a meeting

    of the American Urological Association in Las Vegas, Nevada, to demon-

    strate the effectiveness of a chemically-induced erection. Marr’s doctoral

    dissertation described a neural network model of learning in the cerebellum,

    a part of the brain that is involved with fast motor control. He also

    developed neural network models of the hippocampus and the cerebral cor-

    tex, described in dense papers that have proven to be prescient.⁷


    When I first met Marr at Jackson Hole, he had already moved to MIT,

    where he was working on vision and where, as a charismatic figure, he had

    attracted talented students to work with him. Pursuing a bottom-up stra-

    tegy, he started at the retina, where light is converted to electrical signals,

    and asked how signals in the retina encoded the features of objects and

    how the visual cortex represented the surfaces and boundaries of objects.

    He and Tomaso Poggio (figure 4.2, left) developed an ingenious recurrent

    neural network model for stereo vision with feedback connections to detect

    the depth of an object from the slight lateral displacements of the images of

    dots in the two eyes in random-dot stereograms.⁸ Binocular depth percep-

    tion is the basis for how Magic Eye images pop out at you.⁹


    Two years after Marr died of leukemia in 1980 at the age of 35, the book

    he was working on at the time, Vision, was published posthumously.¹⁰ Iron-

    ically, despite the bottom-up approach Marr took to his research on vision,

    starting with the retina and modeling each succeeding stage of visual proc-

    essing, his book is best known for advocating a top-down strategy, starting

    with a computational analysis of the problem to be solved, followed by'
