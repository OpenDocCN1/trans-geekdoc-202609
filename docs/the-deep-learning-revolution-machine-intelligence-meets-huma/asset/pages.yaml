  md: '# Learning How to Drive


    The $2 million cash prize for the Defense Advanced Research Projects Agency (DARPA)
    Grand Challenge in 2005 was won by Stanley, a self-driving car instrumented by
    Sebastian Thrun’s group at Stanford, who taught it how to navigate across the
    desert in California using machine learning. The 132-mile course had narrow tunnels
    and sharp turns, including Beer Bottle Pass, a winding mountain road with a sheer
    drop-off on one side and a rock face on the other (figure 1.1). Rather than follow
    the traditional AI approach by writing a computer program to anticipate every
    contingency, Thrun drove Stanley around the desert (figure 1.2), and it learned
    for itself to predict how to steer based on sensory inputs from its vision and
    distance sensors.


    Thrun later founded Google X, a skunk works for high-tech projects, where the
    technology for self-driving cars was developed further. Google’s self-driving
    cars have since logged 3.5 million miles driving around the San Francisco Bay
    Area. Uber has deployed a fleet of self-driving cars in Pittsburgh. Apple is moving
    into self-driving cars to extend the range of


    ![](img/dd452eef0506ea820c436fef2f776436_15_0.png)


    Figure 1.1 Sebastian Thrun with Stanley, the self-driving automobile that won
    the 2005 DARPA Grand Challenge. This breakthrough jump-started a technological
    revolution in transportation. Courtesy of Sebastian Thrun.'
  merge: -1
  img_proc: true
