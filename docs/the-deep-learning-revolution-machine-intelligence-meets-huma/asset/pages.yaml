  md: '![](img/dd452eef0506ea820c436fef2f776436_163_0.png)


    Figure 10.5

    Response of a dopamine neuron in the monkey brain proving that it signals reward
    prediction error to the rest of the brain. Each dot is a spike in dopamine neurons.
    Each line is a single learning trial. The number of spikes in each time bin is
    shown at the top of each raster. (Top) At the beginning of learning, reward is
    unexpected and the dopamine consistently fires a burst of spikes shortly after
    the reward. (Middle) After many trials when a light (conditioned stimulus, CS)
    is consistently flashed before reward delivery, the dopamine cell responds to
    the CS but not the reward. According to temporal difference learning, the response
    after the reward is cancelled by the reward prediction. (Bottom) When the reward
    is withheld on catch trials, a dip in firing is revealed that represents the predicted
