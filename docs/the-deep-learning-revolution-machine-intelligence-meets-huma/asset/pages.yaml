    After his stint as a postdoctoral fellow at UCSD, Geoffrey Hinton returned to
    England, where he had a research position with the Applied Psychology Unit of
    the Medical Research Council (MRC) at Cambridge. One day in 1981, he received
    a call at 2:00 a.m. from someone who introduced himself as Charles Smith, president
