    # The Case against Black Boxes


    In retrospect, behaviorism and cognitive science, which in the twentieth century
    took opposite approaches to behavior, made the same mistake by ignoring the brain.
    Behaviorists did not want to be misled by introspection, so they made it a point
    of honor not to look into the brain for guidance. They believed that it would
    be possible to discover behavioral laws for any contingency by carefully controlling
    the inputs and outputs of the black box. Functionalist cognitive scientists, for
    their part, rejected behaviorism, believing they could discover the internal representations
    of the mind, but because they also believed that the details of how the brain
    implemented the representations were irrelevant,14 the internal representations
    they'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'developed were based on unreliable intuition and folk psychology. Nature was
    cleverer than they were.


    The internal states of the black box are tremendously complex; discovering internal
    representations and the laws of behavior is thus exceedingly difficult. If someday
    we do discover the laws of behavior, we may well be able to give a functional
    account of them, although this account will probably be as counterintuitive as
    quantum mechanics was to physicists. To discover the laws of behavior, we will
    need all the help we can get from the brain. Deep learning networks are good examples
    of the progress that can be made by paying attention to some general features
    of brain architecture and general principles of brain function. I have no doubt
    that the hard-line functionalists will protest, but we need to move forward, not
    look backward. At every step along the way, adding a new feature from brain architecture
    has boosted the functionality of deep learning networks: the hierarchy of cortical
    areas; the brain’s coupling of deep with reinforcement learning; working memory
    in recurrent cortical networks; and long-term memory of facts and events—to name
    just a few. There are many more computational principles of the brain that we
    can learn from and make the most of.¹⁵


    In their experiments, neuroscientists who study perception, memory, and decision
    making typically use trial-based tasks, in which laboratory animals are trained
    to give the desired response to a stimulus. After months of training, these stimulus-driven
    responses become reflexive, rather than reflective, which can reveal mechanisms
    underlying habitual behaviors but not cognitive behaviors. Thinking is not a reflex;
    it can occur in the absence of any sensory stimulus; but the traditional way that
    experiments are designed ignores ongoing spontaneous activity that is present
    in the absence of sensory inputs. New methods are needed to study internal activity
    that is neither sensory nor motor related, which includes conscious thinking and
    unconscious processing. This is beginning to happen now that brain imaging experiments
    have revealed resting states that spontaneously occur when someone is put in a
    scanner and asked to “rest.” The mind wanders when there is nothing to do and
    thoughts show up as a changing pattern of brain activity that we can see but do
    not yet understand.


    Brain imaging, and especially noninvasive functional magnetic resonance imaging
    (fMRI), has opened up new ways to study social interactions and decision making,
    spawning a new field called “neuroeconomics.”¹⁶ Because humans are not the rational
    actors often assumed in classical economics, we need to build a behavioral economics
    based on actual not'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'idealized human judgment and motivation as these emerge from complex internal
    brain states.17 As noted in chapter 10, dopamine neurons have a powerful influence
    on motivation by representing reward prediction error. Brain imaging of social
    interactions has probed human motivation in ways that purely behavioral experiments
    could not. The goal is to replace a theory of rational decisions based on logic
    with a theory of probabilistic decisions based on prior experience.


    # The Case against Marvin Minsky


    The early history of neural networks is a case study in how a small but influential
    group can derail the exploration of a competing research direction. Near the end
    of Perceptrons, Marvin Minsky and Seymour Papert (figure 17.5) expressed the opinion
    that the perceptron learning algorithm could not be extended to multilayer perceptrons:


    > The problem of extension is not merely technical. It is also strategic. The
    perceptron has shown itself worthy of study despite (and even because of!) its
    severe limitations. It has many features to attract attention: its linearity;
    its intriguing learning theorem; its clear paradigmatic simplicity as a kind of
    parallel computation. There is no reason to suppose that any of these virtues
    carry over to the many-layered version. Nevertheless, we consider it an important
    research


    ![](img/dd452eef0506ea820c436fef2f776436_266_0.png)


    Figure 17.5 Marvin Minsky and Seymour Papert in 1971, shortly after they wrote
    Perceptrons. This excellent mathematical analysis of simple networks had a chilling
    effect on a generation of researchers pursuing approaches to artificial intelligence
    based on learning in multilayer networks. Cynthia Solomon/Courtesy of MIT.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'problem to elucidate (or reject) our intuitive judgment that the extension
    is sterile. Perhaps some powerful convergence theorem will be discovered, or some
    profound reason for the failure to produce an interesting “learning theorem” for
    the multilayered machine will be found.18


    Sterile, indeed. This ungrounded “intuition” in Minsky and Papert’s otherwise
    excellent book had a chilling influence on the development of learning in neural
    networks and set back research for a generation, although I personally benefited
    from this delay because it made my career possible. But I had an opportunity to
    look behind the curtain in the twilight of Minsky’s career.


    I was invited to attend the 2006 Dartmouth Artificial Intelligence Conference,
    “AI@50,” a look back at the seminal 1956 Summer Research Project on artificial
    intelligence held at Dartmouth and a look forward to the future of artificial
    intelligence.19 Five of the original ten pioneers from the 1956 project were in
    attendance: John McCarthy (Stanford), Marvin Minsky (MIT), Trenchard More (IBM),
    Ray Solomonoff (University of London), and Oliver Selfridge (MIT). It was a fascinating
    meeting both scientifically and sociologically.


    In his talk “Artificial Intelligence Vision: Progress and Non-Progress,” Takeo
    Kanade (from Carnegie Mellon) noted that computer memories back in the 1960s were
    tiny by today’s standards and could hold only one image at a time. For his doctoral
    dissertation in 1974, Takeo had shown that, though his program could find a tank
    in one image, it was too difficult for it to do so in other images where the tank
    was in a different position and the lighting was different. But, by the time his
    early students graduated, the programs they designed could recognize tanks under
    more general conditions because computers were more powerful. Today his students’
    programs can recognize tanks in any image. The difference is that today we have
    access to millions of images that sample a wide range of poses and lighting conditions,
    and computers are millions of times more powerful.


    In “Intelligence and Bodies,” Rodney Brooks (from MIT) spoke about his experience
    with building robots that crawl and meander. Intelligence evolved in brains to
    control movements, and bodies evolved to interact with the world through that
    intelligence. Brooks departed from the traditional controllers used by roboticists
    and used behavior rather than computation as the metaphor for designing robots.
    As we learn more from building robots, it will become apparent that the body is
    a part of the mind.'
