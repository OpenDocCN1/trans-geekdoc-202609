    the 2017 NIPS conference in Long Beach. This explosive growth will eventually
    end, but its reverberations through society could last for decades. These sponsoring
    companies send recruiters to NIPS conferences, eager to hire talented researchers
    who are in short supply. Many of my colleagues have taken jobs with Google, Microsoft,
    Amazon, Apple, Facebook, Baidu, and many start-up companies. This has stripped
    talent from universities. Sebastian Thrun has estimated that when a start-up self-driving
    company like Otto or Cruise is bought to a larger company, the cost is $10 million
    per machine learning expert.40


    Geoffrey Hinton became an employee of Google in 2013 when it bought his company,
    DNNresearch, which consisted of Geoffrey and two of his graduate students at the
    University of Toronto. He now has access to more computer power than he could
    ever dream of having in Toronto, but even more important is the massive amount
