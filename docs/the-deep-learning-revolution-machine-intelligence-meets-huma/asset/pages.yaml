  md: 'confirmed by Wolfram Schultz and colleagues in monkeys with single-neuron recordings
    (figure 10.5)⁸ and in humans with brain imaging.⁹ It is now well established that
    transient changes in the activity of dopamine neurons signal reward prediction
    error.


    We were making progress on reward prediction error in primates when I visited
    Randolph Menzel, who was studying fast learning in the bee brain, in Berlin in
    1992. Bees are champion learners in the insect world. It only takes a few visits
    to a rewarding flower for a bee to remember the flower. The bee brain has around
    a million tiny neurons, and it is very difficult to record from them because they
    are so tiny. Menzel''s group had discovered a unique neuron called “VUMmx1” that
    responded to sucrose but not to an odor. If delivery of the odor was shortly followed
    by the sucrose reward, however, VUMmx1 would now also respond to the odor.¹⁰ The
    dopamine model of temporal difference learning might be implemented by a single
    neuron in the bee brain. VUMmx1 released octopamine, a neuromodulator closely
    related chemically to dopamine. This model of bee learning could explain some
    subtle aspects of bee psychology, such as risk aversion.¹¹ If a bee is given the
    choice between a constant reward and twice the reward, but only half the time,
    bees will stay with the constant reward even though the average is the same.¹²
    Dopamine neurons are also found in flies and have been shown to comprise several
    parallel reinforcement learning pathways for both short-term and long-term associative
    memories.¹³


    # Motivation and the Basal Ganglia


    Dopamine neurons constitute a core system that controls motivation in the brain
    (figure 10.4). All addictive drugs act by increasing the level of dopamine activity.
    When enough dopamine neurons die, the symptoms of Parkinson''s disease appear,
    which include motor tremor, difficulty in initiating actions, and, eventually,
    the complete loss of pleasure in any activity (“anhedonia”), ending in a complete
    lack of movement and responsiveness (“catatonia”). But normally behaving dopamine
    cells provide brief bursts of dopamine to the cortex and other brain areas when
    an unexpected reward occurs and diminished amounts of dopamine when a less than
    expected reward is experienced. This is precisely the signature of the temporal
    difference algorithm (figure 10.5).


    Our dopamine neurons can be interrogated when we need to make a decision. What
    should we order from the menu? We imagine each item, and our dopamine cells provide
    an estimate of the expected reward. Should we marry this person? Our dopamine
    cells will give us a “gut” opinion that'
