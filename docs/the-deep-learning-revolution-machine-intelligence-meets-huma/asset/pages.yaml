  md: '# Limitations of Neural Networks


    Although they may give the right answer to a problem, currently, there is no way
    to explain how neural networks arrive at that answer. For example, suppose that
    a female patient presents in an emergency room with a sharp pain in her chest.
    Is this a myocardial infarction, in which case immediate intervention is needed,
    or simply a bad case of indigestion? A network trained to make a diagnosis might
    be more accurate than the admitting doctor, but without an explanation for how
    the network made the decision, we would be justifiably reluctant to trust it.
    Doctors also are trained to follow what amounts to algorithms, series of tests
    and decision points that guide them through routine cases. The problem is that
    there are rare cases that fall outside the scope of their “algorithms,” whereas
    a neural network trained on many more cases, far more than the average doctor
    will ever see in a lifetime, might well catch those rare cases. But would you
    trust the statistically stronger diagnosis of a neural network with no explanation
    over a doctor’s diagnosis with a plausible one? In fact, those doctors who are
    highly accurate in making a rare diagnosis have had broad experience, and most
    use pattern recognition rather than algorithms.25 This is probably so for the
    highest-level experts in all fields.


    Just as it is possible to train networks to give expert diagnosis, would it be
    possible to train networks to give explanations by making them part of their training
    sets? This might even improve the diagnosis. The reason this is problematic is
    that many of the explanations doctors give are incomplete, oversimplified, or
    wrong. Medical practice changes dramatically from one generation to the next because
    the complexity of the body greatly exceeds our current understanding. If we could
    analyze the internal states of network models to extract causal explanations,
    this could lead to new insights and hypotheses that could be tested to advance
    medicine.


    The objection that a neural network is a black box whose conclusions cannot be
    understood can also be made of brains, and, indeed, there is great variability
    in the decisions made by individuals given the same data. We really don’t know
    yet how brains draw inferences from experience. As shown in chapter 3, conclusions
    are not always based on logic, and there are cognitive biases.26 Moreover, the
    explanations we accept are often nothing more than rationalizations or plausible
    stories. We cannot exclude the possibility that some very large generative network
    will someday start talking, and we can ask it for explanations. Should we expect
    better stories and rationalizations from such a network than those we receive
    from humans? Recall that consciousness does not have access to the inner workings
    of'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'brains. Deep learning networks typically provide not one but several leading
    predictions in rank order, which gives us some information about the confidence
    of a conclusion. Supervised neural networks can only solve problems that fall
    within the range of data that were used to train the network. If it has been trained
    on similar cases or examples, a neural network should do a fine job at interpolating
    to novel cases. But if a novel input is outside the range of training data, extrapolation
    is perilous. This should come as no surprise since the same limitation applies
    to humans; an expert in physics should not be expected to give good advice on
    political issues, or even in an area of physics outside the expert''s expertise.
    But as long as the data set is big enough to encompass the full range of potential
    inputs, a network''s generalization to new inputs should be good. In practice,
    humans tend to use analogies to extrapolate from an understood domain to a new
    domain, but these can turn out to be false analogies if the two domains are fundamentally
    different.


    All neural networks that classify inputs are biased. First, the choice of classification
    categories introduces a bias that reflects human bias in how we chop up the world.
    For example, it would be useful to train a network to detect weeds in lawns. But
    what is weed? One man''s weed is another man''s wildflower. Classification is
    a much broader problem that reflects cultural biases. This ambiguity is compounded
    by the data sets that are used to train the network. For example, several companies
    provide law enforcement agencies with systems that identify criminals based on
    facial recognition. There are more false positives among the black faces than
    white faces because the databases used to train the networks have many more white
    faces, and the more data you have the more accurate you can be.²⁷ Database biases
    can be corrected by rebalancing the data, but there are inevitably hidden biases
    depending on where the data are obtained and what they are used to decide.²⁸


    Another objection to reliance on neural networks is that they may optimize profits
    at the expense of fairness. For example, suppose that an underrepresented minority
    applies for a home mortgage and is denied the loan by a neural network that has
    been trained on millions of applications. Inputs to the network include current
    address and other information that are highly correlated with being a minority.
    So even though there is a law against explicitly discriminating against minorities,
    the network may be using this information to implicitly discriminate against them.
    The problem here is not with the neural network, but with the cost function we
    gave it to optimize. If profit is the only goal, the network will use whatever
    information it is given to maximize profit. The solution to this problem is'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'to incorporate fairness as another term in the cost function. Although the
    optimal solution would be a judicious balance between profit and fairness, the
    trade-off must be made explicit in the cost function, which requires that someone
    decide how to weight each goal. The ethical perspective of those in the humanities
    and social sciences should inform these trade-offs. But we must always keep in
    mind that choosing a cost function that seems fair may have unintended consequences.²⁹


    Calls to regulate the use of AI have come from Elon Musk and Stephen Hawking as
    well as legislators and researchers. An open letter signed by 3,722 AI and robotics
    researchers in 2015 called for a ban on autonomous weapons:


    > In summary, we believe that AI has great potential to benefit humanity in many
    ways, and that the goal of the field should be to do so. Starting a military AI
    arms race is a bad idea, and should be prevented by a ban on offensive autonomous
    weapons beyond meaningful human control.³⁰


    This call for a ban was well meaning but could boomerang. Not all nations may
    buy into the ban. Russian President Vladimir Putin is on record:


    > Artificial intelligence is the future, not only for Russia, but for all humankind.
    It comes with colossal opportunities, but also threats that are difficult to predict.
    Whoever becomes the leader in this sphere will become the ruler of the world.³¹


    The problem with wholesale bans is that AI is not a monolithic field, but one
    that has many diverse tools and applications, each of which has its own consequences.
    For example, the automation of credit scoring was an early application of machine
    learning in the 1980s. There were concerns that individuals would be unfairly
    scored if they happened to live in the wrong zip code. This led to legislation
    to put limits on what information was used to compute the scores and companies
    were required to inform an individual on ways to improve their score. Each application
    will have a different set of issues that are best handled on a case-by-case basis
    rather than a blanket ban on research.³²


    # Passages


    While on sabbatical at Caltech in 1987 as the Cornelis Wiersma Visiting Professor
    of Neurobiology, I visited Francis Crick at the Salk Institute. Francis was building
    a research group that was especially strong in vision, one of my special interests.
    I played my NETtalk demo tape at a faculty lunch,'
