  md: '# 10 Reward Learning


    According to a story going back to the Middle Ages, the inventor of the

    game of chess was offered a field of wheat from a grateful ruler. The invent-

    or instead requested one grain of wheat on the first square, two on the

    second, four on the third, and so on, doubling the number of grains on

    each successive square until all sixty-four squares of the chess board were

    covered with grains of wheat. Thinking this a modest request, the ruler

    readily agreed. In reality, however, to grant that request, he would have had

    to have given the inventor not just all the wheat in his kingdom, but all

    the wheat in the entire world for many centuries to come since the number

    of wheat grains on the sixty-fourth square would have been 2^64 (roughly

    10^19).^1 This is called “exponential growth.” The number of board positions

    in games like chess and Go grows even faster than the number of wheat

    grains in our story. At every move, there are on average thirty-five possible

    moves in a chess game, and, for Go, the branching factor is 250. This makes

    the exponential growth much more rapid.


    # Learning How to Play Backgammon


    Games have the advantage that the rules are well defined, the players have

    perfect knowledge of the board and the decisions not as complex as those in

    the real world, but sufficiently complex to be challenging. In 1959, Arthur

    Samuel, a machine learning pioneer at IBM in the early days of commercial

    digital computers, wrote a program that could play checkers so successfully

    that on the day it was announced, IBM’s stock scored a major gain. Check-

    ers is a relatively easy game, but Samuel’s program, based on a cost func-

    tion to assess the strengths of different game positions, much like previous

    game programs, and run on IBM’s first commercial computer, the IBM 701,

    which used vacuum tubes, was impressive in one novel respect: it learned

    by playing itself.'
