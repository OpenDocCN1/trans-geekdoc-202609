    # The Missing Link


    But if physics was too simple and biology too complex, where should I look for
    guidance? Unlike forces in physics, brain circuits have a purpose, which is to
    solve computational problems, like seeing and moving around, in order to survive
    in the world. Even a perfect physical model of how a neuron worked wouldn''t tell
    us what its purpose was. Neurons are in the business of processing signals that
    carry information, and computation was


