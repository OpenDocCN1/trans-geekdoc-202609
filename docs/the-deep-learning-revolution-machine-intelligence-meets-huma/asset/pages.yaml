  md: '# 6 The Cocktail Party Problem


    At a crowded cocktail party, it can be a challenge to hear the person in front
    of you when the air is filled with a cacophony of others talking around you. Having
    two ears helps direct your hearing in the right direction, and your memory can
    fill in missing snatches of conversation. Now imagine a cocktail party with 100
    people in a room and 100 nondirectional microphones spread around, each picking
    up sounds from everyone but with different ratios of amplitudes for each person
    on each microphone. Is it possible to devise an algorithm that can separate each
    of the voices into separate output channels? To make it even more difficult, what
    if the sound sources were unknown—such as music, clapping, nature sounds, or even
    random noise? This is called the “blind source separation problem” (figure 6.1).


    At the 1986 Neural Networks for Computing, AIP Conference, a precursor of the
    NIPS conferences, held on April 13–16 in Snowbird, Utah, there was a poster entitled
    “Space or Time Adaptive Signal Processing by Neural Network Models.” Its authors,
    Jeanny Herault and Christian Jutten, used a learning algorithm to blindly separate
    mixtures of sine waves (which are pure frequencies) presented to a neural network
    model; they pointed to a new class of unsupervised learning algorithms.¹ Although
    it was not known at the time if there was a general solution that could blindly
    separate other types of signals, a decade later, Anthony Bell and I found an algorithm
    that could solve the general problem.²


    # Independent Component Analysis


    The perceptron is a one-neuron neural network. The next simplest network architecture
    has more than one model neuron in the output layer; with each input neuron connected
    to each output neuron, it transforms patterns on the input layer into patterns
    on the output layer. This network'
