- pgno: 268
  md: 'In “Why Natural Language Processing is Now Statistical Natural Language Processing,”
    Eugene Charniak explained that a basic part of grammar is to tag parts of speech
    in a sentence. This is something that humans can be trained to do much better
    than the extant parsing programs. The field of computational linguistics initially
    tried to apply the generative grammar approach pioneered by Noam Chomsky in the
    1980s, but the results were disappointing. What eventually worked was to hire
    Brown undergraduates to hand-label the parts of speech for thousands of articles
    from the Wall Street Journal, and then to apply statistical techniques to identify
    the most likely part of speech for a particular word in the neighborhood of other
    specific words. Many examples are needed because most words have multiple meanings,
    and there are many different contexts for each word. Automatic tagging of parts
    of speech in sentences is now a solved problem based on machine learning.


    These success stories had a common trajectory. In the past, computers were slow
    and only able to explore toy models with just a few parameters. But these toy
    models generalized poorly to real-world data. When abundant data were available
    and computers were much faster, it became possible to create more complex statistical
    models and to extract more features and relationships between the features. Deep
    learning automates this process. Instead of having domain experts handcraft features
    for each application, deep learning can extract them from very large data sets.
    As computation replaces labor and continues to get cheaper, more labor-intensive
    cognitive tasks will be performed by computers.


    In his summary talk at the end of the conference, Marvin Minsky started out by
    saying how disappointed he was both by the talks and by where AI was going. He
    explained why: “You’re not working on the problem of general intelligence. You’re
    just working on applications.” The conference was supposed to be a celebration
    of the progress we had made, so his rebuke stung. My talk about recent progress
    with reinforcement learning and the remarkable results achieved by TD-Gammon in
    teaching networks to play champion-level backgammon had not impressed him. He
    dismissed this as a mere game.


    What did Minsky mean by “general intelligence”? In his book The Society of Mind,20
    the premise is that general intelligence emerges from the interactions between
    simpler agents. Minsky once said that the biggest source of ideas about his theory
    came from trying to create a machine that used a robotic arm, a video camera,
    and a computer to build a structure from children’s blocks (figure 2.1).21 Which
    sounds suspiciously like an application. But a concrete application forces you
    to focus and get to the bottom of a'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'problem in a way that abstract theorizing cannot. The successes reported by
    the speakers at the Dartmouth conference came with deep insights into concrete
    problems that paved the way for a more general theoretical understanding. Perhaps
    a better theory of general intelligence will someday emerge from these narrow
    AI successes.


    Our brains don’t simply sit around generating abstract thoughts. They are connected
    intimately with all parts of our bodies, which in turn are connected intimately
    with the world through our sensory inputs and motor effectors. Biological intelligence
    is therefore embodied. Even more important, our brains develop through a long
    process of maturation while interacting with the world. Learning is a process
    that coincides with development and continues long after we reach adulthood. Learning
    is therefore central to the development of general intelligence. It is interesting
    that one of the most difficult unsolved problems in artificial intelligence is
    common sense, something noticeably absent in children, and something that emerging
    slowly in most adults only after prolonged experience with the world. Emotions
    and empathy, which often are ignored in AI, are also an essential aspect of intelligence.22
    Emotions are global signals to prepare the brain for actions that cannot be decided
    by local brain states.


    There was a banquet on the last day of AI@50. At the end of the dinner, the five
    returning members of the 1956 Dartmouth Summer Research Project on Artificial
    Intelligence made brief remarks about the conference and the future of AI. In
    the question and answer period, I stood up and, turning to Minsky, said: “There
    is a belief in the neural network community that you are the devil who was responsible
    for the neural network winter in the 1970s. Are you the devil?” Minsky launched
    into a tirade about how we didn’t understand the mathematical limitations of our
    networks. I interrupted him—“Dr. Minsky, I asked you a yes or no question. Are
    you, or are you not, the devil?” He hesitated for a moment, then shouted out,
    “Yes, I am the devil!”


    In 1958, Frank Rosenblatt built an analog computer that was designed to emulate
    a perceptron because digital computers were painfully slow at simulating network
    models, which were highly compute intensive. By the 1980s, computer power had
    increased greatly and we were able to explore learning algorithms through simulations
    of small networks. But it was not until the 2010s that sufficient computer power
    became available to scale up networks to sizes that could solve real-world problems.


    Minsky’s doctoral dissertation in mathematics from Princeton in 1954 was a theoretical
    and experimental study of computing with neural'
