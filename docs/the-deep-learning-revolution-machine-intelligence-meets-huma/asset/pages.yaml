  md: 'patterns of activity for each input in neural networks are highly distributed
    in a way that is qualitatively similar to the variety of responses that have been
    observed in populations of cortical neurons (figure 9.2).¹⁰ A Distributed representation
    can be used to recognize many versions of the same object, and the same set of
    neurons can recognize many different objects by differentially weighting their
    outputs. When individual hidden units in neural networks are tested in the same
    way that neurophysiologists record from neurons in the visual cortex, sometimes
    one simulated neuron near the top of the hierarchy is found to develop a specific
    preference for one of the objects. But, because the remaining neurons carry redundant
    signals representing the object, the performance of the neural network does not
    appreciably change when such a unit is cut out of it. The robust performance of
    neural networks despite damage is a major difference between the architecture
    of both these networks and the brain itself and that of digital computers.


    How many cortical neurons are needed to discriminate between many similar objects
    such as faces? From imaging studies, we know that several areas of the human brain
    respond to faces, some with a high degree of selectivity. But, within these areas,
    the information about any single faces is broadly distributed among many neurons.
    Doris Tsao at Caltech has recorded from neurons in monkey cortex that respond
    selectively to faces and has shown that it is possible to reconstruct faces by
    combining the inputs from 200 face cells, a relatively small subset of all face-selective
    neurons.¹¹


    # When Is the Time of a Visual Event Perceived?


    Another aspect of visual awareness are the brain’s efforts to register events,
    like flashes of light, as occurring at specific times. The time delays of neurons
    in the visual cortex in response to a flashed visual stimulus vary from 25 to
    100 milliseconds, often within the same region of the cortex. Nonetheless, we
    can determine the order of two flashes that occur within 40 milliseconds of each
    other, and the order of two sounds with less than a 10-millisecond time difference.
    To make this even more paradoxical, the processing in the retinas takes a certain
    amount of time, which is not fixed but depends on the intensity of the flash,
    so that there is a delay in the arrival time of the first spike from a dim flash
    compared to one from a bright flash, even though the dim and bright flashes appear
    to occur simultaneously. This raises the question of why visual percepts seem
    to have a unity that is not at all apparent from the temporally and spatially
    distributed patterns of activity throughout the cortex.'
