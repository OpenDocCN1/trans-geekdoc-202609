  md: 'Ultimately, our proposal was successful and, as I had predicted, the reporting
    was bone crushing with 300-page annual reports, but the science was spectacular.
    Our Temporal Dynamics of Learning Center (TDLC) includes over 100 researchers
    at eighteen institutions around the world. Of the six Science of Learning Centers
    funded by the NSF, ours was the most neuroscience and engineering oriented and
    we incorporated the latest advances in machine learning into our projects (figure
    12.7).


    Rubi and CERT were two of the projects funded by the Temporal Dynamics of Learning
    Center. We also had a mobile EEG lab, where subjects were free to roam in a virtual
    environment while recording their brain waves. In most EEG labs, the subject is
    required to sit still and not to blink to avoid artifacts. We used Independent
    Component Analysis (ICA) to cancel movement artifacts, allowing us to look at
    brain activity while subjects actively explored the environment and interacted
    with other humans.


    Here are a few of the many projects that have been undertaken by TDLC researchers:


