  img_proc: true
- pgno: 211
  md: 'Neumann at the Institute for Advanced Study in Princeton in the 1940s using
    cellular automata. Von Neumann''s works had a major impact on many areas of mathematics,
    especially his seminal work on game theory (mentioned in chapter 1). Looking for
    the simplest cellular automaton that could replicate itself exactly, von Neumann
    found a complex cellular automaton with twenty-nine internal states and a large
    memory that self-replicated.10 This was of considerable biological interest because
    cells that are able to self-replicate also have many internal states and memory
    in the form of DNA. Since then, much simpler cellular automata have been found
    that also can self-replicate.


    # Is the Brain a Computer?


    In 1943, Warren McCulloch and Walter Pitts showed that it was possible to build
    a digital computer out of simple binary threshold units like the perceptron, which
    could be wired up to make the elementary logical gates in a computer.11 We now
    know that brains have mixed analog and digital properties and that their neural
    circuits generally do not compute logical functions. But McCulloch and Pitts''s
    1943 paper received a lot of attention at the time and, in particular, inspired
    John von Neumann to think about computers. He built one of the first digital computers
    that had stored programs, an unusual project for a mathematician at that time,
    although when von Neumann died in 1957, the Institute for Advanced Study did not
    continue his line of research and scrapped his computer.12


    Von Neumann also was interested in the brain. In his 1956 Silliman lectures at
    Yale,13 he pondered the question of how the brain could function reliably with
    such unreliable components. When a transistor in a digital computer makes a mistake,
    the whole computer can crash, but when a neuron in the brain misfires, the rest
    of the brain adapts to the misfire and carries on. Von Neumann thought that redundancy
    might be the reason for the robustness of brains since many neurons are involved
    in every operation. Redundancy is traditionally based on having a backup, in case
    the primary system fails. But we now know that redundancy in the brain is based
    on diversity rather than duplication. Von Neumann also was concerned about logical
    depth: how many logical steps can a brain make before accumulated errors corrupt
    the results? Unlike a computer, which can perform each logical step perfectly,
    brains have many sources of noise. A brain may not achieve perfection, but because
    so many of its neurons are working together in parallel, it accomplishes much
    more with each step than a computer can in a single step, and it needs less logical
    depth.'
