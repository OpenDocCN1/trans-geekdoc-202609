- pgno: 256
  md: '# 17 Nature Is Cleverer Than We Are


    An Oxford-educated chemist who worked on the origins of life, Leslie Orgel (figure
    17.1, right) was a colleague at the Salk Institute for many years and one of the
    smartest scientists I have ever met. Discussions with him at faculty lunch on
    Fridays were always fascinating. The origin of life goes back billions of years
    to a time when the earth was so different from today that it would not support
    life as we know it. Conditions were harsh, and there was little oxygen in the
    atmosphere. Bacteria were preceded on the earth by archaea, but what came before
    archaea? DNA is common to all cells today, but what came before DNA? In 1968,
    Leslie Orgel and Francis Crick speculated that RNA, which is derived from DNA
    in cells, might have been the precursor, but this would require RNA to self-replicate.
    Evidence for this possibility was found in the form of ribozymes, RNA-based enzymes
    that can catalyze RNA reactions, and today most researchers in the field believe
    it is quite possible that all life descended from an earlier “RNA world.” But
    where did RNA come from? Unfortunately, we have little evidence from that period
    to go on.


    # Orgel''s Second Rule


    Time and again, universally held truths have been shattered by surprising discoveries.
    We looked up and saw the sun going around the earth, but we were the ones going
    around the sun. The theory of evolution put us humans in our place, though even
    today it remains difficult for many to accept. Many years from now, our descendants
    will look back at our era and say that our intuitions about intelligence were
    at best oversimplified and held back progress in artificial intelligence for fifty
    years. As Orgel’s second rule states, evolution is cleverer than you are. Our
    conscious awareness is the tip of an iceberg, most of the workings of our brain
    are inaccessible to introspection. We have words like “attention”'
  merge: -1
  img_proc: true
