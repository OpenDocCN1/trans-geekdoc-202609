    that his foundation wanted to fund potentially promising but risky research that
    was unlikely to succeed and Geoffrey had been highly recommended to him. Geoffrey
    wasn’t sure that this was for real. Good friend that he is, Geoffrey mentioned
    my research to Smith, telling him it was even more unlikely to succeed than his.


    The foundation was indeed real and provided us with our first grants, which greatly
    speeded up our research. We could now afford to buy faster computers and to pay
    the students working with us. Geoffrey replaced his Apple II with a fancy Lisp
    machine\(^19\) when he moved to Carnegie Mellon in Pittsburgh; I briefly had more
    computer power than the entire Computer Science Department when I moved to Johns
    Hopkins in Baltimore.\(^20\) I was also able to buy the first modem that linked
    Hopkins to the ARPANET, a precursor to the Internet, so that Geoffrey and I could
    e-mail each other. We could not have asked for a better start to our careers as
    we set off in new directions (figure 4.6). I was fortunate to be funded over the
    years by the Office of Naval Research, which also supported Frank Rosenblatt and
