    The reinforcement learning algorithm used by AlphaGo can be applied to many problems.
    This form of learning depends only on the reward given to the winner at the end
    of a sequence of moves, which paradoxically can improve decisions made much earlier.
    When coupled with many powerful deep learning networks, this leads to many domain-dependent
    bits of intelligence. And, indeed, cases have been made for different domain-dependent
    kinds of intelligence: social, emotional, mechanical, and constructive, for example.37
    The “g factor” that intelligence tests claim to measure is correlated with these
    different kinds. There are reasons to be cautious about interpreting IQ tests.
    The average IQ has been going up all over the world by three points per decade
    since it was first studied in the 1930s, a trend called the “Flynn effect.” There
    are many possible explanations for the Flynn effect, such as better nutrition,
    better health care, and other environmental factors.38 This is quite plausible
    because the environment affects gene regulation, which in turn affects brain connectivity,
    leading to changes in behavior.39 As humans increasingly are living in artificially
    created environments, brains are being molded in ways that nature never intended.
    Could it be that humans have been getting smarter over a much longer period of
    time? For how long will the increase in IQ continue? The incidence of people playing
