  md: 'the units in the network are all working at the same time. There is also no
    distinction between software and hardware in neural networks. Learning takes place
    by making changes to the hardware.


    Starting in the 1980s, when clusters of computers were assembled in one rack,
    digital computers have become massively parallel. One of the earliest parallel
    computers was the Connection Machine, designed by Danny Hillis in 1985 and sold
    by Thinking Machines, Inc. An engineer and inventor, Hillis trained at MIT when
    it was becoming clear that much more computational power would be needed to make
    artificial intelligence achieve solutions to immensely complex real-world problems.
    As the number of transistors on a computer chip continued to increase according
    to Moore’s law in the 1990s, it became possible to put many processing units on
    the same chip, many chips on the same board, many boards in the same cabinet,
    and many cabinets in the same room—with the result that today the fastest computers
    on the planet have millions of cores and can achieve many millions of billions
    of operations per second. Exascale computing is on the horizon of billions of
    billions of operations per second.


    Simulations of neural networks can take maximum advantage of this massively parallel
    hardware. Multiple cores can be programmed to work in parallel on the same network
    model, which greatly speeds up processing, but this also results in delays in
    communicating between the processors. To reduce these delays, companies are building
    special-purpose digital coprocessors that will vastly speed up network simulations,
    so that cognitive tasks like speech and seeing will become single powerful instructions.
    Our smartphones will become a lot smarter when they’re built with deep learning
    network chips.


    Digital computers have operating systems that separate us from the hardware (box
    15.1). When we run word processing programs on our laptops or apps on our cell
    phones, the operating systems take care of all the details about where to put
    our keystrokes into memory, and how to display the output on a screen. Our minds
    run the equivalent of apps on our brains’ operating systems, which isolate us
    from what, where, and how information is stored. We are unaware of how our brains
    store the vast databases of experience we have accumulated during our lifetimes,
    or how our behavior is shaped by these experiences. It is possible to make some
    of the experiences explicit, but we are consciously aware of only the very tip
    of an iceberg. It is a mystery how our brains manage this. If we could figure
    out how the operating systems of our brains work, we could organize big data based
    on the same general principles. Consciousness could then be explained as an app
    running on the brain’s operating system.'
