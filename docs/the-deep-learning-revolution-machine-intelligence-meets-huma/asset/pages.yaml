    implication of these experiments is that the representations of images in the
    generative network represent rooms much the way we would describe the parts of
    scenes. This technology is advancing rapidly, and its next frontier is to generate
    realistic movies. By training a recurrent generative adversarial network against
    movies of an actor like Marilyn Monroe, it should be possible to create new performances
    of actors no longer alive.


    It is fashion week in Milan and models with otherworldly expressions are on the
    runways with striking struts (figure 9.7). Something is stirring in the fashion
    world: “Many jobs are vanishing,’ Silvia Venturini Fendi said before her show:
    ‘Androids will take the old jobs, but the only thing that they can’t replace is
    our creativity and our minds.”26 Now imagine generative adversarial networks that
    have been trained to generate new styles and haute couture with almost endless
    variety. The world of fashion may be on the brink of a new era, along with many
    other businesses that depend on creativity.


