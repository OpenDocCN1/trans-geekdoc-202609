  md: '• April Benasich at the Center for Molecular and Behavioral Neuroscience at
    Rutgers developed a test that can predict whether a baby will have deficits in
    language acquisition and learning based on the baby’s timing in auditory perception;
    she showed that these deficits could be corrected by adaptively manipulating the
    timing of sounds and reward feedback to allow the baby to develop normal hearing,
    speaking, and learning.²² The experiments on which these results are based followed
    babies longitudinally from three months to five years of age. Even normally developing
    babies benefited from the interactive environment. April launched AAB Research
    LLC in 2006 to bring rapid auditory processing technology (RAPT) into the home
    to enhance an infant’s ability to learn.


    • Marian Stewart Bartlett and Javier Movellan used machine learning to register
    facial expressions of students automatically,²³ which could then alert the teacher
    when a student was looking frustrated and likely not comprehending what was being
    taught. With deep learning, this can be done automatically and accurately today
    for every child in a class at the same time. There are many other applications
    for facial expression analysis in marketing, psychiatry, and forensics that are
    untapped.


    • Harold Pashler at UC, San Diego, and Michael Mozer at the University of Colorado
    at Boulder investigated improved long-term retention of learning through personalized
    review spaced out over time versus cramming by extending previous studies of college
    students over time frames of months to a study of K–12 students over time frames
    of years.²⁴ They showed that the optimal spacing for learning was longer when
    longer-term retention was required, and they implemented their optimal review
    schedule for students in language courses with excellent results.


    • Beth Rogowsky, a TDLC postdoctoral fellow, Paula Tallal at Rutgers, and Barbara
    Calhoun at Vanderbilt University showed that there was no statistical difference
    between learning using spoken or written materials, and no relationship between
    preferred learning style and instructional method in either immediate or delayed
    comprehension.²⁵ That there is no benefit in adapting to a student’s preferred
    learning style means that the large industry that promotes training and testing
    materials for individual learning styles is not adding value to the classroom.


    • Paula Tallal was instrumental in the 2014 launch of the $15 million Global Learning
    X-Prize, which incentivizes innovation in education and whose goal is to develop
    open-source and scalable software that will enable children in developing countries
    to learn basic reading, writing, and arithmetic skills within eighteen months.
    The beneficial impact of research done for the Global Learning X-Prize will reverberate
    throughout the world for decades to come.'
