  md: 'an equilibrium, and the fraction of time each pair of units were on together
    was counted. In the second or “sleep” phase, the input and output units were set
    free, and the fraction of time each pair of units were on together was counted
    in a free running condition. Each connection strength was then updated in proportion
    to the difference between the coincidence rates in the wake and sleep phases (box
    7.2). The computational reason for the sleep phase is to determine which part
    of the clamped correlations was due to external causes. Without subtracting the
    internally generated correlations, the network would strengthen the internal patterns
    of activity and would learn to ignore outside influences, a network version of
    folie à deux. Interestingly, extreme sleep deprivation in humans leads to delusional
    states, a common problem in intensive care units in hospitals that have no windows
    and constant lighting. Patients with schizophrenia often have sleep disorders
    that can contribute to their delusional ideation. We were convinced that we were
    on the right track to understanding how the brain worked.


    # Learning Mirror Symmetries


    A problem the Boltzmann machine could solve but a perceptron could not is how
    to learn mirror symmetries.\¹⁷ The human body is bilaterally symmetric along a
    vertical axis. We can generate a large number of random patterns with this axis
    of symmetry, as shown in figure 7.5, and also with horizontal and diagonal axes
    of symmetry. In our Boltzmann machine network, 10×10 blocks of binary inputs projected
    to sixteen hidden units, which in turn projected to three output units, one for
    each of the three possible axes of symmetry. The Boltzmann machine was 90 percent
    successful at classifying the axis of symmetry of novel inputs after being trained
    on 6,000 symmetric input patterns. A perceptron can do no better than chance because
    a single input carries no information about the symmetry of the pattern; the correlations
    between pairs of inputs must be interrogated. What is remarkable is that the array
    of inputs a human observer sees is not what the Boltzmann machine sees since each
    hidden unit receives inputs from the whole array in no particular order. The equivalent
    problem for an observer would be to randomize the locations of the input units
    in the array, which would make the array look random to the observer even though
    there is a hidden symmetry.


