  md: 'low on such a small training set, this preliminary result was nonetheless encouraging.


    We then used the 20,000-word Brown Corpus⁷ and assigned phonemes, as well as stress
    marks, to each of letters. The alignment of the letters and sounds took weeks,
    but, once the learning started, the network absorbed the whole corpus in a single
    night. But how well would it generalize? Beautifully, it turned out. The network
    had discovered the regularities of English pronunciation and could recognize the
    exceptions, all with the same architecture and learning algorithm. Tiny by today’s
    standards, our network was a testament to how efficiently a backprop network could
    represent English phonology. This was our first hint that how neural networks
    learned language—the poster child for symbolic representations—dovetailed with
    how humans did.


    As it acquired its ability to read aloud, NETtalk first went through a babbling
    phase, in which it recognized the difference between consonants and vowels, but
    assigned the phoneme “b” to all the consonants and the phoneme “a” to all the
    vowels. It sounded like “ba ba” and then after more learning, it shifted to “ba
    ga da.” This was eerily similar to the way babies babble. Then it started to get
    small words right, and finally, toward the end of training, we could understand
    most words.


    To test NETtalk on dialect, we found a phonological transcription of an interview
    with a young Latino boy from a barrio in Los Angeles. The trained network re-created
    the Spanish-accented English of the boy talking about how, when visiting his grandmother,
    he would sometimes get candy. I recorded segments during successive stages of
    learning by playing the output of NETtalk into a speech synthesizer called “DECtalk”
    that converted a string of phoneme labels into audible speech. When I played this
    tape during a lecture, the audience was stunned—the network literally spoke for
    itself.⁸ This summer project exceeded all our expectations and stood out as the
    first real-world application of neural network learning. I appeared with NETtalk
    on the Today show in 1986, which was seen by a surprisingly large audience. Up
    to this point, neural networks had been an arcane academic subject. I still meet
    people who heard about neural networks for the first time when they watched the
    show.


    Although NETtalk was a powerful demonstration of how a network could represent
    some aspects of language, it was not a good model for how humans acquire reading
    skills. First, we learn to talk before we learn to read. Second, we are given
    a few phonetic rules to help us jumpstart the difficult task of becoming proficient
    at reading out loud. But reading aloud quickly becomes fast pattern recognition,
    without the need for conscious effort'
