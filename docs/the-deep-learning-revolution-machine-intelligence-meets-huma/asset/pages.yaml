    At a dinner on one of his visits to La Jolla, I told Sydney a story that I had
    heard many years ago when I was a postdoctoral fellow at the Harvard Medical School.
    Francis Crick dies and goes to heaven. St. Peter is surprised to see this devout
    atheist, but Francis is there to ask God a question. Directed to a wooden shack
    amid a field strewn with all manner of wheels and cogs—failed experiments—Francis
    finds God at his workbench in a leather apron, tinkering with a new organism.
    “Francis,” says God, “how delightful to see you. What can I do for you?” “All
    my life,” says Francis, “I’ve wanted to know the answer to this question: Why
    do flies have imaginal discs?”³ “Dear Francis,” replies God, “what a surprise!
    No one’s ever asked me that question before. I’ve been putting imaginal discs
    into flies for hundreds of millions of years and I haven’t had a single complaint.”'
