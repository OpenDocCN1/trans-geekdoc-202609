- pgno: 160
  md: 'TD-Gammon did not get as much publicity as IBM’s Deep Blue, which

    beat Gary Kasparov at chess in 1997. Chess is much more difficult than

    backgammon, and Kasparov was the world champion at the time. In some

    ways, though, TD-Gammon was a more impressive achievement. First, TD-

    Gammon taught itself how to play, using pattern recognition, a style similar

    to how humans play, whereas Deep Blue won by brute force, using custom

    hardware to look more moves into the future than any human could. And,

    second, TD-Gammon was creative and came up with subtle strategies and

    positional play never before seen by humans. In doing so, TD-Gammon

    raised the level of human play. This achievement was a watershed in the

    history of artificial intelligence because we learned something new from an

    AI program that taught itself how to master a complex strategy in a well-

    trodden domain, a strategy that is worthy of human interest and effort.


    # Reward Learning in Brains


    The heart of TD-Gammon is the temporal difference learning algorithm,

    which was inspired by learning experiments with animals. Nearly all spe-

    cies that have been tested, from bees to humans, can be taught associatively,

    just like Pavlov’s dog. In Pavlov’s experiment, a sensory stimulus such as a

    bell was followed by the presentation of food, which elicited salivation.

    After several pairings, the bell by itself would lead to salivation. Different

    species have different preferred unconditioned stimuli in associative learn-

    ing. Bees are very good at associating the smell, color, and shape of a flower

    with the reward of nectar and use this learned association to find similar

    flowers that are in season. Something about this universal form of learning

    must be important, and there was a period in the 1960s when psycholo-

    gists intensively studied the conditions that gave rise to associative learning

    and developed models to explain it. Behaviorists like B. F. Skinner trained

    pigeons to recognize humans in photos, which calls to mind what can be

    accomplished with deep learning, but there is a big difference. Backprop

    learning requires detailed feedback to all the units on the output layer, but

    associative learning provides only a single reward signal, correct or incor-

    rect. The brain has to figure out what features of the world were responsible

    for a successful decision.


    Only the stimulus that occurs just before the reward gets associated

    with the reward. This makes sense because a stimulus is more likely to have

    caused the reward if it comes just before it than if it comes just after the

    reward. Causality is an important principle in nature. The opposite occurs

    when the conditioned stimulus is followed by punishment, such as a shock

    to the foot, which teaches an animal to avoid the stimulus. In some cases,'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'the gap between the conditioned stimulus and the punishment can be quite long.
    In the 1950s, John Garcia showed that if a rat was fed sweetened water and made
    nauseous hours later, the rat would avoid sweetened water days later. This is
    called “taste aversion learning,” and it also occurs in humans.⁶ Sometimes, the
    nausea will be associated with the wrong ingested food, like chocolate, which
    unfortunately happened to be consumed at the same time but did not cause the nausea;
    the resulting aversion can last many years even though there is a conscious awareness
    that chocolate was not the problem.


    Dopamine, a neuromodulator carried by a set of diffusely projecting neurons in
    the brainstem (figure 10.4), had long been associated with reward learning, but
    it was not known what exactly they signaled to the cortex. Peter Dayan and Read
    Montague, postdoctoral fellows in my lab in the 1990s, realized that dopamine
    neurons could implement temporal difference learning.⁷ In one of the most exciting
    scientific periods of my life, these models and their predictions were published
    and subsequently


    ![](img/dd452eef0506ea820c436fef2f776436_161_0.png)


    Figure 10.4 Dopamine neurons in the human brain. Several nuclei in the midbrain
    (VTA and substantia nigra) project axons into the cortex and the basal ganglia
    (striatum and nucleus accumbens). Transient bursts signify discrepancies between
    the reward predictions and received reward, which are used to choose actions and
    modify predictions.'
