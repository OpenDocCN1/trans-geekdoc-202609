  md: 'were the same. This is a dramatic demonstration of how well learning algorithms
    for neural networks scale. How much better will performance be if we continue
    to increase the size of the network and training time?


    Games are a much simpler environment than the real world. A stepping-stone toward
    more complex and uncertain environments comes from the world of video games. DeepMind
    had shown in 2015 that temporal difference learning could learn to play Atari
    arcade games such as Pong at superhuman levels, taking the pixels of the screen
    as input.¹⁵ The next stepping-stone is video games in a three-dimensional environment.
    StarCraft is among the best competitive video games of all time. DeepMind is using
    it to develop autonomous deep learning networks that can thrive in that world.
    Microsoft Research recently bought the rights to Minecraft, another popular video
    game, and has made it open source so others could customize its three-dimensional
    environment and speed up the progress of its artificial intelligence.


    Playing backgammon and Go at championship levels is an impressive achievement,
    and playing video games is an important next step, but what about solving real-world
    problems? The perception-action cycle (figure 10.2) can be applied to solve any
    problem for which actions are planned based on sensory data. The result of the
    action can be compared with the predicted outcome and the difference then used
    to update the state of the system making the predictions; the memory of previous
    conditions can be used to optimize the use of resources and anticipate potential
    problems.


    Simon Haykin at McMaster University in Hamilton, Ontario, used this framework
    to improve the performance of several important engineered software systems,¹⁶
    including cognitive radio, which dynamically allocates communications channels;
    cognitive radar, which dynamically shifts frequency bands to reduce interference;
    and the cognitive grid, which dynamically loads balances electrical power on the
    electrical grid. Risk control can also be managed within the same perception-action
    framework.¹⁷ The improvements made by using the perception-action framework in
    each of these software systems and thus also the improvements in the areas they
    manage are substantial, significantly enhancing performance and reducing costs.


    # Learning How to Soar


    In 2016, Massimo Vergassola, a physicist at UC, San Diego, and I wondered whether
    it was possible to use temporal difference learning to teach a glider'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'how to soar and stay aloft for hours without expending much energy like many
    birds. 18 Thermal upwelling of air can carry birds to great heights, but, within
    a thermal, the air is turbulent and there are pockets of falling as well as rising
    air. The cues birds use to maintain their upward trajectory in the face of so
    much buffeting are not known. Our first step was to develop a physically realistic
    simulation of turbulent convective flow and a model of the aerodynamics of a glider.
    Our next step was then to simulate the trajectory taken by the glider in the turbulent
    flow.


    At first, the glider was not able to take advantage of the rising columns of air
    and glided downward (figure 10.6). After being rewarded for going up, the glider
    began to learn a strategy, and, after a few hundred trials, the trajectories of
    the glider resembled the tight loops made by soaring birds (figure 10.6). The
    glider also learned different strategies for different degrees of turbulence.
    By analyzing these strategies, we could develop hypotheses, and we could ask whether
    soaring birds in fact used the strategies. We then instrumented a real glider
    with a six-foot wingspan and taught it to soar and stay aloft. 19


    # Learning How to Sing


    Another example of the power of reinforcement learning is the parallel between
    how birds learn to sing and how children learn to speak. In both cases, an initial
    period of auditory learning is followed by a later period of progressive motor
    learning. Zebra finches hear their father''s song early in life but don''t produce
    any sounds themselves until months later. Even when they are isolated from their
    father before the motor learning phase, they go through a period of scratchy-sounding
    subsong that continues to improve and eventually crystallizes into birdsong in
    their father''s dialect. Zebra finches know what part of the forest a conspecific
    came from by its song, just as we know where a person is from by that person''s
    accent. The hypothesis that has driven birdsong research is that, during the auditory
    learning phase, a template is learned that is then used to refine the sounds produced
    by the motor system in the motor learning phase. The pathways that are responsible
    for the motor learning phase in both humans and songbirds are in the basal ganglia,
    where we know that reinforcement learning takes place.


    In 1995, Kenji Doya, a postdoctoral fellow in my lab, developed a reinforcement
    learning model for the motor refinement of birdsong (figure 10.7). The model improved
    its performance by tweaking synapses in the motor pathway to a model of the vocal
    organ in birds (“syrinx”), and then'
