  md: '# 8 Backpropagating Errors


    The University of California, San Diego, founded in 1960, has grown into a major
    center for biomedical research. It inaugurated a Department of Cognitive Science
    in 1986, the first of its kind in the world.¹ David Rumelhart (figure 8.1) was
    already a distinguished mathematical and cognitive psychologist who had worked
    within the symbolic, rule-based tradition that was dominant in artificial intelligence
    research during the 1970s. When I first met David in 1979 at the workshop organized
    by Geoffrey Hinton at UC, San Diego, he was pioneering a new approach to human
    psychology that he and James McClelland called “parallel distributed processing”
    (PDP). David thought deeply about problems and often made insightful comments.


    The Boltzmann machine learning algorithm could provably learn how to solve problems
    that required hidden units, showing that, contrary to the opinion of Marvin Minsky
    and Seymour Papert and most everyone else in the field, it was possible to train
    a multilayer network and overcome the limitations of the perceptron. There was
    no limit either to the number of layers in a network or to the connectivity within
    any given layer. But there was one problem: coming to equilibrium and collecting
    statistics became increasingly slow to simulate, and larger networks took much
    longer to reach equilibrium.


    In principle, it is possible to build a computer with a massively parallel architecture
    that is much faster than one with a traditional von Neumann architecture that
    makes one update at a time. Digital computers in the 1980s could perform only
    a million operations per second. Today’s computers perform billions of operations
    per second, and, by linking together many thousands of cores, high-performance
    computers are a million times faster than before—an unprecedented increase in
    technological power.


    The Manhattan Project was a $26 billion dollar bet, in 2016 dollars, made by the
    United States without any assurance that the atomic bomb'
