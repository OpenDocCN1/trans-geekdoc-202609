  md: '+   • TDLC Science Director Andrea Chiba presented research on how all learning
    changes the structure of the brain at the 2014 International Convention on the
    Science of Learning in Shanghai,²⁶ much to the surprise of many delegates who
    believed that children come into the world with a set potential and that education
    is wasted on those who are less capable or too old to learn. A vast reservoir
    of human potential exists around the world that is not being tapped.


    We found that the biggest problems in education weren’t scientific, but social
    and cultural. There are 13,500 school districts in the United States, each with
    its own school board that decides on the curriculum, teacher qualifications, and
    best practices; it would take decades to reach all of them and address each unique
    situation. Even before teachers can teach, they have to manage the classroom,
    which can be especially challenging for early grades and inner city schools. Parents
    making demands may fail to appreciate the high rate of teacher burnout due to
    a lack of resources, and the influence of teachers unions, which often block progressive
    efforts.


    Teaching is fundamentally a labor-intensive activity. The best and most effective
    way to teach is through one-to-one interactions between skilled adult teachers
    and students.²⁷ We are saddled with an assembly-line system that was designed
    for mass education, in which students are segregated by age and are taught in
    large classes where teachers impart the same lessons year after year. This may
    be a good way to build an automobile and may have been adequate at a time when
    only a basic education was needed for the workforce, but this system is failing
    us today when jobs require a higher level of training and lifelong learning to
    renew job skills. Going back to school as an adult can be painful and impractical.
    The information revolution that we are living through has overtaken the generational
    time scale. Fortunately, new technologies are coming online that may change how
    we learn. The Internet is changing the learning landscape in ways we could never
    have anticipated when our Science of Learning Center was launched in 2006.


    # Learning How to Learn


    Massively open online courses (MOOCs) burst on the scene in 2011 with a high-visibility
    article in the New York Times on the popularity of an online course on artificial
    intelligence at Stanford.²⁸ The large numbers of students who enrolled in MOOCs
    and their unprecedented reach through the Internet caught the attention of the
    world. Almost overnight, new companies were founded to develop and freely distribute
    lectures online by some of the best educators in the world. These are available
    on demand anytime'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'and anyplace where there is an Internet connection. In addition to the lectures,
    the courses include quizzes, exams, forums where learners can ask questions, teaching
    assistants, and self-organized local “meet-ups” where students can discuss their
    course in an informal setting. The audience for MOOCs has greatly expanded—in
    2015, the number of “MOOCers” doubled, from an estimated 17 million to more than
    35 million. MOOCs bypass all the gatekeepers in the educational establishment.


    I met Barbara Oakley at a meeting sponsored by the National Academy of Sciences
    at UC, Irvine, in January 2013. She is a professor of electrical engineering at
    the Oakland University in the cities of Auburn Hills and Rochester Hills, Michigan,
    even though she did poorly in mathematics and science in school. She was a humanities
    major, a captain in the U.S. Army, who worked as a Russian translator on Soviet
    trawlers in the Bering Sea before going back to school, where she overcame her
    mental block with math and received a doctorate in electrical engineering. Over
    dinner, I discovered that Barbara and I had similar views on learning and that
    she was writing a book, A Mind for Numbers: How to Excel at Math and Science (Even
    If You Flunked Algebra). I invited her to UC, San Diego, to give a TDLC lecture
    for high school students and teachers.


    Barbara was a great hit with the students, and it was clear that she was a gifted
    teacher. Her approach and practical insights had roots in what we know about the
    brain, so we teamed up to develop a MOOC for Coursera called “Learning How to
    Learn: Powerful Mental Tools to Help You Master Tough Subjects” (figure 12.8;
    https://www.coursera.org/learn/ learning-how-to-learn/) that debuted in August
    2014. It is currently the world’s most popular MOOC, with over 3 million registered
    learners in its first four years, and it continues to attract 1,000 new learners
    a day from over 200 countries. “Learning How to Learn” gives you the tools you
    need to become a better learner based on our knowledge of how the brain learns.
    Feedback from our learners has been overwhelmingly positive, and we developed
    a second MOOC called “Mindshift” to help those who want to shift to new jobs or
    change their lifestyles. Both of these MOOCs are freely available.


    “Learning How to Learn” gives practical advice on how to become a better learner,
    how to handle test anxiety, how to avoid procrastination, and what we know about
    how the brain learns. It is a free, month-long course with 5- to 10-minute video
    clips, quizzes, and tests that have been translated into more than twenty languages.
    One of the cornerstones of the course is what your unconscious brain can do for
    you while you are doing something else. Henri Poincaré was an eminent nineteenth-century'
