  md: '# Box 7.2

    The Boltzmann Machine


    ![](img/dd452eef0506ea820c436fef2f776436_109_0.png)


    ![](img/dd452eef0506ea820c436fef2f776436_109_1.png)


    All connections in a Boltzmann machine are symmetric, as they are in the Hopfield
    net, and the binary units are updated one a time by setting \( s_i = 1 \) with
    a probability given by the above sigmoid function, where the inputs \( \Delta
    E \) are scaled by temperature \( T \). The input layer and the output layer are
    "visible," in the sense that they interact with the outside world. The "hidden
    units" represent features having internal degrees of freedom that can affect the
    visible units. The Boltzmann machine learning algorithm has two phases: in the
    "wake" phase, the inputs and outputs are clamped and after the network comes to
    equilibrium the average correlation between pairs of units is computed; in the
    "sleep" phase, the correlations are again computed with the inputs and outputs
    unclamped. Then the weights are incrementally updated:


    \( \Delta w_{ij} = \epsilon (<s_i s_j>^{wake} - <s_i s_j>^{sleep}) \)'
