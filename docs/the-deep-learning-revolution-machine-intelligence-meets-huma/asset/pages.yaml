  md: '# # II Many Ways to Learn


    # ## Timeline


    1949—Donald Hebb publishes _The Organization of Behavior_, which introduced the
    Hebb rule for synaptic plasticity.


    1982—John Hopfield publishes “Neural Networks and Physical Systems with Emergent
    Collective Computational Abilities,” which introduced the Hopfield net.


    1985—Geoffrey Hinton and Terry Sejnowski publish “A Learning Algorithm for Boltzmann
    Machines,” which was a counterexample to Marvin Minsky and Seymour Papert’s widely
    accepted belief that no learning algorithm for multilayer networks was possible.


    1986—David Rumelhart and Geoffrey Hinton publish “Learning Internal Representations
    by Error-Propagation,” which introduced the “backprop” learning algorithm now
    used for deep learning.


    1988—Richard Sutton publishes “Learning to Predict by the Methods of Temporal
    Differences” in _Machine Learning_. Temporal difference learning is now believed
    to be the algorithm implemented in all brains for reward learning.


    1995—Anthony Bell and Terrence Sejnowski publish “An Information-Maximization
    Approach to Blind Separation and Blind Deconvolution,” describing an unsupervised
    algorithm for Independent Component Analysis.


    2013—Geoffrey Hinton’s NIPS 2012 paper “ImageNet Classification with Deep Convolutional
    Neural Networks” reduces the error rate for correctly classifying objects in images
    by 18 percent.


    2017—AlphaGo, a deep learning network program, beats Ke Jie, the world champion
    at Go.'
