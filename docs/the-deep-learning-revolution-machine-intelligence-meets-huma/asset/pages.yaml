    **Figure 3.5**


    Geometric explanation for how two object categories are discriminated by a perceptron.
    The objects have two features, such as size and brightness, which have values
    (x,y) and are plotted on each graph. The two types of objects (pluses and squares)
    in the panel on the left can be separated by a straight line that passes between
