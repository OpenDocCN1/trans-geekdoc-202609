    in a cell phone now has ten times the computational power of a Cray XMP supercomputer
    from the 1980s, and high-performance supercomputers with hundreds of thousands
    of microprocessor cores have now reached petascale, a million times faster than
    the extinct Cray supercomputers, for about the same cost, adjusted for inflation.


    At that 1983 workshop, Mead showed us a silicon retina, which was built with the
    same technology as VLSI chips but used analog rather digital circuits. In an analog
    circuit, the voltages on the transistors can vary continuously, whereas the transistors
    in a digital circuit take only one of two binary values, “on” or “off.” The human
    retina has an array of one hundred million photoreceptors, but, unlike a camera
    that just transmits the photon buckets to memory, the retina has several layers
    of neural processing that transform the visual input into efficient neural codes.
    All of the retina’s processing is analog until its encoded signals reach the ganglion
    cells, which carry these signals to the brain in the form of all-or-none spikes
    along a million axons. The all-or-none character of spikes is like digital logic,
    but the timing of the spikes is an analog variable, and there is no clock, making
    spike trains a hybrid code.


    In Mead''s retina chip, the graded part of the processing was accomplished by
    using voltages below the knee of the threshold from “off” to the near “off” state.
    In contrast, running in digital mode, a transistor rapidly jumps to the fully
    “on” state, which takes much more power. As a consequence, an analog VLSI chip
    consumes only a tiny fraction of the power of a digital chip, ranging from nanowatts
    to microwatts rather than from milliwatts to watts, and making it millions of
    times more energy efficient. The founder of neuromorphic engineering, whose goal
    is to build chips based on brain-style algorithms, in 1989, Mead showed that neural
    algorithms embedded in the neural circuits of insect and mammal eyes could be
    efficiently replicated in silicon.³'
