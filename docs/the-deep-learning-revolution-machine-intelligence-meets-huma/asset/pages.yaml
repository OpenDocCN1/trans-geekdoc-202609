  md: 'How do we perceive the shifting shapes of the surfaces on the Guggenheim Museum
    in Bilbao (figure 5.8)?


    Steve Zucker recently was able to explain how we see folds in shaded images, based
    on the close relationship between the three-dimensional contours of the surface
    as seen on contour maps of mountains and the constant-intensity contours on images
    (figure 5.9).10 The link is provided by the geometry of surfaces.11 This explains
    the mystery of why our perception of shape is so insensitive to differences in
    the lighting and the surface properties of objects. It may also explain why we
    are so good at reading contour maps, where the contours are made explicit, and
    why we need only a few special internal lines to see the shapes of objects in
    cartoons.


    In 1988, Sidney Lehky and I asked whether we could train a neural network with
    one layer of hidden units to compute the curvature of shaded surfaces.12 We succeeded,
    and, to our surprise, the hidden units behaved like simple cells. But, on closer
    inspection, we discovered that not all of these “simple cells” were created equal.
    By looking at their projections to the output layer, which was trained to compute
    the curvature using a learning algorithm (discussed in chapter 8), we found that
    some of the hidden units were being used to decide between positive curvature
    (bulge) and negative curvature (bowl; figure 5.10). Like some simple cells, these
    units


