- pgno: 45
  md: '“What is wrong with this picture?” is a question that every student in my lab
    can answer. But the first two rows of my lunchtime audience were stumped. Finally,
    a student in the third row offered this reply: “The digital computer is a general-purpose
    device, which can be programmed to compute anything, though inefficiently, but
    the fly is a special-purpose computer that can see and fly but can’t balance my
    checkbook.” This was the right answer. The vision networks in the fly eye evolved
    over hundreds of millions of years, and its vision algorithms are embedded in
    the networks themselves. This is why you can reverse engineer vision by working
    out the wiring diagram and information flow through the neural circuits of the
    fly eye, and why you can’t do that for a digital computer, where the hardware
    by itself needs software to specify what problem is being solved.


    I recognized Rodney Brooks smiling in the back of the crowd, someone I had once
    invited to a workshop on computational neuroscience in Woods Hole on Cape Cod,
    Massachusetts. Brooks is from Australia, and, in the 1980s, he was a junior faculty
    member in the MIT AI Lab, where he built walking robotic insects using an architecture
    that did not depend on digital logic. He would eventually become the lab’s director
    and go on to found iRobot, the company that makes Roombas.


    The room where I gave my lecture that afternoon was huge and filled with a large
    contingent of undergraduate students, the next generation looking to the future
    rather than the past. I talked about a neural network that learned how to play
    backgammon, a project I collaborated on with Gerald Tesauro, a physicist at the
    Center for Complex Systems Research at the University of Illinois in Urbana-Champaign.
    Backgammon is a race to the finish between two players, with pieces that move
    forward based on each roll of the dice, passing over one another on the way. Unlike
    chess, which is deterministic, backgammon is governed by chance: the uncertainty
    with every roll of the dice makes it more difficult to predict the outcome of
    a particular move. It is a highly popular game in the Middle East, where some
    make a living playing high-stakes backgammon.


    Rather than write a program based on logic and heuristics to handle all possible
    board positions, an impossible task given that there are 10^20 possible backgammon
    board positions, we had the network learn to play through pattern recognition
    by watching a teacher play.10 Gerry went on to create the first backgammon program
    that played at world-championship levels by having the backgammon network play
    itself (a story that will be told in chapter 10).


    After my lecture, I learned that there was a front page article in the New York
    Times that morning about how government agencies were slashing'
