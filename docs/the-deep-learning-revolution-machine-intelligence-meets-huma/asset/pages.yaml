  md: 'is more trustworthy than reasoning. But here problems with many incommensurate
    dimensions are the most difficult to decide. How do we trade off a sense of humor
    against being messy or make hundreds of other trade-offs of positive against negative
    qualities when choosing a spouse? Our reward system reduces all these dimensions
    down to a common currency, the transient dopamine signal. Nature discovered the
    economic power of a universal currency long before we did.


    There are two parameters in the temporal difference learning algorithm:

    the learning rate \(\alpha\) and the discount factor \(\gamma\) in box 10.1. Whereas
    certain insects have a high learning rate, such as bees, which can learn to associate
    a flower with a reward after a single visit, learning rates are lower in mammals,
    which generally learn over many trials. The discount factor also varies over a
    wide range. When \(\gamma = 0\), the learning algorithm is greedy,

    and decisions are made based only on immediate rewards; but when \(\gamma =

    1\), all future rewards are weighted equally. In a classic experiment, young

    children were given a choice between either eating a marshmallow imme-

    diately or waiting for fifteen minutes to get an additional marshmallow.14 Age
    was a strong predictor, with younger children unable to delay grati-

    fication. Expecting a large reward in the distant future can lead us to make

    choices with negative rewards in the short term if we deem them necessary

    to achieve that expected reward.


    Dopamine neurons receive inputs from a part of the brain called

    the “basal ganglia” (figure 10.4), which were known to be important for

    sequence learning and the formation of habitual behaviors. Neurons in the

    striatum of the basal ganglia receive input from the entire cerebral cortex. Inputs
    from the back half of the cortex are especially involved with learn-

    ing sequences of motor actions to achieve a goal. Inputs to the basal ganglia
    from the prefrontal cortex are more concerned with planning sequences

    of actions. The loop from the cortex to the basal ganglia and back takes

    100 milliseconds, which circulates information ten times a second. This

    allows sequences of fast decisions to be made toward achieving a goal. Neurons
    in the basal ganglia also evaluate cortical states and assign a value

    to them.


    The basal ganglia perform a sophisticated version of the value function

    that Gerry Tesauro trained in TD-Gammon to predict the value of board

    positions. The surprising success of DeepMind’s AlphaGo described in

    chapter 1 in achieving a world-championship level of play in Go is based

    on the same architecture as TD-Gammon, but on steroids. One layer of hidden units
    in the value network of TD-Gammon became a dozen layers in

    AlphaGo, which played many millions of games. But the basic algorithms'
