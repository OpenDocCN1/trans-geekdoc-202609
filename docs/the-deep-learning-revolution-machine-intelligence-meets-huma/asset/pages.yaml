    a dictionary for scientific terms used, but it was great learning. I have learnt
    to overcome the discomfort in my stomach as I enter the exam hall by using the
    breathing technique. It really works! Now I have learnt to face exams as a tool
    to understand how much I have learnt and retained. I love the Pomodoro technique.
    My mom did a role play in the entire course. She played the opposite. She crammed
    her brain with video lectures (she binge watched), she did not take rest and did
    not even sleep before the day I took the final test. Though she is much smarter
    than me, she could not do well. I was amazed that simple techniques helped me
    score better and of course without any pressure of exams. Thanks a ton, Professors.
    I wish you could come up with part II of this course.


    Happy Monday,

    Susan


