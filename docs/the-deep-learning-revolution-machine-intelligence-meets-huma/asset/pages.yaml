    by edges, but the figure could lie on either side of an edge. This was implemented
    in our Boltzmann machine network by having two edge units, each supporting the
    figure on either side. Such neurons were subsequently discovered in the visual
    cortex and are called “border-ownerships cells.”15


    The weights in the Boltzmann network were handcrafted to implement the constraints
    (figure 7.4). There are excitatory connections between the edge units and inhibitory
    connections between the edge units. The edge units have excitatory connections
    with the figure units they point to, supporting the figure, and inhibitory connections
    with the figure units in the opposite direction. Attention was implemented by
    a bias to some of the figure units. When the Boltzmann network uses the Hopfield
    update rule for the units, it falls into local energy minima that are consistent
    in local patches but inconsistent globally. When noise was added to the updates,
    the Boltzmann network jumped out of the local minima, and, by slowly annealing
    the temperature of the noise, the network relaxed to a globally consistent solution
    at the global energy minimum (figure 7.4). Because the updates are asynchronous
    and independent, the network can be implemented by a computer with millions of
    units working together in parallel and can converge to solutions much faster than
    a digital computer that performs one operation at a time, in sequence.


