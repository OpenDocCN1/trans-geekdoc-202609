  md: '# John Hopfield


    To receive a doctorate in physics, you have to solve a problem. A good physicist
    should be able to solve any problem, but a great physicist knows what problem
    to solve. John Hopfield is a great physicist. After a distinguished career in
    condensed matter physics, he turned his interest to biology and, in particular,
    to the problem of “molecular proofreading.” When DNA is replicated during cell
    division, errors are inevitable, and these must be corrected to preserve the fidelity
    of the daughter cells. John figured out a clever scheme for how that could be
    done, and, even though the process he proposed consumes energy, subsequent experiments
    showed he was right. Getting anything right in biology is a spectacular achievement.


    John was my doctoral advisor at Princeton when he was just getting interested
    in neuroscience. With growing enthusiasm, he would tell me what he had learned
    from the neuroscientists who spoke at meetings of the Neuroscience Research Program
    (NRP), based in Boston. I found the proceedings of small workshops published by
    the NRP invaluable since they gave me a sense of what problems were being studied
    and the thinking in the field at the time. I still have my copy of the proceedings
    of a workshop on neural coding that was organized by the legendary neuroethologist
    Theodore Holmes Bullock, who would one day become a colleague of mine at UC, San
    Diego. Ted’s book with Adrian Horiidge on invertebrate nervous systems is a classic.³
    I collaborated with Ted on modeling the collective behavior of coral reefs and
    was proud to be a coauthor on his last scientific paper in 2008.⁴


    Neural networks with feedback connections to earlier layers and recurrent connections
    between units within a layer can have much more complex dynamics than networks
    that only have feedforward connections. The general case of networks with arbitrarily
    connected units with positive (excitatory) and negative (inhibitory) weights poses
    a difficult mathematical problem. Although Jack Cowan at the University of Chicago
    and Stephen Grossberg at Boston University had made progress in the late 1970s
    by showing that such networks could reproduce visual illusions⁵ and visual hallucinations,⁶
    engineers found it hard to get the networks to solve complex computational problems.


    # A Network with Content-Addressable Memories


    In the summer of 1983, Geoffrey Hinton, John Hopfield (figure 7.1), and I were
    at a workshop at the University of Rochester organized by Jerry'
