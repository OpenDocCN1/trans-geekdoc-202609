- pgno: 118
  md: 'The cortex also seems to develop layer by layer. At early stages in the development
    of the visual system, neurons in the primary visual cortex, the first to receive
    inputs from the eyes, are highly plastic and can easily be rewired by the stream
    of visual input, which ends when the critical period does. (This was described
    in chapter 5.) The hierarchy of visual areas and other sensory streams in the
    back of the brain mature first; cortical areas closer to the front of the brain
    take much longer. The prefrontal cortex, the part that is furthest forward, may
    not reach full maturity until early adulthood. Thus there is a gradual wave of
    development with overlapping critical periods when the connections in a cortical
    area are the most influenced by neural activity. Working with other colleagues,
    cognitive scientists Jeffrey Elman and Elizabeth Bates at UC, San Diego developed
    connectionist network explanations for how the progressive development of the
    cortex could account for the new abilities that emerge as a child learns more
    about the world.24 This opened a new research direction into how our long childhood
    has made it possible for humans to become champion learners, and it put previous
    claims for the innateness of some behaviors into a new perspective.


    In Liars, Lovers and Heroes,25 which I coauthored with Steven Quartz, a former
    postdoctoral fellow in my lab who is now on the faculty at Caltech, we wrote that,
    during the extended period of brain development in childhood and adolescence,
    experience can profoundly influence the expression of genes in neurons, and thereby
    alter the neural circuits that are responsible for behavior. The interplay between
    genetic differences and environmental influences is an active area of research
    that is shedding new light on the complexity of brain development, an area that
    goes beyond the nature versus nurture debate and reframes it in terms of cultural
    biology. Our biology both produces human culture and, in turn, is molded by it.26
    A new chapter in this story was opened by a recent discovery: when there is a
    rapid increase in the formation of synapses between neurons during early development,
    the DNA inside neurons is modified epigenetically after birth by a form of methylation
    that regulates gene expression and is unique to the brain.27 This epigenetic modification
    could be the link between genes and experience that Steve Quartz and I had envisioned.


    By the 1990s, the neural network revolution was well under way. Cognitive neuroscience
    was expanding, and computers were getting faster—but not fast enough. The Boltzmann
    machine was technically sweet but terribly slow to simulate. What really helped
    us make progress was a faster learning algorithm, which fell out of the sky just
    when we most needed it.'
