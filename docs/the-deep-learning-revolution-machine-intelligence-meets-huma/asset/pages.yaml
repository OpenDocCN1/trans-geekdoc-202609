- pgno: 42
  md: 'computer to make inferences using logic. The developers ran into difficulties
    in collecting the facts and rules from the experts, however, especially in the
    more complex domains, where the best diagnosticians rely not on rules but on pattern
    recognition based on experience, which is difficult to codify,⁵ and where their
    system had to be continually updated as new facts were discovered and old rules
    became obsolete. And they encountered further difficulties in collecting and entering
    the patients’ symptoms and medical histories into the system’s computer, a process
    that could take a half hour or longer per patient, more time than a busy physician
    could afford. Not surprisingly, MYCIN was never used clinically. Although many
    expert systems were written for other applications such as toxic spill management,
    mission planning for autonomous vehicles, and speech recognition, few are in use
    today.


    Researchers tried many different approaches in the early decades of AI, but their
    approaches were more clever than they were practical. Not only did they underestimate
    the complexity of real-world problems, but the solutions they proposed scaled
    badly. In complex domains, the number of rules can be enormous, and as new facts
    are added by hand, keeping track of exceptions to and interactions with other
    rules becomes impractical. Douglas Lenat, for example, started a project called
    “Cyc” in 1984 to codify common sense, which seemed like a good idea at the time
    but turned out to be a nightmare in practice.⁶ We take for granted a boundless
    number of facts about the way the world works, most of which are based on experience.
    For example, a cat falling from 40 feet will probably avoid harm,⁷ but a human
    falling from the same height probably won’t.


    Another reason why progress in early AI was so slow was that digital computers
    were incredibly primitive and memory forbiddingly expensive by today’s standards.
    But because digital computers are highly efficient at logical operations, symbol
    manipulation, and the application of rules, it is not too surprising that these
    computational primitives would be favored in the twentieth century. Thus Allen
    Newell and Herbert Simon, two computer scientists from Carnegie Mellon University,
    were able to write a computer program called “Logic Theorist” in 1955 that could
    prove the logical theorems in Principia Mathematica, Alfred North Whitehead and
    Bertrand Russell’s attempt to systematize all of mathematics. There were great
    expectations in these early days that intelligent computers were just around the
    corner.


    AI pioneers who sought to write computer programs with the functionality of human
    intelligence did not care how the brain actually achieved intelligent behavior.
    When I asked Allen Newell why, he told me that he'
