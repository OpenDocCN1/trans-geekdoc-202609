  md: '# Box 3.1

    The Perceptron


    ![](img/dd452eef0506ea820c436fef2f776436_53_0.png)


    A perceptron is a neural network with one artificial neuron that has an input
    layer and a set of connections linking the input units to the output unit. The
    goal of a perceptron is to classify patterns presented to input units. The basic
    operation performed by the output unit is to sum up the values of each input (x<sub>n</sub>)
    multiplied by its connection strength, or weight (w<sub>n</sub>), to the output
    unit. In the diagram above, a weighted sum of the inputs (\(\Sigma_{i=1, ...,
    n} w_i x_i\)) is compared to the threshold \(\theta\) and passed through a step
    function that gives an output of "1" if the sum is greater than the threshold
    and an output of "0" otherwise. For example, the input could be the intensities
    of pixels in an image, or more generally, features that are extracted from the
    raw image, such as the outline of objects in the image. Images are presented one
    at a time, and the perceptron decides whether or not the image is a member of
    a category, such as the category of cats. The output can only be in one of two
    states, "on" if the image is in the category or "off" if it isn''t. "On" and "off"
    correspond to the binary values 1 and 0, respectively. The perceptron learning
    algorithm is


    ```

    \(\delta w_i = \alpha \delta x_i\)

    \(\delta = output - teacher,\)

    ```


    where both the output and teacher are binary, so that \(\delta = 0\) if the output
    is correct , and \(\delta = +1\) or -1 If the output is not correct, depending
    on the difference.'
