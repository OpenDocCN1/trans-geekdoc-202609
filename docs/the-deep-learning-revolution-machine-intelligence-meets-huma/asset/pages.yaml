  md: 'study of binocular rivalry, in which two different patterns are presented to
    the two eyes, such as vertical stripes to one eye and horizontal stripes to the
    other eye: rather than seeing a blend of the two images, visual perception flips
    abruptly between the disparate images every few seconds. Different neurons in
    the primary visual cortex respond to the patterns from each eye, regardless of
    which is being consciously perceived at any moment. At the higher levels of the
    visual hierarchy, however, many neurons respond only to the perceived image. Thus
    it is not enough for a neuron to be firing for it to be a neural correlate of
    perception. Apparently, we are only aware of what is represented in a subset of
    the active neurons distributed over the hierarchy of visual areas working together
    in a coordinated way.


    # Grandmother Cells


    In 2004, an epilepsy patient at the UCLA Medical Center whose brain was being
    monitored to detect the origin of the seizures was shown a series of pictures
    of celebrities. Electrodes implanted into the memory centers of the patient’s
    brain reported spikes in response to the photos. In one of these patients, a single
    neuron responded vigorously to several pictures of Halle Berry and her name (figure
    16.2), but not to pictures of Bill Clinton or Julia Roberts or the names of other
    famous people.⁶ Neurons were found that responded to other celebrities, to specific
    objects, and to buildings, like the Sydney Opera House.


    The neurons found by the team led by Itzhak Fried and Christof Koch at the University
    of California, Los Angeles, had been predicted fifty years ago when it first became
    possible to record from single neurons in the brains of cats and monkeys. Researchers
    thought that, in the hierarchy of visual areas of the cerebral cortex, the response
    properties of neurons became more and more specific the higher the neurons were
    in the hierarchy, perhaps so specific that a single neuron at the top of the hierarchy
    would only respond to pictures of a single person. This became known as the “grandmother
    cell hypothesis,” after the putative neuron in your brain that “recognizes” your
    grandmother.


    Even more dramatic were experiments in which patients looked at a blend of two
    images representing familiar individuals and were asked to imagine one individual
    at the expense of the other, competing one, while recording from neurons that
    preferred one or the other image. The subjects were able to increase the firing
    rates of the neuron that represented the face they favored in the blend, while
    simultaneously decreasing the rates of other neurons that preferred the competing
    face, even though the'
