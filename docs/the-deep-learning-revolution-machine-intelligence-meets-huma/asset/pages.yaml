  md: '# The Space of Algorithms


    Imagine the space of all possible algorithms. Every point in this space is an
    algorithm that does something, and some algorithms are amazingly useful and productive.
    In the past, such algorithms were handcrafted by mathematicians and computer scientists
    working like artisans in guilds. Stephen Wolfram automated the finding of algorithms
    for cellular automata by exhaustive search, starting with the simplest automata,
    some of which produced highly complex patterns. This insight can be summarized
    by Wolfram’s law, which states that you don’t have to travel far in the space
    of algorithms to find one that solves an interesting class of problems. This is
    like sending bots to play games like StarCraft on the Internet to try all possible
    strategies. According to Wolfram’s law, there should be a galaxy of algorithms
    somewhere in the universe of algorithms that can win the game.


    Wolfram focused on the space of cellular automata, a small subspace in the space
    of all possible algorithms. But what if cellular automata are atypical algorithms
    that exhibits more universality than other classes of algorithms? We now have
    confirmation of Wolfram’s law in the space of neural networks. Each deep learning
    network was found using a learning algorithm, which is a meta-algorithm that finds
    new algorithms. For a large network and a large set of data, learning from different
    starting states can generate a galaxy of networks roughly as good as one another
    at solving a problem. This raises the question of whether there might be a faster
    way to find the region of algorithm space than by gradient descent, which is slow
    and requires a lot of data. A hint that this might be possible is that each species
    of living organisms is a cloud of individuals created by variant DNA sequences
    around a point in the space of living algorithms, and nature has managed to jump
    from cloud to cloud by natural selection, in a saltatory process called “punctuated
    equilibria,”14 together with local search by random mutations. Genetic algorithms
    were designed to make such jumps, based loosely on how nature evolves new organisms.15
    We need a mathematics to describe these clouds of algorithms. Who knows what the
    universe of algorithms looks like? There are many more galaxies of algorithms
    that we have not yet discovered, but these can be found by automated discovery—the
    final frontier.


    A simple example of this process was followed by Klaus Stiefel, a post-doctoral
    fellow in my lab, who, in 2007, used an algorithm that grew model neurons with
    complex dendritic trees in a computer.16 Dendrites are like antennas that collect
    inputs from other neurons. The space of possible'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'dendritic trees is vast, and the goal was to specify the desired function and
    search the space of dendritic trees for a model neuron that could compute the
    function. One useful function is to decide on the order of arrival of input spikes:
    When a particular input arrives before another input, the neuron should output
    a spike, but if it arrives later, the neuron should remain silent. Such a model
    neuron was discovered by searching through all possible dendritic trees using
    a genetic algorithm and the solution looked just like a cortical pyramidal neuron,
    with a synapse on a thin dendrite coming out the bottom (a basal dendrite) and
    another synapse on the thick dendrite coming out from the top of the neuron (an
    apical dendrite; figure 14.6). This is a possible explanation for why pyramidal
    cells have apical and basal dendrites, a function that might not have been imagined
    without the help of a deep search through the space of all possible dendrites.
    By repeating this search starting with other functions, a directory of functions
    listed by their dendritic shapes could be compiled automatically, and when a new
    neuron is discovered, its shape could be looked up in the directory to find its
    possible functions.


    Stephen Wolfram left academia to run Wolfram Research, which created Mathematica,
    a program that supports a wide range of mathematical structures and is widely
    used for practical applications. Mathematica is written in the Wolfram language,
    a general multiparadigm programming language that also powers Wolfram Alpha, the
    first working question-and-answer system for facts about the world based on a
    symbolic approach.17 In academia, the coin of the realm is the published paper,
    but, when you are a self-supporting gentleman scientist, you can afford to bypass
    bite-sized papers and publish books that allow enough room to thoroughly explore
    a new area. This was the norm for many centuries when only the wealthy or those
    with wealthy patrons could afford to be scientists.


    Wolfram wrote A New Kind of Science in 2002.18 Weighing in at 5.6 pounds, it was
    1,280 pages long, of which 348 pages were notes that contained the equivalent
    of a hundred new scientific papers. The book appeared with great fanfare in the
    press but elicited a mixed response from the complex systems community, some of
    whom thought it failed to fully acknowledge their own work. This objection missed
    the point of the book, which was to put previous work into a new context. Carolus
    Linnaeus had developed a modern taxonomy for classifying plants and animals (“binomial
    nomenclature,” e.g., E. coli), which was an important precursor to Charles Darwin’s
    theory of evolution and provided a context for previous taxonomies. The trail
    that Wolfram blazed is now being followed by a new generation of researchers.'
