  md: '# 16 Consciousness


    When his mother asked young Francis Crick what scientific problems he wanted to
    pursue in life, he told her there were only two that interested him: the mystery
    of life and the mystery of consciousness.¹ Crick clearly had a keen sense for
    what is important, but he may not have appreciated the difficulty of these problems.
    Little did his mother know that, decades later in 1953, her son and James Watson
    would discover the structure of DNA—the loose thread that would eventually unravel
    one of life’s great mysteries. But Crick (figure 16.1) was not content with this
    achievement.


    After moving to the Salk Institute in 1977, Crick took up his long-standing interest
    in consciousness. He decided to focus on the question of visual awareness since
    a great deal was already known about the visual parts of the brain, and understanding
    the neural basis of visual perception would serve as a solid foundation for exploring
    the neural basis of other aspects of consciousness.²


    That the study of consciousness was out of fashion among biologists in the 1980s
    did not deter Crick. Visual perception was filled with illusions and mysteries
    that defied understanding. Seeking explanations for them in anatomical and physiological
    mechanisms, he developed the novel “searchlight hypothesis.”³ Ganglion cells project
    down the optic nerve to the thalamus, which in turn relays the spikes to the visual
    cortex. But why couldn’t the ganglion cells project directly to the cortex? Crick
    pointed out that there was a feedback projection from the cortex back to the thalamus
    that, like a searchlight, might highlight parts of the images for further processing.


    # Neural Correlates of Consciousness


    Crick’s closest colleague on the quest to understand consciousness was neuroscientist
    Christof Koch, then at Caltech, with whom he published a'
