    In the frames from a DVS camera shown in the figure above, the white spots are
    spikes from the “on” channels and the black spots are spikes from the “off” channels.
    Gray indicates no spikes. In the upper left frame, two faces can be detected because
    they moved slightly during the 26-millisecond frame. In the upper right (juggling)
    frame, the spots have their arrival time indicated by gray level so you can see
    the trajectory. The spinning disk in the bottom left panel is rotating at 200
    revolutions per second (rps). In the bottom middle panel, the trajectory is a
    spiral moving upward. In a brief 300-microsecond slice of the spiral shown in
    the bottom right panel, there are only 80 spikes and it is easy to calculate the
    speed by measuring the displacement of the black and white spikes divided by the
    time interval. Note that a digital camera with a 26-millisecond frame duration
    will not be able to follow the spot rotating at 200 Hertz because the rotation
    period is 5 milliseconds, and every frame will be an annulus. The only output
    from the camera is a stream of spikes, just like a retina. This is an efficient
    way to represent the scene since most pixels are silent most of the time, and
