- pgno: 133
  md: 'some 100,000 separate, noninterfering classes of objects and concepts to be
    stored in 100 trillion synapses. In practice, the populations of neurons representing
    similar objects are overlapping, which can greatly increase the capacity of the
    cortex to represent related objects and relationships between objects. This capacity
    is much greater in humans than in other mammals because of the extraordinary expansion
    of the associative cortex (at the top of the sensory and motor hierarchies) in
    the human brain over the course of evolution.


    The study of probability distributions in high-dimensional spaces was a relatively
    unexplored area of statistics in the 1980s. There were a few statisticians who
    studied the statistical issues that arise when navigating high-dimensional spaces
    and high-dimensional data sets, like Leo Breiman from Stanford, who found a home
    in the Neural Information Processing Systems (NIPS) community. And some from that
    community, like Michael Jordan at UC, Berkeley, were recruited to statistics departments.
    But, for the most part, machine learning in the era of big data has trod where
    statisticians feared to go. But it is not enough that we can train large networks
    to do amazing things; we also need to analyze and understand how they do these
    things. Physicists have taken the lead on this front, using methods from statistical
    physics to analyze the properties of learning as the number of neurons and synapses
    becomes ever larger.


    At the 2017 NIPS Conference in Long Beach, the Test of Time award was given to
    Benjamin Recht at UC Berkeley and Ali Rahimi at Google for their 2007 NIPS paper,23
    which showed that random features can be an effective way to improve the performance
    of networks with one layer of learned weights, something that Frank Rosenblatt
    knew empirically for the perceptron in 1960. The presentation after the award
    given by Rahimi was an impassioned defense of rigor in machine learning, and he
    lamented the lack of rigor in deep learning, which he derisively referred to as
    “alchemy.” I was sitting next to Yann LeCun, who was fuming. In a blog after the
    talk Yann wrote: “Criticizing an entire community (and an incredibly successful
    one at that) for practicing ‘alchemy,’ simply because our current theoretical
    tools haven’t caught up with our practice is dangerous. Why dangerous? It’s exactly
    this kind of attitude that lead the ML community to abandon neural nets for over
    10 years, despite ample empirical evidence that they worked very well in many
    situations.”24 This is a classic scrim-mage between the scruffy and neat approaches
    to science. Both are needed to make progress.'
