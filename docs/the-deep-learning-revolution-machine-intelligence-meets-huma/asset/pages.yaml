  md: 'only a few universities had faculty who offered courses on neural networks.
    In a skit based on NETtalk, the students lined up in layers, with each student
    representing a unit in the network (although they registered an error when they
    propagated the “j” in “Sejnowski” since it is pronounced like “y” and does not
    follow the English pattern). Many of those students went on to make important
    discoveries of their own and to forge major careers. A second summer school was
    held at Carnegie Mellon in 1988 and a third at UC, San Diego, in 1990. It takes
    a generation for new ideas to get into the mainstream. These summer schools were
    intense experiences and the best investment we could make in the early days to
    promote the field.


    # Neural Networks Reborn


    The two volumes of Parallel Distributed Processing (PDP), the now classic book
    edited by Rumelhart and McClelland, were published in 1986. It was the first book
    to lay out the implications of neural networks and multilayer learning algorithms
    for understanding mental and behavioral phenomena. It sold more than 50,000 copies,
    a best seller by academic standards. Not only did neural networks trained by backprop
    have hidden units with properties resembling those of cortical neurons in the
    visual system;13 the breakdown patterns exhibited by these networks also had much
    in common with human deficits following brain damage.14


    Francis Crick was a member of the PDP Group and came to most of the group’s meetings
    and seminars. In the debate on how “biological” the parallel distributed processing
    models were, he took the position that they should be considered demonstrations
    rather than literal models of the brain. He wrote a chapter for the PDP book on
    what was then known about the cerebral cortex. I wrote a chapter that summarized
    what we did not know about the cerebral cortex. If those chapters were written
    today, both would be much longer.


    There are success stories from the 1980s that are not generally known. One of
    the most profitable companies based on neural networks was HNC Software, Inc.,
    founded by Robert Hecht-Nielsen, which used neural networks to prevent credit
    card fraud. Hecht-Nielsen was in the Electrical and Computer Engineering Department
    at UC, San Diego, and taught a popular course on practical applications of neural
    networks. Every day, credit cards are compromised by cybercriminals across the
    globe. Credit card transactions feed into a roaring river of data, and picking
    out the suspicious ones is a daunting task. In the 1980s, humans made the time-sensitive
    decisions of whether to approve or deny a given credit card transaction. This
    led to'
