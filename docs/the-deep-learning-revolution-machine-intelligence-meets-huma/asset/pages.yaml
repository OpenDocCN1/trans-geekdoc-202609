    # Other Forms of Learning


    Despite the progress made in automating some cognitive functions like seeing and
    hearing, there are many other aspects of human intelligence where advances are
    needed in artificial intelligence. Representation learning in the cortex together
    with reinforcement learning in the basal ganglia powerfully complement each other.
    Can AI learning to play championship Go translate to solving other complex problems?
    Much of human learning is based on observation and mimicry, and we need far fewer
    examples than deep learning to learn to recognize a new object. Unlabeled sensory
    data are abundant, and powerful unsupervised learning algorithms might use these
    data to advantage before any supervision takes place. In chapter 7, an unsupervised
    version of the Boltzmann learning algorithm was used to initialize deep learning
    networks, and in chapter 6, independent component analysis (ICA), an unsupervised
    learning algorithm, extracted sparse population codes from natural images and
    in chapter 9, generative adversarial networks, an unsupervised learning system,
    can create novel photorealistic mages. Unsupervised learning is the next frontier
    in machine learning. We are just starting to understand brain-style computing.


    The brain has many learning systems and many forms of plasticity that work together
    synergistically. Even within the cortex, there are several dozen forms of plasticity,
    including plasticity in neuronal excitability and gain. A particularly important
    form of synaptic plasticity is homeostatic, which ensures that neurons maintain
    activity levels within their optimal dynamic range. What happens when the synaptic
    strength decreases to zero or reaches a maximum limit? This could result in a
    neuron never receiving sufficient input to reach threshold, or in receiving too
    much input and staying always at a high level of activity. In the brain, a new
    form'
