  md: 'Single cells have adapted to many different conditions and evolved into many
    niches. For example, bacteria have adapted to extreme environments that range
    from hydrothermal vents on the ocean floor to sheets of ice in Antarctica and
    to many more moderate environments, like our stomachs and intestines, which harbor
    thousands of species. Bacteria like Escherichia coli (E. coli; figure 18.3) have
    developed algorithms for swimming up gradients toward food sources. Because they
    are too small to sense a gradient directly (a few micrometers across), bacteria
    use chemotaxis, which involves periodically tumbling and setting off in a random
    direction.¹² This may seem counterproductive, but by adjusting their swim times
    to be longer at higher concentrations, bacteria can reliably climb up the gradient.
    Theirs is a primitive form of intelligence, but bacteria are smarter than the
    smartest biologists, who have yet to figure out how they manage to survive


    ![](img/dd452eef0506ea820c436fef2f776436_277_0.png)


    # Figure 18.3


    Scanning electron micrograph of E. coli. Bacteria are the most diverse, robust,
    and successful life-forms on earth. We can learn much about autonomous artificial
    intelligence by studying them. (NIAID, NIH)'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'in such a wide range of environments. More complex forms of intelligence are
    found in multicellular animals.


    We have seen that the temporal difference learning algorithm that underlies reinforcement
    learning can lead to highly complex behaviors, made still more complex in humans
    by deep learning in the cerebral cortex. There is a spectrum of intelligent behavior
    in nature that artificial systems can learn from. A new field of science that
    straddles computer science and biology, algorithmic biology, seeks to use the
    language of algorithms to describe problem solving strategies used by biological
    systems.13 The hope is that identifying such biological algorithms will both inspire
    new computing paradigms in engineering, and will provide a systems-level understanding
    of biological networks. This is the edge of the wedge that could eventually explain
    the nested levels of complexity in biological systems across spatial and temporal
    scales: gene networks, metabolic networks, immune networks, neural networks, and
    social networks—it’s networks all the way down.


    Deep learning depends on optimizing a cost function. What are the cost functions
    in nature? The inverse of cost in evolution is called fitness, but that is a concept
    that only has meaning in the context of a concrete set of constraints, either
    from the environment or from the system being optimized. In the brain, there are
    some innate costs that regulate behavior, such as the need for food, warmth, safety,
    oxygen, and procreation. In reinforcement learning, actions are taken to optimize
    future rewards. But beyond rewards that insure survival, a wide range of rewards
    can be optimized, as is apparent from the bewildering range of human behaviors.
    Is there some underlying universal cost function that is responsible for this
    diversity?


    We are still looking for the core concepts that will give the game away for the
    highest forms of intelligence. We have identified a few key principles, but we
    do not have a conceptual framework that explains how brains work as elegantly
    as DNA does the nature of life. Learning algorithms are a good place to look for
    unifying concepts. Perhaps the progress we are making in understanding how deep
    learning networks solve practical problems will yield more clues. Perhaps we will
    discover the operating systems in cells and brains that make evolution possible.
    If we could solve these problems, unimaginable benefits might follow. Nature may
    be cleverer than we are individually, but I see no reason why we, as a species,
    cannot someday solve the puzzle of intelligence.'
