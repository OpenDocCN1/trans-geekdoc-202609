  md: 'discovery. In an earlier experiment, Woolsey’s coarser recording techniques
    had missed the areas of extrastriate visual cortex that Kaas and Allman had later
    discovered with better recording techniques.14 More recent studies were to find
    some two dozen visual areas in the monkey visual cortex.


    In 1991 while at Caltech, David Van Essen made a careful study of the inputs and
    outputs of each visual area of the cortex and arranged them in a hierarchical
    diagram (figure 5.11). Sometimes used simply to illustrate the complexity of the
    cortex, his diagram resembles the subway map of a great city, with boxes representing
    the stops and the lines joining them the high-speed train routes. The visual input
    from the retinal ganglion cells (RGC) projects to the primary visual cortex (V1)
    at the bottom of the diagram. From there, the signals are transported up the hierarchy,
    each area specialized for a different aspect of vision, such as form perception.
    Near the top of the hierarchy on the right side of the diagram, the receptive
    fields of neurons in the anterior, central, and posterior areas of the inferotemporal
    cortex (AIT, CIT, and PIT) cover the entire visual field and respond preferentially
    to complex visual stimuli such as faces and other objects. Although we don’t know
    how the neurons do this, we do know that the strengths of the connections can
    be altered by experience, so that neurons can learn how to respond to new objects.
    Van Essen has since moved to Washington University in St. Louis, where he is a
    co-director of the Human Connectome Project funded by the National Institutes
    of Health (NIH).15 The goal of his research team there is to use imaging techniques
    based on magnetic resonance imaging (MRI)16 to work out a long-range map of connections
    in the human cortex (figure 5.12).


