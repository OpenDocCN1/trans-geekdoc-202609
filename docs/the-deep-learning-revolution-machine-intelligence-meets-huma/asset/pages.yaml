    be impossible to analyze the general case of a highly nonlinear network. When
    updates are made simultaneously for all the units in such a network, the dynamics
    can be extremely complicated, and there is no guarantee of convergence.8 But Hopfield
    showed that, when the units of the network are updated sequentially, the special
    case of a symmetric network in which reciprocal connections between pairs of units
    are equal in strength is tractable and does indeed converge.


    There is increasing evidence that neural networks in the hippocampus (essential
    for storing long-term memories of specific events and unique objects) have attractor
    states like those in a Hopfield net.9 Although the Hopfield model is highly abstracted,
    its qualitative behavior is similar to what is observed in the hippocampus. Hopfield
    nets were a bridge from physics to neuroscience that many physicists crossed in
    the 1980s. Surprising insights were obtained by analyzing neural networks and
    learning algorithms with sophisticated tools from theoretical physics. Physics,
    computation, and learning are profoundly linked in an area of neuroscience theory
    that has been successful at illuminating brain function.


    John Hopfield and David Tank, who was then at Bell Laboratories, went on to show
    that a variant of the Hopfield net, in which the units were continuously valued
    between zero and one, could be used to obtain good solutions for optimization
    problems such as the “traveling salesman problem,” where the goal is to find the
    shortest route that visits many cities only once.10 This is a notoriously difficult
    problem in computer science.'
