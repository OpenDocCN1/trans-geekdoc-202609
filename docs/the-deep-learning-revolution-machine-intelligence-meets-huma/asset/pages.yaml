  md: 'features someone from our own community who has made a major contribution to
    our field.


    The general chairs of NIPS conferences are a distinguished group of scientists
    and engineers. To name just a few, Scott Kirkpatrick is a physicist who (as noted
    in chapter 7) invented a way for computers to solve difficult computational problems
    by “heating” them up and slowly “cooling” them down in a process called “simulated
    annealing”; Sebastian Thrun is a computer scientist who (as noted in chapter 1)
    won the 2005 DARPA Grand Challenge for an autonomous automobile, which opened
    the door to today’s self-driving cars; and Daphne Koller is a computer scientist
    who cofounded Coursera (mentioned in chapter 12), which pioneered massive open
    online courses (MOOCs).


    What made deep learning take off was big data. Not too long ago, a terabyte of
    data took up an entire rack of computers; it is now possible to store a terabyte
    (trillion bytes) of data on a single memory stick. Internet companies have data
    centers that store many petabytes, each a thousand terabytes (quadrillion or 10^15
    bytes). The amount of data in the world has doubled every three years since the
    1980s. Thousands of petabytes of data are added every day to the Internet, whose
    total capacity has reached a zettabyte, which is a million petabytes (sextillion
    or 10^21 bytes). The explosion of big data is having an influence not just on
    science and engineering but also on every area of society. It would have been
    impossible to train really big deep learning networks without the millions of
    images and other labeled data available on the Internet.


    Universities throughout the world are setting up new centers, institutes, and
    departments for data science. In 2009, Alex Szalay founded the Institute for Data
    Intensive Engineering and Science (IDIES) at The Johns Hopkins University, building
    on his experience with the Sloan Digital Sky Survey (SDSS; http://www.sdss.org/),
    which began collecting astronomical data in 1998. It produced a thousandfold increase
    in the total amount of data that astronomers had ever collected and today is the
    most used astronomy facility in the world. But the terabyte-scale data sets collected
    by the Sloan Digital Sky Survey will themselves be outstripped a thousandfold
    by the petabyte-scale data sets to be collected by the Large Synoptic Sky Survey
    Telescope (https://www.lsst.org/) under construction. When Yann LeCun founded
    the Center for Data Science at New York University in 2013, faculty from every
    department came knocking on his door with data in hand. In 2018 UCSD dedicated
    a new Halıcıoğlu Data Science Institute. Master’s in Data Science degrees (MDSs)
    are becoming as popular as MBAs.'
