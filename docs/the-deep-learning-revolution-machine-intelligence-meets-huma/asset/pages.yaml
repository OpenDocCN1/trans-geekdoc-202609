    The conclusion was a surprise: the function of a neuron is determined not simply
    by how it responds to inputs, but also by the neurons it activates downstream—by
    its “projective field.” Until recently, the output of a neuron was much more difficult
    to determine than its inputs, but new genetic and anatomical techniques make it
    possible to track the axonal projections downstream with great precision, and
    new optogenetic techniques make it possible to selective stimulate specific neurons
    to probe their impact on perception and behavior.13 Even so, our small network
    could only identify the curvature of hills or bowls, and we still don’t know how
    globally organized perceptions, called “gestalts” in the psychology literature,
    are organized in the cortex.


    Steve Zucker and I were once stranded at the old Stapleton International Denver
    Airport in 1984, our flights delayed by a snowstorm. Excited about computational
    neuroscience, which was still in its infancy, we dreamed up a workshop that would
    bring together computational and experimental researchers and decided to organize
    it at Woods Hole, where I had taken a summer course in neurobiology and had returned
    for several summers to work with Stephen Kuffler on physiological experiments
    at the Marine Biological Laboratory. Woods Hole is a beautiful Cape Cod village
    on the sea, not too far from Boston. Over the years, many of the leading researchers
    who study vision have come to this annual workshop, which has been another scientific
    high point for me. What emerged from these workshops was the beginning of a computational
    theory for the visual cortex, although confirmation of that theory would take
    another thirty years. (In chapter 9, we will see that the architecture of the
    most successful deep learning network is remarkably similar to that of the visual
    cortex.)


    # Visual Maps in the Cortex Are Hierarchically Organized


    Jon Kaas and John Allman, while at the Neurophysiology Department of the University
    of Wisconsin in the early 1970s, explored the cortical areas that received inputs
    from the primary visual cortex and discovered that different areas had different
    properties. For example, they discovered a map of the visual field in an area
    they called the “middle temporal cortex” or “MT,” whose neurons responded to oriented
    visual stimuli moving in a preferred direction. Allman mentioned to me that they
    had a difficult time getting the chairman of his department, Clinton Woolsey,
    to accept their'
