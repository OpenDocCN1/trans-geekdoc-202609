    for solutions to the hard problems in artificial intelligence, we should be looking
    into computers with massively parallel architectures rather than those with von
    Neumann digital architectures through which data and instructions are fetched
    and executed one at a time. Yes, it is true that a Turing machine can compute
    any computable function given enough memory and enough time, but nature had to
    solve problems in real'
