  md: '# 2 The Rebirth of Artificial Intelligence


    Marvin Minsky was a brilliant mathematician and a founder of the MIT Artificial
    Intelligence Laboratory (MIT AI Lab).¹ Founders set the direction and the culture
    of a field, and, thanks in no small part to Minsky, artificial intelligence at
    MIT in the 1960s was a bastion of cleverness. Bubbling over with more ideas per
    minute than anyone else I knew, he could convince you that his take on a problem
    was right, even when common sense told you otherwise. I admired his boldness and
    his cleverness—but not the direction that he took AI.


    # Child''s Play?


    Blocks World is a good example of a project that came out of the MIT AI Lab in
    the 1960s. To simplify the problem of vision, Blocks World consisted of rectangular
    building blocks that could be stacked to create structures (figure 2.1). The goal
    was to write a program that could interpret a command, such as “Find a large yellow
    block and put it on top of the red block,” and plan the steps needed for a robot
    arm to carry out the command. This seems like child’s play, but a large, complex
    program had to be written, one that became so cumbersome that it could not be
    readily debugged and was effectively abandoned when the student who wrote the
    program, Terry Winograd, left MIT. This seemingly simple problem was much harder
    than anyone thought it would be, and, even if it had succeeded, there was no direct
    path from Blocks World to the real world, where objects come in many shapes, sizes,
    and weights, and not all angles are right angles. Compared to a controlled laboratory
    setting where the direction and level of lighting can be fixed, in the real world,
    lighting can vary dramatically from place to place and time to time, which greatly
    complicates the task of object recognition for computers.'
  merge: -1
  img_proc: true
