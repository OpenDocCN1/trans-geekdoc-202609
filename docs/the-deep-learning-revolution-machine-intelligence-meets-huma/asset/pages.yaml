  md: 'and Tzyy-Ping Jung, two former postdoctoral fellows in my lab who went on to
    start a company called “SoftMax,” used ICA with two microphones in a Bluetooth
    headset to cancel background noise, making it possible for a listener to hear
    someone talking at a noisy restaurant or sporting event. In 2007, SoftMax was
    bought by Qualcomm, which designs the chips that are used in many cell phones
    and today ICA-like solutions are embedded in a billion cell phones. If you had
    a penny for every cell phone running ICA, you’d be a multimillionaire today.


    Tony Bell has for many years been interested in an even more difficult problem.
    As human beings, we have many networks within us in which information emerges
    from one network level to another, from molecules, to synapses, to neurons, to
    neural populations, and on up to form decisions, all explained by the laws of
    physics and biochemistry (figure 4.4). But we have the impression that we, not
    physics or biochemistry, are in control. It is a mystery how internal activity
    emerging in neural populations in our brains leads us to make decisions, to read
    this book, for example, or to play tennis. Made well below the level of our consciousness,
    these decisions somehow bubble up from neurons interacting through synapses formed
    by experiences based on molecular mechanisms. But from our human perspective,
    it was our decisions that caused all these events to occur in our brains: introspectively,
    causality seems to be running in the opposite direction from physics and biochemistry.
    How to reconcile these two perspectives is a deep scientific question.¹⁵'
