    The next step will be to train larger deep learning networks on paragraphs to
    improve continuity across sentences. Words have long cultural histories. Vladimir
    Nabokov, the Russian writer and English-language novelist who wrote _Lolita_,
    came to the conclusion that it was impossible to translate poetry between languages.
    His literal translation of Aleksandr Pushkin’s _Eugene Onegin_ into English, annotated
    with explanatory footnotes on the cultural background of the verses, made his
    point.<sup>11</sup> Perhaps Google Translate will be able to translate Shakespeare
    someday by integrating across all of his poetry.<sup>12</sup>


    # ## Learning How to Listen


    Another holy grail of artificial intelligence is speech recognition. Until recently,
    speaker-independent speech recognition by computers was'
