    # Convolutional Neural Networks


    When Yann LeCun moved to New York University in 2003, he continued to evolve his
    vision network, which is now known as the “ConvNet” (figure 9.2). The fundamental
    building block of the network is based on convolution, which can be thought of
    as a small sliding filter that is passed over the image, creating a layer of features
    across the image. For example, the filter could be an oriented edge detector such
    as those introduced in chapter 5, which has a large output only when the window
    is over an edge of an object in an image in the correct orientation or texture
    with that orientation within an object. Although the window on the first layer
    is only a small patch of the image, since there can be many filters, many features
    can be represented in every patch. The filters in the first layer that is convolved
    with the image are similar to what David Hubel and Torsten Wiesel called “simple
    cells” in the primary visual cortex (figure 9.3).11 The filters in higher layers
    respond to even more complex features.12


    In early versions of ConvNet, the output of each filter was passed through a nonlinearity,
    called a “sigmoid function,” that smoothly increased from 0 to 1, suppressing
    the output of weakly activated units (see the sigmoid function in box 7.2). The
    window in the second layer that received inputs from the first layer covered a
    larger region of the visual field, so that after several more layers, there were
    units that received inputs from the entire image. This top layer was analogous
    to the top of the visual hierarchy, which in primates is called the “inferotemporal
    cortex” and has receptive fields that cover most of the visual field. The top
    layer was then fed into a classification layer, connected all-to-all, which was
    used to train the entire network to classify an object in the image using backprop.


    Many incremental improvements were made to ConvNet over the years. An important
    addition was to aggregate each feature over a region, called “pooling.” This provides
    a measure of translation invariance and is similar'
