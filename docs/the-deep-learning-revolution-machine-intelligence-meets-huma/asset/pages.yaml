  md: 'Sydney was silent and I wondered whether a story at the expense of his close
    friend may not have been a good idea. “Terry,” he said, “I can tell you the moment
    when that story came to me. Francis and I were sitting together in our office
    and Francis was reading a book on developmental biology when he suddenly threw
    up his hands and said: ‘God knows why flies have imaginal discs!’”


    I was stunned. How often do you come across the origin of a story you’ve known
    for decades and told innumerable times? I asked Sydney to tell me the original
    version. He said it was entitled “Francisco Crick in Paradise”; his story had
    the same basic structure as mine but the details were different⁴—just as evolution
    holds to the basic core of its story while changing many of the details.


    I visited Sydney in Singapore in January 2017 to celebrate his ninetieth birthday.
    He no longer travels because of health problems and is confined to a wheelchair,
    but he was as lively and I have ever seen him. Theodosius Dobzhansky once said
    that nothing in biology makes any sense except in the light of evolution.⁵ Sydney
    gave a riveting lecture on February 21, 2017, on bacterial evolution as part of
    a series, “10-on-10: The Chronicle of Evolution,” at the Nanyang Technological
    University in Singapore.⁶ My talk in this series on July 14, 2017, about the evolution
    of the brain began with a variation on this theme: Nothing in biology makes any
    sense except in the light of DNA.⁷


    # Evolution of Intelligence


    Intelligence evolved in many species to solve the problems they faced to survive
    in their environmental niches. Animals that evolved in the ocean have different
    problems to solve than animals that evolved on land. Visual perception allows
    us to sense the world around us, and we have developed visual intelligence for
    interpreting those visual signals. Ethologists, who study the behavior of nonhuman
    animals in their natural settings, have uncovered abilities and skills that are
    foreign to humans, such as echolocation: bats actively send out auditory signals
    to probe their environments and analyze the returning echoes. This creates an
    internal representation of the outside world that is, to all appearances, as vivid
    as our visual experience. Bats have an auditory intelligence that sorts through
    signals from fluttering insects (to be hunted) and obstacles (to be avoided).


    Thomas Nagel, a philosopher at New York University, wrote a paper in 1974 entitled
    “What Is It Like to Be a Bat?” and concluded that we cannot'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'imagine what the bat world is like without the direct experience of echolocation.⁸
    But lack of such experience has not stopped us from inventing radar and sonar,
    technologies that allow us to actively probe the world we cannot see, nor does
    it stop blind people from navigating the world by becoming attuned to sound reflections.
    We may not know what it is like to be a bat, but we can build bat-like intelligence
    that helps self-driving cars navigate using radar and lidar.


    We humans are nature''s champion learners. We can learn faster on a broader range
    of topics, remember more, and accumulate more knowledge over more generations
    than any other species. We created a technology called “education” for enhancing
    how much we can learn in our lifetimes. Children and adolescents now spend their
    formative years sitting in classrooms and learning about things in the world that
    they have never directly experienced. Relatively recent human inventions, reading
    and writing take many years to master. But these inventions allow more accumulated
    knowledge to be passed down to the next generation—as books to be written, printed
    or displayed, and read—than was possible by oral tradition. It is writing, reading,
    and learning, not spoken language, that have made modern civilization possible.


    # Where Did We Come From?


    What are our evolutionary origins? The La Jolla Group for Explaining the Origin
    of Humans, which I helped found in 1998, started out as a small group that held
    regular meetings to discuss the many sources of evidence that might help us answer
    this question, from paleontology, geophysics, anthropology, biochemistry, and
    genetics all the way to comparative neuroscience. It gradually attracted an international
    membership, becoming the UCSD/Salk Center for Academic Research and Training in
    Anthropogeny (CARTA) in 2008.⁹ And just as NIPS assembled all the tribes of science
    and engineering to understand neural computation, so, in exploring where we humans
    came from and how we got here and in training a new generation of thinkers to
    seek answers to these age-old questions, CARTA has drawn on insights from all
    areas of science.¹⁰


    The lineage that eventually generated the genus Homo split from the lineage that
    led to chimpanzees about 6 million years ago (figure 18.2). Chimps are a highly
    intelligent species, but chimp intelligence is quite different from ours. Attempts
    to teach chimpanzees the rudiments of language resulted in their learning no more
    than a few hundred signs, which the chimps used to express simple needs, though
    this is an unfair measure of'
