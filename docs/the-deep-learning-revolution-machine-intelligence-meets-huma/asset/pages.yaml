    Reveals about How We Become Who We Are (Harper-Collins, 2002) by Steven R. Quartz
    and Terrence J. Sejnowski explores how both our noblest and darkest traits are
    rooted in brain systems so ancient that we share them with insects—the same reinforcement
    algorithms that DeepMind used to train AlphaGo.


