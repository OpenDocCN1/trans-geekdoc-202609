- pgno: 74
  md: '# 5 Insights from the Visual System


    One of my earliest memories, before going to kindergarten, was peering over pieces
    of a jigsaw puzzle and matching them using shape, color, and context as cues.
    My parents would amaze their friends at parties by how quickly their toddler son
    could put jigsaw puzzles together. I did not know it then, but my brain was doing
    what brains do best—solving problems with pattern recognition. Science is filled
    with problems that are like puzzles with missing pieces and vague hints to the
    underlying picture. How brains solve problems is the ultimate puzzle.


    The Helmholtz Club was a small cadre of vision scientists in Southern California
    from the San Diego, Los Angeles, and Irvine campuses of the University of California,
    Caltech, and the University of Southern California, who would meet each month
    in the afternoon on the Irvine campus.¹ Hermann von Helmholtz was a nineteenth-century
    physicist and physician who developed a mathematical theory and an experimental
    approach to vision that forms the basis for our current understanding of visual
    perception. As the club’s secretary, it fell to me to recruit an outside speaker
    to give a talk to some fifteen to twenty members and their guests. This would
    be followed by a second talk by a club member. The talks were interactive, with
    ample time for in-depth discussion. One of the outside speakers expressed his
    surprise at those asking questions: “They actually wanted to know the answers.”
    Intellectual high points for all who attended them, these monthly meetings were
    master classes in vision.²


    Vision is our most acute and also our most studied sense. With two frontal eyes,
    we have exquisite binocular depth perception, and half of our cortex is visual.
    The special status of vision is captured by the saying “Seeing is believing.”
    Ironically, that we can see so well has blinded us to the enormous computational
    complexity of the vision problem, solved by nature over hundreds of millions of
    year of evolution (as noted in chapter 2). The organization of the visual cortex
    has served as the inspiration for the most successful deep learning networks.'
