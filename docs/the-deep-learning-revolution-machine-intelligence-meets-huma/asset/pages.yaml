- pgno: 138
  md: '# 9 Convolutional Learning


    By 2000, the neural network fever from the 1980s had broken, and neural networks
    became normal science again. Thomas Kuhn once characterized the time between scientific
    revolutions as the normal work of scientists theorizing, observing, and experimenting
    within a settled paradigm or explantory framework.1 Geoffrey Hinton moved to the
    University of Toronto in 1987 and continued with a steady stream of incremental
    improvements, although none of them had the magic that the Boltzmann machine once
    held for us. Hinton became the leader of the Neural Computation and Adaptive Perception
    (NCAP) Program at the Canadian Institute for Advanced Research (CIFAR) in the
    first decade of the new century, which consisted of around twenty-five researchers
    from Canada and other countries who were focused on solving difficult problems
    with machine learning. I was a member of the NCAP Advisory Board, chaired by Yann
    LeCun, and attended the program''s annual meetings just before the NIPS conferences.
    Making slow but steady progress, the neural network pioneers explored many new
    strategies for machine learning. Although their networks had many useful applications,
    the high expectations for the field in the 1980s had not been fulfilled. This
    did not deter the pioneers from keeping the faith, however. In retrospect, they
    were setting the stage for a dramatic breakthrough.


    # Steady Progress in Machine Learning


    The NIPS conferences were the incubator for neural networks in the 1980s and opened
    the door for other algorithms that could handle large, high-dimensional data sets.
