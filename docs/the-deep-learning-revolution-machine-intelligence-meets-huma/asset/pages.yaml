- pgno: 106
  md: '# Box 7.1

    The Hopfield Net


    ![](img/dd452eef0506ea820c436fef2f776436_106_0.png)


    In a Hopfield net, each unit sends an output wire to all the other units in the
    network. The inputs are $x_i$ and the outputs are $y_i$. The strengths of the
    connections or weights between the units are symmetric: $w_{ij} = w_{ji}$. On
    each time step, one of the units is updated by summing up inputs and comparing
    that to a threshold: If the inputs exceed the threshold, the output of the unit
    is 1; otherwise 0. Hopfield showed that the network has an energy function that
    never increases with each update of a unit in the network:


    $E = \sum W_{ij} x_i x_j$


    Eventually, the Hopfield net arrives at an "attractor state," when none of the
    units changes and the energy function is at a local minimum. This state corresponds
    to a stored memory, which can be recovered by initializing the network with a
    part of the stored state. This is how the Hopfield net implements a content-addressable
    memory. The weights of the stored vectors can be learned by Hebbian synaptic plasticity:


    $\Delta w_{ij} = \alpha x_i x_j$


    where the left side is the change in the strength of the weight, $\alpha$ is the
    learning rate, and $x_i$ is a stored vector.

    Drawing courtesy of Dale Heath.'
