  md: '# # 13 The Age of Algorithms


    I was in Singapore in June 2016 for a week of discussions at the Grand Challenges
    for Science in the 21st Century conference held by the Nanyang Technological University.
    The discussions were wide ranging, from cosmology and evolution to science policy.¹
    W. Brian Arthur, an economist with an abiding interest in technology,² pointed
    out that, in the past, technology was driven by the laws of physics; in the twentieth
    century, we sought to understand the physical world using differential equations
    and the mathematics of continuous variables, which vary smoothly across time and
    space. In contrast, today’s technology is driven by algorithms: in the twenty-first
    century, we seek to understand the nature of complexity in computer science and
    biology using discrete mathematics and algorithms. Arthur is on the faculty of
    the Santa Fe Institute in New Mexico, which is one of many centers that sprung
    up in the twentieth century to investigate complex systems.³


    Algorithms are ubiquitous. We are using algorithms every time we google a query.⁴
    The news we read on the Facebook newsfeed is chosen by algorithms based on our
    respective histories of newsfeed clicks, and this affects our emotional reactions.⁵
    The intrusion of algorithms into our lives is accelerating as deep learning delivers
    speech recognition and natural language capabilities to our cell phones.


    An algorithm is a process with a set of discrete steps or rules to be followed
    in performing a calculation or solving a problem. The word “algorithm” is derived
    from the Latin algorismus, named after the ninth-century Persian mathematician
    al-Khwarizmi and refashioned from “algorism” into “algorithm” in the seventeenth
    century under the influence of the Greek arithmos, “number.” Although the origin
    of algorithms is ancient, digital computers have more recently elevated them to
    the forefront of science and engineering.'
