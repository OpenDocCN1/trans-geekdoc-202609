  img_proc: true
- pgno: 75
  md: 'In one-tenth of a second, ten billion neurons in our visual cortex working
    together in parallel can identify a cup in a cluttered scene, even though we may
    never have seen that particular cup before and even when it might be in any location,
    of any size, and in any orientation to us. As a graduate student at Princeton,
    I was fascinated by vision and worked for a summer in the laboratory of Charles
    Gross, who studied the inferotemporal cortex of monkeys (figure 5.1), where he
    had discovered neurons that respond to complex objects like faces and, famously,
    toilet brushes.\(^3\)


    While at the Department of Neurobiology of the Harvard Medical School, I worked
    with Stephen Kuffler, who had earlier discovered how the ganglion cells in the
    retina encode visual scenes, and who probably would


