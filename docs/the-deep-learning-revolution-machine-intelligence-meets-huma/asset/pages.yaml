    In the 1960s, the MIT AI Lab received a large grant from a military research agency
    to build a robot that could play Ping-Pong. I once heard a story that the principal
    investigator forgot to ask for money in the grant proposal to build a vision system
    for the robot, so he assigned the problem to a graduate student as a summer project.
    I once asked Marvin Minsky whether the story was true. He snapped back that I
    had it wrong: “We assigned the problem to undergraduate students.” A document
    from the archives at MIT confirms his version of the story.² What looked like
    it would be an easy problem to solve proved to be quicksand that swallowed a generation
    of researchers in computer vision.


    # Why Vision Is a Hard Problem


    We rarely have difficulty identifying what an object is despite differences in
    the location, size, orientation, and lighting of the object. One of the earliest
    ideas in computer vision was to match a template of the object with the pixels
    in the image, but that approach failed because the pixels of the two images of
    the same object in different orientations don’t match. For example, consider the
    two birds in figure 2.2. If you shift the image of one bird over the other, you
    can get a part to match, but the rest is out of register; but you can get a fairly
    good match to an image of another bird species in the same pose.'
