  md: '# Deep Learning at the Gaming Table


    Deep learning came of age at the 2012 NIPS Conference at Lake Tahoe (figure 11.3).
    Geoffrey Hinton, an early pioneer in neural networks, and his students presented
    a paper reporting that neural networks with many layers were remarkably good at
    recognizing objects in images.⁴ These networks weren’t just better than the state-of-the-art
    computer vision at object recognition—they were in a different, higher league,
    much closer to human levels of performance. The New York Times ran an article
    on deep learning, and Facebook announced a new AI lab with Yann LeCun, another
    deep learning pioneer, as the founding director.


    The participation of Mark Zuckerberg, the CEO of Facebook, at the NIPS deep learning
    workshop that year was a security headache but a huge draw, which required an
    overflow room with a video feed. At the reception afterward, I was introduced
    to Zuckerberg, who asked me questions about the brain. He had a particular interest
    in the theory of mind. In psychology, we have an implicit theory of how our minds
    work, and we use that as a guide


    ![](img/dd452eef0506ea820c436fef2f776436_176_0.png)


    **Figure 11.3**

    Held at a Lake Tahoe casino, the 2012 NIPS Conference was a turning point for
    the field and put the “Neural” back into “Neural Information Processing Systems.”
    Courtesy of the NIPS Foundation.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'to others’ minds. When we text our friends, we are unaware of the many decisions
    our brains have made concerning what to type and how to type it. Zuckerberg asked
    a lot of questions. “How does my brain make a mental model of myself?” “How does
    my brain make mental models of other people based on experience?” “How does my
    brain predict the future behavior of others?” “Do other species have a theory
    of mind?” I had recently co-organized a symposium at the Salk Institute on the
    theory of mind, and Zuckerberg wanted all the symposium references.


    In machine learning, whoever has the most data wins, and Facebook has more data
    about more people’s likes, friends, and photos than anyone else. With all these
    data, Facebook could create a theory of our minds and use it to predict our preferences
    and political leanings. Facebook might someday know us better than we know ourselves.
    Will Facebook someday become the incarnation of Orwell’s Big Brother? Do you find
    this a chilling prospect, or would you find it convenient to have a digital butler
    to attend to your needs? We might well ask whether Facebook should have this power,
    but we may not have much to say in the matter.


    Although we held the 2012 and 2013 NIPS Conferences in Lake Tahoe casinos, attendees
    avoided the gaming tables. They knew the odds favored the house, and what they
    were working on was far more exciting. Gaming can be addictive because of the
    dopamine reward prediction error system that is a part of our brains (discussed
    in chapter 10). Casinos have optimized conditions that favor betting: the promise
    of a big payoff; the occasional smaller wins (rewards) randomly spaced, which
    studies have shown are the best way to keep laboratory rats pressing the bars
    for food; the noises and lights that are triggered when there is a win in a slot
    machine; dim lights night and day, which decouple your light-driven circadian
    from your normal day-night cycle, encouraging you to bet until you drop. But in
    the long run, of course, the house always wins.


    At the 2015 NIPS Conference in Montreal, 3,800 international attendees overflowed
    the Palais des congrès. The deep learning tutorial at the beginning of the conference
    was so popular that we had to turn people away to stay within the fire code. Deep
    learning has been adopted by almost every company with big data in the high-tech
    sector and is spreading at an accelerating pace. The 2016 NIPS Conference in Barcelona
    had to be capped at 5,400 attendees two weeks before the conference. A walk-in
    who flew in from New York was disappointed to learn he could not register on site.
    Registration for NIPS in 2017 at Long Beach was capped twelve days after registration
    opened and reached 8,000. If the 50 percent increase in attendance per year since
    2014 continues, everyone on the planet will eventually want'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'to come to NIPS conferences. Of course, the bubble will eventually burst, but,
    as with most bubbles, no one knows when.


    Researchers from the many tribes of science and engineering continue to gather
    at NIPS conferences, as they have done annually for thirty years, although, of
    the 5,400 attendees at the 2016 NIPS Conference in Barcelona, 40 percent were
    there for the first time. Up until 2016, the NIPS Foundation Board of Trustees
    wisely decided to keep the conferences single track, rare for large conferences.
    The idea was for everyone to sit in the same room to keep the field from fragmenting.
    But in 2016, the single track became two tracks because it was difficult to find
    a big enough room to fit everyone into. Still, this was far fewer than the ten
    tracks common at most other large conferences. The NIPS acceptance rate for submissions
    has been kept around 20 percent, which is below the acceptance rate for most journals.
    NIPS has hosted Women in Machine Learning (WiML),⁶ which in 2016 brought nearly
    600 women—10 percent of all conference attendees—to Barcelona and 1,000 women
    to Long Beach in 2017. Diversity continues to be a hallmark of NIPS conferences.
    No single field on its own could have brought together the diverse talent that
    created deep learning.


    With its potential for affecting so many industries, it may be surprising that
    there are so few patents protecting the intellectual property for deep learning.
    In the 1980s, wanting to make learning algorithms the foundation for a new field
    of science, we felt that securing patents would not help. No doubt there are patents
    being filed by companies today for specific applications since companies won’t
    make big investments in new technology without protection.


    # # Preparing for the Future


    Major breakthroughs in neural network learning have occurred every thirty years,
    starting with the introduction of perceptrons in the 1950s, learning algorithms
    for multilayer perceptrons in the 1980s, and deep learning in the 2010s. In each
    case, there was a period of exuberance, when much progress was made in a short
    time, followed by a longer period of slower, incremental advances. One difference,
    though, is that the impact of the exuberant periods has been increasing with each
    recurrence. The latest growth spurt has been fueled by the widespread availability
    of big data, and the story of NIPS has been one of preparing for this day to come.'
