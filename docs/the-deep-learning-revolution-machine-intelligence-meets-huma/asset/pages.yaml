    tired. Automated deep learning systems will also help law firms comply with the
    increasing complexity of governmental regulations. They will make legal advice
    available for the average person who cannot now afford a lawyer. Not only will
    legal work be cheaper; it will be much faster, a factor that is often more important
    than its expense. The world of law is well on its way to becoming “Legally Deep.”²⁵


    # Learning How to Play Poker


    Heads-up no-limit Texas hold ’em is one of the most popular versions of poker,
    commonly played in casinos, and the no-limit betting form is played at the main
    event of the World Series of Poker (figure 1.7). Poker is challenging because,
    unlike chess, where both players have access to the same information, poker players
    have imperfect information, and, at the highest levels of play, skills in bluffing
    and deception are as important as the cards that are dealt.


    The mathematician John von Neumann, who founded mathematical game theory and pioneered
    digital computers, was particularly fascinated with poker. As he put it: “Real
    life consists of bluffing, of little tactics of deception, of asking yourself
    what is the other man going to think I mean to do. And that is what games are
    about in my theory.”²⁶ Poker is a game that reflects parts of human intelligence
    that were refined by evolution. A deep learning network called “DeepStack” played
    44,852 games against thirty-three professional poker players. To the shock of
    poker experts, it beat the best of the poker players by a sizable margin, one
    standard deviation, but it beat the thirty-three players overall by four standard
    deviations—an immense margin.²⁷ If this achievement is replicated in other areas
    where human judgment based on imperfect information is paramount, such as politics
    and international relations, the consequences could be far reaching.²⁸'
