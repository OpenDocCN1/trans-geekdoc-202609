- pgno: 271
  md: 'been at the Salk Institute for thirty years, half of its lifetime. Starting
    out as a family in 1960, with faculty and staff in the same little boat, the Salk
    was small enough that everyone knew one another. But even today, with a complement
    of 1,000, it still has a family feeling, testimony to the enduring culture of
    an institution.


    We are one species in a great chain of being, going back to bacteria and before.
    It is a miracle that we have arrived at the brink of understanding brains and
    how they evolved, which will forever change how we think about ourselves.'
