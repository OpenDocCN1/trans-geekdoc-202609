- pgno: 261
  md: 'as is known, the relevant properties can be expressed only by the use of abstract
    theories (for example, a grammar) describing postulated internal states of the
    organism, and such theories are excluded, a priori, from Skinner’s “science.”
    The immediate consequence is that the Skinnerian must lapse into mysticism (unexplained
    “similarities” and “generalization” of a sort that cannot be specified) as soon
    as the discussion touches the world of fact. While the situation is perhaps clearer
    in the case of language, there is no reason to suppose that other aspects of human
    behavior will fall within the grasp of the “science” constrained by a priori Skinnernian
    restrictions.8


    From today’s perspective, we can see that Chomsky understood what was at stake,
    but that he simply didn’t know the power of learning. Deep learning has shown
    us that, like the neural networks of the brain itself, model neural networks are
    capable of “generalization” of the sort that Chomsky dismissed as “mysticism,”
    and that they can be trained to selectively recognize speech from many languages,
    to translate between languages and to generate captions for images, with perfectly
    good syntax. The ultimate irony is that machine learning has solved the problem
    of automatically parsing sentences, something that Chomsky’s “abstract theories”
    of syntax never accomplished despite strenuous efforts by computational linguists.
    When coupled with reinforcement learning, whose study in animals Skinner pioneered,
    complex problems can be solved that depend on making a sequence of choices to
    achieve a goal. This is the essence of problem solving and ultimately the basis
    of intelligence.


    Dripping with disdain, Chomsky’s essay went far beyond taking down B. F. Skinner:
    it challenged—and indeed dismissed—learning as a way to understand cognition.
    This had a decisive influence on cognitive psychology in the 1970s. That associative
    learning could ever give rise to a cognitive behavior as complex as language,
    the crux of Chomsky’s argument, ran, was simply unimaginable (at least to Chomsky).
    Note, however, that this argument was based on ignorance. Just because the world’s
    leading linguist says he cannot imagine something doesn’t make it impossible.
    But Chomsky’s rhetoric, which resonated with the zeitgeist of the 1970s, was persuasive.
    By the 1980s, the symbol processing approach to cognition had become the only
    game in town and formed the basis for a new field called “cognitive science,”
    an amalgam of cognitive psychology, linguistics, philosophy, and computer science.
    Neuroscience was the weak sister of cognitive science and was more or less ignored
    until cognitive neuroscience was launched in the 1990s.'
