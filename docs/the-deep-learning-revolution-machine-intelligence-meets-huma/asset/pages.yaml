  md: '# III Technological and Scientific Impact


    # Timeline


    **1971—Noam Chomsky** publishes “The Case against B. F. Skinner” in the *New York
    Review of Books*, an essay that steered a generation of cognitive scientists away
    from learning.


    **1982—Claude Shannon** publishes the seminal book *A Mathematical Theory of Communication*,
    which laid the foundation for modern digital communication.


    **1989—Carver Mead** publishes *Analog VLSI and Neural Systems*, founding the
    field of neuromorphic engineering, which builds computer chips inspired by biology.


    **2002—Stephen Wolfram** publishes *A New Kind of Science*, which explored the
    computational capabilities of cellular automata, algorithms that are even simpler
    than neural networks but still capable of powerful computing.


    **2005—Sebastian Thrun**''s team wins the DARPA Grand Challenge for an autonomous
    vehicle.


    **2008—Tobias Delbrück** develops a highly successful spiking retina chip called
    the “Dynamic Vision Sensor” (DVS) that uses asynchronous spikes rather than synchronous
    frames used in current digital cameras.


    **2013—U.S. BRAIN Initiative**, to develop innovative neurotechnologies that accelerate
    our understanding of brain function, is announced in the White House.'
