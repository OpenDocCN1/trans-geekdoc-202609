    Although, by the 1980s, more was both known about the brain and more widely accessible
    outside the field of biology, the brain itself had become irrelevant for the new
    generation of AI researchers, whose goal was to write a program that was functionally
    equivalent to how the brain worked. In philosophy this stance was called functionalism,
    which for many was a good excuse to ignore the messy details in biology. But a
    small group of AI researchers who were not part of the mainstream believed that
    an approach to artificial intelligence inspired by the actual biology of the brain
    and variously called “neural networks,” “connectionism,” and “parallel distributed
    processing” could eventually solve difficult problems that had eluded logic-based
    AI.


    I was one of that group.


    # Into the Lion’s Den


    In 1989, Michael Dertouzos, head of MIT’s Computer Science Laboratory, invited
    me to give a distinguished lecture at MIT on my pioneering approach to AI based
    on neural networks (figure 2.4). On arriving there, I was warmly greeted by Dertouzos,
    who, as we rode together in the elevator, told me that it was an MIT tradition
    for the distinguished lecturer to take five minutes to open a discussion with
    faculty and students on his or her topic over lunch. “And,” he added as the doors
    of the elevator opened, “they hate what you do.”


    The room was packed with perhaps as many as a hundred people, which surprised
    even Dertouzos. Scientists were standing in circles three rows deep: the first
    row for senior faculty, junior faculty in the second row, and students in the
    rows beyond them. And I was in the center, stationed in front of the buffet, the
    main dish. What could I possibly say in five minutes that could make any difference
    to an audience that hated what I was doing?


    I improvised: “That fly on the food has a brain with only 100,000 neurons; it
    weighs a milligram and consumes a milliwatt of power,” I said,'
