- pgno: 158
  md: '# Box 10.1

    Temporal Difference Learning


    ![](img/dd452eef0506ea820c436fef2f776436_158_0.png)


    In this model of the honeybee brain, actions are chosen (such as landing on a
    flower) that maximize all future discounted rewards:

    \( R(t) = r_{t+1} + \gamma r_{t+2} + \gamma^2 r_{t+3} + ..., \)


    where \( r_{t+1} \) is the reward at time t+1 and \( 0 < \gamma < 1 \) is a discount
    factor. The predicted future reward based on current sensory inputs \( s(t) \)
    is computed by neuron \( P \):

    \( P_t (s) = w^y s^y + w^b s^b, \)


    where the sensory input from yellow (Y) and blue (B) flowers are weighted by \(
    w^y \) and \( w^b \). The reward prediction error \( \delta(t) \) at time \( t
    \) is given by

    \( \delta_t = r_t + \gamma P_t(s_t) - P_t(s_{t-1}), \)


    where \( r_t \) is the current reward. The change in each weight is given by:

    \( \delta w_t = \alpha \delta_t s_{t-1}, \)


    where \( \alpha \) is the learning rate. If the current reward is greater than
    the predicted reward, and \( \delta \) is positive, the weight is increased on
    the sensory input that was present before the reward, but if the current reward
    is less than expected, and \( \delta \) is negative, the weight is decreased.


    Adapted from Montague, P. R. and Sejnowski, T. J., *The Predictive Brain: Temporal
    Coincidence and Temporal Order in Synaptic Learning Mechanisms*, figure 6A.'
