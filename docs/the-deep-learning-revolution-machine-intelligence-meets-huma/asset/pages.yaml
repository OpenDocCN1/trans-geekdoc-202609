    are critically important for finding a configuration that displays complex patterns.


    How common are rules that generate complexity? Wolfram wanted to know the simplest
    cellular automata rule that could lead to complex behaviors and so he set out
    to search through all of them. Rules 0 to 29 produced patterns that would always
    revert to boring behaviors: all the cells would end up in a repeating pattern
    or some nested fractal pattern. But rule 30 produced unfolding patterns and rule
    110 dazzled with continually evolving complex patterns (box 13.1).⁸ It was eventually
    proved that rule 110 was capable of universal computation; that is, some of the
    simplest of all possible cellular automata have the power of a Turing machine
    that can compute any computable function, so it is in principle as powerful as
    any computer.


    One of the implications of this discovery is that the remarkable complexity we
    find in living things could have evolved by sampling the simplest space of chemical
    interactions between molecules. That complex combinations of molecules have emerged
    from evolution should be expected and not considered a miracle. But cellular automata
    may not be good models for early life, and which chemical systems are capable
    of creating complex molecules remains an open question.⁹ It might be that only
    special biochemical systems have this property, which could help narrow the possible
    set of interactions from which life could have originated.


    An essential property of life is a cell''s ability to replicate itself, an ability
    explored by the Hungarian-born American mathematician John von'
