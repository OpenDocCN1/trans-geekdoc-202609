  md: '# 12 The Future of Machine Learning


    The age of cognitive computing is dawning. Soon we will have self-driving cars
    that drive better than we do. Our homes will recognize us, anticipate our habits
    and alert us to visitors. Kaggle, a crowdsourcing website recently bought by Google,
    ran a $1 million contest for a program to detect lung cancer in CT scans and is
    running a $1.5 million contest for the Department of Homeland Security for a program
    to detect concealed items in body scans at airports.¹ With cognitive computing,
    doctor’s assistants will be able to diagnose even rare diseases and raise the
    level of medical care. There are thousands of applications like these, and many
    more have yet to be imagined. Some jobs will be lost; others will be created.
    Although cognitive computing technologies are disruptive and will take time for
    our society to absorb and adjust to, they aren’t existential threats. On the contrary,
    we are entering an era of discovery and enlightenment that will make us smarter,
    live longer, and prosper.


    I was a speaker at an IBM-sponsored cognitive computing conference in San Francisco
    in 2015.² IBM was making a big investment in Watson, a program based on collections
    of large databases of facts about everything from history to popular culture that
    could be interrogated with a wide range of algorithms using a natural language
    interface. Ken Jennings had won 74 games in a row over 192 days on Jeopardy!,
    the longest winning streak in the history of the game show. When Watson nonetheless
    beat Jennings on Jeopardy! in 2011, the world took notice.


    In the taxi from my hotel to the conference, I overheard two IBM executives in
    the back of the car talking shop. IBM was rolling out a platform around Watson
    that could be used to organize and answer questions from unstructured databases
    in specialized areas such as health and financial services. Watson can answer
    questions and make recommendations that are based on more data than any human
    could possibly know, although, of course, as with other machine learning programs,
    it still takes humans to ask the questions and choose among the recommendations
    made.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'IBM had long since parted with its hardware division, and its computer services
    division was no longer competitive. By banking on Watson, IBM was counting on
    its software division to help replace a $70 billion revenue stream. The company
    has invested $200 million in a new global headquarters for its Watson Internet
    of Things business in Munich,³ one of IBM''s largest investments ever in Europe
    in response to growing demand from more than 6,000 customers who want to transform
    their operations with artificial intelligence—and only part of the company''s
    global plan to invest $3 billion in cognitive computing. But many other companies
    are also making major investments into AI and it is too early to say which bets
    will be winners, and who will be the losers.


    # Life in the Twenty-First Century


    In traditional medicine, the same treatment was typically made to fit all patients
    suffering from a given condition or illness, but now, thanks to cognitive computing,
    treatment has become personalized and precise. The progress of melanomas, which
    used to be death sentences, can now be halted and even reversed in many patients
    by sequencing a patient''s cancer cells and designing a specific cancer immunotherapy
    treatment for that person''s cancer. Although this treatment today costs $250,000,
    it will eventually be affordable for almost every melanoma patient since the base
    cost of sequencing a patient''s cancer genome is only a few thousand dollars and
    the cost of the necessary monoclonal antibodies only a few hundred dollars. Medical
    decision making will get better and less expensive once sufficient data have been
    amassed from patients with a wide range of mutations and outcomes. Some lung cancers
    are also treatable with the same approach. Pharmaceutical companies are investing
    in cancer immunotherapy research, and many other cancers may soon be treatable.
    None of this would have been possible without machine learning methods for analyzing
    huge amounts of genetic data.


    I served on the committee that advised the director of the National Institutes
    of Health (NIH) on recommendations for the U.S. Brain Research through Advancing
    Innovative Neurotechnologies (BRAIN) Initiative. Our report emphasized the importance
    of probabilistic and computational techniques for helping us interpret data being
    generated by the new neural recording techniques.⁴ Machine learning algorithms
    are now used to analyze simultaneous recordings from thousands of neurons, to
    analyze complex behavioral data from freely moving animals and to automate reconstructions
    of 3D anatomical circuits from serial electron microscopic'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'digital images. As we reverse engineer brains, we will uncover many new algorithms
    discovered by nature.


    The NIH has funded basic research into neuroscience over the last fifty years,
    but the trend is to direct more and more of its grant support toward translational
    research with immediate health applications. Although we certainly want to translate
    what already has been discovered, if we do not also fund new discoveries now,
    there will be little or nothing to translate to the clinic fifty years from now.
    This also is why it is so important to start research programs like the BRAIN
    Initiative today in order to find future cures for debilitating brain disorders
    like schizophrenia and Alzheimer''s disease.⁵


    # The Future of Identity


    In 2006, the social security numbers and birth dates of 26.5 million veterans
    were stolen from the home of a Department of Veterans Affairs employee. Hackers
    wouldn''t even have had to decrypt the database since the Veterans Administration
    was using social security numbers as the identifiers for veterans in their system.
    With a social security number and a birth date, a hacker could have stolen any
    of their identities.


    In India, more than a billion citizens can be uniquely identified by their fingerprints,
    iris scans, photographs, and twelve-digit identity numbers (three digits more
    than social security numbers). India''s Aadhaar is the world''s largest biometric
    identity program. In the past, an Indian citizen who wanted a public document
    faced endless delays and numerous mid- dlemen, each requiring tribute. Today,
    with a quick bioscan, a citizen can obtain subsidized food entitlements and other
    welfare benefits directly, and many poor citizens who lack birth certificates
    now have a portable ID that can be used to identify them anytime and anywhere
    in seconds. Identity theft that siphoned off welfare support has been stopped.
    A person''s identity cannot be stolen, unless the thief is prepared to cut off
    the fingers and enucleates the eyes of that person.⁶


    The Indian national registry was a seven-year project for Nandan Nile- kani,⁷
    the billionaire and cofounder of Infosys, an outsourcing company. Nilekani''s
    massive digital database has helped India to leapfrog ahead of many developed
    countries. According to Nilekani: “A small, incremental change multiplied by a
    billion is a huge leap. ... If a billion people can get their mobile phone in
    15 minutes instead of one week that''s a massive pro- ductivity injection into
    the economy. If a million people get money into their bank accounts automatically
    that''s a massive productivity leap in the economy.”⁸'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'The advantages of having a digital identity database are balanced by a loss
    of privacy, especially when the biometric ID is linked to other databases, such
    as bank accounts, medical records, and criminal records, and other public programs
    such as transportation. Privacy issues are already paramount in the United States
    and many other countries where databases are being linked, even when their data
    are anonymized.⁹ Thus our cell phones already track our whereabouts, whether we
    want them to or not.


    # The Rise of Social Robots


    Movies often depict artificial intelligence as a robot that walks and talks like
    a human. Don''t expect an AI that looks like the German-accented Terminator in
    the 1984 science fiction/fantasy film The Terminator. But you will communicate
    with AI voices like Samantha''s in the 2013 romance/science fiction film Her and
    interact with droids like R2-D2 and BB-8 in the 2017 science fiction/fantasy film
    Star Wars: The Force Awakens. AI is already a part of everyday life. Cognitive
    appliances like Alexa in the Amazon Echo speaker already talk to you, happy to
    help make your life easier and more rewarding, just like the clocks and tea setting
    in the 2017 fantasy/romance film Beauty and the Beast. What will it be like to
    live in a world that has such creatures in it? Let''s take a look at our first
    steps toward social robots.


    The current advances in artificial intelligence have primarily been on the sensory
    and cognitive sides of intelligence, with advances on motor and action intelligence
    yet to come. I sometimes begin a lecture by saying that the brain is the most
    complex device in the known universe, but my wife, Beatrice, who is a medical
    doctor, often reminds me that the brain is only a part of the body, which is even
    more complex than the brain, although the body''s complexity is different, arising
    from the evolution of mobility.


    Our muscles, tendons, skin, and bones actively adapt to the vicissitudes of the
    world, to gravity, and to other human beings. Internally, our bodies are marvels
    of chemical processing, transforming foodstuffs into exquisitely crafted body
    parts. They are the ultimate 3D printers, which work from the inside out. Our
    brains receive inputs from visceral sensors in every part of our bodies, which
    constantly monitor the internal activity, including at the highest levels of cortical
    representation, and make decisions on internal priorities and maintain a balance
    between all the competing demands. In a real sense, our bodies are integral parts
    of brains, which is a central tenet of embodied cognition.¹⁰'
