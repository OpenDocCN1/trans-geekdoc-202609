  md: 'Another network that learned how to form the past tense of English verbs became
    a cause célèbre in the world of cognitive psychology as the rule-based old guard
    battled it out with the avant-garde PDP Group.11 The regular way to form the past
    tense of an English verb is to add the suffix “ed,” as in forming “trained” from
    “train.” But there are irregular exceptions, such as “ran” from “run.” Neural
    networks have no problem accommodating both the rules and the exceptions. Although
    this is no longer an active debate, the fundamental question about the role of
    explicit representation of rules in the brain remains open. Recent experiments
    on neural network learning of language support the gradual acquisition of inflectional
    morphology, consistent with human learning.12 The success of deep learning with
    Google Translate and other natural language applications in capturing the nuances
    of language further supports the possibility that brains do not need to use explicit
    rules for language, even though behavior might suggest that they do.


    Geoffrey Hinton, David Touretzky, and I organized the first Connectionist Summer
    School at Carnegie Mellon in 1986 (figure 8.3), at a time when


    ![](img/dd452eef0506ea820c436fef2f776436_128_0.png)


