- pgno: 108
  md: '# # Boltzmann Machines


    In a Hopfield net, simulated annealing corresponds to “heating up” the updates
    so that the energy can go uphill as well as downhill. Because the units flip randomly
    at a high temperature, if the temperature is gradually lowered, there is a high
    probability that the Hopfield net will end up frozen in the lowest energy state
    when the temperature reaches zero. In practice, simulations start out at a constant
    temperature to allow the network to come to equilibrium, where it can visit many
    nearby states and explore a wide range of possible solutions.


