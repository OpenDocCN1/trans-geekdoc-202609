    of the origins of consciousness and the origins of life, respectively. Courtesy
    of The

    Salk Institute.


    and “intention” that we use to describe our behavior, but these are slippery

    concepts that hide the complexity of the brain processes underlying them.

    And artificial intelligence based on intuitive folk psychology has been dis-

    appointing. We see, but we know not how. We think, and therefore believe

    that we are, but the machinery behind thinking is a mystery. There is no

    survival advantage for nature to reveal to us how the brain really works.

    Orgel’s second rule prevails.


    As noted in chapter 2, we have highly evolved visual systems, but this

    does not make us experts on how we see.³ Many of us are not even aware

    we have a fovea with sharp vision that is only 1 degree of arc across, about

    the size of a thumb at arm’s length, and that we are legally blind beyond

    the fovea. When I once pointed this out to my mother, she said she didn’t

    believe me because it was perfectly clear everywhere she looked. But we

    have the illusion of high resolution everywhere because we can rapidly

    reposition our eyes. Are you aware that when you gaze at an object, your

    eyes dart back and forth over the object at three times a second? Periph-

    eral vision may have low spatial resolution but is exquisitely sensitive to

    changes in brightness and motion. A major stream in visual cortex, separate

    from the one that recognizes objects, is devoted to moving around in space.'
