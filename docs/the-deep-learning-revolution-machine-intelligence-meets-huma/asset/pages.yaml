- pgno: 10
  md: '# Preface


    If you use voice recognition on an Android phone or Google Translate on the Internet,
    you have communicated with neural networks trained by deep learning. In the last
    few years, deep learning has generated enough profit for Google to cover the costs
    of all its futuristic projects at Google X, including self-driving cars, Google
    Glass, and Google Brain. Google was one of the first Internet companies to embrace
    deep learning; in 2013, it hired Geoffrey Hinton, the father of deep learning,
    and other companies are racing to catch up.


    The recent progress in artificial intelligence (AI) was made by reverse engineering
    brains. Learning algorithms for layered neural network models are inspired by
    the way that neurons communicate with one another and are modified by experience.
    Inside the network, the complexity of the world is transformed into a kaleidoscope
    of internal patterns of activity that are the ingredients of intelligence. The
    network models that I worked on in the 1980s were tiny compared with today''s
    models, which now have millions of artificial neurons and which are dozens of
    layers deep. What made it possible for deep learning to make big breakthroughs
    on some of the most difficult problems in artificial intelligence was persistence,
    big data, and a lot more computer power.


    We''re not good at imagining the impact of a new technology on the future. Who
    could have predicted in 1990, when the Internet went commercial, what impact it
    would have on the music business? On the taxi business? On political campaigns?
    On almost all aspects of our daily lives? There was a similar failure to imagine
    how computers would change our lives. Thomas J. Watson, the president of IBM,
    is widely quoted as saying in 1943: “I think there is a world market for maybe
    five computers.” What''s hard to imagine are the uses to which a new invention
    will be put, and inventors are no better than anyone else at predicting what those
    uses will be. There is a lot of room between the utopian and doomsday scenarios
    that'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'are being predicted for deep learning and AI, but even the most imaginative
    science fiction writers are unlikely to guess what their ultimate impact will
    be.


    The first draft of *The Deep Learning Revolution* was written in a few focused
    weeks after hiking in the Pacific Northwest and meditating on the remarkable recent
    shift in the world of artificial intelligence, which had its origin many decades
    earlier. It is a story about a small group of researchers challenging an AI establishment
    that was much better funded and at the time the “only game in town.” They vastly
    underestimated the difficulty of the problems and relied on intuitions about intelligence
    that proved to be misleading.


    Life on earth is filled with many mysteries, but perhaps the most challenging
    of these is the nature of intelligence. Nature abounds with intelligence in many
    forms, from humble bacterial to complex human intelligence, each adapted to its
    niche in nature. Artificial intelligence will also come in many forms that will
    take their particular places on this spectrum. As machine intelligence based on
    deep neural networks matures, it could provide a new conceptual framework for
    biological intelligence.


    *The Deep Learning Revolution* is a guide to the past, present, and future of
    deep learning. Not meant to be a comprehensive history of the field, it is rather
    a personal view of key conceptual advances and the community of researchers who
    made them. Human memory is fallible and shifts with every retelling of a story,
    a process called “reconsolidation.” The stories in this book stretch over forty
    years, and even though some are as vivid to me as if they occurred yesterday,
    I am well aware that the details have been edited by my memory’s retellings over
    time.


    Part I provides the motivation for deep learning and the background needed to
    understand its origins; part II explains learning algorithms in several different
    types of neural network architectures; and part III explores the impact that deep
    learning is having on our lives and what impact it may have in years to come.
    But, as the New York Yankees’ philosopher Yogi Berra once said: “It’s tough to
    make predictions, especially about the future.” Text boxes in eight of the chapters
    to follow provide technical background to the story; timelines at the beginning
    of the three parts keep track of events that bear on that story and extend over
    sixty years.'
  merge: -1
  img_proc: true
