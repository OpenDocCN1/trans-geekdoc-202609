    their intelligence. How well would we do if we had to survive in a chimp troop?
    Are all species as self-centered as ours?


    One place to find differences between humans and chimps is in our DNA. We have
    known for some time that only 1.4 percent of our 3 billion DNA base pairs are
    different from those in chimps. When the chimpanzee genome was first sequenced,
    it was thought that we would be able to read the book of life and discover what
    makes humans different from chimps. Unfortunately, we have still not learned how
    to read some 90 percent of this book.11 Our brains are remarkably similar to those
    of chimps; neuroanatomists have identified the same brain areas in both species.
    But most of the differences between humans and chimps are at the molecular level
    and are subtle, compared to the dramatic differences in our behaviors. Once again,
    nature is cleverer than we are.


    # The Logic of Life


    Orgel''s first rule, Leslie told me, states that every essential reaction in a
    cell has evolved an enzyme to catalyze that reaction. The enzyme not only speeds
    up the reaction but also makes it possible to regulate the reaction through interactions
    with other molecules, so that the cell can be both more efficient and more adaptable.
    Nature starts out with a clever reaction pathway, then gradually refines it by
    adding enzymes and backup pathways, but none of it would work in the absence of
    certain core processes, which for cells are the maintenance and replication of
    DNA, the queen bee of cellular biochemicals.'
