- pgno: 159
  md: 'The winner in backgammon is the first player to “bear off” all of the pieces
    from the game board.


    Since the only actual reward occurs at the end of a game, you might reasonably
    expect that TD-Gammon would first learn the endgame, then the middle game, and
    finally the openings. This is in fact what happens in “tabular reinforcement learning,”
    or “tabular RL,” where there is a table of values for every state in the state
    space. But it’s completely different with neural networks—they latch quickly onto
    simple and reliable signals in the input features, and more complex and unreliable
    input signals later. The first concept that TD-Gammon learns is “Bear off pieces,”
    by attaching positive weight to the input feature that represents number of pieces
    borne off. The second concept is “Hit the opponent pieces”—a fairly good heuristic
    in all phases, learned by putting positive weight on the input unit encoding number
    of opponent pieces that were hit. The third concept, “Avoid being hit” is a natural
    reaction to the second concept, and is learned by putting negative weight on single
    pieces that can be hit. The fourth concept is “Build new points” to block the
    opponent’s progress by putting positive weights on made-point inputs. Getting
    these basic concepts requires a few thousand training games. By 10,000 games,
    TD-Gammon is learning intermediate concepts; by 100,000 games, it starts to learn
    advanced concepts, and by one million games, it has learned concepts that were
    either world class, or beyond the knowledge of humans in the early 1990s.


    TD-Gammon surprised me and many others when Gerry Tesauro revealed it to the world
    in 1992.5 The value function was a backprop network with eighty hidden units.
    After three hundred thousand games, the program was beating Gerry, so he contacted
    a famous world-champion backgammon player and author, Bill Robertie, and invited
    him to visit IBM at Yorktown Heights to play TD-Gammon. Robertie won most of the
    games but was surprised to lose several well-played ones and declared it the best
    backgammon program he had ever played. Some of TD-Gammon’s unusual moves he had
    never seen before; on closer examination, these proved to be improvements on human
    play overall. Robertie returned when the program had reached 1.5 million self-played
    games and was astonished when TD-Gammon played him to a draw. It had gotten so
    much better that he felt it had achieved human-championship level. One backgammon
    expert, Kit Woolsey, found that TD-Gammon’s positional judgment on whether to
    play “safe” (low risk/reward) or play “bold” (high risk/reward) was at that time
    better than that of any human he had seen. Although 1.5 million may seem like
    a lot of training games, it represented only an infinitesimal fraction of all
    10^20 possible backgammon board positions; this required TD-Gammon to generalize
    to new board positions on almost every move.'
