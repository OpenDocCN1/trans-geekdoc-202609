    # SEXNET


    As an example of how a perceptron can be used to solve a real-world problem, consider
    how you would tell a male from a female face, taking away hair, jewelry, and secondary
    sexual characteristics such as Adam’s apples, which tend to be larger in males.
    Beatrice Golomb, a postdoctoral fellow in my lab in 1990, used faces of college
