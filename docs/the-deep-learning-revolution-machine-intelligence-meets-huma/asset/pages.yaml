  md: 'of the system with the lowest cost. In the case of the Hopfield net, the cost
    function is the energy, and the goal is to find a state of the network that minimizes
    it (as described in chapter 6). For a feedforward network, a popular cost function
    for learning is the summed squared error on the output layer of the training set.
    “Gradient descent” is a general procedure that minimizes a cost function by making
    incremental changes to the weights in the networks in the direction of greatest
    reduction to the cost.³ Think of the cost function as a mountain range and gradient
    descent as the path you take to ski the fastest way down a slope.


    Rumelhart discovered how to calculate the gradient for each weight in the network
    by a process called the “backpropagation of errors,” or “backprop” for short (box
    8.1). Starting on the output layer, where the error is known, it is easy to calculate
    the gradient on the input weights to the output units. The next step is to use
    the output layer gradients to calculate the gradients on the previous layer of
    weights, and so on, layer by layer, all the way back to the input layer. This
    is a highly efficient way to compute error gradients.


    Although it has neither the elegance nor the deep roots in physics that the Boltzmann
    machine learning algorithm has, backprop is more efficient, and it has made possible
    much more rapid progress. The classic backprop paper, coauthored by David Rumelhart,
    Geoffrey Hinton, and Ronald Williams, appeared in Nature in 1986,⁴ and since then,
    it has been cited more than 40,000 times in other research papers. (Half the papers
    published never get a single citation, not even from their authors; a paper that
    receives even 100 citations has made a significant impact on a field, so the backprop
    paper was clearly a blockbuster.)


    # NETtalk


    At Princeton in 1984, I heard a talk by a graduate student, Charles Rosenberg,
    on the Boltzmann machine. Although usually the one giving this talk, I was impressed.
    Charlie asked if he could visit my lab to work on a summer project. By the time
    he arrived in Baltimore, we had switched to backprop, which made it possible for
    us to think about working on a real-world problem rather than the toy demonstration
    problems I had worked on previously. Since Charlie was a student of George Miller,
    a legendary language expert, we looked around for a Goldilocks problem in language,
    one that was neither so difficult that we could not make headway on it nor so
    easy that known methods could solve the problem. Linguistics is a vast field with
    many subdisciplines: phonology, which concerns the'
