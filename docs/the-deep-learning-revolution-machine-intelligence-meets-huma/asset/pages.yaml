    View,” Frontiers in Human Neuroscience 8 (2014): 666, figure 1. doi:10.3389/fnhum.2014.00666.


    But you notice that something on your desk has changed at a much higher level,
    by making top-down comparisons from memory. That all of this is happening in real
    time in the brain leads us to the Carver Mead mantra that “time is its own representation.”9


    Predictive coding goes back to Hermann von Helmholtz, who explained vision as
    unconscious inference, or top-down generation of visual information to cancel
    noise, fill in incomplete information, and interpret the visual scene.10 For example,
    the size of a known person’s image on one of our retinas is a monocular cue for
    depth since we are familiar with that person’s actual size and have experience
    with how that retinal size varies with distance. At a higher cognitive level,
    James McClelland and David Rumelhart found that when letters were situated in
    the context of a word, subjects were able to identify them faster than when they
    were in a nonword without semantic context.11 Their parallel processing model
    exhibited similar behavior,'
