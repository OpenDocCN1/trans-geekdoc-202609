    AI discoveries would be publicly available for all to use, it had another, implicit
    and more important goal—to prevent private companies from doing evil. For, with
    AlphaGo''s victory over world Go champion Sedol, a tipping point had been reached.
    Almost overnight, artificial intelligence had gone from being judged a failure
    to being perceived as an existential threat.


    This is not the first time an emergent technology has seemed to pose an existential
    threat. The invention, development, and stockpiling of nuclear weapons threatened
