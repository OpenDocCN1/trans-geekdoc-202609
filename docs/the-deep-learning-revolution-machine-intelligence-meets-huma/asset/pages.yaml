    Progress in computer vision was made by focusing not on pixels but on features.
    For example, birders have to become experts in distinguishing between different
    species that may differ in only a few subtle markings. A practical and popular
    book on identifying birds has only one photograph of a bird, but many schematic
    drawings pointing out the subtle differences between them (figure 2.3).³ A good
    feature is one that is unique to one bird species, but because the same features
    are found on many species, what makes it possible to identify a bird is the unique
    combination of several field marks such as wing bars, eye stripes, and wing patches.
    And when these field marks are shared by closely related species, there are calls
    and songs that distinguish one from another. Drawings or paintings of birds are
    much better at directing our attention to the relevant distinguishing features
    than are photographs, which are filled with hundreds of less relevant features
    (figure 2.3).


    The problem with this features-based approach is not just that it is very labor
    intensive to develop feature detectors for the hundreds of thousands of different
    objects in the world, but that, even with the best feature detectors, ambiguities
    arise from images of objects that are partially occluded, which makes recognizing
    objects in cluttered scenes a daunting task for computers.'
