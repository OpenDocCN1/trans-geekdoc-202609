  md: 'of synaptic plasticity was discovered by Gina Turrigiano that normalizes all
    the synapses on a neuron to maintain a balance of activity in the neuron.22 If
    the average firing rate is too high, all the excitatory synaptic strengths are
    all scaled down; if too low, all strengths are scaled up. For inhibitory inputs,
    this is reversed, with synaptic strengths scaled up if the firing rate is too
    high and scaled down if the rate is too low. Similar forms of normalization have
    proven effective in modeling the development of neural maps in the brain.23 Artificial
    neural networks that are driven by stochastic gradient descent could benefit from
    homeostatic scaling.


    The brain has dozens of voltage-sensitive and ligand-gated ion channels in the
    membranes of its neurons that regulate excitability and signaling. There must
    be mechanisms based on local patterns of activity in the dendrites, somas and
    axons of neurons that dynamically regulate the locations and densities of these
    channels. Several algorithms have been suggested for how this could be accomplished.24
    This form of homeostasis is not as well understood as homeostatic synaptic plasticity.


    # What Is Missing?


    Demis Hassabis and I participated in intense debates about the future of and next
    priority for artificial intelligence that took place during the Brains, Minds
    and Machines symposium at the 2015 NIPS Conference in Montreal and the Bits and
    Brains workshop at the NIPS 2016 Conference in Barcelona. There are still many
    open questions in AI that need to be addressed. Foremost is the question of causality,
    which informs the highest levels of human reasoning, and the intentionality of
    actions, both of which presuppose a theory of mind. I mentioned earlier that none
    of the deep learning systems we have created are able to survive on their own.
    The autonomy of these systems will only be possible if they include functions
    similar to those from many other parts of the brain hitherto ignored, such as
    the hypothalamus, which is essential for feeding, reproduction, the regulation
    of hormones, and the homeostasis of internal organs, and the cerebellum, which
    helps us refine movements based on movement prediction error. These are ancient
    structures found in all vertebrates and are important for survival.


    Hava Siegelmann is a computer scientist at the University of Massachusetts at
    Amherst who has shown that analog computing is super-Turing; that is, capable
    of going beyond what can be computed with digital computers.25 Recurrent neural
    networks that can adapt and learn based on the environment also have the super-Turing
    computational power, while networks that learn from a training set and are then
    frozen, and do not learn'
