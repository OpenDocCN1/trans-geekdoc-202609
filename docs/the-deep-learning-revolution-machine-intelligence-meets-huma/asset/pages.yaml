    Another way to become better learners is through interactive computer games. Companies
    like Lumosity offer games you can play online that claim to improve memory and
    attention. The problem is that the research to back such claims is often lacking
    or of poor quality, especially with respect to the transfer of training to real-world
    tasks. But these are early days and better research is beginning to help us sort
    out what works from what doesn’t. The results are often surprising and counterintuitive.


    # Brain Training


    The video games that are the most effective in improving cognitive function broadly
    are those where you have to chase zombies, war games where you have to kill the
    bad guys, and race car driving games. Daphne Bavelier at the University of Geneva
    has shown that playing first-person shooter games like Medal of Honor: Allied
    Assault improved perception, attention, and cognition—in particular, vision, multitasking,
    and task switching—and'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'that they led to faster decision making as well.³³ She concluded that playing
    some of these shooter games could make older brains react as quickly as younger
    brains (good news for anyone who’s growing older). But some shooter games may
    also reduce long-term retention.³⁴ Each game has various benefits and liabilities
    that need to be examined individually.


    Adam Gazzaley at UC, San Francisco, has custom-designed a three-dimensional video
    game called NeuroRacer that improves your ability to multitask, based on research
    showing that the activity of neuromodulators in brains is important for attention,
    learning, and memory.³⁵ NeuroRacer players steer a car along a winding, hilly
    road while keeping an eye out for some signs that randomly pop up while ignoring
    others. This requires players to multitask using several cognitive skills such
    as attention and task switching. In testing NeuroRacer, Adam and his colleagues
    found that, after training, subjects significantly improved these skills and achieved
    higher scores on working memory and sustained attention tasks that were not part
    of the training. Furthermore, their performances were better than those of untrained
    twenty-year-olds, and their improved skills were retained six months later without
    practice.³⁶ NeuroRacer is now in clinical trials as a therapy for patients with
    attention and memory deficits.


    Paula Tallal, then at Rutgers, and Michael Merzenich, then at UCSF, started a
    company in 1997 called “Scientific Learning” for children with language and reading
    disorders (such as dyslexia). Speech understanding depends on hearing fast acoustic
    transitions. For example, the difference between hearing “ba,” “ga,” or “da” depends
    on timing differences in the millisecond range at the beginning of the syllable.
    Children who cannot detect these timing differences are at a learning disadvantage
    since they confuse words that have these sounds. In order to learn to read, a
    child must be able to recognize and distinguish the brief sounds that the letters
    in words represent. Tallal and Merzenich developed what is now a large series
    of computer games, called “Fast ForWord,” that improve auditory discrimination,
    language, and reading comprehension by first exaggerating acoustic time differences
    within syllables, words, and sentences, then gradually reducing these differences
    as the child gets better at each level of language and reading.³⁷ Top rated among
    educational games, Fast ForWord computer games have been used in 6,000 schools
    and by more than 2.5 million children. They are also being used to help children
    learn English as a second language in more than fifty-five countries. Merzenich
    has gone on to develop BrainHQ (https://www.brainhq.com), a game based on similar
    scientific principles, aimed at reducing cognitive decline in aging adults.'
