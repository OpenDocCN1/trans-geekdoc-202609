    # The Global Brain


    Launched by the White House on April 2, 2013 (figure 15.6), the U.S. BRAIN Initiative
    is creating new neurotechnologies to accelerate the rate at which we can improve
    our understanding of function and dysfunction in the ultimate information machine—the
    brain. Just as the NIPS conferences brought together researchers from many disciplines
    to create learning machines, the BRAIN Initiative is drawing engineers, mathematicians,
    and


