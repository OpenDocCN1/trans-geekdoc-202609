  md: 'pronunciation of words; syntax, which studies how words are arranged in a sentence;
    semantics, which is about the meaning of words and sentences; and pragmatics,
    which studies how context contributes to the meaning of language—to name just
    a few. We decided to start with phonology and work our way up.


    English is a particularly difficult language to pronounce because the rules are
    complex and have many exceptions. For example, vowels are mostly long if the final
    consonant of a word is followed by a silent “e,” such as “gave,” and “brave,”
    but there are exceptions, such as “have,” which behaves irregularly. I went to
    the library and found a book in which phonologists had compiled hundreds of pages
    of these rules and exceptions. There were often rules within the exceptions and
    sometimes exceptions to these exceptional rules. In short, for linguists, it was
    rules “all the way down.”⁵ To make matters worse, not everyone pronounces a word
    the same way. There are many dialects, each with its own set of rules.


    Geoffrey Hinton visited Charlie and me at Johns Hopkins during this early planning
    period and told us he thought that English pronunciation would be too hard to
    tackle. So we scaled back our ambitions and found a children’s first reading book
    that had a hundred words in it. The network we designed had a window of seven
    letters, each represented by twenty-nine units including space and punctuation,
    for a total of 203 input units. The goal was to predict the sound of the middle
    letter in the window. The input units were connected to eighty hidden units, and
    the hidden units projected to twenty-six output units, one for each of the elementary
    sounds, called “phonemes,” that are found in English. We called our letter-to-sound
    network “NETtalk” (figure 8.2).⁶ There were 18,629 weights in the network, a large
    number by the standards of 1986, and impossibly large by the standards of mathematical
    statistics of the time. With that many parameters, we were told that we would
    overfit the training set, and the network would not be able to generalize.


    As the words marched through the seven-letter window, one letter at a time, the
    network assigned a phoneme to the middle letter in the window. The part of the
    project that took the longest time was manually aligning the phoneme with the
    right letter since the number of letters was not the same as the number of phonemes
    in each word. In contrast, the learning took place before our eyes, getting better
