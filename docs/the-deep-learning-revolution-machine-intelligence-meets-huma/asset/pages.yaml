    # Learning How to Diagnose


    # Skin Deep


    Service industries and professions will also be transformed as machine learning
    matures and is applied to many other problems where big data is available. Medical
    diagnosis based on the records of millions of patients will become more accurate.
    A recent study applied deep learning to 130,000 dermatological images for more
    than 2,000 different diseases—a medical database ten times larger than used previously
    (figure 1.5).¹⁵ The study’s network was trained to diagnose each disease from
    a “test set” of new images it had not seen before. Its diagnostic performance
    on the new images was comparable to and in some cases better than that of twenty-one
    expert dermatologists. It will soon be possible for anyone with a smartphone to
    take a photo of a suspicious skin lesion and have it diagnosed instantly, a process
    that now requires a visit to a doctor’s office, a long wait for the lesion to
    be screened by an expert—and payment of a substantial bill. This will greatly
    expand the scope and quality of dermatological care. If individuals can quickly
    get an expert assessment, they will see their doctors office at an early stage
    of a skin disease, when it is easier to treat. All doctors will become better
    at diagnosing rare skin diseases with the help of deep learning.¹⁶


    # Deep Cancer


    The detection of metastatic breast cancer in images of lymph node biopsies on
    slides is done by experts who make mistakes, mistakes that have deadly consequences.
    This is a pattern recognition problem for which deep learning should excel. And
    indeed, a deep learning network trained on a large dataset of slides for which
    ground truth was known reached an accuracy of 0.925, good but not as good as experts
    who achieved 0.966 on the same test set.¹⁷ However, when the predictions of deep
    learning were combined'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/dd452eef0506ea820c436fef2f776436_22_0.png)


    Figure 1.5

    Artist''s impression of a deep learning network diagnosing a skin lesion with
    high accuracy, cover of February 2, 2017, issue of Nature.


    with the human expert, the result was an almost perfect 0.995. They do better
    together than either alone because deep learning networks and human experts have
    different ways of looking at the same data. Many more lives can be saved. This
    points toward a future in which man and machine work together as partners rather
    than competitors.


    # Deep Sleep


    If you have a serious sleep problem, which 70 percent of us will have sometime
    during our lifetimes, after waiting months to see your doctor (unless your problem
    is urgent), you will be directed to a sleep clinic, where you will be observed
    overnight attached to dozens of electrodes'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'to record your electroencephalogram (EEG) and muscle activity while you sleep.
    In the course of each night, you will enter into slow-wave sleep and, periodically,
    into rapid-eye-movement (REM) sleep, during which you will dream, but insomnia,
    sleep apnea, restless leg syndrome, and many other sleep disorders can disrupt
    this pattern. If you had trouble sleeping at home, sleeping in a strange bed connected
    by wires to ominous medical equipment can be a real challenge. A sleep expert
    will look over your EEG recordings and mark the sleep stages in blocks of 30 seconds,
    which takes several hours to score each eight hours of sleep. You will eventually
    get back a report on abnormalities in your sleep pattern and a bill for $2,000.


    The sleep expert will have been trained to look for telltale features that characterize
    the different sleep stages, based on a system devised in 1968 by Anthony Rechtshaffen
    and Alan Kales.18 But, because the features are often ambiguous and inconsistent,
    experts agree only 75 percent of the time on how to interpret them. In contrast,
    Philip Low, a former graduate student in my lab, used unsupervised machine learning
    to automatically detect sleep stages with a time resolution of 3 seconds and a
    concordance with human experts of 87 percent, in less than a minute of computer
    time. Moreover, this required recording from only a single location on the head
    rather than many contacts and a bundle of wires that take a long time to put on
    and take off. In 2007, we launched a start-up company, Neurovigil, to bring this
    technology to sleep clinics, but they showed little interest in disrupting their
    cash flow from human scoring. Indeed, with an insurance code to bill patients,
    they had no incentive to adopt a cheaper procedure. Neurovigil found another market
    in large drug companies that run clinical trials and need to test the effects
    of their drugs on sleep patterns, and it is now entering the market for long-term
    care facilities, where elderly often have progressive sleep problems.


    The sleep clinic model is flawed because health problems can’t be reliably diagnosed
    based on such restricted circumstances: Everyone has a different baseline, and
    departures from that baseline are the most informative. Neurovigil already has
    a compact device, the iBrain, which can record your EEG at home, transmit the
    data to the Internet and analyze the data longitudinally for trends and anomalies.
    This will allow doctors to detect health problems early when it is easier to treat
    them and to stop the development of chronic illnesses. There are other diseases
    whose treatment would benefit from continuous monitoring, such as type 1 diabetes,
    for which the level of sugar in the blood could be monitored and regulated by
    delivery of insulin.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Access to cheap sensors that can record data continuously is having a major
    impact on diagnosis and treatment of other chronic diseases.


    There are several lessons to be learned from the Neuovigil experience. Although
    having better and cheaper technology does not translate easily into a marketable
    new product or service, even a far superior one, when an incumbent is entrenched
    in the market, there are secondary markets where the new technology can have a
    more immediate impact and buy time to improve and better compete. This is how
    the technologies of solar energy and of many other new industries entered the
    market. In the long run, sleep monitoring and new technologies with demonstrated
    advantages will reach patients at home and eventually be integrated into medical
    practice.


    # Learning How to Make Money


    More than 75 percent of trading on the New York Stock Exchange is automated (figure
    1.6), fueled by high-frequency trades that move into and out of positions in fractions
    of a second. (When you don’t have to pay for each transaction, even small advantages
    can be parlayed into big profits.) Algorithmic trading on a longer time scale
    takes into account longer-term trends based on big data. Deep learning is getting
    better and better at making both more money and higher profits.19 The problem
    with predicting the financial markets is that the data are noisy and conditions
    are not stationary—psychology can change overnight after an election or international
    conflict. This means that an algorithm that predicts stock values today may not
    work tomorrow. In practice, hundreds of algorithms are used and the best ones
    are continually combined to optimize returns.


    Back in the 1980s, when I was consulting for Morgan Stanley on neural network
    models of stock trading, I met David Shaw, a computer scientist who specialized
    in designing parallel computers. On leave of absence from Columbia University,
    Shaw was working as a quantitative analyst, or “quant,” in the early days of automated
    trading. He would go on to start his own investment management firm on Wall Street,
    the D. E. Shaw Group, and he is now a multibillionaire. The D. E. Shaw Group has
    been highly successful, but not as successful as another hedge fund, Renaissance
    Technologies, which was founded by James Simons, a distinguished mathematician
    and former chair of the Mathematics Department at Stony Brook University. Simons
