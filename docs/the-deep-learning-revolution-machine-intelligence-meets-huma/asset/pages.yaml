  md: "![](img/dd452eef0506ea820c436fef2f776436_131_0.png)\n\n**Figure 8.4**\nNonconvex\
    \ and convex cost functions. These graphs plot cost functions, $J(\theta)$, as\
    \ a function of a parameter $\\theta$. A convex function has only one minimum\
    \ (right), a global minimum that can be reached by moving downhill from any location\
    \ on the surface. Imagine you are a skier and always point your skis in the steepest\
    \ downhill direction. You are guaranteed to get to the bottom. In contrast, a\
    \ nonconvex cost function can have local minima (left), which are traps that prevent\
    \ the global minimum from being found by going downhill. As a consequence, nonconvex\
    \ cost functions are difficult to optimize. However, this one-dimensional example\
    \ is misleading. When there are many parameters (typically millions in a neural\
    \ network), there can be saddle points, which are convex up in some dimensions\
    \ and concave down in others. When you are at a saddle, there is always a direction\
    \ to go downhill.\n\nOne particularly clever regularization technique, called\
    \ “dropout,” was invented by Geoffrey Hinton.15 On every learning epoch, when\
    \ the gradient is estimated from a number of training examples and a step is made\
    \ in weight space, half the units are randomly cut out from the network—which\
    \ means that a different network is trained on every epoch. As a consequence,\
    \ there are fewer parameters to train on each epoch, and the resulting network\
    \ has fewer dependencies between units than would be the case if the same large\
    \ network were trained on every epoch. Dropout decreases the error rate in deep\
    \ learning networks by 10 percent, which is a large improvement. In 2009, Netflix\
    \ conducted an open competition, offering a prize of $1 million to the first person\
    \ who could reduce the error of their recommender system by 10 percent.16 Almost\
    \ every graduate student in machine learning entered the competition. Netflix\
    \ probably inspired $10 million of research for the cost of the prize. And deep\
    \ networks are now a core technology for online streaming.17\n\nIntriguingly,\
    \ cortical synapses drop out at a high rate. On every spike along an input, the\
    \ typical excitatory synapse in the cortex has a 90 percent failure rate.18 This\
    \ is like a baseball team where almost all the players are batting .100. How can\
    \ the brain function reliably with such unreliable cortical synapses? When there\
    \ are thousands of probabilistic synapses on a neuron, the variability of their\
    \ summed activity is relatively low,19 which means"
