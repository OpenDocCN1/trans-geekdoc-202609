- pgno: 57
  md: 'What makes discriminating male from female faces an interesting task is that,
    although we are quite good at it, we can''t articulate exactly what the differences
    between male and female faces are. Since no single feature is definitive, this
    pattern recognition problem depends on combining evidence from a large number
    of low-level features. The advantage of the perceptron is that the weights provide
    clues to which parts of the face are the most informative about sex (figure 3.6).
    Surprisingly, the philtrum (the space between the nose and lips) was the most
    distinctive feature, which is noticeably larger in most males. Regions around
    the eyes (larger in males) and upper cheeks (larger in females) also had high
    informative value for classifying sex. The perceptron weighs evidence from all
    these locations to make a decision, and so do we although we might not be able
    to describe how we do it.


    Rosenblatt''s proof of the “perceptron convergence theorem” in 1957 was a breakthrough,
    and his demonstrations were impressive. Backed by the Office of Naval Research,
    he built a custom-hardware analog computer with 400 photocells as input, with
    weights that were variable resistance potentiometers adjusted by motors. Analog
    signals vary continuously with time, just like the signals from vinyl phonograph
    records. Given a collection of pictures with and without tanks in them, Rosenblatt''s
    perceptron learned how to recognize tanks even in new images. This was written
    up in the New York Times and caused a sensation (figure 3.4).¹¹


    The perceptron inspired a beautiful mathematical analysis of pattern separation
    in high-dimensional spaces. When points live in a space that has thousands of
    dimensions, we cannot rely on our intuition about distances between points in
    the three-dimensional space we live in. The Russian mathematician Vladimir Vapnik
    introduced a classifier based on this analysis, called the “Support Vector Machine,”¹²
    which generalized the perceptron and is widely used in machine learning. He found
    a way to automatically find a flat surface that maximally separates points from
    the two categories (figure 3.5, linear). This makes generalization more robust
    to measurement error of the points in the space, and, when coupled with the “kernel
    trick,” which is a nonlinear extension, the Support Vector Machine algorithm has
    become a mainstay in machine learning.¹³


    # Perceptrons Eclipsed


    But there was a limitation that made the perceptron line of research problematic.
    The caveat above, “if such a set of weights exists,” raised the question of what
    problems can and cannot be solved by perceptrons.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Embarrassingly simple distributions of points in two dimensions cannot be separated
    by a perceptron (figure 3.5, nonlinear). It turned out that the tank perceptron
    was not a tank classifier, but a time of day classifier. It is much more difficult
    to classify tanks in images; indeed, it cannot be done with a perceptron. This
    also shows that, even when a perceptron has learned something, it may not be what
    you think it has learned. The final blow to the perceptron was a 1969 tour de
    force mathematical treatise, Perceptrons by Marvin Minsky and Seymour Papert.14
    Their definitive geometric analysis showed that the capabilities of perceptrons
    are limited: they can only separate categories that are linearly separable (figure
    3.5). The cover of their book illustrates a geometric problem that Minsky and
    Papert proved the perceptron could not solve (figure 3.7). Although, at the end
    of their book, Minsky and Papert considered the prospect of generalizing single-
    to multiple-layer perceptrons, one layer feeding into the next, they doubted there
    would ever be a way to train even these more powerful perceptrons. Unfortunately,
    many took this doubt to be definitive, and the field was abandoned until a new
    generation of neural network researchers took a fresh look at the problem in the
    1980s.


    In a perceptron, each input contributes independent evidence to the output unit.
    But what if several inputs need to be combined in ways that make decisions dependent
    on the combination and not on each input separately? This is why a perceptron
    cannot distinguish whether a spiral is connected or not: a single pixel carries
    no information on whether it is on the inside or the outside. Although in multilayer
    feedforward networks, combinations of several inputs can be formed in intermediate
    layers between the input and output units, no one in the 1960s knew how to train
    a network with even a single layer of such “hidden units” between the input and
    output layers.


    Frank Rosenblatt and Marvin Minsky had been classmates at the Bronx High School
    of Science in New York City. They debated their radically different approaches
    to artificial intelligence at scientific meetings, where participants tilted toward
    Minsky’s approach. But despite their differences, each man made important contributions
    to our understanding of perceptrons, which is the starting point for deep learning.


    When Rosenblatt died in a boating accident in 1971 at age 43, the backlash against
    perceptrons was in full swing, and there were rumors that he might have committed
    suicide, or was it an outing gone tragically wrong?15 What became clear was that
    a heroic period of discovering a new way of computing with neural networks was
    closing; a generation would pass before the promise of Rosenblatt’s pioneering
    efforts was realized.'
  merge: -1
  img_proc: true
