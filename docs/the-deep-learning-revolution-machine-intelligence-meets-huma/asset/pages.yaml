  md: '# 3 The Dawn of Neural Networks


    The only existence proof that any of the hard problems in artificial intelligence
    can be solved is the fact that, through evolution, nature has already solved them.
    But there were clues in the 1950s for how computers might actually achieve intelligent
    behavior, if AI researchers would take an approach that was fundamentally different
    from symbol processing.


    The first clue was that our brains are powerful pattern recognizers. Our visual
    systems can recognize an object in a cluttered scene in one-tenth of a second,
    even though we may have never seen that particular object before and even when
    the object is in any location, of any size, and in any orientation to us. In short,
    our visual system behaves like a computer that has “recognize object” as a single
    instruction.


    The second clue was that our brains can learn how to perform many difficult tasks
    through practice, from playing the piano to mastering physics. Nature uses general-purpose
    learning to solve specialized problems, and humans are champion learners. This
    is our special power. The organization of our cerebral cortex is similar throughout,
    and deep learning networks are found in all our sensory and motor systems.¹


    The third clue was that our brains aren’t filled with logic or rules. Yes, we
    can learn how to think logically or follow rules, but only after a lot of training,
    and most of us aren’t very good at it. This is illustrated by typical performances
    on a logical puzzle called the “Wason selection task” (figure 3.1).


    The correct selections are the card with “8” and the brown card. In the original
    study, only 10 percent of subjects got the right answer.² But most subjects had
    no trouble getting the right answer when the logic test was grounded in a familiar
    context (figure 3.2).


    Reasoning seems to be domain specific, and the more familiar we are with a domain,
    the easier it is for us to solve problems in that domain. Experience makes it
    easier to reason within a domain because we can use examples we have encountered
    to intuit solutions. In physics, for example,'
  merge: -1
