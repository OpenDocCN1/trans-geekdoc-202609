    # Synapse Plasticity


    If one eye of a cat is closed during the first few months of its life, cortical
    neurons that normally would be driven by both eyes become monocular, exclusively
    driven by the open eye.4 Monocular deprivation drives changes in the strengths
    of synapses in the primary cortex, where inputs to neurons receive converging
    inputs from the two eyes for the first time. After the critical period of cortical
    plasticity in the primary visual cortex is over, the closed eye can no longer
    influence cortical neurons, resulting in a condition called “amblyopia.” Although,
    uncorrected, misalignment or “strabismus,” which is common in babies, will greatly
    reduce the number of cortical neurons that are binocular and preclude binocular
    depth perception,5 a timely operation to align the eyes within the critical period
    can rescue binocular neurons.


    Monocular deprivation is an example of the high degree of plasticity that is present
    during the early stages of development as the environment molds synaptic connections
    between neurons in the cortex and other parts of the brain. These activity-dependent
    changes ride on top of the continual'
