  md: '# Complex Systems


    There was a flowering of new approaches to complexity in the 1980s. The goal was
    to develop new ways to understand systems like those found in living things, systems
    more complex than those of physics and chemistry. Unlike the simplicity of how
    rockets move, which follows Isaac Newton''s laws of motion, there was no simple
    way to describe how a tree grows. Computer algorithms were used by a colorful
    group of pioneers to explore these age-old questions about living things.


    Stuart Kauffman was trained as a physician and became intrigued with gene networks
    in which proteins called “transcription factors” target genes and influence whether
    or not they are activated.⁶ His models were self-organizing and based on networks
    of binary units that were similar in some respects to neural networks but on much
    slower timescales. Christopher Langton coined the term “artificial life” in the
    late 1980s,⁷ which led to a flurry of attempts to understand the principles that
    underlie the complexity of living cells and the development of complex behaviors.
    Despite the progress we have made in cell biology and molecular genetics to shed
    light on the highly evolved complexity of the molecular mechanisms inside cells,
    the mysteries of life continue to elude us.


    Algorithms offer new opportunities to create worlds with complexities that we
    can compare to our own. Indeed, algorithms discovered in the twentieth century
    have made us rethink the nature of complexity. The neural network revolution in
    the 1980s was driven by similar attempts to understand the complexity of the brain,
    and although our neural network models were vastly simpler than the brain’s neural
    circuits, the learning algorithms we developed made it possible to explore general
    principles such as the distribution of information across large populations of
    neurons. But how does the complexity of network function arise from relatively
    simple learning rules? Is there an even simpler system that exhibits a complexity
    that is easier to analyze?


    # Cellular Automata


    Another colorful character with a scientifically serious approach to complexity,
    Stephen Wolfram (figure 13.1) was a wunderkind, the youngest person ever to earn
    a doctorate in physics from Caltech at the age of 20, and the founder of the Center
    for Complex Systems Research at the University of Illinois in 1986. Wolfram thought
    that neural networks were too complex and decided instead to explore cellular
    automata.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/dd452eef0506ea820c436fef2f776436_208_0.png)


    Figure 13.1 Stephen Wolfram at his home in Concord, Massachusetts, standing on
    an algorithmically generated floor. Wolfram was a pioneer in complexity theory
    and showed that even simple programs can give rise to the complexities of the
    kind we encounter in the world. Courtesy of Stephen Wolfram.


    Cellular automata typically have only a few discrete values that evolve in time,
    depending on the states of the other cells. One of the simplest cellular automata
    is a one-dimensional array of cells, each with value of 0 or 1 (box 13.1). Perhaps
    the most famous cellular automaton is called the “Game of Life,” which was invented
    by John Conway, the John von Neumann professor of mathematics at Princeton, in
    1968, popularized by Martin Gardner in his “Mathematical Games” column in Scientific
    American, and is illustrated in figure 13.2. The board is a two-dimensional array
    of cells that can only be “on” or “off” and the update rule only depends on the
    four nearest neighbors. On each time step, all the states are updated. Complex
    patterns are generated in the array, some of which have names, like “gliders,”
    which flit across the array and collide with other patterns. The initial conditions'
