    interactions of the legs with the environment take the place of abstract planning
    and computation. He argued that, for robots to accomplish everyday tasks, their
    higher cognitive abilities should be based on sensorimotor interaction with the
    environment, not abstract reasoning. Elephants are highly social, have great memories,
    and are mechanical geniuses, 13 but they don’t play chess. 14 In 1990, Brooks
    went on to found iRobot, which has sold more than 10 million Roombas to clean
