  md: '21. J. Collins, J. Sohl-Dickstein, and D. Sussillo, “Capacity and Trainability
    in Recurrent Neural Networks,” 2016, https://arxiv.org/pdf/1611.09913.pdf. It
    is dangerous to put too much weight on a coincidence: “24 hours in a day, 24 beers
    in a case. Is this just a coincidence? I think not.” This coincidence is celebrated
    annually at Princeton University on Paul Newman Day, April 24.


    22. A rough estimate of the dimensionality of synapses can be found by taking
    the square root of the product of the lower and upper bounds of the number of
    synapses. Lawrence Weinstein and John A. Adam, Guesstimation: Solving the World’s
    Problems on the Back of a Cocktail Napkin (Princeton: Princeton University Press,
    2009), 3. Taking, as upper bound, the total number of synapses in the cortex,
    100 trillion, and, as lower bound, the number of synapses on a single neuron,10,000,
    a rough estimate of the number of synapses needed to represent a complex object
    is about a billion. Applying the same rule of thumb to the number of neurons needed:
    the upper bound is ten billion, the number of neurons in the cortex, and the lower
    bound is one neuron, so the number of neurons needed to represent a complex object
    is 100,000, about the number of neurons below a square millimeter of cortex. But
    these neurons could be distributed widely in different parts of the cortex. We
    can estimate the number of cortical areas that must be linked to represent a concept:
    an upper bound is 100, the total number of cortical areas, and a lower bound is
    1, so the estimate is 10 cortical areas, each containing 10,000 neurons. New techniques
    being developed by the BRAIN Initiative will pin down these numbers experimentally.


