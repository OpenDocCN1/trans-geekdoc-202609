- pgno: 60
  md: '# 4 Brain-style Computing


    "If I Only Had a Brain" was a song sung by the Scarecrow in the classic 1939 musical
    film The Wizard of Oz. What the Scarecrow did not know was that he already had
    a brain and could hardly have talked or sung without one, but the brain was only
    two days old, and his real problem was a lack of experience. With time, he learned
    about the world and was eventually recognized as the wisest man in all of Oz,
    wise enough to know his own limitations. In contrast, the Tin Woodman sang “If
    I Only Had a Heart.” He and the Scarecrow debated which was more important, having
    a brain or having a heart. In Oz, as well as in the real world, cognition and
    emotion, both products of the brain, work together in a delicate balancing act
    with learning to create human intelligence. Drawing on this classic musical, the
    theme of this chapter is “If AI Only Had a Brain and a Heart.”


    # How the Brain Works


    Geoffrey Hinton (figure 4.1) and I had similar beliefs about the promise of neural
    network models when we met at a workshop that Geoffrey organized in 1979. We became
    fast friends and later collaborated on the discovery of a new type of neural network
    model called the “Boltzmann machine” (discussed in chapter 7), which would break
    a logjam that had been holding back learning in multilayer network models for
    a generation.


    Every few years, I get a call from Geoffrey that begins with “I figured out how
    the brain works.” Each time, he tells me about a clever new scheme for improving
    neural network models. It has taken many such schemes and refinements for deep
    learning in multilayered neural networks to achieve a level of performance comparable
    to humans in recognizing speech on cell phones and objects in photos. The public
    became aware of these capabilities just a few years ago; they are now well known,
    but they were a long time in coming.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/dd452eef0506ea820c436fef2f776436_61_0.png)


    ![](img/dd452eef0506ea820c436fef2f776436_61_1.png)


    Figure 4.1

    (A) Geoffrey Everest Hinton early in his career. His middle name comes from a
    relative, George Everest, who surveyed India and figured out how to measure the
    height of the world’s tallest mountain, which now bears his name. (B) Hinton in
    1994. These two photos were taken fifteen years apart. Courtesy of Geoffrey Hinton.


    Geoffrey received an undergraduate degree in psychology at the University of Cambridge
    and a doctorate in artificial intelligence from the University of Edinburgh. His
    thesis advisor was Christopher Longuet-Higgins, a distinguished chemist who invented
    an early network model of an associative memory. At that time, the dominant paradigm
    in artificial intelligence was based on writing programs that used symbols, logic,
    and rules to codify intelligent behavior; cognitive psychologists had adopted
    this approach to understanding human cognition, and especially language. Geoffrey
    was swimming against the tide. No one could have predicted that he would someday
    figure out how the brain—or at least something like the brain—works. His lectures
    are compelling, and he can explain abstract'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'mathematical concepts with a clarity that requires little math to grasp. His
    wit and self-effacing humor are charming. Geoffrey is also by nature highly competitive,
    especially when it comes to the brain.


    When we first met, Geoffrey was a postdoctoral fellow at the University of California,
    San Diego (UCSD), in the Parallel Distributed Processing (PDP) Group led by David
    Rumelhart and James McClelland. Geoffrey believed that networks of simple processing
    units, working together in parallel and learning from examples, were a better
    way to understand cognition. He was a central figure in the PDP Group, which was
    exploring how words and language could be understood as the spread of activity
    distributed over a large number of nodes in a network.


    The traditional approach to language in cognitive science is based on symbolic
    representations. The word “cup,” for example, is a symbol that stands for the
    concept of a cup, and not just any cup, but all cups. The beauty of symbols is
    that they allow us to compress complex ideas and manipulate them; the problem
    with symbols is that they are so compressed that it is difficult to ground them
    in the real world, where cups come in an infinite variety of forms, shapes, and
    sizes. There is no logical program that can specify what is and what is not a
    cup or that can recognize cups in images, even though most of us humans are quite
    good at knowing a cup when we see it. Abstract concepts like justice and peace
    are even more difficult for a logical program to pin down. An alternative is to
    represent cups by activity patterns over a very large population of neurons, which
    can capture both the similarities and differences between concepts. This endows
    a symbol with a rich internal structure that reflects its meaning. The problem
    was that no one in 1980 knew how to create these internal representations.


    Geoffrey and I were not the only ones who believed in the potential of network
    models to mimic intelligent behavior in the 1980s. A number of researchers around
    the world, most of them toiling in isolation, shared our belief and went on to
    develop specialized network models. Christoph von der Malsburg, for one, developed
    a model of pattern recognition based on linking together artificial neurons that
    fired spikes¹ and later demonstrated that this approach could recognize faces
    in images.² Kunihiko Fukushima at Osaka University, for another, invented the
    Neocognitron,³ a multilayered network model based on the architecture of the visual
    system that used convolutional filters and a simple form of Hebbian plasticity
    and was a direct precursor of deep learning networks. And, for a third, Teuvo
    Kohonen, an electrical engineer at Helsinki University, developed a self-organizing
    network that could learn to cluster similar inputs into a two-dimensional map,'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'representing different speech sounds, for example, by different processing
    units in the map, with similar inputs activating neighboring regions of the output
    space.⁴ A major advantage of the Kohonen network model was that it did not require
    a category label for each input (generating labels to train supervised networks
    is expensive). Kohonen had only one arrow in his quiver, but it was a very fine
    arrow.


    In a promising early attempt to systematize probabilistic networks, Judea Pearl
    at the University of California, Los Angeles (UCLA), introduced belief networks
    that linked the items in the network with probabilities, such as the probabilities
    that the grass is wet because the sprinkler came on or because it rained.⁵ Although
    Pearl’s network model was a powerful framework for keeping track of cause and
    effect in the world, manually assigning all of the required probabilities proved
    impracticable. A breakthrough was needed for automatically finding the probabilities
    with learning algorithms (as will be discussed in part II).


    These and other network-based models all had one fatal flaw in common: none of
    them worked well enough to solve problems in the real world. Moreover, the pioneers
    who developed them rarely collaborated with one another, making it even more difficult
    to make progress. As a consequence, very few in the leading AI research centers
    at MIT, Stanford, and Carnegie Mellon took neural networks seriously. Rule-based
    symbol processing received most of the funding—and generated most of the jobs.


    # Early Pioneers


    In 1979, Geoffrey Hinton and James Anderson, a psychologist at Brown University,
    organized the Parallel Models of Associative Memory workshop in La Jolla, California.⁶
    Most participants were meeting one another for the first time. As a postdoctoral
    fellow of neurobiology at Harvard Medical School who had written only a few highly
    technical papers on neural networks published in obscure journals, I was surprised
    to be invited to the workshop. Geoffrey later told me that he had vetted me with
    David Marr (figure 4.2, middle), a towering figure in neural network modeling
    and a leading visionary at the MIT AI Lab. I first met Marr in a small workshop
    at Jackson Hole, Wyoming, in 1976. We had similar interests and he invited me
    to visit him and give a talk at MIT.


    Marr received a bachelor’s degree in mathematics and his doctorate in physiology
    from Cambridge University. His doctoral advisor was Giles Brindley, a physiologist
    who specialized on the retina and color vision but also was known for his work
    on musicology and the treatment of erectile'
