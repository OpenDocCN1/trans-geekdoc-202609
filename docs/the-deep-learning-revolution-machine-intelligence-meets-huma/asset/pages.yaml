  md: 'to understand memory and language processing. Except for the Parallel Distributed
    Processing (PDP) Group in La Jolla and a few isolated outposts, symbol processing
    was still the only game in town. At a 1983 Cognitive Science Society symposium
    that Geoffrey and I attended, Zenon Pylyshyn, a psychologist who studies short-term
    memory and imagery, showed his disdain for the Boltzmann machine by pouring a
    glass of water on the stage and shouting, “This is not computation!” Others dismissed
    the whole enterprise as mere “statistics.” But not Jerome Lettvin, who told us
    that he really liked what we were doing. Lettvin had written the classic 1959
    paper “What the Frog’s Eye Tells the Frog’s Brain” with Humberto Maturana, Warren
    McCulloch, and Walter Pitts,21 which reported evidence for bug detector neurons
    in the frog retina that responded best to small dark spots, an idea that was highly
    influential in systems neuroscience. His support for our fledgling neural network
    model was an important link to an earlier era.


    # Unsupervised Learning and Cortical Development


    The Boltzmann machine can be used either in its supervised version, where both
    inputs and outputs are clamped, or in its unsupervised version, where only the
    inputs are clamped. Geoffrey Hinton used the unsupervised version to build up
    a deep Boltzmann machine one layer at a time.22 Starting with a layer of hidden
    units connected to the input units, called a restricted Boltzmann machine, Geoffrey
    trained these on unlabeled data, which are a lot easier to come by than labeled
    data (there are billions of unlabeled images and audio recordings on the Internet),
    and learning is much faster. The first step in unsupervised learning is to extract
    from the data statistical regularities that are common to all the data, but the
    first layer of hidden units can only extract simple features, features that a
    perceptron can represent. The next step is to freeze the weights to the first
    layer and add a second layer of units on top. More unsupervised Boltzmann learning
    leads to a more complex set of features, and this process can be repeated to create
    a network that is many layers deep.


    Because the units in the upper layers incorporate more nonlinear combinations
    of low-level features, making it possible for them as a population to abstract
    what is general from what is specific, classification becomes much easier in the
    upper layers, requiring many fewer training examples to reach convergence at a
    higher level of performance. Although it is still an open problem to describe
    the mathematics of this disentangling, new geometrical tools are being brought
    to bear on these deep networks.23'
