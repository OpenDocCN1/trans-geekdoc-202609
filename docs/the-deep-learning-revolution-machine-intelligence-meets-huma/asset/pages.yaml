  md: 'neural network and those recorded from populations of biological neurons recorded
    one at a time, Patricia and I wrote The Computational Brain in 1992 to develop
    a conceptual framework for neuroscience based on large populations of neurons.14
    (Now in its second edition, our book is a good primer if you want to learn more
    about brain-style computing.) James DiCarlo at MIT recently compared the responses
    of neurons at different levels of the visual cortex hierarchy of monkeys trained
    to recognize images of objects with the responses of units in a deep learning
    neural network that could recognize the same images (figure 9.2).15 He concluded
    that the statistical properties of the neurons in each layer of the deep learning
    network matched quite closely those of neurons in the cortical hierarchy.


    The similarity between the performances of units in a deep learning network and
    those of neurons in the monkey''s visual cortex is a puzzle, especially because
    the monkey''s brain is unlikely to be using backprop for learning. Backprop requires
    the feedback of detailed error signals to each neuron in each layer of a neural
    network with much greater precision than that found in known feedback connections
    of biological neurons. But other learning algorithms are more biologically plausible,
    such as the Boltzmann machine learning algorithm, which uses Hebbian synaptic
    plasticity that has been found in the cortex. This raises an interesting question
    of whether there is a mathematical theory of deep learning that applies to a large
    class of learning algorithms including those in the cortex. In chapter 7, I alluded
    to the disentangling of classification surfaces in the upper layers of the visual
    hierarchy, where the decision surfaces are flatter than those in lower layers.
    A geometric analysis of the decision surface may lead to a deeper mathematical
    understanding of both deep learning networks and the brain.


    One of the advantages of a deep learning neural network is that we can “record”
    from every unit in the network and follow the flow of information as it is transformed
    from layer to layer. Strategies for the analysis of such a network could then
    be applied to analyzing neurons in the brain. One of the wonderful things about
    a technology that works is that there usually is both a good explanation behind
    the technology and a strong incentive to figure that explanation out. The first
    steam engines were built by engineers following their intuitions; the theory of
    thermodynamics that explained how the engines worked came later, along with improvements
    in their efficiency. The analysis of deep learning networks by physicists and
    mathematicians is well under way.'
