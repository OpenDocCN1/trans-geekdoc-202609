  md: 'You can also improve your motor skills with brain exercises. Aaron Seitz at
    UC, Riverside, developed a computer program that sharpens visual perception and
    reaction times. After using this program, the baseball team reported having better
    vision, fewer strikeouts, and more runs created, and they ultimately won 4–5 more
    games out of a 54-game season.38 Seitz developed an inexpensive app called “UltimEyes”
    that made his research available to the public, although the Federal Trade Commission
    has stopped its dissemination until more studies can confirm his claims.39 Improvement
    in certain cognitive skills tends to transfer to other cognitive skills when you
    play reaction time games, but not when you play many other, domain-specific games,
    such as memory games. Although we’re getting better at designing interactive video
    games that improve our brains, are fun to play, and can be delivered in an app,
    more research is needed to understand the conditions when transfer occurs. The
    potential for cognitive improvement worldwide is enormous.


    # The AI Business


