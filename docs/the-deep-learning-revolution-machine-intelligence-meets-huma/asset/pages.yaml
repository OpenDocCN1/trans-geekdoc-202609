    field, which generates microvolt signals in their electoreceptors. My project
    yielded spectacular electron microscope images of the skate electoreceptor.14


    I was taking photos in the basement of Loeb Hall at Woods Hole when I received
    an unexpected call from Stephen Kuffler, who founded the Neurobiology Department
    at Harvard Medical School. Kuffler is a legend in neuroscience, and getting an
    offer to work with him as a postdoctoral fellow in his lab was life changing.
    I moved to Boston after finishing a brief postdoctoral fellowship with Alan Gelperin
    on mapping metabolic activity in the pedal ganglion of the garden slug Limax maximus.15
    I will never be able to eat a snail again without at a synapse in the bullfrog
