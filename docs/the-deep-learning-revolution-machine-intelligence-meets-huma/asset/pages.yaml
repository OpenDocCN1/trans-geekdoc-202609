    Systems (NIPS) Conference, she concluded: “Since experience improves performance,
    this should suggest that people in the lab need to spend more time engaged in
    discriminating sex.” She called her multilayer perceptron the “SEXNET.” In the
    question-and-answer period, someone asked whether SEXNET could be used to detect
    transvestite faces. “Yes,” said Beatrice, to which Ed Posner, the founder of the
    NIPS conferences, retorted, “That would be the DRAGNET.”¹⁰


    Figure 3.6

    What is the sex of this face—male or female? A perceptron was trained to discriminate
    male from female faces. The pixels from the image of a face (top) are multiplied
    by the corresponding weights (bottom), and the sum is compared to a threshold.
    The size of each weight is depicted as the area of the pixel. Positive weights
    (white) are evidence for maleness and negative weights (black) favor femaleness.
    The nose width, the size of the region between the nose and mouth, and image intensity
    around the eye region are important for discriminating males, whereas image intensity
    around the mouth and cheekbone are important for discriminating females. From
