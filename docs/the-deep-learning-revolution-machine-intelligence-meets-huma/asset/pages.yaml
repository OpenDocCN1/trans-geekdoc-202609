    decisions, and taking actions. Reinforcement learning is based on the observation
    that animals solve difficult problems in uncertain conditions by exploring the
    various options in the environment and learning from their outcomes. As learning
    improves, the exploration decreases, eventually leading to pure exploitation of
    the best strategy found during learning.


    Suppose you have to make a series of decisions to reach a goal. If you already
    know all the possible choices and each of their expected future rewards, you can
    use a search algorithm—specifically, Richard Bellman’s algorithm for dynamic programming⁴—to
    figure out the set of choices that maximizes future rewards, but, as the number
    of possible choices grows, the size of the problem grows exponentially, which
    has been called the “curse of dimensionality,” and was illustrated at the beginning
    of this chapter. But, if you don’t have all the information about the outcomes
    of the choices ahead of time, you have to learn to make the best choices you can
    as you go along. This is called “online learning.”


    The online learning algorithm that Richard Sutton (figure 10.3) developed depended
    on differences between expected and received rewards (box 10.1). In temporal difference
    learning, you compare your estimated long-range reward for making a move in a
    current state, with a better estimator based on the actual reward you got, and
    the estimated long-range reward of the next state. By changing the previous estimate
    to be more like the improved estimate, the decisions that you make on moves will
    get better'
