  \ `V`...（此处省略重复内容）\n\n\n\n\n# 附录 C\n\n\n\n\n# 谁是中聪？\n\n比特币的匿名创始人中本中聪（Satoshi Nakamoto）从未公开宣布过他的（或她、或他们，等）真实身份。没有人知道中聪是谁。事实上，我们甚至不知道中聪是一个人还一个群体。\n\
  \n我们从中聪（通常用他的名字称呼他）那里所拥有的只有几百条论坛帖子、公共列表上的几封邮件，以及与其他早期比特币开发者的少量私下交流。但这并没有阻止比特币爱好者试图去弄清他的生活、他的政治和哲学倾向，当然，还有他究竟是谁。\n\
  \n## 时间线\n\n中聪首次出现是在 2008 年的万圣节，当时他在一个侧重于密码学的公共邮件邮邮件列表上发布了比特币白皮书。在整个 2008 年期间，他一直在该邮件列表上进行辩论并完善他的观点，并于\
  \ 2009 年 1 月发布了第一个版本的比特币软件。\n\n下个月，他开始在 `P2P Forum` 上发布关于比特币的内容，那是去中心化技术支持者的避风港。中聪在\
  \ 2009 年和 2010 年期间持续致力于比特币工作，发布了软件的新版本并频繁与论坛和邮件列表上的人们交流。\n\n他最后一次公开交流是在 2010 年 12\
  \ 月，非常简单且不显眼：他宣布对比特币软件进行小版本更新，增加了一些防止拒绝服务（`DoS`）攻击的保护，在这种攻击中，攻击者可以用垃圾信息淹没系统，导致合法用户无法使用。\n\
  \n公众再也没有听到过中聪的消息，但显然中聪又与其他比特币开发者保持了一一年的联系。迈克·希尔恩（Mike Hearn）发布了中聪写给他的最后一封邮件，日期为\
  \ 2011 年 4 月 23 日：“我已经转向了其他事情。它交给了加文·安德斯森（Gavin Andresen，另一位早期比特币开发者）和大家，是很稳妥的。”\n\
  \n中聪与任何人已知的最后一次通信是在 2011 年 4 月 26 日，当时他给安德斯森写了这些话：“我希望不要再把我描述成一个神秘的阴影人物了，媒体只会把这变成一个海盗货币的角度。也许可以把重点放在开源项目上，并给你的开发者贡献者更多荣誉；这有助于激励他们。”\n\
  \n安德斯森回复了那封邮件，说中本受邀在由 `CIA` 举办的活动上演讲，但中聪从未回信。\n\n## 理论与争议\n\n一些阴谋论者认为中聪被提到 `CIA`\
  \ 吓到了，显然为了避免与他们接触而逃离了。\n\n![一个站在商店前的人 - 自动生成的描述](img/image_rsrc7HY.jpg)\n加文·安德斯森，早期比特币开发者，也是已知最后与中聪交流过的最后的人。来源：Web\
  \ Summit\n\n2015 年，在中聪最后一次已知通信的年后，有人使用他的电子邮箱地址发布了关于比特币世界中围绕 `Bitcoin XT` 发生的争议的帖子。`Bitcoin\
  \ XT` 是运行在大多数比特币全节点上的 `Bitcoin Core` 客户端软件的竞争对手。此人声称是中聪，表示他复出是为了警告世界这个“非常危险的分叉”以及“这个假冒者比特币”的开发者。\n\
  \n`Bitcoin XT` 是由迈克·希尔恩创建的，他与中聪有着最后已知通信之一的同一位比特币开发者，也是比特币社区中一个争议人物。大多数专家认为，这封 2015\
  \ 年的邮件并不是由中聪发送的，而是黑了中聪账号的人发送的。\n\n比特币的创造者为什么要隐伏多年，只为了重新出现参与一场最终只是比特币社区内微小争执的辩论——并迅速再次消失？为什么比特币的创造者会隐伏……[原文此处截断]\n\
  \n## 中聪的身份\n\n终极问题是：中聪到底是谁（或曾是谁）？一种领先理论是，中聪是大卫（`Wei Dai`）或尼克·萨博（`Nick Szabo`）的别名，他们是计算机科学家，开发的原型加密货币（分别为\
  \ `B-Money` 和 `Bit Gold`）在比特币之前就已经但从未流行起来。支持萨博的证据相对充分：\n\n\n\n\n\n## Szabo 与 Satoshi\
  \ 的对比\n\n* 一位语言研究人员发现 Szabo 和 Satoshi 的写作风格存在惊人的相似之处，并声称“只有 0.1% 的加密学研究人员能出这种写作风格”。1060\
  \ 这两位作者经常使用如“信任第三方”（trusted third party）、“我们的目的”（for our purposes）和“值得注意的是”（it should\
  \ be noted）等相对罕见的短语。1061\n* 在 Satoshi 宣布比特币之前，Szabo 一一直在寻找 Bit Gold 的合作者；在公告之后，Szabo\
  \ 停止了关于 Bit Gold 的写作。1062\n* Satoshi 引用了 Bit Gold 的许多思想，包括工作量证明、交易时间戳以及消除信任第三方的必要性，1063，但他从未引用过\
  \ Szabo 的作品。1064\n\n我们询问了比特币历史书籍 `Digital Gold` 的作者 Nathaniel Popper，他说他认为 Szabo\
  \ 就是 Satoshi。但所有证据都只是间接的，而且 Szabo 反复否认自己是 Satoshi。1065\n\n## 英国假设\n\n在我们看来，另一个更有信力的理论是\
  \ Satoshi 实际上是英国人，而不是人们通常认为的日本人。iii。首先，他的写作完全是完美的英语。1066。他最初的比特币论文中充满了英式拼写（例如用“favour”而不是“favor”1067），而且他的论坛贴子也充满了英式英语表达（如“bloody\
  \ hard”[意为“该死的非常困难”]1068）。他很少在格林尼治时间午夜到第二天凌晨 6 点之间在论坛上发帖，1069 那段时间是日本的白天，却是英国的深夜。最后，他在创世区块中引用了英国的《时报》（The\
  \ Times）。这确实是间接证据，但伪造自己的作息和母语方言并非易事。这些英国证据让“Szabo 是 Satoshi”的理论不攻自破，因为 Szabo 是美国人。Dai1070\
  \ 也是美国人，Hal Finney 也是 1071，后者是一位计算机科学家，收到了 Satoshi 的第一笔比特币交易，并被广泛传言就是 Satoshi 本人。1072。Satoshi\
  \ 关联密切的唯一一位著名英国人是 Adam Back，他是 `Hashcash` 的发明者，这是比特币所使用的工作量证明算法。1073。Back 说他是 Satoshi\
  \ 第一个告诉他关于比特币的人，但他否认自己是 Satoshi。1074\n\n## Craig Wright 的主张\n\n另一个常见但广受怀疑的说法是澳大利亚计算机科学家兼商人\
  \ Craig Wright 就是 Satoshi。1075。在的一篇 `Medium` 文章中，Wright 写道：`比特币的开始是因为我的想法。它是我的设计，也是我的创造。而且，确保它不被犯罪分子颠覆过去和现在都是我的职责。我曾是\
  \ Satoshi。`1076。许多媒体机构最初相信了他，1077，但很快就证明 Wright 是一个骗子。他用来证明自己是 Satoshi 的加密密钥是伪造的，他的学历（包括\
  \ `PhD`）是伪造的，关于他公司的细节也是假的。甚至他在白皮书发布几天后关于比特币的一些博客文章也是假的；他在 2013 年后修改了文章并加入了比特币的内容。1078\n\
  \n## John McAfee 的主张\n\n更奇特的说法\n\n尽管有这些理论，但还没有人确凿证明自己是 Satoshi。关于 Satoshi 身份的不透明导致了关于他的荒诞说法。疯狂的安全专家\
  \ John McAfee（`McAfee` 防病毒软件的发明者）声称他见过 Satoshi 并威胁要揭露他，但很快取消了计划；大多数人认为他只是在吹牛。1080，计划雇数百名戴着他脸具口罩的人为他的\
  \ 2020 年总统竞选助选，因为他正在躲避 `IRS`1082，并声称即使洗澡时也拿着枪。1083 疯狂的富翁 John McAfee，声称他能揭开 Satoshi\
  \ 的面纱。来源：维基百科 1084 更荒诞的说法来自一个自称是 Satoshi 的巴基斯坦人。1085 他说比特币的名字来自“国际信贷商业银行”（Bank of\
  \ Credit and Commerce International），1086，这是一家巴基斯坦银行曾被《时代》杂志称为“罪犯和间谍的金融超市”，并被誉为史上最肮脏的银行。1087（该领域的竞争相当激烈。）\
  \ 术语表\n\n区块链和加密货币的世界充满了令人眼花缭乱的术语。我们在《泡沫》或《革命》中涵盖了大部分内容，但在这里汇总一些关键的加密术语，其中包括一些在书正文中没有机会深入讨论的词。此外，我们还将对知名且最重要的加密货币进行概述。\n\
  \n\n\n\n\n# 术语\n\n在本节中，我们将介绍你在阅读有关区块链和加密货币的内容时会听到常用术语和关键概念。\n\n### 51% 攻击 (51% attack)\n\
  当一个矿工或矿工小组控制的算力超过了特定加密货币所有其他矿工总和时，就会发生这种情况。（换句话说，该矿工或小组控制了网络至少 `51%` 的总算力。）在 `51%`\
  \ 攻击中，主导矿工或小组可以随心所欲地重写区块链，允许给自己发放无限量的资金、取消过去的交易等。\n\n### 地址 (Address)\n加密货币用户的公共伪名。向某人发送代币时你需要知道对方的地址。\n\
  \n### AML\n反洗钱（Anti-money laundering）。指针对加密货币交易所的法律法规，防止人们利用这些交易所进行洗钱。另请参见 `KYC`。\n\
  \n### 存档节点 (Archival node)\n全节点的一种，不仅包含整个区块链，还包含加密货币的历史快照，例如每个地址在任何时间点拥有多少硬币。\n\n\
  全节点是存档节点的压缩版本；所有信息仍然存在，但除非将全节点扩展为存档节点，否则很难进行高级计算和查询。\n\n### ASIC\n一种特种计算机芯片，针对运行特定的挖矿算法进行了高度优化。严肃的比特币矿工需要使用\
  \ `ASICs`，因为通用计算机（如 `MacBook`）的优化程度不足，无法快速运行挖矿算法。全称“应用专用集成电路”。\n\n### 抗 ASIC (ASIC-resistance)\n\
  挖矿算法的一种特征（如以太坊），它使得 `ASICs` 较于通用计算机没有优势。普通的挖矿算法让矿工反复执行完全相同的计算；然后矿工们就会制造极度擅长这种计算的\
  \ `ASICs`。但抗 ASIC 挖矿算法让矿工执行各种不同的计算，因此用于处理各种计算的通用计算机性能得优于任何专用芯片。正如以太坊所说：“一个以太坊 ASIC\
  \ 本质上是一个用于通用计算的 ASIC——即一个更好的 CPU。”`ASIC-resistance` 是理想的，因为它让个人和爱好者能够更容易参与挖矿。\n\n\
  ### 资产 (Asset)\n任何具有经济价值的资源。有很多金融资产：美元、股票、加密货币、债券等。但许多其他东西也是资产：汽车、书籍、房产证、知识产权、商标等。区块链提供了一种去中心化的方式来追踪任何资产的移动。\n\
  \n### Base-58\n比特币地址使用的格式。它包含大写字母、小写字母和数字，但删除了容易产生误解的字符 0、大写 `I`、大写 `O` 和小写 `l`。\n\
  \n### 币 (Binance)\n一家流行的加密货币交易所。\n\n### bitcoin (小写)\n指比特币货币的单位。例如，“她的财富包括几十个 bitcoins。”与之对比的是“我的朋友投资了比特币。”\n\
  \n### 比特币核心 (Bitcoin Core)\n比特币软件的官方版本。它包含一个钱包、全节点软件和一个交易验证引擎。\n\n### 比特币的扩展性问题\
  \ (Bitcoin’s scaling problem)\n一个众周知的问题，比特币每秒只能支持 7 笔交易，而像 `Visa` 等主流支付系统可以支持数万次。当比特币用户想要每秒进行超过\
  \ 7 次交易时，就会发生拥堵；这导致了长时间的等待和高昂的手费。\n\n### Bitfinex\n一家流行的加密货币交易所。\n\n### 区块 (Block)\n\
  加密货币交易的组合。矿工竞争创建区块；获胜的矿工可以将该区块添加到区块链的末尾，并获得几个币作为奖励。\n\n### 区块链 (Blockchain)\n一种去中心化的账本，存储了过去交易的不变历史。加密货币都是围绕区块链构建的，但你可以在区块链上追踪任何数字或物理资产的移动。“将某物放在区块链上”意味着使用区块链来追踪它的移动。\n\
  \n### 区块浏览器 (Block explorer)\n一种让你查看区块链上关于区块、地址和交易信息的工具。值得注意的是，如果你知道某人的地址，区块浏览器可以让你看到其过去的交易、交易伙伴和当前余额。\n\
  \n### 区块高度 (Block height)\n区块链中区块的总数。\n\n### 区块奖励 (Block reward)\n矿工成功挖出一个区块后获得的加密货币数量。在包括比特币在内的几种加密货币中，区块奖励每隔几年就会减半一次。\n\
  \n### 区块大小 (Block size)\n区块的最大文件大小（例如 1 兆字节），它决定了一个区块可以容纳多少交易。由于区块是以固定的间隔被挖出的，区块大小是决定该加密货币每秒支持交易数的因素之一。\n\
  \n### 区块时间 (Block time)\n挖掘每个区块所需的时间。例如在比特币中，平均每 10 分钟挖出一个区块。\n\n### 泡泡沫 (Bubble)\n\
  当资产价格（加密货币、郁金香、房子等）涨到其真实价值之上。泡泡沫通常发生在投机行为失控时，人们不断以过高的价格购买该资产，希望价格会继续上涨。当投机周期中断时，泡沫就会不可避免地破灭。\n\
  \n### 中心化 (Centralization)\n当网络中的一切都通过一个单一实体流动时。例如，在 `Walmart` 购物是中心化的；货物从制造商流向沃尔玛，然后从沃尔玛流向消费者。与之对比的是农贸市场，货物直接从农民那里流向消费者。因此，在农贸市场购物是去中心化的。\n\
  \n### 客户端-服务器模型 (Client-server model)\n一种建立计算机网络的中心化方式，每个人都与一个中央权威（服务器）通信。Twitter\
  \ 使用客户端-服务器模型：Twitter 用户（客户端）向 Twitter（服务器）发送消息，并从 Twitter 获取消息。类比，这就像通过邮政寄信（邮政系统是服务器），而不是手交（没有中心权威）。另请参见\
  \ `peer-to-peer`。\n\n### 币 (Coinbase)\n一家流行的加密货币交易所。\n\n### 币 (CoinHive)\n一个臭名昭著的初创公司，向黑客提供挖矿代码。该代码让受害的计算机为黑客挖掘\
  \ Monero，直到它在 2019 年崩溃。\n\n### 冷存储 (Cold storage)\n将私钥存储在不连接互联网的设备中。在便利贴上写下私钥、保存在不连接互联网的计算机上或使用硬件钱包都是冷存储的形式。通过这种方式，即使黑客控制了你的设备，也无法获取你的私钥。\n\
  \n### 处理器 (CPU)\n数字设备的处理单元，负责设备的大部分计算，从在 `Excel` 中处理数字到在 `Netflix` 上播放电影。每个计算机都有\
  \ `CPUs`，且 `CPUs` 可以挖掘加密货币，但它们对初学者来说非常友好。另请参见 `GPU` 和 `ASIC`。\n\n### 众筹 (Crowdfunding)\n\
  从许多小捐赠者处为创业项目筹集资金。`ICOs` 是众筹的一种形式。\n\n### 加密 (Crypto)\n区块链和加密货币领域的统术语。\n\n### 加密币\
  \ (Cryptocoin)\n加密货币的单位，例如 `bitcoin` 或 `ether`。通常是小写。与加密货币本身不要混淆。\n\n### 加密货币 (Cryptocurrency)\n\
  一种使用区块链来追踪交易的数字货币。加密货币使用加密来验证交易并防止篡改和伪造。它是很难逆的。\n\n### 加密学 (Cryptography)\n一种以难以还原的方法编码信息的科学。在加密货币中，加密用于证明身份、防止交易被篡改、使挖掘困难以及其他关键功能。\n\
  \n### 挖矿攻击 (Cryptojacking)\n未经授权使用设备为他人挖掘加密货币。这通常发生在黑客在网站上安装代码时；如果你访问网站，你的浏览器将运行该代码并为黑客挖掘加密货币（通常是\
  \ Monero）。\n\n### 组织 (DAO)\n去中心化自治组织；指的是一个完全依靠智能合约运行且没有领导或控制的服务或公司。想象有一队自动驾驶汽车，这些机器人由智能合约决定接哪些乘客以及何时去加油站——或者想象一个公司，其决策由员工投票产生（决策将由于智能合约自动生效）。\n\
  \n### 应用 (DApp)\n去中心化应用；一个用智能合约构建的应用。与 `Airbnb`、`Facebook` 和 `Uber` 等传统中心化应用相比，`Apps`\
  \ 更具弹性（如果制作它的公司倒闭，它们也不会失败）且更加透明（决策完全由机器做出）。\n\n### 去中心化 (Decentralization)\n网络不受单一实体控制。如果在\
  \ `Walmart` 购物是中心化的，那么在农贸市场购物就是去中心化的：货物直接从农民流向消费者，而不是通过沃尔玛。加密货币是去中心化的，因为（理想情况下）全球范围内很多人追踪过去的交易并验证新的交易；没有任何实体可以控制一切。\n\
  \n### 通缩 (Deflation)\n货币供应量的增长小于生产和和服务总价值的增长（经济学术语为 GDP）。换句话说，当通胀为负且价格水平下降时。通缩使每个美元或硬币更值；这鼓励人们囤积资金而不是消费或投资，这往往会抑制经济增长。\n\
  \n### 数字签名 (Digital signature)\n一种用于验证数字消息（如区块链交易）真实性的方法。当你进行区块链交易（如发送加密货币）时，你使用你的私钥对交易末尾的小标签进行加密；任何人都可以检查该标签以确保确实是你发送的。另也称为签名（signature）。\n\
  \n### 分布式账本 (Distributed ledger)\n一种记录过去交易的数据结构，不受任何单一实体控制。任何人都可以存储账本的副本并在获得批准后添加自己的条目。区块链是最著名的分布式账本。另也称为去中心化账本或共享账本。\n\
  \n### 技术 (DLT)\n去中心化账本技术。任何在共享、分布式、不可变账本中存储数据的统称；这包括区块链和受区块链启发的替代方案，如 `tangle`。\n\
  \n### 双花费 (Double-spending)\n资金被花费两次的风险；数字货币最大的缺陷。例如，Word 文档是很糟糕的货币，因为任何人都可以无限复制。区块链通过追踪资金的每一次交交来防止这个问题，使其很容易发现有人尝试双花费。因此，加密货币避免了这个问题（除非它们遭受了\
  \ `51% 攻击`）。\n\n### ERC-20\n最流行的以太坊令牌类型。`ERC-20` 令牌遵循一组为人知的规则，对用户来说更具预测性，对开发者来说更容易构建。许多加密货币（包括\
  \ `MKR` 和基础注意力令牌 `BAT`）实际上实现为 `ERC-20` 令牌，这意味着它们运行在区块链之上。\n\n### 托管 (Escrow)\n当双方进行交易时临时存放资金的地方。发送方将资金存入\
  \ `托管`，只有在接收方满足要求时才会释放。例如，如果你在网上订购东西，你的钱可能会被发送到 `托管`，此时资金将释放给卖家。智能合约和 `DApps` 经常依赖于\
  \ `托管`。\n\n### 基金 (ETF)\n交易所交易基金。一种追踪一种或更多股票价格的资产。例如，`S&P 500` 是追踪标普 500 指数价格的。`S&P\
  \ 500` 波动性较小且消除了设置的麻烦。\n\n### 以太币 (Ether)\n用于以太坊的货币单位。缩写为 `ETH`。\n\n### 虚拟机 (EVM)\n\
  以太坊虚拟机。运行智能合约背后的代码。每个计算机都有 `EVM`，因为它们需要执行智能合约。\n\n### 交易所 (Exchange)\n允许你交换法币与加密货币的网站。你也可以在网上交换加密货币。另也称为加密货币（exchange）。\n\
  \n### 法币 (Fiat)\n由信誉支持的货币，如美元等。通常与加密货币进行对比。\n\n### 分叉 (Fork)\n作为动词，是指创建一个新分支；作为名词，是指这些分支中的一个。类比，想象两个作者写了第一部小说，然后分叉并写了第四部和第五部。\n\
  \n### 全节点 (Full node)\n一个下载整个区块链的节点。加密货币需要 `full nodes` 来保持去中心化——如果只有一个节点，那就是中心化的。轻量节点不下载整个区块链，相反，它使用\
  \ `SPV` 询问全节点来检查交易是否有效。\n\n### 算力 (Hash rate)\n矿工生成哈希的速度。每个哈希都给矿工一个被选中挖掘下一个区块的小概率机会，因此拥有\
  \ `hash rates` 的矿工挖矿机会更高。比特币网络的 `hash rate` 是所有矿工算力的总和。\n\n### 拿住 (HODL)\n一种俚语，指无论市场变得多糟糕，都不理智地持有加密货币。这个词源于某人在论坛上误拼写了“hold（持有）”，但现在有些人幽默地说它是“hold\
  \ for life（终身持有）”的缩写。另也称为算力（hash power）。\n\n### 热存储 (Hot storage)\n将你的私钥存储在连接互联网的设备上，如你的手机或笔记本电脑。这比冷存储更方便发送资金——你可以自动填充密钥，而不是手动输入——但风险更大，因为控制你设备的黑客可以轻松夺取你的密钥。\n\
  \n### 霍威测试 (Howey test)\n`SEC`（证券交易委员会）用于判断资产是否为证券的测试。它规定，如果一个人将资金投入一项共同事业，并被引导预期仅从该事业中获得利润，那么该资产就是证券。\n\
  \n### 代币发行 (ICO)\n首次代币发行。一种不受监管的加密货币发行方式。`STOs` 是加密货币的替代方案，是受监管的。\n\n### 不变性 (Immutability)\n\
  无法更改的能力。区块链的一个优点是它们实际上是不可变的：除非发生 `51% 攻击`，否则无法更改或删除过去的交易。\n\n### 通胀 (Inflation)\n\
  货币供应量的增长大于生产和服务总价值的增长（经济学术语为 GDP）。换句话说，当通胀为负且价格水平下降时。通缩使每个美元或硬币更值；这鼓励人们囤积资金而不是消费或投资，这往往会抑制经济增长。\n\
  \n### 主网 (Mainnet)\n发生真实货币交易的官方公共区块链。与 `testnet`（测试网）对比。\n\n### 测试网 (Testnet)\n\
  开发者可以用来模拟区块链的测试环境。测试网上的加密货币或代币不是真实的。\n\n### 燃料 (Gas)\n运行智能合约所需的计算量衡量。当你使用智能合约时，你为每单位\
  \ `gas` 支付小额费用。更大、复杂的合约需要更多 `gas`。\n\n### 创世区块 (Genesis block)\n区块链中的第一个区块，包含了比特币发明者中本丰留下的加密信息。\n\
  \n### 半减 (Halving)\n加密货币的区块奖励每隔几年就会减半一次。由于 `halving`，区块奖励减慢并最终停止。\n\n### 图形处理器 (GPU)\n\
  图形处理器，一种用于在屏幕上绘制图像的特种芯片。计算机图形需要大量的计算，所以 `GPUs` 非常擅长这些操作——优于 `CPUs` 但弱于 `ASICs`。\n\
  \n### 硬分叉 (Hard fork)\n对加密货币的一种向后兼容的激进更改。运行旧软件的节点不会接受新软件的区块，因此区块链永久地分裂：一个由旧软件使用，一个由新软件使用。\n\
  \n### 硬件钱包 (Hardware wallet)\n一种存储私钥并让你在不将私钥放在电脑的情况下授权加密货币交易的设备。通过这种方式，即使黑客看到了你电脑上的一切，也无法获取你的私钥。冷存储的一种。另也参见纸钱包（paper\
