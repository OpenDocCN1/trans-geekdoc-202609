  \ 年，一个攻击者——无论是黑客还是一个违规员工——复制了名为 `wallet.dat` 的文件。在接下来的几年里，拥有了 Mt. Gox 私钥的攻击者缓慢地掏空了\
  \ Mt. Gox 的钱包。Mt. Gox 完全没有意识到这起盗窃。事实上，他们认为从 Mt. Gox 提取的资金是安全的，因为是加密的。\n\n（注：由于原文中存在大量重复段落，译文已根据“不要重复输出原文”的原则进行了去重处理和整合翻译。）\n\
  \n\n\n\n\n# 第 4 章 替代币\n\n虽然`cryptocurrencies` 可能会带来执法和监管方面的风险，但它们在某些领域也可能具有长期前景，特别是当这些创新促进更快速、更安全且更高效的支付系统时。\
  \ — 本恩·伯南基，前联邦储备委员会主席\n\n比特币并非市场上唯一的加密货币。市场上超过 2000 种竞争性的加密货币，被称为替代币（altcoins），每种货币都有自己的特性、挖矿算法以及（在某些情况下）不同的区块链。有些专门用于特定类型的支付，另一些旨在为应用程序构建平台，还有一些则只是寻求改进比特币的缺陷。随着时间的推移，替代币的规模变得越来越大——2015\
  \ 年比特币控制着 90% 的加密货币市场，但在本文写作时这一比例仅略高于 60%。\n\n## 比特币的分叉\n\n2016 年，早期的比特币开发者、前谷歌工程师迈克·希恩（Mike\
  \ Hearn）称比特币是一个失败的实验，并列举了它的许多缺陷：\n\n- 容量低：每秒约 3 次交易。\n- 费用和等待时间具有高度不可预测性，尤其是在需求旺盛时期。\n\
  - 权力高度集中在少数（主要是中国）矿工手中，在希恩看来，这些矿工拒绝进行任何会让比特币更流行的更改，因为那会侵蚀他们的挖矿利润。\n- 社区无法对任何事情达成共识——包括增加区块大小的流行提案，或者区块中可以容纳的交易数量。这本可以让比特币每秒处理更多的支付，同时更低的费用和更短的等待时间。\n\
  - 比特币社区就增加区块大小的提案爆发了“内战”，导致官方比特币 Reddit 子版块、论坛和网站对对立观点进行了广泛的审查。\n\n\n\n\nHearn 沉思道：“你会在意一个有[这些缺陷]的支付网络吗？我胆敢猜测，答案是否定的。”[413\
  \ ![一组坐在桌旁的人  自动生成的描述](img/image_rsrc7H0.jpg) \n\n为了展示比特币已经变得多么中心化，Hearn 分享了一个难忘的故事：在比特币会议上坐在舞台上的这几个人控制了全球\
  \ 90% 的比特币哈算力。[414 来源：Jameson Lopp415 比特币\n\nHearn 认为，由于社区的职能障碍以及少数几个强者对货币未来的控制，这些缺陷是无法修复的。因此，他决定采取核选项方案，在\
  \ 2017 年对比特币进行硬分叉，将该货币一分为两部分。[416\n\n## 加密货币硬分叉\n\n对加密货币进行硬分叉就像决定你不喜欢最后三部哈利·波特书，并编写了你自己的版本。你的哈利·波特系列与\
  \ J.K. 罗林的官方系列将共享前四本书，因此它们将拥有相同的背景、主要角色和情节核心。但从第四本书开始，这两个系列将分道扬扬，在剩下的三书中各自引入自己的角色和故线。\n\
  \n当 Hearn 对比特币进行硬分叉时，他做了非常相似的事情。他的新加密货币被称为比特币现金（Bitcoin Cash），它共享比特币 2017 年之前的区块链，因此所有过去的比特币交易——包括中本聪的创世区块和\
  \ Hanyecz 的披萨购买——也是比特币现金官方历史的一部分。但所有分叉后挖出的比特币区块都将不再是比特币现金区块链的一部分，而所有分叉后挖出的比特币现金区块也将不再是主比特币区块链的一部分。[417\n\
  \n由于 Hearn 对比特币无法扩展感到沮丧，比特币现金将区块大小扩大了八倍，并留有了随着时间推移进一步增加的选项。结果，比特币现金更大的区块将被主比特币软件拒绝，而比特币现金将拒绝较小的比特币区块，导致两条区块链互不兼容。[418\
  \ (这种不不兼容的更改被称为硬分叉，而向后兼容的更改被称为软分叉。419)\n\n然而，比特币的许多关键部分在比特币现金中保持不变。例如，两种货币都有逐渐减少的区块奖励[420，这将导致挖出的币总量不会超过\
  \ 2100 万个币。[421 Hearn 保留了他认为有用的特征，并丢弃他不喜欢的特征；这种灵活性使得硬分叉对有强烈见解的加密货币领袖具有吸引力。\n\n分叉一发生，所有比特币用户都拥有相同数量的比特币（简称\
  \ BTC）和比特币现金币（简称 BCH）。因此，任何钱包软件支持比特币现金的用户都可以免费双倍他们的代币，[422 尽管（可能由于如此）每个 BCH 的价值一直只处于\
  \ 0.03 到 0.25 BTC 之间。[423\n\n因此，比特币“内战”的结果是比特币的破裂，渴望改变的人走向了 BCH，而倾向于现状的人则留在了 BTC。比特币和比特币现金的区块链、软件、社区、开发者和路线图现在都完全不同了。\n\
  \n谁“赢了”？你可以说 BCH 赢了，因为它赢得了“独立”并分走了一些比特币支持者。但写作时，BCH 的市值[ll —— 所有流通代币的总价值，是衡量加密货币成功的流行指标——仅为当时\
  \ BTC 的 5%。[424\n\n## 分叉之分叉\n\n有趣的是，2018 年比特币现金本身也发生了硬分叉。一个由争议性人物 Craig Wright 领导的一个小规模开发者团队（Craig\
  \ Wright 声称他自己就是中本聪[mm)）对比特币现金进行了硬分叉，创建了比特币 SV（为了“中本聪的愿景”）。Wright 认为比特币现金偏离中本聪对比特币的原始愿景太远，因此比特币\
  \ SV 更接近中本聪在他宣布比特币的开创性白书中提出的货币。425\n\n很少有矿工从比特币现金（由于某种令人困惑的原因被称为比特币 ABC）叛变，也很少有交易所开始出售比特币\
  \ SV。426 因此，比特币 SV 通常被认为是这场微型战争的输者，[427 但加密货币世界的迷之处在于，任何货币无论多不受欢迎，仍然存在。\n\n剧情在 2020\
  \ 年 2 月变得更加复杂，当时比特币 SV 发生了硬分叉以实施一项名为 Genesis 的升级，纯洁者说这会让比特币 SV 更加接近中本聪在其论文中所述的内容。对于比特币\
  \ SV 来说，幸运的是，几乎所有的矿工都支持这次升级，因此没有人将旧版本的比特币 SV 变成新货币。[428\n\n结论是，加密货币空间是混乱、动态且充满健康竞争的。在我们看来，“分叉性”是加密货币最好的特性之一，加密货币的发展是公开的，代码和辩论都在进行。[429\
  \ 与此同时，你可以分叉出亚马逊或 Uber 这样流行的产品，保留某些代码，但丢弃你不喜欢的功能。你甚至看不到背后的代码。\n\n## 以太坊\n\n然而，世界上著名的山寨币与比特币或其内战关系不大。它被称为以太坊，并将加密货币视为不仅仅是支付工具或投资工具。以太坊最早在\
  \ 2013 年由俄罗斯裔加拿大科学家 Vitalik Buterin 描述，当时他只有 19 岁。430 Buterin 的核心想法是区块链不仅仅是记录交易：它们可以运行代码、托管应用程序、存储数据并进行任何形式的计算。\n\
  \n### 智能合约\n\n以太坊引入了智能合约的概念，即运行在区块链上的微型应用程序，被称为去中心化应用或 DApps（与 maps 押韵）。[444 智能合约可以遵循规则并移动资金和其他资产。它们像人一样拥有地址，你可以发送指令让它们行动。通过这种方式，它们就像自动贩卖机：投入资金，获得预测的结果。\n\
  \n以赌博为例。想象如果你制作了一个 DApp 版的 YouTube。你可以有一个智能合约从广告商处收集资金并将广告位拍卖给出价最高者，一个根据观看量向视频创作者付费的智能合约，一个标记侵权视频的智能合约等等。因为这个\
  \ DApp 只是一群相互通信的自主智能合约，它将像时钟一样运行，没有任何人工干预。超级碗结束后，智能合约将检查 ESPN 以看看哪个团队赢了；获胜的团队将获得金额的资金，失败者一无所有，而智能合约将留下几美元作为利润。\n\
  \n或者想象一个保险智能合约。佛罗里达的一个农民可能与保险代理同意，如果发生了霜冻作物，代理将向农民支付 1000 美元；如果没有，代理将向农民支付 1000\
  \ 美元。农民将向合约发送 100 `ether`（以太坊中使用的货币），在整个冬天，智能合约将检查天气预报的报告。如果它检测到温度低于 32 华氏度，它将向农民支付全部\
  \ 1000 美元；如果冬季过去且从未达到冰点温度，智能合约将向保险代理支付全部 1000 美元。\n\n这类智能合约的卓越之处在于它们将始终按照预期运行——一旦启动，人类就无法干扰其行为。此外，许多智能合约是开源的，这意味着任何人都可以看到它们运行的代码。因此，智能合约就像自动贩卖机：你不仅知道将得到什么，而且机器是如何发放的。如果你使用智能合约，就不需要信任任何人类或声名狼藉的博彩者或政策混乱的贪婪保险公司。这把比特币“消除中间人”的思想更进一步了。\n\
  \n### DApps\n\n你可以将智能合约打包在一起，创建更复杂的基于以太坊的应用，被称为去中心化应用或 DApps（与 maps 押韵）。想象如果你制作了一个\
  \ DApp 版的 YouTube。你可以有一个智能合约从广告商处收集资金并将广告位拍卖给出价最高者，一个根据观看量向视频创作者付费的智能合约，一个标记侵权视频的智能合约等等。因为这个\
  \ DApp 只是一群相互通信的自主智能合约，它将像时钟一样运行，没有任何人工干预。把它想象成一个巨大的贩卖机。你可以重现 YouTube 的大部分功能——但没有\
  \ YouTube 公司。通过消除 YouTube，这个 DApp 可以移除那些经常困扰小型创作者并威胁他们业务的频繁政策变更。\n\n同样，你可以创建一个去中心化应用商店，使用智能合约来跟踪评论和评分，允许开发者上传新应用，从广告商处收集付款并将其应用放在排名顶端，让用户为应用付费。这个应用商店也将自主运行。它将消除通常运行应用商店的公司，这些公司经常引入对用户和开发者产生敌意的新政策，例如苹果从\
  \ App Store 禁用某些广告拦截器，或开始抽取所有应用内购买的 30% 分成，许多开发者指责这不公平。当然，消除中间人并不总是好事。YouTube、Facebook\
  \ 等平台确实发挥了作用，阻止虚假新闻、诈骗产品、残忍行为和儿童色情进入平台。\n\n## DAO\n\nDAO 并不全是乐趣和猫猫；它也有自己的争议。这些争议围绕着\
  \ DAO（代表去中心化自治组织）展开，这是一种 2016 年 4 月推出的某种风险基金。\n\n## 门罗币\n\n正如我们提到的，比特币并不是真正的匿名。每一笔付款都公开且永久地存储在区块链上，因此任何人都可以看到富人的程度、谁在和谁做生意，以及资金流向哪里。如果你能将某人与其地址匹配，你就可以看到他们的整个支付历史。这种情况下，它比信用卡更不隐私，因为至少信用卡上的信息是隐藏的。普通人可能无法将你与地址匹配，但你使用的加密货币可以，因此任何政府都可以进行控制。2017\
  \ 年，美国国税局（IRS）强制 Coinbase 交出购买或出售大量比特币的人名和地址。有了这些信息，IRS 就可以识别并追缴逃税者。（这也许是好事，但令人担忧的是政府可以轻易破坏“匿名性”）。比特币生态系统创建了一些隐私保护措施，鼓励人们使用新地址，并将你的币与其他币混合，从而无法知道你的币来自哪里。然而，这些措施都是治标性的，被称为“创可贴”。\n\
  \n## 币安链\n\nBinance Chain 是去中心化交易所（与中心化交易所相反）的基础。币安链还允许加密货币创建并发行自己的货币。猜猜哪种加密货币可以在\
  \ DEX 上购买较小的加密货币？你对了：`BNB`。\n\n币安链成立于 2017 年，迅速成为世界上最流行的交易所之一，每天处理数十亿交易。它的增长由强大的推荐计划驱动，为在平台上交易的用户提供巨额奖励。币安还运行着一种名为\
  \ Launchpad 的项目，让加密货币通过出售其独特的加密货币来筹集资金；`BNB` 是唯一接受的支付形式。\n\n## 稳定币\n\n 寻求稳定\n\n\
  正如我们之前看到的，阻止比特币成为可行支付系统的三大问题是费用、等待时间和波动性。前两者可以通过各种升级轻松解决——`SegWit` 和 `Lightning`——或者通过更改挖矿规则。比特币现金通过增加区块大小来实现这一点。另一个名为\
  \ `LTC` 的山寨币提供了比特币非常相似的功能，但交易速度更快（区块只需 2.5 分钟即可挖矿，而不是 10 分钟），费用更低（大约低了 20 倍）。所以费用和等待时间是可解决的问题。波动性是更根本的问题：稳定与增长之间存在权衡，只要加密货币专注于增长，它们就没有稳定性。如果没有稳定性，你将面临剧烈的价格波动——记得的价格可以在单日内飙升或暴跌\
  \ 10%。在这种波动下，人们将犹豫是否使用这些币支付或获取；如果你付了 100 美元买某东西，后来发现你可以等待并获得 110 美元；如果你赚了 100 美元却看到其价值在一天内消失了\
  \ 10%，你会感到糟糕。\n\n与此同时，稳定币明确专注于稳定性。这些币与美元或欧元等法币保持固定汇率。最广知的稳定币被称为 Tether：每个 Tether\
  \ 币（被称为 USDT，即美元比特）始终以 1 美元交易。还有日元、欧元和人民币的 Tether 版本。在经济学术语中，维持这样的固定汇率被称为“锚定”（peg）。许多寻求经济稳定的政府将他们的货币锚定在更大、更成熟的货币上，保持其货币与更大货币之间的恒定汇率。例如，0.709\
  \ 约旦纳尔总是等于 1 美元，1.6 尼泊尔卢比总是等于 1 印度卢比。锚定通过提供一种简单的交易来实现：中央银行（或 Tether）创建一个货币委员会，这是一种任何人都可以访问并在预定汇率交换货币的柜台。例如，尼泊尔有一个货币委员会，允许任何人买卖\
  \ 1 印度卢比以换取 1.6 尼泊尔卢比。在 Tether 的情况下，任何人都可以随时将 1 USDT 换为 1 美元。提供这种交易确保了市场汇率保持固定。如果\
  \ USDT 的价格升到 1.01，人们将从 Tether 的货币委员会以 1 美元的价格购买 USDT 并在市场上以每个币 1 美元出售，直到需求驱动的价格上涨到\
  \ 1。如果 USDT 的价格跌到 0.99，人们将从市场上购买大量 USDT 并卖给 Tether 的货币委员会以每个币 1 美元的价格，直到抛售导致的价格跌回\
  \ 1 美元。锚定的挑战在于，提供锚定的货币委员会必须持有足够的大国货币（被称为参考货币）。尼泊尔必须在银行中存有卢比，以确保人们始终能够将尼泊尔比换成卢比；如果银行用完卢比，锚定将会崩溃。同样，Tether\
  \ 必须在其金库中存足够的美元。多年来，Tether 承诺为每个流通的 USDT 留存 1 美元。通过这种被称为“100% 支撑锚定”的方法，Tether 确保了它始终能够兑现汇率——即使\
  \ USDT 持有者卖回币（这种情况的可能性很低，但如果锚定崩溃，对持有者将是毁灭性的）。2018 年左右，分析师开始怀疑 Tether 并不是真的由美元支撑，这意味着每个流通的\
  \ USDT 并没有真正拥有 1 美元。为了缓解这些恐惧，Tether 宣布其由现金支撑的。2019 年，Tether 更改了其网站，声称 USDT 是由现金、等价物等模糊定义的类别支撑的。再次，依赖“储备金”并不能让其变得稳定。这指向了货币的另一个根本问题：稳定性是由私有行为决定的，而不是民主决定的。这与区块链和加密货币的精神背道而驰。\n\
  \n## Dai\n\n然而，有一种去中心化的替代方案：Dai，一种由 MakerDAO 制作的稳定币。你可以通过智能合约创建一个抵押债务仓位（CDP），使用以太获取\
  \ Dai。为了取回你的币，你向智能合约返回币加上少量费用。换句话说，你使用以太作为抵押获取 Dai。为了让 Dai 的价值保持在 1 美元，这套系统——被称为目标率反馈机制——在\
  \ Dai 的价格过高时减少所需的抵押品，并在价格过低时增加所需的抵押品。所以如果 Dai 的价格增长到 1.05，人们会廉价创建大量 Dai 充斥市场，从而使价格下降。如果\
  \ Dai 的价格缩小到 0.95，人们将兑回 Dai 以获得抵押，减少 Dai 的供应，从而使价格回升。\n\n![image_rsrcH7.jpg)解释 Dai\
  \ 目标率反馈机制的图表，旨在自动稳定 Dai 的价格。来源： Shekhar\n\n## Brave & BAT\n\n以太坊的 ERC-20 Token 非常强大。你可以将智能合约打包在一起，创建更复杂的基于以太坊的应用，被称为去中心化应用或\
  \ DApps（与 maps 押韵）。想象如果你制作了一个 DApp 版的 YouTube。你可以有一个智能合约从广告商处收集资金并将广告位拍卖给出价最高者，一个根据观看量向视频创作者付费的智能合约，一个标记侵权视频的智能合约等等。因为这个\
  \ DApp 只是一群相互通信的自主智能合约，它将像时钟一样运行，没有任何人工干预。把它想象成一个巨大的贩卖机。你可以重现 YouTube 的大部分功能——但没有\
  \ YouTube 公司。通过消除 YouTube，这个 DApp 可以移除那些经常困扰小型创作者并威胁他们业务的频繁政策变更。\n\n同样，你可以创建一个去中心化应用商店，使用智能合约来跟踪评论和评分，允许开发者上传新应用，从广告商处收集付款并将其应用放在排名顶端，让用户为应用付费。这个应用商店也将自主运行。它将消除通常运行应用商店的公司，这些公司经常引入对用户和开发者产生敌意的新政策，例如苹果从\
  \ App Store 禁用某些广告拦截器，或开始抽取所有应用内购买的 30% 分成，许多开发者指责这不公平。当然，消除中间人并不总是好事。YouTube、Facebook\
  \ 等平台确实发挥了作用，阻止虚假新闻、诈骗产品、残忍行为和儿童色情进入平台。\n\n## Cryptoitties\n\n如果我们忽略第一个登上头条的以太坊\
  \ DApp，可能史上最流行的 DApp：一个名为 Cryptoitties 的虚拟猫咪繁殖游戏。463\n\n在 Cryptoitties 上，你可以用以太买卖猫，并可以让你的两只猫交配产生出一只继承了父母某些特征的幼猫。Cryptoitties\
  \ 在 2017 年变得异常受欢迎；一次，15% 的所有以太坊交易都是 Cryptoitties 的智能合约。465\n\n事实上，这个游戏变得如此受欢迎，以至于阻塞了以太坊网络，减慢了其他支付。一次，有\
  \ 30,000 笔以太坊交易因为 Cryptoitties 而等待处理。467\n\n![image_rsrc7H2.jpg)\n出售中的 Cryptoitties。在截图时，0.01\
  \ 以太大约是 2.50 美元，所以这些猫的价格在 15 到 100 美元之间。来源：Greg McMullen\n\n还有一个围绕 Cryptoitties\
  \ 的稳健经济体，粉丝们写了各种指南说明如何优化繁殖并赚钱。（显然，这种策略就像收藏棒球星。）\n\n\n\n\n# 第 5 章 公共区块链\n\n区块链……是计算机科学领域最大的创新——这是一种分布式数据库的概念，其信任通过大众协作和巧妙的代码来建立，而不是通过一个负责身份验证和结算的强大机构。——唐·塔普斯科特（Don\
  \ Tapscott），《区块链革命》作者\n\n在经历了多年不懈的努力和数十亿美元的投资后，除了货币投机和非法交易，还没有人真正想出区块链的用途。——凯·辛奇康姆（Kai\
  \ Stinchcombe），True Link Financial 联合创始人\n\n\n\n\n既然我们已经深入研究了加密货币的世界，现在是时候将注意力转向区块链了。具体来说，我们将首先从公共区块链开始看，这是任何人都可以其上构建供大众使用的应用的平台。（在下一章中，我们将探索它的相反面——私有区块链，它用于公司或组织的内部目的。）公共区块链仍处于早期阶段，但用它们构建的应用已经取得了一些值得关注的成功与失利。\n\
  \n## 在线投票\n投票机容易被破解已经不是秘密。专业人士可以利用其众多的安全漏洞，在几分钟内破解大多数投票机；黑客随后可以随心所欲地开启或关闭机器、查看选票并更改选票。更重要的是，美国许多州的投票机甚至没有保留投选票的纸质记录，因此无法知道机器是否被攻破。很多时候，投票机无法正确统计票数。2000\
  \ 年，佛罗里达州沃尔卢西亚亚县的一台投票机给某个候选人“送”了-16,000 票。（没错，是负票。）许多权威政权还被指控在票箱作弊或少计对手的票数。\n\n\
  投票似乎也停留在过去；如果你可以完成从股票交易到在线购物的所有事情，为什么你还要费力前往投票站并排队几个小时来投票呢？爱斯尼亚已经实现了在线投票的运行，但它并没有到处普及，因为在线投票太容易被黑客攻击。在华盛顿特区进行的一次在线投票实验中，一组研究人员成功获取了在线投票软件的完全控制权，更改了所有选票，并让确认页面播放了密歇根大学的校歌——这一切都在\
  \ 48 小时内完成。理想情况下，我们拥有一种投票系统，能够对每个候选人的得票进行严谨、透明的计数；无法篡改；并且可以在线运行。如果这听起来像是区块链可以提供的，你是对的。\n\
  \n## 区块链与选举\n因此，许多初创公司和研究人员探索了将选举放在区块链上的想法。让我们来详细解释这意味着。区块链投票的想法依赖于代币，代币是数字资产，其移动可以在区块链上被追踪。在最流行的公共区块链平台\
  \ `Ethereum` 上，任何应用都可以向用户发行代币，这些用户可以像发送 `ether`（再次强调，这是 `Ethereum` 的加密货币）一样向其他人发送代币。任何有价值的东西都可以表示为代币——例如，一个黄金交易所\
  \ DApp 如果你给它一盎黄金，它就会给你一个黄金代币，你可以围绕这个代币进行交易，任何人都可以回到该 DApp 将他们的代币兑回一盎黄金。（代币与 `ether`\
  \ 之间的巨大区别在于，任何人都可以凭空创建一个代币并发行任何他们想要数量的代币，而 `ether` 是 `Ethereum` 上唯一的官方货币形式，新的 `ether`\
  \ 只能通过挖矿产生。）\n\n在区块链投票中，政府将向每位符合选举资格的人发放一个投票代币。每位选民可以将他们的代币发送到代表他们想要投票的人的地址。每笔投票代币的“支付”代表一张选票并存储在区块链上。因此，因为所有选票都公开存储在区块链上，所以有一个稳健的纸质追踪，任何人都可以计票以验证谁获胜，从而消除了计票过程中可能出现的错误和腐败风险。\n\
  \n区块链的额外优势在这里也发挥了作用。因为区块链几乎不可篡改，黑入区块链来添加或删除选票几乎是不可能的。因为区块链具有如此强的韧性——只要至少有一台计算机拥有它们的副本，它们就能存在——所以选票账丢失的风险非常小。因为区块链是去中心化的，政府无法删除他们不喜欢的选举结果。\n\
  \n### 挑战\n区块链投票的主要挑战是决定最初谁应该获得投票代币。这可能涉及人们在在线上证明自己的身份，但这充满了危险：社会安全号码是美国人事实上的唯一标识符，如果你知道某人的出生日期，这些号码的易猜程度得令人震惊。注册选民名单也容易被对手黑入。此外，你必须依靠政府来决定谁有权投票，这与去中心化的目标背道而驰，并允许腐败的政府仍然影响选举。\n\
  \n爱斯尼亚通过向公民发放与其智能手机绑定的电子身份卡或移动 ID 解决了验证问题。爱斯尼亚人可以将这些 ID 码输入网站以证明自己的身份。 94% 的爱斯尼亚人拥有这些安全\
  \ ID，这使得在线投票成为可能。虽然这种方法在爱斯尼亚这个人口不足 150 万的小国效果良好，但在规模较大的国家，由于难以让所有居民都拥有，效果可能没有那么好。\n\
  \n另一个大问题是保持匿名性。因为所有选票都公开存储在区块链上，任何人都可以看到哪个地址投给了哪位候选人。由于政府必须选择哪些地址获得投票代币，它可能不得不将现实世界的身份与地址匹配。这意味着政府，可能还有黑客，可以查出哪个选民拥有哪个地址，从而知道选择了哪个候选人。匿名问题的一个潜在解决方案是同态加密，它让你加密每个人的选票（这样你就无法知道任何人投给了谁），但仍然可以计票并计算出获胜者。\n\
  \n### 采用\n区块链投票具有潜力，但目前仍处于探索阶段。尽管爱斯尼亚是第一个允许在线投票的国家，但它还没有使用区块链进行投票。瑞士的格市和哥伦比亚国成功进行了基于区块链的投票试点，但目前还不清楚这些项目是否会获得更多关注。\n\
  \n### 不朽的互联网\n在 20 世纪 90 年代后期，GeoCities 是全球访问最频繁的网站。它允许任何人免费创建网站，在其巅峰时期有数百万个关于宝可梦、家庭照片和无数其他主题的网站。Yahoo\
  \ 在 1999 年收购了 GeoCities，威胁要摧毁数百万的人类工作和创造力。2009 年，面临财务问题，Yahoo 关闭了该网站，GeoCities 网站仅通过志愿者们艰巨的努力才保存了\
  \ 900GB 的站点数据。MySpace 没有那么幸运，这个在 2000 年代初最流行的社交网络在 2019 年由于一个故障丢失了 12 年的用户上传的音乐、照片和视频。\n\
  \n### 缓慢、易碎且易遗忘\n通常情况下，你不能依赖互联网上看到的任何东西在几年后仍然存在。一项研究发现链接的寿命只有七年：如果你放一个指向书籍或其他网页的链接，七年后有\
  \ 50% 的概率该将失效（也就是说，它将无法带你进入预期的页面）。你可以舒服地引用 2000 年前写的《奥德赛》，但希望网页链接存活十年是一个风险的赌注。有像\
  \ Internet Archive 这样的服务存档网页的过去版本，但它们的覆盖范围并不完整。这种链接失效的问题太普遍了。事实上，问题是结构性的。每当你的浏览器加载一个网页（如《纽约时报》首页）时，它向服务器请求该页面的最新副本。服务器通常是内容存在的唯一地方。如果服务器关闭或删除了页面，你永远无法再次获得该内容。这是中心化的典型例子，而且网页服务器是单点故障。这种内容中心化的另一个问题是速度。如果你在美国访问一个服务器位于澳大利亚的网站，到达该服务器并获取页面将超过\
  \ 300 毫秒——而此时 80% 的观众已经注意到延迟。为了减少这种延迟，你必须在全球范围内建立服务器，但这可能花费数千或数百万。正如 TechCrunch\
  \ 所言，互联网——很大程度上由于其网页的中心化模型——是“缓慢、脆弱且易遗忘的”。\n\n### IPFS（星际文件系统）\n名为 Interplanetary\
  \ File System 或 IPFS 的区块链项目认为它可以改变这一点。IPFS 为互联网提出了一种新模型。在 IPFS 中，网页不仅仅存储在中央服务器上——世界上的任何人都可以保留它们的副本。\n\
  \n作为一个类比，考虑建立于公元前 334 年的埃及亚历山大图书馆。它曾长期被认为是世界知识的中心，包含超过 40,000 卷无价的卷轴。但当公元前 48 年图书馆被火烧时，这些卷轴被摧毁了——因为没有卷轴的副本，卷轴上的知识永远丢失了。如果亚历山大图书馆让世界其他地方存储副本，卷轴上的知识更有可能存到今天。\n\
  \nIPFS 将当前的互联网视为亚历山大图书馆——太多的信息存储在中心化的地方——目标是将信息分散到多个“图书馆”中。IPFS 用户在他们的计算机上有一个文件夹可以在其中存储文件。文件的唯一指纹（称为\
  \ `hashes`）存储在区块链上。任何想要文件的人只需查看区块链以查看谁拥有该文件。一旦他们找到了正确的人，他们就可以从那个人的 IPFS 文件夹中复制文件。即使原始文件被删除，副本仍然存在。这意味着最流行的文件和网页将在全球成千上万台计算机上备份，使它们免受困扰今天互联网的链接失效的影响。此外，由于文件遍布全球，每个人都可能找到存储在地理位置接近他们的计算机上的文件，这使得访问更快。将\
  \ IPFS 文件夹想象成一组 Dropbox 或 Google Drive 文件夹——任何人都可以从其他人那里寻找、下载和复制文件。IPFS 的区块链仅充当目录，向你显示谁拥有你正在寻找的文件副本。此外，每当文件被更改时，该更改都会区块链上被追踪。任何拥有文件旧副本的人都会保留它，文件的新版本可以独立地通过网络传播。这意味着任何人都可以看到文件的旧版本（类似于\
  \ Word 文档中的“修订”功能），确保了内容真的是永久的。即使有人更改了网页（例如为了删除他们想要隐藏的一些信息），旧版本也将继续存在——这在今天的互联网中是不可能的，因为你只能从服务器获取最新版本。目前，IPFS\
  \ 运行着自己的微网络；任何人都可以注册 IPFS 并开始存储文件和访问网络上其他人的文件。IPFS 希望有一天取代当前的互联网，一个“更快、更安全且更开放”的替代方案。\n\
  \n####硬盘的 Airbnb\n一个障碍是人们可能被激励在他们的硬盘上存储文件。为了解决这个问题，一个名为 FileCoin 的项目向存储 IPFS 文件的人付费。想法是，任何想要访问他人\
  \ IPFS 文件夹的人都需要向他们支付文件币。你通过托管文件或从市场上购买文件来赚取文件币。它鼓励了公民行为——你访问的文件越多，你应该托管的文件越多——通过这种方式，它就像硬盘的\
  \ Airbnb：你通过出租空闲房间来赚钱。当人们被付费存储文件时，他们会存储更多。这对 IPFS 很有益，因为它在很多人存储文件副本时效果最好。（如果只有一个人存储文件，IPFS\
  \ 比现在的互联网并没有更好。）\n\n\n\n\n- 去中心化意味着你不需要依赖中间人，因为中间人是单点故障，并带来费用和限制。Chanticleer 案例中的问题是，积分只能在\
  \ Chanticleer 的餐厅使用——所以如果 Chanticleer 倒闭了，你所有的积分都将毫无意义。这个系统是中心化的，以 Chanticleer 为中间人。区块链可以实现去中心化，但前提是系统允许变得去中心化。除非\
  \ Chanticleer 允许任何地方的餐厅接受积分，否则该系统将保持中心化，区块链也不会增加任何价值。\n\n- 区块链实现了无信任性：系统的运行不需要信任任何人。以\
  \ `Bitcoin` 为例，你不需要信任银行或政府来处理支付；你只需要信任 `Bitcoin` 软件会按预期运行。但是，无论有没有区块链，你必须信任 Chanticleer\
  \ 会兑换你的积分。如果他们这样做，你只会留下一堆无用的令牌。这与无信任性恰恰相反——所以 Chanticleer 的计划完全没有利用区块链的这一特性。（Mobivity\
  \ 首席执行官声称他的计划将“把传统的消费者奖励转化为消费者可以控制的东西”，这简直是空话；如果你必须希望一家餐厅接受积分，你并不能真正控制积分。）\n\n-\
  \ 因为区块链让每一笔历史交易都公开且不可篡改（或不可变），所以它们具有极高的透明度。所有使用 `Bitcoin` 进行的非法支付（理论上）都可以被任何人找到，你可能记得这在\
  \ `FBI` 想要取缔“丝绸之路”时非常有用。然而，我们认为并不会有人会在意你周六在 Hooters 兑换了鸡翅积分——这种解决方案提供的透明度并没有多大价值。\n\
  \n- 最后，像 `-of-work` 这样的机制使得区块链基本上是防篡改的，这对于安全性非常有益。然而，我们认为没人想去偷取北卡罗来纳州餐厅的汉堡积分，因此这种优势被浪费了。\n\
  \n\n\n\n简而言之，将区块链用于这项奖励计划，就像用一把 50 美元的高尔夫球杆来敲钉子：确实有效，但你没有利用该工具的任何特殊功能，因此你正在浪费钱。你不如使用一个更便宜、更专门用于手头这项简单任务的工具：比如一把\
  \ 10 美元的锤子或标准数据库。\n\n我们所说的标准数据库，在概念上就像一个巨大的 Excel 表格：它不是去中心化的、无信任的、透明的或防篡改的，但它非常擅长存储信息。Chanticleer\
  \ 只需要在标准数据库（如我们之前提到的 `MySQL`）中跟踪所有的奖励积分，就能获得更好的性能和更低的成本。但是，当然，宣布他们正在使用一个巨大的 Excel\
  \ 表格并不会让 Chanticleer 的股价飙升 41%。对于这个计划来说，区块链完全是大材小用，但 Chanticleer 只是想分一杯热度。\n\n##\
  \ 区块链上的商标\n\n2016 年，伦敦的一小组注意到，音乐家在为乐队名称注册商标时面临困难，导致同名的乐队为了谁更先使用该名称而争执不下。于是该小组成立了一家名为\
  \ `BandNameVault` 的初创公司，让任何乐队都能以 15 美元的价格在区块链上注册自己的名称。\n\n当你创建一个乐队时，你可以在区块链的一笔交易中注册你构思了该乐队名称。如果有人尝试给他们的乐队起与你相同的名称，你可以指向你的那笔交易，证明你已经注册了它。从技术角度来看，这是一个聪明的解决方案：因为区块链是线性的且几乎不可篡改，所以证明某笔交易发生在另一笔交易之前非常容易，而且你可以确信顺序没有被破坏。当然，区块链上的每笔交易都是公开的，这也是帮助，任何人都可以自己检查注册顺序。这个过程比向（例如）美国专利和商标局（`USPTO`）提交官方商标注册要快得多也便宜得多。\n\
  \n但 `BandNameVault` 的理由在严仔细的审查下就站不住脚了。你可以在区块链上注册你的乐队名称直到口干舌竭，但这在法庭上并没有任何意义。你可以起诉某支新乐队使用你的乐队名称，并把区块链作为证据，但法院不会承认这个随机初创公司的区块链是证据。（什么能防止一个无赖的乐队制作一个虚假的区块链，说他们的名称更先呢？）\n\
  \n你实际上可以执行对乐队名称主权的唯一方法是通过像 `USPTO` 这样的政府机构进行商标注册。`BandNameVault` 的创始人自己也承认了这一点：“成功的商标申请确实提供了一套完整的法律保护和许可机会，而我们简单的注册服务无法提供。”\n\
  \n现在，如果 `USPTO` 宣布它将把商标注册存储在公共区块链上，那情况就不同了。但当一个随机的初创公司尝试这样做时，它的解决方案毫无威慑，提供的价值也其微。在区块链上存储东西通常会带来巨大的效率提升，但效率远非唯一重要的因素；解决方案与现有的权力结构整合更为重要。区块链是伟大的技术创新，但它们不足以驱动社会变革——你必须深思如何让人们和机构改变他们的行为。在这种情况下，`BandNameVault`\
  \ 在发布软件之前，如果能让政府商标局或法院接受他们的软件，那是明智的。\n\n## 一线阳光？\n\n英国出版物 `The Register` 询问读者 `BandNameVault`\
  \ 是否是“你听过的最糟糕的区块链想法”，这并不意外。但是，尽管有许多缺陷，`BandNameVault` 项目提出了一个有趣的问题：你如何证明它发生的时间？也就是说，你如何证明你在特定时间知道了某事、说了某事或做了某事？如今，你可以伪造照片、音频甚至视频。推文和网页很容易删除。所以，证明事情发生时间的传统方法并非无一击。\n\
  \n区块链提供了证明事情发生时间的少数可靠方法之一，得益于它们的线性和防篡改性。如果你在可靠的区块链上记录了某事，毫无疑问你记录了它。这是一项成就。正如 `NameVault`\
  \ 所示，挑战在于让人们在意你记录了它。\n\n## 去中心化网站\n\n当你在浏览器地址栏输入网页地址（例如 `google.com/maps`）时，你的浏览器不知道如何处理它。相反，它咨询一个类似于地址簿的东西，称为域名系统（`DNS`），将域名（如\
  \ `google.com/maps` 的主体）转换为一组被称为 IP 地址的数字。然后你的浏览器根据这些 IP 地址获取网页。\n\n你可以将这个过程与通过手机打电话进行对比：手机如何通过名称拨打电话（你不能直接输入“Bill\
  \ Gates”并希望与他通话），所以它会在联系人列表中查找他们的号码，手机知道如何理解这些号码。这里的问题是 `DNS` 是高度集中的；通常，你的互联网服务供应商（`ISP`），如\
  \ `Verizon` 或 `Comcast` 之类的公司为你提供 `DNS`。如果你的 `ISP` 决定删除将某个网站域名与其 IP 地址配对条目，你将无法访问该网站。\n\
  \nGoogle 提供免费的 `DNS` 以防你不喜欢 `ISP` 的 `DNS`，但可能的 `DNS` 列表仍然很小。当 2011 年美国立法者提议了一项名为《停止在线盗版法》（`SOPA`）的法案时，这种集中化显得异常突出，该法旨在通过强制所有美国\
  \ `ISP` 删除违规网站的 `DNS` 条目来打击盗版。网站仍然存在，但美国人无法访问它们。\n\n`SOPA` 没有通过，但互联网活动分子对网络审查变得如此简单感到警觉。一个国家可以强迫其少数几个\
  \ `ISP` 从其 `DNS` 中删除某个网站，从而禁止任何人看到它们。（这并非理论，中国的“大防火城”就使用了同样的策略来阻止不受欢迎的网站。）而这一切都是由于\
  \ `DNS` 的集中化而可能的；`ISP` 是单点故障，而单点故障让审查变得简单。\n\n## 去中心化 DNS\n\n由于 `DNS` 集中化的困扰，一群区块链爱好者创建了一种名为\
  \ `Namecoin` 的加密货币。任何人都可以将其网站的 IP 地址注册到 `Namecoin` 区块链中，该区块链充当了 `DNS`。任何人都可以在计算机上运行\
  \ `Namecoin` 软件，并查找任何注册在那里的网站的 IP 地址，无论他们的 `ISP` 试图阻止什么。\n\n\n\n\n由于区块链是去中心化且点对点的，因此没有审查性政府可以攻击的单点故障。而且区块链非常安全，政府无法尝试从这个去中心化的\
  \ DNS 中删除条目。这是一个好主意，但它陷入了“先有鸡还是有蛋”的问题。除非网站主知道人们会使用 `Namecoin` 并因此访问他们的网站，否则他们就不会费精力在\
  \ `Namecoin` 上注册自己的网站。而消费者如果不知道他们最关心的网站已经注册在上面，他们就不会费精力去下载 `Namecoin`。根据早期 `Namecoin`\
  \ 支持者 Michael Dean 的说法，致命的问题在于消费者对审查的关注程度还不足以让他们去忍受使用 `Namecoin` 的麻烦。因此，去中心化的 DNS\
  \ 始终没有流行起来。\n\n## 去中心化网站注册\n\n后来，`Namecoin` 有了一个更具野心的想法：取代网站注册过程，而这个过程本身也是中心化的。当你启动一个网站时，需要从一家名为注册商的公司购买域名；每个域名后缀（`.com`、`.org`,\
  \ `.de`, `.jp` 等）都由不同的注册商管理。但每个注册商最终都由一家名为 `ICANN` 的公司管理，这意味着 `ICANN` 理论上可以删除任何网站的域名，从而将其下线。\n\
  \n因此，`Namecoin` 引入了 `.bit`，一种新的去中心化域名后缀。任何人可以在 `Namecoin` 的区块链上注册 `.bit` 网站，并且任何运行\
  \ `Namecoin` 软件的人都可以访问任何 `.bit` 网站。问题是，除非你运行 `Namecoin` 软件，否则无法访问 `.bit` 网站，这意味着“先有鸡还是有蛋”的问题现在完全发挥了作用。此外，`Namecoin`\
  \ 软件的设置非常繁琐，需要大量的配置，而且设置网站变得没必要地复杂。\n\n出乎意料的是，`.bit` 域名后缀并没有流行起来。Michael Dean 说，共只创建过大约\
  \ 30 个真实的 `.bit` 域名，而且它们都是具有“传统”域名后缀网站的镜像，通过不同的域名显示相同的网页。（因此，`Namecoin` 网站上并没有新内容可用。）只有\
  \ 5000 人安装了软件来查看 `.bit` 网站。\n\n与此同时，由于注册 `.bit` 网站非常廉价，它充斥着数十万个抢注网站，或占位网站，这些网站占用热门名称，希望日后能获利出售。想象一下，花\
  \ 5 美元购买 `facebook.bit` 或 `disney.bit`，如果 `.bit` 流行了就能以 500 万美元卖出。足以说明，`.bit` 主要被用于阴暗的。\n\
  \n压死 `Namecoin` 的最后一根棺钉是团队糟糕的凝聚力和策略。曾有一时期，他们尝试与 `ICANN` 和 `Google` 合作，而这些正是他们试图“颠覆”的公司——Dean\
  \ 将其称为“开发一种规避政府的技术，然后将其交给政府”。\n\n结论是 `Namecoin` 失败了。你用来买卖域名和 DNS 条目的加密货币 `NMC`，其市值（即市场上所有流通货币的总价值）甚至没有进入加密货币前\
  \ 200 名。而且正如 Dean 提到的，产品本身的使用率很低。\n\n`Namecoin` 失败的主要原因是它低估了人的惯性。他们的解决方案可能比当前系统更去中心化、在技术上更合理，但要建立这种双边市场（一侧是消费者，另一侧是网站制作者）极其困难，尤其是当\
  \ `.bit` 如此难用时。几乎没有证据表明 `Namecoin` 深入思考过这些人的问题；他们似乎只专注于构建一个酷酷的、技术上更强大的产品，而没有考虑如何才能让人们真正使用它。正如我们在本章中一直看到的，这是区块链应用的一个共同问题：过度关注技术问题，而没有考虑人的问题。\n\
  \n# 第 6 章：区块链上的业务\n\n“任何你可以想象成供应链的东西，区块链都能极大地提高其效率——无论它是人、数字、数据还是钱。”——Ginni Rometty，IBM\
  \ 首席执行官\n\n\n\n\n\n构建公共区块链的人们一直抱有宏大的构图：重构民主、消除审查制度或使商标现代化。但还有另一种类型的区块链值得考虑：私有区块链。私有区块链并不试图为所有人创建雄心勃勃的新服务，而是试图自动化并改进企业内部复杂、低效且很大程度上依赖人工的系统。\n\
  \n## 沃尔玛与预防食品源性疾病\n\n2018 年，关于`E. coli` 污染罗马生菜的报告震惊了美国，导致超过 200 人生病，5 人死亡。这是“农产品行业历史上发生过最广泛、最致命的[疫情]”。[[652]](#part0040.xhtml#a4UV)\
  \ 问题所在于，任何获得受污染生菜的人都无法将其追溯到源头农场，因为农产品的整个供应链——从种植农作的农场到销售农产品的超市——都是如此不透明且低效。整个系统是基于纸质的，中的每家公司只需要能够将产品“向后追踪一步，向前追踪一步”，这意味着要回溯溯多个步骤需要与几家独立公司进行沟通[[653]](#part0040.xhtml#a5VV)。追踪一件农产品的来源可能需要超过一周的时间——结果，当局花费了三个月的时间才将受污染的生菜追溯到亚利桑那州尤马使用单一运河水水的农场[[654]](#part0040.xhtml#a5W6)。即使在确定了源头后，也没有人能真正确定自己拿到的生菜是否受污染，因为要将生菜一直追溯回源头太困难了[[655]](#part0040.xhtml#a5W7)。\n\
  \n不久后，沃尔玛宣布它将改革其供应链，要求每家向其销售叶叶蔬菜的公司都开始将其供应链置于区块链上[[656]](#part0040.xhtml#a551)。每家公司都将在沃尔玛拥有的区块链上记录产品的每一步移动，该区块链是沃尔玛与\
  \ `IBM` 共同开发的[[657]](#part0040.xhtml#a552)。每次移动都将作为交易输入到该区块链中，该区块链被称为 `IBM Food\
  \ Trust`。每笔交易都会编码元数据，如产品的批次号、时间和日期以及产品的产地和目的地[[658]](#part0040.xhtml#a553)。\n\n\
  ## 工作原理\n\n沃尔玛本可以在公共区块链上构建这一解决方案，例如通过构建一个 `Ethereum DApp`。但这会带来许多成本：任何人都可以看到你的交易（尽管你可以对交易数据进行加密以保持私密），你必须为每笔交易支付大约\
  \ 5-10 美分的费用，[[659]](#part0040.xhtml#a6WA)，而且你无法设定区块链的规则或无法决定谁可以进行挖矿。对于希望将整个业务系统放入完全全新系统的企业来说，这些都是不可妥协的因素；风险和成本太高了。\n\
  \n相反，像 `IBM Food Trust` 这样的私有区块链是定制的区块链，它们只存储沃尔玛的供应链交易，并且只能由选定人员查看[[660]](#part0040.xhtml#a762)。由于沃尔玛和\
  \ `IBM` 拥有这个私有区块链，它们不需要获得第三方许可，并且可以控制谁可以看到数据。这是私有区块链优于公共区块链的关键优势。\n\n\n\n\n请注意，这些益处并非食品所独特；任何供应链都能从区块链提供的效率、安全、速度和透明度中受益。我们认为供应链是区块链的“杀手级应用”之一——在这种用例中，区块链的表现远超任何替代方案。\n\
  \n### 股票与区块\n如果你想卖掉一本旧书或买一张稀有的棒球卡，你可能不会向朋友求助——你个人认识的人中不太可能有人正好按照你想要的价格买卖这些东西。相反，你更有可能转向像\
  \ `Amazon` 或 `eBay` 这样的网站，它们可以高效地将你匹配到全球范围内想买这本书或卖掉那张卡片的小部分人群。\n\n股票、期货或其他金融工具也是类似的情况。每当你买卖股票时，你的份额会瞬间出现或消失，仿佛变魔术一样。但你个人认识某人想买入你的\
  \ `General Mills` 股票或向你卖出 `UPS` 股票的概率很。因此，你的经纪人或股票交易网站会转向被称为 `clearinghouses`（结算中心）的第三方，这些机构就像是股票交易领域的\
  \ `eBays`：它们将数百万卖家和买家相互匹配，让人们能够快速高效地找到交易伙伴。\n\n如果你正寻求以 5000 美元出售 100 股特定股票，而世界另一端的有人想以\
  \ 5000 美元购买 100 股，`clearinghouse` 将把你们配对。结算中心还承担交易风险；它们确保即使一方失败，交易也能完成。如果你以 5000\
  \ 美元卖出 100 股股票，但随机选中的买家违约了，由于有了 `clearinghouse`，你仍然会获得 5000 美元。结算中心还确保买卖双方财务健康，处理法律文件，并向买卖发送数据。\n\
  \n总的来说，结算中心处理了所有的脏活和风险，让任何人都可以点击买卖股票，并知道一切都会顺畅进行。结算中心是中间人——它们站在买双方之间，这是有的——所以为了提高效率并降低成本，股票市场经常采用基于软件的结算中心，被称为自动结算中心\
  \ (`ACHs`）。\n\n到 2017 年，澳大利亚证券交易所 (`ASX`）的 `ACH` 软件已经老化，它决定尝试一下区块链。这是一种自然的结合，因为结算中心的工作原理类似于\
  \ `smart contracts`（智能合约）：它们从买方处收取资金，从卖方处收取股票，运行一些检查，并在双方通过验证后交换资产。如果你将普通 `ACH`\
  \ 的所有复杂逻辑转换为 `smart contract`，你可以在效率和透明度上获得巨大胜利。\n\n`ASX` 基于区块链的 `ACH` 细节尚未公开，但我们假设其实现与我们概述的相似。所有的资金和股票都表示为\
  \ `tokens`（令牌），所有的股票出售都表示为 `blockchain transactions`（区块链交易）。所有交易都由 `smart contract`\
  \ 调解，它接收买方的资金令牌和卖方的股票令牌，运行一些检查，然后进行交换。\n\n`smart contracts` 在此处的处是巨大的。智能合约是可预测的——像机器一样，它们每次运行得几乎完全相同——而且它们所有的操作都可靠地存储在区块链上。同时，`ASX`\
  \ 的旧方案相对混乱（非区块链应用可以在精度和追踪上表现得更松散）、脆弱且缓慢。一位市场战略师预测，由于这些原因，这种区块链解决方案可以为 `ASX` 节省数千万美元，通过减少费用、提高透明度和降低官僚复杂性。\n\
  \n`ASX` 在这些需求上并不孤单。世界上有大量的交易所和结算中心，许多机构可以像 `ASX` 那样从区块链中受益。一份报告发现，交易所行业可以通过基于区块链的结算节省\
  \ 200 亿美元。这仅仅是交易所结算中心；其他金融市场（特别是期货市场）也严重依赖结算中心。\n\n但 `ASX` 的区块链采用遇到了一些障碍。这项技术太新了，`ASX`\
  \ 的解决方案花费了两年时间开发，即便如此，发布也推迟了六个月。这就是处于前沿的代价；这对于某些金融机构（通常是一群风险厌恶者）来说可能难以承受。\n\n另一个问题是法律还没有及时跟上区块链，这对于金融这样受高度监管的行业是有问题的。目前的金融法律法规完全没有\
  \ `crypto-tokens`（加密令牌）、`distributed ledgers`（分布式账本）和 `smart contracts` 的概念，而且这些工具的操作方式往往与现行的法律法规相冲突。例如，法院可以驳回他们认为“显失公平”（unconscionable）的合同，即一方拥有如此大的议价能力或财务实力，以至于合同是不公平的。但\
  \ `smart contracts` 是自动执行的；一旦启动，你物理上无法更改或撤销它们（事实上，这也是它的魅力之一）。因此，需要修改法律以寻找新方法来阻止不公平的\
  \ `smart contracts`；另一方面，任何开始使用 `smart contracts` 而普通合同的人都需要找到方法确保他们的 `smart contracts`\
  \ 合规。简之，区块链和 `smart contracts` 可以为交易所等金融机构的后台带来巨大的效率提升。但并不是丢进新软件那么简单：这些热门新工具伴随着增长阵痛和潜在的法律困难。\n\
  \n### Xbox 与游戏版税\n如果你正在发布一款 `Xbox` 游戏，你可能需要与一小群外部承包商合作：音乐家、特效工作室、角色设计师等。你将需要与每位承包商签署复杂的版税合同，设定规则，例如，“当销售额至少达到\
  \ `Z stars` 时，我们将向音乐家支付总收入的 `X%`，当销售额达到 `$Y million` 后。”典型的游戏可能有数百份这样的合同，即使简单的合同也有几页纸。\n\
  \n管理这些复杂的合同条款是一场后勤噩梦，需要大量的会计人员在传真纸、筛选 Excel 表格和处理无尽的电子邮件之间。。如果预期付款与实际付款不符，会计人员必须通过这种耗时且易错的对账过程来寻找每一份文件、阅读所有文档并找出差异。对于发行商来说，版税结算可能花费\
  \ 45 天——这在快速发展的游戏世界是不可思议的速度。问题的另一种角度是：版税支付需要会计人员根据复杂规则手动计算，且数据分散在许多来源中。`Xbox` 希望实现版税计算并将所有数据汇到一个处。因此，它决定建立基于区块链的结算系统。\n\
  \n`Xbox` 将所有复杂的合同转换为智能合约，将复杂的法律术语变为精确的公式。我们之前展示的例子——“当游戏至少达到 `Z stars` 时，我们将向音乐家支付总收入的\
  \ `X%`，当销售额达到 `$Y million` 后”——将转换为根据销售等输入数据计算版税的 `smart contract`。自动智能合约比会计人员读纸高效得多，它们可以在几秒钟内计算版税。而且由于\
  \ `smart` 的代码任何人都可以阅读，每个承包商都能确保他们获得了应得的钱，从而减少了对账的痛苦。实际付款过程也简化了；每个承包商和发行商都得到了自己的“地址”，智能合约在每次交易时自动移动资金。结果是\
  \ `Xbox` 将结算时间从 45 天缩短到了分钟，让发行商获得了实时洞察并进行灵活调整。`Xbox` 的财务团队也减少了 70% 的工作量，并将引入新发行商的时间从几天缩短到\
  \ 15 分钟。简之，这种区块链解决方案对于 `Xbox` 和发行商都是双赢。\n\n### 云区块链与大数据\n`Xbox` 并没有自己构建整个系统。它没有创建自己的节点、安装服务器来存储区块链并编写所有必要的代码。相反，它转向了微软的云计算部门\
  \ `Azure`，并使用了 `Azure` 的区块链服务功能。`Xbox` 使用 `Azure` 的预构建代码，在超级计算机上存储区块链并使用其安全性和可靠性功能。通过这种方式，`Xbox`\
  \ 避免了自己运行区块链带来的开销成本和维护头疼——无需发明轮子！此外，将所有数据存储在区块链中强制其成为单一格式。以前，当信息分散在无数纸张和文档中时，对其进行分析几乎是不可能的；仅仅寻找和清理数据就要花费很长的时间（任何尝试过在不同\
  \ Excel 表格之间交叉引用数据的人都知道统一格式要好得多）。现在数据是单一格式，发行商可以轻松将其提取到数据分析和可视化软件中，以理解付款如何随时间增长以及在哪里可以削减成本。此外，拥有大量的结构化数据会让机器学习变得更容易，帮助释放更多洞察。正如你所看到的，区块链技术与其他热门趋势（云计算、大数据和机器学习）有大量的重叠。这并非偶然；这些技术相互促进，并且在一起使用时效果最好。\n\
  \n### 私有区块链的大师\n如果我们退后一步广泛地观察私有区块链的成功案例，一个令人惊讶的事实是：在私有区块链上最成功的团体不是初创公司，而是像 `Walmart`、IBM、Microsoft\
  \ 和交易所这样的巨头。如果一家小杂货店或初创公司宣布将其供应链放在区块链上，没人会在意，但当 `Walmart` 发布同样的公告时，全世界的人都会注意。考虑到加密领域如此强调初创公司和对旧者的颠覆，这尤其显得奇怪。\n\
  \n为什么大型、动作缓慢的旧者能从私有区块链这种“颠覆性”技术中获益这么多？我们认为这是因为实施私有区块链根本不是一个技术挑战；它是一个社会挑战。`Walmart`、`ASX`\
  \ 和 `Xbox` 使用的区块链并没有比 `Bitcoin` 或 `Ethereum` 的复杂复杂复杂，而且像 `Azure` 这样的云区块链服务让你即使几乎没有先验知识也能轻松设置区块链。构建区块链一直是容易的部分。在我们探索的三个案例中，困难的部分都是人性的部分：`Walmart`\
  \ 需要让它的所有供应商都接受一种未经测试的新技术，`ASX` 必须维护法律合规性并在交易者切换到全新系统时保持冷静，而 `Xbox` 必须教所有的发行商和会计这种基于区块链的工具。大公司尽管在采纳新技术方面很慢，但非常擅长处理这些人的问题。他们比初创公司更擅长让大群体改变行为——`Walmart`\
  \ 可以强制供应商在区块链上跟踪农产品，而一家微小的新杂货店可能不能。他们有足够的律师来确保他们遵守规定，正如 `ASX` 的案例一样；初创公司通常跟不上。而且当他们采用新技术时，他们可以在足够大的规模进行部署，从而节省的资金足以抵消预付成本；`Xbox`\
  \ 相比初创工作室获益多得多。\n\n\n\n# 第 7 章\n\n## 加密货币政策\n\n当 `Bitcoin` 货币从货币转换为现金时，该界面必须保持在某些监管保护之下。我认为，在\
  \ `bitcoin` 宇宙中，算法取代了政府的功能……[这]实际上非常酷。 —阿尔·戈尔（Al Gore），美国前任副总统\n\n令人惊讶的是，尽管这项技术被广泛认为与非法性、欺诈和对政府的不信任联系在一起，但通往可信区块链的道路在于治理、监管和法律。\
  \ —凯文·韦尔巴赫（Kevin Werbach），《区块链与信任的新架构》作者\n\n\n\n\n加密货币早期的一大吸引力在于其完全缺乏监管——你可以保持某种程度的匿名性、逃避税收、在无需提交文件的情况下投资、无需经过繁文缛节地向任何地方汇钱等等。但并不是因为加密货币存在于监管范围之外——事实上，正因为加密货币影响了深受监管的金融领域，它们才成为监管的首选对象。只是加密货币在几年里一直处于监视之外，而一旦它们进入公众视野，立法者们就措手不及。但现在，立法者们已经有了理解这种快速技术进步的影响，他们已经开始制定并执行围绕加密货币的政策。\n\
  \n## 加密货币禁令\n\n从设计上来说，加密货币规避了政府为金融系统设立的许多严密监管。持有和移动资金的传统方式——信用卡、支票、股票、房地产购买等，凡此此类——总会在交易中附上你的名字。但加密货币不会。这使得洗钱变得容易得多：通常你需要进行一些复杂的活动，比如建立长期的壳公司链或进行大额房地产购买，但使用加密货币，只需要找到一个不要求身份识别的交易所那么简单。你只需要用脏钱购买代币，在几种不同的加密货币之间移动资金，然后兑换成“干净”的美元。你还可以钱发送到混币器（tumbler），它将你的加密货币与其他人的混合，并从池中随机返回代币，从而难以追踪你的资金历史。由于交易没有关联名字，加密货币让逃税变得容易，让支付追踪变得更加困难——这就是为什么网络犯罪分子喜欢要求用加密货币支付并将其用于非法毒品交易。\n\
  \n解决这些监管难题的最简单方案是完全禁止加密货币，这正是许多国家所做的。俄罗斯、泰国、越南、厄瓜多尔、玻利维亚、孟加拉国和吉尔吉斯斯坦在 2010 年代中期完全禁止了所有加密货币，专注于比特币在洗钱、毒品走私和逃税中的频繁使用。在一名香港富商被绑架并被索要数百万美元比特币作为人质后，台湾禁止了比特币。\n\
  \n然而，这些应激反应也有副作用。加密货币有许多合法用途，如果利用得当，可以帮助经济发展。因此，许多较大的国家采取了更微妙的方法。美国的一般做法是将加密货币视为任何其他价值载体（美元、财产、股票、汽车等）并应用同样的监管。\n\
  \n## 中国的比特币戏剧\n\n中国由于其对加密货币表现出的“似爱又恨”的关系，是一个有趣的案例研究。正如我们在书中反复提到的，中国是比特币领域的一个巨型参与者：80%的比特币是在那里挖出的，一些最大最有影响力的矿池也在那里，而且它生产了许多热门的\
  \ ASIC。与此同时，中国对比特币生态系统的大部分实施了严厉禁止。中国在 2013 年禁止银行等金融机构处理比特币，但显然允许私公民使用比特币。该国在 2017\
  \ 年禁止了加密货币交易所，但公民只是开始使用虚拟专用网络（`VPNs`）访问位于日本或香港的交易所。\n\n中国在 2018 年确实加强了力度，它指示政府工作组“指导关闭”挖矿作业，尽管它没有给出关闭的时间表。同同年，它禁止所有中国公民交易加密货币，包括在外国交易所交易。中国对待比特币的方法确实很奇怪；它从主导比特币领域中受益匪浅，但它又想关闭。一些人怀疑这是因为中国想开发自己的加密货币，所以它想在关掉比特币的同时扩大整个加密领域。\n\
  \n## 监管的困难\n\n尽管受到（非常强大的）政府的严厉限制，比特币在中国仍然蓬勃发展，这一事实表明加密货币监管很难执行。因为加密货币用户精通技术，往往比监管者更懂，任何单一国家打击货币的尝试并不总是奏效，因为交易者和矿工很容易将业务转移到其他地区。在美国于\
  \ 2018 年开始打击加密货币后，许多初创公司考虑搬到瑞士，那里对加密更加友好。虽然中国可能对矿工产生了反感，但像魁北克北部和蒙古这样拥有廉价电力且需要挖矿经济刺激的地方，对矿工相对友好。在我们看来，单方面的加密监管只是将活动转移到其他国家。只有当各国开始合作制定多国协议来打击加密货币时，才会发生重大变化。\n\
  \n委内瑞拉的国家支持加密货币在 2018 年正处于政治和经济危机之中，通胀率每年超过 60,000%这意味着价格每个月翻倍，毁灭了储蓄和企业。12 月 31\
  \ 日的一块面包的价格是 1 月 1 日的 6000 倍。与此同时，强人总统马德罗政府正受到国际制裁的打击，使其脱困变得越来越困难。2017 年 12 月，马德罗宣布创建一种名为`Petro`的加密货币，他说它将由委内瑞拉的石油和矿产储备支撑。他承诺将一个`Petro`与一桶石油的价格挂钩，并以阿亚库霍地区的石油储备作为支撑。马德罗在\
  \ 2018 年 8 月加剧了这一行动，宣布了一种名为`sovereign bolivar`（主权玻利瓦）的新纸币，价值 10 万旧玻利瓦。`sovereign\
  \ bolivar`也将与`Petro`钩；根据马德罗的话，3600 新玻利瓦可以换一个`Petro`。\n\n## 骗局\n\n问题在于`Petro` 是一个完全的骗局。首先，`Petro`并没有真正的石油支撑——你无法用`Petro`兑换一桶石油。而且当你考虑到委内瑞拉在预售`Petro`代币时提供了\
  \ 60%的折扣时，你会怀疑它是否真的与石油价格挂钩。阿亚库霍地区包含了所谓的支撑`Petro`的石油储备，没有任何石油相关的活动，该地区所有的油井都是废弃的。\n\
  \n![阿亚库霍的地图，自动生成](img/image_rsrc7.jpg)\n这里显示的阿亚库霍位于奥里诺科产油区。马德罗声称这里的石油将支撑`Petro`，但它是废弃的。来源：Energy\
  \ Consulting Group 和 Scribble Maps `Petro`甚至不是一个运作的货币……（注：此处原文文本存在混乱，已根据逻辑翻译）\n\n\
  `Petro`甚至不是一个运作的货币。它从未被使用过，没有主要的交易所接受它。`Petro`存在的唯一证据是一个名为`Petro`的基于以太的代币，拥有 1 亿活跃代币，这是马德罗所承诺的数字。但没有人交易过这些代币，而且关于将使用哪个区块链平台的白皮书内容匮乏且不一致：一天说它将建立在以太之上并使用`ERC20`，另一天说将使用`NEM`。马德罗说他从预售`Petro`中筹集了数十亿美元，但经济学教授\
  \ Steve Hanke 说这些主张是荒谬的。最后，委内瑞拉政府有货币贬值和设定汇率的历史，外国人对（`Petro`）无能为力。\n\n## 规避制裁\n\n\
  为什么马德罗要推出这种显显然是欺诈的加密货币？这很可能是为了规避美国的制裁。委内瑞拉在宣布`Petro`时有 1400 亿美元的债，`Petro`试图筹集 60\
  \ 亿美元，这对比国家的债务造成了微不足道的影响。这种筹款尝试当然是失败的。正如《华盛顿邮报》提到的，“这是卡拉加斯在规避制裁的同时筹款的一种方式。”故事的启示是政府与加密货币的关系是双向的：加密货币可能破坏国家的法律，但它们帮助国家规避他们不喜欢的国际法。由于任何人都可以创建新的加密货币，立法者没有可以攻击的对象。相反，国际机构需要积极监管所有加密货币以停止此类行为。这种能力被植在加密货币中：它们让任何人向任何地方汇钱，但也故意让支付变得困难。这对于合法的转账非常方便，但对非法活动也有帮助。##\
  \ ICO 与骗局\n\n当一家新公司想要筹集大量资金时，它通过首次公开募股（`IPO`）向公众出售股票。持有`IPO`股票使你有权获得公司利润，以及（有时）对公司决策的投票权。随着公司的增长，对利润的需求以及股价也随之增长。因此，当你购买`IPO`的股票时，你是在赌公司会增长、股价会上涨以及你会盈利。然而，进入`IPO`极其困难——这需要多年的文件工作、监管机构和审计师的严格审查，以及对潜在投资者的无数推销。而且，如今技术初创公司维持的时间越来越久，这意味着只有风险资本家可以在高增长早期投资初创公司——普通投资者一直被排除在`IPO`之外，那时公司的大部分增长已经过去。因此，加密世界创建了类似于`IPO`的并行物，即首次代币发行（`ICs`）。`ICs`让基于区块链或加密货币的初创公司在生命周期早期出售加密代币，从而让初创公司筹集资金并让投资者赌初创公司的成功。`ICs`提供代币为加密初创公司筹集资金；`IPOs`提供股票为传统初创公司筹集资金。\n\
  \n### 关于证券和效用\n\n`ICs`有两种主要类型：提供证券代币（`security tokens`）的和提供效用代币（`utility tokens`）的。\n\
  \n证券代币的工作与股票非常相似：初创公司给你这些代币（在区块链上跟踪），你获得投票权，有时获得公司利润份额。与股票一样，如果投资者认为公司将增长，证券代币的需求以及其价格就会上涨。\n\
  \n效用代币是独特的：你购买用于支付初创公司服务的代币。（如果初创公司提供自己的加密货币，它将出售加密货币而不是代币）。例如，`FileCoin`（我们之前提到的去中心化文件存储应用）在它的`IC`中提供了`FIL`币，你用它支付其他用户为你存储文件。在它的`IC`中，`Ethereum`出售了`ether`（或`ETH`币），这是你用来支付运行`DApps`的货币。随着服务变得流行，对代币或硬币的需求以及其价格应该上涨。所以当你购买一个代币时，你是在赌服务会变得更流行。如果它们变得流行，代币的价格就会上涨。想象一个机器只接受固定数量的代币，如果你早期买了一批代币，价格最终涨到了\
  \ 1 美元，你就运气好了——你可以卖掉那些代币获利，或者你可以使用那些代币购买并节省资金。在这个例子中，你早期买了一批代币（`IPO`的等价物），如果你想用很多，或者如果你只是想要一个可以从中获利的投资……（注：此处原文文本存在严重的重复和逻辑混乱，已根据上下文进行了翻译）\n\
  \n这意味着代币的价格由两个因素决定：服务本身以及第二个决定因素是共享代币；记住这一点，因为这很重要。哪种类型的`IC`都是可行的，尽管效用代币通常比证券代币更常见。\n\
  \n## 好、坏与骗局\n\n启动一个`IC`异常地容易：你只需要一份描述初创公司想法的白皮书。没有监管，任何人在地方都可以购买代币并支持你的想法。无论`ICs`提供证券代币还是效用代币，它们都提供了一种更廉价、快速且没有繁文缛节的筹集资金的方式。与那些在`IPO`之后普通投资者才能进入的传统公司相比，`ICs`的简易性也是它们的致命点。在没有对`IPO`广泛监管的情况下，没有什么能阻止骗子肆意妄为。估计\
  \ 80%的`ICs`都是骗局，从 2016 年到 2018 年，`ICs`偷取了普通投资者近 1 亿美元。当你投资`IC`时，通常除了白皮书之外你无处依靠。你信任公司会履行白皮书中的承诺；只有在那时，你购买的代币才会增值。但公司往往无法履行承诺，更糟糕的是，没有什么阻止欺诈公司卷走资金跑路。这种骗局被称为“跑路骗局”（`exit\
  \ scam`）：即公司根据白皮书筹集资金但在建立任何产品之前就消失了。数百个`ICs`已被证明是跑路骗局。其中一个臭名昭著的名为`LoopX`的加密货币投资初创公司，提供一个模糊的“投资平台”，每周向投资者提供“保证利润”（得吧）。`LoopX`从它的`IC`中筹集了\
  \ 450 万美元，但公司在 2018 年 2 月消失了。它的网站和社交媒体全部从互联网上消失了。这起 450 万美元的劫案是 2018 年的第五大`IC`诈骗，而且只发生在\
  \ 2 月！\n\n即使是老加密初创公司也可以拿用户的钱跑路，人们对此无能为力。实施这种骗局的最著名的加密初创公司名为`BitConnect`。`BitConnect`是一个投资平台，承诺每天\
  \ 1%的回报，并保证每月总回报 40%。这意味着今天投资的 1000 美元在三年内将变成 500 万美元。这种业务模式很快被标记为可疑，但这并没有阻止`BitConnect`在\
  \ 2016 年`IC`后达到 26 亿美元的市值。整个 2017 年，该公司进行了激进的营销活动，吹嘘为投资者赚取的“利润”，但`BitConnect`并没有投入任何资金——投资者得到的“回报”只是新投资者投入的钱！（这是金字骗的教科书级定义）。2018\
  \ 年 1 月，公司无踪迹地突然关闭。作为`BitConnect`基础的加密货币暴跌了 96%。许多投资者将生活积蓄存入了`BitConnect`——他们破产了。与此同时，`BitConnect`的所有者在公司关闭前以巨额资金卖掉了所有硬币。如果`BitConnect`是一家传统公司，它可能永远无法通过`IPO`，因为监管机构和审计师会很快发现公司具有所有骗局的特征。`ICs`周围缺乏监管也让更多犯罪分子在没有执法的情况下成长。2018\
  \ 年，臭名昭著的 gangster `Wan Kuok`在首次销售中筹集了超过 7.5 亿美元，因非法赌博和贷款被判 14 年监狱。这有点像`IPO`案例：一个合法机构本会借钱管理资金的人。\n\
  \n![一组对着相机拍照的人，自动生成](img/image_rsrc7HD.jpg)\n`Wan Kuok`在首次销售中筹集了 7.5 亿美元，因非法赌博和贷款被判\
  \ 14 年监狱。无论他们提供证券代币还是效用代币，它们都提供了一种更廉价、更快速的赚钱途径。来源：华华早报\n\n简而言之，`ICs`面临着经典问题：移除所有守门人让创新变得更快更简单，但也让骗子和犯罪分子有机可乘。这是一种有趣的筹资方式，但你禁不住认为骗子占据了上风。\n\
  \n## ICO 监管\n\n`ICs`之所以长期能够规避审查是因为加密货币和代币没有被视为证券。美国证券交易委员会（`SEC`）严厉监管证券的销售。股票被归类为证券，这就是为什么`IPO`面临着如此多的监管。但是有法律理由监管它们吗？当涉及到`IC`时，大问题是加密货币是证券吗？如果是，那么`ICs`应该像`IPO`一样受到监管。`SEC`有一个悠久的测试，被称为“霍尼测试”，用来检查资产是否为证券。该测试说，“如果一个人投资于一项共同企业，并预期从发起者或第三方的努力获得利润，那么这种投资就是证券。”基本上，如果你为了希望公司带给你利润而投资公司，你买买了一个证券。这是股票的定义，所以股票显然是证券。那么`ICs`呢？记得`ICs`出售两种类型的代币：证券代币和效用代币。证券代币显然是证券——名字里写着。它们的工作与股票非常相似：初创公司交给你这些代币（在区块链上跟踪），你获得投票权，有时获得公司利润份额。随着公司的增长，证券代币的需求以及其价格上涨——所以它们显然可以像股票一样受到监管。效用代币是一个更复杂的案例。\n\
  \n是独特的：你购买用于支付初创公司服务的代币。（如果初创公司提供自己的加密货币，它将出售加密货币而不是代币）。例如，`FileCoin`（我们之前提到的去中心化文件存储应用）在它的`IC`中提供了`FIL`币，你用它支付其他用户为你存储文件。在它的`IC`中，`Ethereum`出售了`ether`（或`ETH`币），这是你用来支付运行`DApps`的货币。随着服务变得流行，对代币或硬币的需求以及其价格应该上涨。所以当你购买一个代币时，你是在赌服务会变得更流行。另一个加点是如果一个机器只接受固定数量的代币，如果你早期买了一批代币，价格最终涨到了\
  \ 1 美元，你就运气好了——你可以卖掉那些代币获利，或者你可以使用那些代币购买……（注：此处原文文本存在严重的重复和逻辑混乱，已根据上下文进行了翻译）\n\n\
  这意味着代币的价格由两个因素决定：服务本身以及第二个决定因素是共享代币；记住这一点，因为这很重要。哪种类型的`IC`都是可行的，尽管效用代币通常比证券代币更常见。\n\
  \n\n\n\n\n# 创建 STO 的方法\n\n*   向美国证券交易委员会（SEC）正式注册发行。这需要与 IPO 类似的审查，因此非常困难且昂贵。加密初创公司在\
  \ ICO 期间的规模通常远小于普通初创公司在 IPO 期间的规模，因此这种选择对于大多数加密初创公司是不可接受的。大多数寻求进行 STO 的加密初创公司寻找豁免，这让他们可以在无需向\
  \ SEC 注册的情况下合法地启动 STO。\n\n*   使用名为 `Regulation D 506(c)` 或 `Reg D` 的豁免。`Reg D` 规定，如果你仅向合格投资者出售，则不需要向\
  \ SEC 报备。该术指的是拥有足够财富和知识、SEC 认为他们有能力处理风险加密投资的投资者或公司。投资者可以通过年收入超过 200,000 美、净资产超过\
  \ 100 万美元、成为注册经纪人或投资顾问，或拥有其他证明其深谙业务的专业或教育经验来成为合格投资者。`Reg D` 非常容易使用：寻求进行 ICO 的公司只需说明“仅限美国合格投资者”，即可立即获得符合\
  \ `Reg D` 标准的 STO。因此，它可能是最受欢迎的豁免。\n\n*   使用名为 `Regulation Crowdfunding` 或 `Reg CF`\
  \ 的豁免。这允许任何投资者（合格或不合格）参与，但初创公司通过这种方法每年只能募集约 100 万美元。募资上限太低，这项规定并不实用。\n\n*   使用 `Regulation\
  \ A+`，它允许任何人参与（类似于 `Reg CF`），但募资上限为 5000 万美元。然而，发行必须获得 SEC 的批准，这非常严格且困难。`Reg A+`\
  \ 通常认为比 `Reg D` 好但更获得，因此它留给了较大的加密初创公司。\n\n在创建 STO 时，加密初创公司通常会选择美国以外的投资者，并使用名为 `Regulation\
  \ S` 的单独豁免向海外投资者出售。`Reg S` 本质上规定，只要使用某些批准的方法，就可以从任何海外投资者那里募集无限额资金。这就是为什么你可能会听到 `Reg\
  \ D/S` 或 `Reg A+/S` STO。\n\n| | 需要 SEC 批准吗？ | 投资者限制 |\n| :--- | :--- | :--- |\n\
  | 向 SEC 注册 | 是，需额外审查 | 无 |\n| `Reg CF` | 否 | 无 |\n| `Reg D` | 否 | 仅限合格投资者 |\n| `Reg\
  \ A+` | 是 | |\n\n## 美国创建 STO 的主要方法\n\n每种方法都有缺点。交易所需要对买家进行身份验证 (`KYC`) 和反洗钱 (`AML`)\
  \ ——基本上是确保是真人在购买，而不是机器人。这非常耗时且昂贵，但知名交易所已经实施了这些（顺带一句，`KYC` 和 `AML` 检查就是为什么现在你在 `Coinbase`\
  \ 上注册账户时上传护照或驾照）。\n\nSTO 为加密初创公司提供了选择：要么像传统 IPO 一样向 SEC 注册发行，要么不注册但仅卖给懂行的人（合格投资者）。这意味着不合格的美国投资者无法投资经过审核的\
  \ STO —— 这保护了财富较少和信息有限的投资者，防止参与本质上是高风险的加密赌博（这是一个真实的问题：许多新投资者为了购买加密货币甚至预支信用卡贷款——这意味着他们正在用自己根本没有钱在赌博。这项\
  \ SEC 规定无论好坏，都旨在保护这些人）。\n\n总的来说，STO 似乎是在允许无限制的 ICO 和完全关闭加密募资之间的一个公平折中。另一方面，STO 让普通投资者无法对加密进行早期投资；ICO\
  \ 本应是解决这个问题，但在这方面 STO 并不比 IPO 好。另一个批评是，如果每个国家都采用自己的 STO 规则，法律负担可能会变得无法承受 —— 遵守美国的限制已经足够困难，但必须遵守数十项规定对于新兴加密初创公司来说太难了。随着时间的推移，我们预计加密募资将越来越像传统的\
  \ IPO 募资。这意味着旧方法的所有优缺点——我们在这里已经提到的其中一些——将继续出现在加密领域。\n\n# 第 8 章：展望\n\n比特币仅仅是使用区块链的一个例子。加密货币只是去中心化技术的一个例子……我认为去中心化网络将是技术的下一个巨浪。区块链允许我们的智能设备之间通信得更好、更快速。\
  \ — Melanie Swan，《区块链：新经济蓝图》作者。\n\n我非常喜欢比特币……它是一个价值存储媒介，一个分布式账本。如果你有风险偏好，它也是一个很好的投资工具。但在波动性减缓之前，它不会成为货币。\
  \ — David Marcus，`PayPal` 前首席执行官。\n\n\n\n\n\n如今，加密货币领域由初创货币和企业后台工具主导。但这种情况并不会一直持续。加密货币的角色和范围似乎将大幅扩大，有趣的是，它未来可能不再使用区块链了。\n\
  \n## Facebook 的 Diem\n2019 年 6 月，前 PayPal 负责人、时任 Facebook 加密货币部门负责人的 David Marcus\
  \ 发布了 `Facebook Libra`（后更名为 `Diem`），这是一种新的稳定币，它将与 27 家合作伙伴共同运营，其中包括 `Visa`、`eBay`、`Uber`\
  \ 以及是的，还有 `PayPal`。对于这家社交网络公司来说，这是一个大胆的举，但也并不意外，因为多年来传闻 Facebook 会在 `WhatsApp` 和\
  \ `Messenger` 中加入稳定币。\n\n这个万能应用 Diem 设计用于用于 Facebook 的消息软件（尽管它在技术上独立于 Facebook），商户可以接受其作为支付，用户可以通过交易所与法币之间进行转换。但为什么一家社交网络公司要进入加密货币领域？最明显的原因是它可以帮助\
  \ Facebook 精确追踪人们把钱花在了什么地方，这对于广告商来说是极具价值的数据——从而帮助 Facebook 更好地投放广告并收取更高的广告费用。\n\n\
  但其次，Facebook 长期以来一直表现出从社交网络演变为涵盖所有经济活动的应用的兴趣。这里的榜样是中国型应用 `WeChat`：它最初是一个短信应用，在 2014\
  \ 年开始让人们给朋友转账。它通过让人们在农历新年发送数字红包，将一项流行的中国传统数字化，从而让人们迷上了这项功能。一旦它拥有了数亿人的支付信息，它就开始让人们完成从打车、付账单、买电影票到付房租的任何事情。（如果你已经在应用中输入了信用卡信息，那么你在这个应用上买电影票的概率会大得多！）`WeChat`\
  \ 是中国的万能应用，而 Facebook 并不掩讳它想成为世界的万能应用。\n\n## 国际支付\n该计划的第一步是让所有使用 Facebook 的人汇款。Facebook\
  \ 对 Diem 的首要目标是服务汇款市场，即人们向发展中国家汇回的资金。这在表面上是合理的。`WhatsApp` 在最需要汇款的发展中市场中异常受欢迎：`WhatsApp`\
  \ 的最大市场印度每年接收超过 700 亿美元的汇款。\n\n为什么要用加密货币？你早已可以在 `Messenger` 上给朋友转账，而且 2019 年，Facebook\
  \ 宣布了 `Facebook Pay`，这是针对 `Facebook`、`WhatsApp` 和 `Instagram` 的另一个支付系统。加密货币带来了什么？这取决于国内支付和国际支付之间的差异。在国家内部汇款，特别是在美国，通过传统的金融系统已经非常顺畅。`Venmo`\
  \ 是免费的，美国银行之间的汇款最多只需几美元，使用支票每次只需几分钱，而信用卡收收取的费用低于 3%。\n\n而且所有这些方法最坏也需要两个工作日。但跨境支付简直是一场噩梦。向国外汇款需要几周时间，款项在途中丢失并不罕见，糟糕的汇率会吞噬大量款项。如果你需要从英国等地汇款到非洲，带一箱现金飞过去通常更快、更便宜、也更方便。区块链专家\
  \ `Chris Ferris` 在西南德州国际音乐节（South by Southwest）的一场演讲中给出了类似的例子：如果你想从美国寄出 10,000 美元到印度尼西亚，你的银行无法为你提供估算的价格或到达日期；你甚至可能不知道是否寄到了。你最好的办法可能是用\
  \ `UPS` 邮寄一叠现金——这样你就能获得保险和追踪，并且确切知道自己要付多少钱。\n\n简而言之，国际支付非常糟糕。汇款更是如此。国际汇款 200 美元（用于衡量汇费的基准）平均需要花费\
  \ 14 美元，而汇款 500 美元大约花费 25 美元——费用范围在 5-7% 之间。这些费用增长迅速：美国人每年在汇费上花费超过 300 亿美元。问题非常严重，以联合国已将汇费降至\
  \ 5% 以下列为其最大的国际发展目标之一。加密货币之所以重要，是因为无论你发送多少资金或发送到哪里，它的运作方式都是一样的。无论你是在当地咖啡馆买一杯 5 美元的咖啡，还是向巴布亚新内亚发送\
  \ 1,000,000 美元，使用 `Bitcoin` 支付的时间完全相同（大约一小时），费用完全相同（大约 1 美元）。\n\n\n\n\n\n从美国向印度尼西亚汇款的各种方式近似成本。这意味着，与现状相比，使用加密货币进行小额国内支付表现平平，但对于大额或国际支付具有改变游戏规则的意义。在国际汇款方面，加密货币远优于现状，这正是为什么\
  \ Facebook（其大部分增长来自发展中国家）如此热于使用 `Diem` 进行支付的原因。\n\n## 挣扎\n`Diem` 的商业逻辑是合理的，其设计成功避开了许多通常会让加密货币陷入困的陷阱。`Diem`\
  \ 挂钩一篮法定货币，从而降低了其波动性，使其成为支付的理想选择。Facebook 及其合作伙伴对 `Diem` 的未来拥有几乎完全的控制权，从而降低了叛变或硬分叉导致货币分裂的风险。\n\
  \n然而，Facebook 很快遇到了问题。美国参议员对 Marcus 就 `Diem` 进行了质询，称将人们的钱交给 Facebook 是“幻幻的”。鉴于人们对\
  \ Facebook 隐私实践的广泛不信任，媒体和公众对 `Diem` 持怀疑态度。最糟糕的是，与 Facebook 合作推出该货币的主要支付处理器（包括 `Visa`、`Mastercard`、`Stripe`、`eBay`\
  \ 和 `PayPal`）在货币宣布后的短短几个月内全部退出了。\n\n但为什么呢？可能是 `Diem` 试图兼得所有。加密货币爱好者对 `Diem` 将权力集中在大型科技和金融公司手中的做法感到反感——这与加密货币通常的民主化、去中心化和消除金融中间人的理念背道而驰。同时，支付处理器担心违反严厉的反欺诈和洗钱法律，而\
  \ `Diem` 似乎想尽可能规避这些法律。无疑，他们被美国参议员寄给他们的封信吓到了：Facebook 似乎想要参与金融活动的好处，却不想承担作为金融服务公司受监管的责任……\
  \ 如果你接受了这一点，可以预计监管机构不仅会对 `Libra` 相关活动，还会对所有支付活动进行高水平的审查。\n\n# 结论\n`Diem` 是一个雄心勃勃的项目——对于它推出的那个时代来说可能过于雄心。当时的监管尚未到位，没有人知道私有公司如何以及应该如何使用加密货币正确模型，Facebook\
  \ 大多数金融行业合作伙伴也没有准备好尝试。`Libra` 的未来仍有待观察，但显然，这并非易事。\n\n从大局来看，`Diem` 是加密货币以违背其初衷的方式被使用的典型范例。`Bitcoin`\
  \ 的发明是为了消除中间人、绕过银行、使交易透明化，并为普通用户提供盈利和参与货币未来的机会（例如通过 `mining`）。`Diem` 恰恰相反：它由巨型科技和金融公司运营，所有的支付和数据将流经\
  \ Facebook，`blockchain` 可能对公众不可，而普通用户对其未来没有话语权。这是对加密货币价值观的背叛吗？还是尝试走向主流的代价？这是一个主观判断，但它至少说明加密货币并非千篇一。\n\
  \n### 代币化\n许多人将货币的未来视为加密货币与法定货币之间的战斗，但这并不是准确的划分。实际上，法定货币可以通过一种名为 `tokenization`（代币化）的过程采用加密货币的某些元素，或者当一个国家开始将其货币表示为加密币。\n\
  \n一个思想实验可以让这一点更清晰。假设美联储宣布了一种新的 `AmeriCoin`（简称 `AMC`），这是一种你可以从美联储购买每个 `$1` 美或向美联储卖出每个\
  \ `$1` 美元的加密币。目前，银行、信用卡公司、投资账户和其他金融机构将账户余额表示为数据库中的数字。但在这个世界中，这些机构将实际持有 `AMC`。当雇主支付工资时，它会将\
  \ `AMC` 发送到你的银行账户，该账户会在 `wallet` 中持有你的 `AMC`。当你支付信用卡费用时，你会让银行将 `AMC` 发给信用卡公司。如果你想申请车贷，贷款人会将\
  \ `AMC` 发送到你银行的 `wallet`，并可能设置一个 `smart contract`，每月自动从你银行的 `wallet` 中扣除 `AMC` 作为利息。在更宏观的尺度上，当美联储想要增加或减少流通货币量时，它通过向银行买卖债券。目前，美联储保留着每个参与银行持有多少资金的内部账本，当它买卖债券时，只需更新银行的信用总额——实际上没有现金交易。在这个新世界中，美联储可能会实际向银行发送或接收\
  \ `AMC` 以交换债券（债券可能也被表示为加密代币）。如果政府真的想推动 `AMC` 的采用，它甚至可以（或要求）美国人通过向 `IRS` 发送 `AMC`\
  \ 来纳税。（据说政府可以通过强制人们用货币交税来使其产生价值；在这种情况下，它可能会鼓励或迫使人们使用 `AMC`）。\n\n### 代币化的局限影响\n这个代币化美元的新世界在表层之下可能有所不同——底层交易使用加密币——但不会改变太大。对于普通居民来说，效率可能会小幅提高，因为所有金融机构都将相互兼容——不再再有在账户、投资和贷款之间转移资金的烦恼。政府可能会获得一些处（很少有人深入思考过货币代币化实际上如何运作，所以这主要是推测）。取决于\
  \ `blockchain` 的设置，政府可能能够通过追踪更多交易来打击逃税行为（据说政府可以通过强制人们用货币交税来使其产生价值；在这种情况下，它可能会鼓励或迫使人们使用\
  \ `AMC`）。让每个人使用 `blockchain` 这是一个判断问题，但它至少显示加密货币并非完全相同。虽然代币化可能会带来一些效率和安全性，但可能不会改变经济结构。作为一个类比，考虑美国\
  \ 1933 年到 1971 年退出金本制——退出金本制让经济更加稳定，因为政府可以自由创造或销毁货币。无论如何，大多数经济结构保持不变：银行、纸币、贷款、信用卡等等。同样，如果每个人使用\
  \ `AMC` 而不是纸币进行转账，这些金融机构将会存在。换句话说，加密货币在货币中的角色将类似于：在表层之下提升了效率，但远非普通消费者的触及。\n\n###\
  \ 中国的人民代币化\n当我们与沃顿学院教授区块链学者 Kevin Werbach 交谈时，他迅速点出一个对货币代币化特别感兴趣的国家：中国。我们认同他的直觉。中国并未隐藏其正试图让人民币成为全球主要的储备货币。储备货币是货币的通用语言：世界各国使用储备货币偿还国际债务、购买黄金和石油等商品并与其他国进行贸易。国际货币基金组织（IMF）有一份世界顶级储备货币清单：美元、欧元、英镑、日元以及——截至\
  \ 2016 年的人民币。中国加入这个俱乐部对该国家来说是个好消息，因为这是国际货币基金组织（决定储备货币清单）的认可，它帮助中国更深地融入全球市场，并让中国与其他国家做生意变得更容易（因为它现在可以用人民币与任何人交易，而无需转换其货币）。但美元仍然是老大，中国想取代它成为最流行的货币。让货币脱颖而出以摆脱美元的阴影，但如果中国在任何其他人之前对其货币进行代币化，它可以提出一个有力的论点，证明自己与众不同，因此值得特别关注。中国近年来也因货币贬值而声誉狼。。人民币挂钩一篮货币，汇率由中国政府设定——北京可以选择任意下调汇率，使人民币在其他货币中的价值更低。此举增加了出口，因为相同数量的美元可以买到更多人民币，从而买更多商品；这有助于中国的出口导向型经济。这被广泛认为是不公平的，因为它给了中国一个人为的优势，并损害了没有这样做的国家。\n\
  \n### 代币化的成本\n我们认为在未来几十年里，各国很可能会对其货币进行代币化——代币化可能需要大量工作，但可以提高效率和安全性，而且代币化的副作用并没有你想象的那么大——金融系统将保持相似。虽然我们的思想实验提到消费者可能会处理\
  \ `AmeriCoin`，但我们认为这在实践中是不可行的。普通人不想处理 `wallets`、私钥、不可逆的交易等烦恼。目前的金融系统已经足够困惑了。相反，我们认为加密货币主要将在表层之下使用，例如用于银行间交易或大额支付。这与\
  \ 1933 年到 1971 年美国使用的纸币形成了强烈的对比。这些从未供消费者使用。\n\n\n\n\n\n# 第 9 章 泡沫还是革命？\n\n“泡沫还是革命？比特币是一个比郁金香更严重的骗局……它终会破灭。”——詹米·戴森（Jamie\
  \ Dimon），摩根大通首席执行官。\n\n“仍在思考 #Bitcoin。没有结论——既不背书也不拒绝。要知道，当纸币取代黄金时，人们也曾持怀疑态度。”——洛埃·布兰肯因（Lloyd\
  \ Blankfein），高盛前首席执行官。\n\n在最后一个章节中，是时候回到原点了：区块链、加密货币及相关技术仅仅是一个泡沫，还是一场真正的革命？\n\n\
  ## 货币的未来\n\n比特币企业家、扎克伯格的对手卡梅隆·温克沃斯（Cameron Winklevoss）像许多著名的加密货币支持者一样认为加密货币是“货币的未来”。在我们看来，情况比这复杂。我们已经探讨了代币化；它可能没有那么惊天动地，但并不是坏主意。因此，随着时间的推移，各国很可能会开始将其经济的一部分代币化。有充分的证据表明中国正在这样做，巴西和新加坡也开始探索代币化。\n\
  \n但从经济学角度来说，代币化的法币仍然是法币：政府最终控制货币，而货币的价值完全取决于对国家政府的信任。换句话说，任何政府控制的加密货币行为都可能与今天的法币相似。\n\
  \n更有趣的问题是：私有的加密货币（比特币、以太坊、门罗币等）会取代政府的货币吗？这将就像回归金本位，因为政府对经济将没有太大控制权，货币的价值将由政府控制之外的力量决定。\n\
  \n## 公民的愿望\n\n要回答这个问题，首先从公民的角度思考会有帮助。人们会想用比特币来进行所有的财务活动吗？使用加密货币进行所有财务活动有几个明显的红旗信号：\n\
  \n- 对于小额购买，加密货币比目前的支付方式更糟糕。由于你进行的大多数购买金额很小，这个痛点很难被忽视。\n- 支付是不可逆的，这使得黑客攻击变得困难，但对消费者来说也是危险的。已经有了恐怖故事，有人的\
  \ `Coinbase` 账户被破解后损失了 10 万美元——而且与传统金融系统不同，绝对没有追回被盗的钱。许多人不愿承担巨大的风险。\n- 波动性仍然是一个巨大的问题。到目前为止，所有稳定币都挂钩了法币。如果没有了法币，很难看到制作稳定币的新方法。也许未来主流加密货币的波动性会大幅下降，但这很难预测。\n\
  - 正如沃顿商学院教授凯文·韦尔巴赫（Kevin Werbach）告诉我们的那样，加密货币对于普通人来说仍然太笨拙、难以使用。管理私钥和多种货币是一件麻烦事。而且由于一次失误（例如将\
  \ `bitcoin` 发送到错误的地址）就可能让你的钱永远消失，如果人们误解了关于加密货币的任何一点点，真的会陷入大麻烦。事实上，美国的金融盲识率已经高得惊人：例如，三分之二的美国人无法正确计算利息支付。必须使用加密货币会让人们的生活变得更加困难；货币不应该困难到你必须读一整本书（比如这本！）才能正确地理解它们。\n\
  \n\n\n\n简而言之，大多数人都想要一个能够顺畅运行的货币体系：它是稳定的、宽容的且易用的。在所有这些方面，加密货币都输给了我们现有的体系。普通人并不怎么在意去中心化。因此，我们不会看到整个群体都在呼吁用加密货币取代其政府运营的货币。\n\
  \n# 国家的诉求\n\n既然自下而上采用加密货币的理由并不充分，那么自上而下采用的理由如何呢？国家会放弃对自身货币的控制权，并将例如 `Bitcoin` 设为法定货币吗？这个问题本身已经有了了答案：在有选择的情况下，国家不会自愿放弃对金钱的控制。正如前纳斯达克（Nasdaq）执行副总裁约翰·雅各布（John\
  \ Jacobs）所解释的那样，如果一个国家将 `Bitcoin` 作为主要货币，央银行监管经济将变得困难得多。为了避免价格的突然波动，央银行需要不断调整流通中的货币总量，即货币供应量。\n\
  \n货币供应必须与居民想要使用的货币总额（即货币需求）匹配。假期期间，由于人们购物增多，货币需求会上升；而在衰退期间，需求会下降。在法币体系下，像美联储（`Fed`）这样的央行可以通过向银行买卖债券来随心所欲地创造或销毁货币，从而很容易根据需要改变货币供应。但在基于比特币的系统中，银行无法印钱——它必须持有数十亿美元的\
  \ `Bitcoin` 储备，并将这些储备注入或从经济中移除。国家仍然可以改变货币供应，但其限制会大得多，活性也更低。\n\n![白色背景上的文字特写，自动生成的描述](img/image_rsrc7HJ.jpg)\n\
  \n美国通胀率，1971 年标记有一个钻石。在那一年之前，美国（至少部分）实行金本位制。注意在美国采用法币后，通胀率下降了多少。来源：In2013Dollars。这与美国的金本位时代非常相似。1971\
  \ 年以前，政府必须在肯塔基州的诺克斯堡（Fort Knox）囤积大量黄金以执行货币政策或与外国进行贸易。而且，如果你看过詹姆斯·邦德的电影《金手指》（`Goldfinger`），你就会知道这么多黄金放在同一个地点是多大的安全风险。\n\
  \n如果美联储必须在某个钱包中保留大量的加密货币储备，你可以完全打赌，全世界的黑客会不停地攻击它。但金本位制最终起作用的问题是囤积：在经济不确定的时期，人们倾向于囤积黄金，这使得政府更难获得黄金。可用黄金减少，政府就无法向经济注入足够的资金（这会模拟注入），这意味着经济将继续变得虚弱。这意味着微小的经济问题会被放大。\n\
  \n如果政府必须使用加密货币，恰恰会发生这种情况——而且没有任何政府希望这样。因此，一个国家失去调节经济的能力在经济学上是不合逻辑的。此外，加密货币对于运行整个经济来说是不切实际的。记住\
  \ 2017 年 12 月著名的 `Bitcoin` 大崩盘——当想要交易 `Bitcoin` 的人数达到顶峰时，交易需要数小时才能处理，费用曾短暂飙升 50\
  \ 美元。如果一个国家所有的金融交易都在 `Bitcoin` 上进行，我们可能会看到比 2017 年 12 月更严重的拥堵、长时间的等待和高交易价格。\n\n\
  虽然大多数国家都不想放弃政府运营的货币而转向加密货币，但货币极其稀缺的国家可能是个例外。虽然加密货币波动剧烈，但它们仍比彻底崩溃的货币要好：例如，委内瑞拉玻利瓦尔的年通胀率曾高达\
  \ 830,000%，津巴布韦元在 2008 年曾达到年通胀率 800 亿（价格每天翻倍！）！相比之下，`Bitcoin` 偶尔的双位数波动似乎是非常温和的。因此，面临极端货币困境的国家可能会采用加密货币来实现相对稳定。\n\
  \n![](img/image_rsrc7HK.jpg)\n\n津巴布韦臭名昭彰的 100 万亿钞票，是在 2008 年该国发生严重恶性通胀期间印刷的。来源：Wikimedia。然而，如果一个国家已经计划放弃自己的货币，为什么不直接像津巴布韦那样采用像美元这样历史悠的货币呢？那将产生比加密货币大得多的稳定性。\n\
  \n# 结论\n\n在正常的经济时期，大多数公民不想从政府支持的货币切换到像 `Bitcoin` 这样的非政府加密货币，大多数国家政府也不想这样做。但在经济或货币崩溃期间，我们可能会开始看到加密货币用于非官方的数字交易。\n\
  \n例如，在 2008 年左右津巴布韦恶性通胀危机期间，人们开始非官方地使用从美元到日元再到印度卢比的一切货币。但获取这些货币（无论是现金还是数字形式）都很困难。获取加密货币相对容易。尽管加密货币有许多缺陷，但它们可以作为任何人、任何地方易于获取的最后手段。在加密货币出现之前这是不可能的，因此它们对此值得许多赞誉。总之，虽然政府运营的货币可能会“加密化”，但我们认为它们在短期内不会消失。非政府运营的加密货币在货币体系中也有自己的位置，但我们不预计它们很快就会推翻美元或欧元。\n\
  \n# 加密货币的真实用途\n\n这一切并不是说加密货币毫无用处。它们具有货币中独有的属性，因此在特定领域做出了价值的贡献。在我们看来，加密货币最有用的两个地方是支付和投资。\n\
  \n## 支付\n\n正如我们在书中提到的，加密货币的独特特性之一是：无论你发送多少、发送给谁，每笔交易的费用都是一样的。事实上，在加密货币出现之前，这是不可能的。总而言之，虽然政府运营的货币可能会“加密化”，但我们认为它们在短期内不会消失。非政府运营的加密货币在货币体系中也有自己的位置，但我们不预计它们很快就会推翻美元或欧元。\n\
