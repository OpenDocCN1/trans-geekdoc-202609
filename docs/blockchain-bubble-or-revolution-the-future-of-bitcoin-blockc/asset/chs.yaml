- "# 区块链泡沫还是革命：比特币、区块链与加密货币的未来\n\n\n\n![](img/image_rsrc7FT.jpg)\n![](img/image_rsrc7FT.jpg)\n\
  \n\n\n\n献给我的朋友和家人，感谢你们无论我的梦想有多疯狂都支持我——Neel\n给我的家人和朋友，感谢你们支持我对事业的热爱，并帮助我克服恐惧，拥抱创业——Adi\n\
  给我的朋友和家人，感谢你们在我看似荒谬的尝试中提供无尽的支持——Parth\n\n\n\n比特币是将人类从寡头和独裁者手中解放出来的工具，只不过伪装成了暴富计划。——\
  \ Naval Ravikant, AngelList 创始人 1\n比特币可能是老鼠药的平方级。—— Warren Buffett, 伯克希尔韦首席执行官 2\n\
  \n\n\n\n那是 2017 年，联合国面临着一个难题。由于叙利亚惨腥的内战，一万名叙利亚难民逃往了邻国约旦的一处难民营。联合国世界粮食计划（WFP）在难民营内设立了超市，难民们可以在那里购买橄榄油和扁豆等物品，因此他们需要向难民提供资金来购买这些物资。但问题在于，仅仅给难民发放预付信用卡是行不通的。过去，这种方法由于手续费以及需要与当地银行建立合作伙伴关系，已让世界粮食计划花费了数百万美元——而这些钱本可以用于数百万顿晚餐。给难民发放可以领取物品的身份卡也行不通；当世界粮食计划过去尝试这样做时，当地的部落首领抢走了难民的卡片，并开始将其作为货币进行交易。于是，世界粮食计划转向了一种名为区块链的新兴技术，这种技术因作为数字货币`Bitcoin`的背后的技术而闻名。每个难民的“账户”都会存入一些资金，当难民去商店时，他们会通过虹膜扫描仪验证身份，然后用这些积分兑换食物和用品——而这一切无需打开钱包。商店随后可以将收集到的优惠券卖回给联合国。这个名为`Building\
  \ Blocks`的项目取得了巨大的成功。它将转账手续费降低了 98%，减少了欺诈，并为世界粮食计划和难民极大地简化了援助流程。联合国迅速扩大了该计划的规模，服务了\
  \ 10 万名难民，并计划最终为约旦的所有难民提供服务。\n\n对联合国而言，收益不仅限于援助：联合国宣布，未来他们可能通过`区块链`追踪难民的身份和生活轨迹，从而在他们的护照或教育记录被毁时，帮助他们在新国家寻找工作和贷款。全球范围内的人们对`区块链`及其姊妹技术——加密货币（如上述的`Bitcoin`）感到异常兴奋。《哈佛商业评论》曾思考`区块链`是否能颠覆沉闷的银行业，著名的风险投资家马克·安德森（Marc\
  \ Andreessen）表示区块链是“自互联网以来最重要的发明”，而世界各地的分析师认为，加密货币将彻底改变我们所熟知的货币和技术。\n\n另一方面，这些神秘的新技术也赢得了阴暗的声誉。毒枭利用`Bitcoin`在网上匿名兜卖毒品，加密货币也被指责加剧了全球变暖，还有人认为`区块链`仅仅一个泡沫。\n\
  \n\n\n\n# 比特币与区块链\n\n比特币首次让我们提供了一种方法，让一个互联网用户向另一个互联网用户传输唯一的数字资产，且这种传输被保证安全可靠，所有人都知道传输已经发生，并且没有人能质疑传输的合法性。这一突破带来的影响无论如何强调都不为过。——马克·安德森森（Marc\
  \ Andreessen），Andreessen Horowitz 联合创始人。\n\n> “信任的第三方是安全漏洞。我希望区块链领域的每个人都能把这一点记在心里。这基本上是整个设计的关键。”——尼克·萨萨博（Nick\
  \ Szabo），比特黄金（比特币的前身）的创造者\n\n2008 年的万圣节，一位自称中本聪（Satoshi Nakamoto）的计算机科学家发布了一份白皮书，引入了比特特币。这是一种数字货币，让人们无需通过银行、信用卡处理器或其他金融机构即可进行货币交换。没有人知道中本聪到底是谁，但他发布论文的邮件列表上的每个人都注意到了。通过一封邮件，中本聪向世界介绍了区块链和加密货币，这两项技术已成为家喻户晓的名称。但要理解这些技术，我们必须从解开这位神秘科学家的发明开始。\n\
  \n## 货币的问题\n\n在人类历史的大部分时间里，持有货币有两种方式：拥有实体物品（现金、金币、牲畜、盐等），或由像银行或首领这样受信任的机构来记录你拥有多少钱。这两种货币形式都有各自的问题。\n\
  \n现金或牛等实体或有形货币形式的缺点是显而易见的：它们容易被偷，无法用于在线或远距离交易（试着用现金给外国国家的人买东西），它们经常会被伪造，而且存储和运输非常麻烦。\n\
  \n## 中间人介的货币\n\n为了解决这些问题，人类发明了由银行或当地首领等信任机构中介的货币。许多货币和支付形式都属于这一范畴：银行账户、银行贷款、信用卡、支票以及我们现在使用的许多其他金融工具。通过信任一个中央机构或中间人，你可以解决实体货币的大多数问题：\n\
  \n* 你可以信任银行把你的钱存得比放在家里更安全（将银行账户与把现金塞在床垫下相比）。\n* 你可以进行快速的在线和数字支付，因为给某人付款就像让你的银行和他们的银行更新账户余额一样简单（这些余额只是某处数据库中的数字）。\n\
  * 当受信任的权威准确跟踪每个人拥有多少钱时，造假币就更难了。（因为没有关于每个人拥有多少现金的中央记录，发现伪造者的唯一方法是希望你能分清假钞和真钞。）\n\
  * 如果你信任中间人帮你持有你的钱，你就不需要随身携带任何钱了。\n\n\n\n\n\n这种由中介引导的货币确实非同凡。但人们仍然使用现金、某些商店只接受现金是有原因的：由中介引导的货币（我们将其简写为\
  \ `M3`）也有其缺点，其中大多数问题都源于存在中介这一事实本身。\n\n第一个问题是：当你的资金流经中介机构时，你必须按照他们的规则办事，这通常意味着必须支付费用。当你用信用卡支付时，商户并不会获得全部资金；他们必须向信用卡处理商支付费用（`Visa`、`Mastercard`\
  \ 和 `Discover` 的费用约为 1.5-2.5%，而 `American Express` 为 2.5-3.5%）。使用 `PayPal` 进行国际汇款将花费你支付约\
  \ 3% 的手续费，如果你是商户，接受 `PayPal` 支付也将花费你约 3%。通过 `Western Union`、`MoneyGram`、`Xoom` 或其他汇公司向国外汇款的费用也可以几个百分点。你现在可以明白为什么很多商店只接受现金，或者对使用信用卡设置了最低消费金额了。\n\
  \n`M3` 的另一个问题是，你只有在中介允许你访问时才能使用它。在实际上，这意味着全球两亿没有银行账户的人无法使用任何涉及银行账户的货币（也就是大部分 `M3`），而且信用记录糟糕或没有信用的人无法使用信用卡。\n\
  \n`M3` 的最后一个大问题是你将资金托付给了他们——而且在今天，还有你的数据。银行在不丢失你的资金方面很不错，但金融机构在数据安全方面的记录远没有那么好。2014\
  \ 年，黑客盗了 1 亿 `JPMorgan` 客户的数据；2019 年，1 亿 `Capital One` 客户的敏感信息（出生日期、地址等）被盗。更不用说可能是最臭名的黑客攻击了：`Equifax`\
  \ 被盗了近 1.5 亿美国人的个人数据（包括社会安全号码）。简而言之，实物货币是不安全、不方便、易于伪造，且对于数字支付而言并不实际。由中介引导的货币（即 `M3`）解决了这些问题，但引入了费用、缺乏便利性以及另一种形式的不安全问题。\n\
  \n### 无形性\n但如果你仔细考虑，你会意识到我们对货币真正需要的是无形性。`M3` 通过引入中介赋予了你无形性：如果你信任机构为你管理和移动你的资金，你就不再需要持有实物货币了。但当然，中介也有其缺点。是否有方法可以在保留无形性的同时去掉中介？换句话说，你是否可以拥有一种既无形又无中介的货币形式？你可能明白我们在表达什么。但事实证明，在\
  \ `Satoshi` 引入 `Bitcoin` 几个世纪之前，人们就已经发明了无形且无中介的货币形式。为了见到这些人，我们必须访问太平洋中部微小的密克罗尼西亚岛屿——雅浦（Yap）。\n\
  \n### 石石\n雅浦的传统货币是被称为“石石”（rai stones）的巨大圆环。这些石头巨大：有些直径达十英尺，重量像一辆皮卡。每个雅浦村庄都有几十块石石散落在镇上。\n\
  \n![带有灌木和树的石头，自动生成的描述](img/image_rsrcFU.jpg)\n石石，雅浦岛的传统货币形式。来源：Wikimedia\n\n正如你可以想象的，人们不能拖着这些石头在岛上到处跑支付。相反，雅浦人集体记忆每块石头的所有者，并对交易进行心理记录。例如，如果酋的女儿想从木匠那里买一艘船，她可能会向村民宣布，她控制的一块石头（比如海滩上的那块）现在属于木匠了。村民会口传说酋的女儿送了木匠一个块石头。然后，如果木匠想把那块石头送给别人，村民会允许，因为每个人的心理记录都显示那块石头现在属于他。（粗略来说，如果大多数村民同意你拥有某块石头，你就可以花掉它。）\n\
  \n### 无形性\n石石系统令人印象深刻的地方在于，各种经济活动都可以在石头物理移动的情况下发生；事实上，即使某块石头明显在离你房子另一头，你也可以拥有它。事实上，如果某块石头再也无法被看到，你甚至可以使用它。几百年前，一艘载着石石的船在岸边沉没了。当地村民推断，这块石头仍然存在于海底某处，因此人们继续像什么都没发生过一样用这块石头互相支付！换句话说，在石石系统中，石头的物理位置和移动完全不重要。这与实物货币系统形成了鲜明对比，在实物货币系统中，钱的物理位置和移动是非常重要的：你拥有的钱只有你家里或身上的钱，你支付给某人的唯一方法就是把物品交给他们。这意味着石石系统是一种无形货币。它非常像银行里的钱，我们知道钱是无形的：当你给某人汇款时，无论钞票在哪里——或者它们是否存在！——都没有物理物品发生移动。\n\
  \n### 无中介\n此外，石石系统是民主的：如果你的大多数村民同意你拥有某块石头，你就拥有它。与其像在 `M3` 中那样信任单一的人或机构来跟踪你有多少钱，不如将信任分散到整个社区。这种民主机制让你可以拥有一种无中介的货币形式，正如我们之前讨论的，系统。在\
  \ `M3` 世界中，你会信任银行或机构来记录你的资金；相反，比特币（Bitcoin）依赖全球的计算机网络来维护历史记录或账本。这种所谓的“共享账本”被称为区块链（blockchain）。\n\
  \n### 比矿\n我们不知道 `Satoshi` 在开发比特币时是否研究过雅浦，但他的见解非常相似。比特币是一种数字货币，它是无形的，而且理论上是无中介的，因为它不依赖银行或其他机构来跟踪人们的余额。###\
  \ 矿\n制作这样一个表格的一个明显缺陷是有人可能会花费他们没有的钱。显然，在 `M3` 世界中，你会信任银行或机构来这样做；那违背了初衷。相反，比特币将这种验证工作外包给社区成员。任何比特币用户都可以使用计算机验证处理中的交易，并将有效交易添加到区块链中。为了效率，交易被打包成区块（blocks）。但当然，人们不会免费执行验证交易的工作，因此比特币软件必须投入一些资金来激励他们。如果你验证了一个区块，你将在每笔交易中获得一些费用，比特币软件还会支付你固定数量的比特币，被称为区块奖励。区块奖励中的比特币在验证之前并不存在——软件凭空产生的。由于比特币将自己视为黄金的数字版本，且验证者投入工作提取新货币，这种验证过程被称为挖掘（mining），而验证者被称为矿工。（你用电脑而不是铲子和铁锹进行挖掘，但业务模式大致相同。）所以，如果我们回到\
  \ Google 表格并让它看起来更像真实的区块链，我们会添加区块、费用和奖励列，如下：\n\n![更高级的比特币区块链模型，包含挖掘、费用和奖励](img/image_rsrcFW.jpg)\n\
  更高级的比特币区块链模型，包含挖掘、费用和奖励。所以，C 挖掘了区块 B1，其中包含三笔交易，并为此辛苦赚了 28 个比特币： 25 个来自区块奖励，每笔交易各\
  \ 1 个。弹出测验：假设每个人（A、B、C、D 和 E）最初都拥有 100 个比特币，在他们进行这些交易后，他们还有多少个？答案是：\n\n\n\n\n\n\
  -   A 向 B 发送了 10 个比特币并支付了 1 个比特币的手费，然后向 D 发送了 15 个比特币并支付了 1 个比特币的手费，接着向 E 发送了 5\
  \ 个比特币并支付了 1 个比特币的手费，最后收到了 10 个比特币。这意味着 A 最终拥有 `100 - 10 - 1 - 15 - 1 - 5 - 1 +\
  \ 10 = 77` 个比特币。\n-   B 从 A 处获得了 10 个比特币，并向 C 发送了 2 个比特币（加上 1 个比特币的手费）。因此 B 现在有\
  \ `100 + 10 - 2 - 1 = 107` 个比特币。\n-   C 通过挖掘区块 B1 获得了 `25 + 1 + 1 + 1 = 28` 个比特币，因此他们有\
  \ `100 + 28 + 2 - 10 - 1 = 119` 个比特币。\n-   D 现在拥有 `100 + 15 - 5 - 1 = 109` 个比特币。\n\
  -   E 也通过挖掘区块 B2 获得了 28 个比特币，因此他们有 `100 + 5 + 28 + 5 = 138` 个比特币。\n\n\n\n\n# 区块与链\n\
  \n事实证明，我们的电子表格模型仅仅是一个模型。它是一种简化。真实的比特币区块链并不以类似电子表格的格式存储区块。相反，比特币区块链将区块存储在一个线性的“链”中，其中每个区块在数学上都指向上一个：[\\\
  [42\\]](#part0040.xhtml#a561) ![](img/image_rsrc7FX.jpg)\n\n区块链将区块存储在一条线性链中；`txn`\
  \ 是比特币中“交易”（transaction）的缩写。每个区块都引用前一个区块，但计算机科学家通常像这样绘制链，箭头从一个区块指向下一个，这样更符合直觉。通过这种方式，尽管区块没有明确的编号，区块的顺序也是清晰的。\n\
  \n想象一下，如果你拿起一本平装小说并撕掉了所有的页面，同时去除了所有的页码和章节码。然后想象你把这些页面散落在地板各处。尽管如此，你仍然可以将页面按顺序放回，因为每一页都隐含地引用了上一个页发生的事情。（例如，如果第\
  \ `X` 页结束于一个角色开车来到法院，而第 `Y` 页开始于该角色走进法院，你可以很确定第 `Y` 页紧随第 `X` 页之后。）\n\n比特币的哈希显然没有情节的概念，因此区块通过数学方式相互引用。具体来说，它们使用一种名为哈希（hashing）的数学技术，你将大量信息（单词、数字、比特币区块等）输入算法，算法会输出该信息的简短“指纹”。[\\\
  [43\\]](#part0040.xhtml#a541)\n\n我们人类经常使用哈希，例如使用字母缩写。一个长名字很容易浓缩为几个字母：像“John Fitzgerald\
  \ Kennedy”这样的长名字可以变成像“JFK”这样短的名称。你有一个输入（全名）；一个哈希函数（提取某人字母缩写的过程）；以及一个输出，或哈希值（字母缩写）。\n\
  \n计算机使用更复杂的哈希函数——最流行的算法是 `MD5`[\\[44\\]](#part0040.xhtml#a4K3) 或 `SHA-256`[\\[45\\\
  ]](#part0040.xhtml#a4K4) 算法——但核心思想是相同的：海量的数据输入变成简短的输出。\n\n在比特币中，每个区块都有一个关联的哈希。每个区块的哈希部分基于其前一个区块的哈希。[\\\
  [d\\]](#part0040.xhtml#a6PJ) 这样，每个区块都引用它的前一个区块。所以，如果你有一个无序的区块及其关联哈希列表，你可以很容易地将区块恢复排序，就像那个通过观察情节连接排列页面的人一样![](img/image_rsrc7FY.jpg)\n\
  \n区块通过它们的哈希值链在一起；每个哈希都是根据（包括其他因素）前一个区块的哈希计算得。（哈希中的数字和字母是怎么回事？哈希以十六进制（或 16 进制）格式编写。[\\\
  [e\\]](#part0040.xhtml#a601) 它们也比 4 个字符长得多[\\[46\\]](#part0040.xhtml#a602)，但我们的简化版本目前足够了。）因此，比特币将交易分组成区块，并将它们在链中链接。区块，遇见链。\n\
  \n# 分支与欺诈\n\n回看我们基于哈希的链系统，你会发现它实际上并不要求将区块放入线性链中。没有任何东西阻止你让两个或多个区块紧跟在一个给定区块之后：![手机屏幕自动生成的截图](img/image_rsrc7FZ.jpg)\n\
  \n多个区块可以引用任何给定区块作为其前身，因此区块链可以（并且确实）产生分支。图片改编自：Satoshi Nakamoto[\\[47\\]](#part0040.xhtml#a6YA)\n\
  \n## 区块树\n\n结果是，区块链不必是线性链。事实上，它通常不是。区块链往往更像一棵“区块树”，有一个“树干”和“分支”：![一张包含对象的自动生成的图片](img/image_rsrc7G0.jpg)\n\
  \n区块链可以有很多分支，就像树一样（想象底部区块位于地面上，这张图看起来非常像一棵树。）最长的分支被认为是“官方”的。来源：维基百科[\\[48\\]](#part0040.xhtml#a64G)\n\
  \n当两个矿工同时生成（或“挖矿”）一个区块时，区块树有时会生长出一个分支。这是罕见的，但确实会发生。当这种情况发生时，会有交易从最近的交易中分叉出来，区块树的新分支诞生了。[\\\
  [49\\]](#part0040.xhtml#a75H)\n\n但是，就像雷石系统一样，比特币需要一个单一、线性的交易历史。你不允许多个分支共存。（你能想象告诉某人“在历史的一个版本中，我有\
  \ 500 美元，但在另一个版本中，我有 600 美元”吗？）\n\n## 最长链规则\n\n为了拥有线性的官方历史，比特币使用了一种被称为“最长链规则”的经验法则，该规则规定，“区块树”中包含区块最多的的分支就是官方区块链。[\\\
  [50\\]](#part0040.xhtml#a72T)\n\n最长链决定了你真正拥有多少钱、过去发生了哪些交易等等。如果它不在最长链上，它实际上就没有发生。运行在用户计算机上的比特币软件通过只向向最长链添加区块的矿工付费来执行最长链规则。[\\\
  [51\\]](#part0040.xhtml#a66)\n\n这通常足够让矿工遵守规矩。（尽管有一个不幸的副作用。如果两个矿工同时挖出一个区块，就会产生两个分支，只有一个分支会胜出成为最长链。另一个分支变成“孤区块”并被丢弃，那个挖了区块的倒霉矿工没有任何钱。这种“孤区块”现象每天发生几次。[\\\
  [52\\]](#part0040.xhtml#a66))\n\n## 链劫持\n\n但最长链规则仍然留下了漏洞。如果一个作恶的矿工创建一个新分支并比其他人挖得更快，导致他的分支更长了呢？那么，作恶矿工的分支将成为最长链，从而成为官方区块链。欺诈链上的所有区块将成为官方历史，而合法链上的某些区块会被丢弃。![手机自动生成的截图](img/image_rsrc7G1.jpg)\n\
  \n攻击者通过比其他人挖得更快来劫持区块链。（等等，提供的文本重复了“攻击者如何……所以就会成为官方区块链”。）\n\n实际上，提供的文本似乎有一些重复或断开的部分。让我们仔细继续：计算机使用更复杂的哈希函数——最流行的算法是\
  \ `MD5`[\\[44\\]](#part0040.xhtml#a4K3) 或 `SHA-256`[\\[45\\]](#part0040.xhtml#a4K4)\
  \ 算法——但核心思想是相同的：海量的数据输入变成简短的输出。在比特币中，每个区块都有一个关联的哈希。每个区块的哈希部分基于其前一个区块的哈希。[\\[d\\\
  ]](#part0040.xhtml#a6PJ) 这样，每个区块都引用它的前一个区块。所以，如果你有一个无序的区块及其关联哈希列表，你可以很容易地将区块恢复排序，就像那个通过观察情节连接排列页面的人一样![](img/image_rsrc7FY.jpg)区块通过哈希链在一起；每个哈希都是根据（包括其他因素）前一个区块的哈希计算的。（哈希中的数字和字母是怎么回事？哈希以十六进制（或\
  \ 16 进制）格式编写。[\\[e\\]](#part0040.xhtml#a601) 它们也比 4 个字符长得多[\\[46\\]](#part0040.xhtml#a602)，但我们的简化版本目前足够了。）所以，比特币将交易分组成区块，并将在链中链接。区块，遇见链。\n\
  \n*注：用户提供的输入文本在结尾有大量的重复和混乱的句子。我根据提供的规则清理了核心逻辑流。*\n\n等待，再次查看提供的输入，“最后”部分是之前章节的混乱内容。我将重新格式化*整个*文本，应用反引号和格式规则。\n\
  \n\n\n\n\n| Nonce | 输入 | MD5 哈希 |\n| --- | --- | --- |\n| 29 | hello29 | fc12c051dd3eb4d7beb430f362522fda\
  \ |\n| 30 | hello30 | 868594340dd4f911fcbdbebf80dbdcaa |\n| 31 | hello31 | 5cebee1d96882e6325b758a1fbd80b02\
  \ |\n| 32 | hello32 | ce62f2f1d58fe37381a2ac08fc544467 |\n| 33 | hello33 | 005529451481309d2b8f708bbb81ea41\
  \ |\n| 34 | hello34 | 45c66648b3d94b4e46a6ba796fbee7af |\n| 35 | hello35 | 44ee8f3e8ef0f8e7085193d123b20a9e\
  \ |\n| 36 | hello36 | 092962df00b7139faca15313ff345c4e |\n| 37 | hello37 | c1b4349f3222aec9916dd1fbe65c02fe\
  \ |\n| 38 | hello38 | ebcd88fab0212bad35bde21c11185754 |\n| 39 | hello39 | 2206e08b5186fc0c5d4239259f09037f\
  \ |\n| 40 | hello40 | 5886c943b32a6dd596b19b5897c0306d |\n| 41 | hello41 | 20ce5b4e49c7847661a9bf6edfd35760\
  \ |\n\n\n\n\n哈希输出实际上是随机的，因此你必须不断猜测随机数（nonce），直到获得幸运的哈希。在这种情况下，第一个获胜的随机数是 `33`。现在想象一下如果你必须挑选一个哈希至少包含四个前导零的随机数。那么每\
  \ `164 = 65,536` 个随机数中才有一个能产生获胜哈希。（如果你好奇，最小的获胜随机数是 `105,484`；“hello105484”的 `MD5`\
  \ 哈希为 `0000049898d233686087e44bc2a1c97a`，实际上有五个前导零。别担心，我们写了代码来猜这个。（58)）。尝试为比特币挖掘猜测正确的随机数甚至更加困难。在写作时，你尝试的每个随机数挖掘区块的概率大约为\
  \ 1 比 `66,000,000,000,000,000,000,000`（那是 66 后面跟着 21 个零，或者说是 66 京）。（59)(60。那个巨大的数字与宇宙中的恒星数量并不遥远。（61)。\n\
  \n## 武装自己\n猜出一个好的随机数，并推此挖掘区块，其困难程度怎么强调都不为过。如果你尝试用 MacBook 运行挖掘算法，大约需要两百万年才能猜出一个成功的随机数。（62)(i。由于显而易见的原因，严肃的矿工不会使用笔记本电脑挖矿。相反，他们购买配备了超专用计算机芯片——`ASICs`（或“应用专用集成电路”）的强大计算机。（63。\n\
  \n![自动生成的电路板描述](img/image_rsrc7G4.jpg)\n一个专门用于运行比特币哈希算法的 `ASIC`。来源：Wikimedia（65)。\n\
  \n这些强大的计算机以及它们的 `ASICs` 非常强大，但代价极其昂贵。一台售价 2000 美元的配备 `ASIC` 的中级挖矿计算机每秒可以计算约 56 万亿次哈希（`TH/s`），这意味着它每秒可以尝试\
  \ 56 万亿个随机数。（66)。但由于猜正确的随机数如此困难，即使是这样强大的硬件，在写作时也需要大约 38 年才能挖掘出一个区块。（67)(k)![](img/image_rsrc7G5.jpg)\n\
  `AntMiner S17 Pro`，一台售价 2000 美元的计算机，每秒可产生 56 万亿次哈希。来源：MiningCrate（68)。\n\n换句话之，挖掘比特币归结为几十年里盲目地掷一个数万面的骰子，希望你获得好运。\n\
  \n## 工作量证明\n如果这个系统看起来很浪费，那它确实很浪费，而且设计成这样是为了增加攻击者的难度。由于挖掘中最困难的部分是猜测正确的随机数，而猜测正确的随机数取决于你尝试了多少次，拥有更强大计算机的人更有机会获得让他们挖掘区块的幸运随机数。你的计算机越强，挖掘区块就越快。\n\
  \n另一个视角是：你的挖掘速度与你控制的全球总哈算力（每个矿工每秒哈希数的和）的比例成正比。回想我们那个想要挖掘比合法链更长的欺诈链的矿工例子。要实现这一点，她需要比所有其他“诚实”矿工总和更快挖掘区块，因此她需要控制全球超过\
  \ 50% 的哈算力。这种攻击被称为 `51% attack`，（69)），它是可能的，但对于我们心心勃勃的小偷蛋来说，购买所有那些 `ASIC` 超级计算机可能贵得无法承受。而且，除非这个攻击者能控制\
  \ 51% 的算力，否则她没有机会篡改区块链。\n\n简而言之，挖掘比特币必须投入大量工作（以及大量资金，因为这些 `ASICs` 并不便宜）。出于如此，比特币挖掘系统被称为\
  \ `proof-of-work`（工作量证明）：获胜者是那些为此此付出最多工作的人。（70)。如果挖掘运行几行代码那么简单，攻击者就可以轻易劫持区块链；通过随机数游戏增加挖掘难度是比特币威慑攻击者的方式。\n\
  \n## 凭证\n这是比特币和区块链谜图的最后一块。你如何确保没有人以你的名义伪造交易？在 `M3` 世界中，你只有登录账户才能发送资金（如 `Venmo` 交易或银行转账）。你的账户详情（如\
  \ `username` 和 `password`）由 `Venmo` 或你的银行等信赖金融机构持有。但当然，比特币的意义在于避免中间人。因此，需要你信任他人来保管的\
  \ `usernames` 和 `passwords` 是行通的。事实上，根本不应该有一个中心化的可以“注册”。那么你如何让用户管理自己的资金呢？\n\n###\
  \ 去中心化账户\n比特币通过依靠数学和概率来实现此。无中间人或去中心化的注册主要方法是让人们选择自己的 `usernames` 和 `passwords`。但没有中央服务器，用户无法检查想要的\
  \ `usernames` 是否被占用。解决方案：让用户从数万亿个随机“usernames”中选择，提供如此巨大的潜在集合，使得任何人获得已被占名称的概率微乎其微。\n\
  \n\n\n\n# 第 2 章 比特币经济\n\n货币有三个时代：基于商品的时代、基于政治的时代，以及现在基于数学的时代。——Chris Dixon，Hutch（后被\
  \ eBay 收购）的联合创始人\n\n要取得成功，货币必须既是交换媒介，又是相对稳定的价值储藏。目前完全不清楚 `BitCoin` 为什么应该是一种稳定的价值储藏。——保罗·克鲁曼（Paul\
  \ Krugman），诺贝尔经济学奖得主。\n\n\n\n自中本（Satoshi）宣布以来，比特币已经走过了很长的道路：每天交易的价值数十亿美元的比特币，流通中的币总量已超过\
  \ 1000 亿美元。虽然这种不寻常的新货币遵循着一些不寻常的新规则，但我们通过应用行过的经济学视角可以从中中学到很多。\n\n## 300 万美元的披萨\n\n\
  如你所知觉的，每枚比特币价值数千美元，而且有无数关于青少年因为幸运（或精明）的比特币投资而成为富翁的故事。（在这些新富青少年中，有一句引人入胜的格言：“如果你在未来十年内没有通过投资比特币成为百万富翁，那么‘那是你自己的错’。”）但如果你仔细思考，由一个匿名计算机科学家凭空创造的数字代币竟然价值，这似乎相当奇怪，更不用说单枚价值数千美元了。如果你制作了一个向所有来者发放虚拟代币的应用程序，人们可能不会排队互相购买它们，不会创建论坛讨论你代币价格的微小波动，也不会围绕你的代币建立庞大的公司。然而，这正是中本发明的实际发生的情况。\n\
  \n比特币并不是一夜之间变得价值数千美元的。起初，它们确实只是一个聪明软件所使用的玩具。但慢慢地，人们开始相信它们价值足够让人们投入真钱。那个故事像许多伟大故事一样，是从一个披萨开始的。\n\
  \n## 拉斯兹的交易\n\n2010 年 3 月，首个比特币交易所上线。这个网站让你可以将比特币与美元进行交易，反之亦然；上线时的汇率是每枚比特币 0.3 美分。\n\
  \n那年 5 月，一位名叫拉斯兹·哈尼泽（Laszlo Hanyecz）的佛罗里达州人在比特币论坛上发帖，向任何给他送来披萨的人提供 10,000 枚比特币（当时价值\
  \ 41 美元，每枚 0.4 美分）。他的要求非常灵活：“你可以自己做披萨”或者“从外卖店帮我点一份，”他说道。但他坚持要求“不要有奇怪的鱼类配料或之类的”（这是一个明智的决定）。\n\
  \n![盒装披萨 自动生成](img/image_rsrc7G7.jpg)\n2010 年拉斯兹·哈尼泽用 10,000 枚比特币购买的披萨。来源：拉斯兹·哈尼泽\n\
  \n一位名叫杰里米·斯图迪万特（Jeremy Sturdivant）的英国年轻人照办了，为他点了两个约翰爸爸披萨的大号披萨。这是第一次有人用比特币购买现实世界的物品。哈尼泽支付的\
  \ 10,000 枚比特币现在价值超过 3 亿美元。单枚比特币的价格已从每枚 0.4 美分飙升到截至本文写作时的每枚超过 30,000 美元。在短短十年内增长了\
  \ 750 万倍；平均每年增长了四倍以上。任何股票、债券、房产或其他传统的金融资产都无法这种增长速度。\n\n![](img/image_rsrc7G8.jpg)\n\
  比较 2010 年至 2020 年比特币、标普 500 指数和谷歌股票的增长。比特币比其他者波动得多，但作为交换，它的增长要快得非常得多。数据来源：Google\
  \ Finance 和 Blockchain.com\n\n问题是：比特币是如何增长得这么快的？这个最初只是玩具的数字代币又是如何获得货币价值的？\n\n##\
  \ 主观现实\n\n我们今天使用的多数货币都和比特币有同样的哲学问题。如果你被困在丛林或火星上，一张 20 美元钞只是一张无用的纸。但如果你在商店里，你可以用这张纸换取披萨、袜子、开罐器和其他各种商品。事实上，如果你给他们这张纸，他们甚至会开车带你在市内、为你剪草坪或看你的狗。这是为什么？一张纸如何获得这么多现实价值？这归结于历史学家瓦尔尔·诺亚·哈拉里（Yuval\
  \ Noah Harari）所谓的“主观现实”：你认为这东西有价值，是因为你知道其他人认为它有价值。\n\n农市场上的一个农民乐意用 20 美元钞换给你一些自制果酱，因为她知道别人会用这\
  \ 20 美元给她买食品、农用品和其他物品。以此类推。比特币的原理一样：斯图迪万特为哈尼泽买了披萨，是因为他知道最终可以将 10,000 枚比特币换成其他东西（美元、英镑或实物）。同样，今天的人会以超过\
  \ 30,000 美元的价格从你手中购买比特币，因为他们知道别人会以此交换商品、服务或现金。\n\n## 贝壳带\n\n这些主观现实是无常的东西：如果人们停止相信它们，它们就会崩溃。在欧洲人到达北美洲之前，被称为“瓦普”（wampum）的贝壳珠子在现今美国的东海岸沿岸被用作货币。这些珠子通常被串成精美的珠宝饰和腰带，以便于携带。\n\
  \n![](img/image_rsrc7G9.jpg)\n一条瓦普腰带；在美国独立战争之前，许多美国原住民将这些腰带作为一种货币形式。那时，一个拥有足够贝壳带的土著酋长可以支付一场盛大宴席的费用，或资助建造一座巨大的土木工程（当然，在上面会有一座专门供奉他的建筑）。它是怎么做到的？因为下一个部落的人会接受贝壳作为支付。即使是早期的殖民者也使用贝壳作为货币形式，因为他们知道部落会接受。贝壳的价值源于主观现实。但到\
  \ 18 世纪中叶，随着欧洲货币的接管，这种主观现实消失了。这始于少数部落停止接受贝壳；然后他们邻近的部落可能放弃了它，因为他们无法再与那些部落进行贸易；接着那些部落的部落也放弃了它，以此类推。因为人们对贝壳的接受取决于他人对贝壳的接受，产生了一种多米骨牌效应：贝壳系统的微小冲击导致了贝壳货币的广泛崩溃。最终，甚至原住民部落也要求用银币支付（讽刺的是，由于主观现实，银币也有价值）。\n\
  \n贝壳的故事显示人们的接受取决于他人的接受，产生了一种多米骨牌效应：当少数人放弃时，所有人都会放弃。但相反，比特币的快速增长表明这些反馈循环是有用的：当少数人（包括哈尼泽和斯图迪万特）开始相信比特币有价值时，越来越多的人加入了。今天，全世界都相信比特币是有价值的；人们如此深信它，以至于将一些退休储蓄存入。这种正反馈循环让比特币蓬勃发展；最困难的部分是让人们相信它。这就是为什么哈尼泽购买披萨是如此重要：这是世界上第一次看到有人认为比特币是有经济价值的工具，而不是新奇。\n\
  \n## 货币供应\n\n主观现实解释了为什么比特币最初有价值，但现在的问题是为什么比特币实现了数百万倍的价格增长。这是一个百万美元（或每枚？）的问题，但像许多经济问题一样，它归结于供需。经济价值源于稀缺性（尝试在沙漠中卖），而稀缺性可以通过限制供应来实现。比特币维持价值的一种方式是限制货币供应：流通中的比特币数量是有封顶的，而且每天都在缓慢增长。\n\
  \n## 减半奖励\n\n记住矿工奖励，这是获得新比特币的方式之一。事实上，这是新比特币进入世界的唯一方式。比特币软件会自动调整难度（即哈希值前导零的个数），使得平均每\
  \ 10 分钟产生一个区块，因此每 10 分钟产生一批新币。问题的关键在于矿工奖励每四年减半一次：原始奖励是 2008 年的每枚 50 个；2012 年减半为每枚\
  \ 25 个；2016 年再次减半为每枚 12.5 个。最近一次减半（写作时）发生在 2020 年 5 月，奖励降至每枚 6.25 个。\n\n![](img/image_rsrc7GA.jpg)\n\
  每年挖掘的比特币数量呈指数级下降，导致比特币的总数达到平台期。数据来源：Bitcoin Wiki\n\n如果你推演这一趋势，你会发现第 33 次减半后，矿工奖励将正式归零。届时，将挖掘了\
  \ 2100 万枚比特币，供应将永远不再增长。但是，由于指数级衰减，货币供应将在 2030 年中期达到平台期，届时 99% 的可用比特币已被挖掘。在那之后，供应增长将变为微流（从\
  \ 2100 年到 2140 年这 40 年里，将挖掘出一个比特币）。\n\n## 比币丢失\n\n有趣的是，比特币的供应可能会随着时间的推移而减少。比特币去中心化的系统意味着如果你丢失了私钥，就无法找回比特币；当然，考虑到公钥或地址也几乎无法找回。这意味着如果你将私钥存储在外部硬盘上并弄丢了，与私钥相关的比特币将永远无法访问。比特币丢失实际上非常常见：据估计，30%\
  \ 的所有挖掘出的比特币已经丢失。如果真实的比特币丢失率大于区块奖励的产生，那么比特币的供应实际上在收缩。\n\n## 需求\n\n对我们来说，比特币的供应很容易量化和预测；有公式可以让我们精确计算未来将挖掘出多少比特币。但遗憾的是，理解比特币的需求要困难得多。没有单一的数字可以作为需求的衡量标准，也很难对需求的未来去向做出数学预测。\n\
  \n## 热度理论\n\n需求故事在比特币早期（2014 年及更早）相对清晰，当时比特币刚刚起步。这段时间，需求的主要限制因素是没有人听说过它，所以每当媒体报道比特币时，需求就会出现预测性的增长。2014\
  \ 年，研究发现提到比特币的文章数量增加 1%，比特币价格平均上涨了 0.3%（或者用投资者的话说，30 个基点——一个 0.01%）。很多对比特币的报道是负面的：当时的一些头条新闻包括\
  \ 2014 年 Gox 交易所（当时最大的交易所）被盗 740,000 枚比特币，以及美国政府在 2013 年查禁仅接受比特币的在线市场丝绸之路。但正如俗语所说，任何宣传都是好的宣传；比特币价格从\
  \ 2013 年 1 月的 13 美元飙升到 12 月的 100 多美元。网络热度和口口碑是更强大的因素：同样的研究发现，搜索比特币的数量增加 1%，比特币价格平均上涨了\
  \ 0.5%（50 个基点）。事实上，比特币价格与公众对技术的兴趣（以交易总量衡量）之间的关系直到 2014 年中期都是清晰可见的。\n\n![](img/image_rsrc7GC.jpg)\n\
  从 2011 年到 2014 年中期，比特币价格（上方）与交易量（下方）之间存在强相关性。来源：TradingView\n\n## 易用性理论\n\n那么驱动需求的新因素是什么？一种理论认为比特币是股市的替代品；当股市波动时，投资者会涌向比特币（增加比特币的需求）。但这种理论的问题在于，严肃的投资者并不认为比特币是股市下跌的强力对冲工具。比特币的价格与股市的表现基本上没有相关性，因此如果股市下跌，比特币也有大约\
  \ 50% 的概率也会下跌——这不是一个很好的保险单。我们认为有两个更现实的因素驱动需求。一个是投资比特币变得越来越容易了。在 2010 年代中期，拥有比特币的主要方法是在你的电脑上运行笨拙的软件，寻找一个比特币交易所（并希望它是合法的），在某些情况下，还要处理恼人的跨境银行支付才能拿到一些币。比特币投资只属于那些真正奉献的人。现在，任何人都可以投资比特币：你可以用借记卡在精美的网站上购买比特币，可以使用\
  \ App 购买和发送比特币，流行的股票交易 App 让你像买股票一样买比特币，你甚至可以通过 Fidelity 或 TD Ameritrade 等普通股票经纪人购买比特币\
  \ ETF（交易型基金或投资组合）。降低准入门槛消除了比特币需求的另一个限制。\n\n## 投机理论\n\n另一个因素，在我们看来是更有力的因素，是纯粹的投机。大多数比特币用户都是希望赚钱的投机者。比特币极高波动的价格、相对于股市的缺乏监管以及新降低的准入门槛，使其成为一种令人兴奋且相对容易的投机投资，尤其是对年轻人来说。尽管比特币历史上经历了所有的飙升和崩盘，比特币价格从长期来看一直呈上升趋势；分析师认为，这是因为购买比特币的人在崩盘后往往犹豫于卖出，他们希望价格再次上涨（这就是著名的\
  \ HODL 趋势）。当人们永远不抛弃比特币时，比特币的需求就会持续增加。总之，我们认为这是比特币价格——尽管经历了所有的飙升和崩盘——一直在增加的主要原因。\n\
  \n## 比特币支持者是对的\n\n为了论证，让我们撇开那个方便的事实，假设存在一个人们经常买卖物品（如拉斯兹的披萨）但没有比特币的世界。那个世界比特币会遭受通胀吗？对于比特币支持者来说，答案很可能是否。通胀发生在货币供应增长速度超过经济增长（即商品服务的总价值）时。如果货币供应无法增长，通胀在数学上是不可能的（这引发了另一个问题：你如何衡量购买商品或服务的价值？你可以看到过去所有的交易，但你无法在经济增长缓慢时衡量所有比特币的价值）。注意的是，比特币支持者是对的，他们认为政府不断印钱会通货膨胀导致供应增加，导致人们不再把储蓄存入美元。相反，他们把钱放在股票和债券中，这些增长得更快，超过了通胀（标普\
  \ 500 指数每年增长约 8%），让人们保持满意。你在工资单上看到的数字是名义工资；指的是美元金额。而你用这些钱实际上能买到的东西是实际工资；实际工资衡量你用特定金额资金可以获得多少商品，因此对你的生活水平更为重要。如果你的经济发生通缩，你就错过了通胀带来的益处，如果人们囤积现金（或比特币）而不是尝试发展业务，你的经济就会停滞。因此，比特币通缩对于那些通过仅仅持有就能获得巨大回报的投资者来说可能是好事。\n\
  \n## 通缩\n\n正如你预期的，通缩发生在商品价格随着时间的推移而下降时：想象一下披萨去年是 100 美元，今年只要 95 美元。当货币供应增长过慢或甚至萎缩时，就会发生通缩。大萧条期间发生过银行危机，货币供应萎缩，1930\
  \ 年到 1933 年间比特币平均下降了 10%。\n\n## 供应萎缩\n\n有趣的是，比特币的供应可能会随着时间的推移而减少。比特币去中心化的系统意味着如果你丢失了私钥，就无法找回比特币；当然，考虑到公钥或地址也几乎无法找回。这意味着如果你将私钥存储在外部硬盘上并弄丢了，与私钥相关的比特币将永远无法访问。比特币丢失实际上非常常见：据估计，30%\
  \ 的所有挖掘出的比特币已经丢失。如果真实的比特币丢失率大于区块奖励的产生，那么比特币的供应实际上在收缩。\n\n## 需求\n\n幸运的是我们，比特币的供应很容易量化和预测；有公式可以让我们精确计算未来将挖掘出多少比特币。但遗憾的是，理解比特币的需求要困难得多。没有单一的数字可以作为需求的衡量标准，也很难对需求的未来去向做出数学预测。\n\
