  \n此外，加密货币对于运行整个经济来说是不切实际的。记住 2017 年 12 月著名的 `Bitcoin` 大崩盘——当想要交易 `Bitcoin` 的人数达到顶峰时，交易需要数小时才能处理，费用曾短暂飙升至\
  \ 50 美元。如果一个国家所有的金融交易都在 `Bitcoin` 上进行，我们可能会看到比 2017 年 12 月更严重的拥堵、长时间的等待和高交易价格。\n\
  \n虽然大多数国家都不想放弃政府运营的货币而转向加密货币，但货币极其稀缺的国家可能是个例外。虽然加密货币波动剧烈，但它们仍比彻底崩溃的货币要好：例如，委内瑞拉玻利瓦尔的年通胀率曾高达\
  \ 830,000%，津巴布韦元在 2008 年曾达到年通胀率 800 亿（价格每天翻倍！）！相比之下，`Bitcoin` 偶尔的双位数波动似乎是非常温和的。因此，面临极端货币困境的国家可能会采用加密货币来实现相对稳定。\n\
  \n## 支付\n\n正如我们在书中提到的，加密货币的独特特性之一是：无论你发送多少、发送给谁，每笔交易的费用都是一样的。事实上，在加密货币出现之前，这是不可能的。\n\
