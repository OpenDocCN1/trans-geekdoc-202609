  \n\n# 结论\n\n《泡沫还是革命》（Bubble or Revolution）到这里就结束了。我们希望你发现这本书内容充实、有趣，甚至很有趣。我们希望你已经掌握了足够的知识，可以自己判断加密货币究竟是一个泡沫，还是一场真正的革命。不过，在书书中还有大量信息：请继续阅读以查看我们的加密货币术语表（包括许多我们在书正文中未涵盖的内容）以及\
  \ 25 种顶级加密货币。我们还提供了尾注，并附上了我们研究使用的来源链接，以防你想进行进一步研究。\n\n## 特别优惠\n\n想要我们畅销销量第一的小书的免费副本吗？我们的第一本书`Swipe\
