  \ ETF（交易型基金或投资组合）。降低准入门槛消除了比特币需求的另一个限制。\n\n## 投机\n\n另一个因素，在我们看来是更有力的因素，是纯粹的投机。大多数比特币用户都是希望赚钱的投机者。比特币极高波动的价格、相对于股市的缺乏监管以及新降低的准入门槛，使其成为一种令人兴奋且相对容易的投机投资，尤其是对年轻人来说。尽管比特币历史上经历了所有的飙升和崩盘，比特币价格从长期来看一直呈上升趋势；分析师认为，这是因为购买比特币的人在崩盘后往往犹豫于卖出，他们希望价格再次上涨（这就是著名的\
  \ HODL 趋势）。当人们永远不抛弃比特币时，比特币的需求就会持续增加。总之，我们认为这是比特币价格——尽管经历了所有的飙升和崩盘——一直在增加的主要原因。\n\
  \n## 投资还是货币？\n\n所有关于通胀和通缩的讨论都变得混乱，因为这些术语并不真正适用于比特币，但有一点是肯定的：比特币以美元计的价值已经随着时间增长了。这意味着比特币的购买力随着时间增加了。在\
  \ 2010 年，当比特币仅价值几分钱时，花费 1 万才能买一个披萨。但现在，你只需要几千分之一比特币就能买一个披萨店。\n\n## 稳定性与增长\n\n在这种情况下，比特币的行为与股票、债券和其他投资非常相似：它们的目标是随着时间增加价值。谷歌在\
  \ 2004 年上市时，每股股票价值 85 美元，在今天的资金下相当于 15 美元。本文写作时，每股谷歌股票价值近 1500 美元。曾经可以买一个 GameBoy\
  \ 的东西现在可以买一台 MacBook 了。这些资产与美元、欧元和其他货币形成对比，后者在时间推移中基本保持稳定，但由于通胀会逐渐贬值。（记得我们关于米林星级餐厅\
  \ Cheesecake Factory 的故事吗。）这指出了一个关键事实：让投资良好的因素与让货币良好的因素不同。谷歌股票是一个很棒投资，但你不会希望它成为国家唯一的法定货币，因为贸易将变得困难得多。消费者不会购买任何东西，为什么要用股票买东西呢，明明你可以等几个月，并希望用同样的股票买到更多？另一方面，美元非常稳定，使其成为交易和经济的良好基础；你可以信任你花费或赚取的美元不会发生价值的飙升或暴跌。但投资者不会将美元作为投资策略的核心，因为（根据定义）没有利润可赚，而且事实上，通胀会侵蚀价值。换句话说，让货币良好的因素是稳定性，而让投资良好的因素是增长。这些当然是互斥的。一个金融工具不能既增长又是稳定的。\n\
  \n\n\n\n\n# 第 3 章\n\n## 比特的的策\n\n比特币是一项令人兴奋的新技术。在我们的基金会工作中，我们正在开发数字货币以帮助贫困地区获得银行服务。我们没有专门使用\
  \ `bitcoin`，原因有两个：\n\n1. 第一，贫困地区不应该拥有一种与其当地货币相比价值波动剧烈的货币。\n2. 第二，如果在支付对象上出现错误，你需要能够撤销该笔交易，否则匿名性将无法实现。\n\
  \n——比尔·盖茨，比尔和梅琳达·盖茨基金会共同主席\n\n\n\n\n在他的白皮书中，Satoshi 描述了一种优雅且在数学上严谨的货币，它真正让你无需银行即可进行支付。但在随后的几年里，比特币发现实践远比理论困难得多，我们也看到人们对这种货币做出的许多乌托邦式预测并未完全实现。\n\
  \n### 扩展性问题\n正如我们在上一章看到的，比特币可以作为一种支付方式，也可以作为一种投资工具，但它已演变为主要是后者。这特别引人注目的是，Satoshi\
  \ 的本意是让比特币恰恰相反。当 Satoshi 在 2008 年在一个专注于密码学的邮件列表上宣布比特币时，他的公告邮件的第一句是写道：“我正在开发一种全新的电子现金系统，它是完全点对点的，没有信赖的第三方。”他并没有将比特币视为一种替代投资品；他将其视为一种支付系统。整个核心点是“允许在线支付直接从一方发送到另一方，而不必经过金融机构。”Satoshi\
  \ 特别提到小额支付是比特币的一个关键用例。在另一篇邮件列表帖子中，他表示：“比特币对于比现有支付方式更小额交易更具实用性。小到可以包含你可能所说的微额支付范围顶端的金额。”Satoshi\
  \ 没有指定具体的美元金额，但考虑到微额支付通常被认为是几美元或更少，让我们假设他指的是几美分到几美元之间的金额。\n\n### 手续费与延迟\n那么，比特币是向他人发送（比如）1\
  \ 美元的的有效方式吗？我们已经讨论过比特币价格的波动——它可能在一个周内下跌或飙升 20%——这使其成为一种支付或接收支付的风险资产。但还有更多需要考虑的。最大的考虑的是费用。记住，矿工会对区块中的每笔交易收取费用。每笔交易都会指定它愿意支付费用以进入区块，然后进入所有未确认交易的内存池（mempool）。矿工可以选择他们放入下一个区块的交易；你可以想象他们会选择提供最高费用的交易。这意味着，当有更多交易争夺区块位置时，交易发送者必须提供更高的费用才能胜出。（这就像是\
  \ Uber 和 Lyft 在需求高峰期（如元旦刚过）费用会贵得多。）请注意，费用并不取决于你发送的金额大小。你发送的金额不会影响交易的大小（字节数），而矿工希望在一个区块中尽可能多地放入交易，所以他们不在乎你的交易内容，只要你付得足够多。无论如何，在\
  \ Satoshi 和 Hanyecz 时代，平均费用仅为几分，但现在随着比特币价格上涨以及人们对比特币的兴趣增加，费用往往于在 50 美分到 1 美元之间波动。这并不糟糕，尤其是当你试图移动数千美元时。但如果你像\
  \ Satoshi 设想的那样向朋友发送 1 美元，你绝对不想付这么多费用，尤其是当像 Venmo 这样的应用让你免费发送资金时。\n\n### 交易拥堵\n\
  费用的更大问题出现在拥堵严重时：当人们进行交易的速度远于矿工将其打包成区块的速度时（记住，区块每十分钟只能产生一个），需求的增加将推高平均费用。以 2017 年\
  \ 12 月作为案例研究。该月标志着比特币全年涨势的顶点：比特币价格从 2017 年 1 月的不足 1000 美元飙升到 2017 年 12 月的某时刻的 19000\
  \ 美元以上。但在那个月，有前所未有的人试图买卖比特币，这导致平均费用激增——在某时刻，费用超过了 55 美元。\n\n比特币的交易费用通常低于 1 美元，但在需求高峰时期会飙升——平均费用曾一度超过\
  \ 55 美元。数据来源：Bitinfocharts.com。\n\n海量交易的另一个影响是极其漫长的等待时间。2017 年 12 月 7 日的某时刻，内存池中满了\
  \ 200,000 多笔未确认交易。但由于比特币每小时只能处理几千笔交易（写作时为每小时 12,000 到 15,000 笔），内存池拥堵了很长时间。在此期间，一笔交易获得确认并进入区块链平均需要\
  \ 16 小时。简而言之，比特币在这一兴趣高峰期苦挣扎，涨势的顶点导致了极端的延迟和高昂的费用。\n\n### 根本问题\n即使在最好的情况下，比特币也不适用于小额支付。著名的早期开发者\
  \ Mike Hearn 估计，比特币每秒只能处理约 3 笔交易（缩写 `TPS`）；最新数据将该数字定为每秒 3.5 到 4 笔。与此同时，Visa 处理的交易量远超此。很难给出一个精确数字——摩根士丹表示\
  \ Visa 和万事达每秒可以处理 5000 笔交易，Visa 曾自夸达到过每秒 11000 笔，一份皮书估计 Visa 最高可达到每秒 45000 笔。无论真实数字是多少，Visa\
  \ 的带宽远超比特币。而且，虽然信用卡交易在几秒钟内完成，但比特币交易平均需要十分钟才能通过，因为区块平均每十分钟挖掘一次。接受比特币的商家实际上被建议在交易完成后等待更多区块产生，以尽量减少欺诈风险。因此，即使在最好的情况下，一笔比特币交易的平均处理时间可能长达小时！\n\
  \n### 可扩展的未来？\n尽管如此，在解决比特币无法处理大额支付（或在比特币圈内被称为扩展性问题）方面已取得了一些进展。比特币尝试解决扩展性问题的基础部分是\
  \ `SegWit`，这是比特币协议的一个可选升级（关于比特币如何创建、存储和花费的规则），比特币用户、矿工和交易所可以切换到该版本。SegWit 于 2017\
  \ 年 9 月正式激活，它将每笔交易的某些元数据（包括证明谁发送了交易的签名）移动到区块的新部分，从而为区块体留出更多空间存放交易。这使得更多交易能够放入区块中，从而增加了比特币的每秒交易总数。（`SegWit`\
  \ 名称是“segregated witness”（分离见证）的缩写；带有签名的元数据被称为“见证”，它从主交易数据中“分离”出来。）另一个广为人知的解决方案是“Lightning\
  \ Network”（闪电网络），它旨在链外处理大部分交易，以避免链上的费用和延迟。闪电网络允许一对人在链外进行多次支付，他们偶尔才在链上“结算”余额。想象一下，你和朋友一起旅行，闪电网络的方法是在旅行结束时（每顿饭、订酒店、买票后）进行结算。遗憾的是，这个问题并没有消失。获取交易等待时间的数据变得困难，但费用飙升已成为比特币的普遍特征。\n\
  \n### 犯罪分子喜爱的货币\n在比特币存在的最初几年里，它通常与阴暗的犯罪分子联系在一起；人们将其视为毒品大佬和黑客使用的神秘货币。而且，说实话，它名不虚传。\n\
  \n#### 丝之路\n在比特币建立的最著名的犯罪企业是丝之路（Silk Road），一个非法的“亚马逊”。从 2011 年到 2013 年，丝之路出售了从毒品到伪护照的所有商品，流动了超过\
  \ 12 亿美元的非法物品。该网站的创始人名叫 Ross Ulbricht 的美国程序员，比特币允许了“无受害者的犯罪”，这意味着暗杀、被盗的信用卡号和儿童色情——这些物品是被禁止的。由于比特币的相对匿名性，毒品买家和卖家不想用信用卡留下痕迹。2013\
  \ 年，FBI 探员追踪到了 Ulbricht，当时他正在笔记本电脑上登录丝之路。戏剧性逮捕 Ulbricht 后，当局没收了运行丝之路的服务器，永久关闭了该网站。\n\
  \n#### 暗网市场\n但丝之路甚至不是糟糕的。一个名为 `Cthulhu` 的网站让你雇佣杀手和雇佣兵。自从丝之路以来，整个论坛和专门出售被盗信用卡号的在线商店被称为“carding”（信用卡盗刷）。安全研究员\
  \ Brian Krebs 发表了关于名为 `McDump` 的知名介绍，其标志是一把指向观众的枪。对于所有犯罪企业来说，比特币的选择。正如 Cthulhu 所说，比特币的优势在于“我们不知道你，你也不知道我们”，所以“我们无法把你送进监狱”。互联网的阴暗面非常可怕。\n\
  \n#### 黑客\n不仅仅是热爱比特币的非法商人；黑客也喜欢这种大部分匿名货币。黑客使用比特币最明显的例子是勒索软件，一种会感染电脑、加密所有文件并威胁除非用户向特定地址支付比特币否则将放弃文件的软件。来源：Wikimedia。\n\
  \n勒索软件在 2017 年 WannaCry 出现后，这种勒索软件病毒感染了全球的 Windows 。正如预期，黑客要求支付比特币以掩盖他们的踪迹。讽刺的是，比特币对他们来说并不是好的选择。到\
  \ 2017 年 5 月，尽管感染了 20 万台电脑，WannaCry 黑客仅获得了约 5 万美元赎金。\n\n### Mt. Gox 攻击\n比特币以其安全性为傲，这在很大程度上是正确的。超级计算机需要数百万年才能破解比特币用于挖掘和生成地址的单向哈希函数，使得几乎不可能欺骗挖掘算法或猜测你的私钥。而且由于工作量证明系统，除了\
  \ 51% 攻击外，几乎无法伪造过去的交易。但比特币安全性失效的一个地方是，它像任何其他技术一样容易受到人为错误。这种短板最著名的例子是曾经的世界领先比特币交易所\
  \ Mt. Gox 的衰落故事。\n\nMt. Gox 于 2010 年成立于东京，让世界各地的人交换美元、日元等法币货币，反之亦然。`Mt. Gox` 的名字源自《智牌牌》（Magic:\
  \ The Gathering）。该网站迅速转向比特币。Mt. Gox 增长得很快，到 2013 年，全球超过 70% 的比特币流经该平台。2014 年 2 月的一天，Mt.\
  \ Gox 突然停止了从交易所提取所有资金，防止交易者变现任何比特币。几周后，Mt. Gox 关闭了网站上的所有交易。就在几天后，Mt. Gox 申请了破产。85\
  \ 万枚比特币（当时价值 4.5 亿美元，写作时超过 80 亿美元）无声无息地消失了。Mt. Gox 在不到一个月内从高耸的山变成了冒烟的火山口。\n\n发生了什么？盗窃。事实证明，Mt.\
  \ Gox 的问题在大多数用户不知情的情况下，从 2011 年就开始了。Mt. Gox 将用户的账户余额存储在名为 `wallet`（钱包）的加密文件中。在 2011\
  \ 年，一个攻击者——无论是黑客还是一个违规员工——复制了名为 `wallet.dat` 的文件。在接下来的几年里，拥有了 Mt. Gox 私钥的攻击者缓慢地掏空了\
  \ Mt. Gox 的钱包。Mt. Gox 完全没有意识到这起盗窃。事实上，他们认为从 Mt. Gox 提取的资金是安全的，因为是加密的。\n\n### Mt.\
  \ Gox 攻击\n比特币以其安全性为傲，这在很大程度上是正确的。超级计算机需要数百万年才能破解比特币用于挖掘和生成地址的单向哈希函数，使得几乎不可能欺骗挖掘算法或猜测你的私钥。而且由于工作量证明系统，除了\
  \ 51% 攻击外，几乎无法伪造过去的交易。但比特币安全性失效的一个地方是，它像任何其他技术一样容易受到人为错误。这种短板最著名的例子是曾经的世界领先比特币交易所\
  \ Mt. Gox 的衰落故事。\n\nMt. Gox 于 2010 年成立于东京，让世界各地的人交换美元、日元等法币货币，反之亦然。`Mt. Gox` 的名字源自《智牌牌》（Magic:\
  \ The Gathering）。该网站迅速转向比特币。Mt. Gox 增长得很快，到 2013 年，全球超过 70% 的比特币流经该平台。2014 年 2 月的一天，Mt.\
  \ Gox 突然停止了从交易所提取所有资金，防止交易者变现任何比特币。几周后，Mt. Gox 关闭了网站上的所有交易。就在几天后，Mt. Gox 申请了破产。85\
  \ 万枚比特币（当时价值 4.5 亿美元，写作时超过 80 亿美元）无声无息地消失了。Mt. Gox 在不到一个月内从高耸的山变成了冒烟的火山口。\n\n发生了什么？盗窃。事实证明，Mt.\
