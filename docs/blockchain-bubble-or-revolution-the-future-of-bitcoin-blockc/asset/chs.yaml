  \ 年，研究发现提到比特币的文章增加 1%，比特币价格平均上涨了 0.3%（或者用投资者的话说，30 个基点）。很多对比特币的报道是负面的：当时的一些头条新闻包括\
  \ 2014 年 Gox 交易所（当时最大的交易所）被盗 740,000 枚比特币，以及美国政府在 2013 年查禁仅接受比特币的在线市场丝绸之路。但正如俗语所说，任何宣传都是好的宣传；比特币价格从\
  \ 2013 年 1 月的 13 美元飙升到 12 月的 100 多美元。网络热度和口碑是更强大的因素：同样的研究发现，搜索比特币的数量增加 1%，比特币价格平均上涨了\
  \ 0.5%（50 个基点）。事实上，比特币价格与公众对技术的兴趣（以交易总量衡量）之间的关系直到 2014 年中期都是清晰可见的。\n\n## 易用性\n\n\
  那么驱动需求的新因素是什么？一种理论认为比特币是股市的替代品；当股市波动时，投资者会涌向比特币（增加比特币的需求）。但这种理论的问题在于，严肃的投资者并不认为比特币是股市下跌的强力对冲工具。比特币的价格与股市的表现基本上没有相关性，所以如果股市下跌，比特币也有大约\
  \ 50% 的概率也会下跌——这不是一个很好的保险单。我们认为有两个更现实的因素驱动需求。一个是投资比特币变得越来越容易了。在 2010 年代中期，拥有比特币的主要方法是在你的电脑上运行笨拙的软件，寻找一个比特币交易所（并希望它是合法的），在某些情况下，还要处理恼人的跨境银行支付才能拿到一些币。比特币投资只属于那些真正奉献的人。现在，任何人都可以投资比特币：你可以用借记卡在精美的网站上购买比特币，可以使用\
