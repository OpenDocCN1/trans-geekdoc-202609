  \ `BAT` 为你喜欢的 Twitter 用户打赏。\n\n## BCH: 比特币\n`Bitcoin` 的一个著名硬叉，它增加了区块大小。这使得网络能够更快处理交易，从而降低了费用和等待时间。\n\
