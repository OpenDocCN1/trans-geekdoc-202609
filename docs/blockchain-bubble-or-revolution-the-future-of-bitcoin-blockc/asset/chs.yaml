  \ `base-58` 和其他数字系统。\n\n我们总是引用本文写作时的比特币价格——但由于比特币的汇率波动剧烈，我们建议您在阅读时查阅最新的汇率。这与社交网络的工作方式并没有什么：加入的人越多，网络就越越用，因此它可以呈指数级增长，但也可能因为相同的原因迅速崩溃。这些正反馈循环也被称为网络效应。\n\
  \n我们来这里不是为了提供投资建议，但尽管如此，比特币被视为一种合法的投资选择，这令人印象深刻。如果你想了解宏观经济理论和方程，请参阅附录 B。\n\n请注意，比特币价格增长的速度远快于区块奖励缩减的速度，因此挖掘一个区块赚取的美元仍然比过去多。\n\
  \n比特币的最小划分单位是比特币的千万分之一，被称为 `satoshi`（聪聪）。在 2140 次区块减半之后，区块奖励将向下取整为 0 `satoshis`。\n\
