  \ C 中阅读相关内容。\n\n区块并非每几分钟准时挖掘的；相反，每秒都有随机概率挖掘出一个区块。区块之间可能只相隔五秒钟，或者你可能在两个区块之间要等待一小时，但平均而言，每个区块是十分。（这被称为波松过程。）\n\
  \n这个名字源自那部格言频出的经典电影《公主新》中的一个角色。乌布里希特成为经典失误之一的受害者，其中最著名的是，“永远不要参与旧金山的计划”。他们的口号是：“常见问题的解决方案！”很有魅力。另一个经典失误是：当面临入狱之灾时，永远不要违反区块链。取消这种结果的唯一方法是对区块链进行“分叉”以抹除那次盗窃。但这样你就有了一个全新的货币，而让人们加入新货币总是一个挑战。我们稍后会看到其他人是如何使用这种策略的。\n\
