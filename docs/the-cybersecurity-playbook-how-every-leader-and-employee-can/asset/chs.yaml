  6. ^(6) Ponemon Institute, “第三方生态系统中的风险——第三年度报告,”2018 年 11 月。\n7. ^(7) Deloitte,\
  \ “德勤 2016 年全球外包调查,”2016 年 5 月，[`www2.deloitte.com/content/dam/Deloitte/nl/Documents/operations/deloitte-nl-s-o-global-outsourcing-survey.pdf`](https://www2.deloitte.com/content/dam/Deloitte/nl/Documents/operations/deloitte-nl-s-o-global-outsourcing-survey.pdf).\n\
  8. ^(8) EY 全球信息安全调查 2018–19，[`www.ey.com/Publication/vwLUAssets/ey-global-information-security-survey-2018-19/$FILE/ey-global-information-security-survey-2018-19.pdf`](https://www.ey.com/Publication/vwLUAssets/ey-global-information-security-survey-2018-19/$FILE/ey-global-information-security-survey-2018-19.pdf).\n\
  \n\n\n\n\n> *对于任何公司来说，一个非常大的问题在于，他们的用户——即那些商务人士——可以随心所欲地购买。他们不知道自己在做什么，也不真正在乎。他们看着一个软件软件包说：“噢，我想要那个。它能帮我完成工作。”他们根本不在乎——他们甚至没有考虑过安全问题。在很多情况下，他们可以直接加载并使用它。从网络安全的角度来看，这是一个巨大的风险。然而，阻止他们是不可能的。*\n\
  > —— 某制造型公司首席技术官\n\n幸运的阿莫斯（Lucky Amos）。他可能嫁给了一个骗人的杀人犯，但至少她遭到了她应有的报应，在监狱里度过了余生的尽头。而至于阿莫斯？他快乐地再婚了。他们共同拥有了一个美的家庭。他在事业中找到了幸福和成就感。尽管在过程中仍然遇到了生活中典型的挑战，但他在每一次挑战后都能够变得更坚强、更聪明。对自己的价值更有信心。对自己的身份更有安全感。不再满足于让社会无视他、擦肩而过，而完全不知道他的存在。\n\
  \n***\n\n对于我那些音乐剧《芝加哥》（*Chicago*）的粉丝，你们知道我为阿莫斯编造了一个童话般的结局。在音乐剧中，他能期待的只是在退出舞台（以及故事）之前，得到他妻子那个卑鄙律师转瞬即逝认可——故事就此结束。\n\
  \n但他不必离开我的想象。在我为阿莫斯写的结局中，我正在重写他的未来。为什么他不能过上好生活呢？在我的脑海中，阿莫斯将悲剧转化为胜利，夺回了自己的命运。他意识到自己的价值比别人所认为的要高得多。他迫使他人承认他的价值，拒绝安静地退缩到阴影中。\n\
  \n同样，我希望首席安全官（CISO）也能重写他们的未来。这要求他们学会说董事会的语言。这意味着他们要宽对员工的束缚，以获得对环境更多的控制。这还将要求他们作为公司所需的文化领袖，拿起武器。\n\
  \n## 一图胜千言万语\n\n在《大脑法则》（*Brain Rules*）一书中，约翰·麦迪纳（John Medina）写道：“我们不是用眼睛看世界。我们是用大脑看。”^(1)他提到了一个引人注的研究：葡萄酒鉴赏家被分给了掺了红色、无味、无味的染料的白葡萄酒。当然，受试者并不知道研究人员是这样处理白葡萄酒。后者是想衡量视觉影响所有其他感官的力量。这些爱好者会依靠其他感官（包括味觉和嗅觉）的结合来识破眼前的伪造品吗？\n\
  \n事实并非如此。当品酒师遇到伪造红酒时，他们使用与正品红酒相关的词汇来描述他们的体验。正如麦迪纳在书中指出的：“视觉处理不仅有助于我们对世界的感知。它主导了我们对世界的感知”^(2)\
  \ [作者强调]。\n\n也许这就是为什么我们的商业世界充斥着视觉线索。我们有反映绩效的评分卡、用于分享信息的精美演示，以及对职能领域众多指标提供即时反馈的实时仪表板。\n\
  \n当麦菲（McAfee）在 2017 年从英特尔（Intel）拆分成为独立公司时，我们的首席执行官克里斯·杨（Chris Young）迅速动员，收集并分析跨公司的关键指标，以便让他对业务有全面的了解。我非常激动能展示营销和公关团队代表麦菲交付的成果。我坚信我们至少有一个有趣的故事可以分享——我们在产生可行销售管道方面正在取得势头，我们的品牌建设工作也开始结出果实。\n\
  \n我如职地周复周地提交团队的仪表板。克里斯是一个非常投入的领导者，对细节有着严谨的观察力。因此，我经常会收到他关于团队表现的问题。这些问题指导了我们在下周的提交中包含哪些额外信息。这种良性循环一直持续下去。\n\
  \n直到有一天，我意识到我团队的仪表板缺少了某些东西。在我们案例中，那并不是一个数据点或指标。那是信号。仪表板由于提供过多细节而导致噪音淹没信息，这并不令人意外。但在我们的案例中，情况并非如此。我们已经审慎地修剪了指标，确保我们不会因为过多的干扰而与自己竞争。\n\
  \n相反，由于没有通过仪表板中包含的视觉图表来服务最重要的感官——视觉，我们创造了太多的噪音。\n\n这个启示是通过克里斯本人传给我的。事实证明，克里斯对我们时代流行的图表之一（也是我团队仪表板中的）——饼图非常反感。起初，我以为他只是在挑剔。然后我意识到，他的这种嘲讽并非孤例。\n\
  \n简单的谷歌搜索就能发现许多人对饼图的蔑视。有些人认为它是数据可视化界的“镍乐队”（Nickelback）^(3)（向任何读到此的铁杆镍乐队粉丝道歉！）。如果那种音乐不是你的菜，而你又偏爱漫画书英雄，批评者则说它是图表中的“Aqu\
  \ 兰王”。正如他们所论的：当超人可以完成 Aqu 兰王所做的一切甚至更多时，你真的还需要 Aqu 兰王吗？^(4)\n\n克里斯的表达得更委婉。饼图通常包含过多的信息，挤在微小的切片中，缺乏数据随时间变化的视角。饼图只做一件事——且仅此一件事——将某物作为整体的一部分来表示。而堆叠柱状图等图表也能这样做——而且展示了随时间变化的趋势。\n\
  \n我用这个例子是为了更具体地强调，CISO 需要精通另一种语言——CEO 和董事会的语言。我并不是在说 CISO 是企业界中所谓的 Aqu 兰王，只是他们负担不起只做自己领域的专家。\n\
  \n\n\n\n当然，针对公司的网络攻击构成了风险，有时甚至是巨大的。但请注意，首席信息安全官（CISO）必须建立至少两种联系，才能将他们的语言转化为董事会听懂的语言。首先，他们必须将从风险到策略的珍珠串联起来。一个脱离了战略重要性、价值创造或企业衡量标准的风险，就等同于给董事会展示一张你们结果的饼图——它只显示了全景中的一小部分。\n\
  \n其次，CISO 必须将威胁转化为风险。这需要理解董事会对高优先级资产的风险容忍度、潜在攻击如何挑战这种容忍度，以及可能产生的后果（财务或其他）。\n\n如果这听起来门槛很高，那确实如此。斯坦福大学报告称，大多数公司没有将风险管理与策略相结合。此外，50%\
  \ 的公司没有建立企业风险管理。对 CISO 来说，好消息是什么？当你用董事会的语言有效沟通公司的网络安全状况时，你将成为这些规则中令人愉悦的例外。\n\nCISO\
  \ 应该进入董事会，正如我在第 2 章中所证的那样。但一旦 CISO 获得了入场券，他构建和传递信息的方式可能会决定他是否会被再次邀请参加聚会。学习董事会的语言和风格，避免与那些一维的饼图一起被抛弃。\n\
  \n## 舍弃以获得\n\n在 2014 年，企业正在失去控制。它们正被一场全方位的攻势运动所吞噬；IT 部门被其愤怒所消耗；安全部门被困在它的准星之中。这场疯狂的核心是什么？是由于意良好的员工要求在工作场所获得与他们在家里预期的一样的全天候、随随用的技术访问。到\
  \ 2014 年，判决已经下达。“IT 消费化”趋势绝非昙花一现。它将长期存在。\n\n同年，IDG Enterprise 研究了这一现象对组织的影响。当时，40%\
  \ 的公司预测，工作场所中对消费化技术的痴迷会带来负面的安全结果。他们的担忧是有的。考虑这个滑坡效应：2014 年，90% 的组织报告称，员工在工作时使用消费者或个人服务——其中\
  \ 41% 未经 IT 部门批准。\n\n意不奇的是，相关组织都致力于采取行动。超过一半的企业制定了在移动设备上和或通过云服务访问和共享公司数据的政策。大约三分之一的企业投资了安全文件共享服务。另一些企业则实施了经过许可的企业协作工具。\n\
  \n快进几年，看看 McAfee 的 2019 年《云采用与风险报告》。McAfee 没有询问受访者对云的意见或计划（云是 IT 消费化趋势的重要组成部分），而是检查了云端实际上有多少文件是安全的。（我们通过查看每个文件上设置的企业策略来实现这一点。例如，企业确定文件的敏感性，我们使用匿名、聚合后的数据来判断使用情况是否符合策略。）\n\
  \n结果表明，失控的消费化 IT 火车在前段时间偏离了轨道：\n\n*   云中所有文件的 21% 包含敏感数据。这一数字正在上升——在过去两年中增加了 17%。\n\
  *   云端共享的敏感数据文件数量也在增加——在短短一年内增长了 53%。\n*   92% 的组织有被盗的云凭据在暗网上出售。\n\n除了 2014 年爆发的\
  \ IT 消费化运动外，还有另一场竞争正在进行。开发者越来越多地使用公有云环境为公司创建应用程序。\n\n这使得云安全变得更加棘手。正如 CISO 所知的，随着他们从软件即服务（SaaS）转向平台即服务（PaaS）再到基础设施即服务（IaaS）云变体，组织承担的风险更大。虽然这三者的数据保护是一致的，但随着公司从一种模式转向另一种模式，CISO\
  \ 在确保云底层基础设施组件安全方面承担了更大的责任。\n\n例如，同样的 2019 年 McAfee 云报告显示，平均企业目前运行着 14 个 IaaS 或\
  \ PaaS 配置错误。是什么样的配置错误？是让公有云基础设施（即为了保护企业数据而必须保护的设施）开放访问权限的错误。\n\n明确的是，这些安全漏洞并不是相关公有云提供商的错。这些是使用这些服务但不了解如何妥善保护它们的公司的错。而这份责任最终归\
  \ CISO 所有。\n\n在面对 IT 消费化的现实时，组织们加固了门窗。目前无法知道在这一过程中，他们是无意中助长了这种火势，还是仅仅被那个他们试图关回瓶子的精灵所击败了。换句话说，员工是否仅仅绕过了那些阻碍他们生产力的政策？还是政策帮助遏制了坏行为，却被另一端的云增长所反超？虽然答案可能是两者兼有，但我们\
  \ McAfee 的研究表明，组织在保护存储在云端的数据方面失去的控制比几年前看到的更多。\n\n我已为每个组织利益相关者提供了指导性建议，告诉他们可以如何在增强公司整体安全方面发挥作用。但你不会发现我建议员工停止使用他们喜爱的热门云服务。因为我知道，在企业\
  \ IT 服务赶上并提供普通大众（Joe Q. Public）所享有的替代体验之前，员工将继续消费后者。这就是“影子 IT”会投下长长阴影的证据。\n\n##\
  \ 承担使命\n\n几个月前，我的办公室里非常热闹。有人到处张贴了传单，上面写着这样一条信息：“我们需要更大的船。”《大鲨》的爱好者立即发现了这是对电影中经典台词的引用。但除此之外，对于这些在陆地上生活的\
  \ McAfee 员工来说，这可能意味着什么没有任何解释。流言蜚语充斥着疯狂的推测。我们要搬到更大的办公室了吗？我们要合并或收购某公司了吗？停车场要扩建了吗？（是的，在办公室停车有时确实很有挑战性。）\n\
  \n当我们发现信息背后的元凶时，大吃一惊——他们正是我们的 CISO 组织。这次预热活动启动了一项全公司计划，旨在刷新 McAfee 网络安全意识。具体来说，“更大的船”的引用是对钓鱼攻击（phishing）的双关语（巧妙！）。当\
  \ CISO 组织向员工发送网络钓鱼邮件时，有些人上了钩。当他们上钩时，他们收到了错误提示，并鼓励将所有可疑邮件报告给安全团队（通过我们电子邮件应用程序中一个方便的“报告钓鱼”插件，该插件恰好在活动期间推出）。\n\
  \n我们的 CISO 更进了一。执行团队的每位成员每月都会收到其团队表现的报告。他的团队有多少百分比的人中了钓鱼？在没中招的人中，有多少百分比的人主动多走一步，将可疑的植入邮件报告给安全团队？\n\
  \n\n\n\n随着活动的进行，校园内的告示也转变为提醒大家如何识别和报告钓鱼攻击的信息。全公司的安全意识得到了提高。领导们（包括我在内）利用这些报告对团队给出建设性的反馈，告诉我们应该如何改进，或者哪些地方做得得良好。\n\
  \n我甚至发现自己进入了高度警觉状态，等待发现来自安全团队的“钓鱼”，并准备好立即报告。某天早上我出门上班时，我检查了手机是否有需要立即处理的邮件。我看到一封来自首席执行官\
  \ Chris 的邮件。但我一眼就能看出非常不对劲。邮件要求我通过邮件回复他，因为他电话联系不上我。\n\n当我抓起钥匙冲出门门时，我心里想：*公司那场钓鱼活动开始得非常巧妙。但这个来自\
  \ Chris 的伪造钓鱼真的很糟糕，太容易识破了。*\n\n我一回到办公室，就尽职报告了这封钓鱼。令我惊讶的是，我并没有收到安全团队发来的那种祝贺弹出消息，说我通过了测试。*真奇怪。我需要告诉他们，他们的反应速度有问题。下次见到我们的首席安全官（CISO）时，我会提一下的……*\n\
  \n但我并没有得到那个机会。因为在不到 10 分钟内，我收到了安全团队的一封邮件。但并不是我预期的那种“干得好，发现了伪造钓鱼”的邮件。事实证明，我报告的是一次真实的钓鱼。我们的网络安全团队在几分钟内进行了调查，并回复了需要立即采取的措施，以防我*真的*回了（但我并没有回）。\n\
  \n你会预期营销或人力资源部门开展这种多维度的活动。你可能不会立刻这样看待网络安全团队。但如果我们的 CISO 及其团队不承担起传播文化的责任，他们又怎么指业务部门在网络安全方面做到同样的呢？为了让网络安全文化生根，CISO\
  \ 必须与他们进行更多的配合。\n\n## 给网络安全专业人士的 W.I.S.D.O.M.\n\nCISO 在其领域拥有丰富的最佳实践资源。这套 W.I.S.D.O.M.\
  \ 并不是为那些寻求深度技术建议的人准备的。但这并不意味着它不重要。这份处方关乎将你的价值与业务价值联系起来。它要求 CISO 既要涵盖基础工作，又要跨越部门围墙。\n\
  \n### 良好的网络安全卫生是不可妥协的。\n\nCISO 必须确保基础工作得到到位，并将网络安全卫生置于“待办事项”列表的首位。在这种情况下，常识并不总是那么通用。在迄今为止最大的数据泄露事件之一，失败的原因是一个已知但未打补丁的漏洞。关于这次攻击的后分析更有趣的一点是：用于通知安全管理员漏洞的邮件名单忽略了那些“需要知情”的人。因此，未修补的漏洞导致了泄露。而一个过时的安全管理员邮件分发组导致了未修补的漏洞。这只是网络安全专业人士面临的细节决定成败的一个显著例子。\n\
  \n由于你的基础设施在物理和虚拟方面都在不断扩大，良好的补丁管理需要对所有使用或空闲的服务器进行盘点。“僵尸服务器”（即至少六个月未使用的服务器）便是一个例子。它们可能占企业基础设施的很大比例。高达\
  \ 30% 的虚拟服务器处于休眠状态^(9)。由于没有人使用它们，很可能也没有人对其进行安全防护。\n\n你无法保护看不见的东西。如果你不推广，你的员工也无法修补那些漏洞。除了盘点所有资产及其补丁状态外，还要审查你的通知管理员处理漏洞的内部通信计划。\n\
  \n继续回到卫生问题，盘点你的网络安全防御措施是否存在“闲置软件”（shelfware）。当你发现公司购买了某种尚未安装的防御性技术时，要找出原因。是该解决方案不再需要了吗？还是你的组织还没有时间来实施它？如果是后者，请与你的团队或专业服务公司一起制定项目计划，以确保你宝贵的投资不会在架子上腐烂（这还让你让自己暴露在风险之中！）。\n\
  \n接下来，配置至关重要。你可能在漏洞补丁方面做得最好的卫生。你可能在安装购买的所有网络安全技术方面无与伦比。但如果你没有正确配置安全产品，黑客就会从缝隙爬入。\n\
  \n此外，要备份数据。虽然备份数据不能保护你免受各种攻击（数据外泄就是一个典型例子），但对于拥有备份数据的组织，勒索软件是无效的。有了*稳健*的备份系统，可以忽略勒索要求并以相对较低的停机时间恢复所有文件。值得评估哪些资产是绝对不可或的，然后决定如何以可以接受的备份数据和系统。\n\
  \n当然，备份对于其他原因也有用，例如可以恢复早期的配置或文档的早期版本。这在数据武器化的情况下可能特别有用，即黑客为了欺骗或其他原因操纵数据。定期存档记录允许组织在必要时检索出更早、更准确的数据版本。\n\
  \n确保定期测试你的备份系统，以确保你存档的数据确实被存储了——是的，这种类型的备份失败确实发生过。使用加密安全地备份所有数据——是的，至少有一家公司因为未加密的数据日志而丢了脸。\n\
  \n如果你发现自己处于一个与 IT 兄弟部门不直接对齐的网络安全部门，那么保持良好的卫生将变得呈指数级困难。遗憾的是，CISO 和 CIO 之间的关系有时更像争吵的家人，而不是亲近的表兄弟。随着网络安全进入青少年期，它一直在努力创建并维护与其\
  \ IT 母体分离独立性。\n\n\n\n这场长期的争论揭示了 `CISOs` 和 `CIOs` 必须在精神上保持一致，而不仅仅是遵守法律条文。这要求 `CISOs`\
  \ 在指标和目标上与 `CIOs` 接轨，无论前者是否向后者汇报或两者是坐在同一张桌旁的同级同事。特别是对于适当的网络安全卫生（包括补丁、备份、多因素身份验证等）的角色和职责，必须在每个规划周期的开始建立并达成。如果这两个部门共享预算，领导者必须识别并分配哪些部分用于\
  \ `IT`，哪些部分用于网络安全。除了为每个部门留出运营预算外，或许任何新的 `IT` 项目都应被收一种“网络安全税”，以资助并保护新技术。正如对其他部门讨论的那样，`CISOs`\
  \ 和 `CIOs` 应就关键性能指标 (`KPIs`) 和服务水平协议 (`SLAs`) 达成一致，以优先考虑工作并在发生争议时解决。\n\n## 网络安全卫生\n\
  单管理这项列表充满挑战（这也是网络安全卫生难以实践的原因之一）。对你的环境进行定期的渗透测试，最好使用第三方。这些公司将帮助你在坏人行动之前发现未知的漏洞（在你的网络安全卫生中或在其他缺失防御中）。\n\
  \n## 云采用与安全\n接下来，投资于能够提升你的业务价值并降低竞争对手价值的技术。具体而言，企业正在向云端。更重要的是，员工正在向云端迁移。因此，除非你的组织受到完全限制（某些组织，如大型政府机构，确实如此），否则你可能无法阻止员工在工作场所访问潜在危险的应用程序或服务。\n\
  \n如果你无法击败他们，就加入他们。与其抵制云迁移，不如拥抱它。将云访问安全代理 (`CASB`) 视为一种潜在的解决方案。本质上，`CASB` 技术让安全组织对其使用的云服务（无论是授权的还是未授权的）具有可见性和控制力。它们可以检测云控制中的安全配置错误（例如公开可读和/或可写入的\
  \ `storage bucket`）。它们可能允许组织在任何云环境中设置一致的安全策略。简而言之，它们允许组织保护员工正在使用的流行云服务。它们还允许 `CISOs`\
  \ 在支持公司转型议程的同时，确保安全处于核心位置。\n\n## 敌对手术\n现在，谈谈如何对你的敌对手产生负面影响。我之前说过，在网络安全中没有所谓的“进攻性防御”。这是事实。防御者根据其定义，不会首先出手。但他们仍然可以迷惑他们的敌人。\n\
  \n战争中的欺骗艺术可以追溯到孙子。在网络安全中，在你的基础设施中部署看似像宝库的精心伪装的 `decoys` 有几点作用。首先，它们为你提供了额外的数据点，通过这些追踪敌人的模式。其次，它们让敌人偏离你感兴趣并保护的真实宝藏。最后，它们让敌人的时间和资源浪费在徒劳搜索上。最后这一点真的是网络安全团队最接近“进攻”的方式了。\n\
  \n## 人工智能与机器学习\n利用人工智能 (`AI`) 能力识别最先进的威胁并解决人才短缺问题——但要了解其局限性。`AI` 是网络安全领域最新的热词技术。诚然地说，它承诺帮助网络防御者快速发现其环境中最复杂的威胁，将机器的规模与人类解决问题的能力相结合。但要小心那些披着羊皮的网络安全营销人员。虽然\
  \ `AI` 承诺帮助资金紧张的 `CISOs` 以更少的资源办更多的事，但这是有代价的——`误报`。\n\n增加此主题复杂性的是一种称为 `对抗性机器学习`\
  \ (`AML`) 的新威胁类别。坏人再次行动，通过创新方式制造混乱或伤害。通过 `AML`，敌对手操纵输入来影响原本正常的 `machine learning\
  \ models`。“垃圾进，垃圾出”的假设在网络安全中与在任何其他 `IT` 领域一样适用。`machine learning model` 的好坏取决于其输入。如果输入是错误的（或被篡改的），模型的准确性就会受到损害。\n\
  \n在最近的一次贸易会上，McAfee 展示了图像中像素像素的变化（人眼无法察觉）如何让一个 `machine learning model` 将一张企鹅的照片分类为……一个煎锅！平底锅和企鹅在现实世界中可能是无害的。但想象一下数字停止牌上发生了同样的像素投毒，自动驾驶汽车将其识别为限速标志，你就可以想象这一领域的应用可能会变得多么黑暗。\n\
  \n敌人可能会对恶意软件分类引擎造成同样的困扰。通过对高度敏感的 `machine-learning models` 引入细微变体，敌对手可以使网络安全专业人士迷失方向。他们可以向这些第一响应人员投放大量的\
  \ `false positives`，可能在过程中杀灭他们响应的紧迫感（正如多户租赁建筑中烦扰性火灾报警器的作用的那样）。\n\n\n\n最后，在你的公司里当好“网络安全文化的旗手”。这需要两方面的努力。首先，`CISO`\
  \ 必须能够听懂董事会的语言。董事会室说的是风险语言——而这始终与公司战略紧密相关。与业务部门负责人、你的 `CFO` 以及 `CEO` 协作，识别并优先考虑公司最具战略意义的资产。对于每种资产，识别泄露后的后果。最后，提供其当前的漏洞情况。立即为高优先级/高漏洞资产制定“修复计划”。当被邀请参加董事会时，请将此框架作为你的指南，定义你的网络安全战略如何映射到公司更广泛的战略中。\n\
  \n除了在纵向上传播安全文化外，还要通过组织员工进行横向传播。与你的 `HR` 对应人员并肩作战，提供有效的培训以提高员工在各自岗位上的安全意识（就像麦菲的 `CISO`\
  \ 在他的网络钓鱼活动中所做的那样）。找到办法，让网络安全不仅仅是一年度的培训活动，或是员工入职时要回答的问题检查清单。在你的团队中聘请一名沟通专家，与营销部门合作，定义该职位的角色和技能要求。让你的沟通大使与\
  \ `Marketing` 和 `HR` 合作，开展有效的内部宣传活动，让网络安全成为每个人日常工作的一部分。\n\n***\n\n是时候让 `CISOs` 拥抱他们在执行层会议桌上的角色了。是时候他们培养一种远超\
  \ IT 部门的网络安全文化了。是时候与关键利益相关者——特别是 `HR` 和 `Marketing`——建立新的伙伴关系，以推动网络安全意识的提升和安全的降低。是时候改写\
  \ `CISO` 故事的结局了。得益于许多早已在前行的具有前瞻性 `CISOs`，其他剧角不需要去想象他们的故事书式结局了。这正在变成现实。\n\n## Notes\n\
