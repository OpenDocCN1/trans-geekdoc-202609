  \n将我看作营销与技术的混合体吧。我的职业生涯一直在将技术概念翻译成日常语言。我研究了工作与技术的交汇点，以理解企业文化是如何变化的。\n\n\n\n“12 人组”（海鹰队球迷的称呼）真的有那么大吗？大多数情况下，是的。但事实证明，他们的体育场也经过专门设计以留住声音。与其他声音会自然消散在空中的露天体育场不同，海鹰队的体育场拥有二层看台和顶篷，可以将声音向下反射，当“12\
  \ 人组”咆哮时，那里会产生出一片嘈杂声。(1) 海鹰队组织付出了巨大努力将“12 人组”招募团队的一部分——确保这些球迷能将集体力量带入比赛，并几乎与场上的球员并肩作战。\n\
  \n“第 12 人”告诉我们，观众可以影响结果。但他们必须投入其中。他们必须被赋予使命。这就是你的用场。我写这本书是为了让每一位非专业人士都意识到在这场持续进行的网络安全战中，你们的重要性。没有人可以责怪你没有尽早承担起责任。但在读完这本书之后，也没有人可以借口推卸你的责任。\n\
  \n这本书试图在许多许多其他优秀著作结束的地方继续对话：为商业领域的专业人士提供一份他或她可以立即执行的计划，成为组织网络安全议程的一部分。如果你仍然质疑议程是否应该包含你，请意识到它已经包含了。网络犯罪分子正指于员工的冷漠或不参与来对他们的目标发动破坏。如果你不积极地站在公司的一边，你可能在不经意间成了敌人的一边的棋子。如果你重视在线自由，如果你关心你用于决策的数据是否没有被篡改，如果你坚持你的连接设备被用于善意而非伤害，那么你已经与工作中的网络安全专业人士共享同一个使命。你与我们这些网络安全工作者的共同点可能比你想象的要多。\n\
  \n## W.I.S.D.O.M.\n\n在麦菲（McAfee），执行团队重视发展。我们每季度开一次会，将“工作”回归“团队协作”之中。我们互相指导，分享职业旅程中的私密故事，并承诺对彼此和员工更加真实。在这些发展课程结束时，我们会练习从我们的领导力开发合作伙伴\
  \ AIP 小组那里学到的东西，被称为 `W.I.S.D.O.M.`。它代表 `W`hat `I`’ll `S`ay (and do) `D`ifferently\
  \ `O`n `M`Monday（我周一将不同的说法和做法）。我们每个人都做出了 `W.I.S.D.O.M.` 承诺，要求自己和彼此共同实践我们所学的一个关键发展领域。\n\
  \n同样，我想为这段旅程配备 `W.I.S.D.O.M.`。这就是为什么在每一章之后，我都会为你提供一份实用的处方，告诉你周一可以做什么来改进组织的网络安全态。有些建议表面上平淡，但对你的成功可能产生重大影响。另一些则需要更多努力，但风景值得攀登。在任何情况下，我都会将每章处方限制在五项\
  \ `W.I.S.D.O.M.` 以内，因为我想专注于能产生 80% 结果的 20% 的努力。\n\n你在这些页面中看到的建议是：\n\n## Note\n1.\
  \ 什么让西雅图的“第 12 人”变得特殊？Louise Bien, SB Nation, 2015 年 1 月 22 日。\n\n# 第 2 章\n\n##\
  \ 玻璃胶纸先生（Mr./Ms. Cellophane）\n\n> *即使不像母鸡一样咯咯叫，*\n> *每个人偶尔会被注意到，*\n> *除非，那个人物应该是*\n\
  > *隐形的我。*\n> *玻璃胶纸，玻璃胶纸先生，*\n> *本该是我的名字，胶纸，*\n> *因为你可以看透我，*\n> *从我身边走过，却不知道我在这里。*\n\
  \n## 副总裁/执行副总裁，专业服务\n\n可怜的阿莫斯（Amos）。他的妻子冷酷地杀了情人，并声称这是针对那个她所说的“陌生人”的正当防卫。在发现那段偷情的丑陋真相后，阿莫斯依然尽职地站在她身边。阿莫斯走到哪里，他都是她故事中的一个影子，对周围的人来说几乎是隐形的。我说的是获奖音乐剧《芝加哥》中的那个角色。他在那首恰好题为“玻璃胶纸先生”的独唱中，哀叹自己是多么被忽视了：\n\
  \n我们中的许多人都能对阿莫斯产生共鸣，因为有时我们觉得自己是隐形的。这不是一种很好的感觉，通常伴随着被低估或不被赏识。而且被完全误解也一点也不趣。\n\n长期以来，首席信息安全官（CISO）一直是我们组织中隐喻意义上的“玻璃胶纸先生/女士”，注定在虚拟的无名中辛勤，孜不倦地专注于安全这项基础性工作。他们生活在他们所保护的人的影子里。事实上，如果他们脱掉隐形的斗篷，各方注定会出现麻烦。\n\
  \n作为员工，我们不希望被 CISO 或他们的部门打扰。我们只希望他们能让我们保持安全。我们希望他们在做这些的同时不要挡我们的路。事实上，CISO 是从我们组织的后办公室起家的，字面上就是看不见也不在意。\n\
  \n\n\n\n例如：McAfee 报告显示，平均机构任何时候都会使用约 2,000 个云服务。而他们的 IT 团队*认为*自己有多少个呢？接近 30 个。这种认知与现实之间的鸿沟至少部分可以归咎于“影子\
  \ IT”——这是一种员工擅自行动，在 IT 部门不知情、更不用其授权的情况下使用云服务的现象。\n\n比首席信息安全官（CISO）在员工面前变得可见更糟的情况是什么？是在董事会面前可见。从历史上看，董事会对会对网络安全的兴趣程度和员工一样低。如果董事会召集\
  \ CISO 参加会议，通常不是为了对公司的网络安全状态进行战略性汇报，也不是为了对他的工作表示诚挚的“感谢”。更有可能是为了回答关于数据泄露的棘手问题。\n\n\
  全球专业服务网络德勤对董事会进行定期研究，其中调查了数百家上市公司。直到 2014 年，也仅有 5% 的巨型公司设有与“网络安全与 IT”这一主题相关的董事会委员会。\n\
  \n因此，CISO 在很大程度上接受了我们在比喻音乐剧中的阿莫斯（Amos）这一角色——致力于为那些不领情的人提供保护，并注定留在阴影中。\n\n但意图造成伤害的恶势力正在改写这部音乐剧。几乎没有一天没有新闻标题（或公司）宣布下一次泄露。董事会的情正在发生变化。许多人意识到，将\
  \ CISO 边缘化到阴影中会带来自身的风险。当德勤在 2016 年重复其董事会研究时，网络安全已成为董事会关注的首要风险，25% 的公司在过去两年内经历过数据泄露。“玻璃纸先生夫妇”（Mr.\
  \ and Ms. Cellophane）发现自己正从后台办公室的后角中解脱出来，甚至偶尔还会收到参加董事会的邀请。\n\n然而，仅仅因为黑客将 CISO 推向了聚光灯下并不能解决网络安全挑战。董事会注意到这个问题是令人鼓舞的，但仅仅承认它只是第一步。提高公司的网络安全态势需要这些人员——技术性的\
  \ CISO 和战略性的董事会高管学习彼此的语言。\n\n让我们从尝试理解我所认为的最高管理层中最被误解的角色——CISO 开始。这种启发不仅使董事会成员受益，也使所有员工受益。CISO\
  \ 通过最终从阴影中走出而获益。\n\n## 街新新\n\n公司以及组成它们的职能部门已经存在了数百年。银行和制造企业是最早的企业之一，因此，今天许多大型上市公司在财务或运营方面拥有深厚的造诣并不意外——这些是最初作为我们企业祖先基础的学科。\n\
  \n事实上，根据德勤 2016 年的《董事会实践报告》，除了首席执行官（CEO）和总法律顾问，最可能定期参加董事会的管理人员是首席财务官（CFO）（被高达 99%\
  \ 的调查公司引用）和业务部门负责人（被高达 47% 的公司引用）。那么 CISO 呢？相比之下，他仅在最多 11% 的公司董事会会议上定期亮相。\n\nCISO\
  \ 仍在极力打入这些闭门会议，这并不令人意外。毕竟，其他职能部门跨越了几个世纪，甚至是几千年（律师可以声称他们的职能根源可以追溯到古埃及），而 CISO 的角色仅追溯到几十年。在那时，我们甚至不称之为“网络安全”。这些早期的先驱将自己的职业称为“信息安全”，与其所属领域始于“信息技术”的背景是一致的。\n\
  \n为了理解 CISO 这个相对新的角色，我们必须对网络安全的起源进行一次简短但重要的历程。在过去，物理安全和信息安全在很大程度上是一一的。我记得，在不久前，如果我想访问公司的网络，我是通过一台固式桌面电脑完成的，通过物理以太线连接到局域网。连接该电脑的桌面设备位于我们公司的场所内。物理安全在物理和实践上是密不可分的。\n\
  \n我惊讶于，在我的一生中，工作发生了如此大的变化。工作不再是我去的地方；它是我所做的一件事。我越来越多地在雇主的安全边界之外工作。我将职业生活和个人生活无缝融合在一起——在移动设备上回复邮件，在任何能找到\
  \ WiFi 的地方连接，并访问无数让我的生活更便利的云服务。\n\n我并不是唯一一个将工作视为无绳体验的人。让我们考虑我们新的工作行为如何对必须保护我们的 CISO\
  \ 造成指数级增长的压力。在任何时候，我们的 CISO 都在平衡三个战略努力中的一个或多个：\n\n### 1 转型\n\n技术的任何采用，无论是移动性、云还是物联网（`IoT`），都会让公司面临更大的风险。这是因为在过程中，企业的安全边界在不断侵蚀。\n\
  \n例如：谁“拥有”互联网？这是一个像拜占庭迷宫一样错综复杂的难题，足以让我们我们中最具技术头脑的人感到头晕。\n\n谁“拥有”公共云基础设施（如亚马逊、谷歌和微软提供的服务）？这至少是一个更容易回答的问题——这些公司负责那些云环境的物理安全。但这等同于他们拥有保护那些巨型数据中心物理访问的权限，就像我们的公司拥有保护我们工作建筑的一样。云盗窃通常不是足智广明的盗犯闯入大型网站公司的物理数据中心的结果。它是网络犯罪分子找到黑入存储在或穿过此类数据中心数据的结果。\n\
  \n最终由谁“拥有”这些数据的责任？这是最简单、最清晰的答案：你的公司——只有你的公司——负责保护自身的数据，无论这些数据存储在何处——无论是位于雇主场所的服务器上，还是通过公共云市场租赁的服务器。\n\
  \n云只是 CISO 对存储或传输公司数据所用基础设施的控制力消退的一个例子。自带设备（`BYOD`）运动将长期存在，这意味着公司配发的移动设备可能很快成为过去的遗迹。许多公司急于允许员工在他们选择的任何移动设备上工作是有的。根据\
  \ Frost & Sullivan 的数据，使用智能手机工作每天为员工节省近一小时的时间，同时提高了 34% 的生产力。\n\n\n\n\n\n为了使转型目标变得更加难以实现，旧技术具有非常长的使用寿命。即使业务部门正急于部署云服务（无论是否获得\
  \ IT 部门的正式许可），仍有大量的长尾本地基础设施必须维护。以 USB 闪存为例：2017 年，本·格里恩大学的研究人员记录了 29 种破坏 USB 驱动的已知攻击向量.^(7)\
  \ 此外，无软件硬件加密 USB 盘的制造商 Apricorn 在 2017 年报告称，虽然 90% 的员工使用 USB，但只有 20% 的人使用了加密.^(8)\n\
  \n由于长尾遗留技术基础设施很少消失，而且消失绝不会很快，这些转型追求意味着范围和责任范围的风险性扩张。\n\n我们的首席信息安全官（CISO）该怎么办？如果轻率地支持一个全方位开放、随心所欲的环境，就会会让组织面临日益增加的风险。如果变成一个“拒绝”部门来遏制潜在威胁，他可能会被他必须保护的员工所架空（记得在普通公司中，那些在\
  \ IT 专业人员不知情的情况下使用的近 2000 个云服务吗？）。\n\nCISO 处在一个不令人羡慕的境地。他必须在保护公司最宝贵的数字资产的同时，推进转型议程。遗憾的是，这些任务之间的矛盾可能再大不过了。\n\
  \n### 2. 风险管理\n\n网络犯罪是一门大生意——确切地说，2017 年是一项达 6000 亿美元的业务，比 2014 年增加了 1000 亿美元.^(9)\
  \ 从全球影响来看，网络犯罪作为一种经济祸害排名第三，仅次于政府腐败和毒品交易。\n\n我们是如何走到这一步的？曾几何时网络安全相对“简单”。不仅安全局限于物理层面（如前所述），而且应对威胁要容易得多。2006\
  \ 年，麦菲软件每天检测到 25 种新威胁。十年后，这个数字飙升到了 50 万——每秒就有超过 5 个新威胁！\n\n数量只是挑战的一部分。过去发现威胁是直观的。威胁以恶意软件的形式出现——由坏人设计用于给受害者造成破坏的软件。网络安全行业谈论的是“传统”恶意软件，包括你已经熟悉并讨厌的那些讨厌的病毒。恶意软件曾经只带有一个静态代码字符串，让行业将其识别为恶意软件。可以将其视为一种软件指纹——网络安全行业称之为\
  \ `signature`（签名）。就像执法部门依赖国家登记处根据指纹识别罪犯一样，网络安全行业寻找软件签名，将已知的恶意软件加载到自己的数据库中。如果在文件中发现\
  \ `signature`，该文件将被拦截，威胁将被遏制。\n\n时代变了。最阴险的威胁不再显而见地戴着已知且易于识别的指纹出现。作坏者变得聪明得多。当你读到这段文字时，最新的网络安全威胁几乎肯定不在列表中，但在我写这些内容时，我的行业正痴于“无文件”攻击。这些威胁秘密地利用你组织内部受信任的技术，例如经过批准的工具和应用程序。然后它们进行破坏，通常是通过访问你公司更大的网络并窃取数据。\n\
  \n我之所以说“通常”，是因为数据外泄不再是在线对手执行的唯一策略。勒索软件是网络安全的另一个热门话题，对手可能根本不会费力外泄数据并在暗网上出售。他们会通过锁定（或加密）受害者的文件，并在永久销毁之前索要密钥（或解密）的赎金金，从而缩短获取利润的路径。\n\
  \n或者，数据和钱可能根本不是终极追求。对手可能更倾向于关闭对受害者关键系统的访问来制造破坏，在此过程中让公司陷入瘫痪。或者黑客可能进行信息战争，数据本身被武器化以制造混乱（想想你公司每天产生的数据量，以及对数据进行最微小的操纵就能给你的雇主造成多大的损害和困扰）。或者黑客想要你公司的声誉，正如麦菲软件从我们的社交媒体漏洞中吸取的惨痛教训那样。\n\
  \n你明白状况了。威胁不仅呈指数级增长，而且变得显著更加复杂和阴险。威胁的数量、多样性和活力意味着更大的风险。\n\n根据德勤的数据，如何指望 CISO 能向他们的董事会解释这种复杂的现实？许多董事会每年平均次数少于六次，每次四小时。这意味着平均董事会每年只有\
  \ 24 小时来涵盖从公司战略、财务表现到敏感的并购活动以及其之间的一切话题。网络安全作为一个话题，由于其高度的技术性和复杂性，被大多数董事会冷落，这又奇怪呢？\n\
  \n但事实不必如此。网络安全确实具有很高的技术性。但它的核心非常直观。它从根本上是关于风险管理的——这是一种大多数董事成员自然精通的语言。\n\nCISO 在缓解风险方面不断走钢丝。他们必须在两者之间取得平衡：一方面处理可能不会导致灾难性影响的大量威胁，另一方面应对可能击垮一家公司的低频率、高针对性攻击。\n\
  \n我们所有人，不论是董事成员还是其他人，都能对 CISO 在风险管理面临的挑战产生共鸣，因为我们在自己的生活中也走着同样的界线。我们在浴室里放防滑垫以防止跌倒风险（对于大多数某些年龄段来说，这是一个较小的风险）。我们在家里使用烟雾报警器，并购买保险单来缓解火灾等灾难性风险。而其他真正的灾难性风险，如被陨石击中是可能发生的（是的，这在\
  \ 1954 年确实发生在一个可怜的人身上^(10)），由于概率极低，我们安全地忽略了这些风险。\n\nCISO 必须以相同的方式对公司分类。CISO 的挑战在于简化网络安全话题，而不是在此过程中使其机械。董事成员的责任是什么？参与讨论，意识到表面下复杂的局面很少、甚至永远产生一个清晰的决策。战争不会产生清晰性，网络安全亦然。\n\
  \n### 3. 自动化与效率\n\n“以少胜多”是现代企业一种令人厌烦的陈词。这也是 CISO 不幸的使命。威胁的数量没有缓解迹象，而且对网络安全专业人才的需求远超过劳动力市场的人才供应。根据\
  \ Cybersecurity Ventures 的数据，到 2021 年将有超过 350 万个网络安全职位空缺（(11)——这足以填满 50 个 NFL 球场！\n\
  \n问题只会变得越来越糟糕。2014 年，网络安全行业估计全球范围内缺口百万专业人士。2015 年，缺口扩大到 150 万个职位。2016 年，预测者认为 2019\
  \ 年网络安全人才短缺将达到 200 万专业人士.^(12) 随着威胁持续增加，对合格网络安全人才的需求也在不断扩大。\n\n\n\n\n由于缺乏足够的人手来应对问题，首席信息安全官（CISO）不得不求助于大量网络安全供应商提供的系列产品，这些供应商正争夺网络安全预算以填补这一空白。与劳动力市场的短缺形成鲜明对比的是，网络安全产品极度过剩，都在争夺\
  \ CISO 有限的预算。截至本文写作时，已有 3,500 家网络安全供应商在争取 CISO 的青睐。每家供应商都提供一种或多种防御技术，其中许多技术承诺解决一小（即使不是大部分）的网络安全挑战。\n\
  \n好东西也可能过头。CISO 可选的丰富网络安全技术正是这一公理的写证。历史上，为了证明自己的价值并预测下一次威胁，CISO 往往会匆忙采用最新的防御技术来作为其对抗敌的武器库。\n\
  \n但在执行这一策略时，他们吃了大亏。这是因为，为每一分钱争夺的碎片化供应商格局本身就是一个复杂的各种泥潭，其中大多数技术都无法良好地协同工作。很多时候，这些技术被推广、购买并被置放在架上。预算被消耗了，“闲置软件”不断增加，而组织并没有因为这些创新、意图或投资而变得更安全。即使这些技术最终下架并投入部署，它们也很可能与组织的其余防御系统没有集成。\n\
  \n想象一下，带着库存中杂乱无章的火器去战争。想象一下，在部署这些武器时表现不一致，不足以充分覆盖你的防御基地。现在请想象，你的战斗员之间无法通信，无法共享他们遭遇的威胁信息，从而无法共同加强你的协同防御。\n\
  \n你可能不需要想象。如果你的公司确实有这种情况，只需访问其安全运营中心（`SOC`）即可，那是你的网络安全同事作为公司与无休攻击之间第一响应者的神经中枢。这些前线网络安全专业人员通常继承了多年积累的补丁式技术和工具，这些工具通常是在公司内几任\
  \ CISO 任期内采用的。这些产品许多并不共享威胁情报，更不用说让网络安全专业人员的工作变得更容易了。你经常会发现你的网络安全同事在为工具工作，而不是工具为他们工作。\n\
  \n研究网络安全市场的独立行业分析机构企业战略集团（`ESG`）报告，40% 的组织部署了超过 25 种网络安全工具。大约相同比例的人承认手动收集情报馈送。27%\
  \ 的人认为安全团队大部分时间都花在救火上，而不是从事战略项目，这导致了员工的倦怠和流失——对于面临全球人才短缺危机的 CISO 来说，这是灾难性的后果。\n\n\
  仿佛这还不够，网络安全行业内部存在着一个肮脏且不可避免的秘密。那就是：没有任何一种产品可以击败网络犯罪。你可能并不觉得这很意外。毕竟，这等同于武器库中只有一种武器去参加持续战争。你不会这样做并指望能坚持多久。\n\
  \n但现实情况不仅于此。不仅没有一种所谓的“银弹”式防御手段可以免疫所有威胁，而且每种防御技术在首次部署时都是最有效的。\n\n## 给董事会和 CEO 的 W.I.S.D.O.M.\
  \ 建议\n\n### 网络安全格局的现状\n碎片化的供应商格局是一个复杂的各种泥潭，这些技术往往无法协同工作，导致“闲置软件”和职业倦怠。没有任何一种产品可以击败网络犯罪。每种防御技术在首次部署时最有效。\n\
  \n### CISO 的战略重点\n为了应对这种环境，CISO 必须关注：\n*   **集成**：确保技术与组织的其余防御系统集成。\n*   **自动化**：利用自动化将员工从收集情报馈送等手动任务中解放出来。\n\
  *   **统一防御**：从补丁式的工具转向协同防御策略。\n*   **早期采用**：在不损害整体安全态势的前提下，理解部署新技术的风险。\n\n\n\n\n\
  读这本书的每一个人要么是网络安全问题的一部分，要么是其公司解决方案的一部分。首席执行官（CEO）和董事成员也不例外。有多种方法可以最终发现我们中的那些“赛璐珞人”（Mr./Ms.\
  \ Cellophanes），并给予他们应有的认可和支持。\n\n## 董事会议程中的网络安全\n\n首先，网络安全不应是董事会议程中随机或零星的话题。而且，它不是一个在不可避免的漏洞发生之前可以完全忽略的话题。董事会必须将网络安全作为一个常备话题。我并不天真地认为网络安全永远能获得与财务表现同等的时间或关注。但如果董事会对降低风险感兴趣（我相信大多数董事会都是如此），那么请在议程中为网络安全留出合理的时间。\n\
  \n### 你应该分配多少时间？\n\n这取决于你的董事会会对这一主题的了解程度。如果你还没有让你的 `CISO` 对目前的网络安全态势提供有意义的见解，*请为该主题分配至少\
  \ 90 分钟。*在这些时间内，你的 `CISO` 应该涵盖对公司整体最关键的资产。\n\n这需要与业务部门领导者进行大量的协商。正确的答案可能并不显而易见。例如，客户数据可能不是你们组织最宝贵的资产（尽管它在列表中可能排名非常高）。如果你经营的是大型制造设施的业务，这些场所可能是你们最具战略性的资产（而且，由于由于连接设备渗透到业务的几乎每一个方面，有动机会的黑客往往会攻破[甚至关停]这些设施）。\n\
  \n你的 `CISO` 应该提供每项资产的当前漏洞状态，并按资产战略价值的优先级进行列出。在不过度简化任务的情况下，你可以想象一个 2x2 象限，漏洞状态和战略优先级分别绘制在两个轴上。*那些既具有高度战略性又高度脆弱的资产应该立即重新分配预算。*\n\
  \n在预算分配方面，虽然这看起来是这项练习的显而易见的成果，但大多数董事会倾向于仅在发生漏洞时才松开腰包——即便这都是一个很高的要求。2017 年，`EY` 的全球信息安全调查发现，76%\
  \ 的高管承认，只有在发生产生实际损害的漏洞时，才会触发额外的网络安全资源分配。没有损害的漏洞？近三分之二表示这不会迫使额外支出。(15)\n\n拥有足够的网络安全知识以对网络风险提供有效监督至关重要。然而，不到\
  \ 40% 的董事会具备这种知识。(16)\n\n一旦你的董事会和 `CISO` 达成一致，请让你的 `CISO` 成为董事会议的常驻人员。网络安全变化的速度令人惊舌。你的对手非常有动力伤害你。他们不休息。你也不应该。\n\
  \n*在每次董事会议上至少花 30 分钟讨论网络安全话题。* 如果平均董事会每年召开六次，每次四小时，我要求在这个重要话题上花费的时间少于 15%。`Deloitte`\
  \ 报告显示，不足 20% 的董事会将网络安全作为常备董事会议程。(17) 如果 `Deloitte` 说得对，由于每年在这些方面花费三个小时……我们似乎必须在这些方面下功夫。`CISO`\
  \ 应该在团队中保持活跃。\n\n## 让“赛璐珞人”现形\n\n`CISO` 是执行团队中不可或缺但往往往往被低估的成员。虽然网络安全是每个人的责任，但董事会和\
  \ CEO 必须从高层建立正确的基调。你必须发挥作用，将网络安全提升到它应有的地位。\n\n我最喜欢的电影台词之一出自《嫌疑犯》（*The Usual Suspects*）：“魔鬼过的最伟大的诡术就是让世界相信他不存在。”你的对手最想要的无过于让你继续把那些“赛璐珞人”整齐地藏在阴影中。他们希望如果你这样做，就会忽视他们——即那些日益增加的、试图伤害你的黑客大军。这些坏分子希望你将网络安全视为一种非战略性投资而降低其优先级。不要给他们这种权力。\n\
  \n如果你在这一点上失败了，你就面临失去执行团队最有价值的成员之一的风险：“赛璐珞人”。我提到的那个网络安全人才短缺将证明你很快很难招聘到替代者。\n\n`CISO`\
  \ 在公司的任期相对较短，根据某些行业基准，低达 24 个月。`ESG` 试图找出为什么 CISO 的寿命如此短。网络安全劳动力市场目前以及在可见的未来都是卖方市场（这归功于人才短缺）。但\
  \ `ESG` 发现，当一个 CISO 辞职加入另一家公司时，起不仅仅是补偿：\n\n- 36% 因为目前的雇主没有强调网络安全的企业文化而离开（幸好你正在读这本书！）；\n\
  - 当他们不是执行管理层和董事会的活跃参与者时离开；\n- 30% 当网络安全预算与组织的规模或行业不符时选择逃离。(19)\n\nCEO 和董事会可以做很多事情成为网络安全解决方案的一部分，包括让你的\
  \ `CISO` 发声。除了让她参与对话，还要为她提供一个平台来争取更多资源（考虑到我与你分享的，她对更多资金的需求很可能是合法的）。尽管如此，要将她视为执行成员，并通过提问关键问题来检查她的论点。要做到这一点，你必须首先丰富你对网络安全问题的理解——我希望这一章支持这一追求。\n\
  \n\n\n首席信息安全官（CISO）的真实内核并非脆弱的玻璃纸制成。在转型的狂风中，她拥有钢铁般的脊梁；拥有铁腕，以冲破无休止的攻击；；拥有混凝土般的下颌，以承受那些会让其他较弱个体瘫痪的指责。当你最终意识到并欣赏了这位执行管理团队中最受误解成员所具备的毅力和决心时，你才将网络安全带出阴影，连同那些宁愿留在阴影中的对手一起。\n\
