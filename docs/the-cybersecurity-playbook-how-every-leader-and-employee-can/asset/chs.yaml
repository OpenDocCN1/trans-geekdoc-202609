  \ of Canada, 1994.\n\n\n\n\n从我的第一次飞行到现在，我竟然走了如此远。那时我只是 `INROADS` 的一个 20 岁的实习生，这家非营利组织给了我在美国企业界的起步。当时，我正和朋友和其他实习生一起从坦帕飞往特兰大，参加一次特殊的\
  \ `INROADS` 线下活动。我登上飞机，坐在了最后方的一个座位——就在洗手间旁边。我觉得这运气极好，因为万一有内急，我离洗手间格外近。多方便啊！\n\n\
  当空乘员进行安全演示时（这是我的耳朵第一次听到这些指令），我很听话地开始扣安全带。只是，安全带没扣上。在几次尝试失败并向旁座乘客寻求帮助后，结果显而易见：我的安全带坏了。我记得当时心里想：*好吧，我想安全带某种程度上是可选，就像校车上的安全带一样。*\
  \ 我没有多想就提了这件事。空乘员也没有多看一眼来确认我是否已经系好。\n\n当然，在空中飞行了数百万英里后，我知道安全带损坏是件多么严重的错误。今天，如果腰间没有系好牢固且合适的安全带，我甚至不会考虑在跑道上滑行，更不用离开地面了。（顺带提一句，我首航乘坐的那家航空公司最终倒闭了。其最终崩盘的核心原因？严重的安全问题。）\n\
  \n现在，我知道飞机上和机场的安全是什么样子的、是什么感觉了。我很清楚，有一套庞大的基础设施确保了我作为乘客的一项首要权利：安全体验。这并不是说飞机不会坠毁。但同时，我不必接受任何低于航空旅行中严格执行的安全标准的待遇——是的，一条有效的安全带显然也列在清单之列。\n\
  \n航空旅行之所以仍然是最安全的交通方式，是有原因的——它比汽车安全 100 多倍。^(2) 一安全文化渗透在航空业的每一个方面。\n\n这个表述听起来可能并不觉得不寻常。你可能会认为安全本应该是航空旅行的核心。毕竟，这个行业的存在是为了将珍贵的货物——在这种情况下，是人类生命——从一个地方运到另一个地方。你只对了一部分。事实上，安全已如此紧密地织入航空旅行的肌理，其普遍性恰恰掩盖了它在行业初期几乎不存在的起点。\n\
  \n当我们回想起过去美好的飞行时代时，脑海中会浮现出这样的画面：穿着时尚的乘客，受到服务意识极强的空乘员的照料，坐在腿部空间充足的豪华客机上，在友好的高空享用着高级菜肴。这种怀旧的画面所缺失的是对当年飞行危险性的任何现实描述。由于当时根本谈不上什么“安全文化”，乘客的死亡率几乎是今天的平均水平的四倍^(3)\
  \ 请看这些乘客在商业航空旅行历史上曾在不同时期面临过的安全顾虑清单：\n\n1. 由于于在恶劣天气下起降飞机的技术大不如人意，空中碰撞和致命性着陆要常见得多。\n\
  2. 发动机掉得非常频繁，以至于只要另一台发动机能及时让飞机着陆，这些事件甚至不会被记录为事故。\n3. 低劣的安全带设计和较低的客舱天花板意味着剧烈的气流可能导致的不只是午餐洒了一地——它可能导致颈骨断。\n\
  4. 说到气流。在当年的飞机上气流常见得多，因为那时飞机缺乏加压客舱，无法在更高、更安全、更舒适的高度飞行。\n5. 对于脚下不稳的乘客来说，去飞机洗手间是危险的。一旦绊倒，你可能会发现自己掉落在椅子或桌子的尖锐边缘上，那是环境中另一个导致受伤或死亡的危险因素。\n\
  6. 隔头等舱和经济舱乘客的玻璃隔板很美观。但在事故或气流中，它们也可能破碎并将碎片溅到乘客身上。\n7. 你可以在飞机上点烟。二手烟增加了机内的“氛围”。\n\
  8. 如果由于香烟、线路故障或未经批准的货物（例如化学氧气发生器——是的，这真的发生过）导致火灾，机上既没有烟雾器也没有灭火器来提供警告或解决问题。\n9. 把身份证件忘在家里了？不用担心。登机不需要身份证件。\n\
  10. 即使在身份证件成为要求后，机票上的名字和身份也不需要一致。\n11. 携带武器登机？空乘员甚至可能帮你将其存放在行李架上以妥善保存。^(4)\n12.\
  \ 国内航班对托运行李不进行安全检查。\n13. 国际航班对托运行李有安全检查——*有时如此*。\n14. 刀片、织针、剪刀和棒球棒？这些都是飞机上受欢迎的配件。\n\
  15. 人越多越好。乘客可以（而且经常这样做）把亲人一直送到登机口告别。\n16. 访问驾驶舱对幸运的乘客来说是一种享受。你甚至可能因此获得你的“机翼勋章”。\n\
  17. 在访问驾驶舱时，你会遇到一位飞行经验仅为那些执勤人员分之一六^(5)的飞行员。\n18. 那位飞行员还可能疲劳，这归功于对强制休息要求的规定更加宽松。\n\
  19. 我们现在认为理所当然的安全指令？在飞行早期要严苛得多。像调暗舱内灯以及在起降时升起窗帘这些措施是乘客福利中较新的增加，因为这两者都能让航空旅行者适应可能遭遇的环境。\n\
  20. 每天筛选超过两百万乘客和机组人员的 `TSA`？2001 年以前不存在。\n\n这些只是航空安全在几十年走了多远的 20 个例子。我还没有触及 9/11\
  \ 事件后世界所发生的所有变化。\n\n这些变化并非一蹴而就。它们是一个面临敌对（无论是环境还是人类）威胁的行业，在压力下不断推高安全标准的标准。\n\n\n\n\
  \n难以置信，但在这些年里，劫机已成为一种常见现象，以至于乘客们将其视为航空旅行体验的一部分。1968 年，《时代》杂志用一篇标题恰当的《当劫机者来临时该怎么办》的文章，对这场劫机之乱进行了些许嘲讽。在文中，记者报道了在过去的\
  \ 11 个月里，有超过 1000 名美国人被改道至古巴。尽管“飞行员随身带着哈瓦那何塞·马尔蒂机场的地图以备万一，空乘人员也被指示不要与潜在的劫机者争论——只需服从他们的命令……但还没有人想过向可怜的乘客进行简报。”^([8]\n\
  \n作者慷慨地提供了一些准则和禁忌，以防某人发现自己成为劫机飞机上的无辜乘客——比如不要具有侵略性、不要恐慌、不要按呼叫按钮（免得提示声惊扰劫机者，导致其无意中开枪），并且不要大声呼叫“空姐”。当航班抵达古巴时，记者建议了两个要做的事：保持冷静并享受这次停留（文章甚至提供了关于该地区舒适过夜住宿的一些有用细节）。\n\
  \n### 航空公司是如何应对这种持续不断的威胁的？\n\n他们顺从了劫机者。如果劫机者想在古巴（或任何地方）着陆，飞行员就会改变飞行路线。考虑到当时古巴作为劫机的热门目的地，无论航班的预定目的地何地，所有驾驶舱都配备了加勒比海的地图。此外，飞行员还拿了西班牙语常用语卡片，以帮助他们与飞往古巴的劫机者交流（例如学习如何说“我必须打开我的飞行包以取地图”或“飞机有机械故障——无法到达古巴”）。^([9]\n\
  \n如果犯罪分子想要钱，航空公司就会支付赎金，并希望在当事人被捕后换回。航空公司顽强地斗争保护其现有的松散安全控制，坚决反对诸如金属探测器之类的威慑性措施，因为这些措施会阻碍劫机者，而他们不想让其付费的客户接受同样的审查。\n\
  \n令人难以置信的是，航空公司对实施安全限制的概念如此抵制，以至于甚至考虑在佛罗里达南部建造一个模仿古巴的假机场，作为金属探测器等设施的替代方案。根据这项提议，飞行员将降落在诱饵机场，联邦探员将在那里等待嫌疑者的抵达。\n\
  \n由于成本原因，假机场的想法被抛弃，转而采用行为画像分析。售票务员会对乘客进行检查，查看是否存在约 20 种可能的潜在伪装劫机者的行为警示标志之一。为了将乘客的便利性置于安全之上，这种画像分析仅适用于不到\
  \ 1%的旅行者，让超过 99%的人不受束缚。\n\n航空公司并没有轻易拥抱我今天对他们所赞誉的安全文化。事实上，他们接受了环境中的这些人类对手，并开发了与他们合作的惯常做法。现在随处可见的安全控制最初并不符合航空业追求“最佳客户体验”的范式。在当时，顺从恐怖分子而非确保航线安全的理由似乎是合理的。这是航空旅行首次从精英阶层转向大众市场旅行者。让旅行者额外花费\
  \ 15 分钟成本的安全延误，可能足以刺激他们选择其他交通工具。对于这个相对尚幼的行业来说，这是一个他们无法承担的风险。\n\n直到 1972 年 11 月 10\
  \ 日，劫机从轻微的不便领域演变成了国家威胁。三名劫机者威胁要将飞机撞入田纳西州奥克里奇国家实验室的一个原子反应堆。联邦航空管理局（FAA）采取了航空公司曾推卸的措施。次年\
  \ 1 月，所有乘客都将接受身体检查，包括通过金属探测器并接受行李检查。\n\n对手如果不是果断且创新的，那就无无一事。当由于实施了机场筛选导致劫机变得更加困难时，犯罪分子将注意力转向了飞机炸弹。当\
  \ 2 世纪 90 年代加强安全措施以防御这种威胁因素时，恐怖分子在 2001 年 9 月 11 日突破了这些限制。每当威胁出现时，航空业都会通过增加安全措施做出回应。\n\
  \n*   2001 年 12 月 22 日，机上乘客理查德·里德试图引爆炸鞋物。几年后，TSA 规定了要求检查鞋子。\n*   2006 年 8 月 9 日，官员阻止了一起携带爆炸物的阴谋。TSA\
  \ 规定了限制司司液体。\n*   202 世纪 9 月 26 日，机上乘客乌马鲁克·阿卜穆塔比携带 3.4 盎司液体。TSA 规定了使用透明塑料袋。\n* \
  \  2009 年 12 月 25 日，机上乘客乌马鲁克·阿卜穆塔比在内裤里塞了爆炸物。TSA 规定了全裸检查。\n\n\n\n\n9. 乘客及时到达机场接受安检。这些清关工作（包括核实乘客是否在监控名单上）早在航班很久就开始了。\n\
  \n10. 旅客需提供政府颁发的照片身份证明，且姓名与票面信息一致。\n\n11. 托运行李都会经过检查——`all the time.`\n\n12. 未加入特殊计划（如\
  \ `TSA Pre-Check`）的乘客需要从手提行李中取出笔记本电脑、鞋子、外套以及符合 3–1–1 标准的液体。\n\n13. 所有手提行李都将经过 X\
  \ 射线检查，否则就是物理搜查。\n\n14. 每位乘客都要接受金属探测、毫米波人体成像和/或物理拍击检查，以防违禁品。\n\n这些安全检查（包括安全筛查）对于抵达美国的国际航班来说，程序可能更加严格。\n\
  \n批评者会迅速指出这些安全评估在保护乘客方面的不足之处。他们会强调 `TSA` 在自身渗透测试中的失败率，在 2017 年，至少有 70% 的非法违禁品漏过了他们的防线。事实上，没有任何安全态势是完美的，航空业也不例外。\n\
  \n与其批评，不如让我们看看其实绩。更具体地说，让我们看看许多人可能认同的最关键结果——乘客的安全运送。在这一指标上，航空业的表现确实非常出色。\n\n2018\
  \ 年，`Aviation Safety Network` 报告显示，大型商业航班的致命事故率为每百万次航班 `.36` 次。这相当于每三百万次航班中发生一次致命事故。\n\
  \n某些国家（如美国）的死亡率更低。从 2009 年到 2018 年，美国运营的航空公司在近 10 万次航班中运送了数十亿人，没有人员死亡。\n\n这些结果不言自明。作为一名频繁旅行者，这给了我信心：我死于心血管疾病、车祸、雷击，甚至是被蜂蜇的概率，远比在飞机上丢命要得多。我可能会担心带错物品或把证件忘在家里，但我并不担心自己的安全。这是因为我知道航空业深陷安全防护之中。公共部门和私营部门已为了同一个目标联合在一起：确保旅客安全。\n\
  \n也许你们公司并不是从事保护生命的业务。又也许你们的行业还没有见过等同的“劫持黄金时代”。也许你们公司还没有经历过比喻上的 `9/11`。我希望你们不需要经历这些就能让你以及每一位员工和董事会成员将安全置于正确的位置。\n\
  \n*   将安全工作从后台办公室移到董事会。\n*   让每位员工都能为保障公司安全尽一份力。\n*   当安全缺失时停止产品开发流程。\n*   弥补网络安全人才短缺的差距。\n\
  *   在发生泄露时立即且透明地做出响应。\n*   将安全贯穿于庞大的第三方生态系统中。\n*   在每个工作场所建立安全文化。\n\n这些处方能让你们公司永远遭受泄露吗？显然不能。但它们能否带来积极结果，让你们公司更有效地降低风险并从攻击中恢复？绝对可以。\n\
  \n尽管我对航空业的事绩赞誉有加，但它并不能免于威胁——人为或其他因素的。在我短暂回到家乡坦帕的前几天，收到了埃塞俄俄航空坠毁的毁灭性消息，机上 157 人全部遇难。我妈妈不是经常旅行的人。然而，她是有线新闻频道的频繁观众。在我出发前的几天，她给我打了电话。\n\
  \n“Allie，我很担心你来这儿。你坐的是哪种飞机？”\n\n“妈妈，我不知道。你在看什么？为什么要问这个？”\n\n“有报告说埃塞俄比亚航空的坠机事故与几个月前的另一起事故相似。他们乘坐的都是\
  \ `737 MAX` 飞机。那是你的飞机吗？”\n\n“妈妈，请别再看新闻了。我很好。我死于车祸的概率比死在飞机上大得多。（后面是更多关于航空安全记录的唠叨，其中大部分并没有穿透我妈妈对于听到任何可能缓解她恐惧的信息而建立的非凡防御）\n\
  \n“宝贝，我只需要知道你坐不是那种飞机之一。如果是的话，我们重新安排行程。”\n\n事实证明我不需要重新安排行程。我也不需要检查航班的机型。在我计划出发的前一天，`FAA`\
  \ 停飞了所有 `Boeing 737 MAX 8` 飞机。那种覆盖在我经常使用的航空业各个方面的安全文化，再次将我的安全放在了首位。\n\n虽然我可能没有怀疑过潜在的危险，但\
  \ `FAA` 的行动并没有被我妈妈遗漏。起飞前一天晚上，她给我打电话确认我的到达细节。\n\n“Allie，我很高兴我们不需要重新安排航班。感谢谢天，他们停飞了那些飞机。”\n\
  \n“是的，妈妈。确实感谢谢天。”\n\n\n\n\n8. ^(8) “当劫持者来临时该怎么办”，*时代*，1968 年 12 月 6 日，[`content.time.com/time/subscriber/article/0`](http://content.time.com/time/subscriber/article/0),33009,844656,00\
  \ .html。\n\n9. ^(9) Koerner，“劫持者是如何接管超过 130 架飞机的”。\n\n10. ^(10) Summer Meza，“TSA\
