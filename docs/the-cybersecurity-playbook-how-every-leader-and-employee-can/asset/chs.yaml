  \n# 第 3 章：早上好，这是给你的唤醒时刻\n\n我说过我从没有在主观的情况下违反过公司的网络安全政策。然而，我觉得整体上更广泛的问题是，对于政策内容是什么，并不总有清晰的沟通。这些问题往往被经理们一笔带过，因为他们自己也并不总是精通所有的规则。我认为这种现象的原因是，大多数人在涉及网络安全和保护公司信息时，并不理解其行为的所有影响。组织中的许多人在尝试安全使用技术方面已经尽了全能。但那是几乎每家公司的\
  \ IT 部门都在进行的一场持久战。\n\n> 受访者，McAfee 在线民族志研究\n\n我在对权威保持健康尊重的环境中长大。我的父母比较严格。他们希望我能遵守合理的规则。完成作业。宵禁前回家。打扫房间。尊重长辈。这些都是培养一个负责任且有贡献的社会成员的基础。\n\
  \n所以，当我在一个周末早晨收到妈妈的一封语音邮件，说有执法人员在找我时，我顾不及去拿手机。\n\n* “Allie，纳什维尔的一位警长刚打来电话找你。他说由于你缺席了戴维森县（Davidson\
  \ County）的法庭，对你有一个逮捕令。”\n\n当我听着妈妈慌忙地给我那个警长的信息时，我的心跳开始加速。\n\n* “妈妈，这不合逻辑。我我已经没住在纳什维尔\
  \ 20 年了！我从未被告诉我需要去出庭。”\n\n* “亲爱的，我告诉他同样的话。我告诉他会让你打给他的。”\n\n我比我丈夫起得早得多。我打算在他醒来之前快速地处理掉这个电话。\n\
  \n我拨打了纳什维尔区号 `(615)` 的数字。\n\n* “我是约翰逊警长。”\n\n\n\n\n\n你是否曾经在拨打过去的人接听电话时感到措手不及？那种感觉很奇异。你预料会有个回应，但结果并没有。这正是我听到他的声音时的那种感觉。我发现自己在苦思冥想地寻找该说的措辞。\n\
  \n*   “呃，你好，约翰逊警长。我是艾莉森·塞拉（Allison Cerra）。我听说你今天早上和我妈妈通过电话了。”\n\n他并没有像我那样哑口无言。\n\
  \n*   “是的，塞拉小姐。我联系你母亲是因为我们一直在尝试联系你。我这里有一张未执行的逮捕令，要求你前往田纳西州戴维森县（Davidson County）面见[姓名未披露]法官出庭，因为你\
  \ 8 月份缺席了庭审。”\n\n*   “我显示你以前住在纳什维尔，是这样吗？”\n\n权威是一种强大的力量，尤其是对于那些终生都尊重权威的人来说。我从小就学到，当权威人士向你提问时，你不要用问题来回答问题。你只需要给出回答即可。\n\
  \n*   “是的，没错。”\n\n*   “嗯，我们显示你有一张关于 8 月 15 日缺席庭审的逮捕令。”\n\n权威还会强迫你纠正事实。这家伙绝不可能是对的。但我并没有触发“战斗或逃跑”的本，也没有拉响怀疑的警报（以及质疑），我对权威那压倒性的服从反而让我开始了解释。\n\
  \n*   “先生，我很抱歉。这听起来不对。我只在 1995 年的几个月前在纳什维尔住过几个月。8 月份时我甚至不在纳什维尔。”\n\n*   “塞拉小姐，我不知道该对你说什么。令是法官签发的。你得和她处理这件事。”\n\
  \n现在，故事发生了意想不到的转折。因为你本会预料，如果这家伙是个骗子，他会立刻开始那套“但如果你把信用卡号给我，我一定能帮你解决这个问题”的推辞，那无疑会让我的警报瞬间大作响。\n\
  \n但他完全没有那样做。他只是一直向我提问以核实我的背景。\n\n而我只是在回答。\n\n*   “我显示你住在这个地址，对吗？”\n\n*   “是的，先生。没错。”\n\
  \n*   “我显示你现在住在丹尔顿县（Denton County）。对吗？”\n\n*   “是的，和我丈夫住在一起。”\n\n注意我当时是如何完全处于权威的掌控之下，回答问题时提供的信息甚至比要求的还要多。这家伙完全把我拿捏了。\n\
  \n大约这时，我丈夫从卧室走出来，揉着眼里的睡意，但他足够敏锐，意识到我正在打一个严肃的电话——而且听起来不像工作电话。\n\n*   “发生什么了？”\n\n\
  警长还在跟我核实信息。我匆忙把他按了静音，向我丈夫同步一下早晨发生的情况。\n\n*   “妈妈打电话了。她接到了纳什维尔一个警长的电话，说因为我缺席了庭审，我那里有一张逮捕令。我正和他他通话，试图解决这件事。”\n\
  \n*   “这怎么可能？你已经没在那儿住很久了。”\n\n（现在我开始对丈夫说出这些显而易见的话感到不耐了。）\n\n*   [咬牙切齿地]“我知道。所以我才试着解决这件事。”\n\
  \n接着，我那还没睡醒的丈夫问了我一个我在拨通号码之前本应该自问自己的问题：\n\n*   “你确定这家伙不是在骗你吗？”\n\n你是否经历过想法快得涌入脑海，快到你可以在几纳秒内回放生命中过去的几分钟？对我来说，那是自从我第一次接到妈妈的短信以后的\
  \ 30 分钟，而我此刻正在脑海中重演这一切。在这 30 分钟里的第一次，我拥有了前所未有的清醒。\n\n我的大脑一片空白，心跳由于完全不同的原因而加速。“某某警长”还在喋喋不休，我的“战斗或逃跑”反应终于出现了。我试图理清思绪。\n\
  \n*   “警长，我确定这是个误会。感谢你的提醒。我会回电给你的解决这件事。”\n\n我想挂掉这通电话。他表现得异常客气。没有那种要信用卡号的最后通牒。警察在几分钟内就会出现在我的家门口。\n\
  \n*   “没问题，塞拉小姐。我明白。你可以打这个号码回给我。”\n\n电话断了。\n\n在我挂电话之前，我丈夫已经在用手机拨打戴维森县警局的电话了。\n\n\
  你可以猜到故事的下半部分。那里并没有什么约翰逊警长。正如我那里并没有什么缺席庭审的逮捕令——或者任何其他东西。显然，这种骗局非常流行，正如丈夫电话那头的真实警察所证实的那样。\n\
  \n*   “我们每周至少会接到一次这种电话。这是骗局。告诉你你妻子，我们不会那样打电话。我们会直接上你家门。”（废话。我觉得自己像个傻瓜。）\n\n但为了保险起见，我去了我们当地的派出所，确认我作为一个负责任的社会成员的记录没有任何污点。我带着那份根深蒂固的对权威的度尊重，询问柜台后的警察是否打算逮捕我。当他回答“没有”时，我感到如释重负。\n\
  \n***\n\n你可能会怀疑自己购买一本保护公司免受网络威胁的书的判断，毕竟，我已经承认自己犯过这种错误了。\n\n网络安全行业将此类诈骗称为“社会工程学”。你熟悉的这种变叫做“网络钓鱼”，即网络犯罪分子发送恶意邮件，伪装成受害者圈子内的信赖权威，要求他们提供敏感信息或点击链接。我们已经有些低估了网络钓鱼或创造者的想象力。网络钓鱼早已远离了“我是尼日利亚王子，我钱”的时代。仅在\
  \ 2018 年，麦克菲就检测到了超过百万个新的钓鱼 URL。[([1])\n\n而且社会工程学延伸了数字领域，正如我的经历所证明的那样。\n\n在没有陷入某种黑客将夺走我们所有东西末日预言之前，有一个清醒的现实是我无法夸大的：对于任何读这本书的个人员工来说，`你`都是你们公司对抗网络犯罪战斗中最强或最弱的环节之一。\n\
  \n考虑一下这句话的力量。行业分析机构 Gartner 预测，2018 年全球公司在网络安全产品和服务上的支出超过了 1140 亿美元。[([2]) 这让网络安全与其他规模超过\
  \ 1000 亿美元的行业（如数字电视和视频、数字营销和游戏）处于同一水平。\n\n\n\n\n然而，这种投入并不能取代员工做正确的事并把事情做好。\n\n##\
  \ 最好的防御\n\n数千年来的军事历史记录了最好的防御是良好的进攻。这解释了为什么乔治·华盛顿在领导一个初生的国家在独立战争中取得胜利近二十五年后，即使在退休后，在他的著作中包含了这条经过时间考验的军事建议。在与对手竞争时，这是一条可靠的指导：先发制人，你的对手在防御自己上花的精力将比攻击你更多。在体育运动中，球队争争在比赛中先得分，以赢得初始势头。在商业领域，公司寻求通过发布新产品或服务获得先发者优势，以占领早期市场份额。\n\
  \n在网络安全领域，公司并没有所谓的“良好的进攻”。这是因为从定义上来说，公司并不是首先出手的人。那是对手的工作。对手`always`拥有先发者优势。他们应用了那些对声誉良好的类别非常有效的公理。我们的公司注定要永远处于防御。在网络安全领域，最好的防御是良好的（即使不是卓越的）`defense.`。\n\
  \n我之前提到过，我认为大多数员工都想帮助保护自己的组织。他们只是不知道如何有效地发挥自己的作用。\n\n但假设我是错的吧。让我们假设一下，你对公司没有任何利他主义动机。这并不是说你希望公司遭受损害。例如，你不会故意把你的雇主推到推车下。但也许你也是那种不会为了公司而挡在移动车辆面前的人。\n\
  \n那将让你属于冷漠的旁观者一类。你认为你的公司在网络安全上花了足够的钱。他们雇了人来做防御工作。如果你渴望从事这类工作，你本会去寻求相关的学位和工作。但你没有。你在公司的另一个领域工作，你认为网络安全工作由（且应该由）其他地方来处理。如果你的公司确实遭受了泄露，假设你最终不是被发现负责此事的人，那么这真的不是你的问题。他们会支付罚款，可能会失去一些客户。但生活和工作仍会继续。\n\
  \n如果你发现自己属于这一类，你并不孤单。事实上，在麦菲（McAfee）对你这样的员工进行的在线民族志研究中，当我们提出以下问题时，我们听到了类似的想法：\n\n\
  *   一线员工在维护贵组织网络安全中起着什么角色？你认为你起的是关键作用还是背景作用？\n*   受访者 1：`我认为我在公司的网络安全中起的作用非常微小。我认为意识到我如何能帮助保护公司信息很重要，但整体的高层安全工作应该由公司里更高级别的员工来处理。`\n\
  *   受访者 2：`更多是背景角色，因为我们的 IT 部门处理所有的幕后网络安全。`\n*   受访者 3：`我认为我起的是背景作用。第一道线是我们 IT 团队的技术，然后是我们的\
  \ IT 团队本身，最后是普通员工。`\n\n似乎至少有一些员工认为，网络安全留给 IT 内部的工具或团队，或者上报给公司的高层管理人员为好。这两种观点都存在问题。\n\
  \n首先，没有足够的网络安全人员来应对这个问题（回到我在上一章中提到的网络安全人才短缺问题）。网络安全需要全员总投入。\n\n其次，如果你认为你公司的高权人物最适合解决这个问题，请不要那么确定。是的，CEO\
  \ 和董事会有责任从上而下定下涵盖网络安全的基调。但 60% 的 C 级领导和 IT 执行人员表示，直接负责信息安全的人并不是董事成员.^(3)\n\n可以理解为什么网络安全推诿的心态在组织中是如此普遍。网络安全行业创造了一个被称为“泄露疲劳”（breach\
  \ fatigue）的状态。当我们允许环境中泄露的噪音模糊我们响应的紧迫感时，就会发生。我们要么相信最终会代我们付出代价（尽管消费者最终通过更高的价格承担了泄露的后果），要么由于假设我们个人对防止泄露无法做任何事情，从而放弃了我们对自己命运的真正控制权。\n\
  \n这本书试图通过提供你就可以采取的实际步骤来帮助公司防止泄露，从而解决后一种观点。这是关于给你`什么`可以`做`。但如果你发现自己属于前一营，请让我花点时间告诉你为什么你应该`care`。\n\
  \n几周前，我收到一封来自我们人力资源部门某人的邮件。她转发了一封发到她个人邮箱的邮件。邮件看起来是来自我的。邮件要求她回复如何更改我自动工资存款账户的指令。发送者的邮件地址来自一个个人邮箱，推测是我的。\n\
  \n幸运的是，她的直觉起作用了，她将邮件转发到了我的工作邮箱，并提了一个简单的问题：\n\n*   Allison，我今天收到了这封邮件。你能确认是你发送的吗？\n\
  \n我没花多久就回答了一个坚定的否定。我们向安全运营中心（SOC）报告了该事件。他们追踪了那封邮件，发现一名黑客入侵了她的个人邮箱。\n\n我确定，如果我去查阅那个\
  \ HR 员工的职位描述，那里不会提到“网络安全”是一项要求或预期。我打赌，那里不会包含要求她对针对员工身份的网络威胁保持警惕作为核心职责的语言。直接联系我以确认她收到的邮件是否合法，这并不在这个个人的“职位描述”范围内。然而，这正是她所做的，我因为她的明智判断和关注而受益匪浅。她的培训阻止了从我们内网网站上复制并粘贴关于如何轻松更改直接存款的指令进行回复。我惊叹自己的运气，幸好她的直觉让那个黑客的工作变得困难得多。而且她挽救了我试图扭转糟糕结果时可能经历的沮丧时间。对我来说，危机化解。\n\
  \n\n\n\n\n如果这些论据还不足以说服你关注这个问题，那么看看这个：公司面临的数据泄露风险已达到所未有之高。这归功于监管机构的不断施压，以激励公司保护客户数据。《通用数据保护条例》（`GDPR`）适用于所有在欧盟（`EU`）开展业务或监控其境内数据主体活动的公司。如果公司被发现不符合\
  \ `GDPR` 关于收集和保护客户数据的标准，可能会损失全球年度营业额的高达 4%。2018 年，Ponemon 报告显示，数据泄露的平均成本为 386 万美元——而这很大程度上是在\
  \ `GDPR` 实施之前。任何在 `EU` 经营业务且全球年收入超过 1 亿美元的公司，都可以预见到将为违反 `GDPR` 的泄露支付更多费用——取决于其收入情况，金额可能要多得多。\n\
  \n数据泄露的风险是巨大的。数据泄露的成本则更高。不要因为公司过去可能幸过一次泄露，就认为它能度过下一次攻击。即使幸存了，财务压力也可能导致其他后果，甚至包括裁员。如果你倾向于保留现有工作并希望公司继续经营，你就必须将网络安全视为你工作描述的一部分。敌人最喜欢你表现出的极度漠不。\n\
  \n## 给员工的 W.I.S.D.O.M. \n\n根据 Verizon 的《2018 年数据泄露调查报告》（`DBIR`），超过四分之一的泄露由员工直接或间接负责。在超过\
  \ 60% 的案例中，责任源于一名疏忽的员工。这意味着近 20% 的泄露是由于于疏职员工之手。这就是为什么员工一直是公司网络安全防御中最强或最弱的链节点之一。\n\
  \n幸运的是，员工可以采取许多措施成为网络安全解决方案的一部分，而不是问题的制造者。首先，要警惕社交工程诈骗。网络犯罪分子知道如何利用员工的信任。而且他们的方法正在改进。鱼叉式钓鱼（Spear\
  \ phishing）是一种通过恶意通信（如电子邮件）专门针对某些个人或公司的策略。与传统的钓鱼（网络犯罪分子使用的更像是一种“撒网式”策略，换句话说，几乎或完全没有针对性）相比，鱼叉式钓鱼活动有效得多，因为犯罪分子付出了巨大努力使信息个性化。\n\
  \n大鲸钓鱼（Whaling）是鱼叉式钓鱼的一种，攻击者伪装成公司的高层主管（如 `CEO` 或 `CFO`），并要求毫无防备的员工采取行动。例如，伪装成 `CFO`\
  \ 的犯罪分子可能会针对财务部门的一名普通员工，要求其将公司资金转入某个账户。\n\n社交工程是攻击者对天真员工最有效的武器之一。根据 Verizon 的 `DBIR`，4%\
  \ 的人会点击任何特定的钓鱼邮件。可能最令人惊讶的是，这些受害者并不倾向于从错误中学习。某人点击的钓鱼邮件越多，他再次点击的可能性就越大。\n\n社交工程在组织的多个层面都非常有效。是的，即使是针对高管也是。2018\
  \ 年，《福布斯》（`Forbes`）报道，美国、英国和欧洲的近 80,000 家公司向发起高度针对性的、为期五年的大鲸钓鱼行动的攻击者发送了超过 120 亿美元。是哪些员工被骗协助攻击者掠夺了自己的公司？是公司自己的\
  \ `CFO`。事实证明，攻击者拥有一个包含 50,000 多名 `CFO` 的目标数据库，用作诈骗中的“猎物”。在这种情况下，网络犯罪分子使用高度个性化的电子邮件（看似由\
  \ `CEO` 发出），迫使 `CFO` 立即完成电汇。我们所有人都可以从这个昂贵的教训中学习。我们中的任何人都可能被骗。\n\n因此，给员工的第一条 W.I.S.D.O.M.\
  \ 建议是`不要掉入钓鱼陷阱`。寻找恶意邮件的明显迹象，例如发送者的电子邮件地址。不要点击未知来源的链接。相反，请搜索公司或直接访问域名。但要留心。钓鱼网站（Pharming\
  \ sites）也很流行，网络犯罪分子建立恶意网站来诱骗受害者，然后收割财物，无论是财务或其他个人身份信息。即使直接输入域名，你仍可能进入具有恶意意图和/或内容的网站。\n\
  \n除了不要掉入钓鱼陷阱，还要`主动并立即向你的 IT 或安全团队报告`。根据 Verizon 的报告，从有人点击钓鱼邮件的第一个饵开始，公司只有 16 分钟时间。安全团队何时能收到第一份报告？在\
  \ 28 分钟后。在这短短的 12 分钟里，时间站在攻击者一边，在他们手中，时间变成了另一种武器，他们可以通过这种武器造成巨大的伤害。\n\n正如我在章节开头的自白所示的那样，社交工程不需要高科技就能奏效。电话诈骗以及对疏忽无人看管笔记本电脑、USB\
  \ 盘和移动设备的传统盗窃也能达到目的。\n\n但是，虽然老办法可能有效，但要清楚攻击者正通过技术变得越来越聪明、越来越高效，使社交工程变得更加有效。人工智能（`AI`），这种在许多方面让我们的生活更便利的技术（例如，我们喜欢的搜索引擎在我们输入完之前就补全了词或短语），是攻击者和防御者武器库中最新的武器。`AI`\
  \ 承诺让攻击者在执行钓鱼活动时具有更高的精度。他们可以更准确地针对毫无防备的受害者。他们还可以利用 `AI` 大批量创建非常有个性化的信息。\n\n这种新型社交工程结合了鱼叉式钓鱼的针对性有效性和传统钓鱼的规模。换句话说，未来的钓鱼将更难识别。网络世界日益像是一场变装舞，充满了互联网所承诺的魔力和魅力。但这场聚会每小时都变得拥挤，充满了伪装日益巧妙的钓鱼威胁。随着时间的推移，你对这种威胁的警惕性也必须增加。\n\
  \n\n\n\n最后，在网络安全防御方面，良好的卫生习惯是不可替代的。有时，最有效的措施也是最容易采取的。可能没有比医疗保健行业的案例更能说明这一点了。19 世纪，匈牙利医生伊格纳斯·塞梅尔维维斯（Ignaz\
  \ Semmelweis）试图解开一个谜团。他想知道为什么产房里这么多女性在分娩后死于发热。特别是，他注意到，由全男医生照顾的病房死亡率远高于由全女助产士照顾的病房。在经历了大量实验后，包括改变女性分娩时的姿势，甚至要求牧师在祭奠最近去世的母亲时避开病房内的幸存者（以防这些牧师的存在实际上会让其他母亲受到惊吓，导致致命的发热！），塞梅尔维斯得出了答案。\n\
  \n事实证明，那些男医生会进行尸检，而女性助产士不会。在进行尸检后，同一位男医生可能又去接产，在此过程中将他解剖过的尸体颗粒传染给母亲。塞梅尔维斯坚持要求这些男医生用氯溶液（而非简单的肥皂和水）清洗双手和器械，以完全清除手上的任何尸体颗粒。他当时并不了解氯作为消毒剂的知识，但他知道这能非常有效地消除医生手和器械上与尸体残留相关的厌恶气味。尽管距离发现细菌还有几十年时间，但塞梅尔维斯的新方案仍然是明明的医疗手段。结果，男医生看护的病房中产产热死亡率下降了。我们幸运的是，他的意外发现为医学死亡率的降低铺平了道路。\n\
  \n即使在今天，洗手仍然是公共卫生领域最强大的工具之一——从预防手术感染到避免流感。这确实需要纪律。但对于去洗手间的人来说只需要几秒钟，对于手术专业人员来说只需要几分钟，就能有效防止我们环境中各种细菌和病毒敌人的侵害。\n\
  \n效仿医疗专业人员的做法，员工可以采取常识性的卫生措施保护公司免受各种敌对威胁。你是否曾允许网站自动保存密码，或使用你的移动设备或笔记本电脑来存储密码？不要这样做。在我能提供的一个案例中，一名员工使用移动设备存储她的所有密码，包括她的\
  \ `O365` 邮箱账户密码。网络犯罪分子入侵了她的移动设备并盗走了 `O365` 凭据。这些被破解的凭据被用于访问她的 `O365` 账户，黑客发送伪装成该员工合法邮件的钓鱼邮件给她在\
  \ `O365` 通讯列表中的高管和其他员工。凭据盗取对组织来说特别难以检测。毕竟，从任何角度看，对该员工 `O365` 账户的访问看起来都是合。直到勤奋的员工（攻击者邮件活动的接收者）发出警报，威胁才被发现并遏制。\n\
  \n我理解密码管理很困难。我们的大脑构造并不是为了记住各种设备、网站和应用程序的数百个密码。糟糕的是，良好的网络安全卫生要求你定期更改这些密码，这使得记住所有密码变得更加困难。\n\
  \n市场上存在诸如密码管理器之类的工具可以帮助你生成和检索复杂密码。如果某个工具不可取，你就需要使用助记技巧来帮助记忆。例如寻找一个好记的短语（`Jack and\
  \ Jill went up the hill to fetch a pail of water`）、使用每个单词的首字母（`JaJwuthtfapow`）、使用大小写字母和符号的组合（`\
  \ J@Jwuthtf@pow`）以及为了稳妥添加一个数字（` J@Jwuth2f@pow`）。根据网站 `HowSecureIsMyPassword.net`，我刚刚创建的密码计算机大约需要*三百万年*才能破解。\n\
  \n密码管理是良好网络安全卫生的核心。遗憾的是，它的执行远未达到理想水平。直到最近 2018 年，某州使用 `Password123` 作为密码的政府官员就有近\
  \ 1500 人。这简直让黑客的工作变得更容易了！\n\n其次，要像关注在线安全一样关注物理安全。正如我在上一章中提到的，物理安全和网络安全的世界正日益趋同。网络犯罪分子在攻击中不仅针对物理基础设施（包括电网和制造设施），被攻破的员工设备也是网络犯罪分子进入公司系统的通道。\n\
  \n历史上最著名的国家级攻击之一 `Stuxnet` 是通过一个被破坏的 USB 设备发生的。一个 USB 设备让美国政府通过获得伊朗核离心机的访问权限，延迟了伊朗的核化。正如我一直所说的，网络攻击并不一定依赖下一代技术就能发挥作用。\n\
  \n所以你不是那种在核设施工作的人？很有可能你至少有一台用于工作的电脑。如果你和美国 25% 的员工一样，你会在每天下班回家时让那台电脑保持开启且未锁定。这等同于用完洗手间后不洗手！\n\
  \n最后，也是重要的一点，在访问或传输敏感数据时随时使用公司的虚拟专用网络（`VPN`）。公共 `WiFi` 网络是心机勃勃犯罪的聚集地。这一领域的网络安全卫生非常薄弱——即使在网络安全专业人士中也是如此！在业内最大的活动\
  \ `RSA` 上（每年吸引超过 40,000 名网络安全专业人士），自称黑客的 `@Grifter801` 推文说他在开幕后约 26 小时内就收集了超过 33,500\
  \ 个非加密密码。\n\n\n\n\n2. ^(2) Gartner 新闻稿，“Gartner 预计 2019 年全球信息安全支出将超过 1240 亿美元”，2018\
  \ 年 8 月 15 日，[`www.gartner.com/en/newsroom/press-releases/2018-08-15-gartner-forecasts-worldwide-information-security-spending-to-exceed-124-billion-in-2019`](https://www.gartner.com/en/newsroom/press-releases/2018-08-15-gartner-forecasts-worldwide-information-security-spending-to-exceed-124-billion-in-2019)。\n\
  \n3. ^(3) 安永全球信息安全调查报告，2018–2019 年，[`www .ey.com/Publication/vwLUAssets/ey-global-information-security-survey-2018-19/$FILE/ey-global-information-security-survey-2018-19.pdf`](https://www.ey.com/Publication/vwLUAssets/ey-global-information-security-survey-2018-19/$FILE/ey-global-information-security-survey-2018-19.pdf)。\n\
