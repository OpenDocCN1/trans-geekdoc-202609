  \n\n\n通用汽车（GM）继承了亨利·福特的经营哲学。工厂高度部门化，分工合作是标准配置，而效率才是王道。如果我们必须用一句保险杠上的标语来总结通用汽车的文化，那可能就是简单的“永不停线”。事实上，这四个字是曾经的通用汽车工厂的铁律。无论发生什么，组配线绝不能停止。\n\
  \n这是一个有趣的指令，因为在某些早晨，上班人数之少以至于生产线甚至无法启动。在那些日子，通用汽车会从街上招募人员来填补空白。而当生产线终于启动后，它就没有停止过。\n\
  \n比利·哈格特蒂（Billy Haggerty）在引擎盖和挡板组配部门工作。里克·马里德（Rick Madrid）为工厂制造雪佛卡。他们与李博（Bruce Lee）一起接受了美国公共广播电（NPR）的采访，让我们一窥了这条黄金法则在旧通用汽车弗里特工厂执行得有多么严格。\n\
  \n*   哈格特蒂：*线永远不能停，绝不要让线停。*\n*   马里德：*你根本看不到线停下来。我曾看到一个人掉进坑里，但他们没有停线。*\n*   李：*如果你发现问题，你就停线，否则你就会被开除。*\n\
  \n工人们会在事后才处理缺陷。对于通用汽车来说，数量远于质量。\n\n丰田将其哲学建立在持续改进的基础上。员工不仅被允许停线，丰田还鼓励他们这样做。“安灯绳”（andon\
  \ cord）位于生产线上每位工人的头顶上方触手可及之处。（安灯源自日语中的“纸灯”一词。因此，工人可以通过视觉信号指示生产线上的情况是否正常——绿灯；生产质量是否面临风险——黄灯；或者质量下降是否意味着必须停线——红灯。）\n\
  \n丰田不仅仅是在制造汽车；他们是在建立一种流程——一种欢迎公司任何层级好主意的流程。一种无情地追求并消除每一个低效环节的流程。一种坚持将标准不断推高的流程。\n\
  \n这种“停线”哲学赋予了每位员工成为某种工厂经理的权力，并使质量成为每个人工作责任的内在部分。丰田将日本哲学引入了美国汽车工人。当白宫汽车任务小组在几十年后的\
  \ 2009 年通用汽车处于 `Chapter 11` 破产期间对其进行评估时，他们承认通用汽车基于丰田模式的全球生产和采购系统是世界级的，并且与它的日本老师一样高效。由于丰田是丰田进军弗里特的领导者，通用汽车的这些指导很大程度上归功于那位已故的远见家。\n\
  \n但丰田的影响远超通用汽车，甚至超出了整个汽车行业。在 20 世纪 80 年代弗里特工厂成功的同一时期，全面质量管理（TQM）运动在多个行业中兴起——持续改进成为管理的新面貌，而质量则是被追求的奖赏。\n\
  \nTQM 最终让位给了 `ISO 9000`、`Six Sigma` 和精益生产等其他运动。虽然标准和名称可能发生了变化，但指导原则没有改变。质量不再是“可有可无”的；它是公司长期成功的关键。\n\
  \n作为一项事业，安全的地位与我们所有人陷入 TQM 热之前质量所处的位置是相似的。在设计产品和流程时，我们倾向于将安全视为明天的问题。这是我们在产品离开生产线后才会去处理的事情。我们会在事后修复它。在许多方面，安全是售后的一种事后考虑。如果我们想将安全嵌入到我们交付的每一个产品中，这种思维必须改变。\n\
  \n否则，结果可能是灾难性的。\n\n## 恐怖网络\n\n那是 2016 年。你可能没有意识到，但在那年的 10 月 21 日发生了一场战争。它只持续了一天，但它将在网络安全史上留下臭名。因为正那时，互联网的堡垒被试图在大规模范围内制造混乱的入侵者攻破了。那是互联网遭受前所未有破坏的一天。\n\
  \n2016 年 10 月 21 日的事件证明了事实比虚构更荒诞。那一天不寻常的并非黑客发动了攻击，而是他们刻意瞄准某家公司以造成损害。这种新闻在我们的数字世界已变得司空见惯。这次攻击的独特之处在于处于准准星之下的公司：`Dyn`。\n\
  \n虽然 2016 年你可能没听说过 `Dyn`，但你无疑使用了他们提供的服务：`Twitter`、`Netflix`、`Spotify` 和 `Etsy` 等。在其他方面，`Dyn`\
  \ 是一个域名系统（`DNS`）提供商。当你输入网站地址时，`Dyn` 将其映射到相应的 `IP` 位置。\n\n在那个宿命的一天，黑客通过分布式拒绝服务（`DDoS`）攻击瘫痪了\
  \ `Dyn`。`DDoS` 攻击是黑客的挥常之痛。当黑客向网站注入过量流量时，就会将其瘫痪。我们的互联网由多个路由和目的地组成，类似于复杂的高速公路系统。当敌人攻击网站时，他们可以发动\
  \ `DDoS` 攻击，使其拥堵到故障。\n\n\n\n\n这就是另一个进入词汇表的网络安全术语——**僵尸网络（botnet）**大显身场。通俗来说，僵尸网络是由被黑客奴役的设备网络组成的。由此产生的僵尸大军受一个或多个恶意行为者的命令和控制，这些者征用这些机器人来执行各种操作，包括通过向网站发送大量请求来发起分布式拒绝服务（DDoS）攻击。这些僵尸网络是如何受到它们邪恶主主的控制的？这是通过用户访问受感染网站或下载受污染信息时，在计算机上植入恶意实现的。在很多情况下，用户甚至不知道自己的设备已被夺取。\n\
  \n你可能会奇怪，针对 `Dyn` 的 DDoS 攻击究竟有何不同。其所使用的僵尸网络并不是计算机军，甚至不是移动设备（正如你所预期的，这些通常是黑客僵尸军团的普通士兵）。相反，网络犯罪分子入侵了普通的联网家用设备。婴儿监视器、安全摄像头和数字视频录机（`DVR`）都是击垮\
  \ `Dyn` 的僵尸网络中的成员。黑客利用这些联网设备中薄弱的出厂默认密码来获取控制权。用户无需先在无意中下载恶意软件。在这种情况下，消费者并没有做任何事情损害自己的设备。事实证明，“没有”正符合现状，因为用户也没有想过更改设备的默认密码，认为普通用户本就应该知道这样做。\n\
  \n在 `Dyn` 网络崩溃的瞬间，物联网（`IoT`）变成了恐怖主义互联网。而且，免得你认为 `Dyn` 攻击只是偶然，请思考另一个可怕的现实：禁用 `Dyn`\
  \ 的僵尸网络在事件发生几个几个月*后*，仍在积极为它的下一次攻击招募成员。在一个始终在线的世界里，黑客有数以亿计的联网设备任其摆布，只需等待来自新领袖的下一个指令。\n\
  \n`Dyn` 攻击让我们大开眼界看到了一个新的现实：*目标已经变成了武器。* 我们过去要保护的东西，现在必须防范它们。正如数据可以被操纵来欺骗我们一样，那些在家里和工作中许多方面让我们生活便利的无害联网设备也可以用来对付我们，破坏我们（以及它们）所依赖的数字基础设施。网络威胁现在是如此无处不在，它们潜伏在每一个联网设备、每一比特我们所认为理所当然的数据中。\n\
  \n`Dyn` 攻击证明，创新的黑客可以在下一次攻击中利用任何联网产品或服务。当网络犯罪分子通过普通的家用电器溜入时，网络安全才进入了产品开发的主流。\n\n\
  以联网汽车为例。2017 年，`Toyota`、`Intel` 等其他公司组成了汽车边缘计算财团。该小组估计，到 2025 年，车辆与云端之间的数据量将达到每月\
  \ 10 艾字节（exabytes），比 2017 年的基准增长了 10,000 倍。这相当于自人类起源以来人类说过的所有单词量的*两倍*。(4)\n\n将 `IoT`\
  \ 武器化攻击互联网是一回事，而将预计到 2025 年在道路上的八百万辆自动汽车^(5)武器化，会让恐怖主义变得更加可怕。这些联网车辆将依赖车辆与云端之间流动的准确实时数据。\n\
  \n## 产品开发者的 W.I.S.D.O.M.\n\n产品开发者是将网络安全嵌入到产品中的第一道防线。没有必要在健康的产品开发原则和检查清单上重复轮子（市场上的并不缺少这些清单）。\n\
  \n首先，在设计的初始阶段，客户输入是至关重要的。许多公司通过定量研究、一对一访谈、客户顾问委员会和/或其他方法主动向客户征求此类反馈。确保网络安全不是事后补救的一种简单而深刻的方法，是在这一阶段询问客户关于他们的网络安全需求。\n\
  \n假设你正在从事制造 `fill-in-the-blank`（填空型）联网设备的业务（例如用于僵尸大军击垮 `Dyn` 的那种设备）。发现消费者何时更有可能采取行动更改出厂默认密码，是设计阶段的一个重要元素。更好的办法是在此阶段通过消除消费者的拖延行为（例如在安装联网设备时通过直观的应用程序要求更改密码），从而从出厂就消除一个关键的安全漏洞。\n\
  \n\n\n\n既然谈到了软件开发人员，这里还有另一个建议供你参考。请确保安全是任何最小可行产品（MVP）的一部分。当《精益创业》的作者埃里克·里斯（Eric\
  \ Ries）推广 MVP 时，他捕捉到了任何初创公司努力目标的核心：发布一个新产品，使开发团队能够以最少的努力收集关于客户使用和接受程度的最大信息。这一过程非常适用于云端应用，因为这类应用的前期资金需求很小（因为许多应用利用了\
  \ `AWS`、`Azure` 和 `Google` 提供的公共云基础设施）。从本质上说，它允许产品开发中的快速学习、快速迭代以及与客户的持续反馈循环。这些都是好事——特别是如果它能让一家初创公司（或任何公司）避免发布一款在市场上毫无沉沉的软件产品的昂贵错误。\n\
  \n## 安全：最小可行性产品的核心部分\n\n事实是这样的：不要过度关注别名中的“最小（minimum）”一词，而忽略了紧随其后的词——“可行（viable）”。**安全性必须内置，而不是事后补上**，无论是针对早期采用者的产品，还是面向大众市场的产品。安全性*必须*是你的最小可行产品需求的一部分。\n\
  \n其次，在设计产品时，要审慎考虑你的公司将如何、在何处以及使用多久客户数据。某些法规会迫使你的公司关注这些事情（假设你们需要额外的动力）。因此，我在这里讨论的不是监管机构发布的强制性要求。相反，我指的是你的公司自我负责的伦理标准。明确的是，在这两个标准——法律要求或你公司的伦理原则——中，较高的那个就是这项测试的底线。\n\
  \n例如，在第一章中，我讨论了黑客对热门社交媒体平台上的 McAfee 公司页面进行的篡改。虽然我们的事件中没有涉及客户数据，但它能帮助我描绘出我在此点上的意图。由于没有数据被盗取，也没有\
  \ McAfee 的系统被入侵，McAfee 完全没有法律义务报告这次黑客攻击，更不用说通知媒体了。\n\n但 McAfee 对自己的要求的标准比法律要求更高。在这种情况下，当黑客将我们的\
  \ Logo 换成一张图像时，我们员工的社交媒体页面以及 McAfee 的公司简介页也遭到了篡改。这张图像在任何个人资料中列出 McAfee 的员工的个人页面上显示了几个小时。McAfee\
  \ 有一个我们与员工共同维护的价值观：*我们实践包容性的坦诚与透明。*虽然法律限制并不要求我们进行任何报告，但我们自己的公司价值观要求更多。\n\n因此，在攻击发生后的第二天，我们在内网首页发布了一篇头条故事，向所有员工承认了此事。我们知道风险在于，一个没有收到任何真实媒体关注的故事（因为攻击发生在原本安静的复活节周日），如果有*一个*员工将其发送给媒体，可能会在周一早晨引发关注。坦率地说，这并没有发生。最终，如果我们想要维护超出法律要求的公司价值观，这就是我们必须承担的一种风险。\n\
  \n## 定义数据和安全需求\n\n**在任何新产品或服务的设计中，清晰且有意识地定义你的数据需求**——坚持法律要求或伦理标准中较高的那一个。我再给你一个例子来进一步说明这一点。到目前为止，少数对报告勒索软件攻击发布明确指导的美国监管机构之一是卫生与人类服务部（这种监管指导的出现是向前的一步，特别是考虑到医疗保健是勒索软件的频繁目标；但考虑到其特殊性，它也代表了为什么勒索软件可能比实际报告的行业数据所显示的要糟糕得多）。如果你的公司对客户有类似的透明度价值观，并且需要披露勒索软件攻击，那么你对于存储客户数据时想要承担多少风险可能会有不同的观点，即使法律在这方面可能更加宽松（也就是说，直到美国和其他国家采取\
  \ `EU` 的做法并重新审查与客户隐私相关的指导意见）。\n\n## 安全所有权\n\n**其次，将安全所有权纳入产品生命周期的每个阶段。** 你的产品或服务将如何升级以应对下一个威胁向量？哪个部门负责持续维护和补丁？发生漏洞后谁负责处理？预算设在何处？你明白意思了。要明确公司内部的职责划分（swim\
  \ lanes），以及何时何地必须做出安全决策并分配资源。\n\n与维护产品所需的精力相比，引入产品所需的精力可能很简单。只有在第一批客户采用你的作品之后，不可避免的支持、扩展性以及——是的——安全问题才会显现。到那时，你成功发布时的兴奋喜悦将成为遥远的回忆。在你的产品到达第一位客户之前，提前为这些确定性事项建立明确的所有权，将节省并在并在降低风险。\n\
  \n这与你在思考产品生命周期其他问题时可能实践的纪律没有区别。除了签署支持和扩展性问题已在计划之内之外，公司每个部门最高职能负责人（如客户支持、工程或营销部门）还应该明确审查并批准其职能的安全需求在产品进入市场之前是否已充分内置到产品中。\n\
  \n## 停下生产线\n\n最后，但同样重要的是，如果产品发布过程的任何部分缺乏或缺失安全性，你必须**停线（stop the line）**。更重要的是，你应该积极鼓励直接或间接参与开发过程的*任何*员工遵循这种停线哲学。这在执行上绝非易，因为在商业中时间就是金钱。但对于那些所有员工都没有集中在一个物理位置的公司来说，这更加困难（例如位于弗利明特的\
  \ `Toyota` 工厂，其环境中有实物线索，包括通用的红色、黄色或绿色，这些颜色能立即且明确地向所有工厂员工传达当前的质量状态）。同样，许多公司并没有让员工可以激活以立即停线的拉绳或按钮。例如，对于软件而言，并没有物理生产线。\n\
  \n\n\n\n员工会察觉到公司的奖励与认可。这是文化中极具可见性的部分，它清晰地传达了高层领导认为什么重要（以及什么不重要）。当一名员工停止生产线时，请找办法奖励她。然后，通过公司利用最充分的任何通信媒介对她进行公开认可（这正是你的人力资源和营销同事可以为你提供帮助的地方）。关键在于，你要让员工知道，公司对安全的重视程度不亚质量。当他们亲眼看到你如何通过改变奖励认可体系来承认这一点时，你会发现有更多勤奋的员工在安全出现问题时站出来。这保护了你的公司免受未来潜在的财务、声誉或知识产权损失。\n\
  \n***\n\n从过去对待产品质量那种漫不经心、随意的想法，公司们已经走了很远的路。受过教育的买家在做出可能让自己后悔的决定之前，可以轻松检查公司的质量记录。如今，公司深知质量体验的价值。他们通过客户满意度、净推荐值（NPS）和留存率来衡量它。他们在客户奖项中竞争这种体验，并在财务业绩中看到它的价值。\n\
  \n网络安全是我们这一代的质量。就像之前的质量一样，它被低估、不被赏或仅仅没有被衡量。我一个好朋友经常说：“骨子里的东西终会显现在肉体上。” 一个骨子里拥有强大网络安全意识的公司，将从更低的风险、更少的财务损失、更多的客户信任，以及是的，得益于在设计和构建产品时就兼顾了网络安全与质量，从而获得更高的质量。作为未来产品的梦想者和设计师，开发者在将网络安全嵌入我们消费的一切事物中发挥着至关重要的作用。\n\
