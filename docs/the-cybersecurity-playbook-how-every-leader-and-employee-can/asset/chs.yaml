  \n\n13. 作者简介\n\n\n\n\n\n# 第一章：我毁掉复活节的经历\n\n那是 2017 年 4 月 16 日，复活节。我刚和丈夫做完家常，现在是时候放松一下了。手机亮了，我低头看向屏幕。那是来自首席人力资源官（CHRO）Chatelle\
  \ 的一条短信。Chatelle 和我关系很近，我们刚刚从英特尔剥离出来，成为最大的独立网络安全公司之一。\n\n* *你需要去看看我们的社交媒体页面。情况很不妙。*\n\
  \n当我打开 McAfee 的页面时，我立刻感到血压飙升。我惊坏了。有人刻意破坏了我们这家成立仅 12 天的新公司的社交简介，并使用了极具侮辱性的语言，针对几乎各行各业的人。\n\
  \n## 冲突\n\n这些侮辱性的称呼与我们公司代表的一切理念形成了鲜明对比。我们刚刚用新的口号“团结就是力量”重新发布了品牌，这反映了我们的信念：需要*各种类型*的人共同保护我们的世界免受网络威胁的侵害。在公司成立之际，我们刚刚向所有员工发布了新的价值观，其中之一就是推崇*包容性的*坦诚与透明。而且，我们还是*网络安全*领域的领导者。\n\
  \n如果我们连自己在最大的社交媒体平台之一上的公司简介都无法保护，客户对我们保护他们最宝贵数字资产的能力会有何看法？更糟糕的是，我的团队——营销部门——负责管理我们在所有社交渠道上的公司简介，包括这个正对着我脸被毁掉的页面。\n\
  \n我立刻行动起来。我必须找到数字团队的负责人，弄清楚发生了什么。我立刻联系了她，甚至不需要解释电话不是为了祝她复活节快乐。\n\n“我知道你为什么打电话。我们正在处理。我们的账户被黑了。我们正在与`社交媒体平台公司`沟通以解决这个问题。”\n\
  \n我开始往最坏处想。社交简介被黑是一回事，如果这是一场针对 McAfee 的协同攻击，背后有更大的目标呢？黑客正通过这场“火警演习”转移我们的注意力，同时悄悄渗透我们公司的系统。\n\
  \n\n\n\n她立即向我保证，我们的首席信息安全官（CISO）已经在处理此事，并确认我们的系统运行良好。一阵宽意瞬间涌上心头——直到我意识到需要再打一个电话。我们的\
  \ CEO 需要知道发生了什么。而我希望他从我口听到这个消息。我正准备毁掉他的复活节周日。他几乎立刻接起了电话：\n\n*   “克里斯，我们的一个社交媒体账号被黑客了。”\n\
  *   他的反应很克制。“严重什么程度？”\n*   “我们的公司服务器没问题，克里斯。被黑掉的是我们在社交媒体网站上的公司页面。”\n\n我向他详细说明了发生了什么。我们的社交媒体经理加文（Gavin）是第一个发现攻击的人。加文当时在家里，正做着自己的事——在下午\
  \ 5 点左右，他在社交媒体平台上看到了一了一条状态更新，上面有一堆随机乱码。他认为有人误触了更新功能。随后，他联系了他的团队，查看是谁不小心创建了该帖子。加文登录社交媒体平台，并删除了该帖子。\n\
  \n随后，另一个毫无意义的帖子出现了。没有任何人知道这是怎么回事。加文登录社交媒体平台并进入账号设置。所有拥有账号管理员权限的人都是熟悉的。尽管如此，为了安全起见，加文开始删除所有其他管理员。\n\
  \n当他执行这些操作时，页面刷新了，他被锁在了账户之外。\n\n现在毫无疑问这是恶意的。一瞬间，加文意识到删除帖子的行为让黑客察觉到了。这就像典型的科技惊悚：手指在键盘上飞速跳动，屏幕上不断闪烁。即使没有音乐，紧张气氛也到了顶点。加文说，黑客正在尝试做同样的事情。\n\
  \n我正向执行团队通报这一事件时，继续毁掉其他人的复活节周日。\n\n在挂掉 CEO 的电话之前，我还有一个令人失望的消息要分享：\n\n*   “噢，克里斯，当你访问我们的个人页面时，不仅会看到那些攻击性帖子，我们的公司\
  \ Logo 也替换成了一个看起来像鸟的图片。仔细看，那完全不是鸟。”\n\n包括我的在！\n\n在社交社区中，这种事情很常见，黑客用淫秽图片来破坏网站，指示某人被“pwned”（俚语，意为被击败/攻破）。现在黑客知道我们被锁在账户之外，在此期间，他添加了一张淫秽图片替换了我们的公司\
  \ Logo。为了保险起见，我们的执行团队疯狂地与社交媒体平台协作解决这个问题。但是……事情进展得并不快。而且由于现在是傍晚了，我们只能与亚太地区（APAC）团队协作。进展缓慢如蜗牛。\n\
  \n我们等待了仿佛永恒那么久。因为并不是服务器被黑，我们只能每隔几分钟向支持团队查询一次，得到的回复是他们“正在处理”。\n\n大约 30 分钟后，我们收到消息，社交媒体平台已经锁定了公司页面的*所有*管理员，只有他们拥有访问权限。这是好消息——至少不会造成更多损害。\n\
  \n坏消息是？他们没有办法将页面恢复到 30 分钟前的状态。他们的流程是先锁定页面以便无法进行任何进一步更改，然后进行验证程序：为了验证，他们想要确保我们就是我们所称的身份，而不是冒充\
  \ McAfee 的黑客（真讽刺！）。接着分析阶段，他们想在采取进一步行动之前研究攻击的范围。\n\n但那张淫秽图片呢？它仍然显示在我们的公司页面上。\n\n\
  在接下来的一次更新中，支持团队说他们还没有完成“程序”。他们说恢复页面的唯一方法是重新激活账号——解锁它——但在完成安全审查之前他们不会这样做。\n\n真的吗？这到底是怎么发生的？在他们完成审查之前，我们的公司页面我们*什么*也做不了。我们完全听命于他们。员工们能做的就是在自己的个人页面上删除任何关于\
  \ McAfee 的提及，知晓此事件的人也都这样做了。\n\n但这不够。当我向执行团队通报这一事件时，我继续毁掉大家的周日。我们确保了公司的服务器是安全的，但这并不意味着\
  \ McAfee 没有通过其他渠道受到攻击。我们完全不知道自己的执行团队成员以及他们的社交个人资料是否是下一个目标。\n\n我通过邮件和群信息发出警报，指示执行团队立即在所有社交网络网站上开启多重身份验证（关于多重身份验证，稍后介绍）。\n\
  \n我听从了自己的建议，尽可能在我的个人页面上开启了安全功能，直到我遇到了一个非常流行的社交平台。我不确定我的身体是处于完全的“战斗或逃跑”反应（身体血液流向主要肌肉以帮助逃避威胁或准备战斗——换句话说，*不是*前额叶皮层控制），还是该社交媒体平台在隐藏安全功能方面做得不好。可能两者兼有吧。无论如何，恐慌吞噬了我，我采取了绝望的措施：我完全删除了我在该平台上的个人资料以及所有的历史。\n\
  \n一个小时变成了两小时，接着是三小时，然后是四小时。我定期向 CEO 汇报必要的恼人的状态更新，关于我们日益丢脸的被破坏的公司页面。电话内容如下：\n\n*\
  \   “克里斯，我们仍在与其协作。他们还没有完成安全审查。我们希望在 30 分钟内解决。”\n\n清洗、冲洗、重复——每 30 分钟一次。\n\n就在在这些电话之一，我们的\
  \ CEO 施了妙计：\n\n*   “艾莉森，我认识公司里的一个人，我不想再等他们采取行动了。我去给他打电话。”\n*   “太棒了，克里斯。我们会向亚太团队施压。”\n\
  \n克里斯建立了联系并申诉了我们的诉求。在电话后的 30 分钟内，页面恢复了原始状态。我不知道克里斯的电话是否起到了作用，还是调查仅仅是走完了流程并结束了。我只知道局面现在被控制住了。\n\
  \n周一早上，我们在公司内网发布了一篇文章，让每位员工都知道周末发生了什么。记得我提到的 McAfee 价值观之一——实践包容性的坦诚与透明吗？我们有义务向员工解释发生了什么，特别是考虑到他们的社交媒体页面在那些紧张的几个小时内被破坏了。在处理不安的话题时，坦诚和透明是很困难的。但要真正践行价值观，这也是必要的。\n\
  \n\n我给你们讲这个故事不仅仅是因为它有趣，也不仅仅是为了让你觉得“嘿，有她比我好！”我从这个故事开始，是因为它是我们书中其余部分将要讨论的内容的缩影。\n\n\
  为了让你买这本书物有所值——在第一章中——我现在将详细解析黑客攻击是如何发生的，以及我们之后做了什么。最重要的是，我将列出你可以在*明天早上*在工作时采取的步骤，以确保这种事情不会发生在你身上。\n\
  \n## 惨痛换来的教训\n\n当我们夺回账户的控制权时，我们要求社交媒体公司告诉我们，仪表板中哪个管理员账户负责了这些更改。\n\n结果发现是我们一家媒体投放代理机构的一名员工，她已经不再为我们工作了——我们称她为\
  \ Julie。她的凭据被一个与大型网络犯罪团伙有关的青少年盗了。Julie 犯了许多人都会犯的错误：她没有养成良好的密码习惯。她使用同一个密码访问多个账户，包括她在该社交媒体平台上的个人资料。而且，由于她是该网站上\
  \ McAfee 公司页面的授权管理员，她的个人凭据不仅让她能够访问自己的个人资料，还能访问我们的页面。当她的一个账户被攻破且凭据在黑网上交易时，黑客只是简单地用该密码尝试了她的其他在线账户。这时，他们成功破解了\
  \ Julie 在该社交媒体平台上 McAfee 公司页面的管理员权限。剩下的操作就是易菜一掌了。\n\n事后诸葛亮明，这个案例也不例外。漏洞一：`Julie\
  \ 在访问其社交媒体账户（以及我们在同一社交媒体平台上的公司页面，作为我们之一的授权管理员）时，使用了与其他账户相同的密码`。如果她使用了唯一的密码，那么那些坏人在黑网上买到的凭据将变得一文不值。更糟糕的是？当收到个人账户被黑的告警时，Julie\
  \ 迅速更改了密码。但她未能在其其他账户（包括故事中的那个账户）上更改密码。这是她的责任。\n\n漏洞二：`我们本应该要求该社交媒体网站上的所有管理员使用多因素身份验证`。这意味着你获得系统访问权限不仅需要正确的密码，还必须能够输入生成并发送（例如发送到）你手机上的一次性代码。如果你在被要求后的几秒钟或几分钟内没有提供代码，你就无法进入。这种类型的身份验证有几个版本，我在这里做了简化处理，但你明白意思即可。这是我们的责任。\n\
  \n漏洞三：`我们没有足够频繁地审查来查看谁不再需要访问我们的账户`。Julie 一些时候曾帮过我们，但在她的活动结束后，我们本应该将她从管理员列表中移除。在她与我们积极合作期间，我们仍然可能被攻击，但我们对访问管理的缺乏让情况变得更糟。这绝对是我们的责任。\n\
  \n所有这些行动都会大大降低黑客发生的概率。但假设由于某种疯狂的原因，一个拥有足够动力、技能和运气的黑客进入了我们的社交媒体账户。让我们看看，如果我们事先采取了某些措施，在发现被黑后哪些做法可以帮到我们。\n\
  \n我们应该有一套`程序，在不泄露我们已察觉攻击的情况下锁定所有管理员`。通过删除那些无意义的帖子，我们提醒了黑客。然后当黑客看到我们正在删除权限时，他的行动比我们还要快。\n\
  \n幸运的是 Gavin 在复活节周日看到了被篡改的页面。否则，我们可能不会那么快发现篡改。现在我们拥有一种工具，利用机器学习来检测社交媒体网站上的异常图像、脏话、侮视性和其他异常材料。一旦检测到此类异常活动，它会*立即提醒*我们团队的几位成员。\n\
  \n*注：*我不会点出我们使用的工具，有两个原因：第一，工具更新换快，而且在不同时间的有效性往往也不同。换句话说，当一个工具刚发布时，它可能非常有效——直到黑客找到绕过它的办法。因为我不知道你什么时候读这本书，我不想赞美一个在你阅读这些文字时我可能不再使用的东西。\n\
  \n不提及该工具的第二个原因是，McA 已经是全球黑客的巨大目标了。通过让他们猜测我们具体使用哪些工具，我们有助于减轻这种威胁。如果你搜索我用来描述工具的某些词汇，你很快就能找到可以尝试的现有工具。\n\
  \n回到关于我们学到的教训的故事：\n\n在我们向社交媒体公司报告黑客攻击时，我们并不知道他们处理此类问题的流程。这是一个错误。我们直到那时发现他们的政策是冻结账户数小时，无论我们的页面被篡改成了什么程度。`我们现在会在其他网站创建公司页面之前提前询问这些流程`。\n\
  \n我们通过惨痛的经历学到了金钱是说话的。因为我们通过代理机构在该社交媒体网站上花费了大量的广告费，在公司看来，我们的账户比实际的小；这可能影响了响应水平。今天，`我们直接向社交媒体平台付费`，以准确反映我们的投资，并获得我们应有的相应服务水平。\n\
  \n而且，我们了解到`与我们开展业务的第三方公司可能没有强大的安全实践`。对于那些拥有你系统权限或作为你组织延伸的公司来说，记住这一点尤为重要。特别是与你有关系的较小的第三方公司，可能没有正式的\
  \ IT 和安全团队，更不用说遵循严格的网络安全卫生了。\n\n最后，对那个复活节不幸事件的事后分析给了我们最后一击。在这次攻击中，McAfee 甚至不是一个被刻意的目标。黑客在破解\
  \ Julie 的凭据时并没有意识到 Julie 是 McAfee 的管理员。他不知道（或不在乎）Julie 是谁。他只是在寻找密码。只有在他确定了密码解锁的是什么——无论是个人银行账户、公司网络还是其他什么——之后，才能获得回报。一旦他发现恰好可以解锁该社交网络上\
  \ McAfee 公司页面的密钥，他就在那里发泄他的愤怒和谩辱，得罪了每一个能得罪的人，并在过程中羞辱了我们。*即使对于黑客来说，有时运气比能力更好。*\n\n\
  ## 给你们的额外教训\n\n**准备好你可以拨打的以及可以向上汇报的人员名单**。让你和团队可以随时访问这些列表。此外，列表不仅必须包含你团队的人员，还必须包括你的网站、社交媒体、云存储等供应商的人员。\n\
  \n**在某人的工作描述中，必须包含定期审查谁拥有账户的访问权限**，并清理列表以移除不再负责这些项目的人。\n\n**使用多因素身份验证**。对于某些系统，我们可以自动检测我们的某个用户是否开启了该功能，如果用户关闭了它（例如切换到新电脑时的几分钟），系统会告诉我们。对于我们较少有直接控制的系统（例如云服务），我们要求用户发送开启多因素身份验证的截图。\n\
  \n你可以想象，现在我们在建立页面之前，会对社交媒体平台进行审查。除了我上面提到的措施之外，我们还会问：\n\n* 你们如何处理任何个人身份信息？\n\n\n\n\
  \n*   你们正在使用什么技术？（我们将获取这些答案并进行漏洞评估。）\n*   你们的访问管理系统是如何工作的？\n*   哪些第三方工具允许连接到你们平台，以实现攻击后任何必要的内容回滚？\n\
  *   如果账户被接管，你们的升级流程是怎样的？\n*   你们对于响应攻击以及让客户恢复到攻击前内容的服务水平协议（SLA）是什么？\n\n## 谁的错？\n\
  \n当然，社交媒体提供商可以辩称，我们没有做到一些显而易见的事情，比如通过经常审查将管理员人数减至最低、坚持使用独特且强密码等等。但他们那种僵化的政策也没有任何帮助，即使网站遭受了显而见且严重的攻击，也必须在“分析”完成之前保持原状。当然，该机构人员也不应该在多个账户上重复同一个密码。\n\
  \n但请注意，我将这一章命名为“*我*毁掉复活节的时候”。不，我没有黑入 McAfee 的公司社交页面。我没有故意留门大开让坏分子做同样的事情。在那个复活节周日，我最不希望面对的就是一个由多方面错误导致的喜剧性和巧合共同导致的局面。尽管如此，我只能对它的发生负责。因为归根结底，那个公司社交页面在我团队的监管之下。而我们未能采取合理措施来履行保护它的职责。\n\
  \n个人责任是一件令人不舒服的事情。我们中很少有人喜欢去思考为了防止不幸事件的发生，我们本可以做得更好或更不一样的地方。推卸是更具人性的反应。然而，正是我们推卸个人责任的倾向，仍然是黑客社区武器库中的一种关键武器。\n\
  \n长期以来，网络安全一直是“别人”的问题。对于太多人来说，网络安全是一个模糊的话题，不值得他们投入时间，更不用说个人责任了。这本书试图改变这种叙事，即使只是通过谦卑的一步，承认我们作为组织员工——以及最终的防御者——所共同承担责任。如果我们的公司不能信任我们在保护其最神圣的数字资产方面采取合理的预防措施，它还能信任谁呢？\n\
  \n让我放下我的讲道台来承认真正的问题。并不是员工（通常来说）不*想要*做正确的事。更多的情况是他们根本不知道*如何*去做。\n\n网络安全是一项团队运动，每个人都需要在比赛的每一分钟都履行好自己的职责。工具可以非常有帮助，但只有当人员、工具、程序、定期审查和其他因素共同作用时，它们才能形成有效的防御。\n\
  \n## 记住这个关键要素\n\n减少网络威胁的另一个关键要素是诚实。在写一本印有我名字的书的开头，描述一个在我监管下发生的、令人尴尬的安全失败，我确实超出了我的舒适区。情况本可能变得糟糕得多吗？肯定的。它本不应该发生吗？肯定的。\n\
  \n而且，那可能是你而不是我吗？同样，肯定的。\n\n通过告诉你们这个故事，我想确立一种诚实的基调，这种基调在你们努力击败坏人的业务活动中也是需要的：你们需要培养一种安全文化，让人们不仅能够互相帮助，而且在看到不安全操作时彼此保持诚实。这是没有愤怒、指责或报复的诚实，它对于让文化运作至关重要。\n\
  \n描述我们社交媒体攻击的第二个原因是，以便你可以吸这些教训，并立即将其应用到你发现自己安全盔甲存在漏洞的地方。\n\n## 为什么是我？\n\n市面上并不缺由声誉良好、有才华且拥有丰富经验的作者编写的网络安全书籍供你阅读。你会发现一些是由记者撰写的，他们剖析了历史上一些最传奇的泄露事件。你会发现另一些是由业内精英撰写的，他们作为行业受尊敬的先驱，以权威的口吻发言。你还会发现更多由技术专家编写的书，他们详细地解读了网络安全复杂的元素。\n\
  \n但是，当我输入这些文字时，你找不到许多由营销人员撰写的网络安全书籍。而在行业中只有几年经验的营销人员编写的可能更少。那么，为什么要信任这位作者处理如此严肃的话题呢？\n\
  \n将我看作营销与技术的混合体吧。我的职业生涯一直在将技术概念翻译成日常语言。我研究了工作与技术的交汇点，以理解企业文化是如何变化的。\n\n## 为什么是你？（注：提供的文本重复了“为什么是我？”并过渡到“为什么是你？”）\n\
  \n……我记得小学年级最早记忆记忆，坐在家的沙发上，在爸爸身边，看他最喜欢的球队——达拉斯牛仔队。\n\n（等等，提供的文本在某些部分存在重复/重叠。我将根据提示中提供的逻辑流重新格式化。）\n\
