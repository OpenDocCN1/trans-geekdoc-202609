  \n# 第 5 章：当过好的东西也会变成坏事\n\n\n\n\n\n在加入网络安全领域之前，我的职业生涯绝大部分时间都在电信行业度过。我曾是 20 世纪 90\
  \ 年代末互联网热潮中的一员。我记得，那时我认识的几乎每个人都忙着创立或加入下一家互联网初创公司。似乎每个人都注定会成功。我记得，我们这些幸运在当时在该行业工作的人曾自豪于自己是现代“淘金热”的一员。我当时正确的时间出现在了正确的地方。向我奔而来的录取机会多到我应接不暇。生活曾是美好的。\n\
  \n直到这种美好终结。世纪交之际的互联网泡沫破灭击了梦想和职业。失业率在一夜之间飙升。对于我的许多朋友来说，这种挣扎是非常真实的，他们用那些连纸张都不如值的股票，换取了价值更低廉的解雇通知（pink\
  \ slip）。\n\n动荡的电信行业经历了数年的时间和多轮裁员，才最终恢复了平衡。但这种平衡来得缓慢。世纪初那种几乎不存在的电信业失业率，现在提醒着我们这些经历过那段旅程并满身伤痕的人：过犹不及确实会导致非常糟糕的后果。\n\
  \n职业生涯快进近 15 年后，我进入了迈菲和网络安全行业。当然，我知道迈菲是做安全业务的。这与我的使命感相契合。我想利用每周投入职业生涯的 60 多小时时间来做一些有意义的事情。拯救生命似乎就是最好的选择了。\n\
  \n事实上，这种好到令我很快发现，我们招人的速度赶不上需求。行业内全球的人才短缺让我想起了那个过去时代几乎不存在的失业率。虽然网络安全岗位的候选人可能对永久性工作保障的想法感到欣喜，但现实是，这个行业零失业率带来的后果比我很久以前所经历的还要糟糕。\n\
  \n原因是现在涉及的利益要大得多。在过去，为当时的互联网热潮填补职位可能并不是关乎生死的问题。一些有进取的初创公司可能发现吸引和留住其最新业务的人才才更为困难，但让我们面对现实吧。真正关乎的是什么？\n\
  \n也许我们得再等几年，互联网的潜力才能追上它的炒作；我们今天所熟知并喜爱的应用经济才能成型。早期的杂货或宠物用品配送服务会经历几次失败。对我们幸运的是，当时有许多可行的途径来获取此类商品，即使我们还在等待触手可及的电子商务在几天内（如果不是小时内）为我们递送几乎任何东西。互联网热潮和随后的幻灭现在对我们大多数人来说仅仅是遥远的记忆。我们幸存了下来，并讲述了这个故事。\n\
  \n网络安全是不同的。关乎的不仅仅是网络带宽或酷炫的应用，要多得多。我们必须考虑国家安全。公司有知识产权、财务、声誉等需要保护的东西。与此同时，我们仍挣扎着为那些保护我们的人填补职位。\n\
  \n与电信行业不同，这种人才短缺不太可能通过某些行业的崩盘来解决。我们不太可能看到由于才华横溢的网络安全专业人员进入市场导致失业率飙升。因为我们的敌人不会坐之不管。对手们继续向他们的阵营中招募。只要坏分子不短缺，网络安全专业人才就不会过剩。\n\
  \n这就是我们这头猛兽的本质。网络安全供应商互相挖墙人才，因为为已经受过行业培训的人支付更多薪水，比尝试从几乎破产的候选人源中招募要容易。私营部门发现自己处于同样的人才旋转门中。而公共部门通常拥有最需要保护的东西（我们的国家安全！）却被迫在这个竞争激烈的劳动力市场上竞争，且薪酬限制最为严苛。\n\
  \n对网络安全专业人员的需求远超过其供应。这种缺口影响着我们每一个人。\n\n为了让情况更糟，网络安全专业人员的需求远大于其供。缺口。更糟糕的是，我们在人才池中缺乏多样性。女性和少数裔在其中的代表性严重匮乏。即使我们采取高比例，这一问题也超越了政治或意识形态。不幸的现实是，劳动力市场上没有足够的合格候选人，这需要我们全部的努力来解决。\n\
  \n## 过去并非如此\n\n人们很容易认为这个问题大到无法通过某些行业的崩盘来解决。与其把问题推给未来，不如在现在就投入工作来解决网络安全人才短缺。考虑到我们所面临的情况，这可以理解：\n\
  \n*   在未来几年，全球将有数百万网络安全职位空缺。\n*   根据来源不同，女性在网络安全行业中的占比仅为 11% 到 20%（1）。即使按高比例计算，这一比例远低于女性占一半的整体劳动力市场。\n\
  *   对于少数裔来说，情况更糟。他们在网络安全专业人员中仅占 5%（2），而整体就业人数中约为三分之一。\n\n也许问题无法解决？也许女性和少数裔根本不倾向于从事网络安全工作？或者他们根本不适合这项工作？网络安全行业注定缺乏多样性吗？\n\
  \n如果它的起源能预示命运的话。第一个软件程序员是一个女性。阿达·洛芙莱莱（Ada Lovelace）被广泛认为编写了第一个计算机程序——一种计算伯努利数列的算法，该算法还解释了飞机的机翼如何飞行。\n\
  \n在 20 世纪 40 年代开启的大机时代，又是女性在编写程序。男士更倾向于建造这些巨型计算机，将细致的代码工作留给了他们的女性同胞。\n\n第二次世界大战期间，女性占布莱切利公园破译行动（3）的\
  \ 75%，该行动帮助破解了德国人的恩尼格玛密码。\n\n战后，女性仍然是私营部门编码的基石。一位名叫格蕾丝·霍珀（Grace Hopper）的女性发明了第一个编译器，将人类易读的代码翻译成计算机可以理解的位和字节。\n\
  \n随着编程工作在 20 世纪 50 年代和 60 年代爆发，女性一直是劳动力市场的主力。这个领域是一个功绩制，基于天赋和成就。公司通常根据入学测试选择编程人员，这种测试通常涉及模式识别。女性和男性处于平等的竞争地位。\n\
  \n\n\n\n正如这堂历史课所揭示的，有时技术会损害一个领域的进展，以加速另一个领域的进步。具体来说，当第一批个人电脑在 1984 年进入家庭时，我们几乎无法想象几十年后它们产生的影响。一方面，个人计算让我们今天所处的数字时代成为可能；另一方面，它在无意中剥夺了女性和少数群体追求编程角色的机会，包括目前需求量极大的网络安全工作。\n\
  \n你要明白，当个人电脑进入市场时，由于其价格点更青睐富裕家庭（这在许多新技术都是如此），这种现实让少数裔家庭处于不利地位，因为他们的平均收入低于非少数裔群体。\n\
  \n在几年之后，大学开始涌入大量想要从事编程职业的申请者——在很大程度上归于个人计算的出现，这已成为一个火热且前景广阔的市场。供需关系的经济规律开始发挥作用。大学无法满足所有想要从事计算机科学职业的候选人（包括女性和少数裔）的需求。他们开始提高此类学位的门槛，特别是在至关重要的第一年，以筛选掉那些被认为缺乏所需技能天赋的候选人（通常是通过加速本该在候选人学习后期才会课程）。\n\
  \n这种快速通道的课程有利于那些拥有此前敲击键盘、学习计算机内部工作机制经验的人。换句话之，来自电脑家庭的候选人是——白人男性。\n\n但这些家庭中的白人女性又是怎样的？当女孩也能接触同样的技术时，为什么她对电脑的兴趣会比她哥哥小呢？\n\
  \n回想 20 世纪 80 年代中后期以及跃现在好莱坞大银幕上的青少年文化。你会记得一些流行文化经典，如《极客风暴》（Revenge of the Nerds*）、《疯狂科学》（Weird\
  \ Science*）和《电脑游戏》（WarGames*）。这些热门电影中涌出的主角是什么？是好莱坞对“可爱极客”的刻板印象——准确地说，是一个白人男性极客。\n\
  \n电脑以及控制它们的编程语言成了一种男人的行当。青少年女孩（比如当时的我）不再幻化自己投身这些职业，因为这些职业似乎是为男性量身定做的。有一句话作为女性触引起了我的共鸣：“如果她无法*看到*自己，她就无法*成为*她。”而那些在编程领域表现出色的女性典范——类似于爱达·洛芙莱斯（Ada\
  \ Lovelace）、格蕾丝·霍珀（Grace Hopper）以及布莱切利公园女性们——在当时几乎每一部赞美计算的大片中因缺席而格外显眼。\n\n我给你们上这简短的历史课并不是为了给某个方向指责。明确地说，我拥有一台电脑来写这本书，我再感激不过了。我非常感激才华横溢的程序员——无论男女——他们让我今天所享受的许多创新成为可能。我恰好是那些将电脑带入我们流行文化的\
  \ 80 年代电影的粉丝。我对为我们获得的未来铺平道路的无数创新者（无论男女）深表感谢。\n\n我只是想扩大我们网络安全人才的可触市场，因为网络安全人才短缺是我们面临的又一个威胁。我们数字自由的另一个威胁无疑是我们所有人都可以避免的。\n\
  \n不从历史中学习教训的人注定重蹈覆辙。我们可以从这堂历史课中学到很多东西，以改变我们未来的轨迹，使网络安全失业率高于零（我知道，希望在网络安全领域出现失业是一个奇怪的愿望，但我希望我已经传达了这一点：某种劳动力过剩总好于我们所面临的看似无尽的人才短缺）。作为公司的招聘人员，人力资源（HR）专业人士在帮助公司以及网络安全行业弥补差距方面发挥着重要作用。\n\
  \n## 给人力资源专业人士的建议\n\n我们必须接受两个现实。首先，我们现有的网络安全人才储备极其匮乏，这个问题不会在短期内发生改变。其次，由于人才库中的候选人不足以填充我们目前的网络安全职位，我们需要每位员工都投入战斗，尽其所能加强公司的防御。\n\
  \n硬币的两面——招募与征伍——变成了人力资源专业人士的号召令。在招聘方面，HR 可以帮助他们的组织**扩大网络安全人才的选拔范围**。这不是一个偏见可以获胜的情况。我们需要所有人才来帮助战斗——男性和女性、少数裔和非少数裔、艺术与科学。对于最后一点，我们的行业一直关注\
  \ STEM（科学、技术、工程和数学），以至于我们丢失了 STEAM（科学、技术、工程、艺术和数学）。网络安全既是一场心理战，也是一场技术战（战斗这两者都适用）。它既涉及软技能也涉及硬技能。它既锻炼创造力，也锻炼解决问题的能力。\n\
  \n检查你们的网络安全招聘公告，寻找能够拓宽申请者市场的技能平衡。这样做不会损害候选人的质量（这并不是要降低标准）。回看该领域女性的历史，在那个复杂的计算由人类大脑而非机器完成的时代，发现女性和男性一样能够胜任这些工作。你可能只需要在公司自己的职位描述中寻找那些曾导致\
  \ 80 年代导致大学筛选掉多元化人才的偏见。一旦发现，就果断地剔除它。\n\n但仍然还够。你需要在整个招聘过程中做到这一点。这包括面试。不幸的是，面试中常见的问题也是偏见的来源。例如，常见的行为面试题（如“请告诉我一次你曾……”）自然会倾向于有更多背景的候选人。然而，这些背景可能与今天的挑战无关。事实上，研究表明，这类问题预测成功的概率仅比掷硬币高\
  \ 12%。\n\n相反，给候选人一个问题并询问她将如何解决。你可以要求候选人向你介绍她入职后适应你们公司文化的计划。你可以向她展示目前的流程图，并让她提出改进建议。重点在于，你想看到候选人如何思考，而不仅仅是让她复述过去。\n\
  \n\n\n他们的证据表明，最成功的谷歌男性员工在回答这个面试问题时给出的是“4”。谷歌发现，男性倾向于夸大自己的经验或资历。最能预测女性候选人成功的得分是多少？满分\
  \ 5 分，因为谷歌发现女性更倾向于保守和谦逊。（当然，既然秘诀已经泄露了，谷歌现在得想出额外的面试问题来判断成功与否了！）\n\n出于这些原因，麦阿菲对大多数职位采用了小组面试法。我们在每个面试小组中至少会安排一名女性或少数族裔成员，以代表我们渴望招募的同样多样性。\n\
  \n### 消除招聘偏见\n\n最后，消除那种可能让贵公司只寻求具有以往网络安全经验专业人士的偏见。市场上的这类人才并不多。我们不能一直互相挖墙，在此过程中推高薪资并导致人才流失。因此，请消除那些对不同背景的候选人产生偏见的问题。例如，要求候选人谈谈他认为感兴趣的网络安全最新热门创新，这会让实操经验较少的人处于劣势（正如我们从\
  \ PC 的历史教训中学到的那样）。在寻找合格候选人时，确保你的问题能涵盖 STEAM——这里玩了双关语。\n\n当我进入麦阿菲时，我的背景中一丁网络安全经验都没有。在六个月内，我合著了一本关于该主题的书。我并不是在贬低这个行业的复杂性，但我认为技能是可转移的。寻找在其他领域拥有技能的候选人。你会发现，像电信这样的技术行业并没有处于零失业率的状态。技术本身在不同的劳动力市场中就会起伏波动。扩展你的视野，去寻找具有可转移技能的合格人才，无论候选人是否是否具有先前的网络安全经验。\n\
  \n### 将安全嵌入公司价值观\n\n在招募硬币的另一面，你可以通过多个杠杆将网络安全嵌入到员工的日常工作中，而不会在此过程中让他们深感重负。首先，`搜索你的公司价值观`——那些你期望员工遵守的行为准则或指导原则——`看看你可以在哪里添加一个词，从而从根本上改变它们的含义：安全（security）。`。\n\
  \n例如，在探索我以前雇主威信（Verizon）的老地方时，我发现公司在写本文期间的网站上列有一段令人印象深刻的信条。让我们来看看仅仅插入一个词如何在不损害意图的情况下扩大含义（斜体部分是我加的，表示建议添加）：\n\
  \n> 我们之所以工作，是因为客户重视我们高质量的通信服务。\n\n> 我们通过我们的产品和行动提供卓越的客户体验。我们所做的一切都建立在强大的网络、系统和流程基础之上。我们交付的产品的质量、可靠性*以及安全性*至关重要。客户付钱是为了让我们提供他们可以信赖的服务。\n\
  \n一个词就可以在不改变目的的情况下改变范围。\n\n现在，这并不是一场“网络安全宾果游戏”。有些价值观或指导原则，安全元素并不适合。不要把方方木凿进圆孔。威信的例子恰好说明了这一点：\n\
  \n> 我们知道团队合作让我们能够更好、更快速地为客户服务。\n\n> 我们拥抱多样性和个人发展，不仅是因为这是正确的事，还因为这是明智的商业行为。驱动我们不是自尊，而是成就。我们履行对彼此和客户的承诺。我们言出必行。我们尊重并信任彼此，保持开放、坦诚和直接的沟通，因为任何其他方式都是不公平且浪费时间的。我们发表意见并进行建设性的异议，然后全力支持一致的行动。我们中的任何一个人都可以向其他人提出观点或想法，并听取和重视他人的观点，无论职位或级别如何。想法的存亡取决于其本身的价值，而非它们产生于何处。\n\
  \n我恰好喜欢威信信条中的那段文字。但尽管我尽了努力，仍然无法在已经描述得如此美的话中自然地插入“安全”。\n\n这没关系。虽然你不会在一个不属于它的价值观中强行为安全找一个位置，但你可能会发现至少一个可以轻松融入它的地方。假设你的价值观不仅仅是员工证背面的花文字，你将开始通过根除不安全行为并代之以安全行为，将安全种子播到公司的基础中。\n\
  \n### 奖励与认可\n\n接下来，让我们看看你的`奖励与认可计划`，为网络安全成就找到一个自然的归宿。第一个显而易见：给你的网络安全团队一些爱。正如第 2\
  \ 章提到的，他们已经在公司的后台待了太久了。让他们从幕后走出来。\n\n怎么做呢？让你的 `CISO`（首席信息安全官）在某些公司全体会议上有发言。她不需要成为每个公司活动的常客。但你完全可以展示她和团队的成就，让更广泛的员工了解攻击格局以及网络安全防御的重要性。除了招募更多人才加入战斗外，一点感激就能产生很大影响，并可能有助于抑制你网络安全队伍中的高流失率（多亏于那不存在的失业率）。\n\
  \n接下来，扩展你的奖励与认可计划以包含网络安全。我在上一章中提到过，当新产品或服务的发布由于安全性不佳时，停止生产是非常重要的。使用贵公司的认可平台公开表扬员工——无论他们是否属于网络安全部门——因为他们提出了有效的安全顾虑，阻止了此类产品或服务进入市场。\n\
  \n### 处理恶意内部人员\n\n现在是时候处理这本书书中涉及的那个显而易见的问题了。到目前为止，我们一直把员工视为通常意良好的主体，他们寻求通过网络安全的方式为公司做出贡献，但可能缺乏方面的教育或处方来这样做。这在很大程度上是事实。\n\
  \n但有一部分员工他们不想为你的公司做贡献。这些人不仅仅是网络安全战斗中冷漠的旁观者。这些人是恶意内部人员，寻求损害你的组织和或以公司的代价个人获利。根据威信的\
  \ DBIR 报告，恶意内部人员占了所有公司破解事件的 10% 以上。\n\n恶意内部人员是公司面临的最阴险的敌人。首先，公司不愿对员工实施“老大哥”式的监控——这很有道理。撇开隐私考虑，雇主可能不愿将每个员工都视为潜在的坏人，而是倾向于一种信任是自由提供的而非通过长期获得的职场文化。\n\
  \n\n\n首先，与首席信息安全官（CISO）合作，识别出对公司最有价值资产访问权限最大的员工。你的 CISO 应该已经对组织最珍贵的资产拥有一套基于价值的风险分类法，无论这些资产是知识产权、制造设施、敏感数据库还是其他。定义对这些珍贵资产拥有特权访问的员工范围。与招聘经理和你的安全组织共同确定这些员工为了有效工作需要何种级别的访问权限。定期审查员工列表，以确保没有因职位变动而需要调整权限。在绩效评估期间，列出一份可能存在离职风险的员工名单，并将其与拥有特权访问的员工进行对比，确保法律部门正在处理尊重员工隐私的考量。通过定期建立和监控员工的访问权限，你可以保护公司免受那些不再需要增强权限（或可能从就不需要）的人的影响。\n\
  \n请注意，访问卫生不仅保护你的公司免受恶意内部人员的影响，还能防止恶意外部人员。如果 McAfee 执行了这一处方，我们会在一名机构员工（本质上是我们团队的扩展内部人员）停止为我们工作时，取消其对我们社交媒体页的管理权限。通过这样做，我们将避免我在第一章中描述的那次黑客。\n\
  \n接下来，在你的奖励和认可计划中，为举报者留出一席。这超出了政府保护和激励这些人的计划。建立一个机密计划，让员工可以在其中报告可疑行为。显然，这是一条微妙的界线，因为你不想在员工之间营造一种不信任的文化文化。但如果你允许员工在看到不对劲的事情时发声，你就可以动用你最强大的武器之一——你自己的员工——来识别违规员工。\n\
  \n案例说明：不久前，McAfee 重新调整了投资领域，以更贴近我们的客户需求和市场。这些决策对于一家公司来说并不容易，特别是当它们影响到员工时，本例正是如此。\n\
  \n我收到团队一名经理发来的邮件，他转发了其中一名员工发给他的邮件。在邮件中，该员工向经理寻求帮助。我们听到其中一名受影响的员工在打一个似乎可疑的电话。在电话中，该员工表示，既然他们已经被“解雇”，就可以准确地揭露\
  \ McAfee 最近几个月一直在研究的内容。（我应该提到，该员工对即将发布的产品非常了解。）\n\n听到这段对话后，我们担心的员工认为最好给经理发一封邮件，如实陈述所说的话。正如此，我们能够通过提醒离职员工遵守保密要求来进行干预（同时在此过程中没有暴露举报者）。我们还可以做出其他决策，加速或以其他方式更改产品的原始发布计划。\n\
  \n由于离职员工没有使用公司系统来传递或外泄信息，这一威胁将无法被 McAfee 的安全团队检测到。只有一名员工偷听了电话内容，且没有义务报告它。但那个人做了。我无法更充分地表达对我们自己的人为公司考虑的感激了。**寻找一种机密且不具威胁的方式，让尽职的员工在看到可疑情况时能够举报或发出警报。当他们这样做时，给予适当的奖励。**\n\
  \n最后，检查你公司的关键绩效指标（KPI），以找到与网络安全相关的指标。至少，**每位执行团队的成员都应该至少有一个网络安全 KPI**。\n\n这并不难。毕竟，这本书揭示了网络安全如何渗透到公司的多个职能领域，以及每个员工可以在其中发挥什么作用。找几个例子，并为每位首席官嵌入至少一个有意义的网络安全\
  \ KPI。他反过来会将相应的网络安全指标传递给他团队中负责相同工作的人。那些领导者将把责任分配给团队中的个人贡献者。这种瀑布效应最终会将网络安全渗透到你公司的所有职能所有层面。\n\
  \n***\n\n这本书关于在组织的所有级别和层次培养网络安全文化。文化不是推行的。它是水平且有机地传播的。管理层能做的就是为优秀文化的蓬盛提供最佳土壤。这意味着确保员工关注引导公司前进的愿景、使命和价值观。它要求招募与这些公司价值观一致、并致力于共同成功的人才。它意味着拥有奖励和认可计划以及清晰一致的指标，以确保每个人朝着同一个方向努力。\n\
  \n作为最关注公司文化的人，HR 专业人员在播种网络安全种子方面发挥着重要作用。你在帮助行业（不用说你的公司）解决人才短缺方面起着关键作用。通过消除限制我们寻找和招聘卓越网络安全人才能力的无意识偏见，并营造让每位员工都参与战斗的氛围，HR\
  \ 可以为我们所有人弥补网络安全的差距。\n\n## Notes\n\n1. Steve Morgan，“2019 年女性在全球网络安全劳动力中占 20%，”\
  \ Cybersecurity Ventures，2019 年 3 月 13 日，`https://cybersecurityventures.com/women-in-cybersecurity/`。\n\
  2. Jane LeClair，“为什么网络安全领域女性和少数群体如此少，”Thomas Edison State University，2018 年 9 月\
  \ 7 日，`https://blog.tesu.edu/why-there-are-so-few-women-and-minorities-in-cybersecurity`。\n\
  3. Bletchley Park Research，`https://www.bletchleyparkresearch.co.uk/research-notes/women-codebreakers/`。\n\
  4. Clive Thompson，“女性编程的秘密历史，《纽约时报》，2019 年 2 月 13 日，`https://www.nytimes.com/2019/02/13/magazine/women-coding-computer-programming.html`。\n\
  5. 同上。\n6. John Sullivan，“获得优秀人才的面试七规则，”哈佛商业评论》，2016 年 2 月 10 日，`https://hbr.org/2016/02/7-rules-for-job-interview-questions-that-result-in-great-hires`。\n\
  7. Shannon Shaper，“招聘谷歌员工需要多少面试？”re:Work，2017 年 4 月 4 日，`https://rework.withgoogle.com/blog/google-rule-of-four/`。\n\
  8. Shankar Vedantam 和 Maggie Penman，“谷歌的 Laszlo Bock 如何让工作更好，”国家公共广播 Hidden Brain\
  \ 播客，2016 年 6 月 7 日，`https://www.npr.org/2016/06/07/480976042/how-googles-laszlo-bock-is-making-work-better`。\n\
  \n\n\n\n9. Verizon，“2018 年数据泄露调查报告，”[`enterprise.verizon.com/resources/reports/DBIR_2018_Report_execsummary.pdf`](https://enterprise.verizon.com/resources/reports/DBIR_2018_Report_execsummary.pdf)。\n\
  \n# 第 6 章：幸运青睐有有准备的人\n\n> 我们有一套团队流程，一旦发生网络攻击就会触发。因此，在完全确定发生了什么、源自何处以及我们计划如何处理之前，我们不会直接让媒体知情。我们还没有进展到那一步。这完全取决于数据流的情况以及问题的严重程度。\n\
  > 某酒店业公司首席营销与销售官\n\n我一个朋友的朋友认识一个在拉斯维加斯出差的人。某天晚上，他去一家酒吧，和一位友好的陌生人喝了几杯酒。第二天早上，他醒来时感到腰部剧痛，正浸在冰水的浴缸里。他注意到浴缸旁边有一个手机，上面有一张字条，大意是：“拨打\
  \ 911。你的肾脏被手术切除了。”他活了下来并讲述了这段经历，但因此少了一个肾脏。要小心——有一个地下市场正专门从毫无防备的商务旅客和游客身上摘取器官。\n\n\
  我打赌你一定从朋友的朋友那里听过类似的故事。但也许那个受害者并不在拉斯维加斯。他可能在欧洲。或者南美。谁知道偷窃器官的地下市场竟然如此巨大？\n\n当然，事实并非如此。这个城市传说起源于\
  \ 20 世纪 90 年代后期，虽然我们现在对它的荒谬之处付之大笑，但我记得第一次听到这个恐怖故事时，脊背发凉（凉意直达肾脏！）。我并不是唯一一个中上当的人。\n\
  \n1997 年 1 月 30 日，在接到了大量警惕旅行者的电话后（这些旅行者正在重新考虑他们在马尔桂节（Mardi Gras）狂欢的计划）——新奥尔良警方局发布了以下声明：\n\
  \n> 在过去的六个月里，新奥尔良警方局收到了来自全美企业和组织的大量咨询，警告旅行者，新奥尔良有一个组织严密的犯罪团在活动。这些信息指称，该犯罪团在旅行者被提供酒精直至昏迷后，窃取他们的肾脏。\n\
  \n> 在对这些指控进行调查后，新奥尔良警方局发现这些指控完全毫无根据，没有任何事实。通过互联网传播的警告是**虚构的**，并且可能违反了有关发布错误和误导性信息的刑事法律规定。\n\
  \n我对城市传说深着迷。作为一名营销人员，我扮演的身份之一是讲故事的人。城市传说的独特之处在于它们传播极快。事实证明，其中最传奇的故事具有某些共同特征。\n\n\
  它们往往带有道德寓意，例如，“小心那些在酒吧里向你提供酒精的易接近陌生人。”它们利用了当下的社会恐惧。而且它们通常以“朋友的朋友”的形式出现。换句话说，追踪这些信息的源头或真实性是不可能的，导致人们在故事传播过程中不断脑补细节。\n\
  \n成功的城市传说与登上头条新闻的泄露事件，两者之间的相似性令我深受触。像城市传说一样，公共数据泄露的新闻往往传播得很快。泄露事件的细节（例如是如何发生的以及谁应该承担责任）通常来得很慢，导致个人用自己的假设来填补故事的空白，就像“朋友的朋友”对待民间传说做的那样。\n\
  \n泄露事件和城市传说还有一个共同点：它们都触及了一种强大的情感——恐惧。为什么恐惧如此强大？因为它深根于我们的生存本能。恐惧和愤怒被称为“热”情绪，是我们能强烈感受到的两种情绪。数千年来，我们的身体已经过了程序，在这些情感弦律被触发时能够迅速做出反应以保护生存。相比之下，感受“冷”情绪（如快乐和爱）需要更长的时间，因为我们的即时生存并不取决于这些情绪的强烈程度。\n\
  \n事实上，城市传说与泄露事件之间唯一的显著区别是后者是真实的。对于营销和传播专业人员来说，在整个过程中保持透明和真实，同时重新获得公司叙事的控制权，这是一个极其艰巨的挑战。公关战场上充满了公司在泄露后沟通宣传中失误的反面案例，比正面案例多得多。\n\
  \n作为品牌声誉的最终守护者，我的营销和传播同事们必须在下一次泄露发生时准备好应对——并且迅速反应。\n\n## 泄露！\n\n2014 年，当弗兰克·布莱克（Frank\
  \ Blake）宣布他将辞任家得宝（The Home Depot）首席执行官时，他留下的是七年来强劲业务表现和同情领导力的传奇。像许多 CEO 一样，布莱克在任期内也面临许多挑战。当他\
  \ 2007 年首次执掌大权时，迫在眉睫的住房危机刚刚开始萌芽。除了股价之外，由于一种自上而下、令员工感到反感的管理风格，士气也有所下降。\n\n布莱克开始专注于基础工作。他暂停了开设新店的计划，转而开始建立履约中心，将货物运得更靠近现有门店。他专注于盈利能力和商品组合。他关闭了无亏损的部门和市场。\n\
  \n与此同时，他为这家巨型零售商的文化带回了南方魅力。在某个典型的周日，布莱克会亲手给员工写下数百封个性化的感谢信——这是他在担任当时的副总法律顾问、效从乔治·H·W·布什（George\
  \ H. W. Bush，后来的美国总统）时学到的礼仪。\n\n几年坚定的专注让家得宝转危为安。在布莱克的任期内，股价从他 2007 年上任到 2014 年 8\
  \ 月宣布辞职期间翻了一番倍。\n\n因此，在任期的最后几个月，布莱克在劳动节假期度过了应得的休息——距离他宣布辞去 CEO 职位仅过了 12 天。作为一名典型的工作狂魔，布莱克在那个周日还在写他的感谢信。正如他所说的：“你衡量什么，就得到什么；庆祝什么。”\n\
  \n庆祝并没有持续多久。第二天一早，布莱克接到了公司总法律顾问的电话。他们的计算机系统似乎被入侵了。虽然布莱克还没有所有的细节，但他的公司财务状况和声誉正面临风险。在任职的几个月里，布莱克正面临着一场不仅危及他公司，还威胁到这位\
  \ CEO 完美无缺记录的危机。\n\n\n\n\n\n相反，布莱克（Blake）做出了最不寻常的事情。在公司尚未明确确定发生了什么之前，他就公开报告了泄露事件。在充分理解谁该承担责任之前，他就对事件表示了歉。他让所有客户知道他的公司将对任何欺诈费用负责，并在了解损害全部范围之前就提供了免费的信用监控服务。\n\
  \n虽然公司未能免受集体诉讼，但它避免了潜在惩罚性赔偿的全部火力，这在很大程度上归于布莱克和执行团队的积极应对。正如法官在判决书中解释的：\n\n> 这其中真正的反派是窃取数据的黑客。在数据泄露被发现后，并没有掩盖行为，家得宝（Home\
  \ Depot）作为一个良好的企业公民采取了补救措施的应对。没有理由认为其需要或应该受到行为修正。家得宝自愿向客户提供的福利方案优于通过集体诉讼所获得的福利方案。(([4)\n\
  \n最终，尽管当时其他遭受重大数据泄露的公司因其沟通策略执行得拙劣而在公众舆论中饱受嘲笑，家得宝却因其正直而受到赞誉。\n\n布莱克卓越的传奇又如何呢？难以置信的是，这次黑客攻击可能让这一传奇更加光辉。毕竟，一家公司在泄露后获得公开赞扬的情况又有几次呢？\n\
  \n而且黑客也没有能偷走家得宝的声誉。在公司的“客户之声”调查中，在布莱克的管理下，向他人强烈推荐家得宝的客户净百分增加了 44%。(([5)\n\n家得宝避免了成为泄露事件的笑话。他们控制了自己的信息传达，让“朋友之朋友”为他们填充细节的机会变得极小。他们交易的是赋能，而不是恐惧。多年以后，我们仍然在钦佩如何不让一场危机白费。\n\
  \n## 准备战斗\n\n虽然家得宝在执行应对方面可能是传奇性的，但在最初遭受泄露这一点上，它绝非独特的孤例。从你开始阅读这一章以来，全球已有超过 30,000\
  \ 条数据记录丢失或被盗。这是根据泄露水平指数（Breach Level Index）报告的，该指数每秒有 72 条记录遭到破坏。\n\n无论什么危机，时间永远不会站在响应者的一边。但在泄露中，时间会以两种方式背对你的公司。首先是发现泄露所需的时间，即业内所谓的“潜留时间”（dwell\
  \ time）。根据 Ponemon 的数据，2018 年的平均潜留时间为 197 天，(([6) 在被检测之前，网络犯罪分子在被泄露的公司系统中搜寻了六六个月。（一旦识别，公司平均还需要额外的\
  \ 69 天来遏制泄露。(([7) )\n\n然后，是通知相关成员泄露所需的时间。公司在这一方面也深陷挣扎，因为网络攻击的取证细节很少容易获得。国际隐私专业人员协会（IAPP）对\
  \ 2016 年至 2017 年间的网络安全事件进行了为期 18 个月的研究。他们发现，从发现到通知的平均时间为 72 小时。(([8)\n\n### 以受害者为中心的重要性\n\
  \n对于有效的沟通，标准无疑是非常高的。许多公司在沟通策略中抵制以受害者为中心，而是选择拒绝责任。在这一点上，研究结果是明确的：透明度备受重视。\n\n注意，在有效的沟通中，以受害者为中心是必要的，但不总是充分的。如果受害者认为公司本可以更多地防止危机，或者认为公司的声誉不好，那么可能需要更多，例如受害者赔偿。(([9)\n\
  \n### 危机沟通的关键策略\n\n为了有效应对泄露，研究人员确定了几种核心方法：\n\n1. **成功的公司早期且频繁地沟通。** 当坏消息爆发时，抢先的公司就是赢家。“抢先制人”（Stealing\
  \ thunder）被认为是有效的，因为观众更有可能认为你的信息没有别人发布的那个信息那么重要。具体来说，因为是你揭露了真相，所以你的观众对你违规行为的严重性感知会较低。(([10)\n\
  \n2. **成功的公司关注受害者而非他们自己。** 这要求公司表达同理心。由于法律考量，公司往往不愿提供公开道歉等社交礼仪，它们可能在“以受害者为中心”的试金石上失分。(([11)\n\
  \n3. **采取积极态度是有回报的。** 定期让利益相关者了解情况，比悄悄退缩、希望问题消失要好。虽然积极的方法起初导致了股价和声誉更剧烈的下跌，但这些公司反弹得更快。(([12)\n\
  \n### 否认的风险\n\n尽管否认是一种选择性策略，但沟通者在采取它时结合几种策略是明智的。特别是，在某些情况下，公司对泄露并不直接负责。例如，你的客户可能在多个服务中重复同一个密码，其中包括由你公司提供的服务。假设黑客攻破了其他服务之一，而你客户的密码在暗网上出售。尽管你的公司并不负责，但你将如何处理这种由他人或某物承担责任的通知？\n\
  \n否认公司负有责任的危机会导致双重打击。否认在起初效果较低，而且当事实随后揭露了公司的过错时，又会引发另一场危机。否认唯一有效的方法是，当已知公司没有过错时。(([13)\n\
  \n## 新兴威胁\n\n关联泄露是一回事，数据武器化是另一回事。正如机构所意识到的，不再是网络犯罪分子能拿什么，而是他们能伪造什么。也许坏分子最想要的正是你的声誉。一个威胁向量可能是入侵企业电子邮件服务器，暴露敏感的或其他不体面的邮件发送者和接收者，而这些邮件从未面向公众观众。\n\
  \n\n\n\n\n- 但为什么要止步于此？对手正开始操纵受害者的心理，就像他们历史上操纵受者的资金一样。也许在“泄露”曝光时，他们会混入一些虚假邮件。当这些伪造信息与真实邮件混在一起时，它们极难识别，更难以解释。传播专家必须预见到他们如何对那些损害品牌声誉的、明显伪造的邮件（或其他文件）有效地否认责任，以免发现自己的公司沦为由敌人制造的“自身都市传说”中的头主角。\n\
  \n虽然对于传播专家来说，网络安全攻击是一个较新的现象，但危机并非如此。我们可以从这些研究领域汲取智慧应用到我们自己的行动蓝图中。\n\n## 营销人员/传播者的\
  \ W.I.S.D.O.M. 准则\n\n如果天青眷有准备的人，你需要在泄露发生很久以前做好计划。否则，时间不会站在你这边。当宝贵的分钟一分流逝时，你最不希望看到你的执行团队被恐惧或愤怒等冲动情绪支配，因为这些情绪会蒙蔽理性思考。\n\
  \n### 构建一个获得高层明确支持的多维度沟通计划。\n在这次练习中要像 `CISO` 一样思考。`CISOs` 必须向董事会提供资产风险视角。在此练习中，并非所有资产都是同等的。你需要根据攻击的类型和严重程度，对公司应该做的事情进行同样的工作。并非所有攻击都是平等的。\n\
  \n与你的 `CISO` 合作，识别公司面临的常见威胁，例如网站篡改、勒索软件、客户记录泄露、员工记录泄露等。从那开始，针对每种情况对你的通知原则做出非常具体的规定。\n\
  \n- 即使法律没有要求，你会通知吗？\n- 如果你的公司对这次攻击不负责呢？这将如何改变你的信息的语气和内容？（考虑之前提到的“关联泄露”或“数据武器化”案例。）\n\
  - 你会在什么时候通知？要意识到越早越有利于引导舆论。事实上，关于危机传播的研究表明，最佳时机是事件发生后的一小时内。\n- 你会通知谁？\n- 如果你没有立即获得所有信息（这在泄露中很可能是事实），你会说什么？\n\
  - 你愿意为客户提供什么补偿，或作为展示以受害者为中心的同情心的表现（例如，提供免费的身份保护，或愿意承担客户因信用卡泄露造成的损失）？\n\n让你的 `CEO`\
  \ 和执行领导团队参与这次练习，并对根据攻击的严重程度来决定如何沟通、何时沟通以及沟通什么的指导原则达成共识。\n\n这次练习需要几周、甚至几个月才能充分完成。由于你的公司很可能已经在遭受攻击只是还不知道，因此将一个基于共识的计划正式化是你的首要任务。\n\
  \n### 为你计划中识别的每种场景创建沟通模板。\n与 `Legal` 部门合作来构思每条信息的框架。编写电子邮件、网页文案、博客、电话脚本、新闻稿、媒体声明和其他资产，并为细节留出占位符，以便在攻击发生时填充。准备好网站（内部和外部）的阶段，以便在泄露发生时可以快速上线并传达泄露细节。\n\
  \n信息必须在指令和语气之间取得正确的平衡。当危机发生时，客户希望知道你的公司考虑了他们的最佳利益，并且局面在控制之中。遗憾的是，泄露事件很少能在这两点上都给你的公司灵活性。\n\
  \n在证明公司控制着局面方面，请坚持使用以下模板蓝图：\n\n- 谁受到了影响？\n- 丢失、被盗或以其他方式受到损害的数据和系统系统有哪些？\n- 泄露发生在什么期间？\n\
  - 利益相关者需要采取哪些预防措施？\n- 公司正在采取哪些行动来纠问题并降低再次发生的风险？\n\n即使你的公司尚未获得所有信息，尽早准确地传达你已有的细节也能让你抢占先机（steal\
  \ thunder）。\n\n接下来，在语气方面，在信息中表现出同理心的同时保护你的法律利益——这是在练习早期让 `Legal` 参与的关键原因。关于这一点，让\
  \ `Legal` 审核所有模板化信息，这样当泄露发生时，一旦你插入了剩余细节，你就离获得最终批准更近。\n\n我们讨论过同理心的重要性。这一经过实践检验的危机传播准则在数据泄露领域被证明是正确的。`Ponemon`\
  \ 调查了在 2014 年因数据泄露后与公司终止关系的消费者。当被问及这些公司可以做什么来维持关系时，更多的消费者想要一个诚恳的道歉（43%），而不是免费的身份盗窃保护和信用卡监控服务（41%）。\n\
  \n根据语气匹配你的语言。同理心不适用于技术术语或法律术语。消费者一眼就能看穿虚假的道歉。`Ponemon` 2012 年的另一项研究发现，约三分之一的消费者对他们收到的泄露后沟通内容的篇幅或法律术语表示不满。\n\
  \n### 为每种攻击场景设计倒计时时间表（tick-tock schedule）。\n网络安全的货币是时间。据此设计你的计划。为每种攻击向量制定到分钟的计划。在发现公司遭泄露的最初几分钟内，你可能不会获得所有信息。\n\
  \n幸运的是，你的沟通计划将指导你的执行团队可以发布哪些内容以及何时发布。因为你是在没有时间压力的情况下建立此项计划的，所以你在提交证据证明“早期且频繁的沟通是有回报的”时，会更具说服力（记住\
  \ Home Depot 是一个完美的例子）——即使并非所有事实都随时可用。\n\n你的倒计时时间表应该确定在计划的每个阶段谁负责向利益相关者发布信息和/资产。超过\
  \ 60% 的消费者表示，如果机构立即通知他们，他们对泄露公司响应的满意度将大大提高。\n\n### 确保你的计划包含了员工，\n无论员工记录是否被泄露。在危机期间，员工（可能比客户更需要）需要确认雇主正处于控制之中。员工是公司最好的品牌大使。如果你让他们对细节一无所知，他们就无法帮助你传播信息，让你再次成为“朋友传朋友”流言的潜在受害者。积极与员工互动以争取他们的支持并缓解焦虑。在策略方面，考虑不仅限于电子邮件和内网更新。至少召开一次全体会议来解释情况。此外，每天在固定时间开放电话热线（例如\
  \ 30 分钟），让感兴趣的员工了解最新进展并回答任何问题。\n\n**练习、练习、再练习。** `CISOs` 进行红队演习（red-teaming），通过对组织模拟攻击来识别漏洞并加强防御。同样，`CMOs`\
  \ 也应该进行危机演习，以测试团队按照计划响应的有效性。危机管理专家建议至少至少一次，以建立组织的肌肉记忆。\n\n\n\n\n\n作为练习演练的一部分，请与你指定的公司发言人模拟媒体访谈。你需要准备多位接受过培训并随时就绪的发言人，以便在泄露发生时能够应对媒体。请确保他们已经准备好谈话要点和针对棘手问题的回答，以保持对信息传递的控制力。在这种情况下，实践使其无善于完美。\n\
  \n将你的整体危机计划和演练结果提交给执行团队审查，以确认你的沟通指导原则没有发生变化。花时间回顾其他公司自你上次演习以来采取的行动，以学习最佳实践，并在过程中不断调整自己的计划。\n\
  \n***\n\n玛雅·安杰洛洛（Maya Angelou）曾说：“我学会了人们会忘记你说过什么，忘记你做过什么，但他们永远不会忘记你带给他们什么样的感受。”我们之所以仍然讨论弗兰·布莱克（Frank\
  \ Blake）网络安全领域持久的影响，是因为他迅速的行动和体贴的回应让我们所有人（无论是否是受害者）都`feeling` 更好，意识到公司仍然在做正确的事。布莱克通过行动揭示了他的公司关心其客户。这种感觉在布莱克辞去\
  \ CEO 职位后很久之后依然存在。\n\n当泄露发生时，运气青睐有准备的人。你的公司无法阻止所有的泄露。坚定的网络分子只需要得手一次。当他们得手时，营销和传播团队需要通过一个协调、编排过的沟通计划快速反击，用清晰的指令和真诚的共情吸引所有相关利益者的参与。你的客户和员工将根据你的反应来衡量你的公司。当硝烟云散后，他们可能不记得你说过或做过的一切，但他们一定会记得你带给他们什么样的感受。\n\
  \n我的营销和传播战友们，`you`站在黑客和你们品牌声誉之间。幸运的是，你们还有大量的准备工作可以做以做好就绪。\n\n## Notes\n\n1. ^(1)\
