  \ ...\n15. ^(15) ...\n16. ^(16) ...\n\n# 第 7 章：有趣的伙伴\n\n> *当你进一步向外延伸——我们的二级和三级关系——你显然会有更大的脆弱性。我们有一套非常稳健的第三方服务政策和网络来进行监控和维护。事实上，这是我亲自负责的领域之一。我们有一个整个部门专门负责此。我们有调查卷。我们有不同的第三方会对我们一些关键第三方服务提供商进行审计和检查，以确保他们维持了适当的安全水平。我们要求每年对其数据安全进行特定的第三方审计。*\n\
  \n> 金融服务公司 CFO\n\n如果你是一家企业的 CFO，你可能和大多数黑客有许多共同点：你有健康的利润动机。许多对手也会同意你可能持有的哲学：现金为王。\n\
  \nJonathan Lusthaus 从未设想过要从事研究网络分子的职业。他的热情在于研究宗教暴力。但当他的论文主题不符合牛学院的研究领域时，他需要寻找一个新的兴趣点。\n\
  \n\n\n\n纯属偶然，他受到一位著名网络犯罪作者的启发，当时正值 Lusthaus 选择新主题的截止日期临近，这位作者正在牛津大学就该主题进行演讲。在对执法人员、安全专业人士和前网络犯罪分子进行了近\
  \ 250 次采访后，Lusthaus 成为了该领域的专家。在著作`Industry of Anonymity: Inside the Business of\
  \ Cybercrime,` 中，他向我们揭露了这一价值 6000 亿美元行业^(1)的真实暗面。\n\n他发现地下市场与支撑健康且合法业务工业的金融市场有许多共同点。Lusthaus\
  \ 指出网络犯罪分子之间存在分化。在网络犯罪领域，几乎没有“全才型”。相反，正如 Lusthaus 所揭示的那样，投资于某项“技能”并依赖他人执行专门职能具有更大的经济效益。有些人更擅长技术，因此他们设计网络祸源；另一些人天生擅长销售，因此他们进入地下商业市场推广价值主张；还有人擅长执行，他们为需要帮助将武器送达预期目标的买家提供售后支持。\n\
  \n推动世界上顶尖公司的分工机制也同样适用于暗网的需求。具有此类专业分工的网络犯罪分子如何在提供服务后相互信任并确保按时付款呢？这就像在线购物者学会了信任那些寻求其业务的合规在线公司一样。他们依靠其他网络犯罪分子对自身体验的数字评分量表。他们使用反馈论坛来交换关于他们中坏蛋的信息（显然，盗贼之间确实*有*道义）。\n\
  \n这些反馈机制扩大了网络犯罪业务的规模。每个犯罪分子都可以花更少的时间验证链中潜在伙伴的专业知识和可靠性，花更多的时间执行自己的技艺来犯罪。\n\n除了模仿在线交易所的服务，网络犯罪市场还模仿了合规治理规则。Lusthaus\
  \ 发现网络犯罪分子使用托管服务，委托第三方持有资金（如果不是货物），直到所有内容通过验证。甚至还有仲裁机制，双方都可以在负责裁决的社区资深成员面前辩论争议。在某些情况下，“法官”可能会将违规者排除出市场。\n\
  \n对于潜伏在网络表面下的巨大网络犯罪市场，麦菲（McAfee）已经进行了了自己的研究^(2)。由于执法部门对一些知名暗网市场的取缔，网络犯罪分子正在发挥他们的创业天赋。几位个人卖家正将成熟的市场（这些市场往往是执法人员的目标）转变为自己的网站，以便在暗网上兜售他们的商品和/或服务。反叛网站的设计师是这一追求的帮凶，他们为有志的供应商设计隐藏的市场。是的，即使暗网也有层级，允许其参与者以更低的飞行姿态避开雷达。\n\
  \n无论坏分子是否有意图建立自己的“点击即实体”等效场所，都有许多专注于网络犯罪主题的帮助性地下论坛，可以帮助这些犯罪分子精进他们的技艺。更热门的讨论涉及泄露的用户凭据、常见的漏洞和暴露，以及提供大量可供取的被盗信用卡卡的“倾销站（dump\
  \ sites）”。\n\n*这*就是网络犯罪的真面目。这个由服务、买家、卖家和“监管者”交叉而成的复杂迷宫，正是贵公司所面临的对手。而且贵公司还处于劣势。这不是一场公平的对决。暗网上没有萨班斯-奥克斯莱（SOX）要求。没有监管隐私和数据使用的\
  \ GDPR。没有由众多治理机构规定的合规标准。黑客可以在凌晨 2:00 写代码，并在凌晨 4:00 攻击他们的受害者。不需要苛刻的测试窗口来确保符合质量控制。\n\
  \n与贵公司受相同规则、法规和通用业务理想约束的竞争对手不同，对手遵守遵守法律（他们建立社区的法律）。与寻求获取市场份额的竞争对手不同，坏分子想要夺取你身上的一切。\n\
  \n你可能非常熟悉正在面对一个高度协调的敌人这一事实。但请考虑财务部门通常如何向组织分配预算，以理解网络安全的症结。预算可能是根据基准数据分配的。虽然你可以找到网络安全支出的基准，但它们带有误导性。因为网络安全的*真实*基准必须来自对手。如果你不知道对手在研发创建他们的“产品”方面花费了多少资金，又如何能准确评估与之匹配的网络安全预算？\n\
  \n如果不是基准数据，预算就是根据投资回报率（ROI）分配的。再次，这对网络安全专业人士来说是一个难以证明的衡量标准。因为首席信息安全官（CISO）如何证明一个负面结果？即使他们尝试这样做，聪明的首席财务官（CFO）难道不会从字面上质疑这一论点吗？想象\
  \ CFO 和 CISO 之间的对话是这样的：\n\n**CFO**: 我们为什么需要买这个新的安全小组件？\n\n**CISO**: 因为我们看到该领域针对公司的攻击次数创历史新高。\n\
  \n**CFO**: 但这笔支出的投资回报率是多少？\n\n**CISO**: 嗯，如果我们不采取行动，我们有被攻破的可能。\n\n**CFO**: 所以你是在告诉我，你能够保证如果我们购买了这项技术，就不会发生泄露吗？\n\
  \n**CISO**: 不完全是。情况比这复杂一些。\n\n**CFO**: 让我们简单化。投资回报率是多少？\n\n你可以看到这种圆圈论证可以持续多长时间。除了尝试用复杂的网络安全指标让财务人员感到震惊和威慑之外，CISO\
  \ 没有什么聪明的办法来回答“你的 ROI 是多少？”这个问题。\n\n并不是 CISO 在逃避问题——或者说他们不理解 ROI 的概念。为了理解为什么这是一个如此无法回答的问题，让我们来看几个更能具体说明问题的敌对攻击。\n\
  \n世事变迁…………\n\n2017 年 5 月，网络安全进入了几乎每个媒体网站的首页以及全球几乎每个新闻广播的第一段节目。那些之前不知道的人将通过一个名字了解到它，勒索病毒（WannaCry）。这次攻击在规模和速度上都是前所未有的，在发生后的头几天内就感染了全球超过\
  \ 20 万台计算机——关闭了医院、大学和银行。^(3)勒索病毒扣留每个受害者的计算机文件作为索金，金额高达 300 美元的比特币。估计勒索病毒暴怒造成的损失是多少？全球范围内高达数十亿美元。\n\
  \n\n\n\n\nMcAfee 对 `WannaCry` 自身的分析显示，它几乎算不上真正的勒索软件。其作者为其留下的变现能力相当粗浅。他们没有将受害者的唯一标识与其比特币支付关联起来，导致文件解密变得极其困难。那么\
  \ `WannaCry` 到底是什么？勒索软件？蠕虫？两者皆是。\n\n2018 年，黑客的才华随着 `Zyklon` 的发布再次充分展露。`Zyklon` 是一个功能齐全的威胁包，供企业犯罪分子利用——它可以窃取密码、发起\
  \ DDoS 攻击、挖掘加密货币等。`Zyklon` 到底是什么？加密矿矿？DDoS？键盘记录？以上皆是。\n\n正如 `WannaCry` 和 `Zyklon`\
  \ 所示，黑客不仅在专业领域进行合作，还协作创造出融合威胁的新混合物。他们正在将旧品种（如蠕虫）与新品种（如勒索软件）混合在一起。在 McAfee 对地下论坛的分析中，我们看到网络犯罪分子正在讨论新旧漏洞。结果是复杂的威胁，其传播速度比以往任何时候都要快得多。\n\
  \n回到我们 `CFO` 和 `CISO` 之间的对话。当 `CISO` 向 `CFO` 请求要更多资金时，通常是因为这种现实。即使在周期中期，在预算分配很久之后，`CISO`\
  \ 可能仍需要更多。`WannaCry` 并没有等待方便的财政周期结束来大肆破坏。恶性分子不在乎你的预算周期。\n\n如果 `ROI` 不是网络安全的正确指标，那么什么才是？风险管理。网络安全专业人士从事的是风险管理业务。诚然，他们拥有技术知识，并有许多产品用于防范公司免受高度组织化的犯罪集团的侵害。但只要脱离该领域的技术术语，它实际上会归结为一个清晰的业务目标——降低公司的风险。\n\
  \n正如 `CFOs` 所知的，风险管理及其相关指标与更传统的财务衡量 `ROI` 有本质区别。我住在北德克萨斯州北部，那是该国一个被称为“龙卷风走廊”这一不幸俗称的地区。直到今天，我对龙卷风保持着健康的恐惧。这归咎于每月第一个星期三中午测试的龙卷风警报器。那令人骨骨悚然的声音简直是直接来自战争电影。或者可以归咎于多萝丝和通过龙卷风前往奥兹国之旅，这个念头在小时候就让我惊坏了。无论如何，我害怕龙卷风。但在北德克萨斯州的每个春天，它们对我原本和平的生活来说都是持续的威胁。\n\
  \n直到我被教导我的恐惧是多么毫无根据。McAfee 的首席技术官 (`CTO`) 去年搬到了达拉斯地区。他那里立即接受了紧张的同事和像我这样的老德克萨斯人关于龙卷风的教导。然而，与我不同，他决定进行自己的研究，而不是屈从炒作。他发现，在\
  \ 69 年的追踪中，我所在的县只出现过一次 `F3` 或以上的龙卷风（这种龙卷风能够造成严重甚至难以想象的损害）。\n\n现在，回到风险管理的讨论。你们的财务团队会检查公司校园内公示龙卷风避难所标志的\
  \ `ROI` 吗？特别是像我这样恰住在“龙卷风走廊”的地点。可能不会。即使你检查了完全丢失这些标志的风险，你可能也会发现数据支持这种鲁莽的放弃（我们的 `CTO`\
  \ 为我所在的县找到的数据表明，致命龙卷风确实是一个极罕见的事件）。\n\n即使 69 年里只发生一次灾难性的龙卷风，风险仍然存在。如果这种风险变为现实，为了节省几美元而放弃可见且理性的标志可能证明是一项昂贵的决策。\n\
  \n网络安全也处于同样的境地。虽然 `CISOs` 每天必须处理大量的威胁（这些威胁可能不会造成灾难性的破坏，但仍会干扰业务），他们还必须考虑大规模攻击中固有的、可能导致公司瘫痪一段时间的灾难性风险（尽管可能性低得多）。他们每天每分钟都是在风险的钢丝上行走。\n\
  \n如果 `CFOs` 能以稍微不同的方式与 `CISOs` 开启对话，他们就可以帮助建立从网络安全到风险管理的桥梁。换个角度看待之前的那段对话：\n\n**CFO**:\
  \ 我们为什么需要买这个新的安全组件？我们正试图保护什么？\n\n**CISO**: 它保护了我们的[填空]资产，我们已将其确定为公司极具战略性的资源。\n\n\
  **CFO**: 但你如何知道该资产面临风险？\n\n**CISO**: 我们知道一个攻击者可以利用的漏洞。\n\n**CFO**: 如果我们不采取行动，风险是什么？\n\
  \n**CISO**: 鉴于这是一个高风险资产，泄露的后果意味着[业务中断、高达 x 百万美元的罚款、客户安全召回、关键系统或站点的关闭等]。\n\n**CFO**:\
  \ 让我们对那个后果再深入点击一下。告诉我们我们的[财务、法律、知识产权和/或声誉]暴露情况是怎样的。\n\n仅仅通过不同的方式界定对话，`CFOs` 就可以帮助他们的\
  \ `CISO` 合作伙伴将网络安全投资转化为业务成果——同时摆弃了大多数 `CFOs` 可能不会留恋的技术术语和网络安全指标的视力表。这从提问正确的问题开始。\n\
  \n同样的问题对于由财务部门久经有效的 `ROI` 指标管理的其他业务决策也被证明是卓有成效的。大多数追求利润的公司都在从事增长业务。正因如此，存在进入新市场、通过新产品扩张、通过新技术提高生产力等压力。许多此类业务案例都经得起\
  \ `ROI` 试金石的检验。但这些情况会频繁检查其对公司风险状况的影响，特别是通过扩大攻击者可以利用的攻击面？\n\n`CFOs` 可以在新的业务案例进入他们的桌面时，帮助其组织提出这些风险相关的问题：\n\
  \n*   新的[市场、内部技术、客户产品等]如何改变公司的攻击面？\n*   它如何改变公司最具战略资产的风险状况？\n*   [假设风险增加] 需要多少额外投资（一次性和经常性的）将风险状况带到可接受的基准？这项投资是否包含在\
  \ `ROI` 分析中？\n\n通过向他们的非网络安全同事提出这些问题，`CFOs` 及其团队可以确保网络安全不是公司战略增长计划的事后考虑。\n\n\n\n\n\
  \n以下是为什么床虱如此难以根灭的原因。你可以拥有世界上最干净的房子。你可以虔诚不经地消毒你的床单。你可以对睡衣或任何应该接触你睡眠地点的衣服同样这样做。但如果你恰好入住了一间有虫害的酒店或乘坐了飞机，只需要一只讨厌的床虱就能搭你的便车（在这种情况下，是你的行李或内部的物品），并前往你的家中。\n\
  \n如果你恰好住在公寓楼或其他多户型单元，情况会更糟。现在，只需要那个与你共用墙壁的邻居在卫生标准上比你稍微松懈，你可能就会发现家里出现了不速之客住客（是的，这些坚定的寄生虫可以通过墙体空隙移动，利用水管和电线管道作为它们的路线）。\n\
  \n如果这还不够糟糕的话，由于床虱带有极大的污名化，大多数人都不愿承认自己与这些吸血鬼共处。等到他们承认存在问题并寻求帮助时，他们可能正面临着全面的虫害。如果你恰好过了一夜（如在酒店）或共用墙壁（如与邻居）——你明白我的意思……。\n\
  \n床虱是一个不幸的提醒，提醒我们我们彼此之间是多么依赖。这并不是依靠邻居帮助的问题，而是关于信任他们了解自己的环境（在一项研究中，近 50%患床虱的人甚至不知道自己患有它们），并寻求专业帮助来消除它们。\n\
  \n这是一个多么有趣的网络安全寓喻。公司并非孤立运行的岛，而是在高度复杂、互联的生态系统中运行的。虽然一家公司可能采取良好的网络安全卫生措施，但它必须依靠邻居——任何与它有业务来与其系统有某些联系的第三方——也这样做。否则，它就会让自己暴露在阴险掠食者的面前，利用侧门和后门进行渗透。（顺便说，在这种情况下连接的“系统”并不一定通过广泛的网络连接。回想第\
  \ 3 章涵盖的网络安全卫生实践。只需要一个粗心的伙伴留下一个存有公司敏感文件且无人看管未加密的`USB`或`笔记本电脑`，你的公司就会暴露。）\n\n在我们享受了相对无床虱生活的几十年里，我们被提醒，旧的事物可以重焕发生机。事物越变化，本质越不变。尽管曾经在对抗床虱方面取得了了进步，但我们再次对床虱感到感叹。\n\
  \n虽然变化是业务中唯一的永恒，但许多`CFOs`仍然可以确信一个确定性：他们管理着公司的采购。由于这在很大程度上仍然属于财务职能，`CFO`与`CISO`之间的亲缘关系将变得更加紧密。\n\
  \n正如床虱提醒我们，在防范入侵者方面我们彼此之间是多么依赖一样，第三方关系当了额外的暴露点，对手可以利用这些点对我们的公司造成伤害。考虑来自`Ponemon`的几点，它们反映了严峻的现实：\n\
  \n*   59%的组织确认他们曾由于其第三方之一而遭遇了数据泄露。\n*   只有 29%的人表示，他们将从第三方本身获知此类泄露。\n*   76%的人说涉及供应商的网络安全事件数量正在增加，但只有\
  \ 46%的人同意管理外包关系风险是首要任务。\n*   57%的人并不知道其组织的供应商保护措施是否足以防止泄露。\n\n从积极的一来说，这些指标有很大的改进空间。对于许多组织来说，第三方安全管理是一个相对较的领域。正如上面的数字所示，它也是至关重要的。`CFOs`代表他们的组织冲锋陷，确保采购流程充分审查了第三方的网络安全态势。这里是你的`CISO`将帮助你提出正确问题的领域。\n\
  \n当然，最终的信赖第三方关系是公司将某个功能（或其部分）完全外包的关系。`Deloitte`在 2016 年进行了一项全球研究，审查了外包生命周期和关键趋势。报告中被外包的首要功能是什么？`IT`，高达\
  \ 72%的组织外包了该功能的部分，31%的计划增加外包。\n\n曾经，考虑外包自己的网络安全环境是荒谬的。但看起来网络安全正在追随其 IT 祖先的脚步，因为让第三方保护组织最宝贵的数字资产变得越来越被接受。当然，全球网络安全人才的短缺只是火上添油。公司与其在市场上激烈竞争那些根本不存在的网络安全人才，不如选择雇佣具有此类专业知识的第三方，以至少增强内部的人员能力。\n\
  \n特别是安全运营中心（`SOC`）最可能被外包的领域包括`渗透测试`（75%的组织外包）、`威胁情报收集和馈`（54%）以及`数字`和`恶意软件取证`（51%）。\n\
  \n外包网络安全功能的一个或多个领域有几个优点。与大多数外包情况一样，公司可以通过雇佣具有相当网络安全基础设施的第三方来节省资金并最大限度地减少前期资本支出。公司还可以通过与这些托管安全服务提供商（`MSSPs`）谈判服务水平协议来规定技术更新的条款，从而缓解过时的风险。最后，`MSSPs`专注于网络安全。他们可以专注于这一核心竞争力，为客户留出更多时间关注他们自己的竞争力。\n\
  \n正如书中的大多数主题一样，这个问题也包含了几层灰色地带。虽然外包网络安全计划的一部分对于许多公司来说非常合适（特别是那些人员限制更严苛的公司），但网络安全在某种程度上类似于慈善——它始于内部。将网络安全态势的完全责任交给第三方确实是一项风险巨大的业务。\n\
  \n\n\n\n\n目标是尽可能高效地降低风险。有很多问题可以促进首席信息安全官（CISO）和首席财务官（CFO）在不同的层次进行沟通，例如：\n\n* 哪些资产面临风险？\n\
  * 这些资产的战略价值是什么？\n* 这些资产目前的漏洞水平处于如何？\n* 如果发生数据泄露，会产生什么后果（财务损失、知识产权泄露、声誉风险）？\n\n为了确保网络安全不是事后才想起来的补救措施，在审查其他领导者提交的业务案例时，CFO\
  \ 应该询问以下问题：\n\n* 新的[市场、内部技术、客户产品等]如何改变公司的攻击面？\n* 它是如何改变公司最具战略性的资产的风险状况的？\n* [假设风险有所增加]\
  \ 需要多少额外投资（一次性及经常性）才能将风险状况恢复到可接受的基准水平？这项投资是否包含在投资回报率（ROI）分析中？\n\n在`确保资源支出得到最高效利用的情况下，要求\
  \ CISO 提供以下领域的指标`是非常公平的：\n\n* 在那些仍然放在架子上的产品（闲置软件）中投入了多少网络安全资金？\n* 这些产品的部署计划是什么？\n\
  * 上一次确保安全产品配置得当的审计是什么时候执行的？结果如何？\n* 上一次进行渗透测试是什么时候？结果如何？\n* 上一次对所有员工进行网络安全培训是什么时候？结果如何？\n\
  \n接下来，作为采购负责人，`财务专业人员引导其组织通过降低第三方暴露来缓解关联泄露`。从对所有第三方进行全面盘点开始（根据 Ponemon 的研究，只有 34%\
  \ 的组织声称他们拥有清单^9）。从那里开始对网络安全防御和实践进行审计。坏消息是这可能花费大量精力和。好消息是，同样的审计问题可以用于筛选任何想要成为供应商的新第三方。\n\
  \n这些问题将集中在多个领域，以评估合作伙伴的网络安全态，包括：\n\n* 观察第三方如何评估和更新访问权限和权利。\n* 理解他们的业务连续性流程以及测试频率。\n\
  * 在其变更控制指南中查找针对系统新用户和/或新软件的规定。\n* 澄清贵公司与他们之间传输的任何数据将如何被使用、保护以及在适当何时处置（在合同终止时和/或根据合性标准）。\n\
  * 了解他们如何在各种状态下（静态、使用中和传输中）对数据进行加密。\n* 评估他们如何对员工进行网络安全意识和卫生协议培训。\n\n`对于您最具战略性的供应商，考虑每年聘请第三方审计一次他们的安全实践。`\
  \ 筛选供应商是一个极好的第一步。但要确保他们在成为您的客户后其安全实践不会变得松懈，则需要更大的谨慎。\n\n最后，要留心你允许第三方宣传关于贵公司的信息。合作伙伴发布新闻稿来宣布其业务安排是常见做法。公司在网站上到处展示其所有客户、供应商和/或合作伙伴的\
  \ Logo 也是正常现象。我是一个营销人员，所以我理解这一点。利用生态系统的力量为各方增加品牌价值通常是一件好事。\n\n但要保持谨慎。任何想要推广其与贵公司关系的第三方，都会向黑客泄露他们可能渗透贵公司的侧门和后门。这向这些网络王国的寄生虫展示了，一旦他们知道共享同一堵墙的邻居，该如何渗透贵公司。如果稍微担心某个想要推广其与贵公司关系的第三方没有达到你要求的网络安全标准，`不要允许他们推广`。\n\
  \n这只是一个详尽清单子集，旨在确保你的第三方在保护你的组织免受威胁方面像你一样有纪律。如果他们认真想要赢得你的业务，他们难道不应该同样倾向于保护这笔业务吗？\n\
  \n***\n\n财务和网络安全的领域表面上似乎并不契合。但深层次的观察发现，它们的共同点比表面看到的的要多。从核心来看，网络犯罪是一门大门生意——这是 CFO\
  \ 可以理解的。反之，网络安全关乎风险管理——这是财务人员非常熟悉的另一个概念。CFO 可以帮助 CISO 更流利地使用董事会的语言（风险管理）。反之，CISO\
  \ 可以帮助采购部门的人在筛选第三方时使用网络安全的语言。当这两个职能汇聚在一起欣赏他们的相似性并抛弃差异时，双方都能从协作中变得更强大。毕竟，坏分子已经知道协作的价值了。难道现在不是\
  \ CFO 和 CISO 意识到同样的时候吗？\n\n## 备注\n\n1. ^(1) McAfee, “网络犯罪的经济影响——并未减缓。”\n2. ^(2)\
  \ McAfee Labs 威胁报告，2018 年 12 月，[`www.mcafee.com/enterprise/en-us/assets/reports/rp-quarterly-threats-dec-2018.pdf`](https://www.mcafee.com/enterprise/en-us/assets/reports/rp-quarterly-threats-dec-2018.pdf).\n\
  3. ^(3) Alfred Ng, “WannaCry 勒索软件失去了杀开关，请注意,” CNET, 2017 年 5 月 15 日，[`www.cnet.com/WannaCry\
  \ Ransomware Lososes Its kill Switch, So Watch Out`](https://www.cnet.com/WannaCry-Ransomware-Lososes-Its-kill-Switch,-So-Watch-Out)。\n\
  4. ^(4) Sean Rossman, “蠕虫消失 40 年后，现在它们带着复仇回来了,” *美国今日报*,2017 年 6 月 21 日，[`www.usoday.com/story/nation-now/2017/06/21/bed-bugs-disappeared-40-years-now-theyre-back-heres-know`](https://www.usoday.com/story/nation-now/2017/06/21/bed-bugs-disappeared-40-years-now-theyre-back-heres-know)。\n\
