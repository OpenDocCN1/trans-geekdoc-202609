  \ IT 在防止网络攻击中扮演什么角色，以及其他人又扮演什么角色。目前，还不知道这条界限在哪里。*\n\n\n\n\n\n- 不要落入社交工程攻击的圈套。警惕恶意邮件的迹象，例如发件人的电子邮件地址。不要点击来自未知来源的链接。\n\
  - 积极主动，立即向您的网络安全团队报告任何可疑邮件。\n- 确保笔记本电脑、移动设备和其他个人技术的安全补丁保持更新。当您的安全机构推送安全更新时，不要推迟。\n\
  - 养成良好的网络安全习惯——使用强密码，不要重复使用密码，并避免未加密的 USB 设备。\n\n## 产品开发人员的 W.I.S.D.O.M. 原则\n\n\
  - 在发现阶段询问客户关于他们的网络安全需求。\n- 将安全性作为任何最小可行产品（MVP）需求的一部分。\n- 在设计任何新产品或服务时，清晰且有意识地定义您的数据需求。\n\
  - 在产品生命周期的每个阶段建立安全所有权。\n- 如果在产品发布的任何一点安全性缺失或不足，应立即停止流程。奖励并公开表彰公司其他采取同样行动的员工。\n\n\
  ## 人力资源专业人士的 W.I.S.D.O.M. 原则\n\n- 扩大网络安全人才的范围——男性和女性、少数群体和非少数群体、艺术与科学（STEAM）。审查当前的网络安全职位招聘公告以寻找多样化的技能。寻找包含无意识偏见的面试问题，包括常见的类型，如“请告诉我你曾……”或“请谈谈网络安全领域最新最热门的创新”。在每个面试小组中至少安排一位具有多样化背景的领导者。\n\
  - 检索公司价值观，查看可以在哪里添加 `securely`（安全地）或其派生词，在不改变目的的情况下改变其适用范围。\n- 奖励并认可那些加强公司网络安全防御的行为。\n\
  - 与您的 `CISO` 合作，识别并控制组织最宝贵资产的访问权限。寻找一种保密且无威胁的方式，让尽职的员工在看到类似于恶意内部威胁的情况时能够进行举报或发出警报。当他们这样做时，给予适当的奖励。\n\
  - 确保执行团队的每位成员至少有一个网络安全关键绩效指标（`KPI`）。\n\n## 营销/传播人员的 W.I.S.D.O.M. 原则\n\n- 构建一个获得高层明确支持的多维度沟通计划。该计划应包含对以下问题的回答：\n\
  \    - 即使法律没有要求，你会通知吗？\n    - 如果你的公司不对攻击负责会怎样？这将如何改变你发布信息的语气？（以关联性泄露和数据武器化使用用例为例。）\n\
  \    - 你会在什么时候通知？\n    - 你会通知谁？\n    - 如果你没有立即获得所有信息，你会说什么？\n    - 你愿意向客户提供什么补偿，或作为对受害者为中心的同情展示（例如提供免费的身份保护，或提议承担信用卡泄露导致的客户损失）？\n\
  - 为计划中确定的每种场景创建沟通模板。在模板中留出占位符来回答以下问题：\n    - 谁受到了影响？\n    - 哪些数据和/或系统丢失、被盗或以其他方式遭到破坏？\n\
  \    - 泄露发生在什么时间段？\n    - 相关利益者需要采取哪些预防措施？\n- 相关利益者需要采取哪些预防措施？\n- 相关利益者需要采取哪些预防措施？\n\
  - 执行一次。\n- 至少每年练习一次应急演练。\n\n## 财务专业人士的 W.I.S.D.O.M. 原则\n\n与您的 `CISO` 合作，识别并控制组织最宝贵资产的访问权限。寻找一种保密且无威胁的方式，让尽职的员工在看到类似于恶意内部威胁的情况时能够进行举报或发出警报。当他们这样做时，给予适当的奖励。\n\
  - 确保执行团队的每位成员至少有一个网络安全关键绩效指标（`KPI`）。\n\n\n\n\n\n- 数据在节点、模块、实例或虚拟服务器之间移动时是否进行了加密？如果没有，是否有提供添加此功能的选项？请描述所使用的加密方法。\n\
  - 数据在静态存储时（例如存储在数据库中、存储在备份磁带上等）是否进行了加密？如果没有，是否有提供添加此功能的选项？请描述所使用的加密方法。\n- 评估其如何对员工进行网络安全意识和卫生协议的培训。\n\
  \    - 贵组织是否拥有安全意识和培训计划？\n    - 组织是否确保人员每年接受组织安全政策的培训，并要求其了解这些政策的变更或更新？\n    - 组织是否确保所有访问机密数据的人员都接受了相应岗位的信息安全培训？\n\
  \    - 组织是否确保所有访问个人身份信息 (PII) 的人员都完成了隐私培训课程，并了解所处理数据的任何特定隐私要求？\n- 对于您最具战略意义的供应商，考虑每年聘请第三方对其安全实践进行一次审计。\n\
  - 如果您稍微担心某位寻求与贵公司建立合作关系的第三方不符合您要求的网络安全标准，请不要让他们进行此类推介。\n\n## 网络安全专业人士的 W.I.S.D.O.M.\n\
  \n- 良好的网络安全卫生是不可妥协的。保持补丁更新——涵盖物理和虚拟基础设施。审查内部通信计划，以通知管理员漏洞情况，包括定期审查分发列表以确认其准确性。安装闲置软件（shelfware）。确保安全防御配置妥。备份您的数据（并测试备份系统）。定期进行渗透测试，并向执行官和董事会成员定期提供进展报告。\n\
  - CISO 和 CIO 必须在指标和目标上达成共识。在每个规划周期的开始时，为良好的网络安全卫生建立角色和职责，包括补丁、备份、多因素认证等。\n- 识别并分配预算中哪些部分用于\
  \ IT，哪些用于网络安全。约定关键性能指标 (KPI) 和服务水平协议 (SAs)，以便优先安排工作并在发生争议时解决冲突。\n- 投资于能够提升贵公司业务价值并降低对手价值的技术。\n\
  \    - 云访问安全经纪器 (CASB) 技术有助于保护已授权和未授权的云服务。\n    - 欺骗技术可以分散并迷惑对手。\n- 使用人工智能 (AI)\
  \ 能力识别最先进的威胁并解决人才短缺，但要了解其局限性。AI 会产生更多的误报。传统的威胁情报有更多的漏报。两者结合可以产生更高的效率和更低的误报率。\n-\
  \ 在公司内部竖起网络安全的旗帜。\n    - 通过使用董事会及其高管的语言（风险管理）进行纵向传播。与财务部门合作，将网络安全术语转化为董事会最理解和重视的指标与结果。\n\
  \    - 通过文化意识活动进行水平传播。聘请沟通专家与人力资源部门和市场营销部合作，开发有效的活动，让网络安全成为每个人日常工作的一部分。向职能部门同事提供可操作的评分卡，衡量员工对网络安全原则的理解以及对公司政策的遵守情况。\n\
