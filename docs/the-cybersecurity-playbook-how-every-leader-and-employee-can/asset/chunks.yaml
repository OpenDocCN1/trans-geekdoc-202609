  trans: '

    她立即向我保证，我们的首席信息安全官（CISO）已经在处理此事，并确认我们的系统运行良好。一阵宽意瞬间涌上心头——直到我意识到需要再打一个电话。我们的 CEO
    需要知道发生了什么。而我希望他从我口听到这个消息。我正准备毁掉他的复活节周日。他几乎立刻接起了电话：


    *   “克里斯，我们的一个社交媒体账号被黑客了。”

    *   他的反应很克制。“严重什么程度？”

    *   “我们的公司服务器没问题，克里斯。被黑掉的是我们在社交媒体网站上的公司页面。”


    我向他详细说明了发生了什么。我们的社交媒体经理加文（Gavin）是第一个发现攻击的人。加文当时在家里，正做着自己的事——在下午 5 点左右，他在社交媒体平台上看到了一了一条状态更新，上面有一堆随机乱码。他认为有人误触了更新功能。随后，他联系了他的团队，查看是谁不小心创建了该帖子。加文登录社交媒体平台，并删除了该帖子。


    随后，另一个毫无意义的帖子出现了。没有任何人知道这是怎么回事。加文登录社交媒体平台并进入账号设置。所有拥有账号管理员权限的人都是熟悉的。尽管如此，为了安全起见，加文开始删除所有其他管理员。


    当他执行这些操作时，页面刷新了，他被锁在了账户之外。


    现在毫无疑问这是恶意的。一瞬间，加文意识到删除帖子的行为让黑客察觉到了。这就像典型的科技惊悚：手指在键盘上飞速跳动，屏幕上不断闪烁。即使没有音乐，紧张气氛也到了顶点。加文说，黑客正在尝试做同样的事情。


    我正向执行团队通报这一事件时，继续毁掉其他人的复活节周日。


    在挂掉 CEO 的电话之前，我还有一个令人失望的消息要分享：


    *   “噢，克里斯，当你访问我们的个人页面时，不仅会看到那些攻击性帖子，我们的公司 Logo 也替换成了一个看起来像鸟的图片。仔细看，那完全不是鸟。”


    包括我的在！


    在社交社区中，这种事情很常见，黑客用淫秽图片来破坏网站，指示某人被“pwned”（俚语，意为被击败/攻破）。现在黑客知道我们被锁在账户之外，在此期间，他添加了一张淫秽图片替换了我们的公司
    Logo。为了保险起见，我们的执行团队疯狂地与社交媒体平台协作解决这个问题。但是……事情进展得并不快。而且由于现在是傍晚了，我们只能与亚太地区（APAC）团队协作。进展缓慢如蜗牛。


    我们等待了仿佛永恒那么久。因为并不是服务器被黑，我们只能每隔几分钟向支持团队查询一次，得到的回复是他们“正在处理”。


    大约 30 分钟后，我们收到消息，社交媒体平台已经锁定了公司页面的*所有*管理员，只有他们拥有访问权限。这是好消息——至少不会造成更多损害。


    坏消息是？他们没有办法将页面恢复到 30 分钟前的状态。他们的流程是先锁定页面以便无法进行任何进一步更改，然后进行验证程序：为了验证，他们想要确保我们就是我们所称的身份，而不是冒充
    McAfee 的黑客（真讽刺！）。接着分析阶段，他们想在采取进一步行动之前研究攻击的范围。


    但那张淫秽图片呢？它仍然显示在我们的公司页面上。


    在接下来的一次更新中，支持团队说他们还没有完成“程序”。他们说恢复页面的唯一方法是重新激活账号——解锁它——但在完成安全审查之前他们不会这样做。


    真的吗？这到底是怎么发生的？在他们完成审查之前，我们的公司页面我们*什么*也做不了。我们完全听命于他们。员工们能做的就是在自己的个人页面上删除任何关于 McAfee
    的提及，知晓此事件的人也都这样做了。


    但这不够。当我向执行团队通报这一事件时，我继续毁掉大家的周日。我们确保了公司的服务器是安全的，但这并不意味着 McAfee 没有通过其他渠道受到攻击。我们完全不知道自己的执行团队成员以及他们的社交个人资料是否是下一个目标。


    我通过邮件和群信息发出警报，指示执行团队立即在所有社交网络网站上开启多重身份验证（关于多重身份验证，稍后介绍）。


    我听从了自己的建议，尽可能在我的个人页面上开启了安全功能，直到我遇到了一个非常流行的社交平台。我不确定我的身体是处于完全的“战斗或逃跑”反应（身体血液流向主要肌肉以帮助逃避威胁或准备战斗——换句话说，*不是*前额叶皮层控制），还是该社交媒体平台在隐藏安全功能方面做得不好。可能两者兼有吧。无论如何，恐慌吞噬了我，我采取了绝望的措施：我完全删除了我在该平台上的个人资料以及所有的历史。


    一个小时变成了两小时，接着是三小时，然后是四小时。我定期向 CEO 汇报必要的恼人的状态更新，关于我们日益丢脸的被破坏的公司页面。电话内容如下：


    *   “克里斯，我们仍在与其协作。他们还没有完成安全审查。我们希望在 30 分钟内解决。”


    清洗、冲洗、重复——每 30 分钟一次。


    就在在这些电话之一，我们的 CEO 施了妙计：


    *   “艾莉森，我认识公司里的一个人，我不想再等他们采取行动了。我去给他打电话。”

    *   “太棒了，克里斯。我们会向亚太团队施压。”


    克里斯建立了联系并申诉了我们的诉求。在电话后的 30 分钟内，页面恢复了原始状态。我不知道克里斯的电话是否起到了作用，还是调查仅仅是走完了流程并结束了。我只知道局面现在被控制住了。


    周一早上，我们在公司内网发布了一篇文章，让每位员工都知道周末发生了什么。记得我提到的 McAfee 价值观之一——实践包容性的坦诚与透明吗？我们有义务向员工解释发生了什么，特别是考虑到他们的社交媒体页面在那些紧张的几个小时内被破坏了。在处理不安的话题时，坦诚和透明是很困难的。但要真正践行价值观，这也是必要的。'
- fmt: '

    I tell you this story not just because it’s interesting, and not just so you feel
    “Hey, better her than me!” I began with this story because it’s a microcosm of
    what we’re going to be talking about for the rest of the book.


    Just so you get your money’s worth from this book—in the very first chapter—I’ll
    now break down how the hack happened, and what we did afterward. Most importantly
    I will lay out the steps that you can take *tomorrow morning* at work to see that
    this does not happen to you.


    ## Lessons Learned the Hard Way


    When we regained control of the account, we asked the social media company to
    tell us whose admin account in our dashboard had been responsible for the changes.


    Turns out it was an employee with one of our media placement agencies, who was
    no longer doing work for us—let’s call her Julie. Her credentials were stolen
    by a teenager connected to a larger cybercrime syndicate. Julie made the mistake
    so many others make: She didn’t practice good password hygiene. She used the same
    password to access multiple accounts, including her profile on this social media
    platform. And, since she was an authorized administrator for McAfee’s corporate
    page on the same site, her personal credentials gave her access to not only her
    profile, but ours as well. When one of her accounts was compromised and her credentials
    traded on the Dark Web, hackers simply tried the password across her other online
    accounts. That’s when they struck pay dirt in breaking Julie’s administrative
    access to McAfee’s company profile on the social media platform. The rest was
    child’s play.


    Hindsight is 20/20 and this case was no exception. Vulnerability number one: `Julie
    used the same password for access` to her social media account (and our corporate
    page on the same social media platform as one of our authorized administrators)
    as she used for other accounts. If she had used unique passwords, then the credentials
    that bad actors bought on the Dark Web would have been worthless. What’s worse?
    When alerted to the hack on her personal account, Julie quickly changed her password.
    But she failed to change it across her other accounts, including the one in this
    story. That’s on her.


    Vulnerability number two: `We should have required multifactor authentication
    for all admins` on that social media site. What this means is you can gain access
    to a system not only if you have the correct password, but you must also be able
    to enter a one-time code that’s generated and sent to, say, your phone. If you
    don’t have the code within a few seconds or minutes of being asked for it, you’re
    not getting in. There are several versions of this type of authentication and
    I’m simplifying it here, but you get the idea. That’s on us.


    Vulnerability number three: `We did not do a review frequently enough to see who
    no longer needed access` to our account. Julie helped us a while ago, but we should
    have removed her from being an admin after her activity had ended. We still could
    have been hacked while she was actively working with us, but our lack of access
    hygiene just made it worse. That’s definitely on us.


    All of these actions would have vastly reduced the chances of the hack occurring.
    But let’s say for some crazy reason a hacker with enough motivation, skill, and
    luck was able to get into our social media account. Let’s look at what could have
    helped us after a hack was discovered, had we put certain things into place beforehand.


    We should have had a `procedure where we lock out all admins without letting on
    that we are aware of the attack`. By our deleting the nonsense posts, we alerted
    the hacker. Then when the hacker saw we were deleting permissions, he acted more
    quickly than we did.


    It was fortunate that Gavin was on the defaced page on Easter Sunday. Otherwise
    we may not have known as quickly about the defacement. Now we have a tool that
    uses machine learning to detect unusual images, profanity, slurs, and other anomalous
    material on social media sites. It *immediately alerts* several members of our
    team in the event it detects such unusual activity.


    *Note:* I’m not going to name the tools we use for two reasons: First, tools come
    and go, and they also tend to have different effectiveness at different times.
    In other words, when a tool is first launched, it may be highly effective—until
    hackers figure a way around it. Because I don’t know when you’re reading this
    book, I don’t want to praise something that I may no longer be using when you’re
    actually reading these words.


    The second reason for not mentioning the tool is McAfee already is a huge bullseye
    for hackers around the world. By keeping them guessing what exact tools we use,
    we help to lessen that threat. If you search for some of the descriptions I use
    for tools, you’ll quickly find current ones you can try.


    Back to the story of lessons we learned:


    At the time we alerted the social media company of the hack, we did not know their
    procedures for dealing with it. Mistake. We found out only then that their policy
    was to freeze the account for many hours, regardless of how defaced our page was.
    `We now ask about these procedures in advance` of creating corporate pages on
    other sites.


    We learned the hard way that money talks. Because we were spending a decent amount
    of money on advertising on this social media site via agencies, we looked like
    a smaller account to the company than we were; that might have affected response
    levels. Today, `we spend directly with social media platforms` to accurately reflect
    our investment and receive the commensurate service levels we deserve.


    And, we learned that `third-party companies with which we do business may not
    have strong security` practices. This is especially important to remember for
    companies that have access to your systems or appear as an extension of your organization.
    In particular, smaller third-party companies with which you have a relationship
    may not have formal IT and security teams, let alone practice rigorous cybersecurity
    hygiene.


    Finally, the postmortem of that Easter’s unfortunate events delivered one final
    punch in the gut. McAfee wasn’t even a deliberate target in the hack. The hacker
    didn’t realize Julie was an administrator for McAfee when he broke her credentials.
    He didn’t know (or care) who Julie was. He was on the hunt for passwords. His
    reward would come only after he determined what the password unlocked—be it a
    personal banking account, a company’s network, or something else. Once he found
    one that just so happened to unlock the keys to McAfee’s company page on that
    social network, he unleashed his rants of abuse on it, offending everyone he could
    and humiliating us in the process. *Even for hackers, sometimes it’s better to
    be lucky than good.*


    ## Additional Lessons for You


    **Have lists of people you can call and people to whom you can escalate.** Have
    them where you and your team can access them anytime. Also, the lists must not
    only be for people on your team but also for people at the vendors for your website,
    social media, cloud storage, etc.


    **It needs to be in someone’s job description to regularly review who has access**
    to an account and clean up the list to remove people who no longer work on those
    projects.


    **Use multifactor authentication.** For some systems we can automatically detect
    if one of our users has it turned on, and the system will tell us if a user turns
    it off, even for a few minutes as she switches to a new computer, for example.
    With systems over which we have less direct control, like a cloud-based service,
    we require that users send us screenshots of the multifactor authentication being
    enabled.


    You can imagine that we scrutinize social media outlets now before we put a page
    up. In addition to the measures I described above, we ask the following:


    * How do you handle any personally identifiable information?

