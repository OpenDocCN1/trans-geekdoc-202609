  trans: "\n\n- 数据在节点、模块、实例或虚拟服务器之间移动时是否进行了加密？如果没有，是否有提供添加此功能的选项？请描述所使用的加密方法。\n- 数据在静态存储时（例如存储在数据库中、存储在备份磁带上等）是否进行了加密？如果没有，是否有提供添加此功能的选项？请描述所使用的加密方法。\n\
    - 评估其如何对员工进行网络安全意识和卫生协议的培训。\n    - 贵组织是否拥有安全意识和培训计划？\n    - 组织是否确保人员每年接受组织安全政策的培训，并要求其了解这些政策的变更或更新？\n\
    \    - 组织是否确保所有访问机密数据的人员都接受了相应岗位的信息安全培训？\n    - 组织是否确保所有访问个人身份信息 (PII) 的人员都完成了隐私培训课程，并了解所处理数据的任何特定隐私要求？\n\
    - 对于您最具战略意义的供应商，考虑每年聘请第三方对其安全实践进行一次审计。\n- 如果您稍微担心某位寻求与贵公司建立合作关系的第三方不符合您要求的网络安全标准，请不要让他们进行此类推介。\n\
    \n## 网络安全专业人士的 W.I.S.D.O.M.\n\n- 良好的网络安全卫生是不可妥协的。保持补丁更新——涵盖物理和虚拟基础设施。审查内部通信计划，以通知管理员漏洞情况，包括定期审查分发列表以确认其准确性。安装闲置软件（shelfware）。确保安全防御配置妥。备份您的数据（并测试备份系统）。定期进行渗透测试，并向执行官和董事会成员定期提供进展报告。\n\
    - CISO 和 CIO 必须在指标和目标上达成共识。在每个规划周期的开始时，为良好的网络安全卫生建立角色和职责，包括补丁、备份、多因素认证等。\n- 识别并分配预算中哪些部分用于\
    \ IT，哪些用于网络安全。约定关键性能指标 (KPI) 和服务水平协议 (SAs)，以便优先安排工作并在发生争议时解决冲突。\n- 投资于能够提升贵公司业务价值并降低对手价值的技术。\n\
    \    - 云访问安全经纪器 (CASB) 技术有助于保护已授权和未授权的云服务。\n    - 欺骗技术可以分散并迷惑对手。\n- 使用人工智能 (AI)\
    \ 能力识别最先进的威胁并解决人才短缺，但要了解其局限性。AI 会产生更多的误报。传统的威胁情报有更多的漏报。两者结合可以产生更高的效率和更低的误报率。\n\
    - 在公司内部竖起网络安全的旗帜。\n    - 通过使用董事会及其高管的语言（风险管理）进行纵向传播。与财务部门合作，将网络安全术语转化为董事会最理解和重视的指标与结果。\n\
    \    - 通过文化意识活动进行水平传播。聘请沟通专家与人力资源部门和市场营销部合作，开发有效的活动，让网络安全成为每个人日常工作的一部分。向职能部门同事提供可操作的评分卡，衡量员工对网络安全原则的理解以及对公司政策的遵守情况。\n\
    \n## 注释\n\n1. ^(1) D. Frances，“Ready for the Big One,” *Sonoma Index Tribune*,\
    \ 2014 年 1 月 30 日。\n2. ^(2) `https://www.usgs.gov/faqs/can-predict-earthquakes`,\
    \ 访问于 2019 年 3 月 20 日。\n3. ^(3) “Ready for the Big One,” *Sonoma Index Tribune*,\
    \ 1989 年 11 月 23 日，周四。\n\n"
