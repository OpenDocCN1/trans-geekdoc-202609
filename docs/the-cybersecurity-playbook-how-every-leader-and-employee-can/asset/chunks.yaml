    9. Verizon，“2018 年数据泄露调查报告，”[`enterprise.verizon.com/resources/reports/DBIR_2018_Report_execsummary.pdf`](https://enterprise.verizon.com/resources/reports/DBIR_2018_Report_execsummary.pdf)。


    # 第 6 章：幸运青睐有有准备的人


    > 我们有一套团队流程，一旦发生网络攻击就会触发。因此，在完全确定发生了什么、源自何处以及我们计划如何处理之前，我们不会直接让媒体知情。我们还没有进展到那一步。这完全取决于数据流的情况以及问题的严重程度。

    > 某酒店业公司首席营销与销售官


    我一个朋友的朋友认识一个在拉斯维加斯出差的人。某天晚上，他去一家酒吧，和一位友好的陌生人喝了几杯酒。第二天早上，他醒来时感到腰部剧痛，正浸在冰水的浴缸里。他注意到浴缸旁边有一个手机，上面有一张字条，大意是：“拨打
    911。你的肾脏被手术切除了。”他活了下来并讲述了这段经历，但因此少了一个肾脏。要小心——有一个地下市场正专门从毫无防备的商务旅客和游客身上摘取器官。


    我打赌你一定从朋友的朋友那里听过类似的故事。但也许那个受害者并不在拉斯维加斯。他可能在欧洲。或者南美。谁知道偷窃器官的地下市场竟然如此巨大？


    当然，事实并非如此。这个城市传说起源于 20 世纪 90 年代后期，虽然我们现在对它的荒谬之处付之大笑，但我记得第一次听到这个恐怖故事时，脊背发凉（凉意直达肾脏！）。我并不是唯一一个中上当的人。


    1997 年 1 月 30 日，在接到了大量警惕旅行者的电话后（这些旅行者正在重新考虑他们在马尔桂节（Mardi Gras）狂欢的计划）——新奥尔良警方局发布了以下声明：


    > 在过去的六个月里，新奥尔良警方局收到了来自全美企业和组织的大量咨询，警告旅行者，新奥尔良有一个组织严密的犯罪团在活动。这些信息指称，该犯罪团在旅行者被提供酒精直至昏迷后，窃取他们的肾脏。


    > 在对这些指控进行调查后，新奥尔良警方局发现这些指控完全毫无根据，没有任何事实。通过互联网传播的警告是**虚构的**，并且可能违反了有关发布错误和误导性信息的刑事法律规定。


    我对城市传说深着迷。作为一名营销人员，我扮演的身份之一是讲故事的人。城市传说的独特之处在于它们传播极快。事实证明，其中最传奇的故事具有某些共同特征。


    它们往往带有道德寓意，例如，“小心那些在酒吧里向你提供酒精的易接近陌生人。”它们利用了当下的社会恐惧。而且它们通常以“朋友的朋友”的形式出现。换句话说，追踪这些信息的源头或真实性是不可能的，导致人们在故事传播过程中不断脑补细节。


    成功的城市传说与登上头条新闻的泄露事件，两者之间的相似性令我深受触。像城市传说一样，公共数据泄露的新闻往往传播得很快。泄露事件的细节（例如是如何发生的以及谁应该承担责任）通常来得很慢，导致个人用自己的假设来填补故事的空白，就像“朋友的朋友”对待民间传说做的那样。


    泄露事件和城市传说还有一个共同点：它们都触及了一种强大的情感——恐惧。为什么恐惧如此强大？因为它深根于我们的生存本能。恐惧和愤怒被称为“热”情绪，是我们能强烈感受到的两种情绪。数千年来，我们的身体已经过了程序，在这些情感弦律被触发时能够迅速做出反应以保护生存。相比之下，感受“冷”情绪（如快乐和爱）需要更长的时间，因为我们的即时生存并不取决于这些情绪的强烈程度。


    事实上，城市传说与泄露事件之间唯一的显著区别是后者是真实的。对于营销和传播专业人员来说，在整个过程中保持透明和真实，同时重新获得公司叙事的控制权，这是一个极其艰巨的挑战。公关战场上充满了公司在泄露后沟通宣传中失误的反面案例，比正面案例多得多。


    作为品牌声誉的最终守护者，我的营销和传播同事们必须在下一次泄露发生时准备好应对——并且迅速反应。


    ## 泄露！


    2014 年，当弗兰克·布莱克（Frank Blake）宣布他将辞任家得宝（The Home Depot）首席执行官时，他留下的是七年来强劲业务表现和同情领导力的传奇。像许多
    CEO 一样，布莱克在任期内也面临许多挑战。当他 2007 年首次执掌大权时，迫在眉睫的住房危机刚刚开始萌芽。除了股价之外，由于一种自上而下、令员工感到反感的管理风格，士气也有所下降。


    布莱克开始专注于基础工作。他暂停了开设新店的计划，转而开始建立履约中心，将货物运得更靠近现有门店。他专注于盈利能力和商品组合。他关闭了无亏损的部门和市场。


    与此同时，他为这家巨型零售商的文化带回了南方魅力。在某个典型的周日，布莱克会亲手给员工写下数百封个性化的感谢信——这是他在担任当时的副总法律顾问、效从乔治·H·W·布什（George
    H. W. Bush，后来的美国总统）时学到的礼仪。


    几年坚定的专注让家得宝转危为安。在布莱克的任期内，股价从他 2007 年上任到 2014 年 8 月宣布辞职期间翻了一番倍。


    因此，在任期的最后几个月，布莱克在劳动节假期度过了应得的休息——距离他宣布辞去 CEO 职位仅过了 12 天。作为一名典型的工作狂魔，布莱克在那个周日还在写他的感谢信。正如他所说的：“你衡量什么，就得到什么；庆祝什么。”


    庆祝并没有持续多久。第二天一早，布莱克接到了公司总法律顾问的电话。他们的计算机系统似乎被入侵了。虽然布莱克还没有所有的细节，但他的公司财务状况和声誉正面临风险。在任职的几个月里，布莱克正面临着一场不仅危及他公司，还威胁到这位
    CEO 完美无缺记录的危机。


