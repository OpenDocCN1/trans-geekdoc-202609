    This is where another cybersecurity term that has made its way into the lexicon—a
    botnet—comes into play. In laymen’s terms, a botnet is comprised of a network
    of devices enslaved by a hacker. The zombie army that results is under the command
    and control of one or more bad actors, who commandeer the drones to do any number
    of actions, including launching a distributed denial of service attack by flooding
    a website with requests. How do these botnets come under the control of their
    evil overlords? It happens through malicious software deposited on computers when
    users visit an infected site or download a contaminated message. In many cases,
    users are unaware their device has even been seized.


    You might wonder how exactly the DDoS attack on `Dyn` was so different. The botnet
    employed was not an army of computers, or even mobile devices, which as you might
    expect are common soldiers for a hacker’s zombie legion. Instead, cybercriminals
    compromised ordinary connected household devices. Baby monitors, security cameras,
    and digital video recorders (`DVR`) were among the recruits in the botnet that
    took down `Dyn`. Hackers exploited weak factory-default passwords in these connected
    devices to seize control. No user had to first unknowingly download malicious
    software. In this case, consumers did nothing to compromise their own devices.
    As it turns out, nothing is exactly what fit the bill, since users also didn’t
    think to change their devices’ default passwords, assuming the average user would
    know how to do so in the first place.


    Within a moment of the `Dyn` network’s collapse, the Internet of Things (`IoT`)
    became the Internet of Terrorism. And, lest you believe that the `Dyn` attack
    was a fluke, contemplate one more frightening reality: The botnet that disabled
    `Dyn` was actively recruiting enrollees for its next attack several months *after*
    the incident. In an always-on world, hackers have billions of connected devices
    at their mercy, simply awaiting their next command from their new leader.


    The `Dyn` DDoS attack opened our eyes to a new reality: *The targets have become
    the weapons.* What we used to protect, we must now be protected against. Just
    as data can be manipulated to deceive us, those harmless connected devices that
    make our lives convenient in so many ways at home and work can be turned against
    us to cripple the digital infrastructure upon which we (and they) rely. Cyber
    threats are now so pervasive that they lurk around every connected device, every
    bit of data we take for granted.


    The `Dyn` attack proved that innovative hackers can exploit any connected product
    or service in their next attack. When cybercriminals slithered in through ordinary
    household appliances, cybersecurity slipped into the mainstream of product development.


    Take connected cars, as just one example. In 2017, `Toyota`, `Intel`, and others
    formed the Automotive Edge Computing Consortium. The group estimated that the
    data volume between vehicles and the cloud will reach 10 exabytes per month around
    2025—a projected 10,000-fold increase from 2017’s baseline. That’s the equivalent
    to *twice* the volume of all words ever spoken by humans since the dawn of time.^([4](#c04.xhtml#c4-note-0004))


    Weaponizing the `IoT` to take down the Internet is one thing. Weaponizing the
    eight million autonomous cars expected to be on roads by 2025^([5](#c04.xhtml#c4-note-0005))
    makes the Internet of Terrorism that much scarier. Those connected vehicles will
    depend on accurate, real-time data flowing between vehicles and the cloud.


    ## W.I.S.D.O.M. for the Product Developer


    Product developers are the first line of defense in embedding cybersecurity in
    the product. There’s no need to reinvent the wheel on sound product development
    principles and checklists (of which there is no shortage in the market).


    First, in the initial phases of design, customer input is imperative. Many companies
    actively solicit this feedback from customers through quantitative research, one-on-one
    interviews, customer advisory councils, and/or other methods. A simple, but profound,
    way to ensure cybersecurity is not an aftermarket afterthought is to ask customers
    about their cybersecurity requirements as part of this phase.


    Let’s say you’re in the business of manufacturing a `fill-in-the-blank` connected
    device (like the kind used in the drone army to take down `Dyn`). Discovering
    when consumers would be more likely to take action in changing a factory-default
    password would be an important element in the design phase. Better yet, eliminating
    procrastination from the consumer during this phase by, say, requiring a password
    change through an intuitive application when the connected device is installed
    removes a key security vulnerability right out of the box.

    '
