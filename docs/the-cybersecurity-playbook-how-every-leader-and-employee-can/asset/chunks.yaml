    Certainly, a cyberattack on the firm poses risk, sometimes significant. But notice
    that CISOs must make at least two connections to translate their language into
    that of the board. First, they must string the beads from risk to strategy. A
    risk out of context of strategic importance, value creation, or corporate measurements
    is the equivalent of giving the board a pie chart of your results—it only shows
    one small sliver of the total picture.


    Second, CISOs must translate the threat into risk. This requires understanding
    the board’s risk tolerance for high-priority assets, how a potential attack challenges
    this tolerance, and the consequences (financial or otherwise) that may result.


    If this seems like a high bar, it is. Stanford reports that most companies do
    not integrate risk management and strategy. Further, 50 percent have no enterprise
    risk management in place. The good news for CISOs? You’ll be a pleasant exception
    to these rules when you effectively communicate the company’s cybersecurity posture
    in your board’s language.


    CISOs deserve access to the boardroom, as I argued in Chapter 2. But once a CISO
    gains entry, the way he crafts and delivers his message will likely determine
    whether he is invited to the party again. Learn the language and the style of
    the boardroom to avoid being cast aside, along with those one-dimensional pie
    charts.


    ## Letting Go to Hold On


    In 2014, enterprises were losing control. They were being engulfed by an all-out
    crusade; IT departments consumed by its fury; Security caught in its crosshairs.
    At the heart of the frenzy? Well-intentioned employees were requiring the same
    access to always-on, on-demand technologies in the workplace as they had come
    to expect at home. By 2014, the verdict was in. The “consumerization of IT” trend
    was anything but. It was here to stay.


    That same year, IDG Enterprise researched the effect of the phenomenon on organizations.
    At the time, 40 percent of companies predicted the obsession for consumerized
    technology in the workplace would inflict negative security outcomes. Their concerns
    were valid. Consider this slippery slope: 90 percent of organizations in 2014
    reported that employees were using consumer or individual services at work— 41
    percent without IT’s approval.


    Not surprisingly, the organizations in question were committed to action. Over
    half created policies for accessing and sharing corporate data on mobile devices
    and/or through cloud-based services. Roughly one-third had invested in a secure
    service for file sharing. Still others had implemented a sanctioned enterprise
    collaboration tool.


    Fast-forward a few years to McAfee’s 2019 Cloud Adoption and Risk Report. Rather
    than ask respondents for their opinions or plans for cloud consumption (cloud
    is a huge component of the consumerization of IT trend), McAfee checks how many
    files are actually secure in the cloud. (We do this by looking at the enterprise
    policy set on each file. For example, the enterprise determines the sensitivity
    of the file and we use anonymized, aggregated data to determine whether usage
    matches policy.)


    The results suggest the runaway train of consumerized IT jumped its track a while
    back:


    *   21 percent of all files in the cloud contain sensitive data. That figure is
    on the rise—up 17 percent over the past two years.

    *   The amount of files with sensitive data shared in the cloud has also increased—53
    percent in just one year.

    *   92 percent of all organizations have stolen cloud credentials for sale on
    the Dark Web.


    In addition to the exploding consumerization of IT movement happening in 2014,
    there was another race afoot. Developers were using public cloud environments
    more and more to create applications for their companies.


    This is where securing the cloud became even trickier. As CISOs know, their organizations
    bear more risk as they move from software-as-a-service (SaaS) to platform-as-a-service
    (PaaS) to infrastructure-as-a-service (IaaS) cloud varieties. While the protection
    of data is consistent across all three, CISOs assume greater responsibility for
    securing the underlying infrastructure components of the cloud as their companies
    move from one to the next.


    For instance, the same 2019 McAfee cloud report reveals that the average enterprise
    has 14 IaaS or PaaS misconfigurations currently running. What kind of misconfiguration?
    The kind that leaves the public cloud infrastructure—the same that must be protected
    to secure the enterprise’s data—open for access.


    To be clear, these security vulnerabilities are not laid at the feet of the public
    cloud providers in question. They are the fault of the companies using these services
    without understanding how to secure them properly. And that buck ultimately stops
    at the CISO.


    Organizations battened down the hatches when confronted with the reality of the
    consumerization of IT. There’s no way to know whether, in doing so, they unintentionally
    fueled its fire or they were simply outmatched by the genie they attempted to
    put back in the bottle. Said another way, did employees simply bypass the policies
    that frustrated their productivity? Or did the policies help curtail bad behavior
    only to be outstripped by cloud growth on the other side? While the answer is
    likely a bit of both, our McAfee research suggests organizations are losing more
    control of securing their data stored in the cloud than what we saw just a couple
    of years ago.


    I’ve given each organizational stakeholder prescriptive advice for how she can
    play her part in bolstering her company’s overall security. But you won’t find
    me advising employees to stop using the popular cloud-based services they’ve come
    to love. That’s because I know that such advice will fall on deaf ears. Until
    enterprise IT services catch up to providing the experience of alternatives available
    to Joe Q. Public, employees will continue consuming the latter. Evidence that
    “shadow IT” can cast a long shadow.


    ## Assuming the Mantle


    A few months ago, there was quite a buzz at my office. Someone had posted flyers
    throughout with the following message, “We’re going to need a bigger boat.” Jaws
    enthusiasts immediately spotted the reference to the famous line from the movie.
    But other than that, any explanation as to what it could mean for land-dwelling
    McAfee employees was nonexistent. The rumor mill swirled with wild speculation.
    Were we relocating to a bigger office? Were we merging with or acquiring a company?
    Was the parking lot expanding? (Yes, parking at the office can be challenging
    at times.)


    Imagine our surprise when we discovered the culprits behind the message—none other
    than our CISO organization. The teaser campaign kicked off a companywide initiative
    to refresh cybersecurity awareness at McAfee. Specifically, the “bigger boat”
    reference was a play on words to phishing (clever!). As the CISO organization
    sent phishing emails to employees, some took the bait. When they did, they were
    alerted to the error and encouraged to report all suspicious emails to the security
    team (through a convenient “report phishing” plug-in to our email application
    that also coincided with the launch of the campaign).


    Our CISO went even further. Each member of the executive team received monthly
    reports on his team’s performance. What percentage of his team took the phish?
    Of those who didn’t, what percentage went the proactive extra mile and reported
    the suspiciously planted email to the security team?

