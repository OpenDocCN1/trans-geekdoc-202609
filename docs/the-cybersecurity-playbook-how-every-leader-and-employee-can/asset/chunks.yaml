- fmt: "\n- Do not fall for social engineering campaigns. Be on the lookout for telltale\
    \ signs of a malicious email, such as a sender’s email address. Don’t click on\
    \ a link from an unknown source.\n- Be proactive and report any suspicious emails\
    \ to your cybersecurity team immediately.\n- Ensure security patches on laptops,\
    \ mobile devices, and other personal technologies remain current. Don’t delay\
    \ a security update when it is pushed by your security organization.\n- Practice\
    \ strong cybersecurity hygiene—use strong passwords, don’t reuse passwords, and\
    \ avoid unencrypted USB devices.\n\n## W.I.S.D.O.M. for the Product Developer\n\
    \n- Ask customers about their cybersecurity requirements as part of the discovery\
    \ phase.\n- Make security part of any minimum viable product requirements.\n-\
    \ Define your data requirements clearly and consciously in the design of any new\
    \ product or service.\n- Build security ownership into each phase of the product\
    \ lifecycle.\n- Stop the line should security be lacking or missing at any point\
    \ of the product launch process. Reward and publicly recognize other employees\
    \ across the company for doing the same.\n\n## W.I.S.D.O.M. for the HR Professional\n\
    \n- Expand the aperture for cybersecurity talent—men and women, minorities and\
    \ non-minorities, arts and sciences (STEAM). Review current cybersecurity job\
    \ postings to look for diverse skills. Look for interview questions that contain\
    \ unconscious bias, including popular varieties like, “Tell me about a time when\
    \ . . .” or “Tell me about the latest hot innovation in cybersecurity.” Place\
    \ at least one diverse leader on each interview panel.\n- Search your company\
    \ values and see where you can add the word `securely` (or its derivative) to\
    \ change their scope without altering their purpose.\n- Reward and recognize behaviors\
    \ that bolster your company’s cybersecurity defense.\n- Work with your `CISO`\
    \ to identify and control access privileges for your organization’s most valuable\
    \ assets. Find a confidential, nonthreatening way for conscientious employees\
    \ to blow a whistle or raise a flag when they see something resembling a malicious\
    \ insider threat. When they do, reward them appropriately.\n- Ensure every member\
    \ of the executive team has at least one cybersecurity key performance indicator\
    \ (`KPI`).\n\n## W.I.S.D.O.M. for the Marketer/Communicator\n\n- Build a multifaceted\
    \ communications plan with explicit executive buy-in. The plan should include\
    \ answers to the following questions:\n    - Even if the law didn’t require it,\
    \ would you notify?\n    - What if your company wasn’t responsible for the attack?\
    \ How would that change the tone of your message? (Consider breach-by-association\
    \ and data weaponization use cases as examples.)\n    - When would you notify?\n\
    \    - Whom would you notify?\n    - What would you say if you didn’t have all\
    \ information right away?\n    - What would you be willing to offer customers\
    \ as compensation or as a show of victim-centered empathy (such as free identity\
    \ protection or offering to cover customer losses from a credit card breach, for\
    \ example)?\n- Create the communications templates for each scenario identified\
    \ in your plan. Leave placeholders to answer the following questions in your templates:\n\
    \    - Who was impacted?\n    - What data and/or systems were lost, stolen, and/or\
    \ otherwise compromised?\n    - Over what period did the breach occur?\n    -\
    \ What precautionary action do stakeholders need to take?\n- What precautionary\
    \ action do stakeholders need to take?\n- What precautionary action do stakeholders\
    \ need to take?\n- Once.\n- Practice a drill at least a year.\n\n## W.I.S.D.O.M.\
    \ for the Finance Professional\n\nWork with your `CISO` to identify and control\
    \ access privileges for your organization’s most valuable assets. Find a confidential,\
    \ nonthreatening way for conscientious employees to blow a whistle or raise a\
    \ flag when they see something resembling a malicious insider threat. When they\
    \ do, reward them appropriately.\n- Ensure every member of the executive team\
    \ has at least one cybersecurity key performance indicator (`KPI`).\n"
  raw: "*   Do not fall for social engineering campaigns. Be on the lookout for telltale\
    \ signs of a malicious email, such as a sender’s email address. Don’t click on\
    \ a link from an unknown source.\n\n*   Be proactive and report any suspicious\
    \ emails to your cybersecurity team immediately.\n\n*   Ensure security patches\
    \ on laptops, mobile devices, and other personal technologies remain current.\
    \ Don’t delay a security update when it is pushed by your security organization.\n\
    \n*   Practice strong cybersecurity hygiene—use strong passwords, don’t reuse\
    \ passwords, and avoid unencrypted USB devices.\n\n## W.I.S.D.O.M. for the Product\
    \ Developer\n\n*   Ask customers about their cybersecurity requirements as part\
    \ of the discovery phase.\n\n*   Make security part of any minimum viable product\
    \ requirements.\n\n*   Define your data requirements clearly and consciously in\
    \ the design of any new product or service.\n\n*   Build security ownership into\
    \ each phase of the product lifecycle.\n\n*   Stop the line should security be\
    \ lacking or missing at any point of the product launch process. Reward and publicly\
    \ recognize other employees across the company for doing the same.\n\n## W.I.S.D.O.M.\
    \ for the HR Professional\n\n*   Expand the aperture for cybersecurity talent—men\
    \ and women, minorities and non-minorities, arts and sciences (STEAM). Review\
    \ current cybersecurity job postings to look for diverse skills. Look for interview\
    \ questions that contain unconscious bias, including popular varieties like, “Tell\
    \ me about a time when . . .” or “Tell me about the latest hot innovation in cybersecurity.”\
    \ Place at least one diverse leader on each interview panel.\n\n*   Search your\
    \ company values and see where you can add the word *securely* (or its derivative)\
    \ to change their scope without altering their purpose.\n\n*   Reward and recognize\
    \ behaviors that bolster your company’s cybersecurity defense.\n\n*   Work with\
    \ your CISO to identify and control access privileges for your organization’s\
    \ most valuable assets. Find a confidential, nonthreatening way for conscientious\
    \ employees to blow a whistle or raise a flag when they see something resembling\
    \ a malicious insider threat. When they do, reward them appropriately.\n\n*  \
    \ Ensure every member of the executive team has at least one cybersecurity key\
    \ performance indicator (KPI).\n\n## W.I.S.D.O.M. for the Marketer/Communicator\n\
    \n*   Build a multifaceted communications plan with explicit executive buy-in.\
    \ The plan should include answers to the following questions: \n\n    *   Even\
    \ if the law didn’t require it, would you notify?\n\n    *   What if your company\
    \ wasn’t responsible for the attack? How would that change the tone of your message?\
    \ (Consider breach-by-association and data weaponization use cases as examples.)\n\
    \n    *   When would you notify?\n\n    *   Whom would you notify?\n\n    *  \
    \ What would you say if you didn’t have all information right away?\n\n    * \
    \  What would you be willing to offer customers as compensation or as a show of\
    \ victim-centered empathy (such as free identity protection or offering to cover\
    \ customer losses from a credit card breach, for example)?\n\n*   Create the communications\
    \ templates for each scenario identified in your plan. Leave placeholders to answer\
    \ the following questions in your templates: \n\n    *   Who was impacted?\n\n\
    \    *   What data and/or systems were lost, stolen, and/or otherwise compromised?\n\
    \n    *   Over what period did the breach occur?\n\n    *   What precautionary\
    \ action do stakeholders need to take?\n\n    *   What actions is your company\
    \ taking to correct the problem and mitigate the risk of it happening again?\n\
    \n*   Design the tick-tock schedule for every attack scenario.\n\n*   Be sure\
    \ your plan includes employees, whether employee records are breached or not.\n\
    \n*   Practice a communications drill of your plan at least once a year.\n\n##\
    \ W.I.S.D.O.M. for the Finance Professional\n\n*   Help CISOs and their teams\
    \ speak the language of the business—risk management—by asking questions like:\
    \ \n\n    *   What asset(s) are at risk?\n\n    *   What is the strategic value\
    \ of the asset(s)?\n\n    *   What is the current level of vulnerability for the\
    \ asset(s)?\n\n    *   What are the consequences (financial damages, intellectual\
    \ property exposure, reputational risk) in the event of a breach?\n\n*   To ensure\
    \ cybersecurity is not an aftermarket afterthought, CFOs should ask the following\
    \ for business cases submitted by other leaders: \n\n    *   How does the new\
    \ \\[market, internal technology, customer product, etc.\\] change the attack\
    \ surface for the company?\n\n    *   How does it alter the risk profile of the\
    \ company’s most strategic assets?\n\n    *   \\[Assuming risk is increased\\\
    ] What additional investment is required (one-time and recurring) to bring the\
    \ risk profile to its acceptable baseline? Is this investment included in the\
    \ ROI analysis?\n\n*   Mitigate risk as efficiently as possible by asking CISOs\
    \ questions like: \n\n    *   How much investment in cybersecurity has been made\
    \ in products still sitting on the shelf (shelfware)?\n\n    *   What is the plan\
    \ for deploying those products?\n\n    *   When was the last audit performed to\
    \ ensure security products are configured properly? What were the results?\n\n\
    \    *   When was the last penetration testing performed? What were the results?\
    \ (Penetration testing was covered in Chapter 2 and refers to testing the effectiveness\
    \ of an organization’s cybersecurity posture, typically by paying third parties\
    \ to attempt to breach the company’s defenses.)\n\n    *   When was the last cybersecurity\
    \ training conducted for all employees? What were the results?\n\n*   Mitigate\
    \ third-party risk by vetting vendors with an assessment of their security posture,\
    \ including: \n\n    *   Looking at how the third party assesses and updates access\
    \ rights and privileges. \n\n        *   Do you review user access rights at regular\
    \ intervals to ensure that access rights are based on least privilege job requirements\
    \ for their job role?\n\n        *   Is timely deprovisioning, revocation, or\
    \ modification of user access to the organization’s systems, information assets,\
    \ and data implemented upon any change in status of employees, contractors, customers,\
    \ business partners, or involved third parties?\n\n    *   Understanding their\
    \ business continuity process and how often they test it. \n\n        *   Do you\
    \ have Business Continuity and Disaster Recovery Plans for planned and unplanned\
    \ outages and do you test the plans at least annually? If yes, please describe\
    \ the types of tests performed.\n\n        *   Do you record backups with regularity\
    \ so that any corruption of data can be recovered with the backup, resulting in\
    \ only an acceptable amount of data loss? Is restoration from those backups tested\
    \ regularly?\n\n    *   Searching their change control guidelines for new users\
    \ and/or new software for their systems. \n\n        *   Have all default usernames\
    \ and passwords been changed on all of your systems?\n\n        *   Do you have\
    \ controls in place to monitor and restrict the installation of unauthorized software\
    \ onto your systems (e.g., uploaded malware, disable autorun, excessive admin\
    \ privileges)?\n\n    *   Clarifying how any data passed between your company\
    \ and theirs will be used, protected, and disposed of at the appropriate time\
    \ (upon contract termination and/or in accordance with compliance standards).\
    \ \n\n        *   Do you have procedures in place to ensure that production data\
    \ shall not be replicated or used in non-production environments?\n\n        *\
    \   Is data destroyed securely from storage when the drives or data are no longer\
    \ needed? Do you destroy non-functional hard disk drives before disposal or warranty\
    \ return?\n\n        *   Do you ensure destruction of all confidential data within\
    \ 30 days of termination of contract?\n\n    *   Knowing how they encrypt data\
    \ at various states (at rest, in use, and in motion). "
