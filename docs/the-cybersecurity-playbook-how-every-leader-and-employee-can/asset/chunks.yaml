  trans: '

    首席信息安全官（CISO）的真实内核并非脆弱的玻璃纸制成。在转型的狂风中，她拥有钢铁般的脊梁；拥有铁腕，以冲破无休止的攻击；；拥有混凝土般的下颌，以承受那些会让其他较弱个体瘫痪的指责。当你最终意识到并欣赏了这位执行管理团队中最受误解成员所具备的毅力和决心时，你才将网络安全带出阴影，连同那些宁愿留在阴影中的对手一起。


    ## 注释


    1. McAfee，“云端采用与风险报告”，2019 年。

    2. 我正在分享许多深耕网络安全挑战和成功企业最佳实践的人士的明智见解。在此过程中，我会分享 McAfee 的专有见解，但我很自豪能向你介绍来自德勤（Deloitte）、安永（EY）、ESG
    等机构日益增多的研究成果和新颖思维。在这场战斗中，你并不孤单。专注于这一领域的精明分析师和顾问人数已经证明了这一点。

    3. 德勤，“2014 年董事会实践报告——来自董事室的视角”，`https://www2.deloitte.com/content/dam/Deloitte/us/Documents/regulatory/us-2014-board-practices-report-final-9274051-12122014.pdf`。

    4. 德勤，“2016 年董事会实践报告——对董事会工作的透明观察”，`https://www2.deloitte.com/content/dam/Deloitte/us/Documents/center-for-board-effectiveness/us-cbe-2016-board-practices-report-a-transparent-look-at-the-work-of-the-board.pdf`。

    5. 同上。

    6. Melanie Turek，“员工表示手机使生产力提高了 34%：福斯特与苏兰研究”，三星洞察，2016 年 8 月 3 日，`https://insights.samsung.com/2016/08/03/employees-say-smartphones-boost-productivity-by-34-percent-frost-sullivan-research/`。

    7. Nir Nissim, Ran Yahalom, 和 Yuval Elovici，“基于 USB 的攻击”，《计算机与安全》，Elsevier，2017
    年 9 月，`https://www.sciencedirect.com/science/article/pii/S0167404817301578`。

    8. Apricorn 新闻稿，“Apricorn USB 数据保护调查：大多数企业 USB 安全已过时且不足；十名员工中有九名使用 USB 设备，但仅有
    20%的人使用了加密”，2017 年 12 月 12 日，`https://markets.businessinsider.com/news/stocks/apricorn-usb-data-protection-survey-majority-of-enterprise-usb-security-is-outdated-inadequate-nine-out-of-10-employees-use-usb-devices-but-only-20-percent-of-them-are-leveraging-encryption-1011079268`。

    9. McAfee，“网络犯罪的经济影响——并未放缓”，`https://www.mcafee.com/enterprise/en-us/assets/executive-summaries/es-economic-impact-cybercrime.pdf`。

    10. Justin Nobel，“历史上唯一已知陨石的真实故事”，《国家地理新闻》，2013 年 2 月 20 日，`https://news.nationalgeographic.com/news/2013/02/130220-russia-meteorite-ann-hodges-space-hit/`。

    11. Cybersecurity Ventures，“2018-2021 年网络安全工作”，2017 年 5 月 31 日，`https://cybersecurityventures.com/jobs/`。

    12. 同上。

    13. Leslie Scism，“保险公司为行业创建消费者评级服务，《华尔街日报》，2019 年 3 月 26 日，`https://www.wsj.com/articles/insurers-creating-a-consumer-ratings-service-for-cybersecurity-industry-1155359200?mod=hp_lista_pos5`。

    14. Jon Olstik 和 Jack Poller，“自动化与分析对阵运营的混乱”，企业策略集团（Enterprise Strategy Group），2017
    年 9 月。

    15. EY，2017–18 年全球信息安全调查，`https://www.ey.com/gl/en/issues/governance-and-reporting/center-for-board-matters/the-cost-of-cybersecurity-on-the-board-agenda-ey`。

    16. 同上。

    17. 德勤，“2016 年董事会实践报告”。

    18. 同上。

    19. Jon Oltsik，“为什么 CISO 频繁换工作？”，CSO，2018 年 1 月 2 日，`https://www.csoonline.com/article/3245170/why-do-cisos-change-jobs-so-frequently.html`。


    # 第 3 章：早上好，这是给你的唤醒时刻


    我说过我从没有在主观的情况下违反过公司的网络安全政策。然而，我觉得整体上更广泛的问题是，对于政策内容是什么，并不总有清晰的沟通。这些问题往往被经理们一笔带过，因为他们自己也并不总是精通所有的规则。我认为这种现象的原因是，大多数人在涉及网络安全和保护公司信息时，并不理解其行为的所有影响。组织中的许多人在尝试安全使用技术方面已经尽了全能。但那是几乎每家公司的
    IT 部门都在进行的一场持久战。


    > 受访者，McAfee 在线民族志研究


    我在对权威保持健康尊重的环境中长大。我的父母比较严格。他们希望我能遵守合理的规则。完成作业。宵禁前回家。打扫房间。尊重长辈。这些都是培养一个负责任且有贡献的社会成员的基础。


    所以，当我在一个周末早晨收到妈妈的一封语音邮件，说有执法人员在找我时，我顾不及去拿手机。


    * “Allie，纳什维尔的一位警长刚打来电话找你。他说由于你缺席了戴维森县（Davidson County）的法庭，对你有一个逮捕令。”


    当我听着妈妈慌忙地给我那个警长的信息时，我的心跳开始加速。


    * “妈妈，这不合逻辑。我我已经没住在纳什维尔 20 年了！我从未被告诉我需要去出庭。”


    * “亲爱的，我告诉他同样的话。我告诉他会让你打给他的。”


    我比我丈夫起得早得多。我打算在他醒来之前快速地处理掉这个电话。


    我拨打了纳什维尔区号 `(615)` 的数字。


    * “我是约翰逊警长。”


