    # CHAPTER 1: The Time I Ruined Easter


    It was Easter, April 16, 2017. I had just finished a homemade dinner with my husband.
    It was time to chill. My cell lit up and I looked down at the display. It was
    a text from Chatelle, our human resources officer (CHRO). Chatelle and I were
    close. We had just spun out from Intel as one of the largest independent cybersecurity
    companies.


    * *You need to check out our social media page. It’s bad.*


    I immediately felt my blood pressure surge as I opened McAfee’s page. I was horrified.
    Someone had deliberately defaced the social profile of our newly minted, 12-day-old
    company with the most offensive language directed at nearly every walk of life.


    ## The Conflict


    The offensive epithets were in stark contradiction to everything our company represented.
    We had just relaunched our brand with a new tagline, “Together is power,” reflecting
    our belief that it takes *all* kinds to protect our world from cyber threats.
    We had just unveiled new values to all employees upon our company’s launch, one
    of which espoused *inclusive* candor and transparency. And we were a leader in
    *cybersecurity.*


    How would customers feel about our ability to safeguard their most precious digital
    assets if we couldn’t even protect our own company’s profile on one of the largest
    social media platforms? And, to top it off, my team—the marketing organization—was
    responsible for managing our company profile across all social channels, including
    the debased one staring me in the face.


    I jumped into action. I had to get to the leader of our digital team to figure
    out what was going on. I reached her immediately and didn’t even have to explain
    that the call wasn’t to wish her a Happy Easter.


    “I know why you’re calling. We’re on it. Our account was hacked. We’re talking
    to the `social media platform company` to get it resolved.”


    I started to think the worst. A hacked social media profile was one thing. What
    if this was a coordinated attack against McAfee with a much bigger prize at stake,
    with hackers diverting our attention to this fire drill while they seeped in through
    our company’s systems?

