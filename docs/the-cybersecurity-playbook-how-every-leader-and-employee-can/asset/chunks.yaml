    最后，在网络安全防御方面，良好的卫生习惯是不可替代的。有时，最有效的措施也是最容易采取的。可能没有比医疗保健行业的案例更能说明这一点了。19 世纪，匈牙利医生伊格纳斯·塞梅尔维维斯（Ignaz
    Semmelweis）试图解开一个谜团。他想知道为什么产房里这么多女性在分娩后死于发热。特别是，他注意到，由全男医生照顾的病房死亡率远高于由全女助产士照顾的病房。在经历了大量实验后，包括改变女性分娩时的姿势，甚至要求牧师在祭奠最近去世的母亲时避开病房内的幸存者（以防这些牧师的存在实际上会让其他母亲受到惊吓，导致致命的发热！），塞梅尔维斯得出了答案。


    事实证明，那些男医生会进行尸检，而女性助产士不会。在进行尸检后，同一位男医生可能又去接产，在此过程中将他解剖过的尸体颗粒传染给母亲。塞梅尔维斯坚持要求这些男医生用氯溶液（而非简单的肥皂和水）清洗双手和器械，以完全清除手上的任何尸体颗粒。他当时并不了解氯作为消毒剂的知识，但他知道这能非常有效地消除医生手和器械上与尸体残留相关的厌恶气味。尽管距离发现细菌还有几十年时间，但塞梅尔维斯的新方案仍然是明明的医疗手段。结果，男医生看护的病房中产产热死亡率下降了。我们幸运的是，他的意外发现为医学死亡率的降低铺平了道路。


    即使在今天，洗手仍然是公共卫生领域最强大的工具之一——从预防手术感染到避免流感。这确实需要纪律。但对于去洗手间的人来说只需要几秒钟，对于手术专业人员来说只需要几分钟，就能有效防止我们环境中各种细菌和病毒敌人的侵害。


    效仿医疗专业人员的做法，员工可以采取常识性的卫生措施保护公司免受各种敌对威胁。你是否曾允许网站自动保存密码，或使用你的移动设备或笔记本电脑来存储密码？不要这样做。在我能提供的一个案例中，一名员工使用移动设备存储她的所有密码，包括她的
    `O365` 邮箱账户密码。网络犯罪分子入侵了她的移动设备并盗走了 `O365` 凭据。这些被破解的凭据被用于访问她的 `O365` 账户，黑客发送伪装成该员工合法邮件的钓鱼邮件给她在
    `O365` 通讯列表中的高管和其他员工。凭据盗取对组织来说特别难以检测。毕竟，从任何角度看，对该员工 `O365` 账户的访问看起来都是合。直到勤奋的员工（攻击者邮件活动的接收者）发出警报，威胁才被发现并遏制。


    我理解密码管理很困难。我们的大脑构造并不是为了记住各种设备、网站和应用程序的数百个密码。糟糕的是，良好的网络安全卫生要求你定期更改这些密码，这使得记住所有密码变得更加困难。


    市场上存在诸如密码管理器之类的工具可以帮助你生成和检索复杂密码。如果某个工具不可取，你就需要使用助记技巧来帮助记忆。例如寻找一个好记的短语（`Jack and
    Jill went up the hill to fetch a pail of water`）、使用每个单词的首字母（`JaJwuthtfapow`）、使用大小写字母和符号的组合（`
    J@Jwuthtf@pow`）以及为了稳妥添加一个数字（` J@Jwuth2f@pow`）。根据网站 `HowSecureIsMyPassword.net`，我刚刚创建的密码计算机大约需要*三百万年*才能破解。


    密码管理是良好网络安全卫生的核心。遗憾的是，它的执行远未达到理想水平。直到最近 2018 年，某州使用 `Password123` 作为密码的政府官员就有近
    1500 人。这简直让黑客的工作变得更容易了！


    其次，要像关注在线安全一样关注物理安全。正如我在上一章中提到的，物理安全和网络安全的世界正日益趋同。网络犯罪分子在攻击中不仅针对物理基础设施（包括电网和制造设施），被攻破的员工设备也是网络犯罪分子进入公司系统的通道。


    历史上最著名的国家级攻击之一 `Stuxnet` 是通过一个被破坏的 USB 设备发生的。一个 USB 设备让美国政府通过获得伊朗核离心机的访问权限，延迟了伊朗的核化。正如我一直所说的，网络攻击并不一定依赖下一代技术就能发挥作用。


    所以你不是那种在核设施工作的人？很有可能你至少有一台用于工作的电脑。如果你和美国 25% 的员工一样，你会在每天下班回家时让那台电脑保持开启且未锁定。这等同于用完洗手间后不洗手！


    最后，也是重要的一点，在访问或传输敏感数据时随时使用公司的虚拟专用网络（`VPN`）。公共 `WiFi` 网络是心机勃勃犯罪的聚集地。这一领域的网络安全卫生非常薄弱——即使在网络安全专业人士中也是如此！在业内最大的活动
    `RSA` 上（每年吸引超过 40,000 名网络安全专业人士），自称黑客的 `@Grifter801` 推文说他在开幕后约 26 小时内就收集了超过 33,500
    个非加密密码。

