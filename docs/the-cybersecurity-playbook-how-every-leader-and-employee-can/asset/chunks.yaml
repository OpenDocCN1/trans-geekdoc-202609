- fmt: '

    First, work with the CISO to identify the employees with the greatest access to
    the company’s most valuable assets. Your CISO should already have a taxonomy of
    risk, mapped against value, for your organization’s most prized possessions, whether
    intellectual property, manufacturing facilities, sensitive databases, or something
    else entirely. Define the perimeter of employees with privileged access to these
    valuables. Establish with the hiring manager and your security organization what
    level of access is required for these employees to do their jobs effectively.
    Periodically review the list of employees to ensure no job changes warrant an
    adjustment to privileges. Come performance review time, create a list of employees
    who may pose a flight risk and compare it against those who have privileged access,
    ensuring Legal is in the process to respect employee privacy concerns. By establishing
    and monitoring employee access privileges regularly, you protect your company
    from those who no longer require enhanced privileges (or may never have required
    them in the first place).


    Note that access hygiene not only protects your company against malicious insiders
    but malevolent outsiders as well. Had McAfee applied this prescription, we would
    have removed an agency employee (essentially an extended insider to our team)
    from having administrative privileges to our social media page when she was no
    longer doing work for us. By doing so, we would have averted the hack I covered
    in the first chapter.


    Next, within your reward-and-recognition program, carve out a place for whistleblowers.
    This goes beyond government programs that protect and incentivize these people.
    Establish a confidential program whereby employees can report suspicious behavior.
    Clearly, this is a fine line to walk, as you don’t want to create a company culture
    of distrust among employees. But if you allow employees to speak up when they
    see something that doesn’t sit right with them, you can marshal one of your most
    powerful weapons—your own workforce—in identifying rogue employees.


    Case in point: A while back, McAfee reprioritized our investment areas to more
    closely align with our customers’ needs and the marketplace. These decisions never
    come easy for a company, especially when they impact employees, which was the
    case in this example.


    I received an email from a manager on my team, who forwarded one he had received
    from one of his employees. In it, the employee asked the manager for help. One
    of our impacted employees was overheard on what seemed to be a suspicious phone
    call. In it, the employee in question stated that, now that they had been “let
    go,” they could reveal exactly what McAfee had been working on in recent months.
    (I should mention that this employee had knowledge of an upcoming product rollout.)


    Upon hearing the conversation, our concerned employee decided it best to send
    an email to a manager reciting exactly what was said. Because of this, we were
    able to intervene with a reminder to the exiting employee of confidentiality requirements
    (without exposing the whistleblower in the process). And we were able to make
    other decisions to accelerate or otherwise alter the original rollout schedule
    for the product in question.


    Since the exiting employee wasn’t using company systems to relay or exfiltrate
    the information, this threat would have gone undetected by McAfee’s cybersecurity
    team. Only one employee overheard the phone conversation and was under no obligation
    to report it. But the person did. I couldn’t have expressed my gratitude more
    for one of our own looking out for the company. **Find a confidential, nonthreatening
    way for conscientious employees to blow a whistle or raise a flag when they see
    something dubious. When they do, reward them appropriately.**


    Finally, examine your company’s key performance indicators (KPIs) to find those
    related to cybersecurity. At a minimum, **every member of the executive team should
    have at least one cybersecurity KPI**.


    This shouldn’t be hard. After all, this book reveals how cybersecurity permeates
    multiple functional areas of the company and where every employee can play his
    part. Find a few examples and embed at least one meaningful cybersecurity KPI
    for every chief officer. He will in turn cascade the appropriate cybersecurity
    metrics to those on his team with responsibility for the same. Those leaders will,
    in turn, distribute responsibility to the individual contributors on their teams.
    This waterfall effect eventually soaks cybersecurity into all functions and all
    levels of your company.


    ***


    This book is about instilling a cybersecurity culture at all levels and layers
    of organizations. Culture isn’t pushed down. It spreads laterally and organically.
    The best management can do is provide the optimal soil for great cultures to flourish.
    That entails ensuring employees are mindful of the vision, mission, and values
    guiding your company forward. It requires recruiting the right talent, aligned
    to those company values, and committed to mutual success. And it entails having
    reward-and-recognition programs and clearly aligned metrics to ensure everyone
    is moving in the same direction.


    As those who most tend to a company’s culture, HR professionals have a significant
    role to play in depositing cybersecurity seeds. You are instrumental in helping
    the industry’s, let alone your company’s, cybersecurity talent shortage. By removing
    the unconscious bias that limits our collective ability to find and recruit exceptional
    cybersecurity talent and creating a climate that enlists every employee in the
    battle, HR can bridge the cybersecurity gap for all of us.


    ## Notes


    1. Steve Morgan, “Women Represent 20 Percent of the Global Cybersecurity Workforce
    in 2019,” Cybersecurity Ventures, March 13, 2019, `https://cybersecurityventures.com/women-in-cybersecurity/`.

    2. Jane LeClair, “Why There Are So Few Women and Minorities in Cybersecurity,”
    Thomas Edison State University, September 7, 2018, `https://blog.tesu.edu/why-there-are-so-few-women-and-minorities-in-cybersecurity`.

    3. Bletchley Park Research, `https://www.bletchleyparkresearch.co.uk/research-notes/women-codebreakers/`.

    4. Clive Thompson, “The Secret History of Women in Coding,” *The New York Times*,
    Feb. 13, 2019, `https://www.nytimes.com/2019/02/13/magazine/women-coding-computer-programming.html`.

    5. Ibid.

    6. John Sullivan, “7 Rules for Job Interview Questions That Result in Great Hires,”
    *Harvard Business Review*, February 10, 2016, `https://hbr.org/2016/02/7-rules-for-job-interview-questions-that-result-in-great-hires`.

    7. Shannon Shaper, “How Many Interviews Does It Take to Hire a Googler?” re:Work,
    April 4, 2017, `https://rework.withgoogle.com/blog/google-rule-of-four/`.

    8. Shankar Vedantam, and Maggie Penman, “How Google’s Laszlo Bock Is Making Work
    Better,” National Public Radio Hidden Brain Podcast, June 7, 2016, `https://www.npr.org/2016/06/07/480976042/how-googles-laszlo-bock-is-making-work-better`.

