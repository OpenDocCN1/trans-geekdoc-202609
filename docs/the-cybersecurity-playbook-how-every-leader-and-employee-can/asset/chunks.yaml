    Are the 12s (as the Seahawks fans are called) really that loud? Mostly, yes. But
    it turns out their stadium was also specially designed to retain noise. Unlike
    other open-air stadiums where noise naturally escapes into the ether, the Seahawks’
    stadium has a second deck and canopy that bounces noise downward, creating a cacophony
    when the 12s roar.([1](#c01.xhtml#c01-note-0001)) The Seahawk organization has
    taken great measure to enlist the 12s as part of the team—ensuring these fans
    can bring their collective might to the game and virtually play alongside those
    on the field.


    The 12th Man teaches us that spectators can influence outcomes. But they must
    be engaged. They must be enlisted. That’s where you come in. I’ve written this
    book to engage every layperson on your importance in a cybersecurity game that
    is always in play. No one can blame you for not taking up the mantle sooner. But
    after reading this book, no one can excuse you for abdicating your responsibility
    either.


    This book seeks to advance the dialogue by picking up where so many other worthy
    titles end: giving the business layperson an action plan he or she can execute
    immediately to be part of an organization’s cybersecurity agenda. If you still
    question whether it’s an agenda that should include you, realize it already does.
    Cybercriminals are counting on employee apathy or disengagement to unleash havoc
    on their targets. If you are not actively playing on the side of your company,
    you are likely unknowingly a pawn on the side of your enemy. If you value online
    freedom, if you care to know that the data you use to make decisions isn’t corrupted,
    if you insist that your connected devices are used for good and not harm, then
    you already share a mission with the cybersecurity professionals in your workplace.
    You have more in common with those of us in cybersecurity than you may realize.


    ## W.I.S.D.O.M.


    At McAfee, the executive team takes development seriously. We meet quarterly to
    put the “work” back into “teamwork.” We coach one another, share intimate stories
    about our professional journeys, and recommit ourselves to being more authentic
    toward one another and our employees. At the end of those development sessions,
    we practice something we learned from the AIP Group, our partner in leadership
    development, called `W.I.S.D.O.M.`. It stands for `W`hat `I`’ll `S`ay (and do)
    `D`ifferently `O`n `M`Monday. Each of us makes our `W.I.S.D.O.M.` commitment to
    hold ourselves and each other accountable to practicing one key developmental
    area we have learned.


    In the same way, I want to equip you with `W.I.S.D.O.M.` for this journey. That’s
    why, after each chapter, I’ll give you a practical prescription for what you can
    do on Monday to improve your organization’s cybersecurity posture. Some of the
    tips are banal on the surface but can have significant impact for your success.
    Others require more work, but the view is worth the climb. In every case, I’ll
    limit the prescription to no more than five pieces of `W.I.S.D.O.M.` in any given
    chapter, since I want to focus on the 20 percent of efforts that will yield 80
    percent of results.


    The advice you’ll find in these pages is:


    ## Note

    1. What Makes Seattle’s 12th Man Special? Louise Bien, SB Nation, January 22,
    2015.


    ## CHAPTER 2


    ### Mr./Ms. Cellophane


    > *And even without clucking like a hen,*

    > *ev’ryone gets noticed now and then,*

    > *Unless, of course, that personage should be*

    > *invisible me.*

    > *Cellophane, Mister Cellophane,*

    > *should have been my name, Cellophane,*

    > *’cause you can look right thru me,*

    > *walk right by me and never know I’m there.*


    ### SVP/EVP, Professional Services


    Poor Amos. His wife murders her lover in cold blood and claims so in self-defense
    against the man she says is “unknown.” Amos dutifully stands by her side, even
    after discovering the ugly truth of the affair. Everywhere Amos goes, he is a
    shadow in her story, practically invisible to all around him. I’m speaking of
    the character in the award-winning musical *Chicago.* His character laments just
    how overlooked he is in his solo number aptly titled, “Mister Cellophane”:


    Many of us can relate to Amos in sometimes feeling like we are invisible. It’s
    not a great feeling, typically accompanied by that of being underestimated or
    underappreciated. And it’s no fun being outright misunderstood.


    For too long, chief information security officers (CISOs) have been the metaphorical
    Mr./Ms. Cellophanes of our organizations, destined to toil in virtual anonymity
    as they relentlessly focus on the yeoman’s work of security. They’ve lived in
    the shadows of those they protect. Indeed, if they emerge from their cloak of
    invisibility, there’s bound to be trouble on all sides.


    As employees, we don’t want to be bothered with CISOs or their department. We
    simply expect them to keep us safe. And we want them to do it while staying out
    of our way. In fact, CISOs got their start in the back office of our organizations,
    literally out of sight and out of mind.

