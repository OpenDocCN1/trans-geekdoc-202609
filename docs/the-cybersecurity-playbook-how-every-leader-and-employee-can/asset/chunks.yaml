    他们的证据表明，最成功的谷歌男性员工在回答这个面试问题时给出的是“4”。谷歌发现，男性倾向于夸大自己的经验或资历。最能预测女性候选人成功的得分是多少？满分
    5 分，因为谷歌发现女性更倾向于保守和谦逊。（当然，既然秘诀已经泄露了，谷歌现在得想出额外的面试问题来判断成功与否了！）


    出于这些原因，麦阿菲对大多数职位采用了小组面试法。我们在每个面试小组中至少会安排一名女性或少数族裔成员，以代表我们渴望招募的同样多样性。


    ### 消除招聘偏见


    最后，消除那种可能让贵公司只寻求具有以往网络安全经验专业人士的偏见。市场上的这类人才并不多。我们不能一直互相挖墙，在此过程中推高薪资并导致人才流失。因此，请消除那些对不同背景的候选人产生偏见的问题。例如，要求候选人谈谈他认为感兴趣的网络安全最新热门创新，这会让实操经验较少的人处于劣势（正如我们从
    PC 的历史教训中学到的那样）。在寻找合格候选人时，确保你的问题能涵盖 STEAM——这里玩了双关语。


    当我进入麦阿菲时，我的背景中一丁网络安全经验都没有。在六个月内，我合著了一本关于该主题的书。我并不是在贬低这个行业的复杂性，但我认为技能是可转移的。寻找在其他领域拥有技能的候选人。你会发现，像电信这样的技术行业并没有处于零失业率的状态。技术本身在不同的劳动力市场中就会起伏波动。扩展你的视野，去寻找具有可转移技能的合格人才，无论候选人是否是否具有先前的网络安全经验。


    ### 将安全嵌入公司价值观


    在招募硬币的另一面，你可以通过多个杠杆将网络安全嵌入到员工的日常工作中，而不会在此过程中让他们深感重负。首先，`搜索你的公司价值观`——那些你期望员工遵守的行为准则或指导原则——`看看你可以在哪里添加一个词，从而从根本上改变它们的含义：安全（security）。`。


    例如，在探索我以前雇主威信（Verizon）的老地方时，我发现公司在写本文期间的网站上列有一段令人印象深刻的信条。让我们来看看仅仅插入一个词如何在不损害意图的情况下扩大含义（斜体部分是我加的，表示建议添加）：


    > 我们之所以工作，是因为客户重视我们高质量的通信服务。


    > 我们通过我们的产品和行动提供卓越的客户体验。我们所做的一切都建立在强大的网络、系统和流程基础之上。我们交付的产品的质量、可靠性*以及安全性*至关重要。客户付钱是为了让我们提供他们可以信赖的服务。


    一个词就可以在不改变目的的情况下改变范围。


    现在，这并不是一场“网络安全宾果游戏”。有些价值观或指导原则，安全元素并不适合。不要把方方木凿进圆孔。威信的例子恰好说明了这一点：


    > 我们知道团队合作让我们能够更好、更快速地为客户服务。


    > 我们拥抱多样性和个人发展，不仅是因为这是正确的事，还因为这是明智的商业行为。驱动我们不是自尊，而是成就。我们履行对彼此和客户的承诺。我们言出必行。我们尊重并信任彼此，保持开放、坦诚和直接的沟通，因为任何其他方式都是不公平且浪费时间的。我们发表意见并进行建设性的异议，然后全力支持一致的行动。我们中的任何一个人都可以向其他人提出观点或想法，并听取和重视他人的观点，无论职位或级别如何。想法的存亡取决于其本身的价值，而非它们产生于何处。


    我恰好喜欢威信信条中的那段文字。但尽管我尽了努力，仍然无法在已经描述得如此美的话中自然地插入“安全”。


    这没关系。虽然你不会在一个不属于它的价值观中强行为安全找一个位置，但你可能会发现至少一个可以轻松融入它的地方。假设你的价值观不仅仅是员工证背面的花文字，你将开始通过根除不安全行为并代之以安全行为，将安全种子播到公司的基础中。


    ### 奖励与认可


    接下来，让我们看看你的`奖励与认可计划`，为网络安全成就找到一个自然的归宿。第一个显而易见：给你的网络安全团队一些爱。正如第 2 章提到的，他们已经在公司的后台待了太久了。让他们从幕后走出来。


    怎么做呢？让你的 `CISO`（首席信息安全官）在某些公司全体会议上有发言。她不需要成为每个公司活动的常客。但你完全可以展示她和团队的成就，让更广泛的员工了解攻击格局以及网络安全防御的重要性。除了招募更多人才加入战斗外，一点感激就能产生很大影响，并可能有助于抑制你网络安全队伍中的高流失率（多亏于那不存在的失业率）。


    接下来，扩展你的奖励与认可计划以包含网络安全。我在上一章中提到过，当新产品或服务的发布由于安全性不佳时，停止生产是非常重要的。使用贵公司的认可平台公开表扬员工——无论他们是否属于网络安全部门——因为他们提出了有效的安全顾虑，阻止了此类产品或服务进入市场。


    ### 处理恶意内部人员


    现在是时候处理这本书书中涉及的那个显而易见的问题了。到目前为止，我们一直把员工视为通常意良好的主体，他们寻求通过网络安全的方式为公司做出贡献，但可能缺乏方面的教育或处方来这样做。这在很大程度上是事实。


    但有一部分员工他们不想为你的公司做贡献。这些人不仅仅是网络安全战斗中冷漠的旁观者。这些人是恶意内部人员，寻求损害你的组织和或以公司的代价个人获利。根据威信的
    DBIR 报告，恶意内部人员占了所有公司破解事件的 10% 以上。


    恶意内部人员是公司面临的最阴险的敌人。首先，公司不愿对员工实施“老大哥”式的监控——这很有道理。撇开隐私考虑，雇主可能不愿将每个员工都视为潜在的坏人，而是倾向于一种信任是自由提供的而非通过长期获得的职场文化。

