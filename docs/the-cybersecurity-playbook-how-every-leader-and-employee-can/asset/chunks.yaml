  trans: '

    首先，与首席信息安全官（CISO）合作，识别出对公司最有价值资产访问权限最大的员工。你的 CISO 应该已经对组织最珍贵的资产拥有一套基于价值的风险分类法，无论这些资产是知识产权、制造设施、敏感数据库还是其他。定义对这些珍贵资产拥有特权访问的员工范围。与招聘经理和你的安全组织共同确定这些员工为了有效工作需要何种级别的访问权限。定期审查员工列表，以确保没有因职位变动而需要调整权限。在绩效评估期间，列出一份可能存在离职风险的员工名单，并将其与拥有特权访问的员工进行对比，确保法律部门正在处理尊重员工隐私的考量。通过定期建立和监控员工的访问权限，你可以保护公司免受那些不再需要增强权限（或可能从就不需要）的人的影响。


    请注意，访问卫生不仅保护你的公司免受恶意内部人员的影响，还能防止恶意外部人员。如果 McAfee 执行了这一处方，我们会在一名机构员工（本质上是我们团队的扩展内部人员）停止为我们工作时，取消其对我们社交媒体页的管理权限。通过这样做，我们将避免我在第一章中描述的那次黑客。


    接下来，在你的奖励和认可计划中，为举报者留出一席。这超出了政府保护和激励这些人的计划。建立一个机密计划，让员工可以在其中报告可疑行为。显然，这是一条微妙的界线，因为你不想在员工之间营造一种不信任的文化文化。但如果你允许员工在看到不对劲的事情时发声，你就可以动用你最强大的武器之一——你自己的员工——来识别违规员工。


    案例说明：不久前，McAfee 重新调整了投资领域，以更贴近我们的客户需求和市场。这些决策对于一家公司来说并不容易，特别是当它们影响到员工时，本例正是如此。


    我收到团队一名经理发来的邮件，他转发了其中一名员工发给他的邮件。在邮件中，该员工向经理寻求帮助。我们听到其中一名受影响的员工在打一个似乎可疑的电话。在电话中，该员工表示，既然他们已经被“解雇”，就可以准确地揭露
    McAfee 最近几个月一直在研究的内容。（我应该提到，该员工对即将发布的产品非常了解。）


    听到这段对话后，我们担心的员工认为最好给经理发一封邮件，如实陈述所说的话。正如此，我们能够通过提醒离职员工遵守保密要求来进行干预（同时在此过程中没有暴露举报者）。我们还可以做出其他决策，加速或以其他方式更改产品的原始发布计划。


    由于离职员工没有使用公司系统来传递或外泄信息，这一威胁将无法被 McAfee 的安全团队检测到。只有一名员工偷听了电话内容，且没有义务报告它。但那个人做了。我无法更充分地表达对我们自己的人为公司考虑的感激了。**寻找一种机密且不具威胁的方式，让尽职的员工在看到可疑情况时能够举报或发出警报。当他们这样做时，给予适当的奖励。**


    最后，检查你公司的关键绩效指标（KPI），以找到与网络安全相关的指标。至少，**每位执行团队的成员都应该至少有一个网络安全 KPI**。


    这并不难。毕竟，这本书揭示了网络安全如何渗透到公司的多个职能领域，以及每个员工可以在其中发挥什么作用。找几个例子，并为每位首席官嵌入至少一个有意义的网络安全
    KPI。他反过来会将相应的网络安全指标传递给他团队中负责相同工作的人。那些领导者将把责任分配给团队中的个人贡献者。这种瀑布效应最终会将网络安全渗透到你公司的所有职能所有层面。


    ***


    这本书关于在组织的所有级别和层次培养网络安全文化。文化不是推行的。它是水平且有机地传播的。管理层能做的就是为优秀文化的蓬盛提供最佳土壤。这意味着确保员工关注引导公司前进的愿景、使命和价值观。它要求招募与这些公司价值观一致、并致力于共同成功的人才。它意味着拥有奖励和认可计划以及清晰一致的指标，以确保每个人朝着同一个方向努力。


    作为最关注公司文化的人，HR 专业人员在播种网络安全种子方面发挥着重要作用。你在帮助行业（不用说你的公司）解决人才短缺方面起着关键作用。通过消除限制我们寻找和招聘卓越网络安全人才能力的无意识偏见，并营造让每位员工都参与战斗的氛围，HR
    可以为我们所有人弥补网络安全的差距。


