    or the two are peers sitting around the same table. In particular, the roles and
    responsibilities for proper cybersecurity hygiene—including patching, backups,
    multifactor authentication, and the like—must be established and agreed upon at
    the beginning of each planning cycle. If the two functions share a budget, the
    leaders must identify and allocate what portion will serve IT versus cybersecurity.
    In addition to run-rate budget carveouts for each, perhaps any new IT project
