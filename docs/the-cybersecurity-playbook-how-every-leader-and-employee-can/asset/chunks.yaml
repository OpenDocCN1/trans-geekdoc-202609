    2012 年 6 月 12 日, [`www.psychologytoday.com/us/blog/the-power-prime/201206/is-our-survival-instinct-failing-us`](https://www.psychologytoday.com/us/blog/the-power-prime/201206/is-our-survival-instinct-failing-us).

    3. ^(3) Maria Saporta, “UPDATE: Retired Home Depot CEO Frank Blake: ‘I Really
    Don’t Like Amazon,’” *Atlanta Business Chronicle*, 2017 年 8 月 15 日, [`www.bizjournals.com/atlanta/news/2017/08/15/retired-home-depot-ceo-frank-blake-i-really-dont.html`](https://www.bizjournals.com/atlanta/news/2017/08/15/retired-home-depot-ceo-frank-blake-i-really-dont.html).

    4. ^(4) Lozanski v The Home Depot, Inc., 2016 ONSC 5447 (CanLII), <[http://canlii.ca/t/gt65j]](http://canlii.ca/t/gt65j/),
    检索于 2019-03-11.

    5. ^(5) Jennifer Reingold, “How Home Depot CEO Frank Blake Kept His Legacy from
