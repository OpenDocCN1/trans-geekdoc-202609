    \ positives. Traditional threat intelligence has more false negatives. Both together\
    \ yield high efficacy with lower false positives.\n\n*   Carry the culture flag\
    \ for cybersecurity at your company. \n\n    *   Spread it vertically by speaking\
    \ the language of the boardroom and its executives (risk management). Partner\
    \ with the finance organization to translate cyber-speak into metrics and outcomes\
    \ most understood and valued by the board.\n\n    *   Spread it horizontally through\
    \ culture awareness campaigns. Hire a communications expert to work with HR and\
    \ Marketing to develop effective campaigns that make cybersecurity part of everyone’s\
    \ day job. Deliver actionable scorecards to functional peers that measure employee\
    \ understanding of cybersecurity principles and adherence to company policies.\n\
    \n## Notes\n\n1.  ^([1](#c10.xhtml#c10-note-0001-1)) D. Frances, “Ready for the\
    \ Big One,” *Sonoma Index Tribune*, January 30, 2014, [https://www.sonomanews.com/csp/mediapool/sites/SIT\
    \ /News/story.csp?cid=3387701&sid=744&fid=181&sba=AAS](https://www.sonomanews.com/csp/mediapool/sites/SIT/News/story.csp?cid=3387701&sid=744&fid=181&sba=AAS).\n\
    \n2.  ^([2](#c10.xhtml#c10-note-0002-1)) [https://www.usgs.gov/faqs/can-you-predict-earthquakes?qt-news\
    \ \\_science\\_products=0#qt-news\\_science\\_products](https://www.usgs.gov/faqs/can-you-predict-earthquakes?qt-news_science_products=0#qt-news_science_products),\
    \ Accessed March 20, 2019.\n\n3.  ^([3](#c10.xhtml#c10-note-0003-1)) “Quake Predictor\
    \ Suspended from Job,” *San Marino Tribune* (and *San Marino News*), Thursday,\
    \ November 23, 1989, page 10.\n\n# Acknowledgments\n\nI’ve learned that just about\
    \ everything in life is a team sport and writing this playbook is no exception.\
    \ I am grateful to you, the reader, for taking your position on the cybersecurity\
    \ field. And I am indebted to the following individuals for your selfless contributions\
    \ in making this book possible:\n\n**Steve Grobman** for your brilliance in translating\
    \ complex concepts into practical prescriptions. Your technical genius is rivaled\
    \ only by your deft ability to communicate.\n\n**Chatelle Lynch** for being a\
    \ visionary in your field and cultivating an environment for a world-class culture\
    \ to thrive. You show me every day what it means to play to win.\n\n**Mark Murray**\
    \ for your masterful storytelling skills. It’s an honor to partner with you in\
    \ creating amazing and memorable moments.\n\n**Chris Chaffin** for giving me invaluable\
    \ feedback throughout the writing process . . . and doing so while on vacation,\
    \ no less!\n\n**Giulia Mucciarelli** for your incomparable talent in creating\
    \ beautiful designs, including contributing to a cover I’m proud to display on\
    \ my bookshelf.\n\n**Morgan Bell**, **Gavin Donovan**, and **Kevin Easterwood**\
    \ for meticulously poring over each chapter with an eye for factual and technical\
    \ accuracy.\n\n**Jonathan Rozek** for your unwavering tenacity in researching\
    \ multiple aspects of such a thorny topic.\n\n**Robert Green** and **Adam Rosenblatt**\
    \ for designing and executing a brilliant research study that tapped into the\
    \ cultural pulse of cybersecurity in today’s workplace.\n\n**Michael Marto** for\
    \ lending your wisdom and connections to help me bring a story to life in the\
    \ way I first imagined it to be.\n\nAnd last, but certainly not least, **Chris\
    \ Young** for being the inspirational leader you are. Thank you for dedicating\
    \ your career and the work of thousands of McAfee employees to keeping the world\
    \ safe. Your passion is without equal, your talent is without measure, and your\
    \ principles are without compromise.\n\n# About the Author\n\n**Allison Cerra**\
    \ found her life’s calling at 18 years of age, when she fortuitously stumbled\
    \ into a lifelong career of marketing complex technologies. She brings a practical\
    \ approach to demystifying the confluence of significant technology trends—including\
    \ mobility, cloud, big data, security, and collaboration—and signaling where these\
    \ forces could lead cultures in the future. Whether in dissecting how broadband\
    \ upends traditional economies, how technology influences and reflects company\
    \ culture, how virtual and physical worlds converge to create a new human psyche,\
    \ or how bad actors are motivated to challenge our digital freedom, she has explored\
    \ the intersection of technology, incentives, and behaviors in several books.\
    \ In 2015, motivated by a desire to stand on the good side of a fight too important\
    \ to lose, Cerra joined McAfee, where she currently marries her calling for marketing\
    \ with a cause of educating unwitting participants in a virtual battle that is\
    \ underestimated, if not ignored, by far too many.\n\n# Index\n\n## A\n\n*   Abdulmutallab,\
    \ Umar Farouk, [178](#c09.xhtml#Page_178)\n\n*   Administrators, locking out,\
    \ [10](#c01.xhtml#Page_10)\n\n*   Adversaries, [47](#c03.xhtml#Page_47)–68 \n\n\
