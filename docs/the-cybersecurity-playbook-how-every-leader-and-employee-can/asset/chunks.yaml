  raw: 'Given there aren’t enough people to throw at the problem, CISOs have resorted
    to a cavalcade of products from a vast battalion of cybersecurity vendors vying
    for cybersecurity dollars to fill the void. In stark contrast to the shortage
    in the labor market, there’s an overwhelming surplus of cybersecurity products
    vying for the CISO’s limited dollar. As of this writing, there are 3,500 cybersecurity
    vendors^([13](#c02.xhtml#c02-note-0013)) courting CISOs. Each vendor offers one
    or more defensive technologies, many promising to solve a small (if not large)
    portion of the cybersecurity challenge.


    There can be too much of a good thing. And the abundance of cybersecurity technologies
    available to the CISO is illustrative of this axiom. CISOs, attempting to demonstrate
    value and anticipate the next threat, have historically rushed to adopt the latest
    defensive technology for their arsenal against the adversary.


    But they’ve gotten the short end of the stick in executing this strategy. That’s
    because the fragmented vendor landscape that competes for every dollar is itself
    a complex quagmire of technologies that, for the most part, don’t work well together.
    Too often, this technology is promoted, purchased, and put on the shelf. Budgets
    are spent, “shelfware” grows, and organizations are no more secure for the innovations,
    intentions, or investment. Even if the technology makes its way off the shelf
    and into deployment, chances are it’s not integrated with the rest of the organization’s
    defenses.


    Imagine going to war with a cluttered mess of artillery in your inventory. Picture
    being inconsistent in deploying this weaponry to cover your bases against your
    enemy sufficiently. Now envision your fighters not being able to communicate with
    one another to share information about the threats they encounter to collectively
    bolster your coordinated defense.


    You likely don’t have to imagine it. If your company has one, just visit its security
    operations center (SOC), the nerve center where your cybersecurity colleagues
    stand as first responders between your company and unending attacks. These front-line
    cybersecurity professionals have often inherited a patchwork of technologies and
    tools acquired over the years, usually adopted over multiple CISO regimes in their
    companies. Many of these products do not share threat intelligence, let alone
    make the jobs of cybersecurity professionals any easier. All too often, you’ll
    find your cybersecurity colleagues working for their tools, rather than their
    tools working for them.


    Enterprise Strategy Group (ESG), an independent industry analyst that studies
    the cybersecurity market, reports that 40 percent of organizations have more than
    25 cybersecurity tools deployed. Roughly the same percent admit to manually collecting
    intelligence feeds. And 27 percent believe the security team spends *most* of
    its time fighting fires, rather than working on strategic projects,^([14](#c02.xhtml#c02-note-0014))
    leading to staff burnout and turnover—disastrous consequences for a CISO confronting
    a global talent shortage crisis.


    As if that weren’t enough, there’s a dirty, unavoidable secret inherent in the
    cybersecurity industry. It’s this: no one product can defeat cybercrime. You may
    not find this surprising. After all, it would be the equivalent of going into
    a sustained war with just one weapon in your arsenal. You wouldn’t do it and expect
    to last long.


    But there’s more to this reality. It’s not just that there isn’t a proverbial
    silver-bullet defense that inoculates all threats. It’s that *every* defensive
    technology is most effective when it is *first* deployed in the market. This is
    completely opposite from what we’ve learned as conventional wisdom in IT.


    Think about it. When a new IT technology comes to market, most companies are reluctant
    to be an early adopter. After all, why be a guinea pig for an unproven technology?
    Let other companies go first, work out the bugs, and make the technology better
    (and cheaper). Then, follow fast in deploying it. That seems like a much smarter
    playbook for deploying your garden-variety IT technology.


    But cybersecurity technology is fundamentally different. When an IT organization
    is deploying the latest fill-in-the-blank IT technology, there isn’t an adversary
    on the other side actively working against its success. Not so with cybersecurity.
    When enough of the market deploys a defensive technology that is highly effective
    against a threat, adversaries go back to their own product labs to develop countermeasures
    against it. They ultimately find a way to circumvent the defensive technology,
    if not make it less effective over time. (It’s at that time that cybersecurity
    vendors, like McAfee, return to our labs and develop countermeasures against the
    countermeasures, and the race continues.)


    Time matters in cybersecurity. Being early to market with a new defensive technology
    especially matters. That’s because said technology will deliver maximum efficacy
    for the earliest of its adopters.


    So let’s try to square this circle by thinking like a CISO:


    1.  There’s no single defensive technology that defeats all varieties of cyberattacks—there
    are simply too many of them, and the adversary continues innovating every day.
    You’ll need to deploy lots of products, from multiple vendors, to put forward
    your best unified defense.


    2.  Every defensive technology is most effective when it’s first deployed in the
    market. In short, you want to be an early adopter of the latest cybersecurity
    technology. That’s because adversaries have not had sufficient incentive or time
    to develop countermeasures against it. When they do, the cat-and-mouse game between
    cybersecurity vendors and adversaries ensues, with each side developing countermeasures
    against the other.


    3.  So being first to deploy matters. But you (and the rest of the industry) suffer
    a talent shortage. There just aren’t enough people on your team to implement defensive
    technologies quickly. Even if you can, chances are you’re not deploying these
    defenses in a coordinated way, such that all technologies in your environment
    work synergistically to share threat intelligence and operate with consistent
    tools.


    4.  And since your defensive technologies don’t share threat intelligence seamlessly,
    your limited cybersecurity staff is left to fill in the gaps. Given that both
    the volume and complexity of threats are exponentially increasing, your team must
    separate the signal from the noise in detecting and remediating the most insidious
    threats in your environment—before your adversaries get the upper hand and inflict
    harm on your company.


    Who wants that challenge? Not many. It’s why cybersecurity professionals truly
    are the unsung heroes of our companies. They stand in the fight for us. They sit
    in the shadows, invisible and largely unappreciated for their efforts.


    Bringing us back to our CISO, “doing more than less” is so much more than a trope.
    It’s essential. She must find a way to automate as much of her environment as
    possible, to allow her scarcest asset, her employees, to hunt for the most sophisticated
    attacks. And she must aggressively deploy new cybersecurity technologies while
    not compromising her overall cybersecurity posture with nonintegrated defenses.


    You now understand what your CISO is up against and can put yourself in her shoes:


    *   Help your company transform, while protecting an expanding attack surface
    of cloud, mobile, and IoT technologies.


    *   Manage your company’s risk, all while the volume and sophistication of threats
    escalate exponentially.


    *   Maximize efficacy by adopting products early and integrating them into a unified
    defense. And automate workflows to free up capacity for your scarcest resource—your
    talented employees—to hunt the most sophisticated and menacing threats.


    ## W.I.S.D.O.M. for the Board and CEO'
