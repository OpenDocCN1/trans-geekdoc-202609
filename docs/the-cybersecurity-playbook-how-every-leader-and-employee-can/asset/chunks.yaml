  raw: 'Instead, Blake did the most unnatural thing of all. He reported the breach
    publicly before his company even knew definitively what was happening. He apologized
    for the incident before fully understanding who was to blame. He let all customers
    know that his company would be responsible for any fraudulent charges and offered
    free credit monitoring before knowing the full extent of the damage.


    While the company wasn’t spared from a class-action lawsuit, it avoided the full
    wrath of potential punitive damages, largely because of how Blake and the executive
    team rallied. As the judge explained as part of his decision:


    > The real villains in the piece were the computer hackers who stole the data.
    After the data breach was discovered, there was no cover up, and Home Depot responded
    as a good corporate citizen to remedy the data breach. There is no reason to think
    that it needed or was deserving of behavior modification. Home Depot’s voluntarily-offered
    package of benefits to its customers is superior to the package of benefits achieved
    in the class actions.^([4](#c06.xhtml#c6-note-0004))


    In the end, while other companies that suffered major breaches of the time were
    derided in the court of public opinion for executing their communications strategies
    so ineptly, The Home Depot was lauded for its integrity.


    What of Blake’s sterling legacy? Incredibly, the hack may have helped polish it
    even more. After all, how often is it that a company is publicly *praised* after
    a breach?


    And the hackers didn’t manage to steal The Home Depot’s reputation either. In
    the company’s “voice of the customer” surveys, the net percentage of customers
    who would strongly recommend The Home Depot to others increased 44 percent under
    Blake.^([5](#c06.xhtml#c6-note-0005))


    The Home Depot avoided being the punchline of their breach. They controlled their
    message, leaving little chance for “friends of friends” to fill in the details
    for them. They traded on empowerment, instead of fear. Years later, we’re still
    admiring how not to let a crisis go to waste.


    ## Preparing for Battle


    While The Home Depot may be legendary in the way it executed its response, it
    certainly isn’t unique in suffering a breach in the first place. Since the time
    you started reading this chapter, more than 30,000 data records have been lost
    or stolen globally. That’s according to the Breach Level Index, which reports
    72 records are compromised each second.


    Time is never on the side of a responder, no matter the crisis. But in a breach,
    time works against your company in two ways. First, there’s the time required
    to discover the breach, what’s known as “dwell time” in the industry. Per Ponemon,
    the average dwell time was 197 days in 2018,^([6](#c06.xhtml#c6-note-0006)) more
    than six months of cybercriminals rummaging through a breached company’s systems
    before being detected. (Once identified, it takes companies, on average, an additional
    69 days to contain the breach.^([7](#c06.xhtml#c6-note-0007)) )


    Then, there’s the time required to notify constituents of the breach. Companies
    typically struggle on this front as well, since the forensic details of a cyberattack
    rarely come easy. The International Association of Privacy Professionals conducted
    a study for 18 months of cybersecurity incidents from 2016–2017. They found the
    average time from discovery of a breach to its notification to be 29 days.^([8](#c06.xhtml#c6-note-0008))
    As a comparison, the GDPR requires notification in 72 *hours.*


    The bar is undoubtedly high. But if we as storytellers have learned but one thing
    over a career of experience and training, it’s this: Luck favors the prepared.


    There are scores of valuable research studies on effective crisis communications,
    compiled over decades. Distilling it down, effective companies take two common
    approaches.^([9](#c06.xhtml#c6-note-0009)) It’s as though Blake and his team enacted
    the playbook that scholars have researched for decades:


    1.  *Successful companies communicate early and often*. When bad news breaks,
    your company is on trial in the court of public opinion. It should come as no
    surprise that the first tenet of effective crisis communications comes from those
    who defend others in a court of law. “Stealing thunder” originated in the legal
    field and pertains to revealing one’s mistakes before someone else does so (in
    a court of law, it’s the defendant doing so before the prosecution; in a court
    of public opinion, it’s the company doing so before the media). Stealing thunder
    is presumed to work since being first to break your own bad-news story instills
    credibility in your message and makes your revelation look less incriminating.
    To this latter point, your audience interprets the severity of your transgression
    based on who is sending the message—you or someone else. Specifically, they are
    more likely to assume your offense is *less* significant, precisely because you’re
    the one bringing it to light.^([10](#c06.xhtml#c6-note-0010)) Transparency is
    highly treasured in the courts of law and public opinion.


    *   Finally, it pays to be aggressive. Keeping stakeholders regularly informed
    is better than quietly retreating, hoping the problem will simply go away. While
    an aggressive communication approach initially caused a sharper drop in both stock
    prices and reputation scores for organizations suffering a crisis, those companies’
    stock prices and reputations also rebounded faster than their counterparts that
    chose a passive style.^([11](#c06.xhtml#c6-note-0011))


    2.  *Successful companies focus on the victim, not themselves*. This one is tougher
    than it may seem since it requires companies to express empathy for victims. Because
    companies are often reluctant to extend social graces, like public apologies,
    due to legal concerns, they can fall short on the victim-centered litmus test.
    Note that victim-centricity is necessary, but not always sufficient, in effective
    crisis communications. If victims believe the company could have done more to
    prevent the crisis or view the firm’s reputation poorly, more may be required,
    like victim compensation.^([12](#c06.xhtml#c6-note-0012))


    *   Many companies resist victim-centricity in their communications strategy and
    opt to deny responsibility instead. On this point, the research is clear. Denying
    a crisis for which the company is responsible results in a double-whammy. Not
    only is denial initially less effective but, when the facts later expose the company’s
    culpability, *another* crisis ensues. The only approach where denial is effective
    is when it is *known* that the company has no culpability.^([13](#c06.xhtml#c6-note-0013))


    *   Even though denial is a selective approach, communicators would be wise to
    bake several strategies with it at the core. In particular, there may be cases
    where a company is not directly responsible for a breach. For example, your customer
    may reuse the same password across multiple services, including one provided by
    your company. Say hackers compromised one of those other services and your customer’s
    password is sold on the Dark Web. Even though your company wasn’t responsible,
    how would you handle such notifications where something or someone else is to
    blame?


    *   Breach-by-association is one thing. Data weaponization is another. As organizations
    are learning, it’s no longer what cybercriminals can *take*, but what they can
    *fake.* Maybe it’s your reputation that bad actors most want. One threat vector
    could be to hack into your corporate email servers and expose sensitive or otherwise
    unflattering emails senders and recipients never intended for a public audience.'
