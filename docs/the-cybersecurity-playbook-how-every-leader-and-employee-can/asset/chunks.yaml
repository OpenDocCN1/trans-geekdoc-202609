    为了使转型目标变得更加难以实现，旧技术具有非常长的使用寿命。即使业务部门正急于部署云服务（无论是否获得 IT 部门的正式许可），仍有大量的长尾本地基础设施必须维护。以
    USB 闪存为例：2017 年，本·格里恩大学的研究人员记录了 29 种破坏 USB 驱动的已知攻击向量.^(7) 此外，无软件硬件加密 USB 盘的制造商
    Apricorn 在 2017 年报告称，虽然 90% 的员工使用 USB，但只有 20% 的人使用了加密.^(8)


    由于长尾遗留技术基础设施很少消失，而且消失绝不会很快，这些转型追求意味着范围和责任范围的风险性扩张。


    我们的首席信息安全官（CISO）该怎么办？如果轻率地支持一个全方位开放、随心所欲的环境，就会会让组织面临日益增加的风险。如果变成一个“拒绝”部门来遏制潜在威胁，他可能会被他必须保护的员工所架空（记得在普通公司中，那些在
    IT 专业人员不知情的情况下使用的近 2000 个云服务吗？）。


    CISO 处在一个不令人羡慕的境地。他必须在保护公司最宝贵的数字资产的同时，推进转型议程。遗憾的是，这些任务之间的矛盾可能再大不过了。


    ## 2. 风险管理


    网络犯罪是一门大生意——确切地说，2017 年是一项达 6000 亿美元的业务，比 2014 年增加了 1000 亿美元.^(9) 从全球影响来看，网络犯罪作为一种经济祸害排名第三，仅次于政府腐败和毒品交易。


    我们是如何走到这一步的？曾几何时网络安全相对“简单”。不仅安全局限于物理层面（如前所述），而且应对威胁要容易得多。2006 年，麦菲软件每天检测到 25 种新威胁。十年后，这个数字飙升到了
    50 万——每秒就有超过 5 个新威胁！


    数量只是挑战的一部分。过去发现威胁是直观的。威胁以恶意软件的形式出现——由坏人设计用于给受害者造成破坏的软件。网络安全行业谈论的是“传统”恶意软件，包括你已经熟悉并讨厌的那些讨厌的病毒。恶意软件曾经只带有一个静态代码字符串，让行业将其识别为恶意软件。可以将其视为一种软件指纹——网络安全行业称之为
    `signature`（签名）。就像执法部门依赖国家登记处根据指纹识别罪犯一样，网络安全行业寻找软件签名，将已知的恶意软件加载到自己的数据库中。如果在文件中发现
    `signature`，该文件将被拦截，威胁将被遏制。


    时代变了。最阴险的威胁不再显而见地戴着已知且易于识别的指纹出现。作坏者变得聪明得多。当你读到这段文字时，最新的网络安全威胁几乎肯定不在列表中，但在我写这些内容时，我的行业正痴于“无文件”攻击。这些威胁秘密地利用你组织内部受信任的技术，例如经过批准的工具和应用程序。然后它们进行破坏，通常是通过访问你公司更大的网络并窃取数据。


    我之所以说“通常”，是因为数据外泄不再是在线对手执行的唯一策略。勒索软件是网络安全的另一个热门话题，对手可能根本不会费力外泄数据并在暗网上出售。他们会通过锁定（或加密）受害者的文件，并在永久销毁之前索要密钥（或解密）的赎金金，从而缩短获取利润的路径。


    或者，数据和钱可能根本不是终极追求。对手可能更倾向于关闭对受害者关键系统的访问来制造破坏，在此过程中让公司陷入瘫痪。或者黑客可能进行信息战争，数据本身被武器化以制造混乱（想想你公司每天产生的数据量，以及对数据进行最微小的操纵就能给你的雇主造成多大的损害和困扰）。或者黑客想要你公司的声誉，正如麦菲软件从我们的社交媒体漏洞中吸取的惨痛教训那样。


    你明白状况了。威胁不仅呈指数级增长，而且变得显著更加复杂和阴险。威胁的数量、多样性和活力意味着更大的风险。


    根据德勤的数据，如何指望 CISO 能向他们的董事会解释这种复杂的现实？许多董事会每年平均次数少于六次，每次四小时。这意味着平均董事会每年只有 24 小时来涵盖从公司战略、财务表现到敏感的并购活动以及其之间的一切话题。网络安全作为一个话题，由于其高度的技术性和复杂性，被大多数董事会冷落，这又奇怪呢？


    但事实不必如此。网络安全确实具有很高的技术性。但它的核心非常直观。它从根本上是关于风险管理的——这是一种大多数董事成员自然精通的语言。


    CISO 在缓解风险方面不断走钢丝。他们必须在两者之间取得平衡：一方面处理可能不会导致灾难性影响的大量威胁，另一方面应对可能击垮一家公司的低频率、高针对性攻击。


    我们所有人，不论是董事成员还是其他人，都能对 CISO 在风险管理面临的挑战产生共鸣，因为我们在自己的生活中也走着同样的界线。我们在浴室里放防滑垫以防止跌倒风险（对于大多数某些年龄段来说，这是一个较小的风险）。我们在家里使用烟雾报警器，并购买保险单来缓解火灾等灾难性风险。而其他真正的灾难性风险，如被陨石击中是可能发生的（是的，这在
    1954 年确实发生在一个可怜的人身上^(10)），由于概率极低，我们安全地忽略了这些风险。


    CISO 必须以相同的方式对公司分类。CISO 的挑战在于简化网络安全话题，而不是在此过程中使其机械。董事成员的责任是什么？参与讨论，意识到表面下复杂的局面很少、甚至永远产生一个清晰的决策。战争不会产生清晰性，网络安全亦然。


    ## 3. 自动化与效率


    “以少胜多”是现代企业一种令人厌烦的陈词。这也是 CISO 不幸的使命。威胁的数量没有缓解迹象，而且对网络安全专业人才的需求远超过劳动力市场的人才供应。根据
    Cybersecurity Ventures 的数据，到 2021 年将有超过 350 万个网络安全职位空缺（(11)——这足以填满 50 个 NFL 球场！


    问题只会变得越来越糟糕。2014 年，网络安全行业估计全球范围内缺口百万专业人士。2015 年，缺口扩大到 150 万个职位。2016 年，预测者认为 2019
    年网络安全人才短缺将达到 200 万专业人士.^(12) 随着威胁持续增加，对合格网络安全人才的需求也在不断扩大。


    '
- fmt: '

    Given there aren’t enough people to throw at the problem, CISOs have resorted
    to a cavalcade of products from a vast battalion of cybersecurity vendors vying
    for cybersecurity dollars to fill the void. In stark contrast to the shortage
    in the labor market, there’s an overwhelming surplus of cybersecurity products
    vying for the CISO’s limited dollar. As of this writing, there are 3,500 cybersecurity
    vendors courting CISOs. Each vendor offers one or more defensive technologies,
    many promising to solve a small (if not large) portion of the cybersecurity challenge.


    There can be too much of a good thing. And the abundance of cybersecurity technologies
    available to the CISO is illustrative of this axiom. CISOs, attempting to demonstrate
    value and anticipate the next threat, have historically rushed to adopt the latest
    defensive technology for their arsenal against the adversary.


    But they’ve gotten the short end of the stick in executing this strategy. That’s
    because the fragmented vendor landscape that competes for every dollar is itself
    a complex quagmire of technologies that, for the most part, don’t work well together.
    Too often, this technology is promoted, purchased, and put on the shelf. Budgets
    are spent, “shelfware” grows, and organizations are no more secure for the innovations,
    intentions, or investment. Even if the technology makes its way off the shelf
    and into deployment, chances are it’s not integrated with the rest of the organization’s
    defenses.


    Imagine going to war with a cluttered mess of artillery in your inventory. Picture
    being inconsistent in deploying this weaponry to cover your bases against your
    enemy sufficiently. Now envision your fighters not being able to communicate with
    one another to share information about the threats they encounter to collectively
    bolster your coordinated defense.


    You likely don’t have to imagine it. If your company has one, just visit its security
    operations center (`SOC`), the nerve center where your cybersecurity colleagues
    stand as first responders between your company and unending attacks. These front-line
    cybersecurity professionals have often inherited a patchwork of technologies and
    tools acquired over the years, usually adopted over multiple CISO regimes in their
    companies. Many of these products do not share threat intelligence, let alone
    make the jobs of cybersecurity professionals any easier. All too often, you’ll
    find your cybersecurity colleagues working for their tools, rather than their
    tools working for them.


    Enterprise Strategy Group (`ESG`), an independent industry analyst that studies
    the cybersecurity market, reports that 40 percent of organizations have more than
    25 cybersecurity tools deployed. Roughly the same percent admit to manually collecting
    intelligence feeds. And 27 percent believe the security team spends most of its
    time fighting fires, rather than working on strategic projects, leading to staff
    burnout and turnover—disastrous consequences for a CISO confronting a global talent
    shortage crisis.


    As if that weren’t enough, there’s a dirty, unavoidable secret inherent in the
    cybersecurity industry. It’s this: no one product can defeat cybercrime. You may
    not find this surprising. After all, it would be the equivalent of going into
    a sustained war with just one weapon in your arsenal. You wouldn’t do it and expect
    to last long.


    But there’s more to this reality. It’s not just that there isn’t a proverbial
    silver-bullet defense that inoculates all threats. It’s that every defensive technology
    is most effective when it is first deployed.


    ## W.I.S.D.O.M. for the Board and CEO


    ### The Reality of the Cybersecurity Landscape

    The fragmented vendor landscape is a complex quagmire of technologies that often
    do not work together, leading to "shelfware" and burnout. No single product can
    defeat cybercrime. Every defensive technology is most effective when it is first
    deployed.


    ### Strategic Priorities for the CISO

    To navigate this environment, CISOs must focus on:

    *   **Integration**: Ensuring technologies are integrated with the rest of the
    organization’s defenses.

    *   **Automation**: Using automation to free up staff from manual tasks like collecting
    intelligence feeds.

    *   **Unified Defense**: Moving beyond a patchwork of tools to a coordinated defense
    strategy.

    *   **Early Adoption**: Understanding the risks of deploying new technologies
    without compromising overall security posture.

