- fmt: "\nHere’s what makes bed bugs so difficult to eradicate. You can have the cleanest\
    \ house in the world. You could disinfect your bedding religiously. You could\
    \ do the same for pajamas or any other clothing that should touch your place of\
    \ slumber. But if you happen to travel to a hotel or in an airplane that is infested,\
    \ it takes just one pesky bed bug to hitch its wagon to your star (in this case,\
    \ your luggage or what’s packed inside) and make its way to your domicile.\n\n\
    The problem is even worse if you happen to live in an apartment building or other\
    \ multi-dwelling unit. Now, it just takes the neighbor with whom you happen to\
    \ share a wall to be a bit laxer than you are in his standards, and you may find\
    \ yourself with unwelcome inhabitants in your home (yes, these determined parasites\
    \ can move along and through wall voids, using plumbing and electrical chaseways\
    \ as their routes).\n\nIf that isn’t bad enough, because there is such a stigma\
    \ associated with bed bugs, most people are loath to admit they cohabitate with\
    \ these bloodsuckers. By the time they concede they have a problem and seek help,\
    \ they may be facing an all-out infestation. If you happen to spend the night\
    \ (as in a hotel) or share a wall (as in neighbor)—you get the idea. . . .\n\n\
    Bed bugs are an unfortunate reminder of how dependent we are on one another. It\
    \ isn’t a matter of leaning on our neighbors for help. It’s about trusting them\
    \ to know their environment (nearly 50 percent of people with bed bugs in one\
    \ study didn’t even know they had them) and to seek professional help to eliminate\
    \ them.\n\nWhat a fascinating allegory to cybersecurity. Companies do not operate\
    \ on islands unto themselves but do so in highly complex, interconnected ecosystems.\
    \ While a company may practice sound cybersecurity hygiene, it must rely on its\
    \ neighbors—any third party with whom it does business and has some connection\
    \ to its systems—to do the same. Otherwise, it leaves itself open to insidious\
    \ predators using side doors and back doors to infiltrate. (By the way, the “systems”\
    \ connected in this case need not necessarily be through extensive networks. Think\
    \ back to the cybersecurity hygiene practices covered in Chapter 3. All it takes\
    \ is a careless partner leaving a `USB` or `laptop` with your company’s sensitive\
    \ files unattended and unencrypted, and your company is exposed.)\n\nFor all the\
    \ decades we enjoyed living a relatively bed-bug-free existence, we’re reminded\
    \ that what is old can be new again. And the more things change, the more they\
    \ stay the same. We’re once again lamenting bed bugs in spite of all the progress\
    \ once made against them.\n\nWhile change is the only constant in business, many\
    \ `CFOs` can still rest in one certainty: They manage procurement for their companies.\
    \ Since this largely remains a finance function, the `CFO’s` kinship with the\
    \ `CISO` is about to get a lot closer.\n\nJust as bed bugs remind us how reliant\
    \ we are on one another to be vigilant against infiltrators, third-party relationships\
    \ serve as additional points of exposure adversaries can exploit to inflict harm\
    \ on our companies. Consider the following points from `Ponemon` that reflect\
    \ the sobering reality:\n\n*   59 percent of organizations confirm they experienced\
    \ a breach due to one of their third parties.\n*   Only 29 percent state they\
    \ would learn of such a breach from the third party itself.\n*   76 percent say\
    \ the number of cybersecurity incidents involving vendors is increasing, yet only\
    \ 46 percent agree that managing outsourced relationship risks is a priority.\n\
    *   57 percent don’t know whether their organizations’ vendor safeguards are sufficient\
    \ to prevent a breach.\n\nOn the positive side, there’s plenty of room for improvement\
    \ in these metrics. Third-party security management is relatively new for many\
    \ organizations. It’s also critically important, as the above numbers show. `CFOs`\
    \ carry the flag for their organizations in ensuring the procurement process sufficiently\
    \ vets third parties’ cybersecurity posture. Here’s an area where your `CISO`\
    \ will help you ask the right questions.\n\nOf course, the ultimate trusted third-party\
    \ relationship is one in which a company outsources a function, or part of it,\
    \ entirely. `Deloitte` conducted a global study in 2016 examining the outsourcing\
    \ lifecycle and key trends. The top function reported as outsourced? `IT`, with\
    \ a whopping 72 percent of organizations outsourcing at least a part of the function\
    \ and 31 percent planning to increase the same.\n\nIt was once absurd to consider\
    \ outsourcing one’s cybersecurity environment. But it appears cybersecurity is\
    \ following in the footsteps of its IT ancestors, as it’s becoming more acceptable\
    \ to let third parties protect an organization’s most prized digital assets. Of\
    \ course, the global cybersecurity talent shortage just adds more fuel to the\
    \ fire. Rather than compete vociferously for cybersecurity talent that just isn’t\
    \ in the market, companies are opting to hire third parties with this expertise\
    \ to at least augment internal staffing capabilities.\n\nIn particular, the areas\
    \ of the security operations center (`SOC`) most likely to be outsourced include\
    \ `penetration testing` (75 percent of organizations outsource), `threat intelligence\
    \ collection and feeds` (54 percent), and `digital` and `malware forensics` (51\
    \ percent). \n\nThere are several pros to outsourcing one or more areas of the\
    \ cybersecurity function. As is the case with most outsourcing, companies stand\
    \ to save money and minimize upfront capital expenditures by hiring third parties\
    \ with comparable cybersecurity infrastructure. Companies may also mitigate the\
    \ risk of obsolescence by negotiating service level agreements with these managed\
    \ security service providers (`MSSPs`) to dictate terms of technology refresh.\
    \ Finally, `MSSPs` specialize in cybersecurity. They can focus on this core competency,\
    \ leaving more time for their customers to focus on theirs.\n\nAs with most topics\
    \ in this book, this one is imbued with several shades of gray. While outsourcing\
    \ a portion of one’s cybersecurity program is perfectly suitable for many companies\
    \ (particularly those with harsher staffing constraints), cybersecurity is somewhat\
    \ like charity—it starts at home. Abdicating complete responsibility of one’s\
    \ cybersecurity posture to a third party is risky business indeed. What an `MSSP`\
    \ makes up for in cybersecurity experience, it lacks in understanding of your\
    \ company’s unique environment. Because of this, it may miss anomalies in your\
    \ environment that a dedicated internal team would readily spot. Because an `MSSP`\
    \ supports multiple customers (on one hand, a positive benefit since it has perspective\
    \ on trends across broader markets), you may find less time dedicated to your\
    \ company’s needs—all of which can result in a sub-optimized cybersecurity posture\
    \ should your company toss the keys over completely to an `MSSP`.\n\nThis is yet\
    \ another area in which `CFOs` and their teams should exert considerable influence.\
    \ Outsourcing is not bad, per se, but the terms of a relationship with a trusted\
    \ `MSSP` must be carefully crafted to generate positive outcomes. No company cares\
    \ more about your organization’s cybersecurity posture than you do. This is not\
    \ a case for complete abdication of cybersecurity. It’s an opportunity for mutual\
    \ partnership to leverage core competencies and additional staffing for maximum\
    \ gain.\n\n## W.I.S.D.O.M. for the Finance Professional\n\nAs the organization’s\
    \ key allocators of resources and budget, finance professionals have much to offer\
    \ a culture of cybersecurity, specifically, **help CISOs and their teams speak\
    \ the language of the business**. This requires losing language that doesn’t fit\
    \ cybersecurity—in particular, “return on investment.” Once `CFOs` relieve `CISOs`\
    \ of the burden to answer an impossible question, the teams can work together\
    \ in earnest to define the value of cybersecurity investments to the business.\n"
  raw: 'Here’s what makes bed bugs so difficult to eradicate. You can have the cleanest
    house in the world. You could disinfect your bedding religiously. You could do
    the same for pajamas or any other clothing that should touch your place of slumber.
    But if you happen to travel to a hotel or in an airplane that is infested, it
    takes just one pesky bed bug to hitch its wagon to your star (in this case, your
    luggage or what’s packed inside) and make its way to your domicile.


    The problem is even worse if you happen to live in an apartment building or other
    multi-dwelling unit. Now, it just takes the neighbor with whom you happen to share
    a wall to be a bit laxer than you are in his standards, and you may find yourself
    with unwelcome inhabitants in your home (yes, these determined parasites can move
    along and through wall voids, using plumbing and electrical chaseways as their
    routes).


    If that isn’t bad enough, because there is such a stigma associated with bed bugs,
    most people are loath to admit they cohabitate with these bloodsuckers. By the
    time they concede they have a problem and seek help, they may be facing an all-out
    infestation. If you happen to spend the night (as in a hotel) or share a wall
    (as in neighbor)—you get the idea. . . .


    Bed bugs are an unfortunate reminder of how dependent we are on one another. It
    isn’t a matter of leaning on our neighbors for help. It’s about trusting them
    to know their environment (nearly 50 percent of people with bed bugs in one study
    didn’t even know they had them^([5](#c07.xhtml#c7-note-0005)) ) and to seek professional
    help to eliminate them.


    What a fascinating allegory to cybersecurity. Companies do not operate on islands
    unto themselves but do so in highly complex, interconnected ecosystems. While
    a company may practice sound cybersecurity hygiene, it must rely on its neighbors—any
    third party with whom it does business and has some connection to its systems—to
    do the same. Otherwise, it leaves itself open to insidious predators using side
    doors and back doors to infiltrate. (By the way, the “systems” connected in this
    case need not necessarily be through extensive networks. Think back to the cybersecurity
    hygiene practices covered in Chapter 3. All it takes is a careless partner leaving
    a USB or laptop with your company’s sensitive files unattended and unencrypted,
    and your company is exposed.)


    For all the decades we enjoyed living a relatively bed-bug-free existence, we’re
    reminded that what is old can be new again. And the more things change, the more
    they stay the same. We’re once again lamenting bed bugs in spite of all the progress
    once made against them.


    While change is the only constant in business, many CFOs can still rest in one
    certainty: They manage procurement for their companies. Since this largely remains
    a finance function, the CFO’s kinship with the CISO is about to get a lot closer.


    Just as bed bugs remind us of how reliant we are on one another to be vigilant
    against infiltrators, third-party relationships serve as additional points of
    exposure adversaries can exploit to inflict harm on our companies. Consider the
    following points from Ponemon^([6](#c07.xhtml#c7-note-0006)) that reflect the
    sobering reality:


    *   59 percent of organizations confirm they experienced a breach due to one of
    their third parties.


    *   Only 29 percent state they would learn of such a breach from the third party
    itself.


    *   76 percent say the number of cybersecurity incidents involving vendors is
    increasing, yet only 46 percent agree that managing outsourced relationship risks
    is a priority.


    *   57 percent don’t know whether their organizations’ vendor safeguards are sufficient
    to prevent a breach.


    On the positive side, there’s plenty of room for improvement in these metrics.
    Third-party security management is relatively new for many organizations. It’s
    also critically important, as the above numbers show. CFOs carry the flag for
    their organizations in ensuring the procurement process sufficiently vets third
    parties’ cybersecurity posture. Here’s an area where your CISO will help you ask
    the right questions.


    Of course, the ultimate trusted third-party relationship is one in which a company
    outsources a function, or part of it, entirely. Deloitte conducted a global study
    in 2016 examining the outsourcing lifecycle and key trends. The top function reported
    as outsourced? IT, with a whopping 72 percent of organizations outsourcing at
    least a part of the function and 31 percent planning to increase the same.^([7](#c07.xhtml#c7-note-0007))


    It was once absurd to consider outsourcing one’s cybersecurity environment. But
    it appears cybersecurity is following in the footsteps of its IT ancestors, as
    it’s becoming more acceptable to let third parties protect an organization’s most
    prized digital assets. Of course, the global cybersecurity talent shortage just
    adds more fuel to the fire. Rather than compete vociferously for cybersecurity
    talent that just isn’t in the market, companies are opting to hire third parties
    with this expertise to at least augment internal staffing capabilities.


    In particular, the areas of the security operations center (SOC) most likely to
    be outsourced include penetration testing (75 percent of organizations outsource),
    threat intelligence collection and feeds (54 percent), and digital and malware
    forensics (51 percent).^([8](#c07.xhtml#c7-note-0008))


    There are several pros to outsourcing one or more areas of the cybersecurity function.
    As is the case with most outsourcing, companies stand to save money and minimize
    upfront capital expenditures by hiring third parties with comparable cybersecurity
    infrastructure. Companies may also mitigate the risk of obsolescence by negotiating
    service level agreements with these managed security service providers (MSSPs)
    to dictate terms of technology refresh. Finally, MSSPs specialize in cybersecurity.
    They can focus on this core competency, leaving more time for their customers
    to focus on theirs.


    As with most topics in this book, this one is imbued with several shades of gray.
    While outsourcing a portion of one’s cybersecurity program is perfectly suitable
    for many companies (particularly those with harsher staffing constraints), cybersecurity
    is somewhat like charity—it starts at home. Abdicating complete responsibility
    of one’s cybersecurity posture to a third party is risky business indeed. What
    an MSSP makes up for in cybersecurity experience, it lacks in understanding of
    your company’s unique environment. Because of this, it may miss anomalies in your
    environment that a dedicated internal team would readily spot. Because an MSSP
    supports multiple customers (on one hand, a positive benefit since it has perspective
    on trends across broader markets), you may find less time dedicated to your company’s
    needs—all of which can result in a sub-optimized cybersecurity posture should
    your company toss the keys over completely to an MSSP.


    This is yet another area in which CFOs and their teams should exert considerable
    influence. Outsourcing is not bad, per se, but the terms of a relationship with
    a trusted MSSP must be carefully crafted to generate positive outcomes. No company
    cares more about your organization’s cybersecurity posture than you do. This is
    not a case for complete abdication of cybersecurity. It’s an opportunity for mutual
    partnership to leverage core competencies and additional staffing for maximum
    gain.


    ## W.I.S.D.O.M. for the Finance Professional


    As the organization’s key allocators of resources and budget, finance professionals
    have much to offer a culture of cybersecurity, specifically, **help CISOs and
    their teams speak the language of the business**. This requires losing language
    that doesn’t fit cybersecurity—in particular, “return on investment.” Once CFOs
    relieve CISOs of the burden to answer an impossible question, the teams can work
    together in earnest to define the value of cybersecurity investments to the business.'
