    \n# CHAPTER 4  \n\nStop the Line\n\n> *Cybersecurity is viewed as a critical defensive\
    \ effort for our business. If you think about what we do and what we provide—water—in\
    \ the event of something compromising our systems and if our customers lose faith\
    \ in our ability to provide good, clean, safe drinking water, it’s catastrophic.*\n\
    \n> \n\n> CEO, Utilities Company\n\nThe year was 2017. We saw the beginnings of\
    \ an investigation of suspected tampering by Russians in the U.S. presidential\
    \ election. We witnessed the rise of the #MeToo movement and the subsequent fall\
    \ of entertainment and business tycoons crushed under its weight. We endured catastrophic\
    \ losses, courtesy of Mother Nature’s wrath, with some of the most devastating\
    \ hurricanes in recent history, including Harvey, Irma, and Maria.\n\nAmid all\
    \ this turmoil that seemed to characterize 2017, we lost a luminary whose contributions\
    \ to business will remain with us long into the foreseeable future. Tatsuro Toyoda,\
    \ son of the founder of the Japanese automotive company Toyota, passed away quietly\
    \ and without much media fanfare on December 30. He was 88 years old.\n\nYou’re\
    \ more than likely familiar with auto giant Toyota. But you may not realize how\
    \ profoundly one of its forefathers, Toyoda-san, influenced the way you and I\
    \ do business today.\n\nTo understand Toyoda’s impact, we must go back to a different\
    \ era—the early 1980s—when he took the reins of his company’s first American factory.\
    \ At the time, American auto manufacturers dominated in market share. General\
    \ Motors (GM) was far and away the world’s largest car company. Despite its success,\
    \ it had a challenge: the U.S. government’s emission guidelines forced auto companies\
    \ to produce small, fuel-efficient cars, and GM had historically struggled in\
    \ doing so. At the same time, there was a disturbing trend emerging in the U.S.\
    \ auto market overall. Japanese car companies were starting to grab market share\
    \ fast—so much so that the U.S. Congress was threatening to restrict auto imports.\n\
    \nThis strange confluence of real and potential U.S. regulations—one that forced\
    \ GM to produce small, fuel-efficient cars and another that threatened to limit\
    \ Toyota’s car imports—created the unlikeliest of unions. Toyota and GM, fierce\
    \ competitors in the market, became partners of sorts. The two companies teamed\
    \ up to open a joint plant in Fremont, CA, home to a former GM production facility.\n\
    \nEach competitor got value from the interesting arrangement. Toyota would build\
    \ GM a quality fuel-efficient small car that would finally turn a profit. In the\
    \ process, GM would gain access to Toyota’s manufacturing principles—literally\
    \ peeking in the cupboard to discover its competitor’s secret sauce. In turn,\
    \ Toyota would learn to build cars in the United States and mitigate the risk\
    \ of future car import restrictions.\n\nNow, about that former GM plant in Fremont.\
    \ If this “partnership” between two rivals wasn’t weird enough, the location they\
    \ chose to set up shop bordered on the bizarre. The former GM plant in Fremont\
    \ was an unmitigated disaster. Bruce Lee, who ran the western region for the United\
    \ Auto Workers union at the time, called the Fremont employees “the worst workforce\
    \ in the automobile industry in the United States.”^([1](#c04.xhtml#c4-note-0001))\
    \ Their behavior was infamous in the industry—from record absenteeism to lewd\
    \ acts on the factory floor to sabotaging cars for the chance to earn overtime\
    \ to fix them. If conduct was any indicator, these employees hated their jobs\
    \ and their employer.\n\nYou may not find GM and Toyota’s decision to establish\
    \ their new joint operation in a manufacturing facility that had bad history as\
    \ unusual. After all, why throw a baby out with the bathwater? The physical plant\
    \ may have been completely acceptable. But the labor force needed changing—badly.\n\
    \nBut GM and Toyota didn’t change the employees. In fact, they hired 85 percent\
    \ of that former Fremont workforce (described as the worst in America by one of\
    \ their own union leaders) to tackle the challenge of producing a profitable and\
    \ high-quality fuel-efficient automobile—something GM hadn’t accomplished in the\
    \ *best* of its U.S. plants.\n\nPerhaps even more surprising, they flew some of\
    \ those former Fremont employees to Japan to learn how to build cars the Japanese\
    \ way. The first car, a yellow Chevrolet Nova, rolled off the assembly line in\
    \ December of 1984. Almost right away, the Fremont plant was producing cars at\
    \ the same speed and with as few defects per 100 vehicles as those produced in\
    \ Japan.\n\nWhat exactly was it that allowed Toyota to produce the first quality\
    \ small car for GM using virtually the same workforce that was so subpar under\
    \ the GM regime? It wasn’t a secret sauce as much as it was a secret ingredient:\
    \ continuous improvement."
