  raw: 'It’s hard to believe, but hijacking became such a common occurrence during
    those years that passengers simply accepted it as part of the air travel experience.
    In 1968, *Time* somewhat poked fun at the hijacking plague with an article aptly
    titled, “What to Do When the Hijacker Comes.” In it, the journalist reports of
    more than 1,000 Americans diverted to Cuba over the previous eleven months. While
    “pilots carry maps of Havana’s Jose Marti Airport just in case, and stewardesses
    are instructed not to argue with would-be hijackers—simply to obey their orders
    . . . nobody has yet thought to brief the poor passengers.”^([8](#c09.xhtml#c9-note-0008))


    The author graciously obliges with some dos and don’ts should one find herself
    an unwitting passenger on a hijacked plane—like don’t be aggressive, don’t panic,
    don’t push the call button (lest the ding startle the hijacker causing him to
    unintentionally discharge his weapon), and don’t call aloud for the “stewardess.”
    When the flight arrives in Cuba, the journalist suggests two dos: Do stay calm
    and do enjoy the stay (the article even offers some helpful details on comfortable
    overnight accommodations in the area).


    How did airlines handle the persistent threat? They complied with the hijackers.
    If a skyjacker wanted to land in Cuba (or anywhere else), pilots would divert
    the flight. All cockpits were equipped with maps of the Caribbean Sea, regardless
    of a flight’s intended destination, given the popularity of Cuba as a hijacking
    destination at the time. Further, pilots were given popular phrase cards in Spanish
    to help them communicate with Cuba-bound skyjackers (such as learning how to say
    “I must open my flight bag for maps” or “Aircraft has mechanical problems—can’t
    make Cuba”).^([9](#c09.xhtml#c9-note-0009)) If the perpetrator wanted money, airlines
    would pay the ransom and hope for its return upon the subject’s arrest. Airlines
    fought tenaciously to protect their existing lax security controls, outright resisting
    deterrents like metal detectors that would thwart skyjackers since they didn’t
