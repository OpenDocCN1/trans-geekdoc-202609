    - 但为什么要止步于此？对手正开始操纵受害者的心理，就像他们历史上操纵受者的资金一样。也许在“泄露”曝光时，他们会混入一些虚假邮件。当这些伪造信息与真实邮件混在一起时，它们极难识别，更难以解释。传播专家必须预见到他们如何对那些损害品牌声誉的、明显伪造的邮件（或其他文件）有效地否认责任，以免发现自己的公司沦为由敌人制造的“自身都市传说”中的头主角。


    虽然对于传播专家来说，网络安全攻击是一个较新的现象，但危机并非如此。我们可以从这些研究领域汲取智慧应用到我们自己的行动蓝图中。


    ## 营销人员/传播者的 W.I.S.D.O.M. 准则


    如果天青眷有准备的人，你需要在泄露发生很久以前做好计划。否则，时间不会站在你这边。当宝贵的分钟一分流逝时，你最不希望看到你的执行团队被恐惧或愤怒等冲动情绪支配，因为这些情绪会蒙蔽理性思考。


    ### 构建一个获得高层明确支持的多维度沟通计划。

    在这次练习中要像 `CISO` 一样思考。`CISOs` 必须向董事会提供资产风险视角。在此练习中，并非所有资产都是同等的。你需要根据攻击的类型和严重程度，对公司应该做的事情进行同样的工作。并非所有攻击都是平等的。


    与你的 `CISO` 合作，识别公司面临的常见威胁，例如网站篡改、勒索软件、客户记录泄露、员工记录泄露等。从那开始，针对每种情况对你的通知原则做出非常具体的规定。


    - 即使法律没有要求，你会通知吗？

    - 如果你的公司对这次攻击不负责呢？这将如何改变你的信息的语气和内容？（考虑之前提到的“关联泄露”或“数据武器化”案例。）

    - 你会在什么时候通知？要意识到越早越有利于引导舆论。事实上，关于危机传播的研究表明，最佳时机是事件发生后的一小时内。

    - 你会通知谁？

    - 如果你没有立即获得所有信息（这在泄露中很可能是事实），你会说什么？

    - 你愿意为客户提供什么补偿，或作为展示以受害者为中心的同情心的表现（例如，提供免费的身份保护，或愿意承担客户因信用卡泄露造成的损失）？


    让你的 `CEO` 和执行领导团队参与这次练习，并对根据攻击的严重程度来决定如何沟通、何时沟通以及沟通什么的指导原则达成共识。


    这次练习需要几周、甚至几个月才能充分完成。由于你的公司很可能已经在遭受攻击只是还不知道，因此将一个基于共识的计划正式化是你的首要任务。


    ### 为你计划中识别的每种场景创建沟通模板。

    与 `Legal` 部门合作来构思每条信息的框架。编写电子邮件、网页文案、博客、电话脚本、新闻稿、媒体声明和其他资产，并为细节留出占位符，以便在攻击发生时填充。准备好网站（内部和外部）的阶段，以便在泄露发生时可以快速上线并传达泄露细节。


    信息必须在指令和语气之间取得正确的平衡。当危机发生时，客户希望知道你的公司考虑了他们的最佳利益，并且局面在控制之中。遗憾的是，泄露事件很少能在这两点上都给你的公司灵活性。


    在证明公司控制着局面方面，请坚持使用以下模板蓝图：


    - 谁受到了影响？

    - 丢失、被盗或以其他方式受到损害的数据和系统系统有哪些？

    - 泄露发生在什么期间？

    - 利益相关者需要采取哪些预防措施？

    - 公司正在采取哪些行动来纠问题并降低再次发生的风险？


    即使你的公司尚未获得所有信息，尽早准确地传达你已有的细节也能让你抢占先机（steal thunder）。


    接下来，在语气方面，在信息中表现出同理心的同时保护你的法律利益——这是在练习早期让 `Legal` 参与的关键原因。关于这一点，让 `Legal` 审核所有模板化信息，这样当泄露发生时，一旦你插入了剩余细节，你就离获得最终批准更近。


    我们讨论过同理心的重要性。这一经过实践检验的危机传播准则在数据泄露领域被证明是正确的。`Ponemon` 调查了在 2014 年因数据泄露后与公司终止关系的消费者。当被问及这些公司可以做什么来维持关系时，更多的消费者想要一个诚恳的道歉（43%），而不是免费的身份盗窃保护和信用卡监控服务（41%）。


    根据语气匹配你的语言。同理心不适用于技术术语或法律术语。消费者一眼就能看穿虚假的道歉。`Ponemon` 2012 年的另一项研究发现，约三分之一的消费者对他们收到的泄露后沟通内容的篇幅或法律术语表示不满。


    ### 为每种攻击场景设计倒计时时间表（tick-tock schedule）。

    网络安全的货币是时间。据此设计你的计划。为每种攻击向量制定到分钟的计划。在发现公司遭泄露的最初几分钟内，你可能不会获得所有信息。


    幸运的是，你的沟通计划将指导你的执行团队可以发布哪些内容以及何时发布。因为你是在没有时间压力的情况下建立此项计划的，所以你在提交证据证明“早期且频繁的沟通是有回报的”时，会更具说服力（记住
    Home Depot 是一个完美的例子）——即使并非所有事实都随时可用。


    你的倒计时时间表应该确定在计划的每个阶段谁负责向利益相关者发布信息和/资产。超过 60% 的消费者表示，如果机构立即通知他们，他们对泄露公司响应的满意度将大大提高。


    ### 确保你的计划包含了员工，

    无论员工记录是否被泄露。在危机期间，员工（可能比客户更需要）需要确认雇主正处于控制之中。员工是公司最好的品牌大使。如果你让他们对细节一无所知，他们就无法帮助你传播信息，让你再次成为“朋友传朋友”流言的潜在受害者。积极与员工互动以争取他们的支持并缓解焦虑。在策略方面，考虑不仅限于电子邮件和内网更新。至少召开一次全体会议来解释情况。此外，每天在固定时间开放电话热线（例如
    30 分钟），让感兴趣的员工了解最新进展并回答任何问题。


    **练习、练习、再练习。** `CISOs` 进行红队演习（red-teaming），通过对组织模拟攻击来识别漏洞并加强防御。同样，`CMOs` 也应该进行危机演习，以测试团队按照计划响应的有效性。危机管理专家建议至少至少一次，以建立组织的肌肉记忆。


