- fmt: "\nTheir evidence suggests the most successful male Googlers answered “4” when\
    \ asked this interview question. Google finds that men tend to inflate their experience\
    \ or qualifications. The score most likely to predict success for female candidates?\
    \ A perfect 5, as Google finds women are more likely to be reserved and humble.\
    \ (Of course, Google will now have to come up with additional interview questions\
    \ to determine success, given their secret is out!)\n\nFor all these reasons,\
    \ McAfee uses a panel interview approach for most positions. And we place at least\
    \ one female or minority on every interview panel to represent the same diversity\
    \ we aspire to recruit.\n\n### Eliminating Recruitment Bias\n\nFinally, eliminate\
    \ the bias that may have your company seeking only professionals with prior cybersecurity\
    \ experience. There aren’t enough of them in the market. We can’t keep poaching\
    \ from one another, driving up wages, and churning talent in the process. So eliminate\
    \ questions that bias your company against candidates with different backgrounds.\
    \ For instance, asking a candidate to tell you about the latest hot innovation\
    \ he finds interesting in cybersecurity disadvantages those with less hands-on\
    \ experience (as we learned from the history lesson of the PC). Ensure your questions\
    \ pick up STEAM—pun intended—when looking for qualified candidates.\n\nI walked\
    \ into McAfee without having a lick of cybersecurity experience in my background.\
    \ Within six months, I had co-authored a book on the topic. I’m not minimizing\
    \ the complexity of the industry. But I am suggesting that skills are transferable.\
    \ Look for candidates with technical skills in other fields. You’ll find technical\
    \ industries, like telecom, that aren’t in the same zero-percent unemployment\
    \ state. Technology lends itself to ebbs and flows in different labor markets.\
    \ Expand your aperture for qualified talent with transferable skills, whether\
    \ candidates have prior cybersecurity experience or not.\n\n### Embedding Security\
    \ in Company Values\n\nOn the enlistment side of the coin, you can pull multiple\
    \ levers to embed cybersecurity in the day-to-day jobs of employees, without overwhelming\
    \ them in the process. First, `search your company values`—those standards for\
    \ conduct or guiding principles that you expect employees to uphold—`and see where\
    \ you can add one word to change their meaning in a profound way: `security`.`\n\
    \nFor example, in exploring my former stomping grounds at a prior employer, Verizon,\
    \ I found the company has an impressive credo featured on their website at the\
    \ time of this writing. Let’s take a look at how inserting just one word can expand\
    \ meaning without compromising intent (italics mine, to suggest the addition):\n\
    \n> We have work because our customers value our high-quality communications services.\n\
    \n> We deliver superior customer experiences through our products and our actions.\
    \ Everything we do we build on a strong network, systems and process foundation.\
    \ The quality, reliability *and security* of the products we deliver are paramount.\
    \ Customers pay us to provide them with services that they can rely on.\n\nOne\
    \ word can change scope without altering purpose.\n\nNow this isn’t a game of\
    \ Cybersecurity Bingo. There are values or guiding principles where security just\
    \ doesn’t fit. Don’t force a square peg in a round hole. Case in point from Verizon’s\
    \ example:\n\n> We know teamwork enables us to serve our customers better and\
    \ faster.\n\n> We embrace diversity and personal development not only because\
    \ it’s the right thing to do, but also because it’s smart business. We are driven\
    \ not by ego but by accomplishments. We keep our commitments to each other and\
    \ our customers. Our word is our contract. We respect and trust one another, communicating\
    \ openly, candidly and directly since any other way is unfair and a waste of time.\
    \ We voice our opinion and exercise constructive dissent, and then rally around\
    \ the agreed-upon action with our full support. Any one of us can deliver a view\
    \ or idea to anyone else, and listen to and value another’s view regardless of\
    \ title or level. Ideas live and die on their merits rather than where they were\
    \ invented.\n\nI happen to love that excerpt from Verizon’s credo. But, try as\
    \ I might, I couldn’t find a way to naturally insert “security” in what is already\
    \ stated beautifully.\n\nThat’s okay. While you won’t contrive a home for security\
    \ in a company value where it doesn’t belong, you’ll likely find at least one\
    \ where it easily does. Assuming your values are more than fancy copy on the back\
    \ of an employee’s badge, you’ll begin to seed security into your company’s foundation\
    \ by rooting out non-secure behaviors and implanting secure ones in their place.\n\
    \n### Rewards and Recognition\n\nNext, let’s look at your `rewards and recognition\
    \ programs` to find a natural home for cybersecurity achievements. The first is\
    \ clear and easy. Show some love to your cybersecurity team. As mentioned in Chapter\
    \ 2, they’ve been relegated to the backstage of your company for too long. Bring\
    \ them out from behind the curtain.\n\nHow? Give your `CISO` a voice in some company\
    \ all-hands meetings. She doesn’t need to be a perennial fixture in every company\
    \ event. But you can certainly expose her and her team’s accomplishments for the\
    \ broader employee population to understand the attack landscape and the importance\
    \ of cybersecurity defense. Beyond enlisting more recruits to the fight, a little\
    \ appreciation goes a long way and may help stymie high turnover rates (thanks\
    \ to that nonexistent unemployment rate) in your cybersecurity ranks.\n\nNext,\
    \ expand your rewards and recognition programs to include cybersecurity. I mentioned\
    \ in the last chapter about the importance of stopping the line for a new product\
    \ or service release whenever security is subpar. Use your company’s recognition\
    \ platform to publicly credit employees—whether in cybersecurity or not—for raising\
    \ valid security concerns that stop any such product or service from ever reaching\
    \ the market.\n\n### Addressing Malicious Insiders\n\nNow it’s time to address\
    \ the elephant in the room where this book is concerned. Up until this point,\
    \ we’ve been talking about employees as generally well-intentioned subjects seeking\
    \ to do right by their companies in the way of cybersecurity, but perhaps lacking\
    \ the education or prescription to do so. That’s largely the reality.\n\nBut there\
    \ is a subset of employees who have no desire to do right by your company. These\
    \ aren’t simply apathetic bystanders in the cybersecurity fight. These are malicious\
    \ insiders seeking to do your organization harm and/or personally profit at your\
    \ company’s expense. According to Verizon’s DBIR report, malicious insiders account\
    \ for over 10 percent of all company breaches.\n\n malicious insiders are the\
    \ most insidious enemies for companies to address. For one, companies are reluctant\
    \ to impose a Big Brother state of monitoring on employees—and for good reason.\
    \ Privacy concerns notwithstanding, employers may be unwilling to treat every\
    \ employee as a potential bad actor, favoring instead a workplace culture in which\
    \ trust is freely offered, not arduously earned over time.\n\nYet, bad actors\
    \ who work for your company are a reality. What’s an organization to do to weed\
    \ out the threat from within? Your cybersecurity organization has technologies\
    \ it can deploy to identify anomalous behavior. But technology, on its own, is\
    \ a much weaker defense than the combination of technology, tools, and people\
    \ working together. This is where HR professionals can assist in creating people\
    \ controls to identify malicious insiders.\n"
