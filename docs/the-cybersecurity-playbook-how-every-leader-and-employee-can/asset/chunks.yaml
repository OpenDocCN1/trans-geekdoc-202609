    Ransomware Lososes Its kill Switch, So Watch Out`](https://www.cnet.com/WannaCry-Ransomware-Lososes-Its-kill-Switch,-So-Watch-Out)。

    4. ^(4) Sean Rossman, “蠕虫消失 40 年后，现在它们带着复仇回来了,” *美国今日报*,2017 年 6 月 21 日，[`www.usoday.com/story/nation-now/2017/06/21/bed-bugs-disappeared-40-years-now-theyre-back-heres-know`](https://www.usoday.com/story/nation-now/2017/06/21/bed-bugs-disappeared-40-years-now-theyre-back-heres-know)。

    5. ^(5) Korin Miller, “你有蠕虫但没发现,” Self,2016 年 4 月 6 日，[`www.self.com/story/you-can-have-bed-bugs-not-it-heres-what-to-look`](https://www.self.com/story/you-can-have-bed-bugs-not-it-heres-what-to-look)。

