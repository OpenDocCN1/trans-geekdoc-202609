  trans: '


    在加入网络安全领域之前，我的职业生涯绝大部分时间都在电信行业度过。我曾是 20 世纪 90 年代末互联网热潮中的一员。我记得，那时我认识的几乎每个人都忙着创立或加入下一家互联网初创公司。似乎每个人都注定会成功。我记得，我们这些幸运在当时在该行业工作的人曾自豪于自己是现代“淘金热”的一员。我当时正确的时间出现在了正确的地方。向我奔而来的录取机会多到我应接不暇。生活曾是美好的。


    直到这种美好终结。世纪交之际的互联网泡沫破灭击了梦想和职业。失业率在一夜之间飙升。对于我的许多朋友来说，这种挣扎是非常真实的，他们用那些连纸张都不如值的股票，换取了价值更低廉的解雇通知（pink
    slip）。


    动荡的电信行业经历了数年的时间和多轮裁员，才最终恢复了平衡。但这种平衡来得缓慢。世纪初那种几乎不存在的电信业失业率，现在提醒着我们这些经历过那段旅程并满身伤痕的人：过犹不及确实会导致非常糟糕的后果。


    职业生涯快进近 15 年后，我进入了迈菲和网络安全行业。当然，我知道迈菲是做安全业务的。这与我的使命感相契合。我想利用每周投入职业生涯的 60 多小时时间来做一些有意义的事情。拯救生命似乎就是最好的选择了。


    事实上，这种好到令我很快发现，我们招人的速度赶不上需求。行业内全球的人才短缺让我想起了那个过去时代几乎不存在的失业率。虽然网络安全岗位的候选人可能对永久性工作保障的想法感到欣喜，但现实是，这个行业零失业率带来的后果比我很久以前所经历的还要糟糕。


    原因是现在涉及的利益要大得多。在过去，为当时的互联网热潮填补职位可能并不是关乎生死的问题。一些有进取的初创公司可能发现吸引和留住其最新业务的人才才更为困难，但让我们面对现实吧。真正关乎的是什么？


    也许我们得再等几年，互联网的潜力才能追上它的炒作；我们今天所熟知并喜爱的应用经济才能成型。早期的杂货或宠物用品配送服务会经历几次失败。对我们幸运的是，当时有许多可行的途径来获取此类商品，即使我们还在等待触手可及的电子商务在几天内（如果不是小时内）为我们递送几乎任何东西。互联网热潮和随后的幻灭现在对我们大多数人来说仅仅是遥远的记忆。我们幸存了下来，并讲述了这个故事。


    网络安全是不同的。关乎的不仅仅是网络带宽或酷炫的应用，要多得多。我们必须考虑国家安全。公司有知识产权、财务、声誉等需要保护的东西。与此同时，我们仍挣扎着为那些保护我们的人填补职位。


    与电信行业不同，这种人才短缺不太可能通过某些行业的崩盘来解决。我们不太可能看到由于才华横溢的网络安全专业人员进入市场导致失业率飙升。因为我们的敌人不会坐之不管。对手们继续向他们的阵营中招募。只要坏分子不短缺，网络安全专业人才就不会过剩。


    这就是我们这头猛兽的本质。网络安全供应商互相挖墙人才，因为为已经受过行业培训的人支付更多薪水，比尝试从几乎破产的候选人源中招募要容易。私营部门发现自己处于同样的人才旋转门中。而公共部门通常拥有最需要保护的东西（我们的国家安全！）却被迫在这个竞争激烈的劳动力市场上竞争，且薪酬限制最为严苛。


    对网络安全专业人员的需求远超过其供应。这种缺口影响着我们每一个人。


    为了让情况更糟，网络安全专业人员的需求远大于其供。缺口。更糟糕的是，我们在人才池中缺乏多样性。女性和少数裔在其中的代表性严重匮乏。即使我们采取高比例，这一问题也超越了政治或意识形态。不幸的现实是，劳动力市场上没有足够的合格候选人，这需要我们全部的努力来解决。


    ## 过去并非如此


    人们很容易认为这个问题大到无法通过某些行业的崩盘来解决。与其把问题推给未来，不如在现在就投入工作来解决网络安全人才短缺。考虑到我们所面临的情况，这可以理解：


    *   在未来几年，全球将有数百万网络安全职位空缺。

    *   根据来源不同，女性在网络安全行业中的占比仅为 11% 到 20%（1）。即使按高比例计算，这一比例远低于女性占一半的整体劳动力市场。

    *   对于少数裔来说，情况更糟。他们在网络安全专业人员中仅占 5%（2），而整体就业人数中约为三分之一。


    也许问题无法解决？也许女性和少数裔根本不倾向于从事网络安全工作？或者他们根本不适合这项工作？网络安全行业注定缺乏多样性吗？


    如果它的起源能预示命运的话。第一个软件程序员是一个女性。阿达·洛芙莱莱（Ada Lovelace）被广泛认为编写了第一个计算机程序——一种计算伯努利数列的算法，该算法还解释了飞机的机翼如何飞行。


    在 20 世纪 40 年代开启的大机时代，又是女性在编写程序。男士更倾向于建造这些巨型计算机，将细致的代码工作留给了他们的女性同胞。


    第二次世界大战期间，女性占布莱切利公园破译行动（3）的 75%，该行动帮助破解了德国人的恩尼格玛密码。


    战后，女性仍然是私营部门编码的基石。一位名叫格蕾丝·霍珀（Grace Hopper）的女性发明了第一个编译器，将人类易读的代码翻译成计算机可以理解的位和字节。


    随着编程工作在 20 世纪 50 年代和 60 年代爆发，女性一直是劳动力市场的主力。这个领域是一个功绩制，基于天赋和成就。公司通常根据入学测试选择编程人员，这种测试通常涉及模式识别。女性和男性处于平等的竞争地位。


    '
- fmt: '

    As this history lesson would reveal, sometimes technology can impede progress
    on one front to accelerate it on another. Specifically, when the first personal
    computers entered households in 1984, we could hardly have imagined their impact
    decades later. On one end, personal computing made possible the digital age in
    which we find ourselves today. On the other, it unintentionally disenfranchised
    women and minorities from the pursuit of programming roles, including cybersecurity
    jobs, that are in such high demand.


    You see, when personal computers entered the market, their price points favored
    more affluent households, as is the case with many new technologies. That reality
    disadvantaged minority households, which earned, on average, less than their non-minority
    counterparts.


    Within a few years, universities began to be flooded with applicants who wanted
    to pursue a career in programming—now a hot market with a bright future thanks,
    in large part, to the advent of personal computing. Economic powers of supply
    and demand took hold. Universities couldn’t fulfill the demand for all candidates
    wanting a career in computer sciences, including women and minorities. They began
    ratcheting up the requirements for such degrees, particularly in the crucial first
    year of study, to weed out candidates without a perceived penchant for the skills
    required (typically by accelerating the curriculum that would otherwise be found
    later in a candidate’s studies).


    The fast-tracked curriculum favored those with the prior experience of banging
    on a keyboard, learning the inner workings of a computer. In other words, candidates
    coming from PC households—white males.


    But what about white females within these households? Why would a little girl’s
    interest in computers be less than her brother’s when she had access to the same
    technology?


    Think back to the mid-to-late 1980s and the teenage culture splashed on Hollywood’s
    big screen. You’ll remember pop-culture classics like *Revenge of the Nerds*,
    *Weird Science,* and *WarGames.* The protagonists that emerged from these box-office
    hits? Hollywood’s stereotype of a lovable nerd—a white male nerd, to be exact.


    Computers, and the programming language that controlled them, became a guy’s trade.
    Teenage girls, like me at the time, no longer visualized ourselves in these careers
    since it seemed they were tailor-made for males. There’s a saying that strikes
    a chord with me as a woman, “If she can’t *see* her, she can’t *be* her.” And
    the female archetype who happened to kick butt in programming—one resembling Ada
    Lovelace, Grace Hopper, and the Bletchley Park women—was conspicuous by her absence
    in just about every blockbuster movie that glorified computing at the time.


    I give you that brief history lesson not to assign blame in any one direction.
    To be clear, I couldn’t be more grateful that I have a computer through which
    to write this book. I couldn’t be more appreciative that we have talented programmers—both
    male and female—who make possible many of the innovations I enjoy today. I happen
    to be a fan of those 1980s movies that moved computers into our pop culture. And
    I take absolutely nothing away from the countless innovators—men and women alike—who
    paved the way for the future we have seized.


    I simply want to expand our addressable market for cybersecurity talent because
    the cybersecurity talent shortage is yet one more threat we face. Another menace
    to our digital freedom is certainly something we can all do without.


    Those who do not learn from history are doomed to repeat it. There is much we
    can glean from this history lesson to change our trajectory going forward and
    move above a zero-percent cybersecurity unemployment rate (a strange ambition
    to want unemployment in cybersecurity, I realize, but I hope I’ve made the point
    that a bit of a labor surplus beats the seemingly endless talent shortage in which
    we find ourselves). As the recruiters for our companies, HR professionals have
    a significant role to play in helping their companies—and the cybersecurity industry—bridge
    the gap.


    ## W.I.S.D.O.M. for HR Professionals


    We must accept two realities. First, our pipeline of existing cybersecurity talent
    is desperately lacking, and that problem isn’t going change anytime soon. Second,
    because there aren’t enough candidates in the pipeline to fill the cybersecurity
    jobs we currently have, we need every employee to take up arms in the battle,
    doing her part to strengthen her company’s defenses.


    The two-sided coin—recruitment and enlistment—becomes a call-to-arms for HR professionals.
    On the recruitment front, HR can help their organizations **expand the aperture
    for cybersecurity talent**. This isn’t a case where bias can win. We need all
    talent helping in the fight—men and women, minorities and non-minorities, arts
    and sciences. To this last point, our industry has been so focused on STEM (science,
    technology, engineering, and math) that we’ve lost STEAM (science, technology,
    engineering, arts, and math). Cybersecurity is as much a psychological battle
    as it is a technical one (combat lends itself to both). It entails both soft and
    hard skills. It exercises creativity as much as it does problem solving.


    Review your cybersecurity job postings and look for a balance of skills that widen
    the market of applicants. Doing so will not compromise the quality of candidates
    (this isn’t about lowering standards). Look to the history of women in this field,
    back when complex math was computed in a human’s brain, not a machine, and you’ll
    realize that women are equally as capable of fulfilling the roles as men. You
    may simply need to look for the same unconscious bias that had universities weeding
    out diverse talent in the late 1980s in your company’s own cybersecurity job descriptions.
    When you find it, weed it out relentlessly.


    But that’s still not sufficient. You’ll need to do the same throughout your recruitment
    process. That includes the interview. Unfortunately, questions that are everyday
    fare in many interviews are also a source of unconscious bias. For instance, behavioral
    interview questions that are commonplace (such as, “Tell me about a time when
    . . . naturally naturally favor candidates with more history. However, that history
    may or not be relevant to today’s challenges. In fact, research suggests such
    questions predict success only 12 percent better than a coin flip.


    Instead, give the candidate a problem and ask her how she would solve it. You
    may ask the candidate to walk you through her plan for acclimating herself to
    your culture and company upon hire. You might show her a flowchart of your current
    process and ask her to make suggestions for improvement. The point is that you
    want to see how a candidate thinks, not simply have her regurgitate her past.


    In the interview process, use panels of interviewers to identify the most qualified
    candidates. Here is another case where too much of a good thing can be bad. For
    example, Google has its Rule of Four, in which they have successfully modeled
    that four interviews are sufficient to predict a new Googler’s success with 86
    percent confidence. Any more is overkill. Any less, insufficient.


    No matter your company’s ideal number, make sure at least one interviewer on your
    panel is a diverse leader. Men and women answer questions differently. Having
    both on your interview panel will account for these differences.


    Taking another lesson from Google, they also have an interesting interview question
    for which they grade men and women differently. It’s this: “On a scale of 1 to
    5, rate yourself as a software engineer.”

    '
