    Case in point: McAfee reports the average organization has around 2,000 cloud
    services in use at any given time. What does its IT team *think* it has? Closer
    to 30. That chasm between perception and reality can at least partly be blamed
    on shadow IT—a phenomenon where employees go rogue and use cloud services without
    the knowledge of, let alone authorization from, their IT department.


    What’s worse than a CISO becoming visible to employees? Becoming visible to the
    board. Historically, boards have wanted as little to do with cybersecurity as
    employees. If the board called a CISO into a meeting, it typically wasn’t to give
    a strategic update on the state of cybersecurity in the company or to receive
    a heartfelt “thanks” for his work. It was more than likely to answer tough questions
    about a breach.


    Deloitte, the global professional services network, does a regular study of boards
    of directors, in which it surveys hundreds of public companies. As recently as
    2014, a mere 5 percent of the very largest companies had standing committees of
    the board relating to the combined topic of “cybersecurity and IT.”


    So the CISO has largely accepted the role of Amos in our metaphorical musical—devoted
    to offering protection for those who don’t appreciate it and destined to remain
    in the shadows.


    But bad actors intent on inflicting harm are rewriting this musical. Hardly a
    day passes without a headline (or company) announcing the next breach. The mood
    of the board is changing. Many are realizing that relegating the CISO to the shadows
    is at their own risk. When Deloitte repeated its board study in 2016, cybersecurity
    had risen to the number one risk earning board focus, with 25 percent of companies
    experiencing a breach in the past two years. Mr. and Ms. Cellophane are finding
    themselves freed from the back corner of the back office, and even seeing an occasional
    invitation to board meetings as a result.


    However, just because hackers have put the limelight on CISOs doesn’t solve the
    cybersecurity challenge. It’s heartening that boards are taking notice of the
    problem, but simply acknowledging it is only the first step. Improving a company’s
    cybersecurity posture requires these parties—the technical CISO and the strategic
    board executive—to learn each other’s language.


    Let’s start by attempting to relate to what I submit is the most misunderstood
    role of the C-suite, the CISO. The edification benefits not only board members,
    but all employees alike. CISOs profit by finally emerging from the shadows.


    ## The New Kid on the Block


    Corporations, and the functional disciplines that comprise them, have been around
    over hundreds of years. Banks and manufacturing firms were among the earliest
    corporations, so it should come as no surprise that many major public companies
    today have deep competency in finance or operations—the initial disciplines that
    served as the foundation for our corporate ancestors.


    Indeed, according to Deloitte’s 2016 Board Practices Report, other than the CEO
    and general counsel, the members of management most likely to regularly attend
    board meetings are the CFO (chief financial officer) (cited by up to 99 percent
    of companies surveyed) and the head of a business unit (cited by up to 47 percent).
    What about the CISO? He only makes a regular appearance in board meetings for
    up to 11 percent of companies, by comparison.


    It should come as no surprise that CISOs are still clawing their way into these
    closed-door sessions. After all, with other functional disciplines spanning centuries,
    if not millennia (lawyers can claim their functional roots all the way back to
    ancient Egypt), the CISO’s role goes back only decades. Back then, we didn’t even
    call it “cybersecurity.” These early pioneers claimed their profession as “Information
    Security,” consistent with their field’s beginnings in “Information Technology.”


    It’s critical we take a brief, but important, journey into the origins of cybersecurity
    for us to understand the relatively new role of the CISO. Back in the day, physical
    security and information security were largely one and the same. I remember, not
    that long ago, if I wanted to access my company’s network, I did so through a
    stationary desktop, connected to a physical Ethernet cable that took me to a local
    area network. The desktop connecting it resided on my company’s premises. Physical
    security inextricably and in practice.


    I’m amazed at how much work has changed in my lifetime. Work is no longer a place
    I go; it’s a thing I do. I increasingly work outside the safe perimeters of my
    employer. I blend my professional and personal lives seamlessly—responding to
    email over my mobile device, connecting just anywhere I can find WiFi, and accessing
    myriad cloud services that make my life easier.


    I’m not the only one embracing work as a tetherless experience. Let’s consider
    how our new work behaviors pose exponentially greater pressure on the CISOs who
    must defend us. At any given time, our CISO is balancing one or more of three
    strategic efforts:


    ### 1 Transformation


    Every adoption of a technology, be it mobility, cloud, or the Internet of Things
    (`IoT`) subjects a company to greater risk. That’s because the safe perimeter
    of the enterprise continues to erode in the process.


    Case in point: Who “owns” the Internet? That’s a byzantine maze of complexity
    that would make the heads of the most technical among us spin.


    Who “owns” the infrastructure of public clouds, like those provided by Amazon,
    Google, and Microsoft? That’s at least an easier question to answer—those companies
    are responsible for the physical security of those cloud environments. But that’s
    the equivalent of saying they own securing the physical access to those massive
    data centers, much the same way our companies own protecting the buildings in
    which we work. Cloud theft isn’t typically the result of resourceful thieves breaking
    into the physical data centers of major web companies. It’s the outcome of cybercriminals
    finding a way to hack the data residing in or traversing through said data centers.


    Who ultimately “owns” responsibility for that data? That’s the easiest and clearest
    answer of all: your company—and your company alone—is responsible for securing
    its own data, regardless of where it resides—be it on servers located on your
    employer’s premises or those rented through a public cloud marketplace.


    The cloud is just one example of the CISO’s receding control over the infrastructure
    used to store or transmit her company’s data. The bring-your-own-device (`BYOD`)
    movement is here to stay, meaning company-issued mobile devices may soon be relics
    of the past. There’s a good reason so many companies are rushing headlong to allow
    their employees to work on whatever mobile device(s) they choose. According to
    Frost & Sullivan, using smartphones for work saves employees close to an hour
    per day, while increasing productivity by 34 percent.

