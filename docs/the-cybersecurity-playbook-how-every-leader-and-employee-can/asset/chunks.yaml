    As it turns out, nothing is exactly what fit the bill, since users also didn’t
    think to change their devices’ default passwords, assuming the average user would
    know how to do so in the first place.


    Within a moment of the Dyn network’s collapse, the Internet of Things (IoT) became
    the Internet of Terrorism. And, lest you believe that the Dyn attack was a fluke,
    contemplate one more frightening reality: The botnet that disabled Dyn was actively
    recruiting enrollees for its next attack several months *after* the incident.
    In an always-on world, hackers have billions of connected devices at their mercy,
    simply awaiting their next command from their new leader.


    The Dyn DDoS attack opened our eyes to a new reality: *The targets have become
    the weapons.* What we used to protect, we must now be protected against. Just
    as data can be manipulated to deceive us, those harmless connected devices that
    make our lives convenient in so many ways at home and work can be turned against
    us to cripple the digital infrastructure upon which we (and they) rely. Cyber
    threats are now so pervasive that they lurk around every connected device, every
    bit of data we take for granted.


    The Dyn attack proved that innovative hackers can exploit any connected product
    or service in their next attack. When cybercriminals slithered in through ordinary
    household appliances, cybersecurity slipped into the mainstream of product development.


    Take connected cars, as just one example. In 2017, Toyota, Intel, and others formed
    the Automotive Edge Computing Consortium. The group estimated that the data volume
    between vehicles and the cloud will reach 10 exabytes per month around 2025—a
    projected 10,000-fold increase from 2017’s baseline. That’s the equivalent to
    *twice* the volume of all words ever spoken by humans since the dawn of time.^([4](#c04.xhtml#c4-note-0004))


    Weaponizing the IoT to take down the Internet is one thing. Weaponizing the eight
    million autonomous cars expected to be on roads by 2025^([5](#c04.xhtml#c4-note-0005))
    makes the Internet of Terrorism that much scarier. Those connected vehicles will
    depend on accurate, real-time data to assess their surroundings and navigate accordingly.
    They will rely on the 10 exabytes of data per month flowing between them and the
    cloud—data that will be a veritable treasure trove for hackers less motivated
    by profit than terror.


    If you think your company doesn’t have to worry about such concerns since it’s
    not in the business of Internet backbones or connected cars, adversaries welcome
    your indifference on this topic. But Dyn shows that your company can simply be
    caught in a hacker’s crossfire. Dyn wasn’t the target of the attack. The Internet
    services they supported were.


    If that still doesn’t compel you to think differently of the brave new world in
    which we find ourselves, consider this: How many of your employees work from home
    on an occasional basis? Now consider that the average home had 10 connected devices
    in 2016, the year of the Dyn attack, per Intel. The semiconductor giant predicted
    at the time that figure would rise to 50 connected devices per household by 2020.^([6](#c04.xhtml#c4-note-0006))
    If left unsecure, those devices can serve as the potential onramp for hackers
    to compromise your employees while working from their home offices—and potentially
    seep into your company as a result. The edge of the corporate network is now in
    the home.


    Lines are blurring. Home and work are colliding. The products and services we
    use as consumers, we use as employees. The IoT is just one example of how cybersecurity
    permeates more than what meets the eye. For any employee charged with product
    or service development, *you are key to stopping the line* whenever cybersecurity
    is conspicuous by its absence.


    In this case, it’s not just your company depending on you for the same. It’s *every
    user* directly or indirectly touched by your creation.


    ## W.I.S.D.O.M. for the Product Developer


    Product developers are the first line of defense in embedding cybersecurity requirements
    in every product or service a company offers. There’s no need to reinvent the
    wheel on sound product development principles and checklists (of which there is
    no shortage in the market). By integrating cybersecurity concepts into tried-and-true
    design methodologies, developers play an essential role in hardening their companies’—and
    even their users’—cybersecurity defenses.


    First, in the initial phases of design, customer input is imperative. Many companies
    actively solicit this feedback from customers through quantitative research, one-on-one
    interviews, customer advisory councils, and/or other methods. A simple, but profound,
    way to ensure cybersecurity is not an aftermarket afterthought is to straightforwardly
    **ask customers about their cybersecurity requirements as part of this discovery
    phase***.*


    Let’s say you’re in the business of manufacturing a \[fill-in-the-blank\] connected
    household device (like the kind used in the drone army to take down Dyn). Discovering
    when consumers would be more likely to take action in changing a factory-default
    password would be an important element in the design phase. Better yet, eliminating
    procrastination from the consumer during this phase by, say, requiring a password
    change through an intuitive application when the connected device is installed
    removes a key security vulnerability right out of the box.


    Now let’s imagine you’re in software development. And let’s assume that consumers
    aren’t your target. You market to businesses. The same principle applies. In this
    case, finding out exactly how your customer will use your application securely
    prevents the need for bug-fixing down the road. Will your clients rely on the
    cloud, or do they prohibit the cloud for data upon which your application depends?
    On the flip side, have you designed a product to live within a firewall only to
    find your customer prefers a software-as-a-service (SaaS) consumption model? These
    and many other qualifying questions during the discovery stage are invaluable
    to implanting security in the foundation of your product.'
