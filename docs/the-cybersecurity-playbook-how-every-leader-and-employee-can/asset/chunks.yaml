- fmt: "\n> *A very big problem for any company is that fact that their users, the\
    \ business people, can just go buy stuff. They have no idea of what they’re doing,\
    \ nor do they really care. They look at a software package and say, “Oh, I want\
    \ that. That will help me with my job.” They don’t care—they don’t even think\
    \ about the security aspects of that. And in many cases, they can load it and\
    \ use it. And that is a huge risk, from a cybersecurity standpoint. And yet, stopping\
    \ them is impossible.*\n> CTO, Manufacturing Company\n\nLucky Amos. He may have\
    \ married a cheating murderess but at least she got her just deserts, rotting\
    \ the rest of her life away in prison. And as for Amos? He happily remarried.\
    \ They have a beautiful family together. He found happiness and fulfillment in\
    \ his career. Although he still encountered life’s typical challenges along the\
    \ way, he managed to emerge stronger and smarter after each one. Surer of his\
    \ value. More secure in his identity. And no longer satisfied to allow society\
    \ to look right through him, walk right by him, and never know he was there.\n\
    \n***\n\nFor my fellow fans of the musical *Chicago*, you know that I made up\
    \ that storybook ending for Amos. In the musical, the best he can hope for is\
    \ a fleeting moment of acknowledgment by his wife’s seedy lawyer before exiting\
    \ the stage—and story.\n\nBut he doesn’t have to exit my imagination. In my ending\
    \ for Amos, I’m rewriting his future. Why shouldn’t he have a great life? In my\
    \ mind’s eye, Amos turns tragedy into triumph and reclaims his destiny. He realizes\
    \ he’s worth a lot more than others would give him credit for. And he compels\
    \ others to recognize his value, refusing to retreat quietly to the shadows.\n\
    \nIn the same way, I want CISOs to rewrite their future. It will require them\
    \ to learn to speak the language of the boardroom. It will entail that they loosen\
    \ the reins on employees to gain more control over their environments. And it\
    \ will mandate they take up arms as the culture leaders their companies need.\n\
    \n## A Picture Is Worth a Thousand Words\n\nIn the book *Brain Rules,* John Medina\
    \ states the following, “We do not see with our eyes. We see with our brains.”^([1](#c08.xhtml#c8-note-0001))\
    \ He points to a fascinating study where wine connoisseurs were given white wine\
    \ mixed with red, tasteless, odorless dye. Of course, the subjects had no idea\
    \ that researchers manipulated the white wine in this way. The latter wanted to\
    \ measure the power of vision in affecting all other senses. Would the aficionados\
    \ rely on the combination of their other senses—including taste and smell—to spot\
    \ the counterfeits right in front of their noses?\n\nNot so much. When the wine\
    \ tasters encountered the fake reds, they described their experience using vocabulary\
    \ associated with authentic reds. As Medina notes in his book, “Visual processing\
    \ doesn’t just assist in the perception of our world. It dominates the perception\
    \ of our world”^([2](#c08.xhtml#c8-note-0002)) [emphasis mine].\n\nPerhaps that’s\
    \ why our business world is brimming with visual cues. We have scorecards that\
    \ reflect performance, fancy presentations to share information, and real-time\
    \ dashboards that give us instant feedback on a multitude of metrics across functional\
    \ areas.\n\nWhen McAfee spun out from Intel as an independent company in 2017,\
    \ our CEO Chris Young quickly mobilized to gather and analyze critical metrics\
    \ across the company to give him complete visibility into the business. I was\
    \ thrilled to showcase what the marketing and communications team was delivering\
    \ on behalf of McAfee. I was confident we had at least an interesting story to\
    \ share—we were gaining momentum in generating viable pipeline and our brand-building\
    \ efforts were starting to bear fruit.\n\nI dutifully submitted my team’s dashboard\
    \ week in and week out. Chris is a very engaged leader with a studious eye for\
    \ detail. So I’d get questions from him regularly about the team’s performance.\
    \ Those questions would instruct what additional information we’d include in the\
    \ next week’s submission. And the virtuous circle continued.\n\nUntil, one day,\
    \ I realized something was missing in my team’s dashboards. In our case, it wasn’t\
    \ a data point or metric. It was the signal. It shouldn’t come as a surprise that\
    \ dashboards can fall victim to providing too much detail such that the noise\
    \ drowns out the message. But that wasn’t so in our case. We had judiciously pruned\
    \ our metrics to ensure we weren’t competing with ourselves with too many distractions.\n\
    \nInstead, we had created too much noise by not serving the most critical sense\
    \ of all—vision—with the visual graphs included in our dashboards.\n\nThe revelation\
    \ came to me by way of Chris himself. It turns out Chris has an aversion to one\
    \ of the most popular charts of our time (and on my team’s dashboards)—the pie\
    \ chart. At first, I thought he was just being persnickety. Then I realized he\
    \ wasn’t alone in his derision.\n\nA simple Google search reveals contempt for\
    \ the pie chart among many. Some agree it’s the Nickelback of data visualization^([3](#c08.xhtml#c8-note-0003))\
    \ (my apologies to any die-hard Nickelback fan reading this!). If that sort of\
    \ music isn’t your thing and you’re partial to comic book heroes, critics say\
    \ it’s the Aquaman of charts. As they would argue: Do you really need Aquaman\
    \ when Superman can do all that he can and then some?^([4](#c08.xhtml#c8-note-0004))\n\
    \nChris would put it more diplomatically. Pie charts often contain too much information\
    \ crowded in minuscule slices with no perspective of how data has changed over\
    \ time. The pie chart does one thing—and one only—represent something as a portion\
    \ to the whole. Other graphs, such as stacked column charts, do the same—and they\
    \ show perspective of a trend over time.\n\nI use this example to put a finer\
    \ point on the need for CISOs to become fluent in another language—that of the\
    \ CEO and the board. I certainly am not saying that CISOs are the proverbial Aquamen\
    \ of Corporate America, just that they can’t afford to remain experts in only\
    \ their domain. To become the Supermen and Superwomen of their companies, they\
    \ can learn some lessons from the pie chart:\n\n*   If vision is the key sense,\
    \ then the boardroom is a 3-D IMAX theater. The visuals must stand up. This isn’t\
    \ a book on presentation style. That said, the study of how the delivery of a\
    \ message affects its impact goes back to the days of Aristotle. If delivering\
    \ a compelling message that isn’t lost in a cacophony of graphics and/or nonverbal\
    \ distractions isn’t your strength, avail yourself of resources to sharpen your\
    \ axe in this area.^([5](#c08.xhtml#c8-note-0005))\n*   Next, CISOs are the metaphorical\
    \ tourists in the boardroom. Speaking in the tongue of the native board members\
    \ is on the onus of the visiting CISO.\n*   Besides being fluent in the typical\
    \ financial metrics (revenue, profit, cash flow, etc.), the board talks in the\
    \ language of risk. CISOs typically speak in the language of attacks. While the\
    \ two are related, there are distinct differences, and it’s up to the CISO to\
    \ make the connection.\n\n    Let me explain. CISOs have multiple frameworks for\
    \ examining the threats in their environment. These models dissect the anatomy\
    \ of an attack—a critically important (and challenging) endeavor for CISOs to\
    \ assess how and where adversaries maneuver. If a CISO understands the enemy’s\
    \ ways across the life of an attack, he can defend his organization with commensurate\
    \ tactics, techniques, and procedures to evade it. And he can find vulnerabilities\
    \ in his environment by applying one of several attack frameworks to his company’s\
    \ cybersecurity defenses.\n\n    In contrast, boards deal in risk management (e.g.,\
    \ What can go wrong?). They do so as part of a much larger conversation that includes\
    \ corporate strategy (How will we create value?), business models (How does strategy\
    \ translate into value?), and key performance indicators (How will we measure\
    \ our performance?).^([6](#c08.xhtml#c8-note-0006))\n"
