  trans: '

    最后，在你的公司里当好“网络安全文化的旗手”。这需要两方面的努力。首先，`CISO` 必须能够听懂董事会的语言。董事会室说的是风险语言——而这始终与公司战略紧密相关。与业务部门负责人、你的
    `CFO` 以及 `CEO` 协作，识别并优先考虑公司最具战略意义的资产。对于每种资产，识别泄露后的后果。最后，提供其当前的漏洞情况。立即为高优先级/高漏洞资产制定“修复计划”。当被邀请参加董事会时，请将此框架作为你的指南，定义你的网络安全战略如何映射到公司更广泛的战略中。


    除了在纵向上传播安全文化外，还要通过组织员工进行横向传播。与你的 `HR` 对应人员并肩作战，提供有效的培训以提高员工在各自岗位上的安全意识（就像麦菲的 `CISO`
    在他的网络钓鱼活动中所做的那样）。找到办法，让网络安全不仅仅是一年度的培训活动，或是员工入职时要回答的问题检查清单。在你的团队中聘请一名沟通专家，与营销部门合作，定义该职位的角色和技能要求。让你的沟通大使与
    `Marketing` 和 `HR` 合作，开展有效的内部宣传活动，让网络安全成为每个人日常工作的一部分。


    ***


    是时候让 `CISOs` 拥抱他们在执行层会议桌上的角色了。是时候他们培养一种远超 IT 部门的网络安全文化了。是时候与关键利益相关者——特别是 `HR`
    和 `Marketing`——建立新的伙伴关系，以推动网络安全意识的提升和安全的降低。是时候改写 `CISO` 故事的结局了。得益于许多早已在前行的具有前瞻性
    `CISOs`，其他剧角不需要去想象他们的故事书式结局了。这正在变成现实。


    ## Notes


    1. John Medina, *Brain Rules: 12 Principles for Surviving and Thriving at Work,
    Home and School* (Seattle, WA: Pear Press, 2014).

    2. Ibid.

    3. [`twitter.com/WaltHickey/status/345646754089291777`](https://twitter.com/WaltHickey/status/345646754089291777)

    4. Walt Hickey, “The Worst Chart in the World,” *Business Insider*, June 17, 2013,
    [`www.businessinsider.com/pie-charts-are-the-worst-2013-6`](https://www.businessinsider.com/pie-charts-are-the-worst-2013-6)

    5. One of my favorite presentation books of all time is *Presenting to Win: The
    Art of Telling Your Story* by Jerry Weissman. If you don’t have time or budget
    for professional coaching, the book is an invaluable resource in providing tricks
    of the for telling an effective story.

    6. David F. Larcker and Brian Tayan, Corporate Governance Initiative, “Strategy
    & Risk,” Stanford Corporate Governance Initiative, [`www.gsb.stanford.edu/sites/gsb/files/publication-pdf/cgri-quick-guide-06-strategy-risk-oversight.pdf`](https://www.gsb.stanford.edu/sites/gsb/files/publication-pdf/cgri-quick-guide-06-strategy-risk-oversight.pdf)

    7. Ibid.

    8. IDG Enterprise, “2014 Consumerization of IT in the Enterprise,” [`www.scribd.com/presentation/21294214/IDGE-CITE-2014`](https://www.scribd.com/presentation/21294214/IDGE-CITE-2014)

    9. Patrick Thibodeau, “A Third of Virtual Servers Are Zombies,” *Computerworld*,
    May 12, 2017, [`www.computerworld.com/article/3196355/a-third-of-virtual-servers-are-zombies.html`](https://www.computerworld.com/article/3196355/a-third-of-virtual-servers-are-zombies.html)

    10. Jody R. Westby, “Governance of Cybersecurity: 2015 Report,” Georgia Tech Security
    Center, October 2, 2015, [`globalcyberrisk.com/wp-content/uploads/2012/08/GTISC-GOVERNANCE-RPT-2015.pdf`](https://globalcyberrisk.com/wp-content/uploads/2012/08/GTISC-GOVERNANCE-RPT-2015.pdf)

    11. Bob Bragdon, “Maybe It Really Does Matter Who the CISO Reports To,” *CSO*,
    June 20, 2014, [`www.csoonline.com/article/2365827/maybe-it-really-does-matter-who-the-ciso-reports-to.html`](https://www.csoonline.com/article/2365827/maybe-it-really-does-matter-who-the-ciso-reports-to.html)

    12. Rishi Bhargava, “False Positives Have Real Consequences,” *LightReading SecurityNow*,
    June 22, 2017, [`www.securitynow.com/author.asp?section_id=613&doc_id=733939`](https://www.securitynow.com/author.asp?section_id=613&doc_id=733939)

    13. G. Proulx, J. Latour, and J. MacLaurin, “Housing Evacuation of Mixed Abilities,”
    IRC-661, Internal Report, Institute for Research in Construction, National Council
    of Canada, 1994.

