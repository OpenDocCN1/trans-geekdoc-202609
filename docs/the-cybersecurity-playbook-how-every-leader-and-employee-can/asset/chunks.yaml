  raw: 'She immediately reassured me that our chief information security officer (CISO)
    was already on the case, confirming our systems were good. Relief washed over
    me for a moment—until I realized I needed to make another call. Our CEO needed
    to know what was going on. And I preferred he hear the news from me. I was about
    to ruin his Easter Sunday. He picked up the phone almost instantly:


    *   “Chris, one of our social media accounts has been hacked.”


    *   His response was measured. “How bad is it?”


    *   “Our corporate servers are fine, Chris. It’s our corporate page on a social
    media site that’s been hacked.”


    I explained to him just what had happened. Our social media manager, Gavin, was
    the first to discover the attack. Gavin had been at home, doing what social media
    geeks do on holidays—he was online. Around 5 p.m. he saw a status update on the
    social media platform with a bunch of random letters in it. He figured someone
    on his team had butt-dialed the update. Gavin deleted the random post.


    He then pinged his team to see who might have accidentally created that post.
    No one knew anything about it. Soon, another meaningless post showed up. This
    was now not random.


    Gavin logged into the social media platform and went to the account settings area.
    All the names were familiar of the people who had administrative privileges for
    the account. Even so, to be on the safe side, Gavin started to delete all other
    admins.


    As he was doing that, his page refreshed, and Gavin was locked out.


    There was now no doubt that this was malicious. In a moment, Gavin realized that
    his deleting the weird posts had alerted the hacker that McAfee was aware of the
    defacement. It was like the classic race in tech crime dramas with fingers flying
    on keyboards, spinning icons as processes complete and messages flashing as only
    Hollywood can bring to the screen. Gavin and our hacker were racing online to
    do the same thing. Even without the pulsing soundtrack, the tension was every
    bit as fraught with drama. Gavin said, “I was trying to delete all the other admins,
    and the hacker was doing the same thing. He beat me.”


    Before I hung up with our CEO, I had one more piece of disappointing news to share.


    *   “Oh and Chris, when you go to our social profile page, you’ll now see not
    just the offensive posts, but also our company logo has been replaced with an
    image that looks like a bird. Look closer. It’s not a bird at all. It’s. Um. It’s
    body parts.”


    It’s common in the hacker community to deface sites with obscene drawings to indicate
    that someone got “pwned,” hacker slang for being defeated in a humiliating way—for
    being “owned.” Now that the hacker knew we were locked out and he was in control
    for the time being, he added an obscene image to replace our new company logo,
    just for good measure.


    My team frantically engaged the social media platform company to remediate the
    issue. But . . . things don’t happen quickly on holidays. And since this was now
    later in the evening, we were relegated to working with the company’s Asia-Pacific
    (APAC) group, making it seem as if time itself had to physically cross the ocean
    separating us and the support team. Minutes slowed to a crawl.


    We waited for what seemed like an eternity. Because it was not our servers that
    were hacked, there was no big team from McAfee I could put on the third-party
    problem to fix it. We could only check in with the company’s support team every
    few minutes, only to be told they were “on it.”


    After about 30 minutes, we received news that the social media company had locked
    out *all* admins from our company page, and only they had access now. That was
    the good news—at least no more damage would be done.


    The bad news? They did not have a means to simply roll back the page to what was
    there 30 minutes before. Their procedure was to lock the page, so no further changes
    could be made, and then to follow a validation and analysis procedure: For validation,
    they wanted to make sure that we were who we said we were, and not a hacker calling
    up pretending to be McAfee (How ironic!). Then the analysis part kicked in, where
    they wanted to study the extent of the hack before taking any further action.


    But what about the obscene image? It was still up on our corporate page. To make
    matters worse, the way this social media provider worked was that all employees
    who had personal pages on this platform and who said they worked for McAfee—their
    personal pages now sported the obscene image in place of our logo, too!


    Including mine.


    On the next update I received, the support team said they weren’t yet done with
    their “procedures.” They said the only way to roll back the page was first to
    reactivate the account—unlock it—and they were not going to do that until they
    finished their security review.


    Seriously? How was this happening? *Nothing* could be done about our company page
    until they were done with their review. We were at their mercy. The most our employees
    could do was to delete any mention of McAfee on their own personal pages, which
    some who were aware of the event did.


    But that wasn’t sufficient. I continued to ruin Easter Sunday for others as I
    alerted our executive team of the event. We had ensured our company’s servers
    were safe, but that didn’t mean McAfee wasn’t under attack through other social
    channels. And we certainly didn’t know whether our own executive members—and their
    social profile personas—weren’t the next target.


    I took to email and group texts to sound the alarm, instructing our executive
    team to enable multifactor authentication on their personal profiles immediately
    on all social networking sites (more on multifactor authentication in a moment).


    I followed my own advice and began frantically enabling the security feature on
    my personal profile pages wherever I could, that is, until I hit a very popular
    social networking platform where I became stumped. I’m not sure if my body was
    in the full throes of fight-or-flight (where the body redirects blood flow to
    major muscle groups to help one flee a threat or stand ready to combat—in other
    words, *not* the prefrontal cortex) or if the social media platform could have
    done a better job of not obscuring the safety capability. It was probably a bit
    of both. In either case, panic consumed me, and I resorted to a desperate measure:
    I deleted my personal profile—and all its history—on the social media platform
    altogether.


    An hour stretched to two, then three, then four. I was regularly calling our CEO
    with the requisite, but annoying, status updates about our increasingly embarrassing
    vandalized company profile page. Calls that went something like:


    *   “Chris, we’re still working with them. They haven’t finished their security
    review. We’re hoping it will be resolved in 30 minutes.”


    Lather, rinse, repeat—every 30 minutes.


    It was on one of these calls that our CEO pulled a rabbit out of his hat.


    *   “Allison, I know of someone at the company and I’m tired of waiting on them
    to take action. I’m calling him.”


    *   “Excellent, Chris. We’ll keep the heat on the APAC team in the meantime.”


    Chris made the connection and pleaded our case. Within 30 minutes of the call,
    the page was restored to its original state. I don’t know whether Chris’s call
    mattered, or whether the investigation simply had run its course and was completed.
    I just knew that the situation was now contained.


    On Monday morning, we posted an article on our intranet site, letting every employee
    know what happened over the weekend. Remember that McAfee value I mentioned about
    practicing inclusive candor and transparency? We owed it to our employees to explain
    what happened, especially given their social media pages were defaced over those
    tense few hours when the heinous image replaced our company logo. Being candid
    and transparent is difficult when dealing with an uncomfortable topic. But it’s
    also necessary to truly live the value.


    \* \* \*'
