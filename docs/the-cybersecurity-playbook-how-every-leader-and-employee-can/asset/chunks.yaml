    \ the phone? It’s a weird feeling. You expect an answer. Yet, you don’t. That’s\
    \ the kind of feeling I had when I heard his voice. I found myself searching for\
    \ my words.\n\n*   “Uh, hello, Sheriff Johnson. This is Allison Cerra calling.\
    \ I understand you spoke with my mom this morning.”\n\nHe wasn’t at the same loss\
    \ for words.\n\n*   “Yes, Ms. Cerra. I called your mother since we’ve been trying\
    \ to reach you. I have an outstanding warrant for you to appear before Judge [name\
    \ withheld] in Davidson County, Tennessee, for a missed court appearance in August.\n\
    \n*   “I show that you resided in Nashville in the past, is that correct?”\n\n\
    Authority is a powerful force, especially for someone who has respected it for\
    \ a lifetime. I had learned from an early age that, when someone in authority\
    \ asks you a question, you don’t answer with a question. You simply answer.\n\n\
    *   “Yes, that’s correct.”\n\n*   “Well, we’re showing you have a warrant for\
    \ a missed court appearance on August 15.”\n\nAuthority also compels you to correct\
    \ the record. This guy couldn’t be right. But instead of my fight-or-flight trigger\
    \ kicking in, raising red flags of suspicion (and questions), my overwhelming\
    \ deference to authority had me explaining.\n\n*   “Sir, I’m sorry. That doesn’t\
    \ sound right. I only lived in Nashville a few months back in 1995. I wasn’t even\
    \ in Nashville in August.”\n\n*   “Ms. Cerra, I don’t know what to tell you. The\
    \ judge issues the warrants. You’ll have to take care of it with her.”\n\nNow\
    \ here’s where the story veers into the unexpected. Because you would expect that,\
    \ if this guy was a scammer, he would immediately launch into his “but if you\
    \ give me your credit card number, I’ll be sure to clear this up for you” pitch\
    \ that would have undoubtedly sent my red flags flying.\n\nHe did no such thing.\
    \ He just kept asking me questions to verify my background.\n\nAnd I just kept\
    \ answering.\n\n*   “I show that you lived at this address, is that right?”\n\n\
    *   “Yes, sir. That’s correct.”\n\n*   “And I show that you now reside in Denton\
    \ County. Correct?”\n\n*   “Yes, with my husband.”\n\nNotice how I was in the\
    \ full grips of authority, answering questions with even more information than\
    \ required. This guy had me. \n\nIt’s around this time that my husband emerged\
    \ from the bedroom, wiping the sleep from his eyes, yet alert enough to realize\
    \ I was on a serious phone call—and it didn’t sound like work.\n\n*   “What’s\
    \ going on?”\n\nThe sheriff was still confirming information with me. I hurriedly\
    \ put him on mute to bring my hubby up to speed on the morning’s events.\n\n*\
    \   “Mom called. She got a call from a sheriff in Nashville who says there’s a\
    \ warrant out for me for a missed court appearance. I’m on with him now trying\
    \ to clear it up.”\n\n*   “How is that possible? You haven’t lived there in forever.”\n\
    \n(Now I was getting irritated with my husband for stating the obvious.)\n\n*\
    \   [Through clenched teeth] “I know that. That’s why I’m trying to clear this\
    \ up.”\n\nAnd then my husband, barely awake, asked me the question that I should\
    \ have asked myself before ever dialing the number:\n\n*   “Are you sure this\
    \ guy isn’t scamming you?”\n\nYou know when thoughts come rushing into your head\
    \ so fast that you can play back the last few moments of your life in what is\
    \ no more than nanoseconds? In my case, it was the past 30 minutes since I first\
    \ picked up the message from my mom that I was now reliving in my head. For the\
    \ first time in those 30 minutes, I had unmistakable clarity.\n\nMy mind was blown\
    \ and my heart now racing for an entirely different reason. “Sheriff So-and-So”\
    \ was still blabbering as my fight-or-flight response finally kicked in. I attempted\
    \ to gather my thoughts and reengage the brain that had failed me.\n\n*   “Sheriff,\
    \ I’m sure this is a mix-up. Thank you for alerting me to it. I’m going to call\
    \ you back to resolve it.”\n\nI wanted off that phone call. He was surprisingly\
    \ accommodating. No last-ditch hard push for a credit card number. No threatening\
    \ that police would be on my doorstep to collect me in minutes.\n\n*   “Sure,\
    \ Ms. Cerra. I understand. You can reach me back on this number.”\n\nClick.\n\n\
    Before I had even hung up, my husband was already on his cell phone, calling the\
    \ Davidson County Sheriff’s Office.\n\nYou can likely guess the rest of the story.\
    \ There was no Sheriff Johnson employed there. Just as there was no outstanding\
    \ warrant for me for a missed court appearance—or anything else, for that matter.\
    \ Apparently, this type of scam was quite popular as confirmed by the real policeman\
    \ on the other end of my husband’s line.\n\n*   “We get at least one of these\
    \ a week. It’s a scam. Tell your wife that we don’t call people like that when\
    \ there’s a warrant out. We just show up on your doorstep.” (Duh. I felt like\
    \ an idiot.)\n\nBut, just for good measure, I went to my own local precinct to\
    \ confirm there was no blemish on this responsible-and-contributing-member-of-society’s\
    \ record. I took that well-measured respect for authority, deeply ingrained in\
    \ me, and asked the officer behind the desk if he was planning to arrest me. Relief\
    \ finally washed over me when he answered, “No.”\n\n***\n\nYou might be questioning\
    \ your own judgment in buying a book about protecting your company from cyber\
    \ threats. After all, I’ve already admitted to such a mistake.\n\nThe cybersecurity\
    \ industry describes such scams as “social engineering.” You know one variety\
    \ of this as “phishing,” which is when cybercriminals send malicious emails, pretending\
    \ to be a trusted authority in their victims’ circles, asking they give up sensitive\
    \ information or click on a link. We’ve come to somewhat underestimate phishing\
    \ or the ingenuity of its creators. Phishing has come a long way from the “Help,\
    \ I’m a Nigerian prince and I need money” days. McAfee detected more than a million\
    \ new phishing URLs in 2018 alone.^([1])\n\nAnd social engineering moves beyond\
    \ the digital realm, as my situation proves.\n\nWithout rushing headlong into\
    \ some end-of-times prophecy where hackers take everything we’ve got, there is\
    \ a sobering reality that I can’t hyperbolize and it’s this: for any individual\
    \ contributor reading this book, `you` are among your company’s strongest or weakest\
    \ links in its fight against cybercrime.\n\nConsider the power of that statement.\
    \ Industry analyst Gartner predicted that companies spent more than $114 billion\
    \ worldwide in cybersecurity products and services in 2018.^([2]) That puts cybersecurity\
    \ in the same zip code as other $100 billion-plus industries, like digital television\
    \ and video, digital marketing and gaming.\n"
