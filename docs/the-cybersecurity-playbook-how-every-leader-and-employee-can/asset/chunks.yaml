    McAfee 对 `WannaCry` 自身的分析显示，它几乎算不上真正的勒索软件。其作者为其留下的变现能力相当粗浅。他们没有将受害者的唯一标识与其比特币支付关联起来，导致文件解密变得极其困难。那么
    `WannaCry` 到底是什么？勒索软件？蠕虫？两者皆是。


    2018 年，黑客的才华随着 `Zyklon` 的发布再次充分展露。`Zyklon` 是一个功能齐全的威胁包，供企业犯罪分子利用——它可以窃取密码、发起 DDoS
    攻击、挖掘加密货币等。`Zyklon` 到底是什么？加密矿矿？DDoS？键盘记录？以上皆是。


    正如 `WannaCry` 和 `Zyklon` 所示，黑客不仅在专业领域进行合作，还协作创造出融合威胁的新混合物。他们正在将旧品种（如蠕虫）与新品种（如勒索软件）混合在一起。在
    McAfee 对地下论坛的分析中，我们看到网络犯罪分子正在讨论新旧漏洞。结果是复杂的威胁，其传播速度比以往任何时候都要快得多。


    回到我们 `CFO` 和 `CISO` 之间的对话。当 `CISO` 向 `CFO` 请求要更多资金时，通常是因为这种现实。即使在周期中期，在预算分配很久之后，`CISO`
    可能仍需要更多。`WannaCry` 并没有等待方便的财政周期结束来大肆破坏。恶性分子不在乎你的预算周期。


    如果 `ROI` 不是网络安全的正确指标，那么什么才是？风险管理。网络安全专业人士从事的是风险管理业务。诚然，他们拥有技术知识，并有许多产品用于防范公司免受高度组织化的犯罪集团的侵害。但只要脱离该领域的技术术语，它实际上会归结为一个清晰的业务目标——降低公司的风险。


    正如 `CFOs` 所知的，风险管理及其相关指标与更传统的财务衡量 `ROI` 有本质区别。我住在北德克萨斯州北部，那是该国一个被称为“龙卷风走廊”这一不幸俗称的地区。直到今天，我对龙卷风保持着健康的恐惧。这归咎于每月第一个星期三中午测试的龙卷风警报器。那令人骨骨悚然的声音简直是直接来自战争电影。或者可以归咎于多萝丝和通过龙卷风前往奥兹国之旅，这个念头在小时候就让我惊坏了。无论如何，我害怕龙卷风。但在北德克萨斯州的每个春天，它们对我原本和平的生活来说都是持续的威胁。


    直到我被教导我的恐惧是多么毫无根据。McAfee 的首席技术官 (`CTO`) 去年搬到了达拉斯地区。他那里立即接受了紧张的同事和像我这样的老德克萨斯人关于龙卷风的教导。然而，与我不同，他决定进行自己的研究，而不是屈从炒作。他发现，在
    69 年的追踪中，我所在的县只出现过一次 `F3` 或以上的龙卷风（这种龙卷风能够造成严重甚至难以想象的损害）。


    现在，回到风险管理的讨论。你们的财务团队会检查公司校园内公示龙卷风避难所标志的 `ROI` 吗？特别是像我这样恰住在“龙卷风走廊”的地点。可能不会。即使你检查了完全丢失这些标志的风险，你可能也会发现数据支持这种鲁莽的放弃（我们的
    `CTO` 为我所在的县找到的数据表明，致命龙卷风确实是一个极罕见的事件）。


    即使 69 年里只发生一次灾难性的龙卷风，风险仍然存在。如果这种风险变为现实，为了节省几美元而放弃可见且理性的标志可能证明是一项昂贵的决策。


    网络安全也处于同样的境地。虽然 `CISOs` 每天必须处理大量的威胁（这些威胁可能不会造成灾难性的破坏，但仍会干扰业务），他们还必须考虑大规模攻击中固有的、可能导致公司瘫痪一段时间的灾难性风险（尽管可能性低得多）。他们每天每分钟都是在风险的钢丝上行走。


    如果 `CFOs` 能以稍微不同的方式与 `CISOs` 开启对话，他们就可以帮助建立从网络安全到风险管理的桥梁。换个角度看待之前的那段对话：


    **CFO**: 我们为什么需要买这个新的安全组件？我们正试图保护什么？


    **CISO**: 它保护了我们的[填空]资产，我们已将其确定为公司极具战略性的资源。


    **CFO**: 但你如何知道该资产面临风险？


    **CISO**: 我们知道一个攻击者可以利用的漏洞。


    **CFO**: 如果我们不采取行动，风险是什么？


    **CISO**: 鉴于这是一个高风险资产，泄露的后果意味着[业务中断、高达 x 百万美元的罚款、客户安全召回、关键系统或站点的关闭等]。


    **CFO**: 让我们对那个后果再深入点击一下。告诉我们我们的[财务、法律、知识产权和/或声誉]暴露情况是怎样的。


    仅仅通过不同的方式界定对话，`CFOs` 就可以帮助他们的 `CISO` 合作伙伴将网络安全投资转化为业务成果——同时摆弃了大多数 `CFOs` 可能不会留恋的技术术语和网络安全指标的视力表。这从提问正确的问题开始。


    同样的问题对于由财务部门久经有效的 `ROI` 指标管理的其他业务决策也被证明是卓有成效的。大多数追求利润的公司都在从事增长业务。正因如此，存在进入新市场、通过新产品扩张、通过新技术提高生产力等压力。许多此类业务案例都经得起
    `ROI` 试金石的检验。但这些情况会频繁检查其对公司风险状况的影响，特别是通过扩大攻击者可以利用的攻击面？


    `CFOs` 可以在新的业务案例进入他们的桌面时，帮助其组织提出这些风险相关的问题：


    *   新的[市场、内部技术、客户产品等]如何改变公司的攻击面？

    *   它如何改变公司最具战略资产的风险状况？

    *   [假设风险增加] 需要多少额外投资（一次性和经常性的）将风险状况带到可接受的基准？这项投资是否包含在 `ROI` 分析中？


    通过向他们的非网络安全同事提出这些问题，`CFOs` 及其团队可以确保网络安全不是公司战略增长计划的事后考虑。


