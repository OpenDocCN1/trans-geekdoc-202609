  raw: 'As the campaign continued, the signage on campus shifted to reminder messages
    on how to spot and report phishing. Awareness across the company grew. Leaders
    (including me) used the reports to give our teams constructive feedback on how
    we could improve or where to keep up the good work.


    I even found myself on more heightened alert, waiting to spot a “phish” from our
    security team and ready to report it immediately. In leaving my house one morning
    to go to work, I checked my phone for any emails needing my immediate attention.
    I saw one from our CEO, Chris. But I could tell immediately it was way off. It
    asked that I reply to him via email since he couldn’t reach me via phone.


    As I grabbed my keys and ran out the door, I thought to myself, *That phishing
    campaign at work started out so cleverly. But this fake phish from Chris really
    wasn’t great. Too easy to spot.*


    As soon as I got to the office, I dutifully reported the phish. To my surprise,
    I didn’t get the usual congratulatory message popup from our security team saying
    I had passed the test. *That’s odd. I’ll need to let them know that their immediate
    response is off. Next time I see our CISO, I’ll mention it. . . .*


    But I wouldn’t have that opportunity. That’s because, in less than 10 minutes,
    I received an email from our security team. But it wasn’t the “good on you for
    spotting the fake phish” email I was expecting. Turns out, it was a real phish
    I reported. Our cybersecurity team investigated it in minutes and responded with
    immediate steps to take in case I *had* responded (which I hadn’t).


    You would expect such a multifaceted campaign from a marketing or HR team. You
    might not immediately think of your cybersecurity team in the same light. But
    if our CISOs and their teams don’t assume the mantle of evangelizing culture,
    how can they expect their business counterparts to do the same with cybersecurity?
    CISOs must meet them more than halfway if a culture of cybersecurity is to take
    root.


    ## W.I.S.D.O.M. for the Cybersecurity Professional


    CISOs have a wealth of resources on best-in-class practices in their trade. This
    W.I.S.D.O.M. isn’t for those looking for deep-dive technical advice. That makes
    it no less important. This prescription is about connecting your value to that
    of the business. It requires CISOs to both cover the basics and stretch beyond
    their departmental walls.


    **Sound cybersecurity hygiene is nonnegotiable.** CISOs must ensure the basics
    are covered and cybersecurity hygiene is at the top of that list of “things to
    do.” This is a case where common sense isn’t always so common. In one of the biggest
    breaches to date, the failure was due to a known vulnerability that was unpatched.
    Even more interesting about the postmortem on this attack: The email roster used
    to notify security administrators of the vulnerability neglected to include those
    who “needed to know.” So the unpatched vulnerability caused the breach. And an
    out-of-date email distribution group of security administrators led to the unpatched
    vulnerability. It’s just one notable example of how the devil truly is in the
    details for cybersecurity professionals.


    Because your infrastructure continues to expand both physically and virtually,
    sound patching requires an inventory of all possible servers in use or otherwise.
    Zombie servers, those that haven’t been used in at least six months, are an example.
    They can make up a significant percentage of an enterprise’s infrastructure. Up
    to 30 percent of all virtual servers are comatose.^([9](#c08.xhtml#c8-note-0009))
    Since nobody is using them, it’s also likely that nobody is actively securing
    them.


    You can’t secure what you can’t see. Your people also can’t patch what you don’t
    promote. In addition to an inventory of all assets and their patch status, review
    your internal communications plan for notifying administrators of a vulnerability.


    Staying on hygiene, inventory your cybersecurity defenses for shelfware. When
    you find a defensive technology your company purchased but has not installed,
    find out why. Is the solution no longer needed? Or has time not been on your organization’s
    side to implement it? If the latter, work the project plan with your own team
    or with a professional services company to ensure your precious investment is
    not rotting on the shelf (and leaving you exposed, to boot!).


    Next, configurations matter. You could have the best hygiene in patching vulnerabilities.
    You could be second-to-none in installing all cybersecurity technologies you purchase.
    But if you’ve improperly configured your security products, hackers will crawl
    through the gaps. While you’re inventorying your patch status, your notification
    lists, and your shelfware, take stock of the configurations on your existing products
    to ensure nothing has changed since the last time you looked at them (which may
    go as far back as when your organization first installed them).


    Additionally, back up your data. While backed-up data won’t protect you against
    all attack varieties (data exfiltration being a prime example), ransomware is
    ineffective against organizations with regularly backed-up data and systems. With
    a *robust* backup system in place, it’s possible to ignore ransomware demands
    and restore all files with relatively low downtime. It’s worth evaluating which
    of your assets you simply cannot do without, and then determining how to back
    up the data and systems to an acceptable degree.


    Of course, backups are useful for other reasons, like being able to restore an
    earlier configuration or earlier version of a document. This can be particularly
    helpful in the case of data weaponization, where hackers manipulate data for deception
    or other reasons. Having regularly archived records allows an organization to
    retrieve an earlier, accurate version of the data if necessary.


    Make sure to test your backup system periodically to ensure the data you’ve been
    archiving is, in fact, being stored—yes, this type of backup failure has been
    known to happen. Use encryption to securely back up all data—yes, at least one
    company received a black eye for its nonencrypted data logs.


    If you find yourself in a cybersecurity department that is not directly aligned
    with your brethren in IT, maintaining sound hygiene is exponentially more difficult.
    Unfortunately, the relationship between CISOs and CIOs sometimes resembles that
    of feuding family members more than kissing cousins. As cybersecurity has moved
    into adolescence, it has struggled to create and maintain an independence separate
    from its IT parent.


    Much of the conflict arises from competing objectives between cybersecurity and
    IT teams. IT is about keeping critical systems running and deploying technology
    in support of the business. Cybersecurity is about protecting the organization’s
    assets. Sometimes, those outcomes may be at odds with one another. For instance,
    a CISO may stall or stop a technology that poses a risk to the organization. A
    CIO may resent this barrier, particularly if his incentives are aligned to a timely
    deployment schedule.


    There has been much debate through the years as to the ideal CIO/CISO relationship.
    In 40 percent of companies, the CISO reports to the CIO, rather than to the CEO
    or CFO.^([10](#c08.xhtml#c8-note-0010)) Some criticize this relationship, citing
    organizational conflict as a key concern. Still others have argued that such a
    structure statistically results in more downtime and higher financial losses due
    to cybersecurity incidents.^([11](#c08.xhtml#c8-note-0011))'
