  raw: '*   But why stop there? Adversaries are beginning to mess with their victims’
    minds, just as they’ve historically done with their money. Perhaps they’ll put
    some fake emails in the mix when the “leak” is exposed. When sprinkled in with
    their authentic counterparts, these counterfeit messages are hard to identify
    and even harder to explain. Communications experts must anticipate how they would
    effectively deny culpability for blatantly falsified emails (or other documents)
    that impugn their brand’s reputation lest they find their company starring in
    its own urban legend of their enemy’s making.


    While cybersecurity attacks are a relatively new phenomenon for communications
    experts, crises are not. We can apply the wisdom from this canon of research to
    our own blueprint for action.


    ## W.I.S.D.O.M. for the Marketer/Communicator


    If luck favors the prepared, you need a plan well before the breach. Time isn’t
    on your side otherwise. When precious minutes are ticking by, the last thing you
    want is for your executive team to be ruled by their own hot emotions of fear
    or anger that can cloud rational thinking.


    **Build a multifaceted communications plan with explicit executive buy-in.** Think
    like a CISO in this exercise. CISOs must provide the board with a view of asset
    risk. All assets are not created equal in this exercise. You’ll need to do the
    same as it pertains to what your company should do, depending on the type and
    severity of attack. Not all attacks are created equal.


    Work with your CISO to identify popular threats your company faces, things like
    web defacement, ransomware, data breach of customer records, data breach of employee
    records, and the like. From there, be very prescriptive about your notification
    principles in each case.


    *   Even if the law didn’t require it, would you notify?


    *   What if your company wasn’t responsible for the attack? How would that change
    the tone and content of your message? (Think of the breach-by-association or data
    weaponization examples mentioned earlier.)


    *   When would you notify? Realize that earlier is better to shape public opinion.
    In fact, the body of research on crisis communications suggests the best timing
    is within one hour of the incident.


    *   Whom would you notify?


    *   What would you say if you didn’t have all information right away (which is
    more than likely to be the case with a breach)?


    *   What would you be willing to offer customers as compensation or as a show
    of victim-centered empathy (such as free identity protection or offering to cover
    customer losses from a credit card breach, for example)?


    Have your CEO and the executive leadership team participate in this exercise and
    agree to the guiding principles that govern how, when, and what you communicate
    based on the severity of the attack.


    This exercise will take weeks, if not months, to complete sufficiently. Since
    chances are your company is already under attack and just doesn’t know it yet,
    formalizing a consensus-built plan is your first priority.


    **Create the communications templates for each scenario identified in your plan.**
    Team up with Legal to frame each message. Write emails, web copy, blogs, telephone
    scripts, press releases, media statements, and other assets, leaving placeholders
    for details that you’ll fill in when the attack occurs. Stage websites (internal
    and external) that can go live quickly to communicate details of the breach when
    it occurs.


    Messages must strike the right balance of instruction and tone. When a crisis
    happens, customers want to know that your company has their best interests in
    mind and the situation under control. Unfortunately, breaches are rarely so cooperative
    in giving your company flexibility on both points.


    In the way of demonstrating your company is in control of the situation, stick
    to the following blueprint for your templates:


    *   Who was impacted?


    *   What data and/or systems were lost, stolen, and/or otherwise compromised?


    *   Over what period did the breach occur?


    *   What precautionary action do stakeholders need to take?


    *   What actions is your company taking to correct the problem and mitigate the
    risk of it happening again?


    Even if your company does not yet have all the information, being early and accurate
    in communicating the details you do have allows you to steal thunder.


    Next, in the way of tone, show empathy in these messages while protecting your
    legal interests—a key reason to get Legal involved early in the exercise. On that
    point, have Legal review all templated messages so, when the breach occurs, you’re
    that much closer to securing final approval once you’ve inserted any remaining
    details.


    We’ve discussed the importance of empathy. This tried-and-true crisis communications
    tenet proves true in the world of data breaches. Ponemon surveyed consumers who
    terminated their relationships with a company following a data breach in 2014.
    When asked what these companies could have done to preserve the relationship,
    more consumers wanted a sincere apology (43 percent) than wanted free identify
    theft and credit monitoring services (41 percent).^([14](#c06.xhtml#c6-note-0014))


    Match your language to the tone. Empathy doesn’t lend itself to technical jargon
    or legalese. Consumers can spot a fake apology a mile away. Another Ponemon study
    in 2012 found approximately one-third of consumers complaining about the length
    or legalese in the post-breach communications they received.^([15](#c06.xhtml#c6-note-0015))


    **Design the tick-tock schedule for every attack scenario.** Cybersecurity’s currency
    is time. Design your plans accordingly. Have minute-by-minute schedules for each
    attack vector. You likely won’t have all the information in the early minutes
    of finding out your company has been breached.


    Lucky for you, your communications plan will guide you on what your executive
    team is comfortable releasing, and when. Because you will have built this plan
    while not under the duress of the clock, you can be more persuasive in submitting
    evidence that shows early-and-often communication pays (remember The Home Depot
    as a sterling example)—even when not all facts are readily available.


    Your tick-tock schedule should identify who is responsible for distributing messages
    and/or assets to key stakeholders at every phase of the plan. More than 60 percent
    of consumers say that their satisfaction with a breached company’s response would
    greatly improve if the organization notified them immediately.^([16](#c06.xhtml#c6-note-0016))


    **Be sure your plan includes employees**, whether employee records are breached
    or not. During crises, employees (perhaps even more so than customers) need reassurance
    that their employer is in control. Employees are the best brand ambassadors for
    a company. If you keep them in the dark on the details of the situation, they
    can’t help you spread your message, leaving you once again a potential victim
    to the “friend-of-a-friend” grapevine. Actively engage your employees to enlist
    their support and calm any anxieties. In terms of tactics, consider going beyond
    email and intranet updates. Have at least one town hall meeting to explain the
    situation. Additionally, open a conference hotline each day for a scheduled period
    (say, 30 minutes), where you can update interested employees on the latest and
    answer any questions.


    **Practice, practice, practice.** CISOs run red-teaming exercises, where they
    simulate attacks on their organization to identify vulnerabilities and shore up
    defenses. In the same way, CMOs should practice crisis drills to test their team’s
    effectiveness in responding according to plan. Crisis management experts recommend
    doing so at least once a year to build the muscle memory of your organization.'
