  trans: "\n\n- 不要落入社交工程攻击的圈套。警惕恶意邮件的迹象，例如发件人的电子邮件地址。不要点击来自未知来源的链接。\n- 积极主动，立即向您的网络安全团队报告任何可疑邮件。\n\
    - 确保笔记本电脑、移动设备和其他个人技术的安全补丁保持更新。当您的安全机构推送安全更新时，不要推迟。\n- 养成良好的网络安全习惯——使用强密码，不要重复使用密码，并避免未加密的\
    \ USB 设备。\n\n## 产品开发人员的 W.I.S.D.O.M. 原则\n\n- 在发现阶段询问客户关于他们的网络安全需求。\n- 将安全性作为任何最小可行产品（MVP）需求的一部分。\n\
    - 在设计任何新产品或服务时，清晰且有意识地定义您的数据需求。\n- 在产品生命周期的每个阶段建立安全所有权。\n- 如果在产品发布的任何一点安全性缺失或不足，应立即停止流程。奖励并公开表彰公司其他采取同样行动的员工。\n\
    \n## 人力资源专业人士的 W.I.S.D.O.M. 原则\n\n- 扩大网络安全人才的范围——男性和女性、少数群体和非少数群体、艺术与科学（STEAM）。审查当前的网络安全职位招聘公告以寻找多样化的技能。寻找包含无意识偏见的面试问题，包括常见的类型，如“请告诉我你曾……”或“请谈谈网络安全领域最新最热门的创新”。在每个面试小组中至少安排一位具有多样化背景的领导者。\n\
    - 检索公司价值观，查看可以在哪里添加 `securely`（安全地）或其派生词，在不改变目的的情况下改变其适用范围。\n- 奖励并认可那些加强公司网络安全防御的行为。\n\
    - 与您的 `CISO` 合作，识别并控制组织最宝贵资产的访问权限。寻找一种保密且无威胁的方式，让尽职的员工在看到类似于恶意内部威胁的情况时能够进行举报或发出警报。当他们这样做时，给予适当的奖励。\n\
    - 确保执行团队的每位成员至少有一个网络安全关键绩效指标（`KPI`）。\n\n## 营销/传播人员的 W.I.S.D.O.M. 原则\n\n- 构建一个获得高层明确支持的多维度沟通计划。该计划应包含对以下问题的回答：\n\
    \    - 即使法律没有要求，你会通知吗？\n    - 如果你的公司不对攻击负责会怎样？这将如何改变你发布信息的语气？（以关联性泄露和数据武器化使用用例为例。）\n\
    \    - 你会在什么时候通知？\n    - 你会通知谁？\n    - 如果你没有立即获得所有信息，你会说什么？\n    - 你愿意向客户提供什么补偿，或作为对受害者为中心的同情展示（例如提供免费的身份保护，或提议承担信用卡泄露导致的客户损失）？\n\
    - 为计划中确定的每种场景创建沟通模板。在模板中留出占位符来回答以下问题：\n    - 谁受到了影响？\n    - 哪些数据和/或系统丢失、被盗或以其他方式遭到破坏？\n\
    \    - 泄露发生在什么时间段？\n    - 相关利益者需要采取哪些预防措施？\n- 相关利益者需要采取哪些预防措施？\n- 相关利益者需要采取哪些预防措施？\n\
    - 执行一次。\n- 至少每年练习一次应急演练。\n\n## 财务专业人士的 W.I.S.D.O.M. 原则\n\n与您的 `CISO` 合作，识别并控制组织最宝贵资产的访问权限。寻找一种保密且无威胁的方式，让尽职的员工在看到类似于恶意内部威胁的情况时能够进行举报或发出警报。当他们这样做时，给予适当的奖励。\n\
    - 确保执行团队的每位成员至少有一个网络安全关键绩效指标（`KPI`）。\n\n"
- fmt: "\n- Is data encrypted when it moves between nodes, modules, instances, or\
    \ virtual servers? If not, is there an option to add this capability? Describe\
    \ the encryption used.\n- Is data encrypted when it is at rest (e.g., stored in\
    \ a database, stored on a backup tape, etc.). If not, is there an option to add\
    \ this capability? Describe the encryption used.\n- Assessing how they train their\
    \ employees on cybersecurity awareness and hygiene protocol.\n    - Does your\
    \ organization have a security awareness and training program?\n    - Does the\
    \ organization ensure that personnel are annually trained in the organization’s\
    \ security policies and required to know changes or updates to these policies?\n\
    \    - Does the organization ensure that all personnel with access to confidential\
    \ data have information security training for their respective roles?\n    - Does\
    \ the organization ensure that all personnel with access to personally identifiable\
    \ information (PII) complete a privacy training class and are knowledgeable of\
    \ any specific privacy requirements for the data being handled?\n- For your most\
    \ strategic suppliers, consider hiring a third party to audit their security practices\
    \ once a year.\n- If there is the slightest concern that one of your third parties\
    \ looking to promote a relationship with your company does not hold itself to\
    \ the cybersecurity standards you require, don’t allow them to promote it.\n\n\
    ## W.I.S.D.O.M. for the Cybersecurity Professional\n\n- Sound cybersecurity hygiene\
    \ is nonnegotiable. Keep patches updated—on both physical and virtual infrastructure.\
    \ Review your internal communications plan for notifying administrators of a vulnerability,\
    \ including a periodic review of distribution lists to confirm accuracy. Install\
    \ shelfware. Ensure proper configurations of security defenses. Back up your data\
    \ (and test the backup system). Conduct regular penetration testing and provide\
    \ regular readouts on progress to executives and board members.\n- CISOs and CIOs\
    \ must align on metrics and goals. Establish roles and responsibilities for proper\
    \ cybersecurity hygiene, including patching, backups, multifactor authentication\
    \ and the like, at the beginning of each planning cycle.\n- Identify and allocate\
    \ what portion of the budget will serve IT versus cybersecurity. Agree to key\
    \ performance indicators (KPIs) and service level agreements (SLAs) to prioritize\
    \ efforts and resolve disputes when they arise.\n- Invest in technologies that\
    \ drive your business value up and that of your adversaries, down.\n    - Cloud\
    \ access security broker (CASB) technologies help secure sanctioned and unsanctioned\
    \ cloud services.\n    - Deception technologies distract and confuse adversaries.\n\
    - Use artificial intelligence (AI) capabilities to identify the most advanced\
    \ threats and address the talent shortage, but know its limitations. AI creates\
    \ more false positives. Traditional threat intelligence has more false negatives.\
    \ Both together yield high efficacy with lower false positives.\n- Carry the culture\
    \ flag for cybersecurity at your company.\n    - Spread it vertically by speaking\
    \ the language of the boardroom and its executives (risk management). Partner\
    \ with the finance organization to translate cyber-speak into metrics and outcomes\
    \ most understood and valued by the board.\n    - Spread it horizontally through\
    \ culture awareness campaigns. Hire a communications expert to work with HR and\
    \ Marketing to develop effective campaigns that make cybersecurity part of everyone’s\
    \ day job. Deliver actionable scorecards to functional peers that measure employee\
    \ understanding of cybersecurity principles and adherence to company policies.\n\
    \n## Notes\n\n1. ^([1](#c10.xhtml#c10-note-0001-1)) D. Frances, “Ready for the\
    \ Big One,” *Sonoma Index Tribune*, January 30, 2014.\n2. ^([2](#c10.xhtml#c10-note-0002-1))\
    \ `https://www.usgs.gov/faqs/can-predict-earthquakes`, accessed March 20, 2019.\n\
    3. ^([3](#c10.xhtml#c10-note-0003-1)) “Ready for the Big One,” *Sonoma Index Tribune*,\
    \ Thursday, November 23, 1989.\n"
