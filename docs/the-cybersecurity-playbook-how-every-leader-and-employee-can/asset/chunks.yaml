    目标是尽可能高效地降低风险。有很多问题可以促进首席信息安全官（CISO）和首席财务官（CFO）在不同的层次进行沟通，例如：


    * 哪些资产面临风险？

    * 这些资产的战略价值是什么？

    * 这些资产目前的漏洞水平处于如何？

    * 如果发生数据泄露，会产生什么后果（财务损失、知识产权泄露、声誉风险）？


    为了确保网络安全不是事后才想起来的补救措施，在审查其他领导者提交的业务案例时，CFO 应该询问以下问题：


    * 新的[市场、内部技术、客户产品等]如何改变公司的攻击面？

    * 它是如何改变公司最具战略性的资产的风险状况的？

    * [假设风险有所增加] 需要多少额外投资（一次性及经常性）才能将风险状况恢复到可接受的基准水平？这项投资是否包含在投资回报率（ROI）分析中？


    在`确保资源支出得到最高效利用的情况下，要求 CISO 提供以下领域的指标`是非常公平的：


    * 在那些仍然放在架子上的产品（闲置软件）中投入了多少网络安全资金？

    * 这些产品的部署计划是什么？

    * 上一次确保安全产品配置得当的审计是什么时候执行的？结果如何？

    * 上一次进行渗透测试是什么时候？结果如何？

    * 上一次对所有员工进行网络安全培训是什么时候？结果如何？


    接下来，作为采购负责人，`财务专业人员引导其组织通过降低第三方暴露来缓解关联泄露`。从对所有第三方进行全面盘点开始（根据 Ponemon 的研究，只有 34%
    的组织声称他们拥有清单^9）。从那里开始对网络安全防御和实践进行审计。坏消息是这可能花费大量精力和。好消息是，同样的审计问题可以用于筛选任何想要成为供应商的新第三方。


    这些问题将集中在多个领域，以评估合作伙伴的网络安全态，包括：


    * 观察第三方如何评估和更新访问权限和权利。

    * 理解他们的业务连续性流程以及测试频率。

    * 在其变更控制指南中查找针对系统新用户和/或新软件的规定。

    * 澄清贵公司与他们之间传输的任何数据将如何被使用、保护以及在适当何时处置（在合同终止时和/或根据合性标准）。

    * 了解他们如何在各种状态下（静态、使用中和传输中）对数据进行加密。

    * 评估他们如何对员工进行网络安全意识和卫生协议培训。


    `对于您最具战略性的供应商，考虑每年聘请第三方审计一次他们的安全实践。` 筛选供应商是一个极好的第一步。但要确保他们在成为您的客户后其安全实践不会变得松懈，则需要更大的谨慎。


    最后，要留心你允许第三方宣传关于贵公司的信息。合作伙伴发布新闻稿来宣布其业务安排是常见做法。公司在网站上到处展示其所有客户、供应商和/或合作伙伴的 Logo
    也是正常现象。我是一个营销人员，所以我理解这一点。利用生态系统的力量为各方增加品牌价值通常是一件好事。


    但要保持谨慎。任何想要推广其与贵公司关系的第三方，都会向黑客泄露他们可能渗透贵公司的侧门和后门。这向这些网络王国的寄生虫展示了，一旦他们知道共享同一堵墙的邻居，该如何渗透贵公司。如果稍微担心某个想要推广其与贵公司关系的第三方没有达到你要求的网络安全标准，`不要允许他们推广`。


    这只是一个详尽清单子集，旨在确保你的第三方在保护你的组织免受威胁方面像你一样有纪律。如果他们认真想要赢得你的业务，他们难道不应该同样倾向于保护这笔业务吗？


    ***


    财务和网络安全的领域表面上似乎并不契合。但深层次的观察发现，它们的共同点比表面看到的的要多。从核心来看，网络犯罪是一门大门生意——这是 CFO 可以理解的。反之，网络安全关乎风险管理——这是财务人员非常熟悉的另一个概念。CFO
    可以帮助 CISO 更流利地使用董事会的语言（风险管理）。反之，CISO 可以帮助采购部门的人在筛选第三方时使用网络安全的语言。当这两个职能汇聚在一起欣赏他们的相似性并抛弃差异时，双方都能从协作中变得更强大。毕竟，坏分子已经知道协作的价值了。难道现在不是
    CFO 和 CISO 意识到同样的时候吗？


    ## 备注


    1. ^(1) McAfee, “网络犯罪的经济影响——并未减缓。”

    2. ^(2) McAfee Labs 威胁报告，2018 年 12 月，[`www.mcafee.com/enterprise/en-us/assets/reports/rp-quarterly-threats-dec-2018.pdf`](https://www.mcafee.com/enterprise/en-us/assets/reports/rp-quarterly-threats-dec-2018.pdf).

