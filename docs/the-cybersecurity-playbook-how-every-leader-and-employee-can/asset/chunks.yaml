- fmt: '

    What this age-old debate reveals is that `CISOs` and `CIOs` must be aligned within
    the spirit, not simply the letter, of the law. This requires `CISOs` to engage
    `CIOs` on metrics and goals, regardless of whether the former reports to the latter
    or the two are peers sitting around the same table. In particular, the roles and
    responsibilities for proper cybersecurity hygiene—including patching, backups,
    multifactor authentication, and the like—must be established and agreed upon at
    the beginning of each planning cycle. If the two functions share a budget, the
    leaders must identify and allocate what portion will serve `IT` versus `cybersecurity`.
    In addition to run-rate budget carveouts for each, perhaps any new `IT` project
    is ascribed a `cybersecurity tax` to fund and protect new technologies. As discussed
    for other functions, `CISOs` and `CIOs` should agree to key performance indicators
    (`KPIs`) and service level agreements (`SLAs`) to prioritize efforts and resolve
    disputes when they arise.


    ## Cybersecurity Hygiene

    Managing this list alone is challenging work (it’s one of the reasons cybersecurity
    hygiene is so difficult to practice). Conduct regular penetration testing on your
    environment, preferably using third parties. These companies will help you find
    unknown vulnerabilities (in your cybersecurity hygiene or in otherwise lacking
    defenses) before bad actors do.


    ## Cloud Adoption and Security

    Next, invest in technologies that drive your business value up and that of your
    adversaries down. Specifically, businesses are moving to the cloud. More importantly,
    employees are moving to the cloud. So unless your organization is completely restricted
    (and some, such as large government agencies, are), chances are you won’t be able
    to stop employees from accessing potentially dangerous applications or services
    in the workplace.


    If you can’t beat them, join them. Rather than resist the move to cloud, embrace
    it. Consider Cloud Access Security Brokers (`CASB`) as one potential solution.
    Essentially, `CASB` technologies give security organizations visibility of and
    control over cloud services in use by their organizations (sanctioned or otherwise).
    They can detect security configuration errors in cloud controls (such as a publicly
    readable and/or writeable `storage bucket`). They may allow organizations to set
    consistent security policies across any cloud environment. In short, they allow
    organizations to secure the popular cloud services employees are using. And they
    allow `CISOs` to support their companies’ transformation agendas while ensuring
    security remains at their center.


    ## Adversary Tactics

    Now, about impacting your adversary’s value negatively. I said earlier that there’s
    no such thing as playing offense in cybersecurity. That’s true. Defenders, by
    their very definition, don’t strike first. But they can still confuse their enemies.


    The art of deception in war goes all the way back to Sun Tzu. In cybersecurity,
    carefully disguised `decoys` that appear to be treasure troves planted in your
    infrastructure do a few things. First, they give you additional data points through
    which to track your enemy’s patterns. Second, they distract your enemy from the
    real treasure you are interested in protecting. Finally, they waste your enemy’s
    time and resources on wild goose chases. This last point is really about as close
    to playing offense as cybersecurity teams can get.


    ## Artificial Intelligence and Machine Learning

    Use artificial intelligence (`AI`) capabilities to identify the most advanced
    threats and address the talent shortage—but know its limitations. `AI` is the
    latest buzzword technology in cybersecurity. To be sure, it promises to help cyber
    defenders find the most sophisticated threats in their environment quickly, pairing
    the scale of machines with the problem-solving capabilities of humans. But beware
    of cybersecurity marketers disguised in sheep’s clothing. While `AI` promises
    to help strapped `CISOs` do more with less, it comes at a cost—`false positives`.


    Adding to the complexity of this topic is a new threat category called `adversarial
    machine learning` (`AML`). Bad actors are at it again, innovating in ways to create
    chaos or harm. With `AML`, adversaries manipulate inputs to otherwise sound `machine
    learning models`. The “garbage-in, garbage-out” premise applies as much in cybersecurity
    as in any other realm of `IT`. A `machine learning model` is only as good as its
    inputs. If the inputs are faulty (or tampered with), the model’s accuracy suffers.


    At a recent tradeshow, McAfee showed how the slightest changes to pixels in an
    image, imperceptible to a human eye, could confuse a `machine learning model`
    into classifying a picture of a penguin as . . a frying pan! Frying pans and penguins
    may be harmless in the real world. But imagine the same poisoning of pixels in
    a digital stop sign that an autonomous car now registers as a speed limit sign,
    and you can imagine how dark the use cases in this area can get.


    Enemies can potentially inflict the same confusion to malware classification engines.
    By introducing slight variants to highly sensitive `machine-learning models`,
    adversaries can disorient cybersecurity professionals. They can slam these first
    responders with a rash of `false positives`, perhaps deadening their sense of
    urgency to respond in the process (in much the same way nuisance fire alarms have
    been shown to do in multi-tenant buildings).

