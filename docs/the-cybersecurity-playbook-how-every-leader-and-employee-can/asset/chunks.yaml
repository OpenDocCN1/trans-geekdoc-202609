    GM adopted its philosophy from Henry Ford. Factories were highly departmentalized,
    division of labor was the standard, and efficiency was king. If we had to sum
    up the GM culture with a bumper sticker slogan, it might be simply “Never stop
    the line.” In fact, those four words were a cardinal rule in the former GM plant.
    No matter what, the assembly line could never stop.


    An interesting mandate, since so few workers showed up on some mornings that the
    production line couldn’t even start. On those days, GM would bring in people off
    the street to fill the void. And when the production line finally started, it
    didn’t stop.


    Billy Haggerty worked in hood and fender assembly. Rick Madrid built Chey trucks
    for the plant. Along with Bruce Lee, they were interviewed by NPR to give the
    rest of us a glimpse into just how strictly that golden rule was practiced at
    the former GM Fremont plant.


    *   Haggerty: *The line could never stop, never stop the line.*

    *   Madrid: *You just don’t see the line stop. I saw a guy fall in the pit and
    they didn’t stop the line.*

    *   Lee: *You saw a problem, you stop the line, you are fired.*


    Workers would deal with defects after the fact. For GM, it was about quantity
    over quality.


    Toyota built its philosophy on continuous improvement. Not only were employees
    allowed to stop the line, but Toyota encouraged them to do so. The “andon cord”
    was within reach above the head of every worker on the line. (Andon comes from
    the Japanese word for paper lantern. Accordingly, workers could visually signal
    whether things on the line were just fine—green light; whether production quality
    was at risk—yellow; or whether a decline in quality meant it was imperative to
    stop the line—a red light.)


    Toyota wasn’t just building cars; they were building a process—one that welcomed
    good ideas from any level of the company. One that relentlessly pursued and obliterated
    every inefficiency. One that persisted to set the bar higher and higher.


    This “Stop the Line” philosophy empowered every employee to be a plant manager
    of sorts and made quality an inherent part of everyone’s job responsibility. Toyoda
    brought the Japanese philosophy to U.S. auto workers. When the White House Automotive
    Task Force assessed GM decades later in 2009 during the latter’s `Chapter 11`
    bankruptcy, it acknowledged acknowledged GM’s global production and procurement
    system, modeled on Toyota’s, as world-class and every bit as efficient as its
    Japanese teacher’s. As Toyoda was the leader of Toyota’s venture into Fremont,
    GM owes much of their tutelage to the late visionary himself.


    But Toyoda’s impacts extend far beyond GM or even to the automotive industry.
    At around the same time as the Fremont plant’s success in the 1980s, the Total
    Quality Management (TQM) movement gained traction across multiple industries—where
    continuous improvement was the new face of management and quality the prize.


    TQM eventually gave way to other movements like `ISO 9000`, `Six Sigma`, and lean
    manufacturing. While the standards and the names may have changed, the guiding
    principle didn’t. Quality was no longer a `nice-to-have`; it was essential to
    a company’s long-term success.


    Security, as an endeavor, is similar to where quality was before we all caught
    TQM fever. When designing products and processes, we tend to think of security
    as tomorrow’s problem. It’s something we’ll get around to after a product exits
    the line. We’ll fix it after the fact. In many ways, security is an aftermarket
    afterthought. And that thinking must change if we are to embed security in everything
    we deliver.


    If not, the results could be catastrophic.


    ## The Internet of Terrorism


    The year was 2016. You may not realize it, but a war occurred on October 21 of
    that year. It lasted only a day, but it will go down in infamy in the annals of
    cybersecurity. Because that’s when the Internet’s ramparts were breached by marauders
    intent on chaos at a scale not previously seen. It was the day the Internet broke.


    The events of October 21, 2016, prove that truth can be stranger than fiction.
    What was unusual about that day was not that hackers deliberately set their sights
    on a company to inflict damage. That kind of headline news has become all too
    commonplace in our digital world. What was unique about the attack was the company
    that found itself in crosshairs: `Dyn`.


    While you may not have heard of `Dyn` in 2016, you undoubtedly used the services
    they enabled: `Twitter`, `Netflix`, `Spotify`, and `Etsy`, to name a few. Among
    other things, `Dyn` was a `domain name system` (`DNS`) provider. When you entered
    a website address for one of popular services, `Dyn` mapped it to its corresponding
    `IP` location.


    On that fateful day, hackers crippled `Dyn` with a `distributed denial of service`
    (`DDoS`) attack. `DDoS` attacks are a perennial scourge among hackers. They occur
    when hackers flood a website with excessive traffic to effectively bring it to
    its knees. Our Internet is comprised of multiple routes and destinations, not
    unlike an intricate highway system. When enemies target a website, they can launch
    a `DDoS` attack to congest it to the point of failure.


    While `DDoS` attacks are among hackers’ more popular varieties, there were two
    notable exceptions to the `Dyn` attack that made it categorically special. First,
    most `DDoS` threats target a particular company. In fact, there are companies
    in certain industries more susceptible to these pernicious launches than others.
    Take online gaming. Many online games are of the “high-twitch” variety, meaning
    they rely on a player’s fast reaction time for victory to ensue. If a hacker can
    congest the virtual highways that connect online players to their shared experience,
    response times slow to a grinding halt, making it impossible for you to shoot
    your opponent before he can fire a bullet in your direction, as an example. Though
    uniquely harmful to online gaming outfits, `DDoS` attacks can wreak havoc for
    any company with a digital presence.


    The `Dyn` attack was unique in another way. `DDoS` attacks require enormous scale
    to execute. The typical website won’t be buckled by a few hundred or even a thousand
    motivated hackers each pinging it at the same time. It would require millions
    of attempts to deliver a crushing blow.

