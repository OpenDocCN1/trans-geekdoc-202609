    既然谈到了软件开发人员，这里还有另一个建议供你参考。请确保安全是任何最小可行产品（MVP）的一部分。当《精益创业》的作者埃里克·里斯（Eric Ries）推广
    MVP 时，他捕捉到了任何初创公司努力目标的核心：发布一个新产品，使开发团队能够以最少的努力收集关于客户使用和接受程度的最大信息。这一过程非常适用于云端应用，因为这类应用的前期资金需求很小（因为许多应用利用了
    `AWS`、`Azure` 和 `Google` 提供的公共云基础设施）。从本质上说，它允许产品开发中的快速学习、快速迭代以及与客户的持续反馈循环。这些都是好事——特别是如果它能让一家初创公司（或任何公司）避免发布一款在市场上毫无沉沉的软件产品的昂贵错误。


    ## 安全：最小可行性产品的核心部分


    事实是这样的：不要过度关注别名中的“最小（minimum）”一词，而忽略了紧随其后的词——“可行（viable）”。**安全性必须内置，而不是事后补上**，无论是针对早期采用者的产品，还是面向大众市场的产品。安全性*必须*是你的最小可行产品需求的一部分。


    其次，在设计产品时，要审慎考虑你的公司将如何、在何处以及使用多久客户数据。某些法规会迫使你的公司关注这些事情（假设你们需要额外的动力）。因此，我在这里讨论的不是监管机构发布的强制性要求。相反，我指的是你的公司自我负责的伦理标准。明确的是，在这两个标准——法律要求或你公司的伦理原则——中，较高的那个就是这项测试的底线。


    例如，在第一章中，我讨论了黑客对热门社交媒体平台上的 McAfee 公司页面进行的篡改。虽然我们的事件中没有涉及客户数据，但它能帮助我描绘出我在此点上的意图。由于没有数据被盗取，也没有
    McAfee 的系统被入侵，McAfee 完全没有法律义务报告这次黑客攻击，更不用说通知媒体了。


    但 McAfee 对自己的要求的标准比法律要求更高。在这种情况下，当黑客将我们的 Logo 换成一张图像时，我们员工的社交媒体页面以及 McAfee 的公司简介页也遭到了篡改。这张图像在任何个人资料中列出
    McAfee 的员工的个人页面上显示了几个小时。McAfee 有一个我们与员工共同维护的价值观：*我们实践包容性的坦诚与透明。*虽然法律限制并不要求我们进行任何报告，但我们自己的公司价值观要求更多。


    因此，在攻击发生后的第二天，我们在内网首页发布了一篇头条故事，向所有员工承认了此事。我们知道风险在于，一个没有收到任何真实媒体关注的故事（因为攻击发生在原本安静的复活节周日），如果有*一个*员工将其发送给媒体，可能会在周一早晨引发关注。坦率地说，这并没有发生。最终，如果我们想要维护超出法律要求的公司价值观，这就是我们必须承担的一种风险。


    ## 定义数据和安全需求


    **在任何新产品或服务的设计中，清晰且有意识地定义你的数据需求**——坚持法律要求或伦理标准中较高的那一个。我再给你一个例子来进一步说明这一点。到目前为止，少数对报告勒索软件攻击发布明确指导的美国监管机构之一是卫生与人类服务部（这种监管指导的出现是向前的一步，特别是考虑到医疗保健是勒索软件的频繁目标；但考虑到其特殊性，它也代表了为什么勒索软件可能比实际报告的行业数据所显示的要糟糕得多）。如果你的公司对客户有类似的透明度价值观，并且需要披露勒索软件攻击，那么你对于存储客户数据时想要承担多少风险可能会有不同的观点，即使法律在这方面可能更加宽松（也就是说，直到美国和其他国家采取
    `EU` 的做法并重新审查与客户隐私相关的指导意见）。


    ## 安全所有权


    **其次，将安全所有权纳入产品生命周期的每个阶段。** 你的产品或服务将如何升级以应对下一个威胁向量？哪个部门负责持续维护和补丁？发生漏洞后谁负责处理？预算设在何处？你明白意思了。要明确公司内部的职责划分（swim
    lanes），以及何时何地必须做出安全决策并分配资源。


    与维护产品所需的精力相比，引入产品所需的精力可能很简单。只有在第一批客户采用你的作品之后，不可避免的支持、扩展性以及——是的——安全问题才会显现。到那时，你成功发布时的兴奋喜悦将成为遥远的回忆。在你的产品到达第一位客户之前，提前为这些确定性事项建立明确的所有权，将节省并在并在降低风险。


    这与你在思考产品生命周期其他问题时可能实践的纪律没有区别。除了签署支持和扩展性问题已在计划之内之外，公司每个部门最高职能负责人（如客户支持、工程或营销部门）还应该明确审查并批准其职能的安全需求在产品进入市场之前是否已充分内置到产品中。


    ## 停下生产线


    最后，但同样重要的是，如果产品发布过程的任何部分缺乏或缺失安全性，你必须**停线（stop the line）**。更重要的是，你应该积极鼓励直接或间接参与开发过程的*任何*员工遵循这种停线哲学。这在执行上绝非易，因为在商业中时间就是金钱。但对于那些所有员工都没有集中在一个物理位置的公司来说，这更加困难（例如位于弗利明特的
    `Toyota` 工厂，其环境中有实物线索，包括通用的红色、黄色或绿色，这些颜色能立即且明确地向所有工厂员工传达当前的质量状态）。同样，许多公司并没有让员工可以激活以立即停线的拉绳或按钮。例如，对于软件而言，并没有物理生产线。

    '
- fmt: '

    Employees notice reward and recognition in companies. It’s one part of the culture
    that is highly visible and clearly communicates what is (and is not) important
    to senior leadership. When an employee stops the line, find a way to reward her.
    Then publicly recognize her through any communication vehicle most leveraged by
    your company (here’s where your HR and marketing colleagues can help you). The
    point is that you want employees to know that your company takes security as seriously
    as it does quality. When they see for themselves how you’ve changed your reward-and-recognition
    system acknowledging that, you’ll find more diligent employees speaking up when
    security is falling down. And you’ll save your company from potential financial,
    reputational, or intellectual property losses down the road.


    ***


    Companies have come a long way from the cavalier, haphazard mentality once given
    to product quality. Educated buyers can easily check a company’s quality track
    record before making a commitment they may regret. Today, companies know the value
    of a quality experience. They measure it in customer satisfaction, net promoter
    scores, and retention. They compete for it in customer awards. And they see the
    value of it in their financial results.


    Cybersecurity is the quality of our generation. Like quality before it, it’s underestimated,
    underappreciated, or simply unmeasured. A good friend of mine often says, “What’s
    bred in the bones will come out in the flesh.” A company with strong cybersecurity
    marrow in its bones stands to benefit in less risk, fewer financial losses, more
    customer trust, and, yes, higher quality thanks to products inherently designed
    and built with both cybersecurity and quality in mind. As the dreamers and designers
    of tomorrow’s products, developers have an essential role to play in embedding
    cybersecurity in everything we consume.


