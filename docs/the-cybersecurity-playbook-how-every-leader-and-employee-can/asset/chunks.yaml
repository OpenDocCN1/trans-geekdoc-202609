    ## Note

    1. 什么让西雅图的“第 12 人”变得特殊？Louise Bien, SB Nation, 2015 年 1 月 22 日。


    ## 第 2 章


    ### 玻璃胶纸先生（Mr./Ms. Cellophane）


    > *即使不像母鸡一样咯咯叫，*

    > *每个人偶尔会被注意到，*

    > *除非，那个人物应该是*

    > *隐形的我。*

    > *玻璃胶纸，玻璃胶纸先生，*

    > *本该是我的名字，胶纸，*

    > *因为你可以看透我，*

    > *从我身边走过，却不知道我在这里。*


    ### 副总裁/执行副总裁，专业服务


    可怜的阿莫斯（Amos）。他的妻子冷酷地杀了情人，并声称这是针对那个她所说的“陌生人”的正当防卫。在发现那段偷情的丑陋真相后，阿莫斯依然尽职地站在她身边。阿莫斯走到哪里，他都是她故事中的一个影子，对周围的人来说几乎是隐形的。我说的是获奖音乐剧《芝加哥》中的那个角色。他在那首恰好题为“玻璃胶纸先生”的独唱中，哀叹自己是多么被忽视了：


    我们中的许多人都能对阿莫斯产生共鸣，因为有时我们觉得自己是隐形的。这不是一种很好的感觉，通常伴随着被低估或不被赏识。而且被完全误解也一点也不趣。


    长期以来，首席信息安全官（CISO）一直是我们组织中隐喻意义上的“玻璃胶纸先生/女士”，注定在虚拟的无名中辛勤，孜不倦地专注于安全这项基础性工作。他们生活在他们所保护的人的影子里。事实上，如果他们脱掉隐形的斗篷，各方注定会出现麻烦。


    作为员工，我们不希望被 CISO 或他们的部门打扰。我们只希望他们能让我们保持安全。我们希望他们在做这些的同时不要挡我们的路。事实上，CISO 是从我们组织的后办公室起家的，字面上就是看不见也不在意。

