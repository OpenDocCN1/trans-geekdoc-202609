    ## The Internet of Terrorism


    The year was 2016. You may not realize it, but a war occurred on October 21 of
    that year. It lasted only a day, but it will go down in infamy in the annals of
    cybersecurity. Because that’s when the Internet’s ramparts were breached by marauders
    intent on chaos at a scale not previously seen. It was the day the Internet broke.


    The events of October 21, 2016, prove that truth can be stranger than fiction.
    What was unusual about that day was not that hackers deliberately set their sights
    on a company to inflict damage. That kind of headline news has become all too
    commonplace in our digital world. What was unique about the attack was the company
    that found itself in hackers’ crosshairs: Dyn.


    While you may not have heard of Dyn in 2016, you undoubtedly used the services
    they enabled: Twitter, Netflix, Spotify, and Etsy, to name just a few. Among other
    things, Dyn was a domain name system (DNS) provider. When you entered a website
    address for one of these popular services, Dyn mapped it to its corresponding
    IP location.


    On that fateful October day, hackers crippled Dyn with a distributed denial of
    service (DDoS) attack. DDoS attacks are a perennial favorite scourge among hackers.
    They occur when hackers flood a website with excessive traffic to effectively
    bring it to its knees. Our Internet is comprised of multiple routes and destinations,
    not unlike an intricate highway system. When enemies target a website, they can
    launch a DDoS attack to congest it to the point of failure. While DDoS assaults
    are among hackers’ more popular threat varieties, there were two notable exceptions
    to the Dyn attack that made it categorically special.


    First, most DDoS threats target a particular company. In fact, there are companies
    in certain industries more susceptible to these pernicious launches than others.
    Take online gaming, one of the more popular industries targeted for DDoS assaults.
    If you’re an online gamer, you likely know why. Many online games are of the “high-twitch”
    variety, meaning they rely on a player’s fast reaction time for victory to ensue.
    If a hacker can congest the virtual highways that connect online players to their
    shared experience, response times slow to a grinding halt, making it impossible
    for you to shoot your opponent before he can fire a bullet in your direction,
    as an example. Though uniquely harmful to online gaming outfits, DDoS attacks
    can wreak havoc for any company with a digital presence. By flooding a website
    with garbage traffic, hackers can deny legitimate visitors access.


    But the Dyn attack was distinct. It took out multiple websites with one hit. By
    congesting Dyn’s DNS service—the metaphorical equivalent of the postal address
    system on the web—hackers blocked entry to several popular sites. In one fell
    swoop, an entire region of the United States found some of the most popular web
    services unavailable as the Internet backbone itself gave way. If you imagine
    our nation’s participation on the Internet as a nighttime view from space, on
    that fateful October day, the Eastern seaboard simply disappeared. In our hypothetical
    view from on high, tens of millions of people and the digital infrastructure they
    rely on was swallowed up by darkness to apparently join the Atlantic Ocean’s vast
    expanse. Hackers effectively erased the digital existence of one of the most powerful
    corridors of power on our planet.


    The Dyn attack was unique in another way. DDoS attacks require enormous scale
    to execute. The typical website won’t be buckled by a few hundred or even a thousand
    motivated hackers each pinging it at the same time. It would require millions
    of attempts to deliver a crushing blow.'
