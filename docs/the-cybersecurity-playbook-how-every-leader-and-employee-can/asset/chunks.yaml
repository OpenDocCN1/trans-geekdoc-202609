    talent helping in the fight—men and women, minorities and non-minorities, arts
    and sciences. To this last point, our industry has been so focused on STEM (science,
    technology, engineering, and math) that we’ve lost STEAM (science, technology,
    engineering, arts, and math). Cybersecurity is as much a psychological battle
    as it is a technical one (combat lends itself to both). It entails both soft and
    hard skills. It exercises creativity as much as it does problem solving.


    Review your cybersecurity job postings and look for a balance of skills that widen
    the market of applicants. Doing so will not compromise the quality of candidates
    (this isn’t about lowering standards). Look to the history of women in this field,
    back when complex math was computed in a human’s brain, not a machine, and you’ll
    realize that women are equally as capable of fulfilling the roles as men. You
    may simply need to look for the same unconscious bias that had universities weeding
    out diverse talent in the late 1980s in your company’s own cybersecurity job descriptions.
    When you find it, *weed it out* relentlessly.


    But that’s still not sufficient. You’ll need to do the same throughout your recruitment
    process. That includes the interview. Unfortunately, questions that are everyday
    fare in many interviews are also a source of unconscious bias. For instance, behavioral
    interview questions that are commonplace (such as, “Tell me about a time when
    . . .”) naturally favor candidates with more history. However, that history may
    or may not be relevant to today’s challenges. In fact, research suggests such
    questions predict success only 12 percent better than a coin flip.^([6](#c05.xhtml#c05-note-0006))


    Instead, give the candidate a problem and ask her how she would solve it. You
    may ask the candidate to walk you through her plan for acclimating herself to
    your culture and company upon hire. You might show her a flowchart of your current
    process and ask her to make suggestions for improvement. The point is that you
    want to see how a candidate thinks, not simply have her regurgitate her past.


    In the interview process, use panels of interviewers to identify the most qualified
    candidates. Here is another case where too much of a good thing can be bad. For
    example, Google has its Rule of Four, in which they have successfully modeled
    that four interviews are sufficient to predict a new Googler’s success with 86
    percent confidence.^([7](#c05.xhtml#c05-note-0007)) Any more is overkill. Any
    less, insufficient.


    No matter your company’s ideal number, make sure at least one interviewer on your
    panel is a diverse leader. Men and women answer questions differently. Having
    both on your interview panel will account for these differences.


    Taking another lesson from Google, they also have an interesting interview question
    for which they grade men and women differently. It’s this: “On a scale of 1 to
    5, rate yourself as a software engineer.”'
