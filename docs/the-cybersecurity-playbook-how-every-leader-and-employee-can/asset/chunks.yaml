    5. One of my favorite presentation books of all time is *Presenting to Win: The
    Art of Telling Your Story* by Jerry Weissman. If you don’t have time or budget
    for professional coaching, the book is an invaluable resource in providing tricks
    of the for telling an effective story.

    6. David F. Larcker and Brian Tayan, Corporate Governance Initiative, “Strategy
    & Risk,” Stanford Corporate Governance Initiative, [https://www.gsb.stanford.edu/sites/gsb/files/publication-pdf/cgri-quick-guide-06-strategy-risk-oversight.pdf](https://www.gsb.stanford.edu/sites/gsb/files/publication-pdf/cgri-quick-guide-06-strategy-risk-oversight.pdf)

    7. Ibid.

    8. IDG Enterprise, “2014 Consumerization of IT in the Enterprise,” [https://www.scribd.com/presentation/21294214/IDGE-CITE-2014](https://www.scribd.com/presentation/21294214/IDGE-CITE-2014)

    9. Patrick Thibodeau, “A Third of Virtual Servers Are Zombies,” *Computerworld*,
    May 12, 2017, [https://www.computerworld.com/article/3196355/a-third-of-virtual-servers-are-zombies.html](https://www.computerworld.com/article/3196355/a-third-of-virtual-servers-are-zombies.html)

    10. Jody R. Westby, “Governance of Cybersecurity: 2015 Report,” Georgia Tech Security
    Center, October 2, 2015, [https://globalcyberrisk.com/wp-content/uploads/2012/08/GTISC-GOVERNANCE-RPT-2015.pdf](https://globalcyberrisk.com/wp-content/uploads/2012/08/GTISC-GOVERNANCE-RPT-2015.pdf)

    11. Bob Bragdon, “Maybe It Really Does Matter Who the CISO Reports To,” *CSO*,
    June 20, 2014, [https://www.csoonline.com/article/2365827/maybe-it-really-does-matter-who-the-ciso-reports-to.html](https://www.csoonline.com/article/2365827/maybe-it-really-does-matter-who-the-ciso-reports-to.html)

    12. Rishi Bhargava, “False Positives Have Real Consequences,” *LightReading SecurityNow*,
    June 22, 2017, [https://www.securitynow.com/author.asp?section_id=613&doc_id=733939](https://www.securitynow.com/author.asp?section_id=613&doc_id=733939)

    13. G. Proulx, J. C. Latour, and J. W. MacLaurin, “Housing Evacuation of Mixed
    Abilities Occupants,” IRC-IR-661, Internal Report, Institute for Research in Construction,
    National Research Council of Canada, 1994.


    # CHAPTER 9 Experiencing a Culture of Security


    > I think that my office is too soft with cybersecurity. If someone really wanted
    to, I think they could obtain sensitive information easily by tricking unaware
    employees or through unprotected company networks.

    > Respondent, McAfee Online Ethnographic Study


    As I begin writing this chapter, I do so from the most unnatural of places that
    has become strangely familiar to me—roughly 35,000 feet above the earth’s surface
    in a tube weighing more than 50 tons and traveling nearly 450 miles per hour.
    I’m en route from Tampa to Dallas after a long weekend of visiting family. Travel
    for me has become ordinary. I’m not one to consider myself a road warrior by most
    definitions of the phrase, but I still easily log more than 100,000 miles in a
    year—worthy enough to earn elite traveler status from my preferred airline to
    make the routine a bit more bearable.


    Even though I’m struck by just how mundane travel has become in my life, I still
    consider myself a bit of a nervous traveler. For instance, leading up to a trip,
    I fixate on what I’ll pack for the visit (whatever it is and for however long
    the trip, it must fit in an airline-approved carry-on suitcase, since checking
    baggage is simply out of the question). On the day of travel, I check for my identification,
    wallet, and cell phone several times before I leave for the airport. (I have a
    healthy dose of anxiety that I’ll arrive at the security checkpoint only to find
    I’ve left one of these essentials behind.) I give myself plenty of time to make
    it to the airport since sprinting through a terminal, breathlessly dragging myself
    and my carry-on luggage through crowds of fellow passengers to make my flight
    *just in time* is simply not my idea of a *good time.* Then, when I do get to
    my gate, I wonder if the flight will be on schedule given I’m usually rushing
    to a meeting as soon as I’m supposed to arrive.


    These thoughts are like a perennial playlist of worrisome possibilities I set
    to repeat in my brain every time I travel. But notice what track isn’t on the
    list. For all my fretting, there’s one concern conspicuous by its absence. That
    is, I don’t worry about my safety. I don’t actively think about whether getting
    in a 50-plus ton tube hurling itself roughly seven miles above the earth is a
    good idea. I assume that it is. And I join the ranks of four billion passengers
    worldwide who do the same each year.

