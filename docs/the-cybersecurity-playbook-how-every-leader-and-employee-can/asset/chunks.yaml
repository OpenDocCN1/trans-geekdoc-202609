  trans: '

    然而，这种投入并不能取代员工做正确的事并把事情做好。


    ## 最好的防御


    数千年来的军事历史记录了最好的防御是良好的进攻。这解释了为什么乔治·华盛顿在领导一个初生的国家在独立战争中取得胜利近二十五年后，即使在退休后，在他的著作中包含了这条经过时间考验的军事建议。在与对手竞争时，这是一条可靠的指导：先发制人，你的对手在防御自己上花的精力将比攻击你更多。在体育运动中，球队争争在比赛中先得分，以赢得初始势头。在商业领域，公司寻求通过发布新产品或服务获得先发者优势，以占领早期市场份额。


    在网络安全领域，公司并没有所谓的“良好的进攻”。这是因为从定义上来说，公司并不是首先出手的人。那是对手的工作。对手`always`拥有先发者优势。他们应用了那些对声誉良好的类别非常有效的公理。我们的公司注定要永远处于防御。在网络安全领域，最好的防御是良好的（即使不是卓越的）`defense.`。


    我之前提到过，我认为大多数员工都想帮助保护自己的组织。他们只是不知道如何有效地发挥自己的作用。


    但假设我是错的吧。让我们假设一下，你对公司没有任何利他主义动机。这并不是说你希望公司遭受损害。例如，你不会故意把你的雇主推到推车下。但也许你也是那种不会为了公司而挡在移动车辆面前的人。


    那将让你属于冷漠的旁观者一类。你认为你的公司在网络安全上花了足够的钱。他们雇了人来做防御工作。如果你渴望从事这类工作，你本会去寻求相关的学位和工作。但你没有。你在公司的另一个领域工作，你认为网络安全工作由（且应该由）其他地方来处理。如果你的公司确实遭受了泄露，假设你最终不是被发现负责此事的人，那么这真的不是你的问题。他们会支付罚款，可能会失去一些客户。但生活和工作仍会继续。


    如果你发现自己属于这一类，你并不孤单。事实上，在麦菲（McAfee）对你这样的员工进行的在线民族志研究中，当我们提出以下问题时，我们听到了类似的想法：


    *   一线员工在维护贵组织网络安全中起着什么角色？你认为你起的是关键作用还是背景作用？

    *   受访者 1：`我认为我在公司的网络安全中起的作用非常微小。我认为意识到我如何能帮助保护公司信息很重要，但整体的高层安全工作应该由公司里更高级别的员工来处理。`

    *   受访者 2：`更多是背景角色，因为我们的 IT 部门处理所有的幕后网络安全。`

    *   受访者 3：`我认为我起的是背景作用。第一道线是我们 IT 团队的技术，然后是我们的 IT 团队本身，最后是普通员工。`


    似乎至少有一些员工认为，网络安全留给 IT 内部的工具或团队，或者上报给公司的高层管理人员为好。这两种观点都存在问题。


    首先，没有足够的网络安全人员来应对这个问题（回到我在上一章中提到的网络安全人才短缺问题）。网络安全需要全员总投入。


    其次，如果你认为你公司的高权人物最适合解决这个问题，请不要那么确定。是的，CEO 和董事会有责任从上而下定下涵盖网络安全的基调。但 60% 的 C 级领导和
    IT 执行人员表示，直接负责信息安全的人并不是董事成员.^(3)


    可以理解为什么网络安全推诿的心态在组织中是如此普遍。网络安全行业创造了一个被称为“泄露疲劳”（breach fatigue）的状态。当我们允许环境中泄露的噪音模糊我们响应的紧迫感时，就会发生。我们要么相信最终会代我们付出代价（尽管消费者最终通过更高的价格承担了泄露的后果），要么由于假设我们个人对防止泄露无法做任何事情，从而放弃了我们对自己命运的真正控制权。


    这本书试图通过提供你就可以采取的实际步骤来帮助公司防止泄露，从而解决后一种观点。这是关于给你`什么`可以`做`。但如果你发现自己属于前一营，请让我花点时间告诉你为什么你应该`care`。


    几周前，我收到一封来自我们人力资源部门某人的邮件。她转发了一封发到她个人邮箱的邮件。邮件看起来是来自我的。邮件要求她回复如何更改我自动工资存款账户的指令。发送者的邮件地址来自一个个人邮箱，推测是我的。


    幸运的是，她的直觉起作用了，她将邮件转发到了我的工作邮箱，并提了一个简单的问题：


    *   Allison，我今天收到了这封邮件。你能确认是你发送的吗？


    我没花多久就回答了一个坚定的否定。我们向安全运营中心（SOC）报告了该事件。他们追踪了那封邮件，发现一名黑客入侵了她的个人邮箱。


    我确定，如果我去查阅那个 HR 员工的职位描述，那里不会提到“网络安全”是一项要求或预期。我打赌，那里不会包含要求她对针对员工身份的网络威胁保持警惕作为核心职责的语言。直接联系我以确认她收到的邮件是否合法，这并不在这个个人的“职位描述”范围内。然而，这正是她所做的，我因为她的明智判断和关注而受益匪浅。她的培训阻止了从我们内网网站上复制并粘贴关于如何轻松更改直接存款的指令进行回复。我惊叹自己的运气，幸好她的直觉让那个黑客的工作变得困难得多。而且她挽救了我试图扭转糟糕结果时可能经历的沮丧时间。对我来说，危机化解。


    '
- fmt: '

    If that’s still an insufficient argument to convince you to care, how about this:
    the stakes of a data breach for your company have never been higher. That’s thanks
    to regulators that are piling on to help motivate companies to protect customer
    data. The General Data Protection Regulation (`GDPR`) applies to all companies
    doing business or monitoring the activities of subjects in the European Union
    (`EU`). Companies can lose up to 4 percent of annualized global revenues if found
    to be noncompliant with `GDPR`’s standards for collecting and protecting customer
    data. In 2018, Ponemon reported the average cost of a data breach was $3.86 million—and
    that was largely before `GDPR`’s enactment. Any company with more than $100 million
    in annualized global revenues that does business in the `EU` can already expect
    to pay more—potentially considerably more, depending on its revenues—for a breach
    that violates `GDPR`.


    The risks of a data breach are significant. The costs for a data breach are higher
    still. Don’t assume your company will survive the next breach just because it
    may have done so in the past. Even if it does, the financial pressures may lead
    to other consequences, up to and including layoffs. If you’re inclined to retain
    your existing job and see your company continue as a going concern, you must assume
    cybersecurity as part of your job description. Enemies love abject apathy on your
    part.


    ## W.I.S.D.O.M. for the Employee


    According to Verizon’s 2018 Data Breach Investigations Report (`DBIR`), employees
    are directly or indirectly responsible for over a quarter of all breaches. In
    more than 60 percent of these cases, a careless employee is to blame. That means
    nearly 20 percent of all breaches are at the hands of negligent employees. It’s
    the reason employees remain among the strongest or weakest links in their company’s
    cybersecurity defenses.


    Thankfully, employees can take many steps to be a part of cybersecurity’s solution,
    rather than its problem. First, be alert to social engineering scams. Cybercriminals
    know how to exploit the trust of employees. And their methods are getting better.
    Spear phishing is the tactic of specifically targeting certain individuals or
    companies through a malicious communication, such as an email. As opposed to traditional
    phishing, which is more of a spray-and-pray tactic used by cybercriminals (in
    other words, very little, if any, targeting is in play), spear-phishing campaigns
    are much more effective since the criminal goes to great lengths to personalize
    the message.


    Whaling is one such variety of spear phishing, where the adversary impersonates
    a high-profile executive of the company, such as the `CEO` or `CFO`, and requests
    action from an unsuspecting employee. For instance, a criminal masquerading as
    the `CFO` could target a rank-and-file employee in the finance department and
    request that he transfer company funds to an account.


    Social engineering is one of the adversary’s clearest weapons against naïve employees.
    According to Verizon’s `DBIR`, 4 percent of people will click on any given phishing
    campaign. Perhaps most surprisingly, these victims aren’t prone to learning from
    their mistakes. The more phishing emails someone has clicked, the more likely
    he is to do so again.


    Social engineering is highly effective at multiple levels of the organization.
    Yes, even against executives. In 2018, `Forbes` reported that nearly 80,000 firms
    across the U.S., UK, and Europe sent more than $12 billion to adversaries launching
    a highly targeted, five-year whaling campaign. Who were the employees duped into
    helping the adversaries fleece their companies? The companies’ own `CFOs`. It
    turns out the adversaries had a targeted database of more than 50,000 `CFOs` to
    use as their “marks” in the scam. In this case, the cybercriminals used highly
    personalized emails, seemingly sent by the `CEO`, to compel the `CFO` to immediately
    complete a wire transfer. We all can learn from this expensive lesson. Any one
    of us can be conned.


