    ---

    **最终输出（基于提供的 [content] 块）：**


    [content]


    *   你们正在使用什么技术？（我们将获取这些答案并进行漏洞评估。）

    *   你们的访问管理系统是如何工作的？

    *   哪些第三方工具允许连接到你们平台，以实现攻击后任何必要的内容回滚？

    *   如果账户被接管，你们的升级流程是怎样的？

    *   你们对于响应攻击以及让客户恢复到攻击前内容的服务水平协议（SLA）是什么？


    ## 谁的错？


    当然，社交媒体提供商可以辩称，我们没有做到一些显而易见的事情，比如通过经常审查将管理员人数减至最低、坚持使用独特且强密码等等。但他们那种僵化的政策也没有任何帮助，即使网站遭受了显而见且严重的攻击，也必须在“分析”完成之前保持原状。当然，该机构人员也不应该在多个账户上重复同一个密码。


    但请注意，我将这一章命名为“*我*毁掉复活节的时候”。不，我没有黑入 McAfee 的公司社交页面。我没有故意留门大开让坏分子做同样的事情。在那个复活节周日，我最不希望面对一个由多方面错误导致的喜剧性和巧合共同导致的局面。尽管如此，我只能对它的发生负责。因为归根结底，那个公司社交页面在我团队的监管之下。而我们未能采取合理措施来履行保护它的职责。


    个人责任是一件令人不舒服的事情。我们中很少有人喜欢去思考为了防止不幸事件的发生，我们本可以做得更好或更不一样的地方。推卸是更具人性的反应。然而，正是我们推卸个人责任的倾向，仍然是黑客社区武器库中的一种关键武器。


    长期以来，网络安全一直是“别人”的问题。对于太多人来说，网络安全是一个模糊的话题，不值得他们投入时间，更不用说个人责任了。这本书试图改变这种叙事，即使只是通过谦卑的一步，承认我们作为组织员工——以及最终的防御者——所共同承担责任。如果我们的公司不能信任我们在保护其最神圣的数字资产方面采取合理的预防措施，它还能信任谁呢？


    让我放下我的讲道台来承认真正的问题。并不是员工（通常来说）不*想要*做正确的事。更多的情况是他们根本不知道*如何*去做。


    网络安全是一项团队运动，每个人都需要在比赛的每一分钟都履行好自己的职责。工具可以非常有帮助，但只有当人员、工具、程序、定期审查和其他因素共同作用时，它们才能形成有效的防御。


    ## 记住这个关键要素


    减少网络威胁的另一个关键要素是诚实。在写一本印有我名字的书的开头，描述一个在我监管下发生的、令人尴尬的安全失败，我确实超出了我的舒适区。情况本可能变得糟糕得多吗？肯定的。它本不应该发生吗？肯定的。


    而且，那可能是你而不是我吗？同样，肯定的。


    通过告诉你们这个故事，我想确立一种诚实的基调，这种基调在你们努力击败坏人的业务活动中也是需要的：你们需要培养一种安全文化，让人们不仅能够互相帮助，而且在看到不安全操作时彼此保持诚实。这是没有愤怒、指责或报复的诚实，它对于让文化运作至关重要。


    描述我们社交媒体攻击的第二个原因是，以便你可以吸这些教训，并立即将其应用到你发现自己安全盔甲存在漏洞的地方。


    ## 为什么是我？


    市面上并不缺由声誉良好、有才华且拥有丰富经验的作者编写的网络安全书籍供你阅读。你会发现一些是由记者撰写的，他们剖析了历史上一些最传奇的泄露事件。你会发现另一些是由业内精英撰写的，他们作为行业受尊敬的先驱，以权威的口吻发言。你还会发现更多由技术专家编写的书，他们详细地解读了网络安全复杂的元素。


