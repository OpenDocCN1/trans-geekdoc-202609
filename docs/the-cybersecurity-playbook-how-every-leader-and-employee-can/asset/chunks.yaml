  trans: '


    以下是为什么床虱如此难以根灭的原因。你可以拥有世界上最干净的房子。你可以虔诚不经地消毒你的床单。你可以对睡衣或任何应该接触你睡眠地点的衣服同样这样做。但如果你恰好入住了一间有虫害的酒店或乘坐了飞机，只需要一只讨厌的床虱就能搭你的便车（在这种情况下，是你的行李或内部的物品），并前往你的家中。


    如果你恰好住在公寓楼或其他多户型单元，情况会更糟。现在，只需要那个与你共用墙壁的邻居在卫生标准上比你稍微松懈，你可能就会发现家里出现了不速之客住客（是的，这些坚定的寄生虫可以通过墙体空隙移动，利用水管和电线管道作为它们的路线）。


    如果这还不够糟糕的话，由于床虱带有极大的污名化，大多数人都不愿承认自己与这些吸血鬼共处。等到他们承认存在问题并寻求帮助时，他们可能正面临着全面的虫害。如果你恰好过了一夜（如在酒店）或共用墙壁（如与邻居）——你明白我的意思……。


    床虱是一个不幸的提醒，提醒我们我们彼此之间是多么依赖。这并不是依靠邻居帮助的问题，而是关于信任他们了解自己的环境（在一项研究中，近 50%患床虱的人甚至不知道自己患有它们），并寻求专业帮助来消除它们。


    这是一个多么有趣的网络安全寓喻。公司并非孤立运行的岛，而是在高度复杂、互联的生态系统中运行的。虽然一家公司可能采取良好的网络安全卫生措施，但它必须依靠邻居——任何与它有业务来与其系统有某些联系的第三方——也这样做。否则，它就会让自己暴露在阴险掠食者的面前，利用侧门和后门进行渗透。（顺便说，在这种情况下连接的“系统”并不一定通过广泛的网络连接。回想第
    3 章涵盖的网络安全卫生实践。只需要一个粗心的伙伴留下一个存有公司敏感文件且无人看管未加密的`USB`或`笔记本电脑`，你的公司就会暴露。）


    在我们享受了相对无床虱生活的几十年里，我们被提醒，旧的事物可以重焕发生机。事物越变化，本质越不变。尽管曾经在对抗床虱方面取得了了进步，但我们再次对床虱感到感叹。


    虽然变化是业务中唯一的永恒，但许多`CFOs`仍然可以确信一个确定性：他们管理着公司的采购。由于这在很大程度上仍然属于财务职能，`CFO`与`CISO`之间的亲缘关系将变得更加紧密。


    正如床虱提醒我们，在防范入侵者方面我们彼此之间是多么依赖一样，第三方关系当了额外的暴露点，对手可以利用这些点对我们的公司造成伤害。考虑来自`Ponemon`的几点，它们反映了严峻的现实：


    *   59%的组织确认他们曾由于其第三方之一而遭遇了数据泄露。

    *   只有 29%的人表示，他们将从第三方本身获知此类泄露。

    *   76%的人说涉及供应商的网络安全事件数量正在增加，但只有 46%的人同意管理外包关系风险是首要任务。

    *   57%的人并不知道其组织的供应商保护措施是否足以防止泄露。


    从积极的一来说，这些指标有很大的改进空间。对于许多组织来说，第三方安全管理是一个相对较的领域。正如上面的数字所示，它也是至关重要的。`CFOs`代表他们的组织冲锋陷，确保采购流程充分审查了第三方的网络安全态势。这里是你的`CISO`将帮助你提出正确问题的领域。


    当然，最终的信赖第三方关系是公司将某个功能（或其部分）完全外包的关系。`Deloitte`在 2016 年进行了一项全球研究，审查了外包生命周期和关键趋势。报告中被外包的首要功能是什么？`IT`，高达
    72%的组织外包了该功能的部分，31%的计划增加外包。


    曾经，考虑外包自己的网络安全环境是荒谬的。但看起来网络安全正在追随其 IT 祖先的脚步，因为让第三方保护组织最宝贵的数字资产变得越来越被接受。当然，全球网络安全人才的短缺只是火上添油。公司与其在市场上激烈竞争那些根本不存在的网络安全人才，不如选择雇佣具有此类专业知识的第三方，以至少增强内部的人员能力。


    特别是安全运营中心（`SOC`）最可能被外包的领域包括`渗透测试`（75%的组织外包）、`威胁情报收集和馈`（54%）以及`数字`和`恶意软件取证`（51%）。


    外包网络安全功能的一个或多个领域有几个优点。与大多数外包情况一样，公司可以通过雇佣具有相当网络安全基础设施的第三方来节省资金并最大限度地减少前期资本支出。公司还可以通过与这些托管安全服务提供商（`MSSPs`）谈判服务水平协议来规定技术更新的条款，从而缓解过时的风险。最后，`MSSPs`专注于网络安全。他们可以专注于这一核心竞争力，为客户留出更多时间关注他们自己的竞争力。


    正如书中的大多数主题一样，这个问题也包含了几层灰色地带。虽然外包网络安全计划的一部分对于许多公司来说非常合适（特别是那些人员限制更严苛的公司），但网络安全在某种程度上类似于慈善——它始于内部。将网络安全态势的完全责任交给第三方确实是一项风险巨大的业务。


