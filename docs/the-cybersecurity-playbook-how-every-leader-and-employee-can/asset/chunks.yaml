    team immediately`. According to Verizon’s report, companies have 16 minutes until
    someone takes the bait with the first click to a phishing campaign. When does
    the first report come in to the security team? After 28 minutes. During those
    mere 12 minutes, time is on the side of the adversary, and in their hands, time
    becomes yet another weapon through which they can inflict significant harm.


