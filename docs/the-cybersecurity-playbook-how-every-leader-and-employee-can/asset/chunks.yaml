    ## 第 7 章：有趣的伙伴


    > *当你进一步向外延伸——我们的二级和三级关系——你显然会有更大的脆弱性。我们有一套非常稳健的第三方服务政策和网络来进行监控和维护。事实上，这是我亲自负责的领域之一。我们有一个整个部门专门负责此。我们有调查卷。我们有不同的第三方会对我们一些关键第三方服务提供商进行审计和检查，以确保他们维持了适当的安全水平。我们要求每年对其数据安全进行特定的第三方审计。*


    > 金融服务公司 CFO


    如果你是一家企业的 CFO，你可能和大多数黑客有许多共同点：你有健康的利润动机。许多对手也会同意你可能持有的哲学：现金为王。


    Jonathan Lusthaus 从未设想过要从事研究网络分子的职业。他的热情在于研究宗教暴力。但当他的论文主题不符合牛学院的研究领域时，他需要寻找一个新的兴趣点。


