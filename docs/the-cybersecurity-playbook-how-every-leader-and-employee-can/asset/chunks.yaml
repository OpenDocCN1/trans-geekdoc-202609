    All of these actions would have vastly reduced the chances of the hack occurring.
    But let’s say for some crazy reason a hacker with enough motivation, skill, and
    luck was able to get into our social media account. Let’s look at what could have
    helped us after a hack was discovered, had we put certain things into place beforehand.


    We should have had a ***procedure where we lock out all admins without letting
    on that we are aware of the attack*.** By our deleting the nonsense posts, we
    alerted the hacker. Then when the hacker saw we were deleting permissions, he
    acted more quickly than we did.


    It was fortunate that Gavin was on the defaced page on Easter Sunday. Otherwise
    we may not have known as quickly about the defacement. Now we have a tool that
    uses machine learning to detect unusual images, profanity, slurs, and other anomalous
    material on social media sites. It *immediately alerts* several members of our
    team in the event it detects such unusual activity.


    *Note:* I’m not going to name the tools we use for two reasons: First, tools come
    and go, and they also tend to have different effectiveness at different times.
    In other words, when a tool is first launched, it may be highly effective—until
    hackers figure a way around it. Because I don’t know when you’re reading this
    book, I don’t want to praise something that I may no longer be using when you’re
    actually reading these words.


    The second reason for not mentioning the tool is McAfee already is a huge bullseye
    for hackers around the world. By keeping them guessing what exact tools we use,
    we help to lessen that threat. If you search for some of the descriptions I use
    for tools, you’ll quickly find current ones you can try.


    Back to the story of lessons we learned:


    At the time we alerted the social media company of the hack, we did not know their
    procedures for dealing with it. Mistake. We found out only then that their policy
    was to freeze the account for many hours, regardless of how defaced our page was.
    ***We now ask about these procedures in advance*** of creating corporate pages
    on other sites.


    We learned the hard way that money talks. Because we were spending a decent amount
    of money on advertising on this social media site via agencies, we looked like
    a smaller account to the company than we were; that might have affected response
    levels. Today, ***we spend directly with social media platforms*** to accurately
    reflect our investment and receive the commensurate service levels we deserve.


    And, we learned that ***third-party companies with which we do business may not
    have strong security*** practices. This is especially important to remember for
    companies that have access to your systems or appear as an extension of your organization.
    In particular, smaller third-party companies with which you have a relationship
    may not have formal IT and security teams, let alone practice rigorous cybersecurity
    hygiene.


    Finally, the postmortem of that Easter’s unfortunate events delivered one final
    punch in the gut. McAfee wasn’t even a deliberate target in the hack. The hacker
    didn’t realize Julie was an administrator for McAfee when he broke her credentials.
    He didn’t know (or care) who Julie was. He was on the hunt for passwords. His
    reward would come only after he determined what the password unlocked—be it a
    personal banking account, a company’s network, or something else. Once he found
    one that just so happened to unlock the keys to McAfee’s company page on that
    social network, he unleashed his rants of abuse on it, offending everyone he could
    and humiliating us in the process. *Even for hackers, sometimes it’s better to
    be lucky than good.*


    ## Additional Lessons for You


    **Have lists of people you can call and people to whom you can escalate.** Have
    them where you and your team can access them anytime. Also, the lists must not
    only be for people on your team but also for people at the vendors for your website,
    social media, cloud storage, etc.


    **It needs to be in someone’s job description to regularly review who has access**
    to an account and clean up the list to remove people who no longer work on those
    projects.


    **Use multifactor authentication.** For some systems we can automatically detect
    if one of our users has it turned on, and the system will tell us if a user turns
    it off, even for a few minutes as she switches to a new computer, for example.
    With systems over which we have less direct control, like a cloud-based service,
    we require that users send us screenshots of the multifactor authentication being
    enabled.


    You can imagine that we scrutinize social media outlets now before we put a page
    up. In addition to the measures I described above, we ask the following:


    *   How do you handle any personally identifiable information?'
