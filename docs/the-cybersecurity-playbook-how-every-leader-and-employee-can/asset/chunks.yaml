- fmt: '

    Quite by accident, he became inspired by a well-known author on cybercrime who
    was lecturing on the topic at Oxford just as Lusthaus’s deadline for choosing
    a new subject loomed. Almost 250 interviews with law enforcement agents, security
    professionals, and former cybercriminals later, Lusthaus is an authority on the
    topic. In his book `Industry of Anonymity: Inside the Business of Cybercrime,`
    he exposes the real underbelly of this $600 billion industry^([1](#c07.xhtml#c7-note-0001))
    to the rest of us.


    He found that the underground market shares quite a lot in common with the financial
    markets that underpin healthy—and legitimate—business and industry. Lusthaus points
    to specialization among cybercriminals. There are very few jacks-of-all-trade
    in cybercrime. Instead, as Lusthaus uncovered, there are more economic benefits
    to investing in a “trade” and relying on others to perform specialized functions.
    Some are more technical, so they design the online scourge. Others are natural
    at selling, so they take to the underground commerce markets to promote the value
    proposition. Still others are strong at implementation. They provide the post-sales
    support to buyers who need help in getting the weapon to its intended target(s).


    The division of labor that propels the world’s most sophisticated companies serves
    the needs of the Dark Web as well. How do cybercriminals with such specializations
    trust one another to make good on payment when services are rendered? In much
    the same way online shoppers have learned to trust legitimate online companies
    seeking their business. They rely on numerical rating scales of other cybercriminals
    evaluating their experience. They use feedback forums to exchange information
    about the ne’er-do-wells among them (apparently, there really *is* honor among
    thieves).


    These feedback mechanisms scale the business of cybercrime. Each criminal can
    spend less time validating the expertise and trustworthiness of potential partners
    in the chain and more time executing on his craft to commit crime.


    Beyond mimicking the services of online exchanges, the cybercrime market imitates
    rules of legitimate governance as well. Lusthaus found cybercriminals using escrow
    to entrust a third party with holding payment, if not goods, until everything
    had been verified. There’s even arbitration, where each side can argue its dispute
    in front of a senior member of the community, appointed to make a ruling. In certain
    cases, the “judge” may ban the offending party from the marketplace.


    McAfee has done our own research^([2](#c07.xhtml#c7-note-0002)) on the vast cybercrime
    market that lurks beneath the surface of the web. Thanks to law enforcement takedowns
    of some prominent Dark Web marketplaces, cybercriminals are exercising their entrepreneurial
    chops. Several individual sellers are trading established marketplaces (which
    tend to be targets for law enforcement officials) for their own websites to peddle
    their goods and/or services on the Dark Web. Defiant website designers are accomplices
    in the pursuit, designing hidden marketplaces for aspiring vendors. Yes, even
    the Dark Web has layers that allow its participants to fly lower still beneath
    the radar.


    Regardless of a bad actor’s intent to open her own click-and-mortar equivalent,
    there are plenty of helpful underground forums dedicated to the topic of cybercrime
    to help these criminals hone their craft. The more popular discussions entail
    leaked user credentials, common vulnerabilities and exposures, and “dump sites”
    to offer plenty of stolen credit cards, fresh for the taking.


    *This* is the face of cybercrime. This complex labyrinth of entangled services,
    buyers, sellers and “regulators” is what your company is up against. And your
    company has the deck stacked against it. This isn’t a fair match-up. There are
    no Sarbanes-Oxley (SOX) requirements on the Dark Web. No GDPR governing privacy
    and the use of data. No compliance standards dictated by hosts of governing bodies.
    Hackers can code at 2:00 a.m. and exploit their victims by 4:00 a.m. There’s also
    no need for onerous testing windows to ensure that quality controls are met.


    Unlike your competitors, which are governed by the same rules, regulations, and
    general business ideals as your company, adversaries respect no laws (except those
    of their established communities). Unlike competitors seeking to take market share,
    bad actors want to take you for everything they can.


    You may be very familiar with the fact that you’re dealing with a highly coordinated
    enemy. But consider how Finance typically doles out budgets to organizations to
    understand the rub for cybersecurity. Budgets might be allocated based on benchmarking
    data. While you can find such benchmarks for cybersecurity spend, they’re a bit
    misleading. That’s because the *real* benchmarks for cybersecurity must come from
    adversaries. If you don’t know what adversaries are spending in research and development
    to create their “products,” how can you accurately assess the cybersecurity budget
    required to match it?


    If not benchmarking data, budgets are allocated by return on investment (ROI).
    Again, that’s a tricky measure for cybersecurity professionals to prove. Because
    how can CISOs prove a negative? Even if they tried, wouldn’t smart CFOs challenge
    the argument at face value? Imagine a conversation between a CFO and CISO that
    goes something like this:


    **CFO**: Why do we need to buy this new security widget?


    **CISO**: Because we’re seeing a record number of attacks against the company
    in this area.


    **CFO**: But what’s the return on investment for that spend?


    **CISO**: Well, there’s a possibility we could be breached if we don’t do something.


    **CFO**: So you’re telling me that you can guarantee me we won’t have a breach
    if we buy this technology?


    **CISO**: Not exactly. It’s a bit more complicated than that.


    **CFO**: Let’s uncomplicate it. What’s the return on investment?


    You can see how the circular argument could go on for a while. Short of attempting
    to shock and awe finance people with convoluted cybersecurity metrics, there’s
    no clever way for a CISO to answer the “What’s your ROI?” question.


    It’s not that CISOs are evading the question—or that they don’t comprehend the
    concept of ROI. To understand why this is such an impossible question to answer,
    let’s look at a few adversarial attacks that put a finer point on it.


    The More Things Change . . .


    In May of 2017, cybersecurity made its way to the front page of practically every
    media website and the first segment of virtually every news broadcast worldwide.
    Those who didn’t know about before would learn it by one name, WannaCry. Unprecedented
    in scale and velocity, the attack infected more than 200,000 computers worldwide
    within its first few days—shutting down hospitals, universities, and banks.^([3](#c07.xhtml#c7-note-0003))
    WannaCry held each victim’s computer files for ransom to the tune of up to $300
    in bitcoin. The estimated damage of WannaCry’s wrath? Well into the billions of
    dollars globally.


    But it would be unfair to call WannaCry ransomware. Sure, ransomware was the visible
    exploit to victims threatened with unrecoverable file loss. But what made WannaCry
    so stealthy is the way in which it propagated, using the properties of a worm
    to contaminate new systems. Without taking a technical detour into the weeds here,
    the key difference between “traditional” ransomware and WannaCry is that the latter
    didn’t require human intervention to spread. That’s how it proliferated so quickly.

    '
