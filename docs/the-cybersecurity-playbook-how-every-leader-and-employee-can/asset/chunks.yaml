    Look for the telltale signs of a malicious email such as the sender’s email address.
    Don’t click on a link from an unknown source. Instead, search for the company
    or go to the domain directly. But beware. Pharming sites are also popular, where
    cybercriminals stand up malicious websites to lure victims, then harvest their
    bounty be it financial or other personally identifiable information. Even by typing
    the domain directly, you may still land on a site with malicious intent and/or
    content.


