    我给你们讲这个故事不仅仅是因为它有趣，也不仅仅是为了让你觉得“嘿，有她比我好！”我从这个故事开始，是因为它是我们书中其余部分将要讨论的内容的缩影。


    为了让你买这本书物有所值——在第一章中——我现在将详细解析黑客攻击是如何发生的，以及我们之后做了什么。最重要的是，我将列出你可以在*明天早上*在工作时采取的步骤，以确保这种事情不会发生在你身上。


    ## 惨痛换来的教训


    当我们夺回账户的控制权时，我们要求社交媒体公司告诉我们，仪表板中哪个管理员账户负责了这些更改。


    结果发现是我们一家媒体投放代理机构的一名员工，她已经不再为我们工作了——我们称她为 Julie。她的凭据被一个与大型网络犯罪团伙有关的青少年盗了。Julie
    犯了许多人都会犯的错误：她没有养成良好的密码习惯。她使用同一个密码访问多个账户，包括她在该社交媒体平台上的个人资料。而且，由于她是该网站上 McAfee 公司页面的授权管理员，她的个人凭据不仅让她能够访问自己的个人资料，还能访问我们的页面。当她的一个账户被攻破且凭据在黑网上交易时，黑客只是简单地用该密码尝试了她的其他在线账户。这时，他们成功破解了
    Julie 在该社交媒体平台上 McAfee 公司页面的管理员权限。剩下的操作就是易菜一掌了。


    事后诸葛亮明，这个案例也不例外。漏洞一：`Julie 在访问其社交媒体账户（以及我们在同一社交媒体平台上的公司页面，作为我们之一的授权管理员）时，使用了与其他账户相同的密码`。如果她使用了唯一的密码，那么那些坏人在黑网上买到的凭据将变得一文不值。更糟糕的是？当收到个人账户被黑的告警时，Julie
    迅速更改了密码。但她未能在其其他账户（包括故事中的那个账户）上更改密码。这是她的责任。


    漏洞二：`我们本应该要求该社交媒体网站上的所有管理员使用多因素身份验证`。这意味着你获得系统访问权限不仅需要正确的密码，还必须能够输入生成并发送（例如发送到）你手机上的一次性代码。如果你在被要求后的几秒钟或几分钟内没有提供代码，你就无法进入。这种类型的身份验证有几个版本，我在这里做了简化处理，但你明白意思即可。这是我们的责任。


    漏洞三：`我们没有足够频繁地审查来查看谁不再需要访问我们的账户`。Julie 一些时候曾帮过我们，但在她的活动结束后，我们本应该将她从管理员列表中移除。在她与我们积极合作期间，我们仍然可能被攻击，但我们对访问管理的缺乏让情况变得更糟。这绝对是我们的责任。


    所有这些行动都会大大降低黑客发生的概率。但假设由于某种疯狂的原因，一个拥有足够动力、技能和运气的黑客进入了我们的社交媒体账户。让我们看看，如果我们事先采取了某些措施，在发现被黑后哪些做法可以帮到我们。


    我们应该有一套`程序，在不泄露我们已察觉攻击的情况下锁定所有管理员`。通过删除那些无意义的帖子，我们提醒了黑客。然后当黑客看到我们正在删除权限时，他的行动比我们还要快。


    幸运的是 Gavin 在复活节周日看到了被篡改的页面。否则，我们可能不会那么快发现篡改。现在我们拥有一种工具，利用机器学习来检测社交媒体网站上的异常图像、脏话、侮视性和其他异常材料。一旦检测到此类异常活动，它会*立即提醒*我们团队的几位成员。


    *注：*我不会点出我们使用的工具，有两个原因：第一，工具更新换快，而且在不同时间的有效性往往也不同。换句话说，当一个工具刚发布时，它可能非常有效——直到黑客找到绕过它的办法。因为我不知道你什么时候读这本书，我不想赞美一个在你阅读这些文字时我可能不再使用的东西。


    不提及该工具的第二个原因是，McA 已经是全球黑客的巨大目标了。通过让他们猜测我们具体使用哪些工具，我们有助于减轻这种威胁。如果你搜索我用来描述工具的某些词汇，你很快就能找到可以尝试的现有工具。


    回到关于我们学到的教训的故事：


    在我们向社交媒体公司报告黑客攻击时，我们并不知道他们处理此类问题的流程。这是一个错误。我们直到那时发现他们的政策是冻结账户数小时，无论我们的页面被篡改成了什么程度。`我们现在会在其他网站创建公司页面之前提前询问这些流程`。


    我们通过惨痛的经历学到了金钱是说话的。因为我们通过代理机构在该社交媒体网站上花费了大量的广告费，在公司看来，我们的账户比实际的小；这可能影响了响应水平。今天，`我们直接向社交媒体平台付费`，以准确反映我们的投资，并获得我们应有的相应服务水平。


    而且，我们了解到`与我们开展业务的第三方公司可能没有强大的安全实践`。对于那些拥有你系统权限或作为你组织延伸的公司来说，记住这一点尤为重要。特别是与你有关系的较小的第三方公司，可能没有正式的
    IT 和安全团队，更不用说遵循严格的网络安全卫生了。


    最后，对那个复活节不幸事件的事后分析给了我们最后一击。在这次攻击中，McAfee 甚至不是一个被刻意的目标。黑客在破解 Julie 的凭据时并没有意识到 Julie
    是 McAfee 的管理员。他不知道（或不在乎）Julie 是谁。他只是在寻找密码。只有在他确定了密码解锁的是什么——无论是个人银行账户、公司网络还是其他什么——之后，才能获得回报。一旦他发现恰好可以解锁该社交网络上
    McAfee 公司页面的密钥，他就在那里发泄他的愤怒和谩辱，得罪了每一个能得罪的人，并在过程中羞辱了我们。*即使对于黑客来说，有时运气比能力更好。*


    ## 给你们的额外教训


    **准备好你可以拨打的以及可以向上汇报的人员名单**。让你和团队可以随时访问这些列表。此外，列表不仅必须包含你团队的人员，还必须包括你的网站、社交媒体、云存储等供应商的人员。


    **在某人的工作描述中，必须包含定期审查谁拥有账户的访问权限**，并清理列表以移除不再负责这些项目的人。


    **使用多因素身份验证**。对于某些系统，我们可以自动检测我们的某个用户是否开启了该功能，如果用户关闭了它（例如切换到新电脑时的几分钟），系统会告诉我们。对于我们较少有直接控制的系统（例如云服务），我们要求用户发送开启多因素身份验证的截图。


    你可以想象，现在我们在建立页面之前，会对社交媒体平台进行审查。除了我上面提到的措施之外，我们还会问：


    * 你们如何处理任何个人身份信息？

