  trans: '

    纯属偶然，他受到一位著名网络犯罪作者的启发，当时正值 Lusthaus 选择新主题的截止日期临近，这位作者正在牛津大学就该主题进行演讲。在对执法人员、安全专业人士和前网络犯罪分子进行了近
    250 次采访后，Lusthaus 成为了该领域的专家。在著作`Industry of Anonymity: Inside the Business of
    Cybercrime,` 中，他向我们揭露了这一价值 6000 亿美元行业^(1)的真实暗面。


    他发现地下市场与支撑健康且合法业务工业的金融市场有许多共同点。Lusthaus 指出网络犯罪分子之间存在分化。在网络犯罪领域，几乎没有“全才型”。相反，正如
    Lusthaus 所揭示的那样，投资于某项“技能”并依赖他人执行专门职能具有更大的经济效益。有些人更擅长技术，因此他们设计网络祸源；另一些人天生擅长销售，因此他们进入地下商业市场推广价值主张；还有人擅长执行，他们为需要帮助将武器送达预期目标的买家提供售后支持。


    推动世界上顶尖公司的分工机制也同样适用于暗网的需求。具有此类专业分工的网络犯罪分子如何在提供服务后相互信任并确保按时付款呢？这就像在线购物者学会了信任那些寻求其业务的合规在线公司一样。他们依靠其他网络犯罪分子对自身体验的数字评分量表。他们使用反馈论坛来交换关于他们中坏蛋的信息（显然，盗贼之间确实*有*道义）。


    这些反馈机制扩大了网络犯罪业务的规模。每个犯罪分子都可以花更少的时间验证链中潜在伙伴的专业知识和可靠性，花更多的时间执行自己的技艺来犯罪。


    除了模仿在线交易所的服务，网络犯罪市场还模仿了合规治理规则。Lusthaus 发现网络犯罪分子使用托管服务，委托第三方持有资金（如果不是货物），直到所有内容通过验证。甚至还有仲裁机制，双方都可以在负责裁决的社区资深成员面前辩论争议。在某些情况下，“法官”可能会将违规者排除出市场。


    对于潜伏在网络表面下的巨大网络犯罪市场，麦菲（McAfee）已经进行了了自己的研究^(2)。由于执法部门对一些知名暗网市场的取缔，网络犯罪分子正在发挥他们的创业天赋。几位个人卖家正将成熟的市场（这些市场往往是执法人员的目标）转变为自己的网站，以便在暗网上兜售他们的商品和/或服务。反叛网站的设计师是这一追求的帮凶，他们为有志的供应商设计隐藏的市场。是的，即使暗网也有层级，允许其参与者以更低的飞行姿态避开雷达。


    无论坏分子是否有意图建立自己的“点击即实体”等效场所，都有许多专注于网络犯罪主题的帮助性地下论坛，可以帮助这些犯罪分子精进他们的技艺。更热门的讨论涉及泄露的用户凭据、常见的漏洞和暴露，以及提供大量可供取的被盗信用卡卡的“倾销站（dump
    sites）”。


    *这*就是网络犯罪的真面目。这个由服务、买家、卖家和“监管者”交叉而成的复杂迷宫，正是贵公司所面临的对手。而且贵公司还处于劣势。这不是一场公平的对决。暗网上没有萨班斯-奥克斯莱（SOX）要求。没有监管隐私和数据使用的
    GDPR。没有由众多治理机构规定的合规标准。黑客可以在凌晨 2:00 写代码，并在凌晨 4:00 攻击他们的受害者。不需要苛刻的测试窗口来确保符合质量控制。


    与贵公司受相同规则、法规和通用业务理想约束的竞争对手不同，对手遵守遵守法律（他们建立社区的法律）。与寻求获取市场份额的竞争对手不同，坏分子想要夺取你身上的一切。


    你可能非常熟悉正在面对一个高度协调的敌人这一事实。但请考虑财务部门通常如何向组织分配预算，以理解网络安全的症结。预算可能是根据基准数据分配的。虽然你可以找到网络安全支出的基准，但它们带有误导性。因为网络安全的*真实*基准必须来自对手。如果你不知道对手在研发创建他们的“产品”方面花费了多少资金，又如何能准确评估与之匹配的网络安全预算？


    如果不是基准数据，预算就是根据投资回报率（ROI）分配的。再次，这对网络安全专业人士来说是一个难以证明的衡量标准。因为首席信息安全官（CISO）如何证明一个负面结果？即使他们尝试这样做，聪明的首席财务官（CFO）难道不会从字面上质疑这一论点吗？想象
    CFO 和 CISO 之间的对话是这样的：


    **CFO**: 我们为什么需要买这个新的安全小组件？


    **CISO**: 因为我们看到该领域针对公司的攻击次数创历史新高。


    **CFO**: 但这笔支出的投资回报率是多少？


    **CISO**: 嗯，如果我们不采取行动，我们有被攻破的可能。


    **CFO**: 所以你是在告诉我，你能够保证如果我们购买了这项技术，就不会发生泄露吗？


    **CISO**: 不完全是。情况比这复杂一些。


    **CFO**: 让我们简单化。投资回报率是多少？


    你可以看到这种圆圈论证可以持续多长时间。除了尝试用复杂的网络安全指标让财务人员感到震惊和威慑之外，CISO 没有什么聪明的办法来回答“你的 ROI 是多少？”这个问题。


    并不是 CISO 在逃避问题——或者说他们不理解 ROI 的概念。为了理解为什么这是一个如此无法回答的问题，让我们来看几个更能具体说明问题的敌对攻击。


    世事变迁…………


    2017 年 5 月，网络安全进入了几乎每个媒体网站的首页以及全球几乎每个新闻广播的第一段节目。那些之前不知道的人将通过一个名字了解到它，勒索病毒（WannaCry）。这次攻击在规模和速度上都是前所未有的，在发生后的头几天内就感染了全球超过
    20 万台计算机——关闭了医院、大学和银行。^(3)勒索病毒扣留每个受害者的计算机文件作为索金，金额高达 300 美元的比特币。估计勒索病毒暴怒造成的损失是多少？全球范围内高达数十亿美元。


