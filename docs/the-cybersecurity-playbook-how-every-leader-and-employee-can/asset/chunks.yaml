    the popular cloud services employees are using. And they allow CISOs to support
    their companies’ transformation agendas while ensuring security remains at their
    center.


    Now, about impacting your adversary’s value negatively. I said earlier that there’s
    no such thing as playing offense in cybersecurity. That’s true. Defenders, by
    their very definition, don’t strike first. But they can still confuse their enemies.


    The art of deception in war goes all the way back to Sun Tzu. In cybersecurity,
    carefully disguised decoys that appear to be treasure troves planted in your infrastructure
    do a few things. First, they give you additional data points through which to
    track your enemy’s patterns. Second, they distract your enemy from the real treasure
    you are interested in protecting. Finally, they waste your enemy’s time and resources
    on wild goose chases. This last point is really about as close to playing offense
    as cybersecurity teams can get.


    **Use artificial intelligence (AI) capabilities to identify the most advanced
    threats and address the talent shortage**—**but know its limitations.** AI is
    the latest buzzword technology in cybersecurity. To be sure, it promises to help
    cyber defenders find the most sophisticated threats in their environment quickly,
    pairing the scale of machines with the problem-solving capabilities of humans.
    But beware of cybersecurity marketers disguised in sheep’s clothing. While AI
    promises to help strapped CISOs do more with less, it comes at a cost—false positives.
    Given AI uses sophisticated analytics to determine the likelihood of a threat,
    it renders a probability, not certainty, that one in fact exists. That means AI
    will be wrong at least some of the time.


    On the flip side, those tried-and-true signature-based detection models I mentioned
    in Chapter 2 can also be wrong. A zero-day threat that has not yet been identified
    has no signature in a threat database. If your organization is unfortunate enough
    to be Patient Zero, that false negative can cause real harm. While AI may find
    the zero-day threat overlooked by signature detection, it does so by also capturing
    false positives (there’s no such thing as a perfect detection model).


    You may think that false positives are a lot less harmful than false negatives.
    It depends on how you look at it. False positives divert a security organization’s
    limited time and attention away from true positives. Much like the deception technology
    I mentioned earlier distracts adversaries, false positives are a considerable
    drain on an organization’s cybersecurity resources.


    A Ponemon study^([12](#c08.xhtml#c8-note-0012)) explored how insidious false positives
    can be. The average organization faces 17,000 threat alerts weekly. Of those,
    a mere 19 percent were deemed worthy for action. Ponemon concluded the average
    large company spends $1.3 million chasing false positives—equivalent to almost
    21,000 hours of wasted time.


    Adding to the complexity of this topic is a new threat category called adversarial
    machine learning (AML). Bad actors are at it once again, innovating in ways to
    create chaos or harm for their victims. With AML, adversaries manipulate inputs
    to otherwise sound machine learning models. The “garbage-in, garbage-out” premise
    applies as much in the realm of cybersecurity as in any other realm of IT. A machine
    learning model is only as good as its inputs. If the inputs are faulty (or tampered
    with), the model’s accuracy suffers.


    At a recent tradeshow, McAfee showed how the slightest changes to pixels in an
    image, imperceptible to a human eye, could confuse a machine learning model into
    classifying a picture of a penguin as . . . a frying pan! Frying pans and penguins
    may be harmless in the real world. But imagine the same poisoning of pixels in
    a digital stop sign that an autonomous car now registers as a speed limit sign,
    and you can imagine how dark the use cases in this area can get.


    Enemies can potentially inflict the same confusion to malware classification engines.
    By introducing slight variants to highly sensitive machine-learning models, adversaries
    can disorient cybersecurity professionals. They can slam these first responders
    with a rash of false positives, perhaps deadening their sense of urgency to respond
    in the process (in much the same way nuisance fire alarms have been shown to do
    in multi-tenant buildings^([13](#c08.xhtml#c8-note-0013)) ). Then, when the adversary
    is confident her victim’s shields have been lowered, she wages her real assault.


    AI, like any technology, is a weapon in both your company’s cybersecurity arsenal
    and your enemies’ arsenals. It doesn’t mean we should avoid AI. Rather, we need
    to understand its potential and limitations.


    For example, there’s no avoiding the talent shortage. On one hand, AI allows cybersecurity
    defenders to address more threats by delegating to machines tasks that would otherwise
    require human intervention. That said, AI will also increase false positives and
    is subject to adversarial poisoning. If either of these possibilities is left
    unattended, AI will sap some of the productivity gains it created in the first
    place. Threats come in all varieties. Defenses must do the same. This problem
    requires teaming humans with machines. It also requires pairing various threat
    detection models—artificial intelligence and signature-based—to maximize efficacy
    and minimize the occurrence of false positives.'
