    # 第 5 章：当过好的东西也会变成坏事


    '
- fmt: '

    Before I joined the ranks of cybersecurity, I spent much of my career in telecommunications.
    I was part of the wild ride that was the dot-com boom of the late nineties. I
    remember when just about everyone I knew was off to found or join the next dot-com
    start-up. It seemed that all were destined for success. I remember those of us
    fortunate enough to work in the industry at the time gloating that we were part
    of the modern-day gold rush. I was in the right place, at the right time. There
    were more job offers coming my way than I could shake a stick at. Life was good.


    Until it wasn’t. The dot-com bust at the turn of the century shattered dreams
    and careers. Unemployment soared overnight. The struggle was very real for many
    of my friends who traded their equity that wasn’t worth the paper on which it
    was printed for a pink slip worth even less.


    It took several years and multiple rounds of layoffs for a tumultuous telecom
    industry to eventually equilibrate. But equilibrate it slowly did. And the virtually
    nonexistent telecom unemployment rate at the dawn of the millennium is now a reminder
    to those of us who endured that journey and have the scars to show for it, of
    how too much of a good thing can be very bad indeed.


    Fast-forward in my career nearly 15 years later when I entered McAfee and the
    cybersecurity industry. Of course, I knew that McAfee was in the business of security.
    It was a calling I shared. I wanted to do something meaningful with the 60-plus
    hours per week I invest in my career. Saving lives seemed about as good as it
    got.


    So good, in fact, that I soon learned that we couldn’t hire people fast enough.
    The global talent shortage in the industry took me back to the days of that practically
    nonexistent unemployment rate from an era gone by. While candidates in cybersecurity
    roles may relish the idea of perpetual job security, the reality is that the consequences
    of a zero-percent unemployment rate in this industry are even worse than what
    I experienced so long ago.


    The reason is that there is so much more at stake. Back in the day, filling jobs
    for the latest dot-com boom wasn’t likely a matter of life or death. Some enterprising
    start-ups may have found it more difficult to attract and retain talent for their
    latest ventures, but let’s be real. What was really at stake?


    Perhaps we’d have to wait a few more years for the Internet’s potential to catch
    up to its hype; for the app economy we know and love today to materialize. Those
    early grocery or pet supply delivery services would see a few false starts. Lucky
    for us, there were plenty of viable options through which to procure such goods,
    even while we waited for e-commerce at our fingertips to deliver virtually anything
    to us in days (if not hours). The dot-com boom and subsequent bust are now but
    distant memories for most of us. We survived to tell the tale.


    Cybersecurity is different. There’s more than network bandwidth or cool applications
    at stake. A lot more. We have national security to consider. Companies have intellectual
    property, finances, reputation, and more to protect. All the while, we struggle
    to fill jobs for those who defend us.


    Unlike in the telecom industry, this talent shortage isn’t likely to be solved
    by some industry bust. We’re not likely to see unemployment rates skyrocket with
    a glut of talented cybersecurity professionals entering the market. That’s because
    our enemy won’t have it that way. Adversaries continue to recruit to their ranks.
    As long as there is no shortage of bad actors, there will be no surplus of cybersecurity
    professionals.


    This is the nature of our beast. Cybersecurity vendors poach talent from one another,
    since it’s easier to pay more for someone already schooled in the industry than
    to attempt to recruit from a virtually bankrupt pipeline of candidates. The private
    sector finds itself in the same revolving door of talent. And the public sector,
    typically with the most to defend (our national security!) is left to compete
    in this hotly contested labor market with the toughest constraints on compensation.


    The demand for cybersecurity professionals far exceeds its supply. And that gap
    affects all of us.


    To make matters worse, we have a dearth of diversity in the talent pool. Women
    and minorities are woefully underrepresented. Even if you’re not one who sees
    the goodness in having a diverse workforce, this problem transcends political
    or ideological principles. The unfortunate reality is that we don’t have enough
    qualified candidates in the labor market or pipeline, and that’s a problem that
    requires `all` the help we can get. A gender or minority gap works against all
    of us by greatly diminishing our addressable market for cybersecurity talent.


    ## It Wasn’t Always This Way


    It’s tempting to think this problem is too big to solve. It’s easier to kick the
    can down the road than put the work in today to address the cybersecurity talent
    shortage. It’s particularly understandable when considering what we’re up against:


    *   Millions of cybersecurity jobs globally will go unfilled over the next several
    years.

    *   Depending on the source, women make up anywhere from 11 to 20 percent of the
    cybersecurity workforce.^([1](#c05.xhtml#c05-note-0001)) Even if we take the higher
    percentage, it’s a representation far lower than in the general labor market,
    where women represent half the workforce.

    *   For minorities, the statistics are even worse. They make up only 5 percent
    of cybersecurity professionals^([2](#c05.xhtml#c05-note-0002)) compared with approximately
    one-third of employed Americans overall.


    Perhaps the problem isn’t solvable? Maybe women and minorities simply aren’t inclined
    to pursue jobs in cybersecurity? Or perhaps they’re just not cut out to do the
    work? Could it be that the cybersecurity industry is doomed to lack diversity
    and its inherent benefits?


    Not if its origins are any indicator of its destiny. The original software programmer
    was a woman. Ada Lovelace is widely credited with writing the first computer program
    in history—an algorithm that would calculate the Bernoulli sequence, which, among
    other things, explains why an airplane’s wings take flight.


    In the mainframe era that dawned in the 1940s, it was women, once again, who programmed
    the machines. Men were more interested in building these behemoth computers, leaving
    the meticulous coding to their female counterparts.


    During World War II, women comprised 75 percent of the Bletchley Park code-breaking
    operation^([3](#c05.xhtml#c05-note-0003)) that helped break the Enigma code of
    the Germans.


    After the war, women remained foundational to coding in the private sector. A
    woman, Grace Hopper, created the first compiler, something that translated English-friendly
    code into the bits and bytes understandable by a computer.


    As programming jobs exploded in the 1950s and 1960s, women were a mainstay in
    the labor force. The field was a meritocracy, based on aptitude and achievement.
    Companies often selected programmers based on an admissions test, one that typically
    involved pattern recognition. Women and men were on an equal playing field.


    What changed?


    Perhaps the more important question is: What *didn’t* change? Women didn’t suddenly
    lose their propensity to apply math or science skills to their work. And companies
    didn’t decide overnight that men were more capable than women of fulfilling the
    responsibilities required of a programmer.

