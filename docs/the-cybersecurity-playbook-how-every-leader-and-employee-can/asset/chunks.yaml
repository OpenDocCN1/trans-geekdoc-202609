    你是否曾经在拨打过去的人接听电话时感到措手不及？那种感觉很奇异。你预料会有个回应，但结果并没有。这正是我听到他的声音时的那种感觉。我发现自己在苦思冥想地寻找该说的措辞。


    *   “呃，你好，约翰逊警长。我是艾莉森·塞拉（Allison Cerra）。我听说你今天早上和我妈妈通过电话了。”


    他并没有像我那样哑口无言。


    *   “是的，塞拉小姐。我联系你母亲是因为我们一直在尝试联系你。我这里有一张未执行的逮捕令，要求你前往田纳西州戴维森县（Davidson County）面见[姓名未披露]法官出庭，因为你
    8 月份缺席了庭审。”


    *   “我显示你以前住在纳什维尔，是这样吗？”


    权威是一种强大的力量，尤其是对于那些终生都尊重权威的人来说。我从小就学到，当权威人士向你提问时，你不要用问题来回答问题。你只需要给出回答即可。


    *   “是的，没错。”


    *   “嗯，我们显示你有一张关于 8 月 15 日缺席庭审的逮捕令。”


    权威还会强迫你纠正事实。这家伙绝不可能是对的。但我并没有触发“战斗或逃跑”的本，也没有拉响怀疑的警报（以及质疑），我对权威那压倒性的服从反而让我开始了解释。


    *   “先生，我很抱歉。这听起来不对。我只在 1995 年的几个月前在纳什维尔住过几个月。8 月份时我甚至不在纳什维尔。”


    *   “塞拉小姐，我不知道该对你说什么。令是法官签发的。你得和她处理这件事。”


    现在，故事发生了意想不到的转折。因为你本会预料，如果这家伙是个骗子，他会立刻开始那套“但如果你把信用卡号给我，我一定能帮你解决这个问题”的推辞，那无疑会让我的警报瞬间大作响。


    但他完全没有那样做。他只是一直向我提问以核实我的背景。


    而我只是在回答。


    *   “我显示你住在这个地址，对吗？”


    *   “是的，先生。没错。”


    *   “我显示你现在住在丹尔顿县（Denton County）。对吗？”


    *   “是的，和我丈夫住在一起。”


    注意我当时是如何完全处于权威的掌控之下，回答问题时提供的信息甚至比要求的还要多。这家伙完全把我拿捏了。


    大约这时，我丈夫从卧室走出来，揉着眼里的睡意，但他足够敏锐，意识到我正在打一个严肃的电话——而且听起来不像工作电话。


    *   “发生什么了？”


    警长还在跟我核实信息。我匆忙把他按了静音，向我丈夫同步一下早晨发生的情况。


    *   “妈妈打电话了。她接到了纳什维尔一个警长的电话，说因为我缺席了庭审，我那里有一张逮捕令。我正和他他通话，试图解决这件事。”


    *   “这怎么可能？你已经没在那儿住很久了。”


    （现在我开始对丈夫说出这些显而易见的话感到不耐了。）


    *   [咬牙切齿地]“我知道。所以我才试着解决这件事。”


    接着，我那还没睡醒的丈夫问了我一个我在拨通号码之前本应该自问自己的问题：


    *   “你确定这家伙不是在骗你吗？”


    你是否经历过想法快得涌入脑海，快到你可以在几纳秒内回放生命中过去的几分钟？对我来说，那是自从我第一次接到妈妈的短信以后的 30 分钟，而我此刻正在脑海中重演这一切。在这
    30 分钟里的第一次，我拥有了前所未有的清醒。


    我的大脑一片空白，心跳由于完全不同的原因而加速。“某某警长”还在喋喋不休，我的“战斗或逃跑”反应终于出现了。我试图理清思绪。


    *   “警长，我确定这是个误会。感谢你的提醒。我会回电给你的解决这件事。”


    我想挂掉这通电话。他表现得异常客气。没有那种要信用卡号的最后通牒。警察在几分钟内就会出现在我的家门口。


    *   “没问题，塞拉小姐。我明白。你可以打这个号码回给我。”


    电话断了。


    在我挂电话之前，我丈夫已经在用手机拨打戴维森县警局的电话了。


    你可以猜到故事的下半部分。那里并没有什么约翰逊警长。正如我那里并没有什么缺席庭审的逮捕令——或者任何其他东西。显然，这种骗局非常流行，正如丈夫电话那头的真实警察所证实的那样。


    *   “我们每周至少会接到一次这种电话。这是骗局。告诉你你妻子，我们不会那样打电话。我们会直接上你家门。”（废话。我觉得自己像个傻瓜。）


    但为了保险起见，我去了我们当地的派出所，确认我作为一个负责任的社会成员的记录没有任何污点。我带着那份根深蒂固的对权威的度尊重，询问柜台后的警察是否打算逮捕我。当他回答“没有”时，我感到如释重负。


    ***


    你可能会怀疑自己购买一本保护公司免受网络威胁的书的判断，毕竟，我已经承认自己犯过这种错误了。


    网络安全行业将此类诈骗称为“社会工程学”。你熟悉的这种变叫做“网络钓鱼”，即网络犯罪分子发送恶意邮件，伪装成受害者圈子内的信赖权威，要求他们提供敏感信息或点击链接。我们已经有些低估了网络钓鱼或创造者的想象力。网络钓鱼早已远离了“我是尼日利亚王子，我钱”的时代。仅在
    2018 年，麦克菲就检测到了超过百万个新的钓鱼 URL。[([1])


    而且社会工程学延伸了数字领域，正如我的经历所证明的那样。


    在没有陷入某种黑客将夺走我们所有东西末日预言之前，有一个清醒的现实是我无法夸大的：对于任何读这本书的个人员工来说，`你`都是你们公司对抗网络犯罪战斗中最强或最弱的环节之一。


    考虑一下这句话的力量。行业分析机构 Gartner 预测，2018 年全球公司在网络安全产品和服务上的支出超过了 1140 亿美元。[([2]) 这让网络安全与其他规模超过
    1000 亿美元的行业（如数字电视和视频、数字营销和游戏）处于同一水平。


