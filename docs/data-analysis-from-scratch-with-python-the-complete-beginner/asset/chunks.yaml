    The idea of Question-answering (QA) systems is to extract information directly
    from a document, conversation, online search, or any other place that meets the
    user''s needs. Instead of forcing the user to read the full text, QA systems prefer
    to give short and concise answers. Today, QA systems are easily combined with
    chat bots, go beyond the search for text documents, and extract information from
    a set of pictures.


    Most NLP tasks can be considered as question-answer tasks. The paradigm is simple:
    a request is sent, to which the machine provides an answer. Through reading a
    text or a set of instructions, a reasonable system should find the answer to a
    wide range of questions. Naturally, you need to create a model to answer common
    questions.


    Especially for QA tasks, a powerful deep learning architecture has been created
    and optimized - Dynamic Memory Network (hereinafter referred to as `DNM`). Trained
    on a training set of input data and questions, `DNM` generates episodic memories
    and uses them to generate suitable answers. This architecture consists of the
    following components:


    The semantic memory module, similar to the knowledge base, consists of previously
    prepared `GloVe` vectors that are used to create sequences of vector representations
    of words from incoming sentences. These vectors will be used as input to the model.


    The input module processes the input-related vectors into sets of vectors, called
    `facts`. This module is implemented using the `Gated Recurrent Unit` (hereinafter
    - `GRU`), which allows the network to find out the relevance of the proposal in
    question.


    The question module processes the question word by word and produces a vector
    using the same `GRU` as in the input module, with the same weights.


    The episodic memory module stores vectors of `facts` and questions extracted at
    the input, encoded as `attachments`. This is similar to the process in the hippocampus
    of the brain to extract temporary states in response to sound or sight.


    The response module generates a suitable response. At the last step, episodic
    memory contains the information necessary for the answer. This module uses another
    `GRU` trained with the classification of cross-entropy error of the correct sequence,
    which is converted back to natural language.


    ![https://neurohive.io/wp-content/uploads/2018/10/0\_5K06B3-K08ypyZjB.png](images/00028.gif)


    `DNM` does a good job with QA tasks and outperforms other architectures for semantic
    analysis and part-speech tagging. Since the release of the initial version, `DMN`
    has undergone a number of improvements to further improve accuracy in QA tasks:


    *   `DMN` for answers to text and visual questions - `DNM` applicable to images.
    Here, input modules and memory modules are upgraded to answer visual questions.
    Such a model improves the result of the existing architecture on most tests on
    visual question-answer datasets without a teacher.

    *   Dynamic coattention networks for answering questions come up with a solution
    to the problem of exiting a local maximum corresponding to an incorrect answer.
    The model merges the dependent views of the question and the text to focus on
    their appropriate parts. Next, the dynamic pointing decoder goes through a full
    set of potential responses.


    ## Summary of Text (Text Summarization)


    It is difficult for a person to manually select a summary in a large volume of
    text. Therefore, in NLP there is the problem of creating an accurate and concise
    summary for the source document. Text Summarization is an important tool to help
    interpret textual information. Push notifications and article digests attract
    a lot of attention, and the number of tasks to create reasonable and accurate
    resumes for large fragments of text is growing day by day.


    Automatically extracting summary from text works as follows. First, the frequency
    of occurrence of a word in a full text document is considered, and then the 100
    most common words are saved and sorted. After that, each sentence is evaluated
    by the number of frequently used words, moreover, the weight of the more common
    word. Finally, the first `X` sentences are sorted according to the position in
    the original text.


    ![https://neurohive.io/wp-content/uploads/2018/10/0\_CS0NqiXahggQjabL-570x356.png](images/00029.gif)


    While maintaining simplicity and generalizing ability, the algorithm for automatically
    extracting summary content is able to work in complex situations. For example,
    many implementations fail on texts with foreign languages or unique vocabulary
    associations that are not contained in standard arrays of texts.


    There are two fundamental approaches to reducing text: `extractable` and `abstract`.
    The first extracts words and phrases from the original text to create a resume.
    The latter studies internal linguistic representation in order to create a humanoid
    exposition, paraphrasing the original text.


    Extractive abbreviation methods work based on subset selection. This is achieved
    by extracting words and phrases from the original text to create a resume. `LexRank`
    and `TextRank` are well-known representatives of this approach. `LexRank` is a
    graph-based algorithm that uses `cosine` of the inverse frequency of a word as
    a measure of the similarity between two sentences. `TextRank` is similar to `LexRank`,
    but has some improvements. These include:


    *   Using lemmatization instead of stemming

    *   Applying part-time markup and object recognition

    *   Extracting key phrases and sentences based on these words

    *   Along with the summary of the article, `TextRank` extracts key phrases.


    ![https://neurohive.io/wp-content/uploads/2018/10/0\_73TZw9Ltv1G4MQVa-770x232.png](images/00030.gif)


    Models for abstract summaries use deep learning, which allowed breakthroughs in
    such tasks. Below are the noteworthy results of large companies:


    *   `Facebook Neural Attention` is a neural network architecture that uses a local
    model with an attention mechanism that can generate every word of the resume depending
    on the input sentence.

    *   `Google Sequence-to-sequence` adheres to codec architecture. The `encoder`
    is responsible for reading the source document and encoding into the internal
    representation. The `decoder` is responsible for generating each word of the output
    summary and uses the encoded representation.

    *   `IBM Watson` uses a similar `Sequence-to-sequence` model, but with the properties
    of an attentive and bidirectional recurrent neural network.


    # CHAPTER 8


    ## How to develop chatbot from scratch in Python: a detailed instruction


    You may have heard of Duolingo: a popular application for learning foreign languages,
    in which learning takes the form of a game. Duolingo is popular for its innovative
    learning style. The concept is easy: five to ten minutes of interactive learning
    per day is enough to learn a language.


    In spite of the fact that Duolingo allows you to learn a new language at the service
    of users experiencing the problem, they felt that they did not develop conversational
    skills, as they were learning on their own. Users were reluctant to learn in pairs
    due to embarrassment. This problem did not go unnoticed by developers.


    The service team solved the problem by creating a chatbot in the application to
    help users gain conversational skills and put them into practice. Since bots were
    designed to be talkative and friendly, Duolingo users practice communicating at
    a convenient time for them, choosing an “interlocutor” from the set, until they
    overcome enough embarrassment to move on to communicating with other users.


    So what is a chat bot?

    '
