    \ for an intermediate representation. A common way to do this is to consider a\
    \ sentence as a sequence of individual word vectors using either Word2Vec, or\
    \ more recent approaches like GloVe or CoVe. That is what we will do next.\n\n\
    ![https://habrastorage.org/webt/gm/ba/rw/gmbarwqrbnmoh925k8oqdeflfco.png](images/00016.jpeg)\n\
    \nHighly efficient model-learning architecture without additional pre-processing\
    \ and post-processing (end-to-end, source) \n\nConvolutional neural networks for\
    \ classifying sentences (CNNs for Sentence Classification) learn very quickly\
    \ and can serve as an excellent input to the deep learning architecture. Although\
    \ convolutional neural networks (CNNs) are mostly known for their high performance\
    \ on image data, they show excellent results when working with text data, and\
    \ are usually much faster to learn than most complex NLP approaches (for example,\
    \ LSTM networks and Encoder / Decoder Architecture) This model preserves the word\
    \ order and learns valuable information about which word sequences serve as a\
    \ prediction of our target classes. Unlike previous models, she is aware of the\
    \ difference between the phrases \"Lesha eats plants\" and \"Plants eat Lesha.\"\
    \ \n\nTraining this model does not require much more effort than previous approaches,\
    \ and, as a result, we get a model that works much better than the previous one,\
    \ allowing us to obtain an accuracy of 79.5%. As with the models we reviewed earlier,\
    \ the next step is to research and explain predictions using the methods we described\
    \ above to make sure that the model is the best option we can offer users. At\
    \ this point, you should already feel confident enough to cope with the next steps\
    \ yourself.\n\nSo, a summary of the approach that we have successfully put into\
    \ practice:\n\n*   Start with a quick and easy model;"
