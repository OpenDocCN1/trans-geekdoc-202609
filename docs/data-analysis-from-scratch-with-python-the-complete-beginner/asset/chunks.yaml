    ## INTRODUCTION


    The data analysis techniques have substantial support in machine learning for
    the generation of knowledge in the organization. Machine learning exploits statistics
    and many other areas of mathematics. Its advantage is speed.


    Although it would be unfair to consider that the strength of this type of techniques
    is only speed, it must be taken into a report that the speed that characterizes
    this artificial intelligence modality comes from the processing power, both sequential
    and parallel, and in-memory storage capacity. However, the potential of machine
    learning to complement other, more traditional data analysis techniques has to
    do with the ability to relearn the representation of the data.


    Machine learning allows machines to use a different and proper language for problem-solving.
    It is a language in continuous evolution and with roots in the analysis, although,
    for many, it cannot be considered analytics as such.


    When the possibilities of machine learning complement the scope of the data analysis
    techniques, it is possible to see much more clearly what matters in terms of knowledge
    generation, not only at the quantitative level but also ensuring a significant
    qualitative improvement.


    ### Why machine learning is the best complement to data analysis techniques


    Machine learning methods are far superior in the analysis of data from multiple
    sources. Transactional information that which comes from social media or that
    originates from systems such as `CRM` can overwhelm the ability of traditional
    data analysis techniques.


    On the contrary, high-performance machine learning can analyze a whole Big Data
    set, instead of forcing business users to settle for a representative sample that,
    after all, remains a sample.


    This scalability not only allows predictive solutions based on sophisticated algorithms
    to be more accurate but also drives the importance of software speed. In this
    way, it is already possible to interpret in real-time the billions of rows and
    columns that must be investigated, while the analysis of the data flow that is
    arriving does not stop.


    In order to take full advantage of machine learning, organizations must move towards
    a model that allows:


    * Win in intelligence and usability in regards to the use of machine learning.

    * Allow not only data scientists and professional profiles with a higher degree
    of specialization to access this technology.

    * Put the means so that business users can also take advantage of the latest generation
    analytical capabilities that machine learning offers them.

    * When this technology is democratized and integrated with the data analysis techniques
    that are already in use in the organization, the business not only gains insights
    but significantly accelerates the time needed to generate quality knowledge. In
    this way, any organization, of any size, can exploit the unprecedented competitive
    potential.


    ### When data analysis techniques find no substitute


    It seems obvious to think that the ideal complement to data analysis techniques
    can also be the determining factor in their end. Moreover, yet it is not. Machine
    learning is a winning combination when it is known to integrate into an analytics
    strategy, but it cannot replace the necessary predictive capabilities that every
    organization needs.


    Sometimes it is not efficient, nor profitable, and much less logical, to resort
    to this form of artificial intelligence to solve specific questions. Typically,
    these are topics where the best answer comes from analytics, such as:


    * The marketing strategy that gives the best results.

    * The calculation of routes.

    * The behavior of a consumer segment.


    ### Why invest in machine learning when it is not the best solution? Supplement
    yes, substitute no. Because although the data analysis techniques that are usually
    used in organizations can be limited, related to the volume of data to be processed
    or the speed at which it is necessary to obtain insights; Machine learning is
    also not the most straightforward alternative.


    Machine learning requires the organization to be able to provide data in certain
    conditions (a continuous flow in real-time), and, above them, it needs to create
    an algorithm, which allows reaching a set of rules that work regardless of whether
    it exists or no information available.


    And, while it is true that the only way to exploit the actual value of `IoT` or
    the most efficient and lowest-cost way to achieve innovative solutions in line
    with wearables, for example, in the health industry, is the machine learning;
    It should also be borne in mind that many business decisions only require the
    support given by a couple of processing rules, a solution that facilitates the
    discovery of data and the identification of trends, or software that allows them
    to forecast future scenarios with a minimum margin of error.


