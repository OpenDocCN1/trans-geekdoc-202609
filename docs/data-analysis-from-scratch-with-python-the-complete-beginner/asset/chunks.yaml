  trans: "\n\n命名实体识别器 (`NER`) 能够识别文本中属于我们感兴趣的特定类别的单词或词组。实体的示例包括名称、数字、地点、货币、日期、机构。有时，通过词的形式、词是否存在于特定字典中、词性等特征，可以很容易地区分实体。然而，很多时候这些特征并不为人知，甚至根本不存在。在这种情况下，为了确定一个单词或短语是否为实体，必须对其上下文进行分析。\n\
    \n`NLP Architect` 中的 `NER` 模型基于双向 `LSTM` 网络和 `CRF` 分类器。下面是对该模型的高级概述。\n\n![NER\
    \ 模型的高级概述](img/00002.jpeg)\n\n NER 模型的高级概述\n\n用户意图确定算法解决了语言理解的问题。其目的是为了理解中中讨论了什么种动作，并识别所有参与方。例如，对于句子\n\
    \n“Siri，请提醒我在回家的路途中从洗衣店取东西。”\n\n算法确定了动作（`remind`）、谁应该执行该动作（`Siri`）、谁请求执行该动作（`I`）以及动作的对象（`pick\
    \ up things from the laundry`）。\n\n词含义分析器。算法在输入端接收一个单词，并返回该单词的所有含义，以及描述每种含义在语言中流行程度的数字。\n\
    \n## 神经网络的端到端示例\n\n已经提到 `NLP Architect` 库包含了一些端到端模型。让我们简要查看其中两个。\n\n文本理解。名为 `reading_comprehension`\
    \ 的文件夹包含了来自指南 `Machine Comprehension Using Match-LSTM` 和 `Answer Pointer` 的语言理解模型实现。该方法的思想是考虑到问题，构建一个文本片段的向量表示，并将此向量表示提交给神经网络的输入，网络将返回问题答案在片段中的起始和结束位置。\n\
    \n![NLP 目标对话](img/00003.jpeg)\n\n 目标对话\n\n带有记忆的用于目标对话的端到端神经网络。在 `memn2n_dialogue`\
    \ 的文件夹中，有一个带有记忆的神经网络（`memory network`）实现，用于维护目标对话（目标导向对话）。\n\n在目标对话期间，与自由话题对话不同，系统有一个特定的目标，该目标必须通过与用户的交互来实现。简而言之，系统需要理解用户的请求并在有限的对话步数内完成相应的任务。任务可能是预订餐厅桌位、设置定时器等。\n\
    \n## NLP Architect 可视化工具\n\n该库包含一个小型 Web 服务器 - `NLP Architect Server`。它方便了测试不同的\
    \ `NLP Architect` 模型的性能。此外，服务器还具有可视化工具，这些是展示模型运行的精美图表。目前，有两个服务支持可视化——解析器和命名实体识别器。此外，还有一个模板，用户可以使用它为其他服务添加可视化。\n\
    \n![NLP Architect 可视化](img/00004.jpeg)\n\n `NLP Architect` 是一个开放且灵活的库，拥有词处理算法，使来自各地的开发者能够进行交互。\n\
    \n"
- fmt: '

    One of the key skills of a professional Data Scientist knows what should be the
    next step - working on a model or data. As practice shows, at first it is better
    to look at the data itself, and only then clean it up.


    A clean dataset will allow the model to learn significant attributes and not retrain
    on irrelevant noise.


    The following is a checklist that is used to clear our data (details can be found
    in the code).


    - Delete all irrelevant characters (for example, any non-alphanumeric characters).

    - Tokenize the text by dividing it into individual words.

    - Remove irrelevant words - for example, Twitter mentions or URLs.

    - Convert all characters to lower case so that the words "hello", "hello" and
    "hello" are considered the same word.

    - Consider combining misspelled or alternative spelling words (for example, `cool`
    / `cool/cool`)

    - Consider lemmatizing, that is, reducing the various forms of one word to a dictionary
    form (for example, “machine” instead of “machine”, “by machine”, “machines”, etc.)


    After we go through these steps and check for additional errors, we can begin
    to use clean, tagged data to train the models.


    ## Step 3. Choose a good view of the data.


    As input, machine learning models accept numerical values. For example, models
    that work with images take a matrix that displays the intensity of each pixel
    in each color channel.


    ![https://habrastorage.org/webt/pn/vo/ne/pnvonepkxguu1it2qb-nme0rjm0.png](images/00005.gif)


    A smiling face, represented as an array of numbers


    Our dataset is a list of sentences, so in order for our algorithm to extract patterns
    from data, we must first find a way to present it in such a way that our algorithm
    can understand it.


    ### One-hot encoding ("Bag of words")


    The natural way to display text in computers is to encode each character individually
    as a number (an example of this approach is `ASCII encoding`). If we “feed” such
    a simple representation to the classifier, he will have to study the structure
    of words from scratch, based only on our data, which is impossible on most datasets.
    Therefore, we should use a higher level approach.


    For example, we can build a dictionary of all unique words in our dataset, and
    associate a unique index with each word in the dictionary. Each sentence can then
    be displayed in a list whose length is equal to the number of unique words in
    our dictionary, and in each index in this list it will be stored how many times
    this word appears in the sentence. This model is called the “Bag of words” (`Bag
    of Words`), since it is a mapping completely ignoring the word order of a sentence.
    Below is an illustration of this approach.


    ![https://habrastorage.org/webt/uc/f9/sm/ucf9sm\_gzdytgyripyurqh7fbbe.png](images/00006.jpeg)


    Presentation of sentences in the form of a “Bag of words”. The original sentences
    are indicated on the left, their presentation is on the right. Each index in vectors
    represents one specific word.


    ### Visualize Vector Representations.


    The Social Media Disasters dictionary contains about 20,000 words. This means
    that each sentence will be reflected by a vector of length 20,000. This vector
    will contain mainly zeros, since each sentence contains only a small subset of
    our dictionary.


    In order to find out whether our vector representations (`embeddings`) capture
    information relevant to our task (for example, whether tweets are related to disasters
    or not), you should try to visualize them and see how well these classes are separated.
    Since dictionaries are usually very large and data visualization over 20,000 measurements
    is not possible, approaches like the principal component method (`PCA`) help project
    data into two dimensions.


    ![https://habrastorage.org/webt/bu/a0/jk/bua0jkpnurkzdifvwunfhapbdom.png](images/00007.jpeg)


    Visualization of vector representations for the “bag of words”


    Judging by the resulting graph, it does not seem that the two classes are separated
    as it should — this may be a feature of our representation or simply the effect
    of reducing the dimension. In order to find out whether the capabilities of the
    “bag of words” are useful to us, we can train a classifier based on them.


    ## Step 4. Classification


    When you are starting a task for the first time, it is common practice to start
    with the simplest method or tool that can solve this problem. When it comes to
    classification, `logistic regression` is used because of its versatility and ease
    of interpretation.


    We will divide our data into a training sample, and a test one, to see how well
