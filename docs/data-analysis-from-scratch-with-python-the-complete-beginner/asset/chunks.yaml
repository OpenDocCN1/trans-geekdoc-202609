    spoken or written. This is not just an exogenous signal, but a conscious transfer
    of information. In addition, the language is encoded so that even young children
    can quickly learn it.


    Human language is a discrete, symbolic or categorical signaling system with reliability.


    Categorical symbols of the language are encoded as signals for communication on
