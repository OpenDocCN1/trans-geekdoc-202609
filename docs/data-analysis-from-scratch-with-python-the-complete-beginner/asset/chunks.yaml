    IBM 专业证书计划是 IBM 在同一教育平台上推出的的一项专业计划。它由 5 门课程组成：`Deep Learning Fundamentals with
    Keras`、`Deep Learning with Python and PyTorch`、`Deep Learning with Tensorflow`、`Using
    GPUs to Scale and Speed-up Deep Learning` 以及 `Applied Deep Learning Capstone Project`。


    俄罗斯平台“开放教育”（Open Education）上有多种培训选项。该平台的特点是是在俄罗斯领先大学的参与下创建的，所有课程均免费提供，但同时你也可以获得证书并在你的大学记录这些课程学分。在国外平台上，你通常可以免费学习课程，但必须为证书付费。


    “实践中的数据分析”是 MIPT（莫斯科物理物理技术学院）的一门课程，其中还涵盖了文字处理。


    “大数据分析”是俄罗斯国立科技大学工业大学（NUST MISiS）的一个计划，在该框架下学习了许多 NLP（自然语言处理）所需的技能。该计划预计于 2 月启动。


    “数据科学与大数据分析”是圣彼得堡理工大学的一门复习课程，部分涉及文本分析。该课程的报名已关闭，上述许多其他正在进行或最近完成的课程也已关闭。但你可以订阅课程更新，以免错过下一批次。


    # 第 3 章


    ## 编程面试题


    你正在为下一次编程面试做准备吗？也许是第一次，所以现在你正在一个要求极高的领域扮演角色，编程和编码对于对世界上每个行业产生积极变革至关重要。这一切都始于像你这样的人，你们在幕后工作，以确保你的数字基础设施、操作系统和工业应用程序能够按需运行。


    以下的 50 多道编程面试题应该让你对在编程领域与招聘经理或招聘专家交流时可能预期的对话类型有个了解。数据结构只是开始，可能会被问到很多问题，包括关于使用编程语言解决逻辑问题的问题。


    走出门槛后请继续深入；从一些任何专业人士都会熟悉的最基础的面试题开始。


    ### 1. 文化与合规


    你可能对工作面试或破冰的“文化相关性”问题并不陌生。在编程面试中，这类别的某些问题可能会问得更具体。你可能会被要求定义你的工作流程，讨论你的团队合作方法，或评论你在编码项目期间是如何组织工作的。


    例如：


    * 你第一个学习的是哪种编程语言？

    * 有任何现有的证书吗？

    * 在此过程中获得了哪些相关技能？

    * 你在复杂项目中以及通常情况下是如何组织的？

    * 你如何在这个领域保持你的知识和技能的更新？


    到目前为止你已经熟悉了业务需求，所以你关于教育背景和经验的问题不应该觉得被冷落。全球科技公司正在根据当前的编码情况和计算机科学人才的缺乏来重新评估其业务需求。如果你与这样的公司会面，你必须证明你有积极参与自学和持续学习的意愿，以保持你的技能的相关性。


    然而，每个编程面试官都应该了解一些基础。为了帮助你准备，我们的编程面试题被很好地组织成 10 个大类。这并不完全取决于你所申请的职位。


    所有这些问题都会被问到？绝不可能！然而，在你知道程序员职业是否适合你之前，你需要了解你将要负责的学科的广度。我是 Dallayal。


    ### 2. 通用编程与设计题


    不知道这些编码原则的申请者不会得到回电。看看你可以在不减速的情况下连续回答多少这类问题。


    **什么是变量？**


    没有变量，就没有程序。变量是根据程序的通用条件和程序执行的工作而变化的程序。变量是存储在或“在程序中声明”的值，代表程序运行的数据集。`变量 = 数据集 +
    算法`。


    **什么是继承？**


    继承是面向对象编程的基础，提供了扩展现有代码以满足新需求的能力，而无需从头开始代码。


    **什么是多态？**


    多态允许编程中的新对象假设现有对象的属性。提供继承属性的对象被称为“基类”或“超类”。


    这是程序根据类型或类不同方式处理对象的能力。想象一辆汽车对比一辆坦克。多态是一个通用系统，为在两种车辆类型中运行的系统提供计划。


    **什么是指针？**


    标记包含其他值的内存地址。更改标记可以节省更改标记所表达的数据的时间。这可以是编写处理数据的程序的有效方法。


    指针通常在 `C` 中使用，但在 `Java` 中较少使用。


    **列出四种存储类的名称。**


    寄存器、静态、外部和自动。


    * **寄存器 (Register)**：这些是存储在中央处理器寄存器中的存储类。

    * **静态 (Static)**：变量不改变的存储类。它在编程任务开始时宣布。

    * **外部 (External)**：硬件（如设备驱动程序）的本地存储类。如果我再次需要这个变量，从外部设备读取以获取最新值。

    * **自动 (Automatic)**：由块或函数定义局部变量的存储类。


    **什么是封装？**


    这是面向对象设计中最重要的概念之一。它涉及用一组指令组装一个 `class`（类）。在封装中，对象不仅包含其数据，还包含可以修改它的函数。封装仍可用于隐藏数据的本质，同时促进交互。


    **列出七种数据类型。**


    浮点数 (Floating point)、float、实数 (real)、整数 (integer)、字符串 (string)、字符 (character)
    和 `Boolean`。


    **列出五种数据结构类型。**


    链表、队列、文件、栈、树和图。


    **特定函数或变量的“声明”和“定义”有什么相似之处？**


    声明包含了标识符的类型和函数，并解释链接器需要引用它。定义描述了编译器为了交互需要做什么。


    解释器和编译器之间有什么相似之处？


    当解释器直接执行命令时，编译器将这些命令（程序）从源代码转换为机器码。编译器程序运行比解释器语言更快，并可以在范围内使用。


    解释器语言示例：`Basic`、`Korn Shell`、`Ruby`、`Python`


    编译器语言示例：`Java`、`C++`


    准备好继续了吗？从这里开始，你可以预计招聘经理开始输入编码所需的一些更具体的信息。


    3\. 算法


