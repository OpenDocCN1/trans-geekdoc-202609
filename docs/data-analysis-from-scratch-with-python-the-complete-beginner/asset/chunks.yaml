    这一功能体现在流程步骤之一 `数据挖掘` 中，其意义在于消除数据中最终存在的“噪声”。患者每次来就诊时都会提供临床背景信息，通过他们等待临床诊断流程变得完整、充分，得出许多诊断，或者会迟地做出诊断。特别需要指出的是，在疾病特征描述过程中存在缺失数据的情况，这对于本工作所推崇的技术的训练集来说是很有价值的。


    他进一步提出了一套“应对初级保健中雪崩效应问题的策略”，其中包括：


    1. 了解患者寻求医生护理的主要疾病的呈现症状是至关重要的。这意味着需要对指向诊断结果积极或否的检查结果进行综合分析，以确定在初级医疗中首要关注的常见疾病。这对于
    `分类监督机器学习` 算法的发展至关重要，并且可以为医生提供一个关键的价值来源，帮助其做出初步诊断。


    分类被理解为“为新示例（病例或新患者）分配一个类标签或诊断，而分类是基于软件学习到的内容进行的，它从一组示例（已分类的病例、已标记的或之前的且具有绝对确定性的示例）开始，而那个想要分类的新示例极可能不存在。”


    有时，在流程的初始阶段，医生只能将疾病分为两种可能的类别：紧急或不紧急、心理性或有机感染性或非感染、细菌性或病毒性感染、手术性或非手术性。最重要的是，这些疾病具有一系列后果，即使你不能立即进行诊断。


    加强对策略一中提出的观点的是，自动学习技术可以说，只要拥有来自相关来源的数据集，将非常适用于分类问题。全科医生在每天接待许多患者时，学会了识别体征和症状的模式，并根据他们的学习或经验与记忆中存储的疾病模型进行比较。这种肯定几乎逐字地定义了人工智能中所谓的“基于案例的推理
    (Case Based Reasoning)”，其优势在于软件部分，它不会感到疲劳，不会失去注意力，也不会受外部紧张局的影响，甚至不受情绪影响。


    辅助检查是临床方法的一部分，他们尝试通过检查来验证许多假设，但全科医生每天的大部分时间在家庭问诊中并没有进行检查。这一观点恰恰证明了临床方法具有机器学习技术的支持。以上所有内容证明了本工作的目标：“提供一种通过特定健康列表的易用工具，能够将人工智能（IA）技术应用到支持基于临床方法的日常医疗诊断中。”这是一个不可置信的前提，正如菲德尔·伊拉斯蒂斯奎·杜普伊博士指出的：“医生可以脱离采集病史、诊断、预后和治疗的工作，只有在理解静态诊断只是给病人贴标签时这才是可能的，这是过去的医生已经测试过的，而且如果将诊断理解为人类的创造性、整体性且完整的过程，那么这种情况就不会发生。医生对计算机技术的拒绝是因为他们认为这会剥夺他们的临床经验。计算机和计算将取代人类，必须经过监管和控制并整合到工作中。计算机没有创造力，无法解决与人类价值观相关的问题。”


    ## RISE 算法


    其本质可以简单总结为：每个示例或病例都是一个属性对（值，j）的向量，加上该示例所属的类的规范；属性可以是符号的或数值的。每条规则由背景和类的逻辑结组成，每个前件都是单个属性的条件，并且每个属性都存在于属性中，即某些属性可能不是规则背景的一部分。符号属性的条件采用相等形式
    `i = v`，其中 `i` 是属性，`v` 是其取值之一。数值属性的条件采用区间形式，允许的数值属性为 `v1 <= i <= v2`，其中 `v1` 和
    `v2` 是属性 `i` 的两个合法值。


    如果示例满足规则的所有条款，则该规则覆盖该示例；根据后文描述的距离度量，距离示例越近的规则赢得该示例。RISE 寻找“良好的”规则，从具体到一般，从训练示例本身的组合开始构建第一个规则集。通过选取每条规则寻找同类中最近的示例，如果规则尚未开启（即与规则的距离大于零），则尝试进行泛化以使规则覆盖该示例。如果这种变化（将规则纳入规则集中）对全局准确率产生积极影响，则新规则将替换旧规则加入规则集；反之则不加入。泛化算法在
    Pedro Morais 的博士论文《一种用于概念学习的统一方法 (A Unified Approach to Concept Learning)》中展示，该论文是加利福尼亚大学欧文伯分校的信息与计算科学哲学博士学位论文，1997
    年毕业，作者于 2004 年展示了摘要。

