  trans: "\nTF-IDF 是一种应用于文本的转换，用于获取向量空间中的两个实向量。然后我们可以通过计算任意两个向量的逐元素乘积并除以它们范数的乘积，得到它们的余弦系数。因此，就得到了向量之间角的余弦值。余弦系数是衡量两个非零向量相似性的指标。使用该公式，我们可以计算任何两个文本\
    \ `d1` 和 `d2` 之间的相似性。\n\n`Cosine Similarity (d1, d2) = Dot product (d1, d2) /\
    \ || d1 || * || d2 ||`\n\n这里 `d1`, `d2` 是两个非零向量。\n\n# 聊天机器人训练\n\n在示例中，我们将使用维基百科页面作为文本。复制页面内容并将其放在名为\
    \ `chatbot.txt` 的文本文件中。你可以立即使用其他文本。\n\n### 导入所需的库\n\n```python\nimport nltk\n\
    import numpy as np\nimport random\nimport string # 用于处理标准的 python 字符串\n```\n\n\
    ### 读取数据\n\n让我们读取 `corpus.txt` 文件并将所有文本转换为句子列表和单词列表，以便进一步的预处理。\n\n```python\n\
    f = open ('chatbot.txt', 'r', errors = 'ignore')\nraw = f.read ()\nraw = raw.lower\
    \ () # 转换为小写\n\nnltk.download ('punkt') # 仅限首次使用\nnltk.download ('wordnet') #\
    \ 仅限首次使用\n\nsent_tokens = nltk.sent_tokenize (raw) # 转换为句子列表 \nword_tokens = nltk.word_tokenize\
    \ (raw) # 转换为单词列表\n```\n\n查看 `sent_tokens` 和 `word_tokens` 文件的示例：\n\n```python\n\
    sent_tokens[: 2]\n['a chatbot (also known as a talkbot, chatterbot, bot, im bot,\
    \ interactive agent, or artificial conversational entity) is a computer program\
    \ or an artificial intelligence which conducts a conversation via auditory or\
    \ textual methods.',\n 'such programs are often designed to convincingly simulate\
    \ how a human would behave as a conversational partner, thereby passing the turing\
    \ test.']\n\nword_tokens[: 2]\n['a', 'chatbot', '(', 'also', 'known']\n```\n\n\
    ### 源代码预处理\n\n现在我们定义 `LemTokens` 函数，它接受标记作为输入参数并输出归一化的标记。\n\n```python\nlemmer\
    \ = nltk.stem.WordNetLemmatizer ()\n\n# WordNet 是包含在 NLTK 中的以语义为方向的英语字典。\ndef\
    \ LemTokens (tokens):\n    return [lemmer.lemmatize (token) for token in tokens]\n\
    \nremove_punct_dict = dict ((ord (punct), None) for punct in string.punctuation)\n\
    \ndef LemNormalize (text):\n    return LemTokens (nltk.word_tokenize (text.lower\
    \ (). translate (remove_punct_dict)))\n```\n\n### 关键词选择\n\n定义一个机器人问候副本。如果用户问候机器人，机器人将回复你好。ELIZA\
    \ 使用简单的关键词匹配来处理问候。我们将使用相同的思路。\n\n```python\nGREETING_INPUTS = (\"hello\", \"hi\"\
    , \"greetings\", \"sup\", \"what's up\", \"hey\",)\nGREETING_RESPONSES = [\"hi\"\
    , \"hey\", \"* nods *\", \"hi there\", \"hello\", \"I am glad! You are talking\
    \ to me\"]\n\ndef greeting (sentence):\n    for word in sentence.split ():\n \
    \       if word.lower () in GREETING_INPUTS:\n            return random.choice\
    \ (GREETING_RESPONSES)\n```\n\n### 响应生成\n\n为了针对输入的问题生成机器回答，将使用文本相似性的概念。因此，我们首先导入必要的模块。\n\
    \n从库中导入 TFidf 向量器，将原始文本集转换为 TF-IDF 特性矩阵。\n\n```python\nfrom sklearn.feature_extraction.text\
    \ import TfidfVectorizer\n```\n\n此外，从 scikit 库导入余弦系数模块。\n\n```python\nfrom sklearn.metrics.pairwise\
    \ import cosine_similarity\n```\n\n该模块将用于搜索用户请求中的关键词。这是创建聊天机器人简单的方法。\n\n定义一个响应函数，返回多个可能答案之一。如果查询没有匹配任何关键词，机器人将回答“Sorry!\
    \ I do not understand”。\n\n```python\ndef response (user_response):\n    robo_response\
    \ = ''\n    TfidfVec = TfidfVectorizer (tokenizer = LemNormalize, stop_words =\
    \ 'english')\n    tfidf = TfidfVec.fit_transform (sent_tokens)\n    vals = cosine_similarity\
    \ (tfidf[-1], tfidf)\n    idx = vals.argsort () [0] [-2]\n    flat = vals.flatten\
    \ ()\n    flat.sort ()\n    req_tfidf = flat [-2]\n    if (req_tfidf == 0):\n\
    \        robo_response = robo_response + \"I am sorry! I don't understand you\"\
    \n        return robo_response\n    else:\n        robo_response = robo_response\
    \ + sent_tokens [idx]\n        return robo_response\n```\n\n最后，我们根据对话的开始和结束指定机器人副本，取决于用户的副本。\n\
    \n```python\nflag = True\nprint (\"ROBO: My name is Robo. I will answer your queries\
    \ about Chatbots. If you want to exit, type Bye!\")\n\nwhile (flag == True):\n\
