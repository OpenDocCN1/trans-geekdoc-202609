  trans: "\n很少有人认为深度模型理念将不会证明是有用的。深度表征内部的共享在理论上可以产生指数级的表示优势，在实践中，它也提供了改进的学习系统。构建深度学习系统的通用方法极具吸引且强大：研究人员定义模型架构和顶层损失函数，然后模型的参数和表示在端到端的学习框架中自我组织，以最小化这种损失。在最近的神经机器翻译工作中，我们已经开始看到这种深层系统的威能（Sutskever,\
    \ Vinyals, and Le 2014; Luong et al. 2015）。\n\n智能要求能够通过了解较小的部分来理解更大的事物。特别对于语言而言，理解新颖且复杂的句子关键取决于能够从构成它们的较小部分（单词和多词短语）组合地构建它们的意义。最近，有大量的论文展示了如何通过来自“深度学习”方法的分布式词表示来改进系统，例如\
    \ `word2vec` (Mikolov et al. 2013) 或 `GloVe` (Pennington, Socher, and Manning\
    \ 2014)。然而，这实际上并不是构建深度学习模型，未来的希望在于更多人关注一个强烈的语言学问题：我们是否可以在深度学习系统中构建意义组合函数。\n\n\
    ## 连接计算语言学与深度学习的科学问题\n\n人们鼓励不要陷入仅仅通过使用词向量让性能提高几个百分点的陈规中。更强力的是，我想建议我们或许回到一些有趣的语言学和认知问题，这些问题激发了对无范畴表示和神经网络方法的初衷。\n\
    \n语言中无范畴现象的一个例子是动名词 `V-ing` 形式单词的词性标记（POS），例如 `driving`。这种形式在经典上被描述为在动词形式和名词性动名词之间存在歧义。然而，实际上情况更为复杂，因为\
    \ `V-ing` 形式出现在乔姆斯基（1970）定义的四个核心类别中的任何一个：\n\n![](img/00017.jpeg)\n\n更有趣的是，有证据表明这不仅存在歧义，而且存在混合的名词-动词状态。例如，作为名词的经典语言学测试是与限定词一起出现，而作为动词的经典语言学测试是接直接宾语。然而，众所周知，动名词化可以同时完成这两件事：\n\
    \n1. 没有观察到这一规则，正是我们的诗人所被世界指责的。（Dryden, Essay Dramatick Poesy, 1684, page 310）\n\
    2. 她为生命之黄昏所做的唯一准备，就是收集和转录她可能遇到的各种谜语。（Jane Austen, Emma, 1816）\n3. 困难在于如何将黄金带入埃瑞旺国。（Sam\
    \ Butler, Erewhon Revisited, 1902）\n\n这种现象通常通过短句结构树层级内部的某种类别转换操作来分析，但有充分证据表明这实际上是语言中一种无范畴行为的情况。\n\
    \n事实上，这种结构早期被 Ross (1972) 用作“压缩”（squish）的例子。从历时角度看，`V-ing` 形式显示出动词化不断增加的历史，但在许多时期，它表现出明显的非离散状态。例如，我们在这一领域发现了清晰的分级级判断：\n\
    \n4. Tom 赢得选举是一个大冷门。\n5. 这种一直取弄 John 的必须停止。\n6. 周五没有标记考试。\n7. 停战是出乎意料的。\n\n限定词和动词宾语的各种组合听起来并不好，但仍然比通过派生词缀如\
    \ `-ation` 在名词化之后尝试直接宾语要好得多。Houston (1985, page 320) 显示，将 `V-ing` 形式分配给离散的词性分类（从预测意义上说）不如在解释\
    \ `-ing` 与 `-in’` 的口语交替方面那样成功，这表明“语法范畴存在于连续体上，这些类别之间没有表现出清晰的边界”。\n\n8. [那种刀子（kind\
    \ of knife]] 不怎么用。\n9. 我们 [有点（kind of）]饿。\n\n有趣的是，存在一条通过歧义形式进行重新分析的路径，如下对所示，这暗示了一种形式是如何从另一种形式产生的。\n\
    \n10. [a [kind [of dense rock]]] \n11. [a [[kind of] dense] rock]\n\nTabor (1994)\
    \ 讨论了古英语有 `kind` 但很少或没有 `kind of` 的用法。从中世纪英语开始，为重新分析提供温床的歧义语境开始出现（示例 (13) 中的 1570\
    \ 年例子），随后，出现了明确为委婉修饰语的例子（示例 (14) 中的 1830 年例子）：\n\n12. A nette sent in to the see,\
    \ and alle kind of fishrynge (Wyclif, 1382)\n13. Their finest and best, is a kind\
    \ of course red (True Report, 1570)\n14. I was kind of provoked at the way you\
    \ came up (Mass. 1830)\n\n这是历史性的而非同步性的。可能的孩子学习 `kind/sort of` 的用法。读者注意到我第一段中的某个例子了吗？\n\
    \n15. NLP 就像是深度学习机器中的兔子（kind like a rabbit）（Neil Lawrence, DL workshop panel,\
    \ 2015）\n\nWhitney Tabor 使用一个小小的、已经是深层的循环神经网络模拟了这种演变。他在 1994 年就这样做，利用了在斯坦福与 Dave\
    \ Rumhart 合作的机会。\n\n最近，开始有一些新工作利用分布式表征来建模和解释语言变异与变化。Sagi, Kaufmann, and Clark\
    \ (2011)——实际上使用更传统的潜在语义分析方法生成分布式词表示——展示了分布式表征如何捕捉语义变化：随时间推的范围扩大和缩小。他们研究了一些例子，例如在古英语中\
    \ `deer` 指任何动物，而在中世纪和现代英语中它指的是一个特定的动物族。`dog` 和 `hound` 两个词发生了交换：在中世纪英语中，`hound`\
    \ 用于任何犬类，而现在用于特定的亚种，反之。\n\nKulkarni 等人 (2015) 使用神经词嵌入来建模过去一个世纪 `gay` 等词意义的迁移（利用在线\
    \ Google Books Ngrams 数据库）。在最近的一次 ACL 研讨会上，Kim 等人 (2014) 使用了类似的方法——使用 `word2vec`——观察词义近期的变化。例如，在图\
    \ 1 所示，他们展示了在 2000 年左右，`cell` 一词的意义迅速从接近 `closet`（衣橱）和 `dungeon`（地牢）转变为接近 `phone`（电话）和\
    \ `cordless`（无线）。在这种语境下，单词的意义是所有语义意义的平均值，并根据其使用频率加权。![figure\\_002](img/00019.jpeg)\n\
    \n图 1\n\n`cell` 的意义趋势，通过显示其与其他四个词随时间的余弦相似度来表示（其中 1.0 表示最大相似性，0.0 表示无相似性）。\n\n\
    我们应该为生活在一个 NLP 对机器学习和工业应用问题都如此核心的时代感到兴奋和高兴。\n"
