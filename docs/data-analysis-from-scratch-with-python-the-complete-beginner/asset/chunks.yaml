    为了帮助我们的模型关注有意义的词，我们可以在“词袋”模型的基础上使用 `TF-IDF`（词频-逆文档频率）评分机制。`TF-IDF` 根据词汇在数据集中的稀有程度进行加权，降低那些过于常见且仅增加噪声的词的优先级。以下是使用主成分分析法对我们新视角的投影。


    ![`habrastorage.org/webt/7r/w1/zw/7rw1zwzjbk15mlftvwttgiwyx0e.png`](img/00010.jpeg)


    使用 `TF-IDF` 进行向量表示的可视化。


    我们可以观察到两种颜色之间的分离更加清晰。这表明我们的分类器区分这两组数据应该变得更容易。让我们看看结果有了多大改进。在我们新的向量表示上训练了另一个逻辑回归后，我们得到了
    `76.2%` 的准确率。


    改进非常细微。也许我们的模型甚至开始选择更重要的词了？如果这部分获得的结果变得更好，而且我们没有允许模型“作弊”，那么这种方法就可以被视为一种改进。


    ![`habrastorage.org/webt/\_w/kf/sn/\_wkfsncbbhoxushgyarr8rxgk9g.png`](img/00011.jpeg)


    `TF-IDF`：词的重要性。尽管我们在测试集上的指标仅略有增加，但模型选择的词看起来确实相关得多，我们现在对将该模型应用于与客户交互的真实系统更有信心。


    ## 第 7 步：语义的应用


    ### Word2vec


    我们最新的模型能够“抓取”带有最大意义的词。然而，很可能当我们将其投入生产环境时，它会遇到在训练样本中未发现的词，即使在训练期间见过非常相似的词，也无法准确分类这些推文。


    为了解决这个问题，我们需要捕捉词的语义含义。这意味着对于我们来说，理解“好”和“正面”比“杏”和“大陆”更重要。我们将使用 `Word2Vec` 工具来帮助匹配词义。


    ### 使用预训练结果


    `Word2Vec` 是一种寻找单词连续映射的技术。`Word2Vec` 通过阅读大量文本进行学习，并记住哪些词出现在相似的语文中。在对足够的数据进行训练后，`Word2Vec`
    为字典中的每个词生成一个 `300` 维的向量，其中含义相似的词彼此距离较近。


    词连续向量表示主题论文作者在开放获取中提供了一个此前在大量信息上训练过的模型，我们可以将其用于我们的模型，以引入关于词语义含义的知识。


    ### 层级显示


    为分类器获取句子嵌入的一种快速方法，是对句子中所有词的 `Word2Vec` 评分取平均值。这与之前的“词袋”方法相同，但这次我们只丢失了句子的句法，而保留了语义信息。


    ![`habrastorage.org/webt/xk/ns/ra/xknsraialkgrmqkmcyaas6njfj0.png`](img/00010.jpeg)


    ### Word2Vec 中的句子向量表示


    为分类器获取句子嵌入的一种快速方法，是对句子中所有词的 `Word2Vec` 评分取平均值。这与之前的“词袋”方法相同，但这次我们只丢失了句子的句法，而...


