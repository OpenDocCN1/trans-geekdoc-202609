    # Decision Trees Use cases for decision trees can include the construction of
    knowledge management platforms for customer service, price predictions, and product
    planning.


    An insurance company could use a decision tree when it requires information on
    what type of insurance products and premium adjustments are needed based on potential
    risk, says Ray Johnson, a chief data scientist at the SPR business and technology
    consulting firm. Using overlapping location data with weather-related loss data,
    you can create risk categories based on the claims submitted and the cost amounts.
    Then, you can evaluate new applications for coverage against models to provide
    a risk category and possible financial impact, the executive said.


    ## Random Forests

    A single decision tree must be trained to provide accurate results, the random
    forest algorithm takes a set of randomly created decision trees that base their
    decisions on different sets of attributes and allow them to vote in the most popular
    class.


    Random forests are just versatile tools for finding relationships in data sets
    and are quick to train, says Epstein. For example, unsolicited bulk mail has been
    a problem for a long time, not only for users but also for Internet service providers
    that have to manage the increased load on servers. In response to this problem,
    automated methods have been developed to filter spam from standard email, using
    random forests to quickly and accurately identify unwanted emails, the executive
    said.


    Other uses of random forests include the identification of disease by analyzing
    the patient''s medical records, detecting bank fraud, predicting the volume of
    calls in the call centers and predicting gains or losses through Purchase of a
    particular stock.


    ## Clustering

    Clustering algorithms use techniques such as `K-means`, `mean-shift`, or `expectation-maximation`
    to group data points based on shared or related characteristics, this is an unsupervised
    learning method that can be applied to the classification problems.


    Clustering technique is particularly useful when you need to segment or categorize,
    Schatsky notes. Examples include segmenting customers by different characteristics
    to assign marketing campaigns better, recommending news articles to confident
    readers, and effective law enforcement.


    The clustering is also active for discovering clusters in complex data sets that
    may not be obvious to the human eye. Examples range from the categorization of
    similar documents in a database to the identification of critical crime points
    in crime reports, says Epstein.


    ## Learning Association Rules

    Learning association rules is an unsupervised technique that is used in recommendation
    engines, which seeks relationships between variables.


    This is the technique behind the suggestions of "people who bought X also bought
    Y" at many e-commerce sites, and examples of how it is used are universal.


    A specific use case could be a food specialty retailer that wants to generate
    additional sales, says Johnson. I would use this technique to examine customer
    buying behavior in order to provide cans and special packages for products that
    hold events, sports teams, etc. The association governs the technique that provides
    information that can reveal when and where customers bought the preferred combination
    of products.


    The use of information about past purchases and deadlines allows the company to
    create a rewards program proactively, Johnson says, and offers unique custom offers
    to boost future sales.


    # Intel NLP Architect: Open Source Natural Language Processing Model Library


    Have you noticed that more and more companies are putting a bot widget on their
    site? Chatbots are everywhere today. And this is just one of many examples of
    Natural Language Processing (NLP) and Natural Language Understanding (NLU) technologies.
    The potential of NLP and NLU seems limitless. Now everyone understands that we
    are only at the beginning of a long journey.


    Titans in the IT industry are creating dedicated research departments to explore
    this area. Intel did not stand aside. Recently, Intel AI Lab released a product
    called `NLP Architect`. This is an open source library designed to serve as the
    basis for further research and collaboration of developers from around the world.


    ## NLP Architect

    A team of NLP researchers and developers from Intel AI Lab is studying the current
    architecture of deep neural networks and methods for processing and understanding
    text. The result of their work was a set of tools that are interesting from both
    a theoretical and an applied point of view.


    Here''s what the current version of `NLP Architect` has:


    *   Models that extract the linguistic characteristics of text: for example, a
    parser (`BIST`) and an algorithm for extracting nouns (`noun phrases`);

    *   State-of-the-art models for understanding the language: for example, determination
    of user intent (`intent extraction`), recognition of named entities (named entity
    recognition`, `NER`);

    *   Modules for semantic analysis: for example, collocations, the most probable
    meaning of a word, vector representations of named groups (`NP2V`);

    *   Building blocks for creating conversational intelligence: for example, the
    basis for creating chatbots, including a dialogue support system, a sequence analyzer
    (`sequence chunker`), a system for determining the user''s intent;

    *   Examples of using deep end-to-end neural networks with a new architecture:
    for example, question-answer systems, text reading systems (machine reading comprehension).

    *   For all of the above models, there are examples of learning and prediction
    processes. Moreover, the Intel team added scripts to solve typical tasks that
    arise when implementing such models - pipelines for data processing and utilities
    that are often used in NLP.


    The library consists of separate modules, which simplifies integration. A general
    view of the `NLP Architect` framework is shown in the diagram below.


    ![NLP Archtect](images/00001.jpeg)


    ## NLP Architect Framework

    Components for NLP / NLU


    Now let''s take a closer look at some of the modules to better understand what
    is being discussed.


    ### Offer analyzer

    Analysis of sentences (`sequence chunking`) is one of the basic tasks of word
    processing, which consists in dividing sentences into syntactically related parts.
    For example, a sentence “Little Sasha walked along the highway” can be divided
    into four parts: the nouns “Little Sasha” and “highway”, the verb group “walked”
    and the prepositional group “by”.


    The analyzer of sentences from `NLP Architect` can build suitable neural network
    architecture for different types of input data: tokens, labels of parts of speech,
    vector representations, symbolic signs.


    ### Semantic segmentation of noun groups

    A noun phrase consists of the main member - a noun or pronoun - and several dependent
    qualifying members. To simplify, you can divide nouns into two types:


    *   With descriptive structure: dependent members do not significantly affect
    the semantics of the main member (for example, “sea water”);

    *   With collocation structure: dependent members significantly change the meaning
    of the main term (for example, “guinea pig”).


    To determine the type of name group, a multilayer perceptron is trained. This
    model is used in the semantic sentence segmentation algorithm. As a result of
    her work, nouns of the first type break up into several semantic elements, and
    nouns of the second type remain unified.


    The parser performs grammar analysis of sentences, examining the relationship
    between words in sentences and highlighting things like direct additions and predicates.
    `NLP Architect` includes a graph-based dependency parser that uses `BiLSTM` to
    extract features.

