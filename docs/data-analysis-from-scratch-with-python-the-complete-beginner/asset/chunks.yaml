  trans: '


    DDoS 指的是“分布式拒绝服务（distributed denial of service）……”它是一种攻击手段，通过外部系统抑制目标系统的带宽。其目的是使目标服务无法使用。


    它通常被认为是黑客试图窃取信息的工具，但这并非完全正确。


    ## 什么是 QoS？


    QoS 代表“服务质量（quality of service）”……这组技术通过限制丢包数量来减少网络延迟和拥塞，并提高服务的可靠性。此外，它还为数据传输设置了优先级。


    QoS 现在比以往任何时候都更加重要。如果一个程序不需要立即访问网络，它将获得较低的 QoS 评分。而在其他数据库中需要低延迟的程序将获得较高的 QoS 评分。


    ## 10. 使用编程解决问题


    某些编程面试将基于某种实际、实践或解决问题的演示，以观察你如何创建和组合主要及次要编程概念。请记住，对于任何类型的程序员来说，最重要的前提是具备逻辑思维的能力。


    以下是一个随机选择的问题示例：


    如果你有一组 52 个数字（例如一副扑克牌），选择一个随机数字是很的。你的任务是创建一个 1 到 52 之间的数字，并将其作为你索引的索引。换句话说，获取一个所有数字或牌被选中概率相等的系统，从中从系列或牌组中随机选择一个数字或牌。


    这里有一个更困难的变体：


    想象你无法同时看到或隐藏整个集合。也就是说，没有说明总共有多少个数字，并且每次只显示一个数字。你无法存储所有显示过的数字，并且只有在你看到集合中的最后一个数字时才会被通知。


    如果你被允许最多存储两个数字，能否一次回答一个答案或同时选择一个随机数？


    以下是解决此问题的方法：


    你只需要记录两个数字：到目前看到的总数，以及你从数字流中选择的当前候选响应（如果它在此时结束的话）。


    当第一个数字显示时，你拥有一个。你的候选响应必须是看到的第一个且唯一的数字，因为只有一个可能。如果显示第二个数字，你将获得一个新的候选者，这两个候选者中有一个可能。同样，第三个数字将是新的候选响应，并且有第三种可能。


    因此，每个新数字都会产生一个从一点到该点观测数据点数量 `N` 之间的随机数，如所示。如果你的随机数等于 `N`，则仅保留给你的数字作为新答案。否则，使用相同的逻辑存储之前保存的答案。


    每当你看到一个新的数据点时，都要执行此选择更新。当数据流结束时，记录的值就是正确响应，可以从所有看到的数字中等概率选择。概率是 `1/N`，无论流停止之前经过了多久。


    以下是你将要处理的其他问题：


    - 编写一种算法，在文本选择中查找特定单词的实例。

    - 编写一个程序在特定范围内生成随机数。

    - 如何检查一个字符串是否只包含数字？

    - 给定两个字符串，找到将字符串 1 转换为字符串 2 所需的最小更改次数。

    - 如何统计给定字符串中的多个元音和辅音？

    - 给定一个每个帧都有数值的网格，如何编写解决方案找到从网格一侧到另一侧的最值路径？


    ## 准备好参加编程面试了吗？


    我希望你已经准备好参加编程面试和梦以求的编程工作。否则，你会对一些在线指南、教程、培训材料和完整编码课程的质量（包括 Codeforces、SphereOnline、HackerRank
    等）感到惊讶。


    你拥有进入这个令人兴奋的领域所需的一切，在机器人创新、机器学习、无线网络领域，考虑到许多事物的重要性和需求，你拥有世界上所有的动力。


    希望主要编程概念的概述对这一令人兴奋的职业有所帮助。你还在等什么？


    # 第 4 章


    ## 什么是数据分析？它为什么重要？


    有多种数据分析方法，包括数据挖掘、文本分析、商业智能和数据可视化。


    数据分析是使用分析和统计工具评估数据，以发现有用信息并帮助业务决策的过程。有许多数据分析方法，包括数据挖掘、文本分析、商业智能和数据可视化。


    ## 如何进行数据分析？


    数据分析是推导出商业智能的大过程的一部分。该过程包含以下一个或多个步骤：


    * **定义目标**：每项调查都应该从一组清晰定义的业务目标开始。在此过程中做出的许多决策取决于研究目标设定得有多清晰。

    * **提出问题**：尝试在问题领域提出一个问题。例如：红色运动跑车的事故发生比其他车频繁吗？

    * **数据收集**：应该从相关来源收集与问题相关的数据。在上面的示例中，可以从多种来源收集数据，包括：DMV 或警察事故报告、保险理赔和录取信息。当使用调查收集数据时，需要向受访者提交问卷。问题必须根据所使用的统计方法进行适当设计。

    * **数据清洗**：原始数据可以以几种不同的格式收集。收集的数据必须经过清洗和转换，以便数据分析工具可以导入。对于我们的示例，我们可以接收 DMV 事故报告（如文本文件）、来自关系数据库的保险理赔和如
    API 的录取信息。数据分析师必须汇总这些不同的数据形式，并将其转换为适用于分析工具的形式。

    * **数据分析**：这一步是将纯化和汇总的数据导入分析工具。这些工具允许你探索数据，发现其中的模式并提问和回答“如果”的问题。这是通过正确使用统计方法对收集的数据产生意义的过程。

    * **得出结论和预测**：在充分分析后，这一步可以从数据中得出结论并做出适当的预测。这些结论和预测可以总结在提供给用户的报告中。


    现在，让我们查看数据分析方法。


    数据挖掘是一种通过某些方法在大数据集中发现模式的数据分析方法，方法包括如何成为数据科学如何成为数据科学。数据科学从 2007 年的新开始发展成为当今最受青的学科之一。但数据科学家是做什么的？你如何进入这个领域？阅读更多关于统计学、人工智能、机器学习和数据库的内容。目标是将原始数据转化为可理解的业务信息。这些可能包括识别数据组（也称为类分析）或识别数据组之间的异常和依赖关系。


    **数据挖掘的应用：**


    * 异常检测可以处理大量数据（大数据）并自动识别异常情况，可能排除决策或进行欺诈检测（例如银行欺诈）。

    * 学习客户习惯。可以使用机器学习技术对客户习惯建模并确定经常购买的物品。

    * 聚类可以识别数据中以前未知的组。


