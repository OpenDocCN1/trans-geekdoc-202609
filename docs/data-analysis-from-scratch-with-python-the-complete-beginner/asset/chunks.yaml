- fmt: "\nChatbot is a program that finds out the needs of users, and then helps to\
    \ satisfy them (money transaction, hotel reservation, preparation of documents).\
    \ Today, almost every company has a chatbot for interacting with users. Some ways\
    \ to use chat bots:\n\n- Providing flight information;\n- Providing users with\
    \ access to information about their finances;\n- Support.\n\nThe possibilities\
    \ are endless.\n\nThe history of chatbots dates back to 1966 when Joseph Weizenbaum\
    \ developed the `ELIZA` computer program. The program imitates the therapist’s\
    \ speech style and consists of only 200 lines of code. You can still chat with\
    \ Eliza on the site.\n\n## How does the chatbot work?\n\nThere are two types of\
    \ bots: working according to the rules and self-learning.\n\nA bot of the first\
    \ type answers questions based on some rules with which it is trained. Rules can\
    \ be either simple or very complex. Bots can handle simple requests, but they\
    \ cannot handle complex ones.\n\nSelf-learning bots are created using machine-learning-based\
    \ methods and are definitely more efficient than bots of the first type. There\
    \ are two types of self-learning bots: search and generative.\n\nThe search bots\
    \ use heuristics to select an answer from a predefined library of replicas. Such\
    \ chatbots use the text of the message and the dialogue context to select an answer\
    \ from a predefined list. The context includes the current position in the dialog\
    \ tree, all previous messages and previously saved variables (for example, `username`).\
    \ Heuristics for choosing an answer can be designed in different ways: from conditional\
    \ logic “either-or” to machine classifiers.\n\nGenerative bots can independently\
    \ create answers and do not always respond with one of the predefined options.\
    \ This makes them intelligent, since such bots learn every word in the request\
    \ and generate a response.\n\n## Creating A Bot In Python\n\nLet's assume that\
    \ you know how to use the `scikit` and `NLTK` libraries. However, if you are new\
    \ to natural language processing (NLP), you can still read and then study the\
    \ relevant literature.\n\n### Natural Language Processing (NLP)\n\nNatural language\
    \ processing is a field of research that studies the interaction between human\
    \ language and computer. NLP is based on a synthesis of computer science, the\
    \ artificial intelligence, and computational linguistics. NLP is a method for\
    \ computers to analyze, understand, and make sense of human language in a smart\
    \ and useful way.\n\n### A brief introduction to NLKT\n\n`NLTK` (Natural Language\
    \ Toolkit) is a platform for creating Python programs for working with natural\
    \ speech. `NLKT` provides easy-to-use interfaces for more than 50 corporations\
    \ and linguistic resources, such as `WordNet`, as well as a set of libraries for\
    \ word processing for classification, tokenization, generation, tagging, parsing\
    \ and understanding of semantics, and creating an NLP library wrapper for commercial\
    \ use.\n\nThe book `Natural Language Processing with Python` is a practical introduction\
    \ to programming for language processing.\n\n#### Download and install NLTK\n\n\
    Install NLTK: run `pip install nltk`.\n\nTest installation: run `python`, and\
    \ then type `import nltk`.\n\n#### Install NLTK Packages\n\nImport `NLTK` and\
    \ run `nltk.download()`. This will open the NLTK bootloader, where you can choose\
    \ the version of code and model to download. You can download all packages at\
    \ once.\n\n## Text preprocessing with NLTK\n\nThe main problem with the data is\
    \ that it is presented in text format. To solve problems, machine learning algorithms\
    \ require a certain vector of properties. Therefore, before you start creating\
    \ a project on NLP, you need to pre-process it. Text pre-processing includes:\n\
    \n- Convert letters to uppercase or lowercase so that the algorithm does not process\
    \ the same words repeatedly.\n- Tokenization. Tokenization is a term used to in\
    \ the process of converting ordinary text strings to a list of tokens, i.e. words.\
    \ An offer tokenizer is used to compile a list of offers. The word tokenizer makes\
    \ a list of words. The `NLTK` package includes the pre-trained `Punkt` tokenizer\
    \ for English.\n- Removing noise, that is, anything that is not a number or letter;\n\
    - Delete stop words. Sometimes some extremely common words that are considered\
    \ to be of little importance for forming an answer to a user's question are completely\
    \ excluded from the dictionary. These words are called stop words (interjections,\
    \ articles, some introductory words);\n- Stemming: Bringing the word to the root\
    \ meaning. For example, if we need to stamp the words “stem”, “stemming”, “stemmed”\
    \ and “stemization”, the result will be one word - “stem”.\n- Lemmatization. Lemmatization\
    \ is a slightly different method from stemming. The main difference between the\
    \ two is that stemming often creates non-existent words, while a lemma is a real\
    \ word. Thus, your original topic, that is, the word that is obtained after stemming,\
    \ cannot always be found in the dictionary, and the lemma can. An example of a\
    \ lemmatization: “run” is the basis for the words “running” or “ran”, and “better”\
    \ and “good” are in the same lemma and therefore are considered the same.\n\n\
    ### A set of words\n\nAfter the first stage of preliminary processing, you need\
    \ to convert the text into a vector (or array) of numbers. A “set of words” is\
    \ a representation of a text describing the presence of words in a text. A “set\
    \ of words” consists of:\n\n- Dictionary of famous words;\n- Frequencies with\
    \ which each word occurs in the text.\n\nWhy is the word set used? This is due\
    \ to the fact that information about the order or structure of words in the text\
    \ is discarded, and the model takes into account only how often certain words\
    \ appear in the text, but not where they are located.\n\nThe idea of a “set of\
    \ words” is that texts are similar in content if they include similar words. In\
    \ addition, you can learn something about the content of the text only by a set\
    \ of words.\n\nFor example, if the dictionary contains the words `{Learning, is,\
    \ the, not, great}` and we want to compose the sentence “Learning is great”, we\
    \ get the vector `(1, 1, 0, 0, 1)`.\n\n## TF-IDF Method\n\nThe problem with the\
    \ “set of words” is that frequently encountered words that do not contain information\
    \ can dominate the text. Also, a “set of words” assigns great importance to long\
    \ texts compared to short ones.\n\nOne approach to solving these problems is to\
    \ calculate the frequency of occurrence of a word not in one text, but in all\
    \ at once. Due to this, the contribution, for example, of the articles “a” and\
    \ “the” will be leveled. This approach is called `TF-IDF` (Term Frequency-Inverse\
    \ Document Frequency) and consists of two stages:\n\n- `TF`: calculation of the\
    \ frequency of occurrence of a word in one text\n  `TF = (The number of times\
    \ the word \"t\" appears in the text) / (The number of words in the text)` own-\
    \ `IDF`: calculating how rarely a word is found in all texts\n  `IDF = 1 + log\
    \ (N / n)`, where `N` is the total number of texts, `n` is in how many texts there\
    \ is `\"t\"`\n\n`TF-IDF` is the weight often used for information processing and\
    \ text mining. It is a statistical measure used to assess the importance of a\
    \ word for text in a set of texts.\n\n### Example\n\nConsider a text containing\
    \ 100 words in which the word “phone” appears 5 times. The `TF` parameter for\
    \ the word “telephone” is `(5/100) = 0.05`.\n\nNow suppose we have 10 million\
    \ documents, and the word phone appears in a thousand of them. The coefficient\
    \ is calculated as `1 + log (10,000,000/1,000) = 4`. Thus, `TD-IDF` is `0.05 *\
    \ 4 = 0.20`.\n\n`TF-IDF` can be implemented in `scikit` like this:\n\n```python\n\
    from sklearn.feature_extraction.text import TfidfVectorizer\n```\n\nOtiai coefficient\n"
