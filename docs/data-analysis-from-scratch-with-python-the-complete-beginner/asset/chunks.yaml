    Machine learning allows an unprecedented understanding of complex data sets, which
    is giving it a growing role in our society in general and in cognitive neuroscience
    in particular. These applications have been an exciting advance in the study of
    basic questions about our cognitive system, as well as in the diagnosis of some
    important diseases that affect this system. Despite the novelty of these works,
    the flexibility of machine learning allows us to predict that the most relevant
    contributions of machine learning are yet to come.


    Machine learning (in English) refers to the subfield within computer science specialized
    in the recognition of complex patterns in data sets. Unlike classical programming,
    in which a program executes the same (more or less complex) operation over and
    over again, the main feature of machine learning is that its programs manage to
    extract autonomously (that is, without being specifically programmed for this)
    relevant information in the data being processed. This information allows the
    program to “learn”, that is, to improve in its execution of the task for which
    it had been programmed (Turing, 1950). By developing sophisticated algorithms
    (which can be understood as "models"), these approaches allow us to identify invisible
    relationships for the human eye. This type of algorithms interacts with us in
    our day to day when, for example, the camera of our mobile recognizes a face or
    when we use an automatic translation application. In this sense, part of the success
    of these tools is due to their extensive field of action: from systems that detect
    mutations in our DNA (Libbrecht and Noble, 2015) to "big data", which identifies
    patterns in huge data sets about, for example, different segments of our society
    (Boyd and Crawford, 2012). As expected, cognitive sciences have not been immune
    to the development of these tools. A simple query of the terms "machine learning"
    and "brain" in an article repository (PubMed; date of consultation:


    ### But how does machine learning work in practice? To answer this question, it
    may be beneficial to understand what conceptual difference, within cognitive neuroscience,
    these analyzes make for more classical approaches.


    Imagine that the objective of our study is to compare the image processing of
    dogs and cats in two brain regions (region X and region Y). For each of these
    regions we obtain a stimulus activation pattern presented (in the figure, each
    square of the pattern represents activation [black = activated; white = deactivated]
    in a voxel [volumetric unit used in magnetic resonance imaging]). Following the
    logic of the classic analyzes, we would proceed to average the activity along
    these voxels. In all the patterns presented, there are 3 voxels activated and
    3 deactivated. The average, therefore, would be the same for both animals in the
    two regions, suggesting that they are similarly involved in the processing of
    dogs and cats. However, we can observe that,


    Although in this example the difference jumps to the naked eye, this type of observation
    seems complicated when what we have before us is a larger set of data. It is here
    that researchers have used machine learning techniques to detect, among all the
    complexity of our data, patterns associated with different representations. Basically,
    the operation of these techniques consists in training an algorithm to differentiate
    two classes (in our case, dogs and cats) by presenting patterns associated with
    both categories (yellow and blue dots in the figure). In this way, the algorithm
    learns what rule to use to separate copies of each class (in this example, a diagonal
    line). The key step (“test”) consists in the presentation of new unlabeled copies,
    in order to check the accuracy of the algorithm when assigning each copy to the
    corresponding class. In this way, when the activity of a cerebral zone allows
    classifying the specimens of two different categories above the level of chance,
    we will assume that this zone is differentially representing these categories.


    ### How important are these assumptions in cognitive neuroscience? While classical
    techniques allowed us to detect which areas seemed to be involved in certain processes,
    it was not possible to understand what representations were being encoded in those
    regions. Thus, for example, when activating the prefrontal cortex during an attention
    task, machine learning allows us to study whether this activation underlies non-specific
    control processes (in which different categories would be similarly represented)
    or, on the contrary , to the differential coding of relevant contents for the
    task (Haynes, 2015).


    The application of machine learning in more clinical contexts is especially exciting.
    For example, several studies have shown how, from structural images of the brain,
    it is possible to detect if a person with mild cognitive disorder (TCL) will develop
    in the future an Alzheimer''s type dementia (Moradi, Pepe, Gaser, Huttunen and
    Tohka, 2015 ). In this study, the researchers took advantage of one of the commented
    qualities of machine learning, the extraction of significant regularities in complex
    data sets. Specifically, they “fed” the classifier with three sources of information:
    images of the structural state of the brain, scores on different cognitive skills
    questionnaires and the age of each participant, all for patients with TCL who
    subsequently developed Alzheimer''s disease, as well as for patients with TCL
    who did not develop the disease (in our previous example, this would correspond
    to the different blue dots). The results of this study showed that the algorithm
    could differentiate with 80% accuracy the two groups of patients only using brain
    images and that this percentage increased to 90% when all sources of information
    were combined. Crucially, this type of results allows the diagnosis to be advanced
    between 1 and 3 years compared to other available tools, which is a crucial advantage
    for treatment


    ## Machine learning techniques at the service of Energy Efficiency in the digital
    home


    The efficient use of resources is a universal challenge of today''s society and
    this is reflected by the European Commission in its Roadmap. In the last decade,
    great advances have taken place in this field that has enhanced the concepts of
    Smart Network and Smart City.


    The generalization of the use of smart meters and sensors of different types in
    the domestic environment, allows to easily and affordably extracting consumption
    data, brightness, etc. Be part of the idea of learning from such data to extract
    value from them. The knowledge of the user''s consumption habits and their environment
    will allow carrying out actions that will help improve energy efficiency.

    '
