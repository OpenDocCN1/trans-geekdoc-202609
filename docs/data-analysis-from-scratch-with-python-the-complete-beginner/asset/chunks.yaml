    The desire to increase understanding of the past, present and future encourages
    continued progress in the field of data analysis. These developments are necessary
    for situations where we cannot agree on solving simple problems. In the business
    world, there are few such as `yasal laws of nature` that will tell precisely what
    will happen. To achieve this high level of understanding, businesses need to capture
    and analyze data using advanced techniques, which brings us to data science.


    # Data Science


    Data science is the pioneer of data analytics. It is the process of testing, evaluating,
    and testing new data analytics techniques and creating new ways to implement them.
    As its name implies, data science is in essence an application that follows soundly
    based approaches to scientific research. Therefore, data scientists try new algorithms
    to provide insight and understanding, and measure the usefulness of these approaches
    and demonstrate the accuracy of the results. If approaches are considered generally
    useful, they are more widely known and contribute to a growing set of data analysis
    tools.


    Therefore, data analytics should be used in every business activity, but as companies
    embrace digital transformation, the analytical need will increase. Businesses
    should continuously advance their analytical capabilities as they do this transformation.
    One way to get this done is to hire data scientists. Powerful enterprise data
    cultures should include data scientists who are constantly working to enhance
    their capabilities while working to enable larger business staff to use mature
    and proven analytical tools.


    # Data Engineering


    It is an indispensable element for data engineering, data analysis and data science,
    although it does not draw major titles. Simply put, data engineering makes data
    useful. Converts structured, unstructured, and the semi-structured data from various
    systems and silos into useful, consistent data collections that applications and
    algorithms can gain insights and value.


    Data engineering involves the task of cleaning up data sets - often hosting a
    large amount of work when working with data from many different data sources and
    / or missing values, errors, and even biases. For example, if you run analytics
    on recent home sales, you may want to correct or remove any home records with
    zero sales prices. This avoids your results when erroneous price data is incorporated
    into simple analytics such as the average house price, so it is better for the
    data engineer to try to remove it from the dataset or to correct it if it''s possible.
    Such data errors can have hidden influence in more complex data analysis, which
    may not be easily visible in the results. However, they may have serious problems
    when using results.


    Although you have heard the term more often in recent years, there is nothing
    new about data engineering. Today, however, the need for data engineering is growing,
    as organizations are trying to consolidate, improve, reformat, and clean up a
    variety of data from a growing source. This is often required for advanced data
    analytics applications, including machine learning and deep learning. Data engineers
    should delete bad data, eliminate gaps, and ensure that data does not prejudice
    the results.


    # Artificial Intelligence


    Artificial intelligence refers to computer systems that are capable of understanding
    what classifications and decisions that normally require human intelligence should
    make decisions. Common use cases for AI are image recognition and classification,
    and speech recognition and language translation. Even though you hear people just
    talking about AI, it''s actually been with us since the 1950s. Since the advent
    of computers, people have been thinking that machines can be programmed to use
    people''s way of thinking.


    Over the years, artificial intelligence there has been different approaches to
    making computers good or better. A few decades ago, some achievements were expert
    systems. These systems monitor pre-programmed sets of rules created by humans
    to perform tasks independently of people. For example, we have all experienced
    specialist systems in the form of automatic answering systems, as we are likely
    to interact when we call a customer service desk and you need to review button
    options and menu options. (Many of them are now being redesigned using natural
    language processing, based on deep learning to become more detailed, more flexible
    and effective, and less frustrating as natural language processing becomes better
    over time.9


    More recently, an approach named machine learning has become a preferred method
    of realizing AI. A subset of machine learning, known as the deep learning, has
    been shown to be highly effective when there is enough data to train models in
    specific problem types and workloads. Therefore, a wider level of AI; machine
    learning and deep learning are two approaches that make today’s AI effective applications
    possible.


    # Machine Learning and Deep Learning


    Machine learning is an AI subdomain with systems that provide the ability to learn
    from time to time and improve over time without explicit programming. Machine
    learning algorithms use data to create and develop rules. The computer then decides
    how to respond based on what they have learned from the data. The key here is
    to allow the data to guide the development of rules.


    Machine learning techniques can use a variety of data types, including unstructured
    or semi-structured data, to help generate understanding that leads to system-generated
    actions and decisions.


    Consider a simple example; classic machine learning You can give a system a set
    of features that are common to cats in photographs of various animal species.
    You can then allow the system to sort through databases full of animal photographs
    and find out which combinations of human-derived features identify all cats in
    the mix. In this process, the machine learning system becomes better and better
    as we learn new things from experience with data.


    Deep learning is machine learning based on a deep hierarchy of interconnected
    “neural network” layers, capable of learning key “features den” from the data
    provided to the system. The deep learning technique takes a lot of data and determines
    the common rules and characteristics associated with the data. As with classical
    machine learning, the data guides the education of the deep learning model.


    Let''s expand our cat example. If you give a profound learning system a sufficient
    amount of cat image, the system - alone - is a cat; identify features that make
    a cat such as eyes, ears, whiskers and tail-related features. This learning ability
    goes beyond classical machine learning, because in this case you don''t have to
    tell the system which features to look for. It solves this on its own.


    # Why is this important?


    We all benefit from the AI in almost every part of our lives. Did you use Google
    today to search the Internet? You took advantage of AI. Have you used a credit
    card recently? You took advantage of AI programs that authenticate user identities
    and potentially stop fraudulent transactions. Have you come across online stores
    that offer personalized recommendations for the products you''re looking at? This
    is AI.


    AI changes the basic rules for decision-making in the organization. Machine learning
    and deep learning techniques, for example; it enables the processing of data that
    managers obtain from many sources such as social media sites, customer information
    systems and e-commerce sites. Decision makers can then adapt their product development,
    sales and marketing strategies accordingly. It is important to emphasize that

