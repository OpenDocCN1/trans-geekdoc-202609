    分类用于将数据项自动分类到预定义位置中。一个常见的例子是将电子邮件消息分类为“垃圾邮件”或“非垃圾邮件”，并让系统通过用户学习。


    # 文本分析


    文本分析是从文本中提取有用信息的过程。它通过处理非结构化文本信息，并在 Excel 中通过文本操作提取有意义的数值存储来实现。在 Excel 中通过文本操作节省时间可以处理数字，也能同样地处理字符。本教程将向你如何在电子表格中分析、转换、替换和编辑文本。这些基础原因允许你执行复杂的转换。从信息中读取更多索引，并使信息适用于统计和机器学习算法的进一步处理。


    - 文本提取过程包括以下一个或多个步骤：

    - 从各种来源（包括网络、文件系统、数据库等）收集信息。

    - 语言分析，包括自然语言处理。

    - 模式识别（例如：电话号码、电子邮件地址等的识别）。

    - 从文本中提取摘要信息，例如单词的相对频率、文档之间的相似性等。


    ## 文本分析程序示例：


    - 开放式调查响应的分析。这些研究是探索性的，包含与问题主题相关的开放式问题。受访者可以表达自己的观点，而不限于特定的响应格式。

    - 对电子邮件、文档等进行分析以过滤“垃圾”。这还包括将消息自动分类到预定义的箱体中以路由到各个部门。

    - 通过查看竞争对手的网站进行调查。这可以用于获取有关对手活动的信息。

    - 可以处理入侵检测日志的安全应用程序。


    # 商务智能


    如何使用 Cortana 通过 Power BI 分析数据。你渴望简化数据分析吗？通过此指南从 Cortana 获取快速答案。更多将数据转换为用于业务目的可用智能，并可用于组织的战略和战术决策过程。它允许人们从收集的数据中研究趋势并从中得出洞察。


    今天使用的商务智能示例：


    - 组织的运营决策，例如产品投放和定价。

    - 识别新市场，评估产品需求以及对不同市场细分的适用性。

    - 预算和滚动预测。

    - 使用热力图、透视表和地理映射等可视化工具。


    # 数据可视化


    使用 Google Fusion Tables 立即可视化数据和信息。无论你是在编写工作报告还是只是想在博客上以图表形式表示信息，Google Fusion
    Tables 都能提供帮助。Google Fusion 实际上是嵌入在……中的一个功能。更多指的是数据的视觉化表示。出于数据分析的目的，它意味着使用统计、概率、透视表和其他制品来视觉化呈现数据。它使复杂的数据变得更易理解和更有用。


    环境中的许多传感器产生了日益增加的数据（被称为“物联网”或“IOT”）。这些数据（称为“大数据”）在理解方面带来了挑战，可以通过使用数据可视化工具来缓解。数据可视化用于以下应用：


    - 从原始 IOT 数据中提取摘要数据。

    - 使用条形图代表多个季度的销售业绩。

    - 直方图通过将区域划分为箱（bins），显示变量（如收入）的分布。


    # 回顾中的数据分析


    数据分析使用统计工具对数据进行评估以寻找有用信息。为此目的使用了多种方法，包括数据挖掘、文本分析、商务智能和数据可视化。


    ## 用于医学诊断自动学习技术应用的软件


    目标是为健康专专家提供一种易于使用的工具，允许应用人工智能（AI）技术来支持基于临床方法的医学诊断。诊断支持是国际上引用最多的 AI 应用之一，特别是机器学习的分支——监督分类。`ARISE`
    软件实现了一种基于博士论文主要结果的分类算法。它提出了 `RISE` 算法（英文缩写为“从示例集中归纳规则”），它统一了规则归纳学习范式和基于案例学习范式的最佳理念，克服了两者各自所面临的局限性。实验结果使其处于最先进算法中的优越地位。`ARISE`
    对原始算法进行了修改，防止了其应用中的缺陷。与国际可用测试训练集的进行的实验表明，`ARISE` 保留了分类准确率（最理想的质量），且处理速度的轻微下降是可以接受的。与在古巴使用的、实现其他分类算法的外国软件相比，它们在效率和不需要用户专业知识的界面上胜过后者，提供了从创建训练集到单个案例或组组案例分类（诊断）的功能。


