- fmt: '

    To help our model focus on meaningful words, we can use `TF-IDF` (Term Frequency,
    Inverse Document Frequency) scoring on top of our “word bag” model. `TF-IDF` weighs
    based on how rare they are in our dataset, lowering in priority words that are
    too common and just add noise. The following is a projection of the principal
    component method to evaluate our new view.


    ![https://habrastorage.org/webt/7r/w1/zw/7rw1zwzjbk15mlftvwttgiwyx0e.png](images/00010.jpeg)


    Visualization of vector representation using `TF-IDF`.


    We can observe a clearer separation between the two colors. This indicates that
    it should become easier for our classifier to separate both groups. Let''s see
    how our results improve. Having trained another logistic regression in our new
    vector representations, we get an accuracy of `76.2%`.


    Very slight improvement. Maybe our model even began to choose more important words?
    If the result obtained in this part has become better, and we do not allow the
    model to “cheat”, then this approach can be considered an improvement.


    ![https://habrastorage.org/webt/\_w/kf/sn/\_wkfsncbbhoxushgyarr8rxgk9g.png](images/00011.jpeg)


    `TF-IDF`: Significance of Words. The words chosen by the model really look much
    more relevant despite the fact that the metrics on our test set have increased
    very slightly, we now have much more confidence in using the model in a real system
    that will interact with customers.


    ## Step 7. Application of semantics


    ### Word2vec


    Our latest model was able to “grab” the words that carry the greatest meaning.
    However, most likely, when we release her in production, she will encounter words
    that were not found in the training sample and will not be able to accurately
    classify these tweets, even if she saw very similar words during the training.


    To solve this problem, we need to capture the semantic (semantic) meaning of words.
    this means that it is important for us to understand that the words “good” and
    “positive” are closer to each other than the words “apricot” and “continent”.
    We will use the `Word2Vec` tool to help us match word meanings.


    ### Using the results of pre-training


    `Word2Vec` is a technique for finding continuous mappings for words. `Word2Vec`
    learns by reading a huge amount of text, and then remembering which word appears
    in similar contexts. After training on enough data, `Word2Vec` generates a vector
    of `300` dimensions for each word in the dictionary, in which words with a similar
    meaning are located closer to each other.


    The authors of the publication on the topic of continuous vector representations
    of words laid out in open access a model that was previously trained on a very
    large amount of information, and we can use it in our model to bring knowledge
    about the semantic meaning of words.


    ### Offer Level Display


    A quick way to get sentence attachments for our classifier is to average `Word2Vec`
    ratings for all words in our sentence. This is the same approach as with the “bag
    of words” earlier, but this time we only lose the syntax of our sentence, while
    preserving the semantic (semantic) information.


    ![https://habrastorage.org/webt/xk/ns/ra/xknsraialkgrmqkmcyaas6njfj0.png](images/00010.jpeg)


    ### Vector representations of sentences in Word2Vec


    A quick way to get sentence attachments for our classifier is to average `Word2Vec`
