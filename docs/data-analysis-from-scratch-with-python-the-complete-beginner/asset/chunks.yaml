- fmt: "\nThe Named Entity Recognizer (`NER`) identifies certain words or combinations\
    \ of words in a text that belong to a certain class of interest to us. Examples\
    \ of entities include names, numbers, places, currencies, dates, organizations.\
    \ Sometimes entities can be quite easily distinguished with the help of such features\
    \ as the form of words, the presence of a word in a certain dictionary, part of\
    \ speech. However, quite often these signs are not known to us or even exist.\
    \ In such cases, in order to determine whether a word or phrase is an entity,\
    \ it is necessary to analyze its context.\n\nThe model for `NER` in `NLP Architect`\
    \ is based on a bidirectional `LSTM` network and `CRF` classifier. A high-level\
    \ review of the model is presented below.\n\n![High Level Review of the NER Model](images/00002.jpeg)\n\
    \n High Level Review of the NER Model\n\nThe user intent determination algorithm\
    \ solves the problem of understanding the language. Its purpose is to understand\
    \ what kind of action is discussed in the text, and to identify all parties involved.\
    \ For example, for a sentence\n\n“Siri, please remind me to pick up things from\
    \ the laundry on the way home.”\n\nthe algorithm determines the action (`remind`),\
    \ who should perform this action (`Siri`), who asks to perform this action (`I`)\
    \ and the object of the action (`pick up things from the laundry`).\n\nThe analyzer\
    \ of the meaning of the word. The algorithm receives a word at the input and returns\
    \ all the meanings of this word, as well as numbers characterizing the prevalence\
    \ of each of the meanings in the language.\n\n## End-to-End Examples of Neural\
    \ Networks\n\nIt has already been said that the `NLP Architect` library includes\
    \ some end-to-end models. Let us briefly look at two of them.\n\nUnderstanding\
    \ of the text. The folder named `reading_comprehension` contains the implementation\
    \ of the language comprehension model from the guide `Machine Comprehension Using\
    \ Match-LSTM` and `Answer Pointer`. The idea of this method is to construct a\
    \ vector representation of a fragment of text taking into account the question\
    \ and submit this vector representation to the input of the neural network, which\
    \ returns the position of the beginning and end of the answer to the question\
    \ in the fragment.\n\n![NLP Target Dialog](images/00003.jpeg)\n\n Target dialogue\n\
    \nEnd-to-end neural network with memory for the target dialogue. In a folder called\
    \ `memn2n_dialogue` is an implementation of a neural network with memory (`memory\
    \ network`) to maintain the target dialogue (goal-oriented dialogue).\n\nDuring\
    \ the target dialogue, in contrast to a conversation on a free topic, the automatic\
    \ system has a specific goal, which must be achieved as a result of interaction\
    \ with the user. In short, the system needs to understand the user's request and\
    \ complete the corresponding task in a limited number of dialog moves. The task\
    \ may be to book a table in a restaurant, set a timer, and so on.\n\n## NLP Architect\
    \ Visualizer\n\nThe library includes a small web server - `NLP Architect Server`.\
    \ It makes it easy to test the performance of different `NLP Architect` models.\
    \ Among other things, the server has visualizers, which are pretty nice diagrams\
    \ that demonstrate the operation of the models. Currently, two services support\
    \ visualization - a parser and a recognizer of named entities. In addition, there\
    \ is a template with which the user can add visualization for other services.\n\
    \n![NLP Architect Visualizer](images/00004.jpeg)\n\n `NLP Architect` is an open\
    \ and flexible library with algorithms for word processing, which makes it possible\
    \ for developers from all over the world to interact.\n"
  raw: "The Named Entity Recognizer (NER) identifies certain words or combinations\
    \ of words in a text that belong to a certain class of interest to us. Examples\
    \ of entities include names, numbers, places, currencies, dates, organizations.\
    \ Sometimes entities can be quite easily distinguished with the help of such features\
    \ as the form of words, the presence of a word in a certain dictionary, part of\
    \ speech. However, quite often these signs are not known to us or even exist.\
    \ In such cases, in order to determine whether a word or phrase is an entity,\
    \ it is necessary to analyze its context.\n\nThe model for NER in NLP Architect\
    \ is based on a bidirectional LSTM network and CRF classifier. A high-level review\
    \ of the model is presented below.\n\n![High Level Review of the NER Model](images/00002.jpeg)\n\
    \nHigh Level Review of the NER Model\n\nThe user intent determination algorithm\
    \ solves the problem of understanding the language. Its purpose is to understand\
    \ what kind of action is discussed in the text, and to identify all parties involved.\
    \ For example, for a sentence\n\n“Siri, please remind me to pick up things from\
    \ the laundry on the way home.”\n\nthe algorithm determines the action (“remind”),\
    \ who should perform this action (“Siri”), who asks to perform this action (“I”)\
    \ and the object of the action (“pick up things from the laundry”).\n\nThe analyzer\
    \ of the meaning of the word. The algorithm receives a word at the input and returns\
    \ all the meanings of this word, as well as numbers characterizing the prevalence\
    \ of each of the meanings in the language.\n\nEnd-to-End Examples of Neural Networks\n\
    \nIt has already been said that the NLP Architect library includes some end-to-end\
    \ models. Let us briefly look at two of them.\n\nUnderstanding of the text. The\
    \ folder named reading\\_comprehension contains the implementation of the language\
    \ comprehension model from the guide Machine Comprehension Using Match-LSTM and\
    \ Answer Pointer. The idea of this method is to construct a vector representation\
    \ of a fragment of text taking into account the question and submit this vector\
    \ representation to the input of the neural network, which returns the position\
    \ of the beginning and end of the answer to the question in the fragment.\n\n\
    ![NLP Target Dialog](images/00003.jpeg)\n\nTarget dialogue\n\nEnd-to-end neural\
    \ network with memory for the target dialogue. In a folder called memn2n\\_dialogue\
    \ is an implementation of a neural network with memory (memory network) to maintain\
    \ the target dialogue (goal-oriented dialogue).\n\nDuring the target dialogue,\
    \ in contrast to a conversation on a free topic, the automatic system has a specific\
    \ goal, which must be achieved as a result of interaction with the user. In short,\
    \ the system needs to understand the user's request and complete the corresponding\
    \ task in a limited number of dialog moves. The task may be to book a table in\
    \ a restaurant, set a timer, and so on.\n\nNLP Architect Visualizer\n\nThe library\
    \ includes a small web server - NLP Architect Server. It makes it easy to test\
    \ the performance of different NLP Architect models. Among other things, the server\
    \ has visualizers, which are pretty nice diagrams that demonstrate the operation\
    \ of the models. Currently, two services support visualization - a parser and\
    \ a recognizer of named entities. In addition, there is a template with which\
    \ the user can add visualization for other services.\n\n![NLP Architect Visualizer](images/00004.jpeg)\n\
    \nNLP Architect is an open and flexible library with algorithms for word processing,\
    \ which makes it possible for developers from all over the world to interact.\
    \ The Intel team continues to add the results of its research to the library so\
    \ that anyone can take advantage of what they have done and improved.\n\nTo get\
    \ started, just download the code from the Github repository and follow the installation\
    \ instructions. Here you can find comprehensive documentation for all the main\
    \ modules and ready-made models.\n\nIn future releases, Intel AI Lab plans to\
    \ demonstrate the benefits of creating text analysis algorithms using the latest\
    \ deep learning technologies, and include methods for extracting text tonality,\
    \ analyzing topics and trends, expanding specialized vocabulary, and extracting\
    \ relationships in the library. In addition, Intel experts are exploring teaching\
    \ methods without teacher and partial training, with which you can create new\
    \ interpretable models for understanding and analyzing text that can adapt to\
    \ new areas of knowledge.\n\n# CHAPTER 2\n\n## How To Solve NLP Tasks: A Walkthrough\
    \ On Natural Language Processing\n\nOver the past year, the Insight team has participated\
    \ in several hundred projects, combining the knowledge and experience of leading\
    \ companies in the United States. They summarized the results of this work in\
    \ a guide, the translation of which is now in front of you, and deduced approaches\
    \ to solving the most common applied problems of machine learning. \n\nLet’s start\
    \ with the simplest method that can work and gradually move on to more subtle\
    \ approaches like feature engineering, word vectors, and deep learning. \n\nAfter\
    \ reading the section, you will know how to:\n\n*   Collect, prepare, and inspect\
    \ data;\n\n*   To build simple models, and, if necessary, make the transition\
    \ to deep learning;\n\n*   Interpret and then understand your models to make sure\
    \ that you are interpreting information, not noise.\n\nThe section is written\
    \ in a walkthrough format; it can also be seen as a review of high-performance\
    \ standard approaches.\n\nUsing machine learning to understand and use text\n\n\
    Natural language processing provides exciting new results and is a very broad\
    \ field. However, Insight identified the following key aspects of practical application\
    \ that are much more common than others: \n\n*   Identification of various cohorts\
    \ of users or customers (for example, prediction of customer churn, total customer\
    \ profit, product preferences)\n\n*   Accurate detection and extraction of various\
    \ categories of reviews (positive and negative opinions, references to individual\
    \ attributes such as clothing size, etc.)\n\n*   Classification of the text in\
    \ accordance with its meaning (request for basic help, urgent problem).\n\nDespite\
    \ the large number of scientific publications and training manuals on the topic\
    \ of NLP on the Internet, today there are practically no full-fledged recommendations\
    \ and tips on how to effectively deal with NLP tasks, while considering solutions\
    \ to these problems from the very basics.\n\nStep 1: Collect Your Data\n\nSample\
    \ Data Sources\n\nAny machine learning task starts with data — whether it's a\
    \ list of email addresses, posts, or tweets. Common sources of textual information\
    \ are:\n\n*   Product reviews (Amazon, Yelp and various app stores).\n\n*   Content\
    \ created by users (tweets, Facebook posts, questions on StackOverflow).\n\n*\
    \   Diagnostic information (user requests, support tickets, chat logs).\n\nSocial\
    \ Media Disasters dataset\n\nTo illustrate the approaches described, we will use\
    \ the Disasters in Social Media dataset, kindly provided by CrowdFlower.\n\nSet\
    \ ourselves the task of determining which of the tweets are related to the disaster\
    \ event, as opposed to those tweets that relate to irrelevant topics (for example,\
    \ films). Why do we have to do this? A potential use would be an exclusive notification\
    \ of emergency officials requiring attention to Admiral Sandler’s latest film.\
    \ The particular difficulty of this task is that both of these classes contain\
    \ the same search criteria, so we will have to use more subtle differences to\
    \ separate them. \n\nNext, we will refer to the disaster tweets as “disaster,”\
    \ and the tweets about everything else as “irrelevant.”\n\nLabels\n\nOur data\
    \ is tagged, so we know which categories tweets belong to. As Richard Socher emphasizes,\
    \ it’s usually faster, easier, and cheaper to find and mark up enough data to\
    \ model on, rather than trying to optimize a complex teaching method without a\
    \ teacher.\n\nStep 2. Clear your data\n\nRule number one: \"Your model can only\
    \ become as good as your data.\""
