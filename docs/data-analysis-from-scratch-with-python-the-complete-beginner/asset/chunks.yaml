    - We explain her predictions;

    - We understand what kinds of mistakes she makes;

    - We use the acquired knowledge to make a decision about the next step - whether
    it''s working on data, or on a more complex model.


    We examined these approaches using a specific example using models tailored to
    recognize, understand, and use short texts - for example, tweets; however, these
    same ideas are widely applicable to many different tasks.


    # A look at the importance of Natural Language Processing


    ## The Deep Learning Tsunami


    Deep Learning waves have lapped at the shores of computational linguistics for
    several years now, but 2015 seems like the year when the full force of the tsunami
    hit the major Natural Language Processing (NLP) conferences. However, some pundits
    are predicting that the final damage will be even worse. Accompanying `ICML 2015`
    in Lille, France, there was another, almost as big, event: the `2015` Deep Learning
    Workshop. The workshop ended with a panel discussion, and at it, Neil Lawrence
    said, “NLP is kind of like a rabbit in the headlights of the Deep Learning machine,
    waiting to be flattened.” Now that is a remark that the computational linguistics
    community has to take seriously! Is it the end of the road for us? Where are these
    predictions of steamrollering coming from?


    At the June 2015 opening of the Facebook AI Research Lab in Paris, its director
    Yann LeCun said: “The next big step for Deep Learning is natural language understanding,
    which aims to give machines the power to understand not just individual words
    but entire sentences and paragraphs.” In a November 2014 Reddit AMA (Ask Me Anything),
    Geoff Hinton said, “I think that the most exciting areas over the next five years
    will be really understanding text and videos. I will be disappointed if in five
    years’ time we do not have something that can watch a YouTube video and tell a
    story about what happened. In a few years’ time we will put [Deep Learning] on
    a chip that fits into someone’s ear and have an English-decoding chip that’s just
    like a real Babel fish.” And Yoshua Bengio, the third giant of modern Deep Learning,
    has also increasingly oriented his group’s research toward language, including
    recent exciting new developments in neural machine translation systems.


    It’s not just Deep Learning researchers. When leading machine learning researcher
    Michael Jordan was asked at a September 2014 AMA, “If you got a billion dollars
    to spend on a huge research project that you get to lead, what would you like
    to do?” he answered: “I’d use the billion dollars to build a NASA-size program
    focusing on natural language processing, in all of its glory (semantics, pragmatics,
    etc.).” He went on: “Intellectually I think that NLP is fascinating, allowing
    us to focus on highly structured inference problems, on issues that go to the
    core of ‘what is thought’ but remain eminently practical, and on a technology
    that surely would make the world a better place.” Well, that sounds very nice!
    So, should computational linguistics researchers be afraid? I’d argue, no. To
    return to the Hitchhiker’s Guide to the Galaxy theme that Geoff Hinton introduced,
    we need to turn the book over and look at the back cover, which says in large,
    friendly letters: “Don’t panic.”


    ## The Success of Deep Learning


    There is no doubt that Deep Learning has ushered in amazing technological advances
    in the last few years. I won’t give an extensive rundown of successes, but here
    is one example. A recent Google blog post told about `Neon`, the new transcription
    system for Google Voice. After admitting that in the past Google Voice voicemail
    transcriptions often weren’t fully intelligible, the post explained the development
    of `Neon`, an improved voicemail system that delivers more accurate transcriptions,
    like this: “Using a (deep breath) long short-term memory deep recurrent neural
    network (whew!), we cut our transcription errors by 49 percent.” Do we not all
    dream of developing a new approach to a problem which halves the error rate of
    the previously state-of-the-art system?


    ## Why Computational Linguists Need Not Worry


    Michael Jordan, in his AMA, gave two reasons why he wasn’t convinced that Deep
    Learning would solve NLP: “Although current deep learning research tends to claim
    to encompass NLP, I’m much less convinced about the strength of the results, compared
    to the results in, say, vision; much less convinced in the case of NLP than, say,
    vision, the way to go is to couple huge amounts of data with black-box learning
    architectures.” Jordan is certainly right about his first point: So far, problems
    in higher-level language processing have not seen the dramatic reductions.


    ### It Is People in Linguistics, People in NLP, Who Are the Designers


    On the other hand, you be much less convinced by his second argument. However,
    there are two reasons why NLP need not worry about deep learning:


    1. It just has to be wonderful for our field for the smartest and influential
    people in machine learning to be saying that NLP is the problem area to focus
    on;

    2. Our field is the domain science of language technology; it’s not about the
    best method of machine learning—the central issue remains the domain.


    Joseph Reisinger wrote: “I get pitched regularly by startups doing ‘generic machine
    learning’ which is, in all honesty, a pretty ridiculous idea. Machine learning
    is not undifferentiated heavy lifting, it’s not commoditizable like `EC2`, and
    closer to design than coding.” From this perspective, it is people in linguistics,
    people in NLP, who are the designers. Recently at `ACL` conferences, there has
    been an over-focus on numbers.


    One thing that I’ve been devoting a lot of time to together with many other collaborators
    is the development of Universal Dependencies. The goal is to develop a common
    syntactic dependency representation and POS and feature label sets that can be
    used with reasonable linguistic fidelity and human usability across all human
    languages. That’s just one example; there are many other design efforts underway
    in our field. One other current example is the idea of Abstract Meaning Representation.


    ## Deep Learning of Language


    Where has Deep Learning helped NLP? The gains so far have not so much been from
    true Deep Learning (use of a hierarchy of more abstract representations to promote
    generalization) as from the use of distributed word representations—through the
    use of real-valued vector representations of words and concepts. Having a dense,
    multidimensional representation of similarity between all words is incredibly
    useful in NLP, but not only in NLP. Indeed, the importance of distributed representations
    evokes the “Parallel Distributed Processing” mantra of the earlier surge of neural
    network methods, which had a much more cognitive-science directed focus (Rumelhart
    and McClelland 1986). It can better explain human-like generalization, but also,
    from an engineering perspective, the use of small dimensionality and dense vectors
    for words allows us to model large contexts, leading to greatly improved language
    models. Especially seen from this new perspective, the exponentially greater sparsity
    that comes from increasing the order of traditional word n-gram models seems conceptually
    bankrupt. Intelligence requires being able to understand bigger things from knowing
    about smaller parts.

