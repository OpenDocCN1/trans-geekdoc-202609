    \ use only\nnltk.download ('wordnet') # first-time use only\n\nsent_tokens = nltk.sent_tokenize\
    \ (raw) # converts to list of sentences \nword_tokens = nltk.word_tokenize (raw)\
    \ # converts to list of words\n```\n\nLet's look at an example `sent_tokens` and\
    \ `word_tokens` files\n\n```python\nsent_tokens[: 2]\n['a chatbot (also known\
    \ as a talkbot, chatterbot, bot, im bot, interactive agent, or artificial conversational\
    \ entity) is a computer program or an artificial intelligence which conducts a\
    \ conversation via auditory or textual methods.',\n 'such programs are often designed\
    \ to convincingly simulate how a human would behave as a conversational partner,\
    \ thereby passing the turing test.']\n\nword_tokens[: 2]\n['a', 'chatbot', '(',\
    \ 'also', 'known']\n```\n\n### Source code preprocessing\n\nNow we define the\
    \ `LemTokens` function, which will accept tokens as input parameters and issue\
    \ normalized tokens.\n\n```python\nlemmer = nltk.stem.WordNetLemmatizer ()\n\n\
    # WordNet is a semantically-oriented dictionary of English included in NLTK.\n\
    def LemTokens (tokens):\n    return [lemmer.lemmatize (token) for token in tokens]\n\
    \nremove_punct_dict = dict ((ord (punct), None) for punct in string.punctuation)\n\
    \ndef LemNormalize (text):\n    return LemTokens (nltk.word_tokenize (text.lower\
    \ (). translate (remove_punct_dict)))\n```\n\n### Keyword Selection\n\nDefine\
    \ a bot greeting replica. If the user greets the bot, the bot will say hello in\
    \ response. ELIZA uses simple keyword matching for greetings. We will use the\
    \ same idea.\n\n```python\nGREETING_INPUTS = (\"hello\", \"hi\", \"greetings\"\
    , \"sup\", \"what's up\", \"hey\",)\nGREETING_RESPONSES = [\"hi\", \"hey\", \"\
    * nods *\", \"hi there\", \"hello\", \"I am glad! You are talking to me\"]\n\n\
    def greeting (sentence):\n    for word in sentence.split ():\n        if word.lower\
    \ () in GREETING_INPUTS:\n            return random.choice (GREETING_RESPONSES)\n\
    ```\n\n### Response generation\n\nTo generate the answer of our bot for entering\
    \ questions, the concept of similarity of texts will be used. Therefore, we start\
    \ by importing the necessary modules.\n\nImport the TFidf vectorizer from the\
    \ library to convert the raw text set to the TF-IDF property matrix.\n\n```python\n\
    from sklearn.feature_extraction.text import TfidfVectorizer\n```\n\nIn addition,\
    \ import the Otiai coefficient module from the scikit library\n\n```python\nfrom\
    \ sklearn.metrics.pairwise import cosine_similarity\n```\n\nThis module will be\
    \ used to search for keywords in the user’s request. This is the easiest way to\
    \ create a chat bot.\n\nDefine a response function that returns one of several\
    \ possible answers. If the query does not match any keywords, the bot gives the\
    \ answer “Sorry! I do not understand\".\n\n```python\ndef response (user_response):\n\
    \    robo_response = ''\n    TfidfVec = TfidfVectorizer (tokenizer = LemNormalize,\
    \ stop_words = 'english')\n    tfidf = TfidfVec.fit_transform (sent_tokens)\n\
    \    vals = cosine_similarity (tfidf[-1], tfidf)\n    idx = vals.argsort () [0]\
    \ [-2]\n    flat = vals.flatten ()\n    flat.sort ()\n    req_tfidf = flat [-2]\n\
    \    if (req_tfidf == 0):\n        robo_response = robo_response + \"I am sorry!\
    \ I don't understand you\"\n        return robo_response\n    else:\n        robo_response\
    \ = robo_response + sent_tokens [idx]\n        return robo_response\n```\n\nFinally,\
    \ we specify bot replicas at the beginning and end of correspondence, depending\
    \ on the user's replicas.\n\n```python\nflag = True\nprint (\"ROBO: My name is\
    \ Robo. I will answer your queries about Chatbots. If you want to exit, type Bye!\"\
    )\n\nwhile (flag == True):\n    user_response = input ()\n    user_response =\
    \ user_response.lower ()\n    if (user_response != 'bye'):\n        if (user_response\
    \ == 'thanks' or user_response == 'thank you'):\n            flag = False\n  \
    \          print (\"ROBO: You are welcome ..\")\n        else:\n            if\
    \ (greeting (user_response) != None):\n                print (\"ROBO:\" + greeting\
    \ (user_response))\n            else:\n                sent_tokens.append (user_response)\n\
    \                word_tokens = word_tokens + nltk.word_tokenize (user_response)\n\
    \                final_words = list (set (word_tokens))\n                print\
    \ (\"ROBO:\", end = \"\")\n                print (response (user_response))\n\
    \                sent_tokens.remove (user_response)\n    else:\n        flag =\
    \ False\n        print (\"ROBO: Bye! take care ..\")\n```\n"
