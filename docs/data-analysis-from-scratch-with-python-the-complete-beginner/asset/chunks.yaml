    Technology encompasses methods and techniques, and each has a set of potential
    use cases. Companies would do well to examine them before moving forward with
    plans to invest in the machine learning tools and the infrastructure.


    ## Machine learning methods


    Supervised learning: This Supervised learning is ideal if you know what you want
    a machine to learn. You can expose it to a vast set of training data, examine
    the result, and modify the parameters until you get the results you expect. After
    that, you can see what the machine has learned by predicting the results of a
    validation data set that you have not seen before.


    The supervised learning tasks include classification and prediction or regression.


    The Supervised learning methods can be used for applications such as determining
    the financial risk of individuals and organizations, based on past information
    on financial performance. They can also provide a good idea of how customers will
    act or what their preferences are based on previous behavior patterns.


    For example, the `Lending Tree` online loan market is using an automated `DataRobot`
    machine learning platform to customize experiences for its customers and predict
    their intention based on what they have done in the past, says Akshay Tandon,
    vice president and chief of strategy and analytics.


    By predicting the intention of the client - primarily through the qualification
    of potential clients - `Lending Tree` can classify people who are looking for
    a rate, compared to those who are really looking for a loan and are ready to apply
    for one. Using supervised learning techniques, he constructed a classification
    model to define the probability of a lead closing.


    Unsupervised learning: Unsupervised learning allows a machine to explore a set
    of data and identify hidden patterns that link different variables. This method
    can be used to group data into groups only based on their statistical properties.


    A useful application of the unsupervised learning is the clustering algorithm
    used to make links to probabilistic records, a technique that extracts connections
    between data elements and builds them to identify people and organizations and
    their connections in the physical or virtual world.


    This is especially useful for companies that need, for example, to integrate data
    from disparate sources and/or in different business units to build a consistent
    and complete view of their customers, says Flavio Villanustre, vice president
    of technology at `LexisNexis Risk Solutions`, a company that uses analysis to
    help customers predict and manage risks.


    Unsupervised learning could be used for sentiment analysis, which identifies people''s
    emotional state based on their social media posts, emails or other written comments,
    notes Sally Epstein, a machine learning engineering specialist at Cambridge consultancy.
    Consultants the firm has gotten an increasing number of companies in financial
    services that use unsupervised learning to obtain information on customer satisfaction.


    Semi-Supervised Learning: Semi-Superviseded Learning is a hybrid of supervised
    and unsupervised learning. By labeling a little portion of the data, a trainer
    can give the machine clues about how to group the rest of the data set.


    Semi-supervised learning can be used to detect identity fraud, among other uses.
    Frankly, fraud is not as frequent as a non-fraudulent activity, Villanustre notes,
    and as such, fraudulent activity can be considered an "anomaly" in the universe
    of legitimate activity. Even so, there is a fraud and machine learning methods
    for detecting semi-supervised anomalies can be used to model solutions to these
    types of problems. This type of learning is implemented to identify fraud in online
    transactions.


    Semi supervised learning can also be used when there is a mix of labeled and unlabeled
    data, which is often seen in large business environments, Epstein notes. `Amazon`
    has been able to improve the natural language understanding of its `Alexa` offering
    by training artificial intelligence algorithms.


    Reinforcement learning: Reinforcement learning allows the machine to interact
    with its surroundings, and provides you with a reward. It is suitable for autonomous
    decision making where supervised learning or unsupervised learning alone cannot
    do the job.


    Use cases for reinforcement learning cover a variety of industries:


    In retail sales, they can be used to eliminate payment lines and customize the
    customer experience.


    Some retailers have been testing new technologies, such as robotics, to classify
    items, says David Schatsky, an analyst at `Deloitte`, which focuses on emerging
    trends. A variation of reinforcement learning is deep learning, which helps clothing
    and accessories.


    Deep learning: Deep learning performs types of learning, such as unsupervised
    or reinforced. In general terms, deep learning mimics some aspects of how people
    learn, mainly through the use of neural networks.


    Deep learning, within the form of `DNN`, has been used to accelerate high-content
    screening for drug discovery, says Schatsky. It is about applying `DNN` to process
    multiple images in significantly less time. This machine learning method also
    allows many companies to fight fraud improving detection rates.


    Deep learning can be used in the automotive industry. A company has developed
    a system based on neural networks that allow early detection of problems with
    cars, says Schatsky. This system can recognize noise and vibration and use any
    deviation from the norm to interpret the nature of the fault. It can become part
    of predictive maintenance since it determines the vibrations of any mobile part
    of the car.


    ## Machine Learning Techniques


    Neural networks: Neural networks are produced to mimic the structure of neurons
    in human brains, with each artificial neuron connecting to other neurons within
    the system. Neural networks are assembled in layers, with neurons in one layer
    passing data to multiple neurons in the next layer, and so on. Eventually, they
    reach the exit layer, where the network presents its best guesswork to solve a
    problem, identify an object.


    Use cases for neural networks cover a variety of industries:


    In life sciences and the health care, they can be used to analyze medical images
    to accelerate diagnostic processes.


    In telecommunications and media, neural networks can be used for language translations,
    fraud detection, and virtual assistant services.


    In financial services, they can be used for fraud detection, portfolio management,
    and risk analysis.


    In retail sales, they can be used to eliminate payment lines and customize the
    customer experience.


    Decision trees: A decision tree algorithm tries to classify the elements by identifying
    questions concerning their attributes that will assist decide of which class to
    place them. Each node inside the tree is a question, with branches that lead to
    more questions about the articles, and the leaves as the final classifications.

