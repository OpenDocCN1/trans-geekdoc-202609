    In order for the prediction information to be interpretable for the user and the
    user can make decisions, it is presented in the form of a daily consumption graph.
    This graph can be made by daily sections and weighted according to the rate applicable
    in each section, so that the user can accommodate activities on the same day under
    different rates. |


    ## Analysis of data


    The techniques known as Insight and Visual Mining allow the user to have a generalized
    tool that can be customized at the time of use to obtain their own conclusions
    about their data and thus make their decisions.


    Through these techniques, the household information is presented to the user in
    a highly expressive visual way, allowing at a glance, a lot of varied information
    can be assimilated, thus avoiding having many graphs of disjoint elements.


    A relevant graph is the “Heat Map" of consumption. As can be seen in Figure 6,
    consumption is represented on a disk consisting of seven concentric circles (one
    for each day of the week) and 24 segments (one for each time interval), where
    the color corresponds to the intensity of consumption. This graph facilitates
    the user to detect consumption differences between days of the week, and therefore
    associate it with habits to improve them. In addition, it allows the user to navigate
    through different weeks and select which devices he wants to analyze.


    In addition, the application of inspection capacity is provided, allowing the
    user to select sections, and thus filter the rest of the information in order
    to facilitate conclusions. In this way, a user can, for example, select his consumption
    on Mondays, between a certain time intervals. The user, when selecting, can adjust
    the graphs to the selected interval, zooming in on that interval and filtering
    the data. In addition, you can navigate the graphs by scrolling along the coordinate
    axis that represents time. |


    ## Conclusions and future work


    Energy knowledge of the home is a key factor to achieve efficient use of resources.
    The extended use of meters and sensors at the residential level, facilitates the
    obtaining of the information of the same, but this information, due to its variety
    and size, is not acceptable to be processed manually, so it is necessary to resort
    to the use of machine learning techniques.


    Within the context of energy efficiency in the home, a collaborative recommender
    will allow to suggest actions that will save energy to groups of users with a
