  trans: '


    对于任何数据分析师来说，基础库包括 `pandas`（用于处理表格形式的数据）、`numpy`（用于处理大型数值数组）和 `scipy`（用于计算）。对于可视化，你可能需要
    `matplotlib` 和 `seaborn` 库。机器学习需要掌握 `scikit-learn` 核心库以及其他指定的库（例如用于梯度提升的 `XGBoost`
    和 `LGBM`）。对于自然语言处理任务，人们需要理解特殊库的内容：`nltk`、`StanfordNLP`、`spacy`、`gensim`、`bigartm`、`word2vec`、`fasttext`。


    我们需要使用 `Tensorflow`、`Keras`、`PyTorch` 等框架构建深度神经网络的。。，建议熟悉专为俄语设计的工具，例如用于形态分析的 `pymystem3`、`pymorphy`，用于提取事实和实体的
    `Tomita parser`、`yargy`。此外，你需要能够测试文本数据处理方法，并了解评估模型质量的方法。


    当然，这只是最高要求的标准。根据雇主的具体任务，可能需要某一种编程语言或某一项技术栈。对于 NLP 解决方案开发者来说，加分项是在 `GitHub` 上有自己的项目，以及参加
    `Kag` 和其他机器学习竞赛的证书。申请者还被要求具备足够的英语水平，但这是一项通用要求。


    ## 我可以在哪里学习 NLP 职业？


    在 NLP 职位空缺中，大多数情况下，需要计算机科学、计算数学、物理或相关专业的专门教育。有时——要求不低于硕士或专业硕士学位。


    但也有其他选择：例如，在拥有计算语言学学位的大学学习。此类教育项目的毕业生是 Polina Kazakova，她是 `IRELA` 项目的数据科学家，也是
    `MISiS`大数据分析中心的员工。她正在为各种公司开发数据分析系统，也就是说，就是处理自然语言。


    ## 为了从事 NLP 工作而去学习计算语言学值吗？


    “这门计算语言学课程本身有一个很好的目标：将理论与实践结合，”Polina 说道。“我们学习过与语法、语音学、形态学等相关的理论学科，并尝试引入一些精确学科，如数学分析、线性代数、统计学、编程基础甚至机器学习。正如你所想象的，机器学习在最近的自然语言处理中被非常活跃地使用（尽管不是在所有任务中，在某些地方仍然跳过了基于规则的方法）。”回到课程本身，似乎这个想法很酷，结合了如此多的东西。但在实践中，你会发现无法在一个学位中给一个人提供两种基础性的培养，因此我们接受了非常好的基础语言学教育，并包含了一些数学知识。


    这可能足够开始在 NLP 领域工作，但未来仍需要更深层次的知识。从本科毕业后，我意识到我缺乏基础数学课程的基础性知识。因此，现在例如，我正在独立地学习数学分析和线性代数。


    给想从事自然语言处理的人的建议：去读技术专业并同时学习一些语言学方面的知识，因为在机器学习的实际问题中，语言的高度特定知识极少用处，尤其是现在，已经有了神经网络，它们可以在大规模良好标记的数据上自动推导出语言学家可以手动制定的所有规则。我们可以说，良好的语言学资质有时可以在
    NLP 中带来某种收益，但在大多数情况下，更可能需要的是良好的机器学习素养。


    ## 去读技术专业并同时学习一些语言学知识


    ## 谁参与神经网络以及以及机器学习模型训练文本数据标注？


    “这是一个很好的问题。标注是每个人的共同痛点——语言学家、机器学习和自然语言处理专家都是如此，”Polina Kazakova 说。“要获得足够大量的良好标注并不容易，这需要有人来手动布局数据数组。而语言学家应该负责文本标注方法论的编制。例如，对于
    `tokenization`（分词）任务，他们必须制定将文本划分为单词的规则（考虑到如‘sofa bed’、some、90th year’等复杂情况）。之后，你就可以吸引几乎随机的人员根据给定的规则对文本进行标注。顺便说，想在
    `Data Science / NLP` 方向进一步发展的实习生可以被分配这项任务——数据标注。这类空缺偶尔会出现。


    尽管对技术专业毕业生有通才需求，但有时在程序员和数学家的团队中也需要语言专家。Polina 回忆起其中一个案例：“三星有一个语音助手，最近他们开始在俄罗斯积极招募语言学家工作。他们从事语音识别和合成，他们聘用了我的一个同学，她是一个非常出色的理论语音学家，尽管她没有编程经验，也不知道什么是神经网络。录用她是因为特定的语言学知识，但我看来，这是一个特例。”


    ## NLP 进修教育


    无论你接受什么样的基础教育——语言学的还是数学的——你总会发现缺少某些知识，尤其是由于 NLP 和 Data Science 正在积极发展。如何获得额外教育？


    数据分析学院 (SHAD) - Yandex 计划，雇主经常提到其是潜在候选人的优势。正如名称所示，那里提供了机器学习和数据分析的基础知识。该学校的形式更像全日制硕士而非额外教育。该计划设计为两年，全日制（在莫斯科、明斯克、叶卡捷琳堡和下日诺哥德设有分校），非居住地学生函授。你可以通过竞争免费进入
    SHAD（竞争非常激烈，人数很大），如果分数不足，则付费学习，但仅限莫斯科的线下。


