  trans: '


    - 积累了海量的训练数据；

    - 开发了强大的计算能力：多核 CPU 和 GPU；

    - 创建了具有先进特性和改进性能的新模型与算法，并在中间表示中实现了灵活的训练；

    - 他们的教学方法使用了 `c` 上下文以及新的正则化和优化方法。


    大多数机器学习方法之所以运行良好，是因为人类开发了数据和输入特征的表示，并对权重进行了优化，以最终的预测结果更佳。


    在深度学习中，算法尝试从原始输入中自动提取最佳属性或表征。


    手动创建的特征往往过于专门化、不完整，且创建和验证需要花费时间。相比之下，深度学习揭示的特征更容易适应。


    深度学习为在视觉和语言信息方面表征世界提供了一个灵活、多功能且可学习的框架。起初，这在语音识别和计算机视觉领域取得了突破。这些模型通常使用同一种通用算法进行训练，不需要为特定任务构建传统的特征。


    **注意：** 本仓库中包含了该课程的讲座和编程作业。


    ## 向量表示（文本嵌入）


    在传统的 NLP 中，单词被视为离散的字符，然后表示为 one-hot 向量（独热向量）。单词作为离散字符的问题在于——one-hot 向量缺乏相似性定义，因此替代方案是学习将相似性编码到向量本身中。


    向量表示是将字符串表示为带有值的向量的方法。为每个单词构建一个稠密向量，使得出现在相似上下文中的单词具有相似的向量。向量表示被认为是大多数 NLP 任务的起点，并使得深度学习在小数据集上有效。由
    Google（`Mikolov`）和斯坦福（`Pennington`, `Socher`, `Manning`）分别的 `Word2vec` 和 `GloVe`
    向量表示技术非常流行，用于 NLP 任务。让我们来看看这些技术。


    ### Word2vec


    `Word2vec` 接受一个大型文本语料库，固定字典中的每个单词都表示为一个向量。接下来，算法遍历文本中的每个位置 `t`，其中包含中心词 `c` 和上下文词
    `o`。接着，利用 `c` 和 `o` 的词向量的相似性来计算给定 `c` 的概率 `o`（反之亦然），并继续调整词向量以最大化该概率。


    ![NLP 的向量表示](img/00022.gif)


    从数据集中移除无用词（或高频词，在英语中为 `a`, `the`, `of`, `then`）以获得更好的 `Word2vec` 结果。这将有助于提高模型准确性并缩短训练时间。此外，对每个输入使用负采样，更新所有正确标签的权重，但只对少数错误标签进行更新。


    `Word2vec` 以 2 种模型变给出：


    ![Skipgram NLP](img/00023.jpeg)


    **Skip-Gram**：检查包含 `k` 个连续单词的上下文窗口。接下来，跳过一个单词，并训练一个包含除缺失词外所有单词的神经网络，该缺失词是算法试图预测的词。因此，如果
    2 个单词在语料库中周期地共享相似的上下文，这些单词将具有接近的向量。


    **连续词袋 (Continuous Bag of Words, CBOW)**：取语料库中的许多句子。每当算法看到一个单词时，就会取一个相邻的单词。接下来，将上下文词输入神经网络，我们预测该上下文中心位置的单词。


    在有数千此类上下文词和中心词的情况下，我们为神经网络获得了一个数据集实例。神经网络进行训练，最终，编码后的隐藏层输出表示特定单词的嵌入。如果神经网络在大量句子上进行训练，也会发生相同的情况，相似的向量被分配给相似上下文中的单词。


    对 `Skip-Gram` 和 `CBOW` 的唯一抱怨是它们属于基于窗口的模型类，其特点是效率较低。


    ### Glove


    `GloVe` 通过捕捉整个上下文的含义来解决这个问题，并对单词进行嵌入。为了做到这一点，模型利用整个词的的统计信息，并产生单词距离的表示。


    ![Glove 文本嵌入](img/00024.jpeg)


    除了这两个模型外，许多最近开发的技术已应用于：`FastText`、`Poincare Embeddings`、`sense2vec`、`Thought`、`Adaptive
    Skip-Gram`。


    ## 机器翻译


    机器翻译是将自然语言文本转换为另一种语言的内容，无需人工干预。机器翻译利用语言的统计信息。机器翻译被广泛应用于，每年达到 400 亿。一些著名的例子：


    - Google 翻译每天翻译 100 亿单词。

    - Facebook 使用机器翻译自动翻译帖子和评论，让世界不同地区的人相互交流。

    - eBay 使用机器翻译实现跨境贸易并连接买家和卖家。

    - 微软将基于 AI 的翻译应用于 Android、iOS 和 Amazon Fire。

    - Systran 是第一个在 2016 年推出 30 种语言神经翻译引擎的软件供应商。


    在传统的机器翻译系统中，你需要使用平行语料——一组被翻译成一种或多种语言的文本。例如，对于源语言 `f`（法语）和目标语言 `e`（英语），有必要建立一个包含贝叶斯规则的翻译模型
    `p(f | e)`（在平行语料上训练）和语言模型 `p(e)`（仅在英语上训练）。


    无需说明，这种方法错过了许多重要细节，需要大量的手动设计特征，并由各种相互独立的机器学习任务组成。


    神经网络机器翻译（Neural Machine Translation, NMT）——借助循环神经网络（Recurrent Neural Network,
    `RNN`）建模翻译的方法。`RNN` 是一种对前状态有依赖的神经网络，其在传递之间具有连接。神经元接收来自前层的信息，也接收来自自身上一个步骤的信息。这意味着输入数据和训练网络的顺序是很重要的：提交“Donald”到“Trump”的结果与提交“Trump”到“Donald”的结果并不一致。


    标准的神经机器翻译模型是一个端到端的神经网络，其中源句子由称为编码器（encoder）的 `RNN` 编码，并通过另一个称为解码器（decoder）的 `RNN`
    预测目标单词。


