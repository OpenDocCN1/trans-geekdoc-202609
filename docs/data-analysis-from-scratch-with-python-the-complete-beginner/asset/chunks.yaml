  trans: '

    本文旨在阐述这些机器学习技术的深度汇编，并对实现这些技术所提供的其他替代方案进行比较研究。考虑到所提的任何解决方案必须具有可扩展性，因为所使用的数据随时间推移不断增加，且集成此类设备的家庭数量也在增加，因此大数据技术的应用将至关重要。


    三十多年年来，欧盟（EU）的提高能源效率的政策一直基于减少能源消耗和防止能源浪费的策略。通过这种方式，欧盟努力为增强竞争力、供应安全以及履行《京都议定书》关于气候变化的承诺做出决定性贡献（Grubb
    et al., 1999）。在许多减少能源消耗的潜在来源中，住房是委员会投入努力的重点，这些努力汇总在名为`Directive 2010/31 / EU`的指令中，即`建筑能源性能`（Commission,
    2010），该指令指出，在该领域内消耗了欧盟 40% 的终端能源。另一方面，2013 年 6 月 20 日，发表了一项题为《建筑能源效率证书及其对欧盟国家价格和租金转型的影响》的研究，其结论表明，强制性能源认证倡议（如`RD
    235/2013`（Ballesteros and Shaw, 2013））将对住房市场产生积极影响，能源效率高的房屋将更具价值。


    然而，总而言，所有这些倡议在短期内都没有产生预期影响，用户不会因为能源认证而选择某栋房屋而非另一栋房屋，而且在更换电器时最相关的标准通常不是其效率水平，而是其他标准，如价格或功能。尽管事实上，对气候变化的意识、少消费和高效消费的需求在我们的日常生活中日益增加，但终端用户希望他们的家及其集成的元素能提供更好的生活质量，而不是增加一种额外的负担，而这种负担在很多情况下他们既不理解也不感兴趣。


    这正是智能家居能源（Smart Home Energy, SHE）（SHE Consortium, 2012）等项目的用武，它们作为真正的能量助手，允许终端用户以完整且无需干预的方式管理家居，以确保能源效率标准，并始终达到最小需求和消耗点。为了实现这一目标，这类系统依赖于三个支柱：监控、通过机器学习进行预测以及控制。通过这种方式，本文介绍的项目能够表征家庭的能源行为，并针对其自管理提出适当的建议或纠正。


    本文档结构如下：首先将对相关研究进行研究，以提高能源效率，并将类似技术应用于其他领域。随后，我们回顾支持所提系统的技术替代方案，该系统将在下文第 4 节描述，并介绍其主要模块。最后，将在最后一节给出结论和未来工作。


    # 现状


    任何自学习模型的基础特征都是其能够预测系统行为的能力，以便为特定目的开发控制策略。机器学习技术已成功应用于其他领域。


    具体而言，基于用户偏好和相似性的推荐系统日益出现在日常环境和应用中。最为人知的案例之一是亚马逊购物网站，用户会根据被认为相似用户的购买行为接收推荐（Linden
    et al., 2003）。同样，流行的视频点播服务 Netflix 利用用户对看过的电影给出的评分，向具有相似口味的其他用户推荐电影（Xavier Amatriain,
    Justin Basilico, 2012）。在伴侣搜索服务中使用这些系统也很常见，旨在为服务的用户推荐可能的候选人。


    至于预测，这类技术在经济领域的应用案例已为人知，试图了解市场的未来演变（Satchell and Knight, 2011）；在医学领域，此类技术可以帮助预判中风等（Khosla
    et al., 2010）；使用这些系统进行分类和识别任务也非常常见，例如计算机视觉领域（Chechik et al., 2010）以及网络恶意元素检测（Ma
    et al., 2009）。


    回到本文的主题，需要考虑到房屋是一个整合了不同消耗元素（电器）、不确定性来源（外部温度和居住者行为）以及能源生产来源（空调、锅炉、太阳能电池板）的复杂模型。为了设计并开发能源管理系统，预测温度等参数至关重要。之前的研究展示了基于神经网络（González
    Lanza and Zamarño, 2002 Zamarreno, 2005）和支持向量机（SVM）的模型。


    # 相关技术


    ## 数据采集


    数据采集包含硬件和软件。在硬件方面，需要在家中安装智能电表，以获取特定的数值。


    SHE 项目旨在与硬件无关，目前包含了对 `Current Cost EcoManager`（Current Cost, 2012）和 `Plugwise`（Plugwise,
    2012）电表的支持，如图 1 所示。这两者都基于位于电器和插座之间的设备网络，分别通过射频和 ZigBee 将数据发送到另一个中央设备。


    此外，其他家庭信息（亮度、温度、污染程度等）可以通过传感器进行采集。


    数据通过软件适配器从电表和传感器中提取，并通过设备服务（WS4D）技术作为能源服务提供（Web Services for Devices (WS4D) Website,”2012）。该服务将由负责机器学习的元素调用，这些元素将在本文第
    4 节描述。


    ## 数据存储与处理


    从获取的数据通过云技术集中存储（Rhoton and Haukioja, 2011），这使得家中不需要配备大型存储容量。它还提供了管理和维护数据完整性、安全性和可用性的设施，存储数据的副本以防信息丢失。


    系统中的另一项关键技术是大数据，因为它具有可扩展性（Marz and Warren, 2013）。通过成本上的线性的投入，它可以涵盖存储和处理需求，并实现信息技术（IT）基础设施的弹性管理，根据需求调整大小。大数据支持海量类型的数据，并在允许的时间内进行处理。它还支持机器学习算法、可视化数据挖掘工具、近实时监控以及一系列新的分析和信息处理可能性，这些与所提系统完美契合。

