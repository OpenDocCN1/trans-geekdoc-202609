  trans: '


    如果对规则集的全局精确度没有产生影响，也可以接受。规则处理反复进行，直到每条规则的泛化尝试失败为止。在最坏的情况下，它不进行任何泛化，最终结果是一个邻域分类器，它将所有共同训练的示例作为副本使用。每个测试示例的分类是通过找到与示例最接近的规则来实现的，并将该规则的类别分配给该示例。


    精确度（英文为 accuracy，准确率）是规则集 `RS` 在示例集上的 `Acc(RS)`，它被定义为规则集正确分类的示例所占的比例。当距离示例最近的规则与该示例具有相同类别时，则该示例被正确分类。由于示例集是固定不变的训练集（或者换言之，精确度将表示为
    `Acc(RS)`）。


    精确度使用“留一法”逻辑方法进行测量：当尝试对某一个示例进行分类时，与示例对应的规则从规则集中剔除，除非它已经覆盖了另一个示例。每个示例都记录了它到分配给该规则的类别的距离，当它泛化到一条规则时，有必要让该规则与所有示例进行对应，并检查之前未包含的某些示例以及产生了什么影响。之前被错误分类的示例现在通过规则的泛化被正确分类了，这会提高规则集的准确率；而之前分类正确的示例由于泛化，现在被分类得不佳，这会降低规则组合的准确率。如果前者的数量多于后者，则共同规则规则集精确度的变化是正的，这样你就接受了新的规则集，即新的泛化规则。


    所使用的距离度量是属性数量欧几里得距离与 Stanfill 和 Waltz 数值差异指标的简化版本的结合。即 C，和...,和，（并且 AND 两个对于第
    `i` 个属性和类别的两个具有值 `i` 的示例）。


    ### ARISE 软件

    `ARISE` 软件在书中进行了详细描述。它构成了一个基于 RISE 的分类算法的实现，该算法改变了处理缺失值的方法，它允许进行分类和规则归纳，这在大学提供的软件版本中是不强制执行的。该软件通过示例进行了尝试和评估，目标是检查它是否实现了算法的正确方法，以及处理值的方法改变是否保留了原始算法的优势。此外，还尝试了该算法或实现产品（`ARISE`）的效率，通过
    Weka 软件使用 `ID3`、`C4.5` 和 `Nge` 算法对一组位于加利福尼亚大学加利福尼亚欧尔文分校（UCI）（机器学习数据库仓库，信息与计算机科学系，加利福尼亚州欧尔文市，CA）的工作集进行了结果对比。网页地址可免费下载：http://www.ics.uci.edu/~mlearn/MLRepository.html。


    ### 处理缺失值

    当 Laugh 在工作室 决定选择 `RISE` 作为待实现的算法时，处理缺失值的另一种策略被发现目前存在某种局限性。在某些情况下，如果我们扩展 RISE
    原有的处理属性缺失值（如比例值）策略，可能会导致得到的规则不精确，为了避免这种情况，许多作者广泛描述了针对数值属性提出的替代策略。在文献中，被广泛引用了多种处理缺失值数值属性的策略，包括：


    - 移除具有缺失值的训练示例集。

    - 将缺失值替换为属性值的中位数。

    - 将缺失属性的值替换为众数，或者替换为类别出现频率最高的属性值。

    - 其他基于属性值概率分布的技术。


    **注意：** 在属性缺失符号属性的情况下，如果其符号性质允许，则上述技术同样适用。


    #### 符号属性“平均值”的计算

    文献中出现的用于确定符号属性值二半部分的最简单方法是选择属性中最频繁的值，但这种方法并不严谨，在这种情况下我们指的是众数而不是属性的中位数，且许多作者一致认为这在分类位置并不能产生最佳的准确率。


    鉴于数值属性的平均值是使方差最小的值，我们可以推断将这种想法尝试应用于符号属性是自然的，遵循与数值属性相似的策略，且中位数构成了一个理想的中心趋势，对于属性值的分布方法而言，符号属性也是如此。为了确定两个符号属性值之间的距离，Sunday
    和其他作者使用了以下指标：


    ![](img/00019.gif)


    这与其他作者的观点一致，即如果使用符号属性的所有值对之间的距离，将有一个属性产生最小的距离；在平局的情况下，他可能会随机选择一个使距离最小的属性值，而这个使距离最小的值确实可以被视为该值集合的“平均值”。正如公式中所描述的形式：符号值集的平均值可以定义为使该集合方差最小的值
    `m`（一个属性值），即：


    ![](img/00020.gif)


