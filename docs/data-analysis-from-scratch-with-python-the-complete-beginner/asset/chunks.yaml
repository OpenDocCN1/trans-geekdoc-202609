    专业数据科学家的核心技能之一是清楚下一步应该做什么——是继续构建模型还是处理数据。实践证明，最好先观察数据本身，然后才进行清洗。


    干净的数据集将允许模型学习重要的属性，而不是在无关的噪声上进行重新训练。


    以下是用于清理我们数据的清单（细节可以在代码中找到）：


    -   删除所有无关字符（例如，任何非字母数字字符）。

    -   通过将文本划分为单个单词来进行分词（Tokenize）。

    -   移除无关单词——例如 Twitter 提及信息或 URL。

    -   将所有字符转换为小写，这样 "hello"、HELLO" 和 "Hello" 就会被视为同一个单词。

    -   考虑合并拼写错误或替代拼写的单词（例如，`cool` / `cool/cool`）。

    -   考虑词形还原（lemmatizing），即将一个单词的不同形式还原为字典形式（例如，用“machine”代替“machine”、“by machine”、“machines”等）。


    在我们在完成这些步骤并检查了额外错误后，我们就可以开始使用干净、带标签的数据来训练模型了。


    ## 步骤 3. 选择良好的数据视图。


    作为输入，机器学习模型接受数值值。例如，处理图像的模型会接受一个矩阵，显示每个颜色通道中每个像素的强度。


    ![`habrastorage.org/webt/pn/vo/ne/pnvonepkxguu1it2qb-nme0rjm0.png`](img/00005.gif)


    表示为数字数组的笑


    我们的数据集是一个句子列表，因此为了让我们的算法从数据中提取模式，我们必须首先找到一种以我们的算法可以理解的方式来呈现它。


    ### 独热编码（“词袋”）


    在计算机中显示文本的自然方式是将每个字符单独编码为数字（这种方法的一个示例是 `ASCII 编码`）。如果我们将这种简单的表示形式“喂”给分类器，它将不得不根据我们的数据从头开始研究单词的结构，这在大多数数据集上是不可能的。因此，我们应该使用更高层次的方法。


    例如，我们可以为数据集中所有的唯一单词构建一个字典，并为字典中的每个单词关联一个唯一的索引。每个句子就可以以列表的形式显示，其长度等于字典中唯一单词的数量，在列表的每个索引中，将存储该单词在句子中出现的次数。这种模型被称为“词袋”（`Bag
    of Words`），因为它完全忽略了句子的单词顺序。下面是这种方法的插图。


    ![`habrastorage.org/webt/uc/f9/sm/ucf9sm\_gzdytgyripyurqh7fbbe.png`](img/00006.jpeg)


    以“词袋”形式表示句子。原始句子在左侧，呈现方式在右侧。向量中的每个索引代表一个特定的单词。


    ### 可视化向量表示。


    “社交媒体灾难”字典包含大约 20,000 个单词。这意味着每个句子将由一个长度为 20,000 的向量表示。这个向量将主要包含零，因为每个句子只包含我们字典的一个小子集。


    为了找出我们的向量表示（`embeddings`）是否捕捉了与任务相关的信息（例如，推文是否与灾难有关），你应该尝试可视化它们，并看看这些类别分离得有多好。由于字典通常很大，且对
    20,000 个测量值进行数据可视化是不可能的，像主成分分析法（`PCA`）这样的方法可以帮助数据投影到两个维度。


    ![`habrastorage.org/webt/bu/a0/jk/bua0jkpnurkzdifvwunfhapbdom.png`](img/00007.jpeg)


    “词袋”向量表示的可视化


    从结果图来看，这两个类别似乎并没有像预期那样分离——这可能是我们表示方式的特征，或者仅仅是降维产生。为了找出“词袋”的能力对我们是否有用，我们可以基于它们训练一个分类器。


    ## 步骤 4. 分类


    当你第一次开始执行一项任务时，通常的做法是从可以解决此问题的最简单的方法或工具开始。在分类方面，使用逻辑回归（`logistic regression`）是因为它的多功能性和易于解释。


    我们将数据分为训练样本和测试样本，以看看我们的模型泛化能力如何。训练后，我们得到了 75% 的准确率。还不坏！猜最频繁的（“无关”）项会带给我们 57%。


    ## 步骤 5. 检查


    ### 错误矩阵


    第一步是理解我们的模型犯了哪些类型的错误，以及我们希望少遇到哪些类型的错误。如果我们资源有限，那么我们会优先考虑较低的假阴性率。可视化这些信息的方法是使用`错误矩阵`（error
    matrix），它将我们的模型预测与真实标记进行比较。理想情况下，此矩阵将是一条从左上到右角的对角线（这意味着我们的预测与事实完美吻合）。


    ![`habrastorage.org/webt/ks/u6/nl/ksu6nlmjjzznetbppnc4vb98.png`](img/00008.jpeg)


    我们的分类器产生的假阴性比假阳性多（按比例计算）。换句话说，我们模型中常见的常见的错误是将灾难错误地归类为无关。如果假阳性意味着执法部门的高昂成本，那么这可能是我们分类器的一个良好选择。


    ### 我们的模型的解释和解读


    为了验证我们的模型并解释其预测，查看它使用哪些单词来决策是非常重要的。如果我们的数据存在偏差，我们的分类器将在样本数据上做出准确的预测，但模型无法在现实世界中很好地泛化。下面的图显示了灾难类别和无关推文中最显著的单词。


    ![`habrastorage.org/webt/oq/ij/ko/oqijkopfrt-ataefzjonby8jpoq.png`](img/00009.jpeg)


    “词袋”：单词的含义


    ## 步骤 6. 考虑字典的结构


    TF-IDF


