    These more scientific uses of distributed representations and Deep Learning for
    modeling phenomena characterize the previous boom in neural networks. There has
    been a bit of a kerfuffle online lately about citing and crediting work in Deep
    Learning, and from that perspective, it seems to me that the two people who scarcely
    get mentioned any more are Dave Rumelhart and Jay McClelland. Starting from the
    Parallel Distributed Processing Research Group in San Diego, their research program
    was aimed at a clearly more scientific and cognitive study of neural networks.


    Now, there are indeed some good questions about the adequacy of neural network
    approaches for rule-governed linguistic behavior. Old timers in our community
    should remember that arguing against the adequacy of neural networks for rule-governed
    linguistic behavior was the foundation for the rise to fame of Steve Pinker—and
    the foundation of the career of about six of his graduate students. It would take
    too much space to go through the issues here, but in the end, I think it was a
    productive debate. It led to a vast amount of work by Paul Smolensky on how basically
    categorical systems can emerge and be represented in a neural substrate (Smolensky
    and Legendre 2006). Indeed, Paul Smolensky arguably went too far down the rabbit
    hole, devoting a large part of his career to developing a new categorical model
    of phonology, Optimality Theory (Prince and Smolensky 2004). There is a rich body
    of earlier scientific work that has been neglected. It would be good to return
    some emphasis within NLP to cognitive and scientific investigation of language
    rather than almost exclusively using an engineering model of research.


    Overall, I think we should feel excited and glad to live in a time when Natural
    Language Processing is seen as so central to both the further development of machine
    learning and industry application problems. The future is bright. However, I would
    encourage everyone to think about problems, architectures, cognitive science,
    and the details of human language, how it is learned, processed, and how it changes,
    rather than just chasing state-of-the-art numbers on a benchmark task.


    # NLP: How to Become a Natural Language Processing Specialist


    Along with the development of the field of Data Science, the demand for personnel
    for this industry is growing. So how do you become a specialist in such a part
    of data analysis as Natural Language Processing?


    The personnel market in this area is not very large. Although there seem to be
    many vacancies in Data Science, NLP tasks are rarely found in employers'' requests.
    And mainly companies in large cities Moscow, St. Petersburg, Novosibirsk, Yekaterinburg
    are looking for natural language processing specialists. At the same time, employers
    are not only corporations but also small teams of developers and even startups.
    So in the NLP segment for beginners, there are specific prospects.


    ## Specialties and tasks in natural language processing


    To understand how to become a specialist in natural language processing, let us
    first understand what tasks are solved in this area and in what areas of business
    these solutions are in demand.


    Language is a complex collection of different levels, such as syntax, morphology,
    semantics, and discourse.


    Each level has its specific tasks. However, in practice, most or all of the language
    levels are involved. For example, the classic tasks of syntax and morphology are
    tokenization (a division of the text into words) and lemmatization (reduction
    of a word to its original form). There are tasks for parsing a test (parsing),
    extracting entities - for example, names and geographical names. The problems
    of thematic modeling (highlighting topics in a large collection of documents)
    and determining emotional coloring are associated with semantics. The level of
    discourse influences the task of summarizing the text. Machine translation does
    involve all levels of the language. Speech recognition and generation are also
    part of the NLP.


    The next question is who needs all these tasks? Their mention can be seen in advertisements
    for employment in many areas of business. In particular, contact centers are interested
    in natural language processing, who need to operate with a massive flow of incoming
    requests: break them down into categories, identify topics, and automatically
    select answer options.


    Online stores are also looking for such specialists because they improve the search
    in their catalogs and implement interactive and recommendation systems. There
    is a request in the field of marketing and PR: to investigate the media coverage
    of the company and monitor whether the image is created by the audience positive
    or negative. In the same way, research feedback and comments on social networks.


    In many areas of business, chatbots are used; for example, they are in demand
    among banks that are looking for natural language processing specialists for their
    developments.


    In addition to such companies that need their systems to support their business
    processes, many B2B sector IT companies are looking for natural language processing
    specialists. They develop software solutions for sale to their customers. In particular,
    regardless of the industry, companies with a massive flow of incoming documents
    and requests may benefit from systems that optimize performance. It is necessary
    to distribute appeals by topics and departments, highlight the most important
    and negative ones, speed up translation into other languages, and improve the
    search in the company database. Many medium and large companies, sooner or later
    have to segment their customer base.


    ## Essential skills for an NLP specialist


    What skills are needed to master the profession of a natural language processing
    specialist?


    You need to understand that natural language processing consists of several components:
    knowledge of the language, knowledge of mathematics and statistics, and programming
    skills. Moreover, mathematics and programming are more critical than linguistics.


    There are general requirements that employers make for NLP job applicants. These
    include knowledge of mathematics, probability theory, statistics, knowledge of
    areas of applicability, understanding the pros and cons of various families of
    machine learning algorithms (such as logistic regression, various clustering algorithms,
    neural networks, boosting, and random forest).


    An NLP specialist needs to be able to work with databases and know `SQL`. Sometimes
    knowledge is required not only of relational databases and related tools (`PostgreSQL`,
    `MySQL`, `MS SQL`, `Oracle`) but also an understanding of NoSQL-systems (`Cassandra`,
    `Redis`, `MongoDB`). You may need to get familiar with the frameworks for working
    with big data and with various search engines.


    A prerequisite is knowledge of data structures.


    The next category of skills is related to language: an understanding of morphological,
    graphematical, and syntactic analysis is necessary. You need to have knowledge
    of algorithms and techniques specific to natural language processing tasks, to
    understand such things as thematic modeling, information retrieval, and distribution
    semantics.


    What programming language do you need to learn? There is no single answer. The
    most common request is in `Python`, less often NLP specialists require knowledge
    of `R`. To develop final solutions, programmers most often need `Java`, `C #`,
    `C ++`, `Scala`.


    The most common request is in `Python`, less often NLP specialists require knowledge
    of `R`.


    In addition, there is a set of technologies that you need to be able to handle.
    This is the Data Science technology stack for `Python`.

