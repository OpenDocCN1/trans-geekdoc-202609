    这些对分布式表示和深度学习进行现象建模的更科学用途，标志了上一波神经网络热潮。最近，关于深度学习工作的引用和归属问题在网络上引发了一些争议，从这个角度来看，在我看来，几乎不再被提到的两个人是戴夫·鲁梅特（Dave
    Rumelhart）和杰·麦克兰德（Jay McClelland）。从圣地哥的并行分布式处理小组开始，他们的研究计划旨在对神经网络进行更科学、更认知的研究。


    现在，对于神经网络方法处理规则驱动的语言行为的充分性，确实存在一些很好的问题。我们社区的老资历应该记得，反对神经网络处理规则驱动的语言行为的充分性，是史蒂夫·平克（Steve
    Pinker）成名的基础，也是他大约六名研究生职业生涯的基础。在这里详述这些问题需要花费太多空间，但最终我认为这是一场富有成效的辩论。它促成了保罗·斯莫伦斯基（Paul
    Smolensky）关于基本类别系统如何产生并在神经基质中被表示的大量工作（Smolensky and Legendre 2006）。事实上，保罗·斯莫伦斯基可以说走得太远了，将其职业的大部分精力用于开发一种新的音学类别模型——最优性理论（Prince
    and Smolensky 2004）。早期有大量的科学工作被忽视了。如果能在自然语言处理（NLP）中重新强调语言的认知和科学研究，而不是几乎完全地使用工程模型进行研究，那就很好。


    总的来说，我认为我们应该感到兴奋并高兴生活在这样一个时代，在这个时代，自然语言处理被视为机器学习进一步发展和工业应用问题的核心。未来是光明的。然而，我鼓励大家思考问题、架构、认知科学以及人类语言的细节（它是如何被学习、处理以及如何变化的），而不仅仅是追求基准任务中的顶尖数据。


    # NLP：如何成为自然语言处理专家


    随着数据科学领域的发展，该行业对人才的需求日益增长。那么，你该如何成为数据分析中自然语言处理这一领域的专家呢？


    该领域的人才市场并不是很大。尽管数据科学领域似乎有很多空缺，但在雇主的招聘中很少发现 NLP 任务。而且，主要是莫斯科、圣彼得堡、新西伯利亚和叶卡西德捷琳堡等大城市的公司在寻找自然语言处理专家。同时，雇主不仅包括大型公司，还有小型开发人员团队甚至是初创公司。因此，在
    NLP 初级阶段，有特定的前景。


    ## 自然语言处理中的专业领域与任务


    要理解如何成为自然语言处理专家，让我们首先了解该领域解决了哪些任务，以及这些解决方案在哪些业务领域存在需求。


    语言是不同层次的复杂集合，例如语法、形态、语义和话语。


    每个层次都有其特定的任务。但在实践中，大多数或所有语言层次都参与了其中。例如，语法和形态的经典任务是分词（将文本划分为单词）和词干还原（将单词还原为原始形式）。还有句法分析（解析）、实体提取（例如人名和地名）的任务。主题建模（在大规模文档集中突出主题）和确定情感色彩的问题与语义有关。话语层面影响着文本摘要任务。机器翻译确实涉及语言的所有层次。语音识别和生成也是
    NLP 的一部分。


    下一个问题是，谁需要这些任务？在许多业务领域的招聘广告中都可以看到这些任务。特别是呼叫中心对自然语言处理感兴趣，他们需要处理海量的入入请求：将它们分类、识别主题并自动选择答案选项。


    在线商店也在寻找此类专家，因为他们需要改进目录中的搜索，并实现交互和推荐系统。营销和公关领域也存在需求：调查公司的媒体报道，并监控观众营造的形象是积极还是消极的。同样，研究社交网络上的反馈和评论。


    在许多业务领域，聊天机器人被广泛使用；例如，银行在寻找自然语言处理专家进行其开发时就有这种需求。


    除了这些需要系统支持其业务流程的公司外，许多 B2B 领域的 IT 公司也在寻找自然语言处理专家。他们开发软件解决方案出售给客户。特别是，无论什么行业，拥有海量入入文档和请求的公司可能从优化性能的系统中受益。有必要按主题和部门分配申请，突出最重要和负面的申请，加速翻译成其他语言，并改进公司数据库的搜索。许多中大型公司早晚必须对其客户群进行细分。


    ## NLP 专家的必备技能


    掌握自然语言处理专家职业需要哪些技能？


    你需要理解自然语言处理由几个部分组成：语言知识、数学和统计学知识以及编程技能。此外，数学和编程比语言学更关键。


    雇主对 NLP 职位申请者有通用要求。这些包括数学知识、概率论、统计学、相关领域知识，以及对各种机器学习算法族类优缺的理解（如逻辑回归、各种聚类算法、神经网络、提升算法和随机森林）。


    NLP 专家需要能够与数据库工作并了解 `SQL`。有时需要的不仅是关系型数据库和相关工具（`PostgreSQL`、`MySQL`、`MS SQL`、`Oracle`），还需要理解
    NoSQL 系统（`Cassandra`、`Redis`、`MongoDB`）。你可能需要熟悉处理大数据的框架以及各种搜索引擎。


    数据结构知识是一个前提。


    下一类技能与语言有关：对形态、字形和句法分析的理解是必要的。你需要掌握针对自然语言处理任务的特定算法和技术，理解主题建模、信息检索和分布语义。


    你需要学习哪种编程语言？没有单一答案。最常见的请求是 `Python`，较少的情况需要 `R`。在开发最终解决方案时，程序员通常需要 `Java`、`C#`、`C++`
    和 `Scala`。


