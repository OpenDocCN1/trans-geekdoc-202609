- fmt: "\nFew people do not believe that the idea of deep models will also prove useful.\
    \ The sharing that occurs within deep representations can theoretically give an\
    \ exponential representational advantage, and in practice, offers improved learning\
    \ systems. The general approach to building Deep Learning systems is compelling\
    \ and powerful: The researcher defines model architecture and a top-level loss\
    \ function and then both the parameters and the representations of the model self-organize\
    \ so as to minimize this loss, in an end-to-end learning framework. We are starting\
    \ to see the power of such deep systems in recent work in neural machine translation\
    \ (Sutskever, Vinyals, and Le 2014; Luong et al. 2015).\n\nIntelligence requires\
    \ being able to understand bigger things from knowing about smaller parts. In\
    \ particular for language, understanding novel and complex sentences crucially\
    \ depends on being able to construct their meaning compositionally from smaller\
    \ parts words and multi-word expressions of which they are constituted. Recently,\
    \ there have been many, many papers showing how systems can be improved by using\
    \ distributed word representations from “deep learning” approaches, such as `word2vec`\
    \ (Mikolov et al. 2013) or `GloVe` (Pennington, Socher, and Manning 2014). However,\
    \ this is not actually building Deep Learning models, and there is hope in the\
    \ future that more people focus on the strongly linguistic question of whether\
    \ we can build meaning composition functions in Deep Learning systems.\n\n## Scientific\
    \ Questions That Connect Computational Linguistics and Deep Learning\n\nPeople\
    \ are encouraged to not get into the rut of doing no more than using word vectors\
    \ to make performance go up a couple of percent. Even more strongly, I would like\
    \ to suggest that we might return instead to some of the interesting linguistic\
    \ and cognitive issues that motivated no categorical representations and neural\
    \ network approaches.\n\nOne example of no categorical phenomena in language is\
    \ the POS of words in the gerund `V-ing` form, such as `driving`. This form is\
    \ classically described as ambiguous between a verbal form and a nominal gerund.\
    \ In fact, however, the situation is more complex, as `V-ing` forms can appear\
    \ in any of the four core categories of Chomsky (1970):\n\n![](images/00017.jpeg)\n\
    \nWhat is even more interesting is that there is evidence that there is not just\
    \ an ambiguity but mixed noun–verb status. For example, a classic linguistic test\
    \ for being a noun is appearing with a determiner, while a classic linguistic\
    \ test for being a verb is taking a direct object. However, it is well known that\
    \ the gerund nominalization can do both of these things at once:\n\n1. The not\
    \ observing this rule is that which the world has blamed in our satorist. (Dryden,\
    \ Essay Dramatick Poesy, 1684, page 310)\n2. The only mental provision she was\
    \ making for the evening of life, was the collecting and transcribing all the\
    \ riddles of every sort that she could meet with. (Jane Austen, Emma, 1816)\n\
    3. The difficulty is in the getting the gold into Erewhon. (Sam Butler, Erewhon\
    \ Revisited, 1902)\n\nThis is oftentimes analyzed by some sort of category-change\
    \ operation within the levels of a phrase-structure tree, but there is good evidence\
    \ that this is in fact a case of no categorical behavior in language.\n\nIndeed,\
    \ this construction was used early on as an example of a “squish” by Ross (1972).\
    \ Diachronically, the `V-ing` form shows a history of increasing verbalization,\
    \ but in many periods it shows a notably non-discrete status. For example, we\
    \ find clearly graded judgments in this domain:\n\n4. Tom’s winning the election\
    \ was a big upset.\n5. This teasing John all the time has got to stop.\n6. There\
    \ are no marking exams on Fridays.\n7. The cessation hostilities were unexpected.\n\
    \nVarious combinations of determiner and verb object do not sound so good, but\
    \ still much better than trying to put a direct object after a nominalization\
    \ via a derivational morpheme such as `-ation`. Houston (1985, page 320) shows\
    \ that assignment of `V-ing` forms to a discrete part-of-speech classification\
    \ is less successful (in a predictive sense) than a continuum in explaining the\
    \ spoken alternation between `-ing` vs. `-in’`, suggesting that “grammatical categories\
    \ exist along a continuum which does not exhibit sharp boundaries between the\
    \ categories.”\n\n8. [That kind [of knife]] isn’t used much.\n9. We are [kind\
    \ of] hungry.\n\nThe interesting thing is that there is a path of reanalysis through\
    \ ambiguous forms, such as the following pair, which suggests how one form emerged\
    \ from the other.\n\n10. [a [kind [of dense rock]]] \n11. [a [[kind of] dense]\
    \ rock]\n\nTabor (1994) discusses how Old English has kind but few or no uses\
    \ of kind of. Beginning in Middle English, ambiguous contexts, which provide a\
    \ breeding ground for the reanalysis, start to appear (the 1570 example in Example\
    \ (13)), and then, later, examples that are unambiguously the hedging modifier\
    \ appear (the 1830 example in Example (14)):\n\n12. A nette sent in to the see,\
    \ and of alle kind of fishis gedrynge (Wyclif, 1382)\n13. Their finest and best,\
    \ is a kind of course red cloth (True Report, 1570)\n14. I was kind of provoked\
    \ at the way you came up (Mass. Spy, 1830)\n\nThis is history not synchrony. Presumably\
    \ kids today learn the softener use of kind/sort of of first. Did the reader notice\
    \ an example of it in the quote in my first paragraph?\n\n15. NLP is kind of like\
    \ a rabbit in the headlights of the deep learning machine (Neil Lawrence, DL workshop\
    \ panel, 2015)\n\nWhitney Tabor modeled this evolution with a small, but already\
    \ deep, recurrent neural network—one with two hidden layers. He did that in 1994,\
    \ taking advantage of the opportunity to work with Dave Rumelhart at Stanford.\n\
    \nJust recently, there has started to be some new work harnessing the power of\
    \ distributed representations for modeling and explaining linguistic variation\
    \ and change. Sagi, Kaufmann, and Clark (2011)—actually using the more traditional\
    \ method of Latent Semantic Analysis to generate distributed word representations—show\
    \ how distributed representations can capture a semantic change: the broadening\
    \ and narrowing of reference over time. They look at examples such as how in Old\
    \ English deer was any animal, whereas in Middle and Modern English it applies\
    \ to one clear animal family. The words `dog` and `hound` have swapped: In Middle\
    \ English, `hound` was used for any kind of canine, while now it is used for a\
    \ particular sub-kind, whereas the reverse is true for `dog`.\n\nWe should feel\
    \ excited and glad to live in a time when NLP is so central to both machine learning\
    \ and industry application problems.\n\nKulkarni et al. (2015) use neural word\
    \ embedding to model the shift in meaning of words such as `gay` over the last\
    \ century (exploiting the online Google Books Ngrams corpus). At a recent ACL\
    \ workshop, Kim et al. (2014) use a similar approach—using `word2vec`—to look\
    \ at recent changes in the meaning of words. For example, in Figure 1, they show\
    \ how around 2000, the meaning of the word `cell` changed rapidly from being close\
    \ in meaning to `closet` and `dungeon` to being close in meaning to `phone` and\
    \ `cordless`. The meaning of a word in this context is the average over the meanings\
    \ of all senses of a word, weighted by their frequency of use.![figure\\_001](images/00018.jpeg)\n\
    \nFigure 1\n\nTrend in the meaning of cell, represented by showing its cosine\
    \ similarity to four other words over time (where 1.0 represents maximal similarity,\
    \ and 0.0 represents no similarity).\n"
