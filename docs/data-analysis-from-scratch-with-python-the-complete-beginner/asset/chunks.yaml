    算法通常是编程专业人士职业生涯的基石。你将它们理解为数据如何收集、排序并最终在其他过程中使用的描述。你可以预期以下关于算法的问题：


    ### 请列出四种排序算法？

    `Quicksort`（快速排序）、`insertion sort`（插入排序）、`selection sort`（选择排序）和 `bubble sort`（泡排序）。


    ### 桶排序是如何工作的？

    桶排序创建一个空数组并将每个对象放入桶中。每个桶按顺序排序，然后每个对象返回原始数组。


    ### 基数排序算法是如何工作的？

    基数排序允许你使用整数键而不是值来编辑数据。每段数据与具有相同数值和意义位置的数据分组。换句话说，基数排序有助于通过数字本身对数字进行排序。数字中的每个数字都是一个键。它可以使用计数序列或桶序列。


    ### 什么是计数排序算法？它什么时候有用？

    计数排序算法统计每个数据点的出现次数并据此进行排列，对于至少具有相对唯一值的数组最有用。可以通过它找到出现频率最高的值、频率最少的值、唯一值等。


    ## 4. 数据库

    数据库编码可能包括使用 `Python`、`Java` 和 `C #` 等语言来创建和实现基于 Web、云端和移动应用程序，个人和组织可以使用这些程序与信息集交互。并不是所有的编程职业都需要数据库管理系统的知识，但了解一些基本概念没有坏处。


    ### 定义“数据库”词。数据库管理系统提供哪些交互？

    任何包含数据库并允许对其使用、访问、更新和处理的电子系统。


    数据库管理系统 (`DBMS`) 允许管理员、应用程序、软件和终端用户与存储在数据库中的数据交互。


    ### 数据库管理系统如何提高文件系统的功能？

    文件系统可以直接与交互，但不必同时进行。数据库提供了文件系统与所使用的应用程序接口 (`APIs`) 之间的调介，并且更容易促进多个用户同时操作。然而，这些用户无法同时转换相同的数据。


    ### 数据库技术的三个类型是什么？

    - **结构 / 数据**：当编写需要保存、管理或读取数据、但不需要完整数据库应用的程序时非常有用。

    - **导航式**：导航数据库与层次模型或网络模型相关。它描述了一个以递归方式逐个处理对象的数据库。

    - **SQL / 关系型**：这意味着“结构化查询语言……用于检索或更新数据库中的信息。


    ### 规范化用于什么？

    规范化通过重新排列数据来消除冗余并节省磁盘空间。它通过创建多个表并描述它们之间的关系来实现这一点。


    ### DDL 和 DML 之间有什么区别？

    `DDL` 代表“数据定义语言……指定数据库的结构。`DML` 代表“数据处理语言”，并指定如何从该数据库中检索或修改数据。


    ### 为什么需要数据库分区？

    分区通过创建独立的、更稳定且更方便的独立文件系统，提高了效率和数据可用性，并尽可能减少了数据丢失。分区允许并行处理或对访问需求不同的分区进行分离。


    ### 什么是实体（entity）？什么是类？

    实体是一个独立的对象或数据点，例如人或地点。类将相同类型的实体分组。


    ## 5. 数组

    在 `Java` 中，实体是类的实例。例如：`Class = “car.”` 示例 `/entity = “Cadillac CTS.”`


    数组是编程中常用的数据结构，确定如何访问信息是一个至关重要的组件。如果你将变量作为基础构建块，数组是下一步。


    ### 使用数组解决问题

    让我们看看你是否知道运行数组以及如何解决一些基础问题：

    - 如何检查数组是否只包含数字？

    - 如何查找特定目录的所有权限？

    - 在整数数组 (1-100) 中找到缺失的数字。

    - 在整数数组中定位重复的数字。

    - 如何在包含多次迭代的数组中找到重复数字？

    - 给定一个无序整数数组，找到最大值和最小值。

    - 找到数组中每个与给定值相等的整数对。


    ## 6. 树

    以下三类（树、图和列表）在某些基本方面是相同的，但仍然需要一些在你的调用时应该调用的特定信息。你对在线性和非线性数据结构中的路径了解程度如何？


    在 `Java` 中，树包含了包（packages），这些包描述了如何处理列表。


    ### 什么是二叉搜索树？它是干什么用的？

    二叉树是一种数据结构，便于具有两个“孩子”的分叉数据操作。


    ### 请列出五种树类型。

    `Binary trees`（二叉树）、`binary search trees`（二叉搜索树）、`AVL trees`（AVL 树）、`B trees`（B
    树）、`B + trees`（B+ 树）。


    ### 树中的问题解决：

    - 二叉树如何？

    - 如何在给定的二叉树中计算几个叶子节点？

    - 如何检查树是否平衡？


    ## 7. 图形

    图（Graphs）是由多个节点和边或“角”组成的非线性数据结构。图形可以表示网络架构，并可以部署来解决实际问题。通常，它描述了重定向或非重定向的关系。


    ### 图的深度优先搜索或深度转换是什么？

    深度优先搜索 (`DFS`) 搜索图和树，从根节点开始，在每个分支返回之前尽可能地追踪。`DFS` 可用于检测图环、寻找路径以及寻找强连通分量。


    ### 图的广度优先搜索是什么？

    广度优先 (`BFS`) 首先检查兄弟节点，然后检查子节点。`BFS` 可用于发现网络中的最短路径。


    ### 图形问题解决：

    当给定的图被导出时，如何确定它的返回？


    ## 8. 列表

    列表是无序或可排序的数据结构。列表可以包含对象、字符串和整数。每部分数据都是列表中的下一个指针。


    ### 列表问题解决：

    - 如何检查链表是否包含环？如何找到环的起始节点？

    - 如何反转链表？

    - 如何找到单链表的长度？

    - 如何从未排序链表中删除重复节点？

    - 如何使用 `Stack`（栈）找到两个列表之和？


    ## 9. 网络

    网络从远处来说并不是一个新概念。然而，随着我们大多数技术和行业相互连接以及与 5G 网络连接，并且物联网扩展到数十亿设备，编程已无法帮助求职者重新定义网络基础知识。

