    The standardized frequency in energy measurement is one measurement every 15 minutes,
    due to the limitations existing with the technologies preceding Big Data. Increasing
    the frequency of measurements allows having a more detailed knowledge of what
    is happening at home and thus performing different activities with the information.
    Decreasing to a frequency of one measurement every second, for example, means
    a huge increase in the capacity needed to store and process information. Likewise,
    monitoring several devices in the same household, or breaking down the general
    consumption in several devices, is in turn a significant increase. In addition,
    the incorporation of almost all consumers to these measurement techniques would
    mean a significant increase in communications requirements,


    A home under these measurement requirements would cause transmission and storage
    of 1 kb per second. This implies the need for a system capable of receiving and
    storing 32 Petabytes per Million users per year (PMA). Additionally, it will be
    necessary to support the storage and processing of the operations to be carried
    out with all this information, which according to the functionalities that are
    intended to offer could increase this figure enormously.


    Among the requirements that are intended, are that a user can access the system
    remotely regularly (depending on the type of user from several times a day, once
    a month) and consult the consumption detail. In addition, the system, based on
    these consumption data, must be able to issue personalized recommendations for
    each user, energy recommendations, alerts about bad practices and predictions
    of consumption with the greatest certainty possible (all decision making ends
    up based on a prediction) , etc.


    ## Machine learning tools


    When it comes to machine learning, the use of a suitable tool can greatly simplify
    the work. First, `Weka` (Frank et al., 2010) is a much consolidated tool that
    has the main advantage of incorporating a large number of learning algorithms,
    so It can be a very useful software in previous phases of study, to test the algorithms,
    and analyze the data and possible trends or relationships between them. Its great
    disadvantage is that it does not offer support for Big Data, which has studied
    other alternatives more specific to the amount and variety of data that will be
    handled in the proposed system. Among them, `Mahout` (Owen et al., 2011) and `Jubatus`
    (Jubatus WebSite, 2011) stand out.


    `Mahout` is an Apache Open Source project, still under development, which offers
    a Java implementation of various machine learning algorithms, classification,
    clustering and recommendation. In its roadmap there is the approach of increasing
    and diversifying the types of algorithms supported. Its great advantage is the
    scalability it offers when running on `Hadoop` and its `MapReduce` architecture
    (Lam, 2010). This also gives you some simplicity for integration into a Cloud
    system.


    As for `Jubatus`, it is a framework that has the particularity that the learning
    it performs is online, that is, the model is updated in each iteration, so it
    does not require storage capacity and also allows offering a first response in
    a smaller space of time, increasing its accuracy over time. Its client / server
    architecture is also scalable and offers clients for several languages (`Java`,
    `Python`, `C ++`, `Ruby`) with a package of very new algorithms already implemented.
    Although as it is a recent project, there are still many algorithms to incorporate,
    especially those dealing with time series of data, whose intrinsic characteristics
    make them a particular case.


    ## Proposed system


    The proposed system, which can be seen graphically, will make use of the technologies
    described in the previous section, to perform automatic learning that helps improve
    the energy efficiency of the home through collaborative recommendations, predictions
    and data analysis.


    ### Collaborative Recommendations


    The function of this module is to suggest users to carry out actions that other
    similar users have performed in their homes and that have helped them reduce energy
    consumption.


    For this, it will be necessary to define the way to calculate the similarity between
    two users, or what is the same, the “distance” between them. To calculate this
    distance there are several algorithms, such as Pearson''s correlation coefficient,
    Euclidean distance, cosine, etc. These algorithms are based on the fact that users
    value the actions they take within a range of values, indicating their degree
    of acceptance.


    In the specific system that is proposed in this work, users do not give an assessment
    of how much they agree with the performance of an action, but they will limit
    themselves to saying whether they agree or not. That is, a user either does not
    accept the action (value 0) or accepts it completely (value 1). For this type
    of assessment, the most appropriate algorithms are those of `Tanimoto` (Cechinel
    et al., 2013), available in `Mahout`. The `Tanimoto` algorithm is based on the
    calculation of the `Tanimoto` similarity coefficient (1), which is also expressed
    as (2).


    ![](images/00021.gif)


    Where:


    `A` = number of actions taken by user 1


    `B` = number of actions taken by user 2


    `C` = number of common actions taken by users 1 and 2.


    Using this formula, all distances between users are calculated and an array is
    constructed where all this data is stored. At the time of making a recommendation
    to a user, the algorithm returns those actions that the users most similar to
    the user have performed, and that the user to whom we want to offer the recommendation
    has not yet performed.


    ### Predictions


    In order to achieve an efficient use of energy, a prediction system is provided,
    which will learn the consumption patterns of a certain address. This knowledge
    collects the behavior by technical aspects and by the habits of life, so that
    a user can predict their consumption and adapt their activities to more economically
    efficient energy habits (moving the actions to moments with a better rate) and
    more responsible environmentally


    The system generates several times a day, from massive amounts of information,
    a weekly consumption prediction for each user, as can be seen in Figure 5. To
    make this type of prediction, consumption factors are taken into account the user''s
    own, general consumption factors, and other external factors that are relevant,
    such as schedules, holiday calendars, prices, rates, meteorology...


    The strategy applied by the model allows defining and adjusting the way in which
    the system learns, what data is relevant, what data is not, and what data should
    be filtered or enhanced in learning. The use of a learning algorithm provides
    a memorization mechanism, capable of remembering and forgetting the situations
    experienced in adequate proportions, and of providing a consistent value for situations
    not previously occurred


    The model has been tested and trained with buildings located in several climatic
    zones and a satisfactory result has been obtained in all cases. The effectiveness
    of the prediction system has been evaluated by statistical analysis. The interpretation
    of these statistics allows the evaluation of the error made in the prediction
    and the way in which this error is distributed. The suitability of the technique
    is dependent on the interpretation of these statistics against situations to be
    detected or avoided.


    The tests carried out, whose result is shown in Table 1, provide a result of the
    application of the model on real data of a commercial establishment that presents
    the following values of these statistics:


    Table 1: Results of the evaluation of the effectiveness of the prediction system
    through statistics


    | Statistical || Climate Zone || Interpretation |


    | --- | --- | --- |

