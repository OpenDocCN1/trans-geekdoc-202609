    其中 `J` 是属性 `symbolic` 的值集合，`v` 是集合 `J` 中的一个值。`m` 将作为联合集合 `J` 中值的最佳处理方法，类似于数值属性的“中位数”，`m`
    将被集合 `J` 中的每个值所替换，而使方程值最小的 `m` 值即为符号属性值 `J` 联合的“平均值”。这个作为“中值”获取的符号属性值 `m`，可以替换该属性的每一个缺失值
    `v`，这所产生的影响与数值属性具有缺失值时获得的效果等效。通过这种方法，可以获得一个“正常”的训练集（无缺失属性），在这些集上执行与数值属性缺失时相同的概念，你将在分类中获得
    `best` 或类似的精确率，是的，它将使用原始联合训练数据。该想法的奇妙之处在于，在计算 `m` 时，它需要获取符号属性所有值之间的距离。也就是说，即计算
    `d(x_i, x_j)`，其计算次数等于集合中重复变化的次数，总元素数量等于该属性拥有的值数量，以便同时发送两个值。由于是符号属性不同值的数量 $A_i$，需要计算
    `A_i²` 次距离（即属性值可以形成的值对数量，其中元组中每个元素占据的顺序是有的），并且对于集合中至少有一个缺失值的每个符号属性，都必须计算这些距离。其中
    `d(x_i, x_j)` 是一个距离的函数，满足 `d(x, x) = 0`，这样就避免了重复进行之前的计算（值到自身的距离为零）。对于符号属性 `I`，其距离的数量为
    `A_i² - A_i`。也可以利用 `d(x, y) = d(y, x)` 的事实，从而进一步减少计算次数，但这会使括号内表达式的逻辑计算复杂化。对它计算符号值中值的优化方法是：在计算完符号属性的所有值相对于其第一个值的距离之和后，对于第二个值，如果改变该属性的其他值，使得累积的距离之和小于所有值相对于第一个值
    `v` 的距离之和（是的，它们遍历属性的所有值），如果属性所有值相对于第二个值的新距离之和小于收到的和，在这种情况下则记录新的较小距离和，并将这种情况下获取的属性值标记为增加。


    相反情况下，如果累积的距离之和小于切换到第三个属性值时的距离和，则没有必要运行所有值，我更新最小和，并继续计算所有值相对于第三个值的累积距离和，依此类推。遵循这一想法显著减少了计算量，其程度使得使用该提议来权衡算法复杂性的微小增加是值得的；在最坏情况下（即“中值”是属性值的最后一个值），对于具有更多不同值且至少有一个缺失值的属性，其相对于值数量呈二次方。


    ## ARISE 的优势


    1. 引入了一种处理缺失属性的替代策略，并得出了新代策略的益处。


    2. 采用了一种减少规则数量的策略，这在发现并实现它的同时，不会降低分类准确率。它通过删除被其他规则吸收的规则来实现。当满足以下条件时，一个规则吸收或包含另一个规则（且两个规则在所有属性上属于同一类）：


    - 如果属性是符号的：它们的值相等，或者在其中一个或两个规则中未给出该属性的值；

    - 如果属性是数值的：条件的下限小于或等于另一个，且上限（SUP）大于或等于另一个。


    3. 发现了引起分类不准确的成因，即训练中某一个用例存在多个实例的情况，这会产生事实上的规则，并将成为未来工作分析的对象。


    4. ARISE 对输入数据进行验证，并为非专业用户提供了获取案例以创建训练集的便利。


    5. 导出到多种语言：这有助于专家系统的最终创建。


    6. ARISE 与国际上著名的其他算法在 7 项测试中的结果表明，它的表现最好，同时也具备了激励人们选择它的优势。

