- fmt: '

    It is intended to show in this communication a compendium of what these machine
    learning techniques can be, as well as a comparative study of the alternatives
    that technology offers in order to carry them out. Taking into account that every
    solution proposed must be scalable, since the data used is generated increasingly
    over time, and the number of households that integrate this type of devices is
    increasing, the use of Big Data techniques will be crucial.


    For more than three decades, European Union (EU) has based its policy of improving
    energy efficiency on strategies aimed at reducing energy consumption and preventing
    energy waste. In this way, the EU tries to contribute decisively to competitiveness,
    security of supply and respect for the commitments made in the scope of the Kyoto
    Protocol on climate change (Grubb et al., 1999). Among the many potential sources
    of energy consumption reduction are housing, on which the Commission has focused
    its efforts, which are summarized in `Directive 2010/31 / EU` called `Energy performance
    in buildings` (Commission, 2010), where it is noted that within this area 40%
    of the final energy of the EU is consumed. On the other hand, on June 20, 2013,
    the study entitled “Energy efficiency certificates in buildings and their impact
    on the transition of prices and rentals in European Union countries” was published,
    whose conclusions show that mandatory energy certification initiatives such as
    `RD 235/2013` (Ballesteros and Shaw, 2013) will have a positive effect on the
    housing market, where those with better efficiency rates will be valued.


    However, in general all these initiatives have not had the expected impact in
    the short term and the user does not choose a house or another for its energy
    certification, or the most relevant criterion when the occasion of changing the
    appliance is presented is not usually its level of efficiency, but others such
    as its price or its benefits. And although indeed, awareness about climate change,
    the need to consume less and efficiently are increasingly present in our daily
    lives, the end user expects their home and the elements that integrate it to provide
    a better quality of life and not that it supposes an additional concern that in
    many cases does not understand or does not interest you.


    This is where projects such as Smart Home Energy (SHE) (SHE Consortium, 2012)
    are presented as authentic energy assistants that allow the end user to manage
    their home in an integral and unattended way to guarantee energy efficiency criteria
    and achieve at all times the minimum demand and consumption point. To achieve
    this goal, these types of systems rest on three fundamental pillars: monitoring,
    prediction through machine learning and control. In this way, projects such as
    the one presented in this communication, are able to characterize the energy behavior
    of a home and issue the appropriate recommendations or corrections for its self-management.


    The document is well organized as follows: first a study of related research will
    be done both to improve energy efficiency, and to apply similar techniques in
    other fields. Subsequently, we review the technological alternatives that support
    the proposed system, which is described in section 4 below, describing its main
    modules. Finally, conclusions and the future work will be presented in the last
    section.


    # State of the Art


    The basis of any self-learning model is characterized by its ability to predict
    the behavior of a system to develop control strategies for a specific purpose.
    The use of machine learning techniques has been successfully applied to other
    fields.


    Specifically, recommended systems based on user preferences and similarities are
    increasingly present in everyday environments and applications. One of the best
    known cases is the Amazon shopping website, where users receive recommendations
    based on purchases made by users considered similar (Linden et al., 2003). Similarly,
    the popular video on demand service Netflix uses the scores that users give to
    the movies they watch, to propose movies to other users with similar tastes (Xavier
    Amatriain, Justin Basilico, 2012). It is also very common to use these systems
    in partner search services to propose possible candidates to the users of the
    service.


    As for prediction, known are the cases of application of this type of techniques
    in the economy, to try to know the future evolution of the markets (Satchell and
    Knight, 2011), in medicine, where such techniques can help by example to anticipate
    a possible stroke (Khosla et al., 2010), etc. It is also possible to perform classification
    and identification tasks, as evidenced by various studies in the field of computer
    vision (Chechik et al., 2010) and the detection of malicious elements on the web
    (Ma et al., 2009).


    Returning to the topic of this communication, it is necessary to take into account
    that a house is a complex model that integrates different elements of consumption
    (appliances and electric vehicles), sources of uncertainty (outside temperature
    and behavior of occupants) and sources of energy production (air conditioning
    equipment, boilers, solar panels, other renewable energy). To design and then
    develop an energy management system, it is essential that it be able to predict
    parameters such as temperature or energy demand. Previous studies show that predictive
    models based on neural networks (González Lanza and Zamarño Cosme, 2002 Zamarreno,
    2005) and Support Vector Machines (`SVM`) (Zhao and Magoulès).


    # Technologies involved


    ## Data collection


    The acquisition of data comprises on one hand the hardware and on the other the
    software. Regarding the hardware, it is necessary to install smart meters in the
    home, which are capable of obtaining consumption every certain value.


    The SHE project aims to be hardware independent, and currently includes support
    for the `Current Cost EcoManager` (Current Cost, 2012) and `Plugwise` (Plugwise,
    2012) meters, which can be seen in Figure 1. Both are based on a network of devices
    that are located between the appliance and the plug and send data to another central
    device via radio frequency and ZigBee respectively.


    In addition, other household information (brightness, temperature, pollution level,
    etc.) can be collected through sensors.


    The data is extracted from the meters and sensors using a software adapter, and
    offered as an energy service through the Web Services for Devices (`WS4D`) technology
    (“Web Services for Devices (WS4D) Website,” 2012). This service will be consumed
    by the elements responsible for performing machine learning, which are described
    in section 4 of this document.


    ## Data storage and processing


    The data obtained from the home is stored centrally thanks to Cloud technology
    (Rhoton and Haukioja, 2011), which makes it not necessary to have large storage
    capacity in the home itself. It also offers facilities to manage and maintain
    the integrity, security and availability of data, storing replicas of the data
    to be used in case of loss of information.


    Another key technology in the system as it allows scalability is Big Data (Marz
    and Warren, 2013). Through an investment in linear technology in costs, it allows
    to cover the storage and processing needs, as well as an elastic management of
    the Information Technology (IT) infrastructure, adapting in size according to
    the needs. Big Data supports a large volume of data of various types, processing
    them in an allowable time. It also offers support for machine learning algorithms,
    visual data mining tools, near real-time monitoring, and a series of new possibilities
    for analysis and information processing that fit perfectly with the proposed system.

