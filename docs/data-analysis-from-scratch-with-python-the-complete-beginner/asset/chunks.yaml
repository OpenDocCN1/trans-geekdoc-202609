  raw: "The base libraries for any data analyst are pandas (for working with data\
    \ in tabular form), numpy (for working with large numerical arrays) and scipy\
    \ (for computing). For visualization, you may need the matplotlib and seaborn\
    \ libraries. Machine learning requires knowledge of the scikit-learn core library\
    \ and other specified libraries (e.g. XGBoost and LGBM for gradient boosting).\
    \ For the tasks of natural language processing, one needs to understand the contents\
    \ of special libraries: nltk, StanfordNLP, spacy, gensim, bigartm, word2vec, fasttext.\n\
    \nWe need experience in building deep neural networks using the frameworks Tensorflow,\
    \ Keras, PyTorch. And, of course, it is advisable to be able to work with tools\
    \ designed specifically for the Russian language, such as pymystem3, pymorphy\
    \ for morphological analysis, Tomita parser, yargy for extracting facts and entities.\
    \ Moreso, you need to be able to test methods of processing text data and know\
    \ the methods for assessing the quality of models.\n\nOf course, this is the maximum\
    \ program. Depending on the specific tasks of the employer, one or another programming\
    \ language, one or another stack of technologies may be needed. A plus for developers\
    \ of NLP solutions is the availability of their own projects on GitHub, as well\
    \ as certificates of participation in Kaggle and other machine learning competitions.\
    \ Adequate level of English is also expected from applicants, but this is a universal\
    \ requirement.\n\nWhere can I learn the NLP profession?\n\nIn NLP vacancies, in\
    \ most cases, a specialized education in computer science, computational mathematics,\
    \ physics, or related fields is required. Sometimes - not lower than a magistracy\
    \ or specialty.\n\nBut there are other options: for example, studying at a university\
    \ with a degree in computer linguistics. A graduate of such an educational program\
    \ is Polina Kazakova, Data Scientist in the IRELA project, an employee of the\
    \ MISiS Big Data Analysis Center. She is developing data analysis systems for\
    \ various companies, that is, just processing natural language.\n\nIs it worth\
    \ it to go to computer linguistics for the sake of working in NLP?\n\n“This computer\
    \ linguistics program itself has a good purpose: to combine theory with practice,”\
    \ says Polina. We had theoretical disciplines related to syntax, phonetics, morphology\
    \ and others, and there were attempts to introduce exact disciplines, such as\
    \ mathematical analysis, linear algebra, statistics, the basics of programming\
    \ and even machine learning. And machine learning, as you might imagine, has been\
    \ very actively used recently in natural language processing (although not in\
    \ all tasks, in some places the rule-based approach is still bypassed).\n\nReturning\
    \ to the program, it seems that the idea is cool so many things to combine. But\
    \ in practice, it then turns out that it is impossible to give two fundamental\
    \ formations in the same degree to one, so we had a very good fundamental linguistic\
    \ education and there was some kind of mathematics.\n\nProbably, this is enough\
    \ to start working in the field of NLP, but further more deep knowledge will still\
    \ be needed. After graduating from the undergraduate program, I realized that\
    \ I lacked fundamental knowledge from the basic course of mathematics. Therefore,\
    \ now, for example, I am independently engaged in matanalysis and linear algebra.\n\
    \nThe advice to people who want to engage in natural language processing: go to\
    \ a technical specialty and simultaneously study some linguistic things, because\
    \ in reality, highly specific knowledge of the language is very rarely useful\
    \ in the practical problems of machine learning, especially now, when there are\
    \ neural networks that, on a large set of well-marked data, themselves derive\
    \ all the rules that linguists could make manually. We can say that a good qualification\
    \ in linguistics can sometimes give some kind of profit in the NLP, but in most\
    \ cases, a good qualification in machine learning is more likely needed\n\nGo\
    \ to a technical specialty and simultaneously study some linguistic things\n\n\
    Who is involved in the markup of text data for neural networks and in general\
    \ for training machine learning models?\n\n\"This is a good question. Markup is\
    \ a common pain for everyone — linguists and machine learning and natural language\
    \ processing specialists,”says Polina Kazakova. It’s not easy to get good markup\
    \ of sufficient volume, for this you need people who will manually lay out the\
    \ data array. And linguists should deal with the compilation of the markup methodology\
    \ of the text. For example, for the task of tokenization, they must formulate\
    \ rules for dividing the text into words (given complex cases such as “sofa bed”,\
    \ “some”, “90th year”). And after that, you can already attract almost random\
    \ people who will mark up the text in accordance with the given rules. By the\
    \ way, interns who want to further develop in the direction of Data Science /\
    \ NLP can be engaged in this task - data markup. From time to time, such vacancies\
    \ appear.\n\nDespite the general need for graduates of technical specialties,\
    \ sometimes language experts are required in teams of programmers and mathematicians.\
    \ Polina recalls one such case: “Samsung has a voice assistant, and recently they\
    \ began to actively recruit linguists to work in Russia. They are engaged in speech\
    \ recognition and synthesis, and they hired my classmate, a cool theoretical phonetist,\
    \ despite the fact that she had no programming experience and did not know what\
    \ neural networks were. It was taken because of specific linguistic knowledge,\
    \ but in my opinion, this is an exceptional case.\"\n\nNLP Continuing Education\n\
    \nWhatever basic education you receive - linguistic or mathematical you can always\
    \ find that some knowledge is lacking, especially since NLP and Data Science are\
    \ actively developing. How to get additional education?\n\nSchool of Data Analysis\
    \ (SHAD) - Yandex program, training for which employers often mention as an advantage\
    \ of a potential candidate. As the name suggests, the basics of machine learning\
    \ and data analysis are given there. The format of the school is more like a full-time\
    \ magistracy than an additional education. The program is designed for two years,\
    \ full-time study in the evening (there are branches in Moscow, Minsk, Yekaterinburg\
    \ and Nizhny Novgorod) and correspondence for nonresident students. You can enter\
    \ the SHAD free of charge through the competition (which is rather difficult,\
    \ the competition is large), and in the case of a shortage of points, study for\
    \ a fee however, only in Moscow and only in person.\n\nShAD lecture notes on some\
