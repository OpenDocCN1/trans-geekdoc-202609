  trans: "\n聊天机器人（Chatbot）是一种发现用户需求并帮助满足这些需求的程序（如资金交易、酒店预订、文档准备）。今天，几乎每家公司都有用于与用户交互的聊天机器人。使用机器人的一些方式：\n\
    \n- 提供航班信息；\n- 让用户访问其财务信息；\n- 支持。\n\n可能性是无限的。\n\n聊天机器人的历史可以追溯到 1966 年，当时瑟夫·维森鲍（Joseph\
    \ Weizenbaum）开发了`ELIZA`计算机程序。该程序模仿治疗师的说话风格，仅包含 200 行代码。你现在仍然可以在网站上与 Eliza 聊天。\n\
    \n## 聊天机器人是如何工作的？\n\n机器人有两种：根据规则运行的和自学习的。\n\n第一类机器人根据其训练的某些规则回答问题。规则可以是简单的，也可以是非常复杂的。机器人可以处理简单的请求，但无法处理复杂的请求。\n\
    \n自学习机器人使用基于机器学习的方法创建，其效率远高于第一类机器人。自学习机器人分为两种：搜索型和生成型。\n\n搜索机器人使用启发式方法从预定义的副本库中选择答案。此类聊天机器人使用消息文本和对话上下文从预定义列表中选择答案。上下文包括对话树中的当前位置、所有之前的消息以及之前保存的变量（例如，`username`）。选择答案的启发式方法可以用不同的方式设计：从条件逻辑“二选一”到机器分类器。\n\
    \n生成机器人可以独立创建答案，并且并不总是以预定义的选项进行响应。这使得它们变得智能，因为此类机器人会学习请求中的每个单词并生成响应。\n\n## 在 Python\
    \ 中创建机器人\n\n假设你已经知道如何使用 `scikit` 和 `NLTK` 库。然而，如果你是自然语言处理（NLP）的新手，仍然可以阅读并学习相关文献。\n\
    \n### 自然语言处理 (NLP)\n\n自然语言处理是一项研究人类语言与计算机之间交互的领域。NLP 基于计算机科学、人工智能和计算语言学的综合。NLP\
    \ 是计算机以智能且有效的方式分析、理解和感悟人类语言的方法。\n\n### NLTK 简要介绍\n\n`NLTK`（自然语言工具包）是一个用于创建处理自然语言的\
    \ Python 程序的平台。`NLTK`为 50 多个公司和语言学资源（如 `WordNet`）提供了易于使用的接口，并提供了一组用于分类、分词、生成、标记、解析和语义理解的词处理库，以及一个用于商业用途的\
    \ NLP 库封装器。\n\n《Natural Language Processing with Python》一本书是关于语言处理编程的实用入门介绍。\n\
    \n#### 下载并安装 NLTK\n\n安装 NLTK：运行 `pip install nltk`。\n\n测试安装：运行 `python`，然后输入 `import\
    \ nltk`。\n\n#### 安装 NLTK 软件包\n\n导入 `NLTK` 并运行 `nltk.download()`。这将打开 NLTK 引导器，你可以在其中选择要下载的代码和模型版本。你可以一次下载所有包。\n\
    \n## 使用 NLTK 进行文本预处理\n\n数据的主要问题是它是文本格式呈现的。为了解决问题，机器学习算法需要特定的属性向量。因此，在开始创建一个 NLP\
    \ 项目之前，你需要对它进行预处理。文本预处理包括：\n\n- 将字母转换为大写或小写，以便算法不会重复处理相同的单词。\n- 分词（Tokenization）。分词是在将普通文本字符串转换为标记列表（即单词）的过程使用的使用的术语。报价分词器用于编译报价列表。单词分词器制作一个单词列表。`NLTK`\
    \ 包包含了用于英语的预训练 `Punkt` 分词器。\n- 消除噪声，即任何不是数字或字母的内容；\n- 删除停用词。有时，某些被认为对回答用户问题的重要性不小的极常见单词会被完全从字典中排除。这些单词被称为停用词（感叹、冠词、某些引导词）；\n\
    - 词干提取（Stemming）：将单词还原到根意义。例如，如果我们对“stem”、“stemming”、“stemmed”和“stemization”进行处理，结果将是一个单词——“stem”。\n\
    - 词还原（Lemmatization）。词还原与词干提取的方法略有不同。两者之间的主要区别是词干提取通常会产生不存在的单词，而词形（lemma）是一个真实的单词。因此，你的原始主题（即词干提取后得到的单词）并不总能在字典中找到，但词形可以。词还原的例子是：“run”是单词“running”或“ran”的基础，而“better”和“good”属于同一个词形，因此被认为是相同的。\n\
    \n### 词集\n\n在第一阶段的初步处理之后，你需要将文本转换为数字的向量（或数组）。“词集”是描述文本中单词出现情况的文本表示。“词集”由以下组成：\n\
    \n- 热词字典；\n- 每个单词在文本中出现的频率。\n\n为什么使用词集？这是由于文本中单词的顺序或结构信息被丢弃，模型只考虑某些单词在文本中出现的频率，而不考虑它们所在的位置。\n\
    \n“词集”的想法是，如果文本包含相似的单词，那么它们的内容就是是相似的。此外，你只能通过词集了解一些关于文本的内容知识。\n\n例如，如果字典包含单词 `{Learning,\
    \ is, the, not, great}`，而我们想要组成句子“Learning is great”，我们得到向量 `(1, 1, 0, 0, 1)`。\n\
    \n## TF-IDF 方法\n\n“词集”的问题在于，经常出现但不包含信息的单词可能会主导文本。此外，与短文本相比，“词集”赋予长文本更大的权重。\n\n\
    解决这些问题的方法之一是计算单词不在单个文本中而是在所有文本中的出现频率。由于此，例如文章“a”和“the”的贡献将被平衡。这种方法被称为 `TF-IDF`（词频-逆文档频率），它由两个阶段组成：\n\
    \n- `TF`：计算单词在单个文本中的出现频率\n  `TF = (单词 \"t\" 在文本中出现的次数) / (文本中的单词数)`\n- `IDF`：计算单词在所有文本中出现的稀有程度\n\
    \  `IDF = 1 + log (N / n)`，其中 `N` 是文本总数，`n` 是包含 `\"t\"` 的文本数量\n\n`TF-IDF` 是经常用于信息处理和文本挖掘的权重。它是一种用于单词对于一组文本中重要性的统计衡量标准。\n\
    \n### 示例\n\n考虑一个包含 100 个单词的文本，其中单词“phone”出现了 5 次。单词“telephone”的 `TF` 参数为 `(5/100)\
    \ = 0.05`。\n\n现在假设我们有 1000 万份文档，“phone”单词出现在其中一千份中。系数的计算方法为 `1 + log (10,000,000/1,000)\
    \ = 4`。因此，`TD-IDF` 为 `0.05 * 4 = 0.20`。\n\n可以通过如下方式在 `scikit` 中实现 `TF-IDF`：\n\n\
    ```python\nfrom sklearn.feature_extraction.text import TfidfVectorizer\n```\n\n\
    Otiai 系数\n"
- fmt: "\nTF-IDF is a transformation is applied to texts to obtain two real vectors\
    \ in vector space. Then we can get the Otiai coefficient of any pair of vectors\
    \ by calculating their elementwise product and dividing it by the product of their\
    \ norms. Thus, the cosine of the angle between the vectors is obtained. The Otiai\
    \ coefficient is a measure of the similarity between two nonzero vectors. Using\
    \ this formula, we can calculate the similarity between any two texts `d1` and\
    \ `d2`.\n\n`Cosine Similarity (d1, d2) = Dot product (d1, d2) / || d1 || * ||\
    \ d2 ||`\n\nHere `d1`, `d2` are two nonzero vectors.\n\n# Chatbot Training\n\n\
    In our example, we will use the Wikipedia page as text. Copy the contents of the\
    \ page and place it in a text file called `chatbot.txt`. You can immediately use\
    \ other text.\n\n### Import required libraries\n\n```python\nimport nltk\nimport\
    \ numpy as np\nimport random\nimport string # to process standard python strings\n\
    ```\n\n### Reading data\n\nLet's read the `corpus.txt` file and convert all the\
    \ text into a list of sentences and a list of words for further preprocessing.\n\
    \n```python\nf = open ('chatbot.txt', 'r', errors = 'ignore')\nraw = f.read ()\n\
