  trans: '


    机器学习允许对复杂数据集进行前所未有的理解，这使其在我们的整个社会、特别是认知神经科学中正发挥着日益重要的作用。这些应用在研究关于我们认知系统的基础问题，以及诊断某些影响该系统的重要疾病方面，已经取得了令人振奋的进展。尽管这些工作具有新颖性，但机器学习的灵活性让我们预测，机器学习最相关的贡献尚在未来。


    机器学习（Machine learning）指的是计算机科学中的一个子领域，专门用于识别数据集中复杂的模式。与经典编程不同——在经典编程中，程序会反复执行相同的（或不同程度复杂的）操作——机器学习的主要特征是其程序能够自主地从正在处理的数据中提取相关信息（即无需针对这些信息点进行专门编程）。这些信息允许程序进行“学习”，即在执行其被程序设定要完成的任务时不断提高其执行水平（Turing,
    1950）。通过开发复杂的算法（可以被理解为“模型”），这些方法使我们能够识别肉眼不可见的关系。这种类型的算法在日常生活中与我们互动，例如，当我们手机摄像头识别人脸时，或者当我们使用自动翻译应用时。从这个意义上说，这些工具的成功部分源于它们广泛的行动范围：从检测我们
    DNA 突变的系统（Libbrecht and Noble, 2015）到识别海量数据集中模式的“大数据”，例如关于我们社会的不同部门（Boyd and Crawford,
    2012）。正如预期的那样，认知科学也没有受到这些工具发展的影响。在文章库中（PubMed；检索日期：）简单查询“机器学习”和“脑”这两个术语即可……


    ### 但机器学习在实践中是如何工作的？为了回答这个问题，理解这些分析在认知神经科学领域内与更经典的方法相比具有哪些概念差异可能会有所帮助。


    假设我们研究的目标是比较两个大脑区域（X 区域和 Y 区域）对狗和猫的图像处理。对于每个区域，我们都获得了一个刺激激活模式（在图中，模式中的每个方块代表体素中的激活[黑色=激活；白色=未激活]，体素是磁共振成像中体积单位）。按照经典分析的逻辑，我们将对这些体素的活动进行平均处理。在所呈现的所有模式中，都有
    3 个体素被激活，3 个体素未被激活。因此，两种动物在两个区域的平均值是相同的，这表明它们参与处理狗和猫的方式是相似的。然而，我们可以观察到，


    尽管在这个例子中差异肉眼可见，但当我们面对的是更大规模的数据集时，这种观察似乎就变得复杂了。这正是研究人员使用机器学习技术，在我们所有数据的复杂性中检测出与不同表征相关的模式。基本上，这些技术的操作包括训练一种算法来区分两类（在我们的案例中是狗和猫），方法是展示与这两个类别都相关的模式（图中的黄色点和蓝色点）。通过这种方式，算法学习使用何种规则来分离每个类别的副本（在本例中是一条对角线）。关键步骤（“测试”）是展示新的未标记副本，以检查算法在将每个副本分配给相应类别时的准确性。通过这样，当一个大脑区域的活动允许对两个不同类别的样本进行随机水平水平分类时，我们将假设该区域对这些类别具有差异化表征。


    ### 这些假设在认知神经科学中有多重要？虽然经典技术让我们能够检测到哪些区域可能参与了某些过程，但无法理解在该区域编码了什么样的表征。因此，例如，在注意力任务期间激活前额叶层时，机器学习允许我们研究这种激活是基于非特异性控制过程（其中不同类别被相似地表征），还是相反，基于任务相关内容的差异化编码（Haynes,
    2015）。


    机器学习在更多临床背景下的应用尤为令人兴奋。例如，多项研究已经表明，如何从大脑结构图像检测出轻度认知障碍（TCL）患者未来是否会变成阿尔茨海症型痴呆（Moradi,
    Pepe, Gaser, Huttunen and Tohka, 2015）。在这项研究中，人员利用了机器学习的优点之一：从复杂数据集中提取显著规律。具体而言，他们向分类器提供了三个信息源：大脑结构状态图像、不同认知技能问卷的评分以及每个参与者的年龄，对象都是随后患上阿尔茨海症的
    TCL 患者，以及未患该疾病的 TCL 患者（在我们之前的例子中，这将对应不同的蓝色点）。该研究结果显示，算法仅使用大脑图像就能以 80% 的准确率区分这两组患者，当结合所有信息源时，这一百分比增加到
    90%。至关重要的是，这种结果使得诊断时间与其他可用工具相比可以提前 1 到 3 年，这对治疗来说是一个至关重要的优势


    ## 为数字家庭能源效率服务的机器学习技术


    资源的有效利用是当今社会面临的普遍挑战，欧盟委员会在其路线图中反映了这一点。在过去的十年中，该领域取得了巨大进展，增强了智能网络和智慧城市的概念。


    在家庭环境中普及使用智能电表和各种类型的传感器，可以容易且廉价地提取消费数据、亮度等。这属于从此类数据中学习并从中提取价值的想法的一部分。对用户消费习惯及其环境的了解将有助于采取能够提高能源效率的行动。


