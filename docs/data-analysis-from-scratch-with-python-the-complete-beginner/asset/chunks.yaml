    # 摘要


    目标是为健康专家提供一种易于使用的工具，使其能够实施人工智能（AI）技术，以支持基于临床方法的医学诊断。诊断支持是国际上引用最多的 AI 应用之一，特别是在机器学习的监督分类分支。


    `ARISE` 实现了一种基于博士论文主要发现的软件分类算法。它展示了 `RISE` 算法，即“基于示例集的规则归纳”（Rule Induction from
    a Set of Exemplars），该算法统一了学习范式中规则归纳和案例学习的最优思想，克服了两者单独使用时的局限性。实验结果表明，它在先进算法中处于特殊地位。


    在对国际范围内可测试训练集进行实验时，`ARISE` 显示其保持了分类准确率（这是最理想的质量），且处理速度的轻微下降是可以接受的。与古巴正在使用的实现其他分类算法的外国软件相比，它在有效上更胜一筹，且界面不需要用户具备专业知识，提供了从创建训练集到单个病例或病例组分类（诊断）的各种功能。


    # 机器学习


    机器学习面临着构建能够随经验自动改进的程序的挑战，从提供的导师或讲师知识库或先验（医学训练集或病例集）示例开始，学习系统创建概念的通用描述。


    数据挖掘生成类似于人类专家可能生成的信息，这符合可理解想法的开端。其目标是发现感兴趣的知识；如从存储在数据库、数据仓库（数据存储器）或任何其他信息存储媒介中的海量数据中的模式、关联、变化、异常和显著发信息。数据挖掘利用学习来自动使用方法寻找模式，其与数据库的区别在于观察的阶段。示例集构成了输入系统所需的信息。


    医学数据挖掘侧重于发现疾病与疾病之间、患者与患者之间、患者与疾病之间，以及患者、患者、患病实体、治疗方案、药物等之间所有可能的组合的相关趋势模型和关系。通常，那些通过临床方法不可见的方面都是潜在的。


    由于在医疗机构查询的临床病史或病例记录中，存在关于各种症状和体征的海量数据，使用自动学习数据挖掘技术来发现模式并从中提取知识已成为一项极具成效的努力。这将为医疗部门节省资源，并使医生成为诊断或临床方法的主角角。


    # 临床方法


    临床方法，也被称为临床问题解决或诊断方法，不仅是“通过应用科学方法研究个体的健康-疾病过程，以了解、评估和转化个体或主体的健康/疾病，并考虑到其对每个人所蕴含的意义”（J.
    Fernández Sacasas. 关于方法的开放对话。《Granma》报，第 3 页；2011 年 1 月 14 日）。


    临床方法包含所有医生在诊断患者健康问题时必须应用的一组步骤，包括：

    - 问诊或病史采集，以了解所呈现的症状。

    - 体格检查，通过探索手段寻找明确的体征。

    - 分类、关联、组合和整合发现的症状，以建立解释患者健康问题的诊断假设。

    - A) 是通过互补检查或患者的病情演变对这些假设进行测试。


    在出现不确定的情况下，将必须对每一个步骤进行完全重新评估。


    # 数据挖掘如何支持临床


    “诊断过程并不是发现的症状和体征的简单相加。正如贝尔（de Berger）所说，符号和症状的枚举并不等同于诊断，就像堆叠的砖块并不构成房子一样，因此最好每个人记住症状，它们有自己的层级，并且需要被放在相应的平面上进行诊断推理，存在某些方法可以将它们进行分组、组合和关联，因为诊断并不基于通过问诊、体格检查和互补检查获得的所有数据的总和，而是基于对真正相关信息的综合，并结合医生的经验和知识。”


    与上述陈述一致，这立即应用数据挖掘技术，即`特征选择`Selection of traits or feature cases），其在于选择相关或有价值的信息，并消除冗余或无关的信息，以便为特定的任务提供高效的挖掘过程，以发现诊断真正需要的症状和体征。


