  trans: '


    由于大数据出现之前的技术局限性，能量测量中的标准频率为每 15 分钟测量一次。增加测量频率可以对家庭正在发生的情况有更详尽的了解，并根据这些信息执行不同的活动。例如，将频率降低到每秒测量一次，意味着存储和处理信息所需的容量将巨大增加。同样，监控同一家庭内的多个设备，或将总耗量分解为多个设备，反过来也会显著增加需求。此外，将几乎所有消费者都纳入这些测量技术将意味着通信需求的大幅增加。


    一个满足这些测量要求的家庭将导致每秒 1 kb 的传输和存储。这意味着需要一个能够每年为每百万用户（PMA）接收并存储 32 字节（Petabytes）的系统。此外，还需要支持对所有这些信息执行的操作进行存储和处理，根据预期提供的功能，这一数字可能会极地增加。


    在预期的需求中，用户可以定期远程访问系统（取决于用户类型，从每天几次到每月一次）并查询耗量详情。此外，系统基于这些耗量数据，必须为每位用户提供个性化建议、能源建议、针对不良习惯的警报以及尽可能准确的用量预测（所有决策最终都基于预测）等。


    ## 机器学习工具


    涉及机器学习时，使用合适的工具可以极地简化工作。首先，`Weka` (Frank et al., 2010) 是一个非常成熟的工具，其主要优势是包含了大量的学习算法，因此它可以在研究的前阶段作为一个非常实用的软件，用于测试算法、分析数据以及它们之间可能的趋势或关系。它的主要缺点是不提供对大数据的支持，因此我们研究了其他更针对所提议系统中将处理的数据量和多样性的替代方案。其中，`Mahout`
    (Owen et al., 2011) 和 `Jubatus` (Jubatus WebSite, 2011) 脱颖而出。


    `**Mahout` 是一个 Apache 开源项目，仍在开发中，它提供了各种机器学习算法、分类、聚类和推荐的 Java 实现。在它的路线图中，有增加和多样化所支持的算法类型的方法。它的巨大优势是运行在
    `Hadoop` 及其 `MapReduce` 架构上时的可扩展性（Lam, 2010）。这也为集成到云系统提供了一些便利性。


    至于 `Jubatus`，它是一个框架，其特点在于它执行的学习是线性的，也就是说模型在每次迭代中都会更新，因此它不需要存储容量，并且允许在更短的时间内提供首次响应，随着时间的推移增加其准确性。它的客户端/服务器架构也是可扩展的，并为多种语言（`Java`、`Python`、`C
    ++`、`Ruby`）提供了已实现的最新算法包。尽管作为一个最近的项目，仍有许多算法待整合，特别是处理时间序列数据的算法，其内在特征使其成为一个特殊案例。


    ## 提议系统


    所提的系统（如图所示）将利用前一节描述的技术执行自动学习，通过协作推荐、预测和数据分析来帮助提高家庭能源效率。


    ### 协作推荐


    该模块的功能是建议用户执行其他相似用户在家庭中执行过的且帮助他们减少了能量消耗的活动。


    为此，有必要定义计算两个用户之间相似性的方法，或者说他们之间的“距离”。计算这种距离有多种算法，例如皮尔逊相关系数、欧几里得距离、余弦距离等。这些算法基于这样一个事实：用户对他们在取值范围内所采取的行动非常重视，这表明了他们的接受程度。


    在本文提出的特定系统中，用户并不会对某项行动表现的认可程度给出评分，而是仅限于表示他们是否同意。也就是说，用户要么不接受该行动（值 0），要么完全接受（值
    1）。对于这类评估，最合适的算法是 `Tanimoto` (Cechinel et al., 2013)，它可以在 `Mahout` 中可用`Tanimoto`
    算法基于 `Tanimoto` 相似系数 (1) 的计算，该系数也表示为 (2)。


    ![](img/00021.gif)


    其中：


    `A` = 用户 1 采取的活动数


    `B` = 用户 2 采取的活动数


    `C` = 用户 1 和 2 采取的共同活动数。


    使用该公式可以计算所有用户之间的距离，并构建一个存储所有数据的数组。在向用户提供推荐时，算法返回与该用户最相似的用户已执行、但我们想要提供推荐的用户尚未执行的活动。


    ### 预测


    为了实现能源的高效利用，提供了一个预测系统，它将学习特定地址的耗量模式。这种知识通过技术方面和生活习惯收集行为，以便用户可以预测自己的耗量并将活动调整为更具经济效益的能源习惯（将行动转移到费率更好的时刻）并对环境负责。


    系统每天从海量信息中为每位用户生成每周耗量预测，如图 5 所示。为了进行这种预测，需要考虑用户的耗量因素、通用耗量因素以及相关的外部因素，如日程、假期安排、价格、费率、气象……


    模型应用的策略允许定义和调整系统学习的方式、哪些数据是相关的、哪些不是，以及哪些数据在学习中应该被过滤或增强。使用学习算法提供了一种记忆机制，能够以适当的比例记忆和忘记经历的情况，并为以前未发生过的情况提供一致的值。


    该模型已在位于多个气候区的建筑进行了测试和训练，在所有情况下都获得了满意的结果。通过统计分析评估了预测系统的有效性。对这些统计数据的解释允许评估预测中产生的误差以及该误差分布的方式。该技术的适用性取决于对这些统计数据相对于要检测或避免的情况的解释。


    所进行的测试结果如表 1 所示，提供了模型在商业机构真实数据上的应用结果，该机构呈现出以下统计数据值：


    表 1：通过统计评估预测系统有效性的结果


    | 统计数据 || 气候带 || 解释 |


    | --- | --- | --- |


    '
