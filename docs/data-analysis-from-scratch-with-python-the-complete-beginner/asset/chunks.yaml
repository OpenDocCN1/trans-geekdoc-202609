    \ words in the neighborhood. Machine translation systems are widely used as translations\
    \ from languages of the world are an industry with a volume of $ 40 billion per\
    \ year. Some famous examples:\n\nGoogle Translate translates 100 billion words\
    \ per day.\n\nFacebook uses machine translation to automatically translate texts\
    \ in posts and comments to break down language barriers and allow people from\
    \ different parts of the world to communicate with each other.\n\neBay uses machine\
    \ translation technology to enable cross-border trade and connect buyers and sellers\
    \ from different countries.\n\nMicrosoft applies AI-based translation to end users\
    \ and developers on Android, iOS, and Amazon Fire, regardless of Internet access.\n\
    \nSystran was the first software provider to launch a neural machine translation\
    \ engine in 30 languages in 2016.\n\nIn traditional machine translation systems,\
    \ you have to use a parallel case - a set of texts, each of which is translated\
    \ into one or more other languages. For example, having the source language f\
    \ (French) and the target e (English), it is necessary to build a statistical\
    \ model that includes the probabilistic formulation for the Bayes rule, the translation\
    \ model p (f | e), trained on the parallel case, and the language model p (e),\
    \ trained only on the body with the English language.\n\nNeedless to say, this\
    \ approach misses hundreds of important details, requires a large number of manually\
    \ designed features, and consists of various and independent machine learning\
    \ tasks.\n\nNeural network Machine Translation (Neural Machine Translation) -\
    \ approach to modeling the translation with the help of a recurrent neural network\
    \ (Recurrent Neural Network, RNN). RNN - a neural network with dependence on previous\
    \ states, in which it has connections between passes. Neurons receive information\
    \ from previous layers, as well as from themselves in the previous step. This\
    \ means that the order in which data is input and the network is trained is important:\
    \ the result of submitting “Donald” - “Trump” does not coincide with the result\
    \ of submitting “Trump” - “Donald”.\n\nThe standard neural-machine translation\
    \ model is an end-to-end neural network, where the source sentence is encoded\
    \ by an RNN called an encoder, and the target word is predicted using another\
    \ RNN called a decoder. The encoder “reads” the original sentence at a rate of\
    \ one character per unit time, and then combines the original sentence in the\
    \ last hidden layer. The decoder uses the back propagation of the error to examine\
    \ this union and returns the translated version. Surprisingly, neuro-machine translation,\
    \ which was located on the periphery of research activity in 2014, became the\
    \ standard for machine translation in 2016. Below are the achievements of neural\
    \ network based translation:"
