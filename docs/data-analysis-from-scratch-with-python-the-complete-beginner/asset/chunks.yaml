    ## Software For The Application Of Automatic Learning Techniques For Medical Diagnosis


    The objective is to provide an easy-to-use tool by Health specialists that allows
    the application of Artificial Intelligence (AI) techniques in support of medical
    diagnosis based on the clinical method. Diagnostic support is among the most cited
    applications of AI internationally, in particular the Supervised Classification,
    branch of Machine Learning. The `ARISE` software implements a classification algorithm
    based on the main results of a doctoral thesis. It presents the `RISE` algorithm,
    for the acronym in English "Rule Induction from a Set of Exemplars" that unifies
    the best ideas of learning paradigms of rule induction and learning based on cases,
    overcoming the limitations that both suffer separately. The experimental results
    place it in a privileged place among the algorithms of the state of the art. `ARISE`
    introduces modifications to the seminal algorithm that prevent inadequacies in
    its application. Experiments with training sets available internationally for
    testing show that `ARISE` preserves the classification accuracy, the most desired
    quality, and the slight decrease in processing speed is not prohibitive. Compared
    with foreign software for use in Cuba, which implements other classification algorithms,
    they surpass them in efficiency and in an interface that does not require user
    expertise, providing functionalities ranging from the creation of training sets
    to classification (diagnosis) of individual cases or groups of cases.


