- fmt: "\n# End-to-end training\nParameters in `NMT` (Neural Machine Translation)\
    \ are simultaneously optimized to minimize the loss function at the output of\
    \ the neural network.\n\n### Distributed Representations\n`NMT` makes better use\
    \ of similarities in words and phrases.\n\n### Better context research\n`NMT`\
    \ works more contexts - source and partially target text to translate more accurately.\n\
    \n### Faster text generation\nText translation based on deep learning is far superior\
    \ in quality to the parallel corpus method.\n\n## The Problem of RNN\nThe main\
    \ problem of `RNN` is the problem of the disappearance of the gradient, when information\
    \ is lost over time. It seems intuitively that this is not a serious problem,\
    \ since it is only the weight, not the state of the neurons. But over time, weights\
    \ become places where information from the past is stored. If the weight is `0`\
    \ or `100000`, the previous state will not be too informative. As a result, `RNNs`\
    \ will have difficulty remembering words that are further in the sequence, and\
    \ predictions will be made based on extreme words, which create problems.\n\n\
    ## Short-term memory networks (LSTM)\nShort-term memory networks (Long / short\
    \ term memory, hereinafter referred to as `LSTM`) try to deal with the extinction\
    \ gradient problem by introducing gates and introducing a memory cell. Each neuron\
    \ is a memory cell with three gates: `input`, `output` and `forget`. These gates\
    \ act as bodyguards for information, allowing or disabling its flow.\n\n* The\
    \ `input gate` determines how much information from the previous layer will be\
    \ stored in this cell; \n* The `output gate` does the work on the other end and\
    \ determines how much of the next layer will know the state of the current cell.\n\
    * The `forgetting gate` controls the measure of keeping the value in memory: if\
    \ a new chapter begins when studying a book, sometimes it becomes necessary for\
    \ a neural network to forget some words from the previous chapter.\n\nIt has been\
    \ shown that `LSTMs` can learn from complex sequences and, for example, write\
    \ in Shakespeare style or compose primitive music. Note that each of the gates\
    \ is connected to a cell on the previous neuron with a certain weight, which requires\
    \ more resources to work. `LSTMs` are common and used in machine translation.\
    \ In addition, it is the standard model for most labeling tasks that consist of\
    \ a lot of data.\n\n![LSTM in machine translation](images/00025.jpeg)\n\n## Closed\
    \ recurrent units (GRU)\nClosed recurrent units (Gated recurrent units, hereinafter\
    \ referred to as `GRU`) differ from `LSTM`, although they are also an extension\
    \ for neural network machine learning. There is one less gate in `GRU`, and the\
    \ work is structured differently: instead of input, `output` and forgetting, there\
    \ is an `update gate`. It determine show much information needs to be saved from\
    \ the last state and how much information to skip from previous layers.\n\nThe\
    \ `reset gate` functions are similar to the `LSTM` forget switch, but the location\
    \ is different. `GRUs` always transmit their full state, do not have an output\
    \ shutter. Often these shutter functions like `LSTM`, however, the big difference\
    \ is the following: in `GRU`, the shutter is faster and easier to control (but\
    \ also less interpreted). In practice, they strive to neutralize each other, since\
    \ they need a large neural network to restore expressiveness, which negates the\
    \ gains as a result. But in cases where extra expressiveness is not required,\
    \ `GRUs` show better results than `LSTMs`.\n\n![GRU](images/00026.jpeg)\n\n##\
    \ Improvements in NMT\nIn addition to these three main architectures, over the\
    \ past few years, many improvements in neural network machine translation have\
    \ appeared. Below are some noteworthy developments:\n\n* **Sequence-to-Sequence\
    \ Learning with Neural Networks**: Has proven the effectiveness of `LSTM` for\
    \ neural machine translation.\n* **Neural Machine Translation by Jointly Align\
    \ and Translate**: Introduced the attention mechanism.\n* **Convolutional over\
    \ Recurrent Encoder**: Leverages `NMT` to capture wider context.\n\n## Voice assistants\n\
    A lot of articles have been written about conversational artificial intelligence\
    \ (`AI`), most of the developments focus on vertical chat bots, messenger platforms\
    \ (Amazon Alexa, Apple Siri, Google Assistant, Microsoft Cortana, Yandex Alice).\
    \ The ability of `AI` to understand natural language is still limited, so the\
    \ creation of a full-fledged conversational assistant remains an open task. However,\
    \ the work below is a starting point for people interested in a breakthrough.\n"
  raw: 'End-to-end training: parameters in NMT (Neural Machine Translation) are simultaneously
    optimized to minimize the loss function at the output of the neural network.


    Distributed Representations: NMT makes better use of similarities in words and
    phrases.


    Better context research: NMT works more contexts - source and partially target
    text to translate more accurately.


    Faster text generation: text translation based on deep learning is far superior
    in quality to the parallel corpus method.


    The main problem of RNN is the problem of the disappearance of the gradient, when
    information is lost over time. It seems intuitively that this is not a serious
    problem, since it is only the weight, not the state of the neurons. But over time,
    weights become places where information from the past is stored. If the weight
    is 0 or 100000, the previous state will not be too informative. As a result, RNNs
    will have difficulty remembering words that are further in the sequence, and predictions
    will be made based on extreme words, which create problems.


    Short-term memory networks (Long / short term memory, hereinafter referred to
    as LSTM) try to deal with the extinction gradient problem by introducing gates
    and introducing a memory cell. Each neuron is a memory cell with three gates:
    input, output and forget. These gates act as bodyguards for information, allowing
    or disabling its flow.


    The input gate determines how much information from the previous layer will be
    stored in this cell;


    The output gate does the work on the other end and determines how much of the
    next layer will know the state of the current cell.


    The forgetting gate controls the measure of keeping the value in memory: if a
    new chapter begins when studying a book, sometimes it becomes necessary for a
    neural network to forget some words from the previous chapter.


    It has been shown that LSTMs can learn from complex sequences and, for example,
    write in Shakespeare style or compose primitive music. Note that each of the gates
    is connected to a cell on the previous neuron with a certain weight, which requires
    more resources to work. LSTMs are common and used in machine translation. In addition,
    it is the standard model for most labeling tasks that consist of a lot of data.


    ![LSTM in machine translation](images/00025.jpeg)


    Closed recurrent units (Gated recurrent units, hereinafter referred to as GRU)
    differ from LSTM, although they are also an extension for neural network machine
    learning. There is one less gate in GRU, and the work is structured differently:
    instead of input, output and forgetting, there is an update gate. It determine
    show much information needs to be saved from the last state and how much information
    to skip from previous layers.


    The reset gate functions are similar to the LSTM forget switch, but the location
    is different. GRUs always transmit their full state, do not have an output shutter.
    Often these shutter functions like LSTM, however, the big difference is the following:
    in GRU, the shutter is faster and easier to control (but also less interpreted).
    In practice, they strive to neutralize each other, since they need a large neural
    network to restore expressiveness, which negates the gains as a result. But in
    cases where extra expressiveness is not required, GRUs show better results than
    LSTMs.


    ![GRU](images/00026.jpeg)


    In addition to these three main architectures, over the past few years, many improvements
    in neural network machine translation have appeared. Below are some noteworthy
    developments:


    Sequence-to-Sequence Learning with Neural Networks has proven the effectiveness
    of LSTM for neural machine translation. The article presents a general approach
    for sequential learning, which is characterized by minimal assumptions about the
    structure of the sequence. This method uses a multi-layer LSTM to display the
    incoming sequence as a vector with a fixed dimension, and then another LSTM is
    used to decode the target sequence from the vector.


    Neural Machine Translation by Jointly Learning to Align and Translate introduced
    the attention mechanism in the NLP (which will be discussed in the next part).
    Recognizing the fact that using a fixed-length vector is a bottleneck in improving
    NMT performance, the authors propose allowing models to automatically search for
    parts of the original sentence that are relevant to the prediction of the target
    word, without the need to explicitly form these parts.


    Convolutional over Recurrent Encoder for Neural Machine Translation leverages
    the standard RNN encoder in NMT with an additional convolution layer to capture
    a wider context at the output of the encoder.


    Google has created its own NMT system called Google''s Neural Machine Translation,
    which solves the problems of accuracy and ease of use. The model consists of a
    deep LSTM network with 8 coding and 8 decoding layers and uses both residual communications
    and attention communications from the decoder to the encoder network.


    Instead of using recurrent neural networks, Facebook AI Researchers use a convolutional
    neural network for sequence-to-sequence training tasks in NMT.


    Voice assistants


    A lot of articles have been written about conversational artificial intelligence
    (AI), most of the developments focus on vertical chat bots, messenger platforms,
    and startup opportunities (Amazon Alexa, Apple Siri, Facebook M, Google Assistant,
    Microsoft Cortana, Yandex Alice). The ability of AI to understand natural language
    is still limited, so the creation of a full-fledged conversational assistant remains
    an open task. However, the work below is a starting point for people interested
    in a breakthrough in voice assistants.


    Researchers from Montreal, Georgia Technical Institute of Technology, Microsoft
    and Facebook have created a neural network that can create context-sensitive conversation
    responses. This system can train on a large number of unstructured conversations
    on Twitter. The architecture of the recurrent neural network is used to answer
    the sparse questions that appear when integrating contextual information into
    the classical statistical model, which allows the system to take into account
    what was said earlier. The model shows a confident improvement over the content-sensitive
    and content-insensitive baseline of machine translation and information retrieval.


    Hong Kong-developed Neural Response Machine (hereinafter NRM - Neural Responding
    Machine) is a response generator for short text conversations. NRM uses a common
    codec framework. First, the creation of an answer is formalized, as a decryption
    process based on a hidden representation of the input text, while encoding and
    decoding is implemented using recurrent neural networks. NRM is trained on big
    data with monosyllabic dialogs compiled from micro-blogs. Empirically, it has
    been established that NRM is able to generate the correct grammar and relevant
    answers in this context for 75% of the input texts, outperforming modern models
    with the same settings.


    ![https://neurohive.io/wp-content/uploads/2018/09/1\_O7a0ShsYNCjxs-lNeux8MA-1-570x264.png](images/00027.gif)


    The latest model, Google''s Neural Conversational Model, offers a simple approach
    to modeling dialogs using the sequence-to-sequence framework. The model supports
    the conversation by predicting the next sentence using the previous sentences
    from the dialogue. The strength of this model is the ability to learn through,
    which requires a lot less man-made rules.


    The model is able to create simple dialogs based on an extensive dialogue training
    set, is able to extract knowledge from highly specialized datasets, as well as
    large and noisy common datasets of subtitles for films. In the highly specialized
    area of the help desk for IT solutions, the model finds solutions to a technical
    problem through dialogue. On noisy movie transcript datasets, the model is able
    to make simple reasoning based on common sense.


    Question and Answer (QA) systems'
