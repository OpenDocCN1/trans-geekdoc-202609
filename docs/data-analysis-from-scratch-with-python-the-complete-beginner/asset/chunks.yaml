  trans: '


    -   我们解释了她的预测；

    -   我们理解了她会犯什么样的错误；

    -   我们利用所学知识对下一步做出决策——是处理数据，还是处理更复杂的模型。


    我们通过一个特定的示例研究了这些方法，该模型是专为识别、理解和使用短文本（例如推文）而定制的；然而，这些理念也广泛适用于许多不同的任务。


    # 探究自然语言处理的重要性


    ## 深度学习的浪潮


    近年来，深度学习的浪潮已经拍击了计算语言学的岸边多年，但 2015 年似乎是这股海啸首次全方位冲击主要自然语言处理（NLP）会议的一年。然而，一些专家预测最终的损害将更加严重。在法国利尔举行的
    `ICML 2015` 期间，还有另一个规模相相当的活动：`2015` 深度学习研讨会。该研讨会以一场小组讨论结束终，在讨论中，尼尔·劳伦斯（Neil Lawrence）说：“NLP
    就像是深度学习机器车灯下的兔子，等待着被压扁。”这是一个计算语言学界必须严肃对待的言论！这是我们的终点吗？这些关于碾压的预测是从何而来的？


    2015 年 6 月，Facebook AI 研究实验室在巴黎开幕时，其主管扬恩·勒昆（Yann LeCun）表示：“深度学习的下一个大步是自然语言理解，其目的是赋予机器不仅理解单个单词，还能理解整个句子和段落的能力。”在
    2014 年 11 月的一次 Reddit AMA（提问与回答）中，杰夫·辛顿（Geoff Hinton）表示：“我认为未来五年最令人兴奋的领域将是真正理解文本和视频。如果年后我们还没有某种可以观看
    YouTube 视频并讲述发生了什么故事的东西，我将非常失望。几年后，我们将把[深度学习]放在一个可以放入人耳朵的芯片上，并拥有一个就像真正的‘巴别鱼’一样的英语解码芯片。”现代深度学习的第三位巨头尤雅亚·本尼奥（Yoshua
    Bengio）也日益将其小组的研究转向语言，包括最近神经机器翻译系统中令人兴奋的新进展。


    这不仅仅是深度学习研究者的问题。当领先的机器学习研究员迈克尔·乔丹（Michael Jordan）在 2014 年 9 月的 AMA 中被问及“如果你有一十亿美元用于一个你领导的巨型研究项目，你想做什么？”，他回答道：“我会用这十亿美元建立一个像
    NASA 规模的计划，专注于自然语言处理的所有光辉领域面（语义学、语用学等）。”他继续说道：“在智力上，我认为 NLP 是极其迷人的，它让我们能够关注高度结构化的推理问题，关注触及‘思维本质’的核心问题，但又保持着极强的实用性，而且这项技术无疑会让世界变得更好。”嗯，这听起来棒极了！那么，计算语言学研究者应该害怕吗？我认为不应该。回到杰夫·辛顿引入的《银河系漫游指南》主题，我们需要把书翻过来看看封底，上面用大大的、友好的字体写着：“‘不要慌’。”


    ## 深度学习的成功


    毫无疑问，深度学习在过去几年中带来了惊叹的技术进步。我不会详述所有的成功案例，但这里有一个例子。Google 最近的一篇博客文章介绍了 `Neon`，这是
    Google Voice 的新转录系统。在承认过去 Google Voice 的语音信箱转录往往无法完全理解后，该文章解释了 `Neon` 的开发，这是一个改进的语音信箱系统，可以提供更准确的转录，例如：“使用一种（深吸一口气）长短期记忆深度递归神经网络（呼！），我们将转录错误减少了
    49%。”难道我们不是都梦想过开发一种新方法来解决问题，让最先进系统的错误率减半吗？


    ## 为什么计算语言学家无需担心


    迈克尔·乔丹在 AMA 中给出了两个他认为深度学习无法解决 NLP 的理由，尽管他并不完全相信这一点：“尽管目前的深度学习研究倾向于涵盖 NLP，但与视觉领域相比，我对其结果方面的信心并不大；在
    NLP 案例中，比起视觉领域，可行的道路是结合大量数据与黑盒架构。”乔丹在第一点上是正确的：到目前为止，高级语言处理问题并没有看到显著的减少。


    ### 设计者是语言学专家和 NLP 专家


    另一方面，我不太相信他的第二个论点。然而，NLP 无需担心深度学习的两个理由：


    1. 机器学习领域最聪明、最有影响力的人认为 NLP 是一个值得关注的领域，这对我们的领域来说简直太棒了；

    2. 我们的领域是语言科学；核心问题不在于机器学习的最佳方法。


    约瑟·雷辛格（Joseph Reisinger）写道：“我经常听到初创公司推销所谓的‘通用机器学习’，坦率地说，这是一个非常荒谬的想法。机器学习不是无区别的体力活，它不像
    `EC2` 那样商品化，而且比编码更接近设计。”从这个角度来看，设计者是语言学专家和 NLP 专家。最近在 `ACL` 会议上，人们过度关注数字。


    我和许多其他合作者投入大量精力之一是开发通用依赖（Universal Dependencies）。目标是开发一种通用的句法依赖表示以及 POS 和特征标记集，并在所有语言中具有良好的语言保真度和可用性。这只是一个例子；我们的领域还有许多正在进行的努力。另一个目前的例子是抽象语义表示（Abstract
    Meaning Representation）。


    ## 语言的深度学习


    深度学习对 NLP 有何帮助？到目前为止，益处更多不是来自真正的深度学习（通过层次化的更抽象表示来促进泛化），而是来自分布式词表示的使用——通过对单词和概念使用实值向量表示。拥有所有单词之间相似性的稠密、多维表示在
    NLP 中极其有用，但不仅限于 NLP。事实上，分布式表示的重要性引发了早期神经网络方法热潮中的“并行分布式处理”格言，那种方法有更强的认知科学倾向（Rumelhart
    and McClelland 1986）。它能更好地解释人类的泛化，而且从工程角度来看，对单词使用低维稠密向量允许我们建模大规模上下文，从而大大提高了语言模型。特别是从这个新视角来看，增加传统词
    n-gram 模型阶数所带来的指数级稀疏性，在概念上是破产的。


