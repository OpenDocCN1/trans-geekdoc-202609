  trans: "\n\n# 端到端训练\n`NMT`（神经机器翻译）中的参数会同时进行优化，以最小化神经网络输出处的损失函数。\n\n### 分布式表示\n`NMT`\
    \ 更好地利用了词汇和短语之间的相似性。\n\n### 更好的上下文研究\n`NMT` 考虑更多的上下文——源文本和部分目标文本，以更准确地进行翻译。\n\n\
    ### 更快的文本生成\n基于深度学习的文本翻译在质量上远优于并行语料库方法。\n\n## RNN 的问题\n`RNN` 的主要问题是梯度消失问题，即信息随着时间的推移而丢失。直觉上看，这并不是一个严重的问题，因为影响的是权重而不是神经元的状态。但随着时间的推移，权重变成了存储过去信息的地方。如果权重为\
    \ `0` 或 `100000`，前一个状态将不会包含太多信息。结果是 `RNNs` 将难以记忆序列中较远的词汇，并且会根据极端词汇进行预测，从而产生问题。\n\
    \n## 短期记忆网络 (LSTM)\n短期记忆网络（长/短期记忆，以下简称 `LSTM`）试图通过引入门控和记忆单元来解决梯度消散问题。每个神经元都是一个带有三个门的记忆单元：`input`、`output`\
    \ 和 `forget`。这些门充当信息的保镖，允许或禁用其流动。\n\n* `input gate`（输入门）决定从上一层有多少信息将存储在此单元中；\n\
    * `output gate`（输出门）在另一端工作，并决定下一层有多少信息可以知道当前单元的状态。\n* `forgetting gate`（遗忘门）控制内存中值的保留程度：如果在学习一本书时开始了一个新章节，有时神经网络需要忘记上一章节的某些词。\n\
    \n已经证明，`LSTMs` 可以从复杂序列中学习，例如以莎士比亚风格写作或创作原始音乐。请注意，每个门都以特定的权重连接到上一个神经元的单元上，这需要更多资源来运行。`LSTMs`\
    \ 非常常见并被用于机器翻译。此外，它们是大多数包含大量数据的标记任务的标准模型。\n\n![LSTM in machine translation](img/00025.jpeg)\n\
    \n## 门控循环单元 (GRU)\n门控循环单元（Gated recurrent units，以下简称 `GRU`）与 `LSTM` 不同，尽管它们也是神经网络机器学习的扩展。`GRU`\
    \ 中少了一个门，其工作结构也不同：它不是输入、`output` 和遗忘门，而是一个 `update gate`（更新门）。它决定了需要从上一个状态保存多少信息，以及从之前的层中跳过多少信息。\n\
    \n[content]\n`reset gate`（重置门）的功能与 `LSTM` 的遗忘开关类似，但位置不同。`GRUs` 总是传输其完整状态，没有输出快门。这些快门功能通常类似于\
    \ `LSTM`，但主要的区别在于：在 `GRU` 中，快门速度更快且更容易控制（但解释性较差）。在实践中，它们倾向于相互抵消，因为它们需要大型神经网络来恢复表达能力，结果抵消了所带来的收益。但在不需要额外表达力的情况下，`GRUs`\
    \ 表现出比 `LSTMs` 更好的结果\n\n![GRU](img/00026.jpeg)\n\n## NMT 的改进\n除了这三种主要架构外，在过去的几年里，神经机器翻译出现了许多改进。以下是一些值得关注的发展：\n\
    \n* **基于神经网络的序列序列学习 (Sequence-to-Sequence Learning with Neural Networks)**：证明了\
    \ `LSTM` 在神经机器翻译中的有效性。\n* **通过联合对齐和翻译进行神经机器翻译 (Neural Machine Translation by Jointly\
    \ Align and Translate)**：引入了注意力机制。\n* **卷积编码器 (Convolutional over Recurrent Encoder)**：利用\
    \ `NMT` 捕捉更广泛的上下文。\n\n## 语音助手\n有很多关于对话人工智能 (`AI`) 的文章，大多数进展专注于垂直聊天机器人、即时通讯平台（Amazon\
    \ Alexa, Apple Siri, Google Assistant, Microsoft Cortana, Yandex Alice）。`AI` 理解自然语言的能力仍然有限，因此创建一个完善的对话助手仍然是一个未完成的任务。然而，以下的工作是对突破感兴趣的人的一个起点。\n\
    \n[/content]\n\n*(注：由于输入文本中存在重复的 [content] 标签且内容有重叠，译文已按要求进行了逻辑整合并确保不重复输出)*\n\n\
    **纠正：根据您的指令，重新提供完整的、干净的译文：**\n\n[content]\n# 端到端训练\n`NMT`（神经机器翻译）中的参数会同时进行优化，以最小化神经网络输出处的损失函数。\n\
    \n### 分布式表示\n`NMT` 更好地利用了词汇和短语之间的相似性。\n\n### 更好的上下文研究\n`NMT` 考虑更多的上下文——源文本和部分目标文本，以更准确地进行翻译。\n\
    \n### 更快的文本生成\n基于深度学习的文本翻译在质量上远优于并行语料库方法。\n\n## RNN 的问题\n`RNN` 的主要问题是梯度消失问题，即信息随着时间的推移而丢失。直觉上看，这并不是一个严重的问题，因为影响的是权重而不是神经元的状态。但随着时间的推移，权重变成了存储过去信息的地方。如果权重为\
    \ `0` 或 `100000`，前一个状态将不会包含太多信息。结果是 `RNNs` 将难以记忆序列中较远的词汇，并且会根据极端词汇进行预测，从而产生问题。\n\
    \n## 短期记忆网络 (LSTM)\n短期记忆网络（长/短期记忆，以下简称 `LSTM`）试图通过引入门控和记忆单元来解决梯度消散问题。每个神经元都是一个带有三个门的记忆单元：`input`、`output`\
    \ 和 `forget`。这些门充当信息的保镖，允许或禁用其流动。\n\n* `input gate` 决定从上一层有多少信息将存储在此单元中； \n* `output\
    \ gate` 在另一端工作，并决定下一层有多少信息可以知道当前单元的状态。\n* `forgetting gate` 控制内存中值的保留程度：如果在学习一本书时开始了一个新章节，有时神经网络需要忘记上一章节的某些词。\n\
    \n已经证明，`LSTMs` 可以从复杂序列中学习，例如以莎士比亚风格写作或创作原始音乐。请注意，每个门都以特定的权重连接到上一个神经元的单元上，这需要更多资源来运行。`LSTMs`\
    \ 非常常见并被用于机器翻译。此外，它们是大多数包含大量数据的标记任务的标准模型。\n\n![LSTM in machine translation](img/00025.jpeg)\n\
    \n## 门控循环单元 (GRU)\n门控循环单元（Gated recurrent units，以下简称 `GRU`）与 `LSTM` 不同，尽管它们也是神经网络机器学习的扩展。`GRU`\
    \ 中少了一个门，其工作结构也不同：它不是输入、`output` 和遗忘门，而是一个 `update gate`。它决定了需要从上一个状态保存多少信息，以及从之前的层中跳过多少信息。\n\
    \n`reset gate` 的功能与 `LSTM` 的遗忘开关类似，但位置不同。`GRUs` 总是传输其完整状态，没有输出快门。这些快门功能通常类似于 `LSTM`，但主要的区别在于：在\
    \ `GRU` 中，快门速度更快且更容易控制（但解释性较差）。在实践中，它们倾向于相互抵消，因为它们需要大型神经网络来恢复表达能力，结果抵消了所带来的收益。但在不需要额外表达力的情况下，`GRUs`\
    \ 表现出比 `LSTMs` 更好的结果。\n\n![GRU](img/00026.jpeg)\n\n## NMT 的改进\n除了这三种主要架构外，在过去的几年里，神经机器翻译出现了许多改进。以下是一些值得关注的发展：\n\
    \n* **基于神经网络的序列序列学习 (Sequence-to-Sequence Learning with Neural Networks)**：证明了\
    \ `LSTM` 在神经机器翻译中的有效性。\n* **通过联合对齐和翻译进行神经机器翻译 (Neural Machine Translation by Jointly\
    \ Align and Translate)**：引入了注意力机制。\n* **卷积编码器 (Convolutional over Recurrent Encoder)**：利用\
    \ `NMT` 捕捉更广泛的上下文。\n\n## 语音助手\n有很多关于对话人工智能 (`AI`) 的文章，大多数进展专注于垂直聊天机器人、即时通讯平台（Amazon\
    \ Alexa, Apple Siri, Google Assistant, Microsoft Cortana, Yandex Alice）。`AI` 理解自然语言的能力仍然有限，因此创建一个完善的对话助手仍然是一个未完成的任务。然而，以下的工作是对突破感兴趣的人的一个起点。\n"
