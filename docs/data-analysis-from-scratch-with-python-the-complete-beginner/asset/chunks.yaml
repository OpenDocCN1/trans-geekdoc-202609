    ## Vector representation (text embeddings)


    In the traditional NLP, words are treated as discrete characters, which are then
    represented as one-hot vectors. The problem with words discrete characters - the
    lack of a similarity definition for one-hot vectors, therefore, the alternative
    is to learn to code the similarity into the vectors themselves.


    Vector representation is a method of representing strings as vectors with values.
    A dense vector is constructed for each word so that the words found in similar
    contexts have similar vectors. The vector representation is considered the starting
    point for most NLP tasks and makes deep learning effective on small datasets.
    `Word2vec` and `GloVe` vector presentation techniques created by Google (`Mikolov`)
    Stanford (`Pennington`, `Socher`, `Manning`), respectively, are popular and are
    often used for NLP tasks. Let''s look at these techniques.


    ### Word2vec


    `Word2vec` accepts a large corpus of text in which each word in a fixed dictionary
    is represented as a vector. Next, the algorithm runs through each position `t`
    in the text, which is the central word `c` and the context word `o`. Next, the
    similarity of the word vectors for `c` and `o` is used to calculate the probability
    `o` for a given `c` (or vice versa), and the word vector continues to be adjusted
    to maximize this probability.


    ![vector representation of NLP](images/00022.gif)


    Useless words (or words with a high frequency of occurrence, in English - `a`,
    `the`, `of`, `then`) are removed from the dataset to achieve a better `Word2vec`
    result. This will help improve model accuracy and reduce training time. In addition,
    negative sampling is used for each input, updating the weights for all correct
    labels, but only on a small number of incorrect labels.


    `Word2vec` is presented in 2 variations of models:


    ![Skipgram NLP](images/00023.jpeg)


    **Skip-Gram**: A context window containing `k` consecutive words is examined.
    Next, one word is skipped and a neural network is trained that contains all the
    words except the missing one, which the algorithm is trying to predict. Therefore,
    if 2 words periodically share a similar context in the corpus, these words will
    have close vectors.


    **Continuous Bag of Words**: many sentences in the corpus are taken. Each time
    the algorithm sees a word, an adjacent word is taken. Next, context words are
    fed to the input of the neural network and we predict the word in the center of
    this context. In the case of thousands of such contextual words and the central
    word, we get one instance of the dataset for our neural network. The neural network
    trains and, finally, the output of the encoded hidden layer represents an embedding
    for a particular word. The same thing happens if a neural network trains on a
    large number of sentences and similar vectors are attributed to words in a similar
    context.


    The only complaints about `Skip-Gram` and `CBOW` are belonging to the class of
    window-based models, which are characterized by low efficiency of using statistics
    of matches in the case, which leads to suboptimal results.


    ### Glove


    `GloVe` strives to solve this problem by capturing the meaning of one word embedding
    with the structure of the entire visible body. To do this, the model looks for
    global matches in the number of words and uses enough statistics, minimizes the
    standard deviation, and produces the space of the word vector with a reasonable
    substructure. Such a scheme allows us to sufficiently equate the similarity of
    a word with a vector distance.


    ![Glove text embeddings](images/00024.jpeg)


    In addition to these two models, many recently developed technologies have found
    application: `FastText`, `Poincare Embeddings`, `sense2vec`, `Skip-Thought`, `Adaptive
    Skip-Gram`.


    ## Machine translate


    Machine translation conversion of text in one natural language into text equivalent
    in content in another language, does this program or machine without human intervention.
    Machine translation uses statistics on the use of words in the neighborhood. Machine
    translation systems are widely used as translations from languages of the world
    are an industry with a volume of $ 40 billion per year. Some famous examples:


    - Google Translate translates 100 billion words per day.

    - Facebook uses machine translation to automatically translate texts in posts
    and comments to break down language barriers and allow people from different parts
    of the world to communicate with each other.

    - eBay uses machine translation technology to enable cross-border trade and connect
    buyers and sellers from different countries.

    - Microsoft applies AI-based translation to end users and developers on Android,
    iOS, and Amazon Fire, regardless of Internet access.

    - Systran was the first software provider to launch a neural machine translation
    engine in 30 languages in 2016.


    In traditional machine translation systems, you have to use a parallel case -
    a set of texts, each of which is translated into one or more other languages.
    For example, having the source language `f` (French) and the target `e` (English),
    it is necessary to build a statistical model that includes the probabilistic formulation
    for the Bayes rule, the translation model `p(f | e)`, trained on the parallel
    case, and the language model `p(e)`, trained only on the English language.


    Needless to say, this approach misses hundreds of important details, requires
    a large number of manually designed features, and consists of various and independent
    machine learning tasks.


    Neural network Machine Translation (Neural Machine Translation) - approach to
    modeling the translation with the help of a recurrent neural network (Recurrent
    Neural Network, `RNN`). `RNN` - a neural network with dependence on previous states,
    in which it has connections between passes. Neurons receive information from previous
    layers, as well as from themselves in the previous step. This means that the order
    in which data is input and the network is trained is important: the result of
    submitting "Donald" - "Trump" does not coincide with the result of submitting
    "Trump" - "Donald".


    The standard neural-machine translation model is an end-to-end neural network,
    where the source sentence is encoded by an `RNN` called an `encoder`, and the
    target word is predicted using another `RNN` called a `decoder`. The `encoder`
    “reads” the original sentence at a rate of one character per unit time, and then
    combines the original sentence in the last hidden layer. The `decoder` uses the
    back propagation of the error to examine this union and returns the translated
    version. Surprisingly, neuro-machine translation, which was located on the periphery
    of research activity in 2014, became the standard for machine translation in 2016.
    Below are the achievements of neural network based translation:

