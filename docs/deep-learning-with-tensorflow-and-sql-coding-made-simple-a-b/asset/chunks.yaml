  trans: "\n强化学习（RL）是机器学习的一个分支，侧重于训练智能体在环境中做出序列决策，以最大化奖励信号。与监督学习不同，强化学习不依赖于标记的训练数据，而是通过与环境的试验交互进行学习。\n\
    \n## 12.2 强化学习基础\n\n在强化学习中，智能体以离散的时间步与环境交互。在每个时间步，智能体观察环境的当前状态并采取动作。环境转移到一个新状态，智能体根据其动作接收奖励信号。智能体的目标是学习一种能够最大化随时间积累奖励的策略。\n\
    \n## 12.3 深度强化学习\n\n深度强化学习将强化学习与深度神经网络相结合，允许智能体直接从高维感知输入（如图像或原始传感器数据）中学习。深度强化算法使用深度神经网络作为函数近似器来表示智能体的策略或价值函数。\n\
    \n## 12.4 深度 Q 网络 (DQN)\n\n深度强化学习的基础算法之一是深度 Q 网络（DQN）。DQN 将流行的强化学习算法 Q 学习与深度神经网络相结合，以处理高维状态空间。\n\
    \n在 DQN 中，智能体使用深度神经网络作为 Q 函数近似器，它用于估计在给定状态下每个可能动作的预期未来积累奖励。智能体通过根据预测 Q 值与观测奖励之间的时间差误差（temporal\
    \ difference error）迭代更新 Q 网络来学习。\n\n## 12.5 策略梯度方法\n\n策略梯度方法是另一类深度强化学习算法，它们直接优化智能体的策略。策略梯度方法不是估计\
    \ Q 值，而是使用深度神经网络对智能体策略进行参数化，并更新网络权重以最大化预期累积奖励。\n\n流行的策略梯度算法包括 REINFORCE、近端策略优化（PPO）和信赖区域策略优化（TRPO）。这些算法使用随机梯度上升和信赖区域等技术来更新策略网络的参数。\n\
    \n## 12.6 深度强化学习的应用\n\n### 12.6.1 游戏玩\n\n深度强化学习在游戏任务中取得了巨大的成功。由 DeepMind 开发的 AlphaGo\
