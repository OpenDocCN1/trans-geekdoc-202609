- raw: '\- NOT: Negates a condition, returning records that do not meet the specified
    condition.


    Example:


    \`\`\`sql


    SELECT \* FROM products


    WHERE category = ''Electronics'' AND price < 1000;


    \`\`\`


    In this example, we retrieve all records from the "products" table where the "category"
    column is ''Electronics'' and the "price" column is less than 1000.


    ### Section 3: Wildcard Operators


    Wildcard operators are used to match patterns within text or string values. They
    are particularly useful when you want to search for values that partially match
    a given pattern. The commonly used wildcard operators are:


    \- %: Matches any sequence of characters (zero or more).


    \- \_: Matches any single character.


    Example:


    \`\`\`sql


    SELECT \* FROM customers


    WHERE last\_name LIKE ''Sm%'';


    \`\`\`


    In this example, we retrieve all records from the "customers" table where the
    "last\_name" column starts with ''Sm''.


    ### Section 4: Combining Operators


    To create more sophisticated filters, you can combine multiple comparison operators,
    logical operators, and wildcard operators in the WHERE clause. This allows you
    to build intricate conditions based on your specific requirements.


    Example:


    \`\`\`sql


    SELECT \* FROM orders


    WHERE (order\_date >= ''2022-01-01'' AND order\_date <= ''2022-12-31'')


    AND (status = ''Shipped'' OR status = ''Delivered'');


    \`\`\`


    In this example, we retrieve all records from the "orders" table where the "order\_date"
    falls within the year 2022 and the "status" is either ''Shipped'' or ''Delivered''.


    ### Section 5: NULL Values


    In SQL, NULL represents missing or unknown data. When dealing with NULL values,
    special operators are used:


    \- IS NULL: Matches NULL values.


    \- IS NOT NULL: Matches non-NULL values.


    Example:


    \`\`\`sql


    SELECT \* FROM employees


    WHERE department IS NULL;


    \`\`\`


    In this example, we retrieve all records from the "employees" table where the
    "department" column contains NULL values.


    By understanding and applying these advanced filtering techniques, you can craft
    more complex and precise queries. This allows you to extract the exact data you
    need from your database tables. In the next chapter, we will explore joining tables
    together, enabling you to combine data from multiple tables into a single result
    set.


    # Chapter 5: Joining Tables


    In the previous chapters, we focused on querying data from a single table. However,
    many real-world scenarios require combining data from multiple tables. In this
    chapter, we will explore the concept of joining tables in SQL. Joining tables
    allows you to merge related data and obtain a comprehensive view of your information.
    By the end of this chapter, you will understand different types of joins, how
    to join tables using common columns, and how to retrieve data from joined tables.


    ### Section 1: Understanding Table Joins


    Table joins combine rows from two or more tables based on a related column between
    them. The most common types of joins are:


    \- Inner Join: Returns only the matching rows between the tables.


    \- Left Join: Returns all rows from the left table and the matching rows from
    the right table.


    \- Right Join: Returns all rows from the right table and the matching rows from
    the left table.


    \- Full Outer Join: Returns all rows from both tables, including the unmatched
    ones.


    ### Section 2: Inner Join


    The INNER JOIN combines rows from two tables that have matching values in the
    specified column. The syntax for an inner join is as follows:


    \`\`\`sql


    SELECT columns


    FROM table1


    INNER JOIN table2


    ON table1.column = table2.column;


    \`\`\`


    Example:


    \`\`\`sql


    SELECT orders.order\_id, customers.customer\_name


    FROM orders


    INNER JOIN customers


    ON orders.customer\_id = customers.customer\_id;


    \`\`\`


    In this example, we retrieve the order ID from the "orders" table and the customer
    name from the "customers" table, joining them on the common column "customer\_id."


    ### Section 3: Left Join


    The LEFT JOIN returns all rows from the left table and the matching rows from
    the right table. If there are no matches, NULL values are included for the columns
    of the right table. The syntax for a left join is as follows:


    \`\`\`sql


    SELECT columns


    FROM table1


    LEFT JOIN table2


    ON table1.column = table2.column;


    \`\`\`


    Example:


    \`\`\`sql


    SELECT customers.customer\_name, orders.order\_id


    FROM customers


    LEFT JOIN orders


    ON customers.customer\_id = orders.customer\_id;


    \`\`\`


    In this example, we retrieve the customer name from the "customers" table and
    the order ID from the "orders" table. All customers are included, even if they
    don''t have any orders. The unmatched order IDs will have NULL values.


    ### Section 4: Right Join


    The RIGHT JOIN returns all rows from the right table and the matching rows from
    the left table. If there are no matches, NULL values are included for the columns
    of the left table. The syntax for a right join is as follows:


    \`\`\`sql


    SELECT columns


    FROM table1


    RIGHT JOIN table2


    ON table1.column = table2.column;


    \`\`\`


    Example:


    \`\`\`sql


    SELECT customers.customer\_name, orders.order\_id


    FROM customers


    RIGHT JOIN orders


    ON customers.customer\_id = orders.customer\_id;


    \`\`\`


    In this example, we retrieve the customer name from the "customers" table and
    the order ID from the "orders" table. All orders are included, even if there is
    no corresponding customer. The unmatched customer names will have NULL values.


    ### Section 5: Full Outer Join


    The FULL OUTER JOIN returns all rows from both tables, including the unmatched
    ones. If there is no match, NULL values are included for the columns of the respective
    table. The syntax for a full outer join is as follows:


    \`\`\`sql


    SELECT columns


    FROM table1


    FULL OUTER JOIN table2


    ON table1.column = table2.column;


    \`\`\`


    Example:


    \`\`\`sql


    SELECT customers.customer\_name, orders.order\_id


    FROM customers


    FULL OUTER JOIN orders


    ON customers.customer\_id = orders.customer\_id;


    \`\`\`


    In this example, we retrieve the customer name from the "customers" table and
    the order ID from the "orders" table. All customers and orders are included, and
    NULL values are populated for unmatched customer-order pairs.


    ### Section 6: Combining Multiple Joins


    You can join more than two tables by extending the join clauses in your query.
    This allows you to retrieve data from multiple related tables in a single result
    set. Here''s an example:


    \`\`\`sql


    SELECT orders.order\_id, customers.customer\_name, products.product\_name


    FROM orders


    INNER JOIN customers


    ON orders.customer\_id = customers.customer\_id


    INNER JOIN order\_items


    ON orders.order\_id = order\_items.order\_id


    INNER JOIN products


    ON order\_items.product\_id = products.product\_id;


    \`\`\`


    In this example, we retrieve the order ID from the "orders" table, the customer
    name from the "customers" table, and the product name from the "products" table.
    We join the tables using the corresponding IDs in the "order\_items" table.


    ### Section 7: Alias Names


    When joining tables, it can be useful to assign alias names to tables or columns
    for brevity and readability. Alias names are temporary names assigned to tables
    or columns within a specific query. Here''s an example:


    \`\`\`sql


    SELECT c.customer\_name, o.order\_id


    FROM customers AS c


    LEFT JOIN orders AS o


    ON c.customer\_id = o.customer\_id;


    \`\`\`


    In this example, we assign the alias "c" to the "customers" table and the alias
    "o" to the "orders" table. This simplifies the query and makes it easier to reference
    the tables.


    By understanding and applying table joins, you can merge data from multiple tables
    and retrieve comprehensive information. Whether you need to combine related data
    or extract specific insights from your database, joins are a powerful tool. In
    the next chapter, we will explore aggregate functions, which allow you to perform
    calculations and summarize data in your SQL queries.


