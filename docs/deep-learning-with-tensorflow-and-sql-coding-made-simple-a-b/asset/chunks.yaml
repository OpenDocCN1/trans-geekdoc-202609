    In the previous chapters, we learned how to retrieve and join data from multiple
    tables. In this chapter, we will explore the concept of aggregate functions in
    SQL. Aggregate functions allow you to perform calculations on sets of values and
    summarize data in meaningful ways. Additionally, we will cover grouping data to
    further analyze and manipulate information based on specific criteria. By the
    end of this chapter, you will have a strong understanding of aggregate functions,
    such as `COUNT`, `SUM`, `AVG`, `MAX`, and `MIN`, and how to group data using the
    `GROUP BY` clause.


    ## Section 1: COUNT


    The `COUNT` function is used to count the number of rows or non-NULL values in
    a column. It is often used to calculate the total number of records in a table.
    Here''s the basic syntax:


    ```sql

    SELECT COUNT(column)

    FROM table;

    ```


    Example:


    ```sql

    SELECT COUNT(*) FROM customers;

    ```


    In this example, we retrieve the total number of records in the "customers" table.


    ## Section 2: SUM


    The `SUM` function calculates the sum of values in a numeric column. It is commonly
    used to calculate totals or cumulative sums. Here''s the syntax:


    ```sql

    SELECT SUM(column)

    FROM table;

    ```


    Example:


    ```sql

    SELECT SUM(price) FROM orders;

    ```


    In this example, we calculate the total sum of the "price" column in the "orders"
    table.


    ## Section 3: AVG


    The `AVG` function calculates the average value of a numeric column. It provides
    the mean value of the specified data. Here''s the syntax:


    ```sql

    SELECT AVG(column)

    FROM table;

    ```


    Example:


    ```sql

    SELECT AVG(age) FROM employees;

    ```


    In this example, we calculate the average age of employees in the "employees"
    table.


    ## Section 4: MAX


    The `MAX` function retrieves the maximum value from a column. It is used to find
    the highest value in a dataset. Here''s the syntax:


    ```sql

    SELECT MAX(column)

    FROM table;

    ```


    Example:


    ```sql

    SELECT MAX(salary) FROM employees;

    ```


    In this example, we retrieve the highest salary from the "employees" table.


    ## Section 5: MIN


    The `MIN` function retrieves the minimum value from a column. It is used to find
    the lowest value in a dataset. Here''s the syntax:


    ```sql

    SELECT MIN(column)

    FROM table;

    ```


    Example:


    ```sql

    SELECT MIN(quantity) FROM inventory;

    ```


    In this example, we retrieve the minimum quantity from the "inventory" table.


    ## Section 6: GROUP BY


    The `GROUP BY` clause is used to group data based on one or more columns. It allows
    you to aggregate and summarize data within each group. Here''s the syntax:


    ```sql

    SELECT column1, column2, ..., aggregate_function(column)

    FROM table

    GROUP BY column1, column2, ...;

    ```


    Example:


    ```sql

    SELECT category, COUNT(*)

    FROM products

    GROUP BY category;

    ```


    In this example, we group products by their category and calculate the count of
    products in each category.


    ## Section 7: HAVING


    The `HAVING` clause is used to filter groups based on specific conditions. It
    works similarly to the `WHERE` clause but operates on grouped data. Here''s the
    syntax:


    ```sql

    SELECT column1, column2, ..., aggregate_function(column)

    FROM table

    GROUP BY column1, column2, ...

    HAVING condition;

    ```


    Example:


    ```sql

    SELECT category, AVG(price)

    FROM products

    GROUP BY category

    HAVING AVG(price) > 1000;

    ```


    In this example, we group products by category, calculate the average price within
    each category, and retrieve only the categories with an average price higher than
    1000.


    In this chapter, we explored the power of aggregate functions in SQL. We learned
    how to use `COUNT`, `SUM`, `AVG`, `MAX`, and `MIN` to perform calculations on
    numeric data and obtain useful summaries. Additionally, we discovered the `GROUP
    BY` clause, which allows us to group data based on specific columns and apply
    aggregate functions within each group. The `HAVING` clause further enables us
    to filter groups based on conditions.


    By leveraging aggregate functions and grouping data, you can gain valuable insights
    and analyze your data in more meaningful ways. These techniques are particularly
