    \n请关注第 3 章：神经网络基础！\n\n# 第 3 章：神经网络基础\n\n## 3.1 神经网络简介\n\n神经网络是深度学习的核心，理解其基础组件对于构建更复杂的模型关重要。在本章中，我们将深入探讨神经网络的基础知识，探索其架构、激活函数和正向传播的概念。\n\
    \n## 3.2 神经网络架构\n\n神经网络由相互连接的神经元层（称为感知器）组成。每层接收输入、执行计算并将结果传递给下一层。神经网络中的三种主要层类型是输入层、隐藏层输出层。\n\
    \n输入层表示输入数据的特征。每个输入节点对应一个特定的特征或属性。隐藏层存在输入和输出层之间，负责从输入数据中提取复杂的模式。输出层根据网络学习的信息产生最终的预测或输出。\n\
