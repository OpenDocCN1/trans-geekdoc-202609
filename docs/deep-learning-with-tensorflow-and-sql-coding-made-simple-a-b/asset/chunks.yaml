    `COUNT`、`SUM`、`AVG`、`MAX` 和 `MIN`，以及如何使用 `GROUP BY` 子句对数据进行分组。


    ## 第 1 节：COUNT


    `COUNT` 函数用于统计行数或非 NULL 值的数量。它通常用于计算表中的记录总数。以下是基本语法：


    ```sql

    SELECT COUNT(column)

    FROM table;

    ```


    示例：


    ```sql

    SELECT COUNT(*) FROM customers;

    ```


    在此示例中，我们检索了“customers”表中记录的总数。


    ## 第 2 节：SUM


    `SUM` 函数计算数值列中值的总和。它通常用于计算总额或累加和。以下是语法：


    ```sql

    SELECT SUM(column)

    FROM table;

    ```


    示例：


    ```sql

    SELECT SUM(price) FROM orders;

    ```


    在此示例中，我们计算了“orders”表中“price”列的总总和。


    ## 第 3 节：AVG


    `AVG` 函数计算数值列的平均值。它提供了指定数据的算平均值。以下是语法：


    ```sql

    SELECT AVG(column)

    FROM table;

    ```


    示例：


    ```sql

    SELECT AVG(age) FROM employees;

    ```


    在此示例中，我们计算了“employees”表中员工的平均年龄。


    ## 第 4 节：MAX


    `MAX` 函数从列中检索最大值。它用于查找数据集中的最高值。以下是语法：


    ```sql

    SELECT MAX(column)

    FROM table;

    ```


    示例：


    ```sql

    SELECT MAX(salary) FROM employees;

    ```


    在此示例中，我们检索了“employees”表中最高的薪资。


    ## 第 5 节：MIN


    `MIN` 函数从列中检索最小值。它用于查找数据集中的最低值。以下是语法：


    ```sql

    SELECT MIN(column)

    FROM table;

    ```


    示例：


    ```sql

    SELECT MIN(quantity) FROM inventory;

    ```


    在此示例中，我们检索了“inventory”表中最小的数量。


    ## 第 6 节：GROUP BY


    `GROUP BY` 子句用于根据一或多列对数据进行分组。它允许你对组内的数据进行聚合和汇总。以下是语法：


    ```sql

    SELECT column1, column2, ..., aggregate_function(column)

    FROM table

    GROUP BY column1, column2, ...;

    ```


    示例：


    ```sql

    SELECT category, COUNT(*)

    FROM products

    GROUP BY category;

    ```


    在此示例中，我们根据类别对产品分组，并计算每个类别中产品的数量。


    ## 第 7 节：HAVING


    `HAVING` 子句用于根据特定条件过滤分组。它的工作与 `WHERE` 子句类似，但作用于分组后的数据。以下是语法：


    ```sql

    SELECT column1, column2, ..., aggregate_function(column)

    FROM table

    GROUP BY column1, column2, ...

    HAVING condition;

    ```


    示例：


    ```sql

    SELECT category, AVG(price)

    FROM products

    GROUP BY category

    HAVING AVG(price) > 1000;

    ```


    在此示例中，我们按类别对产品分组，计算每个类别的平均价格，并仅检索平均价格高于 1000 的类别。


    在本章中，我们探索了 SQL 聚合函数的威力。我们学习了如何使用 `COUNT`、`SUM`、`AVG`、`MAX` 和 `MIN`，以及如何使用 `GROUP
    BY` 子句对数据进行分组。

