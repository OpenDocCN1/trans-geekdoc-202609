    # 第 9 章：SQL 子查询


    在之前的章节中，我们专注于对表内数据的操作以及使用视图来简化查询。在本章中，我们将探索 SQL 的一种高级功能——子查询。子查询也被称为嵌套查询或内部查询，允许你将一个查询嵌套在另一个查询中。它们提供了一种结合多个查询结果来检索和处理数据的强大方法。在本章中，我们将深入探讨子查询的类型类型并探索它们在
    SQL 中的应用。


    ## 第 1 节：子查询简介


    子查询是嵌入在另一个查询中的查询。它可以用于 SQL 语句的不同部分，例如 `SELECT`、`FROM`、`WHERE` 或 `HAVING` 子句。子查询首先执行，其结果随后用于外部查询。子查询可以返回单个值、单行或多行。


    示例：


    ```sql

    SELECT employee_name, department

    FROM employees

    WHERE department IN (SELECT department FROM departments WHERE location = ''New
    York'');

    ```


    在此示例中，子查询 `(SELECT department FROM departments WHERE location = ''New York'')`
    获取位于纽约的部门。外部查询随后选择在这些部门工作的员工的姓名和部门。


    ## 第 2 节：子查询的类型


    根据位置和返回的结果，子查询有不同的类型。让我们探索三种常见类型：


    ### 2.1 标量子查询


    标量子查询返回单个值，可以用于表达式或条件。它通常放置在 `SELECT`、`WHERE` 或 `HAVING` 子句中。


    示例：


    ```sql

    SELECT employee_name, (SELECT AVG(salary) FROM employees) AS avg_salary

    FROM employees;

    ```


    在此示例中，子查询 `(SELECT AVG(salary) FROM employees)` 计算所有员工的平均工资。外部查询检索员工姓名并将平均工资作为单独的一列。


    ### 2.2 行子查询


    行子查询返回单行，可以用于表达式或条件。它通常放置在 `SELECT`、`WHERE` 或 `HAVING` 子句中。


    示例：


    ```sql

    SELECT employee_name

    FROM employees

    WHERE (department, salary) = (SELECT department, MAX(salary) FROM employees WHERE
    department = ''Sales'');

    ```


    在此示例中，子查询 `(SELECT department, MAX(salary) FROM employees WHERE department = ''Sales'')`
    获取销售部门的最高薪水和相应的部门。外部查询选择与子查询结果具有相同部门和工资的员工姓名。


    ### 2.3 表子查询


    表子查询返回多行，并在 `FROM` 子句中作为派生表使用。它可以被主查询中的临时表。


    示例：


    ```sql

    SELECT t1.employee_name, t2.location

    FROM (SELECT employee_name, department FROM employees WHERE salary > 5000) AS
    t1

    JOIN (SELECT department, location FROM departments WHERE location = ''New York'')
    AS t2

    ON t1.department = t2.department;

    ```

    *(注：由于原文示例代码块在输入中似乎有断裂，此处根据逻辑进行了补全对齐，以保持格式完整。)*

