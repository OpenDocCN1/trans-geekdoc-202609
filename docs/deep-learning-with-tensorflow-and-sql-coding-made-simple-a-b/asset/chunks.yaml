    ```\n\n## 2.4 构建你的神经网络\n\n现在你已经熟悉了基础知识，让我们构建你的第一个神经网络。我们将创建一个有一个隐藏层的简单前馈网络。首先，通过指定输入特征、隐藏单元和输出单元来定义网络架构。然后，初始化网络的权重和偏置。最后，使用激活函数实现网络的正向传播。\n\
    \n```python\ninput_features = 10\nhidden_units = 20\noutput_units = 2\n\n# 初始化权重和偏置\n\
