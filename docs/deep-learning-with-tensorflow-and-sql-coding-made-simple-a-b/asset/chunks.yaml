- raw: '### Section 4: Inserting Data into Tables


    Now that we have created our tables, we can start populating them with data. The
    INSERT statement allows us to add new records into a table. Here''s how you can
    insert data:


    1\. Identify the table into which you want to insert data.


    2\. Specify the columns for which you have values to insert.


    3\. Provide the corresponding values for the specified columns.


    Example:


    \`\`\`sql


    INSERT INTO customers (customer\_id, first\_name, last\_name, email)


    VALUES (1, ''John'', ''Doe'', ''john.doe@example.com'');


    \`\`\`


    In this example, we insert a new record into the "customers" table with values
    for the columns "customer\_id," "first\_name," "last\_name," and "email."


    You can insert multiple records at once by extending the VALUES clause with additional
    sets of values.


    ### Section 5: Updating and Deleting Data


    In addition to inserting data, SQL allows you to update and delete existing data
    within your tables.


    1\. Updating Data: The UPDATE statement allows you to modify existing data in
    one or more columns of a table. Use the SET clause to specify the new values for
    the columns and the WHERE clause to filter the rows to be updated.


    Example:


    \`\`\`sql


    UPDATE customers


    SET email = ''johndoe@example.com''


    WHERE customer\_id = 1;


    \`\`\`


    In this example, we update the "email" column of the "customers" table for the
    record with a "customer\_id" of 1.


    2\. Deleting Data: The DELETE statement enables you to remove one or more records
    from a table. Use the WHERE clause to specify the conditions that the rows must
    meet to be deleted.


    Example:


    \`\`\`sql


    DELETE FROM customers


    WHERE customer\_id = 1;


    \`\`\`


    In this example, we delete the record from the "customers" table where the "customer\_id"
    is 1.


    By mastering the concepts covered in this chapter, you have learned the fundamental
    skills required to create and manipulate databases using SQL. You now understand
    how to create databases, define tables, specify data types, insert data into tables,
    and modify existing data. In the next chapter, we will dive deeper into querying
    data using the SELECT statement, allowing you to retrieve specific information
    from your databases based on various conditions and criteria.


    # Chapter 3: Querying Data with SELECT


    In the previous chapter, we explored the basics of creating and manipulating databases
    using SQL. Now, in Chapter 3, we will focus on the SELECT statement, which is
    at the core of querying data from databases. The SELECT statement allows you to
    retrieve specific information from your tables based on various conditions and
    criteria. By the end of this chapter, you will have a solid understanding of how
    to query and filter data effectively.


    ### Section 1: Retrieving All Columns


    The simplest form of the SELECT statement is used to retrieve all columns from
    a table. Here''s the basic syntax:


    \`\`\`sql


    SELECT \* FROM table\_name;


    \`\`\`


    This statement returns all rows and columns from the specified table. The asterisk
    (\*) acts as a wildcard character representing all columns.


    Example:


    \`\`\`sql


    SELECT \* FROM customers;


    \`\`\`


    In this example, we retrieve all records and columns from the "customers" table.


    ### Section 2: Retrieving Specific Columns


    Often, you may not need all the columns from a table. The SELECT statement allows
    you to specify the exact columns you want to retrieve. Here''s the syntax:


    \`\`\`sql


    SELECT column1, column2, ... FROM table\_name;


    \`\`\`


    Example:


    \`\`\`sql


    SELECT first\_name, last\_name FROM customers;


    \`\`\`


    In this example, we retrieve only the "first\_name" and "last\_name" columns from
    the "customers" table.


    ### Section 3: Applying Filters with WHERE


    To retrieve specific records that meet certain conditions, you can use the WHERE
    clause in conjunction with the SELECT statement. The WHERE clause allows you to
    specify filtering criteria. Here''s the syntax:


    \`\`\`sql


    SELECT column1, column2, ...


    FROM table\_name


    WHERE condition;


    \`\`\`


    Example:


    \`\`\`sql


    SELECT \* FROM customers


    WHERE city = ''New York'';


    \`\`\`


    In this example, we retrieve all records from the "customers" table where the
    "city" column is equal to ''New York''.


    ### Section 4: Sorting Data with ORDER BY


    The ORDER BY clause allows you to sort the retrieved data in ascending (default)
    or descending order based on one or more columns. Here''s the syntax:


    \`\`\`sql


    SELECT column1, column2, ...


    FROM table\_name


    ORDER BY column1 \[ASC|DESC\], column2 \[ASC|DESC\], ...;


    \`\`\`


    Example:


    \`\`\`sql


    SELECT \* FROM customers


    ORDER BY last\_name ASC, first\_name ASC;


    \`\`\`


    In this example, we retrieve all records from the "customers" table and sort them
    in ascending order based on the "last\_name" column. For records with the same
    "last\_name," we sort them in ascending order based on the "first\_name" column.


    ### Section 5: Limiting Results with LIMIT


    The LIMIT clause allows you to restrict the number of rows returned in the result
    set. This is useful when dealing with large datasets or when you only need a specific
    number of records. Here''s the syntax:


    \`\`\`sql


    SELECT column1, column2, ...


    FROM table\_name


    LIMIT count;


    \`\`\`


    Example:


    \`\`\`sql


    SELECT \* FROM customers


    LIMIT 10;


    \`\`\`


    In this example, we retrieve the first 10 records from the "customers" table.


    ### Section 6: Combining Conditions with AND and OR


    You can combine multiple conditions in the WHERE clause using logical operators
    like AND and OR. This allows for more complex filtering criteria. Here''s an example:


    \`\`\`sql


    SELECT \* FROM customers


    WHERE city = ''New York'' AND age > 30;


    \`\`\`


    In this example, we retrieve records from the "customers" table where the "city"
    column is ''New York'' and the "age" column is greater than 30.


    By mastering the SELECT statement and its various clauses, you have gained the
    ability to retrieve specific data from your database tables based on your requirements.
    In this chapter, we covered retrieving all columns, selecting specific columns,
    applying filters with the WHERE clause, sorting data with ORDER BY, limiting results
    with LIMIT, and combining conditions using logical operators.


    In the next chapter, we will dive deeper into the WHERE clause and explore more
    advanced filtering techniques. You will learn about operators such as comparison
    operators, logical operators, and wildcard operators. These concepts will empower
    you to perform complex data queries and extract valuable insights from your databases.


    # Chapter 4: Advanced Filtering Techniques


    In the previous chapters, we explored the basics of SQL and learned how to retrieve
    data using the SELECT statement. In this chapter, we will delve into advanced
    filtering techniques using the WHERE clause. These techniques will allow you to
    perform more complex and precise queries on your database tables. By the end of
    this chapter, you will have a solid understanding of comparison operators, logical
    operators, wildcard operators, and how to combine them effectively.


    ### Section 1: Comparison Operators


    Comparison operators are used to compare values and define conditions in the WHERE
    clause. They allow you to filter data based on equality, inequality, and other
    comparisons. Here are some commonly used comparison operators:


    \- Equal to: =


    \- Not equal to: <>


    \- Greater than: >


    \- Less than: <


    \- Greater than or equal to: >=


    \- Less than or equal to: <=


    Example:


    \`\`\`sql


    SELECT \* FROM employees


    WHERE salary > 50000;


    \`\`\`


    In this example, we retrieve all records from the "employees" table where the
    "salary" column is greater than 50000.


    ### Section 2: Logical Operators


    Logical operators allow you to combine multiple conditions in the WHERE clause
    to create more complex filtering criteria. The commonly used logical operators
    are:


    \- AND: Returns records if all the specified conditions are true.


    \- OR: Returns records if any of the specified conditions are true.'
