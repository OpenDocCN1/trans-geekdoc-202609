    # Chapter 9: SQL Subqueries


    In the previous chapters, we focused on manipulating data within tables and using
    views to simplify queries. In this chapter, we will explore an advanced feature
    of SQL called subqueries. Subqueries, also known as nested queries or inner queries,
    allow you to nest one query within another query. They provide a powerful way
    to retrieve and manipulate data by combining the results of multiple queries.
    In this chapter, we will dive into different types of subqueries and explore their
    applications in SQL.


    ### Section 1: Introduction to Subqueries


    A subquery is a query that is embedded within another query. It can be used in
    various parts of a SQL statement, such as the SELECT, FROM, WHERE, or HAVING clauses.
    The subquery is executed first, and its result is then used in the outer query.
    Subqueries can return a single value, a single row, or multiple rows.


    Example:


    \`\`\`sql


    SELECT employee\_name, department


    FROM employees


    WHERE department IN (SELECT department FROM departments WHERE location = ''New
    York'');


    \`\`\`


    In this example, the subquery \`(SELECT department FROM departments WHERE location
    = ''New York'')\` retrieves the departments located in New York. The outer query
    then selects the employee name and department for employees working in those departments.


    ### Section 2: Types of Subqueries


    There are different types of subqueries based on their placement and the results
    they return. Let''s explore three common types:


    #### 2.1 Scalar Subqueries:


    A scalar subquery returns a single value and can be used in expressions or conditions.
    It is typically placed in the SELECT, WHERE, or HAVING clauses.


    Example:


    \`\`\`sql


    SELECT employee\_name, (SELECT AVG(salary) FROM employees) AS avg\_salary


    FROM employees;


    \`\`\`


    In this example, the subquery \`(SELECT AVG(salary) FROM employees)\` calculates
    the average salary of all employees. The outer query retrieves employee names
    and includes the average salary as a separate column.


    #### 2.2 Row Subqueries:


    A row subquery returns a single row and can be used in expressions or conditions.
    It is typically placed in the SELECT, WHERE, or HAVING clauses.


    Example:


    \`\`\`sql


    SELECT employee\_name


    FROM employees


    WHERE (department, salary) = (SELECT department, MAX(salary) FROM employees WHERE
    department = ''Sales'');


    \`\`\`


    In this example, the subquery \`(SELECT department, MAX(salary) FROM employees
    WHERE department = ''Sales'')\` retrieves the maximum salary and corresponding
    department for the Sales department. The outer query selects the employee name
    for employees who have the same department and salary as the subquery result.


    #### 2.3 Table Subqueries:


    A table subquery returns multiple rows and is used in the FROM clause as a derived
    table. It can be treated as a temporary table within the main query.


    Example:


    \`\`\`sql


    SELECT t1.employee\_name, t2.department


    FROM (SELECT employee\_name, department FROM employees WHERE salary > 50000) AS
    t1


    JOIN (SELECT department, location FROM departments WHERE location = ''New York'')
    AS t2


    ON t1.department = t2.department;


    \`\`\`


    In this example, the subqueries \`(SELECT employee\_name, department FROM employees
    WHERE salary > 50000)\` and \`(SELECT department, location FROM departments WHERE
    location = ''New York'')\` create derived tables t1 and t2, respectively. The
    outer query joins these derived tables based on the department and retrieves the
    employee name and department for employees with salaries over 50000 in the New
    York location.


    ### Section 3: Subqueries with Operators and Functions


    Subqueries can be used with various operators and functions to perform more advanced
    operations. Let''s explore a few examples:


    #### 3.1 Subqueries with Comparison Operators:


    \`\`\`sql


    SELECT employee


    \_name, salary


    FROM employees


    WHERE salary > (SELECT AVG(salary) FROM employees);


    \`\`\`


    In this example, the subquery \`(SELECT AVG(salary) FROM employees)\` calculates
    the average salary of all employees. The outer query retrieves the employee name
    and salary for employees whose salary is greater than the average.


    #### 3.2 Subqueries with EXISTS Operator:


    \`\`\`sql


    SELECT department\_name


    FROM departments d


    WHERE EXISTS (SELECT \* FROM employees e WHERE e.department\_id = d.department\_id);


    \`\`\`


    In this example, the subquery \`(SELECT \* FROM employees e WHERE e.department\_id
    = d.department\_id)\` checks if there are any employees in each department. The
    outer query retrieves the department names for departments that have at least
    one employee.


    #### 3.3 Subqueries with IN Operator:


    \`\`\`sql


    SELECT product\_name


    FROM products


    WHERE product\_id IN (SELECT product\_id FROM orders WHERE order\_date >= ''2023-01-01'');


    \`\`\`


    In this example, the subquery \`(SELECT product\_id FROM orders WHERE order\_date
    >= ''2023-01-01'')\` retrieves the product IDs from orders placed after January
    1, 2023. The outer query retrieves the product names for products that have been
    ordered within the specified timeframe.


    ### Section 4: Subquery Best Practices


    To make the most of subqueries in your SQL queries, consider the following best
    practices:


    \- Keep Subqueries Simple: Avoid overly complex subqueries that can make the query
    hard to understand and maintain. Break down complex requirements into smaller,
    more manageable subqueries.


    \- Optimize Subqueries: Evaluate the performance of your subqueries and ensure
    they are properly optimized. Use appropriate indexes and query optimization techniques
    to improve efficiency.


    \- Test Subqueries: Test subqueries on small datasets before applying them to
    larger datasets to ensure they return the expected results and perform well.


    \- Combine Subqueries with Joins: When possible, consider using joins instead
    of subqueries for better performance. Joins can sometimes offer more efficient
    query execution plans.


    \- Document Subqueries: Clearly document the purpose and logic of your subqueries
    to enhance code readability and maintainability.


    Section 5: Conclusion


    Subqueries are a powerful tool in SQL that allow you to nest queries within other
    queries, enabling advanced data retrieval and manipulation. By understanding the
    different types of subqueries and their applications, you can leverage this feature
    to write more complex and efficient SQL queries.'
