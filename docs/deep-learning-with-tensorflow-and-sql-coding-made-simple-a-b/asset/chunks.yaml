    \ 安全与伦理\n\n随着强化学习与现实环境交互，确保安全和伦理行为变得至关重要。\n\n## 12.8 结论\n\n深度强化学习将深度神经网络的力量与序列决策相结合。它在各个领域都取得了显著的成功，尽管仍有挑战待克服。\n\
