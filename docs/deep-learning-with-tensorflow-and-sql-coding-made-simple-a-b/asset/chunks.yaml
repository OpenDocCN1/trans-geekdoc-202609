    \ 提供了如 Word2Vec 和 GloVe 等技术，从大型文本语料库中学习词嵌入或利用预训练嵌入。\n\n例如，在情感分析中，词嵌入可将单词转换为数值表示，允许模型学习文本中所表达的情感。\n\
