    \n```python\nimport tensorflow as tf\n```\n\n### 2.3.1 张量 (Tensors)\n\n张量是 TensorFlow\
    \ 中的基础数据结构。它们是多维数组，可以存储各种类型的数值。最常见的类型是 `float32`、`int32` 和 `string`。你可以使用 `tf.Tensor`\
