    ## 第 4 部分：向表中插入数据


    现在我们已经创建了表，可以开始向其中填充数据了。`INSERT` 语句允许我们向表中添加新记录。以下是插入数据的方法：


    1. 确定你想要插入数据的表。

    2. 指定你有有值要插入的列。

    3. 为指定的列提供对应的值。


    示例：


    ```sql

    INSERT INTO customers (customer_id, first_name, last_name, email)

    VALUES (1, ''John'', ''Doe'', ''john.doe@example.com'');

    ```


    在这个示例中，我们向 "customers" 表插入了一条新记录，并为 `customer_id`、`first_name`、`last_name` 和 `email`
    列赋值。


    你可以通过扩展 `VALUES` 子句添加额外的值集来一次性插入多条记录。


    ## 第 5 部分：更新和删除数据


    除了插入数据外，SQL 还允许你更新和删除表中的现有数据。


    1. 更新数据：`UPDATE` 语句允许你修改表中一个或多个列的现有数据。使用 `SET` 子句来指定列的新值，使用 `WHERE` 子句来过滤需要更新的行。


    示例：


    ```sql

    UPDATE customers

    SET email = ''johndoe@example.com''

    WHERE customer_id = 1;

    ```


    在这个示例中，我们更新了 "customers" 表中 `customer_id` 为 1 的记录的 `email` 列。


    2. 删除数据：`DELETE` 语句允许你从表中删除一条或多条记录。使用 `WHERE` 子句来指定行必须满足的条件。


    示例：


    ```sql

    DELETE FROM customers

    WHERE customer_id = 1;

    ```


    在这个示例中，我们删除了 "customers" 表中 `customer_id` 为 1 的记录。


    通过掌握本章涵盖的概念，你已经学习了使用 SQL 创建和操作数据库的基本技能。你现在理解了如何创建数据库、定义表、指定数据类型、向表插入数据以及修改现有数据。在下一章中，我们将更深入地如何使用
    `SELECT` 语句进行数据查询，这允许你根据各种条件和准则从数据库中检索特定信息。


    # 第 3 章：使用 SELECT 查询数据


    在上一章中，我们探索了使用 SQL 创建和操作数据库的基础。现在，在第 3 章中，我们将关注 `SELECT` 语句，它是从数据库查询数据的核心。`SELECT`
    语句允许你根据各种条件和标准从表中检索特定信息。到本章结束，你对如何有效地查询和过滤数据有了良好的理解。


    ### 第 1 节检索所有列


    `SELECT` 语句最简单的形式用于从表中检索所有列。基本语法如下：


    ```sql

    SELECT * FROM table_name;

    ```


    该语句返回指定表的所有行和列。星号 (`*`) 作为通配符，代表所有列。


    示例：


    ```sql

    SELECT * FROM customers;

    ```


    在这个示例中，我们从 "customers" 表检索所有的记录和列。


    ### 第 2 节检索特定列


    通常，你可能不需要所有的列。`SELECT` 语句允许你精确指定想要哪些列。语法如下：


    ```sql

    SELECT column1, column2 FROM table_name;

    ```


    示例：


    ```sql

    SELECT first_name, last_name FROM customers;

    ```


    ### 第 3 节使用 WHERE 应用过滤器


    要检索符合某些条件的记录，你可以使用 `WHERE` 子句。语法如下：


    ```sql

    SELECT column1, column2 FROM table_name WHERE condition;

    ```


    示例：


    ```sql

    SELECT * FROM customers WHERE city = ''New York'';

    ```


    在这个示例中，我们从 "customers" 表中检索 `city` 为 ''New York'' 的记录。


    ### 第 4 节使用 ORDER BY 排序数据


    `ORDER BY` 子句允许你按列对结果集排序。语法如下：


    ```sql

    SELECT column1, column2 FROM table_name ORDER BY column1;

    ```


    示例：


    ```sql

    SELECT * FROM customers ORDER BY last_name;

    ```


    在这个示例中，我们根据 `last_name` 对 "customers" 表中的记录进行排序。


    ### 第 5 节使用 LIMIT 限制结果


    `LIMIT` 子句允许你限制返回的行数。语法如下：


    ```sql

    SELECT column1, column2 FROM table_name LIMIT count;

    ```


    示例：


    ```sql

    SELECT * FROM customers LIMIT 10;

    ```


    在这个示例中，我们从 "customers" 表检索检索前 10 条记录。


    ### 第 6 节使用 AND 和 OR 组合条件


    你可以使用 `AND` 和 `OR` 等逻辑运算符在 `WHERE` 子句中组合多个条件。这允许进行更复杂的过滤标准。


    ```sql

    SELECT * FROM customers WHERE condition1 AND condition2;

    ```


    示例：


    ```sql

    SELECT * FROM customers WHERE city = ''New York'' AND age > 30;

    ```


    在这个示例中，我们从 "customers" 表中检索 `city` 为 ''New York'' 且 `age` 大于 30 的记录。


    通过掌握 `SELECT` 语句及其各种子句，你已经了根据需求从数据库中检索特定数据的能力。在本章中，我们涵盖了检索所有列、选择特定列、使用 `WHERE`
    应用过滤器、使用 `ORDER BY` 排序数据、使用 `LIMIT` 限制结果以及组合条件。


