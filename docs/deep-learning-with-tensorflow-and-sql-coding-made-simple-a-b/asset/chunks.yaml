    where \`y\_actual\` is a one-hot encoded vector representing the true label, and
    \`y\_pred\` is the predicted probability vector across classes. The loss is calculated
    by summing over all classes.


    ## 5.5 Other Loss Functions


    There are various other loss functions that cater to specific types of problems:


    \- \*\*Mean Absolute Error (MAE)\*\*: MAE calculates the average absolute difference
    between the predicted and actual values. It is less sensitive to outliers compared
    to MSE.


    \- \*\*Hinge Loss\*\*: Hinge Loss is commonly used for support vector machines
    (SVMs) and is suitable for binary classification problems. It encourages correct
    classification by imposing a penalty for misclassification.


    \- \*\*Huber Loss\*\*: Huber Loss combines the characteristics of MSE and MAE.
    It behaves like MSE for large errors and like MAE for small errors, providing
    a balance between the two.


    The choice of loss function depends on the nature of the problem, the desired
    properties of the model''s output, and the available training data.


