    ## 5.4 Categorical Cross-Entropy


    Categorical Cross-Entropy is employed for multi-class classification problems,
    where the output of the neural network represents the probabilities across multiple
    classes. It measures the dissimilarity between the predicted class probabilities
    and the true labels. The formula for Categorical Cross-Entropy is as follows:


    \`\`\`


    Categorical Cross-Entropy = - Σ(y\_actual \* log(y\_pred))


