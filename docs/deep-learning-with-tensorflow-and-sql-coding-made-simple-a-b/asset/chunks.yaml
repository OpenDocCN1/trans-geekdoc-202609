- raw: 'In the next chapter, we will explore SQL functions. Functions provide a way
    to perform calculations, manipulate data, and retrieve information from the database.
    We will cover various types of functions and their usage in SQL. Get ready to
    level up your SQL skills with functions!


    # Chapter 10: SQL Functions


    In the previous chapters, we learned about querying and manipulating data in SQL.
    In this chapter, we will dive into SQL functions. Functions are powerful tools
    that allow you to perform calculations, manipulate data, and retrieve information
    from the database. They provide a way to encapsulate logic and reuse code. In
    this chapter, we will explore different types of SQL functions and their usage.


    ### Section 1: Introduction to SQL Functions


    A function is a named operation that takes one or more arguments, performs a specific
    task, and returns a result. SQL provides a wide range of built-in functions that
    you can use in your queries. Functions can be used in various SQL statements,
    such as SELECT, WHERE, GROUP BY, and HAVING clauses. They can manipulate data,
    perform calculations, convert data types, retrieve information, and much more.


    ### Section 2: Scalar Functions


    Scalar functions operate on a single value and return a single value. Let''s explore
    some commonly used scalar functions:


    #### 2.1 String Functions:


    \- CONCAT: Concatenates two or more strings together.


    \- LENGTH: Returns the length of a string.


    \- UPPER: Converts a string to uppercase.


    \- LOWER: Converts a string to lowercase.


    \- SUBSTRING: Extracts a substring from a string based on a specified starting
    position and length.


    Example:


    \`\`\`sql


    SELECT CONCAT(first\_name, '' '', last\_name) AS full\_name,


    LENGTH(email) AS email\_length,


    UPPER(city) AS capital\_city,


    LOWER(address) AS lowercase\_address,


    SUBSTRING(description, 1, 50) AS short\_description


    FROM customers;


    \`\`\`


    In this example, we use various string functions to manipulate string values.
    We concatenate the first and last names, calculate the length of the email, convert
    the city to uppercase, the address to lowercase, and extract a short description
    from the description column.


    #### 2.2 Numeric Functions:


    \- ABS: Returns the absolute value of a number.


    \- ROUND: Rounds a number to a specified number of decimal places.


    \- CEILING: Rounds a number up to the nearest integer.


    \- FLOOR: Rounds a number down to the nearest integer.


    \- SQRT: Returns the square root of a number.


    Example:


    \`\`\`sql


    SELECT employee\_id,


    ABS(salary) AS absolute\_salary,


    ROUND(commission\_rate, 2) AS rounded\_commission,


    CEILING(rating) AS rounded\_rating,


    FLOOR(years\_of\_service) AS service\_years,


    SQRT(total\_sales) AS square\_root\_sales


    FROM employees;


    \`\`\`


    In this example, we apply numeric functions to manipulate numeric values. We calculate
    the absolute value of the salary, round the commission rate to two decimal places,
    round the rating up, round the years of service down, and calculate the square
    root of total sales.


    ### Section 3: Aggregate Functions


    Aggregate functions perform calculations on a set of values and return a single
    value. They are commonly used with the GROUP BY clause to summarize data. Let''s
    explore some commonly used aggregate functions:


    3.1 SUM: Calculates the sum of a column.


    3.2 AVG: Calculates the average of a column.


    3.3 COUNT: Counts the number of rows or non-null values in a column.


    3.4 MIN: Returns the minimum value in a column.


    3.5 MAX: Returns the maximum value in a column.


    Example:


    \`\`\`sql


    SELECT department,


    SUM(sales) AS total\_sales,


    AVG(profit) AS average\_profit,


    COUNT(\*) AS total\_employees,


    MIN(salary) AS lowest\_salary,


    MAX(salary) AS highest\_salary


    FROM sales\_data


    GROUP BY department;


    \`\`\`


    In this example, we use aggregate functions to summarize sales data by department.
    We calculate the total sales, average profit, total number of employees, lowest
    salary, and highest salary for each department using the SUM, AVG, COUNT, MIN,
    and MAX functions, respectively.


    ### Section 4: Date and Time Functions


    SQL provides a set of functions specifically designed to work with date and time
    values. These functions allow you to extract information, perform calculations,
    and manipulate date and time values. Let''s explore some commonly used date and
    time functions:


    4.1 CURRENT\_DATE: Returns the current date.


    4.2 CURRENT\_TIME: Returns the current time.


    4.3 EXTRACT: Extracts a specific component (year, month, day, etc.) from a date
    or time value.


    4.4 DATE\_ADD: Adds a specified interval to a date or time value.


    4.5 DATE\_DIFF: Calculates the difference between two dates or time values.


    Example:


    \`\`\`sql


    SELECT order\_date,


    EXTRACT(YEAR FROM order\_date) AS order\_year,


    EXTRACT(MONTH FROM order\_date) AS order\_month,


    DATE\_ADD(order\_date, INTERVAL 7 DAY) AS delivery\_date,


    DATE\_DIFF(delivery\_date, order\_date) AS delivery\_duration


    FROM orders;


    \`\`\`


    In this example, we use date and time functions to work with order dates. We extract
    the year and month from the order date, add 7 days to calculate the delivery date,
    and calculate the duration between the order date and delivery date using the
    DATE\_ADD and DATE\_DIFF functions.


    ### Section 5: User-Defined Functions (UDFs)


    Apart from the built-in functions, SQL also allows you to create your own functions
    known as User-Defined Functions (UDFs). UDFs provide flexibility and reusability
    by encapsulating custom logic. You can create scalar functions that return a single
    value or table functions that return a result set.


    Example:


    \`\`\`sql


    CREATE FUNCTION calculate\_discount(price DECIMAL, discount\_rate DECIMAL)


    RETURNS DECIMAL


    BEGIN


    DECLARE discounted\_price DECIMAL;


    SET discounted\_price = price - (price \* discount\_rate);


    RETURN discounted\_price;


    END;


    \`\`\`


    In this example, we create a UDF called calculate\_discount that takes a price
    and a discount rate as arguments and calculates the discounted price. The function
    subtracts the discount amount from the original price and returns the discounted
    price.


    Section 6: Conclusion


    SQL functions are powerful tools that allow you to perform various calculations,
    manipulations, and data retrievals. By understanding the different types of functions
    and their usage, you can enhance your SQL queries and work with data more effectively.


    In this chapter, we covered scalar functions for string and numeric manipulations,
    aggregate functions for summarizing data, date and time functions for working
    with temporal values, and user-defined functions for custom logic. With this knowledge,
    you are well-equipped to leverage the power of functions in your SQL queries.


    In the next chapter, we will delve into SQL transactions and their importance
    in maintaining data integrity and consistency. Get ready to learn how to handle
    multiple database operations as a single logical unit using transactions!


    # Chapter 11: SQL Transactions


    In the previous chapters, we explored SQL querying, data manipulation, and functions.
    In this chapter, we will dive into SQL transactions. A transaction is a sequence
    of one or more database operations that should be treated as a single logical
    unit. Transactions ensure data integrity and consistency by allowing multiple
    operations to succeed or fail together. In this chapter, we will learn about the
    concept of transactions, their properties, and how to use them effectively in
    SQL.


    ### Section 1: Introduction to Transactions


    A transaction is a set of database operations that are executed as a single unit.
    It follows the ACID properties, which stand for Atomicity, Consistency, Isolation,
    and Durability.


    1.1 Atomicity: Atomicity ensures that a transaction is treated as a single indivisible
    operation. Either all the operations within a transaction are completed successfully,
    or none of them are. If any part of the transaction fails, the entire transaction
    is rolled back, and the database is left unchanged.'
