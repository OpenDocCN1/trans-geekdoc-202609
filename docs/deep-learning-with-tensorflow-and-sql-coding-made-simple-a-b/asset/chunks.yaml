    ```


    在此示例中，我们从 "products" 表中检索所有 "category" 列为 ''Electronics'' 且 "price" 列小于 1000 的记录。


    ### 第 3 节：通配符运算符


    通配符用于匹配文本或字符串值中的模式。当你想要搜索与给定模式部分匹配的值时，这些通配符 特别有用。常用的通配符运算符有：


    - `%`: 匹配任意字符序列（零或多个）。

    - `_`: 匹配任意单个字符。


    示例：


    ```sql

    SELECT * FROM customers

    WHERE last_name LIKE ''Sm%'';

    ```


    在此示例中，我们从 "customers" 表中检索所有 "last_name" 列以 ''Sm'' 开头的记录。


    ### 第 4 节：组合运算符


    为了创建更复杂的过滤器，你可以在 `WHERE` 子句中组合多个比较运算符、逻辑运算符和通配符运算符。这允许你根据特定需求构建复杂的条件。


    示例：


    ```sql

    SELECT * FROM orders

    WHERE (order_date >= ''2022-01-01'' AND order_date <= ''2022-12-31'')

    AND (status = ''Shipped'' OR status = ''Delivered'');

    ```


    在此示例中，我们从 "orders" 表中检索所有 "order_date" 落在 2022 年内且 "status" 为 ''Shipped'' 或 ''Delivered''
    的记录。


    ### 第 5 节：NULL 值


    在 SQL 中，`NULL` 代表缺失或未知的数据。在处理 `NULL` 值时，会使用特殊的运算符：


    - `IS NULL`: 匹配 `NULL` 值。

    - `IS NOT NULL`: 匹配非 NULL 值。


    示例：


    ```sql

    SELECT * FROM employees

    WHERE department IS NULL;

    ```


    在此示例中，我们从 "employees" 表中检索所有 "department" 列包含 `NULL` 值的记录。


    通过理解和应用这些高级过滤技术，你可以编写更复杂且精确的查询。这允许你从数据库表中提取切切的数据。在下一章中，我们将探索表连接，使你能够将多个表的数据合并到单个结果集中。


    # 第 5 章：表连接


    在之前的章节中，我们关注于从单表中查询数据。然而，许多现实世界中的场景需要组合来自多个表的数据。在本章中，我们将探索 SQL 中表连接的概念。表连接允许你合并相关数据，并获取你信息的全面视图。在本章结束时，你将理解不同的连接类型、如何使用共同列连接表，以及如何如何从连接后的表中检索数据。


    ### 第 1 节：理解表连接


    表连接根据它们之间的相关列将两个或多个表的行结合。常见的连接类型有：


    - `Inner Join`（内连接）：返回表之间匹配的行。

    - `Left Join`（左连接）：返回左表的所有行和右表的匹配行。

    - `Right Join`（右连接）：返回右表的所有行和左表的匹配行。

    - `Full Outer Join`（全外连接）：返回两个表的所有行，包括不匹配的行。


    ### 第 2 节：内连接 (Inner Join)


    `INNER JOIN` 将两个表中在指定列上具有匹配值的行结合起来。内连接的语法如下：


    ```sql

    SELECT columns

    FROM table1

    INNER JOIN table2

    ON table1.column = table2.column;

    ```


    示例：


    ```sql

    SELECT orders.order_id, customers.customer_name

    FROM orders

    INNER JOIN customers

    ON orders.customer_id = customers.customer_id;

    ```


    在此示例中，我们从 "orders" 表中检索订单 ID，从 "customers" 表中检索客户名称，通过共同列 "customer_id" 将它们连接。


    ### 第 3 节：左连接 (Left Join)


    `LEFT JOIN` 返回左表的所有行和右表的匹配行。如果没有匹配项，则右表的列将包含 `NULL` 值。左连接的语法如下：


    ```sql

    SELECT columns

    FROM table1

    LEFT JOIN table2

    ON table1.column = table2.column;

    ```


    示例：


    ```sql

    SELECT customers.customer_name, orders.order_id

    FROM customers

    LEFT JOIN orders

    ON customers.customer_id = orders.customer_id;

    ```


    在此示例中，我们从 "customers" 表中检索客户名称，从 "orders" 表中检索订单 ID。所有客户都包含在内，即使他们没有任何订单。不匹配的订单
    ID 将具有 `NULL` 值。


    ### 第 4 节：右连接 (Right Join)


    `RIGHT JOIN` 返回右表的所有行和左表的匹配行。如果没有匹配项，则左表的列将包含 `NULL` 值。右连接的语法如下：


    ```sql

    SELECT columns

    FROM table1

    RIGHT JOIN table2

    ON table1.column = table2.column;

    ```


    示例：


    ```sql

    SELECT customers.customer_name, orders.order_id

    FROM customers

    RIGHT JOIN orders

    ON customers.customer_id = orders.customer_id;

    ```


    在此示例中，我们从 "customers" 表中检索客户名称，从 "orders" 表中检索订单 ID。所有订单都包含在内，即使没有相应的客户。不匹配的客户名称将具有
    `NULL` 值。


    ### 第 5 节：全外连接 (Full Outer Join)


    `FULL OUTER JOIN` 返回两个表的所有行，包括不匹配的行。如果没有匹配项，则对应表的列将包含 `NULL` 值。全外连接的语法如下：


    ```sql

    SELECT columns

    FROM table1

    FULL OUTER JOIN table2

    ON table1.column = table2.column;

    ```


    示例：


    ```sql

    SELECT customers.customer_name, orders.order_id

    FROM customers

    FULL OUTER JOIN orders

    ON customers.customer_id = orders.customer_id;

    ```


    在此示例中，我们从 "customers" 表中检索客户名称，从 "orders" 表中检索订单 ID。所有的客户和订单都包含在内，不匹配的客户订单对将填充
    `NULL` 值。


    ### 第 6 节：组合多个连接


    你可以通过扩展查询中的连接句来连接两个以上的表。这允许你在单个结果集中从多个相关表检索数据。示例如下：


    ```sql

    SELECT orders.order_id, customers.customer_name, products.product_name

    FROM orders

    INNER JOIN customers

    ON orders.customer_id = customers.customer_id

    INNER JOIN order_items

    ON orders.order_id = order_items.order_id

    INNER JOIN products

    ON order_items.product_id = products.product_id;

    ```


    在此示例中，我们从 "orders" 表中检索订单 ID，从 "customers" 表中检索客户名称，从 "products" 表中检索产品名称。我们通过
    "order_items" 表中的相应 ID 连接这些表。


    ### 第 7 节：别名 (Alias Names)


    在连接表时，为表或列分配别名对于简洁和可读性非常有用。别名是在特定查询中分配给表或列的临时名称。示例如下：


    ```sql

    SELECT c.customer_name, o.order_id

    FROM customers AS c

    LEFT JOIN orders AS o

    ON c.customer_id = o.customer_id;

    ```


    在此示例中，我们为 "customers" 表分配了别名 "c"，为 "orders" 表分配了别名 "o"。这简化了查询并使引用表更加容易。


