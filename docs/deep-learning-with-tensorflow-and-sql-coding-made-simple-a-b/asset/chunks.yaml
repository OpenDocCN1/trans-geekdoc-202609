    # 第 1 章：SQL 简介


    欢迎来到 `SQL` 的世界。在本章中，我们将开启一段旅行，了解 `SQL` 是什么、它为什么重要、如何搭建环境练习 `SQL` 命令，以及 `SQL` 语法和结构的基础。在本章结束时，你将掌握使用
    `SQL` 命令从数据库中检索数据所需的基础知识。


    ### 第 1 节：什么是 SQL？


    `SQL` 代表结构化查询语言（Structured Query Language），是一种专门设计用于管理和操作关系型数据库管理系统 (`RDBMS`)
    中数据的编程语言。它提供了一种与数据库交互的标准方式，使用户执行各种操作，如查询数据、插入新数据、更新现有数据和删除不需要的数据。


    ### 第 2 节：为什么要学习 SQL？


    对于任何处理数据工作的人来说，`SQL` 都是一项关键技能，无论你是数据分析师、软件开发人员、商业智能人士，还是渴望进入数据管理领域的学生。以下是学习 `SQL`
    价值的一些引人理由：


    1. 数据检索：`SQL` 允许你从数据库存储的海量信息中提取特定数据。你可以过滤、排序和组合数据以获得见解并回答复杂问题。


    2. 数据操作：`SQL` 允许你修改数据库中的数据。你可以添加、更新或删除记录，使其成为数据维护和数据驱动应用的必备工具。


    3. 数据库管理：如果你涉及数据库管理，`SQL` 提供了管理数据库结构、定义安全措施和优化性能的必要命令。

