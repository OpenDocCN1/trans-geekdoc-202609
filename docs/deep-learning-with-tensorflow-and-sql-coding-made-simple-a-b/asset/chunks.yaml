    they can slightly slow down data modification operations (such as inserts, updates,
    and deletes). However, the overall benefit of improved query performance usually
    outweighs the minimal overhead of maintaining indexes.


    2.3 Index Types: SQL supports different types of indexes, including clustered
    indexes, non-clustered indexes, and composite indexes. Each index type has its
    own characteristics and best use cases.


    Example:


    \`\`\`sql


    CREATE INDEX idx\_customer\_name ON customers (last\_name, first\_name);


    \`\`\`


    In this example, we create an index called idx\_customer\_name on the last\_name
    and first\_name columns of the customers table. This index improves the performance
    of queries that involve searching or sorting based on customer names.


    ### Section 3: Stored Procedures


    A stored procedure is a named set of SQL statements that are stored in the database
    and can be executed repeatedly. Stored procedures offer the following benefits:


    3.1 Code Reusability: Stored procedures allow you to encapsulate a series of SQL
    statements into a single reusable unit. This promotes code modularization and
    reduces code duplication.


    3.2 Improved Performance: By executing a stored procedure, you eliminate the need
    to send individual SQL statements over the network. This reduces network traffic
    and improves overall performance.


    3.3 Enhanced Security: Stored procedures provide a layer of security by allowing
    controlled access to database operations. Users can execute stored procedures
    without needing direct access to underlying tables.


    Example:


    \`\`\`sql


    CREATE PROCEDURE get\_employee\_count()


    BEGIN


    SELECT COUNT(\*) AS total\_employees


    FROM employees;


    END;


    \`\`\`


    In this example, we create a stored procedure called get\_employee\_count. It
    returns the total number of employees from the employees table. Whenever this
    stored procedure is executed, it will retrieve the current count of employees.


    ### Section 4: Triggers


    A trigger is a special type of stored procedure that is automatically executed
    in response to specific database events, such as inserts, updates, or deletes
    on a table. Triggers provide the following benefits:


    4.1 Data Validation: Triggers can be used to enforce data integrity rules by validating
    the data before it is inserted, updated, or deleted from a table. This ensures
    that only valid data is stored in the database.


    4.2 Auditing and Logging: Triggers can be used to track changes made to a table
    by capturing the old and new values of the modified rows. This is useful for audit
    purposes and maintaining a history of data modifications.


    4.3 Data Synchronization: Triggers can be used to synchronize data between tables
    or perform additional actions when certain database events occur. For example,
    a trigger can update a corresponding table when a related table is modified.


    Example:


    \`\`\`sql


    CREATE TRIGGER update\_stock AFTER INSERT ON sales


    FOR EACH ROW


    BEGIN


    UPDATE inventory


    SET quantity = quantity - NEW.quantity


    WHERE product\_id = NEW.product\_id;


    END;


    \`\`\`


    In this example, we create a trigger called update\_stock. Whenever a new row
    is inserted into the sales table, the trigger will automatically execute and update
    the quantity in the inventory table based on the quantity sold.


