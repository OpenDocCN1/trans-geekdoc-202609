    FROM (SELECT employee_name, department FROM employees WHERE salary > 5000) AS
    t1

    JOIN (SELECT department, location FROM departments WHERE location = ''New York'')
    AS t2

    ON t1.department = t2.department;

    ```


    ## 第 3 节：带运算符和函数的子查询


    子查询可以配合各种运算符和函数来执行更高级的操作。让我们探索一些示例：


    ### 3.1 带比较运算符的子查询


    ```sql

    SELECT employee_name, salary

    FROM employees

    WHERE salary > (SELECT AVG(salary) FROM employees);

    ```


    在此示例中，子查询 `(SELECT AVG(salary) FROM employees)` 计算所有员工的平均工资。外部查询检索工资高于平均水平的员工姓名和工资。


    ### 3.2 带 EXISTS 的子查询


    ```sql

    SELECT department_name

    FROM departments d

    WHERE EXISTS (SELECT * FROM employees e WHERE e.department_id = d.department_id);

    ```


    在此示例中，子查询 `(SELECT * FROM employees e WHERE e.department_id = d.department_id)`
    检查是否存在员工。外部查询检索拥有员工的部门名称。


    ### 3.3 带 IN 运算符的子查询


    ```sql

    SELECT product_name

    FROM products

    WHERE product_id IN (SELECT product_id FROM orders WHERE order_date >= ''2023-01-01'');

    ```


    在此示例中，子查询 `(SELECT product_id FROM orders WHERE order_date >= ''2023-01-01'')`
    获取 2023 年 1 月 1 日之后订单的产品 ID。外部查询检索在指定时间范围内下单的产品名称。


    ## 第 4 节：子查询最佳实践


    为了在 SQL 查询中充分利用子查询，请考虑以下最佳实践：


    保持子查询简单简单：避免使用过度复杂的子查询，这会导致查询难以理解和维护。将复杂的需求拆分为更小、更易于管理的子查询。

    优化子查询：评估子查询的性能并确保它们经过了适当优化。使用适当的索引和查询优化技术来提高效率。

    测试子查询：在应用于大数据集之前，先在小数据集上测试子查询，以确保它们返回预期结果且性能良好。

    结合连接：有时，考虑使用连接代替子查询。连接有时可以提供更高效的查询执行计划。

    记录子查询：清晰地记录子查询的目的和逻辑，以增强代码的可读性和维护性。


    ## 第 5 节：总结


    子查询是 SQL 中一种强大的工具，允许你将查询嵌套在另一个查询中，实现高级的数据检索和处理。通过理解不同类型的子查询及其应用，你可以利用此功能编写更复杂、更高效的
    SQL 查询。


    '
