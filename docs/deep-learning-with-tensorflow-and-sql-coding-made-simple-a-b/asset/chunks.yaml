    \n### 第 2 节：标量函数 (Scalar Functions)\n\n标量函数作用于单个值并返回单个值。让我们探索一些常用的标量函数：\n\n####\
    \ 2.1 字符串函数：\n\n- `CONCAT`：将两个或多个字符串拼接。\n- `LENGTH`：返回字符串的长度。\n- `UPPER`：将字符串转换为大写。\n\
    - `LOWER`：将字符串转换为小写。\n- `SUBSTRING`：根据指定的起始位置长度从字符串中提取子字符串。\n\n示例：\n\n```sql\n\
    SELECT CONCAT(first_name, ' ', last_name) AS full_name,\nLENGTH(email) AS email_length,\n\
    UPPER(city) AS capital_city,\nLOWER(address) AS lowercase_address,\nSUBSTRING(description,\
    \ 1, 50) AS short_description\nFROM customers;\n```\n\n在这个示例中，我们使用了各种字符串函数来处理字符串值。我们拼接了姓名，计算了电子邮件的长度，将城市转换为大写，将地址转换为小写，并从描述列中提取了短描述。\n\
    \n#### 2.2 数值函数：\n\n- `ABS`：返回数字的绝对值。\n- `ROUND`：将数字四舍入到指定的位数。\n- `CEILING`：将数字向上取整到最近整数。\n\
    - `FLOOR`：将数字向下取整到最近整数。\n- `SQRT`：返回数字的平方根。\n\n示例：\n\n```sql\nSELECT employee_id,\n\
    ABS(salary) AS absolute_salary,\nROUND(commission_rate, 2) AS rounded_commission,\n\
    CEILING(rating) AS rounded_rating,\nFLOOR(years_of_service) AS service_years,\n\
    SQRT(total_sales) AS square_root_sales\nFROM employees;\n```\n\n在这个示例中，我们应用数值函数来处理数值值。我们计算了工资的绝对值，将佣金率保留两位小数，将评分向上取整，将工龄向下取整，并计算了总销售额的平方根。\n\
    \n### 第 3 节：聚合函数 (Aggregate Functions)\n\n聚合函数对一组值执行计算并返回单个值。它们通常与 `GROUP BY`\
    \ 子句配合使用来汇总数据。让我们探索一些常用的聚合函数：\n\n3.1 `SUM`：计算数值列的总和。\n3.2 `AVG`：计算数值列的平均值。\n3.3\
    \ `COUNT`：返回组中的行数。\n3.4 `MIN`：返回组中的最小值。\n3.5 `MAX`：返回组中的最大值。\n\n示例：\n\n```sql\n\
    SELECT department,\nSUM(salary) AS total_salary,\nAVG(salary) AS average_salary,\n\
    COUNT(id) AS employee_count,\nMIN(salary) AS min_salary,\nMAX(salary) AS max_salary\n\
    FROM employees;\n```\n\n在这个示例中，我们使用聚合函数来汇总数据。我们计算了总工资、平均工资、员工人数、最低工资以及每个部门最高工资。\n\
    \n### 第 4 节：日期和时间函数\n\nSQL 提供了专门用于处理日期和时间的函数。让我们探索一些常用的：\n\n4.1 `CURRENT_DATE`：返回当前日期。\n\
    4.2 `CURRENT_TIME`：返回当前时间。\n4.3 `EXTRACT`：从日期或时间中提取特定部分（如年、月、日）。\n4.4 `DATE_ADD`：为日期添加指定的间隔。\n\
    4.5 `DATEDIFF`：计算两个日期之间的差值。\n\n示例：\n\n```sql\nSELECT order_id,\nEXTRACT(YEAR FROM\
    \ order_date) AS year,\nEXTRACT(MONTH FROM order_date) AS month,\nDATE_ADD(order_date,\
    \ INTERVAL 7 DAY) AS next_week,\nDATEDIFF(CURRENT_DATE, order_date) AS days_passed\n\
    FROM orders;\n```\n\n在这个示例中，我们使用日期和时间函数从日期中提取年份和月份，增加 7 天，并计算过去的天数。\n\n### 第 5\
    \ 节：自定义函数 (UDFs)\n\n除了内置函数，SQL 还允许你创建自己的函数。UDF 通过封装逻辑提供了灵活性。你可以创建返回单个值的标量函数，也可以创建返回结果集的函数。\n\
    \n示例：\n\n```sql\nCREATE FUNCTION calculate_discount(price DECIMAL, discount_rate\
    \ DECIMAL)\nRETURNS DECIMAL\nBEGIN\n    DECLARE discounted_price DECIMAL;\n  \
    \  SET discounted_price = price - (price * discount_rate);\n    RETURN discounted_price;\n\
    END;\n```\n\n在这个示例中，我们创建了一个名为 `calculate_discount` 的函数，它接收价格和折扣率参数，计算折扣价并返回它。\n\
    \n### 第 6 节：总结\n\n函数是强大的工具，允许你执行各种计算、操纵和数据检索。通过理解不同类型的函数及其用法，你可以增强你的 SQL 查询并更有效地处理数据。\n\
    \n在本章中，我们涵盖了用于字符串和数值处理的标量函数、用于汇总数据的聚合函数、用于处理时间值的日期函数，以及用于自定义逻辑的自定义函数。有了这些知识，你已经准备好在\
    \ SQL 查询中利用函数的威力了。\n\n"
