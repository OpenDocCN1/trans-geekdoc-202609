    # 第 15 章：深度学习自然语言生成


    ## 15.1 自然语言生成简介


    自然语言生成 (`NLG`) 是人工智能的一个分支，专注于让计算机系统生成人类语言。`NLG` 技术利用深度学习模型产生连贯且相关的文本，实现聊天机器人、内容生成和个性化推荐等应用。


    ### 15.2 用于 NLG 的递归神经网络 (RNNs)


    由于能够对序列数据，递归神经网络 (`RNNs`) 在 NLG 任务中被广泛使用。`RNNs` 及其变体（如长短期记忆 (`LSTM`) 和门控循环单元 (`GRU`)）能够捕获文本中的依赖关系和上下文，使其适用于语言建模、文本摘要和对话生成等任务。


    ### 15.3 用于 NLG 的序列到序列模型


