  md: '# 4 Conclusions


    In this study, we compiled 2765 toxicity data points of metal and metal oxide
    (M/MOx) nanoparticles against tumor cells from published literature and addressed
    data gaps using the Jaccard similarity coefficient. We developed an interpretable
    machine learning model, incorporating physicochemical, molecular, and quantum
    chemical descriptors, to predict the in vitro cytotoxicity of 26 nanoparticle
    types across 32 tumor cell lines. Feature selection based on correlation analysis
    enhanced model performance, and the final LGBM model achieved over 90% accuracy
    in cross-validation. Feature importance and effect analysis revealed key variables
    consistent with experimental understanding, supporting the model''s interpretability.
    Experimental validation with newly synthesized rare earth metal oxide nanoparticles
    confirmed the model''s predictive ability. This approach provides a robust, scalable,
    and efficient computational tool for toxicity screening, offering practical guidance
    for the rational design of tumor-targeting nanomaterials (Fig. 10).


