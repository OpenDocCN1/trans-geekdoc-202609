    dry. Calcine the precursor at 800 °C for 3 hours to obtain neodymium oxide.


    # 2.5 Characterization


    Measure zeta potential using a Zetasizer Nano ZS90. Perform XRD using a Rigaku
    D/MAX 2500V. Obtain SEM images with a TESCAN MIRA LMS.


    # 2.6 Cell experiments


    # 2.6.1 Cell culture.


    Cultivate HeLa and A549 cells from the cell bank of Guangxi University Medical
    School Laboratory. Grow cells in high-glucose DMEM medium containing 10% fetal
    bovine serum and 1% penicillin/streptomycin at 37 °C and 5% CO₂.


    # 2.6.2 In vitro cytotoxicity experiments.


    Seed HeLa and A549 cells into 96-well plates and treat with increasing concentrations
    of metal oxide nanoparticles (five concentration gradients per material) for 24
    or 48 hours. After co-culture, replace the medium with DMEM containing 10% CCK8
    or MTT, incubate for 1–4 hours, remove the medium, and add 100 µL of DMSO per
    well. Measure absorbance at 450 nm to assess relative cell viability using a microplate
    reader.


    # 3 Results and discussion


    # 3.1 Data retrieval and mining


    A dataset was compiled from 152 studies on the cytotoxicity of nanomaterials published
    between 2004 and 2023. Keywords such as “nanoparticles/nanomaterials/nanometals
    + toxicity/cytotoxicity” were used to filter extensive online resources, including
    Google, Scopus, CNKI, ACS, Wiley, Science, and PubMed. The initial selection criteria
    required detailed descriptions of the core material, diameter, identified cell
    types, exposure duration, and mean cell viability/toxicity with standard deviations.
    From this preliminary selection, data specific to nanometals, their oxides, and
    tumor cells were extracted, resulting in 2765 instances. These instances encompassed
    characteristics such as nanoparticle type, size, shape, coating, surface charge,
    concentration, cell properties, assay type, exposure duration, and the resulting
    cell viability values. The distribution of these data features is illustrated
    in Fig. 2.


    ![](img/e061c8b3120c138d68e9c0f44c089069_4_0.png)


    Fig. 2 Overview of nano particle data attributes/features in literature (2765
    data points).


    Notably, the dataset exhibited a degree of class imbalance, with 656 samples categorized
    as toxic (cell viability < 50%) and 2109 as non-toxic. This imbalance is primarily
    associated with the focus of our study, which centers on metal and metal oxide
    nanoparticles relevant to cancer therapy. In this domain, nanomaterials with favorable
    biocompatibility and low toxicity are generally prioritized due to their translational
    potential and suitability for biomedical applications.


    The cytotoxicity of nanoparticles is a complex process influenced by various parameters,
    including surface charge, surface coating, chemical composition, hydrodynamic
    diameter, surface area, nanoparticle concentration, and cell descriptors that
    determine the nanoparticle environment. To build a reliable and interpretable
    machine learning model, it is essential to collect extensive data that incorporates
    all these parameters. To enhance the model''s predictive accuracy and deepen the
    understanding of the cytotoxic mechanisms of nanoparticles, we included 17 features
    of M/MOx NPs extracted from various references. In addition to 15 quantum chemical
    features, we have also added 7 molecular features: metal electronegativity (χ),
    the sum of metal electronegativities in a single metal oxide (∑χ), the ratio of
    the number of oxygen atoms to the sum of metal electronegativities in a specific
    metal oxide (nO/∑χ), the number of metal atoms (NMetal), the number of oxygen
    atoms (NOxygen), the metal cation charge corresponding to a given oxide (q), and
    molecular weight (MW). These features can be easily derived from molecular formulas
    and obtained from the periodic table. All data visualization is shown in Fig.
    3a. Feature selection was implemented to reduce the number of correlated features,
    resulting in a low level of correlation among the parameters (Fig. 3b).


