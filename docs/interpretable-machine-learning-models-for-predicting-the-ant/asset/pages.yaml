    # 3.5.2 Feature effects.


    Although feature importance can explain which features significantly affect the
    prediction of black box machine learning models, the relationship between the
    predicted target and features is still unclear (linear, monotonic, or more complex).
    Here, three model agnostic methods are applied to understand feature effects from
    a local or global perspective. PDP aims to display the marginal effect of one
    or two features on model prediction by averaging the model output of different
    values of a feature.89 PDP can easily visualize the relationship between predicted
    targets and selected features, but due to average marginal effects, heterogeneity
    effects may be hidden (i.e. the same feature may have different impacts on individuals).
    ICE decomposes this mean by highlighting the estimated functional relationships
    of individual observations.90 In the ICE graph, each line reflects the change
    in the predicted target of an instance when the selected feature changes. PDP
    is the average value of all lines in the ICE graph. The visualization results
    of the feature effects are shown in Fig. 7. The impact of corresponding features
    on the results can be directly observed from the PDP and ICE plots, such as the
    decrease in cytotoxicity of M/MOx NPs with increasing concentration, exposure
    time, molecular weight, and HOMO (7a, b, g and h). A high HOMO value usually means
    that the electrons of the material are more easily transferred or involved in
    reactions, especially in interactions with biological systems. A higher HOMO value
    increases the tendency of the material to undergo oxidation resulting in the generation
    of free radicals or electron transfer with biomolecules (such as proteins and
    DNA) in the cell, leading to cell damage or cytotoxicity. The cytotoxicity of
    M/MOx NPs is inversely proportional to zeta potential, CA, n_O/∑x and Pol (7d,
    e, f and i). Interestingly, we found that M/MOx NPs with particle sizes between
    10–110 nm have stronger cytotoxicity (6c). Generally speaking, small-sized nanoparticles
    usually have higher surface energy and activity, making them easy to penetrate
    cell membranes or trigger oxidative stress reactions, resulting in higher cytotoxicity.
    However, in our PDP results, 0–10 nm did not show the expected high cytotoxicity.
    This may be because small-sized nanoparticles tend to aggregate in solution,


