    forming larger particles that reduce their direct interaction with cells.91 Additionally,
    smaller nanoparticles in biological systems may be more easily recognized and
    cleared by defense mechanisms such as autophagosomes and macrophages, thereby
    reducing their toxicity.92


    When features interact, the combined effect between two features may be nonadditive.
    In most practical situations, there are more or less interactions. Therefore,
    in order to make learning models interpretable, it is necessary to consider the
    strength and effectiveness of feature interactions. Feature interaction is often
    considered as the interaction between two features, as the interaction between
    more features is difficult to visualize and interpret. The partial dependency
    relationship between two features can be visualized in an interactive contour
    map. It is worth noting that this interaction may only be a correlation rather
    than a causal relationship, as the graph shows a global explanation of feature
    interactions without effect decomposition. SHAP dependency graph is another method
    of visualizing the interaction between two features, where the vertical dispersion
    of a single feature value on the x-axis represents the interaction effect with
    another feature. However, this visualization tool is difficult to display the
    interaction between two classification features without inherent logical relationships.
    Fig. 8 shows the combination effect between two of the first four features. Concentration
    shows a strong influence in all graphs, with higher concentrations indicating
    stronger cytotoxicity (8a–c). There is a complex relationship between zeta potential
    and particle size (8e), especially at negative zeta potential, where toxicity
    increases with larger particle size. The exposure time also increased cytotoxicity
