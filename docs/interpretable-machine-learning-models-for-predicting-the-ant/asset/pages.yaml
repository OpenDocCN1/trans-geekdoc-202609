    # 3.4 Model construction and comparison


    To train our models, we selected nine mainstream and representative machine learning
    algorithms, including Convolutional Neural Networks (CNN),74 Multi-Layer Perceptron
    (MLP),75 Random Forest,76 Extreme Gradient Boosting


    (XGBoost),77 Light Gradient Boosting Machine (LightGBM),78 Support Vector Machine
    (SVM),79 logistic regression,80 k-Nearest Neighbors (kNN),81 and Naive Bayes.82


    The dataset of 2765 samples was split into a training set and a test set in a
    2:1 ratio, with the external validation set composed of subsequent experimental
    data. Model training and evaluation were implemented using Python 3.9.13 with
    PyTorch, Scikit-learn, XGBoost, and LightGBM libraries.


    Given the class-imbalanced nature of the dataset, model evaluation focused primarily
    on the F1 score and the area under the receiver operating characteristic curve
    (AUC-ROC), as both metrics are more informative than accuracy under skewed class
    distributions. The F1 score was selected as the core metric for its ability to
    balance precision and recall, with particular emphasis placed on recall to reduce
    false negatives and improve sensitivity to toxic samples.


    To address class imbalance during model training, we employed tailored strategies:
    for neural network models (CNN and MLP), a weighted cross-entropy loss was applied,
    assigning higher weights to the minority (toxic) class. For gradient boosting
    models (XGBoost and LightGBM), we used consistent hyperparameters (200 trees,
    learning rate = 0.1, max depth = 8), as these models inherently mitigate imbalance
    via split gain functions. Parameters for other classifiers were optimized individually.
    SVM and kNN were included as baseline methods to assess robustness under imbalanced
    conditions.


    Model evaluation was initially performed using the fixed test set to simulate
    a realistic single-pass prediction scenario. The corresponding ROC curves and
    confusion matrices are shown in Fig. 5a and b. Among all models, LightGBM achieved
    the highest test performance with an AUC of 0.9534 and a strong F1 score, demonstrating
    its superior discrimination ability (Table 2).


    To further validate model robustness and account for variability due to random
    data partitioning, we performed stratified five-fold cross-validation. Cross-validation
    results (Fig. 5c, d and Table 3) were subjected to pairwise t-tests at a 95% confidence
    level to compare LightGBM with other representative models (CNN, MLP, SVM, kNN,
    and Naive Bayes). LightGBM significantly outperformed all other models in terms
    of F1 score (p < 0.05), confirming its superior sensitivity to toxic samples.
    Although CNN and MLP achieve slightly better average AUCs, with the differences
    reaching statistical significance, their performance on the other four evaluation
    metrics is inferior,


