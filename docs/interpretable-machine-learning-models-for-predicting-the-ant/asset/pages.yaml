    # 2 Materials and methods


    # 2.1 Data sets


    # 2.1.1 Literature search and harmonization.


    Initially, a systematic iterative literature search was conducted using multiple
    databases, including Google/Google Scholar, PubMed, and Web of Science, with various
    combinations of keywords (e.g., “metal and metal oxide nanoparticles + tumor cytotoxicity,”
    “metal and metal oxide nanoparticles + cells + response,” “metal and metal oxide
    nanoparticles + survival rate”). This stage yielded approximately 400 peer-reviewed
    original research articles reporting in vitro cytotoxicity assessments of nanoparticles
    (NPs) with diameters <1000 nm. All studies identified through this search were
    evaluated for inclusion in the publication database for analysis.


    Eligibility for inclusion in the meta-analysis was determined based on the following
    criteria: NPs were described with respect to at least the core material, size,
    and dosage; the specific cell type and NP exposure duration were specified; and
    the average cell survival rate/toxicity ± standard deviation/error was clearly
    reported. To limit heterogeneity and ensure meaningful conclusions, only data
    points developed using common cell viability/cytotoxicity assays were selected.
    These included the neutral red uptake assay (NR), mitochondrial toxicity assays
    using tetrazolium salts (MTT, MTS, XTT, WST-1, WST-8), ATP bioluminescence assays,
    lactate dehydrogenase (LDH) re-lease assays, resazurin (Alamar Blue) cell viability
    assays, and live/dead (membrane integrity) assays. Metalloid-based NPs and loaded
    NPs were excluded from the scope of this study.


    # 2.1.2 Data extraction and harmonization.


    After organizing the data into a more relevant list, all publications were thoroughly
    reviewed, and the following physicochemical parameters of nanoparticles (NPs)
    were manually extracted: core and coating materials, particle size, zeta potential,
    cell type, NP exposure time, cell viability/cyto-toxicity assays, and the percentage
    of cell survival post-NP exposure. It should be noted that the particle sizes
    included in the dataset were measured using different techniques, such as Zetasizer
    and microscopy. If multiple particle sizes were reported, the hydrodynamic'
