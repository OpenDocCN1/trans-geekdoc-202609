    Quantum chemical descriptors reflect the intrinsic electronic, structural, and
    reactive properties of M/MOx NPs and provide mechanistic insights into how these
    nanomaterials interact with biological systems. For instance, the HOMO energy
    level indicates the tendency of nanoparticles to donate electrons; higher HOMO
    values are associated with stronger electron-donating ability, which can facilitate
    redox reactions


    ![](img/e061c8b3120c138d68e9c0f44c089069_5_1.png)


    Fig. 4 Quantum chemistry features and computational processes.


    with cellular components and induce oxidative stress. Similarly, Eg relates to
    the material''s electronic excitability; a narrower bandgap often implies higher
    reactivity and a greater likelihood of generating ROS, a key factor in nanoparticle-induced
    cytotoxicity. Electronegativity reflects the tendency of metal centers to attract
    electrons, where materials with low electronegativity are typically more reducing
    and prone to ROS generation. ω, S, and η influence the stability and reactivity
    of nanoparticles toward biological nucleophiles, such as proteins or DNA bases.
    A higher electrophilicity value implies a greater capacity to accept electrons
    from biomolecules, potentially leading to adduct formation or enzyme inhibition.
    Pol affects how the electronic cloud of a particle responds to external fields,
    such as those found in biological environments; greater polarizability may enhance
    interactions with charged cellular surfaces or macromolecules. CA and CV provide
    spatial metrics that reflect the particle''s surface exposure and its interaction
    potential with surrounding molecules or membranes. These descriptors, combined,
    allow the model to capture subtle structural and electronic features that directly
    relate to nanotoxicity pathways, such as oxidative damage, membrane penetration,
    or macromolecular binding.


    # 3.3 Data supplementation


    Due to unknown or missing values in the available datasets, including the zeta
    potential—a crucial parameter that characterizes the environment around nanoparticles
    and is vital for describing toxicity phenomena—a significant portion of all dataset
    parameters were blank (Fig. 2A). Removing all such samples significantly reduced
    the dataset size, presenting limitations in current methods. Incomplete observations
    could adversely affect the performance of machine learning algorithms. To address
    this issue, we supplemented the data using similarity-based methods.


    Through our analysis of similarity results, we found that the Jaccard similarity
    coefficient more effectively measures the similarity within our dataset. We hypothesize
    this is because the Sφ coefficient73 typically assesses symmetric correlation
    between two binary variables and is suitable for balanced situations where the
    number of 1s and 0s is roughly equal. However, our dataset has an uneven distribution
    of 1s and 0s, which makes the performance of the Sφ coefficient less effective
    compared to the Jaccard similarity coefficient.


    Thus, despite the usefulness of the Sφ coefficient in certain symmetric and balanced
    binary variable analyses, the Jaccard similarity coefficient is better suited
    for our specific dataset and research context due to its focus on matching 1s
    while ignoring shared 0s. We used the Jaccard similarity coefficient to evaluate
    the similarity within the dataset, calculating it pairwise for each nanoparticle.
    The most similar results were used to fill in missing data.


