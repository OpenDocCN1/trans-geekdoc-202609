    due to their relative simplicity, speed, and cost-effectiveness. Moreover, since
    cytotoxicity tests do not use animals, they avoid ethical issues. Consequently,
    extensive research has been published on the cytotoxic effects of nanoparticles.13-17
    However, the complexity and heterogeneity of nanomaterials, differing testing
    conditions, detection methods, and cell lines complicate comparisons and analyses
    across studies. Additionally, in vitro and in vivo toxicity assessments of metal
    and metal oxide nanomaterials can be very time-consuming and costly.


    Computational toxicology, an alternative to in vitro and in vivo experiments,
    has been widely applied in toxicology research. Various in silico methods have
    been developed and applied, including pharmacological modeling,18 comparative
    molecular field analysis,19,20 molecular docking,21-23 molecular dynamics simulations,24,25
    network-based algorithms,26-29 and machine learning methods like quantitative
    structure activity relationship (QSAR) modeling,30-40 and deep learning.41,42


    Among these, machine learning has recently become one of the most popular methods
    for studying the cytotoxicity of nanomaterials. As a branch of artificial intelligence,
    machine learning aims to develop computational algorithms to infer mathematical
    models from existing data, providing a promising'
