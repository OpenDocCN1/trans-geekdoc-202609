    suggests that size effects cannot always be easily separated from concentration
    effects. Larger nanoparticles may exhibit greater toxicity at moderate to high
    concentrations.87 Moreover, characteristics such as coating, testing, and cells
    also have a significant impact on cell toxicity, for example, the surface properties
    of nanomaterials play a key role in determining the outcome of their interactions
    with cells.88 Thus, our model not only confirmed previous research'
