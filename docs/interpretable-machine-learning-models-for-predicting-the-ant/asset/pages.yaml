    value may indicate a larger contact area with the external environment (such as
    cell membranes or proteins), thereby increasing the likelihood of interaction
    with cells.84 But in our SHAP analysis, this situation seems to be the opposite,
    which may be related to the interaction with the cell membrane. A smaller surface
    area sometimes means high local reactivity, increasing interaction with the cell
    membrane or internal structure, thereby increasing toxicity.85 Additionally, increases
    in metal electronegativity, the number of oxygen atoms, and metal cation charge
    also boost cell survival rates, consistent with Hu et al.''s experimental results.55
    This can be explained by the increased production of reactive oxygen species (ROS)
