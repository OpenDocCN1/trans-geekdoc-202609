    # 3.6 Experimental results comparison


    To further demonstrate the model''s practical application, we synthesized six
    different types of metal oxide nanoparticles in the lab (ZnO, CdO, Cu₂O, CeO₂,
    Er₂O₃, Nd₂O₃) and characterized them using zeta potential measurements, X-ray
    powder diffraction (XRD), and scanning electron microscopy (SEM) to extract key
    parameters (Fig. 9). Two tumor cell lines (A549 and HeLa) were cultured, and their
    toxicity predictions were assessed. Notably, CeO₂, Er₂O₃, Nd₂O₃ nanoparticles,
    not presenting the training dataset, were included to test the model''s generalization
    capability. Five concentration gradients were designed for each nanoparticle,
    with two exposure times (24 h and 48 h) and two detection methods (MTT and CCK8),
    resulting in a dataset of 240 instances (attached as Excelsheet2). The model''s
    prediction results are shown in Table 4. To further assess the reliability and
    practical applicability of the predictive model in real experimental settings,
    SHAP analysis was conducted on experimental data to elucidate the contributions
    of individual features to cell viability outcomes. One representative metal oxide
    nanoparticle—ZnO, CdO, Cu₂O, CeO₂, Er₂O₃, and Nd₂O₃—was randomly selected from
    each material category for SHAP-based prediction and interpretation, as illustrated
    in Fig. 10. In the SHAP plots, arrows represent influential features such as zeta
    potential, concentration, and exposure time; red arrows indicate positive contributions
    (i.e., enhanced cell survival), while blue arrows reflect negative impacts (i.e.,
    increased cytotoxicity). The final SHAP output f(x) represents the predicted level
    of cell viability. For instance, ZnO yielded a low f(x) value of −1.71, suggesting
    high cytotoxicity, whereas CdO showed a high f(x) value of 7.43, indicative of
    low toxicity. The SHAP interpretations reveal that cytotoxicity arises from complex
    interactions among multiple features. In general, higher nanoparticle concentrations
    tend to reduce cell viability, negatively charged surfaces may intensify cellular
    interactions, and longer exposure durations increase toxicity. These mechanistic
    insights can inform future experimental strategies, such as optimizing concentration
    and exposure time to minimize adverse biological effects.


