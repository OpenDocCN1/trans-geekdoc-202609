    data and selected nine classical algorithm models for training. Among them, the
    LightGBM67 model achieved the highest prediction accuracy of 90.78% and an area
    under the curve (AUC) of 95%. To enhance the interpretability of the model and
    identify the optimal decision making process, we use feature importance, partial
    dependence plot (PDP), and individual conditional expectation (ICE).68 To further
    validate the model''s accuracy and explore its generalization capability, we supplemented
    our dataset with 240 new groups of data involving three common metals (ZnO, CdO,
    Cu2O) and three rare earth metals (CeO2, Er2O3, Nd2O3). The new experimental results
    confirmed the reliability and accuracy of our model. These results will significantly
    reduce the time and financial costs for researchers, eliminating excessive labor-intensive
