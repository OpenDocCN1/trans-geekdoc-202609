    # 1 Introduction


    Cancer remains a leading cause of death worldwide, with its incidence continually
    rising.1,2 Nanotechnology has garnered increasing research attention for addressing
    the diagnosis and treatment of conventional diseases.3-6 In particular, metal
    and metal oxide nanomaterials play a significant role in the diagnosis and treatment
    of tumors.7-10


    Nanomaterials'' toxic effects are generally influenced by their various physicochemical
    properties, such as size, shape, surface area, chemical composition, and stability.11
    Among the various biological assays used to evaluate nanomaterial toxicity, in
    vitro cytotoxicity assays are one of the most important toxicological measurement
    methods.12 These assays use live cells to observe and detect the toxic effects
    of nanomaterials and are favored


