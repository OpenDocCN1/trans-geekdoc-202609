    # 3.5 Model interpretability analysis


    # 3.5.1 Importance analysis.


    Beyond developing a successful model, each artificial intelligence method should
    both validate existing knowledge and generate new insights. To uncover potential
    associations between nanoparticles and tumor cell cytotoxicity, we analyzed the
    importance of each descriptor and the model''s SHAP (Shapley Additive Explanations)
    values. This analysis aimed to reveal how changes in each numerical parameter
    affect the predicted viability values (Fig. 6).


    The global contribution comparison (Fig. 6a) in the LightGBM model, an ensemble
    decision tree model, evaluates feature importance by calculating the frequency
    and information gain of features at splitting nodes. The top ten features in importance
    are concentration, diameter, zeta potential, exposure time, cells, coat, test,
    nanoparticle, n_o/∑x and CA. These features significantly impact the prediction
    of cell survival rates, aligning with researchers'' experimental experience. However,
    feature importance does not show how each feature influences the final outcome.
    Therefore, SHAP values were introduced for further analysis to uncover more hidden
    information.


    SHAP values clearly display the well-known concentration and time-dependent effects
    (Fig. 6b), where increasing these parameters generally reduces tumor cell viability.
    Interestingly, an increase in the absolute value of the zeta potential of M/MOx
    enhances tumor cell survival rates. This could be because nanoparticles with lower
    zeta potential are more readily taken up by tumor cells,83 which is less noticeable
    in limited experimental data. CA is a molecular surface area related parameter
    based on the Continuous Solvent Model (COSMO), which typically reflects the interaction
    between molecules and their surrounding environment. For nanomaterials, a higher
    CA


