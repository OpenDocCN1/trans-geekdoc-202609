    on the composition of the protein corona, identifying key proteins as promoters
    or inhibitors of cellular association.45 A recent study used decision tree modeling
    and feature selection algorithms to find that cytotoxicity test indicators were
    significant determinants of viability outcomes.46


    Current research predominantly focuses on the effects of inorganic nanomaterials
    on the environment and general cells, rather than on tumor cells specifically.47–62
