    °C下干燥4小时。最后在700 °C下煅烧2小时得到高纯纳米氧化铒。


    ### 2.4.6 Nd₂O₃.

    制备硝酸钕和碳酸铵溶液，在硝酸钕溶液中加入少量CTMAB表面活性剂。搅拌混合，然后以约1 mL min⁻¹的速度逐滴加入碳酸铵溶液至硝酸钕溶液中，保持pH
    7–8以获得氧化钕前驱体。陈化混合物，过滤，用去离子水和无水乙醇洗涤，干燥。将前驱体在800 °C下煅烧3小时得到氧化钕。


    ## 2.5 Characterization

    使用Zetasizer Nano ZS90测量zeta电位。用Rigaku D/MAX 2500V进行XRD。用TESCAN MIRA LMS获得SEM图像。


    ## 2.6 Cell experiments


    ### 2.6.1 Cell culture.

    从广西医科大学实验室细胞库培养HeLa和A549细胞。将细胞在含10%胎牛血清和1%青霉素/链霉素的高糖DMEM培养基中于37 °C、5% CO₂条件下培养。


    ### 2.6.2 In vitro cytotoxicity experiments.

    将HeLa和A549细胞接种于96孔板中，并用不同浓度的金属氧化物纳米颗粒处理（每种材料五个浓度梯度），处理24或48小时。共培养后，用含10% CCK8或MTT的DMEM更换培养基，孵育1–4小时，去除培养基，每孔加入100
    µL DMSO。用酶标仪在450 nm处测量吸光度以评估相对细胞活力。


    ## 3 Results and discussion


    ### 3.1 Data retrieval and mining

    从2004年至2023年发表的152篇关于纳米材料细胞毒性的研究中汇编了一组数据集。关键词如“nanoparticles/nanomaterials/nanometals
    + toxicity/cytotoxicity”用于筛选包括Google、Scopus、CNKI、ACS、Wiley、Science和PubMed在内的广泛在线资源。初始选择标准要求详细描述核心材料、直径、鉴定细胞类型、暴露时间以及平均细胞活力/毒性及其标准差。从初步选择中提取了针对纳米金属、其氧化物和肿瘤细胞的特定数据，共得到2765个实例。这些实例涵盖了纳米颗粒类型、尺寸、形状、包覆、表面电荷、浓度、细胞特性、检测类型、暴露时间以及由此产生的细胞活力值等特征。这些数据特征的分布如图2所示。


    ![](img/e061c8b3120c138d68e9c0f44c089069_4_0.png)


    Fig. 2 Overview of nano particle data attributes/features in literature (2765
    data points).

    图2 文献中纳米颗粒数据属性/特征概览（2765个数据点）。


    值得注意的是，数据集表现出一定程度的类别不平衡，其中656个样本被归类为有毒（细胞活力 < 50%）和2109个为无毒。这种不平衡主要与本研究的重点相关，该研究集中于与癌症治疗相关的金属和金属氧化物纳米颗粒。在该领域，由于其转化潜力和生物医学应用的适用性，通常优先选择生物相容性良好、低毒性的纳米材料。


    纳米颗粒的细胞毒性是一个复杂的过程，受多种参数影响，包括表面电荷、表面包覆、化学组成、流体动力学直径、表面积、纳米颗粒浓度以及决定纳米颗粒环境的细胞描述符。为了建立可靠且可解释的机器学习模型，必须收集包含所有这些参数的广泛数据。为了提高模型的预测准确性并加深对纳米颗粒细胞毒性机制的理解，我们从各种参考文献中提取了M/MOx
    NPs的17个特征。除了15个量子化学特征外，我们还添加了7个分子特征：金属电负性（χ）、单金属氧化物中金属电负性之和（∑χ）、特定金属氧化物中氧原子数与金属电负性之和的比值（nO/∑χ）、金属原子数（NMetal）、氧原子数（NOxygen）、对应氧化物的金属阳离子电荷（q）以及分子量（MW）。这些特征可以从分子式中轻松推导并从元素周期表中获得。所有数据可视化如图3a所示。特征选择用于减少相关特征的数量，导致参数之间相关性较低（图3b）。


    ### 3.2 Quantum chemistry calculations

    制备了描述M/MOx NPs的团簇结构。首先，使用实验晶体结构构建M/MOx NPs的球形团簇。在模型团簇设计中，Materials Studio⁶⁹被用于沿各轴扩展晶胞以生成多晶胞，然后基于晶体结构的点对称性作为约束，选择距离多晶胞中心4.5
    Å内的原子。球形团簇的设计考虑了M/MOx NP表面曲率对其分子轨道（MO）结构的影响。团簇以4.5 Å的距离以类似方式生成，以便公平比较其反应性。在QM计算中，使用MOPAC2016（ref.
    71）中实现的半经验PM7（ref. 70）方法在模型对称性约束下优化模型团簇的几何形状。


    ![](img/e061c8b3120c138d68e9c0f44c089069_5_0.png)


    Fig. 3 (a) Data visualization of the dataset; (b) process the correlation matrix
    on the dataset.

    图3 （a）数据集的数据可视化；（b）对数据集进行相关矩阵处理。


    为了计算与反应性相关的进一步描述符，进一步利用密度矩阵中MO线性组合中每个原子轨道的系数来计算M/MOx NP的反应性相关描述符。72 QM描述符制备的概要如图4所示。


    量子化学描述符反映了M/MOx NPs的内在电子、结构和反应特性，并为这些纳米材料如何与生物系统相互作用提供了机制性见解。例如，HOMO能级指示纳米颗粒捐电子的趋势；较高的HOMO值与更强的供电子能力相关，这可以促进氧化还原反应


    ![](img/e061c8b3120c138d68e9c0f44c089069_5_1.png)


    Fig. 4 Quantum chemistry features and computational processes.

    图4 量子化学特征及计算过程。


    与细胞组分发生并诱导氧化应激。同样，Eg与材料的电子可激发性相关；较窄的带隙通常意味着更高的反应性和产生ROS的更大可能性，而ROS是纳米颗粒诱导细胞毒性的关键因素。电负性反映了金属中心吸引电子的趋势，其中电负性较低的材料通常更具还原性且易于产生ROS。ω、S和η影响纳米颗粒对生物亲核体（如蛋白质或DNA碱基）的稳定性和反应性。较高的亲电性值意味着从生物分子接受电子的更大能力，可能导致加合物形成或酶抑制。Pol影响粒子电子云对外部场（如生物环境中）的响应；更大的极化率可能增强与带电细胞表面或大分子的相互作用。CA和CV提供空间度量，反映颗粒的表面暴露及其与周围分子或膜的相互作用潜力。这些描述符结合起来使模型能够捕捉与纳米毒性途径直接相关的细微结构和电子特征，如氧化损伤、膜穿透或大分子结合。


    ### 3.3 Data supplementation

    由于现有数据集中存在未知或缺失值，包括zeta电位——一个表征纳米颗粒周围环境且对描述毒性现象至关重要的参数——所有数据集参数中很大一部分为空白（图2A）。删除所有此类样本显著减少了数据集大小，给当前方法带来限制。不完整观测可能对机器学习算法的性能产生不利影响。为解决此问题，我们使用基于相似性的方法补充数据。


    通过对相似性结果的分析，我们发现Jaccard相似系数更有效地衡量我们数据集内的相似性。我们假设这是因为Sφ系数73通常评估两个二元变量之间的对称相关性，适用于1和0数量大致相等的情况。然而，我们的数据集1和0分布不均，这使得Sφ系数的性能相比Jaccard相似系数较差。


    因此，尽管Sφ系数在某些对称且平衡的二元变量分析中很有用，但由于其关注匹配1而忽略共同0，Jaccard相似系数更适合我们特定数据集和研究背景。我们使用Jaccard相似系数评估数据集内的相似性，对每个纳米颗粒进行成对计算。最相似的结果用于填补缺失数据。


