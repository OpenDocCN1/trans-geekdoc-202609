    tool for accelerating the development of needed nanoparticles.43 When applied
    to the complex relationships between variables and unknown outcomes, machine learning
    can reveal hidden features in data, offering deeper insights into the characteristics
    leading to nanotoxicity. For instance, researchers used partial least squares
    (PLS) regression to establish a nano-QSAR model and found that charge density
    and surface charge were the main factors in gold nanoparticle exudation.44 Another
    study predicted the bioactivity of gold nanoparticles using several linear and
    nonlinear machine learning algorithms based on the composition of the protein
    corona, identifying key proteins as promoters or inhibitors of cellular association.45
    A recent study used decision tree modeling and feature selection algorithms to
    find that cytotoxicity test indicators were significant determinants of viability
    outcomes.46


    Current research predominantly focuses on the effects of inorganic nanomaterials
    on the environment and general cells, rather than on tumor cells specifically.47–62
    Furthermore, despite the presence of some related data in datasets, significant
    issues such as data scarcity, extensive missing critical data, low model accuracy,
    and insufficient model interpretability persist.


    In this study, as shown in Fig. 1, we collected and organized data on the toxicity
    of metal and metal oxide nanomaterials towards tumor cells and their intrinsic
    characteristics (chemical composition, metal electronegativity, number of oxygen
    atoms, number of metal atoms, molecular weight, metal cation charge, coating/functional
    group, particle size, concentration, zeta potential, and tumor cell type, source,
    morphology, and exposure time, detection method, interference check, colloidal
    stability, and positive control setting) totaling 2765 groups of literature data.
    In addition, in order to better understand the relationship between structure
    and activity in nano-QSAR research, we calculated and introduced 16 quantum chemical
    descriptors63 including Heat of formation (HoF), COSMO area (CA), COSMO volume
    (CV), ionization potential (IP), Highest Occupied Molecular Orbital (HOMO), Lowest
    Unoccupied Molecular Orbital (LUMO), No. of Filled Levels (NFL), molecular weight,
    point group, cluster electronegativity (Tχ), molecular hardness, electrophilicity,
    bandgap energy (Eg), polarizability (Pol), softness (S) by PM7 semi-empirical
    method. We used the Jaccard similarity coefficient64–66 to supplement missing
    data


