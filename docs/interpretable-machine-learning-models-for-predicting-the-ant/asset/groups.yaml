    ## 3.4 模型构建与比较


    为了训练我们的模型，我们选择了九种主流且具有代表性的机器学习算法，包括卷积神经网络（CNN）、74 多层感知机（MLP）、75 随机森林、76 极端梯度提升（XGBoost）、77
