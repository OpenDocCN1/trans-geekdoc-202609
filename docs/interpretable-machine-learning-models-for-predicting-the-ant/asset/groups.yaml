    ## 4 结论


    在本研究中，我们整理了来自已发表文献的 2765 个金属和金属氧化物（M/MOx）纳米颗粒对肿瘤细胞的毒性数据点，并使用 Jaccard 相似系数处理了数据缺口。我们开发了一个可解释的机器学习模型，结合物理化学、分子和量子化学描述符，用于预测
    26 种纳米颗粒类型在 32 种肿瘤细胞系中的体外细胞毒性。基于相关性分析的特征选择提升了模型性能，最终的 LGBM 模型在交叉验证中达到了超过 90% 的准确率。特征重要性和效应分析揭示了关键变量，与实验理解一致，支持了模型的解释性。使用新合成的稀土金属氧化物纳米颗粒进行的实验验证证实了模型的预测能力。该方法提供了一种稳健、可扩展且高效的计算工具用于毒性筛选，为肿瘤靶向纳米材料的理性设计提供了实践指导（图
    10）。


