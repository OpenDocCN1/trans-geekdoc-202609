    ## 3.5.2 特征效应。


    虽然特征重要性可以解释哪些特征显著影响黑箱机器学习模型的预测，但预测目标与特征之间的关系仍然不明确（线性、单调或更复杂）。在此，应用了三种模型无关的方法从局部或全局角度理解特征效应。PDP
    旨在通过对特征不同取值下模型输出进行平均来显示一个或两个特征对模型预测的边际效应。89 PDP 可以轻松可视化预测目标与所选特征之间的关系，但由于平均边际效应，异质性效应可能会被隐藏（即同一特征对个体的影响可能不同）。ICE
    通过突出个体观测值的估计函数关系来分解这一均值。90 在 ICE 图中，每条线反映了当所选特征变化时实例的预测目标的变化。PDP 是 ICE 图中所有线的平均值。特征效应的可视化结果如图
    7 所示。从 PDP 和 ICE 图中可以直接观察到相应特征对结果的影响，例如 M/MOx 纳米颗粒的细胞毒性随着浓度、暴露时间、分子量和 HOMO 的增加而降低（7a、b、g
    和 h）。高 HOMO 值通常意味着材料的电子更容易转移或参与反应，尤其是在与生物系统的相互作用中。较高的 HOMO 值增加了材料发生氧化的倾向，导致自由基的产生或与细胞内生物分子（如蛋白质和
    DNA）发生电子转移，从而导致细胞损伤或细胞毒性。M/MOx 纳米颗粒的细胞毒性与 zeta 电位、CA、n_O/∑x 和 Pol 成反比（7d、e、f 和
    i）。有趣的是，我们发现粒径在 10–110 nm 之间的 M/MOx 纳米颗粒具有更强的细胞毒性（6c）。一般来说，小尺寸纳米颗粒通常具有更高的表面能和活性，使其易于穿透细胞膜或触发氧化应激反应，导致更高的细胞毒性。然而，在我们的
    PDP 结果中，0–10 nm 并未显示出预期的高细胞毒性。这可能是因为小尺寸纳米颗粒倾向于在溶液中聚集，


    ![](img/e061c8b3120c138d68e9c0f44c089069_8_0.png)


    图 7 九个重要特征的特征效应。（a–i）不同特征的 PDP 和 ICE 结果。带黄色阴影的粗线为 PDP。


    形成较大的颗粒，从而减少它们与细胞的直接相互作用。91 此外，在生物系统中，较小的纳米颗粒可能更容易被自噬体和巨噬细胞等防御机制识别和清除，从而降低其毒性。92


    当特征相互作用时，两个特征之间的联合效应可能是非加性的。在大多数实际情况下，或多或少存在相互作用。因此，为了使学习模型具有可解释性，有必要考虑特征相互作用的强度和有效性。特征交互通常被视为两个特征之间的交互，因为更多特征之间的交互难以可视化和解释。两个特征之间的偏依赖关系可以在交互等高线图中可视化。值得注意的是，这种交互可能只是相关性而非因果关系，因为该图显示了特征交互的全局解释而没有效应分解。SHAP
    依赖图是可视化两个特征之间交互的另一种方法，其中 x 轴上单个特征值的垂直离散表示与另一个特征的交互效应。然而，这种可视化工具难以显示两个没有固有逻辑关系的分类特征之间的交互。图
    8 显示了前四个特征中两个特征之间的组合效应。浓度在所有图中都显示出强影响，浓度越高细胞毒性越强（8a–c）。zeta 电位与粒径之间存在复杂关系（8e），特别是在负
    zeta 电位下，毒性随着粒径增大而增加。暴露时间也在一定程度上增加了细胞毒性（8d 和 f），尤其是在较小的粒径和负 zeta 电位下。暴露时间越长，毒性越强。总体而言，细胞毒性与纳米材料的浓度、粒径、zeta
    电位和暴露时间之间存在高度非线性交互。合理控制这些因素可能降低纳米材料的细胞毒性。


    ![](img/e061c8b3120c138d68e9c0f44c089069_8_1.png)


    图 8 使用 PDP 和 SHAP 依赖图来可视化两个特征之间的组合效应。（a–c）分别表示浓度与粒径、暴露时间和 zeta 电位；（d 和 e）粒径与暴露时间和
    zeta 电位；（f）暴露时间与 zeta 电位。


    ## 3.6 实验结果比较


    为了进一步证明模型的实际应用，我们在实验室合成了六种不同类型的金属氧化物纳米颗粒（ZnO、CdO、Cu₂O、CeO₂、Er₂O₃、Nd₂O₃），并使用 zeta
    电位测量、X 射线粉末衍射（XRD）和扫描电子显微镜（SEM）对其进行表征以提取关键参数（图 9）。培养了两种肿瘤细胞系（A549 和 HeLa），并对其毒性预测进行了评估。值得注意的是，未出现在训练数据集中的
    CeO₂、Er₂O₃、Nd₂O₃ 纳米颗粒被纳入其中以测试模型的泛化能力。针对每种纳米颗粒设计了五个浓度梯度，两个暴露时间（24 h 和 48 h）和两种检测方法（MTT
    和 CCK8），得到 240 个实例的数据集（作为 Excelsheet2 附件）。模型的预测结果如表 4 所示。为了进一步评估预测模型在真实实验环境中的可靠性和实用性，对实验数据进行了
    SHAP 分析，以阐明各个特征对细胞活力结果的贡献。如图 10 所示，从每个材料类别中随机选择一种代表性金属氧化物纳米颗粒——ZnO、CdO、Cu₂O、CeO₂、Er₂O₃
    和 Nd₂O₃——进行基于 SHAP 的预测和解释。在 SHAP 图中，箭头代表有影响的特征，如 zeta 电位、浓度和暴露时间；红色箭头表示正向贡献（即增强细胞存活），而蓝色箭头反映负面影响（即增加细胞毒性）。最终的
    SHAP 输出 f(x) 表示预测的细胞活力水平。例如，ZnO 的 f(x) 值较低，为 −1.71，表明细胞毒性高，而 CdO 的 f(x) 值较高，为
    7.43，表明毒性低。SHAP 解释揭示细胞毒性源于多个特征之间的复杂相互作用。总体而言，较高的纳米颗粒浓度倾向于降低细胞活力，带负电的表面可能加剧细胞相互作用，更长的暴露时间会增加毒性。这些机制性见解可以为未来的实验策略提供信息，例如优化浓度和暴露时间以最小化不良生物效应。


