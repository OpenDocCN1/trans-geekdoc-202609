    diameter in solution, which better simulated experimental conditions, was selected
    for our analysis.


    Additional data extracted included whether NP interference checks were conducted,
    colloidal stability checks in the culture medium, and the use of positive controls.
    To prepare the data for machine learning, the units for NP size (nm), zeta potential
    (mV), concentration (µM), and exposure time (h) were standardized. Further descriptive
    attributes were added for the cells, including whether the cells were cell lines
    or primary cells, whether they were of human or animal origin, cell morphology,
    cell age, and organ or tissue origin, as well as detection methods (including
    reagents and biochemical markers). For more detailed information, please refer
    to ESI, Sheet 1.†


    To account for variability and potential systematic errors across different studies,
    several data cleaning and harmonization steps were conducted. First, only studies
    reporting essential experimental details (e.g., exposure time, NP concentration,
    viability values, and assay method) were included. Data points showing clear indications
    of experimental artifacts, such as nanoparticle agglomeration, instability in
    culture media, or known assay interference, were excluded. Furthermore, to reduce
    systematic bias, we selected the most comparable measurement type across studies—specifically,
    hydrodynamic diameter for size and zeta potential in deionized water rather than
    in complex media. Assay types were recorded, and studies using incompatible or
    non-standard cytotoxicity protocols were omitted. Where ranges or inconsistent
    formats were used, midpoints or standardized metrics were calculated (e.g., converting
    ranges to averages or normalizing concentration units). Despite these efforts,
    we acknowledge inherent inter-study variability; however, by using a sufficiently
    large dataset and feature-based modeling, the machine learning approach can account
    for such noise and still identify robust, generalizable patterns.


    # 2.1.3 Data supplementation.


    To address missing values in the dataset, this study employs an imputation method
    based on the Jaccard similarity coefficient, implemented through the following
    steps: (i) similarity calculation phase: for each data sample containing missing
    values, the Jaccard similarity coefficient is computed between its complete features
    and those of all other samples; (ii) imputation execution phase: the complete
    sample exhibiting the highest Jaccard similarity coefficient with the deficient
    sample is selected, and its corresponding feature values are used for imputation.
    The algorithm used for this imputation process, along with the complete machine
    learning workflow, is available in the GitHub repository listed in the Data availability
    section.


    In this study, similarity between data points was measured using the Sφ coefficient
    (formula (1)) and the Jaccard similarity coefficient (formula (2)). The similarity
    metrics were based on a contingency table (Table 1).


    In Table 1: represents the number of positions where both variables are 1. a-represents
    the number of positions where the first variable is 1 and the second variable
    is 0. b-represents the number of positions where the first variable is 1 and the
    second variable is 0. c-represents the number of positions where the first variable
    is 0 and the second variable is 1.


    # Table 1 Contingency table for similarity evaluation


    | | Value 1 | Value 0 |

    |---|---|---|

    | Value 1 | a | b |

    | Value 0 | c | d |


    d-represents the number of positions where both variables are 0.


    Sφ = (ad − bc) / √((a + b)(a + c)(b + d)(c + d)) (1)


    J = a/(a + b + c) (2)


    # 2.2 Machine learning


    # 2.2.1 Light Gradient Boosting Machine (LightGBM).


    LightGBM is an efficient gradient boosting framework that utilizes histogram-based
    learning algorithms to handle large-scale and high-dimensional data effectively.
    In this study, a grid search was performed to optimize key parameters such as
    learning rate, tree depth, and the number of leaves. The best parameter combination
    was selected using cross-validation, and the optimized LightGBM model was used
    for model building and performance evaluation.


    # 2.2.2 Convolutional neural network (CNN).


    Convolutional Neural Networks (CNNs) are deep learning models designed for automatic
    feature extraction and classification from one-dimensional data. The architecture
    consists of two convolutional layers, utilizing 32 and 64 filters, respectively,
    with a kernel size of 3. Each convolutional layer is followed by a max pooling
    layer (pooling size of 2) to reduce the dimensionality of the feature maps. After
    the convolution and pooling operations, the data is flattened and processed through
    two fully connected layers. The final output is obtained through a sigmoid activation
    function, which facilitates binary classification. This model is flexible and
    can accommodate varying input dimensions.


    # 2.2.3 Multi-Layer Perceptron (MLP).


    The Multi-Layer Perceptron (MLP) is a classical feedforward neural network that
    learns the nonlinear relationships between input features. The model comprises
    three fully connected layers, where the input features first pass through a layer
    with 128 neurons, followed by a hidden layer containing 64 neurons, and a final
    output layer producing a single prediction. The output layer applies a sigmoid
    activation function for binary classification. MLP is particularly well-suited
    for processing flattened input data and for capturing complex nonlinear relationships
    among descriptors to make accurate predictions.


    # 2.2.4 Random Forest (RF).


    Random Forest is an ensemble method based on decision trees that is robust and
    effective for handling high-dimensional features. In this study, the WEKA implementation
    of Random Forest was used, constructing trees based on the default number and
    selecting features randomly. The majority voting (classification) or mean calculation
    (regression) of individual trees produces the final prediction. This method serves
    as a baseline model for comparing complex nonlinear data.'
  - '[PAGE 3]


    # 2.2.5 Extreme Gradient Boosting (XGBoost).


    XGBoost is an efficient implementation of gradient boosting with strong regularization
    and parallel computing capabilities. In this study, XGBoost was used with default
    parameters, including a fixed learning rate and maximum tree depth, to assess
    its predictive power on the dataset.


    # 2.2.6 Support Vector Machine (SVM).


    The Support Vector Machine (SVM) leverages kernel functions to map data into higher-dimensional
    spaces, optimizing the classification boundary for maximum margin. A radial basis
    function (RBF) kernel was used in this study, with regularization parameters set
    to their default values. SVM is employed to model both linear separability and
    complex boundaries in descriptor data.


    # 2.2.7 Logistic regression.


    Logistic regression is a linear classification method based on the sigmoid function
    to output probabilities. In this study, logistic regression was used as a baseline
    model without tuning the regularization parameters to evaluate the linear separability
    of descriptors.


    # 2.2.8 k-Nearest Neighbors (kNN).


    k-Nearest neighbors (kNN) is an instance-based method for prediction, where the
    target sample is assigned the majority class (classification) or mean value (regression)
    of its k nearest neighbors in the feature space. The optimal value of k was automatically
    chosen via cross-validation, with Euclidean distance as the distance measure.


    # 2.2.9 Naive Bayes.


    Naive Bayes is a classification method based on Bayes'' theorem, assuming independence
    between features. In this study, the model assumes conditional independence among
    descriptors and outputs posterior probabilities for classification.


    # 2.3 Model validation and evaluation


    The accuracy of the models was estimated using five-fold cross-validation and
    by predicting the test sets. The test sets were obtained through cell experiments
    on a series of synthesized metal oxide nanoparticles.


    To evaluate the performance of the models, the following metrics were calculated:
    ROC, AUC, precision, recall, F1 score, and balanced accuracy. Additionally, confusion
    matrices were plotted to assess the classification performance, showing the number
    of correctly classified instances as well as the misclassified compounds (false
    positives and false negatives).


    The formulas for the calculated parameters are as follows:


    Sensitivity (Sn), also known as true positive rate, measures the proportion of
    actual positives correctly identified by the model.


    Sn = TP/(TP + FN)


    where TP is the number of true positives and FN is the number of false negatives.


    Specificity (Sp), also known as true negative rate, measures the proportion of
    actual negatives correctly identified.


    Sp = TN/(TN + FP)


    where TN is the number of true negatives and FP is the number of false positives.


    Precision (Pr) measures the proportion of positive predictions that are actually
    correct.


    Pr = TP/TP + FP


    Recall (R) is equivalent to sensitivity (Sn), as it also measures the proportion
    of actual positives that are correctly identified.


    Recall = Sn


    F1 score is the harmonic mean of precision and recall, providing a balance between
    the two.


    F1 = 2 × (Pr × recall)/(Pr + recall)


    Balanced accuracy (AC) is the average of sensitivity and specificity, providing
    a single metric for classification quality when the class distribution is imbalanced.


    AC = 0.5 × (Sn + Sp)


    These metrics were calculated using standard Python libraries, allowing for the
    comprehensive evaluation of model performance in the context of nanoparticle toxicity
    prediction.


    # 2.4 Synthesis experiments


    # 2.4.1 ZnO.


    Add 98 mL of anhydrous ethanol to a 250 mL round-bottom flask and heat it to a
    constant temperature of 80 °C using an oil bath. Add 0.577 g of SDS to the flask
    and stir until completely dissolved. Then, quickly add 2 mL of 0.5 mol L−1 zinc
    acetate solution, initiating the reaction with zinc acetate in the amount of 1
    × 10−3 mol. After 30 minutes, stop heating, cool the sample to room temperature,
    and centrifuge. Wash the resulting powder with deionized water and anhydrous ethanol
    at least three times, then air-dry to obtain white powder.


    # 2.4.2 CdO.


    Dissolve 1 g of cadmium sulfate (3CdSO4·8H2O) in 50 mL of a Teflon-lined stainless-steel
    autoclave, adding 3 mL of 30% hydrogen peroxide and 27 mL of distilled water.
    Adjust the solution pH to 10 using ammonia, then react at 100 °C for 12 hours
    in an oven. After cooling, filter and wash with distilled water and anhydrous
    ethanol, then dry at 80 °C in the air for 2 hours to obtain white powder.


    # 2.4.3 Cu2O.


    Prepare a reaction solution of CuSO4 and maintain it at 70 °C in a water bath
    with stirring. Add 1.6 g L−1 of polyvinylpyrrolidone (PVP) to the CuSO4 solution,
    followed by NaOH solution (2 mol L−1). Gradually add N2H4·H2O solution. The reaction
    solution turns from blue to green, producing an orange-yellow precipitate. After
    4 hours, wash the precipitate with anhydrous ethanol and dry under vacuum at 70
    °C for 8 hours to obtain a powder sample.


    # 2.4.4 CeO2.


    Stir a microemulsion containing Ce(NO3)3 on a magnetic stirrer for about 5 minutes,
    introducing N2 gas during the reaction. Add a microemulsion containing ammonia
    while stirring, forming a pale yellow precipitate at pH = 10.'
