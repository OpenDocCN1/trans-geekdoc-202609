    3) 基于 TOP-N 的推荐算法：\( N \) 的值在基于 TOP-N 的推荐算法中至关重要。在我们的实验中，其值是动态确定的，即 \( N = \frac{1}{3}
    Q \)，其中 \( Q \) 是评分为 5 的评分数量。


    我们选择未执行 PCMS 的算法作为基线。桶数 b 对于 ML\_100K 和 ML\_20M 分别设置为 1536 和 24576。在这种情况下，两种不同算法的
    TOP-N 推荐结果如 Fig. 3 所示。


    我们可以观察到，当 \( \varepsilon \) 较大时，Precision 和 \( F_1 \) 得分相应较高，但当 \( \varepsilon
    \) 大于 0.4 时，改进有限，这表明隐私保证与推荐准确性之间存在权衡。然后结合 Fig.2，我们可以选择合适的 \( \varepsilon \) 来很好地平衡准确性和隐私。与基线相比，所提机制并未带来多少性能损失，尤其是对于数据样本更多的
    ML\_20M，这意味着所提机制足够有效。


    ## V. DISCUSSION


    如 Table II 和 Table III 所示，为提高效率，可以选择最优桶数 b。但是，本文仅评估了基于 Min-Hash 的聚类的有效性，其二进制形式可以判断用户是否观看过某部电影。固有的简单性在一定程度上会带来准确性损失。因此，我们认为，如果在聚类算法中考虑用户的偏好特征，或应用其他设计良好的算法，可能会产生更准确的聚类结果。


    Fig.2 展示了基于 PCMS 的本地差分隐私在保护隐私方面的可行性。实际上，各种扰动机制都能实现类似目标。在未来工作中，将对这些方法进行比较，以选出一种对我们的推荐机制性能损失更小的方法。


    Fig.3 表明在选择合适的 \( \varepsilon \) 时可以获得可接受的准确性，这体现了效用与隐私之间的平衡。但是，\( F_1 \) 得分低于预期。一个可能的解释是基于
    TOP-N 的推荐系统中 \( N \) 的值不合适。在本文中，我们仅提出了一条经验法则来动态设置该值。因此，如何确定 \( N \) 的适当值仍有待研究。


    ## VI. CONCLUSION


    本文提出了一种基于区块链技术的隐私保护推荐机制。区块链的分布式特性使用户能够在将原始数据保存在本地的同时获得推荐。所提机制的特点在于结合了 IPFS 和本地差分隐私机制，这大大降低了计算和通信成本，并在推荐过程中提供了隐私保证。在两个真实世界数据集上进行的实验表明，通过选择合适的
    \( \varepsilon \)，可以在推荐准确性和用户隐私之间保持理想的平衡。所提机制可接受的性能激励我们进一步改进该机制，并在未来工作中将其应用于主要针对书籍或移动应用的真实世界推荐系统。


