    to address privacy issues. In that framework, secure multi-party computation is
    leveraged for encrypting and preserving the privacy information of customers in
    an e-commerce system for shopping [7]. However, the analysis of efficiency as
    well as the accuracy of that framework were not provided. Furthermore, all the
    computation is processed in the blockchain, making it is impractical for the real-world
    deployment due to the high computational overhead. Umekwudo et al. [8] applied
    the blockchain to recommendation system in mobile environment, but data is still
    processed in the blockchain. In addition, the introduced third-party organization
