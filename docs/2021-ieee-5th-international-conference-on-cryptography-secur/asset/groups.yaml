    ## 基于区块链的隐私保护推荐机制


    Liangjie Lin

    计算机科学与技术学院

    中国深圳哈尔滨工业大学

    sherlocklij@163.com


    Yuchen Tian

    计算机科学与技术学院

    中国深圳哈尔滨工业大学

    19s051060@stu.hit.edu.cn


    Yang Liu

    计算机科学与技术学院

    中国深圳哈尔滨工业大学

    网络空间安全研究中心

    鹏城实验室

    liu.yang@hit.edu.cn


    ### 摘要


    推荐系统广泛用于预测用户兴趣并为其提供有针对性的产品，有效地缓解了大数据时代普遍存在的信息过载问题。不幸的是，产生更准确的预测需要大量与用户隐私密切相关的数据。在这种情况下，此类数据的收集和传输通信成本高昂；处理和分析此类数据很可能会危及用户隐私。在本文中，我们提出了一种基于区块链的隐私保护推荐机制，该机制很好地解决了这些问题。利用区块链的固有优势，我们建立了一个完全分布式模型，减轻了由集中式数据存储引起的隐私泄露风险。此外，我们将星际文件系统（IPFS）与区块链相结合，大大提高了通信效率。我们还将局部敏感哈希和局部差分隐私引入所提机制，以减少计算负载并提供强大的隐私保障。实验结果表明，与基线相比，所提机制在保持理想推荐准确性的同时，在隐私保护方面表现更出色。


    ### 关键词


    大数据；区块链；隐私；推荐；局部敏感哈希；局部差分隐私


    ## I. 引言


    推荐系统被提出作为一种有前景的技术，以解决大数据时代的信息过载问题。然而，为了提高推荐质量，需要收集大量用户数据，这带来了许多隐私问题。法律层面的努力已被用于保护用户隐私。例如，欧洲议会一致通过了《一般数据保护条例》（GDPR）[1]，该条例于
    2018 年 5 月生效。此后，美国加利福尼亚州政府也建立了《加州消费者隐私法案》（CCPA）[2]，该法案于 2020 年 1 月生效，以确保消费者的隐私权利和利益。推荐系统对用户数据需求量大，在普遍关注隐私的社会中，保护用户隐私至关重要。


    目前，许多实现隐私保护的方法基于分布式环境下的集中式框架 [3, 8]。为此，用户数据仍然需要被收集并存储在中央服务器中。在本工作中，我们提出了一种利用区块链固有去中心化特性的完全分布式推荐机制。在此框架中，用户原始数据本地保存，以最大限度地降低隐私泄露风险。此外，我们应用局部差分隐私技术来进一步最大限度地减少这种泄露。


    更具体地说，我们遵循 [4] 中的基本框架，实现了基于 Jaccard 相似度的最小哈希算法，并引入 CRC32 验证算法用于数据聚类，使离线计算更加高效和安全。此外，我们在用户端通过随机响应机制
    [5] 向数据添加小扰动来使用局部差分隐私，这可以进一步增强系统保护用户隐私的能力。据我们所知，本文是第一个将区块链技术、推荐算法和差分隐私相结合以实现隐私保护的文章。考虑到由于聚类过程和扰动过程中的参数，推荐准确性会下降，我们进行了实验以展示如何取得平衡。本文分析和讨论了基于所提系统的可能隐私攻击。


    相关工作。Fery 等人 [6] 首先提出了基于区块链的推荐框架以解决隐私问题。在此框架中，安全多方计算被用于加密并保护电子商务购物系统中客户的隐私信息 [7]。然而，该框架未提供效率及准确性分析。此外，所有计算都在区块链上进行，由于计算开销高，使其在实际部署中不切实际。Umekwudo
    等人 [8] 将区块链应用于移动环境中的推荐系统，但数据仍在区块链中处理。此外，引入的第三方组织可能会使用户面临隐私泄露风险。此后，Omar 等人 [9]
    使用区块链构建了客户端驱动的推荐架构，但他们未分析该架构的效率和性能。随后，Fran Casino 等人 [4] 实现了第一个基于区块链的高效且可扩展的推荐系统。他们将区块链与星际文件系统（IPFS）和超比特局部敏感哈希相结合。此外，他们提出了三种推荐策略，有效地保护了用户隐私并提高了计算效率和推荐准确性。然而，在该系统中，仅使用静态值来填充高度稀疏的数据，这不足以产生具有高推荐准确性的模型。并且，他们仅使用余弦相似度对数据进行聚类。此外，这三种推荐策略均未涉及差分隐私。


    ## II. 背景


    ### 区块链技术


    2008 年，为了维护交易顺序并避免比特币的双重支付问题，Nakamoto 引入了区块链结构。分布式特性可以在许多领域利用，以提供强大的网络安全和隐私保护水平。此外，它无需第三方或其他验证组织参与即可提供匿名和透明的服务
    [10]。


    ### 星际文件系统


    IPFS 是一种点对点形式的分布式文件系统。它也是一种基于内容寻址的超媒体传输协议，由于点对点架构，可以避免集中式故障。文件作为 IPFS 对象存储在系统中。我们可以通过启用链外存储和匿名文件共享来增强区块链和
    IPFS 的可用性 [11]。


    ### 局部敏感哈希


    局部敏感哈希（LSH）[12] 用于根据相似度映射数据集。具体来说，相似的数据倾向于映射到同一个桶中，而不相似的数据则映射到不同的桶中。可以根据不同的相似度计算方法实现各种形式的
    LSH。在本文中，我们使用基于 Jaccard 相似度的二进制 Min-Hash 算法。该算法的详细信息可在第 3.2 节中找到。在此情况下，数据集 A 和
    B 的相似度计算公式定义如下：


    \(J(A, B) = \frac{|A \cap B|}{|A \cup B|}\) (1)


    ### 局部差分隐私


    目前，差分隐私通常用于集中式环境，即数据被收集到中央服务器。在本文中，我们直接在用户端应用差分隐私，防止恶意第三方获取带有敏感信息的原始数据，并大大增强隐私保护能力。此外，随机响应机制使攻击者无法从用户处推断出正确的敏感信息。在本文中，我们选择一种基于
    Private Count Mean Sketch（PCMS [13]）的局部差分隐私算法，其详细信息可在第 3.3 节中找到。


    ## III. 我们的机制


    在本节中，我们将详细描述基于区块链的所提机制。更具体地说，该机制包含三个主要过程。首先，对每个用户本地执行 LSH 聚类和局部差分隐私，模糊后的数据被发送到
    IPFS 进行存储。之后，每个用户将获得 IPFS 返回的唯一哈希值，通过该值，用户可以再次访问数据。然后，将上一个过程的输出以及其他信息（例如，聚类结果（即桶编号）、哈希值、假名和当前时间戳）上传到区块链。每个用户负责记录这些数据。因此，用户可以从区块链中存储的交易数据中挑选相似的哈希值。最后，用户通过所选哈希值从
    IPFS 获取用于 TOP-N 推荐的模糊数据。所提机制的图示如图 1 所示。更多细节将在以下子节中介绍。


    ### A. 机制概述


    ![](img/ba6405dd3b4100239a8087f4ac628bd3_1_0.png)


    图 1. 提出的机制概览。


    在区块链中，创世块包含用于聚类所需的 LSH 函数、数据维度以及用于 PCMS 计算的哈希函数集。每个用户需要上传一个假名和一个时间戳，以区分它是否是最新数据，因为数据评分是动态的。此外，信息只能在特定时间间隔内上传一次，该间隔由应用程序开发者决定。


    在传统的分布式推荐系统中，整个成本主要由用户与服务器之间的数据传输占据，在这种情况下，区块链中交易过程和交易验证的成本微不足道。在所提机制中，在区块链和用户之间传输的数据尺寸要小得多（例如，哈希值、时间戳和假名）。此外，LSH
    聚类和差分隐私过程在不同用户之间并行执行。因此，我们的机制在各个方面都表现出高效性。此外，区块链 [4] 的固有特性（如稳定性、鲁棒性和可扩展性）在我们的机制中得到支持，而传统的分布式或集中式推荐系统则不支持。


    ### B. 基于 Min-Hash 的 LSH


    在此算法中，每个用户应生成一个稀疏矩阵，其中记录的项目标记为 1，否则为 0。然后，对该稀疏矩阵执行随机行排列。对于每个结果，记录每个列中值为 1 第一次出现的行数作为签名矩阵的一部分。之后，将签名矩阵分为多个带，每个带转换为一个唯一值。相应的桶编号通过
    CRC32 算法和模运算获得。

