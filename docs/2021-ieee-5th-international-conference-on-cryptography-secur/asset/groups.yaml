    ### B. 评估指标


    为了评估推荐准确性，我们使用以下指标：精确率P、召回率R和F1度量F1。它们的定义如下：


    ```

    P = \frac{\Sigma_{u \in U} |S(u) \cap T(u)|}{\Sigma_{u \in U} |S(u)|} \quad (2)

    ```


    ```

    R = \frac{\Sigma_{u \in U} |S(u) \cap T(u)|}{\Sigma_{u \in U} |T(u)|} \quad (3)

    ```


    ```

    F_1 = \frac{2*P*R}{P+R} \quad (4)

    ```


    其中U表示用户集，u表示某个用户（u ∈ U）。S(u)是推荐给用户的项目集，T(u)是用户行为项目集。|S(u)|和|T(u)|分别表示S(u)和T(u)中的元素数量。


    ### C. 实验结果与分析


    - 1) 基于Min-Hash的LSH聚类：我们使用不同的桶数进行实验，以找出后续实验的最佳桶数。由于两个数据结构相同，一些与数据处理相关的参数保持不变。置换次数、签名矩阵中的带数以及随机种子分别设置为100、25和19248。两个数据集之间唯一不同的参数是桶数b。引入了多个指标来评估性能，如表II和表III所示。表II中K表示某个用户的邻居数量。当K
    < 3时，K - 1个用户很容易串通起来推断其他用户的隐私信息，即我们需要避免的情况。K̄表示每个用户的平均邻居数量。利用率U揭示了用户数量大于1的桶所占的百分比。在某些桶中只有一个用户的场景下，寻找相似用户的过程将很昂贵。LSH算法可以大大降低计算负载，R指新计算负载与旧计算负载的百分比，1
    - R表示降低的计算负载。


    因此，对于ML_100K，当桶数b设置为1536时，所有桶的利用率为100%，且96.28%的计算负载被降低。同时，在K < 3时可以保持理想的隐私保护水平。同样，我们为ML_20M选择b
