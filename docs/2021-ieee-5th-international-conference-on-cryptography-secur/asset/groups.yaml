    ### Blockchain Technology


    In 2008, to maintain transaction orders and avoid the double payment problem of
    bitcoin, Nakamoto introduced the blockchain structure. The distributed features
    can be utilized in many areas to provide a strong level of network security and
    privacy preservation. Moreover, it can provide anonymous and transparent services
    without the participation of third parties or other verification organizations
