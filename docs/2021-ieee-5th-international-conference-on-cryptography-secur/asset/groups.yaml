    5: sketch M ← ComputerSketchMatrix ((v(i), j(i))), ..., ((v(n), j(n))), ε, k,
    m)

    6: for each d ∈ D_t do

    7: f(d) ← GetFrequencyStatistics(d_t, M, ε, H)

    8: end

    9: return F (f(d): d ∈ D_t)

