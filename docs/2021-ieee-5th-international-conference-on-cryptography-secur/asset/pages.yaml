    The pseudocode of Min-Hash algorithm is shown in Algorithm 1.


    ```

    Algorithm 1: Min-Hash Based LSH

    Input:

    M: Sparse matrix of raw data

    U_s: Random seed set by each user

    P: Row permutation times

    Nban: The number of bands in the signature matrix

    Nrow: The number of lines in each band

    Nbuc: The number of buckets that can be mapped

    Output:

    B: Bucket number set

    1: initialize matrix s with 0

    2: for each i ∈ P do

    3: generate seed with U_s

    4: row_order ← permutation rows

    5: M ← M[row_order, :]

    6: get the first row number of ''1'' in M''s each column

    7: s[i] ← first row number

    8: end

    9: current_row ← 0, initialize array buckets

    10: for each b ∈ Nban do

    11: band ← s[current_row: Nrow + current_row, :]

    12: current_row ← current_row + Nrow

    13: ids ← ravel_multi_index(band, band.max()(1)+1)

    14: buckets ← ids

    15: end

    16: initialize array B

    17: for each item ∈ buckets do

    18: get crc32_value of item

    19: hash_bucket ← crc32_value mod Nbuc

    20: B ← hash_bucket

    21: end

    22: return B

    ```


    # C. PCMS Based Local Differential Privacy


    The pseudocode of this method is shown in Algorithm 2. Each user perturbs raw
    data locally and sends the results to IPFS, then upload received IPFS hash to
    blockchain. Then users needing recommendations can obtain overall data features
    and rank the results in descending order. In the end, the algorithm provides these
    users with TOP-N items.


    # IV. EXPERIMENTAL STUDIES


    We conducted enough experiments to verify the effectiveness of the proposed mechanism
    on two real datasets. We first describe the environment and datasets used in the
    experiments, and subsequently explain the evaluation metrics. Finally, we show
    the performance of the mechanism under different parameter settings.


    # A. Experiment Setup and Datasets


    All the experiments are implemented in multiple Ubuntu 16.04 virtual machines
    running in two personal computers, one is configured with 12GB RAM, Intel i5-6300HQ
    CPU and the other is with 32GB RAM, Intel i9-9880H CPU. Each virtual


