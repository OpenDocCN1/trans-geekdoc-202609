    # V. DISCUSSION


    As shown in Table II and Table III, the optimal bucket number b can be chosen
    for the efficiency purpose. However, this paper only evaluates the effectiveness
    of Min-Hash based clustering, whose binary form can tell whether users have watched
    a movie or not. The inherent simplicity would bring accuracy loss to some extent.
    Therefore, we argue that it could yield a more accurate clustering result if users''
    preference features are taken into consideration in the clustering algorithm,
    or other well-designed algorithms are applied.


    Fig.2 shows the practicability of the local differential privacy based on PCMS
    to preserve one''s privacy. Actually, various perturbation mechanisms are able
    to achieve the similar goal. In the future work, a comparison between these methods
    will be conducted to pick up one with lower performance loss for our recommendation
    mechanism.


    Fig.3 suggests an acceptable accuracy when suitable \( \varepsilon \) is chosen,
    which demonstrates a balance between utility and privacy. However, the \( F_1
    \) score is lower than expected. One possible explanation is that the inappropriate
    value of \( N \) in TOP-N recommendation system. In this paper, we only propose
    a simple rule empirically to set the value dynamically. Thus, how to decide the
    proper value of \( N \) remains to be studied.


    # VI. CONCLUSION


    In this paper, we propose a privacy-preserving recommendation mechanism based
    on blockchain technology. The distributed nature of blockchain enables users to
    get recommendations while keeping the raw data locally. The feature of the proposed
    mechanism lies in the combination of IPFS and local differential privacy mechanism,
    which greatly reduces the computation and communication cost and provides a privacy
    guarantee during the recommendation process. The


    experiments conducted on two real word datasets suggest that by choosing the proper
    \( \varepsilon \), a desirable balance can be maintained between the recommendation
    accuracy and users'' privacy. The acceptable performance of proposed mechanism
    inspires us to further refine the mechanism and apply it into real world recommendation
    systems mainly targeting on books or mobile apps in the future work.


