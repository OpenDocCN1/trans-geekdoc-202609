    machine is allocated at least 6G RAM to support the experiments. The packages
    and tools used are Python 2.7.17, tensorflow 2.1.0, numpy1.16.6 and graphlab 2.1.
    Ethereum chain is used to record the required information during recommendation.
    We evaluate the mechanism on Movielens datasets¹ provided by GroupLens, the smaller
    dataset is termed as ML_100K, for the larger one, only half of the items are used,
    termed as ML_20M. The datasets containing the watched movies of each user and
    the rating value ranging from 0.5 to 5. The metadata of the two datasets is shown
