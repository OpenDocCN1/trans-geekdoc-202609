    Abstract—Recommendation system is widely used to predict users’ interests and
    provide targeted products for them, which effectively facilitates users in the
    era of big data where information overload problem is prevalent. Unfortunately,
    massive data closely related to users’ privacy is in high demand to produce more
    accurate predictions. In this case, the collection and transmission of such data
    is communication costly; to process and analyze such data is of high possibility
    to compromise users’ privacy. In this paper, we propose a privacy-preserving recommendation
    mechanism based on blockchain, which well addresses these problems. Leveraging
    the inherent advantages of blockchain, we establish a completely distributed model
    mitigating the risk of privacy disclosure caused by central data storage. Moreover,
    we combine Inter-Planetary File System with blockchain to greatly improve the
    communication efficiency. We also introduce local sensitive hashing and local
    differential privacy into proposed mechanism to reduce the computation load and
    provide a strong privacy guarantee. The experimental results demonstrate that
    the proposed mechanism shows better performance on privacy preservation while
    maintaining desirable recommendation accuracy when compared with the baseline.


    Keywords—big data; blockchain; privacy; recommendation; local sensitive hashing;
    local differential privacy


    # I. INTRODUCTION


    Recommendation system is proposed as a promising technology to address the information
    overload in the era of big data. However, massive users’ data need to be collected
    to improve the quality of recommendations, which brings a number of privacy issues.
    Efforts from legal aspects have been made to preserve users’ privacy. For example,
    the European parliament unanimously passed the General Data Protection Regulation
    (GDPR) [1], which came into effect in May 2018. After that, the California government
    of the United States also established the California Consumer Privacy Act (CCPA)
    [2], which took effect in January 2020, to ensure the privacy rights and interests
    of consumers. Recommendation system, having heavy demand for users’ data, is of
    vital significance to preserve users’ privacy in the society where privacy is
    widely concerned.


    At present, many approaches to achieve privacy preservation are based on centralized
    framework under the distributed environment [3, 8]. To this end, users’ data still
    needs to be collected and stored in the central server. In this work, we


    propose a completely distributed recommendation mechanism leveraging the inherent
    decentralized features of blockchain. In this framework, users’ raw data are preserved
    locally to well reduce the risk of privacy disclosure. In addition, we apply local
    differential privacy technology to further minimize this disclosure.


    More specifically, we followed the basic framework in [4] to implement the minimum
    hash algorithm based on Jaccard similarity and involve CRC32 verification algorithm
    for data clustering, making offline computation more efficient and secure. Moreover,
    we use local differential privacy on the users’ sides by adding a small perturbation
    to the data via the random response mechanism [5], which can further enhance the
    system’s ability to preserve users’ privacy. To the best of knowledge, this paper
    is the first to combine blockchain technology, recommendation algorithm, and differential
    privacy for the purpose of privacy preservation. Considering that the recommendation
    accuracy will be degraded due to the parameters in the clustering process and
    the perturbation process, we conduct experiments to demonstrate how to strike
    a balance. Possible privacy attacks based on the proposed system are analyzed
    and discussed in this paper.


    Related Work. Fery et al. [6] first proposed blockchain-based recommendation framework
    to address privacy issues. In that framework, secure multi-party computation is
    leveraged for encrypting and preserving the privacy information of customers in
    an e-commerce system for shopping [7]. However, the analysis of efficiency as
    well as the accuracy of that framework were not provided. Furthermore, all the
    computation is processed in the blockchain, making it is impractical for the real-world
    deployment due to the high computational overhead. Umekwudo et al. [8] applied
    the blockchain to recommendation system in mobile environment, but data is still
    processed in the blockchain. In addition, the introduced third-party organization
    may expose the users under the risk of privacy disclosure. Since then, Omar et
    al. [9] constructed a client-driven recommendation architecture using blockchain,
    but they didn’t analyze the efficiency and performance of this architecture. Then,
    Fran Casino et al. [4] implemented the first highly efficient and scalable recommendation
    system based on blockchain. They combined the blockchain with the Inter-Planetary
    File System (IPFS) and super bit locality sensitive. Furthermore, they proposed
    three recommendation strategies, effectively'
