    # C. Experimental Results and Analysis


    1) LSH clustering based on Min-Hash: We conduct experiments with different bucket
    numbers to find the optimal one for subsequent experiments. Since the two datasets
    have the same structure, some data-processing-related parameters are kept the
    same. The permutation times, the number of bands in signature matrix, and the
    random seed are set to 100, 25, and 19248 respectively. The only parameter different
    between the two datasets is the bucket number b. Several metrics are introduced
    to evaluate the performance, as shown in Table II and Table III. Table II K denotes
    the number of neighbors of certain user. When K < 3, K - 1 users can easily collude
    to infer privacy information of other users [4], that is the situation we need
    to avoid. K̄ represents the average number of neighbors of each user. Utilization
    rate U reveals the percentage of buckets where the number of users is greater
    than 1. In the scenario where only one user in some buckets, the process to find
    the similar users will be costly. LSH algorithm can greatly reduce the computation
    load, R refers to the percentage of new computation load to the old one, 1 - R
    represents the computation load reduced.


    Therefore, for ML_100K, when bucket number b is set to 1536, the utilization rate
    of all buckets is 100%, and 96.28% of computation load is reduced. Meanwhile,
    a desirable privacy protection level can be maintained when K < 3. Similarly,
