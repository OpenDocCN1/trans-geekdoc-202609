    # 7.4.3 Federated Proximal (FedProx)


    **Concept:** FedProx extends FedAvg by adding a proximal term that regularizes
    local updates, preventing drastic changes in model parameters. This helps stabilize
    training when there is heterogeneity in edge device capabilities or data distributions.
    The FedProx optimization function includes a proximal term: where the parameters
    are:


    +   * Regularized objective function

    * Local loss function on device

    * Current model parameters

    * Previous global model parameters

    * Proximal term weight (controls how much local updates deviate from the global
    model)


    # Advantages:


    +   * Handles heterogeneous edge devices—adapts to different computational and
    storage constraints.

    * Prevents extreme deviations in local models—reduces the risk of inconsistent
    updates.

    * Stabilizes model training in non-IID environments—regularization ensures that
    local updates do not diverge too much.


    # Challenges:


    +   * Computationally expensive—each local update requires additional regularization
    computations.

    * Slower convergence—proximal constraints can make training more conservative.


