    #  7.2.4 Model Convergence


    Unlike centralized training, where data is uniform and well-distributed, federated
    training must ensure *global model convergence* [3] despite disparities in local
    datasets. Challenges include:


    +   **Divergent Local Models**: Each device trains on a unique subset of data,
    local models may develop biases that negatively impact global model performance.


    +   **Unbalanced Data Contributions**: Some machines may generate significantly
    more data than others, skewing the training process and leading to an unbalanced
    model.


    +   **Drift in Data Distributions**: Equipment behavior and operating conditions
    evolve over time, causing data distributions to shift and reducing model accuracy.


    To achieve stable convergence, *adaptive federated optimization algorithms* such
    as *Federated Averaging (FedAvg)*, *momentum-aggregation*, and *personalized federated
    learning* can be employed to balance local updates while preventing drastic deviations
    in the global model.


