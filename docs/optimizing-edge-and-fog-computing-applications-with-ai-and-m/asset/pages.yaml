    The results demonstrate that PSO achieves a median optimality gap of 7.7% with
    bigger issue sizes, DRL provides a lower upper bound for larger problems and executes
    quicker, completing in less than 1 second. Gaps include PSO’s inability to handle
    large-scale jobs efficiently and the lack of attention for heterogeneity in network
    settings. Future research should focus on hybrid models that combine PSO accuracy
    with DRL scalability [30].


