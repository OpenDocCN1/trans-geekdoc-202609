    c. **Energy-Aware Optimization Definition:**

    Energy-aware optimization focuses on reducing energy consumption in a system by
    applying strategies and techniques that minimize power usage without compromising
    performance, especially in resource-constrained devices.


    +   1. **Energy-Efficient Scheduling:**

    **Description**: Tasks are allocated to nodes with lower energy consumption, ensuring
    that power-hungry devices are avoided for tasks that do not require high processing
    power.


    +   **Benefit**: Reduces overall energy consumption by selecting nodes that are
    more power efficient for specific tasks, optimizing the system''s energy usage.


    +   **Drawback**: May lead to performance degradation if less powerful nodes are
    consistently chosen for demanding tasks, as they may not be able to execute them
    efficiently.


    +   2. **Dynamic Voltage and Frequency Scaling (DVFS):**

    **Description**: The power levels of processors are adjusted in real-time based
    on workload demands. When the system is under low load, the processor voltage
    and frequency are reduced to save energy, and when the workload increases, they
    are ramped up to meet demand.


    +   **Benefit**: Helps balance power consumption with performance requirements,
    requiring energy usage during low-demand periods without significantly affecting
    performance.


    +   **Drawback**: Continuous scaling can introduce latency and may cause inefficiencies
    if the system doesn''t scale optimally, particularly in systems with unpredictable
    workloads.


    +   3. **Sleep/Wake Strategies:**

    **Description**: Devices that are idle or underutilized are put into low-power
    states (sleep mode), and only woken up when needed, conserving energy during periods
    of inactivity.


    +   **Benefit**: Significantly reduces energy consumption by ensuring that devices
    consume minimal power when they are not in use, extending battery life and reducing
    operational costs.'
  merge: -1
