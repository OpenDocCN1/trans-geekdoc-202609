    # 5.4.4 Design Considerations and Constraints


    The balance between realism, scalability and adaptability was the core while designing
    the entire system. Scalability was highly prioritised as the system had to deal
    with large volume of traffic which would be generated during the simulated DDoS
    attack; this traffic was to be processed for giving the results in real time.
    Thus, the use of AWS EC2 instances became crucial as it provided the flexibility
    to deploy components with different computational needs, as lightweight instances
    for attacking server and other machines and high-performance and highstorage instances
    for IDS and SIEM. This setup was entirely in an AWS environment, ensuring that
    simulated attacks are not creating any issues for the external system. Docker
    container was deployed on the attacking machine to set apart the traffic sources
    of two distinguished attacks. This enabled control over traffic generation without
    any issues, as cross-contamination of logs. The next big thing to be constituted
    realism as the entire setup had to be replicated as a real-world attack scenario.
    The usage of MQTT broker resembles an actual communication happening between the
    IoT devices with its central hub. Also, the system encompasses the rules set from
    emerging threat point on Suricata, the detection capabilities of the system in
    terming the DDoS attacks were enhanced and well equipped with industry standards.


