    pipelines.


    The multi-core parallel heap structure divides the units of resources into smaller
    units and aims to fulfill as many possible cloudlets in a single unit, whereas
    the heap emphasizes allowing a resource-based priority entry to the pipeline.
    It ensures that the process starvation of the cloudlet is reduced as it also has
    the migration technique to revamp the starving cloudlets. The multi-core parallel
    processing caters to priority-based resource allocation as well as an automatic
    reduction in the starvation of cloudlets.


    The proposed EP-MCPHS promises to reduce latency, and time to start processing,
    and enhance faster traffic flow based on the ability of a heap-based processing
    system.


    Algorithm 11.1 presents the algorithmic design of our placement algorithm.'
