    needed to run it. The system involves a monitor and a manager. The monitor checks
    the state of each node in the cluster and alerts the manager in case of policy
    discrepancies, while the manager checks the working of virtualization in the system.
    The architecture is shown in Figure 4.8.


    The next system model depicts the blockchain system with fault tolerance for IoT
    devices with fog computing. The architecture contains six entities: The first
    is the data owner, who defines the access policy and manages the registration
    of devices in the network.


    The second entity is the user who requests requests from the IoT network who is
    responsible for encryption and obtains the authorized token if the transaction
    is valid through smart contracts.


    The third entity is the blockchain to store the policies of the network and manage
    the fog nodes. All activities are managed in a decentralized manner in the network.


    The fourth entity includes the fog nodes which provide the fog services and virtualization
    to reduce the latency and to improve the quality of services provided by the system.


    The fifth entity includes the IoT devices, where each device is mapped to fog
    nodes to check for fault tolerance, with limited processing capacity.


    Lastly, the cloud represents the sixth entity which aggregates the data from the
    fog nodes.


    The system works as follows: the data owner associates with the blockchain by
    providing the key authentication and converts the encryption to smart contracts
    policies. Next, the IoT devices get registered in the network. Next, a user process
    is submitted to generate a request, which is redirected to blockchain to check
    for the validity of the request. The system contains the load balancing mechanism
    to use the resources in an efficient way. Load balancing is carried out by using
    min-min algorithm. The system prevents attacks such as Man-in-the-Middle, replay
