    validating and filtering the data and also deals with communication protocols,
    which constitute the microservices of the model. It acts as an entry point and
    Apache Kafka for establishing publisher subscriber framework.


    The third layer is the blockchain peers that form a consortium network for securing
    data. It many supports data storage and follows standard data formats. It supports
    blockchain inside the fog to overcome the overhead of CPU storage capacity. The
    consensus is a multiple-step approach that notifies the ledger updates after the
    process is complete.


    The last layer is smart contracts which contain the protocols and programs stored
    in the blockchain, which has the ability to track agreements among the parties.
    These smart contracts have the executed in the background automatically. It also
    triggers the alerts or notification at the patient’s end.


    The next discussion is about heterogeneous, interoperable and distributed architecture
    (HIDRA) for fog and edge computing environments. It is designed for resource management
    in fog computing environments. The architecture involves a group of heterogeneous
    devices which cover an area such as a building. Each cluster runs on a blockchain
