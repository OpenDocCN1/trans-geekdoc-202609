  md: '# 9.4.2.4 Key Features of Policy Gradient Methods


    +   - More effective in continuous action spaces (e.g., adjusting CPU frequency
    dynamically).

    - Better exploration–exploitation balance by sampling diverse scheduling strategies.

    - Stable training performance compared to DQN in large, dynamic environments.


    # 9.4.2.5 Example: Cloud-Assisted Edge Task Scheduling


    A PPO-based scheduler could dynamically decide how much processing power to allocate
    to different edge nodes based on real-time workloads.


    +   - If an edge has low computational load, the scheduler can allocate fewer
    CPU cores to conserve energy.

    - If the system detects high-priority video analytics tasks, it can allocate GPU
    resources to speed up processing.


    # 9.4.2.6 Limitations of Policy Gradient Methods


    +   - Slower convergence than value-based methods like DQN.

    - High variance in learning, requiring techniques like baseline subtraction to
    stabilize training.


    # 9.4.3 Actor–Critic (AC) Algorithms


    # 9.4.3.1 Overview


    AC algorithms combine value-based and policy-based approaches to leverage the
    advantages of both. These methods consist of two components:


    +   - Actor – Learns the optimal scheduling policy (decides actions).

    - Critic – Evaluates the actions taken by the actor using a value function.


    This hybrid approach improves stability and efficiency in dynamic environments.


    # 9.4.3.2 Popular Actor–Critic Algorithms for Task Scheduling


    +   - 1. Asynchronous Advantage Actor-Critic (A3C)

    - Runs multiple agents in parallel to speed up training.

    - Uses an advantage function to improve policy updates.'
  merge: -1
