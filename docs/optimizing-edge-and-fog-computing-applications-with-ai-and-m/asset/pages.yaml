    # 5.2.3 DDoS Detection Mechanisms


    Extensive researches conducted on DDoS detection have shown various approaches
    using SIEM and ML techniques to address the growing complexities of this attack.
    Cakmakçı et al. (2021) [13] propose a framework for detecting various types of
    DDoS attacks through SIEM. It encompasses an incident detection engine within
    the SIEM to identify the attack patterns. It also has an inference engine which
    automatically suggests the response and recovery steps after detection, reducing
    the reaction time for ongoing attacks. Future research on this framework could
    enhance the detection capabilities of the system when tested in diverse network
    environments [13]. Complementing the clustering-based local outlier factor for
    feature engineering with extreme gradient boosting (XGBoost) for the detection
    of DDoS attacks. This model was implemented and tested on CIC-IDS 2017 and CIC-IDS
    2018, achieving an accuracy of 99.99% and a precision score of 100. However, its
    effectiveness has not been tested in dynamic settings. Similarly, Chen et al.
    (2018) [15] used the XGBoost algorithm for detecting the DDoS attack in a software-defined-networking
    cloud environment. The proposed model had a high level of performance in detecting
    normal and malicious traffic, hence proving the effectiveness of using the XGBoost.
    It also depicted that XGBoost can effectively handle large volumes of data in
    dynamic cloud environments. Exploring the impact of real-world noisy data with
    different traffic and attack types would actually test the performance which is
    lacking in this study. Collectively these researches highlight the efficiency
    of SIEM and advanced ML models, especially XGBoost, in improving the DDoS detections.'
