    that optimizes task allocation during edge cluster upgrades in MEC. The technique
    handles issues such as resource restrictions, geographically scattered nodes,
    and the requirement for adaptive scheduling during dynamic upgrades. Using a policy
    gradient-based reinforcement learning (RL) algorithm, the technique includes task
    and node properties, including geographic distribution, via a self-attention-based
    feature extraction mechanism. The approach reduces task delay by 30% compared
    to baseline methods. It addresses holes/gaps in existing techniques by taking
    into account node status, location information, and long-term optimization. Evaluations
    using simulated and real-world data demonstrate higher performance in connectivity,
    computation, and download latency. However, adoption into systems as Kubernetes
    poses issues. While the method requires extensive training data and computational
    cost, it is scalable, and capable of real-time execution, making a reliable option
    for IoT services in edge contexts [18].


    The paper "Improved Double Q Network-Based Task Scheduling Algorithm in Edge Computing
    for Makespan Optimization" presents a scheduling technique that uses an upgraded
    Double Q Network (DDQN) to optimize makespan in EC settings. It tackles issues
    such as work scheduling in dynamic and diverse contexts, the constraints of static
    scheduling algorithms, and the inefficiency of classical Q-learning methods owing
    to state explosion. The process entails splitting the computation of goal Q-values
    and action selection over two networks, creating a new reward function, and improving
    experience by using a control unit to maximize data consumption. An enhanced Particle
    Swarm Optimization (PSO) technique is utilized to pre-train the evaluation network,
    providing starting solutions, and shorten convergence time. The results of experiments
    show that the algorithm outperforms competing techniques, such as First-Come,
    First-Served (FCFS), Shortest Job First (SJF), Particle Swarm Optimization (PSO),
    Simulated Annealing-SA (PSO), DDQN, and classical DQN, in terms of makespan and
    load balancing across a variety of workloads and machine configurations. While
    successful, obstacles include the need for significant training data and the computing
    needs of reinforcement learning. The study indicates that the suggested technique
    considerably enhances task scheduling performance in EC and recommends more research
    into workflow scheduling [19].


