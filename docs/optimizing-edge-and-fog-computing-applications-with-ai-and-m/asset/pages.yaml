  md: 'mainly focuses on the system architecture and operational efficacy, with very
    limited work on identifying specific attack types. Granadillo, Zarzosa and Diaz
    (2021) [8] further extend this understanding by providing a comprehensive analysis
    of existing SIEM solutions, including their functionalities, benefits and limitations.
    It mainly focuses on the necessity of integrating SIEM in cybersecurity infrastructures
    while also pointing out the challenges the solution has to. Likewise, the research
    by Lee et al. (2017) [9] extends these ideas with a SIEM architecture designed
    for Security-as-a-Service (SeCaaS) in the cloud. This research describes the key
    factors which include scalability, flexibility and multi-tenancy when adapting
    SIEM systems to cloud native applications. This study however does not have an
    evaluation set to test the system in real-world scenarios.


    In order to make further improvements in the SIEM technologies, Ayu et al. (2024)
    [10] have presented the concept of integrating ML with SIEM to improve the gaps
    in traditional rule-based systems. The researchers have implemented anomaly detection
    using the Random Forest (RF) classifier on CSE-CID-IDS2018 dataset from an IDS
    which is pre-processed using the principal component analysis. Despite its promising
    results the study evaluating the model'' performance on real-time data and only
    focuses on one particular dataset. Similarly, Saeed et al. (2022) [3] present
    an ML-based IDS which is customised for usage in the cloud environments through
    the incorporation of a number of algorithms, such as Naive Bayes classifier, decision
    tree classifier, supporting classifier, logistic regression and RF classifier,
    to analyse network traffic and detect anomalies. The study stresses on the implementation
    of ML techniques can lower the false positive and enhance the detection capabilities
    of an IDS in cloud infrastructure. While Innab et al. (2024) [11] present different
    security attacks in cloud environment evaluating the different IDS types and techniques
    that can tackle it, categorising the IDS into signature-based, anomaly-based,
    hybrid-based and other approaches and analyses, their effectiveness in handling
    and detecting the security events. Their research states that signature-based
    attacks can effectively detect known threats but unknown threats, anomaly-based
    attacks are well known for detecting unknown threats but have a greater false
    positive alert, while hybrid approach balances the two and provides improved detection
    accuracy. While this research was comprehensive, it lacked any practical implementation
    to showcase the findings.


