    challenge in FL lies in system heterogeneity, where devices having varying computational
    capabilities and data distributions. This variability can lead to instability
    and divergence during the training process. To address these challenges, the Federated
    Proximal (FedProx) algorithm was introduced. FedProx modifies the standard FL
    objective by incorporating a proximal term into the local loss functions. This
    proximal acts as a regularization factor, constraining the local model updates
    to'
