  md: '# 9.4 DRL Algorithms for Task Scheduling


    DRL employs various algorithms to optimize task scheduling in edge computing environments.
    These algorithms can be categorized into three main types: value-based (Deep Q-Network),
    policy-based (Policy Gradient Methods), and hybrid approaches (Actor-Critic Algorithms).
    Each method has its unique strengths, which make them suitable for different scheduling
    challenges.


    # 9.4.1 Deep Q-Network


    # 9.4.1.1 Overview


    DQN is a value-based reinforcement learning algorithm that extends the traditional
    Q-learning approach by incorporating DNNs to handle large state spaces. It is
    well-suited for discrete action spaces, where scheduling decisions involve selecting
    from a fixed set of possible actions (e.g., selecting one of several available
    edge nodes to process a task).


    # 9.4.2 How DQN Works in Task Scheduling


    DQN estimates the Q-value function, which represents the expected cumulative reward
    for taking a specific action in a given state. The algorithm updates the Qvalues
    iteratively to refine scheduling decisions:


    +   - **State Representation** – The scheduler observes system parameters (e.g.,
    CPU load, network bandwidth, and task priority).

    - **Action Selection** – The agent chooses a scheduling action (e.g., assigning
    a task to an edge node).

    - **Reward Computation** – The agent receives a reward based on system performance
    (e.g., lower latency and better resource utilization).

    - **Q-Value Update** – The neural network updates Q-values using experience replay
    and target networks to stabilize learning.


    # 9.4.1.3 Key Features of DQN for Edge Computing


    +   - Handles large state spaces using DNN.

    - Learns optimal scheduling strategies dynamically without predefined rules.

    - Uses **experience replay** to improve learning efficiency by storing past experiences
    and training on them randomly.


    # 9.4.1.4 Example: Smart Traffic Management System


    A DQN-based scheduler can dynamically allocate computing resources to process
    real-time traffic camera feeds in a smart city.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   - If an intersection has high traffic congestion, the agent may prioritize
    allocating GPU resources to process video analytics quickly.

    - If a low-traffic area is detected, fewer computational resources can be allocated
    to reduce energy consumption.

    - Over time, the scheduler learns which intersections require more or fewer computing
    resources based on historical traffic patterns.


    # 9.4.1.5 Limitations of DQN


    +   - Inefficient for continuous action spaces (e.g., fine-grained resource allocation).

    - High memory and computational overhead due to experience replay.

    - Slow convergence in large-scale scheduling environments.


    # 9.4.2 Policy Gradient Methods


    # 9.4.2.1 Overview


    Unlike value-based methods like DQN, policy gradient (PG) methods directly learn
    an optimal scheduling policy by maximizing the expected reward. Instead of maintaining
    a Q-value function, these methods optimize a policy function that maps states
    to actions.


    # 9.4.2.2 Popular Policy Gradient Algorithms


    +   1. Proximal Policy Optimization

    - Uses a clipped objective function to prevent large policy updates, improving
    training stability.

    - Suitable for edge scheduling scenarios requiring continuous decision-making
    (e.g., fine-grained bandwidth allocation).


    +   2. Trust Region Policy Optimization (TRPO)

    - Enforces a trust region constraint to ensure gradual and stable policy updates.

    - Well-suited for high-dimensional task scheduling problems where abrupt changes
    in policy can degrade performance.


    # 9.4.2.3 How Policy Gradient Methods Work in Edge Scheduling


    +   1. The agent observes the system state (e.g., CPU usage and energy levels).

    2. It selects an action (e.g., allocating CPU cores and offloading a task).

    3. The reward function evaluates the effectiveness of the scheduling decision.

    4. The policy is updated to maximize expected long-term rewards.'
  merge: -1
  img_proc: true
