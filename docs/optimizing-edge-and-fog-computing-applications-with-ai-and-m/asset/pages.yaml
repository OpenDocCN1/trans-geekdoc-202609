    # 6.2.2 Application of FL in PdM Offers Several Advantages


    Data security and privacy are addressed by FL by storing the raw data on local
    devices and only communicating model parameters. This is crucial for sectors that
    handle sensitive data.


    Decreased bandwidth usage and delay: The method lowers the quantity of data transferred
    between devices and the central server by transmitting model parameters, which
    results in decreased bandwidth usage and delay.


    Scalability: FL eliminates the requirement for a centralized data repository by
    enabling PdM systems to scale across multiple devices and locations. Recently,
    the incorporation of FL into PdM systems has been investigated. One-dimensional
    (1D) convolutional neural network-bidirectional long short-term memory (1DCNN-BiLSTM)
    model, for example, was proposed by Ahn et al. [13] for the purpose of detecting
    time anomalies and performing PdM in manufacturing processes.


    The model effectively extracts features from series data and identifies anomalies
    by combining a bidirectional LSTM with a 1D convolutional neural network. The
    study showed that by integrating this model with an FL framework, PdM can be done
    effectively. With a test accuracy of 97.2%, the suggested framework showed promise
    for practical uses. Pruckovskaja et al. [14] assessed the effectiveness of several
    FL aggregation techniques in the context of quality control and PdM in another
    investigation. According to the data, and how it is distributed among clients
    having a significant impact on the success of FL. FL can occasionally be a useful
    substitute for conventional central or local training techniques.


    In order to provide useful insights into the actual application of FL in industrial
    settings, the study also presented a new FL dataset from a real-world quality
    inspection count. An FL technique that uses vibration sensor from rotating machinery
    for condition monitoring and PdM was also proposed [15]. The method preserves
    data privacy and less on the network by enabling distributed training on edge
    devices near the observed computers. Using real-world datasets for evaluation,
    it was found that the approach dramatically lowers resource and network utilization
    while enabling competitive performance compared to prior results.


    These studies demonstrate how FL may improve PdM systems by addressing issues
    with data privacy, lowering latency, and enhancing scalability. To fully reap
    the benefits of FL in PdM applications, however, issues including data heterogeneity,
    communication overhead, and resource limitations in edge and fog computing environments
    must be carefully considered.'
