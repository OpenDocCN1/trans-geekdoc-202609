- pgno: 45
  md: '# Chapter 2


    # # Artificial Intelligence

    Inspired Scheduling

    in Edge Computing


    Kavitha D. N., Gayana J. Kumar, and Vedavathi N.




    Cloud computing, which is comparatively distant from Internet of Things (IoT)
    devices, has struggled in recent years to accommodate applications with stringent
    requirements for mobility or delay, like real-time object detection and real-time
    video streaming [1, 2]. These shortcomings in cloud computing can now be addressed
    using the edge computing (EC) paradigm. Mobile users create tasks in EC, which
    are then transferred to edge nodes (edge servers) for processing.


    Efficient task scheduling has drawn a lot of interest since nodes are placed at
    the periphery of networks with constrained processing power. Significant energy
    consumption reductions and an improvement in service level agreement violations
    (SLAV) in EC can be accomplished through effective job scheduling.


    Researchers have improved and suggested optimization techniques based on linear,
    dynamic, greedy, and other programming techniques to create a better scheduling
    approach. Deep reinforcement learning (DRL)-based optimization techniques have
    received increased interest recently due to the advancement of deep learning.
    DRL-based algorithms can obtain a more effective scheduling approach when compared
    to conventional optimization techniques. However.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'DRL-based algorithms continue to confront two significant obstacles because
    of the intricate EC contexts found in the real world [3, 4].


    First, to save energy or satisfy processing requirements, certain nodes in real-world
    EC scenarios can be dynamically turned on or turned off. Additionally, there is
    a dynamic shift in the quantity of active and pending tasks. However, the dynamic
    rise or fall of nodes and jobs is too much for the DRL-based algorithms that are
    currently in use. Thus, a significant difficulty is how to efficiently depict
    the dynamic environment in order to adjust to the fluctuation of nodes and tasks
    and enhance the scalability of the algorithm.


    Second, EC scenarios involve many diverse nodes and tasks, whereas existing DRL
    algorithms presume an environment with comparatively minor state and action sets.
    This necessitates handling a lot of data. Additionally, every task has its own
    properties, such as resource requests, allocations, etc., and nodes with resource
    abilities, etc.


    These lead to dimensional disasters and make it challenging to store all the data
    directly. Thus, another significant difficulty is how to efficiently store environmental
    data, computational power, and make quick choices.


    Techniques for data compression and dimensionality reduction are required to address
    the aforementioned issues. The issue of dimensional disasters can be resolved
    by the state of the environment can be effectively represented by reducing and
    connecting a high-dimensional state space to a low-dimensional vector space while
    minimizing the impact on the relationships between the original data.


    To decrease the state dimension of DRL and dynamically represent the EC environment,
    representation learning needs to be presented and enhanced in this study. Similarity
    relations and entities are the primary building blocks of representation learning.
    Furthermore, relations are typically understood to be translations acting on the
    entities'' low-dimensional representations.


    The entities and relations in EC are initially established with two levels prior
    to representation learning as shown in Figure 2.1 [5].


    The first-level entities, resource nodes and tasks themselves, are properless.
    Regarding the relationship between tasks and their properties, whereas resource
    usage defines the relationships between nodes and their properties. Next, the
    environment—which comprises the collection of tasks and nodes—and the tasks with
    matching qualities are designated as the second-level entities.


    When a task enters a certain environment, the relationship between the second-level
    entities is identified as the scheduling decision, that is, the relationship is
    extracted to obtain the matching node. This approach is highly scalable because
    representation learning, makes it simple to construct various entities and relations
    for newly arriving tasks and devices in EC as well as for device-to-device communications.
    Vectors and distances between devices can be used to represent the entities and
    relationships, respectively.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/1f35685e7cacbaf02cbf5bba7a561027_47_0.png)


    **Figure 2.1 Relationship between tasks and nodes (two levels).**


    A new model for representation TransEC, which translates the EC tasks, nodes,
    and environment to various vector subspaces, is presented using the entities and
    relations previously mentioned.


    In particular, the tasks and nodes are initially embedded into various sub-spaces
    using embedding layers. Then, the potential features of the environment are retrieved
    using linear transformations and convolution neural networks, and the knowledge
    is mapped to a dynamic sub-space. Lastly, our TransEC model is used to extract
    the relationships between second-level entities.


    Scheduling decisions in a dynamic and large-scale EC environment can be resolved
    by DRL with the ability of the TransEC model, which effectively reduces the state
    dimension. The Deep Q-Learning (DQL) algorithm is selected among many RL algorithms
    due to its ability to facilitate quick decision-making.


    Additionally, the TransEC-DQL algorithm’s training frequency is adjusted to account
    for both the state information surrounding this time slot as well as the knowledge
    of the present time slot, which involves the distributions of task and node resource
    situations. Also double Q-learning is used to enhance DQL performance over time
    [6]. Many similar solutions using hybrid solutions are proposed in references
    [7–12].


