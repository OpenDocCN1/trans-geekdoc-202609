    In IoT systems, data processed at the edge contains sensitive information, making
    security and privacy a top priority. However, implementing robust security measures
    like encryption on resource-constrained edge devices poses a significant challenge,
    as these devices have limited processing power, memory, and energy. Balancing
    the need for strong encryption with the constraints of edge devices requires light-weight
    security algorithms that do not compromise the device''s performance or battery
    life. This delicate balance is crucial for ensuring data privacy while maintaining
    the functionality and efficiency of the IoT network. Data processed at the edge
