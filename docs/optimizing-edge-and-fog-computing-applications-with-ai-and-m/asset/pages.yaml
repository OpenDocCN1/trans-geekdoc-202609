    # 11.2 Literature Review


    Mobile edge computing (MEC) technique about cloudlet offloading offers to overcome
    of high computational needs by mobile applications and enhance the storage for
    low latency and quick response application-centric designs. However, the real-time
    offloading poses a challenge toward placement and migration of systems across
    edge resources. To overcome this, various research have advocated the use of deep
    learning algorithms to improve the offloading process in MEC networks. The solutions
    can be broadly categorized into two paradigms: intelligent offloading mechanism
    discussed in section 2.1 and task or cloudlet offloading using deep reinforcement
    learning discussed in Section 2.3.


    # 11.2.1 Mobile Devices and Its Limitations


    The primary challenge to real-time offloading MEC as discussed by Alghamdi et
    al. (2021) [17] is the computation deficit within mobile networks for offloading
    MEC. Cardellini et al. (2016) propose a game theory solution to offload D2D cloudlets
    with central cloud and MEC architecture. Patel et al. (2015) emphasize network
    congestion and the use of MEC as a techn use toward 5G systems as it allows faster
    network flow and could lead to network drops without adequate placement the tasks
    might observe excessive latency and an overall drop in bandwidth. Moreover, the
    effective usage of ECM devices is assured by suitable algorithms. The low computational
    capabilities lead to fewer resources for utilization to fulfill each process,
    which in turn creates process starvation, leading to high latency, high data transfer,
    and low bandwidth. This is due to low-scale computing resources and process starvation'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'caused by the offloading of the cloud process. Thus, a requirement for ongoing
    migration is needed.


    The necessity of transforming data with the help of computation requires high-end
    server with cloud computing capabilities. The research discussed above showcases
    the absence of high computation and storage capacity solutions to offload cloudlet
    tasks (RG1).


    # 11.2.2 Intelligent Offloading Mechanism


    Xu et al. (2018) propose a deep neural network of convolution and recurrent neural
    networks to create a hybrid deep reinforcement algorithm for an intelligent offloading
    system. The convolutional recurrent neural network (CRNN) is used for offloading
    process in MEC. The proposed techniques offer a 25% lower energy use in comparison
    to traditional offloading algorithms.


    Yu et al. (2022) [10] address the delay in computing and high latency constraints
    for MEC. They propose a Duel Deep Q network to optimize the scheduling of resource
    allocation for a multiuser, multicluster, and multi-tenant environment. They propose
    an energy-efficient, loss-specific optimization algorithm that reduces energy
    use by 11.54% and 20.83%, respective for D2D and generic cloud scenarios. Furthermore,
    Vaiswan et al. (2016) [11] propose a solution for the binary system increased
    latency and decreased bandwidth. The study discusses the pitfalls of using the
    Monte Carlo distribution method and proposes stochastic enumeration using decision
    tree-based cost optimization, offering an intelligent pursuit to effective sampling
    and placement of jobs based on computing resources.


    The above research showcases a significant research gap toward the concerns of
    congestion packet loss, process starvation, transport security, and latency threats
    (RG2, refers to Section 11.2.3.1).


    # 11.2.3 Cloudlet Offloading to Edge Networks Using Deep Reinforcement Learning


    Zuxhu et al. (2021) [12] propose an intelligent deep reinforcement learning (DRL)
    method for resource allocation cloud offloading for D2D. This study investigates
    the resource allocation issue that occurs during the offloading process. The MEC-oriented
    real-time system is energy-aware offloading system when considering the battery
    capacity of the data center. The paper showcases energy savings, close to $10^4
    \times 10^4$ Joules. The study is nuanced with the MATLAB platform for the execution
    of the technique, providing a deep weighted parameter for values 0.2, 0.4, 0.6,
    0.8, and 1.0. The study offers an offloading strategy for optimization, it takes
    the shortest latency and the cheapest computing cost as the optimization aim and
    then applies Q-learning to solve the problem.'
