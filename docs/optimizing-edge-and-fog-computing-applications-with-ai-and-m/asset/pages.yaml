    like Sigmoid Linear Unit (SiLU) and Gaussian Error Linear Unit (GELU), reducing
    activation and normalization layers, and using larger kernel sizes, this design
    improves the model''s robustness in handling non-IID data, outperforming architectures
    such as Vision Transformers and ConvNeXt. Furthermore, overlapping convolutions
    and convolution-only downsampling in the stem layer seems to improve feature extraction
    and model stability, resulting in better performance across various FL benchmarks
    [17]. Many other similar work using optimization algorithm are discussed in [37–40]
    using ANN and nature inspired optimization model.


    # 10.8 Factors Affect Cnns


    Including CNNs in FL offers significant opportunities for privacy-preserving image
    classification yet raises unique challenges, such as computational limitations,
    heterogeneity, maintaining model performance under privacy constraints. In general,
    choosing appropriate CNN architecture plays an important role. With significantly
    low computational and communication cost, lightweight architectures like MobileNet
    and SqueezeNet suit the FL implementation best de applicable to those architectures
    allowing hierarchical extraction of features, where the nature of generalization
    would remain stronger to diverse data distributions like ResNet. Recent innovations,
    such as FedConv, have optimized CNNs for FL further by giving smoother activation
    functions, reducing normalization layers, and increasing kernel sizes, and hence
    robust to non-IID setups.


    The heterogeneity that affects FL can be addressed through the use of personalized
    FL. For example, Per-FedAvg combines model-agnostic meta-Learning with federated
    aggregation; it enables personalization through a per-client personalization coefficient
    making it possible to fine-tune each client''s local datasets. More specifically,
    FedProx and SCAFFOLD account for client drift through the regularization term
    and the use of control variables, improving the stability of the training across
    classes of variables. Using models that effectively adapt to various client data
    help with domain adaptation and transfer learning. Sharing synthetic data generated
    from public datasets could also be considered to enhance the features among underrepresented
    clients in order to further reduce imbalances.


