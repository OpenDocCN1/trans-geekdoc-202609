    # 7.8.1 Blockchain-Enabled Federated Learning


    Federated learning relies on a central aggregator to combine model updates from
    multiple edge devices, posing potential security and trust challenges. Blockchain
    technology can establish decentralized trust mechanisms for secure and transparent
    model aggregation.


    Challenges in Traditional FML Model Aggregation:


    +   - Trust and security risks due to reliance on a single aggregator

    - Vulnerability to model poisoning attacks and data integrity issues

