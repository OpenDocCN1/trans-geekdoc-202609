    heuristics. We provide Particle Swarm Optimization (PSO) and DRL as alternatives
    that are tested for scalability and efficiency. The primary issues include tracking
    the NP-hard nature of the task allocation problem, and dealing with the computational
    inefficiencies of ILP in big networks. While PSO and DRL have shorter execution
    times than ILP, they sacrifice accuracy for scalability, PSO succeeding in smaller
    issue sizes and DRL doing better in bigger circumstances. Methodologically, ILP
    optimizes energy usage for networks and connections within resource and capacity
