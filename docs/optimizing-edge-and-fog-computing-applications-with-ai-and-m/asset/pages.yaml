    Rajkumar Nagulsamy, Manisha Gupta, Punit Gupta




    In today''s landscape of cloud computing, mobile technologies have started utilizing
    applications with high computational needs. Hence, task-resource management has
    become a crucial research domain for mobile resource offloading. Throughout the
    last ten years, cloud computing has emerged as one of the most appealing alternatives
    for hosting applications via the Internet infrastructure. Computing in the cloud
    is based on the use of centralized computing resources located in data centers.
    This practice alleviates the burden of infrastructure administration and enables
    service providers to provide cloud services at reasonable costs for both people
    and organizations.


    The role of cloud computing as a catalyst for digital transformation has led to
    mobile technologies having a multitude of use cases in recent times, including'
