    The simulated real-world attack generated datasets in the form of logs (network
    traffic activity) which was the primary source for data collection in the entire
    set. The main objective was to collect network activity logs that would resemble
    the DDoS attack which further be used for rule-based and ML-based detections.
    To simulate the DDoS attack hping3 command used from a docker container on the
    attacking machine hosted on the EC2 instance . This command was targeted on the
    IoT server ensuring a high-volume traffic is logged on the same imitating a typical
    DDoS-like scenario with traffic spikes and abnormal connection requests/attempts.
    The hping3 command was specifically used due to its flexible approach in sending
    network packets helping effective log generation.


    All tests were done in a controlled and isolated environment by adhering to the
    standard ethical testing practices. These all were stated captured on an open-source
    IDS- Sicata [17]. It was configured to detect all the network traffic in the infrastructure
    and the network metadata including the source and destination IPs, ports, protocols,
    timestamps and other relevant information associated in a generic network traffic.
    These logs were structured and stored in the JSON format on the Suricata, which
    made it convenient for further data processing by using the optimal tools and
    technologies.


    Specific Characteristics of the Logs:


    The logs include critical metadata which is explained in Table 5.2. Characteristics:


    +   - High traffic volume spikes: Reflecting DDoS attack patterns.

    - Repeated connection attempts: Possible characteristic of SYN flood attacks.


    The logs had special features like high consistency as the Suricata uses ET rules
    which make sure that the events are correctly tagged which is same as realistic
    environment. Data quality was a key aspect to be taken of during the collection
    phase as the entire detection process was relying on the data in IDS and hence
    filebeat introduced so that it could transfer the data ahead without dropping
    the essential metadata fields, ensuring seamless log transmission.




    The data preprocessing step mainly focused on the preparation of the network activity
    logs collected by the IDS for ML-based threat detection. The data'
