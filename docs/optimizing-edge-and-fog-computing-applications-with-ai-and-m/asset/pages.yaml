    performance of cloud-edge systems. Future research should focus on dynamic network
    circumstances and multi-objective optimization [32].


    # # 2.2 Conclusion


    To address work scheduling in EC, we would suggest combining representation algorithms
    with reinforcement learning methods in this chapter. The task scheduling issue
    is first developed, with the definition of EC’s entities and relationships. The
    relation computation model is then suggested when the entities’ EC embeddings
    have been defined. Later, a learning method based on DQL has been presented to
    train the embedding vectors and make the decisions about task scheduling. Hence,
    we can combine reinforcement learning and representation learning for task scheduling
    in EC is this chapter.


