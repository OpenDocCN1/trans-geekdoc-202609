    # 9.3.1 Basics of Reinforcement Learning


    # 9.3.1.1 Definition and Core Concept


    RL is a branch of machine learning where an agent learns to make optimal decisions
    by interacting with an environment [10]. Instead of relying on predefined rules,
    the agent explores different actions, observes their outcomes, and refines its
    strategy based on a reward-based feedback system.


    Key elements of RL include the following:


    +   1. Agent – The decision-maker interacts with the environment.

    2. Environment – The system with which the agent interacts (e.g., edge computing
    infrastructure).

    3. State (S) – The current condition of the environment, such as resource availability
    and task queue length.

    4. Action (A) – A set of possible decisions the agent can make, such as assigning
    a task to an edge node.

    5. Reward (R) – A feedback signal indicating the quality of an action (e.g., positive
    reward for reducing latency).

    6. Policy (π) – A mapping from states to actions that defines the agent’s decisionmaking
    strategy.

    7. Exploration vs. Exploitation – The agent must balance exploration (trying new
    actions to discover better strategies) and exploitation (choosing known optimal
    actions to maximize rewards).


    # 9.3.1.2 How RL Works in Task Scheduling


    In an edge computing scenario, an RL agent can be trained to schedule tasks optimally
    by interacting with the environment. Over time, it learns which scheduling decisions
    lead to better outcomes, such as lower latency, reduced energy consumption, and
    efficient resource utilization.


    # 9.3.2 Deep Reinforcement Learning


    # 9.3.2.1 Limitations of Traditional RL in Task Scheduling


    While RL is effective for decision-making in structured environments, traditional
    RL methods struggle with high-dimensional state spaces in edge computing. The
    sheer number of system parameters (e.g., CPU utilization, bandwidth, and task'
