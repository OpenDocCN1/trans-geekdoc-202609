    the scheduling of user requests as DAGs in edge computing settings. The technique
    seeks to reduce long-term average system latency and increase job completion rates
    by treating the scheduling problem as an MDP. The system describes states as resource
    utilization and task queue statuses, actions as scheduling decisions, and incentives
    as penalties for delays and deadlines. The approach uses a deep Q-network, experience
    replay, and an e-greedy policy to learn optimum scheduling strategies over time.
    Experimental results show when compared to a random-based technique, especially
    at high request arrival rates. Despite initial training instability and difficulty
