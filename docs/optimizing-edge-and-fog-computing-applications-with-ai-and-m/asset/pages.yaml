    # 9.2.3.2 Network Latency Considerations


    Network delays caused by congestion, unreliable wireless links, or variable bandwidth
    can impact task execution time. Unlike cloud computing, where high-speed fiber-optic
    connections provide stable communication, edge devices often rely on Wi-Fi, 5G,
    or low-power wide-area networks (LPWANs) with fluctuating reliability.


    +   - Example: In a smart surveillance system, if network congestion delays video
    analytics processing, the system may fail to detect security threats in real time.

    - Solution: Latency-aware scheduling should dynamically adjust task placement
    based on real-time network conditions, ensuring that tasks are processed on nodes
    with the lowest communication overhead.


    # 9.2.4 Heterogeneous Infrastructure


    # 9.2.4.1 Diverse Computational Capabilities


    Edge computing involves a highly heterogeneous environment where edge nodes have
    varying levels of computational power, architectures, and capabilities. Scheduling
    tasks efficiently requires an understanding of each node''s processing capabilities
    and compatibility with different applications.


    +   - Example: A smart city infrastructure may include Raspberry Pi-based edge
    nodes, powerful edge servers, and 5G base stations with AI accelerators. Scheduling
    must allocate AI-based tasks (such as image recognition) to nodes with GPU support
    while assigning simple computation tasks to less powerful nodes.

    - Solution: Hardware-aware task scheduling techniques can optimize task placement
    based on the processing power of available edge nodes.


    # 9.2.4.2 Varied Network Connectivity


    Edge devices operate in a range of connectivity environments, from high-speed
    5G networks in urban areas to low-power LPWANs in remote industrial sites. These
    connectivity variations add complexity to scheduling decisions.'
