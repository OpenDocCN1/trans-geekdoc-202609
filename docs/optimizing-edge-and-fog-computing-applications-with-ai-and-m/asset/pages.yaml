  md: '# Chapter 10


    # Secure, Adaptable, and Collaborative AI: Federated Machine Learning Enhanced
    with Meta-Learning and Differential Privacy


    Deepti Bhat, Ansh Chauhan,

    Chiranth Nagaprasanna, Chirashwi S.,nand Swathi B. H.




    The abundance of data and variety of today''s devices provides enormous potential
    for advancements in machine learning (ML) and artificial intelligence (AI). However,
    the issues of traditional ML technology in edge network applications surrounding
    data silos, privacy leakage and data security risks, regulatory requirements,
    and engineering obstacles are that need to be navigated [1]. Federated learning
    (FL) is an increasingly popular solution that aims to train a global model using
    data'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'from one or more data sources/sources [2]. This approach centers around the
    shift from centralized data, compute, and governance to distributed and decentralized
    architecture. It empowers individuals to utilize their local data to collaboratively
    train ML models without the risk of sharing the raw data to a central entity [3].
    In FL, each client trains a local model using its own data. These local models
    are later aggregated by the central server to create a global model, which is
    then redistributed to clients for further refinement. This iterative process continues
    until satisfactory results are achieved. Despite FL’s promise, ever critical concerns
    remain, particularly in relation to adversarial attacks, privacy leakage, and
    data heterogeneity.


    This chapter embarks with the current issues of FL in Section 10.2, followed by
    examining the need to strengthen it in Section 10.3. Section 10.4 covers the general
    role of differential privacy (DP), whereas the impact of various algorithms along
    the FL architecture is discussed in Section 10.5, meta-learning and its forms
    and convolution neural networks in the context of FL have been discussed in Section
    10.6, 10.7, and 10.8. At the end, Section 10.9 provides the conclusion, followed
    by the references section.


    # 10.2 Issues of Federated Learning


    While the FL approach seems like a promise, there are several concerns with significant
    presence. Song et al. (2020) showed that the original training data can be reconstructed
    from the model parameters uploaded by the FL participants through certain adversarial
    attacks, which can lead to privacy leakage [4]. When it comes to adversaries,
    there are primarily two classifications: active and passive. Active adversaries
    are those that intentionally manipulate training data or models to achieve malicious
    goals. This can involve altering models to prevent global model convergence, or
    subtly misclassifying a specific set of samples to minimally impact the overall
    performance of the global model. On the other hand, passive adversaries do not
    modify data or models, but can pose a threat to data privacy. For example, they
    may deduce sensitive information such as local training data from revealed models
    through gradients, or model updates [3].


    The adversarial attacks can take several forms such as model poisoning, data poisoning,
    and data reconstruction attacks, where the former are active in nature and the
    latter is passive. Model poisoning can occur through Byzantine attacks where shared
    model parameters are tampered to affect the global model. It could involve zero
    mode attack where weights are set to zero, random mode attack where weights are
    altered with random values, or can be of flipping mode where the global model
    updates in the opposite direction. Furthermore, data poisoning attacks may involve
    label flipping that misclassifies some of the sample data. On the other hand,
    data reconstruction attacks mainly occur through trained models'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'that are either local or global. One example is Deep Leakage from Gradients
    (DLG) attack that infers local training data from the publicly shared gradients
    [3]. The recent dynamic backdoor attack, however, presents a unique challenge
    by allowing adversaries to modify attack patterns in real time, continuously adapting
    the poisoned dataset and rendering traditional defenses ineffective [5].


    # 10.3 Strengthening Federated Learning


    With the presence of myriad possible adversarial attacks, it''s crucial to take
    extra steps to strengthen one of the main goals of preserving client data privacy
    in FL. One possibility is secure aggregation where the server aggregates model
    updates from clients without learning individual updates. This ensures that the
    server only receives the updates and not the individual updates themselves. While
    this method protects from malicious servers or attacks on servers, there still
    needs to be an implementation where the nature of local client data cannot be
    deciphered, even if local models or parameters are accessed.


    An intuitive step would be homomorphic encryption, which deals a cryptographic
    technique with computations being performed on encrypted data. This means that
    the server can perform computation on encrypted local model updates, without decrypting
    local model updates. While this may be a good addition, a factor that needs to
    be considered is computational cost. Encrypting all the data each time and then
    performing computation on encrypted data may affect results and incur additional
    computational costs. With such methods and their implications, the approach of
    DP arises in the middle, which addresses the privacy concern more optimally.


    # 10.4 Role of Differential Privacy


    DP, which was proposed by Dwork et al. in 2006 [6], is an advanced solution in
    which random noise is added to produce outputs using rigorous mathematical measures
    [7]. This leads to results that are statistically indistinguishable between an
    original aggregate dataset and a differentially additive-noise one. DP can take
    many forms; for example, Label DP considers the situation where only labels are
    sensitive information that must be protected and is usually applied to differentially
    private FL [8]. Additionally, Bayesian DP is interested in the change in the posterior
    distribution of the attacker model, compared to the price. Initially DP was applied
    at the server levels, due to its centrality, to ensure the output doesn''t reveal
    information about training data. However, subsequent research has led to the concept
    of local differential privacy (LDP). This is a more stringent version of differential
    privacy (DP) as the privacy measures are directly applied at the'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'client level. An added advantage is that it doesn''t require the confirmation
    of truthful model aggregators. Hence, the need to trust the server gets eliminated
    as the local model with communicated to the aggregator [9]. Based on LDP, there
    has been an introduction of the shuffle model in recent years. A trusted shuffle
    is between clients and server, with the act of shuffling the data items submitted
    by clients to achieve anonymization. This means that each client satisfies the
    privacy guarantee of LDP when facing the shuffle and achieves the privacy guarantee
    of DP when facing the server [8]. However, there will be computational overheads
    through which this becomes more expensive as the amount of data increases.


    Furthermore


    # 10.5 Algorithmic Impacts


    The algorithms through which concepts like FL and DP are implemented play a salient
    role as they have the potential to impact various model parameters. FL algorithms
    like SCAFFOLD [11, 12] are specifically designed to handle the challenges of heterogeneity
    across different devices. These algorithms improve the stability and efficiency
    of model training by employing techniques like “control variates” to reduce discrepancies,
    or “drift”, which can arise from variations in local datasets. Furthermore, such
    as FedAvg with DP introduce random noise to model updates to protect user privacy
    [13]. DP-SCAFFOLD [14] is an extension of the SCAFFOLD framework by integrating
    DP mechanisms to local model updates while addressing data heterogeneity. Its
    convergence analysis utilized a particular initialization of the algorithm and
    focused on different quantities compared to the original proof. This algorithm
    operates like standard FL approaches like FedAvg. Overall, it has demonstrated
    a better performance both theoretically and empirically, outperforming the baseline
    DP-FedAvg in various scenarios.


    When algorithms such as DP-FedAvg add noise to the local model after gradient
    step during the local training phase, it ensures that the contributions of individual
    clients do not reveal sensitive information, even when integrated at the'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Additionally, gradient clipping [15] limits any individual''s influence on
    the model; this technique helps prevent excessively large updates that could disproportionately
    affect the global model, adding a layer of protection. The noise can be applied
    directly on the client device before it leaves the user''s environment or can
    be added after the updates are received by the server before they are integrated
    into the global model [15]. This method occurs within a Trusted Execution Environment
    (TEE), ensuring that even updates are processed centrally, the privacy of individual
    users is maintained. This dual approach of applying noise locally and server-side,
    combined with the security provided by TEE, creates a privacy-preserving environment
    that meets regulatory standards such as the General Data Protection Regulation
    (GDPR).


    While DP is normally used by injecting noise to the weights before sharing them
    through a private channel to the server model


    On the contrary, using device-level DP applies privacy guarantees to the entire
    dataset on a user''s device rather than individual data points. This ensures that
    even if a device holds a large amount of data, the contribution to the model remains
    private. The differentially private-follow the regularized-leader (DP-FTR) [17]
    algorithm is a variant of DP-SGD for FL without uniform client sampling. This
    algorithm clips local updates from clients and adds noise to these updates before
    aggregation. The noise is carefully calibrated to ensure DP while balancing model
    utility.


    Additionally, FedFGCR is a federated meta-learning framework aimed at improving
    fault detection (FD) in decentralized settings with heterogeneous data while ensuring
    privacy. Traditional deep learning models for FD face due to data privacy concerns
    and varied distributions across clients. FedFGCR addresses these issues by integrating
    meta-learning techniques, specifically a Model-Agnostic Meta-Learning (MAML) approach
    to combine global and local features for personalized model training. Experiments
    on benchmark datasets (Case Western Reserve University [CWRU] and the Korea Advanced
    Institute of Science and Technology [KAIST]) demonstrate that FedFGCR significantly
    outperforms existing FL methods like FedAvg, FedProx, and FedPer showing improvements
    in accuracy and robustness in handling non-IID data [18].'
