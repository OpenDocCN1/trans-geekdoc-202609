    # # 5.2 Related Work


    The world of cybersecurity has witnessed a lot of change in the past few years,
    with the integration of advanced tools like SIEM and IDS for real-time threat
    detection [2,6]. Also, a lot of advancements have been made to traditional cybersecurity
    practices, with the use of ML models into it. These technologies play a vital
    role in the overall enhancements in the detection and monitoring techniques of
    different attacks. The following subsections will discuss the literature review
    conducted for this research. Key areas included the integration of SIEM and IDS
    for real-time monitoring, IoT systems and attacks/security challenges associated
    with it, and implementation of ML models for DDoS detections. This literature
    review helped in forming the base foundation for the methodology and implementation
    sections of this research.


    # # 5.2.1 SIEM, IDS and ML Models in Cybersecurity


    The usage of SIEM and IDS solutions has been thoroughly investigated in many of
    the recent researches defining the importance of these tools in the field of cloud
    security. A research by Tuishime et al. (2023) [7] has come up with a SIEM-based
    approach for threat monitoring in cloud environments through components such as
    virtual machines, load balancers, and web application firewalls in order to have
    a central point for logging and analysis. It specifically tries to highlight the
    importance of SIEM in generating automated alerts to enhance the response times
    while also trying to evaluate the frameworks'' scalability in handling large volumes
    of data. However,'
