    The research paper "Dependency-Aware Assigning and Scheduling in Edge Computing"
    explores dependency-aware program assignment and scheduling in EC. It identifies
    issues such as task interdependency, limited varied resources, and unseen spatial-temporal
    distribution of requests. The study models applications as directed acyclic graphs
    (DAGs) and presents Daar, a unique approach for simultaneously optimizing task
    assignment and scheduling in an online setting, solving both NP-hard challenges.
    Daar uses a heuristic technique to assess job priority, allocating and scheduling
    activities iteratively to optimize resource usage and fulfill application deadlines.
    Key findings show that Daar allows up to 20% more opportunities to achieve deadlines
    than baseline approaches, with a maximum improvement of 38% in large-scale cases.
    Methodological limitations include a failure to account for storage limits, real-time
    unpredictability in computation times, and simplifications of edge server and
    base station connections. Drawbacks include the solution''s heuristic character,
    which does not ensure global optimality, as well as computing cost from iterative
    optimization. Despite its shortcomings, Daar offers a useful and efficient framework
    for managing dependent applications in dynamic EC settings.


