  md: '# 6.5.3 Energy Optimization


    Energy consumption is a significant concern in industrial operations, both from
    a cost and an environmental perspective. FL contributes to energy optimization
    by facilitating the development of models that analyze operational data to identify
    energy-saving opportunities. By collaboratively training models across different
    facilities, organizations can uncover best practices and operational adjustments
    that led to reduced energy usage. This decentralized approach ensures that sensitive
    operational data remains on-site, addressing privacy concerns while promoting
    energy-efficient practices across the industry. FL offers a transformative approach
    to PdM by enabling collaborative, privacy-preserving model training for equipment
    monitoring, fault diagnosis, and energy optimization. Its application in industrial
    settings not only enhances the accuracy of predictive models but also fosters
    organizational collaboration without compromising data security.


    # 6.6 Key Research Gaps and Future Directions


    FL has garnered significant attention due to its potential to enable collaborative
    training without compromising data privacy. However, several research gaps exist
    that hinder its widespread adoption and efficacy. This section delves into three
    critical areas requiring further exploration: adaptive aggregation mechanisms,
    enhanced privacy measures, and scalability challenges.


    # 6.6.1 Adaptive Aggregation Mechanisms


    In FL, the central server aggregates updates from distributed clients to form
    a global model. Traditional aggregation methods, such as FedAvg, often assume
    homogeneous data distributions across classes. However, in practical scenarios,
    data is typically non-IID, leading to suboptimal model performance. To address
    this, researchers have proposed adaptive aggregation techniques that account for
    data heterogeneity. For instance, Yeganah et al. [30] introduced the inverse distance
    aggregation method, which assigns weights to client updates based on the distance
    between local and global model parameters, thereby mitigating the impact of outliers
    and enhancing convergence rates.


    # 6.6.2 Enhanced Privacy Mechanisms


    While FL inherently promotes data privacy by keeping raw data on local devices,
    vulnerabilities remain, particularly concerning inference attacks that can reconstruct
    sensitive information from model updates. To bolster privacy, various techniques
    have been explored. Differential privacy (DP) introduces noise to model updates,'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'obscuring individual data contributions. Secure multiparty computation (SMC)
    enables collaborative computations without revealing individual inputs. Despite
    these advancements, challenges persist in privacy with model utility and computational
    efficiency. Recent surveys provide comprehensive overviews of these privacy-preserving
    methods and highlight the need for novel solutions that effectively integrate
    DP and SMC within the FL framework.


    # 6.6.3 Scalability Challenges


    Scalability remains a significant concern in FL, especially when dealing with
    large numbers of clients and substantial model sizes. Synchronous aggregation
    methods can lead to communication bottlenecks and increased latency, as the central
    server must wait for updates. Asynchronous aggregation offers a potential solution
    by allowing the server to update the global model with client updates as they
    arrive, without waiting times. Nguyen et al. [31] proposed a buffered asynchronous
    approach, FedBuff, which combines the benefits of synchronous and asynchronous
    methods. FedBuff maintains a buffer of incoming updates, enabling efficient aggregation
    while remaining compatible with preserving techniques like secure aggregation.
    Empirical results demonstrate that FedBuff enhances efficiency and scalability
    in FL. Addressing these research gaps is crucial for the advancement and practical
    deployment of FL across various domains. Future work should focus on developing
    robust aggregation strategies, enhancing privacy-preserving mechanisms without
    compromising model performance, and designing scalable FL architectures capable
    of handling diverse and extensive client networks.


    # 6.7 Conclusion


    FL has emerged as a transformative approach in PdM, enabling collaborative model
    training across decentralized devices while preserving data privacy. By facilitating
    the analysis of equipment without necessitating centralized data storage, FL addresses
    critical concerns related to data confidentiality and network reliability. Studies
    have demonstrated the efficacy of FL in various industrial applications, including
    condition monitoring and fault diagnosis. Despite these advancements, challenges
    persist that warrant further research. Adaptive aggregation mechanisms are needed
    to address data heterogeneity among clients, as traditional methods like FedAvg
    may not perform optimally with non-IID data distributions. Enhanced privacy measures
    are also crucial, as FL, while inherently privacy-preserving, is still susceptible
    to inference attacks that can reconstruct sensitive information from model updates.
    Balancing privacy with model utility and computational efficiency remains an open
    area of investigation. Additionally, scalability'
