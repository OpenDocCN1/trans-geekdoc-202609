    # 6.4 Challenges in Fog and Edge Environments


    The constraints of standard cloud computing have been addressed by fog and edge
    computing, which have become new paradigms, especially for applications that need
    real-time processing and low latency. These methods improve responsiveness and
    lower bandwidth use by decentralizing data processing and putting closer to the
    data source. However, there are a number of difficulties brought about by the
    dispersed character of fog and edge situations. The deployment of fog nodes at
    the edge of the network exposes sensitive data, making them potential targets
    for cyberattacks, raising serious concerns about data privacy. The large number
    of linked devices and gateways, each with its own set of vulnerabilities, makes
    security problems much worse. Another significant issue is interoperability; the
    wide range of edge devices and fog nodes frequently lack established protocols,
    making it difficult to integrate and work seamlessly [28].


    Furthermore, overseeing a dispersed infrastructure introduces complexity, requiring
    strong tools and techniques to improve performance. For fog and edge computing
    systems to be implemented and run effectively, certain issues must be resolved.


    # 6.4.1 Data Heterogeneity


    Effective model training and convergence in fog and edge computing environments
    are significantly hampered by data heterogeneity. These networks'' decentralized
    structure makes it more difficult to create reliable machine learning models since
    they provide a variety of non-IID (different, non-independent, and identically
    distributed) data across devices. Clustered federated learning (CFL) has been
    suggested as a solution to this problem. By clustering devices with comparable
    data distributions, CFL'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'enables the training of specialized models within each group. This method adapts
    learning procedures to the unique features of each cluster''s data, improving
    model performance. For example, the Iterative Federated Clustering Algorithm efficiently
    handles heterogeneity in FL environments by switching between user cluster IDs
    and optimizing model parameters for each cluster.


    # 6.4.2 Communication Overhead


    Iterative transmission of model updates between multiple edge devices and a central
    server creates a substantial communication cost for FL in fog and edge computing
    environments. Especially in environments with limited bandwidth, this frequent
    communication can put a burden on network resources and raise latency. Techniques
    like model compression and gradient scarification have been developed to lessen
    these difficulties. Gradient scarification reduces the quantity of data without
    sacrificing model performance by only sending the most important gradients at
    each update. For example, considerable data reduction during model training can
    be achieved using gradient scarification in wireless traffic prediction. By lowering
    the size of the model parameters shared between devices and the server, model
    compression techniques like quantization and encoding further communication costs.
    FL systems can improve scalability and performance in fog and edge environments
    by putting these strategies into practice and achieving effective communication.


    # 6.4.3 Resource Constraints


    Devices in fog and edge computing environments frequently work with strict resource
    limitations, such as constrained memory, computational power, and energy capacity.
    These restrictions make it difficult to execute FL, which usually calls for a
    large investment of resources for both communication with central servers and
    training models. In response to these difficulties, researchers have devised methods
    like selective participation and quantized updates to produce lightweight algorithms
    for environments with limited resources. By diminishing the accuracy of model
    parameters as they are transmitted, quantized updates lower the volume of data
    that is exchanged between servers and devices. By allocating distinct bit-widths
    to different layers of a deep learning network, for instance, mixed-precision
    quantization successfully strikes a balance between resource usage and model accuracy.


    This method reduces the processing and communication requirements, enabling devices
    with minimal capacity to take part in FL. By using a subset of devices in each
    training round, selective participation procedures further increase efficiency.
    The system can maximize resource consumption and preserve model performance'
