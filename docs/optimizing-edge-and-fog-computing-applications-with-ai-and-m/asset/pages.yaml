- pgno: 265
  md: '# Edge Server-Based Cloudlet Offloading ■ 253


    edge computing are growing significantly. The need for today''s day and mobile
    applications to be onboarded with applications needing computation, low latency,
    high bandwidth, etc. This leads to a scenario where the fast edge computation
    is needed, and a general cloud server with high latency cannot cater to the needs
    of such high demands. Thus, to mitigate this computing resources are selected.
    In this study, the proposition of EP-MCPHS allows the use of minimum help with
    multi-processing techniques to reduce the workload from the unutilized edge servers,
    enhance resource utilization, reduce latency, and increase bandwidth to cater
    the service request. This follows when the effective flow rate of the network
    drops as per our experiments in Section 11.4.3. This is because the current effective
    resources are allocated to the most optimal process leading to low data transfer
    in the network, further leading to a low latency and high bandwidth model. The
    final comparison with the first serve model cloud architecture and the reduction
    of time interval-based cross-validation showcases the superiority of the modeling
    architecture of EP-MCPHS over other current state-of-the-art techniques for placement
    of cloudlet in edge servers. The algorithm also enhances the need for fast cloud
    offloading for high-demand mobile applications, catering to the D2D offloading
    with cloudlet-to-edge server mapping. It increases the bandwidth from 3.81828
    to 6.428571 in the MMFA. The algorithm also reduces the inherent data transfer
    rate to 4.91 for EPMCPHS in comparison to 6.53 for MMFA.




    This study aims to create a dynamic architecture capable of managing the load,
    reducing latency, increasing bandwidth, and decreasing network flow for cloud
    offloading into edge server simulation. The chapter uses EdgeSimPy simulation
    to address the nuances discovered.


    The future scope of this research can be showcased by the enhancement of DRL mechanisms
    wherein a neural simulation for the architecture can be drawn and tested via neural
    agents. The simulation could allow to reduce latency and resource utilization.
    This would also allow for a nonparametric algorithm that replace the current parameterized
    setup and create global loss functions for the calculation of algorithm fitness
    like the studies for feature selection.


