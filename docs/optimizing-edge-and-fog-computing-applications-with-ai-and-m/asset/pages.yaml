  md: '# Communication-Efficient Learning of Deep Networks from Decentralized Data
    [26]


    The paper introduces federated learning. The FedAvg approach reduces the communication
    cost by limiting the number of rounds and amount of data exchanged between devices
    and the server.


    The privacy-preserving nature of federated learning is a key strength, as it eliminates
    the need for data to be centralized, significantly reducing privacy risks.


    The main limitation is the complexity of handling non-IID data at scale.


    # Federated Learning of a Mixture of Global and Local Models [23]


    The paper proposes a novel optimization which is a penalty parameter, $\lambda$,
    to control the trade-off. The authors develop the Looppless Local Gradient Descent
    (L2GD) algorithm, which employs randomized steps and variance reduction techniques
    to solve this formulation.


    The proposed method handles heterogeneous data efficiently, without requiring
    assumptions of data similarity across devices. It improves communication efficiency
    by minimizing the number of communication rounds needed for convergence.


    The randomness in local steps introduces variability that may affect convergence
    rates across devices. Complexity of implementing multiple SGD variants with variance
    reduction poses practical challenges for realworld deployment.


    # Applied Federated Learning: Architectural Design for Robust and Efficient Learning
    in Privacy Aware Settings [15]


    The paper presents an architecture for federated learning that connects server-side
    and device-side data for training models in a privacy-aware setting, focusing
    on binary classifiers. Model training occurs locally, and updates are sent to
    a server in a Trusted Execution Environment (TEE) for secure aggregation.


    By keeping user data on devices and applying differential privacy, the architecture
    protects user privacy while allowing model training at scale.


    Federated learning on mobile devices is significantly slower than centralized
    training, leading to delayed model development cycles.


