    # 6.3.1 The Foundational Aggregation Algorithm


    FL is a decentralized machine learning technique that allows several clients to
    work to build a global model without exchanging local data. By allowing individual
    data sources to stay on-device, this paradigm reduces the risks associated with
    centralized data storage, which is especially advantageous in situations where
    data privacy and security are crucial. The fundamental aggregation approach, the
    FedAvg algorithm is at the core of FL. A selection of participating customers
    receives an initial model as part of FedAvg''s operation. Then, each trains locally
    using their own private data, adjusting the model''s parameters as necessary.
    Clients send back to a central server their updated model parameter following
    the completion of the local training.


    To create a new model, the server combines these updates by calculating a weighted
    average, usually determined by the amount of each client''s dataset. The model
    converges to a performance level that is satisfactory, this iterative process
    keeps on. The FedAvg algorithm is a good fit for FL since it has a number of benefits.
    First, raw data is never sent across a network, it improves privacy preservation
    by keeping data locally. Second, because clients and the server simply exchange
    model parameters rather than datasets, it lowers communication overhead. This
    effectiveness is especially crucial in settings with reduced bandwidth or when
    clients are with limited resources. FedAvg does certain difficulties, though.
    One problem is data heterogeneity, which occurs when data is not equally dispersed
    and independent across clients (non-IID). Under such circumstances, the local
    models that have been trained on different data may differ greatly, resulting
    in a global model that may not function well for all customers [19]. Furthermore,
    different clients'' computational capacities and rates of engagement have an impact
    on the training process''s stability and convergence. Numerous improvements to
    the FedAvg algorithm have been suggested by experts to overcome these issues.
    For example, some strategies incorporate regularization techniques to lessen the
    impact of non-IID data, while others modify the aggregation weights to take client
    reliability or data quality into consideration. Despite these advancements, FedAvg
    remains the cornerstone of aggregation strategies in FL, providing a foundation
    upon which modern FL algorithms are built.'
