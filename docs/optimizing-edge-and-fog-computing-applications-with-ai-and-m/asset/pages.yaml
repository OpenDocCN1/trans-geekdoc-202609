- pgno: 242
  md: '# Optimizing Edge and Fog Computing Applications with AI


    augmented reality, designing mobile applications, cross-platform gaming, and so
    on. These scenarios continue to raise the standard in terms of how people utilize
    software programs in their day-to-day lives. With the emergence of these software
    solutions, the concentration of cloud computing to data centers around a small
    number of global large-scale infrastructures (like Google, Azure, and Amazon)
    has resulted in the setup facing latency due to geographical distance from end
    devices. This distance causes reaction times that are incompatible with the real-time
    needs of the applications in question.


    Therefore, the use of edge computing and its seminal role in offloading mobile
    application tasks is unavoidable. Cloud-native applications like Amazon Web Services
    (AWS) and Google Cloud Platform (GCP) for task offloading require high latency
    and bandwidth are constrained to the unforeseen case of service unavailability.
    The usage of Cloudlet or a small-scale computationally viable resource center
    at the edge of the network peripheral zone is the plausible option. The virtual
    machine (VM)-based offloading proposed in this study advantage of small-scale
    resource management procedures, rather than high-scale centralized cloud computing
    data center environments like AWS or GCP.


    The distributed computing-based system leverages resources by creating a highly
    available cloudlet processing application using edge-scale devices by offloading
    in real time. The procedure highlights the enhanced high computing tasks to split
    in computational parallel pipelines, which can be performed across edge devices
    as a form of device-to-device (D2D) cloud offloading, and the final output can
    be computed in a centralized fashion at the remote cloud through highly available
    offloading techniques. The availability of data sources is near the main characteristic
    of the edge-based cloudlet computing mechanism (ECM). ECM facilitates the diversion
    of tasks between high-scale system units to AWS or GCP and edge-based offloading
    options. ECM infrastructure is capable of reducing carbon emissions from high
    computation needs of the task/resource allocation for mobile units as well as
    saving cost and decreasing latency for wide-scale VM infrastructure.


    The ECM mechanism is capable of reducing the cost and latency extensively; however,
    it consists of two important factors:


    +   A. Placement: The inability to place the tasks in the best-suited computing
    device during D2D offloading, this is crucial as without appropriate placement
    the tasks could witness high latency and a generic decrease in bandwidth. Moreover,
    the proper utilization of ECM is ensured by appropriate placement algorithms.


    +   B. Migration: Further with the low-scale computational issues, starvation
    from the processes aligned across for offloading is a normalized phenomenon to
    reduce the inherent cloudlet or process starvation. Thus, a need for continuous
    migration is essential.'
