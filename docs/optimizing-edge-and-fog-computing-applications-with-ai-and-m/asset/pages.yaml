  md: '# 90 Optimizing Edge and Fog Computing Applications with AI


    detection techniques in order to identify and analyse DDoS attacks. The methodology
    was structured and divided into the following standard research categories.




    An experimental approach consisting of three main components – simulated attack,
    monitoring network activity and detection mechanism – was designed to answer the
    stated research question effectively.


    The first component includes the simulation of attack that is DDoS. The attack
    was launched through an attacking setup on the Amazon Web Services (AWS) EC2 instance
    and the simulations were made to be designed in a way that reflects a real-world
    threat scenario. The DDoS attack was specifically targeted the IoT server hosted
    on the EC2 instance using the hping3 command from a docker service on the attacking
    mechanism which generated high volumes of traffic. This was the same server which
    crafts the IoT devices on the MQTT broker. The attack simulation steps were crafted
    and implemented in order to generate and capture enormous network activity logs
    on the IDS.


    As mentioned, the second component was monitoring all activities in the cloud
    environment on a real-time basis. For Suricata, which is an open-source IDS, was
    deployed on the EC2 instance in the same Virtual Private Cloud (VPC) as of the
    IoT server and with traffic mirroring on AWS was made sure that the IDS is to
    capture all the logs depicting traffic in the design. The IDS was encompassed
    with all the emerging threat rules made sure that the IDS is up to date and would
    identify different anomalous behaviour is possibly associated with the launched
    attacks. Moreover, importing the emerging threat rules also made sure that the
    system also detects other attacks through a detailed inspection of logs. Filebeat
    was also installed and configured in the same instance as Suricata to send the
    logs to ELK (Elasticsearch, Logstash, and Kibana) [16] This made sure that the
    logs received by the SIEM are processed in real time without any data loss for
    further processing and analysis.


    The final and most crucial component was detection mechanism. The evaluation of
    the detection mechanisms can be summarised in two parts: rule-based detections
    and ML-based detections. The rules were encompassed in the Kibana to identify
    the specific patterns in the logs to identify DDoS activities. Additionally, ML
    models (RF and XGBoost) were trained on the IDS logs to classify the attacks.
    This dual approach in the detection mechanism ensured a comprehensive evaluation
    of the logs in real time, making sure of a secure network infrastructure deployed
    completely. By combining these components, the research design ensured a robust
    framework for simulating, analysing and monitoring security threats in a cloud-based
    environment. This design also made sure that the testing is adhered to standard
    practices such as the National Institute of Standards and Technology'
