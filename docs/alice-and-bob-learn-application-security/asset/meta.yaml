- - '##'
  - 第 4 章：安全代码
- - '###'
  - 1. 你在何时应该使用自己的身份（用户账户）而不是服务账户？给出两个例子并解释你的理由。
- - '###'
  - 2. 解释为什么在存在 `Rust`（一种内存安全的语言）的情况下，`C` 和 `C++` 在我们的行业中仍被广泛使用的可能原因或情况。尝试考虑两个更多。
- - '###'
  - 3. 你喜欢的编程语言和或框架是什么？为什么？
- - '###'
  - 4. 你认为哪种编程语言和或框架最安全？为什么？
- - '###'
  - 5. 为什么我们需要保护用户会话（session）？
- - '###'
  - 6. 如果攻击者能够在某人登录其网上银行时获取其会话，攻击者可以做什么？
- - '###'
  - 7. 如果你要向一位非技术的同事解释身份验证（authentication）和授权（authorization）之间的区别，你会如何解释？
- - '###'
  - 8. C级高管是否应该在你的网络和其他计算机系统中拥有特权？如果是，为什么？如果不是，为什么不是？你给他们什么类型的权限？
- - '###'
  - 9. 网络系统管理员是否应该在你的网络和其他计算机系统中拥有特权？如果是，为什么？如果不是，为什么不是？你给他们什么类型的权限？
- - '###'
  - 10. 帮助台员工是否应该在你的网络和其他计算机系统中拥有特权？如果是，为什么？如果不是，为什么不是？你给他们什么类型的权限？
- - '###'
  - 11. 你的老板告诉你开启日志和监控成本太高了。你如何从安全的角度解释其价值和重要性？写一段话来说服你的老板。记住要确保你解释了对业务的潜在风险，并使用你的老板能够理解的方式（他是一个聪明但不过度通技术的人）。
