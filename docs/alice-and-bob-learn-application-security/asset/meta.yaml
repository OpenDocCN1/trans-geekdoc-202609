- - '#'
  - 大多数密码管理器都有浏览器插件，这样你只需要登录密码管理器，只需点击一个按钮即可登录你正在访问的任何网站。它会将你的用户名和密码复制到浏览器中，这意味着避免了输入错误。非常优秀的密码管理器还会提醒你：是否在多个地方使用了相同的密码、你的用户名和密码是否曾出现在数据泄露事件中泄露、你是否选择了弱密码（在使用密码器时，你仍然可以创建自己的密码），以及你拥有账户的网站是否提供了
    MFA（多因素身份验证）以便你开启 MFA 功能。
