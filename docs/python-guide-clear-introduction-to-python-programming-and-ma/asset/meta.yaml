  - 第七章 关于机器学习你应该十件事
- - '##'
  - 4. 机器学习的效果完全取决于训练时所使用的数据。
- - '##'
  - 5. 如果要机器学习发挥作用，你的训练数据需要具有代表性。
- - '##'
  - 6. 数据转换占据了工作量最大的部分。
- - '##'
  - 7. 深度学习可能是最具革命性的进展之一，但它并不是“万灵妙药”。
- - '##'
  - 8. 机器学习系统依赖操作者的输入。
- - '##'
  - 9. 在无意中，机器学习最终可能会创造一种“自我实现的预言”。
- - '##'
  - 10. AI 不会突然崛起并摧毁我们认知的人类。
