- fmt: "\nWith inheritance, all methods and data fields can be accessed, along with\
    \ the ability to add fields and method of your own. In this way, inheritance allows\
    \ us to organize our code better, rather than having to write it all again.\n\n\
    As an example, if class `X` were to extend class `Y`, `Y` would be the base or\
    \ superclass, otherwise known as the parent class, while `X` would be the derived\
    \ or subclass, otherwise known as the child class. A child class may only access\
    \ public methods and data fields; the private ones can only be accessed from within\
    \ the class.\n\nCreating a subclass uses this syntax:\n\n```python\nclass SubClass(SuperClass):\n\
    \    # the data fields\n    # the instance methods\n```\n\nHere’s an example to\
    \ see how it works:\n\n```python\nclass Vehicle:\n    def __init__(self, name,\
    \ color):\n        self.__name = name  # __name is private to the Vehicle class\n\
    \        self.__color = color\n\n    def getColor(self):  # getColor() function\
    \ can be accessed by the Car class\n        return self.__color\n\n    def setColor(self,\
    \ color):  # setColor can be accessed outside the class\n        self.__color\
    \ = color\n\n    def getName(self):  # getName() can be accessed outside the class\n\
    \        return self.__name\n\nclass Car(Vehicle):\n    def __init__(self, name,\
    \ color, model):\n        # set the name and color by calling the parent constructor\n\
    \        super().__init__(name, color) \n        self.__model = model\n\n    def\
    \ getDescription(self):\n        return self.getName() + self.__model + \" in\
    \ \" + self.getColor() + \" color\"\n\n    # in the getDescription() method, getColor()\
    \ and getName() can be called because\n    # inheritance makes it so the child\
    \ class can access them\n\nc = Car(\"Toyota Camry\", \"blue\", \"XLE\")\nprint(c.getDescription())\n\
    print(c.getName()) # car does not have a getName() method but it can be accessed\
    \ via the Vehicle class\n```\n\nWe would expect to see this output:\n\n```\nToyota\
    \ Camry XLE in blue\nToyota Camry\n```\n\nWhat we did here was create a base class\
    \ named `Vehicle` and a subclass called `Car`. We did not define the method called\
    \ `getName()` in our `Car` class, but we still have access; this is because the\
    \ `Car` class has inherited `getName()` from `Vehicle`. We used the `super()`\
    \ method to call the base class method.\n\n### How does super() work?\n\nLet’s\
    \ say that you have a method named `getInformation()`. It is in the base class,\
    \ and you want to call it from the child class. That is possible with this code:\n\
    \n```python\nsuper().get_information()\n```\n\nAlternatively, the base class constructor\
    \ could be called from the constructor in the child class, with this code:\n\n\
    ```python\nsuper().__init__()\n```\n\n## Multiple Inheritance\n\nUnlike other\
    \ languages, multiple inheritance is allowed in Python. This means that multiple\
    \ classes may be inherited from simultaneously. Here’s how:\n\n```python\nclass\
    \ Subclass(SuperClass1, SuperClass2, ...):\n    # initializer\n    # methods\n\
    ```\n\nHere’s an example of multiple inheritance in action:\n\n```python\nclass\
    \ MySuperClass1():\n    def method_super1(self):\n        print(\"method_super1\
    \ method called\")\n\nclass MySuperClass2():\n    def method_super2(self):\n \
    \       print(\"method_super2 method called\")\n\nclass ChildClass(MySuperClass1,\
    \ MySuperClass2):\n    def child_method(self):\n        print(\"child method\"\
    )\n\nc = ChildClass()\nc.method_super1()\nc.method_super2()\n```\n\nAs an output,\
    \ you should see:\n\n```\nmethod_super1 method called\nmethod_super2 method called\n\
    ```\n\nHere you can see that `MySuperClass1`, `MysSuperClass2` are inherited by\
    \ `ChildClass`, the `ChildClass` object can now have access to `method_super1()`\
    \ and `method_super2()`.\n\n## Method Overriding\n\nOverriding a base class method\
    \ requires the subclass to define another method that has an identical signature\
    \ – it has the same name and parameter number as the base class method. Here’s\
    \ an example:\n\n```python\nclass A():\n    def __init__(self):\n        self.__x\
    \ = 1\n    def m2(self):\n        print(\"m2 from B\")\n\nclass C(B):\n    def\
    \ __init__(self):\n        self.__y = 1\n    def m1(self):\n        print(\"m2\
    \ from C\")\n\nc = C()\nc.m2()\n```\n\nThe output should be\n\n```\nm2 from C\n\
    ```\n\n## isinstance() Function\n\nWe use this function to work out if an object\
    \ is a class instance or not and the syntax is:\n\n`isinstance(object, class_type)`\n\
    \nHere’s an example:\n\n```python\n>>> isinstance(5, int)\nTrue\n>>> isinstance(5.3,\
    \ int)\nFalse\n>>> isinstance([5, 6, 7, 8], list)\nTrue\n```\n\nIn the next chapter,\
    \ we’ll turn to exception handling.\n\n# Exception Handling\n\nException handling\
    \ in Python is all about handling errors in the right way, perhaps having a message\
    \ display on the screen if a specified file cannot be found. Errors are handled\
    \ using a `try`, `except` code block, and the syntax is:\n\n```python\ntry:\n\
    \    # write a little code\n    # that could fail\nexcept ExceptionType:\n   \
    \ # handle the error\n```\n"
