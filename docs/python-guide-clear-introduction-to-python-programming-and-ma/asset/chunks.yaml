    True


    True


    False


    True


    True


    True


    ## Searching for Substrings


    The methods used to search for substrings in a string are:


    Method Name  Method Description


    endswith(s1: str): bool if the string ends with the s1 substring returns True


    startswith(s1: str): bool if the string starts with the s1 substring, returns
    True


    count(substring): int counts and returns number of times the given substring appears
    in the string


    find(s): int finds and returns the lowest index at which s1 starts; if it isn’t
    found, -1 is returned


    rfind(s1): int finds and returns the highest index at which s1 starts or -1 if
    it isn’t found


    Here’s an example:


    \>>> s = "good day to python"


    \>>> s.endswith("thon")


    True


    \>>> s.startswith("good")


    False


    \>>> s.find("day")


    3


    \>>> s.find("become")


    \-1


    \>>> s.rfind("o")


    15


    \>>> s.count("o")


    1


    \>>>


    Try it for yourself:


    s = "good day to python."


    print(s.endswith("thon"))


    print(s.startswith("good"))


    print(s.find("day"))


    print(s.find("become"))


    print(s.rfind("o"))


    print(s.count("o"))


    ​And the result is:


    ​ True


    False


    1


    ## Converting Strings


    There are also several string conversion methods in Python:


    Method Name   Method Description


    capitalize(): str a copy of the string is returned with a capitalized first character


    lower(): str string returned with all characters converted to lowercase


    upper(): str string returned with all characters converted to uppercase


    title(): str string returned with the first character in every word capitalized


    swapcase(): str string returned with the cases swapped over


    replace(old\\,  new): str old string replaced by a new string and new string returned


    Here’s some examples:


