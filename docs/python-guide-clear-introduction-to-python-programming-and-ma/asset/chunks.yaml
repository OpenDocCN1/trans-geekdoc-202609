    In this guide to machine learning with `Python`, I''m going to give you an overview
    of all the most important topics.


    *   Chapter One – an overview of machine learning, where you learn exactly what
    it is and what it''s all about

    *   Chapter Two – we''ll delve into the different types of regression

    *   Chapter Three – we''ll look at classification algorithms

    *   Chapter Four – an overview of unsupervised learning, including some algorithms

    *   Chapter Five – a machine learning project for you to try

    *   Chapter Six – an introduction to data science with `Python`, why you want
    to learn `Python` and the five steps to becoming a data scientist

    *   Chapter Seven – a list of ten things you should all know about machine learning


    What I won''t be doing is teaching you the `Python` programming language. You
    do need to know the basics, but you can find those in my book, titled "Python
    Computer Programming - Simple Step-By-Step Introduction to the Python Object-Oriented
    Programming: Quick Start Guide for Beginners."


    ### Why Python?


    `Python` is the very best computer programming language for beginners to cut their
    teeth on, especially in machine learning and data science. It is an easy language
    to get to grips with, and it offers all the libraries and frameworks you need,
    significantly cutting the time it will take to get results.


