  raw: 'We are also going to evaluate our models use the ''accuracy'' metric, which
    is a ration of how many instances are predicted correctly divided the how many
    instances are in the dataset in total, and then multiplied by one hundred to provide
    a percentage of accuracy, i.e., 97% accurate. The scoring variable will be used
    next when the models are run, built, and evaluated.


    Build the Models


    At this stage, we have no idea which would be the best algorithms to use for this
    or the specific configurations to use.  We can get a reasonable idea by looking
    at our plots, that we have partly linearly separable classes in some of the dimensions,
    so the results should be pretty good.


    We''re going to test six algorithms:


    Let''s test 6 different algorithms:


    *   Logistic Regression


    *   Linear Discriminant Analysis


    *   K-Nearest Neighbors


    *   Classification and Regression Trees


    *   Gaussian Naive Bayes


    *   Support Vector Machines


    This is a pretty good combination of simple linear algorithms and nonlinear algorithms.


    Here’s how we build our models and evaluate them:


    \# Spot Check Algorithms


    models = \[\]


    models.append((''LR'', LogisticRegression(solver=''liblinear'', multi\_class=''ovr'')))


    models.append((''LDA'', LinearDiscriminantAnalysis()))


    models.append((''KNN'', KNeighborsClassifier()))


    models.append((''CART'', DecisionTreeClassifier()))


    models.append((''NB'', GaussianNB()))


    models.append((''SVM'', SVC(gamma=''auto'')))


    \# evaluate each model in turn


    results = \[\]


    names = \[\]


    for name, model in models:


    kfold = StratifiedKFold(n\_splits=10, random\_state=1, shuffle=True)


    cv\_results = cross\_val\_score(model, X\_train, Y\_train, cv=kfold, scoring=''accuracy'')


    results.append(cv\_results)


    names.append(name)


    print(''%s: %f (%f)'' % (name, cv\_results.mean(), cv\_results.std()))


    Select the Best Model


    So, we have our models and we have an accuracy estimate for each one. The next
    step is to compare all the models to one another and choose the one that is most
    accurate. If we run the above example, we would get something like this:


    LR: 0.960897 (0.052113)


    LDA: 0.973974 (0.040110)


    KNN: 0.957191 (0.043263)


    CART: 0.957191 (0.043263)


    NB: 0.948858 (0.056322)


    SVM: 0.983974 (0.032083)


    What we can see here is that the SVM (Support Vector Machine) shows the biggest
    accuracy score (estimated) of 98% or 0.98.


    A plot can be created showing the evaluation results for each model, and showing
    each model''s spread and mean accuracy.  Each algorithm has an accuracy measure
    population because we evaluated each one ten times, using 10-fold cross-validation.


    One of the best ways of comparing the result''s samples for the individual algorithms
    is with a box and whisker plot for the individual distributions; those distributions
    are then compared:


    \# Compare Algorithms


    pyplot.boxplot(results, labels=names)


    pyplot.title(''Algorithm Comparison'')


    pyplot.show()


    It''s easy to see the plots squashed in at the range''s top, with lots of the
    evaluations coming in at 100% accuracy. Some do push down to around the high 80''s
    as well.


    ![Box and Whisker Plot Comparing Machine Learning Algorithms on the Iris Flowers
    Dataset](d2d_images/image008.png)


    Box and Whisker Plot Comparing the Machine Learning Algorithms on the Iris Flowers
    Dataset (www.machinelearningmastery.com)


    A Complete Example


    Again, for you reference, here it is all tied together:


    \# compare algorithms


    from pandas import read\_csv


    from matplotlib import pyplot


    from sklearn.model\_selection import train\_test\_split


    from sklearn.model\_selection import cross\_val\_score


    from sklearn.model\_selection import StratifiedKFold


    from sklearn.linear\_model import LogisticRegression


    from sklearn.tree import DecisionTreeClassifier


    from sklearn.neighbors import KNeighborsClassifier


    from sklearn.discriminant\_analysis import LinearDiscriminantAnalysis


    from sklearn.naive\_bayes import GaussianNB


    from sklearn.svm import SVC


    \# Load dataset


    url = "https://raw.githubusercontent.com/jbrownlee/Datasets/master/iris.csv"


    names = \[''sepal-length'', ''sepal-width'', ''petal-length'', ''petal-width'',
    ''class''\]


    dataset = read\_csv(url, names=names)


    \# Split-out validation dataset


    array = dataset.values


    X = array\[:,0:4\]


    y = array\[:,4\]


    X\_train, X\_validation, Y\_train, Y\_validation = train\_test\_split(X, y, test\_size=0.20,
    random\_state=1, shuffle=True)


    \# Spot Check Algorithms


    models = \[\]


    models.append((''LR'', LogisticRegression(solver=''liblinear'', multi\_class=''ovr'')))


    models.append((''LDA'', LinearDiscriminantAnalysis()))


    models.append((''KNN'', KNeighborsClassifier()))


    models.append((''CART'', DecisionTreeClassifier()))


    models.append((''NB'', GaussianNB()))


    models.append((''SVM'', SVC(gamma=''auto'')))


    \# evaluate each model in turn


    results = \[\]


    names = \[\]


    for name, model in models:


    kfold = StratifiedKFold(n\_splits=10, random\_state=1, shuffle=True)


    cv\_results = cross\_val\_score(model, X\_train, Y\_train, cv=kfold, scoring=''accuracy'')


    results.append(cv\_results)


    names.append(name)


    print(''%s: %f (%f)'' % (name, cv\_results.mean(), cv\_results.std()))


    \# Compare Algorithms


    pyplot.boxplot(results, labels=names)


    pyplot.title(''Algorithm Comparison'')


    pyplot.show()


    Step Six - Make Some Predictions


    Next, we want to make some predictions and we can only do that by choosing the
    right algorithm to use. We got an idea in Step five that we Support Vector Machine
    (SVM) algorithm, is probably the most accurate one for this problem so this will
    be the algorithm we use for the final model.


    So, now we need to get an idea of how accurate the model is on the validation
    dataset. This is a final, independent check on how accurate the best model is.
    It''s always a good idea to split your dataset into training and validation sets,
    just in case something goes wrong during training, like a data leak or overfitting. 
    If either of those happens, the results will be somewhat over-optimistic, and
    that won''t give you an accurate representation.


    So to make our predictions, the model needs to be fit onto the whole training
    dataset, and the predictions are then made on the validation set. Here''s how:


    \# Make predictions on the validation dataset


    model = SVC(gamma=''auto'')


    model.fit(X\_train, Y\_train)


    predictions = model.predict(X\_validation)


    Evaluate the Predictions


    To evaluate our predictions, we need to compare them with the results expected
    from the validation dataset. Then the classification accuracy must be calculated,
    along with a classification report and confusion matrix.


    \# Evaluate predictions


    print(accuracy\_score(Y\_validation, predictions))


    print(confusion\_matrix(Y\_validation, predictions))


    print(classification\_report(Y\_validation, predictions))


    As you can see, we have an accuracy of around 96% or 0.966 on our hold-out dataset
    and the confusion matrix gives us an indication of three errors.


    Lastly, in the classification report, we can see each class broken down by recall,
    precision, the f-1 score, and support and, although we did only use a small validation
    dataset, we get excellent results.


