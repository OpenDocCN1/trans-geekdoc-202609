    # Operator Overloading


    ![image](d2d_images/chapter_title_below.png)


    Python operators all do something different, but some can do more than one thing.
    Take the + operator, for example. We can use it for both addition and string concatenation.
    We can do this because both the str and the int class overload the + operator.


    Operators are methods, each defined in the classes they are used in. When you
    define a method for an operator, it is called operator overloading. For example,
    when you have custom objects that you want to use the + operator with, a method
    named \_\_add\_\_ must be defined.


    Let’s see an example to get a better understanding of this:


    import math


    class Circle:


    def \_\_init\_\_(self, radius):


    self.\_\_radius = radius


    def setRadius(self, radius):


    self.\_\_radius = radius


    def getRadius(self):


    return self.\_\_radius


    def area(self):


    return math.pi \* self.\_\_radius \*\* 2


    def \_\_add\_\_(self, another\_circle):


    return Circle( self.\_\_radius + another\_circle.\_\_radius )


    c1 = Circle(7)


    print(c1.getRadius())


    c2 = Circle(7)


    print(c2.getRadius())


    c3 = c1 + c2 # We can do this because we added the \_\_add\_\_ method, thus overloading
    the + operator


    print(c3.getRadius())


    From this, we would expect to see:


    7


    7


    14


    What we did here was included the method called \_\_add\_\_(). This lets us make
    use of the + operator for adding a pair of objects – circles, in our case. A new
    object has been created in the \_\_add\_\_() method, and that object is returned
    to the caller.


    Python has quite a few built-in special methods:


    Operator   Function     Method Description


    +     \_\_add\_\_(self, other)  Addition


    \*     \_\_mul\_\_(self, other)  Multiplication


    \-    \_\_sub\_\_(self, other)  Subtraction


    %    \_\_mod\_\_(self, other)  Remainder


    /    \_\_truediv\_\_(self, other)  Division


    <    \_\_lt\_\_(self, other)   Less than


    <=    \_\_le\_\_(self, other) ,  Less than or equal to 


    \==      \_\_eq\_\_(self, other) ,  Equal to 


    !=      \_\_ne\_\_(self, other) , Not equal to 


    \>    \_\_gt\_\_(self, other)  ,  Greater than 


    \>=,      \_\_ge\_\_(self, other) ,  Greater than or equal


    to \[index\] ,     \_\_getitem\_\_(self, index) , 


    Index operator in ,    \_\_contains\_\_(self, value) ,


    Check membership len ,  \_\_len\_\_(self) ,  


    Number of elements str ,  \_\_str\_\_(self) ,     string representation


    You can see some of these functions in use below:


    import math


    class Circle:


    def \_\_init\_\_(self, radius):


    self.\_\_radius = radius


    def setRadius(self, radius):


    self.\_\_radius = radius


    def getRadius(self):


    return self.\_\_radius


    def area(self):


    return math.pi \* self.\_\_radius \*\* 2


    def \_\_add\_\_(self, another\_circle):


    return Circle( self.\_\_radius + another\_circle.\_\_radius )


    def \_\_gt\_\_(self, another\_circle):


    return self.\_\_radius > another\_circle.\_\_radius


    def \_\_lt\_\_(self, another\_circle):


    return self.\_\_radius < another\_circle.\_\_radius


    def \_\_str\_\_(self):


    return "Circle with radius " + str(self.\_\_radius)


    c1 = Circle(7)


    print(c1.getRadius())


    c2 = Circle(7)


    print(c2.getRadius())


    c3 = c1 + c2


    print(c3.getRadius())


    print( c3 > c2) # possible because we added \_\_gt\_\_ method


    print( c1 < c2) # possible because we added \_\_lt\_\_ method


    print(c3) # possible because we added \_\_str\_\_ method


    And we would expect to see the following output:


    7


    7


    14


    True


    True


    Circle with a radius 14


    And, next, we look at inheritance and polymorphism in Python​


    Inheritance And Polymorphism


    Inheritance and polymorphism are two of the most important concepts in Python.


    ## Inheritance


    Inheritance is one of the ways that a programmer can write much better code. It
    lets you make a general class before extending it, later in the code, to a specialized
    class.'
