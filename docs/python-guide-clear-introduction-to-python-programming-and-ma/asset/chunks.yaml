- fmt: "\nThe lasso regression techniques use `l1` regularization. To see how it works,\
    \ we'll define a linear regression model, `Y`, that has a single independent variable.\n\
    \n`W` is representing Weight, while `b` is representing bias.\n\n`W=w1,w2...wnX=x1,x2...xn`\n\
    \nThe result that is predicted is\n\n`Y^`\n\n`Y^=w1x1+w2x2+...wnxn+b`\n\nThe formula\
    \ below will calculate what the error is without using a regularization function:\n\
    \n`Loss=Error(Y,Y^)`\n\nAnd this one uses the `l1` function:\n\n`Loss=Error(Y−Y^)+λ∑1n|wi|`\n\
    \n### Note\n\nIf the `lambda` value were zero, the loss function above would become\
    \ `OLS` (ordinary least square); having oversized values shrinks the weights (coefficients)\
    \ to zero, causing underfitting.\n\nOne thing you do need to note is `|w|` becomes\
    \ differentiable when `w!=0`:\n\n`d|w|dw={1−1w>0w<0`\n\nTo help you understand\
    \ this, we can use the gradient descent optimizer to find new weights:\n\n`wnew=w−η∂L1∂w`\n\
    \nWhen `l1` is applied to this, it will become:\n\n`wnew=w−η.(Error(Y,Y^)+λd|w|dw)={w−η.(Error(Y,Y^)+λ)w−η.(Error(Y,Y^)−λ)w>0w<0`\n\
    \nFrom this formula:\n\nWhere `w` is positive, the `λλ  > 0` regularization parameter\
    \ pushes `w`, so it isn't so positive. It does through subtraction of `λλ` from\
    \ `w`.\n\nWhere `w` is negative, the `λλ < 0` regularization parameter pushed\
    \ `w`, so it isn't so negative. It does this through the addition of `λλ` to `w`,\
    \ and this will push `w` nearer to 0.\n\n### Simple Python Implementation\n\n\
    ```python\ndef update_weights_with_l1_regularization(features, targets, weights,\
    \ lr,lambda):\n    '''\n    Features:(200, 3)\n    Targets: (200, 1)\n    Weights:(3,\
    \ 1)\n    '''\n    predictions = predict(features, weights)\n    #Extract our\
    \ features\n    x1 = features[:,0]\n    x2 = features[:,1]\n    x3 = features[:,2]\n\
    \    # Use matrix cross product (*) to simultaneously\n    # calculate the derivative\
    \ for each weight\n    d_w1 = -x1*(targets - predictions)\n    d_w2 = -x2*(targets\
    \ - predictions)\n    d_w3 = -x3*(targets - predictions)\n    # Multiply mean\
    \ derivative by the learning rate\n    # and subtract from weights (gradient points\
    \ in the direction of steepest ASCENT)\n    weights[0] = (weights[0] - lr * np.mean(d_w1)\
    \ - lambda) if weights[0] > 0 else (weights[0] - lr * np.mean(d_w1) + lambda)\n\
    \    weights[1] = (weights[1] - lr * np.mean(d_w2) - lambda) if weights[1] > 0\
    \ else (weights[1] - lr * np.mean(d_w2) + lambda)\n    weights[2] = (weights[2]\
    \ - lr * np.mean(d_w3) - lambda) if weights[2] > 0 else (weights[2] - lr * np.mean(d_w3)\
    \ + lambda)\n    return weights\n```\n\n`L1` regularization and variations is\
    \ typically chosen when there are multiple features because the solutions provided\
    \ by it are sparse. Because the features have zero weights can be ignored, it\
    \ provides advantage in computational terms.\n\n### L2\n\nRidge regression uses\
    \ the `l2` technique, and the primary difference between `l1` and `l2` is that\
    \ the latter makes use of the coefficient's squared magnitude as way of penalizing\
    \ the loss function. We'll define a linear regression model, called `Y`, with\
    \ a single independent variable to see how this works. Again, `W` is representing\
    \ Weight while `b` is representing bias.\n\n`W=w1,w2...wnX=x1,x2...xn`\n\nThe\
    \ result that is predicted is `Y^`\n\n`Y^=w1x1+w2x2+...wnxn+b`\n\nThe formula\
    \ below will calculate the error without using a regularization function:\n\n\
    `Loss=Error(Y,Y^)`\n\nWhile this one uses `l2` function to calculate it:\n\n`Loss=Error(Y−Y^)+λ∑1nw2`\n\
    \n### Note\n\nAs you can imagine, where `lambda` is zero, we get `OLS` back. However,\
    \ where the `lambda` is large, too much weight is added, resulting in underfitting.\
    \ To help you understand this, we can substitute our formula and use gradient\
    \ descent to find the new weights.\n\n`wnew=w−η∂L2∂w`\n\nWhen `l2` applies to\
    \ this, we get:\n\n`wnew=w−η.(Error(Y,Y^)+λ∂L2∂w)=w−η.(Error(Y,Y^)+2λw)`\n\n###\
    \ Simple Python Implementation\n\n```python\ndef update_weights_with_l2_regularization(features,\
    \ targets, weights, lr,lambda):\n    '''\n    Features:(200, 3)\n    Targets:\
    \ (200, 1)\n    Weights:(3, 1)\n    '''\n    predictions = predict(features, weights)\n\
    \    #Extract our features\n    x1 = features[:,0]\n    x2 = features[:,1]\n \
    \   x3 = features[:,2]\n    # Use matrix cross product (*) to simultaneously\n\
    \    # calculate the derivative for each weight\n    d_w1 = -x1*(targets - predictions)\n\
    \    d_w2 = -x2*(targets - predictions)\n    d_w3 = -x3*(targets - predictions)\n\
    \    # Multiply mean derivative by the learning rate\n    # and subtract from\
    \ weights (remember gradient points in the direction of steepest ASCENT)\n   \
    \ weights[0] = weights[0] - lr * np.mean(d_w1) - 2 * lambda * weights[0]\n   \
    \ weights[1] = weights[1] - lr * np.mean(d_w2) - 2 * lambda * weights[1]\n   \
    \ weights[2] = weights[2] - lr * np.mean(d_w3) - 2 * lambda * weights[2]\n   \
    \ return weights\n```\n\n`L2` regularization is used in cases of multicollinearity;\
    \ it can reduce this through the constraint of the coefficient norm and retaining\
    \ every variable. `L2` regression is good for estimating the importance of predictors,\
    \ penalizing those that have the least importance. One of the biggest problems\
    \ with co-linearity is the huge parameter estimate variance. Where there are more\
    \ features than observations, the `OLS` matrix is typically not invertible but,\
    \ by using ridge regression, it can be inverted.\n\n# Chapter Three: Classification\
    \ Machine Learning Models\n\nClassification models are used on both unstructured\
    \ and structured data. The technique categorizes data into a specified number\
    \ of classes, and the primary goal is to identify the class or category that new\
    \ data will all into.\n\nSome of the terminology you will come across includes:\n\
    \n*   `Classifier` – algorithm for mapping input data to categories\n*   `Classification\
    \ Model` – a machine learning model that takes input values for training purposes\
    \ and attempts to draw conclusions from it. These models predict categories and\
    \ labels for new data\n*   `Features` – an individual property of an observed\
    \ phenomenon; these properties are measurable\n*   `Binary Classification` – a\
    \ classification tasks that has two potential outcomes, for example, a gender\
    \ classification task, Male/Female\n*   `Multi-class Classification` – a classification\
    \ that has two or more classes; every sample is assigned to just one target label,\
    \ for example, and insect may be a fly or a spider, but it cannot be both at the\
    \ same time\n*   `Multi-label Classification` – classification, where the samples\
    \ are individually mapped to sets of target labels, i.e., two or more classes.\
    \ For example, news articles can be about people, locations, and activities at\
    \ the same time.\n\nTo build a classification model:\n\n*   The classifier you\
    \ want to use must be initialized\n*   The classifier must then be trained. The\
    \ classifiers included in `Scikit-learn` use a `fit` method `(X, y)` for training\
    \ or fitting the model. The training data is `X`, and the training label is `y`.\n\
    *   The target is predicted. With an observation, `X`, that has no label, `predict(X)`\
    \ will return `y`, the expected and predicted label\n*   The model is evaluated\n"
