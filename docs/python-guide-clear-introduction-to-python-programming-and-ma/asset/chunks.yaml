    # Data Types and Variables


    ![image](d2d_images/chapter_title_below.png)


    A variable is a location in memory, given a specific name, used for storing object
    references. The names given to both functions and variables are also called identifiers
    an there are specific rules we must work to:


    1. Identifiers may only begin with an underscore `_` or a letter – no numbers.
    So, `my_var` is valid, `1var` is not.

    2. Identifiers may be made up of a combination of numbers letters and underscores,
    no other characters. For example, you could have `python_101` or `_python`, but
    you could not have `$python$` - the `$` sign is not valid.

    3. There is no limit on the length of an identifier name, although keeping them
    short and to the point is recommended.

    4. You cannot use any Python keywords as an identifier name. These are reserved
    for use by Python for specific purposes.


    ## Python Keywords


    These are the keywords:


    `and`, `as`, `assert`, `break`, `class`, `continue`, `def`, `del`, `elif`, `else`,
    `except`, `False`, `finally`, `for`, `from`, `global`, `if`, `import`, `in`, `is`,
    `lambda`, `None`, `nonlocal`, `not`, `or`, `pass`, `raise`, `return`, `True`,
    `try`, `while`, `with`, `yield`


    ## Assign a Variable With a Value


    Every program needs values to work with, i.e. `1`, `10`, `3.14`, `"Good Morning"`
    are values. In computer coding, values are also called literals and these may
    be of different types. For example, `1` and `10` are `ints`, `9.15` are `floats`,
    and `"Good Morning"` is type `string`. Everything in Python is an object, including
    the data types such as `string`, `int`, and `float` – we’ll go into this in more
    detail later.


    Unlike other programming languages, you don’t have to declare variable types before
    you need them. The interpreter will know what the variable type is using the data
    in it.


    We use the `=` sign to assign variables with values, also called the ‘assignment
    operator.’


    Here are a few examples:


    ```

    x = 100

    pi = 3.14

    empname = "Python is fantastic"

    a = b = c = 150

    ```


    Try these statements in your interpreter – copy the following code:


    ```python

    x = 100  # x is an integer

    pi = 3.14  # pi is a float

    empname = "python is fantastic"  # empname is a string

    a = b = c = 150 # this assigns a, b, and c with 150

    print(x)  # print the value of x

    print(pi)  # print the value of pi

    print(empname)  # print the value of empname

    print(a, b, c)  # print the value of a, b, and c, at the same time

    ```


    You should see this on your screen:


    ```

    150

    3.14

    python is fantastic

    ```


    Note:

    Values assigned to variables are not stored in the variable. Instead, only a reference,
    an address if you like, of the object’s location in memory is stored. So, in the
    code above, the variable named `x` is storing a reference to `100`, which is the
    `int` object, and not `100` as a number.


    ## Using Comments


    A comment is nothing more than a note added by the coder to explain parts of the
    code. They are not program statements, and the interpreter will not execute them.
    Python comments always start with the hash sign `#`.


    For example:


    ```python

    # This program will print “Good Morning World.”

    print("Good Morning World")

    ```


    Try it for yourself by typing the above into the interpreter, and you should see
    “Good Morning World” displayed on the screen.


    The first line of the program is a comment so that Python will ignore it. You
    can also add comments to the end of a line too. Try this example:


    ```python

    # This program will print “Good Morning World.”

    print("Good Morning World") # display “Good Morning World.”

    ```


    These are known as end-of-line comments.


    ## Simultaneous Assignment


    Simultaneous assignment, also called multiple assignment, lets us give values
    to more than one variable at a time. The syntax for this is:


    `var1, var2, ..., varphi = exp1, exp2, ..., expn`


    That statement tells Python that all expressions to the right should be evaluated
    and assigned to the correct variable to the left.


    Try this example:


    ```python

    a, b = 10, 20

    print(a)

    print(b)

    ```


    The output should be:

    ```

    10

    20

    ```


