    # Datatype Conversion


    ![image](d2d_images/chapter_title_below.png)


    Now and again, you will find that you need to change a data type to a different
    one. This is done through conversion or typecasting.


    ## Converting an int to a Float


    The float() function is used to convert an int to a float:


    \>>> i = 15


    \>>> float(i)


    15.0


    ## Converting a Float to an int


    The int() function is used to convert a float to an int:


    \>>> f = 25.85


    \>>> int(f)


    25


    ## Converting a String to an int


    The int() function is used to convert a string to an int:


    \>>> s = "456"


    \>>> int(s)


    456


    Note


    If there are any non-numeric characters in a string, the int() function will cause
    a ValueError exception to be thrown.


    ## Converting a Number to a String


    The str() function is used to convert a number to a string:


    \>>> i = 150


    \>>> str(i)


    "150"


    \>>> f = 1.5


    str(f)


    ''1.5''


    ## Rounding Numbers


    The round() function is used to round numbers and the syntax is


    round(number\[, ndigits\])


    Here’s an example:


    \>>> i = 24.86213


    \>>> round(i, 2)


    24.86


    In the next section, we turn to control statements.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Python Control Statements


    ![image](d2d_images/chapter_title_below.png)


    Python statements are commonly executed based on one or more conditions. We’re
    going to look at the if-else statement but, before we do that, we need to know
    what the relational operators are, used for comparisons between two objects:


    Operator   Description


    <=    less than or equal to


    <    less than


    \>    more than


    \>=    more than or equal to


    \==    equal to


    !=    not equal to


    The comparison result is and always will be a Boolean of True or False. Let’s
    look at a few examples:


    \>>> 2 == 4


    False


    \>>> 10 > 2


    True


    \>>> 10 == 10


    True


    \>>> 55 != 15


    True


    Now we can look at if statements; the syntax for an if statement is this:


    if boolean-expression:


    #statements


    else:


    #statements


    Note:


    Every statement inside an if block should be indented to the same number of spaces;
    if the indentation differs, a syntax error will occur. In other languages, such
    as C, C#, and Java, curly braces are used instead.


    Here’s an example of an if statement:


    i = 16


    if i % 2 == 0:


    print("Number is even")


    else:


    print("Number is odd")


    You can see from this that “Number is even” is printed if you have an even number;
    if it is odd, then “Number is odd” gets printed.


    Note:


    You do not need to use an else clause – it is optional – but if you choose to
    use one you use it like this:


    if today == "wedding":


    print("congratulations!")


    If today has a value of ‘wedding,’ then the result will be “congratulations.”
    If not, nothing is printed.


    If you have multiple conditions to check, you would use an if-elif-else statement:


    if boolean-expression:


    #statements


    elif boolean-expression:


    #statements


    elif boolean-expression:


    #statements


    elif boolean-expression:


    #statements


    else:


    #statements


    There is no limit to how many elif conditions you use; it will depend on what
    the program requires. Here’s a proper example of an if-elif-else statement:


    today = "sunday"


    if today == "sunday":


    print("this is sunday")


    elif today == "monday":


    print("this is monday")


    elif today == "tuesday":


    print("this is tuesday")


    elif today == "wednesday":


    print("this is wednesday")


    elif today == "thursday":


    print("this is thursday")


    elif today == "friday":


    print("this is friday")


    elif today == "saturday":


    print("this is saturday")


    else:


    print("something else")


    ## Nested if Statements


    It is possible to nest one if statement inside another, like this:


    today = "thanksgiving"


    bank\_balance = 35000


    if today == "thanksgiving":


    if bank\_balance > 25000:


    print("go shopping")


    else:


    print("Do the gardening")


    else:


    print("standard working day")


