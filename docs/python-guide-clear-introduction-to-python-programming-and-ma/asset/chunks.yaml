    # Chapter Six: An Introduction to Data Science


    ![image](d2d_images/chapter_title_below.png)


    In the last few decades, the world has seen an explosion in big data, and that
    has led to a need for more efficient storage – a huge challenge to all businesses.
    The focus on making the best use of this data was to create frameworks capable
    of storing vast amounts of it, leading to Hadoop and other similar frameworks
    being built to help.


    With the storage problem solved, businesses then moved their focus to ways of
    processing that stored data, and that is where data science enters the picture,
    a way of processing data and analyzing it. These days, data science is built-in
    to all businesses that process vast data amounts, and data scientists are hired
    to turn that data into something meaningful.


    So, what is data science, and how is using it with Python so beneficial?


    ## What is Data Science?


    Let''s start by understanding what data science is. As a simple explanation, it
    is about finding data and exploring it in the real world, and then using what
    we learned to solve problems. A couple of examples of how businesses use data
    science are:


    *   Customer Prediction – based on current and past customer behavior, s system
    can be trained to predict how likely they are to purchase a certain item


    *   Service Planning – restaurants can predict the number of customers visiting
    their establishment on the weekend and ensure they have sufficient food to handle
    the numbers


    Before we delve deeper into data science with Python, let''s talk a little more
    about why you should use Python.


    Why Use Python?


    Data science requires a computer programming language to work and, although you
    could choose to use SAS or R, Python is far superior and better-equipped to handle
    it. As a programming language, Python has grown in popularity and is now used,
    not just in data science, but in artificial intelligence, IoT, and lots of other
    technologies, boosting its popularity even more.


    We use Python for data science, primarily because it contains some of the best
    and costliest tools from the statistical and mathematical perspectives. Other
    reasons include:


    *   Speed – Python is much faster than other comparable computer programming languages


    *   Availability – it contains lots of different packages, developed by other
    users, that are easily reusable


    *   Design Goal – Python has intuitive syntax, easy to understand, that helps
    us to build applications containing an easily readable codebase.


    You learned how to install Python in my last book, "Python Computer Programming
    - Simple Step-By-Step Introduction to the Python Object-Oriented Programming:
    Quick Start Guide for Beginners." So, now, we can look at some of the Python libraries
    designed for data science.


    Python Data Analysis Libraries


    Python is one of the easiest languages to learn, and there is quite a lot of basic
    stuff, such as printing statements, that you can already do with it off the bat.
    But, if you want to use Python for data science, you need to use different libraries,
    which must be imported into Python. Some of those libraries are:


    *   Pandas – useful for data operations that need to be structured


    *   NumPy – an incredibly powerful Python library for creating n-dimensional arrays


    *   SciPy – gives us the scientific capabilities needed for data analysis, such
    as the Fourier transform and linear algebra


    *   Matplotlib – used mainly for data visualization


    *   Scikit-learn – used for all activities in machine learning


    Those are the main libraries, but you may, at some point in your data science
    and machine learning journey, use these as well:


    *   TensorFlow


    *   Networks & I graph


    *   OS


    *   BeautifulSoup


    Let''s look at some of the primary libraries in more detail.


    SciPy


    The name kind of gives this one away, as a scientific library for Python, and
    it has a few special functions:


    *   Special functions, such as integration, gradient optimization, ordinary differential
    equation (ODE) solvers, and more are included


    *   It offers fully featured modules for linear algebra


    *   It is built on NumPy


    NumPy


    NumPy is the primary data science package for Python, containing:


    *   Tools to help you integrate Fortran, C, and C++ code


    *   Some of the most powerful N-dimensional array objects


    *   Useful capabilities for random numbers, Fourier transform and linear algebra


    Pandas


    Pandas is a useful library for the manipulation and operations on structured data.
    It is:


    *   The single most useful library in Python for data analysis


    *   Instrumental in ensuring Python is widely used in data science


    *   Extensively used for data preparation and data mugging


    Let''s delve a little deeper into using Pandas for exploratory analysis:


    Using Pandas for Exploratory Analysis


    This approach is used for analyzing large datasets, finding their main characteristics,
    and summarizing them. Visualization is used to help get valuable insights from
    the data.


    Two of the most common terms you will hear in conjunction with Pandas are:


    *   Series – a one-dimensional object, capable of taking any type of data, including
    floats, integers, and strings


    Here''s an example:


    import pandas as pd


    x = pd.Series(\[6, 3, 4, 6\])


    x


    0  6


    1  3


    2  4


    3  6


    dtype: int64'
