    \ | --- |\n\n![image](img/chapter_title_above.png)\n\n# 模块\n\n![image](img/chapter_title_below.png)\n\
    \nPython 语言中的模块是标准文件，能够存储类、变量、常量、函数等更多内容。我们使用它们来帮助保持相关代码更有条理、更易读。例如，`math` 模块包含了所有与数学相关的函数。\n\
    \n## 创建模块\n\n这非常简单。首先，创建一个新文件并保存为 `mymodule.py`。然后向其中添加以下代码：\n\n```python\nfoo\
    \ = 150\n\ndef hello():\n    print(\"我来自 mymodule.py\")\n```\n\n我们在这里做是在模块内部定义了一个名为\
    \ `foo` 的全局变量和一个名为 `hello()` 的函数。如果我们想在程序中使用这个模块怎么办？正如我之前向你展示的，你必须做的的第一件事是导入模块，我们使用\
    \ `import` 语句来实现：\n\n```python\nimport mymodule\n```\n\n现在可以使用模块中定义的函数和变量了，方法如下：\n\
    \n```python\nimport mymodule\nprint(mymodule.foo)\nprint(mymodule.hello())\n```\n\
    \n尝试一下，你应该会在屏幕上看到以下内容：\n150\n我来自 mymodule.py。\n\n不要忘记；要访问模块中的任何函数或变量，必须确保先指定模块名称；如果不这样做，将得到错误。\n\
    \n## 在 Import 中使用 From 语句\n\n当你使用 `import` 语句时，模块内部的所有内容都会被导入。但如果你只需要特定的变量或函数呢？那就是我们使用\
    \ `from` 语句的地方，例如：\n\n```python\nfrom mymodule import foo # 语句仅从 mymodule 导入名为\
    \ foo 的变量\nprint(foo)\n```\n\n输出应该是\n150\n\n注意：\n当你使用 `from` 语句时，不需要指定模块名称即可访问函数和变量。\n\
    \n## 使用 dir() 方法\n\n这是内置方法之一，用于查找对象的属性——可用的常量、函数、类和变量。你已经知道 Python 中的一切事物都是对象，因此我们使用以下语法来查找模块的属性：\n\
    \n```python\ndir(module_name)\n```\n\n`dir()` 方法将返回一个包含所有属性列表的字符串：\n\n```\n>>>\
    \ dir(mymodule)\n['__builtins__', '__cached__', '__doc__', '__file__', '__loader__',\
    \ '__name__', '__package__', '__spec__', 'foo', 'hello']\n```\n\n从这里你可以看到，除了 `foo`\
    \ 和 `hello`，还有其他属性出现在 `mymodule` 中。恭喜！你已经接近结尾了。在结束之前，我将为你提供一些技巧，帮助你理清优先顺序。\n\n"
