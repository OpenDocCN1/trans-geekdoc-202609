    ## Data Types


    There are five main data types in Python:


    *   Number


    *   List


    *   String


    *   Dictionary


    *   Tuple


    But there is a sixth, the Boolean type, which has two values or literals – True
    and False – but other values are false too:


    *   0 – zero


    *   0.0


    *   \[\] – an empty list


    *   () – an empty tuple


    *   {} – an empty dictionary


    *   None


    ## Receiving An Input from The Console


    We use the input() function for this, and the syntax is:


    input(\[prompt\]) -> string


    The function will take an optional argument of string type; the argument is called
    prompt, and the output is a string.


    For example:


    name = input("Input your name: ")


    print(name)


    And the output will be whatever you typed in as your name


    It is worth noting that, even if you input a number, input() will only return
    a string. If you wanted a number output, you would need to use either the eval()
    or int() functions.


    For example:


    age = int(input("Enter your age: "))


    print(age)


    print(type(age))


    Again, the output is whatever you typed in.


    ## Importing a Module


    Code organization in Python is done using modules, and there are quite a few already
    built-in. These include:


    *   The math module for all math-related functions


    *   The re module for regular expressions


    *   The os module for functions related to the operating system


    And many more.


    Using a module is simple enough, but it must be imported. We do this with the
    import statement, like this:


    import module\_name


    And we use slightly different syntax to import multiple modules at once:


    import module\_name\_1, module\_name\_2


    Try this example:


    \>>> import math, os


    \>>>


    \>>> math.pi


    3.141592653589793


    \>>>


    \>>> math.e


    2.718281828459045


    \>>>


    \>>>


    \>>> os.getcwd()  # print the current working directory


    \>>> ''/home/user''


    \>>>


    And the output should be:


    3.141592653589793


    2.718281828459045


    /box


    The first line of the code is importing all the classes, functions, constants,
    and variables, the os and math modules define. Accessing an object in a module
    requires the module name, a dot, and the object name – it could be a class, a
    constant, a function, or a variable. In our example, we want to access pi and
    e – these are common constants from the math module. Next, we call a function
    called getcwd() from the os module and this prints our current working directory.


    Got all that?


    Then we’ll move onto numbers.


