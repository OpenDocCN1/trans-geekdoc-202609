    # Beginner Tips for Learning Python


    ![image](d2d_images/chapter_title_below.png)


    It is so exciting that you have chosen Python as your preferred computer programming
    language and, while I could tell you to go through this book over and again to
    learn the concepts, there are other ways to learn Python and become proficient
    in it.


    The first step is in understanding how you should learn and is arguably the most
    crucial skill. Why do you need to understand this? Because as Python continues
    to evolve, more libraries get created, and the Python tools receive upgrades.
    If you don’t know how to learn, you can’t keep up with all the changes and, if
    you cant do that, you have no chance of being successful.


    That’s why I want to give you these beginner tips, strategies that help you get
    your priorities straight and put you on the right path:


    1.  Write Code Every Single Day


    The most important thing when you are learning to write code is consistency, and
    that is why you should commit to writing some code every day. You might not believe
    it, but there is one thing that has a significant effect on computer programming
    – muscle memory – and committing yourself to write a set amount of code each day
    will help that memory to develop. Try to start off writing for 20-30 minutes per
    day, even if it is the same thing over and again, and gradually build your time
    up.


    1.  Take Notes and Write Your Code Out


    As with anything you are learning, it is crucial to take notes on your programming
    journey. It might interest you to know that writing notes by hand also makes it
    more likely that you will remember things, ideal for those who are planning a
    career as a developer – note – many developer interviews require you to write
    code in longhand on a whiteboard!


    As you start to work on programs and projects, you will find it helpful to write
    your code out longhand. Not only will that help you to remember it and understand
    it, but it also helps you plan the code before you input it. It can save you a
    lot of time and heartache if you write out the classes and the functions you need
    and their interactions with one another.


    1.  Time to Get Interactive


    It doesn’t matter what part of Python you are learning, be it basic structures
    or how to debug a program, one of the best tools you can use to learn is the interactive
    shell. You will sometimes see this as the REPL and, to use it, open a terminal
    and run Python.


    Have a look at a few ways you can use it to learn the Python language:


    Learn how to use the dir() method to perform operations on elements:


    \>>>


    \>>> my\_string = ''This is a string''


    \>>> dir(my\_string)'
