    # Python Tuples


    ![image](d2d_images/chapter_title_below.png)


    Tuples are much like lists, but with one difference – they are immutable. Once
    you have created a tuple, you cannot add to it, delete anything from it, modify,
    replace or even change the order of the items.


    ## Creating A Tuple


    Creating a tuple is done like this:


    \>>> t1 = () # create empty tuple without data


    \>>>


    \>>> t2 = (44, 55, 66)


    \>>>


    \>>> t3 = tuple(\[5, 6, 7, 8, 8\]) # tuple created from array


    \>>>


    \>>> t4 = tuple("abc") # tuple created from string


    ## Tuples Functions


    You can also use other functions with tuples, such as len(), min(), max(), and
    sum():


    \>>> t1 = (2, 15, 66, 15, 90)


    \>>> min(t1)


    1


    \>>> max(t1)


    81


    \>>> sum(t1)


    161


    \>>> len(t1)


    5


    ## Iterating Through Tuples


    You can iterate over tuples with a for loop – more about these later:


    \>>> t = (44, 55, 66, 77, 88)


    \>>> for i in t:


    ...  print(i, end=" ")


    \>>> 44 55 66 77


    ## Slicing Tuples


    The slicing operators work the same on a tuple as they do on a string or a list:


    \>>> t = (44, 55, 66, 77, 88)


    \>>> t\[0:2\]


    (44, 55)


    ## In And Not In Operator


    The in and the not in operators may be used to check if items exist in tuples:


    \>>> t = (44, 55, 66, 77, 88)


    \>>> 55 in t


    True


    \>>> 55 not in t


    False


