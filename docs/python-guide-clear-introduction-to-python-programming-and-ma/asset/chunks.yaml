    All Python expressions are evaluated using something called operator precedence.
    This means that the operators are evaluated in a certain order. Here’s an example:


    \>>> 5 \* 5 + 2


    Which one is evaluated first - + or \*? This should be relatively easy to work
    out if you remember your math lessons. To help you out, the list below is the
    Python operators in order of precedence – this is all the operators, not just
    the mathematical operators so don’t worry if you don’t understand them all right
    now:


    Operator   Description


