    Step Five – Evaluating Some  Algorithms


    The next step is to create some data models, estimating how accurate they are
    when provided with unseen data.


    We''ll cover:


    1.  How to separate a dataset for validation


    2.  How to set up a test-harness that uses a technique called 10-fold cross-validation


    3.  How to build several models that use flower measurements to predict the species


    4.  How to choose the best model


    Creating the Validation Dataset


    It''s important to know that our model is working well. Later, we''ll be using
    some statistical methods as a way of estimating how accurate our models are on
    unseen data and we''ll also want a strong estimate of how accurate the best model
    is on the unseen data – we can only do that by giving it real unseen data and
    evaluating how accurate it is.


    What that means is we need to hold a section of our dataset back, not letting
    the algorithms see it, and then we can use it as the unseen data that will independently
    confirm whether the best model is accurate or not.


    To do this, our dataset needs to be separated into two subsets – 80% of the data
    for training, evaluation and selection, and the remaining 20% to validate the
    model. Here''s the command to do that:


    We need to know that the model we created is good.


    \# Split-out validation dataset


    array = dataset.values


    X = array\[:,0:4\]


    y = array\[:,4\]


    X\_train, X\_validation, Y\_train, Y\_validation = train\_test\_split(X, y, test\_size=0.20,
    random\_state=1)


    We have now got two sets – the training data is split into X\_train and Y\_train
    for model preparation and we also have X\_validation and Y\_validation for use
    later on.


    You might have notices that a Python slice was used for choosing the NumPy array
    columns. If you have a basic understanding of Python, which you should have for
    this book, then you will have come across slicing before.


    Creating the Test-Harness


    We want to estimate how accurate the model is, and, to do that, we will make use
    of stratified 10-fold cross-validation. This will result in the dataset between
    split down into ten parts. We''ll use nine of them for training and one for testing;
    then, we''ll repeat for every different combination there is for training and
    testing splits.


    By stratified, I mean that each split (fold) of the original dataset will try
    to have an identical distribution class examples that the original, whole dataset
    has.


    The random seed is set to a fixed number using the argument of random\_state.
    This will make sure that the algorithms are all evaluated using the same training
    dataset split. It doesn''t matter what the specific random seed is, so long as
    they all use it.'
