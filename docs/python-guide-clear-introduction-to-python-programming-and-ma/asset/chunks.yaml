    # Chapter Two: Regression Machine Learning Models


    ![image](d2d_images/chapter_title_below.png)


    We looked at regression briefly in the first chapter, but what exactly is? Regression
    is a technique that examines variables, looking for relationships between them.
    As an example, you could look at a handful of employees from a large company and
    see if you could work out how their salaries were dependent on certain features,
    such as education, experience, where they work, their role, and so on.


    That is a regression problem; individual pieces of data relating to each employee
    are one observation, and there is a presumption that the independent features
    are the education, experience, role, and where they work (city), while the salary
    is the dependent feature.


    In a similar fashion, you could try to determine how house prices were mathematically
    dependent on where they are, how many bedrooms, how close to the city center they
    are, and so on.


    Typically, when we do regression analysis, we are looking at a specific point
    of interest together with multiple observations. Every observation has at least
    two features and, if we assume that one or more of those features is dependent
    on the other, we can try to find a relationship between them.


    In simpler terms, we need a function that can sufficiently map some variables
    or features to others.


    Dependent features are also known as outputs, dependent variables, or responses,
    while the independent features are known as inputs, independent variables, or
    predictors.


    Usually, a regression problem consists of one independent variable that is unbounded
    and continuous. The dependent variables may be discrete, continuous, or categorical,
    such as nationality, gender, brand, etc.


    Common practice dictates that the outputs are denoted with a y, and the inputs
    are denoted with an x. If there are two independent variables (or more), the vector,
    x = (𝑥₁, ..., 𝑥ᵣ), with r being the number of inputs, is used to represent them.


    ## When is Regression Required?


    Regression is typically used to answer how or if a phenomenon influences another
    one or if there is a relationship between multiple variables. As an example, it
    could be used for determining if gender or experience have an impact on salary
    and, if yes, to what extent.


    Regression is also good for forecasting responses based on a set of new predictors,
    such as predicting a household''s electricity consumption for the hour ahead,
    given the time of day, the external temperature, and how many people live there.


    Regression is used in several fields, including computer science, economy, and
    social sciences, to name a few. As each day passes, it grows in importance as
    the amount of available data grows, and we have a better awareness of the value
    of that data in practical terms. 


    ## Different Types of Regression Techniques


    There are a few regression techniques that can be used for making predictions
    and are driven by three primary metrics. They are:


    *   How many independent variables there are


    *   What type the independent variables


    *   What shape the regression line is


    We''ll look at some of those techniques now.


    Linear Regression


    This is the commonest regression technique and is typically the first one learned
    for predictive modeling. With linear regression, we have a continuous dependent
    variable, continuous or discrete independent variables, and a linear regression
    line.


    The equation used to represent linear regression is Y=a+b\*X + e. To break this
    down:


    *   a is the intercept


    *   b is the line slope


    *   e is the error term.


    We can use the equation for predicting a target variable''s value, based on supplied
    predictor variables.


    Linear regression comes in two flavors – simple and multiple.  The only difference
    between the two is in the number of independent variables – simple has just one,
    while multiple linear regression has more than one.'
