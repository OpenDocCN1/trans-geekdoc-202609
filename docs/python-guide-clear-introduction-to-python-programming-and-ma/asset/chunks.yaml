    \ and, if that's what makes you happy,  go for it. Just be aware that AI is just\
    \ a buzzword, albeit a huge one, and it can mean whatever you want it to mean.\n\
    \n2.  Machine Learning is All About Data and Partly About Algorithms. There is\
    \ definitely an increase in excitement levels about the huge leaps and bounds\
    \ being made in machine learning, specifically in the algorithms and deep learning.\
    \ But the key thing to remember with machine learning is that it's all about data;\
    \ that is the primary ingredient, and, without it, you simply can't do any machine\
    \ learning. You don't need sophisticated or complex algorithms to learn, but you\
    \ do need quality data. \n\n3.  Don't Use Complicated Models Unless You Have Vast\
    \ Amounts of Data. Machine learning finds patterns that exist in data and then\
    \ uses them to train the machine learning models, using specified parameters.\
    \ If you have too large a parameter space, your training data will be overfitted,\
    \ and the model you are training will not have the ability to generalize beyond\
    \ that. In general, keep things a simple as you can, and that means matching your\
    \ models to the level and complexity of data you are working with."
