    # Python Strings


    ![image](d2d_images/chapter_title_below.png)


    Python strings are a series of adjacent characters with single or double quotation
    marks as delimiters. There is no specific data type in Python for characters;
    instead, a character string represents them.


    ## Creating Strings


    Here’s how to create a string in Python:


    \>>> name = "thomas" # a string


    \>>> mychar = ''a'' # a character


    This syntax may be used for string creation too:


    \>>> name1 = str() # this creates empty string objects


    \>>> name2 = str("newstring") # string object with ''newstring''


    Try this example:


    name = "thomas" # a string


    mychar = ''a'' # a character


    print(name)


    print(mychar)


    name1 = str() # this creates empty string objects


    name2 = str("newstring") # string object with ''newstring''


    print(name1)


    print(name2)


    And you should see the following on your screen:


    Python Strings are Immutable


    What does this mean? It means that you cannot modify a string once you have created
    it. Here’s an example:


    \>>> str1 = "good day"


    \>>> str2 = "good day"


    In this example, str1 and str 2 are both referring to one string object of “good
    day,” stored somewhere in memory. An easy way to test if both are referring to
    one object is by using a function called id(). We can use this function to get
    the memory address or location of any object stored in memory.


    For example:


    \>>> id(str1)


    78965432


    \>>> id(str2)


    78965432


    Both objects point to the same location, so both point to the same object.


    What about if we tried modifying the str1 object? Let’s try to add another string
    to it:


    \>>> str1 += " michael"


    \>>> str1


    good day michael


    \>>> id(str1)


    \>>> 78964597


    Now, str1 is pointing to a different location in memory, proving that concatenation
    does not modify existing string objects; instead, a new string object gets created.
    Another immutable type is int.


    Try this example:


    str1 = "good day"


    str2 = "good day"


    print(id(str1),  id(str2))


    str1 += " michael"


    print(str1)


    print(id(str1))


    The result is:


    140425297247904 140425297247904


    Good day michael


    140425297288304


    ## String Operations


    In Python, indexing begins at 0. Accessing the first character in any string is
    this:


    \>>> name\[0\] #


    t


    Try it for yourself:


    name = "thomas"


    print(name\[0\])


    print(name\[1\])


    ​


    You should see this on your screen:


    t


    h


    Two more operations you can do on a string is concatenation (+) and repetition
    (\*), Here’s an example:


    The + operator is used to concatenate string and \* operator is a repetition operator
    for string.


    \>>> s = "thomas and " + "friends"


    \>>> print(s)


    The result is:


    thomas and friends


    And another example:


    \>>> s = "pork is delicious " \* 3


    \>>> print(s)


    The result is:


    ''pork is delicious pork is delicious pork is delicious.''


    Try it for yourself:


    s = "thomas and " + "friends"


    print(s)


    s = "pork is delicious " \* 3


    print(s)


    The result is


    thomas and friends


    pork is delicious pork is delicious pork is delicious


    ## Slicing Strings


    Slicing is an operation that takes part of a string from another one, and the
    operator is \[\]. The syntax is


    s\[start:end\]'
