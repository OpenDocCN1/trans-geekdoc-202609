    # 第一章：机器学习概述


    ![image](img/chapter_title_below.png)


    在我们深入机器学习模型之前，我们应该后退一步，学习机器学习到底是什么，以及不是什么。它通常被认为是人工智能的一个子领域，但这种说法有点误导性。诚然，机器学习源于人工智能研究，但从数据科学的角度来说，将机器学习视为一种构建充满数据的模型的方法更好。


    简单来说，机器学习都是关于数学模型的，这些模型建立是为了帮助我们理解数据。机器学习的“学习”部分体现在我们为模型提供适应观测数据的参数时。首先，向模型展示一组特定的数据，从这些数据中，它们可以学习对以前未见过的数据进行识别、分类和预测。这是一种简单的解释方法，当你读到本章末尾时，你会有更深入的。基本上，机器的学习方式与人类大脑的学习方式相似。


    了解它的本质是一回事；而将其放在特定的视角下来看是另一回事，正确使用机器学习模型的关键点之一是理解它们可以处理的问题类型。所以，让我们从几个分类开始来解释这些内容。


    ## 机器学习分类


    在最基础的，我们可以将机器学习分为两大类：监督学习和无监督学习。


    监督学习围绕已测量的数据特征及其与相关标签之间的关系展开。当一个监督学习模型构建并训练完成后，它就可以被用来标记它以前没见过的新数据。我们可以将监督学习进一步分为回归和分类任务。你稍将更深入地学习这些内容，但现在，分类标签是离散的类别，而在回归中，标签是连续的数值。你很快就会看到这些示例。


    无监督学习处理的是无标签的数据，包括降维和聚类等任务。降维算法寻找后续的数据表示，而聚类算法则识别不同的数据组。同样地，你很快就会看到这些示例。


    还有半监督模型，正如你所猜的那样，它们介于两者之间。当数据标签不完整时，往往会使用这些模型。


    ## 机器学习应用示例


    让我们通过观察一些任务示例来让这些概念更加具体。这些示例旨在让你对我们将要研究的不同类型任务有一个基本的概述；稍后，我们将进行深入探讨。


    所有图片均归属于 [`jakevdp.github.io/`](https://jakevdp.github.io/)


    ### 分类：预测离散标签


    首先是一个分类任务。在这里，你有一些标记点，我们想用它们对无标记点进行分类。假设我们拥有的数据如下：


    ![image](img/image019.png)


    数据是二维的，这意味着每个点有两个特征。这些点的 `x, y` 位置代表平面上的特征。每个点还具有两个可能的类别标签之一，通过点的颜色来指示。我们想使用这些标签和特征来构建一个模型，以预测新点应该被赋予“蓝色”还是“红色”标签。


    像这样的分类任务可以使用几种不同的模型来完成，但我们将使用一个简单的模型。我们假设可以在平面上在这些组之间画一条简单的直线将它们隔开；通过这样，直线两边的点就属于同一组。参数是指示线条位置及其取向的数字。模型将通过一个被称为“训练”的过程从数据中学习参数的最优值。


    在下一张图片中，你可以看到训练后的模型像什么样：


    ![image](img/image004.png)


    一旦模型训练完成，我们就可以将其推广到没有标签的新数据上。简单来说，我们在新数据上绘制模型，并根据该模型分配标签。这被称为“预测”。


    ![image](img/image000.png)


    这让你对分类任务如何运作有了初步了解，分类表明数据的类别标签是离散的。初看看起来很简单；你会很容易查看数据并对其分类，但机器学习提供了一个简单的益处——我们可以将其推广到巨大的数据集。


    作为一个例子，考虑一个检测垃圾邮件的机器学习任务。我们可能有这些标签和特征：


    *   `特征 1`、`特征 2`等 – 识别垃圾邮件重要的词汇和短语的归一化计数，例如`尼利亚王子`、`万达`等。

    *   `标签` – 垃圾邮件或非垃圾邮件


    在训练集中，我们可以通过逐一检查邮件来确定标签，对于剩下的邮件，模型将决定应用哪个标签。如果分类算法通过良好构建和定义的特征经过充分训练，这可以是一种有效的方法。


    ### 回归：预测连续标签


    相比之下，回归任务使用连续数值作为标签。看看下一张图片，它显示了一组点，每个点都有一个连续标签。


    ![image](img/image014.png)


    正如你在分类中所看到的，数据是二维的，每个数据点有两个特征。颜色指示点的连续标签。我们可以为此选择任意数量的回归模型，我们将使用线性回归对点进行预测。模型假设，如果将标签视为第三个空间维度，则可以拟合数据。


    这可以可视化为：


    ![image](img/image016.png)


    `特征 1-特征 2` 的平面与之前的图表相同，但这次，标签是使用三维轴位置和颜色来表示的。通过拟合数据来对任何输入参数预测标签似乎是不合理的。然而，使用二维数据，我们将得到以下结果：


    '
- fmt: '

    ![image](d2d_images/image022.png)


    This plane provides exactly what is needed for predicting labels on new points.
    In visual terms, the results would look like this:


    ![image](d2d_images/image023.png)


    Again, this may appear trivial when the number of dimensions is low, but these
    methods are powerful, in that we can apply them in a straightforward manner, and
    evaluate them on data with multiple features.


    We could liken this to a task that computes how far away galaxies are when we
    look at them through a telescope, and the following labels and features can be
    used:


    *   `Feature 1-feature 2` – how bright each galaxy is at a given color or wavelength

    *   `Label` – the galaxy''s redshift or distance


    We could use a more expensive independent observation set to determine the distance
    for a few galaxies and then estimate the remaining distances using a regression
    model. Doing this, we would not need to use the original expensive observation
    over the dataset.


    ## Clustering: Inferring the Labels on Unlabeled Data


    We''ve just looked at two supervised learning examples; regression and classification.
    We tried to build models to predict the labels on new, unseen data, but unsupervised
    learning requires us to build models that don''t have known labels to learn from
    and are, in effect, making blind predictions.


    Clustering is the most common method, whereby a specific number of discrete groups
    are assigned with data automatically. The next image shows two-dimensional data:


    ![image](d2d_images/image013.png)


    Just by looking, you can see the distinct groups of points, and, using that input,
    clustering models will use the data structure to work out the related points.
    The next figure shows the result of using the `k-means` algorithm:


    ![image](d2d_images/image015.png)


    The `k-means` algorithm is used for fitting models that have `k` cluster centers.
    It is assumed that the optimal centers are those that minimize how far each point
    is from the center assigned to it. Again, with two-dimensional data, this probably
    seems trivial, and as we get larger data, more complex, clustering algorithms
    become useful for extracting information from the data.


    ## Dimensionality Reduction: Inferring the Structure of Unlabeled Data


    Our final example is another unsupervised algorithm called dimensionality reduction.
    This algorithm infers information, such as labels, from the dataset structure.
    It is somewhat abstract, compared to the other examples, but it is useful for
    pulling out low-dimensional data representations that, in some way, maintain the
    entire dataset''s qualities.


    Have a look at the example below:


    ![image](d2d_images/image020.png)


    You can see that the data has a kind of structure; a one-dimensional line in a
    spiral has been drawn in the two-dimensional space. In a way, we could say that
    we have one-dimensional data, even though it is higher-dimension space. In this
    case, the right model would have a sensitivity to this embedded structure, which
    is nonlinear, and would easily pull the representation out.


    You can see the results from a manifold learning algorithm called `Isomap` below:


    ![image](d2d_images/image017.png)


    The colors are representing the one-dimensional latent variable that was extracted;
    the change along the spiral is uniform, indicating the algorithm detected the
    structure we saw above. As with the other examples, the higher the dimension,
    the more powerful the algorithm. If, for example, we may want important relationships
    in a dataset with 100 or 1000 features visualized. It becomes challenging when
    we work with -dimensional data, and using dimensionality reduction is one way
    of reducing the data down by several dimensions and making it easier to manage.


    That ends this brief discussion on machine learning, with a few examples to make
    it clearer, and now it’s time to go in-depth. We''ll start with Regression.


