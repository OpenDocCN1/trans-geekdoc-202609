  trans: "\n通过继承，可以访问所有的方法和数据字段，并能够添加自己的字段和方法。通过这种方式，继承允许我们更好地组织代码，而无需重新编写所有内容。\n\n\
    例如，如果类 `X` 继承类 `Y`，那么 `Y` 就是基类或超类（也称为父类），而 `X` 就是派生类或子类（也称为子类）。子类可能只能访问公共方法和数据字段；私有成员只能在类内部访问。\n\
    \n创建子类使用以下语法：\n\n```python\nclass SubClass(SuperClass):\n    # 数据字段\n    # 实例方法\n\
    ```\n\n这里是一个其工作原理的示例：\n\n```python\nclass Vehicle:\n    def __init__(self, name,\
    \ color):\n        self.__name = name  # __name 是 Vehicle 类的私有\n        self.__color\
    \ = color\n\n    def getColor(self):  # Car 类可以访问 getColor() 函数\n        return\
    \ self.__color\n\n    def setColor(self, color):  # setColor 可以在类外访问\n       \
    \ self.__color = color\n\n    def getName(self):  # getName() 可以在类外访问\n      \
    \  return self.__name\n\nclass Car(Vehicle):\n    def __init__(self, name, color,\
    \ model):\n        # 通过调用父类构造函数设置名称和颜色\n        super().__init__(name, color)\
    \ \n        self.__model = model\n\n    def getDescription(self):\n        return\
    \ self.getName() + self.__model + \" in \" + self.getColor() + \" color\"\n\n\
    \    # 在 getDescription() 方法中，可以调用 getColor() 和 getName()是因为\n    # 继承使得子类可以访问它们\n\
    \nc = Car(\"Toyota Camry\", \"blue\", \"XLE\")\nprint(c.getDescription())\nprint(c.getName())\
    \ # car 没有 getName() 方法，但可以通过 Vehicle 类访问\n```\n\n我们期望看到如下输出：\n\n```\nToyota Camry\
    \ XLE in blue\nToyota Camry\n```\n\n我们在这里创建了一个名为 `Vehicle` 的基类和一个名为 `Car` 的子类。我们没有在\
    \ `Car` 类中定义 `getName()` 方法，但我们仍然可以访问它；这是因为 `Car` 类从 `Vehicle` 继承了 `getName()`。我们使用了\
    \ `super()` 方法来调用基类方法。\n\n### super() 是如何工作的？\n\n假设你有一个名为 `getInformation()` 的方法。它在基类中，你想从子类中调用它。通过以下代码可以实现这一点：\n\
    \n```python\nsuper().get_information()\n```\n\n或者，可以在子类的构造函数中调用基类构造函数，代码如下：\n\n\
    ```python\nsuper().__init__()\n```\n\n## 多重继承\n\n与其他语言不同，Python 允许多重继承。这意味着同时继承多个类。实现方式如下：\n\
    \n```python\nclass Subclass(SuperClass1, SuperClass2, ...):\n    # 初始化器\n    #\
    \ 方法\n```\n\n这里是一个多重继承的示例：\n\n```python\nclass MySuperClass1():\n    def method_super1(self):\n\
    \        print(\"method_super1 method called\")\n\nclass MySuperClass2():\n  \
    \  def method_super2(self):\n        print(\"method_super2 method called\")\n\n\
    class ChildClass(MySuperClass1, MySuperClass2):\n    def child_method(self):\n\
    \        print(\"child method\")\n\nc = ChildClass()\nc.method_super1()\nc.method_super2()\n\
    ```\n\n作为输出，你应该能看到：\n\n```\nmethod_super1 method called\nmethod_super2 method\
    \ called\n```\n\n在这里你可以看到 `MySuperClass1` 和 `MysSuperClass2` 被 `ChildClass` 继承，`ChildClass`\
    \ 对象现在可以访问 `method_super1()` 和 `method_super2()`。\n\n## 方法重写\n\n重写基类方法需要子类定义另一个相同签名的方法——即与基类方法具有相同的名称和参数数量。这里有一个示例：\n\
    \n```python\nclass A():\n    def __init__(self):\n        self.__x = 1\n    def\
    \ m2(self):\n        print(\"m2 from B\")\n\nclass C(B):\n    def __init__(self):\n\
