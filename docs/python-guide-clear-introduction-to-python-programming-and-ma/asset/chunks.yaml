    The last part of that code is a URL, and if you opened it, you would see nothing
    but code. This script is written in Ruby, telling your computer how to install
    Homebrew. The curl bit is one of the command-line tools, this one transferring
    files by using their URL and -fsSL is four flags, options that tell curl how the
