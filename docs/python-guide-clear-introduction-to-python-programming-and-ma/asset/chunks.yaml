    wrangling）来处理，以便我们对数据进行归一化和标准化。


    让我们看看使用 `Pandas` 进行数据清洗。


    ## 使用 Pandas 进行数据清洗


    数据清洗（Data wrangling）是用于描述清理和统一复杂的、某种杂乱的数据集的术语。这些是数据清洗的主要处：


    *   它可以告诉你许多关于你的数据的信息

    *   它可以帮助你做出更好的业务决策

    *   帮助收集对业务有意义的精确数据


    在现实世界中，业务产生几乎所有数据都是杂乱的，并且会有缺失值。以贷款数据集为例，某些列缺少了一些值。


    要检查你的数据中是否存在缺失值：


    ![missing value](img/image003.jpg)


    https://www.simplilearn.com/


    我们可以通过几种不同的方式填充缺失值，业务场景将决定你使用哪些参数来填充它们。


    例如，你可以使用指定列的平均值来替换值：


    ![mean](img/image007.jpg)


    https://www.simplilearn.com/


    或者你可以使用 `dtypes` 来查看每列的数据类型：


    ![image](img/image024.jpg)


    https://www.simplilearn.com/


    你甚至可以合并数据框并通过 `merge` 和 `concatenation` 方法将它们合并。


    是时候构建模型了，为了此，我们将使用 `Scikit-learn`。


    ## 构建模型


    注意，在本节中混合了编写的代码和图像（感谢来自 [`www.simplilearn.com/`](https://www.simplilearn.com/)）。请同等对待它们；如果你正在按照此操作并在
    Python 中输入命令，只需输入你在图像上看到的内容。


    1. 首先，我们需要从 `scikit-learn` 导入几个模型：


    # 从 scikit-learn 模块导入模型：


    ```python

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import KFold

    from sklearn.ensemble import RandomForest

    from sklearn.tree import DecisionTreeClassifier

    from sklearn import metrics

    ```


    2. 接下来，需要从此处提取因变量和自变量：


    ```python

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import KFold

    from sklearn.ensemble import RandomForest

    from sklearn.tree import DecisionTreeClassifier

    from sklearn import metrics


    # 提取自变量

    X = df.iloc[:, :-1]

    # 提取因变量

    y = df.iloc[:, -1]

    ```


    3. 现在将数据集划分为训练集和测试集：


    ```python

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import KFold

    from sklearn.ensemble import RandomForest

    from sklearn.tree import DecisionTreeClassifier

    from sklearn import metrics


    # 将数据集划分为训练和测试集

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=0)

    ```


    4. 我们使用特征缩放对数据进行标准化：


    ```python

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import KFold

    from sklearn.ensemble import RandomForest

    from sklearn.tree import DecisionTreeClassifier

    from sklearn import metrics


    # 使用缩放标准化数据

    sc = StandardScaler()

    X_train = sc.fit_transform(X_train)

    X_test = sc.transform(X_test)

    ```


    5. 然后我们对数据拟合模型：


    ```python

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import KFold

    from sklearn.ensemble import RandomForest

    from sklearn.tree import DecisionTreeClassifier

    from sklearn import metrics


    # 拟合模型

    model = LogisticRegression()

    model.fit(X_train, y_train)

    ```


    6. 然后预测测试集：


    ```python

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import KFold

    from sklearn.ensemble import RandomForest

    from sklearn.tree import DecisionTreeClassifier

    from sklearn import metrics


    # 预测测试集

    y_pred = model.predict(X_test)

    ```


    7. 构建混淆矩阵来评估模型性能：


    ```python

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import KFold

    from sklearn.ensemble import RandomForest

    from sklearn.tree import DecisionTreeClassifier

    from sklearn import metrics


    # 构建混淆矩阵评估模型性能

    cm = confusion_matrix(y_test, y_pred)

    print(cm)

    ```


    8. 模型准确率如何？


    ```python

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import KFold

    from sklearn.ensemble import RandomForest

    from sklearn.tree import DecisionTreeClassifier

    from sklearn import metrics


    # 模型准确率如何

    acc = accuracy_score(y_test, y_pred)

    print(acc)

    ```


    9. 预测为“是”的精确率：


    ```python

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import KFold

    from sklearn.ensemble import RandomForest

    from sklearn.tree import DecisionTreeClassifier

    from sklearn import metrics


    # 预测为“是”的精确率

    prec = precision_score(y_test, y_pred)

    print(prec)

    ```


    10. 最后，我们查找准确率：


    ```python

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import KFold

    from sklearn.ensemble import RandomForest

    from sklearn.tree import DecisionTreeClassifier

    from sklearn import metrics


    # 最后，查找准确率

    acc = accuracy_score(y_test, y_pred)

    print(acc)

    ```


