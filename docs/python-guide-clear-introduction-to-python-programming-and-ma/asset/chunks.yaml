    We all have to start somewhere, and this is the first step on the ladder to data
    science. Not only do you learn the basics of the `Python` language, but you also
    get an introduction to data science. One of the most important tools you need
    is the `Jupyter Notebook`, built-in to the `Python` libraries, and ideal to help
    you learn everything you need.


    ## Kickstart your Learning


    Join a community. When you do that, you put yourself with other like-minded people;
    not only does that give you a helping hand you need, you also increase your opportunities
    for future employment. The Society for Human Resource Management says that around
    30% of hires come via employee referrals.


    Create an account with `Kaggle`, take part in the `Dataquest Slack` discussions
    for members only, and join local `Meetup` groups in your area.


    ### Related Skills


    The command-line interface, or `CLI`, allows quicker running of scripts, which
    means you can test your programs quicker and works with a whole lot more data.


    ## Step 2: Do Some Small Python Projects


    Hands-on learning is absolutely the best way to learn; the sooner you start, the
    sooner you will be ready to start building your own `Python` projects. Try small
    things first, perhaps a calculator for a game played online, or a program that
    pulls the weather data from `Google` for your area. When you build small projects
    like this, you learn `Python` much quicker. Small projects like these are pretty
    standard for most programming languages and are one of the best ways to ensure
    your learning.


    Build up your experience using `APIs` and start doing some web scraping. As well
    as helping you learn how to program this helps you to understand what''s involved
    in gathering data.


    ### Kickstart your Learning


    By reading blog posts, guidebooks, open-source code, anything, you can get your
    hands on. Pick up new ideas, cement your own learning, and see how other people
    do it.


    ### Related Skills


    So some work with SQL databases. `SQL` talks to databases, altering them, editing
    them, and reorganizing the data. It is one of the hard and fast data science staples,
    and more than 40% of data scientists use it regularly.


    ## Step 3: Learn the Python Data Science Libraries


    Not all programming languages provide you with a ''best way'' to do something,
    but `Python` does, in the form of data science libraries. Three of the best are
    `Matplotlib`, `NumPy` and `Pandas`. The latter two are a fantastic way to explore
    data and play around with it, while `Matplotlib` helps you create visualizations
    of your data, in the form of graphs.


    ### Kickstart your Learning


    Ask questions. Lots of questions. `Python` is backed up by a huge community of
    developers and experts, and all are ready and willing to answer your questions
    and help you learn. There are also plenty of other useful resources, like `Dataquest''s
    Slack`, `Quora`, `Stack Overflow`, and many more, all filled with people just
    waiting to help you and share their own hard-earned knowledge.


    ### Related Skills


    Learn how to use `Git` for controlling code versions. It is one of the most popular
    tools to track your code changes; that means you can easily correct mistakes,
    do some experimenting, and collaborate with other like-minded people.


    ## Step 4: As You Learn Python, Build Up a Data Science Portfolio


    This is an absolute must for anyone who wants to become a data scientist. Many
    data science projects have multiple datasets and should give you lots of interesting
    insights. You don''t need a theme of any sort for your portfolio, simply choose
    the datasets you have an interest in and work out ways of bringing them together.


    If you display such projects, you are providing others with something they can
    collaborate on, and it shows any potential employer that you''ve put the time
    and effort in to learn `Python` and some other skills in programming.


    Plus, your portfolio can act as a kind of resume, and it highlights all the skills
    you learned in your journey.


    ### Kickstart your Learning


    Communicate with others, collaborate, and keep your focus firmly on technical
    competence. Make sure you use the time to cultivate all the soft skills you need
    to work with other people and, importantly, make sure you understand how the tools
    you use work.


    ### Related Skills


    Learn beginner statistics and move on to intermediate. It''s a good idea to get
    a decent background on statistics when you are learning `Python` for data science.
    It will give you the right mindset to ensure you focus on the right stuff, ensuring
    you will find real solutions and good insights instead of just repetitively executing
    scripts.


    ## Step 5: Apply Some Advanced Techniques in Data Science


    The last step is to sharpen your skill. Your entire journey is going to be packed
    with learning, but, once you have the basics down, look into taking an advanced
    course, just to make sure you covered everything.


    There are certain things you need to be comfortable with – classification, `regression`,
    `k-means`, and many other models. You can also look at learning how to bootstrap
    a model or how to use `scikit learn` to build a neural network.


    At this point in your learning, you can take on projects like creating a model
    to use a live data feed, or something as complex as that.


    ## REMEMBER


    Keep on learning. The data science field never stops growing, and it covers hundreds
    of industries. Demand is increasing at such a rate that there are plenty of learning
    opportunities. Don''t stop reading, don''t stop collaborating and definitely don''t
    stop talking to others. That way, you keep your hand in, and you keep up with
    an ever-changing field.


