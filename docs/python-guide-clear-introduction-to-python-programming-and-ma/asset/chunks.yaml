    \n在 Python 中，创建一个文件并命名为 `NegativeAgeException.py`。向其中添加以下代码：\n\n```python\nclass\
    \ NegativeAgeException(RuntimeError):\n    def __init__(self, age):\n        super().__init__()\n\
    \        self.age = age\n```\n\n这段代码的作用是创建另一个异常类并将其命名为 `NegativeAgeException`。它只有一个构造函数，该函数会调用父类的构造函数。它使用\
    \ `super().__init__()` 来来实现，并设置 `age`。\n\n## 使用自定义异常类\n\n以下是使用你的自定义异常类的方法：\n\n\
    ```python\ndef enterage(age):\n    if age < 0:\n        raise NegativeAgeException(\"\
    你只能输入正整数\")\n    if age % 2 == 0:\n        print(\"年龄是偶数\")\n    else:\n     \
    \   print(\"年龄是奇数\")\n\ntry:\n    num = int(input(\"输入你的年龄: \"))\n    enterage(num)\n\
    except NegativeAgeException:\n    print(\"你只能输入正整数\")\nexcept:\n    print(\"出了一些问题。\"\
    )\n```\n\n在倒数第二节中，我们将查看 Python 模块。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
