    # Chapter One: An Overview of Machine Learning


    ![image](d2d_images/chapter_title_below.png)


    Before we dive into the machine learning models, we should take a step back and
    learn what machine learning is and isn''t. It is often termed as an Artificial
    Intelligence subfield, but that''s a bit misleading. Sure, machine learning came
    from AI research, but, as far as data science goes, it''s better to consider machine
    learning as a way of building models filled with data.


    Simply put, machine learning is all about mathematical models, built to help us
    understand data. The ''learning'' part of it comes in when we provide the models
    with parameters that are adaptable to observed data. First, the models are shown
    a certain set of data, and, from that, they can learn to identify, classify, and
    make predictions on previously unseen data. That is a simple way of explaining
    it, but by the time you get to the end of this chapter, you will have a better
    understanding. Basically, the machine ls learning in a similar way to how the
    human brain learns.


    Knowing what it''s all about is one thing; putting it into perspective is another,
    and one of the critical points to using machine learning models correctly is understanding
    the types of problems they can be used on. So, let''s kick off with a few categorizations
    to explain things.


    ## Machine Learning Categories


    At its most basic, we can split machine learning into two primary categories –
    supervised and unsupervised learning.


    Supervised learning revolves around measured data features and the relationship
    with associated labels. When a supervised learning model has been built and trained,
    it can then be used to label new data that it hasn''t seen before. We can divide
    supervised learning further into regression and classification tasks. You''ll
    be learning about these in more depth later, but, for now, classification labels
    are discrete categories, and, in regression, the labels are continuous quantities.
    You''ll see examples of these shortly.


    Unsupervised learning works with unlabeled data and includes tasks like dimensionality
    reduction and clustering. Dimensionality reduction algorithms look for succeeding
    data representations, while clustering algorithms identify distinct data groups.
    Again, you will see examples of these shortly.


    There are also semi-supervised models which, as you can guess, are somewhere between
    the two. These tend to be used when thee data labels are incomplete.


    ## Examples of Machine Learning Applications


    Let''s give these ideas some flesh by looking at some examples of a task. These
    examples are designed to give you a basic overview of the different types of tasks
    we''ll be looking at; later, we''ll go more in-depth.


    All images attributed to [https://jakevdp.github.io/](https://jakevdp.github.io/)


    ### Classification: Predicting Discrete Labels


    First, a classification task. Here, you have some labeled points that we want
    to use for classifying unlabeled points. Let''s assume that the data we have is
    this:


    ![image](d2d_images/image019.png)


    The data is two-dimensional, which means each point has two features. The `x,
    y` positions of those points represent the features on the plane. Each point also
    has one of two possible class labels, indicated by the colors for the points.
    We want to use those labels and features to build a model that predicts if new
    points should be given a ''blue'' or ''red'' label.


    Classification tasks like this can be done using several different models, but
    we''re going to use a simple one. We will assume that we can separate the groups
    with a simple straight line drawn between them on the plane; in this way, the
    points on either side belong to the same group. The parameters are the numbers
    that indicate the location of the line and its orientation. The model will learn
    the parameter''s optimal values from the data in a process known as ''training.''


    In the next image, you can see what the trained model will look like:


    ![image](d2d_images/image004.png)


    Once the model is trained, we can generalize it to new data that has no labels.
    In simple terms, we draw the model through a new set of data, assigning labels
    based on that model. This is known as ''prediction.''


    ![image](d2d_images/image000.png)


    That gives you some idea of how classification tasks work, with ''classification''
    an indication that the class labels on the data are discrete. This looks pretty
    trivial at first look; you would find it easy to look at the data and classify
    it, but machine learning offers a simple benefit – we can generalize it to huge
    datasets.


    As an example, think about a machine learning task to detect spam email. We could
    have these labels and features:


    *   `Feature 1`, `feature 2`, etc. – normalized counts of words and phrases that
    are important in identifying spam email, i.e., `Nigerian Prince`, `Viagra`, etc.

    *   `Label` – Spam or Not Spam


    On the training dataset, we could determine the labels by inspecting a sample
    set of emails individually, and for the rest of the emails, the models would determine
    which label to apply. If a classification algorithm is properly trained with well-constructed
    and defined features, this can be an effective approach.


    ### Regression: Predicting Continuous Labels


    Regression tasks, by contrast, uses labels that are continuous quantities. Have
    a look at the next image, showing a set of points, each having a continuous label.


    ![image](d2d_images/image014.png)


    As you saw with the classification, the data is two-dimensional, each data point
    having two features. The colors indicate the point''s continuous label. We could
    choose from any number of regression models for this, but we''re going to make
    the points predictions using linear regression. The model is assuming that, if
    the label is treated as a third spatial dimension, the plane can be fitted to
    the data.


    This can be visualized as follows:


    ![image](d2d_images/image016.png)


    The plane for `feature 1-feature 2` is the same as it was in the plot from earlier,
    but this time, the labels are represented using a three-dimensional axis position
    and color. It doesn''t seem unreasonable that we could predict labels for any
    input parameters by fitting the plane through the data. Using the two-dimensional
    data, though, we would get the following result:

