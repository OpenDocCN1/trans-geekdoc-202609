- fmt: '

    Now, how do you get the best fit line, which is the value of `a+b`?


    We can do this using a technique called Least Square Method, or `LSM`, the commonest
    way to fit regression lines. LSM works out the fit line for the data by "minimizing
    the sum of the squares of the vertical deviations from individual data points
    to the line." When the deviations are added, they are squared first, thus avoiding
    any cancellations between negative and positive values.


    ### Logistic Regression


    We use logistic regression to find what the probability of `event=Failure` and
    `event=Success` is, i.e., classification problems. In theory, logistic regression
    should be used when there is a binary value for the dependent variable, i.e.,
    `0` or `1`, `Yes` or `No`, `True` or `False`.


    In logistic regression, the `Y` value is from `0` to `1` and the equation below
    represents it:


    `odds= p/ (1-p) = probability of event occurrence / probability of not event occurrence`


    `ln(odds) = ln(p/(1-p))`


    `logit(p) = ln(p/(1-p)) = b0+b1X1+b2X2+b3X3....+bkXk`


    In this equation, `p` represents the “probability of presence of the characteristic
    of interest.” What you should be asking yourself is, why did we use logit?


    Dependent variables are binomial distributions, and they require that the link
    function used suits the distribution; in this case, that''s the `logit` function.
    The parameters in the equation above ensure the likelihood of observing sample
    values is maximized, rather than the sum of the squared errors bine minimized,
    as it would be in standard regression.


    Things to keep in mind with logistic regression are that a linear relationship
    between dependent and independent variables is not required, as it is with linear
    regression. Logistic regression has the ability to handle multiple relationship
    types as a nonlinear log transformation is applied to the odds ratio predicted.


    To ensure that the model neither under nor overfits, all the most significant
    variables should be included. However, larger sample sizes are needed because
    the estimates for maximum likelihood are not as powerful at lower samples than
    `OLS`, or `Ordinary Least Square`, is.


    There also shouldn''t be any correlation between the independent variables (multicollinearity).


    ### Polynomial Regression


    Regression equations are classed as polynomial, provided the independent variable
    has a power of more than 1. The following equation is representative of polynomial
    equations – `y=a+b*x^2`.


    In polynomial regression, a straight line is not considered a best-fit line; instead,
    a curve is the best fit, fitting into the individual data points.


    There is always a temptation to try to fit a high-degree polynomial as a way of
    lowering the error, but the result will almost always be overfitting. The relationships
    should always be plotted so you can see the fit, and you should focus on ensuring
    the curve fits the problem.


    ### Stepwise Regression


    Stepwise regression is typically used when we have several independent variables.
    With stepwise, an automatic process is used to choose the independent variables;
    no human intervention is required at all. This is done through the observation
    of certain statistical values, such as `t-stats`, `R-square`, and the `AIC` metric,
    used for the discernment of the significant variables.


    Stepwise regression fits the model by adding co-variates or dropping them, one
    at a time, based on set criteria. Below are the commonest stepwise methods:


    *   Standard – this method of stepwise regression adds the predictors and removes
    them as required for every step.

    *   Forward Selection – this begins at the model predictor that is most significant
    and adds variables for every step

    *   Backward Elimination – this begins with every model prediction, and at each
    step, the least significant one is removed.


    The idea of stepwise regression is to ensure the prediction power is maximized
    using the least number of variables; it is typically used with high-dimensionality
    data.


    ### Ridge Regression


    This technique is used in cases of multicollinearity or when there is a high correlation
    between the independent variables. With multicollinearity, although `OLS` (ordinary
    least squares) is unbiased, it has large variances, deviating the observed from
    the true value by quite a long way. When you add a degree of bias to the estimates,
    the standard errors are reduced by ridge regression.


    Going back to the linear regression equation, which is `y=a+b*x`, there is also
    an error term built-in. The entire equation will be:


    `y=a+b*x+e (error term)`, `[error term is the value needed to correct for a prediction
    error between the observed and predicted value]`


    `=> y=a+y= a+ b1x1+ b2x2+....+e`, for multiple independent variables.


    With linear equations, we can decompose the prediction errors down into sub-components
    – the first for biased and the second for variance. A prediction error can happen
    because of one or both of these, and we''re going to look at the one caused by
    variance.


    With ridge regression, a shrinkage parameter of `λ` (lambda) solves the problem
    of multicollinearity. Have a look at the equation:


    ![ridge regression, l2 regularization](d2d_images/image021.png)


    Here, there are two components. The first is the least-square term, while the
    second is the `lambda` of the `β2` or beta-square summation (in which the coefficient
    is represented by `β`). The second is added to the first as a way of shrinking
    the parameter for low variance.


    A couple of things to remember about ridge regression are, firstly, that the ridge
    regression and least-square term assumptions are the same, except we cannot assume
    normality. Second, when you use ridge regression, the coefficient values are shrunk,
    but they will never get to zero, suggesting that there isn''t a feature for feature
    selection. Lastly, as ridge regression is one of the regularization methods, it
    uses `l2 regularization`.


    ### Lasso Regression


    Much like the previous regression technique, Lasso, which stands for Least Absolute
    Shrinkage and Selection Operator, penalizes the regression coefficient absolute
    size. It can also reduce variability and make linear regression more accurate.
    Look at the following equation:


    ![lasso regression, l1 regularization](d2d_images/image001.png)


    Where lasso and ridge regression differ is in the way absolute values, rather
    than squares, are used in the penalty functions. The result of this is the constraint
    of the sum of the absolute values of the estimates," or penalizing the values.
    This will make some parameter estimates come out as zero. The bigger the applied
    penalty, the more the estimates shrink towards absolute zero, and the result is
    a variable selection from the supplied `n` variables.


    Important points to remember are, first, similar to ridge regression, that the
    assumptions match those of squared regression, but normality cannot be assumed.
    Second, when you use lasso regression, the coefficients are shrunk to exactly
    zero, providing a helping hand for the feature selection.


    Being another regularization method, it uses `l1 regularization` and, where there
    is a high correlation between predictor groups, only one is chosen, and the rest
    shrunk to zero.


    ### ElasticNet Regression


    Our final technique is a hybrid of the ridge and lasso regression techniques.
    Training is done with `l1` and `l2` to regularize them. This is a useful technique
    when there are many correlated features. Where lasso picks one randomly, ElasticNet
    picks both.


    ![elastic net regression](d2d_images/image018.png)


    One of the advantages of the trade-off between ridge and lasso regression techniques
    is that ElasticNet will inherit stability under rotation from the ridge technique.


    ## L1 and L2 Regularization


    Overfitting is when the analysis result corresponds very closely with the data
    set and may result in problems fitting more data or reliably predicting observations.
    Regularization is a technique to help improve the training and prevent overfitting.
    Two of the most common regularization techniques are `l1` and `l2`.


    L1

