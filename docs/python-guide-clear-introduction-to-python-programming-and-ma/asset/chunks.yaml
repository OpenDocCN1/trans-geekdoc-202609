    \ false, the loop stops.\n\nHere’s an example:\n\n```python\ncount = 0\nwhile\
    \ count < 8:\n    print(count)\n    count += 1\n```\n\nWe would expect to see\
    \ the following output:\n\n0\n1\n2\n3\n4\n5\n6\n7\n\nThe loop continues to print\
    \ until `count` is lower than 8.\n\n## The break Statement\n\nThe `break` statement\
    \ is used to let us get out, or break out, from the loop; for example:\n\n```python\n\
    count = 0\nwhile count < 8:\n    count += 1\n    if count == 4:\n        break\n\
    print(\"inside loop\", count)\nprint(\"out of while loop\")\n```\n\nSo, when `count`\
    \ is equal to 4, if the condition is true, the `break` keyword will allow us to\
    \ break out from our loop.\n\nWe would expect to see this output:\n\ninside loop\
    \ 1\ninside loop 2\ninside loop 3\nout of while loop\n\n## The continue Statement\n\
    \nWhenever the program comes up against a `continue` statement, the current iteration\
    \ ends, and control of the program will go straight to the end of the body of\
    \ the loop. For example:\n\n```python\ncount = 0\nwhile count < 8:\n    count\
    \ += 1\n    if count % 2 == 0:\n        continue\n    print(count)\n```\n\nThe\
    \ output we expect to see from this is:\n\n1\n3\n5\n7\n\nIn this code, as soon\
    \ as `count % 2 == 0`, execution of the `continue` statement occurs; the current\
    \ iteration will end and control goes onto the next iteration.\n\nNow we move\
    \ onto mathematical functions in Python\n\n# Mathematical Functions\n\nThere are\
