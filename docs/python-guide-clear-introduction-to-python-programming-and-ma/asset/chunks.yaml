  raw: '## Exception Objects


    Learning how to handle and raise exceptions is one thing; you also need to know
    how you can access the exception object in the code. Assigning the exception object
    to a variable is done like this:


    try:


    \# We expect an exception to be thrown from this code


    except ExceptionType as ex:


    \# this code will handle the exception


    You can see from this that we stored the exception object inside a variable named
    ex. This object may now be used in your handler code. Let’s see an example:


    try:


    number = eval(input("Input a number: "))


    print("The number you input is," number)


    except NameError as ex:


    print("Exception:", ex)


    Run that program and input any number – you should see its output on your screen.


    Run the program and enter a number.


    Run it again, and this time, enter a string.


    This time, you should see a ‘not defined’ exception on the screen.


    ## Create A Custom Exception Class


    It is also possible to create custom exception classes and we do this by extending
    our BaseException class or a BaseException subclass.


    ![image](d2d_images/image009.jpg)


    As you see in the above diagram, most Python classes are extended from the BaseException
    class. It is possible to derive an exception class of your own from the BaseException
    class or one of the subclasses.


    In Python, make a file and name it NegativeAgeException.py. Add this code to it:


    class NegativeAgeException(RuntimeError):


    def \_\_init\_\_(self, age):


    super().\_\_init\_\_()


    self.age = age


    What this code does is creates another exception class and names it NegativeAgeException.
    It only has a single constructor, which will call the constructor from the parent
    class. It uses super()\_\_init\_\_() to do this, setting the age.


    ## Using A Custom Exception Class


    Here’s how to use your custom exception classes:


    def enterage(age):


    if age < 0:


    raise NegativeAgeException("You can only have positive integers")


    if age % 2 == 0:


    print("age is an even number")


    else:


    print("age is an odd number")


    try:


    num = int(input("Input your age: "))


    enterage(num)


    except NegativeAgeException:


    print("You can only have positive integers")


    except:


    print("something isn’t right. ")


    For our penultimate section, we will look at Python modules.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Modules


    ![image](d2d_images/chapter_title_below.png)


    Modules in the Python language are standard files with the ability to store classes,
    variables, constants, functions, and more. We use them to help us keep related
    code more organized and easier to read. For example, the math module contains
    all the functions related to mathematics.


    ## Creating a Module


    This is pretty easy to do. First, make a new file, saving it as mymodule.py. Then
    add this code to it:


    foo = 150


    def hello():


    print("i come from the mymodule.py")


    What we did here was to define a global variable called foo and a function called
    hello() inside the module. What if we want to use this module in a program? Like
    I showed you earlier, the first thing you must do is import the module and we
    use the import statement to do that:


    import mymodule


    Now, it is possible to use the function and the variable you defined in the module,
    and you do that like this:


    import mymodule


    print(mymodule.foo)


    print(mymodule.hello())


    Try it, and you should see the following on your screen:


    150


    i come from the mymodule.py.


    Don’t forget; to get access to any functions or variables in a module, you must
    make sure the module name is specified first; if you don’t do this, you will get
    an error.


    ## Using the From Statement With Import


    When you use an import statement, everything inside the module gets imported.
    But what if you want a specific variable or function? That is where we use the
    from statement, like this:


    from mymodule import foo # statement only imports variable called foo from mymodule


    print(foo)


    The output should be


    150


    Note:


    When you use the from statement, there is no need to specify the name of the module
    to get access to the functions and variables.


    ## Using the dir() Method


    This is one of the built-in methods, used for finding the object attributes –
    the available constants, functions, classes, and variables. You already know that
    everything is an object in Python, so we use the following syntax to find a module’s
    attributes:


    dir(module\_name)


    The dir() method will return a string that has a list of all the attribute names:


    \>>> dir(mymodule)


    \[''\_\_builtins\_\_'', ''\_\_cached\_\_'', ''\_\_doc\_\_'', ''\_\_file\_\_'',


    ''\_\_loader\_\_'', ''\_\_name\_\_'', ''\_\_package\_\_'', ''\_\_spec\_\_'', ''foo'',
    ''hello''\]


    You can see from this that, apart from hello and foo, there are some other attributes
    inside mymodule. These attributes are built-in by Python and appear in every module,
    regardless of what it is for.


    Congratulations!


    You have almost reached the end and have learned the basics of Python. To finish
    off, I am going to provide you with a series of tips to help you code better.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


