    # Installing Python - Linux


    ![image](d2d_images/chapter_title_below.png)


    Some Linux versions already have Python, but the version will vary, and not all
    of them include IDLE, the interactive development environment application. If
    you have an old Python version, you should install a newer one so you can access
    IDLE.


    If you need to install Python, follow these steps:


    Standard Installation


    This works on all Linux systems, but you do need to type commands into the terminal.
    Again, depending on your Linux version, those commands may vary.


    First, go to [http://python.org/download](http://python.org/download) and download
    the latest version for Linux


    Save the file and then double-click on it to open the Archive Manager window.
    Here, you will see Python when al the files have successfully extracted.


    Double click on that folder and the files get extracted and saved to a home folder
    subfolder called Python 3.x.x


    Open a Terminal and, at the command prompt type the following to install everything
    you need – ignore this step and Python won’t work. Type all these commands, pressing
    enter in between each one:


    sudo apt-get install build-essential


    sudo apt-get install libsqlite3-dev


    sudo apt-get install libbz2-dev


    CD Python 3.x.x


    ./configure and press Enter.


    Now, the script will check the type of system build and carry out a few tasks
    based on your system – be patient as this may take a few minutes.


    Next, type in


    make


    and press enter.


    The script is executed, creating the application software – again, this can take
    a minute or so.


    Type


    sudo make altinstall


    and press Enter.


    You might be asked to input the administrator password – type it in and press
    Enter. Python is now installed in your system.


