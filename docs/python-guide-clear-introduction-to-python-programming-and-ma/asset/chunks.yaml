    # Chapter Five: Your First Machine Learning Project


    ![image](d2d_images/chapter_title_below.png)


    There really is only one way you can learn machine learning, and that is to get
    on with it. Design your own projects, complete them, see where you went wrong
    and put it right.


    Python is one of the most popular of all the interpreted computer languages, not
    to mention the most powerful. It is a complete platform and language you can use
    for research, development, and the development of a production system.


    Python also has many libraries and modules built-in, giving you plenty of ways
    to complete every task. It can, to a complete beginner, feel quite overwhelming,
    so, as I said earlier, the best thing to do is to dive in and get your hands dirty
    – that is the best way to learn what works and what doesn''t.


    This does the following:


    *   It makes you install the Python interpreter and start it


    *   It lets you see how to work your way through a project


    *   It should give you the confidence you need to create your own projects.


    Rather than pushing you right in at the deep end and expecting you to create a
    project (you couldn''t, not at this stage), I''m providing you with a complete
    project to follow.  Sure, you can buy books or sign up to course, but rarely will
    they give you anything but the bare bones and a few snippets of code. I could
    have done that, but I preferred to walk you through a project with all the code
    needed from start to finish. That way, you can see how it all fits, how it all
    works together, and you may even be able to see where you can make improvements
    or change things slightly to get a better result.


    No machine learning project is linear, but they all have one thing in common –
    the same basic steps:


    1.  Define the problem


    2.  Prepare your data


    3.  Evaluate your algorithms


    4.  Improve the results


    5.  Present the results


    The project below will walk you through everything, from defining your problem,
    loading your data, summarizing it, evaluating your algorithms, and making a few
    predictions.


    If you can successfully work through this and come out the other end understanding
    it, you have a template for future use. Later, you can add more details, such
    as preparing the data further and improving your results later, when you have
    more confidence.


