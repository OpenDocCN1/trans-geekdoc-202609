    ## String Comparison


    There are several comparison operators, all used for comparing two strings. The
    operators are:


    *   < - less than


    *   \> - greater than


    *   <= - less than or equal to


    *   \=> - equal to or greater than


    *   \== - equal to – checks two values, returns True if both have the same value,
    False if they are different


    *   != - not equal to – checks two values, returns True if they are not the same
    as one another, False if they are


    Python string comparisons are lexicographical – that means using the character’s
    ASCII values for the comparisons.


    Let’s say that str1 has a value of “Michael,” and str2 has a value of “Milly.”
    The first character of each string, M and M, are compared; they are the same.
    Then the second characters are compared, I and I. Again, they are the same. The
    third set of two characters, C and L, are then compared. L has a higher ASCII
    value than C, so str 2 is greater than str1.


    Here’s a few more examples:


