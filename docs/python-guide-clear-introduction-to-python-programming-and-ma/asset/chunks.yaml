    ## A Complete Example


    To make it nice and easy for you, we can put all of this together in one simple
    script:


    ` summarize the data`


    ```python

    from pandas import read_csv


    # Load dataset

    url = "https://raw.githubusercontent.com/jbrownlee/Datasets/master/iris.csv"

    names = [''sepal-length'', ''sepal-width'', ''petal-length'', ''petal-width'',
    ''class'']

    dataset = read_csv(url, names=names)


    # shape

    print(dataset.shape)


    # head

    print(dataset.head(20))


    # descriptions

    print(dataset.describe())


    # class distribution

    print(dataset.groupby(''class'').size())

    ```


    ## Step Four - Visualizing the Data


    So, we have some ideas about our data; the next step is to visualize it. We''ll
    look at two different plots:


    1.  Univariate Plots – to get a better understanding of the attributes

    2.  Multivariate Plots – to get a better understanding of the relationship that
    exists between the attributes.


    ### The Univariate Plot


    A univariate plot will plot each variable individually. Because the variables
    (input) are numeric, we can use a box and whiskers plot for each variable. Here''s
    how you do that:


