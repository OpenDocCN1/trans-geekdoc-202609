- fmt: '

    ## 4. Machine Learning is Only Ever as Good as the Data Used for Training.

    Those who have experience with computer programming will already be aware of the
    phrase, "garbage in, garbage out." This is way older than machine learning, but
    it is a very apt phrase that describes one of the primary limitations machine
    learning has. A machine learning model will only find the patterns if they are
    in your training data. If the data is rubbish, don''t expect your model to perform
    as you expect. With classification, and other supervised learning tasks, your
    data must be rich in features, and it must have the correct labels.


    ## 5. Your Training Data Needs to be Representative if Machine Learning is to
    Work.

    To draw a parallel to this, think about a fund prospectus; it will tell you that
    past performance cannot be used as a guarantee of results in the future. With
    machine learning, the unspoken warning is that it can only work if the data generated
    for the testing model comes from the same distribution used to generate the training
    model. You must be fully aware of any skews between production and training data
    and make sure your models don''t get stale by retraining them on a regular basis.


    ## 6. Data Transformation Represents the Largest Part of the Hard Work.

    If you get sucked into the hype written about up and coming and brand-new techniques
    in machine learning, it''s perfectly possible that you will come to see machine
    learning as being mostly about choosing algorithms and tuning them. The reality
    is somewhat different since the bulk of your time will actually go into cleansing
    the data and doing the feature engineering – taking the raw features and transforming
    them into features that represent your data signal much better.


    ## 7. Deep Learning May be One of the Most Revolutionary Advances, But it isn''t
    the "Magic Bullet."

    Over time, deep learning has undoubtedly lived up to and properly earned its hype;
    after all, it offers huge advantages to many different applications in machine
    learning. And it''s being widely used to automate work that was once done in feature
    engineering, particularly where video and image data is concerned. However, it
    isn''t a magic bullet; you can''t just decide to use it, not without serious preparation,
    and a whole lot of time and effort in cleansing your data and transforming it.


    ## 8. Machine Learning Systems Are Reliant on Operator Input.

    And that makes them incredibly vulnerable to operator errors. When a machine learning
    system goes wrong, very rarely is that because the algorithm had some kind of
    problem. It''s more than likely that human error has made its way into the training
    data. It could have caused bias or any other kind of error that causes incorrect
    results. Machine learning requires no small amount of skepticism and must be approached
    with the same discipline that is required with software engineering.


    ## 9. Inadvertently, Machine Learning May End up Creating a Self-Fulfilling Prophecy.

    In lots of machine learning applications, when you make a decision today, it could
    have a significant effect on the training data for tomorrow. Once bias has been
    embedded into your machine learning model, that model will just carry on generating
    the data that reinforces them, and that can create chaos. Be aware and be responsible.


    ## 10. AI Isn''t Going to Suddenly Rise and Destroy Humanity as we know it.

    It''s surprising how many people get all their artificial intelligence "information"
    from sci-fi books and movies. Yes, these should give us some inspiration, but
    we should never, ever mistake them for reality. We have more than enough real
    dangers to occupy us; we don''t need to convince ourselves that the world will
    soon be run by AI robots!


