    # Python Lists


    ![image](d2d_images/chapter_title_below.png)


    Another type of sequence the list class defines the list, which lets you add elements,
    delete them, or process them very easily.


    ## Creating Lists


    The syntax for creating a list is:


    \>>> l = \[1, 2, 3, 4\]


    The entire list is enclosed in square brackets, and a comma separates every element.
    The elements can be the same or different types. For example:


    l2 = \["a string", 12\]


    You can also create lists in other ways:


    list1 = list() # Creates empty list


    list2 = list(\[21, 30, 52\]) # Creates  list containing elements 21, 30, 52'
