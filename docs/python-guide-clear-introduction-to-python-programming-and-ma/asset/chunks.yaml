    There are several mathematical functions built into Python:


    Method   Description


    round(number\[, ndigits\]) rounds the specified number. Precision may be specified
    in argument two


    pow(a, b) a raised to the power of b is returned


    abs(x) the absolute value of x is returned


    max(x1, x2, ... xn) the biggest value from the arguments supplied is returned


    min(x1, x2,... xn) the smallest value is returned from the given arguments


    And the functions below are found in the math module; if you want to use these,
    you need to import the module, like this:


    import math


    Method  Description


    ceil(x)   rounds up the given number; the nearest integer is returned


    floor()   rounds up the down and the nearest integer is returned


    sqrt(x)  the square root of the given number is returned


    sin(x)   the sin of  x is returned where x is in the radian


    cos(x)   the cosine  of x  is returned where x is in the radian


    tan(x)   the tangent of x is returned where x is in the radian


    Let’s try to understand this with some examples:


    \>>> abs(-44)  # the absolute value is returned


    44


    \>>>


    \>>> max(10, 4, 15, 92)  # the maximum number is returned


    92


    \>>>


    \>>> min(65, 95, 14, 25)  # the minimum number is returned


    14


    \>>>


    \>>> pow(9, 3)  # may also be seen as 9 \*\* 3


    729


    \>>>


    \>>> pow(3.5, 5.2)  # may also be seen as 3.5 \*\* 5.2


    674.766993305


    \>>>


    \>>> round(6.98)  # the number is rounded to the nearest integer


    7


    \>>>


    \>>> round(3.12498775614, 3) # the number is returned decimalized to three places


    3.124


    And another example:


    \>>> import math


    \>>> math.ceil(3.1234)


    4


    \>>> math.floor(25.78912)


    25


    Hopefully that explains the mathematical functions in Python, now its time to
    look at how random numbers are generated.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Generating Random Numbers


    ![image](d2d_images/chapter_title_below.png)


    To generate random numbers in Python, you need to use the random() function, and
    that is found inside the random module. Using it requires you to import the module
    first:


    import random


    random() Function


    When you use the random() function, random numbers are generated. The random number
    is r in that 0 < = r < 1.0. Here’s an example:


    \>>> import random


    \>>> for i in range(0, 10):


    ...  print(random.random())


    ...


    We would expect to see an output of something similar to this:


    0.7346397596936707


    0.8314503234887478


    0.9987325602052806


    0.43625298553512726


    0.4471960266125812


    0.5467030001314136


    0.22524111130982516


    0.5541548738565403


    0.8856297454931572


    0.08108953103391203


    Another way of generating random numbers is to use randint(a, b) – this will produce
    random numbers that all between a and b, inclusive. Here’s an example:


    \>>> import random


    \>>> for i in range(0, 12):


    ...  print(random.randint(1, 12))


    ...


    You will see an output similar to this:


    8


    9


    12


    2


    12


    5


    7


    3


    1


    1


    10


    5


    In the next part, we’ll take a look at techniques for file handling.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # File Handling


    ![image](d2d_images/chapter_title_below.png)


    Python file handling is used to read data to a file and to write from it.


    ## Open a File


    Before you can even think about reading to or writing from a file, you must open
    it, and the syntax for that is:


    f = open(filename, mode)


    We can give the open() function two arguments, called mode and filename. The latter
    is classed as a string argument; it specifies the filename and its file path while
    the former, also a string argument and that one specifies how the file is going
    to be used, i.e., writing or reading. The file handler object, f, is also called
    the file pointer.


    ## Close a File


    Once you are done reading and/or writing to a file, the next step is to close
    it. For this, you need the close() method:


    f.close()  \# f is a file pointer


    There are several ways of opening a file:


    Method  Description


    r   for reading a file


    w for writing to a file. If the file in already in existence, all its data is
    removed before it is opened. If not, a new file gets created.


    a file opens in ‘append’ mode – data is written to the end of it


    wb for writing in binary mode


    rb for reading in binary mode


    Here’s a few examples:


    Writing Data


    \>>> f = open(''myfile.txt'', ''w'')  # file opened for writing


    \>>> f.write(''the first line\\n'')  # a line gets written to the file


    \>>> f.write(''the second line\\n'')  # another line gets written


    \>>> f.close()  # file is closed


    Note:


    Using the write() method doesn’t add (\\n) a new line the way the print() function
    des; instead, you must tell it by adding n to the method.


    Reading Data


    There are three methods you can use for writing data back from files:


    Method  Description


    read\[number\] returns the number of characters specified; if not given the whole
    file content will be read


    readline() returns the following line


    readlines() reads every line as a string list


    Reading all data:


    \>>> f = open(''myfile.txt'', ''r'')


    \>>> f.read() # read all the file at the same time


    "the first line\\nthe second line\\n"


    \>>> f.close()


    Reading every line as an array:


    \>>> f = open(''myfile.txt'', ''r'')


    \>>> f.readlines() # read all the file at the same time


    \["the first line\\n", "the second line\\n"\]


    \>>> f.close()


    Reading a single line:


    \>>> f = open(''myfile.txt'', ''r'')


    \>>> f.readline() # read first line


    "the first line\\n"


    \>>> f.close()


    ## Append Data


    The file must be opened using ‘a’ to do this:


    \>>> f = open(''myfile.txt'', ''a'')


    \>>> f.write("the third line\\n")


    19


    \>>> f.close()


    ## Using a For Loop


    The file pointer is required to iterate through files:


    \>>> f = open(''myfile.txt'', ''r'')


    \>>> for line in f:


    ...  print(line)


    ...


    the first line


    the second line


    the third line'
