    # Python Dictionaries


    A dictionary is a data type in Python used for storing key-value pairs. The idea
    of the dictionary is to let you easily retrieve information, add new, remove,
    or even modify the values by using a key. If you are familiar with other languages,
    you probably know this as a ‘hash.’ Because you can do so much with a dictionary,
    it follows that they are mutable.


    ## Creating a Dictionary


    Dictionaries are easy to create; all you need is the information and a set of
    curly braces `{}`. Every dictionary item is a key and a value, separated by a
    colon. And each key-value pair is separated by a comma. Here’s an example:


    ```python

    friends = {

    ''thomas'' : ''234-567-890'',

    ''friends'' : ''444-66-2221''

    }

    ```


    In this code, we have a dictionary called `friends` containing two items. Something
    to note here is that a key is a hashable type, but you can have any type for the
    value, and all keys should be unique.


    ```python

    >>> dict_emp = {} # creates an empty dictionary

    ```


    ## Retrieving, Modifying And Adding Elements


    Retrieving items from a dictionary is done with this syntax:


    ```python

    >>> dictionary_name[''key'']

    ```


    Like this:


    ```python

    >>> friends[''thomas'']

    ''234-567-890''

    ```


    The value is only returned if the key is in the dictionary; if not, you will get
    a `KeyError` exception or error message.


    If you want to add an item or modify an existing one use this syntax:


    ```python

    >>> dictionary_name[''newkey''] = ''newvalue''

    ```


    Like this:


    ```python

    >>> friends[''billy''] = ''888-999-666''

    >>> friends

    {''thomas'': ''234-567-890'', ''billy'': ''888-999-666'', ''friends'': ''444-66-2221''}

    ```


    ## Deleting Items


    To delete an item from a dictionary, use this syntax:


    ```python

    >>> del dictionary_name[''key'']

    ```


    Like this:


    ```python

    >>> del friends[''billy'']

    >>> friends

    {''thomas'': ''234-567-890'', ''friends'': ''444-66-2221''}

    ```


    The item is deleted if the key is located, if not, you get a `KeyError` exception.


    ## Looping Items


    To traverse the items in your dictionary, you can use a for loop:


    ```python

    >>> friends = {

    ''thomas'' : ''234-567-890'',

    ''friends'' : ''444-66-2221''

    }

    >>> for key in friends:

    ... print(key, ":", friends[key])


    thomas : 234-567-890

    friends : 444-66-2221

    ```


    ## Find the Dictionary Length


    The `len()` function will return the dictionary length:


    ```python

    >>> len(friends)

    2

    ```


    ## in or not in Operators


    The `in` or `not in` operators are used for checking the existence of a specific
    key.

