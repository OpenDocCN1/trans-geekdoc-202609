    3.  It is a multi-nominal classification problem, which means it has multiple
    classes; that means it may have to be handled in a special way


    4.  It has just four attributes and only 150 rows; that makes it small enough
    to handle easily, and it will fit into memory, on an A4 page, even on one screen'
