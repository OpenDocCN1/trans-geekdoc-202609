    You require a text editor to write programs in Python, and you can use any one
    you want. `Notepad` is already included with Windows, but a better one is `Notepad++`
    or even `Sublime Text`. Make your choice and download it via the internet.


    After we’ve looked at the other platforms, we’ll move on to running Python programs.


    A quick aside; while I am showing you how to install on Mac and Linux, the book
    is based on Python for Windows – the code is the same for all platforms, though,
    so you shouldn’t have any trouble following along.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # Installing Python - Mac OSX


    ![image](d2d_images/chapter_title_below.png)


    The first step is to install `XCode`, the IDE (integrated development environment)
    provided by Apple. It comes with a few tools that we will need to use later too.
    Head to the app store on your mac to download `XCode` – it is a large download
    but is the best way of getting what you need.


    Once that is installed, we need the command line tools. Open the `XCode` menu
    and choose `Preferences`. A window will open, click the tab for `Downloads` and
    then click on `Command Line Tools>Install`.


    You will need somewhere to store your projects, so open a `Terminal` – go to your
    Applications folder and click on `Utilities>Terminal`. It should open in the home
    directory – test it by typing the following – do not type the `$` sign:


    ```bash

    cd

    ```


    The `$` sign signifies the start of a command-line instruction and `cd` stands
    for change directory, If you don’t say where you want to go to, you will automatically
    be sent to your home directory. What we want is a folder named `Code` to store
    our projects, so type in:


    ```bash

    mkdir Code

    ```


    You might have guessed that `mkdir` stands for make directory, and these are similar
    to folders in `Finder`. By making a new directory using the command line, you
