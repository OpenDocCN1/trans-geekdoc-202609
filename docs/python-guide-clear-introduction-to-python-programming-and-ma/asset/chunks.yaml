    The `dir()` method will return all methods that can be applied to the specified
    element. As an example:


    ```python

    >>> my_string.upper()

    >>> ''THIS IS A STRING.''

    ```


    Here, we called a method named `upper()`, and it''s clear to see how it works
    – all the string letters are turned into UPPERCASE letters.


    Learn how to determine an element’s type:


    ```python

    >>> type(my_string)

    >>> str

    ```


    Learn how to get documentation using the `help` system built-in:


    ```python

    >>> help(str)

    ```


    Learn how to import different libraries and get to know them:


    ```python

    >>> from datetime import datetime

    >>> dir(datetime)

    ```


    [''__add__'', ..., ''weekday'', ''year'']  # Truncated to make it easier to read


    ```python

    >>> datetime.now()

    datetime.datetime(2018, 3, 14, 23, 44, 50, 851904)

    ```


    Learn how to run a shell command and what they do:


    ```python

    >>> import os

    >>> os.system(''ls'')

    python_hw1.py python_hw2.py README.txt

    ```


    ## 1. Take plenty of breaks


    This is very important; don’t try to learn too much as once. Your brain can only
    soak in so much information at any one time, and you need to be able to step away
    and take in what you have learned. One of the best techniques to use is Pomodoro
    – work for 25 minutes and then take a break. Repeat.


    Taking a break is especially useful when you debug a program because it can help
    you work out what is wrong. Step back; got for a short walk, do something, and
    then, when you go back, you will probably find you can see the error. Even omitting
    one simple comma or quotation mark can cause an error in your programming, and
    a set of fresh eyes can help make a difference.


    ## 2. Debug Methodically


    Bugs are an inevitable part of writing code, especially complex code – it happens
    to the most experienced of programmers. The one thing you shouldn’t do is let
    the bugs get to you.


    You must have a method to debug code, and the best way to do it is to go through
    it in the same order Python executes it – that way, you can make sure that every
    part works. When you think you have figured out where the problem lies, write
    this into the program script:


    ```python

    import pdb; pdb.set_trace()

    ```


    Run the code to start the debugger, and you will go into interactive mode. You
    can also run it directly from the command line, using this command:


    ```bash

    python -m pdb <my_file.py>

    ```


    ## 3. Get Together With Other Learners


    One common misconception about coding is that it is something you do alone, but,
    in fact, the opposite is true. Coding works much better when you work with others
    and when you are learning, it is very important to get together with other Python
    learners. That way, you can share knowledge, tips, and brainstorm problems.


    If you don’t know anyone else who is learning, don’t worry; search the internet
    and your local area for meetups, events, and so on. Failing that, there are plenty
    of Python forums that are very active – it’s the next best thing.


    ## 4. Teach Python


    One of the very best ways to learn is to teach, and the same goes with Python.
    There are a few ways to do this – get together with other learners and use a whiteboard
    to discuss concepts, write articles or blog posts talking about concepts; you
    can set up a video and record yourself explaining something you learned or even
    chat to yourself while you are learning. Any of these methods will highlight gaps
    in your knowledge and help to cement your learning.


    ## 5. Pair Programming


    This technique is where a pair of developers work together, at a single workstation,
    on a task. They will each take turns at being the ‘driver,’ writing the code,
    and the ‘navigator,’ helping to guide the process of problem-solving and reviewing
    the written code. The switch between the two should be as frequent as possible.


    There are some benefits to this – first, you get somebody to look at the code
    you write and, second, you get to see another point of view in terms of solving
    problems. And this can all help you when you go back to working by yourself.


    That brings us to the end f this quick start guide; you are well on your way to
    learning the Python programming language.


