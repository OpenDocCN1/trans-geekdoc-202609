    \ – `a^b`。例如：\n\n```\n>>> 2 ** 3\n```\n\n同于\n\n```\n>>> 2 * 2 * 2\n```\n\n在两种情况下，结果都是\n\
    \n```\n8\n```\n\n### 取余运算符\n\n取余运算符 (`%`) 也称为模运算运算符，它返回除法运算后的余数。例如：\n\n```\n>>>\
    \ 7 % 2\n```\n\n将返回\n\n```\n1\n```\n\n为了解释这一点——2 可以除入 7 三次，余下 1。\n\n## 运算符优先级\n\
    \n所有的 Python 表达式都使用所谓的“运算符优先级”进行求值。这意味着运算符按照特定的顺序进行求值。这里有一个示例：\n\n```\n>>> 5 *\
    \ 5 + 2\n```\n\n哪一个先求值——`+` 还是 `*`？如果你还记得数学课，这应该相对容易解决。为了帮助你，下面的列表是按优先级排序的 Python\
    \ 运算符——这包含了所有的运算符，而不仅仅是数学运算符，所以如果你现在不理解它们，也不要担心：\n\n| 运算符 | 描述 |\n| :--- | :---\
    \ |\n| `()` | 括号或分组 |\n| `f(args...)` | 函数调用 |\n| `x[index:index]` | 切片 |\n| `x[index]`\
    \ | 索引 |\n| `attribute` | 属性引用 |\n| `**` | 幂 |\n| `~x` | 按位取反 |\n| `+x, -x` |\
    \ 正数和负数 |\n| `*, /, %` | 乘法、除法、取余 |\n| `+, -` | 加法、减法 |\n| `<<, >>` | 位位移 |\n\
    | `&` | 按位与 |\n| `^` | 按位异或 |\n| `|` | 按位或 |\n| `in, not in, is, not is` | 成员、身份\
    \ |\n| `<`, <=, >, >=, <>, ==` | 比较 |\n| `not x` | 布尔非 |\n| `and` | 布尔与 |\n| `or`\
    \ | 布尔或 |\n| `lambda` | lambda 表达式 |\n\n所以回到我们的示例，`*` 的优先级高于 `+`，所以先求值乘法，然后是加法。因此该示例的输出为\
    \ 27。\n\n这里是另一个示例：\n\n```\n5 + 5 – 3\n```\n\n先发生什么——`+` 还是 `-`？加法减法运算符的优先级相同，因此\
    \ Python 将从左到右计算该语句——先加法后减法——输出为 7。\n\n不过这里有一个例外——当使用赋值运算符时，求值是从右到左的。改变这里优先级的唯一方法是使用括号。例如：\n\
    \n```\n>>> 5 * (5 + 2)\n```\n\n返回\n\n```\n35\n```\n\n括号中的任何内容优先求值，所以先求值 `(5 +\
    \ 2)` 然后是乘法。\n\n## 复合赋值运算符\n\n复合赋值运算符允许对赋值语句使用快捷方法。例如：\n\n```\n>>> count = \n\
    >>> count = count + \n>>> count\n2\n```\n\n可以写为：\n\n```\n>>> count = 1\n>>> count\
    \ += 1\n>>> count\n2\n```\n\n"
- fmt: "\nThe result will be the section of the string starting from the index indicated\
    \ by `start` and ending with the indicated end index – 1. Here’s an example:\n\
    \n```python\n>>> s = \"Good day\"\n>>> s[1:3]\noo\n```\n\nAnd a few more:\n\n\
    ```python\n>>> s = \"Good day\"\n>>> s[:6]\n'Good d'\n\n>>> s[4:]\n'ing'\n\n>>>\
    \ s[1:-1]\n'ood da'\n```\n\n### Note\nStart and end indexes are optional; if you\
    \ leave them out, the start index is a default of `0`, and the end index is a\
    \ default of the last string index.\n\n## `ord()` and `chr()` Functions\n\nThe\
    \ `ord()` function returns the given character’s ASCII code, and the `chr()` function\
    \ returns the character that corresponds to a given ASCII number. For example:\n\
    \n```python\n>>> ch = 'b'\n>>> ord(ch)\n98\n\n>>> chr(97)\n'a'\n\n>>> ord('A')\n\
    65\n```\n\nTry it for yourself:\n\n```python\nch = 'b'\nprint(ord(ch))\nprint(chr(97))\n\
    print(ord('A'))\n```\n\nThe result is:\n98\na\n65\n\n## Python String Functions\n\
    \nPython has three built-in string functions, as you can see below.\n\n| Function\
    \ Name | Description |\n| :--- | :--- |\n| `len()` | returns string length |\n\
    | `max()` | returns the character with the highest ASCII value |\n| `min()` |\
    \ returns the character with the lowest ASCII value |\n\nHere are examples of\
    \ all three:\n\n```python\n>>> len(\"hello\")\n5\n\n>>> max(\"abc\")\n'c'\n\n\
    >>> min(\"abc\")\n'a'\n```\n\nTry it for yourself:\n\n```python\nprint(len(\"\
    hello\"))\nprint(max(\"abc\"))\nprint(min(\"abc\"))\n```\n\nThe result is:\n5\n\
    c\na\n\n## `in` and `not in` Operators\n\nThe `in` and `not in` operators, also\
    \ called membership operators, are used for checking if one string exists in another\
    \ string. For example:\n\n```python\n>>> s1 = \"Good day\"\n>>> \"come\" in s1\n\
    True\n\n>>> \"come\" not in s1\nFalse\n```\n\nTry it for yourself:\n\n```python\n\
    s1 = \"Good day\"\nprint(\"come\" in s1)\nprint(\"come\" not in s1)\n```\n\nAnd\
    \ the result is:\nTrue\nFalse\n\n## String Comparison\n\nThere are several comparison\
    \ operators, all used for comparing two strings. The operators are:\n\n- `<` -\
    \ less than\n- `>` - greater than\n- `<=` - less than or equal to\n- `>= - equal\
    \ to or greater than\n- `==` - equal to – checks two values, returns `True` if\
    \ both have the same value, `False` if they are different\n- `!=` - not equal\
    \ to – checks two values, returns `True` if they are not the same as one another,\
    \ `False` if they are\n\nPython string comparisons are lexicographical – that\
    \ means using the character’s ASCII values for the comparisons.\n\nLet’s say that\
    \ `str1` has a value of “Michael,” and `str2` has a value of “Milly.” The first\
    \ character of each string, `M` and `M`, are compared; they are the same. Then\
    \ the second characters are compared, `I` and `I`. Again, they are the same. The\
    \ third set of two characters, `C` and `L`, are then compared. `L` has a higher\
    \ ASCII value than `C`, so `str2` is greater than `str1`.\n\nHere’s a few more\
    \ examples:\n\n```python\n>>> \"tie\" == \"tim\"\nFalse\n\n>>> \"free\" != \"\
    freed\"\nTrue\n\n>>> \"arrow\" > \"aron\"\nTrue\n\n>>> \"right\" >= \"left\"\n\
    True\n\n>>> \"abc\" > \"\"\nTrue\n```\n\n## String Iteration Using a For Loop\n\
    \nA string is a type of sequence and we can iterate over it using a `for` loop.\
    \ We’ll be discussing loops in more detail later.\n\nHere’s an example:\n\n```python\n\
    >>> s = \"hi\"\n>>> for i in s:\n... print(i, end=\"\")\nhi\n```\n\n### Note\n\
    The `print()` function will, by default, print a string with a newline character.\
    \ To change that, we pass a keyword argument called `end`, like this:\n\n```python\n\
    print(\"my string\", end=\"\\n\")  #this is the default\nprint(\"my string\",\
    \ end=\"\")  # this prints the string with no newline\nprint(\"my string\", end=\"\
    foo\")  # print() will now print every string with foo at the end\n```\n\nTry\
    \ it for yourself:\n\n```python\ns = \"hi\"\nfor i in s:\n    print(i, end=\"\"\
    )\n```\n\nThe result is:\nHi\n\n## Testing Strings\n\nThere are several built-in\
    \ methods in the Python string class that allow us to check for different string\
    \ types:\n\n| Method Name | Method Description |\n| :--- | :--- |\n| `isalnum()`\
    \ | if string is alphanumeric, returns `True` |\n| `isalpha()` | if string only\
    \ contains alphabetic characters, returns `True` |\n| `isdigit()` | if string\
    \ only contains digits, returns `True` |\n| `isidentifier()` | if string is a\
    \ valid identifier, returns `True` |\n| `islower()` | if string is lowercase,\
    \ returns `True` |\n| `isupper()` | if string is uppercase, returns `True` |\n\
    | `isspace()` | if string has only whitespace, returns `True` |\n\nHere’s some\
    \ examples:\n\n```python\n>>> s = \"good day to python\"\n>>> s.isalnum()\nFalse\n\
    \n>>> \"Good day\".isalpha()\nTrue\n\n>>> \"2019\".isdigit()\nTrue\n\n>>> \"first\
    \ Number\".isidentifier()\nFalse\n\n>>> s.islower()\nTrue\n\n>>> \"GOOD DAY\"\
    .isupper()\nTrue\n\n>>> \" \\t\".isspace()\nTrue\n```\n\nTry it for yourself:\n\
    \n```python\ns = \"good day to python\"\nprint(s.isalnum())\nprint(\"Good day\"\
    .isalpha())\nprint(\"2019\".isdigit())\nprint(\"first Number\".isidentifier())\n\
    print(s.islower())\nprint(\"GOOD DAY\".isupper())\nprint(\" \\t\".isspace())\n\
    ```\n\nAnd the result should be:\nFalse\nTrue\nTrue\nFalse\nTrue\nTrue\nTrue\n\
    \n## Searching for Substrings\n\nThe methods used to search for substrings in\
    \ a string are:\n\n| Method Name | Method Description |\n| :--- | :--- |\n| `endswith(s1:\
    \ str): bool` | if the string ends with the `s1` substring returns `True` |\n\
    | `startswith(s1: str): bool` | if the string starts with the `s1` substring,\
    \ returns `True` |\n| `count(substring): int` | counts number of times `substring`\
    \ appears in the string |\n| `find(s): int` | returns the lowest index at which\
    \ `s` is found -1 if not found |\n| `rfind(s): int` | returns the highest index\
    \ at which `s` is found -1 if not found |\n\nHere’s an example:\n\n```python\n\
    >>> s = \"good day to python\"\n>>> s.endswith(\"thon\")\nTrue\n\n>>> s.startswith(\"\
    Good\")\nFalse\n\n>>> s.find(\"day\")\n3\n\n>>> s.rfind(\"day\")\n15\n```\n\n\
    Try it for yourself:\n\n```python\ns = \"good day to python\"\nprint(s.endswith(\"\
    thon\"))\nprint(s.startswith(\"Good\"))\nprint(s.find(\"day\"))\nprint(s.rfind(\"\
    day\"))\n```\n\nAnd the result is:\nTrue\nFalse\n3\n15\n\n## Converting Strings\n\
    \nThere are also several conversion methods:\n\n| Method Name | Description |\n\
    | :--- | :--- |\n| `capitalize()` | a copy of the string returned with first character\
    \ capitalized |\n| `lower()` | string returned with all characters converted to\
    \ lowercase |\n| `upper()` | string returned with all characters converted to\
    \ uppercase |\n| `title()` | string returned with the first character every word\
    \ capitalized |\n| `swapcase()` | string returned with cases swapped |\n| `replace(old,\
    \ new)` | old string replaced by new string returned |\n\nHere’s some examples:\n\
    \n```python\n>>> s = \"python string\"\n>>> s1 = s.capitalize()\n'Python string'\n\
    \n>>> s2 = s.title()\n'Python String'\n\n>>> s = \"This is a test\"\n>>> s3 =\
    \ s.lower()\n'this is a test'\n\n>>> s4 = s.upper()\n'THIS IS A TEST'\n\n>>> s5\
    \ = s.swapcase()\n'tHIS IS A tEST'\n\n>>> s6 = s.replace(\"Is\", \"Was\")\n'This\
    \ Was a Test'\n```\n"
