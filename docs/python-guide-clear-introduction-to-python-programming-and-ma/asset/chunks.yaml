    **Note:**

    Lists are mutable, meaning you can modify them after you have created them.


    ## Accessing List Elements


    The index operator `[]` may be used for accessing elements in a list. Don’t forget,
    indexing begins at 0. Here’s an example:


    ```python

    >>> l = [1,2,3,4,5]

    >>> l[1] # access element 2 in the list

    2

    >>> l[0] # access element 1 in the list

    1

    ```


    ## Common List Operations


    The list operations in Python are:


    | Operation Name | Description |

    | :--- | :--- |

    | `x in s` | if element `x` appears in sequence `s`, returns `True`, otherwise
    `False` |

    | `x not in s` | if element `x` is not in sequence `s`, returns `True`, otherwise
    `False` |

    | `s1 + s2` | concatenated or joins sequence `s1` to `s2` |

    | `s * n, n * s` | `n` number of copies of the sequence `s`, all concatenated
    |

    | `s[i]` | the ith element from sequence `s` |

    | `len(s)` | the length or number of elements in `s` |

    | `min(s)` | the smallest element from `s` |

    | `max(s)` | the largest element from `s` |

    | `sum(s)` | the sum of all the numbers in `s` |

    | `for loop` | in a for loop, the elements are traversed right to left |


    Here are some examples of lists using functions:


    ```python

    >>> list1 = [2, 3, 4, 1, 32]

    >>> 2 in list1

    True

    >>> 33 not in list1

    True

    >>> len(list1) # find number of elements in list

    5

    >>> max(list1) # find largest element in list

    32

    >>> min(list1) # find smallest element in list

    1

    >>> sum(list1) # sum of elements in list

    42

    ```


    ## List Slicing


    You can also use the slice operator `[start:end]` to fetch sub lists from a list
    in a similar way to how it works with strings:


    ```python

    >>> list = [11,33,44,66,788,1]

    >>> list[0:5] # returns list beginning from index 0 to index 4

    [11,33,44,66,788]

    >>> list[::3]

    [11,33,44]

    ```


    And, the same as it is for strings, the start index is optional; if left out,
    by default it is 0.


    ## + and * Operators in List


    The `+` operator is used for joining lists:


    ```python

    >>> list1 = [11, 33]

    >>> list2 = [1, 9]

    >>> list3 = list1 + list2

    >>> list3

    [11, 33, 1, 9]

    ```


    While the `*` operator is used for replicating the list elements:


    ```python

    >>> list4 = [4, 3, 2, 1]

    >>> list5 = list4 * 3

    >>> list5

    [4, 3, 2, 1, 4, 3, 2, 1, 4, 3, 2, 1]

    ```


    ## in or not in Operator


    We use the `in` operator to find out if specified elements are in the list. If
    they are, `True` is returned; if not, it is `False`.


    The `in` operator is used to determine whether the elements exists in the list.
    On success it returns `True` on failure it returns `False`.


    ```python

    >>> list1 = [10, 20, 40, 15, 79, 99]

    >>> 20 in list1

    True

    ```


    And not in is the opposite:


    ```python

    >>> 42 not in list1

    False

    ```


