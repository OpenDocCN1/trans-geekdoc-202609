    674.76693305\n>>> round(6.98) # the number is rounded to the nearest integer\n\
    7\n>>> round(3.1249875614, 3) # the number is decimalized to three places\n3.125\n\
    ```\n\nAnd another example:\n\n```python\n>>> import math\n>>> math.ceil(3.1234)\n\
    4\n>>> math.floor(25.7812)\n25\n```\n\nHopefully that explains the mathematical\
    \ functions in Python, now its time to look at how random numbers are generated.\n\
    \n# Generating Random Numbers\n\nTo generate random numbers in Python, you need\
    \ to use the `random()` function, and that is found inside the `random` module.\
    \ Using it requires you to import the module first:\n\n```python\nimport random\n\
    ```\n\n### random() Function\n\nWhen you use the `random()` function, random numbers\
    \ are generated. The random number is `r` in `0 <= r < 1.0`. Here’s an example:\n\
    \n```python\n>>> import random\n>>> for i in range(0, 10):\n...     print(random.random())\n\
    ```\n\nWe would expect to see an output of something similar to:\n\n0.7346397596936707\n\
    0.831450323488748\n0.9987325602052806\n0.43625298553512726\n0.4471960266125812\n\
    0.546703001314136\n0.2252411130982516\n0.5541548738565403\n0.8856297454931572\n\
    0.0810895310331103\n\nAnother way of generating random numbers is to use `randint(a,\
    \ b)` – this will produce random numbers that all between `` and `b`, inclusive.\
    \ Here’s an example:\n\n```python\n>>> import random\n>>> for i in range(0, 12):\n\
    ...     print(random.randint(1, 12))\n```\n\nYou will see an output similar to\
    \ this:\n\n8\n9\n12\n2\n12\n5\n7\n3\n1\n1\n10\n5\n\nIn the next part, we’ll take\
    \ a look at techniques for file handling.\n\n# File Handling\n\nPython file handling\
    \ is used to read data to a file and to write from it.\n\n## Open a File\n\nBefore\
    \ you can even think about reading to or writing from a file, you must open it,\
    \ and the syntax for that is:\n\n```python\nf = open(filename, mode)\n```\n\n\
    We can give the `open()` function two arguments, called `mode` and `filename`.\
    \ The latter is classed as a string argument; it specifies the filename and its\
    \ file path while the former, also a string argument and that one specifies how\
    \ the file is going to be used, i.e., writing or reading. The file handler object,\
    \ `f`, is also called the file pointer.\n\n## Close a File\n\nOnce you are done\
    \ reading and/or writing to a file, the next step is to close it. For this, you\
    \ need the `close()` method:\n\n```python\nf.close() # f is a file pointer\n```\n\
    \nThere are several ways of opening a file:\n\n| Method | Description |\n| :---\
    \ | :--- |\n| `r` | for reading a file |\n| `w` | for writing to a file. If the\
    \ file in already in existence, all its data is removed before it is opened. If\
    \ not, a new file gets created. |\n| `a` | file opens in ‘append’ mode – data\
    \ is written to the end of it |\n| `wb` | for writing in binary mode |\n| `rb`\
    \ | for reading in binary mode |\n\nHere’s a few examples:\n\n### Writing Data\n\
    \n```python\n>>> f = open('myfile.txt', 'w') # file opened for writing\n>>> f.write('the\
    \ first line\\n') # a line gets written to the file\n>>> f.write('the second line\\\
    n') # another line gets written\n>>> f.close() # file is closed\n```\n\nNote:\
    \ Using the `write()` method doesn’t add (`\\n`) a new line the way the `print()`\
    \ function des; instead, you must tell it by adding n to the method.\n\n### Reading\
    \ Data\n\nThere are three methods you can use for writing data back from files:\n\
    \n| Method | Description |\n| :--- | :--- |\n| `read[number]` | returns the number\
    \ of characters specified; if not given the whole file content will be read |\n\
    | `readline()` | returns the following line |\n| `readlines()` | reads every line\
    \ as a string list |\n\nReading all data:\n\n```python\n>>> f = open('myfile.txt',\
    \ 'r')\n>>> f.read() # read all the file at the same time\n\"the first line\\\
    nthe second line\\n\"\n>>> f.close()\n```\n\nReading every line as an array:\n\
    \n```python\n>>> f = open('myfile.txt', 'r')\n>>> f.readlines() # read all the\
    \ file at the same time\n[\"the first line\\n\", \"the second line\\n\"]\n>>>\
    \ f.close()\n```\n\nReading a single line:\n\n```python\n>>> f = open('myfile.txt',\
    \ 'r')\n>>> f.readline() # read first line\n\"the first line\\n\"\n>>> f.close()\n\
    ```\n\n## Append Data\n\nThe file must be opened using ‘a’ to do this:\n\n```python\n\
    >>> f = open('myfile.txt', 'a')\n>>> f.write(\"the third line\\n\")\n```\n\n##\
    \ Using a For Loop\n\nThe file pointer is required to iterate through files:\n\
    \n```python\n>>> f = open('myfile.txt', 'r')\n>>> for line in f:\n...     print(line)\n\
    ```\n\nthe first line\nthe second line\nthe third line\n"
