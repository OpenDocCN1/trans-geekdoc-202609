    # Chapter Three: Classification Machine Learning Models


    ![image](d2d_images/chapter_title_below.png)


    Classification models are used on both unstructured and structured data. The technique
    categorizes data into a specified number of classes, and the primary goal is to
    identify the class or category that new data will all into.


    Some of the terminology you will come across includes:


    *   Classifier – algorithm for mapping input data to categories


    *   Classification Model – a machine learning model that takes input values for
    training purposes and attempts to draw conclusions from it. These models predict
    categories and labels for new data


    *   Features – an individual property of an observed phenomenon; these properties
    are measurable


    *   Binary Classification – a classification tasks that has two potential outcomes,
    for example, a gender classification task, Male/Female


    *   Multi-class Classification – a classification that has two or more classes;
    every sample is assigned to just one target label, for example, and insect may
    be a fly or a spider, but it cannot be both at the same time


    *   Multi\-label Classification – classification, where the samples are individually
    mapped to sets of target labels, i.e., two or more classes. For example, news
    articles can be about people, locations, and activities at the same time.


    To build a classification model:


    *   The classifier you want to use must be initialized


    *   The classifier must then be trained. The classifiers included in Scikit-learn
    use a fit method (X, y) for training or fitting the model. The training data is
    X, and the training label is y.


    *   The target is predicted. With an observation, X, that has no label, predict(X)
    will return y, the expected and predicted label


    *   The model is evaluated


    *   Initialize the classifier to be used.


    *   Train the classifier: All classifiers in [scikit-learn](https://analyticsindiamag.com/a-beginners-guide-to-scikit-learns-mlpclassifier/) uses
    a fit(X, y) method to fit the model(training) for the given train data X and train
    label y.


    *   Predict the target: Given an unlabeled observation X, the predict(X) returns
    the predicted label y.


    *   Evaluate the classifier model'
