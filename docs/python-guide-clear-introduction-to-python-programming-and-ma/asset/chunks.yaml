    # Python Numbers


    ![image](d2d_images/chapter_title_below.png)


    The number data type supports numerical values only, such as 3.14, -100, 0.000123,
    99999999, etc.


    There is support for three type of numerical value:


    *   int – integer values, which are whole numbers – 1, 100, -1000000, 987654321,
    for example


    *   float – floating point numbers, those with decimal points – 1.1, 3.14, -55.5,
    for example


    *   complex – complex numbers such as 1+8j, -1+8j, 25j, 5.5+3.14j, for example


    Integers


    All Python integer literals are part of the int class, for example:


    \>>> i = 150


    \>>> i


    The output is:


    150


    Floats


    A floating point number is a literal containing a decimal point – here’s an example:


    \>>> f = 10.5


    \>>> f


    The output is:


    10.5'
