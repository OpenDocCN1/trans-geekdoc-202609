    You know that a list is a sequence and you know it is iterable which means a for
    loop may be used for looping through the list’s elements. Here’s an example:


    ```python

    >>> list = [1,2,3,4,5]

    >>> for i in list:

    ... print(i, end=" ")

    1 2 3 4 5

    ```


