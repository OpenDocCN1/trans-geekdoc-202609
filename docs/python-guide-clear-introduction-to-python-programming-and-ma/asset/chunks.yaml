    This algorithm builds up a cluster hierarchy. This starts with the data that has
    already been assigned to its own cluster; two clusters close together will be
    within the same cluster, and the algorithm ends when only a single cluster remains.


    # K-Means Clustering


    This is an iterative algorithm that looks for the largest value in each iteration.
    To start with, you select the required number of clusters. The data points must
    be clustered into `k` groups – the larger the `k`, the smaller the groups with
    more granularity, and the smaller the `k`, the larger the groups with less granularity.


    The algorithm outputs a group of labels, assigning a data point to every `k` group.
    The `k` groups are defined by a centroid in each group; these are seen as the
    heart of each cluster, capturing the nearest points and adding them to the cluster.
    `K-Means` clustering can be broken down into two more subgroups – dendrogram and
    agglomerative.


    ### Agglomerative Clustering


    The `k-means` clustering subgroup begins with a set number of clusters. All the
    data is allocated to that number. The technique doesn''t need to know the `k`
    number of clusters as the input, and the agglomeration begins when each data is
    formed into one cluster. Distance measures are used in agglomerative clustering,
    one measure for each iteration, for reducing the number of clusters by merging
    the processes. To finish, there is one large cluster that has all the objects
    or data in it.


    ### Dendrogram Clustering


    In this technique, every level is representing a potential cluster. The dendrogram''s
    height indicates how much similarity there is between two of the join clusters;
    the nearer the process bottom they are, the more similar the clusters are. Dendrograms
    tend to be unnatural and subjective techniques and are not used that often.


    # K-Nearest Neighbors


    This is, by far, the simplest classifier. It is different from other techniques
    in that a model isn''t produced. A simple algorithm, it stores the cases already
    available, and new instances are then classified using a similarity measure. It
    works best when the examples have some distance between them, and, on large training
    sets, it is a slow learner.


    # Principal Components Analysis (PCA)


    `PCA` is typically used for higher-dimensional space. A basis must be chosen for
    the space, along with the top 200 important scores. That basis is the principal
    component, and the subset you choose is a new, small space (smaller than the original).
    The technique will keep as much data complexity as it can.


    # Association


    This technique lets you find associations between objects in big databases, basically,
    relationships between variables. As an example, if a person buys a house, they
    are highly likely to purchase new furniture.


