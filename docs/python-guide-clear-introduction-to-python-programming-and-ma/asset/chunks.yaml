    # Exception Handling


    ![image](d2d_images/chapter_title_below.png)


    Exception handling in Python is all about handling errors in the right way, perhaps
    having a message display on the screen if a specified file cannot be found. Errors
    are handled using a try, except code block, and the syntax is:


    try:


    \# write a little code


    \# that could throw an exception


    except <ExceptionType>:


    \# Exception handler, alert the user


    In the try block, a piece of code needs to be written, that might potentially
    throw an exception. When that exception happens, the code inside the try block
    is ignored. If, in the except clause to the block, there is an exception type
    that matches, the clause handler will be executed. Here’s an example:


    try:


    f = open(''somefile.txt'', ''r'')


    print(f.read())


    f.close()


    except IOError:


    print(''file not found'')


    Here’s how this works:


    First, the initial statement written between the try block and the except block
    is executed.


    If there is no exception thrown, the code written in the except clause is ignored.


    If the specified file doesn’t exist, an exception is raised, and the remainder
    of the try block code will be ignored.


    When an exception is thrown, the code inside the except clause will be executed,
    provided the type matches with the exception name listed after the except keyword,.


    Note:


    The code above can only handle an IOError exception. If you want to handle other
    types of error or exception, you must add other except clauses.


    Try statements can have multiple except clauses, along with an else and/or a finally
    statement as optional. Here’s an example:


    try:


    <body>


    except <ExceptionType1>:


    <handler1>


    except <ExceptionTypeN>:


    <handlerN>


    except:


    <handlerExcept>


    else:


    <process\_else>


    finally:


    <process\_finally>


    The except clause is very much like the elif statement. When an exception happens,
    it will be checked to see if the type matches the type in the except clause. If
    it does, the matching handler will be executed. Note that ExceptionType has been
    omitted from the final except clause. If there is no match to the exception type,
    the handler in the final except clause will be executed.


    Note:


    Statements listed under the else clause will only run when there is no exception
    raised, whereas those listed in the finally clause run whether or not the exception
    is raised.


    Have a look at an example:


    try:


    num1, num2 = eval(input("Enter a pair of numbers with a comma separating them
    : "))


    result = num1 / num2


    print("Result is", result)


    except ZeroDivisionError:


    print("Division by zero cannot be done and throws an error !!")


    except SyntaxError:


    print("you have missed a comma; make sure you add a comma between the numbers,
    for example, 1, 2")


    except:


    print("Incorrect input")


    else:


    print("No exceptions")


    finally:


    print("This executes, whatever happens")


    Note:


    Using the eval() function allows the program to run the code inside itself – eval()
    will expect to have a string argument.


    ## Raising Exceptions


    It is possible to raise an exception from one of your methods by using the raise
    keyword, like this:


    raise ExceptionClass("the argument")


    Here’s an example:


    def enterage(age):


    if age < 0:


    raise ValueError("You can only have positive integers")


    if age % 2 == 0:


    print("age is an even number")


    else:


    print("age is an odd number")


    try:


    num = int(input("Input your age: "))


    enterage(num)


    except ValueError:


    print("You can only have positive integers")


    except:


    print("something isn’t right")


    Try running this program, using a positive integer and see what the output is
    and then rerun it using a negative number.'
