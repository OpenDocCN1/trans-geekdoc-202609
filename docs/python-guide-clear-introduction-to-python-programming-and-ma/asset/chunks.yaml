    files that all work together. To install them, we need to run a script – a piece
    of code – that places specific files into the right directories. Many of the packages
    you require will also have dependencies, and Homebrew will find those and install
    them for you; it also keeps them in one place and let you know when there are
    available updates. Type the following code to install Homebrew:


