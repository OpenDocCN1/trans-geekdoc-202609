- fmt: '

    # Different Classification Algorithms for Python


    There are several major classification algorithms, and the one you use will depend
    entirely on the problem to be solved.


    ### Logistic Regression

    Logistic regression is one of the primary classification algorithms. The algorithm
    uses a `logistic function` to model the probabilities that describe the potential
    outcomes. It is specifically designed for classification and is one of the best
    models to help understand how multiple independent variables affect the outcome
    variable.


    However, it will only work with binary predicted variables; it assumes that every
    predictor is independent of the others and that the data has no missing values.


    ### Naïve Bayes

    Naïve Bayes is based on the `Bayes'' Theorem`, and it has the assumption that
    there is independence between feature pairs. These classifiers are well-suited
    to real-world problems, such as email spam filtering and classifying documents.
    For the right parameters to be estimated, a small amount of training is required,
    but the Naïve Bayes classifiers are much faster than other sophisticated classification
    methods.


    However, the downside is, it is not a good estimator.


    ### Stochastic Gradient Descent

    This is one of the simpler approaches to fitting linear models, not to mention
    incredibly efficient. It is a very useful algorithm to use when you have large
    numbers of samples, and it has support for multiple classification penalties and
    loss functions.


    It is very easy to implement, but several hyper-parameters are required, and it
    has a high sensitivity to feature scaling.


    ### K-Nearest Neighbors

    This is one of the lazier methods of learning as the model makes no attempt to
    build an internal model; it just stores the training data instances. The classification
    is done via a computation taking the majority vote of each point''s `k-nearest
    neighbors`.


    It is a simple algorithm to implement, stands up to training data with a lot of
    noise in it, and, if you have a large training data set, is very effective. However,
    the `k` value must be determined first, and, in computation terms, it is an expensive
    algorithm – each instance''s distance to all training samples must be computed.


    ### Decision Tree

    Decision trees take attribute data and corresponding classes, producing a rule
    sequence for classifying data. It is an easy algorithm to understand, and even
    easier to visualize. The data doesn''t need much preparation, and it can take
    categorical and numerical data.


    However, some trees are complex, and generalization is not very good. Decision
    trees also react to data variations; one small variation could end up with the
    generation of a totally different tree.


    ### Random Forest

    This is known as a ''meta estimator.'' The random forest classifier is used for
    fitting different decision trees on different dataset sub-samples. It improved
    the model''s predictive accuracy using average and has over-fitting under control.
    The size of the sub-sample will always be the same size as the input sample size.


    The advantages to the random forest classifier are that it can reduce overfitting
    and, typically, they are far more accurate than standard decision trees. However,
    the downsides are that implementation isn''t easy.


    ### Support Vector Machine

    This algorithm represents the training data as points in space, all in categories
    separated clearly by a wide gap. New data examples get mapped to the space, too,
    and depending on what side of the gap they land, a category is predicted.


    While the `SVM` is very effective for high-dimensional spaces, and while a training
    points subset is used in the decision function to ensure an efficient memory,
    you don''t get probability estimates directly; instead, five-fold cross-validation
    is used, but this is computationally expensive.


    ### Accuracy


    | Classification Algorithms | Accuracy | F1-Score |

    | --- | --- | --- |

    | Logistic Regression | 84.60% | 0.6337 |

    | Naïve Bayes | 80.11% | 0.6005 |

    | Stochastic Gradient Descent | 82.20% | 0.5780 |

    | K-Nearest Neighbors | 83.56% | 0.5924 |

    | Decision Tree | 84.23% | 0.6308 |

    | Random Forest | 84.33% | 0.6275 |

    | Support Vector Machine | 84.09% | 0.6145 |


    In the next chapter, we''ll take a look at unsupervised learning algorithms.


    # Chapter Four: Unsupervised Machine Learning Algorithms


    In terms of machine learning, unsupervised learning is where the model does not
    require any supervision. What that means is, the machine learning model works
    alone, usually with unlabeled data, discovering information. With unsupervised
    learning algorithms, you can move on to complex tasks, more complex than those
    you can process with supervised learning. However, it is a more unpredictable
    way of learning, compared to other methods.


    Let me give you an example of unsupervised learning.


    Let''s say that we have a baby girl and a family pet, a cute dog. She knows this
    dog; she can identify it. A couple of weeks later, her mom''s friend comes over,
    bringing her own dog with her.


    Now, although the baby girl has never seen this dog, she does recognize a few
    features. She can see it has two eyes and four legs, like the family dog. So,
    she can identify this new animal as a dog.


    That is unsupervised learning, where, rather than being taught something, you
    learn it from the data. In the case of supervised learning, the baby girl would
    have been told the new animal was a dog.


    ## Why Choose Unsupervised Learning?


    These are the primary reasons why you would use unsupervised learning:


    * Unsupervised learning is used for finding patterns in data you wouldn''t see

    * Unsupervised learning helps find useful features for categorization

    * Unsupervised learning is in real-time; all the input data analysis is done with
    the learners

    * Unlabeled data is easier to obtain from computers because labeled data requires
    human intervention


    ## Different Types of Unsupervised Machine Learning


    Unsupervised learning typically falls into two groups – association and clustering
    problems.


    ### Clustering

    Clustering is incredibly important in unsupervised learning because it primarily
    looks at finding patterns or structures in a series of data that hasn''t been
    categorized. These algorithms process data, finding groups, or clusters (if they
    exist). It is possible to modify the number of clusters the algorithm should find.


    There are a few types of clustering algorithms:


    * Exclusive (partitioning): Data is grouped in a way that each data may only be
    part of a single group; it cannot belong to two or more groups. An example of
    this is the `k-means` algorithm.

    * Agglomerative: Each data in this type of algorithm is a cluster. The cluster
    numbers are reduced by way of iterative unions between two close clusters. An
    example of this is `hierarchical clustering`.

    * Overlapping: This technique used fuzzy sets for clustering the data. Each data
    point may belong to multiple clusters, but each will have its own degree of membership.
    The data is then associated with the correct membership value. An example of this
    is the `Fuzzy C-Means` algorithm.

    * Probabilistic: The probabilistic technique creates clusters using a probability
    distribution. For example, keywords such as "man''s hat," "woman''s hat," "man''s
    scarf" and "woman''s scarf" would be clustered into two separate categories, either
    "man" and "woman" or "hat" and "scarf."


    ### Types of Clustering

    There are several different types of clustering, and we''re going to discuss six
    of them here briefly.


    Hierarchical Clustering

