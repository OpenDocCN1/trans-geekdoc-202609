    # Conclusion


    This book is by no means a comprehensive guide, but I have gone over the most
    important features of machine learning. You now know the difference between supervised
    and unsupervised learning, what regression and classification are all about, and
    the best algorithms to use. I hope that you managed to work through your first
    machine learning project, too and that it shone a light on what the subject is
    all about.


    It is a complex subject, and you should use this guide as a stepping stone to
    learning more. There are plenty of online courses and books on the subject that
    you can use to further your knowledge but, don''t forget; the best way to learn
    is practice.


    Machine learning is not something you can forget about and then hope to pick up
    where you left off. New algorithms are being created regularly and new projects
    and uses coming to light. Machine learning is the future, and learning it will
    put you in good stead and on a solid footing to succeed.


