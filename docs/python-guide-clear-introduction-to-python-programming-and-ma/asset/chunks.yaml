    # Chapter Seven – Ten Things You Should Know About Machine Learning


    ![image](d2d_images/chapter_title_below.png)


    Machine learning is a complex subject, not one you can learn in five minutes.
    It takes dedication, effort, no small amount of passion for what you are doing,
    and a lot of hard work. It is incredibly rewarding, though, and if you move onto
    data science and further your learning more, not only are you getting grips with
    the `Python` computer language, you are also giving yourself every chance to get
    into data science as a career.


    To help you out, these are ten things that you must understand about machine learning.


    1. Machine Learning is All Learning From Data. `AI` or artificial intelligence
    is a huge buzzword these days and, if there''s one thing for sure, machine learning
    defiantly lives up to the hype. You can use machine learning to solve an untold
    number of problems, so long as you put the correct training data to the correct
    machine learning algorithms, of course. Some people call machine learning `AI`
    and, if that''s what makes you happy, go for it. Just be aware that `AI` is just
    a buzzword, albeit a huge one, and it can mean whatever you want it to mean.


    2. Machine Learning is All About Data and Partly About Algorithms. There is definitely
    an increase in excitement levels about the huge leaps and bounds being made in
    machine learning, specifically in the algorithms and deep learning. But the key
    thing to remember with machine learning is that it''s all about data; that is
    the primary ingredient, and, without it, you simply can''t do any machine learning.
    You don''t need sophisticated or complex algorithms to learn, but you do need
    quality data.


    3. Don''t Use Complicated Models Unless You Have Vast Amounts of Data. Machine
    learning finds patterns that exist in data and then uses them to train the machine
    learning models, using specified parameters. If you have too large a parameter
    space, your training data will be overfitted, and the model you are training will
    not have the ability to generalize beyond that. In general, keep things a simple
    as you can, and that means matching your models to the level and complexity of
    data you are working with.

