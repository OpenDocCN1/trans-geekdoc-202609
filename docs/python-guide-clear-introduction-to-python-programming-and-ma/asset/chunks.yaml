- fmt: "\nA function is a piece of code that you can reuse; they are useful for proper\
    \ organization of code. Functions are created and used to run one statement set\
    \ several times in one program, so we don’t have to keep repeating ourselves and\
    \ writing repetitive code over and again.\n\n## Creating Functions\n\nThe `def`\
    \ keyword is used to begin a function, with this syntax:\n\n```python\ndef function_name(arg1,\
    \ arg2, arg3, .... argN):\n    #a statement inside a function\n```\n\nNote:\n\n\
    Every statement inside a function must be indented with an equal number of spaces.\
    \ Functions can accept none or more parameters (arguments), inside a set of parentheses.\
    \ And you can use the `pass` keyword to leave out the function body, like this:\n\
    \n```python\ndef myfunc():\n    pass\n```\n\nHere’s an example of how it works:\n\
    \n```python\ndef sum(start, end):\n    result = 0\n    for i in range(start, end\
    \ + 1):\n        result += i\n    print(result)\n\nsum(20, 60)\n```\n\nHere, we\
    \ have defined a function named `sum()`; it has two parameters, called `start`\
    \ and `end`. It calculates the sum of every number between `start` and `end`.\n\
    \n## Function With A Return Value\n\nThe function we wrote above just prints or\
    \ displays the result on your console. But what if we wanted to go further and\
    \ assign the result of the function to a variable so that we could do some more\
    \ processing on it? To do that, we would use a `return` statement, which, in turn,\
    \ will send the result to the caller and leave the function. Here’s how:\n\n```python\n\
    def sum(start, end):\n    result = 0\n    for i in range(start, end + 1):\n  \
    \      result += i\n    return result\n\ns = sum(20, 60)\nprint(s)\n```\n\nThe\
    \ `return` statement is used to return a result of the sum of all the numbers\
    \ and then assign that result to a variable called `s`.\n\nThe `return` statement\
    \ may also be used with no return value:\n\n```python\ndef sum(start, end):\n\
    \    if(start > end):\n        print(\"start must not be more than end\")\n  \
    \      return  # no value is returned so we return a special value of None instead\n\
    \    result = 0\n    for i in range(start, end + 1):\n        result += i\n  \
    \  return result\n\ns = sum(120, 60)\nprint(s)\n```\n\nThe output of this will\
    \ be:\n\nStart must not be more than end\nNone\n\nIf a function does not explicitly\
    \ return a value, `None` will always be returned instead:\n\n```python\ndef test():\
    \  #a test function that has one statement\n    i = 100\n\nprint(test())\n```\n\
    \nYou can see from this that there isn’t any value explicitly returned by the\
    \ function so that `None` will be returned instead.\n\n## Global Variables Vs.\
    \ Local Variables\n\n- Global variables – these are not bound to any specific\
    \ function; they are accessible inside the function and outside of it.\n- Local\
    \ variables – these are declared in a specific function and can only be accessed\
    \ within that function.\n\nHere are some examples:\n\nExample 1:\n\n```python\n\
    global_var = 12  # global variable\n\ndef func():\n    local_var = 100  # local\
