- fmt: "\nWe are also going to evaluate our models use the 'accuracy' metric, which\
    \ is a ration of how many instances are predicted correctly divided the how many\
    \ instances are in the dataset in total, and then multiplied by one hundred to\
    \ provide a percentage of accuracy, i.e., 97% accurate. The scoring variable `accuracy`\
    \ will be used next when the models are run, built, and evaluated.\n\n# Build\
    \ the Models\n\nAt this stage, we have no idea which would be the best algorithms\
    \ to use for this or the specific configurations to use. We can get a reasonable\
    \ idea by looking at our plots, that we have partly linearly separable classes\
    \ in some of the dimensions, so the results should be pretty good.\n\nWe're going\
    \ to test six algorithms:\n\n* Logistic Regression\n* Linear Discriminant Analysis\n\
    * K-Nearest Neighbors\n* Classification and Regression Trees\n* Gaussian Naive\
    \ Bayes\n* Support Vector Machines\n\nThis is a pretty good combination of simple\
    \ linear algorithms and nonlinear algorithms.\n\nHere’s how we build our models\
    \ and evaluate them:\n\n## Spot Check Algorithms\n\n```python\nmodels = []\n\n\
    models.append(('LR', LogisticRegression(solver='liblinear', multi_class='ovr')))\n\
    models.append(('LDA', LinearDiscriminantAnalysis()))\nmodels.append(('KNN', KNeighborsClassifier()))\n\
    models.append(('CART', DecisionTreeClassifier()))\nmodels.append(('NB', GaussianNB()))\n\
    models.append(('SVM', SVC(gamma='auto')))\n```\n\n## evaluate each model in turn\n\
    \n```python\nresults = []\nnames = []\n\nfor name, model in models:\n    kfold\
    \ = StratifiedKFold(n_splits=10, random_state=1, shuffle=True)\n    cv_results\
    \ = cross_val_score(model, X_train, Y_train, cv=kfold, scoring='accuracy')\n \
    \   results.append(cv_results)\n    names.append(name)\n    print('%s: %f (%f)'\
    \ % (name, cv_results.mean(), cv_results.std()))\n```\n\n## Select the Best Model\n\
    \nSo, we have our models and we have an accuracy estimate for each one. The next\
    \ step is to compare all the models to one another and choose the one that is\
    \ most accurate. If we run the above example, we would get something like this:\n\
    \nLR: 0.960897 (0.052113)\nLDA: 0.973974 (0.040110)\nKNN: 0.957191 (0.043263)\n\
    CART: 0.957191 (0.043263)\nNB: 0.948858 (0.056322)\nSVM: 0.983974 (0.032083)\n\
    \nWhat we can see here is that the `SVM` (Support Vector Machine) shows the biggest\
    \ accuracy score (estimated) of 98% or 0.98.\n\nA plot can be created showing\
    \ the evaluation results for each model, and showing each model's spread and mean\
    \ accuracy. Each algorithm has an accuracy measure population because we evaluated\
    \ each one ten times, using 10-fold cross-validation.\n\nOne of the best ways\
    \ of comparing the result's samples for the individual algorithms is with a box\
    \ and whisker plot for the individual distributions; those distributions are then\
    \ compared:\n\n## Compare Algorithms\n\n```python\npyplot.boxplot(results, labels=names)\n\
    pyplot.title('Algorithm Comparison')\npyplot.show()\n```\n\nIt's easy to see the\
    \ plots squashed in at the range's top, with lots of evaluations coming in 100%\
    \ accuracy. Some do push down around the high 80's as well.\n\n![Box and Whisker\
    \ Plot Comparing Machine Learning Algorithms on Iris Flowers](d2_images/image08.png)\n\
    \n# A Complete Example\n\nAgain, for reference, here is all tied together:\n\n\
    ```python\nfrom pandas import read_csv\nfrom matplotlib import pyplot\nfrom sklearn.model_selection\
    \ import train_test_split\nfrom sklearn.model_selection import cross_val_score\n\
    from sklearn.model_selection import StratifiedKFold\nfrom sklearn.linear_model\
    \ import LogisticRegression\nfrom sklearn.tree import DecisionTreeClassifier\n\
    from sklearn.neighbors import KNeighborsClassifier\nfrom sklearn.discriminant_analysis\
    \ import LinearDiscriminantAnalysis\nfrom sklearn.naive_bayes import GaussianNB\n\
    from sklearn.svm import SVC\n\n# Load dataset\nurl = \"https://raw.githubusercontent.com/jbrownlee/Datasets/master/iris.csv\"\
    \nnames = ['sepal-length', 'sepal-width', 'petal-length', 'petal-width', 'class']\n\
    dataset = read_csv(url, names=names)\n\n# Split-out validation dataset\narray\
    \ = dataset.values\nX = array[:,0]\ny = array[:,4]\nX_train, X_validation, Y_train,\
    \ Y_validation = train_test_split(X, y, test_size=0.20, random_state=1, shuffle=True)\n\
    \n# Spot Check Algorithms\nmodels = []\nmodels.append(('LR', LogisticRegression(solver='liblinear',\
    \ multi_class='ovr')))\nmodels.append(('LDA', LinearDiscriminantAnalysis()))\n\
    models.append(('KNN', KNeighborsClassifier()))\nmodels.append(('CART', DecisionTreeClassifier()))\n\
    models.append(('NB', GaussianNB()))\nmodels.append(('SVM', SVC(gamma='auto')))\n\
    \n# evaluate each model in turn\nresults = []\nnames = []\nfor name, model in\
    \ models:\n    kfold = StratifiedKFold(n_splits=10, random_state=1, shuffle=True)\n\
    \    cv_results = cross_val_score(model, X_train, Y_train, cv=kfold, scoring='accuracy')\n\
    \    results.append(cv_results)\n    names.append(name)\n    print('%s: %f (%f)'\
    \ % (name, cv_results.mean(), cv_results.std()))\n\n# Compare Algorithms\npyplot.boxplot(results,\
    \ labels=names)\npyplot.title('Algorithm Comparison')\npyplot.show()\n```\n\n\
    # Step Six - Make Some Predictions\n\nNext, we want to make some predictions and\
    \ we can only do that by choosing the right algorithm to use. We got an idea in\
    \ Step five that Support Vector Machine (`SVM`) algorithm is probably the most\
    \ accurate one for this problem so this will be the algorithm we use for the final\
    \ model.\n\nSo, now we need to get an idea of how accurate the model is on the\
    \ validation dataset. This is a final, independent check on accurate the best\
    \ model is. It's always a good idea to split your dataset into training and validation\
    \ sets, just in case something goes wrong during training, like data leak or overfitting.\
    \ If either of those happens, the results will be somewhat over-optimistic, and\
    \ that won't give you an accurate representation.\n\nSo to make our predictions,\
    \ the model needs to be fit onto the whole training dataset, and the predictions\
    \ are then made on the validation set. Here's how:\n\n## Make predictions on the\
    \ validation dataset\n\n```python\nmodel = SVC(gamma='auto')\nmodel.fit(X_train,\
    \ Y_train)\npredictions = model.predict(X_validation)\n```\n\n## Evaluate the\
    \ Predictions\n\nTo evaluate our predictions, we need to compare them with the\
    \ results expected from the validation dataset. Then the classification accuracy\
    \ must be calculated, along with a classification report and confusion matrix.\n\
    \n## Evaluate predictions\n\n```python\nfrom sklearn.metrics import accuracy_score\n\
    from sklearn.metrics import confusion_matrix\nfrom sklearn.metrics import classification_report\n\
    \nprint(accuracy_score(Y_validation, predictions))\nprint(confusion_matrix(Y_validation,\
    \ predictions))\nprint(classification_report(Y_validation, predictions))\n```\n\
    \nAs you can see, we have an accuracy of around 96% or 0.966 on our hold-out dataset\
    \ and the confusion matrix gives us an indication of three errors.\n\nLastly,\
    \ in the classification report, we can see each class broken down by recall, precision,\
    \ the f-1 score, and support and, although we did only use a small validation\
