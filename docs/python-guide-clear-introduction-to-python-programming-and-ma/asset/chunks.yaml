    \ up the given number; the nearest integer is returned |\n| `floor()` | rounds\
    \ up down and the nearest integer is returned |\n| `sqrt(x)` | the square root\
    \ of the given number is returned |\n| `sin(x)` | the sin of `x` is returned where\
    \ `x` is in radian |\n| `cos(x)` | the cosine of `x` is returned where `x` is\
    \ in radian |\n| `tan(x)` | the tangent of `x` is returned where `x` is in radian\
