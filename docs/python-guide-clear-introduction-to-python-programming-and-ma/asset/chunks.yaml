    from sklearn.linear\_model import LogisticRegression


    from sklearn.model\_selection import KFold


    from sklearn.ensemble import RandomForestClassifier


    from sklearn.tree import DecisionTreeClassifier, export\_graphviz


    from sklearn import metrics


    1.  Next, the dependent and the independent variables need to be extracted from
    the dataset:


    \# Extract just the independent variables


    X = df.iloc\[:, \[8, 10\]\] . values # the credit history and amount of loan


    \# Extract just the dependent variables


    y = df.iloc\[:, 12\].values #status of the loan


    1.  Now we can split the dataset into two – a training and a testing set. 75%
    goes to training and 25% for testing:


    \# Split the dataset into training and testing sets


    from sklearn.model\_selection import train\_test\_split


    X\_train, x\_test, y\_train, y\_test = train\_test\_split(X, y, test\_size = 0.25,
    random\_state = 0)


    We''re going to build our model using logistic regression, the ideal algorithm
    for when we have a binary dependent variable.


    1.  We standardize the independent features from a fixed range in the data using
    feature scaling:


    \# feature scaling


    from sklearn.preprocessing import StandardScalar


    sc\_X = StandardScalar()


    X\_train = sc\_X.fit\_transform(X\_train)


    X\_test = sc\_X.transform(X\_test)


