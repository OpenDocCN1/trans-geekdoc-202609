  \n## 类别分布\n\n现在我们想看看每个类别应该有多少行或实例，可以使用以下命令将其作为绝对计数来查看：\n\n` class distribution`\n\
  \n```\nprint(dataset.groupby('class').size())\n```\n\n每个类别共享相同数量的实例——33% 或 50 个实例。\n\
  \nclass\nIris-setosa 50\nIris-versicolor 50\nIris-virginica 50\n\n### 完整示例\n\n为了方便你阅读和使用，我们可以将所有这些内容整合在一个简单的脚本中：\n\
  \n` summarize the data`\n\n```python\nfrom pandas import read_csv\n\n### Load dataset\n\
  url = \"https://raw.githubusercontent.com/jbrownlee/Datasets/master/iris.csv\"\n\
  names = ['sepal-length', 'sepal-width', 'petal-length', 'petal-width', 'class']\n\
  dataset = read_csv(url, names=names)\n\n### shape\nprint(dataset.shape)\n\n### head\n\
  print(dataset.head(20))\n\n# descriptions\nprint(dataset.describe())\n\n### class\
  \ distribution\nprint(dataset.groupby('class').size())\n```\n\n### 第四步 - 数据可视化\n\
  \n现在，我们对数据有了一些了解；下一步是将其可视化。我们将查看两种不同的图表：\n\n1.  单变量图 – 为了更好地理解属性。\n2.  多变量图 – 为了更好地理解属性之间存在的关系。\n\
  \n### 单变量图\n\n单变量图将单独绘制每个变量。因为变量（输入）是数值，所以我们可以为每个变量使用箱线图。这是操作方法：\n\n` box and whisker\
  \ plots`\n\n```python\ndataset.plot(kind='box', subplots=True, layout=(2,2), sharex=False,\
  \ sharey=False)\npyplot.show()\n```\n\n这将清晰地向你展示输入属性是如何分布的：\n\n![鸢尾花数据集每个输入变量的箱线图](img/image025.png)\n\
  \n鸢尾花数据集每个输入变量的箱线图 (www.machinelearningmastery.com)\n\n查看分布的另一种方法是使用直方图：\n\n` histograms`\n\
  \n```python\ndataset.hist()\npyplot.show()\n```\n\n从结果来看，几个变量具有所谓的的高斯分布（正态分布）。这是一个非常有用的信息，因为有一些算法可以利用这种特性：\n\
  \n![鸢尾花数据集每个输入变量的直方图](img/image026.png)\n\n鸢尾花数据集每个输入变量的直方图 (www.machinelearningmastery.com)\n\
  \n### 多变量图\n\n接下来，我们需要查看存在哪些交互。首先，我们将创建散点矩阵，这有助于发现变量之间的关系：\n\n` scatter matrix`\n\
  \n```python\nscatter_matrix(dataset)\npyplot.show()\n```\n\n![输入变量的散点矩阵图](img/image027.png)\n\
  \n输入变量的散点矩阵 (www.machinelearningmastery.com)\n\n## 第五步 – 评估某些算法\n\n下一步是创建一些用于评估模型的数据。我们将涵盖：\n\
  \n1.  如何分离数据进行验证\n2.  如何设置一个使用 10 折交叉验证的测试框架\n3.  如何选择最佳模型\n\n### 创建验证集\n\n了解我们的模型是否运行良好至关重要。为了做到这一点，我们需要留出数据集的一部分，不让算法看到这些部分，然后将其用作未见过的数据。这意味着我们需要两个子集——80%\
  \ 的数据用于训练、评估和选择，剩余的 20% 用于验证模型。以下是执行该操作的命令：\n\n` Split-out validation dataset`\n\
  \n```python\narray = dataset.values\nX = array[:,0:4]\ny = array[:,4]\nX_train,\
  \ X_validation, Y_train, Y_validation = train_test_split(X, y, test_size=0.20, random_state=1)\n\
  ```\n\n你可能注意到使用了 Python 切片来选择 NumPy 数组列。如果你对 Python 有基础了解（读这本书之前应该是这样的），那么你以前进行过切片操作。\n\
  \n### 创建测试框架\n\n我们想要估计模型的准确率，为了实现这一点，我们将利用分层 10 折交叉验证。这将数据集拆分为十部分。我们将使用其中九部分进行训练，另一部分进行测试；然后对每种可能的训练和测试划分组合重复此操作。\n\
  \n\n\n\n我们还将使用“准确率”（accuracy）指标来评估我们的模型。该指标是预测正确的实例数量除以数据集中的总实例数量，然后乘以一百百，以百分比形式提供准确率，例如\
  \ 97% 的准确率。在后续运行、构建和评估模型时，将使用评分变量 `accuracy`。\n\n## 构建模型\n\n在此阶段，我们还不知道哪些算法是此任务的最佳选择，或者应该使用哪些特定的配置。通过观察图表，我们可以得到一个合理的想法：在某些维度上，类别是部分线性可分的，因此结果应该会非常理想。\n\
  \n我们将测试六种算法：\n\n* 逻辑回归 (Logistic Regression)\n* 线性判别分析 (Linear Discriminant Analysis)\n\
  * K 近邻算法 (K-Nearest Neighbors)\n* 分类与回归树 (Classification and Regression Trees)\n\
  * 高斯朴素贝叶 (Gaussian Naive Bayes)\n* 支持向量机 (Support Vector Machines)\n\n这是一个简单线性算法与非线性算法的良好组合。\n\
  \n以下是我们构建和评估模型的方法：\n\n## 快速检查算法 (Spot Check Algorithms)\n\n```python\nmodels = []\n\
  \nmodels.append(('LR', LogisticRegression(solver='liblinear', multi_class='ovr')))\n\
  models.append(('LDA', LinearDiscriminantAnalysis()))\nmodels.append(('KNN', KNeighborsClassifier()))\n\
  models.append(('CART', DecisionTreeClassifier()))\nmodels.append(('NB', GaussianNB()))\n\
  models.append(('SVM', SVC(gamma='auto')))\n```\n\n### 逐评估每个模型\n\n```python\nresults\
  \ = []\nnames = []\n\nfor name, model in models:\n    kfold = StratifiedKFold(n_splits=10,\
  \ random_state=1, shuffle=True)\n    cv_results = cross_val_score(model, X_train,\
  \ Y_train, cv=kfold, scoring='accuracy')\n    results.append(cv_results)\n    names.append(name)\n\
  \    print('%s: %f (%f)' % (name, cv_results.mean(), cv_results.std()))\n```\n\n\
  ## 选择最佳模型\n\n现在，我们已经有了模型，并且对每个模型都有一个准确率估计。下一步是比较所有模型，并选择最准确的一个。如果我们运行上面的示例，将得到类似如下的结果：\n\
  \nLR: 0.960897 (0.052113)\nLDA: 0.973974 (0.040110)\nKNN: 0.957191 (0.043263)\n\
  CART: 0.957191 (0.043263)\nNB: 0.948858 (0.056322)\nSVM: 0.983974 (0.032083)\n\n\
  从这里看到，`SVM`（支持向量机）显示出最高的（估计）准确率，98% 或 0.98。\n\n可以创建一个图表来显示每个模型的评估结果，并展示每个模型的分布和平均准确率。每个算法都有一个准确率总体，因为我们使用\
  \ 10 折交叉验证对每个模型进行了十次评估。\n\n比较各个算法结果样本的最佳方法之一是使用箱线图（box and whisker plot）来查看个体分布；然后对比这些分布：\n\
  \n### 比较算法\n\n```python\npyplot.boxplot(results, labels=names)\npyplot.title('Algorithm\
  \ Comparison')\npyplot.show()\n```\n\n很容易看出图表在范围顶部被挤压，许多评估结果达到了 100% 的准确率。有些结果也维持在\
  \ 80 多的高位。\n\n![在鸢尾花上比较机器学习算法的箱线图](img/image08.png)\n\n### 完整示例\n\n再次，为了参考，这里是整合后的完整代码：\n\
  \n```python\nfrom pandas import read_csv\nfrom matplotlib import pyplot\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn.model_selection import cross_val_score\n\
  from sklearn.model_selection import StratifiedKFold\nfrom sklearn.linear_model import\
  \ LogisticRegression\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.neighbors\
  \ import KNeighborsClassifier\nfrom sklearn.discriminant_analysis import LinearDiscriminantAnalysis\n\
  from sklearn.naive_bayes import GaussianNB\nfrom sklearn.svm import SVC\n\n### 加载数据集\n\
  url = \"https://raw.githubusercontent.com/jbrownlee/Datasets/master/iris.csv\"\n\
  names = ['sepal-length', 'sepal-width', 'petal-length', 'petal-width', 'class']\n\
  dataset = read_csv(url, names=names)\n\n# 划分验证数据集\narray = dataset.values\nX = array[:,0]\n\
  y = array[:,4]\nX_train, X_validation, Y_train, Y_validation = train_test_split(X,\
  \ y, test_size=0.20, random_state=1, shuffle=True)\n\n### 快速检查算法\nmodels = []\n\
  models.append(('LR', LogisticRegression(solver='liblinear', multi_class='ovr')))\n\
  models.append(('LDA', LinearDiscriminantAnalysis()))\nmodels.append(('KNN', KNeighborsClassifier()))\n\
  models.append(('CART', DecisionTreeClassifier()))\nmodels.append(('NB', GaussianNB()))\n\
  models.append(('SVM', SVC(gamma='auto')))\n\n### 逐评估每个模型\nresults = []\nnames =\
  \ []\nfor name, model in models:\n    kfold = StratifiedKFold(n_splits=10, random_state=1,\
  \ shuffle=True)\n    cv_results = cross_val_score(model, X_train, Y_train, cv=kfold,\
  \ scoring='accuracy')\n    results.append(cv_results)\n    names.append(name)\n\
  \    print('%s: %f (%f)' % (name, cv_results.mean(), cv_results.std()))\n\n### 比较算法\n\
  pyplot.boxplot(results, labels=names)\npyplot.title('Algorithm Comparison')\npyplot.show()\n\
  ```\n\n\n\n\n```python\nX = array[:,0:4]\n\ny = array[:,4]\n\nX_train, X_validation,\
  \ Y_train, Y_validation = train_test_split(X, y, test_size=0.20, random_state=1)\n\
  \n### 在验证集上进行预测\n\nmodel = SVC(gamma='auto')\n\nmodel.fit(X_train, Y_train)\n\n\
  predictions = model.predict(X_validation)\n\n### 评估预测\n\nprint(accuracy_score(Y_validation,\
  \ predictions))\n\nprint(confusion_matrix(Y_validation, predictions))\n\nprint(classification_report(Y_validation,\
  \ predictions))\n```\n\n请一步步完成这个教程，并且在没有完全掌握某个步骤及其包含的所有内容之前，不要继续进行。你不需要从一开始就理解所有内容，并不是一开始就能做到。你的目标是获得一个结果，如果你正确地运行这个教程，你就能得到。在学习过程中，记录下你可能有的任何问题。请使用\
