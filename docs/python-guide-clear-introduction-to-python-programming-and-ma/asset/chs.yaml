  \ `LoanAmount`（贷款金额）列包含一些极端值。这些数据需要进行处理，我们通过数据清洗（data wrangling）来处理，以便我们对数据进行归一化和标准化。\n\
  \n让我们看看使用 `Pandas` 进行数据清洗。\n\n## 使用 Pandas 进行数据清洗\n\n数据清洗（Data wrangling）是用于描述清理和统一复杂的、某种杂乱的数据集的术语。这些是数据清洗的主要处：\n\
  \n*   它可以告诉你许多关于你的数据的信息\n*   它可以帮助你做出更好的业务决策\n*   帮助收集对业务有意义的精确数据\n\n在现实世界中，业务产生几乎所有数据都是杂乱的，并且会有缺失值。以贷款数据集为例，某些列缺少了一些值。\n\
  \n要检查你的数据中是否存在缺失值：\n\n![missing value](img/image003.jpg)\n\nhttps://www.simplilearn.com/\n\
  \n我们可以通过几种不同的方式填充缺失值，业务场景将决定你使用哪些参数来填充它们。\n\n例如，你可以使用指定列的平均值来替换值：\n\n![mean](img/image007.jpg)\n\
  \nhttps://www.simplilearn.com/\n\n或者你可以使用 `dtypes` 来查看每列的数据类型：\n\n![image](img/image024.jpg)\n\
  \nhttps://www.simplilearn.com/\n\n你甚至可以合并数据框并通过 `merge` 和 `concatenation` 方法将它们合并。\n\
  \n是时候构建模型了，为了此，我们将使用 `Scikit-learn`。\n\n## 构建模型\n\n注意，在本节中混合了编写的代码和图像（感谢来自 [`www.simplilearn.com/`](https://www.simplilearn.com/)）。请同等对待它们；如果你正在按照此操作并在\
  \ Python 中输入命令，只需输入你在图像上看到的内容。\n\n1. 首先，我们需要从 `scikit-learn` 导入几个模型：\n\n# 从 scikit-learn\
  \ 模块导入模型：\n\n```python\nfrom sklearn.linear_model import LogisticRegression\nfrom\
  \ sklearn.model_selection import KFold\nfrom sklearn.ensemble import RandomForest\n\
  from sklearn.tree import DecisionTreeClassifier\nfrom sklearn import metrics\n```\n\
  \n2. 接下来，需要从此处提取因变量和自变量：\n\n```python\nfrom sklearn.linear_model import LogisticRegression\n\
  from sklearn.model_selection import KFold\nfrom sklearn.ensemble import RandomForest\n\
  from sklearn.tree import DecisionTreeClassifier\nfrom sklearn import metrics\n\n\
  ### 提取自变量\nX = df.iloc[:, :-1]\n### 提取因变量\ny = df.iloc[:, -1]\n```\n\n3. 现在将数据集划分为训练集和测试集：\n\
  \n```python\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection\
  \ import KFold\nfrom sklearn.ensemble import RandomForest\nfrom sklearn.tree import\
  \ DecisionTreeClassifier\nfrom sklearn import metrics\n\n### 将数据集划分为训练和测试集\nX_train,\
  \ X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=0)\n\
  ```\n\n4. 我们使用特征缩放对数据进行标准化：\n\n```python\nfrom sklearn.linear_model import LogisticRegression\n\
  from sklearn.model_selection import KFold\nfrom sklearn.ensemble import RandomForest\n\
  from sklearn.tree import DecisionTreeClassifier\nfrom sklearn import metrics\n\n\
  # 使用缩放标准化数据\nsc = StandardScaler()\nX_train = sc.fit_transform(X_train)\nX_test\
  \ = sc.transform(X_test)\n```\n\n5. 然后我们对数据拟合模型：\n\n```python\nfrom sklearn.linear_model\
  \ import LogisticRegression\nfrom sklearn.model_selection import KFold\nfrom sklearn.ensemble\
  \ import RandomForest\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn\
  \ import metrics\n\n### 拟合模型\nmodel = LogisticRegression()\nmodel.fit(X_train, y_train)\n\
  ```\n\n6. 然后预测测试集：\n\n```python\nfrom sklearn.linear_model import LogisticRegression\n\
  from sklearn.model_selection import KFold\nfrom sklearn.ensemble import RandomForest\n\
  from sklearn.tree import DecisionTreeClassifier\nfrom sklearn import metrics\n\n\
  ### 预测测试集\ny_pred = model.predict(X_test)\n```\n\n7. 构建混淆矩阵来评估模型性能：\n\n```python\n\
  from sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection\
  \ import KFold\nfrom sklearn.ensemble import RandomForest\nfrom sklearn.tree import\
  \ DecisionTreeClassifier\nfrom sklearn import metrics\n\n# 构建混淆矩阵评估模型性能\ncm = confusion_matrix(y_test,\
  \ y_pred)\nprint(cm)\n```\n\n8. 模型准确率如何？\n\n```python\nfrom sklearn.linear_model\
  \ import LogisticRegression\nfrom sklearn.model_selection import KFold\nfrom sklearn.ensemble\
  \ import RandomForest\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn\
  \ import metrics\n\n### 模型准确率如何\nacc = accuracy_score(y_test, y_pred)\nprint(acc)\n\
  ```\n\n9. 预测为“是”的精确率：\n\n```python\nfrom sklearn.linear_model import LogisticRegression\n\
  from sklearn.model_selection import KFold\nfrom sklearn.ensemble import RandomForest\n\
  from sklearn.tree import DecisionTreeClassifier\nfrom sklearn import metrics\n\n\
  ### 预测为“是”的精确率\nprec = precision_score(y_test, y_pred)\nprint(prec)\n```\n\n10.\
  \ 最后，我们查找准确率：\n\n```python\nfrom sklearn.linear_model import LogisticRegression\n\
  from sklearn.model_selection import KFold\nfrom sklearn.ensemble import RandomForest\n\
  from sklearn.tree import DecisionTreeClassifier\nfrom sklearn import metrics\n\n\
  ### 最后，查找准确率\nacc = accuracy_score(y_test, y_pred)\nprint(acc)\n```\n\n\n\n\n\n\
  我们都要从某个地方开始，这就是通往数据科学阶梯的第一步。你不仅能学到 `Python` 语言的基础知识，还能对数据科学有一个初步介绍。你需要的最重要的工具之一是内置在\
  \ `Python` 库中的 `Jupyter Notebook`，它是帮助你学习所有所需内容的理想工具。\n\n## 开启你的学习\n\n加入一个社区。当你这样做时，你就将自己置于其他志同道合的人之中；这不仅能为你提供可能所需的帮助，还能增加你未来就业的机会。美国人力资源管理协会（SHRM）显示，大约\
  \ 30% 的招聘是通过员工推荐的。\n\n在 `Kaggle` 上创建一个账户，参加仅限成员的 `Dataquest Slack` 讨论，并加入你所在地区的本地\
  \ `Meetup` 群组。\n\n### 相关技能\n\n命令行界面（或 `CLI`）允许更快速地运行脚本，这意味着你可以更快地测试你的程序，并处理更多的数据。\n\
  \n## 第 2 步：做一些小型 Python 项目\n\n实践学习绝对是学习的最好方法；越早开始，你就越能准备好构建你自己的 `Python` 项目。先尝试小项目，例如为在线游戏制作一个计算器，或者一个从\
  \ `Google` 获取你所在地区天气数据的程序。当你构建此类小项目时，你学习 `Python` 的速度会快得多。这类小项目对于大多数编程语言来说都是标准做法，是确保你学习效果的最佳方法之一。\n\
  \n使用 `APIs` 积累经验并开始进行网络爬虫。这不仅能帮助你学习编程，还能帮助你理解收集数据涉及的环节。\n\n### 开启你的学习\n\n通过阅读博客文章、指南、开源代码等任何内容，你可以亲手实践。吸收新想法，巩固自己的学习成果，并观察他人是如何做的。\n\
  \n### 相关技能\n\n在 SQL 数据库上做一些工作。`SQL` 与数据库通信，对其进行修改、编辑和重组数据。它是数据科学中硬性要求的基石之一，超过 40%\
  \ 的数据科学家经常使用它。\n\n## 第 3 步：学习 Python 数据科学库\n\n并不是所有的编程语言都能为你提供完成某事的“最佳方法”，但 `Python`\
  \ 提供了，形式就是数据科学库。其中最好的三个是 `Matplotlib`、`NumPy` 和 `Pandas`。后者两个是探索和玩弄数据的绝佳方式，而 `Matplotlib`\
  \ 则帮助你以图表的形式创建数据可视化。\n\n### 开启你的学习\n\n多提问。多提问。`Python` 有庞大的开发者和专家社区支持，他们都准备好并愿意回答你的问题并帮助你学习。还有许多其他有用资源，如\
  \ `Dataquest's Slack`、`Quora`、`Stack Overflow` 等，那里充满了准备着帮助你并分享他们辛辛苦苦得的知识的人。\n\n\
  ### 相关技能\n\n学习如何使用 `Git` 进行代码版本控制。它是跟踪代码更改最流行的工具之一；这意味着你可以轻松地纠正错误、进行实验并与志同道合的人进行协作。\n\
  \n## 第 4 步：在学习 Python 的同时，建立数据科学作品集\n\n对于任何想成为数据科学家的人来说，这是绝对必要的。许多数据科学项目包含多个数据集，并应该能带给你许多有趣的见解。你的作品集不需要任何类型的主题，只需选择你感兴趣的数据集，并想出将它们结合的方法。\n\
  \n如果你展示了此类项目，你就在为他人提供了可以协作的内容，并向任何潜在雇主展示了你付出了精力和精力来学习 `Python` 以及其他编程技能。\n\n此外，你的作品集可以充当简历的角色，并突出你在旅程中学会的所有技能。\n\
  \n### 开启你的学习\n\n与他人交流、协作，并将注意力牢牢地集中在技术能力上。确保你利用时间培养与他人合作所需的所有软技能，重要的是，确保你理解你所使用的工具是如何工作的。\n\
  \n### 相关技能\n\n学习基础统计学并进阶中级。在学习用于数据科学的 `Python` 时，获得良好的统计学背景是一个好主意。它将赋予你正确的思维，确保你专注于正确的事情，确保你找到真正的解决方案和良好的见解，而不是重复地执行脚本。\n\
  \n## 第 5 步：在数据科学中应用高级技术\n\n最后一步是精炼你的技能。你的整个旅程将充满学习，但一旦你掌握了基础，就可以尝试参加进阶课程，以确保你涵盖了所有内容。\n\
  \n某些事情是你熟悉的——分类、`regression`、`k-means` 以及许多其他模型。你还可以学习如何对模型进行自助或如何使用 `scikit learn`\
  \ 构建神经网络。\n\n在学习的这个阶段，你可以承担一些项目，例如创建一个使用实时数据馈的模型，或者同样复杂的任务。\n\n## 记住\n\n持续学习。数据科学领域永不停止，它涵盖了数百个行业。需求增长之快，有非常多的学习机会。不要停止阅读，不要停止协作，绝对不要停止与他人交流。这样，你就能保持手感，并跟上不断变化的领域。\n\
