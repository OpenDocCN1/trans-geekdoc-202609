- "# Python 入门指南：Python 编程与机器学习入门指南\n\n\n\n\n\nAlex Campbell\n\n\n\n\n\n\n\n\n\n#\
  \ 第四章：无监督机器学习算法\n\n## 为什么选择无监督学习？\n\n## 无监督机器学习的不同类型\n\n### 聚类的类型\n\n## 监督机器学习 vs\
  \ 无监督机器学习\n\n## 无监督机器学习的应用\n\n## 使用无监督学习的缺点\n\n# 第五章：你的第一个机器学习项目\n\n## Python 机器学习的\
  \ Hello World\n\n## 逐步教程\n\n# 第六章：数据科学简介\n\n## 什么是数据科学？\n\n## 使用 Pandas 进行数据清洗\n\
  \n## 如何学习数据科学 Python\n\n# 第七章——关于机器学习你应该知道的十件事\n\n## 结论\n\n\nAlex Campbell\n\n##\
  \ 引言\n\nPython 是历史上最强大的计算机编程语言之一，我们将在第一节中讨论其中的几个原因。它的语法易于学习和使用，而且与其他编程语言相比，你通常不需要编写那么多的代码。这种语言的极简性有助于程序员在更短的时间内编写更多代码并开发出更复杂的程序。\n\
  \n本指南提供了你掌握 Python 编程基础所需内容。我刻意保持了它的简单性——毕竟这是一份快速上手指南。我提供了大量的代码示例来向你展示语法是如何工作的，同时还提供了在\
  \ Windows、Mac 和 Linux 系统上安装 Python 的指南。最后，我将提供帮助你写出更好代码的实用技巧。\n\n读完本指南，你将对 Python\
  \ 语言有更深入的理解，并作为你进一步学习的基石。请注意，本指南中使用的是 Python 3，而不是许多类似指南使用的 Python 2。准备好成为一名计算机程序员了吗？让我们开启这段旅程。\n\
  \n## 什么是 Python？\n\nPython 是 Guido Rossum 的心血，是一种简单、通用的编程语言。它以语法简单、代码易读而闻名，对于计算机编程的初学者来说，它是最好的入门语言之一。学习\
  \ Python 可以让你做很多事情，使用它也有许多优势。\n\n### 解释型语言\n\n这意味着使用解释器来解析你编写的任何程序，每次一行。对于编译型语言（如\
  \ `C` 语言），在执行或运行之前使用编译器对代码进行编译。解释型语言比编译型语言慢一点，不提供编译型语言的性能优势。然而，后者对于初学者来说太难、太复杂了，而且要求你编写每一个函数，即使是最基础的函数。高级编程任务有时要求你通过创建数据结构来封装数据。因此，在编译型语言中，在开始解决代码所编写的问题之前，必须处理所有小细节。而在解释型语言中，你不需要在使用变量之前定义它的数据类型。Python\
  \ 可以根据值自动推断。例如：\n\n```python\nmyvar = \"Good Python.\"\n```\n\n这意味着 `myvar` 的数据类型是字符串。此外，注意\
  \ Python 语句末尾不需要分号（`;`）。编译型语言需要此符号，而且它是错误发生最主要的区域之一——忘记添加分号会导致代码中出现各种错误。假设稍后我们想给\
  \ `myvar` 赋值为值 `1`：\n\n```python\nmyvar = 1\n```\n\n这会将变量变为 `int`（整数）类型。\n\n###\
  \ 动态类型\n\n如果你用 `JavaScript` 或 `PHP` 写过任何程序，你可能已经注意到两者都会自动将一种数据类型的数据转换为其他类型。例如：\n\
  \n```javascript\n1 + \"2\"\n```\n\n会被处理为 `12`。`1` 被转换为字符串类型并与 `2` 拼接（连接），因此结果 `12`\
  \ 是一个字符串。Python 不允许自动转换，所以相同的代码：\n\n```python\n1 + \"2\"\n```\n\n将导致如下错误：\n\n```\n\
  Traceback (most recent call last):\n  File \"main.py\", line 2, in <module>\n1 +\
  \ \"2\"\n```\n\n### 代码越少 = 成就越多\n\nPython 实现其他程序功能所需的代码少得多；例如，它使用的代码比 `Java` 少大约三分之一或五分之一。你只需要行代码就可以读取\
  \ Python 文件：\n\n```python\nwith open(\"myfile.txt\") as f:\n    print(f.read())\n\
  ```\n\n例如：这些行创建一个包含数据“Let’s Learn Python”的 `\"myfile.txt\"` 文件：\n\n```python\nwith\
  \ open(\"myfile.txt\", \"w\") as f:\n    f.write(\"Let’s Learn Python\")\n```\n\n\
  这两行代码都会从 `myfile.txt` 读取数据：\n\n```python\nwith open(\"myfile.txt\") as f:\n    print(f.read())\n\
  ```\n\n输出将是：\nLet’s Learn Python\n\n不要太担心用于读写文件的命令；随着书籍的推进，我将涵盖所有内容。\n\n### 谁在使用\
  \ Python？\n\n许多大型机构都使用 Python，例如 NASA、`Google`、`HortonWorks`、`Quora` 等。你想知道用它能构建什么吗？几乎任何东西，包括：\n\
  \n*   Web 应用\n*   GUI 应用\n*   从网站爬取数据\n*   数据分析\n*   开发游戏\n*   为系统管理构建工具\n*   以及更多\n\
  \n现在你知道 Python 是什么以及可以用它做什么了，我们将转向在 Windows、Mac 和 Linux 系统上设置环境并安装。\n\n## 安装 Python\
  \ 3 - Windows\n\n第一步是将 Python 下载到你的 Windows 机器上，前往 `https://www.python.org/downloads`\
  \ 并下载最新的 Windows 版本。在下载过程中，你会看到一个“Customize Python”窗口——确保勾选了“Add Python.exe to Path”选项。\n\
  \n安装 Python 后，在你的 Windows PC 上打开命令提示符——你可以在开始菜单的搜索框中输入 `cmd`，或者打开开始菜单，点击 Windows\
  \ 系统 > 命令提示符。\n\n在命令提示符中输入\n\n```bash\npython\n```\n\nPython 解释器打开了；输入以下内容检查是否正常工作：\n\
  \n```python\nprint(\"Good Morning World\")\n```\n\n你将在屏幕上看到以下内容：\nGood Morning World\n\
  \n安装文本编辑器\n\n\n\n\n\n你需要一个文本编辑器来编写 Python 程序，你可以使用任何你喜欢的编辑器。Windows 自带了 `Notepad`（记事本），但更好的是\
  \ `Notepad++` 甚至是 `Sublime Text`。做出你的选择并通过互联网下载它们。\n\n在我们查看其他平台之后，我们将开始学习运行 Python\
  \ 程序。\n\n顺便说一下：虽然我正在向你展示如何在 Mac 和 Linux 上安装，但本书基于 Windows 版本的 Python 编写——不过，所有平台的代码都是相同的，所以你在跟进时不应该遇到任何问题。\n\
