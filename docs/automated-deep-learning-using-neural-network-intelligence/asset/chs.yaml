  \n\n\n在不显著降低准确性的前提下，模型压缩技术之一是模型剪枝。剪枝通过消除一些模型权重来优化模型。\n\n它可以消除大量的模型权重，且对模型性能的影响忽略不计。剪枝后的模型更轻量、更快。剪枝是一种简单的方法，可以带来良好的模型加速效果。\n\
  \nNNI 提供了一个工具包帮助用户执行模型剪枝算法。NNI 2.7 版本（本书使用的版本）仅支持 PyTorch 框架的剪枝。\n\n本章将学习几种剪枝算法，并如何在实践中应用它们。\n\
  \n# 什么是模型剪枝？\n\n复杂的神经网络有很多层和许多权重。`ResNet`、`DenseNet` 和 `VGGNet` 存储权重就需要几十 MB 的空间。开发者经常使用这些架构来解决许多实际问题。但所选架构对于要解决的问题来说往往过于冗余，包含了许多额外的权重，甚至是额外的层。在实践中，你可以从模型中移除多余的权重，这将显著加快神经网络的计算。有时，深度学习模型完美地拟合了问题，没有显式的冗余。尽管如此，它们的计算量仍然太大，无法部署到它们运行所需的特殊设备上。在这种情况下，开发者可能会为了加速而牺牲模型的准确性。\n\
  \n# 第 6 章 模型剪枝\n\n让我们描述一下剪枝算法的操作过程：\n\n1. 我们选取一个想要剪枝的、现成的预训练深度学习模型。\n2. 剪枝算法消除（剪枝）神经网络中的若干权重。我们所说的“消除”是指算法将这些权重置零。权重置零会显著加快计算，因为乘以\
  \ `0` 始终等于 `0`，不需要进行复杂的计算。通常，待消除的候选权重已经接近 0，因此将它们置零不应严重影响模型的性能。\n3. 剪枝后的模型在与原始模型相同的数据集上重新训练（微调），但置零的权重不再改变值，并始终保持为\
  \ 0。在重新训练期间，活跃权重会尝试接管被移除神经元的功能，以继续成功解决问题。\n\n图 6-1 展示了剪枝算法。\n\n**图 6-1.** 剪枝算法应用\n\
  \n剪枝是一项 get 的技术，但有时它会降低模型性能。在复杂的神经网络中，并不总是可以在不损害模型准确性的情况下移除权重。然而，模型准确性的下降可以降到最低，稍后我们将看到，压缩\
  \ 80% 的模型且几乎不损失准确性。\n\n**注意** `fine-tuning`（微调）是指从未剪枝权重的最终训练值开始进行重新训练的技巧。在本章中，我们将交叉使用\
  \ `fine-tuning` 和 `retraining`（重新训练）这两个术语。\n\n# LeNet 模型剪枝\n\n理解模型剪枝概念的最佳方法是付实践。让我们回到著名的\
  \ LeNet 模型和经典的 MNIST 问题。LeNet 模型的设计如列表 6-1 所示（完整代码在相应的文件中：`ch6/model/pt_lenet.py`）。\n\
  \n`PtLeNetModel` 提供了熟悉的模型设计：\n\n```python\nclass PtLeNetModel(nn.Module):\n    def\
  \ __init__(self, fs = 16, ks = 5):\n        super(PtLeNetModel, self).__init__()\n\
  \        self.conv1 = nn.Conv2d(1, fs, ks)\n        self.conv2 = nn.Conv2d(fs, fs\
  \ * 2, ks)\n        self.conv3 = nn.Conv2d(fs * 2, fs * 2, ks)\n        self.fc1\
  \ = nn.Linear(288, 64)\n        self.fc2 = nn.Linear(64, 32)\n        self.fc3 =\
  \ nn.Linear(32, 10)\n\n    def forward(self, x):\n        x = F.relu(self.conv1(x))\n\
  \        x = F.relu(self.conv2(x))\n        x = F.max_pool2d(x, 2, 2)\n        x\
  \ = F.relu(self.conv3(x))\n        x = F.max_pool2d(x, 2, 2)\n        x = torch.flatten(x,\
  \ start_dim = 1)\n        x = torch.relu(self.fc1(x))\n        x = torch.relu(self.fc2(x))\n\
  \        x = torch.relu(self.fc3(x))\n        return F.log_softmax(x, dim = 1)\n\
  ```\n\n接下来，我们添加两个未来需要的辅助方法：`count_nonzero_weights` 和 `count_total_weights`。`count_nonzero_weights`\
  \ 是一个统计神经网络权重中零个数的辅助方法，`count_total_weights` 统计神经网络权重的总数。\n\n```python\ndef count_nonzero_weights(self):\n\
  \    counter = 0\n    for params in list(self.parameters()):\n        counter +=\
  \ torch.count_nonzero(params).item()\n    return counter\n\ndef count_total_weights(self):\n\
  \    counter = 0\n    for params in list(self.parameters()):\n        counter +=\
  \ torch.numel(params)\n    return counter\n```\n\n训练好的 `PtLeNetModel` 保存在以下文件：`ch6/data/lenet.pth`。它在测试\
  \ MNIST 数据集上显示出 0.991 的准确率。列表 6-2 展示了如何进行剪枝。\n\n**列表 6-1.** LeNet 模型\n\n接下来，我们添加两个未来需要的辅助方法：`count_nonzero_weights`\
  \ 和 `count_total_weights`。`count_nonzero_weights` 是一个统计神经网络权重中零个数的辅助方法，`count_total_weights`\
  \ 统计神经网络权重的总数。\n\n**列表 6-2.** LeNet 模型 pruning `ch6/prune.py`\n\n```python\nimport\
  \ os\nimport random\nimport torch\nimport matplotlib.pyplot as plt\nfrom ch6.datasets\
  \ import mnist_dataset\nfrom ch6.model.pt_lenet import PtLeNetModel\nfrom nni.algorithms.compression.pytorch.pruning\
  \ import LevelPruner\n\n# Making reproducible\nCUR_DIR = os.path.dirname(os.path.abspath(__file__))\n\
  random.seed(1)\ntorch.manual_seed(1)\n\n# Loading pre-trained LeNetModel\nmodel\
  \ = PtLeNetModel()\npath = f'{CUR_DIR}/../data/lenet.pth'\nmodel.load_state_dict(torch.load(path))\n\
  \n# Loading MNIST dataset\ntrain_ds, test_ds = mnist_dataset()\n\n# Storing accuracy\
  \ of original model\noriginal_acc = model.test_model(test_ds)\n\n# Storing nonzero\
  \ weights of original model\noriginal_nzw = model.count_nonzero_weights()\n\n# Next,\
  \ we are pruning the original model with one-shot LevelPruner\nprune_config = {\n\
  \    'sparsity': .8,\n    'op_types': ['default'],\n}\n\n# LevelPruner\npruner =\
  \ LevelPruner(model, prune_config)\n\n# Compressing the original model\nmodel_pruned,\
  \ _ = pruner.compress()\n\n# Fine-tuning (retraining compressed model):\nepochs\
  \ = 10\nacc_list = []\nfor epoch in range(1, epochs + 1):\n    model_pruned.train_model(epochs\
  \ = 1, train_dataset = train_ds)\n    acc = model_pruned.test_model(test_dataset\
  \ = test_ds)\n    acc_list.append(acc)\n    print(f'Pruned: Epoch {epoch}. Accuracy:\
  \ {acc}.')\n\n# Since the compressed model is fine-tuned, let’s visualize retraining\
  \ progress:\npruned_nzw = model_pruned.count_nonzero_weights()\nplt.title(\n   \
  \ 'Fine-tuning\\n'\n    f'Original Non-zero weights number: {original_nzw}\\n'\n\
  \    f'Pruned Non-zero weights number: {pruned_nzw}')\nplt.axhline(y = original_acc,\
  \ c = \"red\",\nlabel = 'Original model accuracy')\nplt.plot(acc_list, label = 'Pruned\
  \ model accuracy')\nplt.xlabel('Retraining Epochs')\nplt.ylabel('Accuracy')\nplt.legend()\n\
  plt.show()\n```\n\n可视化结果如图 6-2 所示。\n\n\n\n仅权重。在重新训练开始时，压缩后的模型准确率低于原始模型。但在 10 个训练周期后，压缩后的模型达到了与原始模型相同的精度，在\
  \ 59,780 个权重中仅有 12,107 个激活权重。显然，原始的 LeNet 模型是冗余的，可以被剪枝后的模型取代。\n\n最后，让我们保存剪枝模型以供以后：\n\
  \n```python\nmodel_path = f'{CUR_DIR}/../data/lenet_pruned.pth'\nmask_path = f'{CUR_DIR}/../data/mask.pth'\n\
  pruner.export_model(\n    model_path = model_path,\n    mask_path = mask_path\n\
  )\n```\n\n326\n\n第 6 章 模型剪枝\n\nNNI 提供了一个特殊的包装器，允许加载剪枝模型 `nni.compression.pytorch.ModelSpeedup`\
