  \n我们可以将进化调优器视为一种引导的随机搜索。它比随机搜索稍微好，但由于该算法过强的随机性，仍然存在许多问题。进化调优器通常需要许多试验，但通常因为其简单性而被选中。\n\
  \n121\n\n## 第 3 章 Shell 下的超参数优化\n\n### 退火调优器（Anneal Tuner）\n\n退火调优器基于模拟退火算法（Simulated\
  \ Annealing）。模拟退火是解决优化问题的方法。该算法模拟了加热材料并缓慢降低温度以减少缺陷的物理过程，从而使系统能量最小化。退火调优器同样将随机性作为搜索过程的一部分。\n\
  \n退火算法包含以下步骤：\n\n1. 退火算法在搜索空间中选择一个随机元素 `X`，并计算 `f(X)` 值。\n2. 算法对元素 `X` 执行随机变异，产生搜索空间中的元素\
  \ `X'`。如果 `X` 是一个实值，则 `X'` 可以计算为 `X’ = X + ΔX`，其中 `ΔX` 是随机变量。接下来，我们比较 `f(X’)` 和\
  \ `f(X)`。\n3a. 如果 `f(X’) < f(X)`，则该变异被认为是负的。\n3b. 如果 `f(X’) ≥ f(X)`，则该变异被认为是正的，并通过\
  \ `X'` 更新 `X` 值。\n4. 如果变异是负的，算法计算以下值：\n   - `r`：(0, 1)上的均匀随机值。\n   - `Δ`：`f(X) -\
  \ f(X’)`。\n   - `σ` 是搜索过程中所有探索值的标准差：`f(X1), ..., f(Xn)` 乘以退化率 `ci`，其中 `c` 是小于 1\
  \ 的正值，`i` 是迭代次数，`σ = ci * std([f(X1), ..., f(Xn)])`。\n   接下来，我们比较 `r` 和 `e`，其中 `e`\
  \ 是指数。\n5a. 如果 `r < e`，则算法从 `X` 退化到 `X’`：`X ← X’`。为了在下次迭代中达到新的峰。\n5b. 如果 `r > e`，则算法不更新\
  \ `X`。`f(X)` 越接近 `e`，越可能采取探索步骤。步骤 2 到 5 重复 `n` 次。\n\n122\n\n![](img/index-136.png)\n\
  \n## 第 3 章 Shell 下的超参数优化\n\n***图 3-8.** 退火算法*\n\n退火算法的本质是到达“山峰”。在某些情况下，算法可能会下降“山峰”以爬上更高的一个。该算法的缺点是无法覆盖“山峰”之间的巨大距离。图\
  \ 3-8。\n\n123\n\n![](img/index-137.png)\n\n## 第 3 章 Shell 下的超参数优化\n\n***图 3-9.**\
  \ 执行中的退火算法*\n\n退火调优器的配置示例：\n\n```yaml\ntuner:\n  name: Anneal\npopulation_size:\
  \ 100\nclass_args:\n  optimize_mode: maximize\n```\n\n完整代码位于文件 `ch3/tuners/anneal_tuner/run_experiment.py`。\n\
  \n124\n\n![](img/index-138.png)\n\n## 第 3 章 Shell 下的超参数优化\n\n***图 3-10.** Holder\
