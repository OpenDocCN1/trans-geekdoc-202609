  ![](img/index-342_1.png)\n\n第 6 章 模型剪枝\n\n## 一次性剪枝器 (One-Shot Pruners)\n\n一次性剪枝算法根据特定指标仅剪枝一次权重。\n\
  \n通常，剪枝后的权重接近零，剪枝器建议删除它们不会影响模型的准确率。一次性剪枝器的工作方式如下：\n\n- 剪枝器接收一个模型并选择激活权重和要剪枝的权重。结果是剪枝器返回一个模型和一个二值掩码，其中\
  \ 1 表示激活权重，0 表示要剪枝的权重。\n- 通过剪枝冗余权重加速原始模型，从而得到一个压缩模型。\n- 微调算法重新训练压缩模型以调整其权重。\n\n\
  一次性剪枝器的流程如图 6-3 所示。\n\n***Figure 6-3. 一次性剪枝***\n\n我们可以按照以下步骤使用 NNI 实现剪枝算法：\n\n1.\
  \ 加载预训练模型\n2. 初始化剪枝器\n3. 剪枝模型\n4. 重新训练压缩模型\n5. 保存压缩模型\n6. 加载并加速压缩模型\n\n**Step 1**.\
  \ 加载模型的 PyTorch 操作：\n\n```python\nmodel = Some()\nmodel.load_state_dict(torch.load(model_path))\n\
  ```\n\n**Step 2**. 为了初始化剪枝器，我们必须指定剪枝器配置（将在下一节讨论）。这是剪枝器的示例：\n\n```python\npruner_config\
  \ = {\n    'sparsity': 0.8,\n    'op': 'default'\n}\npruner = Some(model, pruner_config)\n\
  ```\n\n**Step 3**. 剪枝器逻辑压缩原始模型：\n\n```python\nmodel_pruned, mask = pruner.compress()\n\
  ```\n\n**Step 4**. 压缩模型按照原始模型的方式进行重新训练：\n\n```python\nfor epoch in range(1, epochs\
  \ + 1):\n    model_pruned.train()\n```\n\n**Step 5**. 使用 `pruner.export_model` 保存压缩模型：\n\
  \n```python\nmodel_path = f'{CUR_DIR}/../data/{pruner_name}_pruned.pth'\nmask_path\
  \ = f'{CUR_DIR}/../data/{pruner_name}_mask.pth'\npruner.export_model(\n    model_path\
  \ = model_path,\n    mask_path = mask_path\n)\n```\n\n**Step 6**. 压缩模型被 `nni.compression.pytorch.ModelSpeedup`\
  \ 类加载并加速：\n\n```python\ndummy_input = torch.randn(model_input_shape)\nmodel_pruned\
  \ = Some()\nmodel_pruned.load_state_dict(torch.load(model_path))\nspeedup = Speedup(model_pruned,\
  \ dummy_input, mask_path)\nspeedup.speedup_model()\n```\n\n330\n\n第 6 章 模型剪枝\n\n\
  这就！压缩模型已准备就！让我们创建一个辅助脚本，应用我们之前定义的步骤 2-6 并返回压缩模型。\n\n导入模块：\n\n***Listing 6-4.***\
  \ 剪枝实现。`ch6/algos/utils.py`\n\n```python\nimport copy\nimport os\nimport torch\n\
  from nni.compression.pytorch import ModelSpeedup\nfrom torchsummary import summary\n\
  \nCUR_DIR = os.path.dirname(os.path.abspath(__file__))\n```\n\n`oneshot_prune` 方法接受以下参数：\n\
  \n- `model_original`: 预训练原始模型\n- `pruner_cls`: 剪枝器类\n- `pruner_config`: 剪枝器配置\n\
  - `train_ds`: 训练数据集\n- `epochs`: 训练周期\n- `model_input_shape`: 模型输入\n\n```python\n\
  def oneshot_prune(\n    model_original,\n    pruner_cls,\n    pruner_config,\n \
  \   train_ds,\n    epochs=10,\n    model_input_shape=(1, 28, 28)\n):\n    pruner_name\
  \ = pruner_cls.__name__\n    model = copy.deepcopy(model_original)\n```\n\n331\n\
  \n第 6 章 模型剪枝\n\n**Step 2**. 初始化剪枝器：\n\n```python\npruner = Some(model, pruner_config)\n\
  ```\n\n**Step 3**. 压缩原始模型：\n\n```python\nmodel_pruned, mask = pruner.compress()\n\
  ```\n\n**Step 4**. 重新训练压缩模型：\n\n```python\nfor epoch in range(1, epochs + 1):\n\
  \    model_pruned.train(\n        epochs=1,\n        train_dataset=train_ds\n  \
  \  )\n```\n\n**Step 5**. 保存压缩模型：\n\n```python\nmodel_path = f'{CUR_DIR}/../data/{pruner_name}_pruned.pth'\n\
  mask_path = f'{CUR_DIR}/../data/{pruner_name}_mask.pth'\npruner.export_model(\n\
  \    model_path = model_path,\n    mask_path = mask_path\n)\n```\n\n**Step 6**.\
  \ 加载并加速压缩模型：\n\n```python\ndummy_input = torch.randn(model_input_shape)\nmodel_pruned\
  \ = Some()\nmodel_pruned.load_state_dict(torch.load(model_path))\nspeedup = Speedup(model_pruned,\
  \ dummy_input, mask_path)\nspeedup.speedup_model()\nmodel_pruned.eval()\n\nreturn\
  \ model_pruned\n```\n\n332\n\n第 6 章 模型剪枝\n\n**剪枝器配置**\n\n每个剪枝器都接受配置，该配置指定了其内部逻辑。剪枝器\n\
  \n\n配置是一个 `Dict` 条的 `List`，每个条目指定了应用于特定层集的剪枝策略。表 6-2 描述了剪枝器的配置参数。\n\n### 表 6-2.\
  \ 剪枝器配置\n\n| Key | Description |\n| :--- | :--- |\n| `sparsity` | 指定此配置条目中每个层的稀疏度。如果\
  \ `sparsity = 0.8`，则 80% 的层权重将被剪枝，保留 20% 的激活权重 |\n| `op_types` | 指定要压缩的操作类型。'default'\
  \ 表示遵循算法的默认设置。所有支持的 pytorch 模块类型定义在包文件 `nni/compression/pytorch/default_layers.py`\
  \ 中：`'Conv1d', 'Conv2d', 'Conv3d', 'ConvTranspose1d', 'ConvTranspose2d', 'ConvTranspose3d',\
  \ 'Linear', 'Bilinear', 'PReLU', 'Embedding', 'EmbeddingBag'` |\n| `op_names` |\
  \ 指定要压缩的操作名称。如果省略此字段，则将不会对此操作进行过滤 |\n| `op_partial_names` | 要压缩的操作部分名称。如果 `op_partial_names\
  \ = 'fc_'`，则所有符合掩码 `'fc*'` 的部分层都将被剪枝 |\n| `exclude` | 默认为 False。如果此字段为 true，则意味着指定类型和名称的操作将排除在压缩之外\
  \ |\n\n以下是一个应用于 LeNet 模型的一次性剪枝器（one-shot pruner）配置示例：\n\n```python\nprune_config\
  \ = [\n  {\n    'sparsity': .8,\n    'op_types': ['Conv2d'],\n  },\n  {\n    'sparsity':\
  \ .6,\n    'op_types': ['Linear'],\n  },\n  {\n    'op_names': ['fc3'],\n    'exclude':\
  \ True\n  }\n]\n```\n\n如果你不想为每种层类型指定特殊的剪枝策略，可以使用以下配置：\n\n```python\nprune_config\
  \ = [\n  {\n    'sparsity': .8,\n    'op_types': ['default']\n  }\n]\n```\n\n###\
  \ Level Pruner (层剪枝器)\n\nLevel pruner 是一种简单的一次性剪枝器。稀疏度级别（sparsity level）意味着剪枝比例，即\
  \ `sparsity=0.7` 意味着 70% 的模型权重参数将被剪枝。Level pruner 按绝对值对指定层中的权重进行排序，然后将幅度最小的权重掩码置零，直到达到所需的稀疏度级别为止。\n\
  \nLevel pruner 的应用方式如下：\n\n```python\nfrom nni.algorithms.compression.v2.pytorch.pruning\
  \ import LevelPruner\n\nprune_config = [{\n  'sparsity': .8,\n  'op_types': ['default'],\n\
  }]\n\npruner = LevelPruner(model, prune_config)\nmodel_pruned, mask = pruner.compress()\n\
  ```\n\n让我们使用 Listing 6-5 应用 LevelPruner 来剪枝 LeNet 模型。\n\n导入模块：\n\n**Listing 6-5.\
  \ LevelPruner. ch6/algos/one_shot/level_pruner.py**\n\n```python\nfrom nni.algorithms.compression.v2.pytorch.pruning\
  \ import LevelPruner\nfrom ch6.algos.utils import model_comparison, oneshot_prune,\
  \ visualize_mask\nfrom ch6.datasets import mnist_dataset\nfrom ch6.model.pt_lenet\
  \ import PtLeNetModel\n```\n\n加载预训练模型和 MNIST 数据集：\n\n```python\noriginal = PtLeNetModel.load_model()\n\
  train_ds, test_ds = mnist_dataset()\n```\n\n我们将以 0.8 的稀疏度剪枝 Conv2d 层，以 0.6 的稀疏度剪枝\
  \ Linear 层。此外，我们将最后的分类器线性层 `fc3` 排除在剪枝之外。\n\n```python\nprune_config = [\n  {\n\
  \    'sparsity': .8,\n    'op_types': ['Conv2d'],\n  },\n  {\n    'sparsity': .6,\n\
  \    'op_types': ['Linear'],\n  },\n  {\n    'op_names': ['fc3'],\n    'exclude':\
  \ True\n  }\n]\n```\n\n定义剪枝器：\n\n```python\npruner_cls = LevelPruner\n```\n\n使用\
  \ LevelPruner 压缩原始模型：\n\n```python\ncompressed, mask = oneshot_prune(\n  original,\n\
  \  pruner_cls,\n  prune_config,\n  train_ds,\n  epochs = 10\n)\n```\n\n可视化剪枝掩码：\n\
  \n```python\nvisualize_mask(mask)\n```\n\n图 6-4 显示了剪枝模型的掩码。我们看到掩码为线性层保留了 40% 的激活权重，为卷积层保留了\
  \ 20% 的激活权重。\n\n**图 6-4. LevelPruner 激活权重**\n\n比较原始模型和压缩模型：\n\n```python\nmodel_comparison(original,\
  \ compressed, test_ds, (1, 28, 28))\n```\n\n原始模型的准确率为 0.991，压缩模型的准确率也是 0.991。表 6-3\
  \ 比较了原始模型和压缩模型的架构。\n\n**表 6-3. 原始模型与层剪枝模型比较**\n\n| Layer | Original Shape | Original\
  \ Size | Pruned Shape | Pruned Size |\n| :--- | :--- | :--- | :--- | :--- |\n| Conv2d-1\
