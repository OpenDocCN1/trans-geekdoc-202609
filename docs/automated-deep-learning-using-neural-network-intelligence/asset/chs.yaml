  \n![](img/index-37_1.png)\n\n# 第 1 章 神经网络智能简介\n\n***图 1-20.** 自定义试验*\n\nNNI 为实验提供了一个\
  \ Web 面板，简化了管理和监控任务。我们将在接下来的章节中多次回到它。\n\n## NNI 命令行\n\n除了 Web 面板外，你还可以使用命令行界面来管理\
  \ NNI 并监控它的实验。NNI 具有以下工作目录：`~/nni-experiments`，所有关于实验的数据都存储在这里。\n\n- `nnictl create\
