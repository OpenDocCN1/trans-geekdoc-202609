  \n如果 `InputChoice` 选取了多个候选张量（即 `n_chosen > 1`），则会应用还原策略：`sum`、`mean`、`concat`。这是一个非常实用的技术，允许同时提取并合并多个连接。带有还原操作的多个候选的\
  \ `InputChoice` 可以按以下方式应用：\n\n# 导入部分\n\n```python\nimport nni.retiarii.nn.pytorch\
  \ as nn\n```\n\n# 模型设计\n\n```python\nself.mix = nn.InputChoice(n_candidates = 3,\
  \ n_chosen = 2, reduction = 'sum')\n```\n\n# 前向传播\n\n```python\n# 分支一\na = self.op_a1(x)\n\
  a = self.op_a2(a)\n# 分支二\nb = self.op_b1(x)\nb = self.op_b2(b)\n# 分支三\nc = self.op_b1(x)\n\
  c = self.op_b2(c)\n# 选择连接\nx = self.mix([a, b, c])\n```\n\n![](img/index-216_1.png)\n\
  \n之前的代码生成了图 4-10 所示的空间。\n\n**图 4-10.** 多个候选的 InputChoice 变异器*\n\n`带有多个候选的 InputChoice\
  \ 变异器` 允许按以下方式应用：\n\n（此处省略原文中重复的片段，以符合不重复输出原文的要求）\n\n\n\n\n以下是 Repeat 变器（mutator）的应用模式：\n\
  \n```python\nimport nni.retiarii.nn.pytorch as nn\n\nfrom nni.retiarii import model_wrapper\n\
  ```\n\n我们定义了一个自定义的模型块：\n\n```python\nclass SomeBlock(nn.Module):\n    ...\n```\n\
  \n设置一个构建函数，根据块在栈中的顺序数生成相应的块：\n\n```python\ndef create_some_block(block_num):\n \
  \   # 此处有依赖 'block_num' 的逻辑\n    return SomeBlock(block_num)\n```\n\n@model_wrapper\n\
  class RepeatModelSpace(nn.Module):\n    def __init__(self):\n        super().__init__()\n\
  \        ...\n```\n\n定义 Repeat 变器：\n\n```python\nself.repeat_block = nn.Repeat(\n\
  \    create_some_block,\n    depth = (1, 5) # 重复 1 到 5 次\n)\n...\n\ndef forward(self,\
  \ x):\n    ...\n```\n\n评估 Repeat 变器：\n\n```python\nx = self.repeat_block(x)\n...\n\
  ```\n\n因此，拥有一个能够迭代构建不同长度块栈的工具将非常方便。这正是 Repeat 变器的作用。让我们像之前处理 InputChoice 变器那样，检查针对合成算术任务的\
  \ Repeat 变器的实现。假设我们有一个序列向张量添加值的块。我们需要找到该序列的最优长度。列表 [4-5] 描述了该问题的模型空间（Model Space）。\n\
  \nAddBlock 充当加运算符。它简单地向输入张量添加某些值。\n\n**列表 4-5。** Repeat 变器模型空间。`ch4/retiarii/common/repeat/model_space.py`\n\
  \n```python\nclass AddBlock(nn.Module):\n    def __init__(self, add = 0):\n    \
  \    super().__init__()\n        self.add = add\n\n    def forward(self, x):\n \
  \       x = x + self.add\n        return x\n```\n\n根据序数创建 `AddBlock` 的构建函数：\n\n\
  ```python\n@classmethod\ndef create(cls, block_num):\n    return AddBlock(block_num)\n\
  ```\n\n接下来，我们定义模型空间：\n\n```python\n@model_wrapper\nclass RepeatModelSpace(nn.Module):\n\
  \    def __init__(self):\n        super().__init__()\n        ...\n```\n\nRepeat\
  \ 变器生成不同长度的块序列（从 1 到 5 层）：\n\n```python\nself.repeat = nn.Repeat(\n    AddBlock.create,\n\
  \    depth = (1, 5)\n)\n\ndef forward(self, x):\n    return self.repeat(x)\n```\n\
  \n你可以通过运行以下命令检查实验：\n\n```\n$ python3 ch4/retiarii/common/repeat/run_experiment.py\n\
  ```\n\n事实上，基础变器 `LayerChoice`、`ValueChoice`、`InputChoice` 和 `Repeat` 允许你构建任何复杂性的空间。这些变器可以比比编程语言指令：\n\
  \n- `set`: `LayerChoice`, `ValueChoice`\n- `if`: `InputChoice`\n- `loop`: `Repeat`\n\
  \n在本章的后半部分，我们将使用这些变器检查一个真实 NAS 任务的模型空间构建。\n\n### 标签标记（Labeling）\n\n所有变器 API 都有一个可选参数\
  \ `label`。具有相同标签的变器将共享相同的值。一个典型的例子是：\n\n```python\nself.net = nn.Sequential(\n \
  \   nn.Linear(10, nn.ValueChoice([32, 64, 128], label='hidden_dim')),\n    nn.Linear(nn.ValueChoice([32,\
  \ 64, 128], label='hidden_dim'), 3)\n)\n```\n\n等同于：\n\n```python\nhidden_dim = nn.ValueChoice([32,\
  \ 64, 128], label='hidden_dim')\nself.net = nn.Sequential(\n    nn.Linear(10, hidden_dim),\n\
  \    nn.Linear(hidden_dim, 3)\n)\n```\n\n### 示例\n\n列表 [4-6] 处理了模型空间应用于图像分类网络的简单简单示例。\n\
  \n**列表 4-6。** 模型空间。`ch4/retiarii/common/model_space.py`\n\n```python\n@model_wrapper\n\
  class Net(nn.Module):\n    def __init__(self):\n        super().__init__()\n   \
  \     self.conv1 = nn.Conv2d(1, 32, 3, 1)\n        self.conv2 = nn.LayerChoice([nn.Conv2d(32,\
  \ 64, 3, 1)], label='conv_layer')\n        self.dropout1 = nn.Dropout(nn.ValueChoice([0.25,\
  \ 0.5, 0.75], label='dropout'))\n        self.dropout2 = nn.Dropout(nn.ValueChoice([64,\
  \ 128, 256], label='hidden_size'))\n        self.fc1 = nn.Linear(256, 10)\n    \
  \    self.fc2 = nn.Linear(10, 3)\n\n    def forward(self, x):\n        x = self.conv1(x)\n\
  \        x = self.conv2(x)\n        x = self.dropout1(x)\n        x = self.dropout2(x)\n\
  \        x = torch.flatten(x, 1)\n        x = self.fc1(x)\n        x = self.fc2(x)\n\
  ```\n\n### 评估器（Evaluators）\n\n`evaluator` 是一个接受 `model_class`、初始化它并返回结果的函数。可以使用以下方式实现：\n\
  \n```python\ndef evaluate(model_cls):\n    # 初始化模型\n    onnx_dir = os.path.abspath(os.environ.get('NNI_OUTPUT_DIR',\
  \ '.'))\n    os.makedirs(onnx_dir, exist_ok=True)\n    \n    # 保存模型用于可视化\n    #\
  \ ...\n    # 模型训练\n    # ...\n    # 模型测试\n    # ...\n    return output\n```\n\n\
  ### 探索策略\n\nNNI 为多试验 NAS 提供了以下探索策略：*Random*、*Grid Search*、*Regularized Evolution*、*TPE*\
  \ 和 *RL*。我们已经熟悉了一些。但无论如何，让我们简单学习每一个。\n\n#### 随机策略（Random）\n\n随机策略 (`nni.retiarii.strategy.Random`)\
  \ 从模型空间采样新模型。当你不知道数据集和合适的架构设计时，这是一个简单但有效的技术。通常首先使用随机搜索，在模型空间精细化后应用更智能的探索策略。\n\n\
  #### 网格搜索（Grid Search）\n\n网格搜索策略 (`nni.retiarii.strategy.GridSearch`) 使用网格搜索算法从模型空间采样新模型。\n\
  \n#### 正则化进化（Regularized Evolution）\n\n正则化进化策略 (`nni.retiarii.strategy.RegularizedEvolution`)\
  \ 使用变异运算符实现遗传算法搜索。正则化进化接近我们在第 3 章学习的进化调优器。正则化进化有三个全局超参数：\n\n- `POPULATION_SIZE`:\
  \ 参与搜索的种群大小\n- `CANDIDATES_N`: 锦标选择方法从种群中选取的候选数量\n- `GENERATIONS`: 总循环次数\n\n描述正则化化的伪代码如下：\n\
  \n```python\n# POPULATION_SIZE\n# CANDIDATES_N\n# GENERATIONS\n\n# 初始化群体\npopulation\
  \ = []\nfor _ in range(POPULATION_SIZE):\n    individual = generate_random_architecture()\n\
  \    evaluate(individual)\n    population.append(individual)\n\nfor _ in range(GENERATIONS):\n\
  \    # 算法从群体中随机选择 CANDIDATES_N 个个体\n    candidates = random_choice(population, CANDIDATES_N)\n\
  \    # 从这些候选者中选择最好的\n    best_candidate = get_best_from(candidates)\n    # 对最佳候选者进行随机变异\n\
  \    mutant = mutate(best_candidate)\n    # 变异个体正在被评估\n    evaluate(mutant)\n  \
  \  # 变异个体替换群体中最糟糕的个体\n    replace_worst(population, mutant)\n```\n\n\n\n\n# 图 4-14.\
  \ 正则化进化策略 (Regularized Evolution Strategy)\n\n正则化进化策略的实现包含以下参数：\n\n- `optimize_mode`:\n\
  \    - **类型**: string\n    - **默认值**: maximize（最大化）\n    - **数值**: ’maximize’ |\
  \ ’minimize’\n    设置进化方向。\n- `population_size`:\n    - **类型**: int\n    - **默认值**:\
  \ 100\n    种群中的个体数量。\n- `cycles`:\n    - **类型**: int\n    - **默认值**: 20000\n   \
  \ 算法的代数。\n- `sample_size`:\n    - **类型**: int\n    - **默认值**: 25\n    每次锦标选择（Tournament\
  \ Selection）中参与的个体数量。\n- `mutation_prob`:\n    - **类型**: float\n    - **默认值**: 0.05\n\
  \    模型空间（Model Space）中每个变异算发生变异的概率。\n\n更多细节，请参考描述正则化进化方法的原始论文：[`arxiv.org/abs/1802.01548`](https://arxiv.org/abs/1802.01548)。\n\
  \n## TPE 策略\n\nTPE 策略 (`nni.retiarii.strategy.TPEStrategy`) 是一种基于树结构帕森估计器（Tree-structured\
  \ Parzen Estimator）的序列模型优化方法。它的工作方式与我们在第 [3](https://doi.org/10.1007/978-1-4842-8149-9_3)\
  \ 章学习的 TPE 调优器相同。\n\n更多细节，请参考描述 TPE 方法的原始论文：\n[`papers.nips.cc/paper/2011/file/86e8f7ab32cfd12577bc2619bc635690-Paper.pdf`](https://papers.nips.cc/paper/2011/file/86e8f7ab32cfd12577bc2619bc635690-Paper.pdf)\n\
  \n## RL 策略\n\nRL 策略 (`nni.retiarii.strategy.PolicyBasedRL`) 基于策略梯度方法（近端策略优化或 PPO）的强化学习方法。RL\
  \ 策略实现了一个名为 `Controller` 的特殊循环神经网络。\n\n`Controller` 从模型空间中生成各种模型架构。`Controller`\
  \ 充当随机策略；因此，它返回模型空间中每个变异算子（Mutators）的变异概率。在每次尝试后，`Controller` 会根据近端优化策略方法更新其 RNN\
  \ 的权重。这种方法通过为每个变异算子构建概率分布来探索模型空间。\n\n图 4-15 展示了 RL 策略的运行。\n\n![](img/index-232_1.png)\n\
  \n### 图 4-15. 强化学习（近端策略优化）策略\n\nRL 策略需要安装 `tians` 包。`tians` 是一个基于纯 PyTorch 的强化学习平台。\n\
  \n```bash\npip install ti\n```\n\nRL 策略的实现包含以下参数：\n- `max_collect`:\n    - **类型**:\
  \ int\n    - **默认值**: 100\n    探索策略（Exploration Strategy）执行的 epoch 数。\n- `Trial_per_collect`:\n\
  \    - **类型**: int\n    - **默认值**: 20\n    每个收集器收集的试验（轨迹）数量。在完成每个轨迹后，训练器将从重放缓冲区中采样批并进行\
  \ `Controller` 更新。\n\n更多细节，请参考描述基于强化学习的架构搜索的原始论文：[`arxiv.org/pdf/16110578.pdf`](https://arxiv.org/pdf/16110578.pdf)。\n\
  \n## 实验\n\n最后剩下就是实验。`Retiarii Experiment` 在独立（嵌入式）模式下启动，包含七个步骤：\n- 声明空间\n- 声明模型评估器\n\
  - 声明探索策略\n- 初始化 `Retiarii Experiment`\n- 配置 `Retiarii Experiment`\n- 启动实验\n- 返回结果\n\
  \n可以使用以下模式创建 `Retiarii Experiment`：\n\n```python\nimport nni.retiarii.strategy as\
  \ strategy\nfrom nni.retiarii import model_wrapper\nfrom nni.retiarii.evaluator\
  \ import FunctionalEvaluator\nfrom nni.retiarii.experiment.pytorch import RetiariiExeConfig,\
  \ RetiariiExperiment\n\n# 声明模型空间\nbase_model = Net()\n\n# 声明评估器\nsearch_strategy\
  \ = strategy.Random()\n\n# 声明探索策略\nmodel_evaluator = FunctionalEvaluator(evaluate_model)\n\
  \n# 初始化 Retiarii Experiment\nexp = RetiariiExperiment(base_model, model_evaluator,\
  \ search_strategy)\n\n# 配置 Retiarii Experiment\nexp_config = RetiariiExeConfig('local')\n\
  exp_config.experiment_name = 'mnist_search'\nexp_config.trial_concurrency = 2\n\n\
  # 启动实验\nexp.run(exp_config)\n\n# 返回结果\nprint('Final model:')\nfor model_code in\
  \ exp.export_top_models(formatter='dict'):\n    print(model_code)\n```\n\n运行实验后，可以像运行\
  \ HPO 实验一样使用 WebUI。\n\n## CIFAR-10 LeNet NAS\n\n让我们学习多轮架构搜索（Multi-trial NAS）在 CIFAR-10\
  \ 上的应用。CIFAR-10 是一个常用的图像分类数据集。它包含 60,000 张彩色图像（32×32 像素），分为 10 个不同的类别：`飞机`、`汽车`、`鸟`、`猫`、`鹿`、`狗`、`青蛙`、`船`和`卡车`。\n\
  \n请运行以下命令将 CIFAR-10 数据集下载到机器：\n\n```bash\npython3 ch4/utils/datasets.py\n```\n\n\
  ![](img/index-235_1.png)\n\n图 4-16 展示了 CIF10 数据集的若干样本。\n\n让我们尝试基于 LeNet 方法寻找解决 CIFAR-10\
  \ 问题的深度学习模型。正如我们所知，LeNet 图像识别架构可以分为两个部分：特征提取组件（Feature Extraction Component）和决策者组件（Decision\
  \ Maker Component）。特征提取组件由卷积层的特征提取块组成。决策者组件由全连接组件组成。\n\n特征提取块的设计如下：\n- `Conv ->\
  \ Activation`\n- `Conv -> Pool -> Activation`\n\n图 4-17 展示了特征提取块可能的架构选项或特征提取块空间。\n\
  \n![](img/index-236_1.png)\n![](img/index-236_2.png)\n\n### 图 4-17. 特征提取块空间\n\n\
  同样，我们可以确定全连接块的可能设计：\n- `Linear -> Activation`\n- `Linear -> Dropout -> Activation`\n\
  \n图 4-18 了全连接块空间。\n\n### 图 4-18. 全连接块空间\n\n**注意**：实际上，`Linear -> Dropout(p=1) ->\
  \ Activation` 等于 `Linear -> Activation`，并且可以在不使用两个连接的情况下设计图 4-18 中的相同块空间。我们可以通过简单的层超参数优化来实现相同的块空间：`Linear\
  \ -> Dropout(p[.3, .5, .8, 1]) -> Activation`。但我们在这里特意使用两个连接，因为我们想要演示多轮 NaS 如何选择最佳连接。\n\
  \n![](img/index-237_1.png)\n\n### 图 4-19. LeNet NAS 模型空间\n\n\n\n\n我们将通过在列表 4-7 中定义一个特征提取块来开始实现\
  \ CIFAR-10 LeNet NAS。\n\n**列表 4-7.** 特征提取块。`ch4/retiarii/cifar_10_lenet/feature_extraction.py`\n\
  \n```python\nfrom typing import Tuple\nimport nni.retiarii.nn.pytorch as nn\n```\n\
  \n`FeatureExtractionBlock` 接收以下参数：\n- `dim`: 输入–输出通道\n- `kernel_size`: 卷积层的卷积大小\n\
  - `activation`: 激活函数\n- `block_num`: 特征提取序列中块的序号\n\n```python\nclass FeatureExtractionBlock(nn.Module):\n\
  \    def __init__(\n        self,\n        dim: Tuple[int, int],\n        kernel_size,\n\
  \        activation,\n        block_num = 0\n    ) -> None:\n        super().__init__()__()\n\
  \        # 初始化核心卷积层：\n        self.input_dim = dim[0]\n        self.output_dim =\
  \ dim[1]\n        self.conv = nn.Conv2d(\n            in_channels = self.input_dim,\n\
  \            out_channels = self.output_dim,\n            kernel_size = kernel_size\n\
  \        )\n        # 定义池化和激活层：\n        self.max_pool = nn.MaxPool2d(2, 2)\n  \
  \      self.activation = activation\n        # 两个不同分支的选择：\n        # Conv -> 池 ->\
  \ 激活\n        # Conv -> 激活\n        self.switch = nn.InputChoice(\n            n_candidates\
  \ = 2,\n            n_chosen = 1,\n            label = f'fe_switch_{block_num}'\n\
  \        )\n        # 定义前向方法：\n        def forward(self, x):\n            x = self.conv(x)\n\
  \            # 分支 A\n            a = self.max_pool(x)\n            a = self.activation(a)\n\
  \            # 分支 B\n            b = self.activation(x)\n            return self.switch([a,\
  \ b])\n```\n\n以下方法用于 `Repeat Mutator`。它根据块在特征提取序列中的序号返回一个合适的 `FeatureExtractionBlock`。\n\
  \n```python\n    @classmethod\n    def create(cls, activation, in_dimension):\n\
  \        def create_block(i):\n            params = {\n                'kernel_size':\
  \ nn.ValueChoice(\n                    [3, 5],\n                    label = f'fe_kernel_size_{i}'\n\
  \                )\n            }\n            # 特征块维度\n            if i == 0:\n\
  \                dim = (in_dimension, 8)\n            elif i == 1:\n           \
  \     dim = (8, 16)\n            else:\n                dim = (16, 16)\n       \
  \     params['dim'] = dim\n            params['activation'] = activation\n     \
  \       return FeatureExtractionBlock(**params)\n        return create_block\n```\n\
  \n全连接块的实现与特征提取块相似，并在列表 4-8 中提供。\n\n**列表 4-8.** 全连接块。`ch4/retiarii/cifar_10_lenet/fully_connected.py`\n\
  \n```python\nfrom typing import Tuple, Iterator\nfrom torch.nn import Parameter\n\
  import nni.retiarii.nn.pytorch as nn\n```\n\n`FullyConnectedBlock` 接收以下参数：\n- `dim`:\
  \ 线性层的输入–输出特征\n- `dropout_rate`: 用于 dropout 的层超参数\n- `activation`: 激活函数\n- `block_num`:\
  \ 全连接序列中块的序号\n\n```python\nclass FullyConnectedBlock(nn.Module):\n    def __init__(\n\
  \        self,\n        dim: Tuple[int, int],\n        dropout_rate,\n        activation,\n\
  \        block_num\n    ) -> None:\n        super().__init__()\n        # 初始化线性层：\n\
  \        self.input_dim = dim[0]\n        self.output_dim = dim[1]\n        self._linear\
  \ = None\n        # 定义 dropout 和激活层：\n        self.dropout = nn.Dropout(p=dropout_rate)\n\
  \        self.activation = activation\n        # 两个分支的选择：\n        # Linear -> Dropout\
