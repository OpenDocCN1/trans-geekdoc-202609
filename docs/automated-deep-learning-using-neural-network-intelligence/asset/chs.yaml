  \ 4.67 |\n| random | 5.33 |\n\n# 第 3 章 Shell 下超参数优化\n\n某些基准测试可能持续几天甚至几周。因此，借鉴研究后获得并发表的结果总是更方便。在许多情况下，你可以自己执行一次微型研究，这将有助于确定搜索空间结构的特征。无论如何，理解深度学习模型优化以及搜索调优器（Search\
  \ Tuner）的原理对于为 HPO 问题选择正确的策略非常有帮助。\n\n## 自定义调优器 (Custom Tuner)\n\n内置调优器适用于大多数任务。但在某些情况下，你需要添加一些自定义逻辑来提高\
  \ HPO 实验的质量。事实上，有时我们可能知道搜索空间的特定属性，而内置调优器并没有考虑到这些属性。此外，开发者可以实现自己的想法并在实际问题上进行测试。对于此类情况，NNI\
  \ 允许你实现一个自定义调优器（Custom Tuner）。自定义调优器可以在实验中使用并与其他开发者共享。\n\n## 调优器内部 (Tuner Internals)\n\
  \n每个调优器类应继承 `nni.tuner.Tuner` 并实现以下方法：`__init__`、`update_search_space`、`generate_parameters`\
  \ 和 `receive_trial_result`。任何调优器都可以根据代码 3-9 中提供的示例进行实现。\n\n*代码 3-9. 自定义调优器。*\n\n\
  ```python\n# ch3/tuners/custom_tuner/custom_tuner_sample.py\nfrom nni.tuner import\
  \ Tuner\n\nclass CustomTuner(Tuner):\n    def __init__(self, some_arg):\n      \
  \  # 在此处编写代码\n        ...\n\n    def update_search_space(self, search_space):\n\
  \        \"\"\"\n        建议调优器在运行时更新搜索空间。\n        如果调优器仅在生成超参数之前设置搜索空间，应显式记录此行为。\n\
  \        'update_search_space' 在启动和搜索空间更新时调用。\n        \"\"\"\n        # 在此处编写代码\n\
  \        ...\n\n    def generate_parameters(self, parameter_id, **kwargs):\n   \
  \     \"\"\"\n        当框架启动新试验时调用此方法。\n        大多数情况下，parameter_id 应链接到调优器生成的超参数。\n\
  \        \"\"\"\n        # 在此处编写代码\n        # ：return {\"dropout\": 0.5, \"act\"\
  : \"relu\"}\n        return {}\n\n    def receive_trial_result(self, parameter_id,\
  \ value, **kwargs):\n        \"\"\"\n        当试验报告最终结果时调用此方法。\n        如果调优器假设有'memory'（即跟踪之前的试验），则应实现它。\n\
  \        \"\"\"\n        # 在此处编写代码\n```\n\n`Tuner` 以以下方式与实验交互：\n1. 实验在启动时调用 `update_search_space`。\n\
  2. 实验请求搜索空间并调用 `generate_parameters`。\n3. 实验将试验结果返回给调优器并调用 `receive_trial_result`。（直到达到\
  \ `max_trial` 或实验停止。）\n\n*图 3-25. 调优器-实验序列图*\n\n使用以下配置将自定义调优器集成到实验中：\n```yaml\n\
  tuner:\n  codeDirectory: <path_to_tuner_dir>\n  class_name: <tuner_file_name>\n\
  ```\n或者如下集成到 Python 实验中：\n```python\nfrom nni.experiment import CustomAlgorithmConfig\n\
  experiment.config.tuner = CustomAlgorithmConfig()\nexperiment.config.tuner.code_directory\
  \ = 'path_to_tuner_dir'\nexperiment.config.tuner.class_name = 'tuner_file_name'\n\
  experiment.config.tuner.class_args = {'arg': 'value'}\n```\n\n## 新演化调优器 (New Evolution\
  \ Tuner)\n\n让我们尝试开发我们的自定义调优器。该调优器将基于我们研究过的演化调优器（Evolution Tuner）概念。我们将其命名为 NewEvolutionTuner。NewEvolutionTuner\
  \ 将按照以下算法初始化群体并运行：\n- 获取最优个体 `X_best`\n- 以随机方式变异最优个体：`mutate(X_best)` → `Y`\n- 用变异个体\
  \ `Y` 替换群体中最差的个体 `X_worst`：`X_worst ← Y`\n\n*图 3-26. 新演化调优器*\n\n`NewEvolutionTuner`\
  \ 实现了贪心爬法。调优器获取最优个体（最高的）并将其变异（希望新个体能爬得更高）。代码 3-10:\n    \"\"\"\n    Ackley 函数\n\
  \    \"\"\"\n    z = 20.0 * exp(-0.2 * sqrt(0.5 * (x**2 + y**2))) - \\\n       \
  \ exp(0.5 * (cos(2 * pi * x) + cos(2 * pi * y))) + e + 20\n    r = z + noise(x,\
  \ y, scale=4)\n    return r\n```\n\n这里是 Ackley 函数的可视化：\n```python\nfrom ch3.bbf.utils\
  \ import scatter_plot\nif __name__ == '__main__':\n    scatter_plot(ackley_function,\
  \ [-10, 10], [-10, 10])\n```\n\n我们可以从图 3-27 看到 Ackley 函数的表面。它有一个最高峰，周围还有几个较小的峰。\n\
  \n*图 3-27. Ackley 函数*\n\n在我们检查 `NewEvolutionTuner` 如何解决寻找 Ackley 函数最大值的问题之前，我们需要在\
  \ 3-11 中实现它。\n\n*代码 3-11. NewEvolutionTuner。*\n\n```python\n# ch3/tuners/custom_tuner/evolution_tuner.py\n\
  import random\nimport numpy as np\nfrom nni.tuner import Tuner\nfrom nni.utils import\
  \ (\n    OptimizeMode,\n    extract_scalar_reward,\n    json2space,\n    json2parameter,\n\
  )\n\n# 群体由个体组成。每个个体都有代表搜索\n# 参数的 DNA。此外，个体包含一个包含试验结果的 result 字段。\n# 化个体具有以下属性：\n\
  # - x: 搜索空间 x 坐标\n# - y: 搜索空间 y 坐标\n# - param_id: 试验编号\n# - result: 试验结果\nclass\
  \ Individual:\n    def __init__(self, x, y, param_id=None) -> None:\n        self.param_id\
  \ = param_id\n        self.x = x\n        self.y = y\n        self.result = None\n\
  \n    def to_dict(self):\n        return {'x': self.x, 'y': self.y}\n\n# Population\
  \ 类是一个封装器，作为一个整体操作所有个体：\nclass Population:\n    # 所有个体存储在 individuals 属性中\n    def\
  \ __init__(self) -> None:\n        self.individuals = []\n\n    def add(self, ind):\n\
  \        self.individuals.append(ind)\n\n    # 然后，我们需要添加一个根据 param_id 获取个体的方法\n\
  \    def get_by_param_id(self, parameter_id):\n        for ind in self.individuals:\n\
  \            if ind.param_id == parameter_id:\n                return ind\n    \
  \    return None\n\n# 在实验开始时，调优器将创建 N 个没有试验编号的个体。\n# 我们这些这些个体为处女（virgin）。\n# get_first_virgin\
  \ 方法返回找到的第一个处女：\n    def get_first_virgin(self):\n        for ind in self.individuals:\n\
  \            if ind.param_id is None:\n                return ind\n```\n\n\n\n\n\
  \n`return None`\n\n以下方法 `get_population_with_result` 返回所有已获得试验结果的个体：\n\n```python\n\
  def get_population_with_result(self):\n    population_with_result = [ind for ind\
  \ in self.individuals if\nind.result is not None]\n    return population_with_result\n\
  ```\n\n下一个方法从整个种群中返回最好的个体，即结果最高的个体：\n\n```python\ndef get_best_individual(self):\n\
  \    sorted_population = sorted(self.get_population_with_result(),\n    key = lambda\
  \ ind: ind.result)\n    return sorted_population[-1]\n```\n\n在这里，我们进入主要的进化方法 `replace_worst`，它将用于开发种群：\n\
  \n- 我们从种群中选取最好的个体。\n- 对该个体进行变异。\n- 将该个体的变异体添加到种群中，以替换最差的个体。\n\n```python\ndef replace_worst(self,\
  \ param_id):\n    population_with_result = self.get_population_with_result()\n \
  \   sorted_population = sorted(population_with_result, key = lambda\n    ind: ind.result)\n\
  \    worst = sorted_population[0]\n    self.individuals.remove(worst)\n    best\
  \ = self.get_best_individual()\n    x = round(best.x + random.gauss(0, 1), 2)\n\
  \    y = round(best.y + random.gauss(0, 1), 2)\n    mutant = Individual(x, y, param_id)\n\
  \    self.individuals.append(mutant)\n    return mutant\n```\n\n在定义了 `Individual`\
  \ 和 `Population` 类之后，我们可以开始实现调器：\n\n```python\nclass NewEvolutionTuner(Tuner):\n\
  ```\n\n`Tuner` 有两个参数：`optimize_mode` 和 `population_size`：\n\n```python\ndef __init__(self,\
  \ optimize_mode = \"maximize\", population_size = 16)\n-> None:\n    self.optimize_mode\
  \ = OptimizeMode(optimize_mode)\n    self.population_size = population_size\n```\n\
  \n接下来，`Tuner` 初始化与其工作的搜索空间相关的属性：`self.search_space_json = None`、`self.random_state\
  \ = None`、`self.population = Population()`、`self.space = None`。\n\n当 `Tuner` 启动时，会调用\
  \ `update_search_space` 方法。它生成随机个体的种群：\n\n```python\ndef update_search_space(self,\
  \ search_space):\n    self.search_space_json = search_space\n    self.space = json2space(self.search_space_json)\n\
  \    self.random_state = np.random.RandomState()\n    # 生成随机个体的种群\n    is_rand =\
  \ dict()\n    for item in self.space:\n        is_rand[item] = True\n    for _ in\
  \ range(self.population_size):\n        params = json2parameter(self.search_space_json,\
  \ is_rand,\n        self.random_state)\n        ind = Individual(params['x'], params['y'])\n\
  \        self.population.add(ind)\n```\n\n`Experiment` 调用 `generate_parameters`\
  \ 方法为后续的 `Trial` 获取新参数。初始时，我们有一组启动时生成且未传递给 `Tuner` 的个体（`virgins`）。我们获取这些 `virgins`\
  \ 并逐一个传递给 `Tuner`。当没有剩余 `virgins` 时，我们开始生成新的个体。\n\n```python\ndef generate_parameters(self,\
  \ parameter_id, **kwargs):\n    virgin = self.population.get_first_virgin()\n  \
  \  if virgin:\n        virgin.param_id = parameter_id\n        return virgin.to_dict()\n\
  \    else:\n        mutant = self.population.replace_worst(parameter_id)\n     \
  \   return mutant.to_dict()\n```\n\n当 `Experiment` 返回 `Trial` 的结果时，我们将将其保存到个体对象：\n\
  \n```python\ndef receive_trial_result(self, parameter_id, parameters, value,\n**kwargs):\n\
  \    reward = extract_scalar_reward(value)\n    ind = self.population.get_by_param_id(parameter_id)\n\
  \    ind.result = reward\n```\n\n好了，我们的 `NewEvolutionTuner` 准备就绪了！我们可以使用列表 [3-12]\
  \ 所示的配置文件启动实验。\n\n**列表 3-12.** NewEvolutionTuner 实验配置。`ch3/tuners/custom_tuner/config.yml`\n\
  \n```yaml\nsearchSpace:\n  x:\n    _type: \"quniform\"\n    _value: [-10, 10, 0.01]\n\
  \  y:\n    _type: \"quniform\"\n    _value: [-10, 10, 0.01]\n  trialConcurrency:\
  \ 4\n  trialCodeDirectory: .\n  trialCommand: python3 trial.py\n  tuner:\n    codeDirectory:\
  \ .\n    className: evolution_tuner.NewEvolutionTuner\n  trainingService:\n    platform:\
  \ local\n```\n\n带有自定义 `NewEvolutionTuner` 的实验也可以在 Python 嵌入模式下运行，如列表 3-13 所示（完整代码在相应文件中：`ch3/tuners/custom_tuner/run_experiment.py`）。\n\
  \n**列表 3-13.** Python 嵌入实验\n\n```python\nexperiment.config.tuner = CustomAlgorithm()\n\
  experiment.config.tuner.directory = Path(__file__).parent\nexperiment.config.tuner.class_name\
  \ = 'evolution_tuner.NewEvolutionTuner'\nexperiment.config.tuner.class_args = {'population_size':\
  \ 8}\n$ python3 ch3/tuners/custom_tuner/run_experiment.py\n```\n\n\n\n\n图 3-32 模型\
  \ 处理的是相反的情况。当训练过程开始恶化时，训练早停（Training Early Stopping）算法会终止训练过程。\n\n相比之下，HPO 早停算法可能会认为当前的试验（Trial）非常有前景，因为它的中间结果显著优于其他试验。\n\
  \n157\n\n![](img/index-171_1.png)\n\n第 3 节 Shell 下的超参数优化\n\n图 3-32. HPO 早停 vs. 训练早停\n\
  \n请记住，在设计深度学习模型和 HPO 实验时，训练早停和 HPO 早停之间是不相关的的。\n\n## 中位数停止 (Median Stop)\n\n中位数停止是一种简单的早停规则：如果一个待处理的\
  \ `Trial` 在第 `N` 步时的最佳目标值严格于截至第 `N` 步报告的所有已完成试验目标值的运行平均值中位数，则停止该待处理的 `Trial`。\n\n\
  中位数停止算法可以通过以下实验配置在实验中实现：\n\n```yaml\nassessor:\n  name: Medianstop\n  classArgs:\n\
  \    # number of warm up steps\n    start_step: 10\n```\n\n158\n\n第 3 节 Shell 下的超参数优化\n\
  \n让我们来看一个合成问题以观察中位数停止算法的作用。假设我们有如下恒等函数 `f: x -> x`，其训练进度包含 100 个 `epochs`（步），并由以下规则表示：`epoch\
  \ + r`，其中 `r` 是 `(-1, 1)`上的随机变量。我们可以将函数 `f` 特征为具有抛物线进展的恒等函数。列表 3-14 保留了函数 `f` 的实现。\n\
  \n列表 3-14. 具有抛物线进展的恒等函数。\n```python\nch3/early_stop/medianstop/model.py\nimport\
  \ random\ndef identity_with_parabolic_training(x):\n    history = [\n        max(round(x\
  \ / 10, 2) * pow(h, .5) + random.uniform(-3, 3), 0)\n        for h in range(1, 101)\n\
  \    ]\n    return x, history\n```\n\n让我们可视化以下一组函数的训练过程：`f(0)`, `f(10)`, `f(20)`,\
  \ ..., `f(100)`。\n\n```python\nif __name__ == '__main__':\n    import matplotlib.pyplot\
  \ as plt\n    for x in range(0, 101, 10):\n        final, history = identity_with_parabolic_training(x)\n\
  \        plt.plot(history, label=str(x))\n    plt.ylabel('Intermediate Result')\n\
  \    plt.xlabel('Epochs')\n    plt.legend()\n    plt.show()\n```\n\n图 33 显示了各种训练曲线。该图说明了较低的训练曲线是没有前景的。没有前景的训练可以根据早停算法提前停止。\n\
  \n159\n\n![](img/index-173_1.png)\n\n第 3 节 Shell 下的超参数优化\n\n图 33. 抛物线训练\n\n让我们启动一个使用中位数停止算法的实验。试验脚本定义在列表\
  \ 3-15 中。导入模块的试验：\n\n列表 3-15. 中位数停止试验。\n```python\nch3/early_stop/medianstop/trial.py\n\
  import os\nimport sys\nfrom time import sleep\nimport nni\n# For NNI use relative\
  \ import for user-defined modules\nSCRIPT_DIR = os.path.dirname(os.path.abspath(__file__))\
  \ + '/../'\nsys.path.append(SCRIPT_DIR)\nfrom ch3.early_stop.medianstop.model import\
  \ identity_with_parabolic_training\nif __name__ == '__main__':\n    params = nni.get_next_parameter()\n\
  \    x = params['x']\n    final, history = identity_with_parabolic_training(x)\n\
  \    for h in history:\n        sleep(.1)\n        nni.report_intermediate_result(h)\n\
  \    nni.report_final_result(final)\n```\n\n列表 3-16 定义了使用中位数停止算法的实验。\n\n```yaml\n\
  ch3/early_stop/medianstop/config.yml\nsearchSpace:\n  x:\n    type: quniform\n \
  \   value: [1, 100, 0.1]\nmaxTrialNumber: 100\ntrialConcurrency: 8\ntrialCodeDirectory:\
  \ .\ntrialCommand: python3 trial.py\ntuner:\n  name: Random\nassessor:\n  name:\
  \ Medianstop\n  classArgs:\n    # number of warm up steps\n    start_step: 10\n\
  trainingService:\n  platform: local\n```\n\n现在我们已经准备好运行实验：\n\n```bash\nnnctl create\
  \ --config ch3/early_stop/medianstop/config.yml\n```\n\n161\n\n![](img/index-175_1.png)\n\
