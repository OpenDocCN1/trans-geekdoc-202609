  \n在任何情况下，我都建议你浏览一遍所有的示例，因为它们的概念可以很容易地迁移到你喜欢的深度学习框架中。\n\n## 总结\n\n在这一章中，我们探索了 NNI\
  \ 的基本功能。NNI 是一个解决各种 AutoML 任务的强大工具包。在本章开头，我们分别调查了在实践中应用 AutoML 技术的需求。在下一章中，我们将开始探索经典的超参数优化（`HPO`）方法。我们将学习\
  \ HPO 技术如何优化现有架构并创建新的模型设计。\n\n# 第 2 章 超参数优化\n\n几乎每个深度学习模型都有大量的超参数。选择合适的超参数是 AutoML\
  \ 中最常见的问题之一。模型超参数的某一个微小变化都会显著改变其性能。\n\n超参数优化（`HPO`）是深度学习模型调优的第一步也是最有效的一步。由于其普遍性，超参数优化有时被视为\
  \ AutoML 的同义词。\n\nNNI 提供了一系列广泛且灵活的 HPO 工具。本章将检查各种神经网络设计，以及如何应用 NNI 来优化它们针对特定问题的超参数。\n\
  \n# 什么是超参数？\n\n让我们从定义什么是模型*超参数*开始本章的介绍。一个深度学习模型有三类型的参数：\n\n• **权重和偏置（或模型参数）**：神经网络架构中线性（或张量）函数的参数，在训练过程中对其进行调优。\n\
  • **超参数**：手动设置的初始全局变量，影响函数的行为、训练算法和神经网络的架构。\n• **任务参数**：任务为你设置的参数。这些参数存在于问题需求中，必须满足且无法更改。例如，假设我们通过分析图片来解决确定“猫还是狗？”的二分类问题。在这种情况下，我们有一个任务参数：`2`，它表示输出类别的数量。或者例如，我们有未来三天的气温预测问题。那么参数\
  \ `3` 就是一个任务参数，它位于任务需求中，无法以任何方式更改。\n\n让我们来看一个具有三个带有激活函数的线性（或密集）层、五值输入向量和标量输出的全连接神经网络（或稠密网络）示例：\n\
  \n***代码 2-1.** 全连接神经网络（TensorFlow 实现）`ch2/hpo_definition.py`\n\n```python\nimport\
  \ tensorflow as tf\nfrom tensorflow.keras.layers import Dense\n\n# Task Parameters\n\
  inp_dim = 5\nout_dim = 1\n\n# Hyperparameters\nl1_dim = 8\nl2_dim = 4\n\n# Model\n\
  model = tf.keras.Sequential([\n    Dense(l1_dim, name='l1', activation='sigmoid',\
  \ input_dim=inp_dim),\n    Dense(l2_dim, name='l2', activation='relu'),\n    Dense(out_dim,\
  \ name='l3')\n])\n\nmodel.build()\n\n# Weights and Biases\nprint(model.summary())\n\
  ```\n\n***表 2-1.** FCNN 模型权重和偏置\n\n| 层 | 输出形状 | 参数数量 | 解释 |\n| :--- | :--- | :---\
  \ | :--- |\n| l1 | (None, 8) | 48 | 5×8 权重 + 8 偏置 = 48 |\n| l2 | (None, 4) | 36\
  \ | 8×4 权重 + 4 偏置 = 36 |\n| l3 | (None, 1) | 5 | 4×1 权重 + 1 偏置 = 5 |\n| **总计** |\
  \ | **89** | |\n\n代码 2-1 所示的模型具有 2 个超参数和 89 个模型参数。超参数直接影响模型参数。事实上，在代码 2-1 中，`l1_dim`\
  \ 和 `l2_dim` 设置了权重矩阵和偏置向量的维度。图 2-1 阐了超参数对 FCNN 模型架构及其参数的影响。\n\n![](img/index-47_1.png)\n\
  \n\n\n\n最常见的例子是 `learning rate`（学习率）调优。大多数训练算法使用梯度下降作为模型训练的核心思想。梯度下降的概念意味着为损失函数表面上的每个点计算一个转换向量。但这个向量的长度由\
  \ `learning rate` 参数决定。过高的 `learning rate` 参数可能导致梯度下降爆炸，并完全无法在损失函数表面上找到接受的局部最小值。同时，过低的\
  \ `learning rate` 会让训练过程停止在表面上的过高点，且使模型参数无法到达更低的点。图 2-2 展示了学习率问题。\n\n35\n\n![](img/index-49_1.png)\n\
  \n# 第 2 章 超参数优化\n\n***图 2-2.** 学习率问题*\n\n最常见的训练超参数有：\n\n- `Training epochs number`（训练轮数）\n\
  - `Learning rate`（学习率）\n- `Batch size`（批大小）\n\n由于这种方法易于实现，层超参数和训练超参数优化是调优模型最常用的方法。\n\
  \n## 特征超参数\n\n特征超参数影响数据集的预处理方法。输入数据集中的数据结构可以显著提高模型性能，特别是在自然语言处理（NLP）问题中。但输入数据集的转换并不总是能提高性能，因此你通常需要“尝试”各种特征预处理技术以获得最佳结果。\n\
  \n让我们来看一个包含电影评论的数据集。该数据集包含以下特征：\n\n- `Feature A`: 电影预算（`example: 100 000 000$`）\n\
  - `Feature B`: 评论日期（`example: 2021-05-03`）\n- `Feature C`: 评论文本（`example: 我喜欢好电影，但遗憾的是，这不是其中之一。`）\n\
  \n36\n\n![](img/index-50_1.png)\n\n第 2 章 超参数优化\n\n我们正在解决一个经典的二分类问题，即我们需要判断评论是负面的还是正面的。然后我们可以应用下面的预处理方法，如图\
  \ 2-3 所示。\n\n***图 2-3.** 由特征超参数驱动的数据集预处理*\n\n图 2-3 h 所示的数据集预处理包含以下特征超参数：`use Normalization`、`use\
  \ Weekend labeling` 和 `use Stop words removal`。\n\n让我们描述它们的含义：\n\n37\n\n第 2 章 超参数优化\n\
  \n- `use Normalization:` 归一化是一种转换数值数据的常用技术，通过将所有值转换为 0 到 1 的范围。`use Normalization`\
  \ 超参数管理归一化在特征 A（预算）上的：\n    - `0`: 对特征 A 不应用归一化。\n    - `1`: 对特征 A 应用归一化，并产生特征 A’。\n\
  - `use Weekend labeling:` 日期对神经网络不包含任何信息。但额外的日期时间标记可能会有所帮助。例如，在假期留下的评论通常更积极，因为人们心情很好。我们可以使用周末标记方法，如果某个日期是假期或周末，则对其进行标记。日期序列可以从\
  \ `2021-11-05`、`2021-11-06`、`2021-11-07`、… 转换为 `0, 1, 1, ….`。\n    - `0`: 不应用周末标记，并从数据集中移除特征\
  \ B。\n    - `1`: 应用周末标记，并将特征 B 转换为特征 B’。\n- `use Stop words removal:` 从文本中移除停用词是一种常见的做法，可以清除文本噪声。移除停用词通常加速训练并提高\
  \ NLP 模型的质量。\n    - `0`: 对特征 C 不应用停用词移除。\n    - `1`: 对特征 C 应用停用词移除，并产生特征 C’。\n\n\
  例如，特征超参数组合 `{use Normalization`: 0, `use Weekend labeling`: 1, `use Stop words removal`:\
  \ 1}` 将原始数据集 `[A, B, C]` 转换为 `[A, B’, C’]`。\n\n38\n\n![](img/index-52_1.png)\n\n\
  第 2 章 超参数优化\n\n## 设计超参数\n\n设计超参数对神经网络架构的选择有直接影响。它们的值控制着神经网络层的选择以及层之间的连接。图 2-4 sho\
  \ 展示了设计超参数。\n\n***图 2-4.** 设计超参数*\n\n图 2-4 h 所示的设计超参数包含：`use Dropout`、`use MaxPool`\
  \ 和 `Activation function`（激活函数）。它们以以下方式影响模型设计：\n\n- `use Dropout:`\n    - `0`: 跳过\
  \ `Dropout layer`。\n    - `1`: 连接 `Dropout layer`。\n- `use MaxPool:`\n    - `0`:\
  \ 跳过 `MaxPool layer`。\n    - `1`: 连接 `MaxPool layer`。\n- `Activation function:`\n\
  \    - `1`: 连接 `Sigmoid` 函数。\n    - `2`: 连接 `Hyperbolic tangent`（双曲正切）函数。\n    -\
  \ `3`: 连接 `Rectified linear`（线性整流）函数。\n\n例如，设计超参数组合 `{use Dropout`: 1, `use MaxPool`:\
  \ 0, `Activation function`: 3}` 将神经网络中生成以下层序列：\n\n- 线性层\n- Dropout 层\n- ReLU 激活层\n\
  \n设计超参数优化较较少，因为它比层超参数或训练超参数优化更具挑战性。但设计超参数调优可以产生极佳的结果。它为特定问题选择了层及其连接之间的最佳组合。\n\n\
  ## 搜索空间\n\n假设我们确定了需要优化的模型超参数。接下来，我们必须为每个超参数定义搜索空间。确定搜索空间需要一些经验和直觉。你必须理解，搜索空间越大，实验时间越长，找到合适解决方案也越困难。因此，在搜索空间中指定大量的数值是没有意义的。例如，如果\
  \ `l1` 是一个指定线性层维度的超参数（`tensorflow.keras.layers.Dense(l1)` 或 `torch.nn.Linear(out_features=l1)`），那么你不需要将该超参数的搜索空间设置为\n\
  \n40\n\n第 2 章 超参数优化\n\n`[1, 2, 3,..., 999, 1000]`。对于超参数 `l1`，表示 2 的幂次（`2n`）更为合适：`[4,\
  \ 8, 16, ..., 256]`，因为线性层的表示大小仅与比例有关，而非加法（如果 `l1 = 256` 表现不好，那么极有可能 `l1 = 256 +\
  \ 8` 会也会相同的结果）。合理的超参数选择可以在不损失质量的情况下显著减少实验时间。在指定搜索空间之前，可以进行手动探索以确定哪些超参数值对模型性能影响最大。\n\
  \nNNI 允许使用以下采样策略定义超参数搜索空间：choice,randint,uniform,quniform,loguniform,qloguniform,normal,qnormal,lognormal\
  \ 和 qlognormal。\n\n**choice**\n\n`{\"_type\": \"choice\", \"_value\": options}`\n\
  \nChoice 采样策略允许你手动指定超参数可以取的值列表。可以是数字和字符串的列表。例如：\n\n`\"hp\": {\"_type\": \"choice\"\
  , \"_value\": [128, 512, 1024]}`\n\nChoice 采样支持嵌套搜索空间。嵌套 choice 特别是\n\n\n\n\n在处理设计超参数时非常有用。以下是嵌套选择采样的示例：\n\
  \n```json\n\"layer1\" :{\n  \"_type\": \"choice\",\n  \"_value\": [\n    {\"_name\"\
  : \"Empty\"},\n    {\n      \"_name\": \"Conv\",\n      \"kernel_size\": {\n   \
  \     \"_type\": \"choice\",\n        \"_value\": [1, 2, 3, 5]\n      }\n    },\n\
  \    {\n      \"_name\": \"Max_pool\",\n      \"pooling_size\": {\n        \"_type\"\
  : \"choice\",\n        \"_value\": [2, 3, 5]\n      }\n    },\n    {\n      \"_name\"\
  : \"Avg_pool\",\n      \"pooling_size\": {\n        \"_type\": \"choice\",\n   \
  \     \"_value\": [2, 3, 5]\n      }\n    }\n  ]\n}\n```\n\n`randomint`\n```json\n\
  {\"_type\": \"randint\", \"_value\": [lower, upper]}\n```\n从 `lower`（包含）到 `upper`（不包含）之间选择随机整数。\n\
  \n`uniform`\n```json\n{\"_type\": \"uniform\", \"_value\": [low, high]}\n```\n根据\
  \ `[low, high]` 上的均匀分布选择随机值。\n\n`quniform`\n```json\n{\"_type\": \"quniform\", \"\
  _value\": [low, high, q]}\n```\n行为类似于均匀采样，但带有 `q` 离散化，可以表示为 `clip(round(uniform(low,\
  \ high) / q) * q, low, high)`。例如，当 `_value` 指定为 `[1, 11, 2.5]` 时，可能的值有 `[1, 2.5,\
  \ 5, 7.5, 10, 11]`。\n\n`loguniform`\n```json\n{\"_type\": \"loguniform\", \"_value\"\
  : [low, high]}\n```\n根据 `[low, high]` 上的对数均匀分布选择随机值，可以表示为 `np.exp(uniform(np.log(low),\
  \ np.log(high)))`。\n\n`qloguniform`\n```json\n{\"_type\": \"qloguniform\", \"_value\"\
  : [low, high, q]}\n```\n行为类似于对数均匀采样，但带有 `q` 离散化，可以表示为 `clip(round(loguniform(low,\
  \ high) / q) * q, low, high)`。\n\n`normal`\n```json\n{\"_type\": \"normal\", \"\
  _value\": [mu, sigma]}\n```\n根据 `μ = mu` 和 `σ = sigma` 的正态分布选择随机值。\n\n`qnormal`\n\
  ```json\n{\"_type\": \"qnormal\", \"_value\": [mu, sigma, q]}\n```\n行为类似于正态采样，但带有\
  \ `q` 离散化，可以表示为 `round(normal(mu, sigma) / q) * q`。\n\n`lognormal`\n```json\n{\"\
  _type\": \"lognormal\", \"_value\": [mu, sigma]}\n```\n根据 `μ = mu` 和 `σ = sigma`\
  \ 的对数正态分布选择随机值，可以表示为 `np.exp(normal(mu, sigma))`。\n\n`qlognormal`\n```json\n{\"\
  _type\": \"qlognormal\", \"_value\": [mu, sigma, q]}\n```\n行为类似于对数正态采样，但带有 `q` 离散化，可以表示为\
  \ `round(exp(normal(mu, sigma)) / q) * q`。\n\n采样策略的实现在 `nni.parameter`表达式中。你可以手动探索搜索空间策略，如图\
  \ 2-2 所示。\n\n### quniform 采样策略\n```python\nimport nni\nfrom numpy.random import\
  \ RandomState\nimport matplotlib.pyplot as plt\n\n# 我们使用 quniform 策略生成 20 个样本：\n\
  space = nni.quniform(0, 100, 5, RandomState(seed))\nfor seed in range(20):\n   \
  \ # 可视化生成的样本：\n    plt.figure(figsize=(5, 1))\n    plt.title('quniform')\n    plt.plot(space,\
  \ len(space), \"x\")\n    plt.yticks([])\n    plt.show()\n```\n之后，你可以通过图 2-5 中的\
  \ quniform 方法观察生成的样本。\n\n### 搜索空间定义\n```json\n{\n  \"dropout_rate\": {\"_type\"\
  : \"uniform\", \"_value\": [0.1, 0.5]},\n  \"conv_size\": {\"_type\": \"choice\"\
  , \"_value\": [2, 3, 5, 7]},\n  \"layer1_hidden_size\": {\"_type\": \"choice\",\
  \ \"_value\": [128, 512, 1024]},\n  \"layer2_hidden_size\": {\"_type\": \"choice\"\
  , \"_value\": [16, 32, 64]},\n  \"activation_function\": {\"_type\": \"choice\"\
  , \"_value\": [\"tanh\", \"sigmoid\", \"relu\"]},\n  \"training_batch_size\": {\"\
  _type\": \"choice\", \"_value\": [100, 250, 500]},\n  \"training_learning_rate\"\
  : {\"_type\": \"uniform\", \"_value\": [0.0001, 0.1]}\n}\n```\n列出了深度学习模型的典型搜索空间：\n\
  - `dropout_rate`: 层超参数，用于定义 dropout 层中的 `p` 参数。`dropout_rate` 可以取 0.1 到 0.5 之间的任何值。\n\
  - `conv_size`: 层超参数，用于定义卷积层的卷积大小。`conv_size` 可以取 2, 3, 5, 7 中的任何值。\n- `layer1_hidden_size`:\
  \ 层超参数，用于定义第一个隐藏层的神经单元数量。`layer1_hidden_size` 可以取 128, 512, 1024 中的任何值。\n- `layer2_hidden_size`:\
  \ 层超参数，用于定义第二个隐藏层的神经单元数量。`layer2_hidden_size` 可以取 16, 32, 64 中的任何值。\n- `activation_function`:\
  \ 层超参数，用于定义激活函数。`activation_function` 可以取 [\"tanh\", \"sigmoid\", \"relu\"] 中的任何值。\n\
  - `training_batch_size`: 层超参数，用于定义训练时的批大小。`training_batch_size` 可以取 100, 250, 500\
  \ 中的任何值。\n- `training_learning_rate`: 层超参数，用于定义学习率。`training_learning_rate` 可以取\
  \ 0.0001 到 0.1 之间的任何值。\n\n### Tuners（调优器）\n定义搜索空间后，我们需要定义一个调优器来搜索搜索空间并根据结果选择超参数组合。调优器在文件中配置如下：\n\
  \n```yaml\ntuner:\n  name: <Tuner_Name>\n  classArgs:\n    optimize_mode: minimize\n\
  \    arg1: val1\n    arg2: val2\n```\n每个调优器都有自己的参数集。所有调优器的通用参数是 `optimize_mode`，它标记了指标优化的方向：最小（minimize）或最大（maximize）。表\
  \ 2-2 列出了 NNI v.7 可用的调优器列表。\n\n| 配置 ID | 名称 |\n| :--- | :--- |\n| SMAC | 顺序模型优化\
  \ |\n| TPE | 结构帕森估计器 |\n| Random | 随机搜索 |\n| Anneal | 退火搜索算法 |\n| Evolution | 遗传算法搜索\
  \ |\n| BatchTuner | 批量调优器 |\n| GridSearch | 网格搜索 |\n| NetworkMorphism | 网络形变 |\n\
  | MetisTuner | Metis 调优器 |\n| GPTuner | 高斯过程调优器 |\n| PBTTuner | 基于种群的训练调优器 |\n\n\
  我们第 3 章（https://doi.org/10.1007/978-1-4842-8149-9_3）详细介绍调优算法。\n\n### 随机搜索调优器\n随机搜索调优器是选择超参数组合最直接的方法。正如名称所示，组合是完全随机选择的。尽管这种方法简单，但有时可以产生非常好的结果。\n\
  \n```yaml\ntuner:\n  name: Random\n```\n\n### 网格搜索调优器\n网格搜索调优器执行穷举搜索，即网格搜索调优器将搜索空间中所有可能的组合。网格搜索适用于较小的搜索空间。\n\
  \n```yaml\ntuner:\n  name: GridSearch\n```\n\n\n\n现在，我们已经准备好开始第一次探索。让我们来看本书中将使用的文件组织模式。我建议你也采用相同的方法。\n\
  \n这些简单的规则将帮助你在运行实验时避免不必要的错误：\n\n*   为每个实验使用独立的目录。\n*   在实验配置中将当前目录指定为 `trialCodeDirectory`。\n\
  *   将模型类和训练/测试方法保持在单独的文件中。\n*   在试验文件（trial file）将根代码文件夹添加到系统路径。\n*   不要将模型文件和试验文件混合。\n\
  \n让我们来看一个遵循这些规则的示例实验 `ch2/experiment_pattern`。\n\n列表 2-4 提供了实验配置文件。\n\n该配置文件将当前目录标记为工作目录：\n\
  `trialCodeDirectory: .`\n\n***Listing 2-4.*** 实验配置。`ch2/experiment_pattern/config.yml`\n\
  ```\ntrialConcurrency: 1\nsearchSpaceFile: search_space.json\ntrialCodeDirectory:\
  \ .\ntrialCommand: python3 trial.py\ntuner:\n  name: GridSearch\n  trainingService:\n\
  \    platform: local\n```\n\n模型类和训练/测试方法位于列表 2-5 所示的单独文件中。\n\n***Listing 2-5.***\
  \ DummyModel 类。`ch2/experiment_pattern/model.py`\n```python\nfrom random import\
  \ random\n\nclass DummyModel:\n    def __init__(self, x, y) -> None:\n        super().__init__()\n\
  \        self.x = x\n        self.y = y\n\n    def train(self):\n        # Training\
  \ here\n        ...\n\n    def test(self):\n        # Test results\n        return\
  \ round(self.x + self.y + random() / 10, 2)\n```\n\n***Table 2-3.** NNI API*\n\n\
  | 方法 |  |\n| :--- | :--- |\n| `nni.get_next_parameter()` | 必须的方法，接收来自 `nni tuner`\
  \ 的 `Dict` 对象格式的试验参数 |\n| `nni.report_intermediate_result(m)` | 可选方法，将中间结果发送给 `nni\
  \ tuner` |\n| `nni.report_final_result(m)` | 必须的方法，发送代表模型性能的最终指标 |\n\n试验脚本从 NNI\
  \ tuner 接收参数，初始化模型，训练它并测试其性能。试验脚本通过表 [2-3.]所示的 API 方法与 NNI 交互。\n\n让我们来看列表 2-6 中的试验脚本模式。\n\
  \n我们导入了必要的模块：\n\n***Listing 2-6.*** 试验脚本模式。`ch2/experiment_pattern/trial.py`\n```python\n\
  import os\nimport sys\nimport nni\n```\n\n在这里，我们将代码的根目录添加到系统路径。这样做是因为 NNI 并不知道我们的代码结构以及模块的位置。\n\
  \n```python\n# For NNI use relative import for user-defined modules\nSCRIPT_DIR\
  \ = os.path.dirname(os.path.abspath(__file__)) + '/../..'\nsys.path.append(SCRIPT_DIR)\n\
  ```\n\n现在，我们可以从代码结构中导入需要的类：\n```python\nfrom ch2.experiment_pattern.model import\
  \ DummyModel\n```\n\n试验启动模型，对其进行训练，测量其性能，并将结果返回给 NNI Tuner：\n```python\ndef trial(hparams):\n\
  \    \"\"\"\n    Trial Script:\n    - Initiate Model\n    - Train\n    - Test\n\
  \    - Report\n    \"\"\"\n    model = DummyModel(**hparams)\n    model.train()\n\
  \    accuracy = model.test()\n    # send final accuracy to NNI\n    nni.report_final_result(accuracy)\n\
  ```\n\n这里是试验脚本的入口：\n```python\nif __name__ == '__main__':\n    # Manual HyperParameters\n\
  \    hparams = {\n        'x': 1,\n        'y': 1,\n    }\n    # NNI HyperParameters\n\
  \    # Run safely without NNI Experiment Context\n    nni_hparams = nni.get_next_parameter()\n\
  \    hparams.update(nni_hparams)\n    trial(hparams)\n```\n\n你可以以独立模式运行试验脚本 `ch2/experiment_pattern/trial.py`。这意味着你可以运行此脚本而不会产生任何错误。`nni.get_next_parameter()`\
  \ 方法将返回一个空字典，你可以将其与试验参数合并。这在你想要测试试验执行情况时非常方便。\n\n实验文件结构模式可以如图 [2-8] 所示。\n\n***Figure\
  \ 2-8.** 实验文件结构*\n\n很好！我们定义了不同的超参数类型，检查了如何定义搜索空间，研究了简单的调优器，并了创建实验的模式。我们现在准备好进入真正的研究了。后续章节将研究\
  \ HPO 方法如何针对特定问题优化模型，并帮助开发新的模型设计。\n\n### 针对 MNIST 问题优化 LeNet\n\n库：TensorFlow (Keras\
  \ API), PyTorch\n\nMNIST 分类问题是测试各种机器学习方法的常用问题。卷积神经网络在识别领域取得了突破。它被分为两个部分：包含 60,000\
  \ 个样本的训练集和 10,000 个样本的测试集。\n\nMNIST 数据集是一组 28×28 的灰度图像。因此，每个数据集都是 (28, 28, 1) 张量。让我们来看该数据集的几个样本。\n\
  \n***Listing 2-7.*** MNIST 数据集。`ch2/lenet_hpo/mnist_dataset.py`\n```python\nimport\
  \ tensorflow_datasets as tfds\nds, info = tfds.load('mnist', split='train', with_info=True)\n\
  fig = tfds.show_examples(ds, info)\nfig.show()\n```\n\n***Figure 2-9.** MNIST 数据库*\n\
  \n这看起来是一个非常简单的任务，但事实并非如此。回想你经常无法理解别人写的数字。手写识别是模式识别的基本问题之一。\n\n该模型流行的主要原因是其直接的架构。它是一个用于分类的多层卷积网络。抽象的\
  \ LeNet 模型设计如图 2-11 所示。\n\n***Figure 2-11.** LeNet 架构*\n\n我们的目标是优化 LeNet 模型以解决手写识别问题。简单的方法是从层参数开始。让我们数数\
  \ LeNet 模型中的层参数：\n\n*   **Conv2D 层**：五个超参数 (`out_channels`, `kernel_size`, `stride`,\
  \ `padding`, `dilation`)\n*   **MaxPool2D 层**：两个超参数 (`kernel_size`, `stride`)\n\
  *   **Linear 层**：两个超参数 (`out_features`, `use_bias`)\n\nLeNet 包含两个 `Conv2D` 层、两个\
  \ `MaxPool2D` 层和两个线性层。因此，LeNet 中有 $2\\times5 + 2\\times2 + 2\\times2 = 14$ 个层参数。假设对于每个超参数，我们只有一个包含两个元素的可能集合，尽管当然，许多超参数为了实验的灵活性需要更多值。即使是二分搜索空间也包含\
  \ $2^{14} = 16384$ 个元素。而这些只是简单的深度学习模型的原始层参数。随着模型复杂性的增加，其中可能的超参数数量呈指数级增长。即使是最先进的调优器也可以花费长时间来探索这个搜索空间。因此，我们需要一些经验和直觉，这允许我们在不过度增加搜索空间的情况下，为每个模型选择关键的超参数范围。\n\
  \n\n\n\n- **线性层**: `out_features`\n\n为了缩小搜索空间的大小，我们设置：\n\n- `filter_size_2 = 2 *\
  \ filter_size_1`\n- `kernel_size_1 = kernel_size_2`\n\n然后，我们将仅针对 LeNet 模型关注三个超参数：\n\
  \n- `filter_size`\n- `kernel_size`\n- `out_features`\n\n## 第 2 章 超参数优化\n\n通常，卷积层\
  \ `filter_size` 的最佳值呈现为 $2^n$ 形式。因此，我们为搜索空间选择了以下值：8, 16, 32。`kernel_size` 的值通常在\
  \ $2^n+1$ 的集合中选择。图像越大，选择的 `kernel_size` 值也应该越大。MNIST 数据集的样本是 $28\\times28$ 的像素图像。这些是非常较小的图像，因此我们不应该选择较大的\
  \ `kernel_size` 值：2, 3, 5。`l1_size` 的最佳值与 `filter_size` 一样都是 2 的幂。线性层应用于 `flatten`\
  \ 层之后的张量，这意味着我们必须考虑之前层产生的张量维度。在 MNIST 问题中，我们将关注以下 `l1_size` 值：32, 64, 128。对于 `MaxPool2D`\
  \ 层，我们将设置 `pool_size` 的最小可能值 2，并将 `sigmoid` 设置为激活函数。是的！这个函数很长期以来一直被用作大多数模式识别问题的激活函数。我们将在下一节中回到选择激活函数的问题。\n\
  \n我们将使用带有 `Adam` 优化器的经典批处理神经网络训练。现在让我们通过选择最简单的超参数：`batch_size` 和 `learning_rate`\
  \ 来进行研究。`batch_size` 的最佳参数表示为 $2^n$，`learning_rate` 表示为 $10^{-n}$。对于这种情况，我们将选择：256,\
  \ 512, 1024 作为 `batch_size`，并选择 0.01, 0.001, 0.0001 作为 `learning_rate`。\n\n现在，让我们之前之前设置的超参数约束转换为\
  \ NNI 搜索空间。列表 2-8 定义了 LeNet 超参数优化的搜索空间。\n\n***Listing 2-8.*** LeNet HPO 搜索空间。`ch2/lenet_hpo/search_space.json`\n\
  \n```json\n{\n  \"filter_size\": {\n    \"_type\": \"choice\", \"_value\": [8, 16,\
  \ 32]\n  },\n  \"kernel_size\": {\n    \"_type\": \"choice\", \"_value\": [2, 3,\
  \ 5]\n  },\n  \"l1_size\": {\n    \"_type\": \"choice\", \"_value\": [32, 64, 128]\n\
  \  },\n  \"batch_size\": {\n    \"_type\": \"choice\", \"_value\": [256, 512, 1024]\n\
  \  },\n  \"learning_rate\": {\n    \"_type\": \"choice\", \"_value\": [0.01, 0.001,\
  \ 0.0001]\n  }\n}\n```\n\n## 第 2 章 超参数优化\n\n很好！在下一步中，我们将结合 HPO 问题，创建 LeNet 模型的 TensorFlow\
  \ 和 PyTorch 实现。\n\n### TensorFlow LeNet 实现\n\n在本节中，我们将学习使用 TensorFlow (Keras API)\
  \ 实现 LeNet 模型。列表 2-9 展示了用于超参数优化的 TensorFlow LeNet 模型。\n\n我们导入必要的模块：\n\n***Listing\
  \ 2-9.*** LeNet. TensorFlow 实现。`ch2/lenet_hpo/tf_lenet_model.py`\n\n```python\n\
  from tensorflow.keras import Model\nfrom tensorflow.keras.layers import Conv2D,\
  \ Dense, Flatten, MaxPool2D\nfrom tensorflow.keras.optimizers import Adam\nfrom\
  \ ch2.utils.datasets import mnist_dataset\nfrom ch2.utils.tf_utils import TfNniIntermediateResult\n\
  ```\n\n接下来，我们定义具有三个层超参数的 LeNet 模型：\n\n```python\nclass TfLeNetModel(Model):\n  \
  \  def __init__(self, filter_size, kernel_size, l1_size):\n        super().__init__()\n\
  \        # 第一层卷积栈：\n        self.conv1 = Conv2D(\n            filters=filter_size,\n\
  \            kernel_size=kernel_size,\n            activation='sigmoid'\n      \
  \  )\n        self.pool1 = MaxPool2D(pool_size=2)\n        # 第二层卷积栈：\n        self.conv2\
  \ = Conv2D(\n            filters=filter_size * 2,\n            kernel_size=kernel_size,\n\
  \            activation='sigmoid'\n        )\n        self.pool2 = MaxPool2D(pool_size=2)\n\
  \        # 全连接层栈：\n        self.flatten = Flatten()\n        self.fc1 = Dense(\n\
  \            units=l1_size,\n            activation='sigmoid'\n        )\n     \
  \   self.fc2 = Dense(\n            units=10,\n            activation='softmax'\n\
  \        )\n```\n\nLeNet 是一个简单的模型，它将计算结果从一层传递到另一层：\n\n```python\n    def call(self,\
  \ x, **kwargs):\n        x = self.conv1(x)\n        x = self.pool1(x)\n        x\
  \ = self.conv2(x)\n        x = self.pool2(x)\n        x = self.flatten(x)\n    \
  \    x = self.fc1(x)\n        return self.fc2(x)\n```\n\n训练方法使用两个超参数：`batch_size`\
  \ 和 `learning_rate`。我们使用 `Adam` 优化器和交叉熵损失函数：\n\n```python\n    def train(self, learning_rate,\
  \ batch_size):\n        self.compile(\n            optimizer=Adam(learning_rate=learning_rate),\n\
  \            loss='sparse_crossentropy',\n            metrics=['accuracy']\n   \
  \     )\n        (x_train, y_train) = mnist_dataset()\n```\n\n接下来，我们初始化一个将中间结果发送到\
  \ NNI 的回调函数：\n\n```python\nintermediate_cb = TfNniIntermediateResult('accuracy')\n\
  ```\n\n执行十个 epoch 的经典批处理训练：\n\n```python\n        self.fit(\n            x_train,\n\
  \            y_train,\n            batch_size=batch_size,\n            epochs=10,\n\
  \            verbose=0,\n            callbacks=[intermediate_cb]\n        )\n```\n\
  \n最后一个方法是 `test`。我们加载数据集并通过准确率进行分类：\n\n```python\n    def test(self):\n        \"\
  \"\"Testing 模型\"\"\"\n        (x_train, y_train) = mnist_dataset()\n        loss,\
  \ accuracy = self.evaluate(x_train, y_train, verbose=0)\n        return accuracy\n\
  ```\n\n## 第 2 章 超参数优化\n\n好了，由于 TensorFlow 模型已经就绪，我们可以使用列表 10 实现 NNI 脚本：\n\n```python\n\
  import os\nimport sys\nimport nni\n\n# NNI 使用相对导入\nSCRIPT_DIR = os.path.dirname(os.path.abspath(__file__))\
  \ + '/..'\nsys.path.append(SCRIPT_DIR)\nfrom ch2.lenet_hpo.tf_lenet_model import\
  \ TfLeNetModel\n\n# trial 方法初始化模型、训练并返回 NNI 指标：\n\n```python\ndef trial(hparams):\n\
  \    model = TfLeNetModel(\n        filter_size=hparams['filter_size'],\n      \
  \  kernel_size=hparams['kernel_size'],\n        l1_size=hparams['l1_size']\n   \
  \ )\n    model.train(\n        batch_size=hparams['batch_size'],\n        learning_rate=hparams['learning_rate']\n\
  \    )\n    accuracy = model.test()\n    nni.report_final_result(accuracy)\n```\n\
  \n最后，我们为 trial 定义主入口：\n\n```python\nif __name__ == '__main__':\n    # 手动超参数\n  \
  \  hparams = {\n        'filter_size': 32,\n        'kernel_size': 3,\n        'l1_size':\
  \ 64,\n        'batch_size': 512,\n        'learning_rate': 1e-3,\n    }\n    #\
  \ NNI 超参数\n    # 在没有 NNI 实验的情况下安全运行\n    nni_hparams = nni.get_next_parameter()\n\
  \    hparams.update(nni_hparams)\n    trial(hparams)\n```\n\n记得 trial 脚本可以独立运行，因此你可以运行\
  \ `ch2/lenet_hpo/tf_trial.py` 使用自定义参数测试其执行。\n\n## 第 2 章 超参数优化\n\n### PyTorch LeNet\
  \ 实现\n\n在本节中，我们将学习使用 PyTorch 实现 LeNet 模型的实现。列表 2-11 展示了用于超参数优化的 PyTorch LeNet 模型。\n\
  \n我们导入必要的模块：\n\n***Listing 2-11.*** LeNet. PyTorch 实现。`ch2/lenet_hpo/pt_lenet_model.py`\n\
  \n```python\nimport numpy as np\nimport nni\nimport torch\nimport torch.nn as nn\n\
  import torch.nn.functional as F\nimport torch.optim as optim\nfrom sklearn.metrics\
  \ import accuracy_score\nfrom ch2.utils.datasets import mnist_dataset\n```\n\n接下来，我们定义具有三个层超参数的\
  \ LeNet 模型：\n\n```python\nclass PtLeNetModel(nn.Module):\n    def __init__(self,\
  \ filter_size, kernel_size, l1_size):\n        super(PtLeNetModel, self).__init__()\n\
  \        # 此实现将使用懒层初始化，因此我们显式保存了 l1_\n        self.conv1 = nn.Conv2d(1, filter_size,\
  \ kernel_size)\n        self.pool1 = nn.MaxPool2d(2)\n        self.conv2 = nn.Conv2d(filter_size,\
  \ filter_size * 2, kernel_size)\n        self.pool2 = nn.MaxPool2d(2)\n        self.flatten\
  \ = nn.Flatten()\n        # 我们使用懒层或根据输入大小定义输入特征\n        # 对于 MNIST 28x28，在两次 2x2\
  \ 池化和两次卷积后，大小为 7x7。\n        self.fc1 = nn.Linear(filter_size * 2 * 7 * 7, l1_size)\n\
  \        self.fc2 = nn.Linear(l1_size, 10)\n```\n\nLeNet 是一个简单的模型，它将计算结果从一层传递到另一层：\n\
  \n```python\n    def forward(self, x):\n        x = F.relu(self.conv1(x))\n    \
  \    x = self.pool1(x)\n        x = F.relu(self.conv2(x))\n        x = self.pool2(x)\n\
  \        x = self.flatten(x)\n        x = F.relu(self.fc1(x))\n        x = F.softmax(self.fc2(x),\
  \ dim=1)\n        return x\n```\n\n\n\n\n\n大小超参数：\n\n# 保存 l1_size 超参数\n\n```python\n\
  self.l1_size = l1_size\n```\n\n之后，我们初始化了卷积层：\n\n```python\nself.conv1 = nn.Conv2d(\n\
  \    in_channels = 1,\n    out_channels = filter_size,\n    kernel_size = kernel_size\n\
  )\n```\n\n61 第 2 章 超参数优化\n\n```python\nself.conv2 = nn.Conv2d(\n    in_channels\
  \ = filter_size,\n    out_channels = filter_size * 2,\n    kernel_size = kernel_size\n\
  )\n```\n\n我们没有初始化第一个线性层，而是使用了懒性初始化（lazy initialization）。为了初始化一个线性层，我们必须指定一个 `in_features`\
  \ 值。但这并不简单。我们需要知道之前的层将产生的张量维度。为了做到这一点，有时你必须进行复杂的计算。在第一次调用时计算该张量的维度并在此时初始化线性层会更简单一些。\n\
  \n# 懒性 fc1 层初始化\n\n```python\nself.fc1__in_features = 0\nself._fc1 = None\nself.fc2\
  \ = nn.Linear(l1_size, 10)\n```\n\n懒性层初始化：\n\n```python\n@property\ndef fc1(self):\n\
  \    if self._fc1 is None:\n        self._fc1 = nn.Linear(\n            self.fc1__in_features,\n\
  \            self.l1_size\n        )\n    return self._fc1\n```\n\nLeNet 是一个简单的模型，它将计算结果从一层传递到另一层：\n\
  \n```python\ndef forward(self, x):\n    x = torch.sigmoid(self.conv1(x))\n    x\
  \ = F.max_pool2d(x, 2, 2)\n    x = torch.sigmoid(self.conv2(x))\n    x = F.max_pool2d(x,\
  \ 2, 2)\n```\n\n62 第 2 章 超参数优化\n\n# 平平除 batch 维度以外的所有维度\n\n```python\nif not self.fc1__in_features:\n\
  \    self.fc1__in_features = np.prod(x.shape[1:])\n    x = x.view(-1, self.fc1__in_features)\n\
  ```\n\n# FC1 懒性初始化\n\n```python\nx = torch.sigmoid(self.fc1(x))\nx = self.fc2(x)\n\
  return F.log_softmax(x, dim = 1)\n```\n\n训练方法使用了两个训练超参数：`batch_size` 和 `learning\
  \ rate`：\n\n```python\ndef train_model(self, learning_rate, batch_size):\n```\n\n\
  我们准备训练数据集：\n\n```python\n(x, y), _ = mnist_dataset()\nx = torch.from_numpy(x).float()\n\
  y = torch.from_numpy(y).long()\n```\n\n# 为 PyTorch 卷积置换维度\n\n```python\nx = torch.permute(x,\
  \ (0, 3, 1, 2))\ndataset_size = x.shape[0]\n```\n\n初始化 Adam 优化器：\n\n```python\n\
  optimizer = optim.Adam(\n    self.parameters(),\n    lr = learning_rate\n)\n```\n\
  \n原生 PyTorch 不支持内置的批处理训练。因此，我们手动将数据集划分为批次，并执行 epoch 循环和 batch 循环：\n\n```python\n\
  self.train()\nfor epoch in range(1, 10 + 1):\n    # 用于批训练的随机置换\n    permutation\
  \ = torch.randperm(dataset_size)\n    for bi in range(1, dataset_size, batch_size):\n\
  ```\n\n63 第 2 章 超参数优化\n\n# 创建新 Batch\n\n```python\nindices = permutation[bi:bi +\
  \ batch_size]\nbatch_x, batch_y = x[indices], y[indices]\n```\n\n使用交叉熵损失函数进行模型参数优化：\n\
  \n```python\noptimizer.zero_grad()\noutput = self(batch_x)\nloss = F.cross_entropy(output,\
  \ batch_y)\nloss.backward()\noptimizer.step()\n```\n\n在每个 epoch 结束时，我们计算模型的准确率并作为中间结果返回给\
  \ NNI：\n\n```python\noutput = self(x)\npredict = output.argmax(dim = 1, keepdim\
  \ = True)\naccuracy = round(accuracy_score(predict, y), 4)\nprint(f'Epoch: {epoch}|\
  \ Accuracy: {accuracy}')\n```\n\n# report 中间结果\n\n```python\nnni.report_intermediate_result(accuracy)\n\
  ```\n\n我们需要定义的最后一个方法是模型测试。我们加载测试 MNIST 数据集并通过测量其准确率来执行分类：\n\n```python\ndef test_model(self):\n\
  \    self.eval()\n    # 准备测试数据集\n    _, (x, y) = mnist_dataset()\n    x = torch.from_numpy(x).float()\n\
  \    y = torch.from_numpy(y).long()\n    x = torch.permute(x, (0, 3, 1, 2))\n  \
  \  with torch.no_grad():\n        output = self(x)\n        predict = output.argmax(dim\
  \ = 1, keepdim = True)\n        accuracy = round(accuracy_score(predict, y), 4)\n\
  \    return accuracy\n```\n\n64 第 2 章 超参数优化\n\n好了，由于 PyTorch 的实现已经就绪，我们加载测试 MNIST\
  \ 数据集并通过测量其准确率来执行分类（注：此处描述与上文重复，为翻译原文内容）。\n\n\n\n\n在完成一项研究后，我喜欢将结果可视化。我们已经有了准确率指标。但如果看一眼\
