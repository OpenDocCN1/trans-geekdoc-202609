  \ 5-4 展示了这一点。\n\n***图 5-4.** 超网络中的不同层重要性*\n\n由于我们对单次 NAS 方法有了直觉，我们可以开始使用 NNI 框架来实现它。\n\
  \n## 超网络架构\n\n正如我们在上一节看到的，单次 NAS 的核心概念是超网络。超网络是一个包含各种架构的单一神经网络。在多次尝试 NAS 中，每个数据图都是单独测试的。但单次\
  \ NAS 创建的是单一超网络。\n\nNNI 使用 `LayerChoice` 和 `InputChoice` 创建模型空间。`reduce` 操作可以是 `sum`、`mean`\
  \ 或任何其他操作。`LayerChoice` 候选在超网络中被归约。图 5-5 使用 `sum` 生成超网络。\n\n***图 5-5.** 模型空间*\n\n\
  图 5-6 展示了特定子网络的评估。\n\n***图 5-6.** 子网络评估*\n\n单次 NAS 对 `LayerChoice` 和 `InputChoice`\
  \ 候选设置了严格限制：它们必须返回相同大小的张量。否则将无法实现 `reduce` 操作。在之前的节中，`conv1` 的候选返回 `16×28×28`，而\
  \ `conv2` 的候选返回 `32×14×14`。图 5-8 展示了事实。这种限制在多次尝试 NAS 中并不，因为 TensorFlow 和 PyTorch\
  \ 框架允许根据输入张量计算层参数；因此 `LayerChoice` 候选可以返回不同大小的张量。在单次 NAS 中，我们必须确保候选返回相同大小的张量。否则，NAS\
  \ 算法会报错。\n\n让我们为单次 NAS 创建第一个模型空间。它将是一个“Hello World”模型，我们将用它在下一节测试单次 NAS 算法。我们将使用图\
  \ 5-9 所示的 LeNet 架构为单次搜索定义模型空间。\n\n***图 5-9.** LeNet 单次模型空间*\n\n\n\n\n```python\n\
  create_conv(kernel = 1, filters = 16), # 0\ncreate_conv(kernel = 3, filters = 16),\
  \ # 1\ncreate_conv(kernel = 5, filters = 16) # 2\n], key = 'conv1')\n\nself.conv2\
  \ = LayerChoice([\ncreate_conv(kernel = 1, filters = 32), # 0\ncreate_conv(kernel\
  \ = 3, filters = 32), # 1\ncreate_conv(kernel = 5, filters = 32) # 2\n], key = 'conv2')\n\
  self.pool = MaxPool2D(2)\nself.flat = Flatten()\n```\n\n为线性层设置 InputChoice：\nself.dm\
  \ = InputChoice(n_candidates = 2, n_chosen = 1, key = 'dm')\nself.fc11 = Dense(256,\
  \ activation = 'relu')\nself.fc12 = Dense(10, activation = 'softmax')\nself.fc2\
  \ = Dense(10, activation = 'softmax')\n\n278\n第 5 章 一次性神经架构搜索\n\n定义 call 方法：\n```python\n\
  def call(self, x):\n    x = self.conv1(x)\n    x = self.pool(x)\n    x = self.conv2(x)\n\
  \    x = self.pool(x)\n    x = self.flat(x)\n    # 分支 1\n    x1 = self.fc12(self.fc11(x))\n\
  \    # 分支 2\n    x2 = self.fc2(x)\n    # 选择其中一个分支\n    x = self.dm([\n        x1,\
  \ # 0\n        x2 # 1\n    ])\n    return x\n```\n\n图 5-9 所示的模型空间的 PyTorch NNI 实现已现在代码列表\
  \ 5-10 中。\n\n`LayerChoice` 和 `InputChoice` 方法在 `nni.retiarii.nn.pytorch` 包中实现：\n\
  \n***列表 5-10.*** PyTorch 实现。一次性 LeNet NAS。`ch5/model/lenet/pt_lenet.py`\n\n```python\n\
  from nni.retiarii.nn.pytorch import LayerChoice, InputChoice\n导入其他模块：\nfrom typing\
  \ import OrderedDict\nimport torch.nn as nn\nimport torch.nn.functional as F\n```\n\
  \n279\n第 5 章 一次性神经架构搜索\n\n定义创建卷积层的辅助函数：\n```python\ndef create_conv(kernel, in_ch,\
  \ out_ch):\n    return nn.Conv2d(\n        in_channels = in_ch,\n        out_channels\
  \ = out_ch,\n        kernel_size = kernel,\n        padding = int((kernel - 1) /\
  \ 2)\n    )\n\nclass PtLeNetSupernet(nn.Module):\n    def __init__(self, input_ts\
  \ = 32):\n        super(PtLeNetSupernet, self).__init__()\n        为 conv1 和 conv2\
  \ 层设置 LayerChoices：\n        self.conv1 = LayerChoice(OrderedDict([\n          \
  \  ('conv1x1->16', create_conv(1, 1, 16)), # 0\n            ('conv3x3->16', create_conv(3,\
  \ 1, 16)), # 1\n            ('conv5x5->16', create_conv(5, 1, 16)), # 2\n      \
  \  ]), label = 'conv1')\n        self.conv2 = LayerChoice(OrderedDict([\n      \
  \      ('conv1x1->32', create_conv(1, 16, 32)), # 0\n            ('conv3x3->32',\
  \ create_conv(3, 16, 32)), # 1\n            ('conv5x5->32', create_conv(5, 16, 32)),\
  \ # 2\n        ]), label = 'conv2')\n        self.act = nn.ReLU()\n        self.flat\
  \ = nn.Flatten()\n```\n\n280\n第 5 章 一次性神经架构搜索\n\n为线性层设置 InputChoice：\nself.dm =\
  \ InputChoice(n_candidates = 2, n_chosen = 1, label = 'dm')\nself.fc11 = nn.Linear(input_ts\
  \ * 8 * 8, 256)\nself.fc12 = nn.Linear(256, 10)\nself.fc2 = nn.Linear(input_ts *\
  \ 8 * 8, 10)\n\n定义 forward 方法：\n```python\ndef forward(self, x):\n    x = self.act(self.conv1(x))\n\
  \    x = F.max_pool2d(x, 2, 2)\n    # x.shape = (16, 16, 16)\n    x = self.act(self.conv2(x))\n\
  \    x = F.max_pool2d(x, 2, 2)\n    # x.shape = (32, 8, 8)\n    x = self.flat(x)\n\
  \    # 分支 1\n    x1 = self.act(self.fc11(x))\n    x1 = self.act(self.fc12(x1))\n\
  \    # 分支 2\n    x2 = self.act(self.fc2(x))\n    # 选择其中一个分支\n    x = self.dm([\n\
  \        x1, # 0\n        x2 # 1\n    ])\n    return F.log_softmax(x, dim = 1)\n\
  ```\n\n由于我们使用 NNI 定义了一次性模型空间，可以实现高级的一次性算法。\n\n281\n第 5 章 一次性神经架构搜索\n\n**一次性算法 (One-Shot\
  \ Algorithms)**\n\n目前，One-shot NAS 是一个新兴领域并正在快速发展。许多一次性算法正在发明。本节将研究两种最流行的一次性算法：高效架构搜索\
  \ (ENAS) 和可微架构搜索 (DARTS)。\n\n### 高效架构搜索 (ENAS)\n\n高效架构搜索 (ENAS) 是一种快速且廉价的模型设计方法。在\
  \ ENAS 中，控制器通过在大型超网中搜索最优子网络来发现神经网络架构。使用策略梯度训练控制器以选择在验证集上期望奖励最大的子网络。同时，对选定的子网络进行训练。\n\
  \n原始论文 [参数共享的高效架构搜索](https://arxiv.org/pdf/1802.03268) 使 ENAS 比比经典方法更少的 GPU 小时提供了更强的性能。\n\
  \n目前，One-shot NAS 是一个新兴领域并正在快速发展。许多一次性算法正在发明。本节将研究两种最流行的一次性算法：高效架构搜索 (ENAS) 和可微架构搜索\
  \ (DARTS)。\n\nENAS 的核心概念之一是强化学习控制器。控制器通过定义二进制掩码来选择子网络，其中 1 激活层，0 禁用。图 5-10 显示了 RL\
  \ 控制器如何选择子网络。\n\nENAS 的核心是权重共享。不同的子网络共享权重。当控制器挑选子网络时，它并不是从头训练的；层共享已经训练过的权重。\n\n\
  282\n(index-296.png)\n\n第 5 章 一次性神经架构搜索\n***图 5-10.** RL 控制器子网络选择*\n\n283\n(index-297.png)\n\
  \n第 5 章 一次性神经架构搜索\n***图 5-11.** 权重共享*\n\n权重共享方法允许控制器通过较少的迭代找到最佳架构，而无需每次都从头训练新的子网络。ENAS\
  \ 算法可以使用以下伪代码演示：\n\n我们初始化超网：S\n并加载训练集和验证集：train_ds, val_ds\n接下来，算法初始化 ENAS 控制器 (Controller(S,\
  \ θ)),其中 θ 表示有助于从 S 超网中选择子网络的控制器权重：\nCtrl = Controller(S, θ)\n\n主训练循环：\nfor epoch\
  \ in epochs:\n    1. 超网训练循环：\n        for batch in batches(train_ds):\n        \
  \    i. 控制器实现随机策略，这意味着它按概率运行。最有潜力的子网络被选中的概率最高：\n                s ← Ctrl.sample()\
  \ # 选择伪随机子网络\n            ii. 使用权重共享技术在训练批次上对子网络训练一次（即仅一个训练 epoch）：\n          \
  \      train_once(subnet, batch)\n    2. 控制器训练循环。在这个循环中，控制器学习如何找到提供最高奖励的子网络，即验证集上的准确率：\n\
  \        for batch in batches(val_ds):\n            i. 控制器选择子网络并计算其在验证集批次上的准确率：\n\
  \                subnet ← Ctrl.sample() # 选择伪随机子网络\n                reward = test(subnet,\
  \ batch)\n            ii. 控制器收集子网络性能的经验：\n                Ctrl.add_experience(reward)\n\
  \    3. 控制器根据新经验更新权重 θ：\n        Ctrl.self_update_with_new_experience()\n# 主训练循环结束\n\
  \n训练后，控制器返回最佳子网络：\nCtrl.best()\n\n284\n第 5 章 一次性神经架构搜索\n285\n第 5 章 一次性神经架构搜索\n\n\
  \n\n\n在前面描述的算法中，`Controller` 在训练数据集上训练各种子网络，然后在验证集上对其进行测试。通过多次重复此过程，`Controller`\
  \ 能够理解哪些架构表现出最好的准确率，并逐渐将探索过程缩小到有限数量的架构。在训练过程结束时，`Controller` 会收敛到一个或多个最佳架构上。\n\n\
  让我们来看看 ENAS 在实践中是如何工作的：\n\n1. 初始，`Controller` 对子网络没有任何假设，它使用权重共享技术随机选择子网络进行单次训练（子网络仅训练一个训练\
  \ epoch），如图 5-11 所示。\n2. 之后，`Controller` 根据 `θ` 权重生成子网络，并在验证集上收集准确率。\n3. 根据第 2 步中获得的经验，`Controller`\
  \ 更新 `θ` 值。\n\n图 5-12 展示](#index_split_002.html#p300)展示了我们之前描述的第 1-3 步。\n\n286\n\
  \n![](img/index-300_1.png)\n\n第 5 章 单次神经网络架构搜索\n\n**图 5-12。** ENAS 的运行机制。初始 epoch。\n\
  \n接下来，`Controller` 使用权重共享技术选择最有潜力的子网络进行训练，并在验证集上测试它们的准确率，如图 5-13](#index_split_002.html#p301)\
  \ 所示。\n\n287\n\n![](img/index-301_1.png)\n\n第 5 章 单次神经网络架构搜索\n\n**图 5-13。** ENAS\
  \ 的运行机制。训练中期。\n\n在分别训练超网层并更新关于 `θ` 的经验后，`Controller` 会收敛到它认为最佳的某些子网络。图 5-14](#index_split_002.html#p302)说明了这一点。\n\
  \n288\n\n![](img/index-302_1.png)\n\n第 5 章 单次神经网络架构搜索\n\n**图 5-14。** ENAS 的运行机制。训练结束。\n\
  \nOne-shot ENAS 算法接近于多试验 NAS 中的 RL 策略，但有一个显著区别。ENAS 不进行完整的子网络训练周期，而是使用权重共享和增量单步训练。这种区别极大地加快了寻找最佳架构的过程。\n\
  \nNNI 使用以下类实现 ENAS：\n\n- **PyTorch**: `nni.retiarii.oneshot.pytorch.enas.EnasTrainer`\n\
  - **TensorFlow**: `nni.algorithms.nas.tensorflow.enas.EnasTrainer`\n\n289\n\n表 5-3\
  \ 显示了 `EnasTrainer` 参数。\n\n**表 5-3. EnasTrainer 参数**\n\n| 参数 | 描述 |\n| :--- | :---\
  \ |\n| model | 待训练的 pytorch 或 tensorflow 模型 |\n| loss | 类型: callable, 损失函数 |\n|\
  \ metrics | 类型: callable, 衡量模型准确率 |\n| reward_function | 类型: callable, 用于 enAS `Controller`\
  \ 计算奖励。通常情况下，`reward_function` 返回模型准确率 |\n| optimizer | 类型: `Optimizer`, 用于模型训练的优化器\
  \ |\n| num_epochs | 类型: `int`, 计划训练的 epoch 数量 |\n| dataset | 类型: `Dataset`, 训练数据集\
  \ |\n| batch_size | 类型: `int`, 默认: 64, 训练批大小 |\n| workers | 类型: `int`, 默认: 4, 数据加载的线程数\
  \ |\n| log_frequency | 类型: `int`, 默认: None, 日志步数 |\n| grad_clip | 类型: `float`, 默认:\
  \ 5.0, 梯度裁剪。设置为 0 则禁用 |\n| entropy_weight | 类型: `float`, 默认: 0.0001, 样本熵损失权重 |\n\
  | skip_weight | 类型: `float`, 默认: 0.8, 跳过惩罚损失权重 |\n| baseline_decay | 类型: `float`,\
  \ 默认: 0.999, 基准衰减率。新基准计算公式为 `baseline_decay * baseline_old + reward * (1 - baseline_decay)`\
  \ |\n| ctrl_lr | 类型: `float`, 默认: 0.00035, 控制器学习率 |\n| ctrl_steps_ | 类型: `int`,\
  \ 默认: 20, 聚合到 `Controller` 的一个 mini-batch 中的总步数 |\n\n现在让我们来看 ENAS 算法在上一节中定义的 LeNet\
  \ 模型空间中的实际应用。\n\n### TensorFlow ENAS 实现\n\n列表 5-11 展示](#index_split_002.html#p304)了使用\
  \ TensorFlow LeNet 模型空间进行 ENAS 应用。\n\n导入模块：\n\n**列表 5-11。** ENAS TensorFlow. ch5/enas/enas_tf_search.py\n\
