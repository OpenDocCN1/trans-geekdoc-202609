  \ Dense(128, 'relu')\n        self.fc2 = Dense(10, 'softmax')\n```\n\n`call` 方法接受\
  \ `mask` 参数，在求和操作中激活候选层。训练模式下不传递 `mask` 参数，所有候选方案都相加：\n`x = 1*conv1_1(x) + 1*conv1_3(x)\
  \ + 1*conv1_5(x)`\n`x = 1*conv2_1(x) + 1*conv2_3(x) + 1*conv2_5(x)`\n\n但在评估模式下，我们传递\
  \ `mask` 参数并激活特定层：`x = 0*conv1_1(x) + 1*conv1_3(x) + 0*conv1_5(x)`\n`x = 0*conv2_1(x)\
  \ + 0*conv2_3(x) + 1*conv2_5(x)`：\n\n```python\n    def call(self, x, mask=None):\n\
