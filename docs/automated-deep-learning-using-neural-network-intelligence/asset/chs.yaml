  - `tuner`：调优器配置。\n- `assessor`：评估配置。\n- `advisor`：建议配置。\n- `trainingService`：训练服务配置。\n\
  - `sharedStorage`：共享存储配置。\n\n# 第 1 章 神经网络智能简介\n\n## 嵌入式 NNI\n\n尽管 NNI 的功能非常强大，但它也可以以嵌入式模式运行。当你需要动态创建实验并对执行有更多控制权时，这种模式会非常方便。列表\
  \ 1-7 展示了在嵌入式模式下运行实验的示例。\n\n```python\n# 加载包\nfrom pathlib import Path\nfrom nni.experiment\
  \ import Experiment\n\n# 定义搜索空间\nsearch_space = {\n  \"x\": {\n    \"type\": \"\
  categorical\",\n    \"choices\": [50, 49, 48]\n  },\n  \"y\": {\n    \"type\": \"\
  categorical\",\n    \"choices\": [2, 4, 6, 8, 10]\n  },\n  \"z\": {\n    \"type\"\
  : \"uniform\",\n    \"min\": 1,\n    \"max\": 10000,\n    \"precision\": 2\n  }\n\
  }\n\n# 配置实验\nexperiment = Experiment('local')\nexperiment.config.experiment_name\
  \ = 'Black Function Optimization'\nexperiment.config.trial_concurrency = 4\nexperiment.config.max_trial_number\
  \ = 1000\nexperiment.config.search_space = search_space\nexperiment.config.trial_command\
  \ = 'python3 trial.py'\nexperiment.config.trial_code_directory = Path(__file__).parent\n\
  experiment.config.tuner.name = 'Evolution'\nexperiment.config.tuner.class_args['optimize_mode']\
  \ = 'maximize'\n\n# 启动 NNI\nhttp_port = 8080\nexperiment.start(http_port)\n\n# 事件循环\n\
  while True:\n    if experiment.get_status() == 'DONE':\n        search_data = experiment.export_data()\n\
  \        search_metrics = experiment.get_job_metrics()\n        input(\"实验已完成。按任意键退出...\"\
  )\n        break\n```\n\n***列表 1-7.** 嵌入式 NNI.*\n\n如果你在启动和使用 NNI 时遇到任何问题或错误，可以按照此简要指南确定问题所在。\n\
