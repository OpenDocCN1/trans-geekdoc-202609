  \ 4-6.** 模型空间中的最佳数据流图*\n\n本次实验的目的是证明 NAS 的主要目标是找到一种能够最大化（或最小化）黑盒函数的架构。在引入基础 NAS\
  \ 技术后，我们可以进一步深入探讨。\n\n## Retiarii 框架\n\n`Retiarii framework` 设计用于分离神经架构搜索的主实体。使用\
  \ `Retiarii framework`，研究人员可以专注于特定的方面。\n\n196\n\n- **Base Model**（基础模型）\n- **Mutator**（变异器）\n\
  - **Model Space**（模型空间）\n- **Evaluator**（评估器）\n- **Search Strategy**（搜索策略）\n\n*Base\
  \ Model* 是神经架构搜索的主实体。使用 `Retiarii framework`，研究人员可以专注于特定的方面。\n\n*Base Model* 是神经网络的骨架。*Mutator*\
  \ 是对 `Base Model` 的变异。*Model Space* 是所有 `Base Model` 的变体。*Evaluator* 测量 `Model Space`\
  \ 的性能。*Search Strategy* 定义了 `Model Space`。这些概念包含在表 4-1](#index_split_001.html#p210)\
  \ 中。\n\n**NAS**\n**HPO**\n\n197\n\n![](img/index-211_1.png)\n\n图 4-7](#index_split_001.html#p211)\
  \ 展示了 `Retiarii framework` 中的各种组件。\n\n***Figure 4-7.** Retiarii 框架*\n\n## Base Model\n\
  \n`Base Model` 是进行架构修改的起点。例如，用于问题的 `Base Model` 如列表 4-3](#index_split_001.html#p211)\
  \ 所示。\n\n导入必要的模块：\n\n***Listing 4-3.** Base Model.`ch4/retiarii/common/base_model.py`\n\
  ```python\nimport torch\nimport torch.nn.functional as F\n```\n\n必须使用 `nni.retiarii.pytorch\
  \ as nn` 模块来声明深度学习模型的层：\n\n```python\nimport nni.retiarii.pytorch as nn\n```\n\n\
  198\n\n`Base Model` 必须使用 `nni.retiarii.model_wrapper()` 进行标注：\n\n```python\nfrom\
  \ nni.retiarii \n```\n\n接下来，我们有一个用于数字识别问题的经典 LeNet 模型：\n\n```python\n@model_wrapper\n\
  class Net(nn.Module):\n    def __init__(self):\n        super().__init__()\n   \
  \     self.conv1 = nn.Conv2d(1, 32, 3, 1)\n        self.conv2 = nn.Conv2d(32, 64,\
  \ 3, 1)\n        self.dropout1 = nn.Dropout(0.25)\n        self.dropout2 = nn.Dropout(0.5)\n\
  \        self.fc1 = nn.Linear(9216, 128)\n        self.fc2 = nn.Linear(128, 10)\n\
  \n    def forward(self, x):\n        x = F.relu(self.conv1(x))\n        x = F.max_pool2d(self.conv2(x),\
  \ 2)\n        x = torch.flatten(self.dropout1(x), 1)\n        x = self.fc2(self.dropout2(F.relu(self.fc1(x))))\n\
  \        output = F.log_softmax(x, dim = 1)\n        return output\n```\n\n`Base\
  \ Model` 设计中的常见错误有：\n\n- `Base Model` 缺少 `@model_wrapper` 标注\n- 使用 `import torch.nn\
  \ as nn` 而不是 `nni.retiarii.nn.pytorch as nn` 来声明层\n\n## Mutators\n\n`Base Model`\
  \ 是单一模型。为了创建 `Model Space`，我们需要向 `Base Model` 添加 `Mutators`。每个 `mutator` 都提供了更改\
  \ `Base Model` 的方法。应用于 `Base Model` 的所有可能的变异形成了 `Model Space`。NNI 提供了以下变异操作：`LayerChoice`、`ValueChoice`、`InputChoice`\
  \ 和 `Repeat`。\n\n199\n\n![](img/index-213_1.png)\n\n## LayerChoice\n\n`LayerChoice`\
  \ 变异器为层占位符形成候选层。在探索过程中会尝试这些层之一。`LayerChoice` 变异器如下所示应用于 `Base Model`：\n\n\n\n\n\n\
  ```python\nimport nni.retiarii.nn.pytorch as nn\n```\n\n# 模型设计\n\n```python\nself.activation\
  \ = nn.LayerChoice([\n    nn.ReLU(),\n    nn.Sigmoid(),\n    nn.Identity\n])\n```\n\
  \n# 前向传播\n\n```python\nx = self.activation(x)\n```\n\n`LayerChoice` 为 `Base Model`\
  \ 添加了层的变体，如图 4-8 所示。\n\n**图 4-8.** LayerChoice 变异器*\n\n`LayerChoice` 是变异 `Base Model`\
  \ 最直接的方法。\n\n# ValueChoice\n\n`ValueChoice` 构成了一个单值列表，用于作为层超参数进行尝试。\n\n`ValueChoice`\
  \ 只能 own 作为层超参数使用。它不能在评估过程中作为 `batch_size` 或 `learning_rate` 等任意超参数。\n\n`ValueChoice`\
  \ 变异器以以下方式应用于 `Base Model`：\n\n# 导入部分\n\n```python\nimport nni.retiarii.nn.pytorch\
  \ as nn\n```\n\n# 模型设计\n\n```python\nself.drop = nn.Dropout(nn.ValueChoice([0.25,\
  \ 0.5, 0.75]))\n```\n\n# 前向传播\n\n```python\nx = self.drop(x)\n```\n\n在 HPO 场景下，`ValueChoice`\
  \ 可以被视为一种层超参数。\n\n# InputChoice\n\n`InputChoice` 尝试不同的连接。它接收多个张量并从中选择 `n_chosen`\
  \ 个张量。`InputChoice` 变异器以以下方式应用于 `Base Model`：\n\n# 导入部分\n\n```python\nimport nni.retiarii.nn.pytorch\
  \ as nn\n```\n\n# 模型设计\n\n```python\nself.switch = nn.InputChoice(n_candidates =\
  \ 2, n_chosen = 1)\n```\n\n# 前向传播\n\n```python\n# 分支一\na = self.op_a1(x)\na = self.op_a2(a)\n\
  # 分支二\nb = self.op_b1(x)\nb = self.op_b2(b)\n# 选择连接\nx = self.switch([a, b])\n```\n\
  \n![](img/index-215_1.png)\n\n`InputChoice` 设计用于在神经网络架构中寻找最佳的数据流分支。图 4-9 阐了这一概念。\n\
  \n**图 4-9.** InputChoice 变异器*\n\n如果 `InputChoice` 选取了多个候选张量（即 `n_chosen > 1`），则会应用还原策略：`sum`、`mean`、`concat`。这是一个非常实用的技术，允许同时提取并合并多个连接。带有还原操作的多个候选的\
  \ `InputChoice` 可以按以下方式应用：\n\n# 导入部分\n\n```python\nimport nni.retiarii.nn.pytorch\
  \ as nn\n```\n\n# 模型设计\n\n```python\nself.mix = nn.InputChoice(n_candidates = 3,\
  \ n_chosen = 2, reduction = 'sum')\n```\n\n# 前向传播\n\n```python\n# 分支一\na = self.op_a1(x)\n\
  a = self.op_a2(a)\n# 分支二\nb = self.op_b1(x)\nb = self.op_b2(b)\n# 分支三\nc = self.op_b1(x)\n\
  c = self.op_b2(c)\n# 选择连接\nx = self.mix([a, b, c])\n```\n\n![](img/index-216_1.png)\n\
