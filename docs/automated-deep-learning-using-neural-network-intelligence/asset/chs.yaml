  \ | 18496 | [64] | 17344 |\n| Linear-5 | [32] | 2080 | [32] | 2080 |\n| Linear-6\
  \ | [10] | 330 | [10] | 330 |\n| **Total** | | **59786** | | **55380** |\n\nLevel\
  \ pruner 在不降低准确率的情况下压缩了 LeNet 模型。\n\n### FPGM Pruner\n\nFPGM (Filter Pruning via\
