  \n127\n\n![](img/index-141.png)\n\n\n\n\n\nSMBO 实现了以下技术：为黑盒函数 `f` 构建一个概率模型 `p(y|x)`，并用它在搜索空间中挑选最有希望的元素在黑盒函数\
  \ `f` 中进行评估。\n\n观察 SMBO 方法的运行过程。假设我们获得了一些实验结果：\n\n`(x1, f(x1)), (x2, f(x2)), (x3,\
  \ f(x3))`, 如图 3-14 所示。\n\n128\n\n![](img/index-142_1.png)\n\n![](img/index-142_2.png)\n\
  \n第 3 章 Shell 下的超参数优化\n\n***图 3-14.** *实验结果*\n\n下一步是根据数据 `(x1, f(x1)), (x2, f(x2)),\
  \ (x3, f(x3))` 创建概率函数 `p(y|x)`。`p(y|x)` 被称为目标函数（或黑盒函数）的代理（surrogate）。\n\n代理函数确定了搜索空间中任何元素\
  \ `xi` 目标函数（或黑盒函数）的概率分布。这意味着对于任何 `xi`，我们可以说以 `p` 的概率，值 `f(xi) = yi` 落在 `(a, b)`\
  \ 区间。这一概念在图 3-15 中展示。\n\n***图 3-15.** *xi 和 xj 的概率分布*\n\n129\n\n![](img/index-143_1.png)\n\
  \n第 3 章 Shell 下的超参数优化\n\n拥有代理函数 `p(x|y)` 后，我们可以在整个搜索空间上对其进行外推。\n\n图 3-16 给出了代理模型的视觉化描述：\n\
  \n- 红色虚线显示实际黑盒函数。\n- 黑色实线显示代理函数 `p(y|x)` 的期望平均值。\n- 紫色虚线显示代理函数 `p(y|x)` 的方差。\n\n\
  ***图 3-16.** *三次实验的代理模型：(x1, f(x1)), (x2, f(x2)), (x3, f(x3))*** 基于构建的代理模型，SMBO\
  \ 算法对黑盒函数的潜在极大值做出预测。算法的下一个目标是找到一个比当前最大值 `f(x2)` 更大的黑盒函数值。以下实验参数使用期望改进（Expected Improvement）函数确定：\n\
  \n```\nEI(x) = max y - y0, p y|x dy*(x) =\n```\n\n假设 `f(x2) = y2`，如果 `EI(x)` 在 `x4`\
  \ 处取得最大，则 SMBO 将选择 `x4` 作为下次实验参数。图 3-17 展示了 SMBO 如何选择下一次实验。\n\n130\n\n![](img/index-144_1.png)\n\
  \n![](img/index-144_2.png)\n\n第 3 章 Shell 下的超参数优化\n\n***图 3-17.** *期望改进*\n\n选择 `x4`\
  \ 作为下次实验值后，我们评估 `f(x4)` 并针对新数据重建代理模型：`(x1, f(x1)), (x2, f(x2)), (x3, f(x3)), (x4,\
  \ f(x4))`，如图 3-18 所示。\n\n***图 3-18.** *四次实验的代理模型：(x1, f(x1)), (x2, f(x2)), (x3,\
  \ f(x3)), (x4, f(x4))***\n\n131\n\n第 3 章 Shell 下的超参数优化\n\nSMBO 通过通过更多数据使代理模型收敛于目标函数，这些方法通过在评估目标函数后不断更新代理模型来实现。SMBO\
  \ tuner 是高效的，因为它们以智能的方式选择下一个参数。\n\nSMBO tuner 循环执行以下步骤直到达到最大实验次数：\n\n- 根据代理概率 `p(y|x)`\
  \ 构建代理模型。\n- 使用期望改进函数确定下次实验参数 `x`。\n- 评估黑盒函数 `f(x)`。\n- 将 `(x, f(x))` 添加到历史数据集。\n\
  \n这是所有 SMBO tuner 的框架。它们唯一的区别在于基于历史数据集估计概率函数 `p(y|x)` 的方法。本章将涵盖以下 SMBO tuner：Tree-Structured\
  \ Parzen Estimator 和 Gaussian Process。\n\n### Tree-Structured Parzen Estimator Tuner\n\
  \nTree-Structured Parzen Estimator tuner (TPE) 的描述可能跨多个章节。在本节中，我们将描述使用该 tuner 的核心思想：\n\
  \n1. 起初，TPE tuner 在探索空间空间执行 `N` 次随机实验。\n2. 接下来，tuner 根据执行实验的值进行排序，并根据分位数将其分为“好”组和“坏”组。“好”组包含最佳结果，“坏”组包含所有其他实验。图\
  \ 3-19 展示了 TPE 模型。\n3. 拥有代理函数 `p(x|y)` 后，我们可以在整个搜索空间上对其进行外推。基于现有点的 Parzen Estimators\
  \ 计算密度 `g(x)` 和 `l(x)`。图 3-20 展示了算法模型。\n4. 随后，TPE tuner 根据 `g(x)/l(x)` 比例生成 `n`\
  \ 个随机候选，并选择第一个作为下一次实验。这意味着高密度的实验是常见的。\n5. 重复步骤 2–5 直到达到最大实验次数。这是一个 TPE 配置示例：\n\n\
  ```yaml\ntuner:\n  name: TPE\n  Args:\n    optimize_mode: maximize\n    seed: 12345\n\
  \    tpe_args:\n      constant_liar_type: 'mean'\n      n_startup_jobs: 10\n   \
  \   n_ei_candidates: 20\n      linear_forgetting: 100\n      prior_weight: 0\n \
  \     gamma: 0.5\n```\n\n### Tree-Structured Parzen Estimator Tuner 参数\n\n- `tpe_args.constant_liar_type`:\
  \ `'best'` | `'worst'` | `'mean'` | `null`（默认: `'best'`）。指定当并发数 > 1 时如何优化。\n- `tpe_args.n_startup_jobs`:\
  \ `int`（默认: `20`）。在步骤 1 中生成的用于热身的的前 `N` 次随机实验。如果搜索空间很大，应增加此值。\n- `tpe_args.n_ei_candidates`:\
  \ `int`（默认: `24`）。在步骤 4 中生成的 `n` 个随机候选。\n- `tpe_args.linear_forgetting`: `int`（默认:\
  \ `25`）。TPE 会降低旧实验的权重。该参数控制实验衰减需要多少次迭代。\n- `tpe_args.prior_weight`: `float`（默认:\
  \ `1.0`）。决定历史中实验配置的权重。\n- `tpe_args.gamma`: `float`（默认: `0.25`）。控制有多少比例实验被认为是“好的”。代表步骤\
  \ 2 中的 $\\gamma$ 参数。\n\n**注意**：上述提到的 tpe tuner 配置参数仅从 nni 2.6 版本起有效，它们在之前的版本中不起作用。\n\
  \nTPE tuner 支持所有搜索空间类型：`choice`, `choice(nested)`, `randint`, `uniform`, `quniform`,\
  \ `loguniform`, `qloguniform`, `normal`, `qnormal`, `lognormal` 和 `qlognormal`。\n\
  \n从代码清单 3-7 中可以看到 TPE tuner 如何执行 holder_function（完整代码在相应文件中：*ch3/tuners/tpe_tuner/*，*run_experiment.py*）。\n\
  \n为实验设置 TPE tuner：\n\n```python\nexperiment.config.tuner.name = 'TPE'\n```\n\n\n\
  \n\n```python\nexperiment.config.tuner.class_args['optimize_mode'] = 'maximize'\n\
  experiment.config.tuner.class_args['seed'] = 0\nexperiment.config.tuner.class_args['tpe_args']\
  \ = {\n    'n_startup_jobs': 20,\n    'gamma': 0.5\n}\n```\n\n实验完成后，我们可以分析 `TPE\
  \ Tuner` 的搜索进度。\n\n136\n\n![](img/index-150_1.png)\n![](img/index-150_2.png)\n\n\
  # 第 3 章 Shell 环境下的超参数优化\n\n**图 3-21.** `TPE Tuner`。第 1 代*\n\n图 3-21 sho 显示点的分布更像是随机散布，这是合理的，因为在调优器设置中，我们指定了\
  \ `'n_startup_jobs': 20`，这意味着前 20 次试验将完全是随机的。\n\n**图 3-22.** `TPE Tuner`。最后一代*\n\
  \n137\n\n但我们在图 3-22, the TPE 看到的，得益于概率探索模型，Tuner 找到了 `holder_function` 的全局最大值。\n\
  \n`TPE Tuner` 直观上非常清晰，基于坚实的概率基础，并在探索（exploration）与利用（exploitation）策略之间取得了良好的平衡。另一个很好的特性是它支持\
  \ `choice(nested)` 搜索类型，这在某些研究中至关重要。\n\n### 高斯过程调优器\n\n高斯过程 (GP) Tuner 是另一种基于多元正态分布的\
  \ SMBO 调优器。该调优器与 `TPE Tuner` 类似，但使用高斯分布来构建 `p(y|x)` 代理。该方法的完整描述在本书之外，但读者可以在这里学习该方法的工作原理：\n\
  \n- • “使用高斯过程优化昂贵函数”: [`citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.1.139.9315&rep=rep1&type=pdf`](https://citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.1.139.9315&rep=rep1&type=pdf)\n\
  - • “高斯过程与贝叶斯优化”: [www.cs.cornell.](http://www.cs.cornell.edu/courses/cs4787/2019sp/notes/lecture16.pdf)\n\
  \n以下是 GP Tuner 配置示例：\n\n```yaml\ntuner:\n  name: GPTuner\n  classArgs:\n    optimize_mode:\
  \ maximize\n    utility: 'ei'\n    kappa: 5.0\n    xi: 0.0\n    nu: 2.5\n    alpha:\
  \ 1e-6\n    cold_start_num: 10\n    selection_num_warm_up: 100000\n    selection_num_starting_points:\
  \ 250\n```\n\n138\n\n# 第 3 章 Shell 环境下的超参数优化\n\n以下是 GP Tuner 参数的描述：\n\n- • utility:\n\
  \  - **Type**: `'ei' | 'ucb' | 'poi'`\n  - **Default**: `'ei'`\n  效用函数 `ei`、`ucb`\
  \ 和 `poi` 分别对应期望改进、上置信边界和改进概率。\n\n- • kappa:\n  - **Type**: float\n  - **Default**:\
  \ 5\n  用于 `ucb` 效用函数。`kappa` 越大，调优器的探索性越强。\n\n- • xi:\n  - **Type**: float\n  -\
  \ **Default**: 0\n  用于 `ei` 和 `poi` 效用函数。`xi` 越大，调优器的探索性越强。\n\n- • nu:\n  - **Type**:\
  \ float\n  - **Default**: 2.5\n  设置 Matern 核。`nu` 越小，近似函数就越不平滑。\n\n- • alpha:\n\
  \  - **Type**: float\n  - **Default**: 1e-6\n  设置高斯回归器。较大的值对应更高的噪声水平。\n\n139\n\n\
  # 第 3 章 Shell 环境下的超参数优化\n\n- • cold_start_num:\n  - **Type**: int\n  - **Default**:\
  \ 10\n  在高斯过程运行之前的随机探索次数。\n\n- • selection_num_warm_up:\n  - **Type**: int\n  -\
  \ **Default**: 100000\n  评估采集函数的点数。\n\n- • selection_num_starting_points:\n  - **Type**:\
  \ int\n  - **Default**: 250\n  起始点的数量。\n\nGP Tuner 支持以下类型：`choice`、`randint`、`uniform`、`loguniform`。GP\
  \ Tuner 在并行化方面面临挑战。如果你运行实验（例如 `concurrency > 1`），多个进程将同时决定相同的试验。这是 SMBO 的一个大问题。图\
  \ 3-21 显示点的分布更像是随机散布，这是合理的，因为在调优器设置中，我们指定了 `'n_startup_jobs': 20`，这意味着前 20 次试验将完全是随机的。\n\
