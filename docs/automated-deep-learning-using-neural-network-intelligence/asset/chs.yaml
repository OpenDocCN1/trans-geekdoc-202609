  \n## 使用 ReLU 和 Dropout 升级 LeNet\n\n库：TensorFlow (Keras API), PyTorch\n\n经验丰富的数据科学家可能会有这样一个疑问：为什么我们在上一节中没有对\
  \ LeNet 模型使用 dropout 层和将修正后的线性单元（`ReLU`）作为激活函数呢？因为原始的 LeNet 模型没有使用 `ReLU` 激活。而且\
  \ dropout 技术是在 LeNet 架构创建 2012 年后首次引入的。LeNet 的主要问题之一是使用了 sigmoid 作为激活函数。sigmoid\
  \ 激活函数导致训练变慢和梯度消失问题。dropout 技术也是最流行的正则化方法之一。如今，我们无法想象一个不使用 `ReLU` 和 dropout 层的成功识别模型。让我们假装从未听说过\
  \ `ReLU` 和 dropout，而有人建议我们将这些技术注入 LeNet 模型以提高其性能。我们可以使用 HPO 进行研究，这将帮助我们找到最佳架构。为了简化问题，我们将使用“一刀切”策略（one-for-all）。这意味着如果激活超参数具有\
  \ sigmoid 值，那么 LeNet 模型的所有激活都将 sigmoid 函数。如果激活具有 relu 值，情况也是如此。通常，dropout 层被插入在线性层之间。但最初我们不知道这种技术是否有效，所以我们必须制作\
