  \n现在我们准备好构建 LeNet 空间。\n\n导入模块：\n**列表 4-9.** LeNet 空间。`ch4/retiarii/cifar_10_lenet/feature_extraction.py`\n\
  \n```python\nfrom typing import Tuple, Iterator\nfrom torch.nn import Parameter\n\
  import nni.retiarii.nn.pytorch as nn\n```\n\n特征提取块的 LeNet 空间。\n\n不要忘记在类中添加 `@model_wrapper`：\n\
  \n```python\n@model_wrapper\nclass Cifar10Net(nn.Module):\n    def __init__(self):\n\
  \        super().__init__()\n        # CIFAR-10 数据集\n        self.class_num = 10\n\
  \        # RGB 输入\n        self.input_channels = 3\n        # 首先，我们定义特征提取序列：\n \
  \       # 所有特征提取块共享相同的激活函数：\n        self.activation = nn.LayerChoice(\n       \
  \     [nn.Sigmoid(), nn.ReLU()],\n            label = 'fe_activation'\n        )\n\
  \        # Repeat 变异器创建一个到三个特征提取块：\n        self.fe = nn.Repeat(\n            FeatureExtractionBlock(\n\
  \                self.activation,\n                self.input_channels\n       \
  \     ),\n            depth = (2, 3),\n            label = 'fe_repeat'\n       \
  \ )\n        # 其次，我们定义全连接层：\n        self.flat = nn. Flatten()\n        self.dm\
  \ = nn.LayerChoice([\n            nn.Linear(256, 128),\n            nn.Linear(128,\
  \ 64),\n            nn.Linear(64, 32)\n        ],\n            label = 'fc_repeat'\n\
  \        )\n\n    def forward(self, x):\n        x = self.fe(x)\n        x = self.flat(x)\n\
  \        x = self.dm(x)\n        return self.log_max(x)\n```\n\n以下方法用于 `Repeat Mutator`。它根据其块在特征提取序列中的序号返回一个合适的\
  \ `FeatureExtractionBlock`。\n\n```python\n    @classmethod\n    def create(cls,\
  \ activation, in_dimension):\n        def create_block(i):\n            params =\
  \ {\n                'kernel_size': nn.ValueChoice(\n                    [3, 5],\n\
  \                    label = f'fe_kernel_size_{i}'\n                )\n        \
  \    }\n            # 特征块维度\n            if i == 0:\n                dim = (in_dimension,\
  \ 8)\n            elif i == 1:\n                dim = (8, 16)\n            else:\n\
  \                dim = (16, 16)\n            params['dim'] = dim\n            params['activation']\
  \ = activation\n            return FeatureExtractionBlock(**params)\n        return\
  \ create_block\n```\n\n全连接块的实现与特征提取块相似，并在列表 4-8 中提供。\n\n**列表 4-8.** 全连接块。`ch4/retiarii/cifar_10_lenet/fully_connected.py`\n\
