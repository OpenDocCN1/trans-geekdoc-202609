  \ 1, 1]]\n        x = mask[0][0]*self.conv1_1(x) + mask[0][1]*self.conv1_3(x) +\
  \ mask[0][2]*self.conv1_5(x)\n        x = self.pool1(x)\n        x = mask[1][0]*self.conv2_1(x)\
