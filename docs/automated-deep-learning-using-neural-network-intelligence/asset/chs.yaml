  图 3-34. 详情详情\n\n## 拟合 (Curve Fitting)\n\n曲线拟合评估器（Curve Fitting Assessor）是一种 LPA（学习、预测、评估）算法，如果最终\
  \ epoch 的性能预测劣于试验历史中的最佳性能，则在第 `N` 步停止待处理的 `Trial`。曲线拟合评估器对 `Trial`训练的最终结果进行预测并与完成的试验进行比较。\n\
  \n该算法将早停任务视为时间序列预测问题。如果训练预测结果悲观，算法将停止试验。图 3-35 解释了曲线拟合早停的方法。\n\n162\n\n![](img/index-176_1.png)\n\
  \n第 3 节 Shell 下的超参数优化\n\n图 3-35. 曲线拟合预测\n\n曲线拟合算法可以通过以下实验配置在实验中实现：\n\n```yaml\n\
  assessor:\n  name: Curvefitting\n  classArgs:\n    epoch_num: 20\n    start_step:\
  \ 6\n    threshold: 0.95\n    gap: 1\n```\n\n我们在书中书中研究曲线拟合早停算法的原理。你可以参考官方文档（[`nni.readthedocs.io/en/v2.7/reference/hpo.html#nni.algorithms.hpo.curvefitting_assessor.CurvefittingAssessor`](https://nni.readthedocs.io/en/v2.7/reference/hpo.html#nni.algorithms.hpo.curvefitting_assessor.CurvefittingAssessor)）。\n\
  \n## 停止良好试验的风险\n\n早停算法可以显著加速实验完成并节省计算资源。但始终存在过早停止良好试验的风险，这可能意味着拒绝了搜索空间中非常好的参数。看图\
  \ 3-36，早停的试验可能表现出良好的性能。\n\n\n\n\n在本第[2.1 节](https://doi.org/10.1007/978-1-4842-8149-9_2)的任务中，我们构建了一个功能性流水线，以最优方式解决图像分类问题。事实上，深度学习的每一层都是一个特定的功能算子，我们尝试使用\
  \ `HPO` 方法来寻找这些算子的最佳流水线。图 3-37 将神经网络架构表示为一种功能性流水线。\n\n1\n\n![](img/index-178_1.png)\n\
  \n第 3 章 在 Shell 环境下的超参数优化\n\n***图 3-37.** 作为功能性流水线的神经网络架构*\n\n让我们把问题转化为更严谨的数学语言。我们需要找到一个模型\
  \ `M`，该模型由函数 `Fi` $\\in$ $\\{ \\text{F}*\\ast \\}$ 的复合组成，并使值 `L( M, D )` 最大化，其中\
  \ `L` 用于评估模型 `M` 在数据集 `D` 上的性能。图 3-38 描述了最优功能性流水线问题：\n\n2\n\n![](img/index-179_1.png)\n\
  \n第 3 章 在 Shell 环境下的超参数优化\n\n***图 3-38.** 最优功能性流水线问题*\n\n让我们研究如何使用 `NNI` 来解决这个问题。作为一个示例，我想使用经典的\
  \ AutoML 任务，该任务搜索经典的浅层机器学习方法的最优流水线，以解决监督学习问题。在本节中，我想向经典机器学习致敬，它正逐渐让位给深度学习。这种方法适用于任何搜索最优功能性流水线的问题。\n\
  \n## Problem\n\n让我们使用伽马望远镜数据集[(https://archive.ics.uci.edu/ml/datasets/magic+gamma+telescope)](https://archive.ics.uci.edu/ml/datasets/magic+gamma+telescope)\
  \ 来检查二分类问题。该数据集包含望远镜接收到的信号数据。任务是区分由初级伽马射线（`gammas`，信号）引起的信号与高大气层中宇宙射线引起的强子簇（`hadronic`）图像（背景）。该数据集包含\
  \ 19020 个实例，具有以下列：\n\n1. `fLength`: 类型: real. 椭圆主轴（mm）\n2. `fWidth`: 类型: real. 椭圆短轴（mm）\n\
  3. `fSize`: 类型: real. 所有像素内容之和的 10 倍对数（光子）\n4. `fConc`: 类型: real. 两个最高像素之和相对于 `fSize`\
  \ 的比例（ratio）\n5. `fConc1`: 类型: real. 最高像素相对于 `fSize` 的比例（ratio）\n6. `fAsym`: 类型:\
  \ real. 最高像素到中心点的距离，投影在主轴上的长度（mm）\n7. `fM3Long`: 类型: real. 沿主轴三阶矩的立方根（mm）\n8. `fM3Trans`:\
  \ 类型: real. 沿短轴三阶矩的立方根（mm）\n9. `fAlpha`: 类型: real. 主轴与指向原点向量的夹角（deg）\n10. `fDist`:\
  \ 类型: real. 原点到椭圆圆心的距离（mm）\n11. `class`: 值: `g`, `h`。伽马（信号），强子（背景）。\n\n也许读者能从这些数据中看出些什么，但我对它们一无所知。但这恰恰是我们需要的——在看不见的地方发现模式和依赖关系。数据集位于\
  \ `ch3/ml_pipeline/04.data`，并在 3-17 中被转换为监督学习问题。导入模块：\n\n```python\nimport os\n\
  import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\n\
  \ndef telescope_dataset():\n    # Loading dataset:\n    cd = os.path.dirname(os.path.abspath(__file__))\n\
  \    # Loading dataset:\n    telescope_df = pd.read_csv(f'{cd}/04.data')\n    #\
  \ Dropping na:\n    telescope_df.dropna(inplace = True)\n    # Setting column names:\n\
  \    telescope_df.columns = ['fLength', 'fWidth', 'fSize', 'fConc', 'fConc1', 'fAsym',\
  \ 'fM3Long', 'fM3Trans', 'fAlpha', 'fDist', 'class']\n    # Splitting dataset:\n\
  \    X_train, X_test, y_train, y_test = train_test_split(telescope_df, test_size=0.2,\
  \ stratify=telescope_df['class'])\n    # Returning data:\n    return X_train, X_test,\
  \ y_train, y_test\n```\n\n***列表 17.** ch3/ml_pipeline/utils.py\n\n```python\nclass\
  \ Operator:\n    def __init__(self, name, clz, params = None):\n        if params\
  \ is None:\n            params = {}\n        self.name = name\n        self.clz\
  \ = clz\n        self.params = params\n```\n\n由于已经确定了问题，我们可以开始定义组成流水线的算子。通常，算子分为三类：\n\
  \n- **Selectors**（选择器）：从数据集中选择显著特征。\n- **Transformers**（转换）：根据某些数学函数转换输入。\n- **Classifiers**（分类器）：解决问题本身。\n\
  \n这些算子将形成一个功能性流水线。\n\n**Search Space**\n\n让我们定义分类器的搜索空间。我们假设分类器的算子流水线将具有：\n\n- **Selectors**:\
  \ 从 0 到 1（选择器是建议的但并非必须）。\n- **Transformers**: 从 0 到 3（转换是建议的但并非必须）。\n- **Classifier**:\
  \ 1（必须）。\n\n\n\n\n因此，一个流水线（pipeline）可以包含从一个到五个运算符。请查看图 3-40\n\n![](img/index-185_1.png)\n\
  \n# 第 3 章 Shell 下超参数优化\n\n**图 3-40.** 流水线单元\n\n该流水线包含五个单元。每个单元可以使用相应运算符空间中的某些值填充。如果没有选择任何值，单元可以为空。例如，可能会选择流水线：`Selector3`\
  \ → → `Transformer1` → → `Classifier2`，它等于 `Selector3` → `Transformer1` → `Classifier2`。\n\
  \n这个搜索空间的定义非常巨大且难以手动构建，因此我们将在列表 3-19 中添加一个特殊类，根据 NNI 规范创建运算符搜索空间的定义。\n\n**列表 3-19.**\
  \ 搜索空间。`ch3/ml_pipeline/search_space.py`\n\n```python\nfrom ch3.ml_pipeline.operator\
  \ import OperatorSpace\n\nclass SearchSpace:\n    每个单元格都有一个运算符类型，可以用选择器、转换器分类器填充。`operator_search_space`\
  \ 方法为每个单元类型创建一个搜索空间。\n\n    @classmethod\n    def operator_search_space(cls, operator_type):\n\
  \        \"\"\"\n        根据 operator_type 为运算符创建搜索空间\n        \"\"\"\n        ss\
  \ = []\n        operators = []\n        if operator_type == 'selector':\n      \
  \      # 流水线中不需要选择器\n            ss.append({'_name': 'none'})\n            operators\
  \ = OperatorSpace.selectors\n        elif operator_type == 'transformer':\n    \
  \        # 流水线中不需要转换器\n            ss.append({'_name': 'none'})\n            operators\
  \ = OperatorSpace.transformers\n        elif operator_type == 'classifier':\n  \
  \          operators = OperatorSpace.classifiers\n        for o in operators:\n\
  \            row = {'_name': o.name}\n            for p_name, values in o.params.items():\n\
  \                row[p_name] = {\"_type\": \"choice\", \"_value\": values}\n   \
  \             ss.append(row)\n        return ss\n```\n\n接下来，我们定义了一个 `build` 方法，根据\
  \ NNI 规范构建所有单元的搜索空间：\n\n```python\n    @classmethod\n    def build(cls):\n     \
  \   return {\n            \"op_1\": {\n                \"_type\": \"choice\",\n\
  \                \"_value\": cls.operator_search_space('selector')\n           \
  \ },\n            \"op_2\": {\n                \"_type\": \"choice\",\n        \
  \        \"_value\": cls.operator_search_space('transformer')\n            },\n\
  \            \"op_3\": {\n                \"_type\": \"choice\",\n             \
  \   \"_value\": cls.operator_search_space('transformer')\n            },\n     \
  \       \"op_4\": {\n                \"_type\": \"choice\",\n                \"\
  _value\": cls.operator_search_space('transformer')\n            },\n           \
  \ \"op_5\": {\n                \"_type\": \"choice\",\n                \"_value\"\
  : cls.operator_search_space('classifier')\n            }\n        }\n```\n\n尽管搜索空间的定义很大，但我们仍然将其打印出来：\n\
  \n```python\nif __name__ == '__main__':\n    search_space = SearchSpace.build()\n\
  \    print(search_space)\n```\n\n我们将使用动态搜索空间构建在嵌入模式下启动实验，尽管这种技术也可以用于构建静态 JSON 文件。\n\
  \n# 模型\n\n那么，我们现在拥有什么？我们有一个运算符空间和一个搜索空间。现在让我们实现一个模型，将流水线配置转换为真实的机器学习分类器。列表 3-20\
  \ 引入了 MlPipelineClassifier。\n\n**列表 3-20.** MlPipelineClassifier。`ch3/ml_pipeline/model.py`\n\
  \n```python\nfrom sklearn.pipeline import Pipeline\nfrom ch3.ml_pipeline.operator\
  \ import OperatorSpace\nfrom ch3.ml_pipeline.utils import telescope_dataset\n\n\
  class MlPipelineClassifier:\n    模型接收流水线配置并将其转换为实际 Scikit-learn 流水线：\n    def __init__(self,\
  \ pipe_config):\n        ops = []\n        for _, params in pipe_config.items():\n\
  \            # 运算符名称\n            op_name = params.pop('name')\n            # 跳过\
  \ 'none' 运算符\n            if op_name == 'none':\n                continue\n    \
  \        op = OperatorSpace.get_operator_by_name(op_name)\n            ops.append((op.name,\
  \ params))\n        self.pipe = Pipeline(ops)\n\n    # 模型训练方法：\n    def train(self,\
  \ X, y):\n        self.pipe.fit(X, y)\n\n    # 计算准确率：\n    def score(self, X, y):\n\
  \        return self.pipe.score(X, y)\n```\n\n既然模型已经就绪，让我们尝试使用示例流水线初始化它并将其应用于分类问题：\n\
  \n```python\nif __name__ == '__main__':\n    pipe_config = {\n        'op_1': {\n\
  \            'name': 'SelectPercentile',\n            'percentile': 2\n        },\n\
  \        'op_2': {\n            'name': 'none'\n        },\n        'op_3': {\n\
  \            'name': 'Normalizer',\n            'norm': 'l1'\n        },\n     \
  \   'op_4': {\n            'name': 'PCA',\n            'svd_solver': 'randomized',\n\
  \            'n_iter': 3\n        },\n        'op_5': {\n            'name': 'DecisionTreeClassifier',\n\
  \            'criterion': 'entropy',\n            'max_depth': 8\n        }\n  \
  \  }\n    model = MlPipelineClassifier(pipe_config)\n    X_train, y_train, X_test,\
  \ y_test = telescope_dataset()\n    model.train(X_train, y_train)\n    score = model.score(X_test,\
  \ y_test)\n    print(score)\n```\n\n由于模型已经准备好，让我们尝试使用示例流水线初始化它。\n\n# 调器 (Tuner)\n\
  \n现在，一切都准备好开始实验了。但是，我想关注那些已经尝试过的参数。调器是运算符的序列，但相同的参数可能可能不同的：\n\n- 相同的参数但不同的运算符\n\
  -\n- 相同的运算符但不同的参数\n\n-\n\n在搜索空间中，它们是等价的：\n\n- 相同的参数但不同的运算符\n-\n- 相同的运算符但不同的参数\n\n\
  -\n\n因此我们要通过自定义调器（Tuner）来禁止传递相同的参数。`EvolutionTuner` 的具体实现参见列表 3-21。\n\n```python\n\
  import json\nfrom nni.algorithms.hpo.evolution_tuner import EvolutionTuner\n\nclass\
  \ EvolutionEvolutionTuner(EvolutionTuner):\n    def __init__(self, optimize_mode=\"\
  maximize\", population_size=32):\n        super().__init__(optimize_mode, population_size)\n\
  \        # 我们定义 registry 属性来跟踪所有流水线：\n        self.registry = []\n\n    # 如果父类对象的\
  \ generate_parameters 方法返回已尝试过的参数，\n    # 则再次调用它直到生成唯一的参数。由于 EvolutionTuner\n  \
  \  # 具有随机行为，预计它在后续调用中返回不同的参数。\n    def generate_parameters(self, *args, **kwargs):\n\
  \        params = super().generate_parameters(*args, **kwargs)\n        # 如果参数不有效，则生成新的\n\
  \        while not self.is_valid(params):\n            params = super().generate_parameters(*args,\
  \ **kwargs)\n        return params\n\n    # 以下 is_valid 方法将参数转换为标准形式，并检查其是否已经尝试过：\n\
  \    # 如果，则返回 False；如果不是，则保存并返回 True。\n    def is_valid(self, params):\n       \
  \ # 所有步骤名称\n        pass\n```\n\n\n\n```python\nstep_names = [v['_name'] for _,\
  \ v in params.items() if v['_name'] != 'none']\n\n# 不允许重复\n```python\nif len(step_names)\
  \ != len(set(step_names)):\n    return False\n```\n178 第 3 章 Shell 下的超参数优化\n\n#\
  \ 将 `params` 转换为规范字符串\n```python\ncanonical_form = 'X'\nfor _, step_config in params.items():\n\
  \    if step_config['_name'] == 'none':\n        continue\n    canonical_form +=\
  \ '--->' + json.dumps(step_config)\n\n# 如果 `canonical_form` 已经测试过\n```python\nif\
  \ canonical_form in self.registry:\n    return False\nself.registry.append(canonical_form)\n\
  return True\n```\n这种简单的技术引入了搜索空间元素之间的等价性，并可以显著缩小搜索空间。\n\n## 实验\n\n现在，我们终于准备好启动实验，以寻找解决\
