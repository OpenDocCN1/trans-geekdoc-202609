  \       'filters': 16,\n            'kernel': 7\n        },\n        'fe_slot_2':\
  \ {\n            '_name': 'with_pool',\n            'filters': 8,\n            'kernel':\
  \ 5,\n            'pool_size': 5\n        },\n        'fe_slot_3': {\n         \
  \   '_name': 'with_pool',\n            'filters': 8,\n            'kernel': 5,\n\
  \            'pool_size': 3\n        },\n        'l1_size': 1024,\n        'l2_size':\
  \ 512,\n        'dropout_rate': .3,\n        'learning_rate': 0.001\n    }\n   \
