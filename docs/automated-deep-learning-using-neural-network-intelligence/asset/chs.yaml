  ```python\n`from ch5.model.general.tf_ops import build_conv, build_separable_conv,\
  \ build_avg_pool, build_max_pool, FactorizedReduce` \n\n。为图 [5-17]所示的块操作设置 LayerChoice：`self.block_op\
  \ = LayerChoice([\n    build_conv(filters, 3, 'conv3'),\n    build_separable_conv(,,\
  \ 3, 'sepconv3'),\n    build_conv(filters, 5, 'conv5'),\n    build_separable_conv(filters,\
  \ 5, 'sepconv5'),\n    build_avg_pool(filters, 'avgpool'),\n    build_max_pool(filters,\
  \ 'maxpool'),\n], key = f'op_{cell_ord}')` 我将为您提供完整的 Markdown 翻译。\n\n[content]\n\
  ```python\nfrom ch5.model.general.tf_ops import build_conv, build_separable_conv,\
  \ build_avg_pool, build_max_pool, FactorizedReduce\n```\n\n### 定义图 5-18 所示的 Cell\n\
  \n```python\nclass Cell(MutableScope):\n    def __init__(self, cell_ord, input_num,\
  \ filters):\n        super().__init__(f'cell_{cell_ord}')\n```\n\n为图 5-17 所示的块操作设置\
  \ LayerChoice：`self.block_op = LayerChoice([\n    build_conv(filters, 3, 'conv3'),\n\
  \    build_separable_conv(filters, 3, 'sepconv3'),\n    build_conv(filters, 5, 'conv5'),\n\
  \    build_separable_conv(filters, 5, 'sepconv5'),\n    build_avg_pool(filters,\
  \ 'avgpool'),\n    build_max_pool(filters, 'maxpool'),\n], key = f'op_{cell_ord}')`\n\
  \n为额外的 Cell 输入设置 InputChoice：\n\n```python\nif input_num > 0:\n    self.connections\
  \ = InputChoice(\n        n_candidates = input_num,\n        n_chosen = None,\n\
  \        key = f'con_{cell_ord}'\n    )\nelse:\n    self.connections = None\n```\n\
  \n最后一个 cell 层 - Batch Normal 化：\n`self.batch_norm = BatchNormalization(trainable\
  \ = False)`\n\n定义 call 方法：\n\n```python\ndef call(self, inputs):\n    # 主输入由 block_op\
  \ 处理：\n    out = self.block_op(inputs[-1])\n    # 额外的输入通过 self.connections 选择并求和：\n\
  \    if self.connections is not None:\n        connection = self.connections(inputs[:-1])\n\
  \        if connection is not None:\n            out += connection\n    return self.batch_norm(out)\n\
  ```\n\n### 定义图 5-19 所示的 GeneralSupernet\n\n```python\nclass GeneralSupernet(Model):\n\
  \    def __init__(self,\n        num_cells = 6,\n        filters = 24,\n       \
  \ num_classes = 10\n    ):\n        super().__init__()\n        self.num_cells =\
  \ num_cells\n        self.stem = Sequential([\n            Conv2D(filters, kernel_size\
  \ = 3, padding = 'same', use_bias = False),\n            BatchNormalization()\n\
  \        ])\n```\n\n为池化层设置位置（FactorizedReduce）：\n`# num_cells = 6 -> pool_layers_idx\
  \ = [3, 6]`\n`self.pool_layers_idx = [\n    cell_id\n    for cell_id in range(1,\
  \ num_cells + 1) if cell_id % 3 == 0\n]`\n\n初始化 cells 和 pool_layers 列表：\n\n```python\n\
  self.cells = []\nself.pool_layers = []\nfor cell_ord in range(num_cells):\n    if\
  \ cell_ord in self.pool_layers_idx:\n        pool_layer = FactorizedReduce(filters)\n\
  \        self.pool_layers.append(pool_layer)\n    cell = Cell(cell_ord, cell_ord,\
  \ filters)\n    self.cells.append(cell)\n```\n\n定义末层：\n\n```python\nself.gap = GlobalAveragePooling2D()\n\
  self.dense = Dense(num_classes)\n```\n\n接下来我们定义 call 方法：\n\n```python\ndef call(self,\
  \ x):\n    cur = self.stem(x)\n    prev_outputs = [cur]\n    for cell_id, cell in\
  \ enumerate(self.cells):\n        # 将 Cell 通过 FactorizedReduce 池化层：\n        if\
  \ cell_id in self.pool_layers_idx:\n            # 池化层\n            # 0, 1, 2 ....\n\
  \            pool_ord = self.pool_layers_idx.index(cell_id)\n            pool =\
  \ self.pool_layers[pool_ord]\n            prev_outputs = [pool(tensor) for tensor\
  \ in prev_outputs]\n    cur = prev_outputs[-1]\n    cur = cell(prev_outputs)\n \
  \   prev_outputs.append(cur)\n    cur = self.gap(cur)\n    logits = self.dense(cur)\n\
  \    return logits\n```\n\n由于我们定义了 `GeneralSupernet`，可以使用以下脚本启动 ENAS。\n\n**Listing\
