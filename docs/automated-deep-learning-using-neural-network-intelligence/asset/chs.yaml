  \ 2)\n        x = self.flat(x)\n        x = torch.relu(self.fc1(x))\n        return\
  \ F.log_softmax(x, dim=1)\n```\n\n接下来，我们训练超网络并评估列表 5-7（TensorFlow 实现）和列表 5-8（PyTorch\
