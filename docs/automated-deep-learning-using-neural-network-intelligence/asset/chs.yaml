  ```python\ndataset_train, dataset_valid = dataset_train\n```\n\n定义损失函数：\n```python\n\
  loss = SparseCategoricalCrossentropy(reduction=Reduction.NONE)\n```\n\n定义优化器：\n\
  ```python\noptimizer = Adam()\n```\n\n初始化 EnasTrainer：\n```python\ntrainer = enas.EnasTrainer(\n\
  \    model,\n    loss=loss,\n    metrics=accuracy,\n    reward_function=reward_accuracy,\n\
  \    optimizer=optimizer,\n    batch_size=batch_size,\n    num_epochs=num_epochs,\n\
  \    dataset=dataset_train,\n    dataset_valid=dataset_valid,\n    log_frequency=log_frequency,\n\
  \    ctrl_steps=10,\n    mutator_aggregate=20\n)\n```\n\n启动单次搜索：\n```python\ntrainer.train()\n\
  ```\n\n返回最佳子网络：\n```python\nbest = get_best_model(trainer)\nprint(best)\n```\n\n\
  ### PyTorch ENAS 实现\n\n列表 5-12 展示](#index_split_002.html#p306)了使用 PyTorch LeNet\
  \ 模型空间进行 ENAS 应用。\n\n导入模块：\n\n**列表 5-12。** ENAS PyTorch. ch5/enas/enas_pt_search.py\n\
  \n```python\nimport torch.nn as nn\nfrom nni.retiarii.oneshot.pytorch.enas import\
  \ EnasTrainer\nfrom torch.optim.sgd import SGD\nimport ch5.datasets as datasets\n\
  from ch5.model.lenet.pt_lenet import PtLeNetSupernet\nfrom ch5.pt_utils import accuracy,\
  \ reward_accuracy\n```\n\n初始化 LeNetSupernet：\n```python\nmodel = PtLeNetSupernet()\n\
  ```\n\n加载数据集：\n```python\ndataset_train, dataset_valid = datasets.get_dataset(\"\
  mnist\")\n```\n\n定义损失函数：\n```python\ncriterion = nn.CrossEntropyLoss()\n```\n\n\
  定义优化器：\n```python\noptimizer = SGD(model.parameters(), 0.05, momentum=0.9, weight_decay=1.0E-4)\n\
  ```\n\n初始化 EnasTrainer：\n```python\ntrainer = EnasTrainer(\n    model,\n    loss=criterion,\n\
  \    metrics=accuracy,\n    reward_function=reward_accuracy,\n    optimizer=optimizer,\n\
  \    batch_size=batch_size,\n    num_epochs=num_epochs,\n    dataset=dataset_train,\n\
  \    dataset_valid=dataset_valid,\n    log_frequency=log_frequency,\n    ctrl_kwargs={\"\
  tanh_constant\": 1.1},\n    ctrl_steps_aggregate=20\n)\n```\n\n启动单次搜索：\n```python\n\
  trainer.fit()\n```\n\n返回最佳子网络：\n```python\nbest_model = trainer.export()\nprint(best_model)\n\
  ```\n\nENAS 是首批让社区重新思考整个架构搜索（NAS）方法的 One-shot NAS 算法之一。但由于其复杂的内部算法和显而易见的调优，对于没有经验的读者来说，ENAS\
  \ 可能会显得很复杂。在下一节中，我们将学习一种更优雅的 One-shot NAS 技术。\n\n\n\n将 NAS 简化为微分问题也会非常方便，而 DARTS\
  \ 算法正是这样做的。DARTS 算法是在原始论文[DARTS: Differentiable Architecture Search](https://arxiv.org/abs/1806.09055)中提出的。\n\
  \n`ENAS` 算法使用二值掩码从 `Supernet` 中选择子网络，但这种方法是离散的。`ENAS` 控制器在不同的子网络之间跳转，试图发现最优的一个。`DARTS`\
  \ 算法使得搜索空间变为连续；它将对特定操作的类别选择弛化为对所有可能操作的 softmax 操作：`(α ) *o ( x*)`\n\n```\no′( x)\
  \ = exp ( α_i ) / ∑ exp ( α_j ) \n```\n\n这意味着 `DARTS` 算法创建了一个源自 `Model Space` 的带有和减少的\
  \ `Supernet`，每个选择操作都跟着一个指定操作权重的 `αi` 参数。这使得 `{α}` 参数集可以作为 `Supernet` 权重进行训练。在 `Supernet`\
  \ 训练结束时，`α` 值最高的选择被选为最优子网络操作。图 [5-15] 展示了这一概念。\n\n**图 5-15.** DARTS 操作弛化\n\n在用 `DARTS`\
  \ 算法进行 `Supernet` 训练期间，低效的选择往往会被归零，搜索收敛到单一架构，这就是搜索结果。图 [5-16] 可视化了应用于 `LeNetSupermodel`\
  \ 的 `DARTS` 算法。它逐渐弛化低效层，显示出最佳架构。\n\n**图 5-16.** 行中的 DARTS\n\n`NNI 2.7` 使用以下类仅为 `PyTorch`\
  \ 框架实现了 `DARTS`：`nni.retiarii.oneshot.pytorch.DartsTrainer`。\n\n表 [5-4] 显示了 `DartsTrainer`\
  \ 参数。\n\n**表 5-4.** DartsTrainer 参数\n\n| 参数 | 说明 |\n| :--- | :--- |\n| `model` |\
  \ 要训练的 pytorch 模型 |\n| `loss` | 类型: callable, 损失函数 |\n| `metrics` | 类型: callable,\
  \ 衡量模型准确率 |\n| `optimizer` | 类型: Optimizer, 用于模型训练的优化器 |\n| `num_epochs` | 类型: int,\
  \ 计划训练的 epoch 数 |\n| `dataset` | 类型: Dataset, 训练数据集 |\n| `batch_size` | 类型: int,\
  \ 默认: 64, 训练批大小 |\n| `workers` | 类型: int, 默认: 4, 数据加载的线程数 |\n| `log_frequency` |\
  \ 类型: int, 默认: None, 日志步数 |\n| `grad_clip` | 类型: float, 默认: 5.0, 梯度裁剪。设置为 0 则禁用\
  \ |\n| `arc_learning_rate` | 类型: float, 默认: 0.0001, 架构参数的学习率 |\n\n列表 [5-13] 使用 `NNI`\
  \ 实现了 `DARTS` 算法。\n\n导入模块：\n\n**列表 5-13.** DARTS PyTorch。`ch5/darts/darts_pt_search.py`\n\
  \n```python\nimport torch\nimport torch.nn as nn\nimport ch5.datasets as datasets\n\
  from nni.retiarii.oneshot.pytorch import DartsTrainer\nfrom ch5.model.lenet.pt_lenet\
  \ import PtLeNetSupernet\nfrom ch5.pt_utils import accuracy\n```\n\n初始化 `LeNetSupernet`:\n\
  ```python\nmodel = PtLeNetSupernet()\n```\n\n加载数据集：\n```python\ndataset_train, dataset_valid\
  \ = datasets.get_dataset(\"mnist\")\n```\n\n定义损失函数：\n```python\ncriterion = nn.CrossEntropyLoss()\n\
  ```\n\n定义优化器：\n```python\noptim = torch.optim.SGD(\n    model.parameters(), 0.025,\n\
  \    momentum = 0.9, weight_decay = 3e-4\n)\n```\n\n初始化 `DartsTrainer`:\n```python\n\
  trainer = DartsTrainer(\n    model=model,\n    loss=criterion,\n    metrics=accuracy,\n\
  \    optimizer=optim,\n    num_epochs=10,\n    dataset=dataset_train,\n    batch_size=256,\n\
  \    arc_learning_rate=0.001,\n    log_frequency=10\n)\n```\n\n启动 `DARTS` 搜索：\n\
  ```python\ntrainer.fit()\n```\n\n返回最佳架构：\n```python\nbest_architecture = trainer.export()\n\
  print('最佳架构:', best_architecture)\n```\n\n列表 [5-13] 返回了 `DARTS` 的最优子网络：\n* `conv1`:\
  \ `5x5->16`\n* `conv2`: `5x5->32`\n* `dm`: Linear\n\n`DARTS` 是一个清晰的 One-shot 方法且易于调优。`DARTS`\
  \ 训练整个 `Supernet`，而 `ENAS` 只训练不同的子网络。总之，`DARTS` 是架构搜索的一个很好的选择。\n\n### General Supernet\
  \ Solving CIFAR-10\n\n通常，One-shot NAS 处理 `Supernets`。正如名称所示，`Supernet` 由各种层组成。在本节中，我们将考虑解决\
  \ CIFAR-10 的问题。\n* `SepConvBranch(3)`\n* `NonConvBranch(3)`\n* `SepConvBranch(5)`\n\
  * `NonConvBranch(3)`\n* `AvgPoolBranch`\n* `MaxPoolBranch`\n\n这些层的实现未提供，但读者可以在以下文件中获取详情：\n\
  * **TensorFlow**: `ch5/model/general/tf_ops.py`\n* **PyTorch**: `ch5/model/general/pt_ops.py`\n\
  \n**图 5-17.** Supernet 操作\n\n每个 `cell` 接收一个通过操作转换的必需输入以及 `n` 个额外输入。额外输入不是必需的，可以在不同的子网络中归零。操作和额外输入的标准化和形成了\
  \ cell 输出。\n\n**图 5-18.** Supernet cell\n\n`cell` 的序列形成了 `Supernet`，每个 `cell` 的输出可以作为后续\
  \ `cell` 的输入。每三个 cell 之后插入一个 `Factorized` 层。在本节中，我们将使用具有六个 cell 的 `Supernet`。\n\n\
  **图 5-19.** Supernet 架构\n\n让我们计算一下 `Supernet` 有多少子网络：`(6) × (6×2) × (6×4) × (6×8)\
  \ × (6×16) × (6×32) = 66 × 2^{1+2+3+4+5} ~ 1,500,000`。显然，无法使用多尝试 NAS 方法高效地探索这个模型空间。也可以使用具有\
  \ 9、12 或 24 个 cell 的 `Supernet`。在这种情况下，子网络的数量将变得巨大。\n\n有很多预定义的用于 One-shot NAS 的\
  \ `Supernet`，旨在解决特定类型的问题。我们之前定义的 `GeneralSupernet` 是最简单的之一。让我们实现 `GeneralSupernet`并在\
  \ CIFAR-10 数据集上运行 One-shot NAS。\n\n### 使用 TensorFlow 训练 General Supernet\n\n让我们实现\
  \ `GeneralSupernet` 并使用 `ENAS` 算法寻找最佳架构。\n\n**列表 5-14.** GeneralSupernet. TensorFlow。`ch5/model/general/tf_general.py`\n\
  \n```python\nfrom tensorflow.keras import Model, Sequential\nfrom tensorflow.keras.layers\
  \ import BatchNormalization, Conv2D, Dense,\nGlobalAveragePooling2D\nfrom nni.nas.tensorflow.mutables\
  \ import InputChoice, LayerChoice, MutableScope\n```\n\n\n\n\n```python\nfrom ch5.model.general.tf_ops\
  \ import build_conv, build_separable_conv, build_avg_pool, build_max_pool, FactorizedReduce\n\
  ```\n\n### 定义图 5-18 所示的 Cell\n\n```python\nclass Cell(MutableScope):\n    def __init__(self,\
  \ cell_ord, input_num, filters):\n        super().__init__(f'cell_{cell_ord}')\n\
  ```\n\n为图 5-17 所示的块操作设置 LayerChoice：`self.block_op = LayerChoice([\n    build_conv(filters,\
  \ 3, 'conv3'),\n    build_separable_conv(filters, 3, 'sepconv3'),\n    build_conv(filters,\
  \ 5, 'conv5'),\n    build_separable_conv(filters, 5, 'sepconv5'),\n    build_avg_pool(filters,\
  \ 'avgpool'),\n    build_max_pool(filters, 'maxpool'),\n], key = f'op_{cell_ord}')`\n\
  \n为额外的 Cell 输入设置 InputChoice：\n\n```python\nif input_num > 0:\n    self.connections\
  \ = InputChoice(\n        n_candidates = input_num,\n        n_chosen = None,\n\
  \        key = f'con_{cell_ord}'\n    )\nelse:\n    self.connections = None\n```\n\
  \n最后一个 cell 层 -  Normal 化：\n`self.batch_norm = BatchNormalization(trainable = False)`\n\
  \n定义 call 方法：\n\n```python\ndef call(self, inputs):\n    # 主输入由 block_op 处理：\n \
  \   out = self.block_op(inputs[-1])\n    # 额外的输入通过 self.connections 选择并求和：\n   \
  \ if self.connections is not None:\n        connection = self.connections(inputs[:-1])\n\
  \        if connection is not None:\n            out += connection\n    return self.batch_norm(out)\n\
  ```\n\n### 定义图 5-19 所示的 GeneralSupernet\n\n```python\nclass GeneralSupernet(Model):\n\
  \    def __init__(self,\n        num_cells = 6,\n        filters = 24,\n       \
  \ num_classes = 10\n    ):\n        super().__init__()\n        self.num_cells =\
  \ num_cells\n        self.stem = Sequential([\n            Conv2D(filters, kernel_size\
  \ = 3, padding = 'same', use_bias = False),\n            BatchNormalization()\n\
  \        ])\n```\n\n为池化层设置位置（FactorizedReduce）：\n`# num_cells = 6 -> pool_layers_idx\
  \ = [3, 6]`\n`self.pool_layers_idx = [\n    cell_id\n    for cell_id in range(1,\
  \ num_cells + 1) if cell_id % 3 == 0\n]`\n\n初始化 cells 和 pool_layers 列表：\n\n```python\n\
  self.cells = []\nself.pool_layers = []\nfor cell_ord in range(num_cells):\n    if\
  \ cell_ord in self.pool_layers_idx:\n        pool_layer = FactorizedReduce(filters)\n\
  \        self.pool_layers.append(pool_layer)\n    cell = Cell(cell_ord, cell_ord,\
  \ filters)\n    self.cells.append(cell)\n```\n\n定义末层：\n\n```python\nself.gap = GlobalAveragePooling2D()\n\
  self.dense = Dense(num_classes)\n```\n\n接下来我们定义 call 方法：\n\n```python\ndef call(self,\
  \ x):\n    cur = self.stem(x)\n    prev_outputs = [cur]\n    for cell_id, cell in\
  \ enumerate(self.cells):\n        # 将 Cell 通过 FactorizedReduce 池化层：\n        if\
  \ cell_id in self.pool_layers_idx:\n            # 池化层\n            # 0, 1, 2 ....\n\
  \            pool_ord = self.pool_layers_idx.index(cell_id)\n            pool =\
  \ self.pool_layers[pool_ord]\n            prev_outputs = [pool(tensor) for tensor\
  \ in prev_outputs]\n        cur = prev_outputs[-1]\n        cur = cell(prev_outputs)\n\
  \        prev_outputs.append(cur)\n    cur = self.gap(cur)\n    logits = self.dense(cur)\n\
  \    return logits\n```\n\n由于我们定义了 `GeneralSupernet`，可以使用以下脚本启动 ENAS。\n\n**Listing\
  \ 5-15.** GeneralSupernet ENAS. TensorFlow。`ch5/cifar10/enas_tf.py`\n\n```python\n\
  from tensorflow.keras.losses import Reduction, SparseCategoricalCrossentropy\nfrom\
  \ tensorflow.keras.optimizers import SGD\nimport ch5.datasets as datasets\nfrom\
  \ nni.algorithms.nas.tensorflow import enas\nfrom ch5.model.general.tf_general import\
  \ GeneralSupernet\nfrom ch5.tf_utils import accuracy, reward_accuracy, get_best_model\n\
  ```\n\n初始化 GeneralSupernet：\n\n`model = GeneralSupernet()`\n\n加载数据集：\n\n`dataset_train,\
  \ dataset_valid = datasets.cifar10_dataset()`\n\n声明损失函数：\n\n```python\nloss = SparseCategoricalCrossentropy(\n\
  \    from_logits = True,\n    reduction = Reduction.NONE\n)\n```\n\n声明优化器：\n\n`optimizer\
  \ = SGD(learning_rate = 0.05, momentum = 0.9)`\n\n设置 ENAS 训练参数：\n\n`metrics = accuracy`\n\
  `reward_function = reward_accuracy`\n`batch_size = 256`\n`num_epochs = 100`\n\n\
  初始化 EnasTrainer：\n\n```python\ntrainer = enas.EnasTrainer(\n    model,\n    loss\
  \ = loss,\n    metrics = metrics,\n    reward_function = reward_function,\n    optimizer\
  \ = optimizer,\n    batch_size = batch_size,\n    num_epochs = num_epochs,\n   \
  \ dataset_train = dataset_train,\n    dataset_valid = dataset_valid\n)\n```\n\n\
  启动训练：\n\n`trainer.train()`\n\n显示结果：\n\n`best = get_best_model(trainer)`\n`print(best)`\n\
  \n**注** 在 intel Core i7 和 CUDA GTX 1050 上运行了约 6 小时。搜索完成后，返回了以下报告：\n- `op_layer_0:\
  \ 3 SepConvBranch(5)`\n- `op_layer_1: 3 SepConvBranch(5)`\n- `op_layer_2: 1 SepConvBranch(3)`\n\
  - `op_layer_3: 4 SepConvBranch(3)`\n- `op_layer_4: 1 SepConvBranch(3)`\n- `op_layer_5:\
