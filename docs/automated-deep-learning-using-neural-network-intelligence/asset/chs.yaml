  \    hparams.update(nni_hparams)\n    trial(hparams)\n```\n\n记住，试验脚本可以以独立模式执行，因此你可以运行\
  \ `ch2/lenet_to_alexnet/tf_trial.py` 来测试其使用自定义参数的执行。\n\n## PyTorch LeNet 演变实现\n\n\
  在本节中，我们将使用 PyTorch Lightning 查看 `LeNet Evolution` 模型的实现。PyTorch Lightning 是一个无缝的\
  \ PyTorch 封装器，帮助消除 PyTorch 代码的模板化。它更简洁，且更适合此类任务。列表 2-24 展示了基于 PyTorch Lightning\
  \ 的 LeNet Evolution 模型。\n\n列表 2-24。LeNet Evolution。PyTorch Lightning 实现。`ch2/lenet_to_alexnet/pt_lenet_evolution.py`\n\
  \n```python\nimport nni\nimport torch\nimport torch.nn.functional as F\nimport pytorch_lightning\
  \ as pl\nfrom sklearn.metrics import accuracy_score\nfrom torch import nn\nimport\
  \ numpy as np\nfrom torch.utils.data import DataLoader\nfrom ch2.utils.datasets\
  \ import hoh_dataset\nfrom ch2.utils.pt_utils import SimpleDataset\n```\n\nLeNet\
  \ Evolution 模型使用所有五个超参数初始化。PyTorch Lightning 模型将初始化和训练逻辑封装在同一个类中，因此我们一次性传递所有超参数：\n\
  \n```python\nclass PtLeNetEvolution(pl.LightningModule):\n    def __init__(\n  \
  \      self,\n        feat_ext_sequences,\n        l1_size,\n        l2_size,\n\
  \        dropout_rate,\n        learning_rate\n    ) -> None:\n        super().__init__()\n\
  \        # learning_rate 和 dropout_rate 超参数被显式存储：\n        self.lr = learning_rate\n\
  \        self.dropout_rate = dropout_rate\n        self.save_hyperparameters()\n\
  ```\n\n第一步是为特征提取组件动态创建一个层序列：\n\n```python\n    fe_stack = []\n    # 下一层输入尺寸是前一层的输出通道数\n\
  \    in_dim = 3\n    for fe_seq in feat_ext_sequences:\n        if fe_seq['type']\
  \ in ['simple', 'with_pool']:\n            fe_stack.append(\n                nn.Conv2d(\n\
  \                    in_dim,\n                    out_channels=fe_seq['filters'],\n\
  \                    kernel_size=fe_seq['kernel'],\n                    bias=False\n\
  \                )\n            )\n        if fe_seq['type'] == 'with_pool':\n \
  \           fe_stack.append(\n                nn.MaxPool2d(\n                  \
  \  kernel_size=fe_seq['pool_size']\n                )\n            )\n        fe_stack.append(nn.ReLU())\n\
  \        in_dim = fe_seq['filters']\n    self.fe_stack = nn.Sequential(*fe_stack)\n\
  ```\n\n下一步一步是为决策者创建一个层序列：\n\n```python\n    # 懒性初始化 fc1\n    self.fc1_in_features\
  \ = 0\n    self._fc1 = None\n    # 如果 l2_size 大于零，则添加额外的线性层：\n    if l2_size > 0:\n\
  \        self.fc2 = nn.Sequential(\n            nn.Linear(l1_size, l2_size),\n \
  \           nn.ReLU(),\n            nn.Dropout(dropout_rate)\n        )\n      \
  \  self.fc3 = nn.Linear(l2_size, 2)\n    else:\n        self.fc2 = nn.Identity()\n\
  \        self.fc3 = nn.Linear(l1_size, 2)\n\n    # 这里，我们再次利用了懒性初始化：\n    @property\n\
  \    def fc1(self):\n        if self._fc1 is None:\n            self._fc1 = nn.Sequential(\n\
  \                nn.Linear(self.fc1_in_features, self.l1_size),\n              \
  \  nn.ReLU(),\n                nn.Dropout(self.dropout_rate)\n            )\n  \
  \      return self._fc1\n```\n\n模型执行方法：\n\n```python\n    def forward(self, x):\n\
  \        # 调用特征提取序列\n        x = self.fe_stack(x)\n        # 展平除 batch 维度以外的所有维度\n\
  \        self.fc1_in_features = np.prod(x.shape[1:])\n        x = x.view(-1, self.fc1_in_features)\n\
  \        x = self.fc1(x)\n        x = self.fc2(x)\n        x = self.fc3(x)\n   \
  \     return F.log_softmax(x, dim=1)\n```\n\n我们使用带有 `learning_rate` 超参数的 `Adam`\
  \ 优化器：\n\n```python\n    def configure_optimizers(self):\n        return torch.optim.Adam(self.parameters(),\
  \ lr=self.lr)\n```\n\n训练和测试方法使用交叉熵函数：\n\n```python\n    def training_step(self,\
  \ batch, batch_idx):\n        x, y = batch\n        p = self(x)\n        loss =\
  \ F.cross_entropy(p, y)\n        self.log(\"train_loss\", loss, prog_bar=True)\n\
  \        nni.report_intermediate_result(loss.item())\n        return loss\n\n  \
  \  def test_step(self, batch, batch_idx):\n        x, y = batch\n        p = self(x)\n\
  \        loss = F.cross_entropy(p, y)\n        self.log(\"test_loss\", loss, prog_bar=True)\n\
  ```\n\n\n\n\n# 第 2 章 超参数优化\n\n```python\n'fe_slot_3': {\n    '_name': 'with_pool',\n\
  \    'filters': 8,\n    'kernel': 5,\n    'pool_size': 3\n},\n'l1_size': 1024,\n\
  'l2_size': 512,\n'dropout_rate': .3,\n'learning_rate': 0.001\n}\n```\n\n# NNI 超参数\n\
  \n## 在没有 NNI 实验上下文的情况下安全运行\n\n```python\nnni_hparams = nni.get_next_parameter()\n\
  hparams.update(nni_hparams)\ntrial(hparams)\n```\n\n请记住，试验脚本可以在独立模式下执行，因此你可以运行 `ch2/lenet_to_alexnet/pt_trial.py`\
  \ 来测试其使用自定义参数执行执行。\n\n### 执行 LeNet 演化 HPO 实验\n\n现在我们来到了本节的高潮。我们可以将这个实验视为一项完整的科学研究，它将为特定数据集上的分类问题创建一个独特的深度学习模型。它将采用\
