  \n### 从 LeNet 到 AlexNet\n\n库：TensorFlow (Keras API), PyTorch (PyTorch Lightning)\n\
  \n嗯，手写识别是一项相当重要的任务，但看起来是时候转向更复杂的问题了。开发一个能够分类人类和马的模型如何？图 2-18 展示了 85\n\n![](img/index-99_1.png)\n\
