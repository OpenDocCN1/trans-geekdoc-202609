  \n234\n\n![](img/index-248_1.png)\n\n235\n\n# 第 4 章 多试验神经网络架构搜索\n\n**图 4-20.** LeNet\
  \ NAS 最佳模型架构\n\n![](img/index-249_1.png)\n\n235\n\n# 第 4 章 多试验神经网络架构搜索\n\n我们在本节中进行的研究可以为你自己的\
  \ NAS 解决方案提供一个良好的起点。它包含了多试验 NAS 中使用的基础技术。在这里，我们使用 LeNet 模型作为基础模型（Base Model），但你可以选择任何更符合具体问题的模型和变异器。不过，我们在\
  \ LeNet NAS 上并没有获得非常理想的结果。在下一节中，我们将尝试另一种使用更复杂方法的 NAS。\n\n## CIFAR-10 ResNet NAS\n\
  \n让我们尝试寻找另一种架构搜索方法来解决 CIFAR-10 问题。2015 年，论文[Deep Residual Learning for Image Recognition](https://arxiv.org/pdf/1512.0385.pdf)发表。这篇文章对深度学习产生了巨大影响。它引入了残差（residual）的概念，这可以防止神经网络性能的下降。\n\
  \nResNet 模型的基本构建块是 `Bottleneck` 块。其内部带有跳跃连接（skip connections）。NAS 算法将决定 `Bottleneck`\
  \ 块是否适当使用跳跃技术。因此，ResNet 中有带有*和*不带*跳跃连接的两种变体 `Bottleneck` 块。其架构如图 4-21 所示。\n\n**图\
  \ 4-21.** Bottleneck 空间\n\n236\n\n![](img/index-250_1.png)\n\n236\n\n# 第 4 章 多试验神经网络架构搜索\n\
  \nResNet 的另一个组件是 `Residual Cell`。`Residual Cell` 由 `Bottleneck` 块序列组成。`Bottleneck`\
  \ 序列的长度取决于数据集。图 4-22 显示了 `Residual Cell` 空间。\n\n**图 4-22.** Residual Cell 空间\n\n\
  最后，我们可以构建 ResNet 模型。`ResNet` 架构如下：\n\n- 初始卷积层\n- Residual Cell 序列\n- 若干全连接层\n\n\
  `Residual Cell` 的最优长度取决于数据集。我们将在 ResNet 中尝试寻找它。图 4-23 展示了 NAS 的完整模型空间。\n\n237\n\n\
  ![](img/index-251_1.png)\n\n237\n\n# 第 4 章 多试验神经网络架构搜索\n\n**图 4-23.** ResNet 空间\n\
  \n代码列表 4-1 定义了用于 NAS 的 Bottleneck 块。\n\n```python\n# ch4/retiarii/cifar_10_resnet/bottle_neck.py\n\
  import nni.nn.pytorch as nn\n\nclass Bottleneck(nn.Module):\n    # Bottleneck 块产生的输出通道：\n\
  \    @classmethod\n    def result_channels(cls, channels):\n        return channels\
  \ * 4\n\n    # Bottleneck 接收参数：\n    # cell_num: 所属 Residual Cell 的序号\n    # in_channels:\
  \ 输入到卷积层的通道\n    # out_channels: 所有卷积层的输出通道\n    def __init__(self, cell_num, in_channels,\
  \ out_channels, i_downsample=None, stride=1):\n        super(Bottleneck, self).__init__()\n\
  \        # 定义带有批归一化的三个卷积层：\n        self.conv1 = nn.Conv2d(\n            in_channels,\
  \ out_channels,\n            kernel_size=1, stride=1, padding=0\n        )\n   \
  \     self.bn1 = nn.BatchNorm2d(out_channels)\n        self.conv2 = nn.Conv2d(\n\
  \            out_channels, out_channels,\n            kernel_size=3, stride=stride,\
  \ padding=1\n        )\n        self.bn2 = nn.BatchNorm2d(out_channels)\n      \
  \  self.conv3 = nn.Conv2d(\n            out_channels, self.result_channels(channels),\n\
  \            kernel_size=1, stride=1, padding=0\n        )\n        self.bn3 = nn.BatchNorm2d(self.result_channels(channels))\n\
  \n        # 跳跃连接对于 Residual Cell 中的所有块都是相同的，\n        # 因为所有输入变异器在 Residual Cell\
  \ 中共享相同的标签：\n        self.skip_connection = nn.InputChoice(\n            n_candidates=2,\n\
  \            n_chosen=1,\n            label=f'bottle_neck_{cell_num}_skip_connection'\n\
  \        )\n\n        # 恒等采样块：\n        self.i_downsample = i_downsample\n     \
  \   self.relu = nn.ReLU()\n\n    def forward(self, x):\n        # x0\n        identity\
  \ = x.clone()\n        x = self.relu(self.bn1(self.conv1(x)))\n        x = self.relu(self.bn2(self.conv2(x)))\n\
  \        x = self.conv3(x)\n        x = self.bn3(x)\n\n        # 如果 self.skip_connection\
  \ 返回非空则执行跳跃连接\n        if identity is not None:\n            # 如果需要下采样\n       \
  \     if self.i_downsample is not None:\n                identity = self.i_downsample(identity)\n\
  \            # 加上恒等\n            x += identity\n\n        x = self.relu(x)\n   \
  \     return x\n```\n\n238\n\n# 第 4 章 多试验神经网络架构搜索\n\n239\n\n# 第 4 章 多试验神经网络架构搜索\n\
  \n240\n\n由于我们已经定义了 Bottleneck 块，我们可以查看列表 4-12 中的 ResNet 模型空间定义。\n\n（此处省略了一些不重要的代码段。完整代码在相应文件中：*ch4/retiarii/cifar_10_resnet/res_net_model_space.py*。）导入模块：\n\
  \n**代码列表 4-12.** ResNet NAS 模型空间\n\n```python\n# ch4/retiarii/cifar_10_resnet/res_net_model_space.py\n\
  from typing import Iterator\nimport nni.nn.pytorch as nn\nfrom nni.retiarii import\
  \ model_wrapper\nfrom torch.nn import Parameter\nfrom ch4.retiarii.cifar_10_resnet.bottle_neck\
  \ import Bottleneck\n\n```\n\n不要忘记用 @model_wrapper 注解模型空间：\n\n@model_wrapper\nclass\
  \ ResNetModelSpace(nn.Module):\n    # 全局模型常量：\n    # 分类类别\n    num_classes = 10\n\
  \    # RGB 图像输入通道\n    in_channels = 3\n    # ResNet 通道常数\n    channels = 64\n```\n\
  \n\n\n\n\n```python\ndef __init__(self):\n    super().__init__()\n```\n\n选择 `ReLU`\
  \ 作为全局激活函数：\n`self.relu = nn.ReLU()`\n\n带有批次归一化的入口卷积层：\n```python\nself.conv1 =\
  \ nn.Conv2d(\n    in_channels = self.in_channels,\n    out_channels = self.channels,\n\
  \    kernel_size = 7,\n    stride = 2,\n    padding = 3,\n    bias = False\n)\n\
  self.batch_norm1 = nn.BatchNorm2d(64)\n```\n\n带有以下超参数列表 `[2, 3]` 的 MaxPool 层：\n\
  `pool_size = nn.ValueChoice([2, 3], label = 'pool_size')`\n`self.max_pool = nn.MaxPool2d(kernel_size\
  \ = pool_size, stride = 2, padding = 1)`\n\n使用重复变异器（Repeat mutator）构建残差单元序列（从两个到五个单元）：\n\
  ```python\nself.res_cells = nn.Repeat(\n    ResNetModelSpace.residual_cell_builder(),\n\
  \    depth = (2, 5), label = 'res_cells_repeat'\n)\n```\n\n构建带有两个线性层的全连接序列：\n```python\n\
  self.avg_pool = nn.AdaptiveAvgPool2d((1, 1))\nself.fc1_input_dim = None\nself.fc1_output_dim\
  \ = nn.ValueChoice(\n    [256, 512],\n    label = 'fc1_output_dim'\n)\nself._fc1\
  \ = None\nself.fc2 = nn.Linear(\n    in_features = self.fc1_output_dim,\n    out_features\
  \ = self.num_classes\n)\n```\n\n定义前向方法：\n```python\ndef forward(self, x):\n    x\
  \ = self.relu(self.batch_norm1(self.conv1(x)))\n    x = self.max_pool(x)\n    x\
  \ = self.res_cells(x)\n    x = self.avg_pool(x)\n    x = x.reshape(x.shape[0], -1)\n\
  \    if not self.fc1_input_dim:\n        self.fc1_input_dim = x.shape[1]\n    x\
  \ = self.relu(self.fc1(x))\n    x = self.fc2(x)\n    return x\n```\n\n以下方法用于为重复变异器构建残差单元：\n\
  ```python\n@classmethod\ndef residual_cell_builder(cls):\n    def create_cell(cell_num):\n\
  ```\n\n定义残差单元参数：\n# 通道数序列：64, 128, 256, 512,...\n`planes = 64 * pow(2, cell_num)`\n\
  # 步长序列：1, 2, 2, 2,...\n`stride = max(1 + cell_num, 2)`\n\n残差单元中的 Bottleneck 块数量：\n\
  # 块序列：3, 4, 5, 5,...\n`blocks = max(3 + cell_num, 5)`\n`downsample = None`\n\nBottleneck\
  \ 块的占位符：\n`layers = []`\n\n如果需要，构建下采样恒等块（identity block）：\n```python\nif stride\
  \ != 1 or cls.channels != Bottleneck.result_channels_num(planes):\n    downsample\
  \ = nn.Sequential(\n        nn.Conv2d(\n            in_channels = cls.channels,\n\
  \            out_channels = Bottleneck.result_channels_num(planes),\n          \
  \  kernel_size = 1,\n            stride = stride\n        ),\n        nn.BatchNorm2d(\n\
  \            num_features = Bottleneck.result_channels_num(planes)\n        )\n\
  \    )\n    layers.append(\n        Bottleneck(\n            cell_num = cell_num,\n\
  \            in_channels = cls.channels,\n            out_channels = planes,\n \
  \           i_downsample = downsample,\n            stride = stride\n        )\n\
  \    )\ncls.channels = Bottleneck.result_channels_num(planes)\n```\n\n生成 Bottleneck\
  \ 块序列：\n```python\nfor i in range(blocks - 1):\n    layers.append(\n        Bottleneck(\n\
  \            cell_num = cell_num,\n            in_channels = cls.channels,\n   \
  \         out_channels = planes\n        )\n    )\nreturn nn.Sequential(*layers)\n\
  return create_cell\n```\n\n呼。如果你还不熟悉 ResNet，跟随 ResNet 模型空间（ResNet Model Space）的定义并不容易。无论如何，不要忘记\
  \ NAS 将神经网络视为数据流图（Data Flow Graph），并且它试图在我们在图 [4-23] 中构建的模型空间中寻找节点和连接的最佳组合。即使你对某些深度学习概念还不熟悉，也尝试将\
  \ NAS 视为在超图空间（supergraph space）中搜索最优子图（optimal sub-graph）的过程。\n\nResNet 模型评估器（ResNet\
  \ model evaluator）是一个经典的神经网络训练-测试算法。你可以在此处查看其代码：`ch4/retiarii/cifar_10_resnet/eval.py`。ResNet\
  \ NAS 实验脚本与 LeNet NAS 差异不大，我没有在书中提供它的代码。请参阅脚本文件：`ch4/retiarii/cifar_10_resnet/run_cifar10_resnet_experiment.py`。\n\
  \n可以如下所示运行实验：\n`$ python3 ch4/retiarii/cifar_10_resnet/run_cifar10_resnet_experiment.py`\n\
  \n实验可以按如下方式运行：\n`ch4/retiarii/cifar_10_resnet/run_cifar10_resnet_experiment.py`\n\
  \n**注意**：在 Intel i7 上运行 60 小时。\n\nResNet 在测试集上达到了 **0.957** 的准确率。这并不是完美，但比 LeNet\
  \ 好得多。CIFAR-10 模型具有以下参数：\n```json\n{\n  \"pool_size\": 2,\n  \"res_cells\": 5,\n\
  \  \"bottle_neck_0_connection\": 1,\n  \"bottle_neck_1_connection\": 0,\n  \"bottle_neck_2_connection\"\
  : 0,\n  \"bottle_neck_3_connection\": 0,\n  \"bottle_neck_4_connection\": 0,\n \
  \ \"fc1_output_dim\": 512\n}\n```\n\n这些参数意味着残差单元（Residual Cells）序列：第一个单元没有跳跃连接，其他使用了它。CIFAR-10\
  \ 是一个复杂的问题，即使是大型网络也无法达到高准确率。\n\n表 4-2 CIFAR-10 的最佳架构排名\n\n| 排名 | 架构 | 准确率 |\n| :---\
  \ | :--- | :--- |\n| 79 | autoDropout | 96.8 |\n| 96 | Wide resNet | 96.1 |\n| **-**\
  \ | **-** | **Multi-trial ResNet 95.7** |\n| 104 | SimpleNet | 95.5 |\n| 108 | MomentumNet\
  \ | 95.1 |\n| 116 | tree+Max pooling | 94.7 |\n\n**经典搜索 (TensorFlow)**\n\n经典 NAS\
  \ 采用多试验方法。评估器从模型空间获取模型并单独评估。NNI 目前支持经典 NAS，但正在转向 Retarii 框架。经典 NAS 的过程与超参数调优相似，不同之处搜索空间是通过\
  \ `nnictl_gen` 自动生成的。\n\n经典 NAS 的逻辑实体是*基础模型（Base Model）*、*变异器（Mutator）*、*搜索空间（Search\
  \ Space）*、*试验（Trial）*和*搜索策略（Search Strategy）*。让我们通过将 NAS 算法应用于 MNIST 问题来学习每一个实体。\n\
  \n**基础模型**\n\n每次神经架构搜索都从定义基础模型开始。基础模型是作为新架构起点的神经网络。基础模型可以非常简单，也可以复杂。研究者选择最适合基准的模型。让我们查看列表\
  \ 4-13 中经典的 LeNet 模型。\n\n***列表 4-13.*** 基础模型。`ch4/classic/base_model.py`\n\n```python\n\
  class LeNetModel(Model):\n    # 基础模型层\n    def __init__(self):\n        super().__init__()\n\
  \        self.conv1 = Conv2D(6, 3, padding='same', activation='relu')\n        self.pool\
  \ = MaxPool2D(2)\n        self.conv2 = Conv2D(16, 3, padding='same', activation='relu')\n\
  \        self.bn = BatchNormalization()\n        self.gap = AveragePooling2D(2)\n\
  \        self.fc1 = Dense(120, activation='relu')\n        self.fc2 = Dense(84,\
  \ activation='relu')\n        self.fc3 = Dense(10)\n\n    # 前向传播\n    def call(self,\
  \ x):\n        batch_size = x.shape[0]\n        x = self.conv1(x)\n        x = self.pool(x)\n\
  \        x = self.conv2(x)\n        x = self.pool(self.bn(x))\n        x = self.gap(x)\n\
  ```\n\n\n\n\n```python\nx = tf.reshape(x, [batch_size, -1])\nx = self.fc1(x)\nx\
  \ = self.fc2(x)\nx = self.fc3(x)\nreturn x\n```\n\n列表 4-13 w 中描述的模型将作为新架构的“粘土”。\n\
  \n### 变异器 (Mutators)\n\n变异器（Mutator）将 `Base Model` 转换为新模型。一组变异器允许为 `NAS` 定义搜索空间。经典的\
  \ NNI NAS 两个变异器：`LayerChoice` 和 `InputChoice`。`LayerChoice` 变异器为层占位符构建候选层。\n\n在探索过程中，会尝试其中一个候选者。`InputChoice`\
  \ 则尝试不同的连接。它接收多个张量并从中选择出 `n_chosen` 个张量。\n\n你可以在“使用 Retiarii 进行神经架构搜索 (PyTorch)”章节下的“变异器”子节中学习更多关于\
  \ `LayerChoice` 和 `InputChoice` 变异器的信息。\n\n我们可以通过以下方式将 `LayerChoice` 和 `InputChoice`\
  \ 变异器应用于 `Base Model`。\n\n***Listing 4-14. LeNet 模型空间。ch4/classic/model.py***\n\n\
  ```python\nclass LeNetModelSpace(Model):\n    def __init__(self):\n        super().__init__()\n\
  ```\n\n我们为 `conv1` 占位符尝试了三种不同的卷积层：\n```python\nself.conv1 = LayerChoice([\n    Conv2D(6,\
  \ 3, padding = 'same', activation = 'relu'),\n    Conv2D(6, 5, padding = 'same',\
  \ activation = 'relu'),\n    Conv2D(6, 7, padding = 'same', activation = 'relu'),\n\
  ], key = 'conv1')\n```\n\n我们为 `pool` 占位符尝试了两种不同的池化层：\n```python\nself.pool = LayerChoice([\n\
  \    MaxPool2D(2),\n    MaxPool2D(3)], key = 'pool')\n```\n\n我们为 `conv2` 占位符尝试了三种不同的卷积层：\n\
  ```python\nself.conv2 = LayerChoice([\n    Conv2D(16, 3, padding = 'same', activation\
  \ = 'relu'),\n    Conv2D(16, 5, padding = 'same', activation = 'relu'),\n    Conv2D(16,\
  \ 7, padding = 'same', activation = 'relu'),\n], key = 'conv2')\nself.conv3 = Conv2D(16,\
  \ 1)\n```\n\n我们添加了跳跃连接技术：\n```python\nself.skip_connect = InputChoice(\n    n_candidates\
  \ = 2,\n    n_chosen = 1,\n    key = 'skip_connect'\n)\nself.bn = BatchNormalization()\n\
  self.gap = AveragePooling2D(2)\nself.fc1 = Dense(120, activation = 'relu')\n```\n\
  \n我们为 `fc1` 占位符添加了两个候选：\n```python\nself.fc2 = LayerChoice([\n    Dense(84, activation\
  \ = 'relu'),\n    Layer()\n], key = 'fc2')\n```\nself.fc3 = Dense(10)\n\n图 4-24\
  \ 展示了列表 4-14 描述的所有可能架构。](#index_split_002.html#p261)\n\n![](img/index-263_1.png)\n\
  \n***图 4-24. 所有可能架构的集合***\n\n我们看到每个变异器都为 `Base Model` 增加了变异。\n\n### 试验 (Trial)\n\
  \nNAS Trial 等同于 HPO 背景下的 `Trial`。它初始化模型、训练模型、测试并返回模型准确率。只有一个新特性：你必须使用 `nn.algorithms.nas.tensorflow.classic_nas`\
  \ 包中的 `get_and_apply_next_architecture` 方法来初始化模型。列表 4-15 pr](#index_split_002.html#p264)\
  \ 提供了 NAS Trial。\n\n（完整代码在相应文件中：`ch4/classic/trial.py`。）\n\n***Listing 4-15. NAS\
  \ Trial.***\n\n```python\nnet = LeNetModelSpace()\nget_and_apply_next_architecture(net)\n\
  train_model(net, dataset_train, optimizer, epochs)\nacc = test_model(net, dataset_test)\n\
  nni.report_final_result(acc.numpy())\n```\n\n### 搜索空间 (Search Space)\n\n定义 Trial\
  \ 脚本后，你应该使用以下命令手动生成搜索空间 JSON 文件：\n\n```bash\n$ nnictl ss_gen --trial_command=\"\
  python3 trial.py\" --trial_dir=ch4/classic --file=ch4/classic/search_space.json\n\
  ```\n\n前述命令生成了列表 4-16 所示的文件。](#index_split_002.html#p264)\n\n***Listing 4-16. NAS\
  \ 搜索空间***\n\n```json\n{\n  \"conv1\": {\n    \"_type\": \"layer_choice\",\n    \"\
  _value\": [\"0\", \"1\", \"2\"]\n  },\n  \"conv2\": {\n    \"_type\": \"layer_choice\"\
  ,\n    \"_value\": [\"0\", \"1\", \"2\"]\n  },\n  \"fc2\": {\n    \"_type\": \"\
  layer_choice\",\n    \"_value\": [\"0\", \"1\"]\n  },\n  \"pool\": {\n    \"_type\"\
  : \"layer_choice\",\n    \"_value\": [\"0\", \"1\"]\n  },\n  \"skip_connect\": {\n\
  \    \"_type\": \"layer_choice\",\n    \"_value\": [\"0\", \"1\"]\n  }\n}\n```\n\
  \n### 搜索策略 (Search Strategy)\n\n经典的 NAS 与 HPO 方法没有太大区别。事实上，我们可以通过层级和设计超参数来构建相同的实验。我们在[第\
  \ 2 章](https://doi.org/10.1007/978-1-4842-8149-9_2) 的“从 LeNet 到 AlexNet”节中做过一个相似的技巧。关于这些调优器的更多信息，你可以参考“使用\
  \ Retiarii 进行神经架构搜索 (PyTorch)”章节下的“变异器”子节。\n\n### 实验 (Experiment)\n\n最后要做的的是定义实验配置，它定义在列表\
  \ 4-17 中](#index_split_002.html#p265)。\n\n***Listing 4-17. NAS 配置***\n\n```yaml\n\
  experimentName: example\ntrial: 1\nmaxTrialNum: 100\ntrainingPlatform: local\nsearchSpacePath:\
  \ search_space.json\ntuner: PPOTuner\noptimizeMode: maximize\n```\n\n现在，我们可以通过以下方式开始实验：\n\
  \n```bash\n$ nnictl create --config=ch4/classic/config.yml\n```\n\n**注意** 在测试数据集上返回\
  \ 0.9923，通过以下方式：\nexperiment: 2\npool: 0\nfc2: 0\nskip_connect: 0\n\n\n\n\n\n在上一节中，我们探索了多试验神经架构搜索（Multi-trial\
  \ Neural Architecture Search），这是一种非常有前景的方法。读者可能会好奇，为什么多试验 NAS 被称为这个名字？是否存在其他非多试验的\
  \ NAS 方法？是否真的可以在不进行尝试的情况下通过其他方式搜索最优神经网络架构？看起来，寻找最优解决方案的唯一方法就是尝试搜索空间中的不同元素，这似乎很自然。事实上，事实并非完全如此。有一种方法允许通过训练某些超网（Supernet）来找到最佳架构。这种方法被称为`单次神经架构搜索`（One-shot\
  \ Neural Architecture Search）。正如名称“one-shot”所暗示，这种方法只涉及一次尝试。当然，这次“尝试”比训练单个神经网络要长得多，尽管如此，它仍然了大量时间。\n\
  \n在本章中，我们将学习什么是 One-shot NAS 以及如何为这种方法设计架构。我们将研究两种流行的单次搜索算法：`通过参数共享的高效神经架构搜索`（Efficient\
  \ Neural Architecture Search via Parameter Sharing，简称 `ENAS`）和`可微架构搜索`（Differentiable\
  \ Architecture Search，简称 `DARTS`）。当然，我们将应用这些算法来解决实际问题。\n\nNNI 2.7 版本（本书使用的版本）提供了\
  \ TensorFlow 框架的 `ENAS` 算法实现，但没有 `DARTS` 算法的实现。无论如何，`ENAS` 算法是最流行且高效的单次 NAS 实现之一，因此\
  \ TensorFlow 用户不应感到太沮丧。\n\n# 实战中的 One-Shot NAS\n\n对自动化神经网络架构设计的兴趣日益增长，但经典的多试验 NAS\
  \ 方法计算开销太大，需要从头开始训练成千上万种不同的架构。遗憾的是，事实使得多试验 NAS 在实践中并不适用。事实上，某些多试验实验在最现代计算资源上可能需要几周或几个月。一种新的\
  \ Oneshot NAS 方法被提出以解决多试验架构搜索的这一缺点。\n\n介绍 One-shot NAS 的最好方法是提供示例。假设我们正在为 MNIST\
  \ 问题寻找最优架构。我们有图 5-1 所示的模型空间。\n\n***5-1.** 模型空间图\n\n1 显示了具有两个可变层的模型空间。每个可变层都有以下选择：`Conv\
  \ 1×1`、`Conv 3×3` 和 `Conv 5×5`。在经典的多试验场景中，我们将对每种参数组合进行 3×3=9 次试验，并选择最佳的一个。而 One-shot\
  \ NAS 方法遵循另一种技术，我们创建一个 `Supernet`，它合并或减少每个可变层的输出，并只训练一次生成的神经网络。图 5-2 展示了这个超网。\n\n\
  ***5-2.** MNIST 问题的超网*\n\n训练超网后，我们通过激活每层组合并置零其他层来对其进行评估。图 5-3 阐了这一概念。\n\n***5-3.**\
  \ MNIST 问题的超网*\n\n最后，我们选择性能最好的组合。该组合代表了 One-shot NAS 算法的结果。例如，如果组合 `(Conv 5×5, Conv\
  \ 5×5)` 显示出最高的准确率，那么我们的目标网络设计就是 `Conv 5×5 → Conv 5×5 → Linear → Linear`。\n\n让我们总结一下在\
  \ One-shot NAS 算法期间到底做了什么：\n- 我们创建了一个源自模型空间的单个 `Supernet`。\n- 我们对其进行了`trained`（训练）。\n\
  - 我们对其进行了九次`evaluated`（评估），依次激活不同的层。\n- 我们为该问题选择了`best`（最佳）神经设计。\n\n我们在这里获得的主要好处是，只训练了一次超网，而不是训练九个候选网络！这极大地加速了整个神经架构搜索，因为网络训练是\
  \ NAS 过程中最耗时的部分。\n\n读者可能会有一个合理的问题：*“等等！我们训练了一个单一的超网网络。所有候选层学会了协同工作！但随后我们决定将其拆分成不同的部分，保留相同的权重。这太是荒谱了！”*\
  \ 我同意。这是一个非常违反直觉的概念。事实上，所有层都是一起训练的，它们学会了在解决问题时互补和帮助。你不能不能从搜索最佳架构的神经网络中丢弃某些层。但 One-shot\
  \ NAS 最神奇的地方在于，你可以！虽然目前还没有充分的数学依据，但它在实践中是有效的。\n\n首先，我们的目标是获得对 One-shot NAS 的直觉。在这里，我们将制作一个原始的多试验\
  \ NAS。让我们使用图 5-1 所示的示例在实践中实现这种方法。\n\n###  5-1. TensorFlow 实现\n```python\nfrom tensorflow.keras\
  \ import Model\nfrom tensorflow.keras.layers import Dense, Flatten, MaxPoolD\n\n\
  class TfNetMultiTrialModel(Model):\n    def __init__(self, kernel1, kernel2):\n\
  \        super().__init__()\n        self.conv1 = create_conv(kernel1, filter=16)\n\
  \        self.pool1 = MaxPoolD(pool_size=2)\n        self.conv2 = create_conv(kernel2,\
  \ filter=32)\n        self.pool2 = MaxPoolD(pool_size=2)\n        self.flatten =\
  \ Flatten()\n        self.fc1 = Dense(128, 'relu')\n        self.fc2 = Dense(10,\
  \ 'softmax')\n\n    def call(self, x, **kwargs):\n        x = self.conv1(x)\n  \
  \      x = self.pool1(x)\n        x = self.conv2(x)\n        x = self.pool2(x)\n\
  \        x = self.flatten(x)\n        x = self.fc1(x)\n        return self.fc2(x)\n\
  ```\n\n###  5-2. PyTorch 实现\n```python\nimport torch\nimport torch.nn as nn\nimport\
  \ torch.nn.functional as F\nfrom ch5.naive_one_shot_nas.pt.ops import create_conv\n\
  \nclass PtLeNetMultiTrialModel(nn.Module):\n    def __init__(self, kernel1, kernel2):\n\
  \        super(PtLeNetMultiTrialModel, self).__init__()\n        self.conv1 = create_conv(kernel1,\
  \ in_channels=1, out_channels=16)\n        self.conv2 = create_conv(kernel2, in_channels=16,\
  \ out_channels=32)\n        self.flat = nn.Flatten()\n        self.fc1 = nn.Linear(1568,\
  \ 128)\n        self.fc2 = nn.Linear(128, 10)\n\n    def forward(self, x):\n   \
  \     x = torch.relu(self.conv1(x))\n        x = F.max_pool2d(x, 2, 2)\n       \
  \ x = torch.relu(self.conv2(x))\n        x = F.max_pool2d(x, 2, 2)\n        x =\
  \ self.flat(x)\n        x = torch.relu(self.fc1(x))\n        x = self.fc2(x)\n \
  \       return F.log_softmax(x, dim=1)\n```\n\n现在，让我们使用列表 5-3 中的脚本，遍历各种卷积大小参数（`kernel1:\
  \ [1, 3, 5]`，`kernel2: [1, 3, 5]`）来执行多试验 NAS。\n\n\n\n\n（TensorFlow 实现）和列表 5-4（PyTorch\
  \ 实现）。\n\n# 第 5 章 单次神经网络架构搜索\n\n我们导入必要的模块：\n\n**列表 5-3.** **TensorFlow** 实现。多试验\
  \ NAS (Multi-trial NAS)。`ch5/naive_one_shot_nas/tf/ms_search.py`\n\n```python\n\
  from ch5.naive_one_shot_nas.tf.tf_lenet_multi_model import TfLeNetMultiTrialModel\n\
  from ch5.naive_one_shot_nas.tf.tf_train import train, test\n```\n\n定义搜索空间：\n\n```python\n\
  kernel1_choices = [1, 3, 5]\nkernel2_choices = [1, 3, 5]\nresults = {}\n```\n\n\
  执行多试验搜索：\n\n```python\nfor k1 in kernel1_choices:\n    for k2 in kernel2_choices:\n\
  \        # 试验\n        model = TfLeNetMultiTrialModel(k1, k2)\n        train(model)\n\
  \        accuracy = test(model)\n        results[(k1, k2)] = accuracy\n```\n\n显示结果：\n\
  \n```python\nprint('=======')\nprint('Results:')\nfor k, v in results.items():\n\
  \    print(f'Conv1 {k[0]}x{k[0]}, Conv2: {k[1]}x{k[1]} : {v}')\n```\n\n我们导入必要的模块：\n\
  \n**列表 5-4.** **PyTorch** 实现。多试验 NAS (Multi-trial NAS)。`ch5/naive_one_shot_nas/pt/ms_search.py`\n\
  \n```python\nfrom ch5.naive_one_shot_nas.pt.pt_lenet_multi_model import PtLeNetMultiTrialModel\n\
  from ch5.naive_one_shot_nas.pt.pt_train import train_model, test_model\n```\n\n\
  定义搜索空间：\n\n```python\nkernel1_choices = [1, 3, 5]\nkernel2_choices = [1, 3, 5]\n\
  results = {}\n```\n\n执行多试验搜索：\n\n```python\nfor k1 in kernel1_choices:\n    for\
  \ k2 in kernel2_choices:\n        # 试验\n        model = PtLeNetMultiTrialModel(k1,\
  \ k2)\n        train_model(model)\n        accuracy = test_model(model)\n      \
  \  results[(k1, k2)] = accuracy\n```\n\n定义搜索空间：\n\n```python\nprint('=======')\n\
  print('Results:')\nfor k, v in results.items():\n    print(f'Conv1 {k[0]}x{k[0]},\
  \ Conv2: {k[1]}x{k[1]} : {v}')\n```\n\n我们执行的多试验 NAS 结果列在表 5-1 中。\n\n**表 5-1.** 多试验\
  \ NAS 结果\n\n| 试验 | Conv1 | Conv2 | 准确率 |\n| :--- | :--- | :--- | :--- |\n| 1 | Conv1×1\
  \ | Conv1×1 | 0.9446 |\n| 2 | Conv1×1 | Conv3×3 | 0.9849 |\n| 3 | Conv1×1 | Conv5×5\
  \ | 0.9864 |\n| 4 | Conv3×3 | Conv3×3 | 0.9851 |\n| 5 | Conv3×3 | Conv3×3 | 0.9881\
  \ |\n| 6 | Conv3×3 | Conv5×5 | 0.9909 |\n| 7 | Conv5×5 | Conv1×1 | 0.9872 |\n| 8\
  \ | Conv5×5 | Conv3×3 | 0.9901 |\n| **9** | **Conv5×5** | **Conv5×5** | **0.9917**\
  \ |\n\n根据表 5-1，最佳候选方案是 (Conv5×5, Conv5×5)。嗯，我们尝试了每一个神经设计候选方案，并为 MNIST 问题找到了最合适的一个。\n\
  \n当然，我们之前实现的多试验 NAS 相当简单，但所有多试验方法通俗来说都是那样的。\n\n但现在，让我们尝试使用单次 NAS (One-shot NAS)\
  \ 方法获得相同的结果！\n\n首先，我们创建了图 5-2（在列表 [5-5 [TensorFlow 实现] 和列表 5-6 PyTorch 实现]中）]所示的超网络\
