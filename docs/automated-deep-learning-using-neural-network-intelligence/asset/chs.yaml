  \n# 索引 [379]\n\n\n\n\n\n不出所料，待解决的任务数量以及对机器学习专家的需求不断增长。与此同时，开发者和数据科学家为了解决机器学习问题而执行的常规操作数量日益增加。\n\
  \n同时，研究人员开发了特殊技术来节省时间并自动化最常见的机器学习任务。这些技术被分离到一个名为自动化机器学习（`AutoML`）的特殊领域。本书专注于自动化深度学习（`AutoDL`）领域，该领域研究深度学习问题的自动化。AutoDL\
  \ 考虑了创建和设计优化深度学习模型的问题。这种方法在近年来发展迅速，在某些情况下，它可以完全自动化典型任务的解决方案。\n\n本书介绍了如何使用 Microsoft\
  \ Neural Network Intelligence (**NNI**）实现 AutoDL 方法。`NNI` 是一个 Python 工具包，包含了最常用和先进的\
  \ AutoDL 方法：超参数优化**HPO**）、神经架构搜索（**NAS**）和模型压缩。`NNI` 支持最流行的深度学习框架。本书涵盖了使用 `PyTorch`\
  \ 和 `TensorFlow` 框架通过 `NNI` 实现各种 AutoDL 技术。\n\n\n\n\n\n\n\n\n\n本书探索了 AutoDL 方法的实际\
  \ `NNI` 应用，同时也描述了它们的理论。因此，对于想要理解各种 AutoDL 技术和算法原理的数据科学家来说，本书将非常有帮助。\n\n本书需要中等深度学习理解以及\
  \ `TensorFlow` 或 `PyTorch` 知识。\n\n## 代码列表\n\n本书有很多实用示例和代码列表。代码列表随本书的章节提供。你可以从以下\
  \ GitHub 仓库下载源码：`https://github.com/Apress/automated-deep-learning-using-neural-network-intelligence`\n\
  \n\n\n\n\nAutoML 起步很晚，但正在快速发展。机器学习可以分为浅层学习和深度学习。浅层学习包含了经典方法：随机森林、支持向量机、k-最近邻等。相比之下，深度学习研究的是基于卷积层、线性层、池化、分裂和合并连接等构建神经网络的构建。浅层学习和深度学习包含相似的自动机器学习技术，但它们的应用存在显著差异。因此，我们可以突出\
  \ AutoML 的一个独立领域，它专门处理深度学习——这一领域被称为自动深度学习（`AutoDL`）。自动深度学习主要包含四个部分：\n\n- 超参数优化（HPO`）\n\
  - 神经架构搜索（NAS`）\n- 特征工程\n- 模型压缩\n\n*图 1-1. AutoDL 划分*\n\n让我们继续讨论我们究竟为什么需要 AutoDL。\n\
  \n# 第 1 章 神经网络智能引论\n\n## 无免费午餐定理\n\n我想从以下基本陈述开始，即所谓的无免费午餐（`NFL`）定理。无免费午餐定理指出：当任何两个优化算法在所有可能的问题上的平均性能时，它们是等价的。\n\
  \n—大卫·沃尔珀特 (David Wolpert)\n\n让我们用更功能性的语言来阐述 NFL 定理。假设我们有一组数据集：`D1`, `D2`, `D3`,\
  \ ..., ..., 以及随机搜索算法 `R` 在每个数据集 `Di` 上的估计性能等于 `r`：\n\n```\nE(R; Di) = r, for any\
  \ I (1)\n```\n\n那么对于任何搜索算法 `A` 和任何一个估计值为 `r + q` 的数据集 `Di`，都存在一个估计值为 `r - q` 的数据集\
  \ `Dj`：\n\n```\nE(A; Di) = r + q, E(A; Dj) = r – q (2)\n```\n\n陈述 2 表示，如果算法 `A`\
  \ 在数据集 `Di` 上优于随机算法 `R`，那么存在数据集 `Dj`，使得算法 `A` 反于随机算法 `R`，且 `E(A; Di) + E(A; Dj)\
  \ = E(R; Di) + E(R; Dj)`。如果我们从特定的数据集和任务出发来单独考虑算法，这一事实使得所有算法都是等价的。例如，假设我们有一个算法 `A`，根据之前盒子的规则预测下一个盒子的颜色，规则列在表\
  \ 1-1 所示。\n\n*表 1-1. 盒子预测算法*\n\n| 前一个盒子 | 当前盒子 | 预测 | | |\n| :--- | :--- | :---\
  \ | :--- |\n| 1 | 黑色 | 黑色 | 白色 |\n| 2 | 黑色 | 白色 | 白色 |\n| 3 | 白色 | 黑色 | 黑色 |\n|\
  \ 4 | 白色 | 白色 | 黑色 |\n\n并且预测算法 `A` 在数据集 `D1` 上的工作准确率为 100%，在该数据集中，两个黑色盒子紧跟在两个白色盒子之后，两个白色盒子跟在两个黑色盒子之后，如图\
  \ 1-2 所示。\n\n*图 1-2. 预测算法 A 在数据集 D1 上的性能：100% 准确率* 但让我们观察算法 `A` 在数据集 `D2` 上的工作情况，在该数据集中，白色和黑色盒子一个接一个交替，如图\
  \ 1-3 所示。\n\n*图 1-3. 预测算法 A 在数据集 D2 上的性能：0% 准确率*\n\n图 1-3 表明算法 `A` 在数据集 `D2` 上的准确率为\
  \ 0%。这个例子说明了“对于所有数据集都没有最优算法”，且“对于所有情况都没有最优解”。那么 NFL 定理是如何影响深度学习的呢？\n\n每个深度学习模型和每个数据集都会生成一个需要被最小化的损失函数。如果我们有两个深度学习模型\
  \ `M1` 和 `M2`，那么这意味着它们只对某些类型的问题和某些类型的数据集显示良好的结果。你不能期望同一个深度学习模型在不同的数据集上有相似的表现，更不用说对于不同类型的问题。因此，如果你将模型\
  \ `M1` 和模型 `M2` 应用于数据集 `D1` 上的问题 `P1`，你可以预期模型 `M1` 在这种情况表现出良好的性能，而模型 `M2` 的表现很差。图\
  \ 1-4 说明了这一点。\n\n*图 1-4. 模型 M1 和 M2 在数据集 D1 上针对问题 P1 的性能*\n\n但如果将模型应用于不同的问题和不同的数据集，我们可能会得到相反的结果，如图\
  \ 1-5 所示。\n\n*图 1-5. 模型 M1 和 M2 在数据集 D2 上针对问题 P2 的性能*\n\n所以，NFL 定理告诉我们，我们不能期望一个模型在不同情况下都有同样出色的表现。问题描述的细微修改或数据集的变化都需要额外的模型优化来完成更新。这一事实使得\
  \ AutoDL 在准备有效的生产就绪解决方案时是不可替代的。值得提到的是，现实数据集的集合要远小于所有可能数据集的集合，这使得确定一类解决特定问题的最合适算法成为可能。尽管如此，NFL\
  \ 定理仍然成立，因为为所有类型选择最优算法是不可能的。\n\n## 向现有模型中注入新的深度学习技术\n\n假设我们有一个表现良好且结果满意的深度学习模型。后来，出现了一种新的深度学习技术，可以显著提高我们模型的性能。它可能是一个特殊的深度学习层、块、单元或一个新的激活函数。但我们不知道具体如何将该技术注入到模型架构中。这可以通过\
  \ AutoDL 完成，它可以在当前的深度学习模型设计中优化利用新技术。图 1-6 展示了这种方法。\n\n*图 1-6. 注入新的深度学习技术*\n\n##\
  \ 模型适应新数据集\n\n假设我们有一个解决纽约能源消耗预测的模型。该模型已经在历史数据集上进行了训练并运行良好。我们决定将该模型用于柏林的能源消耗预测。我们期望该模型在柏林的表现和在纽约一样。但另一个国家的人可能有不同的习惯和行为，这会影响原始模型捕捉模式的能力。因此，针对新的柏林历史数据集对原始模型进行定制是好的。图\
  \ 1-7 展示了如何使现有模型适应数据集，更新某些超参数，如卷积层滤波器、线性层特征等。\n\n*图 1-7. 模型适应新数据集*\n\n## 从零开始创建新模型\n\
  \n这是最令人兴奋的部分。假设我们有一个任务，但对于什么可以处理它的神经网络架构完全没有想法。我们可以从其他任务中借用一些想法，进行手动调查，研究数据集的统计特性等。\n\
  \n但目前，已经有了神经架构搜索（`NAS`）方法允许你从零开始构建生产就绪的神经网络，如图 1-8 所示。\n\n*图 1-8. 神经架构搜索*\n\n\n\n\
  \n我认为这是一个进一步研究和实际应用的极佳方向。人类已经开发了深度学习模型以及基于误差反向传播的训练方法。特定架构的神经网络可以揭示最复杂的依赖关系和模式。那么，为什么不更进一步，开发出神经网络设计算法，来为特定任务创建最优的神经网络架构呢？\n\
  \n## 重新发明轮子\n\n许多机器学习专家花费大量时间开发现有方法来解决前述描述的问题。自动机器学习（AutoML）技术可以节省数周甚至几个月的开发时间。当然，自动深度学习无法替代深度学习工程师，人类的经验和直觉仍然是如今所有发明的主要驱动力。但无论如何，AutoDL\
  \ 可以显著减少所需的自定义工作量。自动深度学习应该成为解决实际问题中的必备工具，从而节省大量时间。\n\n## 源代码工作\n\n本书展示了许多实际示例，并附带了可以从以下\
  \ GitHub 仓库下载的源代码。本书包含许多实际示例和代码列表。每一章的源代码列表与书中的每一章相对应。你可以从以下 GitHub 仓库下载源代码：\n\n\
  `https://github.com/Apress/automated-deep-learning-using-neural-network-intelligence`\n\
  \n书中的大部分列表都以源代码的形式呈现。书中所有的命令均相对于源代码文件夹的根目录运行。\n\n## Neural Network Intelligence\
  \ 安装\n\nNeural Network Intelligence（`NNI`）是一个强大的工具包，可以帮助用户解决 AutoML 问题。NNI 管理搜索过程、可视化结果并将\
  \ AutoML 任务分配到不同的机器学习平台。\n\n第 1 章 神经网络智能简介\n\n### 安装\n\nNNI 的最低系统要求为：Ubuntu 18.04；macOS\
  \ 11；Windows 10 21H2 以及 Python 3.7。\n\n可以通过以下方式简单安装 NNI：\n\n```bash\npip install\
  \ nni\n```\n\n我们在书中将使用 2.7 版本，因此我强烈建议安装 2.7 版本以避免版本差异：\n\n```bash\npip install nni==2.7\n\
  ```\n\n让我们通过执行“Hello World”场景来测试安装。运行以下命令（`ch1/install/hello_world/config.yml` 文件位于源代码中）：\n\
  \n```bash\nnnictl create --config ch1/install/hello_world/config.yml\n```\n\n如果安装成功，你应该看到以下输出：\n\
  \n```text\nINFO: Starting restful server...\nINFO: Successfully started Restful\
  \ server!\nINFO: Starting experiment...\nINFO: Successfully started experiment!\n\
  The experiment id is <EXPERIMENT_ID>\nThe Web UI urls are: http://127.0.0.1:8080\n\
  ```\n\n你可以在浏览器中访问链接 `http://127.0.0.1:8080`。图 1-9 展示了 NNI Web 用户界面，我们将在接下来的章节中介绍它。\n\
  \n如果一切正常，你可以在命令行中执行以下命令来停止 NNI：\n\n```bash\nnnictl stop\n```\n\n### Docker\n\n如果你在安装过程中遇到任何问题，可以使用为本书准备的\
  \ Docker 镜像。该 Dockerfile 基于官方 Docker 仓库中的 NNI Docker 镜像 `msranni/nni:v2.7`：`https://hub.docker.com/r/msranni/nni/tags`。\n\
  \n***Listing 1-1.*** 本书的 NNI Dockerfile。\n\n```dockerfile\nFROM msranni/nni:v2.7\n\
  RUN mkdir /book\nADD . /book\nEXPOSE 8080\nENTRYPOINT [\"tail\", \"-f\", \"/dev/null\"\
  ]\n```\n\n你可以按照以下方式构建镜像：\n\n```bash\ndocker build -t autodl_nni_book .\n```\n\n\
  `autodl_nni_book` 镜像包含了运行我们在书中将学习的所有实验所需的所有库和依赖。\n\n让我们使用 docker 运行上一节检查过的“Hello\
  \ World”场景。我们启动 docker 容器：\n\n```bash\ndocker run -t -d -p 8080:8080 autodl_nni_book\n\
  ```\n\n然后我们在 docker 容器中运行 NNI：\n\n```bash\ndocker exec <container_id> bash -c \"\
  nnictl create --config /book/ch1/install/hello_world/config.yml\"\n```\n\n之后，你可以在浏览器通过\
  \ `http://127.0.0.1:8080` 访问 NNI WebUI。本书的代码仓库位于 docker 镜像的 `/book` 目录。因此，在 `autodl_nni_book`\
  \ 镜像中，你可以执行如下命令：\n\n```bash\ndocker exec <container_id> bash -c \"nnictl create\"\
  \n```\n\n## 搜索空间、调优器和试验\n\n让我们快速了解一个概念。当我们优化模型时，`Search space`（搜索空间）定义了这组参数。尽管搜索空间包含有限数量的参数，但在大多数情况下，实际上无法测试搜索空间中的所有参数。因此，一个名为\
  \ `Tuner`（调优器）的特殊组件用于选择最合适且最有可能的参数。`Tuner` 从搜索空间中选择参数并将其传递给 `Trial`（试验）。`Trial`\
  \ 是一个使用 `Tuner` 传递的参数测试模型并返回指标的脚本。该搜索过程如图 1-10 所示。\n\n## 黑盒函数优化\n\n让我们通过优化黑盒函数来研究\
  \ NNI 的工作原理。黑盒函数是一个接收参数并返回值的函数，但我们不知道其内部机制。有时我们知道黑盒函数的作用，甚至知道它的公式。但该函数的性质非常复杂，分析研究非常有挑战性。当我们说需要优化黑盒函数时，意味着我们需要找到让黑盒函数输出最大值的输入参数。假设我们有一个黑盒函数，其定义如下：\n\
  \n***Listing 1-2.*** 黑盒函数。`ch1/bbf/black_box_function.py`\n\n```python\nfrom math\
  \ import sin, cos\n\ndef black_box_function(x, y, z):\n    \"\"\"\n    x in [1,\
  \ 100] integer\n    y in [1, 10] integer\n    z in [1, 10000] real\n    \"\"\"\n\
  \    if y % 2 == 0:\n        if x > 50:\n            r = (pow(x, sin(z)) - x) *\
  \ x / 2\n        else:\n            r = (pow(x, cos(z)) + x) * x\n    else:\n  \
  \      r = pow(y, 2 - sin(x) * cos(z))\n    return round(r / 100, 2)\n```\n\n\n\n\
  \n当然，Listing1-2 c 中提出的函数优化问题可以通过解析法求解，但让我们假设不知道该函数在黑盒内部是如何运行的。我们只知道该黑盒函数返回实值，并接收以下输入参数：\n\
  \n- `x` 从 1 到 100 的正整数\n- `y` 从 1 到 10 的正整数\n- `z` 从 1 到 10 000 的浮点数\n\n让我们通过定义搜索空间开始解决问题。搜索空间使用特殊指令以\
  \ JSON 格式进行定义。我们将使用以下 JSON 文件来定义搜索空间。\n\n***Listing 1-3.*** 搜索空间。`ch1/bbf/search_space.json`\n\
  \n```json\n{\n  \"x\": {\"_type\": \"quniform\", \"_value\": [1, 100, 1]},\n  \"\
  y\": {\"_type\": \"quniform\", \"_value\": [1, 10, 1]},\n  \"z\": {\"_type\": \"\
  quniform\", \"_value\": [1, 10000, 0.01]}\n}\n```\n\n`quniform` 指令创建一个从 `a` 到 `b`\
  \ 步长为 `s` 的值列表。因此，Listing 1-3 中定义的搜索空间可以表示如下：\n\n- `x` 属于 `[1, 2, 3, …, 99, 100]`\
  \ \n- `y` 属于 `[1, 2, 3, …, 9, 10]` \n- `z` 属于 `[1, 1.01, 1.02, …, 9 999.99, 10 000]`\
  \ \n\n**注意** 我们将在下一章详细探讨如何定义搜索空间。\n\n现在让我们进入试验（Trial）的定义。\n\n***Listing 1-4.***\
  \ 试验。`ch1/bbf/trial.py`\n\n```python\nimport os\nimport sys\nimport nni\n\n# 对于\
  \ NNI，用户定义模块使用相对导入\nSCRIPT_DIR = os.path.dirname(os.path.abspath(__file__)) + '/../..'\n\
  sys.path.append(SCRIPT_DIR)\nfrom ch1.bbf.black_box_function import black_box_function\n\
  \nif __name__ == '__main__':\n    # 调优器从搜索空间选择参数\n    p = nni.get_next_parameter()\n\
  \    x, y, z = p['x'], p['y'], p['z']\n    r = black_box_function(x, y, z)\n   \
  \ # 将结果返回 NNI\n    nni.report_final_result(r)\n```\n\n试验使用 `nni.get_next_parameter()`\
  \ 函数从 NNI 获取参数，并使用 `nni.report_final_result` 返回指标。试验获取 NNI 参数，将其传递给黑盒函数并返回结果。Listing\
  \ 1-4 需要由 NNI 服务器运行，因此如果你尝试运行它将会得到错误。\n\n**注意** 我们将在下一章详细探讨如何定义试验。\n\n我们最后要做的工作是定义实验配置，它将为黑盒函数寻找最佳输入参数。\n\
  \n***Listing 1-5.*** 实验配置。`ch1/bbf/config.yml`\n\n```yaml\ntrialConcurrency: 4\n\
  maxTrialNumber: 1000\nsearchSpaceFile: search_space.json\ntrialCodeDirectory: .\n\
  trialCommand: python3 trial.py\ntuner:\n  name: Evolution\n  classArgs:\n    optimize_mode:\
  \ maximize\ntrainingService:\n  platform: local\n```\n\n我们在 Listing1-5 h 中定义的实验具有以下属性：\n\
  \n- 用于执行试验的四线程池。\n- 最大试验次数为 1000。\n- 搜索空间定义在 `search_space.json` 中。\n- 通过运行 `python3\
  \ trial.py` 执行试验。\n- NNI 将使用遗传算法。\n\n**注意** 我们将详细探讨如何定义实验。现在一切已准备就绪，寻找黑盒函数的输入参数。让我们运行\
  \ NNI：`nni create --config ch1/bbf/config.yml`。\n\n完成实验后，你可以在 Web 面板上监控该过程：[`127.0.0.1:8080`](http://127.0.0.1:8080)。通常情况下，测试深度学习模型需要几分钟，而执行时间比预期的长。如果你想缩短时间，可以修改\
  \ `config.yml` 中的 `maxTrialNumber` 参数。\n\n根据我们在这里获得的信息，我们可以从超参数面板中获得很多见解。对于所有前 5%\
  \ 的试验，以下情况成立：\n\n- x 是小于 51 的整数，即 50, 49, 48。\n- y 是偶数。\n- z 可能不会显著影响黑盒的返回值，或者可能需要进一步研究。\n\
  \n\n\n\n\n```python\nfor _ in range(100):\n    x = random.choice([50, 49, 48])\n\
  \    y = random.choice([2, 4, 6, 8, 10])\n    z = round(random.uniform(1, 10000),\
  \ 2)\n    r = black_box_function(x, y, z)\n    if r > max_:\n        max_ = r\n\
  \        best_trial = f'(x={x}, y={y}, z={z}) -> {r}'\n    print(best_trial)\n```\n\
  \n# 第 1 章 神经网络智能简介\n\n![](img/index-36_1.png)\n\n列表 1-6 返回 (x = 50, y = 2, z = 4756.58)\
