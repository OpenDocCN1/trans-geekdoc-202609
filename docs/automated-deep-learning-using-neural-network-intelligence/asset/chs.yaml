  \ LeNet 模型。我们将其称为 `LeNet Evolution` 模型。\n\n***图 2-18.** 人类 vs 马数据集*\n\n让我们再次观察 LeNet\
  \ 模型架构。LeNet 模型设计可以分为两个部分：`特征提取`和`决策制定`。事实上，卷积栈 `Conv2D` -> `Activation` -> `MaxPoolD`\
  \ -> `Conv2D` -> `Activation` -> `MaxPoolD` -> `Flatten` 负责提取图像模式，即特征提取。同时，全连接栈\
  \ `Linear` -> `Activation` -> `Linear` -> `SoftMax` 负责选择特定模式来分类对象。图 2-19 sho 显示了每个组件的责任区域。\n\
  \n86\n\n![](img/index-100_1.png)\n\n***图 2-19.** 特征提取和决策组件*\n\n由于人类和马的图像更复杂，我们需要让特征提取组件更加精密。通常有两种层序列负责提取图像：`Conv2D`\
  \ -> `Activation` -> `MaxPoolD` 和 `Conv2D` -> `Activation`。我们可以构建实验，注入不同的特征提取序列，以寻找解决“人类和马”分类问题的最佳模型设计。接下来，我们定义了三种特征提取层，将\
  \ `none` 定义为空序列：\n\n* `simple`: `Conv2D` -> `Activation`\n* `with_pool`: `Conv2D`\
  \ -> `Activation` -> `MaxPoolD`\n* `none`: `Identity`\n\n每个特征提取序列将具有额外的超参数：`filters`,\
  \ `kernel`, `pool_size`。让 LeNet 模型拥有三个提取槽位。这些槽位可以用以下特征提取序列填充。例如，LeNet 模型可以填充序列：\n\
  \n* `with_pool`: `Conv2D(kernel_size=5, filters=16)` -> `Activation` -> `MaxPoolD(pool_size=3)`\n\
  * `none`: `Identity`\n* `simple`: `Conv2D(kernel_size=3, filters=8)` -> `Activation`\n\
  \n最后，LeNet Evolution 特征提取组件看起来像如下：`Conv2D(kernel_size=5, filters=16)` -> `Activation`\
  \ -> `MaxPoolD(pool_size=3)`。我们将特征提取序列视为 LeNet Evolution 模型的构建块，如图 2-20 所示。\n\n\
  88\n\n![](img/index-102_1.png)\n\n***图 2-20.** LeNet Evolution 特征提取组件*\n\n因此我们可以定义\
