  \ <experiment_id>`：输出关于实验的信息。\n- `nnictl top`：输出最佳试验。\n\n有关关于 NNI 命令行工具的更多信息，请参阅\
  \ `nnictl --help`。\n\n## NNI 实验配置\n\n正如我们之前看到的，实验的执行是通过 YAML 文件（`ch1/bbf/config.yml`）配置的。NNI\
  \ 允许灵活地配置实验执行。\n\n表 1-2 列出了主要的配置参数。\n\n***表 1-2.** NNI 实验配置设置*\n\n| 字段 (Field) |\
  \ 类型 (Type) | 描述 (Description) |\n| :--- | :--- | :--- |\n| `experimentName` | str\
  \ | 实验名称（可选） |\n| `searchSpaceFile` | str | 包含搜索空间的 JSon 文件路径（可选） |\n| `definition`\
  \ | YAML | 内联搜索空间定义字段（可选） |\n\n例如，在 `ch1/bbf/search_space.json` 中定义的搜索空间可以设置在 `searchSpace`\
  \ 中：\n\n```yaml\nsearchSpace:\n  x:\n    type: categorical\n    choices: [50, 49,\
  \ 48]\n  y:\n    type: categorical\n    choices: [2, 4, 6, 8, 10]\n  z:\n    type:\
  \ uniform\n    min: 1\n    max: 10000\n    precision: 2\n```\n\n- `trialCommand`：执行试验的命令。\n\
  - `trialCodeDirectory`：试验代码所在的目录路径。\n- `trialConcurrency`：并发运行的试验数量。\n- `maxExperimentDuration`：实验的最大持续时间。\n\
