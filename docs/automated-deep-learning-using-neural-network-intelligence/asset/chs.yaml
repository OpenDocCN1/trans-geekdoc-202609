  \ `mask` 参数，所有候选方案都相加：\n`x = 1*conv1_1(x) + 1*conv1_3(x) + 1*conv1_5(x)`\n`x = 1*conv2_1(x)\
  \ + 1*conv2_3(x) + 1*conv2_5(x)`\n\n但在评估模式下，我们传递 `mask` 参数并激活特定层：`x = 0*conv1_1(x)\
  \ + 1*conv1_3(x) + 0*conv1_5(x)`\n`x = 0*conv2_1(x) + 0*conv2_3(x) + 1*conv2_5(x)`：\n\
  \n```python\n    def forward(self, x, mask=None):\n        # 训练模式下全部加\n        if\
  \ mask is None:\n            mask = [[1, 1, 1], [1, 1, 1]]\n        x = mask[0][0]*self.conv1_1(x)\
  \ + mask[0][1]*self.conv1_3(x) + mask[0][2]*self.conv1_5(x)\n        x = torch.relu(x)\n\
  \        x = F.max_pool2d(x, 2)\n        x = mask[1][0]*self.conv2_1(x) + mask[1][1]*self.conv2_3(x)\
