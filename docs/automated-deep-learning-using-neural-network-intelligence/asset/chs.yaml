  \n\n\n该领域于 2018 年作为一门独立的学科成型。自那时，它在自动化构建解决特定问题的神经网络架构方面取得了重大突破。大多数手动设计的神经网络可能很快就会被自动化架构搜索取代，因此这一领域对所有数据科学家来说都是非常有前景的。`NAS`\
  \ 产了许多顶级的计算机视觉架构。如 `NASNet`、`EfficientNet` 和 `MobileNet` 等架构都是自动神经架构搜索的结果。\n\nNAS\
  \ 有两种类型：`Multi-trial`（多次试验）和 `One-shot`（单次）。在 `Multi-trial NAS` 中，模型评估器会评估每个采样模型的性能，`Exploration\
  \ Strategy`（探索策略）从定义的 `Model Space`（模型空间）采样模型；而 `One-shot NAS` 则尝试寻找最优的神经架构训练，并探索源自\
  \ `Model Space` 的一个 `Supernet`（超网络）。\n\n本章专门介绍 `Multi-trial NAS`。\n\n本章分为两个部分：`使用\
  \ Retiarii 进行神经架构搜索 (PyTorch)` 和 `经典神经架构搜索 (TensorFlow)`。`Retiarii` 是一个由 NNI 专家开发的深度学习框架，支持在神经网络\
  \ `Model Space` 上进行探索性训练。`Retiarii` 是一种优势方法，允许对 `NAS` 进行结构化和规划。遗憾的是，NNI `2.7` 版本（本书使用的版本）仅为\
  \ `PyTorch` 框架实现了 `Retiarii` 方法。在本章中，不关注 `TensorFlow` 框架是不公平的，使用 `NNI` 进行 `NAS`\
  \ 的经典方法将在 `经典神经架构搜索 (TensorFlow)` 部分中进行考虑。无论如何，`NNI` 都支持 `TensorFlow` 的 `One-shot\
  \ NAS`，我们将在下一节中进行探索。因此，`TensorFlow` 用户将能够充分利用 `NAS` 方法。\n\n## 作为数据流图的神经架构\n\n我们将从定义\
  \ `NAS` 如何感知神经网络架构开始。神经架构被视为 `Data Flow Graph (DFG)`（数据流图）。`DFG` 是节点及其之间连接的集合。`DFG`\
  \ 显示了数据从一个节点到另一个节点的传输。每个节点都有自己的类型和参数。图 4-1 展示了 `DFG` 的示例。\n\n***图 4-1.** 数据流图*\n\
  \n在图 4-1 中，我们看到了 `DFG`，它包含带有参数的不同类型的节点。每个神经网络的架构都可以表示为 `Data Flow Graph`。事实上，在图\
  \ 4-1 中，我们可以矩形节点替换为带有参数的卷积层：`padding`、`stride`、`filter_size` 等。`Neural Architecture\
  \ Search Explorers` 并不了解每个 `DFG` 节点的本质。主要任务是从各种深度学习层构建一个 `DFG`，形成神经网络的架构，并以最佳方式解决特定问题。\n\
  \n## 使用 Retiarii 进行神经架构搜索 (PyTorch)\n\n`Retiarii` 是由 `NNI` 专家开发的框架，它是第一个支持深度学习探索性训练的框架。探索性训练意味着不同深度神经网络\
  \ (`DNNs`) 的训练结果是共享的。这种方法比较不同模型的训练情况，执行优化，并停止中间结果不佳的模型。此外，`Retiarii` 提供了一个新接口来指定用于探索的深度学习\
  \ `Model Space`，以及一个描述 `Exploration Strategy` 的接口，该策略决定实例化和训练模型的顺序、优先训练某些模型并停止某些模型的训练。\n\
  \n`Retiarii` 识别实例化模型之间的相关性，并开发了一系列跨模型优化以改进整个探索性训练过程。你可以在以下文章阅读更多关于 `Retiarii` 框架的信息：`www.usenix.org/system/files/osdi20-zhang_quanlu.pdf`。`NNI`\
  \ 版本 `2.7` 只有 PyTorch 的 Retiarii 框架实现。在后续的 `NNI` 发布中，将添加 TensorFlow 的实现。请参考官方文档：`https://nni.readthedocs.io/en/v.7/`。\n\
  \n## 使用 Retiarii 进行 NAS 介绍\n\n使用 `Retiarii` 学习 `NAS` 的最佳方法是查看寻找简单的 `Model Space`。我们不会深入研究神经网络，而是关注简单的算术问题。假设我们有一个链\
  \ `F`，它执行以下操作：\n\n```\nx = 1\nx = x * 2\nx = x * 4\nx = sigmoid(x)\nx = tanh(x)\n\
  x = relu(x)\n```\n\n该问题的 `Model Space` 可以如图 4-2 所示。\n\n***图 4-2.** 数据流图*\n\n## 列表\
  \ 4-1. 模型空间\n\n```python\nimport os\nimport torch\nimport nni\nimport nni.retiarii.pytorch\
  \ as nn\nfrom nni.retiarii import model_wrapper\n\n@model_wrapper\nclass DummyModel(nn.Module):\n\
  \    def __init__(self):\n        super().__init__()\n        # operator 1\n   \
  \     self.op1 = nn.LayerChoice([\n            nn.Tanh(),\n            nn.Sigmoid(),\n\
  \            nn.ReLU()\n        ])\n        # addition\n        self.add = nn.ValueChoice([0,\
  \ 1, 2])\n        # operator 2\n        self.op2 = nn.LayerChoice([\n          \
  \  nn.Tanh(),\n            nn.Sigmoid(),\n            nn.ReLU()\n        ])\n\n\
  \    def forward(self, x):\n        x = self.op1(x)\n        x = x * 2\n       \
  \ x += self.add\n        x = x * 4\n        x = self.op2(x)\n        return x\n\
  ```\n\n之后，我们定义了 `evaluate` 方法，它返回模型结果。NNI 中的 `NAS` 框架：\n\n```python\ndef evaluate(model_cls):\n\
  \    Evaluating the model:\n    model = model_cls()\n    x = torch.Tensor([1])\n\
  \    y = model(x)\n    return y\n```\n\n这段代码用于模型架构可视化。我们稍后会回到这种技术。\n\n```python\n\
  onnx_dir = os.path.abspath(os.environ.get('NNI_OUTPUT_DIR', '.'))\n```\n\n\n\n\n\
  ```python\nos.makedirs(onnx_dir, exist_ok = True)\n```\n\n```python\ntorch.onnx.export(model,\
  \ x, onnx_dir + '/model.onnx')\n```\n\n返回结果：\n\n```\nnni.report_final_result(y.item())\n\
  ```\n\n一旦我们定义了 `Model Space`（模型空间）及其实例 `Evaluation`（评估器），就可以可以使用列表 4-2](#index_split_001.html#p204)\
  \ 所示的代码启动实验了。\n\n导入必要的模块：\n\n***Listing 4-2.*** Retiarii 实验。`ch4/retiarii/intro/run_experiment.py`\n\
  ```python\nfrom time import sleep\n\nfrom nni.retiarii.evaluator import FunctionalEvaluator\n\
  \nfrom nni.retiarii.experiment.pytorch import RetiariiExperiment, RetiariiExeConfig\n\
  import nni.retiarii.strategy as strategy\n\nfrom ch4.retiarii.intro.dummy_model\
  \ import DummyModel, evaluate\n```\n\n191\n\n## 第 4 章 多轮神经架构搜索\n\n启动 Retiarii 实验主要有七个步骤：\n\
