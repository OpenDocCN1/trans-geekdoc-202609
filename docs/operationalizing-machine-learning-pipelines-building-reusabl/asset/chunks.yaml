    \ are a few of the insights which the data scientist can utilize while formulating\
    \ the hypothesis.\n\n## Boxplot\n\nBoxplots are another way to explore the numeric\
    \ data. The histogram shows the spread of the data based on the mean or average\
    \ at its center, while a boxplot takes the median at its center. It divides the\
    \ data in two, based on the quartile range. Figure 4.5 highlights the boxplot\
    \ on the `Temperature` column, as shown as follows:\n\n![](image-qe09ttuo.jpg)\
    \ \nFigure 4.5: Boxplot\n\nThe values below `q1` are the bottom 25% values and\
    \ the value above `q3` are the top 25% values. The values between `q3` and `q1`\
