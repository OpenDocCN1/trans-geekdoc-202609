    \ Figure 1.2: Prioritizing business problems    The first step is to have a clear\
    \ business problem, know what sort of outcomes will solve it, and if solved, what\
    \ value will it generate; all this should be jotted down across the organization.\
    \ This exercise might be time-consuming but is very important. It will not only\
    \ enable the organization in the short term, but also help with a long-term vision\
    \ of building the data assets. Even if the list of business problems is too long,\
    \ it is not an issue. However, it would be a good idea to take the top five or\
    \ ten out of the list.    Once the problem statement is finalized, the next step\
    \ is to analyze the data that is available to the organizations in-house and any\
    \ additional data that they need to acquire from outside the organization. The\
    \ cost of acquiring the data should also be taken into consideration. Unlike the\
    \ business problem, this step is a collaborative exercise. The business and data\
