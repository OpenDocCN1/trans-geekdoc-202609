    # 评估与监控


    对部署的机器学习模型进行持续评估并监控其性能是否出现剧烈下降是一个重要的步骤。这让决策者有信心认为，基于机器学习模型的任何决策都是可靠的，因为它们经过了定期验证。评估和监控并不直接贡献于业务用例，但它们是机器学习生命周期中为终端提供的审计和建立信任的基石。


    对模型进行持续评估取决于建模技术以及在部署时用于确定性能的 KPI。相同的 KPI 将会成为评估的一部分。对于监控目的，有多种方法可以实现这一过程。可以通过自动化邮件、使用
    `CI/CD` 中的工具或通过报告工具来实现。其核心思想是使用新数据定期更新模型性能，并将其发布给终端用户。


    ## 案例


    举例来说，假设你解决了一个二分类问题，即判断访问商店的人是否会购买汽车。在创建机器学习模型时，假设我们决定使用 `AUC` 和 `Recall`（召回率）作为确定模型标准的
    KPI。


    我们需要检查的另一个重要点是访问商店的人中有百分之几转化成了客户。我们可以选取多个时间段并发现任何趋势。其核心思想是获得一个范围估计，例如，访问商店的总人数中有
    10-15% 转化成了客户。


    现在，有了这些数据，一旦模型部署且结果被消耗，我们需要定义一个流程，按照预定义的频率将模型对历史评分的数据与实际结果进行比较。下一步是计算相同的 KPI（即
    `AUC` 和 `Recall`），通过比较当前性能与部署时的性能来衡量表现。另一个需要检查的重要步骤是商店访客转化为客户的百分比。这将让我们总体了解目标群体行为是否发生了任何变化。如果此信息与历史偏差和定义的截断值一致，则该模型是可以接受的；否则，我们需要重新训练机器学习模型。


    ## 模型衰减


    模型衰减由于多种原因引起，而且业务端并不总是能及时识别这些变化。由于这个原因，持续评估和监控变得非常重要。通常被认为是好事的因素，可能会对某人的业务产生非常负面的影响，反之亦然。


    举个例子，假设你卖汽车，你的汽车满足低端财务市场客户的需求。现在，如果国家经济繁荣，这是一件好事，但客户可能会想要购买更昂贵且提供额外福利的汽车。除非不断进化，这将对你的业务产生负面影响。这正是人们通过数据寻找的信息，但它并不是一项一次性的工作。它需要持续进行以掌握局面，而且人们需要理解数据是由过程生成的，而该过程会随着时间的推移而改变。及时识别过程中的任何变化是持续评估和监控的目标。


    ## 引入 MLOps


    基于持续评估和监控的反馈循环，下一步可能是使用新数据重新训练模型，或者完全用新的模型和用例替换旧的。如果需要使用新数据重新训练，我们不希望从头开始重复整个过程，而是希望利用第一次解决该问题时所积累的经验和流程。


    此外，我们希望随时间跟踪解决用例过程中所做的所有更改，包括数据。这就是 `MLOps` 登场的地方。`MLOps` 由实践和工具组成，有助于模型从训练无缝迁移到消费。它还包含了持续监控机器学习模型的规定，并维护数据、代码和产物的版本，以供审计和未来分析之用。我们将在下一节中详细讨论
    `MLOps`。


    '
