- raw: "  Monitoring    Monitoring the ML model is the final step in the ML pipeline,\
    \ and it can be automated up to a certain extent only at times or can be looked\
    \ into manually after a certain period of time, intermittently. Almost all the\
    \ models decay over time due to a change in the processes. It becomes important\
    \ to update the model before these changes lead to wrong inference by the ML model.\
    \ For monitoring purpose, we can check the model performance at a particular frequency\
    \ with the actual data. For example, while training a binary classification problem,\
    \ we finalized a model and deployed it in production with an AUC of 0.75 and an\
    \ Accuracy of ninety percent. Now, once the model is in production, depending\
    \ on the frequency at which the new data is scored, we can go back one or two\
    \ time periods to check the performance of the model on the new dataset, and know\
    \ whether it is within an acceptable limit. This is not possible in every case,\
    \ but something of this type should be provisioned for every model that moves\
    \ to production. The challenge is that we consume the output to make the decisions\
    \ and they have an impact on reality; for example, to avoid a potential customer\
    \ churn, we send them some offer, which will make the customer stay. The model\
    \ would have predicted it as a churn case, but due to the action taken, we will\
    \ never see that in reality. Any monitoring on the model performance should also\
    \ consider these aspects.    Although the preceding example is one way to monitor\
    \ the model, it is more reactive in nature, due to which, we will get to know\
    \ of any performance decay at least one cycle later than reality. The other way\
    \ to monitor proactively is via the new data coming. The data can be compared\
    \ with the data on which the model was trained to see if they come from the same\
    \ distribution. There are multiple statistical tests for accomplishing the same,\
    \ depending on the type of variable we deal with. If the variables are continuous,\
    \ we can go for the KS nonparametric test, and for the categorical variable, we\
    \ can go for Chi-Square (Test of Independence), and Spearman rank correlation\
    \ for the ordinal variables. We will show one example using Evidently in the code\
    \ shared in the reference. The output generated by Evidently can be automated\
    \ to a customized dashboard or HTML, or a Jupyter notebook report can be directly\
    \ analyzed. We will show the Jupyter notebook as an example in our Git repo. \
    \ \n\n  Conclusion    In this chapter, we covered the steps in details to create\
    \ the ML pipeline and implement MLOps as a practice. In the process of doing so,\
    \ we shared the codes and utilized the open-source tools to implement those processes.\
    \ It is important to note that the tools might change and evolve over time, but\
    \ the process will remain the same. Most of the tools that we used like Feast\
    \ or KServe, are still in beta or a new version is coming out almost every month.\
    \ There might be better open-source tools in the future, or you can get a paid\
    \ subscription for the tools as per your needs; however, the MLOps process will\
    \ remain the same. You can develop the customized tool sets as per your needs\
    \ if the bandwidth and resources are available.    Broadly speaking, you want\
    \ to capture all the artifacts that enable reproducibility and help you in explaining\
    \ any decay or deviation in the model performance. You also want to capture these\
    \ performance decays as quickly as possible to avoid incurring any financial or\
    \ business value loss. This is all that we wanted to cover in the book. The most\
    \ important thing as a Data Science or an ML practitioner is that you don’t need\
    \ to know everything in detail, but you should understand when and whom to ask\
    \ for help and what all needs to be done to implement the MLOps practice. Also,\
    \ a lot of steps will only happen if the previous steps show a promising result\
    \ in the ML lifecycle.  \n\n  Points to remember     MLOps is a practice to enable\
    \ reproducibility, reliability, and efficiency of the ML pipeline.    Detailed\
    \ MLOps implementation varies on use case basis.    There might be additional\
    \ tools required for the ML needs like annotation and so on, depending on the\
    \ use case at hand.  \n\n  Multiple choice questions     Which step of the ML\
    \ lifecycle is not part of MLOps?     EDA    Training    Deployment    Testing\
    \    What is the role of the CI tool in MLOps?     Validating model    Automating\
    \ process    Training model    None of the above    You cannot enable MLOps without\
    \ Polyaxon and Feast.     True    False  \n\n  Answers     a    b    b  \n\n \
    \ References     GitHub code \\- https://github.com/MLBook-VJ/chapter-9  "
  fmt: "\n# Monitoring\n\nMonitoring the ML model is the final step in the ML pipeline,\
    \ and it can be automated up to a certain extent only at times or can be looked\
    \ into manually after a certain period of time, intermittently. Almost all the\
    \ models decay over time due to a change in the processes. It becomes important\
    \ to update the model before these changes lead to wrong inference by the ML model.\
    \ For monitoring purpose, we can check the model performance at a particular frequency\
    \ with the actual data. For example, while training a binary classification problem,\
    \ we finalized a model and deployed it in production with an `AUC` of `0.75` and\
    \ an `Accuracy` of ninety percent. Now, once the model is in production, depending\
    \ on the frequency at which the new data is scored, we can go back one or two\
    \ time periods to check the performance of the model on the new dataset, and know\
    \ whether it is within an acceptable limit. This is not possible in every case,\
    \ but something of this type should be provisioned for every model that moves\
    \ to production.\n\nThe challenge is that we consume the output to make the decisions\
    \ and they have an impact on reality; for example, to avoid a potential customer\
    \ churn, we send them some offer, which will make the customer stay. The model\
    \ would have predicted it as a churn case, but due to the action taken, we will\
    \ never see that in reality. Any monitoring on the model performance should also\
    \ consider these aspects.\n\nAlthough the preceding example is one way to monitor\
    \ the model, it is more reactive in nature, due to which, we will get to know\
    \ of any performance decay at least one cycle later than reality. The other way\
    \ to monitor proactively is via the new data coming. The data can be compared\
    \ with the data on which the model was trained to see if they come from the same\
    \ distribution. There are multiple statistical tests for accomplishing the same,\
    \ depending on the type of variable we deal with. If the variables are continuous,\
    \ we can go for the `KS` nonparametric test, and for the categorical variable,\
    \ we can go for `Chi-Square` (Test of Independence), and `Spearman rank correlation`\
    \ for the ordinal variables. We will show one example using `Evidently` in the\
    \ code shared in the reference. The output generated by `Evidently` can be automated\
    \ to a customized dashboard or HTML, or a Jupyter notebook report can be directly\
    \ analyzed. We will show the Jupyter notebook as an example in our `Git` repo.\n\
    \n# Conclusion\n\nIn this chapter, we covered the steps in details to create the\
    \ ML pipeline and implement MLOps as a practice. In the process of doing so, we\
    \ shared the codes and utilized the open-source tools to implement those processes.\
    \ It is important to note that the tools might change and evolve over time, but\
    \ the process will remain the same. Most of the tools that we used like `Feast`\
    \ or `KServe`, are still in beta or a new version is coming out almost every month.\
    \ There might be better open-source tools in the future, or you can get a paid\
    \ subscription for the tools as per your needs; however, the MLOps process will\
    \ remain the same. You can develop the customized tool sets as per your needs\
    \ if the bandwidth and resources are available.\n\nBroadly speaking, you want\
    \ to capture all the artifacts that enable reproducibility and help you in explaining\
    \ any decay or deviation in the model performance. You also want to capture these\
    \ performance decays as quickly as possible to avoid incurring any financial or\
    \ business value loss. This is all that we wanted to cover in the book. The most\
    \ important thing as a Data Science or an ML practitioner is that you don’t need\
    \ to know everything in detail, but you should understand when and whom to ask\
    \ for help and what all needs to be done to implement the MLOps practice. Also,\
    \ a lot of steps will only happen if the previous steps show a promising result\
    \ in the ML lifecycle.\n\n# Points to remember\n\n- MLOps is a practice to enable\
    \ reproducibility, reliability, and efficiency of the ML pipeline.\n- Detailed\
    \ MLOps implementation varies on use case basis.\n- There might be additional\
    \ tools required for the ML needs like annotation and so on, depending on the\
    \ use case hand.\n\n# Multiple choice questions\n\n1. Which step of the ML lifecycle\
    \ is not part of MLOps?\n   - `EDA`\n   - `Training`\n   - `Deployment`\n   -\
    \ `Testing`\n\n2. What is the role of the `CI` tool in MLOps?\n   - `Validating\
    \ model`\n   - `Automating process`\n   - `Training model`\n   - `None of the\
    \ above`\n\n3. You cannot enable MLOps without `Polyaxon` and `Feast`.\n   - `True`\n\
    \   - `False`\n\n# Answers\n\n- `a`\n- `b`\n- `b`\n\n# References\n\n- `GitHub`\
    \ code: `https://github.com/MLBook-VJ/chapter-9`\n"
  trans: "\n\n# 监控\n\n监控机器学习（ML）模型是机器学习流水线的最后一步，它在一定程度上可以实现自动化，也可以在一段时间后周期性地进行手动检查。由于流程的变化，几乎所有模型随着随着推移而衰减。在这些变化导致模型产生错误推理之前，更新模型变得至关重要。为了监控，我们可以按照特定的频率使用实际数据检查模型性能。例如，在训练一个二分类问题时，我们确定了一个模型并将其部署到环境中，其\
    \ `AUC` 为 `0.75`，`Accuracy` 为百分之九十。现在，一旦模型进入生产环境，根据新数据评分的频率，我们可以回溯一个或两个时间周期，检查模型在新数据集上的性能，并了解其是否在接受范围内。这在任何情况下都是不可可能的，但对于每个迁移到生产环境的模型，都应该配备此类机制。\n\
    \n挑战在于，我们根据输出做出决策，而这些决策会对现实产生影响；例如，为了避免潜在的客户流失，我们向他们发送了一些优惠，这将使客户留下。模型本会预测这是一个流失案例，但由于所采取的行动，我们在现实中永远不会看到这种情况。对模型性能的任何监控也应考虑这些因素。\n\
    \n虽然前面的示例是监控模型的一种方法，但它本质上更具反应性，因此我们至少会比现实晚一个周期才发现任何性能衰减。另一种主动监控的方法是通过进入的新数据。可以将这些数据与训练模型时的数据进行比较，以查看它们是否来自相同的分布。有多种统计测试可以实现此目标，取决于我们处理的变量类型。如果变量是连续的，我们可以采用\
    \ `KS` 非参数检验；对于分类变量，我们可以采用 `Chi-Square`（独立性检验）；对于有序变量，可以使用 `Spearman rank correlation`。我们将在参考共享的代码中展示一个使用\
    \ `Evidently` 的示例。`Evidently` 生成的输出可以自动化到自定义的仪表板或 HTML 中，也可以直接分析 Jupyter notebook\
    \ 报告。我们将在 `Git` 仓库中提供 Jupyter notebook 作为示例。\n\n# 结论\n\n在本章中，我们详细介绍了创建机器学习流水线以及将\
    \ MLOps 作为一种实践进行实施的步骤。在此过程中，我们分享了代码并利用开源工具来实现这些过程。需要注意的是，工具可能会随着时间的推移而变化和演变，但过程将保持不变。我们使用的大多数工具（如\
    \ `Feast` 或 `KServe`）仍处于测试阶段，或者几乎每月都会出一个新版本。未来可能会更好的开源工具，或者你可以根据需要获取工具的付费订阅；然而，MLOps\
    \ 的过程将保持不变。如果带宽和资源允许，你可以根据需求开发定制的工具集。\n\n广而言之，你想捕获所有能够复现并帮助你解释模型性能任何衰减或偏离的制品。你还希望尽快捕获这些性能衰减，以避免任何财务或业务价值的损失。这就是我们在书中想要涵盖的所有。作为数据科学家或机器学习从业人员，最重要的是你不需要了解所有的细节，但你应该理解何时向谁寻求帮助，以及为了实施\
    \ MLOps 实践需要完成什么。此外，只有当机器学习生命中的之前的步骤显示前景时，许多步骤才会执行。\n\n# 注意事项\n\n- MLOps 是一种实现机器学习流水线的可复现性、可靠性和效率的实践。\n\
    - 详细的 MLOps 实现根据用例而异。\n- 根据用例需求，可能需要额外的机器学习工具，如标注等。\n\n# 单选题\n\n1. 机器学习生命周期中的哪一步不属于\
    \ MLOps？\n   - `EDA`\n   - `Training`\n   - `Deployment`\n   - `Testing`\n\n2.\
    \ `CI` 工具在 MLOps 中的作用是什么？\n   - `验证模型`\n   - `自动化流程`\n   - `训练模型`\n   - 以上均非\n\
    \n3. 没有 `Polyaxon` 和 `Feast` 就无法启用 MLOps。\n   - `正确`\n   - `错误`\n\n# 答案\n\n- `a`\n\
