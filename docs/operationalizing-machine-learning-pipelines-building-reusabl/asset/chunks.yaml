    \ earlier. To create a data source in feast, we will use the following code: \
    \   \\# Cust Connection Details  cust\\_conn\\_details\\_source \\= BigQuerySource(\
    \  \\# The BigQuery table where features can be found  table\\_ref=\"project\\\
    _name.dataset.cust\\_conn\\_det\",  \\# The event timestamp is used for point-in-time\
