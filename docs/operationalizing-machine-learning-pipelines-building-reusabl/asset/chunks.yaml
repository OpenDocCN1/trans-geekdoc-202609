    ## MSE 和 RMSE

    均方误差（Mean Squared Error，MSE）也是最常用的指标。它也是最小二乘回归问题中的损失函数。误差（实际值减去预测值）被平方后加到 `MSE`
    中。这样做的好处是它可以放大较大的误差。计算 `MSE` 的公式如下：

    ![](img/image-fibh8593.jpg)

    变量定义与 `MAE` 相同。`MSE` 的单位是平方单位；例如，如果我们正在预测以美元为单位的房价，那么 `MSE` 的单位就是美元平方。这可能并不直观，因此使用了均方根误差（Root
    Mean Squared Error，RMSE），它是 `MSE` 的平方根。


    ## RSquare (R 平方)

    RSquare 的计算方法是 ML 模型捕捉到的方差比例。方差是数值围绕平均值的离散程度。要计算它，我们需要计算围绕平均值的方差和围绕预测值的方差。两者的公式分别如下：

    ![](img/image-xaf9p2pf.jpg)

    围绕平均值的方差

    围绕预测值的方差

    `µ`: 因变量的均值或平均值

    所有其他变量与 `MAE` 中相同。模型方差除以围绕平均值的方差得到模型未解释的方差。从 1 中减去该值得到模型解释的方差量，因此，R² 的公式如下：

    ![](img/image-ylbqzn78.jpg)

    通常情况下，R² 的值在 0 到 1 之间，以均值作为基准模型。如果模型的表现低于数值平均值，我们会得到负值。


    ## 预测值与实际值对比图

    预测与实际值的对比图是可视化模型性能的一种方式，如图 7.1 所示：

    ![](img/image-9ajkishm.jpg)

    图 7.1：预测值与实际值

    预测与实际对比图是可视化回归模型性能的另一种方法。


    ## 分类指标

    到为止，我们讨论了回归指标和 KPI，这是监督学习的一种类型。另一类监督学习是分类，我们将详细讨论衡量这些模型性能的 KPI。在进入指标本身之前，我们需要理解混淆矩阵，它使我们能够计算这些
    KPI 或指标。


    ### 混淆矩阵

    混淆矩阵是一种表格结构或二维矩阵。在一个轴上绘制实际值，在另一个轴上绘制预测值。在图中，水平轴是预测值，垂直轴是真实值或实际值，所示：

    ![](img/image-6ck7flp7.jpg)

    图 7.2：混淆矩阵

    混淆矩阵用于二分类；然而，该概念可以扩展到多分类。在这种情况下，0 和 1 是感兴趣的标记或类别；例如，客户是否流失，或者某人是否会购买（用是或否的标记表示）。在客户流失的情况下，客户流失的记录被视为正例，未流失的被视为负例。


    以下术语与混淆矩阵相关：

    - **真正例 (True Positives)**：这些是我们预测为正类且该案例确实属于正类的情况。

    - **真负例 (True Negatives)**：这些是我们预测为负类且该案例确实属于负类的情况。

    - **假正例 (False Positives)**：这些是我们预测为正类但该案例实际上属于负类的情况。

    - **假负例 (False Negatives)**：这些是我们预测为负类但该案例实际上属于正类的情况。


    在多分类中，这些值可以使用“一个对所有”（one vs all）的逻辑转换为二分类问题来计算；例如，如果我们有猫、狗、兔子三个类别，为了计算“猫”类别的上述四个值，你可以将猫设为
    1，将狗和兔子设为 0。我们将在本章的 Python Notebook 中展示多分类混淆矩阵。


    需要注意的是，根据所选择的概率阈值，相同输出的混淆矩阵可能会发生变化。在 `sklearn` 包中，二分类的默认概率阈值为 0.5。低于此值的任何值都被视为负类，高于此值为正类。根据业务问题，可以更改此概率阈值。从混淆矩阵派出的其他指标将在后续章节中讨论。


    ### 准确率 (Accuracy)

    准确率的计算方法是所有数据中正确预测的记录占比。根据之前讨论的混淆矩阵，准确率公式如下：

    ![](img/image-e76tvv5f.jpg)

    该公式适用于二分类问题。对于多分类，分子是混淆矩阵对角线值之和除以数据中的总记录数。


    ### 精确 (Precision)

    精确率是在所有预测为正值的记录中，正确预测的正例记录数。精确率的公式如下：

    ![](img/image-2db1e5cq.jpg)

    在多分类情况下，根据混淆矩阵，感兴趣类别的列之和成为分母，感兴趣类别的行与列的交点成为分子。在本章分享的 GitHub 的 Python Notebook
    中展示了一个示例。


    ### 回回率 (Recall)

    召回率是数据中所有正例记录中正确预测的记录占比。召回率的公式如下：

    ![](img/image-ixwgt6p1.jpg)

    在多分类情况下，根据混淆矩阵，感兴趣类别的行之和成为分母，感兴趣类别的行与列的交点成为分子。


    ### F-n 分

    F-n 分是结合精确率和召回率的方法。计算 F-n 分的公式所示：

    ![](img/image-wxttbn2u.jpg)

    这里的值 是超参数，n 值越大，对召回率的权重越高。最常见的 F-n 分是 F1 分，精确率和召回率的权重相等。


    ### ROC 和 AUC

    受者工作特征曲线（ROC）是从信号处理引入机器学习领域的概念。ROC 曲线通过在不同的概率阈值下绘制真正率相对于假正率来创建。真正率就是召回率，是我们之前计算过的。敏感性（Sensitivity）也是召回率或真正率的另一个术语。假正率通过从
    1 中减去特异性得到。特异性的公式如下：

    ![](img/image-y1cw7n2jpg)

    一旦创建图表，将如图所示：

    ![](img/image-dq0r46uq.jpg)

    图 7.3：ROC

    AUC 代表曲线积，它是 ROC 图下方的面积。AUC 的最大值为 1。AUC 的解释是模型区分正类和负类的能力。值越高，模型越好。


    ### 马西修斯相关系数 (MCC)

    在之前讨论的所有指标中，除 ROC/AUC 之外，我们只考虑正类的性能或对其赋予更多权重。在需要同样正确识别正类和负类的情况下，MCC 是一个很好的衡量指标。MCC
    的值在 ‒1 到 1 之间，‒1 意味着每个类别都预测错误，1 意味着模型预测完全正确。0 表示预测是随机的。MCC 的公式所示：

    ![](img/image-wfvmddvv.jpg)


