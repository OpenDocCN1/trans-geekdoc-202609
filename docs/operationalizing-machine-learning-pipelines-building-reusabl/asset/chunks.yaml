  trans: "\n\n# 结论\n\n在前两章中，我们涵盖了成功完成数据科学项目所需的所有逻辑步骤。在本章中，我们讨论了组织内部为了成功实施和实践数据科学应该具备的所有技术栈和框架。我们涵盖了可以作为\
    \ `ML framework` 中每个功能组成部分的工具。本章的思想是强调一个通用框架，并提供能够实现 `ML lifecycle` 中所有步骤的无缝数据科学流水线的功能。我们在本章中强调的工具只是市场上现有众多工具之一。同时，新工具正飞快地涌入市场，因此人们需要掌握良好的信息，但如果你了解自己所需的功能，寻找工具并不是困难的。核心在于理解\
    \ `ML lifecycle` 所需的功能，然后选择以最佳可能的方式来实现每项功能。\n\n现在，我们已经涵盖了 `ML framework` 的每个组件以及在数据科学项目中需要完成的所有单独任务和功能，我们将学习每个孤立任务的细节。在下一章中，我们将从\
    \ `EDA` 开始，并根据用例查看如何进行 `EDA`。\n\n## 注意事项\n\n- `ML Framework` 应该支持 `ML lifecycle`\
    \ 的每一个阶段。\n- `EDA` 不属于 `MLOps`，但 `ML Lifecycle` 中的其他所有内容都应该通过 `MLOps` 完成。\n- `ML`\
    \ 推荐使用云，因为它可以处理大量的临时基础设施需求，从而优化成本和时间。\n- `ML Lifecycle` 中每一步的可复现性和可追溯性是关键。`MLOps`\
    \ 过程应该实现这两者。\n- `ML framework` 应该能够针对新数据的训练和预测进行扩展。\n- 对模型进行持续评估是必要的，以便主动监控模型在数据数据上的性能。这也有助于增强用户对模型输出的信心。\n\
    - `ML Framework` 应该能够同时处理实时数据和批量数据。\n\n## 多选题\n\n1. **云端如何帮助 EDA？选择所有适用选项。**\n\
    \   - 为临时基础设施提供支持\n   - 提供实现 `ML` 的多种方法\n   - 自动完成 `EDA` \n   - 成本优化\n\n2. **为什么数据版本控制是\
    \ MLOps 不可缺的一部分？**\n   - `ML model` 的可复现性\n   - 出审计目的\n   - 为了良好的模型质量\n   - a\
    \ 和 b\n\n3. **在实施 MLOps 时，为什么在 ML 模型训练的开发和生产之间需要分阶段/训练阶段？**\n   - 它在运行 `ML experiment`\
    \ 前后提供了人工干预的选项\n   - 它提升了模型性能\n   - 训练是一项高昂的操作\n   - 以上都不是\n\n4. **为什么 ML Lifecycle\
    \ 中需要消费（Consumption）这一步骤？**\n   - 模型输出无法直接被业务部门消费\n   - 业务可能需要来自多个模型的组合输出\n  \
    \ - 业务仅对一组特定的模型输出感兴趣\n   - 以上所有\n\n5. **对于批量预测，在选择服务时需要考虑的最重要因素是：**\n   - 延迟\n\
    \   - 可扩展性\n   - 成本\n   - 以上所有\n\n6. **存储用于保存模型训练所使用的数据。存储还用于保存哪些其他制品？**\n   -\
    \ 模型二进制文件和图表\n   - 任何预处理二进制文件\n   - 未来可能需要使用的任何输出文件\n   - 以上所有\n\n## 答案\n\n- a\n\
    - d\n- a\n- d\n- d\n- d\n\n## 关键术语\n\n- 使 `ML lifecycle` 运行的过程，包括自动化和可复现性。\n-\
    \ 数据版本控制，结合 `Git` 用于数据版本的维护。\n- 持续机器学习，结合 `Git` 将功能扩展到在 `GitHub`/Gitlab` 上显示 KPI\
    \ 和图表。\n\n## 参考文献\n\nhttps://www.featurestore.org/\n\n# 第 4 章：数据探索与业务问题量化\n\n\
    在之前的章节中，我们讨论了在组织内成功实施 `ML practice` 所需的功能性和技术需求。在本章中，我们将深入细节，并讨论、定义以及将业务问题转换为数据问题。为此，我们将创建一个假设的业务问题并使用公共数据集。我们将处理数据并从\
    \ `EDA` 开始，在此过程中，我们将用 `Python` 代码涵盖 `EDA` 的几个方面。我们还将学习如何突出发现并与利益相关者沟通这些发现。在量化业务问题后，我们将尝试一些\
    \ `ML algorithms`，以获得性能的感觉并定义前进的方法。本章将包含 `Python` 编码，但我们也会解释输出以及如何推断输出。\n\n##\
    \ 结构\n\n在本章中，我们将涵盖以下主题：\n- 概述\n- 业务问题和数据集\n- `EDA`\n- 特征工程\n- 基准模型\n- `EDA` 结果沟通\n\
    \n## 目标\n\n学习本章后，你将能够根据所有可用数据查看业务问题，并将业务问题量化为数据问题。在这个过程中，我们将对数据进行 `EDA` 并查看 `EDA`\
    \ 的几个方面。`EDA` 在很大程度上取决于手头的问题和数据，也取决于执行任务的个人。`EDA` 还能适应利益相关者提出的许多临时问题，因此是一个非常广泛的过程。我们在这里的目标只是提供关于如何进行操作的想法，以及\
    \ `EDA` 中包含哪些思考。`EDA` 涵盖了大量的可视化，以便数据易于理解。为了这个目的，我们将详细说明一些图表并展示如何解释它们。\n\n"
