  fmt: '

    # EDA


    EDA is an important step and, on a high level, covers each of the data understanding,
    relevant features identification, and baseline model evaluation. EDA is done on
    the sample data if the data is huge. In EDA, the data is visualized and analyzed,
    at the same time, feature engineering and selection and model training is also
    done in EDA, just to get a baseline number for the KPIs.


    The goal of EDA is to achieve a clear path to proceed. The outcomes can be any
    one of the following:

    - Data is not sufficient or relevant for the use case.

    - On the positive side, the problem can be solved with a satisfactory result,
    and so on.


    ## The Scope of EDA


    EDA is sometimes referred to as only graphs and visualizations by many data scientists;
    however, that is not the case. EDA includes the visualization of data and interpretation,
    but it is much more than that. During EDA, we explore the data quality like the
    missing values and outliers. At the same time, the statistical test like correlation
    between the variables, (multi)collinearity, and so on are also explored. The quantification
    and finalization of the business problem into the data problem also happens in
    EDA. During EDA, each insight and relevant hypothesis are validated with the business
    on a regular basis to frame the correct data problem.


    Feature creation and interim model training also happens during EDA. EDA is more
    about the idea validation, defining the KPIs, and getting the estimates on the
    performance around those KPIs; hence, multiple ML models can be tried in this
    step, but not in detail, like hyperparameter tuning, and so on. The idea is to
    pick a suitable model for the data set and utilize that model in the next steps
    for a final training with all the optimization in place.


    ## Tools and Infrastructure


    Programing language wise, `Python` and `R` are the most popular tools for EDA,
    utilizing `Jupyter notebook` or `RStudio` as IDE. Another open-source language
    that is catching up is `Julia`. For the big data, `Spark` with `Python` (`PySpark`)
    is a popular tool for EDA. EDA is done on the local machine most of the times
    as the languages and tools are open source, but the local machine might not have
    the infrastructure all the time for every use case. To address this concern, the
    EDA related tasks should be supported by the ML framework.


    In the ML framework, there should be a provision to spin off a custom machine
    with the required configuration as per the data needed to perform EDA. At the
    same time, there might be a certain hardware requirement like `GPU` for the specific
    problems like image classification, and so on. This is where cloud becomes very
    handy, as the hardware and the big machines are costly resources, and unless they
    are regularly utilized, it is too much to invest. On any cloud, it is very easy
    to start a `VM` with the required configuration and OS, and from there, things
    can move forward. Nowadays, a lot of cloud vendors are coming up with the popular
    tools like `Jupyter notebook` and so on, as a service, where one can configure
    the hardware requirement and directly use `Python` or `R` without worrying about
    the low-level installation like OS.


    ## Next Steps


    Once EDA is complete and the insights coming out are promising, the next step
    is to train a final model and deploy it for regularly scoring new data. The first
    step in that process is to create the scripts and defining the process for the
    ongoing data preparation for both training the final model and scoring the new
    data. This step is called data preparation and we will discuss the details of
    it in the following section.

    '
  trans: '


    # EDA


    EDA（探索性数据分析）是一个重要步骤，从高层次上看，它涵盖了数据理解、相关特征识别和基础模型评估的每一个环节。如果数据量巨大，则会在样本数据上进行 EDA。在
    EDA 中，会对数据进行可视化和分析，同时进行特征工程、选择以及模型训练，以获取 KPI 的基准数值。


    EDA 的目标是实现一条清晰的后续路径。结果可以是以下任何一种情况：

    - 数据对于该用例而言不足或不相关。

    - 积极方面，问题可以以满意的结果解决，等等。


    ## EDA 的范围


    许多数据科学家有时将 EDA 仅称为图表和可视化；但事实并非如此。EDA 包含了数据可视化和解读，但其意义远于此。在 EDA 过程中，我们会探索数据质量，如缺失值和离群值。同时，还会探索统计检验，如变量之间的相关性、（多）共线性等。将业务问题量化并最终确定为数据问题也在
    EDA 中完成。在 EDA 期间，会定期与业务部门对每个洞察和相关假设进行验证，以构建正确的数据问题。


    特征创建和临时模型训练也会在 EDA 期间进行。EDA More 是关于想法验证、定义 KPI 以及获取围绕这些 KPI 的性能估值；因此，在这一步可以尝试多个
    ML 模型，但不需要进行细节处理，例如超参数调优等。其理念是为数据集选择一个合适的模型，并在后续步骤中使用该模型进行包含所有优化的最终训练。


    ## 工具与基础设施


    在编程语言方面，`Python` 和 `R` 是 EDA 最流行的工具，并使用 `Jupyter notebook` 或 `RStudio` 作为 IDE。另一种正在追赶的开源语言是
    `Julia`。对于大数据，结合 `Python` (`PySpark`) 的 `Spark` 是 EDA 的流行工具。由于语言和工具都是开源的，EDA 通常在本地机器上完成，但本地机器并不总是能为每个用例提供所需的基础设施。为了解决这个问题，EDA
    相关的任务应该由 ML 框架支持。


    在 ML 框架中，应该能够根据执行 EDA 所需的数据启动所需配置的自定义机器。同时，对于图像分类等特定问题，可能有特定的硬件要求（如 `GPU`）。这就是云变得非常方便的地方，因为硬件设备是昂贵的资源，除非经常使用，否则投资成本太高。在任何云平台上，都可以轻松启动一个具有所需配置和系统的
    `VM`，并从那里开始推进。现在，许多云供应商开始以服务的形式提供 `Jupyter notebook` 等流行工具，用户可以在其中配置硬件需求并直接使用
    `Python` 或 `R`，而无需担心操作系统等低级安装问题。


    ## 下一步骤


    一旦 EDA 完成且出的洞察具有前景，下一步就是训练最终模型并将其部署，以定期对新数据进行打分。该过程的第一步是创建脚本，并为用于最终模型训练和新数据评分的持续数据准备定义流程。这一步被称为数据准备，我们将在下一节中讨论其细节。


    '
