- raw: '  Consumption    Consumption comes after deployment, and it is in this process
    that the output of the deployed model is processed and aligned as per the business
    requirement. At times, deployment itself is sufficient for business consumption;
    however, most of the times, the output of the deployment needs to be processed.
    The reason due to which consumption needs to be separate from deployment can be
    one of the following:     Partial results are required like top n values.    The
    output can be a combination of multiple ML models.    The output of the ML model
    is a small part of some hybrid system based on rules and data.    We will study
    the examples of all these cases, but because of these requirements, the consumption
    also must fulfill the requirement which are part of the deployment like scalability,
    security, and availability. Consumption, at times, might be the same data which
    is coming out of the deployment step but presented in better ways using reporting
    or the BI tools like Tableau or Looker, and so on.    As an example, consider
    a case where you want to recommend a product to a customer based on their buying
    patterns, customer information, and so on. It might happen that you create multiple
    recommendation models either using different algorithms or a different set of
    data, like one can be based on the association rules of the product and the other
    set of recommendations can come from the collaborative filters. There can be multiple
    recommendation models for the same task. After the performance check, it might
    be that all these models are performing better under different conditions. The
    final recommendation to a customer should be such that each of these models have
    proper representation in the list of products proposed to the customer. This combination
    of products from multiple recommendation engines is part of the consumption script,
    which is the expected output. Even though multiple recommendation systems means
    multiple ML models, there will be one consumption script which will be sitting
    on top of all, to combine the output of all the ML models/recommenders in this
    case.    Another example will be a typical case of customer churn. We create a
    customer churn model in many industries and give a probability score to each customer,
    signifying its probability to churn. To make things easier, rather than giving
    the probability score, we take a probability cutoff, and above that, every customer
    is a churner, and below that, they are not a churner. The cutoff is taken based
    on the analysis of historical data. Now, in every business, some customers are
    always going to churn, the idea is to stop the customers which are either most
    profitable or are most likely to churn out from the lot. If we want to identify
    the most profitable customer, the churn model will not provide that insight and
    we need to either create an ML model to identify the most revenue generating customer
    or identify the most revenue generating customer based on the historical transactions.
    In both the cases, the list of customers, in which the business is interested
    will come from somewhere else and, only for that set of customers, we need to
    provide the churn probability or flag. The other thing is, even if the model assigns
    everyone the probability of churn, the marketing budget might be there for only
    a fraction of customers to be engaged, so that they don’t churn. In that case,
    we need only the top n percentage of customers with their churn probability.   
    The preceding two examples were just to highlight that even after the ML model
    deployment, there needs to be work done to utilize the result. It can be as simple
    as converting the probability score into a YES or a NO value or finding the top
    n records, to as complicated as combining the results from multiple ML models
    for a single entity like the customer or a product. The most important thing is
    the consumption step output as this is what the business decision maker can directly
    consume. As mentioned earlier, the output of the deployed model can be consumed
    directly by the business at times, or there needs to be work done on the deployed
    model output, to be consumed. Figure 3.4 highlights the gist of what we discussed,
    as shown as follows:    ![](image-cpavhd8n.jpg)  Figure 3.4: Consumption overview   
    Consumption is the final step in the business use case, which can be composed
    of one or multiple data science use cases. The decision makers consume the consumption
    output, although for them to take the decision confidently, the model should give
    acceptable results. It shouldn’t happen that when the model was deployed, the
    results were good, however after that, nobody bothered to check the performance
    on the ongoing data. This may lead to a huge loss in terms of finances or even
    to the organization’s credibility. The deployed model needs to be continuously
    evaluated, retrained, and redeployed if necessary. We will discuss the evaluation
    and monitoring deployed model in the following section.  '
