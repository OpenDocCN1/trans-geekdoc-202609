    # Kubernetes


    Kubernetes，也称为 K8s，是一种以自动化和可扩展的方式部署和管理容器化应用的开源系统。它由 Google 的工程师创建并开源。目前，大多数组织都选择了
    K8s 路线，原因如下：


    -   K8s 集群具有天然的可扩展性。它拥有一许多工具，允许应用程序及其所托管的基础设施根据需求、效率以及其他许多指标进行水平扩展或收缩。在训练或部署我们的
    ML 模型 模型时，我们将根据需求探索其中的一些工具。

    -   无论你在何处运行集群，K8s 都非常灵活。无论是在你的私有云、公有云还是你自己的机器上，它的设计都能处理复杂的需求。

    -   开源 K8s 是开源的，可以根据需要进行扩展。这为应用程序开发和部署提供了一个强大的系统，且不会被供应商锁定。


    Kubernetes 的安装可能具有挑战性；但得益于 `GCP` 或 `AWS` 等公有云提供商，他们简化了 `K8s` 的安装。另一个需要记住的点是，尽管
    `K8s` 有许多优势，但并不是每个组织都需要为其机器学习或数据科学实践启用这些功能。只有当机器学习实践达到成熟并有需求时，我们才应该进行。我们假设目前大多数企业都是如此；但一个值得思考的问题是，我们每周或每月将训练和部署多少模型。这个问题的重要性在于，你可以轻松地量化基础设施和运维需求。这不需要非常准确，但会给出
    `K8s` 清晰的价值主。


    一旦部署了 `K8s`，我们就得到了集群。集群由称为 `nodes` 的工作机器组成。我们将在下一节中介绍构成 `K8` 集群的所有组件。


    ## K8 组件


    广而言之，`K8` 集群由三个主要部分组成：


    1. 控制平面 (Control plane)

    2. 节点 (Nodes)

    3. 云供应商 API (可选)


    图 5.2 展示了 `K8s` 集群的组件如下：


    ![](img/image-eba5tkxw.jpg)

    图 5.2：K8s 组件


    [参考：节点是容器化应用程序运行的地方，每个 `K8s` 集群至少有一个 `node`。控制平面包含了管理集群的服务/组件，包括如果安装在公有云或私有云上时与云供应商交互的组件。关于
    `K8s` 的更多信息可以查阅]


    ## Google Cloud Platform (GCP)


    Google 云平台，或顾名其 `GCP`，是由 Google 提供的云平台，也是与微软 `Azure` 和 `AWS` 一样最广泛使用的公有云平台之一。`GCP`
    提供了多种服务，使得组织可以在一个地方处理所有的 IT 需求。`GCP` 或任何公有云提供商都能让终端用户专注于核心问题，而无需担心 IT 基础设施或平台。在高级别，`GCP`
    提供以下服务：


    -   计算与托管

    -   存储

    -   数据库

    -   网络

    -   大数据

    -   机器学习


    这些服务属于多个类别，如软件即服务 (SaaS)、平台即服务 (PaaS) 或基础设施即服务 (IaaS)。在本章中，我们将使用 `K8s`，它属于计算与托管。我们将安装
    `K8s` 集群，然后安装在下一节讨论的 `Polyaxon`。本章还讨论了集群代码的安装。


    我们可以通过 `GCP` 云终端完成大部分工作；但是，如果你想从本地机器执行，则你需要安装 Google Cloud SDK。请根据你的操作系统安装此软件。安装完成后，你需要执行
    `gcloud init` 登录你的账户。这将带你进入 Google 登录页面。如果你使用多个 `GCP` 账户和项目，请小心选择正确的一个。登录后，我们就准备好在
    `GCP` 端执行 `K8s` 和 `Polyaxon` 的安装，我们将在下一节中讨论。


    ## Polyaxon


    `Polyaxon` 构建用于自动化和复现机器学习及深度学习任务。`Polyaxon` 是与平台无关的，并提供了多种版本的工具，包括云版本。在本章中，当我们提到
    `Polyaxon` 时，指的是 `Polyaxon` 社区版，这是来自 `Polyaxon` 组织的开源工具。它运行在任何 `K8s` 集群之上；在我们的案例中，我们将使用
    `GCP` `K8s` 集群。我们将在本章介绍安装和设置部分，然后在下一节运行一些实验并介绍它们的细节。


    `Polyaxon` 提供的一些功能是免费的，但也有一些是付费的。我们将利用免费设置，并使用其他工具为任何付费内容寻找替代方案。其核心思想是掌握概念，并根据组织可用的工具进行实现，或给出相应的建议。`Polyaxon`
    提供了两种与 Python API 和 YAML 文件通信的方式。我们将研究两者；但我们将主要通过 YAML 实现大部分内容。在下一节中，我们将在 `GCP`
    `K8s` 集群上安装开源的 `Polyaxon` 社区版。


    '
