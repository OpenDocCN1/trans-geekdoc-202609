    # Result communication


    We have discussed a lot of metrics for both regression and classification; however,
    when communicating with the business or stakeholder, it’s not always that these
    metrics will make business sense to the stakeholders. Also, the output your model
    generates might not be of direct utility to the end user. Just to give an example,
    you have trained a model to predict the house prices and it is able to do so accurately.
    But for a sales agent, the thing which might be of interest are the factors that
    are impacting the price; for example, the location of the house, builder details,
    and so on. At the same time, the house price prediction based on the upcoming
    project can be used by the builder to target the right set of customers. This
    way, the same model can be consumed in different ways by different stakeholder
    and it is very important to communicate the results as required.


    Another example would be the customer churn problem, where we predict the probability
    of customer churn. Now, in every business dealing with customers, there is going
    to be churn due to one reason or another. So, for someone from marketing, they
    would like to know about a customer who is most profitable, which can be the outcome
    of some other ML model, and they would like to try and stop them from churn. At
    the same time, not every customer can be stopped from churn, so it should be an
    optimal combination of churn probability and profitability.


    The preceding examples are just to highlight that training a good ML model is
    only one part, and one needs to understand the stakeholder and communicate the
    results accordingly. It might involve combing multiple models or sharing only
    a part of the outcomes. The end goal should always be some actionable outcome
    based on the insights shared.


    ## Points to remember


    - The performance metrics should be selected based on the problem and data at
    hand.

    - Communicating the ML model performance to the stakeholder is a key to the success
    of the ML project.

    - Associating the ML model performance with the business goal leads to a better
    alignment of the stakeholder.

    - Metrics enable the comparison of multiple ML models for the same problem.


    ## Multiple choice questions


    What does R-square mean?

    - Average percentage of the predicted value that deviates from the actual value.

    - Variance model is able to capture in the predicted dataset.

    - Normalized percentage of error.

    - None of the above


    What is the impact of increasing `n` in the `F-n` score?

    - Weightage of recall increases on `F-n` score.

    - Weightage of precision increase on `F-n` score.

    - Accuracy of the model improves.

    - Precision and Recall improves.


    When is the `MCC`-Matthew correlation coefficient used?

    - When identifying a positive example is important.

    - When identifying a negative example is important.

    - When identifying both the classes is equally important.

    - None of the above


    In the predicted versus the actual plot, if the model is good, which of the following
    happens?

    - The points will be near the regression line and spread along it.

    - The points will be far from the regression line.

    - The points will be near the regression line and clustered in one place.

    - None of the above.


    In an unbalanced data set, where positive examples are <1%, which will be the
    metrics of interest?

    - Precision

    - Accuracy

    - Recall

    - All of the above


    ## Answers


    b, a, c, a, c


    ## References


    Notebook - `https://github.com/MLBook-VJ/ML-KPIs`


    # CHAPTER 8: Feature Store


    In the previous chapters, we covered the training and testing of the ML model
    and the KPIs around which the model performance is measured. We also saw that
    the data is rarely in the format to be directly consumed by the ML algorithm.
    To prepare the data in a consumable format, we need to engineer the features out
    of the raw data. Feature engineering also involves embedding the business knowledge
    into data, which is a creative task and is ever evolving. Feature engineering
    is one of the most time-consuming task in the ML training and involves the data
    scientist to work with different stakeholders to churn out useful features out
    of the data.


    In an organization, there are multiple ML projects going on at the same time and
    the data scientist working on these projects work in silos. Due to this, many
    a times, the feature engineering effort is duplicated. To avoid this, it would
    be a good idea to have a central repository where all the features created are
    stored and any ML model that needs to be trained should take the features from
    the feature store. The other usage is the ready availability of the new data for
    scoring model, while maintaining consistency.


    We will cover `FEAST` in this chapter, which is an open-source feature store for
    managing and serving the machine learning features for model training and serving.
    `Feast` is created by Google and GoJek. We will cover `Feast`, and some best practices
    around it.


    ## Structure


    In this chapter, we will cover the following topics:

    - Overview

    - `Feast`

    - `Feast` hierarchy

    - `Feast` example


    ## Objectives


    After studying this chapter, you will be able to understand the need for a feature
    store. This chapter will also cover `Feast` in detail and the concepts around
    it. We will also discuss how to create and maintain the feature store using `Feast`.
    The `Feast` architecture and how the data can be utilized for training and future
    prediction, will also be discussed. We will also cover what can and cannot be
    done via `Feast`.


    ## Overview


    At an enterprise level, many problems have ML as an integral part of the solution.
    While training and serving, the ML model requires the same set of features; it
    often happens that there is a huge time lag between once the model is finalized
    and once it is ready for serving. Most of the times, it is due to creating a data
    pipeline with the same features as the training to get the ongoing prediction.
    One of the problems that the feature store solves is the smooth transition from
    training to serving in terms of the incoming new data.


    The other challenge is a lot of duplication of effort and no single place to look
    for the features created for a particular entity. This leads to wastage of effort
    and, at times, loss of information. This is another problem which the feature
    store tries to solve using a centralized repository for all the features for a
    particular entity like customer, product, and so on.


    `Feast` tries to solve all these problems by providing consistent access to the
    data and point-in-time correct data. `Feast` also enables the reusability of features
    and makes the deployment of the new features smooth. We will cover `Feast` architecture
    and how to create a feature repository using `Feast` in the upcoming sections.

