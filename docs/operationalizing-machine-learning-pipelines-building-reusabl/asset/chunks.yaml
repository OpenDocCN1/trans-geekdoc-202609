- raw: "  Feature engineering    Once we understand the data via the exploration,\
    \ we need to create a baseline model to see how well the data available is able\
    \ to solve the problem defined. We have our problem statement already defined\
    \ in the preceding section and we need to answer these problems. To achieve the\
    \ first task, i.e., to forecast the sales, we need to create an ML model. For\
    \ that, we need to create the features out of the available data, which will enhance\
    \ the model predictive capability.    We need to create the numerical variables\
    \ out of the categorical variables. After that, we will create a time-based feature,\
    \ which might help the model to identify the seasonal trend.    We will execute\
    \ the preceding steps; however, feature engineering is a very broad topic, and\
    \ more the understanding a user has of the business, better the features will\
    \ they be able to carve out of the data. Also, just to reiterate, we can only\
    \ use the present data to predict the future. In our data, Fuel and Unemployment\
    \ are the time dependent features, and unless they are coming as an output from\
    \ a third party, which forecasts them, or there is a separate internal ML model\
    \ forecasting these variables, we can’t use them. The reason is that their value\
    \ won’t be available in advance to utilize for Sales For the sake of simplicity,\
    \ we will assume that the data is coming out of the third-party output and hence\
    \ we can use these features.    We will discuss a couple of modelling techniques\
    \ in the following section. These will be the basic models which will be run without\
    \ any hyperparameter tuning, just to get an idea of the performance of the models\
    \ and the better suited models for the data available.  \n\n  Baseline ML model\
    \    The idea of the baseline ML model is to try out multiple techniques and find\
    \ a suitable set of features and the ML algorithm that is best suited to the data.\
    \ The information obtained out of this step will help in achieving a couple of\
    \ things, creating the production grade data pipelines for feature engineering\
    \ based on the feature required for the model. It will also help the data scientist\
    \ to select a subset of algorithms from the many available algorithms, based on\
    \ the result and other parameters like time taken to train etc. This approach\
    \ won’t be applicable to the Deep Learning models, if not performing Transfer\
    \ learning, as they have their own challenges and require the training in one\
    \ shot. But, other than the Deep learning tasks, such as image processing and\
    \ the NLP tasks, this approach can be applied to all the traditional ML problems.\
    \    We will try two modelling techniques – one is a simple linear regression\
    \ and the other is a tree based Random Forest algorithm. The details of the model\
    \ performance are shared in the notebook and the final takeaway will be shared\
    \ in the upcoming section. The ML model creation is a heavy computation task,\
    \ and we will use a very small data set, hence the things can be done on a local\
    \ machine/laptop. In case the data is large, we need to utilize the cloud environments\
    \ and start a high computation VM or notebook instance, depending on the availability.\
    \ Some organizations do everything in-house; in that case, you need to have a\
    \ powerful machine in-house or a private cloud environment, which is popular in\
    \ the financial institutions.    In the following section, we will discuss the\
    \ results of the EDA, and learn how the key insights should be communicated. This\
    \ is an important task, as all the hard work done boils down to how well you explain\
    \ the insights to the key stakeholders. As we have mentioned, there is no single\
    \ best path for this; however, we will share a few key pointers while communicating\
    \ the results in the following section.  \n\n  EDA result communication    The\
    \ most important point while communicating the insights after EDA is to understand\
    \ the audience whom one is presenting. In case the audience is from the business\
    \ side, try to avoid any technical jargons and explain it in simple business language.\
    \ Of course, some aspects can get complicated, due to the curiosity of the stakeholders\
    \ or there is no easy way, but this should be thoroughly thought through as this\
    \ is where you convince the business of the utility of the whole exercise. This\
    \ can be the most important step, in terms of your model moving to production\
    \ and the output consumed by the business.    A few of the key pointers to keep\
    \ in mind while communicating the results to the business/stakeholder are as follows:\
    \     Always communicate the results in a simple business language, while prepared\
    \ with numbers and KPIs if enquired about the details.    Explain the KPIs’ impact\
    \ in terms of business decision and insights.    Support the insight with meaningful\
    \ visualization, which complements your insights and is simple to understand.\
    \    Provide some actionable task that can help improve the performance of the\
    \ business.    Raise questions related to insights with the business to check\
    \ if the data is representative of the population.    Try to relate the KPIs with\
    \ a dollar value, operational efficiency.    We will share the insights of our\
    \ EDA; we have followed the principles mentioned earlier. This can be referenced,\
    \ depending on your business problem.  \n\n  Key insights and results    The sales\
    \ data with the store information, and the additional data related to the stores’\
    \ area, has been analyzed, and the following are the findings:     Forty-five\
    \ stores covering 81 departments’ data for little more than two years is analyzed\
    \ for predicting the weekly sales.    The store attributes – size and store type\
    \ – and the external data of the area in which the store is located is used to\
    \ check if they have any contribution in predicting the sales.    There is a seasonal\
    \ pattern in the data and there is a surge in the sales in the holiday season,\
    \ i.e., from November to January 4.2 can be shared here).    The sales are related\
    \ to the size of the stores, although A and B type stores have similar number\
    \ of departments on an average    The first cut of the model can explain 41% of\
    \ the variance in the sales, which is good, and the results will improve after\
    \ further tuning the model.    Holiday in week and Large Store Size leads to more\
    \ sales and high fuel price and high unemployment rate has a negative impact on\
    \ the sales. Figure 4.13 highlights those trends, as shown as follows:    ![](image-2gzr1idf.jpg) \
    \ Figure 4.13: Partial plots    These are the few insights which can be provided;\
    \ however, if someone needs further details and want to know how these insights\
    \ are derived, one can dive into the technical details. One important query which\
    \ comes a lot of times is, why isn’t there 100% accuracy or why only 41% variance\
    \ is captured. We need to explain that with the ML models; there is always some\
    \ uncertainty, and we can’t capture everything which impacts the variable of interest,\
    \ in this case, the Weekly sales. So, we must accept the best we can get out of\
    \ the data and see if it is good enough for business consumption.    Now, we have\
    \ covered a few aspect of EDA and given a few pointers on presenting the result.\
    \ This covers everything that was intended to be covered in this chapter. In the\
