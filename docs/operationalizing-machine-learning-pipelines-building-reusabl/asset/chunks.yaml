    # Overview

    The Machine Learning or ML project goes through different phases/stages, and each
    of the phases are crucial. To start the next step, there should be some actionable
    output from the previous step. Each of these stages is discussed in the subsequent
    sections. The idea is to define a functional framework such that it covers all
    the aspects of the ML project lifecycle and is manageable. There are industry-defined
    standards like `CRISP-DM`, Domain driven data mining, and so on. We will discuss
    `CRISP-DM` in detail in the following section.


    With the ever-evolving paradigm of data science and almost all the industries
    looking into data to generate value, the `CRISP-DM` framework needs an extension.
    We will discuss in detail why we need to extend the `CRISP-DM` framework. While
    explaining the framework, we will take a couple of industry examples to explain
    what goes in each stage to be easily understood. The idea is to define a clear-cut
    operational process overview across the industry. It should be done, so that every
    stage of the data science use case can be broken down into these practical steps.
    Furthermore, it will enable us to target the right individual/team and the toolkits
    required at every stage.


    The outcome of this chapter will lay the foundation of the functional aspect for
    all that needs to be considered when designing a technical framework for machine
    learning and data science.


    # CRISP-DM

    `CRISP-DM` stands for the Cross-Industry Standard Process for Data. It is an open
    standard process model that describes the common approaches used by the data mining
    experts covering the high-level steps utilized across the industry. As mentioned,
    it is an open standard, and hence, it can be extended and used openly. `CRISP-DM`
    was formulated in 1996, which later became a European Union project and was led
    by five companies – Integral Solutions Ltd Daimler NCR and Figure 2.1 visualizes
    all the steps that form the `CRISP-DM`, as shown as follows:


    ![](image-a9t6ax9s.jpg)

    Figure 2.1: `CRISP-DM`


    As highlighted, the six steps or stages of a data science project according to
    `CRISP-DM` are mentioned as follows:

    - Business understanding

    - Data understanding

    - Data preparation

    - Modeling

    - Evaluation

    - Deployment


    As shown, a few steps move back and forth, as per the findings in those stages.
    We will discuss each step in the following sections along with appropriate examples.


    ## Business understanding

    Refer to Figure 2.2 that illustrates the business understanding overview, as shown
    as follows:


    ![](image-swk4kae6.jpg)

    Figure 2.2: Business understanding overview


    The business understanding was discussed in the previous chapter. However, in
    the preceding image, the aspects are addressed in the context of the data scientists.
    Once we have a specific problem, the data scientist will start the project and
    should have a clear answer to the following questions:

    - What is the problem statement?

    - Who needs the answers to that problem?

    - What is the expected output to enable the decision-maker (answer to the second
    question) to make the insights actionable?


    To answer these questions, the data scientist needs to discuss about the available
    dataset with the business decision-maker or product owner, and provide recommendations
    on the data needs, if they have any. Ideally, it is excellent to have a data scientist
    with a business understanding, but that is not always the case; hence, it becomes
    crucial for the product owner to provide the input related to the data.


    Just to give an example, the business necessity might be to increase the revenue
    from the customers. The problem can be solved in multiple ways, like retaining
    the existing customers, up-sale/cross-sell to the existing customers, or acquiring
    new customers. Based on the prioritization exercise, let’s say it is the up-sale/cross-sell
    that is prioritized for implementation. At this stage, the data scientist should
    have a clear understanding on, once any solution is ready, how will it be consumed.
    Apart from that, the other details for the solution in this particular example
    would be the frequency at which the recommendation should be provided, should
    it be done on the SKU level or the other aggregated product category, and so on.
    The idea is to gather as much information as one can get to give a solution which
    can be directly utilized by the business decision maker.


    As highlighted in Figure after business understanding, the next step is data understanding.
    However, we can come back to business understanding again after data understanding.
    This is just to highlight that the `CRISP-DM` framework has support for revisiting
    the previous stages. After business understanding, the problem statement and relevant
    data should be clear. The data scientist will move to the next stage, that is,
    data understanding.


    ## Data understanding

    The next step after the business problem finalization is data understanding. The
    first step in data understanding is to collect and process all the relevant data
    into one place. The next step is to analyze the data, keeping the business problem
    in mind. Analyzing the data is subjective and depends a lot on the individual(s)
    analyzing the data. However, there are some standard steps that needs to be completed
    and we will explore those in the following chapters.


    We have touched data understanding in the previous chapter, but we were just checking
    the feasibility as to whether a question can be answered with the existing data.
    Here, we are talking about a full-fledged project and gathering the relevant data
    itself at one place. The computation power and data framework needed to analyze
    the available amount of data will also be a key factor to be considered. We will
    address this in the upcoming chapters.


    The first outcome of this exercise is about the data quality that is available;
    for example, the time range for which the data is available, the missing values,
    outliers, spread of the data, distinct values in case of a categorical variable,
    and so on. While understanding the data, there should be a continuous discussion
    with the business, so that the challenges like the missing value or the outlier
    treatment can be ironed out during this whole exercise. At the same time, additional
    insights like the correlation between the variables, multicollinearity, and so
    on can be explored and a full understanding of the data and the process that generated
    that data is developed. Once data understanding is complete, a clear view on what
    is to be predicted or the dependent variable and what data should be utilized
    or the independent variable to predict the dependent variable should be clear.
    After the completion of data understanding, the next step is data preparation.

    '
