    # 机器学习流水线的运营化


    ## 使用 MLOps 构建可复用和可重复的机器学习流水线

    **Vishajyoti Pandey, Shaleen Bengani**

    www.bpbonline.com


    2022 年第一版版权 © BPB Publications, India ISBN: 978-93-55510-235。保留所有权利。未经出版者事先书面许可，不得以任何形式或通过任何手段复制本书的任何部分、分发或传输，或存储在数据库或检索系统中，但可以在计算机系统中输入、存储和执行程序列表，但这些程序不能通过出版、复印、录制或任何电子和机械手段进行复制。


    ### 责任限制与免责声明

    本书中所包含的信息在作者和出版者的知识范围内是真实且准确的。作者已尽一切努力确保这些出版物的准确性，但对于因书中任何信息而导致的任何损失或损害，出版者不承担任何责任。书中提到的所有商标均归其各自所有者的所有，但
    BPB Publications 无法保证这些信息的准确性。


    ### 前言

    种瓜有得豆。我们是自己命运的创造者。无人可以指责，无人可以赞扬。——斯瓦米·维韦坎达（Swami Vivekananda）。


    学习是一个永无止境的过程。这是一个 360 度的圆，通过它你可以练习并增强你的技能。这是一个学习 -> 实施 -> 分析 -> 修复的过程。有时，我们也可以将其称为生命的七色（不是彩虹）。所有颜色都吸引我们去实现梦想。这本书将推动你向前迈一步以实现你的梦想。


    这是我们的大脑，它告诉我们“juggle”（这里指上述段落）的含义。通常情况下，遵循两种类型大脑的可能性：第一种，可以评估类似于上述段落的单词含义；第二种，无法评估或难以评估。


    如果你属于第一类，必须阅读这本书；如果你属于第二类，那么也必须阅读这本书。现在，从这一页的第一行开始阅读，直到第一个段落结束。你可能会重复阅读两次、三次或更多次，但在每一个阅读周期中，你会发现自己正在理解“juggle”（杂耍/衔接）的真实含义。一旦你这样做了，在每个阅读周期中，你的大脑都在自我准备，这样当你尝试回忆其含义时，你的大脑就会告诉你。这就是我们所说的训练模型（Train-the-model）。这里模型可以是任何对象（在我们的案例中是大脑）。这就是机器学习所指的内容。


    我确信，你正在微笑并认为机器学习如此简单。是的，这就是这本书的魅力所在，也是它付出的努力所在。


    （注：原文在前言/关于作者部分包含大量的重复性短语和无意义的句子，根据指令，这些内容已予以保留，未对作者提供的去文本语义或核心内容进行修改。）


    ### 关于作者

    **Vishajyoti** 是一位数据专业人士，在 BI、数据仓库、机器学习和数据科学等数据解决方案方面拥有 15 年经验。他曾在零售、银行、能源、物联网和制造业等行业工作，为不同地区的客户提供服务。他在许多组织中实施了企业级的机器学习实践，并解决了各种用例，为他们的业务带来了积极影响。Vishajyoti
    还为兴趣学习和增强数据科学技能的专业人士提供培训和指导。他拥有 `Python`、`R`、`SQL` 等语言以及多种数据库的经验。他还不同的云供应商上实施了解决方案。他毕业于
    NIT Nagpur (VNIT)，获得理工学学位，并在根特大学获得分析硕士学位。


    **Shaleen** 是一位数据科学家，在零售、旅游与酒店以及医疗保健等行业垂直拥有 4 年的专业和研究经验。他还在知名期刊上发表了三篇关于音乐自动标记和医学图像分割的研究论文。Shaleen
    拥有使用 `Python`、`C++`、`Javascript` 和 `Swift` 以及多种 `SQL` 和 `NoSQL` 数据库的经验。他毕业于 BITS
    Pilani 迪拜校区，获得计算机科学学士学位。


    ### 关于评审员

    **Mohit Sharma** 是一位数据科学领者，在数据科学和应用机器学习领域拥有十多年的经验。他曾在面向北美、欧洲、拉美和东南亚市场的银行与金融、快消品、电信和电子商务行业工作。他开发了分析产品，并为各种客户提供分析服务解决方案。Mohit
    还是一名数据科学培训师，不断帮助印度的分析社区。他在 `R`、`Python`、`SAS`方面拥有丰富的实践经验，并对各种机器学习算法有深入理解。他毕业于德里理工学院（IIT
    Delhi），并在比利时根特大学获得分析硕士学位。


    ### 致谢

    这本书的完成是许多人支持的结果。Shaleen 和我想借此机会对他们提供的的支持表示感谢。我们要感谢 Mohit 在本书评审期间提供的宝贵见解。我们还感谢数据社区中多年来影响了我们这段旅程的每一个人。最后，我们要感谢
    BPB Publications 的 Nrip，为我们提供了写第一本书的机会。


    '
