- raw: "  Overview    We covered all the end-to-end tasks that goes into the ML Lifecycle.\
    \ Now, in this chapter, we will dive deep into EDA, where the goal is to understand\
    \ the data at hand, check its quality, and based on that, provide both the qualitative\
    \ and the quantitative insights for the business problem at hand. The qualitative\
    \ aspects cover the quality of the data, and in simple terms, it investigates\
    \ if the data available is good enough in quality to solve the problem at hand.\
    \ The quantitative insights are generally in terms of the amount of data available\
    \ and whether it is good enough to solve the business problem at hand, within\
    \ the acceptable cutoffs. We will look into both these aspects and provide certain\
    \ standard guidelines on both these quality issues.    As discussed in the previous\
    \ chapter, EDA is the first step in the ML lifecycle after finalizing the business\
    \ problem. Finalizing the business problem before EDA is a prerequisite because\
    \ the same data can be examined in different ways depending on the business problem.\
    \ For example, if we want to identify customer pattern in the data, we will look\
    \ at the transactional history keeping the customer in mind. If we want to see\
    \ the complimentary products in the data, we will look into the transactional\
    \ history again, but keeping the product in mind and try to find the relationship\
    \ between the products. The same data can be looked at in multiple ways when doing\
    \ EDA and hence, the business problem finalization is the most important step\
    \ before jumping into EDA.    To show an example of EDA, we will discuss a business\
    \ problem and define the final problem in the following section. In a real scenario,\
    \ defining the business problem can be time taking and can go through many iterations\
    \ and many stakeholders might be involved, including the data scientist, to finalize\
    \ the business problem. We already covered that in the first chapter. In the following\
