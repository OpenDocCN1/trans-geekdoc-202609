- raw: "  FEAST – Feature Store    Figure 8.1 shows the architecture of Feast, as\
    \ follows:    ![](image-jznlon7e.jpg)  Figure 8.1: Feast architecture    \\[Reference:\
    \    Feast is not an ETL tool; it just provides an interface and infra configuration\
    \ for creating a feature store to access the data in a consistent manner. Feast\
    \ mainly sits on top of the data warehouse system or data lake. All the features\
    \ that are used in training the model or scoring new data are coming from this\
    \ data warehouse or data lake or file system. Feast mainly supports two other\
    \ data sources, apart from files, Bigquery and Redshift; however, in the new releases,\
    \ it may come out with a support for the other data source.    Feast uses the\
    \ historical features or data to train the model and the online features or data\
    \ to score a new data. We will look into how to access both the historical and\
    \ the online features (data, used interchangeably) when we discuss the code. The\
    \ online stores are in the memory data base. Currently, feast supports SQLite,\
    \ Datastore, Redis, and DynamoDB as online stores.    Feast creates a consistent\
    \ view for the data to be used for training and scoring. The way Feast does that\
    \ is by storing the data in a structure which is available for both training and\
    \ scoring in the hierarchical structure, which is easily extended, as per the\
    \ need without compromising the already built ML pipelines. We will look into\
    \ the feast data hierarchy in the upcoming section.  \n\n  Feast – logical hierarchy\
    \    Figure 8.2 highlights the logical hierarchy of Feast, that is, how data is\
    \ stored in Feast, as shown as follows:    ![](image-earj0udh.jpg)  Figure 8.2:\
    \    \\[Reference:    Projects are at the top of the hierarchy, and they provide\
    \ complete isolation on the infrastructure level. Each project should be considered\
    \ as a completely separate universe of entities and features. One cannot fetch\
    \ the data from multiple projects in a single request.    Feast stores the data\
    \ with the point-in-time correct data to avoid inconsistencies introduced by the\
    \ future feature values being leaked to the models during training. To do that,\
    \ feast uses Feature View which is composed of features and entity. Entity can\
    \ be considered as a key attribute around which the features are created; for\
    \ example, and so on. Entities are similar to the primary key on which multiple\
    \ feature views can be created. Entities can be composed of multiple keys.   \
    \ Data source refers to the underlying table or file system from where the data\
    \ is picked. As we are doing everything on GCP, for us, the data source will be\
    \ Bigquery tables. To understand the working of Feast better and each component\
    \ in detail, we will go through an example with each working part in detail, in\
    \ the following section.  \n\n  Feature store example    To understand Feast,\
    \ we will go through an example. The first step is to install feast on your system\
    \ or cloud wherever you are running the code. We already covered how to connect\
    \ to the Google cloud from a local machine in Chapter 5, Training and Testing\
    \ ML Model – Part For installing feast, execute the following command:    pip\
    \ install feast    Once feast is installed on the machine, you can create a project\
    \ by executing the following command:    feast init project\\_name \\-t gcp   \
    \ The Feast init commands initializes a repository and project\\_name is a user\
    \ defined meaningful name which can be provided for the project. The \\-t gcp\
    \ command lets feast know that we will use GCP as the platform for our feature\
    \ store. It will prepare the infra needs accordingly. The preceding command will\
    \ create a folder with three files and    We will edit feature-store.yaml to provide\
    \ the GCP bucket in the registry where we want to store our metadata. This would\
    \ look something like where bucketname is the bucket name user created and entity.db\
    \ is the metadata database name that the user wants to give. Once done with this,\
    \ we are ready to create our entity, data source, and feature views, but before\
    \ we jump into that, let’s look at the data we are using for the feature store\
