- raw: "  Accessing data    We access the data from the feature store for two purposes.\
    \ First, to train a model and second to score new data. We need to configure the\
    \ feature store in using FeatureStore and RepoConfig module in feast API. The\
    \ codes to test the feast feature store are in the test\\_feature\\_store.py script\
    \ in the GitHub link shared. Once configured, we now need to import the data for\
    \ training the model. You need to define the feature which you want to import\
    \ from the feature store too, which can be configured as a list. The naming convention\
    \ is for example customer\\_conn\\_det:Tenure for Tenure feature from feature\
    \ view as created in the preceding section.    To get the offline features, we\
    \ need the entity data frame which is a Pandas data frame type object with the\
    \ entity that is CustomerID in our case and time stamp for the point in time join.\
    \ Once the entity data frame is created, we can use that and the feature list\
    \ as the parameter to the FeatureStore object method get\\_historical\\_features\
    \ and get all the relevant features for a customer. To get the online features,\
    \ you can use get\\_online\\_features of the same object or you can create one\
    \ when you need one following the preceding process.    We will conclude feast\
    \ with this, and even though the feature store will have some latency and might\
    \ not be useful in every ML use case that an organization has, it is still a good\
    \ idea to have one and utilize as much as possible to avoid effort duplication.\
    \ Feature store also makes tracking of the data and concept drift easy to monitor.\
    \ In the next chapter, we will combine everything and see how to deploy the model\
    \ and actively monitor them.  \n\n  Points to remember     Feast is the feature\
    \ store to arrange the features centrally for an entity at one place to be used\
    \ later. It is not an ETL tool.    Feast creates the infra part for you if you\
    \ are using cloud.    Feast supports Bigquery, Redshift, and Files as data source.\
    \ There might be new additions in the further release.    Historical features\
    \ from Feast are used to train the model. To score new data, features are pulled\
    \ from the online feature store.  \n\n  Multiple choice questions     Which of\
    \ the following cannot be used as data source?     Bigquery    DynamoDB    Redshift\
    \    SQLite    What does registry value in feature\\_store.yaml signify?     Feast\
    \ metadata    Offline store    Online store    None of the above    Feast materialize-incremental\
    \ picks the start date automatically.     True    False    Multiple data sources\
    \ can be used in a single feature view in Feast.     True    False  \n\n  Answers\
    \     b and d    a    a    b  \n\n  References     GitHub code \\- https://github.com/MLBook-VJ/Feast\
    \  \n\nCHAPTER 9    Building ML Pipeline    In the previous chapters, we covered\
    \ all the individual aspects of the ML lifecycle from EDA to training and evaluating\
    \ the model. The next step is to deploy the finalized model for scoring new data\
    \ and monitoring it. We also need to operationalize the ML pipeline from training\
    \ to deployment in such a way that any new or up-to-date ML model can be deployed\
    \ without any downtime. We should also have an option to revert to the old models\
    \ in case it is required, which we will discuss in this chapter.    At the enterprise\
    \ level, multiple ML models are deployed on production and the business decisions\
    \ are made based on the model output. To make sure that the model provides the\
    \ correct output, the performance of the ML model needs to be regularly tracked.\
    \ The model performance can go down because of data drift or concept drift, and\
    \ in both scenarios, we must train a new model and deploy it for consumption.\
    \ The movement of the new model should happen smoothly with minimal changes to\
    \ the downstream process. To achieve that, we need to have a mechanism like continuous\
    \ integration and deployment (CI/CD), just like software engineering.    We will\
    \ discuss all these in detail, in this chapter.  \n\n  Structure    In this chapter,\
    \ we will cover the following topics:     Overview    Polyaxon config updates\
    \    Training    Deployment    Consumption    Git Ops    Monitoring  \n\n  Objectives\
    \    After studying this chapter, you will be able to understand the need for\
    \ MLOps and design a necessary process around it for the ML pipeline. You will\
    \ also be able to utilize the tools discussed in this book to their full potential\
    \ as per your need. In scenarios where you must choose a different tech stack,\
    \ you will be able to evaluate the new tools to design a smooth MLOps process.\
    \ We will also cover a few key pointers on the frequency of monitoring the ML\
    \ models wherever applicable.  \n\n  Overview    ML pipeline should be designed\
    \ to support all the MLOps steps. We will configure Git, Storage, and the other\
    \ cloud-related setup, as per the need, and provide the key pointers on these\
    \ setups for the production level system. Setting the ML pipeline may require\
    \ multiple teams to work together like DevOps, Security, IT, and of course, Data\
    \ Science. Depending on the use case in hand, the pipeline flow might differ;\
    \ however, we will touch base on how the pipelines can be tweaked for specific\
    \ needs. We will go through one example for the ML pipeline, using the same data\
    \ that we used to create the Feast feature store. KServe will be used to deploy\
    \ the trained model and the deployment script will be used to save the metadata\
    \ related to the model. We will also learn how the saved metadata of the deployed\
    \ model can be utilized to track the data drift, concept drift, and model performance\
    \ on an ongoing basis. We will check for data and concept drift using Evidently,\
    \ an open source model monitoring tool.    We will discuss GitOps and a few best\
    \ practices around security, but we will not go into the details. The code used\
    \ in this chapter is provided in the Reference section. We will first start by\
    \ updating the Polyaxon configuration to store the metadata on cloud storage.\
    \  \n\n  Polyaxon config update    We configured Polyaxon in Chapter 5, “Training\
    \ and Testing ML Model – Part however, training the model generates a lot of metadata,\
    \ which we would like to store for a longer period of time. To do that, we need\
    \ to use storage which is not dependent on the Pods (container running on K8s)\
    \ life. We will configure Google Cloud Storage in our case. There are other configurations\
    \ that you can do if you use cloud image registry and GitHub or GitLab. The details\
    \ of each of the configurations can be found on Any additional tools that you\
    \ want to integrate can be found on the URL. We do not need to do that for our\
    \ examples as we will use public GitHub repositories and docker images.    We\
    \ will configure GCS for storing the model metadata, the details for which can\
    \ be found in config.yml on the GitHub repo, shared in the reference section.\
    \ You need to change the bucket and the secret details, and also provide a different\
    \ name to There are two ways to update the Polyaxon configuration; the first way\
    \ is to pass the config file at the time of the installation as a parameter, and\
    \ the other way is to just upgrade Polyaxon using the following command:    polyaxon\
    \ admin upgrade \\-f config.yml    This will upgrade the Polyaxon installation\
    \ as per your config file’s entry. The next step is to train the model, which\
    \ we will cover in the following section.  "
