- raw: "  Creating an account on Docker hub    The first step is to create an account\
    \ on docker hub. This will be used in pushing and storing our images in the docker\
    \ hub for a later reference. The whole idea of containerizing the application\
    \ is to run it independently in as many environments as we want, without worrying\
    \ about the locale setup. To do this, we need to have the images stored in such\
    \ a way that they can be easily accessed and referenced. The images are the blueprint\
    \ of the container, and hence, storing and their availability is very important,\
    \ and that is what docker hub is used for. You can go to https://hub.docker.com/signup\
    \ and signup by choosing a docker id and password and providing an email id. If\
    \ you are signing up for the first time, you will get a screen as shown in Figure\
    \ as follows:    ![](image-ny3lprcc.jpg)  Figure 5.1: Docker plan details    You\
    \ can choose Free and continue, since we can cover the learning aspect with the\
    \ free options. You may be asked to verify your email by clicking the link received\
    \ in the email from the docker. Just remember, the service provided by the docker\
    \ hub is also provided by other vendors, including all the major cloud providers.\
    \    Once successfully logged in and verified, we will park the docker hub details\
    \ for now and use the login details in the later sections and chapters.  \n\n\
      Installing Docker desktop on PC    Docker desktop is an application to build\
    \ and share the container from your desktop. Docker Desktop includes Docker Docker\
    \ CLI client, Docker and Credential We won’t be using everything, but we will\
    \ make use of docker CLI. You need to download the Mac or Windows version from\
    \ depending on your OS. For Unix, it depends on the flavor of Unix you are using,\
    \ and the detailed steps are mentioned on the website for supported flavors. \
    \   The installation is straightforward and very well documented on the website.\
    \ While installing, please select the option to start the docker when the system\
    \ starts. That way, we don’t have to start the docker again.    Once the installation\
    \ is complete, start docker CLI or you can directly execute the docker command\
    \ in the terminal; it will give a list of options. Use the following command and\
    \ provide the Docker hub details created above the login, when asked for the username\
    \ and password:    docker login    Once you have logged in successfully, you are\
    \ connected to the docker hub from your docker desktop. The next step is to create\
    \ an image and run a container, which will be discussed in the upcoming sections.\
    \  \n\n  Creating a reusable image    We covered the installation and account\
    \ creation part of docker desktop and hub. Now, we will create a simple image\
    \ and go through the details of a few basic commands and structure required to\
    \ build an image. As our goal is to create a reusable image and push it to docker\
    \ hub, we will conduct a simple exercise where we will complete the following\
    \ steps:     Create a Python script to count the null/missing values for each\
    \ column in CSV file.    Generate a report with a column name and count of missing\
    \ value.    Containerize the module.    Save the output on the machine where it\
    \ is running.    We will start with the Python script. The Python script should\
    \ take the csv file as an input and provide a csv file as the output with a name\
    \ The script will be shared in the git link at the end of this chapter. We have\
    \ named the Python file as    Now, we will go through the Dockerfile content which\
    \ is used to create the image. The first command in the Docker file is as follows:\
    \    FROM python:3.7.3    This command is used to refer to the base image. Docker\
    \ and many other vendors provide the base image of their application/software\
    \ which can be extended as per need. We are doing the same using the preceding\
    \ command. We will call the Python image 3.7.3 available and use it further as\
    \ per our need.    The next command is setting the working directory, using the\
    \ following command:    WORKDIR /usr/src/app    This command sets the working\
    \ directory as the mentioned path, in this case If the directory is not present,\
    \ it will be created. All the commands will be executed inside the working directory.\
    \ It also makes it easy to mount the external data if we know the working directory.\
    \ Also, the working directory can be changed multiple times in the same docker\
    \ file, but is not required for this example.    The next command is to copy all\
    \ the files that are required in the container image. For doing that, we use the\
    \ copy command. In this case, we use the following command:    COPY ..    This\
    \ just means copying all the current directory content from your system to the\
    \ docker current directory, which is the working directory set earlier.    The\
    \ next command is to install all the Python packages inside the container and\
    \ all the package required with their version are mentioned in a file The RUN\
    \ command executes the commands that follows it, in the docker file, while building\
    \ the image. The command is mentioned as follows for reference:    RUN pip3 install\
    \ \\-r requirement.txt    The final part is the entry point command, which means\
    \ that as soon as you start the container, this is the command that will run.\
    \ It can be overridden while running the container, which can be checked in the\
    \ link provided in README.md in the code shared. The command that is to be executed\
    \ is as follows:    ENTRYPOINT \\[“python”,”Null\\_Value\\_Modul.py”\\]    The\
    \ Python scripts perform the task that we have defined at the beginning of this\
    \ section, that is, counting the null values for each column and generating a\
    \ report in the CSV format, given an input CSV file.    The docker command to\
    \ be executed and the parameters to be passed to them are discussed in the README.md\
    \ file shared with the code. The code link is shared in Docker Image Creation\
    \ in the references.  \n\n  Running the Image as Container    Once the image is\
    \ created, we want to use it as per our requirement. The command to pull the image\
    \ from a centralized repository, in this case docker hub, and to run it are given\
    \ in the README.md file. The command options are also shared and explained and\
    \ might change based on the image necessity.    With this, we have covered how\
    \ we can create the image and run them as a container. However, there are infrastructure\
    \ requirements when we are running multiple images, especially when we have to\
    \ train or deploy an ML model for scalability. This is where Kuberenetes (K8s)\
    \ comes into picture. We will discuss them and try to develop an understanding\
    \ for working with them, in the upcoming section.  "
  fmt: "\n# Creating an account on Docker hub\n\nThe first step is to create an account\
    \ on docker hub. This will be used in pushing and storing our images in the docker\
    \ hub for a later reference. The whole idea of containerizing the application\
    \ is to run it independently in as many environments as we want, without worrying\
    \ about the locale setup. To do this, we need to have the images stored in such\
    \ a way that they can be easily accessed and referenced. The images are the blueprint\
    \ of the container, and hence, storing and their availability is very important,\
    \ and that is what docker hub is used for. You can go to `https://hub.docker.com/signup`\
    \ and signup by choosing a docker id and password and providing an email id. If\
    \ you are signing up for the first time, you will get a screen as shown in Figure\
    \ as follows:\n\n![](image-ny3lprcc.jpg) \nFigure 5.1: Docker plan details\n\n\
    You can choose Free and continue, since we can cover the learning aspect with\
    \ the free options. You may be asked to verify your email by clicking the link\
    \ received in the email from the docker. Just remember, the service provided by\
    \ the docker hub is also provided by other vendors, including all the major cloud\
    \ providers. Once successfully logged in and verified, we will park the docker\
    \ hub details for now and use the login details in the later sections and chapters.\n\
    \n# Installing Docker desktop on PC\n\nDocker desktop is an application to build\
    \ and share the container from your desktop. Docker Desktop includes Docker Docker\
    \ CLI client, Docker and Credential We won’t be using everything, but we will\
    \ make use of `docker CLI`. You need to download the Mac or Windows version from\
    \ depending on your OS. For Unix, it depends on the flavor of Unix you are using,\
    \ and the detailed steps are mentioned on the website for supported flavors.\n\
    \nThe installation is straightforward and very well documented on the website.\
    \ While installing, please select the option to start the docker when the system\
    \ starts. That way, we don’t have to start the docker again. Once the installation\
    \ is complete, start `docker CLI` or you can directly execute the `docker` command\
    \ in the terminal; it will give a list of options. Use the following command and\
    \ provide the Docker hub details created above the login, when asked for the username\
    \ and password:\n\n```bash\ndocker login\n```\n\nOnce you have logged in successfully,\
    \ you are connected to the docker hub from your docker desktop. The next step\
    \ is to create an image and run a container, which will be discussed in the upcoming\
    \ sections.\n\n# Creating a reusable image\n\nWe covered the installation and\
    \ account creation part of docker desktop and hub. Now, we will create a simple\
    \ image and go through the details of a few basic commands and structure required\
    \ to build an image. As our goal is to create a reusable image and push it to\
    \ docker hub, we will conduct a simple exercise where we will complete the following\
    \ steps:\n\n* Create a Python script to count the null/missing values for each\
    \ column in CSV file.\n* Generate a report with a column name and count of missing\
    \ value.\n* Containerize the module.\n* Save the output on the machine where it\
    \ is running.\n\nWe will start with the Python script. The Python script should\
    \ take the csv file as an input and provide a csv file as the output with a name\
    \ The script will be shared in the git link at the end of this chapter. We have\
    \ named the Python file as. Now, we will go through the `Dockerfile` content which\
    \ is used to create the image. The first command in the Docker file is as follows:\n\
    \n```dockerfile\nFROM python:3.7.3\n```\n\nThis command is used to refer to the\
    \ base image. Docker and many other vendors provide the base image of their application/software\
    \ which can be extended as per need. We are doing the same using the preceding\
    \ command. We will call the Python image 3.7.3 available and use it further as\
    \ per our need.\n\nThe next command is setting the working directory, using the\
    \ following command:\n\n```dockerfile\nWORKDIR /usr/src/app\n```\n\nThis command\
    \ sets the working directory as the mentioned path, in this case If the directory\
    \ is not present, it will be created. All the commands will be executed inside\
    \ the working directory. It also makes it easy to mount the external data if we\
    \ know the working directory. Also, the working directory can be changed multiple\
    \ times in the same docker file, but is not required for this example.\n\nThe\
    \ next command is to copy all the files that are required in the container image.\
    \ For doing that, we use the `copy` command. In this case, we use the following\
    \ command:\n\n```dockerfile\nCOPY ..\n```\n\nThis just means copying all the current\
    \ directory content from your system to the docker current directory, which is\
    \ the working directory set earlier.\n\nThe next command is to install all the\
    \ Python packages inside the container and all the package required with their\
    \ version are mentioned in a file The `RUN` command executes the commands that\
    \ follows it, in the docker file, while building the image. The command is mentioned\
    \ as follows for reference:\n\n```dockerfile\nRUN pip3 install -r requirement.txt\n\
    ```\n\nThe final part is the entry point command, which means that as soon as\
    \ you start the container, this is the command that will run. It can be overridden\
    \ while running the container, which can be checked in the link provided in `README.md`\
    \ in the code shared. The command that is to be executed is as follows:\n\n```dockerfile\n\
    ENTRYPOINT [\"python\",\"Null_Value_Modul.py\"]\n```\n\nThe Python scripts perform\
    \ the task that we have defined at the beginning of this section, that is, counting\
    \ the null values for each column and generating a report in the CSV format, given\
    \ an input CSV file. The `docker` command to be executed and the parameters to\
    \ be passed to them are discussed in the `README.md` file shared with the code.\
    \ The code link is shared in Docker Image Creation in the references.\n\n# Running\
    \ the Image as Container\n\nOnce the image is created, we want to use it as per\
    \ our requirement. The command to pull the image from a centralized repository,\
    \ in this case docker hub, and to run it are given in the `README.md` file. The\
    \ command options are also shared and explained and might change based on the\
    \ image necessity.\n\nWith this, we have covered how we can create the image and\
    \ run them as a container. However, there are infrastructure requirements when\
    \ we are running multiple images, especially when we have to train or deploy an\
    \ ML model for scalability. This is where Kuberenetes (K8s) comes into picture.\
    \ We will discuss them and try to develop an understanding for working with them,\
    \ in the upcoming section.\n"
  trans: "\n\n# 在 Docker hub 上创建账户\n\n第一步是在 docker hub 上创建一个账户。这将用于将我们的镜像推送到 docker\
    \ hub 并存储起来，以备以后参考。应用程序容器化的核心思想是让它在我们需要的任意数量环境中独立运行，而无需担心本地环境的设置。为了做到这一点，我们需要将镜像存储起来，以便方便地访问和引用。镜是容器的蓝图，因此，它们的存储和可用性非常重要，这正是\
    \ docker hub 的用途。你可以访问 `https://hub.docker.com/signup`，通过选择 docker id 和密码并提供邮箱\
    \ ID 来注册。如果你是第一次注册，你将看到如图所示的屏幕：\n\n![](img/image-ny3lprcc.jpg) \n图 5.1: Docker\
    \ 计划详情\n\n你可以选择 Free（免费版）并继续，因为我们可以通过免费选项来涵盖学习方面的内容。你可能被要求点击 docker 发送的邮件中的链接来验证你的邮箱。请记住，docker\
    \ hub 提供的服务也由其他供应商提供，包括所有主要的云提供商。一旦成功登录并验证，我们暂时搁置 docker hub 的详细信息，将在后的章节和部分中使用登录信息。\n\
    \n# 在 PC 上安装 Docker desktop\n\nDocker desktop 是一个从你的桌面构建和共享容器的应用程序。Docker Desktop\
    \ 包含了 Docker CLI 客户端、Docker 和凭据工具。我们不会使用所有内容，但我们将利用 `docker CLI`。你需要根据你的操作系统下载\
    \ Mac 或 Windows 版本。对于 Unix，它取决于你正在使用的 Unix 变体，支持的变体的详细步骤在网站上提到。\n\n安装过程非常直观，且网站上有非常详尽的文档。安装时，请选择“系统启动时启动\
    \ docker”的选项。这样，我们就不需要再次启动 docker。安装完成后，启动 `docker CLI`，或者你可以直接在终端中执行 `docker`\
    \ 命令；它将列出选项列表。使用以下命令，并在要求用户名和密码时提供上方创建的 docker hub 详情：\n\n```bash\ndocker login\n\
    ```\n\n一旦你成功登录，你就可以通过你的 docker desktop 连接到 docker hub。下一步是创建镜像并运行容器，这将在接下来的部分中讨论。\n\
    \n# 创建可重用的镜像\n\n我们已经涵盖了 docker desktop 和 hub 的安装以及账户创建部分。现在，我们将创建一个简单的镜像，并介绍构建镜像所需的几个基本命令和结构的细节。由于我们的目标是创建一个可重用的镜像并将其推送到\
    \ docker hub，我们将进行一个简单的练习，完成以下步骤：\n\n* 创建一个 Python 脚本来统计 CSV 文件每列的空/缺失值。\n* 生成一个包含列名和缺失值计数的报告。\n\
    * 将该模块容器化。\n* 将输出保存在运行它的机器上。\n\n我们将从 Python 脚本开始。该 Python 脚本接受 csv 文件作为输入，并提供一个命名的\
    \ csv 文件作为输出。该脚本将在本文末尾的 git 链接中共享。我们将 Python 文件命名为...。现在，我们将介绍用于创建镜像的 `Dockerfile`\
    \ 内容。Docker 文件中的第一个命令如下：\n\n```dockerfile\nFROM python:3.7.3\n```\n\n此命令用于引用基础镜像。Docker\
    \ 和许多其他供应商都提供其应用程序/软件的基础镜像，可以根据需要进行扩展。我们正在使用前面的命令执行相同的操作。我们将调用可用的 Python 3.7.3\
    \ 镜像，并根据我们的需要进一步使用它。\n\n下一个命令是使用以下命令设置工作目录：\n\n```dockerfile\nWORKDIR /usr/src/app\n\
    ```\n\n此命令将工作目录设置为指定的路径，在这种情况下，如果目录不存在，它将被创建。所有的命令将在工作目录内执行。这使得挂载外部数据变得容易，也可以在同一个\
    \ docker 中多次更改工作目录，但在本例中不需要。\n\n下一个命令是将容器镜像所需的所有文件。为了这样做，我们使用 `copy` 命令。在这种情况下，我们使用以下命令：\n\
    \n```dockerfile\nCOPY ..\n```\n\n这表示将系统当前目录的内容复制到 docker 当前目录（即之前设置的工作目录）。\n\n\
    下一个命令是在容器内安装所有 Python 软件包，所有需要的包及其版本都在文件中提到。`RUN` 命令在构建镜像时在 docker 文件中执行其随后的命令。为了参考，命令如下：\n\
    \n```dockerfile\nRUN pip3 install -r requirement.txt\n```\n\n最后部分是入口点（entry point）命令，这意味着只要你启动容器，就会运行该命令。在运行容器时可以覆盖它，可以在共享代码的\
    \ `README.md` 链接中检查。要执行的命令如下：\n\n```dockerfile\nENTRYPOINT [\"python\",\"Null_Value_Modul.py\"\
    ]\n```\n\nPython 脚本将执行在本节开头定义的任务，即统计每列的空值并生成 CSV 格式的报告，给定一个输入 CSV 文件。执行 `docker`\
    \ 命令以及传递给它们的参数将在共享代码的 `README.md` 文件中讨论。代码链接位于参考文献中的 Docker Image Creation。\n\n\
    # 将镜像作为容器运行\n\n一旦创建了镜像，我们就可以根据需要使用它。从中心仓库（在此例中为 docker hub）提取镜像并运行它的命令位于 `README.md`\
    \ 文件中。命令选项也共享并进行了解释，可能会根据镜像的需求而变化。\n\n通过这些，我们涵盖了如何创建镜像并作为容器运行。然而，当我们运行多个镜像时，特别是当我们为了扩展性训练或部署\
    \ ML 模型时，存在基础设施需求。这就是 Kubernetes (K8s) 出场的地方。我们将在接下来的部分中讨论它们，并尝试对使用它们建立理解。\n\n"
