- raw: "Preface    Building correct machine learning models are a big challenge. Getting\
    \ machine learning models to generate business value are even more challenging.\
    \ Most ML models just get stuck in the experimentation phase and never make it\
    \ to production. This can happen due to poor planning, lack of technical expertise\
    \ and disconnect between data scientists and software engineers, among other reasons.\
    \ As a result, it is imperative to have a set of processes that help in tackling\
    \ these issues.    MLOps, which is a set of practices for deploying and monitoring\
    \ machine learning models efficiently, will help solve a lot of technical challenges\
    \ faced during machine learning projects. But it is also important to have the\
    \ right team as well as a proper business plan for the project to be successful.\
    \ This book will serve as an introduction and as a guide to both, the technical\
    \ and the organizational aspects of machine learning projects.    How the book\
    \ is structured    The book is divided into two parts. The first part talks about\
    \ the organizational and business aspects of machine learning projects. This includes\
    \ topics such as building the right team, defining and validating the idea and\
    \ business plan, exploratory data analysis, and the machine learning lifecycle.\
    \ The second part discusses the technical side of operationalizing machine learning\
    \ projects. You will learn how to train, deploy and monitor ML models in a reliable\
    \ and efficient manner.    How to use this book    It is recommended to read the\
    \ book in the presented order, from beginning to end. You should also try out\
    \ the code samples to better understand the processes involved in building a robust\
    \ machine learning system.  \n\nCode Bundle and Coloured Images    Please follow\
    \ the link to download the  Code Bundle and the Coloured Images of the book: \
