- raw: '  Data preparation    Data preparation is the process of taking the raw data
    and massaging and cleaning it for the consumption of ML algorithms. The step starts
    in the EDA itself and, by the time the EDA completes a clear-cut path for the
    data preparation is laid out, which is one of the most important outcomes of the
    EDA. After the completion of EDA, the feature sets which should be part of the
    model are finalized. There needs to be a mechanism to generate those features
    for the model training, at the same time, produce those features on the ongoing
    basis to score new data.    The high-level process overview of data preparation
    is shown in Figure which will highlight the utility to consider data preparation
    as a separate and important step, as shown as follows:    ![](image-aj685r4f.jpg) 
    Figure 3.2: Data preparation    As shown in Figure the data preparation step is
    important not only for the training, but also after the deployment for scoring
    new data. In the previous chapter, we discussed what all goes into data preparation;
    however, we must repeat exactly the same things when scoring new data.    As an
    example, consider you have five features with missing value and imputation is
    happening by the mean value of each variable. For the two features, you are performing
    the outlier treatment by suppressing the high values to the 95th percentile value
    in those features. Now, when you are training the model, it is straightforward,
    but when new data comes, you can’t use the new mean values for imputation or the
    new 95th percentile value for the outlier suppression. This needs to be the same
    value which has been used for training the model. Due to these steps, the data
    preparation becomes a very important step that needs to be thoroughly thought.   
    The other aspect of data preparation is the feature creation itself. A substantial
    effort goes into feature creation as it requires a lot of creativity and business
    understanding. It happens many a times that the features in one use case can be
    utilized in the other use case as well. For multiple use cases, work happens in
    parallel with the data scientist(s) working on each use case in the silos. This
    leads to a lot of redundant efforts in terms of feature engineering. A couple
    of ways to address this are as follows:     Process alignment for feature creation   
    Utilizing feature store tools    Process alignment for feature creation is to
    construct a table for the most common entities, like customer, product, store,
    and so on, such that, any new feature built should be assigned and updated in
    that table to be utilized for that entity. For example, if we are creating any
    attribute related to the product, like the total product sales per quarter, return
    quantity of that product annually, and so on, it should be stored in a single
    table or file from where it should be picked for model training. There should
    be no other way to pick the features, and if the new features are required, they
    must be added in that table or file(s). A metadata info can be maintained to detail
    out each feature info and make them searchable. This is mainly done using the
    Graph databases, and internally, the data science teams can align with the data
    engineering team as this is something the data engineers do on a regular basis.
    It is a good way to make sure that any entity features created by one data scientist
    is available for the other data scientists too if needed. This avoids duplicate
    efforts and, at the same time, increases the learning as one data scientist can
    utilize a few features which he/she hasn’t thought out themselves.    The second
    way to create one single source for the features is by utilizing the feature store
    tools. A few organizations have been using them successfully for their data science
    practice, for example, Uber with their Michelangelo platform or GoJek with Feast.
    Few of them are open source and the vendors are working to make them platform
    and cloud agnostic. For further details and usage, the feature store website \[1\]
    can be referred, and depending on the requirement, a tool can be chosen for the
    feature store.    The other challenge, which is related to data preparation, is
    the tech stack for data preparation. Since model training happens on the historical
    data, it is not until consumption, that the real challenge of scoring comes into
    the picture. Multiple times, the ML models with excellent results cannot move
    to production because no proper thought has been given on scoring the new data,
    which requires data preparation before being scored by the model. Hence, any challenges
    in scoring new data should also be thought through when working on data preparation.
    This is more of an issue when the real time scoring on the streaming data is required.
    In those scenarios, it becomes very important that whatever scripts and tools
    are utilized, they should be able to consume and process the data in real time.
    Apache Spark, combined with the Apache Kafka messaging service is generally a
    combination used for streaming the data. The Cloud platforms offer their own messaging
    services and platforms for streaming the data; for example, GCP has the dataflow
    tool, which internally uses Apache Beam, and combined with Cloud Pub/Sub, offers
    the same option as Spark and Kafka in combination.    The data preparation step
    is also something which changes over time as it might happen that the features
    which are relevant for predicting the future, become useless and new features
    might become more useful. This can happen due to the reason discussed in the previous
    chapter, and this might lead to a complete change in data preparation or miniscule
    changes. These changes need to be tracked both on the code and the data perspective
    and that is why DevOps, or in case of ML, it becomes MLOps, is a very important
    process. All the steps that are a part of data preparation should be such that,
    it can be traced back, and the results can be reproduced whenever required. Hence,
    DevOps and the version maintenance also becomes an integral part of data preparation
    and the ML framework as a whole.    One difference which is there between data
    preparation for training and scoring new data, is the absence of the dependent
    variable due to an obvious reason, which is, that new data will predict the dependent
    variable.  '
