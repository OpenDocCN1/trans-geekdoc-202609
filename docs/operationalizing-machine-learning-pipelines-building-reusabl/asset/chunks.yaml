- raw: '  Evaluation and monitoring    Evaluating the deployed ML model continuously
    and monitoring it for any drastic dip in the performance is an important step.
    This gives the decision makers the confidence that any decision based on the ML
    model is credible, as it is validated regularly. The evaluation and monitoring
    don’t contribute to the business use case directly, but they work as an audit
    and confidence building block in the ML lifecycle for the end users. The evaluation
    of a model on the ongoing basis will depend on the modeling technique and the
    KPIs used to finalize the performance while deployment. The same KPIs will be
    part of the evaluation. For monitoring purpose, there are multiple ways to achieve
    this process. It can be via an automated mail, using the tools in CI/CD or via
    a reporting tool. The idea is to update the model performance on a regular basis
    with new data and publish it to the end user.    To take an example, consider
    you have solved a binary classification problem about whether a person will purchase
    a car or not if they visit the store. At the time of creating an ML model, let’s
    say we decided AUC and Recall as the KPIs on which the model was finalized. Another
    important thing we need to check is what percentage out of the people visiting
    the store, became customers. We can take multiple timelines and figure out any
    trends. The idea is to get a range estimate, let’s say 10-15% of the total persons
    visiting the store, became customers. Now, equipped with these numbers, once the
    model is deployed and the results are consumed, we need to define a process where
    the historically scored data by the model is compared with the actual result,
    at a predefined frequency. The next step is to calculate the same KPIs, that is,
    the AUC and Recall comparing the performance, where it is right now, in comparison
    with the deployment time performance. The other important step which needs to
    be checked is the percentage of store visitors becoming customers. This will give
    an overall idea of whether there is any change in the target population behavior.
    If this information is in alignment with the historic deviation and the defined
    cutoff, the model is acceptable, otherwise we need to retrain the ML model.   
    Model decay can happen due to multiple reasons, and it is not always the case
    that the business can identify these changes on time. Due to this reason, continuous
    evaluation and monitoring becomes very important. The factor that is generally
    perceived as a good thing, might impact one’s business in a very bad manner and
    vice versa. Just to give an example, let’s say you sell car, and your car satisfies
    the lower financial segment of the customers. Now, if the economic prosperity
    of the country increases, it is a good thing, but the customers might look to
    buy cars which are costly and offers additional benefits. This will impact your
    business in a bad way unless you evolve. This is the sort of info one looks for
    using the data, but it is not a one-time exercise. It needs to be continuously
    done to be on top of things and one needs to understand that the data is generated
    by a process and the process can change over time. To identify any changes in
    the process on time is the whole goal of continuous evaluation and monitoring.   
    Based on the feedback loop of continuous evaluation and monitoring, the next steps
    might be to retrain the model with new data or completely replace the model and
    use case with a new one. If the retraining needs to happen with the new data,
    we don’t want to repeat the whole process from scratch and would want to utilize
    our learning and processes which we have put in place, when we solved the problem
    the first time. Also, we would like to keep track of all the changes we are making
    while solving the use case, over time, including the data. This is where MLOps
    comes into the picture. MLOps constitutes of practices and tools, which helps
    the task of moving the model seamlessly from training to consumption. It also
    contains a provision to continuously monitor the ML models and maintain the version
    of data, code, and artifacts for the audit and future analysis purpose. We will
    discuss MLOps in detail in the following section.  '
