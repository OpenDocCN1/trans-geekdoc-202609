  fmt: "\n# Potential outcome of an idea validation\n\nThere can be different outcomes\
    \ that are based on multiple factors; primarily, the main factors are data and\
    \ the business use cases. In the rush of implementing the data science practices,\
    \ one should not ignore the fact that the available data might not be able to\
    \ give an acceptable answer to the business problem at hand. Multiple business\
    \ problems and quick validation of them with the data will help the organization\
    \ to quickly take a call in the right direction regarding their data strategy.\n\
    \nThere are mainly one of the following three outputs that can be expected for\
    \ any use case:\n\n*   The data is good enough to provide insights into the business\
    \ problem at hand.\n*   The data is insufficient and additional data will be required.\
    \ Additional data can be more attributes of the entity or more entities themselves.\n\
    *   The available data is insufficient to solve any problem. External collaboration\
    \ needs to be there to derive any value out of the data.\n\nThere is a subtle\
    \ difference between the second and the third outcome, that is, in the second\
    \ outcome, you know you need some additional data in terms of quantity or features\
    \ of the existing entities (like a customer, product, and so on), and then you\
    \ might achieve an acceptable outcome; however, in the third outcome, you are\
    \ certain that the data you own alone won't be able to solve any of the business\
    \ problems and we need to collaborate with businesses looking for these types\
    \ of data. A typical example of the third outcome is the IoT companies as they\
    \ generate a lot of sensor data; however, in silos, not much can be achieved out\
    \ of these data points.\n\nThe first outcome would be the ideal outcome, and the\
    \ rest of the books will take the first outcome into consideration. Most of the\
    \ time, organizations spend heavily on resources like cloud subscriptions, data\
    \ lakes, and data scientists/engineers without defining and validating the business\
    \ problems. The problem in this approach is that no one has any clue, in which\
    \ direction they should move, and they want to derive the value on the investment\
    \ made as quickly as possible. This creates a recipe for disaster, and the steps\
    \ discussed in this chapter should be executed properly to avoid such scenarios.\n\
    \nIn the later chapters, we will consider that the organizations have a clear\
    \ business problem defined and have the right data. We will discuss the key practices\
    \ and components that should be available to onboard the use cases faster and,\
    \ at the same time, conduct new experiments for a new business problem.\n\n##\
    \ Conclusion\n\nIn this chapter, we discussed and outlined what constitutes a\
    \ good team structure to establish a data science practice inside an organization.\
    \ There should be a business decision-maker, a product owner, and a data scientist,\
    \ who should work together to identify and prioritize the use cases that will\
    \ have clear ROI and can be solved with the available data. This chapter also\
    \ highlights, at a high level, the thought process behind looking at data for\
    \ a specific problem and making the decision about the problem.\n\nThis chapter\
    \ builds the foundation for all the upcoming chapters in this book, and it will\
    \ be assumed that an organization has done its homework, as mentioned in this\
    \ chapter, before moving on to the next steps.\n\n## Points to remember\n\n* \
    \  Identifying business problems and the person(s) responsible for taking the\
    \ decision on those, is the key for setting a successful ML practice.\n*   The\
    \ team should contain three types of roles for the initial setup of the ML practice\
    \ – Business decision-maker, Product owner, and data scientist.\n*   An individual\
    \ can play multiple roles, and at the same time, multiple people might be required.\n\
    *   Understanding the available data limitations and strengths are critical for\
    \ the use case.\n*   The primary, secondary, and third-party data.\n*   Idea validation\
    \ and potential outcome.\n\n## Multiple choice questions\n\n1. Assume that you\
    \ are working on a project where you have to recommend a product to the customer;\
    \ which of the following role will the sales guy play?\n   a. Business decision\
    \ maker\n   b. Product owner\n   c. Business owner\n   d. None of these\n\n2.\
    \ How is third-party data different from both the primary and secondary data?\n\
    \   a. It is processed data that are available outside the organization.\n   b.\
    \ It is primary data for some organization.\n   c. Combination of primary and\
    \ secondary data\n   d. No difference\n\n3. If you want to analyze and predict\
    \ the electricity consumption of a geography, which bucket will you keep weather\
    \ in?\n   a. Good to have\n   b. Must have\n   c. It can't be established without\
    \ exploration.\n   d. Not required\n\n4. What is the potential outcome of the\
    \ idea validation in the ML?\n   a. The business problem can be solved with the\
    \ current dataset.\n   b. The business problem cannot be solved with the current\
    \ dataset.\n   c. Additional data is required to solve the business problem.\n\
    \   d. Any one of the above.\n\n## Answers\n\n1. b\n2. a\n3. b\n4. d\n\n## Key\
    \ terms\n\n*   **Business decision**: The person who has the authority to make\
    \ a decision, example, sales head, engineer head, and so on, depending on the\
    \ use case.\n*   **Product**: The person who understands the organization business,\
    \ at least the vertical of interest and the data that the organization owns.\n\
    *   **Primary**: The data that the organization owns.\n*   **Secondary**: The\
    \ data, which is available like weather, and so on, as the primary data of some\
    \ other vendor.\n*   **Third party**: The data, which is useful but has to be\
    \ acquired from multiple vendors and processed.\n\n## References\n\n*   `GDPR`:\
    \ `https://en.wikipedia.org/wiki/General_Data_Protection_Regulation`\n*   `HIPPA`:\
    \ `https://www.cdc.gov/phlp/publications/topic/hipaa.html#one`\n*   `PII`: `https://en.wikipedia.org/wiki/Personal_data`\n\
    \n# CHAPTER 2 ML Projects: Lifecycle\n\nIn this chapter, we will discuss the different\
    \ stages of the data science projects and how to manage them. We will also highlight\
    \ the critical outcomes and when the project moves from one phase to another.\
    \ The industry-defined standards and extensions required over and above them for\
    \ the data science projects will also be discussed in this chapter.\n\n## Structure\n\
    \nIn this chapter, we will cover the following topics:\n\n*   Overview\n*   CRISP-DM\n\
    *   CRISP DM extension\n\n## Objectives\n\nAfter studying this chapter, we will\
    \ be able to understand the standard framework for data science `CRISP-DM`, the\
    \ limitation of `CRISP-DM` and the need for extending it, and the details of each\
    \ step under `CRISP-DM` and the extension. We can then start applying these concepts\
    \ in our real-time projects.\n"
  trans: "\n\n# 想法验证的潜在结果\n\n基于多种因素，可能会产生不同的结果；首要的因素因素是数据和业务用例。在急于实施数据科学实践的过程中，不应忽视这样一个事实：可用数据可能无法为眼前的业务问题提供可接受的答案。确定多个业务问题并用数据对它们进行快速验证，将有助于组织就其数据策略在正确的方向上快速做出决策。\n\
    \n对于任何用例，主要可以预期到以下三种输出之一：\n\n*   数据足够良好，可以为当前的业务问题提供见解。\n*   数据不足，需要额外数据。额外数据可以是该实体的更多属性，也可以是更多的实体本身。\n\
    *   可用数据不足以解决任何问题。需要外部协作才能从数据中提取任何价值。\n\n第二种结果和第三种结果之间存在细微的差别，即在第二种结果中，你知道自己在数量或现有实体（如客户、产品等）的特征方面需要一些额外数据，然后你可能会获得满意的结果；然而，在第三种结果中，你确定仅凭拥有的数据无法解决任何业务问题，我们需要与寻找此类数据的业务进行合作。第三种结果的一个典型例子是物联网公司，因为它们产生大量的传感器数据；但在孤立状态下，这些数据点无法取得太大的成就。\n\
    \n第一种结果是理想的结果，其余的书中将优先考虑第一种结果。大多数情况下，组织在没有定义和验证业务问题的情况下，投入大量资源投入到云订阅、数据湖以及数据科学家/工程师等资源上。这种方法的问题弊端在于，没有人知道他们应该向哪个方向移动，而他们想尽可能地从所投入的投资中获得回报。这形成了一个灾难的根源，应该妥善执行本章讨论的步骤以避免此类情况的发生。\n\
    \n在随后的章节中，我们将假设组织已经定义了清晰的业务问题并拥有正确的数据。我们将讨论应该具备的关键实践和组件，以便更快速地启动用例，并同时针对新的业务问题进行新的实验。\n\
    \n## 结论\n\n在本章中，我们讨论并概述了构成在组织内部建立数据科学实践的良好团队结构的要素。应该有一位业务决策者、一个产品所有者和一个数据科学家，他们应该共同工作，识别并优先考虑具有清晰投资回报率（ROI）并可以使用可用数据解决的用例。本章还从高层面上强调了针对特定问题查看数据并对问题做出决策背后的思维过程。\n\
    \n本章为书中后续的所有章节奠定了基础，在进入下一步之前，我们将假设组织已按照本章中所提到的方法完成了他们的准备工作。\n\n## 记忆要点\n\n*  \
    \ 识别业务问题以及对这些问题做出决策的人，是建立成功的机器学习（ML）实践的关键。\n*   在机器学习实践的初始设置中，团队应包含三类角色——业务决策者、产品所有者和数据科学家。\n\
    *   一个人可以扮演多个角色，同时也可能需要多个人参与。\n*   理解可用数据的局限性和优势对于用例来说至关重要。\n*   初级数据、次级数据和第三方数据。\n\
    *   想法验证和潜在结果。\n\n## 选择题\n\n1. 假设你正在参与一个项目，你必须向客户推荐产品；以下哪个角色是销售人员扮演的角色？\n   a.\
    \ 业务决策者\n   b. 产品所有者\n   c. 业务所有者\n   d. 以上均非\n\n2. 第三方数据与初级和次级数据有什么不同？\n   a.\
    \ 它是组织外部可用的处理后的数据。\n   b. 它是某些组织的初级数据。\n   c. 初级数据和次级数据的组合\n   d. 没有区别\n\n3. 如果你想分析并预测某个地区的电力消耗，你会将天气放在哪一类？\n\
    \   a. 有的\n   b. 必须\n   c. 在没有探索的情况下无法\n   d. 不需要\n\n4. 机器学习想法验证的潜在结果是什么？\n  \
    \ a. 使用数据集可以解决业务问题。\n   b. 使用数据集无法解决业务问题。\n   c. 解决业务问题需要额外数据。\n   d. 以上之一。\n\n\
    ## 答案\n\n1. b\n2. a\n3. b\n4. d\n\n## 关键术语\n\n*   **业务决策**：有权决策的人，例如销售主管、工程师主管等，取决于用例。\n\
    *   **产品**：理解组织业务、至少感兴趣的领域以及组织拥有数据的人。\n*   **初级**：组织拥有的数据。\n*   **次级**：可用数据，如天气等，作为其他供应商的初级数据。\n\
    *   **第三方**：有用但必须从多个供应商获取并进行处理的数据。\n\n## 参考\n\n*   `GDPR`: `https://en.wikipedia.org/wiki/General_Data_Protection_Regulation`\n\
    *   `HIPPA`: `https://www.cdc.gov/phlp/publications/topic/hipaa.html#one`\n* \
    \  `PII`: `https://en.wikipedia.org/wiki/Personal_data`\n\n# 第二章 ML 项目：生命周期\n\n\
    在本章中，我们将讨论数据科学项目的不同阶段以及如何管理它们。我们还将强调关键结果以及项目何时从一个阶段移动另一个阶段。本章还将讨论数据科学项目所需的行业定义标准及其扩展。\n\
    \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   概述\n*   CRISP-DM\n*   CRISP DM 扩展\n\n## 目标\n\
    \n学习本章后，我们将理解数据科学的标准框架 `CRISP-DM`、`CRISP-DM` 的局限性及其扩展的必要性，以及 `CRISP-DM` 及其扩展每个步骤的详细信息。然后我们就可以将这些概念应用于我们的实时项目中。\n\
    \n"
