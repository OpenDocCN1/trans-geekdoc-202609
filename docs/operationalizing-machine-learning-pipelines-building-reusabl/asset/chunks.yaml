    ## MSE and RMSE

    Mean Squared Error is also the most used metric. It is also the loss function
    in the least square regression problem. The error (actual minus predicted) is
    squared and then added in `MSE`. The advantage of doing that is that it helps
    magnify the larger errors. The formula to calculate the `MSE` is given as follows:

    ![](image-fibh8593.jpg)

    The variable definition is the same as `MAE`. The unit of the `MSE` is squared
    units; for example, if we are predicting the price of a house in dollars, then
    `MSE` is in dollar squared. This might not be very intuitive, and hence, Root
    Mean Squared Error is used, which is the square root of the `MSE`.


    ## RSquare

    RSquare is calculated as the proportion of the variance that is captured by the
    ML model. The variance is how much values are spread around the mean. To calculate
    the we need to calculate the variance around the average value and the variance
    around the predicted value. The formulas for both are as follows:

    ![](image-xaf9p2pf.jpg)

    The variance around the mean

    The variance around the predicted value

    `µ`: The mean or average of the dependent variable

    All the other variables are the same as in `MAE`. The variance of the model divided
    by the variance around the mean gives the variance not explained by the model.
    Subtracting that from 1 gives the amount of variance explained by the model, and
    hence, the formula for becomes as follows:

    ![](image-ylbqzn78.jpg)

    Generally, the value of is between 0 and 1, with the mean value as the base line
    model. In case, a model is doing worse than the mean of the values, we get negative.


    ## Predicted versus actual plot

    The predicted versus the actual plot is a way to visualize your model performance,
    as shown in Figure 7.1 as follows:

    ![](image-9ajkishm.jpg)

    Figure 7.1: Predicted versus actual

    The predicted versus the actual plot is another way to visualize the performance
    of the regression model.


    ## Classification metrics

    So far, we have discussed the regression metrics and KPIs, which is one type of
    a supervised learning problem. The other set of supervised learning is classification,
    and we will discuss in detail the KPIs to measure the performance of these models.
    Before we jump into the metrics themselves, we need to understand the confusion
    matrix which enables us to calculate these KPIs or metrics.


    ### Confusion matrix

    Confusion matrix is a tabular structure or a two-dimensional matrix. On one axis,
    you plot the actual value, and on the other you plot, the predicted. In Figure
    the horizontal axis is predicted, and vertical axis is true or the actual values,
    as shown as follows:

    ![](image-6ck7flp7.jpg)

    Figure 7.2: Confusion matrix

    The confusion matrix is for binary classification; however, the concept can be
    extended for multiclass classification. Zero and One, in this case, are flags
    or categories of interest; for example, a customer is a churner or not or someone
    is going to buy with a yes or no flag. In case of a customer churn, the records
    where the customers are churning are considered as a positive example and where
    they are not churning, as a negative example.


    The following terms are associated with confusion matrix:

    - **True Positives**: These are cases where we predicted the positive class, and
    the case belongs to the positive class.

    - **True Negatives**: These are cases where we predicted the negative class, and
    the case belongs to the negative class.

    - **False Positives**: These are cases where we predicted the positive class,
    but the case belongs to the negative class.

    - **False Negatives**: These are cases where we predicted the negative class,
    but the case belongs to the positive class.


    In multi class, these values can be calculated using one vs all the logic converting
    it into a binary problem; for example, if we have three categories like cat, dog
    and rabbit, to calculate the above four values for the ‘cat’ class, you can take
    cat as 1 and dog and rabbit as 0. We will show the multiclass confusion matrix
    in the Python notebook for this chapter.


    The important thing to note is that the confusion matrix can change for the same
    output depending on the probability cutoff selected. The default is 0.5 for the
    probability cut-off in the `sklearn` package for binary classification. Anything
    below that is treated as a negative class and above that as a positive. Depending
    on the business problem, this probability cutoff can be altered. The other metrics
    derived from the confusion matrix are discussed in the upcoming sections.


    ### Accuracy

    Accuracy is calculated as the percentage of records correctly predicted out of
    the whole data. Based on the confusion matrix discussed earlier, accuracy is given
    by the following formula:

    ![](image-e76tvv5f.jpg)

    This formula is applicable for the binary classification problem. For multiclass,
    the numerator is the sum of the diagonal value of the confusion matrix by the
    total number of records in the data.


    ### Precision

    Precision is how many positive records are correctly predicted out of all the
    positive predicted value. The formula for precision is given as follows:

    ![](image-2db1e5cq.jpg)

    In case of multiclass, the sum of the column belonging to the class of interest
    becomes the denominator and the intersection of the row and column of the class
    of interest becomes the numerator, based on the confusion matrix. An example is
    shown in the Python Notebook shared on GitHub for this chapter.


    ### Recall

    Recall is the percentage of records correctly predicted out of all the positive
    records in the data. The formula for recall is given as follows:

    ![](image-ixwgt6p1.jpg)

    In case of multiclass, the sum of the row belonging to the class of interest becomes
    the denominator and the intersection of the row and column of the class of interest
    becomes the numerator, based on the confusion matrix.


    ### F-n Score

    F-n score is a way of combining precision and recall. The formula to calculate
    the F-n score is shown as follows:

    ![](image-wxttbn2u.jpg)

    Here, the values of n is a hyperparameter and a higher value of n, means more
    weightage to Recall. The most common F-n score is the F1 score where precision
    and recall have the same weight.


    ### ROC and AUC

    Receiver Operating Characteristic Curve is an import from signal processing into
    the ML world. The ROC curve is created by plotting the true positive rate against
    the false positive rate at the various probability cut-off. The true-positive
    rate is recall, which we calculated earlier. Sensitivity is also another word
    used for recall or true-positive rate. The false positive rate is calculated by
    subtracting the true negative rate that is specificity from 1. The formula for
    specificity is as follows:

    ![](image-y1cw7n2n.jpg)

    Once you create the plot, it will be shown as illustrated in Figure as follows:

    ![](image-dq0r46uq.jpg)

    Figure 7.3: ROC

    AUC stands for Area Under and it is the area under the ROC plot. The maximum value
    of AUC is 1. The interpretation of AUC is how good the model is distinguishing
    the positive class from the negative one. The higher the value, the better the
    model.


    ### Matthews Correlation Coefficient (MCC)

    In all of the metrics discussed earlier, apart from ROC/AUC, we only consider
    the performance of the positive class or put more weightage to it. In cases where
    it is equally important to identify both the positive and the negative classes
    correctly, MCC is a good metrics to measure. The value of MCC is between ‒1 and
    1, where ‒1 means each of the class is predicted wrongly and 1 means the model
    is predicting everything correctly. 0 means the predictions are random. The formula
    for MCC is shown as follows:

    ![](image-wfvmddvv.jpg)

