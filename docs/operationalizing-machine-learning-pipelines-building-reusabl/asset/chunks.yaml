- raw: '  Storage    Storage is meant for storing all the artifacts, including the
    data, that are utilized or are the output of the ML model. Unlike the typical
    software cycle, where only the code is maintained, in the ML world, a lot of additional
    artifacts need to be saved to replicate the model. This is where the storage becomes
    very important and MLOps plays an integral role in maintaining the version of
    the data. We will discuss the versioning and operational aspect later in MLOps;
    however, we need to define storage in terms of requirement. Storage is any centralized
    location where the data, utilized for model creation, can be stored and can be
    accessed for audit purpose. Other than the data, a lot of artifacts, for example,
    the model binary or graph, any data standardization binary, and so on needs to
    be stored.    For an example of why storage is important, consider you created
    the ML model predicting the loan approval to be given to a customer or not, based
    on certain features. It might happen, that the historical data you used is gender
    biased, and the females are getting very low approvals or none, due to the biased
    historical data. These sort of things, at times, are not visible immediately,
    and the model might be giving an acceptable performance till a certain point in
    time, and when the performance deteriorates, you try to find out the reason. Unless
    the data, on which the model is created, is not available, it becomes difficult
    to reason out why the model performance deteriorated. Although, a few industries
    have a very stringent process of moving the model to production, there is always
    a chance that something might be missed. Due to this reason, it is very important
    to save the data on which the model is created. However, unlike the codes, the
    data files are huge and needs separate and advanced ways to be saved and versioned.
    This will be discussed in the MLOps section, where we will elaborate the process
    and give examples of tools that can be utilized.    Apart from data versioning,
    there are a lot of artifacts which are part of the ML model creation, for example,
    the KPIs on which the model was finalized, the variables/feature values which
    are used for standardization or imputation, and so on. The values or logic, which
    is used for preparing the data, would remain the same for the ongoing process
    of scoring new data if the model utilized remains the same. For the new ML model,
    there might be a change or not, depending on the data processing. Generally, these
    values or logic (if it can’t be written in code) need to be saved somewhere, so
    that they can be picked when processing the new data for scoring.    Each model
    will generate its own set of metadata and will have its own set of data on which
    it is trained. Also, overtime model will be retrained on the new data and the
    new metadata will be generated. Hence, to make sure that there is adequate space
    available and the correct metadata is referred, we need to have both the right
    processes setup and an adequate amount of memory available. Since, this is ever
    growing, and will evolve depending on the maturity of data science in the organization,
    there are a couple of ways to handle this – first way is to create a shared drive
    which can be mounted as per the need; the second option is to utilize the cloud
    storage, like GCS or AWS buckets. The cloud option is the better one, as you don’t
    have to pay for the hardware in advance and you pay only for what you use. Also,
    the cloud storage will scale automatically.    We have investigated the need for
    storage and the ways we can go ahead with the storage. For any ML model, once
    it passes the initial cutoff and standards, it needs to be deployed for regular
    consumption. This is the topic we will discuss in the following section, where
    we will talk about deploying the ML model for scoring the new data and what sort
    of thought process should we go through in the deployment, depending on the scoring
    need.  '
