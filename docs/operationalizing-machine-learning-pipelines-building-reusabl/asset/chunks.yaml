  trans: "\n\n# 前言\n\n构建准确的机器学习模型是一项巨大的挑战。而让机器学习模型产生业务价值则更具挑战性。大多数机器学习模型仅停留在实验阶段，从未进入生产环境。这可能是由于规划不当、缺乏技术专长以及数据科学家与软件工程师之间的脱节等原因造成的。因此，拥有一套有助于解决这些问题的流程是非常关重要的。\n\
    \nMLOps 是一套用于高效部署和监控机器学习模型的实践方法，它将帮助解决机器学习项目过程中面临的许多技术挑战。但拥有正确的团队以及恰当的业务计划对于项目的成功也至关重要。本书将作为机器学习项目在技术和组织两个方面的介绍和指南。\n\
    \n## 本书的结构\n\n本书分为两个部分。第一部分介绍了机器学习项目的组织和业务方面。这包括诸如：组建合适的团队、定义和验证想法及业务计划、探索性数据分析以及机器学习生命周期等主题。第二部分讨论了机器学习项目运行化的技术方面。你将学习如何以可靠且高效的方式训练、部署和监控机器学习模型。\n\
