    # Deployment


    The model needs to be deployed for scoring new data. It can be on premise or on
    cloud, depending on the need and the resource availability. Deployment of the
    ML model happens once the performance is validated, and all the stakeholders are
    aligned and the KPIs are up to the expectation. In deployment, a few things that
    needs to be satisfied are as follows:


    - Latency should be as small as possible, especially for real time application.

    - Platform should scale for the data and requests

    - Easy to use and should be secure and have high availability.


    We will discuss these points in detail; however, before the model is deployed,
    the important question to ask is, how will the scoring of new data happen, that
    is, whether the streaming data will come in real time and need to be scored and
    consumed in real time or will it be a batch job which will run at the predefined
    frequency and store the scored data for consumption. These questions help in determining
    the best way a model can be deployed to save the cost while fulfilling the requirement.


    ## Real-time Application


    For the real time application, the most important aspect is to score the new data
    as soon as possible and give the result to the downstream process. For that purpose,
    providing a `REST API` for the deployed model is the best way. To do that, the
    easiest way is by deploying the model on the cloud platform like the `GCP AI platform`
    or `AWS Sagemaker`. The other way to do it is, the on-premises deployment and
    create the APIs, of which, one way is using `Flask` in `Python`. A few additional
    things need to be done to make sure that the model is available 24/7 and can handle
    multithreading, while using `Flask`. It can be achieved by using `Gunicorn` and
    `Nginix` combined with `Flask`. An additional and a much better way to do that
    is by using `Kubernetes` to deploy the model using tools like `Seldon`. The advantage
    of using `Kuberenetes` is that any downstream process can also be deployed on
    `Kuberenetes` for scaling.


    ## Batch Processing


    Batch processing in comparison to real time or stream data scoring is simple.
    In this case, the only thing we need to be careful about is the amount of data
    that will be processed in one time when scoring. For this purpose, the model needs
    to be deployed in such a way that the platform should scale as per the data needed
    in case it is not known in advance. The platform which can auto scale on cloud
    like the `Apache Spark` services by `GCP` and `AWS` are suitable for such a job.
    The best way is to load the model binary directly into the job and utilize the
    parallel processing of `Spark` to score the new data. Choosing the right flavor
    of `Spark` is important, as the binaries created in the language like `Python`
    or `R` will support that language only. We can use the same services for batch
    and stream processing; however, some platforms offer a limit in the number of
    requests handled at one time, and hence in those scenarios, you can use the platform
    like `Spark`.


    ## Versioning and Maintenance


    All the preceding solution for model deployment that were discussed, handle the
    issue of latency, scaling, and security. They also offer an easy way to use the
    model endpoint. The deployment of the model needs to be versioned as the model
    decay over time and is updated accordingly. The business decisions are made based
    on the model(s) output, and hence, for audit and reference purpose, the model
    version needs to be maintained. A few platforms offer inbuilt capability in their
    platform for maintaining the model version. In the absence of the platform capabilities,
    proper process and practice needs to be in place to version the model deployed
    and backtrack the scored data, such as which model version scored that data. We
    will discuss the process part in the MLOps section in detail.


    ## Consumption


    The deployment of the ML model is the final step in that data science use case;
    however, it might be only one of the few steps for solving the business problem.
    To solve the business problem, either we need to combine multiple models’ output
    or massage the output from a single model. This step is more aligned with the
    business and what the business decision makers are looking as the output for the
    whole exercise. This step is called `consumption` and we will explore this in
    the following section with a few examples.

    '
  trans: '


    # 部署


    模型需要部署以对新数据进行评分。根据需求和资源可用性，模型可以部署在本地或云端。在模型性能通过验证、所有利益相关者达成共识且 KPI 达到预期后，即可对机器学习模型进行部署。在部署过程中，需要满足以下几点：


    - 延迟应尽可能小，特别是对于实时应用而言。

    - 平台应根据数据和请求进行扩展。

    - 易于使用且应确保安全并具有高可用性。


    我们将详细讨论这些点；但在模型部署之前，需要提问的关键问题是：新数据的评分将如何进行？也就是说，流式数据是实时进入并需要实时评分和消费，还是按预定义的频率运行并存储评分数据供消费的批处理作业？这些问题有助于确定模型的最佳方式，以便在满足需求的同时节省成本。


    ## 实时应用


    对于实时应用，最重要的一方面是尽早对新数据进行评分并将结果传递给下游流程。为了实现这一目标，为部署的模型提供 `REST API` 是最好的方法。做到这一点，最简单的方法是将模型部署在如
    `GCP AI platform` 或 `AWS Sagemaker` 等云平台平台上。另一种方法是进行本地部署并创建 API，其中一种方法是在 `Python`
    中使用 `Flask`。在使用 `Flask` 时，还需要完成一些额外工作以确保模型 24/7 可用并能够处理多线程。这可以通过结合 `Gunicorn`、`Nginix`
    和 `Flask` 实现。另一种更好的方法是使用 `Kubernetes` 配合 `Seldon` 等工具来部署模型。使用 `Kuberenetes` 的优势是任何下游流程也可以部署在
    `Kuberenetes` 上进行扩展。


    ## 批处理


    与实时或流数据评分相比，批处理要简单得多。在这种情况下，我们唯一需要注意的是评分时一次处理的数据量。为了实现这一目的，模型的部署方式需要确保在无法预知的情况下，平台能够根据数据需求进行扩展。云端可以自动扩展的平台，如
    `GCP` 和 `AWS` 的 `Apache Spark` 服务适用于此类工作。最好的方法是将模型二进制文件直接加载到作业中，并利用 `Spark` 的并行处理对新数据进行评分。选择正确的
    `Spark` 版本非常重要，因为在 `Python` 或 `R` 等语言中创建的二进制文件将仅支持该语言。我们可以对批处理和流处理使用相同的服务；但某些平台对一次处理的请求数量有限制，因此在这些情况下，可以使用像
    `Spark` 这样的平台。


    ## 版本控制与维护


    之前讨论的所有模型部署解决方案都解决了延迟、扩展和安全性问题。它们还提供了易于使用的模型终端。模型的部署需要进行版本控制，因为模型会随着时间的推移而衰减并相应地更新。业务决策是基于模型的输出做出的，因此，为了审计和参考目的，需要维护模型版本。一些平台在其内部内置了维护模型版本的功能。在缺乏平台功能的情况下，需要建立适当的流程和规范对部署的模型进行版本控制，并追溯评分数据（例如是哪个模型版本对数据进行了评分）。我们将在
    MLOps 部分详细讨论流程部分。


    ## 消费


    机器学习部署是该数据科学用例的最后一步；但它可能只是解决业务问题的少数步骤之一。要解决业务问题，我们要么结合多个模型的输出，要么对单个模型的输出进行加工。这一步更贴合业务，也符合业务决策者对整个活动输出的期望。这一步被称为
    `consumption`（消费），我们将在接下来的章节中通过几个示例进行探讨。


    '
