- raw: '  MLOps    MLOps stands for Machine Learning Operations and is in line with
    DevOps of the typical software development. However, unlike DevOps, in MLOps,
    there are a lot of things other than the code, which needs to be taken care of
    and the KPIs are not only software specific, but each problem brings its own set
    of KPIs. MLOps as a process starts after EDA. EDA is more experimental in nature
    and hence putting a process around that will be challenging. However, after EDA,
    everything should follow a process and should be done in such a way that it can
    be backtracked and repeated, if required. The other important thing that MLOps
    should enable is a seamless process from training a model until the consumption
    of the model. The evaluation and monitoring should also be part of the MLOps.
    To summarize everything, apart from EDA, all other aspect of ML use case should
    be part of MLOps.    For the reproducibility of a model, we need the data on which
    the model was trained. In the age of big data, these files can be huge and can’t
    be stored in a similar manner as the code. For that, we need a separate mechanism
    which can be achieved in multiple ways. One way is to store the model in a folder
    on a central repository with the folder structure of something like UseCase/Version/datafile
    and making sure the scripts moving the model for deployment, moves the relevant
    data in this folder. At the same time, this process has been made very easy by
    tools like DVC, which extend the Git functionality by providing the files which
    store the metadata and location detail of the data on which the model was trained.
    The important thing is to put a process in place such that any model moving for
    deployment and its related data can be versioned and tracked. The choice of using
    a tool is completely based on the requirement and availability.    While establishing
    the MLOps process, we need to make sure that any artifacts, binaries, or graphs
    that are generated are also stored and versioned. Generally, the model binaries
    and graphs are saved; however, if you are doing any standardization of variable
    or any processing which is not dependent on the code, those artifacts need to
    be stored. As an example, consider that you are normalizing all the continuous
    variable for your model training using the mean and standard deviation. Since
    the new data needs to be normalized using the old values only, we need to store
    these values. One way is to use some inbuilt library which in turn will generate
    a binary that can be used later. This way, there are many small artifacts apart
    from the model itself which will be generated. They also need to be stored and
    utilized accordingly. The way the data is saved and stored, these artifacts can
    follow the same process. For tracking purpose, there are a few tools available,
    like MLFlow, which provide a dashboard, with the information of the model trained
    with their metadata.    For training, test, deployment, and consumption, most
    of the things are done via code. The code needs to be versioned, but that is not
    a challenge as that is happening for quite some time and many tools are available
    for the same, with Git being the most popular one. A few things which need to
    be taken care of while maintaining the code is to connect it to any artifact that
    they generate like the ones discussed earlier – docker images and so on. One way
    to do that is to attach the git commit id to the artifact, which is assigned to
    the code that generated the artifact. The important thing is to put a process
    in place so that everything can be backtracked and reproduced. As we speak, there
    might be some tool which will make your task easier; all you need is to ensure
    that you know what all is required.    Unlike the typical software where you automate
    the test cases and based on that the code move to a higher environment, in the
    ML world, everything happens on the production data. There can be a separate environment
    where the production data can be provided, so that the experiments can be conducted
    on the production data without disturbing the production environment. Since, all
    the things are conducted on the production data, the concept of moving the code
    to a higher environment is only for reference. It is the artifacts like model
    binaries and any other related data processing binaries that move from development
    to production in case of ML for deployment. The consumption part is something
    which sits and runs in the production environment utilizing all the artifacts
    which move as part of the deployment. Training the ML model can be a costly affair
    in terms of resources, so sometimes, an intermediate step is inserted between
    the development and deployment for more control. This step can be called as training
    or staging. Figure 3.5 highlights the steps that happen in model training to deployment,
    and this can be used in setting up your process, as shown as follows:    ![](image-f6d1vmzp.jpg) 
    Figure 3.5: Multistage training deployment    Overall, the MLOps process should
    be setup in such a manner that it enables the reproducibility and, at the same
    time, make the whole ML lifecycle as smooth as possible. We also need to be careful
    about a few places in the ML lifecycle (like interpreting the KPIs, which are
    the output of model training and testing) that needs to be interpreted manually
    and the process and tool selection should be such that it enables the manual intervention.
    As an example, it might be that for a certain set of problem, an AUC of 0.7 is
    good and the model gets to be deployed and consumed. Similarly, another problem,
    with the same AUC might not be good enough to be deployed. There can be multiple
    reasons for that, and these things need to be sorted out manually with reasoning
    and logic. The process should keep the provision for that, as these reasonings
    will happen between different stakeholders, but once the approval or rejection
    happens, the next steps can be smooth and clear. There are a lot of developments
    in terms of tools to enable MLOps; however, a thorough understanding of the ML
    lifecycle can enable you to design a better process.    Another aspect as to why
    MLOps is very important is because of the retraining of the ML model. We would
    not want to start from scratch for the use case which are already productionized.
    Starting from scratch again will slow down the whole process and it might happen
    that by the time the model reaches production, it is outdated. Therefore, the
    whole process should be carefully devised and put in place, so that it fulfills
    all the requirements discussed in this section. Figure 3.6 shows the tools and
    one of the ways in which the overall end-to-end MLOps process can be achieved;
    however, these tools can be changed as per the choice and availability, as shown
    as follows:    ![](image-p4yiwcxi.jpg)  Figure 3.6: MLOps overview with tech stack   
    As shown in the preceding figure, we are highlighting an end-to-end MLOps process
    with the tools in place. We will discuss what all the components are and their
    use, as follows:     Data which is used for training and validating the model   
    Codes which are utilized to perform the task    GitHub which is used for version
    maintenance and CI/CD process    DVC Version which is used for maintaining the
    data version for all the experiments    ML Training, after approval, where the
    training will happen, for example, GCP AI Platform, Kubernetes cluster or Spark
    engine, and so on    KPIs to highlight the performance of the model, CML integrates
    with Git to display the KPIs via Git    After approval, the model to be deployed
    for consumption    Deployed model metadata, like version number, data location,
    and so on in some table. This information can be used for audit and reproducibility.   
    The approval process and all the steps can be automated using GitHub Actions for
    CI/CD, including the approvals. Also, as mentioned, these tools are for reference
    purpose and can be changed, as per availability.  '
