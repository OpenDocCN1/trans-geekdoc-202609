    \ There are two main kinds of Polyaxonfile specifications – component and operation.\
    \ We will be looking at the component Polyaxonfiles.\n\nThe component `Polyaxonfile`\
    \ can take a lot of parameters as input. The following are some of the most important\
    \ ones:\n- The Polyaxon specification version. This is usually set to `Component`\
    \ or `operation`.\n- A description of the component which can be used to easily\
    \ filter the components on the dashboard.\n- User arguments to be given while\
    \ running the component. It has the following sub parameters:\n    - `name`\n\
    \    - `type`\n    - The default value of the argument\n    - A flag telling whether\
    \ the argument is optional.\n- The run-time specification of the component. It\
    \ has the following sub parameters:\n    - Type of training job (single machine\
    \ or distributed)\n    - Specifications of the main Kubernetes container that\
    \ will run the training job.\n\nThere are several other parameters too. Their\
    \ details can be found in the official Polyaxon documentation.\n\n## Submitting\
    \ a training job\nWe execute the `polyaxon run` command to submit the training\
    \ jobs. Look at the following example:\n\n```bash\npolyaxon run -f polyaxonfile.yml\
    \ -l\n```\n\nThis will start a training job based on the details specified in\
    \ the `-f` flag. The `-l` flag prints the logs on the terminal. `polyaxon run`\
    \ can take several other arguments. These can be found by running the following\
    \ command:\n\n```bash\npolyaxon run --help\n```\n\n## Training a regression model\n\
    In this section, we will train a regression model to predict the median value\
    \ of houses in the Boston suburbs. We will be training a random forest regressor\
    \ using the Scikit Learn library. Let’s first check out the model training code.\
    \ We will be discussing the various Polyaxon commands required to properly track\
    \ our jobs. There are two ways to leverage the Polyaxon Tracking API – Tracking\
    \ Module and Tracking Client. We will be using the Tracking Module.\n\nIn a machine\
    \ learning project, there are three basic things that need to be tracked to compare\
    \ the experiments – training data, hyperparameters, and performance metrics. The\
    \ performance metrics help us gauge which models are performing better, while\
    \ tracking the training data and hyperparameters can help us understand why a\
    \ particular model performed better or worse. In this example, we will be tracking\
    \ the following.\n\n### Tracking data\nTo track the training data, we use the\
    \ `log_data()` function. It takes two primary arguments. We will be able to view\
    \ and download this data from the Artifacts tab, as shown in Figure 6.2.\n\n###\
    \ Tracking hyperparameters and metrics\nPolyaxon provides a very simple method\
    \ to track all hyperparameters and metrics using the `log_params()` function.\
    \ This data is then made available in the Params tab, as shown in Figure 6.3.\
    \ To log the other metrics, we can use the `log_metrics()` function.\n\n### Tracking\
    \ Keras experiments\nPolyaxon makes it very easy to track the metrics after each\
    \ epoch during training. This can be achieved by using the `PolyaxonCallback()`\
    \ callback while calling the `fit()` function. By default, it logs the loss and\
    \ the metrics specified while compiling the model. Polyaxon also automatically\
    \ creates curves for these values.\n\n### Logging model file\nLogging model files\
    \ is a two-step process. We first need to write the model to disk using any serialization\
    \ library. Next, we can log the model file using the `log_model()` function.\n"
  trans: "\n\n# Docker 镜像我们将创建一个 Docker 镜像并将其推送到 Docker Hub。我们将将其推送到一个公共访问的仓库。Polyaxon\
    \ 也支持私有仓库。集成私有仓库的步骤可以在 Polyaxon 官方文档中找到。我们应该为该镜像创建以下三个文件：\n- `model.py`\n- `requirements.txt`\n\
    - `Dockerfile`\n\n这些文件可以在 https://github.com/MLBook-VJ/polyaxon-examples 找到。由于我们已经在上一章中构建并推了\
    \ Docker 镜像，因此在这里我们将会跳过这些细节。`model.py` 文件包含了像任何典型模型训练代码的代码，但额外包含几行代码帮助跟踪模型的输入、输出和指标。我们将在构建回归模型和图像分类模型时，更深入地查看此文件。\n\
    \n## Polyaxonfile\n`Polyaxonfile` 是任何 Polyaxon 训练任务中最重要的组件。它包含了任务应如何运行的规范。Polyaxon\
    \ 文件可以使用 YAML、JSON 和 Python 编写，部分可以使用 Go、Typescript 和 Java 编写。我们将使用 YAML 来编写我们的\
    \ `Polyaxonfiles`。Polyaxonfile 规范主要有两种类型：组件（component）和操作（operation）。我们将查看组件级\
    \ Polyaxonfile。\n\n组件级 `Polyaxonfile` 可以接受很多参数作为输入。以下是最重要的几个参数：\n- Polyaxon 规范版本。这通常设置为\
    \ `Component` 或 `operation`。\n- 组件的描述，可用于在仪表板上轻松过滤组件。\n- 运行组件时提供的用户参数。它具有以下子参数：\n\
    \    - `name`\n    - `type`\n    - 参数的默认值\n    - 告知该参数是否为可选的标志。\n- 组件的运行时规范。它具有以下子参数：\n\
    \    - 训练任务的类型（单机或分布式）\n    - 将运行训练任务的主 Kubernetes 容器的规范。\n\n还有其他几个参数。它们的细节可以在\
    \ Polyaxon 官方文档中找到。\n\n## 提交训练任务\n我们执行 `polyaxon run` 命令来提交训练任务。看下面的示例：\n\n```bash\n\
    polyaxon run -f polyaxonfile.yml -l\n```\n\n这将根据 `-f` 标志中指定的细节启动训练任务。`-l` 标志会在终端上打印日志。`polyaxon\
    \ run` 还可以接受其他几个参数。可以通过运行以下命令找到这些参数：\n\n```bash\npolyaxon run --help\n```\n\n\
    ## 训练回归模型\n在本节中，我们将训练一个回归模型来预测波士顿郊区房屋的中位数。我们将使用 Scikit Learn 库训练一个随机森林回归器。让我们先查看模型训练代码。我们将讨论为了妥善跟踪任务而所需的各种\
    \ Polyaxon 命令。利用 Polyaxon 跟踪 API 有两种方式：跟踪模块（Tracking Module）和跟踪客户端（Tracking Client）。我们将使用跟踪模块。\n\
    \n在机器学习项目中，有三项基础内容需要被跟踪以比较实验——训练数据、超参数和性能指标。性能指标帮助我们判断哪些模型的表现更好，而跟踪训练数据和超参数可以帮助我们理解为什么某个模型表现更好或更差。在这个示例中，我们将跟踪内容。\n\
    \n### 跟踪数据\n为了跟踪训练数据，我们使用 `log_data()` 函数。它接受两个主要参数。我们可以如图 6.2 所示，从 Artifacts（产物）标签页中查看并下载这些数据。\n\
    \n### 跟踪超参数和指标\nPolyaxon 提供了一种非常简单的方法，使用 `log_params()` 函数跟踪所有的超参数和指标。这些数据随后将在\
    \ Params（参数）标签页中显示，如图 6.3 所示。为了记录其他指标，我们可以使用 `log_metrics()` 函数。\n\n### 跟踪 Keras\
    \ 实验\nPolyaxon 使得在训练过程中每个 epoch 之后的指标变得非常简单。这可以通过在调用 `fit()` 函数时使用 `PolyaxonCallback()`\
    \ 回调来实现。默认情况下，它会记录编译模型时指定的损失和指标。Polyaxon 还会自动为这些值创建曲线。\n\n### 记录模型文件\n记录模型文件是一个两步过程。首先，我们需要使用任何序列化库将模型写入磁盘。接下来，我们可以使用\
    \ `log_model()` 函数记录模型文件。\n\n"
