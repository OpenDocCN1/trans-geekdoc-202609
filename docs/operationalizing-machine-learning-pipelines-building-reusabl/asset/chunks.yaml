- raw: "  Docker image    We will be creating a docker image and pushing it to Docker\
    \ Hub. We will be pushing it to a publicly accessible repository. Polyaxon also\
    \ supports private repositories. The steps for integrating the private repositories\
    \ can be found in the official Polyaxon documentation.    We should create the\
    \ following three files for this image:     model.py    requirements.txt    Dockerfile\
    \    These files can be found at https://github.com/MLBook-VJ/polyaxon-examples\
    \    As we have already built and pushed a Docker image in the previous chapter,\
    \ we will be skipping those details here.    The model.py file contains the code\
    \ like any typical model training code, but with a few additional lines which\
    \ help in tracking the model inputs, outputs, and metrics. We will be taking a\
    \ deeper look into this file when we build our regression and image classification\
    \ models.  \n\n  Polyaxonfile    The Polyaxonfile is the most important component\
    \ of any Polyaxon training job. It contains the specifications on how a job should\
    \ run. The Polyaxon files can be written in YAML, JSON, and Python, and partially\
    \ in Go, Typescript, and Java. We will be using YAML to write our Polyaxonfiles.\
    \ There are two main kinds of Polyaxonfile specifications – component and operation.\
    \ We will be looking at the component Polyaxonfiles.    The component Polyaxonfile\
    \ can take a lot of parameters as input. The following are some of the most important\
    \ ones:     The Polyaxon specification version. This is usually set to    Component\
    \ or operation    A description of the component    These can be used to easily\
    \ filter the components on the dashboard    User arguments to be given while running\
    \ the component. It has the following sub parameters:     name    type    The\
    \ default value of the argument    A flag telling whether the argument is optional\
    \    The run-time specification of the component. It has the following sub parameters:\
    \     Type of training job (single machine or distributed)    Specifications of\
    \ the main Kubernetes container that will run the training job     There are several\
    \ other parameters too. Their details can be found in the official Polyaxon documentation.\
    \  \n\n  Submitting a training job    We execute the polyaxon run command to submit\
    \ the training jobs. Look at the following example:    Polyaxon run \\-f polyaxonfile.yml\
    \ \\-l    This will start a training job based on the details specified in The\
    \ \\-l flag prints the logs on the terminal. polyaxon run can take several other\
    \ arguments. These can be found by running the following command:    polyaxon\
    \ run –help  \n\n  Training a regression model    In this section, we will train\
    \ a regression model to predict the median value of houses in the Boston suburbs.\
    \ We will be training a random forest regressor using the Scikit Learn library.\
    \ Let’s first check out the model training code. We will be discussing the various\
    \ Polyaxon commands required to properly track our jobs.    There are two ways\
    \ to leverage the Polyaxon Tracking API – Tracking Module and Tracking Client.\
    \ We will be using the Tracking Module.    In a machine learning project, there\
    \ are three basic things that need to be tracked to compare the experiments –\
    \ training data, hyperparameters, and performance metrics. The performance metrics\
    \ help us gauge which models are performing better, while tracking the training\
    \ data and hyperparameters can help us understand why a particular model performed\
    \ better or worse. In this example, in addition to the training data and performance\
    \ metrics, we will also be logging the model file itself.    To begin tracking,\
    \ we need to first initialize the tracking object. This is done by simply calling\
    \  \n\n  Tracking training data    To track the training data, we use the log\\\
    _data\\_ref() function. It takes two primary arguments – content and name. The\
    \ argument names are self-explanatory. We will be able to view and download this\
    \ data from the Artifacts tab in the Lineage section, as shown in Figure 6.2 as\
    \ follows:    ![](image-kvs4tuiv.jpg)  Figure 6.2: Polyaxon dashboard – Artifacts\
    \ store  \n\n  Tracking hyperparameters and metrics    Polyaxon provides a very\
    \ simple method to track all the hyperparameters and performance metrics related\
    \ to a regression model using a single function – The function takes the regression\
    \ model and the testing data as inputs. It calculates four metrics – maximum error,\
    \ explained variance score, R2 score, and mean squared error – and then logs them\
    \ along with the models hyperparameters, as follows:    log\\_regressor(model,\
    \ X\\_test, y\\_test)    This data is then made available in the Params tab in\
    \ the Lineage section, as shown in Figure 6.3 as follows:    ![](image-83fro7ox.jpg) \
    \ Figure 6.3: Polyaxon dashboard –model performance    To log the other metrics,\
    \ we can use the log\\_metrics function, as follows:    log\\_metrics(metric1=value1,\
    \ metric2=value2)  \n\n  Logging the model file    Logging the model files is\
    \ a two-step process. We first need to write the model to disk. This can be done\
    \ using any serialization library (for example, and so on). Next, we can log the\
    \ model file using the following log\\_model function:    log\\_model(model\\\
    _file\\_path, name, framework)    After this, we will be able to download the\
    \ model file from the Artifacts tab in the Lineage section.    Now that the model\
    \ training code is ready, we can build and push our Docker image to Docker Hub.\
    \ We can then create our Polyaxon file and start training the model.  \n\n  Submitting\
    \ a training job    As discussed earlier, to submit a training job, we will use\
    \ the polyaxon run command. Now, we also have two optional arguments that the\
    \ training job can take, n\\_estimators and To supply values to these, we will\
    \ make use of the \\-P argument, as follows:    polyaxon run \\-f polyaxonfile.yml\
    \ \\-l \\-P n\\_estimators=120 \\-P max\\_depth=7    Once the job has been submitted,\
    \ we will be able to view it on the dashboard, as shown in Figure 6.4 as follows:\
    \    ![](image-ppdptngk.jpg)  Figure 6.4: Polyaxon dashboard – experiment run\
    \ details    We can click on the button beside the job ID to view the job in detail.\
    \ To check the status of the job, we can go to the Status section from the sidebar.\
    \    Next, we will take a look at how we can use GPUs to train a deep learning\
    \ model for image classification.  \n\n  Training an image classification model\
    \    In this section, we will train a deep learning model to classify the handwritten\
    \ digits from the MNIST dataset using Keras. We’ll take a look at how to do the\
    \ following:     Track Keras experiments    Provision GPUs on Google Kubernetes\
    \ Engine    Use GPUs while training on Polyaxon    The rest of the steps are the\
    \ same as in the previous section.  \n\n  Tracking Keras experiments    Polyaxon\
    \ makes it very easy to track the metrics after each epoch during training. This\
    \ can be achieved by using the PolyaxonCallback() callback while calling the fit()\
    \ function. By default, it logs the loss and the metrics specified while compiling\
    \ the model. Polyaxon also automatically creates curves for these values. Along\
    \ with this, the callback also logs the hyperparameters, stdout/stderr outputs,\
    \ hardware consumption, and model files.  "
