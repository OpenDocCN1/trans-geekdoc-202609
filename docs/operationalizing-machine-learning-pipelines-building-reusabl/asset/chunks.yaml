    \ context of creating reusable components. This will lay the first building block\
    \ of training at scale and building reproducible experiments.\n\n## Container\n\
    \nA `container` packages the application in such a manner that it is isolated\
    \ from the environment (operating system) in which it is running. The way they\
    \ differ from `VM` is the `VM` share hardware, but each `VM` has its own operating\
    \ system. A `Container` is self-sufficient and many containers with different\
    \ requirements can run on the same operating system or server. Containers are\
    \ built based on images, either by running the same, or extending it as per the\
    \ need and then running it. There are multiple ways to create the images and run\
    \ the container, the most popular being `Docker`.\n\n## Docker\n\n`Docker Inc.`\
    \ is the organization which provides a whole suite of software and services which\
    \ is utilized to create the containers and save the images. We will mainly focus\
    \ our discussion on the `docker desktop` and `docker hub`. Loosely speaking, people\
    \ refer to everything as `docker`, however, each product/service is for a different\
    \ purpose. We use the `docker desktop` for creating images and running the container\
    \ on one’s machine, whereas the `docker Hub` is used for saving the images on\
    \ cloud from where they can be pulled for a later requirement. We will discuss\
    \ each of these in details in the upcoming sections.\n"
  trans: "\n\n# 结论\n\n在本章中，我们亲手处理了数据并理解了数据。我们研究了探索不同类型变量和不同图表的方法，以及如何解释它们。最后，我们研究了如何压缩重要的信息和洞察，并将其传递给利益相关者。我们需要记住，并不是所有的可视化和洞察对利益相关者来说都有用且符合他们的兴趣。我们涉及了在向业务部门传递结果时需要注意的所有事项。在下一章中，我们将更深入地讨论模型训练细节，并学习如何跟踪实验，以便将最终模型部署到生产环境中。\n\
    \n## 需要记忆的点\n\n- `EDA`（&mdash;探索性数据分析）在业务问题确定后开始。\n- 数据可视化应该是简单且易于理解的。\n- 从 `EDA`\
    \ 中产生的所有洞察可能对业务没有用。对洞察进行优先级排序至关重要，否则可能会导致信息过载。\n- 在传达洞察时应考虑到业务问题和实用性；这可能会引发业务部门的进一步查询并提供价值的输入。\n\
    \n## 单选题\n\n1. 直方图的作用是什么？\n   - 检查围绕均值/平均值周围的分布\n   - 检查围绕中位数周围的分布\n   - 检测离群值\n\
    \   - 以上均不是\n2. 数值型变量的 `IQR` 或四分位距是什么？\n   - 均值与中位数之间的差\n   - 第三四位数与第一四位数之间的差\n\
    \   - 中位数乘以 2。\n   - 均值减去（1.5*标准差）\n3. `EDA` 中基线模型的作用是什么？\n   - 了解数据的预测能力。\n \
    \  - 为该问题识别最佳算法集。\n   - 识别预测因变量的重要特征。\n   - 以上都是。\n\n## 答案\n\na, b, d\n\n## 核心术语\n\
    \n数据离均值的程度，标准差的平方。\n\n## 参考文献\n\n代码与数据 - `https://github.com/MLBook-VJ/EDA`\n\n\
    # 第 5 章训练与测试 ML 模型 – 第一部分\n\n在上一章中，我们讨论了 `EDA` 以及从 `EDA` 中产生的洞察，以及如何传达这些洞察。在 `EDA`\
    \ 完成后，如果结果是积极，我们将开始训练模型并验证其性能。我们将讨论为什么以及如何模型训练与 `EDA` 分离开来，尽管我们在 `EDA` 期间已经训练了一个模型。我们还将探索模型训练的挑战，如硬件要求、数据版本控制和实验细节。本章还将重点介绍为什么云平台更适合大规模模型训练。我们将通过两组不同的问题进行训练实践，以强调训练模型的不同方式，即使用\
    \ `CPU` 和 `GPU` 进行训练。我们还将讨论在组织内部为大规模模型训练应启用什么样的基础设施。\n\n在本章中，我们将讨论技术细节，包括 `container`（容器）、`Kubernetes`（`K8s`）和\
    \ `Polyaxon`。`Polyaxon` 是一个构建在 `K8s` 之上的平台，用于构建、训练和监控大规模机器学习和深度学习项目。我们将利用 `Polyaxon`\
    \ 的社区版，它是开源的，可以安装在公司内部或云 `K8s` 集群上。我们将使用 `Google Cloud Platform` 作为我们的 `K8s` 集群。我们将在本章和下一章中涵盖\
    \ `Polyaxon` 的设置并理解 `Polyaxon` 平台。我们将在下一章涵盖训练内容，这是本章的延续。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\
    - 概述\n- `Container`\n- `Kubernetes`\n- `GCP`\n- `Polyaxon`\n- `Polyaxon setup`\n\
    \n## 目标\n\n学习本章后，你将能够利用 `EDA` 结果来训练模型，并开发一种用于机器学习模型训练大规模实验的机制。我们将讨论拥有灵活基础设施的必要性，以便数据科学家以成本优化的方式进行实验和训练模型，而无需过多考虑基础设施的限制。我们将使用\
    \ `Google` 作为云提供商，但如果有人想使用其他云供应商或内部 `K8s` 集群，我们将提供参考。`K8s` 的使用使得所有工作流容器化成为必然，我们将讨论容器化的优势。`Polyaxon`\
    \ 平台非常庞，我们将根据需要涵盖相关部分。如果想对自己的设置进行任何修改或增强，可以参考 `Polyaxon` 文档。\n\n## 概述\n\n如今组织拥有海量数据；他们希望利用数据做出更好的决策，优化流程，从而增加利润和价值。为了做到这一点，组织需要快速处理和分析数据。现在，在\
    \ `EDA` 之后，如果结果理想，我们将训练 ML 模型，当我们说模型时，考虑到的是整个组织范围内数百个或更多的规模。为了实现这一点，我们需要支持模型训练的基础设施。云平台更适合这种设置，因为它具有按需付费的特性，并能解决一次性的需求。此外，使用云比内部搭建可以节省大量的运营成本，但研究内部与云的损益超出了本书的范围。我们将在创建复用组件的背景下理解\
    \ `container`、`images` 以及 `Docker` 的作用。这将为大规模训练和构建可重复实验奠定第一个基石。\n\n"
