  trans: "\n\n# 数据准备\n\n数据准备是指对原始数据进行处理和清洗，以供机器学习（ML）算法消费的过程。这一步骤于探索性数据分析（EDA）本身，当\
    \ EDA 完成时，一条清晰的数据准备路径就已经铺设完成，这是 EDA 最重要的成果之一。在 EDA 完成后，应作为模型部分的特征集就确定了。需要一种机制为模型训练生成这些特征，同时持续地产生这些特征，以便对新数据进行评分。\n\
    \n数据准备的高级流程概述如图所示，该图强调了将数据准备视为一个独立且重要步骤的意义，具体如下：\n\n![](img/image-aj685r4f.jpg)\
    \ \n**图 3.2: 数据准备**\n\n如图所示，数据准备步骤不仅对训练重要，对于模型部署后对新数据进行评分同样重要。在上一章中，我们讨论了数据准备包含的所有内容；然而，在对新数据进行评分时，我们必须完全重复相同的操作。\n\
    \n例如，假设你有五个具有缺失值的特征，并正通过每个变量的平均值进行填充。对于其中两个特征，你正在通过将高值抑制到这些特征的第 95 百位数来执行离群值处理。现在，当你训练模型时，这很直接；但当新数据到来时，你不能使用新的平均值进行填充，或使用新的第\
    \ 95 百位数进行离群值抑制。这必须与训练模型时使用的值相同。由于这些步骤的存在，数据准备变成了一个需要深思熟虑的重要步骤。\n\n数据准备的另一个方面是特征创建本身。特征创建投入大量精力，因为它需要大量的创造力和业务理解。在很多情况下，一个用例中的特征也可以用于另一个用例。对于多个用例，工作是并行的，数据科学家在各自的孤岛中工作。这导致了特征工程方面大量的重复工作。解决此问题的方法如下：\n\
    \n## 特征创建的过程对齐\n\n特征创建的过程对齐是为了为特征构建单一源，例如 `customer`、`product`、`季度销售`、`年度数量`等。这样做主要是为了确保用于训练的特征与用于评分的相同。由于模型训练是在历史数据上进行的，直到消费阶段，评分的真正挑战才会出现，这要求在模型评分之前进行数据准备。如果需要新特征，必须将其添加到该表或文件中。\n\
    \n可以维护元数据信息以便于搜索。这主要通过图数据库实现，并有助于数据科学团队定期与数据工程师保持对齐。这是确保任何一个数据科学家创建的特征其他其他人也能使用的良好方法。这避免了重复性工作，同时也增加了数据科学家的学习收获。\n\
    \n## 利用特征存储工具\n\n创建和管理特征的另一种方法是利用特征存储（feature store）工具。一些机构已成功地将它们用于数据科学实践，例如\
    \ `Uber` 使用其 `Michelangelo` 平台或 `GoJek` 使用 `Feast`。其中一些是开源的，且供应商正努力使其具备云无关性。有关更多细节和用法，可以参考特征存储\
    \ [1]，并根据需求选择合适的特征存储工具。\n\n## 数据准备的技术栈\n\n与数据准备相关的另一个挑战是技术栈。由于模型训练是在历史数据上进行的，直到消费阶段，评分的真正挑战才会出现。许多时候，结果出色的\
    \ ML 模型无法进入生产环境，是因为没有对新数据进行评分进行充分的考虑，而评分需要数据准备。因此，在进行数据准备时，也应该彻彻考虑新数据评分的任何挑战。在需要对流式数据进行实时评分的场景，这个问题尤为突出。在这些情况下，无论使用什么脚本和工具，它们都能够实时消费并处理数据。`Apache\
    \ Spark` 结合 `Apache Kafka` 消息服务通常是数据流数据的组合。云平台提供自己的消息服务和平台；例如，`GCP` 拥有 `dataflow`\
    \ 工具，它内部使用 `Apache Beam`，并结合 `Cloud Pub/Sub`，提供了与 `Spark` 和 `Kafka` 相同的选项。\n\n\
    数据准备步骤也是随时间而改变的，因为用于预测未来的特征可能会变得无效，而新特征可能会变得更有用。这可能是由于上一章讨论的原因引起的，并可能导致数据准备的完全改变或微小变化。这些变化需要从代码和数据两个维度进行跟踪，这就是为什么\
    \ DevOps（或者在机器学习中是 MLOps）是一个非常重要的流程。\n\n## 训练与评分数据准备的区别\n\n训练数据与新数据评分的数据准备之间的一个区别在于，由于一个明显的原因——缺少因变量，因为新数据将用来预测因变量。\n\
    \n"
