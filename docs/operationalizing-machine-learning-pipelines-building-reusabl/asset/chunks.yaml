    # Data identification and collection


    After the business problem(s) is identified, the next step is to break the business
    problem into a data problem. This step needs someone who understands the organization''s
    internal data, also known as the primary data, that is available. They also need
    to be aware of any secondary data that is available, like demography statistics,
    weather, and so on, and any third-party data that can be acquired.


    In case a data scientist has enough business experience, he/she can complete the
    task on his own. Otherwise, a product owner, with the help of a data scientist,
    should accomplish this task. The data is generally spread across multiple data
    warehouses and applications. The secondary and third-party data also needs to
    be ingested in one place. For continuous analysis, the data needs to be in one
    place, but for the initial exercise, these data can be manually collected from
    multiple sources. Once the business value is highlighted from the data, it will
    give enough value to create a centralized data lake. However, most organizations,
    without having a clear vision of how they will utilize the data, are going ahead
    and creating a data lake, which is not a bad practice, but it is always better
    to have something to justify the need.


    Identification of the relevant data is easier said than done and involves a lot
    of time and resources. For example, consider that someone wants to identify whether
    a customer will churn; in this case, the relevant data can be the transactional
    details of the customer, product details, and so on, which are easily available
    in the organization. At the same time, the mean salary of the customers living
    in a particular zip code, or the economic health of the city of the customer,
    and so on, are good information to have as they can add value, but these might
    not be readily available with the organization. In this scenario, it becomes important
    to differentiate the data set into the following three buckets:


    *   **Must have data.**

    *   **Good to have data.**

    *   **Data whose relevancy can''t be established without exploration.**


    The must-have data is required to start exploring the solutions for the business
    problem. The good-to-have data is where all the stakeholders are aligned; that
    data will give additional information to solve the problem but is not a showstopper,
    especially in the idea validation phase. Then, there are data that might have
    an impact or might not but can''t be commented on without a thorough exploration
    of the business problem at hand. The same dataset can change the bucket for different
    problems at hand; for example, the weather data might be a must for a specific
    problem and can fall in the good to have or needs to be explored bucket for another
    set of problems in the same organization.


    The exercise of identifying the relevant data is time-consuming, and a lot of
    analysis is required, like checking the data quality and the data utility for
    the problem at hand. There are tools like `Python` and `R` and techniques (which
    we will discuss in the later chapters) to do that, and a data scientist must be
    well versed with these tools and techniques. Once the data is finalized, the next
    step is idea validation, which we will discuss in the following section. The goal
    of idea validation is to check the performance via selecting the right KPIs and
    deciding the way to move forward.


    # Idea validation


    Idea validation is a common practice before the full-fledged product development
    starts. In the data science projects, we need to follow a similar approach. Once
    we are done with the business problem identification and data identification,
    we need to quickly formulate the problem around the data and prepare the data.
    Of course, at times, there might be several challenges depending on the industry
    and the regulation in data collection.


    The first step is to obtain the data in such a manner that you follow all the
    regulations, for example, and so on, and at the same time, avoid that is, the
    data is properly encrypted. These things need a proper system in place, which
    is beyond the scope of this book, but in case these systems are not in place,
    make sure these things can be done on an ad-hoc basis as quickly as possible.


    After the data is available, Exploratory Data Analysis (discussed in detail in
    a later chapter) should be done. The challenges the data poses and any sort of
    insight that can be derived from the data, keeping the problem statement in mind,
    should be explored. This core task is performed by a data scientist. When the
    insights are available, all the stakeholders should be involved, and the insights
    should be communicated in a language that every stakeholder understands. This
    is important because, based on the insights and its understanding, each stakeholder
    provides the input. The input impacts the course of action in handling the problem
    or, in certain scenarios, changes the problem itself. This is where it gets very
    challenging for the data science project compared to the typical product development.
    With this into account, the goal of the idea validation is to provide a high-level
    insight into what can be expected and how good the results will be for a particular
    problem, given the data is finalized. This should also be tried out for multiple
    business problems identified, as it might happen that you can have satisfactory
    results for a few, and for others, you need more data or rework on the problem
    itself. Once equipped with this information, it gives the leaders a clear-cut
    edge in investing and building a data platform where an ROI can be easily seen.
    The steps to move forward after idea validation are discussed later in the following
    chapters in detail, but if there is no clear direction, this step should be performed,
    just to check the hypothesis and its feasibility. With the computational resources
    available on-demand on the cloud, you don''t need to invest too much upfront unless
    a clear direction and ROI on that is easily available to justify the investment
    further on building the resources, both computational and human.

