    # 概述

    机器学习（ML）项目会经历不同的阶段/步骤，且每个阶段都至关重要。为了开始下一步，上一步应该应该产生一些可操作的输出。随后的章节将讨论这些阶段中的每一个。其核心思想是定义一个功能性框架，使其涵盖机器学习项目生命周期的所有方面，并具有可管理性。目前存在一些行业定义的标准，如
    `CRISP-DM`、领域驱动数据挖掘等。我们将在下一节中详细讨论 `CRISP-DM`。


    随着数据科学范式的不断演进，以及几乎所有行业都在通过数据来创造价值，`CRISP-DM` 框架需要扩展。我们将详细讨论为什么需要扩展 `CRISP-DM`
    框架。在解释该框架时，我们将结合几个行业示例来解释每个阶段的具体内容，以便于理解。其核心思想是为整个行业定义一个清晰的运营流程概述。这应该是必须的，以便让数据科学用例的每个阶段都能被分解为这些实用的步骤。此外，这将使我们能够针对每个阶段确定正确的个人/团队以及所需的工具包。


    本章的结果将为设计机器学习和数据科学技术框架时所有需要考虑的功能方面奠定基础。


    # CRISP-DM

    `CRISP-DM` 代表跨行业数据标准过程（Cross-Industry Standard Process for Data）。它是一个开放的标准过程模型，描述了数据挖掘专家使用的常用方法，涵盖了整个行业通的高级步骤。如所述，它是一个开放标准，因此可以被扩展并开放使用。`CRISP-DM`
    制定于 1996 年，后来成为欧盟的一个项目，由五家公司领导——Integral Solutions Ltd, Daimler NCR 和 Figure。图
    2.1 可视化了构成 `CRISP-DM` 的所有步骤，如下：


    ![](img/image-a9t6ax9s.jpg)

    图 2.1: `CRISP-DM`


    如强调，根据 `CRISP-DM`，数据科学项目的六个步骤或阶段如下：

    - 业务理解（Business understanding）

    - 数据理解（Data understanding）

    - 数据准备（Data preparation）

    - 建模（Modeling）

    - 评估（Evaluation）

    - 部署（Deployment）


    所示，根据这些阶段的发现，某些步骤会来回移动。我们将在随后的章节中结合适当的示例讨论每一个步骤。


    ## 业务理解

    参考图 2.2，它展示了业务理解的概述，如下：


    ![](img/image-swk4kae6.jpg)

    图 2.2: 业务理解概述


    业务理解在上一章中讨论过。然而，在之前的图片中，这些方面是基于数据科学家的背景来处理的。一旦有了特定问题，数据科学家将启动项目，并应该对以下问题有清晰的答案：

    - 问题陈述是什么？

    - 谁需要该问题的答案？

    - 为了让决策者（第二个问题的答案）能够使洞察具有可操作性，预期输出是什么？


    为了回答这些问题，数据科学家需要与业务决策者或产品所有讨论可用的数据集，并根据他们是否有任何数据需求提供建议。理想情况下，拥有具备业务理解的数据科学家是最好的，但情况并非总是如此；因此，产品所有提供数据相关的输入变得至关重要。


    举个例子，业务需求可能是增加客户收入。该问题可以通过多种方式解决，例如留住现有客户、向现有客户进行推销/交叉销售，或获取新客户。基于优先级排序练习，假设优先实施推销/交叉销售。在此阶段，数据科学家应该清楚地了解，一旦任何方案准备就绪，它将如何被消费。此外，该特定示例中解决方案的其他细节还包括提供建议的频率、应该在
    SKU 级别还是在其他聚合产品类别上进行等。其核心思想是尽可能多地收集信息，以提供一个可以被业务决策者直接的解决方案。


    如业务理解后的图中所强调的，下一步是数据理解。然而，在数据理解之后，我们可以再次回到业务理解。这只是为了强调 `CRISP-DM` 框架支持重新访问之前的阶段。在业务理解之后，问题陈述和相关数据应该是清晰的。数据科学家将进入下一个阶段，即数据理解。


    ## 数据理解

    确定业务问题后的下一步是数据理解。数据理解的第一步是将所有相关数据收集并处理到一处。下一步是在考虑业务问题的同时对数据进行分析。分析数据是主观的，在很大程度上取决于分析数据的个人。然而，有一些需要完成的标准步骤，我们将在接下来的章节中探索这些步骤。


    我们在上一章中接触了数据理解，但那时只是在检查可行性，即是否可以使用现有数据回答问题。在这里，我们谈论的是一个完整的项目，并将相关数据本身收集到一处。分析可用数据量所需的计算能力和数据框架也是需要考虑的关键因素。我们将在接下来的章节中解决这个问题。


    此练习的第一个结果是关于可用数据的质量；例如，数据的时间范围、缺失值、离群值、数据分布、分类变量中的唯一值等。在理解数据时，应该与业务部门进行持续讨论，以便像缺失值或离群值处理等挑战可以在整个练习过程中得到解决。同时，还可以探索变量之间的相关性、多重共线性等额外洞察，并对数据以及生成该数据的过程建立充分理解。一旦数据理解完成，对于预测什么或因变量，以及应该利用什么数据或自变量来预测因变量，应该是清晰的。数据理解完成后，下一步是数据准备。


    '
