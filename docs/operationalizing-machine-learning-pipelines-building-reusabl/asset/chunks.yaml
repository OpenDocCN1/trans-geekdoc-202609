- raw: "  Conclusion    In the first two chapters, we covered all the logical steps\
    \ that are required for successfully accomplishing the data science project. In\
    \ this chapter, we discussed all the tech stack and the framework which should\
    \ be available inside an organization for the successful implementation and practice\
    \ data science. We covered the tools which can be part of each functionality of\
    \ the ML framework. The idea of this chapter is to highlight a generic framework\
    \ and provide the kind of functionality that should be available to enable a seamless\
    \ data science pipeline for all the steps in the ML lifecycle. The tools we have\
    \ highlighted in this chapter are one of the many tools which are available in\
    \ the market. At the same time, new tools are coming very quickly in the market\
    \ and hence, one needs to be well informed, but if you are aware of the functionality\
    \ that you need, finding the tools is not difficult. The idea is to understand\
    \ the functionality that is needed for the ML lifecycle and then choose the tools\
    \ to fulfill each functionality, in the best possible way.    Now, that we have\
    \ covered every component of the ML framework and all the individual tasks and\
    \ functionality that needs to be accomplished in the data science project, we\
    \ will study the details of each individual task.    In the next chapter, we will\
    \ start with EDA and see how EDA is done, based on the use case(s).  \n\n  Points\
    \ to remember     ML Framework should support every stage of the ML lifecycle.\
    \    EDA is not part of MLOps but everything else in the ML Lifecycle should be\
    \ done via MLOps.    Cloud is recommended for ML, as it can take a lot of adhoc\
    \ infra requirement, which optimizes the cost and time.    Reproducibility and\
    \ Back traceability of each step in the ML Lifecycle is the key. The MLOps process\
    \ should enable both.    The ML framework should scale for both training and prediction\
    \ of new data.    Continuous evaluation of the model is necessary to proactively\
    \ monitor the model performance over new data. It also helps boost the end-user\
    \ confidence on the model output.    The ML Framework should be able to handle\
    \ both the real time and the batch data.  \n\n  Multiple Choice Questions    \
    \ How does cloud help in EDA? Select all that applies.     Provides provision\
    \ for adhoc infra    Provides multiple way to implement ML    Automates the EDA\
    \    Cost optimization    Why is data versioning an integral to MLOps?     Reproducibility\
    \ of ML model    For audit purpose    For good model quality    a and b    Why\
    \ do we need the staging/training stage in between the development and production\
    \ of the ML model training while implementing MLOps?     It offers the option\
    \ for manual intervention before and after the ML experiment run    It improves\
    \ model performance    Training is a costly operation    None of the above   \
    \ Why is the Consumption step is required in the ML Lifecycle?     Model output\
    \ cannot be consumed by the business directly    The business might need the output\
    \ combined from multiple models    Only a particular set of model output is of\
    \ interest to the business    All of the above    For batch prediction, which\
    \ is/are the most important factor(s) that needs to be considered while choosing\
    \ a service:     Latency    Scalability    Cost    All of the above    Storage\
    \ is used to save the data utilized for model training. What other artifacts is\
    \ storage used to save?     Model binaries and graphs    Any preprocessing binaries\
    \    Any output file that needs to be used in the future    All of the above \
    \ \n\n  Answers     a    d    a    d    d    d  \n\n  Key terms     The process\
    \ to operationalize the ML lifecycle, including automation and reproducibility.\
    \    The data version control, utilized with Git for version maintenance of the\
    \ data.    Continuous Machine Learning, utilized with Git for extending the functionality\
    \ to display the KPIs and graphs on GitHub/Gitlab.  \n\n  Reference     https://www.featurestore.org/\
    \  \n\nCHAPTER 4    Data Exploration and Quantifying Business Problem    In the\
    \ previous chapters, we discussed both the functional and the technical requirements\
    \ to enable the ML practice successfully in an organization. In this chapter,\
    \ we will go into the details and discuss, define, and convert a business problem\
    \ into a data problem. For this purpose, we will create a hypothetical business\
    \ problem and use a public data set. We will go through the data and start with\
    \ EDA, and while doing that, cover a few aspects of EDA with the Python codes.\
    \ We will also learn how to highlight the finding and communicate the findings\
    \ with the stakeholders. After quantifying the business problem, we would try\
    \ out some ML algorithms, just to get the sense of performance and define a way\
    \ to move forward. This chapter will have Python coding, but we will also explain\
    \ the output and how to infer the output.  \n\n  Structure    In this chapter,\
    \ we will cover the following topics:     Overview    Business problem and dataset\
    \    EDA    Feature engineering    Baseline model    EDA result communication\
    \  \n\n  Objectives    After studying this chapter, you will be able to look into\
    \ a business problem with all the data available and quantify the business problem\
    \ into a data problem. In the process of doing that, we will do EDA on the data\
    \ and see a few of the aspects of EDA. EDA depends a lot on the problem and data\
    \ at hand, and also on the individual who is performing the task. EDA also accommodates\
    \ a lot of adhoc questions that are asked by the stakeholders, hence it is a very\
    \ broad process. Our goal here is just to give an idea on how that is done, and\
    \ what thoughts goes into EDA. EDA covers a lot of visualizations, so that the\
    \ data can be easily understood. For that purpose, we will detail out some graphs\
    \ and show how to interpret them. The thumb rule is to always keep the graphs\
    \ simple and self-explanatory.  "
  fmt: "\n# Conclusion\n\nIn the first two chapters, we covered all the logical steps\
