- raw: "  Numerical data analysis    For the numerical data analysis, we will utilize\
    \ a few standard plots, and we will discuss them in detail. But before proceeding\
    \ further, we would like to enquire if there are any missing data in the dataset.\
    \ For that, we have to run the command and get the following output, as shown\
    \ in Figure 4.3 as follows:    ![](image-qci73c7p.jpg)  Figure 4.3: Null value\
    \ check    As we can see, there are no missing values in the data; however, that\
    \ is not the case most of the times. The missing data imputation is a very broad\
    \ topic in itself and we need to take care of the missing data before reaching\
    \ the ML model stage. First, we will look into the univariate analysis and then\
    \ we will look into bivariate.  \n\n  Histogram    The histogram plots the frequency\
    \ of the numeric variables by binning or bucketing them in numeric ranges. It’s\
    \ a very good way to visualize the spread of the data and know whether the data\
    \ is skewed. For all the numeric variable in the base table, the histograms are\
    \ shown in Figure as follows:    ![](image-t9h79qnj.jpg)  Figure 4.4: Histogram\
    \    Some of the important and visible insights coming out of the data of the\
    \ preceding plots are as follows:     CPI doesn’t have any value between 145 and\
    \ 175\\.    The weekly sale is right skewed with values between 0 and 100000 covering\
    \ the maximum data.    The temperature is almost normally distributed.    These\
    \ are a few of the insights which the data scientist can utilize while formulating\
    \ the hypothesis.    Boxplot    Boxplots are another way to explore the numeric\
    \ data. The histogram shows the spread of the data based on the mean or average\
    \ at its center, while a boxplot takes the median at its center. It divides the\
    \ data in two, based on the quartile range. Figure 4.5 highlights the boxplot\
    \ on the Temperature column, as shown as follows:    ![](image-qe09ttuo.jpg) \
    \ Figure 4.5: Boxplot    The values below q1 are the bottom 25% values and the\
    \ value above q3 are the top 25% values. The values between q3 and q1 are the\
    \ middle 50% values. The Interquartile Range (IQR) can be used to calculate the\
    \ whiskers which are q3+1.5\\*(IQR) for the top, and q1-1.5\\*(IQR) for the bottom.\
    \ IQR is q3-q1, where q3 is the top quartile, q2 is the median or second quartile,\
    \ and q1 is the first quartile. Anything beyond the whiskers is treated as the\
    \ outliers. Outliers are a broad topic, and there are multiple ways to explore\
    \ them, including the business input. While doing EDA, the outlier treatment should\
    \ also be finalized, and boxplot offers one very easy way for looking at the numerical\
    \ data.    Heatmap    Heatmaps are a great way to analyze the range of data, rather\
    \ than the exact values, when the high and the low needs to be highlighted. One\
    \ important usage to highlight the correlation plot is shown in Figure 4.6 as\
    \ follows:    ![](image-qaex0f0v.jpg)  Figure 4.6: Heatmap    As shown in the\
    \ preceding figure, we have color coded our heatmap as Yellow-Green-Blue, for\
    \ the lowest to highest value, respectively.  \n\n  Categorical data analysis\
    \    The categorical data can be visualized for their counts or the percentage\
    \ of presence across each category in the overall data. A couple of ways to visualize\
    \ the data is shown in the following section.    Bar chart    Bar chart, on very\
    \ basic level, shows the count of a particular variable across each category.\
    \ It can be seen in Figure which highlights the plots for the IsHoliday variable\
    \ which is the Boolean type and Type which is the type of store.    ![](image-evrxt6b3.jpg) \
    \ Figure 4.7: Bar chart    Pie chart    Pie chart is another way to represent\
    \ the data; however, this is not recommended when the cardinality is very high.\
    \ The approach to visualize the data should always be to highlight the key insights\
    \ as simple as possible, and when the cardinality is high, the pie chart becomes\
    \ ambiguous. Refer to Figure 4.8 that highlights the Pie Chart as follows:   \
    \ ![](image-efixkkfs.jpg)  Figure 4.8: Pie Chart  \n\n  Bivariate/multivariate\
    \ analysis    So far, we have seen the graphs to analyze only single variables.\
    \ Now, we will discuss a few graphs, which can handle two or three variables and\
    \ we can infer the relationships between these variables.    Scatter plot    To\
    \ show two numerical variables on the same plot and see if there exists any relationship\
    \ between them, we use scatterplot. Figure 4.9 highlights shows the scatter plot\
    \ between Size and Weekly as follows:    ![](image-fzymdt2t.jpg)  Figure 4.9:\
    \ Scatter plot    As we can see, there is no particular relationship visible,\
    \ and that is what even the heatmap with the correlation shows – none of the numerical\
    \ columns are correlated. One thing which the scatter plot can highlight at times\
    \ is the non-linear relationship, which cannot be inferred from the correlation\
    \ values.    Clustered boxplot    The Clustered boxplots are similar to boxplot,\
    \ but the plots are divided by some categorical column. We can see the Size by\
    \ Type column in Figure where Size is numeric, and Type is categorical, as shown\
    \ as follows:    ![](image-enc7v26q.jpg)  Figure 4.10: Clustered box plot    It\
    \ is clearly visible that store type A are the largest store size and store type\
    \ C are the smallest, with type B in the middle. It is also interesting to note\
    \ that there is one outlier in type A and a couple of them are in type    Stacked\
    \ bar chart    The stacked bar chart is utilized when we want to analyze two categorical\
    \ variables at once. Figure 4.11 shows the Type and IsHoliday variable together,\
    \ as shown as follows    ![](image-pf2jj15c.jpg)  Figure 4.11: Stacked bar plot\
    \    We can see that the count of IsHoliday is low across all the stores, which\
    \ is in line with the overall IsHoliday count. This plot should be used only with\
    \ two or three stacked categories, otherwise it leads to ambiguity.    Line chart\
    \ across categories    The line charts can be used to see a trend, as shown in\
    \ Figure 4.2 earlier. Similarly, we can see the trend across multiple categories,\
    \ as shown in Figure 4.12 as follows:    ![](image-r7ju0lbf.jpg)  Figure 4.12:\
    \ Line graph across categories    As seen in Figure the seasonality is not there\
    \ for the store type    The preceding plots cover most of the basic ways that\
    \ the data can be explored. There are many other fancy plots and packages that\
    \ can be utilized to visualize the data, and those should be explored apart from\
    \ the ones shown here. However, the only thing that one should be careful about\
    \ in plots and graphs is that the key insight should come out as soon as one looks\
    \ at the graph.    While doing EDA, all the graphs and insights you find might\
    \ not be useful to the business; it should be filtered out and should be presented\
    \ to the business in such a manner that it makes sense. We will see a few examples\
    \ in the EDA result communication.  "
