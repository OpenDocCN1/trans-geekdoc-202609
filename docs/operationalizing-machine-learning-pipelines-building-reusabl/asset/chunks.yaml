    # ML 框架


    图 3.1 显示了 ML 框架并突出了其关键组件。接下来，我们将讨论其中的每一个组件，并理解它们在 ML 用例生命周期中的作用，如下所示：


    ![](img/image-70m6p8c3.jpg)


    图 3.1：ML 框架


    如前面的图片所示，框架中包含多个组件。我们将讨论每个组件及其用途。我们还将为每一步推荐工具，同时介绍在选择工具时需要考虑的挑战。我们还将讨论 `CRISP-DM`
    框架中每个组件的用途，包括扩展部分。


    ## 数据源


    我们将从数据源开始。与任何数据科学或 ML 用例一样，其核心思想是利用可用数据，因此可用数据源是 ML 框架的第一部分。数据源与 ML 框架中其他组件的一个区别是，在大多数时候，数据科学家是终端用户，不会参与数据源的设计。然而，理解数据在组织内部是如何存储的以及收集和存储的过程至关重要。同样，理解存储的数据是如何生成的（即数据生成过程），这一过程被假设作为业务理解的一部分已经完成。


    存储在某处的数据是组织利用数据的重要资产。所有组织都有数据，但大多数时候的挑战在于数据存在“数据孤岛”中。为了解决业务问题利用数据，我们必须整合来自多个地方的数据。这是一个两步过程，如下：


    1. 将来自多个源的数据汇聚到一个地方。

    2. 合并/处理数据以解决业务问题。


    第一步是创建数据流水线和作业，以定期更新目标环境或数据源中的数据。这可能涉及数据合并，更多偏向于数据处理侧。第二步则更贴合业务需求，如报告、分析等。


    第一步可以大致分为两个步骤：摄取（Ingestion）和存储（Storage）。在摄取阶段，通过创建数据流水线来吸收来自不同位置的所有数据。这些数据可以来自
    `IoT` 环境中的多个传感器，可以是来自数据仓库系统的每日批处理加载，也可以是应用程序实时生成的数据。每种数据类型都需要不同的处理方式；例如，对于流式数据，需要一种消息服务，这可以通过
    `Apache Kafka` 或同类的云工具（如 `GCP Pub/Sub` 或 `AWS SNS`）实现。同样，存储之前的处理可以通过 `Apache Spark/Beam`
    或云端的同等服务完成。


    存储是摄取之后的下一步，在存储摄取的数据时应格外小心。这是因为数据可能被用于多种用途，而数据的存储方式有其自身的优点和局限性。例如，对于更新频率且经常查询的数据，应该以反规范化（denormalized）的方式存储，以提高查询速度。类似地，没有固定属性或列的数据可以存储在
    `NoSQL` 数据库中。这些只是几个例子，需要进行更详细的分析以得出解决方案。


    摄取和存储的过程通常由数据工程师完成；但数据科学家理解这些过程至关重要。对这些过程的深入理解可以使数据科学家提供输入，从而可能改进流程。同时，理解数据是如何获取并存储的，将有助于设计涉及
    ML 的端到端解决方案。


    在来自多个源的数据摄取并存储之后，下一步是合并或处理来自不同源的数据。这是数据科学家需要参与并根据用例需求开始研究数据的任务。除了数据科学的需要外，数据还被用于报告和分析，这些可能会重叠。报告人员、数据工程师和数据科学家之间的良好协调可以减少工作量，避免重复劳动。


    一旦在数据源中识别出相关数据，下一步就是探索数据以得出假设和洞察。这一步被称为探索性数据分析（EDA），将在下一节中讨论。


    '
