    # Data preparation


    The Machine Learning algorithm only takes the numerical value as the input, which
    requires the encoding categorical or factor variables as numerical. To convert
    all the data, which can be consumed by the ML algorithm, we need to prepare the
    data, and this is what happens in data preparation. Data preparation is generally
    the most time-consuming task in the whole exercise, but there are exceptions at
    times. The three tasks that happens during data preparation are mentioned as follows:


    - Dependent variable preparation

    - Feature engineering/independent variables

    - Feature selection


    ## Dependent variable preparation


    Dependent variable preparation is based on the problem defined and can be straight
    forward like predicting the price of the house in a certain demography or can
    be very complicated, for example, predicting the anomaly when the anomaly itself
    is not clearly defined. It depends on each case, and a clear definition of the
    dependent variable is expected in the first two steps; the data is quantified
    in this step. The dependent variables are the variables of interest for the business
    as mentioned in the example, like the price of a house, customer churn flag, and
    so on. These are the variables which are to be predicted using the past data,
    and based on that, the business decisions can be taken. Without having a clear
    dependent variable, the ML use case cannot move forward. This is the first step
    to be defined after the business understanding and, generally, is one of the most
    important outcome of data understanding. The quantification happens in data preparation.


    ## Feature engineering


    Feature engineering is the process of deriving useful features out of the dataset,
    which enables you to predict the dependent. It is something which is very broad
    in scope and there are no standard steps to accomplish that. It is a combination
    of the domain/business understanding, patterns in data, and getting creative.
    However, there are a few standard steps like encoding categorical variable to
    numeric or creating multiple variables out of a single numerical variable. This
    is an iterative exercise in combination with feature where we create a maximum
    number of features, via feature engineering, and eliminate them based on the statistical
    relationship/test or ML model. An important thought, while performing feature
    engineering and selection should be, will that feature, or the data used to derive
    that feature, be available in advance than the dependent variable. Even though
    it is a simple thought, a lot of times, things go wrong because of this.


    For example, if you are trying to predict a year in advance as to whether a customer
    will purchase a product or not, you can’t use the current month salary of the
    customer. Your dependent variable will be a binary flag denoting 1 or 0, 1 for
    purchase and 0 for not. Now, to predict a year in advance, whether that customer
    will purchase that product, you need to use the information of the customer which
    you had a year back, including his salary. The idea is always to predict the future
    based on the past data, which is missed sometimes, and we need to be careful about
    that. If the data is not prepared correctly, any insight coming out of it is garbage,
    and hence the saying Garbage in Garbage out. This data preparation is very important
    and very time consuming because any mistake here will propagate till the end,
    and this is done to derive business insight and future prediction. Consider Figure
    2.3 that illustrates the time bound feature development, shown as follows:


    ![](image-c6df2tfi.jpg)

    Figure 2.3: Time bound feature creation


    There should be no features engineered or taken, which crosses the time of the
    independent period. The problem type, the evaluation technique varies depending
    on the set.


    ## Modeling


    Modeling is the step where various algorithms are applied to the prepared data.
    In this step, different models are tried to find the best suited one. The goal
    is to create a model that generalizes well to unseen data.


    ## Evaluation


    Evaluating the model performance, once a particular ML model is finalized, is
    the immediate step after modeling. In this step, a data set which was not used
    for training is utilized. The data is scored by the already created model, and
    the performance is validated with the actual value. The new data is generally
    called the test set and it is a standard practice in supervised machine learning.
    The other technique which is very common is the out of time validation, where
    the model performance is tested on nearby historical data.

