    # FEAST – Feature Store


    Figure 8.1 shows the architecture of `Feast`, as follows:

    ![](image-jznlon7e.jpg)

    Figure 8.1: Feast architecture


    [Reference: `Feast` is not an ETL tool; it just provides an interface and infra
    configuration for creating a feature store to access the data in a consistent
    manner. `Feast` mainly sits on top of the data warehouse system or data lake.
    All the features that are used in training the model or scoring new data are coming
    from this data warehouse or data lake or file system. `Feast` mainly supports
    two other data sources, apart from files, `Bigquery` and `Redshift`; however,
    in the new releases, it may come out with a support for the other data source.]


    `Feast` uses the historical features or data to train the model and the online
    features or data to score a new data. We will look into how to access both the
    historical and the online features (data, used interchangeably) when we discuss
    the code. The online stores are in the memory data base. Currently, `feast` supports
    `SQLite`, `Datastore`, `Redis`, and `DynamoDB` as online stores.


    `Feast` creates a consistent view for the data to be used for training and scoring.
    The way `Feast` does that is by storing the data in a structure which is available
    for both training and scoring in the hierarchical structure, which is easily extended,
    as per the need without compromising the already built ML pipelines. We will look
    into the `feast` data hierarchy in the upcoming section.


