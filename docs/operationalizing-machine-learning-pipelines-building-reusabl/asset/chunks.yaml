- raw: "  Data preparation    The Machine Learning algorithm only takes the numerical\
    \ value as the input, which requires the encoding categorical or factor variables\
    \ as numerical. To convert all the data, which can be consumed by the ML algorithm,\
    \ we need to prepare the data, and this is what happens in data preparation. Data\
    \ preparation is generally the most time-consuming task in the whole exercise,\
    \ but there are exceptions at times.    The three tasks that happens during data\
    \ preparation are mentioned as follows:     Dependent variable preparation   \
    \ Feature engineering/independent variables    Feature selection    Dependent\
    \ variable preparation is based on the problem defined and can be straight forward\
    \ like predicting the price of the house in a certain demography or can be very\
    \ complicated, for example, predicting the anomaly when the anomaly itself is\
    \ not clearly defined. It depends on each case, and a clear definition of the\
    \ dependent variable is expected in the first two steps; the data is quantified\
    \ in this step. The dependent variables are the variables of interest for the\
    \ business as mentioned in the example, like the price of a house, customer churn\
    \ flag, and so on. These are the variables which are to be predicted using the\
    \ past data, and based on that, the business decisions can be taken. Without having\
    \ a clear dependent variable, the ML use case cannot move forward. This is the\
    \ first step to be defined after the business understanding and, generally, is\
    \ one of the most important outcome of data understanding. The quantification\
    \ happens in data preparation.    Feature engineering is the process of deriving\
    \ useful features out of the dataset, which enables you to predict the dependent\
    \ It is something which is very broad in scope and there are no standard steps\
    \ to accomplish that. It is a combination of the domain/business understanding,\
    \ patterns in data, and getting creative. However, there are a few standard steps\
    \ like encoding categorical variable to numeric or creating multiple variables\
    \ out of a single numerical variable. This is an iterative exercise in combination\
    \ with feature where we create a maximum number of features, via feature engineering,\
    \ and eliminate them based on the statistical relationship/test or ML model. An\
    \ important thought, while performing feature engineering and selection should\
    \ be, will that feature, or the data used to derive that feature, be available\
    \ in advance than the dependent variable. Even though it is a simple thought,\
    \ a lot of times, things go wrong because of this.    For example, if you are\
    \ trying to predict a year in advance as to whether a customer will purchase a\
    \ product or not, you can’t use the current month salary of the customer. Your\
    \ dependent variable will be a binary flag denoting 1 or 0, 1 for purchase and\
    \ 0 for not. Now, to predict a year in advance, whether that customer will purchase\
    \ that product, you need to use the information of the customer which you had\
    \ a year back, including his salary. The idea is always to predict the future\
    \ based on the past data, which is missed sometimes, and we need to be careful\
    \ about that. If the data is not prepared correctly, any insight coming out of\
    \ it is garbage, and hence the saying Garbage in Garbage out. This data preparation\
    \ is very important and very time consuming because any mistake here will propagate\
    \ till the end, and this is done to derive business insight and future prediction.\
    \ Consider Figure 2.3 that illustrates the time bound feature development, shown\
    \ as follows:    ![](image-c6df2tfi.jpg)  Figure 2.3: Time bound feature creation\
    \    There should be no features engineered or taken, which crosses the time of\
    \ the independent period. The observational period depends on the use case, and\
    \ it might not be there for a few use cases.    As shown in Figure data preparation\
    \ and modeling are something which go back and forth, and this is mainly due to\
    \ feature engineering and feature selection.  \n\n  Modeling    The ML modeling\
    \ is the step which happens in parallel with data preparation. In this step, different\
    \ ML algorithms are tried on the same data set to find out the best suited algorithm\
    \ for the data. There is no one-size-fits-all in case of the ML problem, and hence\
    \ multiple algorithms are applied on the same data set to find out the best suited\
    \ algorithm.    Apart from trying different algorithms, the redundant features\
    \ or features not contributing enough to predicting the dependent variable, are\
    \ also treated. The treatment can vary case by case and are also problem dependent.\
    \ The ideal practice is to start with simple algorithms like the linear algorithms,\
    \ and then move on to more advanced algorithms like ensembles. A few problems\
    \ like image processing and NLP (natural language processing) will directly start\
    \ with the deep learning algorithms. We won’t discuss deep learning in detail\
    \ in this book. The deep learning algorithms are an extension of the neural network,\
    \ where the model takes care of feature engineering and selection itself, rather\
    \ than human intervention, especially in cases of NLP and image processing.   \
    \ We will, however, cover in our ML architecture, the provision for any type of\
    \ data science and machine learning activity, including deep learning. To identify\
    \ whether a model is a good fit on the data, there should be standard KPIs on\
    \ which all the models trained, can be evaluated for a particular problem. This\
    \ leads us to our next section of CRISP-DM, which is model evaluation.  \n\n \
    \ Evaluation    Evaluating the model performance, once a particular ML model is\
    \ finalized, is the immediate step after modeling. In this step, a data set, which\
    \ is not available for the purpose of training the ML model in the previous step\
    \ of modelling is utilized. The new data is scored by the already created model,\
    \ and the performance is validated with the actual value. The new data generally\
    \ is called the test set and it is a standard practice in the supervised machine\
    \ learning problem. The other technique which is very common is the out of time\
    \ validation, where the model performance is tested on nearby historical data.\
    \    Depending on the problem type, the evaluation technique varies. For a regression\
    \ problem, where the predictions are continuous values like the price of a house\
    \ or sales in the next quarter and so on, the KPIs are MAE, RMSE, and R-Squared,\
    \ and so on. For classification, where the problems are like whether the machine\
    \ will fail or not, or multiclass like whether a person is old, middle aged, or\
    \ young based on a photo, the KPIs are Accuracy, Precision, Recall, and so on.\
    \ For unsupervised learning, there are different ways to gauge the performance.\
    \ We will go into the details of the KPIs of supervised ML, when dealing with\
    \ the examples in the following chapters.    The important thing in this whole\
    \ evaluation process is to identify whether the model overfit the data. In a simple\
    \ term, overfitting is when a model starts memorizing the data and gives very\
    \ good performance on the data it is trained on; however the performance deteriorates\
    \ when evaluated on the new data. The whole idea is to create a model which can\
    \ provide good performance on the future data, and for that, a model should generalize\
    \ both on training and test data.    The solution is to find out the model which\
    \ gives the result in an acceptable threshold on the training data and generalizes\
    \ well on the new data. Underfitting is another key word used, which is another\
    \ way of saying that the model does not do very well on the training data. The\
    \ goal is to find a balance between underfitting and overfitting.    Therefore,\
    \ evaluation is an important step, and once the model is accepted in this step,\
    \ it moves to the deployment stage.  "
