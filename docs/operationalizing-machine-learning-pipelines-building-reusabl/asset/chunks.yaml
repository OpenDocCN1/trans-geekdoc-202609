    The categorical data can be visualized for their counts across each category.\
    \ `Bar chart` shows the `IsHoliday` variable, as seen in Figure 4.7.\n\n![](image-evr63.jpg)\
    \ \nFigure 4.7: Bar chart\n\n## Pie chart\n\nPie chart is another way to represent\
    \ the data; however, this is not recommended when the cardinality is high. The\
    \ approach to visualize the data should always be simple as possible, otherwise\
    \ it becomes ambiguous.\n\n![](image-efixkkfs.jpg) \nFigure 4.8: Pie Chart\n\n\
    ## Bivariate/multivariate analysis\n\nSo far, we have seen the graphs only single\
    \ variables. Now, we will discuss a few graphs, which can handle two or three\
    \ variables.\n\n## Scatter plot\n\nTo show two numerical variables on the same\
    \ plot and see if there exists any relationship, we use `scatterplot`. Figure\
    \ 4.9 highlights the `Size` and `Weekly`:\n\n![](image-fzymdt2.jpg) \nFigure 4.9:\
    \ Scatter plot\n\nAs we can see there is no relationship visible, none of the\
    \ columns are correlated. One thing which the scatter plot can highlight at times\
