    \ Deployment section. However, in the branching strategy, all the code utilized\
    \ in Dev will just move to the Prod branch, without triggering any training. The\
    \ deployment script is the only script that will run on Prod which will deploy\
    \ the model binary/graphs. It will move the metadata like model binaries, data\
    \ used for training and so on, to the production folder for reference purpose.\n"
  trans: "\n\n# 训练 ML 模型\n\n训练模型的方法与我们在第 5 章“训练与测试 ML 模型——部分”中所做的相同，但我们将利用特征存储（feature\
    \ store）中的数据进行模型训练。此外，为了安全地运行脚本并在运行时登录，我们可以通过 GitHub/Gitlab 环境变量注入 GCP 登录详情。为了测试目的，我们在\
    \ docker 文件中传递了凭据，但这并不安全。你可以在 Polyaxon 文件的 `init` 中传递文件，这是一种更安全的方法。该服务账户将通过以下代码在\
    \ `polyaxonfile.yaml` 脚本读取：\n\n```yaml\nenv:\n  - name: GOOGLE_APPLICATION_CREDENTIALS\n\
    \    value: /etc/secrets/credentials.json\n```\n\n这一次，我们将通过传递 `hyperparameter_grid.yml`\
    \ 文件来训练模型，它将在内部利用 `polyaxonfile.yaml` 并拟合最佳模型。执行此操作的命令如下：\n\n```bash\npolyaxon\
    \ run -f hyperparameter_grid.yml -p project --name experiment_name -P git_repo=polyaxon\
    \ --eager\n```\n\n用户需要确保服务账户具有所需的权限，例如读取数据的 BigQuery 数据集以及读取 Feast 元数据并写入训练元数据的\
    \ GCS 云存储桶。关于服务账户的更多详细信息以及查看如何创建密钥，你可以参考以下链接：\n\nhttps://cloud.google.com/iam/docs/creating-managing-service-account-keys\n\
    \n训练完成后，我们将在配置为产物存储（artifact store）的 GCS 桶下获得每次运行的文件夹，并在该桶中获得每次运行的文件夹，如图 9.1 所示\n\
    \n![](img/image-vnypfl7g.jpg)\n图 9.1: GCS 上的元数据\n\n在每次运行下，你在 Python 训练脚本中记录的所有元数据都可用，包括数据、模型二进制文件以及你使用跟踪模块记录的任何额外产物。文件将如图\
    \ 9.2 所示\n\n![](img/image-2emd0uvi.jpg)\n图 9.2: 运行详情\n\n我们将利用这些最终确定模型的产物进行部署。\n\
    \n# 部署\n\n一旦我们根据定义的 KPI 和利益相关者的批准确定了模型，下一个任务就是部署模型。我们将利用 KServe 进行部署，它将安装在不同的\
    \ K8s 命名空间下。使用不同命名空间的想法更好，因为它将模型训练与模型提供隔离开。KServe 除了模型提供之外提供了许多额外服务，如自动伸缩、金丝雀发布（canarying）、可解释性等。由于这些优势，它是提供最终确定模型的理想工具。\n\
    \n我们在这里不会讨论 KServe 的安装；但是，“参考”部分提供的 Git 仓库将包含我们所使用的 KServe 安装的详情。我们还将分享一个比我们正在使用的更详细的安装链接。在\
