    \ system for the application development and deployment without the vendor lock\
    \ in.\n\nThe Kubernetes installation can be challenging; however, thanks to the\
    \ public cloud provider like `GCP` or `AWS`, they have simplified the installation\
    \ of `K8s`. Another thing to keep in mind is that even though `K8s` have a lot\
    \ of advantages, not every organization needs to enable them for their ML or data\
