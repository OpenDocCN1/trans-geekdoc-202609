- raw: "  Provision GPUs on Google Kubernetes Engine    The deep learning models train\
    \ much faster on GPUs. However, before we can use GPUs to train our model, we\
    \ need to create a GPU node pool on GKE. This is a multi-step process, which is\
    \ discussed as follows:     Request GPU This is the maximum number of GPUs that\
    \ can run in the GCP project.    Create an autoscaling GPU node This node pool\
    \ will only be used for the tasks needing GPUs.    Install NVIDIA GPU    The steps\
    \ to request the additional GPU quota can be found in the official Google Cloud\
    \ documentation.    We will be creating an autoscaling GPU node pool that is separate\
    \ from the node pool we use for the CPU-only tasks. This helps us take full advantage\
    \ of autoscaling. The node pool will be able to efficiently scale up or down simply\
    \ based on whether the GPUs are needed or not. This makes it the most cost-effective\
    \ way to use GPUs on GKE. To create a GPU node pool, we run the following command:\
    \    gcloud container node-pools create POOL\\_NAME \\\\  \\--accelerator type=GPU\\\
    _TYPE,count=AMOUNT \\\\  \\--zone COMPUTE\\_ZONE \\--cluster CLUSTER\\_NAME \\\
    \\  \\--num-nodes NUM\\_NODES \\--min-nodes MIN\\_NODES \\\\  \\--max-nodes MAX\\\
    _NODES \\--enable-autoscaling     NOTE: Not all GPU types are available in all\
    \ compute zones. To check the list of GPUs available in each zone, run the following\
    \ command:    gcloud compute accelerator-types list     After creating the GPU\
    \ node pool, we need to install the NVIDIA drivers on the nodes. Google has made\
    \ this very simple, as shown as follows:    kubectl apply \\-f \\\\  https://raw.githubusercontent.com/GoogleCloudPlatform/container-engine-accelerators/master/nvidia-driver-installer/cos/daemonset-preloaded.yaml\
    \    This will take a few seconds to complete after which our GPU pool is ready\
    \ to be used.  \n\n  Use GPUs while training on Polyaxon    Now that our GPU pool\
    \ is ready, we can use it to train our image classification model. To do this,\
    \ we will leverage the file override mechanism of the polyaxon run command. This\
    \ lets us use CPUs or GPUs to train our models without having to repeatedly edit\
    \ the polyaxonfile. To achieve this, we will need two polyaxon files. In this\
    \ case, these are polyaxonfile.yml and    To train using the CPU only, we will\
    \ execute the following command:    polyaxon run \\-f polyaxonfile.yml    To train\
    \ using GPU, we add the GPU request to our run specification using the following\
    \ override mechanism:    Polyaxon run \\-f polyaxonfile.yml \\-f polyaxonfile\\\
    _gpu.yml    This adds/replaces the value of the nvidia.com/gpu parameter in the\
    \ original polyaxon file.  \n\n  Points to remember     Details of all our training\
    \ jobs are available on the Polyaxon dashboard.    Polyaxonfile contains all specifications\
    \ for training the ML models.  \n\n  Multiple choice questions     Which of the\
    \ following capabilities is not there in the Polyaxon dashboard?     Creating\
    \ custom visualizations    Spinning up GPU node pools    Filtering training jobs\
    \ based on tags    Tracking memory consumption    In how many ways can we write\
    \ polyaxonfiles?     1    2    3    6    One can log custom metrics in Polyaxon.\
    \     True    False  \n\n  Answers     b    c (YAML, JSON and Python)    a  \n\
    \n  Key terms     The file containing the specifications for running the training\
    \ jobs using Polyaxon.    Graphical processing unit, to enhance the computation\
    \ power.  \n\n  References     Model Training on Polyaxon \\- https://github.com/MLBook-VJ/polyaxon-examples\
    \    Polyaxon file Documentation \\- https://polyaxon.com/docs/core/specification/\
    \    Polyaxon with Private Docker Registry \\- https://polyaxon.com/integrations/private-docker-registry/\
    \    GCP Quotas \\- https://cloud.google.com/compute/quotas  \n\nCHAPTER 7   \
    \ ML Model Performance Measurement    In the previous few chapters, we trained\
    \ ML models and checked their performance. We will now explore in detail, the\
    \ KPIs or metrics which are generally used for measuring the ML model performance.\
    \ The metrics chosen to measure the ML model performance depend on the kind of\
    \ problem we are solving like regression or classification. Also, the selection\
    \ of the key metrics depends on the data and business problem. It is also important\
    \ to interpret these metrics and communicate them properly. Whether the model\
    \ will move to production or not is decided by how well these metrics are communicated\
    \ and understood. We will cover the key takeaway from each metric that should\
    \ be communicated.    The performance of the predictions made by the trained ML\
    \ model is checked using the relevant metrics at the time of training. However,\
    \ even after the model is deployed in production, it needs continuous monitoring\
    \ of performance, and these key KPIs or metrics become very important to identify\
    \ the model decay and need for retraining or revisiting the problem.    We will\
    \ cover the common practices and discuss in detail all these metrics in this chapter.\
    \    Broadly, the metrics are divided into two parts – regression and classification\
    \ – and we will cover metrics for both of these problems.  \n\n  Structure   \
    \ In this chapter, we will cover the following topics:     Overview    Regression\
    \ metrics    Classification metrics    Result communication  \n\n  Objectives\
    \    After studying this chapter, you will be able to understand the right set\
    \ of metrics and KPIs to measure the ML model performance and when to use them\
    \ based on the problem and data. In this chapter, we will also cover the key insights\
    \ that needs to be communicated to highlight the model performance based on these\
    \ metrics.    We will also touch base on how to think beyond these KPIs and talk\
    \ in financial or operational efficiency or key KPIs that the business stakeholders\
    \ are looking into and how the ML performance metrics can be directly related\
    \ to them. This can lead to the usage of the output of the ML model on an ongoing\
    \ basis and contribute to the success of the project.  \n\n  Overview    We create\
    \ multiple the ML models on an enterprise level to solve different business problems.\
    \ To make sure that the end user utilizes the output of these ML models, we need\
    \ to validate the performance of these models and communicate them properly to\
    \ build confidence. For quantifying the performance of the model, we need to understand\
    \ the key KPIs or metrics to measure the ML model performance. Each type of ML\
    \ problem has its own set of KPIs and we must select the best suited one based\
    \ on the data and problem.    We will discuss in detail all the common metrics\
    \ used to measure the performance of the ML model and how best they can be presented\
    \ to the end user. We will start with the regression KPIs.  \n\n  Regression metrics\
    \    Regression is used when the dependent variable is continuous, for example,\
    \ the price of the House, salary of a person, and so on. One common problem with\
    \ regression metrics is the scale at which the prediction is made, and due to\
    \ this, it is open for interpretation; for example, if we are predicting the price\
    \ of a house which is generally in millions, we can say ± 20k is a good prediction;\
    \ however, the salary which is in the scale of few 50 to 100k, ±20k is quite high.\
    \    In the following section, we will see a few common metrics which are used\
    \ to capture the regression model performance.  \n\n  Mean Absolute Error (MAE)\
    \    Mean Absolute Error or MAE is a popular metric because the units of the error\
    \ score match the units of the target value that is being predicted.    MAE is\
    \ calculated as the average of the absolute of the actual minus the predicted\
    \ values. The Predicted minus the actual value is also referred to as an error\
    \ or residual. The Absolute or abs() is a mathematical function that makes the\
    \ number positive. Taking the absolute value ensures that the errors don’t cancel\
    \ each other out while adding them to calculate the MAE. The MAE is calculated\
    \ using the following equation:    ![](image-kst3gb22.jpg)   N: Total number of\
    \ observations    actual value of the observation    The predicted value of the\
    \ observation  "
  fmt: "\n# Provision GPUs on Google Kubernetes Engine\n\nThe deep learning models\
    \ train much faster on GPUs. However, before we can use GPUs to train our model,\
    \ we need to create a GPU node pool on GKE. This is a multi-step process, which\
    \ is discussed as follows:\n\n## Request GPU\nThis is the maximum number of GPUs\
    \ that can run in the GCP project.\n\n## Create an autoscaling GPU node\nThis\
    \ node pool will only be used for the tasks needing GPUs.\n\n## Install NVIDIA\
    \ GPU\nThe steps to request the additional GPU quota can be found in the official\
    \ Google Cloud documentation.\n\nWe will be creating an autoscaling GPU node pool\
    \ that is separate from the node pool we use for the CPU-only tasks. This helps\
    \ us take full advantage of autoscaling. The node pool will be able to efficiently\
    \ scale up or down simply based on whether the GPUs are needed or not. This makes\
    \ it the most cost-effective way to use GPUs on GKE. To create a GPU node pool,\
    \ we run the following command:\n\n```bash\ngcloud container node-pools create\
    \ POOL_NAME \\\n--accelerator type=GPU_TYPE,count=AMOUNT \\\n--zone COMPUTE_ZONE\
    \ \\\n--cluster CLUSTER_NAME \\\n--num-nodes NUM_NODES \\\n--min-nodes MIN_NODES\
    \ \\\n--max-nodes MAX_NODES \\\n--enable-autoscaling\n```\n\n**NOTE**: Not all\
    \ GPU types are available in all compute zones. To check the list of GPUs available\
    \ in each zone, run the following command:\n\n```bash\ngcloud compute accelerator-types\
    \ list\n```\n\nAfter creating the GPU node pool, we need to install the NVIDIA\
    \ drivers on the nodes. Google has made this very simple, as shown as follows:\n\
    \n```bash\nkubectl apply -f https://raw.githubusercontent.com/GoogleCloudPlatform/container-engine-accelerators/master/nvidia-driver-installer/cos/daemonset-preloaded.yaml\n\
    ```\n\nThis will take a few seconds to complete after which our GPU pool is ready\
    \ to be used.\n\n## Use GPUs while training on Polyaxon\nNow that our GPU pool\
    \ is ready, we can use it to train our image classification model. To do this,\
    \ we will leverage the file override mechanism of the `polyaxon run` command.\
    \ This lets us use CPUs or GPUs to train our models without having to repeatedly\
    \ edit the `polyaxonfile`. To achieve this, we will need two polyaxon files. In\
    \ this case, these are `polyaxonfile.yml` and `polyaxonfile_gpu.yml`.\n\nTo train\
    \ using the CPU only, we will execute the following command:\n\n```bash\npolyaxon\
    \ run -f polyaxonfile.yml\n```\n\nTo train using GPU, we add the GPU request to\
    \ our run specification using the following override mechanism:\n\n```bash\npolyaxon\
    \ run -f polyaxonfile.yml -f polyaxonfile_gpu.yml\n```\n\nThis adds/replaces the\
    \ value of the `nvidia.com/gpu` parameter in the original polyaxon file.\n\n##\
    \ Points to remember\n- Details of all our training jobs are available on the\
    \ Polyaxon dashboard.\n- `Polyaxonfile` contains all specifications for training\
    \ the ML models.\n\n## Multiple choice questions\n1. Which of the following capabilities\
    \ is not there in the Polyaxon dashboard?\n   - Creating custom visualizations\n\
    \   - Spinning up GPU node pools\n   - Filtering training jobs based on tags\n\
    \   - Tracking consumption\n2. In many ways can we write `polyaxon`?\n   - 1\n\
    \   - 2\n   - 3\n   - 6\n3. Is it possible to use `polyaxon`?\n   - True\n   -\
    \ False\n\n**Answers**\n- b\n- c\n- a\n\n## Key terms\n- Details of all our training\
    \ jobs are available on the Polyaxon dashboard.\n- `Polyaxonfile` contains all\
    \ specifications for training the ML models.\n- `Polyaxon`: https://github.com/GoogleCloudPlatform/container-engine-accelerators/\n\
    - `Polyaxon`: To enhance the performance using YAML and JSON.\n\n## References\n\
    - `Polyaxon`: https://raw.github.com/GoogleCloudPlatform/container-engine-accelerators/master/nvidia-driver-installer/cos/daemonset-preloaded.yaml\n\
    - `Documentation`: https://polyaxon.com/docs/\n- `Private Registry`: https://polyaxon.com/integrations/private-registry/\n\
    - `Quotas`: https://cloud.google.com/compute/quotas\n\n# CHAPTER 7: Model Performance\n\
    \nAfter the previous chapters, we will now explore the metrics to measure the\
    \ model performance. The metrics or KPIs used to define how well the model performs.\
    \ The more of the metrics, the better, the more we can understand the performance\
    \ of the model. The metrics or KPIs used to define how well the model performs.\
    \ The more of the metrics, the better, the more we can understand the performance\
    \ of the model. The metrics are used for and we will discuss in detail all the\
    \ metrics in this chapter.\n\nBroadly, the metrics are divided into two parts\
    \ – regression and classification – and we will cover both.\n\n## Structure\n\
    In this chapter, we will cover the following topics:\n- Overview\n- Regression\
    \ metrics\n- Classification metrics\n- Result\n\n## Objectives\nAfter studying\
    \ this chapter, you will be able to understand the right set of metrics to use\
    \ based on the data and problem. We will also touch base on how to measure the\
    \ performance of the model using `polyaxon`. We will look at the KPIs and metrics\
    \ to evaluate the performance of the ML models and ensure the output of `polyaxon`\
    \ contributes to the project.\n\n## Overview\nWe create multiple ML models to\
    \ solve different business problems. To make sure the end user utilizes the output\
    \ of these models, we need to validate the performance and communicate them properly.\
    \ For quantifying the performance of the model, we need to understand the metrics.\
    \ Each type of ML problem has its own set of KPIs and we must select the best\
    \ suited one based on the data and problem. We will start with the regression\
    \ KPIs.\n\n## Regression metrics\nRegression is used when the dependent variable\
    \ is continuous, for example, the price of a house, salary of a person, and so\
    \ on. One common problem with regression metrics is the scale at which the prediction\
    \ is made, and due to this, it is open for interpretation; for example, if we\
    \ are predicting the price of a house which is generally in millions, we can say\
    \ ± 20k is a good prediction; however, the salary which is in the scale of few\
    \ 50 to 100k, ±20k is quite high.\n\nIn the following section, we will see a few\
    \ common metrics which are used to capture the regression model performance.\n\
    \n### Mean Absolute Error (MAE)\nMean Absolute Error or MAE is a popular metric\
    \ because the units of the error score match the units of the target value that\
    \ is being predicted.\n\nMAE is calculated as the average of the absolute of the\
    \ actual minus the predicted values.\n"
  trans: "\n\n# 在 Google Kubernetes Engine 上配置 GPU\n\n深度学习模型在 GPU 上的训练速度快得多。然而，在我们使用\
    \ GPU 训练模型之前，我们需要在 GKE 上创建一个 GPU 节点池。这是一个多步骤的过程，具体讨论如下：\n\n## 请求 GPU\n这是 GCP 项目中可以运行的\
    \ GPU 最大数量。\n\n## 创建自动伸缩的 GPU 节点\n此节点池将仅用于需要 GPU 的任务。\n\n## 安装 NVIDIA GPU\n请求额外\
    \ GPU 配额的步骤可以在 Google Cloud 官方文档中找到。\n\n我们将创建一个与我们用于仅 CPU 任务的节点池分开的自动伸缩 GPU 节点池。这有助于我们充分利用自动伸缩功能。该节点池能够根据是否需要\
    \ GPU 高效地扩展或缩小规模。这使其成为在 GKE 上使用 GPU 最具成本效益的方式。要创建 GPU 节点池，我们运行以下命令：\n\n```bash\n\
    gcloud container node-pools create POOL_NAME \\\n--accelerator type=GPU_TYPE,count=AMOUNT\
    \ \\\n--zone COMPUTE_ZONE \\\n--cluster CLUSTER_NAME \\\n--num-nodes NUM_NODES\
    \ \\\n--min-nodes MIN_NODES\n--max-nodes MAX_NODES \\\n--enable-autoscaling\n\
    ```\n\n**注意**：并不是所有的 GPU 类型在所有计算区域都可用。要检查每个区域可用 GPU 列表，请运行以下命令：\n\n```bash\ngcloud\
    \ compute accelerator-types list\n```\n\n在创建 GPU 节点池后，我们需要在节点上安装 NVIDIA 驱动程序。Google\
    \ 使其变得非常简单，如下：\n\n```bash\nkubectl apply -f https://raw.githubusercontent.com/GoogleCloudPlatform/container-engine-accelerators/master/nvidia-driver-installer/cos/daemonset-preloaded.yaml\n\
    ```\n\n这需要几秒钟完成，之后我们的 GPU 节点池即可使用。\n\n## 在 Polyaxon 上训练时使用 GPU\n现在我们的 GPU 节点池已就绪，我们可以使用它来训练图像分类模型。为了实现这一点，我们将利用\
    \ `polyaxon run` 命令的文件覆盖机制。这允许我们使用 CPU 或 GPU 来训练模型，而无需反复编辑 `polyaxonfile`。为了实现这一点，我们需要两个\
    \ polyaxon 文件。在这种情况下，它们是 `polyaxonfile.yml` 和 `polyaxonfile_gpu.yml`。\n\n要仅使用\
