    \ bottom. `IQR` is `q3-q1`, where `q3` is the top quartile, `q2` is the median\
    \ or second quartile, and `q1` is the first quartile. Anything beyond the whiskers\
    \ is treated as the outliers. Outliers are a broad topic, and there are multiple\
