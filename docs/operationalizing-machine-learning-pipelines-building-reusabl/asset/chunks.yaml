- raw: "  Kubernetes    Kubernetes, also known as K8s, is an open-source system for\
    \ deploying and managing the containerized applications in an automated and scalable\
    \ manner. It was created by the engineers from Google and open sourced. Currently,\
    \ most of the organizations are taking the K8s route due to the following reasons:\
    \     The K8s clusters are naturally scalable. It has a number of tools that allow\
    \ both the applications as well as the infrastructure they are hosted on to scale\
    \ in and out based on the demand, efficiency, and a number of other metrics. We\
    \ will explore a few of these as per our requirements when we train or deploy\
    \ our ML models.    K8s are very flexible wherever you are running the clusters.\
    \ Be it your private cloud, public cloud, or your own machine, they are designed\
    \ in a manner to handle complex requirements.    Open K8s is an open source and\
    \ is available for extension as per requirement. This provides a powerful system\
    \ for the application development and deployment without the vendor lock in. \
    \   The Kubernetes installation can be challenging; however, thanks to the public\
    \ cloud provider like GCP or AWS, they have simplified the installation of K8s.\
    \ Another thing to keep in mind is that even though K8s have a lot of advantages,\
    \ not every organization needs to enable them for their ML or data science practice.\
    \ Only when there is maturity in the ML practice and there is a requirement, we\
    \ should go ahead. We assume this is the case in most of the enterprises currently;\
    \ however, it is always a good question to ask, how many models will we train\
    \ and deploy on a weekly or monthly basis. The importance of having an answer\
    \ to the question is that you can easily quantify the infrastructure and operation\
    \ requirement. It need not be accurate but will give a clear value proposition\
    \ of K8s.    Once K8s is deployed, we get a cluster. A cluster is composed of\
    \ the working machines called nodes. We will cover all the components that constitutes\
    \ the K8 cluster in the following section.  \n\n  K8 components    Broadly speaking,\
    \ the K8 cluster has three major parts, which are as follows:     Control plane\
    \    Nodes    Cloud provider API (optional)    Figure 5.2 highlights the components\
    \ of the K8s cluster, as follows:    ![](image-eba5tkxw.jpg)  Figure 5.2: K8s\
    \ component    \\[Reference:    Nodes are where the containerized application\
    \ runs and each K8s cluster has at least one node. The Control Plane contains\
    \ the services/components that manage the cluster including the component to interact\
    \ with the cloud provider, if installed on the public or private cloud. More details\
    \ about K8s can be found at  \n\n  Google Cloud Platform (GCP)    Google cloud\
    \ platform, or GCP, as the name suggests, is a cloud platform provided by Google\
    \ and one of the most utilized public provided cloud platform along with Microsoft\
    \ Azure and AWS. Multiple services are provided by GCP in such a way that all\
    \ the IT needs can be handled at one place for an organization. GCP or any public\
    \ cloud provider enables the end user to concentrate on the immediate core problems\
    \ rather than worrying about the IT infrastructure or platform. On a high level,\
    \ the following services are provided by GCP:     Computing and hosting    Storage\
    \    Databases    Networking    Big data    Machine learning    The services fall\
    \ under multiple categories like Software as a Service Platform as a Service or\
    \ Infrastructure as a Service For this chapter, we will be using K8s, which falls\
    \ under the Computing and hosting service. We will install the K8s cluster and\
    \ then install Polyaxon which is discussed in the following section. The installation\
    \ of the K8s cluster code is also discussed along with Polyaxon and details of\
    \ both the commands are provided in this chapter with code links.    We can do\
    \ most of the stuff via the GCP cloud shell; however, if you want to execute from\
    \ your local machine, you need to install Google Cloud SDK Please install this\
    \ as per your OS. Once installed, you need to log on to your account executing\
    \ the gcloud init command. This will take you to the Google login page. If you\
    \ are using multiple GCP accounts and projects, please be careful to select the\
    \ right one.    Once logged in, we are ready with the GCP side to perform the\
    \ K8s and Polyaxon installation, which we will discuss in the following section.\
    \  \n\n  Polyaxon    Polyaxon is built for automating and reproducing the ML and\
    \ Deep learning task. Polyaxon is platform agnostic and provides many flavors\
    \ of the tools including a cloud version. In this chapter, when we are referring\
    \ to Polyaxon, we are referring to the Polyaxon community edition, which is an\
    \ open-source tool from the Polyaxon organization. It runs above any K8s cluster;\
    \ in our case, we will use the GCP K8s cluster. We will go through the installation\
    \ and setup part in this chapter and then we will run a couple of experiments\
    \ and go through the details of them in the next chapter.    There are functionalities\
    \ provided by Polyaxon which are free but a few of them are paid. We will utilize\
    \ the free setup and find a workaround for anything paid using the other tools.\
    \ The idea is to grasp the concept and implement it as per the tools available\
    \ to the organization or make an appropriate recommendation. Polyaxon offers a\
    \ couple of ways to communicate with the Python API and YAML files. We will look\
    \ into both; however, we will be implementing most of the things via YAML.   \
    \ In the next section, we will install the Polyaxon community edition, which is\
    \ open sourced on the GCP K8s cluster. We assume that the GCP and docker setup,\
    \ discussed earlier, are already completed before we start the Polyaxon setup.\
    \ If not, please go ahead and do that before starting the Polyaxon setup. We will\
    \ go through the command details utilized in the script in details in the upcoming\
    \ section.  "
