    \  \\# tables/views when building feature vectors  join\\_key \\= \"CustomerID\"\
    ,  \\# The storage level type for an entity  value\\_type \\= ValueType.STRING,\
    \  )    In this code, we are creating an entity where the Name we are giving to\
    \ the entity is and the join\\_key is to look for the source table for that entity.\
    \ You can give any name you want to the entity, but make sure to use the name\
    \ correctly in the feature views. The value\\_type is the data type of the entity.\
    \ The entities can be a combination of multiple keys like CustomerID and Department\
    \ and so on, depending on the business problem. Once the entity is created, the\
    \ next step is to create the data source.    Data source    Data source is defined\
    \ as the file or table from where the features’ values are picked up. Since, we\
