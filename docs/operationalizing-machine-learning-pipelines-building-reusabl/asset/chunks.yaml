    # ML framework


    Figure 3.1 shows the ML framework with its key components highlighted. Going forward,
    we will discuss each of them and understand what their roles are in the ML use
    case lifecycle, as shown as follows:


    ![](image-70m6p8c3.jpg)


    Figure 3.1: ML Framework


    As shown in the preceding figure, there are multiple components in the framework.
    We will discuss each component and its utility. We will also recommend the tools
    for each step, and at the same time, the challenges that need to be considered
    while choosing the tools. Each component utility in the `CRISP-DM` framework will
    also be discussed, including the extension.


    ## Data source


    We will start with the data source, as with any data science or ML use case, the
    idea is to utilize the data available, and hence the data source available is
    the first part of the ML framework. One difference between the data source and
    the rest of the component in the ML framework is that most of the time, the data
    scientists are the end user and won’t work in designing the data source. However,
    it is important to understand how the data is stored in an organization and what
    the process of collection and storage is. It is also important to understand how
    the data stored is generated, that is, the process of data generation, which is
    assumed to be completed as part the business understanding.


    The data stored at one place is an important asset for an organization to have
    to utilize the data. All the organizations have data, but the challenge, most
    of the times, is that the data are in the silos. To utilize the data for a business
    problem, we must combine the data from multiple places. This is a two-step process,
    which are mentioned as follows:


    1. Bringing the data from multiple sources to one place.

    2. Combining/processing the data to solve the business problem.


    The first step is where the data pipelines and jobs are created to regularly update
    the data in the target environment or the data source. It might involve combining
    the data which is more on the data processing side. The second step is more aligned
    towards the business need like reporting, analytics, and so on.


    The first step can be broadly divided into two steps – Ingestion and Storage.
    In ingestion, the data pipelines are created to absorb all the data coming from
    the different locations. The data can be from multiple sensors in the `IoT` setup
    or can be the daily batch load from a data warehouse system or can be an app generated
    data in real time. Each of these data types require different processing; for
    example, for streaming the data, a messaging service would be required which can
    be achieved using `Apache Kafka` or the equivalent cloud tools like `GCP Pub/Sub`
    or `AWS SNS`. Similarly, the processing, before storage, can be done by `Apache
    Spark/Beam` or the equivalent services on cloud.


    Storage is the next step after ingestion and a proper care should be taken in
    terms of storing the ingested data. This is because the data can be utilized for
    multiple purposes, and the way the data is stored has its own benefits and limitations.
    As an example, the data, which is not updated frequently and queried regularly,
    should be stored in a denormalized way, so that the queries work faster. Similarly,
    the data with no fixed attributes or columns can be stored on the `NoSQL` data
    bases. These are a few examples, and a more detailed analysis needs to be done
    to come out with a solution.


    The process of ingestion and storage are generally done by the data engineers;
    however, it is important for the data scientist to understand these processes.
    The in-depth understanding of the processes can enable the data scientist to provide
    the input which might lead to the improvement of the process. At the same time,
    understanding how the data comes and gets stored will be helpful to design an
    end-to-end solution involving ML.


    Combining or Processing the data from the different sources is the next step,
    after the data from multiple sources are ingested and stored. This is the task
    where the data scientist needs to get involved and start looking into the data
    as per the use case requirement. Apart from the data science necessities, the
    data is utilized for reporting and analysis, which might overlap. A proper coordination
    between reporting, data engineers, and data scientist can reduce the effort avoiding
    redundant work.


    Once the relevant data is identified in the data source, the next step is exploring
    the data to come out with the hypothesis and insights. This step is called Exploratory
    Data Analysis and is discussed in the following section.

    '
