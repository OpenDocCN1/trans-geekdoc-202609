- raw: "  Conclusion    In this chapter, we got our hands dirty with data and understanding\
    \ the data. We looked into the ways to explore the different types of variable\
    \ and different graphs and how to interpret them. Finally, we looked into how\
    \ to condense the important information and insights and communicate it to the\
    \ stakeholders. We need to remember, all the visualization and insights might\
    \ not be useful and of interest to the stakeholders. We touched upon all we need\
    \ to keep in mind when communicating the results to the business.    In the next\
    \ chapter, we will get into more details about training the model and learn how\
    \ to track the experiments for moving the final models to production.  \n\n  Points\
    \ to remember     EDA starts after the business problem is finalized.    Data\
    \ visualization should be simple and easy to understand.    All the insights coming\
    \ out of EDA might not be useful to the business. Prioritizing the insights is\
    \ important, otherwise it might lead to too much information.    Insights should\
    \ be communicated keeping the business problem and utility in mind; it might lead\
    \ to further queries from the business and provide valuable inputs.  \n\n  Multiple\
    \ choice questions     What is the utility of histogram?     To check the distribution\
    \ around mean/average    To check the distribution around median    Detect outlier\
    \    None of the above    What is IQR or Inter Quartile Range of a numeric variable?\
    \     Difference between mean and median    Difference between third quartile\
    \ and first quartile    Median multiplied by 2\\.    Mean subtracted by (1.5\\\
    *standard deviation)    What is the utility of the baseline model in EDA used\
    \ for?     To get an idea about the predictive power of the data.    To identify\
    \ the best set of algorithms for the problem.    To identify the important features\
    \ in predicting the dependent variable.    All of the above.  \n\n  Answers    \
    \ a    b    d  \n\n  Key terms     Spread of the data from the mean, squared value\
    \ of the standard deviation.  \n\n  References     Code and data \\- https://github.com/MLBook-VJ/EDA\
    \  \n\nCHAPTER 5    Training and Testing ML Model – Part 1    In the previous\
    \ chapter, we discussed EDA and the insights coming out of EDA, and how the insights\
    \ should be communicated. After the EDA is complete, if the outcomes are positive,\
    \ we move ahead with training the model and validating its performance. We will\
    \ discuss how and why training a model is separated from EDA, even though we trained\
    \ one during EDA. The challenges around model training like hardware requirements,\
    \ data versioning, and experiments’ details will also be explored. This chapter\
    \ will also highlight why the cloud platforms are better suited for model training\
    \ at scale. We will perform the training part with two different set of problems,\
    \ just to highlight the different ways of training a model, that is, training\
    \ with CPU and GPU. We will also discuss the kind of infrastructure that should\
    \ be enabled for model training at scale inside an organization.    In this chapter,\
    \ we will discuss the technical details including container, Kubernetes (K8s),\
    \ and Polyaxon. Polyaxon is a platform built on top of K8s for building, training,\
    \ and monitoring large scale machine learning and deep learning projects. We will\
    \ utilize the community edition of Polyaxon which is open source and can be installed\
    \ inhouse or on the cloud K8s cluster. We will use Google Cloud Platform for our\
    \ K8s cluster.    We will cover the setup of Polyaxon and understand the Polyaxon\
    \ platform in this chapter and the next. We will cover the training in the next\
    \ chapter which will be a continuation of this chapter.  \n\n  Structure    In\
    \ this chapter, we will cover the following topics:     Overview    Container\
    \    Kubernetes    GCP    Polyaxon    Polyaxon setup  \n\n  Objectives    After\
    \ studying this chapter, you will be able to take forward the EDA results and\
    \ train a model and develop a mechanism to experiment at scale for the ML model\
    \ training. We will discuss the necessity of having flexible infrastructure for\
    \ the data scientist to experiment and train the model without thinking too much\
    \ about the infrastructure limitation in a cost optimized manner. We will use\
    \ Google as the cloud provider but will provide the reference if someone wants\
    \ to use the other cloud vendor or the in-house K8s cluster. The use of K8s makes\
    \ it a compulsion to use all the workflow containerized and we will discuss the\
    \ advantage of containerization.    Polyaxon platform is huge, and we will cover\
    \ the parts which are required as per necessity. One could refer the Polyaxon\
    \ documentation if they want to perform any modification or enhancement in their\
    \ setup.  \n\n  Overview    As organizations have a large amount of data available\
    \ these days; they want to utilize the data for better decision making, optimizing\
    \ the process which leads to increment in profit and value. For doing that, the\
    \ organization needs to quickly process and analyze the data. Now, after EDA,\
    \ if the results are promising, we will train the ML models, and when we say models,\
    \ consider it across the organization at a scale of hundreds or more. To do this,\
    \ we need the infrastructure to support the training of the model. Cloud is better\
    \ suited for this setup due to the pay-what-you-need aspect and to address one-time\
    \ specific requirement. Also, a lot of operational cost is saved using the cloud\
    \ than an in-house setup, but to look into the profit-loss of in-house vs cloud\
    \ is beyond the scope of this book.    We will understand the container, images,\
    \ and Docker role in the context of creating reusable components. This will lay\
    \ the first building block of training at scale and building reproducible experiments.\
    \  \n\n  Container    A container packages the application in such a manner that\
    \ it is isolated from the environment (operating system) in which it is running.\
    \ The way they differ from VM is the VM share hardware, but each VM has its own\
    \ operating system. A Container is self-sufficient and many containers with different\
    \ requirements can run on the same operating system or server. Containers are\
    \ built based on images, either by running the same, or extending it as per the\
    \ need and then running it. There are multiple ways to create the images and run\
    \ the container, the most popular being Docker. We will discuss docker and go\
    \ through some basic commands, utilizing which, we will create the image and run\
    \ our containerized application on locale.  \n\n  Docker    Docker Inc. is the\
    \ organization which provides a whole suite of software and services which is\
    \ utilized to create the containers and save the images. We will mainly focus\
    \ our discussion on the docker desktop and docker hub. Loosely speaking, people\
    \ refer to everything as docker, however, each product/service is for a different\
    \ purpose. We use the docker desktop for creating images and running the container\
    \ on one’s machine, whereas the docker Hub is used for saving the images on cloud\
    \ from where they can be pulled for a later requirement.    We will discuss each\
    \ of these in details in the upcoming sections.  "
