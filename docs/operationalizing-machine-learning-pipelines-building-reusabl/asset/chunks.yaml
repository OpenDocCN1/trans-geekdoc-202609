    \ code is for the connection details table. We have given the name of the table\
    \ you need to replace it if you have given some other name to the table. The project\\\
    _name and dataset name should be replaced with the GCP project and Bigquery dataset.\
    \ This will form the source table name.    The event\\_timestamp\\_column has\
