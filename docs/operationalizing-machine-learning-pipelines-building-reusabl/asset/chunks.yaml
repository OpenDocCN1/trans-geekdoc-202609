- raw: "  Polyaxon setup    To install the Polyaxon community edition on GCP, we need\
    \ to install the K8s cluster. Everything in GCP is installed under a project.\
    \ If the project is not there in your GCP, please create one. You might have to\
    \ enable a few APIs on GCP, like the K8s cluster, and so on, for the user, under\
    \ whom you will run the script on GCP. Once the project is created, we can just\
    \ run the script in the GitHub link provided in the reference section. This script\
    \ takes four parameters to execute, which are as follows:     Project Google project\
    \ name under which the installation will happen.    The computation zone under\
    \ which the K8s cluster will be created. For more details, refer to https://cloud.google.com/compute/docs/regions-zones\
    \    Cluster Name of the K8s cluster a user wants to give.    Number of Maximum\
    \ number of nodes up to which the K8s cluster will auto scale.    We will go ahead\
    \ and complete the default configuration installation in the first step and then\
    \ we will upgrade the configuration. The steps which are performed in the script\
    \ after the K8s cluster installation are discussed as follows:     Creating a\
    \ namespace under which the Polyaxon community edition will be installed. The\
    \ command is as follows:    kubectl create namespace polyaxon    The next step\
    \ is to get the polyaxon package to install on the K8s cluster. We are using helm\
    \ for that which is a package manager for the K8s cluster. The command is as follows:\
    \    helm repo add polyaxon https://charts.polyaxon.com    The next step is to\
    \ deploy polyaxon and the command is as follows:    polyaxon admin deploy    Once\
    \ the installation is completed, either run the script polyaxon\\_dashboard.sh\
    \ or execute the individual command line by line in the GCP cloud shell. This\
    \ will enable the dashboard on port 8000 and can be viewed in the Web preview\
    \ mode from the GCP cloud shell. The dashboard will look like the screen shown\
    \ in Figure as follows:    ![](image-0652wadg.jpg)  Figure 5.3: Polyaxon dashboard\
    \     As we haven’t created any project, we will see Projects not    This completes\
    \ the installation of the K8s and Polyaxon cluster. Any additional configuration\
    \ will be discussed as and when required. We will run the ML training jobs in\
    \ the next chapter.  \n\n  Points to remember     The containers are a self-sufficient\
    \ piece of software which can run on any OS.    Docker is one way to create the\
    \ images and Docker hub is one of the many repositories where the images can be\
    \ stored.    Kubernetes or K8s are an open-source platform to deploy and manage\
    \ the containerized application.    GCP offers K8s under their computing services.\
    \    Polyaxon open source is a software from the Polyaxon organization which is\
    \ installed above K8s for the scalable and reproducible ML.  \n\n  Multiple choice\
    \ questions     What is the use of the FROM command in the Docker file?     To\
    \ get the base image on which the new image will be built    To import the files\
    \ from the directory mentioned after “FROM”    It is not required to have “FROM”\
    \ in the docker file    It tells the current working directory to the Docker file\
    \    Which of the following statements related to the container and VM (Virtual\
    \ Machine) is false?     Each VM shares the computer resources but has its own\
    \ OS.    Multiple containers can run on the same computer in one OS.    Containerized\
    \ application can be easily deployed from one computer to another.    Separate\
    \ OS needs to be installed for running separate containers.    What     User validation\
    \ utility of GCP    K8s installation utility    Tools and libraires to interact\
    \ with GCP    None of the above    Which of the statement(s) is True for the K8s\
    \ cluster?     K8s can only be installed on cloud.    K8s cannot auto scale. \
    \   Apps must be containerized to run on K8s.    GCP is the only cloud vendor\
    \ providing K8s.    What purpose does Polyaxon solve for ML?     Reproducible\
    \ results    Tracking experiments    Scalable    All of the above  \n\n  Answers\
    \     a    d    c    c    d  \n\n  Key terms     Template or Blueprint of the\
    \ container. Contains a set of instructions for creating the container.    The\
    \ K8s component where the containerized application runs. Each K8s cluster has\
    \ at least one node.  \n\n  References     Docker image creation \\- https://github.com/MLBook-VJ/First\\\
    _Docker\\_Image    Polyaxon installation \\- https://github.com/MLBook-VJ/Polyaxon\\\
    _Install  \n\nCHAPTER 6    Training and Testing ML Model – Part 2    In the previous\
    \ chapter, we looked at the tools and technologies such as Docker, Polyaxon and\
    \ Google Cloud Platform for training the machine learning models at scale. In\
    \ this chapter, we will learn how to use Polyaxon to train and track our ML models.\
    \  \n\n  Structure    In this chapter, we will cover the following topics:    \
    \ Overview    Polyaxon dashboard    Building blocks of training on Polyaxon   \
    \ Training a regression model    Training an image classification model  \n\n\
      Objectives    After studying this chapter, you will be able to utilize Polyaxon\
    \ to train the ML model and track all the artifacts related to the ML experiments.\
    \ We will cover one regression and one classification model. The GPU-based deep\
    \ learning model is also covered as part of the training. The goal is to show\
    \ how to run the experiment using Polyaxon. The models are not fine-tuned.  \n\
    \n  Overview    We covered all the basic building blocks of Polyaxon in the previous\
    \ chapter. We will take it forward by training a couple of models and tracking\
    \ the metadata and artifacts. The components of Polyaxon API utilized are also\
    \ discussed. The codes and references are provided for both the models created\
    \ in this chapter.    We will start with the Polyaxon dashboard.  \n\n  Polyaxon\
    \ dashboard    In the previous chapter, we installed Polyaxon on our K8s cluster.\
    \ The Polyaxon dashboard is a tool that lets us view our model training jobs.\
    \ It has a lot of capabilities such as the following:     View, sort, filter,\
    \ and compare the different model training jobs    Display native as well as custom\
    \ (Bokeh, Plotly, and Vega) visualizations    View job inputs, outputs, and logs\
    \    Resource (compute and memory) tracking    TensorBoard integration  \n\n \
    \ Accessing Polyaxon dashboard    The Polyaxon dashboard can be accessed from\
    \ the local system using the following single command:    polyaxon port-forward\
    \ \\--namespace=polyaxon    This command will make the Polyaxon dashboard available\
    \ at http://localhost:8000 and you will be able to access it using any browser\
    \ on your system.    All the model training jobs in Polyaxon need to exist inside\
    \ a project. Therefore, before we can start training the models, we need to create\
    \ a project. It can be done in two ways – either using the CLI or the Polyaxon\
    \ dashboard GUI. We will be using the CLI to create our project. This can be accomplished\
    \ with the following simple command:    polyaxon project create \\--name=my-project\
    \    Once we do this, our project will be visible on the dashboard, as shown in\
    \ Figure 6.1 as follows:    ![](image-yhfiu46c.jpg)  Figure 6.1: Polyaxon dashboard\
    \  \n\n  Building blocks of training on Polyaxon    The training models using\
    \ Polyaxon requires two major components, which are as follows:     A Docker image\
    \ containing the containerized training code    A Polyaxonfile that describes\
    \ the specifications of the training job    We’ll look at the steps needed to\
    \ create these two components.  "
  fmt: "\n# Polyaxon setup\n\nTo install the Polyaxon community edition on GCP, we\
    \ need to install the K8s cluster. Everything in GCP is installed under a project.\
    \ If the project is not there in your GCP, please create one. You might have to\
    \ enable a few APIs on GCP, like the K8s cluster, and so on, for the user, under\
    \ whom you will run the script on GCP. Once the project is created, we can just\
    \ run the script in the GitHub link provided in the reference section. This script\
    \ takes four parameters to execute, which are as follows:\n\n- Project: Google\
    \ project name under which the installation will happen.\n- The computation zone\
    \ under which the K8s cluster will be created. For more details, refer to `https://cloud.google.com/compute/docs/regions-zones`\n\
    - Cluster: Name of the K8s cluster a user wants to give.\n- Number: Maximum number\
    \ of nodes up to which the K8s cluster will auto scale.\n\nWe will go ahead and\
    \ complete the default configuration installation in the first step and then we\
    \ will upgrade the configuration. The steps which are performed in the script\
    \ after the K8s cluster installation are discussed as follows:\n\n### Creating\
    \ a namespace\nCreating a namespace under which the Polyaxon community edition\
    \ will be installed. The command is as follows:\n```bash\nkubectl create namespace\
    \ polyaxon\n```\n\nThe next step is to get the polyaxon package to install on\
    \ the K8s cluster. We are using `helm` for that which is a package manager for\
    \ the K8s cluster. The command is as follows:\n```bash\nhelm repo add polyaxon\
    \ https://charts.polyaxon.com\n```\n\nThe next step is to deploy polyaxon and\
    \ the command is as follows:\n```bash\npolyaxon admin deploy\n```\n\nOnce the\
    \ installation is completed, either run the script `polyaxon_dashboard.sh` or\
    \ execute the individual command line by line in the GCP cloud shell. This will\
    \ enable the dashboard on port 8000 and can be viewed in the Web preview mode\
    \ from the GCP cloud shell. The dashboard will look like the screen shown in Figure\
    \ as follows:\n\n![](image-0652wadg.jpg)\nFigure 5.3: Polyaxon dashboard\n\nAs\
    \ we haven’t created any project, this completes the installation of the K8s and\
    \ Polyaxon cluster. Any additional configuration will be discussed as and when\
    \ required. We will run the ML training jobs in the next chapter.\n\n### Points\
    \ to remember\n- The containers are a self-sufficient piece of software which\
    \ can run on any OS.\n- `Docker` is one way to create the images and `Docker hub`\
    \ is one of the many repositories where the images can be stored.\n- `Kubernetes`\
    \ or `K8s` are an open-source platform to deploy and manage the containerized\
    \ application.\n- GCP offers `K8s` under their computing services.\n- Polyaxon\
    \ open source is a software from the Polyaxon organization which is installed\
    \ above `K8s` for the scalable and reproducible ML.\n\n### Multiple choice questions\n\
    1. What is the use of the `FROM` command in the Docker file?\n   - To get the\
    \ base image on which the new image will be built\n   - To import the files from\
    \ the directory mentioned after “FROM”\n   - It is not required to have “FROM”\
    \ in the docker file\n   - It tells the current working directory to the Docker\
    \ file\n2. Which of the following statements related to the container and VM (Virtual\
    \ Machine) is false?\n   - Each VM shares the computer resources but has its own\
    \ OS.\n   - Multiple containers can run on the same computer in one OS.\n   -\
    \ Containerized application can be easily deployed from one computer to another.\n\
    \   - Separate OS needs to be installed for running separate containers.\n3. What:\n\
    \   - User validation utility of GCP\n   - K8s installation utility\n   - Tools\
    \ and libraires to interact with GCP\n   - None of the above\n4. Which of the\
    \ statement(s) is True for the K8s cluster?\n   - K8s can only be installed on\
    \ cloud.\n   - K8s cannot auto scale.\n   - Apps must be containerized to run\
    \ on K8s.\n   - GCP is the only cloud vendor providing K8s.\n5. What purpose does\
    \ Polyaxon solve for ML?\n   - Reproducible results\n   - Tracking experiments\n\
    \   - Scalable\n   - All of the above\n\n### Answers\n- a\n- d\n- c\n- c\n- d\n\
    \n### Key terms\n- Template: Template or Blueprint of the container. Contains\
    \ a set of instructions for creating the container.\n- Node: The K8s component\
    \ where the containerized application runs. Each K8s cluster has at least one\
    \ node.\n\n### References\n- Docker image creation - `https://github.com/MLBook-VJ/First_Docker_Image`\n\
    - Polyaxon installation - `https://github.com/MLBook-VJ/Polyaxon_Install`\n\n\
    # CHAPTER 6: Training and Testing ML Model – Part 2\n\nIn the previous chapter,\
    \ we looked at the tools and technologies such as `Docker`, `Polyaxon` and Google\
    \ Cloud Platform for training the machine learning models at scale. In this chapter,\
    \ we will learn how to use `Polyaxon` to train and track our ML models.\n\n##\
    \ Structure\nIn this chapter, we will cover the following topics:\n- Overview\n\
    - Polyaxon dashboard\n- Building blocks of training on Polyaxon\n- Training a\
    \ regression model\n- Training an image classification model\n\n## Objectives\n\
    After studying this chapter, you will be able to utilize `Polyaxon` to train the\
    \ ML model and track all artifacts related to the experiments. We will cover regression\
    \ and classification models. The GPU-based deep learning model is also covered\
    \ as part of the training. The goal is to show how to run the experiment using\
    \ `Polyaxon`.\n\n## Overview\nWe covered all the basic blocks of `Polyaxon` in\
    \ the previous chapter. We will take it forward by training a couple of models\
    \ and tracking the metadata. The components of `Polyaxon API` are also discussed.\
    \ The codes and references are provided for both the models. We will start with\
    \ the Polyaxon dashboard.\n\n## Polyaxon dashboard\nIn the previous chapter, we\
    \ installed `Polyaxon` on our `K8s` cluster. The Polyaxon dashboard is a tool\
    \ that lets us view our training jobs. It has a lot of capabilities such as:\n\
    - View, sort, filter, and compare the different training jobs\n- Display native\
    \ as well as custom (`Bokeh`, `Plotly`, and `Vega`) visualizations\n- View job\
    \ inputs, outputs, and logs\n- Resource (compute and memory) tracking\n- TensorBoard\
    \ integration\n\n## Accessing Polyaxon dashboard\nThe Polyaxon dashboard can be\
    \ accessed from the local system using the following single command:\n```bash\n\
    polyaxon port-forward --namespace=polyaxon\n```\nThis command will make the Polyaxon\
    \ dashboard available at `http://localhost:8000` and you will be able to access\
    \ it using any browser on your system.\n\nAll the model training jobs in `Polyaxon`\
    \ need to exist inside a project. Therefore, before we can start training the\
    \ models, we need to create a project. It can be done in two ways – either using\
    \ the CLI or the Polyaxon dashboard GUI. We will be using the CLI to create our\
    \ project. This can be accomplished with the following simple command:\n```bash\n\
    polyaxon project create --name=my-project\n```\nOnce we do this, our project will\
    \ be visible on the dashboard, as shown in Figure 6.1 as follows:\n\n![](image-yhfiu46c.jpg)\n\
    Figure 6.1: Polyaxon dashboard\n\n## Building blocks of training on Polyaxon\n\
    The training models using `Polyaxon` requires two major components, which are\
    \ as follows:\n- A `Docker` image containing the containerized training code\n\
    - A `Polyaxonfile` that describes the specifications of the training job\nWe’ll\
    \ look at the steps needed to create these two components.\n"
  trans: "\n\n# Polyaxon 安装\n\n要在 GCP 上安装 Polyaxon 社区版，我们需要安装 K8s 集群。GCP 中的所有内容都安装在项目（project）下。如果您的\
    \ GCP 中没有该项目，请创建一个。您可能需要为在 GCP 上运行脚本的用户启用一些 API，例如 K8s 集群等。一旦创建了项目，我们就可以直接运行参考部分提供的\
    \ GitHub 链接中的脚本了。该脚本执行时需要四个参数，如下：\n\n- Project（项目）：进行安装的 Google 项目名称。\n- The computation\
    \ zone（计算区域）：创建 K8s 集群的计算区域。更多详情请参阅 `https://cloud.google.com/compute/docs/regions-zones`\n\
    - Cluster（集群）：用户想要命名的 K8s 集群名称。\n- Number（数量）：K8s 集群自动伸缩到的最大节点数。\n\n我们将在第一步完成默认配置安装，然后将升级配置。在\
    \ K8s 集群安装后，在脚本中执行的步骤讨论如下：\n\n### 创建命名空间 (namespace)\n创建一个用于安装 Polyaxon 社区版的命名空间。命令如下：\n\
    ```bash\nkubectl create namespace polyaxon\n```\n\n下一步是获取 polyaxon 包并安装到 K8s 集群。我们使用\
    \ `helm`，它是 K8s 集群的包管理器。命令如下：\n```bash\nhelm repo add polyaxon https://charts.polyaxon.com\n\
    ```\n\n下一步是部署 polyaxon，命令如下：\n```bash\npolyaxon admin deploy\n```\n\n安装完成后，可以运行\
    \ `polyaxon_dashboard.sh` 脚本，或者在 GCP cloud shell 中逐行执行单独命令。这将启用端口 8000 上的仪表板，并通过\
    \ GCP cloud shell 的 Web 预览模式进行查看。仪表板的界面将如图所示：\n\n![](img/image-0652wadg.jpg)\n\
    图 5.3：Polyaxon 仪表板\n\n由于我们还没有创建任何项目，这标志完成了 K8s 和 Polyaxon 集群的安装。任何额外的配置将根据需要进行讨论。我们将在下一章运行\
    \ ML 训练任务。\n\n### 注意事项\n- 容器是自给自足的软件单元，可以在任何操作系统上运行。\n- `Docker` 是创建镜像的一种方式，`Docker\
    \ hub` 是存储镜像的众多仓库之一。\n- `Kubernetes` 或 `K8s` 是用于部署和管理容器化应用的开源平台。\n- GCP 在其计算服务下提供了\
    \ `K8s`。\n- Polyaxon 开源是 Polyaxon 组织的软件，安装在 `K8s` 之上，用于可扩展和可复现的 ML。\n\n### 多选题\n\
    1. Docker 文件中 `FROM` 命令的作用是什么？\n   - 获取用于构建新镜像的基础镜像\n   - 从“FROM”之后提到的目录中导入文件\n\
    \   - docker 文件中不需要有“FROM”\n   - 它告诉 docker 文件当前的工作目录\n\n2. 下列关于容器和 VM（虚拟机）的陈述中，错误的是？\n\
    \   - 每个虚拟机共享计算机资源，但有其自己的操作系统。\n   - 多个容器可以在同一台计算机的同一个操作系统上运行。\n   - 容器化应用可以轻松地从一台计算机部署到另一台。\n\
    \   - 运行不同的容器需要安装独立的操作系统。\n3. kubectl 是什么：\n   - GCP 用户验证工具\n   - K8s 安装工具\n \
    \  - 与 GCP 交互的工具和库\n   - 以上均不是\n4. 关于 K8s 集群，哪个陈述是正确的？\n   - K8s 只能安装在云端。\n  \
    \ - K8s 无法自动伸缩。\n   - 应用程序必须容器化才能运行在 K8s 上。\n   - GCP 是唯一提供 K8s 的云供应商。\n5. Polyaxon\
    \ 为 ML 解决了什么问题？\n   - 可复现的结果\n   - 实验跟踪\n   - 可扩展性\n   - 以上所有\n\n### 答案\n- a\n\
    - d\n- c\n- c\n- d\n\n### 核心术语\n- Template（模板）：容器的模版或蓝图。包含了一组创建容器的指令。\n- Node（节点）：运行容器化应用的\
    \ K8s 组件。每个 K8s 集群至少有一个节点。\n\n### 参考文献\n- Docker 镜像创建 - `https://github.com/MLBook-VJ/First_Docker_Image`\n\
    - Polyaxon 安装 - `https://github.com/MLBook-VJ/Polyaxon_Install`\n\n# 第 6 章：训练与测试\
    \ ML 模型 – 部分 2\n\n在上一章中，我们查看了诸如 `Docker`、`Polyaxon` 和 Google Cloud Platform 等工具和技术，用于大规模地训练机器学习模型。在这一章中，我们将学习如何使用\
    \ `Polyaxon` 来训练和跟踪我们的 ML 模型。\n\n## 结构\n在本章中，我们将涵盖以下主题：\n- 概述\n- Polyaxon 仪表板\n\
    - Polyaxon 训练的构建模块\n- 训练回归模型\n- 训练图像分类模型\n\n## 目标\n学习本章后，你将能够利用 `Polyaxon` 训练\
    \ ML 模型并跟踪与实验相关的所有工制品。我们将涵盖回归和分类模型。基于 GPU 的深度学习模型也作为训练的一部分涵盖在内。目标是展示如何使用 `Polyaxon`\
    \ 运行实验。\n\n## 概述\n上一章涵盖了 `Polyaxon` 的所有基础模块。我们将通过训练两个模型并跟踪元数据来继续。`Polyaxon API`\
    \ 的组件也得到了讨论。为两个模型提供了代码。我们将从 Polyaxon 仪表板开始。\n\n## Polyaxon 仪表板\n在上一章中，我们在 `K8s`\
    \ 集群上安装了 `Poly`。Polyaxon 仪表板是一个让我们查看训练任务的工具。它具有许多功能，例如：\n- 查看、排序、过滤和比较不同的训练任务\n\
    - 显示原生以及自定义（`Bokeh`、`Plotly` 和 `Vega`）可视化\n- 查看任务输入、输出和日志\n- 资源（计算和内存）跟踪\n- TensorBoard\
    \ 集成\n\n## 访问 Polyaxon 仪表板\n可以使用以下命令从本地系统访问 Polyaxon 仪表板：\n```bash\npolyaxon port-forward\
    \ --namespace=polyaxon\n```\n该命令将 Polyaxon 仪表板发布在 `http://localhost:8000`，你可以使用系统上的任何浏览器访问。\n\
    \nPolyaxon 中所有的模型训练任务都需要存在于项目中。因此，在我们开始模型之前，我们需要项目。有两种方法：使用 CLI 或 Polyaxon 仪表板\
    \ GUI。我们将使用 CLI 创建项目。这可以通过以下简单的命令实现：\n```bash\npolyaxon project create --name=my-project\n\
    ```\n一旦执行，我们的项目将显示在仪表板上，如图 6.1 所示：\n\n![](img/image-yhfiu46c.jpg)\n图 6.1：Polyaxon\
    \ 仪表板\n\n## Polyaxon 训练的构建模块\n使用 `Polyaxon` 训练模型需要两个主要组件，如下：\n- 包含容器化训练代码的 `Docker`\
    \ 镜像\n- 描述训练任务规范的 `Polyaxonfile`\n我们将查看创建这两个组件所需的步骤。\n\n"
