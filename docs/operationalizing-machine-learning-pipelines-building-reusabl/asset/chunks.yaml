  fmt: "\n# Feature definitions\n\nWe have edited our `feature_store.yaml` file and\
    \ understood the data source available to us; the next task is to model the data\
    \ in the feast data model format. For doing that, we need to create the `entity`,\
    \ `data source`, and `Feature view`. We will explain the concept by taking one\
    \ example of each with a code. The complete code link will be shared for the example\
    \ in the reference section. We will start with entity.\n\n## Entity\n\nEntity\
    \ is like the primary key on which the features are aggregated from the multiple\
    \ feature views. In our case, `CustomerID` is the entity that we need to create\
    \ as all the features are for an individual customer identified by. To create\
    \ entity, we will use the following code:\n\n```python\n# Define an entity for\
    \ the Customer.\ncustomer = Entity(\n  # Name of the entity. Must be unique within\
    \ a project\n  Name = \"CustID\",\n  # The join key of an entity describes the\
    \ storage level field/column on which\n  # features can be looked up. The join\
    \ key is also used to join feature\n  # tables/views when building feature vectors\n\
    \  join_key = \"CustomerID\",\n  # The storage level type for an entity\n  value_type\
    \ = ValueType.STRING,\n)\n```\n\nIn this code, we are creating an entity where\
    \ the `Name` we are giving to the entity is and the `join_key` is to look for\
    \ the source table for that entity. You can give any name you want to the entity,\
    \ but make sure to use the name correctly in the feature views. The `value_type`\
    \ is the data type of the entity. The entities can be a combination of multiple\
    \ keys like `CustomerID` and `Department` and so on, depending on the business\
    \ problem. Once the entity is created, the next step is to create the data source.\n\
    \n## Data source\n\nData source is defined as the file or table from where the\
    \ features’ values are picked up. Since, we are using GCP, for us, the source\
    \ will be the Bigquery tables, which we discussed earlier. To create a data source\
    \ in feast, we will use the following code:\n\n```python\n# Cust Connection Details\n\
    cust_conn_details_source = BigQuerySource(\n  # The BigQuery table where features\
    \ can be found\n  table_ref=\"project_name.dataset.cust_conn_det\",\n  # The event\
    \ timestamp is used for point-in-time joins and for ensuring only\n  # features\
    \ within the TTL are returned\n  event_timestamp_column=\"feature_creation_date\"\
    ,\n  created_timestamp_column=\"record_creation_date\",\n)\n```\n\nThe connection\
    \ we have created in the preceding code is for the connection details table. We\
    \ have given the name of the table you need to replace it if you have given some\
    \ other name to the table. The `project_name` and `dataset` name should be replaced\
    \ with the GCP project and Bigquery dataset. This will form the source table name.\n\
    \nThe `event_timestamp_column` has two uses, one to do point-in-time join on features\
    \ and second to understand how much information it should hold in the online store\
    \ (discussed in the next section). For our example, we are using `feature_creation_date`\
    \ in the data as\n\nThe other date column `created_timestamp_column` is not a\
    \ mandatory field, but we have used it in our case. It is used to remove the duplicates.\n\
    \nThe next step is to define the feature views, where the data is stored and can\
    \ be accessed for training and scoring. We will discuss that in the upcoming section.\n\
    \n## Feature view\n\nFeature views are the schema where the data is actually stored.\
    \ The offline data is used for training and the online data is used for scoring.\
    \ The following code highlights the way the feature views are created:\n\n```python\n\
    # Connection Feature View\ncust_conn_fv = FeatureView(\n  name=\"customer_conn_det\"\
    ,\n  entities=[\"CustID\"],\n  ttl=timedelta(days=365),\n  features=[\n    Feature(name=\"\
    Tenure\", dtype=ValueType.INT64),\n    Feature(name=\"PhoneService\", dtype=ValueType.INT32),\n\
    \    Feature(name=\"MultipleLines\", dtype=ValueType.INT32),\n    Feature(name=\"\
    InternetService\", dtype=ValueType.INT32),\n    Feature(name=\"OnlineSecurity\"\
    , dtype=ValueType.INT32),\n    Feature(name=\"OnlineBackup\", dtype=ValueType.INT32),\n\
    \    Feature(name=\"DeviceProtection\", dtype=ValueType.INT32),\n    Feature(name=\"\
    TechSupport\", dtype=ValueType.INT32),\n    Feature(name=\"StreamingTV\", dtype=ValueType.INT32),\n\
    \    Feature(name=\"StreamingMovies\", dtype=ValueType.INT32),\n  ],\n  input=cust_conn_details_source,\n\
    )\n```\n\nThe `name` is the user-defined name given to the feature view. The `entities`\
    \ are the entities created in the first step; we are passing the name given to\
    \ that entity. Next is `ttl` which defines how long the feature is present in\
    \ the feature store in terms of days or weeks (there are other options) from the\
    \ lookup date. This helps store only the relevant amount of data in the online\
    \ store. Next are the set of features that will be a part of feature view. These\
    \ are the column names in the data source. The `input` is the data source created.\
    \ Each feature view can have only one data source, but multiple feature views\
    \ can be created from a single data source.\n\nOnce done with entity, data source,\
    \ and feature view, we need to create the infra and setup for feast. We will cover\
    \ the commands that do that and learn how we can load the data in the online store\
    \ in the following section.\n\n# Creating feature store infra and loading data\n\
    \nOnce we are done with the coding aspect, which defines the infra and schema\
    \ of the feature store, we have to create them. Feast does that for us. All we\
    \ need to do is execute the following command and all the infra will be created:\n\
    \n```\nfeast apply\n```\n\nThe command should be executed in the folder where\
    \ `feature_store.yaml` is the one where feast is initialized. In case you want\
    \ to execute the command from a different folder, use the change directory option\
    \ of feast.\n\nFeast will scan through all the Python files in the folder and\
    \ create the infra required including creating or syncing the metadata. It will\
    \ also validate the feature definitions. In our case, `entity.db` will be created\
    \ under the folder which is passed as the parameter in. It will also create three\
    \ views in the Data store in GCP for the online store, but they won’t have the\
    \ data. The user needs to make sure that the account under which the command is\
    \ executed in GCP, should have all the necessary access.\n\nThe next step is to\
    \ load the data into the online store. To do that, we use `materialize` with feast,\
    \ as shown as follows:\n\n```bash\nfeast start start_date end_date\n```\n\nThe\
    \ preceding command will load the features from the data source in all the online\
    \ feature views in the date range specified by the start and end dates. You can\
    \ materialize the specific views by passing names with the `-v` or `--views` options.\n\
    \nFeast `materialize-incremental` loads the incremental data. The incremental\
    \ loads start from the previously ingested time till the end date you specify.\
    \ If you don’t pass the views name, all the views are updated. The command for\
    \ incremental upload is as follows:\n\n```bash\nfeast materialize-incremental\
    \ end_date\n```\n\nThe incremental loading can be scheduled using a scheduler\
    \ like cron or Airflow. The whole setup can be maintained at one centralized location\
    \ using Git. Next, we will look into how to access the online and offline features\
    \ using feast for training and scoring new data.\n"
  trans: "\n\n# 特性定义\n\n我们已经编辑了 `feature_store.yaml` 文件并理解了我们可用的数据源；接下来的任务是以 feast\
    \ 数据模型格式对数据进行建模。为了实现这一点，我们需要创建 `entity`（实体）、`data source`（数据源）和 `Feature view`（特征视图）。我们将通过每个概念的示例并结合代码来解释这些概念。参考部分将共享该示例的完整代码链接。我们将从实体开始。\n\
    \n## 实体 (Entity)\n\n实体类似于主键，特征从多个特征视图中聚合此处。在我们的案例中，`CustomerID` 是我们需要创建的实体，因为所有特征都是针对由该标识标识的单个客户。要创建实体，我们将使用以下代码：\n\
    \n```python\n# 为 Customer 定义一个实体。\ncustomer = Entity(\n  # 实体的名称。必须在项目内是唯一的\n\
    \  Name = \"CustID\",\n  # 实体的连接键描述了可以查找特性的存储层字段/列。\n  # 连接键在构建特征向量时也用于连接特征表/视图\n\
    \  join_key = \"CustomerID\",\n  # 实体的存储层类型\n  value_type = ValueType.STRING,\n\
    )\n```\n\n在此段代码中，我们正在创建一个实体，我们给实体的 `Name` 是名称，而 `join_key` 是用于查找该实体的源表。你可以为实体提供任何喜欢的名称，但要确保在特征视图中正确使用该名称。`value_type`\
    \ 是实对应的数据类型。根据业务问题，实体可以是多个键的组合，例如 `CustomerID` 和 `Department` 等。一旦创建了实体，下一步是创建数据源。\n\
    \n## 数据源 (Data source)\n\n数据源定义为获取特征值的文件或表格。由于我们正在使用 GCP，对于我们来说，源将是之前讨论过的 Bigquery\
    \ 表格。在 feast 中创建数据源，我们将使用以下代码：\n\n```python\n# 客户连接详情\ncust_conn_details_source\
    \ = BigQuerySource(\n  # 可以在其中找到特性的 BigQuery 表\n  table_ref=\"project_name.dataset.cust_conn_det\"\
    ,\n  # 事件时间戳用于点点连接 (point-in-time joins) \n  # 并确保只返回 TTL（生存时间）范围内的特征\n  event_timestamp_column=\"\
    feature_creation_date\",\n  created_timestamp_column=\"record_creation_date\"\
    ,\n)\n```\n\n我们在前面的代码中创建的连接是用于连接详情表的。我们提供了表格名称，如果你为表格指定了其他名称，则需要进行替换。`project_name`\
    \ 和 `dataset` 名称应该替换为 GCP 项目和 Bigquery 数据集名称。这将形成源表名。\n\n`event_timestamp_column`\
    \ 有两个用途：一个用于对特征进行点点连接，另一个用于理解它在在线存储中应持有多少信息（在下一节中讨论）。对于我们的示例，我们在数据中使用 `feature_creation_date`\
    \ 作为。\n\n另一个日期列 `created_timestamp_column` 不是强制字段，但我们在案例中使用了它。它用于去重。\n\n下一步是定义特征视图（feature\
    \ views），数据存储在此处并供训练和评分访问。我们将在接下来的章节中讨论这一点。\n\n## 特征视图 (Feature view)\n\n特征视图是实际存储数据的模式。离线数据用于训练，在线数据用于评分。以下代码重点突出了创建特征视图的方法：\n\
    \n```python\n# 连接特征视图\ncust_conn_fv = FeatureView(\n  name=\"customer_conn_det\"\
    ,\n  entities=[\"CustID\"],\n  ttl=timedelta(days=365),\n  features=[\n    Feature(name=\"\
    Tenure\"),\n    Feature(name=\"PhoneService\"),\n    Feature(name=\"MultipleLines\"\
    ),\n    Feature(name=\"InternetService\"),\n    Feature(name=\"OnlineSecurity\"\
    ),\n    Feature(name=\"OnlineBackup\"),\n    Feature(name=\"DeviceProtection\"\
    ),\n    Feature(name=\"TechSupport\"),\n    Feature(name=\"StreamingTV\"),\n \
    \   Feature(name=\"StreamingMovies\"),\n  ],\n  input=cust_conn_details_source,\n\
    )\n```\n\n`name` 是我们给特征视图的名称，`entities` 是该视图对应的实体，`ttl` 定义了生存时间。`features` 包含了特征列表，每个特征都有自己的名称。`input`\
    \ 是该视图对应的数据源。\n\n"
