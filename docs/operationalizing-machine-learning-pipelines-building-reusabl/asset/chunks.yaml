- raw: "  Training ML model    Training the model will remain the same as what we\
    \ did in Chapter 5, “Training and Testing ML Model – Part however, we will utilize\
    \ the data from the feature store for training the model. Also, to run the script\
    \ securely and to login at the run time, we can inject the GCP login details via\
    \ the GitHub/Gitlab environment variable. For test purpose, we passed the credential\
    \ in our docker file, but that is not secure. You can pass the file in init of\
    \ the Polyaxon file, which is a secure way of doing so. That service account will\
    \ be read in the polyaxonfile.yaml script by the following code:    env:  \\-\
    \ name: GOOGLE\\_APPLICATION\\_CREDENTIALS  value: /etc/secrets/credentials.json\
    \    This time, we will train the model by passing the hyperparameter\\_grid.yml\
    \ file, which will internally utilize the polyaxonfile.yaml and fit the best model.\
    \ The command to execute this is as follows:    polyaxon run \\-f hyperparameter\\\
    _grid.yml \\-p project \\--name experiment\\_name \\-P git\\_repo=polyaxon \\\
    --eager    The users need to make sure that the service account has the required\
    \ access, like BigQuery dataset to read the data and the GCS cloud buckets to\
    \ read the Feast metadata and write the training metadata. For more details on\
    \ the service account and to see how to create the keys, you can refer to the\
    \ following link:    https://cloud.google.com/iam/docs/creating-managing-service-account-keys\
    \    Once the training is done, we will get the folders for each run under the\
    \ GCS bucket configured as the artifact store, and we will get the folders for\
    \ each run in that bucket, as shown in Figure    ![](image-vnypfl7g.jpg)  Figure\
    \ 9.1: Metadata on GCS    Under each run, all the metadata that you logged in\
    \ your Python training script will be available, including the data, model binary,\
    \ and any additional artifacts that you have logged using the tracking module.\
    \ The files will look like as shown in Figure    ![](image-2emd0uvi.jpg)  Figure\
    \ 9.2: Run details    We will utilize these artifacts of the finalized model for\
    \ deployment.  \n\n  Deployment    Once we finalize the model based on the KPIs\
    \ defined and the stakeholders' approval, the next task is to deploy the model.\
    \ We will utilize KServe for deployment and it will be installed under a different\
    \ K8s namespace. The idea to use a different namespace is better, because it will\
    \ isolate the training from serving the model. KServe offers a lot of additional\
    \ services apart from model serving like auto scaling, canarying, explainability,\
    \ and so on. Due to these advantages, it is an ideal tool for serving the finalized\
    \ model.    We will not discuss the installation of KServe here; however, the\
    \ Git repo provided in the Reference section will have the details of the KServe\
    \ installation that we use. We will also share the link to a more detailed installation\
    \ than what we are using. The deployment scripts will perform the following tasks\
    \ after KServe is installed:     Copy the metadata of run like the training data,\
    \ model binaries, and any other artifacts on the production folder.    Update\
    \ the model path in the deployment yml file.    Execute the K8s command to deploy\
    \ the model.    Once the model is deployed, we can use the following command to\
    \ test the output:    SERVICE\\_HOSTNAME=$(kubectl get inferenceservice sklearn-churn\
    \ \\-o jsonpath='{.status.url}' | cut \\-d \"/\" \\-f 3)  INGRESS\\_PORT=$(kubectl\
    \ \\-n istio-system get service istio-ingressgateway \\-o  INGRESS\\_HOST=$(kubectl\
    \ \\-n istio-system get service istio-ingressgateway \\-o jsonpath='{.status.loadBalancer.ingress\\\
    [0\\].ip}')  curl \\-v \\\\  \\-H \"Host: ${SERVICE\\_HOSTNAME}\" \\\\  \\-H \"\
    Content-Type: application/json\" \\\\  \\-d @./input.json \\\\  http://${INGRESS\\\
    _HOST}:${INGRESS\\_PORT}/v2/models/sklearn-churn/infer    The idea is to pass\
    \ the Polyaxon run ID of the best model to the deployment script and all the rest\
    \ will be taken care of by the script itself. You will need to create another\
    \ bucket where the final/deployed models’ metadata are copied with either the\
    \ datetime details or version numbers (this can be automated in the script). All\
    \ the metadata related to the ML model should be saved for each deployment, audit,\
    \ and monitoring purpose.    If we want to enable the security, which is recommended,\
    \ we can refer to this This is for GCP, and depending on the cloud provider that\
    \ you are working on, look for hardening your K8s cluster.  \n\n  Consumption\
    \    Consumption comes after the model is deployed and it might not be a separate\
    \ step if the output of the deployed model directly solves the business purpose.\
    \ However, that is rarely the case, and the output needs to be in some reporting\
    \ tools like Tableau or PowerBI, with the massaged output of the ML model. Sometimes,\
    \ the whole output is not required, and some pre-processing is required before\
    \ it is consumed. For that, we need to write the services which are equally scalable\
    \ as the model, scoring itself for the consumption purpose. There are multiple\
    \ ways to do that on cloud; however, one of the vendor independent ways is to\
    \ create the services on the K8s cluster. For our example, we will not go into\
    \ the consumption details, but you can utilize the techniques discussed to create\
    \ the consumption as per your requirement.    We will look into the GitOps part\
    \ in the following section.  \n\n  GitOps    We covered training and deployment\
    \ of the ML model; however, we would like to automate the process, and for that,\
    \ we can use GitHub Action, which is a CI tool from GitHub. Training the ML model\
    \ is an expensive process in terms of the resources they need, and we need to\
    \ go through multiple checkpoints before a model can make it to production. These\
    \ steps need to be automated with a proper approval put in place. We will go through\
    \ one example of a flow which will show how the whole ML pipeline can be automated.\
    \ We will follow the two-branch strategy, DEV and PROD. We will detail out what\
    \ happens in each branch, as shown in Figure    ![](image-2d14b2yq.jpg)  Figure\
    \ 9.3: Branching strategy    Dev    In Dev, as shown in the preceding figure,\
    \ the code review will happen as per the organization standards. The Data Scientist\
    \ also needs to justify the modeling technique that is finalized, based on EDA\
    \ and any ad hoc experiments they have run. After a proper approval (this might\
    \ not be needed every time), the experiments will run to train the model and their\
    \ performance will be tracked. The steps like code quality checks can be automated,\
    \ and a few steps can be a combination of manual and automation like the modelling\
    \ technique review and approval. Once the model is trained and the performance\
    \ is up to the expectation, the model will be deployed to production.    Prod\
    \    We already covered what happens in the model deployment phase in the preceding\
    \ Deployment section. However, in the branching strategy, all the code utilized\
    \ in Dev will just move to the Prod branch, without triggering any training. The\
    \ deployment script is the only script that will run on Prod which will deploy\
    \ the model binary/graphs. It will move the metadata like model binaries, data\
    \ used for training and so on, to the production folder for reference purpose.\
    \    Please remember that this is one of the many ways in which you can plan the\
    \ branching strategy of your ML pipeline, and depending on your need, you can\
    \ include monitoring in your GitOps pipeline as well, which we will discuss in\
    \ the upcoming section. For the preceding setup that we discussed, you can use\
    \ GitHub Action as we use GitHub for all our code.  "
