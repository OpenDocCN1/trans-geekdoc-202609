    # MLOps


    MLOps stands for Machine Learning Operations and is in line with DevOps of the
    typical software development. However, unlike DevOps, in MLOps, there are a lot
    of things other than the code, which needs to be taken care of and the KPIs are
    not only software specific, but each problem brings its own set of KPIs.


    MLOps as a process starts after EDA. EDA is more experimental in nature and hence
    putting a process around that will be challenging. However, after EDA, everything
    should follow a process and should be done in such a way that it can be backtracked
    and repeated, if required. The other important thing that MLOps should enable
    is a seamless process from training a model until the consumption of the model.
    The evaluation and monitoring should also be part of the MLOps. To summarize everything,
    apart from EDA, all other aspect of ML use case should be part of MLOps.


    ## Reproducibility and Data Management


    For the reproducibility of a model, we need the data on which the model was trained.
    In the age of big data, these files can be huge and can’t be stored in a similar
    manner as the code. For that, we need a separate mechanism which can be achieved
    in multiple ways.


    One way is to store the model in a folder on a central repository with the folder
    structure of something like `UseCase/Version/datafile` and making sure the scripts
    moving the model for deployment, moves the relevant data in this folder. At the
    same time, this process has been made very easy by tools like `DVC`, which extend
    the `Git` functionality by providing the files which store the metadata and location
    detail of the data on which the model was trained. The important thing is to put
    a process in place such that any model moving for deployment and its related data
    can be versioned and tracked. The choice of using a tool is completely based on
    the requirement and availability.


    ## Artifacts and Standardization


    While establishing the MLOps process, we need to make sure that any artifacts,
    binaries, or graphs that are generated are also stored and versioned. Generally,
    the model binaries and graphs are saved; however, if you are doing any standardization
    of variable or any processing which is not dependent on the code, those artifacts
    need to be stored.


    As an example, consider that you are normalizing all the continuous variable for
    your model training using the mean and standard deviation. Since the new data
    needs to be normalized using the old values only, we need to store these values.
    One way is to use some inbuilt library which in turn will generate a binary that
    can be used later. This way, there are many small artifacts apart from the model
    itself which will be generated. They also need to be stored and utilized accordingly.
    The way the data is saved and stored, these artifacts can follow the same process.
    For tracking purpose, there are a few tools available, like `MLFlow`, which provide
    a dashboard, with the information of the model trained with their metadata.


    ## Code Management and Deployment Pipeline


    For training, test, deployment, and consumption, most of the things are done via
    code. The code needs to be versioned, but that is not a challenge as that is happening
    for quite some time and many tools are available for the same, with `Git` being
    the most popular one. A few things which need to be taken care of while maintaining
    the code is to connect it to any artifact that they generate like the ones discussed
    earlier – `docker` images and so on. One way to do that is to attach the `git
    commit id` to the artifact, which is assigned to the code that generated the artifact.
    The important thing is to put a process in place so that everything can be backtracked
    and reproduced. As we speak, there might be some tool which will make your task
    easier; all you need is ensure that you know what all is required.


    Unlike the typical software where you automate the test cases and based on that
    the code move to a higher environment, in the ML world, everything happens on
    the production data. There can be a separate environment where the production
    data can be provided, so that the experiments can be conducted on the production
    data without disturbing the production environment. Since, all the things are
    conducted on the production data, the concept of moving the code to a higher environment
    is only for reference. It is the artifacts like model binaries and any other related
    data processing binaries that move from development to production in case of ML
    for deployment.


    The consumption part is something which sits and runs in the production environment
    utilizing all the artifacts which move as part of the deployment. Training the
    ML model can be a costly affair in terms of resources, so sometimes, an intermediate
    step is inserted between the development and deployment for more control. This
    step can be called as training or staging. Figure 3.5 highlights the steps that
    happen in model training to deployment, and this can be used in setting up your
    process, as shown as follows:


    ![](image-f6d1vmzp.jpg)

    Figure 3.5: Multistage training deployment


    ## Conclusion


    Overall, the MLOps process should be setup in such a manner that it enables the
    reproducibility and, at the same time, make the whole ML lifecycle as smooth as
    possible. We also need to be careful about a few places in the ML lifecycle (like
    interpreting the KPIs, which are the output of model training and testing) that
    needs_ to be interpreted manually and the process and tool selection should be
    such that it enables the manual intervention.


    As an example, it might be that for a certain set of problem, an `AUC` of 0.7
    is good and the model gets to be deployed and consumed. Similarly, another problem,
    with the same `AUC` might not be good enough to be deployed. There can be multiple
    reasons for that, and these things need to be sorted out manually with reasoning
    and logic. The process should keep the provision for that, as these reasonings
    will happen between different stakeholders, but once the approval or rejection
    happens, the next steps can be smooth and clear. There are a lot of developments
    in terms of tools to enable MLOps; however, a thorough understanding of the ML
    lifecycle can enable you to design a better process.


    Another aspect as to why MLOps is very important is because of the retraining
    of ML model. We would not want to start from scratch for the use case which are
    already productionized. Starting from scratch again will slow down the whole process
    and it might happen that by the time the model reaches production, it is outdated.
    Therefore, the whole process should be carefully devised and put in place, so
    that it fulfills all the requirements discussed in this section. Figure 3.6 shows
    the tools and one of the ways in which the overall end-to-end MLOps process can
    be achieved; however, these tools can be changed as per choice and availability,
    as shown as follows:


    ![](image-p4yiwcxi.jpg)

    Figure 3.6: MLOps overview with tech stack


    As shown in the preceding figure, we are highlighting an end-to-end MLOps process
    with the tools in place. We will discuss what all the components are and their
    use, as follows:


    - Data which is used for training and validating the model

    - Codes which are utilized to perform the task

    - `GitHub` which is used for version maintenance and CI/CD process

    - `DVC` Version which is used for maintaining the data version for all the experiments

    - `ML Training`, after approval, where the training will happen, for example,
    `GCP AI Platform`, `Kubernetes cluster` or `Spark engine`, and so on

    - KPIs to highlight the performance of the model, `CML` integrates with `Git`
    to display the KPIs via `Git`

    - After approval, the model to be deployed for consumption

    - Deployed model metadata, like version number, data location, and so on in some
    table. This information can be used for audit and reproducibility.


    The approval process and all the steps can be automated using `GitHub Actions`
    for CI/CD, including the approvals. Also, as mentioned, these tools are for reference
    purpose and can be changed, as per availability.

    '
  trans: '


    # MLOps


    MLOps 代表机器学习运维（Machine Learning Operations），与典型软件开发中的 DevOps 一致。然而，与 DevOps 不同，在
    MLOps 中除了代码外还有很多需要关注的内容，且 KPI（关键指标）不仅限于软件，每个问题都有自己的一套 KPI。


    MLOps 作为一个流程始于 EDA（探索性数据分析）之后。EDA 本质上更具实验性，因此为其建立流程具有挑战性。然而，在 EDA 之后，一切都应该遵循流程，并确保在需要时可以追溯和重复。MLOps
    应该实现的另一个重要点是从模型训练到模型消耗的无缝流程。评估和监控也 MLOps 的一部分。总而言之，除了 EDA 外，机器学习用例的所有其他方面都应该是
    MLOps 的组成。


    ## 可复现性和数据管理


    为了模型的可复现性，我们需要训练模型时的数据。在大数据时代，这些文件可能非常巨大，无法以类似于代码的方式存储。为此，我们需要一种独立的机制，可以通过多种方式实现。


    一种方法是将模型存储在中央仓库的文件夹中，采用类似于 `UseCase/Version/datafile` 的文件夹结构，并确保用于部署模型的脚本会移动该文件夹中的相关数据。同时，通过
    `DVC` 等工具，这一过程变得非常简单，`DVC` 通过提供存储训练模型所用数据的元数据和位置详细信息的文件，扩展了 `Git` 的功能。重要的是建立一套流程，使得任何移动用于部署的模型及其相关数据都可以进行版本控制和跟踪。使用工具的选择完全取决于需求和可用性。


    ## 产物与标准化


    在建立 MLOps 流程时，我们需要确保生成的任何产物、二进制文件或图表都被存储并进行版本控制。通常，会保存模型二进制文件和图表；但如果你对变量进行了任何标准化或不依赖于代码的处理，这些产物也需要被存储。


    例如，假设你正在使用均值和标准差对模型训练的所有连续变量进行归一化。由于新数据需要使用旧值进行归一化，我们需要存储这些值。一种方法是使用某些内置库，它会生成一个以后使用的二进制文件。这样，除了模型本身，还会生成许多小产物。它们也需要相应的存储和利用。根据数据保存和存储的方式，这些产物可以遵循相同的流程。为了跟踪目的，有一些可用的工具，如
    `MLFlow`，它提供了一个仪表板，显示训练模型及其元数据的信息。


    ## 代码管理与部署流水线


    对于训练、测试、部署和消费，大部分工作通过代码完成。代码需要进行版本控制，但这并不是挑战，因为这种情况已经持续很长时间了，并且有很多工具可以实现，其中 `Git`
    是最流行的。在维护代码时需要注意的几点包括将其与其生成的任何产物连接起来，例如之前讨论的 `docker` 镜像等。实现这一点的方法是将 `git commit
    id` 附加到产物上，该 ID 被分配给生成产物的代码。重要的是建立一套流程，以便一切都可以追溯和复现。在我们说话时，可能某些工具会让你的任务变得更简单；你只需要确保知道需要的所有内容。


    与自动化测试用例并据此移动代码到更高环境的典型软件不同，在机器学习世界，一切都发生在生产数据上。可以有一个独立的环境来提供生产数据，以便在不干扰生产环境的情况下在生产数据上进行实验。由于所有操作都在生产数据上进行，将代码移动到更高环境的概念仅供参考。在机器学习部署中，从开发移动到生产环境的是模型二进制文件和任何其他相关数据处理二进制文件。


    消费部分是运行在生产环境中，利用作为部署一部分移动的所有产物。训练机器学习模型在资源方面可能是一项昂贵的事，有时会在开发和部署之间插入一个中间步骤以便更多控制。这一步骤可以称为训练或阶段阶段（staging）。图
    3.5 显示了从模型训练到部署的步骤，这可以用于建立你的流程，如下：


    ![](img/image-f6d1vmzp.jpg)

    图 3.5：多阶段训练部署


    ## 结论


    总体而言，MLOps 流程的建立方式应该使其能够实现可复现性，同时让整个机器学习生命周期尽可能顺畅。我们还需要注意机器学习生命周期中的某些地方（例如解释 KPI，即模型训练和测试的输出），这些地方需要手动解释，且流程和工具的选择应该能够支持人工干预。


    例如，对于某组问题，`AUC` 达到 0.7 是好的，模型可以部署并消费。同样，另一个具有相同 `AUC` 的问题可能还没有好到可以部署。这可能有多个原因，这些问题需要通过推理和逻辑手动解决。流程应该为此留出空间，因为这些推理将发生在不同的利益相关者之间，但一旦完成批准或拒绝，后续步骤就可以顺畅且清晰。在实现
    MLOps 的工具方面有很多进展；但深入理解机器学习生命周期可以让你设计出更好的流程。


    MLOps 别重要的另一个方面是机器学习模型的重新训练。我们不希望对于已经生产化的用例从头开始。重新开始将减慢整个过程，并且可能在模型到达生产环境时它已经过时了。因此，整个过程应该仔细设计并实施，以满足本节中讨论的所有要求。图
    3.6 显示了实现整个端到端 MLOps 流程的一种方法；然而，这些工具可以根据选择和可用性进行更改，如下：


    ![](img/image-p4yiwcxi.jpg)

    图 3.6：带有技术栈的 MLOps 概述


    如前一图所示，我们强调了一个具有工具支持的端到端 MLOps 流程。我们将如下讨论所有组件及其用途：


    - 用于训练和验证模型的数据

    - 用于执行任务的代码

    - `GitHub` 用于版本维护和 CI/CD 过程

    - `DVC` 版本用于维护所有实验的数据版本

    - `ML Training`，批准后进行训练，例如 `GCP AI Platform`、`Kubernetes cluster` 或 `Spark engine`
    等

    - 用于突出模型性能的 KPI，`CML` 与 `Git` 集成通过 `Git` 显示 KPI

    - 批准后，部署模型供消费

    - 部署的模型元数据，如某些表中的版本号、数据位置等。这些信息可以用于审计和可复现性。


    批准流程和所有步骤可以使用 `GitHub Actions` 进行 CI/CD 自动化，包括审批。此外，如提到的，这些工具仅供参考，可以根据可用性进行更改。


    '
