    # Modeling


    Modeling is the next step after data preparation. For a particular type of problem,
    there might be multiple algorithms that are available. During EDA, multiple algorithms
    are tried out and the performance is measured; however, many a times, the data
    is not utilized completely during EDA. This may be due to the fact that one wants
    to validate the idea on less data or due to the computation limit, or both. After
    the EDA enables data preparation, multiple experiments need to be run on the data
    to identify the best suited model that fits on the data. Apart from this, as discussed,
    each step should be such that it can be traced back and reproduced; we need to
    perform modeling separately in such a manner that the artifacts and codes utilized
    can be tracked and versioned and reproduced.


    The modeling aspect only comes into scene for (re)training the model. Once the
    model is trained and validated, depending on the results and KPI, it further moves
    to deployment, and finally to consumption. The important step in ML modeling is
    to try multiple algorithms and gather the KPIs and select the best performing
    model. The KPIs can vary based on the problem type and the data utilized. The
    important thing is that the data on which the KPIs should be calculated, should
    not be part of the training dataset. This is to gauge the trained model performance
    on the new data. The models generally perform well on the data they are trained
    on; but, if the performance varies drastically on the new data, we say the model
    is overfitted. Overfitting is risky, as the model should give an acceptable performance
    on the new data, because then only can it be utilized in decision making.


    ## Avoiding Overfitting


    There are multiple ways to avoid overfitting; however, the most popular one is
    performing cross validation while training. In this technique, the data is randomly
    divided into five or ten buckets, the choice of the bucket size is completely
    on the data scientist. Then, the model is trained on all the buckets, leaving
    one out and the error is calculated on the left-out bucket, by making the prediction.
    This process is done for all the buckets one by one, and the final error is the
    average of all the left-out bucket errors. The final model is trained on all the
    data; however, the error is the averaged value. This way, if any bucket is an
    outlier, its impact is well represented in the performance. This is a common practice,
    and it is called the k-fold cross validation, where `k` is the number of buckets.
    Most of the standard ML algorithm frameworks provide it as a part of the standard
    implementation. Figure 3.3 highlights a visual way to see the k-fold validation,
    as shown as follows:


    ![](image-wignr7mw.jpg)

    Figure 3.3: K-fold validation


    ## Computational Requirements and Cloud


    We discussed all the logical aspects that goes into training a model. The other
    aspect which we need to consider in the ML framework, specifically in the context
    of training, is that the training of ML models is a very computation-intense operation.
    Due to this, we need huge computation power which is dependent on a lot of variables
    including the data size, algorithm used, hyper-parameter size, and so on. This
    requirement again increases as per the number of different ML algorithms a user
    tries. Hence, there should be a provision to have a machine with required hardware
    like the processor, RAM, and hard drive as and when required. This is another
    important step where cloud is very handy, as rolling a custom machine is very
    easy there and you pay for what you use. Apart from that, there are many other
    ways that the model can be trained on scale on cloud, for example, using `Kubernetes`
    or vendor specific training modules like `GCP AI platform`. Another important
    advantage of cloud is that the training can be scaled in terms of multiple experiments
    on multiple machines, where each of the ML algorithm is completely independent
    or is some different variation of the same ML algorithm. This allows us to conduct
    the experiments rapidly and the timeline between a model training and deployment
    reduces as the experiments finish much faster and hence the whole process moves
    forward much swiftly.


    ## Explainability


    Several ML algorithms for a given type of problem are available, but one important
    aspect which differentiates between the model being deployed on production or
    not is the explainability. For the business, it is very important to understand
    the causal relationship, which is not always the outcome of the ML model. However,
    to explain the relationship between the dependent and the independent variable
    is the responsibility of the data scientist, hence it helps to have a business
    understanding. In the absence of a proper explanation of the ML model output,
    it becomes very difficult for the business to start using it, and hence, even
    if the model moves to production, it serves no purpose. A lot of research is going
    on the ML model explainability, and the data scientist should be familiar with
    the `partial dependence plot`, `surrogate model`, `LIME`, `SHAP`, and so on, which
    are a few tools and techniques for the explainable ML models.


    ## Artifacts and Storage


    The outcome of the modeling step are the model binaries or graphs, which, depending
    on the agreement between all the stakeholders, moves to production. For moving
    to production, the model and the data on which the model was trained and KPIs
    were calculated, needs to be stored. Although the training part is mostly codes,
    many artifacts in terms of files, binaries, and graphs are created as part of
    the training and they need to be stored. At the same time, all the experiment
    run needs to be captured with their metadata, so that one can cross reference
    all the ML experiments and pick the best suited one for deployment. Two things
    become integral as part of this whole process, one is saving all the metadata
    that is, code and the performance, and second is saving the data itself on which
    the model was created. On the process aspect, we will cover this as part of `MLOps`.
    The following section will deal with storage and how one can organize storage
    for easy reference for the ML models and their metadata.

    '
  trans: '


    # 建模


    建模是数据准备之后的后续步骤。对于特定类型的问题，可能有多种算法可选择。在 EDA（探索性数据分析）期间，会尝试多种算法并衡量其性能；然而，很多时候数据在
    EDA 阶段并没有被充分利用。这可能是因为人们想在较少的数据上验证想法，或者由于计算限制，亦或两者兼有。在 EDA 开启数据准备工作后，需要在数据上运行多次实验，以识别最适合该数据的模型。此外，正如前面讨论的，每一步都应该是可追溯且可重现的；我们需要以单独的方式进行建模，以便使用的产物和代码可以被跟踪、版本化并重现。


    建模环节仅在模型的（重新）训练时出现。一旦模型完成了训练和验证，根据结果和 KPI（关键性能指标），它将进一步进入部署，最后进入消费。ML 建模中的重要步骤是尝试多种算法并收集
    KPI，选择性能最好的模型。KPI 会根据问题类型和所使用的数据而变化。重要的一点是，计算 KPI 的数据不应该是训练数据集的一部分。这是为了衡量训练后的模型在新数据上的性能。模型通常在它们训练的数据上表现良好；但如果性能在新数据上发生剧烈波动，我们就说该模型过拟合了。过拟合是有风险的，因为模型在新数据上应该提供可接受的性能，这样它才能用于决策。


    ## 避免过拟合


    避免过拟合有多种方法；但最流行的方法是在训练时进行交叉验证。在这种技术中，数据被随机分成五个或十个桶（bucket），桶的大小完全取决于数据科学家。然后，在所有的桶上训练模型，每次留出一个桶，并通过对该留出桶进行预测来计算误差。这个过程对所有桶逐一执行，最终误差是所有留出桶误差的平均值。最终模型在所有数据上进行训练；然而，误差是平均值。通过这种方式，如果任何桶是离群值，它的影响也会在性能中得到很好的体现。这是一种常见的做法，被称为
    k 折交叉验证，其中 `k` 是桶的数量。大多数标准的 ML 算法框架都将其作为标准实现的一部分提供。图 3.3 展示了一种查看 k 折验证的视觉化方式，如下：


    ![](img/image-wignr7mw.jpg)

    图 3.3：k 折验证


    ## 计算需求与云


    我们讨论了模型训练涉及的所有逻辑方面。在 ML 框架中（特别是在训练背景下），我们需要考虑的另一个方面是：ML 训练是一项计算密集型操作。因此，我们需要巨大的计算能力，这取决于许多变量，包括数据量、使用的算法、超参数规模等。这一需求会随着用户尝试的不同
    ML 算法数量的增加而再次增加。因此应该应该规定在需要时提供具有所需硬件（如处理器、内存和硬盘）的机器。这是另一个重要步骤，云在此时非常方便，因为在云上启动自定义机器非常简单，而且你按需付费。此外，还有许多其他方法可以在云上规模化训练模型，例如使用
    `Kubernetes` 或特定厂商的训练模块，如 `GCP AI platform`。云的另一个重要优势是训练可以在多台机器上通过多个实验进行扩展，其中每个
    ML 算法都是完全独立的，或者是是同一个 ML 算法的某种不同变体。这允许我们快速进行实验，缩短了模型训练与部署之间的时间，因为实验完成得快得多，因此整个过程进展得迅速。


    ## 可解释性


    对于特定类型的问题有多种 ML 算法可用，但区分模型是否部署到生产环境的一个重要方面是可解释性。对于业务来说，理解因果关系非常重要，而这并不总是 ML 模型的输出。然而，解释因变量和自变量之间的关系是数据科学家的责任，因此具备业务理解是有帮助的。在对
    ML 模型输出没有合理解释的情况下，业务部门很难开始使用它，因此，即使模型移动到生产环境，也没有意义。目前对 ML 模型可解释性正在进行大量研究，数据科学家应该熟悉部分依赖图
    (`partial dependence plot`)、代理模型 (`surrogate model`)、`LIME`、`SHAP` 等，这些都是可解释 ML
    模型的一些工具和技术。


    ## 产物与存储


    建模步骤的产物是模型二进制文件或图表，根据所有利益相关者的协议，它们将进入生产环境。为了移动到生产环境，模型以及训练模型和计算 KPI 的数据需要被存储。虽然训练部分主要是代码，但在训练过程中会产生许多文件、二进制文件和图表形式的产物，它们需要被存储。同时，所有的实验运行都需要捕获其元数据，以便能够交叉引用所有的
    ML 实验并选择最适合部署的一个。在整个过程中有两变得不可或缺：一是保存所有元数据（即代码和性能），二是保存创建模型的数据本身。在流程方面，我们将在 `MLOps`
    部分中讨论这些。接下来的章节将处理存储，以及如何组织存储以便于引用 ML 模型及其元数据。


    '
