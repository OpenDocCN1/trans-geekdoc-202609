    # Introduction

    In this chapter, we will see how to initiate the data science project in an organization.
    The resources and steps to successfully identify and utilize the potential of
    data science will be discussed. Questions such as what needs to be validated,
    the potential outcomes, and how to move forward after each question will be covered.


    # Structure

    In this chapter, we will cover the following topics:

    - Overview

    - Onboarding right people

    - Business problem and their prioritization

    - Data identification and collection

    - Idea validation

    - The potential outcome of an idea validation


    # Objectives

    This chapter aims to guide the leaders, technical project managers, or experienced
    data scientists to identify and plan the resources and timelines to establish
    the data science project successfully for generating revenue, optimizing processes,
    and so on. This chapter will also be the baseline for the forthcoming chapters,
    wherein, we will discuss each step in detail.


    # Overview

    Every organization today is trying to utilize the data and is spending a lot on
    the resources by hiring data scientists, data engineers, and the cloud platform
    for creating data lakes and enabling them with various tools to generate value
    out of the data. However, one thing that will set these organizations apart from
    the rest in the analytics space is the business problem clarity. It sounds very
    straightforward; however, we often observe that the decision-makers have decided
    to solve a problem, only to realize that there is no data or insufficient data.


    Data is the new a particular quote that is very famous these days and very apt
    in the current world, as everything is connected and generates a massive volume
    of data. To utilize the oil, you need to have a basic understanding of the various
    uses of the oil. For example, the oil can be used to power a vehicle, power machinery,
    or, if you are an oil producer, you can generate revenue from its sale too. Similarly,
    to utilize the data, there needs to be a clear business vision and, at the same
    time, identify what data is available to the organization.


    This chapter will discuss how a clear path can be found by following a simple
    exercise, to align all the stakeholders. This way, the ROI can be found on the
    investment in the data and in relation to the resources, and the decisions can
    be taken as to whether it is worth moving forward or something else needs to be
    done first.


    # Onboarding Right People

    Figure 1.1 highlights the people/roles that should be identified before starting
    any `ML/DS` exercise, as shown as follows:


    ![](image-4ih7dh5y.jpg)

    Figure 1.1: Key responsibilities of the right people


    The first task is to assemble the right team to do an idea validation, to see
    the value coming out of the data. The crew on a high level should consist of the
    business decision-makers, the person(s) with knowledge of internal data and their
    business relevance, and the data scientists/analysts who must get their hands
    dirty in the data.


    To give an example, consider an `IoT` scenario, where the organizations have enabled
    many sensors to monitor the health of the equipment or installation, in real-time.
    This is great; however, the actual value will come from the equipment''s future
    behavior. This can be captured via the sensors by answering the following questions:

    - What is the probability of equipment failure and when can this take place?

    - What is the optimal behavior of the equipment?

    - What is the impact on the equipment?

    - When does the equipment need to be replaced?


    Another example can be taken from `retail`, which leads to the following:

    - What is the business problem?

    - What are the outcomes of the idea?

    - What is the ROI of the investment?


    The role of the business decision-maker, product owner and data scientist can
    be played by a single person, and at the same time, multiple people can be involved.
    A critical aspect of this whole exercise is to understand the value, in case the
    business is solved. Do not invest in the resources unless a clear business outcome
    is defined. Otherwise, it creates a lot of wasted efforts and financial loss.


    # Business problem prioritization

    Figure 1.2 highlights a way to prioritize the problems, where the data can be
    utilized to generate value, as shown as follows:


    ![](image-541yyt8.jpg)

    Figure 1.2: Prioritizing business problems


    The first step is to have a clear business problem, know what sort of outcomes
    will solve it, and if solved, what value will it generate; all this should be
    jotted down across the organization. This exercise might be time-consuming but
    is very important. It will not only enable the organization in the short term,
    but also help with long-term vision of building the data assets. Even if the list
    of business problems is too long, it is not an issue. However, it would be a good
    idea to take the top five or ten out of the list.


    Once the problem statement is finalized, the next step is to analyze the data
    that is available to the organizations in-house and any additional data that they
    need to acquire from outside the organization. The cost of acquiring the data
    should also be taken into consideration. Unlike the business problem, this step
    is a collaborative exercise. The business and data representative(s) need to work
    together to clearly lay out the data that is required to solve each problem. This
    will help filter out the problems, which can be solved and prioritized accordingly.


    After the data is finalized, the third step is to analyze the data. In this step,
    the business problem statement is converted into a data problem statement, and
    to a certain extent, this starts in the previous step, however, on a very superficial
    level. This exercise clearly defines as to what extent the problem can be solved
    and the results to be expected.

    '
