- raw: "  Deployment    Deployment is the final step as per CRSIP-DM. After the model\
    \ is evaluated and the performance is accepted, the model needs to be deployed\
    \ for scoring new data. The deployment can be for processing the streaming data\
    \ in real time or processing millions of records in one shot. In both the cases,\
    \ there are different challenges, and an ML Framework should be able to address\
    \ both the type of data, that is, streaming and batch.    The raw data is generally\
    \ never in a format which can be consumed directly for prediction by the ML model.\
    \ The challenge in real time processing is the latency and scaling, where the\
    \ deployed model should scale for multiple instances in parallel and, at the same\
    \ time, the setup should process and score the data quickly. This is a very challenging\
    \ task, but thanks to the new open-source tools and cloud, this can be addressed\
    \ in a simple manner. Similarly, for batch processing, the challenge is to process\
    \ the huge data at one go. This demands a lot of computation power but not permanently,\
    \ which is again why cloud plays an integral role in machine learning.    Once\
    \ deployed, the ML model should be available for scoring the new data and as per\
    \ the CRISP-DM process, which is the final step. However, the model needs to be\
    \ monitored and evaluated continuously due to the following facts:     Data can\
    \ change over time, and new data might not be from the same distribution on which\
    \ the model is created.    The business or process changes, which generated the\
    \ data.    Any of the preceding factors mainly lead to a change in data and hence,\
    \ the model won’t give correct results. This demands a continuous evaluation of\
    \ the model performance and revisiting the life cycle again if the performance\
    \ is not up to the mark.    Another important aspect, which is not considered\
    \ in CRSIP-DM is the end consumption of the model output; for example, you can\
    \ get a probability value of a customer leaving your business or price of the\
    \ house, but for the decision maker, polishing this information in a dashboard\
    \ would make sense. To show the customer as a potential churner with a valid name\
    \ and color code or showing the house price in a range value would make more sense.\
    \ It can be argued that this is part of the deployment; however, the same information\
    \ can be investigated in multiple ways, hence, the consumption is sperate from\
    \ deployment and is equally important.    We will extend the CRISP-DM framework\
    \ in the following section and look into Consumption and Evaluation in more detail.\
    \  \n\n  CRISP-DM extension    The final step of CRISP-DM is the deployment of\
    \ the model. As discussed, the output of the model might not be directly consumable\
    \ by the business, or the requirement might be fulfilled by two- or three-ML model\
    \ output combined. Hence, the consumption of an ML model becomes the next logical\
    \ step to address. Parallelly, the model performance over time should be continuously\
    \ monitored as generally they deteriorate over time, as discussed earlier. Figure\
    \ 2.4 highlights the extension of CRISP-DM, as shown as follows:    ![](image-51mugh71.jpg) \
    \ Figure 2.4: CRISP-DM extension  \n\n  Consumption    Consumption is the stage\
    \ where the model output(s) is taken and converted into information that can be\
    \ directly consumed by the decision makers and utilized further. To give an example,\
    \ think of the customer churn, where the model output is the probability score\
    \ or a flag indicating which customer is going to churn. The business might not\
    \ be interested in all the customers, as they can’t stop everyone from leaving,\
    \ so they might want the top n percent of customers, who generate maximum revenue\
    \ and have high probability to leave. To identify the expected revenue from the\
    \ customer, there can be either a separate ML model or it can be based on the\
    \ historical details. Both the churn probability combined with the revenue generated\
    \ by an individual, should be presented to the business, so that they can take\
    \ an informed and profitable decision to stop the right customers from leaving\
    \ the business.    Another example, which we can discuss is the IoT use case,\
    \ where multiple sensors monitor the performance of a machine or the whole setup.\
    \ One of the tasks is to predict the future readings like the temperature, pressure,\
    \ and so on, coming out of the sensor. However, as something which is continuously\
    \ throwing some values with minimum deviation in an ideal situation, human intervention\
    \ is not required. However, if these values can be combined together to predict\
    \ whether the whole machine or the whole setup is working in harmony or something\
    \ is wrong, that becomes an information every executive need, to take appropriate\
    \ action. This, again, is over and above the forecasted output of sensors. It\
    \ might utilize another model which sits above the forecasted values to provide\
    \ essential information to the business.    The idea to keep the consumption step\
    \ is because, when utilizing CRISP-DM, the scope is narrowed down to one specific\
    \ problem like churn or predicting the temperature, and so on. This information\
    \ directly won’t add any value to the decision makers, and they need to be combined\
    \ with additional data or multiple ML models to deliver the outputs which are\
    \ aligned to what the decision makers require. To have a business aligned consumption\
    \ layer is the critical difference between a successful ML project and an unsuccessful\
    \ one.  \n\n  Continuous evaluation    The ML model’s performance decays over\
    \ time, and any decision made utilizing these models will be wrong and can have\
    \ devastating effect on the business. Hence, to make sure that the model is up\
    \ to the mark and the output produced by them is trustworthy, the ML models need\
    \ to be continuously evaluated.    Depending on the KPI used, the evaluation can\
    \ be setup for a particular model to be evaluated continuously. As mentioned earlier,\
    \ there can be multiple reasons for model decay, but broadly, it can be allocated\
    \ into two buckets – Concept Drift and Data Drift. Concept drift is more about\
    \ the interpterion of data. Just to give an example, consider product recommendation\
    \ without taking seasonality into effect. There might be some dependency and hence\
    \ your model is not giving the correct output and you figured out that seasonality\
    \ is something you should consider. There is no change in the data, but there\
    \ is a change in the understanding of the data, hence it is called concept drift.\
    \    Data drift is much simpler and can be considered as a change in the underlying\
    \ data over time. Just to consider an example, consider the price of a house in\
    \ a city which you are trying to predict using the location, area, number of jobs\
    \ in that area, and so on. Now, as the number of jobs will change over time, it\
    \ might impact the price differently than before. This is due to the change in\
    \ data and hence data drift.    A Model should be evaluated continuously to avoid\
    \ both concept drift and data drift.    We have covered every stage of an ML project\
    \ in this chapter and Chapter 1, “DS/ML Projects – Initial However, to accomplish\
    \ all these steps that we discussed, we need a framework and supporting tech stack,\
    \ which should be flexible and can scale for each type of task. In the next chapter,\
    \ we will discuss the framework that should be available in an organization for\
    \ expediting the whole lifecycle which we have seen so far for the ML project.\
    \  "
  fmt: "\n# Deployment\n\nDeployment is the final step as per `CRISP-DM`. After the\
    \ model is evaluated and the performance is accepted, the model needs to be deployed\
    \ for scoring new data. The deployment can be for processing the streaming data\
    \ in real time or processing millions of records in one shot. In both the cases,\
    \ there are different challenges, and an ML Framework should be able to address\
    \ both the type of data, that is, streaming and batch.\n\nThe raw data is generally\
    \ never in a format which can be consumed directly for prediction by the ML model.\
    \ The challenge in real time processing is the latency and scaling, where the\
    \ deployed model should scale for multiple instances in parallel and, at the same\
    \ time, the setup should process and score the data quickly. This is a very challenging\
    \ task, but thanks to the new open-source tools and cloud, this can be addressed\
    \ in a simple manner. Similarly, for batch processing, the challenge is process\
    \ the huge data at one go. This demands a lot of computation power but not permanently,\
    \ which is again why cloud plays an integral role in machine learning.\n\nOnce\
    \ deployed, the ML model should be available for scoring the new data and as per\
    \ the `CRISP-DM` process, which is the final step. However, the model needs to\
    \ be monitored and evaluated continuously due to the following facts:\n\n* Data\
    \ can change over time, and new data might not be from the same distribution on\
    \ which the model is created.\n* The business or process changes, which generated\
    \ the data.\n* Any of the preceding factors mainly lead to a change in data and\
    \ hence, the model won’t give correct results. This demands a continuous evaluation\
    \ of the model performance and revisiting the life cycle again if the performance\
    \ is not up to the mark.\n\nAnother important aspect, which is not considered\
    \ in `CRISP-DM` is the end consumption of the model output; for example, you can\
    \ get a probability value of a customer leaving your business or price of the\
    \ house, but for the decision maker, polishing this information in a dashboard\
    \ would make sense. To show the customer as a potential churner with a valid name\
    \ and color code or showing the house price in a range value would make more sense.\
    \ It can be argued that this is part of the deployment; however, the same information\
    \ can be investigated in multiple ways, hence, the consumption is separate from\
    \ deployment and is equally important.\n\nWe will extend the `CRISP-DM` framework\
    \ in the following section and look into Consumption and Evaluation in more detail.\n\
    \n# CRISP-DM extension\n\nThe final step of `CRISP-DM` is the deployment of the\
    \ model. As discussed, the output of the model might not be directly consumable\
    \ by the business, or the requirement might be fulfilled by two- or three-ML model\
    \ output combined. Hence, the consumption of an ML model becomes the next logical\
    \ step to address. Parallelly, the model performance over time should be continuously\
    \ monitored as generally they deteriorate over time, as discussed earlier. Figure\
    \ 2.4 highlights the extension of `CRISP-DM`, as shown as follows:\n\n![](image-51mugh71.jpg)\n\
    Figure 2.4: CRISP-DM extension \n\n# Consumption\n\nConsumption is the stage where\
    \ the model output(s) is taken and converted into information that can be directly\
    \ consumed by the decision makers and utilized further. To give an example, think\
    \ of the customer churn, where the model output is the probability score or a\
    \ flag indicating which customer is going to churn. The business might not be\
    \ interested in all the customers, as they can’t stop everyone from leaving, so\
    \ they might want the top `n` percent of customers, who generate maximum revenue\
    \ and have high probability to leave. To identify the expected revenue from the\
    \ customer, there can be either a separate ML model or it can be based on the\
    \ historical details. Both the churn probability combined with the revenue generated\
    \ by an individual, should be presented to the business, so that they can take\
    \ an informed and profitable decision to stop the right customers from leaving\
    \ the business.\n\nAnother example, which we can discuss is the IoT use case,\
    \ where multiple sensors monitor the performance of a machine or the whole setup.\
    \ One of the tasks is to predict the future readings like the temperature, pressure,\
    \ and so on, coming out of the sensor. However, as something which is continuously\
    \ throwing some values with minimum deviation in an ideal situation, human intervention\
    \ is not required. However, if these values can be combined together to predict\
    \ whether the whole machine or the whole setup is working in harmony or something\
    \ is wrong, that becomes an information every executive need, to take appropriate\
    \ action. This, again, is over and above the forecasted output of sensors. It\
    \ might utilize another model which sits above the forecasted output to provide\
    \ essential information to the business. The idea to keep the consumption step\
    \ is because when utilizing `CRISP-DM`, the scope is narrowed down to one specific\
    \ problem like churn or predicting the temperature, and so on. This information\
    \ directly won’t add any value to the decision makers, and they need multiple\
    \ ML models. To have a business aligned consumption layer is the critical difference\
    \ between a successful ML project and an unsuccessful one.\n\n# Continuous evaluation\n\
    \nThe ML model’s performance decays over time, and any decision made utilizing\
    \ these models will be wrong and can have devastating effect on the business.\
    \ Hence, to make sure that the model is up to the mark and the output produced\
    \ by them is trustworthy, the ML models need to be continuously evaluated.\n\n\
    Depending on the KPI used, the evaluation can be set up for a particular model\
    \ to be evaluated continuously. As mentioned earlier, there can be multiple reasons\
    \ for model decay, but broadly, it can be allocated into two buckets – Concept\
    \ Drift and Data Drift. Concept drift is more about the interpretation of data.\
    \ Just to give an example, consider product recommendation without taking seasonality\
    \ into effect. There might be some dependency and hence your model is not giving\
    \ the correct output and you figured out that seasonality is something you should\
    \ consider. There is no change in the data, but there is a change in the understanding\
    \ of the data, hence it is called concept drift.\n\nData drift is much simpler\
    \ and can be considered as a change in the underlying data over time. Just to\
    \ consider an example, consider the price of a house in a city which you are trying\
    \ to predict using the location, area, number of jobs in that area, and so on.\
    \ Now, as the number of jobs will change over time, it might impact the price\
    \ differently than before. This is due to the change in data and hence data drift.\n\
    \nA model should be evaluated continuously to avoid both concept drift and data\
    \ drift.\n\nWe have covered every stage of an ML project in this chapter and Chapter\
    \ 1, “DS/ML Projects – Initial”. However, to accomplish all these steps that we\
    \ discussed, we need a framework and supporting tech stack, which should be flexible\
    \ and can scale for each type of task. In the next chapter, we will discuss the\
    \ framework that should be available in an organization for expediting the whole\
    \ lifecycle which we have seen so far for the ML project.\n"
  trans: "\n\n# 部署\n\n部署是根据 `CRISP-DM` 执行的最后一步。在对模型进行评估并接受性能后，需要部署模型以对新数据进行评分。部署可以是实时处理流式数据，也可以一次性处理数百万条记录。在这两种情况下，都存在不同的挑战，ML\
    \ 框架应该能够处理两种类型的数据，即流式和批处理。\n\n原始数据通常不是一种可以直接被 ML 模型用于预测的格式。实时处理的挑战在于延迟和扩展性，部署的模型应该支持多个实例的并行扩展，同时，设置应能够快速处理并对数据进行评分。这是一项非常有挑战性的任务，但得益于新的开源工具和云服务，可以以简单的方式解决。同样，对于批处理，挑战在于一次性处理海量数据。这需要大量的计算能力，但并非永久性，这再次说明了云在机器学习中起着至关重要的作用。\n\
    \n一旦部署，ML 模型就应该能够对新数据进行评分，并且根据 `CRISP-DM` 流程，这是最后一步。然而，由于以下事实，需要对模型进行持续监控和评估：\n\
    \n* 数据会随时间发生变化，新数据可能不再来自创建模型时的相同分布。\n* 产生数据的业务或流程发生了变化。\n* 上述任何因素都会导致数据发生变化，因此模型无法给出正确的结果。这要求对模型性能进行持续评估，并在性能不达标时重新审视整个生命周期。\n\
    \n另一个 `CRISP-DM` 中未考虑的两个方面是模型输出的最终消费；例如，你可以获得客户流失业务的概率值或房产价格，但对于决策者来说，在仪表板（dashboard）中精炼这些信息更有意义。通过有效的名称和颜色代码将客户显示为潜在流失者，或者以范围值的形式显示房产价格，会更有意义。有人可能会认为这是部署的一部分；然而，相同的信息可以通过多种方式进行调查，因此，“消费”与“部署”是分开的，且同样重要。\n\
    \n我们将在接下来的章节中扩展 `CRISP-DM` 框架，并详细研究“消费”和“评估”。\n\n# CRISP-DM 扩展\n\n`CRISP-DM` 的最后一步是模型的部署。正如所讨论，模型的输出可能无法被业务直接消费，或者需求可能通过两个或三个\
    \ ML 模型的输出组合来满足。因此，ML 模型的消费变成了下一个需要解决的逻辑步骤。同时，由于之前讨论过的模型性能通常会随着时间的推移而恶化，因此应该持续监控模型的长期性能。图\
    \ 2.4 展示了 `CRISP-DM` 的扩展，如下所示：\n\n![](img/image-51mugh71.jpg)\n图 2.4: CRISP-DM\
    \ 扩展 \n\n# 消费\n\n消费是指获取模型输出（s）并将其转换为决策者可以直接消费并进一步利用的信息的阶段。例如，考虑客户流失，模型的输出是概率分数或指示哪些客户将要流失的标记。业务部门可能对所有客户都不感兴趣，因为他们无法阻止所有人离开，所以他们可能想要产生最高收入且流失概率高的前\
    \ `n` 百分比的客户。为了识别来自客户的预期收益，可以有一个独立的 ML 模型，也可以基于历史细节。应该将流失概率与个人产生的收益结合起来呈现给业务部门，以便他们做出明智且有利可利的决策，阻止正确的客户离开业务。\n\
    \n另一个我们可以讨论的例子是物联网（IoT）用例，其中多个传感器监控机器或整套装置的性能。任务之一是预测传感器输出的温度、压力等未来读数。然而，由于在理想情况下这些值会持续产生偏差极小的值，因此不需要人工干预。但是，如果这些值可以结合在一起，以预测整个机器或整套装置是否运行正常或是否存在问题，那么这将成为每位高管都需要的信息，以便采取适当行动。这再次是优于传感器的预测输出之上的需求。它可能会利用另一个位于预测输出之上的模型，为业务提供关键信息。之所以保留“消费”这一步的想法是，因为在利用\
    \ `CRISP-DM` 时，范围被缩小到一个特定问题（如流失或预测温度等）。这些信息直接不会为决策者增加任何价值，他们需要多个 ML 模型。拥有一个与业务对齐的消费层，是成功的\
    \ ML 项目与失败项目之间的关键区别。\n\n# 持续评估\n\nML 模型的性能随时间推移而下降，利用这些模型做出的任何决策将是错误的，并可能对业务产生毁灭性影响。因此，为了确保模型达标且产生的输出是可靠的，需要对\
    \ ML 模型进行持续评估。\n\n根据所使用的 KPI，可以为特定模型设置持续评估。正如之前提到的，模型衰减可能有多个原因，但大致上可以分为两类——概念漂移（Concept\
    \ Drift）和数据漂移（Data Drift）。概念漂移更多关于对数据的解释。举个例子，考虑在不考虑季节性的情况下产品推荐。可能存在某些依赖关系，因此你的模型没有给出正确输出，而你发现季节性是你应该考虑的因素。数据本身没有变化，但对数据的理解发生了变化，因此被称为概念漂移。\n\
    \n数据漂移要简单得多，可以被视为底层数据随时间发生的变化。举个例子，考虑你正尝试使用位置、面积、该地区的工作数量等来预测某市的房价。现在，随着工作数量随时间变化，它对价格的影响可能与以前不同。这是由于数据的变化，因此是数据漂移。\n\
    \n应该持续评估模型，以避免出现概念漂移和数据漂移。\n\n我们在本章和第 1 章“DS/ML 项目 – 初始化”中涵盖了 ML 项目的每一个阶段。然而，为了完成我们讨论的所有步骤，我们需要一个灵活且能够针对每类任务进行扩展的框架和支持技术栈。下一章，我们将讨论组织应该具备的框架，以加速我们目前为止看到的\
    \ ML 项目的整个生命周期。\n\n"
  toc: []
- raw: "  Conclusion    CRISP-DM is a very generic and valid framework to approach\
    \ a data science use case and in this chapter, we discussed all the steps that\
    \ are involved in CRISP-DM, in detail. The additional requirement, which are not\
    \ addressed in CRSIP-DM framework, are also discussed in the extension of the\
    \ framework. Logically aligned with these functional tasks, we can now look into\
    \ the details of the technical tools to enable these tasks and explore how to\
    \ communicate the output at each stage to the decision makers.    In the next\
    \ chapter, we will discuss about the technical framework that needs to be in place\
    \ for implementing these.  \n\n  Points to remember     A data science problem\
    \ can be broken down into six stages of CRISP-DM.    The steps moves back and\
    \ forth depending on the business and data alignment.    Data preparation is generally\
    \ the most time-consuming step in the whole use case.    The CRISP-DM extension\
    \ consists of a continuous evaluation and consumption.    The consumption steps\
    \ look into the outputs that can be directly consumed by the business.    A continuous\
    \ evaluation looks into the health of the model.  \n\n  Multiple choice questions\
    \     The Business understanding step leads to data understanding. They can move\
    \ back and forth, until moving on to the next step from data understanding as\
    \ per CRISP-DM. Which other step might lead directly back to business understanding?\
    \     Modeling    Data preparation    Evaluation    None of the above    Which\
    \ is generally the most time-consuming step in CRISP-DM?     Modeling    Data\
    \ preparation    Deployment    Evaluation    Which step makes sure that the model(s)\
    \ output is available to the business decision maker in their required format?\
    \     Consumption    Deployment    Modeling    Data preparation    Why is continuous\
    \ evaluation an important step?     To make sure new ML algorithm(s) is/are implemented\
    \    Check the model performance with new data regularly    To provide output\
    \ to business in desired format    None of the above    Concept decay of an ML\
    \ model leads to bad performance of the model. What can be the cause of concept\
    \ decay?     Change in business rules    Missing temporal relation of data   \
    \ Missing business understanding while use-case lifecycle    All of the above\
    \  \n\n  Answers     c    b    a    b    d  \n\n  Key terms     Cross-industry\
    \ standard process for data mining.    Dependent The variable of interest, which\
    \ we need to predict.    Feature The process to create the variables which will\
    \ be utilized to predict the dependent variable.    Feature The process to remove\
    \ the redundant variable and selecting the useful variables.  \n\nCHAPTER 3   \
    \ ML Architecture – Framework and Components    In the previous two chapters,\
    \ we covered how to prioritize and finalize the business use case and the different\
    \ stages of the ML use case lifecycle. To achieve all the steps in the ML lifecycle,\
    \ we need a technical framework/architecture, which will accomplish all the tasks\
    \ in the ML Lifecycle in a scalable manner as per requirement. We will discuss\
    \ the architecture details both in the functional and the technical aspect, in\
    \ this chapter. In the functional side, we will cover the key components that\
    \ are required and their utility. The technical side will be highlighting the\
    \ tools which can be utilized to accomplish the functional task. In tools, we\
    \ will highlight multiple tools for the same task; however, we won’t go into the\
    \ details. The choice of the technical tools is completely upon the availability\
    \ and personal comfort, but the key functionality that these tools have will be\
    \ discussed in this chapter.  \n\n  Structure    In this chapter, we will cover\
    \ the following topics:     Overview    ML framework    Data source    EDA   \
    \ Data preparation    Modeling    Storage    Deployment    Consumption    MLOps\
    \  \n\n  Objectives    After studying this chapter, you will be able to define\
    \ a logical framework for the ML Architecture, provide a guiding principle for\
    \ the organization when establishing the ML Architecture and practice in their\
    \ organization and learn about the tech tools to accomplish each aspect which\
    \ will also be shared as an example.  \n\n  Overview    We discussed the steps\
    \ that the ML use case solution goes through in the previous chapters, including\
    \ formulating the use case. To enable the data scientist and the organization\
    \ as a whole, to quickly perform all the required steps, there needs to be a framework.\
    \ It should be flexible to solve any type of problem, be robust and have the ability\
    \ to scale. It should be easy to use and maintain, and should be able to support\
    \ all the steps in the ML use case. The framework should also have the flexibility\
    \ to utilize and include any new tech stack which is better suited for a problem\
    \ than the old tools.    The ML framework proposed and discussed from the next\
    \ section onward will provide all the key building block and thought process to\
    \ create an ML architecture inside an organization. We will also have the key\
    \ tools discussed for each component; however, the tools, especially in the ML\
    \ world are evolving on a daily basis, and hence can be replaced if something\
    \ better fit the solution. The framework is proposed with keeping the cloud in\
    \ mind, since a lot of tasks require resource flexibility, and hence, the cloud\
    \ is best suited to fulfil the ML requirement. The cloud environment can be a\
    \ private cloud owned by an organization for their internal use or provided by\
    \ the big vendors like Amazon, Google, and so on.    Cloud offers the flexibility\
    \ to utilize the resources as per need and can scale very easily as per the requirement.\
    \ The other advantage is related to the cost, where you pay for what you use,\
    \ with a few cloud providers billing per minute. As a lot of use cases start with\
    \ idea validation in ML, it is easy and quick to try them out on cloud, rather\
    \ than investing and configuring your own infrastructure. Cloud also offers more\
    \ control in terms of access and resources, and at the same time, the ability\
    \ to monitor. Due to all these reasons, cloud is best suited for the ML framework.\
    \    We will discuss each component in detail, so if cloud is not your choice\
    \ and you want to build things internally, you can utilize the same concepts to\
    \ build an architecture in your organization. It will offer a lot of control and\
    \ the tech stack can be more targeted; however, it will need internal maintenance\
    \ and updates. Also, for the adhoc tasks, which require a lot of computation power,\
    \ it will be hard to address, unless the additional resources are kept for these\
    \ scenarios. This will lead to an increase in the cost. To offer more flexibility\
    \ and control, a hybrid approach is recommended, where you use both the in-house\
    \ and the cloud resources as per the requirement.    We want to establish a working\
    \ framework which enables the data scientist to concentrate on the task or the\
    \ use case at hand, rather than worrying about the resources like the computation\
    \ power, tools, and so on. For example, if someone is comfortable in a particular\
    \ programming language, they should be able to do the task in that language. The\
    \ organization can define their own standard, but the framework shouldn’t be a\
    \ bottleneck. With that, let’s start looking at the ML framework.  "
  fmt: "\n# Conclusion\nCRISP-DM is a very generic and valid framework to approach\
    \ a data science use case and in this chapter, we discussed all the steps that\
    \ are involved in CRISP-DM, in detail. The additional requirement, which are not\
    \ addressed in CRSIP-DM framework, are also discussed in the extension of the\
    \ framework. Logically aligned with these functional tasks, we can now look into\
    \ the details of the technical tools to enable these tasks and explore how to\
    \ communicate the output at each stage to the decision makers. In the next chapter,\
    \ we will discuss about the technical framework that needs to be in place for\
    \ implementing these.\n\n## Points to remember\n- A data science problem can be\
    \ broken down into six stages of CRISP-DM.\n- The steps moves back and forth depending\
    \ on the business and data alignment.\n- Data preparation is generally the most\
    \ time-consuming step in the whole use case.\n- The CRISP-DM extension consists\
    \ of a continuous evaluation and consumption.\n- The consumption steps look into\
    \ the outputs that can be directly consumed by the business.\n- A continuous evaluation\
    \ looks into the health of the model.\n\n## Multiple choice questions\n1. The\
    \ Business understanding step leads to data understanding. They can move back\
    \ and forth, until moving on to the next step from data understanding as per CRISP-DM.\
    \ Which other step might lead directly back to business understanding?\n   - Modeling\n\
    \   - Data preparation\n   - Evaluation\n   - None of the above\n2. Which is generally\
    \ the most time-consuming step in CRISP-DM?\n   - Modeling\n   - Data preparation\n\
    \   - Deployment\n   - Evaluation\n3. Which step makes sure that the model(s)\
    \ output is available to the business decision maker in their required format?\n\
    \   - Consumption\n   - Deployment\n   - Modeling\n   - Data preparation\n4. Why\
    \ is continuous evaluation an important step?\n   - To make sure new ML algorithm(s)\
    \ is/are implemented\n   - Check the model performance with new data regularly\n\
    \   - To provide output to business in desired format\n   - None of the above\n\
    5. Concept decay of an ML model leads to bad performance of the model. What can\
    \ be the cause of concept decay?\n   - Change in business rules\n   - Missing\
    \ temporal relation of data\n   - Missing business understanding while use-case\
    \ lifecycle\n   - All of the above\n\n## Answers\nc, b, a, b, d\n\n## Key terms\n\
    - **Cross-industry standard process for data mining.**\n- **Dependent**: The variable\
    \ of interest, which we need to predict.\n- **Feature**: The process to create\
    \ the variables which will be utilized to predict the dependent variable.\n- **Feature**:\
    \ The process to remove the redundant variable and selecting the useful variables.\n\
    \n# CHAPTER 3: ML Architecture – Framework and Components\nIn the previous two\
    \ chapters, we covered how to prioritize and finalize the business use case and\
    \ the different stages of the ML use case lifecycle. To achieve all the steps\
    \ in the ML lifecycle, we need a technical framework/architecture, which will\
    \ accomplish all the tasks in the ML Lifecycle in a scalable manner as per requirement.\
    \ We will discuss the architecture details both in the functional and the technical\
    \ aspect, in this chapter. In the functional side, we will cover the key components\
    \ that are required and their utility. The technical side will be highlighting\
    \ the tools which can be utilized to accomplish the functional task. In tools,\
    \ we will highlight multiple tools for the same task; however, we won’t go into\
    \ the details. The choice of the technical tools is completely upon the availability\
    \ and personal comfort, but the key functionality that these tools have will be\
    \ discussed in this chapter.\n\n## Structure\nIn this chapter, we will cover the\
    \ following topics:\n- Overview\n- ML framework\n- Data source\n- EDA\n- Data\
    \ preparation\n- Modeling\n- Storage\n- Deployment\n- Consumption\n- MLOps\n\n\
    ## Objectives\nAfter studying this chapter, you will be able to define a logical\
    \ framework for the ML Architecture, provide a guiding principle for the organization\
    \ when establishing the ML Architecture and practice in their organization and\
    \ learn about the tech tools to accomplish each aspect which will also be shared\
    \ as an example.\n\n## Overview\nWe discussed the steps that the ML use case solution\
    \ goes through in the previous chapters, including formulating the use case. To\
    \ enable the data scientist and the organization as a whole, to quickly perform\
    \ all the required steps, there needs to be a framework. It should be flexible\
    \ to solve any type of problem, be robust and have the ability to scale. It should\
    \ be easy to use and maintain, and should be able to support all the steps in\
    \ the ML use case. The framework should also have the flexibility to utilize and\
    \ include any new tech stack which is better suited for a problem than the old\
    \ tools.\n\nThe ML framework proposed and discussed from the next section onward\
    \ will provide all the key building block and thought process to create an ML\
    \ architecture inside an organization. We will also have the key tools discussed\
    \ for each component; however, the tools, especially in the ML world are evolving\
    \ on a daily basis, and hence can be replaced if something better fit the solution.\
    \ The framework is proposed with keeping the cloud in mind, since a lot of tasks\
    \ require resource flexibility, and hence, the cloud is best suited to fulfil\
    \ the ML requirement. The cloud environment can be a private cloud owned by an\
    \ organization for their internal use or provided by the big vendors like Amazon,\
    \ Google, and so on.\n\nCloud offers the flexibility to utilize the resources\
    \ as per need and can scale very easily as per the requirement. The other advantage\
    \ is related to the cost, where you pay for what you use, with a few cloud providers\
    \ billing per minute. As a lot of use cases start with idea validation in ML,\
    \ it is easy and quick to try them out on cloud, rather than investing and configuring\
    \ your own infrastructure. Cloud also offers more control in terms of access and\
    \ resources, and at the same time, the ability to monitor. Due to all these reasons,\
    \ cloud is best suited for the ML framework.\n\nWe will discuss each component\
    \ in detail, so if cloud is not your choice and you want to build things internally,\
    \ you can utilize the same concepts to build an architecture in your organization.\
    \ It will offer a lot of control and the tech stack can be more targeted; however,\
    \ it will need internal maintenance and updates. Also, for the adhoc tasks, which\
    \ require a lot of computation power, it will be hard to address, unless the additional\
    \ resources are kept for these scenarios. This will lead to an increase in the\
    \ cost. To offer more flexibility and control, a hybrid approach is recommended,\
    \ where you use both the in-house and the cloud resources as per the requirement.\n\
    \nWe want to establish a working framework which enables the data scientist to\
    \ concentrate on the task or the use case at hand, rather than worrying about\
    \ the resources like the computation power, tools, and so on. For example, if\
    \ someone is comfortable in a particular programming language, they should be\
    \ able to do the task in that language. The organization can define their own\
    \ standard, but the framework shouldn’t be a bottleneck. With that, let’s start\
    \ looking at the ML framework.\n"
  trans: "\n\n# 结论\nCRISP-DM 是一个处理数据科学用例的非常通用且有效的框架，在本章中，我们详细讨论了 CRISP-DM 涉及的所有步骤。CRISP-DM\
    \ 框架未涵盖的额外需求，在框架的扩展中也进行了讨论。在逻辑上与这些功能任务对齐后，我们现在可以研究实现这些任务的技术工具细节，并探索如何将每个阶段的输出传给决策者。在下一章中，我们将讨论实现这些任务需要到位的技术框架。\n\
    \n## 记忆要点\n- 数据科学问题可以拆分为 CRISP-DM 的六个阶段。\n- 步骤会根据业务和数据的对齐情况而反复移动。\n- 数据准备通常是整个用例中最耗费时间的步骤。\n\
    - CRISP-DM 的扩展包含持续的评估和消费。\n- 消费步骤关注业务可以直接消耗的输出结果。\n- 持续评估关注模型的健康状况。\n\n## 多选题\n\
    1. 业务理解（Business understanding）步骤引向数据理解（data understanding）。它们可以反复移动，直到根据 CRISP-DM\
    \ 从数据理解移动到下一步。在其他哪一个步骤可能会直接返回到业务理解？\n   - 建模（Modeling）\n   - 数据准备（Data preparation）\n\
    \   - 评估（Evaluation）\n   - 以上都不是\n2. 哪个步骤是是 P-DM 中最耗费时间的？\n   - 建模\n   - 数据准备\n\
    \   - 部署（Deployment）\n   - 评估\n3. 哪一步确保模型输出以其所需的格式提供给业务决策者？\n   - 消费（Consumption）\n\
    \   - 部署\n   - 建模\n   - 数据准备\n4. 为什么持续评估是一个重要的步骤？\n   - 为了确保实施了新的机器学习算法（s）\n \
    \  - 定期使用新数据检查模型性能\n   - 以期望的格式向业务提供输出\n   - 以上都不是\n5. 机器学习模型的概念衰减（Concept decay）会导致模型性能下降。概念衰减的原因可能是？\n\
    \   - 业务规则的变化\n   - 数据中时间关系的缺失\n   - 用例生命周期中缺失业务理解\n   - 以上以上都是\n\n## 答案\nc, b,\
    \ a, b, d\n\n## 关键术语\n- **跨行业标准数据挖掘过程（Cross-industry standard process for data\
    \ mining）。**\n- **因变量（Dependent）**：我们需要预测的感兴趣变量。\n- **特征（Feature）**：创建用于预测因变量的变量的过程。\n\
    - **特征（Feature）**：移除冗余变量并选择有用变量的过程。\n\n# 第 3 章：ML 架构 – 框架与组件\n在前两个章节中，我们涵盖了如何优先考虑并最终确定业务用例，以及机器学习（ML）用例生命周期的不同阶段。为了实现机器学习生命周期中的所有步骤，我们需要一个技术框架/架构，它能够根据需求以可扩展的方式完成机器学习生命周期中的所有任务。在本章中，我们将从功能和技术两个方面讨论架构的细节。在功能方面，我们将涵盖所需的关键组件及其效用。技术方面将侧重点介绍可以用于完成功能任务的工具。在工具方面，我们将重点介绍同一任务的多种工具；但我们不会进入细节。技术工具的选择完全取决于可用性和个人喜好，但本章将讨论这些工具具有的核心功能。\n\
    \n## 结构\n在本章中，我们将涵盖以下主题：\n- 概述\n- ML 框架\n- 数据源\n- EDA（探索性数据分析）\n- 数据准备\n- 建模\n\
    - 存储\n- 部署\n- 消费\n- MLOps（机器学习运维）\n\n## 目标\n学习本章后，你将能够为 ML 架构定义逻辑框架，为组织在建立 ML\
    \ 架构和开展实践时提供指导原则，并了解完成每个方面所需的技术工具（这些工具也将作为示例分享）。\n\n## 概述\n我们讨论了前几章 ML 用例所经历的步骤，为了让数据科学家和整个组织能够快速执行这些步骤需要一个框架。它应该能够灵活解决任何类型的问题，具有健壮性和可扩展性。它应该是易于使用和维护的，并能够支持用例中的所有步骤。框架还应该灵活地包含任何技术栈，比旧工具更合适。\n\
    \n从下一节开始提出的和讨论的 ML 框架将为组织内部创建架构提供所有的构建模块和思维过程。我们还将讨论每个组件的关键工具；然而，工具世界每天都在演变，因此可以被更好的工具所取代。所提出的框架是考虑了云的，因为许多任务需要灵活性，因此云最适合满足需求。云环境可以是组织拥有的私有云，也可以由\
    \ Amazon、Google 等大供应商提供。\n\n云提供了根据需要灵活利用资源的能力，并可以根据需要非常容易扩展。另一个优势与成本有关，即按使用付费，一些云提供商按分钟计费。由于许多用例是从想法验证开始的，在云上尝试是简单且快速的，而不是投资和配置自己的基础设施。云在访问和资源方面也提供了更多的控制，同时具有监控能力。由于所有这些原因，云最适合\
    \ ML 框架。\n\n"
