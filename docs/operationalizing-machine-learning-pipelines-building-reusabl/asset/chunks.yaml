    # Consumption


    Consumption comes after deployment, and it is in this process that the output
    of the deployed model is processed and aligned as per the business requirement.
    At times, deployment itself is sufficient for business consumption; however, most
    of the times, the output of the deployment needs to be processed.


    The reason due to which consumption needs to be separate from deployment can be
    one of the following:

    * Partial results are required like top n values.

    * The output can be a combination of multiple ML models.

    * The output of the ML model is a small part of some hybrid system based on rules
    and data.


    We will study the examples of all these cases, but because of these requirements,
    the consumption also must fulfill the requirement which are part of the deployment
    like scalability, security, and availability. Consumption, at times, might be
    the same data which is coming out of the deployment step but presented in better
    ways using reporting or the BI tools like `Tableau` or `Looker`, and so on.


    ## Example: Product Recommendation


    As an example, consider a case where you want to recommend a product to a customer
    based on their buying patterns, customer information, and so on. It might happen
    that you create multiple recommendation models either using different algorithms
    or a different set of data, like one can be based on the association rules of
    the product and the other set of recommendations can come from the collaborative
    filters. There can be multiple recommendation models for the same task.


    After the performance check, it might be that all these models are performing
    better under different conditions. The final recommendation to a customer should
    be such that each of these models have proper representation in the list of products
    proposed to the customer. This combination of products from multiple recommendation
    engines is part of the consumption script, which is the expected output. Even
    though multiple recommendation systems means multiple ML models, there will be
    one consumption script which will be sitting on top of all, to combine the output
    of all the ML models/recommenders in this case.


    ## Example: Customer Churn


    Another example will be a typical case of customer churn. We create a customer
    churn model in many industries and give a probability score to each customer,
    signifying its probability to churn. To make things easier, rather than giving
    the probability score, we take a probability cutoff, and above that, every customer
    is a churner, and below that, they are not a churner. The cutoff is taken based
    on the analysis of historical data.


    Now, in every business, some customers are always going to churn, the idea is
    to stop the customers which are either most profitable or are most likely to churn
    out from the lot. If we want to identify the most profitable customer, the churn
    model will not provide that insight and we need to either create an ML model to
    identify the most revenue generating customer or identify the most revenue generating
    customer based on the historical transactions. In both the cases, the list of
    customers, in which the business is interested will come from somewhere else and,
    only for that set of customers, we need to provide the churn probability or flag.


    The other thing is, even if the model assigns everyone the probability of churn,
    the marketing budget might be there for only a fraction of customers to be engaged,
    so that they don’t churn. In that case, we need only the top n percentage of customers
    with their churn probability.


    ## Summary


    The preceding two examples were just to highlight that even after the ML model
    deployment, there needs to be work done to utilize the result. It can be as simple
    as converting the probability score into a `YES` or a `NO` value or finding the
    top n records, to as complicated as combining the results from multiple ML models
    for a single entity like the customer or a product.


    The most important thing is the consumption step output as this is what the business
    decision maker can directly consume. As mentioned earlier, the output of the deployed
    model can be consumed directly by the business at times, or there needs to be
    work done on the deployed model output, to be consumed.


    ![](image-cpavhd8n.jpg) Figure 3.4: Consumption overview


    Consumption is the final step in the business use case, which can be composed
    of one or multiple data science use cases. The decision makers consume the consumption
    output, although for them to take the decision confidently, the model should give
    acceptable results. It shouldn’t happen that when the model was deployed, the
    results were good, however after that, nobody bothered to check the performance
    on the ongoing data. This may lead to a huge loss in terms of finances or even
    to the organization’s credibility. The deployed model needs to be continuously
    evaluated, retrained, and redeployed if necessary. We will discuss the evaluation
    and monitoring deployed model in the following section.

    '
  trans: '


    # 消费


    消费发生在部署之后，在这一过程中，部署后的模型输出将根据业务需求进行处理和对齐。有时，部署本身就足以满足业务消费了；但在大多数情况下，部署的输出需要经过进一步的处理。


    消费需要与部署分离的原因可能是以下几点之一：

    *   需要部分结果，例如前 n 个值。

    *   输出结果是多个机器学习（ML）模型的组合。

    *   机器学习模型的输出是基于规则和数据的某些混合系统的一小部分。


    我们将学习所有这些情况的示例，但由于这些需求，消费也必须满足部署的一部分要求，如可扩展性、安全性和可用性。有时有时与部署步骤输出的相同数据，但通过报告或如
    `Tableau` 或 `Looker` 等 BI 工具以更好的方式呈现出来。


    ## 示例：产品推荐


    作为一个示例，考虑这样一种情况：你想根据客户的购买模式、客户信息等向其推荐产品。你可能会使用不同的算法或不同的数据集创建多个推荐模型，例如，一个可以基于产品的关联规则，而另一组推荐可以来自协同过滤。对于同一个任务可能存在多个推荐模型。


    在性能检查之后，可能所有这些模型在不同条件下都表现得更好。向客户提供的最终推荐应该是：这些模型中的每一个在提议给客户的产品列表中都有适当的体现。这种来自多个推荐引擎的产品组合是消费脚本的一部分，它也是预期的输出。尽管多个推荐系统意味着多个机器学习模型，但会有一个消费脚本位于所有模型之上，在这种情况下，它将所有机器学习模型/推荐器的输出结合在一起。


    ## 示例：客户流失


    另一个示例是典型的客户流失案例。在许多行业中，我们都会创建一个客户流失模型，并给每个客户分配一个概率分，表示其流失的概率。为了方便起见，我们不再直接给出概率分，而是取一个概率阈值，高于该阈值的客户都是流失者，低于该阈值的则不是。阈值是根据对历史数据的分析得出的。


    现在，在每种业务中，总会有一些客户流失，核心想法是从客户群中留住那些利润最高或最可能流失的客户。如果我们想识别利润最高的客户，流失模型将无法提供这种洞察，我们需要要么创建一个机器学习模型来识别产生收入最高的客户，要么根据历史交易识别产生收入最高的客户。在这两种情况下，业务感兴趣的客户列表将来自其他地方，并且仅针对这部分客户，我们才提供流失概率或标记。


    另一点是，即使模型为每个人分配了流失概率，营销预算也可能只用于对小部分客户进行互动，以防止他们流失。在这种情况下，我们只需要前 n 百比的客户及其流失概率。


    ## 总结


    上述两个示例只是为了强调，即使在机器学习模型部署之后，仍然需要开展工作来利用结果。这可以简单到只需将概率分转换为 `YES` 或 `NO` 值，或找到前 n
    条记录，也可以复杂到为单个实体（如客户或产品）合并来自多个机器学习模型的结果。


    最重要的一点是消费步骤的输出，因为这是业务决策者可以直接消费的内容。如前所述，部署模型的输出有时可以被业务直接消费，或者需要对部署模型的输出进行一些处理后才能被消费。


    ![](img/image-cpavhd8n.jpg) 图 3.4：消费概览


    消费是业务用例的最后一步，它可以由一个或多个数据科学用例组成。决策者消费消费输出，尽管为了让他们有信心地做出决策，模型应该给出可接受的结果。不应该出现这种情况：模型部署时结果良好，但之后没人去检查其在持续数据上的性能。这可能会导致财务方面的巨大损失，甚至损害组织的信誉。部署的模型需要持续地评估、重新训练，并在必要时重新部署。我们将在下一节中讨论部署模型的评估和监控。


    '
