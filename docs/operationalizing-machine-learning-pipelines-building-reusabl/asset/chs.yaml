  \ 命名空间下。使用不同命名空间的想法更好，因为它将模型训练与模型提供隔离开。KServe 除了模型提供之外提供了许多额外服务，如自动伸缩、金丝雀发布（canarying）、可解释性等。由于这些优势，它是提供最终确定模型的理想工具。\n\
