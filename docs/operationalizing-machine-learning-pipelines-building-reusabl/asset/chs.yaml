  \ business@bpbonline.com 联系我们并提供材料链接。\n\n## 评论\n\n如果您阅读并使用了本书，为什么不分享您的观点呢？我们重视您的反馈，这将为全球社区做出贡献。\n\
  \n---\n\n\n\n   - 持续评估\n\n\n   - 基线模型\n\n   - Polyaxon 设置\n\n\n\n\n\n\n\n\n\n# 引言\n\
  在本章中，我们将介绍如何在组织中启动数据科学项目。我们将讨论如何成功识别和利用数据科学潜力的资源和步骤。还将涵盖诸类问题，例如需要验证什么、潜在的结果，以及在解决完每个问题后如何继续推进。\n\
  \n## 结构\n在本章中，我们将涵盖以下主题：\n- 概述\n- 引入合适的人\n- 业务问题及其优先级排序\n- 数据识别与收集\n- 想法验证\n- 想法验证的潜在结果\n\
  \n## 目标\n本章旨在引导领导者、技术项目经理或经验丰富的数据科学家来识别并规划资源和时间表，以成功建立数据科学项目，从而产生收益、优化流程等。本章也将作为后续章节的基石，在后续章节中，我们将详细讨论每一个步骤。\n\
  \n## 概述\n如今每家组织都在试图利用数据，并投入了大量资源招聘数据科学家、数据工程师以及云平台来构建数据湖，并配备各种工具以从数据中创造价值。然而，在分析领域，一个让这些组织与众脱颖而出的点在于业务问题的清晰度。这听起来非常简单；但我们经常观察到，决策者已经决定解决某个问题，结果却发现没有数据或数据不足。\n\
  \n“数据是新的石油”是如今非常著名的一个格言，在当今世界也非常贴切，因为万物皆互联并产生了海量数据。要利用石油，你必须对石油的各种用途有基本的了解。例如，石油可以驱动车辆、驱动机械，或者如果你是石油生产商，你也可以通过销售石油产生收益。同样，要利用数据，需要有清晰的业务愿景，同时要识别组织拥有哪些数据。\n\
  \n本章将讨论如何通过遵循一个简单的练习来对齐所有利益相关者，找到一条清晰的路径。通过这种方式，可以发现数据投入以及相对于投入的投资回报率（ROI），并决定是否值得继续推进，还是需要先做其他事情。\n\
  \n## 引入合适的人\n图 1.1 展示了在开始任何 `ML/DS` 实践之前应该识别的人员/角色，如下：\n\n![](img/image-4ih7dh5y.jpg)\n\
  图 1.1：合适人员的关键职责\n\n首要任务是组建合适的团队来进行想法验证，以看到从数据中产生的价值。高层团队应包括业务决策者、拥有内部数据及其业务相关性知识的人员，以及必须亲手处理数据的数据科学家/分析师。\n\
  \n举个例子，考虑一个 `IoT` 场景，组织已经启用了许多传感器来实时监控设备或安装的状况。这很棒；但实际价值将来自设备的未来行为。这可以通过传感器回答以下问题来捕捉：\n\
  - 设备故障的概率是多少？什么时候会发生？\n- 设备的优选行为是什么？\n- 对设备的影响是什么？\n- 设备什么时候需要更换？\n\n另一个例子可以来自 `零售`\
  \ 领域，它引出了以下问题：\n- 业务问题是什么？\n- 该想法的结果是什么？\n- 投资的回报率（ROI）是多少？\n\n业务决策者、产品所有者和数据科学家的角色可以由一个人兼任，同时也可以有多参与。整个练习的一个关键方面是理解价值，以防业务问题得到解决。在定义了清晰的业务结果之前，不要投入资源。否则，会导致大量的精力浪费和财务损失。\n\
  \n## 业务问题优先级排序\n图 1.2 展示了一种对问题进行优先级排序的方法，利用数据来创造价值，如下：\n\n![](img/image-541yyt8.jpg)\n\
  图 1.2：业务问题优先级排序\n\n第一步是有一个清晰的业务问题，知道什么样的结果可以解决它，以及如果解决了将产生什么价值；所有这些应该在整个组织范围内记录下来。这个练习可能很耗时，但非常重要。它不仅能让组织在短期受益，也有助于构建数据资产的愿景。即使业务问题列表太长也没有关系，但从列表中挑选前五个或十个是一个好主意。\n\
  \n一旦问题描述确定，下一步是分析组织内部可用的数据以及需要从外部获取的任何额外数据。获取数据的成本也应该考虑在内。与业务问题不同，这一步骤是一个协作练习。业务和数据代表需要合作，清晰地列出解决每个问题所需的数据。这将有助于过滤问题，并对它们进行解决和优先级排序。\n\
  \n\n\n\n\n## 数据识别与收集\n\n在确定业务问题后，下一步是将业务问题分解为数据问题。这一步需要有人熟悉组织内部可用数据（也称为原始数据）的人员参与。他们还需要关注任何可用的次级数据（如人口统计数据、天气等）以及任何可以获取的第三方数据。\n\
  \n如果数据科学家拥有足够的业务经验，他/她可以独立完成此任务。否则，应在数据科学家的帮助下，由产品所有者完成此任务。数据通常分布在多个数据仓库和应用程序中。次级和第三方数据也需要汇聚到一个地方。为了进行持续分析，数据需要存储在一个地方；但对于初始尝试，这些数据可以从多个源手动收集。一旦从数据中凸显了业务价值，它将提供足够的价值来创建一个集中的数据湖。然而，大多数组织在对如何利用数据有清晰愿景的情况下，正盲目地创建数据湖，这并不是坏做法，但最好能有合理的理由来证明其必要性。\n\
  \n识别相关数据说易行难，并涉及大量的时间和资源。例如，考虑某人想要识别客户是否会流失；在这种情况下，相关数据可以是客户的交易详情、产品详情等，这些在组织内部很容易获得。同时，居住在特定邮政编码的客户平均薪水、客户所在城市的经济健康状况等都是很好的信息，因为它们可以增加价值，但这些数据在组织内部可能无法直接获得。在这种情况下，将数据集划分为以下三类变得非常重要：\n\
  \n*   **必须拥有的数据（Must have data）。**\n*   **有的数据（Good to have data）。**\n*   **不经探索无法确定相关性的数据（Data\
  \ whose relevancy can't be established without exploration）。**\n\n必须拥有的数据是开始探索业务问题解决方案的基础。有的数据是所有利益相关者达成一致的数据；这些数据将为解决问题提供额外信息，但不是决定性的，特别是在想法验证阶段。然后还有一些数据可能产生影响也可能不会，但在对手头的业务问题进行彻底探索之前无法做出评价。同一个数据集对于不同的问题可能会改变分类；例如，天气数据对于特定问题可能是必须的，而对于组织中的另一组问题，它可能属于“有的”或“需要探索”的类别。\n\
  \n识别相关数据的练习非常耗时，并且需要大量的分析，例如检查数据质量和数据对当前问题的实用性。有像 `Python` 和 `R` 以及技术（我们将在后面的章节中讨论）可以完成这些工作，数据科学家必须精通这些工具和技术。一旦数据最终确定，下一步是想法验证，我们将在下一节中讨论。想法验证的目标是通过选择正确的\
  \ KPI（关键性能指标）并决定后续行动方向来检查性能。\n\n## 想法验证\n\n想法验证是全方位产品开发之前的一项常见做法。在数据科学项目中，我们需要遵循类似的方法。一旦完成业务问题识别和数据识别，我们需要快速围绕数据制定问题方案并准备数据。当然，由于取决于行业和数据收集的法规规定，有时可能会面临若干挑战。\n\
  \n第一步是以遵守所有法规（例如，等）的方式获取数据，同时确保数据被妥善加密。这些内容需要完善的系统支持，这超出了本书的范围，但如果这些系统尚未到位，请确保能够尽快以临时方式完成这些工作。\n\
  \n数据可用后，应该进行探索性数据分析（将在后面的章节中详细讨论）。应该探索数据带来的挑战以及在考虑问题陈述的情况下，从数据中可以得出的任何洞察。这项核心任务由数据科学家执行。当获得洞察后，应让所有利益相关者参与，并用每个利益相关者都能理解的语言进行沟通。这非常重要，因为每个利益相关者都会根据洞察及其理解提供输入。输入会影响处理问题的行动方案，或者在某些情况下会改变问题本身。与典型的产品开发相比，数据科学项目在这一点变得极具挑战性。考虑到这一点，想法验证的目标是在数据确定的情况下，针对特定问题可以预期的内容以及结果有多良好提供高级见解。这应该对识别出的多个业务问题进行尝试，因为可能对某些问题获得满意的结果，而对其他问题，你需要更多数据或对问题本身进行重新工作。拥有这些信息后，领导者在投资和构建数据平台时拥有清晰的优势，可以很容易看到投资回报率（ROI）。想法验证后的后续步骤将在后面的章节中详细讨论，但如果没有明确的方向，也应该执行这一步，以检查假设及其可行性。凭借云端按需提供的计算资源，除非能够很容易获得明确的方向和投资回报率来证明进一步投入资源（包括计算和人力）的合理性，否则你不需要预投入太多资金。\n\
  \n\n\n\n## 想法验证的潜在结果\n\n基于多种因素，可能会产生不同的结果；首要的因素因素是数据和业务用例。在急于实施数据科学实践的过程中，不应忽视这样一个事实：可用数据可能无法为眼前的业务问题提供可接受的答案。确定多个业务问题并用数据对它们进行快速验证，将有助于组织就其数据策略在正确的方向上快速做出决策。\n\
  \n对于任何用例，主要可以预期到以下三种输出之一：\n\n*   数据足够良好，可以为当前的业务问题提供见解。\n*   数据不足，需要额外数据。额外数据可以是该实体的更多属性，也可以是更多的实体本身。\n\
  *   可用数据不足以解决任何问题。需要外部协作才能从数据中提取任何价值。\n\n第二种结果和第三种结果之间存在细微的差别，即在第二种结果中，你知道自己在数量或现有实体（如客户、产品等）的特征方面需要一些额外数据，然后你可能会获得满意的结果；然而，在第三种结果中，你确定仅凭拥有的数据无法解决任何业务问题，我们需要与寻找此类数据的业务进行合作。第三种结果的一个典型例子是物联网公司，因为它们产生大量的传感器数据；但在孤立状态下，这些数据点无法取得太大的成就。\n\
  \n第一种结果是理想的结果，其余的书中将优先考虑第一种结果。大多数情况下，组织在没有定义和验证业务问题的情况下，投入大量资源投入到云订阅、数据湖以及数据科学家/工程师等资源上。这种方法的问题弊端在于，没有人知道他们应该向哪个方向移动，而他们想尽可能地从所投入的投资中获得回报。这形成了一个灾难的根源，应该妥善执行本章讨论的步骤以避免此类情况的发生。\n\
  \n在随后的章节中，我们将假设组织已经定义了清晰的业务问题并拥有正确的数据。我们将讨论应该具备的关键实践和组件，以便更快速地启动用例，并同时针对新的业务问题进行新的实验。\n\
  \n## 结论\n\n在本章中，我们讨论并概述了构成在组织内部建立数据科学实践的良好团队结构的要素。应该有一位业务决策者、一个产品所有者和一个数据科学家，他们应该共同工作，识别并优先考虑具有清晰投资回报率（ROI）并可以使用可用数据解决的用例。本章还从高层面上强调了针对特定问题查看数据并对问题做出决策背后的思维过程。\n\
  \n本章为书中后续的所有章节奠定了基础，在进入下一步之前，我们将假设组织已按照本章中所提到的方法完成了他们的准备工作。\n\n## 记忆要点\n\n*   识别业务问题以及对这些问题做出决策的人，是建立成功的机器学习（ML）实践的关键。\n\
  *   在机器学习实践的初始设置中，团队应包含三类角色——业务决策者、产品所有者和数据科学家。\n*   一个人可以扮演多个角色，同时也可能需要多个人参与。\n\
  *   理解可用数据的局限性和优势对于用例来说至关重要。\n*   初级数据、次级数据和第三方数据。\n*   想法验证和潜在结果。\n\n## 选择题\n\n\
  1. 假设你正在参与一个项目，你必须向客户推荐产品；以下哪个角色是销售人员扮演的角色？\n   a. 业务决策者\n   b. 产品所有者\n   c. 业务所有者\n\
  \   d. 以上均非\n\n2. 第三方数据与初级和次级数据有什么不同？\n   a. 它是组织外部可用的处理后的数据。\n   b. 它是某些组织的初级数据。\n\
  \   c. 初级数据和次级数据的组合\n   d. 没有区别\n\n3. 如果你想分析并预测某个地区的电力消耗，你会将天气放在哪一类？\n   a. 有的\n\
  \   b. 必须\n   c. 在没有探索的情况下无法\n   d. 不需要\n\n4. 机器学习想法验证的潜在结果是什么？\n   a. 使用数据集可以解决业务问题。\n\
  \   b. 使用数据集无法解决业务问题。\n   c. 解决业务问题需要额外数据。\n   d. 以上之一。\n\n## 答案\n\n1. b\n2. a\n\
  3. b\n4. d\n\n## 关键术语\n\n*   **业务决策**：有权决策的人，例如销售主管、工程师主管等，取决于用例。\n*   **产品**：理解组织业务、至少感兴趣的领域以及组织拥有数据的人。\n\
  *   **初级**：组织拥有的数据。\n*   **次级**：可用数据，如天气等，作为其他供应商的初级数据。\n*   **第三方**：有用但必须从多个供应商获取并进行处理的数据。\n\
  \n## 参考\n\n*   `GDPR`: `https://en.wikipedia.org/wiki/General_Data_Protection_Regulation`\n\
  *   `HIPPA`: `https://www.cdc.gov/phlp/publications/topic/hipaa.html#one`\n*   `PII`:\
  \ `https://en.wikipedia.org/wiki/Personal_data`\n\n# 第二章 ML 项目：生命周期\n\n在本章中，我们将讨论数据科学项目的不同阶段以及如何管理它们。我们还将强调关键结果以及项目何时从一个阶段移动另一个阶段。本章还将讨论数据科学项目所需的行业定义标准及其扩展。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   概述\n*   CRISP-DM\n*   CRISP DM 扩展\n\n## 目标\n\n\
  学习本章后，我们将理解数据科学的标准框架 `CRISP-DM`、`CRISP-DM` 的局限性及其扩展的必要性，以及 `CRISP-DM` 及其扩展每个步骤的详细信息。然后我们就可以将这些概念应用于我们的实时项目中。\n\
  \n\n\n\n\n## 概述\n机器学习（ML）项目会经历不同的阶段/步骤，且每个阶段都至关重要。为了开始下一步，上一步应该应该产生一些可操作的输出。随后的章节将讨论这些阶段中的每一个。其核心思想是定义一个功能性框架，使其涵盖机器学习项目生命周期的所有方面，并具有可管理性。目前存在一些行业定义的标准，如\
  \ `CRISP-DM`、领域驱动数据挖掘等。我们将在下一节中详细讨论 `CRISP-DM`。\n\n随着数据科学范式的不断演进，以及几乎所有行业都在通过数据来创造价值，`CRISP-DM`\
  \ 框架需要扩展。我们将详细讨论为什么需要扩展 `CRISP-DM` 框架。在解释该框架时，我们将结合几个行业示例来解释每个阶段的具体内容，以便于理解。其核心思想是为整个行业定义一个清晰的运营流程概述。这应该是必须的，以便让数据科学用例的每个阶段都能被分解为这些实用的步骤。此外，这将使我们能够针对每个阶段确定正确的个人/团队以及所需的工具包。\n\
  \n本章的结果将为设计机器学习和数据科学技术框架时所有需要考虑的功能方面奠定基础。\n\n## CRISP-DM\n`CRISP-DM` 代表跨行业数据标准过程（Cross-Industry\
  \ Standard Process for Data）。它是一个开放的标准过程模型，描述了数据挖掘专家使用的常用方法，涵盖了整个行业通的高级步骤。如所述，它是一个开放标准，因此可以被扩展并开放使用。`CRISP-DM`\
  \ 制定于 1996 年，后来成为欧盟的一个项目，由五家公司领导——Integral Solutions Ltd, Daimler NCR 和 Figure。图\
  \ 2.1 可视化了构成 `CRISP-DM` 的所有步骤，如下：\n\n![](img/image-a9t6ax9s.jpg)\n图 2.1: `CRISP-DM`\n\
  \n如强调，根据 `CRISP-DM`，数据科学项目的六个步骤或阶段如下：\n- 业务理解（Business understanding）\n- 数据理解（Data\
  \ understanding）\n- 数据准备（Data preparation）\n- 建模（Modeling）\n- 评估（Evaluation）\n-\
  \ 部署（Deployment）\n\n所示，根据这些阶段的发现，某些步骤会来回移动。我们将在随后的章节中结合适当的示例讨论每一个步骤。\n\n## 业务理解\n\
  参考图 2.2，它展示了业务理解的概述，如下：\n\n![](img/image-swk4kae6.jpg)\n图 2.2: 业务理解概述\n\n业务理解在上一章中讨论过。然而，在之前的图片中，这些方面是基于数据科学家的背景来处理的。一旦有了特定问题，数据科学家将启动项目，并应该对以下问题有清晰的答案：\n\
  - 问题陈述是什么？\n- 谁需要该问题的答案？\n- 为了让决策者（第二个问题的答案）能够使洞察具有可操作性，预期输出是什么？\n\n为了回答这些问题，数据科学家需要与业务决策者或产品所有讨论可用的数据集，并根据他们是否有任何数据需求提供建议。理想情况下，拥有具备业务理解的数据科学家是最好的，但情况并非总是如此；因此，产品所有提供数据相关的输入变得至关重要。\n\
  \n举个例子，业务需求可能是增加客户收入。该问题可以通过多种方式解决，例如留住现有客户、向现有客户进行推销/交叉销售，或获取新客户。基于优先级排序练习，假设优先实施推销/交叉销售。在此阶段，数据科学家应该清楚地了解，一旦任何方案准备就绪，它将如何被消费。此外，该特定示例中解决方案的其他细节还包括提供建议的频率、应该在\
  \ SKU 级别还是在其他聚合产品类别上进行等。其核心思想是尽可能多地收集信息，以提供一个可以被业务决策者直接的解决方案。\n\n如业务理解后的图中所强调的，下一步是数据理解。然而，在数据理解之后，我们可以再次回到业务理解。这只是为了强调\
  \ `CRISP-DM` 框架支持重新访问之前的阶段。在业务理解之后，问题陈述和相关数据应该是清晰的。数据科学家将进入下一个阶段，即数据理解。\n\n## 数据理解\n\
  确定业务问题后的下一步是数据理解。数据理解的第一步是将所有相关数据收集并处理到一处。下一步是在考虑业务问题的同时对数据进行分析。分析数据是主观的，在很大程度上取决于分析数据的个人。然而，有一些需要完成的标准步骤，我们将在接下来的章节中探索这些步骤。\n\
  \n我们在上一章中接触了数据理解，但那时只是在检查可行性，即是否可以使用现有数据回答问题。在这里，我们谈论的是一个完整的项目，并将相关数据本身收集到一处。分析可用数据量所需的计算能力和数据框架也是需要考虑的关键因素。我们将在接下来的章节中解决这个问题。\n\
  \n此练习的第一个结果是关于可用数据的质量；例如，数据的时间范围、缺失值、离群值、数据分布、分类变量中的唯一值等。在理解数据时，应该与业务部门进行持续讨论，以便像缺失值或离群值处理等挑战可以在整个练习过程中得到解决。同时，还可以探索变量之间的相关性、多重共线性等额外洞察，并对数据以及生成该数据的过程建立充分理解。一旦数据理解完成，对于预测什么或因变量，以及应该利用什么数据或自变量来预测因变量，应该是清晰的。数据理解完成后，下一步是数据准备。\n\
  \n\n\n\n\n## 数据准备\n\n机器学习算法仅接受数值值作为输入，这需要将分类变量或因子变量编码为数值。为了转换所有可供机器学习算法的数据，我们需要对数据进行准备，这就是数据准备阶段所发生的工作。数据准备通常是整个过程中最耗时的任务，但有时也有例外。数据准备期间需要完成的三项任务如下：\n\
  \n- 因变量准备\n- 特征工程/自变量\n- 特征选择\n\n## 因变量准备\n\n因变量准备是基于所定义的问题的，它可以非常简单，例如预测某个特定人口统计区域的房价，也可以非常复杂，例如在异常情况本身没有被明确定义的情况下预测异常。这取决于具体情况，并且在前两个步骤中，预期对因变量有清晰的定义；在这一步中对数据进行量化。因变量如示例所示，业务所关注的变量，例如房屋价格、客户流失标记等。这些是根据历史数据进行预测的变量，并据此做出业务决策。如果没有清晰的因变量，机器学习用例就无法进行。这是业务理解之后需要定义的第一个步骤，而且通常是数据理解最重要的成果之一。量化过程发生在数据准备阶段。\n\
  \n## 特征工程\n\n特征工程是从数据集中派生有用特征的过程，它让你能够预测因变量。这是一个范围非常广泛的过程，没有标准化的步骤来完成它。它是领域/业务理解、数据中的模式以及发挥创造意的结合。然而，也有一些标准步骤，如将分类变量编码为数值，或从单个数值变量创建多个变量。这是一个与特征选择相结合的迭代过程，其中我们通过特征工程创建尽可能多的特征，并根据统计关系/检验或机器学习模型剔除这些特征。在执行特征工程和选择时，一个重要的思考点是：该特征（或用于派生该特征的数据）是否会比因变量提前可用。尽管这是一个很简单的想法，但很多时候问题正是因为此而产生。\n\
  \n例如，如果你正尝试提前一年预测客户是否会购买某件产品，你不能使用客户当月的薪水。你的因变量将是一个表示 1 或 0 的二进制标记，1 表示购买，0 表示不购买。现在，为了提前一年预测客户是否会购买该产品，你需要使用一年前你拥有的客户信息，包括他的薪水。核心思想始终根据历史数据预测未来，这有时会被忽视，我们需要对此保持小心。如果数据准备得不正确，从中得出的任何见解都是垃圾，因此所谓的“垃圾进，垃圾出”（Garbage\
  \ in Garbage out）。数据准备非常重要且非常耗时，因为这里的任何错误都会传播到最后，而这样做是为了获得业务洞察和未来预测。考虑图 2.3，它说明了时间限制的特征开发，所示：\n\
  \n![](img/image-c6df2tfi.jpg)\n图 2.3：时间限制特征创建\n\n不应有任何交叉独立期间的特征工程或特征选取。问题类型和评估技术取决于数据集。\n\
  \n## 建模\n\n建模是将各种算法应用于准备好的数据的步骤。在这一步中，尝试不同的模型以找到最合适的一个。目标是创建一个对未见数据泛化良好的模型。\n\n\
  ## 评估\n\n一旦确定了特定的机器学习模型，评估模型性能是建模后的下一步。在这一步中，将使用未用于训练的数据集。通过已创建的模型对数据进行评分，并与实际值验证性能。新数据通常被称为测试集，这是监督学习中的标准做法。另一种非常常用的技术是时外验证（out\
  \ of time validation），即在临近的历史数据上测试模型性能。\n\n\n\n\n\n## 部署\n\n部署是根据 `CRISP-DM` 执行的最后一步。在对模型进行评估并接受性能后，需要部署模型以对新数据进行评分。部署可以是实时处理流式数据，也可以一次性处理数百万条记录。在这两种情况下，都存在不同的挑战，ML\
  \ 框架应该能够处理两种类型的数据，即流式和批处理。\n\n原始数据通常不是一种可以直接被 ML 模型用于预测的格式。实时处理的挑战在于延迟和扩展性，部署的模型应该支持多个实例的并行扩展，同时，设置应能够快速处理并对数据进行评分。这是一项非常有挑战性的任务，但得益于新的开源工具和云服务，可以以简单的方式解决。同样，对于批处理，挑战在于一次性处理海量数据。这需要大量的计算能力，但并非永久性，这再次说明了云在机器学习中起着至关重要的作用。\n\
  \n一旦部署，ML 模型就应该能够对新数据进行评分，并且根据 `CRISP-DM` 流程，这是最后一步。然而，由于以下事实，需要对模型进行持续监控和评估：\n\n\
  * 数据会随时间发生变化，新数据可能不再来自创建模型时的相同分布。\n* 产生数据的业务或流程发生了变化。\n* 上述任何因素都会导致数据发生变化，因此模型无法给出正确的结果。这要求对模型性能进行持续评估，并在性能不达标时重新审视整个生命周期。\n\
  \n另一个 `CRISP-DM` 中未考虑的两个方面是模型输出的最终消费；例如，你可以获得客户流失业务的概率值或房产价格，但对于决策者来说，在仪表板（dashboard）中精炼这些信息更有意义。通过有效的名称和颜色代码将客户显示为潜在流失者，或者以范围值的形式显示房产价格，会更有意义。有人可能会认为这是部署的一部分；然而，相同的信息可以通过多种方式进行调查，因此，“消费”与“部署”是分开的，且同样重要。\n\
  \n我们将在接下来的章节中扩展 `CRISP-DM` 框架，并详细研究“消费”和“评估”。\n\n## CRISP-DM 扩展\n\n`CRISP-DM` 的最后一步是模型的部署。正如所讨论，模型的输出可能无法被业务直接消费，或者需求可能通过两个或三个\
  \ ML 模型的输出组合来满足。因此，ML 模型的消费变成了下一个需要解决的逻辑步骤。同时，由于之前讨论过的模型性能通常会随着时间的推移而恶化，因此应该持续监控模型的长期性能。图\
  \ 2.4 展示了 `CRISP-DM` 的扩展，如下所示：\n\n![](img/image-51mugh71.jpg)\n图 2.4: CRISP-DM 扩展\
  \ \n\n## 消费\n\n消费是指获取模型输出（s）并将其转换为决策者可以直接消费并进一步利用的信息的阶段。例如，考虑客户流失，模型的输出是概率分数或指示哪些客户将要流失的标记。业务部门可能对所有客户都不感兴趣，因为他们无法阻止所有人离开，所以他们可能想要产生最高收入且流失概率高的前\
  \ `n` 百分比的客户。为了识别来自客户的预期收益，可以有一个独立的 ML 模型，也可以基于历史细节。应该将流失概率与个人产生的收益结合起来呈现给业务部门，以便他们做出明智且有利可利的决策，阻止正确的客户离开业务。\n\
  \n另一个我们可以讨论的例子是物联网（IoT）用例，其中多个传感器监控机器或整套装置的性能。任务之一是预测传感器输出的温度、压力等未来读数。然而，由于在理想情况下这些值会持续产生偏差极小的值，因此不需要人工干预。但是，如果这些值可以结合在一起，以预测整个机器或整套装置是否运行正常或是否存在问题，那么这将成为每位高管都需要的信息，以便采取适当行动。这再次是优于传感器的预测输出之上的需求。它可能会利用另一个位于预测输出之上的模型，为业务提供关键信息。之所以保留“消费”这一步的想法是，因为在利用\
  \ `CRISP-DM` 时，范围被缩小到一个特定问题（如流失或预测温度等）。这些信息直接不会为决策者增加任何价值，他们需要多个 ML 模型。拥有一个与业务对齐的消费层，是成功的\
  \ ML 项目与失败项目之间的关键区别。\n\n## 持续评估\n\nML 模型的性能随时间推移而下降，利用这些模型做出的任何决策将是错误的，并可能对业务产生毁灭性影响。因此，为了确保模型达标且产生的输出是可靠的，需要对\
  \ ML 模型进行持续评估。\n\n根据所使用的 KPI，可以为特定模型设置持续评估。正如之前提到的，模型衰减可能有多个原因，但大致上可以分为两类——概念漂移（Concept\
  \ Drift）和数据漂移（Data Drift）。概念漂移更多关于对数据的解释。举个例子，考虑在不考虑季节性的情况下产品推荐。可能存在某些依赖关系，因此你的模型没有给出正确输出，而你发现季节性是你应该考虑的因素。数据本身没有变化，但对数据的理解发生了变化，因此被称为概念漂移。\n\
  \n数据漂移要简单得多，可以被视为底层数据随时间发生的变化。举个例子，考虑你正尝试使用位置、面积、该地区的工作数量等来预测某市的房价。现在，随着工作数量随时间变化，它对价格的影响可能与以前不同。这是由于数据的变化，因此是数据漂移。\n\
  \n应该持续评估模型，以避免出现概念漂移和数据漂移。\n\n我们在本章和第 1 章“DS/ML 项目 – 初始化”中涵盖了 ML 项目的每一个阶段。然而，为了完成我们讨论的所有步骤，我们需要一个灵活且能够针对每类任务进行扩展的框架和支持技术栈。下一章，我们将讨论组织应该具备的框架，以加速我们目前为止看到的\
  \ ML 项目的整个生命周期。\n\n\n\n\n\n## 结论\nCRISP-DM 是一个处理数据科学用例的非常通用且有效的框架，在本章中，我们详细讨论了 CRISP-DM\
  \ 涉及的所有步骤。CRISP-DM 框架未涵盖的额外需求，在框架的扩展中也进行了讨论。在逻辑上与这些功能任务对齐后，我们现在可以研究实现这些任务的技术工具细节，并探索如何将每个阶段的输出传给决策者。在下一章中，我们将讨论实现这些任务需要到位的技术框架。\n\
  \n## 记忆要点\n- 数据科学问题可以拆分为 CRISP-DM 的六个阶段。\n- 步骤会根据业务和数据的对齐情况而反复移动。\n- 数据准备通常是整个用例中最耗费时间的步骤。\n\
  - CRISP-DM 的扩展包含持续的评估和消费。\n- 消费步骤关注业务可以直接消耗的输出结果。\n- 持续评估关注模型的健康状况。\n\n## 多选题\n\
  1. 业务理解（Business understanding）步骤引向数据理解（data understanding）。它们可以反复移动，直到根据 CRISP-DM\
  \ 从数据理解移动到下一步。在其他哪一个步骤可能会直接返回到业务理解？\n   - 建模（Modeling）\n   - 数据准备（Data preparation）\n\
  \   - 评估（Evaluation）\n   - 以上都不是\n2. 哪个步骤是是 P-DM 中最耗费时间的？\n   - 建模\n   - 数据准备\n\
  \   - 部署（Deployment）\n   - 评估\n3. 哪一步确保模型输出以其所需的格式提供给业务决策者？\n   - 消费（Consumption）\n\
  \   - 部署\n   - 建模\n   - 数据准备\n4. 为什么持续评估是一个重要的步骤？\n   - 为了确保实施了新的机器学习算法（s）\n   -\
  \ 定期使用新数据检查模型性能\n   - 以期望的格式向业务提供输出\n   - 以上都不是\n5. 机器学习模型的概念衰减（Concept decay）会导致模型性能下降。概念衰减的原因可能是？\n\
  \   - 业务规则的变化\n   - 数据中时间关系的缺失\n   - 用例生命周期中缺失业务理解\n   - 以上以上都是\n\n## 答案\nc, b,\
  \ a, b, d\n\n## 关键术语\n- **跨行业标准数据挖掘过程（Cross-industry standard process for data mining）。**\n\
  - **因变量（Dependent）**：我们需要预测的感兴趣变量。\n- **特征（Feature）**：创建用于预测因变量的变量的过程。\n- **特征（Feature）**：移除冗余变量并选择有用变量的过程。\n\
  \n# 第 3 章：ML 架构 – 框架与组件\n在前两个章节中，我们涵盖了如何优先考虑并最终确定业务用例，以及机器学习（ML）用例生命周期的不同阶段。为了实现机器学习生命周期中的所有步骤，我们需要一个技术框架/架构，它能够根据需求以可扩展的方式完成机器学习生命周期中的所有任务。在本章中，我们将从功能和技术两个方面讨论架构的细节。在功能方面，我们将涵盖所需的关键组件及其效用。技术方面将侧重点介绍可以用于完成功能任务的工具。在工具方面，我们将重点介绍同一任务的多种工具；但我们不会进入细节。技术工具的选择完全取决于可用性和个人喜好，但本章将讨论这些工具具有的核心功能。\n\
  \n## 结构\n在本章中，我们将涵盖以下主题：\n- 概述\n- ML 框架\n- 数据源\n- EDA（探索性数据分析）\n- 数据准备\n- 建模\n-\
  \ 存储\n- 部署\n- 消费\n- MLOps（机器学习运维）\n\n## 目标\n学习本章后，你将能够为 ML 架构定义逻辑框架，为组织在建立 ML 架构和开展实践时提供指导原则，并了解完成每个方面所需的技术工具（这些工具也将作为示例分享）。\n\
  \n## 概述\n我们讨论了前几章 ML 用例所经历的步骤，为了让数据科学家和整个组织能够快速执行这些步骤需要一个框架。它应该能够灵活解决任何类型的问题，具有健壮性和可扩展性。它应该是易于使用和维护的，并能够支持用例中的所有步骤。框架还应该灵活地包含任何技术栈，比旧工具更合适。\n\
  \n从下一节开始提出的和讨论的 ML 框架将为组织内部创建架构提供所有的构建模块和思维过程。我们还将讨论每个组件的关键工具；然而，工具世界每天都在演变，因此可以被更好的工具所取代。所提出的框架是考虑了云的，因为许多任务需要灵活性，因此云最适合满足需求。云环境可以是组织拥有的私有云，也可以由\
  \ Amazon、Google 等大供应商提供。\n\n云提供了根据需要灵活利用资源的能力，并可以根据需要非常容易扩展。另一个优势与成本有关，即按使用付费，一些云提供商按分钟计费。由于许多用例是从想法验证开始的，在云上尝试是简单且快速的，而不是投资和配置自己的基础设施。云在访问和资源方面也提供了更多的控制，同时具有监控能力。由于所有这些原因，云最适合\
  \ ML 框架。\n\n\n\n\n\n## ML 框架\n\n图 3.1 显示了 ML 框架并突出了其关键组件。接下来，我们将讨论其中的每一个组件，并理解它们在\
  \ ML 用例生命周期中的作用，如下所示：\n\n![](img/image-70m6p8c3.jpg)\n\n图 3.1：ML 框架\n\n如前面的图片所示，框架中包含多个组件。我们将讨论每个组件及其用途。我们还将为每一步推荐工具，同时介绍在选择工具时需要考虑的挑战。我们还将讨论\
  \ `CRISP-DM` 框架中每个组件的用途，包括扩展部分。\n\n## 数据源\n\n我们将从数据源开始。与任何数据科学或 ML 用例一样，其核心思想是利用可用数据，因此可用数据源是\
  \ ML 框架的第一部分。数据源与 ML 框架中其他组件的一个区别是，在大多数时候，数据科学家是终端用户，不会参与数据源的设计。然而，理解数据在组织内部是如何存储的以及收集和存储的过程至关重要。同样，理解存储的数据是如何生成的（即数据生成过程），这一过程被假设作为业务理解的一部分已经完成。\n\
  \n存储在某处的数据是组织利用数据的重要资产。所有组织都有数据，但大多数时候的挑战在于数据存在“数据孤岛”中。为了解决业务问题利用数据，我们必须整合来自多个地方的数据。这是一个两步过程，如下：\n\
  \n1. 将来自多个源的数据汇聚到一个地方。\n2. 合并/处理数据以解决业务问题。\n\n第一步是创建数据流水线和作业，以定期更新目标环境或数据源中的数据。这可能涉及数据合并，更多偏向于数据处理侧。第二步则更贴合业务需求，如报告、分析等。\n\
  \n第一步可以大致分为两个步骤：摄取（Ingestion）和存储（Storage）。在摄取阶段，通过创建数据流水线来吸收来自不同位置的所有数据。这些数据可以来自\
  \ `IoT` 环境中的多个传感器，可以是来自数据仓库系统的每日批处理加载，也可以是应用程序实时生成的数据。每种数据类型都需要不同的处理方式；例如，对于流式数据，需要一种消息服务，这可以通过\
  \ `Apache Kafka` 或同类的云工具（如 `GCP Pub/Sub` 或 `AWS SNS`）实现。同样，存储之前的处理可以通过 `Apache Spark/Beam`\
  \ 或云端的同等服务完成。\n\n存储是摄取之后的下一步，在存储摄取的数据时应格外小心。这是因为数据可能被用于多种用途，而数据的存储方式有其自身的优点和局限性。例如，对于更新频率且经常查询的数据，应该以反规范化（denormalized）的方式存储，以提高查询速度。类似地，没有固定属性或列的数据可以存储在\
  \ `NoSQL` 数据库中。这些只是几个例子，需要进行更详细的分析以得出解决方案。\n\n摄取和存储的过程通常由数据工程师完成；但数据科学家理解这些过程至关重要。对这些过程的深入理解可以使数据科学家提供输入，从而可能改进流程。同时，理解数据是如何获取并存储的，将有助于设计涉及\
  \ ML 的端到端解决方案。\n\n在来自多个源的数据摄取并存储之后，下一步是合并或处理来自不同源的数据。这是数据科学家需要参与并根据用例需求开始研究数据的任务。除了数据科学的需要外，数据还被用于报告和分析，这些可能会重叠。报告人员、数据工程师和数据科学家之间的良好协调可以减少工作量，避免重复劳动。\n\
  \n一旦在数据源中识别出相关数据，下一步就是探索数据以得出假设和洞察。这一步被称为探索性数据分析（EDA），将在下一节中讨论。\n\n\n\n\n\n## EDA\n\
  \nEDA（探索性数据分析）是一个重要步骤，从高层次上看，它涵盖了数据理解、相关特征识别和基础模型评估的每一个环节。如果数据量巨大，则会在样本数据上进行 EDA。在\
  \ EDA 中，会对数据进行可视化和分析，同时进行特征工程、选择以及模型训练，以获取 KPI 的基准数值。\n\nEDA 的目标是实现一条清晰的后续路径。结果可以是以下任何一种情况：\n\
  - 数据对于该用例而言不足或不相关。\n- 积极方面，问题可以以满意的结果解决，等等。\n\n## EDA 的范围\n\n许多数据科学家有时将 EDA 仅称为图表和可视化；但事实并非如此。EDA\
  \ 包含了数据可视化和解读，但其意义远于此。在 EDA 过程中，我们会探索数据质量，如缺失值和离群值。同时，还会探索统计检验，如变量之间的相关性、（多）共线性等。将业务问题量化并最终确定为数据问题也在\
  \ EDA 中完成。在 EDA 期间，会定期与业务部门对每个洞察和相关假设进行验证，以构建正确的数据问题。\n\n特征创建和临时模型训练也会在 EDA 期间进行。EDA\
  \ More 是关于想法验证、定义 KPI 以及获取围绕这些 KPI 的性能估值；因此，在这一步可以尝试多个 ML 模型，但不需要进行细节处理，例如超参数调优等。其理念是为数据集选择一个合适的模型，并在后续步骤中使用该模型进行包含所有优化的最终训练。\n\
  \n## 工具与基础设施\n\n在编程语言方面，`Python` 和 `R` 是 EDA 最流行的工具，并使用 `Jupyter notebook` 或 `RStudio`\
  \ 作为 IDE。另一种正在追赶的开源语言是 `Julia`。对于大数据，结合 `Python` (`PySpark`) 的 `Spark` 是 EDA 的流行工具。由于语言和工具都是开源的，EDA\
  \ 通常在本地机器上完成，但本地机器并不总是能为每个用例提供所需的基础设施。为了解决这个问题，EDA 相关的任务应该由 ML 框架支持。\n\n在 ML 框架中，应该能够根据执行\
  \ EDA 所需的数据启动所需配置的自定义机器。同时，对于图像分类等特定问题，可能有特定的硬件要求（如 `GPU`）。这就是云变得非常方便的地方，因为硬件设备是昂贵的资源，除非经常使用，否则投资成本太高。在任何云平台上，都可以轻松启动一个具有所需配置和系统的\
  \ `VM`，并从那里开始推进。现在，许多云供应商开始以服务的形式提供 `Jupyter notebook` 等流行工具，用户可以在其中配置硬件需求并直接使用\
  \ `Python` 或 `R`，而无需担心操作系统等低级安装问题。\n\n## 下一步骤\n\n一旦 EDA 完成且出的洞察具有前景，下一步就是训练最终模型并将其部署，以定期对新数据进行打分。该过程的第一步是创建脚本，并为用于最终模型训练和新数据评分的持续数据准备定义流程。这一步被称为数据准备，我们将在下一节中讨论其细节。\n\
  \n\n\n\n\n## 数据准备\n\n数据准备是指对原始数据进行处理和清洗，以供机器学习（ML）算法消费的过程。这一步骤于探索性数据分析（EDA）本身，当\
  \ EDA 完成时，一条清晰的数据准备路径就已经铺设完成，这是 EDA 最重要的成果之一。在 EDA 完成后，应作为模型部分的特征集就确定了。需要一种机制为模型训练生成这些特征，同时持续地产生这些特征，以便对新数据进行评分。\n\
  \n数据准备的高级流程概述如图所示，该图强调了将数据准备视为一个独立且重要步骤的意义，具体如下：\n\n![](img/image-aj685r4f.jpg)\
  \ \n**图 3.2: 数据准备**\n\n如图所示，数据准备步骤不仅对训练重要，对于模型部署后对新数据进行评分同样重要。在上一章中，我们讨论了数据准备包含的所有内容；然而，在对新数据进行评分时，我们必须完全重复相同的操作。\n\
  \n例如，假设你有五个具有缺失值的特征，并正通过每个变量的平均值进行填充。对于其中两个特征，你正在通过将高值抑制到这些特征的第 95 百位数来执行离群值处理。现在，当你训练模型时，这很直接；但当新数据到来时，你不能使用新的平均值进行填充，或使用新的第\
  \ 95 百位数进行离群值抑制。这必须与训练模型时使用的值相同。由于这些步骤的存在，数据准备变成了一个需要深思熟虑的重要步骤。\n\n数据准备的另一个方面是特征创建本身。特征创建投入大量精力，因为它需要大量的创造力和业务理解。在很多情况下，一个用例中的特征也可以用于另一个用例。对于多个用例，工作是并行的，数据科学家在各自的孤岛中工作。这导致了特征工程方面大量的重复工作。解决此问题的方法如下：\n\
  \n## 特征创建的过程对齐\n\n特征创建的过程对齐是为了为特征构建单一源，例如 `customer`、`product`、`季度销售`、`年度数量`等。这样做主要是为了确保用于训练的特征与用于评分的相同。由于模型训练是在历史数据上进行的，直到消费阶段，评分的真正挑战才会出现，这要求在模型评分之前进行数据准备。如果需要新特征，必须将其添加到该表或文件中。\n\
  \n可以维护元数据信息以便于搜索。这主要通过图数据库实现，并有助于数据科学团队定期与数据工程师保持对齐。这是确保任何一个数据科学家创建的特征其他其他人也能使用的良好方法。这避免了重复性工作，同时也增加了数据科学家的学习收获。\n\
  \n## 利用特征存储工具\n\n创建和管理特征的另一种方法是利用特征存储（feature store）工具。一些机构已成功地将它们用于数据科学实践，例如 `Uber`\
  \ 使用其 `Michelangelo` 平台或 `GoJek` 使用 `Feast`。其中一些是开源的，且供应商正努力使其具备云无关性。有关更多细节和用法，可以参考特征存储\
  \ [1]，并根据需求选择合适的特征存储工具。\n\n## 数据准备的技术栈\n\n与数据准备相关的另一个挑战是技术栈。由于模型训练是在历史数据上进行的，直到消费阶段，评分的真正挑战才会出现。许多时候，结果出色的\
  \ ML 模型无法进入生产环境，是因为没有对新数据进行评分进行充分的考虑，而评分需要数据准备。因此，在进行数据准备时，也应该彻彻考虑新数据评分的任何挑战。在需要对流式数据进行实时评分的场景，这个问题尤为突出。在这些情况下，无论使用什么脚本和工具，它们都能够实时消费并处理数据。`Apache\
  \ Spark` 结合 `Apache Kafka` 消息服务通常是数据流数据的组合。云平台提供自己的消息服务和平台；例如，`GCP` 拥有 `dataflow`\
  \ 工具，它内部使用 `Apache Beam`，并结合 `Cloud Pub/Sub`，提供了与 `Spark` 和 `Kafka` 相同的选项。\n\n数据准备步骤也是随时间而改变的，因为用于预测未来的特征可能会变得无效，而新特征可能会变得更有用。这可能是由于上一章讨论的原因引起的，并可能导致数据准备的完全改变或微小变化。这些变化需要从代码和数据两个维度进行跟踪，这就是为什么\
  \ DevOps（或者在机器学习中是 MLOps）是一个非常重要的流程。\n\n## 训练与评分数据准备的区别\n\n训练数据与新数据评分的数据准备之间的一个区别在于，由于一个明显的原因——缺少因变量，因为新数据将用来预测因变量。\n\
  \n\n\n\n\n## 建模\n\n建模是数据准备之后的后续步骤。对于特定类型的问题，可能有多种算法可选择。在 EDA（探索性数据分析）期间，会尝试多种算法并衡量其性能；然而，很多时候数据在\
  \ EDA 阶段并没有被充分利用。这可能是因为人们想在较少的数据上验证想法，或者由于计算限制，亦或两者兼有。在 EDA 开启数据准备工作后，需要在数据上运行多次实验，以识别最适合该数据的模型。此外，正如前面讨论的，每一步都应该是可追溯且可重现的；我们需要以单独的方式进行建模，以便使用的产物和代码可以被跟踪、版本化并重现。\n\
  \n建模环节仅在模型的（重新）训练时出现。一旦模型完成了训练和验证，根据结果和 KPI（关键性能指标），它将进一步进入部署，最后进入消费。ML 建模中的重要步骤是尝试多种算法并收集\
  \ KPI，选择性能最好的模型。KPI 会根据问题类型和所使用的数据而变化。重要的一点是，计算 KPI 的数据不应该是训练数据集的一部分。这是为了衡量训练后的模型在新数据上的性能。模型通常在它们训练的数据上表现良好；但如果性能在新数据上发生剧烈波动，我们就说该模型过拟合了。过拟合是有风险的，因为模型在新数据上应该提供可接受的性能，这样它才能用于决策。\n\
  \n## 避免过拟合\n\n避免过拟合有多种方法；但最流行的方法是在训练时进行交叉验证。在这种技术中，数据被随机分成五个或十个桶（bucket），桶的大小完全取决于数据科学家。然后，在所有的桶上训练模型，每次留出一个桶，并通过对该留出桶进行预测来计算误差。这个过程对所有桶逐一执行，最终误差是所有留出桶误差的平均值。最终模型在所有数据上进行训练；然而，误差是平均值。通过这种方式，如果任何桶是离群值，它的影响也会在性能中得到很好的体现。这是一种常见的做法，被称为\
  \ k 折交叉验证，其中 `k` 是桶的数量。大多数标准的 ML 算法框架都将其作为标准实现的一部分提供。图 3.3 展示了一种查看 k 折验证的视觉化方式，如下：\n\
  \n![](img/image-wignr7mw.jpg)\n图 3.3：k 折验证\n\n## 计算需求与云\n\n我们讨论了模型训练涉及的所有逻辑方面。在\
  \ ML 框架中（特别是在训练背景下），我们需要考虑的另一个方面是：ML 训练是一项计算密集型操作。因此，我们需要巨大的计算能力，这取决于许多变量，包括数据量、使用的算法、超参数规模等。这一需求会随着用户尝试的不同\
  \ ML 算法数量的增加而再次增加。因此应该应该规定在需要时提供具有所需硬件（如处理器、内存和硬盘）的机器。这是另一个重要步骤，云在此时非常方便，因为在云上启动自定义机器非常简单，而且你按需付费。此外，还有许多其他方法可以在云上规模化训练模型，例如使用\
  \ `Kubernetes` 或特定厂商的训练模块，如 `GCP AI platform`。云的另一个重要优势是训练可以在多台机器上通过多个实验进行扩展，其中每个\
  \ ML 算法都是完全独立的，或者是是同一个 ML 算法的某种不同变体。这允许我们快速进行实验，缩短了模型训练与部署之间的时间，因为实验完成得快得多，因此整个过程进展得迅速。\n\
  \n## 可解释性\n\n对于特定类型的问题有多种 ML 算法可用，但区分模型是否部署到生产环境的一个重要方面是可解释性。对于业务来说，理解因果关系非常重要，而这并不总是\
  \ ML 模型的输出。然而，解释因变量和自变量之间的关系是数据科学家的责任，因此具备业务理解是有帮助的。在对 ML 模型输出没有合理解释的情况下，业务部门很难开始使用它，因此，即使模型移动到生产环境，也没有意义。目前对\
  \ ML 模型可解释性正在进行大量研究，数据科学家应该熟悉部分依赖图 (`partial dependence plot`)、代理模型 (`surrogate\
  \ model`)、`LIME`、`SHAP` 等，这些都是可解释 ML 模型的一些工具和技术。\n\n## 产物与存储\n\n建模步骤的产物是模型二进制文件或图表，根据所有利益相关者的协议，它们将进入生产环境。为了移动到生产环境，模型以及训练模型和计算\
  \ KPI 的数据需要被存储。虽然训练部分主要是代码，但在训练过程中会产生许多文件、二进制文件和图表形式的产物，它们需要被存储。同时，所有的实验运行都需要捕获其元数据，以便能够交叉引用所有的\
  \ ML 实验并选择最适合部署的一个。在整个过程中有两变得不可或缺：一是保存所有元数据（即代码和性能），二是保存创建模型的数据本身。在流程方面，我们将在 `MLOps`\
  \ 部分中讨论这些。接下来的章节将处理存储，以及如何组织存储以便于引用 ML 模型及其元数据。\n\n\n\n\n\n## 存储\n\n`Storage` 用于存储所有机器学习模型利用或作为输出的产物，包括数据。与仅维护代码的典型软件周期不同，在机器学习世界中，需要保存大量的额外产物来复制模型。这就是存储变得非常重要的地方，MLOpsps\
  \ 在维护数据版本方面起着至关重要的作用。我们将在稍后的 MLOps 中讨论版本控制和操作方面；然而，我们需要从需求的角度来定义存储。\n\n`Storage`\
  \ 是任何中心化的位置，可以在其中存储用于模型创建的数据，并为了审计目的进行访问。除了数据外，许多产物（例如模型二进制文件或图表、任何数据标准化二进制文件等）也需要存储。\n\
  \n## 数据存储的重要性\n\n为了说明存储为什么至关重要，假设你创建了一个机器学习模型，根据某些特征预测是否给客户发放贷款。可能会出现一种情况：你使用的历史数据存在性别偏见，由于偏偏的历史数据，女性的贷款通过率非常低或完全没有。这类问题有时不会立即被察觉，模型在某个时间点之前可能表现出可以接受的性能，当性能下降时，你会试图找出原因。\n\
  \n除非创建模型的数据不可用，否则很难推导出模型性能下降的原因。尽管某些行业将模型推向生产环境有非常严格的流程，但始终存在漏掉某些可能。由于由于原因，保存创建模型的数据非常重要。然而，与代码不同，数据文件非常巨大，需要独立且先进的方法来进行保存和版本控制。这将在\
  \ MLOps 部分进行讨论，我们将详细阐述该过程并提供可以利用的工具示例。\n\n## 其他产物和元数据\n\n除了数据版本之外，还有许多产物是机器学习模型创建的一部分，例如用于确定模型的\
  \ KPI、用于标准化或插补的变量/特征值等。如果所使用的模型保持不变，那么用于准备数据的值或逻辑在对新数据进行评分的持续过程中也将保持不变。对于新的机器学习模型，取决于数据处理情况，可能会发生变化或保持不变。通常，这些值或逻辑（如果无法用代码编写）需要保存在某处，以便在处理新数据进行评分时能够提取。\n\
  \n每个模型都会生成自己的一套元数据，并拥有其训练的一套数据。此外，随着时间的推移，模型将在新数据上重新训练，并生成新的元数据。因此，为了确保有足够的空间并引用正确的元数据，我们需要建立适当的流程并提供足够的内存。\n\
  \n## 存储解决方案\n\n由于存储需求不断增长并根据组织内数据科学的成熟度而演变，有几种处理方法——第一种是创建一个可以根据需要挂载的共享驱动器；第二选项是利用云存储，例如\
  \ `GCS` 或 `AWS` 桶。云选项是更好的，因为你不需要预付硬件费用，只需按使用量付费。此外，云存储将自动扩展。\n\n我们已经调查了存储的需求以及我们可以进行存储的方法。对于任何机器学习模型，一旦通过了初始截止和标准，就需要部署供常规使用。这是我们在下一节将讨论的话题，我们将讨论部署机器学习模型对新数据进行评分，以及根据评分需求在部署过程中应该经历什么样的思考过程。\n\
  \n\n\n\n\n## 部署\n\n模型需要部署以对新数据进行评分。根据需求和资源可用性，模型可以部署在本地或云端。在模型性能通过验证、所有利益相关者达成共识且\
  \ KPI 达到预期后，即可对机器学习模型进行部署。在部署过程中，需要满足以下几点：\n\n- 延迟应尽可能小，特别是对于实时应用而言。\n- 平台应根据数据和请求进行扩展。\n\
  - 易于使用且应确保安全并具有高可用性。\n\n我们将详细讨论这些点；但在模型部署之前，需要提问的关键问题是：新数据的评分将如何进行？也就是说，流式数据是实时进入并需要实时评分和消费，还是按预定义的频率运行并存储评分数据供消费的批处理作业？这些问题有助于确定模型的最佳方式，以便在满足需求的同时节省成本。\n\
  \n## 实时应用\n\n对于实时应用，最重要的一方面是尽早对新数据进行评分并将结果传递给下游流程。为了实现这一目标，为部署的模型提供 `REST API` 是最好的方法。做到这一点，最简单的方法是将模型部署在如\
  \ `GCP AI platform` 或 `AWS Sagemaker` 等云平台平台上。另一种方法是进行本地部署并创建 API，其中一种方法是在 `Python`\
  \ 中使用 `Flask`。在使用 `Flask` 时，还需要完成一些额外工作以确保模型 24/7 可用并能够处理多线程。这可以通过结合 `Gunicorn`、`Nginix`\
  \ 和 `Flask` 实现。另一种更好的方法是使用 `Kubernetes` 配合 `Seldon` 等工具来部署模型。使用 `Kuberenetes` 的优势是任何下游流程也可以部署在\
  \ `Kuberenetes` 上进行扩展。\n\n## 批处理\n\n与实时或流数据评分相比，批处理要简单得多。在这种情况下，我们唯一需要注意的是评分时一次处理的数据量。为了实现这一目的，模型的部署方式需要确保在无法预知的情况下，平台能够根据数据需求进行扩展。云端可以自动扩展的平台，如\
  \ `GCP` 和 `AWS` 的 `Apache Spark` 服务适用于此类工作。最好的方法是将模型二进制文件直接加载到作业中，并利用 `Spark` 的并行处理对新数据进行评分。选择正确的\
  \ `Spark` 版本非常重要，因为在 `Python` 或 `R` 等语言中创建的二进制文件将仅支持该语言。我们可以对批处理和流处理使用相同的服务；但某些平台对一次处理的请求数量有限制，因此在这些情况下，可以使用像\
  \ `Spark` 这样的平台。\n\n## 版本控制与维护\n\n之前讨论的所有模型部署解决方案都解决了延迟、扩展和安全性问题。它们还提供了易于使用的模型终端。模型的部署需要进行版本控制，因为模型会随着时间的推移而衰减并相应地更新。业务决策是基于模型的输出做出的，因此，为了审计和参考目的，需要维护模型版本。一些平台在其内部内置了维护模型版本的功能。在缺乏平台功能的情况下，需要建立适当的流程和规范对部署的模型进行版本控制，并追溯评分数据（例如是哪个模型版本对数据进行了评分）。我们将在\
  \ MLOps 部分详细讨论流程部分。\n\n## 消费\n\n机器学习部署是该数据科学用例的最后一步；但它可能只是解决业务问题的少数步骤之一。要解决业务问题，我们要么结合多个模型的输出，要么对单个模型的输出进行加工。这一步更贴合业务，也符合业务决策者对整个活动输出的期望。这一步被称为\
  \ `consumption`（消费），我们将在接下来的章节中通过几个示例进行探讨。\n\n\n\n\n\n## 消费\n\n消费发生在部署之后，在这一过程中，部署后的模型输出将根据业务需求进行处理和对齐。有时，部署本身就足以满足业务消费了；但在大多数情况下，部署的输出需要经过进一步的处理。\n\
  \n消费需要与部署分离的原因可能是以下几点之一：\n*   需要部分结果，例如前 n 个值。\n*   输出结果是多个机器学习（ML）模型的组合。\n*   机器学习模型的输出是基于规则和数据的某些混合系统的一小部分。\n\
  \n我们将学习所有这些情况的示例，但由于这些需求，消费也必须满足部署的一部分要求，如可扩展性、安全性和可用性。有时有时与部署步骤输出的相同数据，但通过报告或如\
  \ `Tableau` 或 `Looker` 等 BI 工具以更好的方式呈现出来。\n\n## 示例：产品推荐\n\n作为一个示例，考虑这样一种情况：你想根据客户的购买模式、客户信息等向其推荐产品。你可能会使用不同的算法或不同的数据集创建多个推荐模型，例如，一个可以基于产品的关联规则，而另一组推荐可以来自协同过滤。对于同一个任务可能存在多个推荐模型。\n\
  \n在性能检查之后，可能所有这些模型在不同条件下都表现得更好。向客户提供的最终推荐应该是：这些模型中的每一个在提议给客户的产品列表中都有适当的体现。这种来自多个推荐引擎的产品组合是消费脚本的一部分，它也是预期的输出。尽管多个推荐系统意味着多个机器学习模型，但会有一个消费脚本位于所有模型之上，在这种情况下，它将所有机器学习模型/推荐器的输出结合在一起。\n\
  \n## 示例：客户流失\n\n另一个示例是典型的客户流失案例。在许多行业中，我们都会创建一个客户流失模型，并给每个客户分配一个概率分，表示其流失的概率。为了方便起见，我们不再直接给出概率分，而是取一个概率阈值，高于该阈值的客户都是流失者，低于该阈值的则不是。阈值是根据对历史数据的分析得出的。\n\
  \n现在，在每种业务中，总会有一些客户流失，核心想法是从客户群中留住那些利润最高或最可能流失的客户。如果我们想识别利润最高的客户，流失模型将无法提供这种洞察，我们需要要么创建一个机器学习模型来识别产生收入最高的客户，要么根据历史交易识别产生收入最高的客户。在这两种情况下，业务感兴趣的客户列表将来自其他地方，并且仅针对这部分客户，我们才提供流失概率或标记。\n\
  \n另一点是，即使模型为每个人分配了流失概率，营销预算也可能只用于对小部分客户进行互动，以防止他们流失。在这种情况下，我们只需要前 n 百比的客户及其流失概率。\n\
  \n## 总结\n\n上述两个示例只是为了强调，即使在机器学习模型部署之后，仍然需要开展工作来利用结果。这可以简单到只需将概率分转换为 `YES` 或 `NO`\
  \ 值，或找到前 n 条记录，也可以复杂到为单个实体（如客户或产品）合并来自多个机器学习模型的结果。\n\n最重要的一点是消费步骤的输出，因为这是业务决策者可以直接消费的内容。如前所述，部署模型的输出有时可以被业务直接消费，或者需要对部署模型的输出进行一些处理后才能被消费。\n\
  \n![](img/image-cpavhd8n.jpg) 图 3.4：消费概览\n\n消费是业务用例的最后一步，它可以由一个或多个数据科学用例组成。决策者消费消费输出，尽管为了让他们有信心地做出决策，模型应该给出可接受的结果。不应该出现这种情况：模型部署时结果良好，但之后没人去检查其在持续数据上的性能。这可能会导致财务方面的巨大损失，甚至损害组织的信誉。部署的模型需要持续地评估、重新训练，并在必要时重新部署。我们将在下一节中讨论部署模型的评估和监控。\n\
  \n\n\n\n\n## 评估与监控\n\n对部署的机器学习模型进行持续评估并监控其性能是否出现剧烈下降是一个重要的步骤。这让决策者有信心认为，基于机器学习模型的任何决策都是可靠的，因为它们经过了定期验证。评估和监控并不直接贡献于业务用例，但它们是机器学习生命周期中为终端提供的审计和建立信任的基石。\n\
  \n对模型进行持续评估取决于建模技术以及在部署时用于确定性能的 KPI。相同的 KPI 将会成为评估的一部分。对于监控目的，有多种方法可以实现这一过程。可以通过自动化邮件、使用\
  \ `CI/CD` 中的工具或通过报告工具来实现。其核心思想是使用新数据定期更新模型性能，并将其发布给终端用户。\n\n## 案例\n\n举例来说，假设你解决了一个二分类问题，即判断访问商店的人是否会购买汽车。在创建机器学习模型时，假设我们决定使用\
  \ `AUC` 和 `Recall`（召回率）作为确定模型标准的 KPI。\n\n我们需要检查的另一个重要点是访问商店的人中有百分之几转化成了客户。我们可以选取多个时间段并发现任何趋势。其核心思想是获得一个范围估计，例如，访问商店的总人数中有\
  \ 10-15% 转化成了客户。\n\n现在，有了这些数据，一旦模型部署且结果被消耗，我们需要定义一个流程，按照预定义的频率将模型对历史评分的数据与实际结果进行比较。下一步是计算相同的\
  \ KPI（即 `AUC` 和 `Recall`），通过比较当前性能与部署时的性能来衡量表现。另一个需要检查的重要步骤是商店访客转化为客户的百分比。这将让我们总体了解目标群体行为是否发生了任何变化。如果此信息与历史偏差和定义的截断值一致，则该模型是可以接受的；否则，我们需要重新训练机器学习模型。\n\
  \n## 模型衰减\n\n模型衰减由于多种原因引起，而且业务端并不总是能及时识别这些变化。由于这个原因，持续评估和监控变得非常重要。通常被认为是好事的因素，可能会对某人的业务产生非常负面的影响，反之亦然。\n\
  \n举个例子，假设你卖汽车，你的汽车满足低端财务市场客户的需求。现在，如果国家经济繁荣，这是一件好事，但客户可能会想要购买更昂贵且提供额外福利的汽车。除非不断进化，这将对你的业务产生负面影响。这正是人们通过数据寻找的信息，但它并不是一项一次性的工作。它需要持续进行以掌握局面，而且人们需要理解数据是由过程生成的，而该过程会随着时间的推移而改变。及时识别过程中的任何变化是持续评估和监控的目标。\n\
  \n## 引入 MLOps\n\n基于持续评估和监控的反馈循环，下一步可能是使用新数据重新训练模型，或者完全用新的模型和用例替换旧的。如果需要使用新数据重新训练，我们不希望从头开始重复整个过程，而是希望利用第一次解决该问题时所积累的经验和流程。\n\
  \n此外，我们希望随时间跟踪解决用例过程中所做的所有更改，包括数据。这就是 `MLOps` 登场的地方。`MLOps` 由实践和工具组成，有助于模型从训练无缝迁移到消费。它还包含了持续监控机器学习模型的规定，并维护数据、代码和产物的版本，以供审计和未来分析之用。我们将在下一节中详细讨论\
  \ `MLOps`。\n\n\n\n\n\n## MLOps\n\nMLOps 代表机器学习运维（Machine Learning Operations），与典型软件开发中的\
  \ DevOps 一致。然而，与 DevOps 不同，在 MLOps 中除了代码外还有很多需要关注的内容，且 KPI（关键指标）不仅限于软件，每个问题都有自己的一套\
  \ KPI。\n\nMLOps 作为一个流程始于 EDA（探索性数据分析）之后。EDA 本质上更具实验性，因此为其建立流程具有挑战性。然而，在 EDA 之后，一切都应该遵循流程，并确保在需要时可以追溯和重复。MLOps\
  \ 应该实现的另一个重要点是从模型训练到模型消耗的无缝流程。评估和监控也 MLOps 的一部分。总而言之，除了 EDA 外，机器学习用例的所有其他方面都应该是\
  \ MLOps 的组成。\n\n## 可复现性和数据管理\n\n为了模型的可复现性，我们需要训练模型时的数据。在大数据时代，这些文件可能非常巨大，无法以类似于代码的方式存储。为此，我们需要一种独立的机制，可以通过多种方式实现。\n\
  \n一种方法是将模型存储在中央仓库的文件夹中，采用类似于 `UseCase/Version/datafile` 的文件夹结构，并确保用于部署模型的脚本会移动该文件夹中的相关数据。同时，通过\
  \ `DVC` 等工具，这一过程变得非常简单，`DVC` 通过提供存储训练模型所用数据的元数据和位置详细信息的文件，扩展了 `Git` 的功能。重要的是建立一套流程，使得任何移动用于部署的模型及其相关数据都可以进行版本控制和跟踪。使用工具的选择完全取决于需求和可用性。\n\
  \n## 产物与标准化\n\n在建立 MLOps 流程时，我们需要确保生成的任何产物、二进制文件或图表都被存储并进行版本控制。通常，会保存模型二进制文件和图表；但如果你对变量进行了任何标准化或不依赖于代码的处理，这些产物也需要被存储。\n\
  \n例如，假设你正在使用均值和标准差对模型训练的所有连续变量进行归一化。由于新数据需要使用旧值进行归一化，我们需要存储这些值。一种方法是使用某些内置库，它会生成一个以后使用的二进制文件。这样，除了模型本身，还会生成许多小产物。它们也需要相应的存储和利用。根据数据保存和存储的方式，这些产物可以遵循相同的流程。为了跟踪目的，有一些可用的工具，如\
  \ `MLFlow`，它提供了一个仪表板，显示训练模型及其元数据的信息。\n\n## 代码管理与部署流水线\n\n对于训练、测试、部署和消费，大部分工作通过代码完成。代码需要进行版本控制，但这并不是挑战，因为这种情况已经持续很长时间了，并且有很多工具可以实现，其中\
  \ `Git` 是最流行的。在维护代码时需要注意的几点包括将其与其生成的任何产物连接起来，例如之前讨论的 `docker` 镜像等。实现这一点的方法是将 `git\
  \ commit id` 附加到产物上，该 ID 被分配给生成产物的代码。重要的是建立一套流程，以便一切都可以追溯和复现。在我们说话时，可能某些工具会让你的任务变得更简单；你只需要确保知道需要的所有内容。\n\
  \n与自动化测试用例并据此移动代码到更高环境的典型软件不同，在机器学习世界，一切都发生在生产数据上。可以有一个独立的环境来提供生产数据，以便在不干扰生产环境的情况下在生产数据上进行实验。由于所有操作都在生产数据上进行，将代码移动到更高环境的概念仅供参考。在机器学习部署中，从开发移动到生产环境的是模型二进制文件和任何其他相关数据处理二进制文件。\n\
  \n消费部分是运行在生产环境中，利用作为部署一部分移动的所有产物。训练机器学习模型在资源方面可能是一项昂贵的事，有时会在开发和部署之间插入一个中间步骤以便更多控制。这一步骤可以称为训练或阶段阶段（staging）。图\
  \ 3.5 显示了从模型训练到部署的步骤，这可以用于建立你的流程，如下：\n\n![](img/image-f6d1vmzp.jpg)\n图 3.5：多阶段训练部署\n\
  \n## 结论\n\n总体而言，MLOps 流程的建立方式应该使其能够实现可复现性，同时让整个机器学习生命周期尽可能顺畅。我们还需要注意机器学习生命周期中的某些地方（例如解释\
  \ KPI，即模型训练和测试的输出），这些地方需要手动解释，且流程和工具的选择应该能够支持人工干预。\n\n例如，对于某组问题，`AUC` 达到 0.7 是好的，模型可以部署并消费。同样，另一个具有相同\
  \ `AUC` 的问题可能还没有好到可以部署。这可能有多个原因，这些问题需要通过推理和逻辑手动解决。流程应该为此留出空间，因为这些推理将发生在不同的利益相关者之间，但一旦完成批准或拒绝，后续步骤就可以顺畅且清晰。在实现\
  \ MLOps 的工具方面有很多进展；但深入理解机器学习生命周期可以让你设计出更好的流程。\n\nMLOps 别重要的另一个方面是机器学习模型的重新训练。我们不希望对于已经生产化的用例从头开始。重新开始将减慢整个过程，并且可能在模型到达生产环境时它已经过时了。因此，整个过程应该仔细设计并实施，以满足本节中讨论的所有要求。图\
  \ 3.6 显示了实现整个端到端 MLOps 流程的一种方法；然而，这些工具可以根据选择和可用性进行更改，如下：\n\n![](img/image-p4yiwcxi.jpg)\n\
  图 3.6：带有技术栈的 MLOps 概述\n\n如前一图所示，我们强调了一个具有工具支持的端到端 MLOps 流程。我们将如下讨论所有组件及其用途：\n\n\
  - 用于训练和验证模型的数据\n- 用于执行任务的代码\n- `GitHub` 用于版本维护和 CI/CD 过程\n- `DVC` 版本用于维护所有实验的数据版本\n\
  - `ML Training`，批准后进行训练，例如 `GCP AI Platform`、`Kubernetes cluster` 或 `Spark engine`\
  \ 等\n- 用于突出模型性能的 KPI，`CML` 与 `Git` 集成通过 `Git` 显示 KPI\n- 批准后，部署模型供消费\n- 部署的模型元数据，如某些表中的版本号、数据位置等。这些信息可以用于审计和可复现性。\n\
  \n批准流程和所有步骤可以使用 `GitHub Actions` 进行 CI/CD 自动化，包括审批。此外，如提到的，这些工具仅供参考，可以根据可用性进行更改。\n\
  \n\n\n\n\n## 结论\n\n在前两章中，我们涵盖了成功完成数据科学项目所需的所有逻辑步骤。在本章中，我们讨论了组织内部为了成功实施和实践数据科学应该具备的所有技术栈和框架。我们涵盖了可以作为\
  \ `ML framework` 中每个功能组成部分的工具。本章的思想是强调一个通用框架，并提供能够实现 `ML lifecycle` 中所有步骤的无缝数据科学流水线的功能。我们在本章中强调的工具只是市场上现有众多工具之一。同时，新工具正飞快地涌入市场，因此人们需要掌握良好的信息，但如果你了解自己所需的功能，寻找工具并不是困难的。核心在于理解\
  \ `ML lifecycle` 所需的功能，然后选择以最佳可能的方式来实现每项功能。\n\n现在，我们已经涵盖了 `ML framework` 的每个组件以及在数据科学项目中需要完成的所有单独任务和功能，我们将学习每个孤立任务的细节。在下一章中，我们将从\
  \ `EDA` 开始，并根据用例查看如何进行 `EDA`。\n\n## 注意事项\n\n- `ML Framework` 应该支持 `ML lifecycle`\
  \ 的每一个阶段。\n- `EDA` 不属于 `MLOps`，但 `ML Lifecycle` 中的其他所有内容都应该通过 `MLOps` 完成。\n- `ML`\
  \ 推荐使用云，因为它可以处理大量的临时基础设施需求，从而优化成本和时间。\n- `ML Lifecycle` 中每一步的可复现性和可追溯性是关键。`MLOps`\
  \ 过程应该实现这两者。\n- `ML framework` 应该能够针对新数据的训练和预测进行扩展。\n- 对模型进行持续评估是必要的，以便主动监控模型在数据数据上的性能。这也有助于增强用户对模型输出的信心。\n\
  - `ML Framework` 应该能够同时处理实时数据和批量数据。\n\n## 多选题\n\n1. **云端如何帮助 EDA？选择所有适用选项。**\n \
