  - d\n- d\n\n## 关键术语\n\n- 使 `ML lifecycle` 运行的过程，包括自动化和可复现性。\n- 数据版本控制，结合 `Git` 用于数据版本的维护。\n\
  - 持续机器学习，结合 `Git` 将功能扩展到在 `GitHub`/Gitlab` 上显示 KPI 和图表。\n\n## 参考文献\n\nhttps://www.featurestore.org/\n\
  \n# 第 4 章：数据探索与业务问题量化\n\n在之前的章节中，我们讨论了在组织内成功实施 `ML practice` 所需的功能性和技术需求。在本章中，我们将深入细节，并讨论、定义以及将业务问题转换为数据问题。为此，我们将创建一个假设的业务问题并使用公共数据集。我们将处理数据并从\
  \ `EDA` 开始，在此过程中，我们将用 `Python` 代码涵盖 `EDA` 的几个方面。我们还将学习如何突出发现并与利益相关者沟通这些发现。在量化业务问题后，我们将尝试一些\
  \ `ML algorithms`，以获得性能的感觉并定义前进的方法。本章将包含 `Python` 编码，但我们也会解释输出以及如何推断输出。\n\n## 结构\n\
  \n在本章中，我们将涵盖以下主题：\n- 概述\n- 业务问题和数据集\n- `EDA`\n- 特征工程\n- 基准模型\n- `EDA` 结果沟通\n\n##\
  \ 目标\n\n学习本章后，你将能够根据所有可用数据查看业务问题，并将业务问题量化为数据问题。在这个过程中，我们将对数据进行 `EDA` 并查看 `EDA` 的几个方面。`EDA`\
  \ 在很大程度上取决于手头的问题和数据，也取决于执行任务的个人。`EDA` 还能适应利益相关者提出的许多临时问题，因此是一个非常广泛的过程。我们在这里的目标只是提供关于如何进行操作的想法，以及\
  \ `EDA` 中包含哪些思考。`EDA` 涵盖了大量的可视化，以便数据易于理解。为了这个目的，我们将详细说明一些图表并展示如何解释它们。\n\n\n\n\n\n\
  ## 概述\n\n我们涵盖了机器学习（ML）生命周期中所有的端到端任务。现在，在本章中，我们将深入探讨 `EDA`，其目标是理解手头的数据，检查其质量，并在此此的基础上为当前的业务问题提供定性和定量的见解。定性方面涵盖数据质量，简单来说，它调查了可用数据的质量是否足以解决当前的问题。定量见解通常涉及可用数据的数据量，以及在可接受的阈值内，这些数据是否足以解决当前的业务问题。我们将研究这这两个方面，并针对这些质量问题提供某些标准指南。正如上一章所讨论的，`EDA`\
  \ 是确定业务问题后机器学习生命周期中的第一步。在进行 `EDA` 之前确定业务问题是一个先决条件，因为根据业务问题的不同，相同的数据可以以不同的方式进行检查。例如，如果我们想识别数据中的客户模式，我们将以客户为中心查看交易历史；如果我们想查看数据中的关联互补产品，我们将再次查看交易历史，但这次是以产品为中心，并尝试寻找产品之间的关系。在进行\
  \ `EDA` 时，可以从多个角度查看同一份数据，因此，在进入 `EDA` 之前，确定业务问题是最重要的一步。为了展示 `EDA` 的示例，我们将在下一节讨论一个业务问题并定义最终问题。在现实场景中，定义业务问题可能花费大量时间，并经过多次迭代，可能涉及许多利益相关者（包括数据科学家）来确定业务问题。我们已经在第一章中涵盖了这一点。在接下来的章节中，我们将定义一个业务问题并讨论解决该问题的可用数据集。我们将使用一个公共数据集，该业务问题是为了是为了演示\
  \ `EDA` 而创建的。\n\n## 业务问题与数据集\n\n在本章中，我们将考虑一家零售商，它正试图利用数据解决以下业务问题：\n- 供应商希望每周预测其每家商店的预计销售额。\n\
  - 供应商希望了解假期对销售是否有任何影响。\n\n为了解决这个问题，我们有三个可用数据集——`Store Details`、`Store` 和 `Sales\
  \ Data`。\n\n第一个数据集是 `Store Details`，它包含了商店的物理属性；表 4.1 突出了它包含的信息，如下所示：\n\n**表 4.1：商店详情\
  \ (Store Details)**\n\n第二个数据集是 `Store`，它包含了周层面的特征（如油价等），如下所示：\n\n**表 4.2：商店特征 (Store\
  \ Features)**\n\n第三个数据集是周层面的 `Sales Data`，如下所示：\n\n**表 4.3：销售数据 (Sales Data)**\n\
  \n我们将考虑这些数据和业务案例作为示例，以突出 `EDA` 中的某些内容。然而，正如之前提到的，取决于数据和业务问题，`EDA` 可能会有很大差异，本章中讨论的细节和步骤应作为参考，数据科学家应在此基础上进一步构建。我们将看到几张图表并学习如何解释这些图表。所有的代码都在\
  \ `Python` 中完成，数据和 `Jupyter notebook` 将通过 `GitHub` 分享。你可以使用该笔记本进行实手操作练习并尝试新事物。\n\
  \n## 探索性数据分析 (EDA)\n\n我们将开始 `EDA`，第一步是合并所有数据以创建一个用于分析的基础表。为了创建基础表，我们将销售数据与商店特征以及商店详情结合起来。如图所示，后续的命令帮助我们在\
  \ `Python` 中实现这一目标：\n\n```\n![](img/image-p6sb1h96.jpg) \n```\n图 4.1：示例代码 Jupyter\
  \ Notebook\n\n这是我们在 `Python` 中完成的第一步，因此我们在这里通过截图解释了细节，但从这一点开始，读者应该参考 `Jupyter notebook`\
  \ 来查看代码。我们在这里只分享关键发现和输出产物（如图表）。\n\n在第一行中，我们导入了一些库——`Pandas` 是一个用于分析表格数据的流行 `Python`\
  \ 库，而 `OS` 允许从 `Python` 执行操作系统命令。`Matplotlib` 是一个流行的数据可视化库。我们更改了目录，将工作目录设置为存放原始数据的文件夹。下一步是读取三个数据集并查看数据的前几行，只需查看其内容。我们提到了列的细节、商店特征以及基于商店号和周末日期合并的销售数据。接着，根据商店号，将商店数据与特征和销售生成的中间数据合并。这创建了我们的基础表，我们将利用这些数据进行进一步分析以解决当前的业务问题。创建基础表是一项大任务，因为你在细粒度上拥有了所有相关列，从这里你可以开始为问题探索并创建特征。\n\
  \n现在我们已经创建了基础表，我们将探索数据。数据可用的时间跨度从 2017 年 3 月 2 日到 2019 年 10 月 25 日。我们想检查销售额随时间是否存在趋势。为此，我们将汇总所有商店的销售额，查看是否存在任何趋势。图\
  \ 4.2 显示了图表（折线图），如下所示：\n\n```\n![](img/image-62jp5tzj.jpg)\n```\n图 4.2：折线图\n\n我们可以看到，数据中没有明显的趋势；但存在季节性，在\
  \ 2017-2018 年和 2018-2019 年的 11 月至次年 1 月出现高峰。这表明同比数据没有趋势，但季节性是一个考虑考虑因素。\n\n我们将研究分析数值数据、分类数据以及组合分析，以得出见解。在接下来的章节中，对于每种类型的数据，我们将讨论相关的图表，使数据科学家能够视觉化地讲述他们的故事。\n\
  \n\n\n\n\n## 数值数据分析\n\n对于数值数据分析，我们将利用几类标准图表，并对它们进行详细讨论。在继续之前，我们想查询数据集中是否存在缺失数据。为此，我们必须运行命令并获得以下输出，如图\
  \ 4.3 所示：\n\n![](img/image-qci73c7p.jpg) \n图 4.3: 空值检查\n\n如我们所见，数据中没有缺失值；然而，大多数情况下并非如此。缺失数据插补本身是一个非常广泛的主题，在进入\
  \ `ML` 模型阶段之前我们需要处理这些数据。首先，我们将研究单变量分析，然后研究双变量分析。\n\n## 直方图\n\n直方图通过将数值变量按数值范围进行分箱（binning\
  \ or bucketing）来绘制频率分布。它是可视化数据分布并判断数据是否倾斜的一种极好方法。对于基础表中所有的数值变量，直方图所示：\n\n![](img/image-t9h79qnj.jpg)\
  \ \n图 4.4: 直方图\n\n从前述图表中得出的一些重要且可见的见解如下：\n\n* `CPI` 在 `145` 到 `175` 之间没有任何值。\n*\
  \ 每周销售额右右偏，数值在 `0` 到 `100000` 之间，涵盖了大部分数据。\n* 温度几乎呈正态分布。\n* 这些是数据科学家在制定假设时可以利用的若干见解。\n\
  \n## 箱线图\n\n箱线图是探索数值数据的另一种方式。直方图根据中心点的均值或平均值显示数据分布，而箱线图以中位数为中心。它根据四分位数范围将数据一分为二。图\
  \ 4.5 突出了 `Temperature` 列的箱线图，如下：\n\n![](img/image-qe09ttuo.jpg) \n图 4.5: 箱线图\n\n\
  `q1` 以下的值是底部 25% 的值，`q3` 以上的值是顶部 25% 的值。`q3` 和 `q1` 之间的值是中间 50% 的值。四分位距（`IQR`）可用于计算须线，上限为\
  \ `q3+1.5*(IQR)`，下限为 `q1-1.5*(IQR)`。`IQR` 等于 `q3-q1`，其中 `q3` 是上四分位数，`q2` 是中位数或第二四分位数，`q1`\
  \ 是第一四分位数。须线之外的任何值都被视为异常值。异常值是一个广泛的话，有多种方法可以探索它们，包括业务经验。在进行 `EDA` 时也应确定异常值的处理方法，箱线图提供了观察数值数据的一种非常简单的方法。\n\
  \n## 热力图\n\n当需要突出高温时，热力图是分析数据范围而非精确值的很好的方法。突出相关性图的一个重要用途如图 4.6 所示：\n\n![](img/image-qaex0f0v.jpg)\
  \ \n图 4.6: 热力图\n\n## 分类数据分析\n\n如我们所见，热力图分别用黄色到蓝色表示从最低到最高。\n\n## 柱状图\n\n可以对分类数据在每个类别中的计数进行可视化。`Bar\
  \ chart` 显示了 `IsHoliday` 变量，如图 4.7 所示。\n\n![](img/image-evr63.jpg) \n图 4.7: 柱状图\n\
  \n## 饼图\n\n饼图是表示数据的另一种方式；但在基数（cardinality）较高时并不建议使用。可视化数据的方法应该始终保持尽可能简单，否则会变得模糊。\n\
  \n![](img/image-efixkkfs.jpg) \n图 4.8: 饼图\n\n## 双变量/多变量分析\n\n到目前，我们只看到了单变量的图。现在，我们将讨论一些可以处理两个或三个变量的图。\n\
  \n## 散点图\n\n为了在同一图中显示两个数值变量并观察是否存在任何关系，我们使用 `scatterplot`。图 4.9 突出了 `Size` 和 `Weekly`：\n\
  \n![](img/image-fzymdt2.jpg) \n图 4.9: 散点图\n\n如我们所见，没有可见的关系，没有任何列是相关的。散点图有时可以突出非线性关系，而这种关系无法从\
  \ `heatmap` 中推断出来的。\n\n## 簇箱线图\n\n簇箱线图与箱线图类似，但图根据某些分类列进行了划分。我们在图中按 `Type` 查看了 `Size`，其中\
  \ `Size` 是数值型的，`Type` 是分类型的：\n\n![](img/image-enc7v26.jpg) \n图 4.10: 簇箱线图\n\n很明显可见，`A`\
  \ 商店尺寸最大，`C` 商店最小，`B` 处于中间。有趣的是，`A` 中有一个异常值。\n\n## 堆叠柱状图\n\n当我们想要分析两个分类变量时，利用堆叠柱状图。图\
  \ 4.11 显示了 `Type` 和 `IsHoliday`：\n\n![](img/image-pf2jj15c.jpg) \n图 4.11: 堆叠柱状图\n\
  \n我们可以看到，所有商店的 `IsHoliday` 计数都很低，这与整体 `IsHoliday` 计数一致。这种图表应仅用于两个或三个堆叠类别，否则会导致歧义。\n\
  \n## 跨类别的折线图\n\n折线图可用于观察趋势，如之前的图 4.2 所示。同样，我们可以看到跨类别的趋势，如图 4.12 所示：\n\n![](img/image-r7ju0lbf.jpg)\
  \ \n图 4.12: 跨类别的折线图\n\n如图所示，商店类型并没有季节性。前述图表涵盖了探索数据的大多数基础方法。许多其他花哨图表和包可以用于数据可视化，这些应该在本文展示的图之外进行探索。\n\
  \n\n\n\n\n## 特征工程\n\n一旦我们通过探索理解了数据，就需要创建一个基准模型（baseline model），以查看可用数据在解决定义问题方面表现如何。我们在前一节中已经定义了问题陈述，现在需要回答这些问题。为了完成第一个任务即预测销售额，我们需要创建一个机器学习（ML）模型。为此，我们需要从可用数据中构建特征，这将增强模型的预测能力。\n\
  \n我们需要从类别变量中创建数值型变量。之后，我们将创建一个基于时间的特征，这可能帮助模型识别季节性趋势。\n\n我们将执行上述步骤；然而，特征工程是一个非常广泛的话题，用户对业务的理解越深，就越能从中挖掘出越好的特征。此外，再次强调一下，我们只能使用现有数据来预测未来。在我们的数据中，`Fuel`（燃料）和\
  \ `Unemployment`（失业率）是随时间变化的特征，除非它们是来自预测这些变量第三方输出，或者我们有独立的内部机器学习模型来预测这些变量，否则我们无法使用它们。原因是这些值无法提前获取并用于\
  \ `Sales`（销售额）。为了简单起见，我们将假设数据来自第三方输出，因此我们可以使用这些特征。\n\n我们将在下一节中讨论几种建模技术。这些是在不进行任何超参数调优的情况下运行的基础模型，旨在了解模型性能以及哪些模型更适用于可用数据。\n\
  \n## 基准机器学习模型\n\n基准机器学习模型的想法是尝试多种技术，并找到最适合数据的特征集和机器学习算法。这一步获得的信息有助于根据结果和训练时间等其他参数从许多可用算法中选择出一个子集。这种方法不适用于深度学习模型（除非进行迁移学习），因为它们有自己的挑战，并且需要一次性训练。但在图像处理和自然语言处理（NLP）任务等深度学习任务之外，这种方法适用于所有的传统机器学习问题。\n\
  \n我们将尝试两种建模技术——一个是简单的线性回归，另一个是基于树的 `Random Forest`（随机森林）算法。模型性能的细节将在笔记本中共享，最终结论将在接下来的节中分享。机器学习模型的创建是一项计算密集型任务，我们将使用非常小的数据集，因此可以在本地机器/笔记本上完成。如果数据量很大，我们需要利用云环境并启动高计算虚拟机或笔记本实例（取决于可用性）。有些组织在内部完成所有工作；在这种情况下，你拥有一台强大的内部机器或私有云环境，这在金融机构中非常流行。\n\
  \n在下一节中，我们将讨论 EDA（探索性数据分析）的结果，并学习如何沟通关键洞察。这是一项重要任务，因为所有的努力最终归结于你如何向关键利益相关者解释这些洞察。正如我们提到的，这没有单一的最佳路径；然而，我们将在下一节中沟通结果时分享几个关键要点。\n\
  \n## EDA 结果沟通\n\n在 EDA 之后沟通洞察时，最重要的点是理解你演示的受众。如果观众来自业务部门，尽量避免任何技术术语，并用简单的业务语言进行解释。当然，由于利益相关者的好奇心或没有简单的方法，某些方面可能会变得复杂，但这应该深思熟虑，因为这是你说服业务部门整个过程用途的地方。从模型进入生产以及业务消耗输出来看，这可能是最重要的一步。\n\
  \n在向业务/利益相关者沟通结果时，需要记住的几个要点如下：\n\n- 始终用简单的业务语言沟通结果，并在被询问细节时准备好数据和 KPI（关键绩效指标）。\n\
  - 从业务决策和洞察的角度解释 KPI 的影响。\n- 用有意义的可视化支持洞察，这能补充你的洞察并易于理解。\n- 提供一些有助于提高业务性能的可执行任务。\n\
  - 与业务部门提出与洞察相关的问题，以检查数据是否具有群体代表性。\n- 尝试将 KPI 与美元价值、运营效率联系起来。\n\n我们将分享 EDA 的洞察；我们遵循了前面提到的原则。可以根据你的业务问题进行参考。\n\
  \n## 关键洞察与结果\n\n我们对带有商店信息的销售数据以及与区域相关的额外数据进行了分析，发现如下：\n\n- 分析了涵盖 81 个部门的 45 家商店、时间跨度不足两年的数据，用于预测每周销售额。\n\
  - 使用商店属性——规模和类型——以及商店所在区域的外部数据，以检查它们对预测销售额是否有贡献。\n- 数据中存在季节性模式，假期（即 11 月到次年 1 月）销售额激增。\n\
  - 销售额与商店规模有关，尽管 A 和 B 类商店的平均部门数量相似。\n- 模型的第一个版本可以解释销售额 41% 的方差，这是不错的，结果在调优模型后将会提高。\n\
  - 周假日和大型商店规模会导致更多销售，而高油价和高失业率对销售额有负面影响。\n\n图 4.13 显示了这些趋势，如下所示：\n\n![](img/image-2gzr1idf.jpg)\n\
  \n图 4.13：部分图\n\n这些是可以提供的一些洞察；但如果有人需要更多细节并想知道这些洞察是如何得出的，可以深入研究技术细节。经常出现的一个问题是，为什么没有\
  \ 100% 的准确率，或者为什么只捕捉到了 41% 的方差。我们需要解释，对于机器学习模型；总是存在某些不确定性，我们无法捕捉所有影响目标变量（在本例中为 `Weekly\
  \ sales`）的因素。因此，我们必须接受从中能得到的最好的，并看看它是否足够业务消耗。\n\n现在，我们涵盖了 EDA 的几个方面，并对展示结果给出了一些建议。这涵盖了本章想要涵盖的所有内容。在下一章中，我们将开始学习训练和完善模型，同时学习如何跟踪所有实验，这些实验可以由不同的数据集、不同的机器学习算法或两者共同组成。\n\
  \n\n\n\n\n## 结论\n\n在本章中，我们亲手处理了数据并理解了数据。我们研究了探索不同类型变量和不同图表的方法，以及如何解释它们。最后，我们研究了如何压缩重要的信息和洞察，并将其传递给利益相关者。我们需要记住，并不是所有的可视化和洞察对利益相关者来说都有用且符合他们的兴趣。我们涉及了在向业务部门传递结果时需要注意的所有事项。在下一章中，我们将更深入地讨论模型训练细节，并学习如何跟踪实验，以便将最终模型部署到生产环境中。\n\
  \n## 需要记忆的点\n\n- `EDA`（&mdash;探索性数据分析）在业务问题确定后开始。\n- 数据可视化应该是简单且易于理解的。\n- 从 `EDA`\
  \ 中产生的所有洞察可能对业务没有用。对洞察进行优先级排序至关重要，否则可能会导致信息过载。\n- 在传达洞察时应考虑到业务问题和实用性；这可能会引发业务部门的进一步查询并提供价值的输入。\n\
