- "# 机器学习流水线运营化：使用 MLOps 构建可复用且可重复的机器学习流水线构建指南\n\n\n\n\n\n\n\n# 前言\n种瓜有得豆。我们是自己命运的创造者。无人可以指责，无人可以赞扬。——斯瓦米·维韦坎达（Swami\
  \ Vivekananda）。\n\n学习是一个永无止境的过程。这是一个 360 度的圆，通过它你可以练习并增强你的技能。这是一个学习 -> 实施 -> 分析\
  \ -> 修复的过程。有时，我们也可以将其称为生命的七色（不是彩虹）。所有颜色都吸引我们去实现梦想。这本书将推动你向前迈一步以实现你的梦想。\n\n这是我们的大脑，它告诉我们“juggle”（这里指上述段落）的含义。通常情况下，遵循两种类型大脑的可能性：第一种，可以评估类似于上述段落的单词含义；第二种，无法评估或难以评估。\n\
  \n如果你属于第一类，必须阅读这本书；如果你属于第二类，那么也必须阅读这本书。现在，从这一页的第一行开始阅读，直到第一个段落结束。你可能会重复阅读两次、三次或更多次，但在每一个阅读周期中，你会发现自己正在理解“juggle”（杂耍/衔接）的真实含义。一旦你这样做了，在每个阅读周期中，你的大脑都在自我准备，这样当你尝试回忆其含义时，你的大脑就会告诉你。这就是我们所说的训练模型（Train-the-model）。这里模型可以是任何对象（在我们的案例中是大脑）。这就是机器学习所指的内容。\n\
  \n我确信，你正在微笑并认为机器学习如此简单。是的，这就是这本书的魅力所在，也是它付出的努力所在。\n\n（注：原文在前言/关于作者部分包含大量的重复性短语和无意义的句子，根据指令，这些内容已予以保留，未对作者提供的去文本语义或核心内容进行修改。）\n\
  \n## 关于作者\n**Vishajyoti** 是一位数据专业人士，在 BI、数据仓库、机器学习和数据科学等数据解决方案方面拥有 15 年经验。他曾在零售、银行、能源、物联网和制造业等行业工作，为不同地区的客户提供服务。他在许多组织中实施了企业级的机器学习实践，并解决了各种用例，为他们的业务带来了积极影响。Vishajyoti\
  \ 还为兴趣学习和增强数据科学技能的专业人士提供培训和指导。他拥有 `Python`、`R`、`SQL` 等语言以及多种数据库的经验。他还不同的云供应商上实施了解决方案。他毕业于\
  \ NIT Nagpur (VNIT)，获得理工学学位，并在根特大学获得分析硕士学位。\n\n**Shaleen** 是一位数据科学家，在零售、旅游与酒店以及医疗保健等行业垂直拥有\
  \ 4 年的专业和研究经验。他还在知名期刊上发表了三篇关于音乐自动标记和医学图像分割的研究论文。Shaleen 拥有使用 `Python`、`C++`、`Javascript`\
  \ 和 `Swift` 以及多种 `SQL` 和 `NoSQL` 数据库的经验。他毕业于 BITS Pilani 迪拜校区，获得计算机科学学士学位。\n\n##\
  \ 关于评审员\n**Mohit Sharma** 是一位数据科学领者，在数据科学和应用机器学习领域拥有十多年的经验。他曾在面向北美、欧洲、拉美和东南亚市场的银行与金融、快消品、电信和电子商务行业工作。他开发了分析产品，并为各种客户提供分析服务解决方案。Mohit\
  \ 还是一名数据科学培训师，不断帮助印度的分析社区。他在 `R`、`Python`、`SAS`方面拥有丰富的实践经验，并对各种机器学习算法有深入理解。他毕业于德里理工学院（IIT\
  \ Delhi），并在比利时根特大学获得分析硕士学位。\n\n## 致谢\n这本书的完成是许多人支持的结果。Shaleen 和我想借此机会对他们提供的的支持表示感谢。我们要感谢\
  \ Mohit 在本书评审期间提供的宝贵见解。我们还感谢数据社区中多年来影响了我们这段旅程的每一个人。最后，我们要感谢 BPB Publications 的 Nrip，为我们提供了写第一本书的机会。\n\
  \n\n\n\n\n# 前言\n\n构建准确的机器学习模型是一项巨大的挑战。而让机器学习模型产生业务价值则更具挑战性。大多数机器学习模型仅停留在实验阶段，从未进入生产环境。这可能是由于规划不当、缺乏技术专长以及数据科学家与软件工程师之间的脱节等原因造成的。因此，拥有一套有助于解决这些问题的流程是非常关重要的。\n\
  \nMLOps 是一套用于高效部署和监控机器学习模型的实践方法，它将帮助解决机器学习项目过程中面临的许多技术挑战。但拥有正确的团队以及恰当的业务计划对于项目的成功也至关重要。本书将作为机器学习项目在技术和组织两个方面的介绍和指南。\n\
  \n## 本书的结构\n\n本书分为两个部分。第一部分介绍了机器学习项目的组织和业务方面。这包括诸如：组建合适的团队、定义和验证想法及业务计划、探索性数据分析以及机器学习生命周期等主题。第二部分讨论了机器学习项目运行化的技术方面。你将学习如何以可靠且高效的方式训练、部署和监控机器学习模型。\n\
  \n## 如何使用本书\n\n建议按照书中的顺序从头到尾阅读。你还应该尝试运行代码示例，以更好地理解构建稳健机器学习系统所涉及的流程。\n\n## 代码包与彩色图片\n\
