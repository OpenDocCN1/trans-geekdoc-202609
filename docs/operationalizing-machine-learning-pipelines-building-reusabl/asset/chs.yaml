  数据离均值的程度，标准差的平方。\n\n## 参考文献\n\n代码与数据 - `https://github.com/MLBook-VJ/EDA`\n\n# 第\
  \ 5 章训练与测试 ML 模型 – 第一部分\n\n在上一章中，我们讨论了 `EDA` 以及从 `EDA` 中产生的洞察，以及如何传达这些洞察。在 `EDA`\
  \ 完成后，如果结果是积极，我们将开始训练模型并验证其性能。我们将讨论为什么以及如何模型训练与 `EDA` 分离开来，尽管我们在 `EDA` 期间已经训练了一个模型。我们还将探索模型训练的挑战，如硬件要求、数据版本控制和实验细节。本章还将重点介绍为什么云平台更适合大规模模型训练。我们将通过两组不同的问题进行训练实践，以强调训练模型的不同方式，即使用\
  \ `CPU` 和 `GPU` 进行训练。我们还将讨论在组织内部为大规模模型训练应启用什么样的基础设施。\n\n在本章中，我们将讨论技术细节，包括 `container`（容器）、`Kubernetes`（`K8s`）和\
  \ `Polyaxon`。`Polyaxon` 是一个构建在 `K8s` 之上的平台，用于构建、训练和监控大规模机器学习和深度学习项目。我们将利用 `Polyaxon`\
  \ 的社区版，它是开源的，可以安装在公司内部或云 `K8s` 集群上。我们将使用 `Google Cloud Platform` 作为我们的 `K8s` 集群。我们将在本章和下一章中涵盖\
  \ `Polyaxon` 的设置并理解 `Polyaxon` 平台。我们将在下一章涵盖训练内容，这是本章的延续。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n\
  - 概述\n- `Container`\n- `Kubernetes`\n- `GCP`\n- `Polyaxon`\n- `Polyaxon setup`\n\
  \n## 目标\n\n学习本章后，你将能够利用 `EDA` 结果来训练模型，并开发一种用于机器学习模型训练大规模实验的机制。我们将讨论拥有灵活基础设施的必要性，以便数据科学家以成本优化的方式进行实验和训练模型，而无需过多考虑基础设施的限制。我们将使用\
  \ `Google` 作为云提供商，但如果有人想使用其他云供应商或内部 `K8s` 集群，我们将提供参考。`K8s` 的使用使得所有工作流容器化成为必然，我们将讨论容器化的优势。`Polyaxon`\
  \ 平台非常庞，我们将根据需要涵盖相关部分。如果想对自己的设置进行任何修改或增强，可以参考 `Polyaxon` 文档。\n\n## 概述\n\n如今组织拥有海量数据；他们希望利用数据做出更好的决策，优化流程，从而增加利润和价值。为了做到这一点，组织需要快速处理和分析数据。现在，在\
  \ `EDA` 之后，如果结果理想，我们将训练 ML 模型，当我们说模型时，考虑到的是整个组织范围内数百个或更多的规模。为了实现这一点，我们需要支持模型训练的基础设施。云平台更适合这种设置，因为它具有按需付费的特性，并能解决一次性的需求。此外，使用云比内部搭建可以节省大量的运营成本，但研究内部与云的损益超出了本书的范围。我们将在创建复用组件的背景下理解\
  \ `container`、`images` 以及 `Docker` 的作用。这将为大规模训练和构建可重复实验奠定第一个基石。\n\n\n\n\n\n## 在\
  \ Docker hub 上创建账户\n\n第一步是在 docker hub 上创建一个账户。这将用于将我们的镜像推送到 docker hub 并存储起来，以备以后参考。应用程序容器化的核心思想是让它在我们需要的任意数量环境中独立运行，而无需担心本地环境的设置。为了做到这一点，我们需要将镜像存储起来，以便方便地访问和引用。镜是容器的蓝图，因此，它们的存储和可用性非常重要，这正是\
  \ docker hub 的用途。你可以访问 `https://hub.docker.com/signup`，通过选择 docker id 和密码并提供邮箱 ID\
  \ 来注册。如果你是第一次注册，你将看到如图所示的屏幕：\n\n![](img/image-ny3lprcc.jpg) \n图 5.1: Docker 计划详情\n\
  \n你可以选择 Free（免费版）并继续，因为我们可以通过免费选项来涵盖学习方面的内容。你可能被要求点击 docker 发送的邮件中的链接来验证你的邮箱。请记住，docker\
  \ hub 提供的服务也由其他供应商提供，包括所有主要的云提供商。一旦成功登录并验证，我们暂时搁置 docker hub 的详细信息，将在后的章节和部分中使用登录信息。\n\
  \n## 在 PC 上安装 Docker desktop\n\nDocker desktop 是一个从你的桌面构建和共享容器的应用程序。Docker Desktop\
  \ 包含了 Docker CLI 客户端、Docker 和凭据工具。我们不会使用所有内容，但我们将利用 `docker CLI`。你需要根据你的操作系统下载 Mac\
  \ 或 Windows 版本。对于 Unix，它取决于你正在使用的 Unix 变体，支持的变体的详细步骤在网站上提到。\n\n安装过程非常直观，且网站上有非常详尽的文档。安装时，请选择“系统启动时启动\
  \ docker”的选项。这样，我们就不需要再次启动 docker。安装完成后，启动 `docker CLI`，或者你可以直接在终端中执行 `docker` 命令；它将列出选项列表。使用以下命令，并在要求用户名和密码时提供上方创建的\
  \ docker hub 详情：\n\n```bash\ndocker login\n```\n\n一旦你成功登录，你就可以通过你的 docker desktop\
  \ 连接到 docker hub。下一步是创建镜像并运行容器，这将在接下来的部分中讨论。\n\n## 创建可重用的镜像\n\n我们已经涵盖了 docker desktop\
  \ 和 hub 的安装以及账户创建部分。现在，我们将创建一个简单的镜像，并介绍构建镜像所需的几个基本命令和结构的细节。由于我们的目标是创建一个可重用的镜像并将其推送到\
  \ docker hub，我们将进行一个简单的练习，完成以下步骤：\n\n* 创建一个 Python 脚本来统计 CSV 文件每列的空/缺失值。\n* 生成一个包含列名和缺失值计数的报告。\n\
  * 将该模块容器化。\n* 将输出保存在运行它的机器上。\n\n我们将从 Python 脚本开始。该 Python 脚本接受 csv 文件作为输入，并提供一个命名的\
  \ csv 文件作为输出。该脚本将在本文末尾的 git 链接中共享。我们将 Python 文件命名为...。现在，我们将介绍用于创建镜像的 `Dockerfile`\
  \ 内容。Docker 文件中的第一个命令如下：\n\n```dockerfile\nFROM python:3.7.3\n```\n\n此命令用于引用基础镜像。Docker\
  \ 和许多其他供应商都提供其应用程序/软件的基础镜像，可以根据需要进行扩展。我们正在使用前面的命令执行相同的操作。我们将调用可用的 Python 3.7.3 镜像，并根据我们的需要进一步使用它。\n\
  \n下一个命令是使用以下命令设置工作目录：\n\n```dockerfile\nWORKDIR /usr/src/app\n```\n\n此命令将工作目录设置为指定的路径，在这种情况下，如果目录不存在，它将被创建。所有的命令将在工作目录内执行。这使得挂载外部数据变得容易，也可以在同一个\
  \ docker 中多次更改工作目录，但在本例中不需要。\n\n下一个命令是将容器镜像所需的所有文件。为了这样做，我们使用 `copy` 命令。在这种情况下，我们使用以下命令：\n\
  \n```dockerfile\nCOPY ..\n```\n\n这表示将系统当前目录的内容复制到 docker 当前目录（即之前设置的工作目录）。\n\n下一个命令是在容器内安装所有\
  \ Python 软件包，所有需要的包及其版本都在文件中提到。`RUN` 命令在构建镜像时在 docker 文件中执行其随后的命令。为了参考，命令如下：\n\n\
  ```dockerfile\nRUN pip3 install -r requirement.txt\n```\n\n最后部分是入口点（entry point）命令，这意味着只要你启动容器，就会运行该命令。在运行容器时可以覆盖它，可以在共享代码的\
  \ `README.md` 链接中检查。要执行的命令如下：\n\n```dockerfile\nENTRYPOINT [\"python\",\"Null_Value_Modul.py\"\
  ]\n```\n\nPython 脚本将执行在本节开头定义的任务，即统计每列的空值并生成 CSV 格式的报告，给定一个输入 CSV 文件。执行 `docker`\
  \ 命令以及传递给它们的参数将在共享代码的 `README.md` 文件中讨论。代码链接位于参考文献中的 Docker Image Creation。\n\n\
  ## 将镜像作为容器运行\n\n一旦创建了镜像，我们就可以根据需要使用它。从中心仓库（在此例中为 docker hub）提取镜像并运行它的命令位于 `README.md`\
  \ 文件中。命令选项也共享并进行了解释，可能会根据镜像的需求而变化。\n\n通过这些，我们涵盖了如何创建镜像并作为容器运行。然而，当我们运行多个镜像时，特别是当我们为了扩展性训练或部署\
  \ ML 模型时，存在基础设施需求。这就是 Kubernetes (K8s) 出场的地方。我们将在接下来的部分中讨论它们，并尝试对使用它们建立理解。\n\n\n\
  \n\n\n## Kubernetes\n\nKubernetes，也称为 K8s，是一种以自动化和可扩展的方式部署和管理容器化应用的开源系统。它由 Google\
  \ 的工程师创建并开源。目前，大多数组织都选择了 K8s 路线，原因如下：\n\n-   K8s 集群具有天然的可扩展性。它拥有一许多工具，允许应用程序及其所托管的基础设施根据需求、效率以及其他许多指标进行水平扩展或收缩。在训练或部署我们的\
  \ ML 模型 模型时，我们将根据需求探索其中的一些工具。\n-   无论你在何处运行集群，K8s 都非常灵活。无论是在你的私有云、公有云还是你自己的机器上，它的设计都能处理复杂的需求。\n\
  -   开源 K8s 是开源的，可以根据需要进行扩展。这为应用程序开发和部署提供了一个强大的系统，且不会被供应商锁定。\n\nKubernetes 的安装可能具有挑战性；但得益于\
  \ `GCP` 或 `AWS` 等公有云提供商，他们简化了 `K8s` 的安装。另一个需要记住的点是，尽管 `K8s` 有许多优势，但并不是每个组织都需要为其机器学习或数据科学实践启用这些功能。只有当机器学习实践达到成熟并有需求时，我们才应该进行。我们假设目前大多数企业都是如此；但一个值得思考的问题是，我们每周或每月将训练和部署多少模型。这个问题的重要性在于，你可以轻松地量化基础设施和运维需求。这不需要非常准确，但会给出\
  \ `K8s` 清晰的价值主。\n\n一旦部署了 `K8s`，我们就得到了集群。集群由称为 `nodes` 的工作机器组成。我们将在下一节中介绍构成 `K8`\
  \ 集群的所有组件。\n\n## K8 组件\n\n广而言之，`K8` 集群由三个主要部分组成：\n\n1. 控制平面 (Control plane)\n2.\
  \ 节点 (Nodes)\n3. 云供应商 API (可选)\n\n图 5.2 展示了 `K8s` 集群的组件如下：\n\n![](img/image-eba5tkxw.jpg)\n\
  图 5.2：K8s 组件\n\n[参考：节点是容器化应用程序运行的地方，每个 `K8s` 集群至少有一个 `node`。控制平面包含了管理集群的服务/组件，包括如果安装在公有云或私有云上时与云供应商交互的组件。关于\
  \ `K8s` 的更多信息可以查阅]\n\n## Google Cloud Platform (GCP)\n\nGoogle 云平台，或顾名其 `GCP`，是由\
  \ Google 提供的云平台，也是与微软 `Azure` 和 `AWS` 一样最广泛使用的公有云平台之一。`GCP` 提供了多种服务，使得组织可以在一个地方处理所有的\
  \ IT 需求。`GCP` 或任何公有云提供商都能让终端用户专注于核心问题，而无需担心 IT 基础设施或平台。在高级别，`GCP` 提供以下服务：\n\n- \
  \  计算与托管\n-   存储\n-   数据库\n-   网络\n-   大数据\n-   机器学习\n\n这些服务属于多个类别，如软件即服务 (SaaS)、平台即服务\
  \ (PaaS) 或基础设施即服务 (IaaS)。在本章中，我们将使用 `K8s`，它属于计算与托管。我们将安装 `K8s` 集群，然后安装在下一节讨论的 `Polyaxon`。本章还讨论了集群代码的安装。\n\
  \n我们可以通过 `GCP` 云终端完成大部分工作；但是，如果你想从本地机器执行，则你需要安装 Google Cloud SDK。请根据你的操作系统安装此软件。安装完成后，你需要执行\
  \ `gcloud init` 登录你的账户。这将带你进入 Google 登录页面。如果你使用多个 `GCP` 账户和项目，请小心选择正确的一个。登录后，我们就准备好在\
  \ `GCP` 端执行 `K8s` 和 `Polyaxon` 的安装，我们将在下一节中讨论。\n\n## Polyaxon\n\n`Polyaxon` 构建用于自动化和复现机器学习及深度学习任务。`Polyaxon`\
  \ 是与平台无关的，并提供了多种版本的工具，包括云版本。在本章中，当我们提到 `Polyaxon` 时，指的是 `Polyaxon` 社区版，这是来自 `Polyaxon`\
  \ 组织的开源工具。它运行在任何 `K8s` 集群之上；在我们的案例中，我们将使用 `GCP` `K8s` 集群。我们将在本章介绍安装和设置部分，然后在下一节运行一些实验并介绍它们的细节。\n\
  \n`Polyaxon` 提供的一些功能是免费的，但也有一些是付费的。我们将利用免费设置，并使用其他工具为任何付费内容寻找替代方案。其核心思想是掌握概念，并根据组织可用的工具进行实现，或给出相应的建议。`Polyaxon`\
  \ 提供了两种与 Python API 和 YAML 文件通信的方式。我们将研究两者；但我们将主要通过 YAML 实现大部分内容。在下一节中，我们将在 `GCP`\
  \ `K8s` 集群上安装开源的 `Polyaxon` 社区版。\n\n\n\n\n\n## Polyaxon 安装\n\n要在 GCP 上安装 Polyaxon\
  \ 社区版，我们需要安装 K8s 集群。GCP 中的所有内容都安装在项目（project）下。如果您的 GCP 中没有该项目，请创建一个。您可能需要为在 GCP\
  \ 上运行脚本的用户启用一些 API，例如 K8s 集群等。一旦创建了项目，我们就可以直接运行参考部分提供的 GitHub 链接中的脚本了。该脚本执行时需要四个参数，如下：\n\
  \n- Project（项目）：进行安装的 Google 项目名称。\n- The computation zone（计算区域）：创建 K8s 集群的计算区域。更多详情请参阅\
  \ `https://cloud.google.com/compute/docs/regions-zones`\n- Cluster（集群）：用户想要命名的 K8s\
  \ 集群名称。\n- Number（数量）：K8s 集群自动伸缩到的最大节点数。\n\n我们将在第一步完成默认配置安装，然后将升级配置。在 K8s 集群安装后，在脚本中执行的步骤讨论如下：\n\
  \n## 创建命名空间 (namespace)\n创建一个用于安装 Polyaxon 社区版的命名空间。命令如下：\n```bash\nkubectl create\
  \ namespace polyaxon\n```\n\n下一步是获取 polyaxon 包并安装到 K8s 集群。我们使用 `helm`，它是 K8s 集群的包管理器。命令如下：\n\
  ```bash\nhelm repo add polyaxon https://charts.polyaxon.com\n```\n\n下一步是部署 polyaxon，命令如下：\n\
  ```bash\npolyaxon admin deploy\n```\n\n安装完成后，可以运行 `polyaxon_dashboard.sh` 脚本，或者在\
  \ GCP cloud shell 中逐行执行单独命令。这将启用端口 8000 上的仪表板，并通过 GCP cloud shell 的 Web 预览模式进行查看。仪表板的界面将如图所示：\n\
  \n![](img/image-0652wadg.jpg)\n图 5.3：Polyaxon 仪表板\n\n由于我们还没有创建任何项目，这标志完成了 K8s 和\
  \ Polyaxon 集群的安装。任何额外的配置将根据需要进行讨论。我们将在下一章运行 ML 训练任务。\n\n## 注意事项\n- 容器是自给自足的软件单元，可以在任何操作系统上运行。\n\
  - `Docker` 是创建镜像的一种方式，`Docker hub` 是存储镜像的众多仓库之一。\n- `Kubernetes` 或 `K8s` 是用于部署和管理容器化应用的开源平台。\n\
  - GCP 在其计算服务下提供了 `K8s`。\n- Polyaxon 开源是 Polyaxon 组织的软件，安装在 `K8s` 之上，用于可扩展和可复现的 ML。\n\
  \n## 多选题\n1. Docker 文件中 `FROM` 命令的作用是什么？\n   - 获取用于构建新镜像的基础镜像\n   - 从“FROM”之后提到的目录中导入文件\n\
  \   - docker 文件中不需要有“FROM”\n   - 它告诉 docker 文件当前的工作目录\n\n2. 下列关于容器和 VM（虚拟机）的陈述中，错误的是？\n\
  \   - 每个虚拟机共享计算机资源，但有其自己的操作系统。\n   - 多个容器可以在同一台计算机的同一个操作系统上运行。\n   - 容器化应用可以轻松地从一台计算机部署到另一台。\n\
  \   - 运行不同的容器需要安装独立的操作系统。\n3. kubectl 是什么：\n   - GCP 用户验证工具\n   - K8s 安装工具\n   -\
  \ 与 GCP 交互的工具和库\n   - 以上均不是\n4. 关于 K8s 集群，哪个陈述是正确的？\n   - K8s 只能安装在云端。\n   - K8s\
  \ 无法自动伸缩。\n   - 应用程序必须容器化才能运行在 K8s 上。\n   - GCP 是唯一提供 K8s 的云供应商。\n5. Polyaxon 为\
  \ ML 解决了什么问题？\n   - 可复现的结果\n   - 实验跟踪\n   - 可扩展性\n   - 以上所有\n\n## 答案\n- a\n- d\n\
  - c\n- c\n- d\n\n## 核心术语\n- Template（模板）：容器的模版或蓝图。包含了一组创建容器的指令。\n- Node（节点）：运行容器化应用的\
  \ K8s 组件。每个 K8s 集群至少有一个节点。\n\n## 参考文献\n- Docker 镜像创建 - `https://github.com/MLBook-VJ/First_Docker_Image`\n\
  - Polyaxon 安装 - `https://github.com/MLBook-VJ/Polyaxon_Install`\n\n# 第 6 章：训练与测试\
  \ ML 模型 – 部分 2\n\n在上一章中，我们查看了诸如 `Docker`、`Polyaxon` 和 Google Cloud Platform 等工具和技术，用于大规模地训练机器学习模型。在这一章中，我们将学习如何使用\
  \ `Polyaxon` 来训练和跟踪我们的 ML 模型。\n\n## 结构\n在本章中，我们将涵盖以下主题：\n- 概述\n- Polyaxon 仪表板\n\
  - Polyaxon 训练的构建模块\n- 训练回归模型\n- 训练图像分类模型\n\n## 目标\n学习本章后，你将能够利用 `Polyaxon` 训练 ML\
  \ 模型并跟踪与实验相关的所有工制品。我们将涵盖回归和分类模型。基于 GPU 的深度学习模型也作为训练的一部分涵盖在内。目标是展示如何使用 `Polyaxon`\
  \ 运行实验。\n\n## 概述\n上一章涵盖了 `Polyaxon` 的所有基础模块。我们将通过训练两个模型并跟踪元数据来继续。`Polyaxon API`\
  \ 的组件也得到了讨论。为两个模型提供了代码。我们将从 Polyaxon 仪表板开始。\n\n## Polyaxon 仪表板\n在上一章中，我们在 `K8s`\
  \ 集群上安装了 `Poly`。Polyaxon 仪表板是一个让我们查看训练任务的工具。它具有许多功能，例如：\n- 查看、排序、过滤和比较不同的训练任务\n\
  - 显示原生以及自定义（`Bokeh`、`Plotly` 和 `Vega`）可视化\n- 查看任务输入、输出和日志\n- 资源（计算和内存）跟踪\n- TensorBoard\
  \ 集成\n\n## 访问 Polyaxon 仪表板\n可以使用以下命令从本地系统访问 Polyaxon 仪表板：\n```bash\npolyaxon port-forward\
  \ --namespace=polyaxon\n```\n该命令将 Polyaxon 仪表板发布在 `http://localhost:8000`，你可以使用系统上的任何浏览器访问。\n\
  \nPolyaxon 中所有的模型训练任务都需要存在于项目中。因此，在我们开始模型之前，我们需要项目。有两种方法：使用 CLI 或 Polyaxon 仪表板 GUI。我们将使用\
  \ CLI 创建项目。这可以通过以下简单的命令实现：\n```bash\npolyaxon project create --name=my-project\n\
  ```\n一旦执行，我们的项目将显示在仪表板上，如图 6.1 所示：\n\n![](img/image-yhfiu46c.jpg)\n图 6.1：Polyaxon\
  \ 仪表板\n\n## Polyaxon 训练的构建模块\n使用 `Polyaxon` 训练模型需要两个主要组件，如下：\n- 包含容器化训练代码的 `Docker`\
  \ 镜像\n- 描述训练任务规范的 `Polyaxonfile`\n我们将查看创建这两个组件所需的步骤。\n\n\n\n\n\n# Docker 镜像我们将创建一个\
  \ Docker 镜像并将其推送到 Docker Hub。我们将将其推送到一个公共访问的仓库。Polyaxon 也支持私有仓库。集成私有仓库的步骤可以在 Polyaxon\
  \ 官方文档中找到。我们应该为该镜像创建以下三个文件：\n- `model.py`\n- `requirements.txt`\n- `Dockerfile`\n\
  \n这些文件可以在 https://github.com/MLBook-VJ/polyaxon-examples 找到。由于我们已经在上一章中构建并推了 Docker\
  \ 镜像，因此在这里我们将会跳过这些细节。`model.py` 文件包含了像任何典型模型训练代码的代码，但额外包含几行代码帮助跟踪模型的输入、输出和指标。我们将在构建回归模型和图像分类模型时，更深入地查看此文件。\n\
  \n## Polyaxonfile\n`Polyaxonfile` 是任何 Polyaxon 训练任务中最重要的组件。它包含了任务应如何运行的规范。Polyaxon\
  \ 文件可以使用 YAML、JSON 和 Python 编写，部分可以使用 Go、Typescript 和 Java 编写。我们将使用 YAML 来编写我们的\
  \ `Polyaxonfiles`。Polyaxonfile 规范主要有两种类型：组件（component）和操作（operation）。我们将查看组件级 Polyaxonfile。\n\
  \n组件级 `Polyaxonfile` 可以接受很多参数作为输入。以下是最重要的几个参数：\n- Polyaxon 规范版本。这通常设置为 `Component`\
  \ 或 `operation`。\n- 组件的描述，可用于在仪表板上轻松过滤组件。\n- 运行组件时提供的用户参数。它具有以下子参数：\n    - `name`\n\
  \    - `type`\n    - 参数的默认值\n    - 告知该参数是否为可选的标志。\n- 组件的运行时规范。它具有以下子参数：\n    - 训练任务的类型（单机或分布式）\n\
  \    - 将运行训练任务的主 Kubernetes 容器的规范。\n\n还有其他几个参数。它们的细节可以在 Polyaxon 官方文档中找到。\n\n##\
  \ 提交训练任务\n我们执行 `polyaxon run` 命令来提交训练任务。看下面的示例：\n\n```bash\npolyaxon run -f polyaxonfile.yml\
  \ -l\n```\n\n这将根据 `-f` 标志中指定的细节启动训练任务。`-l` 标志会在终端上打印日志。`polyaxon run` 还可以接受其他几个参数。可以通过运行以下命令找到这些参数：\n\
  \n```bash\npolyaxon run --help\n```\n\n## 训练回归模型\n在本节中，我们将训练一个回归模型来预测波士顿郊区房屋的中位数。我们将使用\
  \ Scikit Learn 库训练一个随机森林回归器。让我们先查看模型训练代码。我们将讨论为了妥善跟踪任务而所需的各种 Polyaxon 命令。利用 Polyaxon\
  \ 跟踪 API 有两种方式：跟踪模块（Tracking Module）和跟踪客户端（Tracking Client）。我们将使用跟踪模块。\n\n在机器学习项目中，有三项基础内容需要被跟踪以比较实验——训练数据、超参数和性能指标。性能指标帮助我们判断哪些模型的表现更好，而跟踪训练数据和超参数可以帮助我们理解为什么某个模型表现更好或更差。在这个示例中，我们将跟踪内容。\n\
  \n## 跟踪数据\n为了跟踪训练数据，我们使用 `log_data()` 函数。它接受两个主要参数。我们可以如图 6.2 所示，从 Artifacts（产物）标签页中查看并下载这些数据。\n\
  \n## 跟踪超参数和指标\nPolyaxon 提供了一种非常简单的方法，使用 `log_params()` 函数跟踪所有的超参数和指标。这些数据随后将在 Params（参数）标签页中显示，如图\
  \ 6.3 所示。为了记录其他指标，我们可以使用 `log_metrics()` 函数。\n\n## 跟踪 Keras 实验\nPolyaxon 使得在训练过程中每个\
  \ epoch 之后的指标变得非常简单。这可以通过在调用 `fit()` 函数时使用 `PolyaxonCallback()` 回调来实现。默认情况下，它会记录编译模型时指定的损失和指标。Polyaxon\
  \ 还会自动为这些值创建曲线。\n\n## 记录模型文件\n记录模型文件是一个两步过程。首先，我们需要使用任何序列化库将模型写入磁盘。接下来，我们可以使用 `log_model()`\
  \ 函数记录模型文件。\n\n\n\n\n\n## 在 Google Kubernetes Engine 上配置 GPU\n\n深度学习模型在 GPU 上的训练速度快得多。然而，在我们使用\
  \ GPU 训练模型之前，我们需要在 GKE 上创建一个 GPU 节点池。这是一个多步骤的过程，具体讨论如下：\n\n## 请求 GPU\n这是 GCP 项目中可以运行的\
  \ GPU 最大数量。\n\n## 创建自动伸缩的 GPU 节点\n此节点池将仅用于需要 GPU 的任务。\n\n## 安装 NVIDIA GPU\n请求额外\
  \ GPU 配额的步骤可以在 Google Cloud 官方文档中找到。\n\n我们将创建一个与我们用于仅 CPU 任务的节点池分开的自动伸缩 GPU 节点池。这有助于我们充分利用自动伸缩功能。该节点池能够根据是否需要\
  \ GPU 高效地扩展或缩小规模。这使其成为在 GKE 上使用 GPU 最具成本效益的方式。要创建 GPU 节点池，我们运行以下命令：\n\n```bash\n\
  gcloud container node-pools create POOL_NAME \\\n--accelerator type=GPU_TYPE,count=AMOUNT\
  \ \\\n--zone COMPUTE_ZONE \\\n--cluster CLUSTER_NAME \\\n--num-nodes NUM_NODES \\\
  \n--min-nodes MIN_NODES\n--max-nodes MAX_NODES \\\n--enable-autoscaling\n```\n\n\
  **注意**：并不是所有的 GPU 类型在所有计算区域都可用。要检查每个区域可用 GPU 列表，请运行以下命令：\n\n```bash\ngcloud compute\
  \ accelerator-types list\n```\n\n在创建 GPU 节点池后，我们需要在节点上安装 NVIDIA 驱动程序。Google 使其变得非常简单，如下：\n\
  \n```bash\nkubectl apply -f https://raw.githubusercontent.com/GoogleCloudPlatform/container-engine-accelerators/master/nvidia-driver-installer/cos/daemonset-preloaded.yaml\n\
  ```\n\n这需要几秒钟完成，之后我们的 GPU 节点池即可使用。\n\n## 在 Polyaxon 上训练时使用 GPU\n现在我们的 GPU 节点池已就绪，我们可以使用它来训练图像分类模型。为了实现这一点，我们将利用\
  \ `polyaxon run` 命令的文件覆盖机制。这允许我们使用 CPU 或 GPU 来训练模型，而无需反复编辑 `polyaxonfile`。为了实现这一点，我们需要两个\
  \ polyaxon 文件。在这种情况下，它们是 `polyaxonfile.yml` 和 `polyaxonfile_gpu.yml`。\n\n要仅使用 CPU\
  \ 进行训练，我们将执行以下命令：\n\n```bash\npolyaxon run -f polyaxonfile.yml\n```\n\n要使用 GPU 进行训练，我们使用以下覆盖机制向运行规范中添加\
  \ GPU 请求：\n\n```bash\npolyaxon run -f polyaxonfile.yml -f polyaxonfile_gpu.yml\n\
  ```\n\n这将添加/替换原始 polyaxon 文件中 `nvidia.com/gpu` 参数的值。\n\n## 记忆点\n- 我们所有训练任务的详情可以在\
  \ Polyaxon 仪表板上查看。\n- `Polyaxonfile` 包含了训练 ML 模型的所有规格。\n\n## 多选题\n1. 下面哪个功能 Polyaxon\
  \ 仪表板中具备具备？\n   - 创建自定义可视化\n   - 启动 GPU 节点池\n   - 根据标签过滤训练任务\n   - 跟踪消耗情况\n2. 我们可以用多少种方式书写\
  \ `polyaxon`？\n   - 1\n   - 2\n   - 3\n   - 6\n3. 是否可以使用 `polyaxon`？\n   - 是\n \
  \  - 否\n\n**答案**\n- b\n- c\n- a\n\n## 关键术语\n- 我们所有训练任务的详情可以在 Polyaxon 仪表板上查看。\n\
  - `Polyaxonfile` 包含了训练 ML 模型的所有规格。\n- `Polyaxon`: https://github.com/GoogleCloudPlatform/container-engine-accelerators/\n\
  - `Polyaxon`: 使用 YAML 和 JSON 增强性能。\n\n## 参考文献\n- `Polyaxon`: https://raw.github.com/GoogleCloudPlatform/container-engine-accelerators/master/nvidia-driver-installer/cos/daemonset-preloaded.yaml\n\
  - `Documentation`: https://polyaxon.com/docs/\n- `Private Registry`: https://polyaxon.com/integrations/private-registry/\n\
  - `Quotas`: https://cloud.google.com/compute/quotas\n\n# 第七章模型性能\n\n在之前的章节之后，我们现在探索衡量性能的指标。指标或\
  \ KPI 用于定义模型性能的坏坏。指标越多，我们越能理解模型的性能。指标或 KPI 用于定义模型性能的坏坏。指标越多，我们越能理解模型的性能。指标用于且我们将在本章中详细讨论。\n\
  \n广义地说，指标分为两个部分——回归和分类，我们将涵盖这两个部分。\n\n## 结构\n在本章中，我们将涵盖以下主题：\n- 概述\n- 回归指标\n- 分类指标\n\
  - 结果\n\n## 目标\n学习本章后，你将能够根据数据和问题理解正确的指标。我们还将接触如何使用 `polyaxon` 衡量性能。我们将查看 KPI 和指标以评估\
  \ ML 模型的性能，并确保 `polyaxon` 的输出对项目有所贡献。\n\n## 概述\n我们创建多个 ML 模型来解决不同的业务问题。为了确保最终用户利用这些模型的输出，我们需要验证性能。为了量化性能，我们需要理解指标。每种类型的\
  \ ML 问题都有自己的 KPI，我们必须根据数据和问题选择最合适的一个。我们将从回归 KPI 开始。\n\n## 回归指标\n回归用于因变量是连续的情况，例如房屋价格、薪水等。回归指标的一个常见问题是预测的规模，由于这个原因，它是具有开放解释性的；例如，如果我们预测的是通常以百万计的房屋价格，我们可以说\
  \ ± 2 万美元是一个很好的预测；然而，对于规模在 5 万到 10 万左右的薪水，± 2 万就太大了。\n\n在接下来的章节中，我们将看到一些用于捕捉回归模型性能的常用指标。\n\
  \n## 平均绝对误差 (MAE)\n平均绝对误差或 MAE 是一种流行的指标，因为误差得分的单位与所预测的目标值的单位一致。\n\nMAE 的计算方法是实际值与预测值之绝对值的平均值。\n\
  \n\n\n\n\n## MSE 和 RMSE\n均方误差（Mean Squared Error，MSE）也是最常用的指标。它也是最小二乘回归问题中的损失函数。误差（实际值减去预测值）被平方后加到\
  \ `MSE` 中。这样做的好处是它可以放大较大的误差。计算 `MSE` 的公式如下：\n![](img/image-fibh8593.jpg)\n变量定义与\
  \ `MAE` 相同。`MSE` 的单位是平方单位；例如，如果我们正在预测以美元为单位的房价，那么 `MSE` 的单位就是美元平方。这可能并不直观，因此使用了均方根误差（Root\
  \ Mean Squared Error，RMSE），它是 `MSE` 的平方根。\n\n## RSquare (R 平方)\nRSquare 的计算方法是 ML\
  \ 模型捕捉到的方差比例。方差是数值围绕平均值的离散程度。要计算它，我们需要计算围绕平均值的方差和围绕预测值的方差。两者的公式分别如下：\n![](img/image-xaf9p2pf.jpg)\n\
  围绕平均值的方差\n围绕预测值的方差\n`µ`: 因变量的均值或平均值\n所有其他变量与 `MAE` 中相同。模型方差除以围绕平均值的方差得到模型未解释的方差。从\
  \ 1 中减去该值得到模型解释的方差量，因此，R² 的公式如下：\n![](img/image-ylbqzn78.jpg)\n通常情况下，R² 的值在 0 到\
  \ 1 之间，以均值作为基准模型。如果模型的表现低于数值平均值，我们会得到负值。\n\n## 预测值与实际值对比图\n预测与实际值的对比图是可视化模型性能的一种方式，如图\
  \ 7.1 所示：\n![](img/image-9ajkishm.jpg)\n图 7.1：预测值与实际值\n预测与实际对比图是可视化回归模型性能的另一种方法。\n\
  \n## 分类指标\n到为止，我们讨论了回归指标和 KPI，这是监督学习的一种类型。另一类监督学习是分类，我们将详细讨论衡量这些模型性能的 KPI。在进入指标本身之前，我们需要理解混淆矩阵，它使我们能够计算这些\
  \ KPI 或指标。\n\n## 混淆矩阵\n混淆矩阵是一种表格结构或二维矩阵。在一个轴上绘制实际值，在另一个轴上绘制预测值。在图中，水平轴是预测值，垂直轴是真实值或实际值，所示：\n\
  ![](img/image-6ck7flp7.jpg)\n图 7.2：混淆矩阵\n混淆矩阵用于二分类；然而，该概念可以扩展到多分类。在这种情况下，0 和 1 是感兴趣的标记或类别；例如，客户是否流失，或者某人是否会购买（用是或否的标记表示）。在客户流失的情况下，客户流失的记录被视为正例，未流失的被视为负例。\n\
  \n以下术语与混淆矩阵相关：\n- **真正例 (True Positives)**：这些是我们预测为正类且该案例确实属于正类的情况。\n- **真负例 (True\
  \ Negatives)**：这些是我们预测为负类且该案例确实属于负类的情况。\n- **假正例 (False Positives)**：这些是我们预测为正类但该案例实际上属于负类的情况。\n\
  - **假负例 (False Negatives)**：这些是我们预测为负类但该案例实际上属于正类的情况。\n\n在多分类中，这些值可以使用“一个对所有”（one\
  \ vs all）的逻辑转换为二分类问题来计算；例如，如果我们有猫、狗、兔子三个类别，为了计算“猫”类别的上述四个值，你可以将猫设为 1，将狗和兔子设为 0。我们将在本章的\
  \ Python Notebook 中展示多分类混淆矩阵。\n\n需要注意的是，根据所选择的概率阈值，相同输出的混淆矩阵可能会发生变化。在 `sklearn`\
  \ 包中，二分类的默认概率阈值为 0.5。低于此值的任何值都被视为负类，高于此值为正类。根据业务问题，可以更改此概率阈值。从混淆矩阵派出的其他指标将在后续章节中讨论。\n\
  \n## 准确率 (Accuracy)\n准确率的计算方法是所有数据中正确预测的记录占比。根据之前讨论的混淆矩阵，准确率公式如下：\n![](img/image-e76tvv5f.jpg)\n\
  该公式适用于二分类问题。对于多分类，分子是混淆矩阵对角线值之和除以数据中的总记录数。\n\n## 精确 (Precision)\n精确率是在所有预测为正值的记录中，正确预测的正例记录数。精确率的公式如下：\n\
  ![](img/image-2db1e5cq.jpg)\n在多分类情况下，根据混淆矩阵，感兴趣类别的列之和成为分母，感兴趣类别的行与列的交点成为分子。在本章分享的\
  \ GitHub 的 Python Notebook 中展示了一个示例。\n\n## 回回率 (Recall)\n召回率是数据中所有正例记录中正确预测的记录占比。召回率的公式如下：\n\
  ![](img/image-ixwgt6p1.jpg)\n在多分类情况下，根据混淆矩阵，感兴趣类别的行之和成为分母，感兴趣类别的行与列的交点成为分子。\n\n\
  ## F-n 分\nF-n 分是结合精确率和召回率的方法。计算 F-n 分的公式所示：\n![](img/image-wxttbn2u.jpg)\n这里的值 是超参数，n\
  \ 值越大，对召回率的权重越高。最常见的 F-n 分是 F1 分，精确率和召回率的权重相等。\n\n## ROC 和 AUC\n受者工作特征曲线（ROC）是从信号处理引入机器学习领域的概念。ROC\
  \ 曲线通过在不同的概率阈值下绘制真正率相对于假正率来创建。真正率就是召回率，是我们之前计算过的。敏感性（Sensitivity）也是召回率或真正率的另一个术语。假正率通过从\
  \ 1 中减去特异性得到。特异性的公式如下：\n![](img/image-y1cw7n2jpg)\n一旦创建图表，将如图所示：\n![](img/image-dq0r46uq.jpg)\n\
  图 7.3：ROC\nAUC 代表曲线积，它是 ROC 图下方的面积。AUC 的最大值为 1。AUC 的解释是模型区分正类和负类的能力。值越高，模型越好。\n\n\
  ### 马西修斯相关系数 (MCC)\n在之前讨论的所有指标中，除 ROC/AUC 之外，我们只考虑正类的性能或对其赋予更多权重。在需要同样正确识别正类和负类的情况下，MCC\
  \ 是一个很好的衡量指标。MCC 的值在 ‒1 到 1 之间，‒1 意味着每个类别都预测错误，1 意味着模型预测完全正确。0 表示预测是随机的。MCC 的公式所示：\n\
  ![](img/image-wfvmddvv.jpg)\n\n\n\n\n\n## 结果沟通\n\n我们讨论了许多回归和分类的指标；然而，在与业务部门或利益相关者沟通时，这些指标并不总是对利益相关者具有业务意义。此外，你的模型生成的输出对终端用户可能没有直接的实用价值。举个例来说，你训练了一个预测房价的模型，并且它能够准确地做到这一点。但对于销售代理来说，他们可能感兴趣的是影响价格的因素；例如，房屋的位置、建筑商详情等。同时，基于即将开展的项目房价预测可以被开发商用于锁定合适的目标客户群体。通过这种方式，同一个模型可以被不同的相关者以不同的方式消费，因此根据要求沟通结果至关重要。\n\
  \n另一个例子是客户流失问题，我们预测客户流失的概率。在每个与客户打交道的业务中，由于各种原因总会产生流失。因此，对于营销人员来说，他们想了解利润率最高的客户（这可能是其他机器学习模型的结果），并且他们想尝试阻止这些客户流失。同时，并不是每个客户都能被阻止流失，因此这应该是流失概率和盈利能力之间的最佳组合。\n\
  \n上述示例只是为了说明，训练一个良好的机器学习模型只是其中之一，人们需要理解利益相关者并据此沟通结果。这可能涉及整合多个模型，或仅分享部分结果。最终目标始终应该是基于所分享的洞察产生某些可操作的结果。\n\
  \n## 注意事项\n\n- 性能指标应该根据手头的问题和数据进行选择。\n- 向利益相关者沟通机器学习模型的性能是机器学习项目成功的关键。\n- 将机器学习模型的性能与业务目标相关联可以使利益相关者的达成更加一致。\n\
  - 指标能够对同一个问题的多个机器学习模型进行比较。\n\n## 多选题\n\nR 平方（R-square）代表什么？\n- 预测值偏离实际值的平均百分比。\n\
  - 模型在预测数据集中能够捕捉的方差。\n- 归一化的误差百分比。\n- 以上都不是\n\n在 `F-n` 分数中增加 `n` 有什么影响？\n- 召回率（recall）在\
  \ `F-n` 分数中的权重增加。\n- 精确（precision）在 `F-n` 分数中的权重增加。\n- 模型准确率提高。\n- 精确和召回率都提高。\n\n\
  何时使用 `MCC`-马修斯相关系数？\n- 当识别正性样本很重要时。\n- 当识别负性样本很重要时。\n- 当识别两个类别同等重要时。\n- 以上都不是。\n\
  \n在预测值与实际值的图中，如果模型良好，会发生以下哪点？\n- 点将位于回归线附近并沿着回归线分布。\n- 点将远离回归线。\n- 点将位于回归线附近并聚集在一个地方。\n\
  - 以上都不是。\n\n在不平衡的数据集中，其中正性样本小于 1%，哪些是重点关注的指标？\n- 精确（Precision）\n- 准确率（Accuracy）\n\
  - 召回率（Recall）\n- 以上所有\n\n## 答案\n\nb, a, c, a, c\n\n## 参考文献\n\nNotebook - `https://github.com/MLBook-VJ/ML-KPIs`\n\
  \n# 第 8 章：特征存储 (Feature Store)\n\n在之前的章节中，我们涵盖了机器学习模型的训练和测试，以及衡量模型性能的 KPI。我们还看到数据很少以可以直接被机器学习算法消费的格式。为了将数据准备成可消费的格式，我们需要从原始数据中提取特征。特征工程还涉及将业务知识嵌入数据中，这是一项创造性任务，并且不断演进。特征工程是机器学习训练中最耗时的任务之一，它涉及数据科学家与不同的利益相关者合作，从数据中提取出用的特征。\n\
  \n在组织中，同时有多个机器学习项目在进行，负责这些项目的数据科学家处于孤立工作状态。由于由于，很多时候特征工程的工作是重复的。为了避免这种情况，建立一个中央仓库是一个好主意，其中存储所有创建的特征，任何需要训练的机器学习模型都应该从特征存储获取特征。另一个用途是为评分模型提供现成的新数据，同时保持一致性。\n\
  \n我们将在本章介绍 `Feast`，这是一个用于管理和提供模型训练及推理特征的开源特征存储。`Feast` 由 Google 和 Gojek 创建。我们将介绍\
  \ `Feast` 以及相关的最佳实践。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n- 概述\n- `Feast`\n- `Feast` 结构\n\
  - `Feast` 示例\n\n## 目标\n\n学习本章后，你能够理解特征存储的必要性。本章还将详细介绍 `Feast` 及其相关概念。我们还将讨论如何使用\
  \ `Feast` 创建和维护特征存储。`Feast` 架构以及如何利用数据进行训练和未来预测也将得到讨论。我们还将涵盖通过 `Feast` 实现。\n\n##\
  \ 概述\n\n在企业层面，许多问题将机器学习作为解决方案不可或缺的一部分。在训练和推理时，机器学习模型需要相同的特征集；通常在模型确定到准备好推理之间存在巨大的延迟。大多数情况下，这是由于为了获取持续预测而创建了与训练相同的数据流水线。特征存储解决的问题之一是在新数据方面从训练到推理的平滑过渡。\n\
  \n另一个挑战是大量的重复工作，并且没有单一的地方可以查看为特定实体创建的特征。这导致了工作的浪费，有时会导致信息的丢失。这是特征存储试图通过为特定实体（如客户、产品等）建立集中仓库来解决的另一个问题。\n\
  \n`Feast` 通过提供一致的数据访问和实时（point-in-time correct）的数据来尝试解决所有问题。`Feast` 还允许特征的可重用，并使新特征的部署变得顺畅。我们将在后续章节中介绍\
  \ `Feast` 架构以及如何使用 `Feast` 创建特征仓库。\n\n\n\n\n\n## FEAST – 特征存储\n\n图 8.1 显示了 `Feast`\
  \ 的架构，如下：\n![](img/image-jznlon7e.jpg)\n图 8.1: Feast 架构\n\n[参考：`Feast` 不是一个 ETL\
  \ 工具；它仅提供了一个接口和基础设施配置，用于创建特征存储以一致的方式访问数据。`Feast` 主要位于数据仓库系统或数据湖之上。用于模型训练或对新数据进行评分的所有特征都源自此数据仓库、数据湖或文件系统。除了文件外，`Feast`\
  \ 主要支持另外两个数据源：`Bigquery` 和 `Redshift`；然而，在新版本中，它可能会推出对其他数据源的支持。]\n\n`Feast` 使用历史特征或数据训练模型，使用在线特征或数据对新数据进行评分。在讨论代码时，我们将介绍如何访问历史特征和在线特征（这两个词可以替）。在线存储器位于内存数据库中。目前，`feast`\
  \ 支持 `SQLite`、`Datastore`、`Redis` 和 `DynamoDB` 作为在线存储器。\n\n`Feast` 为用于训练和评分的数据创建一个一致的视图。`Feast`\
  \ 实现这一点是将数据存储在一种分层结构中，该结构对训练和评分均可用，并且根据需要容易扩展，而不会影响已构建的 ML 流水线。我们将在后续章节中介绍 `feast`\
  \ 数据层次结构。\n\n## Feast – 逻辑层次结构\n\n图 8.2 展示了 `Feast` 的逻辑层次结构，即数据在 `Feast` 中的存储方式，如下：\n\
  ![](img/image-earj0udh.jpg)\n图 8.2:\n\n[参考：项目（Projects）位于层次结构的顶端，并在基础设施层面提供了完全隔离。每个项目都应该被视为完全独立的实体和特征宇宙。单次请求无法从多个项目中获取数据。]\n\
  \n`Feast` 存储时间正确（point-in-time correct）的数据，以避免训练过程中未来特征值泄露到模型中导致的不一致。为了做到这一点，`feast`\
  \ 使用 `Feature View`（特征视图），它由特征和 `entity`（实体）组成。`Entity` 可以被视为创建特征的核心属性；例如，等等。实体类似于主键，可以在其基础上创建多个特征视图。实体可以由多个键组成。\n\
  \n`Data source`（数据源）指的是从中提取数据的底层表或文件系统。由于我们都在 GCP 上进行操作，对我们来说，数据源将是 `Bigquery` 表。为了更好地理解\
  \ `Feast` 的工作以及每个组件的细节，我们将在后续章节中详细通过每个工作部分的示例。\n\n## 特征存储示例\n\n为了理解 `Feast`，我们将通过一个示例。第一步是在运行代码的系统或云端安装\
  \ `feast`。我们已经在第 5 章“训练和测试 ML 模型 – 第一部分”中涵盖了如何从本地机器连接到 Google 云。安装 `feast`，请执行以下命令：\n\
  \n```bash\npip install feast\n```\n\n一旦在机器上安装了 `feast`，你可以通过执行以下命令创建一个项目：\n\n```bash\n\
  feast init project_name -t gcp\n```\n\n`feast init` 命令初始化一个仓库，`project_name` 是用户定义的有意义的名称，可以为项目提供。`-t\
  \ gcp` 命令让 `feast` 知道我们将使用 GCP 作为特征存储的平台。它将据此准备基础设施需求。前面的命令将创建一个包含三个文件的文件夹，并且\n\n\
  我们将编辑 `feature-store.yaml` 以在我们要存储元数据的注册表中提供 GCP 桶。它看起来像这样，其中 `bucketname` 是用户创建的桶名，`entity.db`\
  \ 是用户指定的元数据数据库名称。完成后，我们就准备好创建实体、数据源和特征视图了，但在进入那一步之前，让我们看看用于特征存储示例的数据。\n\n## 数据\n\
  \n我们使用四个 `Bigquery` 表作为源，并将逐一讨论每个表的细节。为了理解该过程，假设任何新数据都会追加到这些表中，`feast` 将从这些表中更新离线和在线存储。数据与一家电信公司，用于创建一个潜在流失者的模型。\n\
  \n表 8.1 包含每个项目的因变量 `Churn flag`（流失标记），如下所示：\n表 8.1: Churn\n\n连接表 包含所有关于连接的细节，如服务、期限等，如下所示：\n\
  表 8.2: Connection\n\n支付详情显示在表 中，它包含支付方式、费用等支付详情，如下所示：\n表 8.3: Payment\n\n客户的人口统计信息显示在表\
  \ 8.4 中（在本练习中，我们将假设这些信息随时间推移不会改变），如下所示：\n表 8.4: Demography\n\n\n\n\n\n## 特性定义\n\n\
  我们已经编辑了 `feature_store.yaml` 文件并理解了我们可用的数据源；接下来的任务是以 feast 数据模型格式对数据进行建模。为了实现这一点，我们需要创建\
  \ `entity`（实体）、`data source`（数据源）和 `Feature view`（特征视图）。我们将通过每个概念的示例并结合代码来解释这些概念。参考部分将共享该示例的完整代码链接。我们将从实体开始。\n\
  \n## 实体 (Entity)\n\n实体类似于主键，特征从多个特征视图中聚合此处。在我们的案例中，`CustomerID` 是我们需要创建的实体，因为所有特征都是针对由该标识标识的单个客户。要创建实体，我们将使用以下代码：\n\
  \n```python\n## 为 Customer 定义一个实体。\ncustomer = Entity(\n  # 实体的名称。必须在项目内是唯一的\n \
  \ Name = \"CustID\",\n  # 实体的连接键描述了可以查找特性的存储层字段/列。\n  # 连接键在构建特征向量时也用于连接特征表/视图\n\
  \  join_key = \"CustomerID\",\n  # 实体的存储层类型\n  value_type = ValueType.STRING,\n\
  )\n```\n\n在此段代码中，我们正在创建一个实体，我们给实体的 `Name` 是名称，而 `join_key` 是用于查找该实体的源表。你可以为实体提供任何喜欢的名称，但要确保在特征视图中正确使用该名称。`value_type`\
  \ 是实对应的数据类型。根据业务问题，实体可以是多个键的组合，例如 `CustomerID` 和 `Department` 等。一旦创建了实体，下一步是创建数据源。\n\
  \n## 数据源 (Data source)\n\n数据源定义为获取特征值的文件或表格。由于我们正在使用 GCP，对于我们来说，源将是之前讨论过的 Bigquery\
  \ 表格。在 feast 中创建数据源，我们将使用以下代码：\n\n```python\n## 客户连接详情\ncust_conn_details_source\
  \ = BigQuerySource(\n  # 可以在其中找到特性的 BigQuery 表\n  table_ref=\"project_name.dataset.cust_conn_det\"\
  ,\n  # 事件时间戳用于点点连接 (point-in-time joins) \n  # 并确保只返回 TTL（生存时间）范围内的特征\n  event_timestamp_column=\"\
  feature_creation_date\",\n  created_timestamp_column=\"record_creation_date\",\n\
  )\n```\n\n我们在前面的代码中创建的连接是用于连接详情表的。我们提供了表格名称，如果你为表格指定了其他名称，则需要进行替换。`project_name`\
  \ 和 `dataset` 名称应该替换为 GCP 项目和 Bigquery 数据集名称。这将形成源表名。\n\n`event_timestamp_column`\
  \ 有两个用途：一个用于对特征进行点点连接，另一个用于理解它在在线存储中应持有多少信息（在下一节中讨论）。对于我们的示例，我们在数据中使用 `feature_creation_date`\
  \ 作为。\n\n另一个日期列 `created_timestamp_column` 不是强制字段，但我们在案例中使用了它。它用于去重。\n\n下一步是定义特征视图（feature\
  \ views），数据存储在此处并供训练和评分访问。我们将在接下来的章节中讨论这一点。\n\n## 特征视图 (Feature view)\n\n特征视图是实际存储数据的模式。离线数据用于训练，在线数据用于评分。以下代码重点突出了创建特征视图的方法：\n\
  \n```python\n## 连接特征视图\ncust_conn_fv = FeatureView(\n  name=\"customer_conn_det\"\
  ,\n  entities=[\"CustID\"],\n  ttl=timedelta(days=365),\n  features=[\n    Feature(name=\"\
  Tenure\"),\n    Feature(name=\"PhoneService\"),\n    Feature(name=\"MultipleLines\"\
  ),\n    Feature(name=\"InternetService\"),\n    Feature(name=\"OnlineSecurity\"\
  ),\n    Feature(name=\"OnlineBackup\"),\n    Feature(name=\"DeviceProtection\"),\n\
  \    Feature(name=\"TechSupport\"),\n    Feature(name=\"StreamingTV\"),\n    Feature(name=\"\
  StreamingMovies\"),\n  ],\n  input=cust_conn_details_source,\n)\n```\n\n`name` 是我们给特征视图的名称，`entities`\
  \ 是该视图对应的实体，`ttl` 定义了生存时间。`features` 包含了特征列表，每个特征都有自己的名称。`input` 是该视图对应的数据源。\n\n\
  \n\n\n\n## 访问数据\n\n我们从特征存储（feature store）中访问数据有两个目的：首先用于训练模型，其次用于新数据进行评分。我们需要使用\
  \ `feast` API 中的 `FeatureStore` 和 `RepoConfig` 模块来配置特征存储。测试 feastian 特征存储的代码在共享的\
  \ GitHub 链接 `test_feature_store.py` 脚本中。配置完成后，我们现在需要导入数据来训练模型。你还需要定义想要从特征存储中导入的特征，这可以配置为一个列表。命名规范例如，对于前一节中创建的特征视图中的\
  \ `Tenure` 特征，命名为 `customer_conn_det:Tenure`。\n\n要获取离线特征，我们需要实体数据框（entity data frame），它是一个\
  \ Pandas DataFrame 类型对象，在我们的案例中实体是 `CustomerID`，并包含用于时间点连接（point-in-time join）的时间戳。一旦创建了实体数据框，我们就可以将其和特征列表作为\
  \ `FeatureStore` 对象方法 `get_historical_features` 的参数，获取该客户的所有相关特征。要获取在线特征，你可以使用同一对象的\
  \ `get_online_features` 方法，或者在需要时按照前面的流程创建一个。\n\n我们到此结束对 Feast 的介绍。尽管特征存储会有一些延迟，并且可能不适用于组织中的每一个\
  \ ML 用例，但拥有一个特征存储并尽可能利用它以避免重复工作仍然是一个好主意。特征存储还使得数据漂移（data drift）和概念漂移的监控更容易。在下一章节中，我们将整合所有内容，查看如何部署模型并积极监控它们。\n\
  \n## 注意事项\n\n- Feast 是一个特征存储，用于在一个地方集中管理实体的特征以供以后使用。它不是一个 ETL 工具。\n- 如果你使用云服务，Feast\
  \ 会为你创建基础设施部分。\n- Feast 支持 `Bigquery`、`Redshift` 和 `Files` 作为数据源。在未来的发布中可能会有新的添加。\n\
  - 来自 Feast 的历史特征用于训练模型。要对新数据进行评分，特征将从在线特征存储中提取。\n\n## 单选题\n\n1. 下列哪项不能作为数据源？\n \
  \  - Bigquery\n   - DynamoDB\n   - Redshift\n   - SQLite\n2. `feature_store.yaml`\
  \ 中的 `registry` 值代表什么？\n   - Feast 元数据\n- 离线存储\n- 在线存储\n- 以上均不是\n3. Feast `materialize-incremental`\
  \ 会自动选择开始日期。\n   - 正确\n   - 错误\n4. 在 Feast 的单个特征视图中可以使用多个数据源。\n   - 正确\n   - 错误\n\
  \n## 答案\n\n- b 和 d\n- a\n- a\n- b\n\n## 参考文献\n\n- GitHub 代码 - https://github.com/MLBook-VJ/Feast\n\
  \n# 第 9 章：构建 ML 流水线\n\n在之前的章节中，我们涵盖了 ML 生命周期中从 EDA（探索性数据分析）到模型训练和评估的所有各个方面。下一步是部署最终确的模型以对新数据进行评分并进行监控。我们还需要将\
  \ ML 流水线从训练到部署实现业务化，以便任何新的或更新的 ML 模型都可以在无停机的情况下部署。我们还应该有一个需要时回滚到旧模型的选项，我们将在章中讨论这一点。\n\
  \n在企业级，多个 ML 模型部署在生产环境中，并根据模型输出做出业务决策。为了确保模型提供正确的输出，需要定期跟踪 ML 模型的性能。模型性能可能会因为数据漂移或概念漂移而下降，在这两种情况下，我们都必须训练新模型并部署其进行消费。新模型的移动应该平滑进行，对下游流程的更改最小。为了实现这一点，我们需要一个像软件工程那样的持续集成和部署（CI/CD）机制。\n\
  \n我们将在本章详细讨论所有内容。\n\n## 结构\n\n在本章中，我们将涵盖以下主题：\n- 概述\n- Polyaxon 配置更新\n- 训练\n- 部署\n\
  - 消费\n- Git Ops\n- 监控\n\n## 目标\n\n学习本章后，你将能够理解 MLOps 的必要性，并围绕它为 ML 流水线设计必要的流程。你还将根据需要利用书中讨论的工具以发挥其最大潜力。在必须选择不同技术栈场景下，你将能够评估新工具以设计顺畅的\
  \ MLOps 流程。我们还将涵盖在适用情况下监控 ML 模型的频率的几个关键要点。\n\n## 概述\n\nML 流水线的设计应能支持所有的 MLOps 步骤。我们将根据需要配置\
  \ Git、存储以及云相关的设置，并为生产级系统提供这些设置的关键要点。设置 ML 流水线可能需要多个团队共同工作，如 DevOps、安全、IT，当然还有数据科学。根据手头的用例，流水线的流程可能会有所不同；但我们将涉及如何根据特定需求调整流水线。我们将通过一个\
  \ ML 流水线的示例，使用我们创建 Feast 特征存储时使用的相同数据。`KServe` 将用于部署训练好的模型，部署脚本将用于保存模型相关的元数据。我们还将学习如何利用已部署模型的保存元数据来持续跟踪数据漂移、概念漂移和模型性能。我们将使用开源监控工具\
  \ `Evidently` 来检查数据漂移和概念漂移。\n\n我们将讨论 GitOps 和一些关于安全的最佳实践，但不会深入细节。本章使用的代码在参考部分提供。我们首先从更新\
  \ Polyaxon 配置开始，以便将元数据存储在云端。\n\n## Polyaxon 配置更新\n\n我们在第 5 章“训练和测试 ML 模型 – 第一部分”中配置了\
  \ Polyaxon，然而，训练模型会产生大量的元数据，我们希望将其存储更久。为了这样做，我们需要使用不依赖于 `Pods`（运行在 `K8s` 上的容器）寿命存储。在我们的案例中，我们将配置\
  \ Google Cloud Storage。如果你使用云镜像注册表以及 GitHub 或 GitLab，你还可以进行其他配置。每个配置的细节可以在其他工具中找到。任何想要集成的额外工具可以在该\
  \ URL 上找到。在我们的示例中，我们不需要这样做，因为我们将使用公共 GitHub 仓库和 docker 镜像。\n\n我们将配置 `GCS` 来存储模型元数据，细节可以在参考部分共享的\
  \ GitHub 仓库中的 `config.yml` 中找到。你需要更改存储桶（bucket）和密钥（secret）细节，并提供不同的名称。更新 Polyaxon\
  \ 配置有两种方法：第一种是在安装时作为参数传递配置文件，另一种方法是直接使用以下命令升级 Polyaxon：\n\n```\npolyaxon admin upgrade\
  \ -f config.yml\n```\n\n这将根据你的配置条目升级 Polyaxon 安装。下一步是训练模型，我们将在下一节中介绍。\n\n\n\n\n\n\
  ## 训练 ML 模型\n\n训练模型的方法与我们在第 5 章“训练与测试 ML 模型——部分”中所做的相同，但我们将利用特征存储（feature store）中的数据进行模型训练。此外，为了安全地运行脚本并在运行时登录，我们可以通过\
  \ GitHub/Gitlab 环境变量注入 GCP 登录详情。为了测试目的，我们在 docker 文件中传递了凭据，但这并不安全。你可以在 Polyaxon\
  \ 文件的 `init` 中传递文件，这是一种更安全的方法。该服务账户将通过以下代码在 `polyaxonfile.yaml` 脚本读取：\n\n```yaml\n\
  env:\n  - name: GOOGLE_APPLICATION_CREDENTIALS\n    value: /etc/secrets/credentials.json\n\
  ```\n\n这一次，我们将通过传递 `hyperparameter_grid.yml` 文件来训练模型，它将在内部利用 `polyaxonfile.yaml`\
  \ 并拟合最佳模型。执行此操作的命令如下：\n\n```bash\npolyaxon run -f hyperparameter_grid.yml -p project\
  \ --name experiment_name -P git_repo=polyaxon --eager\n```\n\n用户需要确保服务账户具有所需的权限，例如读取数据的\
  \ BigQuery 数据集以及读取 Feast 元数据并写入训练元数据的 GCS 云存储桶。关于服务账户的更多详细信息以及查看如何创建密钥，你可以参考以下链接：\n\
  \nhttps://cloud.google.com/iam/docs/creating-managing-service-account-keys\n\n训练完成后，我们将在配置为产物存储（artifact\
  \ store）的 GCS 桶下获得每次运行的文件夹，并在该桶中获得每次运行的文件夹，如图 9.1 所示\n\n![](img/image-vnypfl7g.jpg)\n\
  图 9.1: GCS 上的元数据\n\n在每次运行下，你在 Python 训练脚本中记录的所有元数据都可用，包括数据、模型二进制文件以及你使用跟踪模块记录的任何额外产物。文件将如图\
  \ 9.2 所示\n\n![](img/image-2emd0uvi.jpg)\n图 9.2: 运行详情\n\n我们将利用这些最终确定模型的产物进行部署。\n\n\
