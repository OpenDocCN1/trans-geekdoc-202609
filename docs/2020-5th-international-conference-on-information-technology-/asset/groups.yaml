    ## 基于深度学习方法的洪水应急管理多媒体大数据平台


    I.D.T.T.Weerasinghe

    计算与信息系统系

    斯里兰卡萨拉巴古拉大学（Sarabagura University of Sri Lanka）

    B Lanka, Sri Lanka

    dttweerasinghe@std.appsec.sab.lk


    K.P.N.Jayasena

    计算与信息系统系

    斯里兰卡萨拉巴古拉大学

    Belihoya, Sri Lanka

    pubajuda@std.appsec.sab.lk


    **摘要**—洪水应急是几十年来面临的一个重大问题，因为它可能导致严重的财产损失以及水流的相对融化和干涸（溢出）。在水文学中，洪水是一个研究领域，它们是最常见且最不可预测的自然事件。洪水的发生规模从几英寸到几英尺不等，受洪水影响很大。它们也可能发生或缓慢增加。如果洪水影响水平的发生频率非常高，本研究采用深度学习方法进行洪水应急管理。我们使用了多源数据，来自社交媒体网站、卫星图像、众包和传感器网络数据。基于对洪水研究和图像处理前沿技术，当局可以使用所述方法进行识别，为人们提供预警时间，或者人们可以在当天利用此对洪水水位进行自评估，帮助他们拯救生命。深度神经网络在特征提取和数据增强以增加样本数量方面发挥着重要作用。本研究比较了VGG16、VCG19、DenseNet16和MobileNet深度模型，并使用训练和测试数据评估了其性能。数据集包含超过1500个示例，证明MobileNet具有86%的准确率高性能。在论文的后半部分，将描述未来的建议。


    *关键词*—多媒体，大数据，众包，神经网络。


    在早期阶段引导救援预警。对于这样的系统，从灾害位置检索实时散布的洪水水位信息至关重要。相反，现场数据的收集成本极高且风险很大，其范围最小不可忽略。在这里，另一种信息来源是社交媒体网站。人们还可以交换描述情况的文本和照片。这些数据具有廉价且在洪水地区可获取的优势。为了获取信息，主要的缺点是照片需要经过适当处理。一些研究已经检查了社交媒体洪水数据的使用，并已以自动方式提出。我们计划使用深度学习技术来分析图像数据并预测洪水影响水平或风险水平。这里主要通过比较每个模型来考虑现洪水学习模型。


    I. 引言


    “应急”一词被定义为超出通常资源和组织处理能力的异常事件。应急情况的发生由于自然和人为事件。这些事件伴随着很少的警告和预测。洪水管理应急是每个社区面临的全球性挑战
    [1]。为了提供基于预测和恢复的有效洪水管理，对以前或当前的灾害进行快速分析至关重要。本文主要关注自然灾害管理中的洪水应急管理。由于气候变化，预计洪水将变得更加严重和危险。为了尽量减少生命损失，拥有一个可以妥善的洪水应急管理系统是重要的。


    ![](img/743a6e1780ed464787729fa6135e261b_0_0.png)


    图1：1998-2017年全球发生的灾害类型


    图1显示了1998年至2017年间发生的自然灾害类型。它直观地显示，以来洪水一直是影响全世界人类生活的主要灾害。

    当提到斯里兰卡时，国家灾难救援服务机构（NDRCB）宣布洪水数量与去年相比逐年增加。2显示了2014-2019年斯里兰卡受洪水影响的人数。


    978-166... 2020... 2021... 2018...


    ![](img/743a6e1780ed464787729fa6135e261b_0_0.png)


    图2：受洪水影响的人数（2014-2019）


    对于受影响的情况，为了减少受洪水影响的人，拥有一个实时的洪水水位系统是重要的。这种系统可以估计洪水水位。洪水是自然灾害。通过数据处理技术可以提高应急管理的效率。


    ## 相关工作


    洪水影响水平的识别是必要的。在实施之前，进行了文献研究。


    ### A. 社交媒体在洪水估计中的应用


    基于回归的方法。近年来，使用社交媒体数据进行洪水检测的预测 [3-6]。Wang等人利用Twitter数据和众包检测洪水区域。另一种解决方案是利用不同类型的社交数据创建洪水地图
    [7]。基于社区的数据（如视频和图像）已用于洪水预测。[8]表明社交媒体是信息的来源。它还包括从社交媒体获取的非结构化数据的处理挑战。其他研究[6][7]描述了社交媒体的使用对洪水水位的影响。M.
    Smith等人[7]利用Twitter数据开发了洪水风险管理的实时框架。Wang等人利用英语文本估计洪水水位。


    ### B. 用于图像分类的深度学习模型


    这项研究主要取决于深度学习和深度学习技术，我们需要了解深度学习在图像处理领域的应用。


    P.Choudhary等人[10]使用VGG模型作为网络骨干从洪水图像中预测水位。他们通过替换末端层来调模型以减少深度，因为他们想知道水位。Lu等人[11]发现VGG16模型在自然灾害背景下表现良好。视觉显示VGG深度模型适用于大规模图像识别。


    研究[13-15]使用深度学习模型进行图像分类任务。一种为移动视觉提供高效特征的深度模型。Ord. G等人[15]有效地识别了交通检测中的平衡权衡参数。在他们的论文[16]中，Mobile模型被用于名为SSDnet的相关网络框架。一种移动模型的新版本Vmob被用于研究[17]中的目标检测和语义分割。


