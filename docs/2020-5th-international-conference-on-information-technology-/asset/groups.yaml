    # ## E. Confusion Matrix


    The Confusion matrix is used for finding the accuracy and the performances of
    the model for the classification problem where the output is two or more types
    of classes.


    +   * True Positive (TP) = Real label and predicted the label of the sample is
    positive.

    * True Negative (TN) = Real label and predicted the label of the sample is negative.

    * False Negative (FN) = Real label of the sample is positive, and the predicted
    label is negative.

    * False Positive (FP) = Real label of the sample is negative, and the predicted
    label is positive.

    * Real Positives (RP) = Real positives

    * Real Negatives (RN) = Real negatives

    * Predictive Positives (PP) =Predicted Positives

    * Predictive Negatives (PN) =Predicted Negatives


    F1-score defines true positives are considered as twice important as the other
    metrics.


    Accuracy = \frac{TN+TP}{TN+TP+FP+FN}


    Precision = \frac{TP}{TP+FP}


    Recall = \frac{TP}{TP+FN}


    F1Score = \frac{2 \times TP}{2 \times TP+FP+FN}


