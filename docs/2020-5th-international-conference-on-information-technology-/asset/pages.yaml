    I. INTRODUCTION


    The term “emergency” is defined as an exceptional occurrence that exceeds the
    ability of usual resources and organizations to deal with it. Emergencies arise
    because of natural and human-human events. These are liking with little warnings
    and predictions. Flood management emergencies are a global challenge for every
    community [1]. To provide effective flood management based on forecast and recovery,
    rapid analysis of previous or current disasters is critical. This paper mainly
    focuses on flood emergency management in natural disaster management. Flood are
    expected to become more severe and dangerous due to climate change. To minimize
    the loss of human life it is important to have a relative flood emergency management
