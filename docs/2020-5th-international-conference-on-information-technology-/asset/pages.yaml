    **Abstract**—Flood emergency has a major issue dealt with in decades as it can
    cause extensive loss of property as well as overflow of water that melts relatively
    and dry. In the hydrology, floods are a field of study and they are the most common
    and unpredictable natural events. Floods occur from a few inches of water to quite
    feet because is affected by flooding. They can also occur on, or slowly increase.
    If frequent frequency of flood impact levels is very high, this study uses a deep
    learning approach for flood emergency management. We use multiple data as which
    are from social media sites, satellite imagery, crowdsourcing, and sensor network
    data. Based on research on flood and image processing cutting technologies, authorities
    can identify using stated methods to provide early warning time for the people
    or people can use this for self-assessment of flood level when they are in that
    day to help them save lives. The deep neural network plays a major role in feature
    extraction and data augmentation to increase the number of samples. This study
    compares study between VGG16, VCG19, DenseNet16 and MobileNet deep models and
    evaluates the performance using training and testing data. Datasets comprises
    over 1500 examples drawn from work prove that the MobileNet worked with 86% accuracy
    high performance. In the latter part of the paper, it will describe future recommendations.


    *Keywords*— multimedia, big data, crowdsourcing, Neural network.


