    A natural disaster like a flood is a significant and non-trivial problem. To detect
    various disasters, a traditional method relies on specialized sensors. With advances
    in information communication technology we can improve the efficiency and accuracy
    of emergency management systems through data processing techniques. They help
    decision-makers to understand real-time data related to flood and collect and
    process using deep learning techniques, which may provide valuable insights into
    flood emergency management.


    # ## RELATED WORKS


    Flood impact level identification is necessary for reducing the risk associated
    with the flooding areas. Before doing directly for an implementation, a study
    of the previous work is necessary to get domain knowledge and identify the available
    mechanism, techniques, and approach. As it is a comparative study, knowing used
    technology is essential. As the initial phase of the methodology, a review was
    conducted to get the domain knowledge.


    # A. Social media usage in flood estimation


    P.Choudhary et al. proposed a multi-task learning approach based on the regression
    and pairwise ranking method [2]. They used a DEEPFLOOD dataset that contains 8145
    images that contain different water levels. Recent years have seen an increase
    in using multimedia data from social media for flood detection, visualization,
    and prediction. This research has the benefit of being accurate in real-time,
    while it is also to collect the data using social media for flood detection and
    prediction [3-6]. Wang et al. in Twitter data and crowdsourcing to detect the
    event of the flood region using regression.


    Another solution is creating a flood map by identifying areas using. [7] studies
    identified creating flood maps using different types of social data. Community-based
    data such as videos and images have been used for flood prediction. [8] have revealed
    that social media is an information source for rapid flood inundation. It also
    includes the challenges of processing unstructured data obtained from social media.
    Other studies such as [6][7] described the impact of social media usage in flood
    levels. M. Smith et al [7]Used Twitter data to develop a real-time framework for
    flood risk management.


    Wang et al used Twitter text to estimate flood level using English text analysis.
    Authors have demonstrated that they also used natural language processing (NLP)
    for the text message content


    # B. The deep learning model for image classification


    This research mainly depends on cutting-edge technology called deep learning and
    deep learning techniques which we need to get about deep learning applications
    in the image processing sector.


    P.Choudhary et al[10] used the VGG model as the network backbone to predict the
    water level from flood images. They fine-tuned the model by replacing final layers
    to reduce the scale depth as they want to know the water level. Lu et al [11]
    have found that the VGG16 model performs well in the context of natural disasters.
    Visual revealed that VGG deep models are suitable for large scale image recognition.


    Studies such as [13-15] Used Deep learning models for the image classification
