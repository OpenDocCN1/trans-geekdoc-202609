- raw: "When starting with ML in accounting, focus on well-defined problems with clear\
    \ potential for ROI. For example, you might begin by implementing an ML model\
    \ to automate the categorization of expenses. This is a relatively straightforward\
    \ task that can save significant time and reduce errors, providing a tangible\
    \ benefit that can help build support for further ML initiatives.\n\nResource\n\
    \nFor a comprehensive overview of AI's impact on the accounting profession, check\
    \ out \"AI and the Future of Accountancy\" by ICAEW: [https://www.icaew.com/technical/technology/artificial-intelligence/ai-articles/ai-and-the-future-of-accountancy](https://www.icaew.com/technical/technology/artificial-intelligence/ai-articles/ai-and-the-future-of-accountancy)\n\
    \nChapter Summary\n\nThis chapter has introduced the concept of machine learning\
    \ in accounting, highlighting its potential benefits and challenges. We've provided\
    \ an overview of relevant ML algorithms and explored real-world applications in\
    \ accounting firms.\n\nMachine learning is not a magic solution, but a powerful\
    \ tool that, when applied thoughtfully, can significantly enhance accounting practices.\
    \ As we move forward, we'll delve deeper into specific applications, providing\
    \ practical examples and guidance on implementing ML in various aspects of accounting\
    \ work.\n\nIn the next chapter, we'll discuss the critical process of data preparation\
    \ and preprocessing, which forms the foundation for successful ML projects in\
    \ accounting.\n\nChapter 2: Data Preparation and Preprocessing for Accounting\
    \ ML Projects\n\n2.1 Understanding Accounting Data Types and Structures\n\nIn\
    \ the world of accounting, data comes in various forms and structures. Understanding\
    \ these different types of data is crucial for effective machine learning implementation.\
    \ Here are the main types of data you're likely to encounter:\n\n1.  Transactional\
    \ Data: This includes individual financial transactions, such as sales, purchases,\
    \ and payments. It typically contains information like date, amount, account codes,\
    \ and descriptions.\n\n2.  General Ledger Data: This is a summary of all financial\
    \ transactions, organized by account. It forms the basis for financial statements.\n\
    \n3.  Financial Statements: These include balance sheets, income statements, and\
    \ cash flow statements. They provide a structured view of a company's financial\
    \ position.\n\n4.  Metadata: This includes information about the data itself,\
    \ such as account hierarchies, cost center structures, or product categorizations.\n\
    \n5.  Unstructured Data: This can include text from invoices, contracts, or financial\
    \ reports. While not traditionally used in accounting analysis, ML techniques\
    \ like Natural Language Processing (NLP) can extract valuable insights from this\
    \ data.\n\n6.  Time Series Data: Much of accounting data is time-based, such as\
    \ daily sales figures or monthly account balances.\n\n7.  Categorical Data: This\
    \ includes non-numeric data like account types, transaction categories, or customer\
    \ segments.\n\nUnderstanding these data types is crucial because different ML\
    \ algorithms are better suited to different types of data. For example, time series\
    \ algorithms are appropriate for forecasting future values based on historical\
    \ trends, while classification algorithms can be used to categorize transactions\
    \ or detect anomalies.\n\n2.2 Data Cleaning Techniques for Financial Datasets\n\
    \nData cleaning is a critical step in any ML project, and it's particularly important\
    \ in accounting where data accuracy is paramount. Here are some key data cleaning\
    \ techniques for financial datasets:\n\n1.  Handling Missing Values:\n\n    *\
    \   For numerical data, consider using mean, median, or mode imputation.\n\n \
    \   *   For categorical data, you might use mode imputation or create a new category\
    \ for missing values.\n\n    *   In some cases, it might be appropriate to drop\
    \ rows with missing values, but be cautious as this can introduce bias.\n\n2.\
    \  Dealing with Outliers:\n\n    *   Use statistical methods like z-score or Interquartile\
    \ Range (IQR) to identify outliers.\n\n    *   Investigate outliers to determine\
    \ if they're genuine anomalies or data errors.\n\n    *   Consider capping outliers\
    \ (winsorization) rather than removing them, especially in financial data where\
    \ extreme values can be significant.\n\n3.  Standardizing Formats:\n\n    *  \
    \ Ensure consistent date formats across your dataset.\n\n    *   Standardize currency\
    \ values to a single currency if dealing with international data.\n\n    *   Normalize\
    \ text data (e.g., consistent capitalization, removing extra spaces).\n\n4.  Handling\
    \ Duplicates:\n\n    *   Identify and remove duplicate transactions, being careful\
    \ to distinguish between genuine duplicates and legitimate repeated transactions.\n\
    \n5.  Data Type Conversion:\n\n    *   Ensure that data types are appropriate\
    \ for your analysis (e.g., dates stored as dates, not strings).\n\n6.  Addressing\
    \ Inconsistencies:\n\n    *   Look for and correct inconsistencies in categorical\
    \ data (e.g., \"Cash\" vs. \"cash\" vs. \"CASH\").\n\n    *   Check for and resolve\
    \ inconsistencies in account names or codes.\n\n2.3 Feature Engineering for Accounting-Specific\
    \ ML Models\n\nFeature engineering is the process of creating new features from\
    \ existing data to improve the performance of ML models. In accounting, this often\
    \ involves creating meaningful financial ratios or indicators. Here are some examples:\n\
    \n1.  Financial Ratios:\n\n    *   Liquidity ratios (e.g., Current Ratio = Current\
    \ Assets / Current Liabilities)\n\n    *   Profitability ratios (e.g., Net Profit\
    \ Margin = Net Income / Revenue)\n\n    *   Efficiency ratios (e.g., Inventory\
    \ Turnover = Cost of Goods Sold / Average Inventory)\n\n2.  Time-Based Features:\n\
    \n    *   Day of week, month, or quarter for transactional data\n\n    *   Time\
    \ since last transaction\n\n    *   Rolling averages or sums (e.g., 3-month rolling\
    \ average of sales)\n\n3.  Categorical Encodings:\n\n    *   One-hot encoding\
    \ for account types or transaction categories\n\n    *   Target encoding for high-cardinality\
    \ categorical variables\n\n4.  Text-Based Features:\n\n    *   TF-IDF scores for\
    \ important words in transaction descriptions\n\n    *   Sentiment scores for\
    \ textual financial data (e.g., from financial reports)\n\n5.  Interaction Features:\n\
    \n    *   Combinations of existing features that might be meaningful (e.g., Gross\
    \ Profit \\* Inventory Turnover)\n\n6.  Domain-Specific Features:\n\n    *   Days\
    \ Sales Outstanding (DSO) = (Accounts Receivable / Total Credit Sales) \\* Number\
    \ of Days\n\n    *   Z-score for predicting bankruptcy risk\n\nRemember, the goal\
    \ of feature engineering is to create features that capture meaningful patterns\
    \ in your data. The specific features you create will depend on your particular\
    \ use case and the insights you're trying to gain.\n\n2.4 Handling Imbalanced\
    \ Datasets in Fraud Detection Scenarios\n\nFraud detection is a common application\
    \ of ML in accounting, but it presents a particular challenge: imbalanced datasets.\
    \ In most cases, fraudulent transactions are rare compared to legitimate ones,\
    \ which can lead to ML models that are biased towards the majority class. Here\
    \ are some techniques to address this:\n\n1.  Oversampling the Minority Class:\n\
    \n    *   Random Oversampling: Randomly duplicate instances from the minority\
    \ class.\n\n    *   Synthetic Minority Over-sampling Technique (SMOTE): Create\
    \ synthetic examples of the minority class.\n\n2.  Undersampling the Majority\
    \ Class:\n\n    *   Random Undersampling: Randomly remove instances from the majority\
    \ class.\n\n    *   Tomek Links: Remove majority class instances that are close\
    \ to minority class instances.\n\n3.  Combination Methods:\n\n    *   SMOTEENN:\
    \ Combine SMOTE with Edited Nearest Neighbors.\n\n    *   SMOTETomek: Combine\
    \ SMOTE with Tomek Links.\n\n4.  Algorithmic-Level Approaches:\n\n    *   Use\
    \ algorithms that allow for class weighting (e.g., weighted random forests).\n\
    \n    *   Use anomaly detection algorithms instead of binary classification.\n\
    \n5.  Ensemble Methods:\n\n    *   Bagging-based ensembles with appropriate sampling\
    \ techniques."
  fmt: "\nWhen starting with ML in accounting, focus on well-defined problems with\
    \ clear potential for ROI. For example, you might begin by implementing an ML\
    \ model to automate the categorization of expenses. This is a relatively straightforward\
    \ task that can save significant time and reduce errors, providing a tangible\
    \ benefit that can help build support for further ML initiatives.\n\n### Resource\n\
    For a comprehensive overview of AI's impact on the accounting profession, check\
    \ out \"AI and the Future of Accountancy\" by ICAEW: [https://www.icaew.com/technical/technology/artificial-intelligence/ai-articles/ai-and-the-future-of-accountancy](https://www.icaew.com/technical/technology/artificial-intelligence/ai-articles/ai-and-the-future-of-accountancy)\n\
    \n### Chapter Summary\nThis chapter has introduced the concept of machine learning\
    \ in accounting, highlighting its potential benefits and challenges. We've provided\
    \ an overview of relevant ML algorithms and explored real-world applications in\
    \ accounting firms.\n\nMachine learning is not a magic solution, but a powerful\
    \ tool that, when applied thoughtfully, can significantly enhance accounting practices.\
    \ As we move forward, we'll delve deeper into specific applications, providing\
    \ practical examples and guidance on implementing ML in various aspects of accounting\
    \ work.\n\nIn the next chapter, we'll discuss the critical process of data preparation\
    \ and preprocessing, which forms the foundation for successful ML projects in\
    \ accounting.\n\n# Chapter 2: Data Preparation and Preprocessing for Accounting\
    \ ML Projects\n\n## 2.1 Understanding Accounting Data Types and Structures\nIn\
    \ the world of accounting, data comes in various forms and structures. Understanding\
    \ these different types of data is crucial for effective machine learning implementation.\
    \ Here are the main types of data you're likely to encounter:\n1. Transactional\
    \ Data: This includes individual financial transactions, such as sales, purchases,\
    \ and payments. It typically contains information like date, amount, account codes,\
    \ and descriptions.\n2. General Ledger Data: This is a summary of all financial\
    \ transactions, organized by account. It forms the basis for financial statements.\n\
    3. Financial Statements: These include balance sheets, income statements, and\
    \ cash flow statements. They provide a structured view of a company's financial\
    \ position.\n4. Metadata: This includes information about the data itself, such\
    \ as account hierarchies, cost center structures, or product categorizations.\n\
    5. Unstructured Data: This can include text from invoices, contracts, or financial\
    \ reports. While not traditionally used in accounting analysis, ML techniques\
    \ like Natural Language Processing (`NLP`) can extract valuable insights from\
    \ this data.\n6. Time Series Data: Much of accounting data is time-based, such\
    \ as daily sales figures or monthly account balances.\n7. Categorical Data: This\
    \ includes non-numeric data like account types, transaction categories, or customer\
    \ segments.\n\nUnderstanding these data types is crucial because different ML\
    \ algorithms are better suited to different types of data. For example, time series\
    \ algorithms are appropriate for forecasting future values based on historical\
    \ trends, while classification algorithms can be used to categorize transactions\
    \ or detect anomalies.\n\n## 2.2 Data Cleaning Techniques for Financial Datasets\n\
    Data cleaning is a critical step in any ML project, and it's particularly important\
    \ in accounting where data accuracy is paramount. Here are some key data cleaning\
    \ techniques for financial datasets:\n1. Handling Missing Values:\n   * For numerical\
    \ data, consider using `mean`, `median`, or `mode` imputation.\n   * For categorical\
    \ data, you might use `mode` imputation or create a new category for missing values.\n\
    \   * In some cases, it might be appropriate to drop rows with missing values,\
    \ but be cautious as this can introduce bias.\n2. Dealing with Outliers:\n   *\
    \ Use statistical methods like `z-score` or `Interquartile Range (IQR)` to identify\
    \ outliers.\n   * Investigate outliers to determine if they're genuine anomalies\
    \ or data errors.\n   * Consider capping outliers (`winsorization`) rather than\
    \ removing them, especially in financial data where extreme values can be significant.\n\
    3. Standardizing Formats:\n   * Ensure consistent date formats across your dataset.\n\
    \   * Standardize currency values to a single currency if dealing with international\
    \ data.\n   * Normalize text data (e.g., consistent capitalization, removing extra\
    \ spaces).\n4. Handling Duplicates:\n   * Identify and remove duplicate transactions,\
    \ being careful to distinguish between genuine duplicates and legitimate repeated\
    \ transactions.\n5. Data Type Conversion:\n   * Ensure that data types are appropriate\
    \ for your analysis (e.g., dates stored as dates, not strings).\n6. Addressing\
    \ Inconsistencies:\n   * Look for and correct inconsistencies in categorical data\
    \ (e.g., \"Cash\" vs. \"cash\" vs. \"CASH\").\n   * Check for and resolve inconsistencies\
    \ in account names or codes.\n\n## 2.3 Feature Engineering for Accounting-Specific\
    \ ML Models\nFeature engineering is the process of creating new features from\
    \ existing data to improve the performance of ML models. In accounting, this often\
    \ involves creating meaningful financial ratios or indicators. Here are some examples:\n\
    1. Financial Ratios:\n   * Liquidity ratios (e.g., `Current Ratio = Current Assets\
    \ / Current Liabilities`)\n   * Profitability ratios (e.g., `Net Profit Margin\
    \ = Net Income / Revenue`)\n   * Efficiency ratios (e.g., `Inventory Turnover\
    \ = Cost of Goods Sold / Average Inventory`)\n2. Time-Based Features:\n   * Day\
    \ of week, month, or quarter for transactional data\n   * Time since last transaction\n\
    \   * Rolling averages or sums (e.g., 3-month rolling average of sales)\n3. Categorical\
    \ Encodings:\n   * One-hot encoding for account types or transaction categories\n\
    \   * Target encoding for high-cardinality categorical variables\n4. Text-Based\
    \ Features:\n   * `TF-IDF` scores for important words in transaction descriptions\n\
    \   * Sentiment scores for textual financial data (e.g., from financial reports)\n\
    5. Interaction Features:\n   * Combinations of existing features that might be\
    \ meaningful (e.g., `Gross Profit * Inventory Turnover`)\n6. Domain-Specific Features:\n\
    \   * `Days Sales Outstanding (DSO) = (Accounts Receivable / Total Credit Sales)\
    \ * Number of Days`\n   * `Z-score` for predicting bankruptcy risk\n\nRemember,\
    \ the goal of feature engineering is to create features that capture meaningful\
    \ patterns in your data. The specific features you create will depend on your\
    \ particular use case and the insights you're trying to gain.\n\n## 2.4 Handling\
    \ Imbalanced Datasets in Fraud Detection Scenarios\nFraud detection is a common\
    \ application of ML in accounting, but it presents a particular challenge: imbalanced\
    \ datasets. In most cases, fraudulent transactions are rare compared to legitimate\
    \ ones, which can lead to ML models that are biased towards the majority class.\
    \ Here are some techniques to address this:\n1. Oversampling the Minority Class:\n\
    \   * `Random Oversampling`: Randomly duplicate instances from the minority class.\n\
    \   * Synthetic Minority Over-sampling Technique (`SMOTE`): Create synthetic examples\
    \ of the minority class.\n2. Undersampling the Majority Class:\n   * `Random Undersampling`:\
    \ Randomly remove instances from the majority class.\n   * `Tomek Links`: Remove\
    \ majority class instances that are close to minority class instances.\n3. Combination\
    \ Methods:\n   * `SMOTEENN`: Combine `SMOTE` with Edited Nearest Neighbors.\n\
    \   * `SMOTETomek`: Combine `SMOTE` with `Tomek Links`.\n4. Algorithmic-Level\
    \ Approaches:\n   * Use algorithms that allow for class weighting (e.g., weighted\
    \ random forests).\n   * Use anomaly detection algorithms instead of binary classification.\n\
    5. Ensemble Methods:\n   * Bagging-based ensembles with appropriate sampling techniques.\n"
  trans: "\n在会计中开始使用 ML 时，重点关注具有明确投资回报潜力且定义良好的问题。例如，你可以先实施一个 ML 模型来自动化费用分类。这是一项相对直接的任务，可以节省大量时间并减少错误，提供切实的好处，有助于为进一步的\
    \ ML 计划建立支持。\n\n### 资源\n为了全面了解人工智能对会计职业的影响，请查看 ICAEW 出版的“人工智能与会计的未来”：[`www.icaew.com/technical/technology/artificial-intelligence/ai-articles/ai-and-the-future-of-accountancy`](https://www.icaew.com/technical/technology/artificial-intelligence/ai-articles/ai-and-the-future-of-accountancy)\n\
    \n### 章节摘要\n本章介绍了会计中机器学习的概念，强调了其潜在的益处和挑战。我们提供了相关 ML 算法的概述，并探讨了会计师事务所中的实际应用。\n\n\
    机器学习不是万能的解决方案，而是一种强大的工具，只要慎重应用，就能显著提升会计实践。随着我们继续推进，我们将深入探讨具体应用，提供实践示例以及在会计工作的各个方面实施\
    \ ML 的指导。\n\n在下一章中，我们将讨论数据准备和预处理这一关键流程，它是会计 ML 项目成功的基石。\n\n# 第 2 章：会计 ML 项目的数据准备和预处理\n\
    \n## 2.1 了解会计数据类型和结构\n在会计领域，数据以各种形式和结构出现。了解这些不同的数据类型对于有效实施机器学习至关重要。以下是你可能会遇到的主要数据类型：\n\
    1. 交易数据：这包括单独的财务交易，例如销售、采购和付款。通常包含日期、金额、账户代码和描述等信息。\n2. 总账数据：这是按账户组织的全部财务交易的汇总。它构成了财务报表的基石。\n\
    3. 财务报表：包括资产负债表、损益表和现金流量表。它们提供了公司财务状况的结构化视图。\n4. 元数据：这包括关于数据本身的信息，例如账户层级、成本中心结构或产品分类。\n\
    5. 非结构化数据：这可能包括发票、合同或财务报告中的文本。虽然在传统会计分析中并不常用，但像自然语言处理（`NLP`）这样的 ML 技术可以从这些数据中提取有价值的见解。\n\
    6. 时间序列数据：会计数据的很大一部分是基于时间的，例如每日销售额或每月账户余额。\n7. 分类数据：这包括非数值数据，如账户类型、交易类别或客户细分。\n\
    \n了解这些数据类型至关重要，因为不同的 ML 算法更适合不同类型的数据。例如，时间序列算法适用于根据历史趋势预测未来值，而分类算法可用于对交易进行分类或检测异常。\n\
    \n## 2.2 财务数据集的数据清洗技术\n数据清洗是任何 ML 项目的关键步骤，在会计中尤其重要，因为数据准确性至关重要。以下是一些财务数据集的数据清洗技术：\n\
    1. 处理缺失值：\n   * 对于数值数据，可考虑使用 `mean`、`median` 或 `mode` 插补。\n   * 对于分类数据，你可以使用 `mode`\
    \ 插补或为缺失值创建新类别。\n   * 在某些情况下，可能适合删除缺失值的行，但要谨慎，因为这会引入偏差。\n2. 处理异常值：\n   * 使用统计方法如\
    \ `z-score` 或 `Interquartile Range (IQR)` 来识别异常值。\n   * 调查异常值以确定它们是真实异常还是数据错误。\n\
    \   * 考虑对异常值进行上限处理（`winsorization`）而不是删除它们，尤其是在财务数据中极端值可能很重要。\n3. 标准化格式：\n   *\
    \ 确保数据集中日期格式一致。\n   * 如果处理国际数据，将货币值标准化为单一货币。\n   * 规范化文本数据（例如一致的大写、删除多余空格）。\n\
    4. 处理重复项：\n   * 识别并删除重复交易，同时注意区分真正的重复项和合法的重复交易。\n5. 数据类型转换：\n   * 确保数据类型适合你的分析（例如日期以日期存储，而不是字符串）。\n\
    6. 解决不一致问题：\n   * 查找并纠正分类数据中的不一致（例如“Cash” vs. “cash” vs. “CASH”）。\n   * 检查并解决账户名称或代码中的不一致。\n\
    \n## 2.3 会计专用 ML 模型的特征工程\n特征工程是从现有数据中创建新特征以提高 ML 模型性能的过程。在会计中，这通常涉及创建有意义的财务比率或指标。以下是一些示例：\n\
    1. 财务比率：\n   * 流动性比率（例如，`Current Ratio = Current Assets / Current Liabilities`）\n\
    \   * 盈利能力比率（例如，`Net Profit Margin = Net Income / Revenue`）\n   * 效率比率（例如，`Inventory\
    \ Turnover = Cost of Goods Sold / Average Inventory`）\n2. 基于时间的特征：\n   * 交易数据的星期几、月份或季度\n\
    \   * 距上次交易的时间\n   * 滚动平均值或总和（例如，销售额的 3 个月滚动平均值）\n3. 分类编码：\n   * 账户类型或交易类别的独热编码\n\
    \   * 高基数分类变量的目标编码\n4. 基于文本的特征：\n   * 交易描述中重要词的 `TF-IDF` 得分\n   * 文本财务数据的情感得分（例如，来自财务报告）\n\
    5. 交互特征：\n   * 可能有意义的现有特征组合（例如，`Gross Profit * Inventory Turnover`）\n6. 领域特定特征：\n\
    \   * `Days Sales Outstanding (DSO) = (Accounts Receivable / Total Credit Sales)\
    \ * Number of Days`\n   * 用于预测破产风险的 `Z-score`\n\n记住，特征工程的目标是创建能够捕捉数据中有意义模式的特征。你创建的具体特征将取决于你的特定用例和你希望获得的见解。\n\
    \n## 2.4 欺诈检测场景中不平衡数据集的处理\n欺诈检测是会计中 ML 的常见应用，但它带来了一个特定挑战：不平衡数据集。在大多数情况下，欺诈交易相对于合法交易很少，这可能导致\
    \ ML 模型偏向多数类。以下是一些应对方法：\n1. 过采样少数类：\n   * `Random Oversampling`：随机复制少数类实例。\n \
    \  * 合成少数类过采样技术（`SMOTE`）：创建少数类的合成示例。\n2. 欠采样多数类：\n   * `Random Undersampling`：随机删除多数类实例。\n\
    \   * `Tomek Links`：删除接近少数类实例的多数类实例。\n3. 组合方法：\n   * `SMOTEENN`：将 `SMOTE` 与编辑最近邻结合。\n\
    \   * `SMOTETomek`：将 `SMOTE` 与 `Tomek Links` 结合。\n4. 算法级方法：\n   * 使用允许类别加权的算法（例如加权随机森林）。\n\
    \   * 使用异常检测算法而不是二元分类。\n5. 集成方法：\n   * 具有适当采样技术的基于 Bagging 的集成。\n\n"
