    # Standards - Finally


    One more test for Blockchain is the absence of guidelines. Somehow or another,
    this is driving development as sellers bring their adaptation of various Blockchain
    elements and capacities to the market. Yet, what number of agreement strategies
    are truly required? Is there one, most ideal way to run a savvy contract? What
    number of programming and prearranging dialects are expected to code useful expansions
    to Blockchain? In this way, while blockchain is a thrilling innovation, challenges
    remain.


    ## Blockchain Is Not for Everything


    I trust at this point, you have a reasonable thought of what a blockchain is and
    what it isn’t. However strong as Blockchain innovation may be, it isn’t for everything.
    For instance, Blockchain isn’t appropriate for high volume exchanges that need
    millisecond reaction time. As we found in Chapter 9, the most noteworthy exchange
    throughput of any current Blockchain is 1,500 exchanges each second from `Ripple`.
    `EOS`, assuming it experiences its guarantee, may outperform that level, yet high-volume
    exchange kind of uses are not appropriate for Blockchain.


    You additionally needn’t bother with a Blockchain for applications that don’t
    need different organizations or members in an organization. Blockchain is for
    dispersed organization, and the bigger the applications, the safer, the application.
    If your application is entirely internal, then a Blockchain is not needed. Blockchains
    are not appropriate as an arbitrary access information base. Since there is no
    indexing scheme in blockchain, then applications that require multiple indexes
    and views of the data would not be a good fit for Blockchain. Prior to settling
    on blockchain to assemble your application, be certain the assess the models that
    was talked about before in this chapter.


    ## Conclusion


    There is no doubt that Blockchain is the Next Big Thing in figuring. It vows to
    fundamentally diminish, smooth out, or wipe out sure administrative center capacities
    yielding gigantic likely investment funds to partnerships and legislatures. Believed
    different middle people can be dispensed with organization agreement strategies
    for Blockchain. A full history is consequently kept as an ordinary capacity of
    blockchain. Using progressed cryptography and computerized personalities, Blockchain
    is changeless. Blockchain oppose changes whenever information is put away and
    the further back in the Blockchain and the bigger the organization, the more troublesome
    it is to make changes.


    But, there are still many challenges left for the Blockchain world. The uncertainty
    around regulations and compliance is a big concern. The outsiders and the network
    effect can keep potential Blockchain projects from ever getting off the drawing
    board. Will all the participants needed for the Blockchain to be effective, choose
    to participate? Lack of standards in several areas like consensus, smart contracts,
    scripting languages, block size, etc. make understanding Blockchains confusing.
    This leaves organizations with the warm and fuzzy feeling that the investment
    they are making in one of the many current approaches to Blockchain might end
    up the way of Betamax recorders. They work, but you are on the outside looking
    in as another approach becomes the standard for a whole industry.


    When stronger standards are agreed upon, this will only increase the adoption
    rate of Blockchain. Finally, Blockchain needs to be better understood in terms
    of what it can and what it cannot do which will ultimately lead to broader acknowledgment.
    Ideally, this book assisted you with your understanding of Blockchain.

