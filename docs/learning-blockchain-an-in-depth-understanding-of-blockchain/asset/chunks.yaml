    # 投资

    第一个元素是矿工或验证者需要投入的投资水平。潜在的验证者或矿工为了能够处理交易和验证区块需要投入什么？例如，如果使用比特币的 `Proof of Work`（工作量证明）方法达成共识（我们将在几页后详细介绍），则需要对专用硬件进行前期投资，并持续投入大量电力来解决由名为
    `hash` 的数学函数组成的谜题。这项任务简单但极其重复，因此计算成本很高。计算机通过竞争来寻找具有特定属性的 `hash`。第一个找到答案的矿工——即他们已完成必要工作的证明——将被允许向区块链添加一个新的交易区块。其他共识方法，如
    `Proof of Stake`（权益证明）或其他 `Proof of Work` 实现，对处理资源或电力消耗不会产生同样的压力。而且，由于验证者/矿工必须投资才能参与，那么需要什么样的激励来使验证者/矿工的利益与区块链网络的最佳利益保持一致呢？通常，通过交易费、新铸代币或两者来激励验证者/矿工诚实行为。


    # 选择领导者

    接下来是考虑如何从验证者/矿工池中选择领导者（验证者/矿工）。大多数共识方法涉及某种抽签机制，随机选择矿工或验证者来提交区块并最终添加到区块链中。其他协议策略利用粗略的决策并对选定的成员进行协作选择。有几种不同的方法论需要考虑，我们将在书的后后部分详细描述各种协议计算时，通用地介绍这些方法。


    # 证明元素

    将使用哪种证明元素？图 33 显示了你可以选择的部分列表。新的验证方法不断提出，因此这在程度上是一个动态目标。我们将在课程的后续章节中详细介绍其中的每一个项。


    ![](img/image00104.jpeg)

    图 33 - 可用验证元素的部分概述


    # 信任水平

    最后一个组件是你的组织中存在的信任程度。假设你看一眼 `TrustO-Meter`（信任计量表），你会发现它显示了一个介于数学和政府问题之间的刻度。按照原则，区块链用数学取代了处理交换的政府问题。该组织将成为一个完全去信任的组织，就像公共区块链的情况吗？如果是这样，你可以完全依赖数学来检查交换。图
    34 显示了公共区块链的 `Trust-O-Meter` 读。注意红球尽可能地位于读数的数学一侧。


    ![](img/image00105.jpeg)

    图 34 - 公共区块链的 Trust-O-Meter 查看


    另一方面，假设该组织是私有的，由信任的成员组成，`TrustO-Meter` 可以缩小对所有数学处理的需求，并公平地依赖于组织内部的信任。考虑到所有因素，红球将尽可能偏向
    `TrustO-Meter` 的法律问题一侧。


    ## 不同共识算法的目标

    每种独特的协议技术都有特定的目标，这些目标驱动了协议计算的运行方式以及消耗哪些资产。协议计算还会考虑四个额外目标：


    1. 性能

    2. 可扩展性

    3. 针对潜在外部攻击的威胁防御

    4. 失败模型


    ### 性能

    某些利用区块链的应用程序需要更高的吞吐量来处理更大规模的交易。例如，比特币区块链每个周期仅处理六次交换，这对于高量应用来说延迟太大了。其他区块链利用不同的协议计算来实现更好的性能。


    ### 可扩展性

    接下来是通用性，其理念是：取决于应用程序，支持更多数量的并发客户端是选择协议算法的考虑因素。


    ### 威胁防御

    区块链应该考虑各种风险模型，以获得抵御攻击的选择。假设攻击无法被完全阻止，区块链需要使发起攻击的成本高于其作为区块链公平挖矿者/验证者的预期收益。例如，工作量证明机制充分保护了区块链环境免受“51%攻击”。这种观点是，如果一个程序员的处理能力超过了组织总处理能力的一半，他们就可以质疑并提交处理数学伪造的区块，这在他们负责期间可能需要考虑双倍支出或不同的异常。这在当今的比特币领域是一个奢侈的假设，而且考虑到所有因素，是不可能的。


    我们在这里注意到的另一个模型是“女巫攻击”（Sybil Attack），即通过在区块链矿工/验证者池中伪造身份来破坏受信任框架。再次，这可能给程序员带来被选为区块验证者的倾斜，并向区块链引入虚假区块。有几种不同的攻击方式且新的攻击不断出现，但破坏此类攻击是每个协议算法的考虑。


    ### 失败模型

    最后，由于区块链跨越组织运行，节点故障可能是组织处理的常见结果（而非由于恶意攻击）。区块链应该能够承受特定数量此类故障。通过对内部故障协议计算的合理拜占庭适应，可以承受高达
    33% 的节点故障，同时框架可以继续正常处理区块。


    现在我们已经知道了协议计算的考量和目标，我们应该开始对不同方法进行详细评估，并从工作量证明开始，这是 Satoshi Nakamoto 白皮书中的第一个协议计算。


    # 工作量证明

    再次，我喜欢从定义开始这个主题的讨论。见下图 35：


    ![](img/image00106.jpeg)

    图 35 - 工作量证明定义


    工作量证明要求提议区块的去中心化成员证明他们在这样做时投入了巨大的处理能力。你将在第一章中讨论“挖矿”时回顾过“随机数”（nonce）的概念。我们应该研究挖矿过程。


    # 挖矿工作量证明

    挖矿系统的初始阶段是确定目标哈希。目标哈希受框架给出的难度因子影响并用于目标哈希估计。挖掘方法的另一个贡献是区块头信息，它包含 Merkle 根、时间戳、版本、前一个区块哈希、随机数和
    nBits 难度，这些共同构成 `SHA256D` 哈希计算并产生哈希。然后查看这两个哈希：目标哈希和由 `SHA256D` 产生的哈希。见下图 36 并注意这些步骤。


    ![](img/image00107.jpeg)

    图 36 - 工作量证明挖矿过程的输入


