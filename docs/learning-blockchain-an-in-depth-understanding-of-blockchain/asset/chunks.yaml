  trans: "\n生成的哈希值小于目标哈希值吗？如果答案为 `no`，则 `nonce` 加 1，并将带有新 `nonce` 值的所有相同数据重新输入哈希算法。只要后续的哈希值评估高于目标哈希值，这种\
    \ `nonce` 递增和另一个哈希值的获取就会循环进行。最后，某个价值的 `nonce` 值与其他区块信息混合后，当工作量证明难题解决时，将产生一个不完全等于目标值的哈希值，矿工由此获得奖励。图\
    \ 37 显示了比较 `SHA256` 哈希与目标哈希值的逻辑循环。\n\n![](img/image00108.jpeg)*图 37 - 检查创建的哈希值与目标哈希值*\n\
    \n出于交易所稳定性和低休眠性的考虑，该组织尝试定期发布一个区块。因此，每隔 2016 个区块（假设这个十分钟产生一个区块的目标无无执行，则需要两周），每位比特币客户都会查看产生这些区块所需的实际时间与十四天的目标进行比较，并根据速率差异调整难度系数。这使得工作量证明问题变得更加困难或更加容易。为了防止难度的过大调整，单个目标的变化从不会超过四个元素的幅度（无论是向上还是向下）。这是比特币工作量计算验证如何运作的范例。其他工作量证明区块链具有不同的边界和不同的难度算法。\n\
    \n## 工作量证明工作流\n\n由于交易被汇组成区块链上的区块，工作量证明流程如图 38 所示。\n\n![](img/image00109.jpeg)*图\
    \ 38 - 工作量证明流程图*\n\n1. 第一步大约每 10 分钟发生一次，聚合的交易被通信并排序。这并不是一个连续的循环，当矿工开始处理一个交易区块时，每一个交易都要等待\
    \ 10 分钟以等待下一组交易。不断演变的交易“内存池”（mempool）（以及每个节点 `h` 独一无二的内存池）加载了大量但未确认（尚未放入区块）的交易。矿工利用这些（可能包括来自\
