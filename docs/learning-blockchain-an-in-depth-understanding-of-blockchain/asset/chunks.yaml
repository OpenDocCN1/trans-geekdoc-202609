    现在将区块链重置为图 9 所示的初始状态。如果在第一个区块的数据字段输入“Hi”，会发生什么？下面的图 11 显示了结果。


    ![](img/image00086.jpeg) *图 11 - 更改区块链溯源信息引起的链式反应*


    哇！这里发生了什么？更改第一个方格触发了跨越区块链的链式反应（意料之中的）！我们应该进行一次缓慢的重放，逐步观察区块链是如何对第一个区块中的信息差异做出响应的。


    ### 步骤 1：输入“Howdy”改变了方格中的信息，导致哈希重新计算。


    ![](img/image00087.jpeg) *图 12 - 步骤 1，组合“Hello there”导致区块哈希重新计算*


    ### 步骤 2：新哈值显然不是匹配该方格的哈希，导致该方格失效。这通过方格变为红色可以看出。


    ![](img/image00088.jpeg) *图 13 - 步骤 2，新哈值完全不是一个匹配哈希*


    ### 步骤 3：确定的新哈值被刷新到下一个区块的上一个哈希字段中。


    ![](img/image00089.jpeg) *图 14 - 步骤 3，新哈值刷新到下一个区块的上一个哈希字段中*


    ### 步骤 4：上一个哈希信息字段的更改改变了区块二的信息，导致方格 2 的哈希重新计算。


    ![](img/image00090.jpeg) *图 15 - 步骤 4 对上一个哈希的更改导致方格 2 哈希重新计算*


    ### 步骤 5：区块 2 的新哈值显然不是一个稳定的哈希，导致该区块失效。


    ![](img/image00091.jpeg) *图 16 - 新方格哈希确定不是一个已解决哈希，使区块失效*


    ### 步骤 6：对区块 3 重复步骤 3、4 和 5。


    ![](img/image00092.jpeg) *图 17 - 对区块 3 重复步骤 3、4 和 5*


    在看到了如果任何数据元素在事后被更改，区块链将如何崩溃或自我失效的逐步分解后，如果一个聪明的黑客想要更改区块中的某些值，使其在整个区块链中`看起来`有效，会怎样？让我们看看这如何可能实现。


    首先，让我们从上一个示例的最终结果开始，如图 17 所示。如果我回到区块 1 并挖掘一个新的随机数（nonce）以获得解决的哈希会怎样？解决的哈希将向前传播到区块
    2 的上哈希字段，但会导致区块 2 计算出一个新的哈希。注意，尽管来自区块 1 有一个解决的哈希，但区块 2 新计算的哈希并不是一个解决的哈希。


    *图 18 - 在区块一中挖掘匹配哈希*


    如图 19 所示，可以对区块 2 和 3 重复挖掘过程，这样所有区块都将被签名并再次看起来有效。搞定！


    ![](img/image00093.jpeg) *图 19 - 挖掘方格 2 和 3 以使它们看起来有效*


    ## 区块链网络的力量


    区块链如何工作以确保数据不被篡改？答案在于密码学哈希。区块链中的每个区块都包含上一个区块的哈希，这在区块之间建立了链接。如果区块中的任何数据被更改，它的哈希就会发生变化，从而改变后续区块的哈希。这种效应使得篡改区块链变得非常困难。


    此外，区块链是去中心化的，这意味着没有单一权威控制网络。相反，网络分布在许多称为“节点”的计算机上，每个节点都维护区块链的副本。这使得任何单一实体很难控制或操纵网络。


    ## Token 与梅克尔树


    梅克尔树（Merkle tree）是一种用于高效验证数据完整性的数据结构。在区块链上下文中，梅克尔树被用于存储区块中的交易。梅克尔树的每个叶节点都是交易的哈希，然后这些哈希被组合哈希，直到得到单个的根哈希，称为梅克尔根（Merkle
    root）。


    梅克尔根允许用户在无需下载整个区块的情况下验证特定交易是否包含在区块中。这对于移动设备或其他存储和带宽有限的设备特别特别有用。


    梅克尔树也被用于共识过程，因为它允许节点快速验证它们是否具有相同版本的区块链。这确保了区块链保持安全和不可篡改。

