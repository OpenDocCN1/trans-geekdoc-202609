  trans: "\n\n-   **降低延迟** - 通过使用一种名为 `Unique Node Lists`（唯一节点列表）的完全信任网络，Ripple 可以缩短达成共识的时间。回看第\
    \ 4 章，在建立共识方法时的各种权衡考虑因素。Ripple 协议是专门针对支付系统优化实用拜占庭故障（BFT）的示例，以提高交易处理的吞吐量。\n- **克服分布式支付框架面临的三大主要困难**：\n\
    \    - **正确性** – 在不与信任的第三方通信的情况下，区分正确的交易和欺诈交易。\n    - **共识** – 维护一个单一的全局真实的区块链捕获。\n\
    \    - **实用性** – 改进框架的通用性，使交易能够处理得非常快，而不是像传统系统移动资金那样花费几天时间。\n\n## 唯一节点列表 (Unique\
    \ Node Lists)\n\n内部故障的实用拜占庭适应与 Ripple 协议之间的一个重要区别在于存在唯一节点列表 (`UNL`)。在 Ripple 协议中，枢节点被汇组成\
    \ `Unique Node Lists`。下方的图 43 显示了 Ripple 协议如何将 `Validator`（验证者）节点组拆分为 `UNLs`。\n\
    \n![](img/image00114.jpeg) *图 43 - 将枢节点拆分为新的节点列表*\n\n`Unique Node Lists` 具有以下特征：\n\
    1. 每个服务器都维护自己的 `Unique Node List`。\n2. *只有来自 `Unique Node List` 中不同个体的投票会被考虑达成共识*。这是一个非常基础的点。通过减少需要执行共识的枢节点数量，检查交易的时间缩短了！\n\
    3. 节点可以在多个 `Unique Node List` 中位置。因此，每当我们向模型添加第三个 `UNL` 时，枢节点 1 和 7 也可以成为该 `UNL`\
    \ 的成员。\n4. 显然，构成 `Unique Node List` 的成员信任不会合谋欺骗网络。\n\n## Ripple 协议流程图\n\n请参考下方的图\
    \ 44 查看 Ripple 协议共识算法涉及的步骤。\n\n![](img/image00115.jpeg) *图 44 - Ripple 协议协议计算流程图*\n\
    \n1. 第一步，测试中的 `Unique Node Lists` 之一 `UNL #2` 通过向网络通信用于共识周期的交易来转变为“提议者”。\n2. 接下来，每个服务器都获取每一个合法的交易并创建一个用于处理的“申请者集”（applicant\
    \ set）。\n3. 竞争集在提议者的 `Unique Node List` 上合并。在交易处理共识期间，提议者的 `UNL` 记录被视为“开启”。\n\
    4. 提议者 `Unique Node List` 内部的枢节点批准交易，并在候选集的合法性上注册其决议。假设尚未达到基本票数，将继续进行额外的投票，直到获得达成共识所需的最小票数。根据\
    \ Ripple 协议，应有 80% 的 `UNL` 批准交易以达成共识。假设 80% 的枢节点没有批准申请集，则需要再进行一轮投票。最终超过了 80% 的阈值，待执行的交易集就会在开放账本中获得批准。\n\
    5. 在此周期开始时“开启”的 `UNL` 记录现在已“关闭”。Ripple 网络中最后一个关闭的账本被认为是区块链的当前状态。一些人认为 Ripple 协议是基于\
    \ `Proof of Auth` 的，因为特定的节点（`Unique Node List` 的成员节点）被赋予验证交易的权限。注意，Ripple 协议并没有将交易保存到区块中，而是将最后一个关闭的记录作为区块链的当前状态。由于这个原因，某些人认为\
    \ Ripple 不是区块链。\n\n非关键故障的实用拜占庭适应和 Ripple 协议是解决拜占庭将领问题的共识方法的两个示例。然后，我们将查看权益证明（Proof\
    \ of Stake）。\n\n## 权益证明 (Proof of Stake)\n\n见图 45 权益证明的定义。\n\n*图 45 - 权益证明定义*\n\
    \n权益证明是工作证明（Proof of Work）共识计算的一种替代方案，在后者中，以确定性的方式选择下一个区块的生成者，取决于生成者对区块链的持有量或利益，也称为“权益”（stake）。权益验证（Verification\
    \ of Stake）实际上是某些密切相关的共识协议的分类，某些变体将在本书晚些时候详细介绍。正如我们所看到的，权益证明通过要求所有验证者都向其工作的区块链中投入资源，来调整验证者的目标以确保交易的诚实。使用权益证明的区块链实例包括：Peercoin、Neucoin、Blackcoin、OK\
    \ Cash、Diamond Coin。\n\n## 权益证明与工作证明的区别\n\n由于权益证明和工作证明是两种广为人知的共识策略，因此逐点进行对比并注意两者之间的主要区别至关重要。见图\
    \ 46 的简要比较。\n\n*图 46 - 工作证明与权益证明的比较*\n\n1. 第一类比较是验证区块时投入的资本投资？在工作证明中作为矿工参与，我们和验证者必须花费多少投资？正如第\
    \ 4 章中比特币示例所示，工作证明在 PC 和运行此类硬件的电力能力上投入了巨额。据估计，每年仅挖矿网络就花费了超过 4 亿美元。另一方面，权益证明验证者所做的投资是其持有的代币。\n\
    2. 下一个想法是“谁完成了工作？”在工作证明中，你有“矿工”通过解决复杂的数学题来被选择将区块添加到区块链。在权益证明中，你有“验证者”来验证要添加的区块。\n\
    3. 挖掘者和验证者是如何被选出的？我们在第 3 章中了解到通常存在某种类型的随机选择过程作为共识策略的一部分。在工作证明中，解决数学题的主体被选择将区块添加到区块链。在权益证明中，验证者通常依赖于一种加权的随机选择计算。选择的权重部分来自于你对代币的投资程度——你持有的代币越多，在确定交互中的权重就越大。跨各种权益证明的形式，有不同的指标来确定特定“验证者”的“权重”。\n\
    4. 最后一类类别是执行共识策略消耗了多少资源？这里涉及到驱动因素。工作证明消耗了巨大的能量，相比之下，权益证明只消耗少量的电力。\n\n"
