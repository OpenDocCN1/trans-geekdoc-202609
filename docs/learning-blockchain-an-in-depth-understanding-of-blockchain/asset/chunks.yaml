    全球各国能源利用排名。更多信息请访问：https://hothardware.com/news/ethereum-and-bitcoin-energy-utilization-outperform-whole-nations-powerbudgets#OYUxih12izXScRA0.99。AS
    的成本以及运行它们的能量需求是开发工作证明（Proof of Work）替代共识机制的主要因素之一。


    ## 工作证明的感知问题


    正如我们在第 4 章中学到的，工作证明在数量上通过增加随机数（nonce）并对哈希进行迭代来提高，以尝试观察到产生价值低于目标价值创建方法的哈希，这些方法就是框架。这种机制的反应是：


    1. 这需要持续、不断地使用资源，框架才能正常工作。

    2. 解决工作证明难题增加了每笔交易的处理时间。你可能记得，框架试图将区块处理时间精确地保持在十分钟。

    3. 无论是否有人干涉，工作都必须完成。工作证明（Proof of Work）并不是为了攻击或类似操作执行的；它是针对每个区块执行的。

    4. 有人需要为矿工的工作支付报。矿工报酬通过交易费用和最近打印的代币获得。

    5. 无论是否有人攻击区块链，都必须向挖掘者支付报，这似乎是低效的。


    这些都是工作证明的明显问题。我要说明的是，这些是在特币中执行的工作证明计算中看到的问题。目前许多不同的组织（如 `Ethereum`）目前使用一种工作证明哈希计算，这种计算在买家的
    CPU、GPU 和 FPGA 上应该是可行的。在这些方面，它们消耗的资源明显少得多。因此，尽管工作证明共识策略促成了前所未有的、检查互不信任的双方之间未知交易的能力，但随着方案的不断产生，工作证明极有可能变成“无用证明（Poof
    of Work）”并从区块链处理中消失。让我们来看一种可选的共识机制，即针对内部故障共识算法的实用拜占庭变体。


    ## 拜占庭将军问题


    实用拜占庭容错算法是处理拜占庭将军问题的一种方法。在拜占庭将军问题中，一群军官（每位负责指挥拜占庭军队的一部分）包围了一座城市。在下方的图 41 中，你可以看到军官们包围了一座宫殿，更具体地说，是一座白色宫殿！这些将军希望为进攻城市制定方案。在最简单的结构中，军官们只需选择进攻还是撤退。一些指挥官可能想进攻，而另一些则想撤退。关键点是每个人的表现必须保持一致，因为少数指挥官的欺骗性进攻将变成一场灾难，结果将比计划好的攻击或有组织的撤退更糟糕。


    ![](img/image00112.jpeg)

    *图 41 - 拜占庭将军问题*


    由于少数军官可能是背叛者，可能会选择一个不完美的程序，问题变得更加复杂。或者，叛徒可能在与部分军官交流时投赞成，而在与另一部分交流时投出反对票。例如，如果有九位军官投票，其中四人支持进攻，另外四人支持撤退，那么第
    10 位将军可能会向那些撤退的指挥官发送撤退票，向其他人发送进攻票。撤退的人（对攻击者是有有利的）。由于军官们在地理上是孤立的，需要通过信使发送投票，问题变得更加复杂。信使可能会增加额外的困难，因为他们可能会忘记传递投票或可能伪造投票。


    为了将拜占庭将军问题应用到全球记录的区块链网络，模型中的“指挥官”是参与分布式区块链组织的节点。信使从第 10 位将军那里获得了一张撤退票，而其余的将进攻（这将导致区块链组织中的连接不一致）。“忠实军官”的总目标是选择承认提交到区块链的交易是否合法，并通过实质性区块扩展区块链。忠实的军官致力于确保区块链的完整性，从而确保正确的数据被认可。而阴险的指挥官则是任何试图在区块链上误造数据的方。这样，框架需要处理意外的节点故障（恶意的信使或未能传达消息的信使）以及类似于阴险将军的成员潜在直接破坏。


    ## 实用拜占庭容错共识机制


    实用拜占庭容错是工作证明的另一种共识选择。实用拜占庭容错计算确保了尽管可能存在少数恶意节点，组织中的大多数诚实节点也会选择相同的策略。实用拜占庭容错可以防止各种风险，例如不同组织节点的随机同步节点故障（一个拜占庭问题）或针对不可信节点的恶意行为。使用这种方法，一个拥有
    `(N)` 个节点的区块链组织可以忍受 `(f)` 个拜占庭节点（无论是通过欺诈还是节点故障），其中 `f = (N-1)/3`。或者换一种说法，实用拜占庭容错可以承受
    33% 的故障并继续正常运行。上述算法的另一个方面是，它确保了至少 67% 的节点在交易的合法性和请求之前达成共识。图 42 显示了使用实用拜占庭容错作为共识机制的区块链处理流程。


    ![](img/image00113.jpeg)

    *图 42 - 实用拜占庭容错流程*


    1. 首先，交易变得可处理。

    2. 节点开始对交易进行验证。

    3. 红线显示，当每个节点完成验证过程时，会返回用该节点私钥签署的响应，标记特定节点对区块的认可。

    4. 一旦收集到足够的响应（这将来自节点），就会构建一个共识区块并添加到区块链末尾。然后，循环将重新开始。有多种方法可以处理实用拜占庭容错共识策略。我们应该研究
