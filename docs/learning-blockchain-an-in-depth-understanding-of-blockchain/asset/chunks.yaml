  trans: "\n\n请参考下方的图 47，该图描述了权益证明（Proof of Stake）的流程。\n\n图 47 - 权益证明流程\n\n1.  首先，交易将开放以供系统处理。2.\
    \ 接下来，必须选择一个验证者来验证交易。这是通过随机抽签实现的。注意，可能的验证者池显示了许多巨大的红色“V”。这个数字是每个合法者根据其对社区代币的兴趣（持有量）决定的权重。接近\
    \ 1 的 V 在验证者抽签中被选中的几率是接近 100 的 V 的十倍。将验证者池中的所有 V 想象为对于他们贡献的每种用于验证的社区代币都获得一次参与抽签的机会。在图\
    \ 47 ab 中，贡献了 1000 个代币的验证者是处理此区块的抽签获胜者。\n\n2.  一旦根据不规则的权重抽签选出验证者，该验证者就有一个特定的时间范围来批准交易区块。这由框架指定了长时间。每个验证者都有自己可以挖掘区块的“时间”。例如，一个验证者可能在\
    \ `t + 1` 时刻挖掘区块，而另一个验证者直到 2 分钟后才能挖掘。假设第一个验证者断开连接或在任何情况下忽略了挖掘区块，第二个验证者可以在 `t +\
    \ 2` 分钟时挖掘区块，依此类推。相应的，所有可能的验证者都被推后了，他们应该在尝试挖掘区块之前至少等待该段延迟。\n\n3.  时钟将验证验证者是否在分配的时间内完成了处理。区块是否生成了？如果回答为否，则由另一个验证者开始处理。新的验证者在分配的时间段内确认区块。假设他们完成了确认，区块将被添加到区块链的最远端。然后，循环将从头再次开始，处理下一组交易。\n\
    \n## 权益证明的问题\n\n不同的权益证明框架存在一些问题如下：\n\n1.  **主观性**（Subjectivity）——权益证明被视为一种主观性约定，因为不同的节点可能会对区块链的当前状态得出不同的结论，参与其中需要大量的社会信息（即声誉）。相比之下，工作证明（Proof\
    \ of Work）是*客观的*，因为一个进入网络的新节点除了协议定义、所有区块集和已发布的“重要”消息外，一无所知，也可以独立地与网络其他部分对区块链当前状态得出完全相同的结论。正如我们在当前状态中所采取的那样，状态（或分支）是贡献工作最多的那个。关于微弱主观性的深入讨论已超出了本书的范围。关于此问题的精彩文章，通过与以太坊组织者之一\
    \ Vitalik Buterin 的联系，可以在此处找到：\n\n    https://blog.ethereum.org/2014/11/25/proof-stake-learned-lovefeeble-subjectivity//\n\
    \n2.  **经济集中化**（Economic Concentration） - 货币基础和其他地区的代币积累（类似于交易））对接受或拒绝约定的更新具有控制权。这些拥有集中属性的群体使用他们的“权益”来在区块链上施加意志。\n\
    \n3.  **无风险问题**（Nothing-At-Stake）——在权益证明算法中，验证者投票是免费的，因此当面对不同的侧链分叉时，简单地倾向于循环中出现的多个侧链选择而不会受到惩罚。\n\
    \n还有许多其他共识算法和确认检查。我们将在第 6 章中分析其中的几个。\n\n## 第 6 章\n\n# 其他证明机制\n\n第 6 章将介绍其他证明组件。本节中的确认不像工作证明和权益证明那样被广泛使用，但它们提供了获取共识的各种方式，并对如何培养这种能力提供了一些独特的见解。特别是，将涵盖以下证明机制：\n\
    \n-   耗时证明（Proof of Elapsed Time）\n-   活动证明（Proof of Activity）\n-   燃烧证明（Proof\
    \ of Burn）\n-   容量证明（Proof of Capacity）\n\n## 耗时证明 (POET)\n\n我们将的首要替代确认机制是耗时证明。图\
    \ 48 给出了耗时证明的定义。\n\n![](img/image00116.jpeg)\n图 48 - 耗时证明定义\n\n耗时证明是一种中本式的共识，利用可信执行环境（TEE）来确保先驱政治竞争过程的健康和随机性。可行的是，它将“工作”替换为注册的信誉。耗时证明的特点是：\n\
    \n1.  这种证明技术由巨型芯片制造商 Intel 支持，作为其 Sawtooth 区块链驱动参与 Hyperledger 项目联盟的一部分。\n\n2.\
    \  耗时证明应该在 TEE 中运行。可信执行环境是处理器芯片本身的一个受保护空间。它确保了堆栈其中的代码的分类和可信度。Intel 提供的是软件防护扩展，或\
    \ `SGX` 芯片。\n\n3.  耗时证明利用的是验证者，而不是矿工，类似于权益证明。\n\n4.  耗时证明利用的证明是合法者持有预定的时间范围，而不是像工作证明那样解决数学谜题。耗时证明与工作证明相比的一个可能结果是矿工/验证者进行投资的方式发生了变化。\n\
    \n让我们研究耗时证明处理交易的流程\n\n## 耗时证明流程\n\n系统从交易开放处理开始。应该进行一次抽签以随机选择验证者。在图 49 中，每个验证者都显示为巨大的红色“V”。注意到\
    \ V 附近是 Intel 的标志，因为每个验证者应该在 Intel SGX 处理器的可信执行环境中运行。\n\n图 49 - 耗时证明抽签机制\n\n每个验证者都向框架请求随机的等待时间。等待时间需求是\
    \ TEE 中的“受信工作”。拥有最短等待时间（即特定区块的最佳机会）的验证者被选为先驱。在上面的图 49 中，这是图中最左侧的验证者。\n\n一旦选定验证者，请看下方的图\
    \ 50 获取耗时证明流程的其余步骤。\n\n图 50 - 耗时证明流程\n\n1.  “制作时钟”工作为交易区块产生时钟，确保其分配给领导者且已在 TEE\
    \ 内部建立并匹配等待时间\n\n2.  随后启动“实际查看时钟”工作，验证该时钟确实是在可信执行环境中制作，并验证时钟是否过期。\n\n3.  一旦时钟过期，检查时钟工作将确认验证者在获得领导角色之前确实遵守了分布等待时间。\n\
    \n4.  先驱验证者随后确认区块并将其添加到区块链的最远端。然后，在这一点上，循环将从头再次开始。\n\n"
