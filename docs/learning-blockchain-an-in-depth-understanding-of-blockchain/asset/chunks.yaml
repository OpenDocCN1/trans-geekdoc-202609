    5. 当物品到达其最终目标时，证书的真实性实际上获得了一个最后一次检查的机会，以确保真正的天才之作没有被掉包，并且零售商数据已在区块链中刷新。在零售商确认物品代币的转移时，零售商可以确认物品的权限链，并尽可能将其追溯到制造商。通过在区块链上跟踪先进的代币，每当物品转移时，区块链都会通过区块链上的交换链明确地反映这种当前的权属的事实。


    ## 区块链方法的益处


    利用区块链的主要优势是完全消除了报告文档。由于货运情况被记录在区块链中，更新通过分发共识得到确认，因此不需要纸质记录。由于库存网络中的每个成员都拥有分发记录的相似副本，所有人都在同时根据相似的信息工作，而且每个成员都需要贡献自己的力量来确保物品到达其最终目标。这些更新目前几乎是持续地向所有成员开放。从实践上，区块链支持了制造商在互动开始并在每位成员之间传播时所拥有的信任。最后，监管链和运输状态每个每位成员都能立即访问，并可以进行持续查看或历史查询。


    ## 可能的溯源跟踪应用


    在查看了区块链可能优势的相当通用指南后，这里列出了可能从区块链中受益的可能溯源应用列表。


    * 贵金属

    * 奢侈品

    * 电子产品

    * 零部件

    * 药品

    * 质量保证


    这些应用中利用的区块链基本属性是：


    * 加密账本

    * 去中心化网络

    * 无须信任的对手

    * 不可篡改


    接下来，将对比一个信息公证应用场景。


    ## 示例数据公证应用场景


    之前的两个示例应用都依赖代币化资源，这些是有价值物品的链上表示。区块链创新可以用于确保信息与资源一样。在这种模型中，需要对合法区域三个机构之间的基本通信进行审计跟踪。由于集合中的任何单一机构都不能委托记录文件，因此需要一个可靠的第三方。图
    100 显示了不使用区块链时此类应用的流程图。


    ![](img/image00170.jpeg) *图 100 - 示例信息公证应用流程图*


    1. 参与者将各自的交易/数据发送给一个受信任的中间人，以证明数据的真实性。

    2. 受信任的第三方应该建立一个公共数据集，其中每条记录都组成，每条记录带有时间戳和起始证明。可能收集此类信息的示例包括消息、信件、记录、通知、其他相关记录。最终，所有参与者必须对文档的内容达成一致，以防止或解决争议。


    ## 传统的数据公证问题


    主要，控制分组问题是首要考虑的问题，还有内部和外部安全问题，这与之前在示例货币应用中描述的原因大致相同。此外，在这种情况下，假设信息被错误地篡改或删除，你还可能对至少一个成员造成潜在的损害。再次，正如我们在其他应用模型中发现的那样，维护它是昂昂的。


    ## 使用区块链的示例数据公证应用


    在示例公证应用场景中，区块链充当所有验证的组件。下面的图 101 显示了使用区块链时引入的流程和变化：


    ![](img/image00171.jpeg) *图 101 - 使用区块链的示例公证应用*


    1. 通过引入区块链，可以消除受信任的中间人。

    2. 此外，每个成员都将拥有他们自己的、原始哈希值的不可区分副本。此外，区块链的不可变性消除了任何篡改数据的可能性。


    ## 数据选项


    信息在区块链内部存储的方式可以通过三种独特的方式变化。主要选项是解密。上面的图 101 是使用解密信息时应用的准确表示。不加密信息意味着每个成员都可以查阅信息。这种选择提供了最大的便利性，并可以带来更快的目标。然而，这让区块链上的每个人都能看到所有数据。


    另一个选项是加密信息。下面的图 102 显示了对数据进行加密后情况如何变化。


    ![](img/image00172.jpeg) *图 102 - 使用加密信息的示例公证应用*


    使用加密选项，只有拥有正确解码密钥的主要成员才能查阅信息。这个解码密钥可以交给法院等权威机构，区块链可以用于证明原始信息是在某个时间点添加的。


    在区块链上存储信息的最后选择是哈希信息。下面的图 103 显示了应用的细微变化。


    ![](img/image00173.jpeg) *图 103 - 区块链上哈希信息的示例法律公证应用*


    正如第 2 章所讨论的，哈希充当用于哈希计算信息的先进唯一标记。哈希的额外优势是始终被处理为 32 字节，而不考虑用于哈希计算的文本字符串的大小。可以在不公开创建哈希的信息的情况下检查哈希。使用图
    103 所示的方法，哈希被放在区块链上，原始信息由投资人员存储在链外，在发生争议时他们可以披露原始信息。假设敏感信息中的即使一个部分在链外被更改，并且该信息被用来解决争议，那么当对敏感信息再次进行哈希时产生的哈希将与第一个哈希不匹配，从而标记信息已被篡改。


    ## 使用区块链数据公证应用的益处


