    # 网络效应 - 另一个担忧是组织方面的影响


    在公有区块链中，这种担忧程度较小，因为任何人都可以选择参与组织。对于私有区块链来说，这可能是区块链被接受的最大障碍。当所需的成员存在于你的组织之外时，为区块链招募一个组织将是一项艰巨的任务。银行业中如
    `R3`、保险业务中的 `B3I` 以及健康福祉业务中的 `hashed wellbeing` 等不同商业联盟的成就，确保了这些行业垂直领域中的每个关键组织都有足够的兴趣参与，从而使区块链变得有用。没有了强大的网络，区块链的可行性就会大打折扣。换句话说，网络枢纽越多，区块链就越令人印象深刻。


    # 标准 - 最后


    区块链的另一个考验是准则的缺失。无论以何种方式，这都在推动开发，因为销售者正将他们对各种区块链元素和功能的适配引入市场。然而，究竟需要多少种协议策略？是否存在运行智能合约的最理想方式？预计需要多少种编程和预配置语言来为区块链编写实用的扩展程序？这样，尽管区块链是一项令人兴奋的创新，但挑战依然存在。


    ## 区块链并非万能的


    我相信到此时，你对区块链是什么以及不是什么有了合理的理解。然而，尽管区块链创新非常强大，但它并不适用于所有场景。例如，区块链并不适用于需要毫秒级响应时间的高交易交易所。正如我们在第
    9 章中发现的，任何现有区块链最注目的交易所吞吐量也是 `Ripple` 的每秒 1,500 笔交易。`EOS` 如果实现了它的保证，可能会超过这一水平，但高交易量类的应用场景并不适合区块链。


    对于不需要不同组织或组织内不同成员的应用程序，你也不必费心区块链。区块链是为了去中心化组织设计的，应用程序越大，安全性就越高。如果你的应用程序完全是内部的，那么就不需要区块链。区块链不适合作为任意访问的信息库。由于区块链中没有索引方案，因此需要对数据进行多个索引和视图的应用程序并不适合区块链。在决定使用区块链来构建你的应用程序之前，请务必评估在本章之前讨论过的模型。


    ## 结论


    毫无疑问区块链是计算领域的“下一个大趋势”。它承诺从根本上减少、平滑或消除某些行政中心化功能，为合作伙伴和政府节省巨额资金。通过区块链的组织协议策略，认为不同的中间人可以被消除。因此，完整的历史作为区块链的一种基本功能被保留。使用先进的密码学和数字身份，区块链是不可篡改的。一旦信息存储在区块链中，区块链就会反对更改，且距离越远、组织越大，更改就越困难。


    但是，区块链世界仍然面临许多挑战。围绕监管和合规性的不确定性是一个大问题。外部因素和网络效应可能会让潜在的区块链项目永远无法离开蓝图。区块链生效所需的所有参与者会选择参与吗？共识、智能合约、脚本语言、区块大小等多个领域缺乏标准，使得理解区块链变得困惑。这让组织产生了一种不安的感觉，即他们对当前许多区块链方法之一所投入的投资，最终可能像
    Betamax 录像机一样结局。它们可以使用，但你只能在局外眼睁睁地看着另一种方法成为整个行业的标准。


    当达成更强大的标准时，这只会提高区块链的采用率。最后，区块链需要从它能做什么和不能做什么方面得到更好的理解，这最终将导致更广泛的认可。理想情况下，这本书帮助了你理解区块链。


