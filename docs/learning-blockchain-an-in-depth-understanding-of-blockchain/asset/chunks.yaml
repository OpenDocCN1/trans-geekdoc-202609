    2 区块链充满了多样化的方法。尽管如此，一些区块链增加了智能合约的能力，而这在 `Bitcoin` 中是不实行的。大红框内的区块链都有助于实现某种类型的智能合约。智能合约是这些第二代和第三代区块链相对于
    `Bitcoin` 带给市场的最优选择。卓越的合约允许这些区块链具有更广泛的用途，而不仅仅局限于货币市场应用。


    长期以来，从早期采用者中脱颖出的区块链是 `Ethereum`，我们将立即进行检查。此外，`MultiChain` 提供了一个平台，协会可以从此快速构建自己的区块链或扩展
    `Bitcoin` `Blockchain`。此外，可能像 `IBM`、`Linux` 和 `Intel` 这样最大的企业组成了 `HyperLedger
    Foundation`，以构建更适合财富 1000 强企业交流的现代实体化区块链。无论如何，`Ripple` 和 `Corda` 等不同组织遵循了第一个 `Bitcoin`
    的根源，并通过其贡献完全专注于金融业务领域。这两家公司分组在图 82 的绿色框中。金融领域在全球范围内巨大，`Ripple` 和 `Corda` 决定将精力集中在在那里。


    区块链的下一个版本——适配 3.0 将于 2017 年 10 月进入商业中心。如果你跟随图 82 中 `Bitcoin` 标志外的金线，它指向了 `EOS`，它承诺成为主要的区块链“操作系统”。`EOS`
    的策略是专注于提供低级的服务，如基于作业的安全、已发布的数据和高级信息，给那些在 `EOS` 之上构建应用的工程师。提供这些低级服务允许工程师更多地关注应用程序的功能性，而无需编写用于框架管理的代码。


    最后，你会发现 `Corda` 显示在图 82 的一个黑框中，并带有注释“不是区块链”。在图 82 列出的所有区块链中，只有 `Corda` 在其自己的标题下走得如此之远，以至于，`Corda`
    并没有真正使用区块链或分布式账本技术 (`DLT`)。相反，制作 `Corda` 的组织 `R3` 选择开发被描述为“共享账本”的平台，其中交易共识仅在交易交易双方之间达成，而不是像区块链那样，账本上的所有交易数据必须广播给账本上的所有其他参与者，且所有成员都应该达成事实一致。`R3`
    接受在银行和货币世界，这种组织级别的协议提高了安全性和灵活性问题，因此使用了“共享账本”而不是“传输账本”。


    虽然有许多可用的区块链且每天都有新的加入，随着本章的进展，我们将调查这一领先区块链列表。


    ## Bitcoin 总结


    沿着区块链的序列，我们先从 `Bitcoin` 的概述开始如何？下面的图 83 突出了关于 `Bitcoin` 的相关细节。


    ![](img/image00149.jpeg) *图 83 - Bitcoin 总结*


    如前提到的，`Bitcoin` 是 2009 年由一个名为 `Satoshi Nakamoto` 的化名的匿名软件工程师或开发者小组发布的。`Bitcoin`
    是一个公共区块链，意味着地球上任何地方的任何人都可以参与 `Bitcoin` 组织。`Bitcoin` 拥有自己的数字货币，以符号“BTC”进行交易。截至
    2017 年 9 月，`Bitcoin` 的市值接近 700 亿美元。


    （注：原文中存在大量重复段落，已根据“确保不要重复输出原文”的原则在译文中去重，仅保留首段有效内容）


