    等待时间证明（Proof of Elapsed time）符合合理抽票计算的标准，因为它将政治决策权随机地分散在整个验证者群体中。政治博弈的可能性与所投入的资产成比例（在这种情况下，资产是具有受信执行执行环境的
    `SGX` 处理器）。此外，极低的协作成本增加了验证者数量变得巨大的概率，从而增强了共识计算的活力。等待时间证明不可否认的缺陷是，每个人都需要信任 `Intel`
    不建立一个反叛的 `SGX` 环境，在那里他们可以通过伪造时钟过期来承担对该组织的责任。


    ## 活动证明 (Proof of Activity)


    我们将审计的以下证据是活动证明。请见下图 51 中活动证明的定义。


    ![](img/image00117.jpeg) *图 51 - 活动证明定义*


    活动证明是一种结合了工作证明（Proof of Work）和权益证明（Proof of Stake）的混合方法。目前，去中心化信用（Decred`）是利用多种活动证明的主要加密货币。请记住，在第
    4 章调查工作证明时，我们发现矿工在有效挖掘出一个区块时，会获得两种类型的分红：


    1.  新打印的比特币——截至 2017 年，矿工获得新制造的比特币。在比特币最初创建时，奖励被设置为每个区块 50 个比特币。代码决定每开采 210,000
    个区块（大约像时钟一样），新硬币奖励就会减半，直到全部减少到零。

    2.  交易费用——每个被记录在区块中的交易都包含某种程度的交易费用，作为对有效矿工的补偿。每笔交易的奖励随着客户为矿工提供更多动力而变化，以确保他们的交易能尽可能快地记录在区块中。该章节对比特币交易的审查显示，贡献应该接近结果。在模型中，结果并不正好是
    1 个比特币。这些“丢失”的比特币将由有效矿工通过交易获得。


    为了避免通货膨胀（当代币泛滥系统时会发生），比特币只会产生硬币。这意味着早晚，比特币区块奖励将消失，比特币矿工将只获得交易费用。一些人估计，区块奖励的拆分可能会导致由于“旅馆不幸”的安全问题，即人们只考虑自己的利益，而不是系统的最佳利益。


    活动证明试图解决的另一个问题是普通矿工限制逐渐变为少数矿工。根据 `bitcoinworldwide.com` 在 2017 年发布的图 52 图表，实际上
    55% 的比特币挖掘是由四家公司完成的。


    ![](img/image0018.jpeg) *图 52 - 全球比特币挖矿能力——来源：bitcoinworldwide.com，2017 年 7 月*


    这并不是中本·纳科托编写比特币白皮书时想象的那种“一台电脑一票”协议。因此，创建活动证明作为一种替代共识方法，以缓解比特币矿工激励减少的问题，并允许更多节点成为矿工，而无需投资专用硬件来帮助稀释总挖矿能力的集中。


    ### 活动证明流程图


    请参考下图 53 以跟踪活动证明流程图的第一部分。


    ![](img/image0019.jpeg) *图 53 - 活动证明流程图*


    1.  与工作证明类似，交易记录被引入网络进行处理。矿工努力解决数学难题。

    2.  在矿工解决数学难题后，发送到网络的数据只是一个区块和矿工奖励地址的格式。至关重要的是，区块中还没有交易（暂时！）。可能会出现这样的模板。

    3.  通过将哈希的 256 个伪随机部分比作数字，从区块中产生一个不规则的验证者池。`E` 数字与其当前拥有的单一公钥相关。这就是选择 `N` 个任意所有者作为有效的方式。

    4.  如果所选的验证者中至少有一个是不可用的（或出于不同的考量进行挖掘），那么将完全为新的框架选择另一个新的“布局”，即另一组签名候选人进行有效性验证，形成一个全新的验证者池。

    5.  一旦所有验证者都用他们的公钥签名，然后“模板”就变成了一个包含交易的完整区块。区块奖励分配给有效工作的矿工和不同的验证者之间。然后该过程重新开始。


    活动证明带来了额外的通信开销，并激励工作证明和权益证明的矿工为了共同利益而合作。活动验证从根本上关于增加运行的节点数量，并为合作伙伴持有代币提供动力。活动确认相对于工作证明没有提供安全性上的提升。


    ## 燃烧证明 (Proof of Burn)


    现在我们应该看看燃烧证明。下图 54 给出了燃烧证明的定义。


    ![](img/image0120.jpeg) *图 54 - 燃烧证明定义*


    通过燃烧证明，与其将资源投入到昂贵的电脑设备，不如通过将硬币发送到无法恢复的位置来“签名”。通过将硬币发送到无效密钥使得硬币实际上被“签名”——从而获得了一种在取决于随机选择过程的网络上进行挖掘的永久优势。


    在创建燃烧证明的交互流之前，有几个关于验证的想法必须先理解：


    1.  核心思想是，要成为燃烧证明区块链的矿工，你应该首先消耗一些硬币。通过交易发送到一个没有私钥的特殊地址来“消耗”硬币，导致硬币丢失。取决于燃烧证明的实现方式，矿工可能会消耗区块链的本地货币或其他链的货币，如比特币。

    2.  被消耗交易的哈希被独立记录，以便在后续操作中识别矿工。

    3.  作为矿工在燃烧证明中随机决定交互的一部分，消耗的哈希倍数通过查看自矿工消耗交易产生以来区块链添加的区块数量来确定。该倍数与消耗硬币的总和成反比。这个倍数建立了矿工被选中处理区块的概率。而且，随着矿工消耗硬币后增加了更多区块，倍数会逐渐变小，使得消耗的硬币“腐烂”，减少了矿工被选中的概率。因此，最终矿工将再次消耗更多货币，增加他们在抽奖中被选中的概率。类似于比特币的挖掘周期，你需要持续投入资源到更多的
    ASIC 处理硬件以保持。

    4.  最后，为整个网络创建一个消耗哈希目标，它取决于此时消耗硬币的数量。该哈希目标被存储在区块中作为“消耗位”（或者说灰烬？）。这个消耗哈希目标是固定的，对于网络中的所有节点都是相同的。


    ### 燃烧证明流程图


    请参考下图 55 以跟踪燃烧证明流程图。

