  trans: '

    在尝试决定区块链是否是你应用程序的合适平台时，有几点考量。这里将探讨的考量包括：


    1. 组织效应

    2. 应用需要去中间化吗？

    3. 应用是否会从代币化中受益？

    4. 应用涉及的数据需要什么程度的机密性？


    ### 网络效应

    在考虑利用区块链构建一个分布式的应用时，应当满足的主要规则是我所称的“组织影响”。如果假设有一个由客户或节点组成的组织参与该应用，那么可能就需要区块链。组织规模越大，区块链的某些特性（如不可篡改性和抗攻击能力）就变得越引人注目。跨越多个节点进行传播的传输记录副本越多，黑入该框架就越困难。为区块链招募一个组织是一项艰巨的任务，特别是对于私有链而言，其所需的成员存在于你的组织之外。努力克服组织影响正是为什么你会看到行业垂直联盟正在被建立，以确保组织足够强大。正如
    `Deloitte Consulting` 在 2017 年 8 月份的一项研究报告所示，全球已有跨越六个不同企业的 40 多个联盟成立，以寻求区块链解决方案。因为，在区块链组织中成为主要枢纽，就像成为地球上唯一一个拥有手机的人……你要给谁打电话呢？


    ### 去中间化

    接下来的规则包括提出一个问题：“你的应用需要去中间化吗？”该应用是否使用了第三方验证者，你是否正寻求消除这些第三方？区块链允许多个互不完全信任的多方安全且直接地共享单个分布式账本，而不需要受信赖的中间人。另一个需要检查的要点是，在交易的确认交互中是否需要多个标记。`IBM`
    指导的一项关于全球运输的研究显示，货物通过港口进行海外装运需要 17 个标记。这些标记实际上可以通过区块链被消除。


    ### 代币化（Tokenization）

    第三个想法是资源和信息的代币化。资源的代币化是将资源的权利放入区块链上的高级代币中。你的应用需要对资源进行代币化吗？


    数据代币化与资产代币化略有不同，数据代币化是将敏感数据替换为唯一符号的过程，这些符号保留了关于数据的所有核心信息，而不直接暴露数据。信息价值支撑的代币体现在方框内，首条信息可以被编码、哈希处理或存储在区块链外部的数据集中。


    一旦资源被代币标记，其所有权、开发和来源在组织内部变得更加紧凑且易于共享。例如，医疗服务供应商很快将发行代币，真实确认护理以及患者和供应商所采取的活动。虽然这些代币将作为患者健康历史的证明，但它们不会披露有关患者的敏感健康信息。


    ### 机密性

    最后一个想法是隐私。你的应用能够忍受区块链中的所有成员看到该区块链上发生的每一笔交易吗？无论是否使用特殊的加密技术来隐藏交易的某些部分，由于区块链的去信任理念，区块链披露的数据将永远比集中式数据库多。当你审视应用背后的动机时，组织中的每个成员共享同一个传输记录是可行的吗？还是是否存在公司、安全或其他原因限制了这种信息的公开共享？同样，持续保留应用程序的所有历史背景是需求吗？在特定的时间过去后，拥有完整的历史是否有价值？实际上，区块链解决了一个折中方案：以牺牲机密性为代价消除了对外部信任的依赖。


    因此，在决定区块链是否为你下一个应用程序的合适平台之前，务必考虑这四个问题。


    ## 示例应用场景

    当我们分析一些应用场景时，我们首先会注意到传统处理环境中的应用，然后检查区块链对该应用场景可能产生的影响。我们将检查四个应用场景：


    1. 金融应用

    2. 溯源追踪应用

    3. 数据公证应用

    4. 物联网与区块链


    ## 示例金融应用

    这里我们有两个需要继续合作完成的成员。他们可能需要转移资金、交换股票、债券或其他货币工具。为了进行这些交易，需要像代理人或经纪人这样的受赖第三方。在模型中，`Participant
    E` 需要将资金转移给 `Participant A`。请参考下方的 `Figure 96` 查看交易流程。


    ![](img/image00166.jpeg)

    *图 96 - 示例金融应用流程*


    1. 为了启动交易流程，双方通常应先就某种转移所有权的请求达成一致。这些可能是纸质档案或电子结构，每种都需要某种确认标记，并且通常需要某种外部验证。

    2. 验证后的请求被发送给受赖第三方，由其确保所有行政工作到位。第三方还将确保要转移的资源由交易资产的成员合法拥有，并且购买资源的成员拥有购买该资产的资金。

    3. 一旦受赖第三方确认交易有效，所有权将通过对集中式数据库进行更改来变更。

    4. 修改已完成的反馈（如 `Figure 96` 中的实心红箭头所示）被发回交易双方，资产随之转移。

    5. 每个成员根据需要更改其本地记录。注意模型中，两个成员正在使用类似的受赖第三方。每个成员使用不同的第三方是完全可以预期的。


    注意，假设发生了失误导致资源错误转移，或以不接受的金额转移，这些错误可以通过直接在集中式数据库中创建的记录快速有效地扭转。


    ## 传统金融应用问题

    这种情况看起来很完美，但问题在哪里呢？首先，完成结构、确认标记和获取对方标记的记录非常繁琐。根据交易的类型，可能涉及许多记录。


    接下来是控制集中的性问题。在一个地方拥有记录的唯一副本对于组织内部和外部来说都是巨大的安全隐患。在组织内部，员工可以进行更改来调整账户余额，这种攻击很难被识别。更糟糕的是这种这种不利后果……

