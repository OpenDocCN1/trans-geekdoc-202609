    ### 第一部分


    # 什么是区块链


    很难想象，一份由神秘人物（或多位人物）编写的 11 页白皮书，对创新世界的影响竟然与互联网的发展相当。但事实确实如此：2008 年 10 月 31 日，一位以中本聪（Satoshi
    Nakamoto）为笔名的匿名人士发表了一篇名为《比特币：点对点电子现金系统》的白皮书。基于该白皮书中描述理念的产品于 2009 年初开源形式发布。比特币成为了主要的去中心化货币，并开启了加密货币的新纪元。


    计算机化的货币世界并没有得到各方的欢迎。企业、立法机构和整个社会将比特币及其每一个子公司贬低为骗局或狂热。从一开始，只有极客本地社区支持比特币，并保持了充足的能量，直到最后，比特币爆发出了无法阻挡的能量，没有任何真实的方法可以阻止它的发展。比特币变成了一种可以比作嘉年华怪胎秀的东西。我记得当我走入一个理性的区域时，被一个宣传着“看世界上最大的马——0.35
    美元！”的帐篷所欢迎。我愤愤地对另一半说：“哪个傻瓜会花 0.35 美元去看一匹小马？”但是，种子已经种下了，我脑海中唯一的想法就是：“我不禁在想那只马有多大……？”最终，我花了
    10 多美元带着我的爱人离开了那个帐篷。比特币变成了那种“世界上最大的马”。人们冷嘲道：“那又怎样？在地球存在的历史上，从未有过一群完全一无所知或互不信任的神秘成员之间的价值交换，竟然可以在不依赖外部信赖的情况下，通过先进的加密技术获得批准并结算。”随后，人们开始思考……“我不禁在想比特币是如何做到的……？”当人们开始观察比特币帐篷内部时，他们发现了一个被称为“区块链”的想法。顺便一下，`Blockchain`
    这个词在中本聪的白皮书中从未被提到。虽然导致 `Blockchain` 卓越的许多特性将在本书后面进行讨论，但其核心组件体下面的定义中：


    ![](img/image00075.jpeg)*图 1 - 区块链定义


    ## 定义


    这个定义从“什么是区块链”到“区块链如何运作”包含了两个或三个独特的层次。我需要从这个定义中选取一些体现区块链精髓的关键词。第一个词是“提议与确认”。交易和确认是每笔交易的核心部分，它解决了区块链的普遍能力。我需要拆解的下一个术语是“价值交易约定”。创建交易是一回事，但确保该交易的价值和条款在不需要中间人的情况下已知并达成共识，则是另一回事。下一个术语是“网络信任层”。每个人都知道互联网的力量，正如其之上的陷阱。一种能够将信任和确认带到互联网的创新是非常强大的。


    现在，定义从“区块链是什么”转向了“区块链如何工作”。在定义的最后部分，我需要剥离的第一个词是“共享账本记录”。代表和结算交易的单调行政中心职能通过 `Blockchain`
    实现了机械化。这是区块链获得巨大投资的源泉，也是引发组织好奇心的关键特性之一。最后，我们要观察的最后一个术语简单来说“块（block）”。`Blocks`
    是存储交易历史的隔间或容量单元。


    在最近描述了区块链是什么之后，通常的反应是“那又怎样？”它真正解决了什么问题？为了回答这个问题，我们不考虑调查一个没有使用 `Blockchain` 技术的普通业务场景，然后我们将
    `Blockchain` 引入该场景并记录差异。


    图 2 - 没有区块链的业务场景


    上面的基本情况显示了许多交易中的典型参与者：代理人、供应商、购买者、银行以及最后的审计员。注意，每个成员都有他们自己的副本记录。当合作开始时，每个成员都有一个框架来跟踪谁做了什么。此外，不同记录的更新方式缺乏一致性，因为毫无疑问，每个成员在更新记录时都使用不同的记账规则。需要审计员作为记录准确的最终确认，然而审计员实际上并没有进入每个成员记录的权限。假设发生了糟糕的情况，会蔓延到整个组织，使每个成员重新验证他们对交易的记账。


    现在，如果我们引入一个 `blockchain` 会怎样？以下是类似的业务场景，有类似的常客，只不过这次我们在交易处理过程中嵌入了 `Blockchain`。


    图 3 - 带有区块链的业务场景


    `Blockchains` 构建了一个包含每个成员的组织，并作为交易和资源所有权的检查系统。交易的唯一副本被存储在一个公共的传输的记录中，该记录在整个组织中复制，因此每个成员几乎在实时拥有完全相同的交易活动副本。从
    `Blockchain` 中获得的独特优势是：


    1. 共识（Consensus）—— 共识是一种通过 `Blockchain`（而非外部第三方）批准交易的工具。书中有一整部分专门讨论这个主题。

    2. 源溯（Provenance）—— 源溯是记录资源的完整历史。这系列经历可以包含特定的质量证明、所有权历史或给定资产的任何其他激励。

    3. 不可变性（Immutability）—— 对于所有常用途，一旦区块被添加到 `Blockchain` 中，它就是不可变的。区块链世界中不存在像数据库中那样的更新或删除命令。

    4. 无信任（Trustless）—— `Blockchains` 运行在一个“无信任”环境中，参与者在交易中不需要认识或信任对方。


    ## 区块链的类型


