    This isn’t the one PC – one vote kind of agreement that Satoshi Nakamoto imagined
    when he wrote the Bitcoin white paper. Thus, Proof of Activity was created as
    alternative consensus approach to alleviate the shrinking incentive for Bitcoin
    miners and allow more nodes to become miners without having to invest in specialized
    hardware to help dilute the concentration of overall mining capacity.


    ### Proof of Activity Process Flow


    Refer to Figure 53 below to follow the first part of the Proof of Activity process
    flow.


    ![](Images/image0019.jpeg) *Figure 53 - Proof of Activity process flow*


    1. Just similarly as with Proof of Work, minutes of exchanges introduced to the
