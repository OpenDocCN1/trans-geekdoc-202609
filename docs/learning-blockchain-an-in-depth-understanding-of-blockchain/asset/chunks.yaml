    \ is why an alt-chain would want to use Proof of Proof.\n\n## **Segregated Witness**\n\
    \nWe will change gears from agreement and spotlight on several themes that you\
    \ will have, unquestionably, found out about. The first is Segregated Witness.\
    \ *“Isolated Witness” is a new update to the construction of Bitcoin exchange\
    \ information that isolates the mark piece of exchanges from the information segment,\
    \ wiping out the exchange pliability issue of Bitcoin and expanding the size of\
    \ the Bitcoin blocks.* How about we investigate and see precisely what changed\
    \ in the Bitcoin information structure with the presentation of Segregated Witness.\n\
    \nReference  Figure 64 for an image of the data structure of Bitcoin transaction\
    \ data before Segregated Witness.  \n\n![](Images/image00130.jpeg)*Figure 64 -\
    \ Bitcoin exchange information structure before Segregated Witness*\n\nYou will\
    \ review from Chapter 3 that the exchange information is comprised of data sources\
    \ and results as displayed here. Notice in the result field, the approval or public\
    \ keys are incorporated alongside the mark of the individual or people whose coins\
    \ are being moved. While approving the exchange, the public key is checked to\
    \ guarantee it has the right hash (matching the record) and afterward the mark\
    \ is checked to guarantee it is substantial for the exchange and made with the\
    \ provided public key. Starting there on, the public key relating to the location\
    \ is freely known. This exchange information is then contribution to the hashing\
    \ calculation to produce an exchange ID. The exchange ID is additionally contribution\
    \ to make the Merkle tree.\n\n![](Images/image00131.jpeg)*Figure 65 - Transaction\
    \ information design with isolated witness*\n\nWith the introduction of Segregated\
    \ Witness, all of the signature data is moved to the *end* of the transaction\
    \ data block as depicted in the red square in Figure 65 above.  "
