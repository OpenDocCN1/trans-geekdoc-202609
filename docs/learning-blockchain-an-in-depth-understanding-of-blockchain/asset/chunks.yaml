    2 hash be recalculated*


    ### Step 5: The new hash for block 2 is definitely not a settled hash which negates
    the block.


    ![](Images/image00091.jpeg) *Figure 16 - The new square hash is certifiably not
    a tackled hash, nullifying the block*


    ### Step 6: Repeat stages 3, 4, and 5 for block 3.


    ![](Images/image00092.jpeg) *Figure 17 - Repeat stages 3, 4, and 5 for block 3*


    After seeing a step-by-step breakdown of how a Blockchain breaks or invalidates
    itself if any of the data elements are changed after the fact, what if a clever
    hacker wanted to change some values in a block to make it `look` valid across
    the entire blockchain? Let’s see how this might be possible.


    First, let’s start with the final result of our prior example, shown in Figure
    17. What if I go back into block 1 and mine for a new nonce to get a solved hash?
    The solved hash would propagate forward to the previous hash field of block 2
    but would cause a new hash to be calculated in block 2. Notice that even though
    there is a solved hash coming from block 1, the new calculated hash for block
    2 is not a solved hash.


    *Figure 18 - Mine for an addressed hash in block one*


    As is shown in Figure 19, the mining process could be repeated for blocks 2 and
    3 so the blocks would all be signed and look valid again. Voila!


    ![](Images/image00093.jpeg) *Figure 19 - Mine squares 2 and 3 to make them look
    valid*


    ## The Power of Blockchain Network


    How might the Blockchain work to ensure that the data is not tampered with? The
    answer lies in the cryptographic hashing. Each block in the blockchain contains
    a hash of the previous block, which creates a link between the blocks. If any
    data in a block is changed, its hash will change, which in turn changes the hash
    of the subsequent block. This effect makes it very difficult to tamper with a
    blockchain.


    Furthermore, blockchains are decentralized, meaning there is no single authority
    that controls the network. Instead, the network is distributed across many computers,
    called nodes, each of which maintains a copy of the blockchain. This makes it
    very difficult for any single entity to control or manipulate the network.


    ## Tokens and the Merkle Tree


    A Merkle tree is a data structure that is used to verify the integrity of data
    efficiently. In the context of blockchain, Merkle trees are used to store the
    transactions in a block. Each leaf of the Merkle tree is a hash of a transaction,
    and these hashes are then hashed together until a single root hash is reached,
    called the Merkle root.


    The Merkle root allows users to verify that a particular transaction is included
    in a block without having to download the entire block. This is particularly useful
    for mobile devices or other devices with limited storage and bandwidth.


    The Merkle tree is also used in the process of consensus, as it allows nodes to
    quickly verify that they have the same version of the blockchain. This ensures
    that the blockchain remains secure and immutable.

