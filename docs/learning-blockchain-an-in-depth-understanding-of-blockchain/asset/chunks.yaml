    2. 接下来，必须存在一个防止篡改用户设备设置的设备。这种反篡改设备将在外部攻击者出现操纵企图时，通过删除私钥来使设备无法运行。例如，如果传感器连接到另一个物体，或者有东西尝试注入虚假刺激（如对设备进行攻击），则私钥将被擦除，使设备无法进一步处理。


    ## 智能合约流程图 - 无需预言机


    你将看到，在本节之前，我们提到过智能合约的执行条件已转换为被称为脚本（scripts）的 PC 代码。请看下图 80 以了解智能合约如何触发的流程图，以及用于执行智能合约条件的后续逻辑。


    ![](img/image00146.jpeg)

    *图 80 - 智能合约流程 - 无需预言机*


    1. 智能合约脚本被聚合为低级执行代码，并存储在区块链中特定区块的特定位置。任何引用该特定地址的交易都会向区块链发送信号，表明该智能合约应当作为该交易处理的一个特性被调用。


    2. 请记住，区块链网络中有许多节点，每个全节点上的虚拟虚拟机都会利用随交易发送的信息来执行内容的活动代码。


    3. 随着智能合约的执行，应当确认是否需要预言机。


    4. 如果确认智能合约条款所需的预期信息包含在区块链本身中，那么此时将检索相关信息。


    5. 利用区块链的历史数据，将检查智能合约的实际条款状态。假设条件满足（或不满足），将采取相应的的操作，无论该操作是资源转移、罚金评估还是费用收取*无论该智能合约被设计用来做什么*。


    ## 带有预言机的智能合约流程图


    图 81 显示了当需要预言机来访问区块链外部世界的信息时，智能合约将采取的流程图。


    ![](img/image00147.jpeg)

    *图 81 - 带有预言机的智能合约流程*


    1. 正如我们在过去发现的智能合约流程图所示，任何引用智能合约代码所在位置的交易都是向区块链发送信号，表明该智能合约应当作为交易处理的一个特性被调用。


    2. 区块链网络中的众多节点利用随交易的信息的信息执行脚本活动代码。


    3. 随着智能合约的执行，必须确认是否需要预言机。


    4. 在智能合约被处理时，需要通过互联网从区块链外部获取尚未结算的数据。取决于智能合约所需的信息类型，将调用合适的预言机来安全地获取数据。


    5. 如果所需信息来自通用网站或另一个区块链，则会调用软件预言机，并通过 TLS 公证员函数 `PageSigner` 提供数据真实性和时间戳证明。如果所需数据来自像
    `Gnosis` 或 `Augur` 这样的预测网站，则将使用这两个网站所使用的共识方法来确认所提供的群智信息。最后，如果智能合约所需的信息是实时的、公开的、以用户为中心的信息（例如通过专用传感器收集的信息），则将使用硬件预言机。


    6. 接下来，利用从预言机获取的信息汇总的数据检查真实合约。假设条件满足（或不满足），将执行相应的活动，无论该活动是资源交换、罚金评估、费用收取，还是智能合约被设计用来做什么。


    ## 智能合约应用示例


    考虑一个商业交易在其生命周期内的组织和大量通信。在通常，业务的 IT 部门几乎会通过建立一个完全受特定实体影响的定位系统，来构建安排中数据驱动部分的组织。


