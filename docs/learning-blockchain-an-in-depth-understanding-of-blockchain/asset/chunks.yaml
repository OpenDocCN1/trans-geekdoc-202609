    # 安全概述


    攻击者对信任客户的外部人员构成了威胁。从组织外部来看，程序员有一个单一的目标，即他们可以尽力渗透框架。假设这些程序员是有效的，他们可以随心所欲更改记录、夺取资产或完全删除记录。此外，维护核心记录的完整性成本高昂。尽管存在实际安全和信息安全的成本，集中式记录与执行方之间存在着持续、不断的检查和妥协。如果记录在任何时候失去同步，将是一个严重的问题。


    # 基于区块链的示例金融应用


    现在我们应该观察一个类似的金融应用场景，但这次我们将嵌入区块链。图 97 显示了流程，并捕捉了过程中被消除的部分。


    ![](img/image00167.jpeg)*图 97 - 利用区块链的示例金融应用*


    1. 嵌入区块链后发生的主要变化被认为不再需要外部人员。

    2. 接下来，集中式记录和成员的单一记录都消失了，因为现在每个成员都共享所传输账本的相同副本。

    3. 认证存档消失了，因为成员将使用加密密钥在区块链中进行可识别的证明和验证。

    4. 此外，资源可以代币化，以便在区块链内部移动执行资源更加简单。

    5. 区块链本身保证了金额和价值交换通过共识算法被成员已知并达成一致。


    # 区块链方法的优势


    通过区块链，不再有主要的攻击问题，因为每个成员都有自己的记录副本。交易以区块链共享的方式传播，共识计算保证了记录被自然地持续处理，从而在过程中节省了时间和资金。


    那么，使用区块链的缺点是什么？隐私。由于区块链维护了*所有*交易的完整历史，每个参与者（区块链网络中可能有很多两个参与者）都有分布式账本的副本，这意味着*任何*参与者都可以看到区块链上的*任何*交易——无论该参与者是否参与了该交易。如果这个概念是一个问题，那么忘记使用区块链吧。


    # 其他可能的金融应用


    在查看了某种非专属金融指南以展示区块链的预期优势后，这里是可能完全从区块链中受益的潜在金融应用列表：


    * 货币兑换

    * 支付与汇款

    * 清算与结算

    * 礼品卡

    * 忠诚积分

    * 交易

    * 众筹

    * 审计


    在上述案例中，分类通常将不再是一个问题——无论成员是否关注关注在做什么，他们都不会学到很多重大价值。此外，考虑到风险较低，避免建立中间机构的问题和成本是理想的。


    在这些应用中被利用的区块链基本属性是：


    * 加密账本

    * 去中心化网络控制

    * 无需信任对方

    * 独立共识


    我们将调查的下一个模型应用是溯源追踪。


    # 溯源追踪应用


    在这个示例应用中，制造商需要能够跨库存网络跟踪高价值物品的起点和发展。下面的图 98 显示了应用流程。


    ![](img/image00168.jpeg)*图 98 - 示例溯源追踪应用流程*


    1. 因此，当产品制造时，资源的起点和专业属性被捕接到制造商的演示集中。捕捉的数据将包括序列号、质量确认信息以及关于产品的其他数据。

    2. 现在，生产者需要将商品发送给零售商，利用运输公司发运货物。当货物装上船只时，一份装货单被完成并获得批准。早晚，这份装货单数据将在制造商的溯源数据集中更新。这可能是实时的，也可能是稍后。

    3. 当货物到达后，物品目前需要移动到卡车上。一旦运单获得批准，相关信息就会捕接到溯源数据库中。

    4. 最后，物品到达零售商的所在地。包裹的确认和物品的状态被记录，溯源信息库再次更新。

    5. 同时，在后台，不同的管理中心（运输公司和零售商）更新各自的记录。


    # 传统溯源追踪的问题


    主要问题是繁琐的文档工作。装货单、运单以及最后零售商的收据在交易进行时都需要获得批准。另一个问题是数据的不同步进度。交易中的每个成员会在不同的时间、通过不同的传输系统获取更新信息。而且，就像金融模型一样，分组控制和维护核心数据集的成本也是该应用的问题。安全和同步问题在溯源应用中同样存在。


    # 基于区块链的溯源追踪


    参考下面的图 99 跟踪利用区块链的示例溯源追踪应用的流程。


    ![](img/image00169.jpeg)*图 99 - 利用区块链的示例溯源追踪流程*


    1. 加入区块链消除了集中的溯源信息，信息的副本被分发给库存网络中的所有成员。这还消除了每个成员执行的额外记录工作。

    2. 当物品制造时，一个代币化的“证书有效性”被捕接到区块链中，以确认产品的源点。令牌有助于防止伪造和篡改，这是供应链中的一个大问题。数字令牌比纸质更难被获取或伪造。令牌的发展如图
    99 中的绿色虚线所示。

    3. 当物品开始前往零售商的旅程时，船舶数据被捕接到区块链中，证书有效性准确区分了特定的物品。由于装单数据已存储在区块链中，通常不需要运输公司的副本副本。如图
    99 中的红色虚线所示，货物被装上船，然后令牌被传输给运输公司。


