    以太坊实际上占据了日常普通交易量的 80%。更重要的是，根据 CryptoPortfolio 2017 年 8 月的报告显示，所有非比特币区块链组织的总市值
    87% 属于以太坊。而且，正如 CoinMarketCap 所示，以太坊主导了市场，所有交易资产的 79% 基于以太坊区块链；占整体总市值的 87%；交易所上市的公司中有
    56% 拥有基于以太坊的区块链。在比特币之外，没有其他区块链在市场采用率上能与以太坊相比。以太坊还维护了去中心化应用（dApps）的概念。去中心化应用类似于具有某些特定特征的智能合约：


    1. 分布式应用可以拥有无限数量的成员。在普通的智能合约情况下，任何合约只有少数感兴趣的成员。

    2. 其次，这些特定的应用程序不需要是金融应用。去中心化应用可以接触任何类型的应用场景。

    3. 而且，而不是为每个特定的应用程序构建一个完全独立的区块链，以太坊允许潜在开发者在同一平台上开发成千上万种不同的应用程序。


    就像苹果为 iPhone 提供了 App Store 一样，以太坊推动了分布式应用的开发，并在 https://dapps.ethercasts.com/
    保持着活跃的网页，你可以在那里看到到为止开发的所有分布式应用。下面的图 86 显示了截至 2017 年 9 月部分可用分布式应用的截图。


    ![](img/image00152.jpeg) *图 86 - 分布式应用目录*


    如果你稍微放大一下，可以认为截至 2017 年 9 月，已经开发了 700 个特定的应用程序。


    ## Casper 权益证明机制


    正如在此之前的以太坊概述对话中所提到的，以太坊正在将其共识策略从工作证明（Proof of Work）改为 Casper 形式的权益证明（Proof of
    Stake）。下方的图 87 给出了 Casper 权益证明的含义。


    ![](img/image00153.jpeg) *图 87 - Casper 权益证明定义*


    “Casper”是一种基于质押的货币共识协议，其中“固化的验证者”可以押注哪个区块将被记录在区块链上。为了执行 Casper，以太坊利用了其自身的智能合约组件。通过
    Casper 智能合约，任何人都可以注册成为区块验证者，对他们认为认为将作为最终区块添加到区块链末端的区块版本进行押注，检查正在进行的合约押注操作，并退出区块验证者身份。节点通过使用
    Casper 智能合约存入质押来成为“固化”验证者。这就是验证者所设置的“质押”（stake），正如我们之前在权益证明的对话中学习的那样。如果固化验证者在执行区块确认工作时不诚实，他们可能会丢失全部押金。


    在节点固化后，它们可以押注后续哪个区块将被记录在区块链中。对于关于哪个版本的区块最终添加到区块链末端的共识进行押注将带来奖励，而反对共识的押注可能会导致固化验证者的押金损失。


    让我们看一看 Casper 如何处理下一个幻灯片的循环图。


    ## Casper 流程


    下方的图 88 显示了 Casper 的流程。


    ![](img/image00154.jpeg) *图 88 - Casper 权益证明流程*


    1. 框架创建一个区块。

    2. 参与框架的验证者数量受合约数据的限制。

    3. 在分析共识数据后，对哪个区块将成为最终区块进行押注。

    4. 如果没有达到 67% 的绝对多数，则合约继续。

    5. 一旦对同一个区块进行了足够的押注，该区块就会被批准。

    6. 一旦区块添加到区块链末尾，押注该区块的质押验证者将获得挖矿奖励。

    7. 然后交互将从下一个区块再次从头开始。


    ## MultiChain 总结


    下方的图 89 总结了关于 MultiChain 的相关事实。


    ![](img/image00155.jpeg) *图 89 - MultiChain 总结*


    MultiChain 由 Coin Sciences 及其创始人 Greenspan 博士于 2015 年建立。MultiChain 是一个用于在组织内部或组织之间创建和发送私有区块链的现成平台。MultiChain
    的意义在于提供金融领域所需的保护和控制，来克服金融领域发送区块链创新的重大障碍。


    MultiChain 仅支持私有区块链且没有自己的代币。因此，它没有可确定的市值。MultiChain 的目标市场是任何需要构建自己区块链的个人。像埃森哲（Accenture）这样的一些大型咨询公司在他们的区块链实践中使用
    MultiChain。


    MultiChain 使用工作证明共识算法，该算法通过一种名为“挖矿多样性”的策略进行了调整，该策略限制了在给定时间内同一矿工可以创建的区块数量。在组织并不大的私有区块链中，挖矿多样性确保了共识不会集中在少数几个矿工手中。


    MultiChain 不支持智能合约，但通过允许更改控制区块链如何工作的参数（例如区块创建间隔），它可以达到每秒 500 次交易的成交。尽管 MultiChain
    代码下载量已超过 850 次，但目前还没有动态区块链使用 MultiChain。


    ## Hyperledger 总结


    下方的图 90 总结了关于 Hyperledger 项目的关键事实：


    ![](img/image00156.jpeg) *图 90 - Hyperledger 项目总结*


    2015 年 12 月，Linux 基金宣布了 Hyperledger 项目的成立。该项目的目标是开发区块链和分布式账本，特别关注这些框架与现有数字货币方案相比的性能和可靠性。该项目的另一个目标是扩展区块链的强度，使其能够满足全球主要组织所需的规模和交易吞吐量。Hyperledger
    仅支持私有区块链。


