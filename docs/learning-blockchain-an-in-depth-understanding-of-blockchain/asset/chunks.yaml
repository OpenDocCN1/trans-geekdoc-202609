    当信息块结束处的标记断开后，框架目前已准备好仅将交易信息纳入 `SHA256` 哈希计算中，以确定交易 ID。但是，签名数据呢？如果签名对交易 ID 的组成没有影响，那么区块链就不再证明交易已经记录了正确的标记。


    为了保证标记在区块链中仍然可以被相应的交易所检测到，隔离见证（Segregated Witness）在循环中增加了一个额外的阶段。在下方的图 66 中，你可以看到隔离见证者采用了一种当时用于处理区块的策略，即通过对隔离见证
    `[signature]` 信息创建梅克尔树（Merkle tree）。梅克尔树是如何构建的在本书的第 2 章末尾已经介绍过。


    要构建标记梅克尔树，交易的标记被哈希以传递一个 `mark ID`。这些 `mark ID` 随后成对进行哈希，然后对这些哈希再次进行哈希，直到最终只剩下一个哈希——`mark
    Merkle root`（标记梅克尔根）。


    因此，上方图 65 中的图片需要像下方的图 66 所示进行稍微修改，以显示从签名梅克尔树产生的 `Signature Merkle Root` 与待输入的交易数据一起输入到
    `SHA256` 哈希算法中以确定 `Transaction ID`。


    ![](img/image00132.jpeg)*图 66 - 添加到交易数据的签名梅克尔根*


    然后区块构建过程结束，与通常一样，`Transaction ID` 用于构建区块的梅克尔树。通过在交易信息输出中添加 `mark Merkle root`，标记与交易绑定在一起，并进一步影响区块链的外观。


    ![](img/image00133.jpeg)*图 67 - 与交易信息一同包含的签名梅克尔根以构建交易 ID*


    ## 隔离见证的优势


    隔离见证有两个核心优势：一个是消除交易的可变性，另一个是扩大比特币区块的尺寸。交易可变性是一种受限制的拒绝攻击，它指的是通过修改交易中的 `mark hash`
    来更改交易 ID 的方式。通过这种方式，虽然很罕见，但网络上的节点可以更改已发送的交易，导致 `exchange ID hash` 失效。


    查看下方的图 68 以了解交易可变性如何影响 `transaction ID`。这里我们展示了在隔离见证之前，标记是与交易信息一同输入以生成 `exchange
    ID` 的。请记住，由于区块链的理念，许多节点也会处理此区块。注意在下一个交易框中，一个节点调整了 `Pam` 的 `mark hash`，该标记是由 `Pam`
    的私钥签名分配的。网络上的任何节点，只要他们决定，可以在传递之前对 `mark hash` 进行微小的修改来更改 `TXID`。请记住，在模块 2 中研究哈希时，对文本字符串的任何更改——即使是最微小的变化——都会导致生成的哈值完全唯一。对
    `Pam` 的更改导致 `exchange ID` 与原始（真实的）`exchange ID` 不一致。


    ![](img/image00134.jpeg)*图 68 - 交易可变性问题*


    要重要的是，这仅仅改变了 `exchange ID hash`，交易的结果如如，比特币将发送到预期的受益者。交易 ID 特别重要，因为作为一个全球账本，比特币是围绕这些
    `exchange IDs` 组织的。正如我们在第 3 章中审核的那样，当一个比特币交易流被澄清时，新的交易会回溯过去的 `exchange IDs` 以证明发送比特币的个人确实拥有权限这样做。拥有某些无效的
    `exchange ID` 将影响该过程。


    正如我们之前在隔离见证中看到的，标记信息没有被用于计算 `exchange ID`，因此现在不再期望调整它，从而消除了下方图 69 所示的交易可变性问题。


    ![](img/image00135.jpeg)*图 69 - 使用隔离见证消除交易可变性问题*


    ## 增大比特币区块尺寸


    隔离见证的第二个优势是比特币区块尺寸限制的显著扩大。在隔离见证之前，比特币区块是严格的 1,000,000 字节或 1 兆。如左侧图 70 所示，这意味着例如，假设你的每个交易大小为
    250 字节，你可以在一个区块中存储 4,000 个这样的交易。


    ![](img/image00136.jpeg)*图 70 - 隔离见证之前的比特币区块大小*


    有了隔离见证，比特币区块的尺寸取决于许多人所说的“权重单位”（weight units）。目前，一个比特币区块可以存放 4,000,000 个权重单位。确定权重单位的方法是：对于每个字节交易信息，分配四个权重单位。然而，对于每个字节标记信息，只分配一个权重单位，这本质上使得标记在区块中所占的空间获得了
    75% 的折扣——为交易数据留出了更多区块空间。


    所以，我们应该采用之前提到的 250 字节的交易大小。假设这 250 字节由 200 字节交易信息和 50 字节标记信息组成认为如何？图 71 显示了确定区块能容纳多少交易的计算方法。


    ![](img/image00137.jpeg)*图 71 - 隔离见证后的区块容量增加*


    该交易涉及的权重单位数量为 850 个，即 200 字节交易信息乘以四，加上 50 字节标记信息乘以一。净影响是见证信息在每个区块占据的空间更少。以 850
    个权重单位的交易大小，你可以在一个区块中存储 4,705 个交易。因此，在这一模型中，在交易尺寸相同的情况下，实施隔离见证后，区块中可以额外存放 705 个交易。


    ## 侧链


    侧链的可能性已经存在，并在区块链领域中徘徊已很久。侧链 `sidechains` 的基本思想是将信任的去中心化扩展到其他区块链和其他其他高级资源。从根本上说，侧链是允许令牌从一个区块链（主链）安全地在另一个完全独立的区块链（侧链）内部使用的工具，但
    `[令牌]` 任何都可以移回第一链。侧链也被称为替代区块链或替代绑定（alt-binds），有时被称为替代币（alt-coins）。

