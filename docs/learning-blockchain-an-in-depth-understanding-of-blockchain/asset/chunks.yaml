    有各种哈希能力可供使用。尽管如此，每个哈希无论其创建它时使用的实际计算，都具有特定的属性。例如，所有哈希在计算上都是高效的，因为确定哈希或确认哈希的合法性都不需要耗费长时间。哈希同样具有抗碰撞性（crash
    safe），这意味着它们的创建涉及一个方程，使得其他某些文本产生相似哈希的可能性几乎是不可能的。一个 `Hash` 应该隐藏关于创建该哈希的原始文本字符串的信息。总而言之，尽量不要能够通过观察哈希结果中的特征来获取哈希信息的属性。请查看上方图
    4 中的第二个和第三个示例。两个字符串之间仅有一个单词的区别——Pam “brushes” 与 “brushes” her hair（梳理头发）。然而，当你分析这两个文本字符串的哈希结果时，生成的哈希之间没有任何关联。而且最后，哈希结果应该给人一种完全随机的印象。假设你分析了两个仅有一个字母区别的字符串生成的哈希，这两个哈希之间将不具有可比性。


    ## SHA 256


    区块链利用的哈希计算之一是 `SHA256`（安全哈希算法）计算。虽然区块链使用了各种哈希能力，但我们在书中模型中将统称为 `SHA-256`。其他哈希计算的总体思路也类似。`256`
    指生成的哈希输出中包含的部分数量。显然，`256` 个部分产生一个 32 字节（32 个字符）的结果。请记住，哈希是信息的计算机唯一标记。以下是我将我的姓氏
    `T-A-T-R-O` 逐个字母组合时产生的一些真实 `SHA-256` 哈希结果。


    请观察每个字符组合时产生的后续哈希：


    主哈希仅针对字母 `T`。


    ![](img/image00077.jpeg)接下来的哈希针对两个字母 `TA`，以此类推。


    ![](img/image00078.jpeg)最后，`TATRO` 看起来是这样：


    ![](img/image00079.jpeg)


    进一步注意，没有任何哈希看起来与之前的哈希有相似之处，也没有易于理解的例子说明哈希结果是如何产生的。同样，假设我再次组合我的名字，我们在通过模型时看到的完全相同的哈希将再次出现，因为这些哈希显著地区分了相关的文本字符串。


    ## Blocks（区块）


    现在我们已经将哈希加入工具箱，我们通过观察存储在区块中的部分数据开始区块链之旅。请参考下图 5：


    ![](img/image00080.jpeg)*图 5 - 已解决的哈希*


    在这个模型区块中，有四个信息字段如下：


    1. 区块编号 – 这是一个连续数字，每当向区块链添加另一个区块时就会增加一次。

    2. `Nonce` – 用于挖掘系统中的数字，将在几段话中解释。

    3. `Data region` – 这是存储区块中交易信息的区域。在我们的模型中，它只包含一些简单数据。

    4. `Hash` – 这是包含区块内信息进行 `SHA-256D` 哈希计算的输出结果的信息字段。将与 `nonce` 关联的区块编号、信息区域全部作为字符串参与
    `SHA-256` 计算。显示的哈希即结果。


    注意哈希的初始 4 个高位字节为 `0000`。这是一种特殊的哈希，表明该区块通过了工作证明（Proof of Work）的关键过程，并交付了一个低于特定难度标准的哈希！在整书中，这种特殊的哈希被称为“已解决”（addressed）哈希。已解决哈希的高位零的数量取决于分配给哈希问题的难度，但已解决的哈希会有一定数量的高位零。


    在下方的图 6 中，我在数据字段输入了“Tatro”，有效地更改了该区块代表的数据字符串。


    ![](img/image00081.jpeg)*图 6 - 向区块中添加 TATRO*


    现在，进入 `SHA-256` 哈希计算的信息字符串包含了区块编号 `1`、`72608` 的 `nonce` 以及名字 `TATRO`（该字符串类似于 `172608TATRO`），以产生另一个哈希。注意，从包含
    Tatro 的字符串创建的新哈希通常不是已解决的哈希！为了说明这一点，区块颜色变成了红色。同样，需要注意的是，用于区块工作证明的真实信息与此处显示的信息不同，但哈希函数的总体原理是相同的。


    我们如何找回已解决的哈希？这就是 `nonce` 成为可能最重要的因素的地方。如果我在这里继续在 `nonce` 字段中输入数字 `1` [one] 并计算哈希，检查哈希值是否小于难度目标，然后是
    `2` [two]，然后 `3` [three]，以此类推……我最终会找到一个 `nonce value`，它在与其他区块数据字段结合提交时将产生一个已解决的哈希。由于我不想物理地重复这一操作，我点击此模型中的
    `MINE` 按钮，它将为我完成这个迭代循环。挖掘指的是涉及向组织提区块的方法，这些区块被证明是难以制作的。查看下方的图 7 了解挖掘过程最终发现了什么：


    ![](img/image00082.jpeg)*图 7 - 标记的 TATRO*


    ## 区块是如何形成区块链的？


    当区块通过共识后，它们被添加到区块链的末端。注意下方的图 8，区块配置中显示了一个字段。


    ![](img/image00083.jpeg)*图 8 - 显示过去的哈希信息字段*


    新发现的字段是上方红框标出的`过去的哈希信息字段`。`过去的哈希信息字段` 包含了前一个区块在区块链中的证据哈希。这充当了将区块整合到区块链中的连接。考虑下图
    9 所示的简单三区块区块链：


    ![](img/image00084.jpeg)*图 9 - 三区块区块链*


    首先，注意每个区块的哈希信息字段都有已解决的哈希，因此我们立刻意识到这些区块已被区块链通过。然后，注意前一个区块的哈希被复制到后续区块的过去的哈希信息字段中，有效地将区块连接在一起形成区块链。最后一点是，主区块之前的零证明了它是链中的第一个区块——也被称为“创世纪区块”（genesis
    block）。


