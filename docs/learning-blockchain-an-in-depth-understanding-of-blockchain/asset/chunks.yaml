    核心数据集被一个 `Blockchain` 取代。计算机化的标记和协议保证了信息的真实性，而几乎不考虑使用了何种方法将信息存储在 `Blockchain`
    上。同样，`Blockchain` 的仅追加属性保证了信息在稍后无法被更改。`Blockchain` 中没有更新或删除指令。可以使用固性哈希（Solid hashing）在不暴露信息内容的情况下进行信息检查。在这种情况下，信息的隐私并不是问题，因为其整个意图是创建一个公共账本，每个成员在需要时都可以看到——无论某些信息是否经过了加密或哈希处理。


    ## 可能的数据公证应用


    在查看了关于一项介绍 `Blockchain` 潜在优势的相当非他性的指南后，以下是潜在数据公证应用的详细列表，这些应用可以从区块链中受益：


    *   医疗记录

    *   监控摄像头录像

    *   知识产权文件

    *   联盟数据存储

    *   确保证据的监管链

    *   法庭文件


    这些应用中利用的 `Blockchain` 基本属性有：


    *   加密账本

    *   去中心化网络

    *   去信任对手

    *   不可篡改性

    *   仅追加数据


    ## 区块链与物联网


    根据维基百科，物联网是实际设备、车辆、家用设备和其他事物的组织，这些设备安装了硬件、程序、传感器、执行器和网络可用性，使这些物品能够相互连接并交换信息。在过去的相当一段时间里，物联网被推崇为计算领域的下一个大大事。显然，那是在下一个大大事——`Blockchain`
    出现之前。这让人不禁思考，“如果这两个接下来的大大事在一个应用中结合会发生什么？会有什么影响？”下面的图 104 显示了草莓从农场运到杂货店终点的示例应用流。


    ![](img/image00174.jpeg)

    *图 104 - 物联网与区块链应用流*


    1. 第一步是这种情况中的每个成员都了智能合约的条款。在这个模型中，智能合约仅关注运输过程中盛放草莓的隔间的温度。成员包括农场、运输公司、物流公司、终端和杂货店。容器温度不能超过华氏度，否则隔间将被打开以调查可能的拒收。


    2. 草莓被代币化，这样随着运输的进行，产品的不同控制器就可以确保他们拥有正确的产品，并通过 `Blockchain` 报告运输区域。


    3. 草莓被堆叠在智能隔间内。这些隔间配备了特殊的 `BOLOS-center sensor dev` 来监控隔间的温度。在第 8 章中，详细列出了 `BOLOS-center
    sensors`。这些 `BOLOS-center sensors` 是 `Blockchain` 感知的，并且具有用于设备识别的私钥，以及在设备受到攻击时的独特防篡改能力。代币被刷新，以显示交付方目前拥有草莓的所有权。


    4. 因为智能隔间具备网络功能，只要可以访问互联网，产品的当前状态数据就会传输到物联网云，然后在区块链的分布式账本中进行同步。到目前为止，这些隔间显示的温度为
    28 华氏度，这在智能合约中指定的允许温度范围内。


    5. 货物到达仓库，智能隔间被移到卡车上。由于站点有互联网可用性，智能隔间将状态数据通信到云端。温度为 31 华氏度，仍在智能合约确定的允许温度范围内。代币被刷新，以显示物流公司现在拥有草莓的所有权。


    6. 智能隔间到达其位于杂货店的最终。由于那里有互联网可用性，智能隔间传输最新的产品状态信息。现在，智能隔间报告的温度是华氏度。温度超过了智能合约中列出的合适隔间温度。因此，货间应该被打开。


    ## 区块链为物联网带来了什么


    区块链为物联网带来的主要优势围绕着身份。由于物联网所指的“物”是各种电子设备，确保设备具有不可篡改的特性至关重要。这包含了捕捉设备的相关属性，如生产者、固件以及其他任何内容。每个设备分配了一个高级身份和数字签名作为私钥。`BOLOS-center
    sensors` 可用的属性可以确保设备不被篡改。这涉及到设备的责任。


    随着时间的推移，设备将产生一个“声誉历史”，特别是当设备证明是可靠的。而且，正如我们在之前的溯源应用场景中发现的，`Blockchain` 可以保证真实性，并同时为交付的所有物品或产品提供完整的溯源。最终，将区块链与物联网结合，为整个过程中的每个成员提供了验证的策略。与其让物流公司通过纸质记录流来等待确认，`Blockchain`
    中近乎实时的更新为过程中的每个成员提供了通过智能合约进行验证的数据。


    ## 区块链面临的挑战


    区块链的接收面临一些挑战，但最大的三个挑战是：


    1. 法规的不确定性

    2. 组织效应

    3. 缺乏标准


