    计算机签名的优势之一是将标记与实际消息结合，并在循环开始前对消息进行哈希处理。通过将标记密钥限制在消息中，实际消息成为了标记的必经之路。这与传统的转录标记完全不同，后者在不同报告之间从不显示出任何变化的迹象。你每次编写标记时，标记都是非常相似（或相同），并且与你所标记的存档的细微之处丝毫不相干。通过计算机签名，每对消息/签名都是独有的，这使得伪造变得变得困难得多。


    在应用标记之前，消息会不断进行哈希处理。请记住，哈希输出始终为 32 字节，这使得消息标记循环更加简单。在应用标记密钥之前先对消息进行哈希，编程系统得到了简化，因为软件工程师意识到他们将永远拥有一个固定长度的
    32 字节字符字符串来处理，而不是一个长度不明的可变消息行。


    ## 区块链身份 (BlockchainID)


    区块链身份（或 `Blockchain ID`）是一个非排他性术语，指的是区块链上的任何角色。客户端可以根据选择拥有任意数量的区块链身份，并注册这些身份，就像在
    LinkedIn 或 Instagram 上注册账户或在互联网上注册空间名称一样。


    区块链身份与其他辅助工具记录之间的根本区别在于，基于区块链的框架具有强大的所有权。区块链角色无法被任何服务夺取，因为框架将所有权定义为对公/私密钥对的责任，非常就像对比特币的责任一样。这与
    LinkedIn 或 Instagram 用户名直接不同，后者可以随时被特定公司夺取或控制。


    ## 比特币交易示例


    为了看到计算机签名如何在真实交易所中工作，我们将观察比特币交易所并注意高级标记所扮演的角色。在这个模型中，我们有两个成员，Pam 和 Bob。Pam 需要将
    500 个比特币转给 Bob（幸运的 Bob）。将此交易所视为一方（在本模型中为 Pam）向另一方（在此情况下为 Bob）移动比特币的精心标记的演示。在交易的双方，你都有
    Pam 和 Bob 的公钥和私钥。请看上面的图 30 查看交易设置。


    ![](img/image00101.jpeg) *图 30 - 比特币交易所设置*


    现在我们已经知道了参与者是谁以及交易的理想结果是什么，我们应该观察一下其运作机制。


    ![](img/image00102.jpeg) *图 31 - 比特币交易流程图*


    请看上面的图 31 查看处理比特币交易的流程。交易所的初始阶段是 Pam 应该最近获得了足够的比特币，以覆盖她需要转给 Bob 的 500 个。注意区块链交易所表，Pam
    总共从三个独立个人（通过他们的确认密钥识别）处获得了 700 个比特币。沿着此线，显然 Pam 拥有足够的比特币余额来覆盖向 Bob 交换 500 个比特币。


    流程的第 2 步是产生 Pam 现在想要花费的过去交易中未花费“收益”的验证。未花费的结果随后作为证据贡献消息，证明 Pam 有足够的比特币来覆盖她向 Bob
    的交易。在比特币交易所中，这些信息应该始终接近交易的结果。因此，在这个模型中，由于 Pam 贡献了 700 个比特币，结果应该以某种方式分若干比特币。消息的结果侧显示
    Bob（通过其公确认密钥生成的地址识别）收到了来自 Pam 的 500 个比特币转账。你永远不会直接向公钥发送比特币，而是锁定比特币，以便你发送硬币的地址所标识的公钥允许以后任何时候花费并将其发送到其他地方。同样，199
    个比特币正在转回（或由 Pam 保留）。假设你在 199 的基础上增加了 500，你只得到了 699 个比特币。我们明确意识到信息应该接近结果。在我们开始的
    700 个比特币中缺少了一个比特币……这个“丢失”的比特币将被确认该区块为交易处理的矿工获得，作为交易处理费用。最后，为了完成交易，Pam 利用她的私标记密钥在消息哈希中创建一个标记，并为该交易记住它。


    在交易经过检查并与不同的交易打包成一个区块后，它将被传输到区块链网络上的不同节点，以便每个人都可以刷新他们的区块链传记账本副本。


    ## 第 4 章


    # 获取共识


    在这一部分中，我们将描述“什么是共识？”以及哪些考虑驱动了不同的共识算法。此外，并将彻底分析第一个共识算法——工作证明（Proof of Work）。区块链内部这种单一的共识能力是它为处理领域的最卓越能力。在整个记账的历史中，未知成员之间有价值的交换从未能够在不包含受信赖第三方的情况下，使用先进密码学获得批准和结算。区块链中整合的共识系统有效地将结算中的政治问题转化为数学问题。


    我们应该从一个定义开始讨论共识：![](img/image00103.jpeg) *图 32 - 共识定义*


    ## 通用共识方法


    通常情况下，通过主观信任实现共识的算法很大程度上需要在已知成员集合中进行某种投票。区块链技术已使用了两种通用方法。主要方法是“针对内部故障的拜占庭适应”，随后的方法是通常被称为“中本共识”算法的方法。


    通过“针对内部故障的拜占庭适应”方法，需要在成员之间进行多轮投票，直到对区块有效性达到特定的认可水平。


    中本共识实际上是针对某些显著对比的非关键故障的功能性拜占庭适应。在中本共识中，通过某种“抽签”选出领导者。例如，在比特币中，第一个有效解决密码谜的成员赢得领导者竞选抽奖。'
