    在这个基础模型中，一个区块中包含四次交易。通常情况下，交易会多得多，但这勾勒了核心思想。发生的主要事件是，每笔交易都会生成一个对应的 `hash`。


    然后，每对哈希被合并成另一个 `hash`。假设交易数量是奇数，那么在那个点，奇数哈希将与自身合并，从而产生一致的哈希集并生成 Merkle 根（Merkle
    root）。


    ![](img/image00095.jpeg)

    *图 24 - 交易哈希对的处理*


    最后一对哈希被合并形成 Merkle 根。


    ![](img/image00096.jpeg)

    *图 25 - 创建 Merkle 根*


    如果没有方块头部中的 Merkle 根，就无法对区块中记录了哪些交易进行密码学确认，也无法验证其内容没有被篡改。


    首要任务是，交易本身并不被放入 Merkle 树中，而是交易的哈希。Merkle 树存储了区块中包含哪些交易的密码学确认以及交易的顺序请求。证明“此区块是真实的”的工作量证明（Proof
    of Work）是基于对所有交易的 Merkle 树输入进行哈希。假设任何交易中的任何一个细节发生了变化，Merkle 根也会随之改变。这包含了对区块中交易请求的任何修改。


    最后，Merkle 树提供了几层检查，用于验证单笔交易、确认树结构以及检查区块。


    第二章此结束。我们应该继续进入第三章：身份与交易。


    # 第三章


    # 身份与交易


    在第三章中，我们将检查区块链如何识别给定交易中成员的身份。我们还将描述身份是如何产生的以及公钥与私钥之间的关系。


    ## 什么是数字签名


    让我们从定义开始。


    关于带有 ![](img/image00098.jpeg)

    *图 27 - 数字签名创建处理流程*


    签名密钥是通过一个极大的数字生成的，该数字通过密钥生成程序处理，并用于数值上推导出确认密钥。关于组织的其他数据以及一个经过哈希处理的更改，创建创建一个组织上不同节点都能看到的位置。你通过你的位置获取到他人发送给你的密码学形式的货币。当进行任何带有检查（“公钥”）密钥的友善交易时，将使用确认密钥来验证客户端。


    此时，你可能会问自己：“假设确认密钥是从签名密钥获得的，难道别人不能只创建一个反向密钥生成器，从确认密钥推导出签名密钥吗？”密码学家通过使用确认密钥解决了这个问题，它是一个复杂的数学算法来生成签名密钥；但要“反转”计算以实现逆过程是非常困难的。说实话，世界上最强大的计算机需要超过
    40,000,000,000,000,000,000,000,000,000 年才能完成此计算。


    签名密钥和确认密钥都是巨大的整数，但由于这些数字如此巨大，它们通常使用钱包导入格式（WIF）进行处理，如下所示的字母和数字：


    ## 5HueCG8rMjxEXxiP5BDku4MkFq


    现在我们明白了数字签名是如何产生的，我们应该观察如何使用数字签名来确认交易。


    ## 数字签名工作流


    让我们检查消息是如何被处理的，以及数字签名何时发挥作用。参考下面的图 28：


    ![](img/image00099.jpeg)

    *图 28 - 发送高级消息处理流程*


    在消息的发送端，要发送的消息以及源的标记（私钥）密钥用于标记计算。结果是根据消息和签名密钥生成的标记消息。


    图 29 显示了消息接收端发生了什么。


    ![](img/image00100.jpeg)

    *图 29 - 接收高级消息处理流程*


    在消息的接收端，标记消息和原始消息从发送者处发送。它们与在创建消息时植入的确认（公钥）密钥结合。这三个部分共同用于标记检查计算。标记检查结果可能判断标记消息是否真实——它并不会泄露私钥！这样，如果消息是真实的，消息就会被确认。任何情况下，消息会被拒绝。


    ## 数字签名的优点


