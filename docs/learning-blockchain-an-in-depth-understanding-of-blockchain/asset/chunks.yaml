    # 共识区块链


    通过“证明证明”（Proof of Proof），涉及了多个区块链。下方的图 60 描述了参与证明证明的各种区块链。


    ![](img/image00126.jpeg) *图 60 - 证明证明区块链参与者*


    在证明证明的环境中，主要的区块链成员是共识提供区块链（CPB）。这是一个将为其他区块链的周期提供额外安全性的区块链。截至目前，该共识提供区块链是 `Bitcoin`
    区块链。


    接下来的区块链成员是能够通过证明证明获得额外安全性优势的区块链。这些被称为共识继承区块链（CIB）。在该模型中，我们展示了几个已知的区块链，但任何区块链都可以成为共识继承区块链。


    在此次交互中的最后一种区块链是证明证明区块链，它提供了其他两个区块链之间的关联。


    # 证明证明处理


    证明证明的基本目标是使一个获取共识的区块链能够获得共识提供区块链的全量工作证明安全性。尽管如此，证明证明的交互不应该：


    1. 对共识继承区块链施加任何非微道的障碍。总而言之，利用证明证明优势的区块链不需要更改其环境中处理区块的任何方式。

    2. 要求共识提供区块链的区块链矿工以这种方式对其进行授权。另一方面，正如获取共识的区块链不应受到证明证明的影响，共识提供区块链也不应该受到影响。

    3. 在共识提供区块链故障时，导致获取共识的区块链无法使用。


    此外，获取共识组织的非挖矿客户端不需要与共识提供组织进行交互，也不需要持有共识提供区块链网络的任何本地标记。


    # 证明证明处理流程


    参考下方的图 61 了解证明证明的处理流程。


    ![](img/image00127.jpeg) *图 61 - 证明证明处理流*


    1. 在获取共识区块链环境中建立一个新的区块。证明证明矿工可以根据框架设置和矿工可用性选择是否处理区块。

    2. 如果该区块未被处理，将创建另一个区块。如果证明证明矿工决定处理该区块，则当前区块的数据连同证明证明提取器封装的矿工标识被放入 `VeriB` 交易中，`VeriBlock`
    区块链将得到更新。在 `VeriBlock` 区块链中捕获状态信息时，对可以捕获的信息的大小有一个限制。注意，新类型的矿工——证明证明矿工被分配了一个 PDA
    图片以显示需求是多么轻量化，而且任何人都可以成为证明证明矿工！

    3. 获取共识的区块链的状态信息随后封装到 Bitcoin 交易中，并与其他交易一起提交进行处理。提醒一下，请看下方的图 62，它是我们在模块 5 中作为此交互的组件研究过的工作证明处理流，所有讨论过的挖矿计算和验证最终将在一个包含获取共识区块链状态信息的区块上执行。


    ![](img/image00128.jpeg) *图 62 - 工作证明处理流回顾*


    现在，证明证明提取器处于待命状态，查看 `Bitcoin` 组织上的哪个区块将包含来自获取共识区块链的状态信息。如果共识提供区块链中的最新区块不包含共识继承状态数据，将检查下一个区块。


    当共识提供区块链中交付一个包含状态信息的区块时，`Bitcoin` 区块的某些组件会被证明证明矿工捕获，并带回 `VeriBlock` 区块链。


    来自 `VeriBlock` 区块链和共识提供区块链的状态信息被封装并提交到获取共识的区块链中处理。


    当被证明证明提取器捕获的状态信息对于获取共识区块链中的某个区块很重要时，它将导致任何需要非法分叉区块链的攻击者需要同步分叉三个区块链：`Bitcoin` 区块链、`VeriBlock`
    区块链和获取共识的区块链。


    在下方的图 63 中，描述了一个证明确认的情况，涉及三个区块链：获取共识的区块链（在此模型中标记为 alt 链）、`VeriBlock` 区块链以及在该模型中显示为
    `Bitcoin` 的共识提供区块链。


    ![](img/image00129.jpeg) *图 63 - 证明证明攻击防御*


    1. 如前所示，来自 alt 获取共识的区块链的某些状态信息被捕获在 `VeriB` 区块链中。

    2. 然后，来自获取共识区块的状态信息以及来自 `VeriBlock` 区块链的状态信息被更新到 `Bitcoin` 共识提供区块链中。

    3. 当攻击者提出替代历史时，alt 链引用其自身状态信息的过去分布来偏转哪种历史是有效的。


    为了让攻击者成功分叉 alt 链，他们还需要同时分叉 `Bitcoin` 和 `VeriBlock` 的区块链。这是不可能的。这种针对攻击的额外防御就是 alt
    链之所以想要使用证明证明的原因。


    # 隔离见证 (Segregated Witness)


    我们将视角离开共识，转向几个你显然已经学过的议题。第一个是隔离见证（Segregated Witness）。“隔离见证”是 Bitcoin 交易信息结构的一个新更新，它将交易签名部分从数据段隔离开，消除了
    Bitcoin 的交易扩展性问题并扩大了 Bitcoin 区块的大小。让我们来看看在引入隔离见证后，Bitcoin 交易结构具体发生了什么变化。


    参考图 64 get 隔离见证之前 Bitcoin 交易数据的数据结构图像。


    ![](img/image00130.jpeg) *图 64 - 隔离见证之前的 Bitcoin 交易信息结构*


    你将从第 3 章了解到，交易信息由此处所示的数据源和结果组成。注意在结果字段中，签名或公钥与移动硬币的个人或人们的签名包含在一起。在验证交易时，会检查公钥以确保它具有正确的哈希（匹配记录），随后检查签名以确保它对交易是有效的，并且是用提供的公钥创建的。从那里开始，位置相关的公钥是公开已知的。这些交易信息随后有助于哈希计算以产生交易
    ID。交易 ID 额外贡献于构建梅克尔树。


    ![](img/image00131.jpeg) *图 65 - 隔离见证的交易信息设计*


    随着隔离见证的引入，所有的签名数据都移动到交易数据块的末尾，如上方图 65 中的红色框所示。


