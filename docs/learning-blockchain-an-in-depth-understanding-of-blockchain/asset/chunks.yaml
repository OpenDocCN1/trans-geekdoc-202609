    目前没有与 `HyperLedger` 相关的代币，因此没有可量化的市值。`HyperLedger` 的目标市场是全球范围内的机械、货币和库存网络组织，这些组织需要私有区块链。不同的
    HyperLedger 项目成员为该项目贡献了不同的区块链方案，因此共识机制在一种具有可配置方式以处理“等待时间证明”（`Proof of Elapsed
    Time`）的客户端之间进行切换。HyperLedger 衍的区块链支持智能合约。由于有多个 HyperLedger 可选区块链，其交易吞吐量有所不同。目前，HyperLedger
    项目已交付了四个区块链。


    IBM 交付了一个名为 `Fabric` 的区块链，`IBM` 在其封装了大量的行政服务，如便利化和区块链即服务。Intel 交付了一个名为 `Sawtooth`
    的区块链，它利用了 Intel 的 `SGX Trusted Execution Environment` CPU。这两种情况的交易吞吐量均可达到每秒 1,000
    次。


    `TrustedChain` 是由欧洲信誉服务提供商组成的许可区块链组织，由 `Ifin Sistemi` 设计，它是意大利在政策执行和银行领域信誉管理领域的领先机构。`TrustedChain`
    基于 `HyperLedger Burrow` 区块平台。最后一个模型是 `Corda`，其 `Thusurce` 代码已于 2017 年 10 月交给 HyperLedger
    项目。`R3`（制作 `Corda` 的组织）履行了将其代码开源的承诺。因此，随着 `Corda` 的扩展，HyperLedger 项目可以提供一种真正的区块链解决方案的共享账本方案。


    在图 90 的 `notes` 部分，列出了属于 HyperLedger 项目的五个平台（区块链）。贡献创新的组织显示在括号中。


    ## Ripple 总结


    下图 91 显示了关于 Ripple 相关事实的摘要：


    ![](img/image00157.jpeg) *图 91 - Ripple 总结*


    Ripple 由 `Ryan Fugger` 在 2004 年构想，但直到 `Jed McCalib` 和 `Chris Larsen` 在 2012 年带着他们的数字货币想法找到
    Fugger 先生后，它才如预期那样运作。Ripple 通过 `RippleNet` 联合了银行、分期供应商、数字资产交易所和公司，为国际现金汇款提供无缝体验。Ripple
    作为一个私有区块链运行。Ripple 拥有自己的数字货币 `XRP`，符号也为 `XRP`。`XRP` 的当前市值为 82 亿美元。Ripple 的目标市场是整个支付和货币转移市场。你将在第
    6 章详细回顾 `Ripple 协议共识算法`（`RCPA`）。利用 `RCPA` 通过在 `Unique Node Lists` 内达成 80% 的一致来获得共识。


    Ripple 支持智能合约，`RippleNet` 交易吞吐量可以达到每秒 1,500 次。截至 2017 年 9 月，已有 100 多家银行在 85 多处执行中使用
    Ripple。Ripple 是仅于 `Bitcoin` 和 `Ethereum` 的第三大数字货币。


    ## EOS 总结


    下图 92 总结了关于 EOS 的要点：


    ![](img/image00158.jpeg) *来源：https://coinmarketcap.com/ 图 92 - EOS 总结*


    EOS 由名为 `Block One` 的组织创建，由丰富的区块链愿景家 `Dan Larimer` 推动。EOS 于 2017 年推出，作为主要的区块链工作框架，重点在于主要的区块链工作框架。EOS
    阶段的主要目标预计将于 2017 年底交付。EOS 支持公链和私链。


    EOS 拥有自己的数字货币 `EOS`，符号也为 `EOS`。`EOS` 的当前市值为 8 亿美元。EOS 的目标市场是风险区块链。


    EOS 不支持智能合约，EOS 的交易吞吐量可以达到每秒 10,000 次。由于 EOS 尚未交付，目前尚无执行在使用它。它是仅于 `Bitcoin` 和
    `Ethereum` 的第三大数字货币。


    在图 92 的注释字段中，有趣的是，不像 `Ethereum`（消耗 `Ether` 货币），用户可以免费使用 EOS 基础。


    ## EOS 区块链操作系统特性


    EOS 为市场带来的一些独特特性如下：


    1. 治理

    2. 可扩展性

    3. 免费使用

    4. 容易更新和错误修复

    5. 工业级功能


    让我们检查每个功能：


    治理 - EOS 拥有一份每个人都签署的宪法。该宪法详细说明了 EOS 环境内部的分布式管理条款，因此每个人都了解情况。此外，它不是自定义的，宪法具有约束力，因为它具有法律约束力，并在出现问题时提供干预工具。宪法还允许
    EOS 群体随时投票更改宪法。


    可扩展性 - EOS 旨在实现通用性以帮助大量用户。这是一个巨大的案例，但由于 Dan Larimer 创建的另一个区块链 Steem 已经支持大量的并发用户。


    免费使用 - EOS 考虑免费使用平台。用户投入 EOS 代币，从而获得 EOS 框架资源，如数据传输、存储和 CPU 周期。这样，假设你拥有 1% 的 EOS
    代币，你就可以获得 1% 的框架资源来运行你的应用程序。


    容易更新和错误修复 - 可以在不分叉框架的情况下应用升级和修复错误，这在 `Bitcoin` 和 `Ethereum` 中发生过。

