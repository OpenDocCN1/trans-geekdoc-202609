  trans: "\n– 像一个无尽的圆一样——或者失效，EOS 的区块生产者可能会冻结应用程序，因此没有足够的理由去分叉区块链。此外，框架更新由合作伙伴决定，并且没有足够的理由通过硬分叉（hard\
    \ fork）区块链来执行这些升级。\n\n### 工业级功能\n\nEOS 计划通过将传播的应用及其运行其上的去中心化 PC 连接，并将两者与一个强大的工作框架相结合，来实现现代实力。下方的图\
    \ 93 显示了连接分布式计算机与 EOS 应用程序的工业级功能列表。\n\nEOS 工作框架将提供合作伙伴在区块链世界之前通常所预期的许多特性和活力，例如：\n\
    \n- 账户执行器：客户端可以通过普通名称而非密码学密钥来识别其账户。 \n- 基于用户的记录许可：个人可以根据其在组织中的职位访问应用程序功能。\n- 确定性等等处理：对功能进行评估，以决定它们是可以等等处理还是应该按顺序处理。例如，交易所应该按顺序处理，而字符串分配可以并行处理。\n\
    \n![](img/image00159.jpeg)\n*图 93 - EOS 现代实力功能*\n\n- 数据库和列表。每个客户端将拥有自己的数据集，并且这些数据集可以被记录以获得更快的访问速度。\n\
    - 智能合约支持。EOS 将支持智能合约。\n- 身份验证以及密钥管理也将由 EOS 提供，以确保身份得到妥善对待。此外，账户恢复已集成到框架中，为客户在密钥被盗用时提供了一种重新获得账户控制权的方法。通过提供这些能力，EOS\
    \ 有一个真正的机会改变未来区块链市场的发展方向。\n\n## 委托权益证明（DPoS）定义\n\n正如之前提到的，EOS 涉及委托权益证明（Delegated\
    \ Proof of Stake）作为一种共识算法。参见下方的图 94 的委托权益证明的定义。\n\n委托权益证明是指 EOS 区块链上的代币持有者通过持续批准投票系统选择区块生产者，区块生产者产生的区块数量与其相对于所有其他生产者所获得的总票数成正比。我们应该分析委托权益证明的属性。\n\
    \n![](img/image00160.jpeg)\n*图 94 - 委托权益证明定义*\n\n## 委托权益证明的特性\n\n通过委托权益证明，实际上每个区块生产者轮流工作。在任何时候只有一个区块生产者处理给定的区块，其处是委托权益证明区块链不会像我们在工作量证明（Proof\
    \ of Work）中看到那样产生分支，因为区块生产者是协作产生区块，而不是竞争。\n\n只要证明他们自己有能力这样做，任何人都可以成为区块生产者。前 20\
    \ + 1 名得票获得者成为区块生产者。总批准数排名前 20 的将自动选用于每轮区块生产，最后一个区块生产者（在投票中排名第 21 位）被选为根据其相对于其他区块生产者所收到的票数比例来生产区块。在\
    \ EOS 中，验证者与区块生产者是分离的，有助于提高吞吐量。\n\n## 委托权益证明工作流\n\n下方的图 94 显示了委托权益证明流程图。 \n\n\
    ![](img/image00161.jpeg)\n*图 95 - 委托权益证明流程*\n\n1. 候选区块生产者由合作伙伴通过持续的民主周期决定。前 20\
    \ 名得票获得者加上 1 个备用区块生产者形成了区块生产者池。\n2. 区块生产者根据区块时间的任意请求顺序排队。\n3. 第 21 个区块生产者将根据其与其他区块生产者相比获得的票数数量参与区块创建。在图\
    \ 93 中，第 21 名得票者是池中剩下的唯一区块生产者。\n4. 一组交易变得可供处理。 \n5. 处于队列顶端的区块生产者是创建此区块的唯一尝试。所有其他人都在排队，准备准备下一个区块。\n\
    6. 区块生产者有三秒钟完成区块的形成。假设区块生产者在三秒窗口内没有完成区块的形成，那么此时队列中的下一个区块生产者将尝试构建区块。\n7. 如果该区块生产者在三秒窗口内完成了区块，那么此时该区块将提交审批。然后，过程再次从头开始。\n\
    \n## 演进中的区块链总结\n\n让我们总结一下对区块链商业中心的调查。比特币是该领域主要的区块链，并证明了这一理念。但所有人（包括比特币在内的项目）都试图对原始设计进行改进。这些开发驱动围绕着提高更好的交易吞吐量以及使编程语言变为图灵完备。\n\
    \n![](img/image00162.jpeg)\n\n由于从根本上扩展了智能合约能力，以太坊在中心具有巨大的吸引力。然而，你需要支付费用以参与以太坊平台，为执行的每行代码支付以太坊。但是，无论如何衡量，以太坊都是最广泛使用的区块链。\n\
    \n![](img/image00163.jpeg)\n\nHyperledger 凭借其 IBM、Oracle 和 Intel 等蓝筹成员，希望创建使用\
    \ Hyperledger 技术的行业垂直联盟。然而，显然这些蓝筹成员有一个更深层次的目的是，通过提供与其相关的服务和设备来推动 Hyperledger 区块链。\n"
