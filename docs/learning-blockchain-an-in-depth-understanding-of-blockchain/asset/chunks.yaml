    关于精明协议的想法最早出现于 1994 年左右，当时法律研究人员兼密码学家 `Nick Szabo` 意识到去中心化的记录可以用于精明协议，这种协议通常被称为自动执行合约、计算机协议或
    `Blockchain` 合同。请参考图 73 获取 `Smart Contracts` 的定义。


    ![](img/image00139.jpeg) *图 73 - 智能合约定义*


    在这种配置下，合同被转换为名为 `scripts` 的 PC 代码，存储并复制在框架上，并由运行 `Blockchain` 的 PC 组织引导。这种精明合约的想法在数据时代变得越来越重要，因为它通过确保合同责任符合约定的条款和条件，扩展了企业的一致性能力。


    ## 纸质合同与代码合约


    传统的带有常用“法律术语”的纸质合同与在 `Blockchain` 中编码的精明协议之间的本质区别。下图 74 显示了差异的概述：


    ![](img/image00140.jpeg) *图 74 - 纸质协议与代码协议的差异*


    1. 首先，对于纸质 get，协议的每一个状态都是一张纸，事后墨水干了，合同的细节就开始从记忆中淡化。如果协议中有特定的要求，你需要尝试回忆这些事情以保持与协议的一致性。对于编码协议，一致性是计算机化的，因为只要满足合同中规定的条件，代码就会一致地执行。


    2.  {一个区别是纸质合同的词义细微差别，这可能留有不同的解释。相比之下，精明合约的执行是可预测的，在每个实例中的运行方式完全相同。


    3. 纸质合同存储在工作区域或协议管理系统中，只有在出现问题时才会被引用。那么，精明协议分布在整个 `Blockchain` 网络中，随着交易的执行（包括精明协议），代码被执行，并且结果实时取决于组织节点的协议。


    4. 最后，为了将纸质合同与编码协议连接起来，普通的纸质协议可以包含法律律师熟悉的所有“如果”语句。然后纸质合同中的一个条款指向 `Blockchain`
    上的智能合约，写道：“这是我们双方同意的内容，我们将遵守代码的结果。”由于某种原因结果变得不令人满意，两个参与者应该接受结果，因为他们在合同中批准了代码结果。


    ## 智能合约的优势


    任何需要标记的东西都可以变成精明协议。如下所示，与纸质伙伴相比，智能合约提供了明确的价值：


    1. 增加信任 – 因为每个报告都是共享的，对协议的信任程度增加了。


    2. 增加备份 – 由于 `Blockchain` 的概念，数据在 `Blockchain` 周围被重建。这表明组织成员对跨越 `Blockchain` 网络的数据达成了一致。


    3. 增加节省 – 智能合约导致了节省，因为它们消除了对中介的需求。这还节省了验证物理签名的时间。


    4. 增加自主性 – 精明协议增加了他们所需的自主性；他们知道自己需要做什么；没有理由依赖外人、律师或其他去中心化个人。


    5. 增加准确性 – 精明合约是计算机化的，它们避免了物理填写表格时的人为错误。


    ## 预言机 (Oracles)


    预言机被认为是为智能合约提供 `Blockchain` 之外世界状况数据的元素。通过这种方式，外部任何数据都可能是某些协议条款的核心——例如物品价值、汇率、包裹温度、航班起飞数据或其他数据——预言机是连接智能合约与这些真实信息源的接口。这是预言机可能成为最重要的因素的地方。由于
    `Blockchain` 的概念，智能合约无法单独获取存在区块链之外的信息。尽管如此，预言机也有它们自己的挑战安排。


    ## 预言机面临的挑战


    首先，预言机需要一个可靠的信息源。它们应该能够提供准确且密封的数据源。因此，假设一个智能合约提供了针对航班取消的保护，那么确保你获取的航班信息是准确的，并且在从网站获取后没有被篡改至关重要。同样，要遵循组织成员达成的共识协议。这表明
    `Blockchain` 网络对数据网络的准确性达成了一致。


    ## 预言机实现的类型


    预言机通三种类型：基于编程的、基于合约的和基于硬件的。每种的一般特征下图 75 所示：


