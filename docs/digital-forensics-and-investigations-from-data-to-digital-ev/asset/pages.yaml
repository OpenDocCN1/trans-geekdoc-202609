- pgno: 23
  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    Digital forensics is a relatively new science that is gradually becoming popular
    as cyber criminals utilize networks and computers to execute their unrupulous
    activities. Terrorists are using high-level technology through the Internet to
    recruit, communicate and execute their deadly operations. Hence, it is a burden
    on the shoulders of global government agencies which are tackling cybercrimes
    and the related menace that has crept into the society. A professional in digital
    forensics must have the skill set which includes a deep understanding of hardware
    and software, forensic science, computer networks, and government laws. This chapter
    enlightens the reader about the concept of digital forensics and the methodologies
    involved as well as various models and frameworks that are adopted in crime investigations.


    # 1.1 AN OVERVIEW OF DIGITAL FORENSICS


    With the development of science and technology coupled with the daily use of computers
    in our everyday lives, it has become expedient to include the contents of computers
    as part official evidence. Laptops, servers, and desktops are familiar to us because
    we use them often; however, there are other means by which forensic evidence can
    be stored. Other devices that perform similar storage capability include Personal
    digital assistants (PDAs), memory cards, and video games. The focus of digital
    forensics is based on this data and usage of these devices. Digital forensics
    is the process of finding and reading electronic data. It can also be defined
    as the process involved in collection, protection, documentation, validation,
    analysis, and presentation of digital evidence, obtained from computerized sources,
    and by the application of established scientific methods, which are beneficial
    in the reconstruction of events or criminology. Marcella and Menendez stated that
    cyber forensics, e-discovery, digital forensics, computer and computer forensics
    relatively mean the same thing yet has emerged as a de facto standard (2008).
    They further presented an operational definition of computer forensics as “the
    science of locating, extracting, and analyzing types of data from different devices,
    which specialists then interpret as legal evidence.” They also reiterated that
    computer forensics is a science discipline because it involves the collection
    and analysis of data from computer systems, storage devices, grids, and wireless
    infrastructures in such a way that is acceptable as evidence in a court of law.
    Another definition identifies digital forensics'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Introduction to Digital Forensics


    as “the practice of scientifically derived and proven technical methods and tools
    toward the preservation, collection, validation, identification, analysis, interpretation,
    documentation, and presentation of subsequent digital information derived from
    digital sources for the purpose of facilitating or furthering the reconstruction
    of events as forensic evidence” (Willassen & Mjølsnes, 2005). This definition
    focuses on the reconstruction of events suggestively rather than criminality.
    Digital forensics utilizes comprehensive techniques in ascertaining viable information,
    from electronic gadgets, may be accepted in court. This includes a chain of custody
    and documentation. The process of collecting digital forensic evidence can be
    divided into two distinct areas. The first area involves the collection of evidence
    without changing any of its contents and making sure that it is admissible in
    the court of law. The second area is the real usage of law enforcement grade and
    standard forensic policies that may allow the acceptability of the evidence in
    court. The objective of this document is to provide a succinct overview of the
    process involved in collection and appraisal of forensic evidence. Digital forensics
    is a constantly evolving scientific field with many subdisciplines. Some of these
    subdisciplines are:


    +   1. Computer forensics involves the identification, conservation, assemblage,
    documentation, and analysis of evidence obtained from electronic gadgets such
    as laptops, desktop computers, and other storage media to be used in technical
    examinations and legal proceedings.


    +   2. Network forensics involves the real-time tracking, capture, storing and
    scrutiny of network operations in order to detect the cause of cybercrimes, irregular
    network traffic, security infringement, and malware or virus attacks.


    +   3. Mobile forensics involves the retrieval of electronic evidence from diverse
    gadgets such as smartphones, subscriber identity (SIM) cards, PDAs, Global Positioning
    System (GPS) devices, tablets, and game consoles. (4) Digital image forensics
    involves the abstraction and examination of photographic images to confirm their
    originality by retrieving the metadata of the image file in order to discover
    its source.


    +   5. Digital video/audio forensics involves the assemblage, study, and assessment
    of audio and video recordings. This aspect of forensics is used to determine whether
    a recording is original,'
  merge: -1
  img_proc: true
