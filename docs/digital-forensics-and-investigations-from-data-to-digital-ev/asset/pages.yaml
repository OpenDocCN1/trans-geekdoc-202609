    confirm the duplicate data and the original data are the same. Decryption tools
    are required to gain access to password-protected computers, files, or both. If
    data retrieved from a suspect''s computer is encrypted, then certain procedures
    must be followed. The MD5 algorithm receives a message of arbitrary length as
    input and generates a 128-bit “fingerprint” or “message digest” as output. It
    is estimated that it is practically to generate two messages having similar message
    digest or to generate any message having a particular prestaged digest. Note the
    use of the word fingerprint. The purpose of this analogy is to emphasize the proximity
    uniqueness of a message digest calculated using the MD5 algorithm. Basically,
    the MD5 algorithm uses the statistical data in a digital object to compute a combination
    of 32 numbers and letters. This is essentially a 16-character hexadecimal value,
    with each byte denoted by a pair of letters and numbers. It is very unlikely that
    two items will have similar message unless they are duplicates. This is very similar
    to human fingerprints and DNA. It is also estimated that the probability of generating
    two messages having similar message digest is on the order of 264 operations and
    the probability of generating a particular message digest is on the order of 2128
    operations. This feature of proximity uniqueness is what distinguishes message
    digest algorithms like MD5 as a powerful tool for recording digital evidence.
    For example, by calculating the MD5 value of a disk prior to collection and then
    after collection, it can be established that the collection process did not modify
    the data since it was collected. Bear in mind that MD5 and SHA-1 values alone
    do not specify that the linked evidence is trustworthy; as someone could have
    modified the evidence before the hash value was computed. For example, if the
    person who collected the evidence altered it prior to calculating a digital fingerprint,
    the alteration will not be detected by a later evaluation of the digital fingerprint.
    Eventually, the credibility of digital evidence comes down to the credibility
    of individuals handling it and the strength of supporting documentation.


