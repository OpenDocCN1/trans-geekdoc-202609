  img_proc: true
- pgno: 252
  md: '# Content-Related Cybercrimes 231


    Internet child pornography is unlike most crimes local police departments handle.
    Local citizens may access pornography images that were produced and/or stored
    in another city or another continent. Alternatively, they may produce or distribute
    images that are downloaded by thousands of miles away. An investigation that begins
    in one police district will almost certainly cross jurisdictional boundaries.
    Therefore, most of the major investigations of Internet child pornography have
    involved cooperation among jurisdictions, often at an international level. However,
    within this broader scheme, local police departments have a crucial role to play.
    By concentrating on components of the problem that occurs within their local jurisdictions,
    they may uncover evidence that initiates a wider investigation. Alternatively,
    they may receive information from other jurisdictions about offenders in their
    districts. Because of the increasing use of computers in society, most police
    departments are likely to encounter Internet child pornography crimes. Therefore,
    it is important that all police departments develop strategies for dealing with
    the problem. Larger departments or districts may have their own dedicated Internet
    child pornography teams, but smaller ones do not, and the responsibility for daily
    investigations will fall to general-duty officers. It would be a mistake to underestimate
    the importance of local police in detecting and preventing Internet child pornography
    offenses. One study found that 56% of arrests for Internet child pornography crimes
    originated from non-specialized law enforcement agencies.


