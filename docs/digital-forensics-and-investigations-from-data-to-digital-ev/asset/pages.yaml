- pgno: 275
  md: enforcement agencies and industry to stop working in silos. The coordinated
    international action is the only way to tackle this global issue which is affecting
    countries on an increasingly greater scale. A cultural shift needs to occur among
    all governments, IT, law enforcement and legal sectors. Law enforcement agencies
    and industry need to cooperate to improve the sharing of information especially
    in identifying and alerting new and emerging threats, including modes of attack.
    A comprehensive education and awareness program for lawyers, judiciary and the
    public on cyberterrorismism could also contribute to a higher likelihood of cyber
    terrorism prosecution. Industry and enforcement agencies must also increase and
    improve their understanding of the legal process and requirements for evidence
    collection and presentation in the judicial process. This will facilitate more
    accurate systemized investigations and will lead to more reliable information
    being brought before courts.
