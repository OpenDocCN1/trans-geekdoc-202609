    # 1.4.6 Evidence of Integrity


    The purpose of integrity checks is to show that evidence has not been altered
    from the time it was collected, backing up the authentication process. In digital
    forensics, the process of verifying the integrity of evidence generally involves
    a comparison of the digital fingerprint for that evidence taken at the time of
    collection with the evidence in its present state. To understand how this verification
    process works, it is necessary to have a basic knowledge of message digests and
    cryptographic hash values. For the purpose of this book, a message digest algorithm
    can be referred to as a box that accepts a digital object (e.g., a file, program,
    or disk) and produces a number. Message digest algorithm always generates the
    same number for a given input. For different inputs. Therefore, an exact copy
    will have the same message digest as the original if a file is changed even slightly,
    it will have a different message digest from the real one. Authentication software
    is used to confirm that the evidence has not been altered. Currently, the frequently
    used algorithms for calculating message digests in digital forensics are MD5 and
    Secure Hash Algorithm 1 (SHA-1). SHA is very similar to MD5 and is currently the
    U. S. government''s message digest algorithm of choice. MD5 generates hash code
    that is encrypted. MD5 adopts an implied mathematical method to save the data
    to the drive or document. This is used to'
