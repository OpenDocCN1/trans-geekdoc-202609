    # (2) NTFS Alternate Data Streams


    Another interesting feature of the NTFS file system is alternate data streams
    (ADS), or "ADSs." ADSs have been part of the NTFS file system since the first
    version of Windows NT 3.1 and were included for compatibility with the Macintosh
    Hierarchical File System (HFS). NTFS utilized forks for maintaining interoperability
    when moving files from one file system (HFS) to another (NTFS). ADSs are actually
    an additional stream associated with a file, and while all versions'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 84 Digital Forensics and Investigation: From Data to Digital Evidence


    of Windows include a means for creating arbitrary ADSs (some versions of Windows
    actually create and use specific ADSs), it wasn''t until Vista that native functionality
    became available for viewing arbitrary ADSs. As of Windows Vista, the ''dir/r''
    command would allow an analyst to search for arbitrary ADSs on a live system.
    However, Windows systems running the NTFS file system have long had the native
    ability to create and use ADSs.


    In order to demonstrate how to create an arbitrary ADS, create a new directory
    called "ads" via the DOS or mkdir command, if you like), open a command prompt
    to or cd that directory, and type the following command:


    ```

    C:\ads>echo "this is an ADS" > myfile.txt:ads.txt

    ```


    If you type the dir command, you''ll see that the file "myfile.txt" exists and
    is zero bytes in size. We just echo''d a string that is 14 bytes in length into
    a file (apparently), so did it go? If we use the ''type'' command to attempt view
    the string you entered into the ADS, on Windows XP we''ll get an error message
    about the syntax of the command. Type the following command:


    ```

    C:\ads>notepad\myfile.txt:ads.txt

    ```


    When the Notepad window opens, we can see the string we typed in ... where did
    it come from? The string was stored in the alternate data stream, which is a file
    but not denoted by the colon in the name. ADSs can be added or attached to files
    or to directory listings (using a command such as "C:\ads:ads.txt")


    Some Windows applications will actually employ specific ADSs. With Windows XP
    Service Pack 2, the Attachment Manager would add an ADS called "Zone.Identifier"
    to files downloaded via Internet Explorer or Outlook attachments. These ADSs were
    usually no more than 26 or 28 bytes in size. Whenever a user wanted to open or
    execute a file, they would be presented with a warning, asking if they were sure
    that they wanted to launch the file in question. ADSs can also be used to "hide"
    executable content. On many versions of Windows, executable image files (.exe
    files) can be hidden and run from ADSs. Not only will Perl scripts that are "hidden"
    in ADSs, but Windows Scripting Host files can also be "hidden" in and run from
    ADSs.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Operating Systems in Forensic Investigation 85


