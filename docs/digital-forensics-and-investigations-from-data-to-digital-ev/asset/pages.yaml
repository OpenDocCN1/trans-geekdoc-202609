- pgno: 54
  md: '# Digital Forensic Models 33


    increase the suspect’s willingness to talk and cooperate. These triggers may be
    found in the digital evidence located on the suspect''s system(s). Examples are
    email correspondence, digital maps, pictures, and chat logs. The FFTPM uses phases
    derived from the Carrier and Spafford (2002) IDIP and the digital crime scene
    analysis (DCSA) model as developed by Rogers (2006). The phases include: planning,
    triage, usage and user profiles, chronology, Internet activity, and case-specific
    evidence. These six phases constitute a high level of categorization and each
    phase has several sub-tasks and considerations that vary according to the specifics
    of the case, file system and operating system under investigation. The use of
    higher order categories allows the process model to be generalized across various
    types of investigations. The need for a general model has been identified in several
    studies as a core component of a pragmatic approach for law enforcement investigations.
    Before discussing each of the model''s phases, it is important that qualifications
    be placed around the use of the FFTPM, as the model is not appropriate for all
    summative situation.


    Due to length constraints, this section will only provide a brief description
    of the six phases and key sub-tasks. The primary investigative considerations
    that are relevant for each of the phases will be presented.


    The FFTPM begins with the planning phase, which is critical to improve the chances
    of successful investigation. The investigator is concerned about capabilities
    of the suspect, their activities, location, time, and types of machines. Second
    is the triage phase under which examiner identifies evidence and things are arranged
    according to importance and probably priorities. On concern, here are potential
    places in the systems where evidence could be located volatile memory, temporary
    files among others. Information from the suspect is very critical in the above
    revelations. Next is the usage profile phase where the examiner focuses on the
    user’s profile and activities and information found in home directory, system
    registries, and file properties. After usage profile analysis, the investigator
    needs to build the case in a chronological order. Under the chronology phase which
    deals with issues to do when a file was accessed, modified, or created. In Internet
    phase, examinations of relevant artifacts like instant message logs, web browsers,
    and emails are done. It should be noted that emails require a lot of time to analyze
    can yield very substantial evidence. The last phase in this model is case-specific
    evidence phase. It is required that the investigator adjusts and focuses his attention
    to the case at hand depending on the type of crime.'
  merge: -1
  img_proc: true
