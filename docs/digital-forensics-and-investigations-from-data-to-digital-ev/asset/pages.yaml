- pgno: 79
  md: '# 3.4.2 System Internet-Level Knowledge


    The SiLK supports efficient capture, storage, and analysis of network flow data
    based on Cisco NetFlow. The SiLK tool was developed by the CERT Network Situational
    Awareness (NetSA) group. The suite provides analysts with the means to understand,
    query, and summarize both new and past traffic data in network flow records. This
    tool supports network forensics in recognizing relics of intrusions, exploitation
    of weakness, worm behavior, etc. The suite comprises two primary components, the
    collection system, and the analysis tool set. The collection system converts Cisco
    NetFlow V5 protocol data units (PDUs) into a compressed binary format. A range
    of analysis tools work on these records, and control and summarize the data. Collection
    system minimizes the storage space by storing the required fields, reduces the
    number of bits used to store some information, and saves by avoiding storage of
    irrelevant information.


    There are six fundamental tools in SiLK. rwfilter retrieves data and partitions
    it to isolate flow records. Rw offers an assemblage of statistical analysis and
    counting facilities that enables organizing and ranking traffic by different elements,
    rwcount provides a time-bounded count of the number of bytes, packets, and flow
    records. rwcut reads filter files and produces a readable version of the output
    to the user in a pipe-delimited tabular format. rwsort is a high-speed sorting
    tool for SiLK flow records. Rwuqi counts records per combination of multiple-field
    keys.


    There are many analytical tools in SiLK that control flow record files. rwcat
    and rwappend tools are used for merging flow record files. rwdedupe is designed
    to allow analysts to remove duplicate flow records efficiently. rwsplit divides
    a bulk flow record into pieces and simultaneously analyzes each piece separately.
    rwptflow generates a single packet flow record for every IP packet in a tcpdump
    file. rwmatch matches a tcpdump file and filters based on flow records from a
    SiLK record. SiLK is a key tool with high-level performance because it manages
    massive traffic by storing information that deals with security, files into predefined
    categories to minimize lookup time, and reads zipped file. It also helps in analysis
    of worm detection, scanning operation, and SYN flooding.


