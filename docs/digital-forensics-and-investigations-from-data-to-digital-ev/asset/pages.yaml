- pgno: 91
  md: '![](img/149e5d898c819a550264bf1eab7b7354_91_0.png)


    # Figure 3.7: Schematic representation of Honeynet.


    Source: http://adityabeyingthepresentationsit.blogspot.com.ng/2014/06/honeyypots-and-honeynets.html


    # 3.8.1 Virtual Honeypots


    A physical Honeypot is a real machine with its unique IP address. a virtual Honeypot
    is a simulated machine that can be modeled to perform as required. Multiple virtual
    Honeypots, running similar or different operating systems, can be simulated on
    a single system. Each of these virtual Honeypots can be configured with specific
    services that will be exploited by the attackers to gain access to a Honeypot.
    As attackers attempt to connect to machines with randomly selected IP addresses,
    the higher the number of virtual Honeypots set up with the same kind of services,
    the more it helps to capture the connection requests and payload traffic created
    by the attackers. Honeyd is a framework for virtual Honeypots to simulate compute
    systems at the network level. It forms virtual networks that comprise arbitrary
    routing topologies with configurable link features like delay, bandwidth, packet
    loss, etc. Honeyd is used as a deception tool for TCP/IP stack fingerprinting
    tools like Xprobe or Nmap to make the attackers believe that a virtual Honeypot
    is running a specific operating system. This is done by simulating the TCP/IP
    of the target OS. A virtual Honeypot responds to network requests based on the
    services that are installed on it.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 3.8.2 Serial and Parallel Architecture


    A Honeynet be set up on either a serial architecture or a parallel architecture.
    With a serial architecture, the Honeypall filters all traffic dispatched to the
    firewall of the production system (the network of machines that provide important
    services) and all incoming and outgoing traffic in production system passes through
    the Honeynet. If a Honeynet is compromised, the firewall of the production system
    is notified. Even if the attack is in progress in the Honeynet, the firewall will
    make sure the attack does not encroach on the production system. When sufficient
    evidence is collected in the Honeynet, one can stop the Honeynet and start analyzing
    the anomalous traffic sent to it. The advantage of a Honeynet with a serial architecture
    is that it shields the production system from direct malicious attacks. However,
    the disadvantage would be the delay suffered for every incoming and outgoing packet,
    including the benign onions, at the Honeynet or firewall.


    With a parallel architecture, both the Honeynet and the production system are
    exposed directly to the Internet so that the delay incurred for every packet at
    the Honeynet or firewall could be avoided. On the other hand, a blackout could
    attack the production system directly and hence the firewall at the production
    system should be configured with tough packet filtering policies to reduce the
    odds of troublesome attacks. If the Honeynet gets some traffic, it analyzes that
    traffic and informs the firewall depending on the nature of the traffic received.
    The firewall will then become tougher in protecting the production system.


    # 3.9 DATA CARVING


    Carving is a generic term for extracting organized data out of raw data based
    on format specific characteristics present in the organized data, for recover
    deleted file from unallocated disk space. Data carving is a basic approach that
    allows for the retrieval of files or data generally whenever file system information
    has been corrupted or lost. To use this method of extraction, a file should have
    a standard file signature called a file header (start of the file). A search is
    performed to locate the file header and continued until the file footer (end of
    the file) is reached. The data between these two points will be extracted and
    analyzed to validate the file. The extraction algorithm uses different methods
    of carving depending on the file'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    formats. However, many file carving implementations struggle to recover fragmented
    files accurately or not scale well enough to be practical given the enormous data
    volumes common today. Primary concern in both traditional criminal investigations
    and computer emergency response is the accuracy of a given forensic method and
    its speed of execution. Inaccurate or untimely evidence has little to value in
    these pursuits. The two common general file carving techniques are structure-based
    carving and content-based carving. However, there are other strategies which are
    discussed thereafter.


    # 3.9.1 Structure-based Carving


    This technique uses the internal layout of a file. Elements are header, footer,
    identifier strings, size information, etc. Structure-based carving was one of
    the first file carving strategies proposed and was implemented in tools such as
    Foremost, PhotoRec, and Scalpel. During structure-based carving, the data volume
    is searched for known values or data structures associated with specific file
    types. A common example, also used later in this project, is the file which has
    a specific byte sequence which acts as the effective beginning... A simple carver
    using this strategy finds the memory cluster containing an associated footer,
    and assumes that the clusters in between the two (inclusive) belong to the file
    to be recovered. Note that this assumption is only true if the file was stored
    as one contiguous memory segment, with no other allocated or empty clusters in
    between the header and footer, and that such a simple strategy will fail to recover
    fragmented files.


    # 3.9.2 Content-based Carving


    This is a system comprising loose structure (MBOX, HTML, XML). This technique
    has features like content attributes, character count, white- and blacklisting
    of data, text/language recognition, information entropy, and statistical attributes
    (Chi^2). Advanced carving techniques include graph theoretic carving, smart carving,
    encrypted volume carving, and bifragment gap carving.'
  merge: -1
  img_proc: true
