    # 4.3 New Technology File System


    The NTFS is perhaps the most widely used file system on Windows systems, as it
    offers a number of advantages over the FAT file system, including the ability
    to set access control lists (ACLs, or permissions) on file objects, journaling,
    compression, and a host of other capabilities not offered on the FAT file system.


    Directories are treated much like other file in NTFS but are called index entries
    and store entries in a B-Tree to accelerate access and facilitate resorting when
    entries are deleted. Instead of using ASCII to represent data such as file and
    folder names, NTFS uses an encoding scheme called Unicode. This difference must
    be taken into account when performing text searches. NTFS has a more formal file
    initialization process than FAT file systems, but the same issues can arise, such
    as storage'
  merge: -1
