    # 3.9.3 Other Carving Techniques


    Another approach involves accumulating the fragments and attempting to open them
    in the proper application. If the file opens, it is presumed not to be a corrupted
    false-positive. Other research defines carving as a mapping function between the
    image data and the file data to become an optimization of function problem. The
    issue has also been described as an optimal path construction problem. Context-based
    carving is another suggested approach. The fragments are first put into categories
    representing the files in it. They could belong to such as text or executables.
    Then the fragments of similar type are reassembled based on possibilities that
    a certain fragment would follow the preceding fragment. SmartCarver is another
    solution to file carving. Smart Carver lessen the amount of data to be processed
    in the carving stage by removing any disk cluster which is identified as being
    allocated and only carving unallocated clusters. This is, to some extent, a different
    problem than conditions where there is no existing file system. However, it is
    remarkable to see that file carving is required even in cases where the file system
    is available.'
