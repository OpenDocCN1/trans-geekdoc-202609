    a potential intrusion rises linearly with the number of protected hosts; that
    is, if a human takes t to examine an incident on one system, it will take 2t to
    examine two systems, 3t to examine three systems, and so forth.


    # 7.5.3 File Integrity Checkers


    A integrity checker examines the files on a computer to determine whether they
    have been altered since the last time the integrity checker was run. The integrity
    checker keeps a database of hash values for each file. Each time the checker runs,
    it recalculates the hash value and compares it to the stored value. If the hash
    values are different, the file has changed. If the values are not different, the
    file has not changed. A hash function is a mathematical process for reducing the
    sequence of bytes in a file to a fixed-length number. The same file in file will
    always produce the same hash value and any change in file will produce a different
    value. Unlike encryption, a hash is a one-way function; you cannot produce the
    original source from the hash value. Some hashes are more secure than others.
    Very secure hashes, which meet special mathematical requirements, are called cryptographically
    secure hashes. One of the requirements for a cryptographically secure hash is
    that it is very hard (the technical term is computationally infeasible) to calculate
    a collision—two inputs that hash to the same number. That means that even if an
    attacker changes a file, he cannot change the file in a way that fools the integrity
    checker into thinking the file has not been changed.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    # Pros


    It is computationally infeasible to defeat the mathematics in an integrity checker.
    This makes it a very, strong tool for detecting changes to files on a computer.
    It is so strong, in fact, that it is one of the most important tools you can use
    to detect misuse of computer systems. Integrity checkers can be configured to
    watch everything on the system, or only important files. They are extremely flexible.
    One attackers compromise a system, they like to do two things. First, they like
    to cover up their tracks, which mean that they will alter system binaries, libraries,
    or log files to hide the fact that they are or have been on the system. Second,
    they will make changes to ensure they will have continued access to the system.
    A properly configured integrity checker will detect both activities.


    # Cons


    Integrity checkers rely on data stored on the local computers. Like log files,
    this data (the database of hash values) is vulnerable to modification on the system.
    Say an attacker gains superuser privileges on your system. The attacker can find
    the integrity checker, make any hostile changes to the system, and rerun the integrity
    checker to recreate the database of hash values. When the system administrator
    runs the tool, it will not report any changes to the system. One way around this
    problem is to keep your database on read-only media such as a writable CD. This
    works for most stable and unchanging systems, but for most production machines
    it is incredibly inconvenient. The integrity checker must be configured for each
    system. Usually, this is a laborious and complicated task. If the operating system
    is not good at enforcing system integrity, installation becomes ever more complex.
    Once the checker is configured, it must run frequently. Depending on the operating
    system, simple changes or normal operation can report from tens to thousands of
    changes. For example, an integrity checker run just before upgrading MS-Outlook
    on a Windows NT system, then just after the installation, reported over 1800 changes.
    Finally, integrity checkers consume a considerable number of system resources.
    They can consume CPU, memory, and disk space. Many administrators will not want
    to run checkers frequently. This limits their functionality because a checker
    run once a month will report so many changes that a real attack has a good chance
    of going unnoticed.'
  merge: -1
  img_proc: true
