    lead to the host computer. IP addresses can be easily obtained by using the following
    commands: ping, nslookup, dig, tracecert from a DNS server. Locating the country
    and institution is simplified by various tools and websites like ip-to-location.com
    and whatismyipaddress.net.


    +   (b) Authorization phase; when authorization from local legal entities is obtained
    to permit further investigations and access to more information.


    # (3) Dynamite phases


    Dynamite phases investigate the primary crime scene with the aim of collecting
    and analyzing items that were discovered at the scene to enhance the apprehension
