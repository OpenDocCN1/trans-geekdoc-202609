    (c) At a minimum, add a StartupParameters.plist file to that subdirectory. Again,
    use an existing startup item for a template.

    (d) If the user used a control variable to determine whether the daemon starts
    at boot (Apache uses WEBSERVER), the user must set that variable to -YES- or -NO-
    in /etc/hostconfig


    # 4.5.1 OS X File System


    With other systems, Macintosh stores its partition table in the first sector on
    disk. The first sector of each volume contains the boot sector and additional
    details about the volume are stored in the third sector. The file system used
    by OS X is called HFS Plus or Mac OS Extended. HFS+ is the successor to the Hierarchical
    File System (HFS) used on pre-OS X operating'
