    # 9.2.1 Email Stalking


    This is direct communication through email which is the most easily available
    form of harassment. It is almost similar to traditional stalking in some aspects.
    One may send email of a threatening, hateful, or obscene nature, or even send
    spam or viruses to harass others. For example, in India in 2004 two MBA students
    sent emails to their female classmate to intimidate her. The free availability
    of anonymizers and anonymous relayers which shield the sender’s identity and allow
    the content to be concealed provide a high degree of protection for stalkers seeking
    to cover their tracks more effectively.


    # 9.2.2 Internet Stalking


    There is global communication through the Internet. Here, the domain is wide and
    public in comparison to email stalking. Here, stalkers can use a wide range of
    activities to harass their victims. Internet cyberstalking is used to slander
    and endanger victims, sometimes on a public rather than private dimension. Harassment
    includes hacking, spoofing, the use of spyware, and the use of offensive content
    such as pornographic images and email bombs. A stalker will visit a chat room
    pretending to be his/her victim or post information about his/her victim on a
    bulletin board. The information most often contains the victim’s name, address,
    and telephone number, and a message inviting strangers to join in the sexual activity.
    Internet cyberstalkers can follow their victims from place to place on the Internet,
    and can build and maintain websites dedicated to their victims, encouraging visitors
    to participate in degrading and harassing her/him. For example, a woman was stalked
    for a period of 6 months. Her harasser posted notes in a chat room that threatened
    to intimidate and kill her, and posted doctored pornographic pictures of her on
    the net together with personal details (Dean, 2000).


    # 9.2.3 Computer Stalking


    This is unauthorized control of another person’s computer. In this type of stalking,
    the stalker exploits the working of the Internet and the Windows operating system
    in order to assume control over the computer of the targeted'
