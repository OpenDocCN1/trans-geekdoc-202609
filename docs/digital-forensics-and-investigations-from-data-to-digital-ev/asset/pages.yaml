    # ## 2.7.1 Readiness Phases


    # ### (1) Deployment phases


    The deployment phases provide a mechanism for an incident to be detected and confirmed.
    They take place at the place where the crime was detected and consist of five
    phases:-


    +   (a) Detection and notification phase; when an incident is detected and the
    appropriate people notified.


    +   (b) Physical crime scene investigation; when a physical examination of the
    scene is performed and potential digital evidence identified.


    +   (c) Digital crime scene investigation phase; when an electronic examination
    of the scene is performed and digital evidence obtained with possibly an estimation
    of the extent of the impact or damage.


    +   (d) Confirmation phase; when the incident is confirmed and authorization is
    given to obtain legal approval to carry out a search warrant and further investigations
    at suspect premises.'
