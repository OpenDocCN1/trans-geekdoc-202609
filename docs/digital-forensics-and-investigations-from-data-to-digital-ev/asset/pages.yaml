    from sufficiently reliable sources. In particular, data recorded by a machine
    in the normal course of operation is usually admissible as evidence of the recorded
    events if there was no human intervention in the recording process.


    # 8.8.5 Expert Evidence


    Expert evidence is given with regards to a scientific or technical subject. An
    expert in a case would give testimony on specialized training and/or experience
    in a particular field. This type of evidence is usually required when there are
    parts of a case that are outside the capabilities of the trier/finder of the fact.
    It is expected that an expert witness is qualified in the particular field in
    which they are to give evidence.


    # 8.8.6 Scientific Evidence


    Forensic science refers to “the application of science expertise in the form of
    knowledge base and methodology within the court” (White, 2010). It is the use
    of scientific techniques in a legal investigation producing evidence to be used
    in court. Science is used to establish particular fact which may be out of the
    tries’ field of expertise. This suggests that where scientific evidence is gathered,
    the objective is for it to be used in legal proceedings. Scientific evidence is
    evidence called from a scientific procedure that helps the trier of fact understand
    the evidence or determine fact at issue in a judicial proceeding. Under rule 702
    of the Federal Rules of Evidence (in the courts of the United States) and similar
    state court rules of evidence, “a witness qualified as an expert by knowledge,
    skill, experience, training, or education” may testify and offer opinions in court
    if “scientific, technical, or other specialized knowledge will assist the trier
    of fact to understand the evidence or to determine a fact in issue.” Article VII
    of the Federal Rules of Evidence contain other rules on Expert testimony and scientific
    evidence.'
