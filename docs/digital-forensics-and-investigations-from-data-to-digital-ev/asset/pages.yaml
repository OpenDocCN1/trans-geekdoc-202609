  md: '# 86 Digital Forensics and Investigation: From Data to Digital Evidence


    ![](img/149e5d898c819a550264bf1eab7b7354_107_0.png)


    **Figure 4.4:** A Typical Linux file structure.


    Source: https://www.everything-linux-101.com/blog/linux-file-system-structure-explained/


    # ## 4.4.2 File System Layer


    Ext file systems have two major components that make up their file system structures:
    the superblock and the group descriptor tables. The superblock is a data structure
    found 1024 bytes from the start of an Ext file system. It contains information
    about the layout of the file system and includes block and inode allocation information,
    and metadata indicating the last time the file system was mounted or read. The
    group descriptor table is found in the block immediately following the superblock.
    This table contains allocation status information for each block group found on
    the file system. The fsstat tool in the Sleuth Kit can be used to parse the content
    of these data structures and display information about the file system.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 4.4.3 File System in Linux


    Linux treats its devices as files, stored in/dev. Most Linux distributions use
    a basic directory structure, with files organized in the following directories:

    /bin: Common commands


    /boot: Files needed at boot time, including the kernel images that are pointed
    to by LILO or GRUB


    /usr: Local software, libraries, games, etc.


    /var: Logs and other variable files


    /dev: Interface files that allow the kernel to interact with hardware and the
    file system

    /home: Directories for each user on the system, containing user-specific personal
    and configuration files/mnt: Mount points for external, remote, and removable
    filesystems/etc: Administrative configuration files and scripts

    /root: The root-user home directory


    /sbin: Administrative commands and process-control daemons


    /lib: Basic system libraries


    /opt: Optional and third-party software

    In order to find system information, the following commands can be used:


    +   (a) unname -a: returns the computer name and Linux version

    (b) ls -l: returns the list of files in the current directory

    (c) ls -ul [filename]: returns the access time of the file

    (d) netstat -s: returns protocol information


    UNIX and Linux use a tree or hierarchical, structure for storing files and directories.
    In a UNIX disk structure, the topmost directory is the root directory and is denoted
    by a forward slash (/). A root directory has a number of directories, and these
    have subdirectories. A subdirectory is known as a child of the parent directory
    from which it is branched. For example, in the directory/usr/game,/game is the
    child of/usr, and in turn,/usr is the parent of/game.


    When a file system is created, a superblock is also created that keeps track of
    metadata including the type of file system, device block size, maximum file volume,
    name, and other information related to the file system.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    After the superblock, another important structure is the inode. An inode acts
    as an index of the file. Each node represents a file stored on the disk. Using
    the -I option with the command, a user can see the inode number of the file.


    The second extended (ext2) file system is perhaps the most convenient Linux file
    system. It has improved algorithms and extra date stamps for last access, last
    inode modification, and last data modification. It can also track the state of
    the file system.


    # 4.4.4 Types of Linux Distributions


    Linux is a free, UNIX-based, open source operating system created by Linux Torvalds
    with the assistance of developers around the world. It comes in several different
    versions, called distributions, including Red Hat, SUSE, Debian, and Ubuntu. Each
    edition is unique, with its own strengths and weaknesses.


    There are three basic types of Linux distributions:


    +   (a) Desktop distributions, which include a graphical interface and common
    applications, suitable for home use.


    +   (b) Server or enterprise distributions that are used primarily for business
    applications, but can also be used as a home server.


    +   (c) Live-CD distributions that are stored on bootable storage devices. A Live
    CD is a bootable version of an operating system that is loaded directly into RAM
    and functions outside and independently of the target computer''s operating system


    # 4.4.5 Linux Boot Sequence


    +   (1) The first step is in the boot sequence for Linux is loading the kernel.
    The kernel image is usually contained in the /boot directory.


    +   (2) The soft link to the current kernel image is available in the /boot directory
    and is referenced by the Linux Loader LILO) or, as has become more common, with
    GRUB. Details of the bootloader can be gained from LILO or using more /etc/lilo.conf
    or more/etc/grub.conf.


    +   (3) The third step is initialization. The file that controls initialization
    is/etc/initab. The file that begins the process is /sbin/init. The run level and
    startup scripts are initialized, and the terminal process is controlled.'
  merge: -1
