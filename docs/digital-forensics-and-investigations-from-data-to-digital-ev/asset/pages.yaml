  md: '210 Digital Forensics and Investigation: From Data to Digital Evidence


    Cyberstalking is a relatively new kind of cyber terrorism crime. Although it often
    receives a lower priority than cyber-terrorism it is an important global issue.
    Due to new technologies, it is striking in different forms. Due to the Internet’s
    provision of anonymity and security, it is proliferating quickly. Technology and
    tools available to curb have many limitations and are not easy to implement. Legal
    acts to protect people from cyberstalking are geographically limited to the concerned
    state or country. This chapter reviews cyberstalking, how cyberstalkers operate,
    impacts, provision of legal acts, and actions taken to prevent it. There is an
    immediate need for research in the various dimensions of cyberstalking to assess
    this social problem.


    # 9.1 INTRODUCTION


    The advent of new technologies and innovations has enriched our lives in numerous
    ways. Also increased dependence on IT and communication technology for dynamic
    and fast business solutions have its own side effect. The influence of digital
    information technologies on the world certainly poses endless benefits for the
    citizens of the growing global village. The dark side of it, not surprisingly,
    the abuse of IT for criminal activities. Cyberstalking is a new kind of crime
    that existed since the late 1990s that emerged as major global crimin issues.
    In essence, cyberstalking describes the use of Information and Communication Technology
    in order to harass one or more victims (Bocij, 2006). In addition, harassment
    means any behavior that causes the victim distress, whether intentional or not.
    Cyberstalking often finds their victim online as they use computers and networks
    for criminal activities as these technologies can easily be abused to frighten,
    intimidate, bully, and harass unsuspecting users. Cyberstalking is analogous to
    traditional forms of stalking, in that it incorporates persistent behaviors that
    instill anxiety and fear. Whether with the emergence of new technologies, traditional
    stalking has taken on entirely new form through various medium such as email and
    the Internet, that is cyberspace. Cyberstalking radically signals the potential
    of the Internet to facilitate some types of crimes, as well as pointing to the
    existing interventions and likely to prove effective. Cyberstalking is an entirely
    new form of deviant behavior that makes use of technology to harass others in
    a variety of ways. In a decade, our reliance on the Internet, email, instant messaging,
    chat rooms, and other communications technologies has made cyberstalking a growing
    social problem that can affect computer users anywhere in the world. This chapter
    is devoted exclusively to an examination of cyberstalking, providing'
