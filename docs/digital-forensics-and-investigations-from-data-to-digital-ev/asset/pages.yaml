  md: '# Digital Evidence and Legal Proceedings 189


    must specify the crime(s) to which the evidence pertains. Because courts may or
    not apply an exception, it is advisable to obtain a warrant before searching and
    seizing evidence. However, because computer files may be encrypted, misleadingly
    labeled, stored in unusual formats or commingled with innocuous files, agents
    cannot simply establish probable cause, describe the files they need, and then
    go and retrieve the data. In effect, they must understand the technical boundaries
