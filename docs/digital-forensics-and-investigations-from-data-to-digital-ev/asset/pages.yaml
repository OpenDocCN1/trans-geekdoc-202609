- pgno: 188
  md: '# Computer Intrusions and Detection 167


    Pros The network IDS can detect some of the attacks that use the network. They
    are good for detecting access without authority or some kinds of access in excess
    of authority. A network-based IDS does not require modification of production
    servers or hosts. This is an advantage because production servers frequently have
    close operating tolerances for CPU, I/O, and disk capacity; installing additional
    software may exceed the systems capacities. The IDS is not on a critical path
    for any production services or processes because a network-based IDS does not
    act as a router or other critical device. System failure does not have significant
    impact on the business. A side benefit of this is that you are likely to encounter
    less from other people within your organization; the risk to existing critical
    processes is lower with a network system than with a host system. Network-based
