    # 8.2 FOURTH AMENDMENT


    The Fourth Amendment creates a right to be free from “unreasonable” searches and
    seizures (US Constitution, Amendment IV). To be “reasonable,” a search or seizure
    must be carried out pursuant to a lawfully authorized search or warrant or pursuant
    to one of the exceptions the US Supreme Court has recognized to the warrant requirement
    (Annual Review of Criminal Procedure, 2008). A “search” constitutes an intrusion
    on an individual’s reasonable expectation of privacy (Katz v. The United States,
    1967). A “seizure” constitutes an interference with someone’s possession and use
    of his/her property (Soldal v. Cook County, 1992). The sections below review how
    the Supreme Court has applied the Fourth Amendment to areas in which technology
    and privacy intersect. “The right of the people to be searched in their persons,
    houses, papers, and effects against unreasonable searches and seizures, shall
    not be violated, and without probable cause, supported by Oath or affirmation,
    and particularly describing the place to be searched and the persons or things
    to be seized.” The US federal law relating to the collection of digital evidence
    by law enforcement agencies is administered by the Fourth Amendment and statutory
    laws codified in the Wiretap Statute (18 USC Sections 2510–22), the Electronic
    Communications Privacy Act (ECPA) of 1986 (18 USC Sections 2701–02) and the Pen/Trap
    Statute (18 USC Sections 3121–27). The Fourth Amendment restricts the capacity
    of government agents to acquire evidence without a warrant. A search warrant is
    a document signed by a judge that legal a police officer to conduct a search.
    According to the Fourth Amendment, there can be no search warrants without probable
    cause. Probable cause is a reasonable belief that a presumed detail is true. Sometimes,
    people consent to a search. In that scenario, the police may conduct a search
    without a warrant. A warrantless search does not infringe the Fourth Amendment
    if: (i) the agents’ conduct does not violate an individual’s “reasonable expectation
    of privacy,” or (ii) the search falls within an exception to the warrant requirement.
    Therefore, agents must'
