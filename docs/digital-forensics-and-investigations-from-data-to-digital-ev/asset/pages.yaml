  md: '# 10.1.1 Victims of Child Pornography


    It is important to distinguish child pornography from the more conventional understanding
    of the term pornography. Child pornography is a form of child sexual exploitation,
    and each image graphically memorializes the sexual abuse of that child. Each child
    involved in the production of an image is a victim of sexual abuse.


    While some sexual abuse images depict children in great distress and the sexual
    abuse is undisputed, other images may depict children that seem complacent. However,
    just because a child appears complacent does not mean that sexual abuse did not
    occur. In most child pornography cases, the abuse is not a one-time event, but
    rather ongoing victimization that progresses over months or years. It is common
    for producers of child pornography to groom victims, or cultivate a relationship
    with a child and gradually sexualize the covert anytime. The grooming process
    fosters a false sense of trust and authority over a child in order to desitize
    or break down a child’s resistance to sexual abuse. Therefore, if a child appears
    complacent in a particular image, it is important to remember that the abuse may
    have started years before that image was created.


    Furthermore, victims of child pornography suffer not just from the sexual abuse
    inflicted upon them to produce child pornography, but also from knowing that their
    images can be traded and viewed by others worldwide. Once an image is on the Internet,
    it is irretrievable and can continue to circulate forever. The permanent record
    of a child’s sexual abuse can alter his or her life forever. Many victims of child
    pornography suffer from feelings of helplessness, fear, humiliation, and lack
    of control given that their images are available for others to view in perpetuity.
    Unfortunately, emerging trends reveal an increase in the number of images depicting
    sadistic and violent child sexual abuse, and an increase in the number of images
    depicting very young children, including toddlers and infants.


    # 10.1.2 Components of the Problem


    The problem of Internet child pornography can be divided into three components
    namely the production, distribution, and downloading of images. In some cases,
    the same people are involved in each stage. However, some producers and/or distributors
    of child pornography are motivated solely by financial gain and are not themselves
    sexually attracted to children.'
