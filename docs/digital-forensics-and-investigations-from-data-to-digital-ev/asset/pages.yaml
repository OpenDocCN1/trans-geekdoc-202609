    # 7.5.1 Network IDS


    Network-based IDS are most common, and examine passing network traffic for signs
    of intrusion (see figure 7.3 below). Host-based systems look at user and process
    activity on the local machine for signs of intrusion. The network IDS usually
    have two logical components: the sensor and the management station. The sensor
    sits on a network segment, monitoring it for suspicious traffic. The management
    station receives alerts from the sensor(s) and displays them to an operator. The
    sensors are usually dedicated systems that exist only to monitor the network.
    They have a network interface in unrestrained mode, which means they receive all
    network traffic—not just destined for their IP address—capture passing network
    traffic for analysis. If they detect something that looks unusual, they pass it
    back to the analysis station. The analysis station can display the alarms or do
    additional analysis. Some displays are simply an interface to a network management
    tool, like HP Openview, but some are custom GUIs designed to help the operator
    analyze the problem.


    ![](img/149e5d898c819a550264bf1eab7b7354_187_0.png)


    Figure 7.3: Network Intrusion Detection System. Source: http://www.ans.net.in/index.php/network-and-data-security/technology-for-internet-security/intrusion-detection-systems/'
