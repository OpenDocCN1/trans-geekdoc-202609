    # 3.6 PAGE FILE AND HIBERNATION ANALYSIS


    With the launch of Windows 2000, Microsoft introduced a feature that enables a
    system to be powered down, while still maintaining its volatile state. This is
    established by saving the contents of RAM in a file called hiberfil.sys before
    shutting down. When the computer again powered on, the volatile state is restored
    and the system resumes from the saved state. Hibernation files are a good source
    of information for digital forensic practitioners, because they store data that
    are only short-lived from the contents of RAM to non-volatile storage without
    the need to run specific tools on the target device. Memory analysis frameworks
    like Volatility and Rekall make it easy to analyze files in a way similar to memory
    dump; however, these tools do not share common conventions or are not compatible
    with hibernation files from the most recent versions of Windows. This development
    is due to the release of Windows 8 by Microsoft which also included a modification
    of the hibernation format. Hibernation file, also known as suspend to disk'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'hibernation, is a feature of many desktop operating systems which allows for
    the current state of the system to be serialized to non-volatile media. This state
    takes the form of a hibernation file and can be used to resume the system at a
    future date. Apart from this, the hibernation file contains a fragment of the
    physical memory used by the system. By examining this file, it is possible to
    reconstruct parts of the system''s address space. To increase the hibernation
    process, operating system vendors usually only include the bare minimum necessary
    to restore the condition of the system. This means that parts of the address space
    not currently in use by the system are omitted. However, these regions contain
    expedient information such as the remnants of terminated processes. Hence, hibernation
    files do not provide a whole image. Hibernation is often considered a safer reliable
    alternative to sleep mode (commonly referred to as suspend to RAM or S3). When
    a system, usually a notebook, is put to sleep, all components other than the memory
    modules are shut down. The memory is still receiving power, its contents are preserved,
    allowing for a system to revive rapidly from suspension. While significantly faster
    than hibernation, suspension to RAM does require that the memory modules remain
    active for the period. This is a challenge to both desktop and notebook systems.
    In an attempt to improve, these versions of Windows since Vista and Mac OS Leopard
    have integrated a feature, called safe sleep, into the system whereby a hibernation
    file is produced before putting the system to sleep. In the case of power failure,
    this file is used to resume the system. Forensic point of view is that hibernation
    files are also available on users who suspend their computer systems to memory.
    This also provides a convenient means for an investigator to produce a hibernation
    file as an output. Many systems are designed to go to sleep when either the power
    button is pressed or in the case of notebooks, when the lid is closed. Different
    operating systems have different internal configuration of hibernation files and
    is rarely recorded. The file is usually compressed and occasionally encrypted
    for security purposes. For this purpose, special programs are required in order
    to examine them.


    In the case of an encrypted hibernation file, the encryption key is created from
    the user''s login password. If the hibernation file was produced when the system
    was put to sleep, as is the case with safe sleep technologies, the key can sometimes
    be recovered. This is because it is highly possible that the key is present in
    the memory of the system and can be obtained using some imaging techniques. The
    main benefit of hibernation files is that they are exceptionally consistent. As
    a matter of fact, such'
