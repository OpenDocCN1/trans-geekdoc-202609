    # 5.2 TYPES OF CLOUD


    Liu et al. classified cloud deployment models into four types (2011). This section
    comprehensively analyzes the types of existing cloud.


    # 5.2.1 Public Cloud


    A public cloud refers to a cloud service delivery model in which a service provider
    makes massively scalable IT resources, such as CPU and storage capacities, or
    software applications, available to the general public over the Internet. Public
    clouds are typically offered on a usage-based model. Public cloud is the first
    deployment model of cloud services to enter the IT industry’s vocabulary. The
    concept of public clouds has clearly demonstrated the long-term potential of the
    cloud computing model and lit up the imagination of the industry and the research
    community. There'
  merge: -1
