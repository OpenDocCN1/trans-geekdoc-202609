- pgno: 88
  md: '# 3.7 LIVE SOFTWARE ACQUISITION


    Usually, operating systems have provided a device file for gaining access to the
    physical address space of the system. By reading from this file, an application
    can generate a memory dump; in Microsoft Windows, the files are specified as \Device\PhysicalMemory,
    while Unix-like systems, including Mac OS X and GNU/Linux, provide /dev/mem for
    that purpose. Recently, there has been a tendency limiting access to such files.
    With the release of Windows Server 2003, Service Pack 1 Microsoft removed the
    ability for user mode applications to access the Physical Memory device and Apple
    opted to disable /dev/mem by default with the Intel prop of Mac OS X Tiger. Although
    /dev/mem is still present in many GNU/Linux distributions, it is often limited
    to the first 1 MiB of memory. Developers of imaging applications have responded
    to this by including kernel modules to emulate the missing functionality. Furthermore,
    most tools available on the market today are two-part, consisting of a kernel
    module to provide an appropriate device file and a user mode application to read
    from this. Many tools are available, both open source and proprietary. Tools for
    Microsoft Windows include the GPL-licensed MDD (ManTech, 2009) and the proprietary
    MoonSols Windows Memory Toolkit (MoonSols, 2010). For GNU/Linux, the crash module
    can be used to emulate the functionality ofdev/mem. All of these tools require
    administrator privileges to run, whereas Windows and Mac OS generally maintain
    binary compatibility for modules between releases the Linux kernel does not. It
    is usually not possible to load a module compiled against one release of the Linux
    kernel on a system running a different release. Investigators using live software
    acquisition in the field may therefore be required to keep several versions of
    a particular module or driver. The speed of software tools depends heavily on
    the bandwidth of the device being used to store/send the image. Using a 1 Gbit/s
    Ethernet connection or S-ATA, hard disk transfer rates upwards of 80 MiB/s can
    be obtained. Live software acquisition is plagued by reliability concerns. Imaging
    tools rely on system calls provided by the operating system in order to function.
    These calls are required for, among other things, launching processes, loading
    modules/drivers into the kernel, and accessing the file system. Any piece of software
    that can interfere with these calls. Detection of such software, which may often
    take the form of a rootkit, is difficult. In some instances, it may even be impossible
    without the aid of hardware acquisition. This makes live software acquisition
    unsuitable for imaging potentially hostile systems. The use of any software'
  merge: -1
  img_proc: true
