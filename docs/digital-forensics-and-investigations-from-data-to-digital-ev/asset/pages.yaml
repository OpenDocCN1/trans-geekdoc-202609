  md: '# 104 Digital Forensics and Investigation: From Data to Digital Evidence


    As cloud computing gains a firm foothold as an information technology (IT) business
    solution and data is being centralized in the cloud, criminal elements have made
    data centers and cloud providers a serious target. Conventional digital forensic
    methodologies are not completely suitable for cloud computing environments by
    the application of virtualization technologies and remote storage. The task of
    portraying possible evidence is convoluted by dynamism of cloud environments and
    services such as infrastructure as a service (IaaS), Software as a service (SaaS),
    and Platform as a service (PaaS). This chapter explores the essence of cloud computing
    and its various models. Also, it suggests some methods by which cloud forensic
    investigations can be improved.


    # 5.1 INTRODUCTION TO CLOUD PLATFORM


    Cloud, in simple words, means providing scalable resources remotely to software
    using the Internet. It is a sub-network of a network providing access to remotely
    resources. However, the most dependable and universally recognized definition
    of cloud computing is provided by the National Institute of Standards and Technology
    (NIST), which states that cloud computing is a model for enabling ubiquitous,
    convenient, on-demand network access to a shared pool of configurable computing
    resources, for example, networks, servers, storage, applications, and services
    that can be rapidly provisioned and released with minimal effort or service provider
    interaction. Cloud forensics is a cross-discipline of cloud computing and digital
    forensics. Cloud computing is the sharing of resources (e.g., networks, servers,
    storage, applications, and services) via an organized networking that can be reconstructed
    with less effort. Cloud forensics is based on broad network access. Therefore,
    cloud forensics follows the main phases of network forensics with techniques tailored
    to cloud computing environments. The information on cloud is stored in a physical
    server connected to Internet where the subscribed devices can connect for the
    on-demand services. There are various clouds available on the Internet serving
    different purposes having their own finite boundaries. The Internet serves as
    a common medium for accessing a cloud resource for a particular system. Hence
    is a broad scale public resource cloud where there are various private clouds
    hosted by different cloud owners serving a variety of purposes. The cloud resources
    are accessed using the Internet using any protocols used for accessing resources
    remotely. The aim of the cloud is to'
  merge: -1
  img_proc: true
