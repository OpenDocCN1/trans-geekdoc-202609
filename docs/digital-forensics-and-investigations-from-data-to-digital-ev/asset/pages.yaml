    # 10.1.4 Types of Offenders


    Sexual attraction to children is known as pedophilia. However, an interest in
    Internet child pornography may be best thought of as falling along a continuum
    rather than in terms of a hard and fast distinction between pedophiles and non-pedophiles.
    People can behave differently on the Internet than they do in other areas of their
    lives. Interacting anonymously with a computer in the safety of one’s own home
    encourages people to express hidden thoughts and desires. Offenders vary in the
    strength of their interest in child pornography, as well as the level of severity
    of the pornographic image to which they are attracted. From a psychological perspective,
    based on a typology of general pornography users, the following categories of
    Internet child pornography users are suggested:


    +   (1) Recreational users: They access child pornography sites on impulse, out
    of curiosity, or for short-term entertainment. They are not seen to have long-term
    problems associated with child pornography use;


    +   (2) Vulnerable users: They are defenseless individuals who have developed
    an interest in child pornography, but may not have done so it had not been for
    the Internet;


    +   (3) Sexual compulsives: They have a specific interest in children sexual objects
    and seek out child pornography.'
