    # 8.7 CRIMINAL LAW


    One major can深刻 has eaten deep into the fabric of the global society is crime.
    Crime is a violation of the criminal law. The elements of a crime are a wrongful
    act (the act reus) and a wrongful intent (the mens rea). With the exception of
    strict liability crimes, these two elements are always necessary. In a strict
    liability crime, intent does not have to be shown. There are many different types
    of crimes: Some are directed against people, some against property, and some appear
    to be victimless crimes.


    # 8.7.1 Crimes against Persons


    Crimes against persons include homicide, rape, assault, and battery. There are
    many other crimes that result in harm to a person. When a person dies, the first
    step is identifying the cause of death. If the death has been found to be due
    to natural causes, no investigation is necessary. Conversely, if the death has
    been found to be homicide, a police investigation will begin (Figure. Homicide
    is the act by which one person takes the life of another. There are several different
    types of homicide. The most seriously punished form of homicide is murder. For
    a homicide to be considered murder, several elements need to be present. Under
    the Model Penal Code, a murder'
