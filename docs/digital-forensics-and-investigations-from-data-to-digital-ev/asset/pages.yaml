    Cloud service models describe how cloud services are made available to clients.
    Most fundamental service models include a combination of IaaS (infrastructure
    as a service), PaaS (platform as a service), and SaaS (software as a service).
    These service models may have synergies between each other and be interdependent—for
    example, PaaS is dependent on IaaS because application platforms require physical
    infrastructure.'
