  md: '# 38 Digital Forensics and Investigation: From Data to Digital Evidence


    Venema, 2005). This can be obtained by correlating known users accessing the computer
    with files that have been modified, accessed, or created during those times. Organization
    by user or by time period helps to quantify what was doing during what time periods.
    Such organization may also provide time periods that stand out or look unique.
    These types of time periods could be studied outward in an attempt to find other
    significant relationships or value.


    Another quantification includes the identification and analysis of software applications
    and data files used or accessed during qualified times of interest. Again, this
    can be obtained by correlating known users with MAC times providing unique time
    periods that could be of significant value. Organization of applications or files
    within a certain time period quantifies activities that occurred during these
    time periods. An application or file that is accessed prior to, during, or after
    a criminal incident can be a major indication of involvement or intent.


    Finally, the third quantification includes the identification and analysis of
    recent shortcuts and stored information. This could include, but are not limited
    to items on the desktop, commonly used software applications, and the various
    locations of Internet browser cookies, cache, and the index file. Note that various
    Internet structures (cookies, cache, and the index file) can be very useful in
    determining chronological intelligence in that these provide more time-based evidence
    than just MAC times. Specifically, each index.dat file provides date-time stamps
    for each Internet server request.


    # 2.5.7 Internet**


    Almost every case will require an examination of artifacts associated with Internet
    activity, such as instant messaging (IM), email, and web browsing (see Chapter
    3, Network and Internet). The value, time cost, and time criticality vary widely,
    depending on circumstances including the specific applications involved, type
    of activity being examined, and whether the PC being examined belongs to a suspect
    or a victim (e.g., in a missing person case). An effective practice is for the
    computer forensic examiner to evaluate what type of Internet activities they believe
    the suspect (victim) was involved in, and to evaluate if and how each of those
    activities relates to the case. Types of activities may include web browsing,
    email, instant messaging, reading or posting to USENET newsgroups, trading files.'
