    # Characteristics of PaaS


    There are a number of different takes on what constitutes PaaS but some basic
    characteristics include; (a) Services to develop, test, deploy, host and maintain
    applications in the same integrated development environment. All the varying services
    needed to fulfill the application development process. (b) Web-based user interface
    creation tools help to create, modify, test and deploy different UI scenarios.
    (c) Multi-tenant architecture where multiple concurrent users utilize the same
    development application. (d) Built-in scalability of deployed software including
    load balancing and failover. (e) Integration with web services and databases via
    common standards. (f) Support for development team collaboration—some PaaS solutions
    include project planning and communication tools. (g) Tools to handle billing
    and subscription management.'
  merge: -1
