  md: 'experts believe that computer systems will never be absolutely secure. (2)
    Deployed security mechanism, for example, authentication and access control, may
    be disabled as a consequence of misconfiguration or malicious actions. (3) Users
    of the system may abuse their privileges and perform damaging activities. (4)
    Even if an attack is not successful, in most cases it is useful to be aware of
    the compromise intent. IDSs help computer systems prepare for and deal with attacks.
    They collect information from a selection of vantage points within computer systems
    and networks and analyze this information as indications against security problems.
    IDS are software applications dedicated to detect intrusions against a target
    network. IDS have been designed to address the issues described above. As such,
    they are not intended to replace traditional security methods, but rather to complete
    them. Dacier states that IDS has to fulfill the following requirements (1999);
    (a) Accuracy: An IDS must not identify a legitimate action in a system environment
    as an anomaly or a misuse (a legitimate action which is identified as an intrusion
    is called a false positive). (b) Performance: The IDS performance must be sufficient
    enough to cover real time ID (real time that an intrusion has to be detected before
    significant damage has occurred). (c) Completeness: An IDS should not fail to
    detect an intrusion (an undetected intrusion is called a false negative). One
    has to admit that it is rather difficult to fulfill this requirement because it
    is almost impossible to have a global knowledge about past, present, and future
    actions. (d) Fault Tolerance: An IDS must itself resistant to attacks. (e) Scalability:
    An IDS must be able to process the worst-case number of events without dropping
    information. This point is especially relevant for systems that correlate events
    from different sources at a small number of dedicated hosts. As networks grow
    bigger and get faster, such nodes become overwhelmed by the increasing number
    of events. There are, generally speaking, three kinds of commercially available
    analysis engines: (a) Event or signature-based analysis (b) statistical analysis
    (c) adaptive systems. The event, or signature-based, systems function like the
    anti-virus software with which most people are familiar. The vendor provides a
    list of patterns that it deem to be suspicious or indicative of an attack; the
    IDS merely scans the environment looking for a match to the known patterns. The
    IDS can then respond by taking a user-defined action, or performing additional
    logging. A statistical analysis system builds statistical models of the environment,
    with the average length of a telnet session, and then looks for deviations from
    “normal.” After over 10 years of government research, some products are just beginning
    to incorporate this technology into marketable products.'
