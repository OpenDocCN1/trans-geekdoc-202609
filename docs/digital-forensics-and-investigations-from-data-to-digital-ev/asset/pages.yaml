    # 8.4 SEARCH WARRANT


    A search was legally defined by the courts in State versus Woodall as “an examination
    of a man’s house or other buildings, or of his person, or of his vehicle, aircraft,
    etc., with a view to the discovery of contraband or illicit or stolen property,
    or some evidence of guilt to be used in the prosecution of a criminal action for
    some crime or offense with which he is charged” (according to Black’s Law Dictionary).
    A seizure was defined in Molina versus State as “the act of taking possession
    of the property, for example, for a violation of law by virtue of an execution”
    (of a warrant).


    ![](img/149e5d898c819a550264bf1eab7b7354_209_0.png)


    **Figure 8.2:** A Search Warrant. Source: http://www.lawweb.in/2015/05/whether-court-issue-general-search.html


    A search warrant is a document signed by a magistrate giving authority to search
    a specified place for specific items that are particularly described in the warrant.
    A warrant must be based on another document called affidavit, which is signed
    under oath by some person (a police officer or any other person) expressing the
    belief that certain items will be found at the location to be searched and giving
    facts that support the belief. Those facts must constitute probable cause that
    the objects of the search will be found at the described location. Only those
    items specifically named in the warrant can be searched for. A warrant can authorize
    the search and seizure of computer hardware, digital information, or both. Overly
    broad language (such as authorization to seize “all records” or “all computers”)
    can result in the warrant being invalidated; the warrant'
