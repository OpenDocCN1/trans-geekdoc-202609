    # 9.2 TYPES OF CYBERSTALKING


    Ellison suggests that cyberstalking can be classified by the type of electronic
    communication used to stalk the victim and the extent to which the communication
    is private or public(1999). Ellison has classified cyberstalking as either “direct”
    or “indirect.” For example, direct cyberstalking includes the use of pagers, cell
    phones, and email to send messages of hate, obscenities, and threats to intimidate
    a victim. Direct cyberstalking has been reported to be the most common form of
    cyberstalking with a close resemblance to offline stalking (Wallace, 2000). Direct
    cyberstalking is the most common in which stalking begins. On the other hand,
    indirect cyberstalking includes the use of the Internet to display messages of
    hate, and threats used to spread false rumors about a victim (Ellison and Akdeniz,
    1998). Messages are posted on web pages, within chat rooms, or bulletin boards.
    Working to Halt Online Abuse (2003) statistics show chat rooms, instant messages,
    message boards, and newsgroups to be the most common way that indirect cyberstalking
    begins. Oglievie claims indirect cyberstalking has the greatest potential to transfer
    into real-world stalking (2000). Messages placed within the public space of the
    Internet can encourage third parties to support their assault. Therefore, indirect
    cyberstalking can escalate the risk of victims by restraining the geographical
    margins of possible threats. Consequently, indirect cyberstalk have have greater
    potential than direct cyberstalking to transfer into the real world as it increases
    the potential for'
  merge: -1
  img_proc: true
