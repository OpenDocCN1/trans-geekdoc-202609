  md: 'iDen cellular phones. This number consists of a series of numbers formatted
    as ###*******###### where the first three digits are the Area ID (region of the
    home carrier''s network), the next three digits are the Network ID (iDen carrier)
    and the last five digits are a subscriber identification number which sometimes
    corresponds to the last five of the cellular phone number. (Punja & Mislan, 2008)


    +   (d) Removable/external data storage Many cellular phones on the market have
    the ability to store data to a removable storage device such as a Trans Flash
    Micro SD memory expansion card. In the event that such card is installed in a
    cellular phone that is submitted for examination, the card should be removed by
    the examiner and processed using traditional digital forensics techniques. The
    processing of data storage cards using cellular forensics tools while the card
    remains installed within the phone may result in the alteration of data and time
    stamp for files located on the data card. Additionally, cellular phones may allow
    for the external storage of data within network-based storage areas accessible
    to the user''s computer. Accessing this data, which is stored on the phone service
    provider''s network, may require further legal authority and is generally beyond
    the scope of the examination of a cellular phone handset. However, the potential
    existence of network-based data storage should be taken into account by the examiner.
    Many feature phones and smartphones are also designed to sync with a user''s computer
    to facilitate access to and transfer of data to from the cellular phone. Full
    backups of the data from a phone may be found on the phone owner''s computer.
    The potential for the existence of these alternative storage areas should be considered
    by the examiner as additional sources of data originating from cellular phones.


    +   (e) Other potential evidence collection Prior to the beginning examination
    of a cellular phone, consideration should be given to whether or not other evidence
    collection issues exist. Cellular phones may be good sources of DNA, fingerprint,
    or other biological evidence. Collection ofDNA, biological and fingerprint evidence
    should be accomplished prior to the examination of the cellular phone to avoid
    contamination issues.'
