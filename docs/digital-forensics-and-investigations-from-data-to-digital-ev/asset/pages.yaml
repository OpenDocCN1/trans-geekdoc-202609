    physical evidence, witness accounts, or the circumstantial relationships that
    are examined, analyzed, and recorded during the investigative process. It can
    be anything from the direct evidence of an eyewitness who saw the accused committing
    the crime, to the circumstantial evidence of a fingerprint found in a location
    connecting the accused to the victim or the crime scene. Naturally, direct evidence
    that shows accused committed the crime is the preferred inculpatory evidence,
    but in practice, this is frequently available. The investigator must look for
    and interpret other sources of evidence and information. Often, many pieces of
    circumstantial evidence are required to build a case that allows the court to
    reach their belief beyond a reasonable doubt. A single fingerprint found on the
