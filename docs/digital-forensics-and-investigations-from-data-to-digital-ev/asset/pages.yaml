    actual content. The Supreme Court has long held that there is no reasonable expectation
    of privacy in this information because the telecommunications company has ready
    access to; in fact, the company must utilize this information to ensure the communications
    are properly routed and delivered. The pen register Act covers pen registers/trap
    and trace. In the context of phone calls, pen registers display the outgoing number
    and the incoming number. Because email subject lines contain content, their use
    on emails, per revisions in the USA PATRIOT Act, must include the sender and addressee
    avoid any part of the subject. IP addresses and port numbers associated with the
