  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    EC2 has deployed such fine granularity and precision that it has become a benchmark
    and model in cloud computing. Amazon’s EC2 provides virtual machine based computation
    environments. It uses the Xen hypervisor (2010) to manage their Amazon Machine
    Image (AMI) instance. AMI is “encrypted machine image that contains all information
    to boot instances of your software” (Amazon EC2, 2010). Using simple web service
    interfaces, users can launch, run, monitor and terminate their instances. Moreover,
    they can, on-the-fly, add any of the abovementioned features to their configuration
    as they desire.


    # (2) GoGrid


    GoGrid shares many characteristics with Amazon in the classic cloud computing
    areas: supporting multiple operating systems through its own image management,
    and supporting load balancing, cloud storage, and so on. In addition, GoGrid provides
    customers with a user-friendly web service interface, comprehensible video demonstrations,
    and a strict but inexpensive billing system. Thus both EC2 and GoGrid provide
    basic and common features of cloud computing. The difference between the services
    they provide mainly derives from their respective business models. For example,
    GoGrid provides free and persistent storage, slightly different from Amazon. GoGrid
    also provides Hybrid Hosting, a distinguishing feature. Many applications do not
    run well in a pure multitenant server environment. Databases perform better on
    a dedicated server where they do not have to compete for input/output resources,
    and the situation is similar with web server applications. GoGrid provides these
    special applications with dedicated servers that also have high-security assurance.


