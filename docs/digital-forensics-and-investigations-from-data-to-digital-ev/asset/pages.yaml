    by witnesses who are not present. While hearsay evidence is not admissible in
    court, it can be relevant and valuable in a workplace investigation the burden
    of proof is less robust in court. The rule against hearsay says that any assertion
    of fact other than one made by a person while giving oral evidence in the court
    proceedings is inadmissible as evidence of any fact asserted. Thus, any of court
    statements including photographs, videotapes, and digital information produced
    and stored by a computer are hearsay and cannot be used as evidence. There are,
