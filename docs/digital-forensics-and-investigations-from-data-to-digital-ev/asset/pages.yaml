  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    The creation of the Internet was to serve the communication needs of the defense
    establishments. However, it has evolved into a system utilized by hackers to steal
    users’ identity and launch malicious attacks on servers. The issue of security
    and the rise in intricacy of cyberattacks are the major factors of network forensics.
    Most attackers now cover their tracks in such a way that would not be detectable.
    This chapter discusses the various tools and techniques required to conduct network
    forensics and highlight the various IP traceback mechanisms. The last page of
    this chapter describes the frameworks we use Honeynet Architecture and Honeypots,
    and their application in detecting cyberattacks, traffic, and shielding the production
    systems. Each of the phases in the framework is presented.-


    # 3.1 TECHNICAL OVERVIEW OF NETWORK AND INTERNET


    The Internet is the most powerful means of communication presently because it
    conveys wide range of data and helps to promote businesses, services, economic
    growth, and sustenance. it is a safe haven for many users; however, it has become
    a platform for all types of cyber warfare. The eCommerce industry is a major target
    for cybercriminals because all transactions are being carried out online and directly.
    The Internet needs to be protected from these attacks and a proper measure must
    be adopted in order to reduce its negative impact. Network forensics is defined
    as “the use of scientifically proven techniques to collect, fuse, identify, examine,
    correlate, analyze, and document digital evidence from multiple, actively processing
    and transmitting digital sources for the purpose of uncovering facts related to
    the planned intent, or measured success of unauthorized activities meant to disrupt,
    corrupt, and compromise system components as well providing information to assist
    in response or recovery from these activities” (Palmer, 2001). In a simple term,
    network forensics is the capture and examination of network traffic with footage
    to analyze the events that occurred in order to ascertain the source of security
    breaches. It involves checking network traffic to see if there is an anomaly.
    If there is, the nature of cyberattack is determined and an incident response
    can be obtained. The goal of network forensics is to examine traffic data logged
    through firewalls or wireless network devices as routers or intrusion detection
    methods, tracing the source of the attacks so that the criminals are indicted.
    Network forensics is being researched for several years but it still seems a very
    young science as many issues are still not very clear. Network forensics'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'is not another term for network security. Network security is an essential
    part in network forensics as data for forensic analysis can be collected from
    security products placed to detect and prevent intrusions. Network forensics involves
    certain crimes that are legally prosecutable but they may not breach the network
    security policies. Network security protects the system against attack while network
    forensics does not.


    Network security products look for possible harmful behaviors related with various
    attacks and monitor the network 24 hours a day. Network forensics postseason investigation
    of the attack in many cases. It case restricted and is started after crime notification
    specifically addressing a particular attack. Network forensics ensures that the
    attacker spends more time and energy to cover his tracks making the attack costly.
    criminals are also cautious to avoid prosecution for their illegal actions. This
    acts as a deterrent and reduces network crime rate, thus improving security. Network
    forensics also can initiate investigation in real time provided resources are
    available to handle the traffic and analyze it.


    # 3.2 CONNECTION OF FORENSIC NETWORK USING TCP/IP


    Network devices, such as routers and servers, are good sources for collecting
    Internet-related evidence. According to Wikipedia, a router is a networking device
    that forwards data packets between computer networks. Servers are computers designed
    to accept and respond to requests by another computer program or device known
    as “clients.” It is essential for companies that utilize these network devices
    to keep logs of the data that pass through them. This allows static monitoring
    and duplication of activity across the network. Transmission Control Protocol/IP
    (TCP/IP) packets have an exceptional role to play in forensic investigations and
    are a good example of why corporate organizations should preserve network traffic
    logs. When a message is sent through the Internet, it is created and transmitted
    in TCP/IP packets, then rearranged on the other end. Each packet comprises a header
    which includes information about the source and target computer. The addresses
    are of major interest during a forensic investigation. The origin address may
    provide information about the attacker’s identity, the destination address may
    provide information about a precise target within a system, and the data may recognize
    the source of the attack on its own. Each packet also comprises several additional
    fields that can be beneficial during an investigation. For example, error checking
    information'
  merge: -1
  img_proc: true
