    is considered a crime in the other. Others, however, have expressed

    reservations about supporting a global standard for combating cybercrime.


    # 10.3.3 Effective Law Enforcement


    There remain many challenges for law enforcement agencies in relation

    to cyber terrorism. The rapid advancement of computer technology has

    increased the frequency and impact of cyber terrorism worldwide. These

    cyber terrorists continue to operate in a borderless environment with the

    knowledge that there is no single international legislation. Governments

    h varying technical competences to deal with cyberterrorist acts and the

    ordination among law enforcement authorities are restricted by foreign

    policies and political ideologies. Law enforcement agencies around the

    world are also limited by resources in relation to funding and personnel

    trained in cyber terrorism. This, in turn, raises the issue of developing a

    sec mechanism for transferring and sharing information on cyber

    threat data to law enforcement agencies. One could argue that the current

    international legislative environment provides very limited or no deterrence

    for perpetrators committing cyber terrorism. In order for countries to

    counter cyber terrorism, it is critical for governments, their respective law'
  merge: -1
