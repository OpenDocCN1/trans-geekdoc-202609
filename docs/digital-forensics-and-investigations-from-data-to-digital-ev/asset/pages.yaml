    when it can be clearly shown that only one person had physical access to a PC.
    In many cases, multiple persons have access to a PC, making it necessary to find
    and examine digital artifacts and their properties to ascertain which individual
    or individuals are responsible for, or had knowledge of, incriminating data found
    on the storage media. Often it is necessary to place artifacts in context with
    verifiable real-world events. The payoff can be significant. A suspect presented
    with clear evidence indicating that he or she and no other person'
