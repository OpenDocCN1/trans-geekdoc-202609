    The migration path of Email service in a corporation environment—from initially
    multiple email servers to today''s single corporate level email cloud to a public
    email cloud—offers an exemplary representation. While conformists might argue
    in black and white terms, we believe private cloud as a viable deployment model
    for cloud computing will exist for a long time and deserves the attention from
    both business and research communities.


    # 5.2.3 Hybrid Cloud


    Hybrid clouds are more complex than the other deployment models since they involve
    a composition of two or more clouds (private, community, or public). Each member
    remains a unique entity but is bound to others through standardized or proprietary
    technology that enables application and data portability among them. A hybrid
    cloud is a composition of at least one private cloud and at least one public cloud.
    A hybrid cloud is typically offered in one of two ways: a vendor has a private
    cloud and forms a partnership with a public cloud provider, or a public cloud
    provider forms a partnership with a vendor that provides private cloud platforms.
    Hybrid cloud infrastructure is a composition of two or more clouds that are unique
    entities, but at the same time are bound together by standardized or proprietary
    technology that enables data and application portability. In hybrid cloud, an
    organization provides and manages some resources in-house and some out-house.'
