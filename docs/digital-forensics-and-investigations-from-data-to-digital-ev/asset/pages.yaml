    network forensics has the following requirements:


    +   (a) It must allow peers to act as both producers and consumers of data.

    (b) It must allow the dynamic addition and subtraction of peers to the system.

    (c) It must communicate with a range of platforms.

    (d) It must reduce network traffic overhead.

    (e) It must promote the exchange of data in a common format.

