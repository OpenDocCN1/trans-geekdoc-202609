    # 9.4 HOW CYBERSTALKERS OPERATE


    Cyberstalking works in the same way as stalking in the physical world. In fact,
    many offenders combine their online activities with more traditional forms of
    stalking and harassment as telephoning the victim and going to the victim''s home.
    Some cyberstalkers obtain victims over the Internet and others put personal information
    about their victims online, encouraging others to contact the victim, or even
    harm him/her. In general, stalkers will exert power over their victims in some
    way, basically through fear. The crux of a stalker''s power is information about
    and knowledge of the victim. A stalker''s ability to frighten and control a victim
    increases with the amount of information that he or she can gather about the victim.
    Stalkers use information like telephone numbers, addresses, and personal preferences
    to impinge upon their victims'' lives. Also, overtime cyberstalkers can learn
    what sorts of things upset their victims and can use this knowledge to harass
    their victims further.


    # 9.4.1 Acquiring Victims


    Previous studies indicate that many stalkers had prior social contact with their
    victims before the stalking behavior began. The implication of these studies is
    that investigators should pay particular attention to acquaintances of the victim.
    However, these studies are limited because many stalking cases are unsolved or
    unreported. Additionally, it is not clear what constitutes an acquaintance on
    the Internet and the Internet makes it easier for cyberstalkers to find victims
    of opportunity.


    Cyberstalkers can search the web, browse through ICQ and AOL profiles, and lurk
    in IRC and AOL rooms looking for likely targets. These are the vulnerable individuals
    with low self-esteem who will be easy to intimidate. As a rule, investigators
    should rely more on available evidence than on general studies. Although research
    can be useful to a certain degree, the evidence is the most reliable source of
    information about a specific case and it is what the courts will use to make a
    decision.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 9.4.2 Anonymity and Secret Monitoring


    The Internet has the added advantage of protecting a stalker’s identity and allowing
    a stalker to monitor a victim’s activities. For example, stalkers acquainted with
    their victims use the Internet to hide their identity, forged or anonymous email
    and using ICQ or AOL Instant Messenger to harass their victims. Also, stalkers
    can utilize ICQ or AOL Instant Messenger, and other applications (e.g., finger)
    to determine when a victim is online. Most disturbing of all, stalkers can use
    the Internet to spy on a victim. Although few stalkers are skilled to break into
    a victim’s account or intercept email in transit, a cyberstalker can easily observe
    a conversation in a live chat room. This type of presurveillance of intent to
    commit a crime but it is not a crime in itself and is not stalking as defined
    by the law.


    # 9.4.3 Escalation and Violence


    It is often suggested that stalkers will cease harassing their victims once they
    cease to provoke the desired response. However, some stalkers become aggravated
    when they do not get what they want and become increasingly threatening. Since
    stalkers have resorted to violence and murder, it is important for investigators
    to be extremely cautious when dealing with a stalking case. Investigators should
    examine the available evidence closely, protect the victim against further harm
    as much as possible, and consult with experts when in doubt. Most importantly,
    investigators should not make hurried judgments that are based primarily on past
    cases.


    # 9.5 INVESTIGATING CYBERSTALKING


    There are several stages to investigating a cyberstalking case. These stages assume
    that the identity of the cyberstalker is unknown. Even if the victim suspects
    an individual, investigators are advised to explore alternative possibilities
    and suspects. Although past research suggests most stalkers have prior relationships
    with victims, this may not apply when the Internet is involved as stranger stalking
    is easier. Therefore, consider the possibility that the victim knows the stalker,
    but do not assume that this is the case:


    # (1) Interview victim


    An investigator should determine what evidence the victim has of cyberstalking
    and obtain details about the victim that can be used to develop'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'victimology. The aim of this initial information gathering stage is to confirm
    that a crime has been committed and to obtain enough information to move forward
    with the investigation.


    # (2) Interview others


    The investigator needs to interview other people that are involved in the case
    in order to get a clearer picture of the event.


    # (3) Victimology and risk assessment


    The investigator should also determine why an offender chose a particular victim
    and what risks the offender was willing to take to acquire that victim. The primary
    aim of this stage of the investigation is to understand the victim–offender relationship
    and determine where additional digital evidence might be found.


    # (4) Search for additional digital evidence


    As an investigator, you need to use what is known about the victim and cyberstalker.
    Victimology is a major element at this stage, guiding investigators to locations
    that might interest the victim or individuals like the victim. The cyberstalker
    initially observed or encountered the victim somewhere and investigators should
    try to determine where. Consider the possibility that the cyberstalker encountered
    the victim in the physical world. The aim of this stage is to gather more information
    about the crime, the victim, and the cyberstalker.


    # (5) Crime scene characteristics


    Examine crime scenes and cybertrails for distinguishing features (e.g., location,
    time, method of approach, and choice of tools) and try to determine their significance
    to the cyberstalker. The aim of this stage is to gain a better understanding of
    the choices that the cyberstalker made and the needs that were fulfilled by these
    choices.


    # (6) Motivation


    Make sure that you ascertain what personal needs the cyberstalking was fulfilling.
    Be careful to distinguish between intent (e.g., to exert power over the victim
    or to frighten the victim) and the personal needs that the cyberstalker’s behavior
    satisfied (e.g., to feel powerful or to retaliate against'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    the victim for a perceived wrong). The aim of this stage is to understand the
    cyberstalker well enough to narrow the suspect pool, revisit the prior steps,
    and uncover additional evidence.


    # (7) Repeat


    You should interview the victim repeatedly if the identity of the cyberstalker
    is still known. The information that investigators have gathered might help the
    victim recall additional details or suggest a likely suspect to the victim. To
    assist investigators to carry out each of these stages in an investigation, additional
    details are provided here.


    # 9.6 CYBERSTALKING VICTIMS


    Unlike most traditional crimes, cyberstalking knows no boundaries. Anyone can
    become a stalking victim, whether it is random or predicated on poor judgment
    when one releases personal information on the Internet. Even though most of the
    evidence is anecdotal, it strongly suggests that the majority of cyberstalkers
    are male and the victims are women; there have been highly publicized cases of
    females stalking men and same-sex stalking (Reno, 1999). Unlike male stalkers,
    female stalkers are more inclined to stalk and harass ex-partners and less likely
    to stalk strangers. Female stalkers are also more likely to target other females
    in the hopes of establishing an intimate relationship with the victim. Female
    stalkers are very similar to males in regard to demographic profiles and psychiatric
    status; however, males are more likely to have a history of criminal offense or
    substance abuse (Purcell et al., 2001).


    As noted, virtually anyone can become a victim, but certain demographic groups
    are more at-risk than others such as women, juveniles, newcomers to the Internet,
    and other particularly vulnerable groups. In a 2002 study conducted by the online
    victim advocacy group, Working to Halt Abuse, 71% of cyberstalking victims were
    women and 59% of that group had some type of previous relationship with the stalker
    (Hutton and Haantz, 2003). A prior relationship, whether real or perceived, seems
    to be the catalyst for cyberstalking, particularly when the victim attempts to
    end the relationship (Reno, 1999).


    Interestingly, a 2001 research study concluded that 61% of the cyberstalking victims
    were Caucasian followed by Asians with 3.9% and African Americans with 1.6%. One
    should approach these findings with a degree of caution as the survey data was
    confined to the United States'
