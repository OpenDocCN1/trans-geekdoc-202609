- pgno: 189
  md: '# 7.5.2 Host IDS


    The host-based IDS looks for signs of intrusion on the local host system. These
    frequently use the host’s audit and logging mechanism as a source of information
    for analysis. They look for unusual activity that is confined to the local host
    such as logins, improper file access, unapproved privilege escalation, or alterations
    on system privileges. This IDS architecture generally uses rule-based engines
    for analyzing activity; an example of such a rule might be, “superuser privilege
    can only be attained through the command.” Therefore successive login attempts
    to the root account might be considered an attack.


    # Pros


    Host-based IDS can be the most powerful tool for analyzing attacks. For example,
    sometimes you can say exactly what attacker did with the command line, which file
    is opened, and what the system calls he execute instead of making unclear allegations
    that he tries to implement the dangerous command. Host-based IDS provides more
    detailed information and important information than any network IDS. Host systems
    tend to have lower false positive rates than the network-based systems. This is
    because the range of commands running on a host is more important than the type
    of traffic that is running on the network. This feature reduce the complexity
    of host-based analytics. This host-based system can be used in environments where
    it is not necessary to discover a wide range of intrusion or where there is lack
    of communication bandwidth from the sensor to analyzer. Host-based systems can
    be entirely self-contained. This also allows machine-based systems to run in some
    cases by the media read-only. This protects an attacker from closing the IDS.
    Finally, in a host-based system, there are fewer risks in configuring an active
    response such as termination of service or logging the offending user. A host-based
    system is more problematic to spoof into controlling access from legitimate sources.


    # Cons


    In host-based system, you have to install the specific device you want to protect.
    For example, if you have a human resource server and you want to protect it, you
    need to install the IDS on this server. As already mentioned, this can create
    a problem of capacity. In some cases, this can create security problems because
    security staffs do not have access to the server. Another problem associated with
    a host-based system is that they tend to'
