    # 8.8 CLASSES OF EVIDENCE


    Legal evidence is classified based on the type of fact it is to prove, its form,
    the laws that govern its use and the role it has in the case. Major classes of
    legal evidence include: direct, circumstantial, documentary, hearsay, expert,
    scientific, inculpatory, and exculpatory evidence.


    # 8.8.1 Direct Evidence


    Direct evidence is not presumed or inferred it is directly related to the fact.
    According to the legal dictionary online, direct evidence is “evidence that if
    believed, proves the existence of the fact in issue without inference or presumption.
    Direct evidence proves or disproves a fact directly. Perhaps the most well-known
    type of direct evidence is eyewitness testimony, for a witness describes precisely
    what she saw, heard, or experienced. For instance, in a personal injury case,
    suppose that the injured plaintiff was crossing the street when the defendant
    hit her with her car. One type of direct evidence the plaintiff might use to prove
    that the defendant clearly the driving might be the testimony of a bystander who
    saw the defendant clearly as his car hit the plaintiff. Exhibits and other pieces
    of real or documentary evidence may also provide direct evidence. For instance,
    in a breach of contract case, the contract itself is direct evidence of the existence
    of the contract. Products liability case may bring the actual defective product
    into court to show the judge or jury that the product did, in fact, break in the
    way that witnesses it did.” Direct evidence is concrete or firsthand evidence
    of the fact being proven.


    # 8.8.2 Circumstantial Evidence


    Circumstantial evidence as defined as “...evidence that is drawn from direct observation
    of a fact by events or circumstances that surrounds it.” Circumstantial evidence
    is that which suggests or infer the existence of the fact. Circumstantial evidence,
    by contrast, is evidence that does not point directly to a fact. Instead, an inference
    must be made that the'
