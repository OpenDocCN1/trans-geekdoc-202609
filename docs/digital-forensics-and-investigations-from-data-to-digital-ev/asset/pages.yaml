- pgno: 110
  md: '# Operating Systems in Forensic Investigation 89


    # ## 4.4.6 Recovering Files from RAM


    A deleted file whose contents have been overwritten on disk may still be recovered.
    To illustrate the forensic technique, say an intruder may execute a program and
    delete it from disk to hide its existence.


    This happens, for example, when an intruder installs a backdoor on the victim
    system by executing the net cat utility, deleting the utility from the disk. As
    long as the program remains a running process in memory, the original executable
    can be recovered. The file is recoverable because the Linux kernel uses a pseudo
    file system to track the general state of the system, including running processes,
    mounted file systems, kernel information, and several hundred other pieces of
    critical system information. This information is kept in virtual memory and is
    accessible through the /proc directory. A (partial) listing below shows the contents
    of the /proc directory on a running Linux system.


    Each of the numbers corresponds to a processor ID and a directory that contains
    information on the running process.


    ```

    # Is/proc

    1 4 4513 4703 4777 excdom mdstat swaps

    1693 40 4592 4705 acpi fb meminfo sys

    2 4045 4593 4706 asound filesystems misc

    2375 41 4594 4708 bus buddyinfo fs ms sysvipc

    2429 4163 4595 4709 bus ide modules tty

    2497 4166 4596 4712 cmdline interrupts iomem mtr uptime

    2764 4186 4597 4713 config.gz iomem mtr version

    29 42 4620 4715 cpufreq ioports netstat

    ```


    To illustrate the recovery of a deleted file, say that an intruder has downloaded
    a password cracker and is attempting to crack system passwords, which is a very
    common goal for an intruder. The intruder runs the john (www.open.com) password
    cracker with a list of passwords in a file called pass. The intruder subsequently
    deletes the executable and the text file containing the passwords, the executable
    remains in memory until the process is killed. The ps command displays running
    processes. The listing below shows the executable “John” has been called with
    the “pass” file at 10:10 am, has been running for 22 seconds, and is owned by
    root.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 4.4.7 Use of Linux as a Forensic Tool


    Linux is often used in computer forensics for the following reasons:


    +   (a) Greater control;

    (b) Treats every device as a file;

    (c) Does not need a separate write blocker;

    (d) Power;

    (e) Can be booted from a CD;

    (f) Can recognize several file systems;

    (g) Flexibility;

    (h) Distributions such as The Farmer''s Boot CD and Sleuth make a forensic tool
    in and of of itself.


    # Advantages of Linux in Forensics


    There are several advantages of using Linux in forensic investigations, including
    the following:


    +   (a) Software availability and accessibility;

    (b) Freely available software and source code;

    (c) Tools can be closely analyzed;

    (d) Efficiency; (e)Allows for a good deal of automation and scripting;

    (f) Optimization and customization;

    (g) Software can be modified to fit special requirements;

    (h) Support;

    (i) Supports ad-hoc community;

    (j) Uses open, published standards;

    (k) Compatible across technologies and organizations.


    # Disadvantages of Linux in Forensics


    There are, of course, disadvantages to using Linux in forensics. Since the Linux
    operating system is very different from Windows or Mac OS, the investigator may
    need to be specially trained to use Linux. Also, because Linux is an open-source
    operating system, it is frequently updated. It takes time to implement these changes,
    which are never be to be considered permanent or final.'
  merge: -1
  img_proc: true
