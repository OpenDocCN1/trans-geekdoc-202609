- pgno: 121
  md: '# 4.6.3 File Deletion


    Evidence of file deletion (as opposed to destruction/wiping) by a particular user
    presents its own set of challenges, particularly since no specific program or
    utility is required to delete a file in Windows. Simply sending a file to the
    Recycle Bin (as covered in earlier in this chapter) is not (by the most common
    forensic definition) actual deletion of the file; however, a user sending a file
    to the Recycle Bin is often viewed as legally significant in a case where the
    user was supposed to be preserving or protecting data. Further, a file in the
    Recycle Bin is usually easy to identify and data provided by INFO2 records or
    $I files (Vista/7 Recycle Bin operation) can help the investigator pinpoint where
    the file was when it was deleted, as well as the data was sent to the Bin and
    by which user account. Even if the Recycle Bin is empty, looking at the Last Written
    date-time stamp on the associated INFO2 record can provide the investigator with
    valuable data about the approximate time the Recycle Bin was cleared. Forensic
    examiners can often recover data and associated metadata for deleted files, even
    when Recycle Bin information is not available. In particular, when dealing with
    NTFS, a recovered MFT entry can provide all the information a forensic examiner
    needs about deleted data. In any case, it is paramount for an investigator to
    correlate and weigh each piece of evidence carefully before opening on the source
    of a file’s deletion.'
