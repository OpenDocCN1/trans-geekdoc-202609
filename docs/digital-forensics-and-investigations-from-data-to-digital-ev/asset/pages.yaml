    applications will display ADSs in red within the GUI of the application. Dave
    Roth [6] has published a Perl script named “listdatastream. pl” that can be used
    on a live system to locate ADSs. This script uses Dave''s Win32: API: Prototype
    module and relies on native Windows programming interface (API) functions.


    # ## 4.4 LINUX SYSTEM


    Linux systems will be increasingly encountered at crime scenes as Linux increases
    in popularity, particularly as the OS of choice for servers. The skills and expertise
    required to recover evidence from a Microsoft Windows system, however, do not
    necessarily translate to the same tasks on a Linux system. For instance, the Microsoft
    NTFS, FAT, and Linux Ext2/3 file systems work differently enough that understanding
    tells little about how the other functions. In this chapter, we demonstrate digital
    forensics procedures for Linux systems using command line tools. The ability to
    gather evidence from a running system is particularly important as evidence in
    RAM may be lost if a forensics responder does not prioritize the collection of
    live evidence. The forensic procedures discussed include methods for identifying
    and recovering deleted files from RAM and magnetic media, identifying notables
    files and Trojans, and finding hidden files and renamed files (files with renamed
    extensions).


    We begin by describing recovering deleted files from RAM (running) Linux system.
    Because Linux systems are commonly employed as servers, most of the demonstrations
    are directed toward activities and techniques that intruders are known to use
    after breaking into a system.


    # ### 4.4.1 Linux File Systems Architecture


    At the time of this writing, current Linux systems use the Ext3 file system. Ext3
    is the successor of Ext2, added journaling but retained Ext2''s underlying structure.
    In fact, an Ext3 volume will happily mount as Ext2 if the user uses the mount
    command appropriately. Other file systems are available via the Linux kernel,
    including ReiserFS, XFS, and JFS. Because these file systems are not generally
    used in a default Linux installation, their presence may indicate a purpose-built
    system (as opposed to a general-use desktop system).'
  merge: -1
  img_proc: true
