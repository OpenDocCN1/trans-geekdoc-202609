    # 5.2.2 Private Cloud


    Private cloud, in contrast, represents a deployment model where enterprises (typically
    large corporations with multi-location presence) offer cloud services over the
    corporate network (can be a virtual private network) to its own internal users
    behind a firewall-protected environment. Recent advances in virtualization and
    data center consolidation have allowed corporate network and datacenter administrators
