    are many public cloud service providers in place today, offering various services.
    Amazon EC2, Force.com, and Google App Engine are among some of the best-known
    examples of public clouds, but the market now bristles with competition. The public
    cloud offers a clean, infrastructure-less model for users to benefit from IT services,
    and intrigues the research community with its disruptive nature. However, migrating
    the majority of today’s IT services, such as the business applications in an enterprise
    environment to a public cloud model is not realistic. Data security, corporate
    governance, regulatory compliance, and performance reliability concerns prohibit
    such IT applications to be moved out of the “controlled domains” (i.e., within
    the corporate firewalls) while the public cloud infrastructure, government regulation,
    and public acceptance continue to improve.


