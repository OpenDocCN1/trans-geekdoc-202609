    # 10.1.5 An Offending Typology


    Variations among offenders translate into different patterns of Internet behavior.
    Offenders vary in the level of their involvement in Internet child pornography,
    the degree of networking in which they engage with other offenders, their expertise
    in employing security strategies to avoid detection, and the extent to which their
    Internet behavior involves direct sexual abuse of children. The following typology
    of child pornography offending has been suggested:


    +   (1) Browsers: Offenders who stumble across child pornography but knowingly
    save the images. They are not involved in networking with other offenders and
