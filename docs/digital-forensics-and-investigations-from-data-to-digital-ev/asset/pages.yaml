    # 7.7.1 Intrusion Detection Methods


    ID falls into two categories, manual IDS, such as log analysis and manual correlation,
    and the use of automated IDS. The optimal solution is normally a combination of
    both mechanisms as IDS do not and will not detect all possible attacks.


    # (1) Manual intrusion detection methods


    Knowledge of, and the ability to competently apply, manual ID techniques is essential
    to comprehensive network security, IDS, which rely on various techniques including
    attack signature recognition and system/network anomaly detection, can lull management
    and administrators into a false sense of security. Firewalls may engender a false
    sense of security, particularly if they are not properly managed. Manual ID relies
    on the extensive knowledge an administrator has about or her network. Applying
    manual ID methods in a time critical environment such as a post-intrusion scenario
    requires the sysAdmin/ISSO to be familiar and competent with the tools they will
    utilize to conduct their examinations and have a consistent set of procedures
    for conducting their analyses. Manual ID is conducted by: (a) identification of
    anomalous entries in system logs, (b) verification of the integrity of critical
    system files, (c) identification (and preservation) of suspicious users, processes,
    files and other intruders, (d) analysis of network transaction records, and (e)
    correlation of all relevant data to develop a picture of what has occurred. Not
    all attacks or suspicious activities need to be investigated in the same way,
    so tools utilized to assist the user to access various levels of detail according
    to their needs.


    +   (a) System log analysis Log files contain information about activities that
    have occurred overtime. They are often the only record of suspicious behavior
    making them the most crucial form of evidence in an intrusion investigation. There
    must be recognized at a high level within an organization that system log files
    are in fact crucial records for an organization and they must be treated as such.
    Different systems provide different types of logging information and some systems
    do not provide adequate logging in their default configuration. Some “trusted”
    operating'
  merge: -1
  img_proc: true
