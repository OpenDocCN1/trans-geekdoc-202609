    can be used to confirm that data complies with addresses. Furthermore, the header
    contains six extra bits that are left empty when the packet is sent. Most firewalls
    are designed to check these six bits and throw away packets that have information
    in these bits. However, the information in these bits may be important if an attack
    occurs. So, if a system discovers one of these packets, it should redirect it
