    # 8.9.1 Trial Process


    In the United States, the trial is the principal method for resolving legal disputes
    that parties cannot settle by themselves or through less formal methods. The chief
    purpose of a trial is to secure fair and impartial administration of justice between
    the parties to the action. A trial seeks to ascertain the truth of the matters
    in issue between the parties and to apply the law to those matters. Also, a trial
    provides a final legal determination of the dispute between the parties. The main
    types of trials are civil trials and criminal trials. Civil trials resolve civil
    actions, which are brought to enforce, redress, or protect individual rights.
    Generally, all types of actions other than criminal actions are civil actions.
    In a criminal trial, a person charged with crime is found guilty or guilty and
    sentenced. The government, on behalf of the citizens, brings a criminal action
    in order to punish the violators of criminal laws.


    # 8.9.2 Jury Selection


    Although a trial does not technically begin until after the jury is seated, jury
    selection, or Voir Dire (pronounced vwahr DEER), is commonly referred to as the
    first stage of a trial. At the beginning of a trial, the jury is chosen from the
    jury pool, a group of citizens who have been randomly chosen the community for
    the duty of a jury. The judge and the attorneys, on behalf of the parties, interrogate
    each of the potential jurors. If a potential juror is for any reason is biased
    in judging the evidence, he will not be allowed to sit on'
