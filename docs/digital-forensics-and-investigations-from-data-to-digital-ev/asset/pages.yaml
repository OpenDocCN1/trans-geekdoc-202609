    # (1) Amazon Elastic Compute Cloud (EC2)


    Amazon has provided a popular universal and comprehensive solution to cloud computing
    called the Amazon Elastic Compute Cloud (EC2). This solution was released as a
    limited public beta on August 25, 2006, but grew rapidly in the following years.
    After Amazon added many important and powerful features to EC2, it dropped the
