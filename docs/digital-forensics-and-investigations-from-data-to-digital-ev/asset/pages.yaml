    flag combinations. The traffic generated by an aggressive port scan, for example,
    can sometimes crash a machine. Finally, network vulnerability scanners tend to
    contain a huge amount of vulnerability data. If anyone breaks into the scanner
    system, compromise of most other machines on the network can become child’s play.
    Protect the scanner to prevent unauthorized use of scanning data.


    # 7.6 Host Vulnerability Scanner


    A host vulnerability scanner differs from a network vulnerability scanner in that
    it is confined entirely to the local operating system. A network vulnerability
    scanner requires the target machine be accessible from the network in order for
    it to operate; a host vulnerability scanner does not. Vulnerability scanners are
    software packages that are installed on particular operating systems. Once the
    software is installed it can be configured to run at any time of the day or night.
    Usually, the scans performed by this type of tool are scheduled to run at a low
    priority to reduce the impact of the scan on production work.


    # Pros


    Host vulnerability scanners tend to be much more tuned and accurate for a given
    operating system. They can frequently tell the user which patches to apply to
    fix identified vulnerabilities, while network scanners sometimes only provide
    general guidelines. When considering which product to purchase, look at sample
    reports for your specific operating systems to determine how much information
    is contained in the reports. The depth and accuracy of reporting should be a selection
    criterion. Host vulnerability scanners do not consume network bandwidth when they
    run. All processing is restricted to the local host system. Host vulnerability
    scanners are not as likely as network scanners to cause the IP stack on the target
    system to hang.'
