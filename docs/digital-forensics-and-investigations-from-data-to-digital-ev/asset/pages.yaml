    thus: the onus is on the prosecution to show the court that the evidence produced
    is no more and no less now than when it was first taken into the possession of
    the police.


    # 8.8.4 Hearsay Evidence


    Hearsay evidence is evidence that is not based on the personal account of an event
    but on the account of another and is not allowed under oath. It is essentially
    second-hand evidence, the evidence is given not about what one saw or heard personally
