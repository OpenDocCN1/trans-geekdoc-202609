  md: 'Computer Intrusions and Detection 171


    # 7.6 VULNERABILITY SCANNERS


    A vulnerability scanner differs from IDS, as mentioned earlier, that the vulnerability
    scanner looks for static configurations and the IDS looks for transient misuse
    or abnormalities. A vulnerability scanner may look for a known NFS vulnerability
    by examining the available services and configuration on a remote system. An IDS,
    managing the same vulnerability, would only report the existence of the vulnerability
    when an attacker attempted to exploit it. Vulnerability scanners, whether network
    or host scanners, give the organization the opportunity to fix problems before
    they arise, rather than reacting to an intrusion or misuse that is already in
    progress. An IDS detects intrusions in progress, while a vulnerability scanner
    allows the organization to prevent the intrusion in the first place. Vulnerability
    scanners may be helpful in organizations without a good incident response capability.


    ![](img/149e5d898c819a550264bf1eab7b7354_192_0.png)


    **Figure 7.4:** Vulnerability Scanners and Vendors. Source: https://avleon.com/2016/12/07/zeronights16-enterprise-vulnerability-management/


    # 7.6.1 Network vulnerability scanner


    A network vulnerability scanner operates remotely by examining the network interface
    on a remote system. It will look for vulnerable services running on that remote
    machine, and on a possible vulnerability. For example, it is well-known that rexd
    is a report service; a network vulnerability scanner will attempt to connect to
    the rexd service on the target system. If the connection succeeds, the scanner
    will report rexd vulnerability. Since a network vulnerability scanner can be run
    from a single machine on the network, it can be installed without impacting the
    configuration of other machines. Frequently, these scanners are used by auditors
    and security'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# 172 Digital Forensics and Investigation: From Data to Digital Evidence


    groups because they can provide an “outsider’s view” of security holes in a computer
    or network.


    # Pros


    Network vulnerability scanners can report on a variety of target architectures.
    Some work with routers, some with UNIX systems, and some with NT or other Windows
    platforms. Network vulnerability scanners are, in general, very easy to install
    and begin (from a technical standpoint). Unlike host-based systems, which usually
    require software installation or reconfiguration, a network-based system can be
    dropped into place on a network. Simply plug the interface into the switch and
    boot up the machine. The GUI with a network system tends to be quite intuitive,
    which means that junior personnel can monitor the system and call more senior
    analysts if something unusual crops up.


    # Cons


    Network vulnerability scanners are almost exclusively signature-based systems.
    Like a signature-based IDS, a signature-based vulnerability scanner can only detect
    those vulnerabilities it is programmed to recognize. If a new vulnerability comes
    into play, as they frequently do, there is a window of opportunity for the attacker
    before the vendor updates the signatures (and the customer downloads and installs
    the new signatures). If the vulnerability remains closely held, systems can remain
    vulnerable to attack for long periods of time. If customers are negligent with
    their vulnerability scanner signatures as history shows they are with virus signatures,
    then many organizations will be vulnerable to attack, even though they run vulnerability
    scanners at regular intervals. A recent analysis showed that 90% of web servers
    running IIS is still vulnerable to critical security vulnerability which is well
    documented, for which the vendor has produced a patch and a security advisory.
    A vulnerability scanner can only point out possible problems; the organization
    must still fix them. Another potential problem with a network vulnerability scanner
    is that the output still requires skilled interpretation. Every environment has
    operating requirements and different security vulnerabilities. In fact, the concept
    of “vulnerability” embodies other loosely defined concepts, such as risk, threat,
    acceptability, and expected attacker skills. Since each of these varies with each
    organization, the degree to which a particular configuration represents “vulnerability”
    also varies with each organization. When the vulnerability scanner reports a'
  merge: -1
  img_proc: true
