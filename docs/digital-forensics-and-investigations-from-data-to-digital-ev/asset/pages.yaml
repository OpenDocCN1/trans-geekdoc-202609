  md: 'particular vulnerability, the organization’s network or operations personnel
    must evaluate report within the context of the organization’s operating environment.
    The vulnerability may not pose an unacceptable risk in organization’s environment,
    or the risk may be forced upon the organization by business requirements. This
    may seem silly in the context of a security discussion, but in the real-world
    security concerns frequently fall to business justifications. Vulnerability scanners
    have been known to take down the target system. Some IP implementations are not
