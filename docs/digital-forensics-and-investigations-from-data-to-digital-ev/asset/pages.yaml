    # ## 2.4 THE INTEGRATED DIGITAL INVESTIGATION MODEL


    Brian Carrier and Eugene Spafford proposed yet another model—the Integrated Digital
    Investigation Process (IDIP) which is organized into 5 groups consisting of 17
    phases in all. It is an out and out model which considers the dual investigative
    nature of the digital forensic investigation by including the digital and the
    physical crime scene phases. The model envisaged that although the crime was perpetrated
    using a digital device as a means or target, the forensic investigation encompasses
    both physical and digital crime scenes hence the need to include them in the investigations.
    Replication in digital environment is relatively easier, making it easier to create
    a complete forensically sound image backup for analysis in the lab. Unlike many
    process models that focus primarily on the digital evidence, the interaction existing
    between the digital and physical environment is vividly highlighted in this model.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/149e5d898c819a550264bf1eab7b7354_50_0.png)


