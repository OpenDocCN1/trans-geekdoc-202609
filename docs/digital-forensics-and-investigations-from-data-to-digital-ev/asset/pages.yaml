  md: '# 2.4.4 Digital Crime Scene Investigation Phases


    The goal is to collect and analyze the digital evidence that was obtained from
    the physical investigation phase and through any other future means. It includes
    similar phases as the physical investigation phases, although the primary focus
    is on the digital evidence. The six phases are:


    +   (a) Preservation phase; which preserves the digital crime scene so that evidence
    can later be synchronized and analyzed for further evidence.


    +   (b) Survey phase: whereby the investigator transfers the relevant data from
    a venue out of physical or administrative control of the investigator to a controlled
    location.


    +   (c) Documentation phase; which involves properly documenting the digital evidence
    when it is found. This information is helpful in the presentation phase.


    +   (d) Search and collection phase; whereby an in-depth analysis of the digital
    evidence is performed. Software tools are used to reveal hidden, deleted, swapped,
    and corrupted files that were used including dates, duration, log file, etc. Low-level
    timelineing is performed to trace a user’s activities and identity.


    +   (e) Reconstruction phase; which includes putting the pieces of a digital puzzle
    together and developing investigative hypotheses.


    +   (f) Presentation phase; that involves presenting the digital evidence that
    was found to the physical investigative team.


    # 2.4.5 Review Phase


