  md: 'should be noted as they are not common in other forms of digital forensics.

    Some of the prominent challenges are described below.


    #  7.8.1 Connection of events to an actual person


    It is important to remember that linking events to an actual person is a concern

    for all digital investigations, and especially with computer intrusions.

    Tracing events to a specific computer system is not sufficient to claim that

    a specific person was using that computer system during the time of those

    events and that that same person was responsible for the observed events.


    #  7.8.2 Vulnerability of Compromised Systems


    A common challenge that arises during intrusion investigations is the need

    to protect the target systems against further attack. Digital investigators may

    even be asked to remove a backdoor and repair the target system before

    they have collected evidence from the system. Whenever possible, evidence

    should be preserved prior to repairing the target system or altering its state
    in

    any other way. It is usually feasible to protect the target system by isolating

    it on the network while it is being processed as a source of evidence. In some

    cases, it may be viable to isolate a system by unplugging its network

    cable. However, when the system is a critical component of a network,

    mmay be necessary to involve network administrators to reconfigure a router

    or firewall, partially isolating the system but permitting vital connections to

    enable an organization to remain in operation.


    #  7.8.3 Monitoring the Progress of An Attacker


    In many forms of criminal investigations, it can be beneficial for digital

    investigators to observe the suspect in the act of committing a crime. This

    will allow the digital investigator to gather additional information that can

    be used to identify and prosecute that. This is also true for intrusion

    investigations, for multiple reasons: (a) Computer intrusions can be

    extremely complex, especially those that extend across an enterprise

    network. Further observation may be necessary to determine the true scope

    of the incident. (b) Some intruders are skilled in hiding or erasing the traces

    of their activities. If they are not observed in action, there may not be enough

    evidence left behind to pursue investigative goals. (c) Many organizations are

    ot architected and configured to retain the types of electronic records (log

    files, for example) that would enable an effective postmortem investigation.

    Therefore, observation of current events is much more critical. The problem'
