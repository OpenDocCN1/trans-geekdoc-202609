    it may not be necessary to produce at trial every individual who handled the evidence,
    it is best to keep the number to a minimum and maintain documentation to demonstrate
    that digital evidence has not been altered since it was collected. Without a solid
    chain of custody, it could be argued that the evidence was handled improperly
    and may have been altered or exchanged with implicating evidence or contaminated
    in some other fashion. Potential costs of breaking the chain of custody include
    misidentification of evidence, adulteration of evidence, and loss of evidence
    or pertinent elements.'
