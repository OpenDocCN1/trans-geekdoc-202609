    This chapter is an attempt to provide a glimpse into cyberspace in society. Each
    section covers content that is considered illegal, including child pornography,
    hate speech/xenophobic material, and cyber terrorism. Case studies are given for
    each subsection except cyber terrorism. Also, legal measures sanctioned by international
    organizations are highlighted.


    # 10.1 CHILD PORNOGRAPHY


    Child pornography is a form of child sexual exploitation. Federal law defines
    child pornography as any visual depiction of sexually explicit conduct involving
    a minor (persons less than 18 years old). Images of child pornography are also
    referred to as sexual abuse images. Federal law prohibits the production, distribution,
    importation, reception, or possession of any image of child pornography. A violation
    of federal pornography laws is a serious crime, and convicted offenders face severe
    statutory penalties.


    The treatment of children as sexual objects has existed through the ages, and
    so has the production of erotic literature and drawings involving children. However,
    pornography in the modern sense began with the invention of the camera in the
    early 19th century. Almost immediately, sexualized images involving children were
    produced, traded, and collected. Even so, child pornography remained a restricted
    activity through most of the 20th century. Images were usually locally produced,
    of poor quality, expensive, and difficult to obtain. The relaxation of censorship
    standards in the 1960s led to an increase in the availability of child pornography,
    and, by 1977, some 250 child pornography magazines were circulating in the United
    States, many imported from Europe. Despite concern about the extent of child pornography,
    law enforcement agencies had considerable success in stemming the trafficking
    of these traditional hard copy forms. However, the advent of the Internet in the
    1980s dramatically changed the scale and nature of the child pornography problem
    and has required new approaches to investigation and control.'
