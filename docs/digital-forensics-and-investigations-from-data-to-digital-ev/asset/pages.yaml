    pooling” concept associated with cloud computing and their very own size, in the
    meantime addressing the concerns on data security, corporate governance, government
    regulation, performance, and reliability issues associated with public clouds
    today. Critics of private clouds point out that these corporations “still have
    to buy, and manage clouds” and as do not benefit from lower up-front capital costs
    and less hands-on management, essentially “lacking the economic model that makes
