    # 1.2 THE ORIGIN OF THE DIGITAL FORENSICS AND EVIDENCE


    The origin of digital forensics can be traced back to the 1970s when investigators
    in the military began to delve into cybercrimes and needed detailed technical
    approaches to solve these issues. Many institutions now include computer forensics
    course in their programs to effectively lecture students on its development and
    influence on individuals and the society in general. The adoption of this recently
    introduced professional innovation began in the United States when government
    agencies realized they need to employ investigative measures in solving criminal
    operations related to high-tech gadgets. The launch of Federal Bureau Investigation
    (FBI) Magnetic Media in 1984 was what prompted the introduction of computer forensics
    into the system. This program was later renamed as Computer Analysis and Response
    Team (CART).


    Subsequently, the International Organization on Computer Evidence (IOCE) was created
    in 1995. From the mid-1990s to this time, the field of computer forensics has
    developed beyond imagination; hence, law enforcement agencies have taken as point
    of duty to train their workforce in the field of cybercrime in order to detect
    Internet criminals. 1984 FBI Magnetic Media Program created... this later comes
    the CART 1993 First International Conference on Computer Evidence 1995 International
    Organization on Computer Evidence (IOCE) formed 1997 The G-8 countries declared
    that “Law enforcement personnel must be trained and equipped to address high-tech
    crimes” in the Moscow Communiqué of December. 1998 In March G8 appointed IICE
    to create international principles for the processes relating to digital evidence
    1998 INTERPOL Forensic Science Symposium 1999 FBI CART case load exceeds 2000
    cases, examining 17 terabytes of data 2000 First FBI Regional Computer Forensic
    Laboratory established 2003 FBI CART case load exceeds 6500 cases, examining 782
    terabytes of data'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Introduction to Digital Forensics


    ![](img/149e5d898c819a550264bf1eab7b7354_26_0.png)


    **Figure 1.1:** Digital evidence tools. Source: https://www.tcea.org/blog/when-people-fail-technology/.


    Digital or electronic evidence is any probative information stored or conveyed
    in digital form that may be used at trial by a court. A court will prove digital
    evidence is acceptable or relevant for the purpose for which it is meant. In the
    United States, many courts have applied Federal Rules of Evidence to digital evidence
    in a conventional manner although major differences such as the absence of customary
    standards and guidelines have been observed. Furthermore, digital evidence seems
    to be bulky, easily altered or copied and readily obtainable. As a result, some
    courts occasionally used digital evidence in a different way for the purposes
    of validation, hearsay, the best evidence rule, and privilege. In December 2006,
    the Federal Rules of Civil Procedure legislated for rules that required the protection
    and disclosure of digitally stored evidence. Digital evidence is often condemned
    for its genuineness because of its tendency to be altered, although courts are
    now prevailing over this argument without proof of tampering.


    # 1.2.1 Types of Digital Evidence


    There are two basic types of data in digital forensics, namely persistent and
    volatile data. Persistent data is the form of data stored on local hard drive
    and it is retained when the computer is turned off volatile data is the form of
    data that is stored in registries, cache, and RAM. There is tendency to lose volatile
    data when the computer is switched off or loses power because it is transient
    and an investigator needs to know the best'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 6 Digital Forensics and Investigation: From Data to Digital Evidence


    way to recover data that may be vital for the identification and analysis of a
    security incident. However, Bates (2002) classified information sources into four
    types, namely temporary, volatile, semipermanent, and permanent.


    # 1.2.2 Sources of Digital Evidence


    Forensic investigators must identify the appropriate source of evidence to seize
    at a crime scene. Desktop computers now have enough disk storage space that is
    even too large to print. If too much of data is acquired, muddle up the whole
    analysis and justice may also exceed the status of their search warrant. The U.S.
    Department of Justice described this situation in a journal.


    ...computer hardware, software, and electronic files may be important to a criminal
    investigation in two distinct ways: (1) the objects themselves may be contraband,
    evidence, instrumentalities, or fruits of crime and/ (2) the objects may be used
    as storage devices that contain contraband, evidence, instrumentalities, or fruits
    of crime in the form of electronic data. Rule 41 of the Federal Rules of Criminal
    Procedure permits the government to search for and seize computer hardware, software,
