- pgno: 201
  md: '# 180 Digital Forensics and Investigation: From Data to Digital Evidence


    with continued observation comes into play when the attacker or may be causing
    damage to the target information systems, the organization or individual who owns
    the information systems or who is reflected in the data that reside on those information
    systems. For example, an attacker may be actively removing sensitive data from
    a compromised system.


    # 7.8.4 Response to Threat


    A common problem for organizations that implement IDS is they lack an appropriate
    incident response capability. Identifying a problem is half the battle, knowing
    how to respond appropriately and having the resources in place to do so is equally
    important. Effective incident response requires skilled security personnel with
    the knowledge of how to swiftly remediate threats, as well as robust procedures
    to address issues without impacting day-to-day operations. In many organizations
    there is a disconnect between the people charged with monitoring alerts and those
    managing infrastructure, meaning that swift remediation can be difficult to achieve.


    # 7.8.5 Management and Analysis of Malicious Code


    In computer intrusions, more so than in other cyberimes, digital investigators
    have to deal with unknown and/or malicious computer programs that are specifically
    related to events of interest. This means that, as opposed to there being spyware
    on a suspect''s computer that is unrelated to the actual crime which the suspect
    has been charged, there is malicious code in play that was specifically used to
    perpetrate the crime under investigation. A digital investigator will find some
    form of malicious computer program on the majority of compromised systems that
    he/she investigates. Furthermore, in order to successfully complete the investigation,
    the digital investigator will often need to analyze the malicious programs to
    learn more about what they do and how they operate. Analyzing malicious code to
    determine the answers to questions as these often requires a deep understanding
    of computer programs, including the ability to read and interpret a disassembled
    or decompiled executable, as well as the ability to identify and circumvent defenses
    built into the code against disassembly and debugging.'
