    # 2.9.1 EnCase


    EnCase is a forensic software that is established by the Guidance Software. It
    is a 1-megabyte program written in C++. It has a number of products in its collection
    which includes EnCase cybersecurity, Encase portable, EnCase forensics, and EnCaseDiscovery.
    Over 2000 law enforcement agencies use the tool globally. It can be used for range
    of purposes including analysis, reporting, and acquisition of evidence. The software
    also has EnScript a scripting facility that is used in conjunction with the evidence.
    EnCase enables the investigators to identify, search, and scrutinize evidence
    in order to decide whether there is a need for additional investigation is required
    or not; this saves a lot of time and decreases backlog. The tool collects evidence
    from the file systems, mobile devices, and operating systems as well and ensures
    that there is no absence of evidence in any case.


    The investigators place the hard drive of the person in question on the forensic
    computer; it can be from any operating system like Windows, Linux, or DOS machine.
    EnCase makes bit mirror image of the drive, which is mounted read only so that
    it cannot be altered by any individual. To confirm that it is the same as original,
    En computes MD5 hash value and redundancy checksums. The tool restores the file
    assembly/system of the drive and inspects the drive through a Windows GUI. EnCase
    goes deep into the operating system while doing so, in unassigned space or in
    windows swap files, where deleted files can be preserved.


    # 2.9.2 Forensic Toolkit


    FTK is a digital forensic software made by AccessData. It scans and examines the
    hard drive for any data that the examiner needs such deleted emails or scan for
    text string to use them as potential passwords to crack any encryption. The toolkit
    has a simple but concise disk imaging program known as the FTP Imager. The FTP
    Imager keeps the image of the hard disk in a file or in segments which can be
    reassembled whenever needed. The FTK is simple to use and is driven by database,
    that is, all the data is stacked in one case database which amplifies the reusability
    and lowers the cost and intricacy. Any facility that is related to memory-based
    tools is not encountered in FTK. It is a high-speed tool that is invented to give
    precise, fast, and consistent processing with multithreaded support and'
  merge: -1
