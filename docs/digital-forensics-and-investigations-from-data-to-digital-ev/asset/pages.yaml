  img_proc: true
- pgno: 232
  md: '# Cyberstalking 211


    a synopsis of the problem, its causes and consequences, and global case studies.
    Although cyberstalking usually involves one person pursuing another, this is not
    always the case. As the behavior has developed, it has come to include such acts
    as stock market fraud, sexual harassment, data theft, impersonation, identity
    theft, consumer fraud, computer monitoring, and attacks by political groups on
    government services. At an alarming rate, pornographers and pedophiles have begun
    to use cyberstalking as a way of tracking down new victims. While cyberstalking
    has become a global problem, most emanates from the United States, making Americans
    the most vulnerable group of targets.


    The California Penal code (1998) included electronic communications in their anti-stalking
    law. The important sections of the California Penal Code have strongly influenced
    all subsequent anti-stalking laws in the United States, clearly defining stalking
    and related terms.


    Cyberstalking is one among the cybercrime. Cyberstalking in a way is the use of
    the Internet to stalk someone—a kind of harassment targeted at computer users.
    The term is used interchangeably with online harassment and online abuse. A cyberstalked
    does not present a direct physical threat to a victim but follows the victim’s
    online activity to obtain information, makes threats in different forms of verbal
    intimidation. The anonymity of online interaction reduces the chance of identification
    and makes cyberstalking more common than physical stalking. Though cyberstalking
    might seem relatively harmless, it can cause psychological and emotional harm.
    It may occasionally lead to actual stalking. Cyberstalking in the contemporary
    information society is becoming a prevalent shame in racism, and other expressions
    of bigotry and hate.


    Any person who willfully, maliciously, and repeatedly follows or harasses another
    person and makes a credible threat with the intent to place that person in reasonable
    fear of death or bodily injury is guilty of the crime of stalking “harasses” means
    a knowing and willful course of conduct directed at a specific person that seriously
    alarms, annoys, torments, or terizes the person, and serves no legitimate purpose.
    This course of conduct must be such as would cause a reasonable person to suffer
    substantial emotional distress, and must actually cause substantial emotional
    distress to the person.


    (California Penal Code 646.9)'
