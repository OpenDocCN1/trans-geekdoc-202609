    # 9.7.2 Email


    Research findings indicate that a cyberstalker uses email messages more than any
    other means of electronic communication to harass and intimidate victims (Peticelli,
    2005). Emails allow offenders to send successive harassment, threatening, hateful
    email messages with vile images, video or audio. In some cases, cyberstalkers
    have used victims'' email addresses and other personal information for subscription
    or purchase of books, magazines, or other Internet services without the knowledge
    or consent of the victims. Unfortunately, there are a number of websites that
    allow users to create emails applying minimum personal information for free. Although
    the site asks for user-identifying information, it rarely confirms the authenticity
    of the personal data provided. This makes the efforts of law enforcement much
    more difficult. Moreover, some email servers intentionally remove identifying
    information for a little fee and make it extremely difficult for law enforcement
    to track intruders. Many cyberstalkers join such services or use money orders
    or other forms of payment to prevent being identified. An intelligent cyberstalker
    frequently uses computer software such an offender is likely to use anonymous
    emails that are mostly impossible to track (Reno, 1999). The invention of spyware
    has allowed stalkers to purchase programs with low prices. Such software programs
    are specifically designed to inform the offenders from when the victims are online
