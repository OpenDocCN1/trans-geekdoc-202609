- pgno: 171
  md: '# 6.6.3 Preparation Phase


    Within the Identification phase of the process, the examiner has already been
    involved in significant preparation for the examination of the phone. However,
    the preparation phase involves particular research regarding the phone in question,
    the proper tools to be used during the examination and preparation of the examination
    machine to ensure that all of the necessary equipment, cables, software, and drivers
    are in place for the examination. Once the make and model of the phone have been
    identified, the examiner can then research the specific phone to determine what
    available tools are capable of extracting the data data the phone. Resources such
    as phonescop.com and mobileforensicscentral.com can be invaluable in identifying
    information about cellular phones and what tools will work to extract and document
    the data from specific phones. The SEARCH toolbar (available as a free download
    from search.org) contains additional and regularly updated resources for cellular
    phone examinations. Other resources that should not be overlooked are cellular
    phone manufacturer''s and cell phone carrier''s websites. They can contain links
    to electronic versions of manuals for almost every make and model of phone as
    well as cable and phone driver downloads. Manufacturers will sometimes provide
    free software for users to access and synchronize the data on their phones with
    their computers. These tools are not designed specifically for extraction and
    documentation of evidence, they may be useful when other tools do not work. Caution
    should be used when utilizing these tools, as they are generally designed to access
    and write data back to a cellular phone.


    # 6.6.4 Isolation Phase


    Cellular phones are by design intended to communicate via cell phone networks.
    They are also sometimes capable of connecting to each other and to other networks
    via Bluetooth, infrared, and wireless (Wi-Fi) network capabilities. For this reason,
    isolation of the phone from these communication sources is important prior to
    the examination. Isolation of the phone prevents the addition of new data to the
    phone through incoming calls and text messages as well as the potential destruction
    of data through a kill signal or accidental overwriting of existing data as new
    calls and text messages come in. Isolation also prevents overreaching of the legal
    authority of warrant or consent that covers data on the phone. If the phone is
    isolated from the network, the examiner cannot accidentally access voicemail,
    email,'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Internet browsing history or other data that may be stored on the service provider’s
    network rather than on the legality of the phone itself. Isolation of a cellular
    phone in the field can be accomplished through the use of Faraday bags or radio
    frequency shielding cloths which are specifically designed for this purpose. Other
    available items such as arson cans or layers of tinfoil may also be used to isolate
    cellular phones. One problem with these isolation methods however is that once
    they are employed, it is difficult or impossible to work with the phone as you
    cannot see through them or work with the phone’s keypad through. Faraday tents,
    rooms, and enclosures exist, Additionally, laboratories within the US federal
    government may use signal jamming devices to curtail radio signals from being
    sent or received for a given area. The use of such devices is illegal for many
    organizations and their use should only be implemented after verifying the legality
    of the use of such devices for a given organization. Additional information about
    the FCC exceptions can be found at www.fcc.org. Another viable option is to wrap
    the cellular phone in radio frequency shielding cloth and to place the phone into
    airplane mode (also known as standalone, radio off, standby, or phone off mode).
    Instructions for how to place a phone into Airplane mode can be found in the manufacturer’s
    user manual for the particular make and model of cellular phone. Unfortunately,
    not all phones have an airplane mode, and sometimes even the most seemingly foolproof
    isolation methods can fail.


    # 6.6.5 Processing Phase


    Once the phone has been isolated from the cell phone and other communication networks,
    the actual processing of the phone may begin. The appropriate tools to achieve
    the goal of the examination have been identified in the steps described previously,
    and they can now ideally be used to extract the desired data from the phone. Accessing
    data stored on these cards through use or processing of the cellular phone may
    alter data on the data storage card thus any installed data/memory cards should
    be removed from the cellular phone and processed separately using traditional
    computer forensics methods to ensure that date and time information for files
    stored on the data storage/memory card are not altered during the examination.
    Similarly, SIM cards should be processed separately from the cellular phone they
    are installed in to preserve the integrity of the data contained on the SIM card.
    Consideration should be given to the software and hardware tools used during the
    examination of the cellular phone. There are advantages to'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 152 Digital Forensics Investigation: From Data to Digital Evidence


    consistency in order of tools used during examination of a cellular phone. This
    consistency may help the examiner to remember the order of tools used in the examination
    at a later time.


    # 6.6.6 Verification Phase


    After processing the phone, it is imperative that the examiner engages in some
    sort of verification of the accuracy of the data extracted from the phone. Unfortunately,
    it is not unusual for cellular phone tools to erroneously or incompletely report
    data or have different tools report conflicting information. Verification of extracted
    data can be achieved in several ways. (1) Comparison of Extracted Data to the
    Handset Comparison of the extracted data to the handset simply means checking
    to be sure the data which was extracted from the cellular phone matches the data
    displayed by the phone itself. This is the only authoritative way to ensure that
    the tools are reporting the phone information correctly. (2) Use of More than
    One Tool, Another way to ensure the accuracy of extracted data is to use more
    than one tool to extract data from the cell phone and to verify the results by
    comparing the data reported from tool to tool. If there are inconsistencies, the
    examiner should use other means to verify the accuracy of the data extracted from
    the phone. Even if two tools report information consistently, verification via
    manual inspection of the handset is authoritative. (3) Use of Hash Values If file
    system extraction is supported, traditional forensic tools can be used for verification
    of extracted data in several ways. The forensic examiner can extract the file
    system of the cell phone initially, and then hash the extracted files. Any individually
    extracted files can then be hashed and checked against the originals to verify
    the integrity of individual files. Alternatively, the examiner could extract the
    file system of the cell phone initially, perform the examination and extract the
    file system of the phone a second time. The two file system extractions can then
    be hashed and the hash values compared to see what on the phone, if any, has been
    altered during the examination process. Any changed files should be examined to
    determine if there are system files or user files to potentially determine the
    reason for the changes to the files. It should be noted that hashing only validates
    the data as it exists after it has left the phone. Cases where the data extraction
    process actually modifies data have been documented in other papers. In some cases,
    a combination of verification techniques may be employed to validate the integrity
    of the data extracted from the phone.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 6.6.7 Documentation and Reporting Phase


    Documentation of the examination should occur throughout the process in in the
    form of contemporaneous notes regarding what was done during the examination.
    Examination worksheets can be helpful in the examination process to ensure that
    basic information is recorded. The examiner’s notes and documentation should include
    information as: (a) The date and time the examination was started (b) The physical
    condition of the phone (c) Pictures of the phone and individual components (e.g.,
    SIM card and memory expansion card) and the label with identifying information
    (d) The status of the phone when received (off or on) (e) Make, model, and identifying
    information (f) Tools were used during the examination (g) What data was documented
    during the examination. Most cellular phone tools include reporting functions,
    but these may not be sufficient for documentation needs. At times, the cellular
    phone tools may report inaccurate information as the wrong ESN, MIN/MDN numbers,
    model, or erroneous date and time, and so care must be taken to document the correct
    information after data verification. For law enforcement purposes, the process
    used to extract data from the phone, the kinds of data extracted and documented
    any pertinent findings should be accurately documented in reports. Even if the
    examiner is successful in extracting the desired data using available tools, additional
    documentation of the information through photographs may be useful, especially
    for court presentation purposes.


    # 6.6.8 Presentation Phase


    Consideration should be given throughout the examination as to how the information
    extracted and documented can be clearly presented to another investigator, prosecutor
    and to a court. In many cases, the receiver may prefer to have the extracted data
    in both paper and electronic format so that all history or other data can be sorted
    or imported into other software for further analysis. The investigator may also
    want to provide reference information regarding the source of data and time information,
    EXIF data extracted from images or other data formats, in order that recipients
    of the data are better able to understand the information. For court purposes,
    pictures or video of the data as it exists on the cellular phone may be useful
    or compelling as exhibits. Extracted text messages may be great evidence, but
    pictures of the same text messages may be more familiar and visually compelling
    to a jury. It is often very useful to present a series of pictures of text messages
    and call history logs in chronological order via a simple PowerPoint presentation
    so'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    that the progression of communications is shown clearly to the audience, whether
    the audience is an investigator, prosecutor, or jury. This is especially effective
    if there are a number of cellular phones involved in a case.


    # 6.6.9 Archiving Phase


    Preservation of the data extracted and documented from the cellular phone is an
    important part of the overall process. It is necessary to retain the data in a
    usable format for the ongoing court process, future reference, and for record
    keeping requirements. Some cases may endure for many years before a final resolution,
    and most jurisdictions require that data be for varying lengths of time for the
    purposes of appeals. Due to the proprietary nature of the various tools on the
    market for the extraction and documentation of cell phone data, consideration
    should be given to the ability to access saved data at a later date. Store data
    in both proprietary and non-proprietary formats on standard media so that the
    data can be accessed later in the event that the original software tool is no
    longer available. It may also be a good practice to retain a copy of the tool
    itself to facilitate the viewing of the data at a later date.


    # 6.7 CHALLENGES OF MOBILE FORENSICS


    Knowing the importance of the forensics of mobile phone devices, it is essential
    to understand the current known challenges facing investigators. Here are some
    of the challenges militating against mobile forensics.


    # 6.7.1 Carriers and Manufacturers


    In an investigation of a mobile phone, the first action must be the identification
    of the phone. Given that there are multiple network carriers (at least seventeen
    in the US alone) and device manufacturers (over 30 in the United States), identifying
    a phone by sight alone is extremely difficult even for trained investigators.
    A given model from a single hardware manufacturer may be marketed using many different
    names from the various carriers. A good example of this is the recently popular
    Motorola RAZR which is marketed under least 24 different product names. It is
    not until an investigator removes the device’s battery that the true hardware
    model can be determined, but removing batteries can cause the phone to lose the
    information stored in volatile memory, or even worse, force a handset lock code
    on power up.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 6.7.2 Data Preservation


    For a mobile phone investigation, it is important to prevent the device from receiving
    any further data or voice communication. As text messages are stored in a "First
    In, First Out" order, any new incoming text messages could delete older stored
    text messages. Likewise, incoming calls could erase history logs, and some devices
    (such as the RIM Blackberry) can be wiped of all data remotely if not protected
    from incoming communications. Therefore, upon initial acquisition, these mobile
    phones must be placed in some sort of wireless preservation container. Multiple
    technologies can be used for this with various levels of success. These tools
    range from three layers of common aluminum foil to a tri-weave mesh shield of
    nickel, silver, and copper, to an anodized aluminum shielded enclosure made to
    withstand wireless devices from radio frequencies.


    # 6.7.3 Power and Data Connectors


    Another challenge facing investigators is how to preserve power to the phone.
    If left unplugged for a long enough period of time, a phone’s battery will eventually
    lose all power. Because many mobile phones store information in volatile memory,
    a complete loss of power may mean a loss of information, thus a loss of crucial
    evidence. Therefore, it is desirable to keep a phone in a charging state. Frustratingly,
    there currently is no standard for power requirements for mobile phones. This
    lack of power standards is compounded by the fact that there is also no standard
    for cable connectors. There are literally hundreds of different mobile phone power
    connectors currently in use. So if two phones use the same voltage to remain charged,
    they likely will not have compatible power connectors.


    # 6.7.4 Operating Systems and Communication Protocol


    Another challenge impeding the development of forensics tools is the various operating
    systems used on mobile phones. Mobile phones have evolved into full-fledged platforms
    requiring vendors to use sophisticated operating systems so that various software
    applications can be run on them. Several of the common operating systems include
    RIM’s Blackberry, IDEN, Palm, Symbian, Windows Mobile, Macintosh OS X, and various
    versions of the Linux open-source operating system. Some operating systems are
    also proprietary to the hardware manufacturer. For example, Nokia is the ISA platform
    for the Series 30 and 40 phones.'
  merge: -1
  img_proc: true
