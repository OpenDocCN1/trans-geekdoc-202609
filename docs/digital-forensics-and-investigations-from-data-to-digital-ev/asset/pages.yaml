  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    responsible for evidence recovered during an interview may feel compelled to admit
    their guilt. This challenge has always existed and is an essential element of
    most “traditional” examinations of digital evidence. In the context of the CFFTPM,
    the challenge is not only to do this quickly also to expeditiously determine if
    it can even done within the time constraints (In some cases, the specifics of
    the evidence can obviate the need for evaluation, for example, when contraband
    files are found only in a specific user''s home directory). A thorough knowledge
    of user profiles and artifacts relating to usage is essential to accomplishing
    this goal.


    # 2.5.3 Home Directory


    In Microsoft Windows operating systems, the most obvious user-related artifact
    is the “Home Directory.” By default, the home directory is only accessible by
    the associated user account. Also by default, the location of stored files associated
    with various applications is set to a subfolder inside the home directory. The
    presence of incriminating files in the suspect''s home directory or one of its
    subfolders (including notables as “desktop” “my documents” and “favorites”) is
    a reliable indicator that only the suspect (or anyone who could log onto that
    account) had access to those files. Additionally, the creation of a subdirectory
    with unique subfolder names can go a long ways showing knowledge of and culpability
    for evidentiary objects found in the subdirectory structure


    # 2.5.4 Security Properties of Files


    It may be useful and time-efficient to check ownership and security properties
    of objects with known evidentiary value. The ability to set and read security
    permissions is not available in FAT, and is off by default in Windows XP, even
    when the NTFS file system is used. When NTFS is used, and the feature turned on,
    a file’s security properties, most notably “owner” and “permissions,” may be useful
    in establishing which account had access to or even created that particular file
    (National White Collar Crime Center, 2003). When a file is created, the user account
    logged on is recorded as the “owner” as part of the file’s security descriptor.
    (This can be changed only if an Administrator “takes ownership” of the file, in
    which case the Administrator is recorded as the owner).'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Digital Forensic Models 37


    Permissions may also be limited of usefulness in establishing culpability. Only
    those accounts with the permission to do so may access an object; however, this
    can be one or more user accounts and the accounts that have permission to the
    object may change over time. An account that had “read” access on the 25th of
    February might not have had that same access on the 24th.


    # 2.5.5 Registry


    The registry can be a trap, causing the needless expenditure of valuable time,
    if the examiner does not have a precise idea of what they are looking for and
    exactly where where to go to find it. On the other hand, a knowledgeable examiner
    with a clear vision of what information they want to recover can find several
    highly valuable items in less than a few minutes. For example, the HKEY_USERS\suspect’s
    SID\Software\Microsoft\Windows


    # 2.5.6 Chronology


    The chronological scope of the investigation can be defined by the case instance.
    In an investigation, digital evidence is defined by its temporal value, known
    as MAC times (Casey, 2004). Without going into a detailed narrative of the MAC
    times specifically to each OS, the following are some general guidelines for Windows
    MAC Times. Windows MAC times are defined in the FAT32 and NTFS file systems as:


    +   (a) Modification is defined by when a file contents have been changed.


    +   (b) Access time is defined when a file was viewed.


    +   (c) Created time is defined when a file was created.


    Although MAC times appear simple, it is well-documented that there are many inconsistencies
    with MAC times and there are many other weaknesses when describing another specific
    operating systems, such as those used on personal digital technologies devices
    (e.g., PDAs, Cellphones, MP3 players). Once an investigator gains access to the
    files in question and their individual MAC times, they can start to qualify their
    searches, thus quantifying their evidence (Casey, 2004). For the CFFTP, several
    quantifications should be examined by sorting the files on their various MAC times
    within the chronological scope of the investigation. The first such quantification
    includes the time periods of normal use by the suspect and other known users of
    the computer or device (Casey, 2004; Farmer &'
  merge: -1
