    # 5.1 Software as a Service


    Customers rent readymade applications running in the cloud service provider (CSP)
    premises: office productivity, customer relationship management, sales, business
    intelligence and many more. Access can be granted from a variety of client devices
    or by means of a program interface. Users are offloaded from any management task
    and are thus able to focus on their core business, but conversely there is little
    or no capacity to influence key features or data transfer stored. The SaaS software
    provider has complete control of application software. SaaS application examples
    include online mail, project-management systems, CRMs, and social media platforms.
    Salesforce is just an example of SaaS. Software as a Service Software-as-a-Service
    (SaaS) is based on licensing software use on demand, which is already installed
    and running on a cloud platform. These on-demand applications have been developed
    and deployed on the PaaS or IaaS layer of a cloud platform. SaaS replaces traditional
    software usage with a Subscribe/Rent model, reducing the user’s physical equipment
    deployment and management costs. The SaaS clouds may also allow users to compose
    existing services to meet their requirements. This section presents SaaS clouds
    and applications.'
