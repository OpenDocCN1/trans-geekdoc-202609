- pgno: 69
  md: 'distributed processing. The FTK estimates the hash value which is given by
    the MD5 hash algorithm to confirm the integrity of the achieved data before discarding
    any file. It gives the product in the form of an image file(s) which can be saved
    in several formats.


    # 2.9.3 Network Mapper


    NMAP is an acronym for Network Mapper and it is a free and open source forensic
    tool written by Gordon Lyon. It is used for security auditing and discovering
    services and hosts on a network thus giving us a “map” of the network; also many
    network administrators and systems use it for routine tasks like monitoring service
    or host uptime and managing service upgrades as well. Although it was originally
    created for large networks, it works effectively against a single host as well.
    NMAP started as Linux-only utility but works on all operating systems like Linux,
    Windows, Solaris, AmigaOS, and Mac and has official binary packages for them.
    It can adjust to any network condition like latency and congestion while the scan
    is portable, simple, powerful, flexible, and well documented. The tool uses specially
    crafted IP packets and directs it to the targeted host(s) to know what host and
    services are available on the network, reverse DNS names, and what type of firewall
    is in use, operating system detection, MAC address, and much more. Additionally,
    NMAP offers a debugging tool (Ncat, a GUI version (Zenmap), and more. The NMAP
    generated a result which includes “interesting port table,” including information
    like the service name, port number, protocol, etc. The state can be open, closed,
    filtered, or unfiltered. Open means that the target machine has an application
    that is listening for packets on that port. Closed means “that no application
    is listening on them.”ed means that NMAP cannot convey the right message as to
    whether a port is open or closed because it is being blocked by any network obstacle
    or firewall. Unfiltered is a state when the NMAP is indeterminate about the state.
    NMAP conceals itself from the source workstation so that the system is not notified
    by thinking it is a malware attack.'
