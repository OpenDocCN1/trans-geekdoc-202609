    An attacker can use covert channels to transmit sensitive documents unobstructed—in
    this case, bypassing network security measures rather than bypassing security
    guards. And just as a spy can use that secret compartment to conceal a weapon
    from security guards when entering a secure facility, an attacker can use an Internet
    covert channel to conceal a cyberweapon, for example, a download of malware from
    an external server onto a host within an organization’s private network.


    # 1.5.4 Data Hiding in Storage Space


    Attackers hide some data inside storage areas and make them obscure the usual
    system commands and programs. It makes the investigation more complicated and
    more time consuming and sometimes data can be corrupted too. Rootkit is one of
    the most popular techniques used to hide data in storage'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Introduction to Digital Forensics 21


    space. According to Microsoft (2014), malware designers use rootkits to hide malware
    inside victims'' computers. It is very hard to identify rootkits and most computer
    users do not know how to remove them. User mode rootkits are capable of hiding
    processes, files, system drivers, network ports, and even system services (Kassner,
    2008).


    # ### 1.5.5 Residual data wiping


    When the attacker uses a computer for his objective, a few hidden processes (e.g.,
    temporary files, history of commands) are running without the knowledge of the
    attacker. But an intelligent attacker can avoid this risk by covering his tracks
    and wiping every trace that will make the system work as if it has not been used
    before.


    # ### 1.5.6 Tail Obfuscation


    The most common technique is the obfuscation of the source of the attack (Rekhis
    & Boudriga, 2010). Here, the attacker uses some false information in order to
    mislead the investigator (e.g., false email headers, and changing file extensions).
    Therefore, sometimes the investigator might lose some data that have forensic
    value. There are a few nuances to hard drives that enable a craftyy individual
    to conceal the presence of voluminous data on them. The first cylinder on a disk
    which is also known as the maintenance track is used to store information about
    the drive such as its geometry and the location of bad sectors. By deliberately
    marking portions of the disk as bad, an individual can hide data in these areas
    from the operating system.'
  merge: -1
  img_proc: true
