    # 3.8 HONEYPOTS AND HONEYNETS


    A Honeynet is a network specifically designed for the purpose of being

    compromised. A compromised Honeynet can be used to observe the activities

    and behavior of the intruder. A Honeynet allows to conduct a thorough

    analysis of the tools used by the intruders to identify the weaknesses

    exploited by the intruders to compromise the Honeypots. In general, a

    Honeypot could range from a simple port-listening socket program to a full

    production system that can be emulated over various operating systems.

    Sometimes, a Honeypot would pull traffic by acting as a decoy system by

    presenting itself to the Internet as a legal system offering services. The

    essential idea is that any traffic referred to Honeypot is known to be an attack

    or intrusion. Any connection initiated inbound to Honeypot is possible to be

    a scan, probe, or attack. Any outgoing connection from a Honeypot implies

    that someone has compromised the Honeypot and has commenced outbound

    operation. Hence, forensic analysis of the operations of a Honeypot is less

    expected to result in false negatives and false positives when compared

    to the more elusive and signature-dependent network intrusion detection'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'systems. Honeypots can help us to identify vulnerabilities that are vague or
    unseen before. Honeypots can be classified into two types depending on the configured
    services available for an attacker to compromise or probe the system: low-interaction
    and high-interaction Honeypots. A high-interaction Honeypot can be compromised
    completely. It gives an attacker the access to all facets of the operating system
    and privilege to launch more network attacks. The larger number of Honeypots installed,
    the more likely that one can efficiently get information about network attacks.
    For instance, most of the TCP connection requests are generated and sent to erratically
    selected IP addresses. TCP can recognize that prior to a connection, a TCP handshake
    is over and the load containing malicious contents is received. The more likely
    this happens, the more the number of Honeypots increases.


    A Honeynet normally utilizes a Honewall, which acts as a firewall to protect the
