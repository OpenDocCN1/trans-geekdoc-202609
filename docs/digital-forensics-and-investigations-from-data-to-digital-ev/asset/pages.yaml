  md: '# 2.4.3 Physical Crime Scene Investigation phases


    The goal of these phases is to collect and analyze the physical evidence and reconstruct
    the actions that took place during the incident. It includes six phases:


    +   (a) Preservation phase which seeks to preserve the crime scene so that evidence
    can be later identified and collected by personnel trained in digital evidence
    identification.


    +   (b) Survey phase which requires an investigator to walk through the crime
    scene and identify pieces of physical evidence.


    +   (c) Documentation phase which involves taking photographs, sketches, videos
    of the crime scene and the physical evidence. The goal is to capture as much information
    as possible so that the layout and important details of the crime scene are preserved
    and recorded.


    +   (d) Search and collection phase which entails a thorough search and collection
    of the scene is performed so that additional physical evidence is identified and
    hence paving for a digital crime investigation to begin.


    +   (e) Reconstruction phase which involves organizing the results from the analysis
    done and using them to develop a theory for the incident.


    +   (f) Presentation phase which presents the physical and digital evidence to
    a court or corporate management.


    ![](img/149e5d898c819a550264bf1eab7b7354_51_0.png)


    Figure 2.5: Physical Crime Scene Investigation phases.


    Source: https://www.researchgate.net/publication/220542528_Getting_Physical_with_the_Digital_Investigation_Process/figures?lo=1'
