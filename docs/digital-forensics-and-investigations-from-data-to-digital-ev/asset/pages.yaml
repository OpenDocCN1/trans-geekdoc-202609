  md: '# Digital Forensic Models 41


    rule, it is usually best to perform those tasks which can be accomplished most
    quickly first. The value of planning and pre-raid intelligence cannot be overemphasized.
    Reliable information on search terms, contacts, types of activities, applications
    used, etc. in advance of the search can allow the examiner to develop at least
    some search strategies before arrival on scene. Every minute saved in this manner
    is potentially another minute available to conduct the search itself.


