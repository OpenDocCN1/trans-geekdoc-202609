    # # 1.5.1 Encryption


    Encryption is process of scrambling information that can only be decoded and read
    by someone who has the correct decoding key. Encryption is used to hide or make
    the evidence unreadable on the compromised system. In 2007, an incident happened
    when the US Customs found child pornography on Canadian citizen and legal US resident
    Sebastian Boucher’s laptop (Balogh & Pandelic, 2011). The laptop was seized as
    evidence and he was charged with transporting the incriminating drive Z and found
    that it was a pretty good privacy encrypted container. Although a forensic duplicate
    of hard drive was created after shutdown of the notebook, the examiner could not
    open the encrypted container. Attackers use various encryption methods and in
    order to make the data usable, investigators have to decrypt the encrypted data.
    This process is tedious and time-wasting and sometimes the encrypted data cannot
    be decrypted.


    # # 1.5.2 Steganography


    Steganography is data that is concealed in plain sight. Steganography is a complementary
    technique that can be used with cryptography to encrypt data. Steganography techniques
    can be applied to images, a video file or an audio file. Typically, however, steganography
    is written in characters including hash marking, but its usage within images is
    also common. At any rate, steganography protects from pirating copyrighted materials
    as well as aiding in unauthorized viewing. Steganography also has an additional
    branch known as watermarking, which is a means of hiding data within a text document
    or any other type of copyright materials in order to mark that cover and prevent
    illegal duplication of the files.'
