    # ## 2.5.1 Planning


    The first phase in the CFTPM is proper planning. Ideally, a lead investigator
    will have a matrix that quantifies the various possibilities of the crime scene,
    the suspect, and the digital evidence qualifies the expertise of the various investigators
    on the investigation team. For the lead investigator, this matrix is used to define
    what is known and what is not known thus what is wanted to be known. Similar to
    a situation paragraph of a military operations order (OpOrd), this matrix identifies
    the "enemy" and "friendly" situations preventing preemptive case intelligence.
    In the OpOrd, the enemy is defined characteristically by collecting intelligence
    through the acronym SALUTE: strength, activity, location, uniform, time, and equipment.
    This same acronym can be used in gathering case intelligence about the enemy/suspect
    prior to arriving at the crime scene. Strength initially determines the suspect
    count and any other involved cohorts (specific numbers can be helpful), but could
    also include known or possible capabilities of the suspect. Activity defines the
    specific actions of the suspect (even details could later be important). Location
    is not only the physical location of the scene but also the virtual possibilities
    of cyberspace. Uniform relates more to the military, but in terms of cyberspace,
    it can include email addresses, uniform resource'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Digital Forensic Models 35


    locators (URLs), usernames, passwords, network domains, and other related deterministic
    mappings, symbols, or corporate or agency identifiers. Time obviously builds upon
    other previously gathered case intelligence providing the chronological scope
    for investigative searches. Finally, equipment covers the various types of wired
    and wireless hardware devices and software applications that can be expected when
    approaching the digital crime scene. Dependent on the case intelligence determined
    by the SALUTE, lead investigator will have many specific decisions to make prior
    to arriving at the crime scene. Once the enemy/suspect elements of the SALUTE
    matrix are determined, the lead investigator can then identify friendly information
    for attacking this crime scene. From the OpOrd, this section of the matrix includes
    the mission of the investigation, identification of the necessary personnel to
    provide the expertise for the investigation, and the knowledge of how to handle
    the unexpected. The mission of the investigation is normally determined by the
    type of crime committed in turn determining the level of investigation and the
    level of expertise necessary for the investigation. If the crime warrants expertise
    in multiple physical and virtual locations, multiple wired and wireless networks,
    multiple OS, personal digital technologies, or other specific technical needs,
    the investigator can plan accordingly. However, if there are unknowns in the investigation,
    it is imperative the lead investigator determines who else can be contacted to
    aid in the investigation. With this compiled situational case intelligence, both
    about the suspect and the investigative team, the lead investigator can then formulate
    a plan of attack for determining what evidence is to be sought after and used
    to further the investigation.


    # 2.5.2 Usage/User Profiles


    Once a system or storage media has been identified and prioritized during the
