    Source: http://www.rroij.com/open-access/survey-on-different-phases-of-digitalforensics-investigation-models.php?aid=53809


    # **2.4.1 Readiness Phases**


    The goal of this phase is to ensure that the operations and infrastructure are
    able to fully support an investigation. It includes two phases:


    +   (a) Operations readiness phase; that ensures that the underlying human capacity
    is fully trained and equipped to deal with an incident when it occurs.

    (b) Infrastructure readiness phase; that ensures the underlying infrastructure
    is sufficient enough to deal with incidents that come. For example, equipment
    such as video cameras and card readers being there and in good working condition.


    # **2.4.2 Deployment Phases**


    The purpose is to provide a mechanism for an incident to be detected and confirmed.
    It includes two phases:


    +   (a) Detection and notification phase; where the incident is detected and then
    appropriate people are notified.

    (b) Confirmation and authorization phase; which confirms the incident and obtains
    authorization for legal approval to carry out a search warrant.'
  merge: -1
  img_proc: true
