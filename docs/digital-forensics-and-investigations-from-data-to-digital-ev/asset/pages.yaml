- pgno: 179
  md: '158 Digital Forensics and Investigation: From Data to Digital Evidence


    A computer system should provide confidentiality, integrity, and assurance against
    denial of service, however, due to increased connectivity and more systems are
    subject to attack by intruders. Therefore, it is essential that the security mechanisms
    of a system are designed so to prevent unauthorized access to system resources
    and data. Intrusion detection (ID) takes over where preemptive security fails.
    It is designed to identify, and in some cases limits the occurrence and effect
    of intrusions into computer systems. Such intrusions are difficult to prevent
    by traditional access control techniques as they typically evade access control
    by exploiting flaws in the implementation. This chapter discusses ID, ID systems
    and methods of intrusive investigations. The last section elaborates on challenges
    involved in intrusive forensics.


    # 7.1 INTRODUCTION TO COMPUTER INTRUSIONS


    In the digital age, data on computer systems can have substantial value, and criminals
    have become dependent on computers. Organizations use computers to store all forms
    of information including medical and financial data. The exposure of such information
    can lead to financial loss, and integrity damage. For instance, over $10 million
    was embezzled from the Royal Bank of Scotland as a result of a violation of security
    measures. In 2008, the Heartland Payment Systems Company experienced a data breach
    that uncovered over 100 million credit card records. Individuals are also being
    targeted when they use their computers to make purchases conduct online banking
    and to store private data including tax documents and other business records as
    well as health information. The disclosure of such sensitive information can lead
    to financial loss and identity fraud. Criminals break into computers for a wide
    range of purposes, including stealing valuable information, eavesdropping on users''
    communications, harassing administrators or users, launching attacks against other
    systems, stealing toolkits and stolen data, and defacing websites. Some individuals
    view computer intrusions as victimless crimes. However, whatever a computer intruder
    pur proprietary information from an organization, steals an individual''s credit
    card or banking details, or deletes the contents of an individual''s hard drive,
    people are affected in a very real way. For instance, if computer intruder changes
    prescription information in a pharmacy database, interferes with critical systems
    at an airport, disables an emergency telephone service, or destroys other critical
    systems, the implications can be fatal. As another example,'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Computer Intrusions and Detection 159


    it can take victims of identity fraud many years to regain their financial strength.
    Computer intruders have been categorized as teenagers with social problems. Stereotypes
    of computer intruders are antisocial adolescents do not address the extensive
    range of criminals who gain unlawful access to computers. An increasing number
    of intrusions are committed by criminal organizations and state-sponsored groups.
    New techniques to interfere with and break into computers seem to be developed
    every day with changing degrees of sophistication. Although it takes a specific
    degree of skill to find new ways to execute these attacks, once a new method of
    attack is developed, it is often made available on the Internet. Programs that
    spontaneously exploit vulnerability are commonly called *exploits*, and many of
    them are generously available at sites like SecurityFocus. With a little knowledge
    of computer networks, almost anyone can obtain and use the required tools to be
    a nuisance by breaking into a computer and erasing its contents. It takes skill
    and experience, however, to break into a computer system, commit a crime, and
    conceal one''s tracks.


    # 7.2 STANDARD COMPUTER INTRUSION TACTICS


    A typical computer intrusion might follow the following steps:


    +   (a) Gather information about the target computer.

    (b) Probe the computer for vulnerabilities and attempt to exploit them.

    (c) Gain unauthorized access into the computer.

    (d) Escalate from an unprivileged account to privileged account.

    (e) Hide tracks and instantiate a persistent reentry.

    (f) Extend unauthorized access to other areas of the network.

    (g) Pursue the goal of intrusion (e.g., steal information or destroy data). While
    specific tactics and techniques have evolved overtime, this is a classic set of
    methods that can be followed within the phases of an attack, against a single
    computer.


    # 7.2.1 Direct Attack Methods


    There are a number of ways that intruders can acquire information about a computer
    that can be useful for launching an attack. Knowing the operating system and services
    that are running on a computer is often all that is required—because some services
    on certain operating systems are known'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    to be susceptible. Computer intruders may be able to guess passwords or exploit
    vulnerability in the remote system to gain unlawful remote access.


    # 7.2.2 Social Engineering


    When intruders cannot get through a system through known security holes, they
    use less technical methods to gain access. Intruders sometimes even dig garbage
    for valuable information. Intruders also try to get information using social engineering
    and reverse social engineering. Social engineering refers to any attempt to contact
    real users of the target system and trick them into giving out information that
    can give the intruder a clue of how to break into the system. For example, calling
    someone and pretending to be a new employee who does not understand the operations
    of the company can result in useful information like computer names, operating
    systems, and even some information about employee accounts. Alternatively, pretending
    to be a computer technician who is trying to fix a problem can also result in
    the acquisition of beneficial information. There are many ways to do this, including
    claiming to be looking into a problem or going into the organization to look around.
    Some people will even make the mistake of giving out their passwords. Reverse
    social engineering is any attempt by intruders to have someone in the target organization
    to contact them. Instead of “contacting” them, they contact the intruder. For
    example, sending a memo with a “new” technical support email can result in ample
    flow of information. The advantage of reverse social engineering is that the user
    is less likely to be suspicious and report the incident. When people seek help
    from an intruder who resolves their problems, they are less likely to be suspicious
    and are unlikely to have any reason to report the incident to anyone.


    # 7.3 EXISTING COMPUTER INTRUSION TACTICS


    Overtime, the preferred tactics of computer intruders have evolved. While direct
    attacks against Internet-facing systems and applications were once common, security
    measures have made this tactic more difficult. As a result, computer intruders
    have developed approaches to attacking client systems more indirectly through
    email or via the web browsers that visit a compromised web server.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 7.3.1 Phishing


    Phishing attacks typically rely on social networking techniques applied to email
    or other electronic communication methods, including direct messages sent over
    social networks, SMS text messages, and other instant messaging modes. Phishers
    may use social engineering and other public sources of information, including
    social networks like LinkedIn, Facebook and Twitter, to gather background information
    about the victim''s personal and work history, his interests, and his activities.
    Pre-phishing attack reconnaissance can uncover names, job titles, and email addresses
    of potential victims, as well as information about their colleagues and the names
    of key employees in their organizations. This information can then be used to
    craft a believable email. Targeted attacks, including those carried out by advanced
    persistent threat groups; typically begin with a phishing email containing a malicious
    link or attachment.


    ![](img/149e5d898c819a550264bf1eab7b7354_182_0.png)


    **Figure 7.1:** Phishing Scam message. Source: http://resources.infosecinstitute.com/category/enterprise/phishing/#ref


    # 7.3.1.1 Types of phishing


    As defenders continue to educate users in phishing defense and deploy anti-phishing
    strategies, cybercriminals continue to hone their skills at existing phishing
    attacks and roll new types of phishing scams. Some of the more common types of
    phishing attacks include the following: (a) Spear phishing attacks are directed
    at specific individuals or companies, usually using information specific to the
    victim that has been gathered to more successfully represent the message as being
    authentic. Spear phishing emails might include references to coworkers or executives
    at the victim’s'
  merge: -1
  img_proc: true
- pgno: 183
  md: '162

    n

    organization, as well as the use of the victim''s name, location or other personal
    information. Whaling attacks are a type of spear phishing attack that specifically
    targets senior executives within an organization, often with the objective of
    stealing large sums. Those preparing a spear phishing campaign research their
    victims, in detail, to create a more genuine message. Using information relevant
    or specific to a target increases the chances of the attack being successful.
    A typical whaling attack targets an employee with the ability to authorize payments,
    with the phishing messaging to be a command from an executive to authorize a large
    payment to a vendor when, in fact, the payment would be made to


    ![](img/149e5d898c819a550264bf1eab7b7354_183_0.png)


    **Figure 7.2:** Spear phishing attack model. Source: https://searchsecurity.tech-target.com/feature/Targeted-Cyber-Attacks


    (b) Pharming is a type of phishing that depends on DNS cache poisoning to redirect
    users from a legitimate site to a fraudulent one, and tricking users into using
    their login credentials to attempt to log in to the fraudulent site. (c) Clone
    phishing attacks use previously delivered, legitimate emails that contain either
    a link or an attachment. Attackers make a copy or clone of the legitimate email,
    replacing one or more attached files with malicious links or malware attacks.
    Because the message appears to be a duplicate of the original, legitimate email,
    victims can be tricked into clicking the malicious link or opening the malicious
    attachment. This technique is often used by attackers who have taken control of
    another victim''s system. In this case, the attackers leverage their control of
    one system to pivot within an organization using email messages from a trusted
    sender known to the'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Computer Intrusions and Detection


    victims sometimes use the evil twin Wi-Fi attack by standing up a Wi-Fi access
    point and advertising it with a deceptive name that is similar to a legitimate
    access point. When victims connect to the evil twin Wi-Fi network, the attackers
    gain access to all the transmissions sent to or from victim devices, including
    user IDs and passwords. Attackers can also use this vector to target victim devices
    with their fraudulent prompts that appear to originate from legitimate systems.
    (d) Voice phishing, also known as vishing, is a form of phishing that occurs over
    voice communications media, including voice over IP or plain old telephone service.
    A typical scam uses speech synthesis to leave voicemails notifying the victim
    of suspicious activity in a bank or credit account, and solicits the victim to
    respond to a malicious phone number to verify his identity thus compromising the
    victim''s account credentials. (e) SMS phishing also sometimes called SMishing
    or SMShing is another mobile device-oriented phishing attack which uses text messaging
    to persuade victims to disclose account credentials or install malware.


    # 7.3.2 Drive-by download


    This is a term sometimes referred to an attack where a user happens to visit a
    website hosted on an infected or malicious web server through otherwise innocuous
    web browsing. For example, an individual might be web browsing on social networking
    sites, and a malicious advertisement might direct that user to an infected web
    server that would then infect or compromise the web browsers through the exploitation
    of a vulnerability or misconfiguration. (a) Cross-site scripting also written
    as “XSS,” cross-site scripting is a general set of techniques whereby an attacker
    is able to execute malicious code on another system through an intermediary web
    application. In addition, attacks occurs against Internet-facing systems that
    have transitioned from attacks against underlying services and primary service
    applications (IIS, Apache, etc.) to attacks versus custom databases and web applications.
    A primary example of this is SQL injection attacks. (b) SQL injection is the placement
    of SQL control characters as input into an application with a database back end,
    where the application was not expecting SQL control characters. If those characters
    are placed properly and accepted by the database server, they can be used to cause
    the database server to supply or modify information that should not have been
    accessible by the user account in question or through the particular interface
    in use.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Digital Forensics and Investigation: From Data to Digital Evidence


    # 7.4 ATTACK DETECTION


    Attack detection assumes that an attacker can obtain access to her desired targets
    and is successful in violating a given security policy. Mechanisms in this class
    are based on the optimistic assumption that, most of the time; the information
    is transferred without interference. When undesired actions occur, attack detection
    has the task of reporting something went wrong and to react in a proper way. Additionally,
    it is often necessary to ascertain the exact type of attack. An essential facet
    of attack detection is recovery. Often it is adequate to just report that malicious
    activity has been detected, but some systems require that the effects of an attack
    be reverted or that an ongoing and discovered attack is stopped. On one hand,
    attack detection has the benefit that it operates under the worst-case theory
    that the attacker gains access to the communication channel and is able to use
    or modify the resource. On the other hand, detection is not effective in providing
    confidentiality of information. When the security policy specifies that interception
    of information has a serious security impact, then detection is not an appropriate
    mechanism. The most important members of the attack detection class are IDSs.


    # 7.5 INTRUSION DETECTION SYSTEMS (IDS)


    Here, we need to understand the meaning of intrusion first before we proceed.
    An intrusion is defined as a sequence of related actions performed by a malicious
    adversary that results in the compromise of a target system. It is assumed that
    the actions of the intruder violate a given security policy. The existence of
    a security policy that states which actions are considered malicious and should
    be prevented is a key requirement for IDS. Violations can only be detected when
    actions can be compared against given rules. ID is the process of recognizing
    and responding to malicious activities at computing and network resources. This
    definition introduces the concept of ID as a process, which involves technology,
    people, and tools. IDS is an approach that is complementary with mainstream approaches
    to security, such as access control and cryptography. The adoption of IDSs is
    motivated by several factors: (1) Surveys have shown that most computer systems
    are flawed by vulnerabilities, irrespective of manufacturer or purpose (Landwehr
    et al., 1994), that the number of security incidents is continuously accumulating
    or users and administrators are generally very slow in applying fixes to vulnerable
    systems. As a consequence, many'
