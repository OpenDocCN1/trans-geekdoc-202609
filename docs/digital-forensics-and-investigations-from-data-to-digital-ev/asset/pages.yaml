    # 2.5 COMPUTER FORENSICS FIELD TRIAGE PROCESS MODEL


    The computer forensics triage process model (CFFTPM) is defined as those investigative
    processes that are conducted within the first few hours of an investigation, that
    provide information used during the suspect interview and search execution phase.
    Due to the need for information to be obtained in a relatively short frame time,
    the model usually involves an onsite/field analysis of the computer system(s)
    in question. The emphases of the model are to: find working evidence instantly;
    ascertain possible charges; and precisely evaluate the offender''s threat to the
    society.


    Being able to conduct an examination and analysis on scene, in a short period
    of time, and provide investigators with time-sensitive leads and information provides
    a powerful psychological advantage to the investigative team. Suspects are emotionally
    more susceptible within the first few hours of their initial contact with police,
    especially when this contact occurs in their place of business or home. This cooperation
    can be critical in certain cases such as abductions, sexual predatory offenses,
    etc. What is crucial to the investigator during this initial time period is the
    knowledge of the full extent of the crime and/or involvement of the suspect and
    "triggers" that further'
