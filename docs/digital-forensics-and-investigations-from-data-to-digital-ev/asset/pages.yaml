  md: '24 Digital Forensics and Investigation: From Data to Digital Evidence


    Law enforcement is in a perpetual race with criminals in the application of digital
    technologies and requires the development of tools to systematically search digital
    digital devices for pertinent evidence. Digital forensic science provides tools,
    techniques, and scientifically proven methods that can be used to acquire and
    analyze digital evidence. The digital forensic investigation must be retrieved
    to obtain the evidence that will be accepted in the court. This research focuses
    on a structured and consistent approach to digital forensic investigation. The
    chapter reviews some of the existing digital forensic models and highlights new
    paradigms and techniques being considered. It also analyzes their capabilities
    and weakness in order to help the investigators choose the appropriate forensic
    investigation model(s).


    # 2.1 THE FORENSICS PROCESS MODEL


    The U.S. Department of Justice published a process model in the Electronic Crime
    Scene Investigation: A Guide to First Responders that consists of four phases:


    +   (a) Collection: Involves the evidence search, evidence recognition, evidence
    collection, and documentation. (b) Examination: This is designed to facilitate
    the visibility of evidence, while explaining its origin and significance. It involves
    revealing hidden and obscured information and the relevant documentation.


    +   (c) Analysis: This looks at the product of the examination for its significance
    and probative value to the case.


    +   (d) Reporting: This entails writing a report outlining the examination process
    and pertinent data recovered from the overall investigation.


    The analysis phase of this model is improperly defined and ambiguous. For example,
    it emerges as an interpretation of the results from the examination phase, and
    in the process confuses analysis with interpretation despite these being two distinct
    processes.'
  merge: -1
  img_proc: true
