- pgno: 155
  md: '# 6.3 FORENSIC SOFTWARE TOOL KITS


    Features of professional forensic tools vary greatly depending on what aspect
    of forensic analysis they target and what market they are aimed at. There are
    large digital forensics frameworks and software solutions, alongside Digital Forensics
    Framework, Open Forensics Architecture, Computer-Aided Investigative Environment,
    X-Ways Forensics, SANS Investigative Toolkit, EnCase, Sleuth Kit, and so on. However,
    many professional forensic specialists prefer to build their own customized toolboxes
    from individual tools that exactly fit their needs and preferences. This section
    describes some of the common forensics tools used by investigators.


    # 6.3.1 Personal Digital Assistants 3.0.3.89


    Paraben Seizure version 3.0.3.89 is a forensic software toolkit that allows forensic
    examiners to acquire, search, examine, and report data associated with personal
    digital assistants (PDAs) running Palm OS, Windows CE, and RIM OS. Though able
    to be used with smartphones running these operating systems, the toolkit is oriented
    toward non-cellular devices and omit cell phone-oriented features, such as SIM
    acquisition for GSM phones. Pada Seizure''s features include the ability to perform
    a logical and physical acquisition, providing a view of internal memory and relevant
    information concerning individual files and databases. Pada Seizure uses the MD5
    hash function to protect the integrity of acquired files. Additional features
    include bookmarking of information to be filtered and organized in a report format,
    searching for text strings within the acquired data, and automatic assembly found
    images under a single facility.


    Pilot-link is an open source software suite originally developed for the Linux
    community to allow information to be transferred between Linux hosts and Palm
    OS devices. It runs on several other desktop operating systems besides Linux,
    including Windows and Mac OS. About 30-command line programs provide the software.
    To perform a physical and logical dump, pilot-link establishes a connection to
    the device with the aid of the HotSync protocol. The two programs of interest
    to forensic examiners are pi-get and pi-getrom, respectively, retrieve the physical
    contents of RAM and ROM from a device. Another useful program is pilot-xfer, which
    allows the installation of programs and the backup and restoration of databases.
    pilot-xfer provides a means to acquire the contents of a'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Mobile Device Forensics 135


    device logically. The contents retrieved with these utilities can be manually
    examined with either the Palm OS Emulator, a compatible forensic tool such as
    EnCase, or a hex editor. Pilot-link does not provide hash values of the information
    acquired. A separate step must be carried out to obtain needed hash values.


    # 6.3.2 Cell Seizure


    Paraben''s Cell Seizure version 2.0.0.33660 is a forensic software toolkit that
    allows forensic examiners to acquire, search, examine, and report data associated
    with cell phones over CDMA, Time Division Multiple Access (TDMA), and GSM networks.
    To acquire data from cell phones using Par''s Cell Seizure software, the proper
    cable must be selected from either the Cell Seizure Toolbox or a compatible cable
    (e.g., DataPoint) to establish a data-link between the phone and the forensic
    workstation. The type of phone being acquired requires the cable interface. Serial
    RS-232 and USB data-connections are established via the phone data port or the
    under-battery interface connection. Additional features include benchmarking of
    information to be filtered and organized in a format report, searching for case-sensitive
    word text and hexadecimal values, and automatic assembly of found images under
    a single facility. The following data can usually be found on most cell phones
    with the tool; (a) SMS: inbox:outbox (b) Phonebook: SIM-Card, own numbers, speed
    dialing, fixed dialing (c) Call logs: dialed numbers, received calls, missed calls
    (d) Calendar: reminder, meeting, meemo (e) Logos: caller logos, startup logos,
    welcome notes (f) Graphics: wallpaper, picture images, EMS templates (g) WAP:
    Wap settings, Wap b(h) SIM: GSM specific data.


    # 6.3.3 Oxygen Phone Manager


    The forensic version of Oxygen Phone Manager OPM is available for police departments,
    enforcement units, and all government services that wish to use the software for
    investigation purposes. The forensic version differs from the non-forensic version
    of OPM by prohibiting any changes in data acquisition. OPM allows examiners to
    acquire data from the device and export the acquired data into multiple supported
    formats. The Oxygen software is tailored to mobile phones and smartphones manufactured
    by Nokia, Sony Ericsson, Siemens, Panasonic, Sendo, BenQ and some Samsung models.
    Oxygen software provides software libraries, ActiveX libraries and components
    for Borland Delphi to software developers.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '136 Digital Forensics and Investigation: From Data to Digital Evidence


    # 6.3.4 GSM.XRY


    Micro Systemation’s SoftGSM: XRY is a forensic software toolkit for acquiring
    data from GSM, CDMA, 3G phones and SIM/USIM cards. The XRY unit is able to connect
    to cell phone devices via infrared (IR) port, Bluetooth, or a cable interface.
    After establishing connectivity, the phone model is identified with a corresponding
    picture of the phone, the device name, manufacturer, model, serial number (IMEI),
    subscriber ID (Mobile Subscriber Identity [IMSI]), manufacturer code, device clock,
    and the PC clock. Data acquired from cell phone devices are stored in the. XRY
    format and cannot cannot be altered but can be exported to external formats and
    viewed with third-party applications. After a successful acquisition, the following
    fields may be populated with data, depending on the phone’s functionality: summary
    screen, case data, general information, contacts, calls, calendar, SMS, audio,
    files, notes, tasks, MMS, network information, video, and so on. Additionally,
    graphic files, audio files, and internal files present on the phone can be viewed
    internally or exported to the forensic workstation for safekeeping or further
    investigation.


    ![](img/149e5d898c819a550264bf1eab7b7354_157_0.png)


    Figure 6.3: XRY Software application. Source: http://www.alzomar.com/products.asp?
    ID=32&Page=Digital%20Investigation'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 6.3.5 Forensic SIM


    Radio Tactic’s Forensic SIM Toolkit consists of the following components: acquisition
    terminal, control card, data storage cards, analysis application, and the card
    reader. The acquisition terminal is a stand-alone unit that gives the examiner
    through each step of the acquisition process. The Forensic SIM toolkit deals with
    two processes: acquisition of data and analysis of data. Data acquisition is carried
    out using the acquisition terminal. Data analysis is carried out using the Forensic
    SIM card reader, attached to a PC running the Forensic SIM analysis application.
    The terminal’s primary function is to capture copies of the data from the target
    SIM to a set of data storage cards. A control card is used to provide the examiner
    access to the acquisition terminal, thwarting unauthorized use. The data storage
    cards consist of a master data storage card, a prosecution data card, a defense
    storage card, and a handset access card. The toolkit allows examiners read-only
    access to SIMs and generates textual reports based on the contents acquired. Reports
    can be viewed internally, saved to disk, or printed for presentation purposes.


    # 6.3.6 Forensic Card Reader


    The Forensic Card Reader (FCR) consists of a smart card reader with USB connection
    and the FCR software that gives examiners the ability to acquire data from SIM
    cards without modification. The examiner has the ability to select specific data
    elements that can be later stored and displayed in a finalized report. Operations
    details like case number, evidence number, and examiner can be automatically merged
    into the report and its file name. All usual data elements are acquired (e.g.,
    phone directory, abbreviated dialing numbers, fixed dialing numbers, and SMS messages),
    as well as the identifiers of the SIM and the subscriber. Special elements such
    as deleted SMS messages can also be acquired. FCR stores a complete report in
    an XML format. SIM cards for GSM mobiles and also SIM cards for 3G mobiles can
    be used with the FCR. Extended phone book entries can be acquired, including additional
    numbers and email addresses. The supplied FCR reader allows examiners to use either
    small or large SIM cards without the need for an adapter.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '![](img/149e5d898c819a550264bf1eab7b7354_159_0.png)


    **Figure 6.4:** A SIM card reader.


    Source: https://www.digitalforensics.com/sim-cards-forensic-analysis-with-oxygen-software/


    # ### 6.3.7 MOBILED!


    MOBILEdit is an application giving examiners the ability to acquire logically,
    search, examine and report data from GSM/CDMA/PCS cell phone devices. MOBILEdit
    is able to connect to phone devices via an IR port, a Bluetooth link, or a cable
    interface. After connectivity has been established, the phone model is identified
    by its manufacturer, model number, and serial number International Mobile Equipment
    Identifier (IMEI) and with a corresponding picture of the phone. Data acquired
    from cell phone devices are stored in themed file format. After a successful acquisition,
    the following fields are populated with: subscriber information, device specifies,
    phonebook, SIM phonebook, missed calls, numbers dialed, received calls, inbox,
    sent items, drafts, files folder. Items present in the file folder, ranging from
    graphics files to camera photos and tones, depend on the phone’s capabilities.
    Additional features include the PhoneSafe.com service, which provides access to
    the IMEI database to register and check for stolen phones.


    # ### 6.3.8 TULP 2G


    TULP2G (2nd generation) is an open source, forensic software tool originated by
    the Netherlands Forensic Institute that allows examiners to extract and read data
    from mobile cell phones and SIMs. TULP2G requires'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'a forensic workstation running either Windows 2000 or XP, preferably with the
    latest patches and service pack installed, along with NET 1.1 SP1. In order to
    take advantage of recently released 1.1 plug-ins, Windows XP SP2 is required.
    TULP2 acquires data from mobile phones using a proper data cable, Bluetooth or
    IrDA connection and a compatible protocol plug-in. Reading SIMs requires a PC/SC-compatible
    smart card reader and possibly an adapter to convert a small-sized SIM to the
    standard-size smart card format.


    # 6.3 BitPIM


    BitPIM is a phone program that runs on Windows, Linux, and Mac OS and allows the
    viewing and management of data on mobile phones. This data includes the phone
    book, calendar, wallpapers, ringtones, and the embedded file system. To acquire
    data successfully using BitPIM, examiners must have the proper driver and cable
    to form a connection between the phone and the forensic workstation. BitPIM provides
    detailed information contained in the help file, outlining supported phones, suggested
    cables to use with specific phone models, and notes and technical know-how about
    specific situations. BitPIM is distributed as open source software under the GNU
    Public License.


    # 6.4 DATA STORAGE


    A mobile phone contains diverse set of information and a smartphone contains more
    than simple email or files. A mobile device can contain videos, web browsing,
    location, and social networks. All of these components are used in Mobile Forensics
    to uncover useful evidence.


    # 6.4.1 Data Stored in Mobile Phones


    The following contents of modern mobile phones can have value as evidence: IMEI,
    short dial numbers, text messages, settings (language, date/time/volume, etc.),
    stored audio recordings, stored computer files, Logged incoming calls and dialed
    numbers, stored executable programs, stored calendar events, GPRS, WAP, and Internet
    settings. Most of this information is available through cable and manufacturer
    specific software.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# 140 Digital Forensics and Investigation: From Data to Digital Evidence


    However, direct analysis of the memory could potentially reveal other hidden information,
    such as deleted text messages. Such analysis has to be the authors knowledge not
    yet performed


    # 6.4.2 Data Stored in SIM Cards


    The SIM card, used in GSM phones, is a smart card which enables connection to
    GSM networks and enables the subscriber to be uniquely identified in the network.
    The SIM card contains a number of files, which contain the user’s subscriber information,
    and personal information, such as (a) IMSI, which is the SIM card’s globally unique
    identifier. (b) Language preferences and network (service provider) information.
    (c) Currency information, such as call charge counters. (d) Information about
    the current (or most recent) location of the mobile phone. (e) Phone entries.
    (f) Sent and received SMS messages. (g) Recently dialed numbers. Many of the features
    available on a SIM card are optional, and therefore may not be implemented by
    every handset or service provider (ETSI 2004a).


    # 6.4.3 Data Stored in Phone Memory


    In addition to the SIM memory, memory is available within the phone to store phone
    software and additional data. This space can be used to extend the SIM memory,
    to store additional phone book data, call logs and so. The following are some
    examples of the additional information which may be found in a phone’s memory:
    (a) Phone settings (b) Calendar information (c) SMS/MMS messages (d) Call log
    entries (e) Time and date (f) Ringtones (g) Data required for/produced by the
    phone’s extra features, such as audio and video recordings, and images. (h) Generic
    data stored in the phone’s memory. (i) Application executables (Willassen 2005,
    ETSI 2004b). Many modern phones with a relatively large amount of onboard memory.
    For example, the Nokia 9300 has 80MB onboard memory, with the option to extend
    it with a removable memory card (Nokia 2005b). These removable cards are generally
    used to store multi-media files, such as audio, video, images, and MMS messages,
    and are not used for phone-related information (phonebook entries, etc.) (Willassen,
    2005). However, the cards can be used for transfer and storage of any form of
    data. OBEX capable phones typically allow the user to store any form of data in
    the phone’s memory.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/149e5d898c819a550264bf1eab7b7354_162_0.png)


    **Figure 6.5:** iPhone Storage. Source: https://techcrunch.com/2017/06/06/ios-11-will-help-you-free-up-storage-on-your-iphone-through-personalized-suggest/


    # ### 6.4.4 Data Stored by the Service Provider


    Data retained by the service provider includes subscriber database. The database
    usually contains the following information about each customer such as customer
    name and billing, name and address (if other than customer), username and address
    (if other customer), billing account details, telephone number (Mobile International
    Subscriber Directory Number [MSISDN]), IMSI, SIM serial number (as printed on
    the SIM card), PIN and/or PUC for the SIM, and services allowed. Whenever a call
    is made or a text message is sent, a “call data record” is created and stored,
    containing other information, the sending and receiving phone numbers, the length
    of the call, and the initial and final location of the two parties.


    # ### 6.5 ATTACKS ON THE SIM MODULE


    It is important for the investigator to understand that the SIM can be attacked
    by crafty criminals. In a forensic context, the most obvious attack method is
    the removal of evidence. Since the files on the GSM card can be accessed in raw,
    an attacker can remove evidence by overwriting storage space. For instance, a
    person knowing that deleted text messages are still accessible on the card could
    use the card editor in Sim-Surf Profi to overwrite the'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'messages with other information. Of more interest to a criminal would be to
    attack the SIM to impersonate another subscriber. If this could be done, a criminal
    would be able to make calls on other subscriber''s accounts, and impersonate other
    subscribers, as their caller identification would show up at the called party.
    In the GSM system, the subscriber identity is only stored on the SIM, so the protection
    against impersonation only rely on the SIM security features. The only information
    that identifies the user is IMSI and the secret encryption Ki. Both are stored
    on the SIM and in the HLR in the network. As we have seen, the IMSI can be read
    directly from the SIM card if the user knows the PIN or PUK code. IMSI or valid
    subscribers could also be obtained by listening to unencrypted traffic on the
    air interface the IMSI will be transferred unencrypted across the air interface
    whenever a mobile registers with a new network. But how can the criminal obtain
    the encryption Ki? Since the Ki is stored only internally in the SIM card it is
    not accessible directly, but only through usage of the encryption algorithms stored
    on the card. However, since the user of a SIM card can feed the algorithm with
    known numbers, the Ki can be found in the algorithms certain weaknesses that allow
    analysis. Such an attack is commonly known as a chosen-plaintext attack. The algorithms
    in GSM do indeed have such a weakness. A tool to extract Ki from a SIM has been
    implemented in the program SimScan, available on the Internet [SIMSCAN]. Both
    IMSI and Ki, therefore, be obtained by anyone with a SIM card and knowledge of
    PIN or PUK. The next step for the criminal is to produce a new SIM card with the
    IMSI and Ki implemented. This cannot be done on SIM cards where each IMSI is locked
    through the SIM access mechanism, and Ki is only internally stored. The attacker,
    therefore, needs to get hold of a fresh card without any subscriber information.
    These cards can be ordered from the same source where network providers get their
    cards. The card must be programmed with a special tool for programming of fresh
    cards. Such a tool is distributed with the SimScan package. An attacker could
    also get hold of a generic smart card and smart card programmer, and then program
    the card as a SIM.


    # 6.6 MOBILE PHONE EVIDENCE EXTRACTION PROCESS


    It is important to realize that there are a number of basic requirements for a
    handset or SIM card to interface with a computer. Once these requirements are
    met, the manufacturer is free to implement any other features in any'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Mobile Device Forensics 143


    way it wishes. This means that a forensic tool for mobile phones will not be able
    to target every feature on every type of phone, in other words, evidence extraction
    and forensic examination of each mobile device may differ. Furthermore, the different
    technologies upon which mobile networks are based, such as TDMA, CDMA, and more
    recent 3G technologies, such as WCDMA, each require the handsets to implement
    different standards. If a forensic examiner is able to follow a consistent examination
    process, this will assist in ensuring that the evidence extracted from each phone
    is well documented and that the results are repeatable and dependable. There are
    a number of different methods for obtaining the data. However, there is no accepted
    standard, the freedom which manufacturers when designing their phones means that
    every phone must be considered separately. However, the following figure provides
    an overview of process considerations for extraction of evidence from mobile devices.


    ![](img/149e5d898c819a550264bf1eab7b7354_164_0.png)


    **Figure 6.6:** The mobile phone evidence extraction process. Source: https://www.safarifookonline.com/library/view/practical-mobile-forensics/9781786462400/ch0is03.html


    # 6.6.1 Evidence Intake Phase


    The evidence intake phase involves the procedure by which requests for examinations
    are handled. This phase is very important in digital forensics because it collects
    the digital evidence provided in the mobile device. In this phase, the investigator
    preserves the device in its original stage. Also, the cell phones are seized that
    are involved in the activity so that there should'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 144 Digital Forensics and Investigation: From Data to Digital Evidence


    not be any change in the evidence. Seize the mobile device means to cut off all
    the wireless networks. Any failure in this stage will result in the failure of
    all the rest stages. The goal of seizure is to preserve the evidence as it avoids
    shut down the device. The evidence intake phase entails forms and intake paperwork
    to document the chain of custody, ownership information, and the type of incident
    the phone was involved in and outlines general information regarding the type
    of data the requester is seeking to have extracted or documented from the phone.
    A critical aspect at this phase of the examination is the development of specific
    objectives for each examination. This not only serves to document the examiner''s
    goals but also assists in the triage of examinations and being the documentation
    of the examination process for each individual phone examined. This information
    allows the examiner to triage cellular phones.


    # 6.6.2 Identification Phase


    For every examination, the examiner should identify the following: (a) The legal
    authority to examine the phone (b) The goals of the examination (c) The make,
    model, and identifying information for the cellular phone itself (d) Removable
    and external data storage (e) Other sources of potential evidence


    +   (1) Legal authority Case law surrounding the search of data contained within
    cellular phones is in a nearly constant state of flux. It is imperative that the
    examiner determines and documents what legal authority exists for the search of
    the cellular phone, as well as what limitations are placed on the search of the
    phone prior to the examination of the device: (a) If the cellular phone is being
    searched pursuant to a warrant, the examiner should be mindful of confining the
    search to the limitations of the warrant. (b) If the cellular phone is being searched
    pursuant to consent, any possible limitations of the consent (such as consent
    to examine the call history only) and should determine whether consent is still
    valid prior to examine the phone. (c) In cases where the phone is being searched
    incident to arrest, the examiner needs to be particularly cautious, as current
    case law in this area is particularly problematic and in'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Mobile Device Forensics 145


    legal authority to search a cellular phone should be directed to a knowledgeable
    prosecutor or legal advisor in the examiner’s local area.


    +   (2) **The goal of the examination** While the general process used to examine
    any given cellular phone should be as consistent as possible, the goal of the
    examination for each phone may be significantly different. It is unlikely that
    any forensics lab has neither the capability to examine every cellular phone that
    contains data of evidentiary value in every kind of case. For this reason, it
    can be useful to identify what level of examination is appropriate for any given
    cellular phone. The first of two main considerations is who will be responsible
    for the process of documenting the data. The second main consideration is how
    in depth the examination needs to be. Of those phones that are submitted to the
    lab for examination, there will be differences in the goals of each examination
    based upon the facts and circumstances of the particular case. In some cases,
    evidence from cellular phones may be documented either by hand or photographically.
    A smaller subset of cellular phones may be submitted for examination with the
    goal of targeted extraction of data that has evidentiary value. Specifically targeted
    data, such as pictures, videos, call history, text messages, or other specific
    data is significant to the investigation while other stored data is irrelevant.
    It also might be the case that only a certain subset of the data can be examined
    due to legal restrictions. In event, limiting the scope of the exam will likely
    make extraction and documentation of the data less time-consuming. The goal of
    the exam may alternatively include an attempt to recover deleted data from the
    memory of the phone. This is only possible if a tool is available for a particular
    phone that can extract data at a physical level. If such a tool is available,
    then the examination will involve traditional computer forensic methods such as
    data carving and hex decoding, and examination process may be a time consuming
    and technically involved endeavor, as deeper levels of examination necessitate
    a more technically complex and time-consuming process.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    ![](img/149e5d898c819a550264bf1eab7b7354_167_0.png)


    **Figure 6.7: Extraction of data from Samsung Galaxy S Relay 4G using Celebrite
    UFED.** Source: https://www.magnetforensics.com/mobile-forensics/ief-and-celebrite-on-android/


    +   (3) The make, model and identifying information for the cellular phone: As
    part of the examination of any cellular phone, the identifying information for
    the phone itself should be documented. This enables the examiner not only to identify
    a particular phone at a later time but also assists in the determination about
    what tools might work with the phone as most cellular forensic tools provide lists
    of supported phones based on the make and model of the phone. For all phones,
    the manufacturer, number, carrier and the current phone number associated with
    the cellular phone should be identified and documented. Depending upon the cellular
    phone technology involved, additional identifying information should be documented,
    if available, as follows:


    +   (a) CDMA cellular phones The Electronic Serial Number (ESN) is located under
    the battery of the cellular phone. This is a unique 32-bit number assigned to
    each mobile phone on the network. The ESN may be listed in decimal (11 digits)
    and/or hexadecimal (8 hex digits). The examiner should be aware that the hex version
    of the ESN is not a direct numeric conversion of the decimal value. An ESN converter
    can be found at http://www.elfqin.com/esdnhconv.html. The Mobile Equipment ID
    (MEID), also found under the battery cover, is a 56-bit number which replaced
    the ESN due to the limited number of 32 bit numbers. The MEID is listed in hex,
    where the first byte'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'is a regional code, next three bytes are a manufacturer code, and remaining
    three bytes are a manufacturer-assigned serial number. CDMA phones do not generally
    contain a SIM card, but some newer hybrid phones contain dual CDMA and GSM technology
    and can be used on either CDMA or GSM networks. Inside these dual technology phones
    are located a slot for a SIM card. The identifying information under the battery
    of these phones may list an IMEI number in addition to the ESN/MEID number. CDMA
    phones also have two identifying numbers, namely, the Mobile Identification Number
    (MIN) and Mobile Directory Number (MDN). The MIN is a carrier-assigned, carrier-unique
    24-bit (10-digit) telephone number. When a call is placed, the phone sends the
    ESN and MIN to the local tower. The MDN is the globally unique telephone number
    of the phone. Prior to wireless number portability, the MIN and MDN were the same
    but in today''s environment, the customer can keep their phone number (MDN) even
    if they change carriers.


    ![](img/149e5d898c819a550264bf1eab7b7354_168_0.png)


    +   **GSM cellular phones** The IMEI is the unique 15-digit number that identifies
    a GSM cellular phone handset on its network. This number is generally found under
    the battery of the cellular phone. The first 8 digits are a Type Allocation Code
    and the next 6 digits are the Device Serial Number. The final digit is a check
    digit, usually set to 0. On a GSM phone, there will be at least a SIM card slot
    which is also generally located under the battery.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 148 Digital Forensics and Investigation: From Data to Digital Evidence


    The SIM card may be branded with the name of the network to which the SIM is registered.
    Also located on the SIM card is the ICCID, which is an 18 to 20 digit number (10
    bytes) that uniquely identifies each SIM card. The ICCID number is tied to the
    IMSI which is typically a 15-digit number (56 bits) consisting of three parts
    including the Mobile Country Code (MCC; 3 digits), Mobile Network Code (MNC; 3
    digits in the U. S. and Canada, and 2 digits elsewhere), and Mobile Station Identification
    (9 digits in the U. S. and Canada, and 10 digits elsewhere) which are stored electronically
    within the SIM. The IMSI can be obtained either through analysis of the SIM or
    from the carrier. MSIDN is the phone''s 15-digit, globally unique number. MSIDN
    follows the International Telecommunication Union Recommendation E.164 telephone
    numbering plan, composed of a 1–3 country code, followed by a country-specific
    number. In North America, the first digit is 1, followed by a 3-digit area code.


