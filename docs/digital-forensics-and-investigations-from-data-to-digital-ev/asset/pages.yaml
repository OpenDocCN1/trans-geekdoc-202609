    after through which allied knowledge is gathered based on acceptable strategies,
    software program; and on this step, we make use of various restoration strategies
    and compression free of loss additionally. Following this step are two attention-seeking
    and really important phases—examination and analysis, whereby proof traceability,
    sample matching are guaranteed, then concealed knowledge have to be found and
    extracted. At this level, “mining” of knowledge and timeline are carried out.
    The most recent section of this model is presentation. Processes associated with
    this step which are documentation, clarification, and mission affect affirmation,
