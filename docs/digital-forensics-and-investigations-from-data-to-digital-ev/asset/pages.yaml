- pgno: 18
  md: '# PREFACE


    Digital tools such as hard drives and smartphones have recently been used to extract
    core information from terrorists. An iPhone was used to capture the famous celebrity,
    Michael Jackson in his final moments. We will keep talking about the role of digital
    forensics in our modern world because it has brought a lot of ease to every facet
    of life and various industries. It has helped justice by catching criminals. Cyber
    activity has become a significant part of our lives and obviously, we cannot do
    without it because the world has changed due to science and technology. This is
    in addition to the fact that research is conducted daily to improve the lives
    of people all around the world. According to the EC Council, about 85% of businesses
    and government agencies have detected a security breach.


    Over the past few years, practitioners and researchers have made significant advances
    in digital forensics. Our understanding of technology has improved and we have
    gained the necessary experience to refine our practices. We have overcome many
    technical challenges, giving practitioners greater access to digital evidence.
    New forensic techniques and tools are created almost daily to support forensic
    acquisition of volatile data, inspection of remote systems, and analysis of network
    traffic.


    # Purpose and Readership


    Various books on “forensics” from diverse authors are very specific and tend to
    ignore core aspects of digital forensics. This book specially corrects this mistake
    by covering most core aspects that readers need to understand when dealing with
    forensic investigation. It is organized in such a way that the hierarchy of various
    forensics topics is highlighted. The case studies give readers a realistic view
    and sense of the technical, legal, and practical challenges that arise in real
    computer investigations. Tables and figures are included for comparison and better
    understanding. A bibliography is listed at the end of this book for further studies
    and research.


    This book is intended to help crime investigators in various government agencies
    and security personnel to understand the concept of digital forensics'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'comprehensively, access the benefits of various sources of digital evidence
    evaluate and integrate some of the important principles of digital evidence into
    investigations. It decode the relationship between digital evidence and open source
    tools. It is written to meet the needs of forensic investigators, information
    security engineers, security analysts, cybercrime investigators, firewall engineers,
    forensic scientists, attorneys, law enforcement, computer professionals, and other
    professionals in the Information and communication technology (ICT) industry.


    # Organization of the Book


    This book is divided into 10 chapters. Chapter one gives a comprehensive analysis
    of digital forensics. The first section of chapter introduces the readers to the
    concept of forensic examination. The second section discusses the origin of digital
    evidence; the third section highlights the principles of digital evidence while
    the last section gives insight on anti-forensics. Chapter two enables the readers
    to get an understanding of the current investigative processes in forensic investigation.
    However, the various models that were established by researchers and investigators
    are explained. Chapter three informs the reader about the role of network and
    Internet in forensic investigation. It is divided into two parts. The first part
    (pages 52–58) gives information about the types and examples of network used in
    obtaining network-based evidence while the second part (pages 58–64) gives information
    about the use of the Internet, email, and social network in forensics. Pages 64–71
    elaborate file analysis, the elements involved, and protection against intrusions.
    Chapter four explains the types of operating systems in digital forensics with
    their mode of operation. Chapter five explains fundamental cloud computing, types
    of deployment models, and analysis of the challenges and opportunities in cloud
    forensics. Chapter six attempts to provide an overview of the methods commonly
    used to obtain data from mobile phones in a forensic routine. Mobile forensic
    tools and processes of retrieving data from various types of handheld device are
    also discussed. Chapter seven attempts to give a systematic overview of system
    security requirements and highlights the potential means to satisfy them. The
    purpose of this chapter is to provide a well-grounded framework within which readers
    can make proper purchase and execution decisions. Chapter eight discusses “digital
    forensics and legal proceedings.” It discusses the operational and legal issues
    related to digital evidence. The forensic applications of new scientific discoveries
    have most been dramatically seen in the criminal trial will also be covered. This
    book addresses the aforementioned forms of scientific forensic evidence that have
    sufficient validity used in a criminal proceeding.'
  merge: -1
  img_proc: true
- pgno: 20
