  md: '# Network and Internet 63


    P2P and file exchange clients such as the popular Torrent exchange software may
    contain crucial evidence including illegal images or videos, stolen intellectual
    property, and copyright infringement. Information about files being downloaded,
    shared, and uploaded can be a good addition to collected evidence base. Peers
    promote exchange of information at the application layer which helps in the maintenance
