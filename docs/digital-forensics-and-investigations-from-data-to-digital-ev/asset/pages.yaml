    a second warrant to search a computer seized pursuant to a valid warrant if the
    property targeted by the search is different from that specified in the first
    warrant. However, there are number of other exceptions to the requirement for
    a search warrant, as established by statutes and court cases. These include


    # 8.4.1 Consent Searchesches


    If the party with control over the premises or thing to be searched officers do
    not need a warrant. This is called a consent search. Officers do not need to show
    probable cause of a crime; they can legally search even if there is no reason
    whatsoever to believe a criminal offense has occurred. The key element here is
    that the consent must be voluntary. If consent is obtained under duress, threat,
    or intimidation, it is not voluntary and thus is not valid.


    # 8.4.2 Abandoned Property


    Law enforcement officers are generally allowed to search property that has clearly
    been abandoned without obtaining a warrant. For example, if a suspect is carrying
    a diskette and, upon observing police are in the area, throws the diskette in
    a public trash can, officers can lawfully retrieve it.


    # 8.4.3 Exigent Circumstances


    Another situation in which searches can be conducted without a warrant is the
    case of exigent circumstances—that is, in an emergency where there is not time
    to get a warrant and the search is required immediately to save a life or prevent
    physical injury to some person, keep the suspect from escaping, or to prevent
    evidence from being destroyed. This last situation is most applicable to digital
    evidence because of its fragile nature. It is very'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 190 Digital Forensics and Investigation: From Data to Digital Evidence


    easy to destroy evidence that consists of computer data. In United States versus
    David and United States versus Romero-Garcia, the courts have held seizure of
    electronic evidence without a warrant was legal because the evidence was about
    to be destroyed.


    # 8.4.4 Plain View Searches


    The idea of plain view (sometimes also referred to as the open field doctrine)
    rests on the premise that the enforcement officer is legally in a certain place
    where he or she can see observable evidence of a crime in plain view. Because
    the contents of a file stored on a computer are typically not in plain view (unless
    the officer entered entered the room where the suspect had the file on screen),
    this principle is not often applied to digital evidence. This issue has come into
    play when officers had a warrant to search for evidence of a crime (for example,
    child pornography) and during legal search came across evidence of a different
    crime (for example, a photo indicating that the suspect had committed a murder).
    Courts have generally held that the plain-view doctrine applies, but upon finding
    the evidence of the second offense, officers should return with that evidence
    to the magistrate to establish probable cause for issuance of a search warrant
    to search for further evidence of the second crime.


    # 8.5 SEARCH WITHOUT WARRANT


    Warrantless searches that violate a reasonable expectation of privacy comply with
    the Fourth Amendment if they fall within an established exception to the warrant
    requirement. For example, agents may conduct a search without a warrant if an
    individual with authority has consented to the search, if there is an expectation
    that the evidence will be destroyed, or if the evidence is in plain view. Other
    exceptions occur during searches incident to a lawful arrest, inventory searches,
    and border searches. In some circumstances, Fourth Amendment protections do not
    apply because the action is deemed not to be a search. If the police take a vehicle
    into custody (for example, because they arrested the person who was driving),
    they are allowed to take record of the contents of the vehicle as a standard procedure
    inventory. This does not constitute a search because it is not for the purpose
    of looking for evidence of a crime but for the purpose of protecting the owner''s
    property (and protecting the agency against claims of theft). However, this exception
    does not allow police to open locked containers,'
