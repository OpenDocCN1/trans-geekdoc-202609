- pgno: 60
  md: '# (1) Browser Artifacts


    While the specifics vary, most web browsing applications store some method for
    storing “cookies,” either as a file or as separate files, some means of storing
    temporary Internet files, and some means of storing user information and preferences,
    such as typed URLs and “favorites."


    The specific content of individual cookies is determined by each individual website
    and is rarely evidentiary value. In most cases, the evidentiary value of a cookie
    is limited to its size. Typically, the name of a cookie will match the URL of
    the site that deposited the cookie, indicating that the PC had visited that site
    at some point in the past. This does not go to show intent as the cookie will
    be created whether the browser was redirected from another site, or intentionally
    pointed to the site with a typed URL. Dates and times associated with cookies
    may help determine when a site was visited and can be used in creating investigative
    timelines.


    Temporary Internet files are essentially cached copies of web page components
    (graphics) on the local PC. The investigative value is that these files are stored
    without the intent or intervention of the user, and that some files, for example,
    contraband images, have inherent evidentiary value. An investigator must keep
    in mind that these files are easily cleared out by most browsing applications
    or with third-party tools. Most importantly, investigators must weigh the potential
    value against the time; it will take to search through even a moderately cached
    cache. Examiners should expect a search of temporary Internet files to take hours
    or days. In many cases, that requires more time than the examiner has.


    # (2) Email Artifacts


    Email artifacts may be of enormous evidentiary value but can require a very expensive
    investment in time. Procedures for examining email and extracting useful data
    are usually specific to the particular email client and can be time-consuming
    to implement. If extraction of email is successful, even a cursory screening of
    all the email in a suspect''s mailbox could take many hours. If web-based email
    is used, there is often no local storage of email artifacts.


    # (3) Instant Messaging Artifacts


    Most instant messaging clients maintain some type of contact information and have
    the capability to record and store logs of the conversations that'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 40 Digital Forensics and Investigation: From Data to Digital Evidence


    take place between the user and his or her online contacts. In most cases, this
    logging capability is off by default but can, and often is, turned on by the user.
    Contact information for most IM applications is maintained at the server, and
    may not be found on the local PC. Chat logs contain a wealth of data, including
    the conversation itself as well as the screen names of other parties. A single
    chat log may contain hours of conversation. A thorough examination of multiple
    logs may bear a prohibitive cost in time. If it is necessary to examine chat logs,
    it is important for the examiner to have a clear idea of what he or she is looking
    for. String search tools should be implemented as much as possible. An “old-fashioned”
    examination would likely involve a thorough examination of all these and many
    other artifacts. The mandates of the CFFTP require that the examiner judiciously
    evaluate the potential benefit of examining each of these artifacts with the time
    cost of doing so.


    # 2.5.8 Case-Specific Evidence


    It is important for the computer forensic examiner to be able to adjust the focus
    of every examination to the specifics of that case. This is a skill that requires
    the ability to reconcile a number of conflicting requirements in the manner most
    appropriate not just to a type of case but to each specific set of circumstances.
    There are several practices that can facilitate effective optimization of resources.
    A computer forensic examiner should be able to evaluate time resources, utilize
    pre-raid intelligence, customize search goals, and prioritize search goals. Of
    all the resources available to the examiner, time is usually in shortest supply.
    One consideration when taking whether the time requirement is “bounded” or “unbounded.”
    Is there a defined deadline (“bounded”) beyond which the search is halted, or
    the evidence loses all value? Is the finding possible, even if it takes days (“unbounded”)?
    For example, a permissive search might only be allowed until the end of an interview,
    whereas the search of a missing person’s PC might be conducted as rapidly as possible,
    but still go on for hours. Time is clearly of both cases, but the lack of a limit
    in the unbounded case can justify some avenues of investigation that would not
    be feasible in a bounded situation. In all cases, time is an expensive commodity.
    The time cost of any examination activity must be weighed against the potential
    for fruitful results of that activity. As a general'
  merge: -1
  img_proc: true
