- pgno: 140
  md: '# 5.3.4 Infrastructure as a Service


    The Infrastructure as a Service (IaaS) providers supplies computing infrastructures
    such as virtual server space, bandwidth, network connections, IP addresses, and
    load balancers. With this service model, your enterprise is responsible for managing
    applications, data, operating systems, middleware, and runtime. Physically, your
    hardware resources are drawn from multiple servers and networks, typically in
    different data centers. In this way, the IaaS service model minimizes your hardware
    expenses while maximizing scalability. In addition to enterprise infrastructure,
    organizations use IaaS to host websites on virtual servers. When a website is
    subjected to unexpected demands, there is no single point of failure since cloud
    hosting uses a redundant network of physical servers. IaaS is also used with virtual
    data centers (VDC), virtualized networks of interconnected virtual servers within
    a public or private cloud. The physical security of each data center is the responsibility
    of the service provider, and your organization pays only for what it uses. IaaS
    model provides infrastructure components to clients. Components may include virtual
    machines, storage, networks, firewalls, load balancers, and so on. With IaaS,
    clients have direct access to the lowest-level software in the stack—that is,
    to the operating system on virtual machines, or to the management dashboard of
    a firewall or load balancer. Amazon Web Services is one of largest IaaS providers.


    # Characteristics of IaaS


    As with the two previous sections, SaaS and PaaS, IaaS is a rapidly developing
    field. That said there are some core characteristics which describe what IaaS
    is. IaaS is generally accepted to comply with the following: (a) Resources are
    distributed as a service (b) Allows for dynamic scaling (c) A variable cost, utility
    pricing model (d) Generally includes multiple users on a single piece of hardware
    Components of IaaS


    Infrastructure of cloud has multiple components which are used in infrastructure
    service model. They are the shared resources among the users, so they have multiple
    challenges for service providers. Some components are: (1) Service Level Agreements
    (2) Cloud Software (3) Platform Visualization (4) Network and Internet Connectivity
    (5) Computer Hardware'
