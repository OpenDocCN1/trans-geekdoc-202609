    # 8.6 PEN REGISTERS/TRAP AND TRACE


    The pen/trap Statute governs the use of pen registers and traps and trace devices.
    The statute authorizes a government attorney to apply for a court order authorizing
    the installation of a pen register and/or trap trace device when the information
    sought is relevant to an investigation. As modified by the USA PATRIOT Act, it
    now applies to communications on computer networks in addition to telephone communications
    and gives nationwide effect to pen/trap orders. In addition to the applicable
    federal laws, state laws must also be considered. In particular, many states have
    laws regarding privacy, especially with regard to stored electronic information.
    Unfortunately laws vary considerably state to state, and a detailed discussion
    is beyond the scope of this book. Pen registers and trap trace devices provide
    non-content information about the origin and destination of particular communications.
    Because this information does not contain the content of the communication, it
    is subject to lesser restrictions than'
