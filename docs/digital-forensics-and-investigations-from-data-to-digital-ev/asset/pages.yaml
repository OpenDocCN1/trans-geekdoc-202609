- pgno: 76
  md: '# 3.3.2 Stop-look-and-listen Systems


    Every packet is analyzed in an elementary way in memory and only certain information
    is saved for future analysis. This requires a faster processor to match the pace
    of incoming traffic. This system does not have the storage capacity of the former.


    # 3.4 NETWORK FORENSIC ANALYSIS TOOLS


    Network forensic analysis tools (NFATs) enable administrators to track the networks,
    accumulate all information about anomalous traffic, contribute to the investigation
    of network-induced crime, and help in generating a proper output in front of incident
