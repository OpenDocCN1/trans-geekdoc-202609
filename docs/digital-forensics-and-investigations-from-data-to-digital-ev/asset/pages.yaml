    # 4.6 DELETION AND DESTRUCTION OF DATA


    Specific actions of users are often at the heart of a digital investigation. “When
    were they logged on? What Internet sites did they visit? Did they send any email?”
    But one question is asked over and over again, it seems, “is the user knowingly
    delete or destroy any data, particularly if that destruction was done to prevent
    investigators from obtaining benefit from it?” In many civil and criminal cases,
    users (and indeed, whole organizations) are placed under legal directives to make
    every effort to retain and protect from destruction data deemed relevant to a
    current or future; when these types of directives are violated, it is called “spoliation”
    and can mean the difference between winning or losing a contested legal action.
    As such, digital investigators are often called upon to attempt to answer this
    important question, but (unfortunately) it is not always a question to answer
    as it sounds.


    # 4.6.1 Data Destruction


    In the case of actual destruction of data (e.g., wiping), there are several techniques
    that can be used in attempts to verify that data was actually destroyed and (if
    so) who did the destroying. For example, data destruction tools leave behind distinguishable
    patterns; specific files and folders that have been wiped can have their names
    changed to something nonsensical and may show a bit more obvious, such as aaaaaaaa.aaa
    or DELETED_DELETED_DELETED_DELETED. By locating non-deleted files of the same
    logical size, the digital investigator may even be able to find an unaltered copy
    of the wiped data. The same types of data patterns can be seen in large chunks
    in unallocated space as a result of some disk cleaning tools (although it can
    sometimes be difficult'
  merge: -1
