    during the initial testimony, counsel can request to recall a witness to the stand
    for additional questioning and cross-examination.


    # 8.9.7 Closing Arguments


    Counsel for the plaintiffs and defense summarize their clients'' positions to
    remind the jurors of the facts presented in their case and to convince the jurors
    of the veracity of their cause. Closing arguments are typically intended to be
    dramatic and pointed for effect. In many jurisdictions, the plaintiff argues first
    and then the defendant argues, and then the plaintiff makes a rebuttal argument.
    Actually, the party with the burden of proof argues first and last. This is almost
    always the plaintiff, but sometimes the only issues remaining for the jury to
    decide are the affirmative defenses or countermeasures raised by the defendant.
    Also, a few jurisdictions allow only one argument per side, and in a few of these,
    the defendant argues first, plaintiff last.


    # 8.9.8 Jury''s Instructions


    After closing arguments, the judge will instruct the jury. The purpose of jury
    instruction is to explain to the jurors the meaning of the law as it relates to
    the issues they are considering and to tell the jurors what facts they must determine
    if they are to give a verdict for one party or the other. Each lawyer will prepare
    a set of written instructions that she hopes the judge will give to the jury.
    These will be tailored to advance her client''s case. Many a verdict has been
    overturned on appeal because a trial judge has wrongly instructed the jury. The
    judge will carefully determine which instructions to give and often will use a
    set of pattern instructions provided by the state bar association or the supreme
    court of the state. These pattern instructions are often safer because they are
    patterned after language that appellate courts have used previously, and appellate
    courts are less likely to find reversible error in the instructions.


    # 8.9.9 Jury''s Deliberations and Verdict


    After the judge has finished instructing the jury, the jury retires to the jury
    room to begin deliberations. At this time the alternate jurors are dismissed,
    although some jurisdictions allow the alternate jurors to participate in deliberations.
    The court bailiff brings the exhibits and written instructions to the jury room
    and safeguards the jury''s privacy during deliberations. It is largely up to the
    jury to decide how to organize itself and conduct the'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Digital Evidence and Legal Proceedings 207


    deliberations. The judge usually instructs the jurors to select a foreperson to
    preside over the deliberations and to sign the verdict forms that reflect their
    decisions. Jurors sometimes have questions during their deliberations. Usually,
    they write down their questions and give them to the bailiff, who takes them to
    the judge. The judge confers with the attorneys and sends a written response to
    the jury. The judge may deliberate anywhere from few minutes to several days.
    Usually, the judge must reach a unanimous verdict, although majority verdicts
    are sometimes allowed in civil cases. If the jury tells the judge it cannot reach
    a verdict, the judge usually gives the jury some further instructions and returns
    it to the jury room for further deliberations. If the jury still cannot reach
    a verdict, however, the jury is deadlocked, and a mistrial is declared.


