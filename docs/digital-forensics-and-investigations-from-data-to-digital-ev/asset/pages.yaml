- pgno: 120
  md: '# Operating Systems in Forensic Investigation 99


    to distinguish massive\x00 patterns as wiping as opposed to pure unused disk space.
    Other tools, such as the Windows-native utility cipher, wipe free space (by default)
    with seemingly random data. An investigator, first attempting to establish the
    presence of a data destruction utility and installed program locations, can perform
    keyword and hash searches against the evidence looking for hits on terms or files
    associated with known data destruction utilities, but this method can be a hit-or-miss.


    # 4.6.2 Defragmentation


    Another method of data destruction that can be encountered by investigators resulting
    from the execution of Windows (or third-party) cluster defragmentation tools.
    Defragmentation takes data structures that are spread across the disk (such as
    the MFT or a 1.3 GB AVI with numerous file extents) and places them into contiguous
    clusters (if possible), thereby boosting system operation and enhancing the experience
    for the user. as the defragmentation process takes data from one location on the
    disk and writes it another, the rewritten data often overwrites data in unallocated
    space that could have been identified by the digital investigator, thereby making
    it difficult to recover deleted files and folders. Defragmentation generally occurs
    in one of three ways: (a) manual defragmentation by the user (b) user-scheduled
    defragmentation (c) Windows automatic (limited) defragmentation.


