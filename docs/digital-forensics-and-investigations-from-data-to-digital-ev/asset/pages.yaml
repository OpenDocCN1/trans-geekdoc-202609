    # 2.8 GENERIC COMPUTER FORENSICS INVESTIGATION PROCESS MODEL


    Yusoff et al. proposed a five generic grouped forensic investigation model known
    as the Generic Computer Forensics Investigation Process (GCFIP) after reviewing
    existing forensics investigation models (2011).


    The pre-process phase deals with activities that are carried out prior to the
    actual investigation and official collection of data such as getting the necessary
    approval from relevant authority, etc. Under the acquisition and preservation
    phase, tasks related to identifying, collecting, transporting, storing, and preservation
    are performed. Next is the analysis phase which is considered the core of the
    forensic investigation processes and various types of analysis are performed on
    the acquired data to identify the crime source and possibly the perpetrator of
    the crime. The presentation phase is where various outcomes of the analysis phase
    are documented and presented to authority in a format which is easily understood
    and mostly backed by sufficient and acceptable evidence.


