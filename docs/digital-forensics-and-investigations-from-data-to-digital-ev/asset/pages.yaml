    # 2.3 ABSTRACT DIGITAL FORENSICS MODEL


    According to the abstract digital forensics model (ADFM), the identification section
    assumes that the incident sort is efficiently recognized and decided. This is
    a vital step since all upcoming steps depend on it. Followed by the preparation
    step, that is, the basic launched phase where the instruments, strategies, search
    warrants, checking authorization, and administration assistance are ready. This
    step is adopted by the second launched step—approach strategy whereas minimizing
    the effect on the victim by formulating entirely different approaches and procedures
    to comply with. In the next section which is preservation, all acquired knowledge
    has to be isolated and secured to preserve them in their exact state. All acquired
    digital evidence is reproduced, and the bodily scene is recorded, based mostly
    on standardized procedures; these duties are carried out below the collection
    section.


    The ADFM proposes a standardized digital forensics process that consists of nine
    components:


    +   (a) Identification; which recognizes an incident from indicators and determines
    its type.


    +   (b) Preparation; which entails the preparation of tools, techniques, search
    warrants, and monitoring authorizations and management support.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Digital Forensic Models


    +   (c) Approach strategy; that develops a procedure to use in order to maximize
    the collection of untainted evidence while minimizing the impact on the victim.


    +   (d) Preservation; which involves the isolation, securing and preservation
    of the state of physical and digital evidence.


    +   (e) Collection; which entails the recording of the physical scene and duplicates
    digital evidence using standardized and accepted procedures.


    +   (f) Examination; which involves an in-depth search of evidence relating to
    the suspected crime.


    +   (g) Analysis; which involves determination of the significance, reconstructing
    fragments of data, and drawing conclusions based on evidence found.


    +   (h) Presentation; that involves the summary and explanation of conclusions.


    +   (i) Returning evidence; that ensures that physical and digital property is
    returned to proper owner.


    Although this model is generally a good reflection of the forensic process, it
    is open to at least one criticism. Its third phase (the approach strategy) is
    to an extent a duplication of its second phase (the preparation phase).


    # Advantages


    +   (a) Diverse methodology suitable for array of digital devices


    +   (b) This methodology can easily be appreciated by non-technical observers


    +   (c) Potential for incorporating non-digital, electronic technologies within
    the abstraction.


    Disadvantages


    +   (a) The generality of the model may pose some practical challenge.


    +   (b) There is no easy or obvious methodology for testing the model.'
  merge: -1
  img_proc: true
