    # 8.3 PRIVACY PROTECTION LAWS


    The US Privacy Protection Act (PPA) covers search and seizure of items that fall
    under the First Amendment (freedom of speech and freedom of the press) protections.
    The Privacy Act was intended to protect journalists, publishers, and other people
    who might have evidence of criminal activity but are not suspected of committing
    any criminal act. This law applies to materials that are created for the purpose
    of disseminating information to the public (which could apply to writings intended
    to be posted to websites, because this is a form of publishing to a public forum).
    If there is reason to suspect that the person who has the materials is committing
    the crime—that the materials pertain to or if there is a danger to some person
    of physical injury or death that could be prevented by seizing the evidence—search
    and seizure is not a violation of the Privacy Act. Violation of the act is a civil
    rather than a criminal matter, but a violation does not mean that the evidence
    will be thrown out of court, as is the case with a violation of constitutional
    rights. The incidental seizure of certain materials may implicate the PPA or the
    ECPA. Under the,, law enforcement agents must take special steps when planning
    a search that may result in seizure of First Amendment materials (e.g., materials
    posted on the web). The ECPA regulates how agents can obtain the contents of electronic
    communications stored by third-party service providers. To minimize liability
    under these statutes, agents should attempt to determine in advance the type of
    information that may be stored on the computer systems to be searched. Law enforcement
    agents can conduct “knock-knock” warrants if they suspect announc. Courts may
    also authorize “sneak-and-peek” warrants, which do not require agents to notify
