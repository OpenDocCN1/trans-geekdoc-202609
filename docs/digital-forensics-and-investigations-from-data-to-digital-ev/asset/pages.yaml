- pgno: 97
  md: '# Digital Forensics and Investigation: From Data to Digital Evidence


    Operating systems, and the file systems they support, could be intrinsically designed
    and implemented in a way that makes forensic investigation less time consuming
    and more reliable, and assists the use of the uncovered evidence in prosecution
    of perpetrators. Currently, there are many external software tools investigators
    use, and all of them rely on the interface operating system provides. This chapter
    takes you through the critical components of investigation and operating system
    functionality, including file systems, data recovery, memory forensics, system
    configuration, Internet access, cloud computing, tracking artifacts, executable
    layouts, malware, and log files. Essentially, it covers key technical topics that
    focus on the relationship between computer forensics and operating systems design
    and implementation.


    # 4.1 TERMINOLOGIES


    # 4.1.1 Disk


    A disk refers to a physical storage device—an SCSI or SATA hard drive, or a Secure
    Digital Card from a digital camera, for example. Analysis of items at this level
    is usually beyond the capabilities of most examiners—physical media analysis of
    conventional hard drives requires extensive specialized training and knowledge,
    access to a clean room, and expensive electron microscopy equipment. With the
    rise of flash media and Solid State Drives, however, analysis of media at this
    level may be in the realm of a larger pool of examiners.


    # 4.1.2 Volume


    A volume is created using all or part of one or more disks. A single disk may
    contain several volumes, or a volume may span several disks, depending on configuration.
    The term “partition” is often used interchangeably for a volume; carrier makes
    a distinction wherein a “partition” is limited to a single physical disk, and
    a volume is a collection of one or more partitions. Put simply, a volume describes
    a number of sectors on a disk(s) system.


    # 4.1.3 File System


    A file system is laid down on a volume and describes the layout of files and their
    associated metadata. Items in the file system layer include include'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Operating Systems in Forensic Investigation 77


    specific to solely used for the file system’s operation—the Ext2 superblock is
    a good example.


    # 4.1.4 Data Unit


    A data unit is the smallest available freestanding unit of data storage available
    in a given file system. On Unix-derived file systems, these are known as blocks.
    These are generally power of 2 multiple of the physical sector size of the disk.
    Historically the sector size of the disk was 512—most modern file systems will
    use 4096 bytes (4K) or larger as the smallest addressable data unit. The information
    available at the data unit layer is simple: if that data unit is allocated to
    a JPEG image, the data unit will contain a portion of JPEG data. If the data unit
    was allocated to a text file, the data unit will contain text.


    # 4.1.5 Metadata


    Metadata refers to data about data. Given that the data unit layer holds data
    in a file system, the metadata layer then contains data about the data units.
    On Unix-derived file systems these metadata units are called inodes. The exact
    content of metadata units depends on the actual file system being discussed, but
    generally, this layer will at least consist of file time stamps, file ownership
    information, and data units allocated to this metadata unit.


    # 4.1.6 File Name


    The file name layer is where humans operate. Unsurprisingly, this layer consists
    of file and folder/directory names. Once again, artifacts available in this layer
    vary depending on the file system. At the very least, file names have a pointer
    to their corresponding metadata structure.


    # 4.2 WINDOWS XP


    Windows XP has been a standard Microsoft OS for workstations for years. Since
    it hit the scene in 2001, millions of Windows users have grown comfortable with
    its user-friendly interface, comparatively efficient operation, and improvements
    over previous versions such as Windows 2000 and Windows ME. Windows XP comes in
    three primary editions (i.e., Home, Media Center, and Professional), which were
    targeted at different parts of Microsoft’s workstation computing customers. From
    a file system standpoint, XP continues to run on top of the File Allocation Table
    (FAT) and'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'New Technology File System (NTFS) structures with which examiners have grown
    familiar. There are many features in Windows XP that can be very useful for forensic
    examiners. Evidence of user actions is often recorded in areas (such as Internet
    history, Event logs, Prefetch files, thumbs.db files, and link files) that are
    easy to view for the trained digital investigator with the right tool. However,
    other challenges (such as analyzing restore points, analysis of data in the Windows
    registry, collection, and analysis of memory, dealing with RAIDs and dynamic disks,
    overcoming Windows encryption, and documenting data destruction) can present a
    much greater challenge, even for experienced digital investigators. Of its utility,
    Microsoft stopped selling XP in 2008 but plans to continue support for this beloved
    Windows version until 2014, which means it will most likely be a big part of examiners’
    lives for many years to come. Throughout this chapter, unless otherwise stated,
    discussions of Windows XP operation and artifacts also generally apply to Windows
    Server 2003 systems.


    # 4.3 WINDOWS FILE SYSTEMS


    The simplest Windows file systems to understand are the FAT (file allocation table)
    file systems: FAT12, FAT16, and FAT32. Although relatively old, FAT file systems
    are still used on many storage systems as removable media in digital cameras and
    mobile devices. Their widespread use and simple structure, FAT file systems are
    a good starting point for forensic analysts to understand file systems and recovery
    of deleted data. It is also important to understand the fundamentals of NTFS,
    which is more complex than FAT and has substantially different structures. This
    section provides an overview of both Windows file systems, concentrating on aspects
    that are important from a forensic analysis viewpoint.


    # 4.3.1 File Allocation Table


    The FAT file system is perhaps one of the simplest file systems available and
    has been widely available on Microsoft operating systems, starting with MS-DOS.
    FAT was the primary file system on MS-DOS systems and floppy diskettes and was
    also used extensively on Windows 3.x and Window 95 and 98. This file system is
    still used on removable storage devices which'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Operating Systems in Forensic Investigation 79


    as thumb drives, as well as compact flash cards used in digital cameras. The FAT
    file system is supported by other operating systems, so it makes a good medium
    for moving from one system (Linux, MacOS) to another (Windows); if you are conducting
    analysis via a Linux system, you can save extracted files and easily access it
    later from a Windows system. However, keep in mind that the FAT file system does
    not have the same security mechanisms as other file systems, including NTFS. The
    FAT file system comes in a number of different flavors; FAT12, FAT16, FAT32, and
    exFAT. It is also considered to be rather simpler file system in that it possesses
    relatively few data structures. With the FAT file system, the cluster or volume
    is broken up into clusters of a specific size, based on the version of FAT used.
    For example, for FAT12, the cluster size ranged from 512 bytes to 8 kilobytes
    (KB). For FAT16, the cluster size ranges from 512 bytes to 64 KB. Microsoft provides
    a Knowledge Base article that describes the FAT32 file system from a high level.
    As part of this description, Microsoft states that the FAT32 file system can support
    partitions up to 2 terabytes (TB), but that Windows 2000 only supports partitions
    up to 32 gigabytes (GB). Using 4-KB clusters, FAT32 uses space more efficiently;
    cluster sizes range from 512 bytes to 32 KB. The primary difference between FAT16
    and FAT32 is the logical partition size. On disk, the FAT file system begins with
    the boot sector (Microsoft Knowledge Base article 140418 provides a detailed description
    of the FAT boot sector) and is followed by FAT areas 1 and 2 (the second FAT area
    is a copy of the first), the root folder, files, and other folders. FAT maps to
    each cluster within the volume and tells the operating system how each cluster
    is used; whether it''s used, in use as part of a file, or the end of file. Files
    are laid out within the FAT volume in clusters and are referenced by 32-byte entries
    that contain the address of the starting cluster number for the file. If a file
    consumes more than one cluster, then the starting cluster ends with the number
    of the next cluster and so on until the last cluster is reached. This final cluster
    is marked with an end-of-indicator (0xffff). A FAT-formatted volume uses directories
    and a file allocation table to organize files and folders. The root folder (e.g.,
    C:\ is at a pre-specified location on the volume that the operating system knows
    where to find it. The folder contains a list of files and subdirectories on a
    floppy disk with their associated properties as shown in X-Ways Forensics.'
  merge: -1
  img_proc: true
