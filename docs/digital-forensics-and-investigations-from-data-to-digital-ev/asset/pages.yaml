    # 5.4 CHALLENGES TO THE ADOPTION OF CLOUD COMPUTING IN FORENSICS


    Cloud computing, with its assets and limitations, can also be a tough environment
    for traditionally trained information security professionals to understand that
    the network has loopholes and that traditional forensics does fit completely into
    a globally distributed cloud computing environment. This section identifies the
    most important issues pertaining to the cloud forensics.


    # 5.4.1 Data Security


    Data security is by the most challenging barrier to cloud adoption. Data is the
    most precious corporate asset, and companies want to know that their data is safe.
    Companies feel confident when they store data internally because they have full
    control over it. Although there is no guarantee that data is better protected
    internally comparing to public cloud. In fact, there is a possibility that data
    could be even safer in the public cloud because public'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'cloud providers may pose higher level of data security expertise comparing
    to their customers. When stored at public cloud, data can be compromised at several
    different data-lifecycle stages: transfer from the internal com-p network to the
    public cloud, when data is stored in the public cloud, and during data backup
    and restore processes.


    # 5.4.2 Loss of Control


    Overall, there is a general loss of control over the forensic investigation process
    simply due to the data being stored elsewhere, where it is inaccessible. This,
    in turn, hinders scene reconstruction as the lack of knowledge of where data is
    actually stored means that it is difficult to piece together a sequence of events
    and create a timeline. Loss of control factors can be subdivided into two types:
    technical loss of control, and organizational loss of control. Organizational
    loss of control is instead related mostly to human factors that may create barriers
    for the transformation to cloud computing. These factors may include the fears
    of some individuals of losing influence in the organization, the fear of job loss
    if the cloud transformation will functionally affect specific positions, and the
    simple inability to embrace change. The fear of losing control is common not only
    specifically to the cloud computing shift. Technical loss of control includes
    factors such as access control, software versions and updates, and control over
    the timing of technical operations such as data backups and restores, and is partially
    related to the data security issues discussed above. To address technical loss
    of control challenges, a cloud provider should offer company tools that provide
    full visibility into all cloud operations related to the company’s assets.


    # 5.4.3 Service-Level Agreements


    A service-level agreement (SLA) is a contractual document between a cloud service
    provider and a cloud customer that defines the terms of use of cloud resources.
    Most current service level agreements do not incorporate provisions regarding
    forensic investigations and the recovery of evidence from cloud environments.
    Some provisions regarding the forensic retrieval of evidence from a cloud environment
    should be incorporated in the agreements. These include data access during forensic
    investigations and stipulations regarding investigations in multi-jurisdictional
    and multi-tenant environments, including legal regulations, confidentiality, and
    privacy. At this time, the terms of service are typically prescribed by the cloud
    provider and are generally non-negotiable. The customer thus has little or no
    voice'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Cloud Computing and Digital Forensics 125


    regarding the data that the cloud service provider may and may not divulge. Ultimately,
    the onus is on the customer to negotiate a suitable service level agreement with
    the provider that addresses evidence retrieval from cloud environments as well
    as thorny issues such as multiple jurisdictions, data ownership and the establishment
    of a chain of custody.


    # 5.4.4 Performance


    Most cloud provider SLA agreements cover only infrastructure availability, not
    performance. If company applications have specific performance-related requirements,
    the company should discuss these requirements with cloud providers and confirm
    that these requirements can be supported. It is a good idea to include these requirements
    in an SLA contract, and it is standard practice to negotiate the SLA contact with
    the cloud service provider. It is the responsibility of the cloud customer to
    monitor cloud performance and ensure that it is compliant with requirements and
    SLAs. Also, collected performance metrics should be repeatedly analyzed. If cloud-hosted
    applications are used globally, it is important to monitor performance parameters
    such as network latency across all major customer locations.


    # 5.4.5 Cost Uncertainty


    There are hundreds of different cloud offerings on the market, and their pricing
    models vary considerably. This creates uncertainty and makes it difficult to estimate
    the real financial benefits of cloud computing. This uncertainty is particularly
    troublesome for non-technical people within organizations, who could be confused
    and scared away by the complexity of pricing models. Pricing differences between
    cloud providers may include charges for data storage, CPU, memory, IP address,
    domain name service, and load balancing, among others. There is no single standard
    for cloud services pricing, and it can be complicated to compare prices between
    providers. It is also difficult to predict future prices with specific provider—and,
    once company is locked in with one provider, it is not easy to move an entire
    infrastructure to other clouds.


    # 5.4.6 Data Portability/Integration


    It can be technically difficult to integrate data into a company’s internal data
    center with data located in a public off-premises cloud. Organizations that consider
    using a hybrid cloud where data is spread across both private and public clouds
    may face data integration problems: (a) Security issues'
  merge: -1
  img_proc: true
- pgno: 147
  md: '126 Digital Forensics and Investigation: From Data to Digital Evidence


    (data governance, network connectivity, etc.) (b) Problems with transaction integrity
    (inability to support transactions across clouds) (c) Difficulties handling large
    data volumes (d) Lack of mechanisms to detect changes to data (e) Data quality
    control issues (f) Problems originating the origins of data Each cloud provider
    offers a unique set of services and tools for operating and controlling its cloud.
    Learning a new cloud environment is similar to learning a new technology: it takes
    time and effort to master. This can be easier with IaaS based cloud services,
    on a infrastructure platform, but with PaaS or SaaS cloud platform, customers
    must learn the provider''s specific interfaces and APIs in order to interact and
    manage these platforms. There are no uniform cloud management software standards
    across different providers, and once a company invests time and resources to establish
    operations on one cloud platform, it can be difficult to switch. It is not recommended
    that a company become locked-in with a specific cloud provider, because this dependence
    may limit control over costs and technical hosting options. It is not uncommon
    for cloud providers to raise service prices or alter their technology offerings.


    # 5.4.7 Legal issues


    The final problem stems from the legal/people aspect of computer forensics in
    that whatever digital evidence is acquired from an investigation it must still
    be presented to a jury, who will pass judgment on a case. In conventional computer
    forensics investigators have to present their findings to the jury and this often
    requires that the investigator needs to explain, using technical jargon, how the
    evidence was acquired and what exactly the evidence means. This can prove challenging
    when dealing with conventional localized computer systems, let alone cloud data
    centers that may be several thousand miles away, running 40,000 VMs across 512
    servers accessed by 1000 tenants of which the accessed is is. This may prove far
    too much for a jury member to comprehend, given that on average the jury will
    only have a basic grasp of using a home PC.'
  merge: -1
  img_proc: true
