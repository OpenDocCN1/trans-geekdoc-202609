    in-time production and distribution. Drawbacks of community cloud: (a) Costs higher
    than public cloud. (b) Fixed amount of bandwidth and data storage is shared among
    all community members. Information is accessible to all parties within the community
    and is distributed among them securely. Community clouds can be hosted on- or
    off-site and are managed by one or more of the participating organizations or
    by a third party. Costs are shared across the group, so those involved get some
    of the profits of a private cloud at a lower price. In this model, responsibility
    for control of the cloud can prove challenging. The concept of community cloud
    is still in its early stages, picking up speedily among start-ups and small and
    medium term businesses.


    # Importance of Cloud Computing


    Traditionally, organizations have their own network storage servers where all
    the data and related services provided reside. This incurs hefty costs in terms
    of expense as well as performance and efficiency. Taking an example of Google,
    where there are millions of requests at a time coming to the server. If the server
    is hosted locally then there would be a large amount of load on the server serving
    all the clients efficiently. People nowadays expect the response from the server
    to be as quick as possible and the expectation is not even in seconds but in milliseconds
    or less. In order to fulfill such requests using a physical data store is difficult
    where the entire load in on the hosted server can be hosted on the web where we
    can have more throughout the services and with reasonable cost and increased efficiency
    and minimal maintenance. Every organization can have their private/public cloud
    hosted on the Internet. Flexibility, lower cost, and fast performance are the
    factors contributing to the success of cloud computing.


