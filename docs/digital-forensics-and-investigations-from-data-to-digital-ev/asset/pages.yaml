    capacity can be scaled quickly through a simple web service interface. EC2 provides
    many useful features for customers, including a mature and inexpensive billing
    system able to charge for computing at a very fine-grained level (memory usage,
    CPU usage, data transfer, etc.), deployment between multiple locations, elastic
