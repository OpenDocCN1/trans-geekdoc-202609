    # 6.2 SUBSCRIBER IDENTITY MODULE


    A SIM is a removable card designed for insertion into a device, such as a handset.
    SIMs originated with a set of specifications originally developed by the Conference
    of European Posts and Telecommunications and continued by the European Telecommunications
    Standards Institute for the GSM networks. One useful way to classify cellular
    devices is by whether they use a SIM. The GSM standards mandate the use of a SIM
    for the operation of the phone. Without it, a GSM phone cannot operate. In contrast,
    contemporary Code Division Multiple Access (CDMA) phones do not require a SIM.
    Instead, SIM functionality is incorporated directly within the device. A SIM is
    an essential component of a GSM cell phone that contains information particular
    to the user. A SIM is a special type of smart card that typically contains between
    16 and 64 KB of memory, a processor, and an operating'
  merge: -1
  img_proc: true
- pgno: 153
  md: system. A SIM uniquely identifies the subscriber, determines the phone’s number,
    and contains the algorithms needed to authenticate a subscriber to a network.
    A user can remove the SIM from one phone, insert it into another compatible phone,
    and resume use without the need to involve the network operator. The hierarchically
    organized file system of a SIM is used to store names and phone numbers, received
    and sent text messages, and network configuration information. Depending on the
    phone, some of this information may also coexist in the memory of the phone or
    reside entirely in the memory of the phone instead of the SIM. While SIMs are
    most widely used in GSM systems, compatible modules are also used in iDEN phones
    and UMTS user equipment (i.e., a USIM). Because of the flexibility, SIM offers
    GSM phones to port their identity and information between devices, eventually,
    all cellular phones are expected to include SIM capability. Though two sizes of
    SIMs have been standardized, only the smaller size shown left is broadly used
    in GSM phones today. The module has a width of 25 mm, a height of 15 mm, and a
    thickness of 0.76 mm, which is roughly the size of a postage stamp. Its eight-pin
    connectors are not aligned along a bottom edge as might be expected, but instead
    form a circular pad integral to the smart card chip, which is embedded in a plastic
    frame. Also, the slot for the SIM card is normally not accessible from the exterior
    of the phone as with a memory card. When a SIM is inserted into a phone and pin
    contact is made, a serial interface is used to communicate with the computing
    platform using half-duplex protocol. SIMs can be removed from a phone and read
    using a specialized SIM card reader and software. A SIM can also be placed in
    a standard-size smart card adapter and read using a conventional smart card reader.
    As with any smart card, its contents are protected and a PIN can be set to restrict
    access. Two PINs exist, sometimes called PIN1 and PIN2 or CHV1 and CHV2. These
    PINs can be modified or disabled by the user. The SIM allows only a preset number
    of attempts, usually three, to enter the correct PIN before attempts are blocked.
    Entering the unlocking key (PUK) resets the PIN number and the attempt counter.
    The PUK can be obtained from the service provider or the network operator based
    on the SIM’s identity, for instance, Integrated Circuit Card Identification (ICCID).
    If the number of attempts to enter the PUK exceeds a limit, normally 10 attempts,
    the card becomes blocked permanently. Besides other personal information, the
    SIM card holds information about where the subscriber last registered the system,
    charge information, and the services enabled on the device. The table below gives
    a comparison of standard features on three levels of mobile phone
