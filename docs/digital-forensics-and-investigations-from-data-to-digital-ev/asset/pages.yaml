  md: '# Network and Internet 57


    Network forensics tools must be able to process very large capture files, extract
    high-level information, and be able to authenticate each deduction. The network
    forensic module of PyFlag integrates all the above aspects as it delivers higher
    level information, while locating accurately where each piece of data was derived.
    Its architecture has the ability to recursively examine data at multiple levels
    and this is ideally suited for network protocols which are usually layered, with
    higher level protocols being executed before level protocols. The major functional
    components of the network forensic module are reassembler, packet handler, and
    stream dissectors. The PyFlag parses the peap files, extracts the packets, and
    breaks them them down at low-level protocols (IP, TCP, or User Datagram Protocol).
    Associated packets are collected into streams using reassembler. Higher level
    protocol dissectors such as HTTP and Internet Relay Chat (IRC) are then used to
    dissect these streams. The PyFlag does not have the capability of Hypertext Markup
    Language (HTML) rendering but it is also able to dissect explicit data in a higher
    level application. It manages each case autonomously and uses a unique identity
    for input and output sources while loading. It identifies the type, populates
    the virtual file system, and displays in tree structure. The outgoing and incoming
    traffic between various sources and destinations is displayed. The contents of
    each packet and protocol information can be viewed. The connections established,
    chat conversations, and Domain Name System (DNS) requests are also displayed for
