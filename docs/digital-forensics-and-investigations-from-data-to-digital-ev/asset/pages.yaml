    systems that are not Honeypots from attacks stemming from a compromised Honeypot,
    a Honewall with numerous data control and data capture features could be established.
    A Honewall would restrict the number of bound connections allowed per hour. It
    could also restrict the bandwidth range available to the attacker''s traffic.
    A TCP can also limit on-the-fly change malicious data packets that precisely target
    weaknesses on other systems and make them benign. A Honewall can capture and monitor
    all incoming, outgoing, and resident data traffic in the Honeynet. investigate
    the steps an attacker took to compromise a Honeypot and how a compromised Honeypot
    is being used further. In order to prevent a Honewall from blocking the communications,
    an attacker may install some encryption software to encrypt all technical and
    intelligence information between the attacker''s machine and the Honeypot. In
    such situations, a Honewall may not be able to decrypt the communications. To
    address this issue, logging software called Sebek has been recently developed.
    Sebek is a software tool integrated into each Honeypot and is part of the machine’s
    operating system. Sebek merely blocks the data after the attacker’s encryption
    software decrypts it. The decrypted information is directed to a remote server
    for further investigation.'
