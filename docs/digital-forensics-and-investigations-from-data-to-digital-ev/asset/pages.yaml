  img_proc: true
- pgno: 226
  md: '# Digital Evidence and Legal Proceedings 205


    the jury. This is also known as a challenge for a cause. A potential juror may
    be confronted with conviction of a serious crime, a financial interest in the
    result of a controversy, participation in another proceeding concerning one of
    the parties, a business, personal, family relationship, professional, or any other
    reason that may prejudice them.


    # 8.9.3 Opening Statements


    After the judge gives the preliminary instructions, the attorneys for the parties
    give their opening statements to the jury. During opening statements, the lawyers
    outline the issues in the case and tell the jury what they expect the evidence
    will prove during the trial. The purpose of the opening statement is to give a
    general picture of the facts and issues to help the jury better understand the
    evidence. The opening statements usually last ten to thirty minutes, although
    they are much longer. The judge can limit the time for opening statements. Usually,
    an attorney will present their opening statement as a story, giving a chronological
    overview of what happened from the party’s viewpoint. Although the attorneys will
    present the case in the best possible light for their clients, the opening statements
    should be factual, not argumentative. The opening statements are not evidence,
    and the attorneys should not offer their opinion of the evidence. Attorneys are
    not permitted to make statements that cannot be supported by the evidence expect
    to present during the trial.


    # 8.9.4 Plaintiff Testimony


    The first part of the actual trial proceeding consists of the plaintiffs presenting
    their witnesses and experts to present the arguments and justifications for the
    complaint. The defense is permitted to cross-examine each witness in an attempt
    to dismiss, discredit, or disprove the witnesses’ statements.


    # 8.9.5 Defense Testimony


    After the plaintiffs’ case is presented, the defendants present their case in
    the same way using witnesses and experts that present direct testimony, followed
    by cross-examination by the plaintiffs’ counsel.


    # 8.9.6 Redirection and Recall


    At the discretion of the judge, each witness can be redirected after cross-examination
    by either the counsel. If critical information is not divulged'
