  img_proc: true
- pgno: 190
  md: '# Computer Intrusions and Detection 169


    rely on the internal capacity for recording and monitoring of the server. If this
    server is not configured in practice and insufficiently controllable, you will
    have to change the configuration of a production engine. How do you predict the
    results of summing logging capability up? The host-based system is fairly expensive.
    Many organizations do not have the financial assets to secure the entire network,
