    3103a to allow a court to grant a delay of notice associated with the execution
    of a search warrant if it believes that providing immediate notification will
    have adverse effects. However, warrants issued under the mandate still prohibit
    the seizure of electronic information unless specifically authorized by a court.
    In addition to physically seizing computers, agents frequently perform electronic
