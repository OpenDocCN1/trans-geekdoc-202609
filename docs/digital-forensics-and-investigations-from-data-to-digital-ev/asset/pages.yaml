    # 5.2.4 Community Cloud


    In a community cloud, services are shared by organizations with similar data processing
    requirements and a common approach to privacy. A community cloud falls between
    public and private clouds with respect to the target set of consumers. It is somewhat
    similar to a private cloud, but the infrastructure and computational resources
    are exclusive to two or more organizations that have common privacy, security,
    and regulatory considerations, rather than a single organization. The community
    cloud aspires to combine distributed resource provision from green computing,
    distributed control from digital ecosystems and sustainability from green computing,
    with the use cases of cloud computing, while making greater use of self-management
    advances from autonomic computing and essentially replacing vendor clouds by shaping
    the underutilized resources of user machines to form a community cloud, with nodes
    potentially fulfilling all roles, consumer, producer, and most importantly coordinator.
    The advantages of community cloud include: (a) Cost of setting up a communal cloud
    versus individual private cloud can be cheaper by the division of costs among
    all participants. (b) Management of the community cloud can be outsourced to a
    cloud provider. The advantage here is that the provider would be an impartial
    third party that is bound by contract and has no preference to any of the clients
    involved other than what is contractually mandated. (c) Tools residing in the
    community cloud can be used to leverage the information stored to serve consumers
    and the supply chain, such as return tracking and just-'
  merge: -1
  img_proc: true
