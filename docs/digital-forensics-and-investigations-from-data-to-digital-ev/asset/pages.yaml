- pgno: 138
  md: '# Cloud Computing and Digital Forensics


    # (1) Google App Engine (GAE)


    Google App Engine (GAE)''s main goal is to efficiently run users'' applications.
    It maintains Python and Java runtime environments on application servers, along
    with some APIs to access Google services. The front end spread HTTP requests with
    load balancing and routing strategies based on the contents. Runtime systems running
    on application servers deal with the logic processing of applications and provide
    dynamic web content, while static pages are served by the shared Google infrastructure
    (Alon, 2009). To decouple the persistent data from application servers, GAE puts
    them into the Datastore instead of a local file system. Applications can integrate
    data services and other Google App Services, such as email, image storage and
    so through APIs provided by the GAE. In addition to the services, Google also
    provides some tools for developers to help them build web applications easily
    on GAE. However, since they are tightly connected to the Google infrastructure,
    there are some restrictions that limit the functionality and portability of the
    applications.


    # (2) Microsoft Azure


    Microsoft’s cloud strategy is to construct a cloud platform that users can move
    their applications to in a seamless way, and ensure its managed resources are
    accessible to both cloud services and on-premises applications. To achieve this,
    Microsoft introduced the Windows Azure Platform (WAP), which is composed of a
    cloud operating system named Windows Azure, and a set of supporting services,
    as shown in the figure below. Windows Azure is the main part of the WAP. It employs
    virtual machines as its runtime environments. The applications in Microsoft’s
    cloud offerings are divided into two types: Web role instances, which can serve
    web requests via the Internet information services (IIS); and Role instance, which
    can only receive messages from other Role instances or on-premises applications
    (Davis, 2009a). Windows Azure employs a “fabric controller” to manage all virtual
    machines and storage servers on the physical machines in a Microsoft data center.
    Similar to the GAE’s datasource, WAP also provides a database service called SQL
    Azure, to store data in the cloud. One feature of SQL Azure is that it provides
    a tool for data synchronization across on/or off premises databases. Infrastructure
    services supported by WAP through . NET services currently include access control
    and exposing services. Both are available for cloud and on-premises applications.'
  merge: -1
  img_proc: true
- pgno: 139
