- pgno: 113
  md: '# Digital Forensics Investigation: From Data to Digital Evidence


    systems. There are currently two variant HFS+ formats used to support journaling
    (HFJS) and case-sensitive file names (HFS). Like FAT16 and FAT32, the Macintosh
    HFS HFS Plus (HFS+) file systems use 16 and 32 bits, respectively, to address
    clusters on a disk. HFS supports a maximum of 216 (65536) clusters and HFS Plus
    has a maximum of 232 clusters. The main files comprising HFS are the Catalog and
    Extents Overflow files. The Catalog file is comparable to a master file table,
    containing records for each file and folder on the system with attributes such
    as date-time stamps. HFS represents time as the number of seconds since midnight,
    January 1, 1904, GMT. Records in the Catalog file are stored in a balanced tree
    (B-tree), which is a simple database that enables efficient searching. Each record
    in the Catalog file has a unique number node ID (CNID). The Catalog file has four
    types of records: folders, files, folder threads, and file threads. Although the
    format of folder and file records varies between HFS and HFS Plus, they contain
    similar information. Folder records contain the following fields, in addition
    to some details used by the system.


    Beyond these extended capabilities, because these variants do not change the function
    or artifacts available to the examiner, we will treat them all as “HFS+” throughout
    this chapter.


    # 4.5.2 File Attributes


    Macintosh operating systems can support file identification by both extension
    and type and creator codes. Forensic tools may not always display the type and
    creator codes, but they can be found in the Catalog tree alongside the other details
    about a file system object of interest.


    # 4.5.3 Data versus Resource Forks


    Macintosh file systems natively contain “forks” for a file. By default, a data
    and resource fork are maintained. Since this is somewhat of a foreign concept
    to other file systems, the two forks are often displayed as two files by forensic
    examination tools. The forensic tools often provide some form of notation along
    a resource fork to differentiate it and this fork often contains information that
    is much more difficult to understand on non-Macintosh systems.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Operating Systems in Forensic Investigation 93


    # 4.5.4 File Deletion


    Because of the nature of HFS, HFS+, and HFSX volumes, recovery of deleted file
    system details is particularly difficult. Unlike many Windows and Unix systems,
    recovery of deleted file system information on Macintosh systems is nearly impossible
    because nodes in the Catalog file are frequently overwritten. This is largely
    due to the B-tree balancing process in the Catalog file, which obliterates previous
    file system details. Standard data carving techniques can be used to recover file
    contents from Macintosh volumes, but only the data fork. This fork will retain
    what is a “typical” structure of media, document, application files with well-defined
    file formats, and header signatures that tools like Foremost rely on for carving.
    The real difficulty comes in further correlation; pairing the data for each fork
    would be very difficult, especially since a lot of the data in resource forks
    is undocumented. Additionally, tying specific files to a user can be difficult
    when file system details are no longer available in a Catalog file. Therefore,
    attributing a file to a particular user is often possible only through forensic
    examination of data contents.


    # 4.5.5 HFS+ Structures


    Hierarchical File System (HFS+) was developed by Apple to substitute the HFS as
    a default Macintosh system in 2000. HFS+ added some improvement over HFS storing
    32-bit length for block address and allocation mapping table, encoding the file
    and directory names using Unicode (UTF-16) and adding the concept of nforked.
    Furthermore, In Mac OS X 10.4 added the Access Control List (ACL) functionality
    to the HFS+ file system. HFS+ has different elements such as volume header, catalog
    file, extend overflow, allocation file, and startup file. Focusing on forensics,
    the most important element is the Catalog File, a B-tree structure that contains
    the metadata of all files and folders: user and group (HFSPlusBDIInfo), permission,
    file id, etc. Regarding the timestamp, it contains four different timestamp: the
    last time when the metadata of the file was modified (modified time of crime),
    the last time when the file was accessed (atime or access time), the last time
    when the data of the file was modified (mtime or modified time) and finally when
    the file was created (crime or created time). All the timestamp fields are unsigned
    32-bit integers (UInt32) value with the seconds since midnight, January first
    of 1904 in GMT time. Then, as an unsigned 32-bit integer, it can store timestamps
    until February 6, 2040 at 06:28:15 GMT. Also, the'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'developers must be aware to convert the GMT value into local time during the
    application implementation. Each file and directory in the Catalog File contains
    attributes called DataFork and ResourceFork. Both of them are HFPlusForkData type
    which contains two important attributes: logicalSize and totalBlocks. The logicalSize
    contains the bytes of the data assigned or reserved to the file (indeed the fork)
    whereas the totalBlocks contains the number of blocks allocated, used by the file.
    Referring to DataFork, it contains the location and the size of the reserve file
    to this whereas ResourceFork contains relevant data and resource information.
    Moreover, each file in the catalog contains a HFPlusExtentDescriptor that indicates
    the number of the first block (startBlock) and the number of blocks in that position
    (blockCount).


    The volume header is one of the core structures of an HFS+ volume. It stores data
    about the file system, including the allocation blocks size, the volume creation
    stamp, and the location of the special files required for HFS+ operation, discussed
    later in the chapter. The volume header is always located 1024 bytes before the
    start of the volume, with a backup copy located 1024 bytes before the end of the
    volume. HFS+ uses allocation blocks as data units. The size of a single allocation
    block is defined in the volume header, but 4K is a common value. Allocation blocks
    can be further grouped into clumps, which are somewhat similar to the block allocation
    groups found in Ext file systems under Linux. A file’s data are addressed in terms
    of extents. An HFS+ extent is simply a 4-byte pointer to a starting allocation
    block and a 4-byte value indicating the length of the extent. HFS+ files may have
    any number of data streams forks. The primary forks are the data fork and the
    resource fork. Generally, the data fork holds the actual content, while the resource
    fork will be empty or contain nonessential supporting information about the file.
    Additional forks may be created for a file for application specific purposes.
    We can use the fsstat command from the Sleuth Kit to read information about the
    file system from the volume header. We will use the nps-2009-hfsjst1/img.gen1.dmg
    file from the Digital Corpora as our test image while examining basic file system
    data.


    # FILE SYSTEM INFORMATION


    File System Type: HFS+

    File System Version: HFS+'
