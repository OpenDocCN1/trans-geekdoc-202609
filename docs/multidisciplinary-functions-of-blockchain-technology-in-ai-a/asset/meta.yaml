- - '##'
  - 1.5 区块链的类型
- - '###'
  - 许可区块（Permissioned Blockchains）：也称为私有区块链，它们是一个封闭的生态系统，访问限于特定人群。这些人员进行的交易对外部世界不可见。通常这类区块链用于内部，该组织认为数据过于敏感，不宜公开。此类区块链中进行的交易，你需要控制的权限。由于中心实体的存在，这些区块链在本质上更加中心化。
- - '###'
  - 无许可区块链（Permissionless Blockchains）：也称为公共区块链，是区块链的开源变体，允许任何人作为全节点、轻节点、社区成员参与。在这里，所有进行的交易在本质上都是透明的。外部世界都可以查看交易。这些区块链与私有区块链不同，在本质上完全去中心化的，没有任何机构控制。由于缺乏中心机构，这些区块链需要某种代币（该区块链的货币）来激励和奖励参与者。
