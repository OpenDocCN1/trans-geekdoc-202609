    While Scikit-learn is a valuable library for traditional machine learning tasks,
    its limitations become apparent when it comes to building deep learning models.
    Deep learning requires flexibility, scalability, and extensive customization,
    which are better addressed by specialized deep learning frameworks like PyTorch.
    By leveraging PyTorch''s capabilities, practitioners can overcome the limitations
    of Scikit-learn and build more sophisticated and efficient deep learning models
    for a wide range of applications. While Scikit-learn still has its place in the
    machine learning ecosystem, understanding its limitations is essential for choosing
    the right tools and frameworks for deep learning tasks.


    # Chapter 4


    # Deep Learning Techniques with Scikit-learn: A Hands-on Approach


    While Scikit-learn is primarily known for traditional machine learning algorithms,
    it also offers a basic neural network module for building simple deep learning
    models. In this guide, we''ll explore how to leverage Scikit-learn''s neural network
    module to build and train neural networks for classification and regression tasks.
    We''ll provide code examples and demonstrate how to use Scikit-learn alongside
    PyTorch for comparison.


    Building a Simple Neural Network with Scikit-learn:


    Scikit-learn''s neural network module provides a simple interface for building
    feedforward neural networks. Let''s start by building a basic neural network for
    a classification task using Scikit-learn:


    \`\`\`python


    from sklearn.datasets import load\_iris


    from sklearn.model\_selection import train\_test\_split


    from sklearn.preprocessing import StandardScaler


    from sklearn.neural\_network import MLPClassifier


    from sklearn.metrics import accuracy\_score


    \# Load the Iris dataset


    iris = load\_iris()


    X, y = iris.data, iris.target


    \# Preprocessing: Scaling data and splitting into train and test sets


    scaler = StandardScaler()


    X\_scaled = scaler.fit\_transform(X)


    Performing a train-test split on the scaled data, with X\_train, X\_test, y\_train,
    and y\_test as the resultant variables, using a test size of 0.2 and a random
    state of 42.


    \# Build a simple neural network classifier with Scikit-learn


    model = MLPClassifier(hidden\_layer\_sizes=(100,), max\_iter=1000, random\_state=42)


    model.fit(X\_train, y\_train)


    \# Evaluate the model


    y\_pred = model.predict(X\_test)


    accuracy = accuracy\_score(y\_test, y\_pred)


    print("Accuracy:", accuracy)


    \`\`\`


    In this example, we load the Iris dataset, preprocess the data by scaling it,
    split it into training and test sets, and then build a simple neural network classifier
    using Scikit-learn''s \`MLPClassifier\`. We proceed to train the model using the
    training data and assess its performance using the test data.


    Comparing with PyTorch:


    Let''s compare the above Scikit-learn implementation with a similar neural network
    built using PyTorch:


    \`\`\`python


    import torch


    import torch.nn as nn


    import torch.optim as optim


    import numpy as np


    \# Define a simple neural network architecture with PyTorch


    class SimpleNN(nn.Module):


    def \_\_init\_\_(self):


    super(SimpleNN, self).\_\_init\_\_()


    self.fc1 = nn.Linear(4, 100)


    self.fc2 = nn.Linear(100, 3)


    def forward(self, x):


    x = torch.relu(self.fc1(x))


    x = self.fc2(x)


    return x


    \# Convert data to PyTorch tensors


    X\_train\_tensor = torch.tensor(X\_train, dtype=torch.float32)


    X\_test\_tensor = torch.tensor(X\_test, dtype=torch.float32)


    y\_train\_tensor = torch.tensor(y\_train, dtype=torch.long)


    y\_test\_tensor = torch.tensor(y\_test, dtype=torch.long)


    \# Instantiate the neural network model


    model = SimpleNN()


    \# Define loss function and optimizer


    criterion = nn.CrossEntropyLoss()


    optimizer = optim.Adam(model.parameters(), lr=0.001)


    \# Train the model


    for epoch in range(1000):


    optimizer.zero\_grad()


    outputs = model(X\_train\_tensor)


    loss = criterion(outputs, y\_train\_tensor)


    loss.backward()


    optimizer.step()


    \# Evaluate the model


    with torch.no\_grad():


    outputs = model(X\_test\_tensor)


    \_, predicted = torch.max(outputs, 1)


    accuracy = (predicted == y\_test\_tensor).sum().item() / len(y\_test\_tensor)


    print("Accuracy:", accuracy)


    \`\`\`


    In this PyTorch implementation, we define a simple neural network architecture
    using PyTorch''s \`nn.Module\` class. We then convert the data to PyTorch tensors,
    define the loss function and optimizer, and train the model using a simple training
    loop. Finally, we evaluate the model on the test data and calculate the accuracy.


    While Scikit-learn''s neural network module provides a simple interface for building
    basic neural networks, it lacks the flexibility and customization options of deep
    learning frameworks like PyTorch. Scikit-learn''s neural network module is suitable
    for simple classification and regression tasks, but for more complex deep learning
    tasks requiring extensive customization and scalability, PyTorch is the preferred
    choice. By understanding the capabilities and limitations of both Scikit-learn
    and PyTorch, practitioners can choose the right tool for the task at hand and
    build effective deep learning models for a wide range of applications.


    # Implementing Multi-Layer Perceptrons (MLPs) for solving classification and regression
    problems


    Multi-Layer Perceptrons (MLPs) are a type of feedforward neural network composed
    of multiple layers of nodes (neurons) and non-linear activation functions. MLPs
    can be used for both classification and regression tasks by adjusting the output
    layer and loss function accordingly. In this guide, we''ll explore how to implement
    MLPs for classification and regression problems using both Scikit-learn and PyTorch.


    Implementing MLPs for Classification with Scikit-learn:


    Scikit-learn provides a convenient \`MLPClassifier\` class for building MLPs for
    classification tasks. Let''s see how to implement an MLP for a classification
    problem using the Iris dataset:


    \`\`\`python


    from sklearn.datasets import load\_iris


    from sklearn.model\_selection import train\_test\_split


    from sklearn.preprocessing import StandardScaler


    from sklearn.neural\_network import MLPClassifier


    from sklearn.metrics import accuracy\_score


    \# Load the Iris dataset


    iris = load\_iris()


    X, y = iris.data, iris.target


    \# Preprocessing: Scaling data and splitting into train and test sets


    scaler = StandardScaler()


    X\_scaled = scaler.fit\_transform(X)


    Performing a train-test split on the scaled data, with X\_train, X\_test, y\_train,
    and y\_test as the resultant variables, using a test size of 0.2 and a random
    state of 42.


    \# Build an MLP classifier with Scikit-learn


    model = MLPClassifier(hidden\_layer\_sizes=(100,), max\_iter=1000, random\_state=42)


    model.fit(X\_train, y\_train)


    \# Evaluate the model


    y\_pred = model.predict(X\_test)


    accuracy = accuracy\_score(y\_test, y\_pred)


    print("Accuracy:", accuracy)


    \`\`\`


    In this example, we load the Iris dataset, preprocess the data by scaling it,
    split it into training and test sets, and then build an MLP classifier using Scikit-learn''s
    \`MLPClassifier\`. We proceed to train the model using the training data and assess
    its performance using the test data.


