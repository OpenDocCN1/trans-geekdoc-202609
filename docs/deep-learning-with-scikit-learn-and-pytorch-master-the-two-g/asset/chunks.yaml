  fmt: '

    ### 13. Dropout

    A regularization technique used to prevent overfitting in neural networks by randomly
    dropping a fraction of neurons during training. It helps improve the generalization
    ability of the model by encouraging robustness and reducing reliance on specific
    neurons.


    ### 14. Autoencoder

    A type of neural network architecture used for unsupervised learning, particularly
    in dimensionality reduction and feature learning tasks. It consists of an encoder
    network that compresses input data into a lower-dimensional representation and
    a decoder network that reconstructs the original input from the compressed representation.


    ### 15. Fine-tuning

    A transfer learning technique where a pre-trained model is further trained on
    a new task or dataset with a small learning rate. Fine-tuning allows the model
    to adapt its learned representations to the specific characteristics of the new
    data while leveraging knowledge gained from the original task.


    This glossary provides a foundation for understanding key concepts and terminology
    in deep learning, facilitating further exploration and learning in the field.

    '
  trans: '


    ### 13. Dropout

    一种正则化技术，通过在训练过程中随机丢弃部分神经元来防止神经网络的过拟合。它通过增强鲁棒性和减少对特定神经元的依赖，帮助提高模型的泛化能力。


    ### 14. 自动编码器 (Autoencoder)

    一种用于无监督学习的神经网络架构，特别适用于降维和特征学习任务。它由一个编码器网络和一个解码器网络组成，前者将输入数据压缩为低维表示，后者则从压缩表示重建原始输入。


    ### 15. 微调 (Fine-tuning)

    一种迁移学习技术，通过较小的学习率在新任务或数据集上对预训练模型进行进一步训练。微调允许模型在利用原始任务所得知识的同时，使其学习到的表示适应新数据的特定特征。


    本术语表为理解深度学习中的核心概念和术语提供了基础，便于在该领域进行进一步的探索和学习。


