    # Building Deep Learning Architectures with PyTorch


    PyTorch provides a flexible and intuitive framework for building deep learning
    architectures, allowing practitioners to implement popular models like Convolutional
    Neural Networks (CNNs) and Recurrent Neural Networks (RNNs) with ease. In this
    guide, we''ll explore how to implement these architectures in PyTorch, covering
    their construction, training, and evaluation.


    Implementing Convolutional Neural Networks (CNNs):


    CNNs are widely used for tasks involving image data, such as image classification,
    object detection, and image segmentation. Let''s see how to implement a simple
    CNN architecture for image classification using PyTorch:


    \`\`\`python


    import torch


    import torch.nn as nn


    class CNN(nn.Module):


    def \_\_init\_\_(self):


    super(CNN, self).\_\_init\_\_()


    self.conv1 = nn.Conv2d(1, 32, 3, padding=1)  # 1 input channel, 32 output channels,
    3x3 kernel


    self.conv2 = nn.Conv2d(32, 64, 3, padding=1) # 32 input channels, 64 output channels,
    3x3 kernel


    self.pool = nn.MaxPool2d(2, 2)              # Max pooling layer with kernel size
    2x2


    self.fc1 = nn.Linear(64 \* 7 \* 7, 128)       # Fully connected layer with 128
    output units


    self.fc2 = nn.Linear(128, 10)               # Output layer with 10 units (for
    10 classes)


    def forward(self, x):


    x = self.pool(torch.relu(self.conv1(x)))     # Apply convolution, ReLU activation,
    and max pooling


    x = self.pool(torch.relu(self.conv2(x)))


    x = x.view(-1, 64 \* 7 \* 7)                   # Flatten the feature maps


    x = torch.relu(self.fc1(x))                  # Apply fully connected layers


    x = self.fc2(x)


    return x


    \`\`\`


    In this example, we define a class \`CNN\` that inherits from \`nn.Module\`. The
    architecture consists of two convolutional layers (\`conv1\` and \`conv2\`) with
    ReLU activation functions, followed by max-pooling layers (\`pool\`). We then
    flatten the feature maps and pass them through fully connected layers (\`fc1\`
    and \`fc2\`) to obtain the final output.


