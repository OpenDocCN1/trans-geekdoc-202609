    In this example, we define a class \`NeuralNetwork\` that inherits from \`nn.Module\`.
    We define three fully connected layers (\`fc1\`, \`fc2\`, and \`fc3\`) representing
    the input, hidden, and output layers, respectively. We apply the ReLU activation
    function to the output of the first two hidden layers using \`torch.relu\`.


    Training the Neural Network:


    Once the architecture is defined, we can proceed to train the neural network using
    gradient-based optimization. We will utilize the MNIST dataset for training, comprising
