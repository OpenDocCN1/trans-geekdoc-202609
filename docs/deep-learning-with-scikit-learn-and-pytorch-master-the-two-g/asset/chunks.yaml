    \   out = self.fc(out)\n        return out\n\n# 创建 CNN 模型实例\nmodel = SimpleCNN(num_classes=10)\n\
    # 定义损失函数和优化器\ncriterion = nn.CrossEntropyLoss()\noptimizer = optim.Adam(model.parameters(),\
    \ lr=0.001)\n```\n\n在这个示例中，我们使用 PyTorch 的 `nn.Module` 类定义了一个简单的 CNN 架构，由卷积层、`ReLU`\
    \ 激活函数、最大池化层和全连接层组成。\n\n## 循环神经网络 (RNNs)\n\n循环神经网络 (RNNs) 用于处理序列数据，例如时间序列数据、文本数据和语音数据。RNN\
    \ 能够通过维持在处理新输入时递归更新的隐藏状态，捕捉序列数据中的时间依赖关系。\n\n```python\nimport torch\nimport torch.nn\
    \ as nn\nimport torch.optim as optim\n\n# Example: 使用 PyTorch 实现一个简单的 RNN 架构\n\
    \nclass SimpleRNN(nn.Module):\n    def __init__(self, input_size, hidden_size,\
    \ num_layers, num_classes):\n        super(SimpleRNN, self).__init__()\n     \
    \   self.hidden_size = hidden_size\n        self.num_layers = num_layers\n   \
    \     self.rnn = nn.RNN(input_size, hidden_size, num_layers, batch_first=True)\n\
    \        self.fc = nn.Linear(hidden_size, num_classes)\n\n    def forward(self,\
    \ x):\n        h0 = torch.zeros(self.num_layers, x.size(0), self.hidden_size).to(x.device)\n\
    \        out, _ = self.rnn(x, h0)\n        out = self.fc(out[:, -1, :])\n    \
    \    return out\n\n# 实例化 RNN 模型\nmodel = SimpleRNN(input_size=28, hidden_size=128,\
    \ num_layers=2, num_classes=10)\n```\n\n"
