    from torchtext.data.utils import get\_tokenizer


    from collections import Counter


    from torchtext.vocab import Vocab


    from torch.utils.data import DataLoader


    \# Define tokenizer and preprocessing


    tokenizer = get\_tokenizer(''basic\_english'')


    train\_iter = AG\_NEWS(split=''train'')


    \# Build vocabulary


    counter = Counter()


    for (label, line) in train\_iter:


    counter.update(tokenizer(line))


    vocab = Vocab(counter)


    \# Define model architecture


    class TextClassifier(nn.Module):


    def \_\_init\_\_(self, vocab\_size, embed\_dim, num\_class):


    super(TextClassifier, self).\_\_init\_\_()


    self.embedding = nn.EmbeddingBag(vocab\_size, embed\_dim)


    self.fc = nn.Linear(embed\_dim, num\_class)


    def forward(self, text, offsets):


    embedded = self.embedding(text, offsets)


    return self.fc(embedded)


    \# Initialize model and optimizer


    model = TextClassifier(len(vocab), 128, 4)


    optimizer = optim.SGD(model.parameters(), lr=4.0)


    \# Define loss function


    criterion = nn.CrossEntropyLoss()


    \# Train model


    for epoch in range(5):


    for (label, text) in train\_iter:


    text\_tensor = torch.tensor(\[vocab\[token\] for token in tokenizer(text)\], dtype=torch.long)


    label\_tensor = torch.tensor(\[label\], dtype=torch.long)


    optimizer.zero\_grad()


    output = model(text\_tensor.unsqueeze(0), torch.tensor(\[0\]))


    loss = criterion(output, label\_tensor)


    loss.backward()


    optimizer.step()


    \`\`\`


