    self.fc2 = nn.Linear(128, 64)   # Hidden layer: 128 input units, 64 hidden units


    self.fc3 = nn.Linear(64, 10)    # Output layer: 64 input units, 10 output units
    (for 10 classes)


    def forward(self, x):


    x = torch.relu(self.fc1(x))     # Apply ReLU activation to the first hidden layer


    x = torch.relu(self.fc2(x))     # Apply ReLU activation to the second hidden layer


    x = self.fc3(x)                 # Output layer


    return x


