- raw: 'Fine-tuning pre-trained models with Scikit-learn is a powerful technique for
    adapting pre-trained models to specific tasks with minimal additional training.
    Whether it''s image classification using pre-trained CNN models or text classification
    using pre-trained word embeddings, Scikit-learn provides the necessary tools for
    fine-tuning and optimizing the performance of pre-trained models for various tasks.
    By leveraging pre-trained models and fine-tuning techniques, practitioners can
    achieve better performance and efficiency in their machine learning and deep learning
    projects.


    # Chapter 5


    # An Introduction to PyTorch: An Empowering Framework for Deep Learning


    PyTorch is a popular open-source deep learning framework developed by Facebook''s
    AI Research lab (FAIR). It provides a flexible and dynamic approach to building
    and training neural networks, making it a preferred choice for researchers and
    practitioners in the deep learning community. In this guide, we''ll introduce
    you to PyTorch, covering installation, environment setup, and basic syntax to
    get you started on your deep learning journey.


    Installation and Environment Setup:


    Installing PyTorch is straightforward and can be done via pip, the Python package
    manager. Initially, confirm that Python is installed on your system. Then, run
    the following command in your terminal or command prompt to install PyTorch:


    \`\`\`bash


    pip install torch torchvision torchaudio


    \`\`\`


    This command will install the latest version of PyTorch along with torchvision,
    which provides utility functions for working with image data, and torchaudio,
    which provides utility functions for working with audio data.


    Once PyTorch is installed, you can start using it in your Python environment by
    importing the necessary modules:


    \`\`\`python


    import torch


    import torchvision


    import torchaudio


    \`\`\`


    Basic Syntax and Tensor Operations:


    PyTorch revolves around the concept of tensors, which are multidimensional arrays
    similar to NumPy arrays but with additional features optimized for deep learning
    computations. Let''s explore some basic tensor operations in PyTorch:


    \`\`\`python


    \# Create a tensor


    x = torch.tensor(\[\[1, 2\], \[3, 4\]\])


    \# Print the tensor


    print("Tensor x:")


    print(x)


    \# Get the shape of the tensor


    print("Shape of x:", x.shape)


    \# Access elements of the tensor


    print("Element at index (0, 1):", x\[0, 1\])


    \# Perform tensor operations


    y = torch.tensor(\[\[5, 6\], \[7, 8\]\])


    z = x + y


    print("Addition of tensors x and y:")


    print(z)


    \`\`\`


    In this example, we create a tensor \`x\` with values \[\[1, 2\], \[3, 4\]\],
    print its shape and access individual elements. We then create another tensor
    \`y\`, perform element-wise addition with tensors \`x\` and \`y\`, and print the
    result.


    Creating and Training Neural Networks:


    One of the key features of PyTorch is its ability to easily define and train neural
    networks. Let''s see how to create a simple neural network and train it on a toy
    dataset:


    \`\`\`python


    import torch.nn as nn


    import torch.optim as optim


    \# Define a simple neural network architecture


    class SimpleNN(nn.Module):


    def \_\_init\_\_(self):


    super(SimpleNN, self).\_\_init\_\_()


    self.fc1 = nn.Linear(2, 10)


    self.fc2 = nn.Linear(10, 1)


    def forward(self, x):


    x = torch.relu(self.fc1(x))


    x = self.fc2(x)


    return x


    \# Instantiate a neural network object


    model = SimpleNN()


    \# Define loss function and optimizer


    criterion = nn.MSELoss()


    optimizer = optim.SGD(model.parameters(), lr=0.01)


    \# Generate toy dataset


    X\_train = torch.tensor(\[\[0, 0\], \[0, 1\], \[1, 0\], \[1, 1\]\], dtype=torch.float32)


    y\_train = torch.tensor(\[\[0\], \[1\], \[1\], \[0\]\], dtype=torch.float32)


    \# Train the model


    for epoch in range(1000):


    optimizer.zero\_grad()


    outputs = model(X\_train)


    loss = criterion(outputs, y\_train)


    loss.backward()


    optimizer.step()


    \# Print the trained model''s predictions


    print("Predictions after training:")


    print(model(X\_train))


    \`\`\`


    In this example, we define a simple neural network architecture with two fully
    connected layers (\`fc1\` and \`fc2\`). We then create an instance of the neural
    network, define a loss function (Mean Squared Error) and an optimizer (Stochastic
    Gradient Descent), and generate a toy dataset (\`X\_train\` and \`y\_train\`).
    Finally, we train the model for 1000 epochs and print its predictions on the training
    data.


    PyTorch provides a powerful and flexible framework for deep learning with an intuitive
    syntax that makes it easy to build and train neural networks. In this guide, we
    covered the basics of PyTorch, including installation, environment setup, basic
    tensor operations, and creating and training neural networks. Armed with this
    knowledge, you''re now ready to dive deeper into the world of deep learning with
    PyTorch and explore more advanced topics and techniques.


    # Understanding tensors, the fundamental data structures in PyTorch


    Tensors are the fundamental data structures in PyTorch, serving as the primary
    building blocks for constructing and manipulating neural networks. Similar to
    NumPy arrays, tensors are multidimensional arrays that can store numerical data.
    However, tensors provide additional functionalities optimized for deep learning
    computations, such as automatic differentiation for gradient-based optimization.
    In this guide, we''ll explore tensors in PyTorch, covering their creation, manipulation,
    and common operations.


    Creating Tensors:


    PyTorch provides several ways to create tensors, including from Python lists,
    NumPy arrays, or directly from data. Let''s explore some examples:


    \`\`\`python


    import torch


    \# Generate a tensor using a Python list


    tensor\_list = torch.tensor(\[1, 2, 3, 4\])


    print("Tensor from list:", tensor\_list)


    \# Create a tensor from a NumPy array


    import numpy as np


    numpy\_array = np.array(\[\[1, 2\], \[3, 4\]\])


    tensor\_numpy = torch.tensor(numpy\_array)


    print("Tensor from NumPy array:", tensor\_numpy)


    \# Create a tensor of zeros with a specified shape


    tensor\_zeros = torch.zeros(2, 3)


    print("Tensor of zeros:", tensor\_zeros)


    \# Create a tensor of ones with a specified shape


    tensor\_ones = torch.ones(3, 2)


    print("Tensor of ones:", tensor\_ones)


    \# Create a tensor with random values from a uniform distribution


    tensor\_uniform = torch.rand(2, 2)


    print("Tensor with random values (uniform distribution):", tensor\_uniform)


    \# Create a tensor with random values from a normal distribution


    tensor\_normal = torch.randn(2, 2)


    print("Tensor with random values (normal distribution):", tensor\_normal)


    \`\`\`


    In this example, we create tensors from Python lists, NumPy arrays, and using
    PyTorch''s built-in functions like \`torch.zeros\`, \`torch.ones\`, \`torch.rand\`,
    and \`torch.randn\`.


    Manipulating Tensors:


    Tensors in PyTorch support various operations for manipulation, such as reshaping,
    slicing, and concatenation. Let''s see some examples:


    \`\`\`python


    \# Reshaping tensors


    tensor\_reshape = torch.tensor(\[\[1, 2\], \[3, 4\]\])


    tensor\_reshape = tensor\_reshape.view(1, 4)


    print("Reshaped tensor:", tensor\_reshape)


    \# Slicing tensors


    tensor\_slice = torch.tensor(\[\[1, 2, 3\], \[4, 5, 6\]\])


    print("First row of tensor:", tensor\_slice\[0\])


    print("First column of tensor:", tensor\_slice\[:, 0\])


    \# Concatenating tensors


    tensor\_concat = torch.cat((tensor\_slice, tensor\_slice), dim=1)


    print("Concatenated tensor:", tensor\_concat)


    \`\`\`


    In this example, we reshape a tensor using the \`view\` method, slice tensors
    to extract rows and columns, and concatenate tensors along a specified dimension
    using the \`torch.cat\` function.


    Common Operations on Tensors:


    Tensors in PyTorch support various common mathematical operations, such as addition,
    multiplication, and matrix operations. Let''s see some examples:


    \`\`\`python


    \# Element-wise addition


    tensor\_add = torch.tensor(\[\[1, 2\], \[3, 4\]\])


    tensor\_add = tensor\_add + 5


    print("Tensor after addition:", tensor\_add)'
