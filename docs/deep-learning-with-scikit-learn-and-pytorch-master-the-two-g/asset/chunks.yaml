    \ like `ImageNet`. These pre-trained models can be easily loaded and fine-tuned\
    \ for specific tasks using transfer learning. Let's see how to perform transfer\
    \ learning with a pre-trained `ResNet` model in PyTorch:\n\n```python\nimport\
    \ torch\nimport torch.nn as nn\nimport torchvision.models as models\n\n# Load\
    \ pre-trained ResNet model\npretrained_resnet = models.resnet18(pretrained=True)\n\
    \n# Modify the final fully connected layer for the new task\nnum_classes = 10\
    \  # Number of classes in the new dataset\npretrained_resnet.fc = nn.Linear(pretrained_resnet.fc.in_features,\
    \ num_classes)\n\n# Freeze the parameters of the pre-trained layers\nfor param\
    \ in pretrained_resnet.parameters():\n    param.requires_grad = False\n\n# Unfreeze\
    \ the parameters of the final fully connected layer\npretrained_resnet.fc.requires_grad\
    \ = True\n\n# Define loss function and optimizer\ncriterion = nn.CrossEntropyLoss()\n\
    optimizer = torch.optim.Adam(pretrained_resnet.fc.parameters(), lr=0.001)\n```\n\
    \nIn this example, we load a pre-trained `ResNet-18` model and replace its final\
    \ fully connected layer with a new one suitable for our target task, which has\
    \ 10 classes. We freeze the parameters of the pre-trained layers to prevent them\
    \ from being updated during training, except for the final fully connected layer.\
    \ Finally, we define the loss function and optimizer for training the model on\
    \ the new task.\n"
  trans: "\n\n过拟合发生在模型学习于记忆训练数据而非泛化到未见数据时，导致其在新样本上的性能较差。为了解决这个问题，可以采用如正则化和早停等各种技术。在本指南中，我们将探索如何在\
    \ PyTorch 中实现这些技术，以防止过拟合并提高深度学习模型的泛化能力。\n\n## 正则化\n\n正则化是一种通过在损失函数中添加惩罚项来防止过拟合的技术，该项会抑制模型产生大的权重。L2\
    \ 正则化被称为权重衰减（weight decay），是一种常见的正则化形式，它对权重的平方幅度进行惩罚。让我们看看如何在 PyTorch 中实现 L2 正则化：\n\
    \n```python\nimport torch.nn as nn\n\n# 定义一个带有 L2 正则化的神经网络\n\nclass RegularizedNN(nn.Module):\n\
    \    def __init__(self):\n        super(RegularizedNN, self).__init__()\n    \
    \    self.fc1 = nn.Linear(784, 128)\n        self.fc2 = nn.Linear(128, 10)\n \
    \       self.dropout = nn.Dropout(0.5)  # 用于正则化的 Dropout 层\n\n    def forward(self,\
    \ x):\n        x = torch.relu(self.fc1(x))\n        x = self.dropout(x)      \
    \       # 应用 dropout 正则化\n        x = self.fc2(x)\n        return x\n```\n\n在这个示例中，我们定义了一个带有用于正则化的\
    \ dropout 层（`dropout`）的神经网络。Dropout 在训练期间随机将一部分输入单元设置为零，这通过强制模型学习冗余表示来帮助防止过拟合。\n\
    \n## 早停\n\n早停是一种通过在训练期间监控模型在验证集上的性能，并在性能开始变化时停止训练过程来防止过拟合的技术。让我们看看如何在 PyTorch\
    \ 中实现早停：\n\n```python\nimport numpy as np\n\n# 在训练循环内部：\nbest_loss = np.inf\n\
    patience = 5\ncounter = 0\nfor epoch in range(num_epochs):\n    # 训练迭代\n    #\
    \ 计算验证损失\n    validation_loss = compute_validation_loss(model, validation_loader)\n\
    \    if validation_loss < best_loss:\n        best_loss = validation_loss\n  \
    \      counter = 0\n    else:\n        counter += 1\n    if counter >= patience:\n\
    \        print(\"Early stopping triggered!\")\n        break\n```\n\n在这个示例中，我们在训练期间监控验证损失，并跟踪验证损失没有改进的\
    \ epoch 数量（`counter`）。如果验证损失在一定数量的 epoch 内（由 `patience` 定义）没有得到改进，则触发早停并停止训练过程。\n\
    \n实现正则化和早停等技术对于防止深度学习模型的过拟合至关重要。Dropout 和 L2 正则化等正则化技术有助于防止模型记忆训练数据，而早停则通过在模型在验证集上的性能开始变化时停止训练过程来防止模型过拟合。通过将这些技术整合到训练过程中，从业人员可以在\
    \ PyTorch 中构建出更健壮、更具泛化能力的深度学习模型。\n\n# 第 8 章\n\n## 使用预训练模型的迁移学习：利用现有知识\n\n迁移学习是深度学习中的一种技术，其中在某个任务上训练的模型被被用作训练另一个不同但相关任务的模型的起点。它利用了从源任务中获得的知识来提高目标任务的性能。在本指南中，我们将介绍迁移学习并探索其在深度学习中的优势，并附带\
    \ PyTorch 示例。\n\n### 迁移学习简介\n\n在传统的机器学习中，模型使用标记数据在特定任务上从零开始训练。然而，在深度学习中，从零开始训练模型需要大量的标记数据和计算资源，而这些资源并不总是可用。迁移学习通过允许我们重用预训练模型来解决这一挑战，这些模型已经从大规模数据学习了有用的特征，可以作为相关任务上训练新模型的起点。\n\
    \n### 迁移学习的优势\n\n1. **更快的训练**：由于模型从预习的特征开始，迁移学习显著减少了在新任务上获得良好性能所需的时间。\n2. **提高性能**：通过利用源任务的见解，迁移学习通常能增强目标任务的泛化能力，特别是在目标任务标记数据稀少的情况下。\n\
    3. **减少数据依赖**：迁移学习减少了对大型标记数据集的依赖，适用于标记数据稀缺或获取昂贵的场景。\n\n### PyTorch 中使用预训练模型的迁移学习\n\
    \nPyTorch 提供了多种预训练模型，如 `ResNet`、`VGG` 和 `MobileNet`，这些模型是在大规模图像数据集上训练的。这些预训练模型可以通过迁移学习轻松加载并微调特定任务。让我们看看如何在\
    \ PyTorch 中使用预训练的 `ResNet` 模型进行迁移学习：\n\n```python\nimport torch\nimport torch.nn\
    \ as nn\nimport torchvision.models as models\n\n# 加载预训练的 ResNet 模型\npretrained_resnet\
    \ = models.resnet18(pretrained=True)\n\n# 为新任务修改最后一个全连接层\nnum_classes = 10  #\
    \ 新数据集的类别数\npretrained_resnet.fc = nn.Linear(pretrained_resnet.fc.in_features,\
    \ num_classes)\n\n# 冻结预训练层的参数\nfor param in pretrained_resnet.parameters():\n\
    \    param.requires_grad = False\n\n# 解冻最后一个全连接层的参数\npretrained_resnet.fc.requires_grad\
    \ = True\n\n# 定义损失函数和优化器\ncriterion = nn.CrossEntropyLoss()\noptimizer = torch.optim.Adam(pretrained_resnet.fc.parameters(),\
    \ lr=0.001)\n```\n\n在这个示例中，我们加载了一个预训练的 `ResNet-18` 模型，并将其最后一个全连接层替换为适用于我们目标任务（10\
    \ 类）的新层。我们冻结了预训练层的参数，以防止它们在训练期间更新，最后一个全连接层除外。最后，我们定义了在新任务上训练模型所需的损失函数和优化器。\n\n"
