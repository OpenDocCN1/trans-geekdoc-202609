    \\right)} \\\\right\\\\rbrack + \\\\left( {1 - y\\_{i}} \\\\right)\\\\ln\\\\left\\\
    \\lbrack {1 - \\\\frac{1}{1 + \\\\exp\\\\left( {- x\\_{i}\\\\beta} \\\\right)}}\
    \ \\\\right\\\\rbrack} \\\\right\\\\}}}\\\\mspace{54mu}\\\\operatorname{(2.21)}$\
    \ \n\nThus, the score function looks like:\n\n${\\\\frac{\\\\partial\\\\ln L\\\
    \\left( \\\\beta \\\\middle| y \\\\right)}{\\\\partial\\\\beta} \\\\equiv U\\\\\
    left( \\\\beta \\\\right){\\\\sum\\_{i = 1}^{n}\\\\left\\\\{ {y\\_{i}\\\\ln\\\\\
    left\\\\lbrack \\\\frac{1}{1 + \\\\exp\\\\left( {- x\\_{i}\\\\beta} \\\\right)}\
    \ \\\\right\\\\rbrack + \\\\left( {1 - y\\_{i}} \\\\right)\\\\ln\\\\left\\\\lbrack\
    \ {1 - \\\\frac{1}{1 + \\\\exp\\\\left( {- x\\_{i}\\\\beta} \\\\right)}} \\\\\
    right\\\\rbrack} \\\\right\\\\}}}\\\\mspace{54mu}\\\\operatorname{(2.22)}$ \n\n\
    Using standard iterative methods (e.g., Newton–Raphson), we can find *β̂* by solving\
    \ equation (2.20) for *β*.\n\n### [2.5.3 Problem of Separation](#C02a_toc.xhtml#rsec2_5_3)"
