    \ Cox model (Hosmer and Lemeshow, 1999):\n\n    ${h\\_{i}\\\\left( t \\\\right)\
    \ = h\\_{0}\\\\left( t \\\\right)\\\\exp\\\\left( {{\\\\sum\\\\limits\\_{i = 1}^{k}{\\\
    \\beta\\_{j}x\\_{ij}}} + {\\\\sum\\\\limits\\_{n = 1}^{m}{\\\\gamma\\_{n}x\\_{in}g\\\
