  raw: '```


    /*

    PROGRAM DATASET.SAS

    DESCRIPTION Creates SAS data set for the specified table.

    USAGE %dataset(libref =, table=, mis=);

    PARAMETERS

    libref - is the name of the library storing the data dictionary data sets.

    table - is the name of the table for which is required to create the SAS data
    set.

    mis - is the code identifying the missing value.

    REQUIRES The object, property, location, library data sets must exist.

    AUTHORS T.Kolosova and S.Berestizhevsky

    */

    %macro dataset (libref=, table=, mis=);

    /*

    The following DATA step creates dataset macro variable containing the name of
    data set corresponding to the specified table.

    */

       data _null_ ;

          set &libref..Object ;

          where upcase(left(table)) = upcase("&table") ;

          call symput("dataset", trim(dataset)) ;

       run ;

       %let count = 0 ;

       %let _icount = 0 ;

    /*

    The following DATA step creates macro variables and fills them with data from
    the property data set:

    count - contains number of columns of the specified table.

    _v0 - is a series of macro variables containing names of the columns of the specified
    table with their types and length.

    _v2 - is a series of macro variables containing names of the columns of the specified
    table for which indexes are defined.

    _v3 - is a series of macro variables containing names of the columns of the specified
    table with their titles.

    */

       data _null_ ;

          retain _count 1 _icount 0 ;

          call symput("_v0" || left(_count), "&mis") ;

          set &libref..Property ;

          where upcase(left(table)) = upcase("&table") ;

          call symput("_v3" || left(_count), trim(left(column)) || '' =

             %nrbquote('' || trim(left(title)) || '')'') ;

          if index(upcase(attribut), "I") > 0 then

          do ;

             _icount + 1 ;

           call symput("_v2" || left(_icount), left(column)) ;

            call symput("_icount", left(_icount)) ;

          end ;

          if upcase(type) = "C" then

           call symput("_v0" || left(_count), trim(left(column)) ||

             " $" || left(length)) ;

          if upcase(type) = "N" then

           call symput("_v0" || left(_count), trim(left(column)) ||

             " " || left(length)) ;

           call symput("count", _count) ;

           _count + 1 ;

       run ;

    /*

    The following DATA step generates SAS data set for the specified table according
    to the values of the macro variables created in the previous DATA step.

    */

       data &dataset ;

          length

          %do _j = 1 %to &count ;

             &&_v0&_j

          %end ;

          ;

          label

          %do _j = 1 %to &count ;

                &&_v3&_j

          %end ;

          ;

          stop ;

       run ;

    /*

    The following PROC SQL creates indexes, if any, for the SAS data set generated
    in the previous DATA step according to the values of the macro variables stored
    in the _v2 macro variable.

    */

       %if &_icount > 0 %then

       %do ;

          proc sql ;

          %if &_icount = 1 %then

          %do ;

             create index &&_v2&_icount on

             &dataset (&&_v2&_icount) ;

          %end ;

          %else

          %do ;

             create index __index on &dataset

             ( &&_v21

             %do i = 2 %to &_icount ;

                , &&_v2&_icount

              %end ;

             ) ;

          %end ;

       %end ;

    %mend dataset ;

    ```


    For example, to generate the SAS dataset for the Demo table according to the metadata
    of the Object, Location, and Property tables, we have to invoke the %DATASET macro
    as follows:


    ```


    %dataset(libref=kernel, table=Demo, mis=.);

    ```


    ### [6.4.2 Generating R Datasets from the Data Dictionary Metadata](#C02a_toc.xhtml#rsec6_4_2)


    The following DATASET R program demonstrates how to generate R datasets from the
    metadata of the Library, Object, and Property tables. These tables are stored
    in comma-separated values files.


    ```


    #

    # PROGRAM DATASET.R

    # DESCRIPTION Creates R data set for the specified table.

    # USAGE dataset(table, tmp_src, init_file)

    # PARAMETERS table - is the name of the table for which is

    # required to create the R data set.

    # tmp_src - is the temporary name of file to store generated R

    # code.

    # init_file – is the name of the comma-separated value file

    # that contains path to data dictionary files. This file is

    # part of data dictionary and it is called library.csv

    # object_file - is the name of comma-separated value file that

    # contains meta-data about application tables and data

    # dictionary tables as well

    # property_file – is the name of comma-separated value file

    # that contains meta-data about application tables structure

    # and data dictionary tables structure as well

    # REQUIRES The object.csv, property.csv files of data

    # dictionary must exist.

    # AUTHORS T.Kolosova and S.Berestizhevsky

    #

    dataset<- function (table, tmp_src, init_file, object_file, property_file)

    {

       lib <-function(start)

       {

          ds1<-read.csv(file = start, header=TRUE, sep=",")

          innerf <- function(text) assign("library", text, envir = .GlobalEnv)

          text <- paste(cat(sprintf(''%s'', ds1$location)))

           innerf(ds1$location)

       }

       loc<-function(object_file, property_file)

       {

          text<-paste0(as.character(library),"\\", as.character(object_file))

          assign("object", paste0(text), envir = .GlobalEnv)

          text<-paste0(as.character(library),"\\", as.character(property_file))

          assign("property", paste0(text), envir = .GlobalEnv)

       }

       create_ds<-function(table, tmp_src)

       {

          fn <- tmp_src

          if (file.exists(fn))

             file.remove(fn)

          columns <- vector()

          types <- vector()

          

          type <- "integer()"

          ds1<-read.csv(file = property, header=TRUE, sep=",")

          for (i in 1:nrow(ds1))

          {

             if (all(trimws(table) == ds1$table[i]) )

             {

                if (all("C" == ds1$type[i])) type <- "character()"

                columns <- c(columns, paste0(ds1$column[i], sep = " ", collapse =
    NULL))

                types <- c(types, paste0(type, sep = " ", collapse = NULL))

                type <- "integer()"

          }

       }

          sink(fn)

          text<- paste0(paste0(columns), ''='', paste0(types), '','')

          text <-paste0(text, collapse=" ")

          text <- substr(text,1,nchar(text)-1)

          cat(sprintf(''%s <- data.frame( %s )\n'', table, paste0(text) ))

          sink()

          source(fn)

       }

       lib(init_file)

       loc(object_file, property_file)

       create_ds(table, tmp_src)

    }

    dataset("Location", "tmp_source.txt", "c:\\datadictionary\\library.csv", "\\object.csv",
    "\\property.csv")

    ```


    ### [6.4.3 SAS and R Interoperability](#C02a_toc.xhtml#rsec6_4_3)


    We describe one method of passing SAS data from SAS to R, using R to analyze data
    and produce results, and then passing the results back to SAS. The R package provides
    a wide range of machine learning functionality, some of which are unavailable,
    or time-consuming to achieve, in SAS. Using the method described below, this functionality
    can be made available to SAS applications. The basic principle of the method outlined
    below could also be adapted to create different data analysis processes using
    R.


    Support vector machine (SVM) is a classification method that is not available
    in SAS/STAT. The package “e1071” in R provides the state-of-the-art implementation
    for SVM classification. We created a small SAS macro that implements interoperability
    between SAS and R. This SAS macro enables native R language to be embedded in
    and executed along with an SAS program in the SAS Base environment. This macro
    executes a user-defined R code in batch mode. Also, this macro automatically converts
    data between SAS datasets and R data frames such that the data and results from
    one statistical computing environment can be utilized by the other environment.
    The objective of this macro is to leverage the strength of the R within the SAS
    environment in a systematic manner.


    /\*'
