  trans: "\n\n### 10.2.1.1 命中率 (Hit Ratio)\n\n命中率（`HitR`）指标反映了核保人员的表现，其取决于分配的申请数量。该指标在特定期间内计算，其定义取决于核保人员的工作量以及预期的交易完成时间（承保保险申请），或者报价的有效期。\n\
    \n$\\text{Hit}R\\_{ti} = \\frac{\\\\text{BU}\\_{ti}}{\\\\text{AU}\\_{ti}}$ \n\n\
    其中：\n\n`HitR[ti]`—核保人员 *i* 在 *t* 期间的命中率\n\n`BU[ti]`—核保人员 *i* 在 *t* 期间承保的申请数量（完成的交易数）\n\
    \n`AU[ti]`—核保人员 *i* 在 *t* 期间被分配的申请数量。\n\n命中率指标的一个显著缺点是它没有考虑到保险申请的复杂性。很多时候，核保人员会直接拒绝保险申请，或者在根据保险公司的规则和政策进行简短评估后予以拒绝。因此，命中率也取决于分配给核保人员的保险申请的复杂性。因此，与其命中率，转化率指标是衡量核保人员表现更合适的方法。\n\
    \n### 10.2.1.2 转化率 (Conversion Rate)\n\n转化率指标（`CR[ti]`）根据核保人员提供过报价的申请来反映其表现。换句话说，报价申请是指那些未被保险公司（核保人员）拒绝的申请。该指标在由预期交易完成时间（承保申请或客户接受拟议报价）或报价有效期定义的期间内进行计算：\n\
    \n$\\text{CR}\\_{ti} = \\frac{\\\\text{BU}\\_{ti}}{\\\\text{QAU}\\_{ti}}$ \n\n\
    其中：\n\n`CR[ti]`—核保人员 *i* 在 *t* 期间的转化率\n\n`BU[ti]`—核保人员 *i* 在 *t* 期间承保的申请数量\n\n\
    `QAU[ti]`—核保人员 *i* 在 *t* 期间提供过报价的申请数量。\n\n该指标通常在较长的期间内计算，因为核保人员希望等待所有申请的结果，包括那些仍在与客户/潜在客户谈判中的申请。因此，该指标虽然提供了一个信息丰富的回顾性视角，但不能作为运营指标（例如，按每月）。该指标的另一个问题是它没有考虑到特定核保人员的工作量。例如，承保了\
    \ 5 个报价申请中的 1 个的核保人员，其 $\\text{CR}\\_{ti} = \\frac{1}{5} = 0.2$ 与承保了 50 个报价申请中的\
    \ 10 个的个人的 $\\text{CR}\\_{ti} = \\frac{10}{50} = 0.2$ 是相同的。\n\n我们提出了一种解决这些问题的新型运营指标。\n\
    \n### 10.2.1.3 动态转化率 (Dynamic Conversion Rate)\n\n我们提出了一种名为动态转化率的新型运营指标。动态转化率连续衡量转化情况，允许监控核保人员的表现并管理核保人员的最佳工作量。\n\
    \n动态转化率指标（`DCR[mi]`）基于目标月份可用的信息评估核保人员的月度。该指标将核保人员视为服务提供者，拥有入站请求（报价申请）和输出结果（承保申请）。换句话说，每个月，核保人员都有若干报价申请在队列中等待最终确定：被客户/潜在客户承保或拒绝。由于\
    \ `DCR[mi]` 每月衡量一次性能，工作量低的核保人员会在非活跃月份受到惩罚。动态转化率指标根据以下公式计算：\n\n$\\text{DCR}\\_{mi}\
    \ = \\frac{\\\\text{ln}\\left( {\\\\text{BU}\\_{mi} + 1} \\right)}{\\text{ln}(\\\
    text{QQAU}\\_{mi} + 1)}$ \n\n其中：\n\n`DCR[mi]`—核保人员 *i* 在 *m* 月份的动态转化率\n\n`BU[ti]`—核保人员\
    \ *i* 在 *m* 月份承保的申请数量\n\n`QQAU[ti]`—核保人员 *i* 在 *m* 月份提供过报价并等待结果（在队列中）的申请数量。\n\n\
    该指标的值于 0 和 1 之间；当当月没有承保申请时，`DCR[mi]` 等于 0；当目前为止的所有报价申请都在当月承保时，它等于 1。因此，该指标展示了核保人员的持续表现，提供了一种可用于高效管理核保流程的运营衡量。此外，`DCR[mi]`\
    \ 指标考虑了核保人员的工作量。[表 10.1] 使用与上述用于 `CR[ti]` 转化率指标相同的示例展示了 `DCR[mi]` 指标的优处。\n\n**表\
    \ 10.1**\n\n`CR[ti]` 与 `DCR[mi]` 指标对比\n\n| 核保人员 | 报价申请 (`QQAU[ti]`) | 承保申请 (`BU[ti]`)\
    \ | `CR[ti]` | `DCR[mi]` |\n| --- | --- | --- | --- | --- |\n| A | 5 | 1 | 0.2\
    \ | 0.3865 |\n| --- | --- | --- | --- | --- |\n| B | 50 | 10 | 0.2 | 0.6097 |\n\
    \n如 [表 10.1] 所示，对于 `CR[ti]` 为 0.2 但报价和承保申请数量较大的核保人员 B，`DCR[mi]` 更高。\n\n### 10.2.1.4\
    \ 成交时效 (Time-to-Deal)\n\n成交时效（TTD）指标评估核保人员完成交易的效率。成交时效计算为申请分配给核保人员的日期与承保日期之间的时间。TTD\
    \ 由报价有效期进行截断。TTD 可以在较长的期间（如 6 个月或一年）取平均值，但在这种情况下它不是运营性的，无法用于管理。我们建议使用每月成交时效指标\
    \ `TTD[mi]`，即核保人员 *i* 在 *m* 月的平均成交时效。\n\n$\\text{TTD}\\_{mi} = \\frac{\\\\sum_{j\
    \ = 1}^{n}\\\\text{TTD}\\_{mij}}{n}$ \n\n其中：\n\n`TTD[mi]`—核保人员 *i* 在 *m* 月的平均成交时效\n\
    \n`TTD[mij]`—核保人员 *i* 在 *m* 月承保的 *n* 个申请中第 *j* 个申请的成交时效。\n\n### 10.2 核保人员分析\n\n\
    使用上述指标，我们展示了工伤保险核保人员表现的研究结果。在这项研究中，我们使用了过去 4 个月内与新工伤保险申请相关的数据。\n\n#### 10.2.2.1\
    \ 数据描述\n\n用于核保人员评估研究的数据包括：\n\n* 申请提交日期、报价日期和保单日期（如有）；\n* 保险申请参数，如行业、州和员工人数；\n\
    * 分配申请的核保人员。\n\n在分析之前，按照以下方式对数据进行了“清洗”和准备：\n\n(a) 需要超过三个月才能承保的申请从研究中移除（少于所有承保申请的\
    \ 5%）。\n(b) 在分析的 44 个月期间，分配申请总数少于 2%的核保人员也被排除。\n\n#### 10.2.2.2 申请流\n\n核保人员的表现评估取决于保险申请流以及申请分配给核保人员的过程。因此，在估计核保人员的动态转化率和成交时效之前，应该对申请流和申请分配过程进行分析。\n\
    \n"
- fmt: "\nDistribution of an average number of applications per month demonstrated\
    \ seasonality with a somewhat increased number of applications in March and October,\
    \ and with a significant drop in December ([Figure 10.1](#C16_chapter10.xhtml#fig10_1)).\
    \ Identification of this seasonality in the submission process helps create a\
    \ balanced workload for underwriters.\n\n![FIGURE 10.1 Average number of monthly\
    \ submitted applications.](images/file10.jpg)\n\n**FIGURE 10.1**  \n\nAverage\
    \ number of monthly submitted applications.\n\nDistribution of an average number\
    \ of applications per weekday demonstrated a slightly lower number of applications\
    \ on Mondays ([Figure 10.2](#C16_chapter10.xhtml#fig10_2)).\n\n![FIGURE 10.2 Average\
    \ number of weekday submitted applications.](images/file11.jpg)\n\n**FIGURE 10.2**\
    \  \n\nAverage number of weekday submitted applications.\n\nThe analysis indicates\
    \ that the application submission flow has some fluctuations among months and\
    \ among weekdays which are easily manageable. However, as shown in [Figure 10.3](#C16_chapter10.xhtml#fig10_3),\
    \ the workload of underwriters is far from being balanced. It makes an analysis\
    \ of underwriters’ performance more complicated.\n\n![FIGURE 10.3 Average monthly\
    \ application assignment per underwriter.](images/file12.jpg)\n\n**FIGURE 10.3**\
    \  \n\nAverage monthly application assignment per underwriter.\n\nOn the one hand,\
    \ it would be reasonable to assign more applications to underwriters with better\
    \ performance. However, on the other hand, it is possible that fewer applications\
    \ allow the underwriters to analyze the situation more comprehensively, to have\
    \ a more in-depth negotiation with a customer/prospect—and as a result, to demonstrate\
    \ better performance. We will discuss this hypothesis further.\n\n### 10.2.2.3\
    \ Dynamic Conversion Rate per Underwriter](#C02a_toc.xhtml#rsec10_2_2_3)\n\nThe\
    \ dynamic conversion rate `DCR[mi]` per underwriter was calculated over the observation\
    \ period of 44 months. The best underwriters, with an average dynamic conversion\
    \ rate above 0.12, comprise about 8% of all underwriters. As shown in [Figure\
    \ 10.4](#C16_chapter10.xhtml#fig10_4), top performers have a significantly higher\
    \ dynamic conversion rate than the rest of the underwriters.\n\n![FIGURE 10.4\
    \ Comparison of dynamic conversion rates (moving conversion rates) between two\
    \ groups of underwriters.](images/file13.jpg)\n\n**FIGURE 10.4**  \n\nComparison\
    \ of dynamic conversion rates (moving conversion rates) between two groups of\
    \ underwriters.\n\nWe analyzed the relations of the number of assigned applications\
    \ to an underwriter with their performance measured by `DCR[mi]`. For the top\
    \ performers, the average number of monthly assigned applications per underwriter\
    \ is 13 (median is 12). For the rest of the underwriters, the average number of\
    \ monthly assigned applications per underwriter is 10 (median is 8). We performed\
    \ a comparison of empirical distributions of numbers of monthly assigned applications\
    \ per underwriter between the group of the top performers and the group of the\
    \ rest of the underwriters using the Kolmogorov–Smirnov two-sample test. The asymptotic\
    \ p-value for the Kolmogorov–Smirnov test is `<.0001`. This indicates that we\
    \ should reject the null hypothesis that the distributions of numbers of monthly\
    \ assigned applications are the same.\n\n### 10.2.2.4 Time-to-Deal per Underwriter](#C02a_toc.xhtml#rsec10_2_4)\n\
    \nThe dynamic conversion rate `DCR[mi]` per underwriter was calculated over the\
    \ observation period of 44 months. The best underwriters, with an average dynamic\
    \ conversion rate above 0.12, comprise about 8% of all underwriters. As shown\
    \ in [Figure 10.4](#C16_chapter10.xhtml#fig10_4), top performers have a significantly\
    \ higher dynamic conversion rate than the rest of the underwriters.\n\nWe analyzed\
    \ the relations of the number of assigned applications to an underwriter with\
    \ their performance measured by `DCR[mi]`. For the top performers, the average\
    \ number of monthly assigned applications per underwriter is 13 (median is 12).\
    \ For the rest of the underwriters, the average number of monthly assigned applications\
    \ per underwriter is 10 (median is 8). We performed a comparison of empirical\
    \ distributions of numbers of monthly assigned applications per underwriter between\
    \ the group of the top performers and the group of the rest of the underwriters\
    \ using the Kolmogorov–Smirnov two-sample test. The asymptotic p-value for the\
    \ Kolmogorov–Smirnov test is `<.0001`. This indicates that we should reject the\
    \ null hypothesis that the distributions of numbers of monthly assigned applications\
    \ are the same.\n\n### 10.3 Traditional Approach to Knowledge Delivery](#C02a_toc.xhtml#rsec10_3)\n\
    \nIt is an ongoing effort for insurers to improve quality and consistency. For\
    \ years, sound underwriting decisions were considered the result of judgment,\
    \ experience, and “gut feelings.” The only way for new underwriter to gain “judgment”\
    \ was by working under the guidance of senior underwriter (Randall, 1994).\n\n\
    Traditional ways to validate performance include file reviews, or audits, and\
    \ consistency. The audit process usually consists of six steps:\n\n1. Gather data\
    \ on applicant’s exposures and hazards.\n2. Evaluate the exposures and hazards.\n\
    3. Develop and evaluate underwriting options.\n4. Select an underwriting option,\
    \ including selecting the premium.\n5. Implement the underwriting decision.\n\
    6. Monitor loss exposures.\n\nThis audit may identify deficiencies in underwriting\
    \ processes and provide a basis for additional coaching, improved quality. However,\
    \ each step in this process is validated subjectively and qualitatively and is\
    \ based on two assumptions. The first one is appropriate guidelines, which are\
    \ usually updated infrequently and become obsolete with time. The second assumption\
    \ is the existence of a matured management process, where the assignment of applications\
    \ to underwriters is balanced and identification of a problem and intervention\
    \ are timely.\n\nUnfortunately, in today’s dynamic, large-scale, and innovative\
    \ environment, these assumptions are often not valid. Also, the growing need for\
    \ underwriters requires that training is streamlined, consistent, and fast.\n\n\
    ### 10.4 Anatomy of Artificial Intelligence Solution](#C02a_toc.xhtml#rsec10_4)\n\
    \nThe underwriting decision-making process includes the following components:\n\
    \n*   Underwriters, who are assigned to work on insurance applications (in our\
    \ example, workers’ compensation line of insurance)\n*   Insurance applications\
    \ submitted by various customers/prospects along with a description of different\
    \ characteristics of the business, including business size and turnover\n*   Insurance\
    \ products offered by insurer for workers’ compensation along with their conditions,\
    \ premium size, limitations, etc.\n*   Customer/prospect responses to underwriters’\
    \ quotes: accepting or rejecting the proposed insurance offer\n"
  raw: "Distribution of an average number of applications per month demonstrated seasonality\
    \ with a somewhat increased number of applications in March and October, and with\
    \ a significant drop in December ([Figure 10.1](#C16_chapter10.xhtml#fig10_1)).\
    \ Identification of this seasonality in the submission process helps create a\
    \ balanced workload for underwriters.\n\n![FIGURE 10.1 Average number of monthly\
    \ submitted applications.](images/file10.jpg)\n\n**FIGURE 10.1**  \n\nAverage\
    \ number of monthly submitted applications.\n\nDistribution of an average number\
    \ of applications per weekday demonstrated a slightly lower number of applications\
    \ on Mondays ([Figure 10.2](#C16_chapter10.xhtml#fig10_2)).\n\n![FIGURE 10.2 Average\
    \ number of weekday submitted applications.](images/file11.jpg)\n\n**FIGURE 10.2**\
    \  \n\nAverage number of weekday submitted applications.\n\nThe analysis indicates\
    \ that the application submission flow has some fluctuations among months and\
    \ among weekdays which are easily manageable. However, as shown in [Figure 10.3](#C16_chapter10.xhtml#fig10_3),\
    \ the workload of underwriters is far from being balanced. It makes an analysis\
    \ of underwriters’ performance more complicated.\n\n![FIGURE 10.3 Average monthly\
    \ application assignment per underwriter.](images/file12.jpg)\n\n**FIGURE 10.3**\
    \  \n\nAverage monthly application assignment per underwriter.\n\nOn the one hand,\
    \ it would be reasonable to assign more applications to underwriters with better\
    \ performance. However, on the other hand, it is possible that fewer applications\
    \ allow the underwriters to analyze the situation more comprehensively, to have\
    \ a more in-depth negotiation with a customer/prospect—and as a result, to demonstrate\
    \ better performance. We will discuss this hypothesis further.\n\n#### [10.2.2.3\
    \ Dynamic Conversion Rate per Underwriter](#C02a_toc.xhtml#rsec10_2_2_3)\n\nThe\
    \ dynamic conversion rate DCR[mi] per underwriter was calculated over the observation\
    \ period of 44 months. The best underwriters, with an average dynamic conversion\
    \ rate above 0.12, comprise about 8% of all underwriters. As shown in [Figure\
    \ 10.4](#C16_chapter10.xhtml#fig10_4), top performers have a significantly higher\
    \ dynamic conversion rate than the rest of the underwriters.\n\n![FIGURE 10.4\
    \ Comparison of dynamic conversion rates (moving conversion rates) between two\
    \ groups of underwriters.](images/file13.jpg)\n\n**FIGURE 10.4**  \n\nComparison\
    \ of dynamic conversion rates (moving conversion rates) between two groups of\
    \ underwriters.\n\nWe analyzed the relations of the number of assigned applications\
    \ to an underwriter with their performance measured by DCR[mi]. For the top performers,\
    \ the average number of monthly assigned applications per underwriter is 13 (median\
    \ is 12). For the rest of the underwriters, the average number of monthly assigned\
    \ applications per underwriter is 10 (median is 8). We performed a comparison\
    \ of empirical distributions of numbers of monthly assigned applications per underwriter\
    \ between the group of the top performers and the group of the rest of the underwriters\
    \ using the Kolmogorov–Smirnov two-sample test. The asymptotic p-value for the\
    \ Kolmogorov–Smirnov test is <.0001. This indicates that we should reject the\
    \ null hypothesis that the distributions of numbers of monthly assigned applications\
    \ per underwriter are the same for the two groups of underwriters. This demonstrates\
    \ that, indeed, top underwriters (according to the dynamic conversion rate metric)\
    \ are assigned more applications than other underwriters, and regardless of increased\
    \ workload, they still perform substantially better than others.\n\n#### [10.2.2.4\
    \ Time-to-Deal per Underwriter](#C02a_toc.xhtml#rsec10_2_2_4)\n\nThe time-to-deal\
    \ metric (TTD[mi]) was calculated per each underwriter. Time-to-deal varies significantly,\
    \ from 0 to 90 days (where 90 days is an expiration term of a quote), with an\
    \ average of 32 days and a median of 29 days. To compare time-to-deal of top performers\
    \ vs. the rest of the underwriters, we performed a comparison of empirical distributions\
    \ of TTD[mi] between these two groups using the Kolmogorov–Smirnov two-sample\
    \ test. The asymptotic p-value for the Kolmogorov–Smirnov test is 0.1255. This\
    \ indicates that we cannot reject the null hypothesis that the distributions are\
    \ the same for the two groups of underwriters. Both TTD[mi] and DCR[mi] can be\
    \ used as operational metrics for ongoing monitoring and management of underwriters’\
    \ performance.\n\n## [10.3 Traditional Approach to Knowledge Delivery](#C02a_toc.xhtml#rsec10_3)\n\
    \nIt is an ongoing effort for insurers to improve the quality and consistency\
    \ of the underwriting process. For years, sound underwriting decisions were considered\
    \ the result of the judgment, experience, and “gut feelings.” The only way for\
    \ a new or young underwriter to gain “judgment” was by working under the guidance\
    \ of a successful senior underwriter and gradually gaining experience (Randall,\
    \ 1994).\n\nTraditional ways to validate performance include underwriting file\
    \ reviews, or audits, in an attempt to improve quality and consistency. These\
    \ audits attempt to determine the effectiveness of underwriters. The audit process\
    \ usually consists of six steps, validating each phase in the underwriting decision\
    \ process:\n\n1.  Gather data on an applicant’s loss exposures and associated\
    \ hazards.\n\n2.  Evaluate the exposures and hazards.\n\n3.  Develop and evaluate\
    \ underwriting options.\n\n4.  Select an underwriting option, including selecting\
    \ the appropriate premium.\n\n5.  Implement the underwriting decision.\n\n6. \
    \ Monitor the loss exposures.\n\nThis audit may identify deficiencies in underwriting\
    \ processes and provide a basis for additional coaching, improved documentation,\
    \ and enhanced quality reviews. However, each step in this process is validated\
    \ subjectively and qualitatively and is based on two assumptions. The first one\
    \ is appropriate guidelines, which are usually updated infrequently and become\
    \ obsolete with time. The second assumption is the existence of a matured management\
    \ process, where the assignment of applications to underwriters is balanced and\
    \ identification of a problem and intervention to fix it are timely.\n\nUnfortunately,\
    \ in today’s dynamic, large-scale, and innovative environment, these assumptions\
    \ are often not valid. Also, the growing need for underwriters requires that training\
    \ is streamlined, consistent, and fast. Though thinking of underwriting as steps\
    \ in the decision-making process clarified its nature, it only led to static guidelines\
    \ that did not include experience, sound judgment, and intuition of the top underwriters.\n\
    \nFrom our analysis of underwriters’ performance, it is evident that a small number\
    \ of underwriters perform significantly better than others, despite the guidelines\
    \ and audits. More experienced and knowledgeable underwriters apply skills that\
    \ cannot be captured by guidelines, and their expert knowledge allows them to\
    \ intuitively analyze multiple factors and their combinations to produce a better\
    \ decision.\n\nArtificial intelligence approaches based on machine learning algorithms\
    \ can be used to model the decision-making process of the best underwriters, and\
    \ then, these models can be applied to facilitate and automate the underwriting\
    \ decision-making process.\n\n## [10.4 Anatomy of Artificial Intelligence Solution](#C02a_toc.xhtml#rsec10_4)\n\
    \nThe underwriting decision-making process includes the following components:\n\
    \n*   Underwriters, who are assigned to work on insurance applications (in our\
    \ example, workers’ compensation line of insurance)\n\n*   Insurance applications\
    \ submitted by various customers/prospects along with a description of different\
    \ characteristics of the business, including business size and turnover\n\n* \
    \  Insurance products offered by insurer for workers’ compensation along with\
    \ their conditions, premium size, limitations, etc.\n\n*   Customer/prospect responses\
    \ to underwriters’ quotes: accepting or rejecting the proposed insurance offer"
