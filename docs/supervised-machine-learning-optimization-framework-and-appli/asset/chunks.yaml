    \ Introduction](#C02a_toc.xhtml#rsec11_1)\n\n    Claim management requires applying\
    \ statistical techniques in the analysis and interpretation of the claims data.\
    \ The central piece of claim management is modeling and prediction. Two strategies\
    \ are commonly used by insurers to analyze claims: the two-part approach that\
    \ decomposes claims cost into frequency and severity components, and the pure\
    \ premium approach that uses the Tweedie distribution.\n\n    In this chapter,\
    \ we provide a general framework to look into the process of modeling and prediction\
    \ of claims using the Cox hazard model. The Cox hazard model is a standard tool\
    \ in survival analysis for studying the dependence of a hazard rate on covariates\
    \ and time. Although the Cox hazard model is very popular in statistics, in practice\
    \ data to be analyzed often fails to hold assumptions underlying the Cox model.\
    \ We use a Bayesian machine learning approach to survival analysis to deal with\
    \ violations of assumptions of the Cox hazard model.\n\n    The term “survival\
    \ data” has been used in a wide meaning for data involving time to a certain event.\
    \ This event may be the appearance of a tumor, the development of some disease,\
    \ cessation of smoking, etc. Applications of the statistical methods for survival\
    \ data analysis have been extended beyond the biomedical field and used in areas\
    \ of reliability engineering (lifetime of electronic devices, components, or systems),\
    \ criminology (felons’ time to parole), sociology (duration of the first marriage),\
    \ insurance (workers’ compensation claims), etc. Depending on the area of application,\
    \ different terms are used: survival analysis—in biological science, reliability\
    \ analysis—in engineering, duration analysis—in social science, and time-to-event\
    \ analysis—in insurance. Further, in this chapter, we use terms that are more\
    \ often used in insurance.\n\n    A central quantity in survival (time-to-event)\
    \ analysis is the hazard function. The most common approach to model covariate\
    \ effects on time-to-event is the Cox hazard model developed and introduced by\
    \ Cox (1972). There are several important assumptions that need to be assessed\
    \ before the model results can be safely applied (Lee, 1992). First, the proportional\
    \ hazard assumption means that hazard functions are proportional over time. Second,\
    \ the explanatory variable acts directly on the baseline hazard function and remains\
    \ constant over time. Although the Cox hazard model is very popular in statistics,\
    \ in practice data to be analyzed often fails to hold assumptions. For example,\
    \ when a cause of claims interacts with time, the proportional hazard assumption\
    \ fails. Or, when the hazard ratio changes over time, the proportional hazard\
    \ assumption is violated. We present the application of Bayesian approach to survival\
    \ (time-to-event) analysis that allows dealing with violations of assumptions\
    \ of the Cox hazard model, thus assuring that model results can be trusted.\n\n\
    \    This chapter describes a case study intended to indicate possible applications\
    \ to workers’ compensation insurance, particularly the occurrence of claims. We\
    \ study workers’ compensation claims for a period of 2 years. Claims data was\
    \ provided by a worker compensation insurer that writes approximately $900 million\
    \ of direct premium annually on a countrywide basis. The risk of occurrence of\
    \ claims is studied, modeled, and predicted for different industries within several\
    \ US states.\n\n    ## [11.2 Data](#C02a_toc.xhtml#rsec11_2)\n\n    The present\
    \ case study is based on the following policy and claims data (only claims that\
    \ led to payments are included):\n\n    *   The start and the end date of the\
    \ policy;\n\n    *   Industry in which policy was issued;\n\n    *   Date of claim\
    \ occurrence;\n\n    *   Date of a claim reported;\n\n    *   State where a claim\
    \ was reported.\n\n    ## [11.3 The Cox Model for Claims Event Analysis](#C02a_toc.xhtml#rsec11_3)\n\
    \n    Survival (or time-to-event) function *S*(*t*) describes the proportion of\
    \ policies “surviving” without a claim to or beyond a given time (in days):\n\n\
    \    *S*(*t*) = *P*(*T* > *t*) \n\n    where:\n\n    *T*—survival time of a randomly\
    \ selected policy\n\n    *t*—a specific point in time.\n\n    Hazard function\
    \ *h*(*t*) describes instantaneous claims rate at time t :\n\n    ${h(t) = \\\\\
    lim\\\\limits\\_{\\\\Delta t\\\\rightarrow 0}\\\\frac{P\\\\left( {t \\\\leq T\
    \ < t + \\\\Delta t\\\\left| {T \\\\geq t} \\\\right.} \\\\right)}{\\\\Delta t}}\\\
    \\mspace{54mu}\\\\operatorname{(11.1)}$ \n\n    In other words, hazard function\
