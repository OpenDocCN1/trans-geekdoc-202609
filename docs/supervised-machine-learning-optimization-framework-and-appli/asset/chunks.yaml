    The mean squares are computed by dividing the sums of squares by their relating
    degrees of freedom. The residual mean square is an estimate of `σ`² . The significance
    of a factor’s main or interaction effect is tested using `F` statistics that are
    computed as dividing the corresponding mean squares by the residual mean square.
    The null hypothesis is that the particular effect equals zero. The corresponding
    `F` statistic has an `F` distribution where parameters are the degrees of freedom
    of the effect and of the residual mean square.


    A full-factorial experiment allows estimating all main effects and all effects
    of the factor combinations. However, because the sample size grows exponentially
    with the number of factors, full-factorial designs are often too expensive to
    run. Also, since high-level interactions are often not active, it might be inefficient
    to execute such experiments. So, if the number of combinations in a full-factorial
    design is too high to be feasible, a fractional factorial design may be done,
    in which some of the combinations are omitted.


    ### 5.2.4 Fractional Factorial Experiment


    Fractional factorial designs consist of a subset, or a fraction, of full-factorial
    design. As a consequence of using a fraction of the design, aliasing of factor
    effects and their combinations is created.


    Let’s consider a case when we have four factors `A`, `B`, `C`, and `D`, each on
    three levels. For the full-factorial experiment, a number of runs will be `3⁴
    = 81`. Table 5.5 shows how the 80 degrees of freedom of experiment would be allocated.


    **TABLE 5.5 Allocation of Degrees of Freedom for 3⁴ Experiment**


    | Main Effects | 2-Factor Interactions | 3-Factor Interactions | 4-Factor Interactions
    |

    | --- | --- | --- | --- |

    | 8 | 24 | 32 | 16 |

    | | | | |


    According to the effect principle, one could expect that three-factor and four-factor
    interactions are not likely be important. Table 5.5 shows that of 80 degrees of
    freedom, 48 relate to such effects. It does not seem to be reasonable to run such
    an experiment.


    The previously studied 3³ full-factorial experiment employs one-third fraction
    of 3⁴ design that is denoted as `3⁻¹` design. This design is constructed by assigning
    the column for factor `D` to be equal to `3(A+B+C)`. Such a relationship can be
    denoted as `D = ABC`. As `i`, `j`, `k`, and `l` represent the levels of factors
    `A`, `B`, `C`, and `D`, respectively, then `l = 3(i+j+k)` or equally `3(i+j+k+2l)=0`.


    The last form of equation (5.8), in turn, means `I = ABCD²`, which is called defining
    relation, and from which aliasing patterns can be derived. For example, by adding
    `2i` to both sides of equation (5.8), we have:


    `3(i+j+k+2l)=2i` → `3(j+k+2l)=2i`


    This means that `A` and `BCD²` are aliased. Following the same process, the following
    effects are aliased:


    ```

    \begin{array}{l}

    B = ACD² = AB² = CD²,\\

    C = ABD² = ABC² = D²,\\

    D = ABC = ABCD,\\

    AB = CD² = ABC² = D,\\\\

    AB² = AC² = D = BC² = D²,\\

    AC = BD² = AB² = CD,\\

    AC² = AB² = D = BC² = D²,\\

    AD = AB² = C² = BCD,\\

    AD² = BC = AB² = C² = D²,\\

    BC² = AB² = D² = AC²,\\

    BD = AB² = C = ACD,\\

    CD = ABC² = ABD

    \end{array}

    ```

    (5.9)


    A main effect or two-factor interaction is called `clear` if it is not aliased
    with any other main effect or two-factor interactions, and `strongly clear` if
    it is not aliased with any other main effect or two- or three-factor interaction.
    So, if three- and four-factor interactions are considered not important, then
    the aliasing relations (equation 5.9) demonstrate that `A`, `B`, `C`, `D`, `AB²`,
    `AC²`, `AD`, `BC²`, `BD`, and `CD` can be estimated. These main effects or components
    of two-factor interactions are clear as they are not aliased with any other main
    effects or two-factor interaction components. While analyzing such an experiment,
    the ANOVA table will include only `A`, `B`, `C`, `D`, `AB = CD²`, `AB²`, `AC =
    BD²`, `AC²`, `AD`, `AD² = BC`, `BC²`, `BD`, and `CD` effects.


    For more details, we refer the readers to the vast existing literature on fractional
    design of experiments, for example Montgomery (1991) or Wu and Hamada (2000, 2009).


    ### 5.2.5 Linear Mixed Models


    A linear mixed model is a parametric model linear in the parameters which quantifies
    the relationships between a continuous dependent variable and independent variables
    that may involve a mix of fixed and random effects.


    In general, fixed-effect parameters are associated with one or more continuous
    or categorical parameters and describe the relationships of the covariates to
    the dependent variable for an entire population. Fixed effects are unknown constant
    parameters, and estimation of these parameters is of fundamental interest, as
    they describe the relationships of the covariates with the dependent variable.
    In experimental settings, for fixed-effect factors data are gathered from all
    the levels of the factor.


    Random effects are associated with one or more factors and are specific to clusters
    or subjects within a population. When the levels of a factor can be thought of
    as having been sampled from a sample space, so that each particular level is not
    of specific interest, the effects associated with the levels of such factors can
    be modeled as random effects. In other words, random effects are directly used
    in modeling the random variation in the dependent variable at different levels.
    In contrast to fixed effects, which are represented by constant parameters in
    a linear mixed model, random effects are represented by unobserved random variables.


    The definition of the type of a factor and the selection of a model structure
    is critically important.


    Suppose, as a result of our experiment, we gathered `n` observations of the response
    variable `y[1]`, ..., `y[n]` and we want to estimate the impact of factors and
    their combinations on the response. The standard linear model can be formulated
    as follows:


    ```

    y[i] = β[0] + β[1]x[i1] + ... + β[p]x[ip] + ε[i], i=1, ..., n

    ```

