    \n### [6.2.5 Domains](#C02a_toc.xhtml#rsec6_2_5)\n\nA domain is the set of all\
    \ possible data values of a particular type for each column in a table. The domain\
    \ of a column can also be defined in terms of another column; that is, the first\
    \ column may contain only values from another column. The significance of domains\
    \ is as follows:\n\n*   If two columns draw their values from the same domain,\
    \ then comparisons involving these two columns make sense because they are comparing\
    \ like values.\n\n*   If two columns draw their values from different domains,\
    \ then comparisons involving these two columns do not make sense.\n\nDomains may\
    \ or may not be explicitly stored as actual sets of values. But they should be\
    \ specified as part of the application definition, and then each column definition\
    \ should include a reference to the corresponding domain. A given column can have\
    \ the same name as the corresponding domain, or a different name.\n\n### [6.2.6\
    \ Relations and Tables](#C02a_toc.xhtml#rsec6_2_6)\n\nThe relation is an important\
    \ term in the relational data model. Relations describe the connection between\
    \ columns. The number of rows in a relation is called the cardinality of the relation.\
    \ Relations can be conveniently represented in tabular form. A relational table\
    \ is a data structure consisting of rows and columns, with each row being unique\
    \ to that table. A table and a relation are not the same things, though for the\
    \ purposes of our book we have assumed that they are. The relational data model\
    \ gives symbolic names to data, thereby enabling to manipulate the data in the\
    \ logical form. In the relational data model, each table has a unique name that\
    \ identifies it. Each column in the table has a unique name (within this table)\
    \ that identifies the column. The same column name can appear in two different\
    \ tables. In this case, we can identify a column in one equivalent way by joining\
    \ the table and column names. Throughout this book, we often refer to the column\
    \ of the table as <Table name>.<COLUMN NAME>.\n\n### [6.2.7 Functions](#C02a_toc.xhtml#rsec6_2_7)\n\
    \nThe function is the specific type of relationship between two relational tables.\
    \ Suppose\n\n*   that each row of the first table relates exactly to each row\
    \ of the second table, or\n\n*   that more than one row of the first table relates\
    \ to one row of the second table, or\n\n*   that rows of the first table do not\
    \ relate to rows of the second table.\n\nEach of these relationships is called\
    \ a function between the first table and the second table. These functions define\
    \ the relationship or mapping between tables. Relationships between tables in\
    \ the relational data model can be one-to-one (1:1) or one-to-many (1:M).\n\n\
    ### [6.2.8 One-to-one Relationship](#C02a_toc.xhtml#rsec6_2_8)\n\nA one-to-one\
    \ relationship (1:1) is the simple relationship that exists between tables in\
    \ which each row of the first table corresponds to one row of the second table,\
    \ and vice versa.\n\n### [6.2.9 One-to-many Relationship](#C02a_toc.xhtml#rsec6_2_9)"
