    \\begin{matrix} {1,\\\\text{if}i = j} \\\\\\\\ {0,\\\\text{if}i \\\\neq j} \\\\\
    \\\\ \\\\end{matrix} \\\\right.$ $\\\\text{season} = \\\\left\\\\{ \\\\begin{matrix}\
    \ {1,\\\\text{if}\\\\text{the}\\\\text{claim}\\\\text{happened}\\\\text{during}\\\
    \\text{winter}\\\\text{season}(months11,12,1,2,3)} \\\\\\\\ {0,\\\\text{if}\\\\\
    text{the}\\\\text{claim}\\\\text{happened}\\\\text{during}\\\\text{non-winter}\\\
    \\text{season}(months4–10)\\\\operatorname{}} \\\\\\\\ \\\\end{matrix} \\\\right.$\
    \ \n\n    As there is no reason to prefer any specific industry for a baseline,\
    \ we choose the last alphabetically ordered industry—Utilities. The selection\
    \ of Utilities industry as a baseline for hazard means that hazards for all other\
    \ industries are estimated relative to that of Utilities industry.\n\n    Calculation\
    \ of time-to-event (survival) functions when we have time-varying covariates becomes\
    \ more complicated, because we need to specify a path or trajectory for each variable\
    \ (Rodriguez, 2007). For example, if a policy started on the 1st of April, the\
    \ survival function should be calculated using hazard corresponding to season\
    \ = 0 for time-to-event *t* ≤ 214 days (from the 1st of April till the 1st of\
    \ November), while for time-to-event *t* > 214, it should be calculated using\
    \ hazard corresponding to season = 1. For another example, if a policy started\
    \ on the 1st of August, the survival function should be calculated using hazard\
    \ corresponding to season = 0 for time-to-event *t* ≤ 92 days (from the 1st of\
    \ August till the 1st of November) and *t* > 224 days (from the 1st of April till\
