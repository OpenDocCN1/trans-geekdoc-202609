    \ |\n| B*C | | 1 | 1 | 0.01244 | 0.008391 | 980 | 1.35 | 0.1761 |\n| B*C | | 1\
    \ | 2 | -0.00903 | 0.008391 | 980 | -0.98 | 0.3258 |\n| B*C | | 1 | 0 | | | |\
    \ | . | . |\n| B*C | | 2 | 1 | 0.003157 | 0.008391 | 980 | 0.34 | 0.7313 |\n|\
    \ B*C | | 2 | 2 | -0.00727 | 0.008391 | 980 | -0.79 | 0.4289 |\n| B*C | | 2 |\
