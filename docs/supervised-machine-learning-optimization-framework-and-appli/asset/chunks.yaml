    \ SAS Macro Program](#C02a_toc.xhtml#rsec7_1_2)\n\nBelow is the `%bootstrap` SAS\
    \ macro that is used to generate bootstrapped training or testing datasets. Parameters\
    \ for the `%bootstrap` macro are extracted from the metadata stored in the data\
    \ dictionary for input data component.\n\n```sas\n%macro bootstrap(\n   data=,\
    \ /* Input training dataset. */\n   output = , /* Output for bootstrapped training\
    \ dataset. */\n   samples=, /* Number of resamples to generate. */\n   size=,\
    \ /* Size of each resample. */\n   balanced=, /* 1 for balanced resampling; 0\
    \ for uniform resampling. */\n   random= /* Seed for pseudorandom numbers. */\n\
    \   );\n   \n   *** find number of observations in the input data set;\n   %global\
    \ _nobs;\n   data _null_;\n      call symput('_nobs',trim(left(put(_nobs,12.))));\n\
    \      if 0 then\n          set &data nobs=_nobs;\n      stop;\n   run;\n   \n\
    \   %if &balanced %then\n      %bootsbalance(data=&data,samples=&samples,random=\
    \ &random, output = &output);\n    %else\n      %bootsuni(data=&data,samples=&samples,random=&random,\
    \ size=&size, output = &output);\n   \n%mend bootstrap;\n   \n%macro bootsbalance\
    \ ( /* Balanced bootstrap resampling */\n   data=,\n   samples= ,\n   random=,\n\
    \   output =\n   );\n   \n* Gleason, J.R. (1988) \"Algorithms for balanced bootstrap\n\
    * simulations,\" American Statistician, 4, 26-266.\n   \n   data &output ;\n \
    \  drop _a _c _ii _j _big _k _s;\n   array _c(&_nobs) _temporary_; /* counts */\n\
    \   array _p(&_nobs) _temporary_; /* pointers */\n   do _j=1 to _nobs;\n     \
    \ _c(j)=&samples;\n   end;\n   do _j=1 to _nobs;\n      _p(j)=_j;\n   end;\n \
    \  _k=&nobs; /* number of nonempty cells */\n   _big=_k; /* index of largest cell\
    \ */\n   _big = &samples; /* _big >= _c(j) */\n   do _sample_=1 to &samples;\n\
    \      do _i=1 to _nobs;\n      do until(_s<=_c(j));\n         _j=ceil(uni(&random)*_k);\
    \ /* choose cell */\n         _s=ceil(uni(&random)*_big); /* accept cell */\n\
    \      end;\n      _l=_p(j);\n      _obs_=_l;\n      _c(j)+-1;\n      if _j=_big\
    \ then do;\n         _a=floor((&sample_+_k)/_k);\n         if _big-_c(j)>_a then\
    \ do;\n            do _ii=1 to _k;\n               if _c(ii)>_c(big) then _big=_ii;\n\
    \            end;\n            _big=_c(j);\n      end;\n   end;\n      if _c(j)=0\
    \ then do;\n         if _big=_k then _big=_j;\n         _p(j)=_p(k);\n       \
    \  _c(j)=_c(k);\n         _k+-1;\n      end;\n      set &data point = _l ;\n \
    \     output;\n   end;\n   end;\n   stop;\n   run;\n%mend bootsbalance;\n%macro\
    \ bootsuni ( /* Uniform bootstrap resampling */\n   data= ,\n   samples= ,\n \
    \  random= ,\n   size= ,\n   output =\n   );\n   \n   %if %bquote(&size)= %then\
    \ %let size=&_nobs;\n   \n   %local sample;\n   %do sample=1 %to &samples;\n \
    \  \n   data _tmp_&sample ;\n   _tmp = &sample ;\n   do _i=1 to &size;\n     \
    \ _l=ceil(uni(&random)*_nobs);\n      set &data point = _l ;\n      output;\n\
    \   end;\n   stop;\n   run;\n%end;\n"
