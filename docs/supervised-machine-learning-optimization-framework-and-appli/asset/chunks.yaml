- fmt: "\nDynamic neural networks never stop learning and continue to develop throughout\
    \ their operation. They continue adapting to the most recent data and change their\
    \ internal structure of neurons and weights. Dynamic neural networks are used\
    \ in situations where a system needs to learn new data during its operation. This\
    \ type of neural network is indispensable where we expect new input–output patterns,\
    \ for example when the domains change over time, or outputs are impacted by slow-moving\
    \ processes.\n\n## 2.3.2 Neural Network Components\n\n### 2.3.2.1 Activation Function\n\
    \nAn important component of a neural network classifier is an activation function,\
    \ which can be interpreted as an indicator function. The activation function of\
    \ a neuron defines the output of that neuron depending on inputs to the neuron.\
    \ Sigmoid functions are often used as the activation function. One example of\
    \ a sigmoid function is a logistic function:\n\n```\n${g\\left( x \\right) = \\\
    frac{1}{1 + \\exp\\left( {- x} \\right)}}\\\\mspace{54mu}\\\\operatorname{(2.3)}$\n\
    ```\n\nFor this activation function, `x` ≥ 0 activates the neuron.\n\nAnother\
    \ example of the activation function used in neural networks is the symmetric\
    \ sigmoid:\n\n```\n${g(x) = 2 \\times \\frac{1}{1 + \\exp\\left( {- x} \\right)}\
    \ - 1 = \\frac{1 - \\exp\\left( {- x} \\right)}{1 - \\exp\\left( {- x} \\right)}\
    \ = \\tanh\\left( \\frac{x}{2} \\right)}\\\\mspace{54mu}\\\\operatorname{(2.4)}$\n\
    ```\n\nMore examples include the rectified linear unit (ReLU) (equation 2.5) and\
    \ the radial basis function (equation 2.6):\n\n```\n${g\\left( x \\right) = \\\
    left\\\\{ \\begin{array}{l} {0,x \\leq 0} \\\\\\\\ {x,x > 0} \\\\\\\\ \\end{array}\
    \ \\right.}\\\\mspace{54mu}\\\\operatorname{(2.5)}$ `g`(`x`) = exp (−`x`²)   (2.6) \
    \ \n```\n\nFor the radial basis activation function, `x` = 0 activates the neuron\
    \ ([Figure 2.1](#C08_chapter2.xhtml#fig2_1)).\n\n![FIGURE 2.1 Activation functions.](images/file2.jpg)\n\
    \n**FIGURE 2.1**\n\nActivation functions.\n\n### 2.3.2.2 Neurons\n\nThe fundamental\
    \ component of a neural network is a neuron. It is composed of an activation function\
    \ `g` and a parameter vector $\\overset{\\\\rightarrow}{w} = \\left( {w_{0},w_{1},\\\
    ldots,w_{n}} \\right)$. A neuron takes a vector of real-value inputs, also called\
    \ features, and calculates the output using the activation function and the parameter\
    \ vector: if the result of the activation function is greater than the threshold\
    \ (or equal to a specified value), then the output is 1; otherwise, the output\
    \ is 0. More precisely, the output `o`(`x[1], … , `x[n]`) is computed by the neuron\
    \ formulated by equation (2.7).\n\n```\n${o\\left( {x\\_{1},\\ldots,x\\_{n}} \\\
    right) = \\left\\\\{ \\begin{array}{l} {1ifg\\left( {w\\_{0} + w\\_{1}x\\_{1}\
    \ + \\cdots + w\\_{n}x\\_{n}} \\right) > 0} \\\\\\\\ {0\\text{otherwise}} \\\\\
    \\\\ \\end{array} \\right.}\\\\mspace{54mu}\\\\operatorname{(2.7)}$\n```\n\nwhere\n\
    \n`w[i]` is the weight that determines the contribution of input `x[i]` to the\
    \ neuron output.\n\n`w[0]` is the threshold that the weighted combination of inputs\
    \ (`w[1]``x[1]` + ⋯ + `w[n]``x[n]`) must exceed to activate the neuron.\n\nThe\
    \ learning of neuron involves estimating the values of the weights `w[0]`, `w[1]`,\
    \ …, `w[n]`.\n\n### 2.3.2.3 Networks\n\nA neural network composes multiple neurons\
    \ into a single function, and there are many different algorithms that can perform\
    \ this job. Some of the neurons in a neural network use the vector of feature\
    \ values as input, others use the output from some neurons as input, and yet others\
    \ use a combination of the two. The parameters of a neural network include the\
    \ parameters of the neurons `g` and $\\overset{\\\\rightarrow}{w}$ , the way in\
    \ which the neurons are connected, and the parameters of an output layer of linear\
    \ functions. Neurons are typically arranged in layers according to what kind of\
    \ input they receive. At the input layer, neurons receive feature vectors as input,\
    \ and in subsequent layers, neurons receive outputs from previous layers as inputs.\
    \ The layers other than the input and output are called hidden layers of neurons.\n\
    \nAn example of a neural network is shown in [Figure 2.2](#C08_chapter2.xhtml#fig2_2).\
    \ This neural network has an output layer of `m` linear functions, `F[1]`, …,\
    \ `F[m]`, and a single hidden layer of `k` neurons, `Z[1]`, …, `Z[k]`.\n\n![FIGURE\
    \ 2.2 Neural network.](images/file3.jpg)\n\n**FIGURE 2.2**\n\nNeural network.\n\
    \n### 2.3.3 R for Neural Networks\n\nThe package `neuralnet` developed by Stefan\
    \ Fritsch, Frauke Guenther, Marvin N. contains the function `neuralnet` that implements\
    \ algorithms such as backpropagation (Riedmiller, 1994), resilient backpropagation\
    \ with or without weight, or the modified convergent version by Anastadis (2005)\
    \ and Taylor (2006). This function is very popular among researchers; however,\
    \ the usage of this function is not always correct.\n\n**TABLE 2.2**\n\nArguments\
    \ of the `neuralnet` Function\n\n| | Argument | Description |\n| --- | --- | ---\
    \ |\n| 1 | `formula` | a symbolic description of the model to be fitted |\n| 2\
    \ | `data` | a data frame containing the variables specified in the formula |\n\
    | 3 | `hidden` | a vector of integers specifying the number of hidden neurons\
    \ in each layer |\n| 4 | `threshold` | a numeric value specifying the threshold\
    \ for the partial derivatives of the error function as stopping criteria |\n|\
    \ 5 | `stepmax` | the maximum steps for the training |\n| 6 | `rep` | the number\
    \ of repetitions for the neural network |\n| 7 | `startweights` | a vector containing\
    \ starting values for the weights |\n| 8 | `learningrate.limit` | a vector or\
    \ a list containing the lowest and highest limit for the learning rate (for RPROP\
    \ and GRPROP) |\n| 9 | `learningrate.factor` | a vector or a list containing the\
    \ multiplication factors for the upper and lower learning rate (for RPROP and\
    \ GRPROP) |\n| 10 | `learningrate` | a numeric value specifying the learning rate\
    \ (for traditional backpropagation) |\n| 11 | `lifesign` | a string specifying\
    \ how much the function will print during the calculation of the neural network\
    \ (“none,” “minimal,” or “full”) |\n| 12 | `lifesign.step` | an integer specifying\
    \ the step size to print the minimal threshold in “full” lifesign mode |\n| 13\
    \ | `algorithm` | a string containing the algorithm type to calculate the neural\
    \ network |\n| 14 | `err.fct` | a differentiable function that is used for the\
    \ calculation of the error, or `sse` for the sum of squared errors, or `ce` for\
    \ the cross-entropy |\n| 15 | `act.fct` | a differentiable function that is used\
    \ for smoothing the result of the cross-product of the covariate or neurons and\
    \ the weights, or `logistic` for the logistic function, or `tanh` for a hyperbolic\
    \ tangent |\n| 16 | `linear.output` | If `act.fct` should not be applied to the\
    \ output neurons, set linear output to TRUE, otherwise to FALSE |\n| 17 | `exclude`\
    \ | a vector or a matrix specifying the weights that are excluded from the calculation\
    \ |\n| 18 | `constant.weights` | a vector specifying the values of the weights\
    \ that are excluded from the training process and treated as fix |\n| 19 | `likelihood`\
    \ | If the error function is equal to the negative log-likelihood function, the\
    \ information criteria AIC and BIC will be calculated. |\n"
