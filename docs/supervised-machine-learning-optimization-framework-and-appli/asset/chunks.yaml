    As mentioned earlier, we do not limit classification solution to only one classifier.
    On the one hand, it is often impossible to choose the best classifier based on
    the pairs of metrics like sensitivity and specificity. It is a common situation
    that some classifiers are better on sensitivity, others are better on specificity,
    and yet others are not the best but very good on both. Essentially, we may consider
    a classifier as a good one when both metrics are above the thresholds established
    based on the need of the application.


    On the other hand, we do not know how each classifier would perform on unseen
    data. Although the AI framework creates processes that help to improve the robustness
    of classifiers, it should be expected that the classification quality would decrease
    on new data. Thus, instead of one classifier, the AI framework uses a set of classifiers
    that made it to the top and then applies the voting approach to make a decision
    regarding the predicted classification.


    ## 1.3 SAS Procedures for the AI Framework Components


    This book should not be considered as a programming tutorial for SAS or R. There
    is extensive literature dedicated to this topic. However, we would like to demonstrate
    how some of the capabilities can be used and we hope that such examples will allow
    the reader to extend the AI framework by using other capabilities of SAS, R, or
    additional software.


    SAS has a powerful set of tools for machine learning methods, design of experiments
    (Lawson, 2010), analysis of experiment results, and much more. In this book, we
    use SAS procedures as elementary units for the AI framework. But this is not all.
    SAS has a powerful macro language that allows us to execute tasks according to
    the metadata stored in a data dictionary. This is the capability of SAS that we
    leverage in the AI framework (Guard, 2018).


    ## 1.4 R Libraries for the AI Framework Components


    R, by the nature of it being an open-source language, grows continuously in the
    area of machine learning and has multiple packages that can be used for advanced
    machine learning projects. In this book, we do not make an attempt to use all
    of the packages, but we invite the reader to consider an opportunity to use different
    machine learning methods and R packages. The `e1071` package is one of the most
    widely used R packages for machine learning, and the one we leverage in the book.
    This package allows us to implement such methods as support vector machine (SVM),
    shortest path computation, bagged clustering, naive Bayes classifier, short-time
    Fourier transform, and fuzzy clustering. Another package `kernlab` also implements
    SVM, as well as kernel feature analysis, ranking algorithm, dot product primitives,
    Gaussian process, and many more. This package provides different kernel functions
    such as polynomial, hyperbolic tangent, and Laplacian. For a neural network, `nnet`
    package can be used. Although this package has a single-layer limitation, it is
    still one of the most popular packages for neural networks. Random forest classifier
    that generates multiple decision trees can be built using the `randomforest` packages
    for machine learning. Yet another R machine learning package is `mboost` with
    the functional gradient descent algorithm for optimizing general risk functions.


    In addition to the machine learning capabilities, R offers the design of experiment
    packages that are necessary for the AI framework (Lalanne, 2006). For example,
    `doe.base` package offers utilities to design and analyze full factorial experiments
    and orthogonal arrays; `frf2` enables design and analysis of fractional factorial
    experiments with two-level factors; `dicedesign` allows us to design and execute
    computer experiments; `bsmd` is the package for Bayes screening and model discrimination
    utilities; and `doe.wrapper` is a wrapper package for design of experiment functionality.


    A variety of functions and procedures developed in SAS and R are the building
    blocks for the AI framework.


    ## References


    1. Guard, R. 2018. *Machine Learning with SAS®: Special Collection*. Cary, NC:
    SAS Institute Inc.

    2. Lalanne, C. 2006. *R Companion to Montgomery’s Design and Analysis of Experiments*.
    [https://www.semanticscholar.org/]

    3. Lawson, J. 2010. *Design and Analysis of Experiments with SAS*. Chapman and
    Hall: CRC.

    4. R Core Team. 2018. *R: A Language and Environment for Statistical Computing*.
    Vienna, Austria: R Foundation for Statistical Computing.


    # 2 Supervised Machine Learning and Its Deployment in SAS and R


    ## 2.1 Introduction


    Machine learning is the study of methods that program computers to learn from
    data. The formal definition of machine learning algorithms was given by Tom Mitchell
    (1997), who stated that “A computer program is said to learn from experience `E`
    with respect to some class of tasks `T` and performance measure `P` if its performance
    at tasks in `T`, as measured by `P`, improves with experience `E`.” In the scope
    of this book, we consider the supervised learning for classification applied,
    for example, to the problems where human experts exist, but where they are unable
    to explain their expertise. Specifically, in Part III we will demonstrate how
    to build classification solution in the cases of underwriters’ decision-making
    process in insurance and financial industries.


    There are several different types of machine learning algorithms (Dietterich,
    2000). Supervised or semi-supervised learning, sometimes called inductive learning,
    builds models using training datasets that include both input data and desired
    outputs. When the problem relates to classification, the outputs are called labels.
    Using these outputs, supervised learning algorithms reveal a function that can
    predict the output associated with new inputs.


    One of the examples that we will review in this book is when insurance underwriters
    exhibit expert-level abilities to evaluate an application for insurance and respond
    to the applicant with the most suitable offer, but they cannot accurately describe
    the steps they perform during the underwriting process and cannot share their
    knowledge and experience with young and less skillful underwriters. In this example,
    the historical data about underwriters decision making can provide examples of
    the inputs and outputs so that machine learning algorithms can learn to model
    the underwriters’ decisions. An example of application of supervised classification
    would be to develop a computer program that, when given an application for insurance
    in a specific insurance line of business, will determine what would be the applicant’s
    response (accept or reject) to a specific insurance offer. Such a program is called
    a classifier, as it assigns a class (accept or reject) to an object (applicant).
    The task of supervised learning is to construct a classifier given a set of already
    classified (labeled) examples like a set of insurance applications and offered
    insurance products, labeled with the acceptance or rejection responses. In the
    case of semi-supervised learning, desired outputs also contain missing values.


    Unsupervised learning is the case when training data does not include desired
    outputs. An example of unsupervised learning is clustering where an algorithm
    attempts to find some structure in the data, like grouping or clustering of data
    points. Such algorithms learn from data that has not been labeled, classified,
    or categorized. In this case, it is hard to tell what good learning is and what
    is not.


    The most ambitious type of learning is reinforcement learning. It is a type of
    machine learning technique that enables an algorithm to learn in an interactive
    environment, by trial and error, using feedback from its own actions and experiences
    as a reward or punishment.

