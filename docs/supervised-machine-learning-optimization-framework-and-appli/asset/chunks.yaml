    The columns of the `Experiment` table are defined as shown in [Table 8.1](#C14_chapter8.xhtml#tab8_1).


    **TABLE 8.1**


    Columns of the Experiment Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `EXP_ID` | Character | 8 | Experiment ID |

    | `FEATURE_ID` | Character | 8 | Reference to the primary key of the `Features`
    table |

    | `METHOD_ID` | Character | 8 | Reference to the primary key of the `ML_Method`
    table |

    | `METRIC_ID` | Character | 8 | Reference to the primary key of the `Metrics`
    table |

    | `DESIGN` | Character | 4 | Type of design of experiment: FULL; FRAC |

    | `MODEL` | Character | 8 | Type of model of possible effects of factors on response,
    where response is a quality metric defined in the `Metrics` table: MAIN—effects
    only, D2—main effects and second-degree interactions, D3—main effects and up to
    third-degree interactions |


    The `EXP_ID` column comprises the primary key of the `Experiment` table. The `Experiment`
    table defines what datasets should be used, with which features set, what machine
    learning method should be applied, and what metrics will be used to determine
    the quality of results of application of machine learning method. References to
    datasets, features sets, methods of machine learning, and quality metrics are
    defined in the `FEATURE_ID`, `METHOD_ID`, and `METRIC_ID` columns. The metadata
    for these references is located in the `Output` table that is defined in input
    component data dictionary (Part II, [Chapter 7](#C13_chapter7.xhtml#chapter7)).
    The other tables will be defined below.


    ### 8.1.2 Features Table](#C02a_toc.xhtml#rsec8_1_2)


    The columns of the `Features` table are defined as shown in [Table 8.2](#C14_chapter8.xhtml#tab8_2).


    **TABLE 8.2**


    Columns of the Features Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `FEATURE_ID` | Character | 8 | Features set ID |

    | `OUTPUT_TABLE_ID` | Character | 8 | Reference to the primary key of the `Output`
    table of input component data dictionary |

    | `OUTPUT_ROLE` | Character | 80 | Reference to the primary key of the `Output`
    table |

    | `VAR_NAME` | Character | 1 | Variable name from the dataset defined in the `Output`
    table with `OUTPUT_TABLE_ID` |


    The `FEATURE_ID`, `OUTPUT_TABLE_ID`, `OUTPUT_ROLE`, and `VAR_NAME` columns comprise
    the primary key of the `Features` table. The `Features` table defines what variables
    from dataset should be used for the specified machine learning method in the `Experiment`
    table.


    ### 8.1.3 Metrics Table](#C02a_toc.xhtml#rsec8_1_3)


    The columns of the `Metrics` table are defined as shown in [Table 8.3](#C14_chapter8.xhtml#tab8_3).


    **TABLE 8.3**


    Columns of the Metrics Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `METRIC_ID` | Character | 8 | Metric ID |

    | `SID` | Character | 8 | Sequential number |

    | `METRIC` | Character | 8 | Metric name |

    | `MIN_CUTOFF` | Numeric | 8 | Minimum cutoff value for a metric below which the
    quality is unacceptable |

    | `MAX_CUTOFF` | Numeric | 8 | Maximum cutoff value for a metric |


    The `METRIC_ID` and `SID` columns comprise the primary key of the `Metrics` table.
    The `Metrics` table defines what metrics, such as sensitivity, specificity, along
    with their cutoff minimum and maximum values should be used to assess the quality
    of results of application of machine learning methods defined in the `ML_Method`
    table.


    ### 8.1.4 ML_Method Table](#C02a_toc.xhtml#rsec8_1_4)


    The columns of the `ML_Method` table are defined as shown in [Table 8.4](#C14_chapter8.xhtml#tab8_4).


    **TABLE 8.4**


    Columns of the ML_Method Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `METHOD_ID` | Character | 8 | Machine learning method ID |

    | `METHOD_NAME` | Character | 8 | Machine learning method name |

    | `KERNEL` | Character | 8 | Kernel transformation name |

    | `PAR_NAME` | Character | 8 | Reference to `PAR_NAME` column of the `Hyperparameters_Domain`
    table |

    | `MIN_VALUE` | Numeric | 8 | Minimum value of hyperparameter |

    | `MAX_VALUE` | Numeric | 8 | Maximum value of hyperparameter |

    | `LEVELS` | Numeric | 8 | Number of levels (aggregation groups) for values of
    hyperparameters |


    The `METHOD_ID`, `METHOD_NAME`, `KERNEL`, and `PAR_NAME` columns comprise the
    primary key of the `ML_Method` table. The `ML_METHOD` table defines the name of
    the machine learning method, its kernel transformation and references to hyperparameters
    associated with method and kernel transformation and their minimum and maximum
    values and number of groups (`LEVELS` column) into which the values of hyperparameters
    should be aggregated. This aggregation will allow specifying the factorial experiment
    where hyperparameters serve as factors and their discrete groups serve as levels
    of those factors. These hyperparameters are defined in the `Hyperparameters_Domain`
    table below.


    ### 8.1.5 Hyperparameters_Domain Table](#C02a_toc.xhtml#rsec8_1_5)


    The columns of the `Hyperparameters_Domain` table are defined as shown in [Table
    8.5](#C14_chapter8.xhtml#tab8_5).


    **TABLE 8.5**


    Columns of the Hyperparameters_Domain Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `METHOD_NAME` | Character | 8 | Hyperparameter ID |

    | `KERNEL` | Character | 8 | Kernel name |

    | `PAR_NAME` | Character | 8 | Hyperparameter name |

    | `VALUE_TYPE` | Character | 1 | Value type: I(nteger), C(continues) |

    | `UPPER_VALUE` | Numeric | 8 | Highest possible value of hyperparameter |

    | `LOWER_VALUE` | Numeric | 8 | Lowest possible value of hyperparameter |


    The `METHOD_NAME`, `KERNEL`, and `PAR_NAME` columns comprise the primary key of
    the `Hyperparameters_Domain` table.


    ### 8.1.6 Results Table](#C02a_toc.xhtml#rsec8_1_6)


    The columns of the `Results` table are defined as shown in [Table 8.6](#C14_chapter8.xhtml#tab8_6).


    **TABLE 8.6**


    Columns of the Results Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `EXP_ID` | Character | 8 | Experiment ID |

    | `SID` | Integer | 8 | Sequential number |

    | `FEATUIRE_ID` | Character | 8 | Feature ID |

    | `RESULT_METRIC_ID` | Character | 8 | Result metric ID |

    | `METHOD_NAME` | Character | 8 | ML method |

    | `KERNEL` | Character | 8 | Kernel name |

    | `PAR_NAME` | Character | 8 | Hyperparameter name |

    | `LEVEL_VALUE` | Numeric | 8 | Optimal level for hyperparameter |


    The `EXP_ID` and `SID` columns comprise the primary key of the `Results` table.
    This table contains results of experiment in terms of ML method, kernel, features,
    and hyperparameters and their optimal values that are located in a specified interval
    (level). The content of this table is produced by an SAS and/or R computer program
    that executes statistically designed experiments defined as metadata in the five
    tables described above.


    ### 8.1.7 Results_Metrics Table](#C02a_toc.xhtml#rsec8_1_7)


    The columns of the `Results_Metrics` table are defined as shown in [Table 8.7](#C14_chapter8.xhtml#tab8_7).


    **TABLE 8.7**


    Columns of the Results_Metrics Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `RESULT_METRIC_ID` | Character | 8 | Result metric ID |

    | `METRIC ID` | Character | 8 | Metric ID |

    | `METRIC_SID` | Integer | 8 | Sequential number of the `Metrics` table |

    | `METRIC_value` | Numeric | 8 | Result metric value |

