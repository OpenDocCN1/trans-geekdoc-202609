    \n%macro bootstrap(\n   data=, /* Input training dataset. */\n   output = , /*\
    \ Output for bootstrapped training dataset. */\n   samples=, /* Number of resamples\
    \ to generate. */\n   size=, /* Size of each resample. */\n   balanced=, /* 1\
    \ for balanced resampling; 0 for uniform resampling. */\n   random= /* Seed for\
    \ pseudorandom numbers. */\n   );\n   \n   *** find number of observations in\
    \ the input data set;\n   %global _nobs;\n   data _null_;\n      call symput('_nobs',trim(left(put(_nobs,12.))));\n\
          if 0 then\n         set &data nobs=_nobs;\n      stop;\n   run;\n   \n   %if\
    \ &balanced %then\n      %bootsbalance(data=&data,samples=&samples,random= &random,\
    \ output = &output);\n    %else\n      %bootsuni(data=&data,samples=&samples,random=&random,\
    \ size=&size, output = &output);\n   \n%mend bootstrap;\n   \n%macro bootsbalance\
    \ ( /* Balanced bootstrap resampling */\n   data=,\n   samples= ,\n   random=,\n\
       output =\n   );\n   \n* Gleason, J.R. (1988) \"Algorithms for balanced bootstrap\n\
    * simulations,\" American Statistician, 42, 263-266;\n   \n   data &output ;\n\
       \n   drop _a _cbig _ii _j _jbig _k _s;\n   array _c(&_nobs) _temporary_; /*\
    \ cell counts */\n   array _p(&_nobs) _temporary_; /* pointers */\n   do _j=1\
    \ to &_nobs;\n      _c(_j)=&samples;\n   end;\n   do _j=1 to &_nobs;\n      _p(_j)=_j;\n\
       end;\n   _k=&_nobs; /* number of nonempty cells left */\n   _jbig=_k; /* index\
    \ of largest cell */\n   _cbig = &samples; /* _cbig >= _c(_j) */\n   do _sample_=1\
    \ to &samples;\n      do _i=1 to &_nobs;\n      do until(_s<=_c(_j));\n         _j=ceil(ranuni(&random)*_k);\n\
                /* choose a cell */\n         _s=ceil(ranuni(&random)*_cbig);\n            /*\
    \ accept cell? */\n      end;\n      _l=_p(_j);\n      _obs_=_l;\n      _c(_j)+-1;\n\
          if _j=_jbig then do;\n         _a=floor((&samples-_sample_+_k)/_k);\n         if\
    \ _cbig-_c(_j)>_a then do;\n            do _ii=1 to _k;\n               if _c(_ii)>_c(_jbig)\
    \ then _jbig=_ii;\n         end;\n            _cbig=_c(_jbig);\n         end;\n\
          end;\n             if _c(_j)=0 then do;\n               if _jbig=_k then\
    \ _jbig=_j;\n               _p(_j)=_p(_k);\n               _c(_j)=_c(_k);\n               _k+-1;\n\
             end;\n            set &data point = _l ;\n            output;\n      end;\n\
       end;\n   stop;\n  run;\n%mend bootsbalance;\n%macro bootsuni ( /* Uniform bootstrap\
    \ resampling */\n   data= ,\n   samples= ,\n   random= ,\n   size= ,\n   output\
    \ =\n   );\n   \n   %if %bquote(&size)= %then %let size=&_nobs;\n   \n   %local\
    \ sample;\n   %do sample=1 %to &samples;\n   \n   data _tmp_&sample ;\n      sample\
    \ = &sample ;\n      do _i=1 to &size;\n         _p=ceil(ranuni(%eval(&random+&sample))*&_nobs);\n\
             set &data point=_p;\n         output ;\n      end;\n      stop;\n   run;\n\
          %if &sample > 1 %then %do ;\n      proc append base = _tmp_1 data = _tmp_&sample\
    \ ;\n      run ;\n      %end ;\n   \n   %end;\n   data &output ;\n      set _tmp_1\
    \ ;\n   run ;\n   \nproc datasets library = work memtype=data noprint ;\n   delete\n\
       %do sample =1 %to &samples;\n      _tmp_&sample\n    %end ;;\n  run ;\n  quit\
    \ ;\n%mend bootsuni;\n```\n\n### [7.1.3 R Program](#C02a_toc.xhtml#rsec7_1_3)\n\
    \nA major component of bootstrapping is being able to resample a given dataset,\
    \ and in R, the function which does this is the sample function.\n\n```\n\nsample\
    \ (data, size, replace, prob)\n```\n\nThe first argument, data, is a vector containing\
    \ the dataset to be resampled or the indices of the data to be resampled. The\
    \ size option specifies the sample size with the default being the size of the\
    \ population being resampled. The replace option determines whether the sample\
    \ will be drawn with or without replacement where the default value is FALSE,\
    \ i.e., without replacement. The prob option takes a vector of length equal to\
    \ the dataset given in the first argument containing the probability of selection\
    \ for each element of data. The default value is for a random sample where each\
    \ element has an equal probability of being sampled. You can create bootstrapped\
    \ samples using the sample and replicate functions:\n\n```\n\nReplicate (number_samples,\
    \ sample())\n```\n\n## [7.2 Summary](#C02a_toc.xhtml#rsec7_2)\n\nThis chapter\
    \ described a data dictionary for input data component of AI framework. It supports\
    \ code-free design and facilitates robust implementation. This chapter described\
    \ tables comprising the data dictionary as well as showed the relationships among\
    \ those tables. These relationships outline the process of data cleansing, outliers\
    \ detection and treatment, and generation of training or testing datasets. This\
    \ data dictionary is flexible enough to be extended by the reader. In the next\
    \ chapters, we describe data dictionaries for design of experiments and support\
    \ vector machine classification.\n\n# [8](#C02a_toc.xhtml#rchapter8)\n\n[Design\
    \ of Experiment for Machine Learning Component](#C02a_toc.xhtml#rchapter8)\n\n\
    ## [8.1 Data Dictionary](#C02a_toc.xhtml#rsec8_1)\n\nIn order to find optimal\
    \ hyperparameters for supervised machine learning, multiple experiments should\
    \ be conducted by data scientists. These experiments may answer the questions\
    \ which class of kernel transformation to use, what features (data variables)\
    \ to include, what values for hyperparameters to use, etc. Without a standardized\
    \ way of managing the results of multiple experiments with machine learning method\
    \ applied with different kernels, features, and hyperparameters, it will be virtually\
    \ impossible to reproduce or compare the results of experiments. To achieve comparability\
    \ and reproducibility of experiments the definitions of such experiments should\
    \ be stored as metadata in a specially structured data (Kolosova and Berestizhevsky,\
    \ 1995).\n\nA data dictionary for the design of experiment for machine learning\
    \ component is intended to define what experiments should be performed to find\
    \ a combination of features set (set of data variables) and optimal hyperparameters\
    \ for a specified machine learning method. This data dictionary includes, at a\
    \ minimum, machine learning method name, kernel or activation function, and list\
    \ of hyperparameters as well as definitions of the statistically designed experiment\
    \ such as the type of experiment, statistical model, and metrics to define the\
    \ quality of results of the execution of a machine learning method. The data dictionary\
    \ also includes definitions of types and values of hyperparameters. There are\
    \ seven tables that comprise the design of experiments for machine learning component\
    \ data dictionary. They are Experiment, Metrics, Features, ML\\_Method, Hyperparameters\\\
    _Domain, Results, and Results\\_Metrics. Relations among the tables of the data\
    \ dictionary are presented in [Figure 8.1](#C14_chapter8.xhtml#fig8_1).\n\n![FIGURE\
    \ 8.1 Data dictionary for design of experiments for machine learning component.](images/file8.jpg)\n\
    \n**FIGURE 8.1**  \n\nData dictionary for design of experiments for machine learning\
    \ component.\n\nThe two most important reasons to define experiments through metadata\
    \ are to ensure comparability across multiple experiments with different values\
    \ of hyperparameters, different features sets, kernel transformations, and types\
    \ of experiments as well as to ensure reproducibility of the results of experiments.\n\
    \n### [8.1.1 Experiment Table](#C02a_toc.xhtml#rsec8_1_1)"
