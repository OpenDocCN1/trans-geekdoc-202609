    一对多关系 (1:M) 是存在于表之间的一种关系，其中第一个表中的每一行都对应第二个表的一行，但反之则不然。


    ### 6.2.10 主键


    根据关系数据模型，每个表都必须有一个主键。主键是一个列或一组列，它确保了表中的每一行都是唯一的。只要该列（或若干列）能为关系型表中的每行定义一个唯一值，就可以作为主键。


    ### 6.2.11 外键


    关系数据模型中使用的另一个术语是外键。外键用于将相关的表“链接”在一起。外键是一个列或一组列，它定义了一个数据值，该值必须存在另一个关系型表中，并作为该其他表的主键。关系数据模型通过匹配一个表中的主键值与相关表中相同的外键值来维护关系型“链接”。请注意，一个表只能有一个主键，但可以有任意数量的外键（因为一个表可以与任意数量的其他表相关联）。


    ### 6.2.12 缺失值


    缺失值的概念是必要的，因为现实世界的信息往往是不完整的，我们需要某种方法来处理这种不完整性。在以下情况下缺失值很有用：


    *   当创建一个新行，但用户目前无法为某些列提供值时。应用程序可以为新行的这些列提供缺失值。

    *   当向现有表添加新列时。新列的值可以定义为所有现有行的缺失值。

    *   当对表中的某一列应用聚合函数（如摘要）时。在计算该函数时，应用程序能够识别并忽略那些已提供缺失值的行是理想的。（同时，让用户理解这种情况发生的情况也是理想的；例如，平均值不等于总和除以计数。）


    为了表示表中的某一列的缺失值，有必要找到一个与该列中所有合法符号都不同的符号。


    ### 6.2.13 数据字典


    关于应用程序的所有内容都定义在具有特殊结构的表中，这些表构成了一个表驱动的环境。这些表是复杂的，并允许最终应用程序具有大量的复杂性。特殊程序将从这些表（元数据）中提取数据转换为应用程序代码。此类表和程序构成了数据字典。


    ## 6.3 数据字典的属性


    数据字典是关于应用程序相关对象的各种信息的存储库，例如应用程序表及其列、用户、访问权限和完整性约束。为了定义一个应用程序，我们需要构建一组数据字典表，这些表将包含关于应用程序对象的数据（元数据）。


    数据字典表的可能包含六张表：`Library`、`Object`、`Location`、`Message`、`Property` 和 `Link`。这组表被称为
    `Kernel` 集合，可以通过额外的表进行扩展。`Kernel` 表本身可以在关系模型中定义。


    ### 6.3.1 Library 表


    `Library` 表列出了关于位置的规范。表的列定义在表 6.1 中。


    **表 6.1**


    | 列名 | 类型 | 长度 | 描述 |

    | --- | --- | --- | --- |

    | Table | Character | 8 | 表名 |

    | Location | Character | 80 | 表位置 |

    | Library | Character | 8 | 库名 |


    `Table` 列是 `Library` 表的主键。


    ### 6.3.2 Object 表


    `Object` 表列出了应用程序表及其对应的数据集。列的定义与表 6.2 相同。


    **表 6.2**


    | 列名 | 类型 | 长度 | 描述 |

    | --- | --- | --- | --- |

    | Table | Character | 8 | 表名 |

    | Title | Character | 80 | 表标题 |

    | Dataset | Character | 8 | 数据集名 |


    `Table` 列是 `Object` 表的主键。


    ### 6.3.3 Location 表


    `Location` 表列出了应用程序表和库。列定义在表 6.3 中。


    **表 6.3**


    | 列名 | 类型 | 长度 | 描述 |

    | --- | --- | --- | --- |

    | Table | Character | 8 | 表名 |

    | Library | Character | 8 | 库名 |


    `Table` 和 `Library` 列构成了 `Location` 表的主键。


    ### 6.3.4 Message 表


    `Message` 表列出了应用程序消息。列定义在表 6.4 中。


    **表 6.4**


    | 列名 | 类型 | 长度 | 描述 |

    | --- | --- | --- | --- |

    | Message | Numeric | 8 | 消息标识码 |

    | Text | Character | 80 | 消息文本 |

    | Mestype | Character | 1 | 消息类型：E—错误，W—警告，I—信息 |

    | Output | Character | 2 | 输出目标：S—屏幕和或 D—数据集 |


    `Message` 列是 `Message` 表的主键。


    ### 6.3.5 Property 表


    `Property` 表指定了应用程序表的属性。`Property` 表列出了每个表的列。对于每一列，定义了以下信息：


    *   该列所属的表名

    *   列名

    *   列数据类型

    *   列长度

    *   列域

    *   屏幕表上的位置等


    列定义在表 6.5 中。


    **表 6.5**


    | 列名 | 类型 | 长度 | 描述 |

    | --- | --- | --- | --- |

    | Table | Character | 8 | 表名 |

    | Column | Character | 8 | 列名 |

    | Type | Character | 1 | 列数据类型：C—字符或 N—数值 |

    | Length | Numeric | 8 | 列长度 |

    | Attribut | Character | 2 | 列属性：P—主键 |

    | Domtab | Character | 8 | 域表名 |

    | Domcol | Character | 8 | 域列名 |

    | Meantab | Character | 8 | 含义表名 |

    | Meancol | Character | 8 | 含义列名 |

    | Initval | Character | 80 | 列初始值 |

    | Formula | Character | 80 | 计算列的公式 |

    | Missing | Character | 1 | 缺失值代码 |


