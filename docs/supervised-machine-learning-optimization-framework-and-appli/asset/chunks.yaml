    In most insurance risk papers, the authors take the proportional hazard assumption
    for granted and make no attempts to check that it has not been violated in their
    data. However, it is a strong assumption indeed. Note that, when used inappropriately,
    statistical models may give rise to misleading conclusions. Therefore, it is highly
    important to check underlying assumptions (Arjas, 1988, Gill and Schumacher, 1987).
    Perhaps the easiest and most commonly used graphical method for checking proportional
    hazard is the so-called “log-negative-log” plot. For this method, one should plot
    `ln(-ln(S[i](t)))` vs. `ln(t*)` and look for parallelism—the constant distance
    between curves over time. This can be done only for categorical covariates. If
    the curves show a non-parallel pattern, then the assumption of proportional hazard
    is violated, and, as a result, the analytical estimation of `β` coefficients is
    incorrect.


    For claims in seven industries in Illinois, log-negative-log plot is presented
    in [Figure 11.2](#C17_chapter11.xhtml#fig11_2). This plot shows that the proportional
    hazard model assumption does not hold: the lines of the log-negative-log plot
    are not parallel and intersect.


    ![FIGURE 11.2 Log-negative-log plot for Illinois.](images/file15.jpg)


    **FIGURE 11.2**


    Log-negative-log plot for Illinois.


    We use industry as a categorical covariate, assuming that time-to-event (survival)
    functions vary by industries. It is wrong to assume that there is no impact on
    the baseline hazard function for different values of this covariate variable.
    For example, hazard changes for Agriculture depending on seasons; or for Transportation
    depending on weather; or for Hospitality depending on school break schedule.


    All these conditions latently depend on time, which means that the impact of industry
    categorical variable does not remain constant over time, thus violating assumptions
    of the Cox model. In order to account for season dependency, we introduce time-dependent
    covariate for the winter season and use an extended Cox model (Hosmer and Lemeshow,
    1999):


    ```

    ${h_{i}\left( t \right) = h_{0}\left( t \right)\exp\left( {{\sum\limits_{i = 1}^{k}{\beta_{j}x_{ij}}}
    + {\sum\limits_{n = 1}^{m}{\gamma_{n}x_{in}g_{n}\left( t \right)}}} \right)}\mspace{54mu}\operatorname{(11.6)}$

    ```


    where:


    * `h[i](t)`—the hazard function for subject `i` at time `t`

    * `x[1]`, …, `*x[k]`—the covariates

    * `h[0](t)`—the baseline hazard function, that is, the hazard function for the
    subject whose covariates `x[1]`, …, `*x[k]` all have values of 0

    * `g[n](t)` —the function of time (time itself, log time, etc.)

    * `β[1]`, …, `*β[k]` —the coefficients of the Cox model.


