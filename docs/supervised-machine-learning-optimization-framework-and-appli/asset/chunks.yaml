    1. Athreya, K. B. 1987. Bootstrap estimation of the mean in the infinite variance
    case. *The Annals of Statistics*, 15: 724–731.

    2. Bickel, P. J., Gotze, F., and van Zwet, W. R. 1997. Resampling fewer than n
    observations: gains, losses, and remedies for losses. *Statistica Sinica*, 7:
    1–31.

    3. Efron, B. 1979. Bootstrap methods; another look at the jackknife. *The Annals
    of Statistics*, 7: 1–26.

    4. Efron, B. 1982. The jackknife, the bootstrap, and other resampling plans. *CBMS-NSF
    Regional Conference Series in Applied Mathematics.* Vol. 38. Stanford, California:
    Stanford University.

    5. Efron, B., and Tibshirani, R. J. 1993. *An Introduction to the Bootstrap*.
    New York: Chapman and Hall.


    # 4. 异常值检测及其在 SAS 和 R 中的部署


    ## 4.1 引言


    机器学习过程无论使用何种方法，都高度于所谓的输入数据集。它是使算法训练和测试成为可能的关键方面。数据集是数据的集合。换句话说，一个数据集对应于数据表的内容，或者单个统计数据矩阵
    `X`(`n`×`p`)，其中表格的每列 `j` = 1, …, `p` 代表一个特定的变量（特征），每行 `i` = 1, …, `n` 对应数据集的特定观测值。


    输入数据集既是训练数据集也是测试数据集的来源。训练数据集用于训练算法，以应用机器学习概念（如神经网络和支持向量机）来学习并产生结果。训练数据集包含了所谓的标记观测值，它由输入数据和预期输出组成。测试数据集用于评估算法的训练效果。在机器学习项目中，测试阶段的目标是评估在训练过程中创建的分类器处理未见过的数据的能力。如何。由于输入数据集通常存在缺陷，数据清洗是机器学习过程中的一个非常重要的重要步骤。简而言之，数据清洗是一系列帮助使数据集更适合机器学习的程序。通俗地说，训练数据的质量决定了机器学习算法的性能。


    ## 4.2 异常值检测与处理


    当 `p` > 2 时，很难在 `p` 变量数据中检测异常值，因为无法再依赖对数据的直视检查。虽然使用马哈拉宾距离（Mahalanobis distances）检测单个异常值相对容易，但由于异常值并不一定具有较大的马哈拉宾距离会导致掩盖效应，这种方法对于多个异常值不再适用。Donoho
    (1982) 以及 Donoho and Gasko (1992) 证明，在存在 `n`/(`p`+1) 个异常值的情况下，许多估计位置参数的方法都会失效，其中
    `n` 是观测值数量，`p` 是变量数量。我们建议使用 Rousseeuw (1985) 的最小协差确定（MCD）方法来检测多变量环境下的多个异常值。


    ### 4.2.1 最小协差确定法


    MCD 方法的目标是从 `n` 个观测值中找到 `h` 个，使其协方差矩阵行列式最小。MCD 均估计是这些 `h` 个观测值的平均值，而 MCD 方差估计是它们的协方差矩阵。MCD
    有一个重要的优点。根据 Butler 等人 (1993) 的观点，它在统计上是有效的，因为 MCD 是渐近正态的。尽管有这一优点，由于计算复杂性，MCD 尚未被广泛应用于异常值检测。新开发的
    MCD 快速算法（Rousseeuw and Van Driessen, 1999）在统计效率和计算速度方面远优于其他方法。此外，MCD 可以处理大规模的训练数据集，这就是为什么我们推荐使用
    MCD 方法检测多变量数据集中的异常值。MCD 算法的动机可以解释如下。


    假设我们从输入数据集 `X` = (`x[1]`, `x[2]`, …, `x[n]`) 中取一个大小为 `h` 的随机样本 `X`[`h`]`。我们可以评估全量数据集中的数据点与我们的随机采样子集之间的相似性。令
    `M` = (`μ[1]`, `μ[2]`, …, `μ[p]`) 为子集的均值，`S` 为子集的协方差矩阵。我们使用马哈拉宾距离 `D` 来估计相似性：


    ```

    D = [(X-M)^T * S^(-1) * (X-M)]^(1/2)

    ```


    该算法的基本思想是从大小为 `p+1` 的小子集开始，计算均值 `M`、协方差矩阵 `S` 以及对应的马哈拉宾距离最小的 `h` 子集。


    关于 Fast-MCD 算法的详细描述，请读者参考 Rousseeuw 和 Van Driessen (1999)。Boudt 等人 (2018) 开发的新算法处理变量超过数据集大小的情况。因此，当训练数据集的大小小于变量数量时，MCD
    方法应被最小正则化协差确定（MRCD）方法取代。


    ### 4.2.2 SAS 中的 MCD


    Fast-MCD 算法实现在不同的软件包中，如 R、SAS 和 Python。然而，该算法的实现取决于其用途。例如，`robustbase` 包中的 R 语言函数
    `CovMcd` 使用 MCD 算法计算可鲁棒估计，但并不会产生清洗异常值的数据集。


    SAS 软件拥有 `ROBUSTREG` 过程，它通常被用于回归过程。然而，`PROC ROBUSTREG` 也可以计算 MCD 估计。`PROC ROBUSTREG`
    中的可用语句如表 4.1 所示。


    **表 4.1 `ROBUSTREG` 过程的参数**


    | `PROC ROBUSTREG <options>` | 调用过程 |

    | :--- | :--- |

    | `BY` 变量 | 允许对 `BY` 变量定义的组中的观测值进行独立分析。 |

    | `CLASS` 变量 | 指定哪些解释变量视为分类变量。 |

    | `EFFECT name=effect-type(variables < / options >)` | 用于构建设计矩阵的特殊列集合。 |


