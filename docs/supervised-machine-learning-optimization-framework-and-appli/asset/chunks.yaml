    Let us assume that the distribution of `θ̂`(`X*)` given `θ` is symmetric about
    `θ` for each `θ`. Then the distribution of `θ̂`(`X^**)` will also be symmetric
    about `θ`, and a good estimator of `θ` will be:


    `θ̂[med]*(x) = median{θ̂[i]*,i=1,…k}` (3.8)


    Now, the 95% confidence interval for `θ` can be constructed as the upper and lower
    2.5% quantiles of the sampled values `θ̂[i]*)` . Thus, the bootstrap percentile
    95% confidence interval for `θ` can be constructed as:


    (`θ̂[(U)]*,θ̂[(k + 1 − U)]*)`) (3.9)


    where


    `θ̂[i]*)` are the values `θ̂[i]*)` sorted in ascending order so that `θ̂[(1)]*
    ≤ θ̂[(2)]* ≤  ≤ θ̂[(k)]*`.


    `U` is equal to the 0.025 `k` value, rounded down to the nearest integer (if `U
    = 0`, then it is replaced by 1).


    The value 0.025 is calculated based on the given bootstrap percentile confidence
    interval, that is for 95% confidence interval this value is obtained as (1 − 0.95)/2
    = 0.025.


    For example, if `k = 1,000`, then `U = 25` and `k + 1 − U = 976`, and the bootstrap
    percentile 95% confidence interval will look like (`θ̂[(25)]*,θ̂[(976)]*)`).


    The advantages of equation (3.9) over equation (3.7) are as follows:


    1. It does not require a theoretical (analytical) formula to calculate the confidence
    interval, which can be difficult to derive for complex estimators of `θ`.

    2. The endpoints of the confidence interval (equation 3.9) are realizable values
    of `θ = θ̂(`X*)`.


    In addition, it is obvious that replacing `θ` by any monotonic function of `θ`
    replaces the bootstrap-sampled values for `θ` by the same monotonic function of
    those values. Thus, generating the median estimate (equation 3.8) and confidence
    interval (equation 3.9) for log(`θ`) and then exponentiating the results leads
    to exactly the same results as if we had worked with `θ` in the first place. In
    general, if `g(θ)` is any monotonic function of `θ`, the following is true:


    ${{\hat{\text{g}\left( \theta \right)}}\_{i}^{\*} = g\left( {\\hat{\theta}}\_{i}^{\*}
    \right)}\mspace{54mu}\operatorname{(3.10)}$


    where


    ${\hat{\text{g}\left( \theta \right)}}\_{i}^{\text{*}}$ means the `i`th bootstrap-sampled
    value for `g(θ̂(`X*)))`.


    This suggests yet the additional advantage of the bootstrap percentile confidence
    interval (equation 3.9) over the confidence interval based on normal distribution
    (equation 3.7). The proper scaling of `θ` is very often unclear or may seem to
    require transforming the values in equation (3.7) to eliminate outliers. Equation
    (3.10) means that we obtain the same median estimate (equation 3.8) and confidence
    intervals (equation 3.9) for any monotonic transformation of `θ`. It is important
    to keep in mind that the bootstrap percentile estimators (equations 3.8 and 3.9)
    were derived based on the assumption that the distribution of `θ̂(`X*)` as a function
    of `θ` is symmetric about `θ`. The property (equation 3.10) weakens this assumption
    as now we can just assume the existence of a monotonic strictly increasing function
    `g(θ)` such that `g(θ̂(`X*)))`, as a function of `θ` is symmetrically distributed
    around `g(θ)`, which creates a significantly large class of estimators.


    ### 3.2.3 Bias Reduction


    Bootstrap allows us to estimate and then reduce bias.


    The bootstrap estimator `B*` of bias is `E(θ̂*-θ̂*)`, where `θ̂*` is an estimate
    of `θ` based on a bootstrap sample. An approximation of `B*` is obtained by doing
    `k` bootstrap samples and then averaging the differences between the estimates
    `θ̂[i]*)` and the original sample estimate `θ̂`:


    ${{\hat{B}}^{\*} = {\\sum\limits\_{i = 1}^{k}{\left( {{\{\hat{\theta}}\_{i}^{\*}
    - \hat{\theta}} \right)\text{/}k}}}\\mspace{54mu}\operatorname{(3.1)}$


    The purpose of estimating bias is to improve the biased estimator, for example
    by subtracting an estimate of its bias from it. Suppose we observe `θ̂[med]*(X*)
    = median{θ̂[i]*)*,i=1,…k} < θ̂` (12). Thus, we may state that using the estimate
    `θ = θ̂[med]*(X*)` is not reasonable, as equation (12) may imply that the resampling
    process tends to yield smaller values of `θ`. However, if the process of sampling
    `X` from the population is similar to the process of bootstrap sampling `X[i]*)`
    from `X` (which follows Figure 3.2), then equation (12) should mean that `θ >
    θ̂(`X*)`, rather than `θ = θ̂[med]*(X*) < θ̂`.


    One way of quantifying this median bias is to define “bias” as a proportion of
    bootstrap-sampled values `θ̂[i]*)` that are less than or equal to `θ̂(`X*)`:


    ${{\hat{B}}\_{\text{median}}^{\*} = \\frac{1}{k}{\sum\limits\_{i = 1}^{k}{\mathbb{I}\left\{
    {\\hat{\theta}}\left\{ X_{\\{ i \}}^{\*} \right\} \leq \hat{\theta}\left\{ X \right\}\}}\mspace{54}}\operatorname{(13)}$


    where `𝕀` is an indicator function that is equal to 1 when `θ̂[i]*) ≤ θ̂`, and
    0 otherwise.


    The expression in equation (12) can be interpreted as an approximation of `P(θ̂(`X^*)
    ≤ θ̂)`. If `B* = 1/2`, then there is no median bias about `θ̂` in the resampled
    values. In some studies, threshs that indicate absence of median bias were suggested.
    For example, 0.40 ≤ θ̂[med]*) ≤ 0.60 or 0.35 ≤ θ̂[med]*) ≤ 0.65 are suggested
    as rules indicating no concern of bias. Otherwise, it is suggested that a better-behaved
    estimator `θ̂(`X*)` of `θ` should be found.


    ### 3.2.4 The Parametric Bootstrap


    The original bootstrap was interpreted by Efron (1982) as a nonparametric maximum
    likelihood approach or, in other words, as a generalization of the maximum likelihood
    approach to the nonparametric framework. From this point of view, `F̂` is a nonparametric
    estimate of `F`. Thus, the ordinary bootstrap estimates are “maximum likelihood”
    estimates.


    If we assume that `F` has a parametric form such as, say, the Gaussian distribution,
    then the appropriate estimator for `F` would be a Gaussian distribution with the
    maximum likelihood estimates of `μ` and `σ²`. Sampling with replacement from such
    a parametric estimate of `F` leads to bootstrap estimates that are maximum likelihood
    estimates in accordance with Fisher’s theory. The Monte Carlo approximation to
    the parametric bootstrap is simply an approximation to the maximum likelihood
    estimate.


    As shown in Figures 3.1 and 3.2, we approximated the unknown distribution (`θ,
    F`) by the sample distribution function `F̂`. Suppose we can assume that we know
    the distribution of `X`:


    `F = F(θ, x)`


    In this case, we substitute `F̂` by `F(θ̂, x)` in Figure 3.2. Thus, it means that
    in Figure 3.2 the bootstrap samples `X[i]*)` are taken from `F(θ̂, x)` instead
    of `F̂`.


    Let us consider an example where we have a strong conviction that our data is
    distributed according to the following form of double exponential distribution:


    $f\left( X \right) = \frac{\\text{exp}\left( {- \left| {x - \mu} \right|} \right)}{2}$


    The maximum likelihood estimator of `μ` for this family is as follows:


    `μ̂(x[1],x[2],…x[n]) = μ̂[m] = median{x[i],i=1,…n}`


    Following the process described in Figure 3.2, while substituting `F̂` by `F(θ̂,
    x)`, the bootstrap samples `X* = (x[1]*,x[2]*,…x[n]*)` will now be independent
    random variables with density


    $f\left( X \right) = \frac{\\text{exp}\left( {- \left| {x - {\\hat{\mu}}\_{m}}
    \right|} \right)}{2}$

