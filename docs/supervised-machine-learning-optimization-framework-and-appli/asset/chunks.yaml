    \ || 8 || Bootstrap ID |\n\n| --- | --- | --- | --- |\n\n| BTS\\_TITLE || Character\
    \ || 8 || Bootstrap title |\n\n| RESAMPLE\\_SIZE\\_PCT || Numeric || 8 || For\
    \ example, 100 means n-out-of-n; 70 or 50 means m-out-of-n |\n\n| REPLICATIONS\
    \ || Numeric ||  || Number of subsamples to be created |\n\n| DISTRIBUTION ||\
    \ Character || 1 || Name of the distribution for random sample selection: U(niform),\
    \ where each observation has a uniform probability of 1/N of being selected at\
