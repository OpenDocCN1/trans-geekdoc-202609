- fmt: '

    In this book, we describe the AI framework that helps to create machine learning
    classifiers in such a way that they produce a sufficiently good classification
    of unseen data. The framework incorporates data dictionaries that define processes
    such as statistically designed experiments, bootstrapping, and data “contamination.”
    This framework is fully transparent as all data processes are defined as metadata
    that ensures comparability and reproducibility of the results of the supervised
    classification.


    Because the AI framework is fully independent of technology, it can be implemented
    using different software platforms. In this book, we present the implementation
    of the AI framework using two different software tools: `SAS` and `R`.


    `SAS` is an integrated software system that enables accessing data across multiple
    sources, manipulating data, performing sophisticated analyses, and much more,
    and is one of the major choices of corporate business, though a bit costly.


    `R` (`R Core Team`, 2018) is an open-source programming language developed by
    researchers, and many latest statistical and analytical methods are developed
    with `R`. This language has extensive documentation along with a supportive community
    and is widely used among statisticians and data scientists for developing statistical
    software and data analysis.


    ## 1.1 Components of the AI Framework and Their Interaction


    The main idea of the AI framework proposed in this book is to create a systematic
    approach that resolves the challenges of machine learning modeling.


    The process of building a machine learning classifier requires making choices
    that very often cannot be informed by intuition, understanding of a business problem,
    or pre-analysis of data. For example, making a decision about the feature subset
    requires considering different hypotheses, and it is reasonable to consider several
    different feature sets. Which one of them to choose eventually requires to go
    through the modeling process and comparison of classifiers built on different
    feature sets.


    Choosing a machine learning method is challenging as well, and in many instances,
    the decision is made based on the convenience of the method and expected interpretability
    of the results, rather than based on theoretical and technical aspects of machine
    learning methods. If we do not want to limit ourselves to only one machine learning
    method, but rather want to try a few of them, we need to estimate and compare
    the classifiers built by those methods. Now we have to keep in mind that the quality
    of an estimated classifier depends not only on the machine learning method used,
    but on the feature set as well.


    For each machine learning method, we need to assign values to the hyperparameters
    of that method, and it is obvious that the values of the hyperparameters impact
    the quality of the estimated classifier. Different methods have different numbers
    of hyperparameters, and finding an optimal set of values becomes a very difficult
    problem.


    `Figure 1.1` describes some most important components of the AI framework regarding
    which a decision should be made, but how? The statistical design of an experiment
    is a methodology that helps here. It allows us to create a plan, execute it, compare
    the results according to the selected metrics of the classifier quality, and repeat
    if needed. It often happens that we end up with several classifiers that have
    similar classification quality.


    ![FIGURE 1.1 Components of the AI framework.](images/file0.jpg)


    **FIGURE 1.1**


    Components of the AI framework.


    ## 1.2 AI Framework in Detail


    AI framework addresses the challenges of building classifiers. These challenges
    include not only the difficulties of making selection of feature sets, machine
    learning methods, and values of their hyperparameters based on the classifier
    quality, but also the problems that arise during the process of classifier building.
    These details are presented in `Figure 1.2`.


    ![FIGURE 1.2 AI framework process.](images/file1.jpg)


    **FIGURE 1.2**


    AI framework process.


    ### 1.2.1 Creating Training and Test Datasets


    As a first step, the AI framework deals with creating training and test datasets.
    The familiar approach of dividing available data into two parts, and being concerned
    only with a proportion of such a division, e.g., 50-50 and 70-30, has a built-in
    drawback. It relates to bias and dependency within data. It also relates to the
    situation that estimating a classifier on one dataset does not allow us to measure
    variance and bias of the classifier quality and does not allow us to evaluate
    the classifier robustness. In the developed AI framework, the bootstrap approach
    is used to address this drawback.


    - Bootstrap is used to create multiple—and if data permits, hundreds or even thousands——training
    and test datasets. It allows us to estimate and correct bias in data, increase
    data variability, and decrease dependency within data.

    - Estimation of a classifier on multiple training datasets produces a sample of
    the classifier quality metrics that now allows for a comprehensive estimation
    of the classifier quality.

    - Use of multiple, instead of a single, test datasets helps to validate the ability
    of the classifier to deal with unseen data.


    ### 1.2.2 Design of Experiments for a Classifier


    As a next step, the AI framework addresses the question of parameters selection,
    where the plan is created based on the statistical methodology of the design of
    experiments. The plan creates combinations of all parameters of interest in a
    way that the results can be analyzed and significant insights can be drawn. For
    example, we may consider five possible feature sets, the support vector machine
    method with three different kernels, and three intervals of values for each hyperparameter.
    The plan (design of experiments) will define how many different setups should
    be used to build a classifier and how many training datasets each setup should
    be applied to.


    ### 1.2.3 Firth Logistic Regression


    Classifier results, by the nature of machine learning algorithms, do not have
    probabilistic characteristics. This means that if an outcome is predicted as 1,
    this prediction is not accompanied by a probability of being correct. Being able
    to associate probabilities with predictions increases the quality of a classifier.
    Firth logistic regression is a statistical method that works very well with classifier
    prediction, adding to it a probability value.


    ### 1.2.4 Data Contamination


    One of the most challenging problems of machine learning modeling is generalization.
    Building classifiers on multiple training datasets helps to address bias–variance
    trade-off, but it still cannot estimate the robustness of the classifier toward
    unseen data. Planned contamination of data means random corruption of labels according
    to different proportions. For example, in the case of a binary classifier with
    labels Yes and No, planned contamination may look like the following:


    1. “Flip” 0.5% of Yes labels to No, and 0.5% of No labels to Yes,

    2. “Flip” 0.5% of Yes labels to No, and 1% of No labels to Yes,

    3. “Flip” 1% of Yes labels to No, and 0.5% of No labels to Yes,

    4. Etc.


    The idea is, essentially, to find at what level of contamination the classifier
    loses its quality significantly and to exclude those classifiers that lose their
    quality with just slight contamination.


    ### 1.2.5 Best Classifiers

