- fmt: "\n### 10.2.1.1 Hit Ratio\n\nThe hit ratio (`HitR`) metric presents an underwriter’s\
    \ performance that depends on the number of assigned applications. This metric\
    \ is calculated over some period, which is defined depending on the workload of\
    \ underwriters and expected time to close the deal (bind an insurance application),\
    \ or the expiration period for a quote.\n\n$\\text{Hit}R\\_{ti} = \\frac{\\\\\
    text{BU}\\_{ti}}{\\text{AU}\\_{ti}}$ \n\nwhere:\n\n`HitR[ti]`—hit ratio of the\
    \ underwriter *i* during the period *t*\n\n`BU[ti]`—number of bound applications\
    \ (deals closed) by the underwriter *i* during the period *t*\n\n`AU[ti]`—number\
    \ of applications assigned to the underwriter *i* during the period *t*.\n\nA\
    \ significant disadvantage of the hit ratio metric is that it does not take into\
    \ consideration the complexity of insurance applications. Very often, underwriters\
    \ reject insurance applications out of hand, or after short evaluation against\
    \ the insurer’s rules and policies. So, hit ratio also depends on the complexity\
    \ of the assigned to the underwriter insurance applications. Thus, instead of\
    \ hit ratio, the conversion rate metric would be an adequate way of measuring\
    \ underwriters’ performance.\n\n### 10.2.1.2 Conversion Rate\n\nThe conversion\
    \ rate metric (`CR[ti]`) presents an underwriter’s performance based on only those\
    \ applications that were quoted by the underwriter. In other words, quoted applications\
    \ are those that were not rejected by the insurer (underwriter). This metric is\
    \ calculated over a period defined by expected time to close the deal (to bound\
    \ the application, or accept by a customer the proposed quote), or the expiration\
    \ time for a quote:\n\n$\\text{CR}\\_{ti} = \\frac{\\\\text{BU}\\_{ti}}{\\\\text{QAU}\\\
    _{ti}}$ \n\nwhere:\n\n`CR[ti]`—the conversion rate of the underwriter *i* during\
    \ the period *t*\n\n`BU[ti]`—number of bound applications for the underwriter\
    \ *i* during the period *t*\n\n`QAU[ti]`—number of applications quoted by the\
    \ underwriter *i* during the period *t*.\n\nThis metric is usually calculated\
    \ over an extended period because underwriters would want to wait for the outcome\
    \ of all applications, including those that are still in the process of negotiation\
    \ with customers/prospects. Thus, this metric, though providing an informative\
    \ backward-looking picture, cannot be used as an operational metric, for example,\
    \ monthly. Another problem with this metric is that it is not taking into consideration\
    \ the workload of the specific underwriter. As an example, the underwriter who\
    \ bound 1 out of 5 quoted applications will have the same $\\text{CR}\\_{ti} =\
    \ \\frac{1}{5} = 0.2$ as a person who bound 10 out of 50 quoted applications $\\\
    text{CR}\\_{ti} = \\frac{10}{50} = 0.2$ .\n\nWe propose a new operational metric\
    \ that addresses these issues.\n\n### 10.2.1.3 Dynamic Conversion Rate\n\nWe propose\
    \ a new operational metric called dynamic conversion rate. The dynamic conversion\
    \ rate measures conversion continuously, allowing for the monitoring of underwriters’\
    \ performance as well as managing optimal underwriters’ workload.\n\nThe dynamic\
    \ conversion rate metric (`DCR[mi]`) evaluates a monthly underwriter’s performance\
    \ based on information available in the month of interest. This metric considers\
    \ an underwriter as a service provider that has incoming requests (quoted applications)\
    \ and outgoing results (bound applications). In other words, each month, an underwriter\
    \ has several quoted applications that are in the queue to be finalized: to be\
    \ bound or rejected by a customer/prospect. Because `DCR[mi]` measures performance\
    \ every month, underwriters with low workload are penalized for inactive months.\
    \ The dynamic conversion rate metric is calculated according to the following\
    \ formula:\n\n$\\text{DCR}\\_{mi} = \\frac{\\\\text{ln}\\left( {\\\\text{BU}\\\
    _{mi} + 1} \\right)}{\\text{ln}(\\text{QQAU}\\_{mi} + 1)}$ \n\nwhere:\n\n`DCR[mi]`—the\
    \ dynamic conversion rate of the underwriter *i* during the month *m*\n\n`BU[ti]`—number\
    \ of bound applications for the underwriter *i* during the month *m*\n\n`QQAU[ti]`—number\
    \ of applications quoted by the underwriter *i* and awaiting resolution (in the\
    \ queue) during the month *m*.\n\nThis metric gets values between 0 and 1; `DCR[mi]`\
    \ equals 0 when there are no bound applications in a current month and equals\
    \ 1 when all quoted until now applications were bound in the current month. Thus,\
    \ this metric presents an ongoing performance of underwriters, providing an operational\
    \ measure that can be used for efficient management of the underwriting process.\
    \ Also, the `DCR[mi]` metric takes into consideration the workload of an underwriter.\
    \ [Table 10.1] demonstrates the benefits of the `DCR[mi]` metric using the same\
    \ example as we used above for the `CR[ti]` conversion rate metric.\n\n**TABLE\
    \ 10.1**\n\nComparison of `CR[ti]` and `DCR[mi]` Metrics\n\n| Underwriter | Quoted\
    \ Applications (`QQAU[ti]`) | Bound Applications (`BU[ti]`) | `CR[ti]` | `DCR[mi]`\
    \ |\n| --- | --- | --- | --- | --- |\n| A | 5 | 1 | 0.2 | 0.3865 |\n| --- | ---\
    \ | --- | --- | --- |\n| B | 50 | 10 | 0.2 | 0.6097 |\n\nAs shown in [Table 10.1],\
    \ `DCR[mi]` is higher for underwriter B who has the same `CR[ti]` = 0.2 but a\
    \ larger number of quoted and bound applications.\n\n### 10.2.1.4 Time-to-Deal\n\
    \nThe time-to-deal (TTD) metric evaluates an underwriter’s efficiency in the closing\
    \ of the deals. Time-to-deal is calculated as a time interval in days between\
    \ the date when the application was assigned to an underwriter and the date when\
    \ the application was bound. TTD is censored by quote expiration date. TTD can\
    \ be averaged over an extended period like 6 months or a year, but in this case,\
    \ it is not operational and cannot be used for management. We propose to use monthly\
    \ time-to-deal metric `TTD[mi]`, which is an average time-to-deal for the underwriter\
    \ *i* during the month *m*.\n\n$\\text{TTD}\\_{mi} = \\frac{\\\\sum\\_{j = 1}^{n}\\\
    \\text{TTD}\\_{mij}}{n}$ \n\nwhere:\n\n`TTD[mi]`—an average time-to-deal of the\
    \ underwriter *i* during the month *m*\n\n`TTD[mij]`—a time-to-deal of the bound\
    \ application *j* out of *n* applications bound by the underwriter *i* during\
    \ the month *m*.\n\n### 10.2. Analysis of Underwriters’ Performance\n\nUsing the\
    \ above-described metrics, we present the results of a study of the performance\
    \ of underwriters for workers’ compensation line of insurance. In this study,\
    \ we use data related to new workers’ compensation applications for a period of\
    \ 44 months.\n\n#### 10.2.2.1 Data Description\n\nData used for the study of underwrites\
    \ performance evaluation include the following:\n\n* dates of applications submission,\
    \ dates of quotes, and dates of policy binding, if any;\n* parameters of insurance\
    \ applications such as industry, state, and number of employees;\n* underwriters\
    \ to whom applications were assigned.\n\nBefore the analysis, the data was “cleansed”\
    \ and prepared in the following way:\n\n(a) Applications that required more than\
    \ three months to be bound were removed from the study (less than 5% of all bound\
    \ applications).\n(b) Underwriters who were assigned less than 2% of all applications\
    \ during the analyzed period of 44 months were excluded as well.\n\n#### 10.2.2.2\
    \ Application Flow\n\nUnderwriters’ performance is evaluated conditionally on\
    \ insurance application flow, and the process of assignment applications to underwriters.\
    \ Thus, before estimating dynamic conversion rate and time-to-deal per underwriter,\
    \ the analysis of application flow and the process of application assignment should\
    \ be performed.\n"
  raw: "#### [10.2.1.1 Hit Ratio](#C02a_toc.xhtml#rsec10_2_1_1)\n\nThe hit ratio (HitR)\
    \ metric presents an underwriter’s performance that depends on the number of assigned\
    \ applications. This metric is calculated over some period, which is defined depending\
    \ on the workload of underwriters and expected time to close the deal (bind an\
    \ insurance application), or the expiration period for a quote.\n\n$\\\\text{Hit}R\\\
    _{ti} = \\\\frac{\\\\text{BU}\\_{ti}}{\\\\text{AU}\\_{ti}}$ \n\nwhere:\n\nHit*R*[ti]—hit\
    \ ratio of the underwriter *i* during the period *t*\n\nBU[ti]—number of bound\
    \ applications (deals closed) by the underwriter *i* during the period *t*\n\n\
    AU[ti]—number of applications assigned to the underwriter *i* during the period\
    \ *t*.\n\nA significant disadvantage of the hit ratio metric is that it does not\
    \ take into consideration the complexity of insurance applications. Very often,\
    \ underwriters reject insurance applications out of hand, or after short evaluation\
    \ against the insurer’s rules and policies. So, hit ratio also depends on the\
    \ complexity of the assigned to the underwriter insurance applications. Thus,\
    \ instead of hit ratio, the conversion rate metric would be an adequate way of\
    \ measuring underwriters’ performance.\n\n#### [10.2.1.2 Conversion Rate](#C02a_toc.xhtml#rsec10_2_1_2)\n\
    \nThe conversion rate metric (CR[ti]) presents an underwriter’s performance based\
    \ on only those applications that were quoted by the underwriter. In other words,\
    \ quoted applications are those that were not rejected by the insurer (underwriter).\
    \ This metric is calculated over a period defined by expected time to close the\
    \ deal (to bound the application, or accept by a customer the proposed quote),\
    \ or the expiration time for a quote:\n\n$\\\\text{CR}\\_{ti} = \\\\frac{\\\\\
    text{BU}\\_{ti}}{\\\\text{QAU}\\_{ti}}$ \n\nwhere:\n\nCR[ti]—the conversion rate\
    \ of the underwriter *i* during the period *t*\n\nBU[ti]—number of bound applications\
    \ for the underwriter *i* during the period *t*\n\nQAU[ti]—number of applications\
    \ quoted by the underwriter *i* during the period *t*.\n\nThis metric is usually\
    \ calculated over an extended period because underwriters would want to wait for\
    \ the outcome of all applications, including those that are still in the process\
    \ of negotiation with customers/prospects. Thus, this metric, though providing\
    \ an informative backward-looking picture, cannot be used as an operational metric,\
    \ for example, monthly. Another problem with this metric is that it is not taking\
    \ into consideration the workload of the specific underwriter. As an example,\
    \ the underwriter who bound 1 out of 5 quoted applications will have the same\
    \ $\\\\text{CR}\\_{ti} = \\\\frac{1}{5} = 0.2$ as a person who bound 10 out of\
    \ 50 quoted applications $\\\\text{CR}\\_{ti} = \\\\frac{10}{50} = 0.2$ .\n\n\
    We propose a new operational metric that addresses these issues.\n\n#### [10.2.1.3\
    \ Dynamic Conversion Rate](#C02a_toc.xhtml#rsec10_2_1_3)\n\nWe propose a new operational\
    \ metric called dynamic conversion rate. The dynamic conversion rate measures\
    \ conversion continuously, allowing for the monitoring of underwriters’ performance\
    \ as well as managing optimal underwriters’ workload.\n\nThe dynamic conversion\
    \ rate metric (DCR[mi]) evaluates a monthly underwriter’s performance based on\
    \ information available in the month of interest. This metric considers an underwriter\
    \ as a service provider that has incoming requests (quoted applications) and outgoing\
    \ results (bound applications). In other words, each month, an underwriter has\
    \ several quoted applications that are in the queue to be finalized: to be bound\
    \ or rejected by a customer/prospect. Because DCR[mi] measures performance every\
    \ month, underwriters with low workload are penalized for inactive months. The\
    \ dynamic conversion rate metric is calculated according to the following formula:\n\
    \n$\\\\text{DCR}\\_{mi} = \\\\frac{\\\\text{ln}\\\\left( {\\\\text{BU}\\_{mi}\
    \ + 1} \\\\right)}{\\\\text{ln}(\\\\text{QQAU}\\_{mi} + 1)}$ \n\nwhere:\n\nDCR[mi]—the\
    \ dynamic conversion rate of the underwriter *i* during the month *m*\n\nBU[ti]—number\
    \ of bound applications for the underwriter *i* during the month *m*\n\nQQAU[ti]—number\
    \ of applications quoted by the underwriter *i* and awaiting resolution (in the\
    \ queue) during the month *m*.\n\nThis metric gets values between 0 and 1; DCR[mi]\
    \ equals 0 when there are no bound applications in a current month and equals\
    \ 1 when all quoted until now applications were bound in the current month. Thus,\
    \ this metric presents an ongoing performance of underwriters, providing an operational\
    \ measure that can be used for efficient management of the underwriting process.\
    \ Also, the DCR[mi] metric takes into consideration the workload of an underwriter.\
    \ [Table 10.1](#C16_chapter10.xhtml#tab10_1) demonstrates the benefits of the\
    \ DCR[mi] metric using the same example as we used above for the CR[ti] conversion\
    \ rate metric.\n\n**TABLE 10.1**  \n\nComparison of CR[ti] and DCR[mi] Metrics\n\
    \n| Underwriter || Quoted Applications (QQAU[***ti***]) || Bound Applications\
    \ (BU[***ti***]) || CR[***ti***] || DCR[***mi***] |\n\n| --- | --- | --- | ---\
    \ | --- |\n\n| A ||  5 ||  1 || 0.2 || 0.38685 |\n\n| --- | --- | --- | --- |\
    \ --- |\n\n| B || 50 || 10 || 0.2 || 0.60987 |\n\nAs shown in [Table 10.1](#C16_chapter10.xhtml#tab10_1),\
    \ DCR[mi] is higher for an underwriter B who has the same conversion rate CR[ti]\
    \ = 0.2 as underwriter A, but a larger number of quoted and bound applications.\n\
    \n#### [10.2.1.4 Time-to-Deal](#C02a_toc.xhtml#rsec10_2_1_4)\n\nThe time-to-deal\
    \ (TTD) metric evaluates an underwriter’s efficiency in the closing of the deals.\
    \ Time-to-deal is calculated as a time interval in days between the date when\
    \ the insurance application was assigned to an underwriter and the date when the\
    \ application was bound. The TTD metric is censored by a quote expiration date.\
    \ TTD can be averaged over an extended period like 6 months or a year, but in\
    \ this case, it is not operational and cannot be used for successful management\
    \ of underwriting process. We propose to use monthly time-to-deal metric TTD[mi],\
    \ which is an average time-to-deal calculated for the underwriter *i* during the\
    \ month *m*.\n\n$\\\\text{TTD}\\_{mi} = \\\\frac{\\\\sum\\_{j = 1}^{n}\\\\text{TTD}\\\
    _{mij}}{n}$ \n\nwhere:\n\nTTD[mi]—an average time-to-deal of the underwriter *i*\
    \ during the month *m*\n\nTTD[mij]—a time-to-deal of the bound application *j*\
    \ out of *n* applications bound by the underwriter *i* during the month *m*.\n\
    \n### [10.2.2 Analysis of Underwriters’ Performance](#C02a_toc.xhtml#rsec10_2_2)\n\
    \nUsing the above-described metrics, we present the results of a study of the\
    \ performance of underwriters for workers’ compensation line of insurance. In\
    \ this study, we use data related to new workers’ compensation applications for\
    \ a period of 44 months.\n\n#### [10.2.2.1 Data Description](#C02a_toc.xhtml#rsec10_2_2_1)\n\
    \nData used for the study of underwrites performance evaluation include the following:\n\
    \n*   dates of applications submission, dates of quotes, and dates of policy binding,\
    \ if any;\n\n*   parameters of insurance applications such as industry, state,\
    \ and number of employees;\n\n*   underwriters to whom applications were assigned.\n\
    \nBefore the analysis, the data was “cleansed” and prepared in the following way:\
    \ (a) Applications that required more than three months to be bound were removed\
    \ from the study (less than 5% of all bound applications). (b) Underwriters who\
    \ were assigned less than 2% of all applications during the analyzed period of\
    \ 44 months were excluded as well.\n\n#### [10.2.2.2 Application Flow](#C02a_toc.xhtml#rsec10_2_2_2)\n\
    \nUnderwriters’ performance is evaluated conditionally on insurance application\
    \ flow, and the process of assignment applications to underwriters. Thus, before\
    \ estimating dynamic conversion rate and time-to-deal per underwriter, the analysis\
    \ of application flow and the process of application assignment should be performed."
