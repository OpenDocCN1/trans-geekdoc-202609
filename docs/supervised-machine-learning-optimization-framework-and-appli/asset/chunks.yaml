    `FEATURE_ID`、`OUTPUT_TABLE_ID`、`OUTPUT_ROLE` 和 `VAR_NAME` 列包含了 `Features` 表的主键。`Features`
    表定义了 `Experiment` 表中指定的机器学习方法应该使用数据集中的哪些变量。


