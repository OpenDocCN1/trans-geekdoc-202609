- fmt: "\n[Table 6.6](#C12_chapter6.xhtml#tab6_6) shows the example of the properties\
    \ of the `Message` table defined in the `Property` table.\n\nTABLE 6.6  \n\nProperty\
    \ Table (Selected Columns)\n\n| Table | Column | Type | Length | Attribut | INITVAL\
    \ |\n| --- | --- | --- | --- | --- | --- |\n| `Message` | `Message` | `N` | 8\
    \ | `P` | |\n| --- | --- | --- | --- | --- | --- |\n| `Message` | `text` | `C`\
    \ | 80 | | |\n| `Message` | `mestype` | `C` | 1 | `W` | |\n| `Message` | `output`\
    \ | `C` | 2 | `S` | |\n| ... | ... | ... | ... | ... | ... |\n\n### 6.3.6 Meaning](#C02a_toc.xhtml#rsec6_3_6)\n\
    \nA “meaning” is a simple way to replace an uninformative value with meaningful\
    \ text. The definition of the meaning for a column is merely a reference to the\
    \ application table and its column that contains a meaningful description. The\
    \ correct definition of the meaning is based on the relationships between application\
    \ tables. The column for which we define meaning must be the foreign key of the\
    \ table that contains meaningful description.\n\n### 6.3.7 The Link Table](#C02a_toc.xhtml#rsec6_3_7)\n\
    \nThe `Link` table specifies pairs of tables linked by foreign keys. The columns\
    \ of the `Link` table are defined as shown in [Table 6.7](#C12_chapter6.xhtml#tab6_7).\n\
    \nTABLE 6.7  \n\nColumns of the Link Table\n\n| Column Name | Type | Length |\
    \ Description |\n| --- | --- | --- | --- |\n| `Table` | `Character` | 8 | Table\
    \ name |\n| --- | --- | --- | --- |\n| `Reltable` | `Character` | 8 | Name of\
    \ the related table |\n| `Column` | `Character` | 8 | Column name |\n| `Relcol`\
    \ | `Character` | 8 | Name of the column from the related table |\n\nThe `TABLE`,\
    \ `COLUMN`, `RETABLE`, and `RELCOL` columns together form the primary key of the\
    \ `Link` table.\n\n### 6.3.8 Process of Application Data Model Definition](#C02a_toc.xhtml#rsec6_3_8)\n\
    \nIt is important to mention that application data model definition can be performed\
    \ with iterations, and it is not necessary to complete the application design\
    \ process before using the application, nor is it necessary to get everything\
    \ right the first time. This does not mean that application design is unnecessary\
    \ in a table-driven development environment; application design is still needed.\
    \ However,\n\n- it does not all have to be done at once;\n- it does not have to\
    \ be perfect the first time; and\n- if requirements change, then the design can\
    \ be changed too, in a relatively painless manner.\n\nThe most ambitious goal\
    \ of data dictionary-based development is to maximize the quality of application\
    \ components while minimizing their development and maintenance costs.\n\n###\
    \ 6.3.9 Features of the Data Dictionary](#C02a_toc.xhtml#rsec6_3_9)\n\nThere are\
    \ features of the data dictionary that constitute a checklist of functionality:\n\
    \nRelational: The data dictionary should be based on relational technology. This\
    \ is the current standard in the software industry.\n\nExtendable: The data dictionary\
    \ should be extensible. The designer should have the ability to extend the data\
    \ dictionary as required, to add new files, databases, and other related information\
    \ sources. In other words, the data dictionary’s metamodel, or data about data,\
    \ should be flexible enough to be extended as required.\n\nMeta-meta model: The\
    \ data dictionary should be based on an object-oriented meta-meta model. The meta-meta\
    \ model can be thought of as a data dictionary for the data dictionary. A data\
    \ dictionary constructed in this manner is self-defining and self-maintaining.\
    \ It is self-defining in that just as a designer uses the relational model and\
    \ data dictionary to define metadata, the data dictionary is defined using the\
    \ same entity–relationship model (meta-metadata). Development of this meta-meta\
    \ model in an object-oriented, extensible manner ensures that future growth of\
    \ the application is consistent, logical, and responsive to desires.\n\nPreexisting\
    \ data definitions: The data dictionary should provide the ability to populate\
    \ the data dictionary with preexisting data definitions automatically. Since most\
    \ corporate data preexists, the data dictionary must be able to generate data\
    \ dictionary definitions from database descriptions automatically.\n\nDatabase\
    \ definitions: The data dictionary should provide the ability to generate database\
    \ definitions automatically. Since it is nonproductive and potentially error-prone\
    \ to permit programmers to self-code data descriptions, the data dictionary should\
    \ provide this capability.\n\nCommon user access: The data dictionary should provide\
    \ an easy-to-use, standard common user access interface. The data dictionary should\
    \ provide a dialog that is object–action-oriented. Designers are presented with\
    \ appropriate objects and all actions that can be invoked for the objects.\n\n\
    Report facility: The data dictionary should provide an integrated reporting facility.\n\
    \nSecurity: The data dictionary should have multiple levels of security that can\
    \ be controlled by the data dictionary, data, or designer.\n\nLife cycle support:\
    \ The data dictionary should provide adequate facilities to track modifications\
    \ of a data element’s description as it progresses through the life cycle of planning,\
    \ design, development, testing, and production.\n\n### 6.3.10 The Components of\
    \ the Optimization Framework and Their Definitions in the Data Dictionary](#C02a_toc.xhtml#rsec6_3_10)\n\
    \nThe possible set of data dictionary tables for the machine learning optimization\
    \ framework includes five sets (components) of tables: input data, bootstrap,\
    \ machine learning, experimental design, and training data contamination. We call\
    \ these sets (components) the Framework set, and it can be extended by additional\
    \ tables or set of tables at any time. Each of the components of the Framework\
    \ set will be described in the next chapters.\n\n## 6.4. Deployment of Code-Free\
    \ Design with SAS and R](#C02a_toc.xhtml#rsec6_4)\n\nWhile the designer works\
    \ with the contents of the data dictionary tables, the programmer works with the\
    \ structures of those tables (table names, table columns, column data types, etc.).\
    \ While the contents of the data dictionary tables can be continuously changed\
    \ (in accordance with the changes in application requirements), their structures\
    \ remain unchangeable. The data dictionary tables constitute the table-driven\
    \ environment, and once developed, programs processing these tables generate a\
    \ wide variety of applications.\n\nThe process of generating a table-driven environment\
    \ is iterative by nature. The programmer must generate the tables which are the\
    \ core of the data dictionary and then generate other data dictionary tables and\
    \ application objects from the metadata supplied in these tables.\n\nBelow we\
    \ demonstrate an SAS program that generates application objects from the metadata\
    \ stored in a table-driven environment.\n\n### 6.4.1 How to Generate Application\
    \ Objects](#C02a_toc.xhtml#rsec6_4_1)\n\nThe following `%DATASET` macro demonstrates\
    \ how to generate SAS datasets from the metadata of the Object, Location, and\
    \ Property tables.\n"
