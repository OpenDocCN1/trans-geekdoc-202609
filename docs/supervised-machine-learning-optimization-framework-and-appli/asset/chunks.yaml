- fmt: 'It would be unreasonable to assume that there is only one set of hyperparameters
    that permits to build the best classifier. As well, the definition of the “best”
    classifier can vary from case to case. As discussed in [Chapter 2](#C08_chapter2.xhtml#chapter2),
    the quality of a classifier is estimated based on the confusion (misclassification)
    matrix. There are different metrics that can be derived from this matrix, and
    the decision of what metrics should be used to evaluate the quality of a classifier
    and what value of the metrics identifies a good classifier should be made prior
    to building the classifier.


    An additional measurement of a classifier quality is its robustness to data contamination.
    Data contamination helps heuristically evaluate the robustness of a classifier
    toward unseen data and find a solution of bias–variance trade-off.


    Finding an answer to each of the above-stated questions is challenging in itself.
    But to make the situation more difficult, an answer to one question depends on
    answers to other questions. For example, different feature sets may produce better
    results with different kernels. To find a combination of conditions that deliver
    the best classification results, we will use the design of experiments (DoE).


    ## 5.2 Application of DoE in AI Framework](#C02a_toc.xhtml#rsec5_2)


    The AI framework described in this book utilizes the DoE methodology in order
    to find the best classifiers according to metrics defined for each case. Application
    of DoE includes defining factors and their levels, the structure of the experiment
    design, and the response variable measured on each experiment. Below, we will
    review the design of experiment (DoE) methodology.


    A/B testing or “one factor at a time” (OFAT) was a very popular scientific method
    until the early twentieth century. In this method, one variable/factor is tested
    at a time while all other conditions of the experiment are considered not changing.
    However, at the beginning of the twentieth century, Sir Ronald Fisher introduced
    the concept of applying statistical analysis during the planning stages of research
    rather than at the end of experimentation. In 1935, his book “The Design of Experiments”
    established the foundation for the DoE as a statistical discipline. Cox (1958)
    presents a comprehensive nonmathematical interpretation of the design and analysis
    of experiments. Steinberg and Hunter (1984) state that Fisher’s “monumental work
    was guided by the key insight that statistical analysis of data could be informative
    only if the data themselves were informative, and that informative data could
    best be assured by applying statistical ideas to the way in which the data were
    collected in the first place.” This is exactly what we want to achieve: to assure
    that through building a classifier, we collect informative data to derive informative
    insights about the classifier quality.


    The methodology of the design of experiments uses special terminology and is based
    on several main principles, which are described in vast existing literature like
    Cochran and Cox (1997), Dean and Voss (1999), Hicks and Turner (1999), Hinkelmann
    and Kempthorne (1994), Kempthorne (1952) and more. We briefly describe the terminology
    and the principles below.


    ### 5.2.1 Terminology of DoE](#C02a_toc.xhtml#rsec5_2_1)


    #### 5.2.1.1 Experiment](#C02a_toc.xhtml#rsec5_2_1_1)


    An experiment is an action when treatment is deliberately imposed on a group of
    objects or subjects with the purpose of observing the response. This is in contrast
    to an observational study, when collecting and analyzing data does not involve
    a deliberate change of existing conditions.


    #### 5.2.1.2 Experimental Unit](#C02a_toc.xhtml#rsec5_2_1_2)


    An experimental unit is a physical entity on which treatment is imposed. The experimental
    unit is also the unit of statistical analysis.


    #### 5.2.1.3 Factor](#C02a_toc.xhtml#rsec5_2_1_3)


    A factor of an experiment is a controlled independent variable. The values (or
    levels) of such a variable are set by the experimenter. In the AI framework, a
    degree of polynomial kernel is one of the factors that can have values on three
    levels such as 2, 3, or 4. Another example of a factor is the `cost` variable
    that can be defined on three levels. For example, level 1 means that the value
    of the `cost` variable belongs to an interval `[1; 5)`, level 2 means that the
    value of the `cost` variable belongs to an interval `[5; 20)`, and level 3 is
    linked with an interval `[20, 100)`.


    #### 5.2.1.4 Treatment](#C02a_toc.xhtml#rsec5_2_1_4)


    Treatment is something that researchers administer to experimental units. Treatment
    is defined as a combination of factor levels. In the AI framework, a treatment
    means conditions in which we build a classifier. In continuation of the example
    above, a polynomial kernel with the degree of four and with the `cost` variable
    in the interval `[5; 20)` defines the treatment, or, in other words, the conditions
    in which a classifier will be built.


    ### 5.2.2 Principles of DoE](#C02a_toc.xhtml#rsec5_2_2)


    #### 5.2.2.1 Randomization](#C02a_toc.xhtml#rsec5_2_2_1)


    Randomization is the process of assigning treatments to experimental units, so
    that each unit has the same chance to receive treatment. The assignment of treatments
    to experimental units at random distinguishes a designed (planned) experiment
    from an observational study or so-called “quasi-experiment.” There is an extensive
    body of statistical theory exploring the consequences of the allocation of units
    to treatments using some random number generator. Assigning units to treatments
    randomly tends to decrease confounding, which appears due to latent factors related
    to the treatment. It is only if the experimental units are a random sample from
    a population that the results of the experiment can be applied reliably The probable
    error of such an extrapolation depends on the sample size, among other things,
    and can be estimated.


    #### 5.2.2.2 Statistical Replication](#C02a_toc.xhtml#rsec5_2_2)


    Measurements are subject to measurement uncertainty, and thus have variation.
    The same measurements are repeated to improve accuracy—in other words, replicated.
    Replications help to identify the sources of variation, better estimating the
    true effects of treatments, improving the experiment’s reliability and validity.


    #### 5.2.2.3 Blocking](#C02a_toc.xhtml#rsec5_2_3)


    In some cases, full randomization of treatments is not feasible, or a researcher
    may believe that experimental units should be grouped together to decrease variability
    within a group. Blocking is the non-random arrangement of experimental units into
    groups called blocks or lots. Blocking reduces variation between units, which
    is produced by known but irrelevant sources. Thus, blocking leads to greater precision
    in the estimation of the source of variation in the experiment. In a block design,
    experimental units are first divided into homogeneous blocks before they are randomly
    assigned to treatment groups.


    #### 5.2.2.4 Orthogonality](#C02a_toc.xhtml#rsec5_2_4)


    The concept of orthogonality is important in the design of experiments as it guarantees
    that the effects of different factors and interactions can be estimated in the
    model separately from each other. Thus, analysis of an orthogonal design is straightforward
    as each main effect and interaction can be estimated independently. The estimates
    for the effects and coefficients remain unchanged even if some factors or interactions
    are removed from the model. However, if a design is not orthogonal, either by
    plan or by accidental loss of data, the analysis must be carried out very carefully
    and the interpretation of the results is not as straightforward.


    ### 5.2.3 Full-Factorial Experiment](#C02a_toc.xhtml#rsec5_2_3)

