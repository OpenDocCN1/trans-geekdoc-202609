    | `BIAS_TITLE` | Character | 80 | 偏差校正标题 |

    | `SID` | Numeric | 8 | 用于通过 `VAR_NAME`、`METRIC` 和 `BTS_ID` 识别对应 `BIAS_CORRECTION_ID`
    的序列号 |

    | `VAR_NAME` | Character | 80 | 数据集变量名 |

    | `METRIC` | Character | 8 | 指标：M(ean), M(e)D(ian) |

    | `BTS_ID` | Character | 8 | 指向 Bootstrap 表主键的引用 |


    `BIAS_CORRECTION_id` 和 `SID` 列构成了 `Bias_Correction` 表的主键。`SID` 列列出了序号，用于唯一标识哪个偏差校正程序（由下方的
    Bootstrap 表定义并通过 `BTS_ID` 列引用）对应 `VAR_NAME` 列中定义的哪个数据集变量。


    输入表（见 [表 7.1]）中列出的 `BIAS_CORRECTION_ID` 和 `OUTLIER_DETECTION_ID` 值将输入数据集与 `Outlier_Detection`
    和 `Bias_Correction` 表中定义的偏差校正/离群值处理相关联。最新记录包含对 Bootstrap 表的引用。


    ### 7.1.1.4 Bootstrap 表


    Bootstrap 表的列定义如 [表 7.5] 所示。


    **表 7.5**


    Bootstrap 表的列


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `BTS_ID` | Character | 8 | Bootstrap ID |

    | `BTS_TITLE` | Character | 8 | Bootstrap 标题 |

    | `RESAMPLE_SIZE_PCT` | Numeric | 8 | 例如，100 表示 n-out-n；70 或 50 意味着 m-out-n |

    | `REPLICATIONS` | Numeric | | 要创建的子样本数量 |

    | `DISTRIBUTION` | Character | 1 | 随机样本的分布名称：`U(n)`，其中每个观测值在重采样过程的每一步被选中的均匀概率均为
    `1/N`。在 B 个 Bootstrap 样本的并集中，每个观测值出现的期望值为 B 次；`B(n)` 则每个观测值在大小为 N 的 B 个 Bootstrap
    样本并集中恰好出现 B 次 |

    | `STRATA_VAR` | Character | 32 | 定义层的变量名 |


    `BTS_ID` 列构成了 Bootstrap 表的主键。Bootstrap 表中的数据标识了可以用于偏差校正的 Bootstrap 过程，以及生成多个（该值在
    `REPLICATIONS` 列中定义）训练或测试数据集。`STRATA_VAR` 定义了输入数据集中的变量，其值应用于分离数据集中其他变量的值。`STRATA_VAR`
    最合适的用途是定义输入数据集中的时间序列。


