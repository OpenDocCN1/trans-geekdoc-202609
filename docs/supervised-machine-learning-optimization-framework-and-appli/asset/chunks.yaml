  trans: '


    二分类相关因变量模型中的一个常见问题是“分离（separation）”。Albert 和 Anderson (1984) 提出了这一术语，并将其区分为“完全分离”和“准完全分离”。当模型中的一个或多个协变量能够完美预测某些二元结果时，就会发生完全分离。准完全分离是指这种完美预测仅发生在数据中部分观测值的情况。


    分离意味着存在一个子向量 `x[s]`，使得所有 `n` 个观测值都可以被正确归类为 `y[i] = 0` 或 `y[i] = 1`。此类子向量的存在会导致对数似然函数呈现单调性。因此，`x[s]`
    子向量中变量的极大似然估计 $\hat{\beta_{s}}$ 等于正无穷或负无穷，且相关的标准误差估计也是无穷的。


    这正是 SVM 分类器结果中恰发生的情况，其中 `f(x)` 的值代表到分离超平面的距离，因此，它的值完美预测了分类的二元结果。


    关于分离这一主题有大量的文献，并且关于如何处理这一问题有多种提议（参见 Rainey, 2016 和 Zorn, 2005）。在本书中，我们将使用 Firth
    偏差修正法来解决逻辑回归中的分离问题。使用惩罚似然估计的 Firth 方法被认为是解决分离问题的理想方案。


    Firth 在他 1993 年的论文中提出了一种消除极大似然估计中小样本偏差的方法。Firth 方法的核心思想是以 Jeffreys (1946) 不变先验分布的形式将偏差项引入标准似然函数中。随着
    `N→∞`，偏差本身趋于零，但对于较小的 `N`，则存在 `O(N^(−1))` 偏差。因此，Firth 创建了一个惩罚对数似然公式：


    ```

    ln L(β|y)* ℃=℃ln L(β|y) ⅅ+ 0.5ln |i(β)|   (2.23)

    ```


    以及相应的得分函数方程：


    ```

    {\frac{\partial\ln L\left( \beta \middle| y \right)^{\*}}{\partial\beta} \equiv
    U\left( \beta \right)^{\*} = U\left( \beta \right) + 0.5\text{tr}\left\{ {i\left(
    \beta \right)^{- 1}\leftleftlbrack \frac{\partial i\left( \beta \right)}{\partial\beta}
    \rightrbrack} \right\}\mspace{54mu}\operatorname{(2.24)}

    ```


    其中 `i(β)` 是 Jeffreys 无信息先验，`ln L(β|y)` 和 `U(β)` 分别由方程 (2.21) 和 (2.22) 描述。


    Firth 还证明了他的惩罚似然估计对于很大类广义线性模型都是渐近一致的，并且消除了通常的小样本偏差。他还表明，在许多标准似然估计不存在的情况下，惩罚似然估计存在，包括当
    `N→∞` 时，惩罚似然估计收敛于 MLE。


    ### 2.5.4 回归中的 Firth


    用于 Firth 逻辑回归的第一个 R 包 `brlr` 由作者编写，但目前 `brlr` 已被更高效的 `brglm` 包取代。


    **表格 2.4 `brglm` 函数的参数**


    | 参数 | 描述 |

    | :--- | :--- |

    | `formula` | 待拟合模型的符号描述 |

    | `family` | 对所使用的误差分布和链接函数的描述。`brglm` 目前仅支持 `binomial` 族，其链接函数为 `logit`、`probit`、`cloglog`、`cauchit`
    |

    | `data` | 包含变量的可选数据框 |

    | `weights` | 拟合过程中使用的可选权重向量 |

    | `subset` | 指定拟合过程中使用的观测值子集的可选向量 |

    | `na.action` | 当数据包含 NA 时的处理函数 |

    | `start` | 线性预测器参数的初始值 |

    | `etastart` | 线性预测器的初始值 |

    | `mustart` | 均值向量的初始值 |

    | `offset` | 可用于指定拟合过程中包含的先验部分 |

    | `control.glm` | `control.glm` 替换了 `glm` 中的 `control` 参数，但基本功能相同。它是控制 `glm.fit`
    的参数列表 |

    | `control` | 控制拟合过程的参数列表 |

    | `intercept` | 逻辑值，指示是否在空模型中包含截距项 |

    | `model` | 逻辑值，指示是否将模型框架作为返回值的一部分返回 |

    | `method` | 用于拟合模型的方法。默认方法为 `brglm.fit`，它使用修正得分估计法或极大惩罚似然法（见下文 `pl` 参数） |

    | `pl` | 逻辑值，指示是否使用极大惩罚似然拟模型（使用 Jeffreys 不变先验进行惩罚），或使用减少偏差的修正得分 |

    | `x` | 逻辑值，指示是否将拟合过程中使用的响应向量和模型矩阵作为返回值返回 |

    | `y` | 逻辑值，指示是否将拟合过程中使用的响应向量和模型矩阵作为返回值返回 |

    | `contrasts` | 与 `glm` 相同的可选列表 |

    | `control.brglm` | 当 `method = "brglm.fit"` 时控制拟合过程的参数列表 |


    在我们的案例中，Firth 惩罚逻辑回归将应用于 SVM 的结果。由 SVM 计算的到超平面的距离作为自变量赋值给参数 `*x*`，而标签将赋值给参数 `*y*`。


