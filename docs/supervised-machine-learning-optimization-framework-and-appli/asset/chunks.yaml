    | `OUTLIER_DETECTION_ID` | Character | 8 | 过程 ID |

    | `METHOD` | Character | 8 | 方法名称（例如，MCD—最小协方差行列法，且 H、`CUTOFFALPHA` 等列用于定义 MCD
    参数） |

    | `H` | Numeric | 8 | 默认值 `(3*n + p + 1)/4`，其中 `n` 是观测数，`p` 是变量数 |

    | `CUTOFFALPHA` | Numeric | 8 | 默认值为 0.025 |

    | `MCDALPHA` | Numeric | 8 | 默认值为 0.025 |


    `OUTLIER_DETECTION_id` 列构成了 `Outlier_Detection` 表的主键。


    `Bias_Correction` 表的列定义如 [表 7.4] 所示。


