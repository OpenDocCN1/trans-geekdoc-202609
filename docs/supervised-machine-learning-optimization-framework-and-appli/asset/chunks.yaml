    在书中，我们讨论了仅针对监督学习机器学习方法的优化框架。


    ## 2.2 监督学习的原理


    有时，监督学习被与统计学家所的工作进行比较。“监督”指的是响应（responses）是可用的事实，而“学习”一词指的是任何可以对其输出的有效性进行测试的方法或程序。当响应可用时，模型识别、决策制定或预测等分析目标就可以得到验证。通常情况下，监督学习指的是分类。


    分类的目标是使用在每个对象上观察的一系列特征，将种中的对象分配到若干个类别之一。例如，在保险核保员的情况下，特征集可能包括保险申请的特征以及针对该申请提供的保险产品特征。这些类别是预先知道的，可以是有序的也可以是无序的。在保险申请的相同示例中，类别将是两种之一：申请人接受提供的保险产品，或者拒绝该报价。


    分类器构建在训练数据集上，在这些数据集中，特征和标签都是已知的，供分类器构建算法使用。


    分类器的质量通过计算每个类别中分类正确对象的比例来衡量。这种衡量标准被称为误分类矩阵（misclassification matrix），首先在训练数据集上计算，然后是在测试数据集上计算。


    误分类矩阵有时也被混淆矩阵（confusion matrix）或误差矩阵（error matrix）。它视觉化了机器学习方法的性能，并作为计算分类性能指标的基础。误分类矩阵的每一行代表预测标签，每一列代表实际标签。该矩阵的每个单元格包含对应于预测和实际标签的实例频率（参见[表
    2.1]）。


    ### 表 2.1 误分类矩阵


    | 预测 \实际 | 标签“TRUE” | 标签“FALSE” |

    | :--- | :--- | :--- |

    | **TRUE** | | |

    | **FALSE** | | |


    ## 2.3 神经网络


    ### 2.3.1 引言


    神经网络方法的创建是为了尝试模仿大脑处理和存储信息的方式。大脑的基本组件——神经元于 1836 年被发现。在过了 100 多年后，神经网络研究与开发的现代时代才在
    W.S. McCulloch 和 W. Pitts 写的经典论文《神经活动中蕴含概念的逻辑演算》（A Logical Calculus of the Ideas
    Immanent in Nervous Activity）中开启。

