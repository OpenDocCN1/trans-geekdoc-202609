  trans: "\n为了形式化核保决策过程，我们从创建合适的数据结构开始。\n\n### 10.4.1 数据结构\n\n令 `i` = `1…n` 代表核保员，`j`\
    \ = `1…m` 代表申请，`k` = `1…p` 代表工伤保险产品。每份申请都由一组特征（参数）描述，例如公司员工人数、员工年龄、行业代码、所在州/省份以及去年的理赔次数。这些特征经过了标准化处理，并由向量\
    \ `A[j] = {a[j1], a[j2], … a[jM]}` 呈现，其中 `M` 是保险申请特征（参数或特性）的数量。\n\n每个保险产品都由一组特征（参数或特性）描述，例如保单涵盖的条件、免赔额和保费。保险产品特征由向量\
    \ `B[k] = {b[k1], b[k2], … b[kP]}` 呈现，其中 `P` 是保险产品特征的数量。这些特征对所有产品都是标准化的，如果例如特征\
    \ `b[k2]` 未出现在产品 `k` 中，则将 `b[k2]` 赋值为 0。\n\n令 `Y[ijk]` 表示每个报价的保险申请的结果——1 表示已承保，0\
    \ 表示被拒绝。这种结构允许捕捉同一核保员针对同一份保险申请所做出的多个报价。例如，上述描述的数据结构可能如 [表 10.2] 所示。\n\n**表 10.2**\n\
    \n数据结构示例\n\n| || || 申请特征 || || 产品特征 || |\n| --- | --- | --- | --- | --- | ---\
    \ |\n| 核保员 `i` | 申请 `j` | 员工人数 `a[j1]` | 21 岁以下员工占比 `a[j2]` | 50 岁以上员工占比 `a[j3]`\
    \ | … | 去年理赔次数 `a[jM]` | 产品 `k` | 免赔额 `b[k1]` | … | 保费 `b[kP]` | 结果 `Y[ijk]` |\n\
    | || … || … || … || … || … || … || … || … || … || … || … |\n| 10 || 100 || 30\
    \ || 5 || 3 || … || 0 || 1001 || 10,000 || … || 1,000 || 1 |\n| 10 || 105 || 100\
    \ || 2 || 10 || … || 5 || 1001 || 40,000 || … || 1,500 || 0 |\n| 10 || 105 ||\
    \ 100 || 2 || 10 || … || 5 || 1003 || 30,000 || … || 1,000 || 0 |\n || || || ||\
    \ || || ||0 ||0 || … || … || … || … ||0 || … |\n | … || … || … || … || … ||0 ||\
    \ … ||0 || … ||0 || ... |\n| 10 || 105 || 100 || 2 || 10 || … || 5 || 1001 ||\
    \ 40,000 || … || 1,500 || 0 |\n\n### 10.4.2 分类方法\n\n广义而言，我们使用 `SVM` 来预测客户是否接受。因为\
    \ `SVM` 不对分布，而是直接最小化分类误差，因此 `SVM` 输出的是二分类决策。虽然二分类决策对于许多问题是足够的，但很难获得有意义的偏差-方差平衡（bias–variance-off）。通过对\
    \ `SVM` 输出应用惩罚逻辑回归可以缓解这一担忧。使用惩罚逻辑回归处理 `SVM` 输出的好处是使结果更具泛化性（例如减少过拟合）。在分类中，`SVM`\
    \ 配合惩罚逻辑回归创建了类别成员的概率，而不是 `SVM` 的点估计。将分类问题重新表述为概率分类为应用最初为最小二乘回归设计的偏差-方差分解创造了条件。\n\
    \n### 10.4.3 偏差-方差超参数\n\n偏差是由错误假设引起的误差。高偏差意味着欠拟合。方差是由于训练中的变化产生的误差。偏差-方差权衡是机器学习中的核心问题。在统计学中，偏差-方差权衡是一种特性：低偏差模型具有高方差，反之亦然。为了避免分析中的偏差，我们使用\
    \ `m-out-of-n` 有放自助法从原始数据创建了训练集和测试集。例如，大的 `C` 导致低偏差和高方差，而小的 `C` 导致高偏差和低方差。大的 `d`\
    \ 或 `γ` 导致高偏差和低方差，而较小的 `d` 或 `γ` 导致低偏差和高方差。\n\n### 10.4.4 构建分类器\n\n我们提出的 AI 解决方案尝试从最好的核保员那里“学习”。因此，在我们的研究中，我们仅使用了占所有核保员\
    \ 8% 的顶级表现者相关的数据。我们处理的数据经过结构化，通过广泛包含保险申请和报价产品的所有特征（特性或参数）以及如表 10.2 所示的二值结果 `Y`（客户对报价的接受或拒绝），来表达所有相似的问题。\n"
- fmt: "\nAs a first step, we create a statistically designed full-factorial experiment\
    \ to find out optimal hyperparameters of SVM: kernel transformation function (radial,\
    \ polynomial, and sigmoid kernel types), the kernel hyperparameter `d` or `γ`,\
    \ and the algorithm hyperparameter—C. For continues values of `C`, and `d` or\
    \ `γ` hyperparameter, we aggregate their values in multiple groups. The `FACTEX`\
    \ procedure can be used to create a full-factorial experiment. For example, if\
    \ we decide to create six groups of values for `C` and `γ` hyperparameters, our\
    \ full-factorial design consists of 3¹\\*6²℄=℄108 combinations (runs).\n\n## Step\
    \ 2\n\nFor each of the combinations presented in our full-factorial design, we\
    \ execute the `HPSVM` procedure of SAS as follows:\n\n```sas\n%macro SVM (data=training_set,\
    \ c=100, gamma=2, kernel = rbf, input_app = num_emp pct_under_21 pct_over_50 claims,\
    \ input_prod = deduct premium output = output, target=outcome);\n    PROC HPSVM\
    \ DATA = &data\n      C = &c /* the penalty value */\n      MAXITER=10000 /* the\
    \ maximum number of iterations */\n      INPUT &input_app &input_prod / LEVEL=INTERVAL;\n\
    \      KERNEL &kernel\n      %if %trim(%left(&kernel)) = rbf or\n          %trim(%left(&kernel))\
    \ = sigmoid %then\n          %do;\n            / k_par = &gamma;\n          %end;\n\
    \      OUTPUT &output;\n      TARGET &target;\n    run;\n%mend SVM;\n```\n\nAs\
    \ the final classifier, we select one that maximized sensitivity (the proportion\
    \ of bound applications that were correctly classified) and specificity (the proportion\
    \ of rejected quotes that were correctly classified) when applied to the training\
    \ datasets.\n\n## Step 3\n\nAs a next step, to add a probabilistic element to\
    \ the SVM results, we apply Firth’s penalized logistic regression to the outcome\
    \ of the SVM algorithm (Firth, 1993). `SVM` produces complete separation data.\
    \ Firth’s penalized likelihood approach is a method of addressing issues of separability.\
    \ Firth’s method is available in the `LOGISTIC` procedure and only for binary\
    \ logistic models. It replaces the usual score equation:\n\n$g\\left( \\beta\\\
    _{j} \\right) = \\sum\\limits\\_{i = 1}^{n}\\left( {y\\_{i} - \\pi\\_{i}} \\right)x\\\
    _{ij} = 0\\left( {j = 1,\\ldots,p} \\right)$ \n\nwhere `p` is the number of parameters\
    \ in the model, with the modified score equation:\n\n$g\\left( \\beta\\_{j} \\\
    right) = \\sum\\limits\\_{i = 1}^{n}\\left( {y\\_{i} - \\pi\\_{i}} + h\\_{i}\\\
    left( {0.5 - \\pi\\_{i}} \\right) \\right)x\\_{ij} = 0\\left( {j = 1,\\ldots,p}\
    \ \\right)$\n\nwhere `h[i]` are the `i`th diagonal elements of the hat matrix:\n\
    \n$g\\left( \\beta\\_{j} \\right) = \\sum\\limits\\_{i = 1}^{n}\\left( {y\\_{i}\
    \ - \\pi\\_{i}} + h\\_{i}\\left( {0.5 - \\pi\\_{i}} \\right) \\right)x\\_{ij}\
    \ = 0\\left( {j = 1,\\ldots,p} \\right)$ $W^{\\frac{1}{2}}\\left( {X^{\\prime}W}\
    \ \\right)^{- 1}X^{\\prime}W^{\\frac{1}{2}}$ The SAS code below implements logistic\
    \ regression with Firth’s correction for bias:\n\n```sas\nPROC LOGISTIC data =\
    \ SVM_Decision ;\n    CLASS Outcome ;\n    MODEL Outcome (event='1') = Decision\
    \ / FIRTH ;\nRUN ;\n```\n\nSince the results of logistic regression are probabilities,\
    \ we chose a cutoff or threshold value to classify cases. The probabilities above\
    \ this threshold are classified as 1 and those below as 0. For the probabilities\
    \ generated by Firth penalized logistic regression, we search for such a threshold\
    \ value that further increases the sensitivity and specificity of the results\
    \ produced by `SVM`.\n\nWe perform the analysis for each of 2,000 training datasets.\
    \ As the final classifier, we select an `SVM` classifier with adjustment based\
    \ on Firth penalized logistic regression that, on average, produces higher sensitivity\
    \ and specificity metrics.\n\nAfter applying different kernel types and various\
    \ SVM hyperparameters (according to the full-factorial design described above),\
    \ the best results occur with a radial kernel having a cost parameter `C`∈[1000;3000]\
    \ and `γ`∈[0.2;0.6]. The sensitivity of the classification results equals 0.987\
    \ on average, and the specificity equals 0.799 on average.\n\nThen, we identify\
    \ a threshold that improved classification based on the results of Firth penalized\
    \ logistic regression. The threshold value of 0.76 used to classify the results\
    \ improved the specificity to the level of 0.847 on average at the cost of a minor\
    \ loss in sensitivity—which became equal to 0.973 on average.\n\n### 10.4.5 “Contamination”\
    \ of Training Datasets\n\nNow, we address the variance in the sensitivity metric\
    \ caused by small fluctuations in the training datasets. To avoid high variance\
    \ that caused overfitting between features and outputs, we perform “contamination”\
    \ of training datasets. The “contamination” is performed as changes in small percent\
    \ of labels of training datasets, planned according to the design of mixture experiments.\
    \ In mixture experiments, we vary the proportions, as in our example—proportions\
    \ of different outcomes. The details of the design of mixture experiments are\
    \ out of the scope of this book, and we only state that this approach allows performing\
    \ “contamination” of data. After the training dataset is contaminated according\
    \ to the design, we perform again Steps 1–3 where radial kernel having a cost\
    \ parameter `C`∈[1000;3000] and `γ`∈[0.2;0.6] is considered as a starting point\
    \ of the process. As a result, a robust classifier is built. Applying the developed\
    \ classifier to test datasets, we received the following results: specificity\
    \ equals 0.859, and sensitivity equals 0.851.\n\n### 10.4.6 Experimental Results\n\
    \nTo test the efficiency of the solution, we used the following historical data:\n\
    \n1. properties/features of insurance products and prices that were offered in\
    \ regard to insurance applications;\n2. properties/features of insurance applications\
    \ to which insurance products were offered;\n3. data about acceptance or rejection\
    \ of insurance products by clients.\n\nThe data for the experiment were selected\
    \ in such a way that all offers were rejected by customers/prospects. In other\
    \ words, the conversion rate in this data sample was 0%.\n\nThe objective of the\
    \ experiment was to apply the developed AI solution to find what insurance products\
    \ and prices would fit the insurance applications in such a way that they would\
    \ be accepted by customers/prospects. Each insurance application in the sample\
    \ data received one quote for an insurance product, in rare cases two quotes.\
    \ In our experiment, however, each application was combined with all possible\
    \ insurance products and their prices. An example of such data is presented in\
    \ Table 10.3, where:\n\n* gray-shadowed rows present insurance applications and\
    \ associated insurance products that were rejected by the customers, and\n* white\
    \ rows present all other possible products that could be offered.\n\n**TABLE 10.3**\n\
    Example of Historical Application Data with Different Product Offers\n\n| This\
    \ data was used as an input to our AI solution. The column entitled “Classification\
    \ outcome Yijk” of Table 10.3 contains the results of applied AI solution. Value\
    \ 1 in this column identifies products that with high probability would be accepted\
    \ by the customer. Relevant quotes for insurance products and prices identified\
    \ by AI solution are expected to lead to the conversion rate of 14.7%. In other\
    \ words, the experiment identified the applications and the products that would\
    \ most likely lead to binding of the insurance applications.\n\n## 10.5 Summary\n"
