    left( {y\\_{i} - \\\\pi\\_{i} + h\\_{i}\\\\left( {0.5 - \\\\pi\\_{i}} \\\\right)}\
    \ \\\\right)x\\_{ij} = 0\\\\left( {j = 1,\\\\ldots,p} \\\\right)$ \n\nwhere *h*[i]\
    \ are the *i*th diagonal elements of the hat matrix:\n\n$g\\\\left( \\\\beta\\\
    _{j} \\\\right) = \\\\sum\\\\limits\\_{i = 1}^{n}\\\\left( {y\\_{i} - \\\\pi\\\
    _{i} + h\\_{i}\\\\left( {0.5 - \\\\pi\\_{i}} \\\\right)} \\\\right)x\\_{ij} =\
    \ 0\\\\left( {j = 1,\\\\ldots,p} \\\\right)$ $W^{\\\\frac{1}{2}}X\\\\left( {X^{\\\
    \\prime}WX} \\\\right)^{- 1}X^{\\\\prime}W^{\\\\frac{1}{2}}$ \n\nThe SAS code\
    \ below implements logistic regression with Firth’s correction for bias:\n\n```\n\
    \nPROC LOGISTIC data = SVM_Decision ;\n   CLASS Outcome ;\n   MODEL Outcome (event=’1’)\
    \ = Decision_Function / CL FIRTH ;\nRUN ;\n```\n\nSince the results of logistic\
    \ regression are probabilities, we chose a cutoff or a threshold value to classify\
    \ cases. The probabilities above this threshold value are classified as 1 and\
    \ those below as 0. For the probabilities generated by the Firth penalized logistic\
    \ regression, we search for such a threshold value that it further increases the\
    \ sensitivity and specificity of the results produced by SVM.\n\nWe perform the\
    \ analysis for each of the 2,000 training datasets. As the final classifier, we\
    \ select an SVM classifier with adjustment based on the Firth penalized logistic\
    \ regression that, on average, produces higher sensitivity and specificity metrics.\n\
    \nAfter applying different kernel types and various SVM hyperparameters (according\
    \ to the full-factorial design of experiment described above), the best results\
    \ occur with a radial kernel having a cost parameter *C* ∈ \\[1000;3000\\] and\
