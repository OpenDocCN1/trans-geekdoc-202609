- fmt: "\n| `ID variables` || `Name variables to identify observations in the outlier\
    \ diagnostics tables.` |\n| `MODEL response = < effects > < / options >` | Specifies\
    \ the variables to be used in the regression. |\n| `OUTPUT < OUT=SAS-data-set\
    \ > keyword=name < . . . keyword=name >` | Creates an output dataset that contains\
    \ final weights, predicted values, and residuals. |\n| `PERFORMANCE < options\
    \ >` | Tunes the performance of the procedure by using single or multiple processors\
    \ available on the hardware. |\n| `TEST effects` | Request robust linear tests\
    \ for the model parameters. |\n| `WEIGHT variable` | Identifies a variable in\
    \ the input dataset whose values are used to weight the observations. |\n\nIn\
    \ the context of a regression model, the word “outlier” means an observation where\
    \ the value of the response variable is far from the predicted value. In contrast,\
    \ `PROC ROBUSTREG` uses the `MCD` algorithm to identify multivariate outliers\
    \ in the `X space`, i.e., outliers in the covariate space of explanatory variables.\
    \ Such outliers are also referred to as leverage points. We can use `PROC ROBUSTREG`\
    \ to create an output dataset where the observations identified as outliers by\
    \ the `MCD` algorithm will be flagged. As the `MCD` estimates are produced for\
    \ the explanatory variables, a response variable is not important. We can use\
    \ the label variable or can simply generate a random response variable.\n\nSuppose\
    \ we have a dataset `X` that has 10 columns named `X1`, …, `X10` that represent\
    \ independent variables, and a column `Y` that represents labels. To generate\
    \ an output dataset with outliers identified by the `MCD` method, we will use\
    \ the `LEVERAGE(MCDINFO)` option in the `MODEL` statement.\n\n```\nproc robustreg\
    \ data=X method=lts;\n   model y = x1 - x18 / leverage(MCDInfo);\n   output out\
    \ = x_output leverage = leverage;\nrun;\n```\n\nThe `x_output` dataset will include\
    \ all variables from the original `X` dataset, as well as the `leverage` indicator\
    \ variable with values 0 and 1. When the `leverage` variable equals 1, it flags\
    \ the observations that are far from the center of the explanatory variables.\
    \ They are multivariate “outliers” in the space of the `X` variables.\n\nOf note,\
    \ `PROC ROBUSTREG` excludes observations with missing values from calculating\
    \ estimations. If a different treatment of missing values is preferable, for example\
    \ some type of imputation, then it should be done before applying `PROC ROBUSTREG`\
    \ to the data.\n\n## 4.3 Bias Reduction\n\nThe dataset from which outliers were\
    \ removed using the above-described method serves as an input for further data\
    \ cleansing process. The main goal of the next stage of the cleansing process\
    \ is the identification of bias, if any, and elimination of observations that\
    \ are responsible for that bias. We propose to use a bootstrap approach for bias\
    \ determination (see 3.2.3 Bias Reduction). For each variable in the dataset,\
    \ the approach works as follows:\n\n1. Sample with replacement a subset from the\
    \ dataset. The size of the subset can be the same as that of the original dataset,\
    \ or smaller when using the `m-out-of-n` bootstrap method (see 3.3 m-out-of-n\
    \ Bootstrap)\n2. Compute an estimate of interest (sample mean `μ̂` or median `m̂`)\n\
    3. Perform steps (1) and (2) `n` times where `n` can be as large as 1,000. This\
    \ will create `n`-bootstrap estimates, e.g., `m̂[1]`, …, `m̂[n]`\n4. Compute the\
    \ mean of the `n`-bootstrap estimates\n5. The difference between the estimate\
    \ computed using the original dataset and the mean of the `n`-bootstrap estimates\
    \ is a bootstrap estimate of a bias `B̂`:\n   $\\hat{B} = \\frac{1}{n}{\\sum\\\
    limits_{i = 1}^{n}{{\\hat{m}}\\_{i} - \\hat{m}}}$ \n6. To correct the bias of\
    \ the estimate, subtract the bootstrap bias estimate from the estimate of interest\
    \ calculated from the training dataset. For example, if the estimate of interest\
    \ is median, then the bias-corrected estimate will be:\n   ${\\hat{m}}^{\\*} =\
    \ \\hat{m} - \\left( {\\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{{\\hat{m}}\\}_{i}\
    \ - \\hat{m}}}} \\right)$ \n   which is the same as:\n   ${\\hat{m}}^{\\*} = 2\\\
    hat{m} - \\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{\\hat{m}}_{i}}$ \n\nIf bias is\
    \ present, the observations that are “responsible” for the bias should be removed\
    \ from the dataset. It can be done by calculating the corresponding confidence\
    \ interval based on the bias-corrected estimate `m̂(*)` or `μ̂(*)`. Observations\
    \ whose values for a specific variable are outside the confidence interval are\
    \ removed from the dataset. This process can be easily coded in R or SAS.\n\n\
    ## 4.4 Summary\n\nIn this chapter, we discussed the importance of cleansing data\
    \ for the use in the machine learning process. Specifically, we outlined two important\
    \ steps that take care of multidimensional outliers and bias. Additional steps\
    \ of cleansing may be required, which could be dictated by the nature of the data\
    \ used for classification. This may include rule-based exclusion of erroneous\
    \ values or treatment of missing values using different ways of imputation.\n\n\
    ## 4.5 References\n\n1. Boudt, K., Rousseeuw, P., Vanduffel, S., and Verdonck,\
    \ T. 2018. The minimum regularized covariance determinant estimator. 10.2139/ssrn.2905259.\n\
