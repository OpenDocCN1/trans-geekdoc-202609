  trans: "\n`β[0]`, `β[1]`, …, `β[p]` 是待估计的未知固定效应参数，`ε[i]` 是未知的独立同分布正态分布随机变量，`ε[i]~N(0,σ²\
    \ )`。\n\n`y^i` 独立同分布的假设过于严格。混合模型通过允许响应之间存在相关性，扩展了线性模型（方程 5.10）。这种扩展允许在分析中使用随机效应和随机系数。广义混合模型表示如下：\n\
    \n```\ny[ij] = β[0] ⅅ+ⅅβ[1]x[ij1] ⅅ+ … ⅅ+ⅅβ[p]x[ijp] ⅅ+ⅅγ[i1]z[ij1] ⅅ+ … ⅅ+ⅅγ[iq]z[ijq]\
    \ ⅅ+ⅅε[ij], ↆↆi = 1,ↆ…,ↆn,ↆↆj = 1,ↆ…,ↆm   (5.11) \n```\n\n其中\n\n`y[ij]` 是组 `j`\
    \ 中观测值 `i` 的响应变量值，`β[0]`, `β[1]`, …, `β[p]` 是未知的固定效应参数，\n\n`x[ij1]`, …, `x[ijp]`\
    \ 是组 `j` 中观测值 `i` 的固定效应回归变量，\n\n`γ[ik]`, `k=1,…, m` 是未知随机变量，`γ[ik] ∼ N(0,φ[k]²\
    \ ), ↆ Cov(φ[k],φ′[k]) = φ′[kk]`；`φ[k]²` 是随机效应的方差，`φ′[kk]` 是协方差，假设在组间保持常数，\n\n\
    `z[ij1]`, …, `z[iq]` 是随机效应回归变量，`ε[ij]` 是未知的随机变量，假设对于组 `j` 服从多元正态分布。\n\n与标准线性模型（方程\
    \ 5.10）不同，与组 `j` 中观测相关的残差可以是相关的。\n\n固定因子与随机因子之间的区别以及它们对响应变量的影响，在线性混合模型的背景下至关重要。我们建议对线性混合模型底层理论感兴趣的读者参考该主题的广泛统计文献，例如\
    \ Littell 等人 (2007) 以及 Verbeke 和 Molenberghs (1997)。\n\n### 5.2.6 AI 框架中的因子和响应变量\n\
    \n让我们考虑使用实验设计（DoE）框架构建分类器的过程。\n\n我们可能会选择不同的方法来创建合理的特征集，但结果将产生多种可能性。基于实验设计的精神，我们将此称为“特征集因子”。特征集可能性的数量定义了该因子的水平数。在构建分类器的过程中，我们需要决定这些特征集中的哪一个（换句话说，特征集因子的哪一个水平）最适用于我们的分类问题。\n\
    \n下一步，我们需要确定将用于构建分类器的机器学习方法。假设我们有理由选择特定方法。然而，如果并非如此，我们就多了一个可以名为“机器学习方法”的因子。该因子的水平数由我们想要尝试构建分类器的方法数量定义。\n\
    \n正如第 2 章所述，使用机器学习方法需要为超参数分配值。例如，在神经网络的情况下，需要对激活函数的类型、隐藏层数、每层的神经元数等做出决策。在支持向量机的情况下，我们需要选择一个核及其参数，以及代价参数（cost\
    \ parameter）的值。超参数可以是分类的（如激活函数或核类型）、整数的（如层数或多项式核的阶）或连续的（如高斯核的 `γ` 参数或代价参数）。对于分类参数，水平数被确定为参数的唯一分类值的数量。对于整数参数，水平数可以是参数唯一整数值的数量，或者在可能值很多的情况下，是值被分组的区间数量。对于连续参数，必须将值分组到区间中，区间的数量定义了水平数。\n\
    \n额外的因子是数据污染程度，不同的数据污染比例定义了该因子的水平数。\n\n### 5.2.7 示例\n\n让我们考虑使用实验设计（DoE）框架构建分类器的过程。\n\
    \n我们可能会选择不同的方法来创建合理的特征集，但结果将产生多种可能性。基于实验设计的精神，我们将此称为“特征集因子”。特征集可能性的数量定义了该因子的水平数。在构建分类器的过程中，我们需要决定这些特征集中的哪一个（换句话说，特征集因子的哪一个水平）最适用于我们的分类问题。\n\
    \n下一步，我们需要确定将用于构建分类器的机器学习方法。假设我们有理由选择特定方法。然而，如果并非如此，我们就多了一个可以名为“机器学习方法”的因子。该因子的水平数由我们想要尝试构建分类器的方法数量定义。\n\
    \n正如第 2 章所述，使用机器学习方法需要为超参数分配值。例如，在神经网络的情况下，需要对激活函数的类型、隐藏层数、每层的神经元数等做出决策。在支持向量机的情况下，我们需要选择一个核及其参数，以及代价参数（cost\
    \ parameter）的值。超参数可以是分类的（如激活函数或核类型）、整数的（如层数或多项式核的阶）或连续的（如高斯核的 `γ` 参数或代价参数）。对于分类参数，水平数被确定为参数的唯一分类值的数量。对于整数参数，水平数可以是参数唯一整数值的数量，或者在可能值很多的情况下，是值被分组的区间数量。对于连续参数，必须将值分组到区间中，区间的数量定义了水平数。\n\
    \n额外的因子是数据污染程度，不同的数据污染比例定义了该因子的水平数。\n\n"
- fmt: "\nLittell et al. (2007) is probably the best source describing SAS procedures\
    \ for the estimation of mixed models. The `MIXED` procedure is the one that we\
    \ use in the AI framework, as it fits a variety of mixed linear models and enables\
    \ using these fitted models to make statistical inferences about the data. The\
    \ `CLASS` statement of the `MIXED` procedure names the classification variables\
    \ to be used in the model. The `MODEL` statement names a single dependent variable\
    \ and the fixed effects, which determine the matrix of the mixed model. The `RANDOM`\
    \ statement defines the random effects of the mixed model and can be used to specify\
    \ variance component models as well as random coefficients. The random effects\
    \ can be classification, and then defined in the `CLASS` statement, or continuous.\
    \ The `LSMEANS` statement computes least squares means of fixed effects.\n\nAn\
    \ example described in 5.2.7 can be analyzed using `PROC MIXED`.\n\n```\nproc\
    \ mixed data=svm_experiment;\n   class ai bi ci a(ref=first) b(ref=first) c(ref=first);\n\
    \   model y_resp = a b c a*b a*c b*c / solution;\n   random ai(a) bi(b) ci(c);\n\
    run;\n```\n\nThis `PROC MIXED` estimates the model of three factors A, B, and\
    \ C and their second-degree combinations. This model also takes into consideration\
    \ that the actual values of hyperparameters are randomly selected from intervals\
    \ associated with the factor levels. Thus, `Ai`, `Bi`, and `Ci` are random factors\
    \ defining the actual values of each hyperparameter. The results of the analysis\
    \ appear in [Table 5.6](#C11_chapter5.xhtml#tab5_6), from which we can infer that\
    \ second-degree combinations are not statistically significant in this experiment.\n\
    \n### TABLE 5.6: Solution for Fixed Effects\n\n| Effect | A | B | C | Estimate\
    \ | Std. Error | DF | |t| Value | Pr > |t| |\n| :--- | :--- | :--- | :--- | :---\
