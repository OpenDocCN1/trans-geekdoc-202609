    \ behind supervised learning methods is that of learning from examples: given\
    \ several so-called training datasets that describe input–output relations, to\
    \ what extent can the general mapping be learned that takes any new and unseen\
    \ objects to their correct classes?\n\nThe basic problem of machine learning is\
    \ probably the following. We have a training dataset of cases\n\n(*x*[1],*y*[1]),  …,  (*x*[*n*],*y*[*n*])\
    \ \n\nwhere each case (*x*[*i*],*y*[*i*]),  *i* = 1, …,  *n*consists of an object\
    \ *x*[*i*](a vector of features) and its label *y*[*i*]. The problem is to predict\
    \ the label *y*[*n* + 1]of a new object *x*[*n* + 1]. Usually, the goal of classification\
    \ is to produce a prediction *ŷ*[*n* + 1]that is likely to coincide with the\
    \ true label *y*[*n* + 1], and this goal should be complemented with some measure\
    \ of its reliability. There is a clear tradeoff between accuracy and reliability:\
    \ we can improve the former by relaxing the latter and vice versa.\n\n## Generalization\
    \ Problem: Bias–Variance Tradeoff\n\nThe quality of a classifier is defined by\
    \ its ability to correctly classify an input vector into an appropriate class\
    \ and is measured by metrics derived from confusion, or misclassification, matrix.\
    \ There is no such metric that can measure a classifier quality alone: at least\
    \ a pair of metrics should be used. For example, sensitivity and specificity estimate\
    \ true positive and true negative rates, respectively, and we are interested in\
    \ classifiers with both of these metrics approaching 1.\n\nThe bias–variance tradeoff\
    \ is the idea that finding a minimum-risk classification method involves striking\
    \ a balance between minimizing bias (being right on average) and minimizing variance\
    \ (being stable with respect to variation in training datasets). A classification\
    \ method that performs poorly due to high variance is said to overfit when presented\
    \ with data. One that performs poorly due to high bias is said to underfit.\n\n\
    Low bias means\n\n*   the average accuracy metric of classification results is\
    \ close to the truth.\n\nHigh bias means\n\n*   the average accuracy metric of\
    \ classification results is far from the truth,\n\n*   the classification method\
    \ is not sufficiently flexible, and\n\n*   individual results of classification\
    \ accuracy metric are not adequately adapted to the data.\n\nLow variance means\n\
    \n*   each individual accuracy metric of classification is close to the average\
    \ accuracy metric,\n\n*   individual accuracy metric tends to be similar to one\
    \ another, and\n\n*   the classification method is “stable” with respect to which\
    \ dataset (of all possible datasets) it is applied.\n\nHigh variance means\n\n\
    *   individual accuracy metrics are often far from the average accuracy,\n\n*\
    \   individual accuracy metrics are quite different from one another, and\n\n\
    *   the classification method is very sensitive to which dataset it is applied.\n\
    \nThe challenge of bias and variance estimation can actually be easily addressed\
    \ by applying two readily available statistical methodologies:\n\n*   bootstrap\
    \ and\n\n*   mixture experiments.\n\nWe demonstrate in this book how the application\
    \ of m-out-of-n bootstrap allows creation of thousands of training datasets and\
    \ in turn how the application of the ML method to these datasets allows us to\
    \ estimate bias and variance. The statistical approach of the mixture experiment\
    \ is applied to contaminate data and to find the level of contamination that “breaks”\
    \ the classifier. This helps to identify robust classifiers that are better positioned\
    \ for unseen data.\n\n## Challenges of Deployment\n\nThe useful life of the machine\
    \ learning application begins when it is deployed to production. From this point,\
    \ application modifications are often required. These modifications may consume\
    \ a great deal of effort in recoding and even redesigning. Generally, the better\
    \ the machine learning application, the longer its life. Modifications and maintenance\
    \ of the application are usually performed by people other than the original implementers.\
    \ This problem is very difficult to solve because the application internals cannot\
    \ be easily understood. The code-free framework described in this book addresses\
    \ these problems. Generally, the framework outlined in this book addresses the\
    \ most fundamental problems of existing machine learning application development\
    \ and deployment technologies: the failure to recognize users’ true needs and\
    \ the inability to develop machine learning solutions quickly to meet these needs.\n\
    \nMachine learning applications have all the challenges of the traditional software\
    \ systems, plus an additional set of machine learning–specific issues – reproducibility\
    \ and comparability. These two machine learning–specific issues can be solved\
    \ by applying the principles of statistically designed experiments combined with\
    \ bootstrap along with testing the robustness of the machine learning solution\
    \ through data contamination processes (flipping or corruption of labels of training\
    \ dataset). The principles and applications of designed experiments, bootstrap,\
    \ and data contamination are discussed in this book.\n\nAnother challenge is the\
    \ selection of the production classifier. If, for example, the criterion of a\
    \ classifier quality is to maximize sensitivity and specificity, then we may encounter\
    \ a difficult choice. Let us say, we have classifier A with a sensitivity of 0.85\
    \ and a specificity of 0.88, and classifier B with a sensitivity of 0.87 and a\
    \ specificity of 0.87 – then which of them should we choose?\n\nIn this book,\
    \ we want to explore a different approach, wherein we do not need to limit our\
    \ choice by one classifier. Both classifiers, A and B, have a very good classification\
    \ quality. More than that, we can find a tens of classifiers with very similar\
    \ sensitivity and specificity. We also know that the sensitivity and specificity\
    \ of each classifier will vary depending on the datasets they are applied to.\
    \ So, instead of choosing one classifier, we will use all classifiers that have\
    \ high-quality metrics, and the final decision on the classification result will\
    \ be based on a voting mechanism using some information criteria. This approach\
    \ will immediately improve the classification process.\n\n## Source Code\n\nThe\
    \ source code for the book can be continuously improved and extended after the\
    \ book has been published. The source code is located on GitHub:\n\n[https://github.com/smlof/Supervised-Machine-Learning--Optimization-Framework](https://github.com)\n\
    \n# [Part I](#C02a_toc.xhtml#rpart1)\n\n# [1](#C02a_toc.xhtml#rchapter1)\n\n[Introduction\
    \ to the AI Framework](#C02a_toc.xhtml#rchapter1)\n\nThe artificial intelligence\
    \ (AI) framework should be algorithm and technology agnostic. This means that\
    \ it should not focus on a specific machine learning methodology and specific\
    \ systems or software, but it applies to the design, application, and use of AI\
    \ in general."
