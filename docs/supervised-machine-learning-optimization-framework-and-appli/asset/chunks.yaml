  trans: "\n\n动态神经网络在整个运行过程中永不停止学习并持续发展。它们不断适应最新数据，并改变其内部的神经元结构和权重。动态神经网络用于系统在运行期间需要学习新数据的情况。当我们预计会有新的输入-输出模式时，这种类型的神经网络是不可缺的，例如当领域随时间变化，或者输出受到缓慢过程的影响时。\n\
    \n## 2.3.2 神经网络组件\n\n### 2.3.2.1 激活函数\n\n神经网络分类器的一个重要组件是激活函数，它可以被解释为指示函数。神经元的激活函数定义了该神经元的输出取决于神经元的输入。Sigmoid\
    \ 函数经常用作激活函数。Sigmoid 函数的一个例子是逻辑函数：\n\n```\n${g\\left( x \\right) = \\frac{1}{1\
    \ + \\exp\\left( {- x} \\right)}}\\\\mspace{54mu}\\\\operatorname{(2.3)}$\n```\n\
    \n对于这种激活函数，`x` ≥ 0 时激活神经元。\n\n神经网络使用的激活函数的另一个例子是对称 sigmoid 函数：\n\n```\n${g(x)\
    \ = 2 \\times \\frac{1}{1 + \\exp\\left( {- x} \\right)} - 1 = \\frac{1 - \\exp\\\
    left( {- x} \\right)}{1 - \\exp\\left( {- x} \\right)} = \\tanh\\left( \\frac{x}{2}\
    \ \\right)}\\\\mspace{54mu}\\\\operatorname{(2.4)}$\n```\n\n更多示例包括修正的线性单元（ReLU）（公式\
    \ 2.5）和径向基函数（公式 2.6）：\n\n```\n${g\\left( x \\right) = \\left\\\\{ \\begin{array}{l}\
    \ {0,x \\leq 0} \\\\\\\\ {x,x > 0} \\\\\\\\ \\end{array} \\right.}\\\\mspace{54mu}\\\
    \\operatorname{(2.5)}$ `g`(`x`) = exp (−`x`²)   (2.6)  \n```\n\n对于径向基激活函数，`x`\
    \ = 0 时激活神经元（图 2.1）。\n\n![FIGURE 2.1 Activation functions.](img/file2.jpg)\n\n\
    **FIGURE 2.1**\n\n激活函数。\n\n### 2.3.2.2 神经元\n\n神经网络的基础组件是神经元。它由一个激活函数 `g` 和一个参数向量\
    \ $\\overset{\\\\rightarrow}{w} = \\left( {w_{0},w_{1},\\ldots,w_{n}} \\right)$\
    \ 组成。神经元接收实值输入向量（也称为特征），并激活函数和参数向量计算输出：如果激活函数的结果大于阈值（或等于指定值），则输出为 1；否则输出为 0。更精确地说，输出\
    \ `o`(`x[1], … , `x[n]`) 是由方程 (2.7) 形式化的神经元计算的。\n\n```\n${o\\left( {x\\_{1},\\\
    ldots,x\\_{n}} \\right) = \\left\\\\{ \\begin{array}{l} {1ifg\\left( {w\\_{0}\
    \ + w\\_{1}x\\_{1} + \\cdots + w\\_{n}x\\_{n}} \\right) > 0} \\\\\\\\ {0\\text{otherwise}}\
    \ \\\\\\\\ \\end{array} \\right.}\\\\mspace{54mu}\\\\operatorname{(2.7)}$\n```\n\
    \n其中\n\n`w[i]` 是决定输入 `x[i]` 对神经元输出贡献的权重。\n\n`w[0]` 是阈值，输入的加权组合（`w[1]```x[1]` +\
    \ ⋯ + `w[n]```x[n]`）必须超过该阈值才能激活神经元。\n\n神经元的学习涉及估计权重 `w[0]`、`w[1]`、…… `w[n]` 的取值。\n\
    \n### 2.3.2.3 网络\n\n神经网络将多个神经元组合成单个函数，有许多不同的算法可以执行这项工作。神经网络中的一些神经元使用特征值向量作为输入，另一些使用某些神经元的输出作为输入，而还有一些使用两者的结合。神经网络的参数包括神经元的参数\
    \ `g` 和 $\\overset{\\\\rightarrow}{w}$、神经元的连接方式以及线性函数输出层的参数。神经元通常根据它们接收到的输入类型分层排列。在输入层，神经元接收特征向量作为输入；在随后的层中，神经元接收上一层的输出作为输入。输入层和输出层以外的层被称为神经元的隐藏层。\n\
    \n神经网络的示例所示图 2.2。该神经网络有一个包含 `m` 个线性函数 `F[1]`、…… `F[m]` 的输出层，以及一个包含 `k` 个神经元的单隐藏层\
    \ `Z[1]`、…… `Z[k]`。\n\n![FIGURE 2.2 Neural network.](img/file3.jpg)\n\n**FIGURE\
    \ 2.2**\n\n神经网络。\n\n### 2.3.3 用于神经网络的 R \n\n由 Stefan Fritsch、Frauke Guenther、Marvin\
    \ N. 开发的 `neuralnet` 包包含 `neuralnet` 函数，该函数实现了如反向传播（Riedmiller, 1994）、带或不带权重的反向传播，或者\
    \ Anastadis (2005) 和 Taylor (2006) 的改进版本。在研究人员中非常受欢迎；但其用法并不总是正确的。\n\n**表格 2.2**\n\
    \n`neuralnet` 函数的参数\n\n| | 参数 |  |\n| --- | --- | --- |\n| 1 | `formula` | 拟合模型的符号描述\
    \ |\n| 2 | `data` | 包含公式中变量的数据框 |\n| 3 | `hidden` | 指定每层隐藏神经元的整数向量 |\n| 4 | `threshold`\
    \ | 指定误差函数偏导停止标准的数值值 |\n| 5 | `stepmax` | 训练的最大步 |\n| 6 | `rep` | 神经网络的重复次数 |\n\
    | 7 | `startweights` | 权重初始值的向量 |\n| 8 | `learningrate.limit` | 学习率最低和最高限制的向量或列表（用于\
    \ RPROP 和 GRPROP） |\n| 9 | `learningrate.factor` | 上下学习率的乘因子向量或列表（用于 RPROP 和 GRPROP）\
    \ |\n| 10 | `learningrate` | 指定学习率的数值（用于传统反向传播） |\n| 11 | `lifesign` | 指定在计算神经网络期间打印多少信息的字符串（“none”、“minimal”或“full”）\
    \ |\n| 12 | `lifesign.step` | 在“full”显示模式下打印最小阈值的步长整数 |\n| 13 | `algorithm` |\
    \ 用于计算神经网络的算法类型字符串 |\n| 14 | `err.fct` | 用于计算误差的可微函数，或 `sse` 用于误差平方和，或 `ce` 用于交叉熵\
    \ |\n| 15 | `act.fct` | 用于平滑变量或神经元与权重乘积结果的可微函数，或 `logistic` 用于逻辑函数，或 `tanh` 用于双曲正切\
    \ |\n| 16 | `linear.output` | 如果不应对输出神经元应用 `act.fct`，将其设置为 TRUE，否则为 FALSE |\n\
    | 17 | `exclude` | 指定排除在计算之外的权重向量或矩阵 |\n| 18 | `constant.weights` | 指定排除训练并视为固定的权重值的向量\
    \ |\n| 19 | `likelihood` | 如果误差函数等于负对数似然函数，则将计算信息准则 AIC 和 BIC。 |\n\n"
