- fmt: "\nBaseline hazard `h[0](t)` cancels out, and HR is constant with respect to\
    \ time:\n\n${\\text{HR} = \\exp{\\\\sum\\limits\\_{j = 1}^{k}\\\\beta\\_{j}}\\\
    \\left( {x\\_{ij} - x\\_{pj}} \\right)}\\mspace{54mu}\\\\operatorname{(11.4)}$\
    \ \n\nEstimated survival (time-to-event) probability at time `t` can be calculated\
    \ using an estimated baseline hazard function `h[0](t)` and estimated `β` coefficients:\n\
    \n$\\\\begin{array}{l} {S\\_{i}\\\\left( t \\right) = S\\_{0}\\\\left( t \\right)^{\\\
    exp{\\\\sum\\_{j = 1}^{k}{\\beta\\_{j}x\\_{ij}}}}} \\\\\\\\ {S\\_{0}\\\\left(\
    \ t \\right) = {\\\\int\\_{0}^{t}{h\\_{0}\\\\left( u \\right)du}}} \\\\\\\\ \\\
    end{array}\\mspace{54mu}\\\\operatorname{(11.5)}$ \n\nwhere:\n\n* `S[i](t)`—the\
    \ time-to-event function for subject `i` at time `t` `x[1]`, …, `x[k]`—the covariates\n\
    * `h[0](t)`—the baseline hazard function, that is, the hazard function for the\
    \ subject whose covariates `x[1]`, …, `x[k]` all have values of 0\n* `S[0](t)`—the\
    \ baseline survival function, that is, the survival function for the subject whose\
    \ covariates `x[1]`, …, `x[k]` all have values of 0\n* `β[1]`, …, `β[k]`—the coefficients\
    \ of the Cox model.\n\n## 11.4 Application of the Cox Model for Claims Analysis\n\
    \nWe identify three main goals of time-to-event analysis for workers’ compensation\
    \ claims:\n\n1. Estimate survival (time-to-event) function `S(t)`\n2. Estimate\
    \ effects `β` of industry covariate `x[1]`, …, `x[k]`\n3. Compare survival (time-to-event)\
    \ functions for different industries.\n\nIn order to build an appropriate model,\
    \ we have to address the nature of the claims process. In contrast to biomedical\
    \ applications where an event of interest, for example, is death and thus can\
    \ happen only once, in workers’ compensation insurance claims happen multiple\
    \ times, because for each policy there are possible multiple claims. There are\
    \ many different models that one can use to model repeated events in a time-to-event\
    \ analysis. The choice depends on the data to be analyzed and the research questions\
    \ to be answered.\n\nA possible approach is to treat each claim as a distinct\
    \ observation, but in this case, we have to consider the dependence of multiple\
    \ claims that belong to the same policy. The dependence might arise from unobserved\
    \ heterogeneity. Using some simple ad hoc ways to detect dependence (Allison,\
    \ 2012), we come to the conclusion that the dependence among time-to-event intervals\
    \ of claims that belong to the same policy is so small that it has a negligible\
    \ effect on the estimates of the model. Thus, we consider each claim as a single\
    \ event and can build models that do not account for claims dependence within\
    \ the same policy.\n\nBelow is a short review of different models.\n\n### Counting\
    \ process model\nIn the counting process model, each event is assumed to be independent,\
    \ and a subject contributes to the risk set for an event as long as the subject\
    \ is under observation at the time the event occurs. The data for each subject\
    \ with multiple events is described as data for multiple subjects where each has\
    \ delayed entry and is followed until the next event. This model ignores the order\
    \ of the events, leaving each subject to be at risk for any event as long as it\
    \ is still under observation at the time of the event. This model does not fit\
    \ our application needs because the entry time is considered as a time of the\
    \ previous event, and time-to-event is calculated as time between consecutive\
    \ events.\n\n### Conditional model I\nThis conditional model assumes that it is\
    \ not possible to be at risk for a subsequent event without having experienced\
    \ the previous event (i.e., a subject cannot be at risk for event 2 without having\
    \ experienced event 1). In this model, the time interval of a subsequent event\
    \ starts at the end of the time interval for the previous event. This model does\
    \ not fit our application needs because it introduces a dependency between consecutive\
    \ claims.\n\n### Conditional model II\nThis model only differs from the previous\
    \ model in the way the time intervals are structured. In this model, each time\
    \ interval starts at zero and ends at the length of time until the next event.\
    \ This model does not fit our application because it introduces a dependency between\
    \ claims within the same policy.\n\n### Marginal model\nIn the marginal model,\
    \ each event is considered as a separate process. The time for each event starts\
    \ at the beginning of follow-up time for each subject. Furthermore, each subject\
    \ is considered to be at risk for all events, regardless of how many events each\
    \ subject actually experienced. Thus, the marginal model considers each event\
    \ separately and models all the available data for the specific event. This model\
    \ fits our application needs and is used for the analysis.\n\n### 11.4.1 Data\
    \ Transformation\n\nWe analyze workers′ compensation claims data for the 2-year\
    \ period, so-called observation period. Each claim is associated with an industry\
    \ to which employer belongs, and with a state where accident happened.\n\nAn example\
    \ of data prepared for marginal model is presented in Figure 11.1:\n\n1. Policy\
    \ A starts before January; there are two claims in May and June; the policy ends\
    \ in August.\n2. Policy B starts in March; there is one claim in August; the policy\
    \ is canceled in October.\n3. Policy C starts in April; there are no claims in\
    \ the observed period.\n\n![FIGURE 11.1 Claims data presentation.](images/file14.jpg)\n\
    \n**FIGURE 11.1**\nClaims data presentation.\n\nFor this example, data is presented\
    \ as shown in Table 11.1:\n\n**TABLE 11.1**\nClaims Data\n\n| Policy | Claim |\
    \ Time-to-Event | Event | Censor |\n| :--- | :--- | :--- | :--- | :--- |\n| A\
    \ | 1 | 5 | 1 | 1 |\n| A | 2 | 6 | 2 | 1 |\n| A | 3 | 8 | 3 | 0 |\n| B | 4 | 6\
    \ | 1 | 1 |\n| B | 5 | 8 | 2 | 0 |\n| C | 6 | 9 | 1 | 0 |\n\nIn this case study,\
    \ we present an analysis and modeling performed on claims data for Illinois that\
    \ contained claims for Consulting, Entertainment, Finance, Hospitality, Manufacturing,\
    \ Retail, and Utilities industries.\n\nIn our analysis, we assume that each claim\
    \ event is independent within the policy and the industry. For example, if two\
    \ claims are covered by the same policy, we consider these claims independent.\
    \ As well, if two claims are covered by different policies, we assume that the\
    \ claims are independent and that the policies have no effect on risk. The data\
    \ for each policy with multiple claim events is described as multiple claims,\
    \ where each claim has an entry time at the beginning of the policy or the beginning\
    \ of the observation period—whichever is later.\n\n### 11.4.2 Cox Model Assumption\
    \ Validation\n"
