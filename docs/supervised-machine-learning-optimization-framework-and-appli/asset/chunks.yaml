    \ bootstrap and has been studied by various authors, for example Bickel et al.\
    \ (1997).\n\nThe m-out-of-n bootstrap with *m* appropriately chosen is successfully\
    \ used in cases where basic nonparametric bootstrap fails to be consistent. To\
    \ produce consistent estimates, the asymptotic theory requires *m*→∞ as *n*→∞\
    \ , but at a slower rate so that *m*/*n*→0 . If we choose *m* = *o*(*n*) , the\
    \ bootstrap mean is consistent. Athreya (1987) presented a proof of the convergence\
    \ of the bootstrap mean when applying the m-out-of-n bootstrap. Amazingly, such\
    \ a simple remedy works in a variety of examples, including dependent as well\
    \ as independent observations. Such examples include the case when data has distribution\
    \ with infinite moments, e.g., heavy tailed distribution, or the case of data\
    \ distribution with extreme values, or yet another case of finite population,\
    \ for instance survey sampling data.\n\n### [3.2.6 Bootstrap Samples Similarity](#C02a_toc.xhtml#rsec3_2_6)\n\
    \nWhile using the m-out-of-n bootstrap method to generate multiple training and\
    \ testing datasets, we strive to increase the variability among sample datasets\
    \ based on the randomness of observations selection. There is always a chance\
    \ that two randomly selected samples are comprised from very similar subsets of\
    \ observations, and the larger the sample size, the higher the chance of such\
    \ similarity. Applying the same machine learning method to two very similar training\
    \ datasets will most likely produce very similar classifiers. By itself, it is\
    \ not a problem, but our interest is to create different classifiers, and the\
    \ estimation process is computationally expensive. We suggest applying the Jaccard\
    \ similarity coefficient, also called the Jaccard index, to identify highly similar\
    \ datasets and exclude or regenerate one of them.\n\nJaccard similarity coefficient\
    \ is a statistic used to measure the similarity and diversity between finite-sample\
    \ datasets. The Jaccard coefficient is defined as the size of the intersection\
    \ divided by the size of the union of the sample sets:\n\n${J\\\\left( {A,\\\\\
    operatorname{}B} \\\\right) = \\\\frac{\\\\left| {A \\\\cap B} \\\\right|}{\\\\\
    left| {A \\\\cup B} \\\\right|} = \\\\frac{\\\\left| {A \\\\cap B} \\\\right|}{A\
    \ + B - \\\\left| {A \\\\cap B} \\\\right|}}\\\\mspace{54mu}\\\\operatorname{(3.14)}$\
    \ \n\nwhere\n\n|*A*∩*B*| is the size of the intersection between *A* and *B* datasets,\n\
    \n|*A*∪*B*| is the size of the union of the *A* and *B* sample datasets.\n\nJaccard\
    \ similarity coefficient statistic is limited: 0 ≤ *J*(*A*,*B*) ≤ 1 , and when\
    \ *A* and *B* datasets are both empty, it is defined as *J*(*A*,*B*) = 1 .\n\n\
    Another statistic, the Jaccard distance, measures the dissimilarity between two\
    \ sample datasets. It is complementary to the Jaccard coefficient and is obtained\
    \ by subtracting the Jaccard coefficient from 1, or, likewise, by dividing the\
    \ difference of the sizes of the union and the intersection of the two sets by\
    \ the size of the union:\n\n${D\\_{J}\\\\left( {A,\\\\operatorname{}B} \\\\right)\
    \ = 1 - J\\\\left( {A,\\\\operatorname{}B} \\\\right) = \\\\frac{\\\\left| {A\
    \ \\\\cup B} \\\\right| - \\\\left| {A \\\\cap B} \\\\right|}{\\\\left| {A \\\\\
    cup B} \\\\right|}}\\\\mspace{54mu}\\\\operatorname{(3.15)}$ \n\nUsing *J*(*A*,*B*)\
    \ or *D*[*J*](*A*,*B*) allows identifying pairs of similar bootstrap samples.\
    \ Then one of these samples can be excluded from the further process of building\
    \ a classifier.\n\n## [3.3 Implementation of Bootstrap in SAS and R](#C02a_toc.xhtml#rsec3_3)\n\
    \n### [3.3.1 m-out-of-n in SAS](#C02a_toc.xhtml#rsec3_3_1)\n\nIn SAS, bootstrap\
    \ can be implemented using the SURVEYSELECT procedure that includes a variety\
    \ of methods for selecting probability-based random samples. Using this procedure,\
    \ we can select a simple random sample or can sample according to a complex multistage\
    \ sample design applying stratification, clustering, and unequal probabilities\
    \ of selection.\n\nThe statements available in the PROC SURVEYSELECT are summarized\
    \ in [Table 3.1](#C09_chapter3.xhtml#tab3_1).\n\n**TABLE 3.1**  \n\nParameters\
    \ of SURVEYSELECT Procedure\n\n| PROC SURVEYSELECT options || invokes the procedure\
    \ and optionally identifies input and output datasets; specifies the selection\
    \ method, the sample size, and other sample design parameters |\n\n| --- | ---\
    \ |\n\n| STRATA variables </ options> || The optional statement that identifies\
    \ a variable or set of variables that stratify the input dataset |\n\n| SAMPLINGUNIT\
    \ | CLUSTER variables </ options> || The optional statement that identifies a\
    \ variable or set of variables that group the input dataset observations into\
    \ sampling units (clusters) |\n\n| CONTROL variables || The optional statement\
    \ that identifies variables for ordering units within strata |\n\n| SIZE variable\
    \ || identifies the variable that contains the size measures of the sampling units;\
    \ it is used for probability proportional to size selection method |\n\n| ID variables\
    \ ||  |\n\nUsing PROC SURVEYSELECT, we can deploy the m-out-of-n bootstrap method.\
    \ For example, let us create 100 samples of 1,000 values with replacement from\
    \ a “data\\_index” dataset that contains observation numbers of the input dataset:\n\
    \n```\n\nproc surveyselect data=data_index\n   method = urs n = 1000 reps = 100\n\
       seed = 123 out = data_index_sample;\nrun;\n```\n\nAs a result of this procedure,\
    \ the output “data\\_index\\_sample” dataset contains 100 samples of size 1,000.\
    \ The method “urs” stands for “unrestricted random sampling” which means selection\
    \ with equal probability and with replacement. In the case of more than a single\
    \ selection of the same observation in the sample, the output dataset contains\
    \ a single copy of this observation, but the variable “NumberHits” records the\
    \ number of selections for each observation.\n\n### [3.3.2 m-out-of-n in R](#C02a_toc.xhtml#rsec3_3_2)\n\
    \nIn R, the bootstrap can be implemented using two functions: “sample” and “replicate”.\n\
    \nThe “sample” function generates a sample of the specified size from the dataset\
    \ or elements, either with or without replacement. The syntax is:\n\n```\n\nsample(x,\
    \ size, replace = FALSE, prob = NULL)\n```\n\nThe parameters of the function are\
    \ described in [Table 3.2](#C09_chapter3.xhtml#tab3_2).\n\n**TABLE 3.2**  \n\n\
    Arguments of the “sample” Function\n\n| Argument || Description |\n\n| --- | ---\
    \ |\n\n| x || dataset or a vector of one or more elements from which the sample\
    \ is to be chosen |\n\n| --- | --- |\n\n| size || size of the sample |\n\n| replace\
    \ || “TRUE” or “FALSE” value depending on whether the sampling should be with\
    \ or without replacement |\n\n| prob || an optional vector of probability weights\
    \ for obtaining the elements of the vector being sampled |\n\nThe sample function\
    \ is most commonly used to take a sample of the elements of a vector, which can\
    \ be done either with or without replacement.\n\nThe “replicate” function repeats\
    \ a given function a specified number of times. The syntax is the following:\n\
    \n```\n\nreplicate(n, expr)\n```\n\nwhere “n” is the number of desired replications\
    \ and “expr” is the expression to be replicated."
