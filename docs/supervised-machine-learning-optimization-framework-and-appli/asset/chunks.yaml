    Two other arguments we would like to mention are `method` and `pl` as they allow
    specifying model using Firth’s penalized logistic regression. The default value
    of the `method` argument is `glm.fit`, which means either the modified-scores
    approach or maximum likelihood will be used. The `pl` argument is assigned a logical
    value that indicates whether the model should be fitted using Firth’s penalized
    likelihood with Jeffreys’ prior. The `pl` argument’s default value is `FALSE`
    which results in estimates that are free of `O(N^-1)` terms in asymptotic expansion
    of their bias. When `pl` is assigned `TRUE`, bias reduction is also achieved,
    in general, not at such magnitude. In the case of logistic regression, the value
    of `pl` is irrelevant since maximum likelihood match for natural families (Firth,
    1993).


    ### [2.5.5 SAS for Firth’s Regression](#C02a_toc.xhtml#rsec2_5)


    `LOGISTIC` procedure of SAS fits linear regression models for discrete response.
    It can also perform conditional logistic regression for data with binary response
    and exact logistic regression for data with binary and nominal response. The procedure
    executes maximum likelihood estimation with either Fisher scoring or Newton–Raphson
    algorithm. This procedure can also perform bias-reducing penalized likelihood
    optimization according to Firth (1993) and Heinze Scheper (2002).


    A complete description of `PROC LOGISTIC` can be found in SAS documentation. Here
    we will discuss only parameters related to Firth’s method. The `MODEL` statement
    of `PROC LOGISTIC` specifies the model that should be estimated, and the list
    of options to specify how the model should be estimated. The model can be specified
    in two possible forms. The first form, referred to as `single-trial`, is applicable
    to binary, ordinal, and nominal response data and is used when each observation
    in dataset contains information about only single trial, such as experiment.


    The second form, referred to as `events/trials`, is restricted to the case of
    binary response data. In this case, each observation contains information about
    binary response trials in the form of counts of observed subjects.


    `PROC LOGISTIC` will be in the `single-trial` form. An independent variable will
    be the distance produced by `SVM`, and the dependent variable will be the label
    from the training or testing dataset.


    To request that `PROC LOGISTIC` will perform Firth’s penalized likelihood estimation,
    `FIRTH` option should be included in `MODEL` statement.


    ## [2.6 Summary](#C02a_toc.xhtml#rsec2_6)


    In this chapter, we discussed the principles of machine learning and reviewed
    two specific methods: neural network and support vector machine. There is extensive
    literature reviewing these and other machine learning methods. However, there
    are multiple challenges to the practical application of these methods.


    One such challenge is the selection of hyperparameters. The default values assigned,
    for example, in the above-discussed `svm` function written in R can be considered
    placeholders. Why `cost` is assigned 1? Or why `gamma` that is used for all kernels
    is 1? Another challenge is the development of a robust classifier that would successfully
    deal with unseen data, that is the data not present in training or in testing
    dataset.


    In this book, we propose a framework that helps to address these challenges.


