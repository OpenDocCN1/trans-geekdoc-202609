    \ = 0 且 `cost` = 1。我们希望选择能如此简单！\n\n## 2.5 使用 Firth 回归的 SVM 修改\n\n### 2.5.1 引言\n\
    \n由于 SVM 不对数据分布建模，而是直接最小化分类误差，SVM 的输出是二元决策。换句话说，SVM 的是未校准的值，而不是概率。\n\n考虑二分类问题：对于输入\
    \ `x`，我们想要确定它们属于标记为 +1 和 −1 的两个类别 `y` 之一。我们假设分类问题将通过实值函数 `f(x)` 预测类别 `y` 来解决。对于许多问题，获取概率\
    \ `P(y = 1 | f(x))` 是方便甚至必须的。虽然二元决策对于许多问题是足够的，但很难得出概率。通过将 SVM 的输出映射到概率可以缓解这些担忧。已经开发了多种方法来解决这个问题。Vapnik\
    \ 建议了一种将输出映射到特征空间的方法。Platt 将输出转换为概率。在书中，我们建议应用 Firth 回归。使用逻辑回归的好处是结果更具通用性。\n\n\
    ### 2.5.2 逻辑回归\n\n让我们考虑二元因变量 `y` 和带有系数向量 `β` 的 `x` 向量的逻辑回归：\n\n$P(y = 1 | x) =\
    \ π = \\frac{1}{1 + \\exp(-xβ)}$\n\n其中：\n\n`y` 是二元因变量，`y = (y1, ..., yn)`，`x`\
    \ 是自变量向量，`x = (x1, ..., xk)`，`β` 是系数向量，`β = (β1, ..., βk)`。\n\n该模型的对数似然如下：\n\n\
    $\\ln L(β | y) = \\sum_{i=1}^{n} \\{yi \\ln(\\frac{1}{1 + \\exp(-xiβ)}) + (1 -\
    \ yi) \\ln(1 - \\frac{1}{1 + \\exp(-xiβ)})\\}$\n\n因此，得分函数如下：\n\n$\\frac{\\partial\\\
    ln L(β | y)}{\\partial\\beta} = U(β) \\sum_{i=1}^{n} \\{yi \\ln(\\frac{1}{1 +\
    \ \\exp(-xiβ)}) + (1 - yi) \\ln(1 - \\frac{1}{1 + \\exp(-xiβ)})\\}$\n\n使用标准的迭代方法（例如牛顿-拉夫逊法），我们可以通过求解方程\
    \ (2.20) 中的 `β` 来找到 `β̂`。\n\n"
