- fmt: '

    In this book, we discuss the optimization framework for only supervised machine
    learning methods.


    ## 2.2 Principles of Supervised Machine Learning


    Sometimes, supervised learning is compared with what statisticians do. The “supervision”
    refers to the fact that the responses are available, and the term “learning” means
    any method or procedure that can be tested for the validity of its output. When
    responses are available, the goals of analysis such as model identification, decision
    making, or prediction can be validated. More typically, supervised learning refers
    to classification.


    The objective of classification is to assign objects of a population to one of
    several categories using a set of features observed on each object. For example,
    in the case of insurance underwriters, the set of features may include features
    of the insurance application and features of the insurance product that is offered
    in response to the application. The categories are known in advance and can be
    ordered or not ordered. In the same example related to insurance applications,
    the categories will be one of two: the offered insurance product will be accepted
    by the applicant, or the offer will be rejected.


    Classifiers are built on training datasets, where both features and labels are
    known and available for the classifier-building algorithm.


    The quality of a classifier is measured by calculating the ratios of correctly
    classified objects within each category. This measure is called the misclassification
    matrix and is calculated first on the training datasets and then on the testing
    datasets.


    A misclassification matrix, sometimes, is also called a confusion matrix or an
    error matrix. It visualizes the performance of a machine learning method and serves
    the basis of calculating the metrics of classification performance. Each row of
    the misclassification matrix represents predicted labels, and each column represents
    actual labels. Each cell of this matrix contains the frequency of instances corresponding
    to the predicted and actual labels (see [Table 2.1]).


    ### TABLE 2.1 Misclassification Matrix


    | Predicted Actual | Label “TRUE” | Label “FALSE” |

    | :--- | :--- | :--- |

    | **TRUE** | | |

    | **FALSE** | | |


    ## 2.3 Neural Network


    ### 2.3.1 Introduction


    The neural network method was created as an attempt to mimic the way brain processes
    and stores information. The basic component of the brain, the neuron, was discovered
    in 1836. It took more than 100 years till the modern era of neural network research
    and development was initiated in the classic paper “A Logical Calculus of the
    Ideas Immanent in Nervous Activity” of W.S. McCulloch and W. Pitts.

