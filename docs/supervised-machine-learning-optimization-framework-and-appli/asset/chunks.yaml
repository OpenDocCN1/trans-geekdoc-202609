    *   Application design is perceived as data and nothing but data. This means that
    the application design is defined in a set of specially structured tables and
    is stored, updated, and managed in the same way as ordinary data.

    *   Application activities are stated in terms of what must be done, but not how
    to do it. An application activity can be imagined as a definition of states, and
    messages allowing transition from one state to another. Of course, the states
    and messages are stored, updated, and managed as ordinary data. The application
    designer defines full application functionality by the use of its states and messages.

    *   The application is managed from a single control point.


    To automate an application development process from beginning to end means that:


    *   requirements feed seamlessly into the design,

    *   design automatically writes code,

    *   code is deployed automatically into production, and

    *   maintenance changes automatically rewrite code.


    Code-free design can realize this end-to-end automation through the table-driven
    environment. The table-driven environment is the most fundamental aspect of the
    code-free approach. The heart of this environment is the set of specially structured
    tables forming the data dictionary. The data dictionary contains a variety of
    information regarding application objects and operations, such as data structures
    and application activities. In other words, the data dictionary contains application
    design, and the data dictionary programs transform it into appropriate, functional
    working applications. The data dictionary also supports modifications of the application
    according to changes in application design. Different structures of data dictionaries
    can be defined depending on the application needs.


    The table-driven environment consists of tables and computer programs that generate
    `SAS` or `R` code from the data stored in these tables. The table-driven environment
    provides a convenient and reliable framework for code-free application design.


    When we look at an analytical application, we can see two important components:
    objects and operations. Each entity of the real world can be represented as an
    object. Consider the example of the application that supports marketing experiments.
    In this example, the objects are an audience, marketing channel, creative, and
    so on. In the real world, objects are continuously being transformed. These transformations
    are called operations. Only with a good understanding of these two components—objects
    and operations—can we build effective analytical applications.


    Relational technology and the concept of code-free approach are two fundamental
    things that help to make generalizations about objects.


    ## 6.2 The Data Dictionary Components for the AI Framework


    ### 6.2.1 Relational Model


    The relational data model consists of the following elements:


    `Model = {*S*, *C*, *O*}`


    where


    *   `S` is a set of rules that define the data structure: the objects, their properties,
    and the relationships between the objects.

    *   `C` is a set of rules that define the constraints that are applied to the
    defined data structure.

    *   `O` is a set of operations that are given to perform on the defined data structure.


    Without a model, entity relationships are hidden in program code. The model brings
    these relationships to the surface. Also, the model helps ensure that programmed
    representations and interactions among the objects are valid. During application
    design, the relational data model allows the designer to represent the exact structure
    and properties of the data required for the application.


    ### 6.2.2 Table


    A table is a fundamental entity in the relational model. A table can be represented
    as a two-dimensional object arranged in rows and columns. The structure of a table
    is very similar to that of an `SAS` dataset or `R` data frame.


    ### 6.2.3 Data Aspects


    For a variety of technical and non-technical reasons, the relational model has
    proven to be very popular. Because the use of the relational model is so widespread
    and because it satisfies the functional requirements of many analytical applications,
    we have chosen to use a relational model in the design of the table-driven environment.
    The relational data model addresses three aspects of data:


    *   data structure

    *   data manipulation

    *   data integrity.


    Data structure terms and their definitions are given below.


    ### 6.2.4 Relational Data Structure


    The relational data model is responsible for the definition of the form in which
    data is represented (table structures) and for the definition of a set of operators
    that are enabled for these table structures. The table structures, together with
    the operators allowed on these tables, compose the relational data structure.


    ### 6.2.5 Domains


    A domain is the set of all possible data values of a particular type for each
    column in a table. The domain of a column can also be defined in terms of another
    column; that is, the first column may contain only values from another column.
    The significance of domains is as follows:


    *   If two columns draw their values from the same domain, then comparisons involving
    these two columns make sense because they are comparing like values.

    *   If two columns draw their values from different domains, then comparisons
    involving these two columns do not make sense.


    Domains may or may not be explicitly stored as actual sets of values. But they
    should be specified as part of the application definition, and then each column
    definition should include a reference to the corresponding domain. A given column
    can have the same name as the corresponding domain, or a different name.


    ### 6.2.6 Relations and Tables


    The relation is an important term in the relational data model. Relations describe
    the connection between columns. The number of rows in a relation is called the
    cardinality of the relation. Relations can be conveniently represented in tabular
    form. A relational table is a data structure consisting of rows and columns, with
    each row being unique to that table. A table and a relation are not the same things,
    though for the purposes of our book we have assumed that they are. The relational
    data model gives symbolic names to data, thereby enabling to manipulate the data
    in the logical form. In the relational data model, each table has a unique name
    that identifies it. Each column in the table has a unique name (within this table)
    that identifies the column. The same column name can appear in two tables. In
    this case, we can identify a column in one equivalent way by joining the table
    and column names. Throughout this book, we often refer to the column of the table
    as `<Table name>.<COLUMN NAME>`


    ### 6.2.7 Functions


    The function is the specific type of relationship between two relational tables.
    Suppose


    *   that each row of the first table relates exactly to each row of the second
    table, or

    *   that more than one row of the first table relates to one row of the second
    table, or

    *   that rows of the first table do not relate to rows of the second table.


    Each of these relationships is called a function between the first table and the
    second table. These functions define the relationship or mapping between tables.
    Relationships between tables in the relational data model can be one-to-one (1:1)
    or one-to-many (1:M).


    ### 6.2.8 One-to-one Relationship


    A one-to-one relationship (1:1) is the simple relationship that exists between
    tables in which each row of the first table corresponds to one row of the second
    table, and vice versa.


    ### 6.2.9 One-to-many Relationship

