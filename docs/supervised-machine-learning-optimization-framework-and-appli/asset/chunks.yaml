- fmt: "\nTo estimate coefficients of the Cox hazard model, we use SAS^® software,\
    \ specifically the `PHREG` procedure, which performs analysis of survival data.\
    \ The estimation of the Cox hazard model using the Bayesian approach by `SAS PROC\
    \ PHREG` is implemented in the following way:\n\n```sas\nproc phreg data= CLAIMS_DATA_IL;\n\
    \    class CLIENT_INDUSTRY;\n    model TIME_TO_EVENT*CENSOR(0) = CLIENT_INDUSTRY\
    \ SEASON_EVENT;\n    SEASON_EVENT = SEASON*log(TIME_TO_EVENT);\n    bayes seed\
    \ = 1 outpost = POST;\nrun;\n```\n\n`CLAIMS_DATA_IL` is a SAS dataset that contains\
    \ data for the state of Illinois such as industries and time intervals from the\
    \ beginning of policies to the date of claims. The sample of rows from `CLAIMS_DATA_IL`\
    \ is presented in [Table 11.2](#C17_chapter11.xhtml#tab11_2).\n\n**TABLE 11.2**\n\
    \nSelected Rows from the CLAIMS_DATA_IL Dataset\n\n| CLIENT_INDUSTRY | TIME_TO_EVENT\
    \ | CENSOR | SEASON |\n| --- | --- | --- | --- |\n| Consulting | 119 | 0 | 0 |\n\
    | Consulting | 162 | 0 | 0 |\n| Consulting | 220 | 1 | 0 |\n| Retail | 365 | 0\
    \ | 0 |\n| Retail | 237 | 1 | 0 |\n| Transportation | 95 | 1 | 0 |\n| Transportation\
    \ | 108 | 1 | 1 |\n| Utilities | 7 | 1 | 0 |\n\nThe `CLIENT_INDUSTRY` column contains\
    \ names of industries to which claims are related. The `TIME_TO_EVENT` column\
    \ contains the number of days to an event calculated starting from the beginning\
    \ of the observation period or from the beginning of the policy, whichever happens\
    \ later. The `CENSOR` column indicates whether the event is a claim (`CENSOR =\
    \ 1`), or whether the event is the end of a policy (`CENSOR = 0`). The `SEASON`\
    \ column indicates whether the event happened during the winter season (`SEASON\
    \ = 1`) or not (`SEASON = 0`).\n\nThere are two covariates in the model: `CLIENT_INDUSTRY`\
    \ and `SEASON_EVENT`. `CLIENT_INDUSTRY` is a categorical variable, so it is defined\
    \ as the covariate in the `CLASS` statement and in `MODEL` statement. `SEASON_EVENT`\
    \ is the time-dependent covariate that represents the following component of the\
    \ model: season × ln(t). `SEASON_EVENT` is defined in `MODEL` statement and in\
    \ the expression that follows the `MODEL` statement:\n\n```sas\nclass CLIENT_INDUSTRY;\n\
    \    model TIME_TO_EVENT*CENSOR(0) = CLIENT_INDUSTRY SEASON_EVENT;\n    SEASON_EVENT\
    \ = SEASON*log(TIME_TO_EVENT);\n```\n\nThe `BAYES` statement requests a Bayesian\
    \ analysis of the model by using Gibbs sampling. In the `BAYES` statement, we\
    \ specify a `seed` value as a constant to reproduce Markov chains for the same\
    \ input. We did not specify the prior distribution, thus applying non-informative\
    \ prior. The described `PHREG` procedure produces an estimation of `β` and `γ`.\n\
    \nHowever, `PROC PHREG` does not produce baseline survival function `S[0](t)`\
    \ when time-dependent covariate is defined. To calculate the baseline survival\
    \ function, we use the following workaround (Thomas and Reyes, 2014):\n\n```sas\n\
    data DS;\n    set CLAIMS_DATA_IL;\n    SEASON_EVENT = SEASON*log(TIME_TO_EVENT);\n\
    run;\ndata INDUSTRY;\n    CLIENT_INDUSTRY = \"Utilities\";\n    SEASON_EVENT =\
    \ 0;\nrun;\nproc phreg data=DS;\n    class CLIENT_INDUSTRY;\n    model TIME_TO_EVENT\
    \ *censor(0) = CLIENT_INDUSTRY SEASON_EVENT;\n    bayes seed=1;\n    out = BASELINE\
    \ survival = INDUSTRY;\nrun;\n```\n\nThis step produces baseline survival function\
    \ `S[0](t)`.\n\n### 11.4.5 Interpretation of Results\n\nEstimations of `β` coefficients\
    \ of the Cox model for all industries except Utilities are presented in [Table\
    \ 11.3](#C17_chapter11.xhtml#tab11_3). Because the Utilities industry is used\
    \ as a baseline for hazard, `β` coefficient for Utilities is equal to 0. [Table\
    \ 11.3](#C17_chapter11.xhtml#tab11_3) also contains `γ` coefficient for the `SEASON_EVENT`\
    \ covariate.\n\n**TABLE 11.3**\n\nEstimations of the Model Coefficients\n\n| Industry\
    \ | Mean Estimate of β | Industry | Mean Estimate of β |\n| --- | --- | --- |\
    \ --- |\n| Consulting | -2.282 | Manufacturing | -0.471 |\n| Entertainment | -0.508\
    \ | Retail | -0.523 |\n| Finance | -0.217 | Utilities | 0.000 |\n| Hospitality\
    \ | -0.145 | SEASON_EVENT | 0.277 |\n\nFor the purposes of comparing the risk\
    \ of claims for different industries, we build survival functions for each industry,\
    \ and `season = 0` ([Figure 11.3](#C17_chapter11.xhtml#fig11_3)). According to\
    \ the survival function for the Utilities industry, for example, there is a 58%\
    \ chance that there will be no claims before the 100th day of policy, and there\
    \ is a 1% chance that there will be no claims at all for one-year policy.\n\n\
    The survival functions allow to estimate and compare the risk of claims among\
    \ industries. For example, for the Entertainment industry there is a 72% chance\
    \ that there will be no claims before the 100th day of policy, and a 6.5% chance\
    \ that there will be no claims at all for a one-year policy. In other words, the\
    \ Entertainment industry in Illinois presents a 5.5% higher chance than the Utilities\
    \ industry to have no claims during a one-year policy. Also, we can observe that\
    \ Entertainment, Manufacturing, and Retail have very similar risks of claims in\
    \ Illinois. In addition, there is strong evidence that the Consulting industry\
    \ has a significantly lower risk than the other industries.\n\n![FIGURE 11.3 Survival\
    \ functions for industries in Illinois.](images/file16.jpg)\n\n**FIGURE 11.3**\n\
    \nSurvival functions for industries in Illinois.\n\nThe hazard function presented\
    \ in [Figure 11.4](#C17_chapter11.xhtml#fig11_4) shows that the instantaneous\
    \ claims rate continuously increases, achieving the highest claims rate around\
    \ the 280th day of policy, and then slightly decreasing. We can also observe that\
    \ the Consulting industry has somewhat constant and relatively low claims rate\
    \ through the duration of a policy. The hazard function in [Figure 11.4](#C17_chapter11.xhtml#fig11_4)\
    \ (as well as in [Figure 11.6](#C17_chapter11.xhtml#fig11_6) and [Figure 11.8](#C17_chapter11.xhtml#fig11_8))\
    \ was produced with the `SMOOTH` SAS macro program (Allison, 2012).\n\n![FIGURE\
    \ 11.4 Hazard functions for industries in Illinois.](images/file17.jpg)\n\n**FIGURE\
    \ 11.4**\n\nHazard functions for industries in Illinois.\n\nThe time-dependent\
    \ covariate `SEASON_EVENT` is significant with `γ = 0.281`. This means that hazard\
    \ ratio during the winter season in Illinois is 32% higher, controlling for the\
    \ other covariates:\n\n`exp(0.281) - 1 ≈ 0.32`\n\nEstimation of survival (time-to-event)\
    \ function for a specific policy should take into consideration when the policy\
    \ started—and thus, when during this policy chances of claims increase due to\
    \ the winter season.\n\nCalculation of survival functions when we have time-varying\
    \ covariates is not straightforward, because we need to specify exactly when a\
    \ specific policy started and when, relatively to the start date of the policy,\
    \ the winter season occurred. A proprietary computer program is developed by the\
    \ authors to calculate `S[i](t)` for each industry with the time-dependent covariate.\n\
    \nBelow we compare two examples mentioned earlier: the case when the policy started\
    \ on the 1st of April and the case when the policy started on the 1st of August.\n"
  raw: "    To estimate coefficients of the Cox hazard model, we use SAS^® software,\
    \ specifically the PHREG procedure, which performs analysis of survival data.\
    \ The estimation of the Cox hazard model using the Bayesian approach by SAS PROC\
    \ PHREG is implemented in the following way:\n\n    ```\n    \n    proc phreg\
    \ data= CLAIMS_DATA_IL;\n       class CLIENT_INDUSTRY;\n       model TIME_TO_EVENT*CENSOR(0)\
    \ = CLIENT_INDUSTRY SEASON_EVENT;\n       SEASON_EVENT = SEASON*log(TIME_TO_EVENT);\n\
    \       bayes seed = 1 outpost = POST;\n    run;\n    ```\n\n    CLAIMS\\_DATA\\\
    _IL is a SAS dataset that contains data for the state of Illinois such as industries\
    \ and time intervals from the beginning of policies to the date of claims. The\
    \ sample of rows from CLAIMS\\_DATA\\_IL is presented in [Table 11.2](#C17_chapter11.xhtml#tab11_2).\n\
    \n    **TABLE 11.2**  \n\n    Selected Rows from the CLAIMS\\_DATA\\_IL Dataset\n\
    \n    | CLIENT\\_INDUSTRY || TIME\\_TO\\_EVENT || CENSOR || SEASON |\n\n    |\
    \ --- | --- | --- | --- |\n\n    | Consulting || 119 || 0 || 0 |\n\n    | ---\
    \ | --- | --- | --- |\n\n    | Consulting || 162 || 0 || 0 |\n\n    | Consulting\
    \ || 220 || 1 || 0 |\n\n    | Retail || 365 || 0 || 0 |\n\n    | Retail || 237\
    \ || 1 || 0 |\n\n    | Transportation || 95 || 1 || 0 |\n\n    | Transportation\
    \ || 108 || 1 || 1 |\n\n    | Utilities || 7 || 1 || 0 |\n\n    The CLIENT\\_INDUSTRY\
    \ column contains names of industries to which claims are related. The TIME\\\
    _TO\\_EVENT column contains the number of days to an event calculated starting\
    \ from the beginning of the observation period or from the beginning of the policy,\
    \ whichever happens later. The CENSOR column indicates whether the event is a\
    \ claim (CENSOR = 1), or whether the event is the end of a policy (CENSOR = 0).\
    \ The SEASON column indicates whether the event happened during the winter season\
    \ (SEASON = 1) or not (SEASON = 0).\n\n    There are two covariates in the model:\
    \ CLIENT\\_INDUSTRY and SEASON\\_EVENT. CLIENT\\_INDUSTRY is a categorical variable,\
    \ so it is defined as the covariate in CLASS statement and in MODEL statement.\
    \ SEASON\\_EVENT is the time-dependent covariate that represents the following\
    \ component of the model: season × ln(*t*) . SEASON\\_EVENT is defined in MODEL\
    \ statement and in the expression that follows the MODEL statement:\n\n    ```\n\
    \    \n    class CLIENT_INDUSTRY;\n       model TIME_TO_EVENT*CENSOR(0) = CLIENT_INDUSTRY\
    \ SEASON_EVENT;\n       SEASON_EVENT = SEASON*log(TIME_TO_EVENT);\n    ```\n\n\
    \    The BAYES statement requests a Bayesian analysis of the model by using Gibbs\
    \ sampling. In the BAYES statement, we specify a seed value as a constant to reproduce\
    \ identical Markov chains for the same input data. We did not specify the prior\
    \ distribution, thus applying uniform non-informative prior.\n\n    The described\
    \ PHREG procedure produces an estimation of *β* and *γ* coefficients.\n\n    However,\
    \ PROC PHREG does not produce baseline survival function *S*[0](*t*) when time-dependent\
    \ covariate is defined. To calculate the baseline survival function, we use the\
    \ following workaround (Thomas and Reyes, 2014):\n\n    ```\n    \n    data DS;\n\
    \       set CLAIMS_DATA_IL;\n       SEASON_EVENT = SEASON*log(TIME_TO_EVENT);\n\
    \    run;\n    data INDUSTRY;\n    CLIENT_INDUSTRY = \"Utilities\";\n       SEASON_EVENT\
    \ = 0;\n    run;\n    proc phreg data=DS;\n       class CLIENT_INDUSTRY;\n   \
    \    model TIME_TO_EVENT *censor(0) = CLIENT_INDUSTRY SEASON_EVENT;\n       bayes\
    \ seed=1;\n       baseline out = BASELINE survival = S covariates = INDUSTRY;\n\
    \    run;\n    ```\n\n    This step produces baseline survival function *S*[0](*t*)\
    \ .\n\n    ### [11.4.5 Interpretation of Results](#C02a_toc.xhtml#rsec11_4_5)\n\
    \n    Estimations of *β* coefficients of the Cox model for all industries except\
    \ Utilities are presented in [Table 11.3](#C17_chapter11.xhtml#tab11_3). Because\
    \ the Utilities industry is used as a baseline for hazard, *β* coefficient for\
    \ Utilities is equal to 0. [Table 11.3](#C17_chapter11.xhtml#tab11_3) also contains\
    \ *γ* coefficient for the SEASON\\_EVENT covariate.\n\n    **TABLE 11.3**  \n\n\
    \    Estimations of the Model Coefficients\n\n    | Industry || Mean Estimate\
    \ of *β* || Industry || Mean Estimate of *β* |\n\n    | --- | --- | --- | ---\
    \ |\n\n    | Consulting || −2.282 || Manufacturing || −0.471 |\n\n    | --- |\
    \ --- | --- | --- |\n\n    | Entertainment || −0.508 || Retail || −0.523 |\n\n\
    \    | Finance || −0.217 || Utilities || 0.000 |\n\n    | Hospitality || −0.145\
    \ || SEASON\\_EVENT || 0.277 |\n\n    For the purposes of comparing the risk of\
    \ claims for different industries, we build survival functions for each industry,\
    \ and season = 0 ([Figure 11.3](#C17_chapter11.xhtml#fig11_3)). According to the\
    \ survival function for the Utilities industry, for example, there is a 58% chance\
    \ that there will be no claims before the 100th day of policy, and there is a\
    \ 1% chance that there will be no claims at all for one-year policy.\n\n    The\
    \ survival functions allow to estimate and to compare the risk of claims among\
    \ industries. For example, for the Entertainment industry there is a 72% chance\
    \ that there will be no claims before the 100th day of policy, and a 6.5% chance\
    \ that there will be no claims at all for a one-year policy. In other words, the\
    \ Entertainment industry in Illinois presents a 5.5% higher chance than the Utilities\
    \ industry to have no claims during a one-year policy. Also, we can observe that\
    \ Entertainment, Manufacturing, and Retail have very similar risks of claims in\
    \ Illinois. In addition, there is strong evidence that the Consulting industry\
    \ has a significantly lower risk than the other industries.\n\n    ![FIGURE 11.3\
    \ Survival functions for industries in Illinois.](images/file16.jpg)\n\n    **FIGURE\
    \ 11.3**  \n\n    Survival functions for industries in Illinois.\n\n    The hazard\
    \ function presented in [Figure 11.4](#C17_chapter11.xhtml#fig11_4) shows that\
    \ the instantaneous claims rate continuously increases, achieving the highest\
    \ claims rate around the 280th day of policy, and then slightly decreasing. We\
    \ can also observe that the Consulting industry has somewhat constant and relatively\
    \ low claims rate through the duration of a policy. The hazard function in [Figure\
    \ 11.4](#C17_chapter11.xhtml#fig11_4) (as well as in [Figure 11.6](#C17_chapter11.xhtml#fig11_6)\
    \ and [Figure 11.8](#C17_chapter11.xhtml#fig11_8)) was produced with the SMOOTH\
    \ SAS macro program (Allison, 2012).\n\n    ![FIGURE 11.4 Hazard functions for\
    \ industries in Illinois.](images/file17.jpg)\n\n    **FIGURE 11.4**  \n\n   \
    \ Hazard functions for industries in Illinois.\n\n    The time-dependent covariate\
    \ SEASON\\_EVENT is significant with *γ* = 0.281 . This means that hazard ratio\
    \ during the winter season in Illinois is 32% higher, controlling for the other\
    \ covariates:\n\n    exp(0.281) − 1 ≈ 0.32 = 32 \n\n    Estimation of survival\
    \ (time-to-event) function for a specific policy should take into consideration\
    \ when the policy started—and thus, when during this policy chances of claims\
    \ increase due to the winter season.\n\n    Calculation of survival functions\
    \ when we have time-varying covariates is not straightforward, because we need\
    \ to specify exactly when a specific policy started and when, relatively to the\
    \ start date of the policy, the winter season occurred. A proprietary computer\
    \ program is developed by the authors to calculate *S*[*i*](*t*) for each industry\
    \ with the time-dependent covariate.\n\n    Below we compare two examples mentioned\
    \ earlier: the case when the policy started on the 1st of April and the case when\
    \ the policy started on the 1st of August."
