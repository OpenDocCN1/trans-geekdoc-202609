    \ a vector of real-value inputs, also called features, and calculates the output\
    \ using the activation function and the parameter vector: if the result of the\
    \ activation function is greater than the threshold (or equal to a specified value),\
    \ then the output is 1; otherwise, the output is 0. More precisely, the output\
    \ *o*(*x*[1], … , *x*[n]) is computed by the neuron formulated by equation (2.7).\n\
    \n${o\\\\left( {x\\_{1},\\\\ldots,x\\_{n}} \\\\right) = \\\\left\\\\{ \\\\begin{array}{l}\
    \ {1ifg\\\\left( {w\\_{0} + w\\_{1}x\\_{1} + \\\\cdots + w\\_{n}x\\_{n}} \\\\\
    right) > 0} \\\\\\\\ {0\\\\text{otherwise}} \\\\\\\\ \\\\end{array} \\\\right.}\\\
    \\mspace{54mu}\\\\operatorname{(2.7)}$ \n\nwhere\n\n*w*[i] is the weight that\
    \ determines the contribution of input *x*[i] to the neuron output\n\n*w*[0] is\
    \ the threshold that the weighted combination of inputs (*w*[1]*x*[1] + ⋯ + *w*[n]*x*[n])\
    \ must exceed to activate the neuron.\n\nThe learning of neuron involves estimating\
    \ the values of the weights *w*[0], *w*[1], …, *w*[n].\n\n#### [2.3.2.3 Networks](#C02a_toc.xhtml#rsec2_3_2_3)\n\
    \nA neural network composes multiple neurons into a single function, and there\
    \ are many different algorithms that can perform this job. Some of the neurons\
    \ in a neural network use the vector of feature values as input, others use the\
    \ output from some neurons as input, and yet others use a combination of the two.\
    \ The parameters of a neural network include the parameters of the neurons *g*\
    \ and $\\\\overset{\\\\rightarrow}{w}$ , the way in which the neurons are connected,\
    \ and the parameters of an output layer of linear functions. Neurons are typically\
    \ arranged in layers according to what kind of input they receive. At the input\
    \ layer, neurons receive feature vectors as input, and in subsequent layers, neurons\
    \ receive outputs from previous layers as inputs. The layers other than the input\
    \ and output are called hidden layers of neurons.\n\nAn example of a neural network\
    \ is shown in [Figure 2.2](#C08_chapter2.xhtml#fig2_2). This neural network has\
    \ an output layer of *m* linear functions, *F*[1], …, *F*[m], and a single hidden\
    \ layer of *k* neurons, *Z*[1], …, *Z*[k]. Each neuron in the hidden layer receives\
    \ as input the feature vector $\\\\overset{\\\\rightarrow}{x} = \\\\left( {x\\\
    _{1},\\\\ldots,x\\_{n}} \\\\right)$. The linear functions in the output layer\
    \ receive as input the vector of values of the hidden neurons, $\\\\overset{\\\
    \\rightarrow}{Z} = \\\\left( {Z\\_{1},\\\\ldots,Z\\_{k}} \\\\right)$.\n\n![FIGURE\
    \ 2.2 Neural network.](images/file3.jpg)\n\n**FIGURE 2.2**  \n\nNeural network.\n\
    \n### [2.3.3 R for Neural Networks](#C02a_toc.xhtml#rsec2_3_3)\n\nThe package\
    \ “neuralnet” developed by the team of Stefan Fritsch, Frauke Guenther, Marvin\
    \ N. Wright, Marc Suling, and Sebastian M. Mueller contains the function neuralnet\
    \ that implements several algorithms of training of neural networks such as backpropagation\
    \ (Riedmiller, 1994), resilient backpropagation with or without weight backtracking,\
    \ or the modified globally convergent version by Anastasiadis et al. (2005) and\
    \ Taylor (2006).\n\nThis function is very popular among researchers; however,\
    \ the usage of this function is not always correct. The biggest challenge of using\
    \ this function is to assign values to its arguments. [Table 2.2](#C08_chapter2.xhtml#tab2_2)\
    \ describes the 19 arguments of the neuralnet function.\n\n**TABLE 2.2**  \n\n\
    Arguments of the “neuralnet” Function\n\n|  || Argument || Description |\n\n|\
    \ --- | --- | --- |\n\n| 1 || formula || a symbolic description of the model to\
    \ be fitted |\n\n| --- | --- | --- |\n\n| 2 || data || a data frame containing\
    \ the variables specified in the formula |\n\n| 3 || hidden || a vector of integers\
    \ specifying the number of hidden neurons in each layer |\n\n| 4 || threshold\
    \ || a numeric value specifying the threshold for the partial derivatives of the\
    \ error function as stopping criteria |\n\n| 5 || stepmax || the maximum steps\
    \ for the training of the neural network |\n\n| 6 || rep || the number of repetitions\
    \ for the neural network’s training |\n\n| 7 || startweights || a vector containing\
    \ starting values for the weights |\n\n| 8 || learningrate.limit || a vector or\
    \ a list containing the lowest and highest limit for the learning rate (for RPROP\
    \ and GRPROP) |\n\n| 9 || learningrate.factor || a vector or a list containing\
    \ the multiplication factors for the upper and lower learning rate (for RPROP\
    \ and GRPROP) |\n\n| 10 || learningrate || a numeric value specifying the learning\
    \ rate (for traditional backpropagation) |\n\n| 11 || lifesign || a string specifying\
    \ how much the function will print during the calculation of the neural network\
    \ (“none,” “minimal,” or “full”) |\n\n| 12 || lifesign.step || an integer specifying\
    \ the step size to print the minimal threshold in “full” lifesign mode |\n\n|\
    \ 13 || algorithm || a string containing the algorithm type to calculate the neural\
    \ network |\n\n| 14 || err.fct || a differentiable function that is used for the\
    \ calculation of the error, or “sse” for the sum of squared errors, or “ce” for\
    \ the cross-entropy |\n\n| 15 || act.fct || a differentiable function that is\
    \ used for smoothing the result of the cross-product of the covariate or neurons\
    \ and the weights, or “logistic” for the logistic function, or “tanh” for a hyperbolic\
    \ tangent |\n\n| 16 || linear.output || If act.fct should not be applied to the\
    \ output neurons, set linear output to TRUE, otherwise to FALSE |\n\n| 17 || exclude\
    \ || a vector or a matrix specifying the weights that are excluded from the calculation\
    \ |\n\n| 18 || constant.weights || a vector specifying the values of the weights\
    \ that are excluded from the training process and treated as fix |\n\n| 19 ||\
    \ likelihood || If the error function is equal to the negative log-likelihood\
    \ function, the information criteria AIC and BIC will be calculated. |"
