    \ 语句中使用 `LEVERAGE(MCDINFO)` 选项。\n\n```\nproc robustreg data=X method=lts;\n  \
    \ model y = x1 - x18 / leverage(MCDInfo);\n   output out = x_output leverage =\
    \ leverage;\nrun;\n```\n\n`x_output` 数据集将包含原始 `X` 数据集中所有的变量，以及值为 0 和 1 的 `leverage`\
    \ 指示变量。当 `leverage` 变量等于 1 时，它标记了那些远离解释变量中心的观测值。它们是 `X` 变量空间中的多变量“离群值”。\n\n需要注意的是，`PROC\
    \ ROBUSTREG` 在计算估计时会剔除带有缺失值的观测值。如果倾向于对缺失值的不同处理（例如某种类型的插补），则应在应用 `PROC ROBUSTREG`\
    \ 处理数据之前完成。\n\n## 4.3 偏误减少\n\n使用上述方法移除离群值的数据集将作为进一步数据清洗过程的输入。清洗过程下一阶段的主要目标是识别是否存在偏差，并消除导致该偏差的观测值。我们提议使用自助法（bootstrap\
    \ approach）来确定偏差（见 3.2.3 偏误减少）。对于数据集中的每个变量，该方法的工作如下：\n\n1. 从数据集中有放地的采样一个子集。子集的大小可以与原始数据集相同，或者在使用\
    \ `m-out-of-n` 自助法时较小（见 3.3 m-out-of-n 自助法）。\n2. 计算感兴趣的估计值（样本均值 `μ̂` 或中位数 `m̂`）\n\
    3. 执行步骤 (1) 和 (2) `n` 次，其中 `n` 最大可达 1,000。这将创建 `n` 次自助估计，例如 `m̂[1]`, …, `m̂[n]`\n\
    4. 计算 `n` 次自助估计的均值\n5. 使用原始数据集计算的估计值与 `n` 次自助估计的均值之间的差异为偏误 `B̂` 的自助估计：\n   $\\\
    hat{B} = \\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{{\\hat{m}}\\_{i}}}$\n6. 为了纠正偏差，从使用原始数据集计算的估计值减去\
    \ `n` 次自助估计的均值。如果感兴趣的估计是中位数，则偏误修正估计将为：\n   ${\\hat{m}}^* = \\hat{m} - \\left(\\\
    frac{1}{n}{\\sum\\limits_{i = 1}^{n}{{\\hat{m}}\\}_{i}}\\right)$\n   这等同于：\n \
    \  ${\\hat{m}}^* = 2\\hat{m} - \\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{{\\hat{m}}\
    \ \n\n如果存在偏误，产生偏误的观测值应从数据集中移除。可以通过基于偏误修正估计 `m̂` 或 `μ̂` 计算相应的置信区间来完成。位于置信区间之外的变量值从数据集中移除。这一过程可以在\
    \ R 或 SAS 中轻松完成。\n\n## 4.4 总结\n\n在本章中，我们讨论了为了机器学习而清洗数据的重要性。具体而言，我们概述了处理多维离群值和偏误的两个重要步骤。可能包括排除错误值或对缺失值的处理。\n\
    \n## 4.5 参考文献\n\n1. Boudt, K., Rousseeuw, P., Vanduffel, S., and Verdonck, T.\
    \ 2018. The minimum regularized covariance determinant estimator. 10.2139/ssrn.2905259.\n\
    2. Butler, R. W., Davies, P. L., and Jhun, M. 1993. Asymptotics for the minimum\
    \ covariance determinant estimator. *Annals of Statistics*, 21 (3): 1385–1400.\n\
    3. Donoho, D. L. 1982. *Breakdown Properties of Multivariate Location Estimators*.\
    \ Ph.D. qualifying paper. Department of Statistics, Harvard University.\n4. Donoho,\
    \ D. L., and Gasko, M. 1992. Breakdown properties of location estimates based\
    \ on halfspace depth and projected outlyingness. *The Annals of Statistics*, 20\
    \ (4): 1803–1827.\n5. Rousseeuw, P. 1985. Multivariate estimation with high breakdown\
    \ point. *Mathematical Statistics and Applications*, 8 (283–297): 37.\n6. Rousseeuw,\
    \ P., and Van Driessen, K. 1999. A fast algorithm for the minimum covariance determinant\
    \ estimator. *Technometrics*, 41 (3): 212–223.\n\n# 5 实验设计及其在 SAS 和 R 中的部署\n\n\
    ## 5.1 引言\n\n分类的机器学习过程取决于多个条件，选择这些条件以获得最佳结果是一个巨大的挑战。\n\n当我们拥有每个观测值都分配了标签（输出）的数据集时，就开始构建分类器。我们通常遇到的第一个问题是使用哪些特征。\n\
