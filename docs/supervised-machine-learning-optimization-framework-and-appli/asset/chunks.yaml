    # [Authors]


    **Tanya Kolosova** is a statistician, software engineer, educator, and co-author
    of two books on statistical analysis and metadata-based development using SAS.
    She is an actionable analytics expert and has extensive knowledge of software
    development methods, technologies, artificial intelligence methods, and algorithms.


    **Samuel Berestizhevsky** is a statistician, researcher, and software engineer.
    Together with Tanya, Samuel co-authored two books on statistical analysis and
    metadata-based development using SAS. Samuel is an innovator and expert in the
    area of automated actionable analytics and artificial intelligence solutions,
    and software development methods.


    # [Introduction: Challenges in the Application of Machine Learning Classification
    Methods]


    According to Bishop (2006), machine learning (`ML`) is a scientific study of statistical
    models and algorithms to help a computing system accomplish a specific task without
    using explicit instructions, but relying on patterns and inference instead. `ML`
    is a subset of artificial intelligence technology. It automatically learns and
    improves the performance with the pace of time, interactions, and experiences.
    Building initial machine learning models, or classifiers, is an iterative process,
    where we start with initial hypotheses about which data can be useful and how
    to structure different sets of features, which machine learning methods can learn
    better from our data, and how to `tune` multiple hyperparameters to achieve robust
    classification results. The machine learning development process becomes a nightmare
    if it does not use a framework for easy, reliable, meaningful, verifiable, and
    reproducible development.


    Reproducibility is the ability to reproduce the analyses.


    Comparability is the ability to compare results produced by different modeling
    approaches.

