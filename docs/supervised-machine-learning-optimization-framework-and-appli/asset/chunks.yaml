    There are no recipes on how to choose values for the attributes required to train
    the neural network. For the argument `formula`, the decision about what features
    to include in the model should be made. This problem by itself presents a significant
    challenge and is addressed in an extensive number of researches and publications.
    But whatever the approach the reader uses to choose features, this choice is confounded
    with the rest of the arguments of the function. For example, how to define the
    value of the argument `hidden`: what is the needed number of hidden layers and
    the number of neurons in each layer? We can be sure that for a different set of
    features the answer will be different.


    The choice of the one out of four available in the `neuralnet` function algorithms
    to be used for the neural network training is also difficult. Although we know
    how the algorithms work, the characteristics of the data we use to train the neural
    network are unknown in most cases. But then, even if we make some decision about
    the algorithm, how to choose the values for the attributes reflecting learning
    rate (`learningrate.limit`, `learningrate.factor`, `learningrate`)?


    And if this is not enough, we must now decide about the forms of the loss function
    (`err.fct`) and the activation function (`act.fct`).


    ## 2.4 Support Vector Machine


    ### 2.4.1 Introduction


    Support vector machine (SVM) is a proven classification method that directly minimizes
    the classification error without requiring a statistical model. SVM can handle
    the massive feature space, and it is guaranteed to find a globally optimal separating
    hyperplane if it exists. Also, SVM classifiers are built on the boundary cases,
    which allow them to handle missing data. An SVM classifier can separate data that
    is not easily separable in the original space (for example, two-dimensional space)
    by mapping data into a higher-dimensional (transformed) space. Simply saying,
    a nonlinear classifier maps our data from the input space `X` to a feature space
    `F` using a nonlinear function `Φ`:`X→F`. In the space `F`, the discriminant function
    is as follows:


    $f(x) = w^{(T)}\Phi(x) + b \quad (2.8)$


    ### 2.4.2 Kernel


    Kernel methods resolve the issue of mapping the data to a high-dimensional feature
    space. Suppose the weight vector can be expressed as a linear combination of the
    training examples:


    $w = \sum_{i = 1}^{n}\alpha_{i}x_{i} \quad (2.9)$


    Then


    $f(x) = \sum_{i = 1}^{n}\alpha_{i}x_{i}^{T}x + b \quad (2.10)$


    In the feature space `F`, this expression takes the form:


    $f(x) = \sum_{i = 1}^{n}\alpha_{i}\Phi(x_{i})^{T}\Phi(x) + b \quad (2.11)$


    The feature space `F` may be high-dimensional, making this transformation difficult,
    unless the kernel function is defined in the form that can be computed efficiently:


    $K(x,x'') = \Phi(x)^{(T)}\Phi(x'') \quad (2.12)$


    In terms of the kernel function, the discriminant function can be written as:


    $f(x) = \sum_{i = 1}^{n}\alpha_{i}K(x,x'') + b \quad (2.13)$


    There are different kernel functions. For example, the polynomial kernel of degree
    `d` is defined as:


    $K(x,x'') = (x^{(T)}x''+1)^{(d)} \quad (2.14)$


    The feature space for this kernel consists of all monomials up to degree `d`,
    for example:


    $x_{1}^{d_{1}}x_{2}^{d_{2}}\ldots x_{m}^{d_{m}},\text{where}{\sum_{i = 1}^{m}{d_{i}
    \leq d}} \quad (2.15)$


    The increasing degree of the polynomial `d` leads to the increased flexibility
    of the classifier.


    The other widely used kernel is the Gaussian (radial basis function) kernel defined
    by:


    $K(x,x'') = \exp(-\gamma\|x-x''\|^2) \quad (2.16)$


    where `γ` > 0 is a parameter that controls the width of Gaussian. It plays a similar
    role as the degree of the polynomial kernel in controlling the flexibility of
    the resulting classifier.


    Hyperbolic tangent, also known as the sigmoid, is yet popular kernel. It is defined
    by:


    $K(x,x'') = \tanh(\alpha x^{(T)}x''+b) \quad (2.17)$


    where `α` is the slope and `b` is the intercept.


    ### 2.4.3 Margin


    The bias–variance problem is the conflict in trying to simultaneously minimize
    these two sources of error. SVM uses a kernel function to find a hyperplane that
    maximizes the distance between two classes.


    ### 2.4.4 Optimization


    The soft-margin optimization problem (Cortes and Vapnik, 1995) is formulated as
    follows:


    $\begin{array}{l} \text{minimize on }w,b:\frac{1}{2}\|w\|^2 + C\sum_{i = 1}^{n}e_{i}
    \\ \text{subject to}:y_{i}(w^{T}x_{i} + b) \geq 1 - e_{i},e_{i} \geq 0,i =1,\ldots,n
    \end{array} \quad (2.19)$


    where:


    *   `w` is the margin,

    *   `C` is the constant that sets the relative importance of maximizing the margin
    and minimizing the amount of slack,

    *   `e[i]` is the slack variables that allow a case to be in the margin (0 ≤ `e[i]`
    ≤ 1, also called a margin error) or be misclassified (`e[i]` > 1),

    *   `y[i]` – the output results of the training dataset, also called labels,

    *   `b` is the bias that translates the hyperplane away from the origin.


    ### 2.4.5 Bias–Variance Trade-off and SVM Hyperparameters


    The bias is an error caused by wrong assumptions in the learning algorithm. High
    bias means an underfitting between features and outputs. The variance is an error
    produced from variations in the sensitivity metric in response to small fluctuations
    in the training sets. High variance means overfitting between features and outputs.


    The bias–variance trade-off is a central problem in supervised learning. In statistics
    and machine learning, the bias–variance trade-off is the property of a set of
    predictive models, where models with lower bias in parameter estimation have a
    higher variance of the parameter estimates across samples and vice versa. The
    bias–variance problem is the conflict in trying to simultaneously minimize these
    two sources of error that prevent supervised learning algorithms like SVM from
    generalizing beyond their training sets.


    The quality of the results produced by SVM depends on the following hyperparameters:


    *   The type of kernel (radial, polynomial, sigmoid, etc.).


    *   The cost of misclassification (penalty) that is denoted as `C` in equation
    (2.19).

    '
