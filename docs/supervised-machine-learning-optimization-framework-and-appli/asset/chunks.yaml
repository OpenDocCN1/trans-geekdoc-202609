    每月平均申请数量分布显示出季节性，其中 3 月和 10 月的申请数量有所增加，而 12 月份大幅下降（图 10.1）。在提交过程中识别这种季节性，有助于为核保人创建平衡的工作负载。


    ![FIGURE 10.1 每月提交申请平均数量。](img/file10.jpg)


    **图 10.1**


    每月提交申请平均数量。


    每个工作日平均申请数量分布显示，周一的申请数量略低（图 10.2）。


    ![FIGURE 10.2 每个工作日提交申请平均数量。](img/file11.jpg)


    **图 10.2**


    每个工作日提交申请平均数量。


    分析表明，申请流在月份和工作日之间存在波动，这些波动是容易管理的。然而，如图 10.3 所示，核保人的工作负载远非平衡。这使得对核保人绩效的分析变得更加复杂。


    ![FIGURE 10.3 每位核保人每月平均分配申请。](img/file12.jpg)


    **图 10.3**


    每位核保人每月平均分配申请。


    一方面，向表现较好的核保人分配更多申请是合理的。但另一方面，较少的申请可能让核保人能够更全面地分析情况，与客户/潜在客户进行更深入的谈判——结果是表现出更好的绩效。我们将进一步讨论这一假设。


    ### 10.2.2.3. 每位核保人的动态转化率


    在 44 个月的观察期内，计算了每位核保人的动态转化率 `DCR[mi]`。平均动态转化率在 0.12 以上的优秀核保人约占所有核保人的 8%。如图 10.4
    所示，顶尖表现者的动态转化率显著高于其他核保人。


    ![FIGURE 10.4 两组核保人之间动态转化率（移动转化率）的比较。](img/file13.jpg)


    **图 10.4**


    两组核保人之间动态转化率（移动转化率）的比较。


    我们分析了分配给核保人的申请数量与其`DCR[mi]`衡量的绩效之间的关系。对于顶尖表现者，每位核保人每月平均分配申请数为 13 个（中位数为 12）。对于其他核保人，每位核保人每月平均分配申请数为
    10（中位数为 8）。我们使用 Kolmogorov–Smirnov 双样本检验，对顶尖表现者组与其余核保人组之间每位核保人每月分配申请数量的经验分布进行了比较。Kolmogorov–Smirnov
    检验的渐近 p 值为 `<.0001`。这表明我们应该拒绝“每月分配申请数量分布相同”的原假设。


    ### 10.2.2.4. 每位核保人的交易达成时间


    在 44 个月的观察期内，计算了每位核保人的动态转化率 `DCR[mi]`。平均动态转化率在 0.12 以上的优秀核保人约占所有核保人的 8%。如图 10.4
    所示，顶尖表现者的动态转化率显著高于其他核保人。


    我们分析了分配给核保人的申请数量与其`DCR[mi]`衡量的绩效之间的关系。对于顶尖表现者，每位核保人每月平均分配申请数为 13 个（中位数为 12）。对于其他核保人，每位核保人每月平均分配申请数为
    10（中位数为 8）。我们使用 Kolmogorov–Smirnov 双样本检验，对顶尖表现者组与其余核保人组之间每位核保人每月分配申请数量的经验分布进行了比较。Kolmogorov–Smirnov
    检验的渐近 p 值为 `<.0001`。这表明我们应该拒绝“每月分配申请数量分布相同”的原假设。


    ### 10.3. 知识传递的传统方法


    提高质量和一致性是保险公司持续努力的方向。多年来，明智的核保决策被认为是判断、经验和“直觉”的结果。新核保人获得“判断”的唯一途径是在资深核保人的指导下工作（Randall,
    1994）。


    验证绩效的传统方法包括档案审查或审计以及一致性检查。审计过程通常由六个步骤组成：


    1. 收集申请人的风险暴露和危险因素数据。

    2. 评估风险和危险因素。

    3. 开发并评估核保方案。

    4. 选择核保方案，包括选择保费。

    5. 执行核保决策。

    6. 监控损失敞口。


    这种审计可能会识别核保流程中的缺陷，并为额外的指导和质量改进提供依据。然而，此过程中的每一步都是主观且定性验证的，并基于两个假设。第一个假设是存在适当指南，这些指南通常更新频率较低，并随着时间的推移而过时。第二个假设是存在成熟的管理流程，其中分配给核保人的申请是平衡的，问题的识别和干预是及时的。


    遗憾的是，在当今动态、大规模且创新的环境中，这些假设往往不再成立。此外，对核保人日益增长的需求要求培训是高效、一致且快速的。


    ### 10.4. 人工智能解决方案的解析


    核保决策过程包括以下组件：


    *   核保人，负责处理保险申请（在我们的示例中，是工人赔险险种）

    *   各客户/潜在客户提交的保险申请，并附带业务不同特征的描述，包括业务规模和营业额

    *   保险公司提供的工人赔险保险产品，以及其条款、保费金额、限制条件等

    *   客户/潜在客户对核保人报价的响应：接受或拒绝拟议的保险方案


