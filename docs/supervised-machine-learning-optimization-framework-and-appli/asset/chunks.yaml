    \n## [8.4 Summary](#C02a_toc.xhtml#rsec8_4)\n\nThis chapter described a data dictionary\
    \ for design of experiments for machine learning component of the AI framework.\
    \ The main goal of this data dictionary is to ensure reproducibility and comparability\
    \ of computer-based experiments that result in delivering maximum values of quality\
    \ metrics of results of application of machine learning method conditionally on\
    \ values for hyperparameters for the specified machine learning method. These\
    \ values of hyperparameters can be defined as optimal. This chapter described\
    \ tables comprising the data dictionary as well as showed relationships among\
    \ the tables. These relationships outline the process of selection of features\
    \ set, creating design of experiment using hyperparameters as factors with discrete\
    \ levels (groups of aggregated values of these parameters from minimum to maximum\
    \ values they can get), metrics that can be used to assess the quality of results\
    \ of machine learning method applied to a specified features set and combination\
    \ of levels of hyperparameters. This data dictionary is flexible enough to be\
    \ extended by the reader.\n\n## [Reference](#C02a_toc.xhtml#rreference-1)\n\n\
    1.  Kolosova, T., and Berestizhevsky, S. 1995. *Table-Driven Strategies for Rapid\
    \ SAS Applications Development*. Cary, NC: SAS Institute, Inc.\n\n# [9](#C02a_toc.xhtml#rchapter9)\n\
    \n[“Contaminated” Training Datasets Component](#C02a_toc.xhtml#rchapter9)\n\n\
    Support vector machine (SVM) is a highly developed classification method that\
    \ is widely used in real-world applications; however, SVM has drawbacks. The important\
    \ feature of the SVM is that the separating hyperplane is determined mainly from\
    \ misclassified cases. The last means that the most misclassified cases significantly\
    \ affect the quality of the classifier, and meaning of that is the SVM with optimal\
    \ hyperparameters identified on “clean” training datasets is extremely fragile\
    \ to the presence of outliers; for example, some of the labels of training datasets\
    \ are corrupted. In this chapter, we describe an approach to test the robustness\
    \ of the classifier and identify the fixed proportion of data with “label contamination”\
    \ (“label flipping” or “label corruption”) in training datasets, in which the\
    \ classifier with newly identified optimal hyperparameters still provides useful\
    \ classification results. It appears that “label contamination” of training datasets\
    \ helps to create the classifier that performs sufficiently well when it classifies\
    \ unseen data.\n\nIn order to find optimal hyperparameters for supervised machine\
    \ learning in the case of a fixed proportion of “label contamination,” statistically\
    \ designed experiments should be defined and conducted. That said, the research\
    \ of theoretical methods for identifying an optimal fixed proportion of “label\
    \ contamination” that would not impact severely the quality of classifiers would\
    \ be an interesting issue for future work.\n\n## [9.1 Data Dictionary](#C02a_toc.xhtml#rsec9_1)\n\
    \nIn order to find optimal hyperparameters for classifiers trained on “contaminated”\
    \ datasets, multiple experiments should be conducted by data scientists. These\
    \ experiments may answer the questions which class of kernel transformation to\
    \ use, what features (data variables) to include, what values for hyperparameters\
    \ to use, etc. Without a standardized way of managing the results of multiple\
    \ experiments with the machine learning method applied with different kernels,\
    \ features, and hyperparameters, it will be virtually impossible to reproduce\
    \ or compare results of experiments. To achieve comparability and reproducibility\
    \ of experiments, the definitions of such experiments should be stored as metadata\
    \ in a specially structured data dictionary (Kolosova and Berestizhevsky, 1995).\n\
    \nThere are four tables that comprise the Contaminated Training Datasets component\
    \ data dictionary. They are Contamination, Cont\\_Experiment, Cont\\_Results,\
    \ and Cont\\_Metric. Relations among tables of the data dictionary are presented\
    \ in [Figure 9.1](#C15_chapter9.xhtml#fig9_1)."
