    \ space. Platt (1999) proposed transforming the outputs of a classification model\
    \ into a probability distribution over classes by fitting a logistic regression\
    \ model to a classifier’s output (see also Lin et al., 2007 and Murphy, 2012).\n\
    \nIn this book, we propose applying Firth’s penalized logistic regression to SVM\
    \ output (Heinze, 2001). In other words, we first train an SVM and then estimate\
    \ Firth’s penalized logistic regression to map the SVM outputs into probabilities.\
    \ The benefit of using penalized logistic regression to SVM output is the results\
