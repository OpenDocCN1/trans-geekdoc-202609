    # [3](#C02a_toc.xhtml#rchapter3)


    [Bootstrap Methods and Their Deployment in SAS and R](#C02a_toc.xhtml#rchapter3)


    ## [3.1 Introduction](#C02a_toc.xhtml#rsec3_1)


    The bootstrap is a resampling procedure used to estimate statistics on a population
    by sampling the original dataset. This method substitutes complicated and often
    inaccurate approximations of biases, variances, and other measures of uncertainty
    by computer simulations. In simple situations, the uncertainty of an estimate
    may be gauged by analytical calculations based on an assumed probability model
    for the available data. But in more complicated cases, this approach can be tedious
    and difficult, and its results are potentially misleading if inappropriate assumptions
    or simplifications have been made.

