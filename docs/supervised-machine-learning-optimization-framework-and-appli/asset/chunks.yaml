  trans: "\n第一步，我们创建了一个统计设计的全因子实验，以寻找 SVM 的最优超参数：核转换函数（径向核、多项式核和 sigmoid 核类型）、核超参数\
    \ `d` 或 `γ`，以及算法超参数——C。对于连续值 `C` 以及超参数 `d` 或 `γ`，我们将这些值聚类到多个组中。可以使用 `FACTEX` 过程来创建一个全因子实验。例如，如果我们决定为\
    \ `C` 和 `γ` 超参数创建六组值，那么我们的全因子设计将包含 3¹\\*6²℄=℄108 组合（运行）。\n\n## 第 2 步\n\n对于全因子设计中提出的每种组合，我们按照如下方式执行\
    \ SAS 的 `HPSVM` 过程：\n\n```sas\n%macro SVM (data=training_set, c=100, gamma=2,\
    \ kernel = rbf, input_app = num_emp pct_under_21 pct_over_50 claims, input_prod\
    \ = deduct premium output = output, target=outcome);\n    PROC HPSVM DATA = &data\n\
    \      C = &c /* the penalty value */\n      MAXITER=10000 /* the maximum number\
    \ of iterations */\n      INPUT &input_app &input_prod / LEVEL=INTERVAL;\n   \
    \   KERNEL &kernel\n      %if %trim(%left(&kernel)) = rbf or\n          %trim(%left(&kernel))\
    \ = sigmoid %then\n          %do;\n            / k_par = &gamma;\n          %end;\n\
    \      OUTPUT &output;\n      TARGET &target;\n    run;\n%mend SVM;\n```\n\n作为最终分类器，我们选择在应用于训练数据集时使敏感性（正确分类的已绑定申请比例）和特异性（正确分类的被拒绝报价比例）最大的那一个。\n\
    \n## 第 3 步\n\n下一步，为了给 SVM 结果增加概率元素，我们对 SVM 算法的结果应用了 Firth 惩罚逻辑回归（Firth, 1993）。`SVM`\
    \ 会产生完全分离数据。Firth 惩罚似然法是处理可分性问题的方法。Firth 方法在 `LOGISTIC` 过程中可用，且仅适用于二分类逻辑模型。它替换了通常的评分方程：\n\
    \n$g\\left( \\beta\\_{j} \\right) = \\sum\\limits\\_{i = 1}^{n}\\left( {y\\_{i}\
    \ - \\pi\\_{i}} \\right)x\\_{ij} = 0\\left( {j = 1,\\ldots,p} \\right)$ \n\n其中\
    \ `p` 是模型中的参数数量，修改后的评分方程为：\n\n$g\\left( \\beta\\_{j} \\right) = \\sum\\limits\\\
    _{i = 1}^{n}\\left( {y\\_{i} - \\pi\\_{i}} + h\\_{i}\\left( {0.5 - \\pi\\_{i}}\
    \ \\right) \\right)x\\_{ij} = 0\\left( {j = 1,\\ldots,p} \\right)$\n\n其中 `h[i]`\
    \ 是帽矩阵（hat matrix）的第 `i` 个对角线元素：\n\n$g\\left( \\beta\\_{j} \\right) = \\sum\\\
    limits\\_{i = 1}^{n}\\left( {y\\_{i} - \\pi\\_{i}} + h\\_{i}\\left( {0.5 - \\\
    pi\\_{i}} \\right) \\right)x\\_{ij} = 0\\left( {j = 1,\\ldots,p} \\right)$ $W^{\\\
    frac{1}{2}}\\left( {X^{\\prime}W} \\right)^{- 1}X^{\\prime}W^{\\frac{1}{2}}$ 下面的\
    \ SAS 代码实现了带有 Firth 偏偏正的逻辑回归：\n\n```sas\nPROC LOGISTIC data = SVM_Decision ;\n\
    \    CLASS Outcome ;\n    MODEL Outcome (event='1') = Decision / FIRTH ;\nRUN\
    \ ;\n```\n\n由于逻辑回归的结果是概率，我们选择了一个截断或阈值值来分类案例。高于此阈值的概率被分类为 1，低于此阈值的分类为 0。对于由 Firth\
    \ 惩罚逻辑回归生成的概率，我们寻找这样一个阈值值，以进一步提高 `SVM` 产生结果的敏感性和特异性。\n\n我们对 2,000 个训练数据集中的每一个都进行分析。作为最终分类器，我们选择了一个基于\
    \ Firth 惩罚逻辑回归调整的 `SVM` 分类器，它平均产生产生更高的敏感性和特异性指标。\n\n在应用不同的内核类型和各种 SVM 超参数（根据上述描述的全因子设计）后，最佳出现在具有代价参数\
    \ `C`∈[1000;3000] 和 `γ`∈[0.2;0.6] 的径向内核。分类结果的敏感性平均等于 0.987，特异性平均等于 0.799。\n\n\
    然后，我们根据 Firth 惩罚逻辑回归的结果确定了一个改进分类的阈值。用于分类结果的 0.76 阈值值将特异性平均提高到 0.847 的水平，代价是敏感性的轻微损失——敏感性平均变为等于\
    \ 0.973。\n\n### 10.4.5 训练数据集的“污染”\n\n现在，我们处理由于训练数据集微小波动引起的敏感性指标方差。为了避免特征和输出之间导致过拟合的高方差，我们对训练数据集进行“污染”。“污染”是通过更改训练集中一小部分比例标签来实现的，这是根据混合实验的设计计划。在混合实验中，我们改变比例，正如我们的示例所示——不同结果的比例。混合实验设计的细节不在本书的范围内，我们只说明这种方法允许对数据进行“污染”。按照设计对训练数据集进行污染后，我们再次执行第\
    \ 1–3 步，其中具有代价参数 `C`∈[1000;3000] 和 `γ`∈[0.2;0.6] 的径向内核作为过程的起点。结果是建立了一个稳健的分类器。将开发的分类器应用于测试数据集，我们得到了以下结果：特异性等于\
    \ 0.859，敏感性等于 0.851。\n\n### 10.4.6 实验结果\n\n为了测试解决方案的效率，我们使用了以下历史数据：\n\n1. 针对保险申请提供的保险产品属性/特征和价格；\n\
    2. 提供了保险产品的保险申请的属性/特征；\n3. 客户对保险产品的接受或拒绝数据。\n\n实验的数据选择方式使得所有报价都被客户/潜在客户拒绝了。换句话说，该数据样本的转化率为\
    \ 0%。\n\n实验的目标是应用开发的 AI 解决方案，寻找什么样的保险产品和价格能够符合保险申请，从而被客户/潜在客户接受。样本数据中的每个保险申请收到了一个保险产品的报价，少数情况下有两个报价。但在我们的实验中，每个申请都与所有可能的保险产品及其价格相结合。此类数据的示例如表\
    \ 10.3 所示，其中：\n\n* 灰色阴影行显示客户拒绝的保险申请和相关的保险产品，\n* 白色行显示所有其他可能提供的产品。\n\n**表 10.3**\n\
    不同产品报价的历史数据示例\n\n| 这些数据被用作 AI 解决方案的输入。表 10.3 中名为“分类结果 Yijk”的列包含了应用 AI 解决方案的结果。该列中的值\
    \ 1 识别出高概率被客户接受的产品。 识别出的相关保险产品和价格预计将导致 14.7% 的转化率。换句话说，实验识别出了最可能导致保险申请绑定的申请和产品。\
    \ |\n"
- fmt: "\nThe insurance industry still struggles with the pace of knowledge delivery\
    \ from experienced underwriters to young ones. The disadvantage of the currently\
    \ used methods, based on apprenticeship, is the subjectivity of underwriters’\
    \ decisions. Measurement of underwriters’ performance also suffers from lack of\
    \ efficiency, as existing metrics are delayed and not operational. We analyzed\
    \ underwriters’ performance metrics and proposed a novel one, `dynamic conversion\
    \ rate`, which allows measuring and monitoring the operational performance of\
    \ underwriters (weekly, monthly, etc.)\n\nThis chapter described the proposed\
    \ AI solution intended to improve the underwriting decision-making process. The\
    \ solution is based on the `SVM` machine learning method and its improvements.\
    \ Overall, with the reasonably efficient classifier built by `SVM`, and improved\
    \ with a threshold of `Firth’s penalized logistic regression`, satisfactory results\
    \ can be achieved. The chapter showed that if our AI solution would be used in\
    \ quoting insurance applications (in our study, workers’ compensation insurance),\
    \ then it could yield incremental improvement in application binding by 14.7%.\n\
    \n## References\n\n1. Bickel, P. J., and Ren, J. J. 1995. The ‘m Out of n’ bootstrap\
    \ and goodness of fit tests with double censored data. In *Robust Statistics,\
    \ Data Analysis and Computer Intensive Methods*, 35–47. New York, NY: Springer.\n\
    2. Chidambaran, N. K., Pugel, T. A., and Saunders, A. 1997. An investigation of\
    \ the performance of the U.S. property-liability insurance industry. *The Journal\
    \ of Risk and Insurance*, 64: 371–382.\n3. Cortes, C., and Vapnik, V. 1995. Support-vector\
    \ networks. *Machine Learning*, 20: 273–297.\n4. Firth, D. 1993. Bias reduction\
    \ of maximum likelihood estimates. *Biometrics*, 80 (1): 27–38.\n5. Kunreuther,\
    \ H., Meszaros, J., Hogarth, R. M., Spranca, M. 1995. Ambiguity and underwriter\
    \ decision processes. *Journal of Economic Behavior & Organization*, 26: 337–352.\n\
    6. Randall, E. D. 1994. *Introduction to Underwriting*. Insurance Institute of\
    \ America.\n\n# 11 Insurance Industry: Claims Modeling and Prediction\n\n## 11.1\
    \ Introduction\n\nClaim management requires applying statistical techniques in\
    \ the analysis and interpretation of the claims data. The central piece of claim\
    \ management is modeling and prediction. Two strategies are commonly used by insurers\
    \ to analyze claims: the two-part approach that decomposes claims cost into frequency\
    \ and severity components, and the pure premium approach that uses the `Tweedie\
    \ distribution`.\n\nIn this chapter, we provide a general framework to look into\
    \ the process of modeling and prediction of claims using the `Cox hazard model`.\
    \ The `Cox hazard model` is a standard tool in survival analysis for studying\
    \ the dependence of a hazard rate on covariates and time. Although the `Cox hazard\
    \ model` is very popular in statistics, in practice data is delayed and not operational.\n\
    \nThe term `survival data` represents the time until an event occurs. This event\
    \ could be a claim, a death, or any other occurrence of interest. In this chapter,\
    \ we focus on the time until a claim is filed. The hazard rate is the instantaneous\
    \ rate at which the event occurs at a given time.\n\nThe `Cox hazard model` breaks\
    \ down the hazard rate into a baseline hazard and a relative ratio. The baseline\
    \ hazard represents the risk when all covariates are zero. The relative ratio\
    \ represents the effect of each covariate on the hazard rate.\n\nThe `Cox hazard\
    \ model` is particularly useful because it does not require any assumptions about\
    \ the shape of the baseline hazard. This makes it a flexible and widely used tool\
    \ in many fields. In this chapter, we will explore how to apply the `Cox hazard\
    \ model` to claim data.\n\n## 11.2 Data\n\nTo apply the `Cox hazard model`, we\
    \ need data on the time to the event and the covariates for each individual. In\
    \ this study, we use a dataset of workers’ compensation insurance claims. The\
    \ event is the filing of a claim. The covariates include:\n\n* The type of claim\n\
    * The location of the policyholder\n* The industry of the policyholder\n* The\
    \ size of the policyholder\n* The claims history of the policyholder\n\n## 11.3\
    \ The Cox Model for Event Analysis\n\nSurvival function `S(t)` describes the probability\
    \ that an individual will survive beyond time `t`. \n\n`S(t) = P(T > t)`\n\nwhere:\n\
    \n* `T`—the time to the event\n* `t`—a specific point in time\n\nHazard function\
    \ `h(t)` describes the instantaneous rate at which the event occurs at time `t`:\n\
    \n`h(t) = lim_{Δ→0} P(t ≤ T < t + Δ | T ≥ t) / Δ`\n\nIn other words, `h(t)` at\
    \ time `t` specifies the instantaneous rate at which a claim happens, given that\
    \ it had not happened up to `t`. The hazard function is usually more informative\
    \ about the underlying mechanism than survival function.\n\nCox (1972) proposed\
    \ a model that does not require the assumption that times of events follow a certain\
    \ probability distribution. As a consequence, the Cox model is considerably robust.\n\
    \nThe Cox hazard model can be written as:\n\n`h_i(t) = h_0(t)exp(∑_{j=1}^{k} β_j\
    \ x_ij)`\n\nwhere:\n\n* `h_i(t)`—the hazard function for subject `i` at time `t`\n\
    * `h_0(t)`—the baseline hazard function, that is, the hazard function for the\
    \ subject whose covariates `x[1]`, …, `x[k]` all have values of 0.\n\nThe Cox\
    \ hazard model is also called the proportional hazard model if the hazard for\
    \ any subject is a fixed hazard ratio (HR) relative to any other subject:\n\n\
    `HR = h_i(t) / h_p(t) = (h_0(t)exp(∑_{j=1}^{k} β_j x_ij)) / (h_0(t)exp(∑_{j=1}^{k}\
    \ β_j x_pj))`\n"
