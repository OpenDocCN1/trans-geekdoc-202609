    ### 7.1.1.3 离群值检测表与偏差校正表


    `Outlier_Detection` 和 `Bias_Correction` 表定义了清洗方法及其参数。`Outlier_Detection` 表的列定义如
    [表 7.3] 所示。


    **表 7.3**


    Outlier_Detection 表的列


