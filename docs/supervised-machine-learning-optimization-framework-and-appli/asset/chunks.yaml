    # 10 Insurance Industry: Underwriters’ Decision-Making Process


    ## 10.1 Introduction


    Traditionally, underwriting decisions were considered the result of the judgment,
    experience, and “gut feelings.” Apprenticeship was a customary way for a new or
    young underwriter to gain the necessary experience. However, it took a long time
    for senior underwriters to pass their knowledge to a younger generation, who would
    then do the same.


    One approach to improve underwriting training was to analyze in detail the steps
    in the decision-making process and creating guidelines (Chidambaran et al., 1997).
    Thinking of underwriting as an application of the specific steps in the decisionmaking
    process clarified its nature but formed a rigid structure that lost the flexibility
    of experienced underwriters. Thus, the approach fell short of expectations. The
    industry still struggles with the pace of knowledge and experience delivery to
    the next generation.


    Also, insurers began to learn that experience is not necessarily the best or most
    efficient teacher—it is time-consuming and expensive, and subjective. Bad habits,
    as well as good habits, could be passed on through the apprentice system.


    The improvement of the decision-making process can be made through the following
    three steps:


    1. Identification of the best underwriters using various performance metrics

    2. Training AI algorithms utilizing the knowledge of the best-performing underwriters,
    and

    3. Deployment of AI solutions for automation of the decision-making process.


    ## 10.2 Review of Underwriters’ Performance


    In this section, we analyze the performance of underwriters using several existing
    metrics (Kunreuther et al., 1995) and a novel one proposed here. We briefly explain
    the characteristics of these metrics and then apply them to the real-life data
    provided by a workers’ compensation insurer.


    ### 10.2.1 Metrics of Underwriters’ Performance


    Different metrics can be used to evaluate underwriters’ performance, for example,
    hit ratio, conversion rate, and time-to-deal. We also propose a novel metric that
    can measure underwriters’ performance dynamically.


    ## Reference


    1. Kolosova, T., and Berestizsky, S. 1995. *Table-Driven Strategies for Rapid
    SAS Development*. Cary, NC: SAS Institute, Inc.

