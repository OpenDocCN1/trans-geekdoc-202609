    \ or sigmoid kernel transformations (equation 2.16) or `d` in the case of the\
    \ polynomial kernel (equations 2.14 and 2.15).\n\nA large `C` leads to low bias\
    \ and high variance, while a small `C` leads to high bias and low variance. A\
    \ large `d` or `γ` leads to high bias and small variance, while a small `d` or\
    \ `γ` leads to low bias and high variance. For example, if `γ` is large (variance\
    \ is small), it means that the SVM results do not have a wide influence and cannot\
    \ be generalized beyond its training datasets.\n\n### [2.4.6 R for SVM](#C02a_toc.xhtml#rsec2_4_6)\n\
    \nThe R package “e1071” was developed by a team of the Statistical Department\
    \ of Vienna University of Technology. This package contains, among others, `svm`\
    \ function having 22 arguments.\n\n**TABLE 2.3** \n\nArguments of the `svm` Function\n\
    \n|  || Argument || Description |\n| --- | --- | --- |\n| 1 || `formula` || a\
    \ symbolic description of the model to be fit |\n| --- | --- | --- |\n| 2 || `data`\
    \ || an optional data frame containing the variables in the model |\n| 3 || `x`\
    \ || a data matrix, a vector, or a sparse matrix |\n| 4 || `y` || a response vector\
    \ with one label for each row/component of `x` |\n| 5 || `scale` || A logical\
    \ vector indicating the variables to be scaled |\n| 6 || `type` || `svm` can be\
    \ used as a classification machine, as a regression machine, or for novelty detection\
    \ |\n| 7 || `kernel` || the kernel used in training and predicting |\n| 8 || `degree`\
    \ || the parameter needed for kernel of type polynomial |\n| 9 || `gamma` || the\
    \ parameter needed for all kernels except linear |\n| 10 || `coef0` || the parameter\
    \ needed for kernels of type polynomial and sigmoid |\n| 11 || `cost` || the cost\
    \ of constraints violation |\n| 12 || `nu` || the parameter needed for nu-classification,\
    \ nu-regression, and one-classification |\n| 13 || `class.weights` || a named\
    \ vector of weights for the different classes, used for asymmetric class sizes\
    \ |\n| 14 || `cachesize` || cache memory in MB (default 40) |\n| 15 || `tolerance`\
    \ || tolerance of termination criterion |\n| 16 || `epsilon` || epsilon in the\
    \ insensitive loss function |\n| 17 || `shrinking` || option whether to use the\
    \ shrinking heuristics |\n| 18 || `cross` || a k-fold cross-validation on the\
    \ training data |\n| 19 || `fitted` || logical indicating whether the fitted values\
    \ should be computed |\n| 20 || `probability` || logical indicating whether the\
    \ model should allow for probability predictions |\n| 21 || `subset` || An index\
    \ vector specifying the cases to be used in the training sample |\n| 22 || `na.action`\
    \ || A function to specify the action to be taken if NAs are found |\n\nAmong\
    \ these attributes, those of main interest for us relate to the specification\
    \ of kernels and their hyperparameters: `kernel`, `degree`, `gamma`, `coef0`,\
    \ and `cost`. `svm` function allows four kernels: linear, polynomial, Gaussian\
    \ (radial basis function), and hyperbolic tangent (sigmoid). Depending on the\
    \ choice of the kernel, the values of `degree`, `gamma`, and `coef0` should be\
    \ specified. Unfortunately, the selection of a kernel and the values of hyperparameters\
    \ very often is left as default, that is `kernel` = `radial`, `degree` = 3, `gamma`\
    \ = 1/data dimension, `coef0` = 0, and `cost` = 1. We wish the choice would be\
    \ that easy!\n\n## [2.5 SVM Modification Using Firth’s Regression](#C02a_toc.xhtml#rsec2_5)\n\
    \n### [2.5.1 Introduction](#C02a_toc.xhtml#rsec2_5_1)\n\nBecause SVM does not\
    \ model the data distribution, but instead directly minimizes the classification\
    \ error, the output produced by SVM is a binary decision. In other words, SVM\
    \ produces uncalibrated values that are not probabilities.\n\nConsider the problem\
    \ of binary classification: for inputs `x`, we want to determine whether they\
    \ belong to one of two classes `y`, labeled +1 and −1. We assume that the classification\
    \ problem will be solved by a real-valued function `f(x)`, by predicting a class\
    \ `y`. For many problems, it is convenient and even necessary to get a probability\
    \ `P(y = 1 | f(x))`. Although a binary decision is sufficient for many problems,\
    \ it is difficult to arrive at a probability. These concerns can be alleviated\
    \ by mapping the output of SVM to probabilities. There are multiple approaches\
    \ developed to address this. Vapnik suggested a method for mapping the output\
    \ to feature space. Platt proposed transforming the outputs into probabilities.\
    \ In this book, we propose applying Firth’s regression. The benefit of using logistic\
    \ regression is results made more generalizable.\n\n### [2.5.2 Logistic Regression](#C02a_toc.xhtml#rsec2_5_2)\n\
    \nLet us consider logistic regression for a binary dependent variable `y` and\
    \ vector of `x` with the corresponding vector of coefficients `β`:\n\n$P(y = 1\
    \ | x) = π = \\frac{1}{1 + \\exp(-xβ)}$\n\nwhere:\n\n`y` is the binary dependent\
    \ variable, `y = (y1, ..., yn)`, `x` is the vector of independent variables, `x\
    \ = (x1, ..., xk)`, `β` is the vector of coefficients, `β = (β1, ..., βk)`.\n\n\
    The log-likelihood for this model is the following:\n\n$\\ln L(β | y) = \\sum_{i=1}^{n}\
    \ \\{yi \\ln(\\frac{1}{1 + \\exp(-xiβ)}) + (1 - yi) \\ln(1 - \\frac{1}{1 + \\\
    exp(-xiβ)})\\}$\n\nThus, the score function looks like:\n\n$\\frac{\\partial\\\
    ln L(β | y)}{\\partial\\beta} = U(β) \\sum_{i=1}^{n} \\{yi \\ln(\\frac{1}{1 +\
    \ \\exp(-xiβ)}) + (1 - yi) \\ln(1 - \\frac{1}{1 + \\exp(-xiβ)})\\}$\n\nUsing standard\
    \ iterative methods (e.g., Newton–Raphson), we can find `β̂` by solving equation\
    \ (2.20) for `β`.\n"
