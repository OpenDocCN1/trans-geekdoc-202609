  trans: "\n为了估计 Cox 风险模型的系数，我们使用 SAS^®软件，特别是 `PHREG` 过程，该过程对生存数据进行分析。使用 `SAS PROC\
    \ PHREG` 通过贝叶斯方法对 Cox 风险模型的估计实现如下：\n\n```sas\nproc phreg data= CLAIMS_DATA_IL;\n\
    \    class CLIENT_INDUSTRY;\n    model TIME_TO_EVENT*CENSOR(0) = CLIENT_INDUSTRY\
    \ SEASON_EVENT;\n    SEASON_EVENT = SEASON*log(TIME_TO_EVENT);\n    bayes seed\
    \ = 1 outpost = POST;\nrun;\n```\n\n`CLAIMS_DATA_IL` 是一个 SAS 数据集，包含了伊利诺伊州的数据，例如行业以及从保单开始到理赔日期的时间间隔。`CLAIMS_DATA_IL`\
    \ 的行样本展示在表 11.2 中。\n\n**表 11.2**\n\n来自 CLAIMS_DATA_IL 数据集的选选行\n\n| CLIENT_INDUSTRY\
    \ | TIME_TO_EVENT | CENSOR | SEASON |\n| --- | --- | --- | --- |\n| Consulting\
    \ | 119 | 0 | 0 |\n| Consulting | 162 | 0 | 0 |\n| Consulting | 220 | 1 | 0 |\n\
    | Retail | 365 | 0 | 0 |\n| Retail | 237 | 1 | 0 |\n| Transportation | 95 | 1\
    \ | 0 |\n| Transportation | 108 | 1 | 1 |\n| Utilities | 7 | 1 | 0 |\n\n`CLIENT_INDUSTRY`\
    \ 列包含与理赔相关的行业名称。`TIME_TO_EVENT` 列包含到事件发生的天数，计算起始点为观察期开始或保单开始，以较者为准。`CENSOR` 列表示该事件是否为理赔（`CENSOR\
    \ = 1`），或该事件是否为保单结束（`CENSOR = 0`）。`SEASON` 列表示事件是否发生在冬季（`SEASON = 1`）或未发生在冬季（`SEASON\
    \ = 0`）。\n\n模型中包含两个协变量：`CLIENT_INDUSTRY` 和 `SEASON_EVENT`。`CLIENT_INDUSTRY` 是分类变量，因此在\
    \ `CLASS` 语句和 `MODEL` 语句中定义为协变量。`SEASON_EVENT` 是随时间变化的协变量，代表模型的以下部分：季节 × ln(t)。`SEASON_EVENT`\
    \ 定义在 `MODEL` 语句以及 `MODEL` 语句之后的表达式中：\n\n```sas\nclass CLIENT_INDUSTRY;\n    model\
    \ TIME_TO_EVENT*CENSOR(0) = CLIENT_INDUSTRY SEASON_EVENT;\n    SEASON_EVENT =\
    \ SEASON*log(TIME_TO_EVENT);\n```\n\n`BAYES` 语句请求通过 Gibbs 采样对模型进行贝叶斯分析。在 `BAYES`\
    \ 语句中，我们指定一个 `seed` 值作为常数，以便为相同的输入重现马尔可夫链。我们没有指定先验分布，因此应用了非信息先验分布。所描述的 `PHREG`\
    \ 过程产生了 `β` 和 `γ` 的估计。\n\n然而，当定义了随时间变化的协变量时，`PROC PHREG` 不产生基生存函数 `S0`。为了计算基生存函数，我们使用以下替代方案（Thomas\
    \ and Reyes, 2014）：\n\n```sas\ndata DS;\n    set CLAIMS_DATA_IL;\n    SEASON_EVENT\
    \ = SEASON*log(TIME_TO_EVENT);\nrun;\ndata INDUSTRY;\n    CLIENT_INDUSTRY = \"\
    Utilities\";\n    SEASON_EVENT = 0;\nrun;\nproc phreg data=DS;\n    class CLIENT_INDUSTRY;\n\
    \    model TIME_TO_EVENT *censor(0) = CLIENT_INDUSTRY SEASON_EVENT;\n    bayes\
    \ seed=1;\n    out = BASELINE survival = INDUSTRY;\nrun;\n```\n\n这一步产生了基生存函数 `S0`。\n\
    \n### 11.4.5 结果解释\n\n除公用事业外所有行业的 Cox 模型 `β` 系数估计展示在表 11.3 中。由于公用事业被用作风险的基准，因此公用事业的\
    \ `β` 系数等于 0。表 11.3 还包含 `SEASON_EVENT` 协变量的 `γ` 系数。\n\n**表 11.3**\n\n模型系数估计\n\n\
    | Industry | β 的均值估计 | Industry | β 的均值估计 |\n| --- | --- | --- | --- |\n| Consulting\
    \ | -2.282 | Manufacturing | -0.471 |\n| Entertainment | -0.508 | Retail | -0.523\
    \ |\n| Finance | -0.217 | Utilities | 0.000 |\n| Hospitality | -0.145 | SEASON_EVENT\
    \ | 0.277 |\n\n为了比较不同行业的理赔风险，我们为每个行业构建了生存函数，并设定 `season = 0`（图 11.3）。例如，根据公用事业行业的生存函数，在保单开始第\
    \ 100 天之前没有理赔的概率为 58%，在期保单内完全没有理赔的概率为 1%。\n\n生存函数允许估计并比较行业之间的理赔风险。例如，对于娱乐业，在保单开始第\
    \ 100 天之前没有理赔的概率为 72%，在期保单内完全没有理赔的概率为 6.5%。换句话说，伊利诺伊州的娱乐业在一年保单内没有理赔的概率比公用事业高出\
    \ 5.5%。此外，我们观察到娱乐业、制造业和零售业在伊利诺伊州的理赔风险非常相似。此外，有强证据表明咨询行业的风险显著低于其他行业。\n\n![图 11.3\
    \ 伊利诺伊州行业的生存函数。](img/file16.jpg)\n\n**图 11.3**\n\n伊利诺伊州行业的生存函数。\n\n图 11.4 中所示的风险函数显示时理赔率持续增加，在保单开始第\
    \ 280 天左右达到最高理赔率，然后略微下降。我们还可以观察到咨询业在保单期间的理赔率保持相对稳定且较低。图 11.4（以及图 11.6\n\n**图 11.4**\n\
    \n伊利诺伊州行业的风险函数。\n\n随时间变化的协变量 `SEASON_EVENT` 非常显著，`γ = 0.281`。这意味着在控制其他协变量的情况下，伊利诺伊州冬季的风险率高出\
    \ 32%：\n\n`exp(0.281) - 1 ≈ 0.32`\n\n特定保单的生存（事件时间）函数的估计应该考虑保单何时开始——以及在保单期间何时由于季节导致理赔概率增加。\n\
    \n当存在随时间变化的协变量时，生存函数的计算并不简单，因为我们需要精确指定特定保单何时开始，以及冬季相对于保单开始日期何时发生。作者开发了一个专用的计算机程序来计算每个行业带有随时间变化的协变量的\
    \ `Si`。\n\n下面我们比较了之前提到的两个例子：保单在 4 月 1 日开始和 8 月 1 日开始的情况。\n"
- fmt: '

    If a policy started on the 1st of April, then during time `t` ≤ 214 days (from
    the 1st of April till the 1st of November), `season` = 0. Then, for the duration
    of time `t` > 214 days till the end of the policy, `season` = 1. Thus, the survival
    function is calculated using hazard corresponding to `season = 0` for time-to-event
    `t` ≤ 214 days, and for time-to-event `t` > 214 days, it is calculated using hazard
    corresponding to `season = 1`. The survival function for this case is presented
    in [Figure 11.5](#C17_chapter11.xhtml#fig11_5).


    ![FIGURE 11.5 Survival functions of industries in Illinois for policies starting
    on April 1.](images/file18.jpg)


    **FIGURE 11.5**


    Survival functions of industries in Illinois for policies starting on April 1.


    In comparison with [Figure 11.3](#C17_chapter11.xhtml#fig11_3), where the winter
    season was not taken into consideration, we can see that the proportion of survival
    drops starting from the 214th day of the policy.


    Both the Entertainment and Utilities industries have a 0% chance that there will
    be no claims at all for a one-year policy when we take the winter season into
    consideration.


    In fact, for the Utilities industry there is a 0% chance that there will be no
    claims even before the 270th day of the policy. However, the chance that Entertainment
    will “survive” without claims by the 270th day is about 9%.


    The hazard function presented in [Figure 11.6](#C17_chapter11.xhtml#fig11_6) shows
    that the instantaneous hazard of claims sharply increases after `t` > 214 days,
    achieving the highest claims rate around the 280th day of a policy term.


    ![FIGURE 11.6 Hazard functions for industries in Illinois for policies starting
    on April 1.](images/file19.jpg)


    **FIGURE 11.6**


    Hazard functions for industries in Illinois for policies starting on April 1.


    For the second example, if a policy started on the 1st of August, then during
    time `t` ≤ 92 days (from the 1st of August till the 1st of November) and `t` >
    244 days (from the 1st of April till the 31st of July), `season` = 0. Then, for
    the duration of time 92 < `t` ≤ 244 days of the policy, `season` = 1. Thus, the
    survival function is calculated using hazard corresponding to `season = 0` for
    time-to-event `t` ≤ 92 and `t` > 244 days, and for time-to-event 92 < `t` ≤ 244,
    it is calculated using hazard corresponding to `season = 1`. The survival function
    for this case is presented in [Figure 11.7](#C17_chapter11.xhtml#fig11_7).


    In comparison with [Figure 11.3](#C17_chapter11.xhtml#fig11_3), where the winter
    season was not taken into consideration, we can see that the proportion of survival
    drops before the 100th day of the policy.


    For the Utilities industry, there is a 44% chance that there will be no claims
    before the 100th day of a policy accounting for winter season vs. 65% without
    accounting for the winter season. After that, the chances are dropping, and by
    the 210th day of the policy, there is a 0% chance that there will be no claims
    in the Utilities industry, accounting for the winter season.


    For the Entertainment industry, there is a 66% chance that there will be no claims
    by the 100th day of a policy when we take winter season into consideration—vs.
    72% otherwise. Also, there is about a 1% chance that there will be no claims at
    all for a one-year policy—in comparison with a 6.5% chance when we do not take
    the winter season into consideration.


    ![FIGURE 11.7 Survival functions for industries in Illinois for policies starting
    on August 1.](images/file20.jpg)


    **FIGURE 11.7**


    Survival functions of industries in Illinois for policies starting on August 1.


    The information revealed by the presented models can be used for the purposes
    of underwriting and pricing, for the development of new insurance products, and
    for marketing. For example, insurers can estimate the risk of claims more accurately
    depending not only on the industry, but also on the time period when the policy
    is started. Insurers can better manage anticipation of losses related to claims.
    In addition, insurers can develop new workers′ compensation products for a duration
    shorter than 1 year. In this case, the insurance during the periods of lower risk
    will have a lower premium.


    ![FIGURE 11.8 Hazard functions for industries in Illinois for policies starting
    on April 1.](images/file21.jpg)


    **FIGURE 11.8**


    Hazard functions for industries in Illinois for policies starting on August 1.


    ## 11.5 Summary


    The ultimate goal of `season` is to create a profitable.

