    的一个良好估计量为：


    `θ̂[med]*(x) = median{θ̂[i]*,i=1,…k}` (3.8)


    现在，`θ` 的 95% 置信区间可以由采样值 `θ̂[i]*)` 的上、下各 2.5% 分位数来构建。因此，`θ` 的自助百分位法 95% 置信区间可以构造为：


    (`θ̂[(U)]*,θ̂[(k + 1 − U)]*)`) (3.9)


    其中


    `θ̂[i]*)` 是按升序排列的值 `θ̂[i]*)`，使得 `θ̂[(1)]* ≤ θ̂[(2)]* ≤  ≤ θ̂[(k)]*`。


    `U` 等于 0.025 `k` 值，向下取整到最近的整数（如果 `U = 0`，则替换为 1）。


    值 0.025 是根据给定的自助百分位置信区间计算的，对于 95% 置信区间，该值的获取值为 (1 − 0.95)/2 = 0.025。


    例如，如果 `k = 1,000`，则 `U = 25` 且 `k + 1 − U = 976`，自助百分位法 95% 置信区间将类似于 (`θ̂[(25)]*,θ̂[(976)]*)。


    公式 (3.9) 相比公式 (3.7) 的优势如下：


    1. 它不需要理论（解析）公式来计算置信区间，而对于 `θ` 的复杂估计量，推导公式可能困难。

    2. 置信区间的端点（公式 3.9）是 `θ = θ̂(`X*)` 的可实现值。


    此外，显然将 `θ` 替换为 `θ` 的任何单调函数，等同于将自助采样的 `θ` 值替换为这些值的相同单调函数。因此，生成 `log(θ)` 的中位数估计（公式
    3.8）和置信区间（公式 3.9），然后对结果进行指数运算，与我们最初对 `θ` 进行处理的结果完全相同。通常，如果 `g(θ)` 是 `θ` 的任何单调函数，则以下等式成立：


    ${{\hat{\text{g}\left( \theta \right)}}\_{i}^{\*} = g\left( {\\hat{\theta}}\_{i}^{\*}
    \right)}\mspace{54mu}\operatorname{(3.10)}$


    其中


    ${\hat{\text{g}\left( \theta \right)}}\_{i}^{\{*}}$ 表示 `g(θ̂(`X*)))` 的第 `i` 个自助采样值。


    这进一步表明了自助百分位置信区间（公式 3.9）相比于基于正态分布的置信区间（公式 3.7）的额外优势。`θ` 的适当缩放往往是不明确的，或者可能需要转换公式
    (3.7) 中的值以消除离群值。公式 (3.10) 意味着对于 `θ` 的任何单调变换，我们获得相同的中位数估计（公式 3.8）和置信区间（公式 3.9）。必须记住，自助百分位估计量（公式
    3.8 和 3.9）是基于 `θ̂(`X*)` 作为 `θ` 的函数的分布关于 `θ` 对称的假设得出的。属性 (公式 3.10) 弱化了这个假设，因为我们现在只需要假设存在单调严格递增函数
    `g(θ)`，使得 `g(θ̂(`X*)))` 作为 `θ` 的函数围绕 `g(θ)` 对称分布，这创建了一个巨大的估计量类。


    ### 3.2.3 偏倚减少


    自助法（Bootstrap）允许我们估计并减少偏倚。


    偏差的自助估计量 `B*` 是 `E(θ̂*-θ̂*)`，其中 `θ̂*` 是基于自助样本的 `θ` 的估计。`B*` 的近似值通过进行 `k` 次自助采样并平均估计值
    `θ̂[i]*)` 与原始样本估计值 `θ̂` 之间的差异来获得：


    ${{\hat{B}}^{\*} = {\\sum\limits\_{i = 1}^{k}{\left( {{\{\hat{\theta}}\_{i}^{\*}
    - \hat{\theta}} \right)\text{/}k}}}\\mspace{54mu}\operatorname{(3.1)}$


    估计的目的是改进有偏估计量，例如通过从中减去其偏差的估计。假设我们观察到 `θ̂[med]*(X*) = median{θ̂[i]*)*,i=1,…k} <
    θ̂` (12)。因此，我们可以说使用估计值 `θ = θ̂[med]*(X*)` 是不合理的，因为公式 (12) 可能意味着重采样过程倾向于产生较小的 `θ`
    值。然而，如果从总体采样 `X` 的过程与从 `X` 中自助采样 `X[i]*)` 的过程相似（如图 3.2 所示），那么公式 (12) 意味着 `θ >
    θ̂(`X*)`，而不是 `θ = θ̂[med]*(X*) < θ̂`。


    量化这种中位数偏差的方法是将“偏差”定义为小于或等于 `θ̂(`X*)` 的自助采样值 `θ̂[i]*)` 的比例：


    ${{\hat{B}}\_{\text{median}}^{\*} = \\frac{1}{k}{\sum\limits\_{i = 1}^{k}{\mathbb{I}\left\{
    {\\hat{\theta}}\left\{ X_{\\{ i \}}^{\*} \right\} \leq \hat{\theta}\left\{ X \right\}\}}\mspace{54}}\operatorname{(13)}$


    其中 `𝕀` 是指示函数，当 `θ̂[i]*) ≤ θ̂` 时其值为 1，否则为 0。


    公式 (12) 中的表达式可以解释为 `P(θ̂(`X^*) ≤ θ̂)` 的近似值。如果 `B* = 1/2`，则重采样值中关于 `θ̂` 没有中位数偏差。在某些研究中，建议了指示无中位数偏差的阈值。例如，0.40
    ≤ θ̂[med]*) ≤ 0.60 或 0.35 ≤ θ̂[med]*) ≤ 0.65 被建议作为无偏差的规则。


    ### 3.2.4 参数自助法


    Efron (1982) 将原始自助法解释为非参数极大似然方法，换句话说，是将极大似然方法推广到非参数框架。从这个角度来看，`F̂` 是 `F` 的非参数估计。因此，普通自助是“极大似然”估计。


    如果我们假设 `F` 具有参数形式，例如正态分布，那么 `F` 的适当估计将是具有 `μ` 和 `σ²` 的正态分布。从这样的参数估计中进行放回采样会导致符合
    Fisher 理论的极大似然估计。参数自助的蒙特卡洛近似是极大似然估计的近似。


    如图 31 和 3 所示，我们用样本分布函数 `F̂` 近似了未知分布 (`θ, F`)。假设我们可以知道 `X` 的分布：


    `F = F(θ, x)`


    在这种情况下，我们在图 3.2 中将 `F̂` 替换为 `F(θ̂, x)`。这意味着在图 3.2 中自助样本 `X[i]*)` 是从 `F(θ̂, x)`
    取的，而不是 `F̂`。


    让我们考虑这样一个例子，我们坚信我们的数据按照以下双指数分布的形式：


    $f\left( X \right) = \frac{\\text{exp}\left( {- \left| {x - \mu} \right|} \right)}{2}$


    对于该族，`μ` 的极大似然估计量如下：


    `μ̂(x[1],x[2],…x[n]) = μ̂[m] = median{x[i],i=1,…n}`


    遵循图 3.2 中描述的过程，在将 `F̂` 替换为 `F(θ̂, x)` 时，自助样本 `X* = (x[1]*,x[2]*,…x[n]*)` 现在将是独立随机变量，其密度为


    $f\left( X \right) = \frac{\\text{exp}\left( {- \left| {x - {\\hat{\mu}}\_{m}}
    \right|} \right)}{2}$

