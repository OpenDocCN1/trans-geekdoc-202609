  trans: "\n\n表 6.6 显示了在 `Property` 表中定义的 `Message` 表属性示例。\n\n表 6.6  \n\n属性表（部分列）\n\
    \n| 表名 | 列名 | 类型 | 长度 | 属性 | 值 |\n| --- | --- | --- | --- | --- | --- |\n| `Message`\
    \ | `Message` | `N` | 8 | `P` | |\n| --- | --- | --- | --- | --- | --- |\n| `Message`\
    \ | `text` | `C` | 80 | | |\n| `Message` | `mestype` | `C` | 1 | `W` | |\n| `Message`\
    \ | `output` | `C` | 2 | `S` | |\n| ... | ... | ... | ... | ... | ... |\n\n###\
    \ 6.3.6 含义定义](#C02a_toc.xhtml#rsec6_3_6)\n\n“含义”（meaning）是一种简单的方法，用于将无意义的值替换为有意义的文本。列含义的定义仅仅是指对应用表及其包含有意义描述的列的引用。含义的正确定义基于应用表之间的关系。我们定义含义的列必须是包含有意义描述的表的外键。\n\
    \n### 6.3.7 关联表](#C02a_toc.xhtml#rsec6_3_7)\n\n`Link` 表指定了通过外键链接的表对。`Link` 表的列定义如表\
    \ 6.7 所示。\n\n表 6.7  \n\n关联表的列\n\n| 列名 | 类型 | 长度 | 描述 |\n| --- | --- | --- | ---\
    \ |\n| `Table` | `Character` | 8 | 表名 |\n| --- | --- | --- | --- |\n| `Reltable`\
    \ | `Character` | 8 | 关联表名 |\n| `Column` | `Character` | 8 | 列名 |\n| `Relcol`\
    \ | `Character` | 8 | 关联表的列名 |\n\n`TABLE`、`COLUMN`、`RETABLE` 和 `RELCOL` 列共同组成了\
    \ `Link` 表的主键。\n\n### 6.3.8 应用数据模型定义流程](#C02a_toc.xhtml#rsec6_3_8)\n\n需要说明的是，应用数据模型的定义可以通过迭代完成，没有必要在在使用应用程序之前完成整个应用设计过程，也没有必要在第一次就做到完全完美。这并不意味着在表驱动的开发环境中应用设计是不必要的；应用设计仍然是需要的。然而：\n\
    \n- 它并不需要一次性完成；\n- 它不必在第一次就是完美的；而且\n- 如果需求发生变化，设计也可以以相对无痛苦的方式进行更改。\n\n基于数据字典开发的最宏大的目标是在最大限度地提高应用组件质量的同时，最大限度地降低其开发和维护成本。\n\
    \n### 6.3.9 数据字典的特性](#C02a_toc.xhtml#rsec6_3_9)\n\n数据字典具有构成功能清单的若干特性：\n\n关系型（Relational）：数据字典应该基于关系型技术。这是目前软件行业标准标准。\n\
    \n可扩展性（Extendable）：数据字典应该是可扩展的。设计者应该能够根据需要扩展数据字典，以添加新的文件、数据库和其他相关信息源。换句话说，数据字典的元模型（或关于数据的数据）应该足够灵活，可以根据需要进行扩展。\n\
    \n元元模型（Meta-meta model）：数据字典应该基于面向对象的元元模型。元元模型可以被看作是数据字典的数据字典。以这种方式构建的数据字典是自定义和自维护的。它的自定义体现在：正如设计者使用关系模型和数据字典来定义元数据一样，数据字典也是使用相同的实体-关系模型（元元数据）定义的。以面向对象、可扩展的方式开发这种元元模型，确保应用程序未来的增长是一致的、逻辑的且对需求相应的。\n\
    \n预存数据定义（Preexisting data definitions）：数据字典应该提供自动用预存数据定义填充数据字典的能力。由于大多数企业数据已经存在，数据字典必须能够从数据库描述自动生成数据字典定义。\n\
    \n数据库定义（Database definitions）：数据字典应该提供自动生成数据库定义的能力。由于允许程序员自行编写数据描述是低效且容易出错的，数据字典应该提供这种能力。\n\
    \n通用用户访问（Common user access）：数据字典应该提供一个易于使用的、标准的通用用户访问接口。数据字典应该提供一个面向对象-动作的对话框。设计者将看到适当的对象以及可以为这些对象调用的所有操作。\n\
    \n报告功能（Report facility）：数据字典应该提供集成的报告功能。\n\n安全性（Security）：数据字典应该具有多个级别的安全性，可以由数据字典、数据或设计者进行控制。\n\
    \n生命周期支持（Life cycle support）：数据字典应该提供足够的设施，以跟踪数据元素描述在整个规划、设计、开发、测试和生产生命周期过程中的修改情况。\n\
    \n### 6.3.10 优化框架的组件及其在数据字典中的定义](#C02a_toc.xhtml#rsec6_3_10)\n\n机器学习优化框架可能的数据字典表集包含五组（组件）表：输入数据、自助、机器学习、实验设计和训练数据污染。我们把这些组（组件）称为框架集，它可以随时通过额外的表或表组进行扩展。框架集的每个组件都将在后续章节中描述。\n\
    \n"
