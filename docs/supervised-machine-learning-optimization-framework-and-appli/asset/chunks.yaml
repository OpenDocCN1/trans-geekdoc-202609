  trans: "\n\n在统计学中，全因子实验（full-factorial experiment）被定义为包含两个或多个因素设计的实验，每个因素具有两个或多个离散水平，使得所有因素跨越水平的所有可能组合恰恰应用于实验单位（Box\
    \ 等人，1978）。在全因子设计中，跨越所有因素水平的所有可能组合可以在 `k` 维设计空间中的超立方体上表示，该空间由 `k` 个因素中每个因素的最小水平和最大水平定义。实验点有时被称为因子点（factorial\
    \ points）。实验运行的总数计算为各因素水平数量的乘积。假设我们进行一个具有三个因子 `A`、`B` 和 `C` 的全因子实验，其中 `A`、`B`\
    \ 和 `C` 在三个水平上进行测量。那么，该实验有 $3³ = 27$ 次运行，它们如图 5.1 中的超立方体所示。\n\n![图 5.1 3³全因子实验的超立方体。](img/file6.jpg)\n\
    \n**图 5.1**\n\n$3³$ 全因子实验的超立方体。\n\n全因子 $3³$ 实验设计如表 5.1](#C11_chapter5.xhtml#tab5_1）所示。\n\
    \n**表 5.1**\n\n全因子 $3³$ 实验设计\n\n| 运行 || A || B || C || 运行 || A || B || C || 运行\
    \ || A || B || C |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
    \ | --- | --- |\n| 1 || 0 || 0 || 0 || 10 || 1 || 0 || 0 || 19 || 2 || 0 || 0\
    \ |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n\
    | 2 || 0 || 0 || 1 || 11 || 1 || 0 || 1 || 20 || 2 || 0 || 1 |\n| 3 || 0 || 0\
    \ || 2 || 12 || 1 || 0 || 2 || 21 || 2 || 0 || 2 |\n| 4 || 0 || 1 || 0 || 13 ||\
    \ 1 || 1 || 0 || 22 || 2 || 1 || 0 |\n| 5 || 0 || 1 || 1 || 14 || 1 || 1 || 1\
    \ || 23 || 2 || 1 || 1 |\n| 6 || 0 || 1 || 2 || 15 || 1 || 1 || 2 || 24 || 2 ||\
    \ 1 || 2 |\n| 7 || 0 || 2 || 0 || 16 || 1 || 2 || 0 || 25 || 2 || 2 || 0 |\n|\
    \ 8 || 0 || 2 || 1 || 17 || 1 || 2 || 1 || 26 || 2 || 2 || 1 |\n| 9 || 0 || 2\
    \ || 2 || 18 || 1 || 2 || 2 || 27 || 2 || 2 | |\n\n如果实验中有 `m` 次重复，则每次运行将重复 `m`\
    \ 次。重复是为了估计在完全相同的条件下执行实验的误差。关于每个因素所用水平数量的决策是基于对因素与响应变量之间关系的假设。例如，设置在两个水平的因素，其假设之一是：响应变量的值在因素的范围内大约是线性的。两水平设计是满足设计基本标准——相对于实验运行次数的效率以及识别显著效应的能力——的最低水平设计。如上所述，具有两个水平因素的设计只能描述线性（直线）关系。具有三个水平因素的设计允许检查主效应的线性和二次行为，并检验涉及因素平方的交互作用项。如果存在合理的假设，认为因素与响应之间的关系具有三次项的性质，且该假设在实验中需要进行调查，则该因素应被定义为四个水平。\n\
    \n全因子实验允许研究人员研究每个因素对响应的影响，以及所有因素之间所有交互作用对响应的影响。实验数据的分析可以使用不同的方法进行，例如，使用多元回归来建模因变量（`y`）与自变量（因素）及其交互作用之间的关系，或者使用方差分析（ANOVA）来解释总变异如何分解为模型解释的变异和残差变异（Wu\
    \ and Hamada, 2000, 209）。\n\n让我们考虑表 5.1[ij] + (ag)[ik] + (β)[jk] + (αβ)[ijk] +\
    \ \\epsilon\n```\n其中 $i, j, k=1,2,3$，$\\alpha[i], \\beta[j], \\gamma[k]$ 是 `A`、`B`\
    \ 和 `C` 的主效应，$(α)[ij]$、$(ag)[ik]$ 和 $(β)[jk]$ 是 `A \\times B`、`A \\times C` 和\
    \ `B \\times C` 的二因素交互效应，$(αβ)[ijk]$ 是 `A \\times B \\times C` 三因素交互效应，$\\epsilon[ijkl]$\
    \ 是从 $N(0,\\sigma²)$ 分布的独立误差。\n\n方差分析（ANOVA）基于以下零和约束：\n\n$$\n\\begin{array}{l}\n\
    \\sum_{i=1}³\\alpha_{i} = 0 \\\\\n\\sum_{j=1}³\\beta_{j} = 0 \\\\\n\\sum_{k=1}³\\\
    gamma_{k} = 0 \\\\\n\\sum_{i=1}³(α)_{ij} = 0, \\sum_{j=1}³(ag)_{ik} = 0, \\sum_{k=1}³(β)_{jk}\
    \ = 0 \\\\\n\\sum_{i=1}³(αβ)_{ijk} = 0 \\\\\n\\end{array} \\quad (5.2)\n$$ \n\
    $$ \n\n基于这些零和约束，我们可以推导出：\n\n$$\ny_{ijkl} = \\hat{\\mu} + \\hat{\\alpha}_{i} +\
    \ \\hat{\\beta}_{j} + \\hat{\\gamma}_{k} + (\\hat{\\alpha\\beta})_{ij} + (\\hat{\\\
