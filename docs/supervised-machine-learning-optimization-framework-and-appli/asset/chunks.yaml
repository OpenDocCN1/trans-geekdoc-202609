    1988, Gill and Schumacher, 1987）。检查比例风险最简单且最常用的图形方法可能是所谓的“对数-负对数”图（log-negative-log
    plot）。对于这种方法，应该绘制 `ln(-ln(Si))` 相对于 `ln(t*)` 的图，并寻找平行性——即曲线之间随时间变化的恒定距离。这仅对分类协变量进行。如果曲线显示出非平行模式，则说明违反了比例风险假设，结果导致
