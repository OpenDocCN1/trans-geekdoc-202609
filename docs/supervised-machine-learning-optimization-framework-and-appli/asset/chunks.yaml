    \n[Design of Experiments and Its Deployment in SAS and R](#C02a_toc.xhtml#rchapter5)\n\
    \n## [5.1 Introduction](#C02a_toc.xhtml#rsec5_1)\n\nMachine learning process of\
    \ classification depends on multiple conditions, and selection of these conditions\
    \ to achieve the best result presents a significant challenge.\n\nWe start building\
    \ a classifier when we have a dataset where each observation is assigned a label\
    \ (output). The first question we usually encounter is what features to use for\
    \ building a classifier. Feature selection is a difficult question that may require\
    \ deep knowledge of the problem domain. We may choose different approaches to\
    \ create reasonable feature sets (Dong and Liu, 2018, Weston et al, 2000), but\
    \ as a result, we end up with multiple possibilities. In the process of building\
    \ the classifier, we need to decide which of these feature sets works best for\
    \ our classification problem.\n\nAs the next step, we need to make our mind about\
    \ the machine learning method that we will use to build the classifier. Suppose\
    \ we have reasons to choose a specific method. However, if this is not the case,\
    \ then we have several methods we want to try for building the classifier.\n\n\
    As discussed in [Chapter 2](#C08_chapter2.xhtml#chapter2), using machine learning\
    \ methods requires assigning values to multiple hyperparameters. For example,\
    \ in the case of neural network, a decision should be made about an activation\
    \ function, set of neurons, a number of hidden levels, etc. And in the case of\
    \ support vector machine, we need to choose a kernel and its parameters, as well\
    \ as the value of the cost parameter."
