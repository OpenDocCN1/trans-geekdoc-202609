    the performance of the U.S. property-liability insurance industry. *The Journal
    of Risk and Insurance*, 64: 371–382.

    3. Cortes, C., and Vapnik, V. 1995. Support-vector networks. *Machine Learning*,
    20: 273–297.

    4. Firth, D. 1993. Bias reduction of maximum likelihood estimates. *Biometrics*,
    80 (1): 27–38.

    5. Kunreuther, H., Meszaros, J., Hogarth, R. M., Spranca, M. 1995. Ambiguity and
    underwriter decision processes. *Journal of Economic Behavior & Organization*,
    26: 337–352.

    6. Randall, E. D. 1994. *Introduction to Underwriting*. Insurance Institute of
