    \ will look like (*θ̂*[(25)]^(\\*),*θ̂*[(976)]^(\\*)) .\n\nThe advantages of equation\
    \ (3.9) over equation (3.7) are as follows:\n\n1.  It does not require a theoretical\
    \ (analytical) formula to calculate the confidence interval, which can be difficult\
    \ to derive for complex estimators of *θ*.\n\n2.  The endpoints of the confidence\
    \ interval (equation 3.9) are realizable values of *θ* = *θ̂*(*X*).\n\nIn addition,\
    \ it is obvious that replacing *θ* by any monotonic function of *θ* replaces the\
    \ bootstrap-sampled values for *θ* by the same monotonic function of those values.\
    \ Thus, generating the median estimate (equation 3.8) and confidence interval\
    \ (equation 3.9) for log(*θ*) and then exponentiating the results leads to exactly\
    \ the same results as if we had worked with *θ* in the first place. In general,\
    \ if *g*(*θ*) is any monotonic function of *θ*, the following is true:\n\n${{\\\
    \\hat{\\\\text{g}\\\\left( \\\\theta \\\\right)}}\\_{i}^{\\*} = g\\\\left( {\\\
    \\hat{\\\\theta}}\\_{i}^{\\*} \\\\right)}\\\\mspace{54mu}\\\\operatorname{(3.10)}$\
    \ \n\nwhere\n\n${\\\\hat{\\\\text{g}\\\\left( \\\\theta \\\\right)}}\\_{i}^{\\\
    \\text{\\*}}$ means the *i*th bootstrap-sampled value for *g*(*θ̂*(*X*)) .\n\n\
    This suggests yet the additional advantage of the bootstrap percentile confidence\
    \ interval (equation 3.9) over the confidence interval based on normal distribution\
    \ (equation 3.7). The proper scaling of *θ* is very often unclear or may seem\
    \ to require transforming the values in equation (3.7) to eliminate outliers.\
    \ Equation (3.10) means that we obtain the same median estimate (equation 3.8)\
    \ and confidence intervals (equation 3.9) for any monotonic transformation of\
    \ *θ*. It is important to keep in mind that the bootstrap percentile estimators\
    \ (equations 3.8 and 3.9) were derived based on the assumption that the distribution\
    \ of *θ̂*(*X*) as a function of *θ* is symmetric about *θ*. The property (equation\
    \ 3.10) weakens this assumption as now we can just assume the existence of a monotonic\
    \ strictly increasing function *g*(*θ*) such that *g*(*θ̂*(*X*)) , as a function\
    \ of *θ* is symmetrically distributed around *g*(*θ*) , which creates a significantly\
    \ large class of estimators.\n\n### [3.2.3 Bias Reduction](#C02a_toc.xhtml#rsec3_2_3)\n\
    \nBootstrap allows us to estimate and then reduce bias.\n\nThe bootstrap estimator\
    \ *B*^(\\*) of bias is *E*(*θ̂*^(\\*)−*θ̂*) , where *θ̂*^(\\*) is an estimate\
    \ of *θ* based on a bootstrap sample. An approximation of *B*^(\\*) is obtained\
    \ by doing *k* bootstrap samples and then averaging the differences between the\
    \ estimates *θ̂*[*i*]^(\\*) and the original sample estimate *θ̂* :\n\n${{\\\\\
    hat{B}}^{\\*} = {\\\\sum\\\\limits\\_{i = 1}^{k}{\\\\left( {{\\\\hat{\\\\theta}}\\\
    _{i}^{\\*} - \\\\hat{\\\\theta}} \\\\right)\\\\text{/}k}}}\\\\mspace{54mu}\\\\\
    operatorname{(3.11)}$ \n\nThe purpose of estimating bias is to improve the biased\
    \ estimator, for example by subtracting an estimate of its bias from it.\n\nSuppose\
    \ we observe that\n\n*θ̂*[med]^(\\*)(*X*) = median{*θ̂*(*X*[(*i*)]^(\\*)),*i*\\\
    =1,…,*k*} < *θ̂*(*X*)   (3.12)  \n\nThus, we may state that using the estimate\
    \ *θ* = *θ̂*[med]^(\\*)(*X*) is not reasonable, as equation (3.12) may imply that\
    \ the resampling process tends to yield smaller values of *θ*.\n\nHowever, if\
    \ the process of sampling *X* from the population is similar to the process of\
    \ bootstrap sampling *X*[(*i*)]^(\\*) from *X* (which follows from [Figure 3.2](#C09_chapter3.xhtml#fig3_2)),\
    \ then equation (3.12) should mean that *θ* > *θ̂*(*X*) , rather than\n\n*θ* = *θ̂*[med]^(\\\
    *)(*X*) < *θ̂*(*X*) \n\nOne way of quantifying this median bias is to define “bias”\
    \ as a proportion of bootstrap-sampled values *θ̂*[*i*]^(\\*) that are less than\
    \ or equal to *θ̂*(*X*) :\n\n${{\\\\hat{B}}\\_{\\\\text{median}}^{\\*} = \\\\\
    frac{1}{k}{\\\\sum\\\\limits\\_{i = 1}^{k}{\\\\mathbb{I}\\\\left\\\\{ {\\\\hat{\\\
    \\theta}\\\\left\\\\{ X\\_{\\\\{ i\\\\}}^{\\*} \\\\right\\\\} \\\\leq \\\\hat{\\\
    \\theta}\\\\left\\\\{ X \\\\right\\\\}} \\\\right\\\\}}}}\\\\mspace{54mu}\\\\\
    operatorname{(3.13)}$ \n\nwhere\n\n\U0001D540 is an indicator function that is\
    \ equal to 1 when *θ̂*(*X*[(*i*)]^(\\*)) ≤ *θ̂*(*X*) , and 0 otherwise.\n\nThe\
    \ expression in equation (3.12) can be interpreted as an approximation of *P*(*θ̂*(*X*^(\\\
    *))≤*θ̂*(*X*)|*X*) . If *B̂*[median]^(\\*) = 1/2 , then there is no median bias\
    \ about *θ̂*(*X*) in the resampled values *X*[(*i*)]^(\\*) . In some studies,\
    \ threshoulds that indicate absence of median bias were suggested. For example,\n\
    \n0.40 ≤ *B̂*[median]^(\\*) ≤ 0.60or0.35 ≤ *B̂*[median]^(\\*) ≤ 0.65 \n\nare suggested\
    \ as rules indicating no concern of bias. Otherwise, it is suggested that a better-behaved\
    \ estimator *θ̂*(*X*) of *θ* should be found.\n\n### [3.2.4 The Parametric Bootstrap](#C02a_toc.xhtml#rsec3_2_4)\n\
    \nThe original bootstrap was interpreted by Efron (1982) as a nonparametric maximum\
    \ likelihood approach or, in other words, as a generalization of the maximum likelihood\
    \ approach to the nonparametric framework. From this point of view, *F̂*(*z*)\
    \ is a nonparametric estimate of *F*(*z*) . Thus, the ordinary nonparametric bootstrap\
    \ estimates are “maximum likelihood” estimates.\n\nIf we assume that *F*(*z*)\
    \ has a parametric form such as, say, the Gaussian distribution, then the appropriate\
    \ estimator for *F*(*z*) would be a Gaussian distribution with the maximum likelihood\
    \ estimates of *μ* and *σ*² . Sampling with replacement from such a parametric\
    \ estimate of *F*(*z*) leads to bootstrap estimates that are maximum likelihood\
    \ estimates in accordance with Fisher’s theory. The Monte Carlo approximation\
    \ to the parametric bootstrap is simply an approximation to the maximum likelihood\
    \ estimate.\n\nAs shown in [Figures 3.1](#C09_chapter3.xhtml#fig3_1) and [3.2](#C09_chapter3.xhtml#fig3_2),\
    \ we approximated the unknown distribution (*θ*,*F*) by the sample distribution\
    \ function *F̂*(*z*) . Suppose we can assume that we know the distribution of\
    \ *X* :\n\n*F*(*z*) = *F*(*θ*,*z*) \n\nIn this case, we substitute *F̂*(*z*) by\
    \ *F*(*θ̂*,*z*) in [Figure 3.2](#C09_chapter3.xhtml#fig3_2). Thus, it means that\
    \ in [Figure 3.2](#C09_chapter3.xhtml#fig3_2) the bootstrap samples *X*[*i*]^(\\\
    *) are taken from *F*(*θ̂*,*z*) instead of *F̂*(*z*) .\n\nLet us consider an example\
    \ where we have a strong conviction that our data is distributed according to\
    \ the following form of double exponential distribution:\n\n$f\\\\left( X \\\\\
    right) = \\\\frac{\\\\text{exp}\\\\left( {- \\\\left| {x - \\\\mu} \\\\right|}\
    \ \\\\right)}{2}$ \n\nThe maximum likelihood estimator of *μ* for this family\
    \ is as follows:\n\n*μ̂*(*x*[1],*x*[2],…,*x*[*n*]) = *μ̂*[*m*] = median{*x*[*i*],*i*\\\
    =1,…,*n*} \n\nFollowing the process described in [Figure 3.2](#C09_chapter3.xhtml#fig3_2),\
    \ while substituting *F̂*(*z*) by *F*(*θ̂*,*z*) , the bootstrap samples *X*^(\\\
    *) = (*x*[1]^(\\*),*x*[2]^(\\*),…,*x*[*n*]^(\\*)) will now be independent random\
    \ variables with density\n\n$f\\\\left( X \\\\right) = \\\\frac{\\\\text{exp}\\\
    \\left( {- \\\\left| {x - {\\\\hat{\\\\mu}}\\_{m}} \\\\right|} \\\\right)}{2}$ "
