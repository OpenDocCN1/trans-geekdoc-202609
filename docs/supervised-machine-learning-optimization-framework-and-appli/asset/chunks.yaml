    \ label *y* = sign(*f*(*x*)). For many problems, it is convenient and often even\
    \ necessary to get a probability *P*(*y* = + 1|*f*(*x*)). This means that the\
    \ classification gives not only an answer, but also a degree of certainty about\
    \ the answer.\n\nAlthough a binary decision is sufficient for many problems, it\
    \ is difficult to arrive at a meaningful bias–variance trade-off. In addition,\
    \ the application of an SVM classifier to new incoming data should produce a posterior\
