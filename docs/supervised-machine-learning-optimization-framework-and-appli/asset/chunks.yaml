    Using these functions, the deployment of `m-out-of-n` bootstrap method is straightforward.
    As in the example used for `PROC SURVEYSELECT`, let us create 100 samples of 1,000
    values with replacement from a `data_index` vector containing indexes of the input
    dataset:


    ```

    set.seed(123)

    MNBootstrap < -replicate(100, sample(data_index, 1000, replace = TRUE))

    ```


    In Part II of the book, we will demonstrate the usage of these functions in the
    AI framework.


    ## 3.4 Summary


    In the machine learning process of building classifier, one of the largest challenges
    is to make the classifier ready for unseen data. In this chapter, we reviewed
    the bootstrap methods that allow us to create multiple training and testing datasets
    from the original labeled data. The main reason for creating these datasets is
    to allow variability of data for the process of classification, and as a result,
    to create the classifier (or classifiers) that successfully deal with such variability.
    We also use bootstrap methods at the stage of data cleansing to minimize bias
    in the input data.


    ## References


    1. Athreya, K. B. 1987. Bootstrap estimation of the mean in the infinite variance
    case. *The Annals of Statistics*, 15: 724–731.

    2. Bickel, P. J., Gotze, F., and van Zwet, W. R. 1997. Resampling fewer than n
    observations: gains, losses, and remedies for losses. *Statistica Sinica*, 7:
    1–31.

    3. Efron, B. 1979. Bootstrap methods; another look at the jackknife. *The Annals
    of Statistics*, 7: 1–26.

    4. Efron, B. 1982. The jackknife, the bootstrap, and other resampling plans. *CBMS-NSF
    Regional Conference Series in Applied Mathematics.* Vol. 38. Stanford, California:
    Stanford University.

    5. Efron, B., and Tibshirani, R. J. 1993. *An Introduction to the Bootstrap*.
    New York: Chapman and Hall.


    # 4. Outliers Detection and Its Deployment in SAS and R


    ## 4.1 Introduction


    Machine learning process, regardless of the method used, depends heavily on the
    so-called input datasets. It is the most crucial aspect that makes algorithm training
    and testing possible. A dataset is a collection of data. In other words, a dataset
    corresponds to the contents of a single data table, or a single statistical data
    matrix `X`(`n`×`p`) where each column `j` = 1, …, `p` of the table represents
    a particular variable (feature) and each row `i` = 1, …, `n` corresponds to a
    specific observation of the dataset.


    An input dataset serves as a source of both training and testing datasets. The
    training dataset is used to train an algorithm to apply machine learning concepts,
    such as neural networks and support vector machine, to learn and produce results.
    The training dataset includes the so-called labeled observations, which consist
    of both input data and the expected output. The test dataset is used to evaluate
    how well the algorithm was trained. In machine learning projects, the goal of
    the testing stage is to evaluate how well the classifier, created in the process
    of training, can work with unseen data. Because input datasets are usually flawed,
    data cleansing is a very important step in the machine learning process. To put
    it in a nutshell, data cleansing is a set of procedures that helps make a dataset
    more suitable for machine learning. To put it simply, the quality of training
    data determines the performance of machine learning algorithms.


    ## 4.2 Outliers Detection and Treatment


    It is difficult to detect outliers in `p`-variate data when `p` > 2 because one
    can no longer rely on visual inspection of data. Although it is relatively easy
    to detect a single outlier using, for example, Mahalanobis distances, this approach
    no longer suffices for multiple outliers due to the masking effect when outliers
    do not necessarily have large Mahalanobis distances. Donoho (1982) and Donoho
    and Gasko (1992) demonstrated that many methods for estimating location parameter
    break down in the presence of `n`/(`p`+1) outliers, where `n` is the number of
    observations and `p` is the number of variables. We propose to use the minimum
    covariance determinant (MCD) method of Rousseeuw (1985) to detect multiple outliers
    in a multivariable setting.


    ### 4.2.1 Minimum Covariance Determinant Method


    The objective of the MCD method is to find `h` out of `n` observations whose covariance
    matrix has the lowest determinant. The MCD estimate of mean is the average of
    these `h` observations, and the MCD estimate of variance is their covariance matrix.
    MCD has an important advantage. According to Butler et al. (1993), it is statistically
    efficient because the MCD is asymptotically normal. Regardless of this advantage,
    MCD has not been commonly applied for detecting outliers due to its computational
    complexity. The newly developed fast algorithm of MCD (Rousseeuw and Van Driessen,
    1999) greatly outperforms other methods in terms of statistical efficiency and
    computational speed. Also, MCD can deal with training datasets of large size,
    which is why we recommend the MCD method to detect outliers in multivariable datasets.
    The motivation of the MCD algorithm can be explained as below.


    Suppose we take a random sample `X`[`h`]` of size `h` out of an input dataset
    `X` = (`x[1]`, `x[2]`, …, `x[n]`). We can evaluate the similarity between data
    points in the full dataset and our randomly sampled subset. Let `M` = (`μ[1]`,
    `μ[2]`, …, `μ[p]`) be the mean of the random subset and `S` be the standard covariance
    matrix of the random subset. We use the Mahalanobis distance `D` to estimate similarity:


    ```

    D = [(X-M)^T * S^(-1) * (X-M)]^(1/2)

    ```


    The basic idea of the algorithm is to start with small subsets of size `p+1`,
    their average `M`, covariance matrix `S`, and a corresponding `h`-subset of the
    `h` observations with the smallest Mahalanobis distances.


    For a detailed description of the Fast-MCD algorithm, we refer the readers to
    the work of Rousseeuw and Van Driessen (1999). The newly developed algorithm,
    by Boudt et al. (2018), deals with the situation where the number of variables
    (features) exceeds the dataset size. So, when the size of the training dataset
    is smaller than the number of variables (features), the MCD method should be replaced
    by the minimum regularized covariance determinant (MRCD) method.


    ### 4.2.2 MCD in SAS


    The Fast-MCD algorithm is implemented in different software packages such as R,
    SAS, and Python. However, the implementation of this algorithm can be different
    depending on what it is used for. The R-written function `CovMcd` from the `robustbase`
    package, for example, calculates scalable robust estimators using the MCD algorithm,
    but does not produce dataset cleaned from outliers.


    The SAS software has the `ROBUSTREG` procedure that is usually used as a regression
    procedure. However, `PROC ROBUSTREG` can also compute MCD estimates. The statements
    available in `PROC ROBUSTREG` are summarized in Table 4.1.


    **TABLE 4.1** Parameters of the `ROBUSTREG` Procedure


    | `PROC ROBUSTREG <options>` | Invokes the Procedure |

    | :--- | :--- |

    | `BY` variables | Allow obtaining separate analyses of observations in groups
    defined by the `BY` variables. |

    | `CLASS` variables | Specify which explanatory variables to treat as categorical.
    |

    | `EFFECT name=effect-type(variables < / options >)` | Enables constructing special
    collections of columns for design matrices. |

