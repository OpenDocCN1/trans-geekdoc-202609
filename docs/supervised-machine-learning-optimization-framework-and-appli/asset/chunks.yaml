    \ 统计量服从 `F` 分布，其参数为效应的自由度和残差均方的自由度。\n\n全因子实验允许估计所有的主效应和因子组合的所有效应。然而，由于样本量随着因素数量的呈指数级增长，全因子设计的运行成本通常过高。此外，由于高阶交互作用通常不活跃，执行此类实验可能效率低下。因此，如果全因子设计中的组合数量高到无法可行，就可以采用部分因子设计，其中省略了部分组合。\n\
