    A common problem in models for dichotomous dependent variables is “separation.”
    Albert and Anderson (1984) coined this term, differentiating between “complete”
    and “quasi-complete” separation. Complete separation occurs when one or more of
    a model’s covariates perfectly predict some binary outcome. Quasi-complete separation
    denotes the case in which such perfect prediction occurs only for a subset of
    observations in the data.


    Separation means the existence of a sub-vector `x[s]` by which all `n` observations
    can be correctly categorized as either `y[i] = 0` or `y[i] = 1`. The existence
    of such a sub-vector leads to a monotonic log-likelihood. As a result, the maximum
    likelihood estimates $\hat{\beta_{s}}$ for the variables in the `x[s]` sub-vector
    equal positive or negative infinity, and the associated standard error estimates
    are infinite as well.


    This is exactly the situation that happens in the SVM classifier outcome, where
    the value of `f(x)` represents the distance to the separating hyperplane, and
    thus, its value perfectly predicts the binary outcome of classification.


    There is extensive literature on the subject of separation, and multiple proposals
    on how to deal with this problem (See Rainey, 2016 and Zorn, 2005). In this book
    we will use Firth’s bias-correction method to address the separation issue in
    logistic regression. Firth method that uses a penalized likelihood estimation
    is considered as an ideal solution for separation issue.


    In his paper from 1993, Firth suggested a method for eliminating the small sample
    bias in maximum likelihood estimation. The main idea of Firth’s approach is to
    introduce a bias term in the form of the Jeffreys’ (1946) invariant prior into
    the standard likelihood function. As `N→∞`, the bias itself approaches zero, but
    for small `N`, the `O(N^(−1))` bias is present. As a result, Firth created a penalized
    log-likelihood formula:


    ```

    ln L(β|y)* ℃=℃ln L(β|y) ⅅ+ 0.5ln |i(β)|   (2.23)

    ```


    and the corresponding equation for score function:


    ```

    {\frac{\partial\ln L\left( \beta \middle| y \right)^{\*}}{\partial\beta} \equiv
    U\left( \beta \right)^{\*} = U\left( \beta \right) + 0.5\text{tr}\left\{ {i\left(
    \beta \right)^{- 1}\leftleftlbrack \frac{\partial i\left( \beta \right)}{\partial\beta}
    \rightrbrack} \right\}\mspace{54mu}\operatorname{(2.24)}

    ```


    where `i(β)` is Jeffreys’ non-informative prior and `ln L(β|y)` and `U(β)` are
    described by equations (2.21) and (2.22), respectively.


    Firth also demonstrated that his penalized likelihood both is asymptotically consistent
    and eliminates the usual small sample bias for a broad class of generalized linear
    models. He also showed that penalized likelihood estimates exist in numerous situations
    in which standard likelihood estimates do not, including that as `N→∞`, the penalized
    likelihood estimates converge to the MLEs.


    ### 2.5.4 Firth for Regression


    The first R package for Firth’s logistic regression, `brlr` package, was written
    by the author, but currently, `brlr` is replaced by the more efficient `brglm`
    package.


    **TABLE 2.4 Arguments of the `brglm` Function**


    | Argument | Description |

    | :--- | :--- |

    | `formula` | a symbolic description of the model to be fitted |

    | `family` | a description of the error distribution and link function to be used.
    `brglm` currently supports only the `binomial` family with links `logit`, `probit`,
    `cloglog`, `cauchit` |

    | `data` | an optional data frame containing the variables |

    | `weights` | an optional vector of weights to be used in the fitting process
    |

    | `subset` | an optional vector specifying a subset of observations to be used
    in the fitting process |

    | `na.action` | a function which indicates what should happen when the data contains
    NA |

    | `start` | starting values for the parameters in the linear predictor |

    | `etastart` | starting values for the linear predictor |

    | `mustart` | starting values for the vector of means |

    | `offset` | this can be used to specify an *a priori* known component to be included
    in the linear predictor during fitting |

    | `control.glm` | `control.glm` replaces the control argument in `glm`, but essentially
    does the same job. It is a list of parameters to control `glm.fit` |

    | `control` | a list of parameters for controlling the fitting process |

    | `intercept` | a logical value indicating whether an intercept should be included
    in the *null* model |

    | `model` | a logical value indicating whether *model frame* should be included
    as a component of the returned value |

    | `method` | the method to be used for fitting the model. The default method is
    `brglm.fit`, which uses either the modified-scores approach to estimation or maximum
    penalized likelihood (see the `pl` argument below) |

    | `pl` | a logical value indicating whether the model should be fitted using maximum
    penalized likelihood, where the penalization is done using Jeffreys’ invariant
    prior, or using the bias-reducing modified scores |

    | `x` | logical values indicating whether the response vector and model matrix
    used in the fitting process should be returned as components of the returned value
    |

    | `y` | logical values indicating whether the response vector and model matrix
    used in the fitting process should be returned as components of the returned value
    |

    | `contrasts` | an optional list, as in `glm` |

    | `control.brglm` | a list of parameters for controlling the fitting process when
    `method = "brglm.fit"` |


    In our case, Firth’s penalized logistic regression will be applied to the outcome
    of SVM. The distance to the hyperplane calculated by SVM will be an independent
    variable and will be assigned to the argument `*x*`, and the labels will be assigned
    to the argument `*y*`.

