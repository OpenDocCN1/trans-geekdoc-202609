    \ . Thus, according to equation (3.3), each bootstrap sample *x*[*i*]^(\\*) is\
    \ a random sample of size *n* from *F̂*(*z*) . Consequently, *θ̂*(*z*) is a function\
    \ of *F̂*(*z*) . In other words, the process of obtaining *θ̂*(*X*) from *X* can\
    \ be described as shown in [Figure 3.1](#C09_chapter3.xhtml#fig3_1).\n\nAssuming\
    \ that our best estimate of *F*(*z*) is *F̂*(*z*) and that the bootstrap samples\
