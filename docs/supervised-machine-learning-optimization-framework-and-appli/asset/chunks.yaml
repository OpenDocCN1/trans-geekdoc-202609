    \ 0.5% of Yes labels to No, and 1% of No labels to Yes,\n\n3.  “Flip” 1% of Yes\
    \ labels to No, and 0.5% of No labels to Yes,\n\n4.  Etc.\n\nThe idea is, essentially,\
    \ to find at what level of contamination the classifier loses its quality significantly\
    \ and to exclude those classifiers that lose their quality with just slight contamination.\n\
    \n### [1.2.5 Best Classifiers](#C02a_toc.xhtml#rsec1_2_5)"
