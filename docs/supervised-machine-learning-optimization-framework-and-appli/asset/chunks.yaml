    # 10 保险行业：核保决策过程


    ## 10.1 引言


    传统上，核保决策被认为是判断、经验和“直觉”的结果。学徒制是新核保人员获得必要经验的习惯方式。然而，资深核保人员将知识传递给下一代需要很长时间。


    改进核保的一种方法是详细分析决策过程中的步骤并创建指南（Chidambaran 等，1997）。将核保视为对决策过程中特定步骤的应用虽然明确了其性质，但失去了经验丰富人员的灵活性。因此，这种方法未达到预期。行业在经验传递方面仍然挣扎。


    此外，保险公司开始意识到经验并非最好或最有效的老师——它既耗时又昂贵，且具有主观性。好习惯和坏习惯都会通过学徒制传递。


    可以通过以下三个步骤改进决策过程：


    1. 使用各种性能指标识别最佳核保人员

    2. 利用优秀核保人员的知识训练 AI 算法，以及

    3. 部署 AI 解决方案实现决策过程的自动化。


    ## 10.2 核保人员表现


    在本节中，我们使用几种现有指标（Kunreuther 等，1995）以及我们提出的一种新指标来分析核保人员的表现。我们将简要说明这些指标的特征，并将其应用于一家工伤保险公司的真实数据。


    ### 10.2.1 核保人员指标


    可以使用不同的指标来评估核保人员的表现，例如命中率、转化率和成交周期。我们还提出了一种可以动态衡量核保人员的新指标。


    ## 参考文献


    1. Kolosova, T., and Berestizky, S. 1995. *Table-Driven Strategies for Rapid SAS
    Development*. Cary, NC: SAS Institute, Inc.


