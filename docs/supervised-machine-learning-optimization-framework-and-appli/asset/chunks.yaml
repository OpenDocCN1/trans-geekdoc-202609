    \ `ε[i]~N(0,σ² )`.\n\nThe assumption that `y^i` are independently distributed\
    \ is too restrictive. The mixed model extends the linear model (equation 5.10)\
    \ by allowing responses to be correlated. Such an extension permits random effects\
    \ and random coefficients in the analysis. The general linear mixed model is denoted\
    \ as follows:\n\n```\ny[ij] = β[0] ⅅ+ β[1]x[ij1] ⅅ+ … ⅅ+ β[p]x[ijp] ⅅ+ γ[i1]z[ij1]\
    \ ⅅ+ … ⅅ+ γ[iq]z[ijq] ⅅ+ ε[ij], ↆↆi = 1,ↆ…,ↆn,ↆↆj = 1,ↆ…,ↆm   (5.11) \n```\n\n\
    where\n\n`y[ij]` is the value of the response variable for the observation `i`\
    \ in group `j`, `β[0]`, `β[1]`, …, `β[p]` are unknown fixed-effects parameters,\n\
    \n`x[ij1]`, …, `x[ijp]` are the fixed-effect regressors for observation `i` in\
    \ group `j`,\n\n`γ[ik]`, `k=1,…, m` are unknown random variables, `γ[ik] ∼ N(0,φ[k]²\
    \ ), ↆ Cov(φ[k],φ′[k]) = φ′[kk]` ; `φ[k]²` are the variances and `φ′[kk]` the\
    \ covariances among the random effects, assumed to be constant across groups,\n\
    \n`z[ij1]`, …, `z[iq]` are the random-effect regressors, `ε[ij]` are unknown random\
    \ variables assumed to be multivariately normally distributed for group `j`.\n\
    \nIn contrast to the standard linear model (equation 5.10), the residuals associated\
    \ with observations in group `j` can be correlated.\n\nThe distinction between\
    \ fixed and random factors, as well as their effects on a response variable, is\
    \ critical in the context of linear mixed models. We refer the readers who are\
    \ interested in studying the linear mixed models underlying theory to the extensive\
    \ statistical literature on the topic, for example, Littell et al. (2007) and\
    \ Verbeke and Molenberghs (1997).\n\n### 5.2.6 Factors and Response Variables\
    \ in the AI Framework\n\nLet’s consider the process of building a classifier using\
    \ the design of experiment framework.\n\nWe may choose different approaches to\
    \ create reasonable feature sets, but as a result, we end up with multiple possibilities.\
    \ In the spirit of DoE, we call this a factor of feature sets. The number of feature\
    \ set possibilities defines the number of levels of this factor. In the process\
    \ of building the classifier, we need to make a decision which one of these feature\
    \ sets, or, in other words, which level of the feature set factor, works best\
    \ for our classification problem.\n\nAs the next step, we need to make up our\
    \ mind about the machine learning method that we will use to build the classifier.\
    \ Suppose we have reasons to choose a specific method. However, if this is not\
    \ the case, then we have one more factor that can be named as a machine learning\
    \ method. The number of levels of this factor is defined by the number of methods\
    \ we want to try for building the classifier.\n\nAs discussed in Chapter 2, using\
    \ machine learning methods requires assigning values to hyperparameters. For example,\
    \ in the case of neural network, a decision should be made about a type of activation\
    \ function, a number of hidden layers, neurons in each layer, etc. And in the\
    \ case of support vector machine, we need to choose a kernel and its parameters,\
    \ as well as the value of the cost parameter. Hyperparameters can be categorical\
    \ (as an activation function or a type of kernel), integer (as a number of layers\
    \ or degree of the polynomial kernel), or continuous (as a `γ` parameter of Gaussian\
    \ kernel or a cost parameter). For categorical parameters, the number of levels\
    \ is identified as a number of unique categorical values of the parameter. For\
    \ integer parameters, the number of levels can be a number of unique integer values\
    \ of the parameter, or, in case of many possible values, a number of intervals\
    \ to which the values are grouped. In the case of continuous parameters, the values\
    \ must be grouped into intervals, the number of which defines a number of levels.\n\
    \nAn additional factor is a level of data contamination, where different ratios\
    \ of data contamination define a number of this factor’s levels.\n\n### 5.2.7\
    \ Example\n\nLet’s consider the process of building a classifier using the design\
    \ of experiment framework.\n\nWe may choose different approaches to create reasonable\
    \ feature sets, but as a result, we end up with multiple possibilities. In the\
    \ spirit of DoE, we call this a factor of feature sets. The number of feature\
    \ set possibilities defines the number of levels of this factor. In the process\
    \ of building the classifier, we need to make a decision which one of these feature\
    \ sets, or, in other words, which level of the feature set factor, works best\
    \ for our classification problem.\n\nAs the next step, we need to make up our\
    \ mind about the machine learning method that we will use to build the classifier.\
    \ Suppose we have reasons to choose a specific method. However, if this is not\
    \ the case, then we have one more factor that can be named as a machine learning\
    \ method. The number of levels of this factor is defined by the number of methods\
    \ we want to try for building the classifier.\n\nAs discussed in Chapter 2, using\
    \ machine learning methods requires assigning values to hyperparameters. For example,\
    \ in the case of neural network, a decision should be made about a type of activation\
    \ function, a number of hidden layers, neurons in each layer, etc. And in the\
    \ case of support vector machine, we need to choose a kernel and its parameters,\
    \ as well as the value of the cost parameter. Hyperparameters can be categorical\
    \ (as an activation function or a type of kernel), integer (as a number of layers\
    \ or degree of the polynomial kernel), or continuous (as a `γ` parameter of Gaussian\
    \ kernel or a cost parameter). For categorical parameters, the number of levels\
    \ is identified as a number of unique categorical values of the parameter. For\
    \ integer parameters, the number of levels can be a number of unique integer values\
    \ of the parameter, or, in case of many possible values, a number of intervals\
    \ to which the values are grouped. In the case of continuous parameters, the values\
    \ must be grouped into intervals, the number of which defines a number of levels.\n\
    \nAn additional factor is a level of data contamination, where different ratios\
    \ of data contamination define a number of this factor’s levels.\n"
  raw: "*β*[0], *β*[1], …, *β*[*p*] are unknown fixed-effects parameters to be estimated,\
    \ *ε*[*i*] are unknown independent and identically normally distributed random\
    \ variables, *ε*[*i*]~*N*(0,σ²).\n\nThe assumption that *y*^i are independently\
    \ distributed is too restrictive. The mixed model extends the linear model (equation\
    \ 5.10) by allowing responses to be correlated. Such an extension permits random\
    \ effects and random coefficients in the analysis. The general linear mixed model\
    \ is denoted as follows:\n\n*y*[*i**j*] = *β*[0] + *β*[1]*x*[*i**j*1] + … + *β*[*p*]*x*[*i**j**p*] + *γ*[*i*1]*z*[*i**j*1] + … + *γ*[*i**q*]*z*[*i**j**q*] + *ε*[*i**j*],  *i* = 1, …,  *n*,  *j* = 1, …,  *m*   (5.11) \
    \ \n\nwhere\n\n*y*[*ij*] is the value of the response variable for the observation\
    \ *i* in group *j*, *β*[0], *β*[1], …, *β*[*p*] are unknown fixed-effects parameters,\n\
    \n*x[*ij1*], …, *x*[*ijp*] are the fixed-effect regressors for observation *i*\
    \ in group *j*,*\n\n*γ*[*ik*], *k*\\=1,…, *m* are unknown random variables, *γ*[*i**k*] ∼ *N*(0,*φ*[*k*]^(2 )),  \
    \ Cov(*φ*[*k*],*φ*^′[*k*]) = *φ*^′[*k**k*] ; *φ*[*k*]^(2 ) are the variances and\
    \ *φ*^′[*k**k*] the covariances among the random effects, assumed to be constant\
    \ across groups,\n\n*z*[*ij1*], …, *z*[*iq*] are the random-effect regressors,\
    \ *ε*[*ij*] are unknown random variables assumed to be multivariately normally\
    \ distributed for group *j*.\n\nIn contrast to the standard linear model (equation\
    \ 5.10), the residuals associated with observations in group *j* can be correlated.\n\
    \nThe distinction between fixed and random factors, as well as their effects on\
    \ a response variable, is critical in the context of linear mixed models. We refer\
    \ the readers who are interested in studying the linear mixed models underlying\
    \ theory to the extensive statistical literature on the topic, for example, Littell\
    \ et al. (2007) and Verbeke and Molenberghs (1997).\n\n### [5.2.6 Factors and\
    \ Response Variables in the AI Framework](#C02a_toc.xhtml#rsec5_2_6)\n\nLet’s\
    \ consider the process of building a classifier using the design of experiment\
    \ framework.\n\nWe may choose different approaches to create reasonable feature\
    \ sets, but as a result, we end up with multiple possibilities. In the spirit\
    \ of DoE, we call this a factor of feature sets. The number of feature set possibilities\
    \ defines the number of levels of this factor. In the process of building the\
    \ classifier, we need to make a decision which one of these feature sets, or,\
    \ in other words, which level of the feature set factor, works best for our classification\
    \ problem.\n\nAs the next step, we need to make up our mind about the machine\
    \ learning method that we will use to build the classifier. Suppose we have reasons\
    \ to choose a specific method. However, if this is not the case, then we have\
    \ one more factor that can be named as a machine learning method. The number of\
    \ levels of this factor is defined by the number of methods we want to try for\
    \ building the classifier.\n\nAs discussed in [Chapter 2](#C08_chapter2.xhtml#chapter2),\
    \ using machine learning methods requires assigning values to hyperparameters.\
    \ For example, in the case of neural network, a decision should be made about\
    \ a type of activation function, a number of hidden layers, neurons in each layer,\
    \ etc. And in the case of support vector machine, we need to choose a kernel and\
    \ its parameters, as well as the value of the cost parameter. Hyperparameters\
    \ can be categorical (as an activation function or a type of kernel), integer\
    \ (as a number of layers or degree of the polynomial kernel), or continuous (as\
    \ a *γ* parameter of Gaussian kernel or a cost parameter). For categorical parameters,\
    \ the number of levels is identified as a number of unique categorical values\
    \ of the parameter. For integer parameters, the number of levels can be a number\
    \ of unique integer values of the parameter, or, in case of many possible values,\
    \ a number of intervals to which the values are grouped. In the case of continuous\
    \ parameters, the values must be grouped into intervals, the number of which defines\
    \ a number of levels.\n\nAn additional factor is a level of data contamination,\
    \ where different ratios of data contamination define a number of this factor’s\
    \ levels.\n\n### [5.2.7 Example](#C02a_toc.xhtml#rsec5_2_7)\n\nLet’s say we would\
    \ like to build a classifier for a dataset with 42 features, and suppose we decided\
    \ to build a classifier using SVM with the sigmoid (hyperbolic tangent) kernel.\n\
    \n*K*(*x*,*x*^′) = tanh (*α**x*^(*T*)*x*^′+*b*)   (5.12)  \n\nwhere *α* > 0 and\
    \ *b* < 0 .\n\nThe two hyperparameters of the sigmoid kernel are *α* and *b*.\
    \ In some literature, it is suggested to use *α* = 1/*N* , where *N* is the data\
    \ dimension. In the case of 42 features, this value is 0.024, but we will use\
    \ this value only as a starting point of our search of the values of the hyperparameters.\
    \ As we do not have any reason to assume a linear relationship, we start with\
    \ three levels for each factor. Let’s set *α* on three levels defined as the following\
    \ intervals: (0; 0.1\\], (0.1, 0.2\\], and (0.2, 0.3\\]; and the intercept *b*\
    \ on three levels (−4; −3\\], (−3; −2\\], and (−2; −1\\].\n\nLet’s say we are\
    \ looking for a classifier with the highest sensitivity (true positive rate).\
    \ We need to find what combination of the kernel hyperparameters allows us to\
    \ build a classifier that fits our criterion. In addition, we need to choose a\
    \ value for cost variable *C*. As discussed in [Chapter 2](#C08_chapter2.xhtml#chapter2),\
    \ for large values of cost value *C*, the SVM method will choose a smaller-margin\
    \ hyperplane if that hyperplane does a better job of getting all the training\
    \ points classified correctly. On the other hand, a very small value of *C* will\
    \ cause the optimization part of SVM to look for a larger-margin separating hyperplane,\
    \ even if that hyperplane misclassifies more points. Controlling for wider- or\
    \ narrower-margin hyperplane allows addressing the problem of bias–variance trade-off.\
    \ Let’s assign three levels to the cost variable as (10; 100\\], (100; 300\\],\
    \ and (300; 600\\].\n\nThe values of parameters in intervals associated with a\
    \ specific level are given by random selection according to uniform distribution\
    \ from the interval.\n\nAs discussed in [Chapter 3](#C09_chapter3.xhtml#chapter3),\
    \ we create multiple training datasets to increase data variability, and for this\
    \ example, let’s use 1,000 training datasets.\n\nSo, our experiment has three\
    \ factors: hyperparameters *α* and *b* and cost parameter *C*, all on three levels,\
    \ 1,000 training datasets; and sensitivity is the response variable. Thus, the\
    \ design presented in [Table 5.1](#C11_chapter5.xhtml#tab5_1) works for this example,\
    \ where factor A stands for the hyperparameter *α* , factor B stands for the hyperparameter\
    \ *b*, and factor C stands for the cost parameter *C*. Each run of the experiment\
    \ is randomly assigned to the training datasets, creating 37 replications per\
    \ run. Execution of each run of this experiment includes the following steps:\n\
    \n1.  Calculate the values of hyperparameters by a random selection of a value\
    \ from an interval defined by the factor level. Let’s say we execute run number\
    \ 15 (see [Table 5.1](#C11_chapter5.xhtml#tab5_1)), where factor A is on level\
    \ 1, factor B is on level 1, and factor C is on level 2. Then, the hyperparameter\
    \ α is randomly selected from the interval (0.1, 0.2\\], the hyperparameter *b*\
    \ is randomly selected from the interval (−3; −2\\], and the cost parameter *C*\
    \ is randomly selected from the interval (300; 600\\].\n\n2.  Estimate the classifier\
    \ model using SVM with the sigmoid (hyperbolic tangent) kernel and the set of\
    \ hyperparameters defined in Step 1 for each replication in each run.\n\n3.  For\
    \ each classifier, calculate sensitivity. In the experiment of this example, we\
    \ will receive 37 values of sensitivity for each run.\n\nAs a next step, the results\
    \ of this experiment need to be analyzed using ANOVA and linear mixed model approach.\n\
    \n### [5.2.8 Analysis of Linear Mixed Model Using SAS](#C02a_toc.xhtml#rsec5_2_8)"
