    \ of events follow a certain probability distribution. As a consequence, the Cox\
    \ model is considerably robust.\n\n    The Cox hazard model can be written as:\n\
    \n    ${h\\_{i}(t) = h\\_{0}(t)\\\\exp{\\\\sum\\\\limits\\_{j = 1}^{k}{\\\\beta\\\
    _{j}x\\_{ij}}}}\\\\mspace{54mu}\\\\operatorname{(11.2)}$ \n\n    where:\n\n  \
    \  *h*[i](*t*)—the hazard function for subject *i* at time *t*\n\n    *h*[0](*t*)—the\
    \ baseline hazard function, that is, the hazard function for the subject whose\
    \ covariates *x*[1], …, *x*[k] all have values of 0.\n\n    The Cox hazard model\
    \ is also called the proportional hazard model if the hazard for any subject is\
