- fmt: "\n```sas\nPROGRAM SVM.SAS\nDESCRIPTION Support Vector Machine for Classification\
    \ In SAS By R\nUSAGE %%svm (train=, validate=, result=, targetvar=, tmppath=,\
    \ rpath=)\nPARAMETERS train = dataset for training\nvalidate = dataset for validation\
    \ mis - is the code identifying the missing value\nresult = dataset created after\
    \ prediction\ntargetvar = target variable\ntmppath = temporary path to store the\
    \ exchange files between SAS and R\nrpath = path for R executable\nREQUIRES e1071\
    \ and foreign R packages should be installed\nAUTHORS T.Kolosova and S.Berestizhevsky\n\
    */\n%macro svm (train = , validate = , result = , targetvar = , tmppath = , rpath\
    \ = );\n   proc export data = &train outfile = \"&tmppath\\sas2r_train.csv\" replace;\n\
    \   run ;\n    proc export data = &validate\n      outfile = \"&tmppath\\sas2r_validate.csv\"\
    \ replace;\n   run;\n   proc sql;\n        create table _tmp0 (string char(200));\n\
    \      insert into _tmp0\n      set string = 'train=read.csv(\"sas_path/sas2r_train.csv\"\
    ,header=T)'\n      set string = 'validate=read.csv(\"sas_path/sas2r_validate.csv\"\
    ,header=T)'\n      set string = 'require(e1071,quietly=T)'\n      set string =\
    \ 'model=svm(sas_targetvar ~ . ,data=train)'\n      set string = 'predicted=predict(model,\
    \ newdata = validate,type=\"class\")'\n      set string = 'result=as.data.frame(predicted)'\n\
    \      set string = 'require(foreign, quietly=T)'\n      set string = 'write.foreign(result,\"\
    sas_path/r2sas_tmp.dat\",\"sas_path/r2sas_tmp.sas\",package=\"SAS\")' ;\n   quit;\n\
    \   \n   data _tmp1;\n      set _tmp0;\n      string = tranwrd(string, \"sas_targetvar\"\
    , propcase(\"&targetvar\"));\n      string = tranwrd(string, \"sas_path\", translate(\"\
    &tmppath\", \"/\", \"\\\"));\n   run;\n   \n   data _null_;\n      set _tmp1;\n\
    \      file \"&tmppath\\sas_r.r\";\n      put string;\n   run;\n   \n   options\
    \ xsync xwait;\n   \"R.exe BATCH --vanilla --slave &tmppath\\sas_r.r\";\n   %include\
    \ \"&tmppath\\r2sas_tmp.sas\";\n   data &result;\n      set &validate;\n     \
    \ set rdata;\n   run;\n   \n   proc datasets nolist;\n      delete rdata;\n  \
    \ quit;\n%mend;\n%svm(train = iris, validate = iris, result = iris_result, targetvar\
    \ = species, tmppath = c:\\temp, rpath = C:\\Program\\R\\R-3.3\\bin\\x64\\R.exe);\n\
    ```\n\n# This environment facilitates fast and robust implementation. This chapter\
    \ described tables as well as SAS and R programs. In the next chapters, we demonstrate\
    \ how to extend table-driven environment to address such tasks as data input,\
    \ bootstrap, design of experiments, and support vector machine classification.\n\
    \n## 6.5 Summary\n\nThis chapter introduced the table-driven environment that\
    \ is used for the development of AI framework. This environment supports code-free\
    \ design and facilitates robust implementation.\n\n## Reference\n\n1. Kolosova,\
    \ T., and Berestizhevsky, S. 1995. *Table-Driven Strategies for Rapid SAS Applications*.\
    \ Cary, NC: SAS Institute, Inc.\n\n# 7 Input Data Component\n\n## 7.1 Overview\
    \ of Data Management\n\nA data dictionary for input component is created to understand\
    \ the meaning of input data (e.g., training and testing datasets) and define the\
    \ processes of data cleansing and generation of multiple training/or testing subsamples.\
    \ The data dictionary for input component is always used during data analysis\
    \ so that the meaning of variables and their values will never be a question.\n\
    \nBecause input datasets are usually flawed, data cleansing is a very important\
    \ step in the machine learning process. Data cleansing is the process used to\
    \ identify inaccurate, incomplete, or improbable data and then to correct it when\
    \ possible.\n\nEven if you think you have good-quality data, you can still run\
    \ into problems with biases hidden within your training datasets. Thus, input\
    \ data component is used to define data cleansing processes that include detection\
    \ and treatment of outliers and bias corrections. Usually, data cleansing comprises\
    \ of two stages: detection and correction, and we define these stages as metadata\
    \ in the data dictionary for input component.\n\n### 7.1.1 Data Dictionary\n\n\
    #### 7.1.1.1 The Input Data Dictionary\n\nThis data dictionary serves as a repository\
    \ for metadata that defines input and output datasets and data cleansing and bootstrapping\
    \ processes. This metadata is then used by SAS macros or R-written programs to\
    \ generate (execute) defined in the data dictionary processes such as the creation\
    \ of output multiple datasets (subsamples of training and testing datasets) as\
    \ well as perform cleansing and bootstrapping processes. Changes in the data dictionary\
    \ metadata will essentially change the needed processes to clean data and/or create/testing\
    \ datasets. The definition of processes as data (metadata) allows the execution\
    \ of such processes without changing the source code of SAS macros and/or R-written\
    \ programs.\n\nA data dictionary for input component includes, at a minimum, source\
    \ dataset name, variable names, variable types, variable descriptions or labels,\
    \ and output datasets (training and testing). It also includes definitions of\
    \ data cleansing processes that in turn contain references to processes of outliers\
    \ detection and treatment. There are six tables that comprise input component\
    \ data dictionary. They are `Input`, `Structure`, `Outlier_Detection`, `Bias_Correction`,\
    \ `Bootstrap`, and `Output` tables. Relations among the tables of the data dictionary\
    \ for input component are presented in Figure 7.1.\n\n![FIGURE 7.1 Data dictionary\
    \ for input component.](images/file7.jpg)\n\n**FIGURE 7.1**\n\nData dictionary\
    \ for input component.\n\nBelow we provide a description of the structure of input\
    \ component tables along with examples of possible content.\n\n#### 7.1.1.2 Input\
    \ and Structure Tables\n\nThe columns of the Input table are defined as shown\
    \ in Table 7.1.\n\n**TABLE 7.1**\n\nColumns of the Input Table\n\n| Column Name\
    \ | Type | Length | Description |\n| --- | --- | --- | --- |\n| `INPUT_ID` | Character\
    \ | 8 | Input ID |\n| `TITLE` | Character | 80 | Input ID title |\n| `DATASET`\
    \ | Character | 8 | Dataset (file) name |\n| `OUTLIER_DETECTION_ID` | Character\
    \ | 8 | Reference to the primary key of the `Outlier_Detection` table |\n| `BIAS_CORRECTION_ID`\
    \ | Character | 8 | Reference to the primary key of the `Bias_Correction` table\
    \ |\n| `OUTPUT_TABLE_ID` | Character | 2 | Reference to the primary key of the\
    \ `Output` table |\n\nThe `INPUT_ID` column comprises the primary key of the Input\
    \ table. The Input table contains references to data cleansing processes to be\
    \ applied to data defined in the table. These references are defined in the `OUTLIER_DETECTION_ID`\
    \ and `BIAS_CORRECTION_ID` columns, and these columns comprise the primary keys\
    \ of the `Outlier_Detection` and `Bias_Correction` tables, respectively. Those\
    \ tables will be defined below.\n\nThe Structure table specifies the properties\
    \ of datasets. The Structure table lists the columns of each dataset. For each\
    \ column, the following information is defined: name of the dataset of which that\
    \ column is a part, column name, column data type, column length, and column role—label\
    \ or feature. Column role defines which column or columns are used to classify\
    \ data using labels and which represent data features. The columns of the Structure\
    \ table are defined as shown in Table 7.2.\n"
