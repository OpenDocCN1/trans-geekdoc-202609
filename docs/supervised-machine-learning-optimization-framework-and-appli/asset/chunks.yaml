- fmt: "\nIn statistics, a full-factorial experiment is defined as an experiment with\
    \ a design consisting of two or more factors, each with two or more discrete levels,\
    \ so that all possible combinations of the levels across all the factors are applied\
    \ to the experimental units (Box et al., 1978). All the possible combinations\
    \ of the levels across all the factors in a full-factorial design can be presented\
    \ on a hypercube in the `k`-dimensional design space defined by the minimum and\
    \ maximum levels of each of the `k` factors. The experimental points are sometimes\
    \ called factorial points. The total number of experimental runs is calculated\
    \ as a product of the numbers of levels of the factors. Let’s say we conduct a\
    \ full-factorial experiment with three factors `A`, `B`, and `C`, where `A`, `B`\
    \ and `C` are measured on three levels. Then, the experiment has $3³ = 27$ runs,\
    \ which are shown as a hypercube in [Figure 5.1](#C11_chapter5.xhtml#fig5_1).\n\
    \n![FIGURE 5.1 Hypercube for 33 full-factorial experiment.](images/file6.jpg)\n\
    \n**FIGURE 5.1**\n\nHypercube for $3³$ full-factorial experiment.\n\nThe full-factorial\
    \ $3³$ design of experiment is shown in [Table 5.1](#C11_chapter5.xhtml#tab5_1).\n\
    \n**TABLE 5.1**\n\nFull-Factorial $3³$ Design of Experiment\n\n| Run || A || B\
    \ || C || Run || A || B || C || Run || A || B || C |\n| --- | --- | --- | ---\
    \ | --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 || 0 || 0 || 0 || 10\
    \ || 1 || 0 || 0 || 19 || 2 || 0 || 0 |\n| --- | --- | --- | --- | --- | --- |\
    \ --- | --- | --- | --- | --- | --- |\n| 2 || 0 || 0 || 1 || 11 || 1 || 0 || 1\
    \ || 20 || 2 || 0 || 1 |\n| 3 || 0 || 0 || 2 || 12 || 1 || 0 || 2 || 21 || 2 ||\
    \ 0 || 2 |\n| 4 || 0 || 1 || 0 || 13 || 1 || 1 || 0 || 22 || 2 || 1 || 0 |\n|\
    \ 5 || 0 || 1 || 1 || 14 || 1 || 1 || 1 || 23 || 2 || 1 || 1 |\n| 6 || 0 || 1\
    \ || 2 || 15 || 1 || 1 || 2 || 24 || 2 || 1 || 2 |\n| 7 || 0 || 2 || 0 || 16 ||\
    \ 1 || 2 || 0 || 25 || 2 || 2 || 0 |\n| 8 || 0 || 2 || 1 || 17 || 1 || 2 || 1\
    \ || 26 || 2 || 2 || 1 |\n| 9 || 0 || 2 || 2 || 18 || 1 || 2 || 2 || 27 || 2 ||\
    \ 2 | |\n\nIf there are `m` replicates in an experiment, then each run will be\
    \ replicated `m` times. Replications are required to estimate an error from executing\
    \ the experiment under exactly the same conditions. A decision about number of\
    \ levels to be used for each factor is based on assumptions about the relations\
    \ of the factor and response variable. For example, one of the assumptions for\
    \ factors set at two levels is that the value of the response variable is approximately\
    \ linear over the range of the factor. Two-level designs are the lowest level\
    \ designs that meet basic criteria of designs—efficiency with respect to the number\
    \ of runs and the ability to identify significant effects. As mentioned above,\
    \ designs with factors on two levels can only describe linear (straight line)\
    \ relations. Designs with factors on three levels allow for check of main effects\
    \ linear and quadratic behavior, as well as examination of interaction terms involving\
    \ squares of the factors. In case there is a reasonable assumption that the relation\
    \ between a factor and the response has a cubic nature, and this assumption needs\
    \ be investigated in the experiment, then the factor should be defined on four\
    \ levels.\n\nFull-factorial experiments allow the investigator to study the effect\
    \ of each factor on the response, as well as the effects of all interactions between\
    \ factors on the response. The analysis of experimental data can be performed\
    \ using different methods, for example, multiple regression that models the relationship\
    \ between dependent variable (`y`) and independent variables (factors) and their\
    \ interactions, or ANOVA (analysis of variance) that explains how the total variation\
    \ is split into variation explained by the model and residual variation (Wu and\
    \ Hamada, 2000, 2009).\n\nLet’s consider the example of $3³$ design of experiment\
    \ presented in [Table 5.1](#C11_chapter5.xhtml#tab5_1) with three factors `A`,\
    \ `B`, and `C` measured on three levels. Suppose that the number of replications\
    \ is `m`. So, the number of factor–level combinations in the experiment is equal\
    \ to $3 \\times 3 \\times 3 = 27$. The linear model will look like following:\n\
    \n```\ny[ijkl] = \\mu + \\alpha[i] + \\beta[j] + \\gamma[k] + (\\α)[ij] + (\\\
    ag)[ik] + (\\β)[jk] + (αβ)[ijk] + \\epsilon[ijkl]\n```\nwhere $i, j, k=1,2,3$\
    \ and $l=1,\\dots, m$,\n\n$\\alpha[i]$, $\\beta[j]$, and $\\gamma[k]$ are the\
    \ `A`, `B`, and `C` main effects,\n\n$(\\α)[ij]$, $(\\ag)[ik]$, and $(\\β)[jk]$\
    \ are the `A \\times B`, `A \\times C`, and `B \\times C` two-factor interaction\
    \ effects, respectively,\n\n$(αβ)[ijk]$ is the `A \\times B \\times C` three-factor\
    \ interaction effect,\n\n$\\epsilon[ijkl]$ are independent errors distributed\
    \ as $N(0,\\sigma^2)$.\n\nThe ANOVA derivation is based on the following zero-sum\
    \ constraints:\n\n$$\n\\begin{array}{l}\n\\sum_{i=1}^{3}\\alpha_{i} = \\sum_{j=1}^{3}\\\
    beta_{i} = \\sum_{k=1}^{3}\\gamma_{k} =0 \\\\\n\\sum_{i=1}^{3}(\\alpha\\beta)_{ij}\
    \ = \\sum_{i=1}^{3}(\\alpha\\gamma)_{ik} = \\sum_{j=1}^{3}(\\alpha\\beta)_{ii}\
    \ = \\sum_{k=1}^{3}(\\alpha\\beta)_{ii} = \\sum_{k=1}^{3}(\\alpha\\gamma)_{ik}\
    \ = \\sum_{k=1}^{3}(\\beta\\gamma)_{jk} = \\sum_{k=1}^{3}(\\beta\\gamma)_{jk}\
    \ =00 \\\\\n\\sum_{i=1}^{3}(\\alpha\\beta\\gamma)_{ijk} = \\sum_{j=1}^{3}(\\alpha\\\
    beta\\gamma)_{ijk} = \\sum_{k=1}^{3}(\\alpha\\beta\\gamma)_{ijk} =0 \\\\\n\\end{array}\
    \ \\quad (5.2)\n$$ \n\nBased on these zero-sum constraints, we can derive the\
    \ following:\n\n$$\ny_{ijkl} = \\hat{\\mu} + \\hat{\\alpha}_{i} + \\hat{\\beta}_{j}\
    \ + \\hat{\\gamma}_{k} + (\\hat{\\alpha\\beta})_{ij} + (\\hat{\\alpha\\gamma})_{ik}\
    \ + (\\hat{\\beta\\gamma})_{jk} + (\\hat{\\alpha\\beta\\gamma})_{ijk} + r_{ijkl}\
    \ \\quad (5.3)\n$$\n\nwhere\n\n$$\n\\begin{array}{l}\n\\hat{\\mu} = \\overline{y}_{\\\
    dots} \\\\\n\\hat{\\alpha}_{i} = \\overline{y}_{i...} - \\overline{y}_{\\dots}\
    \ \\\\\n\\hat{\\beta}_{j} = \\overline{y}_{.j.. - \\overline{y}_{\\dots} \\\\\n\
    \\hat{\\gamma}_{k} = \\overline{y}_{..k.} - \\overline{y}_{\\dots} \\\\\n(\\hat{\\\
    alpha\\beta})_{ij} = \\overline{y}_{ij..} - \\overline{y}_{i...} - \\overline{y}_{.j..\
    \ + \\overline{y}_{\\dots} \\\\\n(\\hat{\\alpha\\gamma})_{ik} = \\overline{y}_{i.k.}\
    \ - \\overline{y}_{i...} - \\overline{y}_{..k.} + \\overline{y}_{\\dots} \\\\\n\
    (\\hat{\\beta\\gamma})_{jk} = \\overline{y}_{.jk.} - \\overline{y}_{.j.. - \\\
    overline{y}_{..k.} + \\overline{y}_{\\dots} \\\\\n(\\hat{\\alpha\\beta\\gamma})_{ijk}\
    \ = \\overline{y}_{ijk.} - \\overline{y}_{ij..} - \\overline{y}_{i.k.} - \\overline{y}_{.jk.}\
    \ + \\overline{y}_{i\\dots} + \\overline{y}_{.j..} + \\overline{y}_{..k.} - \\\
    overline{y}_{\\dots} \\\\\nr_{ijkl} = y_{ijkl} - \\overline{y}_{ijk.} \\\\\n\\\
    end{array} \\quad (5.4)\n$$ \n\nwhere the “.” in the subscript means averaging\
    \ over the levels of the corresponding factor or variable.\n\nNow, the corrected\
    \ total sum of squares and its components can be derived by subtracting $\\overline{y}_{\\\
    dots}$ from both sides of equation (5.3), then squaring them, and calculating\
    \ sums over *i*, *j*, *k*, *l*:\n"
