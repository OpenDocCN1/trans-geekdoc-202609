  raw: "Littell et al. (2007) is probably the best source describing SAS procedures\
    \ for the estimation of mixed models. The MIXED procedure is the one that we use\
    \ in the AI framework, as it fits a variety of mixed linear models and enables\
    \ using these fitted models to make statistical inferences about the data. The\
    \ CLASS statement of the MIXED procedure names the classification variables to\
    \ be used in the model. The MODEL statement names a single dependent variable\
    \ and the fixed effects, which determine the matrix of the mixed model. The RANDOM\
    \ statement defines the random effects of the mixed model and can be used to specify\
    \ variance component models as well as random coefficients. The random effects\
    \ can be classification, and then defined in the CLASS statement, or continuous.\
    \ The LSMEANS statement computes least squares means of fixed effects.\n\nAn example\
    \ described in 5.2.7 can be analyzed using PROC MIXED.\n\n```\nproc mixed data=svm_experiment;\n\
