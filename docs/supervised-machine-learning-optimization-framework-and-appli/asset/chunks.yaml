    现在，自助法（bootstrap procedure）使用了更多关于 `X` 分布的信息；因此，它应该生成一组更合理的自助采样值 `μ̂[*i*]^(\*)
    = μ̂(*X*[(*i*)]^(\*))`。


    在图 3.1 所示的自助处理过程中，使用 `F(θ̂,z)` 代替 `F̂(z)` 被称为参数自助，而使用 `F̂(z)` 则被称为非参数自助。


    ### 3.2.5 m-out-of-n 自助法](#C02a_toc.xhtml#rsec3_2_5)


    如上所示，基本的非参数自助提取的自助样本大小与原始样本大小 `n` 相同。这是 Efron 首次引入的方法。然而，很快，选择小于原始样本大小 `n` 的自助样本大小
    `m` 的可能性成为了一个研究的主题。这种自助被称为“m-out-of-n”自助法，并由许多作者进行了研究，例如 Bickel 等（1997）。


    当适当选择 `m` 时，m-out-of-n 自助法成功应用于基本非参数自助无法保持一致的情况。为了产生一致估计，渐近理论要求在 `n→∞` 时 `m→∞`，但速度较慢，使得
    `m/n→0`。如果我们选择 `m = o(n)`，则自助均是一致的。Athreya (1987) 证明了应用 m-out-of-n 自助时自助值的收敛性。惊讶的是，这种简单的补救方法在各种示例均有效，包括依赖观测和独立观测。这些示例包括数据具有无限矩的情况（例如重尾分布），或者数据分布具有极值的情况，或者是另一种有限总体的情况，例如调查抽样数据。


    ### 3.2.6 自助样本相似性](#C02a_toc.xhtml#rsec3_2_6)


    在使用 m-out-of-n 自助法生成多个训练和测试数据集时，我们力求根据观测选择的随机性增加样本数据集之间的变异性。始终存在两个随机选择的样本由非常相似的观测子集组成，样本量越大，这种相似性的概率就越高。将相同的机器学习方法应用于两个非常相似的训练数据集极可能会产生非常相似的分类器。这本身并不是一个问题，但我们的兴趣是创建不同的分类器，而且估计过程计算成本很高。我们建议应用
    Jaccard 相似系数（也称为 Jaccard 指数）来识别高度相似的数据集并排除或重新生成其中一个。


    Jaccard 相似系数用于衡量有限样本数据集之间相似性和多样性的统计量。Jaccard 系数定义为样本集交集的大小除以并集的大小：


    ${J\left( {A,\operatorname{}B} \right) = \frac{\left| {A \cap B} \right|}{\left|
    {A \cup B} \right|} = \frac{\left| {A \cap B} \right|}{A + B - \left| {A \cap
    B} \right|}}\mspace{54mu}\operatorname{(3.14)}$


    其中：


    - `|A∩∩ B|` 是 `A` 和 `B` 数据集交集的大小，

    - `|A∪ B|` 是 `A` 和 `B` 样本数据集并集的大小。


    Jaccard 相似系数统计量的局限性：`0 ≤ J(A,B) ≤ 1`，当 `A` 和 `B` 数据集均为空时，定义为 `J(A,B) = 1`。


    另一个统计量 Jaccard 距离衡量了两个样本数据集之间的差异。它是 Jaccard 系数的补数，通过 1 减去 Jaccard 系数得到：


    ${D_{J}\left(A,B) \right) = 1 - \frac{\left| {A \cap B} \right|}{\left| {A \cup
    B} \right|}}\mspace{54mu}\operatorname{(3.15)}$


    使用 `J(A,B)` 或 `DJ` 识别这些样本，用于构建分类器。

