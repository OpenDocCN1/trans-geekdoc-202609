    ### 5.2.9 Analysis of Linear Mixed Model Using R


    The `lme4` R package was developed by the team of Douglas Bates, Martin Maechler,
    Ben Bolker, and Steven Walker, and it provides functions to fit and analyze linear
    mixed models, generalized linear mixed models, and nonlinear mixed models. An
    alternative to `lme4` for mixed modeling in R is the `nlme` package authored by
    José Pinheiro and Douglas Bates. The main differences between the `nlme` and `lme4`
    packages are as follows:


    * `lme4` uses modern, efficient linear algebra methods from the `eigen` package
    and uses reference classes, and thus, it is faster and more memory-efficient than
    `nlme` while using large objects.

    * `lme4` includes generalized linear mixed model capabilities leveraging the `glmer`
    function.

    * `lme4` does not currently implement features for modeling heteroscedasticity
    and correlation of residuals, which are implemented in `nlme`.

    * `lme4` offers built-in features for likelihood profiling and parametric bootstrapping.

    * `lme4` is more modular than `nlme`, and its components are easier to reuse for
    extensions of the basic mixed model framework.


    In our framework, we use the `lme4` package that provides functions for fitting
    and analyzing mixed models, `lmer` for linear models, `glmer` for generalized
    linear models, and `nlmer` for nonlinear models. The parameters of these functions
    are described in Table 5.9.


    **TABLE 5.9**


    Arguments of the `lmer`, `glmer`, and `nlmer` Functions


    | | Argument | Functions | Description |

    | --- | --- | --- | --- |

    | 1 | `formula` | `lmer`, `glmer`, `nlmer` | A two-sided linear formula object
    describing both the fixed-effects and random-effects parts of the model; for `nlmer`,
    it is a three-part “nonlinear mixed model” formula |

    | 2 | `data` | `lmer`, `glmer`, `nlmer` | An optional data frame containing the
    variables named in the formula |

    | 3 | `family` | `glmer` | A GLM family |

    | 4 | `REML` | `lmer` | A logical parameter—to choose the REML criterion vs. log-likelihood
    |

    | 5 | `control` | `lmer`, `glmer`, `nlmer` | A list containing control parameters,
    including the nonlinear optimizer to be used and parameters to be passed through
    to the nonlinear optimizer |

    | 6 | `start` | `lmer`, `glmer`, `nlmer` | A named list of starting values for
    the parameters in the model, or a numeric vector |

    | 7 | `nAGQ` | `glmer`, `nlmer` | The number of points per axis for evaluating
    the adaptive Gauss–Hermite approximation to the log-likelihood |

    | 8 | `subset` | `lmer`, `glmer`, `nlmer` | An optional expression indicating
    the subset of rows that should be used in the fit |

    | 9 | `weights` | `glmer`, `nlmer` | An optional vector of “prior weights” to
    be used in the fitting process |

    | 10 | `offset` | `glmer`, `nlmer` | An a priori known component to be included
    in the linear predictor during fitting |

    | 11 | `mustart` | `glmer` | Optional starting values on the scale of the conditional
    mean |


    The selection of what function to use depends on the structure of the model. For
    the example in 5.2.7, `lmer` can be successfully applied.


    ### 5.3 Summary


    The selection of a set of hyperparameters is a process that is far from intuitive
    or allowing some “rule-of-thumb” approach. At the same time, the impact of hyperparameter
    values on the quality of classifiers estimated with such hyperparameters is tremendous.
    There are not only an infinite number of values of each hyperparameter, but what
    is more important, there are also an infinite number of combinations of hyperparameters
    that impact the quality of classifiers. Without a systematic approach, to find
    sets of hyperparameters that lead to better classifiers is impossible. In this
    chapter, we demonstrated how design of experiment methodology is used as a framework
    for optimizing values of hyperparameters, with the objective to find the best
    setup for classifiers. We also reviewed the functions available in SAS and R to
    design experiment and analyze its results.


    ### References


    1. Box, G. E., Hunter, W. G., and Hunter, J. S. 1978. *Statistics for Experimenters:
    An Introduction to Design, Data Analysis, and Model Building*. New York: Wiley.

    2. Cochran, W. G., and Cox, G. M. 1997. *Experimental Designs*. 2nd Ed. New York:
