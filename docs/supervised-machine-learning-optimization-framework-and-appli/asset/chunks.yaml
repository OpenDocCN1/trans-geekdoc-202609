    \ of instances corresponding to the predicted and actual labels (see [Table 2.1](#C08_chapter2.xhtml#tab2_1)).\n\
    \n**TABLE 2.1**  \n\nMisclassification Matrix\n\n| Predicted Actual || Label “TRUE”\
    \ || Label “FALSE” |\n\n| --- | --- | --- |\n\n| Label “TRUE” || TP (true positive)\
    \ || FP (false positive) |\n\n| --- | --- | --- |\n\n| Label “FALSE” || FN (false\
    \ negative || TN (true negative) |\n\n|  || *P* (condition positive) || *N* (condition\
    \ negative) |\n\nThe metric of sensitivity, also called recall or hit rate, measures\
    \ the true-positive rate (TPR):\n\n${\\\\text{TPR} = \\\\frac{\\\\text{TP}}{P}\
    \ = \\\\frac{\\\\text{TP}}{\\\\text{TP} + \\\\text{FN}} = 1 - \\\\text{FNR}}\\\
    \\mspace{54mu}\\\\operatorname{(2.1)}$ \n\nwhere\n\nTP is the frequency of true-positive\
    \ instances,\n\n*P* is the number of actual positive cases,\n\nFN is the frequency\
    \ of false-negative instances,\n\nFNR is the false-negative rate.\n\nThe metric\
    \ of specificity, also called selectivity, measures the true-negative rate (TNR):\n\
    \n${\\\\text{TNR} = \\\\frac{\\\\text{TN}}{N} = \\\\frac{\\\\text{TN}}{\\\\text{TN}\
    \ + \\\\text{FP}} = 1 - \\\\text{FPR}}\\\\mspace{54mu}\\\\operatorname{(2.2)}$\
    \ \n\nwhere\n\nTN is the frequency of true-negative instances,\n\n*N* is the number\
    \ of actual negative cases,\n\nFP is the frequency of false-positive instances,\n\
    \nFPR is the false-positive rate.\n\nThere are also other metrics that are calculated\
    \ based on misclassification matrix, for example precision that measures positive\
    \ predictive value (PPV), or false discovery rate (FDR), or other metrics.\n\n\
    The separate testing dataset contains both features and labels, but was not used\
    \ for building the classifier. The reason we use the testing dataset is an attempt\
    \ to address the key challenge of supervised learning: the problem of generalization.\
    \ In fact, most machine learning methods build classifiers that produce very accurate\
    \ classifications on the training datasets. However, we want to know the ability\
    \ of the classifier to generalize for new data points (unseen data) that were\
    \ not present in the training dataset.\n\nThe principles described above, however,\
    \ leave out some important details. For example, each machine learning method\
    \ has a set of hyperparameters, the values of which should be specified before\
    \ building the classifier. These hyperparameters define the process of building\
    \ a classifier, but their values cannot be inferred from training datasets. How\
    \ can we specify the values of the hyperparameters that allow us to build the\
    \ best classifiers?\n\nAnother important issue is the selection of the best classifier.\
    \ Different classifiers can have very close ratios of correctly classified objects\
    \ within each category. Let us say we need to build a classifier for the case\
    \ with two output values, or labels, 0 and 1, and that the prediction of both\
    \ values is equally important. Now assume that we have built two classifiers:\
    \ the first one correctly predicting 90% of 0 and 85% of 1, while the second one\
    \ correctly predicting 85% of 0 and 90% of 1. What criteria should be considered\
    \ to choose the best classifier and do we, actually, need to choose only one?\n\
    \nAnother important issue is the robustness of the classifier. Building and testing\
    \ a classifier on available data does not guarantee the quality of the classifier\
    \ applied to unseen data. What can be done to estimate the ability of a classifier\
    \ to deal with previously unobserved data?\n\nAll these questions arise when we\
    \ try to solve real-life problems using machine learning methods. Prior to attempting\
    \ to answer them, let us review some of the machine learning methods.\n\n## [2.3\
    \ Neural Network](#C02a_toc.xhtml#rsec2_3)\n\n### [2.3.1 Introduction](#C02a_toc.xhtml#rsec2_3_1)\n\
    \nThe neural network method was created as an attempt to mimic the way the human\
    \ brain processes and stores information (Haykin, 1999). The basic component of\
    \ the brain, the neuron, was discovered in 1836. It took more than 100 years till\
    \ the modern era of neural network research and development was initiated in the\
    \ classic paper “A Logical Calculus of the Ideas Immanent in Nervous Activity”\
    \ of W.S. McCulloch and W. Pitts.\n\nIn the paper written in 1943, McCulloch,\
    \ a neurophysiologist and cybernetician, and Pitts, a mathematician, proposed\
    \ the first mathematical model of a neural network. The unit of this model, called\
    \ a McCulloch–Pitts neuron, is still used in the field of neural networks.\n\n\
    A neural network creates connections between mathematical processing elements,\
    \ neurons. Knowledge is encoded into the network through the strength (weights)\
    \ of the connections between different neurons and by creating layers of neurons\
    \ that work in parallel.\n\nA neural network learns through the process of determining\
    \ the number of neurons, or nodes, and adjusting the weights for the connections.\
    \ The learning process uses a training dataset composed of input–output pairs\
    \ and tries to find a function that produces the outputs based on the given inputs.\
    \ The neural network approximates a function for the input domain derived from\
    \ the training data.\n\nThere are two main types of neural networks: fixed (non-adaptive)\
    \ and dynamic (adaptive). Fixed neural networks become set after completing the\
    \ learning process. All structure components such as weights, connections, and\
    \ node configurations become fixed, and the network turns into a function that\
    \ does not change during the operation. The appropriate use of a fixed neural\
    \ network would be a classification system in the conditions where the definition\
    \ of inputs and outputs does not change, and the network is expected to perform\
    \ the same classification repeatedly."
