    \ a similar role as the degree of the polynomial kernel in controlling the flexibility\
    \ of the resulting classifier.\n\nHyperbolic tangent, also known as the sigmoid\
    \ kernel, is yet another popular kernel function. It is defined by the following\
    \ formula:\n\n*K*(*x*,*x*^′) = tanh (*α**x*^(*T*)*x*^′+*b*)   (2.17)  \n\nwhere\
    \ *α* is sometimes referred to as the slope parameter and *b* as an intercept.\
    \ It plays a similar role as the degree of the polynomial kernel in controlling\
    \ the flexibility of the resulting classifier. It is interesting to observe that\
    \ an SVM model with a sigmoid kernel function is equivalent to a two-layer perceptron\
    \ neural network.\n\n### [2.4.3 Margin](#C02a_toc.xhtml#rsec2_4_3)\n\nThe margin\
    \ is the length of the normal vector to the hyperplane from the two closest cases\
    \ called support vectors; in other words, it is the margin with which the two\
    \ classes are separated.\n\nFor a given hyperplane, we denote by *x*[+](*x*[−])\
    \ the closest point to the hyperplane among the positive and negative cases. The\
    \ norm (length) of a vector *w* is denoted by $\\\\left\\\\| w \\\\right\\\\|\
    \ = \\\\sqrt{w^{T}w}$. From a geometric perspective, the margin of a hyperplane\
    \ f with respect to a dataset D can be defined as:\n\n${m\\_{D}\\\\left( f \\\\\
    right) = \\\\frac{1}{2}{\\\\hat{w}}^{T}\\\\left( {x\\_{+} - x\\_{-}} \\\\right)\\\
    \\frac{1}{\\\\left\\\\| w \\\\right\\\\|}}\\\\mspace{54mu}\\\\operatorname{(2.18)}$\
    \ \n\nwhere *ŵ* = *w*/∥*w*∥ is the unit vector in the direction of *w*, assuming\
    \ that *x*[+] and *x*[−] are equidistant from the decision boundary.\n\n### [2.4.4\
    \ Optimization](#C02a_toc.xhtml#rsec2_4_4)\n\nSVM uses a kernel function to find\
    \ a hyperplane that maximizes the distance (margin) between two classes while\
    \ minimizing training error. The maximum margin classifier is the discriminant\
    \ function that maximizes the geometric margin $\\\\frac{1}{\\\\left\\\\| w \\\
    \\right\\\\|}$ which is equivalent to minimizing ∥*w*∥². The soft-margin optimization\
    \ problem (Cortes and Vapnik, 1995) is formulated as follows:\n\n$\\\\begin{array}{l}\
    \ {{minimize}onw,b:\\\\frac{1}{2}\\\\left\\\\| w \\\\right\\\\|^{2} + C{\\\\sum\\\
    \\limits\\_{i = 1}^{n}e\\_{i}}} \\\\\\\\ {\\\\text{subject}\\\\text{to}:y\\_{i}\\\
    \\left( {w^{T}x\\_{i} + b} \\\\right) \\\\geq 1 - e\\_{i},e\\_{i} \\\\geq 0,i\
    \ = 1,\\\\ldots,n} \\\\\\\\ \\\\end{array}\\\\mspace{54mu}\\\\operatorname{(2.19)}$\
    \ \n\nwhere:\n\n*w* is the margin,\n\n*C* is the constant that sets the relative\
    \ importance of maximizing the margin and minimizing the amount of slack,\n\n\
    *e*[i] is the slack variables that allow a case to be in the margin (0 ≤ *e*[i]\
    \ ≤ 1, also called a margin error) or to be misclassified (*e*[i] > 1), *y*[i]\
    \ – the output results of the training dataset, also called labels,\n\n*b* is\
    \ the bias that translates the hyperplane away from the origin.\n\n### [2.4.5\
    \ Bias–Variance Trade-off and SVM Hyperparameters](#C02a_toc.xhtml#rsec2_4_5)\n\
    \nThe bias is an error caused by wrong assumptions in the learning algorithm.\
    \ High bias means an underfitting between features and outputs. The variance is\
    \ an error produced from variations in the sensitivity metric in response to small\
    \ fluctuations in the training sets. High variance means overfitting between features\
    \ and outputs.\n\nThe bias–variance trade-off is a central problem in supervised\
    \ learning. In statistics and machine learning, the bias–variance trade-off is\
    \ the property of a set of predictive models, where models with lower bias in\
    \ parameter estimation have a higher variance of the parameter estimates across\
    \ samples and vice versa. The bias–variance problem is the conflict in trying\
    \ to simultaneously minimize these two sources of error that prevent supervised\
    \ learning algorithms like SVM from generalizing beyond their training sets.\n\
    \nThe quality of the results produced by SVM depends on the following hyperparameters:\n\
    \n*   The type of kernel (radial, polynomial, sigmoid, etc.).\n\n*   The cost\
    \ of misclassification (penalty) that is denoted as *C* in equation (2.19),"
