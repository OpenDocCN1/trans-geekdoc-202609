    # Part II: 6 Introduction to the SAS- and R-Based Table-Driven Environment


    ## 6.1 Principles of Code-Free Design


    The massive proliferation of SAS and R has created new opportunities and new challenges
    for analytical applications designers and programmers. The user expectations for
    new analytical applications include short delivery lead times, ease of use, increased
    flexibility, and ability to scale. In response to these challenges, application
    designers and programmers are adopting rapid application development techniques.
    Code-free design is one of these techniques (Kolosova and Berestizhevsky, 1995).
    Code-free design lets the application designer describe applications visually,
    in terms of their functionality, and permits the development and maintenance of
    large-scale analytical applications without the writing of application computer
    code. The code is generated directly from definitions of application objects and
    actions to be applied to these objects. These definitions are created and stored
    in specially structured tables that comprise a table-driven environment, and the
    role of the application programmer is changed.


    The main principles of code-free design are as follows:

