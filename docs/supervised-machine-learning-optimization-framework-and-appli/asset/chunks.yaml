    \ function is calculated using hazard corresponding to season = 0 for time-to-event\
    \ *t* ≤ 92 and *t* > 244 days, and for time-to-event 92 < *t* ≤ 244 , it is calculated\
    \ using hazard corresponding to season = 1 . The survival function for this case\
    \ is presented in [Figure 11.7](#C17_chapter11.xhtml#fig11_7).\n\n    In comparison\
    \ with [Figure 11.3](#C17_chapter11.xhtml#fig11_3), where the winter season was\
    \ not taken into consideration, we can see that the proportion of survival drops\
    \ before the 100th day of the policy.\n\n    For the Utilities industry, there\
    \ is a 44% chance that there will be no claims before the 100th day of a policy\
    \ accounting for winter season vs. 65% without accounting for the winter season.\
    \ After that, the chances are dropping, and by the 210th day of the policy, there\
    \ is a 0% chance that there will be no claims in the Utilities industry, accounting\
    \ for the winter season.\n\n    For the Entertainment industry, there is a 66%\
    \ chance that there will be no claims by the 100th day of a policy when we take\
    \ winter season into consideration—vs. 72% otherwise. Also, there is about a 1%\
    \ chance that there will be no claims at all for a one-year policy—in comparison\
    \ with a 6.5% chance when we do not take the winter season into consideration.\n\
    \n    ![FIGURE 11.7 Survival functions for industries in Illinois for policies\
    \ starting on August 1.](images/file20.jpg)\n\n    **FIGURE 11.7**  \n\n    Survival\
    \ functions for industries in Illinois for policies starting on August 1.\n\n\
    \    The information revealed by the presented models can be used for the purposes\
    \ of underwriting and pricing, for the development of new insurance products,\
    \ and for marketing. For example, insurers can estimate the risk of claims more\
    \ accurately depending not only on the industry, but also on the time period when\
    \ the policy is started. Insurers can better manage anticipation of losses related\
    \ to claims. In addition, insurers can develop new workers′ compensation products\
    \ for a duration shorter than 1 year. In this case, the insurance during the periods\
    \ of lower risk will have a lower premium and therefore higher acceptance rate\
    \ by customers. Referring to the example when a policy starts on the 1st of April,\
    \ the 6-month policy would have a significantly lower risk and will justify lower\
    \ premiums. The marketing of such new products will attract companies seeking\
    \ workers′ compensation.\n\n    ![FIGURE 11.8 Hazard functions for industries\
    \ in Illinois for policies staring on August 1.](images/file21.jpg)\n\n    **FIGURE\
    \ 11.8**  \n\n    Hazard functions for industries in Illinois for policies staring\
    \ on August 1.\n\n    ## [11.5 Summary](#C02a_toc.xhtml#rsec11_5)\n\n    An ultimate\
    \ goal of insurance risk assessment is to create a profitable portfolio and to\
    \ fit the right price to the right risk. This complex problem comprises from multiple\
    \ parts, including estimation of risk, estimation of price, and monitoring of\
    \ market changes. In this chapter, we discussed one part of this complex problem—estimation\
    \ of risk of workers’ compensation claims for different industries and states\
    \ with season-dependent factor. Our method to estimate hazard function using a\
    \ Bayesian machine learning approach allows estimating the risk of claims per\
    \ industry and state, ranking industries by risk within states, and estimating\
    \ the risk depending on time-varying covariates like a season. As a next step\
    \ to build a profitable portfolio, the severity of claims should be included in\
    \ the analysis, which eventually will allow re-evaluating premiums and insurance\
    \ products to increase the profitability of portfolios.\n\n    ## [References](#C02a_toc.xhtml#rreferences-6)\n\
    \n    1.  Allison, P. D. 2012. *Survival Analysis Using SAS*. Cary, NC: SAS Publication.\n\
    \n    2.  Arjas, E. 1988. A graphical method for assessing goodness of fit in\
    \ Cox’s proportional hazards model. *American Statistical Association*, 83: 204–212.\n\
    \n    3.  Cox, D. R. 1972. Regression models and life-tables (with discussion).\
    \ *Journal of the Royal Statistical Society – Series B*, 34: 187–220.\n\n    4.\
    \  Gelfand, A. E., and Mallick, B. K. 1994. *Bayesian analysis of semiparametric\
    \ proportional hazards models*. Technical Report No. 479. Department of Statistics,\
    \ Stanford University.\n\n    5.  Gill, R., and Schumacher, M. 1987. A simple\
    \ test of the proportional hazards assumption. *Biometrika*, 74: 289–300.\n\n\
    \    6.  Hosmer, D. W., and Lemeshow, S. 1999. *Regression Modeling of Time to\
    \ Event Data*. New York: John Wiley & Sons, Inc.\n\n    7.  Ibrahim, J. G., Chen,\
    \ M. H., and Sinha, D. 2005. *Bayesian Survival Analysis*. Hoboken, NJ: Wiley\
    \ Online Library.\n\n    8.  Lee, E. T. 1992. *Statistical Methods for Survival\
    \ Data Analysis*. 2nd Ed. Oklahoma City: John Wiley & Sons, Inc.\n\n    9.  Thomas,\
    \ L., and Reyes, E. M. 2014. Tutorial: Survival estimation for Cox regression\
    \ models with time-varying coefficients using SAS and R. *Journal of Statistical\
    \ Software*, 2014: 61.\n\n    # [Index](#C02a_toc.xhtml#rindex)\n\n    *   Note:\
    \ **Bold** page numbers refer to tables and *italic* page numbers refer to figures.\n\
    \n    *   A/B testing [48](#C11_chapter5.xhtml#index_term1)\n\n    *   activation\
    \ function, neural network method [13](#C08_chapter2.xhtml#pg_13)–14, [*14*](#C08_chapter2.xhtml#pg_14)\n\
