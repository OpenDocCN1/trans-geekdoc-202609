- fmt: "\nTo formalize the underwriting decision-making process, we start with creating\
    \ the appropriate data structure.\n\n### 10.4.1 Data Structure\n\nLet `i` = `1…n`\
    \ denote underwriters, `j` = `1…m` denote applications, and `k` = `1…p` denote\
    \ insurance products for workers’ compensation. Each application is described\
    \ by a set of features (parameters), for example, the number of employees in the\
    \ company, ages of the employees, the industry code, the state/province, and number\
    \ of claims in the previous year. These features are standardized and presented\
    \ by a vector `A[j] = {a[j1], a[j2], … a[jM]}`, where `M` is the number of insurance\
    \ application features (parameters or characteristics).\n\nEach insurance product\
    \ is described by a set of features (parameters or characteristics), for example,\
    \ the conditions covered by the policy, the deductible amount, and premium amount.\
    \ Insurance product features are presented by a vector `B[k] = {b[k1], b[k2],\
    \ … b[kP]}`, where `P` is the number of insurance product features. These features\
    \ are standardized for all products, and if, for example, feature `b[k2]` is not\
    \ presented in the product `k`, then `b[k2]` is assigned 0.\n\nLet `Y[ijk]` denote\
    \ an outcome of each quoted insurance application—1 means bound, and 0 means rejected.\
    \ This structure allows capturing multiple quotes made by the same underwriter\
    \ as a response to the same insurance application. For example, the above-described\
    \ data structure may look like that in [Table 10.2].\n\n**TABLE 10.2**\n\nExample\
    \ of Data Structure\n\n| || || Features of Application || || Features of Product\
    \ || |\n| --- | --- | --- | --- | --- | --- |\n| Underwriter `i` | Application\
    \ `j` | Number of Employees `a[j1]` | % of Employees Under 21 `a[j2]` | % of Employees\
    \ Over 50 `a[j3]` | … | Claims in the Last Year `a[jM]` | Product `k` | Deductible\
    \ Amount `b[k1]` | … | Premium Amount `b[kP]` | Outcome `Y[ijk]` |\n| || … ||\
    \ … || … || … || … || … || … || … || … || … || … |\n| 10 || 100 || 30 || 5 ||\
    \ 3 || … || 0 || 1001 || 10,000 || … || 1,000 || 1 |\n| 10 || 105 || 100 || 2\
    \ || 10 || … || 5 || 1001 || 40,000 || … || 1,500 || 0 |\n| 10 || 105 || 100 ||\
    \ 2 || 10 || … || 5 || 1003 || 30,000 || … || 1,000 || 0 |\n || || || || || ||\
    \ ||0 ||0 || … || … || … || … ||0 || … |\n | … || … || … || … || … ||0 || … ||0\
    \ || … ||0 || ... |\n| 10 || 105 || 100 || 2 || 10 || … || 5 || 1001 || 40,000\
    \ || … || 1,500 || 0 |\n\n### 10.4.2 Classification Approach\n\nIn the broadest\
    \ sense, we use `SVM` to predict whether or not customer will accept. Because\
    \ `SVM` does not model the distribution, but instead directly minimizes the classification\
    \ error, the output produced by `SVM` is a binary decision. Although a binary\
    \ decision is sufficient for many problems, it is difficult to arrive at meaningful\
    \ bias–variance-off. This concern can be alleviated by applying penalized logistic\
    \ regression to `SVM` output. The benefit of using penalized logistic regression\
    \ to `SVM` output is making results more generalizable (e.g., decrease overfitting).\
    \ In classification, `SVM`, along with penalized logistic regression, creates\
    \ output probabilities of class membership rather than point estimates by `SVM`.\
    \ Rephrasing a classification problem as a probabilistic classification creates\
    \ conditions for application of bias–variance decomposition that was originally\
    \ formulated for least-squares regression.\n\n### 10.4.3 Bias–Variance Hyperparameters\n\
    \nBias is an error caused by erroneous assumptions. High bias means underfitting.\
    \ The variance is an error produced from variations in the training. The bias–variance\
    \ trade-off is a central problem in machine learning. In statistics, the bias–variance\
    \ trade-off is a property where models with lower bias have higher variance and\
    \ vice versa. To avoid bias in our analysis, we created training and test datasets\
    \ from the original dataset using the `m-out-of-n` bootstrap method with replacement.\
    \ For example, large `C` leads to low bias and high variance, while small `C`\
    \ leads to high bias and low variance. Large `d` or `γ` leads to high bias and\
    \ low variance, while small `d` or `γ` leads to low bias and high variance.\n\n\
    ### 10.4.4 Building the Classifier\n\nOur proposed AI solution attempts to “learn”\
    \ from the best underwriters. Thus in our study, we used only data related to\
    \ the top performers comprising 8% of all underwriters. The data we worked with\
    \ was structured to express all problems of similar nature by broadly including\
    \ all features (characteristics or parameters) of the insurance application and\
    \ the offered product and price, along with binary values `Y` (equivalent to acceptance\
    \ or rejection of a quote by a prospect) as presented in [Table 10.2].\n"
  raw: "To formalize the underwriting decision-making process, we start with creating\
    \ the appropriate data structure.\n\n### [10.4.1 Data Structure](#C02a_toc.xhtml#rsec10_4_1)\n\
    \nLet *i* = 1…*n* denote underwriters, *j* = 1…*m* denote applications, and *k*\
    \ = 1…*p* denote insurance products for workers’ compensation. Each application\
    \ is described by a set of features (parameters), for example, the number of employees\
    \ in the company, ages of the employees, the industry code, the state/province,\
    \ and number of claims in the previous year. These features are standardized and\
    \ presented by a vector *A*[j] = {*a*[j1], *a*[j2], … *a*[jM]}, where *M* is the\
    \ number of insurance application features (parameters or characteristics).\n\n\
    Each insurance product is described by a set of features (parameters or characteristics),\
    \ for example, the conditions covered by the policy, the deductible amount, and\
    \ premium amount. Insurance product features are presented by a vector *B*[k]\
    \ = {*b*[k1], *b*[k2], … *b*[kP]}, where *P* is the number of insurance product\
    \ features. These features are standardized for all products, and if, for example,\
    \ feature *b*[k2] is not presented in the product *k*, then *b*[k2] is assigned\
    \ 0.\n\nLet *Y*[ijk] denote an outcome of each quoted insurance application—1\
    \ means bound, and 0 means rejected. This structure allows capturing multiple\
    \ quotes made by the same underwriter as a response to the same insurance application.\
    \ For example, the above-described data structure may look like that in [Table\
    \ 10.2](#C16_chapter10.xhtml#tab10_2).\n\n **TABLE 10.2**  \n\nExample of Data\
    \ Structure \n\n|  ||  || Features of Application ||  || Features of Product ||\
    \  |\n\n| --- | --- | --- | --- | --- | --- |\n\n| Underwriter *i* || Application\
    \ *j* || Number of Employees *a*[*j1*] || % of Employees Under 21 *a*[*j2*] ||\
    \ % of Employees Over 50 *a*[*j3*] || … || Claims in the Last Year *a*[*jM*] ||\
    \ Product *k* || Deductible Amount *b*[*k1*] || … || Premium Amount *b*[*kP*]\
    \ || Outcome *Y*[*ijk*] |\n\n|  || … || … || … || … || … || … || … || … || … ||\
    \ … || … |\n\n| 10 || 100 || 30 || 5 || 3 || … || 0 || 1001 || 10,000 || … ||\
    \ 1,000 || 1 |\n\n| 10 || 105 || 100 || 2 || 10 || … || 5 || 1001 || 40,000 ||\
    \ … || 1,500 || 0 |\n\n| 10 || 105 || 100 || 2 || 10 || … || 5 || 1003 || 30,000\
    \ || … || 1,150 || 1 |\n\n| … || … || … || … || … || … || … || … || … || … ||\
    \ … || … |\n\n| 13 || 201 || 70 || 6 || 11 || … || 3 || 1002 || 22,000 || … ||\
    \ 1,500 || 0 |\n\n| 13 || 202 || 47 || 4 || 9 || … || 1 || 1002 || 11,000 || …\
    \ || 900 || 0 |\n\n| … || … || … || … || … || … || … || … || … || … || … || …\
    \ |\n\n### [10.4.2 Classification Approach](#C02a_toc.xhtml#rsec10_4_2)\n\nIn\
    \ the broadest sense, we try to solve the problem of predicting whether or not\
    \ the customer/prospect will accept the insurance product offered by an insurer.\
    \ We need to find a fit between the features (parameters or characteristics) of\
    \ the insurance application and the features of the insurance product and its\
    \ price. The substantial challenge is that data is very unbalanced: in our study,\
    \ bound insurance applications comprise about 9% of the quoted applications.\n\
    \nWe approach the problem using the support vector machine (SVM)—a proven classification\
    \ method that is also well suited to our problem because it can directly minimize\
    \ the classification error without requiring a statistical model (Cortes and Vapnik,\
    \ 1995). SVM can handle the massive feature space, and it is guaranteed to find\
    \ a globally optimal separating hyperplane if it exists. Also, SVM models are\
    \ built on the boundary cases, which allow them to handle missing data. SVM is\
    \ described in [Chapter 2](#C08_chapter2.xhtml#chapter2) of Part I.\n\n### [10.4.3\
    \ Bias–Variance Trade-Off and SVM Hyperparameters](#C02a_toc.xhtml#rsec10_4_3)\n\
    \nThe bias is an error caused by erroneous assumptions in the learning algorithm.\
    \ High bias means an underfitting between features and outputs. The variance is\
    \ an error produced from variations in the sensitivity metric in response to small\
    \ fluctuations in the training sets. High variance caused overfitting between\
    \ features and outputs.\n\nThe bias–variance trade-off is a central problem in\
    \ supervised learning. Unfortunately, it is impossible to create a classification\
    \ model that both accurately captures the regularities in its training data and\
    \ generalizes well to unseen data. In statistics and in machine learning, the\
    \ bias–variance trade-off is the property of a set of predictive models, whereby\
    \ models with lower bias in parameter estimation have a higher variance of the\
    \ parameter estimates across samples and vice versa. The bias–variance problem\
    \ is the conflict in trying to simultaneously minimize these two sources of error\
    \ that prevent supervised learning algorithms like SVM from generalizing beyond\
    \ their training sets.\n\nAs described in [Chapter 2](#C08_chapter2.xhtml#chapter2)\
    \ of Part I, large C leads to low bias and high variance, while small C leads\
    \ to high bias and low variance. Large *d* or *γ* leads to high bias and small\
    \ variance, while small d or *γ* leads to low bias and high variance. For example,\
    \ if *γ* is large (variance is small), it means that the SVM results do not have\
    \ a wide influence and cannot be generalized beyond its training sets.\n\nBecause\
    \ SVM does not model the data distribution, but instead directly minimizes the\
    \ classification error, the output produced by SVM is a binary decision. Although\
    \ a binary decision is sufficient for many problems, it is difficult to arrive\
    \ at a meaningful bias–variance trade-off. This concern can be alleviated by applying\
    \ penalized logistic regression to SVM output (see [Chapter 2](#C08_chapter2.xhtml#chapter2)\
    \ of Part I). The benefit of using penalized logistic regression to SVM output\
    \ is making results more generalizable (e.g., decrease overfitting). In classification,\
    \ SVM, along with penalized logistic regression, creates output probabilities\
    \ of class membership rather than point estimates produced by SVM alone. Rephrasing\
    \ a classification problem as a probabilistic classification creates conditions\
    \ for application of bias–variance decomposition that was originally formulated\
    \ for least-squares regression.\n\n### [10.4.4 Building the Classifier](#C02a_toc.xhtml#rsec10_4_4)\n\
    \nOur proposed AI solution attempts to “learn” from the best underwriters. Thus\
    \ in our study, we used only data related to the top performers comprising 8%\
    \ of all underwriters. The data we worked with was structured to express all problems\
    \ of similar nature by broadly including all features (characteristics or parameters)\
    \ of the insurance application and the offered product and price, along with binary\
    \ values *Y* (equivalent to acceptance or rejection of a quote by a prospect)\
    \ as presented in [Table 10.2](#C16_chapter10.xhtml#tab10_2).\n\nTo avoid bias\
    \ in our analysis, we created training and test datasets from the original dataset\
    \ using the “m-out-of-n” bootstrap method with replacement (Bickel and Ren, 1995).\
    \ This method replaced complicated and often inaccurate approximations of biases,\
    \ variances, and other measures of uncertainty by computer simulations. In simple\
    \ situations, the uncertainty of an estimate may be gauged by analytical calculation\
    \ based on an assumed probability model for the available data. But in more complicated\
    \ problems, this approach can be tedious and difficult, and its results are potentially\
    \ misleading if inappropriate assumptions or simplifications have been made. Applying\
    \ the “m-out-of-n” bootstrap method with replacement, we select 2,000 training\
    \ datasets that have the same distribution of outcome (reject/accept of insurance\
    \ quote) as the original dataset of the top performers’ data. We also randomly\
    \ select test datasets.\n\nStep 1"
