    \ final classifier, we select one that maximized sensitivity (the proportion of\
    \ bound applications that were correctly classified) and specificity (the proportion\
    \ of rejected quotes that were correctly classified) when applied to the training\
    \ datasets.\n\n**Step 3**\n\nAs a next step, to add a probabilistic element to\
    \ the SVM results, we apply Firth’s penalized logistic regression to the outcome\
    \ of the SVM algorithm (Firth, 1993). SVM produces complete separation data. Firth’s\
    \ penalized likelihood approach is a method of addressing issues of separability.\
    \ Firth’s method is available in the LOGISTIC procedure and only for binary logistic\
    \ models. It replaces the usual score equation:\n\n$g\\\\left( \\\\beta\\_{j}\
    \ \\\\right) = \\\\sum\\\\limits\\_{i = 1}^{n}\\\\left( {y\\_{i} - \\\\pi\\_{i}}\
    \ \\\\right)x\\_{ij} = 0\\\\left( {j = 1,\\\\ldots,p} \\\\right)$ \n\nwhere *p*\
    \ is the number of parameters in the model, with the modified score equation:\n\
