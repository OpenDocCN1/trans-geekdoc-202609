    \ …, *x*[k] all have values of 0 *g*[*n*](*t*) —the function of time (time itself,\
    \ log time, etc.)\n\n    *β*[1], …, *β*[*k*] —the coefficients of the Cox model.\n\
    \n    Applying this approach to the case of Illinois, our model looks like:\n\n\
    \    ${h\\_{i}(t) = h\\_{0}(t)\\\\text{exp}\\\\left( {\\\\sum\\\\limits\\_{j =\
    \ 1}^{6}{\\\\beta\\_{j}x\\_{j} + \\\\gamma \\\\times \\\\text{season} \\\\times\
    \ \\\\text{ln(}t\\\\text{)}}} \\\\right)}\\\\mspace{54mu}\\\\operatorname{(11.7)}$\
    \ \n\n    where: *h*[*i*](*t*) —the hazard function for industry *i* = 1, …,  6\
    \ at time *t*, where industries are Consulting, Entertainment, Finance, Hospitality,\
    \ Manufacturing, and Retail\n\n    *h*[0](*t*) —the baseline hazard function,\
    \ in our case the hazard function for one selected industry, by default the last\
