    因此，当使用带有 sigmoid 核的 SVM 构建分类器时，通过来自区间 (0.2, 0.3] 间的 `α` 超参数、区间 (−3; −2] 间的 `b`
    超参数以及区间 (10; 100] 间的代价变量，可以获得最佳的灵敏度。


    在这个实验示例中，我们没有考虑特异性（specificity）的值。因此，通过将此实验扩展到测量两个响应变量——敏感性和特异性，我们可能会识别出不同的获胜者。


    ### 5.2.9 使用 R 进行线性混合模型分析


    `lme4` R 语言包由 Douglas Bates、Martin Maechler、Ben Bolker 和 Steven Walker 团队开发，它提供了用于拟合和分析线性混合模型、广义线性混合模型和非线性混合模型的函数。在
    R 中，混合建模的 `lme4` 替代方案是由 José Pinheiro 和 Douglas Bates 编写的 `nlme` 包。`nlme` 和 `lme4`
    包之间的主要区别如下：


    * `lme4` 使用了来自 `eigen` 包的现代、高效的线性代数方法并使用了引用类（reference classes），因此在处理大型对象时，它比
    `nlme` 更快且更节省内存。

    * `lme4` 包含了利用 `glmer` 函数的广义线性混合模型能力。

    * `lme4` 目前没有实现异方差和残差相关建模的功能，而这些在 `nlme` 中是实现的。

    * `lme4` 提供了似然剖面分析（likelihood profiling）和参数自助法（parametric bootstrapping）的内置功能。

    * `lme4` 比 `nlme` 更具模块化，其组件更容易复用，以对基本混合模型框架进行扩展。


    在我们的框架中，我们使用 `lme4` 包，它提供了用于拟合和分析混合模型的函数：`lmer` 用于线性模型，`glmer` 用于广义线性模型，以及 `nlmer`
    用于非线性模型。这些函数的参数描述于表 5.9。


    **表 5.9**


    `lmer`、`glmer` 和 `nlmer` 函数的参数


    | | 参数 | 函数 | 描述 |

    | --- | --- | --- | --- |

    | 1 | `formula` | `lmer`, `glmer`, `nlmer` | 一个双侧线性公式对象，描述了模型的固定效应部分和随机效应部分；对于
    `nlmer`，它是一个三部分结构的“非线性混合模型”公式 |

    | 2 | `data` | `lmer`, `glmer`, `nlmer` | 一个包含公式中命名变量的可选数据框 |

    | 3 | `family` | `glmer` | 一个 GLM 族 |

    | 4 | `REML` | `lmer` | 一个布尔参数——用于选择 REML 准则还是对数似然 |

    | 5 | `control` | `lmer`, `glmer`, `nlmer` | 一个包含控制参数的列表，包括要使用的非线性优化器以及传递给非线性优化器的参数
    |

    | 6 | `start` | `lmer`, `glmer`, `nlmer` | 模型中参数初始值的命名列表，或数值向量 |

    | 7 | `nAGQ` | `glmer`, `nlmer` | 用于评估对数似然的自适应高斯-Hermite 近似时，每轴的点数 |

    | 8 | `subset` | `lmer`, `glmer`, `nlmer` | 一个可选表达式，指示在拟合中应使用的行子集 |

    | 9 | `weights` | `glmer`, `nlmer` | 用于拟合过程的“先验权重”可选向量 |

    | 10 | `offset` | `glmer`, `nlmer` | 拟合期间包含在线性预测器中的先验已知分量 |

    | 11 | `mustart` | `glmer` | 在条件均值尺度上的可选初始值 |


    使用哪种函数的选择取决于模型的结构。对于 5.2.7 中的示例，`lmer` 可以成功应用。


    ### 5.3 总结


    一组超参数的选择是一个远非直观的过程，也不允许某种“经验法则”方法。同时。

