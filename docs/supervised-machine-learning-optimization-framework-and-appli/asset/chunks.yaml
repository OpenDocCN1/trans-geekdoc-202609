  raw: "The idea of resampling procedures similar to the bootstrap has a long history,\
    \ associated with the use of computers to perform a simulation. First, such procedures\
    \ were mentioned in the early days of computing in the late 1940s. However, it\
    \ was Efron (1979) who unified ideas and connected the simple nonparametric bootstrap\
    \ (resampling the data with replacement) with statistical tools for estimating\
    \ standard errors, such as the jackknife and delta methods. This first method\
    \ is now commonly called the nonparametric IID bootstrap, the standard bootstrap\
    \ that is appropriate for data that is either independent identically distributed\
    \ (i.i.d.) or at least not serially dependent.\n\nAfter the publication of the\
    \ Efron (1982) monograph, the statistical and scientific community began to research\
    \ these ideas actively and appreciate the extensions of the methods and their\
    \ wide applicability. For a thorough overview of the bootstrap method and its\
    \ theoretical background we refer the reader to Efron and Tibshirani (1993).\n\
    \nIn our book, we show how to use the bootstrap approach in two different situations:\
    \ first, for the purposes of minimizing bias in the input data, and second, for\
    \ the purposes of generating multiple training and testing datasets. An overview\
    \ of the bootstrap methods will help to explain the motivation of bootstrap application\
    \ in the AI framework. The main idea of using multiple training and testing datasets\
    \ is to achieve variability in the data used for building and validating classifiers.\
    \ In this chapter, we also discuss what criteria should be used to stop generating\
    \ of training and testing datasets.\n\n## [3.2 Overview of Bootstrap Methods](#C02a_toc.xhtml#rsec3_2)\n\
    \nThe formal definition of Efron’s bootstrap is as follows:\n\n> Given a sample\
    \ of *n* independent identically distributed random vectors *x*[1], *x*[2], …,\
    \ *x*[n] and a real-valued estimator *θ̂* = *φ*(*x*[1],*x*[2],…,*x*[*n*]) of the\
    \ parameter *θ* , a procedure to assess the accuracy of *θ̂* is defined in terms\
    \ of the empirical distribution function *Fn*. This empirical distribution function\
    \ assigns probability mass 1/*n* to each observed value of the random vectors\
    \ *x*[i], *i* = 1, …, *n*.\n\nThe empirical distribution function is the maximum\
    \ likelihood estimator of the distribution for the observations when no parametric\
    \ assumptions are made. The bootstrap distribution for *θ̂* − *θ* is the distribution\
    \ created by generating *θ̂* values by independent sampling with replacement from\
    \ the empirical distribution *F*[n]. The bootstrap estimate of the standard error\
    \ of *θ̂* is then the standard deviation of the bootstrap distribution for *θ̂* − *θ*\
    \ . Almost any parameter of the bootstrap distribution can be used as a “bootstrap”\
    \ estimate of the corresponding population parameter, for example the skewness,\
    \ the kurtosis, or the median of the bootstrap distribution.\n\nThe practical\
    \ application of the bootstrap technique usually requires the generation of samples\
    \ obtained by independent sampling with replacement from the empirical distribution.\
    \ Then, from the bootstrap sampling, an approximation of the bootstrap estimate\
    \ is obtained using Monte Carlo method. The framework is quite straightforward:\n\
    \n1.  Generate a sample with replacement from the empirical distribution (a bootstrap\
    \ sample).\n\n2.  Compute *θ*^(\\*) the value of *θ̂*obtained by using the bootstrap\
    \ sample in place of the original sample.\n\n3.  Repeat Steps 1 and 2 *k*times.\n\
    \nSuppose that we want to estimate parameter *θ* that depends on a random sample\
    \ *X* = (*x*[1], *x*[2], …, *x*[n]). For example, *θ* can be a log variance of\
    \ the sample, or a Pearson correlation coefficient. And assume that we have the\
    \ following estimator of *θ* (that does not depend on the order of the values\
    \ *x*[i]):\n\n*θ̂*(*x*[1],*x*[2],…,*x*[*n*]) = *φ*(*x*[1],*x*[2],…,*x*[*n*])   (3.1) \
    \ \n\nHowever, we do not know the probability distribution of *φ*(*X*) given *θ*.\
    \ This means that we cannot estimate the error in estimating *θ* by *φ*(*X*).\
    \ Thus, we cannot tell if we can conclude *θ* ≠ 0 from an observed *φ*(*X*) ≠\
    \ 0, no matter how large the value of the estimator is.\n\nLet us see how the\
    \ bootstrap approach can help to create a confidence interval for *θ* and to test\
    \ the hypothesis *H*[0]:*θ* = *θ*[0] using only the observed data *x*[1], *x*[2],\
    \ …, *x*[n].\n\n### [3.2.1 The Basic Bootstrap](#C02a_toc.xhtml#rsec3_2_1)\n\n\
    Let us say we have a sample *X* = (*x*[1], *x*[2], …, *x*[n]) of size *n*. A bootstrap\
    \ sample of *X* is a sample\n\n*X*^(\\*) = (*x*[1]^(\\*),*x*[2]^(\\*),…,*x*[*n*]^(\\\
    *))   (3.2)  \n\nwhere each value *x*[1]^(\\*) is a random sample from *X* = (*x*[1],\
    \ *x*[2], …, *x*[n]) with replacement. In other words,\n\n${P\\\\left( {x\\_{j}^{\\\
    *} = x^{\\*}} \\\\right)\\\\frac{1}{n},i = 1,\\\\ldots,n}\\\\mspace{54mu}\\\\\
    operatorname{(3.3)}$ \n\nwhere *x*[*j*]^(\\*) are independent choices for *j*\
    \ = 1, … , *n*. Specifically, repeated values are allowed, and it is possible\
    \ that:\n\n*x*[*j*1]^(\\*) = *x*[*j*2]^(\\*) = *x*[*i*] \n\nFrom this, it follows\
    \ that, given that *X*^(\\*) is of size *n* , some values in *X* can be left out.\n\
    \nWe repeat this process *k* times and form *k* independent resamples: *x*[(1)]^(\\\
    *) = *x*[(2)]^(\\*) = *x*[(*k*)]^(\\*) . The bootstrap-resampled values for the\
    \ estimator (equation 3.1) are as follows:\n\n*θ̂*[*i*]^(\\*) = *θ̂*(*x*[(*i*)]^(\\\
    *)), *i* = 1, …, *k*   (3.4)  \n\nwhere the values *θ̂*[*i*]^(\\*) are treated\
    \ as independent random samples with mean *θ*. The number of resampled values\
