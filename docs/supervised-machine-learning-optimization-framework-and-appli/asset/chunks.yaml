    \ specifying the factorial experiment where hyperparameters serve as factors and\
    \ their discrete groups serve as levels of those factors. These hyperparameters\
    \ are defined in the Hyperparameters\\_Domain table below.\n\n### [8.1.5 Hyperparameters\\\
    _Domain Table](#C02a_toc.xhtml#rsec8_1_5)\n\nThe columns of the Hyperparameters\\\
    _Domain table are defined as shown in [Table 8.5](#C14_chapter8.xhtml#tab8_5).\n\
    \n**TABLE 8.5**  \n\nColumns of the Hyperparameters\\_Domain Table\n\n| Column\
    \ name || Type || Length || Description |\n\n| --- | --- | --- | --- |\n\n| METHOD\\\
    _NAME || Character || 8 || Hyperparameter ID |\n\n| --- | --- | --- | --- |\n\n\
    | KERNEL || Character || 8 || Kernel name |\n\n| PAR\\_NAME || Character || 8\
    \ || Hyperparameter name |\n\n| VALUE\\_TYPE || Character || 1 || Value type:\
    \ I(nteger), C(continues) |\n\n| UPPER\\_VALUE || Numeric || 8 || Highest possible\
    \ value of the hyperparameter |\n\n| LOWER\\_VALUE || Numeric || 8 || Lowest possible\
    \ value of the hyperparameter |\n\nThe METHOD\\_NAME, KERNEL, and PAR\\_NAME columns\
    \ comprise the primary key of the Hyperparameters\\_Domain table.\n\n### [8.1.6\
    \ Results Table](#C02a_toc.xhtml#rsec8_1_6)\n\nThe columns of the Results table\
    \ are defined as shown in [Table 8.6](#C14_chapter8.xhtml#tab8_6).\n\n**TABLE\
    \ 8.6**  \n\nColumns of the Results Table\n\n| Column Name || Type || Length ||\
    \ Description |\n\n| --- | --- | --- | --- |\n\n| EXP\\_ID || Character || 8 ||\
    \ Experiment ID |\n\n| --- | --- | --- | --- |\n\n| SID || Integer || 8 || Sequential\
    \ number ID |\n\n| FEATUIRE\\_ID || Character || 8 || Feature ID |\n\n| RESULT\\\
    _METRIC\\_ID || Character || 8 || Result metric ID |\n\n| METHOD\\_NAME || Character\
    \ || 8 || ML method |\n\n| KERNEL || Character || 8 || Kernel name |\n\n| PAR\\\
    _NAME || Character || 8 || Hyperparameter name |\n\n| LEVEL\\_VALUE || Numeric\
    \ || 8 || Optimal level for hyperparameter |\n\nThe EXP\\_ID and SID columns comprise\
    \ the primary key of the Results table. This table contains results of experiment\
