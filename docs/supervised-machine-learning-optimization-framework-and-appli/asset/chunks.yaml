    `Experiment` 表的列定义如 表 8.1 所示。


    **表 8.1**


    Experiment 表的列


    | 列名 | 类型 | 长度 | 描述 |

    | --- | --- | --- | --- |

    | `EXP_ID` | 字符 | 8 | 实验 ID |

    | `FEATURE_ID` | 字符 | 8 | 指向 `Features` 表的主键引用 |

    | `METHOD_ID` | 字符 | 8 | 指向 `ML_Method` 表主键引用 |

    | `METRIC_ID` | 字符 | 8 | 指向 `Metrics` 表主键引用 |

    | `DESIGN` | 字符 | 4 | 实验设计类型：全（FULL）；部分（部分） |

    | `MODEL` | 字符 | 8 | 因素对响应可能影响的模型类型，其中响应是在 `Metrics` 表中定义的质量指标：MAIN—仅主效应，D2—主效应和二阶交互作用，D3—主效应及三阶以内交互作用
    |


    `EXP_ID` 列包含了 `Experiment` 表的主键。`Experiment` 表定义了应该使用哪些数据集、使用哪些特征集、应用何种机器学习方法，以及使用哪些指标来确定机器学习方法应用结果的质量。数据集、特征集、机器学习方法和质量指标的引用在
    `FEATURE_ID`、`METHOD_ID` 和 `METRIC_ID` 列中。这些引用的元数据位于输入组件数据字典中定义的 `Output` 表中（第二部分，第
    7 章](#C13_chapter7.xhtml#chapter7)）。其他表将在下文中定义。


