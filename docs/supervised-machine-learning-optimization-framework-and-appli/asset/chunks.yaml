    \ analyses of observations in groups defined by the BY variables. |\n\n| --- |\
    \ --- |\n\n| CLASS variables || Specify which explanatory variables to treat as\
    \ categorical. |\n\n| EFFECT name=effect-type(variables < / options >) || Enables\
