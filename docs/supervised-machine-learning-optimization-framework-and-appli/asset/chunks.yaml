    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `VARIABLE_NAME` | Character | 8 | Variable name |

    | `VARIABLE \_Title` | Character | 80 | Variable title |

    | `VARIABLE \_Type` | Character | 1 | Variable type: C—character or N—numeric
    |

    | `VARIABLE_Length` | Numeric | 8 | Variable length |

    | `VARIABLE_ROLE` | Character | 1 | Variable role: F(eature) or L(abel) |

    | `FORMULA` | Character | 80 | Formula for computed variable |

    | `MISSING` | Character | 1 | Code of missing value |


    The `DATASET` and `VARIABLE_NAME` columns comprise the primary key of the Structure
    table.


    ### 7.1.1.3 Outlier_Detection and Bias_Correction Tables


    The `Outlier_Detection` and `Bias_Correction` tables define cleansing methods
    and their parameters. The columns of the `Outlier_Detection` table are defined
    as shown in [Table 7.3].


    **TABLE 7.3**


    Columns of the Outlier_Detection Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `OUTLIER_DETECTION_ID` | Character | 8 | Procedure ID |

    | `METHOD` | Character | 8 | Method name (e.g., MCD—minimal covariance determinant
    method and columns H, `CUTOFFALHA`, etc., are intended to define parameters for
    MCD) |

    | `H` | Numeric | 8 | Default value `(3*n + p + 1)/4`, where `n` is the number
    of observations and `p` is the number of variables |

    | `CUTOFFALPHA` | Numeric | 8 | Default value is 0.025 |

    | `MCDALPHA` | Numeric | 8 | Default value is 0.025 |


    The `OUTLIER_DETECTION_id` column comprises the primary key of the `Outlier_Detection`
    table.


    The columns of the `Bias_Correction` table are defined as shown in [Table 7.4].


    **TABLE 7.4**


    Columns of the Bias_Correction Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `BIAS_CORRECTION_ID` | Character | 8 | Bias correction ID |

    | `BIAS_TITLE` | Character | 80 | Bias correction title |

    | `SID` | Numeric | 8 | Sequential number to identify the corresponding `BIAS_CORRECTION_ID`
    with `VAR_NAME`, `METRIC`, and `BTS_ID` |

    | `VAR_NAME` | Character | 80 | Name of the dataset variable |

    | `METRIC` | Character | 8 | Metric: M(ean), M(e)D(ian) |

    | `BTS_ID` | Character | 8 | Reference to the primary key of the Bootstrap table
    |


    The `BIAS_CORRECTION_id` and `SID` columns comprise the primary key of the `Bias_Correction`
    table. The `SID` column lists sequential numbers to uniquely identify what bias
    correction procedure, defined in the Bootstrap table below and referenced via
    `BTS_ID` column, corresponds to which dataset variable that is defined in `VAR_NAME`
    column.


    Values in `BIAS_CORRECTION_ID` and `OUTLIER_DETECTION_ID` columns listed in Input
    table (see [Table 7.1]) associate the input dataset with bias correction/or outliers
    processes defined in `Outlier_Detection` and `Bias_Correction` tables. The latest
    contains a reference to the Bootstrap table.


    ### 7.1.1.4 Bootstrap Table


    The columns of the Bootstrap table are defined as shown in [Table 7.5].


    **TABLE 7.5**


    Columns of the Bootstrap Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `BTS_ID` | Character | 8 | Bootstrap ID |

    | `BTS_TITLE` | Character | 8 | Bootstrap title |

    | `RESAMPLE_SIZE_PCT` | Numeric | 8 | For example, 100 means n-out-n; 70 or 50
    means m-out-n |

    | `REPLICATIONS` | Numeric | | Number of subsamples to be created |

    | `DISTRIBUTION` | Character | 1 | Name of the distribution for random sample:
    `U(n)`, where each observation has a uniform probability of `1/N` of being selected
    at each step of the resampling process. Within the union of B bootstrap samples,
    each observation has expected value of appearing B times; `B(n)` where each observation
    appears exactly B times in the union of B bootstrap samples of size N |

    | `STRATA_VAR` | Character | 32 | Name of a variable that defines strata |


    The `BTS_ID` column comprises the primary key of the Bootstrap table. The data
    defined in Bootstrap table identifies bootstrap processes that can be applied
    for bias correction as well as for the generation of multiple (this value is defined
    in `REPLICATIONS` column) training or testing datasets. The `STRATA_VAR` defines
    a variable from the input dataset, the value of which should be used to separate
    the values of other variables in the dataset. The most applicable use of `STRATA_VAR`
    is to define a time series in the input dataset.


    ### 7.1.1.5 Output Table


    The columns of Output table are defined as shown in [Table 7.6].


    **TABLE 7.6**


    Columns of the Output Table


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | `OUTPUT_TABLE_ID` | Character | 8 | Output ID |

    | `OUTPUT_ROLE` | Character | 80 | Output data role |

    | `TABLE_PREFIX` | Character | 8 | |

    | `WITH_RETURN` | Character | 1 | Select data from input dataset with or without
    return. Values are Y or N. Default is N |

    | `DATA_PCT` | Numeric | | Percent of input data used to create `OUT_ID` table
    |

    | `BTS_ID` | Character | 8 | |


    `OUTPUT_TABLE_ID` and `OUTPUT_ROLE` comprise the primary key of the Output table.
    The Output table contains a reference to the Bootstrap table.


    To get a better understanding of what the above-described metadata definitions
    mean, we created an example of input data table pre-filled with metadata. [Table
    7.7], [Table 7.8], [Table 7.9], [Table 7.10], [Table 7.11], [Table 7.12] show
    the example of how the content of the data dictionary tables for input data component
    may look like.


    **TABLE 7.7**


    Content of the Input Table


    | INPUT_ID | TITLE | DATASET | OUTLIER_DETECTION_ID | BIAS_CORRECTION_ID | OUTPUT_TABLE_ID
    |

    | --- | --- | --- | --- | --- | --- |

    | 1 | Title A | DataOne | 1 | 2 | 1 |

    | 2 | Title B | DataTwo | 2 | 1 | 2 |


    **TABLE 7.8**


    Content of the Structure Table


    | DATASET | VARIABLE_NAME | VARIABLE_TITLE | VARIABLE_TYPE | VARIABLE_LENGTH |
    VARIABLE_ROLE | FORMULA | MISSING |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | DataOne | VarOne | Title One | Character | 20 | L | . | . |

