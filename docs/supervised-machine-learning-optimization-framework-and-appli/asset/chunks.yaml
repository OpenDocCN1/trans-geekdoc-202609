    # [3] 在 SAS 和 R 中部署自助法方法](#C02a_toc.xhtml#rchapter3)


    ## 3.1 引言


    自助法（Bootstrap）是一种重采样程序，通过对原始数据集进行采样来估计总体的统计量。该方法通过计算机模拟替代了复杂且通常不准确的偏误、方差和其他不确定性量。在简单情况下，估计的不确定性可以基于对可用数据的假设概率模型通过解析计算来衡量。但在更复杂的情况下，这种方法可能变得非常繁琐且困难，如果做出了不当的假设或简化，其结果可能会产生误导。


    '
- fmt: '

    The idea of resampling procedures similar to the bootstrap has a long history,
    associated with the use of computers to perform a simulation. First, such procedures
    were mentioned in the early days of computing in the late 1940s. However, it was
    Efron (1979) who unified ideas and connected the simple nonparametric bootstrap
    (resampling the data with replacement) with statistical tools for estimating standard
    errors, such as the `jackknife` and `delta` methods. This first method is now
    commonly called the nonparametric IID bootstrap, the standard bootstrap that is
    appropriate for data that is either independent identically distributed (i.i.d.)
    or at least not serially dependent.


    After the publication of the Efron (1982) monograph, the statistical and scientific
    community began to research these ideas actively and appreciate the extensions
    of the methods and their wide applicability. For a thorough overview of the bootstrap
    method and its theoretical background we refer the reader to Efron and Tibshirani
    (1993).


    In our book, we show how to use the bootstrap approach in two different situations:
    first, for the purposes of minimizing bias in the input data, and second, for
    the purposes of generating multiple training and testing datasets. An overview
    of the bootstrap methods will help to explain the motivation of bootstrap application
    in the AI framework. The main idea of using multiple training and testing datasets
    is to achieve variability in the data used for building and validating classifiers.
    In this chapter, we also discuss what criteria should be used to stop generating
    of training and testing datasets.


    ## 3.2 Overview of Bootstrap Methods


    The formal definition of Efron’s bootstrap is as follows:


    > Given a sample of `n` independent identically distributed random vectors `x[1]`,
    `x[2]`, …, `x[n]` and a real-valued estimator `θ̂` = `φ(x[1],x[2],…,*x[*n*])`
    of the parameter `θ`, a procedure to assess the accuracy of `θ̂` is defined in
    terms of the empirical distribution function `Fn`. This empirical distribution
    function assigns probability mass `1/n` to each observed value of the random vectors
    `x[i]`, `i` = 1, …, `n`.


    The empirical distribution function is the maximum likelihood estimator of the
    distribution for the observations when no parametric assumptions are made. The
    bootstrap distribution for `θ̂ − θ` is the distribution created by generating
    `θ̂` values by independent sampling with replacement from the empirical distribution
    `F[n]`. The bootstrap estimate of the standard error of `θ̂` is then the standard
    deviation of the bootstrap distribution for `θ̂ − θ`. Almost any parameter of
