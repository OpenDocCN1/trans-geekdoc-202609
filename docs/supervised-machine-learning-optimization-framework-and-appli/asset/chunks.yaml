    \ Albert and Anderson (1984) coined this term, differentiating between “complete”\
    \ and “quasi-complete” separation. Complete separation occurs when one or more\
    \ of a model’s covariates perfectly predict some binary outcome. Quasi-complete\
    \ separation denotes the case in which such perfect prediction occurs only for\
    \ a subset of observations in the data.\n\nSeparation means the existence of a\
    \ sub-vector *x*[s] by which all *n* observations can be correctly categorized\
    \ as either *y*[i] = 0 or *y*[i] = 1. The existence of such a sub-vector leads\
    \ to a monotonic log-likelihood. As a result, the maximum likelihood estimates\
    \ $\\\\hat{\\\\beta\\_{s}}$ for the variables in the *x*[s] sub-vector equal positive\
    \ or negative infinity, and the associated standard error estimates are infinite\
    \ as well.\n\nThis is exactly the situation that happens in the SVM classifier\
    \ outcome, where the value of *f*(*x*) represents the distance to the separating\
    \ hyperplane, and thus, its value perfectly predicts the binary outcome of classification.\n\
    \nThere is extensive literature on the subject of separation, and multiple proposals\
    \ on how to deal with this problem (See Rainey, 2016 and Zorn, 2005). In this\
    \ book we will use Firth’s bias-correction method to address the separation issue\
    \ in logistic regression. Firth method that uses a penalized likelihood estimation\
    \ is considered as an ideal solution for separation issue.\n\nIn his paper from\
    \ 1993, Firth suggested a method for eliminating the small sample bias in maximum\
    \ likelihood estimation. The main idea of Firth’s approach is to introduce a bias\
    \ term in the form of the Jeffreys’ (1946) invariant prior into the standard likelihood\
    \ function. As *N*→∞, the bias itself approaches zero, but for small *N*, the\
    \ *O*(*N*^(−1)) bias is present. As a result, Firth created a penalized log-likelihood\
    \ formula:\n\nln *L*(*β*|*y*)^(\\*) = ln *L*(*β*|*y*) + 0.5ln |*i*(*β*)|   (2.23) \
    \ \n\nand the corresponding equation for score function:\n\n${\\\\frac{\\\\partial\\\
    \\ln L\\\\left( \\\\beta \\\\middle| y \\\\right)^{\\*}}{\\\\partial\\\\beta}\
    \ \\\\equiv U\\\\left( \\\\beta \\\\right)^{\\*} = U\\\\left( \\\\beta \\\\right)\
    \ + 0.5\\\\text{tr}\\\\left\\\\{ {i\\\\left( \\\\beta \\\\right)^{- 1}\\\\left\\\
    \\lbrack \\\\frac{\\\\partial i\\\\left( \\\\beta \\\\right)}{\\\\partial\\\\\
    beta} \\\\right\\\\rbrack} \\\\right\\\\}}\\\\mspace{54mu}\\\\operatorname{(2.24)}$\
    \ \n\nwhere *i*(*β*) is Jeffreys’ non-informative prior and ln *L*(*β*|*y*) and\
    \ *U*(*β*) are described by equations (2.21) and (2.22), respectively.\n\nFirth\
    \ also demonstrated that his penalized likelihood both is asymptotically consistent\
    \ and eliminates the usual small sample bias for a broad class of generalized\
    \ linear models. He also showed that penalized likelihood estimates exist in numerous\
    \ situations in which standard likelihood-based estimates do not, including that\
    \ of complete separation in binary response models. At the same time, it is obvious\
    \ that as *N*→∞, Firth’s penalized likelihood estimates converge to the MLEs under\
    \ the usual regularity conditions.\n\nThere are studies that strongly suggest\
    \ that the penalized likelihood approach to estimating logit models in the presence\
    \ of separation is uniformly superior to its alternatives. For example, in their\
    \ study, Galindo-Garre et al. (2005) applied Monte Carlo simulations to demonstrate\
    \ that Firth’s approach with Jeffreys’ prior is superior both to the ad hoc correction\
    \ of Clogg et al. (1991) and to Bayesian approaches that adopt other uninformative\
    \ conjugate or normal priors.\n\nWhile using penalized likelihood estimates, however,\
    \ it is important to remember that the resulting penalized profile likelihoods\
    \ for the coefficients are often asymmetrical. This means that the usual inferences\
    \ based on Wald-type statistics can be misleading. Heinze and Schemper (2002)\
    \ recommend the use of penalized likelihood ratio tests instead of standard Wald\
