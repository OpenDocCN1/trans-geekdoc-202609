    目前还没有关于如何选择训练神经网络所需的属性值的具体“配方”。对于参数 `formula`，应该决定在模型中包含哪些特征。这个问题本身就构成了一项重大的挑战，并在大量的研究和出版物中得到了解决。但无论读者使用何种方法来选择特征，这种选择都与函数的其余参数混杂在一起。例如，如何定义参数
    `hidden` 的值：需要多少个隐藏层以及每层有多少个神经元？我们可以肯定，对于不同的特征集，答案将会是不同的。


    在 `neuralnet` 函数算法提供的四种算法中选择一种用于神经网络训练的算法也是困难的。尽管我们知道算法是如何运作的，但在大多数情况下，我们用于训练神经网络的数据特征是未知的。但即便如此，即使我们对算法做出了一些决定，又如何选择反映学习率的属性（`learningrate.limit`、`learningrate.factor`、`learningrate`）的值呢？


    如果还不够，我们现在必须决定损失函数（`err.fct`）和激活函数（`act.fct`）的形式。


    ## 2.4 支持向量机


    ### 2.4.1 引言


    支持向量机（SVM）是一种经过证明的分类方法，它可以在不需要统计模型的情况下直接最小化分类误差。SVM 可以处理海量的特征空间，并保证在存在的情况下找到一个全局最优的分离超平面。此外，SVM
    分类器构建在边界案例之上，这允许它们处理缺失数据。SVM 分类器可以通过将数据映射到高维（转换后的）空间来分离原始空间（例如二维空间）中难以分离的数据。简单来说，非线性分类器使用非线性函数
    `Φ` 将我们的数据从输入空间 `X` 映射到特征空间 `F`：`X→F`。在空间 `F` 中，判别函数如下：


    $f(x) = w^{(T)}\Phi(x) + b \quad (2.8)$


    ### 2.4.2 核


    核方法解决了将数据映射到高维特征空间的问题。假设权重向量可以表示为训练示例的线性组合：


    $w = \sum_{i = 1}^{n}\alpha_{i}x_{i} \quad (2.9)$


    那么


    $f(x) = \sum_{i = 1}^{n}\alpha_{i}x_{i}^{T}x + b \quad (2.10)$


    在特征空间 `F` 中，该表达式的形式为：


    $f(x) = \sum_{i = 1}^{n}\alpha_{i}\Phi(x_{i})^{T}\Phi(x) + b \quad (2.11)$


    特征空间 `F` 可能是高维的，使得这种转换变得困难，除非核函数定义为可以高效计算的形式：


    $K(x,x'') = \Phi(x)^{(T)}\Phi(x'') \quad (2.12)$


    从核函数的角度，判别函数可以写为：


    $f(x) = \sum_{i = 1}^{n}\alpha_{i}K(x,x'') + b \quad (2.13)$


    有不同的核函数。例如，次数为 `d` 的多项式核定义为：


    $K(x,x'') = (x^{(T)}x''+1)^{(d)} \quad (2.14)$


    该核的特征空间由所有次数小于 `d` 的单项式组成，例如：


    $x_{1}^{d_{1}}x_{2}^{d_{2}}\ldots x_{m}^{d_{m}},\text{where}{\sum_{i = 1}^{m}{d_{i}
    \leq d}} \quad (2.15)$


    多项式次数 `d` 的增加会导致分类器灵活性的增加。


    另一种广泛使用的核是高斯（径向基函数）核，其定义为：


    $K(x,x'') = \exp(-\gamma\|x-x''\|²) \quad (2.16)$


    其中 `γ` > 0 是控制高斯函数宽度的参数。它在控制结果分类器灵活性方面起着与多项式核次数的作用。


    双正切函数也称为 sigmoid）是另一种流行的核。它的定义为：


    $K(x,x'') = \tanh(\alpha x^{(T)}x''+b) \quad (2.17)$


    其中 `α` 是斜率，`b` 是截距。


    ### 2.4.3 间隔


    偏差-方差问题是在试图同时最小化这两个误差来源时的冲突。SVM 使用核函数来找到一个最大化两类之间距离的超平面。


    ### 2.4.4 优化


    软间隔优化问题（Cortes and Vapnik, 1995）公式如下：


    $\begin{array}{l} \text{minimize on }w,b:\frac{1}{2}\|w\|² + C\sum_{i = 1}^{n}e_{i}
    \\ \text{subject to}:y_{i}(w^{T}x_{i} + b) \geq 1 - e_{i},e_{i} \geq 0,i =1,\ldots,n
    \end{array} \quad (2.19)$


    其中：


    *   `w` 是间隔，

    *   `C` 是设置最大化间隔和最小化松弛变量数量相对重要性的常数，

    *   `e[i]` 是松弛变量，允许案例位于间隔内（0 ≤ `e[i]` ≤ 1，称为间隔误差）或被错误分类（`e[i]` > 1），

    *   `y[i]` ——训练数据集的输出结果，也称为标签，

    *   `b` 是使超平面偏离原点的偏差。


    ### 2.4.5 偏差-方差权衡与 SVM 超参数


    偏差是由于学习算法中的错误假设引起的误差。高偏差意味着特征与输出之间的欠拟合。方差是由于敏感性指标对训练集微小波动的反应产生的误差。高方差意味着特征与输出之间的过拟合。


    偏差-方差权衡是监督学习中的核心问题。在统计学和机器学习中，偏差-方差权衡是预测模型集的一种属性，参数估计偏差较低的模型跨样本的方差较高，反之亦然。偏差-方差问题是在试图同时最小化这两个误差来源时的冲突，这些误差阻止了像
    SVM 的监督学习算法在训练集之外进行泛化。

