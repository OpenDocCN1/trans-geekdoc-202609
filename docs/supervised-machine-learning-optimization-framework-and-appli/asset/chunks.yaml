    \ for the application of bias–variance decomposition that was originally formulated\
    \ for least-squares regression.\n\n### [2.5.2 Logistic Regression](#C02a_toc.xhtml#rsec2_5_2)\n\
    \nLet us consider logistic regression for a binary dependent variable *y*[i] and\
