    A one-to-many relationship (1:M) is the relationship that exists between tables
    in which each row of the first table corresponds to one row of the second table,
    but not vice versa.


    ### 6.2.10 Primary Key


    According to the relational data model, every table must have a primary key. A
    primary key is a column, or set of columns, that makes each row of the table unique.
    Any column (or columns) can be used as the primary key as long as it defines a
    unique value for every row in the relational table.


    ### 6.2.11 Foreign Key


    Another term that is used in the relational data model is a foreign key. Foreign
    keys are used to “link” related tables together. A foreign key is a column, or
    set of columns, that defines a data value that must exist in some other relational
    table as that other table’s primary key. A relational data model maintains relational
    “links” by matching primary key values in one table with identical foreign key
    values in a related table. Note that a table can only have one primary key, but
    can have any number of foreign keys (since one table can be related to any number
    of other tables).


    ### 6.2.12 Missing Values


    The concept of missing value is necessary because real-world information is frequently
    incomplete, and we need some way of handling such incompleteness. Missing values
    are useful when:


    *   a new row is to be created, but the user is currently unable to supply values
    for certain columns. An application can supply missing values for the new row
    in those columns.

    *   a new column is to be added to an existing table. The value of the new column
    can be defined as the missing value in all existing rows.

    *   an aggregate function, such as a summary, is to be applied to a column of
    a table. In computing the function, it is desirable for an application to recognize
    and ignore rows for which missing values have been supplied. (It is also desirable
    for users to understand what is going on in such a situation; for example, the
    average is not equal to the sum divided by the count.)


    To represent a missing value of a column in the table, it is necessary to find
    a symbol that is different from all legal symbols in this column.


    ### 6.2.13 Data Dictionary


    Everything about an application is defined in specially structured tables that
    comprise a table-driven environment. These tables are sophisticated and allow
    a great deal of complexity in the final application. The special programs transform
    data from these tables (metadata) into application code. Such tables and programs
    form a data dictionary.


    ## 6.3 Properties of the Data Dictionary


    The data dictionary is the repository of a variety of information regarding objects
    related to an application, such as application tables and their columns, users,
    access privileges, and integrity constraints. In order to define an application,
    we need to build the set of data dictionary tables that will contain data (metadata)
    about the application’s objects.


    The possible set of data dictionary tables includes six tables: `Library`, `Object`,
    `Location`, `Message`, `Property`, and `Link`. This set is called the `Kernel`
    set and may be extended by additional tables. The `Kernel` tables themselves can
    be defined in the relational model.


    ### 6.3.1 Library Table


    The `Library` table lists specifications about locations. The columns of the table
    are defined in Table 6.1.


    **TABLE 6.1**


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | Table | Character | 8 | Table name |

    | Location | Character | 80 | Table location |

    | Library | Character | 8 | Library name |


    The `Table` column is the primary key of the `Library` table.


    ### 6.3.2 Object Table


    The `Object` table lists application tables and their corresponding datasets.
    The columns are as as in Table 6.2.


    **TABLE 6.2**


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | Table | Character | 8 | Table name |

    | Title | Character | 80 | Table title |

    | Dataset | Character | 8 | Dataset name |


    The `Table` column is the primary key of the `Object` table.


    ### 6.3.3 Location Table


    The `Location` table lists application tables and SAS libraries. The columns are
    defined in Table 6.3.


    **TABLE 6.3**


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | Table | Character | 8 | Table name |

    | Library | Character | 8 | Library name |


    The `Table` and `Library` columns form the primary key of the `Location` table.


    ### 6.3.4 Message Table


    The `Message` table lists application messages. The columns are defined in Table
    6.4.


    **TABLE 6.4**


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | Message | Numeric | 8 | Message identification number |

    | Text | Character | 80 | Message text |

    | Mestype | Character | 1 | Message type: E—error, W—warning, I—informative |

    | Output | Character | 2 | Output destination: S—screen and/or D—dataset |


    The `Message` column is the primary key of the `Message` table.


    ### 6.3.5 Property Table


    The `Property` table specifies the properties of application tables. The `Property`
    table lists the columns of each application table. For each column, the following
    information is defined:


    *   name of the table of which that column is a part

    *   column name

    *   column data type

    *   column length

    *   column domain

    *   column location on the screen form, etc.


    The columns are defined in Table 6.5.


    **TABLE 6.5**


    | Column Name | Type | Length | Description |

    | --- | --- | --- | --- |

    | Table | Character | 8 | Table name |

    | Column | Character | 8 | Column name |

    | Type | Character | 1 | Column data type: C—character or N—numeric |

    | Length | Numeric | 8 | Column length |

    | Attribut | Character | 2 | Column property: P—primary key |

    | Domtab | Character | 8 | Domain table name |

    | Domcol | Character | 8 | Domain column name |

    | Meantab | Character | 8 | Meaning table name |

    | Meancol | Character | 8 | Meaning column name |

    | Initval | Character | 80 | Initial column’s value |

    | Formula | Character | 80 | The formula for the computed column |

    | Missing | Character | 1 | Code of missing value |

