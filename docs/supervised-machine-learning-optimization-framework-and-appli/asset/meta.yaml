  - 从数据字典生成 R 数据集
- - '#'
  - PROGRAM DATASET.R
- - '#'
  - 为指定的表创建 R 数据集。
- - '#'
  - USAGE dataset(table, tmp_src, init_file)
- - '#'
  - PARAMETERS table - 需要创建 R 数据集的表名。
- - '#'
  - tmp_src - 用于存储生成的 R 代码的临时文件名。
- - '#'
  - init_file – 包含数据字典文件路径的逗号分隔值文件名。
- - '#'
  - 该文件是数据字典的一部分，称为 library.csv。
- - '#'
  - object_file - 包含应用表和数据字典表元数据的逗号分隔值文件名。
- - '#'
  - property_file – 包含应用表结构和字典表结构元数据的逗号分隔值文件名。
- - '#'
  - REQUIRES 必须存在数据字典 object.csv 和 property.csv 文件。
- - '#'
  - AUTHORS T.Kolosova and S.Berestizhevsky
- - '#'
  - 该环境有助于快速且稳健的实现。本章描述了表格以及 SAS 和 R 程序。在接下来的章节中，我们将演示如何扩展表驱动环境以处理如数据输入、自助法、实验设计和支持向量机分类等任务。
