- "# 监督机器学习：SAS 和 R 优化框架与应用\n\n\n\n\n\n\n\n\n**Tanya Kolosova 博士**\nAssociates in\
  \ Analytics Inc., 佛州 Boca Raton\n\n**Samuel Berestizhevsky 硕士**\nAssociates in Analytics\
  \ Inc., 佛州 Boca Raton\n\n\n\n\n\n\n\n\n\n\n\n*致辞*\n致我们的孩子们\n\n# [致谢]\n\n写这本书是一场真正的冒险。在这些年里，Samuel\
  \ 感谢 `Maurice` Greenberg 的支持，Tanya 感谢 `Hank` 的建议。其中，Samuel 特别感谢 `David` 提供的统计方法。我们结了来自以色列特拉维夫大学的\
  \ `David Steinberg` 教授和来自西蒙·弗雷泽大学的 `Carl Schwarz` 教授。我们要感谢 `SAS Institute` 以及 `R\
  \ Core Team`。我们还感谢 `Taylor and Francis/CRC Press` 团队的支持。特别感谢策划编辑 `David Grubbs`、`Sofia`、`Varun`\
  \ 以及其他工作人员，他们的帮助使这本书得以成书。感谢 `Efrat` 的表演和 `Debussy` 的作品。\n\n# [作者]\n\n**Tanya Kolosova**\
  \ 是一位统计学家、软件工程师、教育工作者，以及两本关于使用 SAS 进行统计分析和基于元数据开发的书籍的作者。她是一位可操作分析专家，在软件开发方法、技术、人工智能方法和算法方面拥有丰富知识。\n\
  \n**Samuel Berestizhevsky** 是一位统计学家、研究人员和软件工程师。他与 Tanya 合著了两本关于使用 SAS 进行统计分析和基于元数据开发的书籍。Samuel\
  \ 是自动化可操作分析、人工智能解决方案以及软件开发方法领域的创新者专家。\n\n\n根据 Bishop (2006) 的定义，机器学习 (`ML`) 是统计模型和算法的科学研究，帮助计算系统完成特定任务，无需显式指令，而是依赖模式和推理。`ML`\
  \ 是人工智能技术的一个子集。它随着时间、交互和经验自动学习并提高性能。构建初始机器学习模型（或分类器）是一个迭代过程，我们对哪些数据是有用的以及如何构建不同的特征集提出初始假设，哪些机器学习方法可以从我们的数据中学习得更好，以及如何`tune`多个超参数以获得稳健的分类结果。如果不使用一个易于、可靠、有意义、可验证和可重复的开发框架，机器学习开发过程将变成一场噩梦。\n\
  \n可重复性是重复分析的能力。\n\n可比较性是比较不同建模方法产生的结果的能力。\n\n\n\n\n在本书中，我们描述了一种 AI 框架，它可以帮助开发者实现机器学习实验的可复现性和可比性，并以精确、透明、易于更改且可验证的方式定义\
  \ ML 开发流程。\n\n\n机器学习大致可以分为三类：监督学习、无监督学习和强化学习。在本书中，我们只处理监督机器学习。最常见的监督机器学习任务是分类。\n\
  \n监督分类可以描述为根据源自这些对象的数值测量值，自动将对象分配到其相应类别的任务。分类器是实现从这些测量值到所谓“类别标签”实际分类的工具。监督分类领域研究的是构建此类分类器的方法。监督学习方法背后的核心思想是从示例中学习：给定若干个描述输入-输出关系的所谓“训练数据集”，在多大程度上可以学习到将任何新且未见的对象映射到其正确类别的通用映射关系？\n\
  \n机器学习的基本问题可能是以下内容：我们有一个包含案例的训练数据集：\n\n`(x[1], y[1]), ↆ…, (x[n], y[n])`\n\n其中每个案例\
  \ `(x[i], y[i])`，`i = 1, …, n` 包含一个对象 `x[i]`（特征向量）和它的标签 `y[i]`。问题是预测新对象 `x[n+1]`\
  \ 的标签 `y[n+1]`。通常，分类的目标是产生一个可能与真实标签 `y[n+1]` 一致的预测 `ŷ[n+1]`，并且这个目标应该用某些对其可靠性的衡量作为补充。准确性和可靠性之间存在着明显的权衡：我们可以通过放宽后者提高前者，反之亦然。\n\
  \n\n分类器的质量由其将输入向量正确分类到适当类别的能力定义，并由来自混淆矩阵（或误分类矩阵）的指标衡量。没有哪种指标可以单独衡量分类器的质量：至少应该使用一对指标。例如，灵敏度（sensitivity）和特异性（specificity）分别估计真阳性率和真阴性率，我们关注的是这两项指标都趋于\
  \ 1 的分类器。\n\n偏差-方差权衡的思想是：寻找最小风险的分类方法涉及在最小化偏差（平均而言是正确的）和最小化方差（对于训练数据集的波动保持稳定）之间取得平衡。由于高方差而表现不佳的分类方法在面对数据时被称为过拟合。由于高偏差而表现不佳的被称为欠拟合。\n\
  \n低偏差意味着：\n* 分类结果的平均准确率指标接近真实值。\n\n高偏差意味着：\n* 分类结果的平均准确率指标远离真实值，\n* 分类方法不够灵活，以及\n\
  * 单个分类准确率指标未能充分适应数据。\n\n低方差意味着：\n* 每个分类分类准确率指标都接近平均准确率，\n* 单个准确率指标彼此相似，\n* 分类方法对于应用于哪个数据集（在所有可能集中）是“稳定”的。\n\
  \n高方差意味着：\n* 单个准确率指标往往远离平均准确率，\n* 单个准确率指标之间差异很大，\n* 分类方法对于应用于哪个数据集非常敏感。\n\n偏差和方差估计的挑战实际上可以通过应用两种现有的统计方法论来轻松解决：\n\
  * 自举法（bootstrap）和\n* 混合实验（mixture experiments）。\n\n我们在书中展示了如何应用 m-out-of-n 自举法来创建成千上万个训练数据集，反之，如何将\
  \ ML 方法应用于这些数据集允许我们估计偏差和方差。混合实验的统计方法被用于污染数据并找到能够“破坏”分类器的污染水平。这有助于识别对未见数据具有更好定位的鲁棒分类器。\n\
  \n\n机器学习应用的有效寿命从部署到生产环境开始开始。从现在起，通常需要对应用进行修改。这些修改可能在编码甚至重新设计上消耗大量精力。通常，机器学习应用越好，寿命就越长。应用的修改和维护通常由原始实现者以外的人完成。这个问题很难解决，因为应用的内部结构无法被理解。书中描述的无代码框架解决了这些问题。通常，书中概述的框架涵盖了现有机器学习应用开发和部署技术中最根本的问题：无法识别用户的真实需求，以及无法快速开发机器学习解决方案来满足这些需求。\n\
  \n机器学习应用面临着传统软件系统的所有挑战，外加一组机器学习特有的问题——可复现性和可比性。这两个机器学习特定问题可以通过应用统计实验设计原理结合自举法，并通过通过数据污染过程（训练数据集标签的翻转或损坏）测试机器学习解决方案的鲁棒性来解决。书中讨论了设计实验、自举法和数据污染的原理及应用。\n\
  \n另一个挑战是生产分类器的选择。例如，如果分类器质量的标准是最大化灵敏度和特异性，那么我们可能会遇到艰难的选择。假设我们有一个分类器 `A`，灵敏度为 0.85，特异性为\
  \ 0.88；分类器 `B`，灵敏度为 0.87，特异性为 0.87——我们应该选择哪一个？\n\n在书中，我们想要探索一种不同的方法，我们不需要通过一个分类器来限制选择。分类器\
  \ `A` 和 `B` 都具有很好的分类质量。不仅如此，我们还可以找到几十个灵敏特异性非常相似的分类器。我们还知道每个分类器的灵敏度和特异性取决于它们所应用的数据集。因此，我们不是选择一个分类器，而是使用所有具有高质量指标的分类器，并根据某些信息标准通过投票机制决定最终分类结果。这种方法将立即改进分类过程。\n\
  \n\n\n\n在书中，我们描述了一种 AI 框架，该框架有助于创建机器学习分类器，并使其能够对未见的数据产生足够良好的分类。该框架包含了数据字典，定义了诸如统计设计实验、自助法（bootstrapping）和数据“污染”等过程。该框架是完全透明，因为所有数据处理过程都被定义为元数据，确保了监督分类结果的可比较性和可重复性。\n\
  \n由于 AI 框架完全独立于技术，因此可以使用不同的软件平台进行实现。在书中，我们展示了使用两种不同的软件工具实现的 AI 框架实现：`SAS` 和 `R`。\n\
  \n`SAS` 是一个集成软件系统，能够访问多个源的数据、操纵数据、进行复杂的分析等许多功能，它是企业业务的主要选择之一，尽管成本较高。\n\n`R` (`R\
  \ Core Team`, 2018) 是一种由研究人员开发的开源编程语言，许多最新的统计和分析方法都是用 `R` 开发的。该语言拥有详尽的文档以及支持性的社区，被统计学家和数据科学家广泛用于开发统计软件和数据分析。\n\
  \n\n书中提出的 AI 框架的核心思想是创建一种系统方法，以解决机器学习建模中的挑战。\n\n构建机器学习分类器的过程需要做出选择，而这些选择往往无法通过直觉、对业务问题的理解或对数据的预分析来做出。例如，关于特征子集的决策需要考虑不同的假设，并且考虑几个不同的特征集是合理的。最终选择哪一个，需要通过建模过程，并对基于不同特征集构建的分类器进行比较。\n\
  \n选择机器学习方法同样具有挑战性，在许多情况下，决策是基于方法的便利性和结果的预期可解释性，而不是基于机器学习方法的理论和技术方面。如果我们不想局限于某一种机器学习方法，而是想尝试其中几种，那么我们需要估计并比较由这些方法构建的分类器。现在，我们必须记住，估计分类器的质量不仅取决于所使用的机器学习方法，还取决于特征集。\n\
  \n对于每种机器学习方法，我们需要为该方法的超参数分配值，而显而易见，超参数的值会影响估计分类器的质量。不同的方法具有不同数量的超参数，寻找最优值变成了一个非常困难的问题。\n\
  \n`Figure 1.1` 描述了 AI 框架中一些需要做出决策的最重要组件，但如何做呢？实验的统计设计是一种在此很有帮助的方法。它允许我们创建一个计划，执行它，根据所选的分类器质量指标比较结果，并在需要时重复。通常情况下，我们最终得到几个分类质量相似的分类器。\n\
  \n\n\nAI 框架的组件。\n\n\nAI 框架解决了构建分类器的挑战。这些挑战不仅包括根据分类器质量选择特征集、机器学习方法及其超参数值的困难，还包括构建分类器过程中出现的问题。这些细节在\
  \ `Figure 1.2` 中。\n\n\n\nAI 框架流程。\n\n\n第一步，AI 框架处理训练集和测试集的创建。将可用数据分为两部分，且仅关注此类划分比例（例如\
  \ 50-50 和 70-30）的常见方法存在固有缺陷。这涉及到数据内部的偏差和依赖性。它还涉及到这样的情况：在一个数据集上估计分类器无法让我们衡量分类器质量的方差和偏差，也无法评估分类器的稳健性。在开发的\
  \ AI 框架中，使用了自助法（bootstrap）来解决这一缺陷。\n\n- 使用自助法创建多个（如果数据允许，可以是数百甚至数千）训练集和测试集。它允许我们估计并修正数据偏差，增加数据变异性并减少数据内部依赖性。\n\
  - 在多个训练集上估计分类器会产生分类器质量指标的样本，现在允许对分类器质量进行全面估计。\n- 使用多个而非单个测试集有助于验证分类器处理未见数据的能力。\n\
  \n\n下一步，AI 框架处理参数选择问题，即基于实验设计的统计方法论创建计划。该计划创建了所有感兴趣参数的组合，使得结果可以被分析并得出显著的见解。例如，我们可能考虑五种可能的特征集、具有三种不同内核的支持向量机方法，以及每个超参数的三个取值区间。计划（实验设计）将定义使用多少种不同的设置来构建分类器，以及每个设置应应用于多少个训练集。\n\
  \n### 1.2.3 Firth 逻辑回归\n\n由于机器学习算法的本质，分类器的结果不具有概率特征。这意味着如果一个结果被预测为 1，该预测并没有伴随着正确的概率。能够将概率与预测关联起来可以提高分类器的质量。Firth\
  \ 逻辑回归是一种与分类器预测结合得很好的统计方法，它为预测增加了概率值。\n\n### 1.2.4 数据污染\n\n机器学习建模中最挑战性的问题之一是泛化。在多个训练集上构建分类器有助于解决偏差-方差权衡，但它仍然无法估计分类器对未见数据的稳健性。计划的数据污染意味着按照比例随机损坏标签。例如，对于标签为\
  \ Yes 和 No 的二分类器，计划污染可能如下所示：\n\n1. “翻转” 0.5% 的 Yes 标签为 No，并将 0.5% 的 No 标签为 Yes，\n\
  2. “翻转” 0.5% 的 Yes 标签为 No，并将 1% 的 No 标签为 Yes，\n3. “翻转” 1% 的 Yes 标签为 No，并将 0.5% 的\
  \ No 标签为 Yes，\n4. 等此类推。\n\n其核心思想基本上是找到分类器在什么种污染水平下质量会显著下降，并排除那些仅在轻微污染下就会损失质量的分类器。\n\
  \n\n\n\n\n如前所述，我们并不将分类方案局限于单一分类器。一方面，通常无法根据敏感性（sensitivity）和特异性（specificity）等指标对来选择最佳分类器。一种常见的情况是：某些分类器在敏感性上表现更好，另一些在特异性上表现更好，而还有一些虽然不是最好的，但在两个方面都非常出色。本质上，当两项指标都高于根据应用需求建立的阈值时，我们可能认为该分类器是良好的。\n\
  \n另一方面，我们不知道每个分类器在未见数据上的表现如何。尽管 AI 框架创建了有助于提高分类器稳健性的过程，但可以预见到分类质量在新数据上将会下降。因此，AI\
  \ 框架并没有使用单一分类器，而是使用一组入围的分类器，然后通过投票法对预测的分类做出决策。\n\n\n本书不应被视为 SAS 或 R 的编程教程。关于这个主题有大量的文献。然而，我们希望演示如何使用某些功能，并希望这些示例能让读者通过使用\
  \ SAS、R 或额外软件的其他功能来扩展 AI 框架。\n\nSAS 拥有一套强大的工具，用于机器学习方法、实验设计（Lawson, 2010）、实验结果分析等。在本书中，我们使用\
  \ SAS 过程作为 AI 框架的基本单元。但这并非全部。SAS 拥有一门强大的宏语言，允许我们根据存储在数据字典中的元数据执行任务。这是我们在 AI 框架中利用的\
  \ SAS 能力（Guard, 2018）。\n\n\nR 语言由于其开源语言的本质，在机器学习领域不断增长，并有多个可以用于高级机器学习项目的包。在本书中，我们并不尝试使用所有的包，但我们邀请读者考虑使用不同机器学习方法和\
  \ R 包的机会。`e1071` 包是机器学习领域使用最广泛的 R 包之一，也是我们在书中利用的包。该包允许我们实现诸许多方法，如支持向量机（SVM）、最短路径计算、袋聚类（bagged\
  \ clustering）、朴素贝叶斯分类器、短傅里叶变换和模糊聚类。另一个包 `kernlab` 也实现了 SVM，以及核特征分析、排名算法、点积原语、高斯过程等。该包提供了不同的核函数，如多项式、双曲正和拉普拉斯。对于神经网络，可以使用\
  \ `nnet` 包。尽管该包有单层限制，但它仍然是最神经网络流行的包之一。可以使用 `randomforest` 机器学习包来构建生成多个决策树的随机森林分类器。另一个\
  \ R 机器学习包是 `mboost`，它具有函数梯度下降算法，用于优化通用风险函数。\n\n除了机器学习能力外，R 还提供了 AI 框架必需的实验设计包（Lalanne,\
  \ 2006）。例如，`doe.base` 包提供了设计和分析全因子实验和正交表的实用；`frf2` 允许对具有两水平因素的部分析实验进行设计和分析；`dicedesign`\
  \ 允许我们设计和执行计算机实验；`bsmd` 是贝叶斯筛选和模型判别工具的包；`doe.wrapper` 是一个实验设计功能的封装包。\n\n在 SAS 和\
  \ R 中开发的各种函数和过程是 AI 框架的构建模块。\n\n\n1. Guard, R. 2018. *Machine Learning with SAS®:\
  \ Special Collection*. Cary, NC: SAS Institute Inc.\n2. Lalanne, C. 2006. *R Companion\
  \ to Montgomery’s Design and Analysis of Experiments*. [https://www.semanticscholar.org/]\n\
  3. Lawson, J. 2010. *Design and Analysis of Experiments with SAS*. Chapman and Hall:\
  \ CRC.\n4. R Core Team. 2018. *R: A Language and Environment for Statistical Computing*.\
  \ Vienna, Austria: R Foundation for Statistical Computing.\n\n\n## 2.1 引言\n\n机器学习是研究从数据中学习的方法。机器学习的正式定义由\
  \ Tom Mitchell (1997) 给出，他指出：“如果一个计算机程序对于某些任务类 `T` 和性能衡量 `P`，随着经验 `E` 提高其在任务 `T`\
  \ 上的性能 `P` 则被称为机器学习。”在本书的范围内，我们考虑将监督学习应用于存在人类专家但无法解释其专业知识的情况。具体而言，在第三部分，我们将演示如何针对保险和金融行业的决策案例构建分类解决方案。\n\
  \n有几种不同类型的机器学习算法（Dietterich, 2000）。监督学习或半监督学习（有时称为归纳学习）使用包含输入数据和期望输出的训练数据集构建模型。当问题涉及分类时，输出被称为标签。通过这些输出，监督学习揭示了与新输入相关的函数。\n\
  \n我们在书中回顾的一个示例是：保险核保员具有专家水平的能力来评估保险申请并向申请人提供合适的报价，但他们无法准确描述自己在核保过程中执行的步骤，也无法将其知识经验分享给年轻且技术较低的核保员。在这个示例中，关于核保决策的历史数据可以提供输入输出的示例，以便机器学习算法学习建模决策。监督分类的一个应用示例是开发一个计算机程序，在给定特定业务种类的保险申请时，确定申请人对特定保险报价的响应（接受或拒绝）。这样的程序被称为分类器，因为它为对象（申请人）分配类别（接受或拒绝）。监督学习的任务是在给定一组已分类（已标记）示例（如带有接受或拒绝响应的保险申请和保险产品）的情况下构建分类器。在半监督学习的情况下，期望输出也包含缺失值。\n\
  \n无监督学习是指训练数据不包含期望输出。无监督学习的一个例子是聚类，算法尝试在数据中发现某些结构，例如数据点的分组或聚类。此类算法从未标记、分类或分类的数据中学习。在这种情况下，很难判断什么是好的学习，什么不是。\n\
  \n最有野心的学习类型是强化学习。它是一种机器学习技术，允许算法在交互式环境中通过试错进行学习，利用自身行为和经验的反馈作为奖励或惩罚。\n\n\n\n在书中，我们讨论了仅针对监督学习机器学习方法的优化框架。\n\
  \n\n有时，监督学习被与统计学家所的工作进行比较。“监督”指的是响应（responses）是可用的事实，而“学习”一词指的是任何可以对其输出的有效性进行测试的方法或程序。当响应可用时，模型识别、决策制定或预测等分析目标就可以得到验证。通常情况下，监督学习指的是分类。\n\
  \n分类的目标是使用在每个对象上观察的一系列特征，将种中的对象分配到若干个类别之一。例如，在保险核保员的情况下，特征集可能包括保险申请的特征以及针对该申请提供的保险产品特征。这些类别是预先知道的，可以是有序的也可以是无序的。在保险申请的相同示例中，类别将是两种之一：申请人接受提供的保险产品，或者拒绝该报价。\n\
  \n分类器构建在训练数据集上，在这些数据集中，特征和标签都是已知的，供分类器构建算法使用。\n\n分类器的质量通过计算每个类别中分类正确对象的比例来衡量。这种衡量标准被称为误分类矩阵（misclassification\
  \ matrix），首先在训练数据集上计算，然后是在测试数据集上计算。\n\n误分类矩阵有时也被混淆矩阵（confusion matrix）或误差矩阵（error\
  \ matrix）。它视觉化了机器学习方法的性能，并作为计算分类性能指标的基础。误分类矩阵的每一行代表预测标签，每一列代表实际标签。该矩阵的每个单元格包含对应于预测和实际标签的实例频率（参见[表\
  \ 2.1]）。\n\n\n| 预测 \\实际 | 标签“TRUE” | 标签“FALSE” |\n| :--- | :--- | :--- |\n| **TRUE**\
  \ | | |\n| **FALSE** | | |\n\n\n\n神经网络方法的创建是为了尝试模仿大脑处理和存储信息的方式。大脑的基本组件——神经元于 1836\
  \ 年被发现。在过了 100 多年后，神经网络研究与开发的现代时代才在 W.S. McCulloch 和 W. Pitts 写的经典论文《神经活动中蕴含概念的逻辑演算》（A\
  \ Logical Calculus of the Ideas Immanent in Nervous Activity）中开启。\n\n\n\n\n动态神经网络在整个运行过程中永不停止学习并持续发展。它们不断适应最新数据，并改变其内部的神经元结构和权重。动态神经网络用于系统在运行期间需要学习新数据的情况。当我们预计会有新的输入-输出模式时，这种类型的神经网络是不可缺的，例如当领域随时间变化，或者输出受到缓慢过程的影响时。\n\
  \n\n\n神经网络分类器的一个重要组件是激活函数，它可以被解释为指示函数。神经元的激活函数定义了该神经元的输出取决于神经元的输入。Sigmoid 函数经常用作激活函数。Sigmoid\
  \ 函数的一个例子是逻辑函数：\n\n```\n${g\\left( x \\right) = \\frac{1}{1 + \\exp\\left( {- x}\
  \ \\right)}}\\\\mspace{54mu}\\\\operatorname{(2.3)}$\n```\n\n对于这种激活函数，`x` ≥ 0 时激活神经元。\n\
  \n神经网络使用的激活函数的另一个例子是对称 sigmoid 函数：\n\n```\n${g(x) = 2 \\times \\frac{1}{1 + \\exp\\\
  left( {- x} \\right)} - 1 = \\frac{1 - \\exp\\left( {- x} \\right)}{1 - \\exp\\\
  left( {- x} \\right)} = \\tanh\\left( \\frac{x}{2} \\right)}\\\\mspace{54mu}\\\\\
  operatorname{(2.4)}$\n```\n\n更多示例包括修正的线性单元（ReLU）（公式 2.5）和径向基函数（公式 2.6）：\n\n```\n\
  ${g\\left( x \\right) = \\left\\\\{ \\begin{array}{l} {0,x \\leq 0} \\\\\\\\ {x,x\
  \ > 0} \\\\\\\\ \\end{array} \\right.}\\\\mspace{54mu}\\\\operatorname{(2.5)}$ `g`(`x`) = exp (−`x`²)   (2.6) \
  \ \n```\n\n对于径向基激活函数，`x` = 0 时激活神经元（图 2.1）。\n\n\n\n激活函数。\n\n\n神经网络的基础组件是神经元。它由一个激活函数\
  \ `g` 和一个参数向量 $\\overset{\\\\rightarrow}{w} = \\left( {w_{0},w_{1},\\ldots,w_{n}}\
  \ \\right)$ 组成。神经元接收实值输入向量（也称为特征），并激活函数和参数向量计算输出：如果激活函数的结果大于阈值（或等于指定值），则输出为 1；否则输出为\
  \ 0。更精确地说，输出 `o`(`x[1], … , `x[n]`) 是由方程 (2.7) 形式化的神经元计算的。\n\n```\n${o\\left( {x\\\
  _{1},\\ldots,x\\_{n}} \\right) = \\left\\\\{ \\begin{array}{l} {1ifg\\left( {w\\\
  _{0} + w\\_{1}x\\_{1} + \\cdots + w\\_{n}x\\_{n}} \\right) > 0} \\\\\\\\ {0\\text{otherwise}}\
  \ \\\\\\\\ \\end{array} \\right.}\\\\mspace{54mu}\\\\operatorname{(2.7)}$\n```\n\
  \n其中\n\n`w[i]` 是决定输入 `x[i]` 对神经元输出贡献的权重。\n\n`w[0]` 是阈值，输入的加权组合（`w[1]```x[1]` + ⋯\
  \ + `w[n]```x[n]`）必须超过该阈值才能激活神经元。\n\n神经元的学习涉及估计权重 `w[0]`、`w[1]`、…… `w[n]` 的取值。\n\
  \n\n神经网络将多个神经元组合成单个函数，有许多不同的算法可以执行这项工作。神经网络中的一些神经元使用特征值向量作为输入，另一些使用某些神经元的输出作为输入，而还有一些使用两者的结合。神经网络的参数包括神经元的参数\
  \ `g` 和 $\\overset{\\\\rightarrow}{w}$、神经元的连接方式以及线性函数输出层的参数。神经元通常根据它们接收到的输入类型分层排列。在输入层，神经元接收特征向量作为输入；在随后的层中，神经元接收上一层的输出作为输入。输入层和输出层以外的层被称为神经元的隐藏层。\n\
  \n神经网络的示例所示图 2.2。该神经网络有一个包含 `m` 个线性函数 `F[1]`、…… `F[m]` 的输出层，以及一个包含 `k` 个神经元的单隐藏层\
  \ `Z[1]`、…… `Z[k]`。\n\n\n\n神经网络。\n\n\n由 Stefan Fritsch、Frauke Guenther、Marvin N.\
  \ 开发的 `neuralnet` 包包含 `neuralnet` 函数，该函数实现了如反向传播（Riedmiller, 1994）、带或不带权重的反向传播，或者\
  \ Anastadis (2005) 和 Taylor (2006) 的改进版本。在研究人员中非常受欢迎；但其用法并不总是正确的。\n\n\n`neuralnet`\
  \ 函数的参数\n\n| | 参数 |  |\n| --- | --- | --- |\n| 1 | `formula` | 拟合模型的符号描述 |\n| 2\
  \ | `data` | 包含公式中变量的数据框 |\n| 3 | `hidden` | 指定每层隐藏神经元的整数向量 |\n| 4 | `threshold`\
  \ | 指定误差函数偏导停止标准的数值值 |\n| 5 | `stepmax` | 训练的最大步 |\n| 6 | `rep` | 神经网络的重复次数 |\n\
  | 7 | `startweights` | 权重初始值的向量 |\n| 8 | `learningrate.limit` | 学习率最低和最高限制的向量或列表（用于\
  \ RPROP 和 GRPROP） |\n| 9 | `learningrate.factor` | 上下学习率的乘因子向量或列表（用于 RPROP 和 GRPROP）\
  \ |\n| 10 | `learningrate` | 指定学习率的数值（用于传统反向传播） |\n| 11 | `lifesign` | 指定在计算神经网络期间打印多少信息的字符串（“none”、“minimal”或“full”）\
  \ |\n| 12 | `lifesign.step` | 在“full”显示模式下打印最小阈值的步长整数 |\n| 13 | `algorithm` | 用于计算神经网络的算法类型字符串\
  \ |\n| 14 | `err.fct` | 用于计算误差的可微函数，或 `sse` 用于误差平方和，或 `ce` 用于交叉熵 |\n| 15 | `act.fct`\
  \ | 用于平滑变量或神经元与权重乘积结果的可微函数，或 `logistic` 用于逻辑函数，或 `tanh` 用于双曲正切 |\n| 16 | `linear.output`\
  \ | 如果不应对输出神经元应用 `act.fct`，将其设置为 TRUE，否则为 FALSE |\n| 17 | `exclude` | 指定排除在计算之外的权重向量或矩阵\
  \ |\n| 18 | `constant.weights` | 指定排除训练并视为固定的权重值的向量 |\n| 19 | `likelihood` | 如果误差函数等于负对数似然函数，则将计算信息准则\
  \ AIC 和 BIC。 |\n\n\n\n\n目前还没有关于如何选择训练神经网络所需的属性值的具体“配方”。对于参数 `formula`，应该决定在模型中包含哪些特征。这个问题本身就构成了一项重大的挑战，并在大量的研究和出版物中得到了解决。但无论读者使用何种方法来选择特征，这种选择都与函数的其余参数混杂在一起。例如，如何定义参数\
  \ `hidden` 的值：需要多少个隐藏层以及每层有多少个神经元？我们可以肯定，对于不同的特征集，答案将会是不同的。\n\n在 `neuralnet` 函数算法提供的四种算法中选择一种用于神经网络训练的算法也是困难的。尽管我们知道算法是如何运作的，但在大多数情况下，我们用于训练神经网络的数据特征是未知的。但即便如此，即使我们对算法做出了一些决定，又如何选择反映学习率的属性（`learningrate.limit`、`learningrate.factor`、`learningrate`）的值呢？\n\
  \n如果还不够，我们现在必须决定损失函数（`err.fct`）和激活函数（`act.fct`）的形式。\n\n\n\n支持向量机（SVM）是一种经过证明的分类方法，它可以在不需要统计模型的情况下直接最小化分类误差。SVM\
  \ 可以处理海量的特征空间，并保证在存在的情况下找到一个全局最优的分离超平面。此外，SVM 分类器构建在边界案例之上，这允许它们处理缺失数据。SVM 分类器可以通过将数据映射到高维（转换后的）空间来分离原始空间（例如二维空间）中难以分离的数据。简单来说，非线性分类器使用非线性函数\
  \ `Φ` 将我们的数据从输入空间 `X` 映射到特征空间 `F`：`X→F`。在空间 `F` 中，判别函数如下：\n\n$f(x) = w^{(T)}\\Phi(x)\
  \ + b \\quad (2.8)$\n\n\n核方法解决了将数据映射到高维特征空间的问题。假设权重向量可以表示为训练示例的线性组合：\n\n$w = \\\
  sum_{i = 1}^{n}\\alpha_{i}x_{i} \\quad (2.9)$\n\n那么\n\n$f(x) = \\sum_{i = 1}^{n}\\\
  alpha_{i}x_{i}^{T}x + b \\quad (2.10)$\n\n在特征空间 `F` 中，该表达式的形式为：\n\n$f(x) = \\sum_{i\
  \ = 1}^{n}\\alpha_{i}\\Phi(x_{i})^{T}\\Phi(x) + b \\quad (2.11)$\n\n特征空间 `F` 可能是高维的，使得这种转换变得困难，除非核函数定义为可以高效计算的形式：\n\
  $K(x,x') = \\Phi(x)^{(T)}\\Phi(x') \\quad (2.12)$\n\n从核函数的角度，判别函数可以写为：\n\n$f(x)\
  \ = \\sum_{i = 1}^{n}\\alpha_{i}K(x,x') + b \\quad (2.13)$\n\n有不同的核函数。例如，次数为 `d`\
  \ 的多项式核定义为：\n\n$K(x,x') = (x^{(T)}x'+1)^{(d)} \\quad (2.14)$\n\n该核的特征空间由所有次数小于 `d`\
  \ 的单项式组成，例如：\n\n$x_{1}^{d_{1}}x_{2}^{d_{2}}\\ldots x_{m}^{d_{m}},\\text{where}{\\\
  sum_{i = 1}^{m}{d_{i} \\leq d}} \\quad (2.15)$\n\n多项式次数 `d` 的增加会导致分类器灵活性的增加。\n\n\
  另一种广泛使用的核是高斯（径向基函数）核，其定义为：\n\n$K(x,x') = \\exp(-\\gamma\\|x-x'\\|²) \\quad (2.16)$\n\
  \n其中 `γ` > 0 是控制高斯函数宽度的参数。它在控制结果分类器灵活性方面起着与多项式核次数的作用。\n\n双正切函数也称为 sigmoid）是另一种流行的核。它的定义为：\n\
  \n$K(x,x') = \\tanh(\\alpha x^{(T)}x'+b) \\quad (2.17)$\n\n其中 `α` 是斜率，`b` 是截距。\n\
  \n\n偏差-方差问题是在试图同时最小化这两个误差来源时的冲突。SVM 使用核函数来找到一个最大化两类之间距离的超平面。\n\n\n软间隔优化问题（Cortes\
  \ and Vapnik, 1995）公式如下：\n\n$\\begin{array}{l} \\text{minimize on }w,b:\\frac{1}{2}\\\
  |w\\|² + C\\sum_{i = 1}^{n}e_{i} \\\\ \\text{subject to}:y_{i}(w^{T}x_{i} + b) \\\
  geq 1 - e_{i},e_{i} \\geq 0,i =1,\\ldots,n \\end{array} \\quad (2.19)$\n\n其中：\n\n\
  *   `w` 是间隔，\n*   `C` 是设置最大化间隔和最小化松弛变量数量相对重要性的常数，\n*   `e[i]` 是松弛变量，允许案例位于间隔内（0\
  \ ≤ `e[i]` ≤ 1，称为间隔误差）或被错误分类（`e[i]` > 1），\n*   `y[i]` ——训练数据集的输出结果，也称为标签，\n*   `b`\
  \ 是使超平面偏离原点的偏差。\n\n\n偏差是由于学习算法中的错误假设引起的误差。高偏差意味着特征与输出之间的欠拟合。方差是由于敏感性指标对训练集微小波动的反应产生的误差。高方差意味着特征与输出之间的过拟合。\n\
  \n偏差-方差权衡是监督学习中的核心问题。在统计学和机器学习中，偏差-方差权衡是预测模型集的一种属性，参数估计偏差较低的模型跨样本的方差较高，反之亦然。偏差-方差问题是在试图同时最小化这两个误差来源时的冲突，这些误差阻止了像\
  \ SVM 的监督学习算法在训练集之外进行泛化。\n\n\n\n\n*   内核的参数，例如在径基或 sigmoid 内核变换（方程 2.16）中的 `γ`，或者在多项式内核（方程\
  \ 2.14 和 2.15）中的 `d`。\n\n较大的 `C` 导致低偏差和高方差，而较小的 `C` 导致高偏差和低方差。较大的 `d` 或 `γ` 导致高偏差和小方差，而较小的\
  \ `d` 或 `γ` 导致低偏差和高方差。例如，如果 `γ` 很大（方差较小），这意味着 SVM 的结果没有广泛的影响，无法推广到训练数据集之外。\n\n\n\
  R 语言“e1071”由维也纳工业大学统计系的一个团队开发。该包包含了具有 22 个参数的 `svm` 函数。\n\n\n\n|  || 参数 || 描述 |\n\
  | --- | --- | --- |\n| 1 || `formula` || 拟合模型的符号描述 |\n| --- | --- | --- |\n| 2 ||\
  \ `data` || 包含模型中变量的可选数据框 |\n| --- | --- | --- |\n| 3 || `x` || 数据矩阵、向量或稀疏矩阵 |\n\
  | 4 || `y` || 响应向量，`x` 的每个行/分量对应一个标签 |\n| 5 || `scale` || 指示需要缩放变量的逻辑向量 |\n| 6 ||\
  \ `type` || `svm` 可用于分类机、回归机或新颖性检测 |\n| 7 || `kernel` || 训练和预测时使用的内核 |\n| 8 || `degree`\
  \ || 多项式类型内核所需的参数 |\n| 9 || `gamma` || 除线性内核外所有内核都需要的参数 |\n| 10 || `coef0` || 多项式内核和\
  \ sigmoid 类型内核需要的参数 |\n| 11 || `cost` || 违反约束的代价 |\n| 12 || `nu` || nu 分类、nu 回归和单类分类所需的参数\
  \ |\n| 13 || `class.weights` || 用于不同类别的权重命名向量，用于处理不对类别大小 |\n| 14 || `cachesize`\
  \ || 以 MB 为单位的缓存内存（默认 40） |\n| 15 || `tolerance` || 终止准则的容差 |\n| 16 || `epsilon`\
  \ || 不敏感损失函数中的 epsilon |\n| 17 || `shrinking` || 是否使用收缩启发方法的选项 |\n| 18 || `cross`\
  \ || 训练数据上的 k 折交叉验证 |\n| 19 || `fitted` || 指示是否应该计算拟合值的逻辑值 |\n| 20 || `probability`\
  \ || 指示模型是否允许概率预测的逻辑值 |\n| 21 || `subset` || 指定用于训练样本的案例索引向量 |\n| 22 || `na.action`\
  \ || 指定在发现 NA 时所采取操作的函数 |\n\n在这些属性中，我们主要感兴趣的是与内核及其超参数的指定有关：`kernel`、`degree`、`gamma`、`coef0`\
  \ 和 `cost`。`svm` 函数允许四种内核：线性、多项式、高斯（径基函数）和双曲正（sigmoid）。根据内核的选择，应该指定 `degree`、`gamma`\
  \ 和 `coef0` 的值。遗憾的是，内核的选择和超参数的值通常留为默认值，即 `kernel` = `radial`、`degree` = 3、`gamma`\
  \ = 1/数据维度、`coef0` = 0 且 `cost` = 1。我们希望选择能如此简单！\n\n\n\n由于 SVM 不对数据分布建模，而是直接最小化分类误差，SVM\
  \ 的输出是二元决策。换句话说，SVM 的是未校准的值，而不是概率。\n\n考虑二分类问题：对于输入 `x`，我们想要确定它们属于标记为 +1 和 −1 的两个类别\
  \ `y` 之一。我们假设分类问题将通过实值函数 `f(x)` 预测类别 `y` 来解决。对于许多问题，获取概率 `P(y = 1 | f(x))` 是方便甚至必须的。虽然二元决策对于许多问题是足够的，但很难得出概率。通过将\
  \ SVM 的输出映射到概率可以缓解这些担忧。已经开发了多种方法来解决这个问题。Vapnik 建议了一种将输出映射到特征空间的方法。Platt 将输出转换为概率。在书中，我们建议应用\
  \ Firth 回归。使用逻辑回归的好处是结果更具通用性。\n\n\n让我们考虑二元因变量 `y` 和带有系数向量 `β` 的 `x` 向量的逻辑回归：\n\n\
  $P(y = 1 | x) = π = \\frac{1}{1 + \\exp(-xβ)}$\n\n其中：\n\n`y` 是二元因变量，`y = (y1, ...,\
  \ yn)`，`x` 是自变量向量，`x = (x1, ..., xk)`，`β` 是系数向量，`β = (β1, ..., βk)`。\n\n该模型的对数似然如下：\n\
  \n$\\ln L(β | y) = \\sum_{i=1}^{n} \\{yi \\ln(\\frac{1}{1 + \\exp(-xiβ)}) + (1 -\
  \ yi) \\ln(1 - \\frac{1}{1 + \\exp(-xiβ)})\\}$\n\n因此，得分函数如下：\n\n$\\frac{\\partial\\\
  ln L(β | y)}{\\partial\\beta} = U(β) \\sum_{i=1}^{n} \\{yi \\ln(\\frac{1}{1 + \\\
  exp(-xiβ)}) + (1 - yi) \\ln(1 - \\frac{1}{1 + \\exp(-xiβ)})\\}$\n\n使用标准的迭代方法（例如牛顿-拉夫逊法），我们可以通过求解方程\
  \ (2.20) 中的 `β` 来找到 `β̂`。\n\n\n\n\n\n二分类相关因变量模型中的一个常见问题是“分离（separation）”。Albert\
  \ 和 Anderson (1984) 提出了这一术语，并将其区分为“完全分离”和“准完全分离”。当模型中的一个或多个协变量能够完美预测某些二元结果时，就会发生完全分离。准完全分离是指这种完美预测仅发生在数据中部分观测值的情况。\n\
  \n分离意味着存在一个子向量 `x[s]`，使得所有 `n` 个观测值都可以被正确归类为 `y[i] = 0` 或 `y[i] = 1`。此类子向量的存在会导致对数似然函数呈现单调性。因此，`x[s]`\
  \ 子向量中变量的极大似然估计 $\\hat{\\beta_{s}}$ 等于正无穷或负无穷，且相关的标准误差估计也是无穷的。\n\n这正是 SVM 分类器结果中恰发生的情况，其中\
  \ `f(x)` 的值代表到分离超平面的距离，因此，它的值完美预测了分类的二元结果。\n\n关于分离这一主题有大量的文献，并且关于如何处理这一问题有多种提议（参见\
  \ Rainey, 2016 和 Zorn, 2005）。在本书中，我们将使用 Firth 偏差修正法来解决逻辑回归中的分离问题。使用惩罚似然估计的 Firth\
  \ 方法被认为是解决分离问题的理想方案。\n\nFirth 在他 1993 年的论文中提出了一种消除极大似然估计中小样本偏差的方法。Firth 方法的核心思想是以\
  \ Jeffreys (1946) 不变先验分布的形式将偏差项引入标准似然函数中。随着 `N→∞`，偏差本身趋于零，但对于较小的 `N`，则存在 `O(N^(−1))`\
  \ 偏差。因此，Firth 创建了一个惩罚对数似然公式：\n\n```\nln L(β|y)* ℃=℃ln L(β|y) ⅅ+ 0.5ln |i(β)|   (2.23)\n\
  ```\n\n以及相应的得分函数方程：\n\n```\n{\\frac{\\partial\\ln L\\left( \\beta \\middle| y \\\
  right)^{\\*}}{\\partial\\beta} \\equiv U\\left( \\beta \\right)^{\\*} = U\\left(\
  \ \\beta \\right) + 0.5\\text{tr}\\left\\{ {i\\left( \\beta \\right)^{- 1}\\leftleftlbrack\
  \ \\frac{\\partial i\\left( \\beta \\right)}{\\partial\\beta} \\rightrbrack} \\\
  right\\}\\mspace{54mu}\\operatorname{(2.24)}\n```\n\n其中 `i(β)` 是 Jeffreys 无信息先验，`ln\
  \ L(β|y)` 和 `U(β)` 分别由方程 (2.21) 和 (2.22) 描述。\n\nFirth 还证明了他的惩罚似然估计对于很大类广义线性模型都是渐近一致的，并且消除了通常的小样本偏差。他还表明，在许多标准似然估计不存在的情况下，惩罚似然估计存在，包括当\
  \ `N→∞` 时，惩罚似然估计收敛于 MLE。\n\n\n用于 Firth 逻辑回归的第一个 R 包 `brlr` 由作者编写，但目前 `brlr` 已被更高效的\
  \ `brglm` 包取代。\n\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `formula` | 待拟合模型的符号描述 |\n|\
  \ `family` | 对所使用的误差分布和链接函数的描述。`brglm` 目前仅支持 `binomial` 族，其链接函数为 `logit`、`probit`、`cloglog`、`cauchit`\
  \ |\n| `data` | 包含变量的可选数据框 |\n| `weights` | 拟合过程中使用的可选权重向量 |\n| `subset` | 指定拟合过程中使用的观测值子集的可选向量\
  \ |\n| `na.action` | 当数据包含 NA 时的处理函数 |\n| `start` | 线性预测器参数的初始值 |\n| `etastart`\
  \ | 线性预测器的初始值 |\n| `mustart` | 均值向量的初始值 |\n| `offset` | 可用于指定拟合过程中包含的先验部分 |\n| `control.glm`\
  \ | `control.glm` 替换了 `glm` 中的 `control` 参数，但基本功能相同。它是控制 `glm.fit` 的参数列表 |\n| `control`\
  \ | 控制拟合过程的参数列表 |\n| `intercept` | 逻辑值，指示是否在空模型中包含截距项 |\n| `model` | 逻辑值，指示是否将模型框架作为返回值的一部分返回\
  \ |\n| `method` | 用于拟合模型的方法。默认方法为 `brglm.fit`，它使用修正得分估计法或极大惩罚似然法（见下文 `pl` 参数） |\n\
  | `pl` | 逻辑值，指示是否使用极大惩罚似然拟模型（使用 Jeffreys 不变先验进行惩罚），或使用减少偏差的修正得分 |\n| `x` | 逻辑值，指示是否将拟合过程中使用的响应向量和模型矩阵作为返回值返回\
  \ |\n| `y` | 逻辑值，指示是否将拟合过程中使用的响应向量和模型矩阵作为返回值返回 |\n| `contrasts` | 与 `glm` 相同的可选列表\
  \ |\n| `control.brglm` | 当 `method = \"brglm.fit\"` 时控制拟合过程的参数列表 |\n\n在我们的案例中，Firth\
  \ 惩罚逻辑回归将应用于 SVM 的结果。由 SVM 计算的到超平面的距离作为自变量赋值给参数 `*x*`，而标签将赋值给参数 `*y*`。\n\n\n\n\n\
  \n另外两个我们想要提到的参数是 `method` 和 `pl`，它们允许使用 Firth 惩罚逻辑回归来指定模型。`method` 参数的默认值为 `glm.fit`，这意味着将使用修正后的评分法（modified-scores\
  \ approach）或极大似然法。`pl` 参数被赋予一个布尔值，指示是否应该使用带有 Jeffreys 先验的 Firth 惩罚似然法进行模型拟合。`pl`\
  \ 参数的默认值为 `FALSE`，这得到的估计值在偏误的渐近展开中不包含 `O(N^-1)` 项。当 `pl` 被赋值为 `TRUE` 时，也能减少偏误，但通常达不到这种量级。在逻辑回归的情况下，`pl`\
  \ 的值无关紧，因为自然族的极大似然估计是相匹配的（Firth, 1993）。\n\n\nSAS 的 `LOGISTIC` 过程为离散响应拟合线性回归模型。它也可以对具有二元响应的数据执行条件逻辑回归，并对具有二元和名义响应的数据执行精确逻辑回归。该过程使用\
  \ Fisher 评分法或 Newton–Raphson 算法执行极大似然估计。该过程还可以根据 Firth (1993) 和 Heinze Scheper (2002)\
  \ 执行能够减少偏误的惩罚似然优化。\n\n`PROC LOGISTIC` 的完整描述可以在 SAS 文档中找到。在这里，我们只讨论与 Firth 方法相关的参数。`PROC\
  \ LOGISTIC` 的 `MODEL` 语句指定了应该被估计的模型，以及指定如何估计该模型的选项列表。模型可以用两种可能的形式指定。第一种形式被称为“单试验”（`single-trial`），适用于二元、序数和名义响应数据，用于数据中的每个观测值仅包含关于单次试验（如实验）信息的情况。\n\
  \n第二种形式被称为“事件/试验”（`events/trials`），仅限于二元响应数据的情况。在这种情况下，每个观测值以观测受者计数的形式包含关于二元响应试验的信息。\n\
  \n`PROC LOGISTIC` 将采用 `single-trial` 形式。自变量将是 `SVM` 产生的距离，因变量将是来自训练或测试数据集的标签。\n\n\
  为了请求 `PROC LOGISTIC` 执行 Firth 惩罚似然估计，应在 `MODEL` 语句中包含 `FIRTH` 选项。\n## 2.6 总结\n\n\
  在本章中，我们讨论了机器学习的原理，并回顾了两种特定方法：神经网络和支持向量机。大量的文献回顾了这些以及其他机器学习方法。然而，在这些方法的实际应用中面临着多重挑战。\n\
  \n其中一个挑战是超参数的选择。例如，在上面讨论的用 R 编写的 `svm` 函数分配的默认值可以被视为占位符。为什么 `cost` 被赋值为 1？或者为什么用于所有内核的\
  \ `gamma` 是 1？另一个挑战是开发一种稳健的分类器，使其能够成功处理未见数据，即未出现在训练或测试数据集中的数据。\n\n在书中，我们提出了一个有助于解决这些挑战的框架。\n\
