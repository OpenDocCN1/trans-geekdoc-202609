  \n**图 11.7**\n\n8 月 1 日开始的保单下，伊利诺伊州各行业的生存函数。\n\n这些模型揭示的信息可以用于核保和定价、新保险产品的开发以及营销。例如，保险公司可以根据行业，还根据保单开始的时间段，更准确地估计理赔风险。保险公司可以更好地管理与理赔相关的损失预期。此外，保险公司还可以开发期限短于\
