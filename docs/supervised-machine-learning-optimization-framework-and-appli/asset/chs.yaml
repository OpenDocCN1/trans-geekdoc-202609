  \n### 5.2.9 使用 R 进行线性混合模型分析\n\n`lme4` R 语言包由 Douglas Bates、Martin Maechler、Ben Bolker\
  \ 和 Steven Walker 团队开发，它提供了用于拟合和分析线性混合模型、广义线性混合模型和非线性混合模型的函数。在 R 中，混合建模的 `lme4`\
  \ 替代方案是由 José Pinheiro 和 Douglas Bates 编写的 `nlme` 包。`nlme` 和 `lme4` 包之间的主要区别如下：\n\
  \n* `lme4` 使用了来自 `eigen` 包的现代、高效的线性代数方法并使用了引用类（reference classes），因此在处理大型对象时，它比\
  \ `nlme` 更快且更节省内存。\n* `lme4` 包含了利用 `glmer` 函数的广义线性混合模型能力。\n* `lme4` 目前没有实现异方差和残差相关建模的功能，而这些在\
  \ `nlme` 中是实现的。\n* `lme4` 提供了似然剖面分析（likelihood profiling）和参数自助法（parametric bootstrapping）的内置功能。\n\
  * `lme4` 比 `nlme` 更具模块化，其组件更容易复用，以对基本混合模型框架进行扩展。\n\n在我们的框架中，我们使用 `lme4` 包，它提供了用于拟合和分析混合模型的函数：`lmer`\
  \ 用于线性模型，`glmer` 用于广义线性模型，以及 `nlmer` 用于非线性模型。这些函数的参数描述于表 5.9。\n\n**表 5.9**\n\n`lmer`、`glmer`\
  \ 和 `nlmer` 函数的参数\n\n| | 参数 | 函数 | 描述 |\n| --- | --- | --- | --- |\n| 1 | `formula`\
  \ | `lmer`, `glmer`, `nlmer` | 一个双侧线性公式对象，描述了模型的固定效应部分和随机效应部分；对于 `nlmer`，它是一个三部分结构的“非线性混合模型”公式\
  \ |\n| 2 | `data` | `lmer`, `glmer`, `nlmer` | 一个包含公式中命名变量的可选数据框 |\n| 3 | `family`\
  \ | `glmer` | 一个 GLM 族 |\n| 4 | `REML` | `lmer` | 一个布尔参数——用于选择 REML 准则还是对数似然 |\n\
  | 5 | `control` | `lmer`, `glmer`, `nlmer` | 一个包含控制参数的列表，包括要使用的非线性优化器以及传递给非线性优化器的参数\
  \ |\n| 6 | `start` | `lmer`, `glmer`, `nlmer` | 模型中参数初始值的命名列表，或数值向量 |\n| 7 | `nAGQ`\
  \ | `glmer`, `nlmer` | 用于评估对数似然的自适应高斯-Hermite 近似时，每轴的点数 |\n| 8 | `subset` | `lmer`,\
  \ `glmer`, `nlmer` | 一个可选表达式，指示在拟合中应使用的行子集 |\n| 9 | `weights` | `glmer`, `nlmer`\
  \ | 用于拟合过程的“先验权重”可选向量 |\n| 10 | `offset` | `glmer`, `nlmer` | 拟合期间包含在线性预测器中的先验已知分量\
  \ |\n| 11 | `mustart` | `glmer` | 在条件均值尺度上的可选初始值 |\n\n使用哪种函数的选择取决于模型的结构。对于 5.2.7\
  \ 中的示例，`lmer` 可以成功应用。\n\n### 5.3 总结\n\n一组超参数的选择是一个远非直观的过程，也不允许某种“经验法则”方法。同时。\n\n\
  \n\n\n*   应用设计被视为数据，且无仅仅是数据。这意味着应用设计被定义在一组特殊结构的表中，并以普通数据相同的方式进行存储、更新和管理。\n*   应用活动通过“必须做什么”来表述，而不是“如何做”。一个应用活动可以被想象为状态的定义，以及允许从一个状态转换到另一个状态的消息。当然，这些状态和消息像普通数据一样被存储、更新和管理。应用设计者通过使用状态和消息来定义完整的应用程序功能。\n\
  *   应用从单一控制点进行管理。\n\n从头到端自动化应用程序开发过程意味着：\n\n*   需求无缝衔接到设计，\n*   设计自动编写代码，\n*   代码自动部署到生产环境，以及\n\
  *   维护更改自动重写代码。\n\n无代码设计可以通过表驱动环境实现这种端到端的自动化。表驱动环境是无代码方法最根本的方面。该环境的核心是由一组特殊结构的表组成数据字典。数据字典包含了关于应用程序对象和操作的各种信息，例如数据结构和应用活动。换句话说，数据字典包含了应用设计，而数据字典程序将将其转换为适当的、功能性的工作应用程序。数据字典还支持根据应用设计的变化修改应用程序。可以根据应用需求定义不同结构的数据字典。\n\
  \n表驱动环境由表和根据表中存储的数据生成 `SAS` 或 `R` 代码的计算机程序组成。表驱动环境为无代码应用设计提供了一个方便且可靠的框架。\n\n当我们观察一个分析类应用程序时，可以看到两个重要组件：对象和操作。现实世界中的每个实体都可以表示为一个对象。考虑一个支持营销实验的应用程序示例。在这个例子中，对象是受众、营销渠道、创意等。在现实世界中，对象不断地被转换。这些转换被称为操作。只有深入理解这两个组件——对象和操作，我们才能构建有效的分析类应用程序。\n\
  \n关系型技术和无代码方法的概念是帮助对对象进行泛化的两个基本要素。\n\n## 6.2 AI 框架的数据字典组件\n\n### 6.2.1 关系模型\n\n\
  关系型数据模型包含以下元素：\n\n`Model = {*S*, *C*, *O*}`\n\n其中\n\n*   `S` 是定义数据结构的规则集：对象、它们的属性以及对象之间的关系。\n\
  *   `C` 是定义应用于所定义数据结构的约束集。\n*   `O` 是用于在所定义数据结构上执行的操作集。\n\n如果没有模型，实体之间的关系被隐藏在程序代码中。模型将这些关系显性化。此外，模型有助于确保对象之间的程序表示和交互是有效的。在应用设计期间，关系数据模型允许设计者表示应用所需的所需的精确数据结构和属性。\n\
  \n### 6.2.2 表\n\n表是关系模型中的基本实体。表可以表示为按行和列排列的二维对象。表的结构与 `SAS` 数据集或 `R` 数据帧非常相似。\n\n\
  ### 6.2.3 数据维度\n\n出于各种技术和非技术原因，关系模型被证明非常受欢迎。因为关系模型的使用非常广泛，而且它满足了许多分析类应用程序的功能需求，我们在设计表驱动环境时选择了关系模型。关系数据模型处理数据的三个方面：\n\
  \n*   数据结构\n*   数据操纵\n*   数据完整性。\n\n以下是数据结构术语及其定义。\n\n### 6.2.4 关系数据结构\n\n关系数据模型负责定义数据表示的形式（表结构），并定义允许这些表结构使用的运算符集。表结构连同允许在这些表上使用的运算符共同构成了关系数据结构。\n\
  \n### 6.2.5 域\n\n域是表中每列的特定类型的所有可能数据值的集合。列的域也可以根据另一列来定义；也就是说，第一列可能只包含来自另一列的值。域的意义如下：\n\
  \n*   如果两个列的值取自同一个域，那么涉及这两个列的比较是有意义的，因为它们在比较同类的值。\n*   如果两个列的值取自不同的域，那么涉及这两个列的比较是无意义的。\n\
  \n域可能也可能不显式地存储为实际的值集合。但它们应该作为应用定义的一部分被指定，然后每个列的定义都应该包含对相应域的引用。给定的列可以与相应的域同名，也可以有不同的名称。\n\
  \n### 6.2.6 关系与表\n\n关系（Relation）是关系数据模型中的重要术语。关系描述了列之间的连接。关系的行数被称为关系的基数（Cardinality）。关系可以方便地以表格形式表示。关系表是由行和列组成的数据结构，每一行对于该表都是唯一的。表和关系不是同一个东西，尽管为了我们本书的目的，我们假设它们是同的。关系数据模型为数据提供了符号名称，从而能够以逻辑形式操纵数据。在关系数据模型中，每个表都有一个唯一的名称来标识它。表中的每个列都有一个唯一的名称（在该表内）来标识该列。同一个列名可能出现在两个表中。在这种情况下，我们可以通过连接表名和列名的等效方式来标识列。在书中，我们经常将表的列称为\
  \ `<表名>.<列名>`\n\n### 6.2.7 函数\n\n函数是两个关系表之间特定类型的关系。假设\n\n*   第一张表的每一行恰好对应第二张表的每一行，或者\n\
  *   第一张表的多个行对应第二表的一行，或者\n*   第一张表的行与第二张表的行没有关系。\n\n这些关系都被称为第一张表和第二张表之间的函数。这些函数定义了表之间的关系或映射。关系数据模型中表的关系可以是一对一（1:1）或一对多（1:M）。\n\
  \n### 6.2.8 一对一关系\n\n一对一关系（1:1）是存在于表之间的简单关系，其中第一张表的每行都对应第二张表的一行，反之亦然。\n\n### 6.2.9\
  \ 一对多关系\n\n\n\n\n\n一对多关系 (1:M) 是存在于表之间的一种关系，其中第一个表中的每一行都对应第二个表的一行，但反之则不然。\n\n###\
  \ 6.2.10 主键\n\n根据关系数据模型，每个表都必须有一个主键。主键是一个列或一组列，它确保了表中的每一行都是唯一的。只要该列（或若干列）能为关系型表中的每行定义一个唯一值，就可以作为主键。\n\
  \n### 6.2.11 外键\n\n关系数据模型中使用的另一个术语是外键。外键用于将相关的表“链接”在一起。外键是一个列或一组列，它定义了一个数据值，该值必须存在另一个关系型表中，并作为该其他表的主键。关系数据模型通过匹配一个表中的主键值与相关表中相同的外键值来维护关系型“链接”。请注意，一个表只能有一个主键，但可以有任意数量的外键（因为一个表可以与任意数量的其他表相关联）。\n\
  \n### 6.2.12 缺失值\n\n缺失值的概念是必要的，因为现实世界的信息往往是不完整的，我们需要某种方法来处理这种不完整性。在以下情况下缺失值很有用：\n\
  \n*   当创建一个新行，但用户目前无法为某些列提供值时。应用程序可以为新行的这些列提供缺失值。\n*   当向现有表添加新列时。新列的值可以定义为所有现有行的缺失值。\n\
  *   当对表中的某一列应用聚合函数（如摘要）时。在计算该函数时，应用程序能够识别并忽略那些已提供缺失值的行是理想的。（同时，让用户理解这种情况发生的情况也是理想的；例如，平均值不等于总和除以计数。）\n\
  \n为了表示表中的某一列的缺失值，有必要找到一个与该列中所有合法符号都不同的符号。\n\n### 6.2.13 数据字典\n\n关于应用程序的所有内容都定义在具有特殊结构的表中，这些表构成了一个表驱动的环境。这些表是复杂的，并允许最终应用程序具有大量的复杂性。特殊程序将从这些表（元数据）中提取数据转换为应用程序代码。此类表和程序构成了数据字典。\n\
  \n## 6.3 数据字典的属性\n\n数据字典是关于应用程序相关对象的各种信息的存储库，例如应用程序表及其列、用户、访问权限和完整性约束。为了定义一个应用程序，我们需要构建一组数据字典表，这些表将包含关于应用程序对象的数据（元数据）。\n\
  \n数据字典表的可能包含六张表：`Library`、`Object`、`Location`、`Message`、`Property` 和 `Link`。这组表被称为\
  \ `Kernel` 集合，可以通过额外的表进行扩展。`Kernel` 表本身可以在关系模型中定义。\n\n### 6.3.1 Library 表\n\n`Library`\
  \ 表列出了关于位置的规范。表的列定义在表 6.1 中。\n\n**表 6.1**\n\n| 列名 | 类型 | 长度 | 描述 |\n| --- | ---\
  \ | --- | --- |\n| Table | Character | 8 | 表名 |\n| Location | Character | 80 | 表位置\
  \ |\n| Library | Character | 8 | 库名 |\n\n`Table` 列是 `Library` 表的主键。\n\n### 6.3.2\
  \ Object 表\n\n`Object` 表列出了应用程序表及其对应的数据集。列的定义与表 6.2 相同。\n\n**表 6.2**\n\n| 列名 | 类型\
  \ | 长度 | 描述 |\n| --- | --- | --- | --- |\n| Table | Character | 8 | 表名 |\n| Title\
  \ | Character | 80 | 表标题 |\n| Dataset | Character | 8 | 数据集名 |\n\n`Table` 列是 `Object`\
  \ 表的主键。\n\n### 6.3.3 Location 表\n\n`Location` 表列出了应用程序表和库。列定义在表 6.3 中。\n\n**表 6.3**\n\
  \n| 列名 | 类型 | 长度 | 描述 |\n| --- | --- | --- | --- |\n| Table | Character | 8 | 表名\
  \ |\n| Library | Character | 8 | 库名 |\n\n`Table` 和 `Library` 列构成了 `Location` 表的主键。\n\
  \n### 6.3.4 Message 表\n\n`Message` 表列出了应用程序消息。列定义在表 6.4 中。\n\n**表 6.4**\n\n| 列名\
  \ | 类型 | 长度 | 描述 |\n| --- | --- | --- | --- |\n| Message | Numeric | 8 | 消息标识码 |\n\
  | Text | Character | 80 | 消息文本 |\n| Mestype | Character | 1 | 消息类型：E—错误，W—警告，I—信息\
  \ |\n| Output | Character | 2 | 输出目标：S—屏幕和或 D—数据集 |\n\n`Message` 列是 `Message` 表的主键。\n\
  \n### 6.3.5 Property 表\n\n`Property` 表指定了应用程序表的属性。`Property` 表列出了每个表的列。对于每一列，定义了以下信息：\n\
  \n*   该列所属的表名\n*   列名\n*   列数据类型\n*   列长度\n*   列域\n*   屏幕表上的位置等\n\n列定义在表 6.5 中。\n\
  \n**表 6.5**\n\n| 列名 | 类型 | 长度 | 描述 |\n| --- | --- | --- | --- |\n| Table | Character\
  \ | 8 | 表名 |\n| Column | Character | 8 | 列名 |\n| Type | Character | 1 | 列数据类型：C—字符或\
  \ N—数值 |\n| Length | Numeric | 8 | 列长度 |\n| Attribut | Character | 2 | 列属性：P—主键\
  \ |\n| Domtab | Character | 8 | 域表名 |\n| Domcol | Character | 8 | 域列名 |\n| Meantab\
  \ | Character | 8 | 含义表名 |\n| Meancol | Character | 8 | 含义列名 |\n| Initval | Character\
  \ | 80 | 列初始值 |\n| Formula | Character | 80 | 计算列的公式 |\n| Missing | Character |\
  \ 1 | 缺失值代码 |\n\n\n\n\n\n表 6.6 显示了在 `Property` 表中定义的 `Message` 表属性示例。\n\n表 6.6 \
  \ \n\n属性表（部分列）\n\n| 表名 | 列名 | 类型 | 长度 | 属性 | 值 |\n| --- | --- | --- | --- | ---\
  \ | --- |\n| `Message` | `Message` | `N` | 8 | `P` | |\n| --- | --- | --- | ---\
  \ | --- | --- |\n| `Message` | `text` | `C` | 80 | | |\n| `Message` | `mestype`\
  \ | `C` | 1 | `W` | |\n| `Message` | `output` | `C` | 2 | `S` | |\n| ... | ... |\
  \ ... | ... | ... | ... |\n\n### 6.3.6 含义定义](#C02a_toc.xhtml#rsec6_3_6)\n\n“含义”（meaning）是一种简单的方法，用于将无意义的值替换为有意义的文本。列含义的定义仅仅是指对应用表及其包含有意义描述的列的引用。含义的正确定义基于应用表之间的关系。我们定义含义的列必须是包含有意义描述的表的外键。\n\
  \n### 6.3.7 关联表](#C02a_toc.xhtml#rsec6_3_7)\n\n`Link` 表指定了通过外键链接的表对。`Link` 表的列定义如表\
  \ 6.7 所示。\n\n表 6.7  \n\n关联表的列\n\n| 列名 | 类型 | 长度 | 描述 |\n| --- | --- | --- | ---\
  \ |\n| `Table` | `Character` | 8 | 表名 |\n| --- | --- | --- | --- |\n| `Reltable`\
  \ | `Character` | 8 | 关联表名 |\n| `Column` | `Character` | 8 | 列名 |\n| `Relcol` |\
  \ `Character` | 8 | 关联表的列名 |\n\n`TABLE`、`COLUMN`、`RETABLE` 和 `RELCOL` 列共同组成了 `Link`\
  \ 表的主键。\n\n### 6.3.8 应用数据模型定义流程](#C02a_toc.xhtml#rsec6_3_8)\n\n需要说明的是，应用数据模型的定义可以通过迭代完成，没有必要在在使用应用程序之前完成整个应用设计过程，也没有必要在第一次就做到完全完美。这并不意味着在表驱动的开发环境中应用设计是不必要的；应用设计仍然是需要的。然而：\n\
  \n- 它并不需要一次性完成；\n- 它不必在第一次就是完美的；而且\n- 如果需求发生变化，设计也可以以相对无痛苦的方式进行更改。\n\n基于数据字典开发的最宏大的目标是在最大限度地提高应用组件质量的同时，最大限度地降低其开发和维护成本。\n\
  \n### 6.3.9 数据字典的特性](#C02a_toc.xhtml#rsec6_3_9)\n\n数据字典具有构成功能清单的若干特性：\n\n关系型（Relational）：数据字典应该基于关系型技术。这是目前软件行业标准标准。\n\
  \n可扩展性（Extendable）：数据字典应该是可扩展的。设计者应该能够根据需要扩展数据字典，以添加新的文件、数据库和其他相关信息源。换句话说，数据字典的元模型（或关于数据的数据）应该足够灵活，可以根据需要进行扩展。\n\
  \n元元模型（Meta-meta model）：数据字典应该基于面向对象的元元模型。元元模型可以被看作是数据字典的数据字典。以这种方式构建的数据字典是自定义和自维护的。它的自定义体现在：正如设计者使用关系模型和数据字典来定义元数据一样，数据字典也是使用相同的实体-关系模型（元元数据）定义的。以面向对象、可扩展的方式开发这种元元模型，确保应用程序未来的增长是一致的、逻辑的且对需求相应的。\n\
  \n预存数据定义（Preexisting data definitions）：数据字典应该提供自动用预存数据定义填充数据字典的能力。由于大多数企业数据已经存在，数据字典必须能够从数据库描述自动生成数据字典定义。\n\
  \n数据库定义（Database definitions）：数据字典应该提供自动生成数据库定义的能力。由于允许程序员自行编写数据描述是低效且容易出错的，数据字典应该提供这种能力。\n\
  \n通用用户访问（Common user access）：数据字典应该提供一个易于使用的、标准的通用用户访问接口。数据字典应该提供一个面向对象-动作的对话框。设计者将看到适当的对象以及可以为这些对象调用的所有操作。\n\
  \n报告功能（Report facility）：数据字典应该提供集成的报告功能。\n\n安全性（Security）：数据字典应该具有多个级别的安全性，可以由数据字典、数据或设计者进行控制。\n\
  \n生命周期支持（Life cycle support）：数据字典应该提供足够的设施，以跟踪数据元素描述在整个规划、设计、开发、测试和生产生命周期过程中的修改情况。\n\
  \n### 6.3.10 优化框架的组件及其在数据字典中的定义](#C02a_toc.xhtml#rsec6_3_10)\n\n机器学习优化框架可能的数据字典表集包含五组（组件）表：输入数据、自助、机器学习、实验设计和训练数据污染。我们把这些组（组件）称为框架集，它可以随时通过额外的表或表组进行扩展。框架集的每个组件都将在后续章节中描述。\n\
  \n\n\n\n\n```sas\n/*\nPROGRAM DATASET.SAS\nDESCRIPTION 为指定的表创建 SAS 数据集。\nUSAGE %dataset(libref\
  \ =, table=, mis=);\nPARAMETERS\nlibref - 存储数据字典数据集的库名。\ntable - 需要创建 SAS 数据集的表名。\n\
  mis - 标识缺失值的标识代码。\nREQUIRES 必须存在 object、property、location、library 库的数据集。\nAUTHORS\
  \ T.Kolosova and S.Berestizhevsky\n*/\n%macro dataset (libref=, table=, mis=);\n\
  /*\n以下 DATA 步骤创建一个数据集宏变量，该变量包含与指定表对应的数据集名称。\n*/\n   data _null_ ;\n      set &libref..Object\
  \ ;\n      where upcase(left(table)) = upcase(\"&table\") ;\n      call symput(\"\
  dataset\", trim(dataset)) ;\n   run ;\n   %let count = 0 ;\n   %let _icount = 0\
  \ ;\n/*\n以下 DATA 步骤创建宏变量并用 property 数据集中的数据填充它们：\ncount - 包含指定表的列数。\n_v0 - 包含一系列宏变量，包含指定表的列名及其类型和长度。\n\
  _v2 - 包含一系列宏变量，包含指定表中定义了索引的列名。\n_v3 - 包含一系列宏变量，包含指定表的列名及其标题（title）。\n*/\n   data\
  \ _null_ ;\n      retain _count 1 _icount 0 ;\n      call symput(\"_v0\" || left(_count),\
  \ \"&mis\") ;\n      set &libref..Property ;\n      where upcase(left(table)) =\
  \ upcase(\"&table\") ;\n      call symput(\"_v3\" || left(_count), trim(left(column))\
  \ || ' =\n         %nrbquote(' || trim(left(title)) || ')') ;\n      if index(upcase(attribut),\
  \ \"I\") > 0 then\n      do ;\n          _icount + 1 ;\n         call symput(\"\
  _v2\" || left(_icount), left(column)) ;\n         call symput(\"_icount\", left(_icount))\
  \ ;\n      end ;\n      if upcase(type) = \"C\" then\n         call symput(\"_v0\"\
  \ || left(_count), trim(left(column)) ||\n         \" $\" || left(length)) ;\n \
  \     if upcase(type) = \"N\" then\n         call symput(\"_v0\" || left(_count),\
  \ trim(left(column)) ||\n         \" \" || left(length)) ;\n      call symput(\"\
  count\", _count) ;\n      _count + 1 ;\n   run ;\n/*\n以下 DATA 步骤根据上一步创建的宏变量的值，为指定的表生成\
  \ SAS 数据集。\n*/\n   data &dataset ;\n      length\n      %do _j = 1 to &count ;\n\
  \        &&v0&_j\n      end ;\n      label\n      %do _j = 1 to &count ;\n     \
  \   &&v3&_j\n      end ;\n      stop ;\n   run ;\n/*\n以下 PROC SQL 根据存储在 _v2 中的宏变量值，为上一步生成的\
  \ SAS 数据集创建索引（如果有的话）。\n*/\n   %if _icount > 0 then\n   %do ;\n      proc sql ;\n\
  \      %if _icount = 1 then\n      %do ;\n        create index &&_v2&_icount on\
  \ &dataset (&&v2&_icount) ;\n      end ;\n      else\n      %do ;\n        create\
  \ index __index on &dataset\n        ( &&v21\n        %do i = 2 to &_icount ;\n\
  \          &&v2&_icount\n        end ;\n        ) ;\n      end ;\n   %end ;\n%mend\
  \ dataset ;\n```\n\n例如，要根据 `Object`、`Location` 和 `Property` 表的元数据为 `Demo` 表生成 SAS\
  \ 数据集，我们需要如下调用 `%DATASET` 宏：\n\n```sas\n%dataset(libref=kernel, table=Demo, mis=.);\n\
  ```\n\n### 从数据字典生成 R 数据集\n\n以下 DATASET R 程序演示了如何从 `Library`、`Object` 和 `Property`\
  \ 表的元数据生成 R 数据集。这些表以逗号分隔的值的形式存储。\n\n```r\n#\n# PROGRAM DATASET.R\n# 为指定的表创建 R 数据集。\n\
  # USAGE dataset(table, tmp_src, init_file)\n# PARAMETERS table - 需要创建 R 数据集的表名。\n\
  # tmp_src - 用于存储生成的 R 代码的临时文件名。\n# init_file – 包含数据字典文件路径的逗号分隔值文件名。\n# 该文件是数据字典的一部分，称为\
  \ library.csv。\n# object_file - 包含应用表和数据字典表元数据的逗号分隔值文件名。\n# property_file – 包含应用表结构和字典表结构元数据的逗号分隔值文件名。\n\
  # REQUIRES 必须存在数据字典的 object.csv 和 property.csv 文件。\n# AUTHORS T.Kolosova and S.Berestizhevsky\n\
  #\ndataset<- function (table, tmp_src, init_file, object_file, property_file)\n\
  {\n   lib <-function(start)\n   {\n     ds1<-read.csv(file = start, header=TRUE,\
  \ sep=\",\")\n     innerf <- function(text) assign(\"library\", text, envir = .GlobalEnv)\n\
  \     text <- paste(cat(sprintf('%s', ds1$location)))\n     innerf(ds1$location)\n\
  \   }\n   loc<-function(object_file, property_file)\n   {\n     text<-paste0(as.character(library),\"\
  \\\\\", as.character(object_file))\n     assign(\"object\", paste0(text), envir\
  \ = .GlobalEnv)\n     text<-paste0(as.character(library),\"\\\\\", as.character(property_file))\n\
  \     assign(\"property\", paste0(text), envir = .GlobalEnv)\n   }\n   create_ds\n\
  \   for (i in 1:nrow(ds1))\n   {\n      if (all(trimws(table) == ds1$table[i]))\n\
  \      {\n        if(\"C\" == ds1$type[i])\n        {\n          columns <- c(columns,\
  \ ds1$column)\n        }\n        if(\"N\" == ds1$type[i])\n        {\n        \
  \  types <- c(types, \" \")\n        }\n      }\n   }\n   types <- c(types, ds1$length[i])\n\
  \   text<- paste0(paste0(columns), '=', paste0(types),',')\n   text <-paste0(text,\
  \ collapse=\" \")\n   text <- substr(text,1,nchar(text)-1)\n   cat(sprintf('%s <-\
  \ data.frame( %s )\\n', table, text ))\n   sink()\n   source(fn)\n   }\n   lib(init_file)\n\
  \   loc(object_file, property_file)\n   create_ds(table, tmp_src)\n}\n```\n\n\n\n\
  \n\n```sas\nPROGRAM SVM.SAS\nDESCRIPTION 使用 R 在 SAS 中进行分类的支持向量机\nUSAGE %%svm (train=,\
  \ validate=, result=, targetvar=, tmppath=, rpath=)\nPARAMETERS train = 用于训练的数据集\n\
  validate = 用于验证的数据集 - mis 是识别缺失值的代码\nresult = 预测后创建的数据集\ntargetvar = 目标变量\ntmppath\
  \ = SAS 和 R 之间交换文件的临时路径\nrpath = R 可执行文件的路径\nREQUIRES 应当安装 e1071 和 foreign R 包\n\
  AUTHORS T.Kolosova and S.Berestizhevsky\n*/\n%macro svm (train = , validate = ,\
  \ result = , targetvar = , tmppath = , rpath = );\n   proc export data = &train\
  \ outfile = \"&tmppath\\sas2r_train.csv\" replace;\n   run ;\n    proc export data\
  \ = &validate\n      outfile = \"&tmppath\\sas2r_validate.csv\" replace;\n   run;\n\
  \   proc sql;\n        create table _tmp0 (string char(200));\n      insert into\
  \ _tmp0\n      set string = 'train=read.csv(\"sas_path/sas2r_train.csv\",header=T)'\n\
  \      set string = 'validate=read.csv(\"sas_path/sas2r_validate.csv\",header=T)'\n\
  \      set string = 'require(e1071,quietly=T)'\n      set string = 'model=svm(sas_targetvar\
  \ ~ . ,data=train)'\n      set string = 'predicted=predict(model, newdata = validate,type=\"\
  class\")'\n      set string = 'result=as.data.frame(predicted)'\n      set string\
  \ = 'require(foreign, quietly=T)'\n      set string = 'write.foreign(result,\"sas_path/r2sas_tmp.dat\"\
  ,\"sas_path/r2sas_tmp.sas\",package=\"SAS\")' ;\n   quit;\n   \n   data _tmp1;\n\
  \      set _tmp0;\n      string = tranwrd(string, \"sas_targetvar\", propcase(\"\
  &targetvar\"));\n      string = tranwrd(string, \"sas_path\", translate(\"&tmppath\"\
  , \"/\", \"\\\"));\n   run;\n   \n   data _null_;\n      set _tmp1;\n      file\
  \ \"&tmppath\\sas_r.r\";\n      put string;\n   run;\n   \n   options xsync xwait;\n\
  \   \"R.exe BATCH --vanilla --slave &tmppath\\sas_r.r\";\n   %include \"&tmppath\\\
  r2sas_tmp.sas\";\n   data &result;\n      set &validate;\n      set rdata;\n   run;\n\
  \   \n   proc datasets nolist;\n      delete rdata;\n   quit;\n%mend;\n%svm(train\
  \ = iris, validate = iris, result = iris_result, targetvar = species, tmppath =\
  \ c:\\temp, rpath = C:\\Program\\R\\R-3.3\\bin\\x64\\R.exe);\n```\n\n# 该环境有助于快速且稳健的实现。本章描述了表格以及\
  \ SAS 和 R 程序。在接下来的章节中，我们将演示如何扩展表驱动环境以处理如数据输入、自助法、实验设计和支持向量机分类等任务。\n\n## 6.5 总结\n\
  \n本章介绍了用于开发 AI 框架的表驱动环境。该环境支持无代码设计并有助于稳健的实现。\n\n## 参考文献\n\n1. Kolosova, T., and\
  \ Berestizhevsky, S. 1995. *Table-Driven Strategies for Rapid SAS Applications*.\
  \ Cary, NC: SAS Institute, Inc.\n\n# 7 输入数据组件\n\n## 7.1 数据管理概述\n\n为输入组件创建了数据字典，以理解输入数据的含义（例如，输入数据）。\n\
