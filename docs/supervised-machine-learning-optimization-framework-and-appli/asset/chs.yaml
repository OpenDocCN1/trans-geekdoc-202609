  \ Analysis*, 13: 157–170.\n\n\n\n自助法（Bootstrap）是一种重采样程序，通过对原始数据集进行采样来估计总体的统计量。该方法通过计算机模拟替代了复杂且通常不准确的偏误、方差和其他不确定性量。在简单情况下，估计的不确定性可以基于对可用数据的假设概率模型通过解析计算来衡量。但在更复杂的情况下，这种方法可能变得非常繁琐且困难，如果做出了不当的假设或简化，其结果可能会产生误导。\n\
  \n\n\n\n类似于自助法（bootstrap）的重采样程序有着悠久的历史，与使用计算机进行模拟有关。这类程序最早在 20 世纪 40 年代后期计算出现初期就被提到过。然而，是\
  \ Efron (1979) 将这些思想统一起来，并将简单的非参数自助法（有放回的样本重采样）与用于估计标准误的统计工具（如 `jackknife` 和 `delta`\
  \ 方法）联系起来。这种种方法现在通常被称为非参数 IID 自助法，即适用于独立同分布数据（i.i.d.）或至少不具有序列相关性数据的标准自助法。\n\n在 Efron\
  \ (1982) 的专著出版后，统计学界和科学界开始积极研究这些思想，并赞赏这些方法的扩展及其广泛的适用性。为了对自助方法及其理论背景进行全面概述，建议读者参阅\
  \ Efron 和 Tibshirani (1993)。\n\n在我们的书中，我们展示了如何在两种不同情况下使用自助方法：首先，是为了最小化输入数据的偏差；其次是为了生成多个训练数据集和测试数据集。自助方法的概述将有助于解释自助法在\
  \ AI 框架中的应用动机。使用多个训练和测试数据集的主要目的是实现用于构建和验证分类器的数据变异性在本章中，我们还讨论了应该使用什么标准来停止生成训练和测试数据集。\n\
  \n\n\n> 给定一组 `n` 个独立同分布的随机向量 `x[1]`, `x[2]`, …, `x[n]` 以及参数 `θ` 的实值估计器 `θ̂` = `φ(x[1],x[2],…,*x[*n*])`，评估\
  \ `θ̂` 准确性的程序根据经验分布函数 `Fn` 定义。该经验分布函数为每个观测到的随机向量 `x[i]`（`i` = 1, …, `n`）分配了概率密度\
  \ `1/n`。\n\n经验分布函数是在不作任何参数假设的情况下，观测值分布的最大似然估计器。`θ̂ − θ` 的自助分布是通过从经验分布 `F[n]` 中进行独立有放回抽样来生成\
  \ `θ̂` 值而形成的分布。`θ̂` 标准误的自助估计值则是 `θ̂ − θ` 的自助分布的标准差。自助分布的几乎任何参数都可以作为相应总体参数的“自助”估计值，例如自助分布的偏度、峰度或中位数。\n\
  \n自助技术的实际应用通常需要通过从经验分布中独立有放回抽样来生成样本。然后，从自助采样中，使用蒙特卡洛方法获得自助估计的近似。该框架非常直观：\n\n1. 从经验分布中有放回地生成样本（自助样本）。\n\
  2. 计算 `θ^*`，即使用自助样本代替原始样本得到的 `θ̂` 的值。\n3. 重复步骤 1 和 2 共 `k` 次。\n\n假设我们想要估计依赖于随机样本\
  \ `X = (x[1], x[2], …, x[n])` 的参数 `θ`。例如，`θ` 可以是样本的对数方差或皮尔逊相关系数。假设我们有 `θ` 的以下估计器（不依赖于值\
  \ `x[i]` 的顺序）：\n\n`θ̂(x[1],x[2],…,*x[*n*]) = φ(x[1],x[2],…,*x[*n*])` (3.1)\n\n然而，我们不知道在给定\
  \ `θ` 的情况下 `φ(X)` 的概率分布。这意味着我们无法通过 `φ(X)` 来估计估计 `θ` 的误差。因此，无论估计值有多大，我们都无法从观测到的 `φ(X)\
  \ ≠ 0` 得出 `θ ≠ 0` 的结论。\n\n让我们看看自助方法如何帮助仅通过观测数据 `x[1], x[2], …, x[n]` 为 `θ` 创建置信区间并检验假设\
  \ `H[0]:θ = θ[0]`。\n\n\n假设我们有一个大小为 `n` 的样本 `X = (x[1], x[2], …, x[n])`。`X` 的自助样本是一个样本\n\
  \n`X^* = (x[1]*, x[2]*,…,*x[n]*)` (3.2)\n\n其中每个值 `x[1]*` 都是来自 `X = (x[1], x[2],\
  \ …, x[n])` 的有放回随机样本。换也就是说，\n\n`P({x_j* = x^*})1/n,i = 1,\\ldots,n` (3.3)\n\n\n\
  自助技术的实际应用通常需要通过从经验分布中独立有放回抽样来生成样本。然后，从自助采样中，使用蒙特卡洛方法获得自助估计的近似。该框架非常直观：\n\n1. 从经验分布中有放回地生成样本（自助样本）。\n\
  2. 计算 `θ^*`，即使用自助样本代替原始样本得到的 `θ̂` 的值。\n3. 重复步骤 1 和 2 共 `k` 次。\n\n假设我们要估计依赖于随机样本\
  \ `X = (x[1], x[2], …, x[n])` 的参数 `θ`。例如，`θ` 可以是样本的对数方差或皮尔逊相关系数。假设我们有 `θ` 的以下估计器（不依赖于值\
  \ `x[i]` 的顺序）：\n\n`θ̂(x[1],x[2],…,*x[*n*]) = φ(x[1],x[2],…,*x[*n*])` (3.1)\n\n然而，我们不知道在给定\
  \ `θ` 的情况下 `φ(X)` 的概率分布。这意味着我们无法通过 `φ(X)` 来估计估计 `θ` 的误差。因此，无论估计值有多大，我们都无法从观测到的 `φ(X)\
  \ ≠ 0` 得出 `θ ≠ 0` 的结论。\n\n让我们看看自助方法如何帮助仅通过观测数据 `x[1], x[2], …, x[n]` 为 `θ` 创建置信区间并检验假设\
  \ `H[0]:θ = θ[0]`。\n\n（注：原文后续存在大量重复段落，根据指令“一定不要重复输出原文”，此处已对重复内容进行去重处理，保留核心逻辑结构）\n\
  \n### 3.2.2 假设检验、估计与置信区间\n\n\n`θ̂_mean(x) = 1/k sum_{i=1}^k θ̂[i]*` (3.5)\n`V_θ(x)\
  \ = 1/(k-1) sum_{i=1}^k {θ̂[i]* - θ̂_mean(x)}²` (3.6)\n\n以及对应的 `θ` 的 95% 置信区间为：\n\
  \n`(E_θ(x) - 1.960*sqrt(V_θ(x)/k), E_θ(x) + 1.960*sqrt(V_θ(x)/k))` (3.7)\n\n\n\n\
  假设对于每个 `θ`，给定 `θ` 的 `θ̂`(`X*)` 分布关于 `θ` 对称。那么，`θ̂`(`X^**)` 的分布也将关于 `θ` 对称，且 `θ`\
  \ 的一个良好估计量为：\n\n`θ̂[med]*(x) = median{θ̂[i]*,i=1,…k}` (3.8)\n\n现在，`θ` 的 95% 置信区间可以由采样值\
  \ `θ̂[i]*)` 的上、下各 2.5% 分位数来构建。因此，`θ` 的自助百分位法 95% 置信区间可以构造为：\n\n(`θ̂[(U)]*,θ̂[(k\
  \ + 1 − U)]*)`) (3.9)\n\n其中\n\n`θ̂[i]*)` 是按升序排列的值 `θ̂[i]*)`，使得 `θ̂[(1)]* ≤ θ̂[(2)]*\
  \ ≤  ≤ θ̂[(k)]*`。\n\n`U` 等于 0.025 `k` 值，向下取整到最近的整数（如果 `U = 0`，则替换为 1）。\n\n值 0.025\
  \ 是根据给定的自助百分位置信区间计算的，对于 95% 置信区间，该值的获取值为 (1 − 0.95)/2 = 0.025。\n\n例如，如果 `k = 1,000`，则\
  \ `U = 25` 且 `k + 1 − U = 976`，自助百分位法 95% 置信区间将类似于 (`θ̂[(25)]*,θ̂[(976)]*)。\n\n\
  公式 (3.9) 相比公式 (3.7) 的优势如下：\n\n1. 它不需要理论（解析）公式来计算置信区间，而对于 `θ` 的复杂估计量，推导公式可能困难。\n\
  2. 置信区间的端点（公式 3.9）是 `θ = θ̂(`X*)` 的可实现值。\n\n此外，显然将 `θ` 替换为 `θ` 的任何单调函数，等同于将自助采样的\
  \ `θ` 值替换为这些值的相同单调函数。因此，生成 `log(θ)` 的中位数估计（公式 3.8）和置信区间（公式 3.9），然后对结果进行指数运算，与我们最初对\
  \ `θ` 进行处理的结果完全相同。通常，如果 `g(θ)` 是 `θ` 的任何单调函数，则以下等式成立：\n\n${{\\hat{\\text{g}\\left(\
  \ \\theta \\right)}}\\_{i}^{\\*} = g\\left( {\\\\hat{\\theta}}\\_{i}^{\\*} \\right)}\\\
  mspace{54mu}\\operatorname{(3.10)}$\n\n其中\n\n${\\hat{\\text{g}\\left( \\theta \\\
  right)}}\\_{i}^{\\{*}}$ 表示 `g(θ̂(`X*)))` 的第 `i` 个自助采样值。\n\n这进一步表明了自助百分位置信区间（公式 3.9）相比于基于正态分布的置信区间（公式\
  \ 3.7）的额外优势。`θ` 的适当缩放往往是不明确的，或者可能需要转换公式 (3.7) 中的值以消除离群值。公式 (3.10) 意味着对于 `θ` 的任何单调变换，我们获得相同的中位数估计（公式\
  \ 3.8）和置信区间（公式 3.9）。必须记住，自助百分位估计量（公式 3.8 和 3.9）是基于 `θ̂(`X*)` 作为 `θ` 的函数的分布关于 `θ`\
  \ 对称的假设得出的。属性 (公式 3.10) 弱化了这个假设，因为我们现在只需要假设存在单调严格递增函数 `g(θ)`，使得 `g(θ̂(`X*)))` 作为\
  \ `θ` 的函数围绕 `g(θ)` 对称分布，这创建了一个巨大的估计量类。\n\n\n自助法（Bootstrap）允许我们估计并减少偏倚。\n\n偏差的自助估计量\
  \ `B*` 是 `E(θ̂*-θ̂*)`，其中 `θ̂*` 是基于自助样本的 `θ` 的估计。`B*` 的近似值通过进行 `k` 次自助采样并平均估计值 `θ̂[i]*)`\
  \ 与原始样本估计值 `θ̂` 之间的差异来获得：\n\n${{\\hat{B}}^{\\*} = {\\\\sum\\limits\\_{i = 1}^{k}{\\\
  left( {{\\{\\hat{\\theta}}\\_{i}^{\\*} - \\hat{\\theta}} \\right)\\text{/}k}}}\\\
  \\mspace{54mu}\\operatorname{(3.1)}$\n\n估计的目的是改进有偏估计量，例如通过从中减去其偏差的估计。假设我们观察到 `θ̂[med]*(X*)\
  \ = median{θ̂[i]*)*,i=1,…k} < θ̂` (12)。因此，我们可以说使用估计值 `θ = θ̂[med]*(X*)` 是不合理的，因为公式\
  \ (12) 可能意味着重采样过程倾向于产生较小的 `θ` 值。然而，如果从总体采样 `X` 的过程与从 `X` 中自助采样 `X[i]*)` 的过程相似（如图\
  \ 3.2 所示），那么公式 (12) 意味着 `θ > θ̂(`X*)`，而不是 `θ = θ̂[med]*(X*) < θ̂`。\n\n量化这种中位数偏差的方法是将“偏差”定义为小于或等于\
  \ `θ̂(`X*)` 的自助采样值 `θ̂[i]*)` 的比例：\n\n${{\\hat{B}}\\_{\\text{median}}^{\\*} = \\\\\
  frac{1}{k}{\\sum\\limits\\_{i = 1}^{k}{\\mathbb{I}\\left\\{ {\\\\hat{\\theta}}\\\
  left\\{ X_{\\\\{ i \\}}^{\\*} \\right\\} \\leq \\hat{\\theta}\\left\\{ X \\right\\\
  }\\}}\\mspace{54}}\\operatorname{(13)}$\n\n其中 `\U0001D540` 是指示函数，当 `θ̂[i]*) ≤ θ̂`\
  \ 时其值为 1，否则为 0。\n\n公式 (12) 中的表达式可以解释为 `P(θ̂(`X^*) ≤ θ̂)` 的近似值。如果 `B* = 1/2`，则重采样值中关于\
  \ `θ̂` 没有中位数偏差。在某些研究中，建议了指示无中位数偏差的阈值。例如，0.40 ≤ θ̂[med]*) ≤ 0.60 或 0.35 ≤ θ̂[med]*)\
  \ ≤ 0.65 被建议作为无偏差的规则。\n\n\nEfron (1982) 将原始自助法解释为非参数极大似然方法，换句话说，是将极大似然方法推广到非参数框架。从这个角度来看，`F̂`\
  \ 是 `F` 的非参数估计。因此，普通自助是“极大似然”估计。\n\n如果我们假设 `F` 具有参数形式，例如正态分布，那么 `F` 的适当估计将是具有 `μ`\
  \ 和 `σ²` 的正态分布。从这样的参数估计中进行放回采样会导致符合 Fisher 理论的极大似然估计。参数自助的蒙特卡洛近似是极大似然估计的近似。\n\n\
  如图 31 和 3 所示，我们用样本分布函数 `F̂` 近似了未知分布 (`θ, F`)。假设我们可以知道 `X` 的分布：\n\n`F = F(θ, x)`\n\
  \n在这种情况下，我们在图 3.2 中将 `F̂` 替换为 `F(θ̂, x)`。这意味着在图 3.2 中自助样本 `X[i]*)` 是从 `F(θ̂, x)`\
  \ 取的，而不是 `F̂`。\n\n让我们考虑这样一个例子，我们坚信我们的数据按照以下双指数分布的形式：\n\n$f\\left( X \\right) = \\\
  frac{\\\\text{exp}\\left( {- \\left| {x - \\mu} \\right|} \\right)}{2}$\n\n对于该族，`μ`\
  \ 的极大似然估计量如下：\n\n`μ̂(x[1],x[2],…x[n]) = μ̂[m] = median{x[i],i=1,…n}`\n\n遵循图 3.2\
  \ 中描述的过程，在将 `F̂` 替换为 `F(θ̂, x)` 时，自助样本 `X* = (x[1]*,x[2]*,…x[n]*)` 现在将是独立随机变量，其密度为\n\
  \n$f\\left( X \\right) = \\frac{\\\\text{exp}\\left( {- \\left| {x - {\\\\hat{\\\
  mu}}\\_{m}} \\right|} \\right)}{2}$\n\n\n\n现在，自助法（bootstrap procedure）使用了更多关于 `X`\
  \ 分布的信息；因此，它应该生成一组更合理的自助采样值 `μ̂[*i*]^(\\*) = μ̂(*X*[(*i*)]^(\\*))`。\n\n在图 3.1 所示的自助处理过程中，使用\
  \ `F(θ̂,z)` 代替 `F̂(z)` 被称为参数自助，而使用 `F̂(z)` 则被称为非参数自助。\n\n\n如上所示，基本的非参数自助提取的自助样本大小与原始样本大小\
  \ `n` 相同。这是 Efron 首次引入的方法。然而，很快，选择小于原始样本大小 `n` 的自助样本大小 `m` 的可能性成为了一个研究的主题。这种自助被称为“m-out-of-n”自助法，并由许多作者进行了研究，例如\
  \ Bickel 等（1997）。\n\n当适当选择 `m` 时，m-out-of-n 自助法成功应用于基本非参数自助无法保持一致的情况。为了产生一致估计，渐近理论要求在\
  \ `n→∞` 时 `m→∞`，但速度较慢，使得 `m/n→0`。如果我们选择 `m = o(n)`，则自助均是一致的。Athreya (1987) 证明了应用\
  \ m-out-of-n 自助时自助值的收敛性。惊讶的是，这种简单的补救方法在各种示例均有效，包括依赖观测和独立观测。这些示例包括数据具有无限矩的情况（例如重尾分布），或者数据分布具有极值的情况，或者是另一种有限总体的情况，例如调查抽样数据。\n\
  \n### 3.2.6 自助样本相似性](#C02a_toc.xhtml#rsec3_2_6)\n\n在使用 m-out-of-n 自助法生成多个训练和测试数据集时，我们力求根据观测选择的随机性增加样本数据集之间的变异性。始终存在两个随机选择的样本由非常相似的观测子集组成，样本量越大，这种相似性的概率就越高。将相同的机器学习方法应用于两个非常相似的训练数据集极可能会产生非常相似的分类器。这本身并不是一个问题，但我们的兴趣是创建不同的分类器，而且估计过程计算成本很高。我们建议应用\
  \ Jaccard 相似系数（也称为 Jaccard 指数）来识别高度相似的数据集并排除或重新生成其中一个。\n\nJaccard 相似系数用于衡量有限样本数据集之间相似性和多样性的统计量。Jaccard\
  \ 系数定义为样本集交集的大小除以并集的大小：\n\n${J\\left( {A,\\operatorname{}B} \\right) = \\frac{\\\
  left| {A \\cap B} \\right|}{\\left| {A \\cup B} \\right|} = \\frac{\\left| {A \\\
  cap B} \\right|}{A + B - \\left| {A \\cap B} \\right|}}\\mspace{54mu}\\operatorname{(3.14)}$\n\
  \n其中：\n\n- `|A∩∩ B|` 是 `A` 和 `B` 数据集交集的大小，\n- `|A∪ B|` 是 `A` 和 `B` 样本数据集并集的大小。\n\
  \nJaccard 相似系数统计量的局限性：`0 ≤ J(A,B) ≤ 1`，当 `A` 和 `B` 数据集均为空时，定义为 `J(A,B) = 1`。\n\n\
  另一个统计量 Jaccard 距离衡量了两个样本数据集之间的差异。它是 Jaccard 系数的补数，通过 1 减去 Jaccard 系数得到：\n\n${D_{J}\\\
  left(A,B) \\right) = 1 - \\frac{\\left| {A \\cap B} \\right|}{\\left| {A \\cup B}\
  \ \\right|}}\\mspace{54mu}\\operatorname{(3.15)}$\n\n使用 `J(A,B)` 或 `DJ` 识别这些样本，用于构建分类器。\n\
  \n\n\n使用这些函数，`m-out-of-n` 自助采样法的部署非常简单。正如在 `PROC SURVEYSELECT` 中使用的示例所示，让我们从包含输入数据集索引的\
  \ `data_index` 向量中放回创建 100 个包含 1,000 个值的样本：\n\n```\nset.seed(123)\nMNBootstrap <\
  \ -replicate(100, sample(data_index, 1000, replace = TRUE))\n```\n\n在书的第二部分，我们将演示如何在\
  \ AI 框架中使用这些函数。\n\n\n在构建分类器的机器学习过程中，最大的挑战之一是让分类器能够处理未见过的数据。在本章中，我们回顾了自助法方法，这些方法允许我们从原始标记数据中创建多个训练和测试数据集。创建这些数据集的主要目的是为分类过程提供数据变异，从而创建能够成功处理这种变异的分类器（或多个分类器）。我们还在数据清洗阶段使用自助法，以尽量减少输入数据中的偏差。\n\
  \n\n1. Athreya, K. B. 1987. Bootstrap estimation of the mean in the infinite variance\
  \ case. *The Annals of Statistics*, 15: 724–731.\n2. Bickel, P. J., Gotze, F., and\
  \ van Zwet, W. R. 1997. Resampling fewer than n observations: gains, losses, and\
  \ remedies for losses. *Statistica Sinica*, 7: 1–31.\n3. Efron, B. 1979. Bootstrap\
  \ methods; another look at the jackknife. *The Annals of Statistics*, 7: 1–26.\n\
  4. Efron, B. 1982. The jackknife, the bootstrap, and other resampling plans. *CBMS-NSF\
  \ Regional Conference Series in Applied Mathematics.* Vol. 38. Stanford, California:\
  \ Stanford University.\n5. Efron, B., and Tibshirani, R. J. 1993. *An Introduction\
  \ to the Bootstrap*. New York: Chapman and Hall.\n\n\n\n机器学习过程无论使用何种方法，都高度于所谓的输入数据集。它是使算法训练和测试成为可能的关键方面。数据集是数据的集合。换句话说，一个数据集对应于数据表的内容，或者单个统计数据矩阵\
  \ `X`(`n`×`p`)，其中表格的每列 `j` = 1, …, `p` 代表一个特定的变量（特征），每行 `i` = 1, …, `n` 对应数据集的特定观测值。\n\
  \n输入数据集既是训练数据集也是测试数据集的来源。训练数据集用于训练算法，以应用机器学习概念（如神经网络和支持向量机）来学习并产生结果。训练数据集包含了所谓的标记观测值，它由输入数据和预期输出组成。测试数据集用于评估算法的训练效果。在机器学习项目中，测试阶段的目标是评估在训练过程中创建的分类器处理未见过的数据的能力。如何。由于输入数据集通常存在缺陷，数据清洗是机器学习过程中的一个非常重要的重要步骤。简而言之，数据清洗是一系列帮助使数据集更适合机器学习的程序。通俗地说，训练数据的质量决定了机器学习算法的性能。\n\
  \n\n当 `p` > 2 时，很难在 `p` 变量数据中检测异常值，因为无法再依赖对数据的直视检查。虽然使用马哈拉宾距离（Mahalanobis distances）检测单个异常值相对容易，但由于异常值并不一定具有较大的马哈拉宾距离会导致掩盖效应，这种方法对于多个异常值不再适用。Donoho\
  \ (1982) 以及 Donoho and Gasko (1992) 证明，在存在 `n`/(`p`+1) 个异常值的情况下，许多估计位置参数的方法都会失效，其中\
  \ `n` 是观测值数量，`p` 是变量数量。我们建议使用 Rousseeuw (1985) 的最小协差确定（MCD）方法来检测多变量环境下的多个异常值。\n\n\
  \nMCD 方法的目标是从 `n` 个观测值中找到 `h` 个，使其协方差矩阵行列式最小。MCD 均估计是这些 `h` 个观测值的平均值，而 MCD 方差估计是它们的协方差矩阵。MCD\
  \ 有一个重要的优点。根据 Butler 等人 (1993) 的观点，它在统计上是有效的，因为 MCD 是渐近正态的。尽管有这一优点，由于计算复杂性，MCD 尚未被广泛应用于异常值检测。新开发的\
  \ MCD 快速算法（Rousseeuw and Van Driessen, 1999）在统计效率和计算速度方面远优于其他方法。此外，MCD 可以处理大规模的训练数据集，这就是为什么我们推荐使用\
  \ MCD 方法检测多变量数据集中的异常值。MCD 算法的动机可以解释如下。\n\n假设我们从输入数据集 `X` = (`x[1]`, `x[2]`, …, `x[n]`)\
  \ 中取一个大小为 `h` 的随机样本 `X`[`h`]`。我们可以评估全量数据集中的数据点与我们的随机采样子集之间的相似性。令 `M` = (`μ[1]`,\
  \ `μ[2]`, …, `μ[p]`) 为子集的均值，`S` 为子集的协方差矩阵。我们使用马哈拉宾距离 `D` 来估计相似性：\n\n```\nD = [(X-M)^T\
  \ * S^(-1) * (X-M)]^(1/2)\n```\n\n该算法的基本思想是从大小为 `p+1` 的小子集开始，计算均值 `M`、协方差矩阵 `S`\
  \ 以及对应的马哈拉宾距离最小的 `h` 子集。\n\n关于 Fast-MCD 算法的详细描述，请读者参考 Rousseeuw 和 Van Driessen (1999)。Boudt\
  \ 等人 (2018) 开发的新算法处理变量超过数据集大小的情况。因此，当训练数据集的大小小于变量数量时，MCD 方法应被最小正则化协差确定（MRCD）方法取代。\n\
  \n\nFast-MCD 算法实现在不同的软件包中，如 R、SAS 和 Python。然而，该算法的实现取决于其用途。例如，`robustbase` 包中的 R\
  \ 语言函数 `CovMcd` 使用 MCD 算法计算可鲁棒估计，但并不会产生清洗异常值的数据集。\n\nSAS 软件拥有 `ROBUSTREG` 过程，它通常被用于回归过程。然而，`PROC\
  \ ROBUSTREG` 也可以计算 MCD 估计。`PROC ROBUSTREG` 中的可用语句如表 4.1 所示。\n\n\n| `PROC ROBUSTREG\
  \ <options>` | 调用过程 |\n| :--- | :--- |\n| `BY` 变量 | 允许对 `BY` 变量定义的组中的观测值进行独立分析。\
  \ |\n| `CLASS` 变量 | 指定哪些解释变量视为分类变量。 |\n| `EFFECT name=effect-type(variables < /\
  \ options >)` | 用于构建设计矩阵的特殊列集合。 |\n\n\n\n\n\n| `ID variables` || `用于在离群值诊断表中表中识别观测值的变量名。`\
  \ |\n| `MODEL response = < effects > < / options >` | 指定用于回归的变量。 |\n| `OUTPUT <\
  \ OUT=SAS-data-set > keyword=name < . . . keyword=name >` | 创建一个包含最终权重、预测值和残差的输出数据集。\
  \ |\n| `PERFORMANCE < options >` | 通过使用硬件上提供的单个或多个处理器来调整过程的性能。 |\n| `TEST effects`\
  \ | 请求模型参数的稳健线性检验。 |\n| `WEIGHT variable` | 指定输入数据集中的一个变量，该变量的值用于对观测值加权。 |\n\n在回归模型的语境下，“离群值”（outlier）是指响应变量的值远离预测值的观测值。相比之下，`PROC\
  \ ROBUSTREG` 使用 `MCD` 算法识别 `X space` 中的多变量离群值，即解释变量协变量空间的离群值。此类离群值也被称为杠点（leverage\
  \ points）。我们可以使用 `PROC ROBUSTREG` 创建一个输出数据集，其中被 `MCD` 算法识别为离群值的观测将被标记。由于 `MCD` 估计是针对解释变量生成的，响应变量并不重要。我们可以使用标签变量或简单地生成一个随机响应变量。\n\
  \n假设我们有一个数据集 `X`，它包含 10 个名为 `X1` …, `X10` 的列，代表独立变量，以及一个代表标签的列 `Y`。为了生成一个由 `MCD`\
  \ 方法识别离群值的输出数据集，我们将在 `MODEL` 语句中使用 `LEVERAGE(MCDINFO)` 选项。\n\n```\nproc robustreg\
  \ data=X method=lts;\n   model y = x1 - x18 / leverage(MCDInfo);\n   output out\
  \ = x_output leverage = leverage;\nrun;\n```\n\n`x_output` 数据集将包含原始 `X` 数据集中所有的变量，以及值为\
  \ 0 和 1 的 `leverage` 指示变量。当 `leverage` 变量等于 1 时，它标记了那些远离解释变量中心的观测值。它们是 `X` 变量空间中的多变量“离群值”。\n\
  \n需要注意的是，`PROC ROBUSTREG` 在计算估计时会剔除带有缺失值的观测值。如果倾向于对缺失值的不同处理（例如某种类型的插补），则应在应用 `PROC\
  \ ROBUSTREG` 处理数据之前完成。\n\n## 4.3 偏误减少\n\n使用上述方法移除离群值的数据集将作为进一步数据清洗过程的输入。清洗过程下一阶段的主要目标是识别是否存在偏差，并消除导致该偏差的观测值。我们提议使用自助法（bootstrap\
  \ approach）来确定偏差（见 3.2.3 偏误减少）。对于数据集中的每个变量，该方法的工作如下：\n\n1. 从数据集中有放地的采样一个子集。子集的大小可以与原始数据集相同，或者在使用\
  \ `m-out-of-n` 自助法时较小（见 3.3 m-out-of-n 自助法）。\n2. 计算感兴趣的估计值（样本均值 `μ̂` 或中位数 `m̂`）\n\
  3. 执行步骤 (1) 和 (2) `n` 次，其中 `n` 最大可达 1,000。这将创建 `n` 次自助估计，例如 `m̂[1]`, …, `m̂[n]`\n\
  4. 计算 `n` 次自助估计的均值\n5. 使用原始数据集计算的估计值与 `n` 次自助估计的均值之间的差异为偏误 `B̂` 的自助估计：\n   $\\hat{B}\
  \ = \\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{{\\hat{m}}\\_{i}}}$\n6. 为了纠正偏差，从使用原始数据集计算的估计值减去\
  \ `n` 次自助估计的均值。如果感兴趣的估计是中位数，则偏误修正估计将为：\n   ${\\hat{m}}^* = \\hat{m} - \\left(\\\
  frac{1}{n}{\\sum\\limits_{i = 1}^{n}{{\\hat{m}}\\}_{i}}\\right)$\n   这等同于：\n   ${\\\
  hat{m}}^* = 2\\hat{m} - \\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{{\\hat{m}} \n\n如果存在偏误，产生偏误的观测值应从数据集中移除。可以通过基于偏误修正估计\
  \ `m̂` 或 `μ̂` 计算相应的置信区间来完成。位于置信区间之外的变量值从数据集中移除。这一过程可以在 R 或 SAS 中轻松完成。\n\n\n在本章中，我们讨论了为了机器学习而清洗数据的重要性。具体而言，我们概述了处理多维离群值和偏误的两个重要步骤。可能包括排除错误值或对缺失值的处理。\n\
  \n\n1. Boudt, K., Rousseeuw, P., Vanduffel, S., and Verdonck, T. 2018. The minimum\
  \ regularized covariance determinant estimator. 10.2139/ssrn.2905259.\n2. Butler,\
  \ R. W., Davies, P. L., and Jhun, M. 1993. Asymptotics for the minimum covariance\
  \ determinant estimator. *Annals of Statistics*, 21 (3): 1385–1400.\n3. Donoho,\
  \ D. L. 1982. *Breakdown Properties of Multivariate Location Estimators*. Ph.D.\
  \ qualifying paper. Department of Statistics, Harvard University.\n4. Donoho, D.\
  \ L., and Gasko, M. 1992. Breakdown properties of location estimates based on halfspace\
  \ depth and projected outlyingness. *The Annals of Statistics*, 20 (4): 1803–1827.\n\
  5. Rousseeuw, P. 1985. Multivariate estimation with high breakdown point. *Mathematical\
  \ Statistics and Applications*, 8 (283–297): 37.\n6. Rousseeuw, P., and Van Driessen,\
  \ K. 1999. A fast algorithm for the minimum covariance determinant estimator. *Technometrics*,\
  \ 41 (3): 212–223.\n\n\n\n分类的机器学习过程取决于多个条件，选择这些条件以获得最佳结果是一个巨大的挑战。\n\n当我们拥有每个观测值都分配了标签（输出）的数据集时，就开始构建分类器。我们通常遇到的第一个问题是使用哪些特征。\n\
  \n\n\n\n假设只有一组超参数可以构建出最佳分类器，是不合理的。同样，“最佳”分类器的定义也可能根据具体情况而异。正如第 2 章 中的，分类器的质量是基于混淆矩阵（误分类矩阵）估计的。从该矩阵中可以推导出不同的指标，因此在构建分类器之前，应该先决定使用哪些指标来评估分类器的质量，以及指标的何种取值代表一个良好的分类器。\n\
  \n分类器质量的另一个衡量标准是其对数据污染的稳健性。数据污染有助于从启发式角度评估分类器对未见数据的稳健性，并找到偏差-方差权衡的解决方案。\n\n为上述每个问题找到答案本身就具有挑战性。但让情况变得更加复杂的是，一个问题的答案取决于其他问题的答案。例如，不同的特征集可能在不同的内核下会产生更好的结果。为了找到能够带来最佳分类结果的条件组合，我们将使用实验设计（DoE）。\n\
  \n\n本书描述的 AI 框架利用 DoE 方法论，根据每个用例定义的指标来寻找最佳分类器。DoE 的应用包括定义因子及其水平、实验设计的结构，以及在每个实验中测量的响应变量。下面，我们将回顾实验设计（DoE）方法论。\n\
  \nA/B 测试或“一次一个因子”（OFAT）在 20 世纪初以前是一种非常盛行的科学方法。在这种方法中，一次测试一个变量/因子，而实验的所有其他条件被认为保持不变。然而，在\
  \ 20 世纪初，罗纳德·费舍爵（Sir Ronald Fisher）引入了在研究规划阶段而非实验结束时应用统计分析的概念。1935 年，他的著作《实验设计》一书为\
  \ DoE 作为一门统计学科奠定了基础。Cox (1958) 对实验的设计和分析提供了一个全面的非数学化解释。Steinberg 和 Hunter (1984)\
  \ 指出，“费舍的这一巨作受于一个关键洞察的指导：只有当数据本身具有信息量时，对数据的统计分析才能提供信息，而通过将统计学思想应用于最初的数据收集方式，可以最好地确保数据具有信息量。”这正是我们想要实现的：确保通过构建分类器，我们收集具有信息量的数据，推导出关于分类器质量的信息洞察。\n\
  \n\n\n\n实验是指故意将处理施加在一组对象或主体上以观察响应的行为。这与观察性研究不同，后者的收集和分析数据不涉及对现有条件的刻意改变。\n\n####\
  \ 5.2.1.2 实验单位](#C02a_toc.xhtml#rsec5_2_1_2)\n\n实验单位是施加处理的物理实体。实验单位也是统计分析的单位。\n\n\
  #### 5.2.1.3 因子](#C02a_toc.xhtml#rsec5_2_1_3)\n\n实验的因子是受控的变量。该变量的值（或水平）由实验者设置。在\
  \ AI 框架中，多项式内核的阶可以是具有三个水平（如 2、3 或 4）的因子之一。另一个因子例子是 `cost` 变量，它可以定义三个水平。例如，水平 1 意味着\
  \ `cost` 变量的值属于区间 `1; 5)`，水平 2 意味着 `cost` 变量的值属于区间 `[5; 20)`，水平 3 与区间 `[20, 100)`\
  \ 相关。\n\n\n处理是研究人员施加给实验单位的东西。处理被定义为因子水平的组合。在 AI 框架中，处理意味着我们构建分类器的条件。延续上面的例子，阶数为四且\
  \ `cost` 变量处于区间 `5; 20)` 的多项式内核定义了处理，换句话就是构建分类器的条件。\n\n\n#### 5.2.2.1 随机化](#C02a_toc.xhtml#rsec5_2_1)\n\
  \n随机化是将处理分配给实验单位的过程，使得每个单位都有相同的机会接收处理。随机将处理分配给实验单位将设计的（计划的）实验与观察性研究或所谓的“准实验”区分开来。有大量的统计理论探讨了使用随机数生成器将单位分配到处理的后果。随机分配单位到处理倾向于减少由于潜在因素引起的混杂。只有当实验单位是总体的随机样本时，实验结果才能被可靠地应用。推推误差取决于样本量等因素，并且是可以估计的。\n\
  \n\n测量受到测量不确定性的影响，因此存在变异。重复相同的测量以提高准确性——换句话说就是重复。重复有助于识别变异源，更好地估计处理的真实效应，提高实验的可靠性和有效性。\n\
  \n\n在某些情况下，处理的全随机化不可行的，或者研究人员认为实验单位应该分组以减少组内变异。分组是将实验单位非随机地分成称为区块或批的组。分组减少了由已知无关来源产生的单位间差异。因此，分组增加了实验变异源估计的精确度。在区设计中，实验单位在随机分配到处理组之前首先被分为同质区块。\n\
  \n#### 5.2.2.4 正交性](#C02a_toc.xhtml#rsec5_2_4)\n\n正交性概念在实验设计中非常重要，因为它保证了不同因子及其交互的作用可以在模型中相互分离估计。因此，正交设计的分析是直观的，因为每个主效应和交互作用都可以独立估计。即使从模型中移除某些因子或交互作用，效应和系数的估计值也保持不变。然而，如果设计不是正交的（无论是计划性的还是意外丢失数据），分析必须非常小心地进行，且结果的解释并不那么直观。\n\
  ### 5.2.3 全因子实验](#C02a_toc.xhtml#rsec5_2_3)\n\n\n\n\n\n在统计学中，全因子实验（full-factorial\
  \ experiment）被定义为包含两个或多个因素设计的实验，每个因素具有两个或多个离散水平，使得所有因素跨越水平的所有可能组合恰恰应用于实验单位（Box 等人，1978）。在全因子设计中，跨越所有因素水平的所有可能组合可以在\
  \ `k` 维设计空间中的超立方体上表示，该空间由 `k` 个因素中每个因素的最小水平和最大水平定义。实验点有时被称为因子点（factorial points）。实验运行的总数计算为各因素水平数量的乘积。假设我们进行一个具有三个因子\
  \ `A`、`B` 和 `C` 的全因子实验，其中 `A`、`B` 和 `C` 在三个水平上进行测量。那么，该实验有 $3³ = 27$ 次运行，它们如图 5.1\
  \ 中的超立方体所示。\n\n**图 5.1**\n\n$3³$ 全因子实验的超立方体。\n\n全因子 $3³$ 实验设计如表 5.1](#C11_chapter5.xhtml#tab5_1）所示。\n\
  \n**表 5.1**\n\n全因子 $3³$ 实验设计\n\n| 运行 || A || B || C || 运行 || A || B || C || 运行 ||\
  \ A || B || C |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- |\n| 1 || 0 || 0 || 0 || 10 || 1 || 0 || 0 || 19 || 2 || 0 || 0 |\n| ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 2 || 0\
  \ || 0 || 1 || 11 || 1 || 0 || 1 || 20 || 2 || 0 || 1 |\n| 3 || 0 || 0 || 2 || 12\
  \ || 1 || 0 || 2 || 21 || 2 || 0 || 2 |\n| 4 || 0 || 1 || 0 || 13 || 1 || 1 || 0\
  \ || 22 || 2 || 1 || 0 |\n| 5 || 0 || 1 || 1 || 14 || 1 || 1 || 1 || 23 || 2 ||\
  \ 1 || 1 |\n| 6 || 0 || 1 || 2 || 15 || 1 || 1 || 2 || 24 || 2 || 1 || 2 |\n| 7\
  \ || 0 || 2 || 0 || 16 || 1 || 2 || 0 || 25 || 2 || 2 || 0 |\n| 8 || 0 || 2 || 1\
  \ || 17 || 1 || 2 || 1 || 26 || 2 || 2 || 1 |\n| 9 || 0 || 2 || 2 || 18 || 1 ||\
  \ 2 || 2 || 27 || 2 || 2 | |\n\n如果实验中有 `m` 次重复，则每次运行将重复 `m` 次。重复是为了估计在完全相同的条件下执行实验的误差。关于每个因素所用水平数量的决策是基于对因素与响应变量之间关系的假设。例如，设置在两个水平的因素，其假设之一是：响应变量的值在因素的范围内大约是线性的。两水平设计是满足设计基本标准——相对于实验运行次数的效率以及识别显著效应的能力——的最低水平设计。如上所述，具有两个水平因素的设计只能描述线性（直线）关系。具有三个水平因素的设计允许检查主效应的线性和二次行为，并检验涉及因素平方的交互作用项。如果存在合理的假设，认为因素与响应之间的关系具有三次项的性质，且该假设在实验中需要进行调查，则该因素应被定义为四个水平。\n\
  \n全因子实验允许研究人员研究每个因素对响应的影响，以及所有因素之间所有交互作用对响应的影响。实验数据的分析可以使用不同的方法进行，例如，使用多元回归来建模因变量（`y`）与自变量（因素）及其交互作用之间的关系，或者使用方差分析（ANOVA）来解释总变异如何分解为模型解释的变异和残差变异（Wu\
  \ and Hamada, 2000, 209）。\n\n让我们考虑表 5.1[ij] + (ag)[ik] + (β)[jk] + (αβ)[ijk] + \\\
