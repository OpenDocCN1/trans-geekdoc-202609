  \ `SAS` 和/或 `R` 计算机程序生成，该程序执行了上述五个表中作为元数据定义的统计设计实验。\n\n为了更好地理解上述所有元数据定义的含义，我们创建了一个机器学习数据字典表的实验设计示例，并在其中预填充了元数据。\n\
