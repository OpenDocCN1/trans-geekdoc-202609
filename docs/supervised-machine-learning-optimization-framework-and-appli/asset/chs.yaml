  \ 表的主键引用 |\n| `METHOD_ID` | 字符 | 8 | 指向 `ML_Method` 表主键引用 |\n| `METRIC_ID` | 字符\
  \ | 8 | 指向 `Metrics` 表主键引用 |\n| `DESIGN` | 字符 | 4 | 实验设计类型：全（FULL）；部分（部分） |\n| `MODEL`\
  \ | 字符 | 8 | 因素对响应可能影响的模型类型，其中响应是在 `Metrics` 表中定义的质量指标：MAIN—仅主效应，D2—主效应和二阶交互作用，D3—主效应及三阶以内交互作用\
