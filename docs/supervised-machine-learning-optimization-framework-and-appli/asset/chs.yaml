  \n# 11 保险行业：理赔建模与预测\n\n## 11.1 引言\n\n理赔管理要求在理赔数据的分析和解释中应用统计技术。理赔管理的核心是建模和预测。保险公司通常使用两种策略来分析理赔：将理赔成本分解为频率和程度部分的两部法，以及使用\
  \ `Tweedie 分布` 的纯保费法。\n\n在本章中，我们提供了一个通用框架，使用 `Cox 风险模型` 来研究理赔的建模和预测过程。`Cox 风险模型`\
  \ 是生存分析中的标准工具，用于研究风险率对协变量和时间的依赖性。尽管 `Cox 风险模型` 在统计学中非常流行，但在实践中，数据往往是滞后且不具操作性的。\n\
  \n`生存数据` 一术语代表事件发生之前的时间。该事件可以是理赔、死亡或任何其他感兴趣的事件。在本章中，我们关注提交理赔申请所需的时间。风险率是事件在给定时间发生的瞬时速率。\n\
  \n`Cox 风险模型` 将风险率分解为基准风险和相对比例。基准风险代表当所有协变量均为零时的风险。相对比例代表每个协变量对风险率的影响。\n\n`Cox 风险模型`\
  \ 特别有用，因为它不需要对基准风险的形状做出任何假设。这使其成为许多领域中灵活且被广泛使用的工具。在本章中，我们将探索如何将 `Cox 风险模型` 应用于理赔数据。\n\
  \n## 11.2 数据\n\n要应用 `Cox 风险模型`，我们需要每个个体事件发生的时间和协变量。在这项研究中，我们使用了一个工伤保险理赔数据集。事件是提交理赔。协变量包括：\n\
  \n* 理赔类型\n* 保单人所在地\n* 保单人行业\n* 保单人规模\n* 保单人的理赔历史\n\n## 11.3 用于事件分析的 Cox 模型\n\n生存函数\
  \ `S(t)` 描述个体生存超过时间 `t` 的概率。\n\n`S(t) = P(T > t)`\n\n其中\n\n* `T`—事件发生的时间\n* `t`—特定的时间点\n\
  \n风险函数 `h(t)` 描述事件在时间 `t` 发生的瞬时速率：\n\n`h(t) = lim_{Δ→0} P(t ≤ T < t + Δ | T ≥ t)\
  \ / Δ`\n\n换句话说，`t` 时的 `h(t)` 指定了在 `t` 之前未发生的情况下理赔发生的瞬时速率。与生存函数相比，风险函数通常提供了更多关于底层机制的信息。Cox\
  \ (1972) 提出了一个不需要事件时间遵循特定概率分布的模型。因此，Cox 模型具有相当的稳健性。\n\nCox 风险模型可以写为：\n\n`h_i(t)\
  \ = h_0(t)exp(∑_{j=1}^{k} β_j x_ij)`\n\n其中\n\n* `h_i(t)`—个体 `i` 在时间 `t` 的风险函数\n\
  * `h_0(t)`—基准风险函数，即协变量 `x[1]`到`x[k]` 均为 0 的个体的风险函数。\n\n如果任何个体的风险相对于另一个个体是固定的风险比\
  \ (HR)，则 Cox 风险模型也称为比例风险模型：\n\n`HR = h_i(t) / h_p(t) = (h_0(t)exp(∑_{j=1}^{k} β_j\
  \ x_ij)) / (h_0(t)exp(∑_{j=1}^{k} β_j x_pj))`\n\n\n\n\n\n基准风险 `h0` 抵消，HR 随时间保持常数：\n\
  \n${\\text{HR} = \\exp{\\\\sum\\limits\\_{j = 1}^{k}\\\\beta\\_{j}}\\\\left( {x\\\
  _{ij} - x\\_{pj}} \\right)}\\mspace{54mu}\\\\operatorname{(11.4)}$ \n\n时间 `t` 处的估计生存（事件发生时间）概率可以使用估计的基准风险函数\
  \ `h0` 和估计的 `β` 系数来计算：\n\n$\\\\begin{array}{l} {S\\_{i}\\\\left( t \\right) = S\\\
  _{0}\\\\left( t \\right)^{\\exp{\\sum\\_{j = 1}^{k}{\\beta\\_{j}x\\_{ij}}}}} \\\\\
  \\\\ {S\\_{0}\\\\left( t \\right) = {\\\\int\\_{0}^{t}{h\\_{0}\\\\left( u \\right)du}}}\
  \ \\\\\\\\ \\end{array}\\mspace{54mu}\\\\operatorname{(11.5)}$ \n\n其中：\n\n* `Si`——受试者\
  \ `i` 在时间 `t` 处的事件发生函数\n* `x[1]`, …, `x[k]`——协变量\n* `h0`——基准风险函数，即协变量 `x[1]`, …,\
  \ `x[k]` 所有值均为 0 的受试者的风险函数\n* `S0`——基准生存函数，即协变量 `x[1]`, …, `x[k]` 所有值均为 0 的受试者的生存函数\n\
  * `β[1]`, …, `β[k]`——CoxCox 模型的系数。\n\n## 11.4 Cox 模型在理赔分析中的应用\n\n我们确定了针对工伤理赔的事件发生时间分析的三个主要目标：\n\
  \n1. 估计生存（事件发生时间）函数 `S(t)`\n2. 估计行业协变量 `x[1]`, …, `x[k]` 的影响 `β`\n3. 比较不同行业之间的生存（事件发生时间）函数。\n\
  \n为了建立合适的模型，我们必须处理理赔过程的性质。与生物医学应用不同（在生物医学中，感兴趣的事件例如死亡，因此只能发生一次），工伤赔保险中的理赔会发生多次，因为每份保单都可能发生多次理赔。可以使用许多不同的模型来对事件发生时间分析中的重复事件建模。选择取决于要分析的数据和要回答的研究问题。\n\
  \n一种可能的方法是将每个理赔视为一个独立的观测值，在这种情况下，我们必须考虑同一保单内多个理赔之间的依赖性。这种依赖性可能源于未观测到的异质性。通过一些简单的特殊方法检测依赖性（Allison,\
  \ 2012），我们得出结论：同一保单理赔的时间间隔之间的依赖性非常小，对模型估计的影响忽略。因此，我们将每个理赔视为单个事件，并建立不考虑同一保单内理赔依赖的模型。\n\
  \n以下是对不同模型的简要回顾。\n\n### 计数过程模型\n在计数过程模型中，假设每个事件都是独立的，只要受试者在事件发生时处于观察范围内，该受试者就会对风险集的贡献。具有多个事件的受试者数据被描述为多个受试者的数据，每个受试者都有延迟进入，并持续到下一次事件。该模型忽略了事件的顺序，只要受试者在事件发生时仍处于观察状态，每个受试者处于任何事件的风险中。该模型不符合我们的应用需求，因为进入时间被视为上一次事件的时间，事件发生时间被计算为连续事件之间的时间。\n\
  \n### 条件模型 I\n该条件模型假设，在没有经历上一个事件的情况下，处于后续事件的风险中（即受试者在没有经历事件 1 的情况下处于事件 2 的风险中）。在该模型中，后续事件的时间间隔从上一次事件间隔的结束开始。该模型不符合我们的应用需求，因为它在连续理赔之间引入了依赖关系。\n\
  \n### 条件模型 II\n该模型与之前的模型区别在于时间间隔的结构方式。在该模型中，每个时间间隔从零开始，到下一次事件的时间结束。该模型不符合我们的应用需求，因为它引入了同一保单内理赔之间的依赖关系。\n\
  \n### 边缘模型\n在边缘模型中，每个事件被视为一个独立的过程。每个事件的时间从每个受试者随访时间的开始开始。此外，无论每个受试者实际上经历了多少事件，每个受试者都被认为处于所有事件的风险中。因此，边缘模型分别考虑每个事件，并对特定事件的所有可用数据进行建模。该模型符合我们的应用需求并用于分析。\n\
  \n### 11.4.1 数据转换\n\n我们分析了为期 2 年（即观察期）的工伤理赔数据。每个理赔都与雇主所属的行业以及事故发生的州相关。\n\n为边缘模型准备的数据示例如图\
  \ 11.1 所示：\n\n1. 保单 A 在 1 月之前开始；5 月和 6 月有两个理赔；保单在 8 月结束。\n2. 保单 B 在 3 月开始；8 月有一份理赔；保单在\
  \ 10 月被注销。\n3. 保单 C 在 4 月开始；在观察期内没有理赔。\n\n![FIGURE 11.1 Claims data presentation.](img/file14.jpg)\n\
  \n**图 11.1 理赔数据展示。**\n\n对于该示例，数据如表 11.1 所示：\n\n**表 11.1 理赔**\n\n| 保单 | 理赔 | 事件发生时间\
  \ | 事件 | 截断 |\n| :--- | :--- | :--- | :--- | :--- |\n| A | 1 | 5 | 1 | 1 |\n| A\
  \ | 2 | 6 | 2 | 1 |\n| A | 3 | 8 | 3 | 0 |\n| B | 4 | 6 | 1 | 1 |\n| B | 5 | 8 |\
  \ 2 | 0 |\n| C | 6 | 9 | 1 | 0 |\n\n在该案例研究中，我们展示了对伊利诺州理赔数据进行的分析和建模，这些数据包含了咨询、娱乐、金融、酒店、制造业、零售和公用事业行业的理赔。\n\
  \n### 11.4.2 Cox 模型假设验证\n\n\n\n\n在大多数保险风险论文中，作者通常认为比例风险假设是所当然的，并未尝试检查该假设在他们数据中未被违反。然而，这确实是一个强假设。请注意，当使用不当时，统计模型可能会导致误导性结论。因此，检查底层假设是非常重要的（Arjas,\
  \ 1988, Gill and Schumacher, 1987）。检查比例风险最简单且最常用的图形方法可能是所谓的“对数-负对数”图（log-negative-log\
  \ plot）。对于这种方法，应该绘制 `ln(-ln(Si))` 相对于 `ln(t*)` 的图，并寻找平行性——即曲线之间随时间变化的恒定距离。这仅对分类协变量进行。如果曲线显示出非平行模式，则说明违反了比例风险假设，结果导致\
  \ `β` 系数的解析估计是不正确的。\n\n对于伊利诺伊州七个行业的理赔情况，对数-负对数图如图图 11.2 所示。该图显示比例风险模型假设并不成立：对数-负对数图中的线条不是平行的且相互交叉了。\n\
  \n![图 11.2 伊利诺伊州的对数-负对数图](img/file15.jpg)\n\n**图 11.2**\n\n伊利诺伊州的对数-负对数图。\n\n我们将行业作为一种分类协变量，假设事件发生时间（生存）函数随行业而变化。假设该协变量变量的不同值对基准风险函数没有影响是错误的。例如，农业的风险随季节而变化；运输业随天气而变化；酒店业随学校放假安排而变化。\n\
  \n所有这些条件在潜在上都依赖于时间，这意味着行业分类变量的影响随时间推保持不变，从而违反了 Cox 模型的假设。为了考虑季节依赖性，我们引入了冬季季节的时间依赖协变量，并使用扩展\
  \ Cox 模型（Hosmer and Lemeshow, 1999）：\n\n```\n${h_{i}\\left( t \\right) = h_{0}\\\
  left( t \\right)\\exp\\left( {{\\sum\\limits_{i = 1}^{k}{\\beta_{j}x_{ij}}} + {\\\
  sum\\limits_{n = 1}^{m}{\\gamma_{n}x_{in}g_{n}\\left( t \\right)}}} \\right)}\\\
  mspace{54mu}\\operatorname{(11.6)}$\n```\n\n其中：\n\n* `hi`—受体 `i` 在时间 `t` 的风险函数\n\
  * `x[1]`, …, `*x[k]`—协变量\n* `h0`—基准风险函数，即协变量 `x[1]`, …, `*x[k]` 均为均为 0 的受体的风险函数\n\
  * `gn` —时间函数（时间本身、对数时间等）\n* `β[1]`, …, `*β[k]` —Cox 模型的系数。\n\n将此方法应用于伊利诺伊州的案例，我们的模型看起来如下：\n\
  \n```\n${h_{i}(t) = h_{0}(t)\\text{exp}\\left( {\\\\sum\\limits_{j = 1}^{6}{\\beta_{j}x_{j}\
  \ + \\gamma \\times \\text{season} \\times \\text{ln(}t\\text{)}}} \\right)}\\mspace{54mu}\\\
  operatorname{(11.7)}$\n```\n\n其中：\n* `hi` —时间 `t` 下行业 `i` = 1, …, …, 6 的风险函数，其中行业包括咨询、娱乐、金融、酒店、制造业和零售业\n\
  * `h0` —基准风险函数，在我们案例中，它是一个选定行业的风险函数，默认是字母顺序最后的行业——公公用事业。\n\n$x_{j} = \\left\\\\\
  { \\begin{matrix} {1,\\text{if}i = j} \\\\\\\\ {0,\\text{if}i \\neq j} \\\\\\\\\
  \ \\end{matrix} \\right.$ $\\text{season} = \\left\\\\{ \\begin{matrix} {1,\\text{if}i\
  \ = j} \\\\\\\\ {0,\\text{if}i \\neq j} \\\\\\\\ \\end{matrix} \\right.$ （注：源文本在\
  \ LaTeX 中存在重复/错误，保持逻辑不变）\n\n我们将行业作为一种分类协变量，假设事件发生时间（生存）函数随行业而变化。假设该协变量变量的不同值对基准风险函数没有影响是错误的。例如，农业的风险随季节而变化；运输业随天气而变化；酒店业随学校放假安排而变化。\n\
  \n所有这些条件在潜在上都依赖于时间，这意味着行业分类变量的影响随时间保持不变，从而违反了 Cox 模型的假设。为了考虑季节依赖性，我们引入了冬季季节的时间依赖协变量，并使用扩展\
  \ Cox 模型（Hosmer and Lemeshow, 1999）：\n\n\n\n为了估计 Cox 风险模型的系数，我们使用 SAS^®软件，特别是 `PHREG`\
  \ 过程，该过程对生存数据进行分析。使用 `SAS PROC PHREG` 通过贝叶斯方法对 Cox 风险模型的估计实现如下：\n\n```sas\nproc\
  \ phreg data= CLAIMS_DATA_IL;\n    class CLIENT_INDUSTRY;\n    model TIME_TO_EVENT*CENSOR(0)\
  \ = CLIENT_INDUSTRY SEASON_EVENT;\n    SEASON_EVENT = SEASON*log(TIME_TO_EVENT);\n\
  \    bayes seed = 1 outpost = POST;\nrun;\n```\n\n`CLAIMS_DATA_IL` 是一个 SAS 数据集，包含了伊利诺伊州的数据，例如行业以及从保单开始到理赔日期的时间间隔。`CLAIMS_DATA_IL`\
  \ 的行样本展示在表 11.2 中。\n\n**表 11.2**\n\n来自 CLAIMS_DATA_IL 数据集的选选行\n\n| CLIENT_INDUSTRY\
  \ | TIME_TO_EVENT | CENSOR | SEASON |\n| --- | --- | --- | --- |\n| Consulting |\
  \ 119 | 0 | 0 |\n| Consulting | 162 | 0 | 0 |\n| Consulting | 220 | 1 | 0 |\n| Retail\
  \ | 365 | 0 | 0 |\n| Retail | 237 | 1 | 0 |\n| Transportation | 95 | 1 | 0 |\n|\
  \ Transportation | 108 | 1 | 1 |\n| Utilities | 7 | 1 | 0 |\n\n`CLIENT_INDUSTRY`\
  \ 列包含与理赔相关的行业名称。`TIME_TO_EVENT` 列包含到事件发生的天数，计算起始点为观察期开始或保单开始，以较者为准。`CENSOR` 列表示该事件是否为理赔（`CENSOR\
  \ = 1`），或该事件是否为保单结束（`CENSOR = 0`）。`SEASON` 列表示事件是否发生在冬季（`SEASON = 1`）或未发生在冬季（`SEASON\
  \ = 0`）。\n\n模型中包含两个协变量：`CLIENT_INDUSTRY` 和 `SEASON_EVENT`。`CLIENT_INDUSTRY` 是分类变量，因此在\
  \ `CLASS` 语句和 `MODEL` 语句中定义为协变量。`SEASON_EVENT` 是随时间变化的协变量，代表模型的以下部分：季节 × ln(t)。`SEASON_EVENT`\
  \ 定义在 `MODEL` 语句以及 `MODEL` 语句之后的表达式中：\n\n```sas\nclass CLIENT_INDUSTRY;\n    model\
  \ TIME_TO_EVENT*CENSOR(0) = CLIENT_INDUSTRY SEASON_EVENT;\n    SEASON_EVENT = SEASON*log(TIME_TO_EVENT);\n\
  ```\n\n`BAYES` 语句请求通过 Gibbs 采样对模型进行贝叶斯分析。在 `BAYES` 语句中，我们指定一个 `seed` 值作为常数，以便为相同的输入重现马尔可夫链。我们没有指定先验分布，因此应用了非信息先验分布。所描述的\
  \ `PHREG` 过程产生了 `β` 和 `γ` 的估计。\n\n然而，当定义了随时间变化的协变量时，`PROC PHREG` 不产生基生存函数 `S0`。为了计算基生存函数，我们使用以下替代方案（Thomas\
  \ and Reyes, 2014）：\n\n```sas\ndata DS;\n    set CLAIMS_DATA_IL;\n    SEASON_EVENT\
  \ = SEASON*log(TIME_TO_EVENT);\nrun;\ndata INDUSTRY;\n    CLIENT_INDUSTRY = \"Utilities\"\
  ;\n    SEASON_EVENT = 0;\nrun;\nproc phreg data=DS;\n    class CLIENT_INDUSTRY;\n\
  \    model TIME_TO_EVENT *censor(0) = CLIENT_INDUSTRY SEASON_EVENT;\n    bayes seed=1;\n\
  \    out = BASELINE survival = INDUSTRY;\nrun;\n```\n\n这一步产生了基生存函数 `S0`。\n\n###\
  \ 11.4.5 结果解释\n\n除公用事业外所有行业的 Cox 模型 `β` 系数估计展示在表 11.3 中。由于公用事业被用作风险的基准，因此公用事业的 `β`\
  \ 系数等于 0。表 11.3 还包含 `SEASON_EVENT` 协变量的 `γ` 系数。\n\n**表 11.3**\n\n模型系数估计\n\n| Industry\
  \ | β 的均值估计 | Industry | β 的均值估计 |\n| --- | --- | --- | --- |\n| Consulting | -2.282\
  \ | Manufacturing | -0.471 |\n| Entertainment | -0.508 | Retail | -0.523 |\n| Finance\
  \ | -0.217 | Utilities | 0.000 |\n| Hospitality | -0.145 | SEASON_EVENT | 0.277\
  \ |\n\n为了比较不同行业的理赔风险，我们为每个行业构建了生存函数，并设定 `season = 0`（图 11.3）。例如，根据公用事业行业的生存函数，在保单开始第\
  \ 100 天之前没有理赔的概率为 58%，在期保单内完全没有理赔的概率为 1%。\n\n生存函数允许估计并比较行业之间的理赔风险。例如，对于娱乐业，在保单开始第\
  \ 100 天之前没有理赔的概率为 72%，在期保单内完全没有理赔的概率为 6.5%。换句话说，伊利诺伊州的娱乐业在一年保单内没有理赔的概率比公用事业高出 5.5%。此外，我们观察到娱乐业、制造业和零售业在伊利诺伊州的理赔风险非常相似。此外，有强证据表明咨询行业的风险显著低于其他行业。\n\
  \n![图 11.3 伊利诺伊州行业的生存函数。](img/file16.jpg)\n\n**图 11.3**\n\n伊利诺伊州行业的生存函数。\n\n图 11.4\
  \ 中所示的风险函数显示时理赔率持续增加，在保单开始第 280 天左右达到最高理赔率，然后略微下降。我们还可以观察到咨询业在保单期间的理赔率保持相对稳定且较低。图\
  \ 11.4（以及图 11.6\n\n**图 11.4**\n\n伊利诺伊州行业的风险函数。\n\n随时间变化的协变量 `SEASON_EVENT` 非常显著，`γ\
  \ = 0.281`。这意味着在控制其他协变量的情况下，伊利诺伊州冬季的风险率高出 32%：\n\n`exp(0.281) - 1 ≈ 0.32`\n\n特定保单的生存（事件时间）函数的估计应该考虑保单何时开始——以及在保单期间何时由于季节导致理赔概率增加。\n\
  \n当存在随时间变化的协变量时，生存函数的计算并不简单，因为我们需要精确指定特定保单何时开始，以及冬季相对于保单开始日期何时发生。作者开发了一个专用的计算机程序来计算每个行业带有随时间变化的协变量的\
  \ `Si`。\n\n下面我们比较了之前提到的两个例子：保单在 4 月 1 日开始和 8 月 1 日开始的情况。\n\n\n\n\n如果保单从 4 月 1 日开始，那么在时间\
  \ `t` ≤ 214 天内（从 4 月 1 日到 11 月 1 日），`season` = 0。然后，在 `t` > 214 天到保单结束为止的时间范围内，`season`\
  \ = 1。因此，对于事件发生 `t` ≤ 214 天，生存函数使用对应 `season = 0` 的风险率进行计算；对于事件发生 `t` > 214 天，则使用对应\
  \ `season = 1` 的风险率进行计算。该情况的生存函数如图图 11.5 所示。\n\n![图 11.5 伊利诺伊州 4 月 1 日开始的保单各行业生存函数](img/file18.jpg)\n\
  \n**图 11.5**\n\n4 月 1 日开始的保单下，伊利诺伊州各行业的生存函数。\n\n与未考虑冬季的图 11.3 相比，我们可以看到生存比例从保单第\
  \ 214 天开始下降。\n\n当我们考虑到冬季时，娱乐业和公用事业业在为期一年的单中完全没有理赔的概率均为 0%。\n\n事实上，对于公用事业行业，即使在保单第\
  \ 270 天之前，完全没有理赔的概率也为 0%。然而，娱乐业在第 270 天前无理赔的“生存”概率约为 9%。\n\n图 11.6 所示的风险函数显示，理赔的瞬时风险在\
  \ `t` > 214 天后急剧增加，并在保单期第 280 天左右达到最高理赔率。\n\n![图 11.6 伊利诺伊州 4 月 1 日开始的保单各行业风险函数](img/file19.jpg)\n\
  \n**图 11.6**\n\n4 月 1 日开始的保单下，伊利诺伊州各行业的风险函数。\n\n对于第二个示例，如果保单从 8 月 1 日开始，那么在时间 `t`\
  \ ≤ 92 天（从 8 月 1 日到 11 月 1 日）和 `t` > 244 天（从 4 月 1 日到 7 月 31 日）期间，`season` = 0。然后，在保单\
  \ 92 < `t` ≤ 244 天的时间范围内，`season` = 1。因此，对于事件发生 `t` ≤ 92 和 `t` > 244 天，生存函数使用对应\
  \ `season = 0` 的风险率计算；对于事件发生 92 < `t` ≤ 244，则使用对应 `season = 1` 的风险率计算。该情况的生存函数如图图\
  \ 11.7 所示。\n\n与未考虑冬季的图 11.3 相比，我们可以看到生存比例在保单第 100 天之前就开始下降。\n\n对于公用事业行业，考虑到冬季的情况下，保单第\
  \ 100 天前无理赔的概率为 44%，而不考虑冬季时该概率为 65%。此后，概率开始下降，到保单第 210 天时，在考虑冬季的情况下，公用事业行业完全没有理赔的概率为\
  \ 0%。\n\n对于娱乐业，考虑到冬季的情况下，保单第 100 天前无理赔的概率为 66%——而不考虑冬季的情况下为 72%。此外，为期一年的保单完全没有理赔的概率约为\
