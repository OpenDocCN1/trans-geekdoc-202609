  \n### 9.4 总结\n\n本章描述了污染训练数据集组件的数据字典。该数据字典的主要目的是确保实验的可重复性和可比性。\n\n---\n\n# 10 保险行业：核保决策过程\n\
  \n## 10.1 引言\n\n传统上，核保决策被认为是判断、经验和“直觉”的结果。学徒制是新核保人员获得必要经验的习惯方式。然而，资深核保人员将知识传递给下一代需要很长时间。\n\
  \n改进核保的一种方法是详细分析决策过程中的步骤并创建指南（Chidambaran 等，1997）。将核保视为对决策过程中特定步骤的应用虽然明确了其性质，但失去了经验丰富人员的灵活性。因此，这种方法未达到预期。行业在经验传递方面仍然挣扎。\n\
  \n此外，保险公司开始意识到经验并非最好或最有效的老师——它既耗时又昂贵，且具有主观性。好习惯和坏习惯都会通过学徒制传递。\n\n可以通过以下三个步骤改进决策过程：\n\
  \n1. 使用各种性能指标识别最佳核保人员\n2. 利用优秀核保人员的知识训练 AI 算法，以及\n3. 部署 AI 解决方案实现决策过程的自动化。\n\n##\
  \ 10.2 核保人员表现\n\n在本节中，我们使用几种现有指标（Kunreuther 等，1995）以及我们提出的一种新指标来分析核保人员的表现。我们将简要说明这些指标的特征，并将其应用于一家工伤保险公司的真实数据。\n\
  \n### 10.2.1 核保人员指标\n\n可以使用不同的指标来评估核保人员的表现，例如命中率、转化率和成交周期。我们还提出了一种可以动态衡量核保人员的新指标。\n\
  \n## 参考文献\n\n1. Kolosova, T., and Berestizky, S. 1995. *Table-Driven Strategies\
  \ for Rapid SAS Development*. Cary, NC: SAS Institute, Inc.\n\n\n\n\n\n### 10.2.1.1\
  \ 命中率 (Hit Ratio)\n\n命中率（`HitR`）指标反映了核保人员的表现，其取决于分配的申请数量。该指标在特定期间内计算，其定义取决于核保人员的工作量以及预期的交易完成时间（承保保险申请），或者报价的有效期。\n\
  \n$\\text{Hit}R\\_{ti} = \\frac{\\\\text{BU}\\_{ti}}{\\\\text{AU}\\_{ti}}$ \n\n\
  其中：\n\n`HitR[ti]`—核保人员 *i* 在 *t* 期间的命中率\n\n`BU[ti]`—核保人员 *i* 在 *t* 期间承保的申请数量（完成的交易数）\n\
  \n`AU[ti]`—核保人员 *i* 在 *t* 期间被分配的申请数量。\n\n命中率指标的一个显著缺点是它没有考虑到保险申请的复杂性。很多时候，核保人员会直接拒绝保险申请，或者在根据保险公司的规则和政策进行简短评估后予以拒绝。因此，命中率也取决于分配给核保人员的保险申请的复杂性。因此，与其命中率，转化率指标是衡量核保人员表现更合适的方法。\n\
  \n### 10.2.1.2 转化率 (Conversion Rate)\n\n转化率指标（`CR[ti]`）根据核保人员提供过报价的申请来反映其表现。换句话说，报价申请是指那些未被保险公司（核保人员）拒绝的申请。该指标在由预期交易完成时间（承保申请或客户接受拟议报价）或报价有效期定义的期间内进行计算：\n\
  \n$\\text{CR}\\_{ti} = \\frac{\\\\text{BU}\\_{ti}}{\\\\text{QAU}\\_{ti}}$ \n\n其中：\n\
  \n`CR[ti]`—核保人员 *i* 在 *t* 期间的转化率\n\n`BU[ti]`—核保人员 *i* 在 *t* 期间承保的申请数量\n\n`QAU[ti]`—核保人员\
  \ *i* 在 *t* 期间提供过报价的申请数量。\n\n该指标通常在较长的期间内计算，因为核保人员希望等待所有申请的结果，包括那些仍在与客户/潜在客户谈判中的申请。因此，该指标虽然提供了一个信息丰富的回顾性视角，但不能作为运营指标（例如，按每月）。该指标的另一个问题是它没有考虑到特定核保人员的工作量。例如，承保了\
  \ 5 个报价申请中的 1 个的核保人员，其 $\\text{CR}\\_{ti} = \\frac{1}{5} = 0.2$ 与承保了 50 个报价申请中的\
  \ 10 个的个人的 $\\text{CR}\\_{ti} = \\frac{10}{50} = 0.2$ 是相同的。\n\n我们提出了一种解决这些问题的新型运营指标。\n\
  \n### 10.2.1.3 动态转化率 (Dynamic Conversion Rate)\n\n我们提出了一种名为动态转化率的新型运营指标。动态转化率连续衡量转化情况，允许监控核保人员的表现并管理核保人员的最佳工作量。\n\
  \n动态转化率指标（`DCR[mi]`）基于目标月份可用的信息评估核保人员的月度。该指标将核保人员视为服务提供者，拥有入站请求（报价申请）和输出结果（承保申请）。换句话说，每个月，核保人员都有若干报价申请在队列中等待最终确定：被客户/潜在客户承保或拒绝。由于\
  \ `DCR[mi]` 每月衡量一次性能，工作量低的核保人员会在非活跃月份受到惩罚。动态转化率指标根据以下公式计算：\n\n$\\text{DCR}\\_{mi}\
  \ = \\frac{\\\\text{ln}\\left( {\\\\text{BU}\\_{mi} + 1} \\right)}{\\text{ln}(\\\
  text{QQAU}\\_{mi} + 1)}$ \n\n其中：\n\n`DCR[mi]`—核保人员 *i* 在 *m* 月份的动态转化率\n\n`BU[ti]`—核保人员\
  \ *i* 在 *m* 月份承保的申请数量\n\n`QQAU[ti]`—核保人员 *i* 在 *m* 月份提供过报价并等待结果（在队列中）的申请数量。\n\n\
  该指标的值于 0 和 1 之间；当当月没有承保申请时，`DCR[mi]` 等于 0；当目前为止的所有报价申请都在当月承保时，它等于 1。因此，该指标展示了核保人员的持续表现，提供了一种可用于高效管理核保流程的运营衡量。此外，`DCR[mi]`\
  \ 指标考虑了核保人员的工作量。[表 10.1] 使用与上述用于 `CR[ti]` 转化率指标相同的示例展示了 `DCR[mi]` 指标的优处。\n\n**表\
  \ 10.1**\n\n`CR[ti]` 与 `DCR[mi]` 指标对比\n\n| 核保人员 | 报价申请 (`QQAU[ti]`) | 承保申请 (`BU[ti]`)\
  \ | `CR[ti]` | `DCR[mi]` |\n| --- | --- | --- | --- | --- |\n| A | 5 | 1 | 0.2 |\
  \ 0.3865 |\n| --- | --- | --- | --- | --- |\n| B | 50 | 10 | 0.2 | 0.6097 |\n\n\
  如 [表 10.1] 所示，对于 `CR[ti]` 为 0.2 但报价和承保申请数量较大的核保人员 B，`DCR[mi]` 更高。\n\n### 10.2.1.4\
  \ 成交时效 (Time-to-Deal)\n\n成交时效（TTD）指标评估核保人员完成交易的效率。成交时效计算为申请分配给核保人员的日期与承保日期之间的时间。TTD\
  \ 由报价有效期进行截断。TTD 可以在较长的期间（如 6 个月或一年）取平均值，但在这种情况下它不是运营性的，无法用于管理。我们建议使用每月成交时效指标 `TTD[mi]`，即核保人员\
  \ *i* 在 *m* 月的平均成交时效。\n\n$\\text{TTD}\\_{mi} = \\frac{\\\\sum_{j = 1}^{n}\\\\text{TTD}\\\
  _{mij}}{n}$ \n\n其中：\n\n`TTD[mi]`—核保人员 *i* 在 *m* 月的平均成交时效\n\n`TTD[mij]`—核保人员 *i*\
  \ 在 *m* 月承保的 *n* 个申请中第 *j* 个申请的成交时效。\n\n### 10.2 核保人员分析\n\n使用上述指标，我们展示了工伤保险核保人员表现的研究结果。在这项研究中，我们使用了过去\
  \ 4 个月内与新工伤保险申请相关的数据。\n\n#### 10.2.2.1 数据描述\n\n用于核保人员评估研究的数据包括：\n\n* 申请提交日期、报价日期和保单日期（如有）；\n\
  * 保险申请参数，如行业、州和员工人数；\n* 分配申请的核保人员。\n\n在分析之前，按照以下方式对数据进行了“清洗”和准备：\n\n(a) 需要超过三个月才能承保的申请从研究中移除（少于所有承保申请的\
  \ 5%）。\n(b) 在分析的 44 个月期间，分配申请总数少于 2%的核保人员也被排除。\n\n#### 10.2.2.2 申请流\n\n核保人员的表现评估取决于保险申请流以及申请分配给核保人员的过程。因此，在估计核保人员的动态转化率和成交时效之前，应该对申请流和申请分配过程进行分析。\n\
  \n\n\n\n\n每月平均申请数量分布显示出季节性，其中 3 月和 10 月的申请数量有所增加，而 12 月份大幅下降（图 10.1）。在提交过程中识别这种季节性，有助于为核保人创建平衡的工作负载。\n\
  \n![FIGURE 10.1 每月提交申请平均数量。](img/file10.jpg)\n\n**图 10.1**\n\n每月提交申请平均数量。\n\n每个工作日平均申请数量分布显示，周一的申请数量略低（图\
  \ 10.2）。\n\n![FIGURE 10.2 每个工作日提交申请平均数量。](img/file11.jpg)\n\n**图 10.2**\n\n每个工作日提交申请平均数量。\n\
  \n分析表明，申请流在月份和工作日之间存在波动，这些波动是容易管理的。然而，如图 10.3 所示，核保人的工作负载远非平衡。这使得对核保人绩效的分析变得更加复杂。\n\
  \n![FIGURE 10.3 每位核保人每月平均分配申请。](img/file12.jpg)\n\n**图 10.3**\n\n每位核保人每月平均分配申请。\n\
  \n一方面，向表现较好的核保人分配更多申请是合理的。但另一方面，较少的申请可能让核保人能够更全面地分析情况，与客户/潜在客户进行更深入的谈判——结果是表现出更好的绩效。我们将进一步讨论这一假设。\n\
  \n### 10.2.2.3. 每位核保人的动态转化率\n\n在 44 个月的观察期内，计算了每位核保人的动态转化率 `DCR[mi]`。平均动态转化率在 0.12\
  \ 以上的优秀核保人约占所有核保人的 8%。如图 10.4 所示，顶尖表现者的动态转化率显著高于其他核保人。\n\n![FIGURE 10.4 两组核保人之间动态转化率（移动转化率）的比较。](img/file13.jpg)\n\
  \n**图 10.4**\n\n两组核保人之间动态转化率（移动转化率）的比较。\n\n我们分析了分配给核保人的申请数量与其`DCR[mi]`衡量的绩效之间的关系。对于顶尖表现者，每位核保人每月平均分配申请数为\
  \ 13 个（中位数为 12）。对于其他核保人，每位核保人每月平均分配申请数为 10（中位数为 8）。我们使用 Kolmogorov–Smirnov 双样本检验，对顶尖表现者组与其余核保人组之间每位核保人每月分配申请数量的经验分布进行了比较。Kolmogorov–Smirnov\
  \ 检验的渐近 p 值为 `<.0001`。这表明我们应该拒绝“每月分配申请数量分布相同”的原假设。\n\n### 10.2.2.4. 每位核保人的交易达成时间\n\
  \n在 44 个月的观察期内，计算了每位核保人的动态转化率 `DCR[mi]`。平均动态转化率在 0.12 以上的优秀核保人约占所有核保人的 8%。如图 10.4\
  \ 所示，顶尖表现者的动态转化率显著高于其他核保人。\n\n我们分析了分配给核保人的申请数量与其`DCR[mi]`衡量的绩效之间的关系。对于顶尖表现者，每位核保人每月平均分配申请数为\
  \ 13 个（中位数为 12）。对于其他核保人，每位核保人每月平均分配申请数为 10（中位数为 8）。我们使用 Kolmogorov–Smirnov 双样本检验，对顶尖表现者组与其余核保人组之间每位核保人每月分配申请数量的经验分布进行了比较。Kolmogorov–Smirnov\
  \ 检验的渐近 p 值为 `<.0001`。这表明我们应该拒绝“每月分配申请数量分布相同”的原假设。\n\n### 10.3. 知识传递的传统方法\n\n提高质量和一致性是保险公司持续努力的方向。多年来，明智的核保决策被认为是判断、经验和“直觉”的结果。新核保人获得“判断”的唯一途径是在资深核保人的指导下工作（Randall,\
  \ 1994）。\n\n验证绩效的传统方法包括档案审查或审计以及一致性检查。审计过程通常由六个步骤组成：\n\n1. 收集申请人的风险暴露和危险因素数据。\n\
  2. 评估风险和危险因素。\n3. 开发并评估核保方案。\n4. 选择核保方案，包括选择保费。\n5. 执行核保决策。\n6. 监控损失敞口。\n\n这种审计可能会识别核保流程中的缺陷，并为额外的指导和质量改进提供依据。然而，此过程中的每一步都是主观且定性验证的，并基于两个假设。第一个假设是存在适当指南，这些指南通常更新频率较低，并随着时间的推移而过时。第二个假设是存在成熟的管理流程，其中分配给核保人的申请是平衡的，问题的识别和干预是及时的。\n\
  \n遗憾的是，在当今动态、大规模且创新的环境中，这些假设往往不再成立。此外，对核保人日益增长的需求要求培训是高效、一致且快速的。\n\n### 10.4. 人工智能解决方案的解析\n\
  \n核保决策过程包括以下组件：\n\n*   核保人，负责处理保险申请（在我们的示例中，是工人赔险险种）\n*   各客户/潜在客户提交的保险申请，并附带业务不同特征的描述，包括业务规模和营业额\n\
  *   保险公司提供的工人赔险保险产品，以及其条款、保费金额、限制条件等\n*   客户/潜在客户对核保人报价的响应：接受或拒绝拟议的保险方案\n\n\n\n\n\
  为了形式化核保决策过程，我们从创建合适的数据结构开始。\n\n### 10.4.1 数据结构\n\n令 `i` = `1…n` 代表核保员，`j` = `1…m`\
  \ 代表申请，`k` = `1…p` 代表工伤保险产品。每份申请都由一组特征（参数）描述，例如公司员工人数、员工年龄、行业代码、所在州/省份以及去年的理赔次数。这些特征经过了标准化处理，并由向量\
  \ `A[j] = {a[j1], a[j2], … a[jM]}` 呈现，其中 `M` 是保险申请特征（参数或特性）的数量。\n\n每个保险产品都由一组特征（参数或特性）描述，例如保单涵盖的条件、免赔额和保费。保险产品特征由向量\
  \ `B[k] = {b[k1], b[k2], … b[kP]}` 呈现，其中 `P` 是保险产品特征的数量。这些特征对所有产品都是标准化的，如果例如特征 `b[k2]`\
  \ 未出现在产品 `k` 中，则将 `b[k2]` 赋值为 0。\n\n令 `Y[ijk]` 表示每个报价的保险申请的结果——1 表示已承保，0 表示被拒绝。这种结构允许捕捉同一核保员针对同一份保险申请所做出的多个报价。例如，上述描述的数据结构可能如\
  \ [表 10.2] 所示。\n\n**表 10.2**\n\n数据结构示例\n\n| || || 申请特征 || || 产品特征 || |\n| --- |\
  \ --- | --- | --- | --- | --- |\n| 核保员 `i` | 申请 `j` | 员工人数 `a[j1]` | 21 岁以下员工占比\
  \ `a[j2]` | 50 岁以上员工占比 `a[j3]` | … | 去年理赔次数 `a[jM]` | 产品 `k` | 免赔额 `b[k1]` | … |\
  \ 保费 `b[kP]` | 结果 `Y[ijk]` |\n| || … || … || … || … || … || … || … || … || … ||\
  \ … || … |\n| 10 || 100 || 30 || 5 || 3 || … || 0 || 1001 || 10,000 || … || 1,000\
  \ || 1 |\n| 10 || 105 || 100 || 2 || 10 || … || 5 || 1001 || 40,000 || … || 1,500\
  \ || 0 |\n| 10 || 105 || 100 || 2 || 10 || … || 5 || 1003 || 30,000 || … || 1,000\
  \ || 0 |\n || || || || || || ||0 ||0 || … || … || … || … ||0 || … |\n | … || … ||\
  \ … || … || … ||0 || … ||0 || … ||0 || ... |\n| 10 || 105 || 100 || 2 || 10 || …\
  \ || 5 || 1001 || 40,000 || … || 1,500 || 0 |\n\n### 10.4.2 分类方法\n\n广义而言，我们使用 `SVM`\
  \ 来预测客户是否接受。因为 `SVM` 不对分布，而是直接最小化分类误差，因此 `SVM` 输出的是二分类决策。虽然二分类决策对于许多问题是足够的，但很难获得有意义的偏差-方差平衡（bias–variance-off）。通过对\
  \ `SVM` 输出应用惩罚逻辑回归可以缓解这一担忧。使用惩罚逻辑回归处理 `SVM` 输出的好处是使结果更具泛化性（例如减少过拟合）。在分类中，`SVM` 配合惩罚逻辑回归创建了类别成员的概率，而不是\
  \ `SVM` 的点估计。将分类问题重新表述为概率分类为应用最初为最小二乘回归设计的偏差-方差分解创造了条件。\n\n### 10.4.3 偏差-方差超参数\n\
  \n偏差是由错误假设引起的误差。高偏差意味着欠拟合。方差是由于训练中的变化产生的误差。偏差-方差权衡是机器学习中的核心问题。在统计学中，偏差-方差权衡是一种特性：低偏差模型具有高方差，反之亦然。为了避免分析中的偏差，我们使用\
  \ `m-out-of-n` 有放自助法从原始数据创建了训练集和测试集。例如，大的 `C` 导致低偏差和高方差，而小的 `C` 导致高偏差和低方差。大的 `d`\
  \ 或 `γ` 导致高偏差和低方差，而较小的 `d` 或 `γ` 导致低偏差和高方差。\n\n### 10.4.4 构建分类器\n\n我们提出的 AI 解决方案尝试从最好的核保员那里“学习”。因此，在我们的研究中，我们仅使用了占所有核保员\
  \ 8% 的顶级表现者相关的数据。我们处理的数据经过结构化，通过广泛包含保险申请和报价产品的所有特征（特性或参数）以及如表 10.2 所示的二值结果 `Y`（客户对报价的接受或拒绝），来表达所有相似的问题。\n\
  \n\n\n第一步，我们创建了一个统计设计的全因子实验，以寻找 SVM 的最优超参数：核转换函数（径向核、多项式核和 sigmoid 核类型）、核超参数 `d`\
  \ 或 `γ`，以及算法超参数——C。对于连续值 `C` 以及超参数 `d` 或 `γ`，我们将这些值聚类到多个组中。可以使用 `FACTEX` 过程来创建一个全因子实验。例如，如果我们决定为\
  \ `C` 和 `γ` 超参数创建六组值，那么我们的全因子设计将包含 3¹\\*6²℄=℄108 组合（运行）。\n\n## 第 2 步\n\n对于全因子设计中提出的每种组合，我们按照如下方式执行\
  \ SAS 的 `HPSVM` 过程：\n\n```sas\n%macro SVM (data=training_set, c=100, gamma=2, kernel\
  \ = rbf, input_app = num_emp pct_under_21 pct_over_50 claims, input_prod = deduct\
  \ premium output = output, target=outcome);\n    PROC HPSVM DATA = &data\n     \
  \ C = &c /* the penalty value */\n      MAXITER=10000 /* the maximum number of iterations\
  \ */\n      INPUT &input_app &input_prod / LEVEL=INTERVAL;\n      KERNEL &kernel\n\
  \      %if %trim(%left(&kernel)) = rbf or\n          %trim(%left(&kernel)) = sigmoid\
  \ %then\n          %do;\n            / k_par = &gamma;\n          %end;\n      OUTPUT\
  \ &output;\n      TARGET &target;\n    run;\n%mend SVM;\n```\n\n作为最终分类器，我们选择在应用于训练数据集时使敏感性（正确分类的已绑定申请比例）和特异性（正确分类的被拒绝报价比例）最大的那一个。\n\
  \n## 第 3 步\n\n下一步，为了给 SVM 结果增加概率元素，我们对 SVM 算法的结果应用了 Firth 惩罚逻辑回归（Firth, 1993）。`SVM`\
  \ 会产生完全分离数据。Firth 惩罚似然法是处理可分性问题的方法。Firth 方法在 `LOGISTIC` 过程中可用，且仅适用于二分类逻辑模型。它替换了通常的评分方程：\n\
  \n$g\\left( \\beta\\_{j} \\right) = \\sum\\limits\\_{i = 1}^{n}\\left( {y\\_{i}\
  \ - \\pi\\_{i}} \\right)x\\_{ij} = 0\\left( {j = 1,\\ldots,p} \\right)$ \n\n其中 `p`\
  \ 是模型中的参数数量，修改后的评分方程为：\n\n$g\\left( \\beta\\_{j} \\right) = \\sum\\limits\\_{i =\
  \ 1}^{n}\\left( {y\\_{i} - \\pi\\_{i}} + h\\_{i}\\left( {0.5 - \\pi\\_{i}} \\right)\
  \ \\right)x\\_{ij} = 0\\left( {j = 1,\\ldots,p} \\right)$\n\n其中 `h[i]` 是帽矩阵（hat\
  \ matrix）的第 `i` 个对角线元素：\n\n$g\\left( \\beta\\_{j} \\right) = \\sum\\limits\\_{i\
  \ = 1}^{n}\\left( {y\\_{i} - \\pi\\_{i}} + h\\_{i}\\left( {0.5 - \\pi\\_{i}} \\\
  right) \\right)x\\_{ij} = 0\\left( {j = 1,\\ldots,p} \\right)$ $W^{\\frac{1}{2}}\\\
  left( {X^{\\prime}W} \\right)^{- 1}X^{\\prime}W^{\\frac{1}{2}}$ 下面的 SAS 代码实现了带有\
  \ Firth 偏偏正的逻辑回归：\n\n```sas\nPROC LOGISTIC data = SVM_Decision ;\n    CLASS Outcome\
  \ ;\n    MODEL Outcome (event='1') = Decision / FIRTH ;\nRUN ;\n```\n\n由于逻辑回归的结果是概率，我们选择了一个截断或阈值值来分类案例。高于此阈值的概率被分类为\
  \ 1，低于此阈值的分类为 0。对于由 Firth 惩罚逻辑回归生成的概率，我们寻找这样一个阈值值，以进一步提高 `SVM` 产生结果的敏感性和特异性。\n\n\
  我们对 2,000 个训练数据集中的每一个都进行分析。作为最终分类器，我们选择了一个基于 Firth 惩罚逻辑回归调整的 `SVM` 分类器，它平均产生产生更高的敏感性和特异性指标。\n\
  \n在应用不同的内核类型和各种 SVM 超参数（根据上述描述的全因子设计）后，最佳出现在具有代价参数 `C`∈[1000;3000] 和 `γ`∈[0.2;0.6]\
  \ 的径向内核。分类结果的敏感性平均等于 0.987，特异性平均等于 0.799。\n\n然后，我们根据 Firth 惩罚逻辑回归的结果确定了一个改进分类的阈值。用于分类结果的\
  \ 0.76 阈值值将特异性平均提高到 0.847 的水平，代价是敏感性的轻微损失——敏感性平均变为等于 0.973。\n\n### 10.4.5 训练数据集的“污染”\n\
  \n现在，我们处理由于训练数据集微小波动引起的敏感性指标方差。为了避免特征和输出之间导致过拟合的高方差，我们对训练数据集进行“污染”。“污染”是通过更改训练集中一小部分比例标签来实现的，这是根据混合实验的设计计划。在混合实验中，我们改变比例，正如我们的示例所示——不同结果的比例。混合实验设计的细节不在本书的范围内，我们只说明这种方法允许对数据进行“污染”。按照设计对训练数据集进行污染后，我们再次执行第\
  \ 1–3 步，其中具有代价参数 `C`∈[1000;3000] 和 `γ`∈[0.2;0.6] 的径向内核作为过程的起点。结果是建立了一个稳健的分类器。将开发的分类器应用于测试数据集，我们得到了以下结果：特异性等于\
  \ 0.859，敏感性等于 0.851。\n\n### 10.4.6 实验结果\n\n为了测试解决方案的效率，我们使用了以下历史数据：\n\n1. 针对保险申请提供的保险产品属性/特征和价格；\n\
  2. 提供了保险产品的保险申请的属性/特征；\n3. 客户对保险产品的接受或拒绝数据。\n\n实验的数据选择方式使得所有报价都被客户/潜在客户拒绝了。换句话说，该数据样本的转化率为\
  \ 0%。\n\n实验的目标是应用开发的 AI 解决方案，寻找什么样的保险产品和价格能够符合保险申请，从而被客户/潜在客户接受。样本数据中的每个保险申请收到了一个保险产品的报价，少数情况下有两个报价。但在我们的实验中，每个申请都与所有可能的保险产品及其价格相结合。此类数据的示例如表\
  \ 10.3 所示，其中：\n\n* 灰色阴影行显示客户拒绝的保险申请和相关的保险产品，\n* 白色行显示所有其他可能提供的产品。\n\n**表 10.3**\n\
  不同产品报价的历史数据示例\n\n| 这些数据被用作 AI 解决方案的输入。表 10.3 中名为“分类结果 Yijk”的列包含了应用 AI 解决方案的结果。该列中的值\
  \ 1 识别出高概率被客户接受的产品。 识别出的相关保险产品和价格预计将导致 14.7% 的转化率。换句话说，实验识别出了最可能导致保险申请绑定的申请和产品。\
  \ |\n\n\n\n\n保险行业在从经验丰富的核保人员向年轻核保人员传递知识的速度上仍然面临挑战。目前使用的基于学徒制方法的缺点是核保人员决策的主观性。对核保人员绩效的衡量也存在效率低下的问题，因为现有指标具有滞后性且不可操作性。我们分析了核保人员的绩效指标，并提出了一种新指标——`动态转换率`，它允许对核保人员的运营绩效进行衡量监测（每周、每月等）。\n\
  \n本章描述了旨在改进核保决策过程的 AI 解决方案。该解决方案基于 `SVM` 机器学习方法及其改进。总的来说，通过 `SVM` 构建的高效分类器，并结合 `Firth’s\
  \ 惩罚逻辑回归` 阈值进行改进，可以获得满意的结果。章节表明，如果我们的 AI 解决方案用于保险申请报价（在我们的研究中是工伤保险），那么它可以使申请承接率提高\
  \ 14.7% 的增量。\n\n## 参考文献\n\n1. Bickel, P. J., and Ren, J. J. 1995. The ‘m Out of\
  \ n’ bootstrap and goodness of fit tests with double censored data. In *Robust Statistics,\
  \ Data Analysis and Computer Intensive Methods*, 35–47. New York, NY: Springer.\n\
  2. Chidambaran, N. K., Pugel, T. A., and Saunders, A. 1997. An investigation of\
  \ the performance of the U.S. property-liability insurance industry. *The Journal\
  \ of Risk and Insurance*, 64: 371–382.\n3. Cortes, C., and Vapnik, V. 1995. Support-vector\
  \ networks. *Machine Learning*, 20: 273–297.\n4. Firth, D. 1993. Bias reduction\
  \ of maximum likelihood estimates. *Biometrics*, 80 (1): 27–38.\n5. Kunreuther,\
  \ H., Meszaros, J., Hogarth, R. M., Spranca, M. 1995. Ambiguity and underwriter\
