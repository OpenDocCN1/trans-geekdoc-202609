  \ TST\\_ | N | 30 | 2 |\n\n### 7.1.2 SAS 宏程序\n\n以下是用于生成自助（bootstrapped）训练或测试数据集\
  \ `%bootstrap` SAS 宏。`%bootstrap` 宏的参数是从输入数据组件的数据字典存储的元数据中提取的。\n\n```sas\n%macro\
  \ bootstrap(\n   data=, /* 输入训练数据集。 */\n   output = , /* 输出的自助训练数据集。 */\n   samples=,\
  \ /* 要生成的重采样次数。 */\n   size=, /* 每次重采样的大小。 */\n   balanced=, /* 1 为平衡重采样；0 为均匀重采样。\
  \ */\n   random= /* 伪随机数种子。 */\n   );\n   \n   *** 获取输入数据集中的观测值数量;\n   %global _nobs;\n\
  \   data _null_;\n      call symput('_nobs',trim(left(put(_nobs,12.))));\n     \
  \ if 0 then\n          set &data nobs=_nobs;\n      stop;\n   run;\n   \n   %if\
  \ &balanced %then\n      %bootsbalance(data=&data,samples=&samples,random= &random,\
  \ output = &output);\n    %else\n      %bootsuni(data=&data,samples=&samples,random=&random,\
  \ size=&size, output = &output);\n   \n%mend bootstrap;\n   \n%macro bootsbalance\
  \ ( /* 平衡自助重采样 */\n   data=,\n   samples= ,\n   random=,\n   output =\n   );\n \
  \  \n* Gleason, J.R. (1988) \"Algorithms for balanced bootstrap\n* simulations,\"\
  \ American Statistician, 4, 26-266.\n   \n   data &output ;\n   drop _a _c _ii _j\
  \ _big _k _s;\n   array _c(&_nobs) _temporary_; /* 计数 */\n   array _p(&_nobs) _temporary_;\
  \ /* 指针 */\n   do _j=1 to _nobs;\n      _c(j)=&samples;\n   end;\n   do _j=1 to\
  \ _nobs;\n      _p(j)=_j;\n   end;\n   _k=&nobs; /* 非空单元格的数量 */\n   _big=_k; /*\
  \ 最大单元格的索引 */\n   _big = &samples; /* _big >= _c(j) */\n   do _sample_=1 to &samples;\n\
  \      do _i=1 to _nobs;\n      do until(_s<=_c(j));\n         _j=ceil(uni(&random)*_k);\
  \ /* 选择单元格 */\n         _s=ceil(uni(&random)*_big); /* 接受单元格 */\n      end;\n  \
  \    _l=_p(j);\n      _obs_=_l;\n      _c(j)+-1;\n      if _j=_big then do;\n  \
  \       _a=floor((&sample_+_k)/_k);\n         if _big-_c(j)>_a then do;\n      \
  \      do _ii=1 to _k;\n               if _c(ii)>_c(big) then _big=_ii;\n      \
  \      end;\n            _big=_c(j);\n      end;\n   end;\n      if _c(j)=0 then\
  \ do;\n         if _big=_k then _big=_j;\n         _p(j)=_p(k);\n         _c(j)=_c(k);\n\
  \         _k+-1;\n      end;\n      set &data point = _l ;\n      output;\n   end;\n\
  \   end;\n   stop;\n   run;\n%mend bootsbalance;\n%macro bootsuni ( /* 均匀自助重采样 */\n\
  \   data= ,\n   samples= ,\n   random= ,\n   size= ,\n   output =\n   );\n   \n\
  \   %if %bquote(&size)= %then %let size=&_nobs;\n   \n   %local sample;\n   %do\
  \ sample=1 %to &samples;\n   \n   data _tmp_&sample ;\n   _tmp = &sample ;\n   do\
  \ _i=1 to &size;\n      _l=ceil(uni(&random)*_nobs);\n      set &data point = _l\
  \ ;\n      output;\n   end;\n   stop;\n   run;\n%end;\n\n\n\n\n\n`Experiment` 表的列定义如\
