    data was needed to train the method. To do so, an open database available on the
    U.S. Environmental Protection Agency (EPA) was used, this database contains the
    chemical name, the Simplified Molecular Input Line Entry (SMILES) and different
    chemical and physical properties such as the melting point, the boiling point
    among many'
