    Abstract

    Nowadays, medical cannabis has gained great importance as a adjuvant in the treatment
    of some pathologies as glaucoma, rheumatoid arthritis, HIV, Alzheimer’s, asthma,
    cancer, chronic pain that is difficult to control, Crohn’s disease, epilepsy,
    multiple sclerosis, insomnia, and Parkinson’s; additionally, cannabinoids and
    terpenes have important properties that need to be considered and studied in a
    way to understand how these compounds work. The main goal of this study is to
    develop a new hybrid methodology based on both contribution groups and machine
    learning algorithms. In this particular case, the study is focused on estimating
    properties of cannabinoids and terpenes whose experimental information is really
    scarce, and in many cases, not reported. To do so, a dataset of hundreds of molecules
    which includes different thermodynamic properties have been considered. Our method
    is to estimate different properties such as boiling point, melting point, vapor
    pressure, viscosity, and vaporization enthalpy. Machine learning algorithms have
    been used to establish the contribution of every function and its stability has
    been compared with other well-known methods like the Joback and Reid (1987) method,
    Constantino and Gani (1994), others. One of the major findings of the present
    study is the fact that the current estimation methods are not adequate enough
    for cannabinoids and terpenes, so there is an important need to find new and more
    precise ones that allow to improve the accuracy in the groups as well as to extend
    the predictions to a bigger set of chemical groups. This study clearly shows the
    importance and utility of the machine learning methods in one of the most relevant
    chemical engineering areas such as the properties estimation. This study clearly
    shows the benefits of machine learning techniques in chemical engineering applications.


    Keywords: Property Estimation Method, functional groups, Machine Learning, Neural
    Networks, Cannabinoids.


    # 1. Introduction


    In the last years in studying the cannabis plant has increased notoriously in
    different fields due to the different pharmaceutical properties of several of
    its chemical compounds, for instance it is known cannabinoids are of great importance
    as adju in the treatment of different pathologies as cancer, epilepsy, and multiple
    sclerosis Abyadeh et al. (2021). Beside cannabinoids, cannabis plants also contain
    compounds such as flavonoids, fats, and terpenes. The latter have biological properties
    that make them potential mechanism against diseases, including cancer chemo preventive
    effects, antimicrobial, antifungal, and antiparasitic Paduch et al. (2007). Despite
    the great range of applications, the thermodynamic properties of'
