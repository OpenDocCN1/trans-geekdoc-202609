    This work is aimed to study the melting point of several cannabinoids and terpenes
    using a group contribution strategy along with machine learning techniques. The
    basic idea is when using group contribution methods, all molecules to the database
    are split 예정이다 allowing to establish a system of algebraic equations. Finally,
    an optimization method is used in order to minimize the error between predictions
    and experimental data. Several contribution methods have been proposed for different
    purposes in the property estimation. One of the best methods was proposed by Joback
    and Reid (1987), this method is able to estimate critical points, melting temperature
    and normal boiling temperature, it is commonly for relatively simple molecules
    and is based on 41 molecular molecules. Additionally, Constantinou and Gani (1994)
    made the estimation of critical properties of pure organic compounds, which due
    to its sophistication promises better than Joback''s method, as the estimation
    is performed at two levels: the basic level that uses from first-order groups,
    and the higher level that uses a set of second-order groups approximations having
    the first-order groups as building blocks. The predictions, first and second order
    approximations, are based on the molecular structure of the compounds, and also
    other studies unified the group contribution methods with artificial neural networks.
    Recently, Valderrama et al. (2015) created this type of hybrid method for the
    estimation of the density of ionic liquids. For this purpose, an experimental
    database of 399 for 100 ionic liquids was used for the network training. In order
    to discriminate between different, the molecular mass and structure of the molecule
    were given input variables. Additionally proposed an artificial neural network
    (ANN-GC) contribution method in order to determine surface tension of compounds
    at different surface temperatures and pressures. They used 4700 data belonging
    to experimental surface values, approximating organic compounds and 15 functional
    groups at different conditions. Although several methods have been proposed, none
    of them is able to reproduce the experimental data of cannabinoids or terpenes,
    additionally it is certain to provide a methodology to estimate them, in this
    particular a hybrid strategy of group contribution methods along with machine
    learning techniques and a big set of experimental data will be used. The manuscript
