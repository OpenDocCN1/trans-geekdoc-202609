    # 2.2. Machine learning algorithms.


    In this subsection, we introduce the concept of Artificial Neural Networks (ANN),
    and the process of training and evaluation. ANN was introduced by the structure
    and functions of biological neurons, and it generally consists of an input layer
    where data is fed, the hidden layers standing for the internal structure of the
    model where information goes until arrival the output layer Schmidhuber (2015).
    This layer comprises neurons that transmit the information downstream to connected
    neurons belonging to other layers. The previous layers act as an input for the
    next one after applying nonlinear activation on it, and finally propagates the
    result to the following layer. In a vector method we have Wang et al. (2020):


    ```

    $h_{i+1} = W_{i+1}l_i + b_{i+1}; l_i = f(h_{i-1})$

    ```


    where $l_i$ is the input row of the $i$-th layer, $W_{i+1}$ and $b_i$ are the
    weights and biases parameter, $h_{i+1}$ is the intermediate vector after linear
    transformation, and $f$ is the activation function. The goal of training an ANN
    is to minimize the difference between the predicted value given by the output
    layer $y = f_{w,b}(h)$ and the ground truth $y$. The minimization is described
    through the loss function $L$, by optimizing the parameters $W$ and $b$. In regression
    tasks Schmidhuber (2015), it is common to use $L$ as the mean squared error (MSE),
    or the mean absolute error (MAE).


    ```

    $MSE = \frac{1}{N} \sum (y - \hat{y})^2, MAE = \frac{1}{N} \sum |y - \hat{y}|;
    H_{\delta}(y,\hat{y}) = \begin{cases} 0.5(y-\\hat{y})^2, |y-\\hat{y}| \leq \delta
    \ \delta(|y-\\hat{y}|-\\delta), & \text{otherwise} \end{cases}$

    ```


    where $N$ is the number of samples. The aforementioned functions will be adapted
    to this work. Following the chain rule, one can transmit gradients of the parameters
    in the $i$-th layer from the $(i+1)$-th layer. By backward propagation the parameters
    are updated, then forward propagation is performed again. This is repeated until
    the loss function achieves the desired precision and thus, the ANN is trained
    to make predictions. Two types of neural networks are implemented in this work:
    Feedforward Neural Networks (FNN) and Convolutional (Conv). The FNN described
    does not have cycles within it and the connections between layers and information
    flow are straightforward, however, the Conv is a structured network with multiple
    sets of weights (filters) that "slide" or convolve the input space to analyze
    distance-pixel relationship opposed to individual node activation in the FNN Schmidhuber
    (2015). On the other hand, the dataset is split in training 70%, validation 15%,
    and test 15% sets. The first set is used to train the ANN, while the'
