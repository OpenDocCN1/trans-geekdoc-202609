    ## 4. Discussion and Conclusions


    In this paper, we have explored several machine learning techniques for estimating
    melting point. We contrasted two approaches: one of trained single NN, with ensembles
    of Convolutional layers. We found that ensembles outperform the single NN, specifically
    FNN trained with MSE, reaching R=0.88. Even if the result is good, we observed
    that the variance is very high. To overcome this, for future work, we suggest
    more robust techniques for feeding data into the model.


