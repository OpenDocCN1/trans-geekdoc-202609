    of the NN Models. Finally, a downside of the standard NNs is that they are sensitive
    to the training process and hyper-parameter choices, finding different set of
    weights each time they are trained, which can produce different predictions and
    high variance. An approach approach to reduce variance is to train multiple models
    instead of a single one and combine the predictions from these models. This is
    called ensemble learning and it helps to reduce the variance of predictions and
    can also result in better performance Tao (2019).


    ## 3. Analysis


    In order to predict the melting point in terms of the established chemical groups,
    we started with single NN regression models. First, we built in TensorFlow a FNN
