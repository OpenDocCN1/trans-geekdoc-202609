    ```


    where $N$ is the number of samples. The aforementioned functions will be adapted
    to this work. Following the chain rule, one can transmit gradients of the parameters
    in the $i$-th layer from the $(i+1)$-th layer. By backward propagation the parameters
    are updated, then forward propagation is performed again. This is repeated until
    the loss function achieves the desired precision and thus, the ANN is trained
    to make predictions. Two types of neural networks are implemented in this work:
