    # 基于机器学习的大麻素和萜类化合物的理性质估算方法


    Laura A. Vergara,* Héctor J. Hortúa,† Gustavo A. Orozco^a


    +   *哥伦比亚国立大学工程与环境系，化学与生物化学过程组，Kra 30#45-03, Bogotá, Colombia

    †哥伦比亚国立开放与距离大学基础科学、技术与工程学院，数据科学研究小组，Bogotá, Colombia


    ### 摘要

    如今，医疗用大麻作为某些疾病的辅助治疗手段已变得极其重要，例如青光眼、类湿性关节炎、HIV、阿尔茨海默症、哮喘、癌症、难以控制的慢性疼痛、克罗恩病、癫痫、多发性硬化、失眠和帕金森症；此外，大麻素和萜类化合物具有重要的性质，需要研究以理解这些化合物的作用。本研究的主要目标是开发一种基于基团法和机器学习算法的新型混合方法。在这种情况下，研究重点关注实验信息非常稀缺且许多情况下未报道的大麻素和萜类化合物的性质。为此，考虑了一个包含不同热学性质的数百个分子的数据集。我们的方法是估计沸点、熔点、蒸压、粘度和气化热等不同性质。机器学习算法被用于建立每个函数的贡献，并将其与其他已知方法（如Joback和
    Reid的1987方法，Constantino和Gani的1994方法等）进行比较。本研究的主要发现之一是，目前的估算方法对于大麻素和萜类化合物并不足够，因此迫切需要新的更精确的方法，以提高基团的准确性，并将预测扩展到更大的基团集合。本研究清楚地展示了机器学习方法在性质估算等最相关的化学工程领域中的重要性和实用性。本研究清晰地表明了机器学习技术在化学工程应用中的益处。


    关键词：性质估算方法、官能团、机器学习、神经网络、大麻素。


    # 1. 引言


    近年来，对大麻植物的研究在不同领域显著增加，这是由于其所含的多种化学化合物具有不同的药理特性，例如，众所大麻素作为治疗癌症、癫痫和多发性硬化症等不同疾病的辅助剂具有至关重要的作用（Abyadeh等，2021）。除了大麻素外，大麻植物还含有黄酮类、脂肪和萜类化合物等化合物。后者具有生物学特性，使其成为对抗疾病的潜在机制，包括癌症化学预防作用、抗微生物、抗真菌和抗寄生虫作用（Paduch等，2007）。尽管应用范围广泛，但在文献或专门数据库中很难找到大麻素和萜类化合物的热力学性质。因此，作为第一种廉价且快速的替代预测工具，可以使用基于基团贡献法的方法，根据其他分子的实验数据对它们进行估算。特别是考虑到它们在结晶和蒸馏过程中的重要性，研究熔点和沸点、密度、粘度等性质具有重要意义。这项工作旨在利用基团贡献策略结合机器学习技术，研究多种大麻素和萜类化合物的熔点。其基本思想是，当使用基团贡献法时，数据库中的所有分子都被划分为基团，以便建立代数方程组。最后，使用优化方法来最小化预测值与实验数据之间的误差。性质估算中已针对不同目的提出了几种贡献方法。最好的方法之一是由Joback和
    Reid（1987）提出的，该方法能够估计临界点、熔点温度和正常沸点，它通常适用于相对简单的分子，并基于41种分子。此外，Constantinou和Gani（1994）对纯有机化合物的临界性质进行了估算，由于其复杂性，其有望比Joback的方法更好，因为估算是在两个水平进行的：使用一阶基团的基础级，以及使用一组二阶基团近似的高级，以一阶基团为构建模块。预测（第一阶和二阶近似）基于化合物的分子结构，其他其他研究还将基团贡献法与人工神经网络统一。最近，Valderrama等（2015）创建了这种用于估算离子液体密度的混合方法。为此，使用包含100种离子液体的399个实验数据库进行网络训练。为了区分不同，将分子的质量和结构作为输入变量。此外，提出的……（此处原文截断）


