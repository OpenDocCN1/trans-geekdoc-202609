    ($R^2$)，Hortúa 等人 (2020)：


    ```

    $R^2 = 1 - \frac{\sum(y_i-\hat{y}_i)^2}{\sum(y_i-\bar{y})^2}$

    ```


    其中 $y$ 是真实参数的平均值，求和是在整个测试集上进行的。$R^2$ 的范围从 0 到 1，其中 1 代表完美的推理。在本工作中，$R^2$ 将作为衡量神经网络（NN）模型性能的指标。最后，标准神经网络的缺点是它们对训练过程和超参数选择敏感，每次训练都会找到不同的权重集，这可能会产生不同的预测结果和高方差。减少方差的一种方法是训练多个模型而不是单个模型，并结合这些模型的预测结果。这被称为集成学习，它有助于减少预测的方差并能获得更好的性能，Tao
    (2019)。


    ## 3. 分析


    为了根据已建立的化学基团预测熔点，我们从单神经网络回归模型开始。首先，我们在 TensorFlow 中构建了一个 FNN，它包含若干具有 256、128、64
    和 1 个神经元的层，随后跟一个 ELU 激活函数、用于优化和加速收敛的批量归一化（Batch Normalization），以及用于正则化目的 Dropout
    层（速率为 0.1）。在这里，我们采用 Adam 作为优化器，初始值为 0.01 的层衰减，每隔 10 个轮次（epochs）因子为 0.08。另一方面，Conv1D
    架构由四个 64、32、32、16 神经元的卷积层组成，然后使用最大池化层（MaxPooling）来减少特征图的特征，随后是四层 256、126、64 和
    1 个神经元的层。在此之前，每层后后跟一个 ELU 激活函数、批量归一化和 Dropout（速率 0.1）。


