- "# CCISO 认证首席信息安全官：全方位式考试指南\n\n\n\n\n\n# 关于作者\n\n`Steven Bennett` 拥有 CCISO、CISSP、CISA\
  \ ，是一位工程师、运动员、企业家和顾问。他在信息技术领域工作了 40 多年，帮助机构保护其最重要资产免受犯罪威胁。Steve 一生都在研究复杂系统中的人类和动物行为、捕食者与猎物之间的关系，以及在商业和自然界观察到的攻击性和防御生存策略与战术。Steve\
  \ 的信息安全咨询职业包括为医疗保健、制造业、零售、金融、军事和政府提供支持。\n\n`Jordan Genung` 拥有 CCISO、CISSP、CISM、CISA\
  \ ，曾担任公私部门机构的信息安全官和安全顾问。他的经验包括为财富 500 强企业和政府机构提供安全咨询、构建信息安全计划以及开发信息安全课程。Jordan 拥有德克萨斯大学圣安东分校的计算机科学和信息安全学位，该校是国家安全局（NSA）和国土安全部（DHS）的网络运营、网络防御和研究国家学术卓越中心。\n\
  \n## 关于技术编辑\n\n`Michael Lester` 在信息安全行业工作了 20 多年，目前是 WindTalker Inc.（以数据为中心的安全加密软件制造商）的首席技术官（CTO）。此前，Mike\
  \ 是 Shon Harris Logical Security LLC（现为 Human Element LLC）的首席讲师和顾问，在那里教授并开发了关于 CISSP、黑客/渗透测试、数字取证/电子发现、CISA\
  \ 等课程。Mike 还为 LinkedIn Learning 编写并教授课程。他拥有波士顿大学（国家安全局 [NSA] 学术卓越中心）的信息系统安全硕士学位，以及\
  \ 20 多行业认证，包括 CISSP、CISA、CCE、Security+、MCSE:Security、CCSE+ 和 ITIL。\n\n\n\n\n\n\n\
