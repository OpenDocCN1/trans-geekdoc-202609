  \ 隐私保护\n\n## NIST Cybersecurity Framework\n\n核心框架由五个功能组成：识别、保护、检测、响应和恢复。每个功能由类别（控制）组成，类别由子类别（控制）和引用组成。\n\
  \n## Implementation Tiers\n\n实施分层从部分（Tier 1）、风险知情（Tier 2）、可重复（Tier 3）到自适应（Tier 4）。虽然分层看起来是成熟度水平，但它们是为了沟通风险偏好。\n\
  \n## Profiles\n\n配置文件代表组织将其资源、需求和风险偏好与核心结果对齐。\n\n## Federal Information Processing\
  \ Standards\n\n*联邦信息处理标准 (FIPS)* 是 NIST 发布的用于联邦信息安全的标准的和指南。并非所有 FIPS 出版对联邦机构都是强制性的。每个\
  \ FIPS 文档的“适用性”部分指示了标准是否适用以及强制。此外，FIPS 对于与联邦政府开展业务的承包商和供应商也是强制性的。\n\n机构根据 FISMA\
  \ 强制执行 FIPS。以下是目前的 FIPS：\n\n• `FIPS 140-2` 密码模块安全要求\n• `FIPS 180-4` 安全哈希标准 (SHS)\n\
  • `FIPS 186-4` 数字签名标准 (DSS)\n• `FIPS 197` 高级加密标准 (AES)\n• `FIPS 198-1` 密钥哈希消息认证码\
  \ (HMAC)\n• `FIPS 199` 联邦信息和信息系统安全分类标准\n• `FIPS 200` 联邦信息和系统的最低安全要求\n• `FIPS 201-2`\
  \ 联邦员工和承包商个人身份验证 (PIV)\n• `FIPS 202` SHA-3 标准：基于排列的哈希和可扩展输出函数\n\n\n\n\n\n`NIST Special\
  \ Publication (SP)` 是由 NIST 发布的文档，通常用于支持 `FIPS` 出版物或作为 NIST 在 `FISMA` 规定的责任的一部分而开发。`NIST\
  \ SP 800 系列` 是专门针对计算机安全的出版物。许多私营部门组织在开发其安全计划和策略时都会 `NIST SP 800 系列` 文档。以下是 `NIST\
  \ SP 800 系列` 中一些常用的标准列表：\n\n• `NIST SP 800-18` 联邦信息系统安全计划制定指南\n• `NIST SP 800-30`\
  \ 风险评估指南\n• `NIST SP 800-34` 联邦信息系统应急计划指南\n• `NIST SP 800-37` 信息系统和组织风险管理框架\n• `NIST\
  \ SP 800-39` 管理信息安全风险\n• `NIST SP 800-40` 企业补丁管理技术指南\n• `NIST SP 800-53` 联邦信息系统和组织的安全与隐私控制\n\
  • `NIST SP 800-53A` 联邦信息系统和组织的安全与隐私控制评估\n• `NIST SP 800-55` 信息安全性能测量指南\n• `NIST\
  \ SP 800-60` 信息类型和信息系统映射安全类别的指南\n• `NIST SP 800-61` 计算机安全事件处理指南\n• `NIST SP 800-66`\
  \ 执行健康保险流动性与责任法（HIPAA）安全规则介绍资源指南\n• `NIST SP 800-70` IT 产品国家清单计划\n• `NIST SP 800-88`\
  \ 媒体净化指南\n• `NIST SP 800-114` 远程办公和自带设备（BYOD）安全用户指南\n• `NIST SP 800-122` 个人身份信息（PII）保护性保护指南\n\
  • `NIST SP 800-124` 企业移动设备安全管理指南\n• `NIST SP 800-125` 全虚拟化技术安全指南\n• `NIST SP 800-137`\
  \ 联邦信息系统和组织的信息安全持续监控（ISCM）\n• `NIST SP 800-160` 系统安全工程\n• `NIST SP 800-171` 非联邦系统和组织中的受控未分类信息保护\n\
  • `NIST SP 800-181` 网络安全教育国家倡议（NICE）网络安全工作人员框架\n\n800 系列涵盖了广泛的主。特定的 `NIST SP` 将后续章节中进行深入讨论。\n\
  \n## 隐私护盾 (Privacy Shield)\n\n欧盟-美国和瑞士-美国`隐私护盾`框架的存在是为了监管从欧盟和瑞士向美国的个人信息交换。这些框架由美国商务部联合欧盟委员会和瑞士政府共同开发，目标是让美国公司能够在遵守欧盟隐私法的同时，从欧盟接收个人数据。如要加入欧盟-美国或瑞士-美国`隐私护盾`框架，组织需要进行自认证并公开承诺遵守`隐私护盾`原则。一旦公司完成自认证，该承诺根据美国法律即具有执行力。商务部在\
  \ `https://www.privacyshield.gov/list` 维护一份已自认证美国组织的公开名单。\n\n截至本文编写，`隐私护盾`由 7 个原则和\
  \ 16 个补充原则组成，列在 `https://www.privacyshield.gov/eu-us-framework` 中如下：\n\n### 原则：\n\
  • 通知\n• 选择\n• 向转传输的责任\n• 安全\n• 数据完整性与目的限制\n• 访问\n• 救济、执法与责任\n\n### 补充原则：\n• 敏感数据\n\
  • 新闻例外\n• 次要责任\n• 履行尽职调查和进行审计\n• 数据保护机构的角色\n• 自认证\n• 验证\n• 访问\n• 人力资源数据\n• 转传输强制合同\n\
  • 纠纷解决与执法\n• 选择 – 退出时机\n• 旅行信息\n• 药品和医疗产品\n• 公记录和可用信息\n• 公共机构的访问请求\n\n### COBIT\n\
  \n`信息和相关技术控制目标 (COBIT)` 是由 ISACA 和 IT 治理学院开发的 IT 治理和管理最佳实践框架。本文当时的最新版本是 `COBIT 2019`。`COBIT\
  \ 2019` 由五个治理和管理领域组成，如`图 1-19`所示。这些领域由 40 个目标组成。\n\n```\nFigure 1-19 governance\
  \ and management objectives\n```\n\n`COBIT 2019` 的核心出版物可以通过 `http://www.isaca.org/resources/cobit`\
  \ 付费获取。出版物包括：\n• `COBIT 2019 框架：引言与方法论`\n• `COBIT 2019 框架：治理与管理目标`\n• `COBIT 2019\
  \ 设计指南：设计信息和技术治理解决方案`\n• `COBIT 2019 实施指南：实施和优化信息和技术治理解决方案`\n\n## 信息安全趋势与最佳实践\n\n\
  本节为信息安全专业人员提供了多个安全趋势和信息安全最佳实践的信息来源。许多组织致力于提供资源以改进信息安全行业。本节未对这些组织进行全面调查，但介绍了一些较著名的安全最佳实践组织。这些组织为社区提供了系列利益，包括工具和安全最佳实践资源。对于\
  \ `CISO` 来说，了解这些最佳实践组织既作为资源，也是为了保持行业更新非常重要。\n\n### 开源应用安全项目 (OWASP)\n\n`开源应用安全项目\
  \ (OWASP)` 是一个国际组织，致力于使组织具备技能和工具来规划、开发、获取、运行和维护安全应用程序。`OWASP` 开发工具、指南和最佳实践文档，并组织侧于应用程序安全的会议。关于应用程序安全的更多信息请见第\
  \ 4 章。\n\n### 云安全联盟 (CSA)\n\n`云安全联盟 (CSA)` 是一个非营利组织，致力于促进云计算使用和采用的最佳实践。`CSA` 提供关于云云安全、治理和合规的工具、研究、框架和最佳实践文档。`云安全联盟`提供云安全以及云治理合规的培训，并对以下内容提供认证：\n\
  • `云安全知识证书 (CCSK)`\n• `云审计知识证书 (CCAK)`\n\n### 互联网安全中心 (CIS)\n\n\n\n\n\n`互联网安全中心\
  \ (CIS)` 是一个致力于为信息安全开发最佳实践工具、框架和资源的非营利组织。CIS 开发了 `CIS 控制措施`和`CIS 安全基准`，这些是信息安全最佳实践的全球标准。这些标准在第\
  \ 2 章和第 4 章中有更深入的介绍。CIS 还托管了`多州信息共享与分析中心 (MS-ISAC)`和`选举基础设施信息共享与分析中心 (EI-ISAC)`。这些信息共享与分析中心为州、地方、领土和部落政府提供关键资源和折扣服务。\n\
  \n## 信息安全培训与认证\n\n本节涵盖了部分广为人知的非厂商厂商中立信息安全认证机构。这些认证机构为社区提供了一系列福利，包括论坛、会议、人际网络机会和安全最佳实践资源，以及用于持续学习的认证和培训。对于首席信息安全官（CISO）来说，关注持续学习的机会以为自己和团队识别培训机会至关重要。\n\
  \n## 国际信息系统安全认证联盟\n\n`国际信息系统安全认证联盟 (ISC)`²是一个专门为信息安全专业人员提供认证和培训的非营利组织。(ISC)²定期组织会议，提供研究和最佳实践材料，并提供多种认证和培训计划。(ISC)²\
  \ 的认证包括：\n\n• 认证信息系统安全专业人员 (CISSP)\n• 信息系统安全架构专业人员 (CISSP-ISSAP)\n• 信息系统安全工程专业人员\
  \ (CISSP-ISSEP)\n• 信息系统安全管理专业人员 (CISSP-ISSMP)\n• 系统安全认证执业人员 (SSCP)\n• 认证云安全专业人员\
  \ (CCSP)\n• 认证授权专业 (CAP)\n• 认证安全软件生命周期专业人员 (CSSLP)\n• 医疗信息安全与隐私从业人员 (HCISPP)\n\n\
  ## ISACA\n\n`ISACA`（原名为信息系统审计与控制协会）是一个旨在促进信息安全、保证、风险管理和治理领域发展的非营利专业协会。ISACA 为成员提供访问最佳实践框架、文档、会议和培训计划的渠道。ISACA\
  \ 最可能因开发了此前讨论过的 `COBIT` 而广闻名。ISACA 为以下领域提供培训和认证：\n\n• 认证信息系统审核师 (CISA)\n• 认证风险与信息系统控制\
  \ (CRISC)\n• 认证信息安全经理 (CISM)\n• 认证企业 IT 治理 (CGEIT)\n• 网络安全枢纽 (CSX)\n\n## 国际电子商务顾问委员会\n\
  \n`国际电子商务顾问委员会 (EC-Council)`是一个专业安全组织，提供各种 IT 安全主题的培训和认证。EC-Council 是 `认证首席信息安全官\
  \ (CCISO)` 认证的颁发机构。EC-Council 还运营着若干场安全会议以及 `EC-Council 大学 (ECCU)`。EC-Council 提供的某些认证包括：\n\
  \n• 认证伦理黑客 (CEH)\n• 认证网络防御者 (CND)\n• EC-Council 认证安全分析师 (ECSA)\n• EC-Council 认证安全专家\
  \ (ECSS)\n• EC-Council 认证加密专家 (ECES)\n• 认证安全计算机用户 (CSCU)\n• EC-Council 灾难恢复专家 (EDRP)\n\
  • 计算机黑客法调查员 (CHFI)\n• EC-Council 认证事件处理人员 (ECIH)\n• 认证首席信息安全官 (CCISO)\n• 认证应用安全工程师\
  \ (CASE)\n• 认证威胁情报分析师 (CTIA)\n• 认证 SOC 分析师 (CSA)\n\n### SANS 学院\n\n`SANS 学院`正式名称为高级技术学院，是一个信息安全培训和认证机构。SANS\
  \ 提供多种资源，包括培训/认证、会议、网络研讨会、文章和其他资源，以帮助安全专业人员。SANS 以其实操培训而闻名。SANS 代表`管理员、审计、网络与安全\
  \ (SysAdmin, Audit, Network, and Security)`，代表了其认证和培训涵盖的主题范围。以下是若干 SANS 认证列表：\n\n\
  • 安全基础 (GSEC)\n• 认证事件处理人员 (GCIH)\n• 电子取证分析师 (GCFA)\n• 渗透测试 (GPEN)\n• 认证入侵分析师 (GCIA)\n\
  • Web 应用渗透测试 (GWAPT)\n• 认证法医取证 (GCFE)\n• 安全领导力 (GSLC)\n• 恶意软件逆工程 (GREM)\n• 信息安全基础\
  \ (GISF)\n• 认证企业防御者 (GCED)\n• 系统审计师 (GSNA)\n• 网络安全专业人员 (GICSP)\n• Windows 安全管理员\
  \ (GCWN)\n• 持续监控 (GMON)\n• 网络取证分析 (GNFA)\n• 高级渗透测试 (GXPN)\n• 边界分析师 (GPPA)\n• 网络威胁情报\
  \ (GCTI)\n• Python 程序员 (GPYC)\n• 数据安全法律与调查 (GLEG)\n• 战略规划、政策与领导力 (GSTRT)\n• 手机取证\
  \ (GASF)\n• 工业防御 (GRID)\n• 探测分析师 (GCDA)\n• .NET 安全程序员 (GSSP-.NET)\n• 高级威胁 (GDAT)\n\
  • 项目经理 (GCPM)\n• 安全专家 (GSE)\n• 关键基础设施保护 (GCIP)\n• 安全架构 (GDSA)\n• 企业漏洞评估师 (GEVA)\n\
  \n## 计算技术协会\n\n`计算技术协会 (CompTIA)` 是一个非营利组织，致力于通过培训和认证为信息安全和技术行业提供持续培训。除了培训之外，CompTIA\
  \ 还会发布研究以跟踪行业趋势和变化。以下是 CompTIA 的认证列表：\n\n• CompTIA IT  (ITF+)\n• CompTIA A+ (A+)\n\
  • CompTIA 网络+ (Network+)\n• CompTIA 安全+ (Security+)\n• CompTIA 云+ (Cloud+)\n• CompTIA\
  \ Linux+ (Linux+)\n• CompTIA 服务器+ (Server+)\n• CompTIA 网络安全分析 (CySA+)\n• CompTIA\
  \ 高级安全从业者 (CASP+)\n• CompTIA 渗透测试+(PenTest+)\n• CompTIA 项目+ (Project+)\n• CompTIA\
  \ 认证技术培训师 (CTT+)\n• CompTIA 云基础+(Cloud Essentials+)\n\n## 国际隐私人士协会\n\n`国际隐私人士协会\
  \ (IAPP)` 是一个非营利组织，致力于为隐私专业人士提供社交、获取资源和追求隐私认证的论坛。IAPP 的认证包括：\n\n• 认证隐私专业人员/亚洲 (CIPP/A)\n\
  • 认证隐私专业人员/加拿大 (CIPP/Canada)\n• 认证隐私专业人员/欧洲 (CIPP/E)\n• 认证隐私专业人员/美国私营部门 (CIPP/US)\n\
  \n\n\n\n\n- 认证信息隐私管理师 (CIPM)\n- 认证信息隐私技术专家 (CIPT)\n\n## 攻击安全 (Offensive Security)\n\
  \n`Offensive Security` 是一家专注于为安全社区提供专业渗透测试服务、培训、认证和工具的安全公司。他们的课程侧重于实战渗透测试和道德黑客。`Offensive\
  \ Security` 开发了 `Kali Linux` 发，其中预装了渗透测试和取证工具。他们的认证计划包括：\n\n- 攻击安全认证专业人士 (`OSCP`)\n\
  - 攻击安全认证专家 (`OSCE`)\n- 攻击安全 Web 专家 (`OSWE`)\n- 攻击安全无线专业人士 (`OSWP`)\n- 攻击安全利用专家 (`OSEE`)\n\
  \n## 伦理\n\n组织伦理是规范组织行为的原则，重点在于诚信、问责和负责任。伦理始于个人员工的道德指南。然而，公司和组织不能总是信任员工会做正确的事。因此，许多组织建立了伦理准则、伦理政策和伦理计划。这为董事会、高管、员工以及整个组织的预期行为设定了基调。伦理倡议有时与组织的合规倡议挂钩，是内部合规的重点。最终，组织伦理应当超越单纯的分发行为准则，进化到创造一种透明、诚信、社会责任和良好治理的文化。\n\
  \n`CISO` 通常不负责整个公司或组织的伦理行为。然而，`CISO` 和安全组织的许多伦理决策会影响整个公司。因此，`CISO` 与董事会及领导层必须对伦理政策、标准和决策进行良好的协调。\n\
  \n`CISO` 负责其自身及其所属信息安全组织的伦理行为。`CISO` 必须为信息安全计划和人员设定伦理标准。`CISO` 的角色特别是一个在组织内培养信任和公信力的角色。\n\
  \n伦理有时从相关利益相关者的角度考虑。通常，利益相关者包括员工、客户和所有者/股东。这些利益相关者是伦理行为的接收者或受益者。以下是伦理影响信息安全运营以及\
  \ `CISO` 角色的的一些示例：\n\n- 在进行漏洞和渗透测试时，信息安全人员在某个商业产品中发现了一个此前未知的安全漏洞。在这种情况下，安全专业人员没有法律义务向产品制造商报告该漏洞。然而，向制造商报告该漏洞是负责任的做法。在这种情况下，伦理在员工的行为中发挥了作用。\n\
  \n- 安全人员认为客户数据可能已经泄露，但他们并不确定。是否应该通知客户？这是一个不应在现场做出的伦理决策——应该有遵循的政策和指南来处理此类的情况。\n\n\
  - 政府机构要求组织披露与客户相关的信息。如果你的组织法律上并不要求遵守，是否仍然应该这样做？在这种情况下，伦理责任是什么？对于哪方利益相关者：客户还是政府机构？\n\
  \n`CISO` 应该在安全职能部门定义并实施伦理计划，类似于组织的合规计划，以确保伦理得到良好管理，并且员工和公司的行为符合组织的目标。伦理计划应包含以下组件：\n\
  \n- 为信息安全组织内部的伦理行为标准\n- 定义与伦理相关的政策、标准和指南\n- 为信息安全人员进行伦理培训\n- 评估计划的绩效和有效性\n- 通过将教训应用到伦理计划各个方面的改进中，维护并提高伦理表现\n\
  \n`CCISO` 候选人应当了解 `EC-Council` 伦理守则（`https://www.eccouncil.org/code-of-ethics/`），该守则适用于\
  \ `EC-Council` 认证持有者成员。在成为 `CCISO` 的过程中，候选人必须同意并遵守 `EC-Council` 伦理守则。该守则概述了作为信息安全专业人员的特定行为要求。\n\
  \n## 章节回顾\n\n组织治理是从上而下对组织战略、组织结构和权限路线的定义。同样，信息安全治理是对信息安全计划目标和组织的定义。为了保持一致，公司治理和信息安全治理都必须考虑外部和内部驱动因素。\n\
  \n信息安全计划的构建应确保机密性、完整性和可用性 (`CIA`) 三要素的三个方面都能满足，并采取深度方法来实现安全与成本之间的正确平衡。信息安全计划通常包含以下元素：\n\
  \n- 安全计划规划\n- 安全策略、标准和指南\n- 安全风险管理\n- 资产安全\n- 身份和访问管理\n- 安全工程\n- 物理安全\n- 安全运营\n\
  - 软件开发安全\n- 安全评估与测试\n- 安全培训与意识\n- 业务连续性与灾难恢复\n\n业务结构的形式包括独资企业、合伙企业、公司和 `LLCs`。这些业务形式在发生安全漏洞或事件时，为公司人员提供某种形式的责任保护。然而，只有当领导者履行其尽责义务并在做出信息安全相关决策时遵循商业判断规则时，这种保护才能实现。\n\
  \n### 快速回顾\n\n- 将组织的安全计划与组织的业务和运营对齐，是其安全计划成功的关键，也是 `CISO` 角色的核心。\n- 治理是问责、决策授权和监督。适当的治理确保了组织的战略与其业务、监管环境和运营环境保持一致。\n\
  - 信息安全治理是降低组织信息安全风险的框架。\n- 塑造信息安全计划的外部驱动因素包括监管驱动因素、行业实践以及风险和威胁。\n\n\n\n\n\n# 信息安全计划基础\n\
  \n- 塑造信息安全计划的内部驱动因素包括领导层的理解与感知、组织结构、文化与氛围、历史以及经验教训。\n- 信息安全的基本原则是机密性、可用性和完整性。\n\
  - `vulnerability`（漏洞）是一个可能被利用的弱点。\n- `threat`（威胁）是任何与利用 `vulnerability` 关联的潜在危险。\n\
  - `risk`（风险）是威胁主体利用 `vulnerability` 的可能性以及相应的业务影响。\n- `exposure`（暴露）是指暴露于威胁导致损失的实例。漏洞可能会使组织遭受可能的损害。\n\
  - 实施 `countermeasure`（应对措施）或 `control`（控制）是为了缓解潜在风险。\n- 深度防御是一种概念，即组织不应依赖某一种控制措施来保护，而应该使用多层控制措施来增加潜在攻击者的工作量。\n\
  - 风险管理是识别和评估风险、将其降低到可接受的水平并实施正确的机制以维持该水平的过程。\n- 组织使用定性或定量方法来分析风险。\n- 安全计划通常包含一系列管理安全指令（策略、标准、指南），这些指令构成了计划人员遵循的规则和实践库。\n\
  - 资产安全是识别组织拥有哪些资产并确定每种资产适用何种控制措施的概念。\n- 访问控制是控制用户和系统如何与其他系统及资源通信和交互的安全特性。\n- 安全工程是一个广大的领域，涉及信息系统的安全设计和实现。\n\
  - 安全运营侧重于积极执行日常功能，以防止、检测和响应安全风险与威胁。\n- 软件开发必须以确保其不包含安全漏洞的方式进行。\n- 所有安全计划必须包含持续评估和测试组件，以进行漏洞测试，并确保漏洞修复活动的成功执行和管理。\n\
  - 所有员工都应该了解组织的安全策略和流程，以及通用的安全实践。\n- 每个组织都应该建立计划和程序，以确保在发生安全漏洞或其他灾难时业务能够继续运行。\n-\
  \ 信息安全组织的规模应根据组织对风险的容忍度决定。\n- 安全组织结构应具备以下要素：清晰的权限体系、态势感知以及内外部通信与报告。\n- 合规性是一种治理方法，旨在确保符合相关的法律、法规、标准、组织政策、道德行为和其他业务目标。\n\
  - 合规并不一定意味着组织是安全的，而良好的安全计划也不一定是合规的。\n- 合规团队通常参与提供内部策略和流程的指导，并评估当前的流程和技术以确定改进合规性的方法。\n\
  - 合规管理是组织计划、实施和维护支持合规活动的过程。\n- 隐私表示个人预期对其自身敏感数据所拥有的控制水平。\n- `FISMA`（联邦信息安全现代化法案）要求联邦机构建立、记录并实施安全措施。\n\
  - 1996 年的《克林格-科恩法案》（Clinger-Cohen Act）是一部关注技术采购和使用的美国法律。\n- `GLBA`（格雷姆-莱奇布莱利法案），又称\
  \ 1999 年《金融服务现代化法》，要求金融机构保护非公开信息。\n- `HIPAA`（健康保险可携带性与责任法案）是一项关注受保护健康信息的美国法规。\n\
  - `FERPA`（1974 年《家庭教育权利与隐私法案》）是一部关注保护教育记录的美国法律。\n- `SOX`（2002 年萨班斯-奥克斯利法案）是一部关注让董事成员和高管对财务报表负责的美国法律。\n\
  - 组织道德是规范行为的原则。\n\n## 问题\n\n1. 下列哪个判断安全计划是否支持业务目标的最佳方法？\nA. 确定安全计划\nB. 确定安全计划的人员是否充足\n\
  C. 确定安全计划是否利用了人员\nD. 确定安全计划是否能够改变\n\n2. 下列哪项已被破坏？\nA. 完整性\nB. 可用性\nC. 机密性\nD. 可用性和机密性都是\n\
  \n3. 下列哪项最正确？\nA. 应对措施通常旨在减少威胁。\nB. 风险、威胁和暴露通常是相同的。\nC. 漏洞是管理不善的结果。\nD. 应对措施是为了缓解风险而实施的控制措施。\n\
  \n4. CISO 定义组织实现其目标的规则。哪种文档或文档集是实现此点的最佳机制？\nA. 安全计划\nB. 安全策略\nC. 安全指南\nD. 安全标准\n\
  \n5. 在定义安全计划的组织结构时，下列哪项最重要？\nA. 确保 CISO 直接向 CEO 汇报\nB. 显示清晰的权限体系\nC. 使用矩阵组织以确保态势感知\n\
  D. 组织的规模与行业内其他公司相似\n\n6. 下列法律专门关注受保护健康信息的处理？\nA. GLBA\nB. SOX\nC. HIPAA\nD. FISMA\n\
  \n7. 一个接受在线支付的电子商务网站正在扩张，并聘请了一个 CISO 来确保组织符合行业法规和标准。对于 CISO 而言，以下哪个框架在确保合规性方面最重要？\n\
  A. SOX\nB. FISMA\nC. ISO/IEC 27001\nD. PCI DSS\n\n8. 一个组织有业务需求接收来自欧盟公民的个人数据，并需要\
  \ CISO 就如何遵守欧盟隐私法提供指导。为了满足这一要求，CISO 从以下哪个框架开始比较好？\nA. 隐私盾 (Privacy Shield)\nB. FISMA\n\
  C. FIPS\nD. SOX\n\n9. 一个组织正在寻找保护其 应用程序的最佳实践指南。以下哪个组织将是该组织的最佳资源？\nA. CSA\nB. OWASP\n\
  C. CIS\nD. IAPP\n\n\n\n\n\n# 10. 一家上市公司在业务运营过程中收集持卡人数据。该组织的 CEO 意识到信息安全的重要性并聘请了一首席信息安全官（CISO）。CISO\
  \ 必须确保业务符合以下哪些规定？\n\n**A.** GDPR 和 FISMA\n**B.** PCI DSS 和 GDPR\n**C.** PCI DSS\
  \ 和 SOX\n**D.** GDPR 和 SOX\n\n## 答案\n\n1. **A.** 虽然这些答案中的许多可能表明信息安全计划与业务目标的一致性，但确定信息安全策略是否支持业务目标最佳方法是检查信息安全计划或章程与管理策略的一致性。\n\
  2. **A.** 当仅允许授权的更改时，系统的完整性就能维持。在这种情况下，学生未被授权修改自己的成绩。\n3. **D.** 实施对措施是为了降低潜在风险。对措施也称为控制（controls），是指设备、配置或产品等功能，它们减少了漏洞被利用的概率。\n\
  4. **B.** 安全策略定义了必须遵守的硬性规则。安全计划计划描述了整体安全计划和组织结构，而指南和标准是支持性文档，虽然很重要但并不定义要求。\n5. **B.**\
  \ 组织应该优先建立清晰的权限体系。只要沟通良好，CISO 并不总是需要向 CEO 报告。矩阵型组织只是几种可行方法之一。组织的规模应根据其对风险的承受能力来确定，而不是与其他公司进行比较。\n\
  6. **C.** 《健康信息流动与责任法案》（HIPAA）是一项美国联邦法规，专门关注受保护健康信息（PHI）的处理。HIPAA 为保护健康信息的安全和隐私提供了框架。HIPAA\
  \ 的规则适用于涵盖实体和业务伙伴者。\n7. **D.** 支付卡行业数据安全标准（PCI DSS）是一个侧重于信用卡信息保护的控制框架。`PCI DSS`适用于任何处理持卡人数据的组织。\n\
  8. **A.** 欧盟-美国和瑞士-美国隐私盾框架的存在是为了监管从欧盟和瑞士向美国的个人信息交换。隐私盾的目标使美国公司能够在遵守欧盟隐私法律的同时接收来自欧盟的个人数据。\n\
  9. **B.** 开源应用程序安全项目（OWASP）是一个国际组织，致力于为组织提供技能和工具，以规划、开发、获取、运营和维护安全应用程序。OWASP 开发工具、指南、最佳实践文档，并组织关注应用程序安全的会议。\n\
  10. **C.** CISO 必须确保组织符合 `PCI DSS` 和 `SOX`。萨班斯-奥克斯法案（`SOX`）适用于在美国开展业务的所有上市公司。支付卡行业数据安全标准（`PCI\
  \ DSS`）适用于任何处理持卡人数据的组织。由于该组织既是上市公司又处理持卡人数据，因此该组织必须符合这两项规定。\n\n# 第 2 章\n\n## 信息安全控制、合规性与审计管理\n\
  \n本章讨论了以下主题：\n\n* 信息安全控制\n* 信息安全控制生命周期框架\n* 信息安全控制生命周期\n* 探索信息安全控制框架\n* CISO 审计\n\
  \n[第 1 章]引入了风险管理概念，在该概念中，组织对整个企业进行风险分析，以理解每个资产对业务的重要性。资产是指信息系统、设施、数据或用于支持运营的任何组件（硬件、软件或数据）。本章探讨了组织如何为特定资产选择并审计安全控制。`Security\
  \ controls`是为了应对风险而实施的流程或技术。实施强密码策略、对静态数据进行加密以及使用日志记录事件只是安全控制的几个例子。对于特定的信息系统或资产，可能会实施数百种控制措施。组织可以开发自己的控制定义；然而，一种更简单且资源消耗较少的方法是使用现有的行业标准框架，这些框架提供了控制库以及如何选择控制的指南。框架通常以类似的方式使用，并遵循相同的流程：\n\
  \n1. 第一步是使用定义的类别对资产或系统进行分类。通常，这些类别是根据对资产的安全特性的（机密性、可用性和完整性）进行评分来定义的，评分可能分为低、中、高。\n\
  2. 根据资产的类别，选择相应的安全控制措施集以实现安全。框架通常提供了一种将类别映射到建议控制列表的方法。\n3. 有时组织会根据其特定需求以及运营和业务环境对框架建议的控制措施集进行剪裁。\n\
  4. 一旦选定了控制措施，就会在资产的整个生命周期内，对其进行实施、评估、审计和监控。\n\n本章探讨了安全控制、安全控制生命周期、通用的安全控制框架以及控制审计。\n\
  \n## 信息安全控制\n\n本节介绍了信息安全控制的基础细节，包括控制类别、控制功能和控制框架类型。\n\n### 控制基础\n\n安全控制，也称为保护措施或对措施，是一种用于降低风险并保护资产机密性、完整性和可用性（`CIA`）的机制。本节回顾了控制类别和控制功能的基础术语。\n\
  \n#### 控制类别\n\n控制可以被分为`类别`，其名称取决于所使用的框架。在实践中，常用的三个类别是`管理`、`技术`和`物理`。然而，NIST 使用的是另一组类别：`管理`、`运营`和`技术`。不同的组织使用不同的术语。以下是常用术语的描述：\n\
  \n* **管理**：面向管理的控制，例如策略、程序、指南、培训、风险管理和人事实践（招聘、解雇等）。管理控制也被称为软控制或管理控制。\n* **技术**：提供安全控制功能的硬件或软件组件。示例包括加密、密码强制、多因素身份认证、入侵检测系统（`IDS`）、入侵预防系统（$IPS`）和防火墙。技术控制也被称为逻辑控制。\n\
  * **物理**：为了保护人员、资产和设施不受物理威胁而的实体控制。这包括保护人员、资产和设施。示例包括围栏、照明、锁具、护柱、机房门、警报器和安保人员。\n\n\
  \n\n\n\n正如之前所述，NIST 定义了另一组不同的类别。FIPS 200——《联邦信息和信息系统的最低安全要求》以及 NIST SP 800-53 Rev.\
  \ 3——《联邦信息系统和组织的安全与隐私控制》（及其之前的版本）使用了 `management`（管理）、`operational`（运营）和 `technical`（技术）控制类。NIST\
  \ 对这些类别的定义如下：\n\n*   **Management (管理)**：针对信息系统的安全控制（即保护措施或应对措施），侧重于风险管理和信息系统安全管理。\n\
  *   **Operational (运营)**：针对信息系统的安全控制（即保护措施或应对措施），主要由人员（而非系统）实施和执行。\n*   **Technical\
  \ (技术)**：针对信息系统的安全控制（即保护措施或应对措施），主要由信息系统通过其硬件、软件或固件组件中包含的机制实施和执行。\n\n通用控制类（管理、技术和物理）与\
  \ NIST 控制类（`management`、`operational` 和 `technical`）之间并不是一一一的映射关系，技术类除外。某些控制（例如风险管理）既是管理控制也是管理控制。其他控制（例如员工离职）既是管理控制也是运营控制。\n\
  \n表 2-1 显示了 NIST SP 800-53 安全控制类及其对应的控制族。`control family`（控制族）是一组通常处理相同安全领域或功能的控制措施。例如，处理访问控制的控制位于\
  \ NIST SP 800-53 的访问控制 (AC) 族。EC-Council 的观点是，CCISO 候选人应该熟悉表中所示的映射。然而，NIST SP 800-53\
  \ 的最新版本（Rev. 4）并不包含这种映射，因为在实践中，一个控制族中的许多控制会映射到多个控制类类。\n\n![Images](img/p73.jpg)\n\
  \n**Table 2-1** NIST SP 800-53 控制类及相应的控制族\n\n![Images](img/exam.jpg)\n\n**考试贴士**\
  \ CCISO 候选人应熟悉 NIST 控制类和控制族。\n\n## 控制功能\n\n管理、技术和物理这些术语指的是控制的类别，而不是控制是如何运行和作用的。安全控制可以根据其组成和功能进行划分。控制的安全功能描述了控制为组织做了什么。控制的功能包括以下几种：\n\
  \n*   **Preventive (预防性)**：此类控制防止或停止不利事件或事故的发生。示例包括强制背景检查、防火墙访问控制列表 (ACLs)、门锁、围栏、护柱和\
  \ IPS（入侵防御系统）。\n*   **Detective (检测性)**：此类控制发现、检测或识别潜在的不良活动、事件、入侵者或事故。示例包括 IDS（入侵检测系统）、安全日志审查、强制休假以及监控摄像头捕获的事件。\n\
  *   **Deterrent (威慑性)**：此类控制威慑或阻碍潜在攻击者实施攻击或参与不当行为。示例包括系统横幅和警告标志。\n*   **Corrective\
  \ (修复性)**：此类控制通过修复系统、流程或活动来纠正已经发生的不利事件。示例包括 IPS、在违规后终止员工、隔离恶意软件的杀病毒软件、使用灭火器灭火以及实施业务连续性计划或事件响应计划。\n\
  *   **Directive (指导性)**：此类控制通常是管理控制，通过指定哪些操作是允许或不允许的来传达预期行为。示例包括安全策略、标准和程序。\n* \
  \  **Recovery (恢复性)**：此类控制将环境或操作恢复到正常功能。它们的功能与修复性控制相似，但被认为具有高级能力。示例包括从备份恢复系统、从受感染系统中移除恶意软件，以及利用可以判断服务已停止并重启它的看门狗进程。\n\
  *   **Compensating (补偿性)**：此类控制作为主控制的替代或次要实施。当由于成本、复杂性或其他业务限制无法实施主控制时，通常使用这些控制。示例包括对无法修补的业务关键应用程序实施网络隔离，以及在确定全职安保人员太贵后安装围栏、锁和报警器。\n\
  \n![Images](img/exam.jpg)\n\n**考试贴士** 一个控制可以与多个控制功能相关。例如，一个 IPS 可以被同时认为是预防性和修复性的，而围栏可以被认为是预防性的又是威慑性的，这取决于上下文以及题目的呈现方式。\n\
  \n### 控制框架\n\n`control framework`（控制框架）是一份控制目录，用于为帮助实施全面的信息安全计划提供基础。控制框架对于评估、计划、实施和记录组织内如何以及实施哪些安全控制非常有用。如果没有控制框架，就需要花费额外的时间精力精力设计控制并开发实施方法论。\n\
  \n### 框架的类型\n\n安全专业人员使用许多不同类型的框架，但有三种基本类型：\n\n*   **Process model (过程模型)**：描述如何实施安全控制（例如\
  \ NIST RMF、ISO/IEC 27001 和 NIST CSF）。\n*   **Determinant (确定性)**：描述要实施什么，例如控制库（例如\
  \ NIST SP 800-53、ISO/IEC 27001/27002、CIS Top 20 和 NIST CSF）。\n*   **Evaluation (评估性)**：描述如何评估实施情况，因此可以用于审计（例如\
  \ NIST SP 800-53A、ISO/IEC 27007 和 ISO/IEC 27008）。\n\n某些框架可能仅包含这些特征之一，而另一些框架可能包含所有三者，或者利用或引用其他框架来实现功能。例如，NIST\
  \ 风险管理框架（过程模型框架）利用了 NIST SP 800-53（确定性框架）和 NIST SP 800-53A（评估性框架）作为生命周期过程的一部分。\n\
  \n![Images](img/exam.jpg)\n\n**考试贴士** 过程模型、确定性和评估这些术语在这里用于讨论和分类不同的控制框架；这些术语可能不会出现在\
  \ CCISO 考试中。\n\n### 选择控制框架\n\n以下是希望利用框架而非从零开始构建的组织常用的控制框架：\n\n*   NIST SP 800-53\n\
  *   NIST 网络安全框架 (CSF)\n*   ISO/IEC 27001/27002\n*   CIS Critical 安全控制/CIS Top 20\n\
  *   CSA 云控制矩阵\n\n这些框架将在本章的后续部分进行详细讨论。\n\n组织根据各种组织驱动因素和因素选择框架，包括：\n\n*   法律和法规\n\
  *   行业垂直（例如美国联邦政府、关键基础设施等）\n*   合规性（例如 PCI DSS、SOX、GDPR 等）\n*   竞争优势（例如 ISO/IEC\
  \ 27001）\n*   框架覆盖范围\n*   安全团队的先验经验（例如对特定框架的熟悉程度或偏好）\n*   其他业务目标或需求\n\n\n\n\n\n\
  例如，在美国联邦政府工作的安全专业人员会在饮食、睡眠和呼吸中都关注 `NIST 风险管理框架`（过程模型）和 `NIST SP 800-53`（确定性框架）。私营部门的安全专业人员可能在使用基于组织行业或合规性要求的框架，或者仅仅因为这是组织之前选择的框架。`CISO`（首席信息安全官）的工作职责之一是评估组织正在使用或考虑的框架，以确定其是否最适合该组织，并能够实现关键业务目标和目的。\n\
  \n## 信息安全控制生命周期框架\n\n安全专业人员通过遵循生命周期来选择正确的控制，该周期通常包括风险评估、设计、实施、评估和监控。使用生命周期框架可以通过定义正式的控制实施过程来帮助组织。在没有定义流程的情况下，控制的实施通常是随意的。这对于小型组织可能可行。然而，随着组织规模的扩大以及其控制需求和环境变得日益复杂，结构化的控制生命周期过程变得变得更加重要。最佳实践是无论组织大小如何，都使用正式的流程。本节探讨了过程模型框架中一些为人知的生命周期。\n\
  \n### NIST 风险管理框架\n\n控制生命周期的一个示例是 `NIST 风险管理框架`（`NIST RMF` 或 `RMF`）。`RMF` 主要供美国联邦政府机构根据\
  \ `FISMA`（在第 1 章中引入）实施控制。`RMF`记录于 `NIST SP 800-37` 中，是一个将风险管理和信息安全集成到安全控制选择和实施过程中的流程。`RMF`\
  \ 是一个循环六步生命周期，并增加了一个准备组件：\n\n`Prepare`\n1. 对信息系统进行分类。\n2. 选择适当的安全控制基准。\n3. 实施并记录安全控制。\n\
  4. 评估安全控制。\n5. 授权信息系统运行。\n6. 监控信息系统中的安全控制。\n\n### NIST 网络安全框架\n\n第 1 章中讨论的 `NIST\
  \ 网络安全框架`（`NIST CSF` 或 `CSF`）是一种基于风险的网络安全框架，最初为关键基础设施设计，但已被许多不同的组织采用。`CSF` 有一套实施该框架的特定方法论，由七步组成：\n\
  \n1. 优先排序和范围确定。\n2. 定向。\n3. 创建当前概要。\n4. 进行风险评估。\n5. 创建目标概。\n6. 确定、分析并优先排序差距。\n7.\
  \ 实施行动计划。\n\n### ISO/IEC 27000\n\n`ISO/IEC 27000` 系列出版物被称为信息安全管理体系（`ISMS`）标准族，使用“计划-执行-检查-处理”（`PDCA`）生命周期作为\
  \ `ISMS` 的部分实施安全控制。\n\n* **计划 (Plan)**：建立 `ISMS`。\n* **执行 (Do)**：实施并运行 `ISMS`。\n\
  * **检查 (Check)**：监控和审查 `ISMS`。\n* **处理 (Act)**：维护和改进 `ISMS`。\n\n# 信息安全生命周期\n\n上一节讨论了几种现有的安全控制生命周期框架。某些组织通过结合多个不同框架和方法论的概念作为其信息安全计划的一部分，定制自己的生命周期。在这里，我们介绍一个源自\
  \ `NIST RMF`、`NIST CSF` 和 `ISO/IEC 27000` 的生命周期。该过程由五步组成：\n\n1. 风险评估\n2. 设计\n3.\
  \ 实施\n4. 评估\n5. 监控\n\n![Images](img/note.jpg)\n\n**注意** `CISO` 的职责部分是概述和监督控制生命周期过程，以确保实现目标的达成，并在项目在定义的预算、范围和时间范围内执行。`CISO`\
  \ 还负责确保将进度传给对项目有切利益的关键利益相关者（例如，系统所有者、执行团队、董事会等）。\n\n### 第一步：风险评估\n\n第一步是进行风险评估，以获得与需要保护的资产相关的风险的全局视角。风险评估可以由之前的风险评估或组织的风险管理过程指导。风险评估为组织提供了对特定资产威胁格局的理解。这包括：\n\
  \n* 资产的感知价值\n* 威胁和漏洞\n* 安全泄露的可能性和影响\n\n如果没有适当的风险评估，组织可能最终实施无法解决实际威胁的控制，实施成本高于受保护资产的控制，或者未能根据组织的风险偏好为资产提供适当的安全水平。风险评估识别风险，从而能够就为任务设计正确的控制做出明智决策。虽然风险评估是控制生命周期的一部分，但正式的风险管理过程在第\
  \ 1 章的“风险管理”部分进行了详细介绍。\n\n### NIST 安全分类\n\n`NIST 风险管理框架`使用 `FIPS 199，《联邦信息和信息系统安全分类标准》作为风险评估的一部分，根据潜在影响确定信息或信息系统所需的安全水平。这发生在\
  \ `RMF` 过程生命周期的 `分类` 阶段。表 2-2 提供了 `FIPS 199` 中每个安全目标潜在影响定义的概述。在 `RMF` 中，潜在影响被用于确定信息系统所需的安全水平（低、中等或高）。这决定了\n\
  \n![Images](img/p79.jpg)\n\n**表 2-2** FIPS 199 安全目标的潜在影响定义\n\n### 第二步：设计\n\n风险评估使组织根据识别出的风险以及组织的运营需求和目标设计适当的安全控制。设计阶段的主要目标如下：\n\
  \n* **控制选择**：选择控制以解决风险评估中识别的风险，并与组织的目标、目的和需求保持一致。\n* **控制设计**：识别控制实施和维护所需的资源（例如，财务、人员、架构等）。\n\
  * **控制测试**：在控制实施到生产环境之前对其测试，以确保控制的有效性。\n\n### 控制选择\n\n组织可能选择从零开始设计控制，或利用控制框架。控制框架提供了根据资产风险评估应实施的特定控制列表。与其，或者与控制框架相结合，可以根据最佳实践建议、经验、判断或预算要求选择控制，以减轻识别出的风险。\n\
  \n还应该考虑控制将是自动化的还是手动的：\n\n* **自动化**：由自动化系统执行的控制，人工干预少或没有。控制自动化的工具和技术示例包括自动灭火、安全信息事件管理（`SIEM`）告报和\
  \ IPS。\n* **手动**：由人员不直接使用自动化执行的控制。示例包括策略、标准、程序、培训和访客日志。\n\n\n\n\n\n大多数信息系统结合使用了手动控制和自动化控制。此外，虽然某些控制过程可能是手动的（例如安全策略的更新），但可能存在某些自动化技术可以提供帮助，例如使用治理、风险管理和合规（GRC）系统来自动化策略审查和审批工作流，并发送年度审查的提醒。\n\
  \n## 控制设计\n\n控制设计过程的一个关键部分是确定和规划实施及运行控制所需的资源。即使使用了控制框架，仍有许多设计因素需要考虑和记录，包括以下内容：\n\
  \n* 预算和范围\n* 人员和职员配置需求\n* 基础设施和架构需求（例如操作系统、应用程序、硬件、工具等）\n* 持续的控制成本和维护（例如维护、支持、监控等）\n\
  * 负责控制设计、实施、评估和监控的人员\n* 向利益利益相关者告知项目状态的沟通计划\n* 用于衡量控制成功的指标的开发\n\n## 控制测试\n\n控制设计过程的一部分还包括在控制投入生产之前进行测试，以确保控制的有效性并确保其不会对环境产生负面影响。此外，以防控制实施对环境产生负面影响，应制定回滚计划。虽然生命周期中的评估阶段发生在实施阶段之后，但这并不意味着不需要在实施之前作为设计过程的一部分进行测试。生命周期的评估阶段是一个持续的阶段，确保控制得到持续评估。\n\
  \n## 第 3 ：实施\n\n下一步是实施控制，以降低风险评估中识别出的风险。一旦设计好控制，就是执行设计阶段概述的项目的时候了。实施的简单或复杂取决于所涉及的控制。例如，开发密码安全策略比建立漏洞管理计划消耗的时间和资源要少得多。取决于涉及的控制，实施可能需要对以下内容进行更改：\n\
  \n* 策略、标准和程序\n* 业务流程或工作流\n* 信息系统或软件架构\n\n在实施多个控制时，有必要优先考虑控制实施。优先级应使用基于风险的方法来确定，以确保保护了适当的资产，并对实现业务目标重要的资产进行优先考虑。作为实施的一部分，维护控制的文档至关重要，以确保控制设计、开发、实施和预期行为具有适当的细节。\n\
  \n![Images](img/note.jpg)\n\n**注意** CISO 角色的关键职责之一是对安全计划进行监督，这包括监督控制实施过程，以确保控制能够及时实施和记录、在项目的预算和范围之内，并达到预期目的。此外，沟通是实施的关键组成部分，因为应该让适当的利益相关者随时了解项目实施状态。\n\
  \n## 文档示例\n\n用于控制文档的方法之一是开发系统安全计划（SSP），该计划描述并记录了如何为特定系统实施控制。SSP 通常至少包含以下内容：\n\n\
  * 描述：对系统的描述，包括名称、目的、信息所有者、保管员、安全分类、数据流等\n* 环境和边界：系统环境边界的描述，包括架构、拓扑、硬件和软件资产、端口、协议、服务等的描述\n\
  * 安全控制实施：每个适用安全控制的实施说明，以及每项控制的实施状态\n\n## 第 4 ：评估\n\n控制评估是生命周期中的一个持续阶段。必须对控制进行评估，以确保它们有效、已实施且运行正常、符合预期目的，并按照组织的策略、标准和程序运行。评估阶段由三个主要部分组成：\n\
  \n* 评估与测试\n* 报告\n* 修复\n\n### 评估与测试\n\n有不同类型的评估，包括：\n\n* 内部审计\n* 外部审计\n* 控制自评估\n\n\
  评估控制的基本技术包括检查、访谈和测试。以下术语的定义根据 NIST 800-53 进行了修改，以适用于任何控制框架：\n\n* **检查**：审查、检查、观察或分析过程或控制，以确保其按预期执行和操作，并符合控制目标。\n\
  * **访谈**：与组织内的关键人员或利益相关者进行讨论，以促进理解或获取过程或控制如何运行的证据。\n* **测试**：执行一个或多个控制目标，将实际结果与预期行为进行比较。测试包括对控制进行“实操”评估。\n\
  \n组织将在评估其控制时使用这些方法中的一种或多种。\n\n### 报告\n\n评估完成后，发现发现的任何缺陷都应进行记录和分析。结果应说明控制的哪个方面运行不符合预期，以及实施情况与计划或预期有何不同。评估的结果用于确定与所评估资产相关的控制的整体有效性。评估结果通常由信息所有者和高层管理人员（CISO、执行领导等）审查，以决定采取适当行动来及时补救局面。评估结果应包含以下内容：\n\
  \n* 适用控制列表\n* 控制的评估和测试计划\n* 指明每项控制通过或失败的报告\n* 缺陷所需的纠正措施和缓解措施识别\n\n### 修复\n\n修复在记录结果并确定补救局面的流程后开始。修复活动和方法通常由许多相关利益相关者（信息所有者、保管员、系统维护人员、CISO\
  \ 以及其他需要的人）确定。修复通常根据多种因素进行优先级排序，包括：\n\n* 修复所需的资源\n* 资产的风险和严重程度\n* 与缺陷相关的风险\n* 缺陷范围\n\
  * 评估类型（内部还是外部审计）\n* 缺陷在组织内部和外部可见性\n\n取决于缺陷相关的关键性或风险，组织通常会有一项概述预期修复窗口的政策。如果缺陷是监管审计的结果，也可能提供修复窗口。\n\
  \n![Images](img/note.jpg)\n\n**注意** 在对环境进行任何更改时，准备回滚计划是重要的。这应该在进行修复实施工作之前创建并记录。在进行任何更改之前，务必准备回滚计划，以防修复工作不顺利。\n\
  \nNIST 安全评估程序示例\n\n\n\n\n评估和测试方法论可能会在组织所选择的控制框架中概述。例如，使用 `NIST SP 800-53`——*联邦信息系统和组织的安全与隐私控制*（一种确定性框架）的组织可以利用\
  \ `NIST SP 800-53A`——*联邦信息系统和组织的安全与隐私控制评估：构建有效的评估计划*（一种评估框架）。图 2-1 展示了 `NIST SP\
  \ 800-53A Rev. 4`中针对 `CP-9` 信息系统备份控制的控制和评估程序示例。\n\n`NIST SP 800-53A` 包含了详细的评估程序，包括一个或多个评估目标。每个评估目标与评估方法（检查、访谈和测试）相关，并定义了评估小组应如何评估控制。\n\
  \n![Images](img/p85.jpg)\n\n**图 2-1** `NIST SP 800-53A` 控制和评估程序示例（来源：NIST）\n\n###\
  \ 第 5 步：监控\n\n安全控制生命周期的最后阶段是持续监控。必须对控制进行持续监控，以确定以下：\n\n• 控制性能和有效性\n• 与组织策略和目标的对齐\n\
  • 信息系统和环境的变化\n• 对法律、法规以及组织政策和程序的合规性\n\n此阶段的重点从实施安全转向面向未来的安全维护。在设计阶段考虑监控组件至关重要，以确保控制可以被监控，并考虑监控将如何进行。如果没有适当的监控，组织将难以确保控制正在运行且运行良好。为了有效监控控制，应该开发\
  \ `S.M.A.R.T.` 指标。`S.M.A.R.T.` 代表特定的、可衡量的、可操作的、相关的及及时的\n\n• **特定的（Specific）** 指标清晰、定义良好，并针对所测量的控制\n\
  • **可衡量的（Measurable）** 指标可以被测量，且数据准确完整\n• **可操作的（Actionable）** 指标数据易于理解并采取行动\n•\
  \ **相关的（Relevant）** 指标必须相关，并提供有关控制的有意义的数据\n• **及时的（Timely）** 指标数据在需要时可用\n\n`S.M.A.R.T.`\
  \ 方法论有助于开发有意义的指标和关键绩效指标。`关键绩效指标 (KPI)` 是衡量组织执行特定任务有效程度的指标。在此语境下，`KPI` 是衡量控制性能的指标。KPI\
  \ 还用于衡量战略安全计划范围内的目标和目的。作为控制监控的一部分，记录控制性能和指标很重要，这不仅可以生成报告显示控制的运行情况和目标达成情况，而且还可以处理偏离预期行为的情况。监控阶段允许制定控制状态报告并与关键利益相关者共享，以支持决策并确保控制符合组织的要求和目标。\n\
  \n监控是安全控制生命周期的一个重要方面，因为威胁在不断变化。组织必须持续监控控制以及环境中的新威胁，并利用控制生命周期识别并实施适当的控制以降低风险。\n\n\
  ## 探索信息安全控制框架\n\n本节探讨了一些最常用信息安全控制框架的组成和结构：\n\n• `NIST SP 800-53`\n• `NIST Cybersecurity\
  \ Framework`（NIST 网络安全框架）\n• `ISO/IEC 27002`\n• `CIS Critical Security Controls`（CIS\
  \ 关键安全控制）\n• `CSA Cloud Controls Matrix`（CSA 云控制矩阵）\n\n虽然这绝非详尽列表，但这些是一些主流框架。其中一些框架在第\
  \ 1 章中通过治理、合规、标准和最佳实践框架的视角进行了简要介绍。本节深入探讨这些框架，以探索控制框架结构，包括控制和控制族。控制框架在组织方式上通常遵循类似的结构，并可能包含以下部分或全部组件：\n\
  \n• **控制族（Control family）** 覆盖特定领域的控制组（例如，访问控制、风险管理等）。根据框架的不同，它可能被称为控制、控制族、控制组或控制类别。\n\
  • **控制族标识符（Control family identifier）** 控制族的唯一标识符，可能是字母或数字的组合（例如，`AC`、`RM`、`1`、`A.1`\
  \ 等）。\n• **控制名称（Control name）** 单个控制的名称，可能属于或不属于控制族（例如，访问控制策略和程序、变更管理、记录的操作程序等）。根据框架的不同，单个控制可能被称为控制、子控制或子类。\n\
  • **控制标识符（Control identifier）** 控制的唯一标识符（也可能包括控制族标识符；例如，`AC-1`、`ID.RM-1`、`ID.RM-2`、`A.12.1.1`、`12.1.1`\
  \ 等）。\n• **控制描述（Control description）** 对控制的描述，包括其功能。某些框架可能仅包含要实施的控制描述而不包含控制名称。\n\
  • **补充指南（Supplemental guidance）** 为特定控制提供的作为实施一部分的指南、参考或附加信息。\n• **评估指南（Assessment\
  \ guidance）** 关于如何评估控制的指南。\n• **控制映射（Control mappings）** 显示控制如何映射到其他框架的说明性引用或章节。\n\
  \n![Images](img/exam.jpg)\n\n**考试贴士** CCISO 候选人应熟悉常用的信息安全框架。\n\n### NIST SP 800-53\n\
  \n`NIST SP 800-53`——*联邦信息系统和组织的安全与隐私控制*是一份广为人知的 NIST 出，由安全和隐私控制目录组成，协助美国政府机构满足 FISMA\
  \ 的要求，并作为非联邦实体的最佳实践框架。\n\nNIST 控制组织成 18 个不同的控制族，如表 2-3 所示。除了这些控制族，`SP 800-53 Rev.\
  \ 4`（附录 J）增加了隐私控制目录，以解决日益增长的隐私问题并建立安全与隐私控制之间的联系。\n\n![Images](img/p87.jpg)\n\n表\
  \ 2-3 `NIST SP 800-53` 安全控制族\n\n控制根据潜在影响（低、中、高）和用于确定控制实施优先级的优先级代码进一步分组为基线（来自 NIST\
  \ 800-53：“优先级代码 1 `P1` 控制的实施优先级高于优先级代码 2 `P2`，优先级代码 2 `P2` 控制的实施优先级高于优先级代码 3 `P3`，优先级代码\
  \ 0 `P0` 表示该安全控制未在任何基线中被选中”）。对于联邦机构，基线是根据 `FIPS 199`《联邦信息和系统安全分类标准》中的指南选择的。\n\n\
  NIST 控制遵循特定的约定和格式。NIST 800-53 控制由以下部分组成，其描述自 Rev. 4：\n\n• **控制（Control）** 规定了组织或信息系统应执行特定的安全相关活动或行动\n\
  • **补充指南（Supplemental Guidance）** 为特定的安全控制提供非强制性的额外信息\n\n\n\n\n- **控制增强 (Control\
  \ Enhancements)** 提供了安全能力声明，用于：(i) 为控制添加功能/特殊性；和/或 (ii) 增加控制的强度（提供比基础控制更强的保护）。\n\
  - **引用 (References)** 包含了与特定控制相关的适用联邦法律、行政命令、指令、政策、法规、标准和指南列表。\n- **优先级和基准分配 (Priority\
  \ and Baseline Allocation)** 提供了：(i) 用于在安全控制实施期间决策排序的推荐优先级代码；以及 (ii) 安全控制和控制增强到基准的初始分配。\n\
  \n图 2-2 中的示例源自 NIST 800-53 的“审计与问责”家族。该图说明了典型的 NIST 安全控制的结构。\n\n![Images](img/p89.jpg)\n\
  \n**图 2-2** NIST 800-53 控制示例（来源：NIST）\n\n### NIST 网络安全框架\n\nNIST 网络安全框架（`NIST CSF`\
  \ 或 `CSF`）是一项自愿安全框架，旨在帮助组织管理安全风险并促进利益相关者之间的通信。NIST `CSF` 的三个主要组件在第 1 章中介绍，并在此总结供您复习：\n\
  \n- **框架核心 (Framework Core)** 由五个功能组成：识别、保护、检测、响应和恢复。每个功能由类别组成，类别由子类别和引用组成。\n- **框架实施层级\
  \ (Framework Implementation Tiers)** 从部分（第 1 层）、风险感知（第 2 层）、可重复（第 3 层）到适应（第 4 层）。虽然这些层级看起来是成熟度，但它们的目的是作为围绕风险偏好、任务优先级和预算通信的上下文参考。\n\
  - **框架配置文件 (Framework Profiles)** 代表组织的资源、需求和风险偏好与框架核心预期结果（功能、类别、子类别和引用）的对齐情况。配置文件用于评估组织“当前”状态与“目标”状态的对比。\n\
  \nNIST 网络安全框架核心由以下组件组成：\n\n- **功能 (Functions)** 高层网络安全活动分组，由五个功能组成（识别、保护、检测、响应和恢复）。\n\
  - **类别 (Categories)** 将每个功能细分为控制族分组（例如，资产管理、治理、风险管理策略等）。\n- **子类别 (Subcategories)**\
  \ 将一个类别细分为特定活动（例如，`ID.AM-1`：组织内的物理设备和系统已清单；`ID.RM-1`：建立了由组织利益相关者管理并达成一致的风险管理过程，等）。\n\
  - **信息性引用 (Informative references)** 将每个子类别映射到其他控制框架（例如，CIS 关键安全控制、COBIT 5、`ISO/IEC\
  \ 27001: 2013`、`NIST SP 800-53 Rev. 4`）。\n\n每个功能、类别和子类别都分配有一个唯一的 ID。表 2-4 说明了功能和类别的分解以及相应的标识。\n\
  \n![Images](img/p90.jpg)\n\n**表 2-4** NIST 网络安全框架功能和类别标识符\n\n![Images](img/p91.jpg)\n\
  \n**图 2-3** NIST CSF 框架核心示例（来源：NIST）\n\n图 2-3 展示了以“风险管理策略”类别为例的 NIST `CSF` 框架核心示例组件。风险管理策略（`ID.RM`）类别组织在“识别”（ID）功能中，由三个子类别（`ID.RM-1`、`ID.RM-2`\
  \ 和 `ID.RM-3`）组成，每个子类别都包含了信息性引用映射。\n\n### ISO/IEC 27002\n\n如第 1 章所示，`ISO/IEC 27001`《信息技术—安全技术—信息安全管理体系—要求》是一个用于实施信息安全管理体系\
  \ (`ISMS`）并确定采用哪些控制的最佳实践框架。`ISO/IEC 27002`《信息技术—安全技术—信息安全控制规范》是一项补充标准，侧重于组织可能决定实施以实现安全目标的推荐控制。`ISO/IEC\
  \ 27002`控制摘要包含在 `ISO/IEC 27001`的附录 A 中，但对每个控制仅描述了几句话。相比之下，`ISO/IEC 27002`提供了详尽的内容，讨论了每项控制、控制如何工作、控制目标是什么以及如何实施控制。与\
  \ `ISO/IEC 27001` 不同，组织无法通过 `ISO/IEC 27002`的认证。它仅仅是信息安全控制的参考和指导文档。\n\n`ISO/IEC 27002`由\
  \ 14 个安全控制条款组成，由 35 个安全控制类别和 114 项控制组成。每个安全控制类别由一个要实现的控制目标和一个可能实现该目标的一个或多个控制组成。`ISO/IEC\
  \ 27002`中的安全控制条款如下：\n\n- 信息安全策略\n- 信息安全组织\n- 人员安全\n- 资产管理\n- 访问控制\n- 密码学\n- 物理和环境安全\n\
  - 安全\n- 通信安全\n- 系统采购、开发和维护\n- 供应商关系\n- 信息安全事件管理\n- 业务连续方面的信息安全\n- 合规性\n\n![Images](img/note.jpg)\n\
  \n**注** `ISO/IEC 27002` 是确定性框架（控制列表），应结合另一个过程框架（例如过程指南如 `ISO/IEC 27001`）来实施整体信息安全计划。\n\
  \n#### CIS 关键安全控制\n\n互联网安全中心的关键安全控制（`CIS CSC`也称为 `CIS Top 20` 以及之前的 `SANS Top 20`）是一项自愿框架，由一组用于降低信息和系统风险的最佳实践控制组成。该框架包含\
  \ 20 项“关键”控制，重点关注信息安全的基础知识。表 2-5 列出了 20 项关键安全控制，并复制了来自互联网安全中心 [`www.cisecurity.org/controls/cis-controls-list/`](https://www.cisecurity.org/controls/cis-controls-list/)\
  \ 的描述。\n\n![Images](img/p92.jpg)\n\n![Images](img/p93.jpg)\n\n**表 2-5** CIS 关键安全控制\n\
  \n20 项关键安全控制中的每一项都进一步细分为多个子控制。每个子控制包含以下组件：\n\n- **子控制 (Sub-Control)**：唯一的子控制标识符。\n\
  - **资产类型 (Asset Type)**：资产类型，如设备、应用程序、用户、网络、数据或 `N/A`。\n- **安全功能 (Security Function)**：基于\
  \ `NIST CSF`功能的安全功能。\n- **控制标题 (Control Title)**：控制子类型的名称。\n- **控制描述 (Control Descriptions)**：要实施的控制描述。\n\
  - **实施层级 (Implementation Groups)**：子控制根据组织配置文件分为三个实施层级（`IGs`）。这些层级旨在帮助组织确定其配置文件，并为控制实施提供优先级（`IG\
  \ 1`、`IG 2`，然后是 `IG 3`），并作为过程框架。对于某些组织，根据其风险评估，`IG 1` 可能足够。\n\n### CSA 云控制矩阵\n\n\
  \n\n\n\n`云安全联盟云控制矩阵 (CSA CCM)` 或 `CCM` 是一个用于云安全的安全概念和原则的控制框架。它是云客户用于评估供应商云实施的安全风险的工具，也可供组织用于评估自身的云实施情况。`CCM`\
  \ 由以下 16 个控制领域组成，这些领域进一步细分为约 100 个单独控制项，每个控制项分配有一个唯一的控制 ID。`CCM` 基于一系列行业标准，并将每项控制映射到其他行业框架和法规，包括\
  \ `ISO/IEC 27001/27002`、`COBIT`、`PCI DSS`、`HIPAA`、`NERC CIP`、`NIST SP 800-53` 等。\n\
  \n* 应用与接口安全 (AIS)\n* 审计保证合规 (AAC)\n* 业务连续性管理与运营韧性 (BCR)\n* 变更控制与配置管理 (CCC)\n* 数据安全与信息生命周期管理\
  \ (DSI)\n* 数据中心安全 (DCS)\n* 加密与密钥管理 (EKM)\n* 治理与风险管理 (GRM)\n* 人力资源安全 (HRS)\n* 身份访问管理\
  \ (IAM)\n* 基础设施与虚拟化 (IVS)\n* 互操作性与迁移性 (IPY)\n* 移动安全 (MOS)\n* 安全事件管理、电子取证与云取证 (SEF)\n\
  * 供应链管理、透明度与问责制 (STA)\n* 威胁与漏洞管理 (TVM)\n\nCSA 开发的另一个实用框架工具是`共识评估倡议问卷 (CAIQ)`。`CAIQ`\
  \ 包含针对 `CCM` 中每个单独控制项的评估问题，提供了一种评估您的组织或供应商的云安全是否符合 `CCM` 标准的方法。它是 `CSA CCM` 评估框架的一个示例。`CAIQ`\
  \ 的示例见图 2-4。该示例包含针对治理与风险管理控制组中两个控制项的评估问题：策略执行和业务/策略变更影响。`CAIQ` 为针对 `CCM` 进行快速、高层差距评估提供了一种优雅的解决方案。\n\
  \n![Images](img/p95.jpg)\n\n**图 2-4** 共识评估倡议问卷 (CAIQ) 示例（来源：云安全联盟）\n\n### CISO 审计\n\
  \nCISO 和组织必须意识到其安全计划的有效性以及其在多大程度上实现了合规目标。这是通过`审计`实现的，即对安全功能进行仔细检查以验证其正确性和有效性，并识别任何不足。本节检查了审计管理、审计流程、控制自评估、持续审计以及特定类型的审计。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** 可能可能有关于特定审计术语或技术的问题。对审计实践和流程有良好的理解应足够应对考试。\n\
  \n### 审计管理\n\n安全审计可以独立完成，但通常作为更大审计计划的一部分进行管理，该计划包括检查组织的其他方面，例如组织的财务或信息系统功能。\n\n\
  某些组织设有审计委员会来监督审计。\n\n#### 内部审计与外部审计\n\n安全审计可以独立完成，但通常作为更大审计计划的一部分进行管理，包括检查组织的其他方面，例如组织的财务或信息系统功能。某些组织设有审计委员会来监督审计。\n\
  \n#### 审计章程和业务函\n\n审计范围可以在`审计章程`中定义，该文件记录了审计的权限、范围和职责。章程有助于规划审计功能，以便能够以定义定义的方式进行。以下是审计章程中可能回答的一些问题：\n\
  \n* 谁是利益相关者和资产所有者？\n* 哪些资产在审计范围内？\n* 哪些功能正在被审计？\n* 谁在执行审计？\n* 审计活动的周期是什么？\n* 管理层在审计过程中的责任是什么？\n\
  * 事项如何获得批准？升级流程是什么？\n\n### 审计计划\n\n在进行审计之前，规划所有必要的活动并识别所需的资源非常重要。大多数审计的范围非常泛，涉及大量数据的收集和分析。如果没有良好的计划，此类活动可能会失控。\n\
  \n\n\n\n\n在审计规划开始之前，审计人员必须首先定义审计范围（audit universe），这是描述审计范围和规模时的一个重要术语。`audit universe`描述了所有包含在审计中的业务流程和资产。一位首席信息安全官（CISO）朋友常说：“你无法煮干大海”；同样地，你不能审计一切，因此必须选择对支持组织目标最相关的项目。`audit\
  \ universe`定义了属于审计范围内的所有内容。\n\n确定审计范围的首要标准是识别对于满足合规性要求至关重要的业务流程和相关资产。例如，如果审计的目的是确定是否符合\
  \ HIPAA 合规，且公司在数据库中存储了患者数据，那么数据库以及相关的安全控制很可能是审计范围的一部分。\n\n有些组织使用基于风险的方法来确定审计范围。使用这种方法，业务流程和相应的资产按风险水平（如高、中、低）进行排序。对业务构成最大风险（业务影响最大）的业务流程或功能在审计规划中将具有最高优先级。\n\
  \n审计规划有时体现在两份文档中：审计策略和审计计划。`audit strategy`定义了审计的范围、时间和方向，而 `audit plan`定义了审计活动的性质、时间和范围。图\
  \ 2-5 显示了典型审计规划过程的概述。下文提供了对图中每个编号步骤的解释。\n\n![Images](img/F02-05.jpg)\n\n**图 2-5**\
  \ 典型的审计规划过程\n\n1. **理解业务。** 为了获得这种业务理解，审计规划人员可能采取以下措施：\n• 审查长期战略计划\n• 对组织进行贯穿调查，以了解每个小组或部门做什么、如何运作，以及其关键系统、流程和资产是什么\n\
  • 访谈关键领导和人员，了解趋势、历史、驱动因素和运营情况\n• 识别驱动业务决策或影响业务运营的特定法规\n• 识别外包活动（是否有第三方？）\n\n2. **确定自上一次审计以来，业务或环境是否发生了任何变化，如果有，这些变化可能如何影响本次审计。**\n\
  \n3. **审查上一次审计的工作，以了解发现的任何缺陷和提出的建议。** 上次审计的建议应在下次审计中进行检查。\n\n4. **审查政策、计划、标准和程序，以理解并识别用于满足要求的现有控制措施。**\n\
  \n5. **进行风险分析，根据业务流程和资产对组织的价值以及机密性、完整性可用性丢失的影响对其进行评估和排序。**\n\n6. **根据从前面的步骤中学到的知识设定审计范围和目标。**\
  \ 这是通过将审计划分为可管理的区块，例如类别（基于控制类型或技术）或阶段（基于随时间顺序的活动）来实现的。\n\n7. **制定并记录如何执行审计的策略。**\
  \ 该策略考虑了在规划过程中之前步骤中收集的所有数据。该策略本质上是对数据收集期间所提所有问题的回答。它定义了将要做什么，并作为审计计划的基础，审计计划详细规划了将如何执行审计策略。\n\
  \n8. **指定实施审计策略所需的资源，通常在审计计划中指定。** 这包括内部和外部资源。\n\n9. **处理并识别任何其他事务后勤问题。** 这些可能包括所有审计活动的总表，用于识别资源、优先级和相互依赖关系；以及获取任何所需的资源（如设备和软件）。\n\
  \n### 验证审计计划\n在执行审计之前，应对对审计计划进行检查，以确保它能够提供组织所需的合规性验证。是的，这意味着审计计划本身也应该被审计。提前检查计划比在流程后期发现计划没有涵盖其应涵盖的内容要好。\n\
  \n### 获得审计计划的批准\n如果信息安全审计属于审计委员会的职责范围，则该计划需要委员会的批准。如果是这样，这可能是委员会必须遵守的由批准（和预批准）政策所定义的批准流程的一部分。例如，如果组织必须遵守美国证券交易委员会（SEC）的法规，那么\
  \ SEC 对会计审计的治理和批准有特定的 SEC 要求。在这种情况下，审计委员会对审计行有监督权。\n\n### 审计过程\n如果没有精心设计的计划，审计就无法完成。计划应包括每项活动记录在案的步骤，并识别/或创建一个用于存储和维护所有审计产物的存储库。其目标是定义一个可以重复的、能够不断进化和改进的审计过程。审计过程提供了一种向组织传达审计范围和要求的机制，以确保审计实现了其预期目的。该过程应包括以下审计最佳实践：\n\
  \n• **检查与平衡**：减轻审计错误风险的一种方法是使用检查与平衡来实现职责分离。在这种方法中，负责执行任务的人员与负责验证任务执行正确的人员是分开的。\n\
  \n• **双人规则**：在任何可行的情况下，审计活动应由双人团队执行，其中一个人执行任务，另人在其旁边监督，以确保执行得正确。双人规则的关键部分在于它是一项`规则`，意味着属于双人规则的活动`不被允许`由单人执行。\n\
  \n• **独立验证者**：与检查与平衡类似，其思想是审计应该由对审计结果没有利益关系的人员执行。例如，如果 Joe 设计并实施了某项安全控制，他不应该是审计该实施情况以确保其执行正确的人员。相反，应该由无利益关系的第三方执行审计。\n\
  \n• **清单**：“过去”审计人员携有带有待检查和验证项目清单的夹板。现在他们使用电子表格和数据库，但概念是相同的——创建并使用带有待勾选框或待采集数据的清单。详细的清单是审计人员的好伙伴，因为它们定义了与结果对应的每个审计行动。\n\
  \n• **建立审计记录**：应该始终记录检查了什么以及何时进行的检查。审计记录允许组织回溯并验证做了什么以及执行得是否妥当。\n\n• **安全存储审计记录**：审计记录高度敏感，因为它们包含了环境中漏洞的信息。如果这些信息被分享给错误的人员或组织，可能会被利用。审计记录应妥善保护，并严格控制访问，以确保只有授权人员可以查看这些信息。\n\
  \n审计过程通常包括以下活动，每个活动将在随后的章节中讨论：\n\n• 为组织选择审计框架\n• 考虑并纳入特殊因素，如审计风险、规模和采样\n• 进行审计准备\n\
  • 收集评估证据\n\n\n\n\n\n- 评估证据并确定合规性\n- 向领导层、管理层和利益相关者汇报审计结果\n- 执行审计结项活动\n\n## 选择审计标准和框架\n\
  \n如前所述，在本书中我们讨论了三类控制框架：`流程模型框架`（process model frameworks），它们定义了组织可以遵循以实施控制的流程或生命周期模型；`确定性框架`（determinant\
  \ frameworks），它们包含了控制库，可以用于或或对其进行定制以满足目标；以及`评估框架`（assessment frameworks），它们为衡量合规性提供指导。许多发布的控制框架包含此类指导中的一类或多类，尽管它们并不一定使用这些术语。\n\
  \n本节重点关注用于支持审计的评估框架。组织可以定义自己的评估框架，但从零开始创建一个框架可能是一项艰巨的任务。许多组织发现，遵循行业标准框架更好。使用已建立的框架不仅可以节省时间，还能获得更好的结果，因为行业标准框架可能经受了时间的考验，并在多年以后得到了改进和完善。评估和审计框架为审计控制提供了流程。以下是实践中常用的此类标准和框架：\n\
  \n- `NIST SP 800-53A`\n- `ISO/IEC 27007`\n- `ISO/IEC 27008`\n\n`NIST SP 800-53A`\
  \ NIST 风险管理框架包含了流程评估阶段概述的审计组件，该组件引用了 `NIST SP 800-53A`《联邦信息系统和组织安全与隐私控制评估：建立有效的评估计划》。`NIST\
  \ SP 800-53A` 包含一套程序，用于在系统开发生命周期的各个阶段对安全和隐私控制（在 `NIST SP 800-53` 中概述）进行评估。\n\n`ISO/IEC\
  \ 27007:2017` `ISO/IEC 27007`《信息技术 – 安全技术 – 信息安全管理体系审计指南》是一个为信息安全管理体系提供指导的标准。`ISO/IEC\
  \ 27007` 建议如何在信息安全管理体系（ISMS）的背景下应用 `ISO 19011:2018`《管理体系审计指南》。该标准涵盖了以下内容：\n\n- 管理\
  \ ISMS 审计计划（谁、什么、哪里、何时以及如何审计）\n- 执行内部或外部 ISMS 审计（审计流程）\n- 管理 ISMS 审计员（技能、能力）\n\n\
  `ISO/IEC 27007` 对于想要审计 ISMS 或希望建立内部 ISMS 审计功能的组织非常有帮助。\n\n`ISO/IEC TS 27008:2019`\
  \ `ISO/IEC 27008`《信息技术 – 安全技术 – 信息安全控制评估指南》是一个侧重于评估信息安全控制的标准。`ISO/IEC 27008` intended\
  \ 补充 `ISO/IEC 27007`。`ISO/IEC 27007` 关注 ISMS 的管理方面的审计，而 `ISO/IEC 27008` 则关注 ISMS\
  \ 内部控制的审计。\n\n## 考虑和范围特殊审计因素\n\n在进行信息安全控制审计之前，应该处理某些特殊考虑。其是`审计风险`，即审计产生包含错误的结果风险。这些错误可能是由于审计程序不正确、系统文档不准确、配置错误或其他问题导致的。审计过程中的错误可能会产生错误的结果并导致错误的结论，从而浪费时间和精精力。\n\
  \n组织处理审计风险的方式与处理其他风险类似——通过预测和分类潜在风险，并为每个项目决定处理方法。以下是一些最常见的处理方法：\n\n- **缓解（Mitigate）**：风险缓解是采取行动减少或最小化风险的影响。\n\
  - **接受（Accept）**：风险接受是做出决定允许活动进行，因为风险是可接受的。\n- **规避（Avoid）**：风险规避是决定不进行该活动，因为风险过高。\n\
  - **转移（Transfer）**：风险转移是将风险转移给第三方。\n\n\n\n\n\n如果审计用于确定监管合规性，则规划应从识别和记录法律或法规中的外部要求开始。然后，将这些要求映射到为满足这些要求而设计的系统、流程和控制。这项活动有时是一项极其巨大的任务，因为在大型企业中，可能有成千上万条需求映射到大量的系统和控制。审计规划人员广泛使用电子表格或功能丰富的工具来帮助他们获取需求、将其分配给系统和资产、将其映射到派生需求、将派生需求分配给待测试项目，并记录测试结果。\n\
  \n一旦识别了需求并映射到资产，就会开发测试或审计程序来验证合规性。这些程序通常由检查清单支持，用于记录测试结果。这些文档形成了审计规划的基础，并使审计能够进行。\n\
  \n### 案例研究：母需求与派生需求\n\nABC Online 是一家处理信用卡交易的在线零售店，因此必须符合支付卡行业数据安全标准（PCI DSS）。PCI\
  \ DSS 包含以下要求（`PCI DSS Req. No. 6.4`）：“对所有系统组件的更改遵循变更控制流程和程序。”ABC 拥有一个包含这些要求的变更控制策略：\n\
  \n- ABC 应应对 ABC 计算环境内的所有计算资产开发、记录并发布标准化配置。\n- 这些标准配置应在实施前获得信息经理（IS manager）的批准。\n\
  - 信息经理负责开发并为 ABC 变更管理委员会（CMB）配备人员。\n- CMB 负责对变更请求（RFCs）进行分类和优先级排序。\n- 除非更改经过 CMB\
  \ 的授权、测试、批准并安排，否则不会对任何资产进行更改。\n\n在例例中，母级 PCI DSS 要求被拆分为策略中列出的若干个派生需求。正是这些派生需求由审计人员进行测试的，以确定组织对母级要求的合规性。\n\
  \n### 收集评估证据\n\n`Evaluation evidence`（评估证据）是审计人员作为审计活动的结果收集的数据。然后，将证据与要求进行对比或进行分析，以确定合规性。通常使用以下四种方法来收集和评估证据：\n\
  \n- **检查（Inspection）**：对数据的审查，例如：\n    - 审查策略、程序和图表等文档\n    - 审查源代码\n    - 审查配置设置和文件\n\
  \    - 读取日志文件\n    - 读取文件属性\n    - 检查序列号（硬件）或许可证（软件）\n    - 观察物理属性\n    - 访谈人员（用户、员工、技术人员）\n\
  - **演示（Demonstration）**：执行某个过程（如测试），产生的结果可以与一组预期结果进行读取和比较的结果。演示有时包括进行观察，例如观察屏幕上对输入的响应。\n\
  - **测试（Testing）**：执行一系列步骤或检查几次不同演示的结果。\n- **分析（Analysis）**：处理演示或测试的结果。例如，分析通常用于确定性能特征，如效率、延迟等。\n\
  \n证据被收集并存储在审计存储库或数据库中。如前所述，证据可能包含敏感信息，例如漏洞的枚举。\n\n### 评估证据并确定合规性\n\n一旦收集了评估证据，下一步就是使用它来识别不合规情况。在评估证据时，某些审计人员认为将\
  \ `observations`（观察结果）与 `insights`（见解）分开是重要的。\n\n- **Observations (Observations)**：检查、演示、测试或分析的结果\n\
  - **Insights (Insights)**：从观察结果中可以得出的结论\n\n两者之间的区别在于，观察结果纯粹是事实，而见解是直觉的解释。将两者分开是重要的，因为审计人员在获得所有事实之前可能会过快得出见解。这里有一个例子：在审计期间，审计人员发现大量用户账户已有\
  \ 90 天未未使用。这是一个观察结果。从这一观察结果中可以得出什么见解呢？一种可能的见解是“用户配置策略不充分”。其他可能的见解包括“未遵循用户账户配置程序”或“用户账户未进行集中管理”。根据观察结果、见解和相应的控制措施，可以确定对特定要求的合规性。\n\
  \n见解是执行根因分析（`RCA`）的第一步， RCA 是一种通过检查审计发现来理解根本原因的活动。通常不合规问题通过修复眼前的问题来解决，而没有解决根本原因。RCA\
  \ 被用发现问题源的方法，以防止其再次发生。\n\n对审计结果的评估应考虑发现的 `materiality`（重要性）。如果一个发现显示未能满足控制目标，则判定该发现具有重要性。重要性需要定义一个阈值或通过/失败标准，尽管有时这种阈值并不完全明确。因此，确定重要性有时是一个专业判断的问题。\n\
  \n### 案例研究：根因分析\n\n对一家大型医疗服务公司的审计显示，其内部开发的大多数软件应用程序包含安全漏洞，例如由于缺乏输入错误检查导致的缓冲区溢出。尽管这些漏洞在发现后被修复，但对软件应用程序的持续测试不断发现相同类型的问题。在访谈内部开发人员后发现，他们没有收到任何关于安全编码实践的指导或培训。这种培训和指南的缺失是问题的\
  \ `root cause`。因为修复漏洞并没有解决根本原因，新开发的软件具有类似的问题。一旦根因显露，公司对开发人员采取了培训计划，并指派了一个团队为组织创建安全编码标准。这些活动解决了根因，并消除了未来审计中问题的再次发生。\n\
  \n- **显著性（Degree of significance）**：应考虑发现对整体要求的影响程度。适用“……程度”的概念。该发现可能影响单个要求，但该要求对业务可能足够重要而具有相关性。\n\
  \n\n\n\n\n-   **利益相关者**：应当考虑作为重要性“受众”的人。这些利益相关者包括董事会、首席执行官（CEO）、政府监管机构、贷款人、保险公司等。重要的不是审计师的观点，而是审计师必须考虑利益相关者的观点。\n\
  \n-   **计量**：可以使用定量或定性评估（或两者的结合）来确定结果。`Quantitative`是一种数值衡量方法，例如，有多少百分比的系统受到了无效控制的影响，或者有多少数据处于风险之中。定量评估是基于数值阈值的建立的。定量评估可能包括受影响的业务流程或资产的成本，甚至是不合规的罚金成本。`Qualitative`衡量则基于非数值标准，例如所涉及控制支持的业务功能或系统的关键性。\n\
  \n-   **审计完整性**：重要性概念不应被用作规避满足要求的方法。重要性不应被滥用；它应该是为审计提供现实世界解释的一种，而不是作为跳过或忽略难以实施或测试的要求的借口。\n\
  \n有关更多信息，AICPA 发布了关于重要性的有用指南。请参阅 `AU-C Section 320`，《审计计划与执行中的重要性》，该文件可在 AICPA 网站上获得。\n\
  \n## 沟通审计结果\n\n审计的关键部分是审计师或审计组织如何向关键利益相关者报告和沟通发现。这通常通过审计报告和退出访谈来实现，这两者都有一个通常称为 `audit\
  \ workpapers`（审计工作论文）的审计记录库的支持。\n\n`audit report` 是所有审计工作的产物。它是交付给管理层的最终交付物。有时会向管理层提交一份初步版本的报告，可能在退出访谈（后文将进行详细描述）中进行审查，以便在定稿之前讨论初步发现。这是一个澄清误解、甚至解决在生成最终报告之前发现的问题的机会。\n\
  \n审计师应确保最终报告对于技术和非技术类受众都是易于理解的。通常报告包含一份执行摘要，用于介绍审计、定义其范围并总结审计发现。执行摘要的目的是概述审计范围以及关键发现，以便管理层能够快速了解最重要的信息。执行摘要的信息传递可以通过图表、图表等视觉化表示来支持。\n\
  \n如果没有实质内容，审计将是不完整的，这些内容位于文档正文和技术附件中，并将由技术人员（如系统和网络管理员以及安全分析师）审核。\n\n报告的准确格式有时由政策或程序规定，并根据范围和目标读者而异。通常，审计报告包含以下部分：\n\
  \n-   **执行摘要**：总结范围和发现。\n-   **审计目的、目标和范围的声明**：描述为何进行审计。\n-   **发现**：描述审计师发现的内容；具体而言，如果发现迹象表明控制未到位或无效的。\n\
  -   **结论**：讨论审计师根据发现得出的结论。这包括从发现中可以得出的见解或可以确定的根本原因。\n-   **建议**：提供如何修复发现的建议。报告中是否包含此类取决于审计的类型。某些审计侧重于识别控制缺陷，将修复发现留给被审计组织。\n\
  \n在某些情况下，审计师或审计组织会为管理人员进行 `exit interview`（退出访谈）或 `outbrief`（简报会）。这为审计师提供了一个展示发现和结论的机会。这很重要，因为它不仅为管理层提供了纠正任何误解的机会，还提供了对审计如何进行或审计结果表达任何观点的机会。根据审计的类型和范围，与会人员还可以讨论建议的实用性和实施时间表。通常，审计师在退出访谈中执行以下活动：\n\
  \n-   向管理层展示初步发现和结论\n-   提供纠正任何误解的机会\n-   允许管理层表达他们的观点\n\n记录有关退出访谈的所有信息都是重要的，特别是关键结论或疑虑。需要记录的项目包括简报会的地点、参会人员列表、讨论的关键事项列表以及会议的详细记录。\n\
  \n所有这些信息都应该有 `audit workpaper` 文件的支持。`audit workpapers` 是包含所有审计文档的库，包括审计计划、程序、审计师注释以及审计报告中包含的产物。这些审计文档对于证明审计师如何得出某些结论、描述他们做了什么以及证明尽职调查是必要的。这些工作论文应被妥善处理和存储以维护完整性。\n\
  \n## 结束审计\n\n在审计结束时，应当有序地停止审计活动，准备并交付审计发现，并（有时）举行简报会或退出访谈，向董事会或审计委员会等利益相关者展示审计结果。\n\
  \n审计结束通常包括清理、组织和存储审计数据的家务工作。审计时应决定哪些评估证据和工作论文应该保留，哪些应该丢弃。某些审计师保留所有内容，而另一些则仅保留支持报告和发现的最少数据。这总是一种权衡——保留太多会有保留有关组织漏洞的高度敏感数据的风险；保留太少则可能没有足够的数据来支持报告。\n\
  \n### 控制自评估\n\n许多组织发现，将审计职能与其他功能分离的传统做法是低效的。虽然独立审计因其公正性和客观性而被接受，但将审计师与运营部分分离是昂贵的，并且会产生额外工作。独立审计师对审计资产的熟悉程度不如开发或运营人员。同样，如果开发和运营人员不熟悉审计师的目标、方法和要求，他们就不可能创建合规的系统或流程。\n\
  \n\n\n\n如果没有 `CSA` 程序，组织在审计发生之前将不知道自己处于什么位置。因此，问题和安全漏洞在被发现之前可能会长期处于暴露状态。`CSA` 为组织提供了一个持续的视角，并实现了控制措施的持续修复和改进。\n\
  \n`CSA` 还提供了一个将审计功能合并到控制措施实际执行中的机会。这为加强控制措施提供了可能。`CSA` 也允许组织分配人员来整合控制的实施与监控。毕竟，还有谁比设计和实施这些措施的人更能定义定义成功的衡量标准呢？\n\
  \n在 `CSA` 出现之前，我们存在“孤岛效应”。执行者负责实施，审计人员负责评估。事实证明这种方式是无效的，并导致修复过程缓慢。通过允许由运营人员执行评估，控制措施可以与业务和组织目标更好地对齐。`CSA`\
  \ 提高了实施人员的质量和知识。他们让员工对控制措施的质量更加投入。\n\n许多监管机构要求建立 `CSA` 程序（例如 FDIC）。许多组织使用 `CSA`\
  \ 来帮助其满足《萨班斯-奥克斯利法》对内部控制报告的要求。使用 `CSA` 的益处包括：\n\n- 将审计引入组织的日常职能中\n- 将 `implementation`（实施）与\
  \ `monitoring`（监控）整合\n- 允许更好地定义和使用指标\n- 更好地从源头上解决问题\n- 允许组织更早发现问题\n\n#### CSA 的陷阱\n\
  \n某些组织可能会抵制开展 `CSA`，因为认为这增加了运营人员的工作量。在许多组织中，运营人员（以及其他部门的人员）已经忙于不可交。然而，其理念是，组织都要修复审计人员发现的问题；如果组织在内部识别并修复了它们，整个过程将变得更高效，并为运营人员减少整体工作量。\n\
  \n由同一组人员进行实施和评估可能会导致无法进行客观评估。这可能是由于员工与问题太近，或者对控制措施的创建或实施投入过多。另一个潜在的陷阱是，运营人员可能不愿意指出其部门、同事或上级产生的问题。为了解决这个问题，某些组织允许员工匿名参与\
  \ `CSA`，或在审计报告中删去他们的姓名。然而，解决这一问题的最佳方法是管理层在工作场所培养一种开放的文化和改进的精神。\n\n#### 实施 CSA 程序\n\
  \n某些组织发现，创建一个驱动整个组织开展 `CSA` 的 `CSA` 小组或职能是最好的。这个 `CSA` 小组应由 `CSA` 专家审计师组成。审计人员了解如何评估，并可以确保\
  \ `CSA` 与其他审计目标一致。以下是实施 `CSA` 程序的一般步骤：\n\n- **创建章程**：类似于审计章程，`CSA` 章程定义了所有部门和小组遵循的一系列共同目标和流程。它还确定了负责\
  \ `CSA` 功能的人员以及 `CSA` 在组织中发生的级别。章程还可能包含一份路线图，列出 `CSA` 活动的时间表。\n- **定义流程**：`CSA`\
  \ 可以使用与传统审计相同的方法来收集评估证据。然而，`CSA` 也可以使用协作方法，例如桌面研讨会和运营场景的演练。如果使用研讨会，通常会配备一名协调员，以确保遵循结构化流程并收集正确的信息。其目的是使用最佳手段收集有关组织如何运作的信息。\n\
  - **跟踪修复活动**：`CSA` 过程涉及持续的任务流，包括收集数据、执行分析、编目和优先排序缺陷、定义修复行动以及验证修复成功。这些活动应在列表、工具或数据库中进行跟踪。工具应始终提供\
  \ `CSA` 活动当前状态最新信息。\n- **建立情境意识**：管理层和相关员工应始终了解他们对 `CSA` 目标的遵守情况。组织应使用指标、仪表板和其他工具，提供其作为组织、部门和公司/机构所在位置的情境意识。\n\
  \n### 持续审计\n\n`continuous auditing`（持续审计）本质上是更频繁地进行审计。这通常通过能够快速收集和分析数据的技术实现。事实上，持续审计通常是自动化的，以提供实时或近实时的结果。\n\
  \n持续审计几乎总是使用 `agent`（代理），例如构建在业务流程中的软件或硬件传感器。`agent` 实时运行，提取信息或检测某些情况，并将结果发送到数据库或数据仓库中，在其中进行存储、排序和归一化。然后对数据进行挖掘，以发现关系并得出结论。基于事务的应用使用事务日志将数据馈入数据库。\n\
  \n#### 持续审计的益处\n\n技术支持的持续审计可以提供以下益处：\n\n- 自动化数据收集过程，使审计过程更高效。自动化也支持控制自评估的实践。\n-\
  \ 提供即时输出，在错误、效率低下和问题出现时进行检测（而不是等到下次审计）。\n- 提供独立性和客观性，因为审计师（人类）被从数据收集循环中移除了。\n- 整合工具和代理，允许对无法审计的事进行审计。例如，嵌入应用程序内部的数据或事件可以通过自动化工具暴露。\n\
  \n#### 持续审计适用吗？\n\n持续审计适用于某些情况，例如：\n\n- 流程的交易量极高，以至于点审计无法捕捉足够大的样本量来准确反映组织的状态。相反，审计师可以使用\
  \ `agent` 随时间收集数据并存储在数据库中进行处理。\n- 周期性采样不足的情况。\n- 必须及时检测到不合规行为以避免罚款的情况（组织无法在事后发现问题的情况）。如果组织面临一个错误就会导致不合规的情况，拥有一个持续观察的代理可以缩短组织感知问题的时间，以便尽早修复。\n\
  - 需要高效率的情况（调优和成熟）。通过持续审计，组织可以比等待下次审计快得多地进行调优和纠偏。\n\n### 特定类型的审计与评估\n\n本节探讨了首席信息安全官（CISO）应该熟悉的某些最常见的审计类型。涵盖了以下审计类型：\n\
  \n- `SOC` 审计\n- `ISO/IEC 27001` 认证审计\n- `FedRAMP` 评估\n- 行业特定审计\n\n#### SOC 审计\n\n\
  \n\n\n\n`服务组织控制 (SOC)` 审计是由第三方对服务组织（如云服务提供商）进行的审计，该第三方负责评估服务机构的内部控制。这些内部控制可能包括 IT\
  \ 控制、安全控制或组织的其它系统性控制。审计完成后，第三方审计师将出具一份证明该服务组织内部控制的报告。服务组织将此报告提供给客户、合作伙伴和监管机构作为一种证明。\n\
  \nSOC 审计演变为由美国注册公共会计师协会（AICPA）开发的《审计标准声明第 70 号 (SAS 70)》审计标准。2010 年，`SAS 70` 标准在美国被《鉴证业务标准声明第\
  \ 16 号 (SSAE 16)》取代，在美国境外则被《国际鉴务标准第 3402 号 (ISAE 3402)》取代。2017 年，`SSAE 16` 被 `SSAE\
  \ 18` 取代。\n\nSOC 审计和报告有三种类型：\n\n- `SOC 1`：涉及财务控制。\n- `Type I`（I 型）：对服务组织控制措施和设计的单点时间检查。重点于确定控制是否设计得当。\n\
  - `Type II`（II 型）：跨越一段时间的审计（通常为六个月到一年）。将 I 型的范围扩大到评估控制的有效性。\n- `SOC 2`：涉及信任服务（安全性、可用性、机密性、处理完整性和隐私性）。\n\
  - `Type I`（I 型）：对服务组织控制措施和设计的单点时间检查。重点于确定控制是否设计得当。\n- `Type II`（II 型）：跨越一段时间的审计（通常为六个月到一年）。将\
  \ I 型的范围扩大到评估控制的有效性。\n- `SOC 3`：与 `SOC 2` 一样也涉及信任服务。`SOC 3` 与 `SOC 2` 类似，但细节少得多，主要作为提供给客户的营销工具。\n\
  \nSOC 审计为服务组织提供向客户和合作伙伴证明其已建立强大内部控制的方法。表 2-6 概述了涵盖的各种类型 SOC 审计。此外，SOC 报告对于 `CISO`\
  \ 在供应商或服务选择期间协助评估潜在服务提供商控制措施的强度大有益。\n\n![Images](img/p113.jpg)\n\n**表 2-6** SOC\
  \ 审计类型\n\n### ISO/IEC 27001 认证审计\n\nISO/IEC 27001 为《信息技术—— 安全技术—— 信息安全管理体系—— 要求》，在第\
  \ 1 章中作为一种最佳实践框架引入，为建立整体信息安全管理体系 (ISMS) 提供指导。此外，组织可以通过经认可的第三方获得 ISO/IEC 27001 认证。第三方将根据\
  \ `ISO/IEC 27001` 中的要求评估组织的 `ISMS` 并证明组织的合规性水平。此外，还需要进行定期的内部审计以确保持续与 `ISO/IEC 27001`\
  \ 保持一致。\n\n### FedRAMP 审计\n\n`联邦风险授权管理计划 (FedRAMP)` 是美国联邦政府的一个计划，为云产品和服务的评估、授权和持续监控提供标准方法。云服务提供商\
  \ (`CSP`) 要向美国联邦政府出售服务，`CSP` 必须获得 FedRAMP 授权。FedRAMP 本质上是针对云产品和服务的网络安全审批流程。正如第 1\
  \ 章所示，《联邦信息安全管理法 (FISMA)` 要求美国联邦政府机构授权其使用的信息系统（用于此过程的方法是 `NIST RMF`）。FedRAMP 本质上是云端的\
  \ `FISMA`。其目标是使用“一次完成，多次使用”的方法协助授权过程，使每个美国联邦机构都不需要进行冗余的安全评估。\n\n`CSP` 通过受认可的第三方评估组织\
  \ (3PAO) 的评估获得 FedRAMP 授权。`3PAO` 评估并认证 `CSP` 的控制措施。FedRAMP 安全基线（低、中、高）源自 `NIST SP\
  \ 800-53` 控制，并有一组控制增强以应对云服务的独特安全需求。可以在 `https://www.fedramp.gov` 找到 FedRAMP 文档信息。\n\
  \n### 行业特定审计\n\n第 1 章讨论了许多可能影响 `CISO` 组织的法律和监管驱动因素。许多此类驱动因素包含自身的一套控制和审计要求，必须为了合规而实施。这些包括但不限于\n\
  \n- 接受支付卡信息的组织的 `PCI DSS`\n- `HIPAA` 下医疗保健“覆盖实体”的 `HIPAA` 或 `HITECH`\n- 针对联邦政府的\
  \ `FISMA`\n- 收集欧盟客户数据的组织的 `GDPR`\n\n![Images](img/exam.jpg)\n\n**考试提示** `CCISO`\
  \ 候选人应熟悉影响信息安全计划的行业特定审计。\n\n### 章节总结\n\n组织进行风险管理以理解每项资产对业务的重要性。首先对资产进行分类，以确定资产风险的性质以及存储、处理或传输信息的敏感性。组织通常使用框架来提供每个类别的建议控制库。组织使用或定制这些库，以确定应用于特定资产的安全控制集。然后组织可以设计控制的实施方案，对其实施和测试，并对资产进行合规监控。\n\
  \n审计是一种用于确定是否符合监管要求或组织内部政策（或两者都有）的正式流程。安全审计通常是组织整体审计计划的一部分，可能也属于 `CISO` 的管辖。传统审计由独立于被审计组织或部门的审计师定期进行。或者，某些组织使用控制自评来完成审计。`CSA`\
  \ 定期进行，并利用运营人员执行审计以提高审计效率。常见的安全审计包括 SOC 审计、ISO/IEC 27001 认证审计、FedRAMP 审计以及其他行业特定审计。\n\
  \n- 安全控制（也称为保护措施或对措施）是用于降低风险并保护信息或信息资产的机密性、完整性和可用性的机制。\n- 控制的选择是通过首先根据风险、资产对企业的价值以及资产机密性、完整性和/或可用性潜在损失的影响对资产进行分类来实现的。\n\
  - 控制分为三大类：\n    - 管理控制（也称为软控制）是侧重于管理的控制，如策略、程序、指南、培训、风险管理和人事实践（招聘、解雇等）。\n    - 技术控制（也称为逻辑控制）是提供安全控制功能的硬件或软件组件。\n\
  \    - 物理控制（原文此处应为物理控制）是为防止物理安全领域的威胁而建立的实体控制。\n- NIST 定义了一套不同的分类：\n    - 管理控制侧重于风险管理和信息系统安全管理。\n\
  \    - 运营控制主要由人员（而非系统）实施和执行。\n\n\n\n\n\n# 技术控制与框架\n\n- 技术控制主要由信息系统通过包含在系统硬件、软件或固件组件中的机制实施和执行。\n\
  - 控制族（Control family）是框架中的控制分组，通常处理相同的安全领域或功能。\n- 控制的安全功能描述了控制措施为组织做了什么。控制的功能包括以下：\n\
  \    - **预防性控制（Preventive controls）**：防止或阻止不利事件或事故的发生。\n    - **检测性控制（Detective\
  \ controls）**：发现、检测或识别潜在的不良活动、事件、入侵者或事故。\n    - **威慑性控制（Deterrent controls）**：威慑或阻碍潜在对手实施攻击或参与不希望的行为。\n\
  \    - **纠正性控制（Corrective controls）**：通过修复系统、流程或活动来纠正已经发生的不利事件。\n    - **指令性控制（Directive\
  \ controls）**：通常是管理控制，通过指定允许或不允许的操作来传达预期行为。\n    - **恢复性控制（Recovery controls）**：将环境或操作恢复到正常功能。它们的功能与纠正控制相似，但被认为具有更高级的能力。\n\
  \    - **补偿性控制（Compensating controls）**：作为主控制的替代或次要控制实施。当主控制由于成本、复杂性或其他业务限制无法实施时，通常使用这些控制。\n\
  \n### 控制框架\n\n控制框架是控制措施的目录，用于为实施全面的信息安全计划提供基础。控制框架的三种基本类型是过程模型、决定因素和评估。\n\n常见的信息安全控制框架包括：\n\
  - `NIST SP 800-53`\n- `NIST Cybersecurity Framework`\n- `ISO/IEC 27001/27002`\n\
  - `CIS Critical Security Controls/CIS Top 20`\n- `CSA Cloud Controls Matrix`\n\n\
  ## 安全审计与评估\n\n安全人员通过遵循安全控制生命周期来选择控制，该周期通常包括风险评估、设计、实施、评估和监控。\n\n安全审计是对安全功能进行仔细检查，以验证其正确性和有效性，并识别任何缺陷。\n\
  - 审计可以由内部或外部实体或两者的结合执行。\n- 审计章程（Audit charter）定义了审计的要求，而业务函函（Engagement letter）用于定义审计业务的条款，设定合理的预期并防止任何误解。\n\
  - 审计范围（Audit universe）描述了包含在审计中的所有业务流程和资产。\n- 审计计划记录在两个文档中：审计策略，定义了审计的范围、时间和方向；审计计划，定义了审计活动的性质、时间和范围。\n\
  - 减轻审计错误风险的方法是使用检查和制衡机制实施职责分离。\n- 审计记录应得到妥善保护，并对访问进行严格控制，使只有授权人员才能查看这些信息。\n- 常用的审计框架包括\
  \ `NIST SP 800-53A`、`ISO/IEC 27007` 和 `ISO/IEC 27008`。\n\n在抽样中，不是审计整个系统或部门，而是检查系统的代表性样本或子集。抽样有两种类型：统计抽和非统计抽样。\n\
  - 评估证据是审计人员作为审计活动的结果收集的数据。然后将证据与要求进行对比或进行分析，以确定合规性。\n- 对审计结果的评估应考虑发现结果的重大性（Materiality）。重大性是一个概念，即仅仅因为测试发现了错误，并不意味着控制目标未实现。应该建立阈值以便对控制目标进行评估；如果微小错误没有表明控制目标的失败，可以允许。\n\
  - 与传统审计不同，控制自评估（Control self-assessment）由组织的运营人员执行。\n- 持续审计本质上是更频繁地进行审计，通常是自动化的，以提供实时或近实的结果。\n\
  \n## 审计类型\n\n以下是 CISO（首席信息安全官）可能遇到的常见审计类型：\n- **SOC 审计**是由第三方对服务提供机构进行的审计，由其评估服务提供机构的内部控制。\n\
  - **ISO/IEC 27001 认证审计**是第三方对组织信息安全管理系统的评估。\n- **FedRAMP 评估**是针对支持美国政府的云产品服务的网络安全审批流程。\n\
  - 行业特定审计包括：\n    - 接受支付卡信息组织的 `PCI DSS`\n    - `HIPAA` 下的医疗保健“覆盖实体”使用的 `HIPAA` 或\
  \ `HITECH`\n    - 针对联邦政府的 `FISMA`\n    - 针对收集欧盟客户数据的组织的 `GDPR`\n\n## 问题\n\n**1.**\
  \ 一名安全分析师正在检查 Web 服务器的安全日志以寻找入侵迹象。这对应于以下哪种控制功能的示例？\nA. 检测性\nB. 预防性\nC. 恢复性\nD. 指令性\n\
  \n**2.** CISO 被要求确定某项控制是否充分。CISO 使用以下哪项来确定这一点？\nA. 业务驱动因素\nB. 监管驱动因素\nC. 评估结果\n\
  D. 决定因素\n\n**3.** 新入的 CISO 正在对组织的数据中心进行物理安全审查。在评估过程中，CISO 确定组织已实施服务器门锁、围栏和护柱。这些代表哪种类型的控制？\n\
  A. 指令性\nB. 恢复性\nC. 预防性\nD. 技术\n\n**4.** 在 CISO 的指导下，安全团队正在实施预防性控制以应对信息系统的风险。应该在生命周期的哪个阶段测试控制？\n\
  A. 实施之前\nB. 实施之前及之后\nC. 风险评估之后\nD. 实施之后\n\n**5.** `NIST SP 800-53` 概述了管理、运营和技术类。以下哪个控制族是管理类的示例？\n\
  A. 风险评估\nB. 意识与培训\nC. 物理环境保护\nD. 人员安全\n\n**6.** 组织的 CISO 正在寻找对其安全计划的公正评估。以下哪项将提供最公正的评估？\n\
  A. 内部审计\nB. 控制自评估\nC. 外部审计\nD. 财务审计\n\n**7.** 在审计规划过程中，以下哪个步骤必须先于其他步骤完成？\nA. 设定范围和目标\n\
  B. 开发策略\nC. 指定资源\nD. 业务\n\n**8.** 以下项包含了审计范围内的过程、资产、实体、用户和资源？\nA. 业务函\nB. 审计审查\n\
  C. 审计范围\nD. 审计清单\n\n**9.** CISO 正在编写组织安全策略。这是以下哪种控制类型的示例？\nA. 管理性\nB. 技术性\nC. 物理\n\
  D. 检测性\n\n**10.** 一家组织遭受了攻击，攻击更改了其网站上的电子商务网页，导致客户无法使用其进行购买。这影响了哪些安全基本要素？\nA. 完整性和可用性\n\
  B. 可用性\nC. 完整性\nD. 既不影响完整性也不影响可用性\n\n### 答案\n\n\n\n\n\n### 1. A.\n审查系统安全日志以发现入侵迹象是检测控制（detective\
  \ control）的一个示例，因为此类控制用于识别潜在的不利事件或活动。预防性控制阻止不利事件的发生，恢复控制将环境恢复到正常功能，指示性控制则传达预期行为。\n\
  \n### 2. C.\n首席信息安全官（CISO）将使用评估结果来确定控制是否实现了计划目的并按预期运行。业务驱动因素和监管驱动因素将作为安全策略的基础，并可能帮助决定框架以及作为评估标准，但它们不会用于评估控制的充分性。\n\
  \n### 3. C.\n服务器房门锁、围栏和护路柱是预防控制的示例，因为它们的作用是防止不利事件的发生。指示性控制传达预期行为，恢复控制将环境恢复到正常功能。列出的控制是物理控制的示例，而非技术控制。\n\
  \n### 4. B.\n控制作为控制生命周期的一部分，在实施前应进行测试，并在之后按照组织定义的间隔定期进行测试。虽然生命周期的评估阶段发生在实施之后，但这并不消除在实施前作为设计过程的一部分进行测试的需要。生命周期的评估阶段是一个持续阶段，确保控制得到持续评估。\n\
  \n### 5. A.\n风险评估控制族被认为是一种管理控制类。意识与培训、物理与环境保护以及人员安全被认为是操作控制类。\n\n### 6. C.\n外部审计将对安全计划提供最公正的评估。内部审计和控制自评由内部人员执行，他们可能会受到其与组织紧密关系的影响，并往往倾向于不那么公正。财务审计没有解决问题中要求的公正性要求。\n\
  \n### 7. D.\n审计规划的第一步是了解业务。如果不了解业务，审计规划过程中的其他步骤无法完成。\n\n### 8. C.\n审计范围（audit universe）描述了包含在审计中的所有业务流程和资产。审计范围定义了审计涵盖的所有内容。\n\
  \n### 9. A.\n制定组织安全策略是管理性控制（administrative control）的一个示例。管理性控制是以管理为导向的控制，例如策略、程序、指南和培训。技术控制（也称为逻辑控制）是提供安全控制功能的硬件或软件组件。物理控制是为防止物理安全领域的威胁而设置的实体控制。检测控制用于发现、探测或识别潜在的不利活动、事件、入侵者或事故。\n\
  \n### 10. A.\n完整性和可用性都受到了影响，因为电子商务网站被篡改（影响了完整性），且客户无法访问该网站（影响了可用性）。\n\n# 第 3 章：安全计划管理与运营\n\
  \n本章讨论了以下主题：\n\n* 安全计划管理\n* 安全计划预算、财务和成本控制\n* 安全计划资源管理：建立安全团队\n* 项目管理\n\nCISO 通过实施计划良好且执行良好的信息安全计划来承担保护组织资产的工作。本章描述了有效的信息安全计划是什么样的，以及如何对其进行管理、人员配置和资金支持。信息安全计划通常包含两类活动：*子计划*（subprograms），也称为*工作流*（streams\
  \ of work），它们是长期活动或持续性的的活动；以及*安全项目*（security projects），它们具有定义的结束状态，一旦实现即标志着活动的结束。本章描述了用于执行这两类活动的管理过程。\n\
  \n## 安全计划管理\n\n第 1 章 介绍了构成典型安全计划的组件。作为回顾，以下是组件的摘要（参见图 3-1）：\n\n![Images](img/F03-01.jpg)\n\
  \n**图 3-1** 安全计划组件\n\n* **安全关注领域**：影响安全计划的外部驱动因素，如 `PCI DSS`、`HIPAA`、`Sarbanes-Oxley`\
  \ 或 `FISMA`，以及内部驱动因素，如 IT 部门的服务管理策略。\n* **安全工作流**：持续性的安全活动，例如安全事件监控、事件响应、漏洞管理等。\n\
  * **安全项目**：由安全组织启动并实施的活动，不是持续性的，而是具有定义的目标或最终产物。安全项目的示例包括选择身份管理解决方案、部署特定的 `GRC` 系统（在相邻的侧边栏中描述）、构建安全意识门户或执行漏洞评估。项目按照项目管理流程实施。\n\
  * **资产**：组织拥有的资源。在安全计划的语境下，资产是需要免受威胁保护的资源。资产通常由系统和数据组成。\n\nCISO 的挑战在于以凝聚且协调的方式管理这些元素。\n\
  \n## 安全关注领域\n\n安全关注领域是影响工作流和安全项目执行方式的驱动因素。关注领域影响组织关于需要哪些安全活动以及在何处应用的决策。关注领域可能适用于特定的资产或资产组。例如，`PCI\
  \ DSS` 要求根据企业内部信用卡数据所在的位置，实施特定的安全控制。因此，`PCI DSS` 影响了企业内存储、处理或传输信用卡数据的资产在设计、实施和运营安全要求。`PCI\
  \ DSS` 可能会影响一个或多个工作流以及一个或多个安全项目。\n\n## 治理、风险管理与合规\n\n*治理、风险管理与合规（GRC）* 是一个用于描述这三项实践及其相关活动的整合方法的术语。某些组织实施\
  \ GRC 计划以实现对组织 GRC 的凝聚、整体性的方法，通过战略与组织目标的对齐，确保组织按照其内部策略、外部合规要求和风险偏好采取行动。GRC 的益处是组织内部这些职能之间的信息同步，以确保它们彼此不孤立。\n\
  \n* **治理**：确保战略目标、规则、策略和实践与业务目标保持一致\n* **风险管理**：通过分析风险概率和影响并优先考虑控制实施，将风险管理在可接受水平\n\
  * **合规**：监控并报告组织对内部要求（策略和程序）以及适用外部要求（法律和法规）的遵从情况\n\n\n\n\n\nGRC 往往通过实施 `GRC system`\
  \ 来获得技术支持。`GRC system` 允许组织通过集中化工具完成与 GRC 相关的计划。每个 GRC 功能都会产生并管理各种信息，例如资产清单、策略、标准、程序、审计工作论文、安全事件信息、风险管理信息、合规信息、控制监控和报告信息等。这些信息通常维护在分布式的文档、电子表格和/或系统中。`GRC\
  \ system` 的主要优势包括能够将数据整合到中心位置、自动化业务流程以及对集中的 GRC 数据进行编制和报告。\n\nGRC 系统提供一系列功能，可能包括以下部分或全部功能：\n\
  \n- 管理策略和程序的开发、管理和评审工作流\n- 记录策略异常\n- 记录控制措施并管理控制监控工作流\n- 维护资产清单\n- 管理资产的风险评估\n-\
  \ 记录和管理控制缺陷\n- 维护风险登记册和风险文档\n- 跟踪控制测试\n- 管理审计文档、计划和审计项目\n- 事件的记录与跟踪\n- 仪表板和报告\n\n\
  在决定是否实施 GRC 系统时，组织需要考虑许多因素。与任何工具一样，实现价值需要前期的工作。对于 `GRC system`，这种前期工作可能是巨大的，特别是对于规模较的安全团队，如果组织未能识别用例或缺乏健全的治理、风险管理和合规基础。为了实现\
  \ `GRC system` 的全部价值，组织应该考虑：\n\n- 组织是否拥有完整的资产、合规义务和控制清单？\n- 是否已确定资产所有者和数据所有者？\n\
  - 是否有坚实的策略、程序、标准等基础？\n- 是否已确定 `GRC system` 的用例？\n- 是否对需要自动化的手动流程工作流有深入理解？\n- 是否已确定参与工作流的人员？\n\
  - 组织是否有足够的员工和资源来实施、管理和维护 `GRC system`？\n- 需要什么样的定制？\n- `GRC system` 需要什么样的报告要求？\n\
  \n尽管 `GRC system` 提供了许多好处，但它无法修复定义不当的 GRC 程序。当用 `GRC system` 来增强定义良好的 GRC 程序时，它就能提供很好的价值。\n\
  \n关注领域包括组织必须遵守的法律、法规、标准或策略。处理合规性（因此是关注领域）的过程在“合规性”章节第 1 章中描述。CISO 负责确保关注领域正确整合到安全计划中。\n\
  \n### 安全工作流\n\n持续进行且没有开始、中间和结束的活动属于某些 CISO 称为 `streams of work`（工作流）、另一些人称为信息安全计划的`子程序`的类别。为了本次讨论，我们使用“工作流”这一术语。由于其性质，这些活动将贯穿安全计划的寿命。这些持续的安全活动因组织而异。以下是一些典型的安全工作流的列表：\n\
  \n- 安全文档维护（安全章程、策略、程序、标准和指南）\n- GRC\n- 风险分析与管理\n- 用户身份管理与配置\n- 资产管理\n- 威胁情报\n- 安全监控与入侵检测\n\
  - 入侵防御\n- 安全管理\n- 配置和补丁管理\n- 应用安全\n- 安全培训与意识\n- 安全测试\n- 物理安全\n- 业务连续性\n- 灾难恢复\n\n\
  尽管这些活动是持续的，但它们仍然具有与项目管理生命周期相似的生命周期过程。工作流可以遵循如计划-执行-检查-处理（PDCA）过程模型完成，该模型此前在第 1 章和第\
  \ 2 章中讨论过。经常被引用的 PDCA 模型支持者威廉·爱德华·德明曾说：“仅仅尽力是不够的；你必须知道该做什么，然后尽力去做。”遵循德明的建议，许多行业常用的\
  \ PDCA 循环非常适用于执行工作流，因为每个工作流都应该：\n\n- 良好计划\n- 按照计划执行\n- 根据成功标准进行衡量\n- 持续改进以解决任何缺陷并随着时间的推移变得更好\n\
  \n第 1 章 介绍了适用于合规管理的 PDCA 过程。然而，PDCA 模型（也称为德明循环或休哈特循环）适用于任何工作流，无论是合规性的还是其他性的。图 3-2\
  \ 说明了如何将 PDCA 模型用于安全工作流，下文所示。\n\n![Images](img/F03-02.jpg)\n\n**图 3-2** 工作流过程\n\n\
  #### 计划\n\n持续的工作流应该经过良好计划，既单独计划，也作为一个协调的活动组合进行计划。CISO 应该根据在第 1 章中执行治理和风险分析活动时建立的优先级，为完成这些活动制定路线图。路线图应体现在安全章程或安全计划等文档中。路线图反映了短期和长期计划，应至少每年更新一次。\n\
  \n规划应该根据组织的业务、利益相关者需求或安全审计或评估的结果反映重点。例如，如果漏洞评估表明组织有许多未补丁的系统，组织可能需要在短期内对其`补丁管理计划`赋予更高的优先级。应根据组织的实际需求频繁更新计划。\n\
  \n规划工作流包括确定构成安全计划活动所需的资源。资源可能包括：\n\n- **人员配置**：在本章后的“安全计划资源管理：构建安全团队”部分将详细讨论，人员配置涉及确定合适的团队以完成工作流的目标。人员规划还包括确定工作流团队的组织结构，以及团队结构如何融入整个信息安全部门的结构。\n\
  - **支持基础设施和工具**：每个工作流对工具和 IT 基础设施都有自己的需求。规划包括识别需要哪些工具，以及组织应该购买每个工具还是自行开发（自建还是购买）。工具还需要维护。维护工具的需求和资源是规划活动的一部分。\n\
  - **财务资源**：执行工作流所需的资金可能随时间推支出。工作流活动可能会出现支出较大的时期，例如购买设备、扩充人员或活动激增时（例如，在事件期间或合规演练期间）。支出预算通常按年度制定。\n\
  \n\n\n\n\n## “服务化”（X as a Service）\n\n今天，许多首席安全官（CISO）不再使用内部资源或工具，而是通过“服务化”模式外包安全功能。此类服务的范围从安全计划的小部分环节（如防病毒软件）到大型环节（如企业完整的安全监控和入侵检测）。安全计划的几乎任何方面都可以通过服务化模型来实现。\n\
  \n与工作流相关的计划应该包含对目标和任务的明确定义。如果没有明确的目标，工作流可能无法产生对组织有益的结果。计划还应说明如何衡量和报告这些结果。工作流计划文档存储在文档库中，并根据“按需知”原则实施\
  \ `access controls`，同时通过 `change control processes` 管理文档基线。计划确定了该工作流所涉及的资产。计划还应涉及\
  \ `security relationship`（安全关系），包括工作流如何影响其他部门、组织内部人员以及外部实体。安全关系的描述还应指明与这些利益相关者进行沟通、协调和协作的方法，以及此类通信的频率。\n\
  \n## 执行 (Do)\n\n根据上一节描述的计划，工作流将开展活动以实现定义的目标。所有活动都应遵循计划中识别或定义的流程和程序。每个工作流都配有工作流所有者或工作流经理，这些人可以是\
  \ CISO 或指定的经理或主管。\n\n在 CISO 指导下的安全组织应开发并完善一种 `operating`（或 `operational`）`rhythm`，这指的是定期发生的通信（通常是报告和会议），但不会对工作流或其他活动的运行流程产生负面影响。需要会议以便团队成员进行沟通与协作、解决问题、报告状态并讨论改进。需要报告来为管理层和决策者提供数据和指标。这些通信必须以固定的节奏以定义且重复的方式进行。表现最好的安全组织通常是那些理解最佳运行节奏价值并据此调整计划的组织。\n\
  \n工作流活动应在具有自意识的情况下完成。这意味着参与工作流的每一个人不仅应该知道自己在做什么，以及这与他人的工作如何匹配，还要知道工作流相对于目标的表现如何。失败的工作流往往是只有老板一个人知道真实情况。当每个人都对结果拥有利益关系并知道如何为工作流的成功做出贡献时，成功的工作流得以实现。\n\
  \n工作流工作人员应记录一切，包括计划、程序、指南、报告和指标。为了创建一个实用的信息活库，工作流数据应存储在文档库中。这些文档对组织非常重要，但也包含了有关组织安全漏洞和弱点的信息。因此，对工作流文档和数据的访问应仅限于具有\
  \ `need to know` 的人员。\n\n### 安全联络员 (Security Liaisons)\n\n为了取得成功，安全活动（包括工作流）必须与组织内的其他小组和人员紧密协作。因此，安全团队需要与其他组织建立\
  \ `security relationship`。许多 `security groups` 使用安全络员，他们是安全团队中向组织其他部分开展外联工作的成员。安全络员提供双向通信，提供安全\
  \ `messaging, expertise, and advise` 以传播信息安全实践知识（包括组织正在采取哪些改进安全的措施），并作为 CISO 的眼睛和耳朵，`听取员工对安全策略、实践和倡议的看法和感受。`\
  \ 我们都知道，人是信息安全中最薄弱的一环。安全络员有助于提高组织的安全文化，从而减少安全事件。\n\n## 检查 (Check)\n\nCISO 如何确定工作流是否运行良好？他们必须根据成功标准进行衡量。每个工作流都应该有一组明确的目标，以及衡量这些目标达成情况的指标。工作流计划包括建立如何衡量和报告成功。然而，PDCA\
  \ 检查阶段的不仅是针对活动主要目标的性能指标。它还包括评估活动各个方面的方法。这可能包括衡量准确性、有用性、适用性、韧性或适应性等指标。CISO 应该始终寻找衡量和理解安全计划每个方面表现如何的方法。\n\
  \n某些性能指标每天都会衡量，例如监控日志和检测告警。其他指标则作为评估或审计行动的一部分进行衡量。如 第 2 章 所示，安全审计通常作为更大型审计计划的一部分完成，但这些审计可以作为评估工作流性能的工具。然而，在审计计划之外可能还有其他措施。许多组织使用安全仪表板来显示工作流活动的状态，例如安全监控功能的工单统计，或来自补丁管理工作流的已修复/未修复系统统计。\n\
  \n评估应该是运行节奏的一部分，如前所述，运行节奏是一种通信报告的节奏，包含了对工作流表现的衡量。\n\n## 行动 (Act)\n\n行动阶段的目的是维持安全功能（工作流）的质量并寻求改进方法。这是通过审查和分析检查阶段的结果和数据来实现的。将结果与每个工作流定义的目标和任务进行比较。然后对缺陷和差距进行界定以进行修复。\n\
  \n某些组织使用行动计划与里程碑 (POA&M) 或纠正行动计划 (CAP) 将修复流程正式化。这些术语源于 FISMA 以及支持 FISMA 的各种指南和出版物；但它们也被泛泛用于描述捕获、跟踪和通信安全修复活动的方法。`POA&Ms`\
  \ 和 `CAPs` 是以系统为单位创建的，用于跟踪风险管理框架 (RMF) 过程中通过安全测试发现的问题解决情况，但它们也可以用于支持解决安全工作流中的缺陷或所需的改进。`POA&M`\
  \ 是一个描述解决缺陷方案的计划。它包含一个 `CAP`，详细说明了为了解决缺陷将采取（或已采取）的具体措施。\n\nPDCA 循环的行动阶段部分包括对跨工作流的结果进行汇总，以发现趋势并确定根源。\n\
  \n\n\n\n\n第 1 章讨论了资产的安全分类和风险缓解。第 4 章描述了资产安全的核心能力以及其他核心能力。本节讨论了资产的安全管理，并在图 3-3 中进行了说明。\n\
  \n![Images](img/F03-03.jpg)\n\n图 3-3 资产的安全管理\n\n图 3-3 源自`ISO/IEC 27001`，展示了风险管理应用于资产的生命周期。每个资产作为风险评估和风险分析过程的一部分进行评估，从而对资产进行优先级排序和分类。基于此，为资产定义风险处置措施。实施这些措施（通常以控制措施的形式），然后进行评估。测试期间发现的任何缺陷或差距将得到解决。安全改进源于对资产的长期监控以及随后的风险分析活动。这一循环在资产的整个寿命内持续进行。\n\
  \n信息安全计划的一个关键方面是了解所有资产是什么、它们在哪里以及它们的安全态势如何。这种态势感知是安全计划管理的核心功能。理想情况下，安全团队应维护或访问一个包含此类信息的单一数据库。但在实践中，这些信息往往存储在不同的数据仓库中，或者由\
  \ IT 部门等其他小组维护。\n\n无论数据位于何处，安全团队都应该能够访问或维护有关每种资产的数据。以下是可能为资产维护的示例信息：\n\n* 资产名称、品牌、型号、序列号等\n\
  * IP 地址和 MAC 地址\n* 资产类型\n* 资产所有者和保管人的名称\n* 地点\n* 配置信息，例如安全基线、配置设置或标准构建标识\n* 许可信息和状态\n\
  * 安全分类、分级、风险或影响级别，或其他指示资产预期安全特征的信息\n* 最近的评估、审计或合规性审查的结果\n* 当前对资产的安全监控方法\n* 当前运行状态\n\
  * 当前的补丁状态或级别\n* 与其他系统或资产的关系\n* 安全授权状态\n\n控制组织的资产并确保它们得到妥善保护是 CISO（首席信息安全官）面临的最大挑战之一。违规设备可能会无意或有意出现在网络上。此外，包括手机、平板电脑和\
  \ PC 在内的移动设备也是企业的一部分，但更难追踪。许多组织使用自动化解决方案来发现资产，以帮助资产态势感知，并防止未经授权的资产连接到企业或造成干扰。\n\n\
  就本文讨论而言，信息资产是指数据。数据从字面意义上是任何组织的生命线，通常是网络攻击的目标、安全事件的对象以及后续恢复活动的重点。信息资产与支持它们的资产（系统、硬件和软件）一样，需要安全团队进行管理。信息资产管理包括以下内容：\n\
  \n* **信息资产分类** 安全团队确保所有数据都按照组织的数据分类策略及相关指南进行分类。分类方案根据业务环境的性质而异，但每个组织至少有两种类型（或分类）的数据：\n\
  \    * 需要一定程度保护的私有数据\n    * 不需要保护的公共数据\n* **数据处理** 安全计划为每种分类数据在存储、处理或传输期间应如何处理制定策略、标准和指南。这些规则定义了谁在何地以及如何处理数据，包括定义实施方法，如加密、访问控制、标签标记和物理介质。\n\
  * **数据清单** 与支持资产（硬件和软件）一样，信息资产通过清单和相关流程进行跟踪，以了解组织的信息资产位于何处、如何保护，以及组织对适用于资产的策略和规则的合规情况。\n\
  \n### 安全项目\n\n安全项目是安全计划内有开始有结束的活动。工作流（streams of work）是持续的，而安全项目有明确的终，一旦达到目标，项目即结束。一个组织的活跃安全项目列表在不断变化。随着旧项目的完成，每年都需要新的安全项目。可能作为安全计划一部分的示例项目包括：**\n\
  \n* 获取并实施漏洞扫描工具\n* 执行网络安全架构审查\n* 开发安全工具\n* 部署事件响应能力\n* 为数据中心设计物理安全控制\n* 对服务提供商进行风险评估\n\
  * 开发软件开发安全标准\n* 将安全实践与行业框架对齐（例如，`ISO/IEC 27001`、`NIST SP 800-53` 等）\n\n所有这些示例都会导致创建某种项目，必须对其进行妥善管理以确保成功。项目和工作流一样，需要严谨的管理才能成功。但项目管理过程与工作流有所不同，因为项目有定义的终状态，且所有活动都指向实现该终状态。项目管理流程将在本章稍后的“项目管理”部分进行详细讨论。\n\
  \n### 安全计划预算、财务和成本控制\n\nCISO 对安全预算和支出的负责程度因组织而异，通常与显示汇报关系的组织顶层组织架构图对齐。如果 CISO 向\
  \ `CIO`（首席信息官）汇报，则安全预算可能是 IT 预算的一部分，预算和支出过程通过该链进行管理。在 CISO 直接向 `CEO`（首席执行官）汇报的情况下，CISO\
  \ 通常在预算和支出方面拥有更大的自主权。\n\n当安全功能共享时\n\n在某些组织中，CISO 不负责信息安全预算的部分内容。例如，许多安全漏洞是由未打补丁系统造成的，但在某些组织中，补丁管理不是\
  \ CISO 的责任，而是 IT 小组或 IT 服务管理小组的职责。另一个例子是安全意识。CISO 可能负责安全意识培训，但培训预算由人力资源部门管理。在各种安全相关功能不受\
  \ CISO 预算权限的情况下，CISO 可能会被要求为负责小组的预算过程提供建议。预算过程中的协作非常常见。\n\n### 制定预算\n\n正如第 1 章中涵盖信息安全组织规模的“规模”章节所讨论的，某些高管和\
  \ CISO 喜欢将组织的安全支出与其他相似组织的支出进行比较。虽然参考组织可以是一个很好的数据点，但不应将其作为确定信息安全预算的主要方法。安全预算应该是为组织提供适当水平保护所需的资金。\n\
  \n\n\n\n\n除非组织是初创公司，否则在几乎所有情况下，信息安全预算都是基于组织的历史支出的，即：“我们去年花了多少钱？”事实上，这并不是一个开启预算流程的糟糕起点。预算的核心在于预测未来，CISO\
  \ 对过去的数据越详尽，其对未来可能发生的情况的了解就越充分。这种方法在运营多年后特别有用，因为先前的学习和经验可以为 `inform-the-CISO` 哪些做法是有效的，哪些是无效的。然而，安全计划在变化、演变并面临新威胁。因此，每年的支出总会有变化。通常，最好的方法是采用自下而上的方法，首先估算最小单元的工作量，然后将这些部分整合到一个更大的计划中。低层级元素应使用基于风险并参考以往经验的方法进行估计。\n\
  \n以下是建立信息安全预算的一些方法和因素：\n\n*   **从基线开始**：使用去年的数据作为起点。CISO 不仅应该考虑去年的支出，还要考虑去年的预算。去年的预算与实际支出相比如何？从这些信息中可以学习到什么？\n\
  *   **构建工作分解结构 (WBS)**：`WBS` 是一种通过将大型工作分解为更易估计和控制的小单元，来估算所需工作量的方法。通过使用 `WBS`（在本章节后的“项目管理”部分将进行详细解释），CISO\
  \ 可以对每项活动的成本进行自下而上的估计。`WBS` 与安全组的工作流及所有其他活动一致，并应与组织收集和报告成本的方式一致。使用一种方法制定预算，却用另一种方法报告支出是毫无意义的。如果预算与成本报告的方式一致，CISO\
  \ 将能够更好地管理支出并每年改进预算流程。\n*   **查看风险评估结果**：如果防火墙管理的支出为 `X`，但测试表明防火墙经常出现配置错误，也许未来防火墙管理的支出应该高于\
  \ `X`。或者，如在第 1 章中讨论的，如果系统的年度预期损失额 (`ALE`) 为 `$10,000`，那么组织可能不应该每年花费 `$100,000` 来保护它。风险评估和分析活动的结果可以且应该为预算流程提供参考。\n\
  *   **估算解决差距的成本**：CISO 利用评估和审计结果来确定应该在何处支出。不合规区域通常需要支出来解决。事实上，`POA&M` 或 `CAP` 流程应该包含建议措施的成本估计，这些成本反过来应被纳入预算。\n\
  *   **处理生命周期成本**：许多硬件和软件项目都有定义的寿命。现代系统和技术可能会终结（即停止支持）、过时或需要升级。技术更新和维护协议的成本已包含在预算中。\n\
  *   **进行价值工程**：一个出色的 CISO 始终在考虑是否有更廉的方法来完成某事。在可以获得效率的地方可能存在机会。\n*   **确定哪些是新内容**：组织也会变化。CISO\
  \ 应该考虑新倡议、改进、引入新技术、新服务、进入新市场等。\n*   **考虑可能出现问题的情况**：坏事会且将会发生。CISO 应该为意外项目建立预算，例如安全事件、灾难或劳工罢。\n\
  *   **建立管理储备**：某些组织允许预算中留有一定的回旋地（有时被称为 `management reserve`）。这只是在需要时增加的额外金额。优秀的\
  \ CISO 不希望让自己资金短缺。\n*   **进行滚动预测**：信息安全计划预算通常按年度建立，但许多组织会创建一个超出下一年的预测。创建一个每年更新的三年期预测是常见的做法。\n\
  *   **确定预算包含哪些内容**：预算包含了 CISO 负责的所有项目。这包括硬件、软件、员工、顾问、外包服务、供应商以及安全计划中任何 CISO 被指定负责的其他项目。\n\
  *   **不仅要确定花什么钱，还要确定何时花钱**：CISO 应该确定每个 `WBS` 元素可以花费多少资金以及这些支出将在何时发生。这通常通过按每月分配成本来估算。财务和会计部门需要这些信息来估算应计和现金流。但\
  \ CISO 需要这些信息来规划活动发生的时间并批准支出。如果预算中的某项支出假设成本将分散在整年，则预算应反映支出时间线。按月分配预算允许 CISO 按照计划管理支出。\n\
  \n资本投资 vs. 费用支出\n\n在与一位 CISO 讨论托管服务时，他告诉我们他不使用此类服务，但原因并不显而易见。他的决策基于其公司的财务偏好。出于会计原因，他的公司倾向于资本支出\
  \ (`CAPEX`) 而非运营支出 (`OPEX`)，因此他被鼓励投资于基础设施而不是支付服务费。因此，他投资于在内部构建安全能力（被视为 `CAPEX`），而不是外包服务（被视为\
  \ `OPEX`）。\n\n\n\n\n首席信息安全官（CISO）使用多种策略来证明其预算请求。如前提到的，一种实用的策略是与行业其他组织的预算进行比较。虽然\
  \ CISO 过分强调行业对比来 `create` 预算并非明智之举，此类比较有时在向他人 `justifying` 预算时有所帮助。首席执行官喜欢听到自己的组织在某方面的支出少于竞争对手。如果行业对比显示确实如此，CISO\
  \ 就可以利用这些信息为自己争取优势。像 `Gartner` 和 `Forrester` 等行业来源，以及 `RSA`、`Verizon` 和 `IBM` 等供应商，都是安全支出数据的良好来源。\n\
  \n证明信息安全预算的两种常用方法是围绕风险和/或合规性来展开讨论：\n\n*   **风险**：CISO 可能已经进行了风险分析，以了解组织的资产及其对业务的价值，并利用这些信息来确定优先级，并决定在何方面以及投入多少资金来保护这些资产。这些信息也可以用于证明支出的性。如果\
  \ CEO 或预算审批者理解风险、对业务的影响与缓解该风险成本之间的关系，他们更有可能支持这项支出。\n*   **合规性**：法规是安全支出的常见强制驱动力。如果法规规定必须保护信息并规定了不合规的罚款，那么这些罚款的风险就可以证明支出的合理性。\n\
  \n### 支出管理与监控\n\n一旦预算获得批准，就可以作为监控和控制成本的基准。预算组成的单个项目（通过 `WBS` 或其他方法定义）可用于建立如何核算和跟踪成本。例如，如果\
  \ `WBS` 包含了运行安全运营中心 (`SOC`）的成本要素，财务部门可以建立一个成本账户并分配编号，以便批准并记录与 `SOC` 相关的支出。预算与实际支出之间的这种一致允许通过比较\
  \ `budget versus actuals` 来对安全财务进行控制和监控。定期将实际支出与预算进行比较是管理安全财务的关键。\n\n应为预算中的所有项目或项目组组建立成本账户。这需要\
  \ CISO 与财务或会计团队之间的紧密合作。建立成本账户包括定义谁可以批准支出以及在什么阈值下批准。成本账户的责任可能属于 CISO，或者 CISO 可能会委托其他经理批准支出。在实践中，这通过定义谁可以批准工时表、创建或批准采购订单或签署合同来实现。\n\
  \n会计团队会根据每个成本账户向 CISO 报告劳动力或费用的实际支出。如果成本账户与预算行项目一致（它们本应如此），CISO 就可以将预算中定义的计划支出与正在发生的实际支出进行比较。这显示了支出的结余或超支，并允许\
  \ CISO 据此调整未来的支出。\n\n### 安全计划资源管理：建立安全团队\n\n安全团队是 CISO 拥有的用于保护和保护组织信息资产最重要的资源。CISO\
  \ “负责驾驶”，并负责让 `right` 人员上车——这些 `right` 人员并不务必是技术技能最强的人，而是能够最好执行 CISO 愿景的人。因此，团队的合适人选可能是那些兼具技术、沟通和人际技巧，并结合性格特质的人。\n\
  \n以下是创建和维护团队的某些因素：\n\n*   **定义人员配置策略**：安全团队从定义人员配置策略开始。CISO 应该定义她想要什么样的团队，然后定义实现该目标的路径。这为团队如何配置人员提供了指导。例如，如果\
  \ CISO 想要一个高度协作的团队，但雇佣了内向的人，那么实现该目标可能是不可能的。同样，如果 CISO 决定技术知识是至关重要的，那么这应该是人员配置策略的一部分。\n\
  *   **进行工作分析**：工作分析是一个收集所有关于所需工作类型和职能可用信息的过程，这使 CISO 能够识别角色。要收集的信息包括职责、责任、成果、技术、流程、法规驱动因素、标准。收集的信息越多，CISO\
  \ 的任务就越容易。\n*   **定义职位角色并创建职位说明**：职位角色和说明用于帮助招募员工并为员工设定的预期。使用从工作分析中收集的数据，CISO 可以创建功能性描述。在某些组织中，这项活动是人力资源部门（HR）的责任，在某些情况下，CISO\
  \ 没有权限定义角色，而是必须使用 HR 定义的角色。这可能会限制 CISO 创建并使用描述作为工具来建立员工的能力。或者，这种情况也可以是 CISO 与 HR\
  \ 合作的机会。目标是拥有一套可以作为招聘和建立员工工具的描述。\n*   **使用 NICE 全力资源框架**：美国国家标准与技术研究院 (`NIST`) 为网络安全职位角色创建了一个框架，其中描述和培训要求可以在库中供任何雇主使用。它被称为网络安全教育国家倡议\
  \ (`NICE`) 网络安全工作人员框架 (`NIST Special Publication 800-181`)。CISO 可以利用这些预定义的 `work\
  \ roles` 来创建组织的安全描述。这不仅节省了 CISO 的时间，还提供了一个额外优势，即可以使用经过行业审查并随时间推移更新的角色。\n*   **定义职业路径**：许多公司用于吸引、支持和留住员工的工具之一是定义并使用\
  \ `career paths`。职业路径是定义的职位角色、培训和绩效标准的序列，员工遵循这些序列可以在留在组织内部实现职业成长。\n\n\n\n\n## 培训\n\
  与许多许多领域一样，安全格局在不断变化和演变。人们几乎需要不断接受培训，以保持其知识和技能处于最新水平。`CISO` 必须拥有培训计划和相关预算，以确保安全团队得到适当的教育。一些\
  \ `CISO` 与培训机构或学院、大学建立关系，为他们的员工提供独特的学习机会。我们认识一位 `CISO`，他每年、年年都邀请专家来教授安全认证课程，以便整个安全部门人员能够更好地获得重要的行业认证。`CISO`\
  \ 知道，他们需要在培训上进行明智投资，使员工能够实现安全计划的目标。\n\n## 处理人员和团队协作问题\n所有 `CISO` 都应该有一套计划，在不干扰运营的情况下处理人事问题。然而，大多数\
  \ `CISO` 通过试图从源头上防止问题发生来解决这个问题。正如之前提到的，实现这一目标的方法是将品格和沟通纳入招聘标准的一部分。拥有合适的人将对防止涉及关系和团队协作的问题非常有帮助。防止此类问题的其他方法包括创建一个门户以帮助团队成员协作、定义明确的角色和职责，以及定期举行跨部门会议以促进和便利更好的沟通。如果确实发生了问题，应该有记录的程序将问题提交给\
  \ `HR`、`CISO` 或两者，并规定对影响安全计划性能任何方面方面产生问题的行为采取纪分措施的规则。\n\n## 寻找优秀的 IT 安全人才真的有那么困难吗？\n\
  媒体和行业团体广泛报道，IT 安全职位的人才极度短缺。我们最近询问了一位 `CISO` 他是如何应对这种人才短缺的。他的回答是：“什么短缺？” 这位来自数十亿美元公司的\
  \ `CISO` 拥有一个庞大的团队，在过去两年中规模增加了一倍。他在扩大团队方面没有遇到任何问题。为什么？他从公司内部招聘人员。从历史上看，大多数 IT 人不想做安全工作。但现在不再了。他公司的\
  \ IT 人员渴望为他工作。他的公司鼓励员工在公司内部流动，管理层也鼓励他从内部招聘。这位 `CISO` 在小组内部创造了一种良好的文化，导致 IT 部门的人士主动找他加入安全团队。他根据性格而非经验来选择人员，因为他知道可以提供培训，以赋予他们所需的安全知识和技能。正如他所说：“你可以培训技能，但你无法培训品格。”\n\
  \n## 项目管理\n项目管理是管理层级中的最低级别（组合、计划和项目）。项目管理的目标是确保每个项目都能按时、预算内实现预期结果。项目管理包括识别和控制资源、衡量进度，并根据进展按需要调整计划。`CISO`\
  \ 可能直接担任某些或所有安全项目的项目经理，也可以由 `CISO` 委托其他人员担任项目经理。无论何种情况，`CISO` 都应该熟悉项目管理原则和技术。\n\n\
  在所有规模的项目应用良好的项目管理实践至关重要。有些组织将项目管理的精力集中在大型项目上，往往忽视小项目。如果这些小项目没有得到适当管理，最终可能会消耗组织大量的时间和资源。项目管理可能不会对所有项目都进行形式化。形式化的程度可能由项目规模或重要性决定；然而，良好的项目管理原则应适用于所有项目。\n\
  \n### 项目管理基础\n与 CIA 三要素（机密性、完整性、可用性）类似，项目管理也有一个三要素，由以下部分组成：\n\n- `Scope`（范围）：要执行的工作边界\n\
  - `Schedule`（进度）：执行工作的时间表\n- `Budget`（预算）：执行工作所需的成本和资源\n\n如果其中一个发生变化，另外两个就会受到影响。例如，`scope`\
  \ 的变化可能会影响 `budget` 和 `schedule`。这种相互依赖关系在`Figure 3-4`所示。\n\n**图 3-4：项目管理基础**\n\n\
  最终，作为一种实践的项目管理侧重于管理这些组件以实现项目目标。成功的项目是按时（`schedule`）、预算内（`budget`）完成并实现技术和业务目标（`scope`）（注：原文中有重复/错乱的部分，我已根据提供的核心内容进行了清理以确保逻辑流畅）。\n\
  \n如果其中一个发生变化，另外两个就会受到影响。例如，`scope` 的变化可能会影响 `budget` 和 `schedule`。\n\n### 项目管理思考\n\
  项目管理和软件/系统开发中有一句老话：“好、快、便宜——三选二。”这是对现状的简单描述，但是一个重要的说明性概念。其核心思想是，虽然目标始终是在这三个原则之间取得平衡，但有时两个原则必须优于另一个。在每个项目中，都必须就哪个原则最重要做出关键决策。目标是一个高质量的最终产品（好）、开发成本低（便宜），还是交付快速（快）？这总是存在权衡，正如`Figure\
  \ 3-5`所示：\n\n- `Good + cheap` = 交付慢\n- `Cheap + fast` = 质量差\n- `Fast + good` = 昂贵\n\
  - `Fast + good + cheap` = 理想平衡点 (sweet spot)\n\n**图 3-5：好、快、便宜——三选二**\n\n\n\n\n\n\
  - 组合管理专业人士 (PfMP)\n- 项目管理认证初级人员员 (CAPM)\n- PMI 业务分析专业人士 (PMI-PBA)\n- PMI 敏捷认证实践师\
  \ (PMI-ACP)\n- PMI 风险管理专业人士 (PMI-RMP)\n- PMI 计划专业人士 (PMI-SP)\n\n## AXELOS\n\nAXELOS\
  \ 是一家全球性的最佳实践组织，在多个领域提供认证和培训，包括项目管理、IT 服务管理和网络安全。AXELOS 的认证体系包括以下内容：\n\n- IT 服务管理\
  \ (ITIL)\n- 网络韧性 (RESILIA)\n- 受控环境项目方法 (PRINCE2)\n- PRINCE2 敏捷版\n- AgileSHIFT\n\
  - 成功计划管理 (MSP)\n- 风险管理 (`M_o_R`)\n- 组合、计划与项目办公室 (P3O)\n- 投资组合管理 (MoP)\n- 价值管理 (MoV)\n\
  \n## 项目管理阶段\n\n良好的项目管理通过分配适当资源、提供领导力以及对可能导致项目偏离轨道的事件进行规划，使项目朝着正确的方向发展。项目由一个或多个阶段组成，这些阶段共同代表项目中涉及的活动和任务。应该实施项目管理以确保项目的每个阶段都得到遵循。这是通过选择和遵循项目管理模型来实现的。有很多项目管理模型可供选择。书中概述的模型基于\
  \ PMI 项目管理知识体系（`PMBOK`）过程组，该体系在图 3-6 中概述，包括以下内容：\n\n![Images](img/F03-06.jpg)\n\n\
  **图 3-6** 项目管理阶段\n\n- **启动**：识别业务需求并定义项目。\n- **规划**：制定计划以确保项目满足范围、、成本成本目标。\n- **执行**：协调资源以执行项目计划。\n\
  - **监控与控制**：衡量项目性能，监控偏差并采取纠正措施。\n- **收尾**：对项目进行正式验收和组织化的收尾。\n\n虽然这些阶段是顺序讨论的，但在实践中，它们可以按顺序、迭代或并发的方式实施。在图\
  \ 3-6 所示的模型中，监控和控制过程贯穿整个项目。在实践中，监控和控制过程发生在执行阶段，并在某种程度上发生在启动、规划和收尾阶段。此外，在某些组织中，启动和规划阶段可能会同时发生。项目管理过程组可以进行定制以适应组织的需求。在本节中，我们将通过分解这些每个过程并讨论每个过程的组件来研究项目管理。\n\
  \n![Images](img/note.jpg)\n\n**注意**尽管本节讨论的项目管理模型基于 PMI `PMBOK` 过程组，但本节并不旨在完全与 `PMBOK`\
  \ 处理项目管理的方法保持。本节的编写基于作者观察项目管理在实践中如何运用的经验。\n\n## 启动\n\n在项目开始之前，必须在启动阶段完成前期工作。首先，必须识别业务需求或问题，并讨论潜在的解决方案。根据解决方案的可行性，这可能需要创建一个项目。启动阶段发生的关键举措包括以下：\n\
  \n- 收集需求\n- 定义项目范围\n- 识别并访谈利益相关者\n- 定义假设和约束\n- 建立总项目预算和时间表\n- 开发项目范围文档\n\n### 收集需求\n\
  \n每个项目都必须有一组 `requirements`，即为了满足项目目标而在最终交付物中所需的能力或项目集合。`requirements` 为定义项目范围提供了基础。收集\
  \ `requirements` 所需的工作可以视情况而异。在某些情况下，`requirements` 由客户提供或在项目开始之前定义。在其他情况下，`requirements`\
  \ 是作为项目的一部分开发的。所提供的 `requirements` 在细节上可能有所不同，可能需要额外的信息收集会议。\n\n### 定义项目范围\n\n作为项目启动的一部分，对待办工作设定某些边界是重要的。项目的\
  \ `scope` 定义了包含和不包含的内容。`scope` 包含项目目标、需求、利益相关者、进度表和预算。一个定义良好、、记录在案且受监控的 `scope`\
  \ 是项目成功的重要因素。定义不良的项目范围可能会导致以下一种或多种情况：\n\n- **范围蔓延**：由于增加了需求和愿望，导致项目范围不受控制的增长。\n\
  - **成本超支**：项目执行过程中产生的超出预算的意外成本。\n- **进度超期**：项目执行过程中产生的意外进度延误。\n\n范围在 `project scope\
  \ document` 或 `scope statement` 中定义，该文档描述了项目交付物和成果。\n\n### 识别并访谈利益相关者\n\n作为项目启动的一部分，应当识别并访谈利益相关者，并评估他们的需求。`stakeholders`\
  \ 是对项目有既定利益或权益的人。这包括内部和外部利益相关者。\n\n- **内部利益相关者**：组织内部的人员，如团队成员、部门经理、高管等。\n- **外部利益相关者**：组织外部的人员，如客户、供应商、用户、承包商、供商或投资者。\n\
  \n识别 `stakeholders` 并记录他们的细节，至少包括姓名、角色、联系信息和关注领域。例如，某些利益相关者可能正在执行工作，另一些人可能受到工作的影响，另一些人可能是接收方，例如客户、业务所有者或投资者。利益相关者的识别通常通过访谈、教训总结、脑暴会议或使用清单完成。利益相关者有时根据他们的影响、兴趣和权力进行分类。具有高度影响兴趣且能直接影响项目输出的利益相关者被称为\
  \ `key stakeholders`。\n\n### 定义假设和约束\n\n在启动阶段，应该捕获并记录可能的假设和已知约束。这些构成了项目规划的基础。\n\n\
  - **假设**：基于知识或经验的规划中的信念或预期，可能是不确定的、非真实的（例如，假设资源 `X` 在项目期间可用）。\n- **约束**：对项目进度、资源、质量、预算、范围或风险的限制或规定，可能会在执行期间影响项目（例如，资源\
  \ `X` 只能在周末进行测试）。\n\n\n\n\n\n假设和约束在启动阶段会以高层级进行记录，并在整个项目生命周期内进行跟踪。假设是可能被证明错误的信念，而约束则是对项目执行的限制或障碍。两者都可能增加项目风险并影响项目需求，这就是为什么在整个项目中对它们进行记录、分析和监控至关重要的原因。\n\
  \n## 建立项目总预算和时间表\n\n启动阶段包括讨论和估算项目的初始预算。在启动阶段，预算可能并不详细；然而，对项目的总预算有一个估算是至关重要的。此外，还需要讨论并估算项目时间表，以预测结果通常何在何时交付。\n\
  \n## 开发项目范围文档\n\n启动阶段描述的所有组件都应该被捕获，并将信息整合到项目范围文档中。`project scope document` 捕获了关于项目的所有范围数据和高层决策，并通常至少包含以下内容：\n\
  \n* 范围定义\n* 利益相关者输入\n* 假设和约束\n* 预算和时间范围\n* 初始计划和资源\n\n`project scope document` 也称为`范围声明`（scope\
  \ statement）。项目范围文档的目的是记录项目的边界。这用于确保项目不会出现导致范围蔓延（scope creep）的偏差，并有明确的项目目标，以便成功是可见的。\n\
  \n## 规划\n\n规划阶段包含以下组件：\n\n* 确定 SDLC 方法论\n* 开发可衡量目标\n* 开发工作分解结构\n* 开发项目进度\n* 分配项目资源和预算\n\
  * 评估项目风险\n* 记录项目计划\n\n### 确定 SDLC 方法论\n\n规划阶段的一个重要步骤是决定使用哪种方法和技术来管理项目。这一决定可能受组织的项目管理标准和偏好方法论的约束，也可能由项目经理自行决定。这种确定包括考虑是否遵循系统开发生命周期。\n\
  \n如前所述，本章概述的项目管理模型包括启动、规划（本节的主题）、执行、监控和控制，以及结束过程。在这一模型中，如果项目涉及开发或管理某个系统、产品或服务，项目经理可能会选择引入`系统开发生命周期\
  \ (SDLC)`，以建立一种在（通常是）规划和执行阶段要遵循的方法论。本节讨论的系统开发生命周期包括`瀑布`方法、`增量式`和`敏捷`。\n\n![Images](img/note.jpg)\n\
  \n**注意** 并非所有项目都在项目流程中使用 SDLC。例如，如果首席信息安全官（CISO）正在管理一个将公司安全控制映射到 `NIST SP 800-53`的项目，CISO\
  \ 可能会遵循项目流程（启动、规划、执行、监控和控制以及结束），但很可能不会使用 SDLC，因为没有开发任何系统、产品或服务。然而，如果项目包括开发和实施新的控制措施（例如安全工具、系统或应用程序），CISO\
  \ 可能会在项目过程中引入 SDLC。\n\n**传统/分阶段/瀑布式** 分阶段生命周期的特点是具有线性顺序的明显步骤，每个步骤在开始后续步骤之前必须完成。这种方法也常称为`传统`或`瀑布`方法。在该模型中，项目范围、进度和预算是在项目开始时（规划阶段）确定的。范围在进入项目时是固定的，进度和预算的变化在整个过程中都经过仔细管理。关键因素是，在开始后续阶段之前，必须执行、记录并完成每个阶段的所有。这一概念在图\
  \ 3-7 中所示。该模型非常强调前期的规划和管理。\n\n![Images](img/F03-07.jpg)\n\n**图 3-7** 瀑布生命周期方法论\n\
  \n![Images](img/F03-08.jpg)\n\n**图 3-8** 增量式模型\n\n这种模型适用于具有预测性开发且需求明确、良好的项目。这种方法的缺点是缺乏灵活性，因为它假设需求可以在开始时定义；对于需求不确定或不完整的项目，这种方法是有害的。如果后期需要更改会导致成本大幅增加。\n\
  \n**增量式** 在`增量式`生命周期中，执行多个开发生命周期。每个生命周期都有预定的时间并产生完整的功能。然后将该功能与前一个阶段集成以产生整个产品。这一概念在图\
  \ 3-8 中所示。\n\n**敏捷** `敏捷`是多种开发方法的总术语，这些方法利用迭代和增量开发过程，并鼓励团队协作。敏捷方法不是在前期进行详细需求后进行僵化的开发，而是在过程中结合迭代模型来实现速度和灵活性。在敏捷方法中，产品开发工作被分解为计划的迭代，称为`迭代`。这一过程在图\
  \ 3-9 中所示。每个迭代的长度不一，但迭代通常为两到四周。范围在迭代开始之前定义。\n\n![Images](img/F03-09.jpg)\n\n**图\
  \ 3-9** 敏捷方法\n\n![Images](img/exam.jpg)\n\n**考试提示** CCISO 候选人应该熟悉各种开发周期方法论。\n\n\
  ### 开发可衡量目标\n\n规划阶段的关键部分是开发可衡量的目标。这些目标用于开发整个项目中监控和控制阶段使用的指标，以衡量成功、识别需要纠正措施的偏差并确定项目何时完成。如果没人知道成功的标准，项目就无法判定成功。设定和衡量目标的方法之一是第\
  \ 2 章中提到的`S.M.A.R.T.`。\n\n### 开发工作分解结构\n\n项目规划的首要活动之一是将较大的项目分解为更小、更容易管理的区块或努力。这些被定义为之前介绍的`工作分解结构\
  \ (WBS)`的一部分，WBS 是项目团队为实现和交付项目目标而执行的工作的层次结构分解。WBS 是一种项目管理工具，用于将项目分解为组织的单个工作元素（任务、子任务和交付物）。图\
  \ 3-10 展示了图形 WBS 的表示形式；然而，WBS 也可以是简单的任务列表。\n\n![Images](img/F03-10.jpg)\n\n**图 3-10**\
  \ 工作分解结构示例\n\n\n\n\n\n其核心思想是将 `WBS` 中的每个元素或任务进行拆解，并为其分配相应的预算、资源、范围和进度。这是组织一切的方法之一。创建良好的\
  \ `WBS` 关键在于包含适当的详细程度。如果 `WBS` 细节过多，项目经理将拥有很强的控制力和周全的计划，但可能会陷入管理开销和工作过载中。如果 `WBS`\
  \ 不够详细，项目经理的控制力就会较弱，计划也会模糊，这会导致范围蔓延、预算超支和进度延误。\n\n工作分解结构可以是`面向功能`的，也可以是`面向任务`的。例如，一个面向功能导向的\
  \ `WBS` 会根据项目的每个阶段定义任务，例如：\n\n• 分析、设计、构建、测试\n• 计划、执行、检查、行动\n• 启动、计划、执行、监控、结束\n\n\
  面向任务导向的 `WBS` 则按任务、配置项或需要构建的项目进行组织，例如：\n\n• 选择扫描工具、实施工具、执行扫描、调整配置文件和策略\n• 资产清单、硬件、软件、网络、数据\n\
  • 用户界面、通信栈、数据库、中间件\n\n面向功能和面向任务的 `WBS` 都有用处。使用哪种类型的决策最终取决于项目经理的风格或偏好，以及对于项目和组织来说合理的。\n\
  \n### 开发项目进度\n\n一旦开发了 `WBS`，就会将预算和进度分配给 `WBS` 中的每个元素。在制定项目进度时，考虑以下因素非常重要：\n\n• **资源和时长**：每个特定元素涉及哪些资源？预计持续多久？\n\
  • **依赖关系**：依赖关系是什么？每个特定项目/元素需要什么？\n\n在规划阶段的这一部分时，项目经理开始清晰地看到哪些活动处于关键路径上。`关键路径`是指如果发生变化将改变项目整体结束日的系列事件或活动。如果关键路径上的任何一个活动延迟，整个项目的交付截止日期就会受到影响。项目经理必须始终关注关键路径上的项目。\n\
  \n记录和可视化项目依赖关系的一种方法是使用`甘特图`，这是一种说明项目进度并显示任务依赖关系的图表。它是可视化所有必须作为其他任务输入的任务输出的绝佳方法。它显示了哪些任务必须先完成，其他任务才能开始。这有助于项目经理识别项目依赖关系，并概念化和可视化关键路径上的项目。`Microsoft\
  \ Project` 是一种流行的项目规划工具，使用`甘特图`来帮助规划和显示项目进度。图 3-11 展示了 `Microsoft Project` 中甘特图的高级示例。\n\
  \n![Images](img/F03-11.jpg)\n\n**图 3-11** Microsoft Project 中的甘特图示例（带关键路径）\n\n###\
  \ 分配项目资源和预算\n\n一旦创建了 `WBS` 和项目进度，就会为每个项目元素分配资源和预算。规划阶段的这通常是决定使用内部资源还是外部资源，以及构建、购买还是租用的阶段。以下是一些考虑因素：\n\
  \n• **内部资源**\n- 为每个 `WBS` 元素选择并分配资源\n- 根据可用资源调整 `WBS`\n- 可能需要招聘新员工或对员工进行新培训\n- 可能需要采购硬件和软件\n\
  • **外部资源**\n- 如果时间/资源允许，进行竞争性选择过程\n- 建立合同和工作说明书 (`SOWs`)\n- 定义交付物、里程碑和义务\n- 建立服务水平协议\
  \ (`SLAs`)\n\n#### 责任矩阵\n\n可以使用`责任矩阵`来界定满足项目交付物所需的所需的每个活动或任务的责任。责任矩阵通常被称为 `RACI\
  \ 图表`，其缩写代表以下含义：\n\n• **负责（Responsible）**：负责完成特定项目任务或活动的个人\n• **认可（Accountable）**：通常意味着对某项活动或任务负责管理\n\
  • **咨询（Consulted）**：就特定活动或任务咨询意见的人员，通常是领域专家 (SMEs)\n• **知情（Informed）**：被告知特定任务或活动进展的人\n\
  \n图 3-12 显示了一个高级 RACI 图表的示例。\n\n![Images](img/F03-12.jpg)\n\n**图 3-12** RACI 图表示\n\
  \n### 评估项目风险\n\n每个项目都有某种程度的风险。在项目管理的背景下，风险指的是项目风险而非信息安全风险。`项目风险`是指项目过程中可能发生并对项目成功产生不利影响的事物。项目风险应在规划阶段考虑，并在整个项目过程中进行管理。应进行初始的`项目风险评估`以理解和预测潜在的项目风险。应对对感知的项目风险进行识别、分析，并在风险排名中进行排序。有三类需要考虑的通用风险：\n\
  \n• **技术**：由于技术原因未能满足要求的风险\n• **进度**：由于内部或外部因素（如供应商未按时交付）导致错过截止日的风险\n• **预算**：由于估计不准确或范围蔓延导致超支的风险\n\
  \n初始项目风险评估之后，将确定应该采取哪些行动来减少或缓解对项目的风险。\n\n#### 编写项目计划\n\n规划阶段的最后一步是编写项目计划。项目计划作为活动路线图，分发给项目团队并遵循，同时向利益相关者沟通。项目计划至少应涵盖以下组件：\n\
  \n• 范围管理计划\n• 进度管理计划\n• 资源管理计划\n• 成本管理计划\n• 质量管理计划\n• 变更管理计划\n• 配置管理计划\n• 通信计划\n\
  • 风险管理计划\n• 系统安全计划\n\n组织可能使用像简单的 Word 文档或 Excel 表格作为项目计划，也可能实施更复杂的项目规划工具，例如带有后端数据库的应用程序，提供\
  \ Web 门户来管理任务和存储文档。选择取决于组织的需求、复杂程度以及项目的复杂性。计划可以通过许多方式进行记录和管理。关键在于它必须被记录下来。\n\n取决于组织及其项目管理实践，规划阶段开发的项目计划和启动阶段开发的项目范围文档可能是同一份文档。无论何种，在项目的整个生命周期内必须制定并遵循某种计划。坚持计划对于防止范围蔓延至关重要。\n\
  \n### 执行\n\n一旦完成规划，就可以在项目执行阶段遵循计划执行了。该阶段是根据工作说明书中描述的项目范围创建并生产交付物的。此阶段包括以下活动：\n\n\
  • 遵循计划，执行项目任务并管理项目预算\n• 实施变更并跟踪项目进度\n• 向利益相关者和其他利益相关方沟通并报告进度\n• 向团队内部和管理层汇报状态\n\
  • 强化员工和供应商的责任\n\n\n\n\n记住根据需要调整计划非常重要。没有任何项目是完全按照计划进行的。项目管理实际上就是关于规划以及在需要时进行战略性调整。\n\
  \n## 监控与控制\n\n生命周期中的监控和控制阶段侧重于监控和控制关键项目变量。虽然该阶段在执行阶段之后顺序讨论，但在实践中，该阶段贯穿项目的整个周期。监控和控制包括以下活动：\n\
  \n• 监控和管理范围蔓延\n• 监控和管理项目预算\n• 监控、跟踪并报告关键绩效指标 (`KPIs`)\n• 处理变更请求\n• 跟踪项目差异\n• 跟踪并报告项目指标和性能\n\
  • 监控和管理成本、进度、资源利用率、预算和风险\n\n本节讨论了整个项目生命周期内必须进行的监控和控制的一些关键方面，包括配置管理、变更管理和质量管理。\n\n\
  ### 配置与变更管理\n\n在每个项目中纳入配置管理和变更管理是非常重要的。`configuration management`由用于管理产品或交付物的需求、规范和标准配置的过程和工具组成。`change\
  \ management`由用于识别、跟踪、监控和控制项目计划及基线变更的过程和工具组成。\n\n`configuration management plan`定义了对交付物配置变更的过程。它记录了需要正式变更控制的可配置项，并描述了控制这些变更的过程。`change\
  \ management plan`记录了管理项目变更的过程，并描述了如何对变更进行监控和控制。\n\n用于配置和变更管理的流程记录在各自的计划中，并在项目生命周期的规划阶段纳入项目计划。随后在整个项目范围内对配置和变更管理过程进行监控和控制。\n\
  \n### 质量管理\n\n项目`quality management`是确保所有项目活动符合定义的卓越标准的实践。它涉及定义质量标准并建立流程，以确保这些标准正确应用于项目。`quality\
  \ management system` (`QMS`)是一个旨在确保达到预期质量水平的过程和活动的集合。`QMS`包含了质量保证和质量控制实践，如图 3-13\
  \ 所示。这些术语在质量管理的讨论中有时互换使用，但存在一些关键区别：\n\n![Images](img/F03-13.jpg)\n\n**图 3-13** 质量管理概念\n\
  \n• `Quality assurance` (`QA`) 侧重于通过在整个`process`中衡量和控制质量的系统，主动`prevention`项目缺陷\n\
  • `Quality control` (`QC`) 侧重于根据质量保证标准对`deliverable`中的缺陷进行`detection`\n\n关于项目期间期间如何处理质量管理的决策记录在规划阶段的质量管理计划中，纳入项目计划，并在整个项目生命周期内进行监控和控制。本节讨论了质量管理的两种常用方法论：西格玛和\
  \ ISO 9000 标准族。\n\n`Six Sigma` 西格玛是一种过程改进方法，侧重于通过统计方法衡量运营效率并减少波动、缺陷和浪费来提高过程质量。它最初由摩托罗拉开发，目标是识别和消除制造过程中的缺陷。过程的成熟度由西格玛评分描述，该评分表示过程包含的缺陷百分比。西格玛项目使用`DMAIC`和`DMADV`项目方法论，这些方法基于德明的`计划-执行-检查-行动`\
  \ (`PDCA`)循环。`DMAIC`代表“定义、测量、分析、改进、控制”，“DMADV”代表“定义、测量、分析、设计、验证”。虽然西格玛方法最初用于制造业，但它已经演变并被许多行业和业务部门使用。一些组织使用西格玛通过衡量不同安全控制和过程的成功因素来提高安全保证。\n\
  \n`ISO 9000` 第 1 章和第 2 章讨论了`ISO/IEC 27000`标准族，侧重于实施信息安全管理体系 (`ISMS`)。`ISO 9000`标准族关注质量管理的各个方面以及实施`QMS`。这些出版物提供了指南和工具，帮助组织满足客户对交付物的需求，同时确保质量得到管理和改进。ISO\
  \ 9000 标准族的主要出版物概述如下：\n\n• `ISO 9000` 质量管理体系 – 基础和术语\n• `ISO 9001` 质量管理体系 – 要求\n\
  • `ISO 9004` 质量管理 组织质量 – 实现持续成功的指南\n• `ISO 19011` 管理体系审核指南\n\n此外，还有基于`ISO 9001`的行业特定标准，包括以下内容（缩写标题表示其应用领域）：\n\
  \n• `ISO 13485` 医疗器械\n• `ISO/TS 54001` 各级政府的选举组织\n• `ISO 18091` 地方政府\n• `ISO/TS\
  \ 22163` 轨道组织\n• `ISO/TS 29001` 石油、石油化工和天然气行业\n• `ISO/IEC/IEEE 90003` 软件工程\n\n###\
  \ 结束\n\n项目的最后一个阶段是`project closing`。结束阶段包括以下活动：\n\n• Review 范围文档以确保满足需求\n• 确保利益相关者对交付物签字\n\
  • 结束合同、处理并支付发票、停止项目支出\n• 更新最终成本会计\n• 安全处置项目材料，因为某些记录可能包含敏感信息\n• 归档以后参考的项目记录\n• 进行教训总结，包括利益相关者的反馈\n\
  • 释放并重新分配资源\n\n适当结束阶段允许对项目进行最终审查和验收，结束合同和财务活动，并释放资源。虽然特定的项目可能已经完成，但可能有另一个项目在等着，需要那些已经投入的资源。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** CCISO 候选人应熟悉项目管理的通用阶段及相应的活动。\n\n#### 项目监督\n\
  \nCISO 通常不负责积极管理每个安全项目。CISO 参与项目监督，但可能会聘请其他资源（如安全项目经理、副 CISO 或其他员工）作为项目经理。\n\n\n\
  \n\n# 章节回顾\n\nCISO（首席信息安全官）负责管理组织的信息安全计划。安全计划的关键方面包括：安全重点领域（影响工作流和安全项目实施的内部和外部因素，例如\
  \ `PCI DSS`、`HIPAA` 以及内部策略和要求）；安全工作流（子计划，如`漏洞管理计划`、`事件响应计划`和`风险管理计划`，通常使用 `PDCA`\
  \ 方法管理）；安全项目管理；资产和数据安全管理；以及安全计划的预算和资源管理。以一种凝聚且协调的方式管理这些元素并非易事，需要周全的方法。\n\n项目管理是\
  \ CISO 必须掌握的关键技能。尽管 CISO 通常不是每个安全项目的项目经理，但 CISO 必须对信息安全计划内开展的项目进行监督并承担责任。项目管理的三要素包括\
  \ `scope`、`schedule` 和 ``budget`。如果其中一个组件发生变化，另外两个通常也会受到影响。项目遵循项目管理模型，该模型通常包括启动、规划、执行、监控和控制以及结束过程。\n\
  \n# 快速回顾\n\n* 安全计划管理侧重于监督和管理安全重点领域、安全工作流、安全项目、资产数据安全以及安全计划的预算和资源。\n* 安全重点领域是组织的内外部驱动因素，影响工作流和安全项目的实施，例如\
  \ `PCI DSS`、`HIPAA` 以及内部策略和要求。\n* 信息安全计划的安全工作流（又称子计划）是持续进行的、没有固定开始、中间和结束的活动，例如身份访问管理、漏洞管理和事件管理。\n\
  * 项目管理的三要素包括 `scope, schedule, and budget`。\n* 传统的项目管理模型由以下过程组成：启动、规划、执行、监控和控制以及结束。\n\
  * 项目范围（Scope）定义了项目的边界。它是满足客户需求所需的工作。\n* 范围蔓延（Scope creep）是指由于需求、欲望或目标的增加导致项目范围不受控制的增长。\n\
  * 系统开发生命周期（`SDLC`）指的是项目中与系统、软件、服务或产品开发相关的阶段。`SDLC` 通常发生在项目管理模型的规划和执行过程中。\n* `SDLC`\
  \ 模型包括瀑布式、迭代式、增量式和敏捷式。\n* 工作分解分解结构（`WBS`）是项目团队为实现并交付项目目标而需执行的工作的分层分解。它是一种项目管理工具，用于将项目分解为组织良好的单个工作元素（任务、子任务和交付物）。\n\
  * 项目的关键路径是指一系列事件或活动，如果这些活动发生变化，将改变项目的整体结束日期。\n* 甘特图（`Gantt chart`）说明了项目进度并显示了任务之间的依赖关系。\n\
  * 责任分配矩阵或 `RACI chart` 可用于界定满足项目交付物的每个活动或任务的责任。`RACI` 是负责（Responsible）、认可（Accountable）、咨询（Consulted）和知情（Informed）的缩写。\n\
  * 配置管理侧重于需求、规范和标准配置。\n* 变更管理侧重于识别、跟踪和控制变更。\n* 六西格玛（Six Sigma）是一种过程改进方法，通过减少缺陷和浪费来关注质量。\n\
  * `ISO 9000` 系列标准关注质量管理。\n\n## 问题\n\n**1.** 以下哪项是子计划的示例？\nA. 网络监控\nB. 事件检测\nC. 身份管理\n\
  D. 渗透测试\n\n**2.** 在创建预算时，以下哪项因素最不重要？\nA. 安全感知\nB. 劳动力成本\nC. 工作流\nD. 安全部门\n\n**3.**\
  \ 以下哪项不是良好的使用方法？\nA. 职业路径\nB. 技术技能\nC. 决定离开项目\nD. 协作环境\n\n**4.** 决定子计划执行好坏至关重要的是？\n\
  A. 双人规则\nB. 成功标准\nC. 外部专家\nD. 人员配置\n\n**5.** 关于项目管理的陈述中，哪一项最准确？\nA. 项目管理只对小型项目重要。\n\
  B. 项目管理对大型项目很重要，而计划管理对持续项目很重要。\nC. 项目管理只对大型项目重要。\nD. 项目管理对所有规模都很都很。\n\n**6.** 哪个术语描述了项目需求不受控制的增长？\n\
  A. 相关利益者输入\nB. 范围蔓延\nC. 定义蔓延\nD. 有机增长\n\n**7.** 以下哪项描述了项目管理中的关键路径？\nA. 一旦改变将改变项目结束日期的活动\n\
  B. 将改变项目结束日期的活动\nC. 对项目至关重要的活动\nD. 对项目不重要的活动\n\n**8.** 一位 CISO 在审查当前安全项目时发现，网络设计的安全项目经理没有使用批准的\
  \ `WBS`。这是哪种情况？\nA. 范围蔓延\nB. 瀑布法\nC. 备用 WBS\nD. 未遵循计划\n\n**9.** 哪些活动应该在项目结束时进行？\n\
  A. 进行教训总结\nB. 概述范围\nC. 需求收集\nD. 继续向项目计费\n\n**10.** 计划（Program）和项目（Project）之间的主要区别是什么？\n\
  A. 没有区别。\nB. 计划由项目组成，项目由活动组成。\nC 与计划不同，项目没有终点。\nD. 一个计划可能包含多个项目，而项目只包含一个项目。\n\n\
  # 答案\n\n1. **A**\n2. **A**\n3. **C**\n4. **B**\n5. **D**\n6. **B**\n7. **A**\n8.\
  \ **D**\n9. **A**\n10. **D**\n\n\n\n\n\n## 2. B. 开始信息安全预算流程的一个良好方法是查看去年的支出（包括所有人力成本），并以管理层能够理解的语言他们提交预算。扩大安全团队的意愿不应成为定义安全预算的因素。\n\
  \n## 3. C. 组织不应因为担心员工离开公司而限制员工培训。这始终是一个风险，但如果员工没有经过适当培训，组织将无法建立一支强大的团队。提供职业发展、根据性格选择人才以及鼓励沟通都是很好的做法。\n\
  \n## 5. B. 虽然访谈子计划人员一直是个好主意，但确定安全子计划执行好坏的最本质方法是建立成功标准并根据这些标准进行衡量。\n\n## 6. D. 虽然项目可能看起来微不足道，但项目管理对于所有规模的项目都至关重要，而不仅仅是大型项目。\n\
  \n## 7. B. 范围蔓（Scope creep）描述项目范围不受控制的增长。\n\n## 8. A. 项目的关键路径是一系列事件或活动，如果这些活动发生变化，将改变项目的结束日期。如果关键路径中的任何活动被延迟，整个项目交付的结束日期就会受到影响。\n\
  \n## 9. D. 安全项目经理没有使用批准的工作分解结构（WBS）是员工未遵循批准计划的示例。范围蔓延是指范围在项目期间的增加，而瀑布模型是一种软件开发方法。备用\
  \ WBS 是一个错误的选项，旨在作为干扰项。\n\n## 10. A. 项目收尾中的经验教训部分经常被忽视。这是一项从过去的错误中学习并改进未来项目的关键活动。\n\
  \n## 11. D. 一个个计划可能由多个项目组成，而一个项目是自包含的。\n\n# 第 4 章\n\n## 信息安全核心能力\n\n本章讨论了以下主题：\n\
  \n* 恶意软件与攻击\n* 社会工程学\n* 资产安全\n* 数据安全\n* 身份与访问管理\n* 通信与网络安全\n* 密码学\n* 云安全\n* 物理安全\n\
  * 软件开发安全\n* 取证、事件处理与调查\n* 安全评估与测试\n* 业务连续性与灾难恢复\n\n本章讨论了每个 CISO（首席信息安全官）都应该深入理解的核心能力。这些主题在技术深度上各不相同，从更具管理性质的能力（如安全评估与测试）到极具技术性的能力（如密码学）。CISO\
  \ 并不一定是这些每个领域的专家，但成为专家也无害处。CISO 对这些 IT、业务和安全主题的理解越深，CISO 在做出决策和应对问题时的装备就越充分。\n\n\
  ![图表](img/note.jpg)\n\n**注意** 在某些组织中，这些核心能力中的某些可能不属于 CISO 的职责范围。例如，并非所有的 CISO 都负责组织的物理安全或业务连续性规划。这些领域可能是其他领导人员的职责，或者可能与其他部门共享。\n\
  \n## 恶意软件与攻击\n\n第 1 章 描述了攻击者在典型的网络攻击期间通常执行的以下步骤：\n\n1. 侦察\n2. 枚举\n3. 利用\n4. 实施目标\n\
  \n在利用步骤，攻击者利用漏洞获取系统的访问权限，并最终转向执行攻击者的攻击目标。很多时候，这种活动涉及`weaponization`（武器化），即部署恶意软件、脚本或其他手段来利用一个或多个系统。本节探讨了以下类型的武器化：\n\
  \n* 恶意软件\n* 脚本与特定漏洞的攻击\n\n恶意软件和网络攻击的格局是广阔且不断变化的。本节绝不是恶意软件及相关攻击的详尽或彻底汇编。相反，它描述了安全专业人员遇到的主要类型的武器化攻击。\n\
  \n![图表](img/exam.jpg)\n\n**考试贴士** CCISO 考试可能不包含关于特定类型攻击的问题。然而，我们包含了这一节，是因为每个 CISO\
  \ 都应该对攻击如何计划和执行有良好的理解，以便能够采取适当的防御。\n\n### 恶意软件\n\n`Malware` 是 `malicious software`（恶意软件）的缩写，是指任何旨在渗透并获取计算机系统未经授权的访问，以造成破坏或干扰的软件。攻击者使用恶意软件来破坏系统并执行如下目标：\n\
  \n* 记录用户的击键次数以捕获密码和其他敏感信息\n* 使用间谍软件收集敏感信息进行转售\n* 执行钓鱼攻击\n* 执行勒索软件攻击，强制用户支付赎金以防止其数据丢失或销毁\n\
  * 进行拒绝服务攻击以干扰业务运营\n* 将互联网流量重定向到非预期的或恶意网站\n\n本节描述了以下类型的恶意软件：\n\n* 病毒\n* 特洛伊木\n* 蠕虫\n\
  * 僵尸网络\n* 勒索软件\n* 根内核包（Rootkits）\n\n#### 病毒\n\n`virus`（病毒）是一种程序或代码段，它会感染合法程序以执行其工作。病毒使用其他程序作为载体来交付其负载或自我复制。`payload`（有效负载）是病毒中执行恶意活动的部分，例如删除、外泄或加密数据、修改文件或发送垃圾邮件。以下是几种常见的病毒类型：\n\
  \n**宏病毒**：许多应用程序具有宏功能，允许用户创建和使用自动化执行的脚本。Microsoft Word 和 Excel 是具有宏能力的常用应用程序。每个宏都是一个被执行以完成任务的脚本，并且可以编写执行恶意任务的宏。宏还可以复制自己并感染应用程序使用的其他文件。\n\
  \n**压缩病毒**：该术语用于识别嵌入在压缩文件中的病毒。当用户解压缩文件访问其内容时，病毒就会执行并执行其恶意任务。\n\n**隐形病毒**：隐形病毒隐藏其自身的存在以及它对受感染文件或系统所做的坏事。隐形病毒的设计使其很难被检测。\n\
  \n**多态病毒**：与隐形病毒类似，多态病毒隐藏自己以避免检测。它通过在每次运行时更改自身（实际上是更改代码）来实现。因此，旨在寻找特定程序或文件的病毒软件将无法发现病毒，因为它每次看起来都不一样。\n\
  \n**引导区病毒**：这是插入磁盘引导区的恶意代码。在安装时，病毒会移动引导区的数据或用新信息覆盖它。当系统重启时，恶意代码就会被执行。\n\n**复合病毒**：同时感染引导区和系统中其他文件的病毒被称为`multipartite`。\n\
  \n其他类型的病毒还包括`瞬态病毒`（它仅在其宿主程序运行时运行）和`驻留病毒`（它驻留在内存中，即使在宿主程序关闭也能保持活跃）。\n\n#### 特洛伊木、蠕虫与僵尸网络\n\
  \n其他类型的恶意软件与病毒相似，但具有不同的特征和功能。以下是其中几种：\n\n\n\n\n\n- **木洛马**：木洛马（Trojan）是一种恶意程序，它通过伪装成合法的程序来欺骗用户运行它。有时木洛马会包含用户想要运行的实际程序，因此当程序看起来运行正常时，实际上也在运行恶意代码。\n\
  - **蠕虫**：蠕虫与病毒相似，但与病毒不同，它能够自我复制。病毒需要宿主程序才能感染，而蠕虫则可以独立存在，不需要宿主程序即可造成破坏或自我复制。蠕虫通常通过已知漏洞进入系统，一旦进入就可以扫描网络寻找其他存在漏洞的计算机并传播到它们。某些蠕虫不会尝试对系统进行任何更改；其工作仅仅是传播到其他系统，并通过增加网络流量来造成干扰。\n\
  - **僵尸网络**：僵尸网络是一组协同工作执行攻击的受感染系统。僵尸网络通常由网络犯罪分子远程控制，以实施拒绝服务（DoS）攻击或旨在窃取数据或发送消息的攻击。远程控制通过某种形式的命令控制系统实现，使攻击者能够作为一个整体控制僵尸网络。有时僵尸程序被用于创建“僵尸”计算机网络，通过远程控制执行几乎任何类型的操作。\n\
  \n## 众常见的计算机病毒与攻击\n\n在数以千计的计算机病毒中，几种病毒因影响重大或具有新闻价值而广为人知。以下是此类病毒，以及一些目前仍在活跃的常见病毒：\n\
  \n- **Gameover ZeuS**：发现于 2011 年，这种木洛马通过在网页中插入记录用户击键的恶意代码来窃取用户的网页登录凭据。\n- **红色代码\
  \ (Code Red)**：该病毒利用了`Microsoft IIS` Web 服务器的漏洞，由 `eEye Digital Security` 的两名工程师发现（他们当时正在喝\
  \ `Code Red` 汽水，因此得此名）。该病毒传播迅速，并被用于对包括美国白宫在内的知名网站发起拒绝服务攻击。根据估计，`Code Red` 可能在全球范围内造成了高达\
  \ 20 亿美元的生产力损失。\n- **ILOVEYOU**：该病毒发布于 2000 年，结合了社会工程学和对`Microsoft Windows`漏洞的利用。受害者收到一封带有附件的电子邮件，据称包含一封情信。有些人发现附件的名字太有诱惑力而无法拒绝，当他们打开\
  \ `TXT` 文件时，其中包含一个 `Visual Basic` 脚本，该脚本会覆盖受害者的文件并通过电子邮件发送给用户通讯录中的所有人。据信，`ILOVEYOU`\
  \ 感染了当时全球 10%的计算机。\n- **毒藤萝 (PoisonIvy)**：最初发布于 2005 年（据信起源于中国），这种病毒允许攻击者通过后门远程控制受感染系统。网络犯罪分子可以移动数据、更改设置，甚至调用系统的麦克风和扬声器。即使在今天，`PoisonIvy`仍被用于对全球的政府和私人系统发动攻击。\n\
  - **Mydoom**：与`ILOVEYOU`类似，`Mydoom`另一种通过电子邮件传播的后门木洛马。它编写于 2004 年，据报道通过导致拒绝服务造成了超过\
  \ 300 亿美元的损失。它通过带有“错误”或“邮件交易失败”等诱人主题的电子邮件传输。当用户打开附件时，就会安装一个后门程序。`Mydoom` 的新变种会阻止某些杀毒软件的运行并干扰杀毒软件程序的更新。\n\
  - **W32.DisTrack**：也称为 `Shamoon`（熊猫病毒），该病毒发布于 2012 年，目标是沙特政府和商业公司。它通过嵌入文档文件中的宏进行传输，该宏在执行时允许攻击者使用\
  \ `Microsoft PowerShell` 与受感染系统通信。该宏允许远程安装 `W32.DisTrack` 恶意软件，随后该软件会擦除计算机的硬盘。\n\
  - **Sapphire（或 SQL Slammer）**：`Sapphire`最初发布于 2003 年，是另一种 DoS 蠕虫。它的传播速度极快，造成了超过\
  \ 10 亿美元的损失，最著名的是导致美国银行数千台 ATM 机离线。`Sapphire` 从一个`SQL server`传输到另一个，利用了`Microsoft\
  \ SQL Server`软件的已知漏洞。\n\n### 勒索软件\n\n勒索软件是一种特别阴险的恶意软件，强制使其在支付赎金或损失资产之间做出选择。它通过多种机制投递：钓鱼邮件、社会工程学陷阱或利用操作系统的漏洞。一旦勒索软件感染系统，它通常会加密文件并通知用户，除非支付赎金（通常使用`bitcoin`），否则数据将保持加密状态。妥当的计划包括拥有良好的`BCP/DR`计划以及相关措施，以便能够恢复丢失的数据并从攻击中恢复。\n\
  \n#### 勒索软件示例\n\n- **SamSam**：这是一种“勒索软件即服务”，由一个网络犯罪分子组织利用目标，并将受侵害的目标出售给其他网络犯罪分子，后者则会尝试进一步勒索受害者以索要赎金。据估计，`SamSam`\
  \ 已导致美国公司遭受了超过 3000 万美元的损失。\n- **Zeppelin**：这种勒索软件会避免运行在俄罗斯、哈萨克斯坦、乌克兰和白俄罗斯的系统。它通过多种方式部署，包括通过被利用的托管安全服务提供商\
  \ (`MSSPs`)。\n- **Ryuk**：`Ryuk`在 2018 年和 2019 年广泛流行，并配合犯罪分子对赎金的较高要求。`Ryuk` 的一个特点是它禁用了`Windows\
  \ 系统还原`功能，从而防止受害者组织回到早期的未受感染的时间点，以尝试在不支付赎金的情况下从攻击中恢复。\n\n\n\n\n\n## PureLocker\n\
  \n`PureLocker` 是一种利用其他恶意软件安装的后门进行植入恶意软件。它针对的是企业服务器等高价值资产的 Windows 或 Linux 系统，因此此类攻击通常涉及高额赎金要求。\n\
  \n## Rootkits\n\nRootkits（根基工具）是允许并维持对操作系统的特权访问的工具。Rootkits 并不总是恶意的（它们可能有合法用途），但本文讨论仅涵盖带有恶意代码的\
  \ rootkits。与其他恶意软件一样，rootkit 必须以某种方式送到目标主机。因此，rootkit 总是与其他类型的漏洞结合使用以完成安装。一旦安装，rootkit\
  \ 就可以隐藏自己以逃避检测。Rootkits 很难或无法检测，特别是当它们存在于内核内部时。有时，只有通过重新安装操作系统才能完成删除，在 rootkit 影响了固件或对电子设备造成损坏的情况下，甚至需要更换硬件。\n\
  \nRootkits 有很多种类，但大多数分为两类：内核模式或用户模式。这些模式指的是操作系统（如 Windows）的模式。\n\n`内核模式 rootkit`（Kernel-mode\
  \ rootkits）通过添加代码或替换核心操作系统的部分在内核级别运行。对核心 OS 的修改是通过使用修改过的 OS 功能实现的，例如 Windows 设备驱动程序或\
  \ Linux 可加载内核模块（`LKMs`）。由于这些类型的 rootkit 修改了核心 OS，因此它们很难编写，并可能严重损坏系统运行。由于这些 rootkits\
  \ 运行在系统的最高安全级别，它们可以颠覆安全控制并逃避检测。\n\n`用户模式 rootkit`（User-mode rootkits）修改或替换应用程序（如系统库），而不是像内核模式\
  \ rootkit 那样修改底层核心。例如，rootkit 可能会向进程中注入动态链接库（`DLL`），强制应用程序调用攻击者所希望的未经授权函数。\n\n###\
  \ Rootkit 示例：ZeroAccess\n\n`ZeroAccess` 是一种在 2011 年发现的内核模式 rootkit，已感染了全球超过 200\
  \ 万台系统。该 rootkit 目前仍在活跃，它安装隐藏良好的恶意软件，使系统成为全球僵尸网络的一部分。攻击者利用 `ZeroAccess` 让受感染的系统执行两种未经授权的操作之一。`ZeroAccess`\
  \ 使受感染的系统成为比特币挖掘网络或`点击欺诈`网络的一部分，在点击欺诈网络中，系统会模拟对按点击付费的网站进行点击。`ZeroAccess` 通过社会工程学或`漏洞利用包`（exploit\
  \ packs）传递。漏洞利用包是存储在攻击者控制的 Web 服务器上的脚本集。当受害者系统尝试访问该服务器时，脚本会尝试利用系统上的漏洞并安装由 rootkit\
  \ 软件组成的有效负载。许多系统是通过漏洞利用包被感染的，这些程序包可能会同时安装多种恶意软件。攻击者还使用社会工程方法安装 `ZeroAccess`，欺骗用户运行一个安装该软件的可执行程序。\n\
  \n## 脚本攻击与特定漏洞攻击\n\n网络犯罪分子使用脚本来利用操作系统和应用程序中的漏洞。这些漏洞是由于制造商（针对商业软件）或开发者（针对定制或内部开发软件）的编程错误或配置错误造成的。制造商经常在他们的产品中发现此类漏洞，并定期以补丁或软件更新的形式发布漏洞修复。例如，微软每月每个月的第二个星期二发布补丁以修复\
  \ Windows 中的安全漏洞（俗称为`补丁周二`，Patch Tuesday）。对于非商业软件，漏洞通常由内部安全人员、运维人员或第三方测试员和审计员发现，这些可能是偶然发现的，或者是正式安全测试的结果。\n\
  \n漏洞可能发生在任何操作系统或程序中，但分为几种常见类型。接后的章节将分别讨论一些最常见的安全漏洞类型。\n\n### 缓冲区溢出\n\n当程序等待输入时（无论是来自另一个程序还是来自用户在字段中输入文本），它会将该数据存储在缓冲区（即内存区域）中。程序通常预期数据具有给定的大小，因此会创建一个合适大小的缓冲区来接收预期数据。如果接收到的数据大于缓冲区的大小，额外的数据就会溢出到其他缓冲区或内存区域，从而导致操作错误。网络攻击者设计攻击，利用那些未对输入数据进行妥当检查的程序，这些程序容易受到缓冲区溢出攻击。\n\
  \n当缓冲区溢出发生时，超过缓冲区大小的数据会溢出到相邻的内存区域。如果该内存是另一个缓冲区，数据可能会破坏使用它的程序的操作。在某些情况下，溢出的数据会被系统执行，就像它是命令甚至是一个可执行程序一样。缓冲区溢出可用于拒绝服务攻击，但更多地被用于强制系统在没有正确授权的情况下执行命令。攻击者通常向缓冲区中注入恶意代码，这些代码将代表攻击者执行，但在当前正在执行的程序的上下文中运行。这可能导致攻击者控制系统并提升权限，导致重大的安全漏洞。\n\
  \n在软件工程开发阶段，可以通过实施适当的输入检查来确保程序只接受正确类型和大小的数据，从而防止缓冲区溢出。还可以通过防止数据写入某些内存区域来缓解缓冲区溢出，从而减少溢出的潜在影响。一种常用方法是直接使用具有自动边界检查的程序，例如\
  \ `Java`。\n\n### 计时攻击与竞态条件\n\n`计时攻击`（timing attack），也称为`竞态条件攻击`（race condition attack），发生在攻击者利用一系列事件之间的时间差时。一个例子是检查时间/使用时间（`TOC/TOU`）攻击。这发生在系统检查特定文件是否存在以供后续操作，而攻击者在检查和使用之间将该文件替换为恶意文件时。这类攻击有无数种变体。任何实现依赖于其他程序或外部事件的特定事件序列的程序，都可能受到竞态条件或计时攻击的影响。此类攻击要求攻击者具有极高的精度，但它们可以做到且已经实现。\n\
  \n### 后门\n\n后门（Backdoor）并不是特定类型的攻击，而是许多不同类型攻击的特征。`后门`是一个通用术语，用于描述未经授权的用户绕过安全控制以访问系统或程序的任何方法。当系统或程序设计或编码不正确时，可能会存在后门，或者由网络犯罪分子使用恶意软件创建。后门便利了受感染或受破坏的系统与未经授权的系统或用户之间的通信。\n\
  \n### 跨站脚本\n\n\n\n\n\n跨站脚本（XSS）是一种攻击类型，攻击者将恶意脚本注入到受攻击受害者所信任的网站中。然后，当毫无防备的受害者访问该网站时，脚本会在受害者的浏览器中执行。此类脚本可以访问受害者的\
  \ cookies、令牌或其他敏感信息。XSS 攻击利用了网页与浏览器之间的信任关系。通常情况下，XSS 有两种类型：持久性（或存储型）和非持久性（或反射型）。\n\
  \n`persistent XSS` 攻击发生在恶意脚本被存储在目标服务器上时。攻击者通常利用允许他们输入信息的网站，这些信息会被存储并展示给成为受害者的其他用户。例如留言板、论坛或其他社交媒体网站（如交友网站）。攻击者可能会发布合规信息供受害者查看，同时附带一个对受害者隐藏但会被受害者的浏览器执行以实施攻击的脚本。\n\
  \n`nonpersistent XSS` 攻击发生在恶意脚本被反射回受害者的浏览器时。一个例子是用户收到一封恶意的电子邮件，诱导受害者点击链接。邮件不仅包含指向\
  \ Web 服务器的链接，还包含了由服务器反射到受害者浏览器中的恶意脚本。浏览器随后执行该脚本，实施恶意活动。\n\n### HTTP 响应拆分\n\n另一种由于软件程序未正确执行输入检查和验证而导致的漏洞被称为\
  \ `HTTP response splitting`。在此类攻击中，攻击者构造包含畸格式化头部的数据。这可以被用于接管用户的浏览器、盗取 cookies 或将流量重定向到另一个网站或服务器，从而用于收集用户的凭据。HTTP\
  \ 响应拆分还可用于用假数据“投毒”网络缓存，导致网站被破坏。\n\n### SQL 注入\n\n很多时候，用户在网页表单中输入的数据由 Web 服务器发送到数据库（例如使用结构化查询语言（`SQL`）的数据库）。如果\
  \ Web 服务器未正确检查用户输入的数据，可能会允许攻击者在字段中放置 `SQL` 命令，这些命令将由 `SQL` 数据库执行。此类攻击可能被用于控制数据库、提升权限，并在未获得适当授权的情况下修改或泄露数据库中的数据。\n\
  \n![Images](img/note.jpg)\n\n**NOTE** 开源基金会的开放 Web 应用安全项目（OWASP）发布了工具和资源，帮助开发者创建安全的\
  \ Web 。OWASP 发布了多种优秀且经过证明的安全编码实践指南，帮助防御脚本攻击。这些 Web 安全资源可以在 [`owasp.org`](https://owasp.org)\
  \ 找到。\n\n### 社会工程学\n\n今天的网络犯罪分子知道人是信息安全中最薄弱的环节，因此他们利用社会工程学以此设计攻击。`social engineering`\
  \ 指利用欺骗手段诱某人做可能不符合其利益的事情。诈骗者多年来使用社会工程学，现在已成为网络攻击不可或缺的一部分。坏人早已发现，让别人泄露密码比使用技术手段入侵系统要容易得多。应对这些需要一种专注于防御人类导致安全漏洞的人类行为的网络防御计划。这涵盖了以下内容：\n\
  \n- 社会工程学的类型\n- 为什么员工容易受到影响\n- 社会工程防御\n\n### 社会工程学的类型\n\n社会工程学有许多形式，但可以分为三种：`pretexting`（虚构事实）、`quid\
  \ quo`（利益交换）和 `baiting`（诱饵）。\n\n#### 虚构事实\n\n`Pretexting` 指使用一个场景来欺骗某人。很多人都听过“尼日利亚王子诈骗”，攻击者利用受害者的账户。虚构事实现在已用于网络世界。以下是几个例子：\n\
  \n- 用户接到来自 `Tech Support` 的电话，告诉他们电脑有病毒，技术人员需要访问权限来“修复”问题。但拨电者并非来自 `Tech Support`。\n\
  - 首席财务官收到一封来自 `CEO` 的邮件，告诉他们密码已过期，应该点击链接进行更改。这封邮件对用户来说是真实的。\n- 一员工收到一封邮件，宣布他们是新款电脑游戏的幸运赢家。但邮件引导受害者进入一个包含漏洞的网站。\n\
  \n#### 利益交换\n\n`quid quo` (`QPQ`) 是信息或货物的交换，例如购买行为。如果一个交易听起来好得不可思，那它很可能就是。以下是一些\
  \ `QPQ` 例子：\n\n- 一公司的采购员需要购买 1000 个 USB 盘。采购员访问的大多数在线网站每个 USB 盘售价 50 美元，但他发现在中国的一家公司以每个\
  \ 10 美的价格出售。遗憾的是，这些廉价驱动器含有恶意软件。\n- 许多在线网站以原价的一小部分出售软件产品版本。但其中许多是诈骗性的并含有恶意软件。\n\n\
  #### 诱饵\n\n`Baiting` 简单是将某人诱入陷阱。我们都曾听过公元前 12 世纪希腊人作为礼物送给特洛伊城的著名特洛马的故事。当特洛伊人将巨大的马雕塑带进城时，里面隐藏着希腊士兵，正如人们所说，剩下的就是历史（结局）了。以下是几个例子：\n\
  \n- 一个毫无防备的人在地上发现一个钥匙扣，并将其交给前台接待。钥匙扣上挂着一个 USB 盘。接待员决定将该驱动器插入他的电脑，以查看可能是谁的。但它含有恶意软件。\n\
  - 在地面上丢弃 USB 盘是黑客的一种非常常见的攻击方法。这是某些人无法抗拒的诱饵。\n\n\n\n\n\n许多组织投入巨资培训员工对网络攻击和社交工程风险的认知。尽管如此，人为错误（包括因成为社交工程攻击的受害者而导致的错误）目前仍企业面临的最大安全风险。书中描述的以及如今首席安全官（CISO）和安全组织正在实践的许多控制措施、技术和流程，都可能因为聪明诈骗者实施的简单社交工程技巧而化为乌有。\n\
  \n这怎么可能呢？当员工在接受了相关培训后，为什么还会成为这些陷阱的受害者呢？以下是人们易受社交工程攻击的一些主要原因：\n\n- **工作优先级**：对于大多数人来说，工作表现比信息安全重要。人们面临完成工作的压力，在衡量工作成功时很少考虑到安全性。也许一个原因是，员工的绩效考核几乎总是针对一个人的工作表现，但几乎从不评估其安全规范。因此，具备安全意识并遵循良好的安全卫生并不一定是员工关注的重点。\n\
  - **职场文化**：职场文化和氛围对员工的安全意识和社交工程防御有很大影响。在许多行业中，`workplace safety`是一个大关注点，特别是当存在受伤和死亡风险时。在这些环境中，组织拥有政策、程序和职场文化，将员工对危险和安全实践的意识提高到了高度。在这些以安全为导向的场所，员工会调整自己的行为并将安全融入到他们所的一切工作中。然而，安全性很少获得类似的类似的关注。安全性通常没有植根于职场氛围中。\n\
  - **人性**：人们并不一定会对潜在的社交工程技巧保持警惕。人们倾向于信任他人，而这与良好的社交工程防御要求背道而驰。\n\n当组织的领导力和文化与安全目标不一致时，它们可能会导致一系列事件，最终引发安全事件或数据泄露。例如，领导者迫使员工完成工作（导致安全操作上的捷径），或表扬那些更快完成工作的人（而不顾他们为获得该结果所承担的安全风险）。这可能导致偏离安全程序或规则。这种偏离有时是无意的（人们可能没有意识到自己偏离了规则），也可能是故意的（人们可能做出违反规则的自觉决定）。在很多情况下，人们之所以成为社交工程的受害者，是因为他们未能识别出风险。\n\
  \n## 社交工程防御\n\n从历史上看，仅靠安全培训和意识计划并不能帮助组织抵御社交工程攻击。原因之一是培训仅仅是一种行动。与经过证明的完成任务的生命周期（如\
  \ `Plan, Do, Check, Act (PDCA)`）相比，培训只是其中一部分（`Do` 执行部分）。采取了哪些工作来 `Check`（检查）以确保培训是有效的？又采取了哪些工作来对衡量的结果采取\
  \ `Act`（行动）？培训本身并解决社交工程问题。比单纯培训更有效的方法是全面的社交工程应对计划，该计划应包含以下要素：\n\n- 领导力\n- 培训与意识\n\
  - 测试\n- 实践与演练\n- 运营监控与修复\n\n### 领导力\n\n安全对于组织领导层的重要性（或不重要性）将决定社交工程漏洞的数量和范围以及由此导致的安全泄露。安全文化始于组织的顶层。我们知道，如果员工对安全政策的遵守情况是其年度绩效评估的一部分，员工更有可能遵守这些政策。然而，将安全纳入评估通常需要领导层的批准或赞助。组织高层的认同在很大程度上决定了良好的信息安全实践成为组织文化一部分的程度。\n\
  \n### 培训与意识\n\n所有员工都应该了解组织的安全政策和流程，以及通用的良好安全实践。大多数组织通过实施全范围内的安全培训和意识计划来实现这一目标。社交工程培训应该是安全培训计划的关键组成部分。\n\
  \n社交工程安全意识培训应涵盖组织的整个用户群体。它应该包含以多种形式提供的培训，特别是实践、演习和练习，以为用户提供应对网络攻击的真实经验。最好的培训计划利用了商业现型\
  \ (COTS) 培训来教授通用概念，并结合定制化培训来教授公司或组织特有的特定概念。\n\n培训应涵盖之前介绍的每种社交工程攻击类型：假托信法（pretexting）、等价交换（quid\
  \ pro quo）和诱饵攻击（baiting）。培训计划应具有以下特征和特点：\n\n- **模块化**：一个大型的短培训模块库比一个较小的长模块库效果更好。短培训已被证明是更有效的，因为它更有利于学习和记忆。此外，向用户社区交付短课程也更容易管理，因为短课程可以更方便地整合到员工的工作日程中。\n\
  - **相关性**：培训应与业务环境相关。许多组织试图通过购买 COTS 培训产品来节省费用，希望它适用于自己的业务，结果却发现其偏离了目标。例如，面向企业办公环境（许多\
  \ COTS 产品均如此）的培训可能对生产车间的工人或外勤人员来说并不真实共鸣。相关性让培训更贴近用户，帮助他们更好地理解材料，这有助于学习记忆，更重要的是，能帮助他们将学到的技能应用到工作中。\n\
  - **一致性**：培训必须符合组织的安全政策和实践，以强化这些内容。组织所犯的最常见错误之一是选择了与组织安全政策不匹配或冲突的信息安全培训。如果培训告诉员工采取某项行动，而政策要求采取另一种行动，就会造成困惑并增加安全泄露的可能性。\n\
  - **技能导向**：社交工程和信息安全培训不应仅仅教授知识，还应该教授员工实践良好安全卫生时所需的 `技能`。员工不需要学习密码如何在计算机中存储的，就能知道不应该把密码给别人。通过以技能为重点，员工可以练习并学习他们在工作中可能遇到的情况。\n\
  \n\n\n\n培训通常与意识计划相结合，以向员工提供持续的安全信息流。许多组织会发布由 `CISO` 或其他安全人员编写的定期通讯报或博客，讨论安全话题。安全意识通常通过使用信息安全网络门户来推广，员工可以通过这些门户查看安全策略、标准和指南，获取安全测试工具的权限，并了解更多安全风险和实践。这些资源可以是扩展信息安全培训和推广安全文化的一种极其有效的方式。\n\
  \n## 测试\n\n社会工程测试是测试的一个子集，应作为持续漏洞评估和渗透测试计划的一部分进行。开展这些测试目的是通过揭示漏洞并提供指导安全改进的有用信息，来提高组织的安全态势。这些测试的进展方式与真实攻击者相同：通过测试、探测、重新测试和重新探测。每一次成功都是向攻破敏感信息目标的一小步。以下是组织工具箱中应具备的一些社会工程测试活动列表。\n\
  \n- **USB 盘投递测试**：在这种场景下，组织在设施内的各个位置放置 USB 盘。这些驱动器包含商业现成软件（COTS）或定制开发的软件，这些软件通过为测试人员提供系统的远程控制权来模拟恶意软件，类似于真实的攻击。然而，该软件并非真实的恶意软件，并在测试结束时被完全移除。\n\
  - **钓鱼邮件**：测试人员向组织内选定的个人或群体发送专门制作的电子邮件，诱导他们执行某些操作或点击链接。这些电子邮件可能看起来来自外部第三方或冒充的权威人员。\n\
  - **钓鱼短信**：与钓鱼邮件类似，这些信息看起来是法的，并诱导人员做事或泄露信息。\n- **虚假网站（虚构和冒充的）**：这些网站通常与电子邮件或短信结合使用，看起来合法，并诱导人员泄露敏感信息。\n\
  - **致电员工进行预设攻击的电话**：测试人员使用各种虚假场景，将电话通话作为攻击向量。每次通话都试图建立信任，并说服受害者透露可用于攻击的敏感信息。\n-\
  \ **尾随（Tailgating）**：这是一种物理入侵，测试人员跟随员工通过通常受保护的门以获得未经授权的物理访问。员工使用其授权的访问方法（如刷卡），然后测试人员在不使用卡片的情况下溜进已经打开的门。\n\
  - **物理冒充**：在测试中，测试人员使用各种技术伪装成合法访客，以进入物理区域。技术包括穿着制服并携带工具以看起来像服务人员，或使用虚假证件冒充真实员工。\n\
  - **社交媒体员工审查**：网络攻击的关键部分之一是侦察或收集有关目标的信息。社交媒体是网络攻击者使用的关键侦察工具。在这些测试期间，测试人员利用各种手段根据公司或个人社交媒体帖子来了解组织。网络攻击者还通过社交媒体与员工互动，获取他们泄露有助于攻击的信息。测试人员将测试员工对此类技术的防御能力。\n\
  - **检查垃圾（翻垃圾桶寻找）**：测试人员可以使用这种久经考验的方法对目标组织进行侦察，或寻找获取访问权限的方法。\n- **检查废弃或捐赠的设备**：许多组织在处置不需要的设备或存储介质之前没有进行善清理。测试人员可以使用网络攻击者的技术追踪此类物品的痕迹并寻找敏感数据。\n\
  \n![Images](img/note.jpg)\n\n**注意**：开展社会工程测试是一项高度敏感且带有某种争议的活动。确保社会工程测试不会让员工感到尴尬或引起工作场所混乱非常重要。这就是为什么此类测试必须获得领导和管理层的批准和认可，并在整个组织范围内进行宣传以提前获得接受。`CISOs`\
  \ 必须与人力资源、法务和其他部门紧密合作，协调社会工程测试。\n\n## 实践与练习\n\n想象你正在准备手术并见到了外科医生。你问：“你做过多少次这种手术了？我打赌你一定练习了很多！”他回答：“练习？我们没时间练习。但别担心，我参加过培训并看了很多关于它的视频。”你不会期望有人能在没有练习的情况下完成一项重要任务，那么你为什么会期望员工在没有练习的情况下防御社会工程攻击呢？社会工程防御是一种不寻且有时非自然的技能，需要通过练习来开发和提高技能。培训是重要的，但如果没有实践，培训期间传递的信息会很快丢失。\n\
  \n每个组织都应该为员工提供一系列活动，让他们能够练习社会工程防御（以及其他安全相关的）技能。许多供应商现在提供社会工程测试软件，为员工提供情景并测试他们应对这些场景的能力。事实上，上一节中讨论的许多测试可以反复使用，以便员工开发和改进他们的防御技能。\n\
  \n小组练习是练习社会工程防御的另一种方式。一些组织开展角色扮演练习，让一名员工冒充黑客拨打另一个电话进行社会工程攻击，让潜在受害者练习识别攻击。如前所述，这些练习活动必须经过管理层的审查，并经过良好协调，以避免争议和干扰。但一个计划良好且执行良好的社会工程练习计划可以是对此类攻击的极其有效的应对措施。\n\
  \n## 运营监控与修复\n\n组织应该跟踪、记录和研究发生的所有安全事件和泄露。这包括与社会工程相关的事件。这种跟踪的目的之一是了解导致事件的事件顺序，并理解事件的深层或根本原因。通过这种理解，可以开展安全修复活动。\n\
  \n`情境感知（Situational awareness）`指的是对企业安全态势的理解。这包括理解企业中`每种资产`的安全态势。在社会工程防御中，情境感知的概念扩展到企业中的`每一个人`。作为安全运营功能的一部分，组织应该对每个人的系统和数据访问情况；运营行为；安全培训参加情况；社会工程实践、演习和练习的结果；以及安全相关活动记录具有情境感知。这一切的意义在于建立并维护每个人潜在漏洞和暴露情况的画像。这为组织提供了数据，据此可以改进、衡量和跟踪。情境感知是了解组织拥有哪些资产、这些资产在哪里以及每种资产的安全态势是什么的实践。\n\
  \n\n\n\n\n用户行为分析（UBA）是安全运营的另一个分支，它使用工具监控用户的网络活动。UBA 工具收集数据并随着时间的推移构建每个用户的正常行为画像。当工具发现与该用户不符的异常行为时，它可能表明存在安全漏洞、暴露，甚至是发生了安全事件或数据泄露。年前，安全专业人员仅监控系统活动。但现在，组织已经意识到人类是许多网络问题的核心，因此\
  \ UBA 工具被用于监控人员活动，以基于人类因素检测安全事件。\n\n## 资产安全\n\n资产安全领域聚焦于组织对其资产的理解，并根据风险和分类为每种资产确定适当的控制措施。本质上，这意味着야组织拥有什么以及每种资产是如何受到保护的。重点通常放在支持信息相关资产上，例如存储或处理数据。这些资产可能包括硬件（笔记本电脑、台式电脑、移动设备、服务器、网络设备等）、软件（数据库、应用程序等）和信息（文件、文档等）。环境中的资产类型以及用于每种资产的控制类型将在组织的策略、标准和程序予以识别和处理。\n\
  \n资产安全控制通常作为信息安全控制生命周期框架的一部分实施，如第 2 章所示。例如，NIST 风险管理框架的分类步骤用于确定系统的基准安全控制，这些控制受存储在系统上的数据类型的影响。组织可以进行风险评估以确定与信息系统相关的风险以及系统存储的信息，并选择控制措施来降低识别出的风险。风险评估可以根据之前的风险评估或组织的风险管理过程进行指导。\n\
  \n正式的风险管理过程（在第 1 章的“项目管理”部分介绍。）为了实现这些工作，某些组织使用配置管理数据库（CMDB），这是一个关于环境中的资产和组件信息的存储库。CMDB\
  \ 可以作为资产配置变更的基准跟踪工具。某些组织使用包含资产发现功能的 CMDB 系统来自动填充资产条目。其他组织则使用独立的发现工具或可能与其 CMDB 集成的独立资产管理工具。CMDB\
  \ 提供多种功能，包括：\n\n* 资产管理与清单\n* 配置管理\n* 变更管理\n* 资产关系映射\n* 资产发现\n\nCMDB 包含通常被称为配置项（CI）的记录。CI\
  \ 是存储在 CMDB 中的元素，代表环境中的可配置资产或组件，例如硬件、软件、位置、网络、文档甚至人员。这允许对这些项目及其关系进行跟踪。\n\n## 安全配置基准\n\
  \n应对资产进行配置以减少其攻击面，并消除攻击者可以利用的潜在攻击向量。这通常通过更改默认密码、删除不必要的账户、程序和功能，以及禁用不必要的服务和端口来实现。目标是防止攻击者利用可能存在漏洞的程序和服务。这通常被称为资产加固。通过建立、实施和管理安全配置基准对资产进行加固。安全配置基准是针对特定资产（如操作系统、数据库等）的一组配置设置，这些设置被识别并选为组织采纳的标准配置集。例如，组织通常会为组织内的每种操作系统开发操作系统安全配置基准（例如，Windows\
  \ Server 2019、Red Hat Enterprise Linux 8 和 Oracle Linux 8 各自将拥有一项加固标准）。配置基准标准应用于部署的每种资产。互联网安全中心（CIS）是资产加固指导的极佳资源（https://www.cisecurity.org/）。CIS\
  \ 为各种系统（包括操作系统、网络设备、数据库、移动应用、云环境、打印机等）提供安全加固基准。\n\n### 漏洞管理\n\n资产管理的另一个核心功能是监控环境中的资产以是否存在已知漏洞。这是通过管理良好的漏洞管理计划实现的。漏洞管理是一个识别、确定优先级、修复和缓解组织环境中已知漏洞的持续过程。已知漏洞是产品中的缺陷或配置设置，这些设置可以被利用以导致安全问题。安全组织必须不断检查其资产以查看是否存在已知漏洞，以便进行修复。以下是漏洞管理计划的一些关键组成部分：\n\
  \n\n\n\n\n- **漏洞扫描器**：扫描器是用于检查网络设备是否存在已知弱点（漏洞或其他配置错误等其他弱点）的程序。扫描器制造商维护着产品及其相关漏洞的库。这些库被扫描器用于执行扫描，并不断更新。产品供应商和扫描器制造商共享漏洞信息，以便组织通过补补系统或更改配置设置来检测并修复漏洞。NIST（美国国家标准技术研究院）维护着一个漏洞数据库（国家漏洞数据库），许多供应商使用其获取最新的漏洞信息。（由于未知漏洞尚未被广大社区识别和记录，漏洞扫描工具无法扫描到这些漏洞。）许多扫描器还作为跟踪工具，维护一个已识别和已修复漏洞的数据库。\n\
  - **补丁管理**：漏洞扫描工具可以协助验证资产是否已正确补丁。应利用自动化补丁管理工具，以确保操作系统、第三方软件和其他资产运行着最新的软件。\n- **配置管理**：漏洞扫描器还可以通过根据已知配置配置对资产进行扫描，以确定其是否根据规范进行了加固。\n\
  - **身份验证扫描**：某些漏洞在不对设备进行身份验证（以授权用户的身份登录）的情况下无法检测到。这是因为某些漏洞只能由特权（或管理级）用户看到。执行身份验证扫描时，漏洞扫描返回的最准确的结果。这可以通过在系统上安装代理程序或为扫描器提供被扫描系统的特权权限来实现。\n\
  - **定期审查**：应按照组织定义的间隔定期进行漏洞扫描。应对扫描结果进行审查并与过去的扫描进行比较，以确保漏洞已修复。\n- **基于风险的优先级排序**：应根据风险对漏洞结果进行排名，确定修复的优先级。\n\
  \n漏洞管理包括定期报告和跟踪环境内漏洞的状态。这包括对开放漏洞、新漏洞和已关闭漏洞的报告和跟踪，以及对修复的报告和跟踪，例如修复分配给了谁以及修复状态。\n\n\
  ### 资产安全技术\n\n本节讨论了保护组织资产（如介质、纸、传真机和其他终端设备）的若干技术。讨论的主题包括：\n\n- 终端安全\n- 介质控制\n- 纸质安全\n\
  - 传真安全\n- 打印机安全\n- 安全箱\n\n![Images](img/note.jpg)\n\n**注意** 网络安全中心（CIS）是资产加固指南的极佳资源。CIS\
  \ 为各种系统（包括操作系统、网络设备、数据库、移动应用、云环境、打印机等）提供了安全的加固基准。\n\n### 终端安全\n\n组织网络上的每个终端都必须在其生命周期内得到适当的安全保护、加固和管理，以确保其已打补丁且漏洞已修复。终端包括服务器、台式计算机、笔记本电脑、网络基础设施设备以及组织网络上的其他资产。以下是加固资产时应考虑的一些关键终端安全控制：\n\
  \n- **终端保护软件**：服务器、台式机、笔记本电脑和移动设备应配置终端保护软件，以防止病毒、恶意软件和其他攻击。传统上，这种保护是通过杀病毒软件实现的，但现代终端保护软件提供了杀病毒保护以及额外的工具，让组织能够洞察终端内部的运行情况。这些信息可以用于促进调查，并提供终端设备上安全相关事件的可见性。\n\
  - **移除不必要的软件和服务**：系统的配置应尽可能启用少的软件和服务，以执行其预期功能。即使在正常运行期间不使用，不必要的软件或服务也是潜在的攻击向量。为了安全，应移除或禁用所有不必要的软件，并关闭不必要的服务。\n\
  - **加密**：确保数据在静态下加密（例如，全盘加密）以及在传输中加密（例如，`SFTP`、`HTTPS` 等）。\n- **漏洞管理**：定期扫描系统以识别并修复已知漏洞。\n\
  - **补丁管理**：确保系统运行最新的软件和固件，以防止已知漏洞。\n- **配置基线**：为设备维护安全的基线配置用于配置过程，并遵循配置和变更控制实践。\n\
  - **数据和配置备份**：应定期备份数据，以确保在紧急情况或系统故障时的数据可用。这包括服务器、台式机、笔记本电脑等的系统镜像，以及网络设备的设备配置文件。\n\
  - **网络访问控制 (NAC)**：NAC 是一种终端管理的集成方法，允许定义特定策略来管理网络访问的安全需求以及特定角色的访问权限。例如，`NAC` 策略可能不允许设备在未满足特定安全要求（如安装了杀病毒软件并应用了最新补丁）的情况下下连接到网络。\n\
  - **访问控制**：资产应配置适当的身份验证访问控制，如密码、智能卡、生物识别、多因素身份验证等。\n\n移动设备在可见性和管理方面可能带来独特的挑战。每年有大量的移动设备（如手机和笔记本电脑）被盗。这给存储在设备上的数据带来了风险，因为这些设备经常用于处理电子邮件、连接组织网络以及存储组织数据。在资产安全策略中必须考虑这些设备。除了上述控制措施外，还应考虑以下措施以确保存储在移动设备上的数据安全：\n\
  \n- **移动设备管理 (MDM)**：许多组织利用企业 `MDM` 软件实现移动设备的集中管理。`MDM` 功能通常包括远程设备跟踪、设备锁定、设备清理能力，以及密码长度和复杂性、加密、`VPN`、应用程序管理和容器化的策略设置。容器化技术允许组织在设备上建立独立的加密容器，以将个人信息与组织数据分离。\n\
  - **自备设备 (BYOD)**：BYOD 是一个概念，指的是员工可以使用自己的个人设备（笔记本电脑和/或智能手机），将其用于业务目的，并可能将其连接到组织网络。虽然\
  \ BYOD 可能会提高效率并降低成本，但它通过在网络上增加不安全的设备增加了风险。组织通过实施 `MDM` 和 `NAC` 软件来更好地控制设备以及访问网络的策略，从而应对这些风险。\n\
  \n#### 介质控制\n\n\n\n\n\n# 介质控制\n\n介质控制包括多种措施，为磁带、磁盘、USB 和其他物理介质提供物理保护和问责机制。介质控制包括：\n\
  \n- **介质标记**：介质应清晰地标记和标签，以指示所存储信息的分类分类。\n- **介质访问**：对组织介质的访问应限制为具有知情范围的授权人员。\n-\
  \ **介质存储**：应围绕介质处理（包括存储）制定策略和程序。这些程序应包括此类措施，例如使用加密技术保护静态数据，以及通过使用锁柜、保险箱等进行物理访问控制保护。\n\
  - **介质传输**：介质在传输过程中应使用组织定义的适当安全措施进行保护，例如加密措施或用于传输的密封容器。\n- **介质清理**：当介质不再需要时，应根据组织的介质清理策略和程序进行安全处置。这包括在本章“数据安全”部分中稍后讨论的方法。\n\
  \n## 数据残留\n\n当介质未被妥善清理时，它可能包含数据残留。`Data remanence`（数据残留）是指在被擦除后仍可以重构的数据。当数据被擦除或删除时，数据本身通常仍存在介质上。只是数据指针被移除，且该存储空间被标记为可用。即使在擦除后，如果使用正确的工具和专业知识，敏感数据仍可能被检索。清理数据的适当技术包括净化（purging）、覆盖/零化（overwriting/zeroization）、去磁（degaussing）和物理破坏。\n\
  \n## 纸质记录安全\n\n尽管我们处于数字信息时代，组织仍然依赖物理资源来运行，包括纸质记录。根据其分类级别对文档进行适当标记，并对员工接受分类方案和处理要求的培训是非常重要的。包含敏感信息的文档（如健康信息、信用卡号或社会安全码）在不再需要时应进行物理销毁。安全的销毁方法包括碎碎碎和焚烧。\n\
  \n## 传真安全\n\n传真机可能用于传输敏感数据，并可能带来独特的数据安全挑战。例如，如果传真了敏感文件，纸张可能会最终留在纸箱里供任何人查看。通常组织会在文档上打上分类标记，但打印分类横幅或封页可能无法提供足够的保护。以下是可能实施的保护传真信息的控制措施：\n\
  \n- 实施传真服务器而非传真机，以允许操作系统级别的访问控制\n- 禁用打印功能，使敏感文档保持为数字格式\n- 使用全盘加密和访问控制来加固传真服务器\n\n\
  虽然之前涵盖的控制措施侧重于保护静态数据，但必须考虑保护传输中的传真数据。保护传输中数据的最佳控制是适当的加密。以下是传真传输时需要考虑的一些安全控制措施：\n\
  \n- **传统传真**：对于通过传统公共交换电话网络（`PSTN`）传输的传真，应实施传真加密器以进行批量数据链路加密。\n- **互联网传真**：确保通过互联网发送的传真（例如使用云传真服务）使用现代传输层安全（`TLS`）`1.2`\
  \ 或更高版本发送。\n- **审计和日志**：确保日志和审计是\n\n## 打印机安全\n\n虽然之前涵盖的控制措施侧重于保护静态数据，但必须考虑保护传输中的传真数据。保护传输中数据的最佳控制是适当的加密。以下是传真传输时需要考虑的一些安全控制措施：\n\
  \n- **传统传真**：对于通过传统公共交换电话网络（`PSTN`）传输的传真，应实施传真加密器以进行批量数据链路加密。\n- **互联网传真**：确保通过互联网发送的传真（例如使用云传真服务）使用现代传输层安全（`TLS`）`1.2`\
  \ 或更高版本发送。\n- **审计和日志**：确保日志和审计是\n\n## 保险箱\n\n保险箱常用于驱动器、磁盘、磁带和其他介质的物理保护。除了防穿透外，保险箱还应提供防火保护。常用的保险箱从地柜式到涵盖整个房间的库不等。在使用保险箱时应考虑以下控制措施：\n\
  \n- 确保只有知情范围的人员才能保险箱\n- 如果使用密码，确保定期更改\n- 考虑将保险箱放置在门禁访问室或监控范围内\n\n## 数据安全\n\n数据安全控制应用于信息，以防止未经授权的访问、泄露和修改。这些控制作为数据生命周期的一部分在本文节稍后进行讨论。数据安全控制随数据状态而异。数据状态包括`data\
  \ at rest`（静态数据）、`data in transit`（传输中数据）和`data in use`（使用中数据）。这是安全专业人员使用的概念模型，用于描述在各种状态下必须如何保护数据。数据安全控制通过正确配置和加固处理信息的资产（如服务器、网络设备、应用程序等）来实现。本节讨论了以下主题：\n\
  \n- 静态数据\n- 传输中数据\n- 使用中数据\n- 数据生命周期\n\n### 静态数据\n\n`data at rest`指的是位于持久存储设备（如硬盘、闪存、光盘、磁带或其他存储介质）上的数据。许多组织现在的政策要求某些数据在存储于信息系统中随时进行加密。静态数据安全控制包括：\n\
  \n- 全盘加密\n- 数据库加密\n- 特定数据结构加密（文件、记录或字段加密）\n\n### 传输中数据\n\n`data in transit`（也称为\
  \ `data in motion`）是指在网络计算节点之间或网络之间移动的数据。这包括在公共不可信网络上流动的数据，也包括在私有企业网络（如局域网 `LAN`）上流动的数据。传输中数据安全控制侧重于利用加密的网络连接协议，包括：\n\
  \n- 传输层安全 (`TLS`)\n- IP 安全 (`IPSec`)\n- 虚拟专用网络 (`VPN`) 加密\n\n\n\n\n\n`data in use`（使用中数据）指的是当前被系统或应用程序处理或使用的数据。这主要指的是存储在系统内存中被访问处理的数据。这包括存储在主存储（如易失性内存\
  \ RAM）、CPU 寄存器和内存缓存中并正在被处理的数据。保护使用中数据的挑战性之处在于，即使对存储和传输使用了适当的加密，数据通常也必须解密后才能被使用和处理。保护使用中数据包括实施良好的访问控制、使用专门查找、警报或防止不当写入和读取内存的防病毒软件，以及设计应用程序以防止未经授权或不当访问应用程序数据（例如防止某些应用程序的剪贴功能或屏幕截图）。\n\
  \n### 数据生命周期\n\n数据生命周期（在第 1 章中简要介绍）指的是数据如何获取或创建、如何保护和使用，以及最终如何处置。生命周期通常包括以下阶段，如图\
  \ 4-1 所示：\n\n![Images](img/F04-01.jpg)\n\n**图 4-1** 数据生命周期\n\n* 获取\n* 数据分类与标记\n\
  * 使用与归档\n* 销毁\n\n本节描述生命周期的每个阶段及其相应的活动。\n\n### 获取\n\n第一阶段涉及数据的来源。数据通常通过两种方法之一获得：\n\
  \n* **获取**：从外部源（如供应商、客户或其他利益相关者）获取。\n* **创建**：在组织内部从零开始创建或开发。\n\n生命周期的下一步是对比数据进行分类，以便应用适当的安全控制措施（如加密、访问控制等）。\n\
  \n#### 权限：访问控制矩阵\n\n用于数据安全定义访问控制权限的工具之一是访问控制矩阵，它是一张列出主体（用户）及其针对特定数据元素或数据集相应权限层级的表格。以下是特定数据元素或数据集访问控制矩阵的示例：\n\
  \n![Images](img/p188.jpg)\n\n或者，矩阵也可以以数据元素或对象作为列标题（例如文件 1、文件 2 等），并将 X 替换为主体对每个对象拥有的权限（读、写、打印、数据所有者等）。\n\
  \n### 数据分类与标记\n\n在数据获取或创建之后但在使用之前，应该通过使用安全控制措施对其进行保护。然而，为了保护数据（静态、传输中和使用中），需要使用某种框架或流程来确定所需的保护级别。这就是数据分类发挥作用的地方。`Data\
  \ classification`（数据分类）本质上是为数据分配敏感性值，根据组织的分类策略、程序和指南确定所需的保护级别（加密、访问控制和安全销毁等安全控制）。表\
  \ 4-1 展示了私营部门和公共部门（军事和联邦政府）常用的分类方案示例，从最高分类级别到最低分类级别。\n\n![Images](img/p189.jpg)\n\
  \n**表 4-1** 分类层级示例\n\n在实践中，分类级别因组织而异。有些组织可能有两个级别，而另一些可能有四个或五个。每个组织必须决定使用哪些分类级别，并识别这些级别的含义。为了制定分类级别，组织应该执行以下操作：\n\
  \n1. 定义分类级别并指定确定数据如何分类的标准。\n2. 识别责任方，如 `data owner`（负责数据分类的）和 `data custodian`（负责维护数据和实施安全控制措施）。\n\
  3. 确定每个分类级别所需的安全控制措施。\n\n#### 数据所有者要求\n\n数据或系统所有者负责数据进行分类。为了正确对数据进行分类，所有者必须：\n\n\
  * 作为流程所有者，对要分类的数据了如指\n* 理解组织的分类方案和标准\n* 熟悉组织的法律和法规要求\n* 以一致、可重复的方式执行分类过程\n* 在需要时执行降级（解密/取消分类，注：此处指降低敏感级）程序\n\
  \n与信息安全中的大多数事情一样，制定分类级别是一项平衡工作。过多的分类级别会变得不实际且混乱，而过少的分类级别可能几乎没有价值或没有实际用途。在定义分类级别时，级别之间不应有重叠，以便数据所有者能够轻松识别特定信息属于哪个分类级别。在制定数据分类标准时，应考虑以下因素：\n\
  \n* 信息的有用性和价值\n* 如果信息被泄露、修改或损坏，对组织产生的影响\n* 与信息相关的法律、法规和法律责任\n* 关于数据所有权、托管和使用的角色与职责\n\
  \n所有分类材料都应清晰地标记和贴标签，并根据格式（例如纸质、数字、介质、传真等）为每个级别设定不同的处理要求。确保组织在遵循相应分类级别的安全策略、程序和控制措施方面保持一致至关重要，以确保在环境中的一致应用。\n\
  \n#### 数据分类策略、程序和指南\n\n组织应该创建围绕数据分类的策略、程序和指南。数据分类策略应概述：\n\n* 分类方案\n* 每个分类层级的定义\n\
  * 每种分类的标准\n* 分类的角色和职责\n\n数据分类程序和指南应回答以下问题：\n\n* 数据分类的流程是什么？\n* 如何对信息进行分类？\n* 如果需要，如何更改分类级别？\n\
  * 如何将分类变更通知给 IT 部门？\n* 材料应如何降级和销毁？\n\n### 使用与归档\n\n在数据生命期的这一阶段，信息由具有不同访问级别的各种用户和方利用（读取、修改并可能外部共享）。这一阶段在数据机密性、完整性和可用性（CIA）方面面临着若干挑战。数据必须是可用的，但仅限于根据其组织角色获得适当的人员（例如，某些用户仅被允许读取某些数据元素）。每个分类级别都应该有特定的处理要求和程序，规定如何根据分类级别访问、使用、处理、共享以及最终销毁数据。\n\
  \n\n\n\n\n作为数据生命周期的一部分，可能需要根据组织的数据保留策略和要求进行归档。`Archival`（归档）是将数据从生产环境中移除并保留以供未来使用或参考。这通常是为了帮助管理存储空间并确保满足长期保留要求。保留要求受组织内部需求（例如未来可能需要访问或恢复数据的需求）以及外部需求（例如法律、法规或其他合规驱动因素）的影响。归档和保留适用于数字/电子信息也适用于纸质文档。\n\
  \n## 销毁\n\n当数据超过其使用寿命和保留要求后，必须对其进行安全销毁。安全专业人员所熟知的，当通过按下计算机上的 `DELETE` 键擦除数据时，驱动器上的该数据存储位置本质上被标记为操作系统可使用的空间。这告诉\
  \ `OS` 驱动器的该扇区、簇或块（取决于所使用的文件系统）现在可以被重新消耗。然而，所有“已删除”的数据仍然留在驱动器上。这种方法被称为 `erasure`（擦除）。由于所有数据仍在介质上，因此擦除并不是一种安全的数据处置方法。当介质的内容被安全地清除时，被称为\
  \ `sanitized`（净化）。这意味着擦除信息，使其无法使用常规的 `OS` 命令或市售的司法/数据恢复软件轻易检索到。介质可以通过几种方式进行净化：清除（purging）、覆盖/清零（overwriting/zeroization）、消磁（degaussing）和物理销毁。这些方法用于安全地净化硬盘和其他存储介质等资产中的数据。\n\
  \n- `Purging`（清除）意味着即使通过实验室物理取证等非凡的努力也无法恢复信息。当介质将从允许访问其介质上信息的物理限制范围内移除，或将重新转用到不同的隔间时，就需要进行清除处理。\n\
  - `Overwriting/zeroization`（覆盖/清零）涉及某种数据覆盖。常用的方法有数几种：\n- `Single pass`（单次覆盖）：数据通过一次\
  \ `1` 或 `0` 的通过进行覆盖。\n- `US Department of Defense (DoD) method`（美国国防部方法）：数据区域通过\
  \ `three` 次通过进行覆盖；先是全 `0`，然后是全 `1`，最后是一次伪随机数据覆盖。\n- `US National Security Agency\
  \ (NSA) erasure algorithm`（美国国家安全局擦除算法）：数据被覆盖 `seven` 次，首先是全 `0`，然后全 `1`，以此类推。\n\
  - `Gutman method`（古特曼方法）：数据区域被覆盖 `35` 次。\n- `Degaussing`（消磁）是一个磁介质去磁的过程，使介质上留下极低的磁感应残留。这需要将介质暴露在极强的磁场中。消磁可以使旧磁介质充分净化以便重复使用；然而，对带有芯片组的磁盘和磁带等现代介质进行消磁会导致它们失效（本质上是破坏）。\n\
  - `Physical destruction`（物理销毁）是破坏介质使其无法重复使用且无法访问数据的过程。这是安全的数据销毁方法。这包括粉碎、破碎、焚烧、分解和化学化合物溶解。物理销毁也是用于纸质文档的方法，因为无法对纸质文档进行清除、清零或消磁。\n\
  \n## 弱环节：垃圾桶！\n\n在结束使用寿命后，旧电脑及其硬盘和其他磁存储介质会被更换并丢弃。为了降低这些资产上存在残留数据的风险，使用了几种数据净化方法，包括对介质进行清除、清零、消磁和物理销毁。然而，数字数据并不是唯一必须保护的信息类型。其他形式的信息（如纸张）也需要安全处置，以防止翻垃圾桶。`Dumpster\
  \ diving`（翻垃圾桶）是指搜寻垃圾（垃圾桶、办公室垃圾桶、回收箱等）以寻找未经过妥当净化就被丢弃的贵贵信息（如敏感纸质文档或未净化的物理介质）。敏感文档的最佳处置方法是物理销毁，如粉碎或焚烧。这可以防止翻垃圾桶者的侵害。\n\
  \n## 身份与访问管理\n\n`Identity and access management (IAM)`（身份与访问管理）是指用于管理和控制访问企业资源的系统和流程。`IAM`\
  \ 涉及管理和实施 `who` 正在访问 `what` 以及他们可以对其做什么 `do`。这涉及到三个关键术语：\n\n- `Subject`（主体）：主动访问对象的实体\n\
  - `Object`（对象）：被主体访问的实体\n- `Access`（访问）：主体可以对对象执行或施加的动作\n\n`subject`（主体）是一个主动实体，如访问对象的个人、系统、进程或设备。对主体的身份的管理和验证就是身份管理发挥作用的地方。`Identity\
  \ management`（身份管理）侧重于识别主体是谁，并验证（认证）他们确实是他们所的人。`object`（对象）是一个实体，如网络、计算机、文件、设备、记录、表、进程、域、数据库或程序，包含被主体访问的信息。对象通常是存储、处理或发送/接收数据的资源。`Access`（访问）是主体对对象实施的操作，如读取、修改、删除、创建或执行。这就是访问管理发挥作用的地方。`Access\
  \ management`（访问管理）系统管理主体可以访问哪些对象以及他们对这些对象做什么。\n\n### 硬拷贝示例\n\n访问的概念可以通过考虑它如何不仅适用于数字数据，也适用于纸质数据来说说明。例如，如果一个组织将敏感文档储存在保险箱中，组织必须通过仅提供给授权员工的组合（访问管理）来限制访问保险箱的人员。为了向某提供组合，组织必须知道此人是谁并验证其身份，以确保他们确实是他们所的人（身份管理）。在这个例子中，使用组合打开保险箱的授权员工是主体，保险箱是对象。\n\
  \n本节讨论了以下主题：\n\n- 身份与访问管理基础\n- 身份管理技术\n- 认证因素和机制\n- 访问控制原则\n- 访问控制模型\n- 访问控制管理\n\
  - 身份与访问管理生命周期\n\n### 身份与访问管理基础\n\n身份管理侧重于识别和验证主体的身份，而访问管理侧重于管理主体对对象的访问，定义可以执行的操作并跟踪这些操作。这些通过后续定义的识别、认证、授权和问责/审计来实现：\n\
  \n- `Identification`（识别）：识别功能识别主体是谁。在许多系统中，主体提供身份信息来识别他们自己，例如用户名、帐户号码或用户 ID。\n-\
  \ `Authentication`（认证）：认证功能验证主体确实是他们所的人。身份的验证通常通过使用密码、口令、令牌设备、智能卡、加密密钥或生物识别完成。这些都是认证的方法。\n\
  - `Authorization`（授权）：授权功能根据预定义的访问管理规则授予对象的访问权限，这些规则建立了主体允许在对象上执行哪些操作。\n\n\n\n\n\
  \n- **问责/审计**：问责/审计功能通过审计日志和监控对活动进行追踪。这使得主体必须对其行为负责，并且只有在主体通过身份管理进行唯一标识时才能实现这一功能。\n\
  \n实现身份验证、授权和计费/审计的协议被称为 `AAA`（“三 A”）协议。示例包括 `RADIUS`、`TACACS+` 和 `Diameter`。\n\n\
  ### 身份管理技术\n\n身份管理技术包括一系列产品、应用程序和解决方案，用于对访问的主体进行识别、身份验证和授权。以下是一些支持身份管理的关键技术：\n\n\
  - **目录服务**：大多数组织利用包含组织用户、资源和网络信息的目录。目录存储并集中管理资源信息、策略和用户凭据。最常见的例子是微软的 `Active Directory`（`AD`），它用于管理\
  \ Windows 域网。\n- **密码密码管理器**：密码管理器通常供小型组织和家庭用户使用，他们可能没有基础设施或资源来建立目录服务。密码管理器提供了一个集化的加密数据库，用于密码的存储和管理。提供的方案从云端解决方案到桌面应用程序不等。\n\
  - **单点登录 (SSO)**：单点登录允许用户使用一组凭据进行一次身份验证，即可访问一系列资源（而不是为每个系统设置单独的密码）。SSO 可以帮助减少管理工作，因为它减少了需要管理的密码数量，并有助于鼓励使用更强密码，因为用户需要记住的密码减少了。然而，SSO\
  \ 也可能带来安全问题，因为受攻击的账户可能被访问各种资源。\n- **联邦身份管理 (FIM)**：联邦身份管理是单点登录的一种变体，允许组织建立安排，利用相同的识别和身份验证数据跨多个组织验证用户。SSO\
  \ 仅允许用户验证单个组织内的系统，而 FIM 允许用户验证参与安排的任何组织的系统。`安全断言标记语言`（`SAML`）是一种可扩展标记语言（`XML`）标准，能够在组织之间交换身份信息。\n\
  - **身份即服务 (IDaaS)**：IDaaS 是另一种云端“即服务”模型。云端身份管理提供身份和访问管理功能，包括配置和撤销身份的能力，以及监控（包括日志和报告）。IDaaS\
  \ 通常包括配置目录同步、单点登录和联邦身份等其他技术的能力。\n\n## 身份验证因素和机制\n\n身份验证三个三个因素包括：\n\n- **类型 1，你知道的\
  \ (`know`)**（如密码、密码短语或 `PIN`）\n- **类型 2，你拥有的 (`have`)**（如令牌令牌设备、智能卡或 USB 驱动器）\n\
  - **类型 3，你特征的 (`are`)**（生物识别，如语音、指纹或手掌扫描）\n\n仅使用这些因素中的一种被称为`单因素身份验证`。使用两个身份验证因素被称为`双因素身份验证`（例如智能卡和\
  \ PIN、密码和生物识别，或密码和物理令牌）。`多因素身份验证`是指两个或多个因素的使用\n\n![Images](img/tip.jpg)\n\n**提示**\
  \ 从“性价比”角度来看，多因素身份验证的实施反复证明可以显著提高安全态势并降低受攻击风险。这是因为每个因素都增加了网络犯罪分子实施攻击所需的工作量。例如，即使用户被骗交了密码，攻击者还需要额外的身份验证因素才能获得访问。\n\
  \n### 访问控制原则\n\n`访问控制`是调节和控制主体与对象（系统、建筑和数据）交互方式的安全控制措施，以确保获得授权的访问。目标是防止未经授权的主体访问系统、文件和数据等对象。以下是\
  \ CISO 应该的基本访问控制：\n\n- **访问控制策略和程序**：与任何信息安全工作流或子程序一样，组织的访问控制策略和方法必须记录在访问控制策略和程序中。\n\
  - **最小权限**：访问权限应使用`最小权限原则`模型进行授予，用户仅获得完成其工作和相应任务所需的权限级别。\n- **知情需要**：用户对其访问的信息应有正当的知情需要。“知情需要`原则与最小权限类似，意味着用户访问特定信息有合法理由。\n\
  - **职责分离**：确保个人无法单人完成关键流程、活动或任务，这可以防止欺诈和其他非法活动发生。审计职的职责分离尤为重要，以确保完成任务的人员不是在审计自己。\n\
  - **系统使用通知**：组织通常利用警告横幅在授予系统访问之前提供系统使用通知或消息。这些横幅提供了隐私、安全和可接受使用通知，告知用户监控实践并告知预期行为。\n\
  \n### 访问控制模型\n\n访问控制模型是用于调节主体与对象之间交互的规则集。这些模型由供应商在操作系统和应用程序等产品设计中实现。组织也使用这些模型来设计如何在企业中实施访问控制。以下是访问控制的主要类型：\n\
  \n- **强制性访问控制 (MAC)**：MAC 模型使用中央权威，根据主体的`许可`（clearance）和对象的`分类`（classification）来调节访问。主体的许可必须大于或等于对象的许可。MAC\
  \ 模型通常用于专门的政府和军事系统，或特定的 OS 发行版，例如由 NSA 和 Red Hat 开发的`安全增强 Linux`（`SELinux`）。\n-\
  \ **自主性访问控制 (DAC)**：DAC 模型赋予所有者（通常是创建者）对对象（资源）的完全控制权，以决定哪些主体（用户和组）可以访问和共享该对象。DAC\
  \ 是一种基于身份的模型。DAC 示例包括大多数 Unix 和 Linux 变体以及所有的 Windows 和 macOS 系统。DAC 集成在操作系统内核中，可以使用访问控制列表（`ACL`）应用于单个文件以及整个目录。\n\
  - **基于属性的访问控制 (ABAC)**：ABAC 也称为基于策略的访问控制 (`PBAC`) 或基于声明的访问控制 (`CBAC`)，它根据技术策略授予访问权限，这些策略结合了各种属性，如请求者（主体）、请求的资源（对象）、环境条件（如时间或位置，环境上下文）以及请求的操作。访问可以根据日期、时间、IP\
  \ 地址等多种属性的组合授予。\n\n\n\n\n\n- **基于角色的访问控制 (RBAC)** `RBAC`，也称为非强制性访问控制，它根据主体在组织中的角色来实施访问控制。每个角色都分配了特定的权限，并根据其功能将用户分配到相应的角色。例如，可以构建\
  \ `User`（用户）、`IT Administrator`（IT 管理员）、`HR`（人力资源）和 `Developer`（开发者）角色，并根据他们的工作职责将用户分配到这些角色。这种模型简化了管理，并为组织结构提供了更好的支持。`RBAC`\
  \ 可以（并且经常）结合 `DAC` 和 `MAC` 使用使用。\n\n![Images](img/note.jpg)\n\n**注意** 现代操作系统如 `Windows`、`Linux`\
  \ 和 `macOS` 同时使用了 `DAC` 和 `MAC`。它们在每个操作系统中有不同的名称；然而，传统上认为是基于 `DAC` 的系统在底层都掺杂了 `MAC`\
  \ 功能，通常是为了降低管理员用户执行恶意软件的风险。例如，`Windows` 采用了 `User Account Control (UAC)`，这是一种 `MAC`\
  \ 强制机制，用于隔离具有不同权限级别的进程。\n\n访问控制模型是在企业级实施的，结合了操作系统/应用程序的设计特性和组织的实施。例如，`Microsoft\
  \ Active Directory` 为组织提供了实施 `RBAC` 的工具。通过使用 `AD`，组织可以定义组织角色并为每个角色分配某些权限，然后通过为用户分配角色来完成每个用户的配置。\n\
  \n虽然像 `AD` 等系统处理了 `RBAC` 的实施，但确定组织需要哪些角色以及每个角色关联哪些权限是一项挑战。事实上，许多组织发现实施 `RBAC` 是困难的，因为这需要组织内部进行大量的协作来定义角色和权限。为了克服这个问题，一些组织分阶段实施\
  \ `RBAC`，首先定义粗粒度的角色，然后随着时间的推移增加细粒度。\n\n### 访问控制管理\n\n访问控制通常使用集中式、去中心化或混合方法进行管理，如图图\
  \ 4-2 所示。每种管理类型在这里都进行了定义和讨论：\n\n![Images](img/F04-02.jpg)\n\n**图 4-2** 访问控制管理\n\n\
  - **集中式 (Centralized)** 大多数组织利用集中式访问控制管理模型，由一个部门或实体负责治理、管理和配置执行访问决策的技术（通常是 IT 部门）。所有的访问请求和更改都通过该部门进行，并对账户进行集中监控。这种方法提供了更高流程的一致性；然而，与去中心化模型相比，更改可能没有那么快。\n\
  \n- **去中心化 (Decentralized)** 在去中心化访问控制管理模型中，访问管理通常由资产或资源的所有者管理。这意味着更改处理得可能更快，因为没有单一实体在管理所有的访问请求；但它可能导致访问控制和身份管理生命周期应用中的不一致。例如，离职员工可能没有被正确移除所有访问权限，从而导致组织内部出现不一致和安全漏洞。此外，这种模型可能会导致利益冲突，因为可能职责分离不足。\n\
  \n- **混合式 (Hybrid)** 混合式访问控制管理模型结合了集中式和去中心化的访问控制管理技术。例如，组织的 IT 部门可能管理关键资源的访问控制（如\
  \ `Active Directory`，集中式管理），而属于个人部门的系统（如销售团队的 `CRM`）则可能由各部门自行管理（去中心化管理）。\n\n###\
  \ 身份与访问管理生命周期\n\n身份与访问管理遵循一个通用生命周期，如图图 4-3 所示并在此描述：\n\n![Images](img/F04-03.jpg)\n\
  \n**图 4-3** 访问控制与身份管理生命周期\n\n- **配置 (Provisioning)** 生命的第一步是账户的配置，这通常作为入职流程的一部分。配置是在账户生命周期期间创建、更改、禁用和删除用户账户，以及授予和撤销账户权限的过程。组织应该拥有记录在案的程序，包括账户请求的管理审批。此外，必须确保权限和访问级别是执行所需工作的最小权限（最小权限原则），并且用户对访问有合法的业务需求（需知情原则）。\n\
  \n- **审核 (Review)** 必须定期对账户进行审核和监控，以确保随着时间的推移仍然需要访问。这对管理员账户和其他具有高权限级别的账户特为重要。当员工转到组织内的新角色时，应对对其账户和权限进行审核，以确保访问级别与角色匹配（最小权限和需知情原则）。*权限膨胀\
  \ (Privilege creep)* 是用来描述用户逐渐积累超出其角色所需访问权限的术语。这在账户管理不仔细的小型 IT 部门中经常发生。作为 IT 通才的特权员工可能会从帮助台转到系统管理、数据库管理、安全管理或另一个特权角色，最终导致危险的权限水平。应该定期进行账户审核，这通常是许多法律和监管合规驱动因素的要求。\n\
  \n- **撤销 (Revocation)** 生命周期的最后一步是在员工离开组织或员工不再需要相关账户或访问后移除访问。这一步中经常犯的一个错误是仅撤销员工的部分账户而非全部。如果一个具有高权限的员工被解雇并决定对组织报复，这可能会特别麻烦。必须建立并遵循撤销流程，以确保所有相关账户都已撤销。\n\
  \n## 通信与网络安全\n\n网络可以被视为组织的循环系统，为执行基本功能的服务器和终端提供动力。本节描述了现代局域网和广域网是如何设计和实现的、如何防御这些网络，以及如何从安全的角度看待它们。具体而言，本节涵盖了以下主题：\n\
  \n- `WANs and LANs`（广域网与局域网）\n- `IP addressing`（IP 寻址）\n- `Network address translation`（网络地址翻译）\n\
  - `Network protocols and communications`（网络协议与通信）\n- `Wireless`（无线）\n- `Network\
  \ technologies and defenses`（网络技术与防御）\n\n### WANs and LANs\n\n当代数据通信发生在局域网和广域网之上。局域网\
  \ (`LAN`) 允许设施、家庭、办公楼或一组建筑（如校园）内的计算设备和设备进行通信。广域网 (`WAN`) 允许局域网之间进行通信。有时使用市域网 (`MAN`)\
  \ 一词来指连接多个 `LANs` 的校园网。`MAN` 可以被视为覆盖地理范围较小的 `WAN`。\n\n\n\n\n广域网（WAN）使用适用于远距离通信（数十或数千英里）的电信电路。直到十年前，这些技术包括电路交换或分组交换网络，它们使用包括异步传输模式（ATM）、`SONET`、帧中继（Frame\
  \ Relay）和 `X.25` 在内的传输协议。然而，近年来，这些技术在很大程度上被基于 IP 的技术取代，包括城太网网（MetroE）和虚拟专用局域网服务（VPLS）。局域网（LAN）使用适用于短距离的通信设备。然而，LAN\
  \ 和 WAN 都使用包括传输控制协议/网际协议（`TCP/IP`）在内的网络协议来管理从源跨网络传输到预期目的的信息。\n\nWAN 和 LAN 的一个主要区别是，WAN\
  \ 通常由第三方 WAN 服务提供商或运营商提供，而 LAN 通常由组织内部运营和维护。\n\n## WAN 拓扑结构\n\n服务提供商通过多种拓扑结构提供 WAN\
  \ 基础设施，包括：\n\n- **点对点 (Point-to-point)**：点对点拓扑结构由两个终端之间的单一路径或电路组成。在这种情况下，组织连接到服务提供商的网络，该网络通过网络中的单一路径到达另一侧，另一侧可能是对等设施或另一个局域网。\n\
  \n- **星型辐射型 (Hub and spoke)**：当组织的设施需要连接到多个位置时，使用星型辐射型布局。在这种情况下，虽然使用多个点对点连接是一个选项，但星型辐射型提供了成本更低的替代方案。组织连接到一个维护多个站点连接的枢纽。这种拓扑结构也称为`单归备`\
  \ (single homed) ，指的是使用单个枢纽。`双归备` (dual-homed) 架构在组织设施中使用两个枢纽，每个枢纽维护其通往其他位置的独立辐射连接，以实现冗余并提高性能。\n\
  \n- **全网状 (Full mesh)**：全网状网络也用于提供多个位置之间的连接。当每个位置（节点）都有连接其到其他所有位置的电路时，即可实施该结构。这种安排提供了最大的冗余灵活性。\n\
  \n选择何种拓扑结构取决于业务性质、性能考虑和成本。点对点是最简单且成本最低的选项，但调整容量的灵活性有限，且不提供冗余。网状可能是最昂贵的，但能为负载均衡和性能优化提供更好的冗余和控制。\n\
  \n## WAN 技术\n\nWAN 链路与组织 LAN 边界接口（或终止于该边界）的部分称为`本地环` (local loop)，有时被称为连接的“末公里”。图\
  \ 4-4 提供了说明。\n\n![Images](img/F04-04.jpg)\n\n**图 4-4** WAN 最后一公里组件\n\n本地环终止于组织分界点，该点可能仅是用于将本地环连接到设施的接线盒。`数据通信设备\
  \ (DCE)` 是将本地环与`数据终端设备 (DTE)` 接口的设备，DTE 可以位于 LAN 边界的计算机或路由器。本地环连接的特性取决于所使用的通信链路类型和服务提供商网络。\n\
  \n服务提供商网络可以实现之前讨论的任何拓扑结构。它们还可以使用以下多种连接技术：\n\n- **专线 (Leased lines)**：这些是连接两个位置的物理点对点线路。专用线路价格昂贵，但仍被广泛使用。这些线路是从提供商处租赁的。`T1`\
  \ 链路以 1.544 Mbps 的速率传输数据，`T3` 链路（也称为数字信号 3 或 `DS3`）为 44.736 Mbps。`T3` 链路携带 28 个复用的\
  \ `T1` 通道。\n\n- **电路交换网络 (Circuit-switched networks)**：这些网络在通话端之间提供专用电路路径。一种常见的电路交换技术是集成业务数字网络\
  \ (`ISDN`)，它是支持数据和语音通信的交换电话网络。`ISDN` 在 21 世纪初被广泛使用，但已很大程度上被电缆、光纤或 `DSL` 等快得的服务取代。电路交换的另一个另一个是公共交换电话网\
  \ (`PSTN`)，主要用于语音和低速数据。\n\n- **分组交换网络 (Packet-switched networks)**：分组交换使用共享网络，而不是专线或电路交换提供的专用电路。由于网络在许多服务提供商客户之间共享，数据被放入`数据包`\
  \ (packets) 中，并`路由`到正确的目的地。分组交换网络还可以用于提供虚拟电路，即两个网络设备之间的逻辑连接路径。分组交换连接的示例包括 `X.25`、帧中继、`ATM`\
  \ 和城太网。前技术仍在使用，但正逐渐被城太网和其他基于以太的技术所取代。\n\n其他 WAN 通信技术包括 `DSL`、电缆和 `FTTP`、卫星和无线：\n\
  \n- **DSL**：`数字用户线路 (Digital subscriber lines)` 通过电话线提供数据通信。尽管近年来许多此类电路已被电缆或光纤服务取代，但\
  \ `DSL` 仍被广泛使用并在许多地区可用。不对称 DSL (`ADSL`) 指具有异步速率的 `DSL`，其中数据的下行速度比上行快。`ADSL` 通常供住宅用户使用。对称\
  \ DSL (`SDSL`) 的数据上、下行速率相同。高速的 `DSL` 版本是高速数据率 DSL (`HDSL`) 和极高数据率 DSL (`VDSL`)。随着\
  \ `DSL` 技术的不断演进，速度可以达到 1000 Mbps 及以上。`SDSL` 通常用于企业。\n\n- **电缆和 FTTP**：`电缆`或`电缆互联网`指的是由电缆电视商提供的宽带互联网接入。此类提供商同时也充当`互联网服务提供商\
  \ (ISP)`。`电缆`使用宽带电气或光纤入户 (`FTTP`) 技术作为通往用户（组织或住宅）设施的末公里链路媒介。通信速率通常是非同步的，每个链路可达 1\
  \ Gbps。\n\n- **卫星**：尽管存在一些技术限制，但卫星在互联网和企业间连接方面的业务应用正日益增长。现代卫星链路可以提供高达 1000 Gbps\
  \ 的下行速度和高达 1000 Mbps 的上行速度。卫星通信性能可能会受到天气影响，天气会影响通信所需的视线。由于卫星、地面站和设施设备之间的长距离和跳数，卫星通信受到延迟影响。低地球轨道\
  \ (LEO) 服务等新技术在不久的将来可能会带来更好的性能并降低成本。\n\n- **无线**：无线 WAN 与无处的无线局域网的区别在于，它们使用蜂窝技术实现更距离的通信。无线局域网使用\
  \ `2G`、`3G`、`4G LTE` 和 `5G` 等蜂窝技术。由于无线 WAN 不受物理技术的保护，它们通常使用身份验证和加密来保护通信免受截获或窃听。\n\
  \n\n\n\n典型的局域网（LAN）由通过边界设备启用的一个或多个外部连接以及一个通常分段以实现性能和/或安全目标的内部网络组成。内部网络可以是有线网络（现在几乎都是以太网）、无线网络，或者有线与无线的结合。图\
  \ 4-5 展示了一个典型的网络。图中显示的某些组件在此处介绍，另一些将在本节稍后部分讨论。\n\n![Images](img/F04-05.jpg)\n\n\
  **图 4-5** 典型的局域网\n\n外部用户和客户通过 Internet 访问组织网络，“最后一里”在组织场所通过 Internet 路由器终止，该路由器负责路由和控制进出组织局域网的流量。各种设备的物理排列方式称为网络\
  \ `topology*。图 4-5 没有显示特定的拓扑结构。有许多可能的网络拓扑，包括总线型、环型、树型、星型、网型和混合拓扑。大多数现代局域网使用星型拓扑。\n\
  \n网络上的每个设备都有一个 Internet 协议（IP）地址。数据使用这些 IP 地址在设备之间路由。路由器是连接相似或不同网络的设备，并使用 IP 地址“路由”流量。\n\
  \n局域网内部及局域网之间的所有数据通信都使用由 `protocols` 定义的消息格式。消息包含每个设备和应用程序根据协议处理消息所需的所有信息。每条消息由一个\
  \ `packet` 组成，包含以下信息：\n\n• 消息源或来源标识\n• 消息目的标识\n• 控制信息，可能包括序列号、标志、指针、长度、和等\n• 数据（但并非总是如此——某些消息只包含控制信息，不包含数据）\n\
  \n根据包中的信息，网络上的各种设备对数据进行路由和/或处理。以下是一些最常见网络设备的简要总结：\n\n• `Internet router` 这是位于局域网边界的设备，提供到\
  \ WAN 链路的接口。\n• `Router` 有时 Internet 路由器会与边界路由器相结合，甚至可以作为外部防火墙，根据组织的安全策略过滤流量。路由器执行网络段之间的数据路由，并可能执行其他功能，例如网络地址翻译（NAT），这将在后续章节中讨论。\n\
  • `Firewall` 防火墙是用于执行安全策略的专用设备，例如允许或拒绝某些类型的流量。本节稍后将详细讨论防火墙，它们在保护组织网络方面着重要作用。图 4-5\
  \ 中的防火墙被用于控制局域网边界的流量，并专门过滤进出组织邮件服务器、面向外部网站以及内部分段网络的流量。\n• `Switch` 交换机工作在 OSI 第\
  \ 2 层（稍后将介绍 OSI 模型），允许网络配置为分段，从而更好地利用可用带宽并可用于创建安全区域。\n\n### IP 地址\n\n地址决定了数据如何在整个以太网中发送和接收。就像房屋地址使邮件能够投递一样，子网掩码识别了网络的某部分。事实上，IPv4\
  \ 由 32 位组成。组织使用许多私有地址范围：\n\n- `10.0.0.0` 到 `10.255.255.255`\n- `172.16.0.0` 到 `172.31.255.255`\n\
  - `192.168.0.0` 到 `192.168.255.255`\n\n行业使用无分类域间路由（CIDR）表示法，即地址后跟一个斜杠 `/`。例如，`192.168.0.0/24`\
  \ 表示前 24 位是网络。\n\n### 网络地址翻译\n\nInternet 路由器未配置为跨 Internet 路由私有地址。那么，如果不使用私有地址，数据如何在\
  \ Internet 上路由呢？为此，IPv4 使用网络地址翻译（NAT）。\n\n通过 NAT，组织边界的路由器被配置为将外部（公共）地址映射到内部（私有）地址。NAT\
  \ 有许多类型，最基础的是一对一映射。\n\n### 向 IPv6 迁移\n\nIPv4 使用 32 位地址，支持超过 37 亿地址。这似乎足够了，但考虑到地球上有约\
  \ 60 亿人口，看来有一天我们将耗尽地址。为了解决这个问题，IPv6 在 2012 年开发并发布。IPv6 使用 128 位，支持 $2^{128}$ 次（340,282,366,920,938,463,463,374,607,431,768,211,456）地址。这应该足够了。然而，尽管现在采用\
  \ IPv6 可以简化某些问题（例如消除对 NAT 的需求），但 IPv6 的采用仍然缓慢。\n\n### 网络协议与通信\n\n现代网络上的设备之间的通信只有在存在它们都遵循的共同模型时才能发生。行业最常用的是开放系统互连（OSI）模型（或称为\
  \ TCP/IP 模型的变体），作为建立和描述网络上每个设备如何相互通信的方法。\n\n• 解释网络化如何发生，并用于构建网络服务和协议\n- 通过定义接口标准，实现厂商产品之间的互操作性\n\
  \n\n\n\n\n-   提供模块化方法，以便在更换某部分时而不影响其他部分。\n\nOSI 参考模型由 `ISO` 标准 `7498` 定义，它将网络任务、协议和服务划分为以下层级（或网络堆栈）：\n\
  \n- `应用层（第 7 层）`：主要负责与用户进行交互。这是用户体验的应用程序接口。\n- `表示层（第 6 层）`：主要负责将用户期望的数据格式转换为网络期望的格式。\n\
  - `会话层（第 5 层）`：主要负责系统与应用程序之间的对话控制。\n- `传输层（第 4 层）`：主要负责处理端到端数据传输服务。\n- `网络层（第 3\
  \ 层）`：主要负责逻辑地址（如 `IP` 地址），并包括路由等规范。\n- `数据链路层（第 2 层）`：主要负责物理地址（如 `MAC` 地址）。\n- `物理层（第\
  \ 1 层）`：主要负责物理交付以及如电压变化和持续时间等规范。\n\n协议是用于数据通信的一系列规则和标准。协议定义了系统、设备或应用程序之间交换数据所需的过程和消息格式。许多协议包含身份验证、服务质量或纠错的方法。表\
  \ 4-2 显示了常用协议及其运行的 OSI 模型层级。\n\n![Images](img/p207.jpg)\n\n## 表 4-2 常用协议\n\n###\
  \ 应用层\n\n应用层协议处理文件传输、执行网络管理功能并满足来自应用程序的网络请求。以下是一些常见的应用层协议：\n\n- `域名命名系统 (DNS)`：`DNS`\
  \ 就像互联网的电话簿。它允许我们使用域名（如 `google.com`），而无需记住特定服务器的 `IP` 地址。`DNS` 协议允许应用程序交换并满足 `DNS`\
  \ 请求。\n- `文件传输协议 (FTP)`：该协议用于在系统之间传输整个文件。\n- `简单网络管理协议 (SNMP)`：该协议首次于 1998 年发布，作为一种管理网络上设备的方法。它使用客户端-服务器架构，客户端使用运行在被管理网络设备上的\
  \ `agents`（代理）。`agents` 收集设备信息并将其报告给服务器上的 `manager`（管理器）。`SNMP` 的早期版本提供了一种控制和获取网络设备状态的好方法，但存在严重的安全漏洞。`SNMP`\
  \ 使用名为 `community strings`（团体字）的密码系统进行身份验证，在实践中，这些字符串经常在网络上发送或以明文形式存储，使得攻击者很容易获取网络设备的配置信息以及网络可能被破坏的信息。`SNMP`\
  \ 版本……（此处由于原文存在重复，已根据要求完成完整翻译）。\n\n（更正：原文部分完整翻译如下）：\n\n- `域名命名系统 (DNS)`：`DNS` 就像互联网的电话簿。它允许我们使用域名（如\
