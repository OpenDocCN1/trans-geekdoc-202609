  \ 使用名为 `community strings`（团体字）的密码系统进行身份验证，在实践中，这些字符串经常在网络上发送或以明文形式存储，使得攻击者很容易获取网络设备的配置信息以及网络可能被破坏的信息。\n\
  - `超文本传输协议 (HTTP)`：`HTTP` 是一种在网页上传输数据的方法。\n- `安全超文本传输协议 (HTTPS)`：`HTTPS` 是 HTTP\
  \ 的安全版本，用于加密传输。\n- `安全外壳 (SSH)`：`SSH` 用于安全地登录远程计算机并执行命令。\n- `网络时间协议 (NTP)`：`NTP`\
  \ 用于在网络设备之间同步时间。\n- `动态主机配置协议 (DHCP)`：`DHCP` 用于为主机自动分配 IP 地址。\n\n\n\n\n网络层协议主要涉及路由以及其他网络和互联服务。以下是常用的网络层协议：\n\
  \n- `Internet Protocol (IP)`：`IP` 负责根据 `IP` 地址从源地向目的地交付数据包（也称为数据报文）。路由器维护着各种表，用以跟踪\
  \ `IP` 地址和相应的系统，并遵循 `IP` 规则和其他协议，在整个网络中路由流量。\n- `Internet Group Management Protocol\
  \ (IGMP)`：`IGMP` 用于管理组播组。当一个系统想要参与组播流量传输时，它会成为组播组的成员。`IGMP` 用于通知路由器该系统属于某个组。一旦建立成员关系，将使用协议无关组播\
  \ (`PIM`) 服务来将组播流量直接定向到成员系统。\n\n## 数据链路层\n`data link` 层由子层组成：逻辑链路控制 (`LLC`）和介质访问控制\
  \ (`MAC`）。数据链路层的协议将数据转换为帧以进行传输。\n\n- `Address Resolution Protocol (ARP)`：`ARP` 将\
  \ `IP` 地址映射到 `MAC` 地址。`MAC` 地址是一个硬编码到网络设备或计算机系统中的 48 位地址。网络上的计算机使用 `ARP` 来学习哪个 `MAC`\
  \ 地址对应哪个 `IP` 地址，然后将该信息用于未来的通信。`ARP poisoning` 是一种攻击类型，攻击者通过手段欺骗交换机在其缓存中保存错误信息，导致数据在网络上被误路由。\n\
  - `Point-to-Point Protocol (PPP)`：`PPP` 用于提供两个实体之间的通信。它提供包括身份验证、加密和压缩在内的服务。它经常用于拨号接入和串口通信链路。\n\
  - `Ethernet`（以太网）：`Ethernet` 已取代了旧的局域网技术，现在是局域网（LAN）通信的事实标准。`Ethernet` 将通信划分为帧，每个帧都包含源和目的\
  \ `MAC` 地址以及用于增强传输可靠性的错误检查数据。\n\n## 物理层\n物理层并没有真正的协议，而是定义了传输物理方面的标准。这些标准包括用于串行传输的\
  \ `EIA-232`、`422`、`423`、`449` 等；以太网物理层（`10BASE-T`、`10BASE2`、`10BASE5` 等）；光层传输网络\
  \ (`OTN`) 以及其他能够承载 OSI 兼容协议的物理技术。\n\n## 网络协议和设备总结\n之前关于 OSI 模型及相关协议的讨论总结在图 4-7 中。注意，该图还显示了替代的\
  \ `TCP/IP` 模型（也称为 DoD 模型），它结合了某些 OSI 层。\n\n![Images](img/F04-07.jpg)\n\n**图 4-7**\
  \ 网络总结\n\n### 无线\n无线技术允许计算机和其他设备通过射频 (`RF`) 通信连接到局域网。这为计算机的物理布局和位置提供了极大的灵活性。如今的无线局域网遵循\
  \ `IEEE 802.11` 局域网协议，大多数运行在两个 RF 频段上：`2.4 GHz` 和 `5 GHz`。无线技术通过以下两个组件在局域网中实现：\n\
  \n- 无线路由器（接入点）\n- 无线网络适配器，以扩展卡或内置于计算机、手机和其他设备的形式实现\n\n无线网络使用服务集标识符 (`SSID`) 作为网络名称。`SSID`\
  \ 允许所有设备连接并属于同一个无线网络。所有连接到无线网络的设备被称为 `stations`（站位）。\n\n`802.11` 网络有两种基本形式：`infrastructure`（基础结构）和\
  \ `ad hoc`（也称为网格）。在基础结构网络中，所有站位通过接入点或无线路由器进行通信。接入点作为通往其他网络的桥梁，最常见的是有线局域网或互联网连接。`ad\
  \ hoc` 模式允许站位以对点的方式进行通信，不需要接入点。\n\n无线网络缺乏物理控制，这带来了特殊的安全挑战。任何路人都可以访问从站位发出的 `802.11`\
  \ 信号。在无线技术的早期，身份验证机制要么不存在，要么实现不良，使得无线成为网络分子实施网络攻击的简单方法。然而，多年来无线技术已添加了更强大的安全功能。旧方法无线等效加密\
  \ (`WEP`) 的安全性无效，已被不断演进的变体 Wi-Fi 保护访问 (`WPA`、`WPA2` 和 `WPA3`) 取代。\n\n### 网络技术与防御\n\
  本节讨论了与局域网和组织网络相关的风险以及缓解这些风险的常用方法。\n\n### 防火墙\n之前“局域网基础设施”部分中的图 4-5 显示了一个受防火墙保护的单一数据出口的网络。防火墙是一种通用且广泛使用的技术，用于控制两个网络或网络两个分段之间的访问。防火墙通常有三种类型：包过滤器、代理和状态检测/动态包过滤器。这些类型有时分别被称为第\
  \ 1 代、第 2 代和第 3 代。\n\n**包过滤器 (Packet Filter)**：包过滤器是最基本且最廉价的防火墙。包过滤器是一种根据内部访问控制列表\
  \ (`ACL`) 筛选流量的路由器。路由器筛选所有流量，并根据每条信息的网络层和传输层头部信息，决定是否允许或拒绝流量从一个接口通过到另一个接口。防火墙可以根据包括标准的标准做出访问决策：\n\
  - 源和目的 `IP` 地址\n- 源和目的端口号\n- 协议\n- 流量方向\n\n例如，`ACL` 可能包含这样一条规则：只有当使用 `HTTP` 协议的网络流量包含组织\
  \ Web 服务器的目的 `IP` 地址时，才能进入局域网。通过限制什么类型的流量进入和离开网络以及其特定目的，可以减少恶意或错误活动的风险。防火墙可以位于局域网的边界，也可以在内部创建特殊安全区域以进一步控制企业的安全性。\n\
  \n**代理 (Proxy)**：代理防火墙部署在信任网络和不可信网络之间，充当卫兵。在日常英语中，`proxy` 是指代表他人办事的人。代理充当中间人。使用代理防火墙时，网络之间不会发生直接通信，因为代理会模拟连接另一端的系统，并隐藏其受保护网络内部设备的\
  \ `IP` 地址。代理拦截并重新封装所有流量，应用安全策略，并防止网络之间的直接连接。这使得网络分子更难发现另一侧的信息。\n\n**状态检测/动态包过滤器\
  \ (Stateful/Dynamic Packet Filter)**：状态检测/动态包过滤器就像一个偷听别人对话并插手的多管闲邻居。这些防火墙不仅检查消息以做出决策，还会记录它们之前学到的对话信息，以便对拒绝或允许什么类型的流量做出更明智的决策。它们根据以下信息做出访问决策：\n\
  - `IP` 地址\n- 协议和命令\n- 与之前数据包的对比\n- 数据包的内容\n\n\n\n\n状态检测防火墙监控网络会话的状态，只有当数据包是现有授权会话的一部分时，才允许其通过防火墙。当授权的主机创建一个新会话时，防火墙会跟踪该会话的“状态”，以便允许回程流量（来自对方）通过。当会话完成时，由于防火墙正在监控会话状态，它会察觉到会话的结束，并关闭回程流量的通道。这样，即使之前参与过会话且流量此前被允许通过的同一台主机（对方）尝试通过防火墙进行通信，其流量也将拦截。\n\
  \n![Images](img/exam.jpg)\n\n**考试贴士** CCISO 候选人应该熟悉不同类型的防火墙及其功能。\n\n## 网络分段与 DMZ\n\
  \n网络通常被划分为多个`segments`（段），以实施安全控制，限制对网络部分或从网络部分的访问。分段根据策略限制了流向网络某些部分的流量。例如，一个组织可能使用分段来限制对用于财务系统的网络区域的访问。只有授权用户才能访问该部分网络。分段为攻击者越越敏感系统制造了更多障碍，增加了攻击的`work\
  \ factor`（工作因子）。\n\n分段可以通过`physically`（物理方式）将网络拆分为更小的网络来实现。或者也可以通过`logically`（逻辑方式）使用相同的物理网络硬件创建逻辑上相互独立的网络（虚拟网络或\
  \ VLAN）来实现分段。VLAN 的实现，通过配置网络交换机和路由器，将网络上的特定节点与逻辑段关联，并根据安全策略限制段之间的通信。\n\n非军事化区（DMZ）是介于受保护的内部网络和外部网络之间的网络段，如图\
  \ 4-8 所示。\n\n![Images](img/F04-08.jpg)\n\n**图 4-8** 非军事化区\n\nDMZ 创建了一个缓冲区。两层防火墙形成了\
  \ DMZ 边界并保护了内部网络资产。公司通常将电子邮件、Web 和 DNS 服务器放置在 DMZ 中。尽管这些服务器是“面向互联网”的，但它们仍然位于防火墙之后。但\
  \ DMZ 中的服务器仍然容易受到攻击，由于处于外部攻击的第一线，因此应该进行仔细的加固。\n\n## 虚拟专用网络\n\nVPN 是连接到组织受保护网络的安全专用连接，它通过不可信的公共网络传输。使用\
  \ VPN 技术，组织可以虚拟地将其私有网络扩展到网络正常边界之外。这是通过使用隧道技术实现的，该技术提供了一个通过不可信网络（如互联网）的加密通道进入组织的受保护企业内部。因此，如在家庭办公室工作的员工等远程用户可以访问内部公司网络上的资源，几乎就像他们有直接连接一样。\n\
  \nVPN 使用隧道协议来封装帧/数据包，使其能够能够在网络中传输。它们保留了原始协议标头，以便消息可以在目的地被“解包”，但它们允许被封装的帧作为普通流量进行路由。这些是最常用的\
  \ VPN 协议：\n\n- ****点对点隧道协议 (PPTP)**：多年来，PPTP 一直是事实上的 VPN 标准。然而，现在有更好且使用更广泛的新型 VPN\
  \ 技术，例如 IPSec。\n- ****数据层隧道协议 (L2TP)**：L2TP 由思科开发，作为解决 PPTP 局限性的解决方案。然而，L2TP 不提供加密，因此通常与\
  \ IPSec 等其他方法结合使用。\n- ****IP 安全 (IPSec)**：IPSec 是一组协议，结合使用提供数据完整性、身份验证和机密性。它现在是\
  \ VPN 的事实标准。\n\n## IDS/IPS\n\n入侵检测系统（IDS）和入侵防御系统（IPS）是伴随技术，涉及用于检测（IDS）和防止（IPS）恶意活动的专用工具。两者都在整个网络中部署传感器，这些传感器与控制或报告系统通信，允许安全人员监控恶意活动并采取措施。\n\
  \n`基于网络的入侵检测系统 (NIDS)` 以计算机或专用设备的形式部署在整个网络中，用于监控并防止安全入侵。`基于主机的入侵检测系统 (HIDS)` 使用安装在主机上的代理来监控并检测主机上的恶意活动。\n\
  \n无论是基于网络还是基于主机，IDS 均采用了多种检测方法：\n\n- ****基于签名的 IDS**：查找流量、特定消息或系统中的特定模式。这些特定模式被称为`签名`。通常签名维护在库中。很多时候，IDS\
  \ 产品供应商提供订阅服务，由第三方供应商进行威胁情报活动，不断了解新攻击以及哪些签名指示它们的存在。这些签名被下载到 IDS 产品中，使其能够持续监控并检测最新的攻击。基于签名的\
  \ IDS 适用于检测已知的攻击和恶意软件，但检测新类型攻击的能力较弱。\n- **基于异常的 IDS**：更适用于检测未知攻击。如果说基于签名的 IDS 擅长识别什么是“坏”，那么基于异常的\
  \ IDS 就擅长识别什么是“好”。基于异常的 IDS 使用人工智能和机器学习等特殊方法来构建网络或系统正常活动的快谱。然后，如果 IDS 看到偏离常规的活动，它就会发出警报，指示该活动应接受调查。基于异常的\
  \ IDS 适用于检测可能不存在签名的未知攻击。\n\nIDS 和 IPS 产品基本上使用相同的技术和方法来检测潜在的恶意活动。区别在于它们对这些活动采取什么行动。IDS\
  \ 仅将活动报告到控制台，安全人员可以在那里查看警报并进行调查，以确定警报是否代表真实的恶意活动或入侵，然后确定正确的行动方案。IPS 则超越了简单的检测和报告，通过采取行动尝试阻止攻击或将其影响最小。可选行动可能包括阻止来自特定\
  \ IP 地址的流量、关闭防火墙端口、重置路由器等设备，甚至更改数据包或主机中的数据以删除或替换恶意消息或文件。\n\n\n\n\n\n明智使用 IDS/IPS\
  \ 解决方案的关键在于`tuning`（调优）。调优涉及选择、报告、告警和预防功能的敏感级别。如果安全运维人员将阈值设置得非常低，他们可以检测到所有潜在的恶意事件；如果设置得非常高，他们可能会错过某些事件，但将确保捕获最重要的事件。然而，将级别设置过低可能会导致组织和安全运维人员被大量未指示入侵活动的消息和警报（误报）所淹没。同样，将阈值设置过高可能导致严重的安全泄露未被发现（漏报）。对于每个安全组织和\
  \ CISO 来说，挑战在于确定合适的 IDS/IPS 运行水平。\n\n那么，CISO 如何如何决定什么是合适的水平？像所有的安全决策一样，这归结为风险管理。被监控的资产价值几何？检测的成本是多少？将级别设低并捕获比更多的事件会增加运营成本。每年花费\
  \ 200 万美元运行 IDS 能力来监控一个价值 100 万美元的网络可能是不明智的。CISO 和安全组织应该建立模型，以预测在不同的检测阈值下，部署和维护\
  \ IDS/IPS 所需的设备和运营投入，并与组织的风险承受能力进行比较。\n\nIDS/IPS 本质上只是另一种安全控制措施，其实现应根据风险与其他候选控制措施一起考虑。\n\
  \n## 密码学\n\n密码学是最基本的信息安全实践之一，可能也是最古老的。现代`cryptography` 是利用数学来保护信息，使其未经授权的方无法理解的实践。本节介绍了以下密码学主题和概念：\n\
  \n* 密码学定义\n* 密码学服务\n* 对称、非对称和混合密码系统\n* 哈希算法\n* 消息身份验证码\n* 数字签名\n* 公钥基础设施\n\n###\
  \ 隐隐术\n\n`Steganography`（信息隐术）是一种用于在显眼处隐藏秘密信息的技术，通常在看似无害的数字文件中。这是通过使用特殊软件实现的，将消息嵌入图像、视频、音频、文本或其他文件中。\n\
  \n信息隐术和密码学是硬币的两面。虽然两者都用于通信秘密信息，但方法各不相同。信息隐术隐藏了通信甚至已经发生的这一事实，因为文件的非预期接收者不知道文件中包含隐藏消息。密码学并不隐藏通信，而是通过加密隐藏数据本身。如果非预期接收者收到了加密消息，他们知道消息在那里，但无法读取它。信息隐术并没有加密消息；它只是将消息隐藏在另一个文件中。\n\
  \n### 密码学定义\n\n为了方便对密码学的讨论，必须建立一些基础定义。密码学的基础组件包括以下内容：\n\n* `Cryptographic key`（密码密钥）：与密码算法配合使用的用于加密和解密等操作的值字符串。通常情况下，密钥越长，提供的安全性越高；但这也取决于所使用的算法和实现方式。\n\
  * `Cryptographic algorithm`（密码算法）：可用于加密、解密或哈希处理的数学方程。\n* `Plaintext`（明文）：以可读格式表示且未加密或已解密的信息。\n\
  * `Ciphertext`（密文）：已加密的不可读格式的信息。\n* `Encryption`（加密）：使用密码密钥和算法将明文转换为密文的过程。\n* `Decryption`（解密）：使用密码密钥和算法将密文转换为明文的过程。\n\
  * `Hashing`（哈希）：一种使用算法将信息转换为数据字符串的单向函数，通常用于完整性检查。\n* `Cryptosystem`（密码系统）：包括加密和解所需的所有必要系统组件，如软件、协议、算法、密钥、密钥管理等。\n\
  \n密码密钥值由密码算法使用，指示使用哪些方程、按什么顺序以及使用什么值。密钥和算法允许加密和解密操作发生，从而将明文转换为密文，反之亦然。加密和解密操作如图\
  \ 4-9\n\n**图 4-9** 密码操作\n\n### 密码学服务\n\n密码学的优之处之一是可以提供的安全服务范围，包括\n\n* `Confidentiality`（机密性）：确保只有授权方可以访问数据，且对未经授权的实体保持不可（例如加密）\n\
  * `Integrity`（完整性）：确保数据未被未经授权的方更改（例如数字签名或消息身份验证码）\n* `Authentication`（身份验证）：验证创建资源的系统或用户的身份\n\
  * `Nonrepudiation`（不可否认性）：防止发送者合法地否认他们发送过消息（例如数字签名）\n\n在我们探索各种算法和密码学实现时，本节将贯穿这些服务。\n\
  \n### 对称、非对称和混合密码系统\n\n今天用于加密和解密的两种密码算法是对称和非对称的。此外，还有利用两者优点的混合方法。\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** CCISO 候选人应该注意对称加密和非对称加密之间的区别。\n\n#### 对称加密\n\n`Symmetric encryption`（对称加密），也称为对称密钥加密，其特点是使用单一密钥进行加密和解密。这意味着加密消息的发送者和接收者必须拥有相同密钥的副本。由于任何访问密钥的人都能解密消息，因此密钥必须保密。这就是为什么它被称为\
  \ `private key`（私钥）。例如，在图 4-10\n\n**图 4-10** 对称加密示例\n\n对称算法的示例包括：\n\n* `Data Encryption\
  \ Standard (DES)`（数据加密标准）：该算法使用 56 位密钥，由于密钥长度短，容易受到暴力攻击，被认为是不安全的。因此，DES 被 3DES 和\
  \ AES 取代。\n* `Triple-DES (3DES)`（三重 DES）：3DES 在 AES 创建期间作为 DES 的过渡替代方案发布的。3DES 在加密过程中对每个数据块应用三次\
  \ DES。现代 3DES 的实现提供 168 位安全性。\n* `Advanced Encryption Standard (AES)`（高级加密标准）：AES\
  \ 是为了替代 DES 而构建的。AES 提供 128、192 和 256 位的密钥。AES 是一种成熟的国际通用对称加密标准。\n\n\n\n\n对称加密的优势在于其速度快。对称密钥加密比非对称加密快得多，计算密集性也较低。对称加密的缺点是它需要一种安全的方法来带外传输私钥，而且它的扩展性较差，因为每对用户都必须拥有一个唯一的密钥。随着用户数量的增加，密钥数量也会之增加，这会导致密钥管理变得困难。根据用户数量（表示为\
  \ `N`）计算对称加密所需密钥数的公式如下：\n\n![Images](img/p219.jpg)\n\n例如，如果 Alice、Bob 和 Carole 想要相互通信，且不让其他人读取他们的消息，他们需要三个密钥（一个给\
  \ Alice 和 Bob 使用，一个给 Alice 和 Carole 使用，以及一个给 Bob 和 Carole 使用）。然而，如果用户数量增加，例如增加到\
  \ 100 人，如所示，这将 4,950 个密钥：\n\n![Images](img/p220.jpg)\n\n对称加密通过加密提供机密性，但并不提供真实性或不可否认性。需要非对称加密来提供这些服务。\n\
  \n## 非对称加密\n\n`Asymmetric encryption`（也称为公钥加密）其特征是使用两个数学相关的密钥：公钥和私钥。公钥可以提供给所有者想要与其安全通信的任何人，但私钥必须只有所有者知道。例如，在图\
  \ 4-11 中，Alice 和 Bob 想要交换机密信息。为了向 Bob 发送消息，Alice 使用分享给她的公钥对明文消息进行加密。Bob 则必须使用只有他自己知道的私钥将消息从密文解密为明文。同样，如果\
  \ Bob 想要向 Alice 发送消息，他使用 Alice 的公钥加密消息，Alice 则使用她的私钥解密该消息。在安全服务方面，非对称加密通过加密提供机密性，并通过利用数字签名（在本节稍后的部分将讨论）提供真实性和不可否认性。\n\
  \n![Images](img/F04-11.jpg)\n\n**图 4-11** 非对称加密示例\n\n常见的非对称算法实现包括以下内容：\n\n- `Diffie-Hellman`：一种密钥协商协议，允许两个实体生成并约定一个对称密钥（会话密钥）值，该值随后由独立的对称算法用于加密和解密。它提供密钥协商功能，但不提供加密或数字签名功能。\n\
  - `Rivest-Shamir-Adleman (RSA)`：`RSA` 由 Ron Rivest、Adi Shamir 和 Leonard Adleman\
  \ 开发。该算法提供数字签名、密钥分和加密服务。公钥和私钥在数学上是相关的，该算法基于大素数乘积分解的困难性数学原理。\n- `Elliptic curve cryptography\
  \ (ECC)`：`ECC` 是另一种非对称实现，当与其他加密方案结合时，其特征。不同之处在于它的效率和密钥生成方式。ECC 比其他非对称算法高效得多，在保持相同安全级别的同时允许更快的加密/解密和更小的密钥尺寸。此外，密钥是基于椭曲线的属性生成的，而不是基于大素数乘积分解。\n\
  \n非对称加密的主要优势是可扩展性和密钥分布。非对称加密更容易扩展，因为每个用户只需要两个密钥（一个公钥和一个私钥）。根据用户数量（表示为 `N`）计算非对称加密所需密钥数的公式所示：\n\
  \n`2 × N = 所需唯一密钥的数量`\n\n此外，由于公钥可以自由共享，密钥分布变得更容易；公钥不需要保护，因为它是与所有人共享的。非对称加密的缺点是它比对称加密慢且计算更密集。对称密钥加密比非对称加密快得多，计算密集性也较低。这就是为什么对称加密通常用于加密数据（内容），并结合非对称加密来交换加密密钥。这就是为什么对称加密通常用于加密数据（内容），而非对称加密最用于加密密钥。\n\
  \n## 混合\n\n如所述，对称加密和非对称加密都有各自的优缺点。现代加密系统通常利用结合两者的混合模型。这两种技术的使用通常被称为 `hybrid cryptography`（混合加密）或\
  \ `digital envelope`（数字封）。图 4-12 提供了常见混合加密系统如何的插图。步骤如下：\n\n![Images](img/F04-12.jpg)\n\
  \n**图 4-12** 混合加密系统\n\n1. Alice 将她的公钥分享给 Bob。\n2. Bob 生成会话密钥并用公钥对其加密。\n3. Bob 将数字封发送给\
  \ Alice。\n4. Alice 使用私钥解密数字封。\n5. Alice 和 Bob 都使用该会话密钥（对称）。\n\n混合方法提供了两者的结合，因为它允许使用对称加密快速加密消息。协议包括\n\
  \n- `SSL/TLS`\n- `SSH`\n- `OpenPGP`\n\n为了简单起见，此示例使用了两个用户 Alice 和 Bob。\n\n## 加密系统总结\n\
  \n表 4-3 提供了对称和非对称功能基本区别的总结和比较。\n\n![Images](img/p222.jpg)\n\n**表 4-3** 对称加密与非对称加密的比较\n\
  \n### 哈希算法\n\n在“加密定义”部分中简要介绍了哈希。回顾一下，哈希算法是一种单向函数，它将信息映射到固定长度的数据字符串，称为哈希值、指纹或消息摘要。它被称为单向函数，是因为无法从哈希值还原原始消息，这与加密不同，密文可以转换回明文）。此外，使用哈希算法时不涉及密钥。例如，考虑图\
  \ 4.13 中所示的文本字符串“my-secret”和“My-secret”的 MD5 哈希值。\n\n![Images](img/F04-13.jpg)\n\
  \n**图 4-13** MD5 哈希示例\n\n如果消息的任何一个位发生变化（例如大写 M 代替小写 m），哈希值就会发生剧变，如图 413 的输出所示。哈希值可用于完整性检查，以确保消息未被修改。常见的哈希算法包括：\n\
  \n- `MD5`：消息摘要算法版本 5，产生 128 位的哈希值\n- `SHA-1`：安全哈希算法 1，产生 160 位的哈希值\n- `SHA-2`：安全哈希算法\
  \ 2，包括一个产生 224、256、384 或 512 位哈希值的哈函数族：`SHA-224`、`SHA-256`、`SHA-384`、`SHA-512`、`SHA-512/224`、`SHA-512/256`\n\
  - `SHA-3`：安全哈希算法 3，包括一个哈函数族：`SHA3-224`、`SHA3-256`、`SHA3-384`、`SHA3-512`、`SHAKE128`\
  \ 和 `SHAKE256`\n\n\n\n\n利用另一个 Alice 和 Bob 的示例，假设 Alice 想向 Bob 发送一条消息，但 Bob 想要确保消息没有被篡改。哈希可以提供这种帮助。在本例中使用哈希的一般步骤如图图\
  \ 4-14 所示，并在此概述：\n\n![Images](img/F04-14.jpg)\n\n**图 4-14** 哈希示例\n\n1. Alice 将消息通过哈希函数生成消息摘要（`MD`）。\n\
  2. 将 `MD` 附加到消息后并发送给 Bob。\n3. Bob 将消息通过相同的哈希函数，生成他自己的独立 `MD`。\n4. Bob 随后比较两个 `MD`\
  \ 值。如果它们相同，则说明消息没有被篡改。\n\n## 冲突\n\n如果一个哈希算法为两个不同的消息创建相同的哈希输出，这被称为 `collision`（冲突）。为了降低冲突发生的风险，应该使用具有更大消息摘要输出（位为位）的哈希算法。这意味着，产生\
  \ 256 位哈希值的哈希算法通常比 128 位的哈希算法对冲突更具抵抗力。\n\n取决于哈希的使用方式，冲突会导致安全问题。`MD5` 已证明容易受到攻击。这是否意味着\
  \ `MD5` 不应该使用？答案是，取决于情况。哈希值可以用于多种用途。它可以用于对文件进行完整性检查，也可以在存储密码之前对密码进行哈希。对于简单的文件完整性检查，`MD5`可能是合适的，但在应用程序中对密码进行哈希，像\
  \ `SHA-256` 这样更安全的可能是更好的选择。\n\n## 密码哈希\n\n明文密码不应存储在系统中。如果攻击者破解了此类系统或密码数据库，他们将获得明文密码。在现代操作系统中，存储的是密码哈希，而不是明文密码。这降低了系统被破解后攻击者访问明文密码的风险，同时也防止了系统管理员知道存储的密码（因为只存储了哈希值）。在\
  \ Windows 中，用户和密码哈希存储在安全账户管理器（`SAM`）数据库或活动目录中。在 Unix/Linux 系统中，用户信息和密码哈希存储在 `/etc/passwd`\
  \ 和 `/etc/shadow` 文件中。\n\n### 密码攻击\n\n攻击者使用有几种不同的方法来攻击密码：\n\n* **字典攻击**：攻击者利用一个包含词汇和术语字典列表的工具，尝试将其作为密码尝试登录系统。因此，不鼓励或防止使用字典单词作为密码非常重要。某些系统可以对密码进行检查，以防止使用字典单词。\n\
  * **暴力破解**：攻击者逐个尝试所有可能的字符组合，作为密码尝试以破解系统。这就是为什么密码复杂性非常重要。密码越长、越复杂（大小写字母、数字、特殊字符等的组合），执行成功的暴力破解攻击时所需的工作量因子就越大。\n\
  * **彩虹表攻击**：攻击者使用预先计算的明文输入和对应哈希值的表来破解密码哈希。例如，如果攻击者窃取或破解了系统的哈希密码数据库，他们可以将哈希值与彩虹表中的值进行比较，以确定明文密码。这种风险通常通过使用密码学盐（salts）来缓解。\n\
  \n### 密码学盐与加盐\n\n`salt`（盐）是附加到待哈希消息（内容）的额外随机或伪随机数据。盐用于增加对字典攻击和彩虹表攻击的抵抗力。每次哈希操作都使用不同的盐；因此，如果使用不同的盐对相同的内容（如密码）进行两次哈希，生成的哈希值将是不同的。这意味着两个具有相同密码的用户在密码数据库中具有不同的哈希值。这如图图\
  \ 4-15 所示。\n\n![Images](img/F04-15.jpg)\n\n**图 4-15** 密码学盐示例\n\n### 消息认证码\n\n哈希算法提供了消息未被修改的完整性，但它们没有提供消息的真实性。`消息认证码\
  \ (MAC)` 是一种加密函数，使用发送者和接收者之间共享的密钥同时提供完整性和真实性。`MACs`可以使用哈希算法和某些模式下的对称加密算法创建。MAC 算法的示例包括：\n\
  \n* **基于哈希的消息认证码 (HMAC)**：`HMAC` 也称为密钥哈希（`keyed hash`），它使用哈希算法和共享密钥产生 `MAC`。\n*\
  \ **密码分组链消息认证码 (CBC-MAC)**：密码分组链是对称块加密算法的许多模式之一。虽然这些算法主要用于加密数据，但 `CBC-MAC` 是一种使用对称算法（如\
  \ `AES`）产生 `MAC` 以提供真实性和完整性的方法。基于密码的消息认证码 (CMAC) 是 `CBC-MAC` 较新的实现，并进行了微调，增加了一个额外操作以增强安全性。\n\
  \n### 数字签名\n\n`数字签名` 是用发送者的私钥加密的哈希值。数字签名提供了完整性、真实性和不可否认性。这确保了消息没有被修改（完整性），确保了消息确实来自发送者（真实性），并防止了发送者否认他们发送过该消息，因为只有发送者才有权访问其私钥。根据之前讨论的哈希步骤，涉及此过程的一般步骤如下：\n\
  \n1. Alice 将消息通过哈希函数生成消息摘要。\n2. 使用 Alice 的私钥对消息摘要进行加密，并附加到发送给 Bob 的消息中。\n3. Bob\
  \ 使用 Alice 的公钥解密摘要，并通过相同的哈希函数生成自己的消息摘要。\n4. Bob 随后比较两个消息摘要值（从 Alice 那处收到的和他创建的）。如果它们相同，则说明消息没有被篡改（完整性），它一定来自\
  \ Alice（真实性），且她无法否认发送过（不可否认性）。\n\n### 公钥基础设施\n\n密钥管理是任何加密系统的关键部分。即使使用了强大的算法，密钥也是加密系统中最脆弱的环节。如果私钥泄露，加密系统的安全性也会受到破坏。密钥需要安全的创建、分发、存储、恢复和销毁。此外，公钥加密的问题之一是任何人都可以生成自己的密钥对。由于每个人都生成自己的密钥对，你如何知道收到的公钥确实来自你认为的人？例如，Bob\
  \ 可以创建一个密钥对并将将其公钥发送给 Alice，声称是 Tim 的公钥。Alice 需要某种方式来验证密钥的所有者。这就是公钥基础设施的作用。`公钥基础设施\
  \ (PKI)` 被 NIST 定义为“用于管理证书和公私密钥对的一系列策略、过程、服务器平台、软件和工作站，包括发布、维护和撤销公钥证书的能力。”\n\n\n\
  \n\n\n`public key certificate`（公钥证书），也称为 `digital certificate`，是一种包含将某个实体标识为公钥所有者（称为\
  \ `subject`主体）数据的电子证书。这些证书由受信任的第三方（称为 `issuer` 发行者或 `certificate authority`）颁发并进行数字签名，该第三方已验证了公钥所有者的身份。证书颁发机构验证主体的身份，创建一个包含主体名称及其公钥的证书，然后使用证书颁发机构的私钥对证书进行数字签名。图\
  \ 4-16 是在 Mac 上运行的 Chrome 浏览器截图，显示了使用 HTTPS 连接的网站证书。\n\n![Images](img/F04-16.jpg)\n\
  \n**图 4-16** 数字证书示例\n\n通常构成 PKI 的主要组件包括：\n\n- **注册机构 (RA)**：注册机构负责接受用户的注册请求、验证其身份并将请求传递给证书颁发机构。RA\
  \ 无法创建证书；它仅充当验证者并将请求发送到证书颁发机构。\n- **证书颁发机构 (CA)**：证书颁发机构负责创建、颁发和管理使用 CA 私钥签名的数字证书的撤销。\n\
  - **数字证书**：参与 PKI 的每个人都必须由受信任方颁发数字证书。每个人都必须有自己的公钥/私钥对。这要么是在他们的机器上本地生成的，要么由 CA 颁发。无论何种情况，必须向\
  \ CA 提供公钥。CA 将个人身份与公钥绑定并嵌入数字证书中。这作为该个体的凭证，将其身份与公钥绑定。数字证书由 CA 的私钥签名，这证明了该证书是由 CA\
  \ 颁发的，且 CA 已验证了该公钥属于所述主体。这为该密钥的接收者提供了保证。\n- **证书目录**：证书目录作为存储数字证书的仓库。\n- **证书撤销**：CA\
  \ 负责处理证书撤销。如果用户丢失了私钥或离开了组织，证书可能会被撤销。撤销证书会告诉他人不要信任该个体的公钥。被撤销的证书存储在证书撤销列表 (`CRL`）中。\n\
  \nPKI 用于实现混合加密系统方法（对称和非对称加密），并具有密钥管理和公钥保证的额外优势。PKI 通过加密提供机密性，通过签名和数字证书提供完整性、不可否认性和身份验证。在实践中，通信流将如下所示：\n\
  \n1. Alice 想要与 Bob 通信。\n2. Alice 向 Bob 发送她从 CA 接收到的数字证书。\n3. Bob 通过验证证书来确保它是由他信任的\
  \ CA 创建的、未过期、与 Alice 的信息匹配，并且具有 CA 有效的数字签名。\n4. 在 Bob 确认了证书的有效性后，他提取了 Alice 的公钥，并确保其来自\
  \ Alice。\n5. Bob 将自己的证书发送给 Alice，Alice 按照与 Bob 相同的步骤操作。\n6. Bob 使用会话密钥（对称密钥）加密消息发送给\
  \ Alice，并用 Alice 的公钥加密会话密钥。\n7. 现在双方都拥有对方的公钥以及会话密钥，他们就可以来回共享消息。\n\n## 云安全\n\nNIST\
  \ 特别出版物 800-145 `The NIST Definition of Cloud Computing`（NIST 云计算定义）将 `cloud computing`（云计算）定义为“一种实现随处可用、便利、按需网络访问共享可配置计算资源池（例如网络、服务器、存储、应用程序和服务）的模型，这些资源可以以最少的管理努力或与服务提供商的交互快速配置和释放。”组织在利用云服务时最大的关注点之一是缺乏控制。例如，云服务提供商\
  \ (`CSP`) 通常管理数据中心、硬件以及取决于服务的其他功能，但组织对安全负责，并且必须确保 `CSP` 正在实施适当的安全实践。本节将讨论云计算的以下基础知识：\n\
  \n- 云计算特征\n- 云的部署模型\n- 云服务模型\n- 云安全风险和保证级别\n- 云安全资源\n\n## 云计算特征\n\n以下是 NIST SP 800-145\
  \ 规定的云计算的基本特征：\n\n- **按需且弹性弹性**：使用云计算的组织可以在需要时配置他们需要的内容，允许他们灵活地调整资源以满足需求。\n- **资源池化**：计算机资源在多个租户之间共享，这种方式对组织及其用户来说是透明的。\n\
  - **可计量的服务**：使用的资源数量可以进行计量和测量，允许组织了解其使用情况并根据需要获取更多或更少的能力。\n- **广域网络访问**：通过网络实现访问，并由在各种终端设备上的轻量或重量客户端平台支持。\n\
  \nISO/IEC 17788 `Information technology — Cloud computing — Overview and vocabulary`（信息技术——云计算——概概述和术语）也为云计算提供了定义。它列出了各项特征，包括之前提到的特征，并增加了多租户。`Multitenancy`\
  \ 描述了物理或虚拟资源的分配方式，使得多个租户可以使用资源池，同时计算和数据与其他租户隔离开。\n\n## 云的部署模型\n\n有以下四种云部署模型可用，每种模型的特征是其基础设施的位置：\n\
  \n- **公有**：在公云部署模型中，云资源由第三方云服务提供商运营，通过订阅或按需定价模型供公众使用。公云 `CSPs` 的示例包括 `Microsoft\
  \ Azure`、`Amazon Web Services` 和 `Oracle Cloud Infrastructure`。\n- **私有**：私有云部署模型由单一组织使用的计算基础设施和资源组成。这些资源由组织、第三方或两者的结合所有并运营，并且仅供一个组织使用，而不像公云模型那样供许多人共享。某些公司在自己的数据中心运营私有云，或付费给第三方托管私有云。\n\
  - **社区**：社区云部署模型由许多组织共享的基础设施组成，用于特定目的，例如协作、特定任务，或出于安全和合规性考虑。所有权属于涉及其中的一个或多个组织，或属于第三方。\n\
  - **混合**：混合云部署模型是其他模型的混合。例如，组织可能在其环境中运营私有云，并利用公云服务进行“云突发”（cloud bursting）。这是指负载在环境之间进行负载均衡。应用程序或资源可能在私有云上运行，如果需求激增，则将处理切换到公云，以便使用额外的计算处理资源。\n\
  \n### 云服务模型\n\n\n\n\n\n要理解使用云服务的影响，最好从服务模型开始，以理解每一方的责任。以下是三类主要的云服务模型：\n\n*   **基础设施即服务\
  \ (IaaS)**：为客户提供对网络、服务器和存储资源等基础设施池的访问，这些资源可以进行虚拟化配置。云服务提供商（CSP）管理底层物理基础设施。客户管理平台和软件，如操作系统（OS）、开发工具和应用程序。\n\
  *   **平台即服务 (PaaS)**：为客户提供开发或应用程序平台，客户可以使用部署应用程序。这本质上是一个用于为各种编程语言开发的应用程序开发、测试和运行代码的地方，从而简化部署过程。在这种模型中，CSP\
  \ 管理底层基础设施（网络、服务器和存储）以及操作系统（OS）。\n*   **软件即服务 (SaaS)**：为客户提供由 CSP 托管的应用程序访问。CSP\
  \ 管理底层基础设施和平台，而客户通常只管理用户特定的应用程序配置。SaaS 的示例包括基于 Web 的电子邮件或其他 Web 应用程序，如客户关系管理（CRM）系统。\n\
  \n确保云环境中的安全始于深入理解云服务模型以及它们如何有助于分担责任制。图 4-17 提供了客户和云服务提供商各自责任的概述。\n\n![Images](img/F04-17R.jpg)\n\
  \n**图 4-17** 云共享责任模型\n\n如图 4-17 所示，特定功能的责任由 CSP 承担（IaaS、PaaS 和 SaaS）。然而，即使 CSP 承担了这些责任，组织仍负责确保组织数据的安全，并必须确保实施了适当的安全实践。例如，CSP\
  \ 可能提供安全功能（例如托管在公共云中的系统的物理安全），但组织必须进行尽职调查，以确保 CSP 实施了适当的控制措施和应对措施。\n\n### 云安全风险与保证级别\n\
  \n使用云服务提供商的风险之一是组织失去了对某些功能的控制，但仍需对安全负责。以下是 CSP 经常为客户提供的一些与云相关的安全保证级别，以协助组织进行尽职调查：\n\
  \n*   **服务水平协议 (SLAs)**：SLAs 有助于理解 CSP 同意提供的服务级别，并帮助组织判断服务是否符合其运营和安全要求。\n*   **SOC\
  \ 2/SOC 3**：组织可以要求 CSP 显示 SOC 2 或 SOC 3 报告，这些报告了与信任服务（安全性、可用性、处理完整性、机密性和隐私）相关的系统和组织控制评估。\n\
  *   **ISO 27001**：某些 CSP 的信息安全管理体系（ISMS）通过 ISO 27001 认证，证明符合信息安全管理的行业最佳实践。\n*  \
  \ **FedRAMP**：联邦风险与授权管理计划（FedRAMP）是美国联邦政府的一个计划，提供了一种评估、授权和持续监控云产品及服务的标准方法。为了实现这一点，组织必须进行尽职调查，以确保\
  \ CSP 实施了适当的控制措施和应对措施。`https://www.fedramp.gov`。\n*   **云安全联盟 (CSA)**：联邦风险与授权管理计划（FedRAMP）是美国联邦政府的一个计划，提供了一种评估、授权和持续监控云产品及服务的标准方法。\n\
  \n### 云安全资源\n\n以下是一些云安全的关键资源：\n\n*   **云安全联盟 (CSA)**：一家专注于云计算安全的非营利机构，提供工具、框架和其他文档，如第\
  \ 2 章中讨论的 `CAIQ”（共识评估问卷）和 `CCM”（云控制矩阵）。\n*   **互联网安全中心 (CIS)**：一个非营利组织提供操作系统加固标准和基准。\n\
  \n### 物理安全\n\n物理安全通常是组织的第一防线。无论实施方式和组织结构如何，首席安全官（CISO）都应该意识到物理安全与其信息安全的关系。本节讨论了以下主题：\n\
  \n*   物理安全威胁\n*   物理安全计划规划\n*   物理安全资源\n*   物理安全控制\n*   物理安全审计与测量\n*   人员安全\n\n\
  ### 物理安全威胁\n\n物理安全威胁有很多形式，例如风暴、停电或人为错误。了解组织面临的威胁类型对于设计适当的控制至关重要。威胁通常分为以下几类：\n\n\
  *   **自然/环境**：来自自然或环境风险因素的威胁，如地震、洪水、龙卷、火灾或极端温度。\n*   **供应系统**：针对供应系统的威胁，如停电、网络和通信中断、暖空调（HVAC）故障或其他公用事业（如燃气或水）中断。\n\
  *   **人为**：来自人的威胁，如不满的员工、人为错误、蓄破坏、欺诈、盗窃或未经授权的访问。\n*   **政治**：受政治动机驱动的威胁，如恐怖主义、公民不合作、暴乱或罢工。\n\
  \n\n\n\n\n当涉及到物理安全时，最重要的是保护工作环境内员工及人员的安全。安全性甚至高于安保。例如，在发生灾难时，通过自动锁定设施的所有门窗可能获得最佳安全性，这被称为\
  \ `fail-secure`（故障锁闭）。然而，这可能会将困在室内，因此更安全、更好的做法是在紧急情况下自动解锁门窗，这被称为 `fail-safe`（失效安全）。组织应确保建立\
  \ `fail-safe` 机制，因为人员安全始终是首位的。\n\n## 物理安全计划规划\n\n组织应该有一份物理安全计划，定义安全计划的目标。以下是物理安全计划中通常涵盖的主题列表：\n\
  \n• 物理控制计划，包括威慑、延迟机制和检测控制\n• 定期或非定期对物理控制进行评估的计划\n• 应对物理事件的响应计划，以确保人员安全、评估影响程度并确保正常业务功能的恢复\n\
  • 识别、获取和支持执行计划所需的资源的计划\n\n与所有安全功能一样，物理安全必须获得政策和程序的支持，以确保执行一致、可靠且可衡量的物理安全活动。\n\n\
  ## 物理安全资源\n\n在物理安全的人员配备方面，资源要么直接聘用为内部员工，要么从第三方或服务提供商外包。\n\n• **内部化 (Insourcing)**\
  \ 组织可能会选择聘用物理安全资源来管理物理安全计划。这可能包括以下角色：\n- 负责建筑和设施运营的设施经理\n- 负责人员安全的安全官\n- 负责巡逻关键区域、管理入口和监控系统的安保\n\
  - 管理技术组件（`读卡器`、`门访问系统` 以及其他技术物理访问控制）的 IT 资源\n\n• **外包 (Outsourcing)** 一些组织选择与第三方物理安全公司签约，该公司可能提供从守卫到整个报警、监控和视频监控系统的系列服务。在当今云服务时代，物理安全由云服务提供商提供。如果组织使用\
  \ `CSP` 来托管其基础设施，那么 `CSP` 数据中心的物理安全无疑是一个关注点。当托管组织信息资产和敏感数据的系统托管在 `CSP` 的数据中心时，组织必须确保\
  \ `CSP` 在拥有信息安全控制的同时，具有适当的物理安全控制。物理安全应在 `CSP` 的合同或服务水平协议中规定，并且应该对 `CSP` 的设施和实践进行某些独立或第三方评估，由\
  \ `CSP` 提供作为证明。\n\n## 物理安全控制\n\n物理安全控制可以分为以下几类：\n\n• `威慑控制 (Deterrent controls)`\
  \ 用于通过向潜在入侵者传达信息，让他们重新考虑自己的行为来防止物理侵入。威慑控制包括`围栏`、`安保人员`、`警犬`、`警告标志`、`照明`以及其他让入侵者考虑是否继续的措施。当然，刑事法律及其相关惩罚也是良好的威慑控制。\n\
  \n• `延迟控制 (Delaying controls)` 是大多数人在考虑物理控制时想到的。它们通常以分层实施，在每一步中减慢攻击或入侵的速度（或增加 `work\
  \ factor` 工作因子）。这些控制包括`门`、`墙`、`围栏`和屏障。\n\n• `检测控制 (Detective controls)` 通知组织发生了某些情况。这些控制包括`烟雾探测器`、`火报警器`、`防盗报警器`、`传感器`、`摄像头`和闭路电视\
  \ (`CCTV`)。\n\n## 环境安全与控制\n\n物理安全应作为设施环境设计和建设的一部分来处理。环境设计涉及三个因素：\n\n• **自然访问控制 (Natural\
  \ access control)**：设施外部的设计涉及为人们在建筑周围移动创建路径，引导他们到达组织希望他们去的地方。自然访问控制包括`人行道`、`柱`、`树`、`灌木`、`围栏`和`照明`。\n\
  \n• **自然监控 (Natural surveillance)**：有助于自然访问控制的特征也可以提供自然监控。物理环境特征的使用和放置、人员通道以及照明都有助于观察出入点附近人员的能力。\n\
  \n• **领土强化 (Territorial reinforcement)**：这通过建筑外部的物理设计提供视觉线索，区分私人区域和公共区域。例如，`装货平台`的设计和外观应该告诉人们，如果不是在装卸货物，请远离。同样，`正门`更具欢迎性的的设计和外观应该让人们清楚自己该去哪里。\n\
  \n虽然设施的环境设计利用自然和人为手段控制访问、支持监控并提供领土强化，但`物理设计和建设`提供了第一层加固。加固涉及建筑外部和内部组件的物理构造和材料组成，以提供相应水平的保护。\n\
  \n## 安全区域\n\n在内部，建筑可能被设计为提供`安全区域`。就像网络可以通过访问控制进行分段以支持最小权限原则一样，建筑也可以以类似的方式设计。在这种情况下，建筑被分为不同安全级别的区域，取决于谁需要进入每个区域以及相关的风险。\n\
  \n`门`和`墙`是控制安全区域、房间或建筑或其他分区域之间访问的常用方法。`门`、`墙`、`地板`和`天花板`的构造和材料是根据预测的威胁和受保护资产选择的。\n\
  \n\n\n\n\n只要你知道坏人曾来过，将他们挡在门外可能并不重要。许多建筑使用吊顶，其顶板可以轻松拆卸，从而借此进入天花板上方的区域。墙壁的高度可能仅够够挡住吊顶，这允许有人爬进天花板区域，越过墙壁并进入相邻房间，从而绕过门和锁。但如果使用了`ceiling\
  \ clips`（吊顶卡扣），这可能是可以的。这些卡扣可以确保如果有人拆除吊顶板，吊板就会被毁，在天花板上留下一个洞并在地板上留下碎片。在这种情况下，入侵者无法在无人知情的情况下通过描述的方式进入房间。取决于房间的用途，这种级别的安全防护可能足够了。\n\
  \n## 锁与访问控制\n\n门控制建筑或房间的进入和离开。然而，除非门带有锁，否则门无法提供`authentication`（身份验证）。锁限制了`谁`可以开门，它是身份管理的物理等同物，因为只有特定的人或群体拥有钥匙、密码或其他方法来开门。因此，锁可以用于执行物理设施的最小权限原则。锁已经存在了几个世纪，有许多类型可供选择以提供不同层次的保护和可用性功能。以下是几种：\n\
  \n*   使用物理钥匙或密码的传统锁。\n*   使用电子钥匙（卡钥匙、钥匙扣等）或键盘的智能锁。\n*   生物识别锁，它通过读取人的物理属性来识别个人并根据其身份授予访问权限。生物识别器包括指纹、虹膜、手部和人脸识别系统。\n\
  \n智能锁和生物识别器通常作为`physical access control system`（物理访问控制系统）的一部分使用。此类系统管理谁可以访问某个区域比管理分发物理钥匙或手动更改密码要容易得多。访问控制系统实现以下功能：\n\
  \n*   对谁可以访问哪些建筑、区域和房间进行电子清单\n*   用户账户创建、访问权限编辑，以及在用户不再需要访问或被解雇时注销账户\n*   对谁在何时访问了什么区域进行自动记录\n\
  \n物理访问控制系统还可以提供单因素、双因素或多因素身份验证的物理实现，正如本章的“身份与访问管理”部分所描述的那样。例如，双因素认证可以使用系统实现，该系统要求访客使用卡钥匙（你拥有的东西）并在键盘上输入`PIN`（你知道的东西）作为开门机制。同样，系统可能要求同时通过`PIN`（你知道的东西）和指纹读取器的扫描（你固有的特质）进行身份验证。\n\
  \n### 间道室 (Mantraps)\n\n另一种常用的建筑或房间访问控制机制是`mantrap`（有时称为人笼），这是一个带有两个门的小区域或门厅，其设计为在打开第二扇门之前必须先关闭第一扇门。间道室要求访客通过两扇门并打开两个锁才能进入安全区域，用于需要较高安全等级的情况。数据中心经常使用间道室。\n\
  \n### 围栏\n\n围栏为建筑或建筑群周围区域提供物理屏障和访问控制。\n\n## 照明\n\n照明用于安全防护并提供几个重要功能：它能威慑入侵者、为人员提供安全，并为组织提供信息。照明特征和类型包括：\n\
  \n*   **眩光防护**：光线投向潜在入侵者所在的方向。\n*   **持续照明**：灯阵提供均匀的光线。\n*   **受控照明**：光线不会越过物业边界。\n\
  *   **备用照明**：不同的灯开启和关闭。\n*   **响应式区域照明**：灯在感应后开启。\n\n## 安保人员\n\n安保人员是一种昂贵的工具，但他们具有特殊价值，因为他们可以同时执行所有访问控制功能：\n\
  \n*   **威慑**：安保人员的出现就能威慑入侵者。\n*   **延迟**：安保人员可以在物理上挑战入侵者，并提供入侵者在实施攻击时必须克服的障碍。\n\
  *   **检测**：安保人员有眼睛耳朵，可以利用它们检测入侵并发出报警。\n\n与人类安保人员类似，警保犬也可以执行所有的物理控制功能。\n\n## 探测控制\n\
  \n探测控制通常被部署为监控或报警系统。类似于网络 IDS（入侵检测系统），物理监控系统使用传感器向中心点报告，以向组织提供事件已发生的信息。物理入侵传感器包括检测潜在入侵者的运动检测器和记录可能入侵行为的安全摄像头。其他各种类型的传感器还包括检测门窗是否被打开或损坏的传感器、检测高于环境噪声水平声音的传感器以及检测人体散发热量的传感器。\n\
  \n## 数据中心\n\n数据中心通常持有组织信息资产的“明珠之冠”。此外，数据中心将组织的许多高价值资产集中在一个封闭空间内，这增加了了与单一威胁事件相关的脆弱性。以下是数据中心需要特别考虑的某些方面：\n\
  \n**位置**：数据中心的选址应能够提供针对外部威胁的最最大保护。将数据中心设在建筑的顶层或地下室可能是不明智的。同样，带有外窗的数据中心也可能不是一个好主意。\n\
  \n\n\n\n\n# 分离\n数据中心的电气设施和暖空调（HVAC）系统应与设施的其他部分分开设置。这允许组织根据需要控制和调整数据中心的温度和湿度，并提供备用设施冗余。数据中心的备份电源（使用电池或外部发电机）也可能与设施的其他部分分开设置。\n\
  \n# 环境\n由于计算机设备具有特殊性，数据中心的环境控制是独特的，对于满足设备对电源、温度和湿度的要求至关重要。此外，灭火是数据中心特别关注的问题，需要定制的解决方案。\n\
  \n## 灭火\n火灾发生的原因有很多，包括电气故障、由于疏忽导致可燃材料点燃甚至是纵火。火的发生和燃烧需要四个要素：\n\n* 热量\n* 燃料\n* 氧气\n\
  * 化学反应\n\n移除这四要素中的任何一个，火就会停止。现代灭火系统具有两个功能：探测火灾和释放灭火剂。灭火剂通过实现以下作用发挥作用：\n\n* 降低温度\n\
  * 移除燃料或氧气\n* 破坏化学反应\n\n火探测器通过检测烟雾（烟雾触发）、热（温度触发）或火焰（红外火焰触发）来工作。一旦探测到火灾，系统会向中央控制或直接向火站发送警报，并释放灭火剂（液体或化学剂）来灭火。目前通常有三种灭火系统：\n\
  \n* **湿报警**：湿报警系统是安装在天花板上或上方的简单管道布局，管道内充满水，随时准备释放到下方任何物体上。以这种方式灭火具有很大的破坏性，特别是对电子设备。\n\
  * **预作用**：预作用系统与湿报警系统非常相似，不同之处在于探测到火灾之前管道不含水，探测后管道会迅速充满并释放水。干管被认为比湿式管道更安全，因为意外泄漏的概率较小，且干式管道不容易因凝结产生滴水。\n\
  * **气体**：气体系统释放气体灭火剂来移除氧气和热量。由于这些灭火剂是气态的，不使用水，因此气体系统对电子和办公设备友好得多。大多数现代气体系统使用如 `FM-200`\
  \ 或类似的灭火剂。\n\n对于数据中心而言，气体系统是优的，因为它们的破坏性最小；然而，它们也是三种类型中最贵的。为了降低成本，某些组织为数据中心选择预作用系统。\n\
  \n## 物理安全审计与测量\n可以使用访问日志以及对物理安全措施的持续审查和评估对物理安全进行审计和测量。\n\n* **访问日志**：组织应该审计物理访问日志。这些日志可能从签到表到具有审计功能的软件不等，后者会生成所有尝试访问房间或设施的人员的审计踪迹。无论使用何种类型的访问日志，它们都是重要的侦测控制手段，可用于理解导致未经授权访问或入侵的事件。为了使日志有用，至少必须记录以下内容：\n\
  \    * 访问的日期和时间\n    * 访问该位置的人员身份（如姓名和某种形式的身份号）\n* **物理脆弱性评估**：进行物理脆弱性评估（也称为物理安全审计或审查）是为了识别物理安全控制和策略中的弱环节。评估通常包括对以下保护类别的审查：\n\
  \    * 设施和边界保护\n    * 内部保护\n    * 防止来自人为、自然或技术威胁的保护\n\n![Images](img/note.jpg)\n\
  \n**注意** 物理脆弱性评估将在本章稍后的“脆弱性评估”部分进行更详细的讨论。\n\n##人员安全\n物理安全计划应考虑到人员的安全与保障。正如本章前面所述，人员安全应该是组织的首要任务。人员安全是一个宽泛的话题，包括实施通用安全实践、雇佣程序以及供应商、顾问和承包商的程序。\n\
  \n### 通用安全实践\n人员安全最重要的部分是确保人员安全。以下是为人员提供安全环境而应实施的关键措施：\n\n* **物理安全事件响应**：政策和程序应详细说明组织如何应对人员安全威胁。其一个关键组成是确保员工接受有关这些程序的培训。\n\
  * **演练与培训**：让员工接受如何应对各种物理安全威胁的培训和练习是非常重要的。这包括针对活动枪手、火灾、风暴、流行病等方面的培训和模拟演练。\n* **继任计划**：必须制定继任计划，确保在高管、经理或主管不在或丧失能力时由谁来掌舵。\n\
  * **旅行**：前往世界某些地区的员工或高管可能需要特殊培训或第三方安全服务，如保镖或护送。此外，可能需要特殊的做法；例如，组织可能决定某些高级高管不应乘坐相同的交通工具（如同一航班），以降低在发生事故或灾难时损失多位关键领导人的风险。\n\
  * **操作安全**：也称为 `OPSEC`，操作安全是指攻击者可以通过收集看似无害的信息并将其组合来获取敏感信息。人员应通过限制与谁、何时以及出于什么目的分享信息来实践良好的\
  \ `OPSEC`。由于人们对在社交媒体上发布的内容、在餐厅里对人说的话以及与同事分享的信息不够小心，已经发生过相关的安全事件。\n\n### 雇佣程序\n人员安全的一部分包括管理雇佣过程的生命周期，包括以下内容：\n\
  \n* **雇佣筛选程序**：这些是在招聘过程中遵循的程序，用于确定员工的适用性。这些可能包括\n    * 背景调查\n    * 毒物检测\n    * 安全许可要求\n\
  \    * 信用检查\n* **雇佣协议与政策**：这些是员工签署的如下文件，用于传达预期行为：\n    * 保密协议 (`NDA`)\n    * 行为准则政策\n\
  \    * 伦理协议\n    * 利益冲突政策\n* **雇佣终止程序**：当雇佣关系终止时遵循的程序。这些包括如下程序\n    * 完成离职面谈\n \
  \   * 审查保密协议\n    * 收回证件、钥匙和公司资产\n    * 禁用用户账户\n    * 修改用户访问过的密码、组合或密码\n    * 护送个人离开办公室/设施\n\
  \n### 供应商、顾问和承包商程序\n物理安全还必须考虑到供应商、顾问或承包商访问组织设施时的第三方安全问题。常见的程序包括：\n\n* 在第三方人员在场时对其进行护送\n\
  * 确保有适当的访问控制机制以验证身份\n\n\n\n\n\n- 验证执照或其他形式的身份\n- 要求填写签到表\n- 要求佩戴胸牌\n- 确保相应的协议已到位：\n\
  \    - 保密协议 (NDA)\n    - 服务水平协议 (SLA)\n- 确保对供应商、顾问和承包商进行适当的筛选\n\n### 软件开发安全\n\n\
  许多组织（尤其是中大型企业）构建自己的软件应用程序来执行业务功能。对于那些选择软件开发路线的组织，在开发过程中处理信息安全有时被视为轻率，这可能会导致严重的后果。未能在此软件开发过程中早期且正确地处理安全问题的组织，最终会向企业内部引入漏洞。攻击者向环境引入风险是一回事，而组织通过自身行为引入风险则是另一回事。作为组织的守护者，CISO\
  \ 的工作就是确保这种情况不会发生。将安全构建在其中比后期添加更好。在开发工作期间处理安全比在事后处理更便宜、更简单，而且在大多数情况下更安全。\n\n即使在今天网络犯罪分子活跃、网络攻击泛滥且被广泛报道的环境下，一些工程组织仍未能在此软件开发项目的规划阶段包含安全需求。以下是安全经常在软件开发生命周期（SDLC）中未被处理的几个原因：\n\
  \n- **疏忽**：在某些情况下，未能处理安全仅仅是疏忽。某些人没有关注他们应该关注的事情。疏忽的根源在于规划和界定开发工作的人员缺乏安全意识。\n- **无知**：我们经常看到领导者因为缺乏知识而无法理解安全的重要性，从而忽视安全。这种理解的缺乏会导致组织无法在企业级许多领域处理安全问题，包括业务应用程序的开发期间。\n\
  - **资源**：在开发过程中处理安全会增加时间、精力和成本吗？许多人认为会。毕竟，即使只增加一个需求也会影响构建某个东西所需的精力。因此，添加安全需求确实比忽略安全需求时花费的更多精力。但任何此类精力或成本的节省充其也只是暂时的。忽略安全需求只是推迟了未来处理安全漏洞和缺陷时不可避免的成本。风险的增加将在未来需要额外的成本和精力，无论是由于安全泄露造成的实际损害，还是由于后期必须添加安全功能或修复的成本。\n\
  - **开发者知识**：许多开发者不具备信息安全的基础知识，不知道在开发过程中如何处理它。\n\n事后添加安全通常包括向软件或环境添加 `compensating\
  \ controls`（补偿控制），以弥补没有构建安全的事。补偿控制被正确用于满足被认为实施太困难或成本过昂的安全需求。然而，补偿控制也用于向环境中添加安全，以弥补产品、系统或软件的安全缺陷。例如，如果一个财务人员使用的应用程序没有构建有效的访问控制功能，则可能需要采取其他手段来实现访问控制在这种情况下，补偿控制可能是将系统部署在防火墙后，限制仅允许属于自己的计算机访问。本节的其余部分将探讨以下主题：\n\
  \n- 将安全集成到 SDLC 中\n- SDLC 角色与职责\n- 软件漏洞\n- 安全编码实践\n\n### 自建 vs 购买\n\n组织要么购买商业现成软件（`COTS`），要么开发自己的。构建还是购买的决策对信息安全有影响。如果一个组织考虑购买\
  \ `COTS` 产品，其安全团队应该评估该产品是否满足组织的需求。通过分析或测试（有时是两者兼顾）对 `COTS` 产品进行安全需求合规评估。分析包括对制造商提供的产品数据进行审查，其中可能包括第三方测试的结果。`COTS`\
  \ 软件。同样，由组织或为组织开发的定制软件也必须满足安全需求。创建安全需求应该是产品开发过程中的早期步骤之一。\n\n### 将安全集成到 SDLC 中\n\n\
  软件项目使用多种类型的开发周期（瀑布型、增量型、敏捷等）。无论 SDLC 的类型，安全都必须构建在过程中，以便在每个阶段都得到妥善处理。将安全集成到 SDLC\
  \ 中的目标是确保以下几点：\n\n- 定义软件的安全需求\n- 设计、编码、测试并根据安全需求验证安全功能\n- 遵循安全编码实践，且软件不包含任何安全漏洞\n\
  \n图 4-18 展示了通用但典型的 SDLC 阶段，并显示了如何在每个阶段处理安全。不同的组织可能选择不同的 SDLC 方法，但安全目标是无处不在的：贯穿整个\
  \ SDLC，使安全构建到软件中。\n\n这里讨论了每个阶段：\n\n- **项目规划**：在项目启动或规划阶段，会对项目的初始目标进行范围界定，并考虑安全因素。因素包括与业务相关的法律法规；客户、股东或其他对信息安全或隐私有担忧利益相关者；或源于组织业务环境的因素。项目规划阶段可能还包括风险分析，如“风险管理”章节中所解释的那样。风险分析提供了软件产品对业务价值的初步视图、与企业其他组件的关系、威胁、潜在漏洞，以及它将处理、存储或传输的数据性质和价值。所有这些信息都会记录在案，有时会被记录在安全计划中。\n\
  \n\n\n\n\n**定义需求**：在需求定义阶段，安全需求将与软件的功能、操作、接口或其他需求一同被定义。此阶段可能包括系统的安全分类，例如 `NIST 风险管理框架\
  \ (RMF)` 过程要求的分类。安全需求在数据库、需求列表或软件需求说明书中进行建模和表述，并可能在正式的需求评审期间进行审查。在此阶段还可能开发针对安全需求的测试计划。\n\
  \n- **设计软件**：在设计阶段，安全控制的实现将体现在软件设计中。安全需求被分配到软件架构的适用部分以及编码阶段将编写的特定组件。设计方案可以源自行业最佳实践，例如来自\
  \ `OWASP` 的实践方案。\n\n- **编码软件**：编码阶段是构建和测试软件组件以实现安全需求的阶段。开发人员应遵循内部标准定义或由 `OWASP`\
  \ 等行业实体发布的安全编码规范。\n\n- **测试软件**：为了确保满足安全需求，软件将使用静态和动态技术进行彻底测试。动态测试应包括详尽的漏洞测试以及渗透测试，以手动探测潜在的攻击向量。\n\
  \n### 安全 SDLC 角色与职责\n\n为了开发安全软件，开发团队应包含具有特定安全相关角色的成员。这些角色可以由项目中担任其他角色的团队成员承担，也可以由专门的安全人员承担。角色的分配通常由项目的规模和复杂性决定。以下是软件开发项目中可能存在的关键安全角色（名称可能根据组织而异，但活动应始终执行）：\n\
  \n- **信息安全经理或官员**：该角色通过发布安全准则（包括策略、标准和指南）确保安全问题得到解决，并确保它们被正确应用于软件开发项目。\n\n- **信息安全工程师/领域专家**：安全工程师和领域专家与开发人员合作，设计并编写满足安全需求的解决方案。安全工程师还参与对软件的评估和测试，以验证其是否符合需求，并确保环境中没有引入漏洞。\n\
  \n如前所述，信息安全角色可以根据管理层和项目需求与项目中的角色结合。这些角色之间也可以相互结合。\n\n## 软件漏洞\n\n本章开头的“恶意软件与攻击”部分描述了利用软件漏洞的脚本和特定漏洞攻击。许多此类攻击利用了由于系统设计或编码错误导致的漏洞。以下章节简要概述了来自\
  \ `OWASP 前十` 应用程序漏洞列表 (`https://owasp.org/www-project-top-ten/`) 的一些最常见的软件漏洞。\n\n\
  #### 注入\n\n注入是一种软件漏洞，允许攻击者向解释器发送不可信的数据。这些数据可以经过构造，导致解释器在未经授权的情况下执行非预期的命令。根据所利用的后端系统不同，有多种注入漏洞，包括\
  \ `SQL`、`NoSQL`、`OS 命令`、`LDAP` 等。开发人员可以通过应用以下实践来防止注入漏洞：\n\n- 使用安全的 API 代替解释器\n-\
  \ 通过仅允许某些字符串或字符来过滤输入字段\n- 在指向后端系统的命令中包含控制措施，将可用功能限制在允许范围内（例如 `SQL LIMIT` 控制）\n\n\
  #### 身份验证失效\n\n身份验证失效是一系列与身份管理、认证和会话管理实现不当相关的问题。攻击者利用这些弱点破解密码、密钥和令牌，并利用其他漏洞冒充用户身份。如果应用程序包含任何以下弱点，则容易受到攻击：\n\
  \n- 允许自动化身份验证攻击，允许攻击者使用许多用户名和密码尝试登录\n- 允许使用简单或易猜的密码\n- 使用弱的密码恢复功能\n- 未以安全方式存储或传输密码\n\
  - 身份验证实现不当，包括多因素认证\n- 暴露、不轮换或失效会话 ID\n\n开发人员可以通过应用以下实践来防止身份验证失效：\n\n- 尽可能实现多因素身份认证\n\
  - 限制失败登录次数\n- 实现弱密码检查\n- 使用安全的会话管理技术，如安全的随机会话 ID\n- 遵循 `NIST 800-63B` 关于记忆密码的指南\n\
  - 避免使用攻击者可以获得的默认凭据\n\n#### 敏感数据泄露\n\n敏感数据泄露是一系列未能妥保护敏感数据相关的问题。即使应用程序使用了加密，敏感数据在加密之前或解密之后仍可能受到攻击。敏感数据可以是任何被组织认为敏感的数据，但最常见的是个人信息，如医疗数据、信用卡数据、凭据和专有信息。如果应用程序包含任何以下弱点，则容易受到攻击：\n\
  \n- 敏感数据未经过正确识别和分类，无法应用相应的保护级别\n- 以明文传输敏感数据\n- 使用弱或过时的加密算法或方法\n- 密码法密钥管理不当，例如使用弱密钥、重新生成密钥或不轮换密钥\n\
  - 未强制执行加密\n- 未验证证书\n\n开发人员可以通过应用以下实践来防止敏感数据泄露：\n\n- 正确对数据进行分类，并根据组织安全策略定义的分类应用控制措施\n\
  - 仅在需要时存储敏感数据，且仅持续所需的时间；不要保留或缓存敏感数据\n- 使用强哈希函数存储密码\n- 对静态数据进行加密\n- 使用当前且最新的加密算法和协议\n\
  - 使用最新的安全协议在传输过程中保护敏感数据\n\n#### XML 外部实体\n\nXML 文档可以包含访问本地或远程内容的 `external entities`（存储单元）。每个实体使用通用资源标识符\
  \ (`URI`) 来引用内容源。XML 解析器（或解析程序）读取 `URI` 并用预定的数据替换引用。然而，并非所有的 XML 解析器都能正确处理，并可能被修改或破坏以处理外部实体，将非预期的数据作为内容。攻击者可以通过使用\
  \ XML 文件检索敏感数据。如果应用程序和基于 XML 的服务包含以下弱点，则容易受到攻击：\n\n- 接受来自不可信源的 XML 数据\n- 将不可信的数据插入\
  \ XML 文档\n- 使用启用了文档类型定义 (`DTDs`) 的 XML 解析器\n- 使用 `SAML` 进行身份处理\n- 使用早于版本 1.2 的简单对象访问协议\
  \ (`SOAP`)\n\n\n\n\n开发者可以通过以下实践防止由于 XML 外部实体导致的漏洞：\n\n- 使用 `SOAP 1.2` 或更高版本\n- 在所有\
  \ `XML parsers` 上禁用 `DTD` 和 `XML external entity` 处理\n- 确保 `XML parsers` 已更新至最新版本的补丁程序\n\
  - 使用 `XML validation`\n\n## 失效的访问控制\n\n应用程序应当强制执行已验证用户允许执行的操作，但许多应用程序并未这样做。这可能导致攻击者能够访问用户账户、访问敏感数据或执行未经授权的功能。如果应用程序包含任何以下缺陷，它们将是易脆弱的：\n\
  \n- 绕过其他软件的访问控制检查\n- 允许权限提升\n- 允许跨账户访问\n- 允许操作元数据，例如修改令牌、cookie 或隐藏字段\n- 允许跨源资源共享\
  \ (`CORS`)，这允许从另一个域使用受限的 Web 资源\n\n开发者可以通过以下实践避免访问控制失效：\n\n- 默认拒绝访问\n- 根据组织策略执行访问控制\n\
  - 避免使用 `CORS`\n- 禁用 Web 服务器目录列表\n\n## 安全配置错误\n\n配置不当的软件和操作系统无疑是最常见的漏洞。由于使用了默认设置、错误的安全设置、不必要的功能，甚至是过时或未打补丁，操作系统和软件往往配置错误。如果应用程序包含任何以下缺陷，它们将是易脆弱的：\n\
  \n- 过时或未打补丁的软件\n- 启用了默认账户\n- 启用了不必要的功能\n- 未启用安全功能\n- 安全设置或值设置错误\n- 过于详细的错误信息（暴露比需要更多的信息）\n\
  \n可以通过以下实践防止由于配置错误导致的漏洞：\n\n- 保持所有软件更新至最新版本和安全补丁\n- 根据配置指南加固所有软件，例如美国国防部国防信息系统局\
  \ (`DISA`) 安全技术实施指南 (`STIGs`) 或互联网安全中心 (`CIS`) 基准测试\n- 仅启用绝对必要的特征和设置\n- 审阅并应用产品开发者建议的安全设置\n\
  \n## 跨站脚本\n\n跨站脚本 (`XSS`) 是一种允许攻击者在 Web 页面中嵌入不可信数据的漏洞。这些数据包含由受害者浏览器执行的脚本，可能会危及系统和数据。受害者通过社会工程技术被诱导或重定向到受感染或恶意的\
  \ Web 页面。如果应用程序包含任何以下缺陷，它们将是易脆弱的：\n\n- 缺乏对网站输入数据的过滤（例如允许在博客或社交媒体网站上发布任何内容而不检查其是否有恶意代码）\n\
  - 动态包含攻击者控制数据的应用程序或 `APIs`\n\n开发者可以通过以下实践防止 `XSS`：\n\n- 使用专门为防止 `XSS` 设计的框架（如 `Ruby\
  \ on Rails` 或 `React JS`）\n- 教育用户不要选择不可信 Web 页面的链接\n- 禁止不可信的 HTTP 请求\n- 对浏览器 API\
  \ 应用内容敏感的过滤\n\n## 不安全的反序列化\n\n序列化是将对象转换为字节数据的过程；反序列化则是相反的过程。如果攻击者向漏洞应用程序的 Web 页面字段输入特殊构造的数据，当对象被反序列化时，可能会导致各种漏洞，包括远程代码执行、`SQL\
  \ injection`或其他恶意未经授权的功能。如果应用程序接受来自不可信源的序列化对象，它们就是脆弱的。\n\n可以通过以下实践防止不安全的反序列化漏洞：\n\
  \n- 不要接受来自不可信源的序列化对象\n- 对序列化对象进行完整性检查\n- 在独立的隔离系统上运行反序列化函数\n- 限制反序列化系统的网络流量\n- 监控反序列化操作\n\
  \n## 使用已知漏洞的组件\n\n应用程序使用的组件库可能包含漏洞，就像部署到环境中的任何软件一样，在使用之前应对其进行验证或清理。如果应用程序包含任何以下缺陷，它们将是易脆弱的：\n\
  \n- 来源未知的组件\n- 组件版本未知\n- 过时或不支持的组件\n- 未经测试的组件\n\n可以通过以下实践防止暴露：\n\n- 实施持续计划，对所有组件库进行清点、升级和修补\n\
  - 仅使用来自可信源的组件库\n- 从可信网站通过安全链接获取组件\n\n## 日志记录和监控不足\n\n如果没有足够的日志记录，事件可能无法被发现，并且难以调查和解决。这可能会通过延迟或增加响应及修复措施的复杂使情况恶化。如果应用程序包含任何以下缺陷，它们将是易脆弱的：\n\
  \n- 对错误和警告消息没有日志记录\n- 对审计所需的事件（如登录失败）没有日志记录\n- 数据记录的格式不支持调查和理解\n- 审计日志仅存储在本地\n-\
  \ 日志阈值设置得太低或太高\n- 事件检测阈值定义不明或与日志记录不一致\n\n可以通过以下实践防止日志记录的缺陷：\n\n- 根据组织对风险的接受程度和目标调整日志阈值\n\
  - 确保数据以可用的格式记录日志\n- 记录高价值交易\n- 实现定义良好且熟练的事件响应能力\n\n## 安全编码实践\n\n每个开发软件的组织都应该有一项计划，将信息安全集成到其软件开发生命周期\
  \ (SDLC) 中。该计划无论是正式还是非正式的，都应该包含安全编码实践，即开发不包含安全漏洞软件的特定方法。`OWASP` 为开发者发布了指南，作者们发现\
  \ `OWASP` 是该主题最广泛使用的行业指南。`OWASP` 为开发者提供了以下类别的待遵循的安全编码指南：\n\n- 输入验证\n- 输出编码\n- 身份验证和密码管理\n\
  - 会话管理\n- 访问控制\n- 加密实践\n- 错误处理和日志记录\n- 数据保护\n- 系统配置\n- 数据库安全\n- 文件管理\n- 内存管理\n-\
  \ 通用编码实践\n\n许多组织遵循 `OWASP` 指南，或根据自身的环境和经验通过对编码实践的自我适配或特定实现进行增强。安全编码实践应当被记录，以便组织拥有一种可以随时间推移进行应用、衡量和改进的一致方法。安全编码实践最好作为包含内容的整体计划的一部分实施：\n\
  \n- 如前，将安全编码集成到 SDLC 中。\n- 将安全集成到供应链中，确保从 `COTS` 供应商或第三方开发者处购买软件产品不包含安全漏洞。\n- 建立编码和开发标准以及可重复代码库。\n\
  - 持续培训开发者\n\n\n\n培训可能是安全软件开发中最重要但最被忽视的方面。令人惊讶的是，许多计算机科学课程并不教授安全编码，尽管一些学校现在已经提供安全软件开发的专业学位。因此，聘用开发者的公司和组织有责任为其软件开发人员队伍提供至关重要的培训。组织通常会聘请顾问或使用第三方培训机构来满足这一需求。取决于讲师和课程的质量，这种方法可能非常有效。\n\
  \n## 软件漏洞分析与评估\n\n所有开发的软件都应该经过测试和评估，以确保其符合安全要求且没有漏洞。为了实现这一点，组织通常结合使用自动化和手动技术。自动化工具用于检查源代码中的编程错误，或对部署在测试或生产执行环境中的程序进行自动漏洞扫描。手动测试包括对软件架构的审查、源代码的人工检查以及对运行系统的手动渗透测试，如下文所示：\n\
  \n- **安全架构评估**：安全架构评估的目标是确定并评估应用程序的关键性安全设计特征。实现这一目标的方法是将应用程序分解为多个组件，并对每个组件的机密性、完整性和可用性进行评估。另一种模型是评估每个组件控制参与者（用户或系统）与资产（数据）之间访问的能力。无论使用哪种模型，架构评估都应包含评审标准的定义、证据收集、根据标准对证据进行评估以及结果报告。\n\
  \n- **源代码审查（静态分析）**：源代码的静态分析可以识别可能导致安全漏洞的缺陷和弱点。此类工具包括用于检查未编译代码的源代码分析器、追踪组件和库来源的软件成分分析工具，以及如移动应用程序分析器等专用工具。（另请参阅本章节后面“漏洞评估”部分中的\
  \ `SAST`。）\n\n- **漏洞测试（动态分析）**：动态分析是由工具对已编译并部署的应用程序（无论是在测试环境还是实时生产环境中）执行的。这些工具会测试接口、事务、会话管理、访问控制和其他功能是否存在安全缺陷。（另请参阅本章节后面“漏洞评估”部分中的\
  \ `DAST`。）\n\n- **渗透测试**：手动应用程序渗透测试通常从源代码审查和漏洞扫描的结果开始。评估团队利用这些产物并了解系统，对实现进行针对性测试，以发现并识别弱点，并从攻击者的角度演示这些弱点如何被利用。\n\
  \n应用程序安全测试的哲学是寻找不应该存在的功能。测试用于发现可能并非刻意设计且可能意料之外的行为。测试还用于寻找后门或绕过设计的访问控制的方法。测试应该在正式部署之前的测试环境中进行一次，并在软件部署到生产环境后再次进行。安全测试结果的报告通常使用某种排名系统，作为理解发现的每个\
  \ `finding`、漏洞或缺陷的相对风险的影响的影响。例如，评估团队可能会根据`业务影响`和`发生概率`对每个发现项进行评分（高、中、低）。然后将这些信息呈现在图中，以提供应用程序风险概况的可视化表示。\n\
  \n软件安全测试可以非常全面且昂贵，也可以快速且廉价，或者介于两者之间。测试越广泛，产生意义结果的可能性就越大。这种规模关系在图 4-19 中所示。\n\n![Images](img/F04-19.jpg)\n\
  \n**图 4-19** 软件安全测试规模化\n\n组织必须根据其需求选择合适的应用程序测试范围。通常，测试范围基于风险。例如，包含机密数据的军事系统投入高昂成本进行广泛测试是合理的，而没有敏感数据的系统则以较低成本进行较不广泛的审查。\n\
  \n## 取证、事件处理与调查\n\n坏事会发生，当它们发生时，组织必须具备相应的流程和技术来理解发生了什么并做出适当响应。本节讨论了组织如何检测安全事件、进行调查、响应和恢复。它还涵盖了与安全漏洞相关的法律以及\
  \ CISO 应该理解的取证概念。本节涵盖以下主题：\n\n- 相关法律\n- 日志与监控\n- 事件响应与调查\n- 取证与数字证据\n\n检测和响应事件的重要概念是`准备`。决定对事件采取什么措施的时机不是在事件发生时。在战斗激烈时，能够依靠经过长期精心开发、练习和不断完善的既定流程和程序是有价值的。当\
  \ `CISO` 和安全团队准备就充分以响应安全事件时，这些事件对业务的影响可以降到最低。\n\n## 相关法律\n\n尽管 `CCISO` 是一项国际认证，但关于相关安全法律的讨论不可承认具有明显的美国背景。\n\
  \n![Images](img/exam.jpg)\n\n**考试贴士** `CCISO` 考试可能不包含特定法律的问题，但 `CISOs` 应该充分了解其运营所在管辖区适用的法律。\n\
  \n在理解与计算机犯罪相关的法律时，应当理解并消除以下常见误区：\n\n- `编写计算机病毒是言论自由并受法律保护。` 并非如此：编写病毒并不违法，但在大多数国家，传播病毒是违法的。\n\
  - `信息应该对所有人可用；因此获取信息不是违法的。` 错误：信息属于其所有者，通常是创建它的个人或实体。没有人有权偷取或修改他人的信息。\n- `如果网络犯罪没有从其黑客活动中获利，它就违法的。`\
  \ 错误：如《美国计算机欺诈和滥用法》等法律并不要求犯罪者从非法行为中获利。\n- `系统应该受到保护，如果它们没有被锁好，那是受害者的错，而不是黑客的错。`\
  \ 错误：如果你忘记锁前门，犯罪分子闯入你家偷走电视仍然是违法的。这一原则同样适用于网络犯罪。\n\n虽然计算机犯罪法律的细节差异巨大，但可以确定，大多数计算机犯罪法都包含保护公众免受以下行为的规定：\n\
  \n- 未经授权的访问\n- 插入恶意代码\n- 未经授权的数据修改或破坏\n- 未经授权的信息泄露\n\n\n\n\n\n计算机犯罪可能难以对，原因有几点。首要原因是，确定负责攻击的网络犯罪分子的身份可能非常困难。调查能力在不断提高，但网络犯罪分子规避检测的方法也在进步。其次，网络犯罪会留下电子证据，但通常没有留下物理证据。电子证据可能难以发现和解释，这增加了犯罪的隐蔽性，并增加了寻找罪疑犯的难度。\n\
  \n与网络犯罪相关的法律可以分为以下几类：\n\n- **完整性法案（Integrity laws）**：现有的法律旨在保护公众使用的信息的完整性。例如，`美国\
  \ Sarbanes-Oxley 法案`（又称为《2002 年美国与公众公司会计改革和投资者保护法案》）是在几起涉及上市公司欺诈行为的商业丑闻发生后创建的。该法律包含了有助于确保公司财务信息准确性以及相关安全实践的规定。\n\
  \n- **隐私法（Privacy laws）**：隐私法旨在保护个人信息免受未经授权的披露。在美国，这些法律包括`健康保险流动性与责任法案（HIPAA）`，它包含了保护未经授权披露个人受保护健康信息（PHI）的规定，以及保护个人财务信息的`格拉姆-莱奇-布莱尔法案（GLBA）`。同样，欧盟的`通用数据保护条例（GDPR）`也包含了保护个人个人信息的规定。\n\
  \n- **反欺诈与滥用（Fraud and abuse）**：在美国，包括`计算机欺诈与滥用法（CFAA）`、`身份盗窃执法与赔偿法案`以及州法律在内定义了故意未经授权访问计算机的非法行为及相关惩罚，包括此类导致损害或损失的行为。\n\
  \n其他与计算机安全和取证相关的法律还有网络欺凌法（这些法律因地区而异）、儿童色情和性信息法（美国联邦和州法律，例如处理《美国法典第 18 卷第 2256 条》，涉及禁止内容的存储或传播），以及专门保护政府免受黑客攻击、间谍活动、网络恐怖主义和网络战争的各种法律。\n\
  \n## 日志与监控\n\n信息安全硬币的两面：防御攻击和事后恢复。本节大部分涵盖了恢复，恢复的第一步是检测。首席信息安全官（CISO）检测安全事件发生的最基础工具是日志记录和监控，它们将在后续章节中详细阐述。\n\
  \n### 调整日志记录与监控\n\n日志记录（事件的记录）和监控（事件的检查）捕获并报告大量数据。人们可以字面上地记录整个企业中发生的每一个事件，并投入大量资源（自动和人工）对其进行监控。但在存储、处理和解释所有这些数据方面是要付出代价的。每个安全部门在合理记录和监控信息量方面都有实际的局限性。诀窍（正如本章之前“IDS/IPS”部分中讨论的那样）在于调整以记录和监控正确的数据。合适的数据量是多少？答案是根据风险和组织的能力来调整日志记录和监控。在进行全面的风险分析后，CISO\
  \ 将了解最的系统、威胁以及资产对业务的价值，使 CISO 能够确定哪些信息是需要收集和处理的，以及在监控环境方面可以合理投入多少资金。\n\n#### 日志记录（Logging）\n\
  \n日志记录是为了后续分析进行的活动捕获和存储。日志用于支持审计、故障排除、系统的功能/运行分析，当然安全分析。日志可以捕获整个企业发生的事件，包括以下类型：\n\
  \n- **系统和事件日志**：服务器、工作站、数据库甚至某些网络设备具有配置和执行日志记录的能力，以捕获事件并存储它们以便以后的检索和分析。\n\n- **操作系统、应用程序、IDS/IPS\
  \ 和防火墙日志**：这些日志对于识别异常或帮助重建过去的安全事件非常有用。异常包括配置设置或重要文件的更改，这些可能是恶意活动的迹象。\n\n为了支持安全调查而通常捕获的事件包括：\n\
  \n- 输入/输出失败\n- 身份验证/授权事件\n- 操作系统和应用程序错误\n- 系统启动和关机事件\n- 安全指标，如添加/删除用户、更改权限以及添加/删除令牌\n\
  - 管理员或特权用户执行的操作\n\n通常捕获的事件信息包括：\n\n- 事件发生的时间\n- 事件发生地点（系统、应用程序、服务、地理位置、组件、网页）\n\
  - 谁执行了该操作（用户名、IP 地址）\n- 发生了什么（类型、严重性、优先级、描述）\n\n`日志管理`指的是为了维护日志而采取的所有活动，以便使其对组织有用。日志不仅对组织具有极高的价值，而且非常敏感，应该受到保护免受修改/删除，并且仅供授权用户访问。在存储容量规划期间必须考虑日志，以确保日志不会填满可用存储并导致空间不足，无法记录重要数据。\n\
  \n#### 监控（Monitoring）\n\n一旦事件作为日志过程的一部分被捕获，就可以对其进行检查以检测安全相关事件（如泄露），并支持对这些事件的调查。大多数组织采用某种安全信息和事件管理（SIEM）系统，将各种来源的事件日志聚合并关联到中央存储库中。SIEM\
  \ 系统促进了事件分析并提供了企业的全局视图。SIEM 功能包括：\n\n- **日志聚合**：监控解决方案从各种来源收集事件数据，包括系统和服务器、网络设备、数据库和应用程序。\n\
  - **安全存储**：SIEM 中央存储库必须位于安全位置，例如妥善保护的数据库，因为记录的信息是敏感的。事实上，SIEM 数据库通常比日志的源更安全。\n-\
  \ **关联与分析**：在比较 SIEM 解决方案时，最大的价值和可能的区分因素是它在多大程度上帮助安全人员从事件数据得出结论。SIEM 软件分析数据以建立趋势并建立关系，以便检测异常活动。更好的\
  \ SIEM 会持续构建趋势数据，提供随时间推移而改进的能力。\n- **警报**：SIEM 具有过滤噪音的能力，并在发生需要操作员注意的情况发送或显示警报。大多数\
  \ SIEM 允许组织调整阈值，为组织最关键的事件提供警报。\n- **合规性**：供应商宣传的 SIEM 卖点是它可以帮助组织确定并报告对监管驱动的合规情况。通常此功能通过模板或插件启用，以帮助构建针对组织重要法规的报告。\n\
  \n![Images](img/exam.jpg)\n\n**考试技巧** CCISO 候选人应该熟悉 SIEM 系统的目的和功能，以及 IDS 和 IPS。\n\
  \n## 事件响应与调查\n\n\n\n\n安全事件处理始于潜在安全事件的指标，结束于解决和关闭。在此过程中有许多步骤，每一步都必须经过良好规划，在政策指导下，并按照精心设计且经过演练的程序执行。与安全的所有方面一样，组织规划、演练和记录事件处理程序的程度取决于其业务性质及其对风险的容忍度。\n\
  \n## 涉及执法部门\n\n在调查过程中，组织可能会识别出嫌疑人员。这些人员可能是外部个人或组织的内部员工。无论哪种情况，如果怀疑可能发生了犯罪，都应该联系执法部门。然而，何时以及如何联系执法部门的决定不应轻率，因为这可能对组织产生影响。应该建立相关程序，就何时应联系执法机构提供指导（报告阈值）、谁应该参与决策，以及应由谁以及何种进行此类联系。\n\
  \n组织在制定事件处理程序时应引入法律顾问，特别是那些处理涉嫌犯罪活动以及与执法部门交互的程序。\n\n在联系执法部门后，组织会将调查的控制权移交给执法部门。因此，执法部门可能会控制或占有组织的资产以进行调查。这可能会导致组织业务运营的中断，而这正是有时被忽视的、建立良好的`BCP/DR`流程的原因之一，以便组织能够使用备份或替代系统及数据恢复业务运营。\n\
  \n根据法律规定，某些信息必须立即向执法机构报告，例如在公司计算机上发现了某些类违禁品。然而，某些事件由组织自行决定是否进行报告，例如员工违反访问控制策略的行为，这些行为在技术上可能违反法律，但如果没有非法访问敏感数据（如\
  \ `HIPAA PHI`），通常不会被报告。\n\n## 员工违反策略\n\n安全策略与人力资源策略没有何区别，相同之处在于员工必须对合规性负责。组织的义务是确保策略得到一致的执行。如果组织不一致地执行策略，就会将面临员工对其提起诉讼的风险。良好安全策略执行的规则包括：\n\
  \n- 发布策略并确保所有员工都知晓策略。\n- 定义并记录报告安全违规、调查违规以及执行执行的程序。执行可能包括包括解雇员工在内的纪律处分。\n- 为经理和主管提供培训，不仅针对策略本身，还针对报告和执行。\n\
  - 在新员工入职培训和定期的回顾简报中包含安全策略覆盖。\n\n每个组织都应该建立一种机制，让员工报告疑似违反安全策略的行为。应该让员工感到安全，担心因报告所见情况会导致任何报复。某些组织通过提供匿名报告选项、举报人计划或指定的调解（作为报告违规的人员与组织之间的代理）来实现这一点。\n\
  \n## 事件处理流程\n\n如第 1 章介绍所示，事件处理通常使用与图 4-20 所示相似的流程来实现。\n\n![Images](img/F04-20.jpg)\n\
  \n**图 4-20** 事件处理的六步骤\n\n该图显示了处理事件的当前行业实践。尽管具体的名称和步骤数量因组织而异（`NIST`定义了一个四步流程），但其核心概念是通用的：提前为事件做好准备、调查并解决事件、将组织恢复到正常运行，然后从发生的事情中学习可以汲取的经验，以便在未来能够更好地防止或处理此类事件。图中的每一步都将在后续章节中进行讨论。\n\
  \n### 准备 (Prepare)\n准备阶段涉及解决良好事件处理计划的以下先决条件：\n\n- 对事件处理活动进行监督，以确保组织内的每个业务单元或小组都执行适当的事件处理程序。\n\
  - 制定、发布并维护事件处理计划，并附带政策、指南和程序，涵盖整个组织和企业。\n- 为经理和主管提供培训，不仅针对策略本身，还针对报告和执行。\n- 定义所有参与事件处理的人员的角色和职责，并确保与事件处理计划、政策和程序一致。\n\
  - 获取并部署支持事件处理活动的工具。\n- 准备处理特定类型事件的特定程序。\n\n### 识别 (Identify)\n一旦发生事件，安全团队必须识别发生了什么。这从团队成员看到事件证据开始。他们可能会看到来自\
  \ `IDS` 或 `SIEM` 的告警、日志文件中的异常活动、异常的网络活动、员工的报告等。在某些点，证据（或证据的积累）显示可能发生了安全事件（正在发生），是时候开始控制了。\n\
  \n### 控制 (Contain)\n一旦识别出事件，团队必须对其进行控制，以便在进一步评估的同时防止其扩散或造成额外损害。控制策略应预先定义，以便理想情况下可以为特定类型的事件调用特定策略。控制策略可能包括：\n\
  \n- **边界控制**：防止扩散到网络边界之外的行动，例如阻止入/出流量、更新边界防火墙策略以及切换到替代通信链路。\n- **内部控制**：防止扩散到网络部分的行动，例如隔离网段或\
  \ `VLAN`，更新路由器、防火墙和交换机设置以阻止特定的 IP 地址或端口。\n- **终端控制**：防止扩散到设备、服务器、工作站或笔记本电脑的行动，例如断开终端的网络访问。\n\
  \n### 消除 (Eradicate)\n这一步也可以称为“修复”。安全团队从受影响系统中移除问题的恶意软件、程序、设置或账户。理想情况下，团队会尽量减少数据损失，但这并不总是可能的。消除通常与恢复阶段结合，例如重装磁盘，这会一步到位清除坏内容并替换为良好内容。\n\
  \n### 恢复 (Recover)\n恢复涉及将系统恢复到运行状态。恢复可能包括重装磁盘、安装新的操作系统和应用程序、更新 `STIGs` 或加固设置并安装补丁。恢复将系统带入全新的且功能完备的运行状态。\n\
  \n\n\n\n\n# 教训总结\n\n一旦一切恢复正常，安全团队就可以对发生过的一切进行审查。首先，他们会记录事件过程、操作和处理活动，以记录发生了什么、由谁执行以及何时发生。安全团队捕获并存储日志、警报、电子邮件以及所有相关数据，并为管理层制定并发布事件报告。管理层将审查报告，并识别出可以根据事件结果导致架构、策略、系统和程序变更，或任何为提高组织安全态势所需的措施。\n\
  \n## 事件响应团队\n\n事件处理流程由由经理和分析师组成的团队执行，他们与组织内部或外部的利益相关者进行互动和协调。根据组织规模，事件响应团队可能很大，由专门负责流程某些特定方面或在独特技术具有专长的人员组成。至少，大多数事件响应团队至少包含三个角色：\n\
  \n*   **经理或负责人**：协调团队活动，并管理与组织其余部分的通信。\n*   **一级分析师**：监控监控设备的日志和警报，执行分级处理，并作为第一级调查和响应。\n\
  *   **二级分析师**：负责第二级调查，可能涉及法医活动。\n\n这个核心团队可能会得到内部或外部专家的支持，领域包括事件调查、执法和恢复，或者如通信、服务器技术或专用应用程序等技术领域。\n\
  \n事件响应团队通常与组织内部的人员或小组进行正式互动，以建立监控和事件处理策略、流程和程序。这种互动可能是集成事件响应委员会的一部分。团队互动的角色可能包括：组织的首席财务官或财务团队、总法律或法律团队、高层管理人员和部门主管、人力资源以及首席信息官或信息技术小组。\n\
  \n对于某些事件，额外的个人或其部门可能会参与实际的事件响应活动。例如，法律顾问或法律部门无疑会参与有关联系执法机构的决定。同样，如果事件调查表明员工行为不当或违反政策，则会联系人力资源小组。\n\
  \n## 取证与数字证据\n\n在调查安全事件的过程中，保持`证据的采纳性（admissibility of evidence）`至关重要。证据的采纳性由法官在作为刑事或民事审判的一部分提交法庭时决定。为了具有采纳性，证据必须具有相关性和可靠性，定义如下：\n\
  \n*   **相关性**：要具有相关性，证据必须与发生的情况具有合理的关系。Joe 的浏览历史可能与在其硬盘上发现非其拥有的版权材料这一事实相关。法官对相关性做出裁定，但事件响应或调查团队在调查期间应假设所有内容都可能具有相关性。\n\
  *   **可靠性**：证据必须是准确的。必须证明证据的获取和处理方式确保其没有被（或无法被）篡改，从而能够合理保证其可靠性。\n\n事件响应或调查团队最感兴趣的可能是证据必须在法律上是被允许的，这意味着它是合法获取的，并且遵循了监管链（chain\
  \ of custody）。`监管链（Chain of custody）`是一种纸记录，证明了证据在整个生命周期内是如何被获取、存储和处理的。`适当的监管链`是一项应该遵循的实践，用以确保监管链记录显示证据已处理得当，从而使其`可靠且具有采纳性`。例如，如果笔记本电脑的内容被认为与调查相关，则应该维护记录，说明从调查人员获取笔记本电脑到将其提交给法庭，笔记本电脑是如何存储、运输和保存的。其意图是证明证据自首次获取以来未被篡改。\n\
  \n### 处理数字证据\n\n适当的监管链要求事件响应或调查团队遵循书面程序来处理和存储证据。这包括捕获证据、标记证据、包装、存储和运输证据的程序，以及在分析过程中保持其完整性。\n\
  \n在数字证据方面，监管链面临着若干挑战。数字证据必须通过电子手段读取，而启动系统和读取数据的正常过程可能会更改证据。因此，数字证据必须按照特定标准进行复制，以在保持原始数据完整性的同时确保副本的质量和可靠性。然后应对原始数据进行包装、密封并贴上跟踪信息，并将其存储在数据库中。该数据库用于记录证据所在地，并在证据在整个生命周期内每次运输时进行更新。数据库本身应通过访问控制受到适当保护，以确保只有经过授权的人员才能访问它。\n\
  \n### 数字证据分析\n\n并非所有组织都有财务资源对数字证据进行自行分析。那些组织可能拥有一个法医实验室，他们可以在那里维护监管链、从原始源复制介质，并在副本上进行法医分析。许多组织选择不在公司内部进行取证，而是使用专事数字取证调查的外部公司。无论是内部还是外包，法医实验室都应该具备以下基本能力：\n\
  \n*   用于安全存储、包装、标记和运输作为调查对象的设备和介质的物理设施。\n*   复制能力，能够安全可靠地制作介质的精确数字副本。实验室应该能够检查和访问来自服务器、工作站、笔记本电脑、手机、平板电脑、打印机和网络设备的数字介质。\n\
  *   分析工具，能够检查包含调查设备副本的介质。由于数据在磁盘上的存储方式，必须从磁盘或介质的不同部分重建数据。\n\n```\n![Images](img/note.jpg)\n\
  ```\n\n**注意** 数字证据可能是`持久的（persistent）`，这意味着它存储在介质上，以至于在系统启动或重启后仍然可用。或者数字证据可能是`易失的（volatile）`，这意味着数据只在系统运行时存在。持久性数据在位于磁盘上时仍可能被修改或覆盖，因此法医团队必须非常小心以确保数据被保护。易失性数据必须使用现场取证方法收集。易失性数据的恢复从最易失的证据（如\
  \ CPU、缓存和寄存器内容）开始，并遵循`易失顺序（order of volatility）`进行。\n\n数字证据分析旨在揭示安全违露背后的故事。检查团队会收到一份列表，说明发生了什么类型的事件以及他们在调查期间寻找什么类型的信息。法医检查团队通常遵循以下流程：\n\
  \n\n\n\n\n1. 建立一个`Search Lead（搜索线索）列表，即团队在数据中寻找的项目列表。例如，如果正在调查的事件是员工可能下载了盗版音乐或电影文件，团队会将此类文件添加到\
  \ `Search Lead` 列表中。\n\n2. 在调查过程中，随着对媒体内容了解的不断深入，团队可能会向 `Search Lead` 列表中添加新条目。\n\
  \n3. 如果在调查过程中团队发现了定罪数据，团队可能会立即停止并将发现的结果报告给管理层，由其报告给执法部门。\n\n4. 当团队从 `Search Lead`\
  \ 列表中找到所需内容或有其他重大发现时，团队会将该项目添加到另一个名为`Relevant Data（相关数据）的列表中，对其进行记录并提取。\n\n5. 团队分析相关数据以拼凑出活动线索，尽可能展示发生了什么、是谁干干的、是如何发生的、何时发生的，以及与该活动相关的其他数据或事件。这被记录在`Analysis\
  \ Results（分析结果）列表中。\n\n所有这些列表和事件都记录在一份`Analysis Results Report（分析结果报告）中，该报告描述了调查结果并提供给管理层。\n\
  \n## 反取证技术\n\n网络犯罪分子了解调查人员用于发现数字证据的取证方法。作为回应，网络犯罪分子使用各种技术试图掩盖踪迹。以下是 CISO 应该注意坏分子使用的某些反取证技巧：\n\
  \n- **覆盖数据**：网络犯罪分子掩盖踪迹的一种方法是用模式或随机数据覆盖数据或元数据。如果他们操作得当，取证分析师很难或无法知道执行了此类操作。然而，攻击者的挑战在于知道需要删除哪些数据来掩盖踪迹。如果他们不够彻底，可能会遗漏某些内容并留下证据。\n\
  - **隐藏数据**：数据可以隐藏在文件系统结构中，例如文件表中未使用的部分、目录内部或磁盘的空隙空间（slack space）。网络犯罪分子还可以使用隐写或加密来隐藏数据。加密数据可以变得不可读，但如果相关的元数据（如文件头）没有加密，就可以揭示加密数据的存在，这可能提示调查人员发生了某些。相反，隐写是将数据隐藏在通常用于其他用途的容器（如图像文件）中。在这种情况下，数据本身可能很难被检测。\n\
  - **隐藏行为**：操作系统和应用程序会创建元数据，指示文件的创建、修改或访问时间。网络犯罪分子使用多种方法，通过混淆通常用于指示行为的元数据来掩盖其活动。\n\
  \n## 安全评估与测试\n\n安全计划最终由人员、流程和技术组成。安全计划的每个方面都必须有效运行，以促进全面的安全计划。为了理解这些组件的运行情况，测试它们的有效性非常重要。这通过安全评估和测试来实现，用于衡量和验证计划组件的有效性。本节提供了评估和测试安全计划的方法概述：\n\
  \n- 漏洞评估\n- 渗透测试\n- 监管合性评估\n- 安全计划评估\n\n每种评估类型提供了检查组织安全态不同方面的独特方法。每种安全评估都遵循通用的生命周期，包括：\n\
  \n- 识别评估的需求和目标\n- 评估环境的现状\n- 识别并报告与预期状态之间的差距\n\n![Images](img/exam.jpg)\n\n**考试提示**：CCISO\
  \ 候选人应该熟悉不同类型的安全评估，并根据场景选择合适的安全评估类型。\n\n### 注意事项与考虑\n\n安全评估可以为组织对其安全态的弱点提供宝贵的见解，但在进行评估之前，有几个重要的考虑因素。两个主要的考虑因素是确保已获得适当的测试授权，并对组织业务运营的任何潜在中断进行理解、沟通和管理。\n\
  \n- **授权**：对于本节中提到的任何安全评估，评估人员都必须获得组织的许可并对该任务进行签字，无论是内部评估还是外部评估。必须定义并达成一个清晰的范围，概述可能测试的系统和已批准的评估类型。这对于像渗透测试这样的侵入性测试尤为重要，因为在没有适当书面许可的情况下侵入系统可能会违反法律。此类文件有时被称为“免死金牌”。\n\
  - **管理业务中断**：安全评估和测试可能会对组织产生干扰，在最坏的情况下，可能是破坏性的。测试可能会导致服务器或应用程序关闭或资源过载。因此，测试必须通过涉及必要的利益相关者和部门在整个组织范围内进行协调。应该考虑如何在不干扰组织业务运营的情况下进行测试。例如，某些关键任务系统可能无法直接测试，因为风险可能被认为太高。在这种情况下，某些组织可能会在测试环境中执行测试，而不是在实时“生产”系统中执行。测试环境允许组织进行测试并识别漏洞，而不会产生直接干扰生产系统的风险。\n\
  \n## 漏洞评估\n\n漏洞评估是旨在发现和识别环境中漏洞的测试。这些评估在范围和技术深度上有所不同。例如，物理漏洞评估可能仅包含物理安全控制清单，而网络或系统漏洞评估可能包括使用漏洞扫描工具识别环境中的技术漏洞。测试可以从组织内部（内部测试）或外部（外部测试）进行。漏洞评估任务可能包括一种或所有漏洞评估测试类型：\n\
  \n- 网络和系统漏洞评估\n- 应用漏洞评估\n- 物理漏洞评估\n- 基于人的漏洞评估\n\n在漏洞评估期间，评估团队识别资产（系统、应用程序、建筑或人员），进行枚举并识别漏洞。本节将介绍上述各类型的漏洞评估。\n\
  \n### 网络和系统漏洞评估\n\n网络和系统漏洞评估是最常见的评估类型之一。通常通过利用自动化扫描工具来识别如下漏洞：\n\n- **漏洞软件**：停止支持、未补补或过时的软件\n\
  - **开放端口**：可用的端口和服务，无意中增加了暴露风险\n- **漏洞协议**：过时的 TLS/SSL 版本、使用明文协议（如 FTP 或 Telnet）等\n\
  - **配置错误**：可能允许攻击者获取信息或为进入系统提供脚脚点的配置\n\n\n\n\n\n可以使用多种工具进行网络和系统漏洞扫描，包括开源工具、商用工具和专有测试工具。网络和系统漏洞扫描是健康漏洞管理计划的重要组成部分，应根据组织的需求和要求定期计划（例如每周或每月）进行。\n\
  \n网络和系统架构评估是对组织企业架构设计和实施的人工检查。这通常涉及对以下内容的检查和评估：\n\n* 网络架构，包括网络拓扑和支持文档\n* 在端口上开启的服务和协议，以验证是否仅启用了必要的服务\n\
  * 在端口和功能上实现的访问控制\n* 任何需要凭据的连接和功能的密码强度\n* 在网络边界提供安全控制的设备（防火墙、边界路由器等）\n* 其他网络设备（电信设备、无线设备等）\n\
  * 防火墙规则集、边界路由器、无线实现方案和入侵检测系统\n\n网络架构评估可能非常复杂、耗时且昂贵，因此通常不会频繁执行。它可能会在环境发生重大变化或根据风险评估的要求时进行。\n\
  \n### 应用程序漏洞评估\n\n应用程序漏洞评估通过人工和自动化手段评估应用程序的安全特性。这种测试不仅适用于内部开发的自定义应用程序软件，也适用于商用通用软件（COTS）应用程序或集成应用程序系统。这些测试用于识别如下的应用程序级漏洞：\n\
  \n* 跨站脚本 (XSS)\n* SQL 注入\n* 安全配置错误\n* 目录遍历\n* 存在的组件\n* 敏感数据泄露\n\n![Images](img/note.jpg)\n\
  \n**注意** 应用程序漏洞及相应的保护措施在本章前面的“恶意软件与攻击”以及“软件开发安全”章节中会有更深入的讨论。\n\n应用程序漏洞评估范围各异，从简单使用自动化漏洞扫描工具到执行应用程序架构和设计评估、代码审查、人工渗透测试、自动化源代码分析以及利用运行时扫描技术。以下是几种不同的应用程序安全测试方法：\n\
  \n* **静态应用程序安全测试 (SAST)**：在应用程序源代码编译或执行之前对其进行扫描和分析，以检测代码层面的漏洞。`SAST` 是`白盒测试`的一个示例，因为评估人员获得了有关应用程序的信息，如源代码访问权限、架构图等。\n\
  * **动态应用程序安全测试 (DAST)**：在执行期间对应用程序进行测试，以检测运行状态下的漏洞。这通常是作为基础应用程序漏洞扫描的一部分进行的测试类型。`DAST`\
  \ 工具执行多种测试，包括`fuzzing`（或模糊测试），即向应用程序发送无效或意外的数据作为输入（且通常是大量发送），以观察应用程序的响应。\n* **应用程序安全测试服务\
  \ (ASTaaS)**：另一种“即服务”类型模型，组织付费给他人来执行应用程序安全测试。测试类型根据服务内容而异，但可能包括 `SAST`、`DAST`、应用程序渗透测试等。\n\
  \n作为项目工作的一部分，评估人员可能会利用配置错误、缺失的补丁和过度开放的服务尝试获取内部系统的访问权限，以确保当前和未来的应用程序以保护安全的方式部署。\n\
  \n### 物理漏洞评估\n\n物理漏洞评估也称为物理安全评估，侧重于识别、评估和修复（办公室、数据中心等）。它们通常包括对以下内容的审查：\n\n* 设施和边界防护：包括围栏、摄像头等\n\
  * 内部防护：包括服务器机房和布线间\n* 免受人为、自然或技术威胁的防护：包括翻垃圾桶\n\n### 人为因素漏洞评估\n\n人也是资产。与硬件和软件一样，也应该对人进行列举和评估。人为因素的漏洞在修复之前必须被识别。人为因素漏洞可以通过测试、访谈和观察发现。某些方法包括：\n\
  \n* 交互式培训：安全意识培训产品通常包含测试员工知识的评估\n* 熟练度测试：组织使用熟练测试来评估员工对安全策略的理解\n* 社会工程测试：组织测试员工的韧性。这包括安全测试，通过发送模拟钓鱼邮件来测试他们是否会点击。真实的钓鱼邮件包含有害链接和附件，而模拟钓鱼邮件包含安全的链接和附件。\n\
  \n关于人为因素漏洞评估的主题在本章前面的“社会工程”部分有更详细的介绍。\n\n## 渗透测试\n\n虽然漏洞评估提供了组织漏洞的全方位视图（识别漏洞），但渗透测试展示了如何利用特定漏洞来破坏数据或对组织产生不利影响（展示被破坏的影响）。渗透测试是一种针对性测试，重点在于提供真实的示例，说明攻击者如何利用漏洞获取访问权限、提升权限并最终破坏客户或其他组织数据。渗透测试人员利用配置错误、缺失的补丁和过度开放的服务尝试获取内部系统的远程访问权限。他们还通过利用内部系统中发现的额外漏洞，评估自己可以渗透到内部网络的有多深，这允许外部攻击者从一个系统跳到另一个系统，以获取对更敏感系统或数据的访问。渗透测试方法各异，但通常遵循此处概述的方法论：\n\
  \n1. **侦察/发现**：评估人员尝试获取有关组织及其系统的信息。在这一步中，侦察通常是被动的。*被动侦察*侧重于尽可能隐藏，通过网络搜索和其他方法收集信息，以免直接警报组织。\n\
  2. **枚举**：评估人员尝试使用主动侦察获取更多关于系统的信息。*主动侦察*涉及主动扫描和探测系统以获取信息。\n3. **漏洞分析**：识别并分析漏洞。\n\
  4. **执行/利用**：利用漏洞获取进入系统的立足点。\n\n\n\n\n\n# 5. 发现结果\n\n发现结果作为最终报告的一部分进行记录并向管理层报告。\n\
  \n渗透测试利用其他的漏洞评估工具作为评估的一部分，以识别可供利用的漏洞。渗透测试还包括通过使用社会工程学策略进行基于人类的漏洞评估，以获取网络的初始立足点。渗透测试方法有多种类型，包括：\n\
  \n*   **黑盒测试**：也称为`零知识测试`或`盲测`，评估人员对评估目标没有预先了解。`双盲测试`是指运营工作人员（如 IT 或安全团队）对测试的进行并不知情，可以用于测试他们对潜在入侵的响应能力。\n\
  *   **灰盒测试**：也称为`部分知识测试`，评估人员对被评估的目标有一定的一定了解。\n*   **白盒测试**：也称为`全知识测试`，评估人员拥有关于目标的完整信息，例如网络拓扑、清单、系统名称、IP\
  \ 地址等。\n\n![Images](img/note.jpg)\n\n**注意** 这些测试方法也适用于其他类型的安全评估。例如，漏洞评估可以以黑盒、灰盒或白盒评估的形式进行。\n\
  \n渗透测试提供了安全缺陷的性证明，并允许进行有针对性的风险修复活动。\n\n## 监管合规评估\n\n监管合规评估侧重于评估组织对法律、法规要求以及与组织相关的其他合规要求的遵守程度。这些工作涉及如下法规要求：\n\
  \n*   《健康保险可流动性与责任法》(HIPAA)\n*   支付行业数据安全标准 (PCI DSS)\n*   《格拉姆-莱奇-布莱法案》(GLBA)\n\
  *   ISO/IEC 27001\n*   组织控制审计 (SOC 1, SOC 2 和/或 SOC 3)\n*   《通用数据保护条例》(GDPR)\n*\
  \   联邦风险与授权管理计划 (FedRAMP)\n\n这些评估通常作为内部或外部审计的一部分进行。工作通常于对组织合规性要求的评估（对于特定框架的审计和评估，如\
  \ `PCI DSS` 或 `ISO/IEC 27001`，这些可能已经已知）、对组织当前实践的评估，以及识别并记录差距。结果通常是一份`差距分析`报告，列出已识别的差距。根据任务的性质和范围，它可能包括修复协助，或者报告可能为修复已识别的差距提供指导。\n\
  \n## 安全计划评估\n\n安全计划评估评估组织的信息安全计划或安全计划的特定组件或`过程`。这包括对组织基础设施、安全策略和程序、人员配备、员工和工作场所进行审查，以确定安全计划如何应对组织及其特定行业和部门的风险与威胁。安全计划评估可能侧重于特定安全工作流或子计划的治理。然而，如果与本节讨论的其他安全评估类型相结合，安全计划审查可能可能包含技术组件。安全计划评估可能包括以下任何一项或全部安全计划组件：\n\
  \n*   安全组织审查\n*   风险管理审查\n*   监管合规审查\n*   安全策略、标准和程序审查\n*   安全运营审查\n*   软件开发安全审查\n\
  *   物理安全审查\n*   事件处理与响应审查\n*   业务连续性和灾难恢复审查\n*   安全意识与培训审查\n*   数据安全审查\n\n## 业务连续性与灾难恢复\n\
  \n`业务连续性管理 (BCM)` 是涵盖业务连续性计划 (BCP) 和灾难恢复计划 (DRP) 的总体管理过程。业务连续性管理的目标是为以下问题提供答案：\n\
  \n*   组织能够承受灾难的影响吗？\n*   是否实施了从灾难中恢复的控制措施？\n*   人员是否为灾难做好了准备？\n*   连续性计划是否已记录并批准？\n\
  *   员工是否对恢复程序接受了适当培训？\n*   连续性计划是否保持最新并定期测试？\n*   连续性计划是否确保了关键业务功能的及时恢复？\n\n业务连续性管理包含了灾难恢复规划和业务连续性规划。`连续性规划`的目标是确保在发生灾难时业务能够继续运行。BCM\
  \ 包含了灾难恢复规划和业务连续性规划。`业务连续性规划`与灾难恢复规划相比是长期规划，并记录在业务连续性计划 (BCP) 中。`灾难恢复规划`通常侧重于 IT，专注于在灾难发生后恢复资源到运行状态。灾难恢复活动记录在灾难恢复计划\
  \ (DRP) 中，与 BCP 相比是短期程序。\n\n如果某建筑被飓风摧毁，DRP 将解释组织如何恢复 IT 功能，例如通过启动冷备机并从备份恢复数据。DRP\
  \ 侧重于让关键系统进入可以提供服务和组织流程恢复的状态。BCP 则更多地关注业务运营，例如说明重新迁移人员和启动重建的程序。\n\n不同的行业组织、标准和指南概述了不同的连续性规划流程；然而，它们通常包含相同的概念。本章概述并讨论的过程如图\
  \ 4-21 所示。该过程基于 NIST SP 800-34《连续性规划指南》概述的步骤。本节将讨论业务连续性管理过程中的每个阶段：\n\n![Images](img/F04-21.jpg)\n\
  \n**图 4-21** 业务连续性管理过程\n\n*   连续性规划启动\n*   业务影响分析\n*   识别预防措施\n*   制定恢复策略和解决方案\n\
  *   制定计划\n*   测试计划\n*   维护计划\n\n### 连续性规划启动\n\n与任何项目一样，连续性规划遵循项目管理方法（如第三章所述）非常有帮助。启动项目并制定经过组织领导层批准的项目计划。完成后，应制定业务连续性政策，也称为业务连续性计划声明。制定业务连续性计划的启动过程可能包括以下步骤：\n\
  \n1. 审查现有的 BCP（如果存在）。\n2. 概述适用于组织的 BCP 目标。\n3. 创建业务连续性政策声明。\n4. 制定初步的 BCP 开发预算。\n\
  5. 制定计划批准的程序。\n6. 任命 BCP 协调员、项目经理和 BCP 项目团队。\n7. 制定 BCP 进展的报告程序和频率。\n\n\n\n\n\n\
  # 8. 识别所需的文档和信息收集技术。\n\n作为流程的一部分，必须建立 BCP 团队，其关键组成部分是`业务连续计划协调员`，负责监督从启动到测试和维护的整个业务连续性管理过程。`BCP\
  \ 协调员`为`BCP 团队`提供领导并根据需要指导工作。BCP 开发团队应由熟悉组织内部关键业务区域的代表组成，包括以下部门的代表：\n\n* 高层管理\n\
  * IT 部门\n* 安全部门\n* 风险管理部门\n* 设施管理\n* 组织领导和高管\n* 公共关系与传播部门\n* 法务部门\n\n![Images](img/note.jpg)\n\
  \n> **注意** 团队由组织所有关键领域的人员组成非常重要。此外，负责`执行` BCP 的人员必须参与 BCP 的`开发`。所有这些利益相关者都应该从自己的角度提供意见并讨论所需的内容。他们可以共同努力制定出一份满足组织关键业务需求的计划。\n\
  \n## BCP 政策大纲\n\nBCP 政策为 BCP 工作提供了基础。它记录了 BCP 的目的，有助于传达该计划的重要性，并作为经管理层签署的正式文件。业务连续性计划政策应概述以下内容：\n\
  \n* 政策范围\n* 角色与职责\n* 风险评估方法要求（定性、定量、影响分析、功能分析、指标等）\n* 组织和管理计划开发的要求\n* 测试和培训要求\n\
  * 确保计划时效性的要求\n\n## 业务影响分析\n\n连续性计划流程中的一个核心组成部分是`业务影响分析 (BIA)`，这是一种用于连续性计划的功能性风险分析，旨在确定在发生重大中断时的组织和系统需求、相互依赖关系、应急需求和优先级。`BIA`\
  \ 本质上是业务连续性管理的风险分析。其目标是识别组织最关键的业务功能、资产、资源和操作。`BIA` 涉及的步骤概述如下：\n\n1. 识别关键功能和支持资源。\n\
  2. 确定恢复目标。\n3. 识别漏洞和威胁。\n4. 确定恢复优先级。\n\n本节将逐步介绍 BIA 流程的每一个步骤，并讨论每个阶段所开展的活动。\n\n\
  ![Images](img/exam.jpg)\n\n> **考试提示** 尽管 CCISO 候选人可能不会被测试这些具体的 BIA 步骤，但他们应该熟悉 BIA\
  \ 术语、开展`BIA`的目的，以及`BIA`如何用于业务连续性管理。\n\n### 识别关键功能和支持资源\n\nBIA 流程的第一步是识别组织的关键功能。这通常通过从关键利益相关者处收集和汇总信息来实现。团队可以执行以下任务以获取最佳数据：\n\
  \n* 选择要访谈的利益相关者\n* 确定数据收集技术（例如研讨会、调查问、访谈等）\n* 开发问卷以获取运营和经济数据\n* 通过数据收集和文档来源收集数据\n\
  * 记录组织功能、活动和交易\n* 建立组织功能的分级\n* 应用分类方案以指示每个独立组织单位功能的关键性水平\n\n在确定关键功能时，团队会考虑如果某个特定功能无法运行对业务的影响。团队会针对该功能不可用的情况考虑如下问题：\n\
  \n* 对收入流产生多大影响？\n* 将如何影响生产环境？\n* 将增加多少运营费用？\n* 将如何影响公司的声誉和公众信任？\n* 公司是否可能失去竞争优势？\n\
  * 将如何导致违反合同协议或法规？\n* 能够承受哪些延迟成本？\n* 有哪些未计入的隐藏成本？\n\n除了识别关键功能外，还必须识别并记录支持资源。这些是组织的关键功能在执行这些过程中赖以生存的资源。支持资源可能包括信息系统、人员、程序、用品、任务、来自供应商或承包商的外部支持，或其他图\
  \ 4-22 所示的资源。此步的结果是得到一个经过审核的函数列表，并使用关键、基本、必要和理想等分级系统进行分类。\n\n![Images](img/F04-22.jpg)\n\
  \n**图 4-22** 关键功能的支持资源\n\n### 确定恢复目标\n\nBIA 流程的下一步是团队通过与关键利益相关者的讨论，分析功能和资源，并确定每个功能的恢复目标。重点是确定功能和资源的可接受停机时间。可接受的停机时间可以使用以下值表示：\n\
  \n* `最大容忍时间 (MTD)`：由于停机或中断，管理层愿意为特定流程、功能或资源接受的停机时间。`MTD` 有助于关于恢复优先级排序、`RTO` 开发以及恢复策略和解决方案的决策。\n\
  * `恢复时间目标 (RTO)`：资源在影响关键功能、流程或 `MTD` 之前不可使用的的最长时间。`RTO` 通常比 `MTD` 短，以确保满足 `MTD`。\n\
  * `恢复点目标 (RPO)`：数据可以恢复到停机或中断之前的某个点。这确定了组织功能或流程在从停机中恢复时可以忍受的数据丢失量。\n\n这些信息对于以后确定恢复解决方案和策略至关重要，并帮助团队决定必须恢复系统和资源的顺序，以恢复关键功能。例如，在与利益相关者的讨论期间，可能会获知如果制造设施中的一台关键服务器停机超过三个小时，整个生产线都需要重新启动，这将花费一整天。根据这些信息，组织可能会决定该服务器的\
  \ `MTD` 不超过三小时。\n\n### 识别漏洞和威胁\n\nBIA 流程的下一步是团队识别可能发生的漏洞和威胁，以确保理解对连续性的影响。需要考虑一系列威胁：\n\
  \n* 自然灾害（飓风、地震、洪水、病毒等）\n* 技术问题（系统、网络和通信中断）\n* 供应系统（电力、暖空调等）\n* 人为因素（恐怖主义、不满的员工、骚乱、破坏破坏等）\n\
  \n\n\n\n\n其目的并不是思考可能发生的每一种威胁事件，这本身是不可能的，而且这类头脑风暴会议可能会偏离实际（例如，外星人入侵）。目标是对任何可能损害或中断关键组织功能或流程的威胁事件做好充分准备，并确保组织拥有计划以确保关键功能的连续性。某些威胁对业务的影响可能比其他威胁更大，因此可能会驱动有关恢复优先级的决策。例如，如果组织的制造能力受到某种高发生概率的事件（如风暴）的严重影响，组织可能会决定投入相应的资源进行相应的恢复工作。\n\
  \n## 确定恢复优先级\n\n业务影响分析（BIA）流程的最后一步是检查各种类型的有害事件及其对组织的相应影响，以确定恢复优先级。这些可以通过非正式的会议或讨论，或者通过更正式的风险评估（定量或定性）来确定。通过估计、衡量和分析以下因素可以建立恢复优先级：\n\
  \n* 可接受中断时间 (`MTD`、`RTO`、`RPO`）\n* 业务流程关键性\n* 财务、生产力和运营影响\n* 监管合规性要求\n* 组织声誉考量\n\
  \nBIA 结果将被记录并提交给管理层批准。随后，它们将根据可停机时间为功能和资源创建恢复和备份解决方案。BIA 的结果包含以下：\n\n* 已识别的关键功能和支持资源\n\
  * 每个功能和资源的 `MTD`、`RTO` 和 `RPO`\n* 识别出的威胁和漏洞\n* 组织面临每种威胁时可能实现的影响风险\n\n## 识别预防性控制\n\
  \n一旦完成 BIA，组织对资产不可用将造成的业务影响会有更好的了解。下一步是确定是否可以实施任何预防性控制来降低这些风险。在某些情况下，BIA 识别的影响可能会减少或消除。BIA\
  \ 的结果可能表明需要预防性控制。以下是一些需要考虑的示例：\n\n* 火灾检测和灭火系统\n* 购买不间断电源 (`UPS`)\n* 购买发电机组\n* 场外备份媒体存储位置（磁带、硬盘、文档等）\n\
  * 通信链路冗余\n* 服务器冗余\n* 购买保险\n\n在某些情况下，预防性控制可能比在中断后依赖恢复系统更具成本效益且更优。预防性控制并不会消除对恢复系统或规划的需求，但它们提供了降低停机发生概率手段。\n\
  \n## 开发恢复策略和解决方案\n\n业务连续性管理流程的下一步是根据可停机时间为关键功能、资源和部门开发恢复策略和解决方案。本节将介绍以下恢复策略和解决方案领域的考虑因素：\n\
  \n* 组织流程恢复\n* 设施和站点恢复\n* 设备、资源和技术恢复\n* 用户环境恢复\n* 数据恢复\n\n决定恢复策略和解决方案是一项平衡工作。组织必须在恢复成本与中断成本之间取得平衡。如果组织希望获得短\
  \ `RTO`，实施所需的恢复技术和解决方案的成本将非常高。然而，较长的 `RTO` 可能会由于关键功能和运营中断而增加组织的成本。这一概念在 `Figure\
  \ 4-23` 中所示。\n\n![Images](img/F04-23.jpg)\n\n**图 4-23** 恢复成本考量（来源：NIST）\n\n### 组织流程恢复\n\
  \n业务连续性计划团队考虑关键业务流程，并确定适当的资源和策略将其恢复到正常运行。在这项工作中，团队必须理解关键组织流程的以下方面：\n\n* 流程涉及的角色\n\
  * 资源需求\n* 流程流步骤\n* 其他流程的接口和相互依赖关系\n\n这些信息通常以工作流的形式呈现，记录流程步骤、角色、资源以及与其他流程的相互连接。这些信息有助于团队识别控制措施和应急策略，以减轻威胁导致的流程中断。\n\
  \n### 设施和站点恢复\n\n组织灾难恢复的一个关键考量是如何处理数据处理设施。组织可以选择购买专用的备用站点、租赁设施或达成互惠协议。无论选择何种备用站点类型，都有以下设施和站点恢复选项：\n\
  \n* **热机房 (Hot site)**：包含所有必要的处理系统、软件和设备，可在几小时或更短时间内准备就绪。只需要人员和数据备份。这是最昂贵的选项，恢复速度最快。\n\
  * **温备机房 (Warm site)**：包含基础设施（布线、空调、水暖等），并部分配备了一些系统硬件、软件。该站点还需要额外的计算机、软件、设备、人员和数据备份，可以在一天内准备好。这是一个折中方案，因为温备机房比热机房便宜，且恢复速度比冷备机房快。\n\
  * **冷备机房 (Cold site)**：仅包含基础基础设施（布线、空调、水暖等）且没有任何系统。这是最便宜的选项；但其恢复时间最慢（约两周）。\n\n![Images](img/note.jpg)\n\
  \n**注意** 备用站点的位置距离主站点足够远，以不受同一场灾难的影响，但又不能远到导致移动成本极端。像所有事情一样，合适的距离是基于组织目标和优先级的平衡。\n\
  \n以下是设施和站点恢复选项的一些变体：\n\n* **灾难恢复服务 (DRaaS)**：一种用于灾难发生时恢复的云计算服务（也称为“恢复服务”）。该服务范围从将数据备份到云环境到备份所有数据和应用程序并在主站点维修期间作为替代处理基础设施。\n\
  * **冗余站点 (Redundant site)**：一个与主数据中心完全配置且配置的数据中心（也称为“镜像站点”）。这是最昂贵的选项，适用于对高可用有要求。\n\
  * **滚动热备机房 (Rolling hot site)**：一个配备数据处理设备的移动站点；本质上是一个移动数据中心。也被称为“移动站点”。\n* **三级站点\
  \ (Tertiary site)**：当主备用站点不可用时使用的备备用设施。\n\n![Images](img/exam.jpg)\n\n**考试提示** CCISO\
  \ 候选人应该熟悉各种设施和站点恢复选项，并能够根据恢复目标或成本考量选择选项。\n\n#### 设备、资源和技术恢复\n\n\n\n\n\n组织恢复还有其他必须考虑的方面，包括但不限于以下内容：\n\
  \n- **人员**：确保人员生命安全、灾害期间期间有充足的人力配置，并制定适当的继任计划\n- **文档**：确保关键文档（政策、程序、计划等）可用\n- **硬件**：考虑网络和计算机设备、更换时间需求、供应商的\
  \ SLA（服务水平协议），以及旧设备和/或专有设备的风险\n- **软件**：生产所需的应用程序、实用程序和操作系统\n- **通信**：与各种利益相关者（客户、供应商、媒体和股东）进行通信的计划\n\
  - **基础设施**：对语音和数据通信、电力以及暖通空调（HVAC）的需求\n- **物资**：对纸张、线缆、物理存储等的需求\n- **其他风险**：灾害发生后可能出现抢劫、蓄破坏或其他欺诈活动的可能性\n\
  \n## 高管继任计划\n\n组织高层领导的临时或永久流失可能会对组织的运营造成重大损害。组织必须制定`高管继任计划`，以便在高管人员流失时保护运营的连续性和领导力，这是至关重要的。例如，`CISO`\
  \ 的继任计划可能规定由副 `CISO`、信息安全官 (`ISO`) 或信息安全经理 (`ISM`) 接管。继任计划的核心在于随时准备好应对这些情况，使公司能够在极端情况发生后熟练地度过这一关键时期。\n\
  \n## 用户环境恢复\n\n终端用户环境的恢复对于恢复组织运营至关重要。这包括有关通知员工的决策、确保关键员工资源可用以及确保为员工提供安全的工作条件。为了促进员工环境的恢复，`BCP`\
  \ 团队必须执行以下工作：\n\n- 开发电话通知树以告知员工灾害情况并保持信息实时更新\n- 识别维持关键功能运行所需的关键用户\n- 识别如何手动执行当前的自动化任务\n\
  - 识别用户资源和供应需求\n- 如果需要，为用户制定前往新设施的运输程序\n\n## 数据恢复\n\n恢复因灾害导致丢失数据的传统方法是使用`数据备份解决方案`。通过这种方法，数据被备份到中心化存储中，例如`云存储`、网络附属存储\
  \ (NAS) 或存储区域网络 (SANs)。备份程序应记录在案，并按每天、每周和/或每月定期进行备份。三种主要的数据备份类型如下：\n\n- **全备**：备份系统上的`所有`文件。提供最快的恢复速度，但执行备份的时间最长。\n\
  - **增量备份**：备份自上一次任何类型的备份以来`更改的所有`文件。备份执行速度更快，但恢复时间更长，因为必须恢复全备以及随后的执行的每份增量备份。\n-\
  \ **差异备份**：备份自上一次`全备`以来更改的所有文件。对于恢复，先恢复全备，然后恢复最近的差异备份。\n\n![Images](img/exam.jpg)\n\
  \n**考试贴士** `CCISO` 候选人应该熟悉不同的备份类型。\n\n在理想的世界中，备份的数据会被恢复到灾害发生正前的精确状态；在实践中，备份/恢复过程可能会由于最后一次备份与灾害事件之间的时间差而导致某些数据丢失。为了消除使用备份导致数据丢失的风险，组织可以使用其他方法来确保`数据韧性`。其中一种解决方案是`磁盘镜像`，它通过向多个磁盘写入相同的数据来提供冗余。如果丢失了其中一个介质，另一个仍可供运营。现代镜像解决方案可以提供灾害后的快速和无缝恢复，尽管有一些实施因素需要考虑。如果冗余磁盘位于同一位置，它们可能会遭受相同的灾害（如洪水或火灾），这使得此类实现不适用于此类事件的恢复。此外，导致数据丢失的相同事件（例如服务器故障导致写入错误）可能会在两个磁盘上产生相同的错误，导致数据无法恢复。因此，许多组织对数据恢复采用了部分镜像方案，但仍然依赖备份。\n\
  \n数据可以存储在各种介质上，包括磁带和磁盘。可以使用 `RAID`（针对磁盘）或 `RAIT`（针对磁带）在磁带或磁盘级别实现冗余。`独立磁盘冗阵列 (RAID)`\
  \ 是一种用于磁盘间冗余的技术。`RAID` 本质上允许跨多个磁盘写入数据，以实现更快的读写操作以及冗余。冗余程度取决于所使用的 `RAID` 级别。独立磁带冗阵列\
  \ (RAIT)` 与 `RAID` 类似，但使用的是磁带而不是磁盘。\n\n![Images](img/note.jpg)\n\n**注意** 对于某些利用云服务的组织，云服务提供商可能会作为订阅的一部分提供自动备份和恢复功能。这可能包含在服务中，也可以作为附加组件。无论何种情况，确保云端数据已备份并能像本地存储数据一样可靠地恢复都是关重要的。\n\
  \n## 单点故障\n\n`任何`仅使用一个组件执行工作的系统或网络都会产生`单点故障`。如果该唯一组件故障，就没有备用组件来替代。减轻单点故障风险的控制示例包括：\n\
  \n- 冗余 `LAN` 路由\n- 按需备份的 `WAN` 连接\n- 冗余和容错技术\n- 关于如何处理故障的记录程序\n- 经过良好培训的人员\n\n##\
  \ 制定计划\n\n在 `BCP` 团队制定 `BCP` 策略、执行 `BIA`（业务影响分析）、实施预防性控制并制定恢复策略和解决方案后，下一步是制定计划。业务连续性计划的通用结构如图图\
  \ 4-24`所示。\n\n![Images](img/F04-24.jpg)\n\n**图 4-24** BCP 结构（来源：NIST）\n\n## BCP\
  \ 机密性\n\n大多数组织的业务连续性计划有两个版本：一个内部版本和一个与客户及其他合作伙伴共享的脱敏版本。客户可能特别想知道组织拥有 `BCP`，某些客户可能要求接收该版本以满足其自身的合规性要求。然而，`BCP`\
  \ 本质上是一份敏感文档，如果泄露会对组织造成损害。它详细说明了组织在灾害时使用的恢复技术、解决方案和策略。这些信息对攻击者来说可能非常有价值。这就是为什么开发一个脱敏的“公开”版本。脱敏后的\
  \ `BCP` 不应包含：\n\n- 联系列表\n- 业务恢复程序\n- 流程图\n- 风险缓解方法\n- `BIA` 结果\n\n脱敏版本应足够具体，以满足客户的安全和合规要求，但又要足够通用，以免泄露敏感信息。\n\
  \n## 测试计划\n\n\n\n\n\n确保计划有效性的关键方法是进行测试，以验证计划中的活动可以被有效执行。组织不应该等到灾难发生时才测试其业务连续性计划和灾难恢复计划。组织应至少每年执行一次，并制定特定的测试目标、场景和成功标准。这些可能包括确保：\n\
  \n* 响应在可接受的时间范围内\n* 备用地的操作是充分\n* 备份可以成功恢复\n* 可以在可接受的时间范围内联系到关键人员\n* 团队成员了解当前计划的细节\n\
  * 团队成员能够履行其特定职责\n* 计划是最新且相关的\n\n以下是可选择的许多不同类型的测试之一：\n\n* `Checklist test`：将 `BCP`\
  \ 副本发给职能经理，由他们审查计划中涉及其部门或业务领域的部分。\n* `Structured walk-through test`：召开会议，让各职能经理聚在一起“演练”\
  \ `BCP`。这也被称为 `tabletop walkthrough`（桌面推演）或 `tabletop exercise`（桌面演习）。\n* `Simulation\
  \ test`：实施灾难场景，演练 `BCP` 直到实际迁移到场外设施。测试范围可以从特定部门到整个组织不等。\n* `Parallel test`：使用传输到场外设施进行并行处理的系统对\
  \ `DRP` 进行测试，以确保特定系统在备用设施运行良好。此测试有助于确保备用系统的运行与主站点系统一致。\n* `Full interruption test`：这是侵入性最大但最全面的\
  \ `DRP` 测试类型。关闭原始处理站点，并将所有处理转移到场外备用设施。\n\n![Images](img/exam.jpg)\n\n**考试提示** CCISO\
  \ 候选人应该熟悉不同类型的业务连续性计划和灾难恢复计划测试。\n\n测试完成后，团队应进行并记录教训总结会议。教训总结应指出识别出的任何缺陷或其他需要补救的重大发现。这些信息应经过审查、并报告给管理层，并在适用情况下加入计划中以提高其有效性。作为计划测试的一部分，确保恢复人员已就其在计划执行方面的角色和职责接受培训至关重要。培训频率将根据组织的需求和识别出的风险而因组织而异。然而，培训应在入职时进行，并且通常至少每年一次。恢复人员应至少接受以下计划要素的培训：\n\
  \n* 计划目的\n* 通信与协调流程\n* 报告流程\n* 安全要求\n* 个人职责以及团队特定的职责和流程\n* 计划中每个阶段的职责（启动、激活、恢复、重组）\n\
  \n# 准备与测试是关键\n\n在新型冠肺炎（COVID-19）爆发期间，许多组织意识到他们没有对这种类型的灾难做好充分准备。在业务连续性方面，讨论通常集中在\
  \ IT 服务的中断。在新冠病毒爆发后，最普遍的问题之一是缺乏处理灾难的能力。\n\n* 指派个人或团队作为负责人员\n* 包含业务连续性和恢复审查\n* 实施变更控制\n\
  * 定期测试计划\n* 确保适当员工已接受培训\n* 纳入测试中获得的教训\n\n## 维护计划\n\n本节涵盖的各种组件必须保持更新。由于人员变动或技术或软件的更改，业务连续性计划可能会迅速过时。作为计划维护的一部分，应遵循变更控制的最佳实践。对计划的更改应经过批准、测试和记录。应实施并执行严格的版本控制。对于任何新变更，都应考虑是否需要新的培训，以确保适当的员工具备知识并准备好执行。\n\
  \n# 章节回顾\n\nCISO 应该对信息安全的核心能力有深入理解。核心能力可以分为三组：\n\n* 来自网络攻击的威胁\n* 技术安全领域\n* 管理和程序领域\n\
  \n## 来自网络攻击的威胁\n\n恶意软件、脚本和社交工程是网络攻击者实施网络攻击的主要方法。`Weaponization`（武器化）是部署恶意软件、脚本或其他利用手段。恶意软件包括木马、病毒、蠕虫和僵尸网络。脚本攻击由利用操作系统和应用程序漏洞的网络攻击者实施。`Social\
  \ engineering`（社交工程）是指利用欺骗手段引导他人做可能不符合其最佳利益的事情。骗子多年来一直使用社交工程，现在它是网络攻击不可或缺的一部分。\n\
  \n## 技术安全领域\n\n所有组织都应该了解自己拥有的资产，并根据风险和分类确定每种资产需要哪些控制措施。`Data security controls`（数据安全控制）取决于数据的状态，无论是静态、传输中还是在使用。数据安全控制通常作为数据生命周期的一部分实施。通过正确配置和加固存储及处理信息的资产（如服务器、网络设备和应用程序）来实现控制。`Identity\
  \ and access management`（身份与访问管理）是指用于管理和控制企业资源访问的系统和流程，涉及对*谁*在访问*什么*以及他们可以对其*做什么*的管理和实施。\n\
  \n\n\n\n`LANs` 和 `WANs` 为企业提供了通信基础设施。现代网络遵循 `OSI` 模型构建，该模型为理解和设计有效的协议、设备和安全定义了分层。防火墙、网络分段和加密是网络安全中使用的一些基本工具。`Cryptography`（加密）是利用数学方法使未经授权的方无法理解信息来保护信息的实践。加密用于支持机密性、完整性、身份验证和不可否认性。\n\
  \n`Cloud computing` 让组织能够访问共享的可配置计算资源池，这些资源可以以最小努力进行配置和释放。三个主要的云服务模型包括 `IaaS`、`PaaS`\
  \ 和 `SaaS`。使用云服务提供商的相关风险之一是组织失去了对某些功能的控制权，但仍需对安全承担责任。组织必须进行尽职调查，以确保 `CSP` 实施了适当的控制和应对措施。\n\
  \n`Physical security` 通常是组织人员和资产的第一道防线。物理安全的责任因组织而异，可能不属于 `CISO` 的管辖范围。然而，`CISO`\
  \ 应该意识到物理安全及其与信息安全计划之间的关系。\n\n## 管理与程序安全领域\n\n所有内部开发或由第三方人员开发的软件都应使用 `SDLC` 过程开发，在早期阶段将安全集成到产品中并在整个项目生命周期予以解决。将安全集成到开发过程中可以最大限度地减少漏洞并减少安全事件。\n\
  \n在响应安全事件时，准备是关键。决定对安全事件采取什么措施的时间不是在事件发生时。`CISO` 和安全团队应该做好准备，通过经过练习和完善的定义策略和程序对安全事件做出响应。\n\
  \n安全计划最终由人员、流程和技术组成。安全计划的这些每个方面都必须有效运行，以促进整体安全计划。。要了解这些组件是如何运行的，测试它们的有效性至关重要。这通过安全评估和渗透测试来实现，以衡量并验证计划组件的有效性。\n\
  \n`Business continuity planning` 是侧重于关键业务连续性的长期规划。其目标是确保业务在灾难发生时继续运行。`Disaster recover\
  \ planning` 通常侧重于 IT，集中在灾难发生后将资源恢复到运行状态，以确保组织流程的连续性。\n\n## 快速回顾\n\n- 勒索软件是一种恶意软件，它强迫受害者在支付赎金或丢失昂贵资产之间做出选择。\n\
  - 与纯技术攻击相比，网络犯罪利用社会工程更为有效且使用更成功。\n- 组织可以通过一个包含员工培训、测试、练习和监控的综合计划来最好地防御社会工程攻击。\n\
  - 资产安全控制通常作为信息安全控制生命周期框架的一部分实施，如第 2 章所示。\n- 静态数据（data at rest）术语指的是存储在持久性存储设备上的数据，如硬盘、闪存驱动、光盘、磁带或其他存储设备。\n\
  - 传输中数据（data in transit，也称为运动中数据）指的是网络上计算节点之间移动的数据。\n- 使用中数据（data in use）指的是当前正被系统或应用程序处理或使用的数据。\n\
  - 三种主要的身份验证类型包括你知道的（如密码、口语或 PIN）、你拥有的（如令牌设备、智能卡或 USB 驱动器）以及你的特征（生物识别，如语音、指纹或掌纹扫描）。\n\
  - 仅使用这些因素之一被称为单因素身份验证。使用两个身份验证因素被称为双因子身份验证（如智能卡和 PIN、密码和生物识别，或密码和物理令牌）。多因子身份验证是使用两个或更多因素。\n\
  - 主要的访问控制模型包括强制性、任意性、基于属性的和基于角色的访问控制。\n- 身份和访问管理遵循通用的生命周期，包括配置身份和账户、审查身份和账户以及撤销账户。\n\
  - 网络的关键安全特性包括网络分段、防火墙、DMZ、VPN 和 IDS/IPS。\n- 对称加密（也称为对称密钥加密）的特点是使用单一密钥进行加密和解密。\n\
  - 非对称加密（也称为公钥加密）的特点是使用两个密钥，即公钥和私钥，它们在数学上相关。\n- 三个主要的云服务模型包括基础设施即服务 (`IaaS`)、平台即服务\
  \ (`PaaS`) 和软件即服务 (`SaaS`)。\n- 有四种云部署模型：公有、私有、混合和社区。\n- 当涉及物理安全时，最重要的是保护工作环境内员工和其他人的安全。\n\
  - 软件开发人员应接受如何创建不包含安全漏洞的应用程序的专业培训。\n- 大多数计算机犯罪法都包含保护公众免受以下影响的规定：\n    - 未经授权的访问\n\
  \    - 插入恶意代码\n    - 未经授权修改或破坏数据\n    - 未经授权披露信息\n- 安全评估包括漏洞评估、渗透测试、合性评估和安全计划评估。\n\
  - 业务连续性规划是侧重于关键业务连续性的长期规划。其目标是确保业务在灾难发生时继续运行。\n- 灾难恢复规划通常侧重于 IT，集中在灾难发生后将资源恢复到运行状态，以确保组织流程的连续性。\n\
  - 业务影响分析 (`BIA`) 是连续性规划的功能性风险分析，用于确定在发生重大中断时的组织和系统需求、相互依赖关系、应急需求和优先级。它本质上是业务连续性管理的风险分析。\n\
  \n## 问题\n\n1. 某组织的安全团队发现了一种正在自我复制并在网络上从一台计算机传播到另一台计算机的病毒。这是哪种恶意软件的示例？\n   - A. 蠕虫\n\
  \   - B. 木马\n   - C. 僵尸网络\n   - D. 勒索软件\n\n2. 在列出的方法中，什么是防御社会工程的最佳应对措施？\n   - A.\
  \ 培训\n   - B. 练习和演练\n   - C. 观察\n   - D. 阅读\n\n3. 下列哪项是一种集成终端管理方法，允许通过特定策略规范连接到组织的资产的安全要求？\n\
  \   - A. 杀毒病毒\n   - B. 移动设备管理\n   - C. 网络访问控制\n   - D. 配置基准\n\n4. 组织的 `CISO` 希望确保在丢弃系统之前敏感数据无法被恢复。下列哪项不是实现此目标的适当数据擦化技术？\n\
  \   - A. 物理销毁\n   - B. 零化\n   - C. 清除\n   - D. 擦除 (Erasure)\n\n\n\n\n\n## 5.  CISO\
  \ 正在审查组织的访问控制策略和程序。该组织根据请求者的身份、请求的资源以及访问时间来实施访问控制。这属于哪种访问控制模型？\n\nA. 集中式\nB. 强制性\n\
  C. 基于属性\nD. 基于角色的\n\n## 6. 安全运营人员调整了 IDS 的阈值，因为团队成员无法跟上报告的所有非侵入性活动。这是哪种实践的示例？\n\n\
  A. 数据包过滤\nB. IDS 扩展\nC. IDS 调优\nD. IDS 资源调整\n\n## 7. 与非对称加密相比，以下哪项是对称加密的缺点？\n\n\
  A. 它能快速地加密数据。\nB. 它只能加密少量数据。\nC. 它使用的是较弱的加密。\nD. 它在用户众多时扩展性不佳。\n\n## 8. CISO 正在与\
  \ CIO 合作评估一个新的云端托管电子邮件服务提供商。以下哪种云服务模型最能代表这种服务？\n\nA. IDaaS\nB. PaaS\nC. SaaS\nD.\
  \ IaaS\n\n## 9. 确定内部开发的 Web 应用程序是否容易受到脚本攻击的最佳方法是什么？\n\nA. 对部署的软件进行静态测试\nB. 对部署的软件进行动态测试\n\
  C. A 和 B 都是\nD. A 和 B 都不是\n\n## 10. 一个不满的员工在得知自己将因裁员而被解雇后闯入组织并盗取关键数据。这是哪种物理安全威胁的示例？\n\
  \nA. 人为威胁\nB. 自然威胁\nC. 环境威胁\nD. 供应系统威胁\n\n## 11. CISO 决定对一台笔记本电脑进行法医调查，以查看是否存储了明文客户数据。以下哪项最能描述如何分析数据？\n\
  \nA. 为了保护笔记本硬盘上的证据，对其进行数字复制，并分析复制后的数据\nB. 重启系统以清除任何脚本或恶意软件\nC. 直接在笔记本硬盘上分析数据，因为复制数据可能会导致数据更改\n\
  D. 通过对笔记本电脑和硬盘贴标签来维护监管链\n\n## 12. 一家医疗保健机构的 CISO 正在审查组织的策略和程序以确保它们符合 HIPAA。这是哪种安全评估的示例？\n\
  \nA. 合规性评估\nB. 应用安全评估\nC. 漏洞评估\nD. 渗透测试\n\n## 13. CISO 与 BCP 协调员合作为组织执行业务影响分析。他们必须确定资源在影响关键功能或流程之前可以不可的最长时间。以下哪个术语最能代表这一点？\n\
  \nA. 最大可接受机时间 (MTD)\nB. 恢复点目标 (RPO)\nC. 恢复边界目标 (RDO)\nD. 业务影响分析 (BIA)\n\n## 答案\n\
  \n**1. A.** 会复制自身并发送到其他计算机计算机病毒被称为蠕虫。问题中列出的其他恶意软件具有其他特征：木马伪装成其他程序，僵尸网络受网络犯罪分子控制的感染系统网络，勒索软件是网络犯罪分子试图向受害者索赎金的攻击类型。\n\
  \n**2. B.** 培训、观察和阅读都有帮助，但实践和演练能提供强化知识，帮助人们为在特定情况下如何行动做好准备。\n\n**3. C.** 网络访问控制（`NAC`）是一种集成方法，允许定义特定的策略来管理网络访问需求。例如，`NAC`\
  \ 策略可能不允许不符合特定安全要求（如安装了防病毒软件）的网络设备接入。\n\n**4. D.** 擦除不是安全的数据删除方法。当发出擦除命令时，驱动器上的数据存储位置被标记为可用，但在后续操作覆盖它之前，数据仍然介质上。\n\
  \n**5. C.** 基于属性的访问控制（`ABAC`）基于定义的策略，这些策略指定了哪些主体可以访问某些对象以及如何访问，这取决于访问的具体对象和其他环境条件（如时间和位置）。集中式访问控制是访问控制管理的一种，而不是访问控制模型。强制性访问控制（`MAC`）决策基于主体的许可和对象的分类。基于角色的访问控制（`RBAC`）中，用户的访问基于其在组织中的角色。\n\
  \n**6. C.** 执行入侵检测系统（`IDS`）调优是为了达到最佳的检测和报告水平。\n\n**7. D.** 对称加密的缺点之一是在用户众多时扩展性不佳。这是使用加密系统的主要原因之一，加密系统使用对称密钥进行加密并结合非对称加密。\n\
  \n**8. C.** 软件即服务（`SaaS`）提供给客户作为服务的成品产品，例如云端电子邮件。所有基础设施、操作系统、数据库等的维护均由提供商处理。身份即服务（`IDaaS`）是一种提供一组身份和访问管理功能的云服务，是主要的服务模型之一。平台即服务（`PaaS`）是云计算的一种形式，允许客户管理应用程序而无需在公司内部管理基础设施。基础设施即服务（`IaaS`）是提供虚拟化资源的云计算形式。\n\
  \n**9. C.** 所有开发的应用程序在部署之前都应该同时经过静态测试和动态测试。\n\n**10. A.** 不满的员工闯入组织盗取关键数据是人为威胁的示例。\n\
  \n**11. A.** 对数据进行数字复制并进行分析。不要重启可疑设备，因为重启会以某种方式更改存储介质上的数据。永远不要直接在可疑介质上进行分析。虽然给笔记本电脑和硬盘标签是一个好主意，但它不是关于如何分析数据的最佳答案。\n\
  \n**12. A.** 审查组织的策略和程序以确保符合《健康保险流通与责任法》（`HIPAA`）等监管驱动因素，是合规性评估的示例。\n\n**13. A.**\
  \ 最大可接受机时间（MTD）是指资源在影响关键功能或流程之前可以不可的最长时间。\n\n\n\n\n\n前面的章节讨论了作为组织信息安全计划的一部分可以开展的各种活动。这些活动包括工作流（或子程序）、安全项目，以及应对威胁、外部和内部驱动因素以及合规性要求的内核能力。但是，组织如何知道该做什么、何时做、投入多少资源以及哪些是优先事项呢？这些决策中的一些可以由第\
  \ 1 章中讨论的风险管理活动中的风险分析部分提供帮助。但风险分析只是解决方案的一部分，因为它只针对特定资产，而不涉及组织的业务战略。为了确定如何执行安全计划、优先考虑安全活动并并为实现安全目标建立路线图，`strategic\
  \ planning`（战略规划）是一个非常有用的工具。\n\n战略规划帮助组织理解什么是最重要的，从而决定在何时做什么以及投入什么资源。你不能试图`boil\
  \ the ocean`（大海捞针），所以必须确定优先顺序。组织的文化和工作氛围应该被塑造为领导层希望的样子，而不能听天由。这些问题通过一个构思巧妙且执行良好的战略计划来解决。\n\
  \n整个组织的战略规划由组织的领导层执行。首席信息安全官（CISO）很有可能是创建组织战略计划团队的成员。`Security strategic planning`（安全战略规划）是组织战略规划的子集。\n\
  \n本节讨论了以下主题：\n\n• 组织战略规划\n• 组织战略规划团队\n• 战略规划流程\n• 安全战略计划示例\n\n## 组织战略规划\n\n组织战略计划是一个描述`战略是什么`并制定出`如何实施它`之计划的计划。战略通常通过定义在特定时间范围内要实现的目标来表达。实施方案通常通过列出组织为实现每个目标将采取的行动来表达。当然，这只是战略计划的一种，但它是最常见的类型，也是我们在本书中讨论的方法。\n\
  \n战略规划首先涉及定义组织的战略。通常，组织使用愿景和/或使命陈述在非常高的水平上定义战略，这些陈述描述了组织希望成为的样子，以及战略目标，有时还会识别组织希望传达的核心价值观。然后，对于每个目标，组织都会制定一个实现该目标的计划，有时会定义如何提供资金、何时完成工作，以及如何衡量和判定成功。图\
  \ 5-1 展示了一个战略规划模板，显示了计划中的各种元素。\n\n对于遵循图 5-1 所示方法的组织，战略规划按以下方式进行：\n\n![Images](img/p299.jpg)\n\
  \n**图 5-1** 典型的战略规划模板\n\n**1.** 创建愿景陈述。\n**2.** 创建使命陈述。\n**3.** 定义价值观。\n**4.** 创建可衡量的目标和任务。\n\
  **5.** 创建实现每个目标的行动。\n**6.** 执行行动并衡量进度。\n**7.** 维护并更新计划。\n\n#### 创建愿景陈述\n\n组织创建愿景陈述是为了向他人传达组织如何看待自己，以及它希望世界如何看待它。愿景陈述可以是远见的、充满抱负的、有时是乌托邦的，甚至是浪漫的。以下是几个愿景陈述示例：\n\
  \n• 电信公司：“每个桌子上和每个口袋里手机。”\n• 艺术用品公司：“为各地的艺术家提供启发并支持。”\n• 在线零售商：“成为访问量最大且利润在线购物网站。”\n\
  • 烹饪学校：“我们的愿景是在美洲提供最好的烹饪教育。”\n\n有些人使用愿景陈述来描述组织的未来状态，而他们使用使命陈述来描述现状。这两类陈述都向员工和客户描述了组织的目的。\n\
  \n#### 创建使命陈述\n\n如果说愿景陈述是一条激励性的信息，那么使命陈述则定义了组织是什么、为什么存在，以及它为谁解决了什么问题。使命陈述为组织希望实现的特定目标奠定了基础。前一节列出的虚拟公司可能具有以下使命陈述：\n\
  \n• 电信公司：“通过提供创新的产品和服务连接人们和企业。”\n• 艺术用品公司：“我们为艺术家和手工艺者提供他们所需的工具，以创作出经久的作品。”\n• 在线零售商：“使用加密货币促进、支持和创新在线零售。”\n\
  • 烹饪学校：“提供协作学习产品，让餐厅人员通过与他人合作体验成功。”\n\n通过对这些使命陈述和相应的愿景陈述进行检查，可以看出使命陈述是如何揭示每个组织的战略的。电信公司将自己视为产品和服务的创新者。艺术用品公司不仅为艺术家制造工具，还为手工艺者制造工具，这些工具专门支持创作持久的作品。在线零售商专注于加密货币。烹饪学校提供的学习产品允许学生工作。\n\
  \n#### 定义核心价值观\n\n核心价值观是组织希望培养和促进的员工特征。组织希望拥有什么的人？领导者还是跟随者？创新者还是模仿者？外向者还是内向者？个人诚信重要吗？组织可以通过定义它想要的核心价值观，然后实施招聘、聘用和培养这类人员和行为的计划来创建并塑造其文化和工作场所。相反，如果组织没有明确定义和传达其核心价值观，那么组织拥有的人员以及产生的工作场所文化将听天。\n\
  \n以下是一个软件工程公司可能找到的核心价值观列表：\n\n• 动力（Drive）\n• 创造力（Creativity）\n• 好奇心（Curiosity）\n\
  • 诚信（Integrity）\n• 适应能力（Adaptability）\n• 谦虚（Humility）\n• 责任感（Accountability）\n\n\
  在某些战略计划中，核心价值观通过对每个值的详细描述得到进一步定义。然后，核心价值观贯穿整个组织，驱动人力资源政策、招聘决策、职业阶梯、职位描述、绩效评估、工作场所文化、员工奖励计划乃至员工聚会和社交活动的性质等事务。\n\
  \n\n\n\n战略计划通常是为了涵盖特定的时期而创建。大多数战略计划涵盖三到五年的期限。短于三年的时期往往缺乏足够的前瞻性，而超过五年的时期可能不切实际，因为事物（政治环境、技术、法律等）会发生变化。对于所涉及的时期，战略计划规定了目标。正是这些目标通过表达最重要的内容，定义了组织的方向。通常情况下，组织会定义若干目标。目标太少可能缺乏足够的清晰度来界定方向；目标过多则可能稀释最重要的内容。\n\
  \n例如，在前几节中介绍的假设电信产品公司可能将其三年目标设定如下：\n\n• `Goal #1`: 开发智能手机产品线\n• `Goal #2`: 创建每年制造\
  \ 100 万部手机的能力\n• `Goal #3`: 成为智能手机生物识别领域公认的全球领导者\n• `Goal #4`: 实现 100% 用户自服务\n\n\
  这家公司想做什么以及认为什么重要是非常相当清楚的。它为想要设计的内容（`#1`）、制造能力（`#2`）、创新和市场开发（`#3`）以及如何向客户提供支持（`#4`）定义了目标。有时，未列出的目标与列出的目标同样重要。请注意，其中没有关于效率或节约成本的目标。显然，领导层认为在公司生命周期的这一时期，效率和节约成本并不那么重要。\n\
  \n每个目标必须是必要的、可实现的且可验证的：\n\n• `Necessary`（必要性）：如果一个目标对组织来说不是必要的，它就不应该被定义为目标。目标应该是对组织成功至关的事情。\n\
  • `Attainable`（可实现性）：组织应该对目标的实现有合理的预期，尽管许多时候目标具有愿景性，即相信组织有能力实现目标，尽管具体的实现手段尚未建立。目标可以非常雄心勃勃，但仍然可以被认为是可实现的。\n\
  • `Verifiable`（可验证性）：目标的定义应当有一种方法来衡量每个目标是否已经实现，以及取得了哪些进展。\n\n### 创建行动以实现每个目标\n\n\
  通常，目标通过子目标或任务进一步定义。例如，为了实现电信公司的 `Goal #1, 开发智能手机产品线`，团队将定义需要满足的任务，如下所示：\n\n• 进行市场分析\n\
  • 开发需求\n• 创建最小可行性产品\n• 创建并发布商业产品\n\n每个任务随后都可以进行计划，并定义：\n\n• 需要做什么\n• 需要哪些资源\n• 需要花费多少资金\n\
  • 预期结果是什么\n• 如何监控进展\n• 如何衡量任务的成功与\n\n在完成每个目标的这一步骤后，组织已经定义了其愿景、使命和价值观，定义了实现这些内容的目标，并创建了完成满足每个目标所需的各项活动的计划。下一步是将计划付诸行动。\n\
  \n### 实施行动并衡量进展\n\n这些任务本质上是各个小组和部门履行其职责的指令。理想情况下，战略计划是由一个由组织所有主要部门领导者组成的团队开发的。例如，如果战略计划中定义了制造任务，那么这些任务应该在制造负责人的参与下制定。关键领导者的参与有助于确保计划各个部分以及计划整体的可实现性和可行性。\n\
  \n战略计划的实施由组织的领导层管理，通常由 `CEO`、`COO`、总经理或总裁负责。计划的实施遵循 `Chapter 3` 中讨论过的程序和项目管理通用原则。\n\
  \n### 维护和更新计划\n\n组织创建战略计划后，应该按照定期计划更新计划，但计划也可能由于外部或内部事件而需要更新或更改。\n\n最常见的是战略计划是在组织成立时创建的，然后定期更新。如果战略计划涵盖五年的期限，组织应该在五年结束时准备好另一个计划以实施。然而，大多数组织不会等到五年结束才更新计划。更多情况下，组织每年都会重新审计划，并根据实际发生的事件和业务正在经历的变化对其进行修改。敏捷型组织能够坚持计划的主题，但在执行过程中适应现实世界的因素。\n\
  \n偶尔，或者对于某些组织来说经常如此，由于外部或内部事件，战略计划需要更新。可能导致战略计划重大重写的外部因素包括：影响业务的新法律或法规、竞争对手创新或产品的出现、技术或制造领域的新进展，甚至是社会、经济或政治变化（如大流行）。可能促使组织更改计划的内部因素包括：关键项目的成本或进度超支、收购与合并、内部重组以及新技术和方法的内部开发。\n\
  \n当然，新威胁的出现也可能导致组织改变战略计划，为了保护业务免受威胁，或者提供服务或产品来缓解这些威胁。\n\n## 组织战略规划团队\n\n组织战略计划的制定通常由\
  \ `CEO` 领导的团队执行。工作在几周或几个月内进行，通过一系列协作脑风暴会议完成，涉及整个团队或分支工作部分计划的小组。团队的组成非常重要。在团队中拥有正确的人对于创建一个真实反映集体战略并包含必要、可实现且可验证目标的计划至关重要。最好的团队由整个组织的代表组成，包括以下成员：\n\
  \n• `CEO`：当 `CEO` 规划团队的领导时，会创建最好的战略计划，因为根据定义，`CEO` 对组织的成功负责。然而，许多时候工作由 `战略规划经理`\
  \ 领导或委托给他们，他们协助 `CEO` 进行协调和战术活动，推动流程并确保其成功完成。\n• `其他 C 级领导`：组织所有的 C 级官员都应该参与，因为每个人在计划中都有相应的责任领域，并且都对执行针对任务的行动做出贡献。例如，由于所有活动都包含财务因素，`CFO`\
  \ 应该参与计划的创建。\n• `关键经理、主管和员工`：每个组织都有一些不是 C 级高管、但由于他们的经验、洞察力和才华而应该被纳入战略规划计划的骨干。\n\
  • `专家和利益相关者`：外部顾问、领域专家、顾问或董事会成员经常参与战略规划，因为他们可以提供特殊的见解、经验或专业知识。\n\n\n\n\n\n- **外部促引导者**：组织经常会引入专门从事战略规划的顾问或公司来指导他们完成这一过程。这些公司可以提供价值，但像任何顾问一样，应该根据强大的背景证明和推荐来选择他们。作为安全顾问，我们见过许多组织由于外部促引导者不力而浪费了时间和精力，最终只得到了一个令人失望的战略计划。\n\
  \n作为 C 级高管，首席信息安全官（CISO）可能与其他领导者一起参与组织的战略规划。CISO 应该从以下几个维度来处理这一角色：\n\n- **愿景和使命声明**：愿景和使命声明不仅仅是供\
  \ CEO、CMO 和 COO（首席运营官）定义的。是否有一个安全视角的维度应该成为组织顶层视角的一部分？以之前讨论的电信公司为例，让客户知道他们的通信是私且安全的难道重要吗？CISO\
  \ 应该将安全、隐私和保障纳入对组织何正确的愿景和使命的讨论中。\n\n- **核心价值观**：由于核心价值观塑造了职场文化和员工的特质，CISO 在定义这些价值观时应该有发言权。CISO\
  \ 希望在安全团队中看到的核心价值观是什么？可能更重要的是，哪些核心价值观可以让全体员工更具安全意识，能够更好地防御社会工程攻击，并能更好地与组织的其他部分就安全倡议进行协作？\n\
  \n- **目标、目的和行动计划**：可能存在直接影响安全的组织目标。例如，许多组织将合规 `HIPAA`、`SOX` 或 `PCI DSS` 等法规视为其主要组织目标之一，如果合规对于业务的成功至关重要。CISO\
  \ 帮助形成这种定义。但即使安全不是主要目标之一，它可能与某些目标和行动计划相关。正如 `第 4 章` 所述，安全应该构建到系统/软件工程过程中，也必须构建到组织的所有运营中。因此，建立目标、目的和行动计划是定义安全战略计划的第一步，该计划在本节稍后部分描述。\n\
  \n### 战略规划过程\n\n创建战略计划的过程非常像一次脑风暴活动。大多数组织都有自己进行脑风暴活动的方法。在 `第 1 章` 中介绍的围绕风险分析（`SWIFT`、`Delphi`、`bowtie`、`decision\
  \ tree`）的脑风暴方法可以适用于战略规划。此外，我们见过组织使用 `IDEO (www.ideo.com)` 设计思维方法进行战略规划并取得了巨大成功。我们不规定或认可任何特定流程，但我们建议该过程应该包含以下基本要素：\n\
  \n- **让合适的人聚在房间里**：组织是否有人是公司的“抱怨者”？将他们纳为参与者可能是一个好主意，让他们成为解决方案的一部分，而不仅仅是抱怨。事实是，战略计划的质量完全取决于创建它的人。让所有合适的人聚在房间里。不仅应该有关键经理，还应该有对业务提供真实洞察的关键员工。\n\
  \n- **选择成熟的模型和促引导者**：战略规划团队在制定计划时，不应该浪费时间去摸索规划流程。这就是为什么使用拥有经过验证的可靠流程的促引导者是有益的。促引导者通常拥有被证明有效的支持模板。外部促引导者也可以非常棒——只需检查他们的背景即可。\n\
  \n- **制定时间表并坚持**：战略规划过程非常耗时，而且可能是一项苦差。我们见过团队因为所需时间过长而失去动力和焦点，这会干扰团队成员的日常工作职责。规划过程必须通过纪律进行管理。定义时间表并坚持执行。时间表草率的团队通常会产生草率的计划。\n\
  \n## 安全战略计划示例\n\n战略规划是定义复杂组织方向的极佳方法。大型组织内部的各个小组也能从此类计划中受益。CISO 不仅可能是组织战略规划的参与者，还可能为信息安全制定战略计划。许多安全组织或部门都有自己的信息安全战略计划。之前讨论的用于组织战略规划的所有特性和活动都适用于信息安全战略规划：\n\
  \n1. 创建愿景声明。\n2. 创建使命声明。\n3. 定义核心价值观。\n4. 创建可衡量的目标和目的。\n5. 创建实现每个目标的行动。\n6. 执行行动并衡量进展。\n\
  7. 维护并更新计划。\n\n为了说明，假设一家虚拟电信公司制定了一个为期三年的信息安全战略计划。以下是该三年期内的目标、目的和行动计划示例：\n\n1. **身份：将生物识别技术纳入智能手机产品**\n\
  - 选择核心技术\n- 进行研究\n- 构建评估实验室\n- 进行权衡分析\n- 开发能力\n- 构建并评估最小可行性产品 (MVP)\n- 转化为产品\n-\
  \ 持续支持\n- 进行可用性测试\n- 选择可用性合作伙伴/供应商\n- 执行测试并将结果整合到产品\n\n2. **人员配备：确保安全团队拥有足够的知识、技能和能力**\n\
  - 开发并实施招聘方法\n- 招聘安全招聘经理\n- 开发招聘流程和程序\n- 开发并实施职业升梯\n- 聘请职业升梯咨询公司\n- 组成职业升梯团队\n- 为员工提供安全培训\n\
  - 开发内部安全基础和安全运营课程\n- 部署学习管理系统\n- 持续的员工培训、测试和改进\n\n3. **影响领导：加强领导层做出安全决策的能力**\n-\
  \ 与公司领导层共享威胁信息\n- 选择威胁源\n- 为领导层构建并部署威胁馈\n- 与公司领导层协作\n- 建立内部安全领导力中心\n- 提供持续指导\n-\
  \ 支持提升安全意识的计划\n\n对于每个行动，CISO 和安全团队可以定义可衡量的目标，用于监控和跟踪绩效及成功。此外，可以对每个行动进行范围界定以确定所需的资源。资源估算包括人员、硬件、软件和待采购的外部服务。然后，可以准备成本估算以建立支持这些活动的预算。\n\
  \n### 做出安全决策\n\n\n\n\n\n战略规划使首席信息安全官（CISO）能够根据业务目标做出安全决策。然而，安全计划的其他功能可能并非由组织的战略目标驱动（例如，组织制造流程的某些方面对安全很重要，但未反映在战略计划中）。为了做出明智的决策，CISO\
  \ 必须遵循一套流程，将组织的业务目标与安全决策建立联系。这种联系通常通过解读`security business drivers`来来实现。\n\n理解、解读和翻译`security\
  \ business drivers` 使得 CISO 能够就安全计划的各个方面做出重要决策，包括：\n\n* 安全目标、目的和计划\n* 安全策略、标准、程序和指南\n\
  * 安全架构（包括人员、流程和技术）\n* 安全控制\n\n`security business drivers` 是指对安全产生影响的业务特征。CISO 用于将`security\
  \ business drivers` 翻译为安全计划实施的过程取决于具体的组织。这些方法多种多样，从更具谈话性或基于直觉的非正式方法，到利用框架或流程的正规方法不等。\n\
  \n有些组织使用基于非正式评估或其“直觉”的`informal approach`。这些活动可能只是随意的交谈或信息会议，并且可能不会显示决策如何形成的特定产物。决策也可能表现为高层管理人员关于优先考虑或关注什么的强制指令或指示。CISO\
  \ 还可能对组织进行非正式评估，考虑不同的组织视角，如合规或财务。\n\n其他组织则遵循使用正式流程、行业框架或模型、风险管理练习或企业架构模型的`structured\
  \ approach`。这些严谨的流程通常会产生用于证明关键决策合理性的产物，例如风险评估文档、电子表格、架构图和其他文档。这些产物可以用来证明 CISO 履行了尽职调查。\n\
  \n## 企业架构\n\n将`security business drivers` 翻译为安全决策的一种方法是遵循某个框架来生成企业信息安全架构（EISA）。`Enterprise\
  \ architecture`（`EA`，企业架构）是对企业架构进行绘图化和记录的实践，以帮助决策者将组织的战略围绕业务的人员、流程和技术进行齐。EISA 简单地将\
  \ `EA` 方法应用于安全计划。CISO 可以使用 `EA` 模型来拆分并记录信息安全计划架构，并说明它如何从高层的`business architecture`\
  \ 视角（如组织架构图）到低层的`technical architecture` 过程（如数据流图或网络架构图）相关。目标是确保这些组件（如安全软件、硬件、解决方案、技术、项目、流程和操作）与组织的企业架构、战略和业务驱动对齐并集成。这允许围绕解决方案和技术进行主动决策，以实现效率和对齐。\n\
  \n组织的企业架构通常可以分为子架构，如业务、信息、应用和技术架构，信息安全组件和影响贯穿这些层级，如图图 5-2\n\n**图 5-2** 通用企业架构层\n\
  \n* **Business architecture** 组织的业务战略、目标、治理和目的，驱动了信息架构。\n* **Information architecture**\
  \ 也称为数据架构，描述了组织信息资产的结构、流程和存储架构。这一层的需求规定了应用架构。\n* **Application architecture** 也称为信息系统架构，提供了业务应用程序和服务的的设计。这些由技术架构支持。\n\
  * **Technical architecture** IT 基础设施，如硬件、软件和网络，支持业务应用程序和服务。\n\n实施 `EA` 的方法有很多，组织可以利用诸如标准框架，如\
  \ Zachman 框架、联邦企业架构框架 (FEAF)、Sherwood 应用业务安全架构 (SABSA) 和开放组架构体系框架 (TOGAF)。\n\n###\
  \ Zachman\n\n`Zachman Framework`（扎克曼框架）是一个由 John Zachman 开发的用于开发企业架构的模型。它并不是一种方法论，因为它没有规定要使用的特定流程。相反，它提供了一个模式，可以通过创建特定的产物（如清单、设计文档、流程列表、数据流图和其他文档），围绕特定的功能、元素和过程来定义和记录组织的企业架构。\n\
  \n该模型由分类名称的矩阵（`What`、`How`、`Where`、`Who`、`When` 和 `Why`）与受众视角（`Executive`、`Business\
  \ Management`、`Architect`、`Engineer`、`Technician` 和 `Enterprise`）交叉组成。这允许通过回答分类名称中列出的问题，对组织不同的企业视角和观点进行记录和整合。例如，执行团队（业务背景）对企业的看法将与技术人员（业务组件实施者）不同。记录这些视角有助于实现企业架构的集成和整体方法。框架的简化示例见表\
  \ 5-1。记住，`EA` 本质上是一项对企业架构进行记录和绘图的练习。表 5-1 中的 `Zachman` 模式本质上是所有应该记录或绘图的产物列表，以及它们如何与企业架构的各种视角相关。\n\
  \n![Images](img/p310.jpg)\n\n**表 5-1** Zachman 框架示例\n\n虽然 `Zachman Framework` 并不是专门为信息安全构建的，但这些问题大部分都有潜在的安全含义。此外，它是一个通用模型，可以应用并定制到许多类型的企业架构，包括\
  \ EISA。\n\n### FEAF\n\n`Federal Enterprise Architecture Framework (FEAF)`（联邦企业架构框架）是由联邦\
  \ CIO 委员会开发的企业架构框架，以响应 1996 年《林林-柯法案》的要求，该法要求美国政府部门开发和维护企业架构框架。其目标是帮助联邦机构利用通用语言分析其企业架构投资，并识别“良好”的标准。该框架由六个参考模型组成，如图\
  \ 5-3 中的 FEAF 版本 2 合并参考模型（CRM）所示，描述了这些架构领域：\n\n![Images](img/F05-03.jpg)\n\n**图\
  \ 5-3** 联邦企业架构框架版本 2 合并参考模型\n\n（来源：[`obamawhitehouse.archives.gov/sites/default/files/omb/assets/egov_docs/fea_v2.pdf`](https://obamawhitehouse.archives.gov/sites/default/files/omb/assets/egov_docs/fea_v2.pdf)）\n\
  \n* Performance\n* Business\n* Data\n* Application\n* Infrastructure\n\n\n\n\n\n\
  # 安全\n\n与本节之前讨论的架构层（业务、信息、应用和技术层）类似，FEAF 的每一层都对下一层进行驱动并规定要求，且贯穿始终的安全影响（用安全参考模型表示）。\n\
  \n## SABSA\n\n`Sherwood Applied Business Security Architecture (SABSA)` 业务安全架构框架是一个用于开发企业信息安全架构的模型和方法论。在架构模型结构上（如表\
  \ 5-1 所示），它与 `Zachman Framework` ，但 `SABSA` 也是一种方法论，意味着它包含了构建和维护 `EISA` 的过程生命周期指导。`SABSA`\
  \ 框架将概念和需求从高层（`Contextual` 背景）分解到低层技术和应用（`Component` 组件），并叠加了 `Management` 管理架构。其目标是消除抽象，增加细粒度定义，并在其他架构层次的概念的基础上进行构建。\n\
  \n## TOGAF\n\nOpen Group 架构框架 (`TOGAF`) 是一种基于美国国防部信息管理技术架构框架 (`TAFIM`) 的企业架构框架。`TOGAF`\
  \ 提供了一套过程生命周期方法论，使用 `TOGAF Architecture Development Method (ADM)` 对企业架构进行设计、实施和治理。图\
  \ 5-4 提供了一个基于 `TOGAF ADM` 的架构开发周期图。该过程是一个迭代过程，侧重于需求和目标。这一点通过生命周期每个阶段都包含需求和目标检查显而易见。\n\
  \n![Images](img/F05-04R.jpg)\n\n**图 5-4** 架构开发周期示例\n\n## 架构成熟度模型：能力成熟模型集成\n\n能力成熟模型集成\
  \ (`CMMI`) 是源自工程领域的一个过程改进概念，由一系列技术组成，作为框架允许对组织过程和实践进行受控的增量改进。`CMMI` 由 `卡内基梅隆大学软件工程学院\
  \ (SEI)` 开发，是 `能力成熟模型 (CMM)` 的升级版本。`CMMI` 最初旨在用于完善软件开发过程，但已被用于许多不同的用途，包括衡量和完善企业架构、系统工程、安全计划、控制、风险管理（如第\
  \ 1 章 中讨论）以及其他组织过程开发实践。\n\n`CMMI` 提出了五个成熟度水平（`Initial` 初始、`Managed/Repeatable` 管理/可重复、`Defined`\
  \ 定义、`Quantitatively Managed` 量化管理和 `Optimizing` 优化），它们代表了过程性能的不同演进阶段。这些级别的分类取决于组织过程的成熟度及其质量保证实践。组织可以使用\
  \ `CMMI` 开发出如何从一个成熟水平演进到下一个标准的结构化步骤，这在图 5-5 中所示。\n\n`Initial` 水平（`CMM Level 1`）的过程是反应性的、无组织且混乱的。在该水平上，预计过程只能通过个人的非凡表现才能生存。这使得过程环境更加不稳定。成功在该水平上不太可能重复。\n\
  \n`Managed` 水平（`CMMI Level 2`），也被称为 `Repeatable`，过程是按照计划执行的以确保成功是可以重复的。然而，尚未定义正式的过程模型。\n\
  \n`Defined` 水平（`CMMI Level 3`）的基础是组织能够产生或采用标准和过程。这种标准化在关注过程定义之后才可能实现。\n\n`Quantitatively\
  \ Managed` 水平（`CMMI Level 4`），组织能够监控和控制自己的过程。这一水平允许管理层指出调整过程的方法，防止出现重大的质量损失或偏离规范。这是通过数据驱动的过程管理和改进实现的。\n\
  \n`Optimizing level` 水（`CMMI Level 5`），组织专注于通过优化持续改进过程性能。过程改进被衡量和评估。持续的过程改进是该水平的核心目标，允许灵活性和创新。\n\
  \n![Images](img/F05-05.jpg)\n\n**图 5-5** CMMI\n\n## 财务管理\n\nCISO 是业务领导者，任何业务成功的计分都是金钱。这就是为什么\
  \ `CISO` 不仅应该具备良好的领导和技术技能，还应该对业务会计和财务基础有坚实的掌握。`CISO` 需要能够与组织的所有其他领导者用财务语言交流。每个 `CISO`\
  \ 都应该知道如何阅读资产负债表和利润表，并掌握资本支出和运营支出等关键概念。此外，`CISO` 必须能够管理安全部门的财务，其年度预算可能达到千万美元或更多。本节介绍了与\
  \ `CISO` 相关的财务管理概念和术语概述：\n\n- 会计与财务基础：\n- 会计系统\n- 关键概念和术语\n- 利润表\n- 资产负债表\n- 资本支出和运营支出\n\
  - 会计周期\n- 信息安全年度预算\n\n## 会计与财务基础\n\n组织的安全功能是一项财务投资。投入在安全的每一美元都应该由 `CISO` 向组织的其他部分给出合理理由。`CISO`\
  \ 必须和其他其他 C 级领导一起为组织的财务成功做出贡献。正如 `CIO` 必须证明 IT 支出为组织带来了价值一样，`CISO` 也必须能够证明安全投资的价值。本节探讨了会计系统、交易和财务报告的概念，所有这些都为\
  \ `CISO` 的财务理解奠定了基础。\n\n### 会计系统\n\n会计系统是组织用于收集、存储和处理财务信息的资源和业务流程集合。组织会计系统通常包括与遵循公认会计原则\
  \ (`GAAP`) 的会计政策和程序配合使用的数据处理系统。`GAAP` 由财务会计准则委员会 (`FASB`) 开发，并制定了会计实践的标准。在国际上，国际财务报告准则\
  \ (`IFRS`) 自 2001 年起一直实施。`IFRS` 在全球 110 多个国家广泛使用。然而，讨论的重点是在美国应用的 `GAAP`。\n\n美国 `GAAP`\
  \ 包含十项核心原则：\n\n1. **常规性原则 (Principle of Regularity)**：会计师应定期遵守 `GAAP` 并将其视为标准的概念。\n\
  2. **一致性原则 (Principle of Consistency)**：这一原则是在整个报告过程中一致地应用相同的标准。这确保了报告从一个时期到另一个时期保持一致。\n\
  3. **诚实原则 (Principle of Sincerity)**：这一原则要求会计师追求准确和公正。\n4. **方法持久性 (Principle of\
  \ Permanence of Methods)**：与一致性原则类似，该原则旨在确保整个过程中一致使用程序。\n5. **无补偿原则 (Principle of\
  \ Non-Compensation)**：财务报告应在不考虑补偿的情况下准确报告。换句话说，会计师不应期望通过提供更准确的报告获得更多报酬。\n\n\n\n\n\
  \n### 6. 谨慎原则\n这是报告应当具有保守性的概念。例如，收入应基于事实，而非推测。收入不应夸大，费用不应低估。\n\n### 7. 持续经营原则\n\
  这是业务将继续运营的概念。在考虑资产价值时，这一点非常重要。如果业务将不再持续，可能意味着某些资产将没有价值；如果它们在未来没有价值，那么它们现在就不应具有价值。因此，在所有报告中都应假设业务具有持续性。\n\
  \n### 8. 期间性原则\n这是分录项应分配或分布到适当的时间段的概念。例如，如果销售发生在 6 月，则该收入应记录在 6 月，而不是 7 月。\n\n###\
  \ 9. 重要性原则\n会计师应努力准确地呈现`相关`的财务信息。\n\n### 10. 诚实信用原则\n源自拉丁语词“Uberrimae Fidei”，这意味着企业在所有交易中都应当诚实。\n\
  \n## 核心概念与术语\n\n每个 CISO（首席信息安全官）都应该了解几个关键会计术语和概念。第一个是 `accounts`（账户）的概念。账户是用于分类和存储交易数据的记录。每家企业都有一份\
  \ `chart of accounts`（会计科目表），这是一份用于存储资产、负债、收入、费用和所有权的账户列表。通过 `transactions`（交易）对账户进行借贷记账，这些交易记录在会计系统的\
  \ `general ledger`（总账）中。\n\n另一个核心概念是 `reporting`（报告）。报告是会计的沟通方面。它涉及向利益方传达业务信息。以下是组织财务报表中存在的两种主要报告形式：\n\
  \n* **Income statement (损益表)**：损益表（也称为利润表，或 P&L 表）是组织在一段时间内`财务活动`的总结。它列出了所有交易，包括收入、费用以及报告期间的任何利润或亏损。\n\
  * **Balance sheet (资产负债表)**：资产负债表是组织在特定时间`财务状况`的快照。它列出了组织资产的价值（所拥有的）、负债的价值（所欠）以及其价值（资产与负债之间的差额）。\n\
  \n## 损益表\n\n损益表通常包含两个部分：\n\n* **Income (收入)**：为了提供货物或服务而向客户开具账单的销售金额\n* **Expenses\
  \ (费用)**：组织为资产或服务所承担的成本\n\n图 5-6 显示了一个简单损益表的示例。\n\n![Images](img/p317.jpg)\n\n**图\
  \ 5-6** 损益表示例\n\n在图 5-6 的示例中，该组织在 `#1` 月有 4300 万美元的收入，主要由产品销售、服务和特许权组成。该组织还有未分类收入，即不属于其他类别（或尚未确定类别）但仍可以被确认的收入。\n\
  \n`Cost of goods`（商品成本，或 `cost of goods sold` 销货成本）指的是与货物销售（或产生收入）直接相关的劳动力、材料或其他项目的成本。例如，如果公司制造并销售小部件，则销售小部件的收入归类为收入，而制造小部件的成本归类为商品成本。从收入中减去商品成本即可得出组织销售的`gross\
  \ margin`（毛利，或 `gross profit`）。这是公司在考虑公司运营成本之前，通过销售小部件赚取的金额。在示例中，该组织在 `#1` 月的毛利为\
  \ 35%（通过毛利除以收入计算），这与典型公司的运营情况大致相当。\n\n示例损益表上显示的费用是运营组织所承担的商品以外的成本。费用可能包括租金、支付给管理人员（管理、行政、会计和执行人员）的工资、法律费用等。从毛利中减去费用即可获得组织的净收入或利润。\n\
  \n## 资产负债表\n\n资产负债表通常包含三个部分，报告组织截至特定日期的财务状况，通常是会计期间的末：\n\n* **Assets (资产)**：组织拥有的有价值物品。资产示例包括现金、`accounts\
  \ receivable`（应收账款）、设备和家具。\n* **Liabilities (负债)**：组织欠其他企业或个人的。负债示例包括应付账款、应付工资税和应付贷款。\n\
  * **Equity (所有者权益)**：企业的净值。也称为 `owner’s equity`（所有者权益）或 `capital`（资本），所有权由投资者投入组织的现金加上尚未支付给所有者的净利润（称为\
  \ `retained earnings` 留存）组成。\n\n图 5-7 显示了一个简单资产负债表的示例。\n\n![Images](img/p320.jpg)\n\
  \n**图 5-7** 资产负债表示例\n\n资产负债表显示了会计期间结束时的组织净值。在这个示例中，对于截至 `#1` 月最后一日的期间，组织选择将资产分为\
  \ `current assets`（流动资产）和 `long-term assets`（长期资产，即组织拥有的价值），并对 `liabilities`（公司欠人的钱）做了同样处理。除了资产外，组织的价值还由\
  \ `equity`（权益）决定，即投入组织的资金量。权益由 `paid in capital`（实收资本，即股东、伙伴或其他投资者投入组织的金额）和 `retained\
  \ earnings`（留存，即尚未分配给投资者的净利润积累）组成。\n\n### 现金制与权责发生制\n\n根据销售或费用发生的时间，有两种记录交易的方法。`Cash\
  \ accounting`（现金制）在现金易手时确认销售或费用，而 `accrual accounting`（权责发生制）在收入实现或费用发生时确认销售和费用。\n\
  \n在权责发生制中，当完成工作或生成发票时，收入被视为已实现（无论何时从客户那里收到钱）。同样，当组织承诺支付这笔钱时（通常是在下订单或从供应商处收到发票时），费用被视为已发生。\n\
  \n权责发生制的优势在于，与现金制相比，它提供了组织财务绩效的真实反映。这是因为现金支付通常滞后于导致支付的事件。如果销商购买了库存并在 3 月售出，权责发生制允许公司在\
  \ 3 月同时确认销售和费用。如果组织使用现金制，销售和/或费用可能直到现金易手才被确认，这可能是几个月之后。因此，权责发生制能更真实反映 3 月财务绩效方面的实际发生情况。美国上市公司被证券交易委员会（SEC）要求使用权责发生制，大多数企业（公共私营）也是这样做。通常，只有较小的企业使用现金制。\n\
  \n## 资本支出与运营支出\n\n\n\n\n\n`Expenses`（支出）是组织花费的资金，可分为两类：`capital expenses`（资本支出）和`operational\
  \ expenses`（运营支出）。日常业务运营支出是运营支出（OPEX）。用于未来或长期收益的支出是资本支出（CAPEX）。从会计角度来看，每一类支出的处理方式不同。运营支出在发生时确认，而资本支出则通过称为\
  \ `depreciation`（折旧）的过程在一段时间内进行确认。\n\n### 运营支出\n运营支出发生在日常业务经营过程中。运营支出的示例包括软件许可费、办公用品、租金、保险、杂项设备、维修与维护以及法律服务。支出在发生之日进行确认，可采用权责发生制（在购买物品或执行服务时记录交易）或收付发生制（在现金交付之日记录交易）。\n\
  \n### 资本支出\n资本支出（或资本性支出）是组织对某些具有未来收益的物品进行的投资。资本支出的示例包括设备、设施、建筑、车辆、知识产权和其他资产。与在购买时一次性确认的运营支出不同，资本支出是在对应于物品使用寿命的时间范围内进行确认的。例如，一台机器的使用寿命可能为十年；因此，该物品的成本可以分摊到这十年期间。\n\
  \n随时间推移对资产价值价值（例如上段提到的机器）被称为 `depreciation`（折旧）。折旧的目的是使资产成本与其产生的收入相对齐。这被称为 `matching\
  \ principle of accounting`（会计配比原则）。例如，公司可能使用这台机器生产十年的货物。每年机器都会产生收入，因此，在购买时确认机器的所有购置成本是没有意义的。相反，成本被分摊到机器的使用寿命内。每个组织对不同类型资产的折旧方法都有一套阈值。CISO（首席信息安全官）应与\
  \ CFO（首席财务官）合作，确保安全资产得到妥善分类，并根据资产性质和任何适用的监管准则（如美国国税局规定）使用适当的资产寿命。\n\n### 折旧方法\n\
  计算和分配折旧额有多种方法，包括：\n\n- **直线法（Straight-line）**：将资产价值除以期间数（年或月），每个期间分配相同的金额。\n- **年数总和法（Sum\
  \ of years）**：由于某些资产在使用的早期几年价值更高，该方法允许早期的费用高于后期的费用。例如，如果一个资产的使用寿命为五年，则“年数总和”为 `5+4+3+2+1=15`。那么，每年的折旧额为：\n\
  \    - 第 1 年 = 资产价值的 `5/15`\n    - 第 2 年 = 资产价值的 `4/15`\n    - 第 3 年 = 资产价值的 `3/15`\n\
  \    - 第 4 年 = 资产价值的 `2/15`\n    - 第 5 年 = 资产价值的 `1/15`\n- **生产量法（Units of production）**：该方法允许组织根据资产的实际使用情况来调整折旧；例如，根据资产的使用小时或生产的产品数量。例如，假设一台价值为\
  \ `$10M` 的机器在其寿命内可以生产 100 万个小设备。这相当于每个小设备 `$10`（`10M ÷ 1M = 10`）。如果第一年该机器用于生产 50,000\
  \ 个小设备，则第一年的折旧额为 `50,000 × $10 = $500,000`。\n\n理解并帮助管理 OPEX 和 CAPEX 是 CISO 工作的重要组成部分。CISO\
  \ 应与 CFO 合作，确保为特定资产使用适当的折旧计划和方法。例如，如果一个新的 GRC 系统成本为 `$100,000`，预计使用寿命为十年，且在寿命结束时没有残值，CISO\
  \ 应确保 CFO 实施的折旧计划是适当的，并且 CISO 建立的预算考虑了资产的正确折旧。\n\n### 会计周期\n`accounting cycle`（会计周期）是财务/会计人员在实施财务管理时遵循的一种种工作流。该循环实现了创建、组织和记录组织财务交易的过程。会计周期跨越会计期间。`accounting\
  \ period`（会计期间）一词是指组织财务报表涵盖的任何时间段。通常组织会设定年度会计期间，这通常对应于组织的财年，并划分为更小的每月会计期间。以下是企业和其他组织使用的会计期间示例：\n\
  \n- 1 月 1 日至 12 月 31 日的历年\n- 公司财年，如 10 月 1 日至 9 月 30 日（这种方法在美国联邦政府机构或联邦承包公司可能常见）\n\
  - 连续的 52 周或 53 周期间\n- 与组织会计年度对齐的历月\n- 使用 4-4-5 周循环月份计划的财月（每个月在周的同一天开始和结束，持续四周或五周）\n\
  \n![Images](img/note.jpg)\n\n**注意**：使用 4-4-5 周历法会导致年底剩余几天。这些天将直接累加到财年的最后一周。\n\n\
  无论组织使用历月还是财月，每个月的会计周期都由相同的活动组成。图 5-8 是会计周期的插图。\n\n![Images](img/F05-08.jpg)\n\n\
  **图 5-8**: 会计周期\n\n典型会计周期的步骤描述：\n\n1. **交易（Transaction）**：财务交易是任何资金流入或或组织或账户之间的活动。\n\
  2. **记账分录（Journal entries）**：交易最初记录为记账分录。每个组织都有一个 `journal`（有时称为 `原始账`），它是财年或会计期间开始的所有交易顺序列表。\n\
  3. **总账（General ledger）**：交易随后过入总账，指明其所属的账户。账户维护在总账中，总账也称为 `最终账`。\n4. **试债表（Trial\
  \ balance）**：试债表是对所有借贷双方进行的检查，以确保它们平衡。它是确保日记和总账分录正确的准确性检查。\n5. **调整分录（Adjust entries）**：通常会计师在修改账目之前，会在工作表上进行调整并测试。\n\
  6. **调整后试债表（Adjust trial balance）**：在验证了工作表上的调整后，对总账进行最终调整，并创建一个借贷双方平衡的最终试债表。\n\n\
  \n\n\n\n## 8. 结账\n会计循环的最后一步是关闭会计期间的账目。一旦期间关闭，就无法进行适用于该期间的任何分录。任何调整或更正必须在后续期间进行。\n\
  \n虽然所描述的会计循环有很多变体，但它们始终遵循相同的通用顺序：记录交易分录、检查检查并进行调整、编制财务报表以及结账。这一周期每月重复一次。\n\n## 信息安全年度预算\n\
  每年，首席信息安全官（CISO）都会制定一份计划，规定组织将对其负责的安全计划投入多少资金。然后，CISO 遵循该计划。这一过程在第 3 章中概述。在这里，我们回顾了制定和管理安全预算的一些策略：\n\
  \n### 1. 从战略计划开始。\n制定年度信息安全预算通常从战略计划开始。计划设定了目标和行动计划，然后对这些计划进行估算和预算，以便批准资金以开展活动。战略计划有助于从业务价值的角度对活动进行排序，这又有助于确定每项活动的预算。\n\
  \n### 2. 创建并批准财务计划（预算）。\n信息安全预算几乎都是按年度创建、实施和管理的，尽管预算通常也包含长远预测。短期（或当年）预算应包含足够的细节，以便每项活动或项目项目都能得到合理管理，以保持在预算目标之内。远期预算细节较少，但有助于领导层关注未来的支出。估算安全预算有许多方法，这里描述了其中几种方法：\n\
  \n*   **零基预算**：也称为自下而上的预算，零基预算每年的预算都从白纸开始。估算者从零开始，并从那里向上推算，根据工作分解结构（`WBS`，在第 3 章中介绍）估算每项活动的成本。从零开始使估算者能够每年对支出进行重新审视。CISO\
  \ 不仅仅是说“我们去年花了 X 元，所以今年应该花 X 加上 Y 元”，而是检查每个项目项目并估算其实实际成本应该是多少。零基预算的优势在于，它迫使 CISO\
  \ 每年检查并重新检查成本，即使是对于同一项目也是如此。\n*   **基准法**：基准法是一种使用上年的支出作为下一年预算起点的方法。如果一个 CISO 去年花了\
  \ X 元，那么她预计下年的支出是 X 加或减 Y 元，这完全合理（特别是因为与上年支出的比较可能是 CEO 在评估预算申请时首先要求查看的内容）。许多 CISO\
  \ 结合使用零基预算来估算新活动，并使用基准法来估算持续活动。\n*   **基于价值（或投资回报率 ROI）的预算**：这种方法寻求确定活动对业务的价值，以此作为支出金额的指导。这种方法可以按项目逐一进行，也可以通过查看整个安全项目组合进行整体考虑。根据业务价值和组织对该活动的投资回报，对活动进行检查、估算和合理性证明。例如，一个新的身份管理系统可能是合理的，因为它降低了针对已知价值的资产遭受身份盗取攻击的风险。资产的价值显示了为了保护它应该合理花费多少。然而，如果还能证明新的身份管理系统与使用旧系统相比，降低了身份配置的成本，那么\
  \ CISO 就可以展示投资回报率，有助于证明该成本的合理性。\n\n![Images](img/note.jpg)\n\n**注意** 许多 CISO 结合零基预算、基准法和基于价值的方法来创建和证明信息安全预算。\n\
  \n### 3. 批准并监控支出。\n一旦信息安全预算获得批准，CISO 就会监控支出，确保其符合计划。对安全计划支出的监控过程请见第 3 章。\n\n###\
  \ 4. 创建滚动预测。\n预算是对固定期间支出的估算。在预算的基础上，还编制并不断更新预测。预测是对未来支出的预测。与批准后不再更改的预算相比，预测基于实际发生的情况。最初（在年的第一个月），预算等于预测。但在第一个月之后，预测值可能会偏离预算。由于预算不会改变，支出的变化将反映在预测中。\n\
  \n### 5. 报告。\n每月，CISO 或指定的经理会将实际支出与预算进行比较，并更新预测，以便了解下月的计划支出，并向领导层和利益相关者汇报支出相对于预算的进展情况。\n\
  \n## CISO 的财务建议\n许多组织的 CISO 不向 CEO 报告的原因是他们缺乏财务直觉。如果 CISO 不以像其他经理一样的方式参与业务讨论，CISO\
  \ 可能无法获得同样的尊重。这可能导致安全在业务中受到的关注较少。在繁忙且高压的环境中，如果 CISO 的信誉没有建立，安全很容易失去声音。以下是 CISO 作为组织财务领导者可以采取的一些措施：\n\
  \n*   **实现财务目标**：CISO 失去其他高管信誉的最快方法就是超出安全预算。管理任何团队的财务状况使其保持在预算范围内，是作为高层经理的基本且核心的要求。\n\
  *   **使用正确的术语**：CISO 在讨论财务话题时应使用正确的财务术语。例如，在与 `CFO` 讨论权益报告时，CISO 不应引用损益表`（它不显示权益）。同样，CISO\
  \ 不应混淆 `budget`（预算）和 `forecast`（预测）等术语，因为它们不同。CISO 应该熟悉组织使用的术语，并与管理团队其他成员使用相同的财务语言。\n\
  \n\n\n\n\n- 学习财务机制：每个组织的运作方式各不相同。CISO 必须学习组织财务和会计机制的轮轴和杠杆，以便其理解业务是如何盈利的、使用了哪些系统和流程，以及安全职能如何融入组织的会计体系和其他组织财务模型的其他方面。\n\
  - 构建并使用良好模型：每位 CISO 都使用模型和工具来帮助管理团队和财务。CISO 应该完善自己的模型，并与其他领导进行讨论，以提高他们的财务理解水平和表现。CISO\
  \ 应该能够展示他们所有数据的来源以及是如何确定的，以确保并向他人证明他们对组织的财务状况了如指掌。\n- 贡献价值：许多 CISO 认为自己的角色是帮助组织应对风险。这是一个很好的视角，但帮助组织为投资者或其他财务利益相关者增加价值又如何？这是其他\
  \ C 级高管做的事情，为什么 CISO 不可以做呢？CISO 可以通过理解组织的财务驱动因素并采取行动为组织的财务表现和成功做出贡献。\n- 在安全组织内部建立财务意识文化：安全团队的每位成员都应该寻找更高效工作、节约成本和贡献价值的方法。CISO\
  \ 应该促进节约成本，鼓励安全团队参与安全财务规划和执行决策。安全团队的财务意识可以通过培训、沟通和参与随时间的推移而提高。\n\n## 采购与供应商管理\n\n\
  本节讨论了 CISO 在从供应商处采购商品和服务方面的角色。出于两个原因，CISO 应该是其组织采购和供应商管理流程的专家。首先，CISO 使用采购流程来获取适用于安全计划的商品和服务。例如，安全部门获取新的入侵检测系统或威胁情报服务就遵循一套采购流程。其次，组织采购的所有物品都可能具有安全影响，因为它们可能会向企业引入漏洞，或执行对安全产生影响的功能。因此，安全部门应该参与组织的所有采购活动，就像质量保证、会计或法律部门通常在某种程度上程度上参与采购过程一样。本节涵盖了以下主题：\n\
  \n- 采购核心原则和流程\n- 合同类型\n- 范围协议\n- 第三方供应商风险管理\n\n## 采购核心原则和流程\n\n`Procurement`（采购）是获取商品和服务的过程。这包括寻找来源（供应商）、根据竞争性过程选择胜者、同意条款以及进行业务交易。在管理采购时，采购专业人员通常遵循以下基础概念或支柱：\n\
  \n- **竞争**：所获取产品或服务的来源是通过竞争过程选定的，在此过程中，供应商提交报价，组织选择最符合其需求的胜者。\n- **伦理与公平**：开展竞争和选择供应商的过程应该是透明且公平的。所有潜在来源都应该有平等的机会提供产品或服务，不受偏见影响并处于公平的竞争环境中。\n\
  - **价值**：过程应经过优化，以确保采购组织获得最佳价值。将根据范围、价格和总拥有成本对产品和服务供应进行评估。使用竞争方法进行供应商选择，以便以最低成本实现获取。\n\
  - **问责制与报告**：过程应该是开放的，以便进行监控、衡量并向利益相关者报告。\n\n图 5-9 显示了采购的基础支柱。\n\n![Images](img/05-9.jpg)\n\
  \n**图 5-9** 采购流程\n\n采购的基本步骤是启动、招标、授予和获取，尽管没有行业标准来规定步骤的数量或名称。每个组织实施采购的方式不同，因为没有通用的采购框架。虽然实施方式各异，但常见的每个步骤的核心特征将在下面的子节中讨论。\n\
  \n### 启动\n\n采购流程始于对新物品、物品组或服务的需求的识别。需求可能简单到如“我们需要一把十字螺丝刀”，也可能复杂到需要整个规格说明书。在启动阶段，`requestor`（需求物品的人或团队）可能会与潜在供应商接触，以进一步开发需求和/或开发成本估算。\n\
  \n一旦确定了需求，申请人会对大致成本进行估算，以获取进行采购的批准。成本估算可以在内部开发，可以基于历史数据，也可以来自供应商。每个组织对如何准备成本估算以及如何提交给审批人员都有自己的要求。\n\
  \n除了需求和成本估算外，根据组织的规定，可能还需要购买物品的理由。物品理由说明了申请的原因，如果组织需要支持性文件，还可能包含附件。\n\n一旦申请人准备好描述需求、理由和成本估算的所需信息，申请将根据组织的审批规则提交给相应的人进行审核和批准。一旦获得批准，采购即可进入下一步。\n\
  \n### 招标\n\n采购获得批准后，组织的采购部门就可以向行业发布或公示需求并获取报价。为了做到这一点，采购部门需要一份潜在供应商列表。某些组织（如美国联邦机构）可能会发布信息征询公告（RFI）或来源寻源（Sources\
  \ Sought）请求，要求可能感兴趣的方表明身份。有时这些请求会包含某些要求，要求潜在投标人提交其资质和能力，或回答调查问卷，以便进入投标者名单。组织应该尽可能开展外展活动，以对接能够提供组织标准的潜在投标人。\n\
  \n申请人准备提供给投标人的招标文件。这可能简单到如“2 号十字螺丝刀”这样的一行文字，也可能是包含规格说明、工作任务书（SOW）和交付物列表的整个招标包。对于系统或服务的采购，以下是发送给潜在投标人的招标包中可能包含的项目列表：\n\
  \n\n\n\n\n- **工作说明书**：征询包中将包含某种形式的文件，定义了买方与卖方之间合同所涉及的努力范围。这可以以`statement of work`的形式形式存在，但某些组织使用`performance\
  \ work statements`或其他文档。SOW 定义了服务范围或所提供产品的描述，以及支持信息，如进度表、交付物品清单、假设和限制条件。\n- **规格书**：对于更复杂的需求，可能会制定规格书或需求列表。规格书包含了产品或系统要求的描述。当需要开发某物品（硬件或软件）时，规格书最为有用，尽管规格书对采购现成品物品也有帮助。\n\
  - **合同或条款与条件**：征询包应包含该组织意图使用的拟议协议草案。合同将是买方和卖方之间的法律协议，规定了卖方履行需求和买方付款的各项条款、条件和义务。\n\
  - **评估和授予标准**：有时组织会发布关于其将如何选择竞争性采购获胜者的描述。这种描述对投标人很有帮助，因为可以引导他们提出符合组织需求的方案。评估方法有几种类型，但以下是最常见的：\n\
  \n- **最低技术可接受价格 (LPTA)**：LPTA 意味着价格最低的投标人获胜。所有提供符合需求（产品或服务）方案的投标人均符合资格，由价格最低的投标人获得购买订单。然而，请注意，该标准仅仅是“技术上可接受”。在\
  \ LPTA 中，没有比较提案以确定一个投标人的方案是否优于另一个方案的概念。对于那类比较，则使用`best value`（最佳价值）。\n- **最佳价值**：最佳价值评估考虑了投标人的提案在`何种程度上`满足需求或评估因素。它允许对需求或每项需求被满足的`程度`进行比较，并允许授予给提供最佳解决方案的投标人，即使该投标人未提出最低价格。许多开发项目或复杂产品或系统的采购都使用最佳价值标准。\n\
  - **提案提交说明**：征询包应包含关于投标人应如何准备和提交提案的说明。此目的有两点：首先，它确保每位投标人都提供了组织选择获胜者所需的关键信息。其次，它使得投标变得更容易比较，因为它们看起来都相似，并且包含关于每个投标人报价的相似信息。提供清晰的提案准备说明是确保公平竞争环境和公平竞争的一种方式。\n\
  \n征询包提供给所有潜在投标人，并包含特定的截止日期和时间。这确保了所有投标人都有相同的时间准备报价，是确保公平的另一种方法。\n\n### 授予\n\n组织根据预定的评估标准对所有提案进行评估。遵循此类标准并确保其一致地应用于所有提案是至关重要的。如果在评估过程中，组织发现需要从某些或所有投标人处获得额外信息，它可以提出获取额外信息或修订提案的请求。在这种情况下，组织可能会决定发布更新的\
  \ SOW 或其他修正信息，因为组织发现征询包中的错误或缺陷并不罕见。\n\n在与投标人就其提案交换信息的期间，组织应遵守以下伦理规则：\n\n- *以书面形式交换信息。组织应避免向投标人下口头指示，并始终以书面形式提供。\n\
  - *向所有投标人提供相同的信息，除非这样做会将其中一个投标人报价的专有信息泄露给其他*。例如，如果一个投标人的报价存在需要更新的缺陷，该请求不应透露给另一位投标人（尽管应予以记录以便在必要时进行审查）。\n\
  - *为所有投标人提供相同的机会*例如，如果一个投标人的提案截止日期得到延长，则应对所有人延长。\n\n一旦从投标人处获得所有信息，组织即可完成评估。对每个提案的评估结果应记录或捕存在数据库等存储库中。这使得未来可以审查授予决策是如何做出的，如果投标人对授予提出异议或通过法律救济提起申诉，这可能非常重要。\n\
  \n使用 LPTA 对简单物品（如螺丝刀示例）的提案评估相当直接：确定哪些报价符合标准，比较符合标准的报价的价格，并选择最低的一个。然而，对于更复杂或使用最佳价值的需求，评估过程可能会更加严谨。此类采购评估可能需要以下操作：\n\
  \n- 列出每个需求或评估因素\n- 根据预定的评估因素评估每个需求\n- 为每个需求分配评分或衡量\n- 处理所有单个需求评分的结果\n- 比较并对比提案\n\
  \n评分系统可以使用数值来评估需求或评估因素的程度。例如，一种评分系统可能是：\n\n- 0 – 无数据\n- 1 – 不满意\n- 2 – 合格\n- 3 –\
  \ 良好\n- 4 – 优秀\n\n通过评估每个需求和评估因素，组织可以创建一个报价的画像，并与其他报价进行比较以揭示最佳选择。此信息与价格相结合，以便确定哪份报价为组织提供了最佳价值。\n\
  \n```\n![Images](img/note.jpg)\n```\n\n**注意** 提案可以根据一组需求、一组评估因素或两者进行进行评估。需求是所需要的东西或强制性条件，例如“绳子长度应为十英尺”。评估因素是一个被考虑的话题，例如“投标人执行计算机取证的经验”。这两种方法都能使购买组织获得有关报价的信息并评估其优点。\n\
  \n一旦组织选择了获胜者，它将通知所有方。某些组织（特别是美国联邦、州和地方政府）设有了程序来处理认为自己未被公平对待的投标人的投诉。\n\n在某些情况下，组织在执行采购订单或合同之前，可能会与获胜投标人进行额外的步骤以谈判合同条款。例如，某些投标人可能会提出特殊的付款条款或折扣，这些需要与组织讨论并纳入合同。\n\
  \n\n\n\n\n一旦订单或合同签署，报价方就有义务根据条款和条件交付产品或服务。通常，组织内部的质量保证部门会参与对交付的物品进行评估，以确保其符合合同要求。测试可能是质量保证流程的一部分，以确保交付的物品满足要求。可能还会进行安全测试，以验证任何安全需求。\n\
  \n## 合同类型\n\n受采购流程约束的产品和服务可以使用任何数量的合同工具来获取。`contract vehicle`（合同工具）一词是指建立买方和卖方之间业务关系的法律机制。本节介绍了组织和\
  \ CISO 可用的常用合同工具。这些合同可用于获取任何产品或服务，包括 CISO 采购的安全产品和服务。\n\n合同交付条款可以采取两种形式之一：\n\n-\
  \ **完工型 (Completion)**：完工型合同是指在付款之前必须交付或完成工作（即产品或服务）的合同。例如，如果合同是关于采购 IDS 解决方案，则可能在\
  \ IDS 交付后付款。这就是完工型条款。\n- **工作量型 (Level of effort, LOE)**：LOE 合同是在规定期间内进行付款的合同。通常用于服务合同，LOE\
  \ 合同允许卖方在工作期间获得付款，而无需等待所有工作完成。LOE 付款可能基于多种方法，包括工作小时数、能力的增量交付、里程碑的实现，或简单的总工作量的百分比。\n\
  \n*合同付款条款*可以采取多种形式，最常见的是此处列出的：\n\n- **固定总价 (Firm fixed price, FFP)**：FFP 意味着工作按照合同中确定的固定价格执行或交付产品。合同包含一份项目列表，每项都有其固定的固定总价。在满足项目验收标准后即可付款。FFP\
  \ 合同可用于以按小时劳动形式获取的服务。在这种情况下，每小时费率是针对执行的每小时收取的 FFP 费用。\n- **工时加材料 (Time and materials,\
  \ T&M)**：T&M 合同是指买方根据劳动力和材料报销卖方的合同。通常使用计算出的小时费率报销劳动力，涵盖卖方员工工资的实际成本加上任何间接费用和利润。同样，卖方还将获得硬件或软件等材料成本加上管理费用和利润的报销。\n\
  - **成本加成 (Cost plus)**：成本加成合同与 T&M 合同类似，但利润是单独列出的。利润（“加”部分）可能基于成本的百分比，甚至可能基于性能衡量标准，在满足某些条件时，卖方可以获得更高的利润。\n\
  \n合同交付和付款条款通常结合使用。例如，FFP-完工型合同意味着工作以固定价格完成，并在工作完成后付款。相比之下，FFP-LOE 合同意味着工作以固定的每小时费率完成，并在工作小时数期间内进行账单并付款。\n\
  \n## 范围协议\n\n合同具有一些方法来定义工作范围或待执行的服务描述。定义工作范围的最常见方法是使用以下文档类型之一：\n\n- **工作说明书 (Statement\
  \ of work, SOW)**：SOW 是要执行工作的描述。它描述了需要哪些工作以及如何执行。因此，SOW 具有很强的规定性，因为它不仅告诉卖方要做什么，还告诉怎么做。\n\
  - **性能工作说明书 (Performance work statement, PWS)**：与 SOW 不同，PWS 不描述如何执行工作。相反，PWS 根据要产出的成果或结果来列出工作。PWS\
  \ 还定义了可衡量的性能标准，并确定了买方将如何衡量结果。由于结果是明确定义的，完全取决于卖方决定如何完成工作并达成结果。\n- **目标说明书 (Statement\
  \ of objectives, SOO)**：当组织（买方）不想定义如何完成工作（如 SOW 那样），且没有足够的信息定义可衡量的性能结果（如 PWS 那样）时，使用\
  \ SOO。相反，买方概述卖方需要实现的总目标，由卖方创建 SOW 或 PWS（或两者兼有）。\n- **服务水平协议 (Service-level agreement,\
  \ SLA)**：SLA 用于定义承包商为买方执行的服务。它对于 `x-as-a-service` 合同特别有用，卖方提供传统上由组织内部执行的服务。与 PWS\
  \ 类似，SLA 以可衡量的术列出供应商性能义务。然而，SLA 包含额外功能，为卖方未能实现目标提供救济措施，例如费用减少、服务额积分或终止条款。\n\n##\
  \ 第三方供应商风险管理\n\n人们无需查看零售巨头 Target 在 2013 年广为人知的安全泄露事件，就能意识到供应商安全的重要性。在这次安全泄露中，网络攻击者使用钓鱼邮件在\
  \ Target 制冷承包商的计算机上安装了名为 `Citadel` 的恶意软件程序。如果该承包商使用的是最新的反恶意软件，他们本可以检测到 `Citadel`，但他们并没有，导致\
  \ `Citadel` 未被发现。攻击者随后利用 `Citadel` 提供的访问权限获得了承包商登录 Target 网络的凭据。这次攻击导致数百万客户支付账户泄露。尽管\
  \ Target 的网络存在导致泄露的漏洞，但承包商的安全缺陷是网络攻击者能够利用的主要漏洞。\n\nTarget 在安全泄露发生时有趣地没有 CISO，可能会试图将责任归咎承包商，但客户支付记录的安全最终是\
  \ Target 的责任。如果组织允许第三方供应商访问其网络，组织必须尽职调查以确保供应商不会导致破坏。\n\nCISO 应该通过实施第三方风险管理计划，确保第三方的使用不会向环境中引入漏洞。第三方风险管理计划应该处理组织可能的所有的所有产品和服务。特别是：\n\
  \n- **产品和系统**：任何产品（硬件和软件）都可能安全漏洞。一旦安装在组织的网络上，产品漏洞就会变成企业的漏洞并可能被利用。此类类别包括商业现货（COTS）产品和开源产品，因为两者都可能包含漏洞。\n\
  \n\n\n\n\n- **开发的应用程序**：组织可能会从第三方供应商处获取定制应用程序，这些程序可能包含漏洞并为企业引入风险。\n- **顾问和服务提供商**：组织通常使用第三方供应商提供从法律服务、IT\
  \ 咨询到 HVAC 承包商的各类服务。任何连接到组织网络的供应商都可能引入风险。\n- **云服务**：X 即服务（X-as-a-service）供应商的独特之处，它们提供的资产直接连接到组织的网络，并/或提供交钥匙式的企业服务。\n\
  \n尽管第三方风险管理计划可以通过多种方式实施，但此处讨论的方法是采用 NIST 风险管理框架（RMF）。RMF 通常被认为是一种用于将信息安全控制应用于系统的模型，但它也可以进行定制，为在供应商关系中应用安全控制提供一个框架。图\
  \ 5-10 显示了典型的 RMF 阶段。接下来将讨论每个阶段在第三方安全中的应用。\n\n![Images](img/F05-10.jpg)\n\n**图 5-10**\
  \ NIST 风险管理框架\n\n### 准备 (Prepare)\n准备阶段涉及创建支持其他每个阶段的工件和工具，并在这些阶段期间获取反馈以促进改进。在此阶段，CISO\
  \ 准备了以下内容：\n\n- **第三方风险管理策略**：该策略反映了指导第三方计划的所有要求。策略中的主题可能包括以下内容：\n    - 第三方的角色的、职责和组织结构\n\
  \    - 针对合同工的要求（由于他们不是组织的员工，因此人力资源政策不适用于他们）\n    - 涵盖物理、资产、通信安全和运行安全的要求的章节\n   \
  \ - 产品开发，包括 `SDLC` 期间的安全性\n    - 配置、补丁和变更管理\n    - 事故/事件管理\n    - 业务连续性\n    - 监控与审计\n\
  \    - 法律与合规\n    - 文档编制与记录存档\n- **其他策略的定制**：某些组织倾向于保持第三方策略精简，并将其编写为包含对其他策略的内容。在这种情况下，这些策略可能需要进行审查和定制，以确保它们正确地解决了第三方需求。\n\
  - **支持性标准、指南和流程**：除了策略外，组织还可以开发标准、指南和流程，作为第三方或组织内部负责监督或与第三方合作的人员的指导。\n- **获取评估工具**：组织可能会获取用于评估第三方供应商安全性能的工具。例如，如果云服务供应商同意让组织进行漏洞扫描，组织可能为此种目的识别并获取扫描工具。\n\
  - **准备问卷**：还可以以供应商安全问卷的形式收集供应商信息，问卷中包含特定的安全计划问题。答案通常用于做出采购决策。供应商安全联盟（Vendor Security\
  \ Alliance](https://www.vendorsecurityalliance.org/)）为此目的准备供应商问卷提供了指导。\n- **安排评估人员**：组织可能选择使用外部评估人员对第三方的安全能力进行扫描或执行其他评估。\n\
  - **合同条款和工件**：CISO 可以提前准备将用于第三方协议的合同条款和其他语言。\n\n其余阶段将应用于每个候选第三方供应商、产品或服务。在每个阶段，都会获取反馈并将其回馈准备活动中，以改进下一次使用该流程或针对下一个供应商的准备工作。\n\
  \n### 分类 (Categorize)\n在分类阶段，对供应商、产品或服务进行分类。应该预先建立类别，并为每个类别建立相应的控制措施。例如，组织可以定义以下三类第三方关系：\n\
  \    - 产品\n    - 服务提供商\n    - 定制软件开发者\n\n在下一阶段，为每个类别选择安全控制措施。某些组织使用高度结构化的方法，为给定的类别预定义控制措施，从而更快地识别新供应商的控制措施。\n\
  \n### 选择 (Select)\n在选择阶段，挑选特定的控制措施。使用之前说明的类别，以下是显示控制措施的进一步说明。\n\n- **全局控制**：这些控制适用于所有类别的工件。这些工件是用于建立供应商安全态的工具：\n\
  \    - **安全产品或供应商的声誉**：在建立产品信任时，有时供应商的声誉是一个很有价值的考虑因素。历史上未能及时交付补丁的供应商可能不如及时交付的供应商。\n\
  \    - **独立保证**：可能需要产品或供应商已被信誉良好的保证实体独立审计的证据。例如，可以根据包括 `SOC 1`、`SOC 2`、`ISO/IEC\
  \ 27001` 或 `FedRAMP` 在内的标准进行审计和第三方证明。\n    - **法律协议**：可以使用法律协议建立供应商对组织的承诺，例如承担安全违规的责任。\n\
  - **安全审查**：组织可以对产品或服务进行安全审查，以确定其安全态以及对组织使用的适用性。\n    - **产品控制**：适用于硬件或软件产品或系统的采购的控制可能包括（除之前列出的全局控制外）对以下内容的验证：\n\
  \        - 供应商拥有一个及时报告漏洞的计划。\n        - 供应商有一个及时发布安全补丁的计划。\n    产品控制可能适用于 `COTS`\
  \ 或开源产品。\n- **服务提供商控制**：重要的控制措施可能包括验证供应商拥有并能够提供以下内容的证据：\n    - 已建立的信息安全计划\n    -\
  \ 安全策略、标准和程序\n    - 针对`第四方`（供应商的第三方供应商）的安全程序\n    - 愿意接受安全测试\n    - 独立测试或审计实体的验证（例如\
  \ `SOC 2` 审计）\n- **定制软件开发者控制**：除了类别列出的所有控制措施外，还应对对软件开发组织进行评估，以确定其安全编码计划和 `SDLC`\
  \ 的质量。\n\n### 实施 (Implement)\n一旦选择了产品或服务供应商的安全控制措施，将对其进行实施。编写、谈判并执行合同。进行审计和测试。引入保证供应商。组织审查提供的文档，如安全策略和程序。实施阶段落实从选择阶段识别的所有控制措施。\n\
  \n### 评估 (Assess)\n在评估阶段，收集实施阶段获得的所有工件，并对所有信息进行审查以做出关于使用该产品或服务的决定。如果存在控制缺陷，将对其对业务的风险影响进行评估。正如第一章介绍的，处理风险有四种选择：\n\
  - 通过实施额外的控制措施来*缓解*或*降低*风险\n- *转移*风险（通常通过使用保险单）\n- *接受*风险，当组织可以“忍受”该风险时\n\n\n\n\n\
  \n- `Avoid`：通过停止活动或更改产品、服务的功能或其使用方式来完全规避风险。\n- `Authorize`：最终，由 `CISO` 决定组织是否可以继续部署产品、服务或供应商做出最终安全建议。根据组织的不同，`CISO`\
  \ 的决定可能是最终决定，也也可能被领导层的其他人员否决。如果被否决，`CISO` 应确保决策者知道他们正在选择接受剩余风险，并在需要时进行记录以备日后参考。\n\
  - `Monitor`：一旦部署产品或启动服务，就应进行持续监控。监控应确保履行了合同义务、控制措施已到位，并且供应商正在履行其职责。通过评估不足之处来确定其风险敞口和对业务的潜在影响，以便采取适当行动。\n\
  \n## 较小的供应商可能带来最大的风险\n\n某些组织在关注错误重点时会遭受后果。很多时候，导致安全漏洞露出的并非外包了所有主要 IT 功能的大型供应商，而是小型的小家庭经营者（例如制冷承包商）。由于较小供应商在企业中的作用有限，其安全要求有时会被放宽。但即使是较小的供应商也可能引发大问题，Target\
  \ 泄露事件就证明了这一点。所有供应商，无论大小，都应该是第三方风险管理计划的一部分。\n\n## 章节回顾\n\n战略规划帮助组织理解什么是最重要的，并利用这些信息做出决策。整个组织的战略规划由组织领导层执行。`CISO`\
  \ 很有可能是创建组织战略计划的团队成员。`安全战略规划`是组织战略规划的子集。\n\n理解、解释和转化安全业务驱动因素，使 `CISO` 能够就安全计划的方面（如安全目标、目的、策略、程序、架构和控制措施）做出重要决策。为了完成这一决策过程，一些组织使用非正式方法（如交流、会议或非正式评估），而另一些组织则使用更严谨结构化方法（如正式流程、框架、风险评估或企业架构模型）。\n\
  \n`CISO` 应该牢掌握业务会计和财务基础。`CISO` 需要能够精通财务语言，学会如何阅读资产负债表和利润表，并掌握资本支出和运营支出等关键概念。此外，`CISO`\
  \ 必须能够管理并证明安全部门财务状况的合理性。\n\n安全部门应参与组织对所有产品和服务的采购，以确保不会向环境中引入漏洞。采购流程的基本步骤是启动、征询、授予和获取。安全部门应参与流程的每一个步骤。`CISOs`\
  \ 应通过实施第三方风险管理计划，确保使用第三方不会向环境中引入漏洞。\n\n## 快速复习\n\n- 在安全战略规划中，确保每个目标都是必要的、可实现的且可验证的非常重要。\n\
  - 遵循企业架构框架是将安全业务驱动因素转化为安全决策的方法，以产生企业信息安全架构 (`EISA`)。\n- `EA` 模型可用于拆分并记录信息安全计划架构，并从高层业务架构视角到低层技术架构过程，说明其与企业的关系。\n\
  - 会计周期是财务/会计人员遵循的一种工作流，用于实施创建、组织和记录组织财务交易的过程。\n- 组织会计系统包括根据 `GAAP` 结合会计政策和程序使用的数据处理系统。\n\
  - 利润表是组织在某时期内财务活动的总结。\n- 资产负债表是组织在特定时间财务状况的快照。\n- 许多 `CISOs` 结合零基预算、基准设定和基于价值的方法来创建并证明信息安全预算。\n\
  - 采购是获取商品和服务的过程。\n- 定义供应商执行工作范围的最常见方法是使用工作说明书（SOW）、性能工作说明（PWS）、目标说明书（SOS）或服务水平协议（SLA）。\n\
  \n## 问题\n\n**1.** 下列哪项不被认为是战略规划过程的要素组成部分？\n**A.** 选择合适的人组成团队\n**B.** 获取规划工具\n**C.**\
  \ 选择一个要遵循的模型\n**D.** 制定进度\n\n**2.** `CISO` 可能会使用下列哪些技术将安全业务驱动因素转化为安全决策？\n**A.**\
  \ 非正式会议\n**B.** 企业架构框架\n**C.** 风险管理演练\n**D.** 以上所有\n\n**3.** 下列哪些最常见出现在资产负债表中？\n\
  **A.** 收入、负债和所有权\n**B.** 收入、负债和利润\n**C.** 收入、支出和利润\n**D.** 资产、负债和所有权\n\n**4.** 下列哪些是采购的基石支柱？\n\
  **A.** 来源选择、提案、评估\n**B.** 收入、负债和利润\n**C.** 竞争、道德、价值\n**D.** 问责、道德、来源选择\n\n**5.**\
  \ 一个组织想要购买一个由硬件和软件组成的交钥匙式库存管理系统。该组织希望保持低价格，但最重要的标准是承包商的经验和能力。哪种采购方法最适合？\n**A.**\
  \ 最优价值\n**B.** 最低可接受价格 (`LPTA`)\n**C.** 成本加成\n**D.** 工料\n\n### 答案\n\n**1. B.** 规划工具很有用但并非必不可。选择合适的人参与、选择要遵循的模型以及制定并坚持进度更为重要。\n\
  \n**2. D.** 以上所有。`CISO` 可以利用非正式会议、企业架构框架或风险管理演练促进安全业务驱动因素向安全决策的转化。\n\n**3. D.**\
  \ 资产负债表最常见的是显示组织在特定时间的资产、负债和所有权。收入、支出和利润显示在利润表中。\n\n**4. C.** 采购的基础支柱包括竞争、道德、公平、价值、问责和报告。来源选择、提案和评估不是采购的支柱。\n\
  \n**5. A.** 最优价值采购方法允许组织选择提案最符合要求的供应商。`LPTA` 则会强制组织在满足最低要求的情况下选择价格最低的提案。\n\n# 附录\n\
  \n## 关于在线内容\n\n本书附带了 `TotalTester Online` 可自定义练习考试软件，包含 300 道练习考试题。\n\n## 系统要求\n\
