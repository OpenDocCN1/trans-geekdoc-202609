  \ McGraw Hill 内容的任何使用是预见的还是不可预见的。\n\n## TotalTester Online\n\nTotalTester Online\
  \ 为您提供 CCISO 考试模拟。可以在练习模式（Practice Mode）或考试模式（Exam Mode）下进行考试。练习模式提供一个带有提示、书籍参考、正确和错误答案解释的辅助窗口，以及在测试过程中检查您的答案的选项。考试模式提供实际考试的模拟。问题的数量、问题的类型和允许的时间旨在准确呈现考试环境。自定义测验的选项允许您从选定的领域或章节创建自定义考试，并且您可以进一步自定义问题数量和允许的时间。\n\
  \n要参加测试，请按照上一节提供的说明注册并激活您的 Total Seminars 训练中心账户。注册后，您将被带到 Total Seminars 训练中心。从训练中心主页，从页面顶部\
  \ `Study` 下拉菜单或主页的“您的主题（Your Topics）”列表中选择 `CCISO™ All-in-One Exam Guide TotalTester`。然后您可以选择自定义测验的选项，并在练习模式或考试模式下开始自测。所有考试均提供总分和按领域划分的分。\n\
  \n## 技术支持\n\n有关 TotalTester 或训练中心操作的问题，请访问 `www.totalsem.com` 或发送电子邮件至 `support@totalsem.com`。\n\
  \n有关书籍内容的问题，请访问 `www.mheducation.com/customerservice`。\n\n## 术表\n\n访问（Access）：主体对对象实施的操作，如读取、修改、删除、创建或执行。\n\
  \n访问控制（Access controls）：控制用户和系统如何与其他系统和资源通信和交互的安全功能。\n\n管理控制（Administrative controls）：以管理为导向的控制，如策略、程序、指南、培训、风险管理和人事实践（招聘、解雇等）。\n\
  \n敏捷（Agile）：多种开发方法的总术语，这些方法采用迭代和增量开发流程，并鼓励团队协作。\n\n年化损失预期（Annualized Loss Expectancy,\
  \ ALE）：用于预测年度损失的潜在价值。公式为 `单次损失预期 (SLE) × 年化发生率 (ARO) = 年化损失预期 (ALE)`\n\n年化发生率（Annualized\
  \ Rate of Occurrence, ARO）：对事件在一年内发生次数的估计。\n\n资产安全（Asset security）：识别组织拥有的资产，并确定为每个资产实施适当的安全措施的实践。\n\
  \n\n\n\n\n### 资产价值 (AV) 指受事件影响的资产或资产的价值，用于计算单次损失预期 (SLE)。资产价值可以仅仅是资产的更换成本，也可能包括其他考虑因素。资产价值可能包括资产丢失时可能产生的费用，例如人工和安装成本、停机给业务带来的成本，以及由于业务或声誉损失导致的成本。\n\
  \n### 基于属性的访问控制 (ABAC) 一种基于策略的访问控制，根据技术策略授予访问权限，结合了多种属性，如请求者（主体）、请求的资源（对象）、环境条件（如时间或位置，环境上下文）以及请求的操作。可以根据日期、时间、IP\
  \ 地址等多种属性的组合授予访问。\n\n### 审计章程 (audit charter) 记录审计的权限、范围和职责。\n\n### 审计范围 (audit\
  \ universe) 描述审计涵盖的所有业务流程和资产。\n\n### 身份验证 (authentication) 对主体进行验证以确认其身份真实无误。通常通过使用密码、口令、令牌设备、智能卡、加密密钥或生物识别来实现。\n\
  \n### 授权 (authorization) 根据预定义的访问管理规则授予对象访问权限，这些规则规定了主体被允许在对象上执行的操作。\n\n### 可用性\
  \ (availability) 对系统的保护，确保及时访问数据和资源。\n\n### 负债表 (balance sheet) 组织在特定时间财务状况的快照。它列出了组织的资产价值（拥有的）、负债价值（欠的）以及净值（资产与负债之间的差额）。\n\
  \n### 基准 (baseline) 作为比较基础的起点。通常用于配置或变更管理领域，基准是文档、配置、硬件或软件项的指定或官方版本。\n\n### 僵尸网络\
  \ (botnet) 一组共同执行攻击的受感染系统，具有某种形式的集中化命令和控制。\n\n### 业务影响分析 (BIA) 一种用于业务连续性计划的功能性风险分析，用于在发生重大中断时确定组织和系统的需求、相互依赖关系、应急需求和优先级。\n\
  \n### 国际网络安全中心 (CIS) 一家致力于开发信息安全最佳实践工具、框架和资源的非营利组织。\n\n### 国际网络安全中心关键安全控制 (CIS CSC)\
  \ 一个自愿性框架，由 20 个“关键”控制措施组成，专注于信息安全的核心要素。它也被称为 CIS 前 20，以前称为 SANS 前 20。\n\n### 变更管理\
  \ (change management) 识别、跟踪、监控和控制环境、系统或资产变更的实践。\n\n### 密文 (ciphertext) 已加密的信息。\n\
  \n### 1996 年克林格-科恩法案 (Clinger-Cohen Act of 1996) 一部美国联邦法，规定了联邦政府获取、使用和处置信息技术的方式。\n\
  \n### 云安全联盟 (CSA) 一家致力于云计算使用和采用最佳实践的非营利组织。\n\n### 云安全联盟云控制矩阵 (CSA CCM 或 CCM) 由云安全联盟开发的用于云安全的、包含安全概念和原则的控制框架。\n\
  \n### 冲突 (collision) 哈希算法为两个不同的输入创建相同哈希输出的现象。\n\n### 商业现货 (COTS) 供商业销售的软件或硬件产品。\n\
  \n### 补偿性控制 (compensating controls) 当主控制因成本、复杂性或其他业务限制不可行时，作为替代或次要控制的措施。例如实施网络隔离或安装报警器。\n\
  \n### 合规性 (compliance) 一种治理方法，确保与适用法律、法规、标准、组织政策和伦理行为一致。\n\n### 合规管理 (compliance\
  \ management) 组织计划、实施和维护合规性的流程。\n\n### 机密性 (confidentiality) 对数据的保护，确保只有授权人员可以访问。\n\
  \n### 配置基准 (configuration baseline) 针对硬件或软件的特定配置，有时以标准形式记录。\n\n### 配置管理 (configuration\
  \ management) 对产品或交付物的需求、规格和配置的管理。有时包括库存和记录的管理。\n\n### 持续审计 (continuous auditing)\
  \ 更频繁地进行审计，通常通过使用能够快速收集和分析数据的技术（如软件代理或传感器）并提供实时或近实时的结果。\n\n### 控制 (control) 为了降低潜在风险而实施的措施。控制措施可以是软件配置、硬件设备或消除漏洞或减少威胁主体利用漏洞概率的程序。参见“对对措施”\
  \ (countermeasure)。\n\n### 控制框架 (control framework) 控制措施的目录，用于为实施全面的信息安全计划提供基础支持。\n\
  \n### 信息和相关技术控制目标模型 (COBIT) 由 ISACA 和 IT 治理学院开发的、用于 IT 治理和管理的最佳实践框架。\n\n### 纠正控制\
  \ (corrective controls) 通过修复系统、流程或活动来纠正或补偿已发生不利事件的控制。示例包括入侵防御系统 (IPS)、在员工违规后终止其工作、隔离恶意软件的防病毒软件、使用灭火器灭火以及实施业务连续性计划或事件响应计划。\n\
  \n### 应对措施 (countermeasure) 为了降低潜在风险而实施的措施。应对措施可以是软件配置、硬件设备或消除漏洞或减少威胁主体利用漏洞概率的程序。\n\
  \n### 关键路径 (critical path) 如果发生变化将改变项目总结束日期的单个或一系列事件或活动。\n\n### 跨站脚本 (XSS) 一种 Web\
  \ 攻击，攻击者向他人查看的网站注入恶意脚本。当有人访问该网站时，脚本由受害者的浏览器执行。脚本可以访问受害者的 cookie、令牌或其他敏感信息。\n\n###\
  \ 加密算法 (cryptographic algorithm) 用于加密、解密或哈希的数学方程。\n\n### 加密密钥 (cryptographic key)\
  \ 与加密算法配合用于加密和解密等操作的值字符串。通常情况下，密钥越长提供的安全性越高，但也取决于所使用的算法和实现方式。\n\n### 加密系统 (cryptosystem)\
  \ 加密和解密所需的所有系统组件，如软件、协议、算法、密钥、密钥管理等。\n\n\n\n\n\n`data custodian` 数据保管员：负责数据维护任务的人，包括实施和维护控制措施以提供数据所有者规定的保护级别，并确保系统支持执行数据分类的访问控制。这通常是技术安全人员或\
  \ IT 人员的成员（例如系统管理员）。\n\n`data owner` 数据所有者：负责特定组数据的人，包括识别数据的分类级别以设定安全需求。数据所有者通常是部门负责人或流程所有者。\n\
  \n`decryption` 解密：使用加密密钥和算法将密文转换为明文的过程。\n\n`Defense Federal Acquisition Regulation\
  \ Supplement (DFARS)` 联邦国防收购条例补充：联邦收购条例（FAR）的补充，提供了美国国防（DoD）机构、承包商和分包商在采购过程中必须遵守的特定采购条例。\n\
  \n`defense-in-depth` 深度防御：采用分层方法协调使用多种安全控制。\n\n`Delphi technique` 德尔菲法：由兰德公司（RAND\
  \ Corporation）开发的一种预测技术变化的方法。它现在被用于促进领域专家之间的讨论以达成共识。它使用一种分层的、迭代的过程向小组提问，每次迭代都会更深入地探讨该主题。\n\
  \n`detective controls` 探测控制：用于发现、检测或识别潜在不利活动、事件、入侵者或事故的控制。示例包括入侵检测系统（IDS）、安全日志审查、强制休假以及审查监控摄像头捕捉的事件。\n\
  \n`deterrent controls` 威慑控制：用于威慑或阻止潜在对手实施攻击或参与不当行为的控制。示例包括系统警告幅和警告标志。\n\n`digital\
  \ signature` 数字签名：使用发送者私钥加密的哈希值。数字签名提供真实性、完整性和不可否认性。\n\n`directive controls` 指令性控制：通常是管理性控制，通过规定允许或不允许的操作来传达预期行为。示例包括安全策略、标准和程序。\n\
  \n`discretionary access control (DAC)` 任意访问控制：一种访问控制模型，允许所有者（通常是创建者）对对象（资源）拥有完全控制权，以决定哪些主体（用户和组）可以访问和共享该对象。DAC\
  \ 示例包括大多数 Unix 和 Linux 版本，以及所有的 Windows 和 macOS 系统。\n\n`encryption` 加密：使用加密密钥和算法将明文转换为密文的过程。\n\
  \n`engagement letter` 业务函：审计实体与审计师之间的协议，用于定义业务条款、设定合理预期并防止任何误解。\n\n`enterprise architecture\
  \ (EA)` 企业架构：通过绘制图表和记录企业架构的实践，以协助决策者将组织战略与业务的人员、流程和技术对齐。\n\n`exposure` 暴露：遭受损失的情况。漏洞会使组织`暴露`于可能的损害。\n\
  \n`Exposure Factor (EF)` 暴露因素：针对特定事件可能发生的损失百分比，用于计算单次损失（SLE）。\n\n`external compliance`\
  \ 外部合规：支持遵循源自组织外部法律、法规、标准或其他指令的活动。*参见*内部合规。\n\n`Family Educational Rights and Privacy\
  \ Act of 1974 (FERPA)` 1974 年家庭教育权利与隐私法：一项侧重于保护学生教育记录隐私和机密的美国联邦法律。\n\n`Federal Information\
  \ Processing Standards (FIPS)` 联邦信息处理标准：由美国国家标准与技术研究院（NIST）发布的关于美国联邦信息系统安全的标准和指南。\n\
  \n`Federal Information Security Modernization Act of 2014 (FISMA or FISMA 2014)`\
  \ 2002 年联邦信息安全管理法的修正案，要求美国联邦机构建立、记录并实施全机构范围的信息安全计划以支持机构运营。\n\n`Federal Risk and\
  \ Authorization Management Program (FedRAMP)` 联邦风险与授权管理计划：美国联邦政府的一个计划，为云产品服务的评估、授权和持续监控提供标准方法。云服务提供商（CSP）要向美国联邦政府出售服务，必须通过\
  \ FedRAMP 授权。FedRAMP 本质上是针对云产品和服务的网络安全审批流程。\n\n`Gantt chart` 甘特图：一种说明项目进度并显示任务依赖图表。它显示了哪些任务必须完成后其他任务才能开始，并可以帮助识别关键路径。\n\
  \n`General Data Protection Regulation (GDPR)` 通用数据保护条例：一项欧盟（EU）隐私法，旨在监管对欧盟公民个人数据的处理。\n\
  \n`governance` 治理：监督某事物方向的行为。对象可以是整个组织（组织治理或公司治理），也可以组织的特定部分（如 IT 治理、财务治理或安全治理等）。\n\
  \n`governance, risk management, and compliance (GRC)` 治理、风险管理与合规：用于描述这三项实践及其相关活动的集成方法的术语。某些组织实施\
  \ GRC 计划以实现组织 GRC 的凝聚、整体方法，通过战略与组织目标的对齐，确保组织根据其内部政策、外部合规要求和风险偏好行动。\n\n`Gramm-Leach-Bliley\
  \ Act (GLBA)` 又称为 1999 年金融服务现代化法，要求金融机构保护个人的非公开个人信息。\n\n`guidelines` 指南：提供一般指导或建议，但未明确规定强制性要求的文档或说明。\n\
  \n`hashing` 哈希：一种单向函数，使用算法将信息转换为数据字符串，通常用于完整性检查。\n\n`Health Information Portability\
  \ and Accountability Act (HIPAA)` 健康信息可携带性责任法案：一项美国联邦法规，涵盖受保护健康信息（PHI）的处理，并为保护健康信息的安全和隐私提供框架。\n\
  \n`identification` 身份识别：主体提供信息以识别自身身份身份验证过程的第一步。此类信息可能包括用户名、账户号码或用户 ID。\n\n`income\
  \ statement` 损益表：组织在某时期内财务活动的总结。它列出了所有交易，包括收入、支出以及报告期间的任何利润或损失。\n\n`incremental`\
  \ 增量：一种执行多组开发活动的生命周期模型。生命周期的每个阶段都有预定的时间，并产生能力的完整增量。每个功能随后与之前阶段的功能集成以产生整个产品。\n\n\
  `integrity (of data)` 数据完整性：数据的准确性、一致性和有效性。\n\n`internal compliance` 内部合规：支持遵循源自组织内部政策或其他要求的活动。*参见*外部合规。\n\
  \n`key performance indicator (KPI)` 关键绩效指标：衡量组织执行特定工作效能的指标。\n\n`least privilege`\
  \ 最小权限：一种安全原则，认为授予用户的权限和访问级别应为执行工作或功能所需的最低水平。\n\n`malware` 恶意软件：设计用于入侵并非法访问计算机系统以造成破坏或干扰的软件。\n\
  \n\n\n\n\n# 强制访问控制 (MAC) 一种使用中心权威根据主体的 `clearance`（许可级别）和对象的 `classification`（分类）调节访问的访问控制模型。主体的许可级别必须大于或等于对象的级别。MAC\
  \ 模型通常用于专门的政府和军事系统，或特定的操作系统发行，例如由美国国家安全局（NSA）和红帽（Red Hat）开发的安全增强型 Linux（SELinux）。\n\
  \n# 消息认证码 (MAC) 一种加密函数，通过发送者和接收者共享的密钥提供完整性和真实性。MAC 使用哈希算法和某些模式下的对称加密算法创建。\n\n# 知情性原则\
  \ (need to know) 一种安全原则，要求用户访问特定信息时必须具有合法理由，例如为了履行其角色或职责。\n\n# NIST 网络安全框架 (NIST\
  \ CSF) 一由美国国家标准与技术研究院（NIST）开发的基于风险的网络安全框架。该框架最初为关键基础设施设计，但适用于任何组织。\n\n# NIST 特殊出版物\
  \ (SP) 由 NIST 发布的文件，为特定研究、业务、政府或工业社区感兴趣的主题提供详细信息。\n\n# NIST SP 800 系列 针对计算机安全的 NIST\
  \ 出版物。\n\n# NIST SP 800-37 目前为修订 2 版，名为《信息系统和组织的风险管理框架：安全与隐私的系统生命周期方法》，描述了管理安全和隐私风险的过程。\n\
  \n# NIST SP 800-53 标题为《联邦信息系统和组织的安全与隐私控制》，由安全和隐私控制目录组成，旨在帮助美国联邦政府机构满足 FISMA 的要求，并作为其他非联邦实体的最佳实践框架。\n\
  \n# 不可否认性 (nonrepudiation) 防止发送者合法地否认其曾发送过消息（例如数字签名）。\n\n# 北美电力可靠性协会关键基础设施保护 (NERC\
  \ CIP) 一套针对北美电网安全的网络安全标准。\n\n# 对象 (object) 一个实体，如网络、计算机、文件、设备、记录、表、进程、域、数据库或程序，包含被主体访问的信息。\n\
  \n# 开放 Web 应用安全项目 (OWASP) 一个致力于提高软件安全性的国际非营利组织。\n\n# 组织伦理 (organizational ethics)\
  \ 规范组织行为的原则，重点是以诚信、问责和负责任的态度行动。\n\n# 支付卡行业数据安全标准 (PCI DSS) 一个用于处理、处理和存储信用卡信息的组织标准和控制框架。\n\
  \n# 钓鱼攻击 (phishing) 通过伪装成受信任实体（通常通过电子邮件）获取敏感信息。\n\n# 物理控制 (physical controls) 为了保护人员、资产和设施免受物理威胁而采取的实体控制。示例包括围栏、照明、锁、护柱、服务器房门、报警器和安保人员。\n\
  \n# 明文 (plaintext) 以可读格式呈现的未加密或已解密的信息。\n\n# 预防性控制 (preventive controls) 防止或阻止不利事件或事故发生的控制。示例包括强制背景检查、防火墙访问控制列表\
  \ (ACLs)、门锁、围栏、护柱和 IPS。\n\n# 隐私 (privacy) 指个人对其自身敏感数据预期拥有的控制水平。这通常关注组织对其受托的个人信息进行的授权收集、使用、共享、存档和销毁。\n\
  \n# 1974 年隐私法案 (Privacy Act) 一项美国联邦法律，旨在通过关注政府收集和维护个人信息的需求与个人隐私权之间的平衡来解决隐私问题。\n\n\
  # 隐私影响评估 (PIA) 为评估隐私而开展的风险评估。\n\n# 隐私盾 (Privacy Shield) 欧盟-美国和瑞士-美国用于监管从欧盟和瑞士向美国交换信息的框架。\n\
  \n# 特权膨胀 (privilege creep) 用户逐渐获得超出其角色所需的访问权限（也称为授权膨胀）。\n\n# 流程（或程序）（processes or\
  \ procedures) 定义如何执行某些安全功能的逐步工作流。它们通常定义了谁负责这些活动以及如何执行。\n\n# 定性风险分析 (qualitative\
  \ risk analysis) 一种主观的、不使用金额的风险分析（尽管可能仍涉及计算）。\n\n# 质量 (quality) 交付物满足项目需求和客户期望的程度（功能性、设计、价格、进度等）。\n\
  \n# 质量保证 (QA) 提供确保满足质量要求的的活动。\n\n# 质量控制 (QC) 检测并确保产品或过程符合既定要求的活动。\n\n# 质量管理体系 (QMS)\
  \ 旨在确保达到预期质量水平的过程和活动集合，结合质量保证和质量控制实践。\n\n# 定量风险分析 (quantitative risk analysis) 一种用于计算与特定威胁相关的货币损失的风险分析。这是通过为分析中的每个因素分配数值来实现的。\n\
  \n# 勒索软件 (ransomware) 一种强制受害者在支付赎金或损失价值资产之间选择的恶意软件。\n\n# 恢复控制 (recovery controls)\
  \ 将环境或操作恢复正常功能的控制。它们在功能上类似于纠正控制，但被认为具有高级能力。示例包括从备份恢复系统、从受感染系统中删除恶意软件，以及利用看狗进程（该进程可以判断服务已停滞并重启）。\n\
  \n# 责任矩阵 (RACI 图表) 一种用于划分满足项目交付物所需的每个活动或任务责任的矩阵。\n\n# 风险 (risk) 威胁主体利用漏洞的可能性以及相应的业务影响。\n\
  \n# 风险接受 (risk acceptance) 一种风险处理方法，决定继续某活动，是因为确定风险处于可接受水平，或者是因为缓解成本相对于潜在影响过高。\n\
  \n# 风险规避 (risk avoidance) 一种风险处理方法，决定不进行某活动，因为执行该活动的风险高到无法接受（即完全停止该风险活动）。\n\n# 风险管理\
  \ (risk management) 识别和评估风险、将其降低至可接受水平并实施维持该水平的机制的过程。\n\n# 风险缓解 (risk mitigation)\
  \ 一种风险处理方法，采取行动减少或最小化风险的影响，通常通过实施控制（应对措施）。\n\n# 风险转移 (risk transference) 一种风险处理方法，将风险转移给另一个实体。风险转移通常通过购买保险或将活动外包给承担风险的另一个实体来实现。\n\
  \n# 基于角色的访问控制 (RBAC) 一种根据主体在组织中的角色执行访问的访问控制模型。每个角色被分配某些权限，用户根据其职分配到角色。\n\n# 根内核\
  \ (rootkit) 允许未经授权访问计算机并掩盖其存在的恶意软件。\n\n# 2002 年萨班斯-奥克斯莱法案 (SOX) 一项美国联邦法律，侧重于让会成员和高管对其组织财务报表的准确性负责。\n\
  \n\n\n\n\n`scope` 待执行工作边界的定义。\n\n`scope creep` 项目范围的不受控增长。\n\n`security` 处于安全状态，或免受潜在伤害的自由。\n\
  \n`security business drivers` 对安全产生影响的业务特征。\n\n`security control` 也称为保护措施或应对措施，是一种为了降低风险并保护资产的机密性、完整性或可用性而实施的机制（如流程或技术）。\n\
  \n`security engineering` 工程领域的一个分支，涉及解决系统需求、设计和实现过程中的安全问题。\n\n`security operations`\
  \ 专注于积极执行日常职能，以防止、检测和响应安全风险及威胁。\n\n`security situational awareness` 了解组织拥有哪些资产、资产所在位置以及每个资产的安全态的实践。\n\
  \n`Service Organization Controls (SOC) audit` 由第三方对服务机构（如云服务提供商）进行的审计，该第三方负责评估服务机构的内部控制。\n\
  \n`Single Loss Expectancy (SLE)` 单次威胁事件的潜在损失价值。该事件可能适用于单个资产或一组资产。公式为：\n\n```\nAsset\
  \ Value (AV) × Exposure Factor (EF) = Single Loss Expectancy (SLE)\n```\n\n`social\
  \ engineering` 使用欺骗手段诱导某做可能不符合其利益的事。这种技术已被犯罪人员使用多年，是许多网络攻击中不可或缺的一部分。\n\n`standard`\
  \ 批准的模型，定义了作为比较基础的质量或特征。例如，`system configuration standard`为特定系统建立了批准的配置设置。\n\n`steganography`\
  \ 一种在显眼处隐藏秘密信息的技术，通常在看似无害的数字文件中。这是通过使用特殊软件实现的，将信息嵌入图像、视频、音频、文本或其他文件中。\n\n`subject`\
  \ 访问对象的活动实体，如个人、系统、进程或设备。\n\n`SWIFT` 结构化假设技术（Structured What If Technique），一种用于小组协作的结构化流程。它涉及使用引导词和其他元素进行脑风暴会议，以描述系统、识别并评估风险，并提出将风险降低至接受水平的行动。\n\
  \n`systems development life cycle (SDLC)` 开发或管理系统、产品或服务的生命周期模型。SDLC 的示例包括瀑布型、敏捷和增量。\n\
  \n`technical controls` 提供安全控制功能的硬件或软件实现。示例包括加密、密码强制执行、多因子身份验证、入侵检测系统 (IDSs)、入侵预防系统\
  \ (IPSs) 和防火墙。技术控制也被称为 `logical controls`。\n\n`threat` 与漏洞利用相关的任何潜在危险。威胁是指某些或事物将识别特定的漏洞并利用其攻击组织或个人。\n\
  \n`Trojan` 伪装成有用工具的恶意软件。\n\n`virtual local area network (VLAN)` 可能与其他网络共享物理介质的逻辑网络。\n\
  \n`virus` 感染合法程序的程序或代码段以执行其恶意任务。\n\n`vulnerability` 可能被利用的弱点。它可以是软件、硬件、流程或人为的缺陷。\n\
  \n`vulnerability management` 在组织环境中识别、优先处理和修复漏洞的持续过程。\n\n`warm site` 资源未完全就绪的备数据中心。\n\
  \n`waterfall` 以线性顺序阶段为特征的分阶段开发周期，每个阶段在开始后续阶段之前必须完成。这种方法也称为传统的或分阶段的方法。\n\n`work breakdown\
  \ structure (WBS)` 将项目分解为分级工作元素（任务、子任务和交付物）的项目管理工具。\n\n`work factor` 克服安全防护并实施网络攻击所需的时间和资源。\n\
  \n`worm` 自身传播到其他系统的病毒。\n\n`Zachman Framework` 以其创始人 John Zachman 命名，一种用于查看和定义企业架构的框架。##\
