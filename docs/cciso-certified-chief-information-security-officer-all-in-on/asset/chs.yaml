  \n## 引言\n\n*安全是凡人的敌人*——赫卡忒，选自《麦克白》\n\n随着许多组织面临日益增长的数字威胁，安全专业人员的角色已经发生了演变。二十年前，首席信息安全官（CISO）甚至不存在，但现在超过\
  \ 60% 的财富 500 强企业都有一名 CISO 来守护其组织。CISO 角色的兴起和发展是由等问题驱动的：\n\n- CISO 在组织结构中处于什么位置？\n\
  - CISO 与其他 C 领导者之间是什么关系？\n- 成为成功的 CISO 需要什么资质？\n- 拥有 CISO 对业务意味着什么？\n\n随着越来越多的组织采用安全实践，这些问题的答案不断演变。与许多行业一样，信息安全领域包含了专业组织和标准机构，它们负责制定标准并认证人员。有时这些小组仅仅反映了当前的趋势和实践，而另一些则起到领导作用并引导整个行业。CCISO\
  \ 认证的管理机构 EC-Council 似乎正在向后者发展。CCISO 认证的存在本身就开辟了先河。虽然其他少数机构也提供 CISO 认证计划，但没有一个获得广泛关注。EC-Council\
  \ CCISO 是唯一被纳入美国国防部 `DoD8140/8570` 批准基准认证的 CISO 特定认证。\n\n对于有志的 CISO，EC-Council CCISO\
  \ 计划提供了一个模板，定义了每个 CISO 都应该具备的核心知识和技能。对于寻求建立 CISO 职位或招聘 CISO 的组织，该认证不仅提供了一个优秀 CISO\
  \ 应该具备的技能画像，还提供了一种独立验证特定候选人资质的手段。\n\n有人认为认证 CISO 是一种谬误，因为在涉及 CISO 方面没有一种一刀切的方法。诚然，CISO\
  \ 的角色根据其所属的行业、组织的规模和性质以及其个人的背景和性格而存在差异。软件产品供应商的 CISO 其关注点可能与公用事业供应商的 CISO 大不相同。然而，所有\
  \ CISO（以及所有安全专业人员）都应该具备核心技能。CCISO 认证关注的这些核心技能。\n\n安全不是二元化的，即一个组织要么安全要么不安全。相反，安全是一个滑动比例：一个组织可以拥有大量的安全并将风险降至最低，也可以只有极少的安全并面临巨大的风险。CISO\
  \ 的工作是根据组织对风险的容忍度来决定需要多少的安全措施。\n\n\n\n\nCISO（首席信息安全官）的方法很大程度上受到其自身世界观的影响。作者认识的一位\
  \ CISO 具有执法背景，这影响了他处理公司信息安全计划的方法。他公司的安全计划强调事件检测与响应，而非安全的其他方面。许多组织的安全计划都反映了其各自 CISO\
  \ 的个性或背景。CCISO 认证并非试图改变这种动态，而是试图确保无论谁负责，都能应用良好的安全实践。如果我们这位朋友的检测与响应方法符合其公司的业务和威胁环境，那么他的方法可能是完全适当的。CCISO\
  \ 项目让 CISO 了解任何安全计划的核心要素，CISO 然后可以根据许多因素（包括组织对风险的忍度以及 CISO 自身的特征和经验）进行塑造。\n\nCCISO\
  \ 认证反映了当今 CISO 群体的现状：其中一些人是从技术层晋升上来的，但缺乏业务敏锐度；另一些人已经是业务领导者，但可能缺乏技术或安全背景。CCISO 认证为每一类人建立了核心标准。对于从技术层晋升为\
  \ CISO 的技术导向型安全专业人员，CCISO 项目通过涵盖战略规划、财务、会计和资源管理等主题，将其技能树扩展到了技术领域之外。这些主题对 CISO 非常重要，但可能未包含在诸如\
  \ (ISC)2 的 CISSP 或 CompTIA 的 Security+ 等传统安全专业人员认证计划中。同样，对于没有信息技术或安全背景但具有业务经验并担任\
  \ CISO 职位的业务领导者，CCISO 项目教授的技术主题深度也达到了大多数 CISO 应该理解的水平。\n\n## 关于 EC-Council\n\n国际电子商务顾问理事委员会（International\
  \ Council of E-Commerce Consultants，简称 EC-Council）成立于 2003 年，旨在提供安全教育、培训和认证计划。EC-Council\
  \ 最为广为人知的可能可能是其认证伦理黑客 (CEH)、计算机黑客取证调查员 (CHFI)、认证安全分析师 (ECSA) 和许可渗透测试员认证。如所述，EC-Council\
  \ 也是认证首席信息安全官 (CCISO) 的认证机构，该认证旨在为安全执行高管提供认证计划。\n\n## 认证流程\n\n本节概述了 EC-Council 获得\
  \ CCISO 认证的流程。该流程在图 1 中所示。获得认证主要有三种途径：\n\n- 通过自学获得 CCISO 认证\n- 通过 EC-Council 认可的培训获得\
  \ CCISO 认证\n- 为不符合 CCISO 先决条件的个人提供的 EC-Council 信息安全经理 (EISM) 认证计划\n\n![Images](img/FM-01.jpg)\n\
  \n**图 1** EC-Council 认证流程\n\n### EC-Council 要求\n\nEC-Council 的认证要求经常变化，因此候选人检查 EC-Council\
  \ 网站获取最新信息非常重要。本节列出的要求在写作时是准确的。\n\n### 先决条件\n\nCCISO 考试资格根据候选人的经验年限决定：\n\n- 领域 1：治理与风险管理\n\
  - 领域 2：信息安全控制、合规性与审计\n- 领域 3：安全计划管理与运营\n- 领域 4：安全核心能力\n- 领域 5：战略规划、财务与供应商管理\n\n\
  要符合在不获得 EC-Council 培训（自学）的情况下参加 CCISO 考试，候选人必须证明在五个领域均具有五年的经验。或者，如果候选人完成了 EC-Council\
  \ 认可的培训，则只需在五个领域中的三个领域具有五年的经验。\n\nEC-Council 信息安全经理 (EISM) 认证计划是对不符合所需经验人员的第三种选择。候选人可以参加\
  \ EC-Council 的培训，参加 EISM 考试（CCISO 考试的简化版），通过考试后追求 CCISO 认证。\n\n![Images](img/note.jpg)\n\
  \n**注意** 某些学位和认证可计入最低经验要求。欲了解认可的豁免列表，请访问 EC-Council 网站。\n\n## 培训选项\n\n获得认证主要有两种培训途径：\n\
  \n- 自学：自学选项（例如使用 `CCISO Certified Chief Information Security Officer All-in-One\
  \ Exam Guide`）适用于在五个领域中均具有必要经验的 CCISO 候选人。\n- 培训：EC-Council 以及 EC-Council 认可的培训机构提供\
  \ EC-Council 认可的 CCISO 培训课程。对于那些最适合通过营训练式学习的 CCISO 候选人或不符合自学经验要求的候选人来说，这条路线可能更理想。此外，对于有兴趣参加\
  \ EISM 考试并以后追求 CCISO 认证的 EISM 候选人来说，这也是一项要求。\n\n## 考试流程\n\n考试流程根据选择的培训选项和计划而异：\n\
  \n- 自学：要获得考试资格，自学候选人必须在 EC-Council 网站上完成考试资格申请（写作时费用为 `$100`），并列出他们所有的经验、认证和学位（如适用），以证明他们在每个\
  \ CCISO 领域中都具有必要的年限（五个领域均需五年）。一旦候选人的申请被接受、核实并批准，候选人可以从 EC-Council 购买考试券（写作时费用为 `$999`）以参加\
  \ CCISO 考试。通过考试后，候选人将获得 CCISO 认证。\n- 培训：在完成 EC-Council 认可的 CCISO 培训课程后，CCISO 候选人需要提交考试资格申请，证明在五个领域中的至少三个领域具有五年的经验。通过考试后，候选人将获得\
  \ CCISO 认证。\n\n\n\n\n- **EISM 计划** 在完成 EC-Council 认可的 CCISO 培训课程后，EISM 候选人可以从 EC-Council\
  \ 获得考试券参加 EISM 考试。通过考试后，候选人将获得 EISM 称号。一旦候选人获得了追求 CCISO 认证所需的经验积累（在至少三个领域拥有至少五年的经验），候选人必须提交考试资格申请（Exam\
  \ Eligibility Application）。一旦申请获得接受、验证并批准，候选人可以以半价从 EC-Council 获得考试券以参加 CCISO 考试。通过考试后，候选人将获得\
  \ CCISO 认证。\n\n## 考试信息\n\nCCISO 考试由 150 道基于场景的多选题组成。候选人有 2.5 小时完成考试，并且必须达到至少 72%\
  \ 的分数。CCISO 考试包含三种类型的题目，按难度递增顺序列如下：\n\n- **知识** 这类题目仅测试候选人回忆信息的能力。这通常体现在测试候选人对定义的理解或对术语的掌握的问题中。\n\
  - **应用** 这类题目测试候选人应用概念的能力。这要求对该概念有了解以及如何应用该概念的理解。\n- **分析** 这类题目最为严谨。它们测试候选人分析场景并识别正确行动方案的能力。\n\
  \n与 CCISO 考试类似，EISM 考试也是 150 道题。EISM 考试基于与 CCISO 考试相同的题目，但不包含基于场景的（分析）题。此外，EISM\
  \ 考试必须在 2 小时内完成，及分为 70%。获得 EISM 认证的候选人在一旦满足 CCISO 认证的经验要求后，可以以优惠的价格参加完整的 CCISO 考试。\n\
  \n## 如何使用本书\n\n本书按章节组织，对应 EC-Council 定义的 CCISO 领域。每个章节涵盖了 EC-Council 考试目标所需的主题。在某些情况下，这种方法会导致内容重叠，因为\
  \ EC-Council 在多个领域中列出了某些主题。在某一主题出现在多个章节的情况下，我们尽量避免重复信息，转而提供该主题的视角视角。例如，`资产安全`这一主题在`第\
  \ 1 章`中从风险管理过程的角度进行讨论，在`第 3 章`中从资产管理的角度进行讨论，在`第 4 章`中从资产安全的角度进行讨论。\n\n此处对本书每个章节进行了介绍：\n\
  \n- **`第 1 章, “治理与风险管理”`**涵盖了 CISO 的基础概念。它侧重于 CISO 如何确保组织的安全计划与组织的业务保持一致。该章节涵盖了信息安全治理、信息安全基础、典型信息安全计划的概述，以及与安全相关的法律和框架说明。\n\
  - **`第 2 章, “信息安全控制、合规性与审计管理”`**描述了组织如何建立和实施安全控制、控制框架和控制生命周期。它还对信息安全审计概念和流程进行了广泛覆盖。\n\
  - **`第 3 章, “安全计划管理与运营”`**讨论了 CISO 如何定义和管理安全计划。该章节涉及了计划管理方法和流程，以及资源和预算管理。该章节还涉及安全项目管理，因为安全计划通常除了持续的安全工作流之外还包含项目。\n\
  - **`第 4 章, “信息安全核心能力”`**包含了每个 CCISO 都应该熟悉的广泛的主题。每项能力都与其他几项能力相关，但它们之间的关系非常复杂，因此不影响能力在章节中呈现的顺序。核心能力按照最易解释的顺序排列。该章节开头是描述最常见的网络攻击类型和方法的章节，然后是涵盖技术安全能力的章节，最后是以管理和流程为导向的能力章节。\n\
  - **`第 5 章, “战略规划、财务、采购与供应商管理”`**讨论了组织如何利用战略规划来建立目标并定义实现这些目标的计划。它还描述了 CISO 如何利用战略规划来定义和实施信息安全计划。本章节涵盖了对\
  \ CISO 重要的管理主题，包括会计、财务和采购，以及一个描述管理组织第三方和供应商方法的章节，以确保他们不会为组织的企业引入漏洞。\n\n每个章节都以一个简短的大纲和介绍所涵盖主题的正文开头，随后是与大纲对应的章节。在每个章节中，将利用以下功能提供补充信息，帮助你理解和记忆各种主题：\n\
  \n![Images](img/note.jpg)\n\n**注意** 笔记（Notes）贯穿全书，用于突出或强化主题或提供建议。\n\n![Images](img/tip.jpg)\n\
  \n**提示** 提示（Tips）提供节省你精力和时间的信息。提示可能包括技巧、捷径或帮助你记住某个主题的建议。提示也可能用于提供概念或过程的真实世界示例。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示** 这些针对性的提示（EXAM TIP）提供了 CCISO 候选人在参加 CCISO 考试应掌握的关键信息。考试提示可能包括应试建议或对考试陷阱的警告。\n\
  \n除了笔记、提示和考试提示之外，你还会遇到阴影框，它们用于深入探讨主题、展示案例研究或分享说明或强调章节中主题的轶事。\n\n与所有 McGraw Hill\
  \ All-in-One 考试指南一样，本书利用重复作为辅助手段，以强化所提供的信息并将其转化为长期记忆。\n\n\n\n\n\n3.  将困难主题列表作为学习列表，返回并重读书中相关的章节，并做笔记或使用你过去有效的学习方法。\n\
  \n4.  重复阅读、测试和学习的循环，直到你在使用 `TotalTester Online` 练习题时，在每个领域的得分都能稳定保持在 80% 以上。\n\n\
  一旦你在每个领域的得分都能定期达到 80% 或以上，你就应该准备好自信地参加 CCISO 考试了。\n\n# 第 1 章\n\n## 治理与风险管理\n\n本章讨论了以下主题：\n\
  \n- 治理\n- 信息安全管理结构\n- 信息安全原则\n- 风险管理\n- 管理与技术信息安全要素\n- 合规性\n- 隐私\n- 法律和法规驱动因素\n\
  - 标准与框架\n- 信息安全趋势与最佳实践\n- 信息安全培训与认证\n- 伦理\n\n本章描述了组织信息安全计划如何与整体业务相关，并讨论了信息安全计划的关键组成部分和目的。本章还讨论了信息安全计划如何确保组织符合与业务相关的法律法规，以及如何使用框架来指导信息安全计划的设计和实施，以实现合规成功。\n\
  \n作为安全顾问，我们经常听到客户说：“我们的组织是特殊的，所以我们不能像其他人一样应用安全。我们的 `fill in the blank` 是我们我们不能像其他公司那样做安全的原因。”当我们听到这种“我们是不同的”的论点时，我们的回答是：“既如此，也不如此。”事实是，每家公司和组织都是独特的。虽然良好的安全原则是不变的，但将这些安全原则应用于组织的特定情况，最终决定了成功或失败。每一位首席信息安全官（`CISO`）的关键在于理解组织的业务、目标、运营和对风险的容忍度，以便\
  \ `CISO` 能够创建一个`适用于组织`的安全计划。将组织的安全计划与组织的业务和运营相对齐，是任何安全计划成功的关键，也是 `CISO` 角色的核心所在。\n\
  \n### 治理\n\n任何对 `CISO` 角色的讨论都从治理开始。`治理`（Governance）是组织用于定义、实施和控制整个业务（如组织治理或公司治理）或组织特定部分（如\
  \ IT 治理、财务治理或信息安全治理）的系统。适当的治理可确保组织的战略与其业务、监管和运营环境保持一致。\n\n公司治理可以从两个角度来看：战略和权威。`治理策略`涉及定义和理解对组织重要的因素。一个典型的治理策略图描绘了组织确定的重要战略因素。`图\
  \ 1-1` 中的示例图表显示了所有输入治理策略的因素，因此显示了该策略应该实现的功能。例如，组织已经决定`透明度`是重要的，并且应该在组织的组织结构、文化、业务流程和业务运营中予以解决。\n\
  \n如前所述，组织治理的另一个角度是`治理权威`。这一视角描绘了组织结构和权威链，如 `图 1-2` 中的示例所示。\n\n![Images](img/F01-01.jpg)\n\
  \n**图 1-1** 治理策略策略图，显示了治理计划的战略因素\n\n![Images](img/F01-02.jpg)\n\n**图 1-2** 治理图，显示了权威链\n\
  \n每个组织都有某种程度的治理，尽管某些组织没有正式的治理计划。无论是正式还是非正式，组织的领导者都会在某一个时刻考虑组织的目标和业务环境，然后定义实现这些目标所需的战略、流程、控制措施、组织结构和业务功能。\n\
  \n公司治理有许多模型。在某些情况下，法律法规驱动了组织的治理要求。例如，在公共证券交易所上市销售股票的公司必须遵循交易所对公司治理的要求。例如，纽约证券交易所和\
  \ `NASDAQ` 股票市场都要求成员公司拥有包含以下要求的治理计划：\n\n- 独立董事会\n- 审计\n- 报告\n- 年度会议\n- 行为准则\n- 避免利益冲突\n\
  - 股东批准\n\n这些治理要求定义了公司必须做`什么`，但没有规定公司必须`如何`做这些事。\n\n国际标准化组织（`ISO`）正在制定 `ISO 37000`《组织治理指南》。该标准预计于\
  \ 2020 年完成。`ISO 37000` 旨在与监管政策一起使用，通过提供基于对什么是良好治理的全球共识的指导。\n\n### 信息安全治理\n\n信息安全治理是组织治理的一个子，涉及信息安全计划的战略方向、领导力和框架。信息安全治理框架指导安全计划的发展和维护。信息安全治理框架没有单一的标准，但该框架通常应包含以下要素：\n\
  \n- 与组织治理和组织目标对齐的信息安全战略定义\n- 信息安全组织结构\n- `风险管理` 的方法论\n- 信息安全`管理指令`（包括策略、标准、指南等）\n\
  - 对计划的持续测量和改进\n\n理想情况下，信息安全治理框架与组织治理框架对齐，并考虑塑造安全计划的内部和外部因素。\n\n塑造安全计划的外部驱动因素是：\n\
  \n- **监管驱动因素** 某些组织受法律及其相应法规的影响，这些法规影响安全计划。这些应该在治理层面解决，以确保组织合规。示例包括《健康保险流通与责任法案》（`HIPAA`），它对保护患者信息有要求；《萨班斯奥克斯利法案》（`SOX`），它对保护上市公司财务信息有要求；以及《格雷姆-莱奇莱莱法案》（`GLBA`），它对金融和保险公司有安全要求。这些法律将在本章稍后部分进行详细讨论。\n\
  \n\n\n\n\n## 行业实践\n\n某些组织的安全计划受其运营行业所适用标准和实践的影响。其中一个例子是支付卡行业数据安全标准（`PCI DSS`），它为处理或处理信用卡数据或交易的公司定义了安全要求。另一个是美国国家标准与技术研究所（`NIST`）的《提高关键基础设施网络安全框架》（通常称为\
  \ `NIST Cybersecurity Framework`），这是一个自愿性框架，为以下关键基础设施领域的组织提供指导：化学、商业设施、通信、关键制造业、大坝、国防工业基础、应急服务、能源、金融服务、食品与农业、政府设施、医疗与公共卫生、信息技术、核能、交通以及水务系统。尽管它最初是为关键基础设施组织开发的，但它也被非关键基础设施实体使用。\n\
  \n## 风险与威胁\n\n每个组织都运行在自己的威胁环境中（本章稍后将详细介绍风险和威胁）。例如，由于需要保护的资产性质以及潜在对手的特征和意图不同，支持军事的政府机构与百货商店面临的威胁不同。每个组织都必须理解自己的威胁和风险环境，并建立其安全计划来应对这些问题。\n\
  \n## 塑造安全计划的内部驱动力\n\n### 领导层的理解与感知这可能是 `CISO` 工作中最挑战性的方面之一。安全始于组织的顶层。因此，一个成功的安全计划取决于领导层对安全的理解与\
  \ `CISO` 的理解保持一致。`CEO` 或组织负责人不需要是安全专家，但他们确实需要对安全对组织的重要性有准确的理解。`CISO` 的工作职责之一是评估并在必要时提高领导层对安全的掌握。\n\
  \n### 管理结构\n`CISO` 以及最终的安全组织在管理结构或组织构型中处于什么位置？答案因组织而异，没有所谓的“正确”答法。在某些组织中，`CISO`\
  \ 直接向 `CEO` 汇报，并拥有与首席财务官（`CFO`）或首席信息官（`CIO`）等其他 C 级高管同样的权限。在其他组织中，`CISO` 向另一位 C\
  \ 级高管（如 `CIO` 或 `CFO`）汇报。事实上，后者比前者常见。任何方法都可以成功；关键不在于 `CISO` 在组织中的位置，而在于 `CISO` 与\
  \ `CEO` 及领导层之间存在的沟通。`CEO` 必须对威胁和风险环境有准确的理解，领导层与 `CISO` 之间对组织的安全策略应达成共识。\n\n### 沟通扩展前两个内部驱动力，如果组织结构或高管的人格/风格促进了有关组织安全的信息和想法交换，那么安全计划成功的可能性更高。有时，如果\
  \ `CISO` 汇报给另一位高管而非 `CEO`，可能会导致防火墙阻碍 `CISO` 与领导层之间达成一致。但决定因素并不一定是组织结构——沟通才是关键。\n\
  \n### 文化与氛围\n\n公司和组织的存在是为了实现其业务目标。对于组织来说，最重要的是制造产品、提供服务、产生销售等。信息安全在重要性列表中通常排得很后。经理需要运营其组织或小组来实现目标；员工希望尽职工作，获得良好的绩效评估和加薪，并职业发展。安全如何融入组织文化？理解安全在文化光谱中处于什么位置、可以处于什么位置以及应该处于什么位置是安全计划的重要驱动力。\n\
  \n### 历史与教训\n\n每个安全计划都应该有一个反馈回路，以衡量计划的性能并根据情况对其进行更改，即使是在最高（治理）层面。没有什么能比安全泄露更能让组织对安全产生不同的思考了。从对性能的正式衡量或现实世界事件（如安全事件）中获得的教训，是影响安全计划治理决策的驱动力。\n\
  \n图 1-3 显示了安全治理框架的一个示例。基于信息安全驱动力，安全治理定义了整体安全策略和计划的关键要素，在这种情况下包括安全组织及相关的角色和职责、安全策略和支持文档，以及企业信息安全架构（`EISA`）。策略和\
  \ `EISA` 将本书的第五章](#ch5.xhtml) 中详细讨论。\n\n![Images](img/F01-03.jpg)\n\n**图 1-3** 安全治理框架示例\n\
  \n`CISO` 应该在一个文件中定义组织的安全治理，该文件有时被称为`安全计划书`或`安全章程`。这份文档以及治理本身应该是一个活的准则。它应该随着时间的推演变，并始终反映当前的方法。这份安全章程应该显示安全计划如何与组织目标和治理保持一致。\n\
  \n安全治理的一个关键方面是衡量和监控治理本身。通常，这些衡量是为了支持组织对安全投资回报率（`ROI`）的理解。组织应该知道安全支出是否充足，以及安全计划是否实现了其目标。在许多组织中，`CISO`\
  \ 花费大量时间衡量、理解、沟通并向整个组织证明信息安全计划的经济价值。这些促进计划持续改进的衡量是通过工具和报告实现的。这些工具包括平衡计分卡，以及多种用于收集、分析和展示有关各种指标信息报告的商业应用程序。\n\
  \n## 业务形式与安全泄露的责任\n\n有几种类型的业务形式或实体，根据所有权、管理结构、责任和税务责任等因素而异。对于 `CISO` 来说，重要的是业务形式如何与信息安全相关。由于安全本质上是风险管理，每种业务形式在安全和隐私责任方面都有其特点。\n\
  \n\n\n\n\n# 独资企业或合伙企业\n独资企业由个人个人所有；普通合伙企业由两人或更多人所有。在独资企业和普通合伙企业中，所有者管理并控制业务运营，并对实体的行为承担个人责任。这意味着所有者可能被认为对组织的安全泄露有个人责任，并且他们的个人资产可能面临暴露风险。即使某个合伙人本人没有直接参与不当行为，事实也是如此，因为普通合伙人对其合伙人的不当行为负责。有限合伙企业与普通合伙企业的区别在于，它们是由所有者/经理（普通合伙人）和投资者（有限合伙人）组合的所有。有限合伙企业的普通合伙人管理并控制业务运营，与普通合伙企业一样，对实体的行为承担个人责任。有限合伙人通常不对有限合伙企业的行为负责（除非他们个人参与了不当行为），其风险通常限于其投资金额。\n\
  \n# 公司\n公司由股东所有，并由董事会和向董事会报告的官员运营。公司比独资企业或合伙企业提供更高水平的责任保护。个人股东、官员和董事通常不对第三方负责，但如果能够证明他们对索赔人（过失受害者）负有义务，他们可能对自己的过失行为承担个人责任。公司通常同意此类个人（即提供辩护并涵盖任何判决或和解），前提是该个人在公司职责范围内行动且没有违反任何法律。公司提供赔偿协议的价值在部分取决于公司是否有能力提供（即有能力支付）该赔偿。公司本身可能对安全泄露及其产生的影响负责。请注意，还存在小型公司（有时被称为“封闭式”公司），它们仅由少数几个甚至一个股东组成。在这些情况下，个人可能面临更大的潜在责任，因为公司本身可能没有资源来辩护或支付索赔费用。\n\
  \n# 有限责任公司 (LLC)\nLLC 在税务目的上被视为合伙企业（即它们通常是税务“穿透”实体），但在管理和责任目的上的结构类似于公司。它们根据所有权比例由一个或多个个人（称为“成员”）所有。LLC\
  \ 成员的责任保护和风险与公司相似。\n\n# 非营利组织\n非营利组织将其利润用于慈善目的。非营利组织是特定类型的公司，也可以是 LLC。在任何情况下，所有者都受到安全泄露引发责任的保护，前提是他们个人没有违反任何法律。与公司一样，非营利实体对安全泄露和违规行为负责。然而，非营利组织的一个有趣特点是，它们有时拥有显著且著名的捐赠者，这些人士希望非营利组织保护他们的声誉免受安全泄露造成的损害。在本书作者的一次参与中，非营利实体的安全决策部分是出于保护捐赠者的意图，不是为了防止个人责任，而是为了防止对其声誉的潜在损害。\n\
  \nLLC、公司和非营利组织提供的责任保护具有局限性。董事会的责任保护仅在董事履行了其“尽职义务”时才适用。尽职义务是在特定情况下“理性人会做的事”。考虑以下情况：首席信息安全官（CISO）建议董事会，除非实施特定的控制，否则公司将受到攻击且客户个人信息将暴露。董事会忽略了这一建议，黑客利用漏洞窃取了客户数据。在这种情况下，董事可能被发现未履行其尽职义务，并可能对客户的损害或赔偿承担责任。这些实体的经理、官员和董事可以主张商业判断规则的保护，如果他们能够证明其在采取相关行动时行使了商业判断，即使该判断是错误的，该规则也能保护他们免受责任。这为个人提供了比简单的尽职义务标准更大的行动灵活性，但该规则在诉讼中通常会引起激烈争议，并涉及竞争性专家证人的证词。\n\
  \n## 信息安全管理结构\nCISO 的工作是创建并领导正确的管理和组织结构，以实现安全功能。如果说 `治理` 定义了信息安全计划的战略，那么 `组织结构`\
  \ 则实现了其执行。该结构由部门、人员、资源、分配的职责和通信线路组成。这些特征可以以无限的方式进行定义和安排。CISO 的工作是创建最优组织来满足安全计划的目标。本节讨论了信息组织的规模和管理。信息安全计划组织的角色和职责、人员配备和其他细节将在第\
  \ 3 章中讨论。\n\n## 规模确定\n信息安全组织应该是多大或多小？多少安全才是合理的？许多 C 级高管喜欢将自己的组织或公司的规模和支出与行业内的其他类似组织进行比较。事实上，有第三方和行业团体会对信息安全领导者和经理进行调查，以获取规模信息并发布结果。与其他组织进行比较提供了有趣的数据点，但不应将其作为确定安全组织规模的驱动因素。相反，应该根据组织对风险的容忍度来确定规模。将在本章稍后的风险管理部分进行更详细的讨论。基本原则是，年度安全支出应为保护组织信息资产所需的费用。\n\
  \n一些发布安全支出趋势的第三方团体包括普华、Gartner、Forrester 和 InformationWeek，尽管还有许多其他。这些机构发布了有关安全支出与其他组织指标比较的数据，以及这些数字随时间的变化。以下是一些广泛公布的规模数据和趋势：\n\
  \n- 一个行业来源报告称，2018 年人均年度安全支出为 1178 美元（2012 年为 584 美元）。\n- 每全职员工的信息安全支出范围在 1000 美元到\
  \ 3000 美元之间。\n- 安全支出占 IT 支出的百分比从 1% 到 15% 不等，取决于报告来源和分析的行业。许多调查报告的平均值为 6%，某些报告的安全支出占\
  \ IT 支出的百分比高达 30%。\n- 信息安全支出占公司收入的 0.2% 到 0.9%。\n\n\n\n\n\n正如此列表所示，信息安全支出差异巨大；因此，与其他组织的比较价值有限。尽管如此，许多首席执行官或领导仍会询问他们的信息安全官（CISO）：“既然我们行业的支出是\
  \ Y，为什么我们的信息安全支出是 X？” CISO 最好知道这个答案。影响安全组织支出和规模的因素非常多，以下是其中几个：\n\n- 资产价值，尤其是对组织最重要的资产\n\
  - 风险和威胁的类型和频率\n- 组织安全态势的现状\n- 监管要求\n\n## 管理结构\n\n信息安全组织的结构应该是最符合整个组织整体的结构。无论选择何种具体结构，管理结构都应该包含以下元素：\n\
  \n- **清晰的权限链（指挥链）**：信息安全组织应该有明确定义的汇报路线和权限链线。每个职能、部门和角色都应该明确指定负责人以及向更高层级权威汇报的路径。这提供了恰当的监督。\n\
  - **态势感知**：结构应该为 CISO 提供整个安全计划执行情况的视图，使 CISO 了解所有资产的安全态势以及计划各个方面的现状。\n- **内部和外部通信与报告**：结构应该提供报告安全组织内部及外部最核心信息的方法。关键在于与公司领导层以及安全组织之外的所有部门和小组进行通信。\n\
  \n有许多类型的组织结构和框架可以用于实施安全组织。以下是几种常见的类型：\n\n- **层级化（分级）**：从上到下拥有指挥链组织是层级化的。因此，组织中的每个实体都隶属于另一个（且仅一个）实体，CISO\
  \ 除外，它位于信息安全组织的顶端。层级结构提供了清晰的汇报路线、严密的控制和定义明确的角色。然而，层级结构也可能是官僚的，导致决策缓慢和成本增加。\n- **扁平化（水平化）**：也称为有机组织，扁平化组织与层级组织相反，实体可以拥有多个高级实体。这创建了一个扁平实体网络。扁平化组织赋予实体（或个人）更多责任并需要更多协作。扁平化组织比层级组织需要的管理层级少，可能适用于小型组织，因为组织越大，维持扁平结构就越困难。\n\
  - **矩阵型**：矩阵结构可以被看作层级和扁平化的混合体。汇报关系更像是一个网格而非层级或网络。例如，在矩阵组织中，工程师可以是工程部门的成员并向工程经理汇报，同时该工程师也可能是产品团队的一部分并向产品经理汇报。矩阵结构可以是共享资源和更高效使用资源的好方法。然而，矩阵组织也可能导致困惑甚至冲突，因为有许多具有潜在竞争目标和优先级的经理。\n\
  \n我们遇到的大多数信息安全组织都是层级化的。这些组织结构可以围绕顶层实体构建，这些实体可以是职能性的（如安全工程、安全运营、事件管理等）、部门性的（如美洲、欧洲、亚洲等）或基于产品的（如飞机、火车、汽车等）。我们所熟悉的大多数信息安全组织都是职能性的。典型的示例如图图\
  \ 1-4\n\n**图 1-4** 信息安全组织架构图示例\n\n## 信息安全原则\n\n本节描述了信息安全的核心原则，这些原则是所有信息安全计划的基础。尽管本书的读者可能已经熟悉这些概念，但我们包含它们是为了建立贯书中使用的术语，并回顾这些关键的信息安全要素。关键的信息安全原则包括：\n\
  \n- CIA 三要素学\n- 安全漏洞、威胁、风险和暴露\n- 网络攻击要素\n- 深度防御\n\n## CIA 三要素学\n\n信息安全的三个基本原则是：\n\
  \n- `机密性 (Confidentiality)`\n- `完整性 (Integrity)`\n- `可用性 (Availability)`\n\n这些被称为\
  \ CIA 三要素学，如图图 1-5\n\n**图 1-5** CIA 三要素学\n\n*机密性*指的是对数据的保护，以确保只有授权查看的人才能访问数据。机密性破坏的示例是攻击者窃取信用卡数据。机密性保护确保数据处理系统中执行了必要的保密级别，并防止机密信息的未经泄露。数据存储在系统和设备中、传输以及到达目的地后，都应该存在这种机密性。\n\
  \n*完整性*指的是数据的准确性。完整性攻击的示例是攻击者破坏网站或更改文件内容。完整性保护确保数据准确可靠，并防止未经授权或无意的修改。硬件、软件和通信机制必须协同工作，以正确地维护和处理数据，并将数据移动到预期目的地而不发生意外更改。系统和网络应该受到保护以防止未经授权的干扰和污染。\n\
  \n*可用性*指的是对系统的保护，确保可靠地访问数据和资源。可用性受损的示例是攻击者中断网站运行以防止访问，这被称为*拒绝服务 (DoS)* 攻击。网络设备、计算机和应用程序应该可用以执行其工作。它们应该能够安全地从中断中恢复，使生产力不受负面影响。必须建立必要的保护机制，以防御可能影响所有业务处理系统可用性和生产力的内外威胁。\n\
  \n## 安全漏洞、威胁、风险和暴露\n\n一个重要的概念是漏洞、威胁、风险、暴露和防御措施之间的关系。\n\n- **漏洞**：任何可能被利用的弱点。缺陷可以是软件、硬件、流程或人为。示例包括应用程序漏洞、未修补的系统、配置错误的网络设备和未锁的门。\n\
  - **威胁**：与利用漏洞相关的潜在破坏性事件。利用漏洞的活动者被称为*威胁主体*。\n- **风险**：漏洞可能被利用的概率以及此类事件相应的影响。风险将漏洞、威胁和利用概率与由此产生的业务影响联系起来。\n\
  - **暴露**：发生安全违规的可能性。例如，一个未修补的系统会使组织面临潜在损失的风险。\n\n\n\n\n\n- **对措施**：为了减轻风险而实施的控制措施。控制包括使用访问控制列表、部署防火墙、强制强密码以及使用加密。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示**：CCISO 候选人应该对基础信息安全术语有实际性的理解，例如漏洞、威胁、风险、暴露和对措施。\n\
  \n## 网络攻击的要素\n\n`Cyberattacks` 是恶意攻击者为了获取访问权限或破坏信息系统，并意造成破坏或伤害而采取的蓄意行为。网络攻击通常涉及攻击者执行以下步骤：\n\
  \n1. **侦察** (Reconnaissance)\n2. **枚举** (Enumeration)\n3. **利用** (Exploitation)\n\
  4. **目标达成** (Action on objectives)\n\n### 侦察\n\n攻击的第一步是攻击者收集有关目标组织的信息。攻击者通过进行网络搜索、检查组织及其员工的社交媒体账号、阅读新闻稿和媒体文章、参加会议、研讨会或贸易展览，甚至在物理上观察组织的员工或设施来研究并了解目标。攻击者试图尽可能多地获取关于目标的信息，例如：\n\
  \n- 域名\n- 公司信息\n- 网络拓扑\n- 员工和关键经理姓名\n- 电子邮件地址和电话号码\n- 社交媒体活动和朋友\n- 设施位置和布局\n- 入口/出口细节\n\
  \n一旦收集了这些信息，它们就构成了攻击下一步的基础。\n\n### 枚举\n\n在这一阶段，攻击者试图识别组织的信息资产以及相应的漏洞，以便在下一阶段利用。根据从侦察活动中收集的数据，攻击者分析侦察结果，试图识别特定目标，如人员、组织、部门、设施、能力、数据、供应商名称和信息系统。攻击者可能会对环境进行扫描以生成系统列表，然后进一步探测以发现可能被利用的漏洞。此阶段的首要目标是对组织的系统和数据进行枚举，以识别在下一阶段要利用的漏洞。\n\
  \n### 利用\n\n一旦枚举了资产和漏洞，攻击者就可以设计并执行他们的攻击。这一阶段涉及探测和利用特定的漏洞，目标是获得对企业的未经访问。很多时候，这涉及到\
  \ `weaponization`（武器化），即设计和创建辅助攻击的工具。以下是攻击者常用的某些武器化和利用工具及方法：\n\n- **钓鱼攻击**：通过伪装成信任的实体（通常通过电子邮件）来获取敏感信息\n\
  - **虚假网站**：用于收集敏感信息（凭据）\n- **恶意软件**：故意有害或恶意的软件\n- **病毒**：一种通常隐藏在另一个程序中的恶意软件\n- **木马程序**：伪装成有用工具的病毒\n\
  - **蠕虫**：一种会自动传播到其他系统的病毒\n- **根内核包**：一种通过修改操作系统来隐藏身份的病毒\n- **社会工程学**：欺骗他人做不符合其最佳利益的事\n\
  - **脚本攻击**：操纵输入到字段的数据以产生非预期的结果\n- **针对漏洞的攻击**：利用缓冲区溢出或其他软件缺陷\n\n利用阶段的最终目标是获得对系统和数据的未经访问。\n\
  \n### 目标达成\n\n一旦攻击者获得了访问权限，他们就可以导出或窃取数据（破坏机密性）、修改数据（破坏完整性），或破坏数据并在其他方面干扰环境（破坏可用性）。通常攻击者会尝试在整个网络中横向扩展访问，以探索和发现更多系统和数据，从而获得更深层次的并执行更多攻击。攻击者经常尝试掩盖踪迹以避免被受害者或其组织发现。\n\
  \n## 深度防御\n\n`Defense-in-depth`（深度防御）的概念是，组织不应仅依赖一种控制措施进行保护，而应该使用分层控制来增加潜在攻击者的工作量。深度防御是以分层的方法协调使用多种安全控制。多层防御系统最大限地减少了成功渗透和破解的概率，因为攻击者必须通过多种类型的保护机制。\n\
  \n## 风险管理\n\n风险管理是识别和评估风险、将其降低到可接受水平并实施控制的过程。\n\n### 现实世界中的风险管理\n\n在现实世界中，风险管理计划的形式和结构差异巨大。有些组织遵循结构化的风险管理框架，并投入大量的时间、精力和资源进行风险分析和威胁建模。然而，其他组织以不那么纪律甚至随意的方式对待风险管理。许多组织没有进行任何形式的风险分析来确定组织的可接受风险水平，而是根据一或两个决策者的直觉或经验做出这些决定。在本书中，我们描述了成功的风险管理计划包含的要素。然而，本文描述的功能在特定组织中的实施程度取决于许多因素，包括领导的经验和判断、组织的文化、业务和运营环境，以及组织遭受威胁和损害事件的历史。组织执行风险管理的程度本身就是一个具有风险的决策，这在\
  \ CISO 的历程中非常重要。\n\n![Images](img/F01-06.jpg)\n\n**图 1-6** 风险管理包括选择适当的控制并在性和成本之间取得平衡。\n\
  \n在实践中，风险管理可以适用于整个组织，也可以适用于特定资产。它甚至适用于资产组。NIST 特别出版 `SP 800-39`《信息安全风险管理》提出了一种整体方法，通过三个层次对整个组织整体应用风险管理：\n\
  \n- **组织层**：通过定义和实施适用于整个组织或业务实体的整体风险管理计划，在组织层面处理风险\n- **任务/业务流程层**：通过风险感知型业务流程或整体处理企业架构来处理组织风险\n\
  - **信息系统层**：作为给定信息系统开发生命周期 (`SDLC`) 的组成部分处理风险\n\n无论是否通过分层进行风险管理，信息安全状况最好的组织都会从组织层面和逐系统层面两个方面处理风险。\n\
  \n\n\n\n风险管理是对未来的一种预测尝试。它试图弄清组织或系统可能发生的所有坏事，以便决定如何优化资源分配。这涉及到大量的变量需要考虑。这包括尝试识别可能存在的威胁（如飓风、火灾、入室窃、黑客等），并提出相应的解决方案以防御这些威胁或减轻它们的影响。风险管理还涉及各种不未知因素，例如“飓风多久会袭击一次我们的设施？”因此，风险管理的预测包含某种程度的不确定性。此外，预测还试图对某些本质上是定性的事物进行量化。这意味着为某些难以量化的事物（如组织的声誉）加上美元符号或数字。这些都是风险管理中涉及的一些挑战。\n\
  \n# 风险管理计划\n\n信息安全风险管理计划通常包含三个组件：`Approach`（方法）、`Process`（过程）和 `Method`（手段）。根据组织的不同，这些组件可能没有经过正式定义和实施，但每个组件通常会在一定程度上被采用。请注意，我们在本书中使用\
  \ `Approach`、`Process` 和 `Method` 术语来解释风险管理，但行业风险管理标准和框架并不一定使用这些准确术语。这些组件在图 1-7\
  \ 中所示。\n\n![Images](img/F01-07.jpg)\n\n**图 1-7** 风险管理计划组件\n\n许多组织选择遵循行业标准的风险管理框架作为其风险管理计划。常用的风险管理框架可能涵盖一个、两个或全部三个组件。例如，`NIST\
  \ Cybersecurity Framework` 涵盖了 `Approach` 和 `Process`，但将使用何种类型的风险方法的选择留给了组织。我们将在本章稍后部分讨论一些更流行的风险管理框架。\n\
  \n## 风险管理计划：方法 (Approach)\n\n`Approach` 组件涵盖了用于管理、实施和改进风险管理计划的所有活动和因素。行业框架可以作为指导，但\
  \ `Approach` 必须根据组织的治理和运营方式进行定制。与任何组织计划一样，风险管理计划通常按照 `Plan, Do, Check, Act (PDCA)`\
  \ 循环进行实施。以下是风险管理方法中应该考虑的一些因素：\n\n- **组织 (Organization)**：信息安全风险管理可以作为现有组织风险计划的一部分来处理，该计划可能在首席风险官\
  \ (`CRO`)、风险委员会或类似实体的指导下进行。组织必须为管理风险管理计划建立一个责任方，同样重要的是，还要明确谁负责组织的风险工作。无论是 `CISO`、`CRO`、`CEO`\
  \ 还是其他人，负责的人或小组将最终批准计划的产出。这些产出包括为组织和资产建立可接受风险水平、选择风险缓解方法，以及批准缓解结果和风险评估结果。负责的人或小组在整个组织范围内与领导层和利益相关者紧密协作执行此任务，是至关重要的，以确保风险决策与组织的业务目标和运营环境相适应。\n\
  - **实施 (Implementation)**：风险管理计划由计划章程、计划和风险管理策略定义，这些文件定义了计划的范围、目标和要求。计划应定义所需的资源，包括人员、设备和预算。计划应按照计划执行，并与对风险结果有利益的所有组织实体紧密协作。这通常包括组织内部的部门和职能以及外部驱动因素。风险管理计划按照遵循由程序、规则、报告要求等组成的协议进行实施。\n\
  - **监控、报告和持续改进 (Monitoring, reporting, and continuous improvement)**：报告应包含识别出的风险水平与定义的可接受水平之间的差距分析。至少应该有一个非正式的审查周期来监控该计划。根据组织的成熟度，可能有正式或非正式的手段根据根据定义的成功因素来建立目标并衡量计划性能。应该有一个定义的报告流程。\n\
  - **成熟度 (Maturity)**：希望组织的风险管理能力随时间推移而提高。如果组织采用了正式的过程改进方法，如 `Capability Maturity\
  \ Integration (CMMI)` 或类似的模型，就可以实现改进。目标是通过增量改进来提高组织的能力。例如，`CMMI` 的成熟级别为：\n    -\
  \ **初始级 (Initial)**：过程是响应式的，没有基于任何计划。\n    - **管理级 (Managed)**：过程按照计划执行。\n    -\
  \ **定义级 (Defined)**：组织已采用标准并积极应对目标。\n    - **量化管理级 (Quantitatively Managed)**：组织利用定义的指标和定量数据来驱动其过程和决策。\n\
  \    - **优化级 (Optimizing)**：组织已演变为能够对其过程应用创新、敏捷和灵活性的。\n\n正如之前在侧边“现实世界中的风险管理”中讨论的，许多组织从未越过初始能力级。对于这些组织，关于如何处理风险的决策可能不是基于可靠的研究和分析，因此他们可能会偏离目标并让自己处于脆弱状态。但对于任何组织而言，任何能力的成熟度（包括风险管理）都是一项业务决策。\n\
  \n## 风险管理计划：过程 (Process)\n\n虽然该过程有无数变体，但通常，风险管理过程包含了图 1-8 所示以及后续描述的活动。\n\n![Images](img/F01-08.jpg)\n\
  \n**图 1-8** 风险管理过程\n\n**计划 (Plan)**：风险管理规划涉及以下活动：\n\n- **确定团队**：由于风险管理的重要性以及风险管理决策影响整个业务，团队应包括来自组织尽可能多部分的代表——不仅是\
  \ IT 或安全部门，还包括其他主要职能和角色。例如，审计人员对组织有独特的视角，因此他们应该参与。不同业务部门的领导应该有发言权。组织的法律职能应该被包含，不仅是因为涉及的驱动因素（尽管这是一个很好的理由），而且安全和风险管理经常需要防御非法且涉及某种犯罪的行为。此外，组织的隐私职能可能位于法律部门。由于涉及员工，人力资源代表也应该被包含，而且，管理层必须参与，因为他们将做出重大决策。\n\
  \n\n\n\n# 定义范围\n下一步是定义风险管理项目的范围。组织需要定义风险评估、分析和缓解的主体。例如，这项工作是涵盖单体设施还是多个设施；某个特定地区；还是整个企业范围？范围可以通过以下方式定义：\n\
  \n- 系统或其他资产\n- 业务流程\n- 功能、区域或部门\n\n在实践中，大多数组织出于风险管理的考虑，将环境视为系统的集合。然后，将风险管理应用于每个系统。\n\
  \n在定义范围时，还应考虑所选模型中包含的变量类型。如果模型包含了对威胁类型的考量，则需要对包含哪些类型的威胁做出决定。例如，人为威胁（如入室盗窃或骚乱）在范围内吗？自然灾害（如飓风、森林火灾等）是否在范围内？技术性威胁（如黑客或可能的某种数据连接的丢失）是否在范围内？这些决定定义了工作的范围。本章稍后部分将详细讨论模型。\n\
  \n# 定义方法或模型\n下一步是定义将采用何种风险方法。涉及风险分析时，本质上有两种方法：`定量分析`和`定性分析`。`定量分析`旨在确定如果风险发生，将为组织带来多少损失。例如，组织可能评估某项资产价值为\
  \ 100,000 美元，并估计该资产一旦发生将损失 50% 的价值，使得`单次损失预期`（Single Loss Expectancy）为 50,000 美元。组织可能还会资产每年发生火灾的概率（`年发生率`）为\
  \ 1%，因此计算出`年化损失预期`为 500 美元。这就是`定量分析`的一个插例。`定性分析`则更具主观性。组织通常使用风险量级（如 1 到 10 或低/中/高）对资产进行`定性分析`。本章稍后将详细讨论`定量分析`和`定性分析`。在实践中，我们通常会看到两者的某种结合，因为某些事物很难量化，例如声誉或品牌。\n\
  \n# 工具的使用\n根据风险管理计划的复杂性，如果手动操作，收集所有数据并正确解释结果可能会令人不从心。目前有多种自动化风险管理工具可以帮助这一过程完成得更快、更准确。虽然这些工具的意图是减少手动工作量，但它们的真正价值在于用户能够快速更改参数并运行各种场景。这允许风险管理团队尝试不同的“假设”场景，并在审查结果后选择最佳方案。单一的集成工具听起来很理想，市面上也确实存在，但许多组织使用集成解决方案，提供多个各自执行任务一部分的工具。工具类别包括：配置管理数据库（提供列出和跟踪环境中资产的仓库）；威胁情报平台（收集并传播有关当前外部威胁的信息）；以及整个风险管理套件（自动执行运行`定量`或`定性`模型的流程）。\n\
  \n# 理解可接受的风险水平\n此活动的目标是为环境中各种类型的系统或资产建立最小可接受风险水平。所有系统都将根据此标准进行评估和比较，理想情况下，除非资产符合此标准，否则不应批准其运行。\n\
  \n风险接受水平是组织应该接受的最大整体风险暴露。我们在这里讨论的风险是`残余风险`，即在实施控制或应对措施后剩余的风险。因此，组织必须定义什么程度的风险是可以接受的。\n\
  \n请注意，某些组织完全跳过了这一步，而是根据管理层的判断来确定可接受的风险水平。\n\n# 收集信息\n风险管理过程中要收集的准确信息由所使用的`方法`指定。`定量模型`可能需要收集详细的财务信息，包括人工和材料成本，甚至来自外部供应商的估算，以确定资产价值。`定性模型`则需要有关资产、威胁、漏洞以及不同事件发生概率的信息。一旦收集到这些信息，将进行分析以捕获威胁对业务意味着什么。\n\
  \n# 定义建议\n作为风险分析过程的一部分，将考虑处理特定风险的可能方法，并向决策机构（我们称为“管理层”）提出建议。在这种情况下，“管理层”的定义取决于具体的组织。在某些组织中，它是`CEO`，但在另一些组织中，它可能是`CISO`、董事会甚至是风险委员会。关键在于，每个组织中必须有人就如何妥善处理特定资产或整个组织的风险做出决策。\n\
  \n一旦风险处理决策敲确定，就可以通过应用相应的控制措施来实施。通常，风险建议的制定和实施有四种选择：\n\n- **缓解**或通过实施某种控制措施来降低风险。\n\
  - **转移**风险并将其变成别人的问题。\n- **接受**风险，这意味着只要在可接受的风险水平内，组织就可以“与风险共存”并碰运气。\n- 完全**规避**风险，停止相关活动或完全关闭系统。\n\
  \n在管理层的批准下，使用适当的缓解和控制措施来处理风险，这些措施将经过部署、测量、监控和持续改进。\n\n![Images](img/exam.jpg)\n\n\
  **考试贴士** CCISO 候选应理解不同的风险处理选项，并能够在给定场景下选择方法。\n\n## 风险管理计划：方法\n风险管理`方法`通常分为两类：定量和定性。\n\
  \n### 定量方法\n`定量方法`用于计算与特定威胁相关的货币损失。这是通过为分析中的每个因素分配数值来实现的。因素可能包括\n\n- 资产价值\n- 威胁概率\n\
  - 漏洞\n- 损失影响\n- 措施或控制的成本\n\n两种常用的定量方法是`损失预期`和`年化损失预期`。\n\n`单次损失预期 (SLE)` 是单个威胁事件的潜在损失价值。注意，该事件适用于单个资产或一组资产。公式为：\n\
  \n```\nAV × EF = SLE\n```\n\n- `资产价值 (AV)` 是受事件影响的资产或资产的成本。`AV` 可以仅仅是资产的更换成本，也可以包括资产丢失时可能产生的其他成本，例如人工和安装成本、由于停机带来的业务成本，甚至由于业务损失导致的成本。\n\
  - `暴露因子 (EF)` 是目标事件可能发生的损失百分比。例如，如果建模的威胁是`盗窃`且资产是`笔记本电脑`，那么 `EF` 可能是 100%，因为没有人会偷笔记本电脑的一部分。或者，如果威胁是火灾且资产是整个数据中心，那么\
  \ `EF` 可能为 40%，作为潜在损失的估算。`EF` 是一个预测，应该有数据、研究或某些记录的支持。\n\n\n\n\n年度预期损失 (ALE) 引入了时间要素。`ALE`\
  \ 用于预测年度损失的潜在价值。其公式为：\n\n`SLE × ARO = ALE`\n\n- `年度发生率 (ARO)` 是对某事件在给定一年内预计发生次数的估算。\n\
  \nALE 定量分析允许组织以美元金额的形式预测特定事件的年度损失。它可以用于建立组织的容忍度水平；例如，组织在分析后可能会发现，任何 `ALE` 大于 100\
  \ 万美元的资产具有最高的风险优先级，并且应该采取最高级别的缓解控制。组织还可能使用 `ALE` 来确定支出，因为对于一个 `ALE` 仅为 1 万美元的资产与威胁组合，每年花费\
  \ 10 万美元进行防范可能是是没有意义的。\n\n### 定性方法\n定性方法不使用美元金额（尽管它们可能仍涉及计算）。定性分析可能仅仅如一位高管说：“系统\
  \ X 对我们非常重要，因此我将其定为高风险”，也可能是包含许多变量的高度复杂性分析。定性分析可能会考虑多种因素，包括：\n\n- 威胁的严重性\n- 威胁发生的可能性\n\
  - 对业务影响的严重性（也称为 `consequence`）\n- 控制的有效性\n\n在大多数情况下，定性风险分析用于确定特定威胁应用于特定资产的风险，例如组织仓库淹水的风险或针对组织\
  \ Web 服务器的拒绝服务攻击风险。以下三表提供了定性分析方法的示例。\n\n表 1-1 是使用“可能性与影响”来建立风险等级的风险分析示例。组织可以使用这种方法来确定不同威胁与资产对的风险，并为每一对使用单独的表格。\n\
  \n![Images](img/p24.jpg)\n\n**表 1-1** 使用影响与可能性确定风险等级\n\n表 1-2 展示了组织可能如何确定企业内特定类型系统机密性、完整性或可用性受损的风险等级。总体风险通常是三种事件类型中风险最高的一个。在示例中，总体风险为“高”。\n\
  \n![Images](img/p24-1.jpg)\n\n**表 1-2** 损害类型风险建模\n\n![Images](img/p25.jpg)\n\n**表\
  \ 1-3** 固有风险与剩余风险示例\n\n表 1-3 中的下一个示例显示了组织可能如何在应用缓解控制之前（固有风险）和之后（剩余风险）对风险建模。\n\n\
  风险评估团队可能会使用特定技术来帮助他们最有效地利用所选模型。以下是一些最佳实践技术：\n\n- **SWIFT**：结构化假设分析技术（Structured\
  \ What If Technique）是一种用于小组协作的结构化流程。它涉及使用引导词和其他元素进行头脑风暴，以描述系统、识别并评估风险，并提出将风险降低至可接受水平的。\n\
  - **Delphi (德菲法)**：德菲法由 RAND 公司开发，作为一种预测技术变化的手段。它现在被用于促进领域专家之间的讨论以达成共识。它使用一个分层的、迭代的过程向小组提问，每次迭代都会更深入地探讨该主题。\n\
  - **Bowtie (蝴蝶结法)**：蝴蝶结法之所以命名，是因为代表它的图表形状像蝴蝶结。蝴蝶结的中心或结处是一个事件。左侧（来源）和右侧（后果）比中心大，因为对于单个事件，可能会有很多来源和后果。蝴蝶结技术提供了一种结构化的方法来建模和分析威胁及其对组织的影响，并评估缓解措施。\n\
  - **决策树分析**：这种技术用于帮助人们从许多可能的选择中选择最好的。它使用视觉模型来帮助说明和理解风险分析中考虑的变量之间的关系。它还有助于理解问题的某个方面的变化如何影响其他方面。\n\
  \n![Images](img/exam.jpg)\n\n**考试贴士** CCISO 候选人应该熟悉定量和定性风险管理，并能够根据场景识别出正在使用哪种方法。\n\
  \n### 风险管理最佳实践框架\n以下是为帮助组织执行信息安全风险管理而开发的框架的简要总结。\n\n- **OCTAVE (业务关键型威胁、资产和漏洞评估)**：`OCTAVE`\
  \ 最初由卡内基·梅梅隆大学的软件工程学院开发。现在有三个实例：`OCTAVE`、`OCTAVE-Allegro`（一个更精简的框架）和 `OCTAVE-S`（针对小型组织）。`OCTAVE`\
  \ 依赖于这样一个观点：组织中工作的人最适合理解和分析风险。它涉及资产、威胁、漏洞以及解决这些问题所需的内容。`OCTAVE` 是一个带有相关模型的定性风险管理框架。\n\
  - **FAIR (信息风险因素分析)**：`FAIR` 是一个定量风险框架。`FAIR` 提供了一种风险分类法，将风险分解为特定的因素和子因素。它包含了非常具体的损失、威胁和漏洞类型，并包含了衡量这些因素以及得出定量分析结果的方法。\n\
  - **ISACA Risk IT 框架**：`ISACA Risk IT` 是一个以 IT 为导向的框架，而不是专门针对信息安全的框架。`Risk IT` 包含三个领域：风险治理、风险评估以及风险响应，并包含了特定的实施模型，用于通过定量和定性的混合方法来完成分析。\n\
  - **ISO/IEC 27005**：`ISO/IEC 27005`《信息技术—安全技术—信息安全风险管理》是一个高层框架，支持将信息安全作为 ISO/IEC\
  \ 27000 系列指南的一部分。它暗示了执行定量或定性风险分析的持续过程，但不包含特定的模型。ISO 31000《风险管理—指南》是一个更稳健的风险管理框架，包含三个要素：原则、框架和实施过程。然而，ISO\
  \ 31000 并没有建议定量或定性的方法。\n- **FISMA/FIPS/NIST RMF**：用于满足美国联邦信息安全现代化法 (FISMA) 要求的标准和特别出版物为执行定性风险分析提供了框架、过程和模型。这些标准还提供了安全控制库，从而形成了风险管理和实施的端到端框架。\n\
  \n### 信息安全管理的技术要素\n良好的信息安全计划具有许多管理和技术要素，如图 1-9 所示。每个安全计划都包含这些要素，尽管每个组织都有自己的命名和组织方式。\n\
  \n![Images](img/F01-09.jpg)\n\n**图 1-9** 信息安全计划的关键要素\n\n![Images](img/F01-10.jpg)\n\
  \n**图 1-10** 安全计划组件示例\n\n后续章节介绍了每个要素。它们将在第 4 章中进行更详细的讨论。\n\n### 安全计划书\n\n\n\n\n\n\
  许多组织都有一个安全计划，定义了完整的信息安全计划。该计划定义了所有的安全角色和职责，规定了计划的战略目标，并识别了安全活动。该计划识别了所有的合规和业务驱动因素，并确保计划中提出的方案是基于风险的。图\
  \ 1-10 展示了一个安全计划的示例，并显示了计划组件之间的关系。接下来将讨论示例中的每个组件。\n\n*   **安全工作流 (Security streams\
  \ of work)**：工作流是为了实施信息安全核心领域（或领域）而执行的活动。工作流示例可能包括入侵检测与监控、访问控制与身份管理、漏洞管理以及变更控制。为了形成完整的安全计划，这些工作流必须在整个企业中实施。\n\
  \n*   **资产 (Assets)**：资产是应用工作流的系统、数据、业务单元、部门或企业关键区域。资产相关活动根据资产相对优先级、风险或资源等因素，解决应该在何地、何何时应用什么安全措施。\n\
  \n*   **安全关注领域 (Security areas of focus)**：由于外部驱动因素（通常是合规驱动因素），安全计划中有某些方面需要重点关注。例如，PCI\
  \ DSS 要求所有信用卡数据在全企业范围内映射，并根据数据所在的位置实施特定的安全控制措施。关注领域的示例包括 PCI DSS、HIPAA、萨班斯-奥克斯利法（Sarbanes-Oxley）以及\
  \ ISO/IEC 27000 系列等内部驱动因素。这些领域定义了需要在何处应用哪些安全活动。关注领域适用于一个或多个资产。\n\n*   **安全项目 (Security\
  \ projects)**：针对目标和或关注领域应用工作流产生的特定活动。安全项目的示例可能是单点登录（SSO）的实施、特定入侵检测系统（IDS）的部署，或安全仪表板的设计与实施。\n\
  \n*   **安全项目管理生命周期 (Security project management life cycle)**：所有的安全项目都应该按照定义的生命周期进行管理。该生命周期确保安全项目定义明确、记录记录，并在有始的情况下执行。生命周期定义了如何管理安全项目，并提供了对资源、质量和结果的适当控制。\n\
  \n## 安全策略、标准和指南\n\n安全计划通常包含一组管理级安全指令，如图 1-11 所示。这些指令构成了计划人员必须遵循的规则和实践库。顶层文件是安全策略，它们定义了强制性的硬规则（要求），规定了要做什么（但不一定是怎么做）。示例包括访问控制策略、密码策略、事件处理策略等——本质上，每项信息安全活动或领域（核心能力）都应该有自己的策略。\n\
  \n![Images](img/F01-11.jpg)\n\n**图 1-11** 管理级安全指令\n\n其他文档包括：\n\n*   **标准 (Standards)**：标准建立了满足策略中定义的要求的特定方法。例如，可以使用标准来定义特定的加密工具或产品，或者在特定情况下使用的控制措施类型，以满足组织的数据加密策略。\n\
  \n*   **流程或程序 (Processes or procedures)**：流程或程序是定义如何执行安全职的步进式工作流或指令。\n\n*   **基线\
  \ (Baselines)**：基线有时与标准归为类，为硬件或软件建立特定的配置。\n\n*   **指南 (Guidelines)**：指南提供通用的方向或建议，而不规定具体要求。示例可以是口语建议。\n\
  \n![Images](img/exam.jpg)\n\n**考试提示 (EXAM TIP)**：CCISO 候选人应理解策略、标准、程序、基线和指南之间的区别，包括哪些是强制性的哪些是建议性的。\n\
  \n## 资产安全\n\n资产安全识别组织拥有哪些资产并确定每种资产适用什么类型控制的概念。它包含了策略和程序。资产安全通常关注数据（信息资产）。资产安全涉及在整个数据生命周期实施安全，如图\
  \ 1-12 所示。\n\n![Images](img/F01-12.jpg)\n\n**图 1-12** 数据生命周期\n\n资产安全计划定义并实施访问控制、加密和数字签名等技术，对静态和传输中数据的访问进行保护。\n\
  \n## 身份与访问管理\n\n访问控制是控制用户和系统如何与其他系统通信和交互的安全功能。它们保护系统和资源免受未经授权的访问。虽然人们通常将“用户”认为是需要访问网络资源的实体，但还有其他类型的实体（如系统）也需要访问并受访问控制。\n\
  \n身份和访问管理使用了包括识别、认证、授权和问责制在内的概念。它使用了诸如自主访问控制 (`DAC`)、基于角色的访问控制 (`RBAC`) 和强制性访问控制\
  \ (`MAC`) 等模型。它包括使用身份管理系统（如 `Active Directory` 和 `Kerberos`）、协议（如 `LDAP`）以及生物识别和密码等安全控制。所有这些项目在第\
  \ 4 章中都有解释。\n\n## 安全工程\n\n安全工程是一个巨大的领域，涉及信息系统的安全设计和实施。核心概念是安全应该是企业设计不可或的一部分。安全工程涉及计算环境的所有方面，例如：\n\
  \n*   计算机体系组件\n*   操作系统安全\n*   信息系统架构和保护机制\n*   网络安全设计\n*   企业安全解决方案（如防火墙、防病毒软件、数据泄露防护、端点安全和安全网关）\n\
  *   远程连接\n*   无线连接\n*   云计算\n*   信息物理系统\n*   数据库安全\n*   移动设备安全\n*   安全模型\n*   安全评估与授权\n\
  *   加密\n\n\n\n\n\n- 地位置\n- 设施建设\n- 物理安全风险、威胁及对措施\n- 人员安全\n\n与 IT 安全一样，物理安全也有深度防御的概念，即使用分层防御，如图图\
  \ 1-13 所示。\n\n![Images](img/F01-13.jpg)\n\n**图 1-13** 物理安全防御层\n\n## 安全运营\n\n安全运营侧重于积极执行日常功能，以预防、检测和响应安全风险与威胁。这些功能包括：\n\
  \n- **漏洞、配置和补丁管理** 所有的 IT 资产都存在漏洞。这些资产包括桌面式电脑、笔记本电脑、移动设备、服务器、网络和存储设备、操作系统、应用程序软件等。跟踪组织中的所有资产以及它们是否拥有最新补丁和正确的软件版本是一项全职工作。一个良好的漏洞、配置和补丁管理计划应该为组织提供“态势感知”，或者说提供对所有资产及其配置和补丁状态的准确掌握。\n\
  - **监控与日志** 这一关键功能涉及捕获 IT 企业内部的所有重大事件，以检测恶意活动并支持对过去或正在发生的安全事件进行调查。该功能通过配置企业中的系统来捕获活动，例如登录和访问资产、数据读取/写入/修改、数据外泄、访问外部和内部系统、登录尝试等。捕获这些活动并进行实时监控支持了`入侵检测`。捕获这些事件以供未来分析支持`取证调查`。监控与日志涵盖了根据业务风险和可用资源决定记录和监控哪些事件。捕获过多会导致存储和网络流量成本高昂；捕获过少则无法获取到足够的有用数据。成熟的组织会不断调整其日志和监控能力，以最好地适应其业务。\n\
  - **事件处理** 在安全泄露发生后思考如何应对为太晚了。事件处理的核心在于对各种类型的安全事件进行计划，并提前定义要做什么。通常，事件处理遵循六步模型，如图图\
  \ 1-14 所示。\n\n在响应重大安全事件时遵循这六个步骤。`准备`阶段是提前执行的。在此阶段，安全组织尝试预测可能发生的事件类型。对于每类事件，都会规划剩余的步骤，有时还会进行演练。目标是能够`识别`发生了什么类型的事件、`遏制`损害蔓延、`根除`问题所在、从事件中`恢复`并恢复正常运行，最后进行`教训总结`活动，以确定可以或应该采取哪些行动来防止事件再次发生或改进响应处理方式。事件处理过程的一个关键方面是知道何时将问题上报给管理层或董事会，或通知执法机构。\n\
  \n![Images](img/F01-14.jpg)\n\n**图 1-14** 事件处理的六个步骤\n- **取证与调查** 某些安全泄露可能是违反法律或公司政策的指示。此类事件可能需要计算机取证调查以充分揭示有关事件的所有信息。此类事件可能还需要联系并与执法机构合作。这一切需要进行相应的计划，以避免出现可能对业务或相关个人造成进一步损害的失误。\n\
  - **安全运营中心** 所有的安全运营活动通常由组织安全运营中心（SOC）的人员负责执行。SOC 通常运行组织的安全信息事件管理（`SIEM`）系统，该系统对网络、计算机和用户活动进行\
  \ 24/7 监控，以检测、预防和响应安全事件。\n\n## 软件开发安全\n\n许多组织开发自己的软件或为自身使用构建自定义应用程序。此类软件必须以确保不包含安全漏洞的方式构建。软件和应用程序必须结合安全专业知识进行构建，以确保开发人员定义、构建、测试、推广和维护安全的应用程序。除了防止漏洞外，软件和应用程序必须使用作为访问控制和身份管理的核心概念进行构建，例如`最小权限`和`职责分离`。\n\
  \n## 安全评估与测试\n\n所有的安全计划必须包含持续的`评估与测试`组件，以持续评估和验证安全计划的所有方面。作为安全计划一部分开发和实施的行政、技术、管理和运营控制将通过审计和清单进行评估，以确定对既定目标的遵循情况。此外，还应该有持续的`漏洞管理`活动，包括漏洞测试，以确保漏洞修复活动的成功执行和管理。测试通常涉及漏洞评估和渗透测试的结合。`漏洞评估`是使用工具进行的全面测试，扫描整个计算环境（包括内部和外部），以发现并列出已知漏洞。测试结果将输入`漏洞和补丁管理`系列活动，用于报告和跟踪修复活动。`渗透测试`通常由伪装黑客的工程师执行。这些工程师寻求利用漏洞获取对系统和数据的访问。虽然漏洞测试是全面的，但渗透测试是有限的，它展示了如果让漏洞暴露可能会发生的情况。\n\
  \n## 安全培训与意识\n\n所有员工都应该了解组织的安全策略和流程以及一般的良好安全实践。安全意识和培训应关注组织的整个用户群体。它应该包含以各种形式提供的培训，特别是实践、演练和练习，为用户提供处理网络攻击（包括社会工程学）的基于真实的经验。最好的培训计划结合了现成培训（用于教授通用概念）和定制培训（用于教授公司或组织特有的特定概念）。\n\
  \n## 业务连续性与灾难恢复\n\n每个组织都应该制定计划和程序，以确保在安全泄露或其他灾难发生时能够继续运营。为了实现这一点，组织创建了业务连续性计划和灾难恢复（`BCP/DR`）计划（或业务连续性[`COOP`]计划），重点是在业务指定的时间范围内恢复支持关键业务功能的系统和服务。BCP/DR\
  \ 计划定义了组织根据其风险承受能力从泄露或灾难中恢复的程度。有时（但并非总是）BCP 和 DR 隶属于首席安全官（CISO）。\n\n\n\n\n在本章较早之前，我们涵盖了\
  \ CISO 负责的许多治理实践，包括理解组织的业务驱动因素，以及创建和维护能够促进这些驱动因素的安全计划。开发这些驱动因素的一个关键方面是理解组织的合规性要求。`Compliance`（合规）是一种治理方法，旨在确保组织活动与适用的法律、法规、标准、组织政策、伦理行为和其他业务目标保持一致。关于合规的讨论通常侧重于监管合规，因为不合规的后果（罚款、声誉损害等）可能是极其惨重的。然而，遵守法规并非合规的唯一形式。既有内部合规也有外部合规要求，如图\
  \ 1-15 所示，这些要求驱动着组织实施政策、标准和程序以支持合规。\n\n![Images](img/F01-15.jpg)\n\n**图 1-15** 合规驱动因素\n\
  \n`External compliance`（外部合规）侧重于遵守外部法律、法规、标准或其他行业指令。维持一系列长长的法律和法规要求的合规性是高管人员关注的重点。通过实施控制、定期审计和法律意识，实现对法律、法规、合同和法定要求的合规。有许多种类型的外部要求需要考虑：\n\
  \n• 行业法规或指令\n• 州法规\n• 联邦法规\n• 地方法律和法规\n• 国际标准\n\n`Internal compliance`（内部合规）侧重于能够支持并保护人员、流程和技术的内部业务实践。这些实践旨在确保符合内部政策、伦理行为或其他业务规则和目标。这些活动通常关注于并非直接源自外部立法授权、法规或指令的良好业务实践。这些活动包括确保\n\
  \n• 与内部行为准则、政策、标准和程序保持一致\n• 员工的伦理行为\n• 与其他关键组织规则或目标（声誉、形象、防止财务损失等）保持一致\n\n在本节中，我们将讨论合规团队并梳理合规管理流程。\n\
  \n# 合规与安全\n\n高管层中一个常见的误解是，合规意味着组织是安全的。合规并不一定意味着组织是安全的，反之，一个良好的安全计划也不一定符合其驱动因素。例如，一个组织可能被符合\
  \ `PCI DSS` 或通用数据保护条例 (`GDPR`) 的要求。`PCI DSS` 合规要求以符合处理信用卡信息所需的 `PCI DSS` 规范的方式进行运营，而\
  \ `GDPR` 合规则要求保护欧盟公民的数据。正如许多许多外部合规因素一样，这些要求是非常具体的。在这种情况下，它们关注特定类型的数据。然而，如果一个组织仅专注于保护这些数据，可能会让自己暴露在其他其他的攻击向量面前。\n\
  \n安全不断演变，以应对威胁、技术和保护措施的变化。合规要求会变化，但变化速度通常不足以充分应对安全挑战。虽然合规可能无法全方位地解决安全问题，但合规是一项重要的业务赋能手段，一个不符合行业法律法规等外部因素要求的组织将无法在其所选择的业务中长期经营。\n\
  \n## 合规团队\n\n合规团队通常参与于就内部政策和程序提供指导，并评估当前的流程和技术以确定改进合规性的方法。根据组织的不同，该团队可能仅关注内部合规、仅关注外部合规，或同时负责这两者。合规团队的职责可能包括以下内容：\n\
  \n• 识别外部合规要求（例如法律和法规）\n• 开发和管理内部合规要求（例如伦理）\n• 政策、标准和程序的开发或指导\n• 管理组织的隐私计划\n• 监督和执行合规培训倡议\n\
  • 监控计划的违规情况和效率\n\n并非所有组织都有专门的合规资源。规模较小的组织通常对合规管理采取共担责任的方法，或者拥有一个单一的专门合规资源，如合规官。大型组织通常设有合规部门，向高级合规官员汇报，例如首席合规官\
  \ (`CCO`)。具有特定或复杂合规要求的企业甚至可能为特定的合规因素设立专门的团队，如 `PCI DSS` 团队或 `HIPAA` 团队。\n\n合规团队的汇报关系因组织而异。同样，在大型组织中，合规团队通常向\
  \ `CCO` 汇报。`CCO` 可能法律部门汇报（因为他们在法律法规方面具有专业知识），或直接向 `CEO`、董事会汇报。与 CISO 的汇报结构类似，没有一种适用于所有的解决方案。最终，如果合规负责人的汇报结构能够促进沟通和报告，让\
  \ `CEO` 和/或董事会意识到合规风险，它就是有效的。\n\n## 合规管理\n\n合规跨了业务的各个方面，像任何其他计划一样，必须经过适当的管理以确保一致。`Compliance\
  \ management`（合规管理）是组织计划、实施和维护支持合规活动的过程。合规管理使组织能够建立治理、政策、系统和流程以及报告和衡量。每个组织都在参与某种管理活动，但并非所有组织都有正式的合规计划、专门的合规团队或遵循定义的合规管理流程。\n\
  \n所有组织都必须遵守规范其业务行为的各种政策组合。合规管理的临时方法可能适用于合规有限的小组织。然而，具有许多驱动因素的组织必须正确管理和维护合规，以确保其合规工作的准确性和完整性。管理合规有很多流程和方法。本章涵盖的流程基于\
  \ `ISO 19600:2014`、合规管理体系，并关注类似于计划-执行-检查-行动 (`PDCA`) 循环的方法（也称为德明循环或休华特循环）。步骤如下：\n\
  \n**1.** 计划\n**2.** 实施\n**3.** 评估\n**4.** 维护\n\n该流程在图 1-16 中所示。外部和内部要求（法律、法规、指令、伦理、目标和目的）作为合规管理流程的输入。\n\
  \n**考试提示** CCISO 考试不会包含有关本节所概述的合规管理具体步骤的题目。目标是在概念上理解管理合规的一般流程，并能够区分适用于特定合规方法的场景。\n\
  \n#### 计划\n\n\n\n\n\n#\n合规管理流程的第一步是确定适用的内外部合规要求的范围，以全面了解合规图景。这要求深入理解内部业务需求、组织所属行业、业务处理的信息类型以及组织运营的地理区域。在地方、州、联邦和国家层面存在不同的法律法规，且这些法律法规通常适用于特定的数据类型。应该对适用的法律法规驱动因素以及内部需求进行清点，以识别影响业务的合规风险。其目标是制定一套识别、衡量和纠正违规行为的策略。\n\
  \n## 实施\n\n在制定策略或行动计划后，必须采取措施处理违规行为。实施通常需要跨部门的努力，并可能体现在许多不同的活动中，包括以下要求：\n\n*   开发和维护特定的策略、程序或文档\n\
  *   实施特定的控制措施\n*   针对违规或违反内部要求的行为执行纪律处分\n*   评估能力并进行培训\n*   向组织传达合规预期\n\n最终，实施步骤要求组织将法规和要求与具体的策略、程序和控制联系起来。在处理发现的问题时，需要某种方法来跟踪补救措施的进度和实施情况。某些组织利用软件工具来协助跟踪和补救过程。其他需求和要求较复杂的组织可能会使用像电子表格或清单一样简单的工具。你并不总是需要复杂的工具。有时最简单的解决方案往往是最有效的。\n\
  \n## 评估\n\n下一步是评估或考核合规计划的控制措施并衡量发现的结果。合规评估用于识别和衡量由于控制措施缺失导致的合规风险。在某些情况下，合规评估可能涵盖多项法律、法规和业务需求。在其他情况下，组织可能会针对特定的合规义务进行评估，例如\
  \ `PCI DSS`、`HIPAA`、`ISO/IEC 27001` 或内部伦理调查。合规评估可以是内部的也可以外部的。\n\n内部合规评估由内部人员执行，以衡量组织的合规风险，并确定为遵守法律、法规和其他合规要求需要采取的行动。它们还用于确定组织是否遵循内部目标、策略、标准和最佳实践。内部评估可能由内部审计团队、合规团队或其他内部资源执行，取决于组织的结构和合规责任的分配。\n\
  \n外部合规评估由独立的第三方执行，评估组织与特定法律、法规或标准的对性（例如 `PCI DSS` 或 `HIPAA`）。外部合规评估的结果是发布一份衡量组织合规性的报告。根据评估的类型，生成的报告可能被监管机构用于评估违规情况，以决定是否处以罚款或其他处罚。外部合规评估还可以导致认证。例如，某些组织可能会寻求\
  \ `ISO/IEC 27001` 或 `PCI DSS` 认证。为了让组织获得认证，必须由经过认可的第三方进行全面审计（例如针对 `PCI DSS` 的合格安全评估员\
  \ `QSA`）。在成功完成审计且满足所有要求的前提下，该组织将被认证为合规的。合规是一个确保符合要求的持续过程，而认证是对特定时期内合规性的证明。\n\n首席信息安全官（CISO）可以利用合规评估的结果来提高组织的成熟度，并作为申请资金实施控制措施以降低风险并解决发现的问题。\n\
  \n## 维护\n\n为了有效确保合规，组织必须对变化的合规要求保持警惕。合规与其他任何计划一样，需要持续的维护、监控和报告。随着组织的演变，新的法律会被建立，新的法规会被实施，新的内部组织要求也会产生。随着组织技术基础设施、业务流程或范围的变更，此前不适用的新法律法规可能会适用于该业务。目标是使该计划能够处理新的合规风险，识别并检查违规行为，并持续适应不断变化的图景。\n\
  \n## 隐私\n\n本章后面讨论的许多法律和法规驱动因素都有一个共同主题，即关注隐私。数据隐私是合规的一个重要方面。组织必须理解其所属行业的隐私、法律和监管要求。记录如何处理隐私相关信息至关重要；这包括收集、使用、共享、归档和处置。开始完善隐私工作时，需要考虑的几个关键点：\n\
  \n*   组织拥有哪些数据？\n*   数据是如何被使用的？\n*   数据存储和处理何何？\n*   哪些隐私法律或法规监管该业务？\n\n### 隐私影响评估\n\
  \n为了评估隐私而进行的风险评估被称为 `隐私影响评估 (PIA)`。`PIA` 侧重于分析以下的数据收集、使用、传播、归档和销：\n\n*   遵守适用的法律法规\n\
  *   确定数据处理的风险和影响\n*   评估数据保护措施和流程以降低隐私风险\n\n许多组织设有数据隐私官和专门负责确保隐私及遵守隐私法的部门。通常，隐私部门隶属于法律部门。最终，隐私应该是法律、合规、审计和安全部门之间多层方面的努力。安全部门在实施隐私所需的各种要求和控制措施方面具有专业知识，而法律团队在遵守法律和条文方面具有专业知识。\n\
  \n# 隐私与安全\n\n隐私和安全经常归为一类，但记住它们是不同的实践是很重要的。`隐私` 指个人对其自身敏感数据应拥有的控制水平。这通常侧重于对受托的个人信息进行授权收集、使用、共享、归档和销毁。例如，`HIPAA`\
  \ 要求医疗机构保护患者个人信息的隐私。`安全` 指防御威胁的措施，通常侧重于保护数据免受未经授权的访问，并确保在不再需要时得到适当销毁。组织通过实施良好的安全实践来实现隐私目标。\n\
  \n\n\n\n\n本节重点关注首席信息安全官（CISO）应该了解的一些关键法律和监管驱动因素。某些机构法律上并不强制遵守这些法律。然而，如果某个机构与法律要求合规的其他实体开展业务，那么这些业务可能会在其合规或风险管理计划中，要求其供应商、合作伙伴或供应商合规。本节涵盖的法律和监管驱动因素列如下：\n\
  \n- `FISMA`\n- `DFARS 252.204-7012`\n- `Clinger-Cohen Act`\n- `PCI DSS`\n- `Privacy\
  \ Act`\n- `GLBA`\n- `HIPAA`\n- `FERPA`\n- `SOX`\n- `GDPR`\n- `NERC-CIP`\n\n![Images](img/exam.jpg)\n\
  \n**考试提示** CCISO 候选人应熟悉影响组织信息安全的法律规定。\n\n### 联邦信息安全现代化法\n\n`2002 年联邦信息安全管理法案（FISMA\
  \ 或 FISMA 2002）` 是作为 2002 年电子政府法案的一部分通过的一项美国法律。`FISMA` 的目的是帮助美国联邦机构实施最低安全要求，以降低数据丢失的风险。`FISMA`\
  \ 要求美国联邦机构建立、记录并实施全机构范围的信息安全计划以支持机构运营。这包括以下内容：\n\n- 遵循关键安全最佳实践\n- 评估其对这些实践的合规情况\n\
  - 向管理和预算局（OMB）报告其发现\n\n`2014 年联邦信息安全现代化法案（FISMA 或 FISMA 2014）` 修改了 `FISMA 2002`，以提供新的要求，旨在使联邦安全实践现代化，将重点关注于基于风险的安全，而非清单式的方法。这些新要求包括了对联邦安全监管机构责任的变更、更新的安全报告要求，以及促进使用自动化工具的步骤。\n\
  \n**FISMA 适用于谁？** `FISMA` 合规对于美国联邦机构是强制性的，但也适用于任何处理联邦政府信息的个人。联邦承包商、管理联邦计划的州级机构以及拥有政府合同的私营部门公司必须遵守\
  \ `FISMA`。不合规可能会导致联邦资金的损失。\n\n**合规如何影响组织？** 根据 `FISMA` 的要求，`NIST` 负责制定标准、指南和其他出版物，这些代表了适用于美国联邦机构的安全要求。这些包括联邦信息处理标准\
  \ (`FIPS`）和 `NIST` 特别出版物 (`SPs`）。这些出版物将在本章后后部分进行详细介绍。`FISMA` 的关键要求包括：\n\n- **信息系统清单**：必须识别准确的系统边界，包括完整的资产清单。\n\
  - **信息系统的安全风险分类**：必须使用 `FIPS 200` 和 `NIST SP 800-53` 中的指南对信息系统进行分类。\n- **安全控制**：必须根据系统的风险分类实施安全控制。实施安全控制的指南见于\
  \ `FIPS 200` 和 `NIST SP 800-53`。\n- **风险评估**：必须进行安全风险评估以评估系统风险和重要性。\n- **系统安全计划**：必须使用\
  \ `NIST SP 800-18` 中的指南制定系统安全计划（`SSP`）。\n- **认证测试**：必须根据 `NIST SP 800-37` 中的指南对系统进行授权。\n\
  - **持续监控**：必须监控系统对控制措施和基线的合规性。\n\n### 国防联邦收购条例补充规定 252.204-7012\n\n`国防联邦收购条例补充规定\
  \ (DFARS)` 由美国国防部 (`DoD`) 管理，是联邦收购条例 (`FAR`) 的补充。`DFARS` 提供了 `DoD` 承包商和分包商在采购过程中必须遵循的特定收购条例。`DFARS\
  \ 252.204-7012` 概述了非联邦信息系统中受控非分类信息 (`CUI`)保护的最低安全要求。\n\n**DFARS 252.204-7012 适用于谁？**\
  \ `DFARS 252.204-7012` 适用于在非联邦信息系统中处理、存储或传输 `CUI` 的 `DoD` 承包商和分包商。如果一个机构与 `DoD CUI`\
  \ 合作，该机构必须遵守 `DFARS 252.204-7012` 的要求，并使其业务合规。\n\n**合规如何影响组织？** 必须实施的安全控制指南见于 `NIST\
  \ SP 800-171`《非联邦系统和组织中的受控非分类信息》。`NIST SP 800-171` 基本上是处理 `CUI` 的组织必须实施的网络安全框架。如果\
  \ `DoD` 承包商未能遵守 `DFARS 252.204-7012/NIST SP 800-171`，该承包商将面临一系列可能的刑事、民事、行政或合同处罚风险，包括终止合同和违约赔偿。\n\
  \n### Clinger-Cohen 法案\n\n`1996 年 Clinger-Cohen 法案`是一项美国联邦法律，适用于改进信息技术收购、使用和处置的联邦机构。其目的是改进\
  \ IT 收购、投资和支出以减少浪费。\n\n**Clinger-Cohen 法案适用于谁？** `Clinger-Cohen 法案` 适用于联邦机构。\n\n\
  **合规如何影响组织？** `Clinger-Cohen 法案` 由两项共同通过的法律组成：信息技术改革法 (`ITMRA`) 和联邦收购改革法 (`FARA`)。`Clinger-Cohen\
  \ Act` 的一些关键要求包括：\n\n- 强化机构负责人 IT 管理和投资的责任\n- 执行资本预算规划和投资\n- 开发评估风险和最大化 IT 投资的计划\n\
  - 在机构中建立首席信息官 (`CIO`) 角色\n- 开发 IT 系统的标准和基准\n- 创建企业架构\n- 定期审查预算流程\n\n### 支付行业数据标准\n\
  \n`支付行业数据标准 (PCI DSS)` 是一个专注于保护信用卡信息的控制框架。`PCI DSS` 是隐私和数据安全自我监管方法的示例，因为它不是法律或法规。它是一个由支付行业标准委员会管理和执行的私营行业计划。该委员会由主要的信用卡公司建立，包括\
  \ Visa、MasterCard、Discover、JCB 和美国运。在当时，`PCI DSS` 的当前版本为 `3.2.1`，见 https://www.pcisecuritystandards.org/document_library。\n\
  \n**合规适用于谁？** `PCI DSS` 全球适用于任何处理持卡数据的组织。这包括任何存储、处理或传输持卡数据的组织，例如处理信用卡交易的业务。\n\n\
  **合规如何影响组织？** `PCI DSS` 控制框架由 12 项控制要求组成，分为以下六类：\n\n- 构建和维护安全网络和系统\n- 保护持卡数据\n-\
  \ 维护漏洞管理计划\n- 实施强访问控制措施\n- 定期监控和测试网络\n- 维护信息安全策略\n\n`PCI DSS` 的 12 项控制目标是\n\n- 安装并维护防火墙。\n\
  - 重置供应商提供的默认密码和安全参数。\n- 保护存储的持卡数据。\n- 在开放或公共网络上传输持卡数据时进行加密。\n- 实施并维护更新的反病毒软件或程序。\n\
  \n\n\n\n\n- 在开发应用程序和系统时要考虑安全性。\n- 根据业务知情需要限制对持卡持有者数据的访问。\n- 为每个访问系统的个人分配唯一 ID。\n\
  - 限制对持卡持有者数据的物理访问。\n- 跟踪并监控对持卡持有者数据和网络资源的访问。\n- 定期对系统和流程安全性进行测试。\n- 维护信息安全策略。\n\n\
  未能遵守 PCI DSS 可能导致信用卡公司的罚款、客户、声誉和品牌形象的流失，以及来自客户的诉讼。此外，信用卡公司可能会撤销该机构接受信用卡的权限。\n\n\
  ## 1974 年隐私法\n\n多年来，人们对美国联邦政府参与个人监视和调查，以及政府所持有的个人数据可能被滥用的风险表示极大担忧。`1974 年隐私法（Privacy\
  \ Act）` 是一项美国联邦法，其开发旨在帮助解决这些关注的问题，重点是在政府收集和维护个人个人信息的需要与个人隐私权之间取得平衡。\n\n**隐私法适用于谁？**\
  \ `1974 年隐私法` 适用于美国联邦政府特定部门维护的记录和文件。与许多法律类似，该立法中列有一份豁免机构和情况的例外列表。\n\n**合规对机构有什么影响？**\
  \ `隐私法` 要求机构保护美国联邦政府维护的某些记录。该立法重点关注四个主要政策目标（参见 [`www.justice.gov/opcl/policy-objectives`](https://www.pcisecuritystandards.org/document_library)）：\n\
  \n- 限制机构维护的具有个人身份识别记录的披露\n- 赋予个人增加对机构维护的其自身记录的访问权\n- 在个人证明记录不准确、不相关、不及时或不完整时，赋予其寻求修改机构维护的其自身记录的权利\n\
  - 建立一套“公平信息实践”准则，要求机构遵守记录收集、维护和传播的法定规范\n\n违反该法案可能导致民事诉讼，包括罚款、赔偿和刑事处罚。\n\n## 格姆-莱奇-布莱利法案\n\
  \n`格姆-莱奇-布莱利法案（GLBA）` 又称为《1999 年金融服务现代化法》，要求金融机构保护个人的非公开个人信息。这包括向客户披露其私人信息将如何被保护，以及是否会分给第三方。\n\
  \n**格姆-莱奇-布莱利法案适用于谁？** `GLBA` 对于金融机构是强制性的，包括银行、贷款经纪人、房地产公司、保险公司以及从事提供金融服务或产品的组织。\n\
  \n**合规对机构有什么影响？** `GLBA` 有三个保护客户信息的主要条款：金融隐私规则、安全规则和借口规则（Pretexting Rule）。\n\n`金融隐私规则`要求金融机构向每位客户提供一份隐私通知，概述以下内容：\n\
  \n- 收集的数据类型\n- 机构将如何使用、共享和保护这些数据\n- 客户对数据的权利\n\n`安全规则`要求金融机构制定信息安全计划，该计划包括：\n\n\
  - 指派一名员工管理信息安全计划\n- 开发风险管理计划以识别对客户信息的风险\n- 确保服务提供商保护客户信息\n- 设计、实施、测试和监控控制措施以降低已识别的风险\n\
  - 持续监控信息安全计划\n\n`借口规则`要求金融机构实施控制以防御借口欺骗（pretexting），也称为社会工程学，这包括通过电话、邮件或电子邮件冒充账户持有者以收集其私人数据。（社会工程学在第\
  \ 4 章中有更深入的介绍。）`GLBA` 将试图通过借口欺骗获取或披露客户信息定为非法行为。为了满足该领域的 `GLBA` 要求，机构必须制定安全措施。\n\n\
  \n\n\n\n-   允许家长和学生访问学生的教育记录\n-   赋予家长和学生要求修改教育记录的能力\n-   要求学校在获得家长或学生的书面许可后，方可披露学生的教育记录信息\n\
  \n不遵守 FERPA（教育学生权利与隐私法案）可能会导致失去美国教育部的资助。\n\n### 萨班斯-奥克斯利法案\n\n`2002 年萨班斯-奥克斯利法案\
  \ (SOX)`，也被称为`2002 年公共公司会计改革与投资者保护法案`，是一部美国联邦法，专注于让董事会成员和高管对其组织财务报表的准确性负责。`SOX`\
  \ 的通过是因为许多大规模丑闻事件，在这些丑闻中，高管故意在财务上误导公众（例如，安恩公司），导致了数十亿美元投资者资金的损失。\n\n### SOX 适用于哪些对象？\n\
  `SOX` 适用于所有在美国经营业务的上市公司。这包括任何在美国市场公开上市的公司。\n\n### 合规对组织有什么影响？\n`SOX` 的目标是减少欺诈，并让董事会成员和高管对财务报表的准确性负责。该法律的大部分内容与会计实践有关，法律的`第\
  \ 404 节`除外，该节适用于信息技术。`SOX` `第 404 节` 是内部控制评估活动的驱动力，要求：\n\n-   管理层负责建立和维护财务报告的适当内部控制\n\
  -   由公共会计师对内部控制的有效性进行评估\n\n这些对内部控制的要求通常通过为组织实施一套针对其特定需求定制的行业安全框架来实现。\n\n未能遵守 `SOX`\
  \ 规定可能会导致负面声誉、法律诉讼以及罚款和监禁。如果发现其公司向证券交易委员会 (`SEC`) 提交了虚假财务报表，高管可能会入狱。\n\n### 通用数据保护条例\n\
  \n`通用数据保护条例 (GDPR)` 是一部欧盟 (EU) 隐私法，旨在监管欧盟公民个人数据的处理。\n\n### GDPR 适用于哪些对象？\n`GDPR`\
  \ 适用于处理个人数据的欧盟境内组织，也适用于向欧盟提供服务并涉及处理欧盟公民数据的欧盟境外组织。这意味着，如果一家位于欧盟以外的业务拥有网络业务，并在提供服务过程中收集了欧盟个人数据，那么该业务无论位于何处，都需要遵守\
  \ `GDPR`。因此，如果美国公司想与欧盟企业开展业务，或在欧盟成员国境内拥有客户，则它们可能需要遵守 `GDPR`。\n\n### 合规对组织有什么影响？\n\
  该立法旨在将个人个人数据的控制权交回个人手中。`GDPR` 的一些关键条款包括：\n\n-   **同意**：要求处理个人数据的组织在出于特定合法目的之外处理其数据时，获得数据主体的知情同意。还要求条款和条件声明必须清晰明了，不能采取一揽子同意。\n\
  -   **泄露通知**：公司必须在发现安全泄露后 72 小时内通知数据主体。\n-   **访问权**：根据数据主体的请求，公司必须确认其个人数据正在被处理，包括在何处以及出于什么目的。公司还必须免费向数据主体提供数据副本。公司有一个月的时间响应数据主体的访问请求。\n\
  -   **被遗忘权**：公司要求在收到数据主体请求时删除个人数据。\n-   **数据可携带性**：公司必须为数据主体提供一种方法，以常用的机器可读格式接收关于自己的数据。数据主体还有权要求将其数据免费传输到另一公司。\n\
  -   **设计即隐私**：数据保护和隐私必须从设计过程之初就予以考虑，并且应仅收集处理所绝对需要的数据。\n-   **数据保护官**：符合某些标准的组织将被要求指定数据保护官\
  \ (`DPO`) 来监督 `GDPR` 的合规情况。\n\n`GDPR` 根据违规性质处以巨额罚款。罚金最高可达 2000 万欧元或年度全球营收的 4%，以较高者为准。\n\
  \n![Images](img/note.jpg)\n\n**注意**：脱欧后，由于英国 (UK) 退出欧盟，在 2020 年 1 月 31 日至 2020 年\
  \ 12 月 31 日的过渡期，英国仍受欧盟法律（包括 `GDPR`）约束，除非达成额外的延长。这意味着英国公民在过渡期内仍受 GDPR` 保护。过渡期结束后，将遵循英国修订版的\
  \ `GDPR`，即 `UK GDPR`，它将涵盖英国公民数据的保护。然而，如果英国组织收集欧盟公民的个人数据，它们仍将受欧盟 `GDPR` 的约束。\n\n\
  ## 北美电力可靠性协会关键基础设施保护\n\n`北美电力可靠性协会 (NERC)` 开发了能源系统运行和监控的标准，并强制执行这些标准的合规。这些标准对于所有北美大容量电力系统都是强制性的。`NERC`\
  \ 的权力由联邦电力监管委员会 (`FERC`) 授予，`FERC` 将 `NERC` 指定为国家可靠性组织 (`ERO`)。`NERC` 开发了关键基础设施保护\
  \ (`CIP`) 标准，即 `NERC CIP`，这是一个针对北美电网安全的网络安全标准。`NERC CIP` 为北美电力系统的关键保护提供了框架。\n\n\
  ### NERC CIP 适用于哪些对象？\n`NERC` 标准概述了北美电力基础设施的控制措施。这包括 `NERC CIP` 网络安全系列标准。此前，`NERC`\
  \ 标准是自愿的。由于 2005 年能源政策法案，这种情况发生了变化，该法案授权 `FERC` 使 `NERC` 标准强制化。这些标准现在对所有大容量电力系统都是强制性的。这意味着参与北美电力输传输、发电和互联的组织必须遵守\
  \ `NERC` 标准。这是在电力行业经营业务的条件。\n\n### 合规对组织有什么影响？\n截至本文，`NERC` 网络安全标准 `NERC CIP` 包含\
  \ 11 项标准。根据 [`www.nerc.com/pa/Stand/Pages/CIPStandards.aspx`](https://www.nerc.com/pa/Stand/Pages/CIPStandards.aspx)，目前执行的标准如下：\n\
  \n-   **CIP-002**: 网络安全 – BES 电系统分类\n-   **CIP-003**: 网络安全 – 安全管理控制\n-   **CIP-004**:\
  \ 网络安全 – 人员与培训\n-   **CIP-005**: 网络安全 – 电子边界\n-   **CIP-006**: 网络安全 – BES 系统的物理安全\n\
  -   **CIP-007**: 网络安全 – 系统安全管理\n-   **CIP-008**: 网络安全 – 事故报告与响应计划\n-   **CIP-009**:\
  \ 网络安全 – BES 系统的恢复计划\n-   **CIP-010**: 网络安全 – 配置变更管理与漏洞评估\n-   **CIP-011**: 网络安全\
  \ – 信息保护\n-   **CIP-014**: 物理安全\n\n\n\n\n\nNERC CIP 标准通过定期的 CIP 合规性审计强制执行，因此批量电力系统组织能够证明其合规性至关重要。不遵守\
  \ NERC CIP 可能导致巨额罚款。\n\n## 法律与监管驱动因素摘要\n\n表 1-4 提供了本节涵盖的监管驱动因素的高级总结。\n\n![Images](img/p75.jpg)\n\
  \n`Table 1-4` 法律与监管驱动因素受影响行业摘要\n\n## 标准与框架\n\n有许多非监管标准和最佳实践框架，可以帮助组织构建其信息安全计划。虽然实施这些标准可能没有法律要求，但它们可以作为构建安全计划的基础性工具，建立合规性基准，并允许\
  \ `CISO` 识别当前策略中的差距。此外，将实践与行业框架对齐展示了某种程度的承诺，这种承诺可能会受到客户、合作伙伴和利益利益相关者的重视。本节讨论的标准和框架列如下：\n\
  \n• `ISO/IEC 27000` 系列\n• `ISO/IEC 27001`\n• `NIST Cybersecurity Framework` (NIST\
  \ 网络安全框架)\n• `Federal Information Processing Standards (FIPS)` (联邦信息处理标准)\n• `NIST\
  \ Special Publications` (NIST 特别出版)\n• `Privacy Shield` (隐私盾)\n• `COBIT`\n\n![Images](img/exam.jpg)\n\
