- raw: "An interface can embed another interface, as well as another interface’s method\
    \ set. You can embed as many interfaces as you want into your interface. If you\
    \ make any changes to those, you’ll change the embedded interface as well.\n\n\
    Let’s take a look at how that could manifest in practice:\n\n> package main\n\n\
    > \n\n> import “fmt”\n\n> \n\n> //interface 1\n\n> \n\n> type WriterDetails interface\
    \ {\n\n> \n\n> details()\n\n> \n\n> }\n\n> \n\n> //interface 2\n\n> \n\n> type\
    \ WriterArticles interface {\n\n> \n\n> articles()\n\n> \n\n> picked()\n\n> \n\
    \n> }\n\n> \n\n> //interface 3\n\n> \n\n> //interface 3 is embedded with 1’s method,\
    \ interface 2, and its own method\n\n> \n\n> type SummaryDetails interface {\n\
    \n> \n\n> details()\n\n> \n\n> WriterArticles\n\n> \n\n> wdeets()\n\n> \n\n> }\n\
    \n> \n\n> type writer struct {\n\n> \n\n> w\\_namestring\n\n> \n\n> sectionstring\n\
    \n> \n\n> collegestring\n\n> \n\n> yearint\n\n> \n\n> incomeint\n\n> \n\n> particlesint\n\
    \n> \n\n> tarticlesint\n\n> \n\n> widint\n\n> \n\n> poststring\n\n> \n\n> pickint\n\
    \n> \n\n> }\n\n> \n\n> //implement method of interface 1\n\n> \n\n> func (w writer)\
    \ details () {\n\n> \n\n> fmt.Printf(“Writer name :%b”, w.w\\_name)\n\n> \n\n\
    > fmt.Printf(“\\\\nsection :%b and passing year :%d”, w.section, w.year)\n\n>\
    \ \n\n> fmt.Printf(”\\\\ncollege name :%b, w.college)\n\n> \n\n> fmt.Printf(“\\\
    \\nincome :%d”, w.income)\n\n> \n\n> fmt.Printf(“\\\\nPublished Articles :%d”,\
    \ w.particles)\n\n> \n\n> }\n\n> \n\n> //implement interface 2 methods\n\n> \n\
    \n> func (w writer) articles() {\n\n> \n\n> pendingarticles = w.tarticles - w.particles\n\
    \n> \n\n> fmt.Printf(“\\\\nPending articles :%d”, w.pendingarticles\n\n> \n\n\
    > }\n\n> \n\n> func (w writer) picked() {\n\n> \n\n> fmt.Printf(\\\\nTotal number\
    \ of picked articles :%d”, w.pick)\n\n> \n\n> }\n\n> \n\n> //implementing methods\
    \ of embedded interface 3\n\n> \n\n> func (w writer) wdeets() {\n\n> \n\n> fmt.Printf\
    \ (“\\\\nWriter ID : %d”, w.wid)\n\n> \n\n> fmt.Printf(“\\\\nPost :%b, w.post)\n\
    \n> \n\n> }\n\n> \n\n> func main() {\n\n> \n\n> //assign values to the structure\n\
    \n> \n\n> values := writer{\n\n> \n\n> w\\_name: “Agatha”,\n\n> \n\n> section:\
    \ “Computer coding”,\n\n> \n\n> college:“BestSchoolEver”,\n\n> \n\n> year: 2020,\n\
    \n> \n\n> income:60000,\n\n> \n\n> particles:300,\n\n> \n\n> tarticles:400,\n\n\
    > \n\n> wid:666,\n\n> \n\n> post:“Technical Code Writer”,\n\n> \n\n> pick:66,\n\
    \n> \n\n> }\n\n> \n\n> //access methods from interfaces 1 and 2 using SummaryDetails\
    \ interface\n\n> \n\n> var s SummaryDetails = values\n\n> \n\n> s.details()\n\n\
    > \n\n> s.articles()\n\n> \n\n> s.picked()\n\n> \n\n> s.wdeets()\n\n> \n\n> }\n\
    \nFrom here, you know what the output looks like, so I’ll keep it short. This\
    \ example shows how the embedded interface (3) uses elements from the embedding\
    \ interfaces 1 and 2.\n\n## Type Assertions\n\n*Type assertion* is how you pull\
    \ the values out of the interface to check whether the dynamic type matches the\
    \ asserted type. If it does, the type assertion returns the dynamic value. If\
    \ it doesn’t, you get a panic. Type assertion helps you remove any ambiguity from\
    \ the variables of the interface itself. The syntax for this is:\n\n> t := value.(typeName)\n\
    \nIn this, *value* is a variable of interface type, *typeName* is the concrete\
    \ (AKA dynamic) type to check, and *t* is the variable with the underlying typeName\
    \ value.\n\nIf you want to check whether the interface value holds a specific\
    \ type, use type assertion to return two values. One is the boolean true/false,\
    \ the other is the variable with typeName value. Here’s an example showing type\
    \ assertion with error checking:\n\n> package main\n\n> \n\n> import “fmt”\n\n\
    > \n\n> func main()\n\n> \n\n> //interface with int value\n\n> \n\n> var value\
    \ interface{} 30035\n\n> \n\n> //retrieve a type int value and assign to the variable\
    \ value1\n\n> \n\n> var value1 int = value.(int)\n\n> \n\n> //print the concrete\
    \ value\n\n> \n\n> fmt.Println(value1)\n\n> \n\n> //test if interface has string\
    \ type\n\n> \n\n> //if so, then true and if not then false\n\n> \n\n> value2,\
    \ test := value.(string)\n\n> \n\n> if test {\n\n> \n\n> fmt.Println(“String found!”)\n\
    \n> \n\n> fmt.Println(value2)\n\n> \n\n> } else {\n\n> \n\n> fmt.Println(“String\
    \ not found!”)\n\n> \n\n> }\n\n> \n\n> }\n\nSince the typeName is int and not\
    \ string, you’d see the following output:\n\n> *30035*\n\n> \n\n> *String not\
    \ found!*\n\nAssertions of any kind in Go help programmers check their code, allow\
    \ the compiler to compile it, and find any code defects.\n\n## Type Switches\n\
    \nWhen you’re not sure what type the interface could be, a type switch runs multiple\
    \ type assertions to find the variable type. Rather than coding multiple if-else\
    \ statements, a type switch allows you to shorten the code so you can develop\
    \ it quickly. It’ll run the first switch case that matches the specified type.\
    \ Here’s an illustration of this:\n\n> package main\n\n> \n\n> import “fmt”\n\n\
    > \n\n> func main() {\n\n> \n\n> //this interface is a string type\n\n> \n\n>\
    \ var value interface {} = “All your code are belong to us”\n\n> \n\n> //use type\
    \ switch to find out what type it is (as if you didn't already know)\n\n> \n\n\
    > switch t := value.(type){\n\n> \n\n> case int64:\n\n> \n\n> //prints if type\
    \ of interface is int64\n\n> \n\n> fmt.Println(“Type is an integer:”, t)\n\n>\
    \ \n\n> case float64:\n\n> \n\n> fmt.Println(“Type is a float:”, t)\n\n> \n\n\
    > case nil:\n\n> \n\n> fmt.Println(“Type is nil.”)\n\n> \n\n> case string:\n\n\
    > \n\n> fmt.Println(“Type is a string:”, t)\n\n> \n\n> case bool:\n\n> \n\n> fmt.Println(“Type\
    \ is a bool:”, t)\n\n> \n\n> case default:\n\n> \n\n> //if type is none of the\
    \ above\n\n> \n\n> fmt.Println(“Type is unknown!”)\n\n> \n\n> }\n\nOutput includes\
    \ the string element:\n\n> *Type is a string: All your code are belong to us*\n\
    \n## Implementing an Interface\n\nThe interface defines (but doesn’t declare)\
    \ the behavior of the element. Suppose you have *Cat* that can *meow* and *zoom*\
    \ . An interface that defines the method sets for zoom and meow while Cat implements\
    \ the methods for zoom and meow results in cat implementing that interface.\n\n\
    Now, let’s say you have a variable of interface type that holds a value of a type\
    \ that implements the interface. The value of that type becomes the dynamic (or\
    \ concrete) value of the interface, and the type becomes the dynamic type of the\
    \ interface.\n\nIn this example, we’ll create an interface Shape with Area and\
    \ Perimeter methods. The program creates the struct Shape, which will implement\
    \ the Shape interface by implementing its methods:\n\n> package main\n\n> \n\n\
    > import “fmt”\n\n> \n\n> type Shape interface {\n\n> \n\n> Area() Float64\n\n\
    > \n\n> Perimeter() Float 64\n\n> \n\n> }\n\n> \n\n> type Rectangle struct {\n\
    \n> \n\n> width float64\n\n> \n\n> heightfloat64\n\n> \n\n> }\n\n> \n\n> //Area\
    \ belongs to Rectangle struct type, so Rectangle implements the method\n\n> \n\
    \n> func (r Rectangle) Area() float64{\n\n> \n\n> return r.width\\*r.height\n\n\
    > \n\n> }\n\n> \n\n> //although we are not forcing Rectangle to implement Shape\
    \ interface, it’s doing so by implementing the method\n\n> \n\n> func (r Rectangle)\
    \ Perimeter() float64{\n\n> \n\n> return 2 \\* (r.width + r.height)\n\n> \n\n\
    > }\n\n> \n\n> func main () {\n\n> \n\n> var s Shape\n\n> \n\n> s = Rectangle{1.0,\
    \ 2.0}\n\n> \n\n> r := Rectangle{1.0, 2.0}\n\n> \n\n> fmt.Printf(“Type of s is\
    \ %T\\\\n”, s)\n\n> \n\n> fmt.Printf(“Value of s is %v\\\\n”, s)\n\n> \n\n> fmt.Println(“Area\
    \ of rectangle s is”, s.area)\n\n> \n\n> }\n\nThe output would be:\n\n> *Type\
    \ of s is main.Rectangle*\n\n> \n\n> *Value of s is {1, 2}*\n\n> \n\n> *Area of\
    \ rectangle s is 2*\n\nThe dynamic type (s) of the interface is now (struct) type\
    \ Rectangle. The dynamic value of Shape is now the value of (struct) Rectangle\
    \ of {1, 2}.\n\nYou can also change the dynamic type and value within the program\
    \ from one to another, as shown below:\n\n> package main\n\n> \n\n> import (\n\
    \n> \n\n> “fmt”\n\n> \n\n> “math”\n\n> \n\n> )\n\n> \n\n> //using the same Shape\
    \ interface as above\n\n> \n\n> type Shape interface {\n\n> \n\n> Area() Float64\n\
    \n> \n\n> Perimeter() Float 64\n\n> \n\n> }\n\n> \n\n> //also the same Rectangle\
    \ struct\n\n> \n\n> type Rectangle struct {\n\n> \n\n> width float64\n\n> \n\n\
    > heightfloat64\n\n> \n\n> }\n\n> \n\n> //adding another struct\n\n> \n\n> type\
    \ Circle struct {\n\n> \n\n> radius float64\n\n> \n\n> }\n\n> \n\n> //as seen\
    \ above\n\n> \n\n> func (r Rectangle) Area() float64{\n\n> \n\n> return r.width\\\
    *r.height\n\n> \n\n> }\n\n> \n\n> func (r Rectangle) Perimeter() float64{\n\n\
    > \n\n> return 2 \\* (r.width + r.height)\n\n> \n\n> }\n\n> \n\n> //now adding\
    \ the Shape methods for Circle\n\n> "
  fmt: "An interface can embed another interface, as well as another interface’s method\
    \ set. You can embed as many interfaces as you want into your interface. If you\
    \ make any changes to those, you’ll change the embedded interface as well.\n\n\
    Let’s take a look at how that could manifest in practice:\n\n```go\npackage main\n\
    \nimport “fmt”\n\n//interface 1\ntype WriterDetails interface {\n\tdetails()\n\
    }\n\n//interface 2\ntype WriterArticles interface {\n\tarticles()\n\tpicked()\n\
    }\n\n//interface 3\n//interface 3 is embedded with 1’s method, interface 2, and\
    \ its own method\ntype SummaryDetails interface {\n\tdetails()\n\tWriterArticles\n\
    \twdeets()\n}\n\ntype writer struct {\n\tw_name string\n\tsection string\n\tcollege\
    \ string\n\tyear int\n\tincome int\n\tparticles int\n\ttarticles int\n\twid int\n\
    \tpost string\n\tpick int\n}\n\n//implement method of interface 1\nfunc (w writer)\
    \ details () {\n\tfmt.Printf(“Writer name :%b”, w.w_name)\n\tfmt.Printf(“\\\\\
    nsection :%b and passing year :%d”, w.section, w.year)\n\tfmt.Printf(”\\\\ncollege\
    \ name :%b, w.college)\n\tfmt.Printf(“\\\\nincome :%d”, w.income)\n\tfmt.Printf(“\\\
    \\nPublished Articles :%d”, w.particles)\n}\n\n//implement interface 2 methods\n\
    func (w writer) articles() {\n\tpendingarticles = w.tarticles - w.particles\n\t\
    fmt.Printf(“\\\\nPending articles :%d”, w.pendingarticles\n}\n\nfunc (w writer)\
    \ picked() {\n\tfmt.Printf(\\\\nTotal number of picked articles :%d”, w.pick)\n\
    }\n\n//implementing methods of embedded interface 3\nfunc (w writer) wdeets()\
    \ {\n\tfmt.Printf (“\\\\nWriter ID : %d”, w.wid)\n\tfmt.Printf(“\\\\nPost :%b,\
    \ w.post)\n}\n\nfunc main() {\n\t//assign values to the structure\n\tvalues :=\
    \ writer{\n\t\tw_name: “Agatha”,\n\t\tsection: “Computer coding”,\n\t\tcollege:“BestSchoolEver”,\n\
    \t\tyear: 2020,\n\t\tincome:60000,\n\t\tparticles:300,\n\t\ttarticles:400,\n\t\
    \twid:666,\n\t\tpost:“Technical Code Writer”,\n\t\tpick:66,\n\t}\n\n\t//access\
    \ methods from interfaces 1 and 2 using SummaryDetails interface\n\tvar s SummaryDetails\
    \ = values\n\ts.details()\n\ts.articles()\n\ts.picked()\n\ts.wdeets()\n}\n```\n\
    \nFrom here, you know what the output looks like, so I’ll keep it short. This\
    \ example shows how the embedded interface (3) uses elements from the embedding\
    \ interfaces 1 and 2.\n\n## Type Assertions\n\n*Type assertion* is how you pull\
    \ the values out of the interface to check whether the dynamic type matches the\
    \ asserted type. If it does, the type assertion returns the dynamic value. If\
    \ it doesn’t, you get a panic. Type assertion helps you remove any ambiguity from\
    \ the variables of the interface itself. The syntax for this is:\n\n`t := value.(typeName)`\n\
    \nIn this, `value` is a variable of interface type, `typeName` is the concrete\
    \ (AKA dynamic) type to check, and `t` is the variable with the underlying `typeName`\
    \ value.\n\nIf you want to check whether the interface value holds a specific\
    \ type, use type assertion to return two values. One is the boolean true/false,\
    \ the other is the variable with `typeName` value. Here’s an example showing type\
    \ assertion with error checking:\n\n```go\npackage main\n\nimport “fmt”\n\nfunc\
    \ main() {\n\t//interface with int value\n\tvar value interface{} 30035\n\n\t\
    //retrieve a type int value and assign to the variable value1\n\tvar value1 int\
    \ = value.(int)\n\n\t//print the concrete value\n\tfmt.Println(value1)\n\n\t//test\
    \ if interface has string type\n\tvalue2, ok := value.(string)\n\tif ok {\n\t\t\
    fmt.Println(value2)\n\t} else {\n\t\tfmt.Println(“String found!\")\n\t}\n}\n```\n\
    \nSince the interface value is int, you’d see the following output:\n\n`30035`\n\
    `String found!`\n\n## Type Switches\n\nWhen you’re not sure what type the interface\
    \ could be, a type switch runs. Rather than coding multiple if-else statements,\
    \ type switch allows you to shorten the code. For example:\n\n```go\npackage main\n\
    \nimport “fmt”\n\nfunc main() {\n\tvar value interface{} = 30035\n\n\tswitch t\
    \ := value.(type) {\n\tcase int:\n\t\tfmt.Println(\"Type is int:\", t)\n\tcase\
    \ string:\n\t\tfmt.Println(\"Type is string:\", t)\n\tdefault:\n\t\tfmt.Println(\"\
    Unknown type\")\n\t}\n}\n```\n\n## Implementing an Interface\n\nSuppose you have\
    \ an interface that defines some methods. Any type that implements all those methods\
    \ is considered to implement that interface. Here’s an illustration of this:\n\
    \n```go\npackage main\n\nimport “fmt”\n\ntype Shape interface {\n\tArea() float64\n\
    \tPerimeter() float64\n}\n\ntype Rectangle struct {\n\twidth float64\n\theight\
    \ float64\n}\n\nfunc (r Rectangle) Area() float64 {\n\treturn r.width * r.height\n\
    }\n\nfunc (r Rectangle) Perimeter() float64 {\n\treturn 2 * (r.width + r.height)\n\
    }\n\nfunc main() {\n\tvar s Shape\n\ts = Rectangle{1.0, 2.0}\n\tfmt.Printf(\"\
    Type of s is %T\\n\", s)\n\tfmt.Printf(\"Value of s is %v\\n\", s)\n\tfmt.Println(\"\
    Area of rectangle s is\", s.Area())\n}\n```\n\nThe output is:\n\n`Type of s is\
    \ main.Rectangle`\n`Value of s is {1 2}`\n`Area of rectangle s is 2`\n\nThe dynamic\
    \ type (s) of the interface is now `main.Rectangle`. The dynamic value of `Shape`\
    \ is now the value of `Rectangle` of {1 2}. You can also change the dynamic type\
    \ and value within the program from one to another, as shown below:\n\n```go\n\
    package main\n\nimport (\n\t“fmt”\n\t“math”\n)\n\ntype Shape interface {\n\tArea()\
    \ float64\n\tPerimeter() float64\n}\n\ntype Rectangle struct {\n\twidth float64\n\
    \theight float64\n}\n\nfunc (r Rectangle) Area() float64 {\n\treturn r.width *\
    \ r.height\n}\n\nfunc (r Rectangle) Perimeter() float64 {\n\treturn 2 * (r.width\
    \ + r.height)\n}\n\ntype Circle struct {\n\tradius float64\n}\n\nfunc (c Circle)\
    \ Area() float64 {\n\treturn math.Pi * math.Pow(c.radius, 2)\n}\n\nfunc (c Circle)\
    \ Perimeter() float64 {\n\treturn 2 * math.Pi * c.radius\n}\n\nfunc main() {\n\
    \tvar s Shape\n\ts = Rectangle{1.0, 2.0}\n\ts = Circle{5.0}\n}\n```\n"
  trans: "\n接口可以嵌入另一个接口，还可以嵌入另一个接口的方法集。你可以根据需要向接口嵌入任意数量的接口。如果你对这些接口进行任何更改，也会更改被嵌入的接口。\n\
    \n让我们来看看这在实践中是如何体现的：\n\n```go\npackage main\n\nimport “fmt”\n\n//interface 1\n\
    type WriterDetails interface {\n\tdetails()\n}\n\n//interface 2\ntype WriterArticles\
    \ interface {\n\tarticles()\n\tpicked()\n}\n\n//interface 3\n//interface 3 嵌入了接口\
    \ 1 的方法、接口 2 以及它自己的方法\ntype SummaryDetails interface {\n\tdetails()\n\tWriterArticles\n\
    \twdeets()\n}\n\ntype writer struct {\n\tw_name string\n\tsection string\n\tcollege\
    \ string\n\tyear int\n\tincome int\n\tparticles int\n\ttarticles int\n\twid int\n\
    \tpost string\n\tpick int\n}\n\n//实现接口 1 的方法\nfunc (w writer) details () {\n\t\
    fmt.Printf(“Writer name :%b”, w.w_name)\n\tfmt.Printf(“\\\\nsection :%b and passing\
    \ year :%d”, w.section, w.year)\n\tfmt.Printf(”\\\\ncollege name :%b, w.college)\n\
    \tfmt.Printf(“\\\\nincome :%d”, w.income)\n\tfmt.Printf(“\\\\nPublished Articles\
    \ :%d”, w.particles)\n}\n\n//实现接口 2 的方法\nfunc (w writer) articles() {\n\tpendingarticles\
    \ = w.tarticles - w.particles\n\tfmt.Printf(“\\\\nPending articles :%d”, w.pendingarticles\n\
    }\n\nfunc (w writer) picked() {\n\tfmt.Printf(\\\\nTotal number of picked articles\
    \ :%d”, w.pick)\n}\n\n//实现嵌入接口 3 的方法\nfunc (w writer) wdeets() {\n\tfmt.Printf\
    \ (“\\\\nWriter ID : %d”, w.wid)\n\tfmt.Printf(“\\\\nPost :%b, w.post)\n}\n\n\
    func main() {\n\t//给结构体赋值\n\tvalues := writer{\n\t\tw_name: “Agatha”,\n\t\tsection:\
    \ “Computer coding”,\n\t\tcollege:“BestSchoolEver”,\n\t\tyear: 2020,\n\t\tincome:60000,\n\
    \t\tparticles:300,\n\t\ttarticles:400,\n\t\twid:666,\n\t\tpost:“Technical Code\
    \ Writer”,\n\t\tpick:66,\n\t}\n\n\t//使用 SummaryDetails 接口访问接口 1 和 2 的方法\n\tvar\
    \ s SummaryDetails = values\n\ts.details()\n\ts.articles()\n\ts.picked()\n\ts.wdeets()\n\
    }\n```\n\n从这里你已经知道输出是什么样的了，所以我就简单点说。这个示例展示了嵌入接口 (3) 如何使用嵌入接口 1 和 2 中的元素。\n\n##\
    \ 类型断言 (Type Assertions)\n\n*类型断言*是从接口中提取值并检查动态类型是否匹配断言类型的方法。如果匹配，则类型断言将返回该动态值。如果不匹配，则会发生\
    \ panic（崩溃）。类型断言帮助你消除接口变量本身的任何歧义。其语法为：\n\n`t := value.(typeName)`\n\n其中，`value`\
    \ 是接口类型的变量，`typeName` 是要检查的具体类型（又称动态类型），而 `t` 是具有底层 `typeName` 值的变量。\n\n如果你想检查接口值是否持有特定类型，请使用类型断言返回两个值。其中一个是布尔值\
    \ true/false，另一个是具有 `typeName` 值的变量。这是一个带有错误检查的类型断言示例：\n\n```go\npackage main\n\
    \nimport “fmt”\n\nfunc main() {\n\t// 带有 int 值的接口\n\tvar value interface{} 30035\n\
    \n\t// 获取 int 类型的值并赋值给变量 value1\n\tvar value1 int = value.(int)\n\n\t// 打印具体值\n\
    \tfmt.Println(value1)\n\n\t// 测试接口是否为 string 类型\n\tvalue2, ok := value.(string)\n\
    \tif ok {\n\t\tfmt.Println(value2)\n\t} else {\n\t\tfmt.Println(“String found!\"\
    )\n\t}\n}\n```\n\n由于接口值是 int，你将看到以下输出：\n\n`30035`\n`String found!`\n\n## 类型切换\
    \ (Type Switches)\n\n当你不确定接口可能是什么类型时，会运行类型切换。与其编写多个 if-else 语句相比，类型切换允许你缩短代码。例如：\n\
    \n```go\npackage main\n\nimport “fmt”\n\nfunc main() {\n\tvar value interface{}\
    \ = 30035\n\n\tswitch t := value.(type) {\n\tcase int:\n\t\tfmt.Println(\"Type\
    \ is int:\", t)\n\tcase string:\n\t\tfmt.Println(\"Type is string:\", t)\n\tdefault:\n\
    \t\tfmt.Println(\"Unknown type\")\n\t}\n}\n\n## 实现接口\n\n假设你有一个定义了一些方法的接口。任何实现了这些方法的类型都被认为实现了该接口。这里有一个示例说明：\n\
    \n```go\npackage main\n\nimport “fmt”\n\ntype Shape interface {\n\tArea() float64\n\
    \tPerimeter() float64\n}\n\ntype Rectangle struct {\n\twidth float64\n\theight\
    \ float64\n}\n\nfunc (r Rectangle) Area() float64 {\n\treturn r.width * r.height\n\
    }\n\nfunc (r Rectangle) Perimeter() float64 {\n\treturn 2 * (r.width + r.height)\n\
    }\n\nfunc main() {\n\tvar s Shape\n\ts = Rectangle{1.0, 2.0}\n\tfmt.Printf(\"\
    Type of s is %T\\n\", s)\n\tfmt.Printf(\"Value of s is %v\\n\", s)\n\tfmt.Println(\"\
    Area of rectangle s is\", s.Area())\n}\n```\n\n输出为：\n\n`Type of s is main.Rectangle`\n\
    `Value of s is {1 2}`\n`Area of rectangle s is 2`\n\n接口的动态类型 (s) 现在是 `main.Rectangle`。`Shape`\
    \ 的动态值现在是 `Rectangle` 的 `{1 2}`。你也可以在程序中将其更改动态类型和值，如下所示：\n\n```go\npackage main\n\
    \nimport (\n\t“fmt”\n\t“math”\n)\n\ntype Shape interface {\n\tArea() float64\n\
    \tPerimeter() float64\n}\n\ntype Rectangle struct {\n\twidth float64\n\theight\
    \ float64\n}\n\nfunc (r Rectangle) Area() float64 {\n\treturn r.width * r.height\n\
    }\n\nfunc (r Rectangle) Perimeter() float64 {\n\treturn 2 * (r.width + r.height)\n\
    }\n\ntype Circle struct {\n\tradius float64\n}\n\nfunc (c Circle) Area() float64\
    \ {\n\treturn math.Pi * math.Pow(c.radius, 2)\n}\n\nfunc (c Circle) Perimeter()\
    \ float64 {\n\treturn 2 * math.Pi * c.radius\n}\n\nfunc main() {\n\tvar s Shape\n\
    \ts = Rectangle{1.0, 2.0}\n\ts = Circle{5.0}\n}\n```\n"
