- raw: "Reflection is the mechanism that examines the value and type pair stored inside\
    \ the interface variable. It’s particularly helpful when you’re doing things like\
    \ querying a database or creating one that has data of unknown types in it. The\
    \ reflect package helps you determine the type as well as the number of fields.\n\
    \nThe package *reflect* includes two types, which are simply Type and Value. It\
    \ has two functions, reflect.Typeof and reflect.Valueof, which return reflect.Type\
    \ and reflect.Value from the interface. Here’s a quick example:\n\n> package main\n\
    \n> \n\n> import (\n\n> \n\n> “fmt”\n\n> \n\n> “reflect”\n\n> \n\n> )\n\n> \n\n\
    > func main() {\n\n> \n\n> var y float 3.14\n\n> \n\n> fmt.Println(“Type”, reflect.Typeof(y))\n\
    \n> \n\n> }\n\nAs a result, you see\n\n> *Type float64*\n\nAt first glance, you\
    \ might think that the float64 variable y is what’s being passed, not the interface.\
    \ However, reflect.Typeof contains an empty interface. When you call the function\
    \ reflect.Typeof(y), an empty interface stores y. That’s passed as the argument,\
    \ then the function unpacks the empty interface to find the type information.\
    \ Similarly, reflect.Valueof retrieves the value information of the pair.\n\n\
    There are three pillars to the Reflect package: type, kind, and value. You’ve\
    \ seen type and value above. Kind refers to the representation of a type and can\
    \ be obtained using type.Kind().\n\nIn Go, reflection goes from the interface\
    \ value to the object of reflection. This is known as the first law of reflection.\
    \ The second law is that reflection goes from the reflection object to the interface\
    \ value. In other words, reflection has its own inverse. If you’re given a reflect.Value,\
    \ the interface value can be recovered from it. The third law involves a characteristic\
    \ known as *settability* , which not all values have. It is the property that\
    \ a reflection object can change the storage used to create that object. In other\
    \ words, a reflection value is settable if it holds the original item. You’ll\
    \ get an error trying to call a Set method on a non-settable value.\n\nHere’s\
    \ a snippet of code that generates a panic, even though you might think it appears\
    \ valid:\n\n> var y float64 = 3.14\n\n> \n\n> v := reflect.Valueof(y)\n\n> \n\n\
    > v.SetFloat(6.28)\n\nIn the above code, a copy of y is passed to reflect.Valueof,\
    \ not y itself. Therefore, rather than changing variable y to 6.28, you would\
    \ be changing the copy of y to 6.28, which doesn’t make any sense. Settability\
    \ prevents you from doing so.\n\nYou can find out if a value is settable using\
    \ the CanSet method:\n\n> var y float64 = 3.14\n\n> \n\n> v := reflect.Valueof(y)\n\
    \n> \n\n> fmt.Println(“settability of v:”, v.Canset())\n\n> \n\n> //which in this\
    \ case would print settability of v: false\n\nIt’s very similar to using a “plain”\
    \ function f(x). Here, since a copy of x is passed to the function, you wouldn’t\
    \ expect f to be able to change x. If you want to modify x directly, you’d need\
    \ to pass a pointer to x, which would look like f (&x).\n\nSimilarly, if you want\
    \ to pass y through reflection, first you need a pointer to the y value that you\
    \ want to change. Here’s what that would look like in the previous example:\n\n\
    > var y float64 = 3.14\n\n> \n\n> //take y’s address\n\n> \n\n> z := reflectValueof(&y)\n\
    \n> \n\n> //reflection object z isn’t settable, so we need to get what z points\
    \ to\n\n> \n\n> //call Elem method on value to get there\n\n> \n\n> //then save\
    \ in a reflection value\n\n> \n\n> v := z.Elem()\n\n> \n\n> //now that finally\
    \ represents y, so we can modify it\n\n> \n\n> v.SetFloat = 6.28\n\n> \n\n> fmt.Println(v.interface())\n\
    \n> \n\n> fmt.Println(y)\n\n> \n\n> // yields the result 6.28 for both\n\n## Printf,\
    \ Value, and Dynamic Interface\n\nTo be as easy to understand as possible, Go\
    \ includes concepts that make it easier to log and debug code. Printing the dynamic\
    \ type of an interface value makes those operations easier. Fortunately, our old\
    \ friend *fmt.Printf* provides a short version using reflect.Typeof, which is\
    \ %T.\n\nAn interface value has a concrete value and a dynamic type. Just as %T\
    \ gives you the dynamic type of the interface, you can use %v to print the concrete\
    \ value using printf. The dynamic and concrete also help you determine equality.\
    \ Two interfaces are equal if the concrete values are equal and the dynamic type\
    \ is the same, or if both are nil. An interface value t of interface type T and\
    \ the value s of non-interface value type S are equal if t’s concrete value =\
    \ s *and* t’s dynamic type = S.\n\nWhen you’re using reflect.Value, you can hold\
    \ arbitrary values, just like an empty interface does. What’s the difference between\
    \ the two? Values have a variety of ways that you can peek under the hood and\
    \ determine its contents. By contrast, an empty interface hides all its methods\
    \ and representations. You need to know what type it contains so that you can\
    \ use type assertion to pop the hood if you want to make any modifications to\
    \ it.\n\n## Structs, Collections, and Higher-Order Functions\n\nReflection can\
    \ be very useful when it comes to structs. In addition to some other methods included\
    \ in the package, reflect also provides the following for use with structs only:\n\
    \n*   NumField(), which counts the number of fields available in a struct\n\n\
    *   Field(), which provides access to the fields themselves using an index variable\n\
    \nIn this example, you’ll see the difference between type and kind, and how they’re\
    \ used in programming:\n\n> package main\n\n> \n\n> import (\n\n> \n\n> “fmt”\n\
    \n> \n\n> “reflect”\n\n> \n\n> )\n\n> \n\n> type info struct {\n\n> \n\n> fname\
    \ string\n\n> \n\n> name string\n\n> \n\n> age int\n\n> \n\n> balance float64\n\
    \n> \n\n> }\n\n> \n\n> type meType string\n\n> \n\n> //function showInfo takes\
    \ empty interfaces as parameters\n\n> \n\n> func showInfo(i, j interface {}) {\n\
    \n> \n\n> t1 := reflect.Typeof(i)\n\n> \n\n> k1 := reflect.Kind()\n\n> \n\n> t2\
    \ := reflect.Typeof(j)\n\n> \n\n> k2 := reflect.Kind()\n\n> \n\n> fmt.Println(“Type\
    \ of 1st interface is”, t1)\n\n> \n\n> fmt.Println(“Kind of 1st interface is”,\
    \ k1)\n\n> \n\n> fmt.Println(“Type of 2nd interface is”, t2)\n\n> \n\n> fmt.Println(“Kind\
    \ of 2nd interface is”, k2)\n\n> \n\n> fmt.Println(“The values in the first argument\
    \ are:”)\n\n> \n\n> if reflect.Valueof(i).Kind == reflect.Struct {\n\n> \n\n>\
    \ value := reflect.Value(i)\n\n> \n\n> numberofFields := value.NumField()\n\n\
    > \n\n> for i :=0; i < NumberofFields; i++\n\n> \n\n> fmt.Printf(“%d.Type:%t ||\
    \ Value:%#v\\\\n”,\n\n> \n\n> (i + 1), value.Field(i), value.Field(i))\n\n> \n\
    \n> fmt.Println(“Kind is “, value.Field(i).Kind())\n\n> \n\n> }\n\n> \n\n> }\n\
    \n> \n\n> value := reflect.Valueof(j)\n\n> \n\n> fmt.Printf(“The value passed\
    \ in “ + “2nd parameter is %#v”, value)\n\n> \n\n> }\n\n> \n\n> func main () {\n\
    \n> \n\n> id := meType(“9876”)\n\n> \n\n> person := info{\n\n> \n\n> fname = “Cassie”\n\
    \n> \n\n> lname = “Coder”\n\n> \n\n> age = 27\n\n> \n\n> balance = 5987.65\n\n\
    > \n\n> }\n\n> \n\n> //passing two arguments to showInfo\n\n> \n\n> //person is\
    \ a struct, id is a string\n\n> \n\n> showInfo(person, id)\n\n> \n\n> }\n\nThe\
    \ output here shows you the difference between type and kind.\n\n> *Type of 1st\
    \ interface is main.info*\n\n> \n\n> *Kind of 1st interface is struct*\n\n> \n\
    \n> *Type of 2nd interface is main.meType*\n\n> \n\n> *Kind of 2nd interface is\
    \ string*\n\n> \n\n> *1\\. Type:reflect.Value || Value: “Cassie”*\n\n> \n\n> *Kind\
    \ is string*\n\n> \n\n> *2\\. Type:reflect.Value || Value: “Coder”*\n\n> \n\n\
    > *Kind is string*\n\n> \n\n> *3\\. Type:reflect.Value || Value: 27*\n\n> \n\n\
    > *Kind is int*\n\n> \n\n> *4\\. Type:reflect.Value || Value: 5987.65*\n\n> \n\
    \n> *Kind is float64*\n\nThe value passed in 2nd parameter is “9876”\n\nYou can\
    \ see that the struct person is type main.Info and kind struct, where the variable\
    \ id is type main.meType and kind string.\n\n## Best Practices for Interfaces\n\
    \nKeep the interfaces small. Only define the minimum behavior to accurately explain\
    \ the concept. In keeping with clean, small interfaces, you don’t need to specify\
    \ the types that will satisfy it; the interface only needs to define what other\
    \ types will classify as an element of it. For example, suppose you’re writing\
    \ an interface that will describe what’s necessary to define a car:\n\n> type\
    \ car interface {\n\n> \n\n> color() string\n\n> \n\n> speed() int\n\n> \n\n>\
    \ //the next field doesn’t work\n\n> "
  fmt: "\nReflection is the mechanism that examines the value and type pair stored\
    \ inside the interface variable. It’s particularly helpful when you’re doing things\
    \ like querying a database or creating one that has data of unknown types in it.\
    \ The `reflect` package helps you determine the type as well as the number of\
    \ fields.\n\nThe package `reflect` includes two types, which are simply `Type`\
    \ and `Value`. It has two functions, `reflect.Typeof` and `reflect.Valueof`, which\
    \ return `reflect.Type` and `reflect.Value` from the interface. Here’s a quick\
    \ example:\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"reflect\"\n\
    )\n\nfunc main() {\n    var y float = 3.14\n    fmt.Println(\"Type\", reflect.Typeof(y))\n\
    }\n```\n\nAs a result, you see\n> *Type float64*\n\nAt first glance, you might\
    \ think that the `float64` variable `y` is what’s being passed, not the interface.\
    \ However, `reflect.Typeof` contains an empty interface. When you call the function\
    \ `reflect.Typeof(y)`, an empty interface stores `y`. That’s passed as the argument,\
    \ then the function unpacks the empty interface to find the type information.\
    \ Similarly, `reflect.Valueof` retrieves the value information of the pair.\n\n\
    There are three pillars to the Reflect package: type, kind, and value. You’ve\
    \ seen type and value above. `Kind` refers to the representation of a type and\
    \ can be obtained using `type.Kind()`.\n\nIn Go, reflection goes from the interface\
    \ value to the object of reflection. This is known as the first law of reflection.\
    \ The second law is that reflection goes from the reflection object to the interface\
    \ value. In other words, reflection has its own inverse. If you’re given a `reflect.Value`,\
    \ the interface value can be recovered from it. The third law involves a characteristic\
    \ known as `settability`, which not all values have. It is the property that a\
    \ reflection object can change the storage used to create that object. In other\
    \ words, a reflection value is settable if it holds the original item. You’ll\
    \ get an error trying to call a `Set` method on a non-settable value.\n\nHere’s\
    \ a snippet of code that generates a panic, even though you might think it appears\
    \ valid:\n\n```go\nvar y float64 = 3.14\nv := reflect.Valueof(y)\nv.SetFloat(6.28)\n\
    ```\n\nIn the above code, a copy of `y` is passed to `reflect.Valueof`, not `y`\
    \ itself. Therefore, rather than changing variable `y` to `6.28`, you would be\
    \ changing the copy of `y` to `6.28`, which doesn’t make any sense. Settability\
    \ prevents you from doing so.\n\nYou can find out if a value is settable using\
    \ the `CanSet` method:\n\n```go\nvar y float64 = 3.14\nv := reflect.Valueof(y)\n\
    fmt.Println(\"settability of v:\", v.Canset())\n//which in this case would print\
    \ settability of v: false\n```\n\nIt’s very similar to using a “plain” function\
    \ `f(x)`. Here, since a copy of `x` is passed to the function, you wouldn’t expect\
    \ `f` to be able to change `x`. If you want to modify `x` directly, you’d need\
    \ to pass a pointer to `x`, which would look like `f (&x)`.\n\nSimilarly, if you\
    \ want to pass `y` through reflection, first you need a pointer to the `y` value\
    \ that you want to change. Here’s what that would look like in the previous example:\n\
    \n```go\nvar y float64 = 3.14\n//take y’s address\nz := reflectValueof(&y)\n//reflection\
    \ object z isn’t settable, so we need to get what z points to\n//call Elem method\
    \ on value to get there\n//then save in a reflection value\nv := z.Elem()\n//now\
    \ that finally represents y, so we can modify it\nv.SetFloat(6.28)\nfmt.Println(v.interface())\n\
    fmt.Println(y)\n// yields the result 6.28 for both\n```\n\n## Printf, Value, and\
    \ Dynamic Interface\n\nTo be as easy to understand as possible, Go includes concepts\
    \ that make it easier to log and debug code. Printing the dynamic type of an interface\
    \ value makes those operations easier. Fortunately, our old friend `fmt.Printf`\
    \ provides a short version using `reflect.Typeof`, which is `%T`.\n\nAn interface\
    \ value has a concrete value and a dynamic type. Just as `%T` gives you the dynamic\
    \ type of the interface, you can use `%v` to print the concrete value using `printf`.\
    \ The dynamic and concrete also help you determine equality. Two interfaces are\
    \ equal if the concrete values are equal and the dynamic type is the same, or\
    \ if both are `nil`. An interface value `t` of interface type `T` and the value\
    \ `s` of non-interface value type `S` are equal if `t`’s concrete value = `s`\
    \ and `t`’s dynamic type = `S`.\n\nWhen you’re using `reflect.Value`, you can\
    \ hold arbitrary values, just like an empty interface does. What’s the difference\
    \ between the two? Values have a variety of ways that you can peek under the hood\
    \ and determine its contents. By contrast, an empty interface hides all its methods\
    \ and representations. You need to know what type it contains so that you can\
    \ use type assertion to pop the hood if you want to make any modifications to\
    \ it.\n\n## Structs, Collections, and Higher-Order Functions\n\nReflection can\
    \ be very useful when it comes to structs. In addition to some other methods included\
    \ in the package, `reflect` also provides the following for use with structs only:\n\
    \n*   `NumField()`, which counts the number of fields available in a struct\n\
    *   `Field()`, which provides access to the fields themselves using an index variable\
    \ \n\nIn this example, you’ll see the difference between type and kind, and how\
    \ they’re used in programming:\n\n```go\npackage main\n\nimport (\n    \"fmt\"\
    \n    \"reflect\"\n)\n\ntype info struct {\n    fname string\n    name string\n\
    \    age int\n    balance float64\n}\n\ntype meType string\n\n//function showInfo\
    \ takes empty interfaces as parameters\nfunc showInfo(i, j interface {}) {\n \
    \   t1 := reflect.Typeof(i)\n    k1 := reflect.Kind()\n    t2 := reflect.Typeof(j)\n\
    \    k2 := reflect.Kind()\n    fmt.Println(\"Type of 1st interface\", t1)\n  \
    \  fmt.Println(\"Kind of 1st interface\", k1)\n    fmt.Println(\"Type of 2nd interface\"\
    , t2)\n    fmt.Println(\"Kind of 2nd interface\", k2)\n    fmt.Println(\"The values\
    \ in the first argument:\")\n    if reflect.Valueof(i).Kind() == reflect.Struct\
    \ {\n        value := reflect.Valueof(i)\n        numberofFields := value.NumField()\n\
    \        for i :=0; i < numberofFields; i++ {\n            fmt.Printf(\"%d.Type:%t\
    \ || Value:%v\\n\", i+1, value.Field(i).Type(), value.Field(i))\n            fmt.Println(\"\
    Kind is\", value.Field(i).Kind())\n        }\n    }\n    value := reflect.Valueof(j)\n\
    \    fmt.Printf(\"The value passed in:#v\", value)\n}\n\nfunc main () {\n    id\
    \ := meType(\"9876\")\n    person := info{\n        fname = \"Cassie\"\n     \
    \   name = \"Coder\",\n        age = 27\n        balance = 5987.65\n    }\n  \
    \  //passing two arguments to showInfo\n    //person is a struct, id is a string\n\
    \    showInfo(person, id)\n}\n```\n\nThe output here shows you the difference\
    \ between type and kind.\n> *Type of 1st interface main.info*\n> *Kind of 1st\
    \ interface struct*\n> *Type of 2nd interface main.meType*\n> *Kind of 2nd interface\
    \ string*\n> *The values in the first argument:*\n> *1.Type:string || Value:\"\
    Cassie\"*\n> *Kind is string*\n> *2.Type:string || Value:\"Coder\"*\n> *Kind is\
    \ string*\n> *3.Type:int || Value:27*\n> *Kind is int*\n> *4.Type:float64 || Value:5987.65*\n\
    > *Kind is float64*\nThe value passed in \"9876\"\n\nYou can see that the struct\
    \ `person` is type `main.info` and kind `struct`, where the variable `id` is type\
    \ `main.meType` and kind `string`.\n\n## Best Practices for Interfaces\n\nKeep\
    \ the interfaces small. Only define the minimum behavior to accurately explain\
    \ the concept. In keeping with clean, small interfaces, you don’t need to specify\
    \ the types that will satisfy it; the interface only needs to define what other\
    \ types will classify as an element of it. For example, suppose you’re writing\
    \ an interface that will describe what’s necessary to define a car:\n\n```go\n\
    type car interface {\n    color() string\n    speed() int\n    //the next field\
    \ doesn’t work\n}\n```\n"
  trans: "\n反射（Reflection）是检查接口变量内部存储的类型和值值对的机制。当你执行查询数据库或创建一个包含未知类型数据的结构时，它特别有用。`reflect`\
    \ 包可以帮助你确定类型以及字段的数量。\n\n`reflect` 包包含两个类型，简单来说就是 `Type` 和 `Value`。它有两个函数 `reflect.Typeof`\
    \ 和 `reflect.Valueof`，它们从接口返回 `reflect.Type` 和 `reflect.Value`。这里有一个简单的示例：\n\n\
    ```go\npackage main\n\nimport (\n    \"fmt\"\n    \"reflect\"\n)\n\nfunc main()\
    \ {\n    var y float = 3.14\n    fmt.Println(\"Type\", reflect.Typeof(y))\n}\n\
    ```\n\n结果，你看到\n> *Type float64*\n\n从表面上看，你可能认为传递的是 `float64` 变量 `y`，而不是接口。然而，`reflect.Typeof`\
    \ 包含的是一个空接口。当你调用函数 `reflect.Typeof(y)` 时，一个空接口存储了 `y`。它被作为参数传递，然后函数解开空接口以找到类型信息。同样，`reflect.Valueof`\
    \ 获取该值对的值信息。\n\n`reflect` 包有三个支柱：类型（type）、种类（kind）和值（value）。你在上面已经看到了类型和值。`Kind`\
    \ 指类型的表示，可以通过 `type.Kind()` 获取。\n\n在 Go 中，反射是从接口值到反射对象。这被称为反射的第一条定律。第二条定律是反射是从反射对象到接口值。换句话说，反射有自己的逆向操作。如果给你一个\
    \ `reflect.Value`，可以从它恢复接口值。第三条定律涉及一种被称为“可设置性”（settability）的特性，并不是所有值都具有这种特性。它是指反射对象可以修改创建该对象所使用的存储空间。换句话说，如果一个反射值持有原始项，那么它就是可设置的。如果你尝试在一个不可设置的值上调用\
    \ `Set` 方法，将会得到错误。\n\n这里有一个产生 panic（崩溃）的代码片段，尽管你可能认为它是有效的：\n\n```go\nvar y float64\
    \ = 3.14\nv := reflect.Valueof(y)\nv.SetFloat(6.28)\n```\n\n在上面的代码中，`y` 的拷贝被传递给了\
    \ `reflect.Valueof`，而不是 `y` 本身。因此，你并没有改变变量 `y` 为 `6.28`，而是改变了 `y` 的拷贝为 `6.28`，这是没有意义的。可设置性防止了你这样做。\n\
    \n你可以使用 `CanSet` 方法判断一个值是否可设置：\n\n```go\nvar y float64 = 3.14\nv := reflect.Valueof(y)\n\
    fmt.Println(\"settability of v:\", v.Canset())\n//在这种情况下会打印 settability of v:\
    \ false\n```\n\n这与使用“普通”函数 `f(x)` 非常相似。在这里，由于传递给函数的是 `x` 的拷贝，所以你不会期望 `f` 能够改变\
    \ `x`。如果你想直接修改 `x`，你需要传递 `x` 的指针，看起来看起来像 `f (&x)`。\n\n同样，如果你想通过反射传递 `y`，首先你需要指向想要修改的\
    \ `y` 值的指针。以下是上一个示例中的对应写法：\n\n```go\nvar y float64 = 3.14\n//获取 y 的地址\nz := reflectValueof(&y)\n\
    //反射对象 z 是不可设置的，所以我们需要获取 z 指向的内容\n//在值上调用 Elem 方法到达那里\n//保存到反射值中\nv := z.Elem()\n\
    //现在它终于代表 y，所以我们可以修改它\nv.SetFloat(6.28)\nfmt.Println(v.interface())\nfmt.Println(y)\n\
    //两者的结果都是 6.28\n```\n\n## Printf, Value 和动态接口\n\n为了尽可能易于理解，Go 包含了一些让日志记录和调试代码更方便的概念。打印接口值的动态类型会让这些操作变得更容易。幸运的是，我们的老朋友\
    \ `fmt.Printf` 提供了一个使用 `reflect.Typeof` 的简短版本，即 `%T`。\n\n接口值有一个具体值和一个动态类型。就像 `%T`\
    \ 给你接口的动态类型一样，你可以使用 `%v` 通过 `printf` 打印具体值。动态和具体也帮助你判断相等性。如果两个接口的具体值相等且动态类型相同，或者两者都为\
    \ `nil`，则这两个接口是相等的。如果类型为 `T` 的接口值 `t` 和非接口值类型 `S` 的值 `s` 满足 `t` 的具体值 = `s` 且 `t`\
    \ 的动态类型 = `S`，则它们是相等。\n\n当你使用 `reflect.Value` 时，你可以持有任意值，就像空接口一样。两者之间的区别是什么？值有多种方法可以查看其内部并确定其内容。相比之下，空接口隐藏了它所有的方法和表示。你需要知道它包含什么类型，以便在想对它进行任何修改时使用类型断言来“打开盖子”。\n\
    \n## 结构体、集合和高阶函数\n\n反射在处理结构体时非常有用。除了包中包含的其他方法外，`reflect` 还提供了以下仅供结构体使用的：\n\n*\
    \   `NumField()`：计算结构体中可用字段的数量。\n*   `Field()`：使用索引变量访问字段本身。\n\n在这个示例中，你将看到类型和种类之间的区别，以及它们在编程中是如何使用的：\n\
    \n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"reflect\"\n)\n\ntype info\
    \ struct {\n    fname string\n    name string\n    age int\n    balance float64\n\
    }\n\ntype meType string\n\n//function showInfo 取空接口作为参数\nfunc showInfo(i, j interface\
    \ {}) {\n    t1 := reflect.Typeof(i)\n    k1 := reflect.Kind()\n    t2 := reflect.Typeof(j)\n\
    \    k2 := reflect.Kind()\n    fmt.Println(\"Type of 1st interface\", t1)\n  \
    \  fmt.Println(\"Kind of 1st interface\", k1)\n    fmt.Println(\"Type of 2nd interface\"\
    , t2)\n    fmt.Println(\"Kind of 2nd interface\", k2)\n    fmt.Println(\"The values\
    \ in the first argument:\")\n    if reflect.Valueof(i).Kind() == reflect.Struct\
    \ {\n        value := reflect.Valueof(i)\n        numberofFields := value.NumField()\n\
    \        for i :=0; i < numberofFields; i++ {\n            fmt.Printf(\"%d.Type:%t\
    \ || Value:%v\\n\", i+1, value.Field(i).Type(), value.Field(i))\n            fmt.Println(\"\
    Kind is\", value.Field(i).Kind())\n        }\n    }\n    value := reflect.Valueof(j)\n\
    \    fmt.Printf(\"The value passed in:#v\", value)\n}\n\nfunc main () {\n    id\
    \ := meType(\"9876\")\n    person := info{\n        fname = \"Cassie\"\n     \
    \   name = \"Coder\",\n        age = 27\n        balance = 5987.65\n    }\n  \
    \  //passing two arguments to showInfo\n    //person is a struct, id is a string\n\
    \    showInfo(person, id)\n}\n```\n\n这里的输出显示了类型和种类的区别。\n> *Type of 1st interface\
    \ main.info*\n> *Kind of 1st interface struct*\n> *Type of 2nd interface main.meType*\n\
    > *Kind of 2nd interface string*\n> *The values in the first argument:*\n> *1.Type:string\
    \ || Value:\"Cassie\"*\n> *Kind is string*\n> *2.Type:string || Value:\"Coder\"\
    *\n> *Kind is string*\n> *3.Type:int || Value:27*\n> *Kind is int*\n> *4.Type:float64\
    \ || Value:5987.65*\n> *Kind is float64*\nThe value passed in \"9876\"\n\n你可以看到结构体\
    \ `person` 是 `main.info` 类型和 `struct` 种类，而变量 `id` 是 `main.meType` 类型和 `string`\
    \ 种类。\n\n## 接口的最佳实践\n\n保持接口小。只定义解释该概念所需的最小行为。为了符合简洁、小的接口，你不需要指定将满足它的类型；接口只需要定义其他类型将分类为它的元素即可。例如，假设你正在编写一个描述定义汽车要素所需的接口：\n\
    \n```go\ntype car interface {\n    color() string\n    speed() int\n    //the\
    \ next field doesn’t work\n}\n```\n"
