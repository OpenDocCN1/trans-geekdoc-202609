    }\n```\n\nYour output then looks like this:\n*Sarah says Hello!*\n\n## Receivers\
    \ and Methods as Pointers and Values\n\nDefining methods on types, as opposed\
    \ to functions on values, has other benefits. In the interfaces chapter, you’ll\
