  trans: "\n可寻址的 `Once` 值 `o` 包含方法调用 `o.Do()`，该方法可以在多个 goroutine 中并发执行。调用中的参数最好使用相同的函数值，尽管这并不是代码的强制要求。\n\
    \n`o.Do()` 方法产生一个只有一个参数的函数结果，它总会在任何 `o.Do()` 方法返回之前退出。\n\n### Cond（条件变量）\n使用 `sync.Cond`\
    \ 在 goroutine 之间进行通知。当你有一个 goroutine 等待状态的改变，而其他 goroutine 做出该改变并发送通知时，通常会使用它。\n\
    \n### Mutex/RWMutex\n这两者都使用 `Lock` 和 `Unlock` 来防止多个用户同时访问同一块数据。锁并不绑定到 goroutine，因此锁可以在一个\
    \ goroutine 中锁定，并在不同的时间在另一个 goroutine 中解锁。\n\n当你想要将一个写程序拆分为若干部分时，`RWMutex` 就非常有用。`Mutex`\
    \ 和 `RWMutex` 也可以用于通知 goroutine，尽管它们不是处理此任务的最优工具（优先使用 `sync.Cond`）。\n\n对于可寻址的\
    \ `RWMutex` 值 `rwm`，请记住写锁一次只能由一个写入者持有，且读锁和写锁不能同时持有。然而，读锁可以同时被多个读取者持有。当其锁计数返回零时，它会解锁。\n\
    \n## Channels（通道）\n可视化通道的一种方法是将它们想象成连接并发 goroutine 的管道。它允许你将值发送到一个 goroutine 的通道，并在另一个\
    \ goroutine 中接收它们。每个通道只能发送一种类型的数据。nil 通道（nil channel）是没用的，因为你无法从从中读取，也无法从中发送数据，所以你需要使用函数\
    \ `make` 来创建一个通道。\n\n默认情况下，通道是一个指针。通常，你将通道作为参数传递给函数或方法。当通道接收到参数时，不需要对其进行解引用即可使用数据。\n\
    \n在创建通道 `c` 时，语法非常简单。箭头从数据指向通道 `c`，所以你正在将数据推入通道：\n\n```\nc <- data\n```\n\n当你想从通道\
    \ `c` 读取数据时，只需如所示反转 `c` 的位置：\n\n```\n<- c\n```\n\n如果你想使用变量数据来持有从通道传出的内容，可以使用以下语法：\n\
    \n```\nvar data int\ndata = <- c\n```\n\n或者你可以使用它的等效写法：\n\n```\ndata := <- c\n\
    ```\n\n无论何种方式，通道操作本质上都是阻塞的。当数据被写入通道 `c` 时，goroutine 会阻塞，直到另一个 goroutine 读取它。然而，通道不会永远阻塞，因为通道操作会告诉调度器调度另一个\
    \ goroutine。\n\n这里有一个通道的快速示例：\n\n```go\npackage main\n\nimport \"fmt\"\n\n// 一个接受通道\
    \ c 字符串数据的 salute 函数\nfunc salute(c chan string) {\n    fmt.Println(\"Hello\"\
    \ + <-c + \"!\")\n}\n\nfunc main() {\n    // main 函数第一个 goroutine\n    fmt.Println(\"\
    Main() started\")\n    // 使用 make 创建字符串类型的通道 c\n    c := make(chan string)\n \
    \   // 使用 go 关键字创建 goroutine，并将通道 c 传递给 salute 函数\n    go salute(c)\n    // 将字符串值\
    \ \"Jane\" 推送到通道\n    c <- \"Jane\"\n    // goroutine 被阻塞，直到另一个 goroutine 读取它\n\
    \    // 激活 main goroutine\n    fmt.Println(\"Main() stopped\")\n}\n```\n\n你将得到如下结果：\n\
    Main() started\nHello Jane!\nMain() stopped\n\n当对通道进行读或写时，该 goroutine 会被阻塞，控制权将传递给其他\
    \ goroutine。但是，如果存在其他 goroutine，则不会阻塞。如果，当没有 goroutine，，，，，。。。。，，，，，，，，，，。。。。。。。。，，，，，，，，，，。。。。。\n\
    \n你想关闭通道，， gor goroutineoutineoutine 数据，，使用内置的 `close` 函数。\n\n当你通道关闭通道通道，，，， \
    \      。。语法非常简单：\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc squares(c chan\
    \ int) {\n    for i := 0; i < 10; i++ {\n        c <- i\n    }\n    close(c)\n\
    }\n\nfunc main() {\n    c := make(chan int)\n    go squares(c)\n    \n    for\
    \ val := range c {\n        fmt.Println(val)\n    }\n    fmt.Println(\"Main()\
    \ stopped\")\n}\n```\n\n当通道被读或写时，该 goroutine 会被阻塞，控制权将传递给其他 goroutine。如果，但是，存在其他\
