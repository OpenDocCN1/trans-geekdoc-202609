- raw: "You might recall that a slice is composed of multiple elements. Unlike arrays,\
    \ they’re declared without the length in brackets. The zero value of a slice is\
    \ *nil* . Both length and capacity are zero and it doesn’t have a reference array.\n\
    \n## Declaration\n\nYou can *declare* the type for a variable that will hold a\
    \ slice with a set of square brackets *\\[\\]* , then follow it with the element\
    \ type that your slice will hold. Here are two examples of declaring a variable\
    \ type, one with numbers and one with string:\n\n> var intSlice \\[\\]int\n\n\
    > \n\n> var strSlice \\[\\]string\n\nYou can also declare a slice using the built-in\
    \ function make instead, which contains length. Capacity is optional. If you only\
    \ specify the length, the capacity is assumed to be the same. If the capacity\
    \ is different from the length, you need to declare the capacity value.\n\nMake\
    \ allocates an array and then returns a slice referring to that array.\n\n> var\
    \ intSlice make(int\\[\\], 10) // here length and capacity are the same, 10\n\n\
    > \n\n> var strSlice make (\\[\\]string, 10, 20) // length 10 and capacity 20\n\
    \nOr, you can declare a slice with a new keyword. Follow the keyword with the\
    \ capacity, then the type of elements in the slice:\n\n> var intSlice = new(\\\
    [50\\]int)\\[0:10\\]) // keyword is new, with capacity 50 and length 10\n\nSlices\
    \ can be formed by slicing through an array, but also from another slice. It’s\
    \ specified by a half-open range, which includes the first value but not the end\
    \ value, of two indices that are separated by a colon. You can think of it as\
    \ \\[low: high\\]. The default low is the 0th value, and high is the length of\
    \ the slice.\n\nAs an example, the expression b\\[1:4\\] will create a slice of\
    \ b containing elements 1–3.\n\nSuppose you have a slice b := \\[\\]byte{‘q’,\
    \ ‘j’, ‘x’, ‘z’, ‘q’}:\n\n> b\\[1:4\\] == \\[\\]byte{‘j’, ‘x’, ‘z’} // remembering\
    \ that the first element is 0, not 1 and that the first element in the range is\
    \ included but not the last one\n\nLet’s look at another example with array a\
    \ and a variety of slices:\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\n\
    > func main () {\n\n> \n\n> a :=\\[5\\]{“Britain”, “Canada”, “Australia”, “India”,\
    \ “New Zealand”\\] //array a has 5 elements\n\n> \n\n> //now let’s start slicing\n\
    \n> \n\n> slice 1 := a\\[1:4\\]\n\n> \n\n> slice 2 := a\\[ :3\\] //remember default\
    \ low is 0th\n\n> \n\n> slice 3 := a\\[2: \\] //default high is last\n\n> \n\n\
    > slice 4 := a\\[:\\]\n\n> \n\n> fmt.Println(“Array a = “, “a”)\n\n> \n\n> fmt.Println(“slice\
    \ 1 = “, slice1)\n\n> \n\n> fmt.Println(“slice 2 = “, slice2)\n\n> \n\n> fmt.Println(“slice\
    \ 3 = “, slice3)\n\n> \n\n> fmt.Println(“slice 4 = “, slice4)\n\n> \n\n> }\n\n\
    You’ll get the following output:\n\n> *Array a = \\[Britain Canada Australia India\
    \ New Zealand\\]*\n\n> \n\n> *slice1 = \\[Canada Australia India\\]*\n\n> \n\n\
    > *slice2 = \\[Britain Canada Australia\\]*\n\n> \n\n> *slice3 = \\[Australia\
    \ India New Zealand\\]*\n\n> \n\n> *slice4 = \\[Britain Canada Australia India\
    \ New Zealand\\]*\n\nNote that slices can’t be grown past their capacity and they\
    \ can’t be resliced below zero. You’ll end up with a runtime panic instead.\n\n\
    ## Initialization\n\nListing the initial values of the slice is known as *initialization*\
    \ . Use a slice literal with the empty brackets (as above) followed by the type,\
    \ and then list the initial values in curly brackets *{}* .\n\n> var intSlice\
    \ = \\[\\]int{10, 20, 30, 40}\n\n> \n\n> var strSlice = \\[\\]string{“Britain”,\
    \ “Canada”, “Australia”}\n\n## Modifying Slices\n\nSince a slice is a segment\
    \ of an array, any changes you make to the slice will also change the array it’s\
    \ based on. Any other slices that reference the same array will also be changed.\n\
    \nHere’s an example based on days of the week that illustrates how modification\
    \ works.\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> func main () {\n\
    \n> \n\n> a :=\\[7\\]string{“Mon”, “Tues”, “Weds”, “Thurs”, “Fri”, “Sat”, “Sun”}\n\
    \n> \n\n> slice1 := a\\[1:\\]\n\n> \n\n> slice 2 := a\\[3:\\]\n\n> \n\n> fmt.Println(“-----Before\
    \ Modification-----”)\n\n> \n\n> fmt.Println(“a = “, a)\n\n> \n\n> fmt.Println(“slice1\
    \ =”, slice1)\n\n> \n\n> fmt.Println(“slice2 =”, slice2)\n\n> \n\n> slice1\\[0\\\
    ] = “TUES”\n\n> \n\n> slice1\\[1\\] = “WEDS”\n\n> \n\n> slice1\\[2\\] = “THURS”\n\
    \n> \n\n> slice2\\[1\\] = “FRI”\n\n> \n\n> fmt.Println(“-----After Modification-----”)\n\
    \n> \n\n> fmt.Println(“a = “, a)\n\n> \n\n> fmt.Println(“slice1 =”, slice1)\n\n\
    > \n\n> fmt.Println(“slice2 =”, slice2)\n\n> \n\n> }\n\nThe output is as follows:\n\
    \n> *“-----Before Modification-----”*\n\n> \n\n> *a = \\[Mon Tues Weds Thurs Fri\
    \ Sat Sun\\]*\n\n> \n\n> *slice1 = \\[Tues Weds Thurs Fri Sat Sun\\]*\n\n> \n\n\
    > *slice2 = \\[Thurs Fri Sat Sun\\]*\n\n> \n\n> *\\-----After Modification-----*\n\
    \n> \n\n> *a = \\[Mon TUES WEDS THURS FRI Sat Sun\\]*\n\n> \n\n> *slice1 = \\\
    [TUES WEDS THURS FRI Sat Sun\\]*\n\n> \n\n> *slice2 = \\[THURS FRI Sat Sun\\]*\n\
    \n## For and For Range with Slices\n\nJust as you can iterate over some of the\
    \ other expressions we’ve discussed in Golang, you can also iterate over slices\
    \ and arrays.\n\n*For*\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> func\
    \ main () {\n\n> \n\n> days :=\\[\\]string{“Thurs”, “Fri”, “Sat”, “Sun”}\n\n>\
    \ \n\n> for i := 0; i < len (days); i++ {\n\n> \n\n> fmt.Println(days\\[i\\])\n\
    \n> \n\n> }\n\n> \n\n> }\n\n> \n\n> The output would look like this:\n\n> \n\n\
    > Thurs\n\n> \n\n> Fri\n\n> \n\n> Sat\n\n> \n\n> Sun\n\n*For range*\n\n> package\
    \ main\n\n> \n\n> import “fmt”\n\n> \n\n> func main () {\n\n> \n\n> primenumbers\
    \ :=\\[\\]int{2, 3, 5, 7, 11}\n\n> \n\n> for index, number := range primenumbers\
    \ {\n\n> \n\n> fmt.Printf(“Primenumber (%d) = %d\\\\n”, index +1, number)\n\n\
    > \n\n> }\n\n> \n\n> }\n\nYou’ll get results that look like this:\n\n> *Primenumber(1)\
    \ = 2*\n\n> \n\n> *Primenumber(2) = 3*\n\n> \n\n> *Primenumber(3) = 5*\n\n> \n\
    \n> *Primenumber(4) = 7*\n\n> \n\n> *Primenumber(5) = 9*\n\n## Multidimensional\n\
    \nFirst, let’s take a look at multidimensional arrays. So far, we’ve used arrays\
    \ with just one row. Consider a two-dimensional array, which has more than one\
    \ row and more than one column. You could visualize this as a table with x rows\
    \ and y columns. Although there’s technically no limit for the number of dimensions\
    \ you could have, the most useful multidimensional arrays are two dimensions.\
    \ The syntax for arrays is:\n\n> var arrayName \\[ x \\] \\[ y \\]data\\_type\n\
    \nFor example, a \\[2\\] \\[3\\]int has two rows and three columns of numbers.\
    \ Every element in a two-dimensional array a can be defined by its position: a\\\
    [i\\]\\[j\\] where i is the row and j the column. Similarly, you can have two\
    \ (or more) dimensions in your slices. These are suitable for applications for\
    \ things like gaming, image processing, and matrix calculations.\n\n## Reslicing,\
    \ Copying, and Appending\n\nWhen you *reslice* , you change the length of a given\
    \ slice. If you want to copy a slice using the builtin function *copy* , you can\
    \ take elements from the source slice and copy them to the destination. The copy\
    \ will always have the minimum length of the two slices, and it returns the integer\
    \ value of the number of elements copied. The syntax looks like this:\n\nfunc\
    \ copy (dst, src, \\[\\]type) where dst is the destination slice and source the\
    \ original. Here’s an example of copying.\n\n> package main\n\n> \n\n> import\
    \ “fmt”\n\n> \n\n> func main() {\n\n> \n\n> src := \\[\\]string{“Red”, “Orange”,\
    \ “Yellow”, “Green”}\n\n> \n\n> dest :=make(\\[\\]string, 2)\n\n> \n\n> numCopied\
    \ := copy(dest, src)\n\n> \n\n> fmt.Println(“src = “, src)\n\n> \n\n> fmt.Println(“dest\
    \ = “, dest)\n\n> \n\n> fmt.Println(“# elements copied from source to dest = “,\
    \ numCopied)\n\n> \n\n> }\n\n> \n\n> }\n\nThe output looks appears like so:\n\n\
    > *src = \\[Red Orange Yellow Green\\]*\n\n> \n\n> *dest = \\[Red Orange\\]*\n\
    \n> \n\n> *\\# elements copied from source to dest = 2*\n\nThe built-in function\
    \ *append* adds elements to the end of a slice. If the given slice doesn’t have\
    \ the capacity for additional elements, then a new array with a higher cap is\
    \ allocated. If it’s big enough for the appends, the existing array is used. In\
    \ the case where the slice has enough capacity to accommodate the appendage, any\
    \ changes to it will also appear in the appending slice, since they’re both referring\
    \ to the same array.\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> func\
    \ main() {\n\n> \n\n> slice1 := make(\\[\\]string, 3, 10)\n\n> \n\n> copy(slice1,\
    \ \\[\\]string{“Red”, “Orange”, “Yellow”})"
