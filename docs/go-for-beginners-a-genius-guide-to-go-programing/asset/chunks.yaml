    If you’re an experienced developer, you’ve seen where Golang is similar to and
    different from other languages you’ve programmed in. If you’re not, you have a
    solid introduction to programming and understand many of the shared features of
    other computer languages.


    We’ve covered the essentials for Golang, including slices and arrays. While in
    other languages arrays are a primary component, here slices (based on underlying
    arrays) are used more often and provide the flexibility that you need.


    ### Concurrency and Performance


    One of the main features of Go is concurrency, or the ability to run multiple
    `goroutines`. There are many techniques for doing so without running into data
    competition, where multiple aspects of code try to access a shared resource at
    the same time. These range from timing functions to `channels`, which act as communication
    pipelines between multiple `goroutines`. Concurrency helps to increase the speed
    of code.


    ### Error Handling and Built-in Tools


    Go helps programmers find and debug errors more easily. Other languages might
    try to catch errors at run-time, but Go treats them as values that can be programmed.
    The language also includes the nifty little function `defer`, which can execute
    deferred routines even if the main routine panics.


    Another performance bonus for Golang that you don’t find in many programming languages
    is the `testing` package, which contains the functions and methods you need to
    test the code and assess its performance. Benchmarking is built into this, which
    makes it faster and easier to compare snippets of code and determine which provides
    better performance.


    ### Design Philosophy and Community


    As you’ve seen, Go is designed to be learned quickly, speed up code development,
    and execute quickly. It’s also modular so you can import packages that have the
    functions you want if they aren’t in the main package.


    It’s intended to be easy to read so that you can quickly understand what someone
    else’s code does. Writing code is faster when you don’t have to continually reinvent
    the wheel; you can reuse your own or import someone else’s. Saving your packages
    makes it much faster for you to grab a snippet that you’ve used before instead
    of trying to hunt through directories to find it.


    If you haven’t already, now is the time to head to the Go playground and try some
    coding on your own! Although it’s a relatively young language, you’ll be able
    to find plenty of other users and communities that can help you with any issues
    you have.


    If you liked this book and found it helpful, please write a review! We want to
    spread the word about Go and how it can help programmers in a variety of industries
    and from a variety of coding backgrounds.


    ### About the Author


    My journey into software development started when I was a kid, which gave me ample
    opportunity to learn about the basics of computer programming and software development
    in my early years. I never stopped studying computer programming, spending my
    youth picking apart games to learn how their programs worked. After high school,
    I went to the University of Missouri where I joined the I.S. Programming Club
    and studied Information Systems and Computer Science. In 2016, I graduated and
    started my company as an independent software developer; I’ve used Google programming
    languages to develop many apps for clients and for myself, including `Loop`, a
    social media app designed to help communities better police themselves. I’ve trained
    and consulted with Fortune 500 companies all over the world. To keep up with me,
    find me on Twitter at `@Streetgenius_`.


    ### Recommended Reading


    If you liked this book and found it helpful, consider expanding your coding toolkit
    by reading my other books:


    - Flutter for Beginners: A Genius Guide to Flutter App Development

    - Python for Beginners: A Genius Guide to Python Programming


