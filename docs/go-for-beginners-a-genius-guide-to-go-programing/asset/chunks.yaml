    [\\]byte(v), b)\n\n> \n\n> fmt.Println(b)\n\n> \n\n> }\n\n## Chapter Summary\n\
    \nIn this chapter, we discussed the functionality of reading from files—even those\
    \ not in Go!—and writing to Go files. When reading and writing, the bufio package\
    \ comes in handy with buffering that speeds up the execution of the code.\n\n\
    *   Reading user input primarily uses the scanf function, which scans elements\
    \ separated by spaces.\n\n*   You can also read and write to files, and the os\
    \ and log packages assist with this by providing ways to log any errors that occur.\n\
    \n*   The os package also contains Arg methods that you use to read right from\
    \ the command line.\n\n*   You can also read with slices, which makes it easier\
    \ to deal with information from JSON and XML languages.\n\nIn the next chapter,\
    \ you'll learn about goroutines and channels.\n\nTwelve \n\nThroughout the book,\
    \ you’ve discovered many ways that Golang allows you to execute programs faster.\
    \ Another way to juice up your programs is to allow for independent execution\
    \ of your processes.\n\nThe first question that might have come to mind is how\
    \ you can prevent concurrent routines from becoming entangled with each other.\
    \ We introduced the subject earlier, but now that you’re more familiar with Golang,\
    \ we can take a deeper dive into concurrency.\n\n## About Concurrency and Parallelism\n\
    \nIf you have experience coding in other languages, you might be familiar with\
    \ the concept of parallelism. Sometimes, concurrency is mistaken for parallelism,\
    \ but the two are not the same. *Parallelism* refers to executing processes that\
    \ may or may not be related to one another. You can think of it as doing lots\
    \ of things at once. *Concurrency* , on the other hand, is the composition of\
    \ processes that run independently of each other or dealing with multiple items\
    \ at once.\n\nConsider what happens when you’re out running. You realize your\
    \ shoelace is untied, so what do you do? You stop running, tie your shoelace,\
    \ then start running again. That’s concurrency. Parallelism is jogging along while\
    \ listening to the music in your earbuds because you’re doing two things at the\
    \ same time.\n\nWhen it comes to programming, concurrency occurs when two (or\
    \ more) tasks are in progress at the same time. Parallelism is a run-time property\
    \ where two or more tasks are executed simultaneously. It’s not the ultimate goal\
    \ of concurrency, though the latter can use parallelism to get the job done.\n\
    \n## Goroutines\n\nThese are the tools Go uses for concurrency. They’re methods\
    \ or functions that can run concurrently with other methods and functions. Simply\
    \ using the prefix go- before the method or function will enable it to run concurrently.\n\
    \nGoroutines are similar to Java threads, but they’re lightweight and not as costly\
    \ to use. They also start up faster than threads and have built-in primitives\
    \ (called channels) to communicate with each other. Their size can grow or shrink\
    \ according to the needs of the code, unlike Java threads which require a specified\
    \ size.\n\nHere’s an example of multiple concurrent routines:\n\n> package main\n\
    \n> \n\n> import (\n\n> \n\n> “fmt”\n\n> \n\n> “time”\n\n> \n\n> )\n\n> \n\n>\
    \ //goroutine 1\n\n> \n\n> func printnumbers () {\n\n> \n\n> for i := 1; i < =\
    \ 5; i++ {\n\n> \n\n> //using Sleep to synchronize all 3 goroutines to show more\
    \ clearly, though normally you would use channels\n\n> \n\n> //this routine runs\
    \ every 250 milliseconds\n\n> \n\n> time.Sleep(250\\* time.Millisecond)\n\n> \n\
    \n> fmt.Printf(“%d ”, i)\n\n> \n\n> }\n\n> \n\n> }\n\n> \n\n> //goroutine 2\n\n\
    > \n\n> func printletters() {\n\n> \n\n> for i := ‘a’; i <= ‘e’; i++\n\n> \n\n\
    > //this routine runs every 400 milliseconds\n\n> \n\n> time.Sleep(400\\* time.Millisecond)\n\
    \n> \n\n> fmt.Printf(“%s ”, i)\n\n> \n\n> }\n\n> \n\n> }\n\n> \n\n> //goroutine\
    \ 3\n\n> \n\n> func main() {\n\n> \n\n> go printnumbers()\n\n> \n\n> go printletters()\n\
    \n> \n\n> time.Sleep(5000\\* time.Millisecond)\n\n> \n\n> fmt.Println(“Print from\
    \ main”)\n\n> \n\n> }\n\nAs a result, the output looks like this:\n\n> *1 a 2\
    \ 3 b 4 c 5 d e Print from main*\n\n## Synchronizing and Switching between Goroutines\n\
    \nGo provides more than one way to synchronize concurrent routines to avoid errors\
    \ and ensure the computations are done correctly. Now that you’re familiar with\
    \ the methods we discussed in chapter eight, let’s go into a little more detail.\n\
    \n*   Waitgroup\n\nThis is most often used when you have one goroutine that will\
    \ wait until the others are all finished to run. You might recall that the Waitgroup\
    \ value maintains its internal counter, and the default for that counter is zero.\
    \ Waitgroup has 3 methods: Add(delta int), Done(), and Wait().\n\nSome of these\
    \ Waitgroup values can be addressable. An *addressable* value is a pointer indirection,\
    \ a variable, a slice index operation (though the slice itself need not be addressable),\
    \ a field that addresses a struct, an indexed operation for an array (which must\
    \ be addressable), or a composite literal type.\n\nFor any of these addressable\
    \ Waitgroup values wg, call wg.Add(delta int) to change the counter value that\
    \ wg maintains, and note that calling wg. Done() is the same as wg.Add(-1). If\
    \ a call of wg.Add(delta int) or wg.Done results in a negative counter value for\
    \ wg, it results in a panic. When you call wg.Wait() and the counter is already\
    \ zero, it’s the same as a no-op. Otherwise, when the counter is positive, calling\
    \ wg.Wait() means the goroutine enters its blocking state, and runs again when\
    \ another goroutine modifies the counter to zero, normally by calling wg.Done().\
    \ Make sure that you call Add method with a positive delta when the counter is\
    \ zero before calling Wait, otherwise you end up with a data race.\n\n*   Once\n\
    \nUse this function to make sure that the piece of code runs only once during\
    \ the program. As a reminder, the \\*sync.Once value has a Do(f func()) which\
    \ takes one parameter with the func() type."
