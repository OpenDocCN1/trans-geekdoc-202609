- raw: "*Panic* is a built-in function that stops the program’s ordinary control of\
    \ flow. When the function P calls panic, the execution of P stops, any deferred\
    \ functions inside P execute as they normally would, and then P returns to its\
    \ caller. You can invoke panic directly, but it occurs with some run-time errors.\
    \ The syntax for panic looks like this, and can take any argument:\n\n> func panic(p\
    \ interface{})\n\n## Panics and Recover\n\nGolang allows you to handle a panic\
    \ and recover from it while providing some helpful info and potentially some output\
    \ to the end-user.\n\nEarlier in the book, we discussed the defer statement, which\
    \ adds a function call to a list. That saved call list will execute once the surrounding\
    \ function has returned. In other words, the deferred function is guaranteed to\
    \ run at the end.\n\nWhen a function panics, its current execution stops, any\
    \ deferred functions run, and the function returns to its collar. This goes on\
    \ up the stack until all functions have either returned or panicked.\n\nThe function\
    \ *recover* , which can only be used with a deferred function, gives Go control\
    \ over a panicking goroutine. If you try to use recover() with normal flow, you’ll\
    \ just get nil, but it will capture the panic value if called in a panicking goroutine.\n\
    \nAs an example, suppose you had a function PrintAllOps that took two integers,\
    \ x and y, and added them together, subtracted them, multiplied, and divided them.\
    \ If you gave y the value of zero, the function would panic because dividing by\
    \ zero is illegal, but this can be handled with *recover* :\n\n> func PrintAllOps(x\
    \ int, y int) {\n\n> \n\n> defer func() {\n\n> \n\n> if r := recover(); r ! =\
    \ nil {\n\n> \n\n> fmt.Printf(“Recovering from panic in PrintAllOps error is:\
    \ %v \\\\n”, r)\n\n> \n\n> }\n\n> \n\n> } ()\n\n> \n\n> sum, subtract, multiply,\
    \ divide := x+y, x-y, x\\*y, x/y\n\n> \n\n> fmt.Printf(“sum= %v, subtract=%v,\
    \ multiply=%v, divide=%v \\\\n”, sum, subtract, multiply, divide)\n\n> \n\n> }\n\
    \nWhen you run the main function with x:=20 and y:=0, the resulting output appears\
    \ like so:\n\n> *Recovering from panic in printAllOps error is: runtime error:*\n\
    \n> \n\n> *integer divide by zero*\n\n> \n\n> *Exiting main without any issues*\n\
    \n## Error Handling with Closures\n\nIn programming, *closures* are records that\
    \ store a function with its environment. Closures let the function access captured\
    \ variables (ones that are used locally and defined in an enclosed scope) through\
    \ the closure’s copies of the references and values, even if the function is called\
    \ outside their scope.\n\nClosures help when you want to check for errors and\
    \ report them in the same function. Here’s an example of wrapping error handling\
    \ in a closure. Notice that the error checking, error reporting, and then normal\
    \ function are separate in the code.\n\n> func onlineReqHandler( r http.ResponseWriter,\
    \ req \\*http.Request) {\n\n> \n\n> err := func () os.Error {\n\n> \n\n> if req.Method\
    \ ! = “GET” {\n\n> \n\n> return os.NewError(“expected GET”)\n\n> \n\n> }\n\n>\
    \ \n\n> if input := parseInput(req); input ! = “command” {\n\n> \n\n> return os.Error(“malformed\
    \ command”)\n\n> \n\n> }\n\n> \n\n> } ()\n\n> \n\n> if err ! = nil {\n\n> \n\n\
    > r.WriteHeader(400)\n\n> \n\n> io.WriteString(r, err)\n\n> \n\n> return\n\n>\
    \ \n\n> }\n\n> \n\n> do something()...\n\n## Testing and Benchmarking\n\nPart\
    \ of developing a code that’s easy for others to read and use involves making\
    \ testing simple. Add your tests to the same folder where you put the rest of\
    \ your code. The file is named “\\_test.go”. If as an example you have a code\
    \ file called monsters.go, then your test for that file should be saved in the\
    \ same folder and named monsters\\_test.go.\n\nThere’s a *testing* package in\
    \ Golang, as you might expect. The test method always has the following signature:\n\
    \n> TestXxx(t \\*testing.T)\n\nFor example, suppose you wanted to test your salutation\
    \ function. Here’s a quick sample:\n\n> package main\n\n> \n\n> import “testing”\n\
    \n> \n\n> func TestSayHello(t \\*testing.T) {\n\n> \n\n> goodRun := “Hi Cerberus”\n\
    \n> \n\n> salutation := sayhello(“Cerberus”)\n\n> \n\n> if salutation != goodRun,\
    \ {\n\n> \n\n> t.Errorf(“Salutation was incorrect, got: %s wanted: %s” salutation,\
    \ goodRun)\n\n> \n\n> }\n\n> \n\n> }\n\nAn additional part of the testing package\
    \ is *benchmarking* . Testing is necessary, but being able to benchmark how your\
    \ code performs and identify any bottlenecks is valuable as well.\n\nHowever,\
    \ you don’t need to benchmark every single piece of code you create. Use benchmarking\
    \ when you’re having performance issues or when you have time to indulge your\
    \ curiosity about your code’s performance.\n\nThe syntax for benchmarking is similar\
    \ to that of testing:\n\n> BenchmarkXxx(b \\*testing.B)\n\nIf you want to run\
    \ all the benchmarks inside a program, you can run them from the command line\
    \ with the following signature:\n\n> go test -bench=.\n\nSuppose you have a function\
    \ that takes an integer and adds 3 to it. This part of the code would look like\
    \ so:\n\n> func Calculate(x int) (result int) {\n\n> \n\n> result = x + 3\n\n\
    > \n\n> return result\n\n> \n\n> }\n\nTo benchmark its performance, import testing\
    \ and add to the code:\n\n> package main\n\n> \n\n> import “testing”\n\n> \n\n\
    > func BenchmarkCalculate(b \\*testing.B) {\n\n> \n\n> for i := 0; i < b.N; i++\
    \ {\n\n> \n\n> Calculate (3)\n\n> \n\n> }\n\n> \n\n> }\n\nThe result provides\
    \ you with three values: the name of the benchmark, how many times the program\
    \ ran the code, and the time it took in nanoseconds per operation in ns/op. It’s\
    \ run multiple times so the program can take the average instead of basing the\
    \ benchmark on one observation.\n\nAs you add on benchmarks and/or increase the\
    \ complexity of the code, expect them to take longer. Trying different inputs\
    \ can also give you a view into how your program might operate in a real-world\
    \ environment and point to any potential bottlenecks.\n\nFor example, in this\
    \ scenario you might add the following benchmark calculations:\n\n> func BenchmarkCalculate100(b\
    \ \\*testing.B) {benchmarkCalculate(100, b)}\n\n> \n\n> func BenchmarkCalculateNeg1(b\
    \ \\*testing.B) {benchmarkCalculate(-1, b)}\n\n> \n\n> func BenchmarkCalculateNeg100(b\
    \ \\*testing.B) {benchmarkCalculate(-100, b)}\n\n## Assessing Code Performance\n\
    \nYou may be used to using time complexity analysis to see which program or code\
    \ snippet runs faster. But Go gives you built-in tools to go deeper than that\
    \ with benchmarking. Bottlenecks in code aren’t always the result of running the\
    \ wrong algorithm; sometimes, they’re due to a poor selection or inefficient use\
    \ of system calls.\n\nBenchmarks allow you to see whether one version of the code\
    \ performs better than another. Run one version of the code, benchmark it, run\
    \ a new version with modifications and benchmark it, then compare the results.\
    \ This could get tedious, but Go has the command *benchstat* (older versions may\
    \ use benchcmp) to compare the statistics, including mean, minimum, and maximum\
    \ run time between benchmarks. When run for a single file, the results summarize\
    \ the file.\n\nIf it’s invoked for two input files with multiple benchmarks, you’ll\
    \ see a column showing the percent change in the mean between the two. It’ll also\
    \ show the p-value and sample sizes from the tests. Remember, a low p-value (<=\
    \ 0.05) means the results are statistically significant.\n\n## Chapter Summary\n\
    \nGolang makes it easy for developers to handle errors before end-users find them,\
    \ and to test and benchmark code to ensure good performance and speedy execution.\n\
    \n*   Panic allows you to override control of the program flow.\n\n*   You can\
    \ use recover to deal with a panic so portions of the code may still run.\n\n\
    *   Check for errors and report them using closures.\n\n*   The testing package\
    \ allows you to write tests and benchmark your programs.\n\n*   Go makes it easy\
    \ for you to compare benchmarks so you can assess the performance of what you’ve\
    \ written.\n\nIn the next chapter, you'll learn about more patterns as well as\
    \ common Go coding pitfalls.\n\nFourteen "
  fmt: "\n`Panic` is a built-in function that stops the program’s ordinary control\
    \ of flow. When the function `P` calls `panic`, the execution of `P` stops, any\
    \ deferred functions inside `P` execute as they normally would, and then `P` returns\
    \ to its caller. You can invoke `panic` directly, but it occurs with some run-time\
    \ errors. The syntax for `panic` looks like this, and can take any argument:\n\
    \n```\n> func panic(p interface{})\n```\n\n## Panics and Recover\n\nGolang allows\
    \ you to handle a panic and recover from it while providing some helpful info\
    \ and potentially some output to the end-user.\n\nEarlier in the book, we discussed\
    \ the `defer` statement, which adds a function call to a list. That saved call\
    \ list will execute once the surrounding function has returned. In other words,\
    \ the deferred function is guaranteed to run at the end.\n\nWhen a function panics,\
    \ its current execution stops, any deferred functions run, and the function returns\
    \ to its collar. This goes on up the stack until all functions have either returned\
    \ or panicked.\n\nThe function `recover`, which can only be used with a deferred\
    \ function, gives Go control over a panicking goroutine. If you try to use `recover()`\
    \ with normal flow, you’ll just get `nil`, but it will capture the panic value\
    \ if called in a panicking goroutine.\n\nAs an example, suppose you had a function\
    \ `PrintAllOps` that took two integers, `x` and `y`, and added them together,\
    \ subtracted them, multiplied, and divided them. If you gave `y` the value of\
    \ zero, the function would panic because dividing by zero is illegal, but this\
    \ can be handled with `recover` :\n\n```\n> func PrintAllOps(x int, y int) {\n\
    > defer func() {\n> if r := recover(); r ! = nil {\n> fmt.Printf(“Recovering from\
    \ panic in PrintAllOps error is: %v \\n”, r)\n> }\n> } ()\n> sum, subtract, multiply,\
    \ divide := x+y, x-y, x\\*y, x/y\n> fmt.Printf(“sum= %v, subtract=%v, multiply=%v,\
    \ divide=%v \\n”, sum, subtract, multiply, divide)\n> }\n```\n\nWhen you run the\
    \ `main` function with `x:=20` and `y:=0`, the resulting output appears like so:\n\
    \n```\n> Recovering from panic in printAllOps error is: runtime error:\n> integer\
    \ divide by zero\n> Exiting main without any issues\n```\n\n## Error Handling\
    \ with Closures\n\nIn programming, `closures` are records that store a function\
    \ with its environment. Closures let the function access captured variables (ones\
    \ that are used locally and defined in an enclosed scope) through the closure’s\
    \ copies of the references and values, even if the function is called outside\
    \ their scope.\n\nClosures help when you want to check for errors and report them\
    \ in the same function. Here’s an example of wrapping error handling in a closure.\
    \ Notice that the error checking, error reporting, and then normal function are\
    \ separate in the code.\n\n```\n> func onlineReqHandler( r http.ResponseWriter,\
    \ req \\*http.Request) {\n> err := func () os.Error {\n> if req.Method ! = “GET”\
    \ {\n> return os.NewError(“expected GET”)\n> }\n> }()\n> if err != nil {\n> http.Error(r,\
    \ err.Error(), 500)\n> return\n> }\n> r.Write([]byte(\"success\"))\n> }\n```\n\
    \n## Testing and Benchmarking\n\nIn programming, `closures` are records that store\
    \ a function with its environment. Closures let the function access captured variables\
    \ (ones that are used locally and defined in an enclosed scope) through the closure’s\
    \ copies of the references and values, even if the function is called outside\
    \ their scope.\n\nClosures help when you want to check for errors and report them\
    \ in the same function. Here’s an example of wrapping error handling in a closure.\
    \ Notice that the error checking, error reporting, and then normal function are\
    \ separate in the code.\n\n```\n> func onlineReqHandler( r http.ResponseWriter,\
    \ req \\*http.Request) {\n> err := func () os.Error {\n> if req.Method ! = “GET”\
    \ {\n> return os.NewError(“expected GET”)\n> }\n> }()\n> if err != nil {\n> http.Error(r,\
    \ err.Error(), 500)\n> return\n> }\n> r.Write([]byte(\"success\"))\n> }\n```\n\
    \n Assessing Code Performance\n\nYou may be used to using time complexity analysis\
    \ to see which program runs faster. But Go gives you built-in tools to go deeper\
    \ than that with benchmarking. Benchmarks allow you to see whether one version\
    \ of the code performs better than another. Run one version of the code, benchmark\
    \ it, run a new version with modifications and benchmark it, then compare the\
    \ results. This could get tedious, but Go has the command `benchstat` (older versions\
    \ may use `benchcmp`) to compare the statistics, including mean, minimum, and\
    \ maximum run time between benchmarks. When run for a single file, the results\
    \ summarize the file. If it’s invoked for two input files with multiple benchmarks,\
    \ you’ll see a column showing the percent change in the mean between the two.\
    \ It’ll also show the p-value and sample sizes from the tests.\n\n"
  trans: "\n\n`Panic` 是一个内置函数，用于停止程序的普通控制流。当函数 `P` 调用 `panic` 时，`P` 的执行将会停止，`P` 内部的任何延迟执行（deferred）函数都会像往常一样执行，然后\
    \ `P` 返回到其调用者。你可以直接调用 `panic`，但它通常发生在运行时错误中。`panic` 的语法如下，并且可以接受任何参数：\n\n```\n\
    > func panic(p interface{})\n```\n\n## Panic 与恢复（Panic and Recover）\n\nGolang\
    \ 允许你处理 panic 并从中恢复，同时提供一些有用的信息并可能向用户输出某些内容。\n\n在书的前面的部分，我们讨论了 `defer` 语句，它将函数调用添加到列表中。该保存的调用列表会在周围函数返回后执行一次。换句话说，延迟函数保证在结束时运行。\n\
    \n当一个函数发生 panic 时，其当前的执行会停止，任何延迟函数都会运行，然后函数返回到它的调用者。这个过程会沿着堆栈向上持续，直到所有函数都已返回或发生\
    \ panic。\n\n`recover` 函数只能在延迟函数中使用，它让 Go 获得对发生 panic 的 goroutine 的控制权。如果你尝试在正常流中使用\
    \ `recover()`，你只会得到 `nil`，但在发生 panic 的 goroutine 中调用它时，它会捕获 panic 值。\n\n例如，假设你有一个函数\
    \ `PrintAllOps`，它接收两个整数 `x` 和 `y`，并对它们进行相加、相减、相乘和除。如果你给 `y` 赋值为零，该函数将发生 panic，因为除以零是非法的，但可以使用\
    \ `recover` 来处理：\n\n```\n> func PrintAllOps(x int, y int) {\n> defer func() {\n\
    > if r := recover(); r ! = nil {\n> fmt.Printf(“Recovering from panic in PrintAllOps\
    \ error is: %v \\n”, r)\n> }\n> } ()\n> sum, subtract, multiply, divide := x+y,\
    \ x-y, x\\*y, x/y\n> fmt.Printf(“sum= %v, subtract=%v, multiply=%v, divide=%v\
    \ \\n”, sum, subtract, multiply, divide)\n> }\n```\n\n当你使用 `x:=20` 和 `y:=0` 运行\
    \ `main` 函数时，输出结果如下：\n\n```\n> Recovering from panic in printAllOps error is:\
    \ runtime error:\n> integer divide by zero\n> Exiting main without any issues\n\
    ```\n\n## 使用闭包处理错误（Error Handling with Closures）\n\n在编程中，`closures`（闭包）是存储函数及其环境的记录。闭包允许函数通过闭包对引用和值的拷贝来访问被捕获的变量（局部使用且定义在封闭作用域内的变量），即使该函数是在其作用域之外被调用的。\n\
    \n当你想要同一个函数中检查错误并报告它们时，闭包会很有帮助。这是一个在闭包中封装错误处理的示例。注意代码中的错误检查、错误报告以及随后的正常函数是分开的。\n\
    \n```\n> func onlineReqHandler( r http.ResponseWriter, req \\*http.Request) {\n\
    > err := func () os.Error {\n> if req.Method ! = “GET” {\n> return os.NewError(“expected\
    \ GET”)\n> }\n> }()\n> if err != nil {\n> http.Error(r, err.Error(), 500)\n> return\n\
    > }\n> r.Write([]byte(\"success\"))\n> }\n```\n\n## 测试与基准测试（Testing and Benchmarking）\n\
    \n在编程中，`closures`（闭包）是存储函数及其环境的记录。闭包允许函数通过闭包对引用和值的拷贝来访问被捕获的变量（局部使用且定义在封闭作用域内的变量），即使该函数是在其作用域之外被调用的。\n\
    \n当你想要同一个函数中检查错误并报告它们时，闭包会很有帮助。这是一个在闭包中封装错误处理的示例。注意代码中的错误检查、错误报告以及随后的正常函数是分开的。\n\
    \n```\n> func onlineReqHandler( r http.ResponseWriter, req \\*http.Request) {\n\
    > err := func () os.Error {\n> if req.Method ! = “GET” {\n> return os.NewError(“expected\
    \ GET”)\n> }\n> }()\n> if err != nil {\n> http.Error(r, err.Error(), 500)\n> return\n\
    > }\n> r.Write([]byte(\"success\"))\n> }\n```\n\n 评估代码性能（Assessing Code Performance）\n\
    \n你可能习惯于时间复杂度分析来查看哪个程序运行得更快。但 Go 提供了内置工具，通过基准测试进行更深入的分析。基准测试允许你查看一个代码版本的性能是否优于另一个。运行一个版本的代码，进行基准测试，运行带有修改的新版本并再次进行基准测试，然后比较结果。这可能会很枯燥，但\
    \ Go 有 `benchstat` 命令（旧版本可能使用 `benchcmp`）来比较基准测试之间的统计数据，包括平均值、最小值和最大运行时间。当针对单个文件运行时，结果会汇总该文件。如果为两个包含多个基准测试的输入文件调用，你将看到一列显示两者平均值变化百分比的列。它还会显示\
    \ p 值和测试样本量。\n\n"
