- raw: "Although handling errors is pretty simple in Go, it may require a lot more\
    \ code than other languages.\n\n*   Dependency management\n\nYou can install different\
    \ libraries with Go, but if the maintainer of the library uploads a version that's\
    \ not backward-compatible, then anyone running your app will get an error. If\
    \ the library isn’t installed, the program won’t compile.\n\nWhile there *is*\
    \ a tool to help you manage this (Dep), it either forces you to load all the dependencies\
    \ on the repository or store the package list. If you store on the repository,\
    \ your code becomes *much* bigger because you’re also storing lines of dependency\
    \ code. However, if you only store the package list, you may run into backward\
    \ incompatibility issues which will cause your program to crash.\n\n## Who Should\
    \ Use Go?\n\nThis language is great for the underlying code on apps that require\
    \ speed. It’s also good for high-performance apps that require scalability.\n\n\
    Google uses it for its cloud services infrastructure; companies like YouTube,\
    \ Netflix, and Soundcloud use Go for high loads on their platforms; Uber used\
    \ it to improve map processing speeds so it takes less time to match a rider with\
    \ a driver; data science organizations are using it more and more to process big\
    \ data and make sense of it.\n\nGo is a great solution for fintech developers\
    \ because it allows for a smooth connection between users and their financial\
    \ institutions. Paypal has used it for scaling, AmEx for payments, and Salesforce\
    \ for their “Einstein Analytics”. It’s also become the language of choice for\
    \ programming on the blockchain, especially the Ethereum network.\n\nAs you can\
    \ see, Go is a good tool to have for almost any modern programmer. Whether it’s\
    \ for system programming, network programming, web applications, or DevOps, the\
    \ language is easy to use and read. And most importantly for the users of today,\
    \ it’s much faster than many of the other available options.\n\n## Chapter Summary\n\
    \nGo was designed by Google engineers who wanted a faster computer language that\
    \ could take advantage of multiple cores.\n\n*   Because it is a younger language,\
    \ it works well for modern applications that are located on the cloud instead\
    \ of specific hardware and can run operations concurrently.\n\n*   Go is flexible\
    \ and uses goroutines that run simultaneously without slowing down the speed,\
    \ among other advantages.\n\n*   Golang’s GUI library is nonexistent, so it’s\
    \ not preferred for apps that rely on GUI in addition to speed, among other disadvantages.\n\
    \n*   Go is applicable in many different types of applications and industries,\
    \ especially for those with high user loads or other big data needs.\n\nIn the\
    \ next chapter, you'll learn about the foundations of Go.\n\nTwo \n\nIn this chapter,\
    \ we’ll delve into the foundations of Golang, which you can think of as the basic\
    \ vocabulary for the language. Some of these you’ll be familiar with if you’ve\
    \ done programming with similar languages such as C and C++.\n\n## Identifiers,\
    \ Filenames, and Keywords\n\nIf you’re relatively new to programming, *identifiers*\
    \ are the names of the program’s components as defined by the users. Identifiers\
    \ in Go may be names of functions, constants, variables, statement labels, types,\
    \ or package names.\n\nGo identifiers must be written in a specific way to be\
    \ recognized by the program. It must start with a letter or underscore, not a\
    \ number. The identifier itself can contain letters, numbers, and underscores.\
    \ It’s case-sensitive, so while Go\\_lang and go\\_lang are different, they’re\
    \ both valid names. Golang1 is OK, but 1Golang is not. You can’t use keywords\
    \ such as “if” or “default”.\n\nProgrammers find it best to keep the identifiers\
    \ between 4 and 15 characters, though there’s technically no limit to the length.\
    \ The underscore is a blank identifier and is used as an anonymous placeholder\
    \ with a special meaning in certain parts of the program.\n\nGo also has some\
    \ identifiers that have been predeclared and can be used for constants, functions,\
    \ and types.\n\n*   Constants: true, false, iota, nil\n\n*   Functions: make,\
    \ copy, append, close, delete, plus others\n\n*   Types: int, uint, string, bool,\
    \ error, plus others\n\n*Filenames* , which are used to identify each file uniquely,\
    \ are typically written in lowercase and multiple words are separated with an\
    \ underscore.\n\n*Keywords* , sometimes known as reserve words, already have a\
    \ meaning in the language and therefore, as noted above, can’t be used for identifiers.\
    \ There are 25 keywords in Go, including map, struct, goto, switch, import, and\
    \ return.\n\n## Functions\n\nIn general, *functions* are blocks of code that perform\
    \ a specific task. They’re also known as methods, subroutines, or procedures.\
    \ Many functions follow the format of taking in data, processing it, and then\
    \ returning the result. Functions can be “called” from within other functions.\
    \ Once the function is called, the program leaves the code at that line, executes\
    \ the function instructions line by line, then returns to the program, replacing\
    \ the function with the result that it returned. Instead of continually rewriting\
    \ code or copying and pasting for common tasks, functions can be reused over and\
    \ over. Languages normally have several built-in functions that would otherwise\
    \ require multiple lines of code, and programmers can also write their own to\
    \ satisfy the need of their program. The variables inside the function are only\
    \ live while the function is being executed, so you can use *i* to mean one thing\
    \ in function\\_1 and something else in function\\_2, and the program will continue\
    \ to run.\n\nIn Go, every program has at least one function: main(). This is a\
    \ function declaration, which tells the program the name of the function, the\
    \ return type, parameters, and the *definition.* The definition is the set of\
    \ instructions or the function body.\n\nThere are other standard functions in\
    \ Go such as len(), which will give you the length of the argument, string, or\
    \ array, depending on what was called.\n\nThis is the syntax of a function in\
    \ Go, or how it’s written in code:\n\n> func function\\_name ( \\[parameter list\\\
    ] ) \\[return\\_types\\]\n\n> \n\n> }\n\n> \n\n> body of the function\n\n> \n\n\
    > {\n\nwhere\n\n*   func starts the *declaration,* telling the program that a\
    \ function is coming up\n\n*   function\\_name names the function being used\n\
    \n*   parameter is similar to a placeholder, and gives the type, order, and number\
    \ of parameters; there may be no parameters for a function\n\n*   return\\_types\
    \ is the list of data types for the values the function returns; this isn’t always\
    \ required\n\n*   body defines what the function does\n\nFor example, suppose\
    \ you wanted a function to show the maximum of two numbers, num1 and num2:\n\n\
    > func max (num 1, num2 int) int {\n\n> \n\n> result int //The program ignores\
    \ anything after //, so you can type notes here. Note that this is a local variable\
    \ declaration.\n\n> \n\n> if (num1 > num2) {\n\n> \n\n> result = num1\n\n> \n\n\
    > } else {\n\n> \n\n> result = num2\n\n> \n\n> }\n\n> \n\n> return result\n\n\
    > \n\n> }\n\n## Data Types\n\nThe type of a variable specifies how much space\
    \ it occupies and how the bit pattern should be interpreted. In Go, you can classify\
    \ into four categories:\n\n1\\. Boolean\n\nThere are only two of these: true and\
    \ false. *Bool* is one of the four elementary types.\n\n2\\. Numeric\n\nThese\
    \ can be either integers or floating-point values. Examples of numeric types include\
    \ uint8 (unsigned 8-bit integers from 0 to 255), int16 (signed 16-bit integers),\
    \ and the like for integers.\n\nFloating points can be float32 (IEEE 32-bit floating-point),\
    \ float64 (IEEE 64-bit floating-point, complex62 (float32 with real and imaginary\
    \ parts), or complex128 (float64 with real and imaginary.)\n\nBoth *int* and *float*\
    \ are also elementary types.\n\n3\\. Strings\n\nThese represent the value of the\
    \ string, which is a sequence of bytes. Once created, the string cannot be changed.\
