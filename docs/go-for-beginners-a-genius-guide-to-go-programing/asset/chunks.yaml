- raw: "The hash table, which you may be familiar with in other languages, is convenient\
    \ for programmers because it provides fast lookups (in addition to adds and deletes).\
    \ Go’s map implements a hash table. One thing to be aware of with Golang maps\
    \ is that they can’t be run concurrently unless you mediate it with some code.\
    \ Suppose you’ve launched a retail shop and you want to store the salaries for\
    \ each employee; a map would be great for this because you can use the employee\
    \ names as the key and their salaries as the value.\n\nAlthough structs (discussed\
    \ in the next chapter) often work better with JavaScript Object Notification (JSON)\
    \ than maps do, there are times when you might want to use a map instead. JSON\
    \ is a common language for transmitting web data from client to server. With a\
    \ struct, you need to know the details for each JSON element.\n\nWhen working\
    \ with APIs and other configurations in which the data type and name are static,\
    \ programming in the details is relatively easy. But if you don’t know the JSON\
    \ structure in advance for code that needs to parse it, maps allow you to parse\
    \ all of its fields without dropping any.\n\n## Declaration and Initialization\n\
    \nLike pointers and slices, map types are references. That means a nil map doesn’t\
    \ have any values and keys can’t be added to it. Go returns an error if you try\
    \ to add an element to an uninitialized map and behaves like an empty map while\
    \ reading. To create a map, you can use the make builtin or declare a map literal.\n\
    \nUsing the *make* builtin allocates and initializes a hash structure. It returns\
    \ a map value that points to the data structure. If you use make, the syntax is\
    \ as follows:\n\n> make(map\\[type of key\\]type of value)\n\nUsing the above\
    \ example, you could write\n\n> Salary =: make(map\\[string\\]int)\n\nWith no\
    \ elements to it, the map is empty. Add the elements in to create an actual map.\n\
    \n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> func main() {\n\n> \n\n> Salary\
    \ =: make(map\\[string\\]int)\n\n> \n\n> Salary\\[Jennifer\\] = 50000\n\n> \n\n\
    > Salary\\[Ben\\] = 25000\n\n> \n\n> Salary\\[Matt\\] = 20000\n\n> \n\n> fmt.Println(“Salary\
    \ map contents = ”, Salary)\n\n> \n\n> }\n\nYour output looks like this:\n\n>\
    \ *Salary map contents = map\\[Jennifer:50000 Ben:25000 Matt:20000\\]*\n\nYou\
    \ can also declare a map literal that initializes the map with some data:\n\n\
    > package main\n\n> \n\n> import “fmt”\n\n> \n\n> func main() {\n\n> \n\n> Salary\
    \ =: map\\[string\\]int {\n\n> \n\n> “Jennifer”: 50000,\n\n> \n\n> “Ben”: 25000,\n\
    \n> \n\n> }\n\n> \n\n> Salary\\[Matt\\] = 20000 //adding Matt in\n\n> \n\n> fmt.Println(“Salary\
    \ map contents = ”, Salary)\n\n> \n\n> }\n\n## Key Value Item\n\nIn Go, a key\
    \ can be almost any type including boolean, string, int, and struct (we’ll cover\
    \ these in detail in a later chapter). But because they can’t be compared using\
    \ ==, slices, maps, and functions can’t be used as keys in your map. Consider\
    \ the following statement:\n\n> m\\[“route”\\]=66 //here the key is “route” and\
    \ the value is 66.\n\nTo retrieve the value stored in “route” and assign it to\
    \ new variable p:\n\n> p =: m\\[“route”\\]\n\nIf the key doesn’t exist, then the\
    \ zero value for that value type is returned. In this instance, the type is int,\
    \ so the zero value is 0.\n\n> q =: m\\[“rute”\\] // q == 0\n\nYou can test to\
    \ see if the key exists on a particular map.\n\n> p, ok := m\\[“route”\\]\n\n\
    If the key doesn’t exist, then the first value (here, p) is that type’s zero value.\
    \ The second is boolean, which will be true if the key shows on the map and false\
    \ if it doesn’t. You can also test that the key exists without returning the value\
    \ by using underscore (\\_) as the first value:\n\n> \\_, ok := m\\[“route”\\\
    ]\n\nWhen the key isn’t present, the map returns zero. Programmers find zero values\
    \ in maps useful for a variety of reasons. You could use it with boolean values,\
    \ because the zero value in bool is *false* . You can test a map easily to find\
    \ out if a condition is true or not. It’s also helpful when working with slices,\
    \ because appending to a nil slice results in the allocation of a new slice. You\
    \ wouldn’t have to test to see if a key is present because you can simply append\
    \ a value to a map of slices.\n\nMaps can also be used with strings. Note that\
    \ the syntax shows each key-value pair connected by a colon (:). The pairs may\
    \ not always return in the same order because maps in Go are unordered, but the\
    \ pair relationships stay the same.\n\nFor example, you could have a map that\
    \ describes a dog:\n\n> map\\[string\\]string{“name”: “Powerpuff”, “breed”: “Jackaroodle”,\
    \ “color”: “white/brown”, “owner”: “PetuniaJones”}\n\n> \n\n> Here, the keys are\
    \ “name”, “breed”, “color”, “owner” and the values are “Powerpuff”, “Jackaroodle”,\
    \ “white/brown”, “PetuniaJones”.\n\nIf you wanted to print it out, you could store\
    \ the map inside a variable.\n\n> powerpuff := map\\[string\\]string{“name”: “Powerpuff”,\
    \ “breed”: “Jackaroodle”, “color”: “white/brown”, “owner”: “PetuniaJones”}\n\n\
    > \n\n> fmt.Println(powerpuff)\n\nYour output would print as follows:\n\n> *map\\\
    [breed: Jackaroodle color: white/brown owner: PetuniaJones name: Powerpuff\\]*\n\
    \nYou might have already noticed the need to differentiate between a stored value\
    \ of 0 and a zero value of 0 because the key isn’t found. When you look up a value,\
    \ you have the option of returning a second value, which is a bool. Conventionally,\
    \ this is known as the *ok idiom* (as you saw above). Use ok as the second value,\
    \ because it will return “false” (instead of a misleading zero) if it doesn’t\
    \ find the key.\n\nFor example, suppose you have a map called fluffythings, and\
    \ you want to see if it contains the key “route”. If you simply wrote this:\n\n\
    > fluffythings := map\\[string\\]int{}\n\n> \n\n> fmt.Println(fluffythings\\[“route”\\\
    ])\n\nyou’d end up with an output of 0, which is int type’s zero value. But if\
    \ you didn’t already know that fluffythings didn’t contain “route”, you might\
    \ assume that the actual value is 0. Instead, use the ok idiom:\n\n> fluffythings,\
    \ ok = fluffythings\\[“route”\\] // technically the second value can be anything,\
    \ but the convention is to use ok\n\nIf “route” is contained in fluffythings,\
    \ ok is true and otherwise is false. You can also try adding on if-else statements\
    \ to tell the program what to do, as follows:\n\n> if ok {\n\n> \n\n> fmt.Println\
    \ (“Fluffythings has route.”)\n\n> \n\n> } else {\n\n> \n\n> fmt.Println(“Route\
    \ was not found.”)\n\nMaps act like databases. If you want to get an index value,\
    \ you call an integer. With a map, you call the key to get the value that’s related\
    \ to it. Using the example above, you could isolate the name by calling the variable\
    \ holding the map and its related key:\n\n> powerpuff\\[“name”\\]\n\nWhen printing\
    \ it out using fmt.Println(powerpuff\\[“name”\\]), the output is Powerpuff. Similarly,\
    \ you could call the other values in powerpuff:\n\n> fmt.Println(powerpuff\\[“breed”\\\
    ]) // returns Jackaroodle\n\n> \n\n> fmt.Println(powerpuff\\[“color”\\]) // returns\
    \ white/brown\n\n> \n\n> fmt.Println(powerpuff\\[“owner”\\]) // returns PetuniaJones\n\
    \nThere are no convenience functions that allow you to list the keys and/or values\
    \ in a map. However, you can get there using iterations.\n\n## For Range\n\nUsing\
    \ the *for range* function to iterate over maps will return two values, the first\
    \ one being the key and the second being the value. The language uses the correct\
    \ type for both. What iteration with maps does *not* automatically do in Go is\
    \ retain the same order in every loop. If you want the loops to run in the same\
    \ order every time, you’ll need to write a data structure that maintains the order\
    \ you want.\n\nIn this iteration example, both key and value are strings, and\
    \ the result will also be a string:\n\n> for key, value := range powerpuff {\n\
    \n> \n\n> fmt.Printf(“%q is the key for the value %q\\\\n”, key, value)\n\n> \n\
    \n> }\n\nWhich results in the following output:\n\n> “breed” is the key for the\
    \ value “Jackaroodle”\n\n> \n\n> “color” is the key for the value “white/brown”\n\
    \n> \n\n> “owner” is the key for the value “PetuniaJones”\n\n> \n\n> “name” is\
    \ the key for the value “Powerpuff”\n\n## Slices and Maps"
  fmt: "\nThe hash table, which you may be familiar with in other languages, is convenient\
    \ for programmers because it provides fast lookups (in addition to adds and deletes).\
    \ Go’s `map` implements a hash table. One thing to be aware of with Golang maps\
    \ is that they can’t be run concurrently unless you mediate it with some code.\
    \ Suppose you’ve launched a retail shop and you want to store the salaries for\
    \ each employee; a map would be great for this because you can use the employee\
    \ names as the key and their salaries as the value.\n\nAlthough structs (discussed\
    \ in the next chapter) often work better with JavaScript Object Notification (JSON)\
    \ than maps do, there are times when you might want to use a map instead. JSON\
    \ is a common language for transmitting web data from client to server. With a\
    \ struct, you need to know the details for each JSON element.\n\nWhen working\
    \ with APIs and other configurations in which the data type and name are static,\
    \ programming in the details is relatively easy. But if you don’t know the JSON\
    \ structure in advance for code that needs to parse it, maps allow you to parse\
    \ all of its fields without dropping any.\n\n## Declaration and Initialization\n\
    \nLike pointers and slices, map types are references. That means a nil map doesn’t\
    \ have any values and keys can’t be added to it. Go returns an error if you try\
    \ to add an element to an uninitialized map and behaves like an empty map while\
    \ reading. To create a map, you can use the `make` builtin or declare a map literal.\n\
    \nUsing the `make` builtin allocates and initializes a hash structure. It returns\
    \ a map value that points to the data structure. If you use `make`, the syntax\
    \ is as follows:\n\n> `make(map[type of key]type of value)`\n\nUsing the above\
    \ example, you could write:\n\n> `Salary := make(map[string]int)`\n\nWith no elements\
    \ to it, the map is empty. Add the elements in to create an actual map.\n\n```go\n\
    package main\n\nimport \"fmt\"\n\nfunc main() {\n    Salary := make(map[string]int)\n\
    \    Salary[\"Jennifer\"] = 50000\n    Salary[\"Ben\"] = 25000\n    Salary[\"\
    Matt\"] = 20000\n    fmt.Println(\"Salary map contents = \", Salary)\n}\n```\n\
    \nYour output looks like this:\n\n`Salary map contents = map[Jennifer:50000 Ben:25000\
    \ Matt:20000]`\n\nYou can also declare a map literal that initializes the map\
    \ with some data:\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\
    \    Salary := map[string]int{\n        \"Jennifer\": 50000,\n        \"Ben\"\
    : 25000,\n    }\n    Salary[\"Matt\"] = 20000 //adding Matt in\n    fmt.Println(\"\
    Salary map contents = \", Salary)\n}\n```\n\n## Key Value Item\n\nIn Go, a key\
    \ can be almost any type including boolean, string, int, and struct (we’ll cover\
    \ these in detail in a later chapter). But because they can’t be compared using\
    \ `==`, slices, maps, and functions can’t be used as keys in your map. Consider\
    \ the following statement:\n\n`m[\"route\"]=66` //here the key is \"route\" and\
    \ the value is 66.\n\nTo retrieve the value stored in \"route\" and assign it\
    \ to new variable `p`:\n\n`p := m[\"route\"]`\n\nIf the key doesn’t exist, then\
    \ the zero value for that value type is returned. In this instance, the type is\
    \ `int`, so the zero value is 0.\n\n`q := m[\"rute\"]` // q == 0\n\nYou can test\
    \ to see if the key exists on a particular map.\n\n`p, ok := m[\"route\"]`\n\n\
    If the key doesn’t exist, then the first value (here, `p`) is that type’s zero\
    \ value. The second is `boolean`, which will be true if the key shows on the map\
    \ and false if it doesn’t. You can also test that the key exists without returning\
    \ the value by using underscore `_` as the first value:\n\n`_, ok := m[\"route\"\
    ]`\n\nWhen the key isn’t present, the map returns zero. Programmers find this\
    \ useful. (Note: The provided text contained several repetitive/garbled phrases\
    \ here which have been cleaned for professional clarity).\n\n## For Range\n\n\
    Using the `for range` function to iterate over maps will return two values, the\
    \ first one being the key and the second being the value. The language uses the\
    \ correct type for both. What iteration with maps does *not* automatically do\
    \ in Go is to retain the same order in every loop. If you want the loops to run\
    \ in the same order every time, you’ll need to write a data structure that maintains\
    \ the order.\n\nIn this iteration example, both key and value are strings, and\
    \ the result will also be a string:\n\n```go\nfor key, value := range powerpuff\
    \ {\n    fmt.Printf(\"%q is the key for the value %q\\n\", key, value)\n}\n```\n"
  trans: "\n\n哈表（你可能在其他语言中很熟悉）对程序员来说非常方便，因为它提供了快速查找（此外还有添加和删除）。Go 的 `map` 实现了哈表。在使用\
    \ Golang map 时需要注意的一点是，除非你通过代码进行调解，否则它们不能并发运行。假设你开了一家零售店，想要存储每位员工的工资；map 非常适合，因为你可以使用员工姓名作为键（key），并将工资作为值（value）。\n\
    \n尽管结构体（将在下一章讨论）在处理 JavaScript 对象符号（JSON）时通常比 map 更好用，但在某些情况下你可能想使用 map。JSON 是从客户端到服务器传输网络数据的常用语言。使用结构体时，你需要知道每个\
    \ JSON 元素的详细信息。\n\n在处理数据类型和名称是静态的 API 及其他配置时，编写细节相对容易。但如果你在需要解析代码中无法提前知道 JSON\
    \ 的结构，map 允许你解析所有的字段而不会丢失任何一个。\n\n## 声明与初始化\n\n像指针和切片一样，map 类型是引用。这意味着 `nil` map\
    \ 不包含任何值，且无法向其添加键。如果你尝试向未初始化的 map 添加元素，Go 会返回错误，而在读取时表现得像一个空 map。要创建一个 map，你可以使用内置函数\
    \ `make` 或声明 map 字面量。\n\n使用 `make` 内置函数会分配并初始化一个哈希结构。它返回一个指向数据结构的 map 值。如果你使用\
    \ `make`，语法如下：\n\n> `make(map[type of key]type of value)`\n\n使用上面的示例，你可以写：\n\n\
    > `Salary := make(map[string]int)`\n\n此时 map 是空的，没有任何元素。添加元素来创建一个实际 map。\n\n```go\n\
    package main\n\nimport \"fmt\"\n\nfunc main() {\n    Salary := make(map[string]int)\n\
    \    Salary[\"Jennifer\"] = 50000\n    Salary[\"Ben\"] = 25000\n    Salary[\"\
    Matt\"] = 20000\n    fmt.Println(\"Salary map contents = \", Salary)\n}\n```\n\
    \n你的输出看起来像这样：\n\n`Salary map contents = map[Jennifer:50000 Ben:25000 Matt:20000]`\n\
    \n你也可以声明 map 字面量来用某些数据初始化 map：\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc\
    \ main() {\n    Salary := map[string]int{\n        \"Jennifer\": 50000,\n    \
    \    \"Ben\": 25000,\n    }\n    Salary[\"Matt\"] = 20000 //添加 Matt \n    fmt.Println(\"\
    Salary map contents = \", Salary)\n}\n```\n\n## 键值项\n\n在 Go 中，键可以是几乎任何类型，包括布尔值、字符串、整数和结构体（我们将在后面的章节中详细介绍这些）。但因为它们无法使用\
    \ `==` 进行比较，所以切片、map 和函数不能作为 map 的键。考虑以下语句：\n\n`m[\"route\"]=66` // 这里的键是 \"route\"\
    ，值为 66。\n\n要获取存储在 \"route\" 中的值并将其赋值给新变量 `p`：\n\n`p := m[\"route\"]`\n\n如果键不存在，则返回该值类型的零值。在此例中，类型是\
    \ `int`，所以零值为 0。\n\n`q := m[\"rute\"]` // q == 0\n\n你可以测试特定键是否存在于某个 map 中。\n\n\
    `p, ok := m[\"route\"]`\n\n如果键不存在，则第一个值（这里是 `p`）是该类型的零值。第二个是 `boolean`（布尔），如果键出现在\
    \ map 中则为 `true`，不存在则为 `false`。你也可以使用下划线 `_` 作为第一个值在不返回值的情况下测试键是否存在：\n\n`_, ok\
    \ := m[\"route\"]`\n\n当键不存在时，map 返回零。程序员发现这很有用。（注意：提供的文本此处包含几处重复/乱码的短语，已为了专业清晰度进行了清理）。\n\
    \n## 用于 Range \n\n使用 `for range` 函数遍历 map 会返回两个值，第一个是键，第二个是值。语言对两者都使用了正确的类型。在\
    \ Go 中，map 迭代*不会*自动完成的特性是在在每次循环中都保持相同的顺序。如果你希望循环每次都按照相同的顺序运行，你将需要编写维护顺序的数据结构。\n\
    \n在以下迭代示例中，键和值都是字符串，结果也将是字符串：\n\n```go\nfor key, value := range powerpuff {\n\
    \    fmt.Printf(\"%q is the key for the value %q\\n\", key, value)\n}\n```\n\n"
