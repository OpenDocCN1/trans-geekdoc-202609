  fmt: "\n```go\nslice2 := append(slice1, \"Blue\", \"Green\", \"Violet\")\n\nfmt.Printf(\"\
    slice1 = %v, len = %d, cap = %d\\n\", slice1, len(slice1), cap(slice1))\n\nfmt.Printf(\"\
    slice2 = %v, len = %d, cap = %d\\n\", slice2, len(slice2), cap(slice2))\n\nslice1[0]\
    \ = \"Pink\" // will show in both slices because the underlying array is the same\n\
    \nfmt.Println(\"\\nslice1 = \", slice1)\n\nfmt.Println(\"slice2 = \", slice2)\n\
    ```\n\nYour output would look like this:\n\n> *slice1 = [Red Orange Yellow], len\
    \ = 3, cap = 10*\n\n> *slice2 = [Red Orange Yellow Blue Green Violet], len = 6,\
    \ cap = 10*\n\n> *slice1 = [Pink Orange Yellow\\]*\n\n> *slice2 = [Pink Orange\
    \ Yellow Blue Green Violet\\]*\n\nIf the underlying array is different because\
    \ the slice you’re appending to doesn’t have enough capacity, changes made in\
    \ the first slice will not carry through to the appended one.\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc main() {\n\n    slice1 := []string{\"Red\", \"\
    Orange\", \"Yellow\"}\n\n    slice2 := append(slice1, \"Blue\", \"Green\", \"\
    Violet\")\n\n    fmt.Printf(\"slice1 = %v, len = %d, cap = %d\\n\", slice1, len(slice1),\
    \ cap(slice1))\n\n    fmt.Printf(\"slice2 = %v, len = %d, cap = %d\\n\", slice2,\
    \ len(slice2), cap(slice2))\n\n    slice1[0] = \"Pink\"\n\n    fmt.Println(\"\\\
    nslice1 = \", slice1)\n\n    fmt.Println(\"slice2 = \", slice2)\n}\n```\n\nIn\
    \ the output, you can see the difference between the case above and this one.\
    \ `Slice2` doesn’t change just because we changed `slice1`. We also didn’t specify\
    \ the `len` and `cap` for the first slice, so the code returns what was used in\
    \ the slice.\n\n> *slice1 = [Red Orange Yellow], len = 3, cap = 3*\n\n> *slice2\
    \ = [Red Orange Yellow Blue Green Violet], len = 6, cap = 6*\n\n> *slice1 = [Pink\
    \ Orange Yellow\\]*\n\n> *slice2 = [Red Orange Yellow Blue Green Violet\\]*\n\n\
    By using the operator `...`, you can also append one slice to another.\n\n```go\n\
    package main\n\nimport \"fmt\"\n\nfunc main() {\n\n    slice1 := []string{\"Red\"\
    , \"Orange\", \"Yellow\"}\n\n    slice2 := []string{\"Green\", \"Blue\", \"Violet\"\
    }\n\n    slice3 := append(slice1, slice2, ...)\n\n    fmt.Println(\"slice1 = \"\
    , slice1)\n\n    fmt.Println(\"slice2 = \", slice2)\n\n    fmt.Println(\"slice3\
    \ = \", slice3)\n}\n```\n\nAs you probably expected, the output is as follows:\n\
    \n> *slice1 = [Red Orange Yellow\\]*\n\n> *slice2 = [Green Blue Violet\\]*\n\n\
    > *slice3 = [Red Orange Yellow Green Blue Violet\\]*\n\n# Strings, Arrays, and\
    \ Slices\n\nSince arrays are not very flexible, Go programmers tend to use slices\
    \ more than arrays. Strings are just read-only slices; you can index them to return\
    \ bytes and slice them to make a substring, which is very efficient. Golang allows\
    \ you to create a string from a byte slice:\n\n```go\nstr = string(slice)\n```\n\
    \nAnd reverse back to a byte slice:\n\n```go\nslice = []byte()\n```\n\n# Sorting\
    \ and Inverting\n\nWhen it comes to slices in Go, there are three sorting functions.\
    \ Which you use will depend on the type of data you’re sorting, but all of them\
    \ will sort slices in ascending order.\n\n1. `sort.Strings`\n2. `sort.Ints`\n\
    3. `sort.Floats64`\n\nThese will all sort the keys according to the type that\
    \ you have. Here’s an example for sorting ints:\n\n```go\npackage main\n\nimport\
    \ \"fmt\", \"sort\"\n\nfunc main() {\n\n    primes := []int{2, 11, 3, 19, 13,\
    \ 7, 5, 17}\n\n    sort.Ints(primes)\n\n    fmt.Println(primes)\n}\n```\n\nHere’s\
    \ what the output looks like:\n\n> *\\[2 3 5 7 9 11 13 17 19\\]*\n\nThere are\
    \ functions that you can use to determine whether your strings, ints, or floats\
    \ are sorted correctly. As you may have already guessed, there’s a separate function\
    \ for each.\n\n*   Strings: `StringsAreSorted`\n\n```go\nfunc StringsAreSorted\
    \ (a string[]) bool // returns true if they’re sorted, false otherwise\n```\n\n\
    Let’s look at a sort check and sort with strings.\n\n```go\npackage main\n\nimport\
    \ \"fmt\", \"sort\"\n\nfunc main() {\n\n    animals := []string{“cow\", \"bear\"\
    , \"coyote\", \"panther\", \"wildebeest\"}\n\n    sorted := StringsAreSorted(animals)\n\
    \n    fmt.Println(sorted)\n\n    sort.Sort(sort.Stringslice(animals))\n\n    sorted\
    \ = sort.StringsAreSorted(animals)\n\n    fmt.Println(sorted)\n}\n```\n\nYour\
    \ output is the following:\n\n> *false*\n\n> *true*\n\n*   Ints: `IntsAreSorted`\n\
    \    ```go\n    func IntsAreSorted (int[]) bool // returns true if they’re sorted,\
    \ false otherwise\n    ```\n*   Float64: `Float64sAreSorted`\n    > *In Float64\
    \ sorts, the NaN (not a number) items come first. Its function is also similar\
