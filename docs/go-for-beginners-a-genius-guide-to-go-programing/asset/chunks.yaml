- raw: "These include pointer types, array types, structure types, map types, etc.,\
    \ and will be discussed further in later chapters.\n\n## Constants\n\nLike other\
    \ statistically typed programs, the compiler either already knows or can figure\
    \ out the type of every variable when it comes time to compile. Unlike other languages,\
    \ however, Go doesn’t allow you to mix numeric types. C, C++, or Java will convert\
    \ smaller types (like “int”) into a larger one (like “float”) when the types are\
    \ mixed.\n\nThe Golang engineers thought that allowing these automatic conversions\
    \ not only potentially makes them hard to read, but creates inconsistencies across\
    \ different platforms. Since Go is designed to work on a variety of architectures,\
    \ the language was designed to ask for explicit types instead.\n\nUnless you explicitly\
    \ give a constant a type, it’s considered untyped, even if you give it a name.\
    \ An untyped constant that’s an integer can only be used where integers are allowed.\
    \ For example, you can’t assign an integer constant to a string or boolean variable.\
    \ An untyped floating-point constant can be used wherever a floating point is\
    \ permitted.\n\nAll untyped constants in Go have default types. Constants that\
    \ are integers default to “int”, floats default to “float64”, characters to “rune”,\
    \ etc. When you declare a type, the constant becomes typed. Again, constants must\
    \ be declared as their correct type, or else the program will return an error.\n\
    \nDeclare constants without a type unless you absolutely need them; declaring\
    \ a type makes you lose the flexibility of being able to mix types in an operation.\n\
    \nThere are a few rules for constant expressions in Go.\n\n*   Comparison between\
    \ two untyped constants results in an untyped boolean constant (“true”/”false”).\n\
    \n*   Operands of the same type result in the same type. In other words, if they’re\
    \ two untyped integer constants, the yield is an untyped integer constant. The\
    \ expression “11/2” results in “5” rather than “5.5” because it’s truncated to\
    \ an integer.\n\n*   If they’re not the same type, the result is the broader of\
    \ the two according to this logic: integer<rune<floating-point<complex\n\n## Variables\n\
    \nIn all languages, the *variable* is the name given to a particular storage area\
    \ used by the program. Names of variables can use letters, digits, and underscores.\
    \ Golang variables have a specific size, memory layout, range of values for the\
    \ memory layout, and possible operations. The variable definition tells the compiler\
    \ how much storage to create for the variable and where to put it.\n\n*Lvalues*\
    \ are used to refer to a memory location and can appear on either the left or\
    \ the right side of an assignment. *RValues* refer to data values that are stored\
    \ in memory. Variables are lvalues and appear on the left side of the assignment.\n\
    \nWhen you declare a variable, you’ll use the keyword *var* .\n\n## Operators\n\
    \nMost programming languages have *operators* , which are built-in symbols that\
    \ perform a variety of mathematical or logical operations. Go has three types:\
    \ bitwise, arithmetic, and logical.\n\n*   Bitwise\n\nThese operators work on\
    \ variables of the same bit length (that are integers).\n\n*   AND: &\n\n*   OR:\
    \ ⎸\n\n*   XOR and COMPLEMENT: ⌃\n\n*   CLEAR: &⌃\n\n*   Arithmetic\n\nYou’re\
    \ probably familiar with these operations from math class. They include “+” for\
    \ addition, “\\*” for multiplication, “/” for division, and “%” for percentage.\n\
    \n*   Logical\n\nWhile these operators are similar to the ones in other languages,\
    \ Golang is strict about the values that can be compared to each other.\n\n* \
    \  Equal: =\n\n*   Not equal: !=\n\n*   Less than: <\n\n*   Less than or equal\
    \ to: <=\n\n*   Greater than: >\n\n*   Greater than or equal to: >=\n\n## Strings\n\
    \nIn this language, strings are a bit different from the way they work in C++,\
    \ Python, Java, etc. They’re immutable, or read-only. If you try to change a string,\
    \ you’ll get an error. The characters represent bytes that are UTF-8 encoded.\n\
    \nWhy does the UTF-8 encoding matter? When computers were first designed, they\
    \ used bytes of 8 bits in binary code, and every letter of the English alphabet\
    \ had its byte. (This is known as the ASCII format.) There are 256 ways to use\
    \ binary for coding, and the English alphabet plus symbols only required 128.\n\
    \nHowever, once speakers of other languages wanted to program, having only 128\
    \ unique bytes left became a problem. Enter Unicode, which gives each character\
    \ a code point. It’s able to generate about a million code points, which is enough\
    \ for the planet—for now, anyway!\n\nUTF-8, or Unicode Transformation Format,\
    \ translates code points into binary and vice versa. Due to the utility of UTF-8,\
    \ you can use any language in your strings.\n\nTypically, strings are set off\
    \ with double quotes (“) at the beginning and end of the string. Check out this\
    \ example:\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> func main (){\n\
    \n> \n\n> var my\\_words string //using the keyword *var* here\n\n> \n\n> my\\\
    _words = “Hello world”\n\n> \n\n> //displaying the string\n\n> \n\n> fmt.println(“String:\
    \ “, my\\_words)\n\n> \n\n> }\n\n> \n\n> Output: Hello world\n\nSometimes, instead\
    \ of using the double quotes, strings use backticks (\\`). This is common when\
    \ writing in HTML, when writing a message that takes multiple lines, and when\
    \ writing regular expressions.\n\n## Times and Dates\n\nIn Go, times include a\
    \ location that determines the date and time associated with that location. If\
    \ it’s not specified, the time defaults to UTC or Coordinated Universal Time,\
    \ which is used across the world.\n\nIf you want a timestamp, Time.Now, the signature\
    \ is:\n\n> func Now() time\n\nFor the date and time, Time.Date, the signature\
    \ is in the format yyyy-mm-dd hh-mm-ss + nanoseconds:\n\n> func Date (year int,\
    \ month, day, hour, min, sec, nsec int, loc\\*Location)\n\nIn Go, the duration\
    \ is what’s elapsed in nanoseconds between two instants, written in int64nanosecond\
    \ count. Remember that 1 second is equal to 1,000,000,000 nanoseconds. The function\
    \ for the duration is:\n\n> func Since(t Time) duration.\n\nIf you want to know\
    \ how long until time t, the function is:\n\n> func Until(t Time) duration.\n\n\
    Unlike other languages like Ruby, Golang formats the date and time placeholders\
    \ to look like date and time, so it’s not as difficult to remember and you don’t\
    \ have to look them up.\n\n## Chapter Summary\n\nGolang is similar to other languages,\
    \ but if you program in Java, C++, or Python, it’s important to remember what\
    \ Go does differently.\n\n*   The “vocabulary” of Go is designed to be easily\
    \ readable and clear.\n\n*   Syntax rules for filenames, identifiers, variables,\
    \ constants, and keywords may share similarities with other programs.\n\n*   Go\
    \ contains a variety of data types, and constants don’t have to have their types\
    \ specified—in fact, it’s often better to leave them untyped.\n\nIn the next chapter,\
    \ you'll learn about control structures.\n\nThree \n\nIt’s a useful habit to break\
    \ large projects down into smaller steps, be they in school, work, or your day-to-day\
    \ life. This remains true while learning a new programming language, whether or\
    \ not it’s your first.\n\nIn the last chapter, you learned Go’s vocabulary and\
    \ the syntax that it uses. The building blocks of a program are its control structures.\
    \ The computer starts reading line by line, but in some places may need to jump\
    \ to a different function or repeat one. Control structures allow the program\
    \ to determine where to go next or which path to follow. They analyze the variables\
    \ and figure out where to go based on the given parameters.\n\nThere are two main\
    \ variations of control structures in programming: conditionals (AKA selection)\
    \ and loops (AKA iterations). *Conditionals* tell the program what to do if a\
    \ certain condition is met, while *loops* are instructions to repeat the statement\
    \ a specified number of times, or until a condition is met.\n\n## If-Else\n\n\
    A simple *if statement* will execute if the condition is true. If it’s false,\
    \ nothing happens. If statements are written like so:\n\n> If condition {\n\n\
    > \n\n> //code that will be executed if the condition is true\n\n> \n\n> }"
