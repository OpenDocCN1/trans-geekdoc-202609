    ## Goroutine 之间的同步与切换


    Go 提供了多种方法来同步协程，以避免错误并确保计算正确完成。既然你已经熟悉了我们在第八章讨论的方法，让我们进一步详细介绍。


    ### Waitgroup


    这通常用于你有一个协程在等待其他协程执行完成的情况。你可能还记得 `WaitGroup` 维护一个内部计数器，其默认值为 0。`WaitGroup` 有三个方法：`Add(delta
    int)`、`Done()` 和 `Wait()`。


    某些 `WaitGroup` 值是可寻址的。可寻址值是指指针间接、变量、切片索引操作（尽管切片本身不需要可寻址）、结构体字段、数组索引操作（必须可寻址）或复合字面量类型。


    对于任何这些可寻址的 `WaitGroup` 值 `wg`，调用 `wg.Add(delta int)` 来更改 `wg` 维护的计数器值，并注意 `wg.Done()`
    等于 `wg.Add(-1)`。如果调用 `wg.Add(delta int)` 或 `wg.Done()` 导致 `wg` 的计数变为负数，则会导致 panic。当你调用
    `wg.Wait()` 且计数器已为 0 时，它相当于无操作。否则，当计数器为正时，调用 `wg.Wait()` 意味着协程进入阻塞状态，并在另一个协程将计数器改为
    0（通常通过调用 `wg.Done()`）后恢复运行。


    ### Once


    使用此函数确保代码在程序运行期间只执行一次。作为提醒，`sync.Once` 值有一个 `Do(f func())` 方法，它接受一个类型为 `func()`
    的参数。

    '
