    \ a slice with a `new` keyword. Follow the keyword with the capacity, then the\
    \ type of elements in the slice:\n\n```go\nvar intSlice = new([50]int)[0:10] //\
    \ keyword is new, with capacity 50 and length 10\n```\n\nSlices can be formed\
    \ by slicing through an array, but also from another slice. It’s specified by\
    \ a half-open range, which includes the first value but not the end value, of\
    \ two indices that are separated by a colon. You can think of it as `[low: high]`.\
    \ The default low is the 0th value, and high is the length of the slice.\n\nAs\
    \ an example, the expression `b[1:4]` will create a slice of `b` containing elements\
    \ 1–3.\n\nSuppose you have a slice `b := []byte{'q', 'j', 'x', 'z', 'q'}`:\n\n\
    ```go\nb[1:4] == []byte{'j', 'x', 'z'} // remembering that the first element is\
    \ 0, not 1 and that the first element in the range is included but not the last\
    \ one\n```\n\nLet’s look at another example with array `a` and a variety of slices:\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main () {\n    a :=[5]string{\"\
