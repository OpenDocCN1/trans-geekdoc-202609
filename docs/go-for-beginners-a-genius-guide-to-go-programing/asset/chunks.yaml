- raw: "An addressable Once value o contains the method call o.Do(), which can be\
    \ executed concurrently in multiple routines. The arguments in the calls are best\
    \ used with the same function value, although that’s not a code requirement.\n\
    \nJust one argument function results from the o.Do() method, and it will always\
    \ exit before any o.Do() method returns.\n\n*   Cond\n\nUse sync.Cond to make\
    \ notifications among goroutines. It’s often used when you have a goroutine that\
    \ waits for changes of a condition, and other goroutines make the change and send\
    \ notifications.\n\n*   Mutex/RWMutex\n\nBoth of these use Lock and Unlock to\
    \ prevent more than one user from accessing the same piece of data at the same\
    \ time. Locks are not bound to goroutines, so a lock can be locked in one goroutine\
    \ and unlocked in a different goroutine at a different time.\n\nRWMutex comes\
    \ in handy when you want to slice a write program into several. Both Mutex and\
    \ RWMutex can also be used to notify routines, although they’re not the best tool\
    \ for the job (sync.Cond is preferred).\n\nFor an addressable RWMutex value rwm,\
    \ keep in mind that the write lock can be held by only one writer at a time, and\
    \ the read lock and the write lock can’t be held at the same time. However, the\
    \ read lock can be held by more than one reader at a time. When its lock count\
    \ returns to zero, it unlocks.\n\n## Channels\n\nOne way to visualize channels\
    \ is to think of them as pipes that connect concurrent goroutines. It enables\
    \ you to send values into the channel of one goroutine and receive them into another.\
    \ Each channel can send only one type of data. A nil channel is useless because\
    \ you can’t read to or send from it, so you’ll need to use the function *make*\
    \ to create a channel.\n\nBy default, a channel is a pointer. Usually, you pass\
    \ the channel as an argument to the function or method. When a channel receives\
    \ the argument, there’s no need to dereference it to use the data.\n\nWhen creating\
    \ channel c, the syntax is simple. The arrow points from data to channel c, so\
    \ you’re pushing the data to the channel:\n\n> c <- data\n\nWhen you want to read\
    \ data from channel c, you just reverse the location of c as shown:\n\n> <- c\n\
    \nIf you want to use variable data to hold what’s coming from the channel, you\
    \ could use the following syntax:\n\n> var data int\n\n> \n\n> data = <- c\n\n\
    Or you can use its equivalent:\n\n> data := <- c\n\nEither way, channel operations\
    \ block by nature. When data is written to channel c, a goroutine is blocked until\
    \ another goroutine reads it. However, a channel won’t block forever, because\
    \ the channel operations tell the scheduler to schedule another goroutine.\n\n\
    Here’s a quick example of a channel:\n\n> package main\n\n> \n\n> import “fmt”\n\
    \n> \n\n> //declare salute function which accepts the channel c string data\n\n\
    > \n\n> func salute(c chan string) {\n\n> \n\n> fmt.Println(“Hello” + <-c + “!”)\n\
    \n> \n\n> }\n\n> \n\n> func main() {\n\n> \n\n> //main function first goroutine\n\
    \n> \n\n> fmt.Println(“Main() started”)\n\n> \n\n> //using make to create channel\
    \ c of string type\n\n> \n\n> c := make(chan string)\n\n> \n\n> //use keyword\
    \ go to create goroutine for passing channel c to the salute function\n\n> \n\n\
    > go salute(c)\n\n> \n\n> //pushing string value “Jane” to channel c\n\n> \n\n\
    > c<- “Jane”\n\n> \n\n> //goroutine is blocked until another goroutine reads it\n\
    \n> \n\n> //activate main goroutine\n\n> \n\n> fmt.Println(“Main() stopped”)\n\
    \n> \n\n> }\n\nYou’d end up with results that look like this:\n\n> *Main() started*\n\
    \n> \n\n> *Hello Jane!*\n\n> \n\n> *Main() stopped*\n\nWhen a channel is read\
    \ or written to, that goroutine is blocked and control gets passed to other available\
    \ goroutines. If, however, there are no other goroutines available, you get *deadlock*\
    \ and a program crash.\n\nSuppose you’re trying to read data from a channel that\
    \ doesn’t have a value in it. The current goroutine is blocked and another will\
    \ be unlocked in case it can push a value to the channel. That read operation\
    \ is blocking. Similarly, when you send data to a channel, the goroutine blocks\
    \ it and unblocks others until the data is read, where the write operation is\
    \ blocking.\n\nWhen you want to close the channel so no more data can be transported\
    \ through it, use the built-in *close* function. Closing the channel will not\
    \ block the goroutine. The syntax here is pretty simple:\n\n> close(channel)\n\
    \nYou don’t need to check if the channel is closed if you use the for range loop,\
    \ which will automatically close when the channel closes.\n\n> package main\n\n\
    > \n\n> import “fmt”\n\n> \n\n> func squares(c chan int) {\n\n> \n\n> for i:=\
    \ 0; i <=9; i++ {\n\n> \n\n> c <- i\\*i\n\n> \n\n> }\n\n> \n\n> //close channel\n\
    \n> \n\n> close(c)\n\n> \n\n> }\n\n> \n\n> func main() {\n\n> \n\n> fmt.Println(“Main()\
    \ started”)\n\n> \n\n> c := make(chan int)\n\n> \n\n> //start goroutine\n\n> \n\
    \n> go squares(c)\n\n> \n\n> //blocks and unlocks main goroutine until channel\
    \ closes\n\n> \n\n> //for range reads the values one at a time until closed\n\n\
    > \n\n> for val:= range c {\n\n> \n\n> fmt.Println(val)\n\n> \n\n> }\n\n> \n\n\
    > fmt.Println(“Main() stopped”)\n\n> \n\n> }\n\nYour results would look like this:\n\
    \n> *Main() started*\n\n> \n\n> *0*\n\n> \n\n> *1*\n\n> \n\n> *4*\n\n> \n\n> *9*\n\
    \n> \n\n> *16*\n\n> \n\n> *25*\n\n> \n\n> *36*\n\n> \n\n> *49*\n\n> \n\n> *64*\n\
    \n> \n\n> *81*\n\n> \n\n> *Main() stopped*\n\n## Semaphore Pattern\n\nIn addition\
    \ to channels, goroutines, and mutexes, there’s yet another way that you can synchronize\
    \ in Go to make sure that the program is fast and everything’s done at the right\
    \ time. Semaphores are a construct that allows control over access to a shared\
    \ resource when multiple goroutines are in use.\n\nYou’ve seen them in use in\
    \ the real world. When you go to the grocery store, there are lines for the cashiers.\
    \ Otherwise, if the mob of shoppers after work on Friday descended on the cash\
    \ registers, the result would be messy and incorrect, since some shoppers would\
    \ end up with items they hadn’t bought and missing ones they had due to the chaos.\
    \ A supermarket could easily have 10 open lanes with 10 cashiers ready to ring\
    \ up the next shopper. (For our purposes, ignore the bagger and self-checkout\
    \ lanes.)\n\nYou can think of this system, with 10 lines feeding 10 cash registers,\
    \ like a semaphore that allows 10 shoppers to be accommodated in parallel. Also\
    \ note that whatever the behavior in line—if people try to jump in front of another,\
    \ or leave their cart in place while they run to the bathroom—only 10 shoppers\
    \ can be cashed out at once. If there are 10 cash registers in the store, then\
    \ the system only allows for 10 purchases to run in parallel.\n\nIn the programming\
    \ world, you’ve probably run across a shared resource such as a remote server.\
    \ If it were to be bombarded with 10,000 jobs at once, it wouldn’t work as well\
    \ (and potentially not at all.) When you use a mutex to constrain access to a\
    \ goroutine, it only allows one goroutine to access the shared resource, which\
    \ avoids the problem of data races.\n\nSimilarly, a *semaphore* (which is found\
    \ in the *sync* package) allows no more than a certain number N of goroutines\
    \ to access the resource. You’re able to constrain access to protect the resource\
    \ from overuse. Of course, this only works if all the goroutines play by the semaphore\
    \ rules. That’s why many coders put an API in front of the semaphore to ensure\
    \ that it’s the only conduit in. If you want to allow open access and set N equal\
    \ to a million, there’s no reason to use a semaphore. It’s not always obvious\
    \ what N is for a given resource, and you might have to bombard it to discover\
    \ the optimal N value.\n\nAs an example, suppose you have a function that deletes\
    \ an employee over the company’s network, and you use a simple for-range to use\
    \ it on the variable named employeeList. If your company’s got 15 or 50 employees,\
    \ that’s probably fine.\n\nBut what if you’re writing code for a global company\
    \ that employs hundreds of thousands of people? Or what if you wrote the code\
    \ when there were 50 people, and years later it’s grown rapidly? Tens of thousands\
    \ of calls could potentially hit the server concurrently. Instead, you could use\
    \ a *bounded channel* with the semaphore as shown below."
  fmt: "\nAn addressable Once value `o` contains the method call `o.Do()`, which can\
