    \ 部分只在必要时才会执行；如果条件为真，其余部分将被忽略。\n\nIf-else 语句可以有多个 `else` 或备选语句。在 Go 中，它们被称为 `if-else\
    \ if-else`语句。写法如下：\n\n```go\nIf condition-1 {\n    // 如果 condition-1 为真，将执行的代码\n\
    } else if condition-2 {\n    // 如果 condition-2 为真，将执行的代码\n} else {\n    // 如果两个条件都为假，将执行的代码\n\
    }\n```\n\n在这个示例中，成绩分为优良、通过或不及格。如果 `x >= 90`，则输出为 high-pass。60 是通过与不及格的分界点。\n\n\
    ```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\nfunc main () {\n    x := 95\n\
