- raw: "Another package that you’re already familiar with is *main* . It’s used with\
    \ *commands* , or programs that are intended to be executable. Packages that aren’t\
    \ executable are, well, packages. There are a couple of ways that you can import\
    \ packages into your program. One is as follows:\n\n> import “packagename”\n\n\
    You can import multiple packages for your program in this way:\n\n> import “fmt”\n\
    \n> \n\n> import “math”\n\n> \n\n> import “math/rand” // the package name is the\
    \ last element of the import path, in this case *rand* . It’s a subdirectory inside\
    \ the math package.\n\nYou might choose to use the factored method; either way,\
    \ you’re importing a package for use with your code.\n\n> import (\n\n> \n\n>\
    \ “fmt”\n\n> \n\n> “math”\n\n> \n\n> “math/rand”\n\n> \n\n> )\n\nGo comes with\
    \ plenty of packages that have standard elements in the code, so before you create\
    \ a custom package, check the standard library first. There are also additional\
    \ sub-repositories that may be looser in terms of compatibility compared with\
    \ the standard library.\n\nAs a refresher, the capitalization of a variable, type,\
    \ or function to be exported starts with a capital letter. If it begins with lowercase,\
    \ it will not be visible outside the package that you used it in and can’t be\
    \ exported. When you’re importing a package, only the capitalized elements will\
    \ be brought to your code. For example, if you define MaxInt64 in your code, it\
    \ can then be exported out. If you name it maxInt64, it’s only visible inside\
    \ that package.\n\n## Regexp\n\nShort for *regular expression* , *regexp* is a\
    \ sequence of characters that are used to pattern-match and search and replace\
    \ text. Many computer languages use it, and it’s also the standard package in\
    \ Go for writing regular expressions. You can use regexp for filtering, parsing,\
    \ validating, and extracting information from large amounts of text, such as logs\
    \ or output generated from other programs. It can be used concurrently with goroutines.\
    \ If your search query is complicated, compile a regular expression to create\
    \ a regexp element.\n\nYou can use it to extract text from square brackets \\\
    [\\], pull dates out of a string, extract a hostname or IP address, validate format\
    \ for an email address, replace any non-alphanumeric characters (\\*,&,@, ^, etc.)\
    \ with a dash, split a string whenever a white space is found, and so on.\n\n\
    For example, the regular expression *a . b* matches any string that begins with\
    \ *a* , ends with *b* , and contains any character in between (represented by\
    \ the period.) The function *regexp.MatchString* will check to see if there’s\
    \ a substring that matches *a . b* .\n\n> matched, err := regexp.MatchString(\\\
    `a.b\\`, “aaccbb”)\n\n> \n\n> fmt.Println(matched) //true\n\n> \n\n> fmt.Println(err)\
    \ //nil, because regexp is valid\n\nYou can also check to see if a full string\
    \ (as opposed to a substring) matches a . b. Here, you use ^ to signal the beginning\
    \ of the text or line and $ to anchor the end of it. Likewise, you can check the\
    \ start or the end anchor.\n\n> matched, \\_ := regexp.MatchString(\\`^a.b$\\\
    `, “aaccbb”)\n\n> \n\n> fmt.Println(matched) // false\n\nWhen it comes to more\
    \ complicated queries, it’s best to compile a regular expression to create a regexp\
    \ object. You can do this in one of two ways:\n\n> 1\\. re1, err := regexp.Compile(\\\
    `regexp\\`) // error if regexp invalid\n\n> \n\n> 2\\. re2 := regexp.MustCompile(\\\
    `regexp\\`) //panic if invalid\n\nYou can use regexp *split* to slice a string\
    \ into subslices. Here’s an example that shows the second way (re2) along with\
    \ split. Here, the instructions are to split at the letter *a* into a substring\
    \ according to the integer *n* . If n >0, then it can return n matches.\n\n> a\
    \ := regexp.MustCompile(\\`a\\`) // notice the backticks around a, which is what\
    \ regexp must match to return a value\n\n> \n\n> fmt.Printf(“%q\\\\n”, a.split(“pajama”,\
    \ -1)) // returns \\[ “p” “j” “m” “ “\\]\n\n> \n\n> fmt.Printf(“%q\\\\n”, a.split(“pajama”,\
    \ 0)) // \\[\\] or nil slice\n\n> \n\n> fmt.Printf(“%q\\\\n”, a.split(“pajama”,\
    \ 1)) // \\[“pajama”\\] because we have requested one slice\n\n> \n\n> fmt.Printf(“%q\\\
    \\n”, a.split(“pajama”, 2)) // \\[ “p” “jama”\\] because we requested 2 slices,\
    \ and the split occurs at the first letter *a* ; since n=2 at most it can return\
    \ 2 matches\n\n## Sync\n\nAs we’ve discussed, Go allows multiple goroutines to\
    \ occur simultaneously. Without regulation, goroutines would end up competing\
    \ for data. Channels (which we’ll discuss later) and sync packages are used to\
    \ synchronize simultaneous operations to avoid the issue.\n\nA task that can’t\
    \ be subdivided by the computer is an *atomic operation* ; it’s something the\
    \ computer executes directly from one instruction that can’t be interrupted. An\
    \ operation is also considered atomic if it has multiple lines of code to execute\
    \ but only one write element with data. Many operations are not atomic, and many\
    \ goroutines execute faster or slower than one another, which leads to *data competition*\
    \ or *data contention* . As a result, routines may not execute the same way every\
    \ time because they may be preempted by a faster routine or have another data\
    \ contention issue.\n\nOf course, no programmer wants their code to come out differently\
    \ every time. The point of coding is to get the right answer no matter what else\
    \ may be running. *Thread-safe concurrency* is the goal, where concurrency doesn’t\
    \ generate data competition. *Sync packages* help develop this kind of code.\n\
    \n*   sync.WaitGroup\n\nThis struct waits for a group of goroutines to finish\
    \ executing and blocks control until they’re complete. Each value of sync.WaitGroup\
    \ maintains an internal count with the initial default of zero. In this example,\
    \ the main goroutine waits for 1000 to execute, then unblocks to run:\n\n> import\
    \ “sync”\n\n> \n\n> import “sync/atomic” // provides support for atomic operations,\
    \ which mostly involve int types and include add, subtract, swap, compare and\
    \ swap, store, and load\n\n> \n\n> func add (w \\*sync.WaitGroup, num \\*int32)\
    \ {\n\n> \n\n> defer w.Done()\n\n> \n\n> atomic.AddInt32(num, 1) //replaces \\\
    *num = \\*num +1, which is not an atomic operation and could vary in results when\
    \ run concurrently with another routine\n\n> \n\n> }\n\n> \n\n> func main () {\n\
    \n> \n\n> var n int32 = 0\n\n> \n\n> var wg \\*sync.WaitGroup = new(sync.WaitGroup)\n\
    \n> \n\n> wg.Add(1000)\n\n> \n\n> for i := 0; i < 1000; i = i + 1 { //you recognize\
    \ this as a for loop iteration\n\n> \n\n> go add(wg, &n) //creates 1000 new goroutines\n\
    \n> \n\n> }\n\n> \n\n> wg.Wait()\n\n> \n\n> Println (n) //guarantees that n is\
    \ 1000\n\n> \n\n> }\n\n*   sync.Once\n\nThis operation is used for ensuring that\
    \ the code isn’t used by simultaneous goroutines. Here’s an example, where doIt\
    \ will only be run by one routine.\n\n> var once \\*sync.Once = new(sync.Once)\n\
    \n> \n\n> for i := 0; i < 10; i = i + 1 { //10 goroutines here\n\n> \n\n> go func()\
    \ {\n\n> \n\n> printLn(i) //printLn must be executed before doIt can run\n\n>\
    \ \n\n> Once.do(doIt()) //only executed by one routine\n\n> \n\n> } ()\n\n> \n\
    \n> }\n\n*   sync.Mutex\n\nIf you want to make sure that a variable can only be\
    \ accessed by one goroutine at a time while running concurrently, you need *mutual\
    \ exclusion* to avoid any conflicts. The data structure for this is known as *Mutex*\
    \ .\n\nGo has two methods for this: *Lock* and *Unlock* . While the routine is\
    \ in Lock, no other routine can access it. Unlock is used to allow other routines\
    \ to use the variable once the goroutine is finished.\n\nA Mutex value is commonly\
    \ referred to as a mutex lock. A mutex lock that hasn’t been locked yet is a Mutex\
    \ zero value. If the subroutine is not yet locked, calling m.Lock() will change\
    \ it to locked and calling m.Unlock() results in an exception.\n\nIf the goroutine\
    \ has been locked, m.Lock() is blocked until m.Unlock() is called to release the\
    \ lock.\n\n*   sync.RWMutex\n\nWhile a goroutine is writing and RWMutex is involved,\
    \ the concurrent ones can neither read nor write. In addition to Lock and Unlock,\
    \ RMutex also includes RLock and RUnlock. As a general guide, here’s what each\
    \ method does when locked and unlocked:\n\n> • func(rw \\*RWMutex)Lock() //get\
    \ a write lock\n\n> "
  fmt: "\nAnother package that you’re already familiar with is `main`. It’s used with\
    \ `commands`, or programs that are intended to be executable. Packages that aren’t\
    \ executable are, well, packages. There are a couple of ways that you can import\
    \ packages into your program. One is as follows:\n\n```\nimport \"packagename\"\
    \n```\n\nYou can import multiple packages for your program in this way:\n\n```go\n\
    import \"fmt\"\nimport \"math\"\nimport \"math/rand\" // the package name is the\
    \ last element of the import path, in this case `rand`. It’s a subdirectory inside\
    \ the `math` package.\n```\n\nYou might choose to use the factored method; either\
    \ way, you’re importing a package for use with your code.\n\n```go\nimport (\n\
    \    \"fmt\"\n    \"math\"\n    \"math/rand\"\n)\n```\n\nGo comes with plenty\
    \ of packages that have standard elements in the code, so before you create a\
    \ custom package, check the standard library first. There are also additional\
    \ sub-repositories that may be looser in terms of compatibility compared with\
    \ the standard library.\n\nAs a refresher, the capitalization of a variable, type,\
    \ or function to be exported starts with a capital letter. If it begins with lowercase,\
    \ it will not be visible outside the package that you used it in and can’t be\
    \ exported. When you’re importing a package, only the capitalized elements will\
    \ be brought to your code. For example, if you define `MaxInt64` in your code,\
    \ it can then be exported out. If you name it `maxInt64`, it’s only visible inside\
    \ that package.\n\n## Regexp\n\nShort for `regular expression`, `regexp` is a\
    \ sequence of characters that are used to pattern-match and search and replace\
    \ text. Many computer languages use it, and it’s also the standard package in\
    \ Go for writing regular expressions. You can use `regexp` for filtering, parsing,\
    \ validating, and extracting information from large amounts of text, such as logs\
    \ or output generated from other programs. It can be used concurrently with goroutines.\
    \ If your search query is complicated, compile a regular expression to create\
    \ a `regexp` element.\n\nYou can use it to extract text from square brackets `[]`,\
    \ pull dates out of a string, extract a hostname or IP address, validate format\
    \ for an email address, replace any non-alphanumeric characters (`*`,`&`,`@`,`^`,\
    \ etc.) with a dash, split a string whenever a white space is found, and so on.\n\
    \nFor example, the regular expression `a . b` matches any string that begins with\
    \ `a`, ends with `b`, and contains any character in between (represented by the\
    \ period.) The function `regexp.MatchString` will check to see if there’s a substring\
    \ that matches `a . b`.\n\n```go\nmatched, err := regexp.MatchString(`a.b\",\"\
    aaccbb\")\nfmt.Println(matched) //true\nfmt.Println(err) //nil, because regexp\
    \ is valid\n```\n\nYou can also check to see if a full string (as opposed to a\
    \ substring) matches `a . b`. Here, you use `^` to signal the beginning of the\
    \ text or line and `$` to anchor the end of it. Likewise, you can check the start\
    \ or the end anchor.\n\n```go\nmatched, _ := regexp.MatchString(`^a.b$`, \"aaccbb\"\
    )\nfmt.Println(matched) // false\n```\n\nWhen it comes to more complicated queries,\
    \ it’s best to compile a regular expression to create a `regexp` object. You can\
    \ do this in one of two ways:\n\n1. `re1, err := regexp.Compile(`regexp`)` //\
    \ error if invalid\n2. `re2 := regexp.MustCompile(`regexp`)` //panic if invalid\n\
    \nYou can use `regexp` to slice a string into slices. Here’s an example that shows\
    \ the second way (`re2`) along with split. Here, the instructions are to split\
    \ the letter `a` into a substring according to the integer `n`. If `n > 0`, then\
    \ it can return `n` matches.\n\n```go\na := regexp.MustCompile(`a`)\nfmt.Printf(\"\
    %q\\n\", a.Split(\"pajama\", -1)) // [\"p\" \"j\" \"m\"]\nfmt.Printf(\"%q\\n\"\
    , a.Split(\"pajama\", 0)) // []\nfmt.Printf(\"%q\\n\", a.Split(\"pajama\", 1))\
    \ // [\"pjama\"] because we requested one slice\nfmt.Printf(\"%q\\n\", a.Split(\"\
    pajama\", 2)) // [\"p\" \"jama\"] because we requested 2 slices\nfmt.Printf(\"\
    %q\\n\", a.Split(\"pajama\", 3)) // since n=2 most it can return 2 matches\n```\n\
    \n## Sync\n\nAs we’ve discussed, Go allows multiple goroutines to occur simultaneously.\
    \ Without regulation, goroutines would end up competing for data. Channels (which\
    \ we’ll discuss later) and `sync` packages are used to synchronize simultaneous\
    \ operations to avoid the issue. A task that can’t be subdivided by the computer\
    \ is an `atomic operation`; it’s something the computer executes directly from\
    \ one instruction that can’t be interrupted. An operation is also considered atomic\
    \ if it has multiple lines of code to execute but only one write with data. Many\
    \ operations are not atomic, and many goroutines execute faster or slower than\
    \ another, which leads to `data competition` or `data contention`. Of course,\
    \ no programmer wants their code to come out differently every time. Thread-safe\
    \ concurrency is the goal, where concurrency doesn’t generate competition. `Sync`\
    \ packages help develop this kind of code.\n\n### WaitGroup\n\nThis struct waits\
    \ for a group of goroutines to finish executing and blocks control until they’re\
    \ complete. Each value of `sync.WaitGroup` maintains an internal count with the\
    \ initial default of zero. In this example, the main goroutine waits for 1000\
    \ to execute, then unblocks to run:\n\n```go\nimport \"sync\"\nimport \"sync/atomic\"\
    \ // provides support for atomic operations, which mostly involve int types and\
    \ include add, subtract, compare and swap, store, and load\n\nfunc add(w *sync.WaitGroup,\
    \ num *int32) {\n    defer w.Done()\n    atomic.AddInt32(num, 1) // replaces *num\
    \ = *num +1, which is not an atomic operation and could vary in results when run\
    \ concurrently with another\n}\n\nfunc main () {\n    var n int32 = 0\n    var\
    \ wg *sync.WaitGroup = new(sync.WaitGroup)\n    wg.Add(1000)\n    for i := 0;\
    \ i < 1000; i = i + 1 { // you recognize this as a for loop iteration\n      \
    \  go add(wg, &n) // creates 1000 new goroutines\n    }\n    wg.Wait()\n    fmt.Println(n)\
    \ // guarantees that n is 1000\n}\n```\n\n### Once\n\nThis operation is used for\
    \ ensuring that the code isn’t used by simultaneous goroutines. Here’s an example,\
    \ where `doIt` will only be run by one routine.\n\n```go\nvar once *sync.Once\
    \ = new(sync.Once)\nfor i := 0; i < 10; i = i + 1 { // 10 goroutines here\n  \
    \  go func() {\n        fmt.Println(i) // println must be executed before doIt\
    \ can run\n        once.Do(doIt) // only executed by one routine\n    }()\n}\n\
    ```\n\n### Mutex\n\nIf you want to make sure that a variable can only be accessed\
    \ by one goroutine at a time while running concurrently, you need mutual exclusion\
    \ to avoid any conflicts. The data structure for this is known as `Mutex`.\n\n\
    Go has two methods for this: `Lock` and `Unlock`. While the routine is in `Lock`,\
    \ no other routine can access it. `Unlock` is used to allow other routines to\
    \ use the variable once the goroutine is finished.\n\nA `Mutex` value is commonly\
    \ referred to as a mutex lock. A mutex lock that hasn’t been locked yet is a `Mutex`\
    \ zero value. If the subroutine is not yet locked, calling `m.Lock()` will change\
    \ it to locked and calling `m.Unlock()` results in an exception.\n\nIf the goroutine\
    \ has been locked, `m.Lock()` is blocked until `m.Unlock()` is called to release\
    \ the lock.\n\n### RWMutex\n\nWhile a goroutine is writing and `RWMutex` is involved,\
    \ the concurrent ones can neither read nor write. In addition to `Lock` and `Unlock`,\
    \ `RMutex` also includes `RLock` and `RUnlock`. As a general guide, here’s what\
    \ each method does when locked and unlocked:\n\n```go\n// • func(rw *RWMutex)Lock()\
    \ //get a write lock\n```\n"
  trans: "\n\n你已经熟悉的另一个包是 `main`。它用于 `commands`，即旨在作为可执行程序的程序。不可执行的包，……嗯，它们就是普通的包。你有几种方法可以将包导入到你的程序中。其中一种如下：\n\
    \n```go\nimport \"packagename\"\n```\n\n你可以通过这种方式为你的程序导入多个包：\n\n```go\nimport\
    \ \"fmt\"\nimport \"math\"\nimport \"math/rand\" // 包名是导入路径的最后一个元素，在本例中为 `rand`。它是\
    \ `math` 包内部的一个子目录。\n```\n\n你可能会选择使用分组方法（factored method）；无论哪种方式，你都是在导入一个包供你的代码使用。\n\
    \n```go\nimport (\n    \"fmt\"\n    \"math\"\n    \"math/rand\"\n)\n```\n\nGo\
    \ 提供了许多代码中包含标准元素的包，因此在创建自定义包之前，请先检查标准库。还有额外的子仓库，它们在兼容性方面可能比标准库更宽松。\n\n作为复习，要导出的变量、类型或函数的首字母必须大写。如果以小写字母开头，它在使用的包外部将不可见，且无法导出。当你导入一个包时，只有大写开头的元素会被引入你的代码中。例如，如果你在代码中定义了\
    \ `MaxInt64`，它就可以被导出。如果你将其命名为 `maxInt64`，它就只在该包内部可见。\n\n## Regexp\n\n`regexp`\
    \ 是 `regular expression`（正则表达式）的缩写，是一种用于模式匹配、搜索和替换文本的字符序列。许多计算机语言都使用它，它也是 Go 中编写正则表达式的标准包。你可以使用\
    \ `regexp` 对大量文本（如日志或其他程序生成的输出）进行过滤、解析、验证和信息提取。它可以与 goroutines 并发地使用。如果你的搜索查询非常复杂，可以编译一个正则表达式来创建一个\
    \ `regexp` 元素。\n\n你可以用它来从方括号 `[]` 中提取文本、从字符串中提取日期、提取主机名或 IP 地址、验证电子邮件地址格式、将任何非字母数字字符（`*``,`&``,`@`,`^`\
    \ 等）替换为连字符、每遇到空格时就分割字符串等。\n\n例如，正则表达式 `a . b` 匹配任何以 `a` 开头、以 `b` 结尾且中间包含任何字符（由点\
    \ `.` 表示）的字符串。`regexp.MatchString` 函数将检查是否存在匹配 `a . b` 的子字符串。\n\n```go\nmatched,\
    \ err := regexp.MatchString(`a.b\",\"aaccbb\")\nfmt.Println(matched) //true\n\
    fmt.Println(err) //nil, 因为 regexp 是有效的\n```\n\n你也可以检查一个完整字符串（而不是子字符串）是否匹配 `a .\
    \ b`。在这里，你使用 `^` 来标记文本或行的开头，并使用 `$` 来锚定其结尾。同样，你也可以检查开头或结尾锚点。\n\n```go\nmatched,\
    \ _ := regexp.MatchString(`^a.b$`, \"aaccbb\")\nfmt.Println(matched) // false\n\
    ```\n\n对于更复杂的查询，最好编译正则表达式来创建一个 `regexp` 对象。你可以通过以下两种方式之一实现：\n\n1. `re1, err :=\
    \ regexp.Compile(`regexp`)` // 如果无效则报错\n2. `re2 := regexp.MustCompile(`regexp`)`\
    \ // 如果无效则 panic\n\n你可以使用 `regexp` 将字符串切分为切片。这里有一个展示了第二种方法（`re2`）以及分割的示例。在这里，指令是根据整数\
    \ `n` 将字母 `a` 分割为子字符串。如果 `n > 0`，则执行。\n\n```go\nre2 := regexp.MustCompile(`a`)\n\
    parts := re2.Split(\"banana\", -1)\nfmt.Println(parts) // [b n n n]\n```\n"
