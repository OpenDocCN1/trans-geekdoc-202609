- raw: "With *recursive functions* , the function calls itself repeatedly, getting\
    \ smaller and smaller until it finally meets its *base case* (AKA base condition).\
    \ At that point, it’s finally converged and stops further calls. There are two\
    \ ways of recursion: directly, where no other function is called, or indirectly,\
    \ which requires another function to assist.\n\nThere are three other types of\
    \ recursions that you might run into or want to use as a programmer. If there\
    \ are only two functions, it’s known as *mutual recursion* . Tail recursion involves\
    \ a *tail call* , which is the last call of the function. If the last or tail\
    \ call calls back to the function, it’s referred to as *tail-recursive* . Similarly,\
    \ *head-recursive* refers to a function where the first statement is a recursive\
    \ call.\n\n1\\. Direct example\n\nHere’s a sample where the recursive function\
    \ is used to calculate the factorial of a positive number. You may (or may not)\
    \ recall from math class that a factorial is indicated by a number followed by\
    \ an exclamation point (like 4!) and is equal to all the numbers leading up to\
    \ it multiplied together. In other words, 4! = 4\\*3\\*2\\*1 = 24.\n\nHere, the\
    \ base case is either 0 or 1 (where the result is 1). In this example, the function\
    \ decreases by one integer until the base case is reached, at which point the\
    \ function stops. Negative numbers return an error message.\n\n> package main\n\
    \n> \n\n> import (\n\n> \n\n> “fmt”\n\n> \n\n> )\n\n> \n\n> func factorial\\_calc(number\
    \ int) int {\n\n> \n\n> if number == 0 ll number ==1 { // base case\n\n> \n\n\
    > return 1\n\n> \n\n> }\n\n> \n\n> if number < 0 { //if number is negative\n\n\
    > \n\n> fmt.Println(“Invalid Number”)\n\n> \n\n> return -1\n\n> \n\n> }\n\n> \n\
    \n> return number\\*factorial\\_calc(number-1) // recursive function until operation\
    \ reaches the base case\n\n> \n\n> }\n\n> \n\n> func main() {\n\n> \n\n> answer1\
    \ := factorial\\_calc(0) //where 0 is the parameter to be passed\n\n> \n\n> fmt.Println(answer1,\
    \ “\\\\n”)\n\n> \n\n> answer2 := factorial\\_calc(4)\n\n> \n\n> fmt.Println(answer2,\
    \ “\\\\n”)\n\n> \n\n> answer3 := factorial\\_calc(-1)\n\n> \n\n> fmt.Println(answer3,\
    \ “\\\\n”)\n\n> \n\n> answer4 := factorial\\_calc(5)\n\n> \n\n> fmt.Println(answer4,\
    \ “\\\\n”)\n\n> \n\n> }\n\nThe output for this example looks like this:\n\n> *0*\n\
    \n> \n\n> *24*\n\n> \n\n> *Invalid number*\n\n> \n\n> *\\-1*\n\n> \n\n> *120*\n\
    \n2\\. Indirect example\n\nHere you’ll see what it looks like when you use another\
    \ function for recursion. Suppose you wanted to print all the numbers in order,\
    \ decreasing from n.\n\n> package main\n\n> \n\n> import (\n\n> \n\n> “fmt”\n\n\
    > \n\n> )\n\n> \n\n> func print\\_one (n int){\n\n> \n\n> if n > =0 {\n\n> \n\n\
    > fmt.Println(“In first function: ,” n)\n\n> \n\n> print\\_two(n-1) //prints n\
    \ if n is a positive integer and calls the second function\n\n> \n\n> }\n\n> \n\
    \n> }\n\n> \n\n> func print\\_two (n int){\n\n> \n\n> if n > = 0 {\n\n> \n\n>\
    \ fmt.Println(“In second function: ,” n)\n\n> \n\n> print\\_one(n-1)\n\n> \n\n\
    > }\n\n> \n\n> }\n\n> \n\n> func main() {\n\n> \n\n> print\\_one(6) //prints all\
    \ positive integers from 1 up to 6\n\n> \n\n> print\\_one(-10) //prints nothing\
    \ because it doesn’t follow the base case n >= 0\n\n> \n\n> }\n\nThe output you’ll\
    \ see:\n\n> *In first function: 6*\n\n> \n\n> *In second function: 5*\n\n> \n\n\
    > *In first function: 4*\n\n> \n\n> *In second function: 3*\n\n> \n\n> *In first\
    \ function: 2*\n\n> \n\n> *In second function: 1*\n\n> \n\n> *In first function:\
    \ 0*\n\nWhat you want to avoid is *infinite recursion* , where the function never\
    \ converges. Normally, something like this will result in either a system crash\
    \ or memory overload. If you don’t specify a base case and launch a recursive\
    \ call, you’ll end up with infinite recursion.\n\nGolang also lets you use *anonymous*\
    \ functions, which don’t have a name. You can also use these for recursion. You’ll\
    \ need to tell the program what the anonymous function is.\n\n## Higher-Order\
    \ Functions\n\nThese types of functions operate on other functions, either receiving\
    \ one as an argument or returning one as output. Here are a couple of simple high-order\
    \ functions to give you the idea.\n\n1\\. Passing as argument\n\nThe example uses\
    \ the partialSum function to return the sum function.\n\n> package main\n\n> \n\
    \n> import “fmt”\n\n> \n\n> func sum(a, b int) int{\n\n> \n\n> return a + b\n\n\
    > \n\n> }\n\n> \n\n> func partialSum(a int) func (int) int {\n\n> \n\n> return\
    \ func(b int) int {\n\n> \n\n> return (a, b)\n\n> \n\n> }\n\n> \n\n> }\n\n> \n\
    \n> func main () {\n\n> \n\n> partial := partialSum(2)\n\n> \n\n> fmt.Println(partial(5))\n\
    \n> \n\n> }\n\nOutput: 7\n\n2\\. Returning as output\n\nIn this example, the squareSum\
    \ function returns two functions and an integer.\n\n> package main\n\n> \n\n>\
    \ import “fmt”\n\n> \n\n> func squareSum(a int) func (int) func (int) int {\n\n\
    > \n\n> return func(b int) func (int) int {\n\n> \n\n> return func (c int) int\
    \ {\n\n> \n\n> return a\\*a + b\\*b + c\\*c\n\n> \n\n> }\n\n> \n\n> }\n\n> \n\n\
    > }\n\n> \n\n> func main () {\n\n> \n\n> fmt.Println(squareSum(5)(6)(7)) // will\
    \ equal 5\\*5 + 6\\*6 + 7\\*7\n\n> \n\n> }\n\nOutput: 110\n\n## Closures\n\n*Closures*\
    \ are function values that reference variables from outside the function’s body;\
    \ they’re used as anonymous functions. They’re useful for *data isolation* , where\
    \ the variable may be referenced in the anonymous function but the data isn’t\
    \ available for other code.\n\nClosures allow developers to associate data with\
    \ the functions that operate on that specific data.\n\n## Chapter Summary\n\n\
    Golang includes a variety of functions that you can use for programming different\
    \ operations.\n\n*   Some functions are built-ins, but developers can customize\
    \ them as well.\n\n*   Go allows the creation of anonymous functions.\n\n*   You\
    \ can use recursive functions too, but make sure that there’s a base case for\
    \ the function to eventually converge, or you could end up with memory overload\
    \ and/or a system crash.\n\nIn the next chapter, you'll learn the details of slices\
    \ and arrays.\n\nFive \n\nIn the last chapter, you got a very brief introduction\
    \ to slices and arrays in Go. They can be very useful for developers and programmers,\
    \ so let’s dive in and get to know them a bit better.\n\nArrays are frequently\
    \ used to collect variables of the same type. They save memory, which can be allocated\
    \ at runtime when necessary. Because the values are literally near each other,\
    \ arrays speed up the code. They’re also relatively easy to debug since you can\
    \ use indices instead of looking over the entire collection.\n\nDevelopers can\
    \ use arrays over and over again, so there’s less time spent repeating code. In\
    \ other words, they help you code faster. Zero-length arrays act like pointers,\
    \ so they don’t use up a lot of memory. Slices are an easy way in Go to work with\
    \ these collections, so you’ll find more examples of slices than of the arrays\
    \ themselves.\n\n## Arrays\n\nSlice types are built on top of arrays in Go, so\
    \ it’s worth understanding how arrays work in this language before moving on to\
    \ slices. The definition of an *array type* includes both a length and a type\
    \ of element.\n\nSuppose you have an array type of \\[3\\]int. That’s an array\
    \ of 3 (length) and type int. The size is fixed so that the two arrays \\[3\\\
    ]int and 4\\[int\\] are different and incompatible with each other. You can index\
    \ arrays just as in other languages; s\\[n\\] indexes the nth value of the array,\
    \ starting with 0.\n\nArrays don’t have to be initialized because the zero value\
    \ has elements already equal to zero. Go is different from C in that the pointer\
    \ to an array points to the entire array itself, rather than to the first element\
    \ (as is the case with C.)\n\nThere are a couple of different ways to specify\
    \ array b as \\[2\\]string. You can be specific…\n\n> b := \\[2\\]string{“Apples”,\
    \ “Oranges”}\n\nOr you can let the compiler figure it out:\n\n> b := \\[...\\\
    ]string{“Apples”, “Oranges”}\n\nArrays aren’t used as often in Golang because\
    \ they’re relatively inflexible. Instead, programmers use slices.\n\n## Slices\n\
    \nSlices are used to create and manage data collections. They serve as the descriptor\
    \ of an array segment and they contain a pointer to the array, its length, and\
    \ capacity. The *capacity* is the maximum length of that segment."
