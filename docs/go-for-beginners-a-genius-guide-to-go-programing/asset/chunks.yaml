- raw: "Once you go get it, Go installs it under $GOPATH/src as repository.com/username/packagename.\
    \ Now you’ve got the package sitting locally, but you still need to import it\
    \ into your program. Use the usual import function:\n\n> import “repository.com/username/packagename”\n\
    \n## External Packages, Libraries, and Projects\n\nIn the previous section, you\
    \ learned that Go can pull packages from anywhere on the web that supports the\
    \ language and uses a compatible VCS. There are also standard libraries (stdlib)\
    \ that live inside your $GOROOT directory, and these you don’t need to go get\
    \ or install.\n\nIf you’re importing a package that you’ve already defined in\
    \ your program, use a relative path (which doesn’t contain any references to outside\
    \ URLs). Name the directory that your program is in and the directory inside that\
    \ with the package you want.\n\n> import “myprogram/mostexcellentpackage”\n\n\
    But suppose you want to use a package that you saved to a third-party repository\
    \ like GitHub. You’ll need to go get it and import it as described above, the\
    \ same way that you’d import someone else’s package.\n\nProjects are a great way\
    \ to learn code. Tutorials that show you how to take steps are the building blocks,\
    \ but taking on projects helps you implement what you’ve learned. Projects can\
    \ be building a website, creating an app, redesigning a website template, or anything\
    \ else you come up with.\n\nWhen you’re thinking about your packages, consider\
    \ the following ideas to guide you in structuring everything. Since Go is intended\
    \ to be open-source, simplicity and ease of use are two key principles to follow\
    \ in your projects.\n\n*   Consistency\n\nYour code should have a consistent look\
    \ and feel to it, using the same conventions in all your packages and projects.\n\
    \n*   Simplicity\n\nIt should be simple enough to be easy to read and use, but\
    \ not so simple that steps or important information are left out.\n\n*   Ease\
    \ of navigation\n\nMake it clear how to move around the structures you have in\
    \ place. This will help both you and other users. Use obvious naming conventions\
    \ so you won’t have to try to figure out what’s in any folder or directory.\n\n\
    For small projects, it’s enough to keep all your code in one folder, but as you\
    \ develop larger ones this often becomes problematic. Additional conventional\
    \ folders include:\n\n*   /cmd\n\nContains the entrypoint files (executables).\n\
    \n*   /internal\n\nHolds private library code and is specific to the service without\
    \ being shared with any others.\n\n*   /pkg\n\nContains files that you’re OK to\
    \ share with other users.\n\n## Chapter Summary\n\nPackages in Go allow programmers\
    \ to reuse code easily without copying and pasting or remembering where a piece\
    \ of code is. Importing a package brings all of the information in that file to\
    \ the current program.\n\n*   The standard library is extensive and comes with\
    \ many commonly used items.\n\n*   Writing regular expressions with the regexp\
    \ package saves time.\n\n*   Sync package helps concurrent goroutines avoid data\
    \ competition, which creates undesired problems and results.\n\n*   You’ll need\
    \ a package to ensure that the program runs accurate computations since there\
    \ are times when 64 bits is not long enough to hold the data.\n\n*   Although\
    \ there are many standard packages to choose from, you can also create your own\
    \ when necessary.\n\n*   In the interests of open-source, developers should document\
    \ their packages so other users understand the purpose.\n\n*   Since Golang doesn’t\
    \ have a central repository, you may need to import packages from third-party\
    \ version control systems such as Git and Bazaar.\n\n*   External libraries, packages,\
    \ and projects have conventions to follow.\n\nIn the next chapter, you'll learn\
    \ about methods.\n\nNine \n\nBy now, you’ve worked with plenty of functions, but\
    \ you might need to use multiple functions on the same piece of data. No need\
    \ to copy and paste; instead, you can use a *method* that operates on a specific\
    \ type, known as the *receiver* . With methods, you can explain what the data\
    \ type is and how it should be used. In other languages, the receiver is a keyword,\
    \ but Go considers the receiver a variable so you can name it whatever you like.\
    \ The convention is to use lowercase letters for the receiver type.\n\nMethods\
    \ are the only way to implement interfaces, which are in chapter ten. When you\
    \ embed a type, you get access to the relevant method. If you’re using an editor\
    \ that features autocomplete in Go, you can get method suggestions from autocomplete\
    \ rather than referring to your documentation every time. While this isn’t a major\
    \ reason to use methods, it speeds up your process.\n\n## Differences between\
    \ Functions and Methods\n\nThe syntax for a method is very similar to that of\
    \ a function, with an additional parameter to specify the receiver. Calling methods\
    \ is similar to calling functions, using the additional receiver variable.\n\n\
    There are also significant differences. Methods accept a pointer *and* a value,\
    \ while functions can’t. In one program you can have methods with the same name\
    \ and different types, but in a function, you can’t. Methods are linked to the\
    \ type they’re attached to, so they depend on the state, while functions provide\
    \ the same output every time. If your code doesn’t rely on the state, you should\
    \ use a function instead of a method.\n\nLet’s illustrate the differences. In\
    \ the example below, we’re creating a struct called Creature, with string fields\
    \ for Name and Greeting. Here, the method (rather than the function) is Greet;\
    \ note that the variable c is used with the receiver Creature type.\n\n> package\
    \ main\n\n> \n\n> import “fmt”\n\n> \n\n> type Creature struct {\n\n> \n\n> NameString\n\
    \n> \n\n> GreetingString\n\n> \n\n> }\n\n> \n\n> func (c Creature) (Greet) ()\
    \ {\n\n> \n\n> fmt.Printf(“%s says %s”, c,Name, c.Greeting)\n\n> \n\n> }\n\n>\
    \ \n\n> func main () {\n\n> \n\n> sarah := Creature{\n\n> \n\n> Name: “Sarah”,\n\
    \n> \n\n> Greeting:“Hello!”,\n\n> \n\n> }\n\n> \n\n> sarah.Greet()\n\n> \n\n>\
    \ }\n\nYour output then looks like this:\n\n> *Sarah says Hello!*\n\n## Receivers\
    \ and Methods as Pointers and Values\n\nDefining methods on types, as opposed\
    \ to functions on values, has other benefits. In the interfaces chapter, you’ll\
    \ see why methods are helpful when using interfaces in code.\n\nYou can also define\
    \ methods on a pointer receiver. As a developer, you can force users of a package\
    \ to use a specific method by using capitals to begin the method and lowercase\
    \ if it’ll only work in that particular spot. Defining the method on a pointer\
    \ receiver ensures that modification of that type will persist. The pointer acts\
    \ as a reference to the specific type, not to a copy of it. The declaration of\
    \ a pointer receiver is similar to that of the value receiver, but an asterisk\
    \ (\\*) is used as a prefix to denote the pointer:\n\n> package main\n\n> \n\n\
    > import “fmt”\n\n> \n\n> type Boat struct {\n\n> \n\n> Name string\n\n> \n\n\
    > occupants \\[\\] string\n\n> \n\n> }\n\n> \n\n> func (b \\*Boat) AddOccupant(\
    \ name string) \\*Boat {\n\n> \n\n> b.occupants = append(b.occupants, name)\n\n\
    > \n\n> return b\n\n> \n\n> }\n\n> \n\n> func (b Boat) Manifest() {\n\n> \n\n\
    > fmt.Println(“The”, b.Name, “has the following occupants:”)\n\n> \n\n> for \\\
    _, n := range b.occupants {\n\n> \n\n> fmt.Println(“\\\\t”, n)\n\n> \n\n> }\n\n\
    > \n\n> }\n\n> \n\n> func main() {\n\n> \n\n> b := &Boat{\n\n> \n\n> Name: “S.S.\
    \ Powerpuff”,\n\n> \n\n> }\n\n> \n\n> b.AddOccupant(“Sarah the stingray”)\n\n\
    > \n\n> b.AddOccupant(“Mary the mussel”)\n\n> \n\n> b.Manifest()\n\n> \n\n> }\n\
    \nWhen you run it, you’ll get the following:\n\n> *The S.S. Powerpuff has the\
    \ following occupants:*\n\n> \n\n> *Sarah the stingray*\n\n> \n\n> *Mary the mussel*\n\
    \nPointer receivers help allow the method to change the value that the receiver\
    \ points to. They also allow you to avoid copying the value every time you call\
    \ the method, which is great when the receiver is a large struct. They help speed\
    \ up the code and the process.\n\n## Accepting Both Pointer and Value Types"
