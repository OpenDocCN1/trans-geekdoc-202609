    \ also an elementary type.\n\n4\\. Derived types"
  fmt: "\nAlthough handling errors is pretty simple in Go, it may require a lot more\
    \ code than other languages.\n\n### Dependency management\n\nYou can install different\
    \ libraries with Go, but if the maintainer of the library uploads a version that's\
    \ not backward-compatible, then anyone running your app will get an error. If\
    \ the library isn’t installed, the program won’t compile.\n\nWhile there *is*\
    \ a tool to help you manage this (`Dep`), it either forces you to load all the\
    \ dependencies on the repository or store the package list. If you store on the\
    \ repository, your code becomes *much* bigger because you’re also storing lines\
    \ of dependency code. However, if you only store the package list, you may run\
    \ into backward incompatibility issues which will cause your program to crash.\n\
    \n## Who Should Use Go?\n\nThis language is great for the underlying code on apps\
    \ that require speed. It’s also good for high-performance apps that require scalability.\n\
    \nGoogle uses it for its cloud services infrastructure; companies like YouTube,\
    \ Netflix, and Soundcloud use Go for high loads on their platforms; Uber used\
    \ it to improve map processing speeds so it takes less time to match a rider with\
    \ a driver; data science organizations are using it more and more to process big\
    \ data and make sense of it.\n\nGo is a great solution for fintech developers\
    \ because it allows for a smooth connection between users and their financial\
    \ institutions. Paypal has used it for scaling, AmEx for payments, and Salesforce\
    \ for their “Einstein Analytics”. It’s also become the language of choice for\
    \ programming on the blockchain, especially the Ethereum network.\n\nAs you can\
    \ see, Go is a good tool to have for almost any modern programmer. Whether it’s\
    \ for system programming, network programming, web applications, or DevOps, the\
    \ language is easy to use and read. And most importantly for the users of today,\
    \ it’s much faster than many of the other available options.\n\n## Chapter Summary\n\
    \nGo was designed by Google engineers who wanted a faster computer language that\
    \ could take advantage of multiple cores.\n\n*   Because it is a younger language,\
    \ it works well for modern applications that are located on the cloud instead\
    \ of specific hardware and can run operations concurrently.\n\n*   Go is flexible\
    \ and uses `goroutines` that run simultaneously without slowing down the speed,\
    \ among other advantages.\n\n*   Golang’s GUI library is nonexistent, so it’s\
    \ not preferred for apps that rely on GUI in addition to speed, among other disadvantages.\n\
    \n*   Go is applicable in many different types of applications and industries,\
    \ especially for those with high user loads or other big data needs.\n\nIn the\
    \ next chapter, you'll learn about the foundations of Go.\n\n## Two\n\nIn this\
    \ chapter, we’ll delve into the foundations of Golang, which you can think of\
    \ as the basic vocabulary for the language. Some of these you’ll be familiar with\
    \ if you’ve done programming with similar languages such as `C` and `C++`.\n\n\
    ## Identifiers, Filenames, and Keywords\n\nIf you’re relatively new to programming,\
    \ *identifiers* are the names of the program’s components as defined by the users.\
    \ Identifiers in Go may be names of functions, constants, variables, statement\
    \ labels, types, or package names.\n\nGo identifiers must be written in a specific\
    \ way to be recognized by the program. It must start with a letter or underscore,\
    \ not a number. The identifier itself can contain letters, numbers, and underscores.\
    \ It’s case-sensitive, so while `Go_lang` and `go_lang` are different, they’re\
    \ both valid names. Golang identifiers\n\n### Functions\n\nFunctions are blocks\
    \ of code that perform a task. In Go, functions are defined with the following\
    \ syntax:\n\n```\nfunc function_name (parameter list) [return_types] {\n    body\n\
    }\n```\n\nwhere\n\n*   `func` starts the declaration telling the program a function\
    \ is coming\n*   `function_name` names the function\n*   `parameter` is similar\
    \ to a placeholder and gives the type and number of parameters\n*   `return_types`\
    \ is the list of data types the function returns; this isn’t always required\n\
    *   `body` defines what the function does\n\nFor example, suppose you wanted a\
    \ function to show the maximum of two numbers, `num1` and `num2`:\n\n```go\nfunc\
    \ max (num1, num2 int) int {\n    result int //The program ignores anything after\
    \ // so you can type notes here. Note that this is a local variable.\n\n    if\
    \ (num1 > num2) {\n        result = num1\n    } else {\n        result = num2\n\
    \    }\n\n    return result\n}\n```\n\n## Data Types\n\nThe type of a variable\
    \ specifies how much space it occupies and how the bit pattern should be interpreted.\
    \ In Go, you can classify into four categories:\n\n### Boolean\n\nThere are only\
    \ two of these: true and false. *Bool* is one of the four elementary types.\n\n\
    ### Numeric\n\nThese can be either integers or floating-point values. Examples\
    \ of numeric types include `uint8` (unsigned 8-bit integers from 0 to 255), `int16`\
    \ (signed 16-bit integers), and the like for integers.\n\nFloating points can\
    \ be `float32` (IEEE 32-bit floating-point), `float64` (IEEE 64-bit floating-point),\
    \ `complex62` (float32 with real and imaginary parts), or `complex128` (float64\
    \ with real and imaginary.)\n\nBoth *int* and *float* are also elementary types.\n\
    \n### Strings\n\nThese represent the value of the string, which is a sequence\
    \ of bytes. Once created, the string cannot be changed. Strings can be alphanumeric,\
    \ such as in the iconic “helloworld”. A string is also an elementary type.\n\n\
    ### Derived types\n"
  trans: "\n虽然在 Go 中处理错误非常简单，但它可能比其他语言需要更多的代码。\n\n### 依赖管理\n\n你可以使用 Go 安装不同的库，但如果库的维护者上传了一个不向后兼容的版本，任何运行你程序的人都会收到错误。如果没有安装该库，程序将无法编译。\n\
    \n虽然*有*工具可以帮助你管理这一点（`Dep`），但它要么强制你加载存储库中的所有依赖项，要么存储包列表。如果你存储在存储库中，你的代码会变得*大得多*，因为你还存储了许多行依赖代码。然而，如果你只存储包列表，可能会遇到向后不兼容的问题，这会导致你的程序崩溃。\n\
    \n## 谁应该使用 Go？\n\n这种语言非常适合需要速度的应用程序的底层代码。它也适用于需要扩展性的高性能应用。\n\nGoogle 将其用于云服务基础设施；YouTube、Netflix\
    \ 和 Soundcloud 等公司使用 Go 来处理其平台的高负载并发；Uber 使用它来提高地图处理速度，从而缩短了乘客与司机的匹配时间；数据科学组织越来越多地使用它来处理大数据并对其进行分析。\n\
    \nGo 是金融科技开发者的绝佳解决方案，因为它允许用户与其金融机构之间进行无缝连接。Paypal 已使用它进行扩展，AmEx 用于支付，Salesforce\
    \ 用于其“Einstein Analytics”。它也成为区块链编程（尤其是以太坊网络）的首选语言。\n\n如你所见，Go 对于几乎任何现代程序员来说都是一个很好的工具。无论是系统编程、网络编程、Web\
    \ 应用程序还是 DevOps，这种语言都易于使用和阅读。而且对于今天的用户最重要的是，它比许多其他可用选项要快得多。\n\n## 章节总结\n\nGo 由\
    \ Google 的工程师设计，他们希望有一种更快的、能够利用多核的计算机语言。\n\n*   因为是一门较年轻的语言，它非常适用于位于云端而非特定硬件的现代应用程序，并且可以并发运行操作。\n\
    \n*   Go 非常灵活，并使用的 `goroutines` 可以同时运行而不会降低速度，这是它的其他优点之一。\n\n*   Golang 的 GUI\
    \ 库不存在，因此它不被首选除了速度外还依赖 GUI 的应用，这是它的缺点之一。\n\n*   Go 适用于许多不同的应用程序和行业，特别是对于那些具有高用户负载或其他大数据需求的场景。\n\
    \n在下一章中，你将学习 Go 的基础。\n\n## 第二章\n\n在本章中，我们将深入研究 Golang 的基础，你可以将其想象成该语言的基础词汇。如果你用过类似\
    \ `C` 和 `C++` 的语言进行过编程，那么你会对其中一些感到熟悉。\n\n## 标识符、文件名和关键字\n\n如果你对编程还比较陌生，*标识符*是用户定义的程序组件名称。Go\
    \ 中的标识符可以是函数名、常量、变量、语句标签、类型或包名。\n\nGo 标识必须以特定的方式编写才能被程序识别。它必须以字母或下划线开头，而不是数字。标识符本身可以包含字母、数字和下划线。它是区分大小写的，所以虽然\
    \ `Go_lang` 和 `go_lang` 是不同的，但它们都是有效名称。Golang 标识符\n\n### 函数\n\n函数是执行任务的代码块。在 Go\
    \ 中，使用以下语法定义函数：\n\n```\nfunc function_name (parameter list) [return_types] {\n\
    \    body\n}\n```\n\n其中\n\n*   `func` 开始声明，告诉程序有一个函数要登场\n*   `function_name` 为函数命名\n\
    *   `parameter` 类似于占位符，提供了参数的类型和数量\n*   `return_types` 是函数返回的数据类型列表；这并不是强制要求的\n\
    *   `body` 定义了函数的功能\n\n例如，假设你想要一个函数显示两个数字 `num1` 和 `num2` 的最大值：\n\n```go\nfunc\
    \ max (num1, num2 int) int {\n    result int //程序会忽略 // 之后的内容所以你在这里写注释。注意这是一个局部变量。\n\
    \n    if (num1 > num2) {\n        result = num1\n    } else {\n        result\
    \ = num2\n    }\n\n    return result\n}\n```\n\n## 数据类型\n\n变量的类型指定了它所占的空间以及如何解释位模式。在\
    \ Go 中，你可以将其分为四类：\n\n### 布尔类型\n\n只有两个：true 和 false。*Bool* 是四种基本类型之一。\n\n### 数值类型\n\
    \n这些可以是整数或浮点数。数值类型的示例包括 `uint8`（0 到 255 的无符号 8 位整数）、`int16`（符号 16 位整数）以及类似的整数类型。\n\
    \n浮点数可以是 `float32`（IEEE 32 位浮点数）、`float64`（IEEE 64 位浮点数）、`complex62`（带有实部和虚部的\
    \ float32）或 `complex128`（带有实部和虚部的 float64）。\n\n*int* 和 *float* 也是基本类型。\n\n###\
    \ 字符串\n\n这些表示字符串的值，字符串是字节序列。一旦创建，字符串就无法更改。字符串可以是字母数字，例如经典的“helloworld”。字符串也是一种基本类型。\n\
    \n### 派生类型\n\n"
