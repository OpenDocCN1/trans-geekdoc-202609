    Pass\")\n    } else {\n        fmt.println(\"Fail\")\n    }\n}\n```\n\n## Switch-Case\n\
    \nLooking for an easier way to write multiple if-else statements? `switch` is\
    \ a shorter way to write the sequence. It’s similar to the switch you might have\
    \ used in C, C++, or Java. However, in Go, the control switch runs the first case\
    \ where the condition is true and ignores the remainder. `switch` cases don’t\
    \ need to be constants, and the values don’t have to be integers, either. You\
    \ can use commas to separate expressions in the `case` if there is more than one.\
    \ Here’s an example of a `switch case` to tell you whether it’s a weekday or a\
    \ weekend.\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\nfunc main ()\
    \ {\n    switch time.Now().Weekday() {\n    case time.Saturday, time.Sunday:\n\
    \        fmt.Println(\"It’s the weekend\")\n    default:\n        fmt.Println(\"\
    It’s a weekday\")\n    }\n}\n```\n\n## For\n\nA `for loop` is the only looping\
    \ construct in Go. It’s used to repeat statements until the condition is met.\
    \ If there was no condition to be met, or the program can’t meet it, it would\
    \ be in an infinite loop.\n\nTake a simple example, like listing numbers from\
    \ one to ten. Without a loop construct, you’d have to write ten statements:\n\n\
    ```go\nfmt.Println(1)\nfmt.Println(2)\nfmt.Println(3)\nfmt.Println(4)\nfmt.Println(5)\n\
    ... until you got to `fmt.Println(10)`.\n\nWith a `for` loop, you only need to\
    \ write it once.\n\n```go\nx := 1\nfor x <= 10 {\n    fmt.Println(x)\n    x +=\
    \ 1\n}\n```\n\nHere, you’re telling the program to check if `x` is less or equal\
    \ to 10. If so, `x` is printed to the console. Note that if you don’t add `+1`,\
    \ `x` is always 1, and gets printed in an infinite loop. You can also shorten\
    \ the language `for` loop. In this case you would write:\n\n```go\nfor x := 1;\
    \ x <= 10; x++ {\n    fmt.Println(x)\n}\n```\n\nThe first line assigns `x` to\
    \ 1, checks if `x` is less than or equal to 10, and adds 1 case the previous condition\
    \ (`x <= 10`) is true. The second line is the statement to be executed.\n\n##\
    \ For Range\n\nThe `for loop` is used to repeat for a variety of elements in data\
    \ structures, such as arrays, slices, strings, and channels. You’ll learn more\
    \ about those in later chapters. `for range` statement uses the keyword `range`\
    \ to repeat an expression that evaluates an array, slice, map, etc. For the sake\
    \ of this example, let’s suppose you had a slice (don’t worry about that is yet)\
    \ and wanted to add the numbers in it:\n\n```go\nnums := []int{2,3,4}\nsum :=\
    \ 0\nfor _, num := range nums {\n    sum += num\n}\nfmt.Println(\"Sum:\", sum)\
    \ //which would result in the output of sum: 9\n```\n\n## Break and Continue\n\
    \nThese controls help you add logic into your Go program to control the operations.\
    \ The `break statement` ends the current loop and is usually paired with an `if`\
    \ statement. The following program shows how the `break` and a conditional `if`\
    \ statement work together.\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\
    \nfunc main () {\n    for x := 0; x < 10; x++ { // check to see if x is less than\
    \ 10; if so, add 1\n        if x == 5 {\n            fmt.Println(\"Breaking out\
    \ of loop\")\n            break // here’s the command to break when x reaches\
    \ 5\n        }\n        fmt.Println(\"The value of x is\", x) // if there’s no\
    \ break\n    }\n    fmt.Println(\"Exiting program\")\n}\n```\n\nThe output from\
    \ this program reads like this:*The value of x is 0*\n*The value of x is 1*\n\
    *The value of x is 2*\n*The value of x is 3*\n*The value of x is 4*\n*Breaking\
    \ out of loop*\n*Exiting program*\n\nIf you nest loops inside each other, a `break`\
    \ in an inner loop won’t necessarily mean a `break` in the outer loop. Instead\
    \ of breaking a loop, maybe you want to skip the rest of the loop and return to\
    \ the top of it and repeat. That’s what the `continue statement` in Gol is for.\
    \ For example, we could change the program above not to stop and exit when `x\
    \ = 5`, but to skip 5 and keep going until the number 10 is reached:\n\n```go\n\
    package main\n\nimport (\n    \"fmt\"\n)\n\nfunc main () {\n    for x := 0; x\
    \ < 10; x++ {\n        if x == 5 {\n            fmt.Println(\"Continuing loop\"\
    )\n            continue // instead of break when x is 5\n        }\n        fmt.Println(\"\
    The value of x is\", x)\n    }\n    fmt.Println(\"Exiting program\")\n}\n```\n\
    \nNow you’ll get a different result, which continues the loop at 5 instead of\
    \ ending it.\n\n*The value of x is 0*\n*The value of x is 1*\n*The value of x\
    \ is 2*\n*The value of x is 3*\n*The value of x is 4*\n*Continuing loop*\n*The\
    \ value of x is 6*\n*The value of x is 7*\n*The value of x is 8*\n*The value of\
    \ x is 9*\n*Exiting program*\n\nThe `continue statement` is often used where you\
    \ need a loop, but want to eliminate common cases that you don’t want in the program.\
    \ Using `continue` also helps you avoid multiple nests of conditions.\n\n## Labels:\
    \ Goto\n\nLike the `break` and `continue` statements, `goto` alters the execution\
    \ of a program and instructs the computer to `go to` a labeled statement and run\
    \ the program from there. The label is an identifier written in plain text, and\
    \ it can be anywhere in the program above or below the `goto` statement. Like\
    \ `continue` and `break`, `goto` is often used with `if` and `if-else` controls.\n\
    \nIn this example, you get different answers depending on what age you input.\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main () {\n    var age int\n \
    \   election: //this is the label\n    fmt.Println(\"Enter your age \")\n    fmt.Scanln(&age)\
    \ //user enters age\n    if (age <= 17) {\n        fmt.Println(\"You are not eligible\
    \ to vote.\")\n        goto election\n    } else {\n        fmt.Println(\"You\
    \ are eligible to vote.\")\n    }\n}\n```\n\nThe output might look something like\
    \ this:\n\n*Enter your age 16*\n*You are not eligible to vote.*\n*Enter your age\
    \ 17*\n*You are not eligible to vote.*\n*Enter your age 20*\n*You are eligible\
    \ to vote.*\n"
