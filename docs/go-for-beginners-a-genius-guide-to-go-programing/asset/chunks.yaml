    \n在读取时，程序分批读取。`Reader` 类型缓冲了一个 `io.Reader` 对象，而函数 `NewReader` 返回一个——你猜得没错——新的\
    \ `Reader`（带有默认缓冲区大小）。\n\n`os` 包提供了一个贯穿于所有操作系统的标准接口。标准输入（Standard input，通常缩写为\
    \ `stdin`）是程序读取输入信息的流。\n\n这里是一个同时使用 `bufio` 和 `os` 包来读取用户输入的示例：\n\n```go\npackage\
    \ main\n\nimport (\n    \"fmt\"\n    \"bufio\"\n    \"os\"\n)\n\nfunc main() {\n\
    \    //从输入中读取名称\n    reader := bufio.NewReader(os.Stdin)\n    fmt.Print(\"Enter\
    \ your name: \")\n    //将输入传递给 bufio.NewReader\n    name, _ := reader.ReadString('\\\
    n')\n    fmt.Printf(\"Hello %s\\n\", name)\n}\n```\n\n## 读取与写入：文件\n\n你关于用户输入所学的一些知识将回到文件中，但也有一些额外的工具。要在本地系统中读取和/或写入文件，你将使用\
    \ `io/ioutil` 包。你还会发现 `log` 包很有用，特别是 `Logger` 类型，它提供了格式化输出的方法。以下是你会发现对文件非常有用的元素。\n\
    \n*   `os.Create()`\n    使用此工具创建一个所需名称的文件。如果该文件已经创建，`os.Create()` 将将其截断（truncates）。\n\
    *   `io/ioutil.ReadFile()` 和 `io/ioutil.WriteFile()`\n    `ReadFile` 方法只有一个参数，即文件路径。它将返回文件中的数据或错误。相比之下，`WriteFile`\
    \ 有三个参数写入文件：第一个是路径，第二个是数据，第三个是 `FileMode`。\n*   `FileMode`\n    文件具有关联权限。`FileMode`\
    \ 指定了你是否可以读取、写入或执行。这三个位被称为 `rwx`。\n*   `log.Fatalf`\n    它会在打印日志消息后终止程序。它等同于 `Printf`\
