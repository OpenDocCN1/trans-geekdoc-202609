    \ slice:\n\n> powerpuff := map\\[string\\]string{“name”: “Powerpuff”, “breed”:\
    \ “Jackaroodle”, “color”: “white/brown”, “owner”: “PetuniaJones”}\n\n> \n\n> items\
    \ := make(\\[\\]string, len(powerpuff)) //specifying the length of string to avoid\
    \ potential memory allocations\n\n> \n\n> var j int\n\n> \n\n> for\\_, v := range\
    \ powerpuff { //using underscore because you don’t want the keys returned\n\n\
    > \n\n> items\\[j\\] = v\n\n> \n\n> j++\n\n> \n\n> }\n\n> \n\n> fmt.Printf(“%q”,\
    \ items)\n\nYou’ll get the output of the values.\n\n> *\\[“PetuniaJones” “white/brown”\
    \ “Powerpuff” “Jackaroodle”\\]*\n\n## Modifying your Maps\n\nIn Golang, you’re\
    \ not required to use a function or a method to make changes to your maps. You\
    \ can add, change, and delete values.\n\n*   Adding to maps\n\nHere’s the syntax\
    \ for adding to a map:\n\n> map\\[key\\] = value, where map is the name of the\
    \ map variable\n\nFor example, suppose that you need to keep a list of all the\
    \ users and their usernames in your company.\n\n> usernames := map\\[string\\\
    ]string{“Anna”: “axolotl”, “Mary”: “maxolotl”, “Suzanne”: “snaxolotl”} // this\
    \ is your existing map\n\n> \n\n> usernames\\[“Tanya”\\] = “taxolotl”\n\nWhen\
    \ you print it out...\n\n> fmt.Println(usernames)\n\n...you’ll see the new pair\
    \ added to the existing map:\n\n> \\[Tanya: taxolotl Mary: maxolotl Suzanne: snaxolotl\
    \ Anna: axolotl\\]\n\n*   Changing the values in a map\n\nThis type of operation\
    \ is similar to adding to a map. All you need to do is provide the key with its\
    \ new value; when you print it, you’ll be able to see the modifications.\n\nSuppose\
    \ you’re tracking the closed sales for everyone in your company. In real life,\
    \ you’d probably just make sure that your CRM system is linked to the sales data,\
    \ but let’s pretend you’re updating these in real-time. This morning, Tanya had\
    \ $30,000, Mary had $35,000, Suzanne had $25,000, and Anna was at $25,000. Anna\
    \ just closed a $15,000 deal, so you need to update her number to $40,000. You\
    \ need to pass the new value to the key “Anna”:\n\n> salesClosed :=map\\[string\\\
    ]int{ “Tanya”: 30000, “Mary”: 35000, “Suzanne” 25000, “Anna”: 25000}\n\n> \n\n\
    > salesClosed\\[“Anna”\\] = 40000\n\n> \n\n> fmt.Println(salesClosed) //which\
    \ shows you that the amount was updated.\n\nYour output would then show:\n\n>\
    \ *map\\[Mary: 35000 Anna: 40000 Suzanne: 25000 Tanya: 30000\\]*\n\n*   Deleting\n\
    \nYou can delete a pair from a map, or all the values inside the map itself, which\
