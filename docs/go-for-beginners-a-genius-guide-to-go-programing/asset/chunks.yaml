- raw: "> • func(rw \\*RWMutex)UnLock() //release a write lock\n\n> \n\n> • func(rw\
    \ \\*RWMutex)RLock() //get a read lock\n\n> \n\n> • func(rw \\*RWMutex)RUnLock()\
    \ //release a read lock\n\n*   sync.Cond\n\nThe condition variable notifies blocked\
    \ goroutines when the state of shared data changes. They’re always used in combination\
    \ with Mutexes.\n\nSync.Cond examines a lock to determine whether it meets the\
    \ processing conditions. If so, it unlocks and notifies the other goroutines,\
    \ then blocks itself. When the goroutines finish executing, they alert the conditional,\
    \ which unblocks itself and gets the lock.\n\n‣ cond.L.Lock() and cond.L.Unlock()\
    \ operate similarly to the mutex locks\n\n‣ cond.Wait() tells the code to\n\n\
    1.  UnLock()\n\n2.  blocking the waiting notification = waiting for Signal or\
    \ Broadcast as below\n\n3.  receives notification\n\n4.  Lock()\n\n‣ cond.Signal()\
    \ notifies a Wait goroutine. The order of notifications is based on the original\
    \ waitlist and runs FIFO (first in, first out). If there are no Wait routines,\
    \ there’s no error report.\n\n‣ cond.Broadcast alerts all Wait goroutines at once\
    \ in contrast to cond.Signal, which operates in order. Like cond.Signal, if there\
    \ are no Wait goroutines, there won’t be an error report.\n\n‣ sync.Map\n\nYou\
    \ need this to operate multiple maps at the same time to avoid the error you’d\
    \ get by running them in parallel.\n\n*   sync.Pool\n\nsync.Pool is used to cache\
    \ objects, which relieves pressure on the Garbage Collector (GC) and keeps Go\
    \ running quickly. Initializing a pool requires you to set up the *New* function.\
    \ When there’s a cached object and you call Get, it returns the object directly.\
    \ If not, New is called to create it.\n\nPool is best for when you have a lot\
    \ of memory and concurrency. If there isn’t much memory or concurrency, it’s counterproductive\
    \ to use a pool. The best practice is also to empty the pool before you Put objects\
    \ in it and after you Get the objects in it.\n\n## Accurate Computations\n\nDue\
    \ to the way Go is written, there can be issues when dealing with large numbers.\
    \ For example, the factorial of 100 contains 158 digits, so it can’t be stored\
    \ in primitive data types like the ones in Go. It doesn’t have the implicit overflow\
    \ checking that you might find in other languages, so trying to put a number over\
    \ 64 bits into int64 may lead to unexpected results. You won’t get an error message,\
    \ but you’ll get something that doesn’t look right.\n\nTo avoid the problem, use\
    \ the package named *big* . Big is designed to allow programmers to work with\
    \ large numbers using arbitrary-precision arithmetic, which typically stores in\
    \ arrays instead of bits. This can be used when you need very accurate numbers\
    \ and/or the arithmetic speed is not an issue.\n\nThe package supports Int, Rat\
    \ (rational numbers), and Float. The zero values for all three are zero. Therefore,\
    \ new values are easy to declare and don’t require initialization. The syntax\
    \ can be as follows, with *x* , *r,* and *y* all zero values:\n\n> var x Int\n\
    \n> \n\n> var R &Rat{}\n\n> \n\n> y := new(Float)\n\nIt’s also an issue when it\
    \ comes to type conversion since the input is commonly a primitive data type.\
    \ An easy way to get around it is to use a JSON property as a string.\n\n## Custom\
    \ Packages\n\nOnce you’ve written code that you know you’ll reuse, it’s good practice\
    \ to make it a package so you won’t need to copy and paste or try to remember\
    \ where you used it last; all you’ll need to do is import the package in the future.\
    \ When you’re ready to create your package, you need to be in your Go programming\
    \ environment and workspace. In your directory, create the directory name that\
    \ will hold the package—this is typically the same name as the package itself,\
    \ for ease of import. It’s conventional to name the first file in the directory\
    \ after the directory name.\n\nSuppose you wanted to create a package called greeting.\
    \ The name of the directory would be greeting, and the file would be greeting.go.\
    \ To write the program, open the file.\n\nWhen you’re writing packages, the first\
    \ line should be the name of the package you’re creating. Then import whatever\
    \ packages you need, like *fmt* . For this custom package example, we’ll be using\
    \ the iconic Hello, World! in the code. Once you’ve written this package, anytime\
    \ you want to use it, you just need to import the package.\n\n> package greeting\
    \ //everything in this file will be included in the package\n\n> \n\n> import\
    \ “fmt”\n\n> \n\n> func() Hello {\n\n> \n\n> fmt.Println(“Hello, World!”)\n\n\
    > \n\n> }\n\nYou can bring this package into executable files or entry points,\
    \ often named main.go. Here’s what it looks like when you call the package:\n\n\
    > package main\n\n> \n\n> import “greeting”\n\n> \n\n> func main() {\n\n> \n\n\
    > greeting.Hello() //use dot notation to call the function (Hello) in the imported\
    \ package\n\n> \n\n> }\n\nYou can also add variables and types to your package;\
    \ the syntax should look familiar from previous examples. First, add what you\
    \ need to your package. The following code shows a modification to *greeting*\
    \ :\n\n> package greeting\n\n> \n\n> import “fmt”\n\n> \n\n> var Pet = “Powerpuff”\
    \ //adding the variable\n\n> \n\n> type Unicorn struct { //creating Unicorn type\
    \ with name and color fields\n\n> \n\n> Name string\n\n> \n\n> Color string\n\n\
    > \n\n> }\n\n> \n\n> func (Unicorn) String() string {\n\n> \n\n> return fmt.Printf(“The\
    \ unicorn’s name is q% and is the color %s.”, Name, Color)\n\n> \n\n> }\n\n> \n\
    \n> func() Hello {\n\n> \n\n> fmt.Println(“Hello, World!”)\n\n> \n\n> }\n\nTo\
    \ call the package with the new variable and type, your code would look something\
    \ like this:\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> import “greeting”\n\
    \n> \n\n> func main() {\n\n> \n\n> greeting.Hello\n\n> \n\n> fmt.Println(greet.Pet)\
    \ //using the variable Pet defined in *greeting*\n\n> \n\n> uni := greet.Unicorn{\n\
    \n> \n\n> Name: “Petunia”,\n\n> \n\n> Color: “Fuschia”,\n\n> \n\n> }\n\n> \n\n\
    > fmt.Println(uni.String())\n\n> \n\n> }\n\nYour output will look like this:\n\
    \n> *Hello, World!*\n\n> \n\n> *Powerpuff*\n\n> \n\n> *The unicorn’s name is Petunia\
    \ and is the color fuchsia.*\n\nPutting your custom package in its own directory\
    \ makes it easier for you to find and add to other codes.\n\n## Documenting your\
    \ Package\n\nYou’ve seen C++-style line comments in many of the examples so far,\
    \ which are set off with “//”. The language also allows for C-style block comments:\
    \ “/\\* \\* /”. Block comments typically precede the package clause and are used\
    \ for comments about specific packages.\n\nComments are plain text, so don’t use\
    \ HTML tags or syntax in your descriptions. Your package comment introduces the\
    \ package and explains how it should be used. It should give the reader a brief\
    \ idea of what’s happening. If your package has more than one file, you can insert\
    \ the package comments in any file. It appears first on the godoc page.\n\nGo\
    \ is designed to make it easy for all users to understand the purpose of the code\
    \ that a programmer has written. The program and server *godoc* pulls out documentation\
    \ about a given package (or type, variable, etc.) from source files.\n\n## Package\
    \ Distribution with Git\n\nSince Go doesn’t have a central package repository,\
    \ you’ll often be pulling third-party packages. What you’ll find on the web are\
    \ known as VCS (version control systems), such as Git (*.git* ) and Subversion\
    \ (*.svn* ). Others include Bazaar (*.bzr* ), Fossil (*.fossil* ), and Mercurial(*.hg*\
    \ ). GitHub is one of the Go repositories that use Git. Others include bitbucket.org\
    \ (which also handles Mercurial) and IBM Dev Ops at hub.jazz.net.\n\nFirst, you\
    \ need to go get the package you want. Go can pull packages from anywhere on the\
    \ Internet and install them. For that, the syntax looks like this (very much like\
    \ a URL):\n\n> go get repository.com/username/packagename\n\nThere are no quotation\
    \ marks because it’s not using the import command, but rather *go get* . Note\
    \ that there is no http protocol included because go get takes care of all that.\
    \ Here, we’re using repository.com for a general form of bizbucket.org or github.com."
