- raw: "As a reminder, when you have a Go function that has a value argument, only\
    \ the parameter values can be passed to it. Trying to pass a pointer to a value\
    \ function will give you an error. However, that’s not the case with a method.\
    \ Here’s an example of using both pointer and value in a method:\n\n> package\
    \ main\n\n> \n\n> import “fmt”\n\n> \n\n> //author structure\n\n> \n\n> type author\
    \ struct {\n\n> \n\n> name string\n\n> \n\n> section string\n\n> \n\n> }\n\n>\
    \ \n\n> //method using pointer with receiver author type\n\n> \n\n> func(a \\\
    *author) show\\_1(asection string) {\n\n> \n\n> (\\*a).section = asection\n\n\
    > \n\n> }\n\n> \n\n> //method with a value receiver for author type\n\n> \n\n\
    > func(a author) show\\_2() {\n\n> \n\n> a.name = “Johnson”\n\n> \n\n> fmt.Println(“Author’s\
    \ name (Before) : “, a.name)\n\n> \n\n> }\n\n> \n\n> func main () {\n\n> \n\n\
    > res := author{\n\n> \n\n> name : “Smith”,\n\n> \n\n> section:“RQY”\n\n> \n\n\
    > }\n\n> \n\n> fmt.Println(“Section name (Before) : “, res.section)\n\n> \n\n\
    > //call the pointer method of show\\_1 with the value\n\n> \n\n> res.show\\_1(“XJU”)\n\
    \n> \n\n> fmt.Println(“Section name (After) : “, res.section)\n\n> \n\n> //call\
    \ the value method show\\_2 with pointer\n\n> \n\n> (&res).show\\_2()\n\n> \n\n\
    > fmt.Println(“Author’s name (After) : “, res.name)\n\n> \n\n> }\n\nHere’s the\
    \ output:\n\n> *Section name (Before): RQY*\n\n> \n\n> *Section name (After):\
    \ XJU*\n\n> \n\n> *Author’s name (Before): Johnson*\n\n> \n\n> *Author’s name\
    \ (After): Smith*\n\n## Embedded Types\n\nThe embedded type in a struct can be\
    \ specified with the name of the type. It can be a value type or a pointer to\
    \ a value type. In Golang, a field or method can be promoted or become available\
    \ in the outer/embedding type.\n\nThere are some rules for this, of course. The\
    \ method set of a type determines the interfaces that the type implements, as\
    \ well as the methods that can be called using a receiver of that type. In a set,\
    \ each method must have a unique non-blank name. The method set of a type T (any\
    \ type other than an interface) includes all methods declared with receiver type\
    \ T, EXCEPT those declared with a pointer receiver \\*T. However, the method set\
    \ of a pointer receiver \\*T includes both \\*T and T receivers.\n\n## Inheritance\
    \ and Multiple Inheritance\n\nIf you’re familiar with object-oriented programming\
    \ (OOP), then you know inheritance means inheriting one class into another. However,\
    \ since Go is not an OOP and doesn’t use classes, there is no inheritance in Go.\
    \ However, the basic concept of inheritance can be achieved with structs instead.\
    \ In Go, this is known as *composition* . Base structs can be embedded into a\
    \ child struct, and then the methods of the base can be called on the child struct.\
    \ Let’s take a look at a simple base/child composition:\n\n> package main\n\n\
    > \n\n> import “fmt”\n\n> \n\n> type Movie struct{\n\n> \n\n> //declare struct\
    \ variable\n\n> \n\n> Universe string\n\n> \n\n> }\n\n> \n\n> //function to return\
    \ the universe of the movie\n\n> \n\n> func (movie Movie) MovieUniverse () string\
    \ {\n\n> \n\n> return movie.Universe\n\n> \n\n> }\n\n> \n\n> type Quentin struct{\n\
    \n> \n\n> //anonymous field, composition for embedding struct\n\n> \n\n> Movie\n\
    \n> \n\n> }\n\n> \n\n> type Nancy struct{\n\n> \n\n> Movie\n\n> \n\n> }\n\n> \n\
    \n> func main()\n\n> \n\n> //creating an instance\n\n> \n\n> m1 := Quentin{\n\n\
    > \n\n> //child struct directly accesses base struct variables\n\n> \n\n> Movie{\n\
    \n> \n\n> Universe : “QU”,\n\n> \n\n> },\n\n> \n\n> }\n\n> \n\n> // child struct\
    \ directly accesses base struct methods\n\n> \n\n> // print base method using\
    \ child\n\n> \n\n> fmt. Println(“Universe is “, m1.MovieUniverse())\n\n> \n\n\
    > m2 := Nancy{\n\n> \n\n> Movie{\n\n> \n\n> Universe : “NU”,\n\n> \n\n> },\n\n\
    > \n\n> }\n\n> \n\n> fmt. Println(“Universe is “, m2.MovieUniverse())\n\nYour\
    \ output will be:\n\n> *Universe is: QU*\n\n> \n\n> *Universe is: NU*\n\nMultiple\
    \ inheritances occur when the child struct can access all the fields, methods,\
    \ and properties of the base struct. Here’s an example of how that could work:\n\
    \n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> //declare 1st base struct\n\
    \n> \n\n> type first struct{\n\n> \n\n> //declare 1st struct variable\n\n> \n\n\
    > base\\_one string\n\n> \n\n> }\n\n> \n\n> //declare 2nd base struct\n\n> \n\n\
    > type second struct{\n\n> \n\n> //declare 2nd struct variable\n\n> \n\n> base\\\
    _two string\n\n> \n\n> }\n\n> \n\n> //function that will return the first struct\
    \ variable\n\n> \n\n> func (f first) printBase\\_1() string{\n\n> \n\n> return\
    \ f.base\\_one\n\n> \n\n> //function that will return the 2nd struct variable\n\
    \n> \n\n> func (f first) printBase\\_2() string{\n\n> \n\n> return f.base\\_two\n\
    \n> \n\n> //child struct to embed both the base structs\n\n> \n\n> type child\
    \ struct{\n\n> \n\n> //anonymous fields and struct embedding of the two structs\n\
    \n> \n\n> first\n\n> \n\n> second\n\n> \n\n> }\n\n> \n\n> func main()\n\n> \n\n\
    > //declare instance of child struct\n\n> \n\n> c1 := child{\n\n> \n\n> first{\n\
    \n> \n\n> base\\_one(“In base struct 1.”),\n\n> \n\n> },\n\n> \n\n> second{\n\n\
    > \n\n> base\\_two(“In base struct 2.”),\n\n> \n\n> },\n\n> \n\n> }\n\n> \n\n\
    > //print base method using child struct instance\n\n> \n\n> fmt.println(c1.PrintBase1())\n\
    \n> \n\n> fmt.println(c1.PrintBase2())\n\n> \n\n> }\n\nThe output is:\n\n> *In\
    \ base struct 1.*\n\n> \n\n> *In base struct 2.*\n\n## Chapter Summary\n\nMethods\
    \ are similar to functions, but with a specified receiver.\n\n*   Pointers *and*\
    \ values are accepted in methods, but not in functions.\n\n*   Using a pointer\
    \ receiver ensures that modifications to the type persist through the program.\n\
    \n*   Embedded types have rules for the way they’re accepted in method sets.\n\
    \n*   Since Go doesn’t have classes it doesn’t have inheritance, but you can use\
    \ base and child structs for composition.\n\n*   You can use multiple base structs\
    \ and fields with a child struct.\n\nIn the next chapter, you'll learn about interfaces.\n\
    \nTen \n\nNow that you have a grasp of methods in Go, you can add interfaces,\
    \ a necessary tool for abstraction. An *interface* consists of three parts: a\
    \ value, a method set, and the type for the stored value. Reflection allows you\
    \ to examine the type and value at runtime and make changes to the value if you\
    \ need to. When you use an interface as a parameter for a function, passing a\
    \ value to the function adds the type, method set, and value into the interface\
    \ parameter. They’re good tools for making code clearer, more readable, and shorter.\
    \ You can think of interfaces as collections of methods, in addition to being\
    \ a custom type.\n\nThey’re a little different in Go compared to other languages.\
    \ You need to implement all the methods in the interface to implement the interface\
    \ itself, though they’re implemented implicitly with no keyword necessary.\n\n\
    Interfaces deliver the concept of polymorphism to Go. This is writing code that\
    \ takes on different behavior depending on the type that’s implemented. An interface\
    \ with zero value is nil, and if there are no methods, it’s an empty interface.\
    \ An interface itself is a static type that points to the dynamic values and type.\
    \ The syntax to create the interface is similar to that used for a struct, as\
    \ shown in the example below:\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\
    \n> //create the interface\n\n> \n\n> type container interface {\n\n> \n\n> //specify\
    \ the methods\n\n> \n\n> Carea() float64\n\n> \n\n> Volume()float64\n\n> \n\n\
    > }\n\n> \n\n> type somevalue struct {\n\n> \n\n> radiusfloat64\n\n> \n\n> heightfloat64\n\
    \n> \n\n> }\n\n> \n\n> //implement the container interface methods\n\n> \n\n>\
    \ func (s somevalue) Carea() float64{\n\n> \n\n> return 2\\*s.radius\\*s.height\
    \ + 2\\*3.14\\*s.radius\\*s.radius\n\n> \n\n> {\n\n> \n\n> func (s somevalue)\
    \ Volume() float64{\n\n> \n\n> return 3.14\\*s.radius\\*s.radius\\*s.height\n\n\
    > \n\n> }\n\n> \n\n> func main () {\n\n> \n\n> //accessing the elements of the\
    \ container interface\n\n> \n\n> var c container\n\n> \n\n> c = somevalue{10,\
    \ 14}\n\n> \n\n> fmt.Println(“Area of container :”, c.Carea())\n\n> \n\n> fmt.Println(“Volume\
    \ of container :”, c.Volume())\n\n> \n\n> }\n\nAs a result, your output would\
    \ be the area and volume using a radius of 10 and a height of 14.\n\n> *Area of\
    \ container : 908*\n\n> \n\n> *Volume of container : 4396*\n\n## Embedded Interface"
