    \ `Println()` 后接 `panic()`。\n*   `Reader.ReadString(\"\\n\")`\n    这在之前的示例中使用过。你用它从\
    \ `stdin` 读取输入直到出现分隔符。它返回一个包含分隔符的字符串。如果程序在到达分隔符之前发现错误，你也将获得错误之前读取的数据以及错误本身。\n\n\
    此示例演示了你如何接受用户输入以读取/写入文件：\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n   \
    \ \"os\"\n    \"bufio\"\n    \"log\"\n    \"io/ioutil\"\n)\n\nfunc CreateFile(filename,\
    \ text string) {\n    fmt.Printf(\"Writing to a file in Go\\n\")\n    //使用 Create\
    \ 方法，用户输入文件名，如果抛出 err 变量\n    file, err := os.Create(filename)\n    if err !=\
    \ nil {\n        log.Fatalf(\"Failed to create file %s\", err)\n    }\n    //使用\
    \ defer 在 main 执行且写入文件完成后关闭文件\n    defer file.Close()\n    //使用 WriteString 方法将数据写入文件，字符串长度存储在\
    \ len 变量中\n    len, err := file.WriteString(text)\n    if err != nil {\n     \
    \   log.Fatalf(\"Failed to create file %s\", err)\n    }\n    fmt.Printf(\"\\\
    nFileName: %s\", file.Name())\n    fmt.Printf(\"\\nLength: %d bytes\", len)\n\
    }\n\nfunc ReadFile(filename string) {\n    fmt.Printf(\"\\n\\nRead a file in Go\\\
    n\")\n    data, err := ReadFile(filename)\n}\n```\n\n"
