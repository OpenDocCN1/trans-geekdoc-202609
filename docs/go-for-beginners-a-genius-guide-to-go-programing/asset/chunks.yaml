    \ call.\n\n### 1. Direct example\n\nHere’s a sample where the recursive function\
    \ is used to calculate the factorial of a positive number. You may (or may not)\
    \ recall from math class that a factorial is indicated by a number followed by\
    \ an exclamation point (like `4!`) and is equal to all the numbers leading up\
    \ to it multiplied together. In other words, `4! = 4*3*2*1 = 24`.\n\nHere, the\
    \ base case is either `0` or `1` (where the result is `1`). In this example, the\
    \ function decreases by one integer until the base case is reached, at which point\
    \ the function stops. Negative numbers return an error message.\n\n```go\npackage\
    \ main\n\nimport (\n    \"fmt\"\n)\n\nfunc factorial_calc(number int) int {\n\
    \    if number == 0 || number == 1 { // base case\n        return 1\n    }\n\n\
    \    if number < 0 { //if number is negative\n        fmt.Println(\"Invalid Number\"\
    )\n        return -1\n    }\n\n    return number*factorial_calc(number-1) // recursive\
    \ function until operation reaches the base case\n}\n\nfunc main() {\n    answer1\
    \ := factorial_calc(0) //where 0 is the parameter to be passed\n    fmt.Println(answer1,\
    \ \"\\n\")\n    answer2 := factorial_calc(4)\n    fmt.Println(answer2, \"\\n\"\
    )\n    answer3 := factorial_calc(-1)\n    fmt.Println(answer3, \"\\n\")\n    answer4\
    \ := factorial_calc(5)\n    fmt.Println(answer4, \"\\n\")\n}\n```\n\nThe output\
    \ for this example looks like this:\n```\n0\n24\nInvalid number\n-1\n120\n```\n\
    \n### 2. Indirect example\n\nHere you’ll see what it looks like when you use another\
    \ function for recursion. Suppose you wanted to print all the numbers in order,\
    \ decreasing from `n`.\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\n\
    func print_one(n int) {\n    if n >= 0 {\n        fmt.Println(\"In first function:\
    \ \", n)\n        print_two(n-1) //prints n if n is a positive integer and calls\
    \ the second function\n    }\n}\n\nfunc print_two(n int) {\n    if n >= 0 {\n\
    \        fmt.Println(\"In second function: \", n)\n        print_one(n-1)\n  \
    \  }\n}\n\nfunc main() {\n    print_one(6) //prints all positive integers from\
    \ 1 up to 6\n    print_one(-10) //prints nothing because it doesn’t follow the\
    \ base case n >= 0\n}\n```\n\nThe output you’ll see:\n```\nIn first function:\
    \ 6\nIn second function: 5\nIn first function: 4\nIn second function: 3\nIn first\
    \ function: 2\nIn second function: 1\nIn first function: 0\n```\n\nWhat you want\
    \ to avoid is `infinite recursion`, where the function never converges. Normally,\
    \ something like this will result in either a system crash or memory overload.\
    \ If you don’t specify a base case and launch a recursive call, you’ll end up\
    \ with infinite recursion.\n\nGolang also lets you use `anonymous` functions,\
    \ which don’t have a name. You can also use these for recursion. You’ll need to\
    \ tell the program what the anonymous function is.\n\n## Higher-Order Functions\n\
    \nThese types of functions operate on other functions, either receiving one as\
    \ an argument or returning one as output. Here are a couple of simple high-order\
    \ functions to give you the idea.\n\n### 1. Passing as argument\n\nThe example\
    \ uses the `partialSum` function to return the `sum` function.\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc sum(a, b int) int {\n    return a + b\n}\n\n\
    func partialSum(a int) func (int) int {\n    return func(b int) int {\n      \
    \  return sum(a, b)\n    }\n}\n\nfunc main() {\n    add := partialSum(5)\n   \
    \ fmt.Println(add(10)) // Output: 15\n}\n```\n\n### 2. Returning as output\n\n\
    In this example, `squareSum` returns functions.\n\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc squareSum(a int) func (int) int {\n    return func(b int) int\
    \ {\n        return a * b\n    }\n}\n\nfunc main() {\n    square := squareSum(3)\n\
    \    fmt.Println(square(4)) // Output: 12\n}\n```\n\n## Closures\n\n`Closures`\
    \ are functions that reference variables from the surrounding environment. They\
    \ are useful for data isolation.\n\n## Chapter Summary\n\n- Golang includes a\
    \ variety of functions.\n- Slices are built on arrays, so it's worth understanding\
    \ how arrays work in this language.\n- Arrays are frequently used to collect variables\
    \ of the same type.\n- Slices are an easy way in Go to work with these collections.\n"
  trans: "\n通过 `recursive functions`（递归函数），函数会不断调用自己，规模越来越小，直到最终遇到 `base case`（也称为基准情况）。在这一点上，它最终收敛并停止进一步调用。递归有两种方式：直接递归，即不调用其他函数；或者间接递归，这需要另一个函数来协助。\n\
    \n作为程序员，你可能会遇到或想要使用的其他类型的递归。如果只有两个函数，则被称为 `mutual recursion`（相互递归）。尾递归涉及 `tail\
    \ call`（尾调用），即函数的最后一个调用。如果最后一个调用或尾调用调回了该函数，则被称为 `tail-recursive`（尾递归）。同样，`head-recursive`（头递归）是指第一个语句为递归调用的函数。\n\
    \n### 1. 直接示例\n\n这是一个使用递归函数计算正整数阶的示例。你可能（或不记得）在数学课上记得阶乘由数字后加一个感叹号表示（例如 `4!`），并等于该数字之前所有数字的乘积。换句话说，`4!\
    \ = 4*3*2*1 = 24`。\n\n在这里，基准情况是 `0` 或 `1`（结果为 `1`）。在这个示例中，函数每次递减一个整数，直到达到基准情况，此时函数停止。负数将返回错误消息。\n\
    \n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\nfunc factorial_calc(number\
    \ int) int {\n    if number == 0 || number == 1 { // base case\n        return\
    \ 1\n    }\n\n    if number < 0 { //if number is negative\n        fmt.Println(\"\
    Invalid Number\")\n        return -1\n    }\n\n    return number*factorial_calc(number-1)\
    \ // recursive function until operation reaches the base case\n}\n\nfunc main()\
    \ {\n    answer1 := factorial_calc(0) //where 0 is the parameter to be passed\n\
    \    fmt.Println(answer1, \"\\n\")\n    answer2 := factorial_calc(4)\n    fmt.Println(answer2,\
    \ \"\\n\")\n    answer3 := factorial_calc(-1)\n    fmt.Println(answer3, \"\\n\"\
    )\n    answer4 := factorial_calc(5)\n    fmt.Println(answer4, \"\\n\")\n}\n```\n\
    \n该示例的输出如下：\n```\n0\n24\nInvalid number\n-1\n120\n```\n\n### 2. 间接示例\n\n在这里你将看到使用另一个函数进行递归的样貌。假设你想从\
    \ `n` 开始递减打印所有数字。\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\nfunc print_one(n\
    \ int) {\n    if n >= 0 {\n        fmt.Println(\"In first function: \", n)\n \
    \       print_two(n-1) //prints n if n is a positive integer and calls the second\
    \ function\n    }\n}\n\nfunc print_two(n int) {\n    if n >= 0 {\n        fmt.Println(\"\
    In second function: \", n)\n        print_one(n-1)\n    }\n}\n\nfunc main() {\n\
    \    print_one(6) //prints all positive integers from 1 up to 6\n    print_one(-10)\
    \ //prints nothing because it doesn’t follow the base case n >= 0\n}\n```\n\n\
    你将看到的输出：\n```\nIn first function: 6\nIn second function: 5\nIn first function:\
    \ 4\nIn second function: 3\nIn first function: 2\nIn second function: 1\nIn first\
    \ function: 0\n```\n\n你想要避免的是 `infinite recursion`（无限递归），即函数永远不会收敛。通常，这种操作会导致系统崩溃或内存过载。如果你不指定基准情况并启动递归调用，最终将导致无限递归。\n\
    \nGolang 还允许你使用 `anonymous`（匿名）函数，它们没有名称。你也可以将它们用于递归。你需要告诉程序匿名函数是什么。\n\n## 高阶函数\n\
    \n这些类型的函数对函数进行操作，要么接收一个函数作为参数，要么返回一个函数作为输出。这里有两个简单的高阶函数让你有一个直观感受。\n\n### 1. 作为参数传递\n\
    \n示例使用 `partialSum` 函数返回 `sum` 函数。\n\n```go\npackage main\n\nimport \"fmt\"\n\n\
    func sum(a, b int) int {\n    return a + b\n}\n\nfunc partialSum(a int) func (int)\
    \ int {\n    return func(b int) int {\n        return sum(a, b)\n    }\n}\n\n\
    func main() {\n    add := partialSum(5)\n    fmt.Println(add(10)) // Output: 15\n\
    }\n```\n\n### 2. 作为输出返回\n\n在这个示例中，`squareSum` 返回函数。\n\n```go\npackage main\n\n\
    import \"fmt\"\n\nfunc squareSum(a int) func (int) int {\n    return func(b int)\
    \ int {\n        return a * b\n    }\n}\n\nfunc main() {\n    square := squareSum(3)\n\
    \    fmt.Println(square(4)) // Output: 12\n}\n```\n\n## 闭包\n\n`Closures`（闭包）是引用周围环境变量的函数。它们对于数据隔离有用。\n\
    \n## 章节总结\n\n- Golang 包含了各种函数。\n- 切片（Slices）构建于数组，因此值得了解数组在该语言中是如何工作的。\n- 数组经常用于收集相同类型的变量。\n\
    - 切片是 Go 中处理这些集合的一种简单方法。\n\n"
