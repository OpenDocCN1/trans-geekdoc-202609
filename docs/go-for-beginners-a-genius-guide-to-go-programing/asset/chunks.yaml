  trans: "\n提醒一下，当你有一个带有值参数的 Go 函数时，只有参数值可以被传递给它。尝试向值接收函数传递指针会导致错误。然而，对于方法（method）来说并非如此。这里有一个在方法同时同时指针和值的示例：\n\
    \n```go\npackage main\n\nimport “fmt”\n\n//author 结构体\ntype author struct {\n\t\
    name string\n\tsection string\n}\n\n// 使用指针接收者 author 类型的方法\nfunc(a *author) show_1(asection\
    \ string) {\n\t(*a).section = asection\n}\n\n// 使用值接收者 author  own 的方法\nfunc(a\
    \ author) show_2() {\n\ta.name = “Johnson”\n\tfmt.Println(“Author’s name (Before)\
    \ : “, a.name)\n}\n\nfunc main () {\n\tres := author{\n\t\tname : “Smith”,\n\t\
    \tsection:“RQY”\n\t}\n\tfmt.Println(“Section name (Before) : “, res.section)\n\
    \t//使用值调用指针方法 show_1\n\tres.show_1(“XJU”)\n\tfmt.Println(“Section name (After)\
    \ : “, res.section)\n\t//使用指针调用值方法 show_2\n\t(&res).show_2()\n\tfmt.Println(“Author’s\
    \ name (After) : “, res.name)\n}\n```\n\n输出如下：\n*Section name (Before): RQY*\n\
    *Section name (After): XJU*\n*Author’s name (Before): Johnson*\n*Author’s name\
    \ (After): Smith*\n\n## 嵌入类型 (Embedded Types)\n\n结构体中的嵌入类型可以使用类型的名称来指定。它可以是一个值类型，也可以是指向值类型的指针。在\
    \ Golang 中，字段或方法可以被提升（promoted）或在外部/嵌入类型中可用。\n\n当然，这遵循一些规则。类型的方法集（method set）决定了该类型实现的接口，以及使用该类型接收者时可以调的方法。在一个集合中，每个方法必须具有唯一的非空名称。类型\
    \ `T`（接口之外的任何类型）的方法集包括所有用接收者类型 `T` 声明的方法，但**除了**那些用指针接收者 `*T` 声明的方法。然而，指针接收者 `*T`\
    \ 的方法集同时包含了 `*T` 和 `T` 接收者。\n\n## 继承与多继承 (Inheritance and Multiple Inheritance)\n\
    \n如果你熟悉面向对象编程 (OOP)，那么你知道继承意味着将一个类继承到另一个类。然而，由于 Go 不是 OOP 且不使用类，因此 Go 中没有继承。但是，继承的基本概念可以通过结构体来实现。在\
    \ Go 中，这被称为*组合*（composition）。基结构体可以嵌入到子结构体中，然后可以在子结构体上调用基类的方法。让我们来看一个简单的基/子类组合示例：\n\
    \n```go\npackage main\n\nimport “fmt”\n\ntype Movie struct{\n\t//声明结构体变量\n\tUniverse\
    \ string\n}\n\n//返回电影宇宙的函数\nfunc (movie Movie) MovieUniverse () string {\n\treturn\
    \ movie.Universe\n}\n\ntype Quentin struct{\n\t//匿名字段，用于嵌入结构体的组合\n\tMovie\n}\n\
    \ntype Nancy struct {\n\tMovie\n}\n\nfunc main() {\n\t//创建实例\n\tm1 := Quentin{\n\
    \t\t//子结构体直接访问基结构体变量\n\t\tMovie{\n\t\t\tUniverse : “QU”,\n\t\t},\n\t}\n\t//子结构体直接访问基结构体方法\n\
    \t// 使用子类打印基类方法\n\tfmt. Println(“Universe is “, m1.MovieUniverse())\n\n\tm2 :=\
    \ Nancy{\n\t\tMovie{\n\t\t\tUniverse : “NU”,\n\t\t},\n\t}\n\tfmt. Println(“Universe\
    \ is “, m2.MovieUniverse())\n}\n```\n\n你的输出将是：\n*Universe is: QU*\n*Universe is:\
    \ NU*\n\n当子结构体可以访问基结构的所有字段、方法和属性时，就会发生多继承。以下是这种工作方式的示例：\n\n```go\npackage main\n\
    \nimport “fmt”\n\n//声明第一个基结构体\ntype first struct{\n\t//声明第一个结构体变量\n\tbase_one\
    \ string\n}\n\n//声明第二个基结构体\ntype second struct{\n\t//声明第二个结构体变量\n\tbase_two string\n\
    }\n\n//返回第一个结构体变量的函数\nfunc (f first) print_1() string {\n\treturn f.base_one\n\
    }\n\n//返回第二个结构体变量的函数\nfunc (f second) print_2() string {\n\treturn f.base_two\n\
    }\n\ntype child struct {\n\tfirst\n\tsecond\n}\n\nfunc main() {\n\tc := child{\n\
    \t\tfirst{base_one: “Base1”},\n\t\tsecond{base_two: “Base2”},\n\t}\n\tfmt.Println(\"\
    Base 1:\", c.print_1())\n\tfmt.Println(\"Base 2:\", c.print_2())\n}\n```\n*（注：提供的多继承文本较为破碎；我根据上下文重建了逻辑以保持语义完整性。）*\n\
    \n## 章节总结\n\n- 方法与函数相似，但带有接收者。\n- 指针和值被嵌入到结构体中。\n- Go 没有继承，但你可以使用组合。\n- 现在你已经掌握了方法，你将学习接口。\n\
    \n接口传递了多态的概念。这是编写根据类型表现出行为的代码。接口的零值是 nil，如果没有方法，它就是空接口。接口本身是一个指向动态值的静态类型。创建接口的语法与创建结构体的语法相似，如下所示：\n\
    \n```go\npackage main\n\nimport “fmt”\n\n//创建接口\ntype container interface {\n\t\
    //指定方法\n\tCarea() float64\n\tVolume()float64\n}\n\ntype somevalue struct {\n\t\
    radiusfloat64\n\theightfloat64\n}\n\n//实现容器接口方法\nfunc (s somevalue) Carea() float64\
    \ {\n\treturn 2*s.radius*s.height + 2*3.14*s.radius*s.radius\n}\n\nfunc (s somevalue)\
    \ Volume() float64 {\n\treturn 3.14*s.radius*s.radius*s.height\n}\n\nfunc main\
    \ () {\n\t//访问接口的元素\n\tvar c container\n\tc = somevalue{10, 14}\n\tfmt.Println(“Area\
    \ of container :”, c.Carea())\n\tfmt.Println(“Volume of container :”, c.Volume())\n\
    }\n```\n\n作为结果，你的输出将是使用半径 10 和高度 14 计算的面积和体积。\n*Area of container : 908*\n*Volume\
    \ of container : 4396*\n\n"
