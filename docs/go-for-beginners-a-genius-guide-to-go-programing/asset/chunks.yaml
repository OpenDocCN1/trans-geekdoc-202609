    slice 1 = \", slice1)\n    fmt.Println(\"slice 2 = \", slice2)\n    fmt.Println(\"\
    slice 3 = \", slice3)\n    fmt.Println(\"slice 4 = \", slice4)\n}\n```\n\nYou’ll\
    \ get following output:\n```\nArray a = [Britain Canada Australia India New Zealand]\n\
    slice1 = [Canada Australia India]\nslice2 = [Britain Canada Australia]\nslice3\
    \ = [Australia New Zealand]\nslice4 = [Britain Canada Australia India New Zealand]\n\
    ```\nNote that slices can’t grown past their capacity and they can’t resliced\
    \ below zero. You’ll end up with a runtime panic.\n\n## Initialization\n\nListing\
    \ the initial values of the slice is known as initialization. Use a slice literal\
    \ with empty brackets (as above) followed by the type, and then list the initial\
    \ values in curly brackets `{}`.\n\n```go\nvar intSlice = []int{10, 20, 30, 40}\n\
    var strSlice = []string{\"Britain\", \"Canada\", \"Australia\"}\n```\n\n## Modifying\
    \ Slices\n\nSince a slice is segment of an array, any changes you make to the\
    \ slice will also change the array it based. Any other slices that reference the\
    \ same array will also changed. Here’s an example based on days of week that illustrates\
    \ how works.\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main () {\n    a\
    \ :=[7]string{\"Mon\", \"Tues\", \"Weds\", \"Thurs\", \"Fri\", \"Sat\", \"Sun\"\
    }\n\n    slice1 := a[1:]\n    slice2 := a[3:]\n\n    fmt.Println(\"----- Modification-----\"\
    )\n    fmt.Println(\"a = \", a)\n    fmt.Println(\"slice1 = \", slice1)\n    fmt.Println(\"\
    slice2 = \", slice2)\n\n    slice1[0] = \"TUES\"\n    slice1[1] = \"WEDS\"\n \
    \   slice1[2] = \"THURS\"\n    slice2[1] = \"FRI\"\n\n    fmt.Println(\"-----\
    \ Modification-----\")\n    fmt.Println(\"a = \", a)\n    fmt.Println(\"slice1\
    \ = \", slice1)\n    fmt.Println(\"slice2 = \", slice2)\n}\n```\n\nThe output\
    \ is follows:\n```\n----- Modification-----\na = [Mon Tues Weds Thurs Fri Sat\
    \ Sun]\nslice1 = [Tues Weds Thurs Fri Sat Sun]\nslice2 = [Thurs Fri Sat Sun]\n\
    ----- Modification-----\na = [Mon TUES WEDS THURS FRI Sat Sun]\nslice1 = [TUES\
    \ WEDS THURS FRI Sat Sun]\nslice2 = [THURS FRI Sat Sun]\n```\n\n## For and For\
    \ Range with Slices\n\nJust as you can iterate over some of the other expressions\
    \ we’ve discussed in Golang, you can also iterate over slices and arrays.\n\n\
    ### For\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main () {\n    days :=[]string{\"\
    Thurs\", \"Fri\", \"Sat\", \"Sun\"}\n    for i := 0; i < len(days); i++ {\n  \
    \      fmt.Println(days[i])\n    }\n}\n```\n\nThe output would look like this:\n\
    ```\nThurs\nFri\nSat\nSun\n```\n\n### For range\n\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc main () {\n    primenumbers := []int{2, 3, 5, 7, 11}\n    for\
    \ index, number := range primenumbers {\n        fmt.Printf(\"Primenumber (%d)\
    \ = %d\\n\", index +1, number)\n    }\n}\n```\n\nYou’ll get results that look\
    \ like this:\n```\nPrimenumber(1) = 2\nPrimenumber(2) = 3\nPrimenumber(3) = 5\n\
    Primenumber(4) = 7\nPrimenumber(5) = 9\n```\n\n## Multidimensional\n\nFirst, let’s\
    \ take a look at multidimensional arrays. So far, we’ve used arrays with just\
    \ one row. Consider a two-dimensional array, which has more than one row and more\
    \ than one column. You could visualize this as a table with x rows and y columns.\
    \ Although there’s technically no limit for the number of dimensions you could\
    \ have, the most useful multidimensional arrays are two dimensions. The syntax\
    \ for arrays is:\n\n`var arrayName [x][y]data_type`\n\nFor example, a `[2][3]int`\
    \ has two rows and three columns of numbers. Every element in a two-dimensional\
    \ array `a` can be defined by its position: `a[i][j]` where `i` is the row and\
    \ `j` is the column. Similarly, you can have two (or more) dimensions in your\
    \ slices. These are suitable for applications for things like gaming, image processing,\
    \ and matrix calculations.\n\n## Reslicing, Copying, and Appending\n\nWhen you\
    \ reslice, you change the length of a given slice. If you want to copy a slice\
    \ using the builtin function `copy`, you can take elements from the source slice\
    \ and copy them to the destination. The copy will always have the minimum length\
    \ of the two slices, and it returns the integer value of the number of elements\
    \ copied. The syntax looks like this: `func copy (dst, src, []type)` where dst\
    \ is the destination slice and source the original. Here’s an example of copying.\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main () {\n    src := []string{\"\
    Red\", \"Orange\", \"Yellow\", \"Green\"}\n    dest :=make([]string, 2)\n    numCopied\
    \ := copy(dest, src)\n    fmt.Println(\"src = \", src)\n    fmt.Println(\"dest\
    \ = \", dest)\n    fmt.Println(\"# elements copied from source to dest = \", numCopied)\n\
    }\n```\n\nThe output looks like so:\n```\nsrc = [Red Orange Yellow Green]\ndest\
    \ = [Red Orange]\n# elements copied from source to dest = 2\n```\n\nThe built-in\
    \ function `append` adds elements to the end of a slice. If the given slice doesn’t\
    \ have the capacity for additional elements, then a new array with a higher cap\
    \ is allocated. If it’s big enough for the appends, the existing array is used.\
    \ In the case where the slice has enough capacity to accommodate the appendage,\
    \ any changes to it will also appear in the appending slice, since they’re both\
    \ referring to the same array.\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc\
    \ main() {\n    slice1 := make([]string, 3, 10)\n    copy(slice1, []string{\"\
    Red\", \"Orange\", \"Yellow\"})\n}\n```\n"
  trans: "\n你可能记得切片（slice）是由多个元素组成的。与数组不同，它们在声明时不需要在括号中指定长度。切片的零值为 `nil`。其长度和容量均为\
    \ 0，且它没有引用数组。\n\n## 声明\n\n你可以使用一组方括号 `[]` 为将保存切片的变量声明类型，然后紧跟该切片将包含的元素类型。这里是声明变量类型的两个示例，一个是数字类型，另一个字符串类型：\n\
    \n```go\nvar intSlice []int\nvar strSlice []string\n```\n\n你也可以使用内置函数 `make` 来声明切片，它包含长度。容量是可选的。如果你只指定了长度，则假设容量与长度相同。如果容量与长度不同，你需要声明容量值。\n\
    \n`make` 会分配一个数组，然后返回一个引用该数组的切片。\n\n```go\nvar intSlice = make([]int, 10) // 这里长度和容量相同，均为\
    \ 10\nvar strSlice = make ([]string, 10, 20) // 为 10，容量为 20\n```\n\n或者，你可以使用 `new`\
    \ 关键字声明切片。在关键字后跟随容量，然后是切片中元素的类型：\n\n```go\nvar intSlice = new([50]int)[0:10] //\
    \ 关键字为 new，容量为 50，长度为 10\n```\n\n切片可以通过对数组进行切片形成，也可以从另一个切片形成。它通过半开区间指定，该区间包含起始值但不包含结束值，由两个用冒号分隔的索引组成。你可以将其理解为\
    \ `[low: high]`。默认的 low 是第 0 个值，high 是切片的长度。\n\n例如，表达式 `b[1:4]` 将创建一个包含元素 1–3\
    \ 的 `b` 的切片。\n\n假设你有一个切片 `b := []byte{'q', 'j', 'x', 'z', 'q'}`：\n\n```go\nb[1:4]\
    \ == []byte{'j', 'x', 'z'} // 记住第一个元素索引是 0 而不是 1，且范围包含第一个元素但不包含最后一个\n```\n\n让我们来看另一个关于数组\
    \ `a` 和各种切片的示例：\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main () {\n \
    \   a :=[5]string{\"Britain\", \"Canada\", \"Australia\", \"India\", \"New Zealand\"\
    } //数组 a 有 5 个元素\n\n    // 现在开始切片\n    slice1 := a[1:4]\n    slice2 := a[:3] //\
    \ 记住默认 low 是第 0\n    slice3 := a[2:] // 默认 high 是最后一个\n    slice4 := a[:]\n\n\
    \    fmt.Println(\"Array a = \", \"a\")\n    fmt.Println(\"slice 1 = \", slice1)\n\
    \    fmt.Println(\"slice 2 = \", slice2)\n    fmt.Println(\"slice 3 = \", slice3)\n\
    \    fmt.Println(\"slice 4 = \", slice4)\n}\n```\n\n你将得到以下输出：\n```\nArray a =\
    \ [Britain Canada Australia India New Zealand]\nslice1 = [Canada Australia India]\n\
    slice2 = [Britain Canada Australia]\nslice3 = [Australia New Zealand]\nslice4\
    \ = [Britain Canada Australia India New Zealand]\n```\n注意，切片不能超过其容量增长，也不能重新切片到零以下。这会导致运行时恐慌（panic）。\n\
    \n## 初始化\n\n列出切片的初始值被称为初始化。使用带有空括号的切片字面量（如上所示），跟随类型，然后在花括号 `{}` 中列出初始值。\n\n```go\n\
    var intSlice = []int{10, 20, 30, 40}\nvar strSlice = []string{\"Britain\", \"\
    Canada\", \"Australia\"}\n```\n\n## 修改切片\n\n由于切片是数组的一部分，对切片进行的任何更改都会影响数组。其他引用该数组的切片也会发生变化。这里有一个基于周日的示例说明了其工作原理：\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main () {\n    a :=[7]string{\"\
    Mon\", \"Tues\", \"Wed\", \"Thu\", \"Fri\", \"Sat\", \"Sun\"}\n\n    slice1 :=\
    \ a[1:]\n    slice2 := a[3:]\n\n    fmt.Println(\"----- Modification\")\n    fmt.Println(\"\
    a = \", a)\n    fmt.Println(\"slice1 = \", slice1)\n    fmt.Println(\"slice2 =\
    \ \", slice2)\n\n    slice1[0] = \"TUES\"\n    slice1[1] = \"WEDS\"\n    slice1[2]\
    \ = \"THURS\"\n    slice2[1] = \"FRI\"\n\n    fmt.Println(\"----- Modification\"\
    )\n    fmt.Println(\"a = \", a)\n    fmt.Println(\"slice1 = \", slice1)\n    fmt.Println(\"\
    slice2 = \", slice2)\n}\n```\n\n输出如下：\n```\n----- Modification\na = [Mon Tues\
    \ Wed Thu Fri Sat Sun]\nslice1 = [Tues Wed Thu Fri Sat Sun]\nslice2 = [Thu Fri\
    \ Sat Sun]\n----- Modification\na = [Mon TUES WEDS THURS Fri Sat Sun]\nslice1\
    \ = [TUES WEDS THURS Fri Sat Sun]\nslice2 = [THURS FRI Sat Sun]\n```\n\n## For\n\
    \n正如我们在 Golang 中讨论过的遍历某些表达式一样，你也可以遍历切片和数组。\n\n### For\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\nfunc main () {\n    days :=[]string{\"Thu\", \"Fri\", \"Sat\"\
    , \"Sun\"}\n    for i := 0; i < len(days); i++ {\n        fmt.Println(days[i])\n\
    \    }\n}\n```\n\n输出看起来像：\n```\nThu\nFri\nSat\nSun\n```\n\n### For range\n\n```go\n\
    package main\n\nimport \"fmt\"\n\nfunc main () {\n    primenbers := []int{2, 3,\
    \ 5, 7, 11}\n    for index, number := range primenumbers {\n        fmt.Printf(\"\
    Primenumber(%d) = %d\\n\", index +1, number)\n    }\n}\n```\n\n你将得到如下结果：\n```\n\
    Primenumber(1) = 2\nPrimenumber(2) = 3\nPrimenumber(3) = 5\nPrimenumber(4) = 7\n\
    ```\n\n 多维\n\n首先，让我们看看多维数组。到目前为止，我们使用的是单行数组。考虑一个具有多行多列的二维数组。你可以将其可视化为具有 x 行 y\
    \ 列的表格。虽然技术上对维度没有限制，但最有用的多维数组是二维的。数组的语法为：\n\n`var arrayName [x][y]data_type`\n\
    \n例如，`[2][3]int` 有两行三列数字。二维数组 `a` 中的每个元素都可以通过其位置定义：`a[i][j]`，其中 `i` 是行，`j` 是列。同样，你的切片也可以有两个（更多）维度。这些适用于游戏、图像处理和矩阵计算等应用。\n\
    \n## 重切片、复制和追加\n\n当重新切片（reslice）时，你更改了给定切片的长度。如果你想使用内置函数 `copy` 复制切片，可以从源切片获取元素并将其复制到目标。复制长度始终是两个切片中的最小长度，并返回复制元素数量的整数。语法如下：`func\
    \ copy (dst, src, []type)`，其中 `dst` 是目标切片，src 是原始切片。这是一个复制的示例：\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc main () {\n    src := []string{\"Red\", \"Orange\"\
    , \"Yellow\", \"Green\"}\n    dest :=make([]string, 2)\n    numCopied := copy(dest,\
    \ src)\n    fmt.Println(\"src = \", src)\n    fmt.Println(\"dest = \", dest)\n\
    \    fmt.Println(\"# elements copied from source to dest = \", numCopied)\n}\n\
    ```\n\n输出如下：\n```\nsrc = [Red Orange Yellow Green]\ndest = [Red Orange]\n# elements\
    \ copied from source to dest = 2\n```\n\n内置函数 `append` 将元素添加到切片的末尾。如果给定切片没有足够的容量存放额外元素，则会分配具有更高容量（cap）的新数组。如果它足够大追加，则使用现有数组。在切片有足够容量容纳追加的情况下，对其进行的任何更改也会出现在追加的切片中，因为它们都引用同一个数组。\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    slice1 := make([]string,\
    \ 3, 10)\n    copy(slice1, []string{\"Red\", \"Orange\", \"Yellow\"})\n}\n```\n"
