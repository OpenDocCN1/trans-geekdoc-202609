    fmt.Printf(\"\\nFile Size: %d bytes\", len(data))\nfmt.Printf(\"\\nData: %s\"\
    , data)\n}\n\nfunc main() {\n    //获取用户的文件的文件\n    fmt.Println(\"Enter filename:\
    \ \")\n    var filename string\n    fmt.Scanln(&filename)\n\n    //获取用户输入的文件内容\n\
    \    fmt.Println(\"Enter text: \")\n    inputReader := bufio.NewReader(os.Stdin)\n\
    \    input, _ := inputReader.ReadString(\"\\n\")\n\n    //创建并读取文件\n    CreateFile(filename,\
    \ input)\n    ReadFile(filename)\n}\n```\n\n如果用户输入“Hello.txt”作为文件名，并在提示处输入“Hello\
    \ World, it’s reading and writing in Golang!”，那么你的输出将如下：\n\n*在 Go 中写入文件*\n\n*Filename:\
    \ Hello.txt*\n\n*Length: 101 bytes*\n\n*在 Go 中读取文件*\n\n*File Name: Hello.txt*\n\
    \n*Size: 101 bytes*\n\nData: Hello World, it’s reading and writing in Golang!\n\
    \n## 读取：使用缓冲区读取文件\n\n在本章的早些时候，我们讨论了缓冲区如何减少执行程序所需的时间。缓冲区是内存中的一个区域，可以是变长的也可以是固定的。如果你需要变长的大小，可以使用\
    \ `bytes` 包提供的 `Buffer` 结构类型。\n\n`bytes.NewBuffer` 函数初始化一个带有初始值的变长缓冲区。该函数的语法如下：\n\
    \n```go\nfunc NewBuffer(buf []byte) *bytes.buffer\n```\n\n同样，使用 `bytes.NewBufferString`\
    \ 使用字符串的字节作为初始值初始化变长缓冲区。语法如下：\n\n```go\nfunc NewBufferString(s string) *bytes.buffer\n\
    ```\n\n除了你熟悉的 `ReadFrom`、`WriteTo` 以及其他读/写方法，`Buffer` 包还包含了其他你可能认为非常有用的方法，包括 `WriteString`（从字符串写入数据）、`Reset`（清空缓冲区）和\
    \ `Grow`（增加缓冲区大小）。\n\n## 读取：从命令行读取参数\n\n来自命令行参数是向程序开头添加额外信息的快速方法。你可以使用以下语法在命令行上通过空格来分隔参数值：\n\
    \n```bash\n$./program Arg1 Arg2 Arg3\n```\n\n`os` 包包含 `Args` 数组；该字符串数组持有所有传递的参数。例如，你可能想让程序问候你的同事：\n\
    \n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\n)\n\nfunc main() {\n\
    \    names := os.Args[1:]\n    for _, name := range names {\n        fmt.Printf(\"\
    Hello, %s\\n!\", name)\n    }\n}\n```\n\n你的命令行和输出将如下所示：\n\n*$$ go build hello-team.go*\n\
    \n*$./hello-team Nancy Bob Sylvia*\n\n*Hello Nancy!*\n\n*Hello Bob!*\n\n*Hello\
    \ Sylvia!*\n\n## 使用切片读取\n\n`bufio` 包还允许编码人员在读取数据时将切片配合缓冲区。\n\n### ReadSlice\n\n\
    `ReadSlice` 返回一个包含分隔符的字符串切片。其语法如下：\n\n```go\nfunc (b *Reader) ReadSlice(delim\
    \ byte) (line []byte, err error)\n```\n\n如果已到达函数末尾且没有找到分隔符，则返回 `io.EOF`。如果在缓冲区空间耗尽之前没有找到分隔符，则返回\
    \ `io.ErrFull`。\n\n### ReadLine\n\n与 `ReadSlice` 类似，`ReadLine` 在缓冲区空间耗尽之前找到分隔符（如\
    \ `\\n`）时会返回。\n\n"
