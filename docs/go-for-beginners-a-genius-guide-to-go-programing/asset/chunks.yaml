    \ suppose Suzanne is fired for her relatively poor performance. Here’s how you’d\
    \ remove her from the `usernames` map.\n\n```go\nusernames := map[string]string{\"\
    Anna\": \"axolotl\", \"Mary\": \"maxolotl\", \"Suzanne\": \"snaxolotl\", \"Tanya\"\
    : \"taxolotl\"}\n\ndelete(usernames, \"Suzanne\")\n```\n\nTo confirm that Suzanne\
    \ is removed from the map you can print it out:\n\n```go\nfmt.Println(usernames)\n\
    ```\n\nAnd the output will read:\n`[Tanya: taxolotl Mary: maxolotl Anna: axolotl]`\n\
    \n## Sorting\n\nAs you’ve learned, maps are unordered in Go. However, you can\
    \ arrange maps with the `sort` function. Let’s continue with the ages of the remaining\
    \ users for our company to show how this works in maps.\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\nfunc main() {\n    m := map[string]int{\"Anna\": 25, \"Tanya\"\
    : 21, \"Mary\": 37,}\n    items := make([]string, len(m))\n    for k := range\
    \ m {\n        items = append(items, k)\n    }\n    sort.Strings(items)\n    for\
    \ _, k := range items {\n        fmt.Printf(\"%s: %d\\n\", k, m[k])\n    }\n}\n\
    ```\n\n## Summary\n\n- Maps are unordered in Go.\n- You can arrange maps with\
    \ the `sort` function.\n- You can add, change, and delete values in maps directly.\n\
    - The `delete` function is used to remove entries.\n- Structs are used to organize\
    \ complex data into blueprints.\n"
  trans: "\n\n如果你只是想获取键的列表，也可以使用 `range`。声明一个只访问 map 中键的变量，然后追加一个切片（slice）来存储存储这些键：\n\
    \n```go\nkeysOnly :=[]string{}\n\nfor key := range powerpuff {\n    keysOnly :=\
    \ append(keysOnly, key)\n}\n\nfmt.Printf(\"%q\", keysOnly)\n```\n\n这将产生如下输出：\n\
    `[\"breed\" \"color\" \"owner\" \"name\"]`\n\n你可以编写类似的代码来提供不带键的值列表。这可以让程序运行得更高效（尽管在\
    \ Go 中这样写的代码会更多）。在这里，你将预先分配切片的空间：\n\n```go\npowerpuff := map[string]string{\"\
    name\": \"Powerpuff\", \"breed\": \"Jackaroodle\", \"color\": \"white/brown\"\
    , \"owner\": \"PetuniaJones\"}\n\nitems := make([]string, len(powerpuff)) // 指定字符串长度以避免潜在的内存分配\n\
    \nvar j int\n\nfor _, v := range powerpuff { // 使用下划线是因为你不需要返回键\n    items[j]\
    \ = v\n    j++\n}\n\nfmt.Printf(\"%q\", items)\n```\n\n你将得到值的输出：\n`[\"PetuniaJones\"\
    \ \"white/brown\" \"Powerpuff\" \"Jackaroodle\"]`\n\n## 修改你的 Maps\n\n在 Golang\
    \ 中，你不需要使用函数或方法来对 map 进行更改。你可以直接添加、修改和删除值。\n\n### 向 map 中添加内容\n\n以下是向 map 中添加内容的语法：\n\
    \n`map[key] = value`，其中 `map` 是 map 变量的。\n\n例如，假设你需要保留公司中所有用户及其用户名的列表。\n\n```go\n\
    usernames := map[string]string{\"Anna\": \"axolotl\", \"Mary\": \"maxolotl\",\
    \ \"Suzanne\": \"snaxolotl\"} // 这是你已有的 map\n\nusernames[\"Tanya\"] = \"taxolotl\"\
    \n```\n\n当你打印它时...\n\n```go\nfmt.Println(usernames)\n```\n\n...你会看到现有 map 中添加了新的键值对：\n\
    `[Tanya: taxolotl Mary: maxolotl Suzanne: snaxolotl Anna: axolotl]`\n\n### 修改\
    \ map 中的值\n\n这种操作与向 map 中添加内容相似。你只需要提供键及其新值；当你打印它时，就能看到修改。\n\n假设你正在跟踪公司里每个人的成交销售额。在现实生活中，你可能只需要确保你的\
    \ CRM 系统连接到销售数据，但让我们假设你正在实时更新这些数据。今天早上，Tanya 有 $30,000，Mary 有 $35,000，Suzanne\
    \ 有 $25,000，而 Anna 也是 $25,000。Anna 刚刚谈成了一笔 $15,000 的交易，所以你需要将她的数字更新为 $40,000。你需要为键\
    \ `Anna` 传递新值：\n\n```go\nsalesClosed := map[string]int{\"Tanya\": 30000, \"Mary\"\
    : 35000, \"Suzanne\": 25000, \"Anna\": 25000}\n\nsalesClosed[\"Anna\"] = 40000\n\
    \nfmt.Println(salesClosed) // 这显示了金额已更新。\n```\n\n你的输出将显示：\n`map[Mary: 35000 Anna:\
    \ 40000 Suzanne: 25000 Tanya: 30000]`\n\n删除 删除\n\n你可以从 map 中删除一个键值对，或者删除 map 内部的所有值，然后你可以以不同的方式再次使用它们。\n\
    \n要删除键值对，可以使用内置函数 `delete`。语法如下：\n\n`delete[map, key]`，其中 `map` 是你要从中删除键值对的 map，`key`\
    \ 是你想要移除的键（这也会从 map 中删除对应的值）。\n\n继续上面的示例，假设 Suzanne 因为表现相对较差被解雇。以下是你从 `usernames`\
    \ map 中移除她的方法：\n\n```go\nusernames := map[string]string{\"Anna\": \"axolotl\"\
    , \"Mary\": \"maxolotl\", \"Suzanne\": \"snaxolotl\", \"Tanya\": \"taxolotl\"\
    }\n\ndelete(usernames, \"Suzanne\")\n```\n\n为了确认 Suzanne 已从 map 中移除，你可以打印它：\n\n\
    ```go\nfmt.Println(usernames)\n```\n\n输出将为：\n`[Tanya: taxolotl Mary: maxolotl\
    \ Anna: axolotl]`\n\n## 排序\n\n正如你所学到的，Go 中的 map 是无序的。然而，你可以使用 `sort` 函数对 map 进行排序。让我们继续使用公司剩余用户的年龄来展示这在\
    \ map 中是如何工作的。\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n   \
    \ m := map[string]int{\"Anna\": 25, \"Tanya\": 21, \"Mary\": 37,}\n    items :=\
    \ make([]string, len(m))\n    for k := range m {\n        items = append(items,\
    \ k)\n    }\n    sort.Strings(items)\n    for _, k := range items {\n        fmt.Printf(\"\
    %s: %d\\n\", k, m[k])\n    }\n}\n```\n\n## 总结\n\n- Map 在 Go 中是无序的。\n- 你可以使用 `sort`\
    \ 函数对 map 进行排序。\n- 你可以直接在 map 中添加、修改和删除值。\n- `delete` 函数用于移除条目。\n- 结构体（Structs）用于将复杂数据组织成蓝图。\n\
    \n"
