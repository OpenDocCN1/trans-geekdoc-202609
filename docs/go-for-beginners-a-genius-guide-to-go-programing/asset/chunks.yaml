  trans: "\n\n```\n• func(rw *RWMutex)UnLock() //释放写锁\n• func(rw *RWMutex)RLock()\
    \ //获取读锁\n• func(rw *RWMutex)RUnLock() //释放读锁\n```\n\n### sync.Cond\n\n条件变量在共享数据状态发生变化时通知被阻塞的\
    \ goroutine。它们总是与 `Mutexes`（互斥锁）结合使用。\n\n`Sync.Cond` 检查一个锁以确定其是否满足了处理条件。如果是的话，它会解锁并通知其他\
    \ goroutine，然后阻塞自己。当 goroutine 完成执行时，它们会唤醒条件变量，条件变量会解除阻塞状态并获取锁。\n\n‣ `cond.L.Lock()`\
    \ 和 `cond.L.Unlock()` 的操作方式与 `mutex` 锁类似。\n\n‣ `cond.Wait()` 告诉代码执行：\n\n1. `UnLock()`\n\
    2. 阻塞等待通知 = 等待下方的 `Signal` 或 `Broadcast`\n3. 接收通知\n4. `Lock()`\n\n‣ `cond.Signal()`\
    \ 通知一个 `Wait` goroutine。通知的顺序基于原始等待列表并按 FIFO（先入先出）运行。如果没有 `Wait` 协程，则没有错误报告。\n\
    \n‣ `cond.Broadcast()` 同时唤醒所有 `Wait` goroutine，这与按顺序操作的 `cond.Signal` 不同。与 `cond.Signal`\
    \ 一样，如果没有 `Wait` 协程，也不会产生错误报告。\n\n### sync.Map\n\n你需要它来同时操作多个 map，以避免并行运行它们时产生的错误。\n\
    \n### sync.Pool\n\n`sync.Pool` 用于缓存对象，这可以减轻垃圾回收器（GC）的压力并保持 Go 快速运行。初始化一个池需要你设置\
    \ `New` 函数。当有缓存对象且你调用 `Get` 时，它会直接返回该对象。如果没有，则会调用 `New` 来创建它。\n\n`Pool` 最适用于你有大量内存和并发的场景。如果内存或并发量不高，使用池反而会适得其反。最佳实践是在你\
    \ `Put` 对象放入池中之前，以及 `Get` 获取池中对象之后，清空该池。\n\n## 精确计算\n\n由于 Go 的编写方式，在处理大数字时可能会出现问题。例如，100\
    \ 的阶乘包含 158 位数字，因此它无法存储在 Go 的原生数据类型中。它没有你可能在其他语言中找到的隐式溢出检查，因此尝试将超过 64 位的数字放入 `int64`\
    \ 可能会导致意外的结果。你不会得到错误信息，但会得到一个看起来不对劲的结果。\n\n为了避免这个问题，请使用名为 `big` 的包。`Big` 设计用于允许程序员使用任意精度算术来处理大数字，这些数字通常存储在数组而不是位中。当你需要非常精确的数字和/或计算速度不是问题时，可以使用它。\n\
    \n该包支持 `Int`、`Rat`（有理数）和 `Float`。这三者的零值都是零。因此，新值很容易声明且不需要初始化。语法如下，其中 `x`、`r` 和\
    \ `y` 均为零值：\n\n```go\nvar x Int\nvar R &Rat{}\ny := new(Float)\n```\n\n在类型转换方面也是一个问题，因为输入通常是原生数据类型。绕过此问题的简单方法是使用\
    \ JSON 属性作为字符串。\n\n## 自定义包\n\n一旦你写了你知道会重用的代码，良好的做法是将其制成包，这样你就不需要复制粘贴，或尝试记住你上次在哪里使用过它；以后你只需要在未来导入该包即可。当你准备好创建自己的包时，你需要进入\
    \ Go 编程环境和工作区。在你的目录中，创建一个存放该包的目录名称——这通常与包本身的名称相同，以便导入。惯例是将目录中的第一个文件命名为与目录相同。\n\
    \n假设你想创建一个名为 `greeting` 的包。目录名将是 `greeting`，文件名将是 `greeting.go`。编写程序时，打开该文件。\n\
    \n当你编写包时，第一行应该是你正在创建的包名。然后导入你需要的任何包，比如 `fmt`。对于这个自定义包的示例，我们将在代码中使用标志性的 Hello,\
    \ World!。一旦你写了这个包，任何你想使用它的时候，只需要导入该包即可。\n\n```go\npackage greeting // 此文件中的所有内容将包含在包中\n\
    \nimport \"fmt\"\n\nfunc Hello() {\n    fmt.Println(\"Hello, World!\")\n}\n```\n\
    \n你可以将此包引入可执行文件或入口点，通常命名为 `main.go`。这里是调用该包时的样子：\n\n```go\npackage main\n\nimport\
    \ \"greeting\"\n\nfunc main() {\n    greeting.Hello() // 使用点符号符号调用导入包中的函数 (Hello)\n\
    }\n```\n\n你还可以向你的包中添加变量和类型；其语法应该在之前的示例中看起来熟悉。首先，向你的包添加你需要的内容。以下代码显示对 `greeting`\
    \ 的修改：\n\n```go\npackage greeting\n\nimport \"fmt\"\n\nvar Pet = \"Powerpuff\"\
    \ // 添加变量\n\ntype Unicorn struct { // 添加类型\n    Name  string\n    Color string\n\
    }\n\nfunc (u Unicorn) String() string {\n    return fmt.Sprintf(\"独角兽的名字是 %s，颜色是\
    \ %s\", u.Name, u.Color)\n}\n\nfunc Hello() {\n    fmt.Println(\"Hello, World!\"\
    )\n}\n```\n\n调用包时，你的代码如下：\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n  \
    \  \"greeting\"\n)\n\nfunc main() {\n    greeting.Hello()\n    fmt.Println(greeting.Pet)\n\
    \    uni := greeting.Unicorn{\n        Name:  \"Petunia\",\n        Color: \"\
    fuchsia\",\n    }\n    fmt.Println(uni.String())\n}\n```\n\n"
