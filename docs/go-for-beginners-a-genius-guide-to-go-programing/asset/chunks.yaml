    \ Shape must also have two methods to avoid the error.\n\n## Sorter Interface\n\
    \nIn previous chapters, you discovered how to sort with basic types using Golang.\
    \ *sort.Interface* is used to sort more complex data types. This interface comes\
    \ with three specific functions:\n\n1.  Len: returns the length of the collection\n\
    \n2.  Less: receives two integers that act as indices from the collection\n\n\
    3.  Swap: performs the necessary change from calling the Less method\n\nThe syntax\
    \ is the following:\n\n> Type Interface interface\n\n> \n\n> Len() int\n\n> \n\
    \n> Less (i, j) bool\n\n> \n\n> Swap(i, j int)\n\nUsing sort.interface allows\
    \ you to use any logic you like in sorting. Instead of enforcing *what* the algorithm\
    \ should do, it knows *how* to do it.\n\nSuppose you wanted to sort a list of\
    \ strings according to the length of the strings:\n\n> package main\n\n> \n\n\
    > import (\n\n> \n\n> “fmt”\n\n> \n\n> “sort”\n\n> \n\n> )\n\n> \n\n> //assign\
    \ a type byLength that’s basically an alias for string = Interface interface\n\
    \n> \n\n> type byLength \\[\\]string\n\n> \n\n> //implement sort.Interface\n\n\
    > \n\n> func (s byLength) Len() int {\n\n> \n\n> return len(s)\n\n> \n\n> }\n\n\
    > \n\n> func (s byLength) Swap(i, j int) {\n\n> \n\n> s\\[i\\], s\\[j\\] = s\\\
    [j\\], s\\[i\\]\n\n> \n\n> }\n\n> \n\n> //typically Less holds the custom sorting\
    \ logic\n\n> \n\n> //since sorting shortest to longest string length, using len(s\\\
    [i\\]) and len(s\\[j\\])\n\n> \n\n> func (s byLength) Less(i, j int) bool {\n\n\
    > \n\n> return len(s\\[i\\]) < len(s\\[j\\])\n\n> \n\n> }\n\n> \n\n> func main()\
    \ {\n\n> \n\n> breeds := \\[\\]string{“Labradoodle”, “Chiweenie”, “Shiapso”}\n\
    \n> \n\n> sort.sort (byLength(breeds))\n\n> \n\n> fmt.Println(breeds)\n\n> \n\n\
    > }\n\nThe output looks like this:\n\n> *\\[Shiapso Chiweenie Labradoodle\\]*\n\
    \n## Reading and Writing\n\nWhat you might not have realized until now is that\
    \ many of the Go standard library components are interfaces. Error, for example,\
    \ is simply an interface with a method error that consumes nothing and returns\
    \ a string. Similarly, *io* is a package that contains interfaces for use with\
    \ a variety of operations and use cases around both input and output. It’s used\
    \ to wrap input/output primitives (such as in package os) into shared public interfaces.\n\
    \nIn the io.Writer interface, there’s just one method—Write—which allows developers\
    \ to write a byte slice into a stream of data or write data into code that implements\
    \ the io.Writer interface. It takes the byte slice p, writes it into the underlying\
    \ data, and then returns n number of bytes written, and if an error exists, *err*\
    \ . The syntax is:\n\n> type Writer interface {\n\n> \n\n> Write (p \\[\\]byte)\
    \ (n int, err error)\n\n> \n\n> }\n\nThis is flexible enough to be used in a variety\
    \ of different applications. For example, you could create a writer that encodes\
    \ the byte string into .jpeg and write to a specific file, or encodes to mp3 and\
    \ writes to an audio device. Interfaces are the primary tool for abstraction in\
    \ Golang, and io.Write provides a lot of flexibility for this type of tool.\n\n\
    For the read version of a stream of data, the standard library contains io.Reader.\
    \ There are a variety of ways to implement it that are also included in the stlib,\
    \ including compressors, ciphers, and network connections. Similar to the io.Writer\
    \ syntax, io.Reader populates the byte slice b with data. It returns n number\
    \ of bytes populated, as well as an error function err. When the stream ends,\
    \ you’ll get an io.EOF error. The interface appears like so:\n\n> func T Read(b\
    \ \\[\\]byte) (n int, err error)\n\nUsers of Go are well-served when coders include\
    \ io.Reader whenever possible for data sources. Because there are so many types\
    \ that it can work with, your code now works for many more users.\n\nFor example,\
    \ suppose you’re thinking about the reverse function on a string:\n\n> func Reverse(s\
    \ string) (string, error)\n\nOr, instead, of using the single-method io.Reader:\n\
    \n> func Reverse(r io.Reader) io.Reader\n\nNow, others can use that with strings,\
    \ files, web requests, etc., without having to write extra code as long as io.Reader\
    \ implements the type you’re using.\n\n## Empty\n\nAs mentioned earlier, the type\
    \ interface{} is the empty interface, and it can accept values of any type. Because\
    \ it’s empty, there are no methods required to satisfy it. As a result, every\
    \ type can satisfy it.\n\nIn the following example, the variable (manytype) is\
    \ declared to be an empty interface. Therefore, you can assign it values of different\
    \ types. Since the function printType() accepts the interface{}parameter, it likewise\
    \ takes any valid type.\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> func\
    \ printType(i interface{}) {\n\n> \n\n> fmt.Println(i)\n\n> \n\n> }\n\n> \n\n\
    > func main() {\n\n> \n\n> var manytype interface{}\n\n> \n\n> manytype = 10\n\
    \n> \n\n> fmt.Println(manytype)\n\n> \n\n> manytype = 50\n\n> \n\n> fmt.Println(manytype)\n\
    \n> \n\n> manytype = “cat”\n\n> \n\n> fmt.Println(manytype)\n\n> \n\n> printType(“Go\
    \ language”)\n\n> \n\n> var states = \\[\\]string{“California”, “Hawaii”, “New\
    \ York”, “Virginia”, “Illinois”}\n\n> \n\n> printType(states)\n\n> \n\n> var staff\
    \ = map\\[string\\] int{“Meg”: 27, “Jenny”: 31}\n\n> \n\n> printType(staff)\n\n\
    > \n\n> state := \\[2\\]string{“Hawaii”, “Massachusetts”}\n\n> \n\n> }\n\nYour\
    \ output reads as follows:\n\n> *10*\n\n> \n\n> *50*\n\n> \n\n> *cat*\n\n> \n\n\
    > *Go language*\n\n> \n\n> *\\[California Hawaii New York Virginia Illinois\\\
    ]*\n\n> \n\n> *map\\[Meg: 27 Jenny: 31\\]*\n\n> \n\n> *\\[Hawaii Massachusetts\\\
    ]*\n\nEmpty interfaces are valuable for handling values with unknown types. If\
    \ you’re creating an output library, you’d need a function that receives values\
    \ and then passes them to the usual output.\n\nRather than trying to write code\
    \ for every value you come up with, the empty interface allows Go to convert at\
    \ runtime. If you’re sending them to a printout, it doesn’t matter what type it\
    \ is. As long as the code can handle it, your program will work.\n\n## Reflect\
    \ Package\n\nNot all languages provide the ability to examine their structure,\
    \ but Go does through *reflection* . It’s based on types. At compile time, every\
    \ variable has a static type that can only be changed through conversion. Interface\
    \ types represent a fixed set of methods, and an interface variable can implement\
    \ any dynamic (non-interface) value as long as that value implements the interface’s\
    \ methods.\n\nYou now know that io.Reader is an interface and a variable that\
    \ has the type io.Reader can hold any value that has a Read method in it. All\
    \ the following are acceptable because they have Read methods (don’t worry if\
    \ they are not familiar to you yet):\n\n*   var r io.Reader\n\n*   r = os.Stdin\n\
    \n*   r = bufio.NewReader(r)\n\n*   r = new(bytes.Buffer)\n\n*   //and plenty\
    \ more!\n\nHowever, the key here is that no matter what concrete value r holds,\
    \ its type is always io.Reader.\n\nThe variable of interface type stores a pair,\
    \ which consists of the concrete value assigned to that variable and the value’s\
    \ type descriptor. Here the value is the concrete piece of data that implements\
    \ the interface."
