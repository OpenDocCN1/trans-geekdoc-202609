    \ := \\[\\]string{“Red”, “Orange”, “Yellow”}\n\n> \n\n> slice2 := \\[\\]string{“Green”,\
    \ “Blue”, “Violet”}\n\n> \n\n> slice3 := append(slice1, slice2, …)\n\n> \n\n>\
