    \n> \n\n> }\n\n> \n\n> }\n\nHowever, if you want the program to do one thing if\
    \ the condition is true and another if it’s false, you’ll need an *if-else statement.*\
    \ As you’ve probably guessed, these statements take this form:\n\n> If condition\
    \ {\n\n> \n\n> //code that will be executed if the condition is true\n\n> \n\n\
    > } else {\n\n> \n\n> //code that will be executed if the condition is false\n\
    \n> \n\n> }\n\nIn this example, the output is Pass if x>= 60:\n\n> package main\n\
    \n> \n\n> import (\n\n> \n\n> “fmt”\n\n> \n\n> )\n\n> \n\n> func main () {\n\n\
    > \n\n> x : =75\n\n> \n\n> If x >= 60 {\n\n> \n\n> fmt.println(“Pass”)\n\n> \n\
    \n> } else {\n\n> \n\n> fmt.println(“Fail”)\n\n> \n\n> }\n\n> \n\n> }\n\nThe else\
    \ section is only executed when necessary; if the condition is true, the rest\
    \ of it is ignored.\n\nIf-else statements can have multiple else or alternative\
    \ statements. In Go, they’re known as if-else if-else statements. They’re written\
    \ like so:\n\n> If condition-1 {\n\n> \n\n> //code that will be executed if condition-1\
    \ is true\n\n> \n\n> } else if condition-2 {\n\n> \n\n> //code that will be executed\
    \ if condition-2 is true\n\n> \n\n> { else {\n\n> \n\n> //code that will be executed\
    \ if both conditions are false\n\n> \n\n> }\n\nIn this example, grades are on\
    \ a high-pass, pass, or fail basis. If x>= 90, then the output is high-pass. 60\
    \ is the cutoff between pass and fail.\n\n> package main\n\n> \n\n> import (\n\
    \n> \n\n> “fmt”\n\n> \n\n> )\n\n> \n\n> func main () {\n\n> \n\n> x := 95\n\n\
    > \n\n> If x >= 90 {\n\n> \n\n> fmt.println(“High-pass”)\n\n> \n\n> } else if\
    \ x>= 60 {\n\n> \n\n> fmt.println(“Pass”)\n\n> \n\n> } else {\n\n> \n\n> fmt.println(“Fail”)\n\
    \n> \n\n> }\n\n> \n\n> }\n\n## Switch-Case\n\nLooking for an easier way to write\
    \ multiple if-else statements? *Switch* is a shorter way to write the sequence.\
    \ It’s similar to the switch you might have used in C, C++, or Java. However,\
    \ in Go, the control switch runs the first case where the condition is true and\
    \ ignores the remainder. Switch cases don’t need to be constants, and the values\
    \ don’t have to be integers, either. You can use commas to separate expressions\
    \ in the *case* if there is more than one. Here’s an example of a switch case\
    \ to tell you whether it’s a weekday or a weekend.\n\n> package main\n\n> \n\n\
    > import (\n\n> \n\n> “fmt”\n\n> \n\n> )\n\n> \n\n> func main () {\n\n> \n\n>\
    \ switch time.Now() . Weekday (){\n\n> \n\n> case time.Saturday, time.Sunday:\n\
    \n> \n\n> fmt.Println(“It’s the weekend”)\n\n> \n\n> default:\n\n> \n\n> fmt.Println(“It’s\
    \ a weekday”)\n\n> \n\n> }\n\n## For\n\nA *for loop* is the only looping construct\
    \ in Go. It’s used to repeat statements until the condition is met. If there was\
    \ no condition to be met, or the program can’t meet it, it would be in an infinite\
    \ loop.\n\nTake a simple example, like listing numbers from one to ten. Without\
    \ a loop construct, you’d have to write ten statements:\n\n> fmt.Println(1)\n\n\
    > \n\n> fmt.Println(2)\n\n> \n\n> fmt.Println(3)\n\n> \n\n> fmt.Pri\n\n> \n\n\
    > ntln(4)\n\n> \n\n> fmt.Println(5)\n\n… until you got to fmt.Println(10).\n\n\
    With a for loop, you only need to write it once.\n\n> x :=1\n\n> \n\n> for x <=\
    \ 10 {\n\n> \n\n> fmt.Println (x)\n\n> \n\n> x += 1\n\n> \n\n> }\n\nHere, you’re\
    \ telling the program to check if x is less than or equal to 10. If so, x is printed\
    \ to the console or screen. Next is x+1, and if that is less than or equal to\
    \ 10, it also gets printed. Note that if you don’t add the +1 element, x is always\
    \ 1, and that gets printed in an infinite loop.\n\nYou can also shorten the language\
    \ for the for loop. In this case, you would write:\n\n> for x :=1; x <= 10; x++\
    \ {\n\n> \n\n> fmt.Println(x)\n\n> \n\n> }\n\nThe first line assigns x to 1, checks\
    \ if x is less than or equal to 10, and adds 1 in case the previous condition\
    \ (that x <=10) is true. The second line is the statement to be executed.\n\n\
    ## For Range\n\nThe for loop is used to repeat for a variety of elements in data\
    \ structures, such as arrays, slices, maps, strings, and channels. You’ll learn\
    \ more about those in later chapters. The *for range* statement uses the keyword\
    \ *range* to repeat an expression that evaluates an array, slice, map, etc.\n\n\
    For the sake of this example, let’s suppose you had a slice (don’t worry about\
    \ what that is yet) and wanted to add the numbers in it:\n\n> nums := \\[\\]int{2,3,4}\n\
    \n> \n\n> sum :=0\n\n> \n\n> for\\_, num := range nums {\n\n> \n\n> sum += num\n\
    \n> \n\n> }\n\n> \n\n> fmt.Println(“Sum:”,sum) //which would result in the output\
    \ of sum: 9\n\n## Break and Continue\n\nThese controls help you add logic into\
    \ your Go program to control the operations. The *break statement* ends the current\
    \ loop and is usually paired with an “if” statement.\n\nThe following program\
    \ shows how the break and a conditional if statement work together.\n\n> package\
    \ main\n\n> \n\n> import (\n\n> \n\n> “fmt”\n\n> \n\n> )\n\n> \n\n> func main\
    \ () {\n\n> \n\n> for x :=0; x < 10; x++ { // check to see if x is less than 10;\
    \ if so, add 1\n\n> \n\n> if x == 5 {\n\n> \n\n> fmt.Println(“Breaking out of\
    \ loop”)\n\n> \n\n> break // here’s the command to break when x reaches 5\n\n\
    > \n\n> }\n\n> \n\n> fmt.Println (“The value of x is”, x) // if there’s no break\n\
    \n> \n\n> }\n\n> \n\n> fmt.Println(“Exiting program”)\n\n> \n\n> }\n\nThe output\
    \ from this program reads like this:\n\n> *The value of x is 0*\n\n> \n\n> *The\
    \ value of x is 1*\n\n> \n\n> *The value of x is 2*\n\n> \n\n> *The value of x\
    \ is 3*\n\n> \n\n> *The value of x is 4*\n\n> \n\n> *Breaking out of loop*\n\n\
    > \n\n> *Exiting program*\n\nIf you nest loops inside each other, a break in an\
    \ inner loop won’t necessarily mean a break in the outer loop.\n\nInstead of breaking\
    \ a loop, maybe you want to skip the rest of the loop and return to the top of\
    \ it and repeat. That’s what the *continue statement* in Golang is for.\n\nFor\
    \ example, we could change the program above not to stop and exit when x = 5,\
    \ but to skip 5 and keep going until the number 10 is reached:\n\n> package main\n\
    \n> \n\n> import (\n\n> \n\n> “fmt”\n\n> \n\n> )\n\n> \n\n> func main () {\n\n\
    > \n\n> for x :=0; x < 10; x++ {\n\n> \n\n> if x == 5 {\n\n> \n\n> fmt.Println(“Continuing\
    \ loop”)\n\n> \n\n> continue // instead of break when x is 5\n\n> \n\n> }\n\n\
    > \n\n> fmt.Println (“The value of x is”, x)\n\n> \n\n> }\n\n> \n\n> fmt.Println(“Exiting\
    \ program”)\n\n> \n\n> }\n\nNow you’ll get a different result, which continues\
    \ the loop at 5 instead of ending it.\n\n> *The value of x is 0*\n\n> \n\n> *The\
    \ value of x is 1*\n\n> \n\n> *The value of x is 2*\n\n> \n\n> *The value of x\
    \ is 3*\n\n> \n\n> *The value of x is 4*\n\n> \n\n> *Continuing loop*\n\n> \n\n\
    > *The value of x is 6*\n\n> \n\n> *The value of x is 7*\n\n> \n\n> *The value\
    \ of x is 8*\n\n> \n\n> *The value of x is 9*\n\n> \n\n> *Exiting program*\n\n\
    The continue statement is often used where you need a loop, but want to eliminate\
    \ common cases that you don’t want in the program. Using continue also helps you\
    \ avoid multiple nests of conditions.\n\n## Labels: Goto\n\nLike the break and\
    \ continue statements, *goto* alters the execution of a program and instructs\
    \ the computer to *go to* a labeled statement and run the program from there.\
    \ The label is an identifier written in plain text, and it can be anywhere in\
    \ the program above or below the goto statement. Like continue and break, goto\
    \ is often used with if and if-else controls.\n\nIn this example, you get different\
    \ answers depending on what age you input.\n\n> package main\n\n> \n\n> import\
    \ “fmt”\n\n> \n\n> func main () {\n\n> \n\n> var age int\n\n> \n\n> election:\
    \ //this is the label\n\n> \n\n> fmt.Println(“Enter your age ”)\n\n> \n\n> fmt.Scanln(&age)\
    \ //user enters age\n\n> \n\n> if (age <= 17) {\n\n> \n\n> fmt.Println(“You are\
    \ not eligible to vote.”)\n\n> \n\n> goto election\n\n> \n\n> } else {\n\n> \n\
    \n> fmt.Println(“You are eligible to vote.”)\n\n> \n\n> }\n\n> \n\n> }\n\nThe\
    \ output might look something like this:\n\n> *Enter your age 16*\n\n> \n\n> *You\
    \ are not eligible to vote.*\n\n> \n\n> *Enter your age 17*\n\n> \n\n> *You are\
    \ not eligible to vote.*\n\n> \n\n> *Enter your age 20*\n\n> \n\n> *You are eligible\
    \ to vote.*"
