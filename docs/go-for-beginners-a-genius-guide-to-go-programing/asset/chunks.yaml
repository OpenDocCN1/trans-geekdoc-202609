- raw: "> func main() }\n\n> \n\n> buffy := Employee { //using := here allows Go to\
    \ infer the type for Employee automatically\n\n> \n\n> firstName: “buffy”,\n\n\
    > \n\n> lastName : “Vampireslayer”,\n\n> \n\n> fullTime: true,\n\n> \n\n> salary:\
    \ 10000,\n\n> \n\n> }\n\n> \n\n> fmt.Println(buffy)\n\n> \n\n> }\n\nThe output\
    \ on the screen is as follows:\n\n> *{buffy Vampireslayer 10000 true}*\n\n## Anonymous\
    \ Structs\n\nWith no explicit definition for the struct type, you have an *anonymous\
    \ struct* . Many developers use these when they don’t want to reuse a struct type.\
    \ To create one, you’ll need to write a struct using the same syntax for the initial\
    \ values and the inline struct type.\n\n> package main\n\n> \n\n> import “fmt”\n\
    \n> \n\n> func main () {// notice there’s no declaration of struct type before\
    \ this statement\n\n> \n\n> giles := struct {\n\n> \n\n> firstName, lastName string\n\
    \n> \n\n> salaryint\n\n> \n\n> fullTimebool\n\n> \n\n> {}\n\n> \n\n> firstName:\
    \ “Giles”,\n\n> \n\n> lastName: “Professor”,\n\n> \n\n> salary: 20000,\n\n> \n\
    \n> }\n\n> \n\n> fmt.Println(giles)\n\n> \n\n> }\n\nThe output shows up as follows:\n\
    \n> *{Giles Professor 20000 false}*\n\nWhen you only define the data types, Golang\
    \ uses the data type declarations (keywords) as the field names. Since a struct\
    \ field can be any data type, it can also be a struct. In other words, a struct\
    \ can have a struct type as a data type. These are known as *nested* (or *embedded*\
    \ ) *structs* .\n\nYou can access a field using dot notation that returns a struct,\
    \ and similarly you can find or update a field in a nested struct. Suppose, using\
    \ the example above, you wanted to access the salary field:\n\nbuffy.salary returns\
    \ a struct, then\n\nbuffy.salary.bonus is involved in the nested struct shown\
    \ below:\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> type Compensation\
    \ struct {\n\n> \n\n> basic int // note these are fields inside the Compensation\
    \ struct\n\n> \n\n> healthins int\n\n> \n\n> bonus int\n\n> \n\n> }\n\n> \n\n\
    > type Employee struct {\n\n> \n\n> lastName, firstName string\n\n> \n\n> salaryCompensation\
    \ // struct above, nested\n\n> \n\n> bool//anonymous\n\n> \n\n> }\n\n> \n\n> func\
    \ main() {\n\n> \n\n> buffy := Employee{\n\n> \n\n> firstName: Buffy,\n\n> \n\n\
    > lastName: Vampireslayer,\n\n> \n\n> bool: true,\n\n> \n\n> salary: Compensation{10000,\
    \ 9999, 50000} //the nested struct returned\n\n> \n\n> }\n\n> \n\n> fmt.Println(“Buffy’s\
    \ bonus compensation”, buffy.salary.bonus) //returns the bonus field\n\n> \n\n\
    > }\n\nThe output is\n\n> *Buffy’s bonus compensation 50000*\n\nWhen you use an\
    \ anonymous struct where you’ve left out the field name, you can also create a\
    \ nested anonymous struct. All the nested fields are available to the parent struct\
    \ with *field promotion* .\n\nAnother field type that a struct can take is a function.\
    \ Here’s an example where the struct has two fields, one a string and the other\
    \ a function:\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> type FullNameType\
    \ func(string, string) string\n\n> \n\n> type Employee struct {\n\n> \n\n> FirstName,\
    \ LastName string\n\n> \n\n> FullNameFullNameType\n\n> \n\n> }\n\n> \n\n> func\
    \ main() {\n\n> \n\n> e := Employee{ //struct e needs to have the same syntax\
    \ for the function type\n\n> \n\n> FirstName: “Buffy”,\n\n> \n\n> LastName: “Vampireslayer”,\n\
    \n> \n\n> FullName: func(firstName string, lastName string) string {\n\n> \n\n\
    > return firstName + “ “ + lastName\n\n> \n\n> },\n\n> \n\n> }\n\n> \n\n> fmt.Println(e.FullName(e.FirstName,\
    \ e.LastName)) // executing the function e.FullName\n\n> \n\n> }\n\nAs a result,\
    \ your output is simply\n\n> *Buffy Vampireslayer*\n\n## Metadata and Tags\n\n\
    Structs in Golang also give you the ability to add *metadata* to the fields. This\
    \ is helpful when you want to provide information on how to encode or decode when\
    \ you’re translating to or from a different format, or plan to store or retrieve\
    \ it from another database. That being said, you can store whatever you want,\
    \ whether it’s for yourself or a separate package. You define it through a string\
    \ literal.\n\nSuppose you’re storing metadata to use the struct for JSON encoding\
    \ or decoding purposes. (JSON is a well-known data interchange format used for\
    \ communication between many web applications.) We’ll use it here to show the\
    \ metadata syntax:\n\n> type Employee struct {\n\n> \n\n> firstNamestring \\`json:\
    \ “firstName”\\`\n\n> \n\n> lastNamestring \\`json: “lastName”\\`\n\n> \n\n> salary\
    \ int \\`json: “salary”\\`\n\n> \n\n> fullTimeint\\`json: “fullTime”\\`\n\nThis\
    \ leads us to *struct tags,* which are short strings that are assigned some value\
    \ and set off with backticks (\\`). They don’t affect your Go code unless another\
    \ code will examine them.\n\n## Chapter Summary\n\nStructs are collections of\
    \ data fields that enable you to pass complex information in your code, similarly\
    \ to classes in object-oriented programming.\n\n*   Structs are like recipes for\
    \ the data your structure will hold; there are several ways to declare and initialize\
    \ them.\n\n*   Without an explicit definition for the struct type, you have an\
    \ anonymous struct that programmers like to use so they don’t have to reuse a\
    \ struct type.\n\n*   Struct fields can also be struct types, in which you have\
    \ a nested or embedded struct.\n\n*   Adding struct tags allows you to annotate\
    \ the code with instructions that can be read by other packages (or formats) without\
    \ affecting the Golang code you’ve written.\n\nIn the next chapter, you’ll learn\
    \ about packages.\n\nEight \n\nAs we’ve discussed, Go was developed by Google\
    \ engineers who wanted better, faster code. A key principle in writing high-quality\
    \ programs is DRY: Don’t Repeat Yourself. If you’re copying and pasting, you’re\
    \ doing something wrong.\n\nThere are two major ways that Golang was engineered\
    \ for DRY and reusability. The most basic is the use of functions, and the other\
    \ is the concept of a package. A *package* is a directory that contains source\
    \ files and/or other Go packages. Related source files are collected in a way\
    \ that makes them modular and reusable in other code that you’re writing.\n\n\
    Every source file that you use must belong to a package. The first line of code\
    \ for any source file must be the package declaration as follows:\n\n> package\
    \ packagename\n\nAll types, variables, and functions in your source file become\
    \ part of that package. You can export something defined in one package to another\
    \ package, or keep it for use inside that specific one. If you export them, other\
    \ packages can import them and use whatever functions, variables, etc. are in\
    \ the export.\n\n## Standard Library Overview\n\nYou’ve seen the import of the\
    \ *fmt* package in the examples shown in the book—it’s a core library package\
    \ that includes functionalities related to formatting and printing output (to\
    \ the screen), as well as reading certain types of input. When you import it into\
    \ your program, you’re able to access items like Println() and Printf().\n\nIf\
    \ you’re wondering why it’s so important to collect these functions together in\
    \ a package or to have packages in general, consider how they help you as a programmer\
    \ to follow the DRY principle.\n\n*   Reduces naming conflicts\n\nBy having the\
    \ same function names in different packages, you run into fewer issues with naming.\
    \ It also improves your speed as a programmer by not trying to come up with a\
    \ separate name every time you code that avoids conflicting with something else\
    \ you wrote.\n\n*   Organizes code that you want to reuse\n\nThis is key for DRY!\
    \ Being able to quickly access functions and code that you’ve previously written\
    \ means fewer repeats. You import the ones you want without writing more code,\
    \ which speeds you up as a developer. Sure, you could go hunting for source files;\
    \ maybe you had a Println() in one file and Printf() in a completely different\
    \ one. Maybe you remember that you had it earlier (and maybe you don’t), but collecting\
    \ similar files together means you don’t have to go hunting for the code you used\
    \ before.\n\n*   Speeds up the execution\n\nSince Go makes use of a compiler,\
    \ having to re-compile for a new program that uses a previous function would slow\
    \ the program down quite a bit. Instead, only the parts that have changed must\
    \ be re-compiled."
