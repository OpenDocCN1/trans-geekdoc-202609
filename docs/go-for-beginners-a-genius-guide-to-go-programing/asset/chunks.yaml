    \n> \n\n> fmt.Println(“slice3 = “, slice3)\n\n> \n\n> }\n\nAs you probably expected,\
    \ the output is as follows:\n\n> *slice1 = \\[Red Orange Yellow\\]*\n\n> \n\n\
    > *slice2 = \\[Green Blue Violet\\]*\n\n> \n\n> *slice3 = \\[Red Orange Yellow\
    \ Green Blue Violet\\]*\n\n## Strings, Arrays, and Slices\n\nSince arrays are\
    \ not very flexible, Go programmers tend to use slices more than arrays. Strings\
    \ are just read-only slices; you can index them to return bytes and slice them\
    \ to make a substring, which is very efficient. Golang allows you to create a\
    \ string from a byte slice:\n\n> str =: string(slice)\n\n> \n\n> And reverse back\
    \ to a byte slice:\n\n> \n\n> slice =: \\[\\]byte()\n\n## Sorting and Inverting\n\
    \nWhen it comes to slices in Go, there are three sorting functions. Which you\
    \ use will depend on the type of data you’re sorting, but all of them will sort\
    \ slices in ascending order.\n\n1.  sort.Strings\n\n2.  sort.Ints\n\n3.  sort.Floats64\n\
    \nThese will all sort the keys according to the type that you have. Here’s an\
    \ example for sorting ints:\n\n> package main\n\n> \n\n> import “fmt”, “sort”\n\
    \n> \n\n> func main() {\n\n> \n\n> primes := \\[\\]int{2, 11, 3, 19, 13, 7, 5,\
    \ 17}\n\n> \n\n> sort.Ints(primes)\n\n> \n\n> fmt.Println(primes)\n\n> \n\n> }\n\
    \nHere’s what the output looks like:\n\n> *\\[2 3 5 7 9 11 13 17 19\\]*\n\nThere\
    \ are functions that you can use to determine whether your strings, ints, or floats\
    \ are sorted correctly. As you may have already guessed, there’s a separate function\
    \ for each.\n\n*   Strings: StringsAreSorted\n\nfunc StringsAreSorted (a string\\\
    [\\]) bool // returns true if they’re sorted, false otherwise\n\nLet’s look at\
    \ a sort check and sort with strings.\n\n> package main\n\n> \n\n> import “fmt”,\
    \ “sort”\n\n> \n\n> func main() {\n\n> \n\n> animals := {“cow”, “bear”, “coyote”,\
    \ “panther”, “wildebeest”}\n\n> \n\n> sorted := StringsAreSorted(animals)\n\n\
    > \n\n> fmt.Println(sorted)\n\n> \n\n> sort.Sort(sort.Stringslice(animals))\n\n\
    > \n\n> sorted = sort.StringsAreSorted(animals)\n\n> \n\n> fmt.Println(sorted)\n\
    \n> \n\n> }\n\nYour output is the following:\n\n> *false*\n\n> \n\n> *true*\n\n\
    *   Ints: IntsAreSorted\n\n> *func IntsAreSorted (int\\[\\]) bool // returns true\
    \ if they’re sorted, false otherwise*\n\n*   Float64: Float64sAreSorted\n\n> *In\
    \ Float64 sorts, the NaN (not a number) items come first. Its function is also\
    \ similar to ints and strings.*\n\n> \n\n> *func (Float64sAreSorted)(x \\[\\]float64)\
    \ bool*\n\nCustom sorts are also available in Golang. One function to use is *sort.Slice*\
    \ , which in turn uses the *less* function:\n\n> less(i, j int) bool //shows whether\
    \ element with index i comes before j\n\nIf you want to sort while keeping the\
    \ same order for elements that are identical to each other, use *sort.Slicestable*\
    \ instead, which also retains the less function above. Also, if you want j to\
    \ come before i, you can use the swap function:\n\n> swap(i, j int)\n\nNow let’s\
    \ see this in action:\n\n> package main\n\n> \n\n> import “fmt”, “sort”\n\n> \n\
    \n> func main() {\n\n> \n\n> jonesFamily := struct { // don’t worry, we’ll get\
    \ further into struct in a later chapter\n\n> \n\n> Name string\n\n> \n\n> Age\
    \ int\n\n> \n\n> }{\n\n> \n\n> {“Caesaria”, 22},\n\n> \n\n> {“Augustus”, 22},\n\
    \n> \n\n> {“Julius”, 3}\n\n> \n\n> {“Octavia”, 4}\n\n> \n\n> }\n\n> \n\n> sort.Slicestable(jonesFamily,\
    \ func (i, j int) bool {\n\n> \n\n> return jonesFamily\\[i\\]. age < jonesFamily\\\
    [j\\].age\n\n> \n\n> })\n\n> \n\n> fmt.printLn(jonesFamily)\n\nThe output as follows:\n\
    \n> *\\[{Julius 3} {Octavia 4} {Caesaria 22} {Augustus 22}\\]*\n\nIn general,\
    \ you can use the custom sorts sort.Sort and sort.Stable to perform customized\
    \ sorts. The syntax to use is:\n\n> type Interface interface {\n\n> \n\n> Len\
    \ int // recall that len is the number of elements in the collection\n\n> \n\n\
    > Less(i, j int) bool\n\n> \n\n> Swap(i, j int) // if you want to list in reverse\
    \ order\n\nThis is how to swap the order of jonesFamily above:\n\n> type Person\
    \ struct {\n\n> \n\n> Name string\n\n> \n\n> Age int\n\n> \n\n> }\n\n> \n\n> type\
    \ byAge \\[\\] Person // starting to implement sort.Interface by age\n\n> \n\n\
    > func(a ByAge) Len() int {return len(a)}\n\n> \n\n> func(a ByAge) Less(i, j int)\
    \ bool {return a\\[i\\].Age < a\\[j\\].Age}\n\n> \n\n> func(a ByAge) Swap(i, j\
    \ int){return a\\[i\\], a\\[j\\] = a\\[j\\], a\\[i\\]}\n\n> \n\n> func (main)\
    \ {\n\n> \n\n> jonesFamily := Person\\[\\]{\n\n> \n\n> {“Caesaria”, 22},\n\n>\
    \ \n\n> {“Augustus”, 22},\n\n> \n\n> {“Julius”, 3}\n\n> \n\n> {“Octavia”, 4}\n\
    \n> \n\n> }\n\n> \n\n> sort.Stable(byAge(jonesFamily))\n\n> \n\n> fmt.Println(jonesFamily)\
    \ // \\[{Julius 3} {Octavia 4} {Caesaria 22} {Augustus 22}\\]\n\nYou can also\
    \ sort in reverse order with the keys, using the reverse function for ints and\
    \ strings. The syntax for that is as follows:\n\n> func reverse (data Interface)\
    \ Interface\n\nLet’s see how this works by sorting ages in a company in descending\
    \ order from highest to lowest.\n\n> package main\n\n> \n\n> import “fmt”\n\n\
    > \n\n> func main() {\n\n> \n\n> num :=int{36, 45, 52, 29}\n\n> \n\n> sort.Sort(sort.Reverse(sort.Intslice(num)))\n\
    \n> \n\n> fmt.Println(num)\n\n> \n\n> }\n\nThe output using reverse sorts looks\
    \ like this:\n\n> *\\[52, 45, 36, 29\\]*\n\n## Chapter Summary\n\nSlices provide\
    \ an easy way to work with arrays and strings in Golang.\n\n*   Slices describe\
