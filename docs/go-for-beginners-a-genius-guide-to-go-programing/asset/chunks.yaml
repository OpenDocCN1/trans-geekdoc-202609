    \        fmt.println(\"Pass\")\n    } else {\n        fmt.Println(\"Fail\")\n\
    \    }\n}\n```\n\n## Switch-Case\n\n正在寻找更简单的方法来编写多个 if-else 语句吗？`switch` 是编写该序列的一种更短的方法。它类似于你可能在\
    \ C、C++ 或 Java 中用过的 switch。然而，在 Go 中，控制 switch 会运行第一个条件为真的 case 并忽略剩余部分。`switch`\
    \ case 不需要是常量，且值也不必须是整数。如果 `case` 中有多个表达式，你可以使用逗号进行分隔。这里有一个 `switch case` 的示例，用于判断当前是工作日还是周末。\n\
    \n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\nfunc main () {\n    switch\
