    \ another goroutine reads it\n    //activate main goroutine\n    fmt.Println(\"\
    Main() stopped\")\n}\n```\n\nYou’d end up with results that look like:\nMain()\
    \ started\nHello Jane!\nMain() stopped\n\nWhen a channel is read or written to,\
    \ that goroutine is blocked and control gets passed to other goroutines. If, however,\
