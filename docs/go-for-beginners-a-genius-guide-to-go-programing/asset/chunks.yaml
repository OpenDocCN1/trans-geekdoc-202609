    \n> \n\n> func remoteDeleteEmployee() {\n\n> \n\n> …\n\n> \n\n> }\n\n> \n\n> //the\
    \ channel sem allows up to 10 concurrent operations\n\n> \n\n> var sem = make(chan\
    \ int, 10)\n\n> \n\n> func main() {\n\n> \n\n> for\\_, employee := range employeeList\
    \ {\n\n> \n\n> //if there’s room in the sem channel for 1 integer, the goroutine\
    \ kicks off\n\n> \n\n> sem <- 1\n\n> \n\n> go func(){\n\n> \n\n> //once the remoteDeleteEmployee\
    \ call returns, channel sem is drained of the integer and the goroutine continues\n\
    \n> \n\n> remoteDeleteEmployee(employee.ID)\n\n> \n\n> <- sem\n\n> \n\n> } ()\n\
    \n> \n\n> }\n\n> \n\n> }\n\nIf sem is full, that means at least 10 are in progress.\
    \ If an 11th comes along, it’s blocked until one of the previous calls returns.\
    \ Here, we’re using a buffered channel.\n\nHowever, there’s another option that’s\
    \ a bit more sophisticated than a bounded channel, which is known as a *weighted\
    \ semaphore* . This technique will not block the code when it finds the sem variable\
    \ full. It also lets you specify how many units of the concurrency that you want\
    \ to limit.\n\nYou might want to limit concurrency, but not all the calls come\
    \ at the same cost. The *context* package makes it easier to pass request-scoped\
    \ calls, deadlines, and cancellation signals through an API to all the goroutines\
    \ that are involved in a specific request. A weighted semaphore requires ctx.\n\
    \nWeighted semaphore also gives you the ability to return error states, which\
    \ is a best practice when it comes to code with network calls, along with context.\
    \ You need to be able to instantiate it with a defined limit, be able to Acquire()\
    \ when access to the shared resource is requested, and Release() when the access\
    \ is complete. The weighted semaphore has three functions: Acquire (sem.Acquire(ctx,\
    \ 1) where ctx is context, discussed below in more detail. It is the same as sem\
