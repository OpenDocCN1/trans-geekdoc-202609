    \ and COMPLEMENT: `⌃`\n* CLEAR: `&⌃`\n\n### Arithmetic\n\nYou’re probably familiar\
    \ with these operations from math class. They include `+` for addition, `*` for\
    \ multiplication, `/` for division, and `%` for percentage.\n\n### Logical\n\n\
    While these operators are similar to the ones in other languages, Golang is strict\
    \ about the values that can be compared to each other.\n\n* Equal: `=`\n* Not\
    \ equal: `!=`\n* Less than: `<`\n* Less than or equal to: `<=`\n* Greater than:\
    \ `>`\n* Greater than or equal to: `>=`\n\n# Strings\n\nIn this language, strings\
    \ are a bit different from the way they work in C++, Python, Java, etc. They’re\
    \ immutable, or read-only. If you try to change a string, you’ll get an error.\
    \ The characters represent bytes that are UTF-8 encoded.\n\nWhy does the UTF-8\
    \ encoding matter? When computers were first designed, they used bytes of 8 bits\
    \ in binary code, and every letter of the English alphabet had its byte. (This\
    \ is known as the ASCII format.) There are 256 ways to use binary for coding,\
    \ and the English alphabet plus symbols only required 128.\n\nHowever, once speakers\
    \ of other languages wanted to program, having only 128 unique bytes left became\
    \ a problem. Enter Unicode, which gives each character a code point. It’s able\
    \ to generate about a million code points, which is enough for the planet—for\
    \ now, anyway!\n\nUTF-8, or Unicode Transformation Format, translates code points\
    \ into binary and vice versa. Due to the utility of UTF-8, you can use any language\
    \ in your strings.\n\nTypically, strings are set off with double quotes (`\"`)\
    \ at the beginning and end of the string. Check out this example:\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc main () {\n    var my_words string //using the\
    \ keyword var here\n    my_words = \"Hello world\"\n    //displaying the string\n\
    \    fmt.println(\"String: \", my_words)\n}\n```\nOutput: Hello world\n\nSometimes,\
    \ instead of using the double quotes, strings use backticks (``). This is common\
    \ when writing in HTML, when writing a message that takes multiple lines, and\
    \ when writing regular expressions.\n\n# Times and Dates\n\nIn Go, times include\
    \ a location. If it’s not specified, it defaults to UTC Coordinated Universal\
    \ Time. If you want a timestamp, `Now()` is used:\n\n```go\nNow()\n```\n\nFor\
    \ the date, `Date()` is used:\n\n```go\nDate(year, month, day, hour, min, nsec,\
    \ loc)\n```\n\nIf you want to know how long elapsed between instants, `Since()`\
    \ is used:\n\n```go\nSince(t)\n```\n\nIf you want to know how long until time,\
    \ `Until()` is used:\n\n```go\nUntil(t)\n```\n\n# Chapter Summary\n\nGolang is\
    \ similar to other languages, but if you program in Java, C++, or Python, it’s\
    \ important to remember what Go does differently.\n\n* The “vocabulary” of Go\
    \ is designed to be easily readable and clear.\n* Syntax rules for filenames,\
    \ identifiers, variables, constants, and keywords may share similarities with\
    \ other programs.\n* Go contains a variety of data types, and constants don’t\
    \ have to have their types specified—in fact, it’s often better to leave them\
    \ untyped.\n\nIn the next chapter, you'll learn about control structures.\n\n\
    # If-Else\n\nA simple *if statement* will execute if the condition is true. If\
    \ it’s false, nothing happens. If statements are written like so:\n\n```go\nif\
    \ condition {\n    //code that will be executed if the condition is true\n}\n\
    ```\n"
  trans: "\n这些包括指针类型、数组类型、结构体类型、映射类型等，将在后面的章节进一步讨论。\n\n# 常量\n\n与其他静态类型程序一样，编译器在编译时已经知道或可以推导出每个变量的类型。然而，与其他语言不同，Go\
    \ 不允许你混合数值类型。C、C++ 或 Java 在类型混合使用时，会将较小的类型（如 `int`）转换为较大的类型（如 `float`）。\n\nGolang\
    \ 工程师认为，允许这些自动转换不仅可能导致代码难以阅读，还会在不同平台之间产生不一致性。由于 Go 设计用于在各种架构上运行，因此该语言设计为要求显式类型。\n\
    \n除非你显式地给常量指定类型，否则即使你给它命名，它也会被视为无类型。整数类型的无类型常量只能在允许整数的地方。例如，你不能将整数常量赋值给字符串或布尔变量。无类型浮点常量可以使用任何允许浮点数的地方。\n\
    \nGo 中的所有无类型常量都有默认类型。整数常量默认为 `int`，浮点数默认为 `float64`，字符默认为 `rune` 等。当你声明一个类型时，该常量就变成了有类型的。再次，常量必须声明为其正确的类型，否则程序将返回错误。\n\
    \n除非绝对需要，否则在声明常量时不要指定类型；声明类型会让你失去在操作中混合类型的灵活性。\n\n Go 中的常量表达式有几条规则。\n\n* 两个无类型常量之间的比较结果是一个无类型布尔常量（`true`/`false`）。\n\
    * 相同类型的操作数结果为相同类型。换，如果是两个无类型整数常量，结果就是无类型整数常量。表达式 `11/2` 的结果是 `5` 而不是 `5.5`，因为它被截断为整数。\n\
    * 如果它们不是相同类型，根据以下逻辑结果为两者中范围更广的类型：`integer<rune<floating-point<complex`\n\n# 变量\n\
    \n在所有语言中，变量都是程序使用的特定存储区域的名称。变量名可以使用字母、数字和下划线。Golang 变量具有特定的大小、内存布局、内存布局的值范围以及可能的操作。变量定义告诉编译器为该变量创建多少存储以及将其放在何处。\n\
    \n`Lvalues` 用于引用内存位置，可以出现在赋值的左侧或右侧。`RValues` 指存储在内存中的数据值。变量是 lvalues 并出现在赋值的左侧。\n\
    \n当你声明变量时，将使用关键字 `var`。\n\n# 运算符\n\n大多数编程语言都有运算符，即执行各种数学或逻辑操作的内置符号。Go 有三种类型：位运算、算术和逻辑。\n\
    \n### 位运算\n\n这些运算符作用于相同位长度的变量（即整数）。\n\n* 与：`&`\n* 或：`⎸`\n* 异或与取反：`⌃`\n* 清零：`&⌃`\n\
    \n### 算术\n\n你可能在数学课上熟悉这些操作。它们包括用于加法的 `+`、乘法的 `*`、除法的 `/` 和取模 `%`。\n\n### 逻辑\n\n\
    虽然这些运算符与其他语言中的运算符相似，但 Golang 对可以相互比较的值非常严格。\n\n* 等于：`=`\n* 不等于：`!=`\n* 小于：`<`\n\
    * 小于等于：`<=`\n* 大于：`>`\n* 大于等于：`>=`\n\n# 字符串\n\n在这个语言中，字符串与它们在 C++、Python、Java\
    \ 等中的方式有所不同。它们是不可变的，或只读。如果你尝试更改字符串，将得到错误。字符代表 UTF-8 编码的字节。\n\n为什么 UTF-8 编码很重要？当计算机最初设计时，它们在二进制代码中使用\
    \ 8 位的字节，英语字母表中的每个字母都有自己的字节。（这被称为 ASCII 格式）。使用二进制编码有 256 种方式，而英语字母加上符号只需要 128\
    \ 种。\n\n然而，一旦其他语言的使用者想要编程，仅剩 128 个唯一字节就成了一个问题。Unicode 诞生了，它为每个字符提供了一个代码点。它可以生成大约百万个代码点，这对于地球来说足够了——至少目前！\n\
    \nUTF-8，或 Unicode 转换格式，将代码点转换为二进制反之亦然。由于 UTF-8 的实用性，你可以在字符串中使用任何语言。\n\n通常，字符串在开始和结束用双引号（`\"\
    `）括。查看此示例：\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main () {\n    var\
    \ my_words string //在此处使用关键字 var\n    my_words = \"Hello world\"\n    //显示字符串\n\
    \    fmt.println(\"String: \", my_words)\n}\n```\n输出: Hello world\n\n有时，字符串不使用双引号，而是使用反引号（``\
    \ ``）。这在编写 HTML 时、编写包含多行的消息时以及编写正则表达式时很常见。\n\n# 时间和日期\n\n在 Go 中，时间包含一个位置。如果没有指定，它默认是\
    \ UTC 协调世界时。如果你需要时间戳，则使用 `Now()`：\n\n```go\nNow()\n```\n\n对于日期，使用 `Date()`：\n\n\
    ```go\nDate(year, month, day, hour, min, nsec, loc)\n```\n\n如果你想知道两个瞬间之间过去了多久，使用\
    \ `Since()`：\n\n```go\nSince(t)\n```\n\n如果你想知道距离时间还有多久，使用 `Until()`：\n\n```go\n\
    Until(t)\n```\n\n# 章节总结\n\nGolang 与其他语言相似，但如果你用 Java、C++ 或 Python 编程，记住 Go 的不同之处是非常重要的。\n\
    \n* Go 的“词汇量”设计得易于阅读且清晰。\n* 文件名、标识符、变量、常量和关键字的语法规则可能与其他程序有相似之处。\n* Go 包含多种数据类型，常量不需要指定其类型——事实上，让它们保持无类型通常更好。\n\
    \n在下一章中，你将学习控制结构。\n\n# If-Else\n\n一个简单的 *if 语句* 会条件为真时执行。如果为假，则什么都不会发生。if 语句的写法如下：\n\
    \n```go\nif condition {\n    // 如果条件为真将执行的代码\n}\n```\n"
