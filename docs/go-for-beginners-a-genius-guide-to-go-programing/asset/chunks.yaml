    It’s the weekend\")\n    default:\n        fmt.Println(\"It’s a weekday\")\n \
    \   }\n}\n```\n\n## For\n\n`for loop` 是 Go 中唯一的循环结构。它用于重复执行语句直到满足特定条件。如果没有需要满足的条件，或者程序无法满足该条件，它将进入无限循环。\n\
    \n举一个简单的例子，比如列出从一到十的数字。如果没有循环结构，你将不得不写十条语句：\n\n```go\nfmt.Println(1)\nfmt.Println(2)\n\
    fmt.Println(3)\nfmt.Println(4)\nfmt.Println(5)\n... 直到你写 `fmt.Println(10)`。\n\
    ```\n\n使用 `for` 循环，你只需要写一次。\n\n```go\nx := 1\nfor x <= 10 {\n    fmt.Println(x)\n\
    \    x += 1\n}\n```\n\n在这里，你告诉程序检查 `x` 是否小于或等于 10。如果是，则打印 `x`。注意，如果不加 `+1`，`x`\
    \ 将始终是 1 并在无限循环中打印。你也可以简化 `for` 循环，可以写为：\n\n```go\nfor x := 1; x <= 10; x++ {\n\
    \    fmt.Println(x)\n}\n```\n\n第一行将 `x` 赋值为 1，检查 `x` 是否小于 10，如果是，则执行第二行。\n\n##\
    \ For Range\n\n`for loop` 用于遍历各种数据结构（如数组、切片、字符串）中的元素。你将在后面的章节中学习更多相关内容。`for range`\
    \ 语句使用关键字 `range` 来重复遍历数组、切片、map 等。为了 sake of example，假设你有一个切片并想要遍历其中的数字：\n\n\
    ```go\nnums := []int{2,3,4}\nsum := 0\nfor _, num := range nums {\n    sum +=\
    \ num\n}\nfmt.Println(\"Sum:\", sum) // 输出结果为 Sum: 9\n```\n\n## Break and Continue\n\
    \n这些控制语句帮助你在 Go 程序中添加逻辑。`break statement` 结束当前循环，通常与 `if` 语句配合使用。下面的程序显示了 `break`\
    \ 和 `if` 语句是如何工作的：\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\nfunc\
    \ main () {\n    for x := 0; x < 10; x++ {\n        if x == 5 {\n            fmt.Println(\"\
    Breaking out of loop\")\n            break // 当 x 达到 5 时 \n        }\n       \
    \ fmt.Println(\"The value of x is\", x) // 如果没有 break\n    }\n    fmt.Println(\"\
    Exiting program\")\n}\n```\n\n该程序的输出如下：\n*The value of x is 0*\n*The value of\
    \ x is 1*\n*The value of x is 2*\n*The value of x is 3*\n*The value of x is 4*\n\
    *Breaking out of loop*\n*Exiting program*\n\n如果你将循环嵌套在一起，内部循环中的 `break` 并不意味着外层循环的\
    \ `break`。相反，你可能想跳过循环的剩余部分并返回顶部重复。这就是 Go 中 `continue statement` 的用途。例如，我们可以修改上面的程序，使其在\
    \ `x = 5` 时不是停止，而是跳过 5 继续运行直到达到 10：\n\n```go\npackage main\n\nimport (\n    \"\
    fmt\"\n)\n\nfunc main () {\n    for x := 0; x < 10; x++ {\n        if x == 5 {\n\
    \            fmt.Println(\"Continuing loop\")\n            continue // 当 x 为 5\
    \ 时代替 break\n        }\n        fmt.Println(\"The value of x is\", x)\n    }\n\
    \    fmt.Println(\"Exiting program\")\n}\n```\n\n现在你将得到一个不同的结果，循环在 5 处继续而不是结束。\n\
    \n*The value of x is 0*\n*The value of x is 1*\n*The value of x is 2*\n*The value\
    \ of x is 3*\n*The value of x is 4*\n*Continuing loop*\n*The value of x is 6*\n\
    *The value of x is 7*\n*The value of x is 8*\n*The value of x is 9*\n*Exiting\
    \ program*\n\n`continue statement` 通常用于你需要循环但想消除程序中某些不需要的情况。使用 `continue` 还可以避免多层条件嵌套。\n\
    \n## Labels: Goto\n\n与 `break` 和 `continue` 语句一样，`goto` 会改变程序的执行，指令计算机跳转到标记语句并从那里运行程序。标签是用文本编写的标识符，可以位于程序中\
    \ `goto` 语句的任何位置。与 `continue` 和 `break`一样，`goto` 经常与 `if` 和 `if-else` 控制语句一起使用。\n\
    \n在这个示例中，你根据输入的年龄得到不同的答案。\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main\
    \ () {\n    var age int\n    election: // 这是一个标签\n    fmt.Println(\"Enter your\
    \ age \")\n    fmt.Scanln(&age) // 用户输入年龄\n    if (age <= 17) {\n        fmt.Println(\"\
    You are not eligible to vote.\")\n        goto election\n    } else {\n      \
    \  fmt.Println(\"You are eligible to vote.\")\n    }\n}\n```\n\n输出可能像这样：\n\n*Enter\
    \ your age 16*\n*You are not eligible to vote.*\n*Enter your age 17*\n*You are\
    \ not eligible to vote.*\n*Enter your age 20*\n*You are eligible to vote.*\n\n"
