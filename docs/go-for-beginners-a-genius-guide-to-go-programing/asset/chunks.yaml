    You may have picked up this book because you’ve already heard a lot about Go and
    want to add it to your programming arsenal. Or maybe you don’t have a lot of programming
    experience, so a lightweight language seems like it could be right up your alley.
    Perhaps your company is looking into adding Go to speed up the performance of
    its apps, or you’d like to get a job at a company like SoundCloud, Uber, BBC,
    or Dropbox. If you’re familiar with other languages, you can probably pick up
    Go in a few hours. With less programming experience, you’ll need to spend a bit
    longer to learn it. However, it’s very clear and doesn’t have the excess baggage
    that software development languages tend to add on over time since it’s a relatively
    youthful one.


    In this book, before we dive into the basics of the language itself, you’ll discover
    why it’s so popular and why more and more programmers are adopting it. Go is more
    readable than many other languages, which makes using it for open-source programming
    a natural fit. You’ll learn about the foundations, including elementary types
    and strings, as well as control structures such as `if-else` and `for range`.
    You’ll find out about functions in Go and slices and arrays too. Maps and packages
    are important components of Go programming, and we’ve provided details about both
    in the book. In addition, you’ll learn about methods (and how they differ from
    functions), interfaces, and reflection. There’s information about reading the
    language, not to mention goroutines and channels. Finally, and maybe most importantly,
    we’ve included a chapter on testing and handling errors as well as a chapter on
    common pitfalls and patterns. Find out what mistakes many developers make, so
    you can avoid them yourself! Once you’ve learned the foundations of the language
    in this book, you’ll be ready to start programming in Golang.


    As a Go programmer myself, I’ve written this book to help others learn the language.
    I know what the pitfalls are, and I’ve helped other software developers like you
    get up to speed on Go pretty quickly. I think as many developers as possible should
    start learning it so they can build code that executes faster, is cleaner, and
    helps spread the popularity of open-source applications.


    The sooner you start reading the book, the sooner you’ll be able to start programming—it
    really is that simple! Go was designed to be learned fast, and to execute fast.
    So dive in and get started on your Golang; why wait any longer to add this powerful
    tool to your kit?


