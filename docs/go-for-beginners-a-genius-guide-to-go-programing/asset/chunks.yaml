- raw: "Now that you understand how to use goto, try to avoid using it in your programming.\
    \ Not only in Go but other languages as well. Most of the time, there’s another\
    \ way to construct it which makes it easier for users who want to read the program.\
    \ Using goto makes it a lot harder to trace the flow of controls in a program,\
    \ making it more difficult to understand and modify. Since Go is designed to work\
    \ on open-source platforms, your code should also be designed to be easy for others\
    \ to use and modify.\n\n## Chapter Summary\n\nControl structures are the building\
    \ blocks of a program. You can use either conditional statements or loops for\
    \ your controls in Go.\n\n*   Conditional statements include if, if-else, and\
    \ if-else if-else statements; they direct the program to execute when certain\
    \ conditions are met.\n\n*   Switch case is a much shorter (and easier) way to\
    \ write multiple alternatives instead of a long if-else if-else statement with\
    \ many lines.\n\n*   Loops repeat instructions rather than writing all the lines\
    \ down in the code.\n\n*   For is the only loop control that Go recognizes, and\
    \ for range adds repetition over ranges.\n\n*   Break and continue are different\
    \ ways of skipping parts of a loop.\n\n*   Goto is another method of controlling\
    \ loops by sending the program back to a specific label, but goto statements make\
    \ programs harder to understand and use and therefore are not recommended.\n\n\
    In the next chapter, you'll learn about functions.\n\nFour \n\nIn previous chapters,\
    \ you learned a bit about functions in Golang. Here, we’ll take a deeper dive\
    \ into some of the more commonly used functions in the language. As a refresher,\
    \ functions are groups of statements that complete a task. Essentially, a function\
    \ takes an input and produces an output of some kind.\n\nFunction names that start\
    \ with an uppercase letter will be exported to other packages, while those that\
    \ start with lowercase will only be used within the same package. (A *package*\
    \ is a group of source files that are compiled together.) Names of functions can’t\
    \ start with a digit and can’t contain spaces. If the name has multiple words\
    \ in it, each word after the first should be capitalized, such as simpleFunction.\n\
    \n## Basics of Functions\n\nSimpleFunction is a function that doesn’t have any\
    \ parameters and doesn’t return any values. It’s used to print a message.\n\n\
    > package main\n\n> \n\n> import “fmt”\n\n> \n\n> func SimpleFunction (){\n\n\
    > \n\n> fmt.Println(“Hello World”)\n\n> \n\n> }\n\n> \n\n> func main () {\n\n\
    > \n\n> SimpleFunction ()\n\n> \n\n> }\n\nThe output here is simply\n\n> *Hello\
    \ World*\n\nIf you want to pass information to a function, you can use *arguments*\
    \ , which are just like variables. They’re specified inside parentheses and separated\
    \ by commas. There’s no limit to the number of arguments that can be passed.\n\
    \nHere’s an example with two int-type arguments. Once the function *add* is called,\
    \ you can pass two integers.\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\
    \n> func add(x int, y int) {\n\n> \n\n> total : = 0\n\n> \n\n> total: = x + y\n\
    \n> \n\n> fmt.Println (total)\n\n> \n\n> } // this part of the code accepts the\
    \ arguments\n\n> \n\n> func main () {\n\n> \n\n> add (10, 20)\n\n> \n\n> } //this\
    \ is where the argument is passed\n\nThe output, in this case, is 30.\n\n## Return\
    \ Values and Parameters\n\nIf you declare a return value, then you’ll also need\
    \ a return statement. The *return value* is what retains the function’s output\
    \ after running the instructions. In Go, unlike some other languages, there’s\
    \ a variety of values. You as the coder can decide whether you want to name it\
    \ or not.\n\nFor example, you can have a naked return where you use the return\
    \ keyword, but without specifying the return value in the body. That’ll work as\
    \ long as you declare the return value in the function header and the variable\
    \ has the same name as what you’ve stated in the header.\n\nHere’s an example\
    \ of a naked return.\n\n> package main\n\n> \n\n> import (\n\n> \n\n> “fmt”\n\n\
    > \n\n> )\n\n> \n\n> func greeting (name string) (message string) {\n\n> \n\n\
    > message = “Hello, “ + name //variable has to be the same as in the header, e.g.\
    \ message\n\n> \n\n> return // Note that since *message* has been specified above,\
    \ no need to declare here\n\n> \n\n> }\n\n> \n\n> func main () { //greeting return\
    \ value\n\n> \n\n> // the function stores the variable\n\n> \n\n> msg := greeting(“world”)\n\
    \n> \n\n> fmt.Println(msg)\n\n> \n\n> }\n\nOutput is Hello, world.\n\nYou can\
    \ also construct functions that have multiple return values and multiple parameters.\
    \ However, the number of variables that the function holds on the return has to\
    \ be the same as the number of variables in the function.\n\nSuppose you wanted\
    \ to run four basic arithmetic operations on two numbers that you’ve named x and\
    \ y. Here’s what that would look like:\n\n> package main\n\n> \n\n> import (\n\
    \n> \n\n> “fmt”\n\n> \n\n> )\n\n> \n\n> func operations (x, y int) (sum, diff,\
    \ prod, div int) {\n\n> \n\n> //the function has 4 variables: x+y, x-y, x\\*y,\
    \ x/y\n\n> \n\n> return\n\n> \n\n> }\n\n> \n\n> func main() {\n\n> \n\n> x, y\
    \ := 6, 3\n\n> \n\n> //since there are 4 variables in the function, there must\
    \ be 4 receiver variables\n\n> \n\n> sum, diff, prod, div := operations (x, y)\n\
    \n> \n\n> fmt.Println(sum, diff, prod, div)\n\n> \n\n> }\n\nThe output would look\
    \ like this: 9 3 18 2\n\n## Defer, Panic, and Tracing\n\nAs you might guess, a\
    \ *defer statement* delays the execution until the surrounding function returns.\
    \ There are a couple of ways that can happen: either through the normal performance\
    \ of the function or through a *panic* .\n\nAs a quick example, here’s what a\
    \ defer statement looks like through normal function.\n\n> func main() {\n\n>\
    \ \n\n> defer fmt.Println(“world”) // deferring the statement\n\n> \n\n> fmt.Println(“Hello,”)\n\
    \n> \n\n> }\n\nThe output is (you guessed it!)\n\n> *Hello,*\n\n> \n\n> *world*\n\
    \n*Panic* stops a goroutine and prints a stack trace to the console. That way\
    \ you can “catch” a panic and take control back. A *stack trace* lists the calls\
    \ that the program was working on when the exception occurred.\n\nEven if the\
    \ function panics, the *defer* statement will still be performed. Later in the\
    \ book, you’ll learn more about catching a panic and recovering from one as well.\n\
    \nIf you call several deferred functions, they’ll be performed in a “last in,\
    \ first out” (LIFO) order. Check out an example of how that works:\n\n> func main()\
    \ {\n\n> \n\n> fmt.Println(“Hello”)\n\n> \n\n> for a :=1; a <=3; a++ {\n\n> \n\
    \n> defer fmt.Println(a)\n\n> \n\n> }\n\n> \n\n> fmt.Println(“world”)\n\n> \n\n\
    > }\n\nYou end up with output that looks like this:\n\n> *Hello*\n\n> \n\n> *world*\n\
    \n> \n\n> *3*\n\n> \n\n> *2*\n\n> \n\n> *1*\n\n## Built-in Functions\n\nBuilt-in\
    \ functions are automatically defined by Golang and represent a variety of common\
    \ functions that developers like to use. As a compiled language, Go embeds the\
    \ processing into its compiler. Each built-in function has a corresponding operation,\
    \ or *op* , inside the compiler.\n\nYou’ve already seen a couple of examples of\
    \ built-ins in previous examples.\n\n1.  *Print* and *println* are used for printing\
    \ the output.\n\n2.  *Panic* is used for error handling. Another built-in for\
    \ errors is *recover* .\n\nOther built-ins include:\n\n*   *Len* and *cap* for\
    \ length and capacity, respectively, for array, slice, channel, and string\n\n\
    *   *Delete* for deleting a certain key in a map\n\n*   *Make* for allocating\
    \ memory for reference types and returning the initialized value\n\n*   *New*\
    \ for allocating user-defined and value type\n\n*   *Copy* and *append* for those\
    \ operations on a slice\n\nYou’ve already seen some examples of a string. Later\
    \ in the book, you’ll learn more about the others, but here are some quick definitions.\
    \ *Arrays* are sequences of elements of a certain length; the number of elements\
    \ has to be defined in the array. *Slices* are more flexible and therefore tend\
    \ to be more common than arrays, as they’re sized dynamically instead of specified.\
    \ *Channels* connect goroutines that are running at the same time to one another,\
    \ and you can send values from one goroutine channel into another’s channel to\
    \ receive them.\n\n## Recursion"
  fmt: "\nNow that you understand how to use `goto`, try to avoid using it in your\
    \ programming. Not only in Go but other languages as well. Most of the time, there’s\
    \ another way to construct it which makes it easier for users who want to read\
    \ the program. Using `goto` makes it a lot harder to trace the flow of controls\
    \ in a program, making it more difficult to understand and modify. Since Go is\
    \ designed to work on open-source platforms, your code should also be designed\
    \ to be easy for others to use and modify.\n\n## Chapter Summary\n\nControl structures\
    \ are the building blocks of a program. You can use either conditional statements\
    \ or loops for your controls in Go.\n\n*   Conditional statements include `if`,\
    \ `if-else`, and `if-else if-else` statements; they direct the program to execute\
    \ when certain conditions are met.\n*   `Switch` case is a much shorter (and easier)\
    \ way to write multiple alternatives instead of a long `if-else if-else` statement\
    \ with many lines.\n*   Loops repeat instructions rather than writing all the\
    \ lines down in the code.\n*   `For` is the only loop control that Go recognizes,\
    \ and `for range` adds repetition over ranges.\n*   `Break` and `continue` are\
    \ different ways of skipping parts of a loop.\n*   `Goto` is another method of\
    \ controlling loops by sending the program back to a specific label, but `goto`\
    \ statements make programs harder to understand and use and therefore are not\
    \ recommended.\n\nIn the next chapter, you'll learn about functions.\n\n## Four\n\
    \nIn previous chapters, you learned a bit about functions in Golang. Here, we’ll\
    \ take a deeper dive into some of the more commonly used functions in the language.\
    \ As a refresher, functions are groups of statements that complete a task. Essentially,\
    \ a function takes an input and produces an output of some kind.\n\nFunction names\
    \ that start with an uppercase letter will be exported to other packages, while\
    \ those that start with lowercase will only be used within the same package. (A\
    \ `package` is a group of source files that are compiled together.) Names of functions\
    \ can’t start with a digit and can’t contain spaces. If the name has multiple\
    \ words in it, each word after the first should be capitalized, such as `simpleFunction`.\n\
    \n## Basics of Functions\n\n`SimpleFunction` is a function that doesn’t have any\
    \ parameters and doesn’t return any values. It’s used to print a message.\n\n\
    ```go\npackage main\n\nimport \"fmt\"\n\nfunc SimpleFunction (){\n    fmt.Println(\"\
    Hello World\")\n}\n\nfunc main () {\n    SimpleFunction ()\n}\n```\n\nThe output\
    \ here is simply\n*Hello World*\n\nIf you want to pass information to a function,\
    \ you can use `arguments`, which are just like variables. They’re specified inside\
    \ parentheses and separated by commas. There’s no limit to the number of arguments\
    \ that can be passed.\n\nHere’s an example with two `int`-type arguments. Once\
    \ the function `add` is called, you can pass two integers.\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\nfunc add(x int, y int) {\n\ttotal := 0\n\ttotal := x + y\n\
    \tfmt.Println (total)\n} // this part of the code accepts the arguments\n\nfunc\
    \ main () {\n\tadd (10, 20)\n} //this is where the argument is passed\n```\n\n\
    The output, in this case, is 30.\n\n## Return Values and Parameters\n\nIf you\
    \ declare a return value, then you’ll also need a return statement. The `return\
    \ value` is what retains the function’s output after running the instructions.\
    \ In Go, unlike some other languages, there’s a variety of values. You as the\
    \ coder can decide whether you want to name it or not.\n\nFor example, you can\
    \ have a naked return where you use the `return` keyword, but without specifying\
    \ the return value in the body. That’ll work as long as you declare the return\
    \ value in the function header and the variable has the same name as what you’ve\
    \ stated in the header.\n\nHere’s an example of a naked return.\n\n```go\npackage\
    \ main\n\nimport (\n\t\"fmt\"\n)\n\nfunc greeting (name string) (message string)\
    \ {\n\tmessage = \"Hello, \" + name //variable has to be the same as in the header,\
    \ e.g. message\n\treturn // Note that since message has been specified above,\
    \ no need to declare here\n}\n\nfunc main () { //greeting return value\n\t// the\
    \ function stores the variable\n\tmsg := greeting(\"world\")\n\tfmt.Println(msg)\n\
    }\n```\n\nOutput is Hello, world.\n\nYou can also construct functions that have\
    \ multiple return values and multiple parameters. However, the number of variables\
    \ that the function holds on the return has to be the same as the number of variables\
    \ in the function.\n\nSuppose you wanted to run four basic arithmetic operations\
    \ on two numbers that you’ve named `x` and `y`. Here’s what that would look like:\n\
    \n```go\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc operations (x, y int)\
    \ (sum, diff, prod, div int) {\n\t//the function has 4 variables: x+y, x-y, x*y,\
    \ x/y\n\treturn\n}\n\nfunc main() {\n\tx, y := 6, 3\n\t//since there are 4 variables\
    \ in the function, there must be 4 receiver variables\n\tsum, diff, prod, div\
    \ := operations (x, y)\n\tfmt.Println(sum, diff, prod, div)\n}\n```\n\nThe output\
    \ would look like this: 9 3 18 2\n\n## Defer, Panic, and Tracing\n\nAs you might\
    \ guess, a `defer statement` delays the execution until the surrounding function\
    \ returns. There are a couple of ways that can happen: either through the normal\
    \ performance of the function or through a `panic`.\n\nAs a quick example, here’s\
    \ what a defer statement looks like through normal function.\n\n```go\nfunc main()\
    \ {\n\tdefer fmt.Println(\"world\") // deferring the statement\n\tfmt.Println(\"\
    Hello,\")\n}\n```\n\nThe output is (you guessed it!)\n*Hello,*\n*world*\n\n`Panic`\
    \ stops a goroutine and prints a stack trace to the console. That way you can\
    \ “catch” a panic and take control back. A `stack trace` lists the calls that\
    \ the program was working on when the exception occurred.\n\nEven if the function\
    \ panics, the `defer` statement will be performed. Later in the book, you’ll learn\
    \ more about catching a panic and recovering from one.\n\nIf you call several\
    \ deferred functions, they’ll be performed in a “last in, first out” (LIFO) order.\
    \ Check out an example of how that works:\n\n```go\nfunc main() {\n\tfmt.Println(\"\
    Hello\")\n\tfor a :=1; a <=3; a++ {\n\t\tdefer fmt.Println(a)\n\t}\n\tfmt.Println(\"\
    world\")\n}\n```\n\nYou end up with output like:\n*Hello*\n*world*\n*3*\n*2*\n\
    *1*\n\n## Built-in Functions\n\nBuilt-in functions are automatically defined by\
    \ Golang and represent a variety of functions that developers like to use. As\
    \ a compiled language, Go embeds the processing into its compiler. Each built-in\
    \ function has a corresponding operation, or `op`, inside the compiler.\n\nYou’ve\
    \ already seen a couple of examples of built-ins in previous examples.\n\n1. \
    \ `Print` and `println` are used for printing the output.\n2.  `Panic` is used\
    \ for error handling. Another built-in for errors is `recover`.\n\nOther built-ins\
    \ include:\n\n*   `Len` and `cap` for length and capacity, respectively, for array,\
    \ slice, channel, and string\n*   `Delete` for deleting a certain key in a map\n\
    *   `Make` for allocating memory for reference types and returning the initialized\
    \ value\n*   `New` for allocating user-defined and value type\n*   `Copy` and\
    \ `append` for those operations on a slice\n\nYou’ve already seen some examples\
    \ of a string. Later in the book, you’ll learn more about the others, but here\
    \ are some quick definitions. `Arrays` are sequences of elements of a certain\
    \ length; the number of elements has to be defined in the array. `Slices` are\
    \ more flexible and therefore tend to be more common than arrays, as they’re sized\
    \ dynamically instead of specified. `Channels` connect goroutines that are running\
    \ at the same time to one another, and you can send values from one goroutine\
    \ channel into another’s channel to receive them.\n\n## Recursion\n"
  trans: "\n\n既然你已经了解了如何使用 `goto`，请尝试在编程中避免使用它。不仅是在 Go 语言中，其他语言也是如此。大多数情况下，有其他的构造方式，这对于想要阅读程序的开发者来说更容易理解。使用\
    \ `goto` 会使得追踪程序的控制流变得非常困难，增加了理解和修改的难度。由于 Go 的设计初衷是在开源平台上运行，因此你的代码也应该设计成便于他人使用和修改。\n\
    \n## 章节总结\n\n控制结构是程序的构建块。在 Go 中，你可以使用条件语句或循环来实现控制。\n\n*   条件语句包括 `if`、`if-else`\
    \ 和 `if-else if-else` 语句；它们引导程序在满足某些条件时执行。\n*   `Switch` case 是一种更短（也更简单）的编写多种备方案的方法，可以代替带有许多行的\
    \ `if-else if-else` 语句。\n*   循环用于重复指令，而不是在代码中写下所有行。\n*   `For` 是 Go 识别的唯一循环控制，而\
    \ `for range` 增加了对范围的遍历。\n*   `Break` 和 `continue` 是跳过循环部分的不同方式。\n*   `Goto` 是另一种通过将程序发送回特定标签（label）来控制循环的方法，但\
    \ `goto` 语句会让程序更难理解和使用，因此不建议使用。\n\n在下一章中，你将学习函数。\n\n## 四章\n\n在之前的章节中，你学习了一些关于\
    \ Golang 函数的知识。在这里，我们将更深入地探讨该语言中一些常用的函数。作为复习，函数是完成特定任务的语句组。本质上，一个函数接收一个输入并产生某种输出。\n\
    \n以大写字母开头的函数名将导出到其他包，而以小写字母开头的函数将仅在同一个包中使用。（`package` 是一组编译在一起的源文件）。函数名不能以数字开头，不能包含空格。如果名称中包含多个单词，第一个单词后的每个单词都应该大写，例如\
    \ `simpleFunction`。\n\n## 函数基础\n\n`SimpleFunction` 是一个既没有参数也没有返回值的函数。它用于打印消息。\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc SimpleFunction (){\n    fmt.Println(\"\
    Hello World\")\n}\n\nfunc main () {\n    SimpleFunction ()\n}\n```\n\n这里的输出仅仅是\n\
    *Hello World*\n\n如果你想向函数传递信息，可以使用 `arguments`（参数），它们就像变量一样。它们被指定在括号内并用逗号分隔。传递的参数数量没有限制。\n\
    \n这里有一个两个 `int` 类型参数的示例。一旦调用函数 `add`，你就可以传递两个整数。\n\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc add(x int, y int) {\n\ttotal := 0\n\ttotal := x + y\n\tfmt.Println\
    \ (total)\n} //这部分代码接受参数\n\nfunc main () {\n\tadd (10, 20)\n} //这里是传递参数的地方\n```\n\
    \n在这种情况下，输出是 30。\n\n## 返回值与参数\n\n如果你声明了返回值，那么你还需要一个 `return` 语句。`return value`（返回值）是在执行指令后保留函数输出的内容。在\
    \ Go 中，与其他一些语言不同，有多种值类型。作为编码者，你可以决定是否要给它命名。\n\n例如，你可以使用“裸返回”（naked return），即使用\
    \ `return` 关键字，但在体内部不指定返回值。只要你在函数头中声明了返回值，且该变量与你在函数头中声明的名称相同，它就能工作。\n\n这是一个裸返回的示例。\n\
    \n```go\npackage main\n\nimport (\n\t\"fmt\"\n)\n\nfunc greeting (name string)\
    \ (message string) {\n\tmessage = \"Hello, \" + name //变量必须与函数头中的相同，例如 message\n\
    \treturn // 注意，由于上面指定了 message，这里不需要再次声明\n}\n\nfunc main () { //greeting 返回值\n\
    \t//函数存储了该变量\n\tmsg := greeting(\"world\")\n\tfmt.Println(msg)\n}\n```\n\n输出为\
    \ Hello, world。\n\n你还可以构建具有多个返回值和多个参数的函数。然而，函数在返回时持有的变量数量必须与函数中的变量数量相同。\n\n假设你想对两个命名为\
    \ `x` 和 `y` 的数字运行四个基础算术操作。它看起来如下：\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\
    \n)\n\nfunc operations (x, y int) (sum, diff, prod, div int) {\n\t//函数有 4 个变量：x+y\n\
    \tsum = x + y\n\tdiff = x - y\n\tprod = x * y\n\tdiv = x / y\n\tfmt.Println(sum,\
    \ diff, prod, div)\n}\n\nfunc main() {\n\toperations(10, 5)\n}\n```\n\n"
