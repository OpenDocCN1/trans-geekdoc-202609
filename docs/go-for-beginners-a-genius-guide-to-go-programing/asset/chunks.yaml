    \ are a few common mistakes that developers make with `defer` that you should\
    \ be aware of. Remember that `recover()` should *only* be used.\n\n## Chapter\
    \ Summary\n\nThere are common patterns frequently used in `Golang`, and they may\
    \ be different from similar ones in other languages. Beginners in `Golang`, especially\
    \ those who’ve programmed in other languages, have a variety of “gotchas” that\
    \ are often made by new developers in the language.\n\n*   The comma, ok idiom\
    \ (`, ok`) helps distinguish between a zero value and the integer zero.\n*   `Go`\
    \ uses capitalization to show whether an identifier is public or private.\n* \
    \  You might find operators more limited than in other languages, but using interfaces\
    \ with them is a best practice for coders.\n*   Common pitfalls can occur due\
    \ to the differences in otherwise similar languages.\n\nWhether you’re an experienced\
