- raw: "You may have picked up this book because you’ve already heard a lot about\
    \ Go and want to add it to your programming arsenal. Or maybe you don’t have a\
    \ lot of programming experience, so a lightweight language seems like it could\
    \ be right up your alley. Perhaps your company is looking into adding Go to speed\
    \ up the performance of its apps, or you’d like to get a job at a company like\
    \ SoundCloud, Uber, BBC, or Dropbox. If you’re familiar with other languages,\
    \ you can probably pick up Go in a few hours. With less programming experience,\
    \ you’ll need to spend a bit longer to learn it. However, it’s very clear and\
    \ doesn’t have the excess baggage that software development languages tend to\
    \ add on over time since it’s a relatively youthful one.\n\nIn this book, before\
    \ we dive into the basics of the language itself, you’ll discover why it’s so\
    \ popular and why more and more programmers are adopting it. Go is more readable\
    \ than many other languages, which makes using it for open-source programming\
    \ a natural fit. You’ll learn about the foundations, including elementary types\
    \ and strings, as well as control structures such as if-else and for range. You’ll\
    \ find out about functions in Go and slices and arrays too. Maps and packages\
    \ are important components of Go programming, and we’ve provided details about\
    \ both in the book. In addition, you’ll learn about methods (and how they differ\
    \ from functions), interfaces, and reflection. There’s information about reading\
    \ the language, not to mention goroutines and channels. Finally, and maybe most\
    \ importantly, we’ve included a chapter on testing and handling errors as well\
    \ as a chapter on common pitfalls and patterns. Find out what mistakes many developers\
    \ make, so you can avoid them yourself! Once you’ve learned the foundations of\
    \ the language in this book, you’ll be ready to start programming in Golang.\n\
    \nAs a Go programmer myself, I’ve written this book to help others learn the language.\
    \ I know what the pitfalls are, and I’ve helped other software developers like\
    \ you get up to speed on Go pretty quickly. I think as many developers as possible\
    \ should start learning it so they can build code that executes faster, is cleaner,\
    \ and helps spread the popularity of open-source applications.\n\nThe sooner you\
    \ start reading the book, the sooner you’ll be able to start programming—it really\
    \ is that simple! Go was designed to be learned fast, and to execute fast. So\
    \ dive in and get started on your Golang; why wait any longer to add this powerful\
    \ tool to your kit?\n\nOne \n\nIn 2009, a team of Google employees introduced\
    \ Go to the world. (It’s sometimes referred to as Golang to differentiate it from\
    \ the well-known game of Go.) Supposedly, they started creating it while waiting\
    \ for a program in another language to compile. The employees were frustrated\
    \ by the limitations of the languages available at that time and decided to rethink\
    \ programming from the very beginning, working from the ground up.\n\nOver time,\
    \ computer languages (just like spoken ones) tend to accumulate extra baggage\
    \ that gets in the way and slows down the speed of the code. Starting from scratch\
    \ meant that they could build something lean, yet powerful enough to handle massive\
    \ code. They also designed it to be open-source, so it’s easy to create new applications\
    \ and use them in a variety of industries for many different purposes.\n\nFirst,\
    \ a quick refresher on programs: they’re simply a set of instructions. Both compilers\
    \ and interpreters take human code and translate it into machine-readable code.\
    \ Compiled languages, like Go, are developed so that the target machine can read\
    \ the code directly. Interpreter languages such as Python and Ruby don’t have\
    \ the translation inside the source code and require a separate program to read\
    \ and execute the code.\n\n## Designed for Modern Conditions\n\nGo was intentionally\
    \ created to run on multiple cores, which allows programmers to scale when adding\
    \ more cores. It also helps them create concurrency since goroutines execute in\
    \ the background while other jobs are running. If you’re building a web app that\
    \ requires data input from the user, for example, the goroutine can supply pre-populated\
    \ text as the user is inputting. The program continues to run no matter how long\
    \ it takes the concurrent processes to operate.\n\nThe language uses goroutines\
    \ instead of threads, which requires much less use of the machine’s RAM. That\
    \ makes an app running on Go less likely to crash from running out of memory.\
    \ Goroutines are functions that execute simultaneously with concurrent goroutines\
    \ and work on any hardware. By contrast, threads execute the code under the logic\
    \ of the program and are dependent on the specific hardware being used.\n\nGoroutines\
    \ communicate with one another easily and without taking up a lot of power through\
    \ channels. Threads don’t have an easy way to talk to one another, which results\
    \ in communication between threads taking more time and power. As a result, goroutines\
    \ are faster and cheaper than threads.\n\nUnlike some previous languages, Go is\
    \ designed for cloud-based servers that most web developers use these days. It’s\
    \ compilable on almost any machine and works on a variety of platforms as well.\
    \ If you’ve been using Perl to watch a log, Python to deliver tweets, or Java\
    \ to manage thousands of concurrent users, you’ll find that Go can accomplish\
    \ all of these little tasks and more.\n\nLike Java, Go is compiled and needs no\
    \ interpreter. That frees up a lot of power for the code itself, making it run\
    \ much faster. Having lower system requirements also means that users will be\
    \ able to use your app on older devices, which expands the potential market for\
    \ your app and may land more money in your pocket.\n\n## Advantages of Go\n\n\
    *   Flexibility\n\nThis language can solve a lot of problems for developers. It\
    \ can be used for network and system programming as well as audio/visual apps,\
    \ such as YouTube. More modern developments, such as big data and machine learning,\
    \ are possible with this language.\n\n*   Automatic documentation\n\nGoDoc will\
    \ automatically generate the technical documentation for the code. It provides\
    \ cross-references, examples of the code, and links to the repository for version\
    \ control. This is especially key for open-source developers and makes it much\
    \ easier to build apps based on another’s code.\n\n*   Embedded testing\n\nThe\
    \ language comes with an API for use in testing and profiling, as well as your\
    \ own examples. In addition to basic testing, you can also run skip tests and\
    \ parallel tests, among others.\n\n*   Static code analysis\n\nUsing the metatool\
    \ GoMetaLinter, you can debug your source code before running it by analyzing\
    \ it against the code rules. Using automated static code analysis is not only\
    \ faster than debugging manually, but it also avoids the usual human error in\
    \ manual analysis.\n\n*   Detecting race condition\n\nWhen multiple threads compete,\
    \ they may end up being completed in an unexpected order which results in errors\
    \ that are hard to track down (this is known as race condition). The Go engineers\
    \ decided to create an automatic detector to eliminate the problem, which also\
    \ ensures backward compatibility.\n\n## Disadvantages of Go\n\n*   Lack of GUI\
    \ library\n\nThe lack of a GUI library is fine for single-page apps, but businesses\
    \ that need both speed and GUI for their users typically choose Ruby instead.\
    \ Otherwise, it’s a time-consuming job to try to connect libraries instead of\
    \ using a native solution as you would with Python or Java.\n\n*   No generics\n\
    \nBecause of the way Go is designed, you may need to write more code to handle\
    \ certain functions than you would for other languages. In languages that use\
    \ generics, you can write algorithms with terms-to-be-specified-later that will\
    \ then run when needed with the specific types as parameters. It helps reduce\
    \ code repetition; you can write one function instead of two.\n\nWithout this\
    \ capability, you need to write more lines of code for each function instead.\n\
    \n*   Error handling"
