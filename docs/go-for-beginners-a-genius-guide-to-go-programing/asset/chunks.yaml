    \ that Suzanne is removed from the map you can print it out:\n\n> fmt.Println(usernames)\n\
    \nAnd the output will read:\n\n> *\\[Tanya: taxolotl Mary: maxolotl Anna: axolotl\\\
    ]*\n\n## Sorting\n\nAs you’ve learned, maps are unordered in Go. However, you\
    \ can arrange maps with the *sort* function. Let’s continue with the ages of the\
    \ remaining users for our company to show how this works in maps.\n\n> package\
    \ main\n\n> \n\n> import “fmt”\n\n> \n\n> func main() {\n\n> \n\n> m :=map\\[string\\\
    ]int{“Anna”:25, “Tanya”: 21, “Mary”: 37,}\n\n> \n\n> keys := make(\\[\\]string,\
    \ 0, len(m))\n\n> \n\n> for k = range m {\n\n> \n\n> keys = append(keys, k)\n\n\
    > \n\n> }\n\n> \n\n> sort.Strings(keys)\n\n> \n\n> for\\_, k := range keys{\n\n\
    > \n\n> fmt.Println(k, m\\[k\\])\n\n> \n\n> }\n\nThe result is the sorted output\
    \ by key as follows:\n\n> *Anna 25*\n\n> \n\n> *Mary 37*\n\n> \n\n> *Tanya 21*\n\
    \n## Chapter Summary\n\nMaps are unordered collections of pairs of keys and their\
    \ associated values. They’re based on hash tables and serve the same purpose as\
    \ hashes or dicts in other computer languages.\n\n*   Like pointers and slices,\
    \ maps are reference types.\n\n*   Keys can be almost any type, except maps (though\
    \ maps can be value items), slices, and functions.\n\n*   For range is most common\
    \ for iterating over maps, but unless you sort it first, the result can be unordered\
    \ (though later versions of Go sort by key automatically.)\n\n*   Range can also\
    \ provide a list of key values because those aren’t automatic as they are in some\
    \ other languages.\n\n*   You can add, change, or delete values from maps fairly\
    \ easily.\n\n*   Maps can be sorted, as long as you provide a data structure for\
    \ it.\n\nIn the next chapter, you'll learn all about structs.\n\nSeven \n\nIn\
    \ earlier chapters, we promised you’d learn more about structs; you’re finally\
    \ there! *Structs* are collections of data fields with declared data types. In\
    \ Golang, you can combine types, both built-in (like int) and custom, user-defined\
    \ types.\n\nThe only way to create stable user-defined types is to use structs,\
    \ which allow you to create and pass more complex data structures around your\
    \ programs. It’s also common to use structs as a template for a data record, such\
    \ as an employee record or a product for an e-commerce business.\n\nBasically,\
    \ anything that has a set of properties and/or fields is a great candidate for\
    \ a struct. Since an address contains the street name and number, city, state/province,\
    \ zip/postal code, and country name, collecting addresses into a struct makes\
    \ sense. Structs are helpful when you need to organize information, particularly\
    \ when you have a lot of it.\n\n## Introduction to Structs\n\nA really simple\
    \ way to think about a struct is like a recipe. The field names are the ingredients,\
    \ such as salt. The data types are the *kind* of ingredient, like sea salt.\n\n\
    Here’s what the declaration of a struct looks like:\n\n> type identifier struct\
    \ { //where the identifier is the name you’re giving the struct\n\n> \n\n> field1\
    \ data\\_type\n\n> \n\n> field2 data\\_type\n\n> \n\n> field3 data\\_type\n\n\
    > \n\n> }\n\nThe struct type is a blueprint for the kinds of data that the structure\
    \ will hold. There are several ways to declare a struct. Suppose you’re declaring\
    \ a struct named rectangle with three different fields and different types of\
    \ data.\n\n> type rectangle struct {\n\n> \n\n> length float64\n\n> \n\n> width\
    \ float64\n\n> \n\n> color string\n\n> \n\n> }\n\nYou can also initialize one\
    \ by adding data fields using the keyword *var* and dot notation. The latter tells\
    \ the program to access data for a specific type.\n\n> package main\n\n> \n\n\
    > import “fmt”\n\n> \n\n> type rectangle struct {\n\n> \n\n> length float64\n\n\
    > \n\n> width float64\n\n> \n\n> color string\n\n> \n\n> type geometry struct\
    \ {\n\n> \n\n> area int\n\n> \n\n> perimeter int\n\n> \n\n> }\n\n> \n\n> }\n\n\
    > \n\n> func main () {\n\n> \n\n> var rect rectangle //dot notation used here\n\
    \n> \n\n> rect.length = 5\n\n> \n\n> rect.width = 10\n\n> \n\n> rect.color = “violet”\n\
    \n> \n\n> rect.geometry.area = rect.length \\* rect.width\n\n> \n\n> rect. geometry.perimeter\
    \ = 2 \\* (rect. length + rect.width)\n\n> \n\n> fmt.Println(“Area:/t”, rect.geometry.area)\n\
    \n> \n\n> fmt.Println(“Perimeter:”, rect.geometry.perimeter)\n\n> \n\n> }\n\n\
    Another way is to create a struct literal with the fields initialized with their\
    \ values.\n\n> package main\n\n> \n\n> import “fmt”\n\n> \n\n> type Employee struct\
    \ { //as a reminder, since this struct begins with a capital letter, it can be\
    \ used in other packages\n\n> \n\n> lastName, firstName string\n\n> \n\n> salaryint\n\
    \n> \n\n> fullTimebool //allows the programmer to use true/false\n\n> "
