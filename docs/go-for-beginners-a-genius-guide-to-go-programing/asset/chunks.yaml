- raw: "Two more ways that speed up your code development and code performance are\
    \ learning from the mistakes of others and deploying patterns where they make\
    \ sense. When you learn to avoid common pitfalls, you can make your own mistakes\
    \ much faster. (That’s kind of a joke, but not really!)\n\nUsing patterns and\
    \ recognizing where they fit in the development of your program will help you\
    \ skip tedious repetition. You might’ve heard of idiomatic programming, which\
    \ means to follow language conventions. Even though Go is still relatively new,\
    \ it still has conventions. These may change over time, but here are a few you’ll\
    \ probably see.\n\n## Pattern: Comma, OK\n\nOne of the idioms often used is “,\
    \ ok”. It’s useful when you need to clarify the difference between the integer\
    \ zero and the zero value returned for some functions. For example, if you want\
    \ to map the high scores for a game, you need to know the difference between a\
    \ high score of zero and the zero value returned for a player who doesn’t exist.\n\
    \n> highScores := make(map\\[string\\]int)\n\n> \n\n> highScores\\[“Bert”\\] =\
    \ 317\n\n> \n\n> highScores\\[“Ernie”\\] = 433\n\n> \n\n> log.Println(highScores\\\
    [“Ernie”\\]) // returns 433, but if you asked for (highScores\\[“Oscar”\\]) the\
    \ log results in 0. Does that mean Oscar’s high score was zero, or that Oscar\
    \ doesn’t exist on the map?\n\n> \n\n> //so add , ok to avoid this problem.\n\n\
    > \n\n> if val, OK := highScores\\[“Ernie\\]; ok {\n\n> \n\n> log.Println(val)\
    \ // logs 433\n\n> \n\n> }\n\n## Pattern: Visibility and Operator\n\nOne of the\
    \ concepts that are different in Golang is public or private visibility. If you’ve\
    \ programmed in Java, you don’t see protected, public, etc. modifiers. In C++,\
    \ you don’t see the friend class. Golang gives you capitalization (sometimes called\
    \ exported/not exported): public identifiers that can be accessed by any Go user\
    \ begin with a capital letter, while “private” or not exported ones begin with\
    \ a lowercase. Given this limitation, the general advice is to prefer larger and\
    \ fewer packages to avoid overly complex package hierarchies.\n\nYou might find\
    \ Go a bit limiting when it comes to operators, which are functions that return\
    \ a new object and don’t change their parameters. Languages like C++ support overloading\
    \ operators so you can use math-like syntax, but Go does not. Using an operator\
    \ as a function helps you get around the limitation as long as you implement them\
    \ inside a package that contains the objects the code is operating on. You might\
    \ need to use several variations to make it work. Alternatively, using an operator\
    \ as a method allows you to chain methods together. Each method returns a receiver,\
    \ which then becomes the object of the next method call.\n\nUsing interfaces is\
    \ a good practice when you feel an operator is necessary. If you can’t do a generic\
    \ implementation based on the methods in the interface, you probably have items\
    \ that aren’t the same type and shouldn’t use the operator pattern.\n\n## Pattern:\
    \ Defer\n\n*Defer* lets you execute a function just before the surrounding function\
    \ returns, whether or not there’s a panic. There are a few common mistakes that\
    \ developers make with defer that you should be aware of. Remember that recover()\
    \ should *only* be used inside a deferred function. Otherwise, when a panic occurs,\
    \ recover() won’t catch it and will return nil. When using defer, check for errors\
    \ to ensure you don’t miss anything. Using the errors package will help you wrap\
    \ multiple errors, and the information will be in your log so it’s easier to see\
    \ and understand.\n\n## Common Pitfalls\n\nNow you’re ready to learn from others’\
    \ mistakes! If you find something in your programming that you’re not sure about,\
    \ bear in mind the key principles of Go programming: make the code quick to compile,\
    \ quick to run, and easy to read and use.\n\n*   Assignment operator :=\n\nThis\
    \ useful operator allows the developer to avoid declaring a variable before assignment.\
    \ However, because the curly brackets {} define scope, when used with := Golang\
    \ treats the variables as entirely new within the scope, so you may not get the\
    \ results you were expecting. It’s easiest to avoid using := as shorthand and\
    \ beware when you’re switching scope.\n\n*   Incorrect basics\n\nYou can’t use\
    \ the opening brace { on a line by itself; that’s why you’ve always seen\n\n>\
    \ *func main () {*\n\nUnused variables inside functions will fail to compile,\
    \ though it’s OK to have global variables that you don’t use. Similarly, if you\
    \ import a package and don’t use anything from it, you’ll get a compiler error.\n\
    \n*   Nil “gotchas”\n\nYou can’t use nil to initialize a variable unless you also\
    \ declare an explicit type. You can add items to a nil slice, but adding them\
    \ to a nil map creates a panic. In Go, you can’t use nil with strings. With nonexistent\
    \ map keys, the returned value is nil if the zero value for the data type is nil,\
    \ but you’ll get something else with different data types.\n\n*   Array “gotchas”\n\
    \nLike nil, arrays are different in Golang. Instead of pointers, they’re values.\
    \ When you pass an array to a function, the function receives a copy of the data\
    \ and not the data itself. That’s a problem when you need to update the array.\
    \ Use array pointer types or slices if you need to update the data. Unlike other\
    \ languages, arrays (and slices) are not multidimensional; however, you can create\
    \ arrays of arrays and slices of slices to help solve coding issues.\n\n*   Logs\n\
    \nCalling log.Fatal() and log.Panic() logs *and also* ends your program. The Golang\
    \ logging library doesn’t have different log levels.\n\n*   Apps with active goroutines\n\
    \nThe app doesn’t wait for all the goroutines to complete. The most common workaround\
    \ is a WaitGroup variable, which lets all worker goroutines finish before the\
    \ main one starts. You can also close the channel that’s sending information to\
    \ the worker goroutines, which will complete them.\n\n*   Channels\n\nIf you receive\
    \ from a closed channel, you’ll get an indication that no data was received. However,\
    \ if you *send* to a closed channel, it starts a panic. Send and receive operations\
    \ on a nil channel will block forever.\n\n*   Slices\n\nReslicing a slice references\
    \ the array of the original slice, which may lead to more memory usage than you\
    \ expect, especially if you’re using large, temporary slices to refer to small\
    \ sections of the original. Copy the data you need from the temporary slice instead\
    \ of reslicing it.\n\nBeware of “stale” slices; you may reach the point where\
    \ adding data to a slice creates a new array allocation because the original can’t\
    \ handle any more data. At that stage, other slices will point to the original\
    \ array with the old data instead.\n\n## Chapter Summary\n\nThere are common patterns\
    \ frequently used in Golang, and they may be different from similar ones in other\
    \ languages. Beginners in Golang, especially those who’ve programmed in other\
    \ languages, have a variety of “gotchas” that are often made by new developers\
    \ in the language.\n\n*   The comma, ok idiom ( , ok) helps distinguish between\
    \ a zero value and the integer zero.\n\n*   Go uses capitalization to show whether\
    \ an identifier is public or private.\n\n*   You might find operators more limited\
    \ than in other languages, but using interfaces with them is a best practice for\
    \ coders.\n\n*   Common pitfalls can occur due to the differences in otherwise\
    \ similar languages.\n\nWhether you’re an experienced developer or this is your\
    \ first programming language, you now have the basics for beginning your journey\
    \ in the fast and easy Go programming language. It’s prized for speeding up not\
    \ only the execution of the program, but also the development of the code.\n\n\
    You’ve learned why developers use it and why it’s preferred in some programming\
    \ environments, as well as the foundational “vocabulary” which provides a solid\
    \ introduction to the language."
  fmt: "\nTwo more ways that speed up your code development and code performance are\
    \ learning from the mistakes of others and deploying patterns where they make\
    \ sense. When you learn to avoid common pitfalls, you can make your own mistakes\
    \ much faster. (That’s kind of a joke, but not really!)\n\nUsing patterns and\
    \ recognizing where they fit in the development of your program will help you\
    \ skip tedious repetition. You might’ve heard of idiomatic programming, which\
    \ means to follow language conventions. Even though `Go` is still relatively new,\
    \ it still has conventions. These may change over time, but here are a few you’ll\
    \ probably see.\n\n## Pattern: Comma, OK\n\nOne of the idioms often used is `,\
    \ ok`. It’s useful when you need to clarify the difference between the integer\
    \ zero and the zero value returned for some functions. For example, if you want\
    \ to map the high scores for a game, you need to know the difference between a\
    \ high score of zero and the zero value returned for a player who doesn’t exist.\n\
    \n```go\nhighScores := make(map[string]int)\n\nhighScores[\"Bert\"] = 317\nhighScores[\"\
    Ernie\"] = 433\n\nlog.Println(highScores[\"Ernie\"]) // returns 433, but if you\
    \ asked for (highScores[\"Oscar\"]) the log results in 0. Does that mean Oscar’s\
    \ high score was zero, or that Oscar doesn’t exist on the map?\n\n// so add ,\
    \ ok to avoid this problem.\n\nif val, ok := highScores[\"Ernie\"]; ok {\n   \
    \ log.Println(val) // logs 433\n}\n```\n\n## Pattern: Visibility and Operator\n\
    \nOne of the concepts that are different in `Golang` is public or private visibility.\
    \ If you’ve programmed in `Java`, you don’t see `protected`, `public`, etc. modifiers.\
    \ In `C++`, you don’t see the `friend` class. `Go` gives you capitalization (sometimes\
    \ called exported/not exported): public identifiers that can be accessed by any\
    \ Go user begin with a capital letter, while “private” or not exported ones begin\
    \ with a lowercase. Given this limitation, the general advice is to prefer larger\
    \ and fewer packages to avoid overly complex package hierarchies.\n\nYou might\
    \ find `Go` a bit limiting when it comes to operators, which are functions that\
    \ return a new object and don’t change their parameters. Languages like `C++`\
    \ support overloading operators so you can use math-like syntax, but `Go` does\
    \ not. Using an operator as a function helps you get around the limitation as\
    \ long as you implement them inside a package that contains the objects the code\
    \ is operating on. You might need to use several variations to make it work. Alternatively,\
    \ using an operator as a method allows you to chain methods together. Each method\
    \ returns a receiver, which then becomes the object of the next method call.\n\
    \nUsing interfaces is a good practice when you feel an operator is necessary.\
    \ If you can’t do a generic implementation based on the methods in the interface,\
    \ you probably have items that aren’t the same type and shouldn’t use the operator\
    \ pattern.\n\n## Pattern: Defer\n\n`defer` lets you execute a function just before\
    \ the surrounding function returns, whether or not there’s a panic. There are\
    \ a few common mistakes that developers make with `defer` that you should be aware\
    \ of. Remember that `recover()` should *only* be used.\n\n## Common Pitfalls\n\
    \n`defer` lets you execute a function just before the surrounding function returns,\
    \ whether or not there’s a panic. There are a few common mistakes that developers\
    \ make with `defer` that you should be aware of. Remember that `recover()` should\
    \ *only* be used.\n\n### Defer mistakes\n`defer` lets you execute a function just\
    \ before the surrounding function returns, whether or not there’s a panic. There\
    \ are a few common mistakes that developers make with `defer` that you should\
    \ be aware of. \n\n### Visibility and Operator mistakes\nYou might find `Go` a\
    \ bit limiting when it comes to operators, which are functions that return a new\
    \ object and don’t change their parameters. Languages like `C++` support overloading\
    \ operators so you can use math-like syntax, but `Go` does not. Using an operator\
    \ as a function helps you get around the limitation as long as you implement them\
    \ inside a package that contains the objects the code is operating on. You might\
    \ need to use several variations to make it work. Alternatively, using an operator\
    \ as a method allows you to chain methods together. Each method returns a receiver,\
    \ which then becomes the object of the next method call.\n\nUsing interfaces is\
    \ a good practice when you feel an operator is necessary. If you can’t do a generic\
    \ implementation based on the methods in the interface, you probably have items\
    \ that aren’t the same type and shouldn’t use the operator pattern.\n\n### Assignment\
    \ mistakes\nUsing an operator as a function helps you get around the limitation\
    \ as long as you implement them inside a package that contains the objects the\
