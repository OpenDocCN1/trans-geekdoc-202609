  md: '# Correlation between attributes


    The relation between two attributes (feature or label) in a data is called relationship.
    It is important to know the relations between the attributes. We can do so using
    the corr() function and using the Pearson''s Correlation Coefficient to calculate
    that. The Pearson''s Correlation Coefficient can be understood by the following:


    +   - 1 represents positive correlation

    - 0 represents no relation at all

    - -1 represents negative correlation


    ```

    In [2]:

    dt = pandas.read_csv(''trees.csv'')

    pandas.set_option(''precision'',2)

    dt.corr(method=''pearson'')

    ```


    | Index | Girth (in) | Height (ft) | Volume(ft3) |

    |---|---|---|---||

    | Index | 1.00 | 0.97 | 0.47 | 0.90 |

    | Girth (in) | 0.97 | 1.00 | 0.52 | 0.97 |

    | Height (ft) | 0.47 | 0.52 | 1.00 | 0.60 |

    | Volume(ft3) | 0.90 | 0.97 | 0.60 | 1.00 |


    But that we used the precision of the values as 2 to keep the values rounded-off
    to 2 decimal places. In the corr() function we specified pearson in the method
    parameter.

    As we already know that Girth, Height and Volume of tree are correlated that why
    we get the values around 0.5 - 1.0 which represents positive relationship i.e.
    if Height is changed the volume will be affected, if the Girth is changed the
    volume will be affected and vice versa


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_108_0.png)'
