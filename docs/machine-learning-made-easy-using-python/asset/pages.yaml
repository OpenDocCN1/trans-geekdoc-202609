    # Normal Distribution


    Variable’s (features) with mean σ and variance as 1 are called noraml random variables.
    A normal distribution is an arrangement of a data set in which most values cluster
    in the middle of the range and the rest taper off symmetrically toward either
    extreme. In a normal distribution mean, median and mode are same. We can represent
    the distribution as the below graph:


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_73_1.png)


    where μ is mean and σ standard deviation. The formula of normal distribution can
    be represented as:


    ```

    γ (Normal Variable) = [1/σ × √2Π] times e^{-(X-μ)²/2σ²}

    ```


    where e ≈ 2.718'
