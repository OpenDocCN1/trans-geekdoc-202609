    Which model should we use?


    As of now we learned which model does what but we need to also choose between
    these models at times like these. I would like you to choose one from these and
    come up with the best formation of the strikers using your chosen model and the
    provided test values:


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_230_0.png)


    Hint: Remember what are the best qualities of an model?'
