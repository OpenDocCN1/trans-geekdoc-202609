  md: "# Pandas Data Frames\n\nPandas Data Frames aligns data in a tabular fashion\
    \ of rows and columns. A pandas DataFrame can be created using the DataFrame()\
    \ function, we need to pass a dictionary as the data\n\n```\nIn [23]: import pandas\n\
    df = pandas.DataFrame({\"Product\":['Cookies','Biscuits'],\n                 \
    \              \"Sales\":[157,227]})\n\nprint(df)\n\nProduct   Sales\n0 Cookies\
    \  157\n1 Biscuits  227\n```\n\nDictionary keys are the columns and their values\
    \ are the content of the rows of the Data Frame. We can also use index parameter\
    \ here\n\n```\nIn [24]: import pandas\ndf = pandas.DataFrame({\"Product\":['Cookies','Biscuits'],\n\
    \                               \"Sales\":[157,227]}, index=[1,2])\n\nprint(df)\n\
    \nProduct   Sales\n1 Cookies  157\n2 Biscuits  227\n```\n\nWe can define the columns\
    \ and it's separately using ndarrays\n\n```\nIn [42]: import pandas\nimport numpy\n\
    ar = numpy.array([[1,3],[6,2]])\n\ndf = pandas.DataFrame(data = ar,\n        \
    \                             index=['A','B'],\n                             \
    \        columns=['C1','C2'])\n\nprint(df)\n\n   C1 C2\nA  1  3\nB  6  2\n```\n\
    \nThe data is stored in the ndarray and the columns are defined in the DataFrame's\
    \ columns parameter. Note that, a 2-Dimensional ndarray with 2 1-Dimensional arrays\
    \ in it is passed to the data parameter to act as the data"
