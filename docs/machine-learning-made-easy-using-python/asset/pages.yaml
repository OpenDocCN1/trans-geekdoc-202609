  md: "# MATHEMATICS FOR MACHINE LEARNING\n\nVariance or difference of random variables\
    \ from the expected value can be obtained with the following formula where X is\
    \ individual data points, X is mean and n is the total number of data values\n\
    \n```\n$S^2 = \\frac{\\sum_{i=1}^{n} (X_i - \bar{X})^2}{n}$\n```\n\nIf you want\
    \ you can find the variance of any data by replacing the values in the formula\
    \ but make sure to remember how the variance is found\n\nNext if we want to find\
    \ deviation i.e. or the difference of each value from it's average or mean, we\
    \ can use the following formula where i represents the number of values in the\
    \ data and $\tilde{u}$ represents the mean\n\nDeviation = $(X_i - \\tilde{u})$\n\
    \nIf we want to find the deviation of a data of a population we will use the mean\
    \ of the whole population which is represented by $\tilde{u}$\n\n```\n$$\\tilde{u}^2\
    \ = (X_i - \\tilde{u})^2$\n```\n\nBut if we want to find the deviation of a data\
    \ of a sample from a population, we will use the mean of the sample instead of\
    \ the whole population which is represented by $\bar{x}$ i.e. called inferential\
    \ statistics\n\n```\n$s^2 = (X_i - \\bar{X})^2$\n```\n\nSimilarly we can find\
    \ the standard deviation or the dispersion of data from it's mean through the\
    \ following formula where N is the number of data points or values\n\n```\n$$\\\
    sigma = \\sqrt{\\frac{1}{N} \\sum_{i=1}^{N} (X_i - \\tilde{u})^2}$\n```"
  merge: -1
