  md: '# Pandas Operations


    Pandas handles data through Series,Data Frame, and Panel. We will learn to create
    each of these.


    # Pandas Series


    We already know what Pandas Series is. A pandas Series can be created using the
    Series() function so, let''s import pandas and create series.


    ```

    In [14]: import pandas

    sr = pandas.Series([1,5,7])

    print(sr)


    0    1

    1    5

    2    7

    dype: int64

    ```


    As you see our data indexed form 0 to 2 with the data type printed as integer,
    we can specify our own indexes in the index parameter


    ```

    In [16]: import pandas

    sr = pandas.Series([1,5,7], index = [''A'',''B'',''C''])

    print(sr)


    A    1

    B    5

    C    7

    dype: int64

    ```


    Like ndarrays, we can also specify the data type in pandas series using dtype
    parameter during series creation


    ```

    In [18]: import pandas

    sr = pandas.Series([1,5,7], dtype = complex )

    print(sr)


    0    1.000000+0.000000j

    1    5.000000+0.000000j

    2    7.000000+0.000000j

    dype: complex128

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# DATA OPERATIONS


    We can use a ndarray to create a pandas series


    ```

    In [19]: import numpy

    import pandas

    ar = numpy.array([1,5,7])

    sr = pandas.Series(data = ar, copy = True)

    #is as same as sr = pandas.series(ar, copy = True)

    print(sr)


    0    1

    1    5

    2    7

    dype: int32

    ```


    We passed the ndarray as the data for the series [use of the data parameter isn''t
    necessary, its just for better understanding] and also used the copy parameter
    to create a copy of the data. If you want to get the data, without the indexes
    use the values function


    ```

    In [21]: import numpy

    import pandas

    ar = numpy.array([1,5,7])

    sr = pandas.Series(ar)

    print(sr.values)


    [1 5 7]

    ```


    You can print a more detailed version of the above using the array function


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_92_0.png)


    You can use values or array function according to your needs whether you want
    just the values or summarized detail of the arrays in pandas series. Also note
    the difference in the array function in NumPy and Pandas.'
