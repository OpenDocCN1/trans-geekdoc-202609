  md: 'So how did our model predicted teh values or how do the logistic regression
    works? To understand we will see what is the mathematics behind the algorithm,
    if you want you can move ahead or give it read. The followings are the steps of
    linear function of binomial logistics regression:


    +   - We already know that the output will be either Θ(No) or 1(Yes). For that
    the linear function is basically used as an input to another function such as
    g in the following relation


    ```

    $h_\theta(x) = g(\theta^T x) \ [0 \leqslant h_\theta \leqslant 1]$

    ```


    g is the logistic or sigmoid function which can be found with the following formula:


    ```

    $g(z) = \frac{1}{1+e^{-z}}$

    ```


    where $z$ is $\theta^T x$


    +   - We can visualize the sigmoid curve can be understood by the following graph


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_153_0.png)


    the classes can be divided into positive or negative. The output comes under the
    probability of positive class if it lies between 0 and 1. For our implementation,
    we are interpreting the output of hypothesis function as if it is bigger than
    or equal to 0.5 $(\ge0.5$), otherwise negative


    +   - We also need to define a loss function to measure how well the algorithm
    performs using the weights on functions, represented by $\theta$ and $h is equal
    to $g(X\theta)$'
  merge: -1
  img_proc: true
- pgno: 154
  md: '$J(\theta) = \frac{1}{m} (-y^T\log(h) - (1-y)^T\log(1-h))$


    after defining the loss function our prime goal is to minimize the loss function


    +   - It can be done with the help of fitting the weights which means by increasing
    or decreasing the weights. With the help of derivatives of the loss function with
    respect to each weight, we would be able to know what parameters should have high
    weight and what should have smaller weight. The following gradient descent equation
    tells us how loss would change if we modified the parameters:


    ```

    $\frac{\delta J(\theta)}{\delta\theta} = \frac{1}{m}X^T(g(\theta)-y)$

    ```


    # Multinomial Logistic Regression


    As the name suggest this time we will have to predict more than 2 times. In multinomial
    logistic regression we perform classification into 2 or more categories also the
    categories can be just different types like Rain, Hailstorm, Snow, etc. or ordinal
    like Heavy rain, moderate rain or low-rainfall


