  md: '# TYPES OF MACHINE LEARNING


    In the previous lessons we learned about the various libraries and packages used
    in the process of machine learning. Now let''s look at the types of machine learning


    # Types of machine learning


    The followings are the different type of machine learning:


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_51_0.png)


    Let''s look at each of them in detail


    # Supervised learning


    As it''s name suggest in supervised learning we train a machine learning model
    with supervision. We feed the data, train the model and tell the model to make
    predictions. If the predictions are correct we leave the model to work on it''s
    own from there else we help the model to predict correctly until it learns so.
    It is the same as teaching a child to solve questions at first until he can solve
    them on his own.


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_51_1.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Types of supervised learning


    Regression and classification are two types of supervised machine learning. They
    can be understood as:


    +   - Regression is the type of machine learning in which we feed the model with
    data like ''A'' (input, i.e. X) has value of 65 (output, i.e. Y), ''B'' has value
    of 66, etc. Based on the given data, the model learns the relation between the
    input and output (here ''A'' & 65).


    Once the machine is trained with sufficient data we provide a input let''s say
    ''C'' and let the model predict the output, but you must know the real output
    of that input. You check the prediction with the real value and check whether
    it is correct or wrong. If the predictions are correct we pass the model. If the
    predictions aren''t correct we keep training until is reaches a satisfactory point.


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_52_0.png)'
  merge: -1
  img_proc: true
