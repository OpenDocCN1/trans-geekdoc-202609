  md: '# 23 ML APPLICATION 3


    **Problem:** In a wine factory, you are asked to rate the quality of the production
    in a scale of 1 to 5 if different chemical properties are passed as an input for
    the following produced batch and then tell whether the batch is good or not. A
    good scale is more than half (2.5). You have the following sample dataset of some
    1500 samples


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_215_0.png)


    We can use machine learning models to solve the problem but the question is which
    algorithm to choose?

    If you are think of using an classifier algorithm because we need to rate the
    wine then of course you''re wrong. Rating is done to be done in a scale of 1 to
    10 where the rating can be 5 or 5.5 or even 5.45, so for this problem we are going
    to use linear regression

    So let''s our sample dataset and preview it with the `describe()` function along
    with the other necessities


    ```

    In [1]: import pandas

    import numpy

    from sklearn import metrics

    from sklearn.linear_model import LinearRegression

    from sklearn.model_selection import train_test_split

    dt = pandas.read_csv(''wine_sample.csv'')

    dt.describe().round(1)

    ```'
