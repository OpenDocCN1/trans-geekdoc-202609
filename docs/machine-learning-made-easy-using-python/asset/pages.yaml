- pgno: 185
  md: "Before model creation we need to encode the flavour labels using the LabelEncoder.\
    \ We will import the data and encode it\n\n| In [2]: | dt = pandas.read_csv('flavour.csv')\
    \ \n| Enc = LabelEncoder().fit(dt['Flavour']) \n| dt['Flavour'] = Enc.transform(dt['Flavour'])\
    \ |\n\nWe can now create our agglomerative hierarchical clustering Clstr model.\
    \ We will use the age and flavour data\n\n| In [3]: | X = dt.drop(columns='Gender')\
    \ \n| Clstr = AgglomerativeClustering(distance_threshold=0, n_clusters=None) \n\
    | Clstr.fit(X) |\n\n| Out[3]: | AgglomerativeClustering |\n\nWe passed 0 to the\
    \ distance_threshold(The linkage distance threshold above which clusters will\
    \ not be merged) parameter which means we will use the whole dataset and None\
    \ to n_clusters Now we can create a function to plot the heirarchy\n\n| In [4]:\
    \ | # Create Linkage matrix and then plot the dendrogram \ndef plot_dendrogram(model,\
    \ **kwargs):\n    # he create the counts of samples under each node \n    counts\
    \ = numpy.zeros(model.children_.shape[0]) \n    n_samples = len(model.labels_)\\\
    \ \n    for i, merge in enumerate(model.children_):\n        current_count = 0\
    \ \n        for child_idx in merge:\n            if child_idx < n_samples:\n \
    \               current_count += 1 # Leaf node \n            else:\n         \
    \       current_count += counts[child_idx - n_samples] \n        counts[i] = current_count\
    \ \n\n    linkage_matrix = numpy.column_stack([\n        model.children_, model.distances_,\
    \ \n        counts]).astype(float)\n\n    # Plot the corresponding dendrogram\
    \ \ndendrogram(linkage_matrix, **kwargs) |"
  merge: -1
  img_proc: true
- pgno: 186
  md: 'In the plot_dendrogram() we create the counts of samples under each node and
    plot the dendrogram. First of all we calculate the sample count using the zeros()
    function which will return an array with zeros of the shape of the children_attribute
    (under each non-leaf node). We calculate the total number of sample using the
    model.labels_ attribute (label of each datapoint). Then using a for loop we create
    the values(x,y) for heirarchical lines or linkage matrix using enumerate() function
    (enumerate passes an element with numbers starting from 0 to the respective length
    of the elements with the elements like (0,children[0]), (1,children[1]), etc.).
    Then we create the linkage matrix using the column_stack() function and plot the
    heirarchy using the dendrogram() function


