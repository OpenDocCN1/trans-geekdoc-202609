- pgno: 12
  md: '# 01 MACHINE LEARNING INTRODUCTION


    # What is Machine Learning?


    > Data is what you need to do ANALYTICS, Information is what you need to do BUSSINESS.


    Commonly referred to as the “Oil of the 21st century” our digital data carries
    the most importance in the field. It has incalculable benefits in business, research
    and our everyday lives.


    Machine Learning is the field of computer science where machines provide meaning
    to the data like humans do. Machine Learning is an type of artifical intelligence
    which finds patterns in raw data through various algorithms and perform predictions
    like humans. Machine Learning also means machines learn on their own. To better
    understand it think of a new born child and refer it to a machine learning model.
    The parents cannot teach them everything that''s why they leave them to schools
    which can be you in this case with the machine learning model. The school has
    text books, tests, etc. to help you learn on your own which


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_12_0.png)


    +   2. feeding data


    +   1. model creation


    +   3. Learning through patterns in data'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Uses of Machine Learning


    Organizations are investing heavily in technologies like Artificial Intelligence,
    Machine Learning and Deep Learning to get the key information from data to perform
    real-world tasks and solve problems. We can call it data-driven decisions taken
    by machines, particularly data-driven decisions can be used, instead of using
    programming logic, in the problems that cannot be programmed inherently. The fact
    is that we can’t do without human intelligence, but other aspect is that we all
    need to solve real-world problems with efficiency at a huge scale. That is why
    the need for machine learning arises.

    Followings are some of it’s applications in real world:


    +   1. Forecasting weather of a day beforehand through finding patterns of weather
    in the data of weather of previous days


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_13_0.png)


    Predicting the future prices of stocks in the stock market


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_13_1.png)


    suggesting a product to a customer in an online store according to the users previous
    search terms


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_13_2.png)'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# How do machines learn?


    So what magic happens that machines learns like us and perform tasks? Let''s understand
    that by an example. Let''s say you are a new computer dealer. You have very basic
    experience in it. So you ask another dealer and obtain information. You summarized
    the following points to be important like the processor cores, ram and gpu. The
    dealer tells you these and you learn in return. Then you are provided with following
    data about 8gb ram of different brands:


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_14_0.png)


    By observing the data we can tell that the price increases with the increase in
    frequency speeds. You understand an simple logic behind the data. Then if you
    get ram with the following specifications you can tell it''s price, like a ram
    with 1666 Mhz of frequency so its price is 60.


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_14_1.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 16 MACHINE LEARNING INTRODUCTION


    But what if you get an frequency that you don''t have record of like 2600Mhz?
    Then you have to learn how to decide the prices. We start to find a way to calculate
    with the given data. We assume that their is a linear relationship between the
    two. We define the relationship as a straight line as shown below:


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_15_0.png)


    Now we can use the line as reference and predict values. So, for 2600Mhz the cost
    will be about 77. How do we draw out the line. We follow the formula cost = a
    + b * Mhz, but what are a & b? a and b are parameters of the straight line which
    you don''t need to sweat about.


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_15_1.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Likewise in machine learning, the machine i.e. computer learns the patters
    or relations in the data through algoritms and predict values when new value is
    asked.


    So will there be no errors? Definitely it will predict wrong than the actual answer.
    We also do many mistakes but learn from our mistakes or change our tutor if the
    result stays negative. Machine learning models too learn from their mistakes and
    change algorithms when results are not improved.'
  merge: -1
  img_proc: true
