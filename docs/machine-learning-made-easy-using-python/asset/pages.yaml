    In this dataset we have twelve columns which have about 1500 samples. The first
    eleven columns are different chemical properties of wine ie. input and quality
    is the rating i.e. output. The minimum rating is 3 and the maximum is 8. But we
    need to rate the quality of wine on a scale of 1 to 5. So we need to Rescale the
    quality feature in the scale of 1 to 5 and we will do that using the MinMaxScaler


    ```

    In [2]: from sklearn.preprocessing import MinMaxScaler

    Sclr = MinMaxScaler(feature_range=(1,5))

    qual = np.array(dt[''quality''])

    dt[''quality''] = Sclr.fit_transform(qual.reshape(-1,1))

    ```'
