  md: 'We imported the MinMaxScaler and created our Sclr object of the class. We passed
    the scale in the feature_range parameter i.e. 1-5. Then we created a numpy array
    of the quality feature. Then we scaled the data using the fit_transform() function.
    Note that we passed the reshaped array using the reshape(-1,1) function which
    will convert the 1-D array [5,6,7...] to 2-D array [[5],[6],[7],...]]


    Now we can split the data, create our linear regression and train it


    ```

    ### In [3]: X = dt.drop(columns=''quality'')

