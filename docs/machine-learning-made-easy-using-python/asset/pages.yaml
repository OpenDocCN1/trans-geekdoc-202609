    # Entropy and Information gain


    Entropy or the uncertainty in a data can be

    found with the following problem:


    ```

    $H(S) = -\sum_{i=1}^{N} p_i \log_2 p_i$

    ```


    where S stands for set of all instances in a data,

    ref to the number of distinct values and $p_i$

    stands for probability of the event. Through

    we can further calculate information gain

    from a variable through the following formula


    ```

    $Gain(A, S) = H(S) - \sum_{j=1}^{|S|} \frac{|S_j|}{|S|} \times H(S_j)$

    ```


    where A is a feature or variable whose information

    gain is being calculated,H(S) is the entropy of

    the whole dataset,|S_j|$ is the number of instances

    with value j of the feature A, $|S|$ is all data'
  merge: -1
  img_proc: true
