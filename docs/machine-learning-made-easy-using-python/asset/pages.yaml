- pgno: 174
  md: '# CLUSTERING


    Clustering is a case of unsupervised machine learning. The clustering algorithms
    learns relations in the data and classifies it into groups according to whether
    number of groups provided with input or not


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_174_0.png)


    # Clustering


    The findings are the different types of clustering:


    +   * Density-based, clusters are formed as dense regions. These algorithms have
    good accuracy and capability to merge two clusters together. Like, Density-Based
    Spatial Clustering of Applications with Noise (DBSAN), Ordering Points to identify
    Clustering structure (OPTICS)

    * Heirarchical-based, clusters are formed in a hierarchical tree which has Agglomerative
    (Bottom up approach) and Divisive (Top down approach). Like Clustering using Representatives
    (CURE), Balanced iterative Reducing Clustering using Hierarchies (BIRCH)

    * Partitioning, clusters are formed by partitioning the objects into k, number
    of clusters will be equal to that of partitions. Like K-Means

    * Grid, clusters are formed as grid. This method is fast and independent on the
    number of objects. Like Statistical Information Grid (STING), Clustering in Quest
    (CLIQUE)'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Until now we have calculated the accuracy of supervised learning algorithms
    with the predicted values and actual values, how can we do so for unsupervised
    learning algorithms when we are dealing with unlabeled data?


    There are some metrics that can be used to evaluate the performance or quality
    of different unsupervised learning algorithms by the changes in the clusters


    Silhouette analysis used to check the quality of clustering model by measuring
    the distance between the clusters. It basically provides us a way to assess the
    parameters like number of clusters with the help of Silhouette score


    The silhouette score ranges from -1 to 1. The different numbers represent the
    followings:


    +   * 1 is the situation when the cluster is far away from it''s neighbouring
    cluster

    * 0 is the situation when the cluster is very close or on the decision boundary
    itself i.e. separating the clusters

    * -1 is the situation when cluster aren''t formed correctly


    the silhouette score can be calculated using the following formula:


    Silhouette Score = p-q/max(p,q)


    with p is the mean distance to the points in the nearest cluster and q is the
    mean intra-cluster distance to all the points


    Next we can use the Davis-Bouldin Index to know whether the clusters are well
    spaced from each other or not and the density of the clusters. We can calculate
    the DB index using the following formula:


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_175_0.png)'
  merge: -1
  img_proc: true
- pgno: 176
  md: "# 177 CLUSTERING\n\n$DB = \\frac{1}{n} \\max_{j\\neq i} \\left(\\frac{\\sigma_i\
    \ + \\sigma_j}{d(c_i, c_j)}\right)$\n\n$n$ is the number of clusters, $\\sigma^i$\
    \ is the average distance of all points in cluster $i$ from the cluster centroid\
    \ ci.\n\nLower values indicate good performance, where $\\theta$ is the minimum\
    \ value\n\nDunn index is another metric that can be used to evaluate the performance\
    \ of a clustering algorithm. It is similar to the DB index but the difference\
    \ are:\n\n+   - It considers only the clusters close together whereas DB index\
    \ considers all of the clusters\n- Lower Dunn indexes indicates bad performance\
    \ whereas lower the DB index higher the performance of the algorithm\n\nThe Dunn\
    \ index can be calculated using the following formula:\n\n$D = \\frac{\\min_{is1sic<jsn}P(i,j)}{\\\
    max_{is1sic<ksn}q(k)}}$\n\n$i,j,n$ are indices for clusters, $P$ is the inter-cluster\
    \ distance and $q$ is the intra-cluster distance\n\nThe Dunn index increases with\
    \ the performance of the clustering algorithm\n\nWe can evaluate the performance\
    \ of different clustering algorithm (not accuracy of one algorithm) with the following\
    \ metrics:\n\n+   - Silhouette Score\n- Davis-Boulden Index\n- Dunn Index"
  merge: -1
  img_proc: true
