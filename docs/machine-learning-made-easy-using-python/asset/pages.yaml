    # Confusion matrix


    Confusion matrix is used to calculate the

    accuracy of an model. To calculate that we need to

    create the confusion matrix first, let’s consider

    we created a model that predicts weather and we

    asked it to predict whether it will rain for the

    next 30 days. After 30 days, we matched the

    predicted values with the actual values and found

    that the model predicted 25 correctly but 5

    were incorrect. Here 8 is referred as True

    negatives(T-), 3 is referred

    as False positives(F+), 2 is

    referred as as False negatives

    (F-) and 17 as True Positives

    (T+). We can use these values

    to calculate the accuracy of

    the model using the following


    | | Predicted Predicted |

    | --- | --- | --- |

    | Actual no rain | 8 | 3 |

    | Actual rain | 2 | 17 |'
