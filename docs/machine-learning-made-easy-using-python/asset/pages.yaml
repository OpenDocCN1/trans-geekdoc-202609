- pgno: 28
  md: '# 03 PANDAS LIBRARY


    # Pandas


    Data science requires high-performance data manipulation and data analysis, which
    we can achieve with Pandas Data Structures.Python with pandas is in use in a variety
    of academic and commercial domains, including Finance, Economics, Statistics,
    Advertising, Web Analytics, and more. Using Pandas, we can accomplish five typical
    steps in the processing and analysis of data, regardless of the origin of data
    – load, organize, manipulate, model, and analyse the data.


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_28_0.png)


    # Key features of Pandas library


    We can achieve a lot with Pandas library using its features like:


    +   - Fast and efficient DataFrame object with default and customized indexing.

    - Tools for loading data into in-memory data objects from different file formats.

    - Data alignment and integrated handling of missing data.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   Label-based slicing, indexing and subsetting of large data sets.


    +   Columns from a data structure can be deleted or inserted.


    +   Group by data for aggregation and transformations.


    # Series


    Pandas deals with data with it''s data structures known as series, data frames
    and panel. Series is an one-dimensional array like structure with homogeneous
    data. For example, the following series is a collection of integers


    ```

    10 17 23 55 67 71 92

    ```


    As series are homogeneous data structure, it can contain only one type of data
    [here integer]. So, we conclude that Pandas Series is:


    +   It is a homogeneous data structure


    +   Its size cannot be mutated


    +   Values in series can be mutated


    # Data Frames


    DataFrame is a two-dimensional array with heterogeneous data.


    | Day | Sales |

    |---|---|

    | Monday | 33 |

    | Tuesday | 37 |

    | Wednesday | 14 |

    | Thursday | 29 |'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'The data shows the sales of certain product for 4 days. You can think of Data
    Frames a container for 2 or more series. So, we conclude that pandas data frames
    is:


    +   - It can contain heterogeneous data

    - Its size is mutable

    - Also its data is mutable.


    We will use Pandas series and data frames a lot in the future lessons, make sure
    to go through the lesson again and get the grasp of it.


    # Key Points


    +   - Pandas library is a high performance data manipulation and data analysing
    tool.

    - Pandas data structures include series and data frames

    - Series is a 1-Dimensional array of homogeneous data, whose size is immutable
    but values in a series are mutable.

    - Data Frames is a 2-Dimensional array of heterogeneous data of 2 or more series,
    whose size and data are mutable.'
  merge: -1
  img_proc: true
