- pgno: 183
  md: 'So how did the MeanShift algorithm found the clusters even though we didn’t
    specified the number of clusters beforehand?


    Firstof all it starts with the data points assigned to a cluster of their own.
    Then the algorithm will compute the centroids and change the location of new centroids.


    This process will be iterated and moved to the higher density region until the
    centroids reach at position from where it cannot move further.


    # Heirarchical clustering


    As the name suggests, hierarchical clustering is a form of clustering where the
    dataset is divided into groups or categories like a tree which may be into individual
    datapoints or a single cluster


    There are two types of hierarchical clustering as follows:


    +   Agglomerative, is a type of heirarchical clustering where each individual
    datapoint is considered as a cluster and then merge or agglomerate into cluster
    of 2 to 4 to 8 and vice versa until it forms a cluster of the whole dataset


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_183_0.png)'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'Divisive, is the opposite of the agglomerative where the dataset is considered
    as a cluster and then divided into individual datapoints


    # Whole dataset cluster shapes


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_184_0.png)


    Divisive, is the opposite of the agglomerative where the dataset is considered
    as a cluster and then divided into individual datapoints


    Let’s create a hierarchical model to see it action. We will use the flavours.csv
    dataset used in DecisionTreeClassifier (page no. 145) classification algorithm


