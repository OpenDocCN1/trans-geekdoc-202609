  md: '# Skewness of the data


    Skewness of a data is the situation when the data appears to have normal distribution
    but it may be skewed to either left or right. We need the skewness of a data to
    correct the data during it''s preparation. The more the value is close to 0 it
    is less skewed and more the value is close it -1 or 1 it is more skewed to either
    left or right side, let''s check the skewness of our tress using skew() function


    ```

    import pandas

    dt = pandas.read_csv(''trees.csv'')

    pandas.set_option(''precision'',2)

    type(dt.skew)

    ```


    | Index | 0.00 |

    | Girth (in) | 0.55 |

    | Height (ft) | -0.39 |

    | Volume(ft^3) | 1.12 |

    | dtype: float64 |


    The index column has values from 1 to 31 it''s skewness is 0 i.e. not skewness
    at all. On the other hand Girth can be said to be skewed to the right side, Height
    is skewed to the left side and Volume is highly skewed to the right side i.e.
    beyond 1. While data preparation we must consider the skewness and keep it close
    as much as possible to 0


    # Data Processing


    Before feeding the data to models we need to pre-process the data because the
    algorithms are completely depended on the data so it must be clean and appropriate
    as much as possible. While finding skewness we found that you is skewed i.e. it
    needs to be closer to 0 for better results, so let''s look at some processes to
    ready our data'
  merge: -1
  img_proc: true
