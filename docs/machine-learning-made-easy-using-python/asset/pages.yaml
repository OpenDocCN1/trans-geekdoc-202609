  md: '# Scaling


    Our data is spread over a wide range with different scales i.e. not suitable to
    train models. We need to bring our data in a more appropriate scale, we can do
    so using the MinMaxScaler class and it''s fit_transform() method of the scikit-learn
    library. We can scale our data in the range of 0 to 1 which is the most appropriate
    range for the algorithms


    ```

    import pandas as pd

    from sklearn import preprocessing

    dt = pandas.read_csv(''trees.csv'')

    ar = dt.values # array

    # Scaler Object

    Sclr = preprocessing.MinMaxScaler(feature_range=(0,1))

    skl_ar = Sclr.fit_transform(ar) #Scaling

    # Scaled data

    skl_dt = pandas.DataFrame(skl_ar, columns=[''S.No.'', ''Height'', ''Height'',
    ''Volume''])


    skl_dt.round(1).loc[5:10]

    ```


