  md: '# # Importing EXCEL Data


    Microsoft Excel is a very widely used spreadsheet program. Its user friendliness
    and appealing features makes it a very frequently used tool in Data Science. Get
    your sample JSON data here xlsx_data (check the Resources)


    The read_excel function of the pandas library is used read the content of an Excel
    file into the python environment as a pandas DataFrame.


    ```

    In [9]: import pandas as pan

    dt = pd.read_excel("xlsx_data.xlsx")

    dt

    ```


    | id | name | price | sales | brand | Unnamed: 5 |

    |---|---|---|---|---|-|

    | 001 | biscuits | | 227 | HomeFoods | NaN |

    | 102 | cookies | 7.25 | 158 | TBakery | NaN |

    | 103 | cake | 12.00 | 50 | 34 | TBakery |

    | 104 | whey_supplement | 34.90 | 24 | MusleUp | NaN |

    | 105 | protein_bars | 4.90 | 85 | MusleUp | NaN |

    | 106 | potato_chips | 1.75 | 121 | HomeFoods | NaN |


    As excel sheets are imported as Pandas Data-Frames, we can perform all the tasks
    on the excel data like Data Frames.


    You may notice, we have a Unnamed: 5 column with NaN values [except dt.value[2,5]].
    Let’s clean up our data.


    First we need to remove the Unnamed: 5 column, which we can do using the del keyword


    ```

    In [10]: import pandas as pan

    dt = pd.read_excel("xlsx_data.xlsx")

    del dt["Unnamed: 5"]

    ```


    As we have learned earlier the del removes the whole column we don’t need to deal
    with the Data Cleansing'
