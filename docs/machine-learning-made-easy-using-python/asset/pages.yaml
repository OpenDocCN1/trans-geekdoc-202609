    As we already know about the regression algorithm that it is a case of supervised
    machine learning where we feed input data(numeric) and the algorithm learns the
    patterns in the data and predicts the output data. The performance of the algorithm
    is entirely based on it’s learning so we need to have our best to feed the best
    data to our model. So let’s create a regressor with the scikit-learn’s readymade
