  md: '# 114 DATA ANALYSIS & PROCESSING


    The code may be a bit hard to understand because of the loop but let''s try to
    understand it. We normalize the data as we did before but this time we used the
    ‘l2’ method and printed the data values. Then we printed the sum of the values
    of first three rows of the normalized data but they didn''t sum up 1. As the l2
    method states, we printed the sum of the squared values in the first three rows
    using loop which turned out to be exactly 1


    Before the loop, we created a sm_row variable in which we dequare stored a string
    at start. Then we created the outer loop in which we will get the index of the
    rows. Also we entered one more number in the list because at first iteration the
    string in the sm_row will be printed and after printing it we changed it''s value
    to 0 and then we create the inner in which we will perform addition. In each iteration
    of the inner loop we will add the square of each element in the rows with += compound
    assignment operator. After all the values are summed up, we return to the outer
    loop and print it and again revert the value to 0 to store the sum for the next
    row until all the values are printed


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_113_0.png)'
