    data which tells us about the average of the data, 50% or middle value and the
    most occuring value in the whole data


    Likewise we will analyze our data and as mentioned earlier we don''t need to calculate
    them manually or through formula''s, there''s plenty of functions present in different
    libraries to conduct the analysis


