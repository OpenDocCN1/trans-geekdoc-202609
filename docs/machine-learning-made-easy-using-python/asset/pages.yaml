    In [1]: import pandas

    import numpy

    from sklearn.cluster import AgglomerativeClustering

    from matplotlib.pyplot as plt

    from scipy.cluster.hierarchy import dendrogram

    from sklearn.preprocessing import LabelEncoder

    ```'
