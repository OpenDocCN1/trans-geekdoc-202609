- pgno: 161
  md: '# SUPPORT VECTOR MACHINES


    # What is Support Vector Machine


    Support vector machines or SVM is case of supervised machine learning which is
    used for both regressions and classifications. But the working of the SVM’s can
    be considered a bit different. In SVM algorithms divides a dataset into different
    classes or categories in a hyperplane in multidimensional space. The categories
    are divided in a manner to find the maximum marginal hyperplanes or MMH. These
    hyperplanes are generated in an iterative manner to minimize errors


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_161_0.png)


    In the above graph, the data points closest to the hyperplane are called support
    vectors.

    The line separating the class A and class B is the line called hyperplane i.e.
    dividing the data into two class


    And for the line called margin is the gap between two lines on the closet data
    points of different classes. It can be calculated as the perpendicular distance
    from the line to the support vectors. Large margin is considered as a good margin
    and small margin is considered as a bad margin

    The SVM algorithms find the maximum marginal hyperplane to divide the datapoints
    into different classes'
  merge: -1
  img_proc: true
