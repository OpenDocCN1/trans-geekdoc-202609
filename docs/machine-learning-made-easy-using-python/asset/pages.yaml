  md: "# Data Cleansing\n\nLet’s consider a situation like below\n\n```\nIn [71]:\
    \ import pandas as pan\nimport numpy as np\nar = np.array([[1,2,3],[6,7,2],[4,9,1]])\n\
    df = pan.DataFrame(data = ar, index = ['a','c','e'],\n                    columns\
    \ = ['C1','C2','C3'])\n\nOut[71]:\n      C1  C2  C3\na     4   7   2\nc     9\
    \   1\n\nIn [72]: df = df.reindex(['a','b','c','d','e'])\ndf\n```\n\n| | C1 |\
    \ C2 | C3 |\n|---|---|---|---|n| a | 1.0 | 2.0 | 3.0 |\n| b | NaN | NaN | NaN\
    \ |\n| c | 4.0 | 7.0 | 2.0 |\n| d | NaN | NaN | NaN |\n| e | 4.0 | 9.0 | 1.0 |\n\
    \nThe reindexed Data Frame has NaN values in the b and\ndrows. This happened,\
    \ there is no data for b\nd rows. Using reindexing, we have created a Data-\n\
    Frame with missing values. In the output, NaN means\nNot a Number. To make detecting\
    \ missing values easier\n(and across different array dtypes), Pandas provides\n\
    isnull() andisnull() functions, which are also\nmethods on Series and DataFrame\
    \ objects\n\n```\nIn [73]: df['C1'].isnull()\n\nOut[73]:\n      a\na  False\n\
    b    True\nc  False\nd    True\ne  False\nName: C1, dtype: bool\n```"
