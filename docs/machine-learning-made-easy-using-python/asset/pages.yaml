- pgno: 179
  md: '# K-Means Algorithm


    We already know there are different types of clustering algorithms and K-Means
    algorithm is one of those. K-means clustering algorithm computes the centroids
    and iterates until it finds optimal centroid. While using this algorithm we always
    need to pass the number of cluster (n_clusters). It is also called flat clustering
    algorithm. The number of clusters identified from data by algorithm is represented
    by ''K'' in K-means

    We already used the K-Means algorithm in the previous example. So let''s see how
    it worked

    First of all it divided the dataset into n_clusters by dividing the number of
    datapoints in the dataset by it. In our case it created 4 clusters with 60 datapoints
    each


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_179_0.png)


    The process of dividing these clusters is totally random. The algorithm takes
    K(n_clusters) datapoints from the sample and divide them into a cluster

    Next it will compute the cluster centroids for each of the clusters formed


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_179_1.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Next the algorithm keeps iterating the followings until it finds optimal centroid
    which is the assignment of data points to the clusters that are not changing any
    more:


    +   - Sum of squared distance between the datapoints and the centroids


    +   - Assign each datapoint to the cluster closer than the other cluster(centroid)


    +   - Find the centroid of each cluster formed by taking the average of all the
    datapoints in it K-means follows Expectation-Maximization approach to solve the
    problem. The Expectation-step is used for assigning the data points to the closest
    cluster and the Maximization-step is used for computing the centroid of each cluster


    # Mean-Shift Algorithm


    Next we have the Mean-Shift algorithm which assigns the datapoints to the clusters
    iteratively by shifting points towards the highest density of datapoints i.e.
    cluster centroid. The number of clusters is evaluated by the algorithm upon recieve
    the data and analysing it


    We can create a sample dataset using make_blobs() function for clustering using
    the MeanShift algorithm. Let''s import the modules and functions we need


    ```

    In [1]: import numpy

    from sklearn.cluster import MeanShift

    from matplotlib import import pyplot

    from sklearn.datasets import make_blobs

    ```


