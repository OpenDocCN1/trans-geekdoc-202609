    # 12 DATA ANALYSIS


    Python handles data of various formats mainly through the two libraries, Pandas
    and Numpy. We have already seen the important features of these two libraries
    in the previous chapters. In this chapter we will see some basic examples from
    each of the libraries on how to operate on data and perform different tasks like
    cleaning the data, analytics, etc.


    # NumPy Operations


    To start working with NumPy, we need to import numpy to create NumPy arrays.


    ```

    In [ ]: import numpy

    ```


    Let''s create an array, using the array() function and print it.


    ```

    In [2]: import numpy

    ar = numpy.array([1,5,7])

    print(ar)


    [1 5 7]

    ```


    ar is a 1-Dimensional array, we can also create a 2-Dimensional array by creating
    one or more 1-Dimensional array inside of another array


    ```

    In [8]: import numpy

    ar = numpy.array([[1,5,7],[2,3,9]])

    print(ar)


    [[1 5 7]

    [2 3 9]]

    ```


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_89_0.png)'
  - '[PAGE 90]


    We can specify the dimension of an array during creation using the ndmin parameter


    ```

    In [10]: import numpy

    ar = numpy.array([1,5,7], ndmin = 2 )

    print(ar)


    [[1 5 7]]

    ```


    Although we passed a 1-Dimensional array, it became a 2-Dimensional array because
    of the specification of the dimensions of the array in the ndmin parameter

    We created an array with integers so, let''s create arrays with strings and floats
    using the dtype parameter with the same values


    ```

    In [11]: import numpy

    ar_str = numpy.array([1,5,7], dtype = str )

    ar_flt = numpy.array([1,5,7], dtype = float )

    print(ar_str)

    print(ar_flt)


    [''1'' ''5'' ''7'']

    [1. 5. 7. ]

    ```


    ar_str is an array of string literals and ar_flt is an array of floats. We can
    also change these numbers to complex numbers the same way using complex as dtype


    ```

    In [13]: import numpy

    ar_str = numpy.array([1,5,7], dtype = str )

    ar_flt = numpy.array([1,5,7], dtype = float )

    ar_cmx = numpy.array([1,5,7], dtype = complex )

    print(ar_str)

    print(ar_flt)

    print(ar_cmx)


    [''1'' ''5'' ''7'']

    [1. 5. 7.]

    [1.+0.j 5.+0.j 7.+0.j]

    ```


    ar_str, ar_flt and ar_cmx are arrays created with same data, but with different
    data types as strings, floats and complex numbers respectively.'
