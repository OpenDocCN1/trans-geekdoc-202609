    ![](img/d75fea3635f5553f1cb0585b399b1b4b_63_1.png)


    median (x) = \frac{\text{sum of mid pair}}{2} = \frac{29 + 33}{2} = 31


    最后我们有众数（mode）或出现频率最高的值。可以通过视觉化计算，但在我们的数据中没有没有任何重复的值，因此我们考虑以下示例：


