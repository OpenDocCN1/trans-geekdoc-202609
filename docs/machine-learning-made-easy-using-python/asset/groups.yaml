    # KNN ALGORITHMS


    KNN stands for K-Nearest Neighbors, which is a case of supervised machine learning
    used for both regression and classification problems


    # Finding nearest neighbours


    KNN is a lazy learning algorithm i.e. it doesn''t have a special training phase
    instead it uses all the data to for classification or creating regression line
    i.e. at time of prediction. It is also considered non-parametric because it doesn''t
    bother about the underlying data


    K in K-NN stands for nearest datapoints, as it uses ''feature similarity'' to
    predict the values of new datapoints which further means that the new data point
    will be assigned a value based on how closely it matches the points in the training
    set. The KNN algorithms works in the following manner:


    +   * First we need to specify K i.e. (the number of nearest datapoints) say 3

    * Then calculate the distance between test data and each row of training data


