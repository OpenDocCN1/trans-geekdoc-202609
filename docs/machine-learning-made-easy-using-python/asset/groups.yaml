    # How do machines learn?


    So what magic happens that machines learns like us and perform tasks? Let''s understand
    that by an example. Let''s say you are a new computer dealer. You have very basic
    experience in it. So you ask another dealer and obtain information. You summarized
    the following points to be important like the processor cores, ram and gpu. The
    dealer tells you these and you learn in return. Then you are provided with following
    data about 8gb ram of different brands:


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_14_0.png)


    By observing the data we can tell that the price increases with the increase in
    frequency speeds. You understand an simple logic behind the data. Then if you
    get ram with the following specifications you can tell it''s price, like a ram
    with 1666 Mhz of frequency so its price is 60.


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_14_1.png)'
  - '[PAGE 15]


    # 16 MACHINE LEARNING INTRODUCTION


    But what if you get an frequency that you don''t have record of like 2600Mhz?
    Then you have to learn how to decide the prices. We start to find a way to calculate
    with the given data. We assume that their is a linear relationship between the
    two. We define the relationship as a straight line as shown below:


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_15_0.png)


    Now we can use the line as reference and predict values. So, for 2600Mhz the cost
    will be about 77. How do we draw out the line. We follow the formula cost = a
    + b * Mhz, but what are a & b? a and b are parameters of the straight line which
    you don''t need to sweat about.


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_15_1.png)'
