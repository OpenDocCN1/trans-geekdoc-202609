  md: "\n# 12 DATA OPERATIONS\n\n- NumPy operations\n- Pandas operations\n- Cleaning\
    \ data\n\n![](img/d75fea3635f5553f1cb0585b399b1b4b_88_0.png)\n\n# 12 DATA ANALYSIS\n\
    \nPython handles data of various formats mainly through the two libraries, Pandas\
    \ and Numpy. We have already seen the important features of these two libraries\
    \ in the previous chapters. In this chapter we will see some basic examples from\
    \ each of the libraries on how to operate on data and perform different tasks\
    \ like cleaning the data, analytics, etc.\n\n## NumPy Operations\n\nTo start working\
    \ with NumPy, we need to import numpy to create NumPy arrays.\n\n```\nIn [ ]:\
    \ import numpy\n```\n\nLet's create an array, using the array() function and print\
    \ it.\n\n```\nIn [2]: import numpy\nar = numpy.array([1,5,7])\nprint(ar)\n\n[1\
    \ 5 7]\n```\n\nar is a 1-Dimensional array, we can also create a 2-Dimensional\
    \ array by creating one or more 1-Dimensional array inside of another array\n\n\
    ```\nIn [8]: import numpy\nar = numpy.array([[1,5,7],[2,3,9]])\nprint(ar)\n\n\
    [[1 5 7]\n[2 3 9]]\n```\n\n![](img/d75fea3635f5553f1cb0585b399b1b4b_89_0.png)\n\
    \nWe can specify the dimension of an array during creation using the ndmin parameter\n\
    \n```\nIn [10]: import numpy\nar = numpy.array([1,5,7], ndmin = 2 )\nprint(ar)\n\
    \n[[1 5 7]]\n```\n\nAlthough we passed a 1-Dimensional array, it became a 2-Dimensional\
    \ array because of the specification of the dimensions of the array in the ndmin\
    \ parameter.\n\nWe created an array with integers so, let's create arrays with\
    \ strings and floats using the dtype parameter with the same values\n\n```\nIn\
    \ [11]: import numpy\nar_str = numpy.array([1,5,7], dtype = str )\nar_flt = numpy.array([1,5,7],\
    \ dtype = float )\nprint(ar_str)\nprint(ar_flt)\n\n['1' '5' '7']\n[1. 5. 7. ]\n\
    ```\n\nar_str is an array of string literals and ar_flt is an array of floats.\
    \ We can also change these numbers to complex numbers the same way using complex\
    \ as dtype\n\n```\nIn [13]: import numpy\nar_str = numpy.array([1,5,7], dtype\
    \ = str )\nar_flt = numpy.array([1,5,7], dtype = float ) evenar_cmx = numpy.array([1,5,7],\
    \ dtype = complex )\nprint(ar_str)\nprint(ar_flt)\nprint(ar_cmx)\n\n['1' '5' '7']\n\
    [1. 5. 7.]\n[1.+0.j 5.+0.j 7.+0.j]\n```\n\nar_str, ar_flt and ar_cmx are arrays\
    \ created with same data, but with different data types as strings, floats and\
    \ complex numbers respectively.\n\n## Pandas Operations\n\nPandas handles data\
    \ through Series, Data Frame, and Panel. We will learn to create each of these.\n\
    \n### Pandas Series\n\nWe already know what Pandas Series is. A pandas Series\
    \ can be created using the Series() function so, let's import pandas and create\
    \ series.\n\n```\nIn [14]: import pandas\nsr = pandas.Series([1,5,7])\nprint(sr)\n\
    \n0    1\n1    5\n2    7\ndtype: int64\n```\n\nAs you see our data indexed form\
    \ 0 to 2 with the data type printed as integer, we can specify our own indexes\
    \ in the index parameter\n\n```\nIn [16]: import pandas\nsr = pandas.Series([1,5,7],\
    \ index = ['A','B','C'])\nprint(sr)\n\nA    1\nB    5\nC    7\ndtype: int64\n\
    ```\n\nLike ndarrays, we can also specify the data type in pandas series using\
    \ dtype parameter during series creation\n\n```\nIn [18]: import pandas\nsr =\
    \ pandas.Series([1,5,7], dtype = complex )\nprint(sr)\n\n0    1.000000+0.000000j\n\
    1    5.000000+0.000000j\n2    7.000000+0.000000j\ndtype: complex128\n```\n\n##\
    \ DATA OPERATIONS\n\nWe can use a ndarray to create a pandas series\n\n```\nIn\
    \ [19]: import numpy\nimport pandas\n_ar = numpy.array([1,5,7])\nsr = pandas.Series(data\
    \ = ar, copy = True)\n# is as same as sr = pandas.Series(ar, copy = True)\nprint(sr)\n\
    \n0    1\n1    5\n2    7\ndtype: int64\n```\n\nWe passed the ndarray as the data\
    \ for the series, the data parameter isn't necessary, also used the copy parameter\
    \ to create a copy of the data. If you want to get the data without indexes use\
    \ the values function\n\n```\nIn [21]: import numpy\nimport pandas\nar = numpy.array([1,5,7])\n\
    sr = pandas.Series(ar)\nprint(sr.values)\n\n[1 5 7]\n```\n\nYou can print a more\
    \ detailed version of the above using the array function\n\n![](img/d75fea3635f5553f1cb0585b399b1b4b_92_0.png)\n\
    \nAlso note the difference in array function between NumPy and Pandas.\n\n## Data\
    \ Frames\n\nPandas Data Frames aligns data in tabular fashion. A pandas DataFrame\
    \ can be created using the DataFrame() function. Dictionary keys are the columns\
    \ and their values are the content of the rows. We can also use index parameter\
    \ here\n\n```\nIn [23]: import pandas\ndf = pandas.DataFrame({\"Product\":['Cookies','Biscuits'],\
    \ \"Sales\":[157,227]})\nProduct   Sales\nCookies     157\nBiscuits    227\n```\n\
    \nWe can define the columns separately using ndarrays\n\n```\nIn [24]: import\
    \ pandas\ndf = pandas.DataFrame([[157,227]], columns=['Cookies','Biscuits'], index=[0,1])\n\
    # Actually\n0  Cookies     157\n1  Biscuits    227\n```\n\nThe data is stored\
    \ in the ndarray and the columns are defined in the DataFrame's parameter to act\
    \ as the data. We can add columns to the DataFrame using the syntax\n\n```\nIn\
    \ [44]: import pandas\ndf = pandas.DataFrame([[1,3],[6,2]], index=['A','B'], columns=['C1','C2'])\n\
    df['C3'] = df['C1']*5\nprint(df)\n\n   C1  C2  C3\nA   1   3   5\nB   6   2  30\n\
    ```\n\nWe can delete columns from the DataFrame\n\n```\nIn [45]: import pandas\n\
    df = pandas.DataFrame([[1,3],[6,2]], index=['A','B'], columns=['C1','C2','C3'])\n\
    del df['C3']\nprint(df)\n\n   C1  C2\nA   1   3\nB   6   2\n```\n\nWe can print\
    \ a column of the DataFrame using the syntax\n\n```\nIn [46]: import pandas\n\
    df = pandas.DataFrame([[1,3],[6,2]], index=['A','B'], columns=['C1','C2'])\nprint(df['C1'])\n\
    \nA    1\nB    6\nName: C1, dtype: int32\n```\n\n## Slicing Syntax\n\nTo get a\
    \ single element from a ndarray or pandas series or pandas dataframes we need\
    \ to use the slice syntax array[start:end:step(optional)]. Let's extract some\
    \ elements from the arrays we have created so far\n\n```\nIn [59]: import numpy\
    \ as np\nar1 = np.array([[1, 5]])\nar2 = np.array([[1, 3], [5, 2]])\nar3 = np.array([[1,\
    \ 3], [5, 2], [2, 4], [4, 6]])\n\n# Slicing 1-Dimensional array\nprint(ar1[0])\n\
    \n# Slicing 2-Dimensional array\nprint(ar2[0,1])\n\n# Slicing 3-Dimensional array\n\
    print(ar3[1,0,1])\n```\n\nWe use a comma to slice further in 2 or more dimensional\
    \ arrays, the following figure will help you understand the slicing of the 3-Dimensional\
    \ array better\n\n```\nar3[]\n\n```\n[[[1, 3],\n[5, 2]],\n[[2, 4],\n[4, 6]]]\n\
    ```\n\n![](img/d75fea3635f5553f1cb0585b399b1b4b_95_0.png)\n\nar3[1]\n\n```\n[[[1,\
    \ 3], [5, 2]], [[2, 4], [4, 6]]]\n```\n\nFirst Slice\n\nar3[1,0]\n\n```\n[[[1,\
    \ 3], [5, 2]], [[2, 4], [4, 6]]]\n```\n\nSecond Slice\n\nar3[1,0,1]\n\n```\n[[[1,\
    \ 3], [5, 2]], [[2, 4], [4, 6]]]\n```\n\nar3[1,0,1]\n\n```\n4\n```\n\nFinal Slice\n\
    \nSlicing may seem a bit tough for beginners due to the dimensions, that’s why\
    \ I created the figure to help you understand slicing better. If you are confident\
    \ try solving the slicing questions in the Exercise\n\nTo get an element from\
    \ a pandas series, we use the series[explicit_index or implicit_index] syntax\n\
    \n```\nIn [4]: import pandas as pan\nsr = pan.Series([1, 3, 5], index=['a','b','c'])\n\
    \nprint(sr['a']) #Implicit indexing\nprint(sr[0])    #Explicit indexing\n```\n\
    \nIf you have indexes like numbers like these\n\n```\nIn [6]: import pandas as\
    \ pan\nsr = pan.Series([1, 3, 5], index = [2,4,6])\n```\n\nIf you want the second\
    \ element using the implicit index [indexing defined in index parameter] use series.loc<label>\
    \ syntax and using the explicit indexing [ 0,1,2,... ] use series.iloc<index>\
    \ syntax syntax\n\n```\nIn [7]: import pandas as pan\nsr = pan.Series([1, 3, 5],\
    \ index=[2,4,6])\n\nprint(sr.loc[4])\nprint(sr.iloc[1])\n```\n\nWe can modify\
    \ or delete the elements using slicing\n\n```\nIn [9]: import pandas as pan\n\
    sr = pan.Series([1, 3, 5], index=[2,4,6])\n\nsr[4] = 7\nprint(sr)\n\ndel sr[6]\n\
    print(sr)\n\n2    1\n4    7\n6    5\ndtype: int64\n2    1\n4    7\ndtype: int64\n\
    ```\n"
  mdcn: "\n\n# 12 数据操作\n\n- NumPy 操作\n- Pandas 操作\n- 数据清洗\n\n![](img/d75fea3635f5553f1cb0585b399b1b4b_88_0.png)\n\
    \n# 12 数据分析\n\nPython 主要通过 Pandas 和 Numpy 这两个库来处理各种格式的数据。我们在之前的章节中已经学习了这两个库的重要特性。在本章中，我们将看到每个库的某些基础示例，介绍如何操作数据以及执行不同的任务，如数据清洗、分析等。\n\
    \n## NumPy 操作\n\n要开始使用 NumPy，我们需要导入 numpy 来创建 NumPy 数组（arrays）。\n\n```\nIn [ ]:\
    \ import numpy\n```\n\n让我们使用 array() 函数创建一个数组并将其打印出来。\n\n```\nIn [2]: import numpy\n\
    ar = numpy.array([1,5,7])\nprint(ar)\n\n[1 5 7]\n```\n\nar 是一个 1 维数组，我们也可以在另一个数组内部创建一个或多个\
    \ 1 维数组来创建一个 2 维数组。\n\n```\nIn [8]: import numpy\nar = numpy.array([[1,5,7],[2,3,9]])\n\
    print(ar)\n\n[[1 5 7]\n[2 3 9]]\n```\n\n![](img/d75fea3635f5553f1cb0585b399b1b4b_89_0.png)\n\
    \n我们可以在创建数组时使用 ndmin 参数来指定数组的维度。\n\n```\nIn [10]: import numpy\nar = numpy.array([1,5,7],\
    \ ndmin = 2 )\nprint(ar)\n\n[[1 5 7]]\n```\n\n虽然我们传递了一个 1 维数组，但由于 ndmin 参数指定了数组的维度，它变成了一个\
    \ 2 维数组。\n\n我们创建了一个整数数组，所以让我们使用 dtype 参数使用相同的值创建字符串数组和浮点数数组。\n\n```\nIn [11]:\
    \ import numpy\nar_str = numpy.array([1,5,7], dtype = str )\nar_flt = numpy.array([1,5,7],\
    \ dtype = float )\nprint(ar_str)\nprint(ar_flt)\n\n['1' '5' '7']\n[1. 5. 7. ]\n\
    ```\n\nar_str 是字符串字面量数组，ar_flt 是浮点数数组。我们也可以同样使用 complex 作为 dtype 将这些数字改为复数。\n\n\
    ```\nIn [13]: import numpy\nar_str = numpy.array([1,5,7], dtype = str )\nar_flt\
    \ = numpy.array([1,5,7], dtype = float ) evenar_cmx = numpy.array([1,5,7], dtype\
    \ = complex )\nprint(ar_str)\nprint(ar_flt)\nprint(ar_cmx)\n\n['1' '5' '7']\n\
    [1. 5. 7.]\n[1.+0.j 5.+0.j 7.+0.j]\n```\n\nar_str, ar_flt 和 ar_cmx 是用相同数据创建的数组，但数据类型分别为字符串、浮点数和复数。\n\
    \n## Pandas 操作\n\nPandas 通过 Series、Data Frame 和 Panel 处理数据。我们将学习创建每一种对象。\n\n###\
    \ Pandas Series\n\n我们已经知道 Pandas Series 是什么。可以使用 Series() 函数创建 pandas Series，所以让我们导入\
    \ pandas 创建 series。\n\n```\nIn [14]: import pandas\nsr = pandas.Series([1,5,7])\n\
    print(sr)\n\n0    1\n1    5\n2    7\ndtype: int64\n```\n\n如你所见，我们的数据索引从 0 到 2，数据类型为整数，我们可以在\
    \ index 参数中指定自己的索引。\n\n```\nIn [16]: import pandas\nsr = pandas.Series([1,5,7],\
    \ index = ['A','B','C'])\nprint(sr)\n\nA    1\nB    5\nC    7\ndtype: int64\n\
    ```\n\n就像 ndarrays 一，我们也可以在创建 series 时使用 dtype 参数指定 pandas series 的数据类型。\n\n```\n\
    In [18]: import pandas\nsr = pandas.Series([1,5,7], dtype = complex )\nprint(sr)\n\
    \n0    1.0+0j\n1    5.0+0j\n2    7.0+0j\ndtype: complex\n```\n\n## 数据操作\n\n我们可以使用\
    \ ndarray 创建 pandas series。\n\n```\nIn [19]: import numpy\nimport pandas\nar =\
    \ numpy.array([1,5,7])\nsr = pandas.Series(ar, copy = True)\nprint(sr)\n\n0  \
    \  1\n1    5\n2    7\ndtype: int64\n```\n\n传递 ndarray 作为 series 的数据，data 参数是必需的，还使用了\
    \ copy 参数创建数据的副本。如果你想获取没有索引的数据，使用 values 函数。\n\n```\nIn [21]: import numpy\nimport\
    \ pandas\nar = numpy.array([1,5,7])\nsr = pandas.Series(ar)\nprint(sr.values)\n\
    \n[1 5 7]\n```\n\n可以使用 array 函数打印上面的更详细版本 ![](img/d75fea3635f5553f1cb0585b399b1b4b_92_0.png)。\n\
    \n注意 NumPy 和 Pandas 之间的 array 函数差异。Pandas Data Frames 以表格形式对齐数据。可以使用 DataFrame()\
    \ 函数创建 pandas DataFrame。字典的键是列，值是行内容。我们在这里也可以使用 index 参数。\n\n```\nIn [23]: import\
    \ pandas\ndf = pandas.DataFrame({\"Product\":['Cookies','Biscuits'], \"Sales\"\
    :[157,227]})\nProduct   Sales\nCookies     157\nBiscuits    227\n```\n\n可以使用 ndarrays\
    \ 分别定义列。\n\n```\nIn [24]: import pandas\ndf = pandas.DataFrame([[157,227]], columns=['Cookies','Biscuits'],\
    \ index=[0,1])\n0  Cookies     157\n1  Biscuits    227\n```\n\n数据存储在 ndarray 中，列在\
    \ DataFrame 的参数中定义。我们可以使用以下语法向 DataFrame 添加列。\n\n```\nIn [44]: import pandas\n\
    df = pandas.DataFrame([[1,3],[6,2]], index=['A','B'], columns=['C1','C2'])\ndf['C3']\
    \ = df['C1']*5\nprint(df)\n\n   C1  C2  C3\nA   1   3   5\nB   6   2  30\n```\n\
    \n我们可以从 DataFrame 中删除列。\n\n```\nIn [45]: import pandas\ndf = pandas.DataFrame([[1,3],[6,2]],\
    \ index=['A','B'], columns=['C1','C2','C3'])\ndel df['C3']\nprint(df)\n\n   C1\
    \  C2\nA   1   3\nB   6   2\n```\n\n我们可以使用语法打印 DataFrame 的一列。\n\n```\nIn [46]:\
    \ import pandas\ndf = pandas.DataFrame([[1,3],[6,2]], index=['A','B'], columns=['C1','C2'])\n\
    print(df['C1'])\n\nA    1\nB    6\nName: C1, dtype: int32\n```\n\n## 切片语法\n\n\
    要从 ndarray 或 pandas series 或 pandas dataframes 获取单个元素，我们需要使用切片语法 `array[start:end:step(optional)]`。让我们从目前为止创建的数组中提取一些元素。\n\
    \n```\nIn [59]: import numpy as np\nar1 = np.array([[1, 5]])\nar2 = np.array([[1,\
    \ 3], [5, 2]])\nar3 = np.array([[1, 3], [5, 2], [2, 4], [4, 6]])\n\n# 切片 1 维数组\n\
    print(ar1[0])\n\n# 切片 2 维数组\nprint(ar2[0,1])\n\n# 切片 3 维数组\nprint(ar3[1,0,1])\n\
    ```\n\n在 2 维或更多维数组中使用逗号进一步切片，下面的图将帮助你更好地理解 3 维数组的切片。\n\n```\nar3[]\n\n```\n[[[1,\
    \ 3],\n[5, 2]],\n[[2, 4],\n[4, 6]]]\n```\n\n![](img/d75fea3635f5553f1cb0585b399b1b4b_95_0.png)\n\
    \nar3[1]\n\n```\n[[[1, 3], [5, 2]], [[2, 4], [4, 6]]]\n```\n\n第一切片\n\nar3[1,0]\n\
    \n```\n[[[1, 3], [5, 2]], [[2, 4], [4, 6]]]\n```\n\n第二切片\n\nar3[1,0,1]\n\n```\n\
    4\n```\n\n最终切片\n\n"
