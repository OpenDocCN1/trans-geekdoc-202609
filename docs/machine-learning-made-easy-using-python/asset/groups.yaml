    # SciPy 子包


    众所周知，SciPy 被分为涵盖科学计算领域的子包，我们可以根据需要导入它们，而不是导入整个库。下表显示了 SciPy 所有子包的列表：


    | | |

    |---|---|

    | scipy.constants | 数学常数 |

