    描述性统计和推断统计用于机器学习。


    ## 描述性统计


    在描述性统计中，我们处理的是整个数据，即总体而不是样本。在描述性统计中我们有以下内容：


    - **集中趋势**

    数据的平均值、中位数众数被称为其集中趋势。我们可以很容易地找到每一个每一个，让我们考虑以下数据并找到它的集中趋势，


    | 天数 | 销售额 |

