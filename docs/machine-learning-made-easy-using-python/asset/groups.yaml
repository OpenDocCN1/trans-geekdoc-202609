    # PYTHON 机器学习


    机器学习是被认为是未来几年必不可少的技能之一。随着任务的增加，编程已变得非常耗时；机器学习允许机器自主学习，而学习又让机器学会如何产生相同的结果。机器学习通过向其喂送数据让机器能够自主地学习。我假设你已经有了
    Python 编程和数据科学的先知识；如果你没有，可以查看下一页的这些书籍。


    一本面向任何想要用 Python 精通机器学习的人的完整指南。


    Rahul Mula


    # Python 机器学习

    -由 Rahul Mula 编写


