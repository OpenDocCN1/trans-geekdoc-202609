    Likewise in machine learning, the machine i.e. computer learns the patters or
    relations in the data through algoritms and predict values when new value is asked.


    So will there be no errors? Definitely it will predict wrong than the actual answer.
    We also do many mistakes but learn from our mistakes or change our tutor if the
    result stays negative. Machine learning models too learn from their mistakes and
    change algorithms when results are not improved.'
