    The data shows the sales of certain product for 4 days. You can think of Data
    Frames a container for 2 or more series. So, we conclude that pandas data frames
    is:


    +   - It can contain heterogeneous data

    - Its size is mutable

    - Also its data is mutable.


    We will use Pandas series and data frames a lot in the future lessons, make sure
    to go through the lesson again and get the grasp of it.


    # Key Points


    +   - Pandas library is a high performance data manipulation and data analysing
    tool.

    - Pandas data structures include series and data frames

    - Series is a 1-Dimensional array of homogeneous data, whose size is immutable
    but values in a series are mutable.

    - Data Frames is a 2-Dimensional array of heterogeneous data of 2 or more series,
    whose size and data are mutable.'
