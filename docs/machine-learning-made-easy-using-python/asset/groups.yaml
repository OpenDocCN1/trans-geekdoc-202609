    # Label encoding


    In many cases our data has more labels (word) than features (numeric) but using
    words (strings) in processing limits many activities. For that purpose we need
    to change those labels into numeric notations or features like the following example


    ```

    In [15]: import pandas

    from sklearn import preprocessing

    dt = pandas.DataFrame({''Questions'':[''A'',''B'',''C'',''D'',''E''],

    ''Answers'':[''True'',''True'',''False'',''True'',''False'']})


    Out[15]:

    | Questions Answers |

    |---|---|

    | 0 | True |

    | 1 | True |

    | 2 | False |

    | 3 | True |

    | 4 | False |

    ```


    We use the LabelEncoder class for label encoding


    ```

    In [17]: import pandas

    from sklearn import preprocessing

    dt = pandas.DataFrame({''Questions'':[''A'',''B'',''C'',''D'',''E''],

    ''Answers'':[''True'',''True'',''False'',''True'',''False'']})

    Enc = preprocessing.LabelEncoder()

    Enc.fit(dt[''Answers''])

    # Encoded Labels

    dt[''Answers''] = Enc.transform(dt[''Answers''])


    Out[17]:

    | Questions Answers |

    |---|---|

    | 0 | 1 |

    | 1 | 1 |

    | 2 | 0 |

    | 3 | 1 |

    | 4 | 0 |

    ```'
  - "[PAGE 117]\n\nAs you can see that we had the Questions as A-E and Answers as\
    \ True or False. But we encoded the Answers label to be 0(False) or 1(True)\n\n\
    If we want we can get the label for the value or decode the 0 or 1 values using\
    \ the inverse_transform() function\n\n```\nIn [18]: import pandas\nfrom sklearn\
    \ import preprocessing\ndt = pandas.DataFrame({'Questions':['A','B','C','D','E'],\n\
    \                               'Answers':['True','True','False','True','False']})\n\
    Enc = preprocessing.LabelEncoder()\nEnc.fit(dt['Answers'])\n# Encoded labels\n\
    dt['Answers'] = Enc.transform(dt['Answers'])\n# Decoding Labels\nprint(Enc.inverse_transform([0,1]))\n\
    \n['False' 'True']\n```\n\nBy encoding we can hide the true values and perform\
    \ a lot operations with them because they are numerical values. In this data we\
    \ had less only two label values i.e. True and False, but when there are more\
    \ values the encoding will range from 0 to their respective lengths"
