    # Preface


    Why should you learn machine learning? Or what are its uses? Would be the questions
    that may come to your mind. The answer is simple, think that you are given a data
    from an online store about its products and recommend products. The data has a
    product name, its category, its quantity, and rate columns with several hundred
    rows of products. If you want to perform some analysis like the product which
    is most purchased in that day, it will take a lot of time to do it manually. To
    ease up these tasks, we use data analysis, i.e. we run a program with codes to
    perform a certain data analysis. The computer runs the program and we get the
    output in just a few seconds. Then we classify the user and suggest products based
    on preferable categories on the basis of its previous search results. So, How
    to do that? Well, we need to learn Data Science and Machine Learning to perform
    those tasks.


    Businesses & organizations are trying to deal with it by building intelligent
    systems using the concepts and methodologies from Data science, Data Mining and
    Machine learning. Among them, machine learning is the most exciting field of computer
    science. It would not be wrong if we call machine learning the application and
    science of algorithms that provides sense to the data.


    This book is prepared especially for beginners (at Data Science and Machine Learning),
    but you should be familiar with programming in Python. We will work with packages
    and modules like NumPy, SciPy, Pandas, Matplotlib, Scikit-Learn, etc. to perform
    analysis and other tasks. I kept this book open to the basic concepts of data
    science to help the beginners data science concepts prior for machine learning,
    as the book only covers data science, as the name suggests, the book is not for
    you if you’re looking for data science, you check the other books page to find
    that. I also included advanced topics to not limit you to the basics. Machine
    learning, algorithms, data science, etc. may seem tough and boring, but as you
    handle more and more data, you’ll play with it!


