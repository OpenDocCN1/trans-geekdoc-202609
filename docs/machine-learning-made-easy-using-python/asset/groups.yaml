    \ 在我们的数据集中预测了 3 个聚类，即这是正确的。我们通过 `labels_` 属性提取了每个数据点的标签，并用它来绘制聚类。然后我们通过 `Clstr`\
    \ 类的 `cluster_centers_` 属性找到了聚类中心或质心，即它们的 x 和 y 值。聚类的长度（x 和 y 值，即 2D 数组）代表了 `Clstr`\
    \ 预测的聚类数量。接着，使用 for 循环绘制了聚类（注意使用 `labels` 为不同聚类的不同数据点着色），我们还使用 `scatter()` 图绘制了聚类中心，并指定\
    \ `zorder` 为 10 以将其绘制在最前面\n\n那么，尽管我们没有预先指定聚类的数量，MeanShift 算法是如何找到聚类的呢？\n\n首先，它将每个数据点分配到自己的类中。然后算法将计算质心并改变新质心的位置。\n\
    \n这个过程将不断迭代并移动到高密度区域，直到质心达到无法进一步移动的位置。\n\n# 层次聚类\n\n顾如名，层次聚类是聚类的一种形式，将数据集像树一样分为若干组或类别，可以是单个数据点，也可以是单个聚类\n\
    \n层次聚类分为以下两种：\n\n- 凝聚法（Agglomerative）：层次聚类的一种类型，其中每个单独的数据点被视为一个聚类，然后合并或汇合成 2 个、4\
    \ 个、8 个聚类，反之亦然，直到形成包含整个数据集的聚类\n\n![](img/d75fea3635f5553f1cb0585b399b1b4b_183_0.png)\n\
    \n- 划分法（Divisive）：凝聚法的相反，将整个数据集视为一个聚类，然后将其分为单个数据点。\n\n# 整个数据集聚类形状\n\n![](img/d75fea3635f5553f1cb0585b399b1b4b_184_0.png)\n\
