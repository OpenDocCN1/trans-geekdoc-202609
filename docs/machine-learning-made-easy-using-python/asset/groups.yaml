    ```


    首先，我们将数据分为输入（即球员及其表现）和输出（即评分）。然后我们将数据划分为训练集和测试集。如前所述，我们将使用前五场的数据（5名球员 * 5场 = 25），并手动使用切片语法将最后一场比赛作为测试集。


    我们创建了回归模型和分类模型，并用前五场的数据训练了它们。现在让我们传入第六场比赛的数据，让模型根据它们学习的内容对球员进行评分。我们可以创建一个 DataFrame
    来比较这些值。


    ```python

    In [4]: pred_reg = RegModel.predict(stX)

    pred_cls = CModel.predict(stX)

    cmp = pandas.DataFrame({''Regressor'':pred_reg, ''Classifier'':pred_cls, ''Actual'':stY},
    index=plyrs)

    ```


