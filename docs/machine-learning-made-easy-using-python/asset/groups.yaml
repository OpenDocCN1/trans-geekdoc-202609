    - Joint probability, probability of two events at once like drawing a red card
    from a deck of cards

    - Conditional probability, probability of one or more event with conditions. The
    condition may be fulfilled already or need at the moment of the event. For example,
    drawing a joker card from your friend, where it may or not be already present.![](img/d75fea3635f5553f1cb0585b399b1b4b_74_1.png)![](img/d75fea3635f5553f1cb0585b399b1b4b_74_2.png)


    # Bayes Theorem


    Bayes theorem is way of finding probability of an event when we know about the
    probability of other events or conditions. The formula is given as:


    ```

    P(A|B) = \frac{P(B|A) P(A)}{P(B)}

    ```


    Let''s say P(Fire) means how often there is fire, and P(Smoke) means how often
    we see smoke, then:


    - P(Fire|Smoke) means how often there is fire when we can see smoke

    - P(Smoke|Fire) means how often we can see smoke when there is fire


    So we know the following probabilities:


    - dangerous fire = 1%

    - fire with smoke = 10%

    - dangerous fire with smoke = 90%


    Then probability of dangerous fire when there is smoke:


    ```

    P(Fire|Smoke) = 1\% \times 90\% / 10\%

    P(Fire|Smoke) = 9\%

    ```


    Using bayes theorem we can find many probabilities of events. Even there is a
    naïve bayes theorem model in machine learning which will learn in the upcoming
    lessons.


    # 10 SCIKIT-LEARN ALGORITHMS


    - Regression algorithm

    - Classification algorithm

    - Clustering algorithm![](img/d75fea3635f5553f1cb0585b399b1b4b_76_0.png)


