    # 01 MACHINE LEARNING INTRODUCTION


    ## What is Machine Learning?


    Data is what you need to do ANALYTICS, Information is what you need to do BUSINESS.
    Commonly referred to as the “Oil of the 21st century”, digital data carries the
    most importance in business. Machine Learning is a type of artificial intelligence
    which finds patterns in raw data and performs predictions like humans. Machine
    Learning also means machines learn on their own. To better understand think of
    a new born child and refer it to a machine learning model. The parents cannot
    teach them everything which is why they leave them to schools which can be you
    in this case with the machine learning model. The school has text books, tests,
    etc. to help you learn on your own which


    ![](img/d75fea3635f5553f1cb0585b399b1b4b_12_0.png)


    - feeding data

    - model creation

    - Learning through patterns in data


    # Uses of Machine Learning


    Organizations are investing heavily in technologies like Artificial Intelligence,
    Machine Learning and Deep Learning to get the key information from data to perform
    real-world tasks and solve problems. We can call it data-driven decisions taken
    by machines, particularly data-driven decisions can be used, instead of using
    programming logic, in the problems that cannot be programmed inherently. The fact
    is that we can’t do without human intelligence, but other aspect is that we all
    need to solve real-world problems with efficiency at a huge scale. That is why
    the need for machine learning arises. Followings are some of it’s applications
