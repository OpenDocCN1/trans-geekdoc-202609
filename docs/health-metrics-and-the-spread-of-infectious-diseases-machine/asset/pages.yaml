- pgno: 130
  md: '# Essential R Packages for Machine Learning


    Learning Objectives


    +   * Gain an overview of essential R packages for modelling and data analysis

    * Apply various modelling frameworks using appropriate R tools

    * Learn how to discover and evaluate new R packages for specific analytical tasks


    This chapter provides an overview of the most suitable R-packages for machine
    learning. It also discusses the combination of packages and functions to achieve
    the desired results. Additionally, it explores how to find new R-packages and
    evaluate their suitability for a given task.


    # 8.1 Inside and Outside of the Library Boxes


    When comes to R, the possibilities are endless. With over 15,000 packages available
    on CRAN (Comprehensive R Archive Network) and countless others on GitHub and other
    repositories, the universe of available packages is vast. Who to untangle all
    of them? Which one to choose? Sometimes it is rather favourable to start by working
    out of the library boxes, which means using functions provided in the built-in
    packages inside a fresh installation.


    However, the vast majority of time, the best way to start is by using the packages
    that are already available in the R ecosystem. These packages are designed to
    make your life easier by providing pre-built functions for common tasks. They
    can help you save time and effort by automating repetitive tasks and streamlining
    complex analyses.


    Life has become easier with the advent of wrapping functions and the reduction
    of lines of code through use of functions found in packages. In the past, data
    analysis and modelling required extensive coding, often involving repetitive tasks
    and lengthy scripts. As a result, users can achieve sophisticated results more
    efficiently, without the need to write lengthy and intricate scripts from scratch.
    This shift has not only simplified the process of data analysis and modelling
    but has also democratised access to advanced statistical techniques, making them
    more accessible to a broader audience.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# 8.2 Essential R Packages for Machine Learning


    Some of the most used modelling packages that are particularly useful for machine
    modelling of the spread of infectious diseases and evaluating DALYs variation
    due to infectious include:


    # 8.2.1 Meta-Packages


    +   1. {tidymodels}¹ This framework provides a collection of packages for modelling
    and machine learning tasks, including {tidyr}, {dplyr}, and ggplot2. It offers
    a consistent and tidy workflow for preprocessing, model building, evaluation,
    and visualisation.

    2. {caret}² The caret framework for Classification and REg provides a unified
    interface for training and evaluating machine learning models. It supports a wide
    range of algorithms and offers convenient functions for hyperparameter tuning
    and model selection.

    3. {mlr3}³ This is a modern and extensible framework for machine learning. It
    provides a unified interface for modelling tasks, making it easy to train and
    evaluate a wide range of machine learning algorithms.


    # 8.2.2 Engines


    Engines are the actual implementations of machine learning algorithms. They perform
    the computations necessary to train and evaluate models. Engines can be integrated
    into various meta-packages/frameworks to leverage their specific algorithms and
    computational efficiencies. Each engine might have its own set of parameters and
    functionalities, which can be accessed through the high-level interfaces provided
    by meta-packages.


    +   1. {randomForest}: For random forest models.

    2. {xgboost}: An optimised distributed gradient boosting library designed to be
    highly efficient, flexible, and portable. It implements machine learning algorithms
    under the gradient boosting framework.

    3. {glmnet}: For lasso and ridge regression.

    4. {nnet}: For neural networks.

    5. {kernel}: For kernel-based machine learning methods.

    6. {e1071}: For support vector methods and other functions.

    7. {lme4}: For linear and generalised mixed-effects models.

    8. {mgcv}: For generalised additive models.

    9. {rpart}: For recursive partitioning and regression trees.

    10. {h2o}: A powerful machine learning framework that can be efficiently integrated
    with {tidymodels}. {h2o} offers a range of machine learning algorithms, including
    linear models, tree-based models, and ensemble methods, with efficient handling
    of large datasets and support for parallel computing.


    > ¹Silge and Julia, Tidy Modeling with r.

    ²Max Kuhn, The Caret Package, n.d., https://topepo.github.io/caret/.

    ³Mlr-Org, n.d., https://mlr-org.com/.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '{keras3}, the R interface to Keras, is a deep learning technique which provides
    high-level neural networks API written in Python. Designed to enable fast experimentation
    with deep learning models on top of {tensorflow} (an open-source machine learning
    framework developed by Google).


    # 2.2.3 Time Series Analysis


    +   1. {forecast}: For forecasting functions.

    2. {prophet}: Specifically designed for time series forecasting with an emphasis
    on flexibility and ease of use. Developed by Facebook, prophet can handle various
    time series patterns, including seasonality, holiday effects, and trend changes,
    making it suitable for modelling infectious disease over time.

    3. {fpp3}:4 This package is part of the Forecasting: Principles and Practice (3rd
    edition) offering data and tools for forecasting time series data, such as the
    import of the {fable} package with the ARIMA() model which is relevant for modelling
    disease spread over time.


    # 2.2.4 Bayesian Analysis


    +   1. {rms}: For Bayesian generalised multivariate non-linear multilevel models
    using Stan.\n2. {rstan}: For Bayesian inference using Stan.


    # 2.2.5 Specialized Tools


    +   1. {spdep} is a powerful tools for spatial statistics, it provides a set of
    functions for analysing spatial dependencies and autocorrelation in spatial data,
    particularly relevant in infectious disease modelling. It also incorporates spatial
    effects into models and allows for a better understanding of how infectious diseases
    spread across space.\n2. {INLA}:5 Integrated Nested Laplace Approximations (INLA)
    is a package for Bayesian inference using the INLA method. It is particularly
    useful for spatial and spatio-temporal modelling, which can be relevant for studying
    the spread of infectious diseases.


    These packages offer a diverse set of tools and techniques for modelling infectious
    disease spread and assessing its impact on health metrics like DALYs. These packages
    provide valuable insights into the dynamics of infectious diseases and can be
    used to inform public health interventions and policies. However, whether these
    are the most suitable depends on various factors, including:


    +   * the specific requirements of the analysis

    * the expertise of the researcher

    * the nature of the data being used


    Each package has its strengths and weaknesses, and the choice of package often
    depends on factors such as:


    +   * the complexity of the modelling task


    > ^4Forecasting: Principles and Practice (3rd Ed), n.d., https://otexts.com/fpp3/\n^5R-INLA
    Project - What is INLA?” n.d., https://www.r-inla.org/what-is-inla.'
