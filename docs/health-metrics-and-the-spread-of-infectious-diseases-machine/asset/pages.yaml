  md: "# COVID-19 and DALYs\n\nWe know that the simplified formula for YLDs is the\
    \ prevalence of the disease multiplied by the disability weight. To calculate\
    \ the prevalence, we need the population of every country. For this task we use\
    \ the {wpp2022} package, which provides the population data from the 2022 revision\
    \ of the United Nations World Population Prospects (WPP 2022). It includes both\
    \ historical estimates and projections of demographic indicators such as population\
    \ counts and fertility rates, accommodating the changes brought by events like\
    \ the COVID-19 pandemic and transitioning from five-year to one-year data intervals.\n\
    \n```\nlibrary(wpp2022)\n# data package = \"wpp2022\"\n\ndata(popidt)\npop_4countries\
    \ <- popidt %%\nfilter(\n  year %in% c(2020, 2021),\n  name %in% c(\n    \"United\
    \ States of America\",\n    \"China\",\n    \"United Kingdom\",\n    \"Canada\\\
    )) %%\n  mutate(name = ifelse(name == \"United States of America\", \"US\", name))\
    \ %%\n  select(name, year, pop) %%\n  arrange(year, name)\n```\n\n```\npop_4countries\
    \ %>% head(\n#  name      year      pop\n#  <char> <int> <num>\n# 1: Canada 2020\
    \ 38018.19\n# 2: China  2020 1425861.54\n# 3: US     2020 336495.77\n# 4: United\
    \ Kingdom 2020 67167.77\n# 5: Canada 2021 38290.85\n# 6: China  2021 1425925.39\n\
    ```\n\nCalculate the prevalence of COVID-19 cases per 1,000,000 people.\n\n```\n\
    prevalence = \\frac{cases}{population} * 1,000,000\n\nCOVID19_dalsys <- COVID19_yll_4months\
    \ %%\n  full_join(pop_4countries,\n    by = c(\"country_region\" = \"name\", \"\
