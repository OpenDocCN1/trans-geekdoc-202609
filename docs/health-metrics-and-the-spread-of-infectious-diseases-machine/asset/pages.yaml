    tailored case studies, data sources, modelling, and visualisation techniques.
    We discussed key health metrics such as mortality rates, life expectancy, Disability-Adjusted
    Life Years (DALYs), Years of Life Lost (YLLs), and Years Lived with Disability
    (YLDs). We also examined the role of risk factors, disease burdens, and health
    outcomes in shaping population health profiles.


    In this final chapter, we will focus on visualising health metrics across countries
    to understand the state of health globally. We will explore the implications of
    cross-country comparisons of health metrics for public health policy and interventions.
    We will use data from the **Global Burden of Disease (GBD)** study and the OECD''s
    **Health at a Glance** report to compare health indicators, disease burdens, and
    risk factors across different countries. By analysing health metrics at the country
    level, we can gain insights into public health priorities, identify areas for
    improvement, and inform global public health policy.


    # 17.1 Data Sources for Health Metrics Comparison


    Data availability is crucial for comparing health metrics across countries and
    regions. The **OECD''s Health at a Glance** report and the **Global Burden of
    Disease (GBD)** study offer comprehensive data on health indicators, disease burdens,
    and risk factors, enabling cross-country comparisons and insights into public
    health priorities.


    # 17.1.1 Example of OECD Health at a Glance Data


    The **OECD''s Health at a Glance** report offers a comparative overview of health
    indicators among member countries. The report examines metrics such as life expectancy,
    health expenditures, and major health trends. It also provides accessible insights
    into public health priorities and performance indicators, facilitating comparisons
    and helping to identify areas for improvement (www.oecd-ibrary.org).


    In this example, we will download data from the OECD''s Health at a Glance report
    (https://data-explorer.oecd.org/) to compare **Disability-adjusted life years
    (DALYs)**


    DOI: 10.1201/97881032625935-17'
