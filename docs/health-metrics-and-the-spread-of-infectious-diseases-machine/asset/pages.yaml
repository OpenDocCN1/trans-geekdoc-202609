- pgno: 146
  md: "# Essential R Packages for Machine Learning\n\n```\nL(y, \\hat{y}) = -\\frac{1}{n}\
    \ \\sum_{i=1}^{n} y_i \\log(\\hat{y}_i) + (1 - y_i) \\log(1 - \\hat{y}_i)\n```\n\
    \nwith $L$ is the loss, $y$ is the true value, $\\hat{y}$ is the predicted value,\
    \ and $n$ is the number of samples.\n\nThe optimizer\\_adam() function, is used\
    \ to update the model's weights during training, in **Keras** specifies the use\
    \ of the **Adaptive Momentum Estimation (Adam)** optimization algorithm for a\
    \ neural network. It updates the parameters of the neural network.\n\nThen finally,\
    \ the model is evaluated on performance with the **accuracy** metric.\n\n```\n\
    # Compile the model\nmodel %>% compile(loss = \"binary_crossentropy\",\n     \
    \             optimizer = optimizer_adam(),\n                  metrics = c(\"\
    accuracy\"))\n```\n\nOnce the model is defined and compiled, the model is trained\
    \ using the `fit()` function with the training data, using **epochs**, **batch\
    \ size**, and **validation** split specified. The number of epochs is the number\
    \ of times the model will go through the training data, the batch size is the\
    \ number of samples used in each training step, and the validation split is the\
    \ fraction of the data that will be used for validation.\n\nA particular object\
    \ that created in this type of models is the **history** object, which is used\
    \ to store the training history of the model. This object contains information\
    \ about the loss and accuracy of the model on training and validation data training.\n\
    \n```\nhistory <- model %>% fit(x = as.matrix(social_data[, 1:p]),\n         \
    \                     y = social_data$infection,\n                           \
    \   epochs = 30,\n                              batch_size = 128,\n          \
    \                    validation_split = 0.2)\n```\n\nThe subsequent times the\
    \ **history** object is created, the model is trained with half the number of\
    \ epochs and batch size. And these specifications can further be adjusted as needed.\n\
    \n```\nhistory2 <- model %>% fit(x = as.matrix(social_data[, 1:p]),\n        \
    \                      y = social_data$infection,\n                          \
    \    epochs = 30 / 2,\n                              batch_size = 128 / 2,\n \
    \                             validation_split = 0.2)\n```\n\nThere are two attempts\
    \ of the trained model with different parameters, with the first with 30 epochs\
    \ and a batch size of 128, and the second with 15 epochs and a batch size of 64.\
    \ The training history of both models is then plotted to compare their performance.\n\
    \nThe model is then used to predict the probability of infection based on the\
    \ social media data. The predictions are then converted to binary values using\
    \ a threshold of 0.5, where values greater than 0.5 are classified as 1 (infected)\
    \ and values less than or equal to 0.5 are classified as 0 (not infected).\n\n\
    ```\nnew_social_data <- matrix(rnorm(p * 160),\n                             \
    \  nrow = 160, ncol = p)\n```"
