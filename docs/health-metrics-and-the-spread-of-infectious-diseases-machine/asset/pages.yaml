    **15.13** YLLs by Country and Month Cycle


    The majority of YLLs are in the United Kingdom, followed by the US, Canada, and
    China. The YLLs are highest in the first 4-month cycle (Jan-Apr) and decrease
    in the following cycles.


    Let''s now calculate the YLDs for COVID-19. The YLDs are calculated by multiplying
    the number of cases by the disability weight. The Disability Weight applied is
    for low respiratory diseases which is 0.133. As of 2020, the Global Burden of
    Disease Study 2019 estimated the DALYs for lower respiratory diseases were 1,000,000.
    We can use the `hmisdwr` package to get the disability weight for lower respiratory
    diseases.


    ```

    hmisdwr::%

    filter(str_detect(sequela, "lower respiratory\))%%%

    select(sequela, du)

    # # A tibble: 4 x 2

    #   sequela                               dw

    #   <chr>                               dbl>

    #   1 Moderate lower respiratory infections 0.051

    #   2 Severe lower respiratory infections 0.133

    #   3 Moderate lower respiratory infections 0.0506

    # 4 Severe lower respiratory infections 0.133

    ```'
