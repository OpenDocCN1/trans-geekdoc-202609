- pgno: 65
  md: '# Disability Weights and Severity Levels


    the burden of the disease may be overestimated. Conversely, if the disability
    weight is underestimated, the burden of disease could result underestimated.$^4$


    The severity levels of a disease or injury are determined through a combination
    of clinical data, epidemiological studies, and expert input. These levels are
    crucial for understanding the burden of disease and for developing strategies
    in healthcare management and resource allocation. The severity levels can be assigned
    to mild, moderate, or high, with respective probabilities reflecting the likelihood
    of each severity level occurring within the affected population.


    Table 4.8 Example Disability Weights


    | Condition | Disability Weight |

    | Mild Depression | 0.15 |

    | Moderate Anxiety | 0.30 |

    | Severe Stroke | 0.75 |

    | Diabetes (without complications) | 0.10 |

    | Advanced Dementia | 0.85 |


    For determining the disability weights, the severity levels are assigned based
    on the impact of the condition on an individual''s quality of life. Higher weights
    are assigned to more severe conditions, reflecting the greater impact on an individual''s
    health status, while lower weights are assigned to less severe conditions. Hence,
    the disability weights are calculated based on the severity of the condition and
    the impact on an individual''s quality of life.


    # 4.5.1 Methodology for Disability Weights


    The disability weights can be derived or computed, depending on data availability.
    Often derived through large-scale population surveys, or expert panels through
    reviews of clinical descriptions and assessment scores based on understanding
    and professional experience. These methods involve trade-exercises, such as Time
    Trade Off (TTO)$^5$ or paired comparison tasks.$^6$ Through surveys the respondents
    are asked to choose between different health states or to trade years in life
    between health states against a standard of health. Expert panels would assess
    the severity of health states based on clinical descriptions and their professional
    experience, rating the severity on a scale from 0 (no disability) to 1 (equivalent
    to death).


    Computed disability weights can vary by applying techniques such as Analytical
    Hierarchy Process (AHP)$^7$ method where health states are systematically compared
    in a pairwise fashion, and judgments about their relative severity are quantified.
    Combining Results from different methods and different populations to produce
    a set of


    > $4Minsuk et al., "Disability Weights Measurement for 28 Causes of Disease Considering
    Disease Severity in Korea," Journal of Medical Science, 34, no. Suppl 1 (February
    2019): e660, doi:10.3346/jkms.2019.34.60.


    > $6Jürgen Regen and Ulrich Rich, "Establishing Disability Weights from Pairwise
    Comparisons for US Burden of Disease Study," International Journal of Methods
    in Psychiatric Research, 22, no 2 (May 2013): 144–154, doi:10.1002/impr.1383.


    > $7Analytical Hierarchy Process," Wikipedia, March 2024, https://en.wikipedia.org/w/index.php?title=Analytic_hierarchy_process&id=121453274.'
