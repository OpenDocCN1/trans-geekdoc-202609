  md: "Practical Insights and Examples\n\nThe explainer_rf object contains the model,\
    \ the data, and the target variable and it will be used to create the partial\
    \ dependence plot with the model_profile() function.\n\nA Partial Dependence Plot\
    \ (PDP) is a tool used in machine learning to help interpret black-box models\
    \ like random forests. It shows the marginal effect of one (or two) features on\
    \ the predicted outcome, while averaging the influence of all other features.\n\
    \nIn this case we specify the MaxStenosisByArea variable, to see how changes in\
    \ MaxStenosisByArea influence the model's predicted outcome, on average. A higher\
    \ value of MaxStenosisByArea indicates more severe arterial narrowing, which is\
    \ a risk factor for stroke or heart attack.\n\n```\nDALEX::model_profile(explainer_rf,\n\
    \  variables = \"MaxStenosisByArea\") %>%\nplot() + \nlabs(\n  title = \"Partial\
    \ Dependence Plot for Ischemic Stroke\",\n  subtitle = \"\",\n  x = \"Value\"\
    ,\n  y = \"AVG Prediction\" + \n  theme_minimal())\n```\n\n# Partial Dependence\
