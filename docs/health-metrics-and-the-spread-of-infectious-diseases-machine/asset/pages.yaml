    Once the recipe is created, we can apply it to the data using the prep() function,
    which estimates the necessary parameters for the transformations and applies them
    to the data. Then, to check the results we use the juice() function to extract
    the processed data.


    ```

    rec1 %>%

    prep() %>%

    juice() %>%

