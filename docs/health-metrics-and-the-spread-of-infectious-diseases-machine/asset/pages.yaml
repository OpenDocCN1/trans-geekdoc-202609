    \ with this url = https://api.healthdata.org/sdg/v1/GetResultsTsByIndicator?indicator_id=1001&location_id=86&year=2019\n\
    \n```\nheaders <- c(\"Authorization\" = \"YOUR-KEY\")\nres <- GET(url,\n  add_headers(headers))\n\
    ```\n\n```\nres$content%%%\nrawToChar()%\nfromJSON(res)\n```\n\nAn advanced version\
    \ of the gbd_get_data() function can be found in the {hmsidWR} package. The function\
    \ hmsidWR:gbd_get_data() allows you to use endpoint customisation, instead of\
    \ using sdg argument with the long query, an endpoint is to specify the starting\
    \ point of the query, with GetResultsByIndicator. Then, the user can specify the\
    \ indicator_id, location_id, and year to download the data for specific indicator,\
    \ location, and year.\n\nThe function requires the arguments to be with quotation\
    \ marks:\n\n```\nhmsidWR::gbd_get_data(\n  url = \"https://api.healthdata.org/sdg/v1\"\
    \n  key = \"YOUR-KEY\",\n  endpoint = \"GetResultsByIndicator\",\n  indicator_id\
