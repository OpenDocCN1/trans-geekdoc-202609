  md: '# 15


    # COVID-19 Outbreaks


    Learning Objectives


    +   - Understand the key characteristics and impact of COVID-19

    - Explore how COVID-19 spreads through populations and environments

    - Learn to map and visualize COVID-19 outbreaks using spatial data


    In this chapter, we explore the dynamics of COVID-19 disease outbreaks in more
    detail. We examine the results of various model''s applications that simulate
    the spread of the virus.


    # 15.1 Epidemiology


    COVID-19, short for "Coronavirus Disease 2019," is an infectious disease caused
    by the novel coronavirus SARS-CoV-2, a type of virus that is part of the Coronaviridae¹
    of viruses that can cause illness in humans and animals alike. The virus was first
    identified in 2019 in Wuhan, Hubei province, China, and has since spread globally,
    leading to a pandemic.²


    The origin of the virus is still under investigation³, but it is believed to have
    zoonotic⁴ origins, with bats being the most likely reservoir. The virus has also
    been linked to pangolins,⁵ mammals that are illegally trafficked for their scales
    and meat. The virus is thought to have jumped from animals to humans, possibly
    through a market in Wuhan where live animals were sold.


    Zoonotic diseases are a critical area of study in public health and epidemiology
    due to their significant impact on human populations and the potential for pandemics.
    As discussed by MD Laura H. Kahn in One Health and the Politics of COVID-19,⁶
    the pandemic''s origins and spread highlight the critical need for holistic understanding
    of health systems that integrates human, animal, and environmental health. Zoonotic
    viruses can be transmitted from animals to humans through direct contact, consumption
    of contaminated food or water, or exposure to infected animal products. These
    viruses can cause a range of diseases,


    > ¹-Wikipedia, n.d., https://en.wikipedia.org/wiki/Coronavirus.

    ²-Wikipedia, n.d., https://en.wikipedia.org/wiki/Pandemic.

    ³-WHO-conven Global Study of Origins of SARS-CoV-2: China Part, n.d., https://www.who.org/publications/i/item/who-convened-global-study-of-origins-of-sars-cov-2-china-part

    ⁴-Zoonosis: Wikipedia, n.d., https://en.wikipedia.org/wiki/Zoonosis.

    ⁵-Xing Yao et al., "A Pangolin-Origin SARS-CoV-2-Related Coronavirus: Infectivity,
    Pathogenicity, and Preexisting Immunity," Cell Discovery 9, no. 1 (June 17, 2023):
    1–13, doi:10.1038/s41467-...

    ⁶-D. Laura H. Kahn, One Health and the Politics of COVID-19 (Johns Hopkins University
    Press, 2024), doi:10.5628/9781032644932.


    DOI: 10.1201/9781032644925-15


    232'
