  md: 'xiv


    Preface


    Overall, a multidisciplinary approach, combining aspects of health sciences, statistics,
    and technology, will enrich the reader''s experience.


    # Acknowledgements


    A big thank you to all my friends and colleagues for their support throughout
    this journey. Your encouragement and belief in my work have been invaluable.


    This book is the result of nearly four years of dedicated work, research, and
    continuous learning in the field of data science and public health. My journey
    began as a consequence of the COVID-19 outbreak. Witnessing the global impact
    of this pandemic inspired me to investigate the spread of infectious diseases
