    \ = countrycode::country(ref_area,\n                               origin = \"\
    iso3c\",\n                               destination = \"country.name\"))\n```\n\
    \nFinally, to visualise the data use a line plot to compare Disability-adjusted\
    \ life years (DALYs) due to Ambient Matter as a risk exposure per 1000 inhabitants\
    \ for Egypt, Serbia, Morocco, Italy, and Iceland. These countries were selected\
    \ based on geographical location and varying levels of DALYs due to Ambient Matter.\n\
    \nWe can conclude that the Disability-adjusted life years (DALYs) due to Ambient\
    \ Matter Varied across countries from 2010 to 2019. This variation may be due\
    \ to differences in environmental policies, air quality, and health interventions\
    \ aimed at reducing exposure to particulate matter. In particular, countries like\
    \ Egypt and Serbia experienced higher DALYs due to Ambient Matter compared to\
    \ countries like Iceland and Italy.\n\nIn general, the data shows that regions\
    \ with high pollution, such as parts of East Asia, saw increased DALYs from respiratory\
    \ conditions. This is due to the high levels of particulate matter in the air,\
    \ which can lead to respiratory diseases like asthma and **chronic obstructive\
    \ pulmonary disease (COPD)**. Countries with stringent air quality regulations,\
    \ such as those in Western Europe, tend to have lower DALYs from pollution-related\
    \ conditions.\n\n# 17.1.2 Example of GBD Cross-Country Comparisons\n\nThe Global\
    \ Burden of Disease GBD study by the **Institute for Health Metrics and Evaluation**\
    \ (IHME) provides comprehensive data on various health metrics covering a vast\
    \ array of diseases, injuries, and risk factors across 204 countries. To access\
    \ the GBD data (<www.healthdata.org>), we can use the Sustainable Development\
    \ Goals (SDG) API"
