    **Figure 9.11** YLDs for Tuberculosis by Location and Year


    The disability weight for tuberculosis in 2019 is set at 0.333 for the Global
    region. The duration, derived from the GBD 2021 and based on a systematic review,
    was adjusted for treated and untreated cases: it was estimated to be 3 years for
    untreated cases and 6 months for treated cases.


    The formula *YLDs Prevalence + year + (1|location)* specifies a linear mixed-effects
    model for predicting Years Lived with Disability (YLDs) due to tuberculosis. The
    model includes fixed effects for prevalence and year, as well as a random intercept
    for location ((1|location)). This allows the estimation of YLDs while accounting
    for variability across locations.


    ```

    # Define the formula

    formula <- YLDs - Prevalence + year + (1 | location)


    # Fit the mixed-effects model

    model <- lmer(formula, data = tuberculosis)

