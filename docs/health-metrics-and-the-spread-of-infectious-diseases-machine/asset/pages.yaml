    \ The probability mass function of the Poisson distribution is given:\n\n> P(X\
    \ = k) = \\frac{\\lambda^k e^{-\\lambda}}{k!}\n\nwhere X is the random variable\
    \ representing the number of events, k is the number of events, and λ is the rate\
    \ parameter, and e is the base of the natural logarithm.\n\n```\ncases <- rpois(length(dates),\
    \ lambda = 0.2)\nrecovered <- rpois(length(dates), lambda = 0.05)\n```\n\nThe\
    \ simulated data are then combined into a data frame with the date, number of\
    \ cases, and number of recovered.\n\n```\ncovid_data <- data.frame(\n  Date =\
