    # 4.5 Disability Weights and Severity Levels


    The disability weights measure the severity of the health loss associated with
    specific health outcomes or diseases, ranging from 0 (no disability) to 1 (equivalent
    to death). These weights are used to calculate the number of years lived with
    a disability (YLDs) in the calculation of DALYs, and play a pivotal role between
    mortality and morbidity when estimating the Health Adjusted Life Expectancy (HALE).


    The disability weights are crucial for understanding the impact of diseases and
    injuries on the health status of a population, if the disability weight of a specific
    disease is overestimated,'
