  md: "# Practical Insights and Examples\n\n# 6 0.683 0.317 N N\n\n# 11.1.3.2 Accuracy\n\
    \nThe accuracy of the model is calculated as the proportion of correct predictions.\
    \ The accuracy() function from the yardstick package calculates the accuracy of\
    \ the model based on the predicted and observed values.\n\n```\nrf_preds %>%%\n\
    \  accuracy(truth = Stroke, .pred_class)\n  # A table: 1 x 3\n  # .metric .estimate\
    \ .estimate\n  # <chr> <chr> <dbl>\n  # 1 accuracy binary\n  0.703\n```\n\nIn\
    \ this case, the accuracy of the model is 0.70, which means that the model correctly\
    \ predicts whether a patient experienced a stroke or not 70% of the time. The\
    \ accuracy is calculated as the number of correct predictions divided by the total\
    \ of predictions.\n\n# 11.1.3.3 ROC Curve\n\nThe Receiver Operating Characteristic\
    \ (ROC) curve is a graphical representation of the performance of a binary classifier\
    \ system as its discrimination threshold is varied. The ROC curve plots the true\
    \ positive rate (TPR) against the false positive rate (FPR) across various thresholds.\n\
    \nWe can use the roc_curve() function from the yardstick package to calculate\
    \ the ROC curve and the area under the curve (AUC). The roc_curve object contains\
    \ the specificity and sensitivity values for each threshold, which can be used\
    \ to calculate the AUC.\n\n```\nroc_curve <- yardstick::roc_curve(data = rf_preds,\n\
    \                              truth = Stroke, .pred_N)\nroc_curve %>%% head()\n\
    \  # A table: 6 x 3\n  # .threshold specificity sensitivity\n  # <dbl> <dbl> <dbl>\n\
    # 1 -Inf 0 1\n# 2 0.0863 0 1\n# 3 0.226 0.0526 1\n# 4 0.284 0.105 1\n# 5 0.309\
    \ 0.158 1\n# 6 0.319 0.211 1\n```\n\nThe relationship between the True Positive\
    \ Rate (TPR) and False Positive Rate (FPR) is visualised in the ROC curve. The\
    \ area under the curve (AUC) is a measure of the model's performance, with values\
    \ closer to 1 indicating better performance. The specificity and sensitivity of\
    \ model indicate the proportion of true positives and true negatives, respectively,\
    \ and we can use the autoplot() function to visualise the ROC curve.\n\n```\n\
    autoplot(roc_curve)\n```"
