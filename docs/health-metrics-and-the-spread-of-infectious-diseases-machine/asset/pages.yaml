  md: '# The History of Health Metrics


    in collaboration with the World Health organization (WHO). This effort resulted
    in the

    development of the Disability-Adjusted Life Years (DALYs),^16 a metric that combines
    years

    of life lost due to premature death (YLLs) and years lived with disabilities (YLDs).


    ![](img/6b61f0d3dcab44c60cdfe4e888d549c9_29_0.png)


    **Figure 2.2** YLLs and YLDs components of DALYS


    DALYs are connected with QALYs in that metrics seek to quantify the impact of
    health

    quality and length of life. However, while QALYs focus on the benefits with and
    without

    medical intervention, DALYS measure the overall burden of diseases.


    The D metric is calculated by summing the **years of life lost (YLLs)** due to
    premature

    death and the **years lived with disabilities (YLDs)**. This metric provides a
    comprehensive

    measure of a population''s health status by highlighting both mortality and disability.
    For

    example, consider a population with a life expectancy of 80 years. Individuals
    who die before

    reaching this age contribute to the YLLs, while those living with disabilities
    add to the

    YLDs. The sum of these values gives the total DALYs for the population, which
    can then

    be compared globally to assess health status and identify areas needing improvement
    in

    facilities, research, and investment.


    # 2.1.3 Health-Adjusted Life Years (HALY)


    Adjusted Life Years (HALY) is a metric that combines both of DALYs and

    QALYs to provide a comprehensive measure of health outcomes in a population. HALYs

    quantify the burden of disease and the overall quality of life experienced by
    individuals,

    measuring the number of years of healthy life lived by a population accounting
    for both

    mortality and morbidity. as as the impact of these conditions on individuals''
    quality of life is incorporated in the

    calculation of HALYs.


    HALYs adjust expectancy levels based on the prevalence of health conditions and

    the associated disability. Weights reflect the severity of different health

    conditions and their impact on daily functioning. By applying these weights to
    the prevalence

    of each condition, researchers can estimate the overall burden of disease in terms
    of years

    healthy life lost, similar to the calculation of DALYs. Unlike DALYs, which focus
    primarily

    morbidity and mortality, HALYs incorporate measures of individuals'' quality of
    life,

    alallowing for a more comprehensive assessment of health outcomes.


    > ^16--Disability-Adjusted Life Year,” December 8, 2023, https://en.wikipedia.org/w/index.php?title=Disability-adjusted_life_year&colid=188922029.'
