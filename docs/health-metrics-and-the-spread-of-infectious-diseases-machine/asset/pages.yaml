- pgno: 96
  md: "# Deaths due to Cholera in London (1849)\n\n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_96_0.png)\n\
    \n**Figure 6.5** Deaths due to Cholera in London (1849)-GAM\n\nwhere: $g(\\cdot)$\
    \ is a link function, $\\mu$ is the expected value of the response variable, $\b\
    eta_0$ is the intercept term, $f(\\cdot)$ represents the smooth functions of the\
    \ predictor variable. In case of more than one predictor: $g(\\mu) = \beta_0 +\
    \ f_1(x_{i1} + f_2(x_{i2} + f_3(x_{i3} + \\dots)$ there will be $p=1, \\dots,\
    \ j$ number of $f(\\cdot)$ smooth functions as many as the number of predictors.\n\
    \nWhat is happening here is a transformation of the predictors through the application\
    \ of a function: $x \\sim f(x)$. The smooth functions are estimated using non-parametric\
    \ techniques such as splines (polynomial transformations) or kernel functions.\
    \ These smooth functions allow for flexible modelling of the relationship between\
    \ the predictor variables and the response variable, capturing non-linearities\
    \ and complex patterns in the data. The link function $g(\\cdot)$ is typically\
    \ chosen based on the distributional characteristics of the response variable,\
    \ to represent the data mean.\n\n```\n# Load the mgcv package\nlibrary(mgcv)\n\
    \n# use the days instead of the full date\ncholeradays <- row_number(cholera)\n\
    \n# Fit a GAM using the gam() function\ngam_model <- gam(deaths ~ s(days), data\
    \ = cholera)\n\n# Print the summary of the GAM model\nsummary(gam_model)\n>\n\
    # Family: gaussian\n```"
