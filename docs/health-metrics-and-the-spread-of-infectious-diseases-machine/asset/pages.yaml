- pgno: 232
  md: "# 13\n\n# Advanced Data Visualisation Techniques\n\nLearning Objectives\n\n\
    +   - Learn advanced data visualisation techniques\n- Create contour plots to\
    \ visualise interaction effects\n- Create a pyramid plot to envisage population\
    \ distribution\n\nIn this chapter, we will learn how to create advanced data visualisation\
    \ techniques using **ggplot2**. We will create contour plots to visualise interaction\
    \ effects and pyramid plots to envisage population distribution.\n\n# 13.1 Example:\
    \ Detecting Interaction Effects with Contour Plots\n\nInteraction effects can\
    \ cause predictors to act together on the response variable, leading to additional\
    \ variation in the response. Interaction effects occur when the combined effect\
    \ of two or more predictors is different from what would be expected if the impact\
    \ of each predictor were considered alone. For instance, in the case of **cardiovascular\
    \ disease (CVD)** risk prediction, the interaction between age and cholesterol\
    \ levels can have a significant impact on the risk of developing heart disease.\
    \ In addition, if smoke is added to the model, the effect of cholesterol levels\
    \ on CVD may change depending on whether the individual is a smoker or non-smoker.\
    \ So, smoke is said to interact with cholesterol levels in predicting CVD risk,\
    \ as well as age, but in what way?\n\n```\n$y = \\beta_0 + \\beta_1x_1 + \\beta_2x_2\
    \ + \\beta_3x_3 + \\epsilon$\n```\n\nwhere $y$ is the result of developing heart\
    \ disease, $\beta_0$ is the intercept, $\beta_1$ and $\beta_2$ are the coefficients\
    \ for the predictors $x_1$ and $x_2$, respectively, and $\beta_3$ is the coefficient\
    \ for the **interaction term** $x_1 * x_2$. The error term $\\epsilon$ accounts\
    \ for the variability in the response variable that is not explained by the predictors.\n\
    \nThere are four types of interaction:\n\n+   - additive is when $\\beta_3 \\\
    approx 0$\n- antagonistic is when $\\beta_3 < 0$\n- synergistic is when $\\beta_3\
    \ > 0$\n- atypical is when $\\beta_3 \\neq 0$\n\nIn order to simulate the interaction\
    \ effects for each type of interaction, we cannot simulate random values for $y$,\
    \ we need to simulate different levels of interactions between"
