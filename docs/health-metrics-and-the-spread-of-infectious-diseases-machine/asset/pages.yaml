  md: "# Example: All Causes DALYs Rate by Country\n\n```\nlabs(title = \"All Causes\
    \ | DALYs Rate by Country (per 100,000)\",\n      subtitle = \"Values in thousands\"\
    ,\n      caption = \"IHME Data 2021 | Graphic: @fgazzelloni\" + \n  theme_void())\n\
    ```\n\n# All Causes | DALYs Rate by Country (per 100,000)\nValues in thousands\n\
    \n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_299_0.png)\n\n**Figure 17.5** All Causes\
    \ | DALYs Rate by Country (per 100,000)\n\nWe can conclude that the Disability\
    \ Adjusted Life Years (DALYs) varied across countries, with some countries experiencing\
    \ higher DALYs rates compared to others. This variation reflects differences in\
    \ disease burden, health outcomes, and the impact of different health conditions\
    \ on population health. The choropleth map provides a visual representation of\
    \ the burden of disease, highlighting disparities in health outcomes and informing\
    \ public health interventions to improve population health.\n\nIn general, what\
    \ emerges from the GBD 2021 data is that low-income countries, particularly in\
    \ sub-Saharan Africa, often exhibit the highest DALYs per capita. This is primarily\
    \ due to a heavy burden of infectious diseases (e.g., malaria, HIV/AIDS, tuberculosis),\
    \ maternal and neonatal health issues, and malnutrition-related conditions. Countries\
    \ like the Central African Republic, South Sudan, and Lesotho consistently report\
    \ some of the highest DALYs per capita.\n\nOn the other hand, high-income countries,\
    \ particularly in Western Europe, North America, and parts of East Asia (e.g.,\
    \ Japan, Singapore), tend to have the lowest DALYs per capita. These countries\
    \ benefit from well-developed healthcare systems, lower prevalence of infectious\
    \ diseases, and greater control over non-communicable diseases through early detection\
    \ and lifestyle interventions. Countries like Iceland, Switzerland, and Singapore\
    \ consistently report some of the lowest DALYs per capita.\n\nAdditionally, lifestyle-related\
    \ factors like smoking and dietary habits play a significant role in the burden\
    \ of cardiovascular diseases and cancers globally."
