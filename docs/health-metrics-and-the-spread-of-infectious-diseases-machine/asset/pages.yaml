  md: "# Markov Chain\n\nThe code for this replication of the Markov Chain is from\
    \ Dobrow - Bayesian analysis of infectious diseases book (chapter4). It shows\
    \ clearly how to create a Markov chain and calculate the transition probabilities.\n\
    \n```\nset.seed(000)\nmarkov <- function(init, mat, n, labels) {\n  if (missing(labels))\
    \ labels <- 1:length(init)\n  simlist <- numeric(n + 1)\n  states <- 1:length(init)\n\
    \  simlist[1] <- sample(states, 1, prob = init)\n\nfor (i in 2:(n + 1)) {\n  simlist[i]\
    \ <- sample(states, 1, prob = mat[simlist[i - 1],])\n}\n\nlabels[simlist]\n}\n\
    P <- matrix(c(.51, .49, .49, .51), ncol = 2, byrow = TRUE)\ninit <- c(1, 0)\n\n\
    markov(init = init, mat = P, n = 100)\n# Define the number of transitions\nn_transitions\
    \ <- 10000\n\n# Simulate Markov chain\nsimulated_chain <- markov(init, P, n_transitions)\n\
    \n# Calculate the transition probabilities\ntransition_counts <- table(\nsimulated_chain[-n_transitions\
    \ + 1])\n)\ntransition_probabilities <- transition_counts / rowSums(transition_counts)\n\
    #\n#      1        2\n# 1 0.5140224 0.48519776\n# 2 0.4844249 0.5155751\n\n# Calculate\
    \ prior probabilities\nprior_probabilities <- table(\nsimulated_chain[-n_transitions])\
    \ / n_transitions\nnprior_probabilities\n#\n#      1        2\n#> 0.4992 0.5008\n\
    \n# Calculate posterior probabilities\nposterior_probabilities <- transition_probabilities\
    \ **% prior_probabilities\n```"
