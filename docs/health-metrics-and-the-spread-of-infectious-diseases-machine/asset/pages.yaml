  md: "# Convolutional Neural Networks (CNN)\n\n+   * Formula:\n$$(f*g)(t) = \\int_{-\\\
    infty}^{\\infty} f(\tau)g(t-\tau)$$\n\n+   * Description: Uses convolutional layers\
    \ to apply filters to the input, which helps in capturing spatial hierarchies\
    \ in data, particularly useful for image and video processing.\n\n# Recurrent\
    \ Neural Networks (RNN)\n\n+   * Formula:\n$$h_t = \\sigma(W_h h_{t-1} + W_x x_t\
    \ + b)$$\n\n+   * Description: Designed to recognize patterns in sequences of\
    \ data by maintaining a hidden state $h_t$ that captures information from previous\
    \ time steps.\n\n# Gradient Boosting Machines (GBM)\n\n+   * Formula:\n$$F_m(x)\
    \ = F_{m-1}(x) + \\eta \\cdot h_m(x)$$\n\n+   * Description: Builds an additive\
    \ model in a forward stage-wise manner. Each base learner $h_m$ is trained to\
    \ reduce the residual error of the ensemble's previous predictions.\n\n# Long\
    \ Short-Term Memory Networks (LSTM)\n\n+   * Formula:\n$$f_t = \\sigma(W_f \\\
    cdot [h_{t-1}, x_t] + b_f)$$\n$$i_t = \\sigma(W_i \\cdot [h_{t-1}, x_t] + b_i)$$\n\
    $$\tilde{C}_t = \tanh(W_C \\cdot [h_{t-1}, x_t] + b_C)$$\n$$C_t = f_t * C_{t-1}\
    \ + i_t * \tilde{C}_t$$\n$$o_t = \\sigma(W_o \\cdot [h_{t-1}, x_t] + b_o)$$\n\
    $$h_t = o_t * \tanh(C_t)$\n\n+   * Description: A type of RNN that can learn long-term\
    \ dependencies by using gates to control the flow of information."
