    # 4.3 Mortality Level and Rates


    Another fundamental component of health metrics is the mortality level which indicates
    the number of deaths in a population. They are cause-specific, they are calculated
    for different diseases or injuries. If the number of deaths is population-wide,
    they are calculated for the entire population.


    This component represents the count of deaths at each age or for specific diseases
    within a given time. Data for this component is collected from vital registration
    systems, health surveys, hospital records, and epidemiological studies.


    Here is a table containing the mortality rates for different age groups in two
    regions. The mortality rates are expressed as the number of deaths per 1,000 population
    in each age group. Data are used to illustrate the variation in mortality rates
    across age groups and regions, providing insights into the health risks faced
    by different populations.


    # Table 4.3 Example Mortality Rates by Age Group and Region


    | Age Group | Region A Mortality Rate (per 1,000) | Region B Mortality Rate (per
    1,000) |

    |---|---|--|

    | 0-1 | 40.5 | 30.0 |

    | 1-5 | 5.2 | 4.0 |

    | 5-10 | 1.8 | 1.5 |

    | 10-15 | 0.9 | 1.0 |

    | 15-20 | 1.2 | 1.3 |

    | 20-30 | 1.5 | 1.8 |

    | 30-40 | 2.0 | 2.2 |


    # 4.3.1 Understanding Death Counts and Mortality Rates


    While mortality rates themselves are not directly used in the formula for the
    calculation of YLLs, they are crucial for understanding the broader context of
    health risks and for estimating the death counts in populations where direct data
    on deaths might be incomplete or unreliable. In regions or populations where vital
    registration data are incomplete, mortality rates derived from sample surveys
    or demographic models can be used to estimate the expected number of deaths.


    > ²Answer: e(50) = T(50)/l(50) = 2,370,099/89,867 = 26.4 (see “Life Expectancy
    for CP, VS, TBI and SCI, n.d., https://www.lifexpectancy.org/lifetable.html).'
