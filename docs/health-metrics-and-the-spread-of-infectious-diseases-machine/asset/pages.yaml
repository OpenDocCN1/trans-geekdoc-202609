- pgno: 34
  md: '# Methods and Calculations


    Learning Objectives


    +   - Explore key health metrics and their significance in public health analysis

    - Learn how to apply and interpret these metrics using real-world data

    - Identify opportunities to improve health metrics and their use in decision-making


    The objective of this chapter is to provide a first level calculation of the burden
    of diseases, focusing on disability and premature mortality, which are captured
    by DALYs and HALE. In Chapter 2, we define the metrics to establish the theoretical
    framework for constructing them. In this chapter, we will proceed with a general
    calculation of YLLs and YLDs to obtain the DALYs. This step is essential for understanding
    the structure of the metric components, which will be further investigated in
    Chapter 4.


    Used to measure the burden of disease and quantify the impact of diseases and
    injuries on individuals and populations, these metrics can help prioritize public
    health interventions and evaluate the effectiveness of public health programs.


    # 3.1 YLLs Calculation


    The Years of Life (YLLs) is a metric that measures the number of years a person
    would have lived if they had not died prematurely due to a disease or injury.
    YLLs are calculated by subtracting the age of death from the expected age in a
    population without the disease or injury.


    In the late 1940s (Chapter 2), William Haenszel introduced the concept of Standardized
    Rate for Mortality in units of Lost Years of Life, marking an early attempt to
    quantify the impact of premature mortality. This approach emphasized the importance
    of considering the age at death and comparing it to the expected life expectancy,
    highlighting that early deaths have a greater impact than those occurring later
    in life. It was ascertained that accounting for the number of years lost for a
    group of people would help recognize the potential life lost for a certain cause.
    Since this first approach, some adjustments to the standard rates were made, leading
    to a new calculation that considered standardised death rates applied to age-specific
    factors for causes of death.


    > William Haenszel,"A Standardized Rate for Mortality Defined in Units of Lost
    Years of Life," Journal of Public Health and the Nations'' 40, no. 1 (January
    1950): 17-26, https://www.ncbi.nlm.nih.gov/pmc/articles/PMC1528498/


    DOI: 10.1201/97810302625935-3'
