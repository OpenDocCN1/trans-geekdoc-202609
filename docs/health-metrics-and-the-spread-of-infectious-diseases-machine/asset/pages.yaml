  md: 'Example: SDI Time Series Analysis


    ```

    #> sigma^2 estimated as 8.634e-07: log likelihood=162.46

    #> AIC=-317.92 AIC=-317.96 BIC=-314.82

    ```


    The model suggests that the differed series provide a stable upward trend, with
    moderate autocorrelation and low residual variance, implying a strong and reliable
    forecast model for the observed data.


    In particular, selected ARIMA(1,1,0) indicates:


    +   - One autoregressive (AR) term (ar=0.5971): There is persistence; the difference
    at time t is positively correlated with the previous time point

    - First-order differing (d=1) was applied to achieve stationarity

    - No moving average (MA) term (q=0)

    - The model includes a drift term (constant=0.0013), which accounts for a consistent
    upward trend in the differed series.

    - Standard errors (s.e.) for both coefficients are small, suggesting estimates
    are fairly precise.

    - sigma^2=8.634e-07: Very low variance of the residuals, indicating a good fit.

    - Log-likelihood=162.46: Used for model comparison.

    - AIC=-318.92, AIC=-317.96, BIC=-314.82: All values are low, which generally indicate
    a better-fitting model when compared to alternatives.


    # 9.4.5 ARIMA Forecast


    The forecast() function from the {forecast} package is used to generate forecasts
    based on the fitted ARIMA model. The h parameter specifies the forecast horizon,
    which is the number of future time points to predict. In this case we used h=10
    for the next 10 years.


    ```

    forecast(h = 10) |

    ggplot(aes(x = year, y = .mean)) +

    geom_line(data = sdi_fr_ts,

    aes(y = value)) +

    geom_line(color = "purple", linetype = "dashed")+

    labs(title = "Forecast of SDI in France")

    ```


    # 9.4.6 Ensemble Models


    In series analysis, an individual model trained on historical data to generate
    forecasts is known as a single learner. However, a single learner may not be sufficient
    to capture the full complexity of the data, especially when dealing with intricate
    patterns, nonlinear relationships, or multiple influencing factors, leading to
    poor generalised on unseen data.


    Single approaches often fail to account for crucial factors like external shocks,
    structural changes, or nonlinear relationships, making them insufficient for capturing
    all aspects of the data, including trend and seasonality.


    This is where ensemble learning comes into play.


    By aggregating the predictions from multiple learners, we can form a model ensemble,
    to improve predictive performance and generate more robust forecasts.


    Ensemble learning is a machine learning technique that leverages the diversity
    of individual models to make more accurate predictions and reduce overfitting.
    Ensemble methods can'
