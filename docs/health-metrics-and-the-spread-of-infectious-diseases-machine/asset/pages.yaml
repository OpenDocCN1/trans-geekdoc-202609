- pgno: 32
  md: '# 2.1.6 Well-being-Adjusted Health Expectancy (WAHE)


    Currently, Well-being-Adjusted Health Expectancy (WAHE) is still an emerging metric
    in health research that combines traditional health indicators with well-being
    factors to provide a more comprehensive assessment of population health. WAHE
    is calculated by estimating the number of years equivalent to full health, taking
    into account both physical and psychological well-being.


    WAHE aims to capture the overall health and well-being of individuals by incorporating
    measures of physical health, mental health, and social well-being. This metric
    goes-beyond traditional health metrics like life expectancy and disability-adjusted
    life years to provide a more holistic view of health outcomes by considering factors
    like happiness, life satisfaction, and social connectedness.


    Particularly relevant in the context of global health, WAHE provides a more holistic
    view of population health that can inform public policies, healthcare interventions,
    and resource allocation decisions[22][23][24].


    # 2.2 How the Metrics are Used in Global Health


    These metrics are used alone or in combination with other health metrics in global
    health assessments conducted by organisations as the World Health Organisation
    (WHO), the European Commission, and the Institute for Health Metrics and Evaluation
    (IHME). They provide a global perspective and insights into the health status
    of populations, helping to track progresses towards long-term health objectives
    over time. The metrics also inform public health policies, healthcare interventions,
    and resource allocation decisions, helping to prioritise and target interventions
    effectively.


    The investigation into updating metrics is a sustained commitment, aiming to develop
    new measures tailored to the evolving landscape of the health field. Recently,
    the new Summary Measure of Population Health (SMPH) promotes the Well-being-Adjusted
    Health Expectancy (WAHE) measure as an estimate of the number of years equivalent
    to full health. This approach reflects a growing recognition that health metrics
    should account for physical and clinical indicators and consider psychological
    and overall well-being.


    # 2.3 Summary


    Health metrics play a crucial role in understanding and improving population health.
    From John Grant''s early work in the 17th century to today''s sophisticated metrics
    like DALYs,


