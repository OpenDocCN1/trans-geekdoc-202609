    # 7.4.6 Model 2: Generalised Linear Model (GLM)


    Generalised Linear Models (GLMs) involve statistical estimation rather than the
    iterative parameter tuning, common in many machine learning techniques. However,
    adding a machine learning feature through parameter calibration can be done using
    techniques such as cross-validation and grid search to find the best model settings.'
