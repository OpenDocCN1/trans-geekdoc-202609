  md: '![](img/6b61f0d3dcab44c60cdfe4e888d549c9_74_0.png)


    **Figure 5.1** FlowChart of Historical vs. Modern Risks: this flowchart illustrates
    how risk perception has evolved over time, shifting from historical to modern
    risks. It integrates key risk factors identified in the Global Burden of Disease
    (GBD) study.


    +   - **Environmental factors**: Exposure to pollutants, such as air pollution
    and toxic chemicals, can increase the risk of certain diseases and injuries.

    - **Infections**: Many diseases, such as tuberculosis, HIV/AIDS, and malaria,
    are caused by infectious agents.

    - **Poverty**: People living in poverty are often more susceptible to health problems
    due to limited access to healthcare, healthy food, and safe living conditions.

    - **Ageing**: As people get older, they are at an increased risk of many health
    problems, including chronic diseases and disabilities.

    - **Genetics**: Some diseases and injuries are caused by genetic factors, such
    as a genetic predisposition to certain cancers.

    - **Injuries**: Injuries, such as falls, road traffic accidents, and violence,
    can also contribute to the burden of diseases and injuries.


    ![](img/6b61f0d3dcab44c60cdfe4e888d549c9_74_1.png)


    **Figure 5.2** Causal relationships leading to fueling DALYs value. Weights (W),
