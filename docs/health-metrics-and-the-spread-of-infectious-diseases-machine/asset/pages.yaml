    # 3.3 DALYs Calculation


    As a measure of the overall disease burden, Disability Adjusted Life Years (DALYs)
    are used to quantify the sum of potential life lost due to premature death (YLLs)
    and years lived with disability (YLDs). The number of DALYs indicates the number
    of years of life lost due to premature deaths, disability, or injury. This metric
    takes into account both the quantity and quality of life.


    DALYs are a generalisation of the well-known Potential Years of Life Lost measure
    (PYLLs), which includes the loss of good health. We do not consider PYLLs in this
    book, but more information can be found in the references.10


    Standard Formula


    ```

    $DALYs = YLLs + YLDs$

    ```


    One DALY is one year of healthy life. This measure is used to assess how diseases
    and injuries impact populations, providing a comprehensive picture of the overall
    burden of disease by combining YLLs and YLDs in different groups.


    > 10-Global Health Estimates,” n.d., https://www.who.int/data/global-health-estimates.'
