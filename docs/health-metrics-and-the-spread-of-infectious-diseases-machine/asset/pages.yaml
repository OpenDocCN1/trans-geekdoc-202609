    # 3.4 How DALYs are Used


    DALYs, YLLs, and YLDs can be used in several ways to help identify health priorities,
    evaluate the impact of diseases and injuries, and inform public health decision-making.
    Some common uses of these metrics include:


    +   - Prioritising public health interventions: By calculating the overall burden
    of disease in a population, public health practitioners can prioritise which diseases
    and injuries to address first. This helps allocate resources and target interventions
    to the areas of greatest need.


    +   - Evaluating the impact of diseases and injuries: These metrics can be used
    to measure the impact of diseases and injuries on individuals and populations
    to track changes over time. This information can help inform public health decision-making
    and allocate resources more effectively.


    +   - Comparing the burden of disease across populations: DALY, YLL, and YLD can
    be used to compare the burden of disease across populations and between different
    regions. This information can help identify disparities in health outcomes and
    inform targeted public health interventions.


    +   - Evaluating the effectiveness of public health programs: These metrics can
    be used to evaluate the effectiveness of public health programs and assess the
    effectiveness of public health interventions. This information can help public
    practitioners identify areas for improvement and make necessary changes to ensure
    that programs are achieving their goals.


    +   - Monitoring global health trends: DALY, YLL, and YLD can also be used to
    monitor global health trends and track changes in the burden of disease over time.
    This information can be used to inform global health policies and allocate resources
    to address emerging health threats.


    To mention the case of Rwanda, the GBD 2021 results released by the IHME showed
    that the country has made significant progress in reducing the burden of disease
    over the past decade.¹ By using DALYs, YLLs, and YLDs, public health leaders were
    able to


    > ¹Ferrari et al., “Global Incidence, Prevalence, Years Lived with Disability
    (YLDs), Disability-Adjusted Life-Years (DALYs), and Healthy Life Expectancy (HALE)
    for 371 Diseases and Injuries in 204 Countries'
