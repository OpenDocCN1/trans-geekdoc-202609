    library(tidyverse)\nlibrary(sf)\nlibrary(rnaturalearth)\n\ntidyverse_conflicts()\n\
    ```\n\nTo download malaria data we can use the getPR() function, it releases the\
    \ data from the Malaria Atlas Project API. The function requires the country and\
    \ species of Plasmodium to be specified. In this example, we will download data\
    \ for Nigeria and the Plasmodium falciparum species.\n\n```\nnigeria_data <- getPR(country\
    \ = \"Nigeria\",\n                          species = \"Pf\")\n```\n\n```\n# [1]\
    \ NA NA\n# [1] i 27 2\n```\n\nData contains cases for 23 years spanning from 1985\
    \ to 2018. We can extract the relevant information (year_start (of the survey),\
