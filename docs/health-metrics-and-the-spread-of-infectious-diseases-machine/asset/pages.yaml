    # 9.3 Time Series Analysis


    One important side of the analysis is to consider the evolution of the phenomenon
    in time. We can do this by using time as a factor in the model. Time series analysis
    serves as a tool for understanding and forecasting temporal patterns. Techniques
    such as AutoRegressive'
