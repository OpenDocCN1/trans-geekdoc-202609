    # 3.4.1 General Application of DALYs


    As an example here is shown how the DALY metric can be used for prevention. Suppose
    we have data on the number of cases of a particular disease, as well as the average
    number of life lost due to disease. We can use this information to calculate the
    total number of DALYs lost due to this disease.


    ```

    # Data frame with the number of cases and average years of life lost

    df <- data.frame(YLL = c(5, 10, 15), YLD = c(1, 3, 4))


    # Calculate the number of DALYs lost

    df <- df %>% mutate(DALY = YLL + YLD)


    # Sum the number of DALYs lost

    total_dalys <- sum(df$DALY)

    #[1] 38

    ```


    In this example, the number of cases of the disease and the average years of life
    lost for each case are used to calculate the number of DALYs lost for each case.
    Finally, the total number of DALYs lost for the entire population.


    This information can be used to inform public health interventions to prevent
    the spread of this disease and reduce the number of DALYs lost. For example, the
    information could be used to prioritise resources for disease control and prevention
    activities, as as health education campaigns, vaccination programs, and screening
    and treatment programs.


