  md: '230 Introduction to Infectious Diseases


    Another significant aspect to consider is the emerging use of transfer learning,
    which involves applying knowledge gained from one predictive task to another.
    This approach is especially useful when data are limited and models need to be
    adapted. Although relatively under-explored in infectious disease research, transfer
    learning shows promise for improving predictions in areas with scarce data. By
    leveraging information from related tasks, this technique can enhance model performance,
    leading to more accurate and reliable predictions in public health scenarios.⁵


    # 14.5 The Impact on DALYs


    To understand the magnitude of infectious diseases impacts on DALYs, we can simply
    consider the DALYs rate of change. The percentage change in total DALYs and DALYs
    due to infectious diseases, in general or for a specific infectious virus such
    as COVID19, allows us to assess the overall burden of disease. In the case of
    COVID19 for example, the percentage change in DALYs due to COVID19 can explain
    how this virus affected global health and produced excess mortality and morbidity.


    $$\frac{DALYs\ due\ to\ Infectious}{Total\ DALYs} \times 100 \quad (14.7)$


    Where the $DALYs = \sum_{i=1}^{n}(YLD_i + YLL_i)$, $YLD$ and $YLL$ are the years
    lived with disability and the years of life lost respectively.


    This percentage change provides a measure of the impact of infectious diseases
    on the overall burden of disease. The DALYs due to infectious diseases can be
    calculated as the sum of the DALYs for each disease, and the total DALYs for all
    diseases calculated similarly. The percentage change in DALYs due to infectious
    diseases can then be calculated as the ratio of the DALYs due to infectious diseases
    to the total DALYs, multiplied by 100.


    Furthermore, use of machine learning models used to predict the variation of number
    of DALYs due to infectious diseases over time can be a valuable tool to understand
    the impact of infectious diseases on global health. Two approaches can be:


    +   1. DALY as a function of the socio-demographic index (SDI): A composite index
    of the average income per person, educational attainment, and total fertility
    rate. The model function can be expressed as:


    ```

    $DALY_{id} = f(SDI) + \epsilon \quad (14.8)$

    ```


    where is the number of DALYs is the response variable, SDI the sociodemographic
    index acting as predictor, $f(.)$ is the function that relates the number of DALYs
    to the socio-demographic index, and $\epsilon$ is the error term.


    +   2. DALYs as a function of the human development index (HDI): A composite index
    of life expectancy, education, and per capita income. The model function can be
    expressed as:


    ```

    $DALY_{id} = f(HDI) + \epsilon \quad (14.9)$

    ```


    > ⁵Roster, Connaughton, and Rodrigues, “Forecasting New Diseases in Low-Data Settings
    Using Transfer Learning”.'
