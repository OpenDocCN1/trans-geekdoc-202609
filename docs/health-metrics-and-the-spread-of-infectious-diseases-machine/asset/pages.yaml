  md: "![](img/6b61f0d3dcab44c60cdfe4e888d549c9_265_0.png)\n\n# 15.4 COVID-19 and\
    \ DALYs\n\nThe influence of COVID-19 on global health can be measured using the\
    \ DALYs. We use the data from the JHU GitHub repository CSSEGISAndData to calculate\
    \ the DALYs for COVID-19. The data includes the number of confirmed cases, deaths,\
    \ and recovered cases for each country and region. We will calculate the DALYs\
    \ for the US, China, United Kingdom, and Canada.\n\nData are loaded from the repository\
    \ with the read.csv() function, and need a bit of adjustment before can be used.\n\
    \nHere we use the pivot_longer() to combine all cases by day in one column, and\
    \ see the first rows:\n```r\ncase1 <- cases %>%n  pivot_longer(cols = starts_with(\"\
    X\"),n               names_to = \"date\",n               values_to = \"cases\"\
    ) %>%n  mutate(date = gub(\"X\", \"\", date),\n         date = as.Date(date, format\
    \ = \"%%m.%d.%y\")) %>%\n  janitor::clean_names()\n```\n\n> 8https://github.com/CSSEGISAndData/COVID-19"
