  md: '# 1


    # Introduction


    # 1.1 The Concept of Health


    The concept of being “well” has evolved over the years and is not solely confined
    to physical health. Traditionally, health metrics focused on factors like life
    expectancy, mortality rates, and the prevalence of diseases. However, the understanding
    of well-being has expanded to include broader dimensions, incorporating mental
    health, social factors, and overall life satisfaction.


    In recent years, there has been an increased emphasis on holistic well-being,
    recognizing that health is not merely the absence of disease but a state of complete
    physical, mental, and social well-being. This perspective aligns with the 1946
    World Health Organization''s constitution principles²: “a state of complete physical,
    mental, and social well-being and not merely the absence of disease or infirmity.”


    # 1.1.1 The Culture


    The cultural context significantly influences the values, norms, and expectations
    within a society, and, in turn, contribute to people’s understanding of what constitutes
    a good life. Education, media, legal systems, and community play all pivotal roles
    in shaping individuals’ perceptions of well-being. Cultural norms and values often
    define what is considered acceptable or taboo, influencing individuals’ behaviours
    and aspirations. Understanding these cultural nuances is crucial when developing
    health metrics and policies that aim to capture and improve well-being. This emphasizes
    the need for a holistic approach that considers not only physical health but also
    the social, cultural, and psychological dimensions of individuals and communities.


    Achieving a global mean or standard for well-being involves considering not just
    the diversity of cultures but also acknowledging the common elements that contribute
    to human happiness and health. Education, more specifically the process of teaching
    individuals to modify their behaviours in order to improve their overall well-being,
    plays a pivotal role in this process. Promoting positive behaviours that are conducive
    to both individual and societal well-being can be a universal goal. Understanding
    what constitutes “good behavior” in the context of health and happiness is, indeed,
    central to standardising well-being metrics.


    > ¹Constitution of the World Health Organization,” n.d., https://www.who.int/about/accountability/governance.


