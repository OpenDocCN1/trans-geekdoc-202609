  md: '# Example: Rabies


    the data, we can apply:


    +   - Log Transformation: $log(DALY s + 1)$

    - Sqrt Transformation: $\sqrt{DALY s}$

    - Yeo-Johnson Transformation, a generalisation of the Box-Cox transformation that
    can handle both positive and negative values: $((DALY s + 1)^p - 1)/p$.


    Let''s apply the **Yeo-Johnson transformations** to the response variable (`dalys-rabies`)
    and see how the distribution changes with different values of $\lambda$. This
    is a step that can be tuned with a machine learning algorithm.


