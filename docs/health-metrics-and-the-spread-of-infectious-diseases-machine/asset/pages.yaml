    # 5.2.4 Theoretical Minimum-Risk Exposure Levels (TMRELs)


    Risk factors associated with a particular health condition are considered based
    on the Theoretical minimum risk exposure levels (TMRELs) and as a function of
    the exposure or relative risk (RR). Not all the variables that are thought to
    be risk factors increasing causes for a particular health condition are always
    the driving cause of the condition, for this reason a minimum level of risk exposure
    is established for the risk to be considered effective in the outcome.


    Moreover, disease attributable to a particular risk factor or combination of risk
    factors needs to be ascertained by investigating the risk-outcome relationship.
    Risk factors can also act indirectly on the outcome via intermediate risks, such
    as the association of low fruit consumption and heart disease induced by systolic
    blood pressure which acts as mediator between the two.


    ![](img/6b61f0d3dcab44c60cdfe4e888d549c9_81_1.png)


    Figure 5.7 DAG: Risk-Outcome leading to heart disease. The relationship between
    low fruit consumption, systolic blood pressure, and heart disease.


    Examples of risk factors with established Theoretical Minimum Risk Exposure Levels
    (TMRELs) include particulate air pollution, high systolic blood pressure, and
    smoking. For systolic blood pressure, the TMREL is typically set around 110/70
    mmHg. Research has shown that maintaining blood pressure near this level is associated
    with the lowest risk for cardiovascular disease and stroke. Similarly, for particulate
    air pollution, the TMREL is at the lowest level of exposure that is feasible and
    achievable, typically based on World Health Organization (WHO) guidelines. For
    smoking, the TMREL is set at zero, as any level of smoking is associated with
    increased health risks.


    In terms of Disability-Adjusted Life Years (DALYs), the overall level is significantly
    influenced by behavioural, environmental, and occupational risks. Behavioural
    risks, such as smoking and physical inactivity, and environmental exposures, like
    air pollution, contribute heavily to DALYs by increasing mortality and disability
    rates within affected populations. Occupational risks further add to the burden,
    particularly in regions where workplace safety standards are lower, underscoring
    the need for targeted interventions across different population groups.'
