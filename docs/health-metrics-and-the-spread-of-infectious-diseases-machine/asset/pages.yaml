    \ Germany\n\n(c) Barplot: Lung Cancer Deaths by Age in Germany\n\nFigure 10.2\
    \ Scatterplot and Barplot of Lung Cancer Deaths by Age in Germany\n\nAll of these\
    \ plots have a grammar of graphic structure, which means that they are built using\
    \ layers of data, aesthetics, and geometric objects. The `ggplot()` initializes\
    \ the plot, and then we add layers using `geom_point()`, `geom_line()`, and `geom_col_pattern()`\
