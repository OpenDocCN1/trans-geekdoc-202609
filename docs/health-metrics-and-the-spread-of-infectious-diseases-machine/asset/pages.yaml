  md: "# Formulary\n\n# Statistical Distributions\n\n# Normal (Gaussian) Distribution\n\
    \n+   - Formula:\n\n```\n$f(x) = \\frac{1}{\\sqrt{2\\pi\\sigma^2}} e^{-\\frac{(x-\\\
    mu)^2}{2\\sigma^2}}$\n```\n\n**Description:** The normal distribution is a continuous\
    \ probability distribution characterized by a bell-shaped curve. It is defined\
    \ by the mean ($\\mu$) and standard deviation ($\\sigma$).\n\n# Binomial Distribution\n\
    \n+   - Formula:\n\n```\n$P(X=k) = \binom{n}{k} p^k (1-p)^{n-k}$\n```\n\n**Description:**\
    \ The binomial distribution represents the number of successes in a fixed number\
    \ of independent Bernoulli trials, with a constant probability of success $p$\
    \ in each trial. Here, $n$ is the number of trials and $k$ is the number of successes.\n\
    \n# Poisson Distribution\n\n+   - Formula:\n\n```\n$P(X=k) = \\frac{\\lambda^k\
    \ e^{-\\lambda}}{k!$\n```\n\n**Description:** The Poisson distribution represents\
    \ the probability of a given number of events occurring in a fixed interval of\
    \ time or space, given the average number of times the event occurs over that\
    \ interval. Here, $\\lambda$ is the average number of events, $k$ is the number\
    \ of occurrences, and $e$ is Euler’s number.\n\n# Exponential Distribution\n\n\
    +   - Formula:\n\n```\n$f(x) = \\lambda e^{-\\lambda x} \\text{ for } x \\geq\
    \ 0$\n```\n\n+   - Description: The exponential distribution represents the time\
    \ between events in a Poisson process. It is defined by the rate parameter $\\\
    lambda$."
