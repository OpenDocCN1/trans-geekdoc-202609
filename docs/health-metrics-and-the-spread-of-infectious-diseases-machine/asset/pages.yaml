- pgno: 151
  md: '# 9

    Predictive Modelling and Beyond


    Learning Objectives


    +   - Use model predictions to make informed decisions on new or unseen data

    - Apply time series analysis to forecast the Socio-Demographic Index (SDI)

    - Estimate Years Lived with Disability (YLDs) using mixed-effects models


    In the dynamic landscape of public health, the ability to forecast and predict
    future trends is essential for effective decision-making and the implementation
    of timely interventions. This chapter provides an overview of predictive modelling,
    focusing on the challenges of applying predictions to new data, the use of time
    series analysis, and mixed models to anticipate the trajectory of infectious diseases
    and health metrics. By exploring the underlying patterns and analysing historical
    data, we estimate the disease burden and evaluate the impact of interventions
    on population health. New time series analysis and mixed models can be tailored
    to address specific research questions, such as predicting disease outbreaks,
    estimating disease burden, and assessing the impact of interventions on population
    health.


    # 9.1 Predictions about the Future


    The previous chapters provided an attempt at estimating future outcomes based
    on the application of various types of statistical and machine learning techniques.
    Here we look at how to use these predictions on new data.


    When making predictions on new data, it is important to consider the generalizability
    of the model. A model that performs well on the training data may not necessarily
    generalise to new, unseen data. To evaluate the performance of the model we use
    the cross-validation technique, and there are more such hold-out validation, k-fold
    cross-validation, leave-one-out cross-validation, and bootstrapping. These methods
    help assess the model''s ability to make accurate predictions on data not used
    during training, providing a more reliable estimate of the model''s performance
    in real-world scenarios.


    Once the model has been trained and evaluated, it is used to make predictions
    on new data. This process involves applying the model to the new data to generate
    forecasts or estimates of the outcome of interest. For example, in the case of
    infectious diseases, predictive models can be used to forecast the trajectory
    of an outbreak, estimate the number of cases, or evaluate the impact of interventions
    on disease transmission. By leveraging historical data and the insights gained
    from the model, we can effectively evaluate the model performance and make informed
    decisions based on the predictions.


    DOI: 10.1201/9781032625935-9'
