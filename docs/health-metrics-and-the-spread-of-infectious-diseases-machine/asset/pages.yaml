    # 5.2.2 Relative Risks (RRs)


    The relative risk (or Risk Ratio) is a measure of the strength of the association
    between an exposure and an outcome. It compares the likelihood of a particular
    health outcome, occurring in individuals exposed to a specific risk factor, to
    the likelihood in those who are not exposed. This metric quantifies how much a
    risk factor, like smoking or high blood pressure, increases the probability of
    an adverse health effect.


    To calculate the risk-outcome pairs, we identify the impact on disease burden
    across factors like location, age, sex, and specific causes of disease.⁴ This
    decomposition captures the combined effect of all risk exposures, which are categorised
    into metabolic, behavioural, and environmental risk factors. Each category contributes
    to the overall health outcome, enabling a nuanced understanding of how multiple
    exposures collectively influence disease burden and health outcomes.


    The relative risk is the ratio between the proportions of exposed and unexposed
    groups.


    > $RR = \frac{p_0}{p_1}$$ (5.1)


    where $p_1$ and $p_0$ are the proportions of exposed and unexposed groups respectively.
    Or, in terms of population, these group would approx the values of the real population:


    > $RR = \frac{d_1/n_1}{d_0/n_0}$ (5.2)


    where $d_1/n_1$ and $d_0/n_0$ are the proportion of the population with and without
    the disease.


    For example, let''s say we are studying the association between smoking (exposure)
    and lung cancer (outcome). We want to calculate the relative risk of lung cancer
    among smokers compared to non-smokers. If the relative risk is 2, it means that
    smokers are twice as likely to develop lung cancer to non-smokers.


