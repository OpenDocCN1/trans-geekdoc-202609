    # 5.4 Summarising the Relationship between Risk and Outcome


    The relationship between risk and outcome in epidemiology is central to understanding
    the causes of disease and guiding preventive strategies. This relationship involves
    assessing how exposure to risk factors affects the likelihood of developing specific
    health outcomes. Epidemiological studies quantify the strength of this association
    through measures **Relative Risk (RR) and Population Attributable Fraction (PAF).**


    **Relative Risk (RR)** compares the risk of developing a health outcome among
    individuals exposed to a risk factor with those who are not exposed. An RR greater
    than 1 indicates an increased risk associated with the exposure. For example,
    if smokers have a relative risk of 15 for lung cancer compared to non-smokers,
    this suggests a strong association between smoking and lung cancer.


    **Population Attributable Fraction (PAF)** estimates the proportion of disease
    incidence in a population that can be attributed to a specific risk factor, helping
    quantify the potential impact of reducing or eliminating exposure on the overall
    disease burden. For example, if smoking accounts for 30% of lung cancer cases
    in a population, the PAF for smoking-related lung cancer is 0.30.


    To establish causality, epidemiologists must demonstrate consistent associations,
    dose response relationships (where increased exposure heightens risk), temporal
    precedence'
