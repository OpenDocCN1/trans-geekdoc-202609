- pgno: 68
  md: '# 50 Metrics Components


    In particular, we are interested in the major factors that contribute to the calculation
    of the number of years lived with a disability due to a disease or injury. These
    components are:


    +   **Prevalence and Incidence:** The prevalence of a condition is the number
    of cases of a particular disease or injury present in a population at a given
    time. This is an important component of YLD as it determines the number of people
    who are affected by a disease or injury and the overall impact on the population.
    The incidence is the impact of new cases on a population in a specified time period,
    and it is calculated by considering the number of new cases affected by a condition
    divided by the size of a population. Both incidence and prevalence can be used
    in the calculation.


    +   **Disability weight:** The weight reflects the severity of the disability
    caused by a disease or injury. It is used to quantify the impact of a condition
    on quality of life, with higher weights assigned to more severe conditions.


    Prior to 2010, the calculation of YLDs included elements of discounting and age
    weighting, with discount rates that typically ranged from 3% to 4% per year. Considering
    the future years of life valued less than present years, the practice reflected
    the economic theory of time preference, where immediate benefits are preferred
    over future benefits.


    However, due to its complexity and ethical implications, this approach has been
    criticised. By 2010, the World Health Organization (WHO) and other health organisations
    began to consider simplifying the methodology. The focus shifted to only the disability
    weights used to quantify the severity of different health conditions, leaving
    aside the element of


    +   **Age:** The age of the person affected by a disease or injury is also considered
    when calculating YLD. Condition at an earlier age will have a greater impact on
    the number of years lived with disability.


    +   **Population size:** The size of the population affected by a disease or injury
    is another important component of YLD. A larger population will have a greater
    impact on overall YLD, regardless of the age of the affected individuals.


    +   **Duration of disability:** The duration of disability is also considered
    when calculating YLD. Conditions that last for a longer period of time will have
    a greater impact on the number of years lived with disability.


    # 4.6.3 DALYs Components


    Both YLLs and YLDs are components of the DALYs and are used to provide a comprehensive
    assessment of the impact of disease and injury on a population. By combining YLLs
    and YLDs, the DALYs take into account both premature death and the impact of disease
    or injury on quality of life, providing a more comprehensive view of the overall
    burden of disease.


    DALYs are especially useful in guiding the allocation of health resources as they
    provide a common numerator, allowing for the expression of utility in terms of
    dollar/DALY.


    For example, in Gambia, the provision of the pneumococcal conjugate vaccine costs
    $670 per day saved. This number can be compared to other treatments for diseases,
    to determine whether investing in preventing or treating a different disease would
    be more efficient in terms of overall health.


    > 9–Disability-Adjusted Life Year,” December 8, 2023, https://en.wikipedia.org/w/index.php?title=Disability-adjusted_life_year&oldid=118892629.'
  merge: -1
