- pgno: 161
  md: '# Example: SDI Time Series Analysis


    ```

    components(dcmp) |> head()

    # # dable: 6 x 6 [1Y]

    # # .model [1]

    # # Key:

    # #     value = trend + remainder

    # # .model year trend remainder season_adjust

    # # <chr> <dbl> <dbl> <dbl> <dbl>

    # 1 st 1990 0.738 -0.000400 0.738

    # 2 st 1991 0.743 -0.000560 0.743

    # 3 st 1992 0.754 0.00128 0.75

    # 4 st 1993 0.755 0.001360 0.755

    # 5 st 1994 0.759 0.000800 0.759

    # 6 st 1995 0.762 0.000680 0.763

    ```


    There are three types of time series patterns: trend, seasonality, and cycles.
    A time series is decomposed into components, the trend and cycle are typically
    combined into a single trend-cycle component, often referred to as the trend for
    the sake of simplicity. As a result, a time series can be understood as comprising
    three components: a trend-cycle component, a seasonal component, and a remainder
    component, which captures any other varinations in the series.2


    The components of a time series can be additive or multiplicative, depending on
    the nature of the data:


    > $y_t = S_t + T_t + R_t$ (9.5)

    $y_t = S_t * T_t * R_t$ (9.6)

    $\log(y_t) = \log(S_t) + \log(T_t) + \log(R_t)$ (9.7)


    where:


    +   - $y_t$ is the observed value of the time series at t,

    - $S_t$ represents the seasonal component, capturing regular fluctuations that
    repeat over fixed periods (e.g., annually or quarterly),

    - $T_t$ is the trend component, reflecting the long-term progression or direction
    in the data (e.g., as gradual increases or declines),

    - $R_t$ denotes the remainder or residual component, accounting for short-term
    noise or random variation not by seasonality or trend.


    The Equation 9.5 assumes that the components combine add and are independent of
    one another, which is suitable when the seasonal variance remains relatively constant
    over time. The Equation Equation 9.6 is used when the seasonal variance or residual
    effects vary proportionally with the trend (e.g., higher variability during periods
    of higher values).

    Finally, the Equation Equation 9.7 represents a log-transformed multiplicative
    model, which stabilizes variance and allows for additive decomposition in the
    logarithmic scale—often preferred dealing with exponential growth or heteroscedasticity.


    The subplot() function is from the {nabletools} package and allows for the visualization
    of the components. In particular, the remainder component shown in the bottom
    panel is what is left over when the seasonal and trend-cycle components have been
    subtracted from the data.


    > 2 Forecasting.'
