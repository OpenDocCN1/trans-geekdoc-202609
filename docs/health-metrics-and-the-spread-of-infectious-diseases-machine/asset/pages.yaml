    # 9.4.4 ARIMA model


    The ARIMA model forecasts time series values based on past observations.


    +   In time series analysis, the terms forecast and predict are sometimes used
    interchangeably, but there''s a subtle distinction:

    - Forecast typically refers to estimating future values based on a model trained
    on historical data.

    - Predict can more generally to estimating outcomes, including within-sample estimates
    (e.g., fitting values during model training).


    Auto-ARIMA model is used to establish the best fit by combining autoregressive,
    moving average, and differencing components. However, careful analysis of stationarity,
    autocorrelations, and the residuals are required to fine-tune the model and improve
    forecasting accuracy.


    The ARIMA(value) function automatically selects the p, d, and q values.

    In general, the ARIMA model is defined as


    > ARIMA(p, d, q) = AR(p) + I(d) + MA(q)                          (9.11)


    where:


    +   - AR(p) is the autoregressive part of the model, which uses past values of
    the time series to predict future values.

    - I(d) is the integrated part of the model, which represents the differencing
    of the time series to make it stationary.

    - MA(q) is the moving average part of the model, which uses past forecast errors
    to predict future values.


    The ARIMA() function from the {fable} package automatically selects the appropriate
    degree of differencing to achieve stationarity and fits the ARIMA model accordingly.
    The report() function provides a summary of the fitted model, including parameter
    estimates and diagnostic statistics.


    ```

    fit <- sdi_fr_ts |

    model(ARIMA(value))


    fit |> report(

    # Series: value

    # Model: ARIMA(1,1,0) w/ drift

    #

    # Coefficients:

    #       ar1      constant

    #       0.5971    0.0013

    #       s.e.     0.1562    0.0002

    #>

    ```'
