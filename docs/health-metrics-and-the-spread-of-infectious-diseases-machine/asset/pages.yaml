  md: "228 Introduction to Infectious Diseases\n\n#  14.3 Components of Infectious\
    \ Disease Models\n\n+   - Infection Rate: This parameter, often denoted as $\b\
    eta$ (beta), controls how quickly the susceptible population becomes infected.\
    \ It depends on factors such as contact rate and the probability of transmission\
    \ per contact. It is the rate at which individuals move from the susceptible compartment\
    \ to the infected compartment. The infection rate is proportional to the product\
    \ of susceptible and infected individuals.$^4$\n\n$$\\beta = \\text{Contact Rate}\
    \ \\times \\text{Probability of Transmission per Contact} \\quad (14.1)$\n\n+\
    \   - Recovery Rate: Denoted by $\\gamma$ (gamma), this defines the rate at which\
    \ infected individuals recover and gain immunity or become susceptible again (depending\
    \ on the model). The average duration of infection is the reciprocal of the recovery\
    \ rate.\n\n$$\\gamma = \\frac{1}{\\text{Average Duration of Infection}} \\quad\
    \ (14.2)$\n\n+   - Incubation Period: In models SEIR, the incubation period is\
    \ the average time exposed individuals take before they become infectious. This\
    \ is a critical factor in diseases like COVID-19 and Ebola. The incubation period\
    \ is the reciprocal of the rate at which individuals move from the exposed compartment\
    \ to the infected compartment. $\\sigma$ is the rate at which individuals move\
    \ from the exposed compartment to the infected compartment.\n\n$$\\text{Incubation\
    \ Period} = \\frac{1}{\\sigma} \\quad (14.3)$\n\n+   - Transmission Rate: The\
    \ transmission rate often depends on how a disease spreads—whether’s through respiratory\
    \ droplets, direct contact, vectors like mosquitoes, or other means. Transmission\
    \ rates are also influenced by behaviours, such as hygiene practices and social\
    \ distancing measures. The transmission rate is the product of the probability\
    \ of transmission per contact and the number of contacts. $\\beta$ is the probability\
    \ of transmission per contact, and the number of contacts is the average number\
    \ of people an infected individual comes into contact with.\n\n$$\\text{Transmission\
    \ Rate} = \\beta \\times \\text{Number of Contacts} \\quad (14.4)$\n\n+   - Reproduction\
    \ Ratio ($R_0$): A key metric that indicates the average number of secondary cases\
    \ generated by one infectious individual in a fully susceptible population is\
    \ the basic reproduction ratio ($R_0$). This value is calculated using the formula\
    \ in Equation 14.5. $\\beta$ is the transmission rate and $\\gamma$ is\n\n> ^4Theodore\
    \ Kolokolnikov and David Ivan, “Law of Mass Action and Saturation in SIR Model\
    \ with Application to Coronavirus Modeling,” Infectious Disease Modelling 6 (November\
    \ 16, 2020): 91–97, doi:10.1016/j.idem.2020.11.002."
