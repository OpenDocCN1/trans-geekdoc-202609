    avoiding the complex calculations that would otherwise be required to estimate\
    \ the duration of each new case (from incidence data) and its progression over\
    \ time.\n\nThe choice of prevalence incidence in the calculation of YLDs thus\
    \ reflects a pragmatic approach to capturing the current impact of diseases within\
    \ a population, particularly for chronic diseases where ongoing management and\
    \ sustained healthcare support are crucial.\n\n# 4.4.1.1 Example: Calculating\
    \ YLD for a Disease Using Prevalence\n\nSuppose we want to calculate the Years\
    \ Lived with Disability (YLDs) for a chronic respiratory disease in a population\
    \ of 100,000 people. The prevalence rate of the disease is 2%, with a Disability\
    \ Weight (DW) of 0.3 and an average duration of the disease is 5 years. The YLD\
    \ is calculated using the formula:\n\n+   1. Prevalent Cases = Population Size\
    \ × Prevalence Rate\n\n> Prevalent Cases = 100,000 × 0.02 = 2,000 cases\n\n+ \
    \  2. YLD = Prevalent Cases × Disability Weight × Average Duration\n\n> YLD =\
    \ 2,000 × 0.3 × 5 = 3,000\n\nSo, the YLD for chronic respiratory disease in this\
    \ population over the average duration of the condition is 3,000 years. This YLD\
    \ value would be added to the YLL (Years of Life Lost) for the disease to calculate\
    \ the total DALY.\n\n# 4.4.1.2 Example: COVID-19 Incidence and Prevalence\n\n\
    Let's simulate some COVID-19 cases for a population of 100 000 individuals over\
    \ 365 days. Consider an average infection time of 5 days or 1/5=0.2 (20%) rate\
    \ of infection, and an average recovery time of 20 days which recovers to a rate\
    \ of 1/20=0.05 (5%)\n\nCases and recovered are simulated using a Poisson distribution\
    \ with λ of 0.2 and 0.05, respectively. To model the count of rare events in a\
    \ large population happening within a fixed interval of time or space, the Poisson\
    \ distribution is particularly useful. It suits the initial spread of COVID-19\
    \ in many regions, and assumes that the events (new cases) occur independently\
    \ of each other, which can be a reasonable approximation in the context of infection\
    \ spread over short periods."
