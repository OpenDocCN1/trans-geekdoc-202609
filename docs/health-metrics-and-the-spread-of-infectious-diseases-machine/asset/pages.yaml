    the World Health Organization (WHO) to support health monitoring and assessment.
    They are part of the broader GHO data repository, which serves as WHO''s gateway
    to health-related statistics for 194 Member States. The GHO tables provide data
    on life tables and life expectancy for different age groups. These tables are
    collected in the {hmsidwR} package and used to derive key health metrics.


