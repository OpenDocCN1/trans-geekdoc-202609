    within that population.


    # 4.4 Incidence and Prevalence


    Incidence and prevalence are two fundamental concepts used in epidemiology to
    measure how often a disease occurs and how widespread it is within a population
    at a specific time.


    +   - Incidence refers to the number of new cases of a disease that develop in
    a population during a specific time period. It provides information about the
    risk of contracting the disease and is usually expressed as a rate — for example,
    the number of new cases per 1,000 people per year.


    The incidence rate, even identified as the cumulative incidence (risk) - r is
    considered as a measure of the probability the disease occurs in a specified period
    of time. It quantifies the risk of an individual in the population at risk developing
    the disease during the specified time period.'
