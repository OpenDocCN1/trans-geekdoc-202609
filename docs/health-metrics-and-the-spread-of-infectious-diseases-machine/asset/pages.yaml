- pgno: 122
  md: "When multiple predictors are correlated, but all are crucial for the analysis\
    \ (e.g., deaths due to rabies, total deaths, and total DALYs for all causes),\
    \ applying a correlation step that filters out correlated variables can be problematic.\
    \ One way to overcome bias arising from it is using regularization techniques\
    \ like Ridge Regression or Lasso Regression is often the best approach to handle\
    \ multicollinearity without removing any predictors. Alternatively, Principal\
    \ Components Analysis (PCA) can reduce dimensionality while retaining most of\
    \ the variance. These methods ensure all predictors are included in the model\
    \ without the adverse effects of multicollinearity.\n\n#  7.4.4 Model Specification\n\
    \nThe next step is to outline the model specification. There are various type\
    \ of models that can be used. We start with a random forest. This type is typically\
    \ done due to the algorithm's features, which is able to create multiple bootstrap\
    \ samples (random samples with replacement) from the original dataset. Each bootstrap\
    \ sample is used to train a decision tree.\n\n#  7.4.5 Model 1: Random Forest\n\
    \nRabies deaths may exhibit complex relationships with predictor variables. Random\
    \ forests are capable of capturing non-linear relationships between predictors\
    \ and the target variable.\n\nAlso, it handles multicollinearity, missing data,\
    \ provides variables importance and is an ensemble learning method, which means\
    \ they combine the predictions of multiple individual decision trees to produce\
    \ a more accurate and stable prediction.\n\nIn our simplified case this model\
    \ will do random samples with replacement of data. In {tidymodels} we can select\
    \ different types of engines, in case of random forest we could use random forest,\
    \ ranger, and others. The difference between these engines derives from the specific\
    \ type of calculation used to make the estimation. The Ranger engine is only faster\
    \ than random forest, so let's use this for example.\n\n```\nrf_mod <- rand_forest(mtry\
    \ = tune(),\n                              trees = tune(),\n                 \
    \             min_n = tune(),\n                              mode = \"regression\"\
    ,\n                              engine = \"ranger\")\n```\n\n```\nwkf <- workflow(preprocessor\
    \ = rec,\n                    spec = rf_mod)\n```\n\n```\nrf_res <- tune_grid(object\
    \ = wkf,\n                               resamples = folds,\n                \
    \               grid = 5,\n                               control = control_grid(save_pred\
    \ = TRUE))\n```\n\n```\nshow_best(rf_res, metric = \"rmse\") %>%\n           \
    \   select(-n, -std_err)\n```\n\n```\n#> A tibble: 5 x 7\n#> mtry trees min_n\
    \ .metric estimator mean .config\n#> <int> <int> <int> <chr> <chr> <dbl> <chr>\n\
    ```"
  merge: -1
  img_proc: true
