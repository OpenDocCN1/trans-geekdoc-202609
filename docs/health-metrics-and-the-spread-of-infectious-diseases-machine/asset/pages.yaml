    # 7.3 Model Selection Strategies


    In developing predictive models for health metrics and infectious diseases, selecting
    the appropriate model is critical to ensure accuracy and reliable forecasts. Here
    are outlined sample examples used in the model selection process, we introduce
    the Rabies dataset used for our discussion and demonstrate the selection of a
    suitable model for analysing its impact. Rabies, although nearly 100% fatal symptoms
    appear, presents a unique challenge due to the relative rarity of cases and limited
    availability of comprehensive data. This scarcity complicates efforts to model
    the disease accurately and develop public health strategies.


    To address these challenges, we explore advanced modeling techniques that can
    enhance the robustness of our analyses despite data limitations, which evaluating
    multiple models based on their performance and selecting the best-fitting models
    to achieve the most accurate predictions.


    # 7.4 Example: Rabies


    The rabies dataset from the {hmsidR} package contains information on death rates
    and disability-adjusted life years (DALYs) per 100,000 inhabitants due to rabies
    and all causes of mortality in Asia and the Global region from 1990 to 2019. Rabies²
    (²) is a fatal viral infection, and is also classified as an infectious disease
    that can infect all mammals causing encephalitis. Caused by the rabies virus,
    which belongs to the Lyssavirus genus, it is transmitted to humans through the
    bite of an infected animal such as bats, raccoons, foxes, and obviously dogs,
    which are the main source of human deaths³ neglected tropical diseases (NTD) predominantly
