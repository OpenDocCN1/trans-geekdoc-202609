- pgno: 59
  md: '# Mortality Level and Rates


    **Table 4.4** Example Mortality Rates by Group and Region

    | Metric | Country X | Country Y |

    |---|---|--|

    | Total Population | 5000000 | 2000000 |

    | Total Deaths | 25000 | 40000 |

    | Mortality Rate (per 100,000) | 500 | 200 |


    An analysis of the mortality rates alongside YLLs provides a full picture of the
    health challenges faced by a population. While YLLs emphasise the importance of
    premature death, mortality rates help in understanding the probability and distribution
    of these deaths within the population.


    The mortality rates can be calculated in different ways, depending on the specific
    nature of the analysis. In general, what is considered the most common mortality
    rates is the **Crude Mortality Rate (CMR)**, which represents the number of deaths
    per 100,000 population.


    ```

    $CMR = \frac{\text{Number of deaths}}{\text{Total population}} * 100,000 \quad
    (4.2)$

    ```


    Other types of mortality rates include:


    +   * **Age Specific Mortality Rate (ASMR)**: the number of deaths per 100,000
    population in a specific age group


    ```

    $ASMR = \frac{\text{Number of deaths in a specific age group}}{\text{Total population
    in that age group}} * 100,000 \quad (4.3)$

    ```


    +   * **Cause-Specific Mortality Rate (CSMR)**: the number of deaths per 100,000
    population due to a specific cause


    ```

    $CSMR = \frac{\text{Number of deaths due to a specific cause}}{\text{Total population}}
    * 100,000 \quad (4.4)$

    ```


    +   * **Infant Mortality Rate (IMR)**: the number of deaths per 1,000 live births
    in the first year of life


    ```

    $IMR = \frac{\text{Number of infant deaths}}{\text{Total number of live births}}
    * 1,000 \quad (4.5)$

    ```


    +   * **Maternal Mortality Rate (MMR)**: the number of maternal deaths per 100,000
    live births


    ```

    $MMR = \frac{\text{Number of maternal deaths}}{\text{Total number of live births}}
    * 100,000 \quad (4.6)$

    ```


    These mortality rates are used to assess the impact of diseases or injuries on
    a population and to identify areas where improvements in health care are needed.


