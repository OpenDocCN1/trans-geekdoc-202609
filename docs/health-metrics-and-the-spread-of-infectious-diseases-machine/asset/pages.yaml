  md: "cases %%%>% head()\n# # A tibble: 6 x 6\n\n```\n# province_state_country_region\
    \ lat long date cases\n# <chr> <chr> <dbl> <dbl> <date> <int>\n# 1 \" Afghanistan\
    \ 33.9 67.7 2020-01-22 0\n# 2 \" Afghanistan 33.9 67.7 2020-01-23 0\n# 3 \" Afghanistan\
    \ 33.9 67.7 2020-01-24 0\n# 4 \" Afghanistan 33.9 67.7 2020-01-25 0\n# 5 \" Afghanistan\
    \ 33.9 67.7 2020-01-26 0\n# 6 \" Afghanistan 33.9 67.7 2020-01-27 0\n```\n\nThe\
    \ same is done with:\n\n```\ndeaths1 <- deaths %%%>% starts_with(\"X\")\npivot_longer(cols=names_to\
    \ = \"date\"\n```\n\ndeaths1 %%%>% head()\n# # A tibble: 6 x 6\n\n```\n# province_state_country_region\
    \ lat long date deaths\n# <chr> <chr> <dbl> <dbl> <date> <int>\n# 1 \" Afghanistan\
    \ 33.9 67.7 2020-01-22 0\n# 2 \" Afghanistan 33.9 67.7 2020-01-23 0\n# 3 \" Afghanistan\
    \ 33.9 67.7 2020-01-24 0\n# 4 \" Afghanistan 33.9 67.7 2020-01-25 0\n# 5 \" Afghanistan\
    \ 33.9 67.7 2020-01-26 0\n# 6 \" Afghanistan 33.9 67.7 2020-01-27 0\n```\n\nThen,\
    \ the next step is to join the two sets by province, country, lat, and date. Sum\
    \ the number of cases and deaths and calculate the fatality ratio (CFR) as deaths\
    \ divided by cases.\n\n```\nCOVID19 <- cases1 %%%>%\nleft_join(deaths1,\n  by\
    \ = c(\"province_state\",\n  \"country_region\",\n  \"lat\", \"long\", \"date\\\
    \ %%%>\nmmutate(cases = ifelse(is.na(cases), 0, cases),\ndeaths = ifelse(is.na(deaths),\
    \ 0, deaths)) %%%>\ngroup_by(country_region, date) %%%>\nise(cases = sum(cases),\n\
    deaths = sum(deaths),\ncfr = round(deaths / cases, 3)) %%%>\nfilter(cases > 0)\
    \ %%%>%\narrange(country_region, date)\n```\n\n```\nCOVID19 %%%>%\nselect(country_region,\
    \ date, cases, deaths, cfr) %%%>\n```"
