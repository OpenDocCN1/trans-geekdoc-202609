- pgno: 119
  md: 'Example: Rabies


    # 7.4.1 Training Data and Resampling


    Splitting data into training and test allows the model to train a subsection of
    the data and then test its performance on the remaining part of the data, the
    test set. In this case, we will use the initial_split() function to split the
    data into training and test sets. The proportion assigned to trains can vary but
    it is usually assigned to 80%, also a stratification option can be set.


    ```

    library(tidymodels)

    set.seed(11102024)

    split <- initial_split(dat, prop = 0.8, strata = location)

    training <- training(split)

    test <- testing(split)

    ```


    After that, it is important to create a set of folds, which makes a set of subgroups
    of the original data by following specific directions based on the type of resampling
    technique. Resampling techniques are used to evaluate the model''s performance
    and estimate its generalised error. There are various types of resampling techniques,
    it depends on the specific characteristics of your dataset, and the goals of your
    analysis. Some of the most common resampling techniques:


    +   - **k-Fold Cross-Validation** for general evaluation and hyperparameter tuning.

    - **Bootstrap Resampling** to estimate the variance of your model and for smaller
    datasets.

    - **Time Series Cross-Validation** for time-dependent data to preserve temporal
    structure.

    - **Spatial Resampling** for spatially correlated data to account for spatial
    dependencies.

    - **Stratified Resampling** dealing with imbalanced datasets to ensure proper
    representation of all classes.


    In this case, we use k-Fold Cross-Validation to evaluate the model''s performance.
    The vfold_cv() function creates a set of folds for cross-validation, which is
    used to train and test the model on different subsets of the data.


    ```

    set.seed(11102024)

    folds <- vfold_cv(training, v = 10)

    ```


    # 7.4.2 Data Preprocessing and Feature Engineering


    As already seen in the exploratory phase, preprocessing data is a crucial step
    in machine learning. This process includes handling missing values, standardisation
    of the data, encoding categorical variables, and removing highly correlated variables.


    In this case, we use the recipe() to create a recipe, with a set of preprocessing
    steps. The recipe() allows us to define a model formula and use step_functions()
    for manipulating data. We are going to set up 3 recipes, the first is a basic
    one which includes all variables and does not perform any data transformation.


    ```

    rec <- recipe(dalys_rabies ~, data = training)

    ```


    The second recipe includes some keys to transform the data into way specific models
    would be easier to understand and learn from it. Models such as k-nearest neighbours,
    and support vector machines, that rely on distance metrics, can be sensitive to
    differences in feature scales.'
  merge: -1
  img_proc: true
