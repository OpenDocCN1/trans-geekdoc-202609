  md: "# Techniques for Machine Learning Applications\n\n# Predictions vs Truth\n\n\
    # DALYs due to Rabies Predictions vs Truth\n\nby Year\n\n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_126_0.png)\n\
    \n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_126_1.png)\n\n(a) Predictions vs. Truth\n\
    \n(b) Predictions vs. Truth by Year\n\n**Figure 7.6** Predictions vs. Truth\n\n\
    # 7.4.7 Testing Multiple Models\n\nIn the example above, we used two models to\
    \ predict DALYs due to rabies, a random forest with {tidymodels} and a generalised\
    \ linear model with {glmnet} with a Root Mean-Square Error of 0.448 and 0.257\
    \ respectively. The Random Forest model has a higher RMSE, which means it has\
    \ a higher prediction error compared to the GLM model. However, we haven't applied\
    \ any of the preprocessing steps, and there are many other models that could be\
    \ used to predict DALYs as:\n\n+   1. **Support Vector Machines (SVM)**: SVMs\
    \ are a powerful machine learning algorithm that can be used for both classification\
    \ and regression tasks. They work by finding the hyperplane that best separates\
    \ the data into different classes or groups.\n\n+   2. **Extreme Gradient Boosting\
    \ (XGBoost)**: Known for its high performance in various prediction tasks, XGBoost\
    \ can handle missing values and is effective for large datasets.\n\n+   3. **K-Nearest\
    \ Neighbours (KNN)** models are a type of instance-based learning algorithm that\
    \ stores all available cases and classifies new cases based on a similarity measure.\n\
    \n+   4. **Long Short-Term Memory (LSTM) Networks**: For temporal or sequential\
    \ health data, LSTM networks can capture dependencies over time, making them suitable\
    \ for time-series prediction of disease progression and outcomes.\n\nEach of these\
    \ models has its own strengths and weaknesses, and the choice of model will depend\
    \ on the specific characteristics of the data and the goals of the analysis. By\
    \ testing multiple models and comparing their performance, we can identify the\
    \ best model for the given data and task.\n\nLet's use the {parsnip} package and\
    \ the {workflow_set()} function to fit a set of models to the rabies data. We\
    \ will fit a **Support Vector Machine (SVM)**, and a **K-Nearest neighbours (KNN)**\
    \ model to the data and compare their performance.\n\n```\nlinear_reg_spec <-\n\
    \  linear_reg(penalty = tune(),\n    mixture = tune()) %%\n```"
