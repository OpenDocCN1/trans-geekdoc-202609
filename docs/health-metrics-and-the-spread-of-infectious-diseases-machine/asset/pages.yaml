    # [3] "sex" "SmokingHistory"

    # [5] "AtrialFibrillation" "CoronaryDisease"

    # [7] "DiabetesHistory" "HypercholesterolemiaHistory"

    # [9] "HypertensionHistory"

    ```


    Set up the recipe for the data with the recipe() function from the tidymodels
    package. We use step_corr() to remove highly correlated predictors, step_center()
    and step_scale() to standardize the predictors, step_YeoJohnson() to transform
    the predictors, and step_zv() to remove variance predictors.


    ```

    is_recipe <- recipe(Stroke, data = selected_train) %>%%

    #step_intersect(int_form) %>%%

    step_corr(all_predictors), threshold = 0.75) %>%%

    step_center(all_predictors()) %>%%

    step_scale(all_predictors()) %>%%

    step_YeoJohnson(all_predictors()) %>%%

    step_zv(all_predictors())

    ```


