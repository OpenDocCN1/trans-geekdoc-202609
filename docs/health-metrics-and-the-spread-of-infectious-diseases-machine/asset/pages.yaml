  md: '# Example of a Model Workflow


    ```

    library(reticulate)

    ```


    This is to configure python and for installing necessary packages:


    ```

    py_config()

    ```


    ```

    # type <pip3 install scipy> on terminal

    # type <pip3 install matplotlib> on terminal


    import matplotlib

    matplotlib.use(''TkaAgg'') # Ensure you have an interactive backend

    import matplotlib.pyplot as plt

    import scipy.integrate as spi

    import numpy as np

    ```


    Set-up the parameters:


    ```

    beta = 1.4247

    gamma = 0.14286

    TS = 1.0

    ND = 70.0

    SO = 1 - 1e-6

    IO = 1e-6

    INPUT = (SO, IO, 0.0)

    ```


    Define differential equations:


    ```

    def diff_eqs(INP, t):

    Y = np.zeros((3))

    V = INP

    Y[0] = - beta * V[0] * V[1]

    Y[1] = beta * V[0] * V[1] - gamma * V[1]

    Y[2] = gamma * V[1]

    return Y

    ```


    ```

    t_start = 0.0, t_end = ND; t_inc = TS

    t_range = np.arange(t_start, t_end + t_inc, t_inc)

    RES = spi.odeint(diff_eqs, INPUT, t_range)

    ```


    ```

    # Plotting

    # Ensure interactive mode is on plot

    plt.ion()

    plt.subplot(211)

    plt.plot(RES[:,], ''-g'', label=''Susceptibles'')

    plt.plot(RES[:, 2], ''-k'', label=''Recovered'')

    plt.legend(loc=0)

    plt.title(''SIR Model'')

    plt.xlabel(''Time'')

    plt.ylabel(''Susceptibles and Recovered'')

    ```'
