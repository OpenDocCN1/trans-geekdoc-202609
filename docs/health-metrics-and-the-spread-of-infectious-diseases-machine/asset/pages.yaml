    # 12.3 Coordinate Reference System (CRS)


    **A Coordinate Reference System (CRS)** is a standardised way of defining the
    spatial location of features on the Earth''s surface. It uses a set of coordinates
    to represent the position of points, lines, and polygons in space. There are different
    types of CRS, such as **geographic** and **projected** CRS, which are used to
    represent the Earth''s surface in different ways. Geographic CRS (**LatLong**)
    represents locations on a curved surface using latitude and longitude for global
    mapping, while projected CRS or **Universal Transverse Mercator (UTM)** projects
    the curved Earth onto a flat map, using metres for precise mapping. In particular,
    the UTM system provides the distance in metres from the equator and the central
    meridian of a specific zone.


    We use the `sf` package to define and transform CRS. The `st_crs()` function allows
    you to retrieve the CRS of a spatial object, while the `st_transform()` function
    allows you to transform the coordinates of a spatial object to a different CRS.


    ```

    africa_crs <- st_crs(africa)

    africa_crs

    # Coordinate Reference System:

    # User input: WGS 84

    # wkt:

    # GEOGCRS["WGS 84",

    # DATUM["World Geodetic System 1984",

    # ELLIPSID["WGS 84",6378137,298.25723563],

    # LENGTHUNIT["metre",1]]

