- pgno: 157
  md: '# Example: SDI Time Series Analysis


    spread of emerging pathogens to assessing the long-term effects of public health
    policies, predictive modelling offers valuable insights into the future of global
    health. As discussed in Chapter 5, incorporating indicators such as the SDI can
    offer a more comprehensive understanding of how social and economic determinants
    influence health outcomes.


    The SDI is a composite index developed by the Global Burden of Disease (GBD) Study
    to capture a country''s level of socio-demographic development, that contains
    various social and demographic factors to provide a comprehensive measure of a
    population''s health and well-being.


    It is based on three components:


    +   - Total fertility rate (TFR) among women under age 25 (TFU25)

    - Average educational attainment in the population over age 15 (EDU15+)

    - Income per capita (lag-distributed)


    It ranges from 0 to 1 thus it is usually multiplied by 100 for a scale of 0 to
    100.


    # Standard Calculation of SDI


    The SDI is calculated as the geometric mean of these three components:


    ```

    $SDI = \sqrt[3]{TFU25 \times EDU15 + LDI} \quad (9.1)$

    ```


    Each component TFU25, EDU15+, and LDI is normalised before taking the geometric
    mean to ensure they are on a comparable scale.


    In particular, Total Fertility Rate (TFR) is defined as the average number of
    children a woman would have over her lifetime given current age-specific fertility
    rates—is a key demographic indicator with broad implications for national well-being.


    # Standard Calculation of TFR


    ```

    $TFR = \sum(ASFR_i \times 5) \quad (9.2)$

    ```


    ASFR represents the age-specific fertility rates for age group $i$, and the sum
    is typically calculated over all childbearing age groups (often 5-year intervals
    from ages 15-49).


    The TFR formula is specific to calculating fertility rates, while the SDI formula
    incorporates a subset of the TFR (TFU25) along with education and income metrics
    to create a broader socio-demographic index.


    In general, the level of this index helps identify key drivers in the development
    of health outcomes. SDI can be used as a predictor in predictive models to estimate
    the burden of diseases, mortality rates, and other health metrics.


    For example, the relationship between SDI and the incidence of a disease can be
    modelled using a logistic regression model:


    ```

    $log\left(\frac{p}{1-p}\right) = \beta_0 + \beta_1 \times SDI + \beta_2 \times
    X_2 + \dots + \beta_k \times X_k \quad (9.3)$

    ```'
  merge: -1
  img_proc: true
