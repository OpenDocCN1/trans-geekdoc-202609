- pgno: 82
  md: '# 5.2.5 Population Attributable Fractions (PAFs)


    The Population Attributable Fraction (PAF) is a measure used to quantify the proportion
    of disease incidence in a population that can be attributed to a specific risk
    factor. It represents the proportion of risk that would be reduced in a given
    year if the exposure to a risk factor in the past was reduced to an ideal exposure
    scenario.


    PAF is calculated based on the prevalence of the risk factor in the population
    and the relative risk associated with that risk factor. The formula for calculating
    PAF is as follows:


    ```

    PAF = \frac{P_e \times (RR - 1)}{1 + P_e \times (RR - 1)} \quad (5.3)

    ```


    Where:


    +   * $P_e$ is the prevalence of the risk factor in the population.

    * $RR$ is the relative risk associated with the risk factor, representing the
    increased risk of disease among individuals exposed to the risk factor compared
    to those who are not exposed.


    The PAF ranges from 0% to 100%. A PAF of 0% indicates that the risk factor has
    no impact on the incidence of disease, while a PAF of 100% indicates that all
    cases of disease in the population can be attributed to the risk factor.


    PAF is useful for public health interventions as it provides insight into the
    potential of reducing or eliminating a specific risk factor on the incidence of
    disease in the population. By targeting interventions to reduce exposure to the
    risk factor, public health efforts can effectively reduce the burden of disease
    in the population and improve overall health outcomes.


    # 5.3 Causal Inference


    Causality concerns the relationship between two variables, where one variable
    (the cause) directly influences the other (the effect). For example, regular exercise
    improves cardiovascular health, or adequate sleep supports cognitive function.
    However, causality is distinct from correlation, which indicates a statistical
    association without implying a direct influence. In instance, a correlation between
    watching television and obesity does not imply a causal link. Establishing causality
    requires systematically evaluating alternative explanations and accounting for
    confounding factors that could affect both the cause and effect.


    Causal inference is essential for understanding the underlying causes of a condition
    or phenomenon, even if these are not immediately apparent. It often requires a
    structured data analysis to uncover hidden causal relationships within the observed
    data.


    Performing inference requires setting up an experiment, where there are **treatment**
    and **outcome** elements. The *treatment* is the intervention applied to the data.
    For example, to confirm that *regular exercise leads to improved cardiovascular
    health*, an intervention may be introduced to another variable, such as regular
    fruit consumption, and observe its combined effect with exercise on cardiovascular
    health.


    In this investigation, the primary factors are exercise and fruit intake. The
    goal is to examine whether their combination improves cardiovascular health. Once
    the intervention is analysed'
