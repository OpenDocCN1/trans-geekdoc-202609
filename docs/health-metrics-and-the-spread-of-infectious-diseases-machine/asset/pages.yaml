    **Figure 15.3** Actual vs. Predicted COVID19 Cases\n\n**Figure 15.4** Actual vs.\
    \ Predicted COVID-19 Cases\n\n# 15.3.3 Ensemble Ensembling - Combining Multiple\
    \ Models\n\nWe have been able to simulate the spread of COVID-19 using the SEIR\
    \ and predict the spread using the Bayesian regression model. However, combining\
    \ the predictions of multiple models can provide more accurate and robust forecasts.\
    \ This technique is known as **ensemble modelling.**\n\nEnsemble modelling combines\
    \ the predictions of multiple models to improve the overall accuracy and robustness\
    \ of predictions. This technique is particularly useful in infectious disease\
    \ modelling to account for uncertainties and variability in data, providing more\
    \ reliable estimates of disease spread.\n\nThis method combines the strengths\
    \ of different models to produce more accurate and stable predictions by averaging\
    \ the results of individual models or using more sophisticated techniques such\
    \ as *stacking* or *boosting.\n\nFor example, ensemble models have been used to\
    \ predict COVID-19 cases and provide short-term forecasts by integrating multiple\
    \ model types. Other methods combine sub-epidemic models over varying forecasting\
    \ periods to enhance prediction accuracy⁷\n\nIn this case, we use the `tidymodels`\
    \ meta-package and other key packages such as `{modeltime}`, and `{stacks}` to\
    \ combine different types of models. We use here: Decision Tree, Random Forest,\
    \ K-Nearest Neighbors (KNN), and Support Vector Machines (SVM) models to combine\
    \ and predict the spread of COVID-19 cases.\n\n```\nlibrary(tidymodels)\nlibrary(modeltime)\n\
    library(stacks)\n```\n\n> ⁷ Gerardo Chowell et al., “An Ensemble n-Sub-Epidemic\
    \ Modeling Framework for Short-Term Forecasting Epidemic Trajectories: Application\
    \ to the COVID-19 Pandemic in the USA,” PLOS Computational Biology 18, no. 10\
    \ (October, 2022): e1010602, doi:10.1371/journal.pcbi.1010602."
