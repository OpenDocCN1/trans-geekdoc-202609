  md: '# 6.2.2 Learning Methods


    There are a variety of models available, and the decision on which model to use
    depends on the type of learning method supervised or unsupervised. Supervised
    learning is applied when data are labelled, that the dataset includes both the
    independent (predictors) and dependent (outcome) variables. It is the classical
    approach to learning, where the model learns to predict the outcome variable based
    on the input variables. Unsupervised learning, on the other hand, only includes
    the input variables, so there is no direct objective, or a "response" variable
    to focus on. The model learns to find patterns and relationships in the data without
    explicit labels, making it useful for clustering and dimensionality reduction.


    The nature of the data is also fundamental, including whether the outcome is continuous
    or discrete, and whether the number of predictors exceeds the number of observations.
    Models can range from non-linear to multilevel, and they can involve more complex
    combinations. A major distinction is between regression and classification based
    on whether the outcome variable is continuous.


    Machine learning models are all types of models that can be all of the above but
    allow for learning from data model parameters auto-calibration. Learning from
    data is a process where an algorithm adjusts its parameters to minimise the errors
    in predictions. Each algorithm has its method of learning.


    # 6.2.3 Parameters and Hyper-Parameters


    In learning and statistical modelling, parameters and hyperparameters are two
    distinct concepts, each playing a crucial role in building and tuning models.


    Parameters are the internal coefficients or weights that the model learns from
    the training data. These values are adjusted during the training process to minimise
    the loss function and improve the model''s accuracy. For instance, in a linear
    regression, parameters include the slope coefficients and the intercept (Equation
    6.3). Parameters are optimised during the training phase using optimization algorithms
    that perform selection, mutation, and crossover of the coefficients. The goal
    is to find the set of parameters that best fit the training data.


    Hyperparameters are the external settings of the model that can be redefined by
    the practitioner, or optimised using techniques such as grid search, random search,
    or advanced methods like Bayesian optimization. This process involves evaluating
    performance with different hyperparameter settings. Examples of hyperparameters
    are the sample size, the number of trees on a random forest, the learning rate,
    the regularisation setting (λ) in ridge and lasso regression, and so on.


    More will be explained below, but it''s important to understand that creating
    a model might involve high-level calculations. This means progressing beyond a
    basic equation to include parameter selection and hyperparameter optimization.
    In particular, the study of infectious diseases, the focus is on how variables
    evolve over time. For this reason, selecting the appropriate model requires an
    understanding of the underlying patterns and dynamics of growth.'
