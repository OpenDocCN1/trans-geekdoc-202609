    To assess whether the series is **stationary**, we use a specific test, the KPSS
    test or **Augmented Dickey-Feller test**. If this test, generally defined as unit
    root test, indicates non-stationarity, we can apply a **first-order difference**
    to remove the trend and convert it into a stationary series.


    To apply the KPSS test we use the features() function from {fatetools} package
    and specify the test to use:unitroot_kpss. The {urca} might be needed for this
    task; if needed `install.packages("urca")`.


    ```

