    \ codes: 0 *** 0.001 ** 0.01 * 0.05 ' 0.1 ' 1\n#>\n#> R-sq (adj) = 0.914 Deviance\
    \ = 91.6%\n#> GCV 4818.7 Scale est. 4687 n = 365\n\nThe smooth term for days is\
    \ significant, as the effective degrees of freedom (edf) for the smooth term are\
