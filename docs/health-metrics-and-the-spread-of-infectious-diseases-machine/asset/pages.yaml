- pgno: 91
  md: '# The Steps of Building a Model


    # 6.3 The Steps of Building a Model


    The process of constructing a model that would be able to explain the relationships
    between dependent and independent variables in a given system is intended as model
    development. At the heart of this process is the application of a model function
    to estimate coefficients that minimise the difference between the model''s predictions
    and the observed data.


    ![](img/6b61f0d3dcab44c60cdfe4e888d549c9_91_0.png)


    Figure 6.2 Model Building Process


    Let break this down further: Suppose we have a response variable, denoted as $y$,
    which represents the number of deaths or infections in our dataset. Additionally,
    we have some other variables called predictors $x_1, x_2, \dots$ which are factors
    that may influence the level of $y$. These predictors are selected based on the
    type of analyses, and could include factors such as demographics, secondary health
    outcomes (morbidity), population density, temperature, vaccination rates, etc.
    The goal of model development is to create $a mathematical function that captures
    the relationship between the response variable $y$ (or dependent variable) responding
    to changes in predictor variables $x_i$ (or independent variables) within the
    study.


    This function, often referred to as the model equation or model function, is typically
    represented as:


    ```

    $y = f(x_1, x_2, \dots) + \epsilon \quad \(6.2)$

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: "74\n\nIntroduction to Machine Learning\n\nHere, f represents the relationship\
    \ between the predictors and the response, and epsilon represents the error term,\
    \ which captures the difference between the observed values of y and the values\
    \ predicted by the model. To estimate the coefficients of the model function,\
    \ we employ statistical techniques such as linear regression for continuous response\
    \ variables, and various machine learning algorithms that include tuning parameters\
    \ to handle more complex dataset and model specifications. These techniques analyse\
    \ the relationship between the predictors and the response in the dataset and\
    \ determine the optimal coefficients that minimise the difference between the\
    \ observed (y) values and values predicted by the model (y).\n\nOnce the model\
    \ coefficients are estimated, we can use the model function to predict future\
    \ values of y for new values of predictors xi. This allows us to simulate the\
    \ effect of different scenarios or make predictions about future outcomes based\
    \ on the relationships identified in the data. Overall, the model development\
    \ process is a crucial step in the methodology framework, as it sets the foundation\
    \ for understanding and analysing the relationships between variables in a given\
    \ system. It enables us to extract insights from the data, make predictions, and\
    \ influence decision-making in various fields, including epidemiology, public\
    \ health, economics, and environmental science.\n\n# 6.3.1 Example: Cholera\n\n\
    The first dataset used is the {HistData} package HistData::CholeraDeaths1849,\
    \ made of 730 observations and 6 variables, with 2 causes of deaths: cholera and\
    \ diarrhoea. For this example we select the deaths due to cholera within 12 months\
    \ in 1849. Let's look at the first 6 rows of the dataset:\n\n```\nlibrary(tidyverse)\n\
    library(HistData)\n```\n\n```\ncholera <- HistData::CholeraDeaths1849 %>%\n  filter(cause_of_death\
    \ == \"Cholera\") %>%\n  select(date, deaths)\n```\n\n```\ncholera %>% head()\n\
    # # A tibble: 6 x 2\n#    date        deaths\n#    <date>      dbl\n# 1 1849-01-01\
    \   13\n# 2 1849-01-02   19\n# 3 1849-01-03   28\n# 4 1849-01-04   24\n# 5 1849-01-05\
