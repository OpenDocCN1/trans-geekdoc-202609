    For example, the CRS of the Africa map is WGS 84 or World Geodetic System 1984
    is a reference system for the Earth''s surface that defines origin and orientation
    of the coordinate axes, called a datum (a fact known from direct observation).
    The EPSG is a structured dataset of CRS and Coordinate Transformations, it was
    originally compiled by the now, defunct, European Petroleum Survey Group². The
    EPSG code for WGS 84 is 4326.


    # 12.4 Example: Simulation of Infections in Central African Republic


    Synthetic data are created for the Central African Republic. The simulation of
    the number of infected individuals, their location, and temperature levels are
    obtained with random numbers generating functions from the {stat} package, which
    is a base package.

    The Central African Rep. is a landlocked country in Central Africa, with a population
    of approximately 5 million people. The country is known for its diverse wildlife
    and natural resources, has faced challenges such political instability and armed
    conflict.


    ```

    ctr_africa <- africa%%%

    filter(name == "Central African Rep.")

    ```


    # 12.4.1 Bounding Box


    We use the st_bbox() function to retrieve the bounding box of the ctr_africa object,
    as a matrix with minimum and maximum values of the coordinates. A bounding box
    is a rectangular area defined by two points: the lower-left corner (minimum values
    of the coordinates) and the upper-right corner (maximum values of the coordinates).
    It provides a quick way to determine the spatial extent of a region and is often
    used in spatial analysis to define the boundaries of a study area.


    ```

    bbox <- ctr_africa%%% st_bbox()

    bbox

    # xmin ymin xmax ymax

    # 14.45941 2.26764 27.37423 11.14240

    ```


    # 12.4.2 Spatial Coordinates


    The st_coordinates() function allows to extract the coordinates from a geometry
    vector and release a matrix with 5 columns, where the first two columns are the
    longitude (X) and latitude (Y), and the other indexes to group the coordinates
    into polygons.


    > https://www.nceas.ucsb.edu/sites/default/files/2020-04/OverviewCoordinateReferenceSystems.pdf'
