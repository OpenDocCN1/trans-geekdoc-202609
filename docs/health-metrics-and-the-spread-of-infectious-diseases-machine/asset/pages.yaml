  md: "# 2.5.3.1 Simulation of Risk Exposure\n\nThe simulation of the risk exposure\
    \ can be done replicating a logistic regression model with a DAG structure. We\
    \ can use the {dagitty} package, and the simulateLogistic() function. The model\
    \ estimates the probability of an outcome (O), given exposure (E) to different\
    \ risk factors, such as C1, C2, and C3 (confounders). The relative risk is calculated\
    \ based on the estimated probabilities of the outcome given exposure and no exposure\
    \ to the risk factors.\n\n```\n# Load necessary libraries\nlibrary(dagitty)\n\
    library(tidyverse)\n\n# Create DAG structure\ndag <- dagitty(\"dag { E -> 0\n\
    C1 -> 0\nC2 -> 0\nC3 -> 0 }\")\n\ndata <- dag %>% tidy_dagitty()\n# Generate data\n\
    set.seed(123)\nn <- 1000\ndata <- simulateLogistic(dag)\n\nhead(data)\n# C1 C2\
    \ C3 E 0\n# 1 1 -1 1 -1\n# 2 -1 -1 -1 1 1\n# 3 1 1 1 -1 -1\n# 4 1 1 -1 -1 -1\n\
    # 5 1 -1 -1 -1 1\n# 6 -1 -1 -1 1 1\n\n# Fit logistic regression model\nmodel <-\
    \ glm(O - E + C1 + C2 + C3,\n      data = data,\n      family = \"binomial\")\n\
    \n# Extract estimated probabilities\npr_outcome_exp <- predict(model, type = \"\
    response\")\npr_outcome_no_exp <- predict(model,\n      newdata = data.frame(E\
    \ = \"1\",\n      C1 = data$C1,\n      C2 = data$C2,\n      C3 = data$C3),\n \
    \     type = \"response\")\n\n# Calculate relative risk\nrelative_risk <- pr_outcome_exp\
    \ / pr_outcome_no_exp\n```"
