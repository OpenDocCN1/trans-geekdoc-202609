    \ <- hmsdwR::germany_lungc |>\ngplot(aes(x = age, y = dx, group = sex)) +\ngeom_line(aes(linetype\
    \ = sex)) +\ngeom_point() +\n  labs(title = \"Lung Cancer Deaths by Age in Germany\"\
    ,\n      x = \"Age\",\n      y = \"Deaths\")\n```\n\n```\nbarplot <- hmsdwR::germany_lungc\
    \ |>\ngplot(aes(x = age, y = dx, group = sex)) +\ngpgpattern::geom_col_pattern(aes(pattern\
    \ = sex)),\n  position=\"stack\",\n  fill='white') +\n  labs(title = \"Lung Cancer\
    \ Deaths by Age in Germany\",\n      x = \"Age\",\n      y = \"Deaths\")\n```\n\
    \n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_185_0.png)\n\n(a) Scatterplot: Lung\
