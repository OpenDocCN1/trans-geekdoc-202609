  md: '# Example: Modelling the Spread of COVID-19


    We start by splitting the data into training and testing sets using the initial_split()
    function from the {sample} package. The training set will be used to train the
    models, while testing set will be used to evaluate the models'' performance.


    ```

    set.seed(10011)

    # Split the data into training and testing sets

    cv_split <- initial_split(cv19_data, prop = 0.8)

    cv_train <- training(cv_split)

    cv_test <- testing(cv_split)

    ```


    Create a vfold_object for cross-validation with 10 folds. This object will be
    used to evaluate the models'' performance during training.


    ```

    set.seed(1001)

    cv_folds <- vfold_cv(cv_train, v = 10)

    ```


    We also define a recipe to preprocess the data, including log transformation and
    dummy encoding of categorical variables. The recipe is then used to create a workflow
    that combines the preprocessing steps with the model specifications.


    ```

    cv_recipe <- recipe(~ , data = cv_train) %>%

    step_all(all_numeric(), -all_outcomes()) %>%

    step_dummy(all_nominal(), -all_outcomes) %>%

    ```


    To check the output of the recipe transformation: cv_recipe %>% prep() %>% juice
    Define the models'' specifications with parameters to tune, and the engine to
    use:


    ```

    # Decision Tree

    cart <- decision_tree(cost_complexity = tune(),

    tree_depth = tune(),

    min_n = tune()) %>%

    set_engine(\''rpart") %>%

    set_mode(''regression'')

    ```


    ```

    # Random Forest

    rand_forest <- rand_forest(mtry = tune),

    min_n = tune()) %>%

    set_engine(\''ranger'') %>%

    set_mode(''regression'')

    ```


    ```

    # Nearest Neighbors (KNN)

    knn <- nearest_neighbor(neighbors = tune()) %>%

    set_engine(\''kknn'') %>%

    set_mode(''regression'')

    ```


    ```

    # Support Vector Machine (SVM)

    svm <- svm_rbf(cost = tune()

    ```


    Then, create a workflow_set() that combines the predictions of different models.'
