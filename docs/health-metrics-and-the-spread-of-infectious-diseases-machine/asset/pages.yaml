- pgno: 170
  md: 'In conclusion, the analysis of the Socio-Demographic Index (SDI) in France
    from 1990 to 2019 demonstrates the effectiveness of time series analysis and mixed
    models in understanding and forecasting complex health-related data. By employing
    techniques such as decomposition, autocorrelation analysis, and ARIMA modelling,
    we can gain valuable insights into the underlying patterns and trends. The use
    of ensemble learning further enhances the predictive performance of the models,
    allowing for more accurate forecasts and better-informed decision-making in public
    health. However, additional model validation and diagnostic checks, such as residual
    analysis and cross-validation, should be conducted to ensure that these models
    generalize well to unseen data and are not overfitting.


    # 9.5 Mixed Models


    Mixed models are a powerful statistical tool for analysing data with a hierarchical
    or nested structure, where observations are grouped within higher-level units.
    By incorporating both fixed and random effects, mixed models can account for the
    variability within and between groups, providing a flexible framework for modelling
    complex data structures. Mixed models are widely used in various fields, and particularly
    useful in fields like healthcare and infectious diseases where data might be collected
    across different subjects or time points.


    In the following section, we will discuss the application of mixed models in estimating
    the Years Lived with Disability (YLDs) and the difference ratios used in forecasting
    non-fatal disease burden.


    # 9.5.1 Mixed-Effects Models in Estimating YLDs


    Mixed-effects models are particularly useful in estimating YLDs because they can
    handle data that is hierarchically structured data.


    Fixed Effects: These are the primary effects of interest and include variables
    such as age, gender, year, and specific interventions or treatments.


    Random Effects: These capture the variability that is not explained by the fixed
    effects, such as differences between patients, clinics, or regions.


    By using mixed-effects models, we can better account for the within-subject and
    between-subject variability, providing more accurate estimates of YLDs.


    # 9.6 Example: YLDs due to Tuberculosis - Mixed-Effects Models


    In this example, we will demonstrate how Years Lived with Disability (YLDs) due
    to Tuberculosis can be used to predict future values using mixed-effects models.'
  merge: -1
  img_proc: true
- pgno: 171
  md: "# Example: YLD due to Tuberculosis - Mixed-Effects Models\n\nWe use `lme4`\
    \ package to fit mixed-effects models, enabling us to account for both fixed effects\
    \ (e.g., year, prevalence) and random effects (e.g., variability across countries).\
    \ This approach is particularly useful for analysing grouped or repeated measures\
    \ data, such as longitudinal health data, where observations are not independent\
    \ over time or across different levels of analysis.\n\nData are from the `g7_hmetrics`\
    \ dataset in the `hmsidwr` package, which contains rates (per 100,000 population)\
    \ for YLDs, deaths, incidence, and prevalence of Respiratory infections and tuberculosis\
    \ in 2010 and 2019 for selected countries.\n\n```\nlibrary(lme4)\nlibrary(tidyverse)\n\
    ```\n\n```\ntuberculosis <- hmsidwr::g7_hmetrics %>%\n  filter(measure %in% c(\"\
    Prevalence\",\n    \"YLDs\"),\n    str_detect(cause, \"Tuberculosis\"),\n    !year\
    \ == 2021,\n    !location == \"Global\",\n    metric == \"Rate\",\n    sex ==\
    \ \"both\") %>%% # per 100,000 population\n  select(year, location, measure, val)\
    \ %>%%\n  pivot_wider(names_from = measure,\n    values_from = val)\n```\n\n```\n\
    tuberculosis %>% head()\n# A tibble: 6 x 4\n# year location YLDs Prevalence\n\
    # dbl <chr> dbl <dbl>\n# 1 2010 Japan 3.07 17720.\n# 2 2019 Japan 2.03 14215.\n\
    # 3 2010 Germany 1.79 7758.\n# 4 2019 Germany 1.55 6706.\n# 5 2010 UK 2.67 8670.\n\
    # 6 2019 UK 1.84 7534.\n```\n\nWe can see how the level of YLDs due to tuberculosis\
    \ has decreased in all selected countries over the 10-year period.\n\n```\nlibrary(ggpattern)\n\
    gplot(tuberculosis,\n  aes(x = fct_reorder(location, YLDs),\n      y = YLDs, group\
    \ = year)) %>% aes(pattern = factor(year)) +\n  ggpattern::geom_col_pattern(\n\
    \    position = \"dodge\",\n    fill = 'white',\n    colour = 'black\\') +\nlabs(title=\"\
    YLDs for Tuberculosis by Location and Year\",\n  x = \"Location\", pattern = \"\
