- pgno: 255
  md: "# Example: Modelling the spread of COVID-19\n\n```\ncv19_data <- result %%\n\
    mmutate(date = as.Date(time, origin = \"2022-01-01\",\n       day_of_week = wday,\
    \ label = TRUE),\n       week_of_year = week(date),\n       month = month(date),\n\
    \       lag_1_cases = lag(I, 1),\n       lag_7_cases = lag(I, 7)) %>%%\ndrop_na(na)\n\
    cv19_data %>% head(n = 3) %>%% glimpse()\n# Rows: 3\n# Columns: 11\n# $ time <dbl>\
    \ 7, 8, 9\n# $ S <dbl> 999997.2, 999999.6, 999999.0\n# $ E <dbl> 1.409890, 1.659350,\
    \ 1.959065\n# $ I <dbl> 1.016210, 1.211223, 1.439964\n# $ R <dbl> 0.356260, 0.467644,\
    \ 0.5998941\n# $ date <date> 2022-01-08, 2022-01-09, 2022-01-10\n# $ day_of_week\
    \ <ord> Sat, Sun, Mon\n# $ week_of_year <dbl> 2, 2, 2\n# $ month <dbl> 1, 1,\n\
    # $ lag_1_cases <dbl> 0.0848415, 1.0162103, 1.2112229\n# $ lag_7_cases <dbl> 0.0000000,\
    \ 0.1750967, 0.3169955\n```\n\nIn this example we do not split the data into training\
    \ and testing sets, but in a real-world scenario, it is essential to validate\
    \ the model's performance on unseen data. Our data are made of 359 observations\
    \ and 11 variables.\n\n```\ncv19_data %>% dim()\n# [1] 359 11\n```\n\nThe `brms`\
    \ function from the `{brms}` package, fits the Bayesian regression model to the\
    \ data by specifying the outcome variable I (number of infected individuals) and\
    \ the predictors day_of_week, week_of_year, month, lag_1_cases, and lag_7_cases.\
    \ We use a Gaussian likelihood function and provide prior distributions for the\
    \ regression coefficients and the error term. The **Stan algorithm** is used to\
    \ sample from the posterior distribution of the model parameters. In particular,\
    \ we use a **normal prior distribution** with a mean of 0 and standard deviation\
    \ of 10 for the regression coefficients and a **Cauchy prior distribution** with\
    \ a scale of 5 for the error term.\n\nThe decision to use a normal and a Cauchy\
    \ prior is based on the properties of the data and the model assumptions. In this\
    \ case, we assume that the regression coefficients are normally distributed around\
    \ 0 with a standard deviation of 10, and the error term is distributed according\
    \ to a Cauchy distribution with a scale of 5.\n\nThe model is run for 2000 iterations\
    \ with a **warmup** of 1000 iterations and 4 chains. The reason for the warmup\
    \ is to allow the **Markov Chain Monte Carlo (MCMC) algorithm** to converge to\
    \ the posterior distribution. The chains are run in parallel to explore the parameter\
    \ space and estimate the posterior distribution of the model parameters.\n`library(brms)`"
  merge: -1
  img_proc: true
- pgno: 256
  md: "# Define the Bayesian regression model\n\n```\nbayesian_model <- brm(\nI -\
    \ day_of_week + week_of_year + month + lag_1_cases + lag_7_cases,\ndata = cv19_data,\n\
    family = gaussian(),\nprior = c(set_prior(normal(0, 10), class = \"b\",\n  set_prior(cauchy(0,\
    \ 5), class = \"sigma\\))\n```\n\n```\niter = 2000,\nwarmup = 1000,\nchains =\
    \ 4,\nseed = 42)\n```\n\nThe bayesian_model object contains the fitted model,\
    \ we can inspect the summary of the model to assess the posterior samples of the\
    \ model parameters, the posterior distribution of parameters, and the model statistics.\n\
    \n```\nsummary(bayesian_model)$fixed[%>%\nrownames_to_column(var = \"parameter\"\
    ) %>%\nhead(n = 3) %>%\nglimpse()\n# Rows: 3\n# Columns: 8\n$ parameter <chr>\
    \ \"Intercept\", \"day_of_week.L\", \"day_of_week.Q\"\n$ Estimate <dbl> 886.7250835,\
    \ -0.04239118, -0.16213817\n$ Est. Error <dbl> 145.09866, 10.1293, 0.10790\n$\
    \ L-95% CI <dbl> 576.67263, -19.85932, -19.61945\n$ U-95% CI <dbl> 1137.71086,\
    \ 20.30390, 19.72001\n$ Rhat <dbl> 1.000109, 1.000764, 1.000761\n$ Bulk_ESS <dbl>\
    \ 5660.295, 5486.962, 5309.553\n$ Tail_ESS <dbl> 3204.207, 2641.086, 2846.849\n\
    ```\n\nThe model output tells us the convergence of the chains, the posterior\
    \ distribution of the parameters, and the model statistics. We can see the mean,\
    \ median, and 95% credible intervals for the regression coefficients, as well\
    \ as the standard deviation of the error term. The Rhat statistic measures the\
    \ convergence of the chains, with values close to 1 indicating convergence. The\
    \ n_eff statistic measures the effective sample size of the chains, with higher\
    \ values indicating more reliable estimates. The Loic statistic is the leave-one-out\
    \ cross-validation information criterion, which measures the model's predictive\
    \ performance.\n\nOr access the formula used in the model:\n\n```\nbayesian_model$formula\n\
    # I - day_of_week + week_of_year + month + lag_1_cases + lag_7_cases\n```\n\n\
    After fitting the model, we can plot the diagnostics to assess its performance\
    \ with the plot() function. The diagnostics trace plots of the chains, density\
    \ plots of the posterior distributions, and the chains. The Gelman-Rubin statistic\
    \ measures the convergence of the chains. The Gelman-Rubin statistic should be\
    \ close to 1 for the model to have converged.\n\n```\n# Plot the model diagnostics\n\
    plot(bayesian_model)\n```"
  merge: -1
  img_proc: true
