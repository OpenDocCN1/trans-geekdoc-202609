  md: "242\n\nCOVID-19 Outbreaks\n\n```\ncv_wkf <- workflow_set(\n  preproc = list(id\
    \ = cv_recipe),\n  models = list(Decision_tree = cart,\n  Random_Forest = rand_forest,\n\
    \  Knn = knn,\n  SVM = svm))\n```\n\n```\ncv_wkf\n# # A workflow/table: 4 x 4\n\
    # wflow_id      info    option result\n# <chr>         <list> <list> <list>\n\
    # 1 id_Decision_tree tibble [1 x 4] <opts[0]> <list [0]\n# 2 id_Random_Forest\
    \ tibble [1 x 4] <opts[0]> <list [0]\n# 3 id_Knn         tibble [1 x 4] <opts[0]>\
    \ <list [0]\n# 4 id_SVM         tibble [1 x 4] <opts[0]> <list [0]\n```\n\nCreate\
    \ a workflow_map() to fit the models to the training data. We use the `finetune`\
    \ package to tune the `race_anova` function to tune the hyperparameters of the\
    \ models. The `race_ctrl` object specifies the control parameters for the tuning\
    \ process, such as the number of resamples and the grid size. The `parallel_over`\
    \ argument allows the tuning process to run in parallel over multiple cores for\
    \ faster computation.\n\n```\n# Fit the models to the training data\nlibrary(finetune)\n\
    set.seed(112233)\nrace_ctrl <-\n  control_race(save_pred = TRUE,\n  parallel_over\
    \ = \"everything\",\n  save_workflow = TRUE)\n```\n\n```\nrace_results <- cv_wkf\
    \ %>%\nworkflow_map(\"tune_race_anova\",\n  seed = 1503,\n  resamples = cv_folds,\n\
    \  grid = 3,\n  control = race_ctrl)\n```\n\n```\nrace_results\n# # A workflow/table:\
    \ 4 x 4\n# wflow_id      info    option result\n# <chr>         <list> <list>\
    \ <list>\n# 1 id_Decision_tree tibble [1 x 4] <opts[3]> <race[+]\n# 2 id_Random_Forest\
    \ tibble [1 x 4] <opts[3]> <race[+]\n# 3 id_Knn         tibble [1 x 4] <opts[3]>\
    \ <race[+]\n# 4 id_SVM         tibble [1 x 4] <opts[3]> <race[+]\n```\n\nThen\
    \ we collect the metrics for the models to evaluate their performance. We filter\
    \ the results for the root mean squared error (rmse) and arrange them in ascending\
    \ order to identify the best-performing model.\n\n```\nrmse <- collect_metrics(race_results)\
    \ %%\nfilter(.metric == \"rmse\") %%>%\n```"
