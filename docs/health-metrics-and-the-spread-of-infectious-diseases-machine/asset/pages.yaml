- pgno: 31
  md: 'The History of Health Metrics 13


    # Table 2.1 Health Metrics Overview


    | Metric | Purpose | Focus | Usage | Calculation |

    | --- | --- | --- | --- | --- |

    | QALY (Quality-Adjusted Life Year) | Measures benefits of interventions combining
    quantity and quality of life | Health gains from interventions | Used in cost-effectiveness
    studies, resource allocation, and insurance | Calculated by adjusting years gained
    for quality of life (e.g., 1 year at half quality = 0.5 QALY) |

    | DALY (Disability-Adjusted Life Year) | Measures burden of disease by capturing
    premature death and disability | Health loss due to disease and disability | Used
    in public health to understand and compare burden globally | Calculated by summing
    years lost (YLL) and years lived with disability (YLD) |

    | HALY (Health-Adjusted Life Year) | General measure combining quantity and quality;
    similar to QALY but common | Health gains or losses from interventions or impact
    | Used similarly to QALY, though frequently in decision-making | Calculated by
    adjusting life years for health quality; similar to QALY |

    | HALE (Healthy Life Expectancy) | Estimates life expectancy adjusting for disability
    and illness | Overall healthy expectancy at a population level | Primarily used
    in population health and public health reports for expectancy | Calculated by
    adjusting total life expectancy based on age-specific disability prevalence |

    | HLY (Health Years) | Measures additional health years expected, often from a
    specific age | Healthy expectancy focused on aging populations | Used in geriatric
    health assessments and interventions for ageing populations | Typically calculated
    by estimating additional years of good health beyond a baseline age |

    | WAHE (Well-Adjusted Health Expectancy) | Incorporates overall physical and subjective
    well-being for life expectancy in ''full health'' | Overall life expectancy and
    well-being and mental health well as physical health | Applicable for holistic
    health assessments, incorporating quality of life and mental wellness | Calculated
    by weighting health to reflect impact on well-being and quality of life |


    For example, an organisation focusing on elder care policy might use HLYs to measure
    program impact on older adults specifically, while a global health agency might
    prefer HALE for its applicability to general population health across all ages.


    HLY is typically calculated by subtracting the number of years lived with disability
    life expectancy at birth. The resulting figure represents the number of years
    an individual can expect to live in good health, free from significant health-related
    limitations. Unlike life expectancy, which focuses solely on the length of life,
    HLY incorporates measures of the quality of life by considering the impact of
    health conditions on individuals'' ability to engage in daily activities and maintain
    independence.'
