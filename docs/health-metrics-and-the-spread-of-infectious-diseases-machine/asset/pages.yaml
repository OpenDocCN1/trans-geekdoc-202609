  md: '# Machine Learning Models


    +   - **Description**: Finds the hyperplane that best separates the classes in
    the feature space. The formula represents the decision boundary, where w is the
    weight vector and b is the bias.


    # K-Nearest Neighbors (KNN)


    +   - **Formula**: $\hat{y} = \frac{1}{k} \sum_{i=1}^{k} y_i$


    +   - **Description**: Classifies a data point based on the majority class among
    $k$ nearest neighbors. For regression, it predicts the average of the $k$ nearest
    neighbors'' values.


    # Naive Bayes


    +   - **Formula**: $P(Y|X) = \frac{P(X|Y)P(Y)}{P(X)}$


    +   - **Description**: Assumes independence between predictors. It uses Bayes''
    theorem to predict the probability of a class given the predictors.


    # Principal Component Analysis (PCA)


    +   - **Formula**: $Z = X$


    +   - **Description**: Reduces the dimensionality of the data by transforming
    the original variables into new uncorrelated variables (principal components),
    ordered by the amount of variance they capture.


    # K-Means Clustering


    +   - **Formula**: $\arg \min_{S} \sum_{i=1}^{k} \sum_{x \in S_i} ||x - \mu_i\|^2$


    +   - **Description**: Partitions the data into clusters by minimizing the sum
    of squared distances between the data points and the cluster centroids $\mu_i$.


    # Neural Networks


    +   - **Formula**: $a^{(l)} = \sigma(z^{(l)}) \n z^{(l)} = W^{(l)}a^{(l-1)} +
    b^{(l)}$


    +   - **Description**: Composed of layers of interconnected nodes (neurons). Each
    neuron''s output is a weighted sum of its inputs passed through an activation
    function $\sigma$. The parameters $W^{(l)}$ and $b^{(l)}$ are the weights and
    biases of layer $l$.'
