- pgno: 181
  md: '# 10

    Introduction to Data Visualisation


    Data visualisation is a powerful tool for transforming complex datasets into clear
    and insightful graphical representations. It plays a central role in Exploratory
    Data Analysis (EDA), helping to reveal important patterns, trends, and hidden
    insights that are often obscured in raw data. The information contained within
    data highlights important patterns and trends, and uncover hidden insights that
    might not be apparent from raw data alone. In the context of health metrics and
    infectious diseases, data visualisation plays a critical role in tracking disease
    outbreaks, understanding health trends, and communicating findings to policymakers
    and the public.


    We have already seen how to create various types of plots using the {ggplot2}
    package. In this chapter, we will discuss the history and evolution of data visualisation,
    delve deeper into the topic, introducing the concept of the Grammar of Graphics,
    exploring techniques for customising plots, adding annotations, labels, and themes,
    and creating interactive visualisations.


    # 10.1 History of Data Visualisation


    The history of data visualisation spans centuries. The roots of data visualisation
    can be traced back to ancient times with rudimentary visual representations, but
    its modern form began to take shape with the growth of statistics and graphical
    methods in the 17th and 18th centuries. One notable milestone was the publication
    of William Playfair’s “Commercial and Political Atlas” in 1786, which introduced
    innovative graphical techniques like the line graph, bar chart, and pie chart.


    Throughout the 19th and 20th centuries, pioneers such as Florence Nightingale
    (1820-1910), John Snow (1813-1858), and Jacques Berlin advanced the field, using
    visualisations to communicate complex data and uncover insights with Semiology
    of Graphics - 1967.


    Data visualisation was largely done manually or with the help of basic plotting
    tools. One example are the hand-drawn visualisations by W.E.B. Du Bois (1868-1963)
    in the early 20th century to illustrate the social and economic conditions of
    African Americans in the United States. These visualisations are now considered
    iconic examples of data visualisation and have been widely studied and digitally
    reproduced.


    # The Digital Revolution


    The digital revolution of the late 20th century, with the advent of powerful computing
    technologies, enabled the creation of interactive and dynamic visualisations.
    Every programming


    > ¹=William Playfair,” March 9, 2025, https://en.wikipedia.org/w/index.php?title=William_Playfair&coldi=1279753846.'
