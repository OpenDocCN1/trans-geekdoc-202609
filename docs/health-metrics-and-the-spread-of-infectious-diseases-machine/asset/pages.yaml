  md: "# HALE Calculation\n\n# 33\n\n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_51_0.png)\n\
    \nFigure 3.5 HALE - GLOBAL HEALTH METRICS VOLUME 392, ISSUE 10159, P1859-1992,\
    \ NOVEMBER 10, 2018\n\n# ### 3.5.0.1 Simulating Life Table Data\n\nTo understand\
    \ the process of calculating HALE, we can simulate life table data. We'll define\
    \ age intervals (e.g., every 5 years) and simulate survival probabilities for\
    \ each age interval (between 0 and 1).\n\n```\nset.seed(040424)\nage_intervals\
    \ <- seq(0, 100, length(age_intervals),\nsurvival_probabilities <- runif(length(age_intervals),\n\
    \               min = 0.5, max = 1)\n```\n\n```\nlife_table <- data.frame(\nAge\
    \ = age_intervals,\nSurvival_Probability = survival_probabilities,\nLX = 100000\
    \ - (age_intervals * survival_probabilities))\n```\n\n```\nlife_table%% head(\n\
    # Age Survival_Probability               nLX\n# 1 0                       0.5579497\
    \ 100000.00\n# 2 5                       0.9241893 99995.38\n# 3 10          \
    \            0.8810716 99991.19\n# 4 15                      0.9562922 99985.66\n\
    # 5 20                      0.6927314 99986.15\n# 6 25                      0.5607453\
    \ 99985.98\n```\n\nWe calculate adjusted $T_x$ for each age group as the sum of\
