    # A.3 Collecting Data with APIs


    Collecting data for research analysis involves selecting sources and methods to
    optimize computational time when downloading and reading files. Once the data
    are prepared and ready to use, an additional step is required to make them suitable
    for the selected model. The source of the data is a critical variable. Generally,
    data can be downloaded using an API (application programming interface), which
    allows users to access data directly from the source through back-end computations.


    There are alternatives to using an API: data can be downloaded directly to a computer
    or loaded through library packages. Available files are usually provided in various
    formats, such as delimited files (.csv), spreadsheets (.xls), JSON files (.json),
    and others. Below is an example of how to use an API to download a file directly
    to your computer.


    ```

    library(httr)

    url <- ""

    httr::GET(url = url)

    ```


    # A.3.1 Download Data with APIs


    # A.3.1.1 IHME Data APIs


    Head over https://ghdx.healthdata.org/ihme-api to get access to the IHME API’s
    page. The page provides IHME APIs for Sustainable Development Goals (SDG) data.
    Then, click on https://api.healthdata.org/sdg to login and request an API key.
    More information on the methodology and data can be found at https://www.gatesfoundation.org/goalkeepers/report/2024-report-data-sources/#ExploreTheData.


    Load necessary libraries:


    ```

    library(httr)

    library(jsonlite)

    library(tidyverse)

    ```


    The IHME API provides the following queries. These queries may be updated in the
    future, so it is important to check the API documentation for the most recent
    queries.


    +   - SDG Query Input:

    - GetGoal

    - GetIndicator

    - GetTarget

    - GetLocation

    - GetAgeGroup

    - GetScenario'
