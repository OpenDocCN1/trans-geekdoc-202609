    **Figure 15.7** Ensemble Predictions of COVID-19 Cases


    Finally, we can combine the predictions of the models using the {stacks} package
    to create an ensemble model. The stack() function combines the predictions of
    the models using a meta-learner, such as a linear regression model, to produce
    a final prediction.


    ```

    cv_stack <- stacks() %%

    add_candidates(race_results)

    cv_stack

    # # A data stack with 4 model definitions and 5 candidate members:

