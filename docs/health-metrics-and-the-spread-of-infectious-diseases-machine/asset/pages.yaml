    # ## A.1 Life Tables and Life Expectancy


    Back in the 1700s the Swiss mathematician and physicist Daniel Bernoulli (1700
    - 1782) developed the use of a life table model by differentiating life tables
    based on specific causes of death.\¹


    Originally made by the English scientist John Graunt (1620-1674), for the analysis
    of the mortality of the population of London and the impact of different diseases.
    Life tables contain fundamental statistics for the calculation of probabilities
    of deaths and the computation of life expectancy at birth and at different ages.


    ![](img/6b61f0d3dcab44c60cdfe4e888d549c9_309_0.png)


    **Figure A.1** “Life tables", William Farr (England 1859)


    # ### A.1.1 Life Tables Components


    More recent life tables are standardized to be used for a population of 100 000
    at age 0.


    ```

    $l_x$ survivors at age $x$ it starts with a value of 100 000

    $d_x$ deceased at age $x$

    $q_x$ probability of deaths

    ```


    > ¹Life Table - an Overview | ScienceDirect Topics”, n.d., https://www.sciencedirect.com/topics/medicine-and-dentistry/life-table.


    DOI: 10.12101/9781032625935-A 291'
