- pgno: 75
  md: '# Risk Measures


    A particular health condition can have multiple causes (co-morbidities) and risk
    factors. For instance, a poverty status and the lack of access to healthcare facilities,
    is proven to increasing the risk of infectious diseases, while poor diet and physical
    inactivity can increase the risk of chronic diseases. Acting in favor of addressing
    the underlying causes and risk factors for diseases and injuries is crucial for
    public health interventions and can help reduce the overall burden of disease.


    # 5.2 Risk Measures


    In health metrics, risk refers to the likelihood that an individual will experience
    a specific health outcome, such as illness or injury, due to certain behaviours,
    exposures, or conditions. Risk factors are variables that increase the probability
    of developing a particular health condition or experiencing an adverse health
    outcome; they are measurable probabilities influenced by factors like lifestyle
    (e.g., smoking or diet), environmental exposures (e.g., air pollution), or underlying
    health conditions.


    To provide a comprehensive framework for assessing the burden of different risk
    factors on population health and to guide effective public health strategies to
    mitigate these risks, key measures are used to assess risks and their impact on
    health outcomes:


    +   * Risk-specific exposures

    * Relative risks (RRs)

    * Theoretical Minimum-Risk Exposure Levels (TMRELs)

    * Population Attributable Factors (PAFs)


    # 5.2.1 Risk-Specific Exposures


    The quantification of risks and causes involves the evaluation of a set of behavioural,
    environmental and occupational, and metabolic risks. Risks of risk-outcome are
    investigated based on observations and statistical evidence. Convincing evidence
    provides plausible associations between exposure and disease in terms of size,
    duration and effects. Common examples of risk factors in health metrics include
    smoking, physical inactivity, high blood pressure (hypertension), and others.


    Risk combinations can be additive (the occurrence of at least one event, A or
    B), multiplicative (the occurrence of two events, A and B) or interactive, to
    influence other pairs, this action is generally identified as possible confounding,
    to be distinguished by factors in the causal pathway between exposure and outcome.


    To have an idea of the impact of different risk factors on a cause of illness,
    the Socioodemographic Index (SDI) provides insights into the potential magnitude
    of social, cultural and demographic factors looking at the risk exposures and
    possible paths for policy interventions. The life expectancy is closely correlated
    to the level of the SDI index as it is based on average income per person, educational
    attainment, and total fertility rate (TFR). Higher SDI values typically indicate
    better socio-economic conditions, including improved access to healthcare, education,
    and sanitation, which can mitigate various health risks. Conversely, lower SDI
    values are associated with higher risk exposure due to limited access to healthcare,
    poorer living conditions, and other socio-economic challenges. An application
    of the SDI index on time series is on Chapter 9.'
