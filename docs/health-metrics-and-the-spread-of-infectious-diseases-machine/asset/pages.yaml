    \ \"Date\", y = \"N. deaths\")\n```\n\n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_95_0.png)\n\
    \n+   (a) Deaths due to Cholera in London (June to August 1849)\n\n+   (b) Deaths\
    \ due to Cholera in London (January to August 1849)\n\n**Figure 6.4** Deaths due\
    \ to Cholera in London (1849)\n\nIn the case of Cholera1849, and in the context\
    \ of infectious diseases, the trend typically starts at a certain point, then\
    \ increases to reach a peak—the highest level of infection spread—before eventually\
    \ decreasing back to the initial level. This pattern is inherently non-linear.\n\
    \nTo visualise both linear and non-linear trends we can use a `smooth()` function,\
    \ with method = \"lm\" for linear model and method = \"gam\" for applying a general\
    \ additive model.\n\n```\nggplot(cholera, aes(x = date, y = deaths)) +\n  geom_line()\
    \ +\n  geom_smooth(method = \"lm\", se = F) +\n  geom_smooth(method = \"gam\"\
    , se = \"darkred\")\n```\n\n# 6.3.1.1 GAM - Generalised Additive Model\n\nThe\
    \ purpose of creating a model is to identify patterns within a series of observations.\
    \ This requires the model to interpolate given observations in order to represent\
    \ the overall pattern accurately. For instance, in the visualisation above, the\
    \ blue line with the `smooth_()` function, helps us visualise the direction of\
    \ a linear pattern in the data. However, it's evident that the data points form\
    \ a bell-shaped curve of deaths over time, indicating a non-linear relationship\
    \ between cholera and deaths. In the second layer we use method=\"gam\", **Generalised\
    \ Additive Models (GAMs)** flexible extensions of linear models, the most suitable\
    \ choice for this data is to model non-linear relationships between the response\
    \ and predictor variables. They are particularly useful when the relationship\
    \ between the variables is complex and cannot be adequately captured by linear\
    \ models.\n\n```\n$g(\\mu) = \\beta_0 + f(x)$\n```\n\n> 7More about data visualisation\
    \ techniques are in chapter 10."
