    These diseases are transmitted through various means and can be grouped by transmission
    methods:


    +   * Vector-Borne: Dengue, Malaria, West Nile Virus, and Zika are primarily spread
    by mosquito bites.

    * Respiratory Droplets: ARI, COVID-19, and Influenza/Influenza/ILI are transmitted
    via respiratory droplets when infected individuals cough or sneeze.


    # 14.2 Mathematical Models for Infectious Diseases


    The application of mathematical models to infectious diseases dates back over
    a century, with significant contributions from pioneers such as Kermack and Kendrick,
    who established the foundations of the subject.³ Their work introduced the concept
    of categorising individuals based on their epidemiological status: susceptible,
    infected, and recovered.


    # 14.2.1 The SIR Model


    One of the simplest and most fundamental epidemiological models, the SIR model,
    to which we had a quick look in the previous chapters (Chapter 6 and Chapter 7),
    is based on these three compartments and uses a system of differential equations
    to describe how individuals move between these compartments on infection rate
    and the recovery rate. These parameters help predict the epidemic''s progression,
    showing how the number of susceptible individuals decreases as the number of infected
    individuals increases, eventually leading to recovery and a decline in new infections,
    as shown in Equation 6.1.


    More complex models include:


    +   * SEIR Model: This model introduces an exposed (E) compartment, representing
    individuals who have been infected but are not yet infectious. This compartmentalization
    is particularly useful for diseases with significant incubation periods (e.g.,
    COVID-19). Practical applications are in Section 6.3.2 and Section 15.3.

    * SIS Model: In this model, individuals who recover from infection do not gain
    immunity, meaning they return to the susceptible class and can become reinfected.

    * MSIR Model: In some diseases, such as measles, maternal antibodies provide temporary
    immunity to newborns. The M (maternal immunity) compartment is used in such cases.


    > ³M. J. Keeling and L Danon, “Mathematical Modelling of Infectious Diseases,”
    British Medical Bulletin 92, no. 1 (December, 2009): 33–42, doi:10.1093/bmb/ldp038.'
