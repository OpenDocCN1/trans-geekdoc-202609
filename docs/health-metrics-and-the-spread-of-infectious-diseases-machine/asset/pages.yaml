- pgno: 244
  md: '# Introduction to Infectious Diseases


    unique incubation period, which is the interval between the initial establishment
    of the pathogen in the host and the onset of symptoms.


    The incubation period can range from a few hours to several months, influenced
    by factors such as the pathogen''s growth rate, the host''s immune response, and
    the route of transmission. For example, the incubation period for the influenza
    virus is typically 1 to 4 days, whereas for diseases like hepatitis B, it can
    be as long as 6 months. The incubation period helps in identifying the time frame
    for potential exposure.


    Several factors influence an individual''s susceptibility to infection, including:


    +   - Infection dose (quantity of invading germs)

    - Virulence (the ability of the organism to cause disease)

    - Immune status (the condition of the body''s immune system)

    - Transmission route (contact with the source of infection for contagious diseases)


    ![](img/6b61f0d3dcab44c60cdfe4e888d549c9_244_0.png)


    Figure 14.1 Pathogens and humans have co-evolved over centuries, each adapting
    in response to the other. This ongoing adaptation shapes the future of health
    and disease.


    Viruses, word derived from the Latin word for “poisonous substance”, are intracellular
    parasites that can only replicate within living host cells. Their sizes range
    from 20 to 400 nm in diameter and can only be observed with an electron microscope.
    Outside of a living cell, a virus is a dormant particle of various shapes. Once
    inside a cell, it replicates, often killing the cell or altering its functions.


    The following seven diseases are all caused by an infectious agent such as virus
    or bacteria, generally cause acute symptoms, ranging from mild to severe, and
    require prompt medical attention to prevent complications and further spread:


    +   - Acute Respiratory Infection (ARI)'
