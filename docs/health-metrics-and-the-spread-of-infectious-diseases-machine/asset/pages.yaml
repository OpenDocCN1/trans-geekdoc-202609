    The concept of health metrics can be traced back to ancient civilizations where
    observations on life, experience, birth rates, and mortality were made. However,
    these were often anecdotal and lacked system.


    In the 17th century, John Graunt, an English haberdasher, made significant contributions
    to health metrics in 1662, Natural and Public Observations Made upon Deaths in
    London. Graunt''s work laid the foundations of demography, introducing expectancy
    and mortality rates.


    The 19th century saw the development of life tables, a systematic approach to
    analysing mortality and life. This period marked a transition from descriptive
    observations to more structured records in health metrics.


    QALYs, another important health metric, emerged in the late 20th century, combining
    both the quality and quantity of life commonly used in economics and healthcare
    decision-making.


    A significant milestone in contemporary health is the Global Burden of Disease
    (GBD) Study started in 1990. J. L. Murray and Alan D. Lopez, this collaborative
    effort between Health organisation and World Bank aimed to quantify the impact
    of diseases and injuries on global health.


    The GBD DALYs as a metric in 1990: years of life lost to disease and mortality
    years became more sophisticated through a comprehensive methodology. Real-time
    tracking, machine learning, and global databases contribute to a more dynamic
    understanding of population health.


    With advancements in technology, including computing power and data analytics,
    health metrics have become more sophisticated. Three datasets track various social
    determinants of health.


    Today, health metrics encompass a wide range of measures, traditional mortality
    rates, disease prevalence, and broader indicators. They play crucial roles in
    shaping public health policies, interventions, and global health assessments.


