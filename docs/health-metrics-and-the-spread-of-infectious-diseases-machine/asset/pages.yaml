    # 16.3 Example: Simulating Malaria Transmission Dynamics


    In this example, we will use data for Malaria positive cases in Nigeria from the
    **Malaria Atlas Project** to evaluate the transmission dynamics using a simple
    mathematical model. We will use machine learning to predict future trends.


    To illustrate the modelling and prediction process we will use the `{caret}` package,
    which provides a unified interface for training and evaluating machine learning
    models. We will train a Random Forest model to predict future trends in malaria
    transmission based on historical data.


    ```

    niger_cases <- nigeria_data %%

    group_by(year_start) %%

    reframe(positive = sum(positive)) %%

    rename(year = year_start) %%

    drop_na() %%

    select(year, positive)

    ```


