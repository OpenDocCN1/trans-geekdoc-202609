  md: "# Predictive Modelling and Beyond\n\n```\ncomponents(dcmp) |> fabletools::autoplot()\n\
    \ncomponents(dcmp) |>\nas_tssible() |>\nautoplot(value) +\nge_line(aes(y = trend),\n\
    \  linetype=\"dashed\") +-\nlabs(title = \"Trend line of SDI in France\")\n```\n\
    \nSTL decomposition\nvalue = trend + remainder\n\n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_162_0.png)\n\
    \n(a) Components of SDI in France\n\n(b) Trend line of SDI in France\n\n9.5 Autocorrelation\
    \ of SDI in France\n\n# 9.4.2 Autocorrelation and Stationarity\n\nAutocorrelation\
    \ is very important in time series analysis as it explains whether past values\
    \ influence values. If a variable today is similar to what was yesterday or last\
    \ month, we say it has autocorrelation at lag 1 or k.\n\n```\n$r_k = \\frac{\\\
    sum_{t=k+1}^{T}(y_t - \\bar{y})(y_{t-k} - \\bar{y})}{\\sum_{t=1}^{T}(y_t - \\\
    bar{y})^2}$\n```\n\nwhere:\n\n+   * $r_k$ is the autocorrelation coefficient at\
    \ lag $k,\n* $y_t$ is the value of the time series at time $t$,\n* $\bar{y}$ is\
    \ the mean of the series,\n* $T$ is the total number of time points.\n\nTime series\
    \ exhibit no autocorrelation, or no predictable relationship between observations\
    \ at different time points, are referred to as white noise series, where each\
    \ value is essentially a random draw from the same distribution, with constant\
    \ mean and variance, with no pattern recognition.\n\nOn the contrary, the presence\
    \ of autocorrelation, or statistically significant correlations between current\
    \ and past values, indicates the absence of white noise. This means the time series\
    \ has temporal structure, which can be modelled for prediction. For example, positive\
    \ autocorrelation suggests that (high) or (low) values tend to be followed by\
    \ similarly high (or (low)) values, while negative autocorrelation implies an\
    \ alternating pattern."
