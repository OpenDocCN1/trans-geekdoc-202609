  md: '# 3.2 YLDs Lived with Disability


    YLDs (Years Lived with Disability) measure the number of years a person lives
    with a disability due to a disease or injury. It is calculated by multiplying
    the prevalence of a condition by the disability weight, which reflects the severity
    of the disability.


    The key factor of disability weights (DW) is linked to the severity (mean of the
    range of health loss suffered to disease) of a non-fatal health condition due
    to disease or injury. DW ranges between 0 (equivalent to full health) and 1 (equivalent
    to death). The estimation of the disability weights is challenging and has been
    continuously shifting by modifying and adapting methodologies in various studies.
    The challenge is assigning disability weights to diseases with different levels
    of prevalence, such as cases with high prevalence and low severity. People’s experiences
    of the same condition can vary significantly, making it difficult to establish
    a Standardised weight that accurately reflects the global impact on quality of
    life. Furthermore, the results need to be reported to a year-based value.


    Moreover, the calculation of YLDs has been updated over the years, shifting from
    an incidence to prevalence-based approach. More in-depth analyses are in Chapter
    4; for now, we will show how types of calculations differ, but then we will focus
    on using the most updated approach based on values of prevalence estimated by
    the GBD2021, summarised in the hmm::incprev_stroke. This dataset specifically
    contains the estimated values for incidence and prevalence of stroke in the Global
    region for the years 2019 and 2021.


    # 3.2.0.1 Incidence-based Calculation


    # Standard Formula


    $YLD_i = 1 * DW * L$


    In Equation 3.2, $I$ is the incidence of the condition, $DW$ is the disability
    weight, and $L$ is the average duration of the condition. The incidence takes
    into account the number of new cases of a disease or health condition that occur
    in a population over a specific period. The disability weight reflects the severity
    of the health condition, and the average duration of the condition is the average
    length of time lives with the condition.


    # 3.2.0.2 Prevalence-based Calculation


    # Standard Formula


    $YLD_p = p * DW$


    In Equation 3.3, $p$ is the prevalence, $DW$ are the disability weights. While
    an incidence-based approach focuses on the number of new cases of a health condition,
    the prevalence-based approach considers the total number of cases in the population.
    The disability weight reflects the severity of the health condition and it is
    applied to the prevalence to calculate the YLDs, and the duration of the condition
    is not considered in the prevalence-based calculation.


    > 8Xiaoxue Liu et al., “Disability Weight Measurement for the Severity of Different
    Diseases in Wuhan, China,” Population Health Metrics 21 (May 2023): doi:10.1186/s12963-023-00304-y.'
