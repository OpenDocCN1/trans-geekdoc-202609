- pgno: 295
  md: '# Key Determinants of Health Metrics Variation


    # 17.2 Key Determinants of Health Metrics Variation


    Health metrics can vary significantly across countries due to a combination of
    factors that influence health outcomes. Some of the key determinants of health
    metrics variation include:


    +   - Healthcare Infrastructure and Access

    - Socioeconomic Status

    - Environmental Factors

    - Lifestyle and Behavioral Factors

    - Public Health Policies and Interventions

    - Cultural and Social Norms


    These determinants influence health outcomes and disease burdens in different
    populations, shaping the overall health profile of a country. The availability
    and quality of healthcare services, income level, employment status, and education,
    are strongly linked to health outcomes. Geographic factors, such as climate, also
    influence disease patterns; tropical regions may have higher rates of vector-borne
    diseases like malaria and for this reason we have higher DALYs due to these diseases.
    Countries that prioritize preventive health measures often see long-term benefits
    in population health metrics.


    # 17.3 Example: Years Lived with Disability (YLDs) due to Injuries


    The Global Burden of Disease (GBD) study provides detailed data on a wide range
    of health metrics, including Years Lived with Disability (YLDs) due to injuries.
    Consider non fatal outcomes, YLDs measure the impact of injuries on population
    health by quantifying the years lived with a disability caused by an injury. By
    comparing YLDs due to injuries across countries with different Sustainable Development
    Index (SDI) levels, we can identify disparities in injury-related health outcomes
    and inform public health interventions to reduce the burden of injuries.


    In this example we will use the GBD data to compare the Years Lived with Disability
    (YLDs) due to injuries for high, middle, and low Sustainable Development Index
    (SDI) countries from 1990 to 2020. Data are available on the GBD website at www.health-data.org,
    and we will use the `ggplot` package to create a line plot visualising the YLDs
    due to injuries by SDI level.


    ```

    ylds_indices %> head(3) %>% glimpse()

    # Rows: 3

    # Columns: 4

    # $ year               <int> 1990, 1990, 1990

    # $ sex_name           <chr> "Both", "Both", "Both"

    # $ location_name      <chr> "High SDI", "High-middle SDI", "Low SDI"

    # $ avg                <dbl> 0.861205, 0.943750, 0.530426

    ```


    > 1 For reproducibility a copy of the "injuries" are data stored on the GitHub
    Repository of this project (https://github.com/Fgazelloni/hmsidR) in the data/inst/extdata
    folder.'
  merge: -1
  img_proc: true
