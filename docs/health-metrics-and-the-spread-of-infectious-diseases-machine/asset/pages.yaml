  md: "# Example: Rabies\n\n```\nset_engine(\"glmnet\")\nsvm_p_spec <-\nsvm_poly(cost\
    \ = tune(),\n  degree = tune()) %%\nset_engine(\"kernlab\") %%\nset_mode(\"regression\"\
    )\n```\n\n```\nknn_spec <-\nnearest_neighbor(neighbor = tune(),\n  dist_power\
    \ = tune(),\n  weight_func = tune()) %%\nset_engine(\"knkn\") %%\nset_mode(\"\
    regression\")\n```\n\n```\nlibrary(rules)\nlibrary(baguette)\n# Combine workflows\
    \ into a workflow set\nworkflow_set <- workflow_set(preproc = list(scaled = rec1,\n\
    \  yeo_johnson = rec2),\n  models = list(linear_reg = linear_reg_spec,\n  svm\
    \ = svm_p_spec,\n  knn = knn_spec))\n```\n\n```\ngrid_ctrl <- -control_grid(save_pred\
    \ = TRUE,\n  parallel_over = \"everything\",\n  save_workflow = TRUE)\n```\n\n\
