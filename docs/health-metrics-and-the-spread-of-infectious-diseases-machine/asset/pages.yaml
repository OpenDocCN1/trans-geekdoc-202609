    # 12.4.7 Create a Raster of Temperature


    To visualise the temperature data on the map of the Central African Republic we
    create a raster template. The raster template has the same extent as the simulated
    infected locations and will be used to raster the temperature data. This means
    that the temperature data will be converted into a raster format, with each cell
    in the raster grid representing a specific temperature value. The rasterized temperature
    data will be visualised as a heatmap on the map, with warmer colours indicating
    higher temperatures.


    The raster template is created using the rast() function from the {terra} package,
    specifying the number of rows and columns, the minimum and maximum values for
    the x and y coordinates, and the coordinate reference system (CRS) of the raster.
    If you want to know more about the package, type terra.


    The raster template is to have 18 rows and 36 columns, with the x and y coordinates
    ranging from 11 to 28 and to 2 to 12, respectively.


    ```

    library(terra)

    raster_template <- terra::rast(nrows = 18, ncols = 36,

    xmin = 11, xmax = 28,

    ymin = 2, ymax = 12,

    crs = st_crs(df_sf)$projstring

    ```


    Rasterize the temperature data using the rasterize() function to convert the temperature
    data from the frame to a raster format based on the raster template. The temperature
    data are assigned to the raster cells based on the latitude and longitude coordinates.


    ```

    ctr_africa_raster <- rasterize(df_sf,

    raster_template,

    field = "temperature",

    fun = max)

    ```


    Before plotting the rasterized temperature data on the map of the Central African
    Republic, we need to convert the rasterized data to a data frame format. This
    will allow us to visualise the temperature data as a heatmap on the map. The rasterized
    data contains the temperature values for each cell in the raster grid, which are
    assigned based on the latitude and longitude'
