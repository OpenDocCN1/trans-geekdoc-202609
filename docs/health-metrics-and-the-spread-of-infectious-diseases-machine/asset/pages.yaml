    Then, calculate the proportion of the population affected by a specific level
    of severity considering the prevalence (and/or the incidence) multiplied by the
    severity levels.


    For instance, we use the inprev_stroke and the dw_stroke datasets to calculate
    the YLDs due to stroke, and have a look at how incidence and prevalence differ
    from each other.


    > Health metrics values can be expressed as numbers, percentages or rates:

    * If the prevalence of stroke is 1,541,506.96 for male with age between 34-39
    and it is expressed in means, it means there are approximately 1,541,507 individuals
    in the age group 35-39 who had a stroke.

    * If the prevalence of stroke is 0.58 for male with age between 34-39 and it is
    expressed in percent value (%), it means 0.58% of the population within that age
    range had a stroke.

    * If the prevalence of stroke is expressed as rate, it is the number of cases
    of stroke per 100,000 individuals in the population.

    Percentages and numbers are related by the size of the population in that age
    group. To convert between these forms, you need to know the total population in
    the age group.


    Let''s consider the numbers of incidence and prevalence, and assign them as separate
    vectors in a new dataset named inc_prev_stroke_5y. We use the pivot_wider() function
    to spread the data into a wider format, with the measure column as the key column
    and the val column as the value column.'
