- pgno: 318
  md: '# Tools Used to Make This Book


    This appendix provides a comprehensive guide to replicating the environment and
    code used in this book. To get started, you''ll need to install the R programming
    language along with RStudio IDE. Additionally, we''ll walk through the steps for
    setting up a Quarto book project, integrating it with GitHub for version control,
    and ensuring reproducibility with the {renv} package. This will allow you to restore
    the project''s environment exactly as it was during the book''s creation, ensuring
    that all code examples run seamlessly.


    # B.1 RStudio Installation


    First, you''ll need to download and install R and RStudio Desktop. You can do
    this by visiting the following link: RStudio Desktop Download.


    Quarto is the next-generation version of RMarkdown, designed for a wide range
    of publishing tasks, including creating notes, presentations, websites, and books.
    This book has been developed with Quarto, with the project versioned on GitHub.
    For more details on how to publish a Quarto book, refer to the official Quarto
    documentation.


    To set up your project:


    +   1. In RStudio, create a new project in a new directory.

    2. Enable Git for version control.

    3. Select "Quarto Book Project" as the project type. This will automatically generate
    a _quarto.yml file with the following structure:


    ```

    project:

    type: book

    ```


    +   4. To preview your book, use the terminal to run quarto preview. This command
    will generate a _book directory containing the compiled book files.'
  merge: -1
  img_proc: true
- pgno: 319
  md: "# How to Set Up This Project with Quarto\n\n# B.2.0.1 GitHub Useful Commands\n\
    \nYou can manage your project using GitHub directly from RStudio or via command\
    \ line. To connect your project with GitHub:\n\n+   After creating your project,\
    \ initiate a Git repository with:\n\n```\ngit init\ngit remote add origin https://github.com/username/your-repo.git\n\
    ```\n\n+   Commit your files and push them to the GitHub repository:\n\n```\n\
    git branch -M main\ngit push -u origin main\n```\n\n# B.2.0.2 Publish Your Book\
    \ on GitHub Pages\n\nTo publish your Quarto book on GitHub Pages:\n\n+   Modify\
    \ the _quarto.yml file to specify the output directory as docs:\n\n```\n---\n\
    project:\n  type: book\n  output-dir: docs\n---\n```\n\n+   Add a .nojekyll file\
    \ to prevent GitHub Pages from ignoring files:\n\n```\ntouch .nojekyll\n```\n\n\
    +   Render your book with:\n\n```\nquarto render\n```\n\nThis command will create\
    \ a docs folder where the compiled book will be stored.\n\n# B.2.0.3 Adding a\
    \ Package\n\nIf you want to add a custom R package to your book project, follow\
    \ these steps:\n\n+   Create a new package using devtools:\n\n```\ndevtools::create(\"\
    yourpkg\")\n```\n\n+   Add raw data processing scripts:\n\n```\nusethis::use_data_raw()\n\
    ```\n\nThis command creates a .R script in the data-raw directory for processing\
    \ your data."
