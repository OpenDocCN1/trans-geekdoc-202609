- pgno: 143
  md: "# Model Framework Application Examples\n\n# 125\n\n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_143_0.png)\n\
    \n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_143_1.png)\n\n(a) Actual vs Predicted\
    \ Values\n\n(b) Actual vs Predicted Values Over Time\n\nFigure 8.6 H2O - GBM Model\
    \ Results on DALYs by Rabies\n\nOnce the simulation of the infected population\
    \ is done, the deep learning models act by by training social media data to predict\
    \ the probability of infection based on social media activity. The model results\
    \ are then used to adjust the SEIR parameters based on the predicted infection\
    \ status and re-run again on on new data.\n\n```\ninstall.packages(\"keras\")\n\
    keras3::keras(backend = \"tensorflow\")\n```\n\n```\nlibrary(keras)\nlibrary(deSolve)\n\
    library(ggplot2)\n```\n\nTo setup the SEIR compartments we start by defining the\
    \ differential equations built by considering the rates of change of each compartment\
    \ (S, E, I, R), the parameters (β, σ, γ), the initial state of the population\
    \ (N = 1000), and the length of time in days (t = 160). Finally the ode() function\
    \ is used to solve the differential equations and provide the output dataset.\n\
    \n```\nSEIR <- function(time, state, parameters) {\n  with(as.list(c(state, parameters)),\
    \ {\n    # Differential equations\n    dS <- -beta * S * I / N\n    dE <- beta\
    \ * S * I / N - sigma * E\n    dI <- sigma * E - gamma * I\n    dR <- gamma *\
    \ I\n    # Return the rates of change\n    list(c(dS, dE, dI, DR))\n  })\n}\n\
    ```\n\n```\n# Parameters\nparameters <- c(beta = 0.3, # Infection rate\n  sigma\
    \ = 0.2, # Incubation rate\n  gamma = 0.1 # Recovery rate\n)\n```\n\n```\n# Initial\
    \ state values\nN <- 1000\ninitial_state <- c(S = 999, E = 1, I = 0, R = 0)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 144
  md: "# Essential R Packages for Machine Learning\n\n```\n# Time points\ntimes <-\
    \ seq(0, 160, by = 1)\n# Solve the model\noutput <- ode(y = initial_state,\n \
    \             times = times,\n              func = SEIR,\n              parms\
    \ = parameters)\n```\n\n```\n# Convert output to a data frame\noutput <- as.data.frame(output)\n\
    ```\n\nThe social media data is simulated and consists of 100 individuals (n)\
    \ over 10 (p) days, with an infection vector, and 10 features (xi), including\
    \ social distancing adherence, mask usage (always, sometimes, never), hygiene\
    \ practices (times per day washing or sanitizing), work or study environment (remote\
    \ in-person), participation in gatherings (number of others attended), and contacting\
    \ status (to a confirmed case). All values are standardized obtained from a normal\
    \ distribution.\n\n```\nset.seed(123)\nn <- 1000 # number of samples\np <- 10\
    \ # number of features\n# Generate random features and labels\nsocial_features\
    \ <- matrix(rnorm(n * p),\n                           row = n, ncol = p)\ninfection_labels\
    \ <- sample(0:1, n, replace = TRUE)\n# Combine into a data frame\nsocial_data\
    \ <- data.frame(social_features,\nsocial_data$infection <- infection_labels\n\
    ```\n\n```\nsocial_data[1:4,c(1:3,11)]\n```\n\n| X1 | X2 | X3 | infection |\n\
    |---|---|---|---||\n| 1 | -0.5604765 | -0.9959782 | -0.5116037 | 0 |\n| 2 | -0.2301747\
    \ | -1.0399504 | 0.2369379 | 0 |\n| 3 | 1.5587831 | -0.0179802 | -0.5415892 |\
    \ 0 |\n| 4 | 0.07506589 | -0.1321753 | 0.2192726 | 1 |\n\nDefine the model using\
    \ the keras_sequential() function, and add layers with the layer_dense() and layer_activation()\
    \ functions. Each layer model will apply a transformation to the input data, and\
    \ the activation function will introduce non-linearity to the model.\n\nHere we\
    \ use a simple model with two layers and a ReLU and a Sigmoid as activation functions.\
    \ These functions have specific shapes that allow the model to learn complex patterns\
    \ in the data. Any time layer is done the output is passed to the next layer.\n\
    \nAlthough the layer_dropout() is not actually used in this application, it could\
    \ be added to the model as a layer that drops out results under specified requirements.\
    \ The function is used to prevent overfitting by randomly setting a fraction of\
    \ units to zero during training.\n\nThe model concludes with one more layer_dense()\
    \ with activation used to finally activate the output with a trained function.\
    \ In this case a sigmoid, but also a softmax function could be used."
