- pgno: 253
  md: "Example: Modelling the Spread of COVID-19\n\n# 15.3.1 SEIR Model\n\nFirst,\
    \ we use the SEIR model function to simulate the spread of the disease. The model\
    \ compartments are: number of susceptible (S), the exposed (E), the infected (I),\
    \ and R represents the number of recovered individuals. The parameters of the\
    \ model are the transmission rate (β) and the recovery rate (γ), (k_exp) the latent\
    \ period, and (N) is the total population.\n\n```\nlibrary(deSolve)\nlibrary(tidyverse)\n\
    # Define parameters\nN <- 16 # Total population\nbeta <- 0.5 # Transmission rate\n\
    gamma <- 0.1 # Recovery rate\nt_exp <- 5 Latent period - or incubation period\n\
    \n# Initial conditions\ninit <- c(S = N - 1, E = 1, I = 0, R = 0)\n\n# Define\
    \ the SEIR model\nseir_model <- function(t, y, parameters) {\n  with(as.list(y),\n\
    \    dS <- -beta * S * I / N\n    dE <- beta * S * I / N - (1 / t_exp) * E\n \
    \   dI <- (1 / t_exp) * E - gamma * I\n    dR <- gamma * I\n    return(list(c(dS,\
    \ dE, dI, dR)))\n  )\n}\n```\n\nAs previously, we use the ode() function from\
    \ the {deSolve} package to solve the ordinary differential equations (ODEs) and\
    \ simulate the spread of the virus over a period of 365 days:\n\n```\ntimes <-\
    \ seq(0, 365, by = 1)\nresult <- ode(y = init, times = times, func = seir_model)\n\
    head(result, n = 6)\n# time S E I R\n# [1] 0 99999.0 1.000000 0.000000 0.000000\n\
    # [2] 1 99999.9 0.861442 0.175097 0.0091308\n# [3] 2 99999.8 0.818671 0.316995\
    \ 0.0339232\n# [4] 3 99999.6 0.840094 0.444173 0.0720450\n# [5] 4 99999.4 0.921481\
    \ 0.562981 0.1269274\n# [6] 5 99999.1 1.042877 0.701588 0.1861446\n```\n\n```\n\
    ggplot(as.frame(result), aes(time = Time, color = \"Infected\")) +\ngeom_line(aes(y\
    \ = R, color = \"Recovered\")) +\ngeom_line(aes(y = S, color = \"Susceptible\"\
    )) +\nscale_color_discrete(name = \"Compartment\") +\\nlabs(x = \"Time (days)\"\
    , y = \"Number of individuals\")\n```"
  merge: -1
  img_proc: true
- pgno: 254
  md: "![](img/6b61f0d3dcab44c60cdfe4e888d549c9_254_0.png)\n\n**Figure 15.1** Simulation\
    \ of the SEIR model for COVID-19\n\nIn reality, the spread of a virus is much\
    \ more complex and influenced by many factors as human behaviour, government policies,\
    \ healthcare systems, vaccination campaigns, and human contact.\n\n# 15.3.2 Bayesian\
    \ Analysis\n\nThe use of **Bayesian analysis** in modelling infectious diseases\
    \ offers several advantages in understanding and predicting the dynamics of the\
    \ spread. We implement a Bayesian regression model for COVID-19 cases using the\
    \ {brms} package, which is an interface of **Stan** for Bayesian analysis. The\
    \ source for **Stan** is available at https://mc-stan.org/\n\nThe application\
    \ of Bayesian analysis allows us to estimate the regression coefficients for the\
    \ lag-1 and lag-7 cases, which can help predict the number of infected individuals\
    \ over time, with the flexibility to incorporate prior knowledge and uncertainties\
    \ into the model.\n\nThe model is specified as:\n\n```\nI_t ~ Normal(β × I_{t-1}\
    \ + γ × I_{t-7}, σ)\n```\n\nwhere $I_t$ is the number of infected individuals\
    \ at time $t$, $\beta$ is the regression coefficient for the lag-1 cases, $\\\
    gamma$ is the regression coefficient for the lag-7 cases, and $\\sigma$ is the\
    \ error term. The model assumes that the number of infected individuals at time\
    \ $t$ is normally distributed around the predicted value based on the number of\
    \ cases at times $t-1$ and $t-7$.\n\nWe can specify the prior distributions for\
    \ $\beta$ and $\\gamma$ by using expert knowledge and available data. For example,\
    \ we might use a gamma distribution with a mean of 0.1 and a standard deviation\
    \ of 0.05 for $\beta$, and a gamma distribution with a mean of 0.05 and a standard\
    \ deviation of 0.02 for $\\gamma$.\n\n```\nresult <- as.frame(result)\n```"
