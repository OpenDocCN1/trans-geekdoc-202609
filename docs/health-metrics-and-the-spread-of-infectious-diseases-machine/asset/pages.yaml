- pgno: 35
  md: '# YLLs Calculation


    Building on these ideas, Mary Demsey2 formalized the concept in 1947 to assess
    the burden of tuberculosis, coining the term Years of Life Loss (YLLs). This metric
    was specifically designed to identify areas requiring improvement to reduce loss
    and prevent premature death.3 Her work established YLLs as a critical tool for
    understanding and addressing the disproportionate effects of early mortality on
    population health.


    The impact of premature loss on society extends the grief of losing a loved one;
    it includes the economic and social cost of losing productive members of the workforce.
    whereas premature death leads to a significant burden on the community, affecting
    overall economic stability and societal well-being.


    # Standard Formula


    ```

    YLL = N * le (3.1)

    ```


    In Equation 3.1, N is the number of premature deaths, and le is the standard life
    expectancy at the age of death. This calculation takes into account the number
    of deaths at each age and multiplies it by the standard life expectancy remaining
    at that age, using global life tables to determine life expectancy. More details
    about the concepts of YLLs are provided in the next chapter (Chapter 4), and a
    sample of the construction of a life table with relative estimations of the life
    expectancy can be found in Appendix A.


    In general, the Global Burden of Disease studies (GBD) used standardised life
    tables, to consistently measure the impact of various diseases. This approach
    allows for reliable comparisons across different conditions and populations, providing
    a comprehensive assessment of disease burden on a global scale.4 Additionally,
    country-specific life expectancies are valuable for investigating premature deaths
    resulting from health-related causes, such as fatal diseases. For instance, certain
    types of country-specific life expectancies are frequently recommended to provide
    insight into longevity characteristics, which can inform policymakers and aid
    in prevention efforts, as exemplified by the Japanese life expectancy.5 A G7 cross-country
    study demonstrated that Japan has the longest life expectancy, primarily attributed
    to low mortality rates from ischemic disease and cancer, which are the leading
    causes of death in most countries, as indicated by the GBD study.


    # 3.1.1 Example: YLLs Due to Stroke


    Stroke can be a consequence of several infectious diseases, such as COVID-19,
    Tuberculosis (TB), and malaria. The impact of these diseases on the cardiovascular
    system can lead to stroke, as infections can cause inflammation, blood formation,
    or direct damage to brain vessels.


    In the following, we calculate the YLLs due to stroke in the year 2019 for the
    Global region. We use the Global Burden of Disease (GBD) study, which


