- pgno: 98
  md: "And this is explained by the variation of the predictors in time, the calculation\
    \ is a derivative.\nRecall that the derivative of a constant is 0, in our case\
    \ $\\beta_0$ is the constant.\n\n```\n$$\\frac{dy}{dt} = \\frac{d(\\beta_0 + \\\
    beta_1x)}{dt} = \\beta_1\\frac{dx}{dt}$\n(6.11)\n```\n\nThis equation describes\
    \ how $y$ changes with respect to time $t$, taking into account the rate of change\
    \ of $x$ with respect to time $t$, and the constant slope $\beta_1$ of the line.\n\
    \n```\n$y' = \\beta_1\\frac{dx}{dt}$\n(6.12)\n```\n\nThe Equation 6.12 will be\
    \ used in the model to describe how individuals move between compartments over\
    \ time.\n\nFor this example we use a package named {deSolve} which solves differential\
    \ equations.\n# Load required packages\nlibrary(deSolve) For solving differential\
    \ equations\n\nWe define a function for the SEIR model, and its parameters. $\\\
    beta$ is the transmission rate, $\\sigma$ the rate of latent individuals becoming\
    \ infectious, and $\\gamma$ the rate of recovery.\n\n```\nThen simulate starting\
    \ parameters by assigning a value to them.\nN <- 1000 # Total population size\n\
    beta <- 0.3 # Transmission rate\nsigma <- 0.1 # Rate of latent individuals becoming\
    \ infectious\ngamma <- 0.05 # Rate of recovery\n```\n\n```\nSet an initial state\
    \ and a vector, let's say 100 days.\ninitial_state <- c(S = N - 1, E = 1, I =\
    \ 0, R = 0)\n```\n\n```\n# Time vector\ntimes <- seq(0, 100, by = 1)\n```"
