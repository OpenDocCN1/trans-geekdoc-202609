- pgno: 50
  md: "# Methods and Calculations\n\nthe impact of both fatal and non-fatal outcomes\
    \ on overall life expectancy. HALE is\typically calculated using data on mortality\
    \ rates and health-related quality of life measures,\nsuch as disability-adjusted\
    \ years (DALYs) or quality-adjusted life years (QALYs). These\nmeasures allow\
    \ for the estimation of the number of years lost to premature death or\ndis.\n\
    \nIt can be used to identify health disparities, assess the effectiveness of healthcare\
    \ interventions,\nin inform public health policies. By measuring the number of\
    \ years lived in good health,\nHALE offers a more nuancing understanding of population\
    \ health rather than traditional life\nexpectancy measures.\n\n# Standard Formula\n\
    \n```\nHALE = life expectancy – YLD (3.7)\n```\n\nHALE is obtained by subtracting\
    \ the YLDs from the life expectancy of a population. However,\nin we consider\
    \ more specifications such as comorbidities and other health factors that can\n\
    occur in real life, the calculation can be adjusted by assuming different levels\
    \ of prevalence\nase on disease sequelae based associated disability weights,\
    \ and eventually accounting for\ncomorbidity levels by using a Monte Carlo simulation\
    \ approach.\n\nWe use age-specific mortality and YLDs per capita by location,\
    \ age, sex, and year, and\ndefine the HALE as:\n\n+   the average number of years\
    \ that a person at a given age can expect to live in good\nhealth, taking into\
    \ account mortality and loss of functional health.\n\nThe process of calculating\
    \ HALE for a specific population, considering factors such as sex,\ncountry, and\
    \ year, involves computing the average health of individuals across different\n\
    groups within the population and aggregating information on the various health\n\
    conditions and their associated disability weights. Comorbidity is addressed using\
    \ a Monte\nsimulation approach, assuming independence of comorbidities within\
    \ each age group.\nSimulations are conducted to model expose different health\
    \ conditions based on their\nestimated prevalence in each age group, resulting\
    \ in a simulated population reflecting the\nvalence of multi-morbidities.¹12\n\
    \nPositive health associated with each health condition is defined as one minus\
    \ the disability\nweight (1 – DW). The combined health for an individual in the\
    \ simulated population is\ndetermined by multiplying these positive values for\
    \ all relevant health conditions\npresent.\n\nThe average health values are computed\
    \ as one the Years Lived with Disability\n(YLD) (1 – YLD) per person in the population,\
    \ which are used to calculate health-adjusted\nperson years. The Sullivan method\
    \ is employed to incorporate these average health values\nto the life table. By\
    \ adjusting the values in the n life table by the\ncorresponding average health\
    \ values, recalculating the life table using these adjusted\nand then using an\
    \ iterative process to estimate health-adjusted person-years for\ndifferent groups.\n\
    \nFinally, HALE is calculated by dividing the adjusted person-years for each age\
    \ group by the\nportion of a hypothetical birth cohort alive at that age.\n\n\
    > ¹¹²Jeffrey Stanley et al. “Global, Recognition, and National Comparative Risk\
    \ Assessment of 84 Be-\nhaviorial, Environmental and Occupational, and Metabolic\
    \ Risks or Clusters of Risks for 199 Countries and\nTerritories, 1990–2017: A\
    \ Systematic Analysis for the Global Burden of Disease Study 2017,” The Lancet\n\
    392, no. 10159 (November 2018): 1923–94, doi:10.1016/s0140-6736(18)32225-6."
