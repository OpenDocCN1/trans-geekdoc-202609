  md: '# 2.1.1 Quality-Adjusted Life Years (QALYs)


    The concept of Quality-Adjusted Life Years (QALYs) emerged in the late 1970s,
    originating from the idea of combining both *quantity* and *quality of life* by
    Joseph S. Pliskin, then it became a widely used metric for evaluating the *cost-effectiveness
    of healthcare interventions*. One QALY corresponds to one year in perfect health,
    which ranges from 1 (perfect health) to 0 (dead). However, this metric, in various
    sectors such as health insurance, is criticised due to its lack of addressing
    disparities among individuals. It may result in discrimination against individuals
    with specific medical conditions or disorders.


    A controversial outcome emerged after 25 years of research and studies, raising
    concerns about the metric''s validity and inclusivity. Started in the early 1980s,
    the step in 2010 with the European Commission¹⁰ which started the largest-ever
    study dedicated to testing the assumptions of the QALY.¹¹¹ ending in 2013 with
    the recommendation "not using QALYs in healthcare decision making", arguing that
    patients with disabilities are valued less under a QALY-based system than individuals
    with no disabilities. This result has been further criticised and remains a topic
    of debate.


    > “Medicine cannot itself determine the quality of life. It can only help people
    to achieve the state of health that enables them to cultivate the art of life-but
    in their own way. This implies that the ability to enjoy the fundamental satisfactions
    of the biological de vie. It implies the ability for each person to do what he
    wants and become what he wants to, according to human values transcendent judgement”
    D.Dubes¹²


    Used in health to measure the value of medical interventions by balancing both
    the quantity and quality of life, QALYs help decision-makers determine which treatments
    or programs offer the greatest health benefits relative to their costs. For example,
    a health policy might prioritising treatments that deliver high QALYs per dollar,
    ensuring resources are allocated to maximise outcomes across the population. This
    approach guides decisions in healthcare budgeting, insurance coverage, and prioritising
    interventions for chronic illnesses, preventive care, or new therapies.


    # 2.1.2 Disability-Adjusted Life Years (DALYs)


    In the 1990s, the World Bank financed a study at Harvard University to develop
    a sustainable index that considered not only the status but also the level of
    disabilities caused by disparities. This led to a new way of calculating the overall
    health and life expectancy of different countries, released along with the Global
    Burden of Disease Study in 1990¹³ a project that introduced Christopher L. Murray¹⁴
    and Alan Lopez¹⁵


    ⁹Quality-Adjusted Life Year. December 27, 2023, https://en.wikipedia.org/w/index.php?title=Quality-adjusted_life_year&oldid=192202156.

    ¹⁰Echoeconom, October 2016, https://web.archive.org/w/201601080051353/http://echoeconom.eu/.

    ¹¹David Holmes, *Report Triggers Over Qalys, a Global Burden of Health Metrics*,
    Metric Nature (2013) 19, no. 3 (March) 1–8, doi:10.1038/00130348.

    ¹²Dubes, Thomas A, *Health and the Quality of Life*. Western Journal of Medicine,
    125, no. 1 (July 1991): 8–9, https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2327171/

    ¹³Murray, *The Global Burden of Disease in 1990: Results, Analysis and Future
    Directions*. Bulletin of the World Health Organization 72, no. 3 (1994): 495–509,
    https://www.ncbi.nlm.nih.gov/pmc/PMC2486716/

    ¹⁴Christopher J. Murray, January 2024, https://en.wikipedia.org/w/index.php?title=Christopher_L_Murray&oldid=192936044

    ¹⁵Alan Lopez, December 11, 2023, https://en.wikipedia.org/w/index.php?title=Alan_Lopez&oldid=119235406.'
