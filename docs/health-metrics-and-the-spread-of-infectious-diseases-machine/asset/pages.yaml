- pgno: 189
  md: '# Interpreting Model Results Through Visualisation


    Learning Objectives


    +   - Visualize predicted vs. observed values and assess residuals

    - Interpret model metrics with VIP, accuracy, and partial dependency plots

    - Create and customize ROC curves and compute AUC for classification models


    In the introduction to data visualisation (Chapter 10), we explored foundational
    techniques for effectively communicating model results and data insights through
    plots. We reviewed essential plots used to visualise predictions and outcomes,
    such as scatter plots, line graphs, and bar charts. The chapter also covered how
    to customise these plots using colours, palettes, legends, and guides to improve
    clarity and visual appeal. Additionally, we discussed how to craft data stories
    by organising multiple plots in a layout and saving them as image files for reports
    or presentations.


    In this chapter, which is an essential part of the data visualisation section,
    we focus on how to effectively interpret and use the results from machine learning
    models in the context of health metrics and infectious diseases.


    We will explore how to visualise the results of:


    +   - Regression models with a linear regression, and a generalized additive model
    (GAM)

    - Classification models with decision trees, and random forest models.


    # 11.1 Practical Insights and Examples


    The practise of visualising model results is essential for communicating insights
    from a model to stakeholders.


    Considerations for visualising model results include:


    +   - Understanding the data: Before visualising the results, it is important
    to understand the data and the model used. This includes the variables, their
    relationships, and the assumptions of the model.

    - Choosing the right visualisation: Different types of data and models require
    different types of visualisations. It is important to choose the right visualisation
    to effectively communicate the results.'
  merge: -1
  img_proc: true
- pgno: 190
  md: "# 11.1.1 Example: Deaths due to Meningitis\n\nData are from the **Institute\
    \ for Health Metrics and Evaluation (IHME)** and include **deaths due to meningitis**,\
    \ as well as two exposure levels of risk factors—particular matter (PM2.5) and\
    \ smoking—in the Sub-Saharan Africa (Central African Republic, Zambia, Eswatini,\
    \ Lesotho, and Malawi) from 1990 to 2021. The data are in the `{gmsidwR}` package\n\
    \n```\ninstall.packages(\"gmsidwR\")\n# or\n# install the development version\
    \ of book package\ndevtools::install_github(\"Fgazzelloni/gmsidwR\")\n```\n\n\
    Let's look at the first few rows of the data:\n\n```\n# Load libraries and data\n\
    library(tidyverse)\nlibrary(gmsidwR)\nmeningitis %>% head()\n# # A tible: 6 x\
    \ 6\n# year location\n# dbl <chr>\n# 1 1990 Eswatini 12.6 669. 5.91 55.0\n# 2\
    \ 1990 Malawi 52.7 3160. 7.57 78.7\n# 3 1990 Zambia 54.9 3101. 6.71 66.9\n# 4\
    \ 1990 Lesotho 10.1 541. 10.6 61.2\n# 5 1990 Central African Republic 33.7 2142.\
    \ 6.61 80.0\n# 6 1991 Zambia 55.4 3101. 6.71 66.6\n```\n\n**Meningitis** is a\
    \ serious global health concern generalised by inflammation of the membranes surrounding\
    \ the brain and spinal cord. It can arise from both infectious and noninfect causes\
    \ and is often associated with a high risk of mortality and long-term complications.\n\
    \nIn this example, we explore how environmental risk factors — **particulate matter\
    \ (PM2.5) and smoking** — may influence meningitis mortality. These variables\
    \ represent **aggregate exposure levels** that could potentially reduce meningitis-related\
    \ deaths.\n\nMeningitis death rates vary considerably across countries and over\
    \ time. To begin, we visualise how these have changed from 1990 to 2021 in Sub-Saharan\
    \ African countries. A scatter plot will show annual death rates by country, while\
    \ a smooth line will reveal the overall trend, helping to contextualize patterns\
    \ before moving to modelling.\n\n```\nmeningitis %>%\ngggplot(aes(x = year, y\
    \ = deaths)) + \ngeom_line(aes(group = location,\n              linetype = location))\
    \ + \ngeom_smooth() + \nlabs(title = \"Deaths due to Meningitis\",\n      subtitle\
    \ = \"1990 to 2021 in Sub-Saharan Africa\",\n      y = \"Death Rates\", x = \"\
    Time (Year)\") + \ntheme(legend.position = \"bottom\",\n      legend.position\
    \ = element_blank())\n```\n\n> 1-Meningitis, n.d., https://www.who.int/news-room/fact-sheets/detail/meningitis."
  merge: -1
  img_proc: true
