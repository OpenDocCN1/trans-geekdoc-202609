  md: '# 5


    # Causes and Risks


    Learning Objectives


    +   - Identify major causes of disease and associated risk factors using health
    data

    - Formulate clear and focused research questions for health outcomes analysis

    - Gain an introductory understanding of causal inference concepts and their application
    in public health research


    “…fear is the most pervasive emotion of modern society...”¹


    What qualifies as a risk is subject to dynamic social change², as well as the
    perception of risk has evolved over time, influenced by factors such as media
    coverage and sociopolitical dynamics.


    Historically, major risks included starvation, infections, and violent conflicts,
    while modern risks are often associated with lifestyle choices and chronic diseases
    such as obesity, cardiovascular disease, and cancer. Despite advancements in healthcare
    and increasing life expectancy in post-industrial countries, the focus often shifts
    to perceived threats like terrorism, global pandemics such as COVID-19, and environmental
    catastrophes. This shift is reflected in the increasing combination of quantitative
    analyses and public health interventions, tracking changes in risk-related discourse
    and identifying key risk topics over.


    Furthermore, tools like topic modelling and sentiment analysis help identify how
    the public perceives various risks and how these perceptions evolve over time.


    In the field of public health, the latest GBD results reveals significant insights
    into the causes and risks associated with health metrics and infectious diseases.
    The primary risks identified include behavioural, environmental, occupational,
    and metabolic factors.


    # 5.1 Conditions and Injuries


    Conditions and injuries associated with the burden of disease and injury vary
    according to specific cases and risks. In this book are risk factors includes:


    +   - Lifestyle choices: Poor diet, physical inactivity, tobacco use, and excessive
    alcohol consumption are major risk factors for chronic diseases and injuries,
    including heart disease, stroke, cancer, and liver disease.


    > ¹Joanna Bourke, Fear: A Cultural History (Capaput, 2007).


    > ²Ying Li. Thomas, and Ralph Hertwig, “A Brief History of Risk,” Cognition 203
    (October 2020): 104344, doi:10.1016/j.cognit.2020.104344.'
