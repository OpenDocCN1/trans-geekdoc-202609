  md: "# Practical Insights and Examples\n\n# Table 11.3 Model p-values\n\n| term\
    \ | p.value_mod1 | p.value_mod2 | p.value_mod3 |\n|---|---|---|--|\n| s(smoking)\
    \ | 0 | 7.69e-05 | 0.000000 |\n| s(pm25) | 0 | 0.00e+00 | 0.697803 |\n\nIn the\
    \ second model (mod2), both the smoking and PM2.5 have p-values below 0.05, indicating\
    \ that they are statistically significant predictors of meningitis mortality.\
    \ However, when incorporating temporal and spatial effects in mod3, the significance\
    \ of these exposure changes — most notably, PM2.5 is no longer statistically significant.\
    \ This shift suggests that the apparent association in the simpler model may be\
    \ confounded by trends or country-level differences, highlighting the importance\
    \ of accounting for structured variation in space and time.\n\nLet's use both\
    \ models to predict() function to obtain the predicted values for the model. The\
    \ predicted values are added to the original dataset as a new column called predicted.\n\
    \n```\nmeningitis$predicted_mod2 <- predict(mod2)\nmeningitis$predicted_mod3 <-\
    \ predict(mod3)\n```\n\n```\nggplot(meningitis,\n  aes(x = year, y = deaths, color\
    \ = location) +\n  geom_line() +\n  geom_line(aes(y = predicted_mod2),\n    linetype\
    \ = \"dashed\") +\n  facet_grid(location = ., scale = \"free\") +\\n  labs(title\
    \ = \"Meningitis Death Rates by Country\",\n    subtitle = \"Observed vs Predicted\"\
    ,\n    y = \"Death Rate\", x = \"Year\") + \n  theme(legend.position = \"none\"\
    )\n```\n\n```\nggplot(meningitis,\n  aes(x = year, y = deaths, color = location)\
    \ +\n  geom_line(aes(y = predicted_mod3),\n    linetype = \"dashed\") +\n  facet_grid(location\
    \ = ., scale = \"free\") +\\n  labs(title = \"Meningitis Death Rates by Country\"\
    ,\n    subtitle = \"Observed vs Predicted\",\n    y = \"Death Rate\", x = \"Year\"\
    ) + \n  theme(legend.position = \"none\")\n```\n\nWe can notice that the model\
    \ fits the data, with the predicted values closely following the observed values,\
    \ with mod3 slightly overfitting the data.\n\nLet's check the residuals of mod2:\n\
    \n```\nmeningitis %>%%\n  # calculate the residuals to see how well the model\
    \ fits the data\n  mutate(residuals = deaths - predicted_mod2) %>%\n  select(deaths,\
