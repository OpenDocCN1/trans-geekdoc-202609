    # 3.6 Summary


    In this chapter, we have detailed the methods and calculations for evaluating
    the burden of disease using key health metrics: YLLs, YLDs, and DALYs. By understanding
    how to compute these metrics, we gain insights into the impact of diseases and
    injuries on populations, guiding public health decisions and interventions. We
    also introduced HALE, a metric that combines mortality and morbidity data to provide
    a comprehensive measure of population health. These metrics are invaluable tools
    for public health practitioners, policymakers, and researchers in their quest
    to improve global health outcomes.


    As confront new global health challenges like pandemics, aging populations, and
    climate-related health risks, traditional metrics like DALYs and QALYs are evolving
    to meet new approaches to capture the complexity of health outcomes. The inclusion
    of well-being, resilience, and mental health is becoming increasingly essential
    to understanding the full impact of health conditions on individuals and populations.


    In the next chapter (Chapter 4), we will delve deeper into the components and
    variations of these metrics, further enhancing our understanding of how to utilise
    them effectively in public health assessments.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 4


    # Metrics Components


    Learning Objectives


    +   - Understand the construction and interpretation of life tables and rates
    to life expectancy measures

    - Analyse mortality levels and rates to assess population health dynamics

    - Distinguish between incidence and prevalence and their relevance in disease
    monitoring

    - Interpret disability weights and severity levels in the context of burden of
    disease estimation


    In Chapter 3, we discussed the importance of health metrics in assessing the overall
    health status of a population and guiding the allocation of health resources.
    We have seen how to calculate metrics by providing direct calculations of each
    of them, but haven''t discussed the components that make up these metrics. In
    this chapter, we will investigate: **life expectancy, mortality rates, incidence
    and prevalence, and disability weights.** These components are crucial for understanding
    the burden of diseases and injury at both global and population levels.


    # 4.1 Cause-Specific or Population-Wide


    Health metrics are essential tools for evaluating the health status of a population
    and guiding public health interventions. They provide valuable insights into the
    burden of disease and injury, helping policymakers and public health officials
    make informed decisions about resource allocation and health policy. By combining
    these metrics, policymakers and public health officials can make informed decisions
    about how to improve the health outcomes of a population and reduce the burden
    of disease and injury.


    > **What are the components of these health metrics, and how are they calculated?**


    The evaluation of health metrics begins with the assessment of its components,
    which is crucial because results strongly depend on the types of **life tables,
    mortality rates, and disability weights** used in the analysis. Furthermore, it
    is important to consider whether the objective of the analysis is **cause-specific
    or population-wide**. This can significantly increase the granularity of health
    metrics components, as alignment with general principles in epidemiological research
    and health metrics analysis, discussed in the Global Burden of Disease (GBD) study
    methodologies.


    ¹Theo Vos et al., “Global Burden of 369 Diseases and Injuries in 204 Countries
    and Territories, 1990-2019: A Systematic Analysis for the Global Burden of Disease
    Study 2019,” *The Lancet* 396, no. 10258 (October 2020): 1204–22, doi:10.1016/S0140-6736(20)30925-9.


    DOI: 10.1201/97810322659535-4'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Life Tables and Life Expectancy


    Cause-specific metrics focus on disease intervention planning, such as the burden
    of HIV or tuberculosis on specific populations. Population-wide metrics, on the
    other hand, are ideal for broader health policy decisions, overall mortality rates
    or life expectancy, and provide a comprehensive view of the health landscape.


    The results of health metrics calculations can vary significantly based on various
    factors, including geographic location, the type and severity of diseases or injuries,
    the specific cases of death or disability, and the age groups analysed (whether
    age-standardised or covering all ages). Additional variation arises from the time
    points of analysis and whether the metrics are calculated across both sexes or
    specifically for males and females. The disability weights applied can differ
    depending on the condition''s severity, its impact on quality of life, and other
    contextual parameters, resulting in tailored calculations that reflect local health
    challenges more accurately.


    In this chapter, particular examples and case studies are provided to illustrate
    the process of applying the components to the metrics. By understanding the structure
    of the components, you will be better equipped to analyse and interpret health
    data and make informed decisions about health policy and resource allocation.


    # 4.2 Life Tables and Life Expectancy


    The first component is the life expectancy, used for calculating the YLLs in Equation
    3.1. More specification about life tables used to calculate the life expectancy
    is in the Appendix A. As a key parameter in the calculation of health metrics,
    life expectancy is essential for estimating the number of years lost to premature
    death.


    The standard life expectancy is defined as the average number of years a person
    is expected to live based on current mortality rates, an important indicator of
    the overall health status of a population used to compare the outcomes of different
    populations over time. It is calculated based on the probability of survival at
    each age, taking into account the mortality rates for that age group.


    In life tables, the probability of survival and the mortality rates across different
    age groups are used for estimating the number of remaining expected years. These
    tables provide crucial insights into the longevity patterns within a population,
    enabling researchers and policymakers to predict life expectancy trends and to
    assess public health strategies effectively.


    **Table 4.1 Extraction of Global Health Observatory (GHO) Life Tables Components


    | age | ndx | nLx | Tx | ex |

    | 40-44 | 92380 | 1320 | 48599 | 353024 | 38 |

    | 45-49 | 91060 | 1737 | 450958 | 3071605 | 34 |

    | 50-54 | 89323 | 2547 | 440248 | 262467 | 29 |


    Where $x$ is the number of people at the beginning of the age, $ndx$ is the number
    of person-years lived between age $x$ and $x+1$, $nLx$ is the number of person-years
    lived between age $x$ and $x+1$, $Tx$ is the total number of person-years lived
    by the cohort of persons alive at age $x$, and $ex$ is the expected remaining
    lifetime at age $x$.'
