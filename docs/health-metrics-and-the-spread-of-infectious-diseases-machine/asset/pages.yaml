  md: '202 Spatial Data Modelling and Visualisation


    # 12.5 Dynamics of Disease Transmission


    The spread of infectious diseases, fundamentally depends on the pattern of human
    contact⁴ and the spatial distribution of infected individuals. Understanding the
    spatial dynamics of disease transmission is crucial for predicting the risk of
    outbreaks and guiding public health interventions.


    To explore the dynamics of disease transmission in Central Africa by simulating
    the spread of infections we use a type of network generalised by a high degree
    of clustering and short average path lengths called small-world network. It represents
    a realistic model of human contact patterns, where individuals are more likely
    to interact with their neighbours but also have long-range connections with other
    individuals. By simulating the spread of infections in a small-world network,
    we can investigate how the spatial structure of the network influences the transmission
    dynamics and identify critical nodes for disease control.


    We will use the igraph package to create a small-world network and simulate the
    spread of infections. The network will consist of nodes representing individuals
    in Central Africa, with connections based on a small-world topology. The sample_world()
    function generates a small-world network with the specified parameters: the number
    of nodes N, the average degree k and the rewiring probability p. The average degree
    k determines the number of neighbours each node is connected to, while the rewiring
    probability p controls the likelihood of rewiring connections to create long-range
    connections. By adjusting the parameters k and p, we can create small-world networks
    with different topologies and study their impact on disease transmission dynamics.


    ```

    library(igraph)


    row <- nrow(df,sf) # Number of nodes

    k <- 3 # Each node connected to k nearest neighbours

    p <- 0.1 # Rewiring probability

    small_world <- sample_smallworld(dim = 1,

    size = N,

    nei = k,

    p = p)

    ```


    Assign the small_world to a new variable small_world_dev and infect 10 random
    nodes. The status of the nodes is defined as "S" for susceptible and "I" for infected.
    The colour of the nodes is assigned based on their status, with infected nodes
    showing in red and susceptible nodes in grey.


    ```

    V(small_world)$color <- "grey"

    # Create a second network for development

    small_world_dev <- small_world

    # Infect 10 random nodes

    V(small_world_dev)$status <- "S" # Susceptible

    infected_nodes <- sample(V(small_world_dev), 10)

    V(small_world_dev)$status[infected_nodes] <- "I" # Infectious

    ```


    > ⁴Erik M. Voltz et al., "Effects of Heterogeneous and Clustered Contact Patterns
    on Infectious Dynamics," PLoS Computational Biology 7, no. 6 (June 2, 2021): e1002042,
    doi:10.1371/journal.pcbi.1002042.'
  merge: -1
