- pgno: 93
  md: "# The Steps of Building a Model\n\n```\ntitle = \"Deaths due to Cholera in\
    \ London (1849)\"\nx = \"Date\", y = \"N. deaths\")\n```\n\n# Deaths due to Cholera\
    \ in London (1849)\n\n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_93_0.png)\n\nFigure\
    \ 6.3 Deaths due to Cholera in London (1849)\n\nLet's observe in mathematical\
    \ terms what happens when we start investigating the relationship between the\
    \ response and the predictor, to explain the behaviour of $\beta_0$ and the variables.\n\
    \nThe following mathematical formulation represent our observed data, where $\b\
    eta_0$ and $\beta_1$ are the equivalence between $y$ and $x^5$.\n\n> $y = \\beta_0\
    \ + \\beta_1 x$\n\nWhen a model is attempted, the values of the slope $(\\hat{\b\
    eta}_1)$ and the intercept $(\\hat{\beta}_0)$ are estimated$^6$ in order to replicate\
    \ the values $(y)$ of the response by applying $x$ to our model function.\n\n\
    > $\\hat{y} = \\hat{\beta}_0 + \\hat{\beta}_1 x$\n\nwhere $\\hat{\beta}_0$ is\
    \ the estimate value of the intercept, and $\\hat{\beta}_1$ is the estimated value\
    \ of the slope. So, the estimated data will approximate the observed data, with\
    \ some margin of error $(\\epsilon)$:\n\n> $y \\sim \\hat{y} + \\epsilon$\n\n\
    +   5We can compare this formulation to a general $Y = a + mx$ linear function.\
    \ In our case $a$ would be the intercept and $m$ the slope of the line that will\
    \ summarise the information between $y$ and $x$.\n6The hat $(\\hat{})$ on top\
    \ of the variables indicates the values are estimated."
