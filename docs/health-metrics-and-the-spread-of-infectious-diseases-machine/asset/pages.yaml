- pgno: 282
  md: "264 The Case of Malaria\n\n# 16.3.1 Modelling with caret\n\nTo train a machine\
    \ learning model to predict future trends in malaria transmission, we will be\
    \ using 80% of the original data to train the model and 20% to test it. Then,\
    \ we will evaluate its performance using the Root Mean Squared Error (RMSE).\n\
    \nThe {caret} package provides a unified interface for training and evaluating\
    \ machine models in R (Chapter 8). It supports a wide range of algorithms and\
    \ provides tools for hyperparameter tuning, cross-validation, and model evaluation.\n\
    \n```\n# Load libraries and check for conflicts\nlibrary(caret)\nconflicted::conflicts_prefer(dplyr::lag)\n\
    ```\n\n# 16.3.1.1 Feature Engineering\n\nCreate lagged variables to capture the\
    \ temporal dynamics of malaria transmission. For time series forecasting, it's\
    \ helpful to create variables, which represent past values of the target variable.\
    \ This allows the model to learn from previous values.\n\n```\n# Create lagged\
    \ features (e.g., previous year's)\nnigeria_cases <- niger_cases %%\narrange(year)\
    \ %%\nmmutate(lag_1 = lag(positive, 1),\n       lag_2 = lag(positive, 2),\n  \
    \     lag_3 = lag(positive, 3)) %>%%\ndrop_na()\n```\n\n```\nhead(nigeria_cases)\n\
    # A tibble: 6 x 5\n#   year positive lag_1 lag_2 lag_3\n#   <int>    dbl   <dbl>\
    \ <dbl> <dbl>\n# 1  1989    134    1276     7  873\n# 2  1990    352    134  1276\
    \     7\n# 3  1992     92    352  134  1276\n# 4  1996    331      92    352 \
    \ 134\n# 5  1998     98    331    352    92\n# 6  1999     36      98    331 \
    \   92\n```\n\nCreate partition for training and testing data using the createDataPartition()\
    \ function from the caret package.\n\n```\nset.seed(123)\ntrain_index <- createDataPartition(nigeria_cases$positive,\n\
    \                                   p = 0.8, list = FALSE)\ntrain <- nigeria_cases[train_index,\
    \ ]ntest <- nigeria_cases[-train_index, ]\n```\n\n# 16.3.1.2 Model Selection and\
    \ Training (Parameter Calibration)\n\nDefine the machine learning model specific\
    \ for investigating Malaria dynamics. In this case, we will use the time and number\
    \ of lagged cases to predict the number of infected cases."
  merge: -1
  img_proc: true
- pgno: 283
  md: "# Example: Simulating Malaria Transmission Dynamics 265\n\nWe will use the\
    \ train() function from the {caret} package to train the model. A suitable model\
    \ would be? List the models that can be used for this task:\n\n+   - Random Forest\
    \ (`rf`)\n- Gradient Boosting (`gbm`)\n- Support Vector Machines (`svm`)\n- Neural\
    \ Networks (`mtnet`) - etc.\n\nIn the method argument, specify the model to be\
    \ used (e.g., `rf` for Random Forest). The trControl argument specifies the cross-validation\
    \ method for hyperparameter tuning, and the tuneGrid argument defines the hyperparameter\
    \ grid for tuning.\n\n```\n# Define the training control with 5-fold cross-validation\n\
    train_control <- trainControl(method = \"cv',\n                              number\
    \ = 5)\n\n# Define a tuning grid for mtry\n# (number of variables sampled at each\
    \ split)\ntuning_grid <- expand.grid(mtry = c(1, 2, 3))\n\n# Train the Random\
    \ Forest model\nset.seed(123)\nrf_model <- train(\n  positive - lag_1 + lag_2\
    \ + lag_3,\n  data = train,\n  method = \"rf\",\n  trControl = train_control,\n\
    \  tuneGrid = tuning_grid,\n  ntree = 500) # Number of trees\n```\n\nThe parameter\
    \ calibration is performed by the train function automatically using cross-validation\
    \ to select the optimal hyperparameters for the model.\n\n# 16.3.1.3 Model Evaluation\n\
    \nTesting the model on observed data will show how the model performs in estimating\
    \ the number of infected cases.\n# Predict on the test data\nnigeria_cases$pred\
    \ <- predict(rf_model,\n                              newata = nigeria_cases)\n\
    \n```\nnigeria_cases %>%\ngplot(aes(x = year, y = positive)) +\n  geom_line(color\
    \ = \"navy\", linetype = \"solid\") +\n  geom_line(aes(y = pred), color = \"darkred\"\
    , linetype = \"dashed\") +\n  labs(title = \"Malaria Positive Cases in Nigeria\"\
    ,\n       subtitle = \"Observed vs Predicted - Random Forest\",\n       x = \"\
    Year\",\n       y = \"Number of Positive Cases\") +\n  theme_minimal()\n```"
