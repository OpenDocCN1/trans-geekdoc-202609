    \ male 35-39 1541507 143984.\n```\n\nThen, multiply these values for the severity\
    \ levels of stroke in the Global region. We may obtain three values, one for each\
    \ severity level.\n\nFor calculating the prevalence YLDs, we use the prevalence\
    \ severity and the average weights, while for incidence-based YLDs, we also need\
    \ to consider the average duration of the condition.\n\nIn particular, for stroke,\
    \ the average duration of the condition can vary on:\n\n+   - duration for acute\
    \ stroke: up to 28 days\n- duration for chronic stroke: beyond 28 days, often\
    \ modelled for long-term consequences, up to the lifetime of the patient depending\
    \ on the model used.\n\nIn this example, we consider the average duration of the\
    \ condition for 28 days. It does need to be converted to year-based:\n\n> $$\\\
    hat{L}_{stroke} = \\frac{28}{365}$\n\nThese values strongly depend on the disability\
    \ weights and the severity values assigned to the condition.\n\n```\nYLD_by_severity\
    \ <- merge(inc_prev_stroke_5y, dw_stroke) %>%%\ngroup_by(sex, age, avg_dw) %>%%\n\
    reframe(prev_sev = Prevalence*severity_n,\ninc_sev = Incidence*severity_n,\nyld_p\
    \ = prev_sev * avg_dw,\nyld_i = inc_sev * avg_dw * 28 / 365)\n```\n\nLet's check\
    \ the values for the age group 35-39.\n\n```\nYLD_by_severity %>%%\nfilter(age\
    \ == \"35-39\")\n# A tibble: 9 x 7\n# sex age avg_dw prev_sev inc_sev yld_p yld_i\n\
    # <chr> <ord> <dbl> <dbl> <dbl> <dbl>\n# 1 both 35-39 0.206 1583288. 129681. 326847.\
    \ 2054.\n# 2 both 35-39 0.293 796365. 65227. 233379. 1466.\n```"
