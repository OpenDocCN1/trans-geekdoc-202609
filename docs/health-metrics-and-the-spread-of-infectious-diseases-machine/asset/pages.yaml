- pgno: 124
  md: "# Techniques for Machine Learning Applications\n\nTo introduce a machine learning\
    \ feature with parameter calibration over our modelling of the rabies data, we\
    \ can use a technique like cross-validation combined with a regularisation method\
    \ or an algorithm that supports parameter tuning. Here, we can employ a model\
    \ by the glmnet package, which fits a generalised linear model via penalised maximum\
    \ likelihood. The regularisation is computed for the lasso or elastic-net penalty\
    \ at a grid of values for the regularisation parameter.\n\nAdding Machine Learning\
    \ Features with {glmnet} and Cross-Validation\n\n```\nif(require(glmnet)) install.packages(\"\
    glmnet\")\nlibrary(glmnet)\n```\n\nFor glmnet, we need to input matrices rather\
    \ than data frames, and create matrices for the independent variables (predictors)\
    \ and the dependent variable (response).\n\n```\npredictors <- model.matrix(dalys_rabies\
    \ ~,\n              data = data[, -1] # Remove intercept\nresponse <- dalys_rabies\n\
    ```\n\nUse cross-validation to find the optimal lambda value, which controls the\
    \ strength of the regularisation:\n\n```\n# Set seed for reproducibility\nset.seed(123)\n\
    \n# Fit the model with cross-validation\ncv_model <- cv.glmnet(predictors,\n \
    \                     response,\n                      family = \"gaussian\")\n\
    cv_model\n#>\n# Call: cv.glmnet(x = predictors, y = response, family = \"gaussian\"\
    )\n#\n# Measure: Mean-Squared Error\n#\n#> Lambda Index Measure SE Nonzero\n#\
    \ min 0.09043 48 0.05662 0.01147 2\n# ise 0.13120 44 0.06564 0.01192 2\n```\n\n\
    Extracting the best value, we can see that lambda is 0.165.\n\n```\n# Get the\
    \ best lambda value\nbest_lambda <- cv_model$lambda.min\npaste(\"Best Lambda:\"\
    , best_lambda)\n# [1] \"Best Lambda: 0.0904304071218807\"\n```\n\nAnd plot the\
    \ lambda selection with the plot() function.\n\n```\n# Plot the lambda selection\n\
    plot(cv_model)\n```"
  merge: -1
  img_proc: true
- pgno: 125
  md: "# Example: Rabies 107\n\n2 2 3 3 3 3 2 2 2 2 2 1 1 1\n\n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_125_0.png)\n\
    \nFigure 7.5 Cross-Validation Optimal Lambda\n\nThen, fitting the final model\
    \ with the selected best lambda, we can predict and evaluate the model.\n\n```\n\
    final_model <- glmnet(predictors,\n  response,\n  family = \"gaussian\",\n  lambda\
    \ = best_lambda)\n\n# Predict using the final model\npredictions <- predict(final_model,\n\
    \  # values of the penalty parameter lambda\n  s = best_lambda,\n  # matrix of\
    \ new values for x\n  newx = predictors\n)\n\n# Calculate Mean Squared Error\n\
    rmse <- sqrt(mean((response - predictions)^2))\npaste(\"Root Mean Squared Error:\"\
    , rmse)\n# [1] \"Root Mean Squared Error: 0.224850403214572\"\n```\n\nBy incorporating\
    \ glmnet and using lambda selection via cross-validation, we introduce a machine\
    \ learning—parameter calibration into our analysis. This approach not only in\
    \ minimising overfitting but also enhances model performance by selecting the\
    \ most effective regularisation parameter. The cross-validation process used here\
    \ is crucial for confirming that our model's parameters are optimally tuned for\
    \ the given data, embodying a key aspect of machine learning methodologies."
  merge: -1
  img_proc: true
