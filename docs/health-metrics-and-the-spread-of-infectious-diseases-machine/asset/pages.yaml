- pgno: 140
  md: '# 122 Essential R Packages for Machine Learning


    The h2o_rabies object is created by importing the rabies data frame to H2O with
    the as.h2o() function.


    ```

    # Upload data to H20

    h2o_rabies <- as.h2o(rabies)

    ```


    Set a response variable and predictors.


    ```

    response <- "dalys_rabies"

    predictors <- setdiff(names(rabies), response)

    ```


    # # Split data into training and testing sets


    ```

    splits <- h2o.splitFrame(h2o_rabies,

    ratios = 0.8,

    seed = 1234

    train <- splits[[1]]

    test <- splits[[2]]

    ```


    Train three models:


    +   - a linear regression model (family = "gaussian" or standard ordinary least
    squares (OLS) linear regression)

    - a GBM model (Gradient Boosting Machine)

    - a random forest model


    ```

    model_lm <- h2o.glm(x = predictors,

    y = response,

    training_frame = train,

    family = "gaussian")

    model_gbm <- h2o.gbm(x = predictors,

    y = response,

    training_frame = train,

    validation_frame = test,

    trees = 1000,

    max_depth = 6,

    learn_rate = 0.01,

    seed = 1234)

    model_rf <- h2o.randomForest(x = predictors,

    y = response,

    training_frame = train,

    trees = 100,

    max_depth = 20,

    seed = 1234

    ```


    Evaluate the models with the h2o.performance() function to evaluate the performance
    of the models by calculating the metrics.


    ```

    perf_lm <- h2o.performance(model_lm, newdata = test)

    perf_gbm <- h2o.performance(model_gbm, newdata = test)

    perf_rf <- h2o.performance(model_rf, newdata = test)

    ```


    Then extract the RMSE and MAE metrics:


    ```

    h2o.rmse(<model>)

    ```'
