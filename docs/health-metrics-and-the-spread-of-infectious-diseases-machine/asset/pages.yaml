  md: "# COVID-19 Outbreaks\n\n```\nfilter(country_region %in%\nc(\"US\", \"China\"\
    , \"United Kingdom\", \"Canada\"),\naes(x = long, y = lat,\nsize = tot_cases,\n\
    color = avg_cfr,\nalpha = 0.5) +\nscale_size_continuous(name = \"Total cases (M)\"\
    ,\nlabels = scales::unit_format(unit = \"M\",\nscale = 1e-6) + +\nscale_color_viridis_c(name\
    \ = \"Average CFR (log scale)\",\ntrans = \"log\",\nlabels = scales::label_number(accuracy\
    \ = 0.001)) + +\nguides(color = guide_colorbar(order = 1),\\nsize = guide_legend(order\
    \ = 2)) + +\ncoord_map())\nlabs(title = \"COVID-19 Cases by Country\",\ncaption\
    \ = \"Data Source: JHU CSSEGISData/COVID-19\"\ncircle size = \"Total cases; average\
    \ CFR\",\nubtitle = \"US, China, United Kingdom, Canada\",\nsize = \"Total cases\
    \ (M)\",\ncolor = \"Avg CFR (log scale)\",\nx = \"\", y = \"\") + +\ntheme(axis.text\
    \ = element_blank(),\nplot.subtitle = element_text(size = 8),\nlegend.key.size\
    \ = unit(0.5, \"cm\"),\nlegend.text = element_text(size = 8),\nlegend.title =\
    \ element_text(size = 9))\n```\n\nThe difference in number of cases and deaths\
    \ between the US and China is striking. The US has the highest number of cases\
    \ and deaths, while China has the lowest number of cases and deaths. The United\
    \ Kingdom and Canada have a similar number of cases and deaths, but the United\
    \ Kingdom has a higher case fatality rate CFR than Canada.\n\nLet's calculate\
    \ the DALYs for COVID-19, starting with the YLLs. We know that the simplified\
    \ formula for YLLs is the number of deaths multiplied by the standard life expectancy\
    \ at the age of death. The standard life expectancy for these countries varies,\
    \ but we use the global average of 72.6 years.\n\nAlso, we group by 4 month cycles\
    \ to calculate the YLLs.\n\n```\nCOVID19_4month_counts <- COVID19_4counts %%\n\
    mmutate(month = as.numeric(format(date, \"%%m\")),\nyear = as.numeric(format(date,\
    \ \"%%Y\")),\nmonth_cycle = case_when(month %in% 1:4 ~ \"Jan-Apr\",\nmonth %in%\
    \ 5:8 ~ \"May-Aug\",\nmonth %in% 9:12 ~ \"Sep-Dec\") %>%%\ngroup_by(country_region,\
    \ year, month_cycle) %>%%\nsumise(cases = sum(cases),\ndeaths = sum(deaths),\n\
    \ = round(deaths / cases, 3)) %>%%\nmutate(ylls = deaths * 72.6) %%\narrange(year,\
    \ month_cycle, ylls)\n```"
