  md: '# Spatial Data Modelling and Visualisation


    Learning Objectives


    +   - Learn how to model and visualise spatial data

    - Understand the concepts of spatial data, spatial data models, and spatial models

    - Create maps, simulate infections, and predict the spatial distribution of phenomena


    In the previous chapters, we explored the fundamentals of data visualisation with
    various techniques for creating static and interactive plots. In this chapter,
    we will learn how to model and envisage spatial data, which involves analysing
    and representing data with spatial components. We will explore the concepts of
    spatial data, spatial data models, and learn how to create maps, simulate infections,
    and predict the spatial distribution of phenomena such as disease spread. By combining
    spatial data with machine learning techniques, we can model the spatial dynamics
    of disease transmission and assess the risks associated with the spread of infections.
    We will use various packages such as sf, ggplot2, and gstat to create spatial
    models and visualisations, and gain insights into the spatial distribution of
    infections in a specific region.


    # 12.1 Spatial Data, Spatial Data Models, and Spatial Models


    Understanding the spatial distribution of phenomena such as disease spread, land
    cover changes, or climate patterns requires the use of spatial data and spatial
    models. These tools are essential for analysing and predicting spatial processes
    and for informing data-driven decisions in public health, environmental management,
    and urban planning.


    A notable example is the Ebola Virus outbreak in West Africa (2014–2016). The
    virus spread across countries like Guinea, Liberia, and Sierra Leone, driven by
    factors such as population density, healthcare infrastructure, and human mobility.
    By analysing spatial data on cases, fatalities, and healthcare facilities and
    applying spatial models to simulate the virus''s spread, researchers gained valuable
    insights into the dynamics of the outbreak. This analysis helped identify high-risk
    areas for targeted interventions.¹1


    +   - **Spatial Data:** This refers to data that includes geographic coordinates,
    addresses, or boundaries, representing the physical location of objects or events.
    Spatial data can be stored in two formats: vector and raster. Vector data use
    geometric shapes


    > ¹Null, "Ebola Virus Disease in West Africa — the First 9 Months of the Epidemic
    and Forward Projections," New England Journal of Medicine 371, no. 16 (October
    16, 2014): 1481-95, doi:10.1056/NEJMoa1411100.'
  merge: -1
  img_proc: true
- pgno: 208
  md: "# 190\n\n# Spatial Data Modelling and Visualisation\n\n(points, lines, polygons)\
    \ to represent features such as roads, cities, and boundaries. Raster data models,\
    \ on the other hand, use a grid of cells or pixels, with a value representing\
    \ a variable like temperature, land cover, or elevation.\n\n+   - **Spatial Data\
    \ Models**: These are frameworks for organizing and representing spatial data.\
    \ They provide the structure for connecting real-world phenomena with their digital\
    \ representation through algorithms (like spatial relationships and topology).\
    \ Spatial data models form the foundation for managing and processing spatial\
    \ information, enabling meaningful analysis and visualization.\n\n+   - **Spatial\
    \ Models**: Unlike spatial data, which organize data, spatial models simulate\
    \ dynamic spatial phenomena that change over time. Examples include the spread\
    \ of infectious diseases, flood development, or land changes. Spatial models are\
    \ crucial for understanding and forecasting the evolution of spatial phenomena,\
    \ allowing researchers and decision-makers to plan interventions and management\
    \ strategies effectively.\n\nFor further information on spatial data models and\
    \ spatial process, refer to the **ArcGIS** documentation for guidance on solving\
    \ spatial problems and the **Esri** blog for in-depth discussions on spatial analysis.\
    \ **R-Spatial.org** offers a wealth of resources on spatial data analysis, including\
    \ tutorials and the latest developments in the field.\n\n# ## 2.2 Making a Map\n\
    \nTo learn how to make a map we first need spatial data. There are various sources\
    \ and packages that provide spatial data for different regions and purposes. One\
    \ such package is `rnaturalearth`, this package contains various types of boundaries\
    \ of countries in the world. For more information use `rnaturalearth`. In particular,\
    \ we use the `ne_countries() ` function to get the boundaries of Africa, with\
    \ the option `returnclass = \"sf\"` to return the data as **simple features**.\n\
    \n```\nlibrary(tidyverse)\nlibrary(sf)\nlibrary(rnaturalearth)\n```\n\n```\nafrica\
    \ <- ne_countries(continent = \"Africa\",\n      returnclass = \"sf\")\n```\n\n\
    A simple feature object is a type of spatial data that contains the geometry of\
