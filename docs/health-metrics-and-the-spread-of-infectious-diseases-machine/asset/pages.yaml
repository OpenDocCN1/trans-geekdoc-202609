    # 7.4.3 Correlation, Multicollinearity, and Overfitting


    To be noted that we haven''t applied any **correlation** selection step on this
    data. Filtering out highly correlated predictors, such as those with a correlation
    greater than 80% to avoid multicollinearity, might lead to excluding crucial variables.
    On the other hand, all possible covariates in a model often yields implausible
    signs or unstable coefficients, as well as overfitting.


    > Kyle J. Foreman et al., “Modeling Cases of Death: An Integrated Approach Using
    CODEM,” Population Health Metrics 10, no. 1 (January 2012): 1, doi:10.1186/1478-7954-10-1.'
