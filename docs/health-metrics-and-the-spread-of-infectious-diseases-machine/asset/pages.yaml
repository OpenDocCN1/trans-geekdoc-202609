    # 4.7 Case Study: Germany Lung Cancer Study


    For this case study, we used data from the GBD study for Germany, to relate the
    number of deaths due to lung-cancer in 2019. Data are available in the `hmsidWR`
    package, and includes the upper and lower bounds of the estimates and the 5-yrs
    age group for both sexes. We do not have information for the 0-4, 55+ age groups.


    Here we can see the first 6 rows of the data, that we are going to use to calculate
    the YLLs, the YLDs and finally the DALYs.


    Joining germany_lungc with the GHO life tables (`gho_lifetables`) we can build
    a new dataset with all the information needed for calculating the YLLs for the
    lung cancer deaths in Germany in 2019.


    ```

    gelung_YLL <- germany_lungc %>%

    filter(sex == "both") %>%

    left_join(gho_lifetables) %>%

    filter(year == 2019, indicator == "exx") %>%

    select(-indicator, -year) %>%

    rename(life_expectancy = value) %>%

    group_by(age) %>%

    reframe(dx, life_expectancy, YLL = dx * life_expectancy)

    ```


