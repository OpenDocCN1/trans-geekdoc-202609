  md: "288\n\nFormulary\n\n+   - Description: Predicts a continuous target variable\
    \ based on linear relationships between the target and one or more predictor variables.\n\
    \n# Logistic Regression\n\n+   - Formula:\n\n```\nlogit(P(Y = 1)) = \\ln\\left(\\\
    frac{P(Y = 1)}{1 - P(Y = 1)}\\right) = \\beta_0 + \\beta_1x_1 + \\beta_2x_2 +\
    \ \\cdots + \\beta_nx_n$\n```\n\n+   - Description: Predicts a binary outcome\
    \ based on linear relationships between the predictor variables and the log-odds\
    \ of the outcome.\n\n# Generalized Linear Model (GLM)\n\n+   - Formula:\n\n```\n\
    g(E(Y)) = \\beta_0 + \\beta_1x_1 + \\beta_2x_2 + \\cdots + \\beta_nx_n\n```\n\n\
    +   - Description: A generalized linear model is a flexible generalization of\
    \ ordinary regression that allows for the dependent variable Y to have a distribution\
    \ other than the normal. The link function $g$ relates the expected value of the\
    \ response variable $E(Y)$ to the linear predictors. $\\beta_0$ is the intercept,\
    \ and $\beta_i$ are the coefficients for the predictor variables $x_i$.\n\n# Generalized\
    \ Additive Model (GAM)\n\n+   - Formula:\n\n```\ng(E(Y)) = \\beta_0 + f_1(x_1)\
    \ + f_2(x_2) + \\cdots + f_n(x_n)\n```\n\n+   - Description: A generalized additive\
    \ model is an extension of generalized linear models where the predictor depends\
    \ linearly on unknown smooth functions of some predictor variables, and it allows\
    \ for non-linear relationships between the dependent and independent variables.\
    \ Here, $g$ is the link function, $E(Y)$ is the expected value of the response\
    \ variable $Y$, $\\beta_0$ is the intercept\n\n# Decision Tree\n\n+   - Formula:\
    \ Recursive binary splitting\n\n+   - Description: Splits the data into subsets\
    \ based on the value of input features. Each internal node represents a “test”\
    \ on an attribute, each branch represents the outcome of the test, and each leaf\
    \ node represents a class label or continuous value.\n\n# Random Forest\n\n+ \
    \  - Formula: Aggregated decision trees\n\n+   - Description: Combines the predictions\
    \ of multiple decision trees to improve accuracy and control over-fitting. Each\
    \ tree is is trained on a bootstrapped sample of the data and uses a random subset\
    \ of features.\n\n# Support Vector Machine (SVM)\n\n+   - Formula:\n\n```\nf(x)\
    \ = sign(\\mathbf{w} \\cdot \\mathbf{x} + b)\n```"
