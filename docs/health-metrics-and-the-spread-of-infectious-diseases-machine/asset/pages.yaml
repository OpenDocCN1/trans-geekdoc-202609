    # A.1.2 Life Expectancy


    Life expectancy is the expected number of years a person will live, based on current
    age and prevailing mortality rates. There are several methods to calculate life
    expectancy, but one common approach is to use the actuarial life table, which
    is a statistical table that provides the mortality rates for a population at different
    ages. The following steps can be used to calculate life expectancy using a life
    table:


    Identify the relevant mortality rates for the population and time period of interest.
    Calculate the probability of surviving to each age by the remaining life expectancy
    at each age to obtain the expected number of years of life remaining at each age.
    Sum the expected number of years of life remaining to obtain the total life expectancy.
    Note that life expectancy is a statistical estimate and can be influenced by many
    factors, such as lifestyle, health, and environmental factors, so individual life
    expectancy can vary widely.


    Here are some references for calculating life expectancy:


    +   1. United Nations World Population Prospects - The UN provides detailed life
    tables and population data, including life expectancy, for countries and regions
    around the world.

    2. Centers for Disease Control and Prevention (CDC) - The CDC provides life tables
    for the United States, as well as information on how life expectancy is calculated
    and factors that affect it.

    3. World Health Organization (WHO) - The WHO provides information on global health
    and life expectancy, including data and reports on trends in life expectancy and
    mortality.

    4. Actuarial Science textbooks - Books such as “Actuarial Mathematics” by Bowers,
    Gerber, Hickman, Jones, and Nesbitt, or “An Introduction to Actuarial Mathematics”
    by Michel Miller, provide comprehensive coverage of the methods and mathematics
    used in calculating life expectancy.

    5. Journal articles - Articles in actuarial and demographic journals, such as
    the North American Actuarial Journal or Demographic Research, often provide in-depth
    coverage of the latest research and methods for calculating life expectancy.


    # A.2 Markov Chain


    A Markov chain is a stochastic model describing a sequence of possible events
    in which the probability of each event depends only on the state attained in the
    previous event. The state space of a Markov chain is the set of all possible states
    of the system. The transition probabilities are the probabilities of moving from
    one state to another. The transition matrix is a square matrix that describes
    the transition probabilities between states.'
