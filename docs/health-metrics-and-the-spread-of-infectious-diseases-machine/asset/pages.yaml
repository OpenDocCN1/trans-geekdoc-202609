    # 9.4.3 Partial Autocorrelations


    The **Partial Autocorrelation Function (PACF)** removes the effects of intermediate
    lags. It is a measure of the direct relationship between a time series and its
    lagged values. The PACF allows for a more specific identification of how many
    lags to include in the AR part of the ARIMA model. The number of autoregressive
    (AR) terms (p) is determined by the number of significant lags in the PACF plot.


    ```

    sdi_fr_ts |>

    PACF(value) |

    apoplot()


    sdi_fr_ts |>

    gg_tsdisplay(y = value, plot_type = "partial")

    ```


    ![](img/6b61f0d3dcab44c60cdfe4e888d549c9_165_1.png)


    **(a)** PACF   **(b)** gg_tsdisplay


    **Figure 9.8** Partial Autocorrelations of SDI in France'
