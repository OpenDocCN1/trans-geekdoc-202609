  md: '# The History of Health Metrics


    More specifically, Mary Dempsey in 1940s wrote an article³ for the National Tuberculosis
    Association about the concept of Years of Life Lost (YLLS), assessing time-loss
    as a metric for the first time. She was then followed by other more advanced improvements
    spanning throughout the rest of the century.


    > The quality of life also depends on the scale of “public health”-namely on factors
    that affect the biological welfare of the community as a whole.”⁴


    The 20th century marked significant advancements in epidemiology, driving the
    expansion and refinement of health metrics. This period saw the widespread adoption
    of life tables and the modification of expected survival time to incorporate weighted
    metrics, such as disability-adjusted years (DALYs). These developments enabled
    more comprehensive assessments of population health by accounting for both mortality
    and the quality of life, laying the foundation for modern health evaluation tools.


    The term Summary Measures of Population Health (SMPH)⁵ was established in the
    field, originating from the need to encapsulate both fatal and non-fatal health
    outcomes into a single comprehensive measure, representing a significant evolution
    in health metrics. Used for various purposes, the SMPH compares health of populations
    and includes the contributions of different diseases, injuries and risk factors
    to the total disease burden in a population. SMPH, also referred to as a composite
    indicator,⁶ is divided into two parts: health expectations and health gaps.


    Health expectations are summary measures that cover information on mortality to
    represent the average number of years that an individual can live in good health.
    Such as healthy life expectancy (HALE) and the quality adjusted expectancy (QALE)
    using health-related quality of life.


    Health gains, on the other hand, represent the difference between the current
    health status of a population and an ideal health status, providing a measure
    of the potential for improvement in health outcomes. Divided into the disability
    adjusted life years (DALYs)⁷ in the global burden of disease (GBD) and the quality
    adjusted life years (QALY)⁸ as the outcome index of cost-utility analysis.


    In the contemporary era, the integration of computing power and big data has transformed
    health metrics. Today, we have complex models, machine learning algorithms, and
    global health databases for real-time tracking of diseases and health outcomes.
    John Grant’s work has been the bedrock of a scientific approach to understanding
    population health. From Grant’s early analysis of the Bills of Mortality⁹ to the
    development of today’s advanced health metrics, this journey reflects the ongoing
    effort to understand and manage the complexities of human health and disease.


    ³Mary Dempsey, “Decline in Tuberculosis,” American Review of Tuberculosis, April
    23, 2019, https://www.atajnals.org/edpi/10.1164/art.1947.56.2157?lang=tab.


    ⁴Dukes, The Health and Quality of Life. 1976.


    ⁵Christopher J. Murray, The Global Burden of Disease Population Health: Concepts,
