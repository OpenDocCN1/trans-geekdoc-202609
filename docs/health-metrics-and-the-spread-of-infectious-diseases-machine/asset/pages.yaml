  md: '# Introduction to Health Metrics


    > “The concept of health also has highly subjective connotations, precisely because
    it is conditioned by the personal view of happiness.” René Dubois¹


    Health metrics are key variables to understanding the state of health of a population.
    In this first section of the book we will explore the history of these metrics,
    how to calculate them, and how to account for their variation due to causes and
    risks. We will examine the components of these metrics and the challenges in providing
    standardised values for global comparison. Additionally, in the following sections,
    we will learn how to build a model, evaluate the effect of infectious disease
    spread on health metrics, and how it impacts the overall health status of a population.


    # 2.1 The History of Health Metrics


    The history of health metrics is a fascinating journey that spans centuries, evolving
    from rudimentary observations to sophisticated statistical methods, as illustrated
    by Figure 2.1.


    One of the earliest forms of health metrics can be traced back to the work of
    John Graunt, an Englishman, in the 17th century². In 1662, Graunt published a
    landmark work titled “Natural and Public Observations Made upon the Bills of Mortality.”
    Graunt, defined as the father of human democracy, was largely self-educated, and
    his interest in mortality data was driven by the Bills of Mortality, which were
    weekly and annual records of deaths in London, and provided information on the
    mortality data and produced tables that presented various patterns and trends.
    His notable contributions were the concepts of life expectancy and mortality rates.
    One of Graunt’s key observations were the consistent pattern of higher mortality
    among infants and young children. He noted the difference in life expectancy between
    males and females and provided insights into factors influencing mortality, such
    as epidemics and seasons.


    Over time, advancements in mathematics, medicine, and statistics led to the development
    of more sophisticated health metrics. The 19th century saw the emergence of life
    tables, providing a systematic way to analyse mortality and life expectancy.


    +   ¹Dubois, “The State of Health and the Quality of Life.” Western Journal of
    Medicine 125, no. 1 (July 1976): 8-9. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC1237171/

    ²John Graunt, “January 24, 2024, https://en.wikipedia.org/index.php?title=John_Graunt&oldid=1987847'
