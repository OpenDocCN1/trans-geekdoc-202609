    \ rmse mae\n# 1 lm 2.732294 2.295726\n# 2 gbm 1.737425 0.9379672\n# 3 rf 1.399058\
    \ 1.177902\n```\n\nThe best model is the one with the lowest RMSE and MAE values.\
    \ In this case, the gbm model is the best performing among the three.\n\nTo predict\
    \ on the test data, we use the gbm model in the h2o.predict() function:\n\n```\n\
    # Predict on test data\npredictions <- h2o.predict(model_gbm,\nnewata = test)\n\
    ```\n\nConvert the predictions and actual values to data frames for plotting:\n\
    \n```\npred_df <- as.data.frame(predictions)\nactual_df <- as.data.frame(test)\n\
    ```\n\n```\n# Combine actual and predicted values\nresults_df <- data.frame(Actual\
    \ = actual_df[, response],\n            Predicted = pred_df[, j])\n```\n\nThe\
    \ check for normality of the residuals is done using the qnorm() and qline() functions.\n\
    The residuals are calculated as the difference between the actual and predicted\
    \ values.\n\n```\n# Calculate residuals\nresults_df$residuals <- results_df$Actual\
    \ - results_df$Predicted\n# Plot Residuals vs Predicted\ngggplot(results_df,\n\
    \    aes(x = Predicted, y = Residuals)) +\n    geom_point(color = \"navy\", alpha\
    \ = 0.5) +\n    geom_hline(intercept = 0, \n            color = \"orange\", linetype\
    \ = \"dashed\") + \n    labs(title = \"Residuals vs Predicted Values\",\n    x\
    \ = \"Predicted\", y = \"Residuals\")\n# Normality Test of the Residuals\nqnorm(results_df$residuals)\n\
    qline(results_df$residuals, col = 2)\n```\n\n# Adding time to the test data frame\n\
    \n```\nresults_df$Time <- actual_df$year\n```\n\n```\n# Plot Actual vs Predicted\n\
    gggplot(results_df,\n    aes(x = Actual, y = Predicted)) +\n    geom_point(color\
    \ = \"blue\", alpha = 0.5) +\n    geom_abline(slope = 1, intercept = 0, \n   \
    \         color = \"red\", linetype = \"dashed\") + \n    labs(title = \"Actual\
    \ vs Predicted Values\",\n    x = \"Actual\", y = \"Predicted\")\n# Plot Actual\
    \ vs Predicted over time\np2 <- ggplot(results_df, aes(x = Time))\n```"
