    usethis::use_r("yourdataset")

    devtools::document()

    ```


    Use vignettes for additional documentation:


    ```

    vignette("rd-other") # For datasets

    vignette("rd")

    ```


    Finally, build your package to include all new data and functions:


    ```

    devtools::load_all(".")

    ```


    # B.2.0.4 Ensuring Reproducibility with renv


    To ensure that all analyses and code examples in the book are reproducible, we''ve
    utilized the renv package. This package captures the specific versions of all
    R packages used in the project, storing them in a renv.lock file located in the
    root directory of the book''s GitHub repository.


    To restore the project environment to its original state:


    +   1. Clone the project repository.


    +   2. Run the following command in your R console:


    ```

    renv::restore()

    ```


    This command reads the renv.lock file and reinstalls all packages with the exact
    versions used during the book''s development.


    Using renv ensures that all code examples work as intended, regardless of future
    updates, making it easier for readers to replicate analyses or adapt the code
    to their datasets.'
