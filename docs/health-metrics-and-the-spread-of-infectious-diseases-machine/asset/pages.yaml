  md: "# Simulate disability weights\n\n```\n# Simulate disability weights\ndisability_weights\
    \ <- runif(length(age_intervals),\nmin = 0, max = 1\n```\n\n```\n# Calculate average\
    \ health for each age group\naverage_health <- 1 - (prevalences * disability_weights)\n\
    ```\n\n```\n# Adjust Tx for each age group\nlife_table$adjusted_px <- life_table$Survival_Probability\
    \ * average_health\n```\n\n```\nlife_table %>% head())\n# Age Survival_Probability\
    \ nLx adjusted_px\n# 1 0.5579497 100000.0 0.5345848\n# 2 0.9241893 99995.38 0.7786488\n\
    # 3 10 0.8810716 99991.19 0.5781898\n# 4 15 0.9562922 99985.65 0.7392462\n# 5\
    \ 20 0.9627314 99986.15 0.5813254\n# 6 25 0.5607495 99985.98 0.3603310\n```\n\n\
    Let's make a function to calculate the HALE:\n\n```\ncalculate_HALE <- function(age,\
    \ px) {\n  # Initialise a vector to store adjusted Tx for each age group\nadjusted_Tx\
    \ <- numeric(length(age))\n  # Iterate over each age interval to calculate adjusted\
    \ Tx\n  for (i in 1:length(age)) {\n    # Calculate adjusted Tx for the current\
    \ age group\n    adjusted_Tx[i] <- sum(px[i:length(age)])\n  }\nnHALE <- numeric(length(age))\n\
    \  # Calculate HALE for each age group\n  for (i in 1:length(age)) {\n    # Calculate\
    \ HALE for the current age group\n    HALE[i] <- adjusted_Tx[i] / px[i]\n  }\n\
    \  return(HALE)\n}\n```\n\nNow, we calculate HALE for the simulated life table\
    \ data.\n\n```\n# Calculate HALE for the simulated life table data\nHALE1 <- calculate_HALE(age_intervals,\
    \ life_table$Survival_Probability)\nHALE2 <- calculate_HALE(age_intervals, life_table$adjusted_px)\n\
    ```\n\nTo visualise HALE for the standard and adjusted life table data we can\
    \ plot the results with a line graph.\n\nThe difference between the two lines\
    \ represents the impact of adjusting life table. The adjusted life table considers\
    \ the prevalence of health conditions and their associated disability weights,\
    \ providing a more accurate estimate of the number of years a person can expect\
    \ to live in good health.\n\nIn general, HALE is a valuable metric for assessing\
    \ the overall health of a population, by incorporating information on the prevalence\
    \ of health conditions and their associated disability weights, HALE offers a\
    \ more specific understanding of population health."
