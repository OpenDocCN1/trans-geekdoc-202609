  md: '# 6


    # Introduction to Machine Learning


    > “Human beings are not just passive victims of disease. They are active participants
    in the biological confrontation between man and microbe.”


    This chapter will walk you through a basic construction of a machine learning
    model, providing a simple explanation of how to model fast-growing phenomena,
    such as in the case of the spread of infectious diseases. Then in the following
    chapters of this second section you will dive deep into different techniques for
    modelling starting from feature engineering to making predictions.


    # 6.1 Deterministic and Stochastic Modelling


    The spread of a virus can be seen as a random process, since the number of individuals
    who are infected at any given time change randomly. The exact number of individuals
    who will be infected in the future cannot be determined with certainty, as it
    depends on various factors such as the contagiousness of the virus, the behaviour
    of individuals, and the efficacy of mitigation measures.


    A deterministic model, on the other hand, could be used to model the spread of
    a virus under certain conditions, such as a fixed number of individuals, constant
    contagiousness, and no mitigation measures. This type of model can be used to
    make predictions about the spread of a virus under certain assumptions, but it
    will not account for the randomness and uncertainty associated with real-world
    scenarios. In general, a stochastic process, or random process¹ is the type of
    model that attempts to replicate outcomes, using probabilities. On the other hand,
    in a deterministic system the outcome is obtained from a given input, and for
    this it is reproducible.


    Most models used to study the spread of a virus are a combination of both deterministic
    and stochastic models. For example, the SIR (Susceptible-Infected-Recovered) model
    is a deterministic model that describes the dynamics of the spread of a virus,
    but it also includes stochastic elements such as random interactions between individuals.


    # 6.2 Machine Learning Models


    What a machine learning model is and how it differs from statistical models (deterministic
    and stochastic) is all a matter of parameter calibration. Understanding the differences


