- pgno: 304
  md: '# Uniform Distribution


    +   - Formula:


    ```

    $f(x) = \begin{cases} \frac{1}{b-a} & a \leq x \leq b \ 0 & \text{otherwise} \end{cases}$$

    ```


    +   - Description: The uniform distribution describes an equal probability for
    all values in the interval $[a, b]$. It is a continuous distribution.


    # Bernoulli Distribution


    +   - Formula:


    ```

    $f(X = x) = p^x(1-p)^{1-x}$ for $x \in \{0, 1\}$

    ```


    +   - Description: The Bernoulli distribution is a discrete distribution representing
    the outcome of a single binary experiment with success probability $p$.


    # Beta Distribution


    +   - Formula:


    ```

    $f(x) = \frac{x^{\alpha-1}(1-x)^{\beta-1}}{B(\alpha, \beta)}$ for $0 \leq x \leq
    1$

    ```


    +   - Description: The beta distribution is a continuous distribution defined
    on the interval $[0, 1]$, parameterized by $\alpha$ and $\beta$, and is useful
    in Bayesian statistics.


    # Gamma Distribution


    +   - Formula:


    ```

    $f(x) = \frac{\beta^\alpha x^{\alpha-1}e^{-\beta x}}{\Gamma(\\alpha)}$ for $x
    \geq 0$

    ```


    +   - Description: The gamma distribution is a continuous distribution defined
    by parameter $\alpha$ and rate parameter $\beta$. It generalizes the exponential
    distribution.


    # Chi-Squared Distribution


    +   - Formula:


    ```

    $f(x) = \frac{1}{2^{k/2}\Gamma(k/2)}x^{k/2-1}e^{-x/2}$ for $x \geq 0$

    ```


    +   - Description: The chi-squared distribution is a special case of the gamma
    distribution with $\alpha = k/2$ and $\beta = 1/2$, used in hypothesis testing
    and confidence intervals.


    # Student’s t-Distribution


    +   - Formula:


    ```

    $f(t) = \frac{\Gamma(\frac{\nu+1}{2})}{\sqrt{\nu\pi}\Gamma(\frac{\nu}{2})} \left(1
    + \frac{t^2}{\nu}\right)^{-\frac{\nu+1}{2}}$

    ```


    +   - Description: The t-distribution is used to estimate population parameters
    when the sample size is small and the population variance is unknown. It is defined
    by the degrees of freedom $\nu$.'
