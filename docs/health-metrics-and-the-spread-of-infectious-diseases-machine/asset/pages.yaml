- pgno: 201
  md: '# Practical Insights and Examples 183


    The interpretation of the decision tree is straightforward: each node represents
    a decision based on the value of a predictor, and the leaves represent the final
    classification. The tree can be pruned to reduce its complexity and improve its
    interpretability. The decision tree can be used to make predictions on new data
    by following the path to a leaf node based on the values of the predictors.


    # 11.1.3 Example: Ischemic Stroke Classification


    In this second example we will demonstrate classification (stroke vs. no stroke)
    using patient and plaque imaging features, and visualise model insights for stakeholder
    communication.


    The objective is to visualise how the model predicts whether a patient experienced
    a stroke (Stroke) based on imaging features (e.g., MaxStenosisByArea, CALCVolProp)
    and risk factors (e.g., age, DiabetesHistory).


    Visualise:


    +   - Variable importance

    - Prediction performance (e.g., ROC curve)

    - Partial dependency of key features


    Load necessary libraries, and fit a random forest model to the data with the rand_forest()
    function from the tidymodels package. We will use the ranger engine for the random
    forest model set and set the model to classification.


    ```

    library(tidyverse)

    library(tidymodels)

    library(vip)

    library(DALExtra)

    library(pROC)

    ```


    The model specify the number of trees to grow, the minimum number of observations
    in a node before a split is attempted, and the maximum depth of the tree. The
    set_engine() function specifies the engine to use for the model, in this case
    ranger, and the set_mode() function specifies the mode of the model, in this case
    classification.


    ```

    rf_spec <- rand_forest(trees = 500, min_n = 5) %>%

    set_engine("ranger", importance = "impurity") %>%

    set_mode("classification") %>%


    rf_wf <- workflow() %>%

    add_formula(Stroke - .) %>%

    add_model(rf_spec)


    rf_fit <- rf_wf %>%

    fit(data = stroke_train)

    ```


    # 11.1.3.1 Variable Importance


    The object rf_fit contains the fitted model. We can extract the model specification
    and use the vip() function to visualise what the predictors most influence the
    model. The vip() function creates a variable importance plot, which shows the
    importance of each predictor in the model. The importance is calculated based
    on the Mean Decrease in Impurity (MDI) for each predictor.'
