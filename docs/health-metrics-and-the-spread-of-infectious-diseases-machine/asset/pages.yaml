    \ Summary of the DALYs' Components\n\n# 4.6.1 YLL Components\n\nThe components\
    \ of YLLs include several factors that contribute to the calculation of premature\
    \ death due to a disease or injury. These components are:\n\n+   **Age at death:**\
    \ The age at which a person died due to a disease or injury is a crucial component\
    \ of YLL. The earlier the age at death, the greater the impact on potential years\
    \ of life lost.\n\n+   **Life expectancy:** The expected age of death in a population\
    \ without the disease or injury is an important component of YLL. This value is\
    \ used to compare the actual age at death with the expected age at death and determine\
    \ the number of years of life lost.\n\n+   **Standard life expectancy:** To make\
    \ comparisons across populations and over time, YLL is often expressed relative\
    \ to a standard life expectancy, typically set at an age of 70 years.\n\n+   **Population\
    \ size:** The size of the population affected by a disease or injury is another\
    \ important component of YLL. A larger population will have a greater impact on\
    \ overall YLL, regardless of the age of death.\n\n+   **Cause of death:** The\
    \ cause of death is also considered when calculating YLL, as different causes\
    \ may have different impacts on potential years of life lost.\n\n# 4.6.2 YLDs\
    \ Components\n\nThe estimation of YLDs requires certain epidemiological parameters\
    \ such as prevalence, incidence, case-fatality rate, relative risk, odds ratio,\
    \ hazard ratio, mean, incidence ratio, severity, duration and remission."
