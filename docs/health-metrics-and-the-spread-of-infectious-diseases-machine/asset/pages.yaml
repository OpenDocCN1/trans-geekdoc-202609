- pgno: 152
  md: '# 9.2 Example: Dengue Test Predictions for 2017-2021


    Predictive modelling is a powerful tool for forecasting future trends. Here we
    test the Dengue''s model made with `mlr3 meta-package in Chapter 8. The model
    was trained on data from 1990 to 2016 and now tested for 2017 to 2021.


    First we load the original data and name it old_data.


    ```

    library(tidyverse)

    library(data.table)

    ```


    ```

    old_data <- hmsidWR::infectious_diseases %>%%

    arrange(year) %>%%

    filter(case_name == "Dengue",\year==2017,

    !location_name %in% c("Eswatini", "Lesotho")) %>%%

    drop_na() %>%%

    group_by(location_id) %>%%

    select(-location_name, -case_name)

    ```


    Then, we load Dengue data from 2017 to 2021 and name it new_data.


    ```

    new_data <- hmsidWR::infectious_diseases %>%%

    arrange(year) %>%%

    filter(case_name == "Dengue",

    year==2017,

    !location_name %in% c("Eswatini", "Lesotho")) %>%%

    drop_na() %>%%

    group_by(location_id) %>%%

    select(-location_name, -case_name)

    ```


    In the next step, we use the trained models from Chapter 8 to make predictions
    on the new data. The predictions are stored in `new_pred_regr.cv_glmnet` and `new_pred_regr.cv.xgboost`.
    The resampling results: `r1$learners` and `r2$learners`, contain the trained models,
    in particular the first of 5 folds cross validation sample is used for the predictions.


    ```

    new_pred_regr.cv_glmnet <-

    r1$learners[[1]]$predictnewata(new_data,

    task = r1$task)

    ```


    This object contains the predictions for the new data, and we can access the response
    data by:


    ```

    new_pred_regr.cv_glmnet$data$response

    ```


    With the support of `data.table::as.table()` we create a new column ape to evaluate
    the Absolute Percentage Error (APE). Here are the first 6 rows of the data:


    ```

    data.table::as.table(new_pred_regr.cv_glmnet) %>%%

    mutate(ape = round(abs(truth - response)/truth*100) %>%%

    head()

    ```'
  merge: -1
  img_proc: true
- pgno: 153
  md: "# Example: Dengue_ids Test Predictions for 2017-2021\n\n```\n#> row_ids truth\
    \ response ape\n#> <int> <num> <num> <num>\n#> 1: 1 3.3219788 3.2615171 1.8\n\
    #> 2: 2 2.2361377 2.2855594 2.2\n#> 3: 3 0.5021275 0.6403621 27.5\n#> 4: 4 3.2737870\
    \ 3.2193092 1.7\n#> 5: 5 0.4893329 0.6327545 29.3\n#> 6: 6 2.3045710 2.3715889\
    \ 2.9\n```\n\nAnd calculate some metrics to evaluate the model performance on\
    \ new data. The Mean Absolute Percent Error (MAPE), the Mean Squared Error (MSE),\
    \ and the Root Mean Squared Error (RMSE). The MAPE is a measure of prediction\
    \ accuracy, while the MSE and RMSE are measures of the average squared difference\
    \ between predicted and actual values.\n\n```\ndata.table::as.table(new_pred_regr.cv_glmnet)\
    \ %>%%\nmutate(ape = round(abs(truth - response)/truth)*100) %>%%\nsumise(mape\
    \ = mean(ape),\n       mse = mean((truth - response)^2),\n       rmse = sqrt(mean((truth\
    \ - response)^2)))) round(3)\n#> mape mse rmse\n#> 1 11.413 0.01 0.098\n```\n\n\
