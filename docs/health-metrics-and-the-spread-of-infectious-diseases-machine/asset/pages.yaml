- pgno: 187
  md: "# Example: Visualising Lung Cancer Deaths by Age in Germany\n\nIn addition\
    \ to colors, patterns can be used to differentiate between the groups in the plot.\
    \ The {ggpattern} package provides a variety of patterns that can be used to fill\
    \ the bars in a bar plot. Here we used the geom_col_pattern() function to add\
    \ patterns to the bars in the plot. An example is shown in the plot with the barplot.\
    \ Another way is to use the linetype or shape aesthetics to differentiate groups\
    \ in a line plot or scatter plot.\n\n# 10.4.2 Theme, Legends, and Guides\n\nLegends\
    \ and guides are essential for interpreting visualisations. They help the audience\
    \ understand what different colors, shapes, or sizes represent in the plot. Here\
    \ we have just changed the title of the legend, but much can be done, such as\
    \ changing the position, and labels. To change the position of the legend we can\
    \ use the theme() function as shown below.\n\nIn the R console, typing ?theme()\
    \ will provide more information on customised the appearance of your plots. In\
    \ this case it is useful to adjust the angle of the text in the x-axis, and this\
    \ can be done by specifying the angle parameter in the theme() function.\n\nThe\
    \ guides() function can be used to customise the legend, such as reversing the\
    \ order of the legend items.\n\n```\n# Customising a legend to a plot\nlineplot1\
    \ <- ggplot +\n  labs(linetype = \"Sex\"\n```\n\n# 10.4.3 Plot Layouts\n\nThe\
    \ layout of your plots can significantly impact their effectiveness. Arranging\
    \ multiple plots in a grid can help compare different aspects of your data side-by-side.\
    \ We can use the grid.arrange() function from the {gridExtra} package to arrange\
    \ multiple plots in a grid layout. Or, we can use the layout() function to specify\
    \ the layout of the plots. There are other packages that can be used with {patchwork}\
    \ and {cowplot}, which provide additional functionalities for arranging plots.\n\
    \n```\n# Example: Arranging multiple plots\nlibrary(gridExtra)\n\ngrid.arrange(lineplot,\
    \ lineplot1, lineplot2, ncol = 3)\n```"
  merge: -1
