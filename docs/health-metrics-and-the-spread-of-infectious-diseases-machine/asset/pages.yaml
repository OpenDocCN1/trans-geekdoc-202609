  md: '# Practical Insights and Examples


    Data are already split into training and test sets, we will combine them for the
    analysis. The stroke_train and stroke_test datasets contain 89, 37 observations
    respectively and 29 variables. Within the variables we have information on volume,
    proportion, area of the arterial wall, among others. The target variable is Stroke,
    which indicates whether the patient has had a stroke or not.^4


    We select variables of interest for the analysis with any_of(), a function to
    select the variables based on their names.


    ```

    ?any_of() for more information based on the function.

    selected_train <- stroke_train %>%

    dplyr::select(any_of(VC_preds), Stroke)

    ```


    To check which in stroke_train dataset were not selected:


    ```

    setdiff(names(stroke_train), names(selected_train))

