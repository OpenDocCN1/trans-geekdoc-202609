- pgno: 94
  md: "The difference between y and \\tilde{y} is the error we make when applying\
    \ a model.\n\n$$y - \\tilde{y} = \\epsilon$$\n\nReducing the error (\\epsilon)\
    \ as much as possible can lead to better fit of the model.\n\nWhile the case of\
    \ having just one predictor influencing our response variable might be useful\
    \ for educational purposes, as illustrated in the data above, scenarios involving\
    \ more than one predictor are more realistic and lead to increased complexity\
    \ in the model function. This situation typically results in a multivariate linear\
    \ model, referred to as **linear regression**.\n\n$$y = \\beta_0 + \\beta_1 x_1\
    \ + \\beta_2 x_2 + \\dots + \\beta_n x_n$$\n\nIn this case more than one predictor\
    \ is used to investigating the effects of the response as: A compact model of\
    \ the model function with more than one predictor can be stated\n\n$$y = \\beta_0\
    \ + \\sum_{i=1}^{p} \\beta_i x_i = \\beta_0 + \\beta X$$\n\nIn this notation,\
    \ the capital X represents the head of a matrix containing various $x_i: X = (x_1,\
    \ x_2, x_3, \\dots, x_p)$, the predictors, and the $\\beta = $(\beta_1, \\beta_2,\
    \ \\beta_3, \\dots, \\beta_p)$ are the coefficient to be estimated.\n\nValuable\
    \ insights into the trends and drivers of cholera may be gained in order to inform\
    \ public health interventions and policies at reducing the burden of the disease.\n\
    \nIf we were to investigate this as we had not seen before and looked at some\
    \ point in time, let's say between June and August 1849- we could have thought\
    \ that the trend was linear and growing in time. And actually until some point,\
    \ as we know what happened next. In the first plot model (blue line) is obtained\
    \ with the geom_smooth() function with the specification method = \"lm\". In the\
    \ second plot we have used all data up to August, and we can clearly see the infections\
    \ spread smoothly to finally explode shaping an elbow curve. The geom_smooth()\
    \ selected the best function that suits the data with a **locally estimated smoothing**,\
    \ or LOESS, which is a nonparametric method for smoothing a series of data in\
    \ which no assumptions are made about the underlying structure data.\n\n```\n\
    cholera %%\nfilter(date >= \"1849-06-01\" & date <= \"1849-08-01\") %%%\ngpglot(aes(x\
    \ = date, y = deaths)) +\ngeom_point() +\ngeom_smooth(method = \"lm\", se = F)\
    \ +\nlabs(\n  title = \"Deaths due to Cholera in London (June to August 1849)\"\
    ,\n  subtitle = \"Linear Model\",\n  x = \"Date\", y = \"N. deaths\")\n```\n\n\
    ```\ncholera %%\nfilter(date <= \"1849-08-01\") %%%\ngpglot(aes(x = date, y =\
    \ deaths)) +\ngeom_point() +\ngeom_smooth(se = F) +\n```"
