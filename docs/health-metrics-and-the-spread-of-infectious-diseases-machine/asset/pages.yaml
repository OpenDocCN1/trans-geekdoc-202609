- pgno: 112
  md: 'As mentioned in the history of health metrics (Chapter 2), the cost-utility
    framework has been employed for calculating QALYs. Over time, this measure has
    been criticised for potentially discriminating against certain disabilities in
    the population by assigning costs that were perceived as either too high or too
    low, and for failing to capture the full spectrum of human health conditions.


    Moreover, comprehensive tools that assess the impacts through cost-effectiveness
    measures to estimate the effectiveness of health interventions should also include
    a measure of disability. The measure of DALYs (Disability-Adjusted Life Years),
    developed in 1993, took major consideration of the disability status in evaluating
    the well-being of a population. It was further enhanced by incorporating a layer
    based on disability weights.


    In summary, the measures for a cost-effectiveness intervention involve a careful
    calibration of following components: mortality, morbidity, and disability.'
