  img_proc: true
- pgno: 61
  md: '# Incidence and Prevalence


    ```

    Incidence rate = number of new cases at time t * 1000 / total population at risk
    (4.7)

    ```


    +   - Prevalence measures the total number of cases of a disease in a population
    at a given time, including both new and existing cases. It is expressed as a proportion
    of the population and helps to provide a snapshot of how widespread the disease
    is.


    The prevalence identifies the burden of disease at a specific time, rather than
    the probability of the disease to impact on the population, it expresses the probability
    of suffering from a disease, it is based on the total number of existing cases
    among the whole population.


    ```

    Prevalence = number of new + existing cases at time t / total population (4.8)

    ```


    Like incidence, it can be multiplied by a factor of 10^n (where n is typically
    1,000, 10,000, or 100,000) to express the prevalence over a standard number of
    people.


    # Table 4.5 Example Influenza Incidence and Prevalence Data


    | Metric | January | April | July | October | December |

    |---|---|---|---|---||}{

    | Incidence (new cases per 1,000) | 5 | 3 | 1 | 2 | 6 |

    | Prevalence (existing cases per 1,000) | 15 | 10 | 5 | 7 | 20 |


    In summary, incidence measures the rate of cases arising within a population over
    time, while prevalence measures the proportion of existing cases within the population
    at a specific point in time. These metrics are widely used in the literature and
    form the basis for many decisions in public health and clinical practice. They
    are discussed in foundational texts like “Epidemiology: An Introduction” by Kenneth
    J. Rothman and in guidelines by health institutions that use the Centers for Disease
    Control and Prevention (CDC) and the World Health Organization (WHO). Both metrics
    are crucial for understanding the dynamics and burden of diseases within populations.


    # 4.4.1 Use of Prevalence in DALYs Calculation


    In the context of the Global Burden of Disease (GBD) study, the use of prevalence
    in the calculation of Disability-Adjusted Life Years (DALYs) is pivotal because
    DALYs aim to measure both the current impact of diseases and long-term effects
    on populations this metric combines years of life lost due to premature mortality
    (YLLs) with years lived with disability (YLDs). In particular, for YLDs calculations,
    prevalence rather than incidence is used for several:


    +   - Direct Measurement of Burden: Prevalence data directly reflects the current
    burden of disease in the population, including both new and ongoing cases. It
    provides a snapshot of all individuals affected by the disease at a given time,
    which is essential for calculating the total amount of health loss to disabilities.


    +   - Incorporation of Disease Duration: Using prevalence allows calculation of
    YLDs to incorporate the duration of the disease until recovery or death. This
    is because prevalence captures both existing and new cases during the period of
    measurement.


    +   - Complexity of Disease Models: Many chronic diseases or conditions with long
    duration are better captured through prevalence data. This approach simplifies
    the modelling by'
