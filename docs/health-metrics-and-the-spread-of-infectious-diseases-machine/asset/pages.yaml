    \ + \nlabs(title = \"Small-World Network with Infection Status\",\ny = \"Longitude\"\
    , y = \"Latitude\", shape = \"Presence\") + \ntheme(legend.position = \"right\"\
    )\n```\n\n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_223_0.png)\n\n(a) Observed\
    \ Size of Infections\n\n(b) Map of Infection Status and Small-World Network\n\n\
    Figure 12.8 Map of Central African Rep.\n\nThe clustering of close-proximity contacts\
    \ that occurs within individuals is an important factor in the spread of diseases\
    \ and subject of many mathematical models.\n\n# 12.5.1 The Euclidean Distance\n\
    \nTo estimate the likelihood of transmission between individuals based on their\
    \ spatial proximity the Euclidean distance is used. It is calculated as the square\
    \ root of the sum of the squares of the differences between corresponding coordinates\
    \ of the two points.\n\nThe Euclidean distance formula:\n\n> $d_{i,j} = \\sqrt{(x_i\
    \ - x_j)^2 + (y_i - y_j)^2}$ (12.1)\n\nWhere $(x_i, y_i)$ are the coordinates\
    \ (e.g., latitude and longitude) of the first point (A), e.g., infected individual,\
    \ and $(x_j, y_j)$ are the coordinates of the second point (B), e.g., susceptible\
    \ individual or location.\n\nIt calculates the straight-line distance between\
    \ two points in a two-dimensional space, which can be applied to model the spatial\
    \ spread of infectious diseases based on the proximity of individuals or locations.\n\
    \nTo calculate the Euclidean distance we make a function that considers the distance\
    \ between the center of mass and the infection coordinates."
  merge: -1
  img_proc: true
- pgno: 224
  md: "# B\n\n![](img/6b61f0d3dcab44c60cdfe4e888d549c9_224_0.png)\n\n**Figure 12.9**\
    \ Representation of Euclidean Distance between Points A and B\n\n```\n# helper\
    \ function for calculating euclidian distance metric\neclidean_distance <- function(longitude,\
    \ latitude,\n  long_com, lat_com) {\n  long_distances <- (longitude - long_com[i])^2\n\
    \  lat_distances <- lat_com[1])^2\n  return((long_distances + lat_distances) *\
    \ 0.5)\n}\n```\n\nThere are other type of distance metrics that can be used, such\
    \ as the **Manhattan** distance, which calculates the sum of the absolute differences\
    \ between the coordinates of two points, the **Mahalanobis** distance, which considers\
    \ the correlation between the variables, and the **Chebyshev** distance, which\
    \ calculates the maximum difference between the coordinates of two points.\n\n\
    # 12.5.2 Spatial Autocorrelation\n\nSpatial autocorrelation refers to the principle\
    \ that spatial data points close to each other are more likely to have similar\
    \ values than those apart. By analysing the spatial distribution of cases, areas\
    \ with high spatial indicated clusters where infections spread is particularly\
    \ intense.\n\nUsing tools like **Moran's I** and its variants, infection hotspots\
    \ can be detected by identifying areas where high case cluster together. To check\
    \ the presence of spatial autocorrelation the **Global Moran's** law is used:\n\
    \n> $I = \\frac{N \\sum_{i=1}^{N} \\sum_{j=1}^{N} w_{ij}(x_i - \\bar{x})(x_j -\
    \ \\bar{x})}{W \\sum_{i=1}^{N} (x_i - \\bar{x})^2}$$ (12.2)\n\nWhere $x_i$ and\
    \ $x_j$ are the values of the variable of interest at location $i$ and $j$, $\b\
    ar{x}$ is the mean value and $N$ indicates the number of spatial units, and $w_{ij}$\
    \ are the spatial weight between locations.\n\nI measures the degree to which\
    \ infection is clustered, dispersed or randomly distributed, with values ranging\
    \ from -1 indicating perfect dispersion to +1 indicating perfect spatial clustering.\
    \ A value of 0 indicates no spatial autocorrelation, suggesting a random spatial\
    \ pattern."
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Dynamics of Disease Transmission


    We use the **spdep** package, which provide **dnearneigh()**, **nb2listw()**,
    and **moran.test()** functions for calculating the neighbourhood contiguity by
    distance, spatial weights for neighbours lists, and finally Moran’s I for spatial
    autocorrelation, respectively.


    ```

    library(spdep)

    library(sp)

    ```


    ```

    coordinates(df) <- -longitude + latitude

    # Define neighbours (using a distance threshold, for example)

    # Neighbours within a distance of 2 units

    b <- dnearneigh(coordinates(df), 0, 2)


    # Create spatial weights

    lw <- nb2listw(nb, style="W")


    # Calculate Moran''s I for infections

    moran_result <- moran.test(df$cases, lw)

    moran_result

    >

    # Moran I test under randomisation

    >

    # data: df$cases

    # weights: lw

    >

    # Moran I statistic standard deviate = -0.18432, p-value = 0.5731

    # alternative hypothesis: greater

    # sample estimates:

    # Moran I statistic          Expectation          Variance

    #               -0.012604350      -0.010101001      0.0001844513

    ```


    The result of Moran’s I of -0.013 shows a slight negative spatial autocorrelation,
    indicating that the location of individuals is slightly dispersed across the region.
    This suggests that the spatial distribution of infections is not significantly
    clustered or dispersed, but rather randomly distributed. The p-value of 0.5731
    indicates that the observed Moran’s I is not statistically significant, suggesting
    that the distribution of infections is consistent with a random spatial pattern.
    And we know it is as we have simulated the data.


    # 12.5.3 Spatial Proximity with Kriging


    Although Moran’s I is useful for understanding the overall spatial pattern of
    infections, it does not provide detailed information on the spatial distribution
    of cases across the region. To estimate the spatial distribution of infections
    and predict the risk of outbreaks, we can use spatial interpolation techniques
    such as **Kriging**.⁵


    This method is used to estimate the spatial distribution of cases by creating
    a raster of the predicted spatial distribution of infections. It creates a continuous
    surface that estimates the risk of infection across the entire area by interpolating
    the number of individuals across a region.


    > ⁵Kriging.” July 18, 2024, https://en.wikipedia.org/w/index.php?title=Kriging&oldid=1235203584.'
