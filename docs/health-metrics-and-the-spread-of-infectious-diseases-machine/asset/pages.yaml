- pgno: 233
  md: "# Example: Detecting Interaction Effects with Contour Plots\n\npredictors setting\
    \ up the values for the coefficients $\beta_0$, $\beta_1$, $\beta_2$, and $\b\
    eta_3$, and the predictors $x_1$ and $x_2$ and the error term $\\epsilon$.\n\n\
    Load the necessary libraries and set the seed for reproducibility.\n\n```\nlibrary(tidyverse)\n\
    set.seed(123)\n```\n\nSimulate the data ready for interaction effects.\n\n```\n\
    beta0<- rep(0,200)\nbeta1<- rep(1,200)\nbeta2<- rep(1,200)\n```\n\nThen, simulate\
    \ the predictors $x_1$ and $x_2$ and the error term $\\epsilon$ for 200 observations.\n\
    \n```\nx1<- runif(200, min = 0, max = 1)\nx2 <- runif(200, min = 0, max = 1)\n\
    e <- rnorm(200)\n```\n\nThen for each of the three cases we simulate a $\beta_3$\
    \ based on antagonism, interaction, or synergy with values -10, 0, and 10.\n\n\
    # ### Case 1: Antagonism\n\n```\nbeta3 <- rep(-10,200)\n```\n\nAssemble the values\
    \ for the predictors into the equation, to obtaining the response variable $y$.\
    \ This will be our synthetic \"observed\" data.\n\n```\ny1 = beta0 + beta1*x1\
    \ + beta2*x2 + beta3*(x1*x2) + e\n```\n\nApply a linear model to the observed\
    \ data to predict the response variable $y$ based on interaction between $x_1$\
    \ and $x_2$.\n\n```\nobserved1 <- tibble(y1, x1, x2)\n```\n\n```\nmod1 <- lm(y1\
    \ - x1*x2, data = observed1)\nobserved1$z <- predict(mod1, observed1)\n```\n\n\
    Then create a grid of values for $x_1$ and $x_2$ to predict the response variable\
    \ $y$ based on the interaction\n\n```\ngrid <- with(observed1,\n  interp(x = x1,\
    \ y = x2, grid$grid))\ngriddf <- subset(data.frame(x = rep(grid$x, nrow(grid$z)),n\
    \  y = rep(grid$y),\n  each = ncol(grid$z),\n  z = as.numeric(grid$z)),!is.na(z)\n\
    ```\n\n```\np1 <- ggplot(griddf, aes(x, y, z = z) + \ngeom_contour(aes(colour\
