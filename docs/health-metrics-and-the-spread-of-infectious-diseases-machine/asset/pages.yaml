  img_proc: true
- pgno: 226
  md: '# 208 Spatial Data Modelling and Visualisation


    For example, the application of Kriging used to predict the spatial distribution
    of Dengue outbreaks in regions like Khyber Pakhtunkhwa, Pakistan.6 Similarly,
    during the COVID-19 pandemic, Empirical Bayesian Kriging (EBK) was used to estimate
    the spatial distribution of COVID-19 cases in sub-Saharan Africa. This approach
    combined series of data with socio-economic indicators to create detailed spatial
    risk maps, aiding in understanding and controlling the outbreak.


    Particularly useful for visualising the spatial dynamics of disease spread, while
    considering the impact of environmental factors such as temperature, or humidity
    on disease transmission: Kriging requires an estimation of the variance of points
    locations.


    For estimating the variance, a variogram model is fit to the observed data. The
    variogram is a function of the distance h that describes the degree of spatial
    dependence of a random field or stochastic process. It takes consideration of
    the spatial auto-correlation of the data. For instance, the number of cases observed
    in one location are supposed to be correlated with the number of cases observed
    nearby locations. This also considers environmental variables that interact with
    the disease transmission.


    The variogram model:


    ```

    $$\gamma(h) = \frac{1}{2N(h)} \sum_{i=1}^{N(h)} (Z(x_i) - Z(x_i + h))^2$ (12.3)

    ```


    Where: $\gamma(h)$ is the semivariance, $N(h)$ is the number of pairs of points
    separated by a distance $h$, $Z(x_i)$ is the value of variable at location $x_i$,
    and $Z(x_i + h)$ is the value of the variable at location $x_i + h$.


    We use the gstat package to perform Kriging with variogram().8,9 and gstat functions
    to perform Universal Kriging, a kriging method that allows to incorporate an external
    drift, such as temperature. The predictions are visualised on the grid of points
    generated earlier, with warmer colours indicating higher predicted values.


    ```

    v <- variogram(object = cases - temperature

    ```


    > 6Ahmed et al., "Spatial Modelling of Dengue Prevalence and Kriging Prediction
    of Dengue Outbreak in Khyber Pakhtunkhwa (Pakistan) Using Presence Only Data.,
    Stochastic Environmental Research and Recovery 34, no. 1 (2020): 1023-36, doi:
    10.1007/s40977-020-01818-9.


    > 7Ambo Anwar Omar et al., "Using Machine Learning and Empirical Bayesian Kriging
    to Correlate Currents and Patterns of COVID-19 Disease Outbreak in Sub-Saharan
    Africa: Exploratory Data Analysis," n. doi: 10.1101/2020.04.27.2062057.


    > 8Edzer J Pebesma, "Multivariable Geostatistics in s: The Gstat Package," Computers
    & Geosci 30, no. 7 (2004): 683-694, doi: 10.1016/j.cageo.2004.03.012.


    > 9Hans Wassernagel, "Linear Regression and Spatial Kriging," ed. Hans Wassernagel
    (Berlin, Heidelberg: Springer, 2003), 15-26, doi: 10.1007/978-3-662-05294-5_3.'
