  md: '# Epidemiology


    mild illnesses to severe respiratory infections, and can have devastating effects
    on public health and economies.


    # Examples of Zoonotic Viruses:


    +   1. Influenza (Flu) Viruses: Avian (bird) flu and swine (pig) flu.

    2. Coronavirus: SARS, MERS, and COVID-19 from fruit bats, pangolins.

    3. Ebola Virus: Likely originated from fruit bats.

    4. HIV/AIDS: Believed to have originated from non-human primates (chimpanzees).

    5. Rabies: Spread from infected animals like dogs, bats, and raccoons.


    On January 30, 2020, The World Health Organization (WHO) declared the COVID-19
    Outbreak a Public Health Emergency of International Concern, and a worldwide investigation
    started to understand more about the virus and its effects on humans. This challenge
    involved the unprecedented identification of this type of virus, requiring thorough
    testing and confirmation of the incubation period, recovery rate, and infection
    rate through the collection of cases globally.


    The virus spreads primarily through respiratory droplets. Symptoms include loss
    of taste and smell, fatigue, muscle aches, and gastrointestinal issues, with fever,
    cough, and shortness of breath. Severe cases can lead to pneumonia, acute respiratory
    distress syndrome (ARDS), and death. The emergency was primarily due to the high
    number of deaths occurring without known pharmacological intervention to contain.


    Various preventive measures were established, but the presence of asymptomatic
    and symptomatic cases created challenges in identifying the incubation time, leading
    governments to impose restrictions through lockdowns of entire cities and regions
    in affected countries. These measures restricted movement and activity to curb
    the virus''s transmission.


    +   Some notable examples of lockdown measures include:

    - China: The initial epicenter in Wuhan experienced strict lockdowns, with entire
    cities quarantined and movement heavily restricted. These measures were effective
    in reducing the initial spread of the virus.

    - Italy: One of the first European countries severely impacted, Italy imposed
    nationwide lockdowns in March 2020, closing schools, businesses, and restricting
    travel.

    - United States: Lockdown measures varied by state, with significant restrictions
    during the early waves of the pandemic. These included stay-at-home orders, business
    closures, and mask mandates.

    - India: Implemented one of the world''s largest lockdowns in March 2020, affecting
    millions of people and including travel bans and business closures.

    - Australia: Used localised lockdowns, particularly in cities like Melbourne,
    which saw extended periods of strict restrictions.

    - United Kingdom: Imposed several lockdowns, including a strict lockdown in early
    2021, with tiered restrictions based on regional infection rates.


    The pandemic has led to widespread healthcare challenges, economic disruptions,
    and significant changes to daily life, including social distancing measures, lockdowns,
    and travel restrictions.


    Since its identification, COVID-19 has caused multiple outbreaks globally. The
    incubation period ranges from 2 to 14 days, during which an infected person may
    be asymptomatic'
