    # Chapter 15: Decision Tree


    In this chapter, we will understand how to create a decision tree. The decision
    tree forms the basis for random forest and XGBoost – the two most widely used
    algorithms today.


    So let''s start this with an example. In this example, we are trying to predict
    the likelihood of an individual getting heart disease, and three factors (blood
    pressure, sugar and cholesterol) are considered.


    ![image](Images/file50.png)


    The crucial aspect in creating the decision tree is to find the root node that
    is where to start the tree from. Should I start with blood pressure or sugar or
    cholesterol? The root node is the base node of the tree from which the entire
    tree starts.


    A decision tree is constructed like the below.


    ![image](Images/file51.png)


    The root node of the decision tree can be found using the GINI index or entropy.
    We will see in detail how to use GINI in finding the root node. Each factor will
    be considered in isolation to compute the GINI index.


    The formula for GINI index is **GINI index = 1 – (prob of yes)² – (prob of no)²**


    Acronym prob stands for probability.


    The Gini Index is calculated by subtracting the sum of the squared probabilities
    of each class from one. The GINI index varies between 0 and 1


    Let us compute the GINI index for high BP (blood pressure).


    ![image](Images/file52.png)


    The tree can be interpreted as follows. Out of all people with high blood pressure
    (true node), 105 people developed heart disease (HD), and 39 people did not develop
    heart disease. Out of all the people who did not have high blood pressure (false
    node), 34 people developed heart disease and 125 people did not develop heart
    disease.


    The Gini index for a true node is 0.395, and the Gini index for a false node is
