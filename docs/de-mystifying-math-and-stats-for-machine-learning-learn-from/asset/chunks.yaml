    采样时的另外一个方面是随机采样。随机采样确保了在选取样本进行反馈或进行任何类型的研究时不会产生偏差。


    在下方的示例中，样本中（右侧组的球）有一个黄球、一个红球、一个蓝球和两个绿球。从总体（左侧组的球）中选取一个蓝球，我可以选取编号为 `6`、`8`、`9`、`11`、`14`
    或 `17` 的球。相反，我选择了一个编号为 `6` 的球。我也可以选择 `8` 或 `11`、`9`、`14`、`16` 或 `17`。


    ![随机采样示例图像](img/file20.png)


    总体中的每个蓝球被选入样本的概率均相等。如果我确保每个蓝球被选中的概率相等，那么我就确保了采样的随机性。


    如果你试图从某大学的 20 名学生（该大学总人数为 100 人）收集关于加入某特定学校的意见或反馈，你可以询问你熟悉的这 20 名学生或 100 名学生中的任何一个。前者更容易实现，但会引入偏差。后者相对更耗时且具挑战性，但能提供更好的结果。


    偏差会降低机器学习的准确性，从业者应该注意确保样本的随机性。


    # 第 9 章：假设检验


    假设检验是一种统计分析方法，其中对你对总体参数的假设进行测试。假设检验根据我们对样本的研究，验证我们对总体所得出的推理。


    与假设检验相关的两个概念是原假设和备择假设。


    **原假设（Null Hypothesis）**是假设该事件不会发生的假设。除非原假设被拒绝，否则原假设对研究结果没有影响。`H[0]` 是它的符号，读作
    H-naught（零）。


    **备择假设（Alternate Hypothesis）**是原假设的逻辑对立面。备择假设的接受建立在原假设被拒绝之后。


    `H[a]` 是它的符号。


    简单来说，备择假设是我们试图证明的，而原假设是我们试图证明的相反面。我们并不直接证明某个假设。相反，我们要么接受或拒绝备择假设。这就是我们进行假设检验的方法。


    我们使用化肥来促进植物生长，而生长取决于化肥的合理使用。如果我们要检查一种名为 A 化肥的特定类型是否增加了植物生长，我们将如下陈述原假设和备择假设。


    ![手、种子和植物的图像](img/file21.png)


    `H[0]`：使用 A 化肥不会增加植物生长。


    `H[a]`：使用 A 化肥会增加植物生长。


    备择假设是我们试图证明的，而我们试图证明的内容被称为备择假设。而它的对立面被称为原假设。我们为什么要采取这条路线？如果你支持一个假设一万万次，然后在第 1,000,001
    次时你拒绝了它，那么这个假设就是错误的。


    **第一类错误和第二类错误：**


    尽管假设检验旨在是可靠的，但它们并不是 100% 确定的。假设检验可能会导致两种类型的错误。


    **第一类错误（Type 1 Error）**：当原假设正确但被拒绝时，就会发生第一类错误。这被称为假阳性（false positive）。


    **第二类错误（Type 2 Error）**：当原假设错误但未被拒绝时，就会发生第二类错误。这被称为假阴性（false negative）。


    一位老年男性被诊断为怀孕，或者一位足月的孕妇未被诊断为怀孕，都是第一类和第二类错误的经典例子。在现实生活中你会遇到这类错误。


    因此，我们采用置信水平（confidence level），这意味着我对基于样本对总体所做的推理有多大的信心。95% 的置信水平意味着有 5% 的错误概率。


    疾病预测算法需要更高的准确性，例如 99.9%，因为在医疗场景中我们谈论的是生死问题。同一医疗行业中的销售过程可能接受 90% 的置信水平。


    做出这些决策时必须考虑多个因素，如时间、成本和样本的关键性。


    # 第 10 章：离群值


    离群值是数据中的极端点，可能会偏斜结果。它们影响着我们模型的准确性。


    ![测试分数](img/file22.png)


    这个概念与机器学习有什么关系？你的数据集中可以负担起存在离群值吗？可以，但你应该处理它们。


    **箱线图（Box plot）**


    箱线图是描绘分布的一种方便方法。它使用了中位数、上下四分位数（分别为第 25 75 分位数）。如果下四分位数是 `Q1`，上四分位数是 `Q3`，那么差 `Q3-Q1`
    被称为四分位距或 `IQR`。


    箱线图的边界计算方式如下：


    1. 下边界：`Q1-1.5*(Q3-Q1)`

    2. 上边界：`Q3+1.5*(Q3-Q1)`


    超出下边界或上边界的点被视为离群值。


    ![理解箱线图](img/file23.png)


    已经解释了如何在 Excel 中使用箱线图。使用一个包含 156 个发票金额的数据集来创建箱线图并识别离群值。


    1. 选择数据点 (Images/file24.png)

    2. 点击`插入`(Images/file25.png)

    3. 选择`推荐图表`(Images/file26.png)

    4. 选择`所有图表`选项卡 (Images/file27.png)

    5. 选择`箱形图`(Images/file28.png)


    现在你得到了箱线图 (Images/file29.png)。这里的离群值清楚地以点的形式显示。我们可以手动从箱线图中移除离群值，也可以使用 Python 或
    R 或其他编程语言来创建箱线图并编程移除离群值。


    # 第 11 章：机器学习概念


    在本章中，我们将学习机器学习概念。但在学习机器学习概念之前，让我们先了解什么是人工智能。


    人工智能是像人类一样思考和行动的计算机软件。软件可能存在于硬件实体中，但它本质上是软件。我们已经意识到人工智能是一个快速发展的领域，应用于医疗保健、电信、银行业、零售、社交媒体等。


    人工智能（AI）有两种：


    **强人工智能（Strong AI）**：


    强人工智能是指能够人类水平思考并表现出推理和思考等人类行为的软件系统。我们还没有达到。这种人工智能仍在研究中。


    **弱人工智能（Weak AI）**：


    弱人工智能涉及通过检测数据中有价值的模式来解决问题。这是目前人工智能的主流模式。


    **模式检测（Pattern Detection）**


