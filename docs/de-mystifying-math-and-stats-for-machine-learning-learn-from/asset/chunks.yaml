    in the sample. If I ensure that each of the blue balls has an equal chance of
    being picked up, then I have ensured randomness in the sampling.


    If you are trying to take an opinion or feedback for joining a particular school
    from 20 students of a college (the total strength of the college is 100), you
    can ask the 20 students known well to you or any of the 100 students. The former
