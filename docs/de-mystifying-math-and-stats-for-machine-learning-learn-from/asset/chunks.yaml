    ![image](Images/file53.png)


    ![image](Images/file54.png)


    These two values are used to determine the total gini.


    ![image](Images/file55.png)


    The same process is repeated for other scenarios (high sugar and high cholesterol),
    and the node with the lowest gini value goes to the root node. In the example
    below, the root node will be a scenario of high sugar.


    ![image](Images/file56.png)


    # Chapter 16: k Nearest Neighbours (kNN)


    In this chapter, we will understand the math behind kNN. kNN is k nearest neighbor.
    k nearest neighbor is used both in a classification supervised learning algorithm
    and in unsupervised learning.


    Let us understand this algorithm using an example. In the picture below, we are
    trying to find whether the green ball will go to the blue group or the red group.
    That decision will be based on the distance between the green ball and the nearest
    blue & red balls. The concept of Euclidean distance will be used to find the distance.


    ![image](Images/file57.png)


    The formula for Euclidian distance is


    ![image](Images/file58.png)![image](Images/file59.png)


    Euclidean distance is the shortest between the 2 points irrespective of the dimensions.
    The most common way to find the distance between two points is the Euclidean distance.


    For a given value of k, the algorithm will find the k-nearest neighbors of the
    green ball and then it will assign the green ball to either a blue or red group
    based on the distance. In the picture below, k is 4. The algorithm can expand
    the value of k to cover more red and blue balls to make the right decision.


    ![image](Images/file60.png)


    Let us look at one more example to understand this better. The table below provides
    the weight of seven employees and their corresponding height and age. How will
    you compute the weight of the eighth employee (last row) using the concept of
    kNN?


    | Employee || Height || Age || Weight |


    | --- | --- | --- | --- |


    | 1 || 6 || 40 || 60 |


    | 2 || 6.11 || 26 || 55 |


    | 3 || 5.9 || 30 || 56 |


    | 4 || 5.8 || 32 || 58 |


    | 5 || 5.3 || 33 || 75 |


    | 6 || 5.6 || 34 || 78 |


    | 7 || 5.5 || 35 || 80 |


    | 8 || 5.8 || 37 || ? |


    We compute the Euclidian distance for each of the seven employees’ data points
    to the eighth employee’s data points. The calculation below is for employee 1
    with respect to employee 8.


    x[2] – x[1]\= 6 – 5.8 = 0.2


    y[2] - y[1]\= 40 – 37 = 3


    (x[2] – x[1])² = 0.04


    (y[2] - y[1])² = 9


    (x[2] – x[1])² + (y[2] - y[1])² = 0.04 + 9 = 9.04


    Euclidian distance = $\\sqrt{9.04}$ = 3.01


    Similarly, we calculate the distance for the rest of the employees’ data points.
    The Euclidian distance of nearest (or lowest value) data points is considered,
    and, in this case, three nearest points are considered.


    ![image](Images/file61.png)


    The weights corresponding to these three highlighted employees are 60, 78 and
    80. Hence, the average of these data points (average of 60, 78 and 80) will be
    taken or predicted as the weight of the last employee. Therefore, the weight of
    the individual with a height of 5.8 and an age of 37 is expected to be 72.67 (the
    average of 60,78 and 80 is 72.67).


    # Chapter 17: Gradient Descent


    In this chapter, we will understand the concept of gradient descent. Every machine
    learning or deep learning algorithm is an optimization exercise, that is, the
    algorithm tries to reduce the difference between predicted and actual, which can
    also be called a loss. Loss corresponds to the difference between predicted minus
    actual in one iteration. A cost function is the average of the loss over multiple
    iterations.


    The algorithm attempts to minimize this cost or losses because the objective of
    any algorithm is to have a result that is as close to the actual as possible.
    We want the forecast accuracy to be higher, which means the cost function should
    be minimal, and the loss should be very low. This translates to the predicted
    value as close to the actual as possible. This is the optimization exercise.


    **Understanding the math in gradient descent**


    Let us understand this with an example. The insurance company is trying to predict
    whether an insurance policy should be issued to an individual or not based on
    six factors like age, sex etc., The algorithm works by identifying the relative
    importance or weights of these six factors. Once the relative importance or weights
    are known, it is easier to predict because we would know which factors are more
    important compared to the rest. The relative importance is denoted by W1, W2,
    W3 etc., corresponding to X1, X2, X3 etc.,


    If the two (W’s and X’s) are multiplied, we will have an output corresponding
    to the predicted value. Comparing the predicted value with the actual will give
    us the error value or loss. This feedback is fed back into the algorithm. If the
    feedback suggests a high error, the algorithm will try for a new set of relative
    weights. Multiple iterations of this exercise will help to finalize the relative
    weights. This is nothing but an optimization exercise and this is how the world
    of algorithms works. The process of giving feedback about the extent of error
    or loss so that a new set of relative weights are assessed is known as back propagation.
    This entire process is intuitive to the algorithm and is not visible even to the
    algorithm’s developer; hence this part of the algorithm is called a hidden layer.


    ![image](Images/file62.png)


    **Concept of Gradient Descent:**'
