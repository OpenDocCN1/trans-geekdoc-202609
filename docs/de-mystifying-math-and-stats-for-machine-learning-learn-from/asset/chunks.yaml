  trans: '

    如果你目前位于下图所示的 `x` 点，你知道如何回到基地。你已知必须沿着路线 1 行。然而，如果你是一个计算机机器人，你如何知道该走下去呢？你可以选择路线
    1 或路线 2，尽管路线 2 会比路线 1 耗费更多时间。


    ![image](img/file63.png)


    因此，梯度下降算法帮助我们做出这些决策。在这个过程中，算法会确定你是否更接近目标。如果你离目的地更近，你只需要迈更小的步；如果你远离目标，则需要迈更大的步。这种“大步”与“小步”的概念正对应于分配给各个因素的相对权重。


    计算机将如何知道自己该迈更小的步还是更大的步呢？也就是说，计算机将如何知道你是否更接近目标？计算机使用了 `dy/dx` 的概念，这本质上就是斜率或梯度。


    ![image](img/file64.png)


    > B 点的斜率比 A 点小，这意味着计算机机器人从 B 点到达基地比从 A 点需要更少的步数。机器学习在优化练习中使用导数。梯度下降等优化算法使用导数来决定增加还是减少相对权重。如果我们能计算函数的导数，就会知道向哪个方向移动。在我们的算法中，我们计算梯度的负值（即梯度下降）。这本质上就是梯度的反方向，或者
    `dy/dx` 的负值。

    '
