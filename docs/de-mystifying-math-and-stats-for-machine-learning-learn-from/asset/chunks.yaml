    The accuracy will be low because your sample is not representative. The distribution
    of different nationalities in the sample should mirror the distribution in the
    world, which is the population.


    Also, note that Indians (and South Asians in general) have a higher propensity
    for heart disease than Chinese or Caucasians and the model will not yield good
