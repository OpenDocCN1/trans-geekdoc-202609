    # 第 16 章：k 近邻算法 (kNN)


    在本章中，我们将理解 `kNN` 背后的数学原理。`kNN` 是 k 近邻的意思。k 近邻既用于分类监督学习算法，也用于无监督学习。


    让我们通过一个例子来理解这个算法。在下面的图中，我们正尝试寻找绿球会进入蓝色组还是红色组。该决定将基于绿球与最近的蓝、红球之间的距离。将使用欧几得距离的概念来寻找距离。


    ![image](img/file57.png)


    欧几里得距离的公式为


    ![image](img/file58.png)![image](img/file59.png)


    欧几里得距离是两点之间不考虑维度的最短距离。寻找两点之间距离常用的方法是欧几里得距离。


    对于给定的 `k` 值，算法将找到绿球的 k 个最近邻居，然后根据距离将绿球分配到蓝色组或红色组。在下面的图中，`k` 为 4。算法可以扩展 `k` 值以覆盖更多的红、蓝球，从而做出正确的决定。


    ![image](img/file60.png)


    让我们再看一个例子以更好地理解它。下表提供了七位员工的重量以及相应的身高和年龄。你将如何使用 `kNN` 概念计算第八位员工（最后一行）的重量？


    | 员工 || 身高 || 年龄 || 重量 |

    | --- | --- | --- | --- |

    | 1 || 6 || 40 || 60 |

    | 2 || 6.11 || 26 || 55 |

    | 3 || 5.9 || 30 || 56 |

    | 4 || 5.8 || 32 || 58 |

    | 5 || 5.3 || 33 || 75 |

    | 6 || 5.6 || 34 || 78 |

    | 7 || 5.5 || 35 || 80 |

    | 8 || 5.8 || 37 || ? |


    我们针对七位员工的数据点计算第八位员工的欧几里得距离。以下是相对于员工 1 的计算：


    ```

    x[2] – x[1]= 6 – 5.8 = 0.2

    y[2] - y[1]= 40 – 37 = 3

    (x[2] – x[1])² = 0.04

    (y[2] – y[1])² = 9

    ```

    '
