    # Chapter 9: Hypothesis Testing


    Hypothesis Testing is a type of statistical analysis in which you put your assumptions
    about a population parameter to the test. Hypothesis testing validates the inference
    we have drawn for the population, based on our study of the sample.


    Two concepts related to hypothesis testing are null hypotheses and alternate hypotheses.


    The **Null Hypothesis** is the assumption that the event will not occur. A null
    hypothesis has no bearing on the study''s outcome unless rejected. H[0] is the
    symbol for it, and it is pronounced H-naught.


    The **Alternate Hypothesis** is the logical opposite of the null hypothesis. The
    acceptance of the alternative hypothesis follows the rejection of the null hypothesis.


    H[a] is the symbol for it.


    Put simply, an alternate hypothesis is what we are trying to prove and the null
    hypothesis is the opposite of what we are trying to prove. We don''t prove a hypothesis
    directly. Instead, we either accept or reject the alternate hypothesis. That''s
    how we go about hypothesis testing.


    We use fertilizers to improve plant growth and the growth depends on the proper
    usage of fertilizer. If we want to check if a particular type of fertilizer, called
    fertilizer A, increases plant growth, we will state the null and alternate hypotheses
    as follows.


    ![image of hand, seeds, and plant](Images/file21.png)


    H[0]: Application of fertilizer A does not increase plant growth.


    **H[a]**: Application of fertilizer A increases plant growth.


    The alternate hypothesis is what we are trying to prove, and what we are trying
    to prove is mentioned as an alternate hypothesis. And the opposite of this is
    known as the null hypothesis. Why do we take this route? If you support a hypothesis
    a million times, and then on the 1,000,001st time you reject it, the hypothesis
    is not true.


    **Type 1 and Type 2 Error:**


    Even though hypothesis tests are meant to be reliable, they are not 100 percent
    certain. A hypothesis test can result in two types of errors.


    **Type 1 Error**: A Type-I error occurs when a null hypothesis is rejected despite
    being true. This is known as a case of false positive.


    **Type 2 Error**: A Type-II error occurs when the null hypothesis is not rejected
    even though it is false. This is known as a case of false negative.


    An older man being diagnosed as pregnant or a full-term pregnant lady not being
    diagnosed as pregnant are classic examples of type 1 and type 2 errors. You will
    have these kinds of errors in real life.


    So, we go for confidence level, which means how confident am I about the inference
    that I have made for the population based on the sample. A 95% confidence level
    means a 5% chance for errors.


    Disease prediction algorithms warrant a higher accuracy say 99.9% because we are
    talking of life and death in a healthcare scenario. A sales process in the same
    healthcare industry may settle for a 90% confidence level.


    These decisions have to be made keeping multiple factors in mind like time, cost,
    the criticality of the prediction, etc.


    # Chapter 10: Outliers


    Outliers are extreme points in our data set and they impact the accuracy of our
    models quite adversely.


    You would remember this graph from the central tendency and dispersion chapter.
    I am going to use this graph to explain outliers. In the picture below, 96, 69,
    and 71 are outliers.


    ![test scores bar diagram](Images/file22.png)


    How is this concept relevant to machine learning?


    Can you afford to have outliers in your dataset? Yes, you can have them provided
    the number of such outliers is negligible. And a better way to handle outliers
    is to remove them. Outliers can skew the results of machine learning models. Unwanted
    inferences can result if outliers are present in our dataset.


    **Box plot**


    The box plot is a handy way of depicting the distribution and behavior of the
    data at the ends of the distribution. The box plot uses the median, and the lower
    and upper quartiles (the lower and upper quartiles correspond to the 25^(th) and
    75^(th) percentile respectively). If the lower quartile is Q1 and the upper quartile
    is Q3, then the difference (Q3-Q1) is called the interquartile range or IQR.


    The box plot is constructed by drawing a box between the upper and the lower quartiles
    with a solid line drawn across the box to locate the median.


    The boundaries for the box plot are computed as below.


    1.  Lower boundary: Q1-1.5\*(Q3-Q1)


    2.  Upper boundary: Q3+1.5\*(Q3-Q1)


    A point beyond the lower or upper boundary point is considered an outlier.


    ![understanding a box plot](Images/file23.png)


    How to use box plots in excel has been explained below.


    A dataset of 156 items of the invoice amount is used to create a box plot and
    identify outliers.


    Select the datapoints


    ![select datapoints](Images/file24.png)


    Click insert


    ![click insert](Images/file25.png)


    Select Recommended charts


    ![select recommended charts](Images/file26.png)


    Select the All charts tab


    ![select the all charts tab](Images/file27.png)


    Choose Box & Whisker


    ![choose box and whisker](Images/file28.png)


    Now you get the Box plot


    ![Box Plot](Images/file29.png)


    Here the outliers are clearly shown as dots. We can manually remove the outliers
    from the box plot. We can also use Python or R or any other programming language
    to create box plots and remove the outliers programmatically.


    # Chapter 11: Machine Learning Concepts


    In this chapter, we are going to learn about machine learning concepts. But before
    seeing the machine learning concepts, let''s understand what is A.I.


    AI is computer software that thinks and acts like human beings. The software may
    even reside inside a hardware entity, but it''s essentially software. We are already
    aware that AI is a fast-growing field with applications across healthcare, telecom,
    banking, retail, social media, etc.


    There are two types of artificial intelligence (AI):


    **Strong AI:**


    Strong AI is software systems thinking at the level of human beings and displaying
    human behaviors like reasoning and thinking. We are not there yet. This type of
    AI is still being researched. This is also called Artificial General Intelligence
    (AGI) and Artificial Super Intelligence (ASI).


    **Weak AI:**


    Weak AI involves solving problems by detecting valuable patterns in data. This
    is the dominant mode of AI today.


    We call the current level of artificial intelligence weak AI, only to distinguish
    it from strong AI or the artificial super intelligence. Even with the so-called
    weak AI, we are solving many problems.


