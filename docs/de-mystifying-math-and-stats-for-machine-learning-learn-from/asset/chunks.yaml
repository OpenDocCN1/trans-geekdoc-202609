    # Chapter 8: Population Vs. Sample


    This chapter is about population vs. sample and what we are learning here will
    form the basis for the next chapter – hypothesis testing.


    When working on a machine learning project, you don''t get to work on the complete
    data set. It could be due to various reasons like time challenges, cost constraints,
    some of the data may be corrupted, storage space may not be available etc.


    So, you get to work on a part of the complete data set, known as a sample. We
    analyze the sample data and draw inferences from the analysis of sample data to
    the larger dataset or population. That is, we extrapolate the inferences of the
    sample to the population.


    Let us say you are trying to understand buying behavior in your school or workplace.
    Do you think you can collect data from every person in your school or work? It
    is practically not possible. Instead, you select a sample and work on it. The
    sample is also the group of individuals who are likely to participate in your
    research.


    To draw valid conclusions from your results, you have to carefully decide how
    to select a sample that is representative of the group.


    First, you need to understand the difference between [a population and a sample](https://www.scribbr.com/methodology/population-vs-sample/)
    and identify the target population of your research.


    * The `population` is the entire group that you want to draw conclusions about.

    * The `sample` is the specific group of individuals that you will collect data
    from and analyze.


    The population can be defined by geographical location, age, income, and many
    other characteristics. It can be very broad or relatively narrow. It could be
    the whole adult population in a city, customers of a particular company or patients
    with a specific health condition.


    It is essential to carefully define your target population according to the purpose
    and practicalities of your project. This single aspect can make or break your
    machine learning project.


    Two key aspects that define the success of your sampling strategy are representativeness
    and randomness.


    ### Representative Sampling


    A representative sample is `a subset of a population that seeks to accurately
    reflect the characteristics of the larger group`.


    In the picture you see below, do you think the sample is representative of the
    population.


    The percentage contribution of different types of students in the sample is significantly
    different from that of the population. Hence the sample is not representative.


    ![population sample 1](Images/file17.png)


    ![population sample 2](Images/file18.png)


    Let us say you are developing a machine learning model that can be deployed across
    multiple countries to predict heart diseases. If most of your dataset comprises
