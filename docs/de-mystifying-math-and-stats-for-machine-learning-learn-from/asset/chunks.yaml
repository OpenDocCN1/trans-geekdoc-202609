    之间的值。如果 AUC 接近 1，则准确率越高；如果接近 0，则准确率越低。


    ### 混淆矩阵


    混淆矩阵是总结分类问题预测结果的极佳方法。正确和错误预测的数量通过计数值总结，并按每个类别进行分类。这是混淆矩阵的关键。混淆矩阵显示了分类模型成功或失败的方式。


    假阳性和假阴性分别称为 1 类错误和 2 类错误。


    ![假阳性和假阴性](img/file37.png)


    # 第 13 章：回归背后的数学


    在本章中让我们理解回归背后的数学。我们将从一个例子开始。我们许多人的老师和父母告诉我们要努力学习获得更高的分数。有些人成功使用了这种策略，而另一些没有没有理想的结果。因此，对于前者，学习小时数与获得的分之间显然存在关系，而这种关系对于后者并不成立。这种关系可以使用回归的概念从数学上进行解释。


    让我们下表。你认为学习小时数与获得的分之间存在关系吗？


    | 获得的分数 | 学习小时数 |

    | --- | --- |

    | 30 | 0 |

    | 40 | 0.5 |

    | 50 | 1 |

    | 60 | 1.5 |

    | 70 | 2 |

    | 80 | 2.5 |

    | 90 | 3 |

    | 91 | 4 |

    | 92 | 5 |

    | 93 | 6 |


    你可以使用线性回归的概念来正确回答这个问题。让我们看看如何在 Excel 中操作。首先，选择这两列并选择散点图。散点图有助于显示因素或变量之间的关系。


    ![image](img/file38.png)


    ![image](img/file39.png)


    ![image](img/file40.png)


    选择图中的任何一个数据点并右键点击，然后选择添加趋势线的选项。趋势线也被称为最佳拟合线。最佳拟合线预计覆盖所有数据点并充分地解释这种关系。


    ![image](img/file41.png)


    我们将得到如下结果。


    ![image](img/file42.png)


    方程和 R 方值已通过格式化趋势线的选项显示在图表中。


    ![image](img/file43.png)


    关键结果是：


    * 趋势线的方程为 `Y = 10.862x + 41.901`

    * `41.901` 是趋势线截交 Y 轴的数据点

    * `10.862` 是斜率，我们稍后会看到它。


    现在，让我们将方程转换为实际术语：


    `Marks = 10.862* No. of hours studied + 41.901`


    在这里，分数是因变量，学习小时数是自变量。


    如果一个学生来你这里她说学习了 3.25 小时，你能预测出获得的分数吗？你可以使用上面的方程预测获得的分数。


    `Marks = 10.862* 3.25 + 41.901 = 77.2`


    线性回归线的方程为 `Y = mX + c`，其中 `X` 是自变量，`Y` 是因变量。直线的斜率是 `m`，`c` 是截距（截距是 `x = 0` 时 `y`
    的值，或直线与 Y 轴相交的值）。


    ![image](img/file44.png)


    `m = 梯度或斜率 = 三角形的高除以底 = 4 除以 2 = 2`。无论我在线上画一个较小的三角形还是一个较大的三角形，斜率的值将是相同的。


    > `Y=2x-1, Y=mx+c`


    > `c` 是截距（直线与 Y 轴相交的地方）。


    这个概念被用于分数与学习小时数的例子中。


    ### 分数 vs 学习小时数


    这个概念被用于获得的分数与 学习小时数的例子中。


