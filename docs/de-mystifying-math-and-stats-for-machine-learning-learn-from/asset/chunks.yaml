    ### Multiple Regression


    Multiple regression is also linear regression, but with more than one independent
    variable, that is, we try to predict a value based on `two or more` variables.


    Let us take an example to understand this better. Let us say I am trying to predict
    the quantum of carbon dioxide emission of a car based on the volume of the car
    and the weight of the car. If I use either one of the two variables or factors
    - vehicle volume or vehicle weight- I will use simple linear regression. If I
    use two factors – vehicle volume and vehicle weight – to determine the outcome,
    I will use multiple linear regression.


    ![image](Images/file45.png)


    ### Logistic Regression


    In the earlier example, we tried to predict the quantum of carbon dioxide emission
    using vehicle volume and vehicle weight. If we use the same variables (vehicle
    volume and vehicle weight) and try to predict whether the vehicle will have a
    higher carbon dioxide emission or not, I will use logistic regression. Please
    note that the output or the predicted value will be a yes or no, that is, the
    vehicle will have higher carbon dioxide emissions or not.


