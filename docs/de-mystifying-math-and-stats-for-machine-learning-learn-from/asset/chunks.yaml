    # Chapter 1: Introduction


    Machine Learning (ML) is a field at the intersection of computer programming,
    mathematics and domain knowledge.


    The author has observed that many budding machine learning students and enthusiasts
    make the mistake of jumping to build and work on algorithms without adequately
    understanding the math behind algorithms. That is not the right way to go about
    learning machine learning.


    One must first understand the mathematics and statistics concepts relevant to
    machine learning. The algorithms and the associated programming should be learnt
    subsequently.


    ![understanding machine learning](Images/file1.jpg)


    Without an understanding of math concepts relevant to machine learning, deploying
    and utilizing machine learning will always remain challenging. So, practitioners
    and budding enthusiasts need to assimilate the core concepts.


    By mathematics, we are not referring to theoretical mathematics but rather applied
    mathematics. Applied mathematics and statistics is about applying the theoretical
    concepts to real world challenges and problems.


    **The following core concepts are covered in this book.**


    *   Measures of Central Tendency Vs. Dispersion


    *   Mean Vs. Standard Deviation


    *   Percentiles


    *   Dependent Vs. Independent Variables


    *   Types of data


    *   Sample Vs. Population


    *   Hypothesis testing


    *   Outliers


    *   ML concepts


    **Concepts related to algorithms are also covered in this book.**


    *   Measuring accuracy in algorithms


    *   Math behind regression


    *   Math behind decision tree


    *   Math behind kNN


    *   Gradient descent and optimization


    These concepts are explained from an application perspective, that is how these
    concepts are applied in real life. The author is confident that understanding
    these concepts will help you to lay a solid foundation and build a thriving career
    in artificial intelligence.


    # Chapter 2: Central Tendency vs. Dispersion


    In this chapter, let''s understand the concept of central tendency and dispersion.
    Whenever you are presented with any data set, it is crucial to understand what
    is going on in the data before developing any statistical models. And the best
    way to understand the data is to use the concept of central tendency and dispersion.


    Central tendency provides the basic information about the data. Central tendency
    is described by metrics like mean, median and mode. Central tendency offers information
    from the perspective of the midpoint of the data.


    Dispersion is the degree to which data is distributed around this central tendency
    and is represented by metrics like range, deviation, variance, standard deviation
    and standard error.


    ![two key measures for any data](Images/file2.png)


    It is necessary to analyze the data from both central tendency and dispersion,
    though some people make the mistake of analyzing the data from the perspective
    of central tendency only. This may be convenient, but it leads to erroneous conclusions.
    An analysis using central tendency and dispersion will give beneficial and comprehensive
    insights.


    **How to calculate measures of central tendency?**


    Let us consider a simple dataset of 6 numbers or 6 observations.


    *   Dataset = {9, 3, 1, 8, 3, 6}


    *   Mean = Sum of observations / total no. of observations = 30/6 = 5


    *   \[ 9 + 3 + 1 + 8 + 3 +6 = 30 \]


    **Median** is the middle number in the dataset when the dataset is arranged in
    ascending order.


    *   Dataset = {9, 3, 1, 8, 3, 6}


    *   Dataset in ascending order = {1, 3, 3, 6, 8, 9}


    *   Median **\=** midpoint of {1, 3, **3, 6**, 8, 9} = (3+6)/2 = 4.5


    If the dataset has an odd number of observations like {1, 3, **3,** 8, 9}, then
    the median will be the midpoint (3). When there is an even number of values like
    in the previous example, the median is arrived at by finding the arithmetic average
    of the middle points.


    **Mode** is simply the frequently occurring number.


    Mode = 3


    **Arithmetic Range / Range is** the difference between the highest and lowest
    values in the dataset. To find it, subtract the lowest number in the distribution
    from the highest.


    Range = Maximum – Minimum = 9-1 = 8


    **Mean Vs Standard Deviation:**


    **Standard deviation** measures the extent of variation or dispersion in a dataset.
    A low standard deviation indicates that the values are closer to the mean of the
    set, while a high standard deviation indicates that the values are spread out
    over a broader range.


    The standard deviation is calculated as the square root of variance by determining
    each data point''s deviation relative to the mean.


    ![standard deviation equation](Images/file3.png)


    Let us consider a dataset **{1, 2, 3, 4, 5}** and compute standard deviation


    *   Here n (count) =5,


    *   Average = (1+2+3+4+5) ÷ 5 = 15÷5 = 3


    *   Calculating the difference of each element from average = { (1-3), (2-3),
    (3-3), (4-3), (5-3) } ={ -2,-1,0,1,2}


    *   Squaring each of the difference value = {4, 1, 0, 1, 4} and we get a sum =
    10


    *   Applying formula, n - 1 = 5-1 = 4


    *   Standard Deviation (SD) =$\\sqrt{10}/4$ = $\\sqrt{2}.5$ = 1.58


    This calculation can be easily understood from the below representation.


    ![standard deviation table](Images/file4.png)


