    模式（Pattern）是一种一致的、循环的特征。`pattern` 在数字、图像、设计等方面会以可识别的方式重复。


    在下图中，你可以观察到哪些模式？


    ![图表，折线图自动生成的描述](img/file30.png)


    1. 我们可以看到，历年中的峰值出现在 7 月。

    2. 历年中的低谷或最低点出现在 1 月。

    3. 我们还可以注意到，历年中的最高点正以近乎相同的速率逐渐增加。


    我们可以通过肉眼发现这三个模式。如果数据点更多，你是否能够轻松、快速地发现模式呢？我们不能，我们需要软件来揭示这些模式。这正是 AI 系统将要做的事情。


    现在，让我们看看 AI 如何应用于心脏病预测。


    用于构建预测系统的数据库将包含患者的记录，详细信息心脏病、胆固醇、血糖、血压、遗传倾向以及 `BMI`（体质量指数）。这些细节对于患有和不患有心脏病的人都是可用的。


    系统将分析数据并揭示导致心脏病的模式。


    患有心脏病的人可能具有特定水平的 `BP`（血压）、特定水平的 `sugar value`（血糖）、特定水平的 `cholesterol`（胆固醇）等。这些值的组合被称为
    `patterns`。系统将揭示导致心脏病的模式。


    当带有上述参数值的患者记录输入系统时，系统将使用之前揭示的模式进行预测。


    我们永远无法 100%地确定预测结果，因此我们使用“`可能患心脏病`”和“`不太患心脏病`”等术语。


    同样的概念也用于贷款违约预测。定期还款的人会有稳定的收入（可能由配偶的收入支持）、稳定的工作以及可能蓬勃发展的职业。另一方面，可能违约的人将表现出与上述特征相反的特征。因此，算法或计算机程序将尝试揭示定期还款者和违约者的模式。这种模式将用于预测违约者。


    ## AI VS 机器学习 VS 数据科学


    在本章及之前的章节中，你可能已经注意到 `AI` 和 `machine learning`（机器学习）这两个词有时互换使用。虽然 `AI` 是核心焦点，但
    `machine learning` 是驱动 `AI` 的技术。我们之前看到的模式识别也是 `machine learning` 的一部分。在讨论 `AI`
    和 `machine learning` 时，你可能还会听到另一个术语——`deep learning`（深度学习）。`Deep learning` 是 `machine
    learning` 的更高级的形式。


    近期另一个热门的术语是 `data science`（数据科学）。`data science` 本质上是指机器学习及相关技术。`data science`
    一词在学术界用得更多。


    在理解了 `AI` 和 `machine learning` 之后，让我们通过一个例子来理解两种类型的机器学习——`Supervised Learning`（监督学习）和
    `Unsupervised Learning`（无监督学习）。


    ![示例图像](img/file31.png)


    在监督学习中，输入系统供机器或软件学习模式的数据将包含对未来将预测的变量或输出种类的引用。在例例中，它是 `insurance charges`（保险费用）或
    `Y`。该引用也被称为 `label`（标签）。没有这个 `label` 或引用，软件将不知道如何将 `X’s` 与 `Y` 关联起来。请注意，人们也可以
    `X’s` 来预测其他内容，例如公司是否应该给客户提供保险。


    监督机器学习依赖于标记数据。模型学习标记输出与输入数据之间的关系。大多数模型将属于监督学习。


    在无监督学习中，没有引用或 `label` 数据。`Unsupervised learning` 处理未标记或原始数据。由于许多公司没有现成的标记数据，`Unsupervised
    learning` 正在变得越来越重要。`Unsupervised learning` 可以作为公司开启机器学习之旅的良好起点。


    正如你所注意到的，机器学习的工作方式与传统编程非常不同。下面的图片清楚地捕捉了这种差异。


    ![传统编程对比 ML 机器学习编程](img/file32.png)


    在传统编程中，我们将数据输入系统，程序处理输入以创建输出。


    在机器学习中，实际的输出是可以进行预测的统计模型或程序，而引用或 `label` 或输出实际上是输入。


    ## 分类与回归


    在本章稍之前，我们看到了两种类型的机器学习——监督学习和无监督学习。监督学习可以进一步分为两种类型：`classification`（分类）和 `regression`（回归）。


    ![分类与回归](img/file33.png)


    在 `regression algorithm` 中，输出变量将是数值型的。在 `classification algorithm` 中，输出变量将是非数值型的——是或否、好或坏、是否会发生等。如果你正试图预测明天的温度，我们是在讨论一种
    `regression algorithm`。另一方面，如果你正试图预测明天是否是晴天，你讨论的是 `classification algorithm`。


    在上面的图中，我们在 `regression algorithm` 中尝试根据 `vehicle volume`（车辆数量）和 `vehicle weight`（车辆重量）预测二氧化碳的排放量；而在
    `classification algorithm` 中，我们使用相同的因素（`vehicle volume` 和 `vehicle weight`）来确定高二氧化碳排放的可能性。


    ## 训练数据 VS 测试数据


    机器学习通过揭示数据集中的模式来工作。为了确保开发的模型具有高水平的准确性，我们将给定的数据集或历史数据分为 `train data`（训练数据）和 `test
    data`（测试数据），通过在 `train data` 上开发统计模型，然后在 `test data` 上检查其准确性。


    ![自动生成的图](img/file34.png)


    `train data` 与 `test data` 的划分比例通常是 80:20。它也可以是 60:40 或 75:25。这是主观性问题，从业者有时会调整此比例以观察准确性是否提高。


    # 第 12 章：算法准确性的衡量


    在上一章中，我们学习了机器学习的基础概念。我们也看到了不同类型的机器学习：分类和回归。本章将介绍如何衡量分类算法和回归算法的准确性。


    什么是准确性？假设我正在预测某人是否会患病。


    那个人是否真的患了该疾病是准确性的衡量标准。因此，准确性提供了预测值与实际值之间的比较。准确性将在开发统计模型的阶段以及部署阶段进行衡量。


    分类算法和回归算法的准确性衡量方法不同。


    ### 回归算法的准确性


    在回归算法中，我们使用 `R²` 和 `MAE` 来衡量准确性。`R²` 是一个涉及预测值相对于均值差异的比例。`MAE`（平均绝对误差）告诉我们预测值差异的平均程度。在回归中，我们同时使用
    `R²` 和绝对误差来评估机器学习模型的好坏。


    R² **\= 1 – RSS / TSS**


    残差平方和 (`RSS`) 是实际值与预测值之间的差异。解释平方和 (`ESS`) 是预测值与平均值之间的差异。总平方和 (`TSS`) 是 `RSS +
    ESS`。


