    ### Accuracy in a classification algorithm


    In a classification problem, we look at accuracy in terms of true positive and
    true negative, and compare that with all possibilities of true negative (TN),
    false positive (FP), false negative (FN) and true positive (TP).


    `Accuracy = TP + TN / TP + FP + FN + TN`


    ![accuracy in a classication algorithm](Images/file36.png)


    We also use another metric called area under the curve (AUC). This provides a
    range of values between 0 and 1. It uses all possibilities of TN, TP, FP and FN
    to give values between 0 and 1. If AUC is closer to 1, the accuracy is higher;
    if it’s closer to 0, accuracy is lower.


    ### Confusion Matrix


    A confusion matrix is an excellent way to summarize prediction results in a classification
    problem. The number of correct and incorrect predictions are summarized with count
    values and broken down by each class. This is the key to the confusion matrix.
    The confusion matrix shows the ways in which your classification model succeeds
    or fails.


    False positive and false negative are also called type 1 error and type 2 error,
    respectively.


    ![false positive and false negative](Images/file37.png)


    # Chapter 13: Maths behind Regression


    Let''s understand the mathematics behind regression in this chapter. We will use
    an example to get started. Many of us have been told by our teachers and parents
