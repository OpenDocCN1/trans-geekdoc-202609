    # 第一章：引言


    机器学习（ML）是计算机编程、数学和领域知识交叉的领域。


    作者观察到，许多初学者和机器学习爱好者会犯一个错误，在没有充分理解算法背后的数学的情况下，就急于构建和运行算法。这并不是学习机器学习的正确方法。


    必须首先理解与机器学习相关的数学和统计概念。随后应该学习算法和相关的编程。


    ![理解机器学习](img/file1.jpg)


    如果对机器学习相关的数学概念没有理解，部署和利用机器学习将始终具有挑战性。因此，从业者和初级爱好者需要吸收核心概念。


    **本书涵盖了以下核心概念。**


    - 集中趋势 vs 离散程度

    - 平均值 vs. 标准差

    - 百分位数

    - 因变量 vs. 自变量

    - 数据类型

    - 样本 vs. 总体

    - 假设检验

    - 离群值

    - ML 概念


    **本书还涵盖了算法算法概念。**


    - 算法中准确性的测量

    - 回归背后的数学

    - 决策树背后的数学

    - kNN 背后的数学

    - 梯度下降和优化


    这些概念是从应用的角度解释的，即这些概念在现实生活中是如何应用的。作者相信，理解这些概念将帮助你打下坚实的基础，并在人工智能领域建立辉煌的职业生涯。


    # 第二章：集中趋势 vs 离散程度


    在这一章中，让我们理解集中趋势和离散程度的概念。当你面对任何数据集时，在开发任何统计模型之前，理解数据中发生了什么是非常关重要的。理解数据的最佳方法是使用集中趋势和离散程度的概念。


    集中趋势提供了关于数据的基本信息。集中趋势通过平均值、中位数众数等指标描述。集中趋势从数据中点的角度提供信息。


    离散程度是数据围绕这个集中趋势分布的程度，通过范围、偏差、方差、标准差和标准误差等指标表示。


    ![数据的两种测量](img/file2.png)


    有必要从集中趋势和离散程度两个方面来分析数据，尽管有些人会犯仅从集中趋势分析数据的错误。这可能很方便。


    如何计算集中趋势的度量？让我们考虑一个简单的数据集。


    **平均值**是观测值的平均数。


    ```

    Mean = (1+2+3+4+5) ÷ 5 = 15÷5 = 3

    ```


    **位数**是数据集按顺序排列后的中间数字。


    如果数据集具有奇数个观测值，例如 {1, 3, 3, 6, 9}，那么位数将是中间值（3）。当数量为偶数时（如上一个例子），通过找到中间点的算术平均值得到位数。


    **众数**是出现频率最高的数字。


    众数 = 3


    **范围**是数据最大值和最小值之间的差。要找到它，从分布的最大值减去最小值。


    范围 = 9-1 = 8


    **平均值 vs 标准差：**


    **标准差衡量数据集的变异或离散程度。** 低标准差表示数值接近集合的平均值，而高标准差表示数值分布在更广泛的范围内。


    标准差通过确定每个数据点相对于平均值的偏差的平方根来计算。


    ![标准差公式](img/file3.png)


    让我们考虑数据集 {1, 2, 3, 4, 5} 并计算标准差：


    - 这里 `n` = 5，

    - 平均值 = (1+2+3+4+5) ÷ 5 = 15÷5 = 3

    - 计算每个元素与平均值的差 = { (1-3), (2-3), (3-3), (4-3), (5-3) } = {-2,-1,0,1,2}

    - 将每个差值平方 = {4, 1, 0, 1, 4}，我们得到和 = 10

    - 应用公式，`n - 1` = 5-1 = 4

    - 标准差 (SD) = $\sqrt{10}/4$ = $\sqrt{2}.5$ = 1.58


    这个计算可以从下面的表示轻松理解。


    ![标准差表格](img/file4.png)


