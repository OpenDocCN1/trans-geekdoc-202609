- raw: 'A pattern is a consistent, recurring characteristic. A **pattern** repeats
    recognizably in numbers, images, designs, etc.


    In the graph below, what are the patterns you can observe?


    ![Chart, line chart Description automatically generated](Images/file30.png)


    1.  We can see that peaks in a calendar year occur in July


    2.  The troughs or the lowest points in a calendar year occur in January.


    3.  We can also note that the highest point in a calendar year is progressively
    increasing at nearly the same rate.


    We can uncover these three patterns using our eyes. If the number of data points
    is more, will you be able to uncover patterns easily and quickly? We won’t and
    we need software to reveal the pattern. That is what an AI system will do.


    Now, let''s see how AI is applied to heart disease prediction.


    The database used to build the prediction system will consist of patient records
    with details of heart disease, cholesterol, sugar, blood pressure, genetic predisposition,
    and BMI (Body Mass Index). These details would be available for people with and
    without heart disease.


    The system will analyze the data and uncover the patterns contributing to heart
    disease.


    People who have heart disease will probably have a certain level of BP, a certain
    level of sugar value, a certain level of cholesterol, etc. Those values in combination
    are called **patterns**. The system will uncover the pattern that is contributing
    to heart disease.


    Whenever a patient record with values for the above parameters is fed into the
    system, the system will use the previously uncovered pattern to predict.


    We can never be 100% sure of the prediction, so we use the terms “**likely** to
    develop the heart disease” and “**not likely** to develop the heart disease.”


    The same concept is used in the loan default prediction also. Someone consistent
    in paying the loan will have a regular income possibly supported by their spouse’s
    income, a stable job, and possibly a thriving career. On the other hand, someone
    who is likely to default will exhibit the opposite of the above characteristics.
    So, the algorithm or the computer program will try to uncover the pattern for
    regular payers of loan and defaulters. This pattern will be used to predict defaulters.


    **AI Vs. Machine Learning Vs. Data Science**


    In this chapter and the earlier chapters, you would have noticed the use of words
    AI and machine learning, sometimes interchangeably. While AI is the headliner,
    machine learning is the technology that drives AI. Pattern recognition that we
    saw earlier is also part of machine learning. You may also hear another term when
    AI and machine learning are discussed. It is known as deep learning. Deep learning
    is a more advanced form of machine learning.


    Another term that has gained traction in recent times is data science. Data science
    essentially refers to machine learning and the associated technology. The term
    ‘data science’ has been used more in the academic world.


    Having understood AI and machine learning, let us understand the two types of
    machine learning - **Supervised Learning and Unsupervised Learning** using an
    example.


    ![examle image](Images/file31.png)


    In supervised learning, the data fed into the system for the machine or software
    to learn the patterns will contain a reference to the variable or the kind of
    output that will be predicted in the future. In this example, it is insurance
    charges or Y. The reference is also called a label. Without this label or reference,
    the software will not know how to link the X’s to Y. Please note that one can
    use the X’s to predict something else also, viz., whether the company should give
    insurance or not to a customer.


    Supervised machine learning relies on labeled data. The model learns the relationship
    between the labeled output and the input data. The majority of the models will
    be of supervised learning.


    In unsupervised learning, the reference or label data won’t be there. Unsupervised
    learning processes unlabeled or raw data. Unsupervised learning is gaining importance
    since many companies don’t have labeled data readily available. Unsupervised learning
    can be a good starting place for companies to start their machine learning journey.


    As you would have noted, machine learning works very differently from conventional
    programming. The below picture captures the difference clearly.


    ![traditional programming vs ML programming](Images/file32.png)


    In traditional programming, we feed data into the system, and the program processes
    the input to create output.


    In machine learning, the actual output is the statistical model or program that
    can make the prediction, and the reference or label or output is actually an input.


    **Classification and Regression**


    Earlier in this chapter, we saw the two types of machine learning – supervised
    and unsupervised learning. Supervised learning can be further sub divided into
    two types called classification and regression.


    ![classification and regression](Images/file33.png)


    In a regression algorithm, the output variable will be numeric. In a classification
    algorithm, the output variable will be non-numeric – yes or no, good or bad, will
    it happen or not etc. If you are trying to predict tomorrow’s temperature, we
    are talking about a regression algorithm. On the other hand, if you are trying
    to predict whether it will be sunny or not, you are talking about a classification
    algorithm.


    In the above picture, we are trying to predict the quantum of carbon dioxide emission
    based on vehicle volume and vehicle weight in a regression algorithm; in a classification
    algorithm, we use the same factors (vehicle volume and vehicle weight) to determine
    the likelihood of high carbon dioxide emission.


    **Train data Vs. test data**


    Machine learning works by uncovering the pattern in the dataset. To ensure that
    the developed model has a high level of accuracy, we split the given dataset or
    the historical data into train data and test data, and the statistical model (or
    equation) is developed on the train data. The developed model is then checked
    on test data for accuracy. If the accuracy is low, the model re-trains and tries
    to improve the accuracy over 2 or 3 cycles or even more. The finalized model is
    then used for current or future data for prediction purposes.


    ![Diagram Description automatically generated](Images/file34.png)


    The ratio in which the train vs. test data is split is typically 80:20. It can
    even be 60:40 or 75:25. This is subjective, and practitioners sometimes play with
    this ratio to see if the accuracy improves or not.


    # Chapter 12: Measuring Accuracy in Algorithms


    In the previous chapter, we learned about machine learning concepts. We also saw
    the different types of machine learning, classification and regression. This chapter
    will see how to measure the accuracy of a classification algorithm and regression
    algorithm.


    What is accuracy? Let us say I am predicting whether someone will get a disease.


    Whether that person actually gets that disease or not is a measure of accuracy.
    So, accuracy provides a comparison between predicted and actual. The level of
    accuracy will be measured both during the stage of developing the statistical
    model and during deployment.


    Accuracy is measured differently in a classification and a regression algorithm.


    **Accuracy in a regression algorithm**


    In a regression algorithm, we measure accuracy using R² and MAE. R² is a ratio
    involving the difference between actual versus predicted with respect to the mean.
    MAE (mean absolute error) tells the quantum of difference between actual versus
    predicted. In regression, we use both the R² and absolute error to assess how
    good the machine learning model is.


    **R²** **\= 1 – RSS / TSS**


    The residual sum of squares (RSS) is the difference between actual versus predicted.
    The explained sum of squares (ESS) is the difference between the predicted versus
    the average. The total sum of squares (TSS) is RSS + ESS.'
