  fmt: '

    You know how to come down to the base if you are currently at point `x`, highlighted
    in the picture below. You know that you have to take route 1. However, if you
    are a computer robot, how will you know how to come down. You can either take
    route 1 or 2, although route 2 will take more time than route 1.


    ![image](Images/file63.png)


    So the gradient descent algorithm helps us to make those decisions. As part of
    this process, the algorithm determines whether you are closer to your goal or
    not. If you are closer to your destination, you need to take only smaller steps.
    If you are away from your goal, you would need bigger steps. This concept of bigger
    vs. smaller steps corresponds to the relative weights assigned to the factors.


    How will the computer know whether it has to take smaller or bigger steps? That
    is, how will the computer know whether you are closer to the goal or not? The
    computer uses the concept of `dy/dx`, which is nothing but slope or gradient.


    ![image](Images/file64.png)


    > The slope at point B is less steep than that at point A and this means the computer
    robot will need to take fewer steps to reach the base from B than A. Machine learning
    uses derivatives in optimization exercises. Optimization algorithms like gradient
    descent use derivatives to decide whether to increase or decrease the relative
    weights. If we can compute the derivative of a function, we will know which direction
    to proceed. In our algorithms, we compute the negative of the gradient (or gradient
    descent). This is nothing but the opposite of the gradient or negative value of
    `dy/dx`.

