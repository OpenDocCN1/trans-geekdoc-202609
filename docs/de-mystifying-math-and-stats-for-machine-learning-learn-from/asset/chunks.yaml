    # 2. 非对称分布或偏态分布


    ### 对称分布

    对称分布是指左侧和右侧相互镜像的分布。最为人知的对称分布是具有钟形曲线的正态分布。在对称分布中，`mean = median = mode`（平均值 = 中位数
    = 众数）。这三个值是相同的。


    ### 非对称分布或偏态分布

    当数值以不同的频率出现，且平均值、位数和众数不相等时，就会发生非对称分布。如果一个分布是非对称的，则称为偏态分布。偏度可以是负的也可以是正的。


    偏度是数据集中偏离对称钟形曲线（正态分布）的扭曲或不对称性。如果曲线向左或向右移动，则被称为偏态。在这里，平均值、位数和众数将不相等。


    ![理解描述性统计 - 数据科学](img/file5.jpg)


    ### 频率分布

    理解分布形状的一种简单方法是使用频率分布。频率分布显示了数据集中每个数据点出现的频率。


    让我们考虑数据集 `[6,6,5,5,5,1,1,1,1,4,4,4,4,4,4,4,3,3,3,3,3,3,2,2,2,2,2,2,2,2,2,2,5,5,5]`


    我们首先对每个数据点的出现次数进行计数，并以图表的形式绘制出这些计数（或数量）。在统计学中，标准做法是使用垂直线来表示某个数字的出现。当计数达到 4 时，下一次（第
    5 次）出现将用一条横跨四条垂直线的斜线来表示或描述。这有助于我们轻松地理解哪个数字出现的次数更多。


    ![频率分布](img/file6.png)


    你上面上方条形图是分布形状的表示。下面的图是条形图的三维视图，以便清楚地查看分布。在这个数据集中，平均值、位数和众数是不一样的。


    ![频率分布图](img/file7.png)


    现在让我们通过下面的示例来理解如何应用集中趋势与离散度的概念。


    ![集中趋势 vs 离散度](img/file8.png)


    在上面的示例中，两组的平均值相同，但标准差（`SD`）不同。你能找出哪一组更好以及为什么吗？


    组 A（绘制在左侧）比组 B 好，因为标准差较小。当标准差较小时，变异性越小。变异性越小，从当前数据集对未来的预测性就越高。变异性越高，预测性就越低。


    如果我们仅仅依靠平均值来评估这两个组，我们会说两组的性能水平相同，这是不正确的。


    ### 另一个示例：标准差

    在这个示例中，组 A（左侧显示的测试分数）的 `mean = 85` 且标准差（`SD`）为 7，组 B（右侧显示的测试分数）`mean = 80` 且 `SD
    = 15`。哪一组更好？为什么？


    ![标准差条形图示例](img/file9.png)


    组 A 比组 B 好，因为平均值更高且变异性（由标准差衡量）较低。


    # 第 4 章：精确度 vs 准确度


