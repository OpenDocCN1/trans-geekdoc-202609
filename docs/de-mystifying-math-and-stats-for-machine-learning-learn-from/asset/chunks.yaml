    # 2. Asymmetrical or Skewed Distribution


    ### Symmetrical Distribution

    A symmetric distribution is a distribution in which the left and right sides mirror
    each other. The most well-known symmetric distribution is the normal distribution
    with a bell-shaped curve. In a symmetrical distribution, `mean = median = mode`.
    The values of mean, median, and mode are the same.


    ### Asymmetrical or Skew Distribution

    Asymmetrical distribution occurs when the values occur at varying frequencies
    and the mean, median, and mode are not the same. If a distribution is non-symmetrical,
    it is said to be skewed. Skewness can be negative or positive.


    Skewness is a distortion or asymmetry that deviates from the symmetrical bell
    curve (normal distribution) in a data set. If the curve shifts to the left or
    the right, it is said to be skewed. Here the mean, median, and mode will not be
    the same.


    ![Understanding Descriptive Statistics - Towards Data Science](Images/file5.jpg)


    ### Frequency Distribution

    A simple way to understand the shape of the distribution is by using a frequency
    distribution. A frequency distribution shows the frequency of occurrence of each
    data point in a dataset.


    Let us consider the dataset `[6,6,5,5,5,1,1,1,1,4,4,4,4,4,4,4,3,3,3,3,3,3,2,2,2,2,2,2,2,2,2,5,5,5]`


    We first create a tally of the number of occurrences of each data point and plot
    the tally (or count) in the form of a graph. It is a standard practice in statistics
    to indicate the occurrence of a number using a vertical line. Once the tally reaches
    4, the next (`5^(th)`) occurrence is indicated or characterized by a slanting
    line across the four vertical lines. This helps us to easily understand which
    number occurs more.


    ![frequency distribution](Images/file6.png)


    The bar graph that you see above is a representation of the shape of the distribution.
    The below graph is a three-dimensional view of the bar graph to clearly see the
    distribution. In this dataset, mean, median and mode are not the same.


    ![frequency distribution graph](Images/file7.png)


    Let us now understand how to apply the concept of central tendency vs. dispersion
    using the below example.


    ![central tendency vs dispersion](Images/file8.png)


    In the above example, the average of both the groups is the same but the standard
    deviation (`SD`) is different. Can you find out which of the two groups is better
    and why?


    Group A (plotted on the left) is better than Group B because the standard deviation
    is lower. When the Standard deviation is lower, the variation is lower. When variation
    is lower, the predictability of the future from the current data set is higher.
    When variation is higher, the predictability is lower.


    If we had just relied on the average to evaluate the two groups, we would have
    said that both the groups have the same level of performance, which is not correct.


    ### Another Example: Standard Deviation

    In this example, Group A (test score shown on the left) has `mean = 85` & standard
    deviation (`SD`) = 7 and Group B (test score shown on the right) has `mean = 80`
    & `SD = 15`. Which is better and why?


    ![bar graph example of standard deviation](Images/file9.png)


    Group A is better than Group B because the average is higher and variation (measured
    by standard deviation) is lower.


    # Chapter 4: Precision vs. Accuracy


    Accuracy refers to the closeness of the value (being measured) to the object’s
    actual measurement. At the same time, precision is the consistency of multiple
    measurements of the same object, irrelevant to the object’s actual measurement.


    Accuracy is how close a shooter gets to the bull’s eye. Precision is how repeatable
    the shooter’s performance is, that is, how close is the second arrow to the first
    one (regardless of whether either of the arrows is near the mark).


    ![image of four targets](Images/file10.png)


    ### Of the four shooters, which shooter is the best and why?

    The Shooter 4 is the best because the variation is lower, and he is hitting the
    target often. Both precision and accuracy (Mean and Standard deviation) are higher.


    Among the rest of the shooters, who do you think can come to the level of shooter
    4 quickly?


    In the case of shooters 2 and 3, their variation is high, possibly caused by multiple
    factors which are difficult to identify. Shooters 2 and 3 could also be amateurs,
    and they probably need to practice a lot more to become like shooter 4.


    However, shooter 1 has high precision with low accuracy. The low accuracy could
    be due to issues like angle, focus, direction, or not understanding the wind pattern.
    These can be addressed relatively quickly and once the issue is addressed, shooter
    1’s performance will be like that of shooter 4.


