    # Chapter 7: Types of Data


    In this chapter, let''s understand the different types of data. We all know about
    the two broad categories of data viz., qualitative and quantitative data. But
    if you really see, a further subdivision is there within qualitative and quantitative
    data.


    In Machine Learning, we should ascertain the different data types that exists
    in the data set. Algorithms are developed for quantitative data, so the qualitative
    data must be converted to quantitative data.


    ## Types of data


    #### 1. Quantitative data - data that can be written in numbers, for example,
    the heights of children.


    ##### Sub-types


    * `Discrete data` - numerical data that cannot be shown in decimals, for example,
    the number of students in a classroom.

    * `Continuous data` - numerical data that can be shown in decimals, for example,
    the heights of students.


    The critical difference between the two is that continuous data can be measured
    on a continuum or a scale. You can subdivide it meaningfully. For example, if
    someone says 169 centimeters as their height, you can also represent it as 1.69
    meters.


    This kind of subdividing of data is not possible in discrete. If there are 30
    students in a class, I can only say 30 students. I can’t tell 30.1 students or
    29.8 students.


    #### 2. Qualitative data - data that can only be written in words, not numbers.
    For example, the colors of cars in a car parking area.


    ##### Sub-types


    * `Nominal` – data with no inherent order or ranking sequence, such as blood group,
    gender, race, etc. We can’t say that male is better than female or that O positive
    blood group is better than AB negative.

    * `Ordinal` – data that has ordered series, for example, performance grades.

    * `Binary` – data that has only two options: pass/fail, yes/no, true or false,
    etc.


    ### Why is this understanding of different types of data necessary for machine
    learning?


    Algorithms are developed for Quantitative data only, so the Qualitative data must
    be converted to Quantitative data. Even this conversion of qualitative data to
    quantitative data is only an approximation. Your aim should be to have more quantitative
    data and less qualitative data in your dataset. That will ensure a higher forecast
    accuracy of machine learning models.


    Let us look at the banking and insurance examples for different data types. We
    will use the same examples we saw in the previous chapter on dependent and independent
    variables.


