- raw: 'In seeking to ensure that fairness and privacy are maintained in such analyses,
    researchers can apply statistical approaches to identify people for whom privacy
    or fair information practice principles may be violated, such as when an individual’s
    data are represented in long tails (i.e., a distribution with a large number of
    occurrences far from the central part of the distribution) or as outliers (i.e.,
    data points that differ from most others) and are therefore easy to identify within
    a data set. Other approaches to managing issues relating to fairness include the
    following:


    *   Fair information practice principles (i.e., best practices),


    *   New approaches to remediation for those negatively affected, and


    *    Use-based rules for data (i.e., new approaches to auditing outputs).


    Cybersecurity issues also arise in many areas. For example, even though medical
    data subject to HIPAA are required to be encrypted when stored and protected in
    other ways, there is still a risk that sensitive information could end up in the
    wrong hands. Such cyberattacks and data thefts are also a concern for technology
    developers. All companies need to be vigilant in preparing for or preventing these
    situations, perhaps by drawing on the expertise of hackers.^([^(10)](#fn10))


    ### Trust, Transparency, and Interpretability


    “Artificial Intelligence and Life in 2030” suggests that “well-deployed artificial
    intelligence prediction tools have the potential to provide new kinds of transparency
    about data and inferences, and may be applied to detect, remove, or reduce human
    bias, rather than reinforcing it.”^([^(11)](#fn11))


    A key barrier to achieving transparency in artificial intelligence tools is the
    lack of a common language, as varying definitions of “transparency,” “explainability,”
    and “interpretability” exist across disciplines. Additionally, there are various
    lenses through which these concepts can be considered. For example, some view
    “explainability” as a technical issue, while others may view it as a legal or
    social issue.


    Another important aspect to bear in mind when considering transparency is that
    it is not synonymous with trust: trust can be attained without transparency. Conversely,
    just because an algorithm is transparent does not mean that it is trusted or trustworthy.
    A user might trust an algorithm without questioning or understanding how the result
    was attained—just as travelers trust that it is safe to board airplanes every
    day, despite not knowing precisely how airplanes function. Individuals are also
    likely to trust certain types of medical treatment, without knowing how or why
    they work.


    Humans and computer systems alike can be trained to provide explanations, but
    these explanations may be too complex to grasp without specialist knowledge or
    may, in some cases, be biased or untrue. For example, when a medical patient enters
    an examination room with a complicated set of symptoms, a medical professional
    may offer either a simplified explanation intended to put the patient at ease
    or one that would require a medical degree to understand fully. The patient may
    feel relief having an explanation, yet the patient may not actually have the most
    accurate or most clear explanation. Who performs an action or supplies a service
    can also play a role in the extent to which individuals trust a system.


    The possibility of providing biased results or unfair outcomes—intentionally or
    unintentionally—presents two relevant questions: (1) To what extent is the level
    of interpretability influenced by the type of machine learning deployed and how
    can advances in research address this? (2) What type of interpretability is required
    in different contexts?


    The human desire to provide accounts of how decisions are made prompts another
    important series of questions: When a computer system makes a mistake, who or
    what should be held accountable? Because computer systems can keep complete logs
    of their processing, they are in principle capable of producing much more complete
    and correct explanations. Should computer systems therefore be held to higher
    standards of explanation than humans?


    An additional key factor is the level of explanation required. An explanation
    provided to an engineer who will debug software in an automated vehicle would
    be far more technical in nature than an explanation about a vehicle malfunction
    provided to a user. Related to this is the purpose for which an explanation is
    being provided. Explanation of failure cases and biases that will be used to improve
    the computational model is likely to require a different level of accuracy and
    detail than the explanations needed for legal purposes.


    Another component of transparency is consistency—an understanding that similar
    cases will be treated similarly. Consistency is critical to enabling the users
    of a learning system to anticipate the future decisions of the system based on
    explanations of past decisions. Without consistency, it may be more difficult
    for users to gain trust in the system.


    ### Ethical Challenges in Specific Applications


    Ethical and legal concerns stemming from issues of fairness and bias relate to
    issues of trust and transparency.


    One application area in which these questions are most palpable is in the criminal
    justice system. Scoring systems applied to predict the likelihood of repeat offending
    are increasingly data-driven, and some make use of machine learning.


    These systems offer the hope of reducing bias in criminal sentencing, if the algorithm
    being used can be designed in a way that supports advanced analysis free of societal
    assumptions about factors such as race, gender, or socioeconomic status. However,
    the outputs of these systems reflect the data on which they are trained. If these
    data embody current societal biases or inequality, then—unless it is explicitly
    programmed otherwise—a machine learning system will replicate these biases.


    There are different approaches to monitoring the biases of such systems, many
    of which are based on the interpretability or transparency of the system:


    *   If the data used to create such models are publicly available, then the results
    can be tested or reproduced;


    *    Rule-based systems or other types of models may be more interpretable; and


    *   Fairness adjustments or constraints can be built into models.


    Identifying, controlling, and being transparent about bias in the system may be
    more manageable than seeking to eliminate it. In this sense, although interpretable
    models may not be as accurate as alternative approaches, being able to understand
    how a model functions and why it may be imperfect is likely to be helpful. Questions
    about how best to negotiate a tradeoff among interpretability, accuracy, and fairness
    are likely to endure.


    The use of machine learning systems in recidivism scoring also offers a new lens
    through which to view questions about the concept of unique treatment versus legal
    precedent. The law says that people need to be treated as individuals with dignity
    and thus have a right to defend themselves in an effort to shape the decision
    being made about them. However, the legal system also relies on precedent, which
    encourages the law to be applied to new cases in a similar way to its application
    in previous cases.


    Scoring via machine learning systems is also used in medicine. For example, there
    is a scoring system to predict mortality for patients with some illnesses and
    to recommend medical interventions accordingly.^([^(12)](#fn12))


    ### Living Alongside Machine Learning'
