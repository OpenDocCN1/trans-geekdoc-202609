    Peter Donnelly, FMedSci^([¹](#fn1))


    Michael Kearns, University of Pennsylvania, Co-Chair,


    Tom Dietterich, Oregon State University,


    Cynthia Dwork, NAS^([²](#fn2))


    Zoubin Ghahramani, FRS, University of Cambridge,


    Nathan Griffiths, University of Warwick,


    Sofia Olhede, University College London,


    David Vladeck, Georgetown University, and


    Bin Yu, NAS, University of California, Berkeley.


    This summary of the forum is drawn from the presentations and discussions of participants
    at the meeting. It was prepared by rapporteur Linda Casola with assistance from
    Michelle Schwalbe, Jessica Montgomery, Jon Eisenberg, Catherine Pollack, Kim DeRose,
    and Ben Wender, and it was reviewed in draft form by members of the planning committee.
