- raw: 'While genomics, mobile health sciences, and neuroscience are typically categorized
    within the health domain, the challenges posed by each are domain-specific, and
    the machine learning techniques required for each are highly specialized. For
    example, the classification tools most appropriate for understanding neuroscience
    may not be as effective in genomics research because of substantial differences
    in the nature of the data, its structure and properties, and the relationships
    between data and outcome or decision. A similar trend can be seen in other disciplines
    when the machine learning applications in one subcategory may not work for a tangentially
    related area. For many applications, combining domain knowledge with machine learning
    expertise will be essential to create effective outputs.


    ### Collaboration


    The domain-specificity of the challenges at hand makes collaboration in machine
    learning particularly important. Furthermore, the key components of machine learning—expertise,
    computing power, data, and algorithms—are not concentrated in any one domain,
    and industry, academia, and government all play significant roles.


    In the case of automated vehicles, for example, industry has resources and data
    that could help academics conduct better research. Government plays an important
    role as well through research funding and through its involvement in deploying
    infrastructure technology, such as traffic light sensors, that will affect the
    behaviors of automated vehicles.


    While technical solutions can address the broader social and ethical implications
    of this technology, collaborations also contribute to addressing these challenges.
    Opportunities in the spirit of collaboration include the following:


    *   Adding narratives to technical writing to help professionals in other disciplines
    better understand machine learning concepts,


    *   Committing to producing research that can be understood across disciplines,


    *   Raising awareness via public debate about potentially controversial machine
    learning issues, and


    *   Convening debates among diverse stakeholders.


    ## [EDUCATIONAL BARRIERS](../Text/content-toc.xhtml#pz3-9)


    ### Curriculum


    Companies are aggressively hiring new talent in machine learning. Although course
    offerings for the next generation of machine learners are expanding, building
    a stronger skills pipeline remains key to the health of the field:


    *   If one hopes to be prepared for the future workforce and the real challenges
    associated with this level of innovation, data literacy is essential. As early
    as the elementary school level, students could benefit from greater encouragement
    to develop a science, technology, engineering, and mathematics skill set.


    *   In many postsecondary curricula, only traditional mathematics is strongly
    emphasized, whereas students may benefit from a program that includes mathematics
    alongside computing and communication skills. Students should also gain an understanding
    of the ethical challenges associated with the use of data.


    Curricular changes will not happen overnight, but conversations among interested
    stakeholders should begin and plans should be made to fund programs that could
    improve students’ chances of securing relevant work in the future.


    ### Infrastructure


    In addition to curriculum changes, modifications to university course materials
    and course content can help prepare both machine learning experts and those likely
    to work with machine learning systems in the future:


    *   Technical programs will need to update the skills and knowledge with which
    they equip students to work in specific fields.


    *   For those studying machine learning, an understanding of the methods of social
    sciences and liberal arts will become important for addressing the legal and societal
    challenges that the technology presents.


    *    For researchers and scholars in academia, journal and tenure guidelines often
    focus too narrowly on recognition and attribution in only the traditional form
    of published papers; it is important that innovative and applied work in machine
    learning is also both rewarded and shared.


    ## [SOCIETAL ISSUES](../Text/content-toc.xhtml#pz3-10)


    ### Fairness, Privacy, Consent, and Cybersecurity


    Algorithmic decision-making systems may place a strain on some democratic values
    as machine learning enables new uses of data that challenge existing notions of
    fairness, privacy, and consent.


    The advanced analytical capabilities offered by machine learning pose new challenges
    to managing privacy: in some applications, machine learning will use data containing
    sensitive information, while in other cases machine learning might create sensitive
    insights from seemingly mundane data. New privacy-preserving technologies (e.g.,
    de-identification of data, differential privacy, homomorphic encryption) are being
    explored that can help lessen the risks of privacy breaches while enhancing the
    benefits of data sharing to society.^([⁶](#fn6))


    New economic models based on data collection also have the potential to raise
    privacy concerns. Consumers frequently share their personal data when carrying
    out everyday tasks online—for example, when online shopping—and may not be aware
    how much data companies can collect about them based on these transactions. Such
    cases create trade-offs between privacy and convenience or the desire for certain
    services. Some researchers suggest that there should be an opt-out feature, which
    would be a relatively straightforward technical fix, in which the user can select
    that the site erases all information collected and thus will treat the customer
    as a new user every time that customer visits. Others propose that individuals
    should be able to control their personal data and “decide for themselves how to
    weigh the costs and benefits of the collection, use, or disclosure of their information.”^([⁷](#fn7))


    Legislative structures that seek to ensure fairness in the provision of some products
    and services—and balance data protection with innovation—already exist, and these
    current “fairness structures,” set up primarily for financial security, demonstrate
    points of tension. For example, the U.S. Equal Credit Opportunity Act protects
    applicants from discrimination (e.g., race, color, religion, national origin,
    sex, marital status, age) in a credit transaction. Modern credit scoring systems
    use machine learning to evaluate creditworthiness, and so a question arises about
    which factors a model can and should use to make a decision. The U.S. Fair Credit
    Reporting Act supports the accuracy, fairness, and privacy of consumer information
    included in consumer reporting agency files. Thus, individuals are granted access
    to the credit score, as well as to all of the factors that may have adversely
    affected the score. Because of this, the Fair Credit Reporting Act ensures transparency
    of factors that led to deriving the credit score. The EU General Data Protection
    Regulation, which is expected to go into effect in May 2018, protects data that
    expose racial or ethnic origin; political or religious beliefs; and genetic, biometric,
    and health data.^([⁸](#fn8))


    This is not the case for all existing regulatory instruments: unlike the previously
    mentioned regulated scores, the unregulated Alternative Credit Score in the United
    States can use factors that would normally be prohibited under the Fair Credit
    Reporting Act because it uses those factors for marketing financial products instead
    of for determining creditworthiness.^([⁹](#fn9))'
