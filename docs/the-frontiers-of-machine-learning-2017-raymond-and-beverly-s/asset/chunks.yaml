- raw: "“Targeted advertising,” which became popular in the 1990s, seeks to present\
    \ advertisements to consumers that increase the likelihood that the consumer will\
    \ make a certain purchase or perform a certain action. To do this, the companies\
    \ collect data on their consumers’ behaviors or purchase histories and apply machine\
    \ learning methods to develop predictive models of future customer behavior.\n\
    \nIn finance, machine learning is used for assessing risk and managing assets.\
    \ Machine learning has also found applications in bioinformatics where complex\
    \ biological data (e.g., genetic code) are analyzed using either supervised or\
    \ unsupervised learning to better understand the ways in which cells function.\n\
    \nAutomated vehicles can independently navigate some public roadways by sensing\
    \ their environment and responding appropriately. Such vehicles learn where to\
    \ steer and how to locate other vehicles, people, and objects based on a range\
    \ of machine learning techniques, including using deep neural networks to analyze\
    \ image and video data. Advances in (1) data handling and communications bandwidth,\
    \ (2) computing power, (3) learning algorithms, and (4) efficient inference algorithms\
    \ help make automated vehicles more reliable, and advances in machine learning\
    \ theory could improve the technology even further. Important challenges remain,\
    \ such as identifying better metrics to evaluate the severity of driving errors\
    \ (e.g., causing a head-on collision versus running a red light), improving three-dimensional\
    \ perception, and functioning under poor weather or lighting conditions.\n\nAutomated\
    \ vehicles have the potential to reduce vehicle fatalities, increase mobility\
    \ for the elderly and those with disabilities, decrease environmental pollution,\
    \ and support new models of public transportation. However, questions remain about\
    \ the likelihood of these benefits being fully realized. For example, could this\
    \ technology result in more cars on the road, lengthen commutes, or lead to urban\
    \ sprawl? Alternatively, might fewer people choose to own cars, leading to increased\
    \ carpooling and a reduced number of cars on the road? If this is the case, fewer\
    \ parking lots would be needed across communities, and cities could find new ways\
    \ to use the space. Any significant change in car ownership also has potential\
    \ economic impacts; the automotive sector is a large component of many developed\
    \ economies, and the effects of such disruption are difficult to predict.\n\n\
    Automated vehicle deployment could also affect pedestrians and cyclists, as it\
    \ changes the commonly accepted—if unwritten—rules of the road. For example, how\
    \ can a pedestrian make eye contact with a driver before crossing a street when\
    \ there is no driver in an automated vehicle? Much of the communication among\
    \ road users and many of the predictions humans make about the behavior of other\
    \ road users when navigating a vehicle-populated environment is not explicit.\
    \ Rather, it relies on reading subtle observational cues combined with past experience\
    \ and knowledge of the environmental norms (e.g., driving behavior in the United\
    \ States is different from that in India). These questions open interesting avenues\
    \ of investigation, and researchers are developing models to better understand\
    \ how humans interact with intelligent devices in potentially dangerous situations.\
    \ This raises one facet of a broader question about vehicle safety standards:\
    \ should new standards be developed, or do current road safety standards translate\
    \ for automated vehicles?\n\nMachine learning is also finding new applications\
    \ in data science itself. There are not yet enough data scientists, statisticians,\
    \ and machine learning experts to dedicate adequate time to understanding the\
    \ data, building models, and making predictions. One possible solution to this\
    \ shortage of experts is the Automatic Statistician project, which is creating\
    \ systems that are able to automate data analysis.^([⁵](#fn5))\n\n\\_\\_\\_\\\
