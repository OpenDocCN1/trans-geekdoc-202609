    ![](img/cover.jpg)


    ![图像](img/cover.jpg)


    机器学习的

    前沿


    2017 年雷蒙德与贝弗利·萨克勒美英科学论坛


    | ![images](img/img-1-1.jpg) **美国国家科学院** || ![images](img/img-1-2.jpg) |

    | --- | --- |


    # 前言


    机器学习——作为一种允许计算机系统从数据中学习的人工智能形式——的飞猛发展正吸引着科学界、经济界和公众的关注。近年来，机器学习系统已进入日常使用，而跨医疗保健、交通、金融等领域的进一步应用，可能将在未来几十年内塑造这些领域的发展。这些进步所带来的社会和经济机遇是巨大的，各国正在努力应对人工智能如何影响社会。


    美国和英国正出现关于社会如何以及在何处最有效地利用机器学习的新兴政策辩论。随着机器学习系统能力及其应用范围的不断增长，因此美国国家科学院和皇家学会汇聚这些领域的领军人物显得尤为适宜。


    自 2008 年以来，雷蒙德与贝弗利·萨克勒美英科学论坛一直汇集来自不同科学领域的思想领袖，就国际科学关注的话题进行思想交流，并帮助美国和英国科学家之间建立起持久的伙伴关系。


    “机器学习的前沿”论坛于 2017 年 1 月 31 日和 2 月 1 日在华盛顿特区的美国国家科学院举行。此次活动汇聚了了顶尖研究人员和政策专家，共同探索机器学习研究的最前沿以及该领域技术进步的影响。本报告总结了活动中的高层讨论，重点关注机器学习进展中一些令人兴奋的领域以及随之而来的社会辩论。


    美国国家科学院和皇家学会共同肩负使命：促进科学造福社会，并为重要的政策辩论提供信息。作为美国国家科学院和皇家学会的主席，我们荣幸介绍由雷蒙德与贝弗利·萨克勒基金会慷慨捐赠支持的最新成果。


    | Marcia McNutt || Venki Ramakrishnan |

    | --- | --- |

    | 美国国家科学院院长 || 皇家学会主席 |


    # 致谢


    以下优秀学者担任了规划委员会成员：


    Peter Donnelly, FMedSci^(¹)


    Michael Kearns, 宾夕法尼亚大学，联合主席，


    Tom Dietterich, 俄勒冈州大学，


    Cynthia Dwork, NAS^(²)


    Zoubin Ghahramani, FRS, 剑桥大学，


    Nathan Griffiths, 华威大学，


    Sofia Olhede, 伦敦大学学院，


    David Vladeck, 乔治敦大学，以及


    Bin Yu, NAS, 加州大学伯克利分校。


    本论坛摘要摘自会议期间参与者的演讲和讨论。它由记录员 Linda Casola 在 Michelle Schwalbe、Jessica Montgomery、Jon
    Eisenberg、Catherine Pollack、Kim DeRose 和 Ben Wender 的协助下编写，并由规划委员会成员以草稿形式进行了评审。评审人员提供了意见和建议，但并未要求认可文档中的观点。评审过程的监督由美国国家科学院科学计划委员会提供。诚感谢雷蒙德与贝弗利·萨克勒美英科学论坛对本次活动的支持。


    | ![images](img/img-4-1.jpg) || 美国国家科学院于 1863 年根据林肯总统签署的国会法建立，作为一家私人非政府机构，就与科学技术相关的问题为国家提供建议。成员由同仁根据其对研究的卓越贡献选举。Marcia
    McNutt 博士任院长。 |

    | --- | --- |

    | ![images](img/img-4-2.jpg) || 皇家学会是由许多世界上最著名的科学家组成的自治会员团体。其成员涵盖科学、工程和医学的所有领域。它是英国的国家科学院。学会的根本宗旨反映在其
    17 世纪 60 年代的创始宪章中，即承认、促进和支持科学的卓越成就，并鼓励科学的发展和利用以造福人类。 |


    __________________________


    # 摘要


    雷蒙德与贝弗利·萨克勒美英科学论坛“机器学习的前沿”于 2017 年 1 月 31 日和 2 月 1 日在华盛顿特区的美国国家科学院（科学、工程和医学学院总部）举行。由美国和英国优秀学者组成的规划委员会组织了此次论坛。论坛吸引了
    60 多名现场会者和 500 多来自学术界、政府、工业界和慈善界的网络直播参与者。


    机器学习正通过语音识别、目标检测和图像感知等功能的改进来改变日常活动。医学、交通、金融、政府和教育领域可能会被这种创新技术发生变革，个人和社区的生活工作方式也是如此。例如，某些通常由人类完成的任务已经由计算机系统完成，这些系统能够执行的任务范围和复杂性正在增长。


    由于计算能力的增强、更好的算法和工具以及可用数据量的增加，机器学习仍在快速推进。机器学习现在已应用于多个领域，包括交通和自动驾驶汽车、医疗保健和疾病的遗传基础，以及刑事司法和预测再犯率。


    随着机器学习的发展，新的技术和社会挑战正在出现。这些挑战涉及使用某些类型数据的伦理问题（由于隐私或数据收集偏差）、以不同方式管理数据以及自动化某些过程（例如，生死决策）。它们还根源于人类与机器学习系统如何互动的问题，以及适应系统日益无处不在的世界的社会挑战。


    这些挑战之外，各个行业和研究领域也带来了令人兴奋的机遇，学术界和商业界正在进行具有启发性的跨学科研究。支持这种研究的环境——基于开放的标准和工具、有效的教育、通过有效互动建立公众信任以及对不同用户的理解——有助于确保机器学习的社会经济效益。


    本报告是论坛贡献的总结。它不代表美国国家科学院或皇家学会的观点。


    # 1 引言


    机器学习正通过语音识别、目标检测和图像感知等功能的改进来改变日常活动。医学、交通、金融、政府和教育领域可能会被这种创新技术发生变革，个人和社区的生活工作方式也是如此。例如，某些通常由人类完成的任务已经由计算机系统完成，这些系统能够执行的任务范围和复杂性正在增长。


