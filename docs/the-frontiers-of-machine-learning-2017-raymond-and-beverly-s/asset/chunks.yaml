  trans: '


    这引发了对技术本身以及从事其应用工作人员治理的问题。例如，对于数字助手等设备，数据收集是否应该进行自我监管？由于这些数据被认为是不受监管的，目前美国尚没有适用的公平报告法律。在欧盟，预计于
    2018 年 5 月生效的《通用数据保护条例》将解决“自动化个人决策（包括画像分析）”，并指出个人“有权不受完全基于自动化处理（包括画像分析）的决策的影响，除非该决策对其产生了法律影响或对其造成了类似程度的重大影响”，并且，如果此类处理是必要的，该个人将“至少有权获得人工干预[...]以表达其观点并对决定提出异议”。^(¹⁶)


    ## 工具与知识的开放共享


    确保工程师、设计师、商业领袖和发明者具备所需的知识和技能，以充分发挥新技术的价值至关重要。共享知识——例如通过教育材料和工具——是必的，加强行业、学术界和政府之间的沟通也同样重要。不同部门的研究通常是互补的，提供数据和真实案例对于确保学习和最佳实践的快速传播至关重要。持续资助支持机器学习及相关领域的学术研究和教育，也有助于该领域的发展。


    创新需要对数据、代码和其他资源的访问。工具开源、在线学习以及鼓励研究人员公开分享他们的发现，可以促进创新的增长。


    ## 未来的机器学习


    随着机器学习改变我们所处的世界并改善我们生活的许多方面，必须考虑其法律、社会和伦理影响。这项技术的多元化应用可能会继续扩大和成熟。随着这些应用的发展，协作、教育、对该技术可能负面影响的意识，以及解决问题时的创造力，对于缓解当今的紧迫挑战并允许未来持续增长至关重要。


    __________


    # 附录


    ***


    ## 萨克勒机器学习论坛（Sackler Forum）计划


    机器学习是许多已成为日常生活的应用的核心，从语音识别到图像感知。这些技术在几年前的表现明显低于人类水平，而现在在某些任务上已经超越人类。随着该领域的不断演进，机器学习有望在交通、医学、公共服务和金融等多个领域发挥变革性作用。本次论坛汇聚了来自英国和美国的科学家，探索机器学习的潜在应用，并讨论人类与机器学习算法互动时产生的法律和伦理问题。


