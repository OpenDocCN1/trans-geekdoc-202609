    4.  ^([2](#chapter01.xhtml#Ac1)) Neural networks are “computing system\[s\] made
    up of a number of simple, highly interconnected processing elements, which process
    information by their dynamic state response to external inputs.” (M. Caudill,
    1989, Neural networks primer: Part I, *AI Expert* 2(12): 46-52.) The outputs are
    equivalent to the sum of the inputs multiplied by their weights. More specifically,
    the inputs are applied, the actual versus desired output is calculated, the error
    is propagated backward into the network, and weights are adjusted to minimize
    the error. Neural networks are trained repeatedly, with inputs adjusted each time,
    to get closer to a desired output. It remains difficult to predict what will happen
    with these networks, especially with unknown or untrained input, so they must
    continually be trained with new samples—simply changing the code is insufficient.
    Over time the development of more complex, large-scale, multilayered neural networks
    has allowed researchers to work on problems at scale.[↩](#fnref4)


