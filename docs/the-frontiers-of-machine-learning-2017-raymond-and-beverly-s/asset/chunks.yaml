- raw: 'To explore these issues in greater depth, the Raymond and Beverly Sackler
    U.S.-U.K. Scientific Forum “The Frontiers of Machine Learning” was held on January
    31 and February 1, 2017, at the Washington, D.C., headquarters of the National
    Academies of Sciences, Engineering, and Medicine. A planning committee of distinguished
    scholars from the United States and the United Kingdom organized the forum.


    The forum drew over 60 in-person attendees and over 500 webcast participants from
    academia, government, industry, and philanthropy. Participants included industry
    leaders, machine learning researchers, and experts in privacy and the law. They
    represented strong proponents of widespread adoption of machine learning as well
    as those with concern for the societal tensions that arise with expanding the
    use of machine learning. This 2-day meeting included presentations and discussions
    on the current state of the art in machine learning, its relationship to other
    fields, challenges in the field, and key considerations for its future development.


    This publication provides a summary of the observations shared by forum participants.
    It does not reflect a consensus of the participants or the views of the sponsoring
    organizations. Instead, it is intended to provide perspectives and suggestions
    from a selection of individuals working at the frontier of machine learning and
    studying its implications. It examines the evolution of the field and its applications,
    some of the social and ethical tensions to which advances in machine learning
    have contributed, and considerations for the future development of the field.


    ## [UNDERSTANDING ARTIFICIAL INTELLIGENCE, MACHINE LEARNING, AND ROBOTICS](../Text/content-toc.xhtml#pz3-5)


    The terms “artificial intelligence,” “machine learning,” and “robotics” are often
    used interchangeably, but important distinctions exist.


    While specific definitions vary, artificial intelligence is, generally speaking,
    any method for programming computers to enable them to carry out tasks or behaviors
    that would require intelligence if performed by humans. Early work in this field
    focused on automated reasoning; using these approaches, programs were written
    as sets of logical statements against which queries were processed by theorem
    proving and search. For example, computers could be programmed with the rules
    for board games and then tasked with finding sequences of moves that could defeat
    an opponent. To obtain the logical rules (or inferences) for such systems, researchers
    in the field first turned to interviewing experts in the relevant domains (e.g.,
    medical diagnosis, fault diagnosis). When the need to reason under uncertainty
    became increasingly evident, especially in medicine and in engineering applications,
    the field embraced probabilistic models as a replacement for systems of logical
    rules. This in turn required developing methods for probabilistic reasoning. However,
    in many applications, it was very difficult to build probabilistic models manually
    and determine their parameters. The field then turned to machine learning and
    related methods in statistics and pattern recognition to help address this challenge.
    Instead of interviewing human experts and seeking to codify the steps they take
    to solve a problem, these systems examine data—that is, examples of how to solve
    the problem at hand—to find patterns and rules that can drive decision making,
    such as clustering and classification.


    Machine learning draws from a variety of fields, including computer science, statistics,
    engineering, cognitive science, and neuroscience. Researchers in machine learning
    develop both the mathematical foundations and the practical applications of systems
    that learn from data.


    Broadly speaking, machine learning can be divided into three branches: supervised,
    unsupervised, and reinforcement learning. “Supervised learning” is based on a
    program that learns from previous examples: a model with specified parameters
    receives input and makes a prediction based on function estimation. This prediction
    is then compared to the actual outcome, and the similarity or difference between
    the two then informs the updates to the model parameters. For example, a supervised
    learning model can use photos with information about what is shown in those photos
    to then recognize and identify features in new photos. “Unsupervised learning”
    can be used where there is a dearth of labeled data on which to train algorithms.
    An unsupervised machine learning system processes a large amount of data, finding
    patterns in the data and learning the characteristics that make data points more
    or less similar to each other. “Reinforcement learning” emphasizes learning by
    trial and error, using rewards or punishments for success or failure at a task
    as a means to discover successful ways of behaving in complex environments.


    The field of machine learning continues to advance at a rapid pace as a result
    of improved computational resources, better algorithms and tools, increased availability
    of data to train systems, and the ingenuity of those developing machine learning
    systems. There are countless applications of machine learning in society that
    help people become more organized and make processes more efficient—for example,
    in organizing digital photo collections, managing spam in email platforms, and
    supporting navigation devices. Machine learning can solve problems related to
    classification, regression, clustering, dimensionality reduction, semi-supervised
    learning, and reinforcement learning. These are often referred to as the “canonical”
    problems in machine learning and are described in [Box 1](#chapter01.xhtml#pAos).


    The term “artificial intelligence” can often evoke ideas of human-like intelligence
    in machines, known as “artificial general intelligence.” The goal of artificial
    general intelligence research is to create artificial intelligence systems that
    have the ability to adapt to a range of tasks and could develop a breadth of capabilities
    that would match or exceed those of humans. Such systems are different from current
    artificial intelligence systems that are designed to solve specific target tasks
    but lack any knowledge or capability beyond those tasks. Some scholars have argued
    that once systems achieve human-level breadth and capability, they could start
    improving themselves and therefore rapidly exceed human capabilities. Most researchers
    maintain, however, that there is no technical basis for such concerns and that
    matching human capabilities is not a critical threshold in the development of
    artificial intelligence. These researchers worry that a focus on developing systems
    with human-level intelligence detracts from the need to address near-term questions
    about how to create artificial intelligence systems that behave correctly, safely,
    and reliably.


