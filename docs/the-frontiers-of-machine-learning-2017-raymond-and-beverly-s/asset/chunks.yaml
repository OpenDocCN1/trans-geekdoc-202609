    Machine learning is also finding new applications in data science itself. There
    are not yet enough data scientists, statisticians, and machine learning experts
    to dedicate adequate time to understanding the data, building models, and making
    predictions. One possible solution to this shortage of experts is the `Automatic
    Statistician` project, which is creating systems that are able to automate data
    analysis.


