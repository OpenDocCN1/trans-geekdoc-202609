- raw: "In addition to specific challenges arising from the governance of data used\
    \ in machine learning or the capabilities of current machine learning systems,\
    \ and the benefits to be gained from such systems, there is a broader suite of\
    \ questions raised by the increasing pervasiveness of machine learning systems.\
    \ At a fundamental level, these questions ask how society will change as people\
    \ live and work with automated systems, as well as with the new forms of human–computer\
    \ interaction that could follow.\n\nConcerns about automation and the workforce\
    \ are already present in debates about machine learning, rooted in fears about\
    \ humans being replaced by or becoming dependent upon machines. In some cases,\
    \ fears arise about how machine learning could hurt individuals or restrict human\
    \ experiences by limiting the choices of products, services, and activities available\
    \ or by reducing interactions between human beings.^([^(13)](#fn13))\n\nMost people\
    \ are happy to have processes automated that are dirty, dull, or dangerous, but\
    \ what about other tasks that fall outside these categories? Warfare is an example\
    \ in which there are continuing ethical debates about the use of algorithms that\
    \ may make a decision about taking human lives. Results from public dialogues\
    \ on machine learning in the United Kingdom indicate that there is a general preference\
    \ to have a “human in the loop” for decisions that affect people in a personal\
    \ or sensitive way—for example, in healthcare.\n\nThere are also broader questions\
    \ about how the benefits of machine learning can be shared across society and\
    \ how society can capitalize on the opportunities these technologies present,\
    \ whether in healthcare, transportation, or education. In seeking to address these\
    \ questions, there may be lessons from previous technological advances that have\
    \ transformed the ways people live and work through automation. During the Industrial\
    \ Revolution, individuals had to adapt to new ways of communicating, traveling,\
    \ and working. Will humans today be able to adapt similarly to the changes to\
    \ work and other aspects of life resulting from advances in machine learning?\
    \ Questions about how people live alongside machine learning will persist, and\
    \ continuing dialogue will be important in negotiating them.\n\n\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\n| \n\n# [3](../Text/content-toc.xhtml#pz3-11)\n\
    \n || \n\n# [The Future of Machine Learning](../Text/content-toc.xhtml#pz3-11)\n\
    \n |\n\n| --- | --- |\n\n## [UNDERSTANDING THE NEEDS OF DIFFERENT USERS AND USE\
    \ CASES](../Text/content-toc.xhtml#pz3-12)\n\nAs previously discussed, different\
    \ domains and applications require machine learning systems with different characteristics.\
    \ For example, the justice system is associated with different pressures than\
    \ the transportation system. Understanding these different needs and use cases\
    \ will be important in ensuring the field is able to realize its full potential.\n\
    \n## [ENGAGEMENT FOR STAKEHOLDERS](../Text/content-toc.xhtml#pz3-13)\n\nAs the\
    \ technical abilities of machine learning systems increase and their societal\
    \ implications become more pronounced, it will be important for a diverse community\
    \ of users and developers to help shape both technology development and policy\
    \ discussions. To push forward the boundaries of machine learning, engineers,\
    \ data scientists, and computer scientists can benefit from the following perspectives:\n\
    \n*   Sociologists could play important roles, including discussing the ethical\
    \ and societal issues of the technology;\n\n*   Psychologists and human factors\
    \ experts could offer insight on the ways in which humans interact with technology;\n\
    \n*    Unions and industrial psychologists could represent the voices of workforce\
    \ changes that may result from continued development in artificial intelligence;\n\
    \n*   Policy makers and regulators could contribute to a dialogue about autonomy\
    \ and fair information principles; and\n\n*   Historians could contribute knowledge\
    \ about past eras of rapid technological change and inform today’s debate.\n\n\
    This interdisciplinary approach should also be reflected in professional training\
    \ for artificial intelligence and in policy making for the field.\n\n## [ALGORITHM\
    \ DEVELOPMENT AND MODEL CONSTRUCTION](../Text/content-toc.xhtml#pz3-14)\n\nAdvances\
    \ in the technical abilities of machine learning algorithms have contributed to\
    \ the recent success of the field. Algorithms are “encoded procedures for solving\
    \ a problem by transforming input data into a desired output, based on specified\
    \ calculations and procedures.”^([^(14)](#fn14))\n\nMany applications in public\
    \ policy highlight these trade-offs. For example, when seeking fairness in a model\
    \ being used in criminal justice and determining acceptable rates of false positives\
    \ or false negatives, is it worse to incarcerate a low-risk individual (false\
    \ positive) than to release from prison a high-risk individual (false negative)?\
    \ If the algorithms are kept “fair” by reducing false negatives and excluding\
    \ certain predictive criteria based on legally protected personal characteristics,\
    \ more high-risk individuals may be released or more low-risk individuals may\
    \ be incarcerated.\n\nIn some cases, such as criminal justice, fairness may become\
    \ even more important than accuracy. It is important that algorithms are developed\
    \ and conveyed such that the trade-offs are transparent. This will help increase\
    \ confidence not just in the algorithm but also in the decision-making process.\
    \ Context is also important in developing the algorithm, if such data can be collected.\
    \ It may be useful to encode social norms into the machine learning and optimization\
    \ processes so as to focus more on fairness.\n\nThe broader social consequences\
    \ of the ubiquitous use of algorithms and increasing personalization are also\
    \ important to consider. This personalization could lead to “algorithmic bubbles”\
    \ that classify people based on their usual behaviors, beliefs, and actions and\
    \ preferentially provide them with information consistent with these. This could\
    \ insulate currently held beliefs from challenge and could divide societies into\
    \ segments that cease to communicate.\n\n## [GOVERNANCE AND PUBLIC CONFIDENCE](../Text/content-toc.xhtml#pz3-15)\n\
    \nGiven the wide range of approaches to machine learning and possible application\
    \ areas, public confidence in these systems will be key to their continued success.\n\
    \nThe term “governance” in this context refers to a diverse set of instruments\
    \ and behaviors that shape how machine learning is used: it encompasses codes\
    \ of practice, institutional norms, and individual behaviors, as well as specific\
    \ policies and direct regulation by the government.\n\nThere are already efforts\
    \ in place for the government to better understand, offer support, and set standards\
    \ related to artificial intelligence. For example, algorithms for certain tasks\
    \ already have to follow existing laws, such as being nondiscriminatory. It is\
    \ important to note that governance is not synonymous with constraint; instead,\
    \ it can give the confidence and public acceptance that enables new applications\
    \ to be developed.\n\nWhile some have called for further governance of machine\
    \ learning, both the feasibility and desirability of governance approaches based\
    \ on targeted regulation of machine learning algorithms have been questioned in\
    \ different settings. “Artificial Intelligence and Life in 2030” suggests, “Attempts\
    \ to regulate artificial intelligence in general would be misguided since there\
    \ is no clear definition of artificial intelligence (it is not any one thing),\
    \ and the risks and considerations are very different in different domains. Instead,\
    \ policy makers should recognize that to varying degrees and over time, various\
    \ industries will need distinct, appropriate, regulations that touch on software\
    \ built using artificial intelligence or incorporating artificial intelligence\
    \ in some way.”^([^(15)](#fn15))"
