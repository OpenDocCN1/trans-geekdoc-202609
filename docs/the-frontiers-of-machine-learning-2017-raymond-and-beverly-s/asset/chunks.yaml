    \n1. `FMedSci`, 医学科学院\n2. `NAS`, 国家科学院\n3. C.D. Manning, P. Raghavan, and H. Schütze,\
    \ 2008, *Introduction to Information Retrieval*, Cambridge\n4. 神经网络是由许多简单、高度连接的处理单元组成的计算系统，通过对外部输入的动态状态响应来处理信息。（M.\
    \ Caudill, 1989, Neural networks primer: Part I, *AI Expert* 2(12): 46-52.）输出等于输入与其权重之和。具体而言，应用输入，计算实际与预期输出之间的差异，将误差反向传播到网络，并调整权重以最小化误差。神经网络经过反复训练，每次都调整输入，以接近预期输出。预测这些网络会发生什么仍然困难，特别是在面对未知或输入输入时，因此必须不断使用新样本进行训练。随着时间的推移，更复杂、大规模、多层神经网络的发展允许研究人员处理大规模问题。\n\
