    \n || \n\n# [Machine Learning Challenges](../Text/content-toc.xhtml#pz3-7)\n\n\
    \ |\n\n| --- | --- |\n\n## [TECHNOLOGICAL CONSIDERATIONS](../Text/content-toc.xhtml#pz3-8)\n\
    \n### Different Needs for Different Applications\n\nMuch of the excitement generated\
    \ by machine learning arises from its broad applicability across different subjects\
    \ or domains. This also presents a challenge for the field: while many approaches\
    \ can cut across applications, each use case involves different considerations\
    \ and the construction of different types of systems. The following examples describe\
    \ how several research areas in biomedicine require customized machine learning\
    \ techniques. Similar customization is needed in many other fields.\n\nMedical\
    \ researchers, for example, have begun to use genetics data, medical records,\
    \ patient registries, activity logs, environmental data, and medical imaging to\
    \ better understand all aspects of human health. In the field of genomics, modifications\
    \ in gene regulation and gene function resulting from mutated segments of DNA\
    \ allow researchers to identify which regions of the genome influence a particular\
    \ trait associated with a particular disease. Statistical methods related to machine\
    \ learning are being developed to enable researchers to design medical interventions\
    \ that would improve the lives of people with particular health issues in the\
    \ future.\n\nMobile health interventions that employ a smart phone application\
    \ or wearable technology to encourage specific behavior, such as increased exercise,\
    \ are another potential application area for machine learning techniques. Two\
    \ possible schemes for generating notifications to patients are “pull” interventions,\
    \ which rely on individuals’ requests for interventions, and “push” interventions,\
    \ which employ sensors, self-reports, and computer algorithms to decide when an\
    \ intervention is needed as well as what intervention might be most appropriate.\
    \ The shared goal of both types of notifications is to promote healthy behavior\
    \ and aid in the development of longer-term treatment policies. This is similar\
    \ to the action-reward structure of reinforcement learning, with the long-term\
    \ benefit of improved health serving as the reward for the action of responding\
    \ to the health notifications.\n\nIn the study of neuroscience, the ability of\
    \ machine learning to spot patterns and make predictions makes it a key tool in\
    \ analyzing the vast quantities of neuroimaging data available today. Functional\
    \ magnetic resonance imaging (fMRI) is used to track blood flow within the brain\
    \ to deduce functional or physiological properties. When a patient or research\
    \ subject examined using an fMRI machine is presented with an external stimulus,\
    \ the responding brain area will have an increase in blood flow, which will be\
    \ displayed clearly on an fMRI monitor. Classification can then be applied to\
    \ a set of fMRI images to determine if patterns exist among participants within\
    \ brain regions of interest. Neuroimaging applications range from diagnostic tools\
    \ for neurological disorders to enhanced understanding of neural connectivity\
    \ between brain regions. There are analogous opportunities for machine learning\
    \ to help in many other areas of medical imaging."
