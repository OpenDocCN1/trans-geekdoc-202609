    ### 第二场会议：机器学习与社会


    人类与机器学习在各种背景下的互动日益频繁。机器学习的扩张引发了法律和伦理问题，重新界定了关于数据使用的讨论，并对自动化决策的社会接受度、管理刻板印象或隐私的流程充分性等提出了新挑战，这些因素都将影响社会对机器学习部署的信任。


