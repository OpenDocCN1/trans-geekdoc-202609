    technology result in more cars on the road, lengthen commutes, or lead to urban
    sprawl? Alternatively, might fewer people choose to own cars, leading to increased
    carpooling and a reduced number of cars on the road? If this is the case, fewer
    parking lots would be needed across communities, and cities could find new ways
    to use the space. Any significant change in car ownership also has potential economic
    impacts; the automotive sector is a large component of many developed economies,
    and the effects of such disruption are difficult to predict.


    Automated vehicle deployment could also affect pedestrians and cyclists, as it
    changes the commonly accepted—if unwritten—rules of the road. For example, how
    can a pedestrian make eye contact with a driver before crossing a street when
    there is no driver in an automated vehicle? Much of the communication among road
    users and many of the predictions humans make about the behavior of other road
    users when navigating a vehicle-populated environment is not explicit. Rather,
    it relies on reading subtle observational cues combined with past experience and
    knowledge of the environmental norms (e.g., driving behavior in the United States
    is different from that in India). These questions open interesting avenues of
    investigation, and researchers are developing models to better understand how
    humans interact with intelligent devices in potentially dangerous situations.
    This raises one facet of a broader question about vehicle safety standards: should
    new standards be developed, or do current road safety standards translate for
