  md: 'Before using any service or API, be sure to review their terms of service and
    follow them! We do not encourage unlawful behavior in any way.


    # # Connecting to the Twitter API


    Luckily for us, there is a nice package in R to retrieve our Tweets: The library
    twitteR. First, there are a number of steps you need to follow:


    +   1. If you do not have one, create a Twitter account to be able to access their
    API.

    +   2. Go to `https://dev.twitter.com/apps` and log in with your credentials.

    +   3. Once logged in, click on **Create New App**.

    +   4. Put this as callback URL `http://localhost:1410`.

    +   5. Now go to **Keys and Access Tokens** and then **Create my access token**.

    +   6. You should have a screen showing you four things:

    +      - Consumer key

    +      - Consumer secret

    +      - Access token

    +      - Access secret


    Use them in the following snippet to gather some Tweets:


    ```

    #install.packages("twitteR")

    library(twitteR)


    # Change the next four lines based on your own consumer_key,

    consumer_secret, access_token, and access_secret.

    consumer_key <- "YOUR CONSUMER KEY"

    consumer_secret <- "YOUR CONSUMER SECRET"

    access_token <- "YOUR ACCESS TOKEN"

    access_secret <- "YOUR ACCESS SECRET"


    setup_twitter_oauth(consumer_key, consumer_secret, access_token,

    access_secret)

    tw = twitterR::searchTwitter(''#something'',

    , n = 1e4

    , since = ''2017-12-08''

    , retryOnRateLimit = 1e3)

    d = twitterR::twListToDF(tw)

    ```'
  merge: -1
  img_proc: true
