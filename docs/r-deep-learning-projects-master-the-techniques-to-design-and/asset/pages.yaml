    Using the command, plot(history), we can see how the training went for this example:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_114_0.png)


    Training of our autoencoder.


    So we see that, while the accuracy remains fairly high, there is a mysterious
    drop during the training. We should not worry too much about it for now, we will
    come to this issue later. As for the loss, it keeps decreasing as we add more
    data, which is expected.


    Finally, Let''s look at the reconstruction. We first generate the predictions
    from our trained autoencoder:


    ```

    preds <- autoencoder %>% predict(df)

    colnames(preds) <- c("V1", "V2")

    preds <- as.data.frame(preds)

    ```'
