  md: 'Where alpha and X_max are hyperparameters that you can choose.


    # # Sentiment analysis from movie reviews


    Let''s continue with the IMDb data and put into practice the ideas from the previous
    sections. In this section, we will use a few familiar packages, like `tidytext`,
    `plyr` and `dplyr`, as well as the excellent `text2vec` by Dimitriy Selivanov,
    which was released in 2017, and the well-known `caret` package by Max Kuhn.


    # # Data preprocessing


    We need to prepare our data for the algorithm.


    First, a few imports that will be necessary:


    ```

    library(plyr)

    library(dplyr)

    library(text2vec)

    library(tidytext)

    library(caret)

    ```


    We will use the IMDb data as before:


    ```

    imdb <- read.csv(". /data/labeledTrainData.tsv", encoding = "utf-8", quote = "",
    sep="\t", stringsAsFactors = F)

    ```


    And create an iterator over the tokens:


    ```

    tokens <- space_tokenizer(imdb$review)

    token_iterator <- itoken(tokens)

    ```


    The tokens are simple words, also known as **unigrams**. This constitutes our
    vocabulary:


    ```

    vocab <- create_vocabulary(token_iterator)

    ```


    It''s important for the co-occurrence matrix to include only words that appear
    frequently together a significant amount of times. We will set this threshold
    to 5 :


    ```

    vocab <- prune_vocabulary(vocab, term_count_min = 5)

    ```


    We use our filtered vocabulary:


    ```

    vectorizer <- vocab_vectorizer(vocab)

    ```'
  merge: -1
  img_proc: true
- pgno: 221
  md: "And set up a window of size 5 for context words:\n\n```\ntcm <- create_tcm(token_iterator,\
    \ vectorizer, skip_grams_window = 5)\n```\n\nNow that we have the co-occurrence\
    \ matrix, let's continue with the vector embedding.\n\n# # From words to vectors\n\
    \nWe are ready to create the word embedding using GloVe. First, let's initialize\
    \ an instance of the GlobalVectors class:\n\n```\nglove <- GlobalVectors$new(word_vectors_size\
    \ = 50,\n                                vocabulary = vocab,\n               \
    \                 x_max = 10)\n```\n\nWe now apply the fit_transform method (scikit\
    \ learn users might be familiar with it):\n\n```\nwv_main <- glove$fit_transform(tcm,\n\
    \                                 n_iter = 10,\n                             \
    \    convergence_tol = 0.01)\n```\n\nAnd once this is done, we have our vectorizer\
    \ ready. We now need to parse our text:\n\n```\ntext <- unlist(imdb$review)\n\
    length(text)\n# 25000\ntext_df <- data_frame(line = 1:25000, text = text)\n```\n\
    \nAnd apply the unnest_tokens functions from tidytext to turn our data in a tidy\
    \ format:\n\n```\ntext_df <- text_df %>%\n  unnest_tokens(word, text)\nhead(text_df)\n\
    ```\n\nThis gives a familiar output:\n\n```\nhead(text_df)\n# A tibble: 6 x 2\n\
    \  line word\n  <int> <chr>\n1    1 with\n2    1 all\n3    1 this\n4    1 stuff\n\
    5    1 going\n6    1 down\n```"
