    The second convolutional layer extracts higher-level features of the input images,
    such as

    shape and contour. All these 50 feature maps combined together, provide rich

    representations which are then fed into the fully connected layers. Therefore,
    classification

    performance is increased thanks to the convolution operations.


    So far, we have examined the effectiveness of our CNN model by plotting the learning

    curve and visualizing the convolution extracted features. We can do one more inspection
    on

    the generalization of our model. For instance, we can take out a subset of data
    from the

    testing set to simulate a validation set, and use the remainder as the new testing
    set. We

    perform **early stopping** based on the validation set, which provides instruction
    on how

    many iterations is good enough and does not overfit the model. Finally, we employ
    the

    trained model with early stopping on the testing set and see how well the model
    is able to

    generalize to unseen data.


    We first split the testing set into validation (40%) and final testing set (60%):


    ```

    > validation_perc = 0.4

    > validation_index <- createDataPartition(data_test.y, p=validation_perc,

    list=FALSE)

    >

    ```'
