    # Our first examples


    Let''s begin with a few simple examples to understand what is going on.


    For some of us, it''s very easy to get tempted to try the shiniest algorithms
    and do hyper-parameter optimization instead of the less glamorous step-by-step
    understanding.


    # A simple 2D example


    Let''s develop our intuition of how the autoencoder works with a simple two-dimensional
    example.


    We first generate 10,000 points coming from a normal distribution with mean 0
    and variance 1:


    ```

    library (MASS)

    library (keras)

    Sigma <- matrix(c(1,0,0,1),2,2)

    n_points <- 10000

    df <- mvrnorm(n=n_points, rep(0,2), Sigma)

    df <- as.data.frame(df)

    ```'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'The distribution of the values should look as follows:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_112_0.png)


    Distribution of the variable V1 we just generated; the variable V2 looks fairly
    similar.


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_112_1.png)


    Distribution of the variables V1 and V2 we generated.


    Let''s spice things up a bit and add some outliers to the mixture. In many fraud
    applications, the fraud rate is about 1–5%, so we generate 1% of our samples as
    coming from a normal distribution, with mean 5 and standard deviation 1:


    ```

    # Set the outliers

    n_outliers <- as.integer(0.01*n_points)

    idxs <- sample(n_points, size = n_outliers)

    outliers <- mvrnorm(n=n_outliers, rep (5,2), Sigma)

    df[idxs, ] <- outliers

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: "The new distribution of points looks like this now:\n\n![](img/da8fb67f2acf661518076e08b6ffd9b9_113_0.png)\n\
    \nNew distribution of points after adding the outliers.\n\nWe will use an autoencoder\
    \ with a single neural network in the hidden layer. Why not add more? The problem\
    \ is that if the hidden state has equal or higher dimensions than the input state,\
    \ we risk that our model might learn the identity function, that is, that the\
    \ model learns g(f(x))=x everywhere. This is clearly not a very useful outlier\
    \ identification method. We need to capture the essential features of the data,\
    \ so that those unusual features would be highlighted later on, hence allowing\
    \ to detect outliers.\n\nWith keras, it is really easy to set up the model, we\
    \ need an input layer of shape 2, for our two-dimensional example. This is passed\
    \ to our one-dimensional encoder, using a ReLU activation function and then decoded\
    \ back into a two-dimensional space:\n\n```\ninput_layer <- layer_input(shape=c(2))\n\
    encoder <- layer_dense(units=1, activation='relu')(input_layer)\ndecoder <- layer_dense(units=2)(encoder)\n\
    autoencoder <- keras_model(inputs=input_layer, outputs = decoder)\n```\n\nBefore\
    \ using the model, we need to compile it. We need to specify a loss functional,\
    \ a metric to optimize and an algorithm to perform the gradient descent updates.\
    \ We will go for the Adam solver, optimizing the classical mean squared error\
    \ (that works in this problem, but we might need to change it for our particular\
    \ application) and choose accuracy as the metric to optimize:\n\n```\nautoencoder\
    \ %>% compile(optimizer='adam',\n                        loss=\"mean_squared_error\"\
    ,\n                        metrics=c('accuracy'))\n```"
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Once this is set up, we are ready for training:


    ```

    # Coerce the dataframe to matrix to perform the training

    df <- as.matrix(df)

    history <- autoencoder %>% fit(

    df,df,

    epochs = 30, batch_size = 128,

    validation_split = 0.2

