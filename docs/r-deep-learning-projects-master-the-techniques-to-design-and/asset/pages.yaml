- pgno: 95
  md: 'In this example, dropout is applied to a visible layer, the input layer, besides
    the hidden layers.


    In practice, the dropout rate is usually set from 20% to 50%. A layer with a too
    low dropout rate makes little difference whereas a too high rate causes underfitting.


    Now let''s apply dropout to our Keras solution by using the function `layer_dropout
    (p)`. We define a function that initializes and compiles a CNN model with dropout
    (for reuse purposes):


    ```

    ```r

    > init_cnn_dropout <- function() {

    +   model_dropout <- keras_model_sequential()

    +   model_dropout %>

    %   layer_conv_2d(

    +     filter = 32, kernel_size = c(5, 5),

    +     input_shape = c(32, 32, 1)

    +   ) %>

    %   layer_activation("relu") %>

    %   layer_max_pooling_2d(pool_size = c(2, 2)) %>

    %   # Second hidden convolutional layer layer

    +   layer_conv_2d(filter = 64, kernel_size = c(5, 5)) %>

    %   layer_activation("relu") %>

    %   # Use max pooling

    +   layer_max_pooling_2d(pool_size = c(2, 2)) %>

    %   layer_dropout(0.25) %>

    %   # Flatten and feed into dense layer

    +   layer_flatten() %>

    %   layer_dense(1000) %>

    %   layer_activation("relu") %>

    %   layer_dropout(0.25) %>

    %   # Outputs from dense layer

    +   layer_dense(43) %>

    %   layer_activation("softmax")

    +

    +   opt <- optimizer_sgd(lr = 0.005, momentum = 0.9)

    +

    +   model_dropout %>

    %     compile(

    +       loss = "categorical_crossentropy",

    +       optimizer = opt,

    +       metrics = "accuracy"

    +     )

    +

    +   return(model_dropout)

    + }

    ```

    ```'
  merge: -1
  img_proc: true
