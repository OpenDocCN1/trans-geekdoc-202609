- pgno: 85
  md: 'Misclassification occurs only in several rare cases regardless of large variations
    in appearances of images due to illumination changes, partial occlusions, rotations,
    weather conditions, and so on:


    ```

    ```

    > accuracy_cnn = mean(prediction_cnn == data_test.y)

    > accuracy_cnn

    [1] 0.9930612

    ```

    ```


    We just built a robust CNN model that correctly classifies more than 99.30% of
    the testing signs. The CNN model efficiently learns the representations by deriving
    low-level and high-level features. It makes those hand-crafted features obsolete,
    as it captures important and distinguishable features by itself from the sign
    images.


    Now that we have achieved great success using our favorite (so far) deep learning
    tool MXNet, why don''t we explore other tools that are also powerful? In fact,
    another deep learning API called Keras has been gaining popularity recently; its
    backend, TensorFlow, is probably the best known deep learning framework.


    # Trying something new – CNNs using Keras with TensorFlow


    Keras (https://keras.io/) is a high-level deep learning API written in Python
    that can run on top of any of these three deep learning frameworks: TensorFlow
    (from Google), CNTK (from Microsoft), and Theano (from the Montreal Institute
    for Learning Algorithms, Université de Montréal, Canada). To solve a machine learning
    problem efficiently, being able to quickly prototype ideas is the key. And this
    is why Keras was developed initially, to facilitate fast experimentation in the
    following key aspects:


    +   • User-friendly API built on top of multiple powerful backends, including
    TensorFlow, CNTK, and Theano.

    +   • Built-in CNN, RNN, and autoencoder models as well as support classes and
    methods (metrics, optimizers, regularizers, visualization, and so on), which enable
    easy and fast prototyping.

    +   • Excellent modularity and extensibility. These allow for customized network
    architectures: Multiple input, multiple output, layer sharing, model sharing,
    memory-based network, and so on.

    +   • Allowing the same code to run seamlessly on CPU and GPU.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'For R users, the R interface to Keras (https://keras.rstudio.com/) was developed
    in 2017, and its adoption by the community has gradually grown. Let''s first install
    the keras R package from GitHub as follows:


    ```

    > if (!require("keras"))

    + devtools::install_github("rstudio/keras")

    > library(keras)

    ```


    This is not finished yet. We need to install the underlying backend(s) that Keras
    connects to. By default, it uses TensorFlow as the backend engine. We can use
    the following function to install the TensorFlow backend:


    ```

    > install_keras()

    Using existing virtualenv at ~/.virtualenvs/r-tensorflow

    Upgrading pip ...

    ......

    Installation complete.

    ```


    While we are waiting for the installation, let''s learn a bit more about TensorFlow.


    TensorFlow (https://www.tensorflow.org/) is an open source machine learning framework
    created by Google. It is well known for being used to design, build, and train
    deep learning models, but it can also be used for general numerical computation.
    In TensorFlow, computation is described using data flow graphs, where each node
    in a graph represents an instance of a mathematical operation and each edge represents
    a multidimensional data array (the so-called tensor, which can hold a matrix,
    vector, or scalar) on which the operations are performed. Such flexible architecture
    allows us to efficiently perform data-crunching machine learning operations, such
    as derivatives on huge matrices. Here is an example of a data flow graph:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_86_0.png)'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Now we see where its name TensorFlow is derived from: Tensors flowing in networks.


    By now, the installation of the core Keras library as well as the TensorFlow backend
    is done. We continue our Keras-based solution for traffic signs classification.


    First, prepare the input data for Keras modeling by reshaping the training and
    testing feature matrix:


    ```

    ```

    > x_train <- data_train.x

    > dim(x_train) <- c(nrow(data_train.x), 32, 32, 1)

    > x_test <- data_test.x

    > dim(x_test) <- c(nrow(data_test.x), 32, 32, 1)

    ```

    ```


    Again, the input pixels are already of values ranging from 0 to 1, so we do not
    need to perform any rescaling.


    We also convert training and testing target vectors (integers from 0 to 42) into
    a binary class matrix (one-hot encoded) as required by the Keras classification
    models:


    ```

    ```

    > y_train <- to_categorical(data_train.y, num_classes = 43)

    > y_test <- to_categorical(data_test.y, num_classes = 43)

    ```

    ```


    Before we start modeling, there is a trick for obtaining reproducible results
    in Keras in R. It is specifying a random seed before development of a model using
    the following function:


    ```

    ```

    > use_session_with_seed(42)

    ```

    ```


    It takes all measures known to ensure reproducible results from Keras sessions.


    Time to define the model after data preparation!


    We begin by initializing the Keras sequential model as follows:


    ```

    ```

    > model <- keras_model_sequential()

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Then we add the first set of convolutional layers, the ReLu nonlinear layer
    and the pooling layer, with the same parameters used in the previous MXNet solution
    (same parameters are used for rest of the network):


    ```

    > model %>%

    ```


    Start with a hidden 2D convolutional layer being fed 32*32 pixel images:


    ```

    + layer_conv_2d(

    +   filter = 32, kernel_size = c(5, 5),

    +   input_shape = c(32, 32, 1)

    + ) %>%

    + layer_activation("relu") %>%

    + layer_max_pooling_2d(pool_size = c(2, 2)) %>%

    ```


    Note that we use the pipe (%>%) operator to add layers to the Keras sequential
    model.


    It follows with the second set of convolutional, ReLu nonlinear, and pooling layer:


    ```

    + # Second hidden convolutional layer layer

    + layer_conv_2d(filter = 64, kernel_size = c(5, 5)) %>%

    + layer_activation("relu") %>%

    + layer_max_pooling_2d(pool_size = c(2, 2)) %>%

    ```


    Flatten the resulting feature maps from the previous convolution layers:


    ```

    + layer_flatten() %>%

    ```


    And feed into a dense layer:


    ```

    + layer_dense(1000) %>%

    + layer_activation("relu") %>%

    ```


    Finally, connect to a softmax layer containing 43 output units:


    ```

    + layer_dense(43) %>%

    + layer_activation("softmax")

    ```'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'We can use the `summary()` function to view the details of the model:


