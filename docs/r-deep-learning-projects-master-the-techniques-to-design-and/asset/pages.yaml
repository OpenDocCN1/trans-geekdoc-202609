  md: 'First, let''s load our model and the vector embedding that we trained before
    for the movie reviews:


    ```

    ```

    wv <- read.csv("./data/wv.csv")

    model <- load_model_hdf5("glove_nn.hdf5")

    ```

    ```


    As before, we join the vector representations with the data in tidy form:


    ```

    ```

    df <- wv %>% inner_join(text_df)

    ```

    ```


    And take the average of those vectors per Tweet as the embedded representation
    of our Tweet:


    ```

    ```

    df <- df %>% group_by(tweet_id) %>% summarize_all(mean) %>% select(1:51)

    preds <- model %>% predict(as.matrix(df[, 2:51]))

    hist(preds[, 1])

    ```

    ```


    As we structured our model, we will get predicted probabilities for each class.
    This is shown in the histogram as follows:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_244_0.png)'
