- pgno: 218
  md: '# # word2vec


    The word2vec algorithm (or, rather, family of algorithms) takes a text corpus
    as input and produces the word vectors as output. It first constructs a vocabulary
    from the training text data and then learns vector representation of words. Then
    we use those vectors as features for machine learning algorithms.


    Word vectors are able to catch some intuitive regularities in the language, for
    instance:


    ```

    vector(''Paris'') - vector(''France'') + vector(''Italy'')

    ```


    Results in a vector that is very close to:


    ```

    vector(''Rome''),

    ```


    And,


    ```

    vector(''king'') - vector(''man'') + vector(''woman'')

    ```


    Is close to:


    ```

    vector(''queen'').

    ```


    What does word2vec do behind the scenes? word2vec arrives at word vectors by training
    a neural network to predict:


    +   - A word in the center from its surroundings (continuous bag of words, CBOW)

    +   - A word''s surroundings from the center word (skip-gram model)


    Why is that useful? According to the distributional hypothesis, words occurring
    together tend to convey similar meanings. Researchers Goldberg and Levy point
    out (https://arxiv.org/abs/1402.3722) that the word2vec objective function causes
    words that occur in similar contexts to have similar embeddings, which is in line
    with the distributional hypothesis. However, they also point out that a better
    explanation is required.


    > The distributional hypothesis states that words that are used in the same contexts
    are related. This is an underlying assumption of vector embedding algorithms such
    as GloVe or word2vec.'
  merge: -1
  img_proc: true
- pgno: 219
  md: "# # GloVe\n\nAbout a year after word2vec, researchers at Stanford published\
    \ a paper (http://web.stanford.edu/~jpennin/papers/glove.pdf) that explicitly\
    \ identifies the objective that word2vec optimizes under the hood. Their method,\
    \ **GloVe** (**global vectors**) explicitly names the objective matrix, identifies\
    \ the factorization, and provides justification as to why this should give us\
    \ working similarities.\n\nThis section describes, at a high level, the inner\
    \ workings of the GloVe algorithm. As such, it is a bit more math-heavy than we\
    \ would have wanted. If you are not familiar with linear algebra and calculus,\
    \ you can safely skip it.\n\n# ### How does GloVe work?\n\n+   1. Create a word\
    \ **co-occurrence matrix** where each entry represents how often word _i_ appears\
    \ in the context of word _j_. This matrix is clearly symmetric. Moreover, for\
    \ each term, we look for words co-occurring on certain windows, and give less\
    \ weight to more distant words.\n+   \n+   2. Define soft constraints for each\
    \ word pair.\n+   \n+   3. Finally, introduce a cost function that penalizes learning\
    \ from very common word pairs.\n+   \n+   For the soft constraints, we mean:\n\
    \n```\n$w_i^T w_j + b_i + b_j = log(X_{ij})$\n```\n\nWhere the _w<sub>i</sub>_\
    \ and _w<sub>j</sub>_ denote the main and context embedded vectors, respectively,\
    \ with biases _b<sub>i</sub>_ and _b<sub>j</sub>_, and _X<sub>ij</sub>_ is the\
    \ co-occurrence of word _j_ in the context of word _i_.\n\nThe cost function is\
    \ defined by:\n\n```\n\\(\\sum_{i,j}^V f(X_{ij}) \\cdot (w_i^T w_j - b_i - b_j\
    \ - log(Xij))^2\\)\n```\n\nWhere _V_ is the vocabulary and _f_ is defined by:\n\
    \n```\n\\(f(X_{ij}) = \\left\\{ \\begin{aligned} &(\\frac{X_{ij}}{X_{max}})^\\\
    alpha \\,, \\quad X_{ij} < X_{max} \\\\ &1 \\,, \\quad X_{ij} \\ge X_{max} \\\
    end{aligned} \\right.\\)\n```"
  merge: -1
  img_proc: true
