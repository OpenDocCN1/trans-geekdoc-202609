- pgno: 62
  md: '# Traffic Sign Recognition for Intelligent Vehicles


    **Convolutional neural networks (CNNs)** are so useful in computer vision that
    we are going to use one for another application, traffic sign detection for intelligent
    vehicles. We will also cover several important concepts of deep learning in this
    chapter and will get readers exposed to other popular frameworks and libraries
    for deep learning.


    We continue our R deep learning journey with one of the core problems in self-driving
    cars, object recognition, and to be specific, traffic sign classification. To
    avoid accidents and ensure safety, robust traffic sign classification is critical
    to realizing driving autonomy. We will start with what self-driving cars are and
    what aspects deep learning is applied to. We will also discuss how deep learning
    stands out and becomes the state-of-the-art solution for object recognition in
    intelligent vehicles. With the background knowledge in mind, we''ll get started
    with our project when we first conduct an exploratory analysis of the data and
    performance data preprocessing, including Y''UV color encoding conversion. We''ll
    make our first attempt at using CNNs with MXNet and achieve more than 99% accuracy.
    Then we''ll move on to another powerful deep learning framework called TensorFlow
    and an API built on top of it called Keras.


    We''ll also introduce the dropout technique as a regularization approach similar
    to Lasso (L1) / Ridge (L2) regularization. Besides overfitting, we''ll demonstrate
    how to deal with a lack of training data, utilizing data augmentation techniques.
    We''ll wrap up the chapter by summarizing approaches to prevent overfitting in
    CNN models. Once again, we will prove that deep learning models remove manual
    or explicit feature extraction steps that are taken in traditional approaches,
    and they instead automatically discover useful patterns underneath input data
    during the training process.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'We will get into the details of the topics mentioned here:


    +   • What self-driving cars are

    +   • How deep learning is applied in self-driving cars

    +   • How deep learning becomes a state-of-the-art solution for object recognition
    in intelligent vehicles

    +   • Exploratory analysis on the German Traffic Sign Recognition Benchmark dataset''s
    data

    +   • Traffic sign recognition using convolutional neural networks with the MXNet
    package

    +   • Keras and TensorFlow

    +   • Traffic sign recognition using convolutional neural networks with the `keras`
    package

    +   • Reducing overfitting with dropout

    +   • Data augmentation and common augmentation methods

    +   • Using data augmentation for a small training set

    +   • Summarizing approaches to prevent overfitting in CNN models


    # How is deep learning applied in self-driving cars?


    A self-driving car (also called an autonomous/automated vehicle or driverless
    car) is a robotic vehicle that is capable of traveling between destinations and
    navigating without human intervention. To enable autonomy, self-driving cars detect
    and interpret environments using a variety of techniques such as radar, GPS and
    computer vision; and they then plan appropriate navigational paths to the desired
    destination.


    In more detail, the following is how self-driving cars work in general:


    +   • The software plans the routes based on the destination, traffic, and road
    information and starts the car

    +   • A **Light Detection and Ranging (LiDAR)** sensor captures the surroundings
    in real time and creates a dynamic 3D map

    +   • Sensors monitor lateral movement to calculate the car''s position on the
    3D map'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   • Radar systems exploit information on distances from other traffic participants,
    pedestrians, or obstacles

    +   • Computer vision algorithms recognize traffic signs, traffic lights, and
    other landmarks from a camera and provide advance notices

    +   • The algorithm-driven software analyzes all sensory data, combines inputs
    from other sources, and controls actions such as steering and braking, simulating
    the way humans perceive the surroundings and make decisions


    # # How does deep learning become a state-of-the-art solution?


    As we can see, robust object recognition is critical to realizing driving autonomy.
    To avoid accidents and ensure safety, it is necessary to be attentive to the surrounding
    environment, traffic signs, and lights. Generally speaking, object recognition
    in self-driving cars can be summarized into four tasks:


    +   • Object detection, such as obstacles, pedestrians, traffic signs, and lights.

    +   • Object identification and classification. An example is of labeling traffic
    lights (red, yellow, green, and off) if detected in the images captured by the
    frontal camera. Then we have categorizing of traffic participants into bicycle,
    motorcycle, car, truck and bus, and of course classifying traffic signs (our main
    talking point in this chapter).

    +   • Object localization, which maps ground-level images to aerial imagery.

    +   • Movement prediction, for example, understanding the speed of an object or
    estimating the behavior and intention of a pedestrian based on his/her pose.


    Since the past two decades, a variety of machine learning algorithms have been
    applied to solve object recognition problems in intelligent vehicles.


    For example, in Detecting Pedestrians Using Patterns of Motion and Appearance
    (Viola et al., published in the International Journal of Computer Vision, 63(2)),
    the AdaBoost (short for Adaptive Boosting, which corrects classification errors
    sequentially) classifier was employed to detect walking pedestrians.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'In Histograms of Oriented Gradients for Human Detection (Dalal and Triggs,
    published in the IEEE Conference on Computer Vision and Pattern Recognition (CVPR)
    in 2005), efficient features were extracted using the **histogram of orientation
    (HOG)** technique, and fed into a **support vector machine (SVM)** classifier
    for human detection. Since then, more sophisticated variants such as gradient
    field HOG (GF-HOG) and other more complex feature extraction methods were developed.
    To name some, we have zoning + projection, projection + HOG, and so on.


    Conventional object recognition approaches (explicit feature extraction + machine
    learning classification) rely heavily on hand-crafted features, such as gradient
    orientation histogram with HOG, local keypoints with **Sped-Up Robust Features
    (SURF)**, or **Scale Invariant Feature Transform (SIFT)**. Although they perform
    well in certain tasks, designing these feature descriptors is difficult and requires
    lots of manual tweaks and experiments.


    Recall that in the previous chapter on classifying handwritten digits, we resorted
    to a CNN. It first derives low-level representations, local edges and curves,
    and then composes higher level representations such as overall shape and contour
    through a series of low-level representations. We also concluded that CNNs are
    well suited to exploit strong and unique features.


    In fact, it has been proven in many solutions that CNNs are able to efficiently
    automate feature extraction while allowing a significant boost in performance.
    For example, in *Pedestrian Detection with Unsupervised Multi-Stage Feature Learning*
    (Sermanet et al., published in the IEEE Conference on **Computer Vision and Pattern
    Recognition (CVPR)** in 2013), CNNs were first introduced into the pedestrian
    detection problem. In *Rich feature hierarchies for accurate object detection
    and semantic segmentation* (Girshick et al., published in the IEEE Conference
    on CVPR in 2014), a variant region-based CNN model was proposed to improve performance.
    Nowadays, a number of state-of-the-art object recognition approaches involve deep
    learning techniques, CNNs specifically. A good testimony would be their prevalence
    in top positions in the leaderboard of the KITTI Vision Benchmark for autonomous
    cars (`http://www.cvlibs.net/datasets/kitti/eval_object.php?obj_benchmark=2d`).


    I hope all of these cases have excited you about CNNs and their power of providing
    better object recognition solutions to intelligent vehicles.


    So what are we waiting for? Let’s proceed with our project, traffic signs recognition,
    as it is one of the most important topics in autonomous cars!'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Traffic sign recognition using CNN


    As always, we begin by exploring the German Traffic Sign Recognition Benchmark
    (GTSRB) dataset at http://benchmark.ini.rub.de/?section=gtsrb&subsection=dataset.


    # Getting started with exploring GTSRB


    The GTSRB dataset, compiled and generously published by the real-time computer
    vision research group in Institut für Neuroinformatik, was originally used for
    a competition of classifying single images of traffic signs. It consists of a
    training set of 39,209 labeled images and a testing test of 12,630 unlabeled images.
    The training dataset contains 43 classes—43 types of traffic signs. We will go
    through all classes and exhibit several samples for each class.


    The dataset can be downloaded via http://benchmark.ini.rub.de/Dataset/GTSRB_Final_Training_Images.zip
    (located in the Downloads | Training dataset section on the page). Unzip the downloaded
    file and there will be a folder called Images containing 43 folders (00000, 00001...
    up to 00042); they represent 43 classes of images. These images are in the following
    form:


    +   - The image files are in PPM (short for portable pixmap) format.

    +   - The number of images from each class ranges from 210 to 2250. So it is an
    unbalanced multi-class classification problem.

    +   - Each image contains one traffic sign.

    +   - The sizes of the images are not uniform, ranging from 15*15 to 250*250 pixels,
    and images are not necessarily square.

    +   - Images contain a border of up to 10% around the actual sign. Thus the sign
    is not necessarily centered with the image.


    Let''s start by plotting a sample, 00000_00002.ppm, in the 00000 folder.


    We use the pixmap package (https://cran.r-project.org/web/packages/pixmap) to
    read the PPM file:


    ```

    > library (''pixmap'')

    > image <-

    read.pnm(''GTSRB/Final_Training/Images/00000/00000_00002.ppm'',cellres=1)

    ```'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Now we obtain a pixmapRGB object with attributes red, green, and blue (which
    are the pixels for each of the three channels), as well as size, which is the
    width and height of the image. And we can access the red, green, and blue channel
    as follows:


    ```

    > red_matrix <- matrix(image@red, nrow = image@size[1], ncol =

    image@size[2])

    > green_matrix <- matrix(image@green, nrow = image@size[1], ncol =

    image@size[2])

    > blue_matrix <- matrix(image@blue, nrow = image@size[1], ncol =

    image@size[2])

    ```


    We visualize the original image and its three channels individually:


    ```

    > plot(image, main=sprinft("Original"))

    > rotate <- function(x) t(apply(x, 2, rev))

    > par(mfrow=c(1, 3))

    > image(rotate(red_matrix), col = grey.colors(255), main=sprinft("Red"))

    > image(rotate(green_matrix), col = grey.colors(255),

    main=sprinft("Green"))

    > image(rotate(blue_matrix), col = grey.colors(255), main=sprinft("Blue"))

    ```


    Note that here we reuse the rotate function we defined in the last chapter to
    better view the images. This is an original image:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_67_0.png)'
