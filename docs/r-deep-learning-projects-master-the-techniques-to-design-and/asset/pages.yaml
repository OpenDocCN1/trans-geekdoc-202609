- pgno: 93
  md: '# # Reducing overfitting with dropout


    You may notice that we had employed L2 regularization in the MXNet solution, which
    adds penalties for large weights in order to avoid overfitting; but we did not
    do so in this Keras solution. This results in a slight difference in classification
    accuracy on the testing set (99.30% versus 98.65%). We are going to employ regularization
    in our Keras solution, specifically **dropout** this time.


    Dropout is a regularization technique in neural networks initially proposed by
    Geoffrey Hinton et. al. in 2012 (Improving Neural Networks by Preventing Co-adaptation
    of Feature Detectors in Neural and Evolutionary Computing). As the name implies,
    it ignores a small subset of neurons (can be hidden or visible) that are randomly
    selected in a neural network during training. The *dropped-out* neurons temporarily
    make no contribution to the activation of downstream neurons or the weight updates
    to neurons on backward pass. So how is the dropout technique able to prevent overfitting?


    Recall that in a standard neural network, neurons are co-dependent among neighboring
    neurons during training. And weights of neurons are tuned for a particular context
    within the network, which restricts the individualized power of each neuron. Such
    reliance on context may cause the model to be too specialized to training data.
    When such neurons in the network are not considered, the weights of neurons become
    less sensitive to those of other neurons. Neurons are forces to learn useful information
    more independently. Co-adaptation on training data is penalized.


    Employing dropout is simple. During the training phase and in a layer with dropout
    rate *p*, for each iteration, we randomly switch off a fraction *p* of neurons.
    In the testing phase, we use all neurons but scale their activations by a factor
    of *q = 1 - p*, in order to account for the dropped-out activations in the training
    phase.'
  merge: -1
  img_proc: true
