- pgno: 226
  md: 'On the plots and the preceding summary results shown, the **accuracy** is the
    percentage of correctly classified instances out of all instances, whereas the
    **kappa** metric (or Cohen''s kappa statistic) is the accuracy normalized with
    the baseline random classification for your data, as if every observation were
    classified according to the probability distribution given by the frequency of
    each class.


    A kappa of zero means that the model is useless (kappa is between 0 and 1) and
    the higher the kappa, the more likely your model is useful, although there is
    no unified interpretation of this statistic.


    So we see that tree-based methods tend to do quite well. This is somehow in contrast
    to one-hot encoding models. It is usually not recommended to use tree-based methods
    in data with a large number of sparse features, which would be the case if we
    had one-hot encoded models as before. Since we are instead embedding into dense
    vectors, trees are welcome again and they do perform well, even without tweaking
    hyperparameters.


    # The importance of data cleansing


    If you follow the preceding workflow, and stop from time to time to see the results
    (which you absolutely should, by the way) you will notice that there is a lot
    of garbage around—words with upper and lower case, punctuation and so on. What
    happens if you improve this workflow by properly parsing the words? You can use
    the tokenizers library instead of the `space_tokenizer` function from text2vec
    to remove stopwords and punctuation in a single line:


    ```

    library(tokenizers)

    tokens <- tokenize_words(imdb$review, stopwords = stopwords())

    ```


