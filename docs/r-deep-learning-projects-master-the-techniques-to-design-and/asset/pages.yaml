  img_proc: true
- pgno: 74
  md: 'Here is an example of the ROI in a sample:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_74_0.png)


    Now we define the preprocessing function for a raw image, which includes separating
    the ROI and resizing it to 32*32:


    ```

    > source("http://bioconductor.org/biocLite.R")

    > bioLite("EBImage")

    > library("EBImage")

    > roi_resize <- function(input_matrix, roi){

    +     roi_matrix <- input_matrix[roi[1, ''Roi.Y1'']:roi[1, ''Roi.Y2''],

    +     roi[1, ''Roi.X1'']:roi[1, ''Roi.X2'']]

    +     return(resize(roi_matrix, 32, 32))

    + }

    ```


    Note that the resize function is from the EBiImage package:


    https://bioconductor.org/packages/release/bioc/html/EBImage.html


    We try it out on our first sample (red channel only):


    ```

    > # read annotation csv file

    > annotation <-

    read.csv(file="GTSRB/Final_Training/Images/00000/GT-00000.csv",

    header=TRUE, sep=";")

    > roi = annotation[3, ]

    > red_matrix_cropped <- roi_resize(red_matrix, roi)

    > par(mfrow=c(1, 2))

    > image(rotate(red_matrix), col = grey.colors(255) ,

    main=sprinf("Original"))

    > image(rotate(red_matrix_cropped), col = grey.colors(255) ,

    main=sprinf("Preprocessed"))

    ```'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'We get the preprocessed red channel on the right:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_75_0.png)


    Similarly, we can process the other two channels. Based on these three channels,
    how can we construct the feature space? Discarding any channel might result in
    loss of information. Simply stacking them up could lead to redundancy. So, combining
    three channels into one would be a better solution. In the color world, Y''UV
    is an encoding system that encrypts brightness information separately from color
    information. It is typically used as part of a color image pipeline and computer
    graphics hardware. Y''UV represents human perception of color in terms of three
    components: Y'' as the luminance (brightness), and U and V as the chrominance
    (color). Y''UV can be converted from RGB using:


    +   * Y'' = 0.299R + 0.587G + 0.114B

    +   * U = 0.492(B - Y'')

    +   * V = 0.877(R - Y'')


    For our feature space, we can only take the brightness channel Y''.


    Now that we have the last piece of the whole preprocessing ready, let''s put them
    together, load, and process (ROI + resize + conversion to Y'') the entire labeled
    dataset:


    ```

    > load_labeled_data <- function(training_path, classes) {

    + # Initialize the pixel features X and target y

    + # X <- matrix(, nrow = 0, ncol = 32*32)

    + y <- vector()

    + # Load images from each of the 43 classes

    + for(i in classes) {

    + print(paste(''Loading images from class'', i))

    + }

    ```'
  merge: -1
  img_proc: true
- pgno: 76
  md: '```

    + if (i<10) {

    + annotation_path <- paste(training_path, "0000", i, "/GT-0000",

    + i, ".csv", sep="")

    + path <- paste(training_path, "0000", i, "/", sep="")

    + } else {

    + annotation_path <- paste(training_path, "000", i, "/GT-000",

    + i, ".csv", sep="")

    + path <- paste(training_path, "000", i, "/", sep="")

    + }

    + annotation <- read.csv(file=annotation_path, header=TRUE,

    + sep=";")

    +

    + for (row in 1:nrow(annotation)) {

    + # Read each image

    + image_path <- paste(path, annotation[row, "Filename"], sep="")

    + image <- read.pnm(image_path, cellres=1)

    + # Parse RGB color space

    + red_matrix <- matrix(image@red, nrow = image@size[1],

    + ncol = image@size[2])

    + green_matrix <- matrix(image@green, nrow = image@size[1],

    + ncol = image@size[2])

    + blue_matrix <- matrix(image@blue, nrow = image@size[1],

    + ncol = image@size[2])

    + # Crop ROI and resize

    + red_matrix_cropped <- roi_resize(red_matrix,

    + annotation[row, ])

    + green_matrix_cropped <- roi_resize(green_matrix,

    + annotation[row, ])

    + blue_matrix_cropped <- roi_resize(blue_matrix,

    + annotation[row, ])

    + # Convert to brightness, e.g. Y'' channel

    + x <- 0.299 * red_matrix_cropped + 0.587 *

    + green_matrix_cropped + 0.114 * blue_matrix_cropped

    + X <- rbind(X, matrix(x, 1, 32*32))

    + y <- c(y, i)

    + }

    + }

    + return(list("x" = X, "y" = y))

    + }

    ```


    After defining the data loading function as shown previously, we apply it to the
    entire raw dataset:


    ```

    > classes <- 0:42

    > data <- load_labeled_data(training_path, classes)

    ```'
