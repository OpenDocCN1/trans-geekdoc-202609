- pgno: 240
  md: "We get an almost too impressive performance. How do CNNs work in text? In a\
    \ similar way as they work in pictures, one-dimensional convolutional neural networks\
    \ are convolved with the input layer over a spatial window length (five in our\
    \ example). It is certainly easier to imagine *average of colors/intensity* on\
    \ a certain window in an image, and we would not like to push an analogy that\
    \ makes no sense. As the field is evolving so fast, perhaps soon we would have\
    \ a more satisfactory explanation of the effectiveness of CNN in sentiment analysis\
    \ tasks. For the time being, let’s be glad that they work fine and can be trained\
    \ reasonably fast.\n\n> Beware that, for the sake of brevity, in most of the examples\
    \ in this chapter we have omitted the verification of the results on the validation\
    \ set (which is still the right thing to do, even if we rely on Keras’ validation\
    \ mechanism). So do not take the scores presented at face value.\n\n# Exercises\n\
    \n+   - Use the *context vector*, or a combination of the context vector and the\
    \ main vector from GloVe. How do the results change? You can also build a meta-model\
    \ that calculates the appropriate weight you should give to each vector.\n+  \
    \ \n+   - Do the results improve significantly if we use stemming?\n+   \n+  \
    \ - Can you improve the results by playing with the parameters of GloVe? You can\
    \ tweak `skip_grams_window` for instance, or the number of iterations.\n+   \n\
    +   - You can also try to implement *fastText* (https://keras.rstudio.com/articles/examples/imdb_fasttext.html)\
    \ using keras.\n\n# Mining sentiment from Twitter\n\nIt’s time to put our knowledge\
    \ of different sentiment classification models in a more realistic scenario—Twitter\
    \ sentiment analysis.\n\nAs we mentioned in the introduction, sentiment analysis\
    \ is of great interest for all companies that have a presence online (which is,\
    \ well, lots of companies in many countries). It is also relevant for politicians,\
    \ researchers, stock traders and others."
