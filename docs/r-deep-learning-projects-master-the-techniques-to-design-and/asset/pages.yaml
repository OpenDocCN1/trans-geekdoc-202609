- pgno: 35
  md: '# Going from logistic regression to single-layer neural networks


    Basically, logistic regression is a feed-forward neural network without a hidden
    layer, where the output layer directly connects with the input layer. In other
    words, logistic regression is a single neuron that maps the input to the output
    layer. Theoretically, the neural networks with an additional hidden layer between
    the input and output layer should be able to learn more about the relationship
    underneath.


    A single-layer neural network for two possible classes can be represented graphically
    as follows:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_35_0.png)


    Suppose \( x \) is \( n \)-dimension, and there are \( H \) hidden units in the
    hidden layer, then the weight matrix \( w^{(1)} \) connecting the input layer
    to the hidden layer is of size \( n \) by \( H \) with each column \( w_h^{(1)}
    \) representing the coefficients associated with the \( h \)-th hidden unit. So,
    the output (also called **activation**) of the \( h \)-th hidden unit \( a_h^{(2)}
    \) can be expressed mathematically as:


    ```

    \( a_h^{(2)} = f(z^{(2)}) = f(w_h^{(1)} x) \)

    ```


    For example, for the outputs of the first, second and the last hidden unit:


    ```

    \( a_1^{(2)} = f(w_1^{(1)} x) \

    \( a_H^{(2)} = f(w_H^{(1)} x) \

    \( a_H^{(2)} = f(w_H^{(1)} x) \)

    ```'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'where f(z) is an activation function. Typical choices for the activation function
    in simple networks include logistic function (more often called sigmoid function)
    and tanh function (which can be considered a re-scaled version of logistic function):


    ```

    sigmoid(z) = \frac{1}{1 + e^{-z}}


    tanh(z) = \frac{e^{-z} - e^{z}}{e^{z} + e^{-z}} = \frac{2}{1 + e^{-2z}} - 1

    ```


    Plots of these two functions are as follows:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_36_0.png)


    We will be using the logistic function in our single-layered networks for now.


    For a case of K possible classes, the weight matrix \( w^{(2)} \) connecting the
    hidden layer to the output layer is of size H by K. Each column \( w_k^{(2)} \)
    represents the coefficients associated with class k. The input to the output layer
    is the output of the hidden layer \( a^{(2)} = \{a_1^{(2)}, a_2^{(2)}, \dots,
    a_l^{(2)}\} \), the probability of x being class k can be expressed mathematically
    as (for consistency, we denote it as \( a_k^{(3)} \)):


    ```

    a_k^{(3)} = f(z^{(3)}) = softmax_k(W^{(2)}a^{(2)})

    ```


    Similarly, given m training samples, to train the neural network, we learn all
    weights \( w = \{w^{(1)}, w^{(2)}\} \) using gradient descent with the goal of
    minimizing the mean squared error cost J(w).'
  merge: -1
  img_proc: true
- pgno: 37
  md: "Computation of the gradients \\(\\Delta w\\) can be realized through the **backpropagation\
    \ algorithm**.\nThe idea of the backpropagation algorithm is the following, we\
    \ first travel through the\nnetwork and compute all outputs of the hidden layers\
    \ and output layer; then moving\nbackward from the last layer, we calculate how\
    \ much each node contributed to the error in\nthe final output and propagate it\
    \ back to the previous layers. In our single-layer network,\nthe detailed steps\
    \ are:\n\n+   1. Compute \\(a^{(2)}\\) for the hidden layer and feed them to the\
    \ output layer to compute\n+   the outputs \\(a^{(3)}\\)\n\n+   2. For the output\
    \ layer, compute the derivative of the cost function of one sample\n+   \\(\\\
    delta_k^{(3)} = \\frac{\\delta}{\\delta z_k^{(3)}} j(W) = -(y_k - a_k^{(3)}) .\
    \ f'(z_k^{(3)})\\)\n+   \n+   \\(j(W)\\) with regards to each unit,\n+   \n+ \
    \  \\(\\delta^{(3)} = -(y - a^{(3)}) . f'(z^{(3)})\\), rewritten for the entire\
    \ layer\n\n+   3. For the hidden layer, we compute the error term \\(\\delta^{(2)}\\\
    ) based on a weighted average\n+   of \\(\\delta^{(3)} : \\delta^{(2)} = ((W^{(2)})^T\
    \ \\delta^{(3)}). f'(z^{(2)})\\)\n\n+   4. Compute the gradients applying the\
    \ chain rule:\n\n```\n\\(\\triangle W^{(2)} = \\frac{\\partial J(W)}{\\partial\
    \ z_k^{(3)}} \\frac{\\partial z_k^{(3)}}{\\partial W^{(2)}} = \\delta^{(3)} (a^{(2)})^T\\\
    )\n```\n\n```\n\\(\\triangle W^{(1)} = \\frac{\\partial J(W)}{\\partial z_k^{(2)}}\
    \ \\frac{\\partial z_k^{(2)}}{\\partial W^{(1)}} = \\delta^{(2)} (x)^T\\)\n```\n\
    \nWe repeatedly update all weights by taking these steps until the cost function\
    \ converges.\n\nAfter a brief review of the single-layer network, we can then\
    \ apply it as the second solution\nto our digit classification project.\n\nAgain,\
    \ we use the `nnet` package to implement our single-layer network:\n\n```\n> model_nn\
    \ <- nnet(label ~ ., data=data_train, size=50, maxit=300,\nMaxNWts=100000, decay=1e-4)\n\
    # weights: 39760\ninitial value 108597.598656\niter 10 value 27708.286001\niter\
    \ 20 value 16027.005297\niter 30 value 14058.141050\niter 40 value 12615.442747\n\
    iter 50 value 11793.700937\n```"
  merge: -1
  img_proc: true
