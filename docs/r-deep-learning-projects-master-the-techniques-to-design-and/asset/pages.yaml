- pgno: 115
  md: 'This is the reconstruction of the points, as per our autoencoder. We will color
    red those points whose reconstruction is at a (Euclidean) distance larger than
    three from the original images, and leave the others blue. Why those points? Our
    autoencoder learned that our dataset had some intrinsic properties (it learned
    the distribution of the average point), so in those points where the reconstruction
    error is anomalously large, there might be something worth looking at:


    ```

    # Coerce back the matrix to data frame to use ggplot later

    df <- as.data.frame(df)

    # Euclidean distance larger than 3 = sum of squares larger than 9

    df$color <- ifelse((df$V1-preds$V1)**2+(df$V2-preds$V2)**2>9,"red","blue")

    ```


    Finally, we can look at the results with ggplot:


    ```

    library(ggplot2)

    df %>% ggplot(aes(V1,V2),col=df$color)+geom_point(color = df$color,

    position="jitter")

    ```


    The following screenshot shows how well we did identifying unusual points:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_115_0.png)


    Output of the autoencoder. In blue, the reconstructed points by our autoencoder.
    In red, the original points in the dataset. We see that there is a cloud of red
    points that thanks to our autoencoder we can identify as unusual.'
