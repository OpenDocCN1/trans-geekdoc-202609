  md: '# Sentiment Analysis with Word Embeddings


    In this chapter, we turn to the problem of sentiment analysis. Sentiment analysis
    is an umbrella term for a number of techniques to figure out how a speaker feels
    about a certain topic or piece of content.


    A vanilla case study of sentiment analysis is **polarity**. Given a document or
    text string (for instance, a Tweet, a review, or a comment on a social network),
    the aim is to determine whether the author feels good, bad, or neutral about the
    item or topic in question.


    At first look, this problem might seem trivial: A lookup table with positive and
    negative words, and simply counting the word frequencies should do, right? Not
    so fast. Here are a few examples of why this is tricky:


    +   - Their decadent desserts made me hate myself

    +   - You should try this place if you love cold food

    +   - Disliking cake is not really my thing


    What can we see in these examples?


    +   - Negative terms used in a possibly positive sense

    +   - Positive terms used sarcastically

    +   - Two negative terms that imply something positive


    Note that we have not dealt with spelling mistakes, neologisms and use of multiple
    languages, just to name a few potential issues in real-life situations.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'As you can see, sentiment analysis is a very complicated task, and we will
    merely scratch the surface.


    The human element is the most important element in sentiment analysis. The accuracy
    of a sentiment analysis system depends on how much it agrees with human judgement.
    And how accurate could that be? Unfortunately not that much. Some researchers
    report disagreement rates as high as 20%. This means that if your sentiment analysis
    system has an accuracy of 70%, although seemingly unimpressive, it will still
    be good, since humans would agree on 80% of the classifications of a perfect sentiment
    analysis system. But, beware!


    These figures are not exactly comparable, since the computer will have issues
    identifying subtleties that are best guessed by humans, such as sarcasm, jokes,
    or the subtle differences in meaning from the examples shown previously.


    Nonetheless, there seems to be an increasing awareness from individuals and organizations
    about the importance of their presence online. We can measure that impact by the
    mushrooming of agencies and professionals specializing in social media monitoring.
    This has contributed to increased attention in the field from researchers (both
    in universities and industries), and we believe that it is likely that we will
    see significant advances in the area.


    Our focus, as stated elsewhere in the book, is to introduce you to the algorithms
    in the simplest way possible. We will use a well-known dataset, which shares many
    of the properties of real-life datasets that you will find out there.


    # # Warm-up – data exploration


    Let''s get things moving with a tiny example. Let''s look at this tiny reviews
    corpus:


    ```

    text <- c("The food is typical Czech, and the beer is good. The service is

    quick, if short and blunt, and the waiting on staff could do with a bit of

    customer service training",

    "The food was okay. Really not bad, but we had better",

    "A venue full of locals. No nonsense, no gimmicks. Only went for

    drinks which were good and cheap. People friendly enough.",

    "Great food, lovely staff, very reasonable prices considering the

    location!")

    ```


    We will do some simple analysis here, which will help us appreciate some of the
    subtleties of sentiment analysis.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "# Working with tidy text\n\nFor this, we will use the `tidytext` package. This\
    \ package is built on the philosophy of tidy data, introduced by Hadley Wickham\
    \ in his 2014 paper (https://www.jstatsoft.org/article/view/v059i10). A dataset\
    \ is tidy if the following three conditions are satisfied:\n\n+   - Each variable\
    \ is a column\n+   - Each observation is a row\n+   - Each type of observational\
    \ unit is a table\n\nThe `tidytext` package helps us turn our text into tidy form,\
    \ by putting one token per row. Let's start by loading `dplyr` and `tidytext`.\
    \ If you don't have `tidytext`, install it first using `install.packages(\"tidytext\"\
    )`.\n\nLoad the packages and let's transform our text into a data frame:\n\n```\n\
    library(tidytext)\nlibrary(dplyr)\ntext_df <- data_frame(line = 1:4, text = text)\n\
    ```\n\nThe `unnest_tokens` function is where the magic of `tidytext` begins:\n\
    \n```\ntext_df <- text_df %>%\nunnest_tokens(word, text)\nhead(text_df)\n# A tibble:\
    \ 6 x 2\n  line word\n  <int> <chr>\n1     1 the\n2     1 food\n3     1 is\n4\
    \     1 typical\n5     1 czech\n6     1 and\n```\n\nAs you can see, our text was\
    \ transformed as one token (the default is one word = one token) per row. First,\
    \ let's get rid of stop words:\n\n```\ndata(stop_words)\nhead(stop_words)\ntext_df\
    \ <- text_df %>% anti_join(stop_words)\n```"
  merge: -1
  img_proc: true
- pgno: 203
