- pgno: 236
  md: 'On each row, we have the first 100 words of the review, and we added zeros
    to the end if the review was shorter than 100 words. Now, we are ready to define
    our network:


    ```

    # Initialize model

    model <- keras_model_sequential()

    model %>%

    # Creates dense embedding layer; outputs 3D tensor

    # with shape (batch_size, sequence_length, output_dim)

    layer_embedding(input_dim = length(vocab),

    output_dim = 128,

    input_length = maxlen) %>%

    bidirectional(layer_lstm(units = 64)) %>%

    layer_dropout(rate = 0.5) %>%

    layer_dense(units = 1, activation = ''sigmoid'')

    ```


    A few comments are in order here: First, note that the output layer is one-dimensional
    instead of two-dimensional, as before. This is purely for pedagogical purposes,
    and in the multi-class setup you would prefer to use similar code as before. Next,
    observe that there is a `layer_embedding` function, which is used for passing
    sequential data. Finally, the layer corresponding to the bidirectional LSTM comes,
    followed by a dropout.


    Wait, what is dropout? **Dropout** is a technique introduced recently that simply
    *forgets* to train some neurons. This might seem weird, but in reality it is a
    very efficient way of performing model averaging with neural networks. In a similar
    way that averaging trees produces better models (less prone to over-fitting),
    averaging weaker neural networks results in a more robust model.


    Now, we compile the model (note the different loss function, due to the different
    output):


    ```

    # Compile: you can try different compilers

    model %>% compile(

    loss = ''binary_crossentropy'',

    optimizer = ''adam'',

    metrics = c(''accuracy'')

    )

    ```


    And we are now ready to call the fit method:


    ```

    > history <- model %>% fit(

    X, y,

    batch_size = 128,

    epochs = 4,

    validation_size = 0.2

    )

