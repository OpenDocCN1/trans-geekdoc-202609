- pgno: 207
  md: 'This is already valuable, but in some cases we would like to know how positive
    or negative a review is; for instance, to redirect the issue to the proper customer
    service representative. In this case, it might be useful to use the `AFINN` lexicon
    instead:


    ```

    afinn <- get_sentiments("afinn")

    ```


    Now, we join the review data as before:


    ```

    text_df %>% inner_join(afinn)

    ```


    And look at the total score per review:


    ```

    # Group

    text_df %>%

    inner_join(afinn) %>%

    group_by (line) %>%

    summarize (total_score = sum(score))

    ```


    Not bad; but again, it’s better to make a plot:


    ```

    # Plot

    text_df %>%

    inner_join(afinn) %>%

    group_by (line) %>%

    summarize (total_score = sum(score)) %>%

    mutate(sentiment=ifelse(total_score>0,"positive","negative")) %>%

    ggplot(aes(line, total_score, fill=sentiment))+%

    geom_col() +

    coord_flip() +

    theme_bw()

    ```'
  merge: -1
