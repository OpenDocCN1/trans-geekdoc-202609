  img_proc: true
- pgno: 100
  md: "We generate a horizontally flipped image and save the resulting image in the\
    \ `augmented` directory we created:\n\n```\n> images_iter <- flow_images_from_data(img1,\
    \ , generator =\n  image_data_generator(horizontal_flip = TRUE),\n+\n  save_to_dir\
    \ = 'augmented',\n+\n  save_prefix = \"horizontal\", save_format = \"png\")\n\
    > reticulate::iter_next (images_iter)\n```\n\nThe flipped sign (right) along with\
    \ the original image (left) is displayed as follows:\n\n![](img/da8fb67f2acf661518076e08b6ffd9b9_100_0.png)\n\
    \nThe horizontally flipped sign image conveys the same message as the original\
    \ one. It should be noted that flipping works only in orientation-insensitive\
    \ cases, such as a classification between cats and dogs, or our recognition of\
    \ traffic lights. However, in cases where orientation matters, such as a classification\
    \ between right turn and left turn, a small to medium degree rotation can still\
    \ be applied. For instance, flipping the *Dangerous curve to the right* sign is\
    \ absolutely dangerous, but rotating it by at most 20 degrees is harmless and\
    \ even helpful, as we can see in the following example:\n\n```\n> img<-image_load(paste\
    \ (training_path, \"00020/00002_00017.ppm\", sep=\"\"))\n> img1<--image_to_array(img1)\n\
    > dim(img1)<-c(1,dim (img1))\n> images_iter <- flow_images_from_data(img1, , generator\
    \ =\n  image_data_generator(rotation_range = 20),\n+\n  save_to_dir = 'augmented',\n\
    +\n  save_prefix = \"rotation\", save_format = \"png\")\n> reticulate::iter_next\
    \ (images_iter)\n```"
