    | outlier | 3265 | 532 |


    So clearly we could do better. Perhaps the vertical stroke shared by digits 1
    and 7 contributes to the huge error rate. We caught, however, a bit over 50% of
    the outlier cases with this simple architecture. One way to improve this would
    be to add more hidden layers. We will use this trick later in this chapter.


    # Credit card fraud detection with autoencoders


    Fraud is a multi-billion dollar industry, with credit card fraud being probably
    the closest to our daily lives. Fraud begins with the theft of the physical credit
    card or with data that could compromise the security of the account, such as the
    credit card number, expiration date and security codes. A stolen card can be reported
    directly, if the victim knows that their card has been stolen, however, when the
    data is stolen, a compromised account can take weeks or even months to be used,
    and the victim then only knows from their bank statement that the card has been
    used.


    Traditionally, fraud detection systems rely on the creation of manually engineered
    features by subject matter experts, working either directly with financial institutions
    or with specialized software vendors.


    One of the biggest challenges in fraud detection is the availability of labelled
    datasets, which are often hard or even impossible to come by.'
