    # Adding more hidden layers to the networks


    We have just achieved 91.3% accuracy with a single-layer neural network model.

    Theoretically, we can obtain a better one with more than one hidden layer. As
    an example,

    we provide a solution of a deep neural network model with two hidden layers:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_39_0.png)


    Weight optimization in feed-forward deep neural networks is also realized through
    the

    backpropagation algorithm, which is identical to single-layer networks. However,
    the more

    layers, the higher the computation complexity, and the slower the model convergence.
    One

    way to accelerate the weight optimization, is to use a more computational efficient

    activation function. The most popular one in recent years is the rectified linear
    unit (ReLU):


    ```

    relu(z) = z+ = max(0, z)

    ```'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'A plot of the ReLU function is as follows:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_40_0.png)


    relu''(z) = \begin{cases} 0, z < 0 \\ 1, z \ge 0 \end{cases}


    Thanks to the properties of its derivative, which is , there are two main advantages
    of using the ReLU activation function over sigmoid:


    +   - Faster learning because of constant value of \( relu''(z) \), compared to
    that of the logistic function \( sigmoid''(z) = sigmoid(z) * (1 - sigmoid(z))
    \).

    +   - Less likely to have the vanishing gradient problem, exponential decrease
    of gradient, which can be found in networks with multiple stacked sigmoid layers.
    As we multiply the derivative of the activation function when calculating errors
    \(\delta\) for each layer, and the maximal value of \( sigmoid''(z) \) is ¼, the
    gradients will decrease exponentially as we stack more and more sigmoid layers.


    The `nnet` package we used in previous sections is (by now) only capable of modeling
    a single-layer network. In this chapter, we use the `MXNet` package to implement
    deep neural networks with multiple hidden layers. MXNet (`https://mxnet.incubator.apache.org/`)
    is a deep learning framework that supports programming languages include R, Scala,
    Python, Julia, C++, and Perl. It is developed by the DMLC (`http://dmlc.ml/`)
    team, a group of experts collaborating on open-source machine learning projects.
    It is portable and can scale to multiple CPUs, multiple GPUs and multiple machines,
    for example, in the cloud. Most importantly, it allows us to flexibly and efficiently
    construct state-of-the-art deep learning models, including deep neural networks,
    CNNs and RNNs.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Let''s install MXNet first:


    ```

    > cran <- getOption("repos")

    > cran["dmlc"] <- "https://s3-us-west-2.amazonaws.com/apache-mxnet/R/CRAN/"

    > options(repos = cran)

    > if (!require("mxnet"))

    install.packages("mxnet")

    ```


    Now we can import MXNet and convert the data into the format preferred by the
    neural

    network models in MXNet:


    ```

    > require(mxnet)

    > data.train <- data.matrix(data_train)

    > data.train.x <- data_train[,-1]

    > data.train.x <- t(data.train.x/255)

    > data.train.y <- data_train[,1]

    ```


    Note we scale the input features to a range from 0 to 1, by dividing the maximal
    possible

    value 255. Otherwise, the deep neural networks may be skewed towards some features
    and

    such skewness will accumulate over layers.


    Now that the training dataset is ready, we can start constructing the network
    by defining its

    architecture as follows:


    ```

    > data <- mx.symbol.Variable("data")

    > fc1 <- mx.symbol.FullyConnected(data, name="fc1", num_hidden=128)

    > act1 <- mx.symbol.Activation(fc1, name="relu1", act_type="relu")

    > fc2 <- mx.symbol.FullyConnected(act1, name="fc2", num_hidden=64)

    > act2 <- mx.symbol.Activation(fc2, name="relu2", act_type="relu")

    > fc3 <- mx.symbol.FullyConnected(act2, name="fc3", num_hidden=10)

    > softmax <- mx.symbol.SoftmaxOutput(fc3, name="sm")

    ```


    In the MXNet''s Symbol API, we represent the network in the data type symbol.
    We begin

    with the input layer data, the input data, and follow up with the first hidden
    layer fc1 with

    128 nodes, which fully connects with the input layer. We then attach the ReLU
    function to

    fc1 and output the activations act1 for this layer. Similarly, we chain another
    hidden layer

    fc2, with 64 nodes this time, and output ReLU-based activates act2. Finally, we
    end up

    with the output layer with a softmax function, generating 10 probabilities corresponding
    to

    10 classes. The overall structure looks like this:'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/da8fb67f2acf661518076e08b6ffd9b9_42_0.png)


    After building the bone, it is time to train the model. We can choose our computation
    device, CPU and/or GPU—here is a CPU example:


    ```

    > devices <- mx.cpu()

    ```


    Before training, don''t forget to set the random seed to make the modeling process
    reproducible:


    ```

    > mx.set.seed(42)

    > model_dnn <- mx.model.FeedForward.create(softmax, X=data_train.x,

    y=data_train.y, ctx=devices, num.round=30, array.batch.size=100,

    learning.rate=0.01, momentum=0.9, eval.metric=mx.metric.accuracy,

    initializer=mx.init.uniform(0.1),

    epoch.end.callback=mx.callback.log.train.metric(100))

