- pgno: 104
  md: 'Besides the 4.77% (93.93% to 98.70%) performance increase compared to no data
    augmentation, we observe that each iteration takes a longer time than before (around
    20 s to around 80 s). This is because `image_data_generator()` generates mini-batches
    of augmented image data in real time for each iteration. So, even if the same
    set of samples is used in two iterations, the augmented data can be very different.
    Such setting adds more variation to the training set, which in turn makes the
    model more robust. And that is why data augmentation is considered an approach
    to reduce overfitting.


    Another particularly useful application of data augmentation is balancing a dataset.
    In most unbalanced classification cases (such as online ads click-through prediction,
    or banking fraud detection), we usually down-sample the dominant class. However,
    this can be counterproductive for small datasets. The alternative solution is
    to augment data from the minor class.


    Last but not least, there are other approaches not mentioned previously to augment
    image data. For example, rescaling multiplies pixel values by a factor and, as
    a result, changes the lighting condition. Shearing and zooming are useful data
    augmentation transformations as well. They can be specified in `image_data_generator()`.
    If interested, you can try applying any of these approaches and see whether you
    can beat 98.70%.


    # # Reviewing methods to prevent overfitting in CNNs


    Overfitting occurs when the model fits too well to the training set but is not
    able to generalize to unseen cases. For example, a CNN model recognizes specific
    traffic sign images in the training set instead of general patterns. It can be
    very dangerous if a self-driving car is not able to recognize sign images in ever-changing
    conditions, such as different weather, lighting, and angles different from what
    are presented in the training set. To recap, here''s what we can do to reduce
    overfitting:


    +   • Collecting more training data (if possible and feasible) in order to account
    for various input data.

    +   • Using data augmentation, wherein we invent data in a smart way if time or
    cost does not allow us to collect more data.

    +   • Employing dropout, which diminishes complex co-adaptations among neighboring
    neurons.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '+   - Adding Lasso (L1) or/and Ridge (L2) penalty, which prevents model coefficients

    +   from fitting so perfectly that overfitting arises.

    +   - Reducing the complexity of network architecture. Recall that in the last
    chapter,

    +   we mentioned that adding hidden layers will not help boost the model

    +   performance but increase chances of overfitting.


    # Summary


    We just accomplished our second computer vision project in this R and deep learning

    journey! Through this chapter, we got more familiar with convolutional neural
    networks

    and their implementation in MXNet, and another powerful deep learning tool: Keras
    with

    TensorFlow.


    We started with what self-driving cars are and how deep learning techniques are
    making

    self-driving cars feasible and more reliable. We also discussed how deep learning
    stands out

    and becomes the state-of-the-art solution for object recognition in intelligent
    vehicles. After

    exploring the traffic sign dataset, we developed our first CNN model using MXNet
    and

    achieved more than 99% accuracy. Then we moved on to another powerful deep learning

    framework, Keras + TensorFlow, and obtained comparable results.


    We introduced the dropout technique to reduce overfitting. We also learned how
    to deal

    with lack of training data and utilize data augmentation techniques, including
    flipping,

    shifting, and rotation. We finally wrapped up the chapter by summarizing some

    approaches to prevent overfitting in CNN models. That was the second example where
    we

    observed how deep learning removes manual or explicit feature extraction steps
    taken in

    traditional approaches, and instead efficiently finds the best sets of features.


    We have practiced CNNs in these two computer vision projects. In the next project,
    we will

    be working with totally different types of deep neural networks—autoencoders.'
