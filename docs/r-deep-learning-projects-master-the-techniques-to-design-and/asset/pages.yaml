    # Variational Autoencoders


    **Variational Autoencoders** (VAE) are a more recent take on the autoencoding
    problem. Unlike autoencoders, which learn a compressed representation of the data,
    Variational Autoencoders learn the random process that generates such data, instead
    of learning an essentially arbitrary function as we previously did with our neural
    networks.


    VAEs have also an encoder and decoder part. The encoder learns the mean and standard
    deviation of a normal distribution that is assumed to have generated the data.
    The mean and standard deviation are called **latent variables** because they are
    not observed explicitly, rather inferred from the data.


    The decoder part of VAEs maps back these latent space points into the data. As
    before, we need a loss function to measure the difference between the original
    inputs and their reconstruction. Sometimes an extra term is added, called the
    **Kullback-Leibler divergence**, or simply KL divergence. The KL divergence computes,
    roughly, how much a probability distribution differs from another. Adding the
    KL divergence, forces the posterior distribution to be similar to the prior. This,
    in turn, helps to both learn better representations of the data and to reduce
    overfitting.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Unlike autoencoders, VAEs have a solid probabilistic foundation, so the score
    you get is indeed the probability of an observation being an outlier. In autoencoders,
    the score we get has no such interpretation, therefore the choice of the cutoff
    or threshold value is entirely reliant on the input of a human expert, and is
    strictly data specific.


    # # Image reconstruction using VAEs


    Our first example will use the MNIST data to illustrate the use of Variational
    Autoencoders.


    The development strategy is as follows:


    +   - First, an encoder network turns the input samples x, into two parameters
    in a latent space, which will be denoted z_mean and z_log_sigma

    +   - Then, we randomly sample similar points z from the latent normal distribution
    which we assumed is used to generate the data, as z ~ z_mean + exp(z_log_sigma)*epsilon
    where epsilon is a random normal tensor

    +   - Once this is done, a decoder network maps these latent space points z back
    to the original input data


    We begin as usual, getting and preprocessing the data:


    ```

    library(keras)

    # Switch to the 1-based indexing from R

    options(tensorflow.one_based_extract = FALSE)

    K <- keras::backend()

    mnist <- dataset_mnist()

    X_train <- mnist$train$x

    y_train <- mnist$train$y

    X_test <- mnist$test$x

    y_test <- mnist$test$y

    # reshape

    dim(X_train) <- c(nrow(X_train), 784)

    dim(X_test) <- c(nrow(X_test), 784)

    # rescale

    X_train <- X_train / 255

    X_test <- X_test / 255

    ```


    Note the additional line:


    ```

    K <- keras::backend()

    ```


    This gets us a reference to the tensor backend where Keras will perform the tensor
    operations.'
  merge: -1
  img_proc: true
- pgno: 138
  md: "Now we turn to the VAE. It will consist of a latent dimension of size 2 and\
    \ a hidden layer of 256 neurons:\n\n```\norig_dim <- 784\nlatent_dim <- 2\ninner_dim\
    \ <- 256\nX <- layer_input(shape = c(original_dim))\nhidden_state <- layer_dense(X,\
    \ intermediate_dim, activation = \"relu\")\nz_mean <- layer_dense(hidden_state,\
    \ latent_dim)\nz_log_sigma <- layer_dense(hidden_state, latent_dim)\n```\n\nNext,\
    \ with the help of our Keras backend, we define the sampling function that will\
    \ generate the data from the latent variables:\n\n```\nsample_z<- function(params)\
    \ {\nz_mean <- params[, 0:1]\nz_log_sigma <- params[, 2:3]\nepsilon <- K$random_normal(\n\
    \  shape = c(K$shape(z_mean)[[1]]),\n  mean=0.,\n  stddev=1\n)\nz_mean + K$exp(z_log_sigma/2)*epsilon\n\
    }\n```\n\nWe now define the sampled points:\n\n```\nz <- layer_concatenate(list(z_mean,\
    \ z_log_sigma)) %>%>\nlayer_lambda(sample_z)\n```\n\nTime to define the decoder.\
    \ We create separate instances of these layers to be able to reuse them later:\n\
    \n```\ndecoder_hidden_state <- layer_dense(units = intermediate_dim, activation\
    \ =\n\"relu\")\ndecoder_mean <- layer_dense(units = original_dim, activation =\
    \ \"sigmoid\")\nhidden_state_decoded <- decoder_hidden_state(z)\nX_decoded_mean\
    \ <- decoder_mean(hidden_state_decoded)\n```\n\nWe are ready! Our VAE is specified\
    \ by the following encoder and decoder components:\n\n```\n# end-to-end autoencoder\n\
    variational_autoencoder <- keras_model(X, X_decoded_mean)\nencoder <- keras_model(X,\
    \ z_mean)\ndecoder_input <- layer_input(shape = latent_dim)\n```"
  merge: -1
  img_proc: true
- pgno: 139
  md: "```\ndecoded_hidden_state_2 <- decoder_hidden_state(decoder_input)\ndecoded_X_mean_2\
    \ <- decoder_mean(decoded_hidden_state_2)\ngenerator <- keras_model(decoder_input,\
    \ decoded_X_mean_2)\n```\n\nIt remains to specify the custom loss function, since\
    \ we are adding the KL-divergence penalization:\n\n```\nloss_function <- function(X,\
    \ decoded_X_mean) {\n  cross_entropy_loss <- loss_binary_crossentropy(X, decoded_X_mean)\n\
    \  kl_loss <- -0.5*K$mean(1 + z_log_sigma - K$square(z_mean) -\n  K$exp(z_log_sigma),\
    \ axis = -1l)\n  cross_entropy_loss + kl_loss\n}\n```\n\nWe compile and run our\
    \ algorithm, as usual:\n\n```\nvariational_autoencoder %>% compile(optimizer =\
    \ \"rmsprop\", loss =\nloss_function)\nhistory <- variational_autoencoder %>%\
    \ fit(\n  X_train, X_train,\n  shuffle = TRUE,\n  epochs = 10,\n  batch_size =\
    \ 256,\n  validation_data = list(X_test, X_test)\n)\nplot(history)\n```\n\nAfter\
    \ the training is done, we can see the performance (or, follow it in real time\
    \ using the Viewer in RStudio):\n\n![](img/da8fb67f2acf661518076e08b6ffd9b9_139_0.png)\n\
    \nPerformance of our for reconstruction in the MNIST data."
