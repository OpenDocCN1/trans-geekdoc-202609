    Depending on when the model is constructed, the names of the layers may have different
    suffixes (_1, _2 for example).


    All the pieces of the CNN model are now assembled. Before compiling the model,
    we need to explicitly specify its optimizer. In MXNet, the optimizer is a parameter
    in the mx.model.FeedForward.create method with stochastic gradient descent (SGD)
    as the default value. In Keras, we use the same optimizer with the same learning
    rate and momentum:


    ```

    > opt <- optimizer_sgd(lr = 0.005, momentum = 0.9)

    ```'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Along with the optimizer we just defined, cross entropy as the loss function,
    and classification accuracy as the metric, we compile the CNN model:


    ```

    > model %>% compile(

    +     loss = "categorical_crossentropy",

    +     optimizer = opt,

    +     metrics = "accuracy"

    + )


    ```


    We can now safely kick off our model training. Again, the same hyperparameters
    are used, including batch size and number of iterations. Note that the testing
    dataset is used for model validation, where the classification performance of
    the current CNN model is computed for each training iteration. Last but not least,
    shuffle is not necessary in our case as the training data is already shuffled
    after raw data splits:


    ```

    > model %>% fit(

    +     x_train, y_train,

    +     batch_size = 100,

    +     epochs = 30,

    +     validation_data = list(x_test, y_test),

    +     shuffle = FALSE

    + )


    ```


