- pgno: 9
  md: '# Preface


    In this book, we have tried to make a case for using deep learning within R. Most
    deep learning power-users would shun R and go for other languages, such as Python.
    We, however, believe that R has a solid ecosystem of packages, and visualization
    and manipulation tools, that can be combined with deep learning libraries to create
    interesting projects. R also has a huge base of users without a software engineering
    background (perhaps you are one of them?), and those users are increasingly interested
    in applications that deep learning is making possible, but they do not have time
    to learn Python.


    # Who this book is for


    This book is meant mainly for two types of readers: professionals who use R in
    their daily work and want to know some of the tricks and best practices that we
    have discovered in our projects, and anyone who wants to jump into the field of
    deep learning with concrete use cases in mind. This is not a tutorial in R or
    machine learning; it is rather a real-world showcase of how deep learning can
    be used in industry, with examples borrowed from our own experience.


    # What this book covers


    *Chapter 1, Handwritten Digit Recognition Using Convolutional Neural Networks,*
    is where we start working on the first project of the book. We will begin with
    a recap of logistic regression and multilayer perceptron. We''ll solve the problem
    with these two algorithms. We will then move on to the biologically inspired variants
    of multilayer perceptron—convolutional neural networks (CNNs). We will also cover
    the basics and core concepts of deep learning.


    *Chapter 2, Traffic Sign Recognition for Intelligent Vehicles,* explains how to
    use CNNs for another application—traffic sign detection. We will also cover several
    important concepts of deep learning in this chapter and get readers familiar with
    other popular frameworks and libraries, such as Keras and TensorFlow. We will
    also introduce the dropout technique as a regularization approach and utilize
    data augmentation techniques to deal with a lack of training data.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Chapter 3, Fraud Detection with Autoencoders, introduces a type of deep learning
    model that can be used for anomaly detection. Outliers can be found within a collection
    of images, a text corpus, or transactional data. We will dive into applications
    of autoencoders and how they can be used for outlier detection in this domain.


    Chapter 4, Text Generation Using Recurrent Neural Networks, introduces different
    models of neural networks that try to capture the elusive properties of memory
    and abstraction to produce powerful models. We will apply different methods to
    tackle the text generation problem and suggest directions of further exploration.


    Chapter 5, Sentiment Analysis with Word Embeddings, shows how to use the popular
    GloVe algorithm for sentiment analysis, as well as other, less abstract tools.
    Although this algorithm is, strictly speaking, not a deep learning application,
    it belongs to the modern (as of 2018) toolkit of the data scientist, and it can
    be combined with other deep learning techniques.


    # # To get the most out of this book


    You should be comfortable with R and RStudio and have some knowledge of college-level
    mathematics (calculus and linear algebra). Working knowledge of basic machine
    learning algorithms for classification, regression problems, and clustering might
    be helpful, but it is not strictly required.


