    We just fit our model with hyperparameters:


    +   - num.round = 30: The maximum number of iterations

    +   - array.batch.size = 100: The batch size of mini-batch gradient descent

    +   - learning.rate = 0.05: The learning rate

    +   - momentum=0.9: The momentum factor that determines how much of the previous
    velocity is incorporated into the current one

    +   - eval.metric=mx.metric.accuracy: This uses classification accuracy as the
    evaluation metric

    +   - initializer=mx.init.uniform(0.1): Initial weights are randomly generated
    from the uniform distribution between -0.1 and 0.1 so as to lower the chances
    of weights exploding and vanishing in the deep network

    +   - wd = 0.00001: The weight decay for L2 regularization, which adds penalties
    for large weights in order to avoid overfitting


    We can view the structure of the model by:


    ```

    > graph.viz(model_cnn$symbol)

    ```


    The trained model is then applied to the testing set:


    ```

    > test.array <- t(data_test.x)

    > dim(test.array) <- c(32, 32, 1, nrow(data_test.x))

    > prob_cnn <- predict(model_cnn, test.array)

    > prediction_cnn <- max.col(t(prob_cnn)) - 1

    ```'
