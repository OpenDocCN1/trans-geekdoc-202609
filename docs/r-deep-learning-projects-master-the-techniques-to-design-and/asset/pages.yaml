- pgno: 79
  md: 'The exploratory analysis we just conducted helps us to move forward with building
    classification models based on pixels.


    # First solution – convolutional neural networks using MXNet


    We start off with a solution similar to the one we developed at the end of the
    previous chapter, with CNNs using MXNet.


    Again, we first split the dataset into two subsets for training (75%) and testing
    (25%) using the caret package:


    ```

    > if (!require("caret"))

    + install.packages("caret")

    > library(caret)

    > set.seed(42)

    > train_perc = 0.75

    > train_index <- createDataPartition(data.y, p=train_perc, list=FALSE)

    > train_index <- train_index[sample(nrow(train_index)), ]

    > data_train.x <- data.x[train_index, ]

    > data_train.y <- data.y[train_index]

    > data_test.x <- data.x[-train_index, ]

    > data_test.y <- data.y[-train_index]

    ```


    Don''t forget to specify a particular random seed for reproducible work. We normally
    do data normalization before applying CNNs. In our case, the raw pixels loaded
    are already in the range of 0 to 1; after Y'' brightness conversion, the resulting
    pixels are still in the range of 0 to 1.


    > In general, normalizing our data is necessary before putting it into a CNN or
    in fact any neural network or gradient-descent-based model. As for image inputs,
    we usually scale the pixels in the range of 0 to 1.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "After preparing the training and testing set, we structure our CNN model as\
    \ follows:\n\n![](img/da8fb67f2acf661518076e08b6ffd9b9_80_0.png)\n\nThe network\
    \ starts with the first set of convolutional layers, the ReLu nonlinear layer\
    \ and the pooling layer. Here we use 32 5*5 convolutional filters and a 2*2 max\
    \ pooling filter:\n\n```\n> require(mxnet)\n> data <- mx.symbol.Variable(\"data\"\
    )\n> # first convolution\n> conv1 <- mx.symbol.Convolution(data=data, kernel=c(5,\
    \ 5),\n                                  num_filter=32)\n> act1 <- mx.symbol.Activation(data=conv1,\
    \ act_type=\"relu\")\n> pool1 <- mx.symbol.Pooling(data=act1, pool_type=\"max\"\
    ,\n                             +         kernel=c(2, 2), stride=c(2, 2))\n```\n\
    \nIt follows with the second set of convolutional, Relu nonlinear and pooling\
    \ layer, where 64 5*5 convolutional filters and 2*2 max pooling filter are used:\n\
    \n```\n> # second convolution\n> conv2 <- mx.symbol.Convolution(data=pool1, kernel=c(5,\
    \ 5),\n                                  num_filter=64)\n> act2 <- mx.symbol.Activation(data=conv2,\
    \ act_type=\"relu\")\n> pool2 <- mx.symbol.Pooling(data=act2, pool_type=\"max\"\
    ,\n                             +         kernel=c(2, 2), stride=c(2, 2))\n```\n\
    \nNow that we've extracted rich representations of the input images by detecting\
    \ edges, curves, and shapes, we move on to the fully connected layers. But before\
    \ doing so, we need to flatten the resulting feature maps from the previous convolution\
    \ layers:\n\n```\n> flatten <- mx.symbol.Flatten(data=pool2)\n```"
  merge: -1
  img_proc: true
- pgno: 81
  md: 'In the fully connected section, we apply a ReLu hidden layer with 1,000 units
    and a softmax layer with 43 units:


    ```

    > # first fully connected layer

    > fc1 <- mx.symbol.FullyConnected(data=flatten, num_hidden=1000)

    > act3 <- mx.symbol.Activation(data=fc1, act_type="relu")

    > # second fully connected layer

    > fc2 <- mx.symbol.FullyConnected(data=act3, num_hidden=43)

    ```


    Finally, the softmax layer, producing outputs for each of the 43 classes:


    ```

    > # softmax output

    > softmax <- mx.symbol.SoftmaxOutput(data=fc2, name="sm")

    ```


    All pieces of the network are now assembled. Before we start training the model,
    we specify the random seed and training devices and reshape the matrix data_train.x
    into an array as required by the convolutional layer in MXNet:


    ```

    > devices <- mx.cpu()

    > train.array <- t(data_train.x)

    > dim(train.array) <- c(32, 32, 1, nrow(data_train.x))

    > mx.set.seed(42)

    ```


    # Time for model training:


    ```

    > model_cnn <- mx.model.FeedForward.create (softmax, X=train.array,

    y=data.train.y, ctx=devices, num.round=30,

    array.batch.size=100,learning.rate=0.05, momentum=0.9,

    wd=0.00001, eval.metric=mx.metric.accuracy,

    epoch.end.callback=mx.callback.log.train.metric(100))

    ```


