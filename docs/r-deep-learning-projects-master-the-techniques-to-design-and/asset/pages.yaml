  md: 'Besides those hyperparameters we used in the previous deep neural network model,
    we fit the CNN model with L2 regularization weight decay wd = 0.00001, which adds
    penalties for large weights in order to avoid overfitting.


    Again, training of the CNN model is no different to other networks. Optimal weights
    are obtained through a backpropagation algorithm.


