    # ## Exploratory data analysis


    An often overlooked step is exploratory data analysis. Before jumping straight
    into the data and trying to do fancy deep learning architectures, let''s step
    back and look at what we have around.


    Let''s begin by downloading the dataset from Kaggle: (https://www.kaggle.com/dalpozz/creditcardfraud)
    and importing it into R:


    ```

    ```r

    df <- read.csv("./data/creditcard.csv", stringsAsFactors = F)

    head(df)

    ```

    ```


    Before moving on, we should do a basic sanity check. Some of the things we should
    look for are:


    +   - Verify that there are indeed only two classes (0 for normal transactions,
    1 for fraudulent)

    +   - Verify that the timestamp corresponds to two days

    +   - Check that there are no missing values


    Once this is done, we can perform two quick checks, an idea would be to see if
    there is an obvious pattern between the time of day and the amount. Perhaps fraudulent
    transactions happen at a certain time, when our system is vulnerable? We should
    check this first:


    ```

    ```r

    library(ggplot2)

    library(dplyr)

    df %>% ggplot(aes(Time, Amount)) + geom_point() + facet_grid(Class ~ .)

    ```

    ```'
