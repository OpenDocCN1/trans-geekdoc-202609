  img_proc: true
- pgno: 101
  md: 'The rotated sign (right) and the original image (left) contain identical information:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_101_0.png)


    Shifting is perhaps the most common augmentation method. Moving the image horizontally
    and/or vertically by a small number of pixels generates an identically functioning
    image. Using the same example as before, we shift it horizontally and vertically
    by at most 20% of the width and height:


    ```

    > images_iter <- flow_images_from_data(img1,

    + generator=image_data_generator(width_shift_range=0.2,

    + height_shift_range=0.2), save_to_dir = ''augmented'',

    + save_prefix = "shift", save_format = "png")

    > reticulate::iter_next(images_iter)

    ```


    This results in a shifted image in the right half here:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_101_1.png)'
