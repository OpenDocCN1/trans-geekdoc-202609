  md: 'Our first fraud example comes from a dataset made public in Kaggle, (https://www.kaggle.com/dalpozz/creditcardfraud),
    by researchers from the Université Libre de Bruxelles in Belgium (for the full
    work, you can read their paper: Andrea Dal Pozzolo, Olivier Caelen, Reid A. Johnson
    and Gianluca Bontempi, Calibrating Probability with Undersampling for Unbalanced
    Classification. In Symposium on Computational Intelligence and Data Mining (CIDM),
    IEEE, 2015).


    The datasets contain transactions made by credit cards in two days in September
    2013 by European cardholders. We have 492 frauds out of 284,807 transactions.
    Unlike toy datasets (I am looking at you, Iris), real-life datasets are highly
    unbalanced. In this example, the positive class (frauds) account for 0.172% of
    all transactions.


    It contains just numerical information factors which are the aftereffect of a
    PCA change. Because of classification issues, the creators can’t give the first
    highlights and more foundation data about the information. Features V1, V2, ...
    V28 are the chief segments got with PCA, the main features which have not been
    changed with PCA are Time and Amount .


    The feature, Time contains the seconds elapsed between each transaction and the
    first transaction in the dataset. The feature, Amount is the transaction''s amount,
    this feature can be used for example-dependent, cost-sensitive learning. The feature,
    Class is the response variable and it takes value 1 in case of fraud and 0 otherwise.
    Given the class imbalance ratio, the authors recommend measuring the area under
    the precision-recall curve (AUC), instead of the confusion matrix. The precision-recall
    curve is also called ROC (receiver-operator characteristic).


    At this point you might be thinking: well, why should I bother with autoencoders
    since this is clearly a binary classification problem, and we already have the
    labeled data? Sure, you can go the traditional way and try to do standard supervised
    learning algorithms, such as random forests or support vector machines, just be
    careful to either oversample the fraud class or undersample the normal class,
    so that these methods can perform well. However, in many real-life instances we
    do not have the labeled data beforehand, and in complex fraud scenarios it might
    be very tricky to get an accurate label. Suppose you are a criminal willing to
    commit fraud.'
