- pgno: 158
  md: 'A traditional deep neural network uses different parameters at each layer.
    In a recurrent neural network, the parameters are shared across all time steps
    (see preceding Figure 1) across all steps. This reflects the fact that the task
    is the same (in this case, *reading*), just with different inputs. It also helps
    to reduce the number of parameters we need to learn.


    We choose the `tanh` function because it puts the inputs in the range [-1,1].
    Later, we will want to use the outputs of the network as probabilities; the output
    layer is the *softmax* function.


    The diagram shown in *Figure 1* fully describes the **forward propagation** of
    our network, given the weight matrices, we can calculate the output of the network.
    But how should we train the network to find those weights?


    As usual in neural networks, the idea is to use the difference between the predictions
    of the network and the training labels to adjust the weights in the right direction.
    For this, we need to specify a loss function. A common choice is the cross-entropy
    loss function:


    $L(y, o) := - \frac{1}{N} \sum_{n \in N} y_n \log o_n$


    Where $N$ denotes the number of training examples. This function measures a weighted
    score on the predicted class times the log probability of that class. Note that
    we get a loss of zero if we have probability of 1 for the correct class, and a
    positive loss otherwise. This means that the cross entropy punishes us for not
    being confident. Notice that it also punishes us for being confident and incorrect
    (why is that?).


    To update the weights, we need to compute the derivatives:


    $\frac{\partial L}{\partial U''}, \frac{\partial L}{\partial V''}, \frac{\partial
    L}{\partial W}$


    We also need to update the weights in the direction that reduces the error, that
    is, the opposite direction of the gradient. This sounds no more complicated than
    vanilla backpropagation in standard neural networks. The situation is a bit more
    complicated in recurrent neural networks because of the hidden state, which links
    the current time step with the previous history. To see this, let''s say that
    we want to compute the partial derivative of the loss function with respect to
    $W$. We need to calculate:


    $\frac{\partial L}{\partial W} := \frac{\partial L}{\partial o_t} \cdot \frac{\partial
    o_t}{\partial s_t} \cdot \frac{\partial s_t}{\partial W}$'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Nothing strange here, simply using the chain rule. What''s the trick? The catch
    is in the second and third term in the preceding expression. The internal state
    at time $t$ depends on the internal state at the previous time. Hence, our computation
    is actually:


    $\frac{\partial L}{\partial W} = \frac{\partial L}{\partial o_t} \cdot \frac{\partial
    o_t}{\partial s_t} \cdot \frac{\partial s_t}{\partial s_{t-1}} \cdot \frac{\partial
    s_{t-1}}{\partial s_{t-2}} \cdots \frac{\partial s_1}{\partial W}$


    You can see how this computation should be done from the preceding diagram, showing
    the unfolded version of the network. The preceding computation is a different
    form of the backpropagation algorithm, called **backpropagation through time**.


    An important consequence of the preceding is that recurrent neural networks are
    hard to train. Since the derivative of the `tanh` function is bounded by 1, in
    the preceding computation, we see a lot of terms multiplying each other between
    0 and 1. So the resulting gradient will be small, and it might become numerically
    zero early on in the training. This is quite bad, because this prevents from learning
    long-term dependencies. This is because the gradient contributions from *far away*
    steps become zero because, in line with the chain rule, they are the product of
    many numbers less than 1. This problem is known as the vanishing gradient problem
    and was first discovered by Sepp Hochreiter in 1991. It is by no means exclusive
    of recurrent neural networks. Standard feed-forward neural networks have the same
    issue when you have many layers (we say they are deep when they have four or more
    layers), it is just that recurrent neural networks tend to be very deep; as deep
    as the sentence length, in our case.


    There are a few ways to address the vanishing gradient problem, you can use the
    ReLU function, which in R notation is:


    ```

    `ifelse(x>0, x, 0)`

    ```


    This function has a gradient of 0 or 1, hence it helps us to avoid the vanishing
    gradient issue. Relevant sections of the parameter space will be explored, even
    if they correspond to changes in the *far-away* history. Another possibility is
    to use different mechanisms, such as LSTM networks, proposed by Hochreiter and
    Schmidhuber in 1997, or GRU networks, by Cho and coauthors in 2014. We will describe
    these networks briefly in the next section.


    Besides the vanishing gradient problem, you can imagine that, depending on the
    structure of the network and the activation functions you choose, you can have
    the opposite situation, exploding gradients. This can happen, for instance, if
    the Jacobian has very small values. This is somehow less serious because you will
    get a `NaN` error on your code. One way around it is to clip the gradients, this
    simply means that you should add a condition that filters out values above a certain
    threshold. Of course, this will depend on your particular application and you
    might want to take a look at different values in certain cases.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'The main complication for implementing different types of neural networks is
    the computation of the gradients. In simple cases, this can be done by hand, but,
    as you can see, things quickly get out of control.


    Once the gradients are obtained, there are different methods we can use, perhaps
    the most popular being stochastic gradient descent. Unfortunately, stochastic
    gradient descent is not *plug and play*. You need to spend some time messing with
    the step size hyperparameter to get it to work properly. This is quite bad for
    working with neural networks. Other solutions, such as **Adagrad**, are used in
    practice. Adagrad is particularly simple to implement, and we will do so later
    in this chapter. The learning rate is adapted component-wise, and is given by
    the square root of the sum of squares of the historical, component-wise gradient.
    Other optimizers include RMSProp and Adam. An advantage, or at least a theoretical
    guarantee of Adagrad, is that it has a sound theory behind it, rather than being
    heuristic.


    It is possible to optimize a recurrent neural network without relying on gradient
    methods. For instance, by using genetic or evolutionary algorithms. Evolutionary
    algorithms are good for finding global minima in some cases, as by avoiding the
    direction of the gradient, they can find better solutions. A drawback of such
    algorithms is that they can be quite computing-intensive.


    # # LSTM and GRU networks


    As we saw, the recursive structure of RNN and LSTM networks have problems with
    gradients, either the gradients vanish or explode. One workaround is to introduce
    forget gates, which will delete some of the old information. This helps to keep
    track of relevant information without destroying the gradients, and to better
    preserve important data observed a long time ago.


    Both LSTM and GRU share the same design principle with recurrent neural networks,
    give an input, compute an output, and then a black box updates the internal state.
    This is crucial in order to understand the bigger picture.


    # # LSTM


    For an LSTM, we compute a number of things:


    +   - An input gate, i

    +   - A forget gate, f

    +   - An output gate, o

    +   - A candidate internal state, g'
  merge: -1
  img_proc: true
- pgno: 161
  md: '+   • An internal memory of the unit, c


    +   • A final internal state, s


    These are defined by the following recursive equations:


    ```

    i = σ(Uⁱxₜ + Wⁱsₜ₋₁)

    f = σ(Uᶠxₜ + Wᶠsₜ₋₁)

    o = σ(Uᵒxₜ + Wᵒsₜ₋₁)

    g = tanh(Uᵍxₜ + Wᵍsₜ₋₁)

    cₜ = cₜ₋₁ . f + g . i

    sₜ = tanh(cₜ) . o

    ```


    Where:


    ```

    σ(x) := 1 / (1 + e⁻ˣ)

    ```


    The first three equations describe the input, forget, and output gates. They are
    called gates because they decide which fraction of the newly computed candidate
    state will be allowed through, and which fraction will be forgotten. Given the
    new observations, we might want to keep something from the old memories and delete
    other things, or decide how much of the new information to take into account.
    This is computed in the memory variable, c. Finally, given this memory update,
    we keep a fraction of it that will be used by other parts of the network. If the
    weights in the input gate are all set to 1, the weights in the forget gate are
    all set to 0 and the weights of the output gate are all set to 1. We almost recover
    standard recurrent neural networks, except that the activation layer will have
    an extra tanh.


    There are many variations of LSTM architectures, building on this basic model.
    Examples include convolutional, bi-directional, peephole, and LSTM with a forget
    gate. A great resource is Chris Olah''s blog post on the topic: http://colah.github.io/posts/2015-08-Understanding-LSTMs/.


    # GRU


    Gated recurrent units (GRUs) share a similar design philosophy to LSTM layers.
    They consist of:


    +   • A hidden state, h


    +   • An internal state, s'
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   - An update gate, z

    +   - A reset gate, r


    The updates are given by the following recurrence relations:


    ```

    z = \sigma(U^z x_t + W^z s_{t-1})

    r = \sigma(U^r x_t + W^r s_{t-1})

    h = \tanh(U^h x_t + W^h(s_{t-1}r))

    s_t = (1 - z) \cdot h + z \cdot s_{t-1}

    ```


    The reset gate tells us how to put together the input with the previous memory.
    The update gate defines how much of the previous memory we should keep for the
    next iteration. This helps the network to forget useless things, and create connections
    with newer evidence. The resulting network has no hidden memory (c) which is independent
    of the internal state, as in the case with LSTMs. They also have input and forget
    gates merged into the update gate. One more key difference is that there is no
    second non-linearity (the second call to `tanh` in LSTMs) when computing the final
    output.


    So, which one to use? The jury is still out on that one. There is no conclusive
    evidence to use one network over another. GRUs have fewer parameters and may be
    a bit faster to train. They also might need less data to generalize well (as it
    is easier to estimate the weights accurately). GRUs are quite new, from 2014,
    so they have not been very well-explored.


    # # RNNs from scratch in R


    The purpose of this section is to show you how you can implement recurrent neural
    networks from bare bones in R. This is perhaps not the optimal solution for a
    number of reasons, but it is a great way to get started in deep learning.


    There are many _plug and play_ frameworks like H2O, MXNet, TensorFlow, or Keras,
    that have compatibility with R. Our goal is to focus on the understanding of the
    algorithm rather than a particular API, although we will include an example using
    Keras. This is for two reasons, at the time of writing, the compatibility with
    R suffers from growing pains and we encountered many errors and issues with the
    different packages. On the other hand, even the stable versions of such packages
    have ever-changing APIs. We will focus on this section in building a very simple
    recurrent neural network from scratch, using simple tools from R.


    We will start from the beginning, with a super-quick introduction to R6 classes
    in R using the example of the perceptron, and incrementally build from there.'
  merge: -1
  img_proc: true
