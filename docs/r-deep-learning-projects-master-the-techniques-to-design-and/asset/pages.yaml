- pgno: 209
  md: "# The more, the merrier – calculating n-grams instead of single words\n\nThe\
    \ reason for such an odd result in the previous section can be traced back to\
    \ the context. Notice that review 3 had the phrase No nonsense, no gimmicks, which\
    \ is largely positive, but has two negative words attached to it. How can we take\
    \ context into account? Enter n-grams. An n-gram is a sequence of n consecutive\
    \ items (words, or in the case of speech, phonemes) from a given sequence of text\
    \ or speech. Let’s make this clear with an example and use 2-grams, or bigrams:\n\
    \n```\ntext_df <- data_frame(line = 1:4, text = text)\ntext_df <- text_df %>%\n\
    unnest_tokens(bigram, text, token=\"ngrams\", n=2)\ntext_df\n```\n\nThis gives\
    \ us the following:\n\n```\n# A tibble: 70 x 2\n  line bigram\n  <int> <chr>\n\
    1 1 the food\n2 1 food is\n3 1 is typical\n4 1 typical czech\n5 1 czech and\n\
    6 1 and the\n7 1 the beer\n8 1 beer is\n9 1 is good\n10 1 good the\n# ... with\
    \ 60 more rows\n```\n\nSo, we now see that consecutive words are put together.\
    \ Already, this can be helpful enough to determine the negations of negative words\
    \ that are actually positive, as in our preceding review 3. Let’s find out which\
    \ negative words are negated. First, we split the two words of the bigram into\
    \ two columns:\n\n```\nlibrary(tidytr)\ntext_df <- text_df %>% separate(bigram,\
    \ c(\"w1\",\"w2\"), sep=\" \")\ntext_df\n```"
  merge: -1
  img_proc: true
- pgno: 210
  md: "# Which gives us:\n\n```\n# A tibble: 70 x 3\n  line w1  w2\n* <int> <chr>\
    \ <chr>\n  1  1 the   food\n  2  2 food  is\n  3  3 is    typical\n  4  1 typical\
    \ czech\n  5  1 czech and\n  6  1 and   the\n  7  1 the   beer\n  8  1 beer  is\n\
    \  9  1 is    good\n 10  1 good  the\n# ... with 60 more rows\n```\n\n# A bit\
    \ of dplyr magic brings the offending part of the sentence to question:\n\n```\n\
    text_df %>%\n filter(w1==\"no\") %>%\n inner_join(afinn, by=c(w2=\"word\") )\n\
    ```\n\n# Which is:\n\n```\n# A tibble: 1 x 4\n line w1   w2   score\n<int> <chr>\
    \ <chr> <int>\n 1     3 no   nonsense -2\n```\n\nWe could now use this information\
    \ to override the score of our third review. However, note how involved a process\
    \ it might be. Sure, in many cases it would work well, but we should find more\
    \ systematic ways of dealing with context.\n\n> n-grams are important to keep\
    \ track of the context of a word, and use it correctly for classification."
  merge: -1
  img_proc: true
- pgno: 211
  md: '# # Bag of words benchmark


    We came across one-hot embeddings while identifying fraudulent emails in Chapter
    3, Fraud Detection with Autoencoders. The idea is to represent each word as a
    basis vector; that is, a vector with zeros except one coordinate. Hence, each
    document (a review in this case) is represented as a vector with ones and zeros.
    We went a bit further from that and used different weighting (tf-idf).


    Let''s revisit this model once again, but include n-grams instead of single words.
    This will be our benchmark for the more sophisticated word embeddings we will
    do later.


    # # Preparing the data


    The data is a subset of the Stanford Large Movie Review dataset, originally published
    in:


    Andrew L. Maas, Raymond E. Daly, Peter T. Pham, Dan Huang, Andrew Y. Ng, and Christopher
    Potts. (2011). Learning Word Vectors for Sentiment Analysis. The 49th Annual Meeting
    of the Association for Computational Linguistics (ACL 2011).


    This data is available to download at http://ai.stanford.edu/~amaas/data/sentiment/,
    provided proper credit is given to the original paper. This is the raw data, but
    you can find a preprocessed version in Kaggle, https://www.kaggle.com/c/word2vec-nlp-tutorial/
    data.


    Let''s begin with loading the data:


    ```

    ```r

    df <- read.csv("./data/labeledTrainData.tsv", encoding = "utf-8", quote = "",
    sep="\t", stringsAsFactors = F)

    text <- df$review

    ```

    ```


    We revisit the tm library. Note that the code is a bit different, since we are
    loading the text as VCorpus instead of Corpus as before:


    ```

    ```r

    library(tm)

    corpus <- VCorpus(VectorSource(text))

    inspect(corpus[[1]])

    ```

    ```'
  merge: -1
