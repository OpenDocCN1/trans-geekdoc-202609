    By adding one more hidden layer, accuracy is improved from 91.4% to 97.0%! Since
    each hidden layer in a deep neural network provides representations of the data
    at a certain level, can we simply conclude that the more hidden layers (such as
    100, 1,000, 10,000...), the more underneath patterns are discovered, the better
    the classification accuracy? It might be true if we have plentiful resources and
    time to enable computation and to make sure overfitting does not occur with such
    complex networks. Is there any way where we can extract richer and more informative
    representations than by simply chaining more hidden layers, and at the same time,
    not excessively grow our networks? The answer is CNNs.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Extracting richer representation with CNNs


    Although regular hidden layers (we also call them fully connected layers) do the
    job of obtaining representations at certain levels, these representations might
    be able to help us differentiate between images of different classes. We need
    to extract richer and distinguishable representations that, for example, make
    a "9" a "9", a "4" a "4", or a cat a cat, a dog a dog. We resort to CNNs as variants
    of multi-layered neural networks which are biologically inspired by the human
    visual cortex. Basically, CNNs take inspiration from the following two neuroscience
    findings:


    +   • The visual cortex has a complex system of neuronal cells that are sensitive
    to specific sub-regions of the visual field, called the receptive field. For instance,
    some cells respond only in the presence of vertical edges; some cells fire only
    when exposed to horizontal edges; and some react more strongly when shown edges
    of a certain orientation. The cells are organized together to produce the entire
    visual perception, while each individual cell is specialized in a specific component.


    +   • Simple cells respond only when those edge-like patterns are presented within
    their receptive sub-regions. More complex cells are sensitive to larger sub-regions,
    and as a result, are less variant to the local position of those edge-like patterns
    in the entire visual field.


    Similarly, CNNs classify images by first deriving low-level representations, local
    edges and curves, then by composing higher-level representations, overall shape
    and contour, through a series of low-level representations. CNNs are well suited
    to exploiting strong and unique features that differentiate between images.


    In general, CNNs take in an image, pass it through a sequence of convolutional
    layers, non-linear layers, pooling layers and fully connected layers, and finally
    output the probabilities of each possible class. We now look at each type of layer
    individually, in detail.


    The convolutional layer is the first layer in a CNN. It simulates the way neuronal
    cells respond to receptive fields by applying a convolutional operation to the
    input. To be specific, it computes the dot product between the weights of the
    convolutional layer and a small region they are connected to in the input layer.
    The small region is the receptive field, and the weights can be viewed as the
    values on a filter. As the filter slides from the beginning to the end of the
    input layer, the dot product between the weights and current receptive field is
    computed. A new layer called feature map is obtained after convolving over all
    sub-regions. Take a look at the following example:'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/da8fb67f2acf661518076e08b6ffd9b9_46_0.png)


    Layer $m$ has five nodes and the filter has three units [$w_1, w_2, w_3$]. We
    compute the dot product between the filter and the first three nodes in layer
    $m$ and obtain the first node in the feature map; then, we compute the dot product
    between the filter and the middle three nodes and generate the second node; finally,
    we obtain the third node resulting from the last three nodes in layer $m$.


    Another example that helps us better understand how the convolutional layer works
    on images is as follows:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_46_1.png)


    A 3*3 filter is sliding around a 5*5 image from the top left sub-region to the
    bottom right. For every sub-region, the dot product is computed with the filter.
    A 3*3 feature map is generated as a result.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Convolutional layers are actually used to extract features, such as edges and
    curves. The output pixel in the feature map will be of high value, if the corresponding
    receptive field contains an edge or curve specified by the filter. For instance,
    in the preceding example, the filter portrays a backslash-shape diagonal edge,
    the receptive field in the blue rectangle contains a similar curve and hence,
    the highest intensity 3 (1*1 + 1* 1 + 1*1 + 3) is produced; however, the receptive
    field in the bottom left corner does not contain such a shape, which results in
    a pixel of value 1. The convolutional layer acts as a curve detector, mimicking
    the way our visual cells work.


    Remember in the preceding case, we only applied one filter and generated one feature
    map, which indicates how well the shape in the input image resembles the curve
    represented in the filter. To achieve a richer representation of the data, we
    can employ more filters, such as horizontal, vertical curve, 30-degree, or right-angle
    shape, so that the hidden layer composed of feature maps can detect more patterns.
    Additionally, stacking many convolutional layers can produce higher-level representations,
    such as overall shape and contour. To ensure the strong spatially local patterns
    are caught, each filter in a layer is only responsive to the corresponding receptive
    fields. Chaining more layers results in larger receptive fields which capture
    more global patterns.


    Right after each convolutional layer, we often apply a **non-linear layer** (also
    called **activation layer**, as we mentioned), in order to introduce non-linearity,
    obviously. This is because only linear operations (multiplication and addition)
    are conducted in the convolutional layer. And a neural network with only linear
    hidden layers would behave just like a single-layer perceptron, regardless of
    how many layers. Again, ReLu is the most popular candidate for the non-linear
    layer in deep neural networks.


    Normally, after obtaining features via one or more pairs of convolutional layers
    and non-linear layers, we can use the output for classification, for example applying
    a softmax layer in our multiclass case. Let''s do some math, suppose we apply
    20 5*5 filters in the first convolutional layer, then the output of this layer
    will be of size 20 * (28 - 5 + 1) * (28 - 5 + 1) = 20 * 24 * 24 = 11520, which
    means the number of features as inputs for the next layer becomes 11,520 from
    784; we then apply 50 5*5 filters in the second convolutional layer, the size
    of the output grows to 50 * 20 * (24 - 5 + 1) * (24 - 5 + 1) = 400,000, which
    is high-dimensional compared to our initial size of 784. We can see that the dimension
    increases dramatically with each convolutional layer before the softmax layer
    for classification. This can easily lead to overfitting, not to mention the large
    number of weights to be trained in the corresponding non-linear layer.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'To address the dimension growth issue, we often employ a **pooling layer**
    (also called **downsampling layer**) after a pair of convolutional and non-linear
    layers. As its name implies, it aggregates statistics of features by sub-regions
    to generate much lower dimensional features. Typical pooling methods include max
    pooling and mean pooling, which take the max values and mean values over all non-overlapping
    sub-regions, respectively. For example, we apply a 2*2 max pooling filter on a
    4*4 feature map and output a 2*2 one:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_48_0.png)


    Besides reducing overfitting with lower dimensional output, the pooling layer
    aggregating statistics over regions has another advantage—translation invariant.
    It means the output does not change, if the input image undergoes a small amount
    of translation. For example, suppose we shift the input image to a couple of pixels
    left or right, up or down, as long as the highest pixels remain the same in sub-regions,
    the output of the max pooling layer is still the same. In another words, the prediction
    becomes less position-sensitive with pooling layers.


    Putting these three types of convolutional-related layers together, along with
    fully connected layers, we can structure our CNN model as follows:


    ![](img/da8fb67f2acf661518076e08b6ffd9b9_48_1.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'It starts with the first convolutional layer, ReLu non-linear layer and pooling
    layer. Here, we use 20 5*5 convolutional filters, and a 2*2 max pooling filter:


    ```

    > # first convolution

    > conv1 <- mx.symbol.Convolution(data=data, kernel=c(5, 5),

    num_filter=20)

    > act1 <- mx.symbol.Activation(data=conv1, act_type="relu")

    > pool1 <- mx.symbol.Pooling(data=act1, pool_type="max",

    + kernel=c(2, 2), stride=c(2, 2))

    ```


    It follows with the second convolutional, ReLu non-linear and pooling layer, where
    50 5*5 convolutional filters and a 2*2 max pooling filter are used:


    ```

    > # second convolution

    > conv2 <- mx.symbol.Convolution(data=pool1, kernel=c(5, 5),

    num_filter=50)

    > act2 <- mx.symbol.Activation(data=conv2, act_type="relu")

    > pool2 <- mx.symbol.Pooling(data=act2, pool_type="max",

    + kernel=c(2, 2), stride=c(2, 2))

    ```


    Now that we extract rich representations of the input images by detecting edges,
    curves and shapes, we move on with the fully connected layers. But before doing
    so, we need to flatten the resulting feature maps from previous convolution layers:


    ```

    > flatten <- mx.symbol.Flatten(data=pool2)

    ```


    In the fully connected section, we apply two ReLu hidden layers with 500 and 10
    units respectively:


    ```

    > # first fully connected layer

    > fc1 <- mx.symbol.FullyConnected(data=flatten, num_hidden=500)

    > act3 <- mx.symbol.Activation(data=fc1, act_type="relu")

    > # second fully connected layer

    > fc2 <- mx.symbol.FullyConnected(data=act3, num_hidden=10)

    ```


    Finally, the softmax layer producing outputs for 10 classes:


    ```

    > # softmax output

    > softmax <- mx.symbol.SoftmaxOutput(data=fc2, name="sm")

    ```


    Now, the bone is constructed. Time to set a random seed and start training the
    model:'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'We need to first reshape the matrix, data_train.x into an array as required
    by the convolutional layer in MXNet:


    ```

