    # Dealing with a small training set – data augmentation


    We have been very fortunate so far to possess a large-enough training dataset
    with 75% of 39,209 samples. This is one of the reasons why we are able to achieve
    a 99.3% to 99.4% classification accuracy. However, in reality, obtaining a large
    training set is not easy in most supervised learning cases, where manual work
    is necessary or the cost of data collection and labeling is high. In our traffic
    signs classification project, can we still achieve the same performance if we
    are given a lot less training samples to begin with? Let''s give it a shot.


    We simulate a small training set with only 10% of the 39,209 samples and a testing
    set with the rest 90%:


    ```

    > train_perc_1 = 0.1

    > train_index_1 <- createDataPartition(data.y, p=train_perc_1, list=FALSE)

    > train_index_1 <- train_index_1[sample(nrow(train_index_1)), ]

    > data_train_1.x <- data.x[train_index_1,]

    > data_train_1.y <- data.y[train_index_1]

    > data_test_1.x <- data.x[-train_index_1,]

    > data_test_1.y <- data.y[-train_index_1]

    > x_train_1 <- data_train_1.x

    > dim(x_train_1) <- c(nrow(data_train_1.x), 32, 32, 1)

    > x_test_1 <- data_test_1.x

    > dim(x_test_1) <- c(nrow(data_test_1.x), 32, 32, 1)

    > y_train_1 <- to_categorical(data_train_1.y, num_classes = 43)

    > y_test_1 <- to_categorical(data_test_1.y, num_classes = 43)

    ```'
  merge: -1
  img_proc: true
