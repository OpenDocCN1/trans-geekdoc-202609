- pgno: 116
  md: 'In the preceding screenshot, the blue points are the reconstructed images from
    the autoencoder. We see that it learned correctly that most of the points come
    from a normal distribution centered at (0,0), as expected. However there are still
    some points which are *normal* on the original dataset and where pointed out as
    unusual. No need to get discouraged from learning autoencoders that soon, the
    reason for this is that the autoencoder we used is rather simple. We will look
    at more sophisticated ways to tackle the outlier detection problem with autoencoders.


    # # Autoencoders and MNIST


    Many examples of deep learning algorithms in either research papers, blog posts
    or books deal with the MNIST dataset. We should not be the exception and introduce
    a small use case for autoencoders using MNIST.


    The motivation is the following, suppose you want to detect fake banknotes automatically.
    Then you would need to teach the computer what the representation of the *average
    banknote* is to be able to detect those that have significant differences. Due
    to the large volume of cash transactions happening every day worldwide, and to
    the increasing sophistication of fraudsters, it would be unthinkable to do this
    process manually. One way to do this is to use sophisticated imaging software,
    which is how counterfeit banknote detectors, such as D40 or D50, work.


    Another reason for using MNIST is obviously practical. At the time of writing
    I was unable to find a nice training dataset with counterfeit banknotes, and MNIST
    comes already preinstalled in `keras`.


    We start with loading the dataset:


    ```

    library(keras)

    mnist <- dataset_mnist()

    X_train <- mnist$train$x

    y_train <- mnist$train$y

    X_test <- mnist$test$x

    y_test <- mnist$test$y

    ```


    Let''s take a closer look at the dataset:


    ```

    image(X_train[1,, ], col=gray.colors(3))

    y_train[1]

    ```


    If everything works correctly, you should see the image of the number five.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'We need to do a bit of preprocessing before training our autoencoder. The x_train
    data is a three-dimensional array (images, width, height) of grayscale values.
    We need to first convert these arrays into matrices by reshaping the height and
    width into a single vector, so that instead of dealing with 28 x 28 squares we
    have a 28*28=784 vector. Then, we convert the grayscale values from integers ranging
    between 0 to 255 into floating point values, ranging between 0 and 1:


    ```

    # reshape

    dim(X_train) <- c(nrow(X_train), 784)

    dim(X_test) <- c(nrow(X_test), 784)

    # rescale

    X_train <- X_train / 255

    X_test <- X_test / 255

    ```


    Once the initial preprocessing is done, we define the topology of our autoencoder.
    Let''s use an encoding layer with 32 neurons, to achieve a compression ratio of
    784/32 = 24.5:


    ```

    input_dim <- 28*28 #784

    inner_layer_dim <- 32

    input_layer <- layer_input (shape=c(input_dim))

    encoder <- layer_dense(units=inner_layer_dim,

    activation=''relu'') (input_layer)

    decoder <- layer_dense(units=784) (encoder)

    autoencoder <- keras_model(inputs=input_layer, outputs = decoder)

    ```


    We are ready to compile and train the model:


    ```

    autoencoder %>% compile(optimizer=''adam'',

    loss=''mean_squared_error'',

    metrics=c(''accuracy''))

    history <- autoencoder %>% fit(

    X_train, X_train,

    epochs = 50, batch_size = 256,

    validation_split=0.2

    )

    ```


    Using the plot command, we can see the performance of our model during the training
    and validation as follows:


    ```

    plot(history)

    ```


    Even better, if you are using RStudio as your IDE, there is a real-time view in
    the Viewer panel. With this command you should see two plots, showing the accuracy
    and loss as a function of the epoch number:'
  merge: -1
  img_proc: true
