  md: 'Before that, let''s introduce a simple benchmark model. Something that comes
    to mind when we speak about the memory of a neural network is the following, well,
    what if I had sufficient storage to calculate the conditional probabilities and
    simulate text generation as a Markov process, where the state variable is the
    observed text? We will implement this benchmark model to see how it compares in
    text generation quality with recurrent neural networks.


    # A simple benchmark implementation


    Let''s create a simple benchmark implementation and simulate text generation as
    a Markov chain. The idea is the following, we will estimate the probability of
    character c appearing after history h has been observed, where h has a fixed length.
    This length is called **memory**. For example, if we have a tiny corpus consisting
    of:


    > "My name is Pablo"


    And we fix a memory length of 4, we get a training set that looks like this:


    | h | c |

    |---|---|

    | My n | a |

    | y na | m |

    | nam | e |


    Our task is to estimate the conditional probability distribution:


    \(\mathbb{P}(c \mid h)\)


    This conditional probability is obtained simply by estimating the number of times
    c appears after h, divided by the number of times history h appears.


    The goal of this chapter is to build a benchmark model. We should clarify what
    we mean, as there is no *golden standard* for assessing performance in generative
    models. The way we will evaluate the model is by looking at the quality of the
    text generated, for which we need information about the context of the problem,
    namely, the corpus we want to learn to generate text from.'
  merge: -1
  img_proc: true
