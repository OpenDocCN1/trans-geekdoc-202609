    It is not bad to achieve 93.93% accuracy by a model trained with only 3,921 samples.
    But can we do better, at least close to 99% as we accomplished with sufficient
    training data? Yes! One solution is data augmentation.


    **Data augmentation** simply means expanding the size of the existing data that
    we feed to the supervised learning models in order to compensate for the cost
    of further data collection and labeling.


    There are many ways to augment data in computer vision. The simplest one is probably
    flipping an image horizontally or vertically. Take the General caution sign as
    an example; we implement flipping using the function flow_images_from_data() in
    Keras as follows.


    Load the General caution sample:


    ```

    > img<-image_load(paste(training_path, "00018/00001_00004.ppm", sep=""))

    > img1<-image_to_array(img)

    > dim(img1)<-c(1,dim(img1))

    ```'
