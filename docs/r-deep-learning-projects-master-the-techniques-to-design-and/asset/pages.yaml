- pgno: 204
  md: "The tidytext package includes three lexicons (collection of words) annotated\
    \ by sentiment:\n\n+   - AFINN from Finn Årup Nielsen (http://www2.imm.dtu.dk/pubdb/views/publication_details.php?id=6010)\n\
    +   - bing from Bing Liu and collaborators (https://www.cs.uic.edu/~liub/FBS/sentiment-analysis.html)\n\
    +   - nrc from Saif Mohammad and Peter Turney (http://saifmohammad.com/WebPages/NRC-Emotion-Lexicon.htm)\n\
    \nThe AFINN lexicon gives a numeric value between -5 and 5 to common words in\
    \ English, with negative values being negative words. For instance:\n\n```\nget_sentiments(\"\
    afinn\") %>%\n  filter(score==-5) %>%\n  head\n```\n\nGives (sensitive readers\
    \ should skip the next snippet):\n\n```\n# A tibble: 6 x 2\n  word score\n  <chr>\
    \ <int>\n1 bastard   -5\n2 bastards  -5\n```\n\nWhereas, the following:\n\n```\n\
    get_sentiments(\"afinn\") %>%\n  filter(score==0) %>%\n  head\n```\n\nIs simply:\n\
    \n```\n# A tibble: 1 x 2\n  word score\n  <chr> <int>\n1 some kind   0\n```\n\n\
    And the following:\n\n```\nget_sentiments(\"afinn\") %>%\n  filter(score==\"5\"\
    ) %>%\n  head\n```"
  merge: -1
  img_proc: true
- pgno: 205
  md: "# Returns:\n\n```\n# A tibble: 5 x 2\n  word score\n  <chr> <int>\n1 breathtaking\
    \ 5\n2 hurrah 5\n3 outstanding 5\n4 superb 5\n5 thrilled 5\n```\n\n# The bing\
    \ lexicon has only positive and negative words:\n\n```\n> get_sentiments(\"bing\"\
    ) %>% head\n# A tibble: 6 x 2\n  word sentiment\n  <chr> <chr>\n1 2-faced negative\n\
    2 2-faces negative\n3 a+ positive\n4 abnormal negative\n5 abolish negative\n6\
    \ abominable negative\n```\n\n# Whereas, the nrc has different categories:\n\n\
    ```\n> get_sentiments(\"nrc\") %>% head\n# A tibble: 6 x 2\n  word sentiment\n\
    \  <chr> <chr>\n1 abacus trust\n2 abandon fear\n3 abandon negative\n4 abandon\
    \ sadness\n5 abandoned anger\n6 abandoned fear\n```\n\nHow can we use these word\
    \ lists? Well, once our data is tidy, we can join them and create different aggregations\
    \ to try to get a feeling of what is going on. Let's start by storing the bing\
    \ lexicon somewhere:\n\n```\nbing <- get_sentiments(\"bing\")\n```\n\n# And joining\
    \ it with our data:\n\n```\n> text_df %>% inner_join(bing) %>% count(line, sentiment)\n\
    Joining, by = \"word\"\n# A tibble: 5 x 3\n```"
