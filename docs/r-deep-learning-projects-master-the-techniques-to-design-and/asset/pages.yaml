    We just fit the model with hyperparameters including:


    +   - num.round = 30: The maximum number of iterations is set to be 30.


    +   - array.batch.size = 100: The batch size of the mini-batch gradient descent
    is 100. As a variation of a stochastic gradient descent, the mini-batch gradient
    descent algorithm calculates costs and gradients by small batches, instead of
    individual training samples. Hence, it is computationally more efficient and allows
    faster model convergence. As a result, the mini-batch gradient descent is more
    commonly used in training deep neural networks.


    +   - learning.rate = 0.01: The learning rate is 0.01.


    +   - momentum=0 .9: In general, the cost function of deep architectures has the
    form of one or more shallow ravines (local minima) leading to the global optimum.
    Momentum as seen in the physical law of motion is employed to avoid getting stuck
    in sub-optimum and make the convergence faster. With momentum, weights are updated
    as follows:


    ```

    v = γv - ηΔW

    W = W + v

    ```


    where the left and right v is the previous and current velocity respectively,
    and γ ∈ (0,1] is the momentum factor determining how much of the previous velocity
    is incorporated into the current one.


    +   - eval.metric=mx.metric.accuracy: It uses classification accuracy as the evaluation
    metric'
  merge: -1
  img_proc: true
- pgno: 44
  md: '+   • initializer=mx.init.uniform(0.1): Initial weights are randomly generated
    from the uniform distribution ranging from 0 to 1, so as to lower the chances
    of the weight exploding and vanishing in the deep network


    After the model is trained, let''s see how it performs on the testing set. First,
    remember to conduct the same pre-processing on the test dataset:


    ```

    > data_test.x <- data_test[,-1]

    > data_test.x <- t(data_test.x/255)

    ```


    Then, predict the testing cases and evaluate the performance:


    ```

    > prob_dnn <- predict(model_dnn, data_test.x)

    > prediction_dnn <- max.col(t(prob_dnn)) - 1

    > cm_dnn = table(data_test$label, prediction_dnn)

