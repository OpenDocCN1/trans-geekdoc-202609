    # # RNN without derivatives — the cross-entropy method


    We will replace the backward propagation part on the preceding neural network
    with a Monte Carlo algorithm, called the cross-entropy method. This is a general-purpose
    algorithm introduced by Reuven Rubinstein which is quite helpful in many cases,
    especially for rare event simulation. It has been proven efficient for many reinforcement
    learning tasks, so why not give it a try?


    The method consists of two parts:


    +   1. Generate a random data sample (trajectories, vectors) according to a specified
    mechanism.

    +   2. Update the parameters of the random mechanism based on the data to produce
    a better sample in the next iteration. This step involves minimizing the cross-entropy
    or Kullback–Leibler divergence.


    Let''s first illustrate the situation with a small sample code. Suppose we want
    to minimize the function:


    ```

    ```

    # the function we need to maximize

    f <- function(theta) {

    reward = -sum((solution - theta)**2)

    return(reward)

    }

    ```

    ```


    The maximum of this function, as a function of `theta`, is reached when `theta==solution`.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Let''s fix a value for `solution` as the vector:


    ```

    solution <- c(0.5, 0.1, -0.3)

    ```


    And set up some initial parameters:


    ```

    dim_theta <- 3

    theta_mean <- matrix(0,dim_theta,1)

    theta_std <- diag(dim_theta)

    ```


    The cross-entropy method we will use works as follows:


    +   - Generate some sample solutions using an initial estimate for mean and standard

    +   deviation of the parameters.

    +   - Calculate as many as `batch_size` of those (where `batch_size` is a hyper-

    +   parameter).

    +   - Consider only a fraction of them, called the elite fraction (`elite_frac`).
    This is

    +   another hyper-parameter.

    +   - Get the top `elite_frac` of those, that means, those generated sample solutions

    +   that gave the highest reward in terms of the function we want to maximize.

    +   - Find the mean and covariance of those parameters to generate new candidate

    +   solutions.


    The following code example shows how to implement the logic described previously:


    ```

    cem <- function(f, n_iter, theta_mean, theta_std, batch_size=25,

    elite_frac=0.2) {

    for(it in 1:n_iter) {

    # Get a sample using the previous parameters

    thetas <- matrix(mvrnorm(n=batch_size*dim_theta, mu = theta_mean,

    Sigma=theta_std), ncol = dim_theta)

    rewards <- apply(thetas,1,f)

    # Now choose the best

    n_elite <- as.integer(batch_size * elite_frac)

    elite_inds <- sort(rewards, decreasing = T, index.return=T)$ix[1:n_elite]

    elite_thetas <- thetas[elite_inds,]

    # Update theta_mean, theta_std

    theta_mean <- apply(elite_thetas, 2,mean)

    theta_std <- 0.01*diag(dim_theta) + 0.99*cov(elite_thetas)

    }

    return(theta_mean)

    }

    ```'
  merge: -1
  img_proc: true
