    # # Fraud detection with H2O


    Let''s try a slightly different tool, that might help us in real-life deployments.
    It is often useful to try different tools in the ever-growing data science landscape,
    if only for sanity0-check purposes.


    H2O is an open source software for doing big data analytics. The young start-up
    (founded in 2016) counts with top researchers in mathematical optimization and
    statistical learning theory on their advisory board. It runs in standard environments
    (Linux/Mac/Windows) as well as big data systems and cloud computing environments.


    You can run H2O in R, but you need to install the package first:


    ```

    install.packages("h2o")

    ```


