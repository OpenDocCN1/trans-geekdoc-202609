    Centre for Women and Children from January 2020 to June 2022. This study was approved
    by the Institutional Review Board of Chongqing Health Centre for Women and Children
    (Approval No. 2022-RGI-11, date of approval 10 September 2022).


    The inclusion criteria for patients were: (i) fresh autologous oocyte retrieval
    with day 3 embryo transfer; and (ii) embryos cultured in a time-lapse system (EmbryoScope+).
    The exclusion criteria were: (i) embryos with blurred or missing photomicrographs
    during incubation; and (ii) cycles with one FHB in DET cycles. In total, 7786
