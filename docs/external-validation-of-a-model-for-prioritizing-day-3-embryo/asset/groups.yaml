    ### 引言

    优化辅助生殖技术（ART）以确保筛选出着床潜力最高的胚胎仍然是一项挑战。目前，最常用的胚胎筛选方法基于传统形态学评估。对于第3天移植，胚胎评估基于伊斯坦布尔共识报告（ALPHA
    Scientists In Reproductive Medicine, ESHRE Special Interest Group Embryology,
    2011）；这包括解割球数、碎片程度、解割球均匀性和多核现象。然而，该方法的主要局限性在于不同观察者评估的主观影响（Adamson et al., 2016）。


    与传统体外受精（IVF）技术相比，延时技术（TLT）可以持续记录胚胎的整个发育过程，包括从受精和卵裂期到囊胚形成的分裂时间点。后一种技术为评估卵裂模式、原核移动及其他无法通过常规胚胎评估识别的细节提供了更好的基础。因此，它产生了更多可应用于胚胎筛选的信息（Basile
    et al., 2015; Liu et al., 2020）。尽管一些作者推测，TLT 与传统形态学评估的结合将改善胚胎筛选（Coticchio et al.,
    2018），但其临床价值仍然存在争议（Goodman et al., 2016; Liu et al., 2016）。


    随着 TLT 的近期发展，人们尝试使用更强大的计算机分析大型图像数据集，以识别可能与胚胎发育潜能相关的参数。然而，各个 IVF 实验室之间培养条件的主要差异阻碍了相关强大算法的构建和广泛应用（Kallas
    et al., 2022）。


    机器学习的进步增加了电子病历数据和计算处理能力的可用性，从而促进了新型人工智能（AI）辅助方法的开发。此类方法涉及深度学习，并利用人工神经网络分析延时方法捕获的图像，以搜索与妊娠结局相关的模式，从而可能提供一种更准确、一致和客观的方法来筛选最具活力的胚胎（Lundin
    et al., 2020; Tran et al., 2019）。iDAScore AI 软件直接集成到 EmbryoScope+ 系统（Vitrolife,
    瑞典哥德堡）中，但 iDAScore 1.0 版仅基于第5天或第6天囊胚移植进行训练。原始数据集包含 115,832 个胚胎，其中 14,644 个是具有已知着床数据（KID）的囊胚移植（Bernsen
    et al., 2022）。iDAScore 2.0 版包含第2天和第3天移植的数据（Lassen et al., 2022）。这个更新的数据集包含 181,428
