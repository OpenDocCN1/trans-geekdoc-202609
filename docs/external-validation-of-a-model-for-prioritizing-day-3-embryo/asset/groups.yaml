    ## DISCUSSION


    This retrospective study showed that iDAScore Version 2.0 is able to predict FHB
    as well as, or better than, conventional morphological assessment. For transferred
    embryos with the same morphological grade, the FHB rate increased with the increase
    in iDAScore. This suggests that day 3 embryo selection based on iDAScore may achieve
    a higher FHB rate, and is safe and robust compared with conventional morphological
    assessment.


    A significant difference in the quality of transferred embryos was found between
