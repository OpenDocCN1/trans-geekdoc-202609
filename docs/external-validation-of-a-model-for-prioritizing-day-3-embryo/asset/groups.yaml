    高于常规形态学评估。卵裂球数量可能对 iDAScore 的影响大于形态学评估，这是解释此结果的一种可能原因。对于卵裂球较少的胚胎，较高的 iDAScore
    比形态学分级更能预测胎心搏，但对于卵裂球较多的胚胎，iDAScore 可能难以区分具有更高发育潜力的胚胎。因此，推测卵裂球数量可能是 iDAScore 模型中的一个重要预测因子。iDAScore
    已根据带有 KID 的胚胎图像接受训练，以自动为胚胎打分，且该分数与成功植入的可能性相关。先前的一项研究表明，虽然 iDAScore 未经过直接评估胚胎发育和形态的训练，但该模型可能已间接学习到卵裂球数量对植入的重要性（Berntsen
    et al., 2022）。因此，iDAScore 可能同时利用时序延时成像序列中每张图像的时序发育模式和静态形态学信息。


    将胚胎培养延长至囊胚期可能是选择发育潜力更高胚胎的一种简单方法（Li et al., 2021; Wang et al., 2021）。然而，囊胚培养并非对每位患者都必要或合适，特别是对于第
    5 天或第 6 天可能没有可用于移植的囊胚的患者。Levi-Setti 等人进行的一项随机对照研究支持采用单胚胎移植（SET）政策——即使是在卵裂期——用于年龄<39
    岁且产生至少四个合子的患者（Levi-Setti et al., 2018）。此外，选择性 SET 已常规采用，以最大限度地降低预后良好患者的多胎妊娠高风险（美国生殖医学学会实践委员会，2018）。对于常规形态学评估，第
    3 天胚胎移植的回顾性胎心搏率仍可接受，而引入 iDAScore 2.0 版本后胎心搏率可能有所提高。有必要开展一项设计良好、样本量大的随机对照试验，将 iDAScore
    2.0 版本与常规形态学评估用于第 3 天胚胎选择进行比较，以证实 AI 评估模型的性能。


    本研究的优势包括其创新性和相对较大的样本量。据作者所知，这是首个评估基于 AI 的第 3 天胚胎评估与常规形态学评估相比的妊娠预测性能的外部验证研究。本分析纳入了大量数据集，用于对
    iDAScore 2.0 版本进行外部验证，涉及 4328 个胚胎移植周期，共移植 7786 个胚胎。此外，本研究中移植的胚胎均为自体新鲜第 3 天胚胎，而非冻胚胎。


    然而，研究结果受限于回顾性研究的性质可能带来的潜在混杂因素。首先，所有分析的胚胎均基于形态学评估筛选。尽管常规形态学评估是广泛使用的分级系统，但它是一种易受观察者间差异影响的主观方法。其次，在形态学分级相同的胚胎中，本研究选择了卵裂球数量为
    8 个或以上的胚胎进行移植，这可能导致常规形态学评估的 AUC 值偏高。因此，需要来自其他中心的更大规模 SET 数据集进行进一步的外部验证。


    ## 结论


    基于深度学习和延时成像的完全自动化、无需标注的程序（即 iDAScore 2.0 版本）的客观胚胎评估，在新鲜第 3 天胚胎移植周期中的表现与常规形态学评估相当或更优。因此，iDAScore
    2.0 版本可能成为一种有前途的工具，用于选择植入可能性最高的第 3 天胚胎。完全自动化的评估系统可大幅缩短胚胎选择所需时间，并可消除主观性。因此，iDAScore
    可用作决策支持系统，协助胚胎学家进行胚胎选择。


    ## 数据可用性


    数据可应要求提供。


