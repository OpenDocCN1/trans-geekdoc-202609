    # DISCUSSION


    This retrospective study showed that iDAScore Version 2.0 is able to predict FHB
    as well as, or better than, conventional morphological assessment. For transferred
    embryos with the same morphological grade, the FHB rate increased with the increase
    in iDAScore. This suggests that day 3 embryo selection based on iDAScore may achieve
    a higher FHB rate, and is safe and robust compared with conventional morphological
    assessment.


    A significant difference in the quality of transferred embryos was found between
    SET and DET cycles. The majority of transferred embryos in SET cycles were of
    lower morphological quality compared with DET cycles. This may be related to the
    in-house procedure for SET allocation in the study clinic. Although there were
    no differences overall between SET and DET cycles in the observed FHB rate for
    embryos with KID within different iDAScore groups, it should be noted that the
    above analysis was based on embryos with KID, and the actual FHB rates were lower
    when DET cycles with only one FHB were included. However, the model performance
    for embryos with KID did not depend upon whether one or two embryos were selected
    for transfer. Hence, the model could also be used for patient


