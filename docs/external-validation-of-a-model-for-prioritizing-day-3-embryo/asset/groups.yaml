    Additionally, for the A+, B+, B and C groups, the FHB rates in the groups with
    an iDAScore of 6.0–8.0 were higher than those in all other iDAScore groups. All
    + groups (i.e. embryos with eight blastomeres or more at time of observation)
    showed a higher FHB rate than the non-+ groups (i.e. embryos with fewer than eight
    blastomeres at time of observation).


