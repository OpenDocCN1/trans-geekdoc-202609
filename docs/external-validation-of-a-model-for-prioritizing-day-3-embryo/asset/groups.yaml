    ### 受试者特征


    共分析了 4328 个周期中的 7786 次胚胎移植，包括 870 个 SET 周期和 3458 个 DET 周期（TABLE 1）。


    与 SET 周期相比，DET 周期的母体平均年龄和之前取卵周期数显著较低（P < 0.001 和 P = 0.019，分别）。


    此外，DET 周期中输卵管因素的比例显著高于 SET 周期（P < 0.001），而组合因素和排卵障碍比例在 DET 周期中显著低于 SET 周期（P <
    0.001 和 P < 0.001，分别）。


    SET 和 DET 周期在之前胚胎移植周期平均数和之前流产平均数方面无显著差异。


