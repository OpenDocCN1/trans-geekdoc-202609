    # INTRODUCTION


    t remains a challenge to optimize assisted reproductive technology (ART) to ensure
    the selection of embryos with the highest implantation potential. At present,
    the most commonly used embryo selection method is based upon conventional morphological
    assessment. For day 3 transfer, embryonic evaluation is based on the Istanbul
    consensus report (ALPHA Scientists In Reproductive Medicine, ESHRE Special Interest
    Group Embryology, 2011); this includes the number of blastomeres, degree of fragmentation,
    blastomere evenness and multinucleation. However, the principal limitation of
    this method is the subjective influence of assessments made by different observers
    (Adamson et al., 2016).


    Compared with conventional IVF technology, time-lapse technology (TLT) can record
    total embryonic development continuously, including division timepoints from fertilization
    and cleavage stages to blastocyst formation. The latter technique provides an
    improved basis with which to evaluate cleavage patterns, prokaryotic movement
    and other details that cannot be identified using conventional embryo assessment.
    It thus generates more information that can be applied to embryo selection (Basile
    et al., 2015; Liu et al., 2020). Although some authors have postulated that the
    combination of TLT and conventional morphological assessment will improve embryo
    selection (Coticchio et al., 2018), its clinical value remains controversial (Goodman
    et al., 2016; Liu et al., 2016).


    With the recent development of TLT, attempts have been made to analyse large image
    datasets using a more powerful computer to identify parameters that may be related
    to embryonic developmental ability. However, the major differences in culture
    conditions among individual IVF laboratories hinder construction and wide use
    of the powerful algorithms involved (Kallas et al., 2022).


    Advances in machine learning have increased the availability of electronic medical
    data and computational processing power, thus facilitating the development of
    novel artificial intelligence (AI)-assisted methodologies. Such methods involve
    deep learning, and employ artificial neural networks to analyse the images captured
    by time-lapse


    methods to search for patterns related to pregnancy outcomes, potentially providing
    a more accurate, consistent and objective method to select the most viable embryos
    (Lundin et al., 2020; Tran et al., 2019). iDAScore AI software is integrated directly
    into the EmbryoScope+ system (Vitrolife, Göteborg, Sweden), but iDAScore Version
    1.0 was trained solely on day 5 or day 6 blastocyst transfer. The original dataset
    consisted of 115,832 embryos, of which 14,644 were blastocysts transferred with
    known implantation data (KID) (Bernsen et al., 2022). iDAScore Version 2.0 includes
    data from day 2 and day 3 transfers (Lassen et al., 2022). This more recent dataset
    consisted of 181,428 embryos, of which 33,687 were embryos with KID. The network
    architecture of iDAScore Version 2.0 is identical to Version 1.0 but with a slightly
    modified training procedure (Lassen et al., 2022). The pregnancy-prediction performance
    of iDAScore Version 1.0 was confirmed in a large cohort study comprising vitrified-warmed
    blastocyst transfers (Ueno et al., 2021), and the validation results showed that
    the program performed as well as, or better than, conventional morphological assessment.
    Since the performance of iDAScore Version 2.0 has not been validated by independent
    external datasets, its use with cleavage-stage embryo transfers needs to be externally
    validated against conventional morphological assessments, such as the morphological
    grading system based on the Istanbul consensus report (ALPHA Scientists In Reproductive
    Medicine, ESHRE Special Interest Group Embryology, 2011).


    This study compared pregnancy-prediction performance after fresh day 3 embryo
    transfer using the area under the curve (AUC) from receiver operating characteristic
    (ROC) curve analysis of the two embryo assessment methods: iDAScore Version 2.0
    and conventional morphological assessment according to the Istanbul consensus
    report (ALPHA Scientists In Reproductive Medicine, ESHRE Special Interest Group
    Embryology, 2011). Additionally, pregnancy-prediction performance of the two embryo
    assessment methods was compared using AUC values for predicting fetal heartbeat
    (FHB) rate for all cycle groups and each subgroup (single-embryo transfer (SET),
    double-embryo transfer (DET), age <35 years, age ≥35 years, and number of blastomeres
    <8c and ≥8c). To the best of the authors’ knowledge, this is the first external
    validation of an embryo


    selection model based on deep learning with respect to cleavage-stage transfer.


