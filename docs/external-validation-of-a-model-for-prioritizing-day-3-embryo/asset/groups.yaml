    ## 基于深度学习和延时成像选择第3天胚胎移植模型的外部验证


    ![](img/82ad054bb53b906240826eecb039e07b_0_0.png)


    ### 个人简介

    Jiahong Zhu graduated from Chongqing Medical University, Chongqing, China. She
    has been engaged in reproductive medicine for more than 8 years at Chongqing Health
    Centre for Women and Children, mainly responsible for embryo selection, and embryo
    freezing and thawing procedures. Her current research interests include artificial
    intelligence in reproductive medicine and embryo evaluation.


    Jiahong Zhu$^{1,2}$, Lihong Wu$^{1,2}$, Junxia Liu$^{1,2}$, Yanfeng Liang$^{1,2}$,
    Jiayi Zou$^{1,2}$, Xiangwei Hao$^{1,2}$, Guoning Huang$^{1,2,*}$, Wei Han$^{1,2,*}$


    ### 关键信息

    与传统形态学评估相比，使用 iDAScore 2.0 版进行第3天胚胎筛选对着床的预测价值更高。完全自动化的评估系统可能缩短胚胎筛选时间，消除主观性，并可作为决策支持系统，协助胚胎学家进行胚胎筛选。


    ### 摘要

    **研究问题：** 使用 iDAScore 2.0 版进行客观胚胎评估是否能与传统形态学评估一样有效？


    **设计：** 在一家大型生殖医学中心对新鲜第3天胚胎移植周期进行了回顾性队列研究。共纳入4328个周期、具有已知着床数据的7786个胚胎，这些胚胎在延时培养箱中培养并纳入研究。使用
    iDAScore 2.0 版和与移植胚胎相关的传统形态学评估，对胎心搏动（FHB）率进行了回顾性分析。使用用于预测FHB的曲线下面积（AUC）值比较了两种评估方法的妊娠预测性能。


    **结果：** 对于所有周期，iDAScore 的 AUC 值显著高于形态学评估（0.62 对比 0.60；$P = 0.005$）；单胚胎移植周期（0.63
    对比 0.60；$P = 0.043$）和双胚胎移植周期（0.61 对比 0.59；$P = 0.012$）亦同。在年龄亚组中，<35 岁亚组 iDAScore
    的 AUC 值显著高于形态学评估（0.62 对比 0.60；$P = 0.009$）；然而，$\ge$35 岁亚组未发现显著差异。就胚胎解割球数而言，<8c
    亚组（0.67 对比 0.56；$P < 0.001$）和 $\ge$8c 亚组（0.58 对比 0.55；$P = 0.012$）的 iDAScore AUC
    值均显著高于形态学评估。


    **结论：** iDAScore 2.0 版在新鲜第3天胚胎移植周期中的表现不逊于或优于传统形态学评估。因此，iDAScore 2.0 版可能成为一种有前途的工具，用于筛选着床可能性最高的胚胎。


    - 传统形态学评估

    - 第3天胚胎

    - 深度学习

    - 客观胚胎评估

    - 妊娠预测


