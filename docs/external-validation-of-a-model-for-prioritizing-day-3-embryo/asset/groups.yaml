    to embryonic developmental ability. However, the major differences in culture
    conditions among individual IVF laboratories hinder construction and wide use
    of the powerful algorithms involved (Kallas et al., 2022).


    Advances in machine learning have increased the availability of electronic medical
    data and computational processing power, thus facilitating the development of
    novel artificial intelligence (AI)-assisted methodologies. Such methods involve
    deep learning, and employ artificial neural networks to analyse the images captured
    by time-lapse methods to search for patterns related to pregnancy outcomes, potentially
