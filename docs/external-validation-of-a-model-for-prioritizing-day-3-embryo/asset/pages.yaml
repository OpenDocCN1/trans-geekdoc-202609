    with the increase of iDAScore to 25.91% in the 2.0–3.9 group, 43.88% in the 4.0–5.9
    group, and 48.34% in the 6.0–8.0 group (TABLE 3). Furthermore, for subgroups of
    morphological grades A+, B+, B, C+ and C, the FHB rates with an iDAScore of 2.0–3.9
    were lower than the rates in the higher iDAScore groups (TABLE 3) (A+ iDAScore
    0.0–5.9 P = 0.015, all others P < 0.001, see Table S1, online supplementary material).
    Additionally, for the A+, B+, B and C groups, the FHB rates in the groups with
    an iDAScore of 6.0–8.0 were higher than those in all other iDAScore groups. All
    + groups (i.e. embryos with eight blastomeres or more at time of observation)
