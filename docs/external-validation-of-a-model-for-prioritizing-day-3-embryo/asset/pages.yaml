    were 0.62 for iDAScore and 0.60 for conventional morphological assessment, with
    a significant difference between the two methods (P = 0.005). For the subgroups
    of SET and DET, AUC values for iDAScore were significantly greater than those
    for


    conventional morphological assessment (SET 0.63 versus 0.60, P = 0.043; DET 0.61
    versus 0.59, P = 0.012). To better compare the performance of the two embryo assessment
    methods, age-


    related differences were taken into account. For women aged <35 years, the AUC
    value for iDAScore was significantly higher compared with conventional morphological
    assessment (0.62 versus 0.60; P = 0.009). For women aged ≥35 years, AUC values
    were 0.60 for iDAScore and 0.59 for conventional morphological assessment; these
    values were not significantly different.


    To investigate the influence of the number of blastomeres, the AUC values were
    compared between the subgroups <8c and ≥8c for iDAScore and conventional morphological
    assessment. AUC values of 0.67 for iDAScore and 0.56 for conventional morphological
    assessment were found for the <8c group. For the ≥8c group, AUC values were 0.58
    for iDAScore and 0.55 for conventional morphological assessment. AUC values for
    iDAScore were thus significantly greater than those for conventional morphological
    assessment in both the <8c (P < 0.001) and ≥8c groups (P = 0.012).


    # DISCUSSION


    This retrospective study showed that iDAScore Version 2.0 is able to predict FHB
    as well as, or better than, conventional morphological assessment. For transferred
    embryos with the same morphological grade, the FHB rate increased with the increase
    in iDAScore. This suggests that day 3 embryo selection based on iDAScore may achieve
    a higher FHB rate, and is safe and robust compared with conventional morphological
    assessment.


    A significant difference in the quality of transferred embryos was found between
    SET and DET cycles. The majority of transferred embryos in SET cycles were of
    lower morphological quality compared with DET cycles. This may be related to the
    in-house procedure for SET allocation in the study clinic. Although there were
    no differences overall between SET and DET cycles in the observed FHB rate for
    embryos with KID within different iDAScore groups, it should be noted that the
    above analysis was based on embryos with KID, and the actual FHB rates were lower
    when DET cycles with only one FHB were included. However, the model performance
    for embryos with KID did not depend upon whether one or two embryos were selected
    for transfer. Hence, the model could also be used for patient


