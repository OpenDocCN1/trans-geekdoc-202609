  md: 'greater than that for conventional morphological assessment. The number of
    blastomeres may have a greater impact on iDAScore than morphological assessment,
    which is one possible explanation for this result. A higher iDAScore was a better
    predictor of FHB than morphological grade for embryos with fewer blastomeres,
    but it may be challenging for iDAScore to distinguish between embryos with higher
    development potential among embryos with more blastomeres. Thus, it is postulated
    that the number of blastomeres may constitute an important predictor in the iDAScore
    model. iDAScore has been trained to score embryos automatically based on images
    of embryos with KID, and the score is correlated with the likelihood of successful
    implantation. A previous study showed that although iDAScore was not trained to
    assess embryonic development and morphology directly, the model may have learned
    indirectly that the number of blastomeres is important for implantation (Berntsen
    et al., 2022). Thus, iDAScore may use both temporal developmental patterns and
    static morphological information from each image in the time-lapse sequence.


    Extending embryo culture to the blastocyst stage may be a simple way to select
    embryos with higher development potential (Li et al., 2021; Wang et al., 2021).
    However, blastocyst culture may not be necessary or suitable for every patient,
    particularly for patients who may not have blastocysts available for transfer
    on day 5 or day 6. A randomized controlled study conducted by Levi-Setti et al.
    supported a SET policy – even at cleavage stage – for patients aged <39 years
    who produced at least four zygotes (Levi-Setti et al., 2018). Furthermore, elective
    SET has been adopted routinely to minimize the high risk of multiple pregnancy
    in patients with a good prognosis (Practice Committee of the American Society
    for Reproductive Medicine, 2018). For conventional morphological assessment, the
    retrospective FHB rate for day 3 embryo transfer was still acceptable, while the
    FHB rate may have been elevated after introduction of iDAScore Version 2.0. There
    is a need to conduct a well-designed, large, randomized controlled trial comparing
    iDAScore Version 2.0 with conventional morphological assessment for day 3 embryo
    selection in order to confirm the performance of the AI assessment model.


    Strengths of this study include its novelty and the relatively large sample size.
    To the


    best of the authors’ knowledge, this is the first external validation study to
    assess the pregnancy-prediction performance of AI-based day 3 embryo assessment
    compared with conventional morphological assessment. The present analysis included
    a large dataset for external validation of iDAScore Version 2.0, involving 4328
    embryo transfer cycles with a total of 7786 embryos transferred. In addition,
    the embryos transferred in this study were all autologous fresh day 3 embryos
    and not frozen embryos.


    However, the findings are limited by potential confounding due to the retrospective
    nature of the study. Firstly, all analysed embryos were selected based on morphological
    assessment. Although conventional morphological assessment is a widely used grading
    system, it is a subjective method that is susceptible to interobserver variation.
    Secondly, among embryos with the same morphological grade, those with eight blastomeres
    or more were selected for transfer in this study, which could have led to a higher
    AUC value for conventional morphological assessment. Therefore, further external
    validation with larger SET datasets from other centres is needed.


    # CONCLUSIONS


    Objective embryonic assessment employing a completely automatic and annotation-free
    program based on deep learning and time-lapse imaging (i.e. iDAScore Version 2.0)
    performed as well as, or better than, conventional morphological assessment of
    fresh day 3 embryo transfer cycles. iDAScore Version 2.0 may therefore constitute
    a promising tool for selecting day 3 embryos with the highest likelihood of implantation.
    The time required for embryo selection may be reduced considerably by fully automated
    evaluation systems, which can also eliminate subjectivity. Therefore, iDAScore
    can be used as a decision support system to assist embryologists in embryo selection.


