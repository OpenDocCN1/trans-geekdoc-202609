  md: '# # External validation of a model for selecting day 3 embryos for transfer
    based upon deep learning and time-lapse imaging


    ![](img/82ad054bb53b906240826eecb039e07b_0_0.png)


    **BIOGRAPHY**

    Jiahong Zhu graduated from Chongqing Medical University, Chongqing, China. She
    has been engaged in reproductive medicine for more than 8 years at Chongqing Health
    Centre for Women and Children, mainly responsible for embryo selection, and embryo
    freezing and thawing procedures. Her current research interests include artificial
    intelligence in reproductive medicine and embryo evaluation.


    Jiahong Zhu$^{1,2}$, Lihong Wu$^{1,2}$, Junxia Liu$^{1,2}$, Yanfeng Liang$^{1,2}$,
    Jiayi Zou$^{1,2}$, Xiangwei Hao$^{1,2}$, Guoning Huang$^{1,2,*}$, Wei Han$^{1,2,*}$


    **KEY MESSAGE**

    Day 3 embryo selection using iDAScore Version 2.0 is more predictive of implantation
    compared with conventional morphological assessment. A fully automated evaluation
    system may reduce the time taken for embryo selection, eliminate subjectivity,
    and serve as a decision support system to assist embryologists in embryo selection.


    **ABSTRACT**

    **Research question:** Could objective embryo assessment using iDAScore Version
    2.0 perform as well as conventional morphological assessment?


    **Design:** A retrospective cohort study of fresh day 3 embryo transfer cycles
    was conducted at a large reproductive medicine centre. In total, 7786 embryos
    from 4328 cycles with known implantation data were cultured in a time-lapse incubator
    and included in the study. Fetal heartbeat (FHB) rate was analysed retrospectively
    using iDAScore Version 2.0 and conventional morphological assessment associated
    with the transferred embryos. The pregnancy-prediction performance of the two
    assessment methods was compared using area under the curve (AUC) values for predicting
    FHB.


    **Results:** AUC values were significantly higher for iDAScore compared with morphological
    assessment for all cycles (0.62 versus 0.60; $P = 0.005$), single-embryo transfer
    cycles (0.63 versus 0.60; $P = 0.043$) and double-embryo transfer cycles (0.61
    versus 0.59; $P = 0.012$). For the age subgroups, AUC values were significantly
    higher for iDAScore compared with morphological assessment in the <35 years subgroup
    (0.62 versus 0.60; $P = 0.009$); however, no significant difference was found
    in the $\ge$35 years subgroup. In terms of the number of blastomeres, AUC values
    were significantly higher for iDAScore compared with morphological assessment
    for both the <8c subgroup (0.67 versus 0.56; $P < 0.001$) and the $\ge$8c subgroup
    (0.58 versus 0.55; $P = 0.012$).


    **Conclusions:** iDAScore Version 2.0 performed as well as, or better than, conventional
    morphological assessment in fresh day 3 embryo transfer cycles. iDAScore Version
    2.0 may therefore constitute a promising tool for selecting embryos with the highest
    likelihood of implantation.


    +   - Conventional morphological assessment

    +   - Day 3 embryos

    +   - Deep learning

    +   - Objective embryo assessment

    +   - Pregnancy prediction


