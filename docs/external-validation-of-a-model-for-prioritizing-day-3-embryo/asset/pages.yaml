    Previous studies on day 5+ transfers have shown that iDAScore Version 1.0 performed
    as well as, or better than, blastocyst morphological assessment after a single
    vitrified blastocyst transfer (Ueno et al., 2021), and that iDAScore Version 1.0
    was positively correlated with the live birth rate and negatively correlated with
    the abortion rate (Ueno et al., 2022).


    Although the authors in the aforementioned studies used iDAScore Version 1.0,
    which was independently validated in the vitrified blastocyst transfer cycles,
    the results were concordant with the current findings, showing that iDAScore performed
    better than conventional morphological assessment in pregnancy prediction in fresh
    day 3 embryo transfer cycles (as also observed with iDAScore Version 2.0). However,
    the AUC value of 0.62 for fresh day 3 embryo transfer found in this study could
    not be compared directly with previous studies for iDAScore; for example, the
    AUC value of 0.70 reported for Kato Ladies Clinic (Ueno et al., 2021) was based
    on day 5 and day 6 blastocyst transfers. Nevertheless, the lower AUC value should
    not be considered a decline in predictive performance for iDAScore Versions 1.0
    and 2.0, but rather as the result of differences in the specific populations used
    for validation (Kragh et al., 2021). In addition, a lower AUC value for cleavage-stage
    transfer compared with blastocyst transfer was expected due to the availability
    of less information for day 3 embryos compared with embryos after extended incubation.
    In addition, it should


    be noted that, regarding internal validation data, iDAScore Version 2.0 exhibited
    an AUC value of 0.62 for fresh day 3 transfers (Lassen et al., 2022).


    The subgroup analysis by maternal age revealed that FHB prediction performance
    using iDAScore was significantly higher than that using conventional morphological
    assessment in women aged <35 years, but did not differ in women aged ≥35 years.
    This suggests that the selection of embryos using iDAScore Version 2.0 was likely
    to be more beneficial in younger patients. A previous study showed that the best
    embryos morphologically had a 44% euploidy rate, while the worst embryos morphologically
    had a 30% euploidy rate in patients aged <35 years (Munné et al., 2007). In addition,
    day 3 embryo morphology predicted euploidy in women of advanced maternal age but
    not in younger patients, who may have other factors responsible for embryo dysmorphism
    (Moayeri et al., 2008). Thus, morphological assessment has reduced ability to
    select euploid embryos in younger patients, and several good-quality embryos are
    usually obtained in a single oocyte retrieval cycle for these younger patients.
    The present study also showed that embryos with higher iDAScores had higher implantation
    potential among embryos with similar morphological grades. This result suggests
    that performance of iDAScore for the prediction of FHB may be less dependent on
    embryo morphology than conventional morphological assessment in younger patients.
