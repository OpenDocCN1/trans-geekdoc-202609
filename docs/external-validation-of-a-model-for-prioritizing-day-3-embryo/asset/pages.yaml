- pgno: 2
  md: 'grades, analysed by stratification. The pregnancy ranking performances of iDAScore
    Version 2 and conventional morphological assessment were compared using AUC values
    for all cycle groups and for each subgroup (SET, DET, age <35 years, age ≥35 years,
    and number of blastomeres <8 and ≥8c).


    # Controlled ovarian stimulation, fertilization and embryo culture


    The patients underwent controlled ovarian stimulation with a long gonadotropin-releasing
    hormone (GnRH) agonist protocol or a GnRH antagonist protocol according to each
    patient''s ovarian response and medical history of ART treatment. Human chorionic
    gonadotropin (HCG; Ovidrel, Merck Serono, Rome, Italy) was administered when at
    least three dominant preovulatory follicles with mean diameter >18 mm were measured
    ultrasonographically. Oocyte retrieval was performed via the vagina under ultrasonographic
    guidance at 36 h after HCG administration.


    IVF or intracytoplasmic sperm injection (ICSI) insemination was performed according
    to the patient''s condition. IVF was performed 38–39 h after HCG administration
    at a concentration of approximately 10,000 spermatozoa/50-μl droplet. Oocytes
    were denuded of cumulus cells 4–6 h after IVF insemination to evaluate extrusion
    of the second polar body, and the oocytes showing a second polar body were transferred
    to EmbryoScope+ for culture. Alternatively, oocyte denudation was performed 38–39
    h after HCG administration, and ICSI was performed 2 h later. After microinjection,
    all oocytes were cultured individually in the EmbryoScope+ time-lapse incubator
    under 6% CO2 and 5% O2 at 37°C. Embryo culture was conducted using pre-equilibrated
    G-1 culture medium (Vitrolife, Gothenburg, Sweden) until 66–68 h after fertilization.


    Conventional morphological assessment was implemented with a static observation
    on day 3 (68 h) after insemination using the images recorded by the EmbryoViewer
    software (Vitrolife). Conventional morphological assessments of embryos were primarily
    conducted according to the Istanbul consensus report (ALPHA Scientists In Reproductive
    Medicine, ESHRE Special Interest Group Embryology, 2011), and the chief indicators
    included blastomere number, degree of fragmentation, blastomere evenness and


    multinucleation. Morphological assessment was conducted by a team of two embryologists
    with internal quality assurance schemes to confirm consensus in grading. Embryos
    were assigned the following grades: A (embryos with even blastomeres, <10% cytoplasmic
    fragmentation and no multinucleation); B (embryos with even or uneven blastomeres,
    and cytoplasmic fragmentation <25%); C (embryos with even or uneven blastomeres,
    and cytoplasmic fragmentation between 25% and 50%); and D (embryos with even or
    uneven blastomeres, and cytoplasmic fragmentation >50%) (ALPHA Scientists In Reproductive
    Medicine, 2011). Grade D embryos were not transferred during the study period.
    Grade A embryos reflected the highest priority for transfer, followed by Grade
    B and Grade C. For embryos with the same grade, those with eight or more blastomeres
    had highest priority for transfer compared with those with fewer than eight blastomeres.
    Transferred embryos were divided into six groups based on their morphological
    grade and number of blastomeres: A+ (grade A and eight blastomeres or more), A
    (grade A and fewer than eight blastomeres), B+ (grade B and eight blastomeres
    or more), B (grade B and fewer than eight blastomeres), C+ (grade C and eight
    blastomeres or more) and C (grade C and fewer than eight blastomeres).


    The iDAScore AI model was developed using deep learning and a neural network that
    was trained to analyse sequences of time-lapse images (Bernsten et al., 2022).
    The only inputs to the model were the images from the time-lapse sequences, and
    the outputs were numerical scores from 1.0 to 9.9 that correlated with the likelihood
    of an FHB. Therefore, iDAScore did not encompass any human-annotated data for
    training. The images of transferred embryos with KID were thus scored retrospectively
    using iDAScore Version 2.0.


    # Fresh embryo transfer


    During this study, patients received two embryos on day 3 of a fresh cycle, unless
    there was only one transferable embryo or the patient met the indications for
    SET. SET indications were: scarred uterus; history of cervical conization; cervical
    incompetence; history of surgery for severe intrauterine adhesion; uterine malformation;
    history of twin pregnancy; history of obstetric complications; history of chronic
    disease; or women of short stature, underweight or overweight. After


    embryo transfer, the luteal phase was supported by a combination of oestrogen
    and progesterone daily until 12 weeks of pregnancy. The maternal serum β-HCG level
    was measured 14 days after embryo transfer as an indicator of pregnancy. Implantation
    was defined as an intrauterine gestational sac with a FHB noted on transvaginal
    ultrasound 4 weeks after embryo transfer.


    # Statistical analysis


    Continuous quantitative variables are expressed as mean ± SD, and categorical
    data are expressed as percentages. Kolmogorov–Smirnov test was used to assess
    the distribution of data. Student''s t-test was used for continuous data and χ²-test
    was used for categorical data. The ranking performances of iDAScore and conventional
    morphological assessment for predicting FHB were calculated by applying an ROC
    analysis of cluster data (multipredictor comparisons) (Obuchowski, 1997); the
    calculation of AUC values using iDAScore was based on the continuous value. Tests
    for significant differences between AUC values were conducted using the paired
    DeLong''s two-tailed test (DeLong et al., 1988). P < 0.05 was considered to indicate
    significance for all statistical tests, and all analyses were executed using R
    (http://www.r-project.org) and EmpowerStats (www.empowerstats.com), X&Y Solutions,
    Inc., Boston, MA, USA).


    # RESULTS


    # Participant characteristics


    In total, 7786 embryo transfers were analysed in 4328 cycles, comprising 870 SET
    cycles and 3458 DET cycles (TABLE 1). Mean maternal age and the number of previous
    oocyte pick-up stages were significantly lower in DET cycles than SET cycles (P
    < 0.001 and P = 0.019, respectively). Furthermore, the ratio of tubal factor was
    significantly higher in DET cycles than in SET cycles (P < 0.001), whereas combination
    factor and ovulation disorder ratios were significantly lower in DET cycles than
    in SET cycles (P < 0.001 and P < 0.001, respectively). There was no significant
    difference in the mean number of previous embryo transfer cycles and the mean
    number of previous miscarriages between SET and DET cycles.


