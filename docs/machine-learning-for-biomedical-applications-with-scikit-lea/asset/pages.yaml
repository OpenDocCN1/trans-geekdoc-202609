    # ## 11.2.1 Convolutional layers


    In Sect. 11.1.2 we have learned that CNNs are characterized by *local receptive
    fields* and *weight sharing*, which results in a decrease in the number of learnable
    parameters and translation invariance, meaning that the same features are learned
    independent of their location. These characteristics are achieved through the
    *convolutional layers*, which implement convolutions (Fig. 11.2, Eq. (11.1)) to
    model relationships between successive layers of the network. This is in contrast
    to fully connected (linear) layers, which learn independent parameters to connect
    incoming feature to each neuron in the layer.


    # ### Definition of a convolutional layer


    A 2D convolutional layer performs convolutions of multichannel input maps with
    multichannel convolutional kernels. For a feature map $x$ with $C$ channels, a
    convolution operation is defined as


    ```

    $z_{ij} = \sum_{c=1}^{C} \sum_{l=-s}^{s} \sum_{m=-s}^{s} w_{kl}^{c} x_{i+l,j+m}
    + b,$

    ```


    where **w** is a convolutional kernel of size $C \times f \times f$, $f = 2s+1$
    represents the height and width of the kernel, $b$ is a bias term and **z** is
    the 2D output of the convolution operation. *Each 2D convolutional layer* performs
    such convolutions, and their output is defined by the number of the output channels.


    Due to this design, each neuron in a convolutional layer has a restricted receptive
    field, constrained to the dimension $f$ of the filter kernel. This means that
    the output of each neuron is calculated only from a small neighborhood of the
    incoming feature maps, centered around this location (denoted $(i, j)$).


    # ### Parameters of a convolutional layer


    The learnable parameters of a convolutional layer are the filters **w** and biases
    **b**. The number of the learnable parameters depends on the receptive field $f$
    and the number of input and output channels (but not on the spatial dimensions
    of the image).'
  merge: -1
  img_proc: true
