- pgno: 13
  md: '# Preface


    # Machine learning in today''s world


    Machine learning is the process of teaching machines to learn patterns from data.
    Machine learning-powered tools have transformed many industries and are increasingly
    impacting our daily lives. Machine learning underpins diverse facial recognition
    technologies, online streaming, marketing and retail recommendation systems, spam
    filtering, Google''s Text-to-Speech, finance applications including fraud detection,
    and autonomous driving vehicles.


    Machine learning has considerable potential as a power for good in the health-care
    and biomedical field. It can support and improve diagnosis, prognosis, and treatment
    planning. This is important since today''s healthcare systems are increasing patient
    numbers and volumes of data. Complex pattern matching from sources of data, including
    tissue and blood samples, clinical records, genetics, and imaging has the potential
    to improve diagnosis, and even help us understand a disease and its biological
    mechanisms, potentially leading to new and better treatments. For example, from
    MRI scans, machine learning can automatically predict whether a baby is pregnant
    [18], detect lesions [31] and recognize signs of Alzheimer disease [1]. It can
    also identify heart failure from cardiac MRI [36], help correct breathing patterns
    in abdominal MRI to enable better visualization of abdominal organs [8] and diagnose
    cancer from histological images [14,48].


    # The aims of this book


    As we observe the increasing impact of machine learning in healthcare and biomedicine,
    we feel that it is important to offer accessible machine learning teaching for
    students interested in the biomedical field and for experts who want to gain skills
    in machine learning. We aim to provide a step-by-step guided approach with the
    right mix of theory and practical skills, starting with basic coding skills and
    leading to confident implementation of state-of-the-art deep learning at the end
    of the book.


    Our choice is to spend a considerable amount of time on classical machine learning
    rather than starting immediately with deep learning systems from ours to design
    an effective pedagogical approach that will build understanding, knowledge and
    practical skills based on thorough foundations. This way, we aim to make the state-of-the-art
    deep learning accessible to a reader with a limited background in mathematics
    and computing. For example, did you know that classical logistic regression covered
    in Chap. 4 is a special case of the neural network classifier with a single artificial
    neuron? Or'
  merge: -1
  img_proc: true
- pgno: 14
  md: "# Preface\n\ndid you know that ensembles (Chap. 7) of deep neural networks\
    \ provide not only stateof-the-art segmentation performance [24], but also alert\
    \ us when the model provided an unreliable result [27]? In addition to there are\
    \ still many problems for simpler machine learning models provide more efficient\
    \ and reliable solutions. Nevertheless, you will also build solid skills in deep\
    \ learning, and after reading this book, you will be able to choose the best approach\
    \ to solve your biomedical problem.\n\nWe have selected Python, Scikit-learn [34]\
    \ and Pytorch [33] for implementation of the machine learning techniques presented\
    \ in this book. This practical machine learning tools are by far the most popular\
    \ in both academia and industry and should be part of the skill set of every aspiring\
    \ data scientist or deep learning practitioner. We hope you enjoy reading this\
    \ book and building your machine learning skills with us!\n\n# Learning objectives\n\
    \nOn completion of this book you will have gained:\n\n+   - a thorough grounding\
    \ in the fundamental principles of machine learning and its role in biomedical\
    \ data analysis;\n- an in-depth theoretical understanding of a variety of machine\
    \ learning techniques to ensure confident selection of suitable solutions to real-world\
    \ biomedical problems;\n- applied data-science skills to implement new solutions\
    \ including\n  - training in Python, Scikit-learn and PyTorch API\n  - model selection,\
    \ evaluation and troubleshooting\n  - best practice implementation and generalization\
    \ to new data;\n- the ability to integrate theory with practice by applying machine\
    \ learning techniques to authentic biomedical problems.\n\n# How to use this book\n\
    \nThe book can be used for self-study, or as a companion for a standard undergraduate\
    \ or postgraduate course in machine learning. Each chapter provides theoretical\
    \ insights and principles illustrated with biomedical examples implemented in\
    \ Python, Scikitlearn or PyTorch. We also provide implementations from scratch\
    \ for several important concepts to reinforce and deepen the understanding of\
    \ the machine learning techniques. Each section of the book ends with a set of\
    \ theoretical revision questions and practical exercises.\n\nEach chapter is accompanied\
    \ by interactive Python Notebooks, available from github.com/MachineLearningBiomedicalApplications/notebooks.\
    \ The notebooks provide practical tutorials, activities and skeleton code for\
    \ the practical exercises given at the end of each section. Selected notebooks\
    \ are also available."
  merge: -1
  img_proc: true
- pgno: 15
  md: 'The book consists of 11 chapters. The first two chapters, aimed at complete
    beginners, explain basic programming and machine learning concepts and provide
    a practical Python and Scikit-learn tutorial. Chapters 3–8 focus on in-depth description
    of essential machine learning techniques, including popular Support Vector Machines
    and Random Forests. The last three chapters introduce the state-of-the-art deep
    learning concepts, and provide Porch tutorial alongside the theoretical understanding.
    The final chapters are aimed at more advanced reader in programming and classic
    machine learning. We recommend the readers interested primarily in deep learning
    to work through the first chapters to acquire basic machine learning knowledge
    (perhaps skipping kernel trick and support vector classifier) and then move to
    Chapter 9 on Deep Learning. The detailed content of the individual chapters are
    listed below:


    +   - Chapter 1—Programming in Python: This chapter provides a Python tutorial
    for beginners, including Python packages Numpy, Matplotlib for plotting and Pandas
    for data handling. We also introduce the reader to Python Notebooks and provide
    instructions for installation of the Anaconda software package.


    +   - Chapter 2—Machine learning bases: We introduce basic machine learning concepts,
    provide Scikit-learn tutorial and teach the reader how to train and evaluate machine
    learning models.


    +   - Chapter 3—Regression: We introduce the mathematical foundations of multivariate,
    linear and penalized regression. We also demonstrate the problem of overfitting
    with an example of predicting the age of a baby from brain volumes extracted from
    MRI scans. We introduce the kernel trick. The chapter covers Ridge, Lasso and
    Kernel Ridge regression techniques.


    +   - Chapter 4—Classification: This chapter provides the mathematical foundations
    of linear and nonlinear classification. We focus on two popular classifiers, Logistic
    Regression and the Support Vector Classifier. We introduce the kernel trick for
    classification. We demonstrate these concepts with an example of predicting heart
    failure using the features extracted from cardiac MRI, ultrasound and ECG.


    +   - Chapter 5—Dimensionality reduction: We introduce linear and nonlinear dimensionality
    reduction methods, including Principal Component Analysis, Independent Component
    Analysis, and Laplacian Eigenmaps. We show how we can prevent overfitting in prediction
    of the age of a baby from volumes of brain structures by reducing features using
    PCA.


    +   - Chapter 6—Clustering: In this chapter we describe key clustering algorithms
    for linear and nonlinear problems. The techniques covered include K-means, Gaussian
    Mixture Model and Spectral Clustering. We demonstrate these techniques on the
    segmentation of brain tissues in MRI and clustering of whole MRI images of term
    and preterm babies.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '+   Chapter 7—Ensemble learning: In this chapter we introduce Decision Trees.
    We explain concepts of bagging, and bootstrapping. We introduce Random Forests
    and Adaboost.


    +   Chapter 8—Feature selection and extraction: In this chapter we describe key
    techniques to extract salient features from biomedical signals and images. We
    will then show how to select the best features for machine learning models.


    +   Chapter 9—Deep learning basics: We introduce the basic building blocks of
    Neural Networks, including the Artificial Neuron and Single-layer Perceptron.
    We cover activation functions, loss functions for regression and classification,
    and training of single-layer neural network models. We provide a PyTorch tutorial
    and implement neural network regression and classification examples in PyTorch.


    +   Chapter 10—Fully connected neural networks: We describe how multiple linear
    layers and nonlinear activation functions are combined to create a Multilayer
    Perceptron, with the simplest example of a Deep Neural Network. We cover training
    of Neural Networks using backpropagation. We show a complete PyTorch deep learning
    solution for a real-world biological problem to predict the age of the baby from
    structural connectivity.


    +   Chapter 11—Convolutional neural networks: In this chapter we describe a more
    advanced deep learning architecture, the Convolutional Neural Network. We show
    how to predict prematurity of a baby directly from the MRI images. Finally, we
    present an example of segmentation of neonatal brain MRI into anatomical regions
    using U-Net architecture, while demonstrating how to handle large datasets in
    PyTorch.


    # Prerequisites


    This book provides self-contained material that will take a beginner in machine
    learning from learning the basic Python commands, through understanding of classical
    machine learning techniques and implementing them in Scikit-learn, all the ways
    towards the state-of-the-art deep learning in PyTorch. However, the knowledge
    of basic programming principles in any programming language, as well as the basic
    linear algebra, calculus and probability theory, will allow the reader to fully
    absorb the materials in this book and gain in-depth understanding and confidence.
    For readers with no programming background we recommend to complement this book
    with one of the popular online courses or books on Python for beginners.


