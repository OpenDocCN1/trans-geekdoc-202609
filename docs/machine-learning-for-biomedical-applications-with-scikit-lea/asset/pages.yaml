    # 2.2.4 Dimensionality reduction in scikit-learn


    We will look at principal component analysis (PCA) as an example of a dimensionality-reduction
    method. PCA seeks to find a predefined number of orthogonal directions, along
    which the data has the greatest variance. It orders these components according
    to the variance size and creates an orthonormal coordinate transformation to project
    the original feature vectors to the reduced dimensional subspace that preserves
    the most variance in the data. It is therefore considered a transformation, and
    PCA is a transformer object in sklearn.


