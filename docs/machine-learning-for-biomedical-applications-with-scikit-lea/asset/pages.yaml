  md: '# 9.2.3 Autograd


    An important feature of PyTorch is that it offers automatic differentiation to
    enable training of neural networks. If a tensor stores parameters that we want
    to learn, we can set the tensor attribute requires_grad to True:


    ```

    a = torch.tensor([[1.0, 2.0]), requires_grad=True)

    ```


    Let’s say that we want to minimize the sum of squares of the tensor a, mathematically
    written as


    $L(a_1, a_2) = a_1^2 + a_2^2$.


    This can be implemented as


    ```

    b=a**2

    loss=b.backward()

    ```


    If we now call the function loss.backward(), PyTorch will calculate the gradients


    $$\left[\frac{\partial L}{\partial a_1}, \frac{\partial L}{\partial a_2}\right]
    = \left[\frac{\partial(a_1^2+a_2^2)}{\partial a_1}, \frac{\partial(a_1^2+a_2^2)}{\partial
    a_2}\right] = [2a_1, 2a_2].$


    Because we have $[a_1, a_2] = [1, 2]$ the gradients will be $[2, 4]$. Let’s test
    it in PyTorch:


    ```

    loss.backward()

    print(a.grad)

    >>> tensor([2., 4.])

    ```


    PyTorch does automatic differentiation by creating a computational graph, shown
    for our example in Fig: 9.3. Top: tensors b and loss are created, PyTorch automatically
    creates functions grad_fn that calculate the gradients during the backward pass:


    ```

    print(''b: '', b)

    print(''loss: '', loss)

    >>> b: tensor([1., 4.]), grad_fn=<Backward0>\n>>> loss: tensor(5.), grad_fn=<SumBackward0>)

    ```


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_218_0.png)


    **Figure 9.3** Automatic differentiation in PyTorch (Autograd). Top: computational
    graph. Bottom: computation of the gradients during the backward pass.'
  merge: -1
  img_proc: true
