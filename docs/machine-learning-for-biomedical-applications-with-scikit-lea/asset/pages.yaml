    # 10.3. Predicting age from brain connectivity using deep learning


    In this section we will show, using a real-world example, how we can use a fully
    connected neural network to predict the age of a newborn from structural connectivity.^2
    Magnetic resonance imaging can reveal white tracts in the brain, by measuring
    how the water diffuses in the brain. The molecules are able to travel along the
    white fibers, but not across them. We can measure the degree of water diffusion
    and then track its path along the white matter tracts, as shown in Fig. 10.4.^3
    We can also track the fibers between two particular regions of the brain and calculate
    how strongly they are connected. This gives rise to the structural connectivity
    matrices^4 shown in Fig. 10.5 [45].


    # 10.3.1. Neonatal structural connectivity dataset


    **Structural connectivity matrices** contain a measure of connectivity between
    pairs of brain regions. There are 90 regions and matrices have 90 x 90 values.
    They are symmetric and zeros on the diagonal (the connectivity of a region which
    itself is not meaningful). Our dataset consists of a connectivity matrix for each
    baby, together with information about their age at scan. We will predict age at
    scan from the matrices using a fully connected neural network.


    The dataset is provided in these files:


    +   * matrices_train.p—the connectivity matrices of the training set;

    * subject_info_train.csv—age at scan for the training set;

    * matrices_test.p—the connectivity matrices of the test set;

    * subject_info_test.csv—age at scan for the test set.


    ^1 The skeleton code is available from github.com/MachineLearningBiomedicalApplications/notebook.

    2 Data from Developing Human Connectome project (developingconnectome.org).

    3 The image was captured in MRtrix by Dr Maximilian Pietch.

    4 The connectivity matrices were calculated by Dr Dafniss Batalle.'
