    # 3.2. Penalized regression


    In the previous section we saw that fitting multivariate linear regression to
    datasets with large number of features but limited number of samples can be problematic.
    However, such datasets are common in biomedical applications. In this section
    we will describe one of the approaches to tackle this problem called regularization.
    Regularized regression algorithms seek to fit the model to the training data,
    while also penalizing weights to prevent overfitting to noise. In this section
    we will describe two common penalized regression techniques, ridge in Sect. 3.2.1
    and lasso in Sect. 3.2.2. We will compare them in Sect. 3.2.3.


    # 3.2.1 Ridge regression


    Ridge penalty seeks to minimize the weight vector w by penalizing its squared
    $L_2$ norm


    ```

    $|w||_2^2 = \sum_{k=0}^{D} w_k^2$

    ```


    In the context of linear regression, the ridge penalty adds as an extra term to
    the loss function


    ```

    $L(w) = \frac{1}{2} \sum_{i=1}^{N} (y_i - \sum_{k=1}^{D} w_k X_{ik} - w_0)^2 +
    \frac{\lambda}{2} \sum_{k=0}^{D} w_k^2. \quad (3.10)

    ```


    The hyperparameter $\lambda$ defines the weight of the ridge penalty and is usually
    determined using cross-validation, see Fig. 3.4. In general, if a dataset is prone
    to overfitting, the ridge regression will require higher $\lambda$. For datasets
    with different number of samples, a lower $\lambda$ is required.


    To formulate the ridge regression problem in a matrix form, we will expand Eq.
    (3.5) by the ridge penalty


    ```

    $L(w) = \frac{1}{2}(y - \mathbf{X}w)^T(y - \mathbf{X}w) + \frac{\lambda}{2}\mathbf{w}^T\mathbf{w}.
    \quad (3.11)

    ```


    The solution that minimizes the loss function $F(w)$


    ```

    $$\hat{\mathbf{w}} = (\mathbf{X}^T\mathbf{X} + \lambda\mathbf{I})^{-1}(\mathbf{X}^T\mathbf{y}).
    \quad (3.12)

    ```


    where $\mathbf{I}$ is an identity matrix. The gradient descent solution for the
    ridge regression is


    ```

    $$\hat{\mathbf{w}}^{(n+1)} = \hat{\mathbf{w}}^{(n)} + \eta(\mathbf{X}^T(\mathbf{y}
    - \hat{\mathbf{w}}^{(n)}) - \lambda\hat{\mathbf{w}}^{(n)}). \quad (3.13)

    ```'
  merge: -1
  img_proc: true
