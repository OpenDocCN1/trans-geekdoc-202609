    # ## 5.3. Linear transforms


    Before we consider nonlinear manifolds, let us start by considering linear embeddings
    constructed from linear transforms. Mathematically, a linear transform is a function
    that satisfies the properties of additivity and scalar multiplication, while preserving
    the origin


    +   additivity: $T(\mathbf{x}_1 + \mathbf{x}_2) = T(\mathbf{x}_1) + T(\mathbf{x}_2)$
    (5.1)

    scalar multiplicity: $T(\alpha\mathbf{x}) = \alpha T(\mathbf{x})$ (5.2)


    In simple terms, this means that linear transforms preserve the linear properties
    of the vector space. In other words, they map data points from one Euclidean domain
    to Euclidean subspace. Practically, the action of any matrix on a vector is a
    linear transform. For example, the action of $\mathbf{A} = \begin{pmatrix} 3 &
    0 \ 0 & 1 \end{pmatrix}$ represents a scale along the x-axis by a factor of 3
    (see Fig. 5.3), as follows:


