- pgno: 179
  md: "Once the tree is trained, a label is assigned to each leaf node, based on the\
    \ labels of the training examples that reach that leaf. For classification, this\
    \ equates to the class of the most common training label within that leaf; for\
    \ regression, the leaf values is derived from some function of the data (such\
    \ as the mean). Testing is then performed by passing unseen examples through the\
    \ tree, using the stored thresholds and features at each node to decide which\
    \ branches the test examples pass down. The final prediction, for each test example,\
    \ is then obtained by assigning the values stored at each leaf.\n\n# 7.1.5 Decision\
    \ trees with scikit-learn\n\nTo implement decision trees in scikit-learn, you\
    \ may implement either DecisionTreeClassifier or DecisionTreeRegressor. With all\
    \ scikit-learn supervised learning models, you de take a data matrix $X$, of shape\
    \ $N$ (examples) $\times M$ (features), and a matrix $y$, of length $N$:\n\n```\n\
    from sklearn.tree import DecisionTreeClassifier\nclassifier = DecisionTreeClassifier()\n\
    classifier.fit(X,y) # here y stores classes\n```\n\n```\nfrom sklearn.tree import\
    \ DecisionTreeRegressor\nregressor = DecisionTreeRegressor()\nregressor.fit(X,y)\
    \ # here y stores continuous values\n```\n\nIn addition to the default constructors\
    \ (as shown), scikit-learn offers a range of tunable parameters including: the\
    \ `criterion` argument, which tunes the choice of learning rule; and a selection\
    \ of parameters designed to control overfitting including: `max_depth`, which\
    \ limits total tree depth; `min_samples_split` and `min_samples_leaf`, which control\
    \ the minimum number of training examples allowed for internal nodes and leaf\
    \ nodes, respectively; `max_features`, which limits the choice of features available\
    \ for each decision to a subset of the total (where this is important for training\
    \ forests, Sect. 7.2.5). Finally, `ccp_alpha` allows pruning of terminal nodes\
    \ that do not fit noise to improve the quality of the prediction.\n\n# 7.2. Ensemble\
    \ learning\n\nDecision trees make for highly intuitive learning models; they are\
    \ prone to overfitting, the deeper the tree, the more nonlinear the model and\
    \ the greater chance of fitting to noise. While this may be addressed through\
    \ judicious choice of hyperparameters, further gains may be achieved by enrolling\
    \ (combining) predictions across a large number of trees. As we will see in this\
    \ section, ensembles can improve the generalization of predictions by averaging\
    \ away isolated errors."
