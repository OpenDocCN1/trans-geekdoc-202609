  md: 'The decision boundary is defined by the decision function being equal to zero
    $h(\mathbf{x})=0$. The binary labels $\hat{y}$ are based on the sign of the decision
    function: If the value of the decision function is positive or zero, the predicted
    label is 1. If the value of the decision function is negative, the predicted label
