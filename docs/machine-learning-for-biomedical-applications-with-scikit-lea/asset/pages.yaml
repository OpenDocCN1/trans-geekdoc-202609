- pgno: 113
  md: '# Sensitivity and specificity


    The problem with the accuracy score for unbalanced binary dataset can be resolved
    by calculating the proportion of correctly labeled positive and negative samples,
    separately. Sensitivity, also called recall, is the proportion of correctly labeled
    positive samples (e.g., samples with label 1). In scikit-learn it can be evaluated
    using the function recall_score


    ```

    from sklearn.metrics import recall_score

    y_pred_test = model.predict(X_test)

    sensitivity = recall_score(y_test, y_pred_test)

    ```


    Specificity, on the other hand, is the proportion of correctly labeled negative
    samples (e.g., samples with label 0). It is actually identical to the recall score
    for the negative label. In scikit-learn we can also use recall_score to calculate
    specificity, by setting the positive label to 0


    ```

    specificity = recall_score(y_test, y_pred_test,

    pos_label=0)

    ```


    Sensitivity and specificity measures can only be applied to binary classifiers.
    We can generalize sensitivity (recall) to multi-label classification by setting
    a chosen class as positive and all the other labels as negative. We can calculate
    the mean recall over all the classes by setting parameter average=''macro''


    ```

    mean_recall = recall_score(y_test, y_pred_test,

    average=''macro'')

    ```


    Similarly, we can also calculate these measures using cross-validation on the
    training set by first predicting the labels using cross_val_predict and then applying
    the recall_score


    ```

    from sklearn.model_selection import cross_val_predict

    y_pred_train = cross_val_predict(model, X_train,

    y_train)

    sensitivity = recall_score(y_train, y_pred_train)

    specificity = recall_score(y_train, y_pred_train,

    pos_label=0)

    mean_recall = recall_score(y_train, y_pred_train,

    average=''macro'')

    ```


    ```

    print(''Sensitivity: '', round(sensitivity,2))

    print(''Specificity: '', round(specificity,2))

    print(''Mean Recall: '', round(mean_recall,2))

    >>> Sensitivity: 0.92

    >>> Specificity: 0.98

    >>> Mean Recall: 0.95

    ```'
