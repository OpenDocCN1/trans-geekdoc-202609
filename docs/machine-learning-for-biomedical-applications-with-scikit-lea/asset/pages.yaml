    \    mysum=0\n    for val in x:\n        mysum+=val\n    return mysum\n```\n\n\
    mylist=[1,2,3,4,5]\n\n```\nsumlist1=arbitrary_sum(*mylist)\n@ returns same result\
    \ as\nsumlist2=arbitrary_sum(1,2,3,4,5)\n```\n\n# 1.7.1 Docstrings\n\nWhen writing\
    \ code that includes functions, it is good practice to document the purpose of\
    \ the function using a 'doc' string after the function definition, indicated by\
    \ triple quotes.\n\n```\ndef arbitrary_sum(*x):\n    \"\"\"\n    This function\
    \ adds and arbitrary number of input arguments\n\n    input args:\n        *x:\
    \ a list or tuple containing numbers to be summed\n\n    returns:\n        mysum:\
    \ result of adding all input arguments\n    \"\"\n```\n\n```\nmysum=0\nfor val\
    \ in x:\n    mysum+=val\n    return mysum\n```\n\n# 1.7.2 Passing by object\n\n\
    In C++ you may have heard the terms 'pass by value' or 'pass by reference' with\
    \ respect to how arguments are passed to functions. This references how variables\
    \ are either copied to a new place in memory when they are passed to a function\
    \ (pass by value) or"
