- pgno: 233
  md: '# Fully connected neural networks


    $$a_k^{(l)} = fi(z_k^{(l)}), \quad k = 1, \dots, D_l.$$

    (10.2)


    Note that the layer $l$ needs to have the same number of outputs $D_{l-1}$ as
    the number of outputs of the layer $l-1$. Inputs of the first layer $l=1$ are
    the inputs $x_i$. The outputs of the last layer will depend on the type of the
    neural network model. If it is a regressor, we will have an identity activation,
    and the outputs will be the predicted target values $\hat{y}_k$. If it is a classifier,
    we will have a sigmoid or softmax activation, and the outputs will be predicted
    probabilities $\hat{p}_k$ for each class.


    # 10.1.3 Activation functions


    We have already introduced several activation functions (identity, Heaviside,
    sigmoid and softmax)—see Fig.9.2. These functions are most useful after the final
    linear layer of the neural network to design regressors and classifiers.


    The most common activation function placed between the successive layers of the
    neural network is a Rectified Linear Unit (ReLU), shown in Fig. 10.3. Because
    this is a piece-wise linear function, the resulting function is represented by
    the whole neural network will also be piece-wise linear, as shown in Fig. 10.2.
    While this function is very simple, combining multiple layers of neurons modeling
    of very complex piece-wise linear functions can approximate a function of any
    complexity, given a large enough number of artificial neurons.


    The popularity of ReLU is partly due to its efficient computation. However, it
    can introduce a vanishing gradient problem, because, once the value $z_i^l$ turns
    negative, the gradient will become zero and the neuron will stop being active.
    This problem has been addressed by introducing a Leaky ReLU (Fig. 10.3, middle),
    which has a small gradient for the negative values and neurons will not die.


    An alternative nonlinear activation function is Tanh (Fig. 10.3, right), which
    produces nonlinear functions (see Fig. 10.2, right). Unlike Leaky ReLU, the Tanh
    activation also suffers from vanishing gradients for large negative and positive
    values.


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_233_0.png)


    **Figure 10.3** Activation functions $f(z)$. Left: Rectified linear unit (ReLU).
    Middle: Leaky ReLU. Right: Tanh.'
