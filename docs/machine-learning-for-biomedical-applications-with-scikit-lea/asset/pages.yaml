  md: '# 5.7. Laplacian eigenmaps


    In essence, a manifold is a topological space for which Euclidean distances are
    only meaningful locally. Thus, one way is to construct a k-Nearest Neighbor (kNN)
    graph, which connects each point with its k closest points by Euclidean distance.
    In this way, geodesics along the manifold may be approximated by stepping from
    neighbour to neighbour, and summing the Euclidean distances between them. Fig.
    5.15 shows a toy example for a simple oscillating 1D function.


    Thus, Laplacian eigenmaps work by constructing and binarizing a k-NN graph, otherwise
    known as adjacency matrix A. This is then used to calculate the graph Laplacian:
    L = D - A, where D is the degree matrix calculated by summing the total number
    of neighbors of each node (Di = Σ Aij). This represents a discrete approximation
    of the Laplace operator, whose eigenvectors represent the spectra (or harmonics)
    of the graph. One way to intuitively understand the links between the eigenvectors
    of the graph Laplacian and the geodesics across the surface of a manifold is to
    understand that the roots of the Laplacian represent equilibrium solutions for
    diffusion of some quantum across the graph. As, the eigenvectors corresponding
    to the smallest nonzero eigenvalues reflect a random walk across the manifold,
    such that points having similar values in the eigenvector space must also be close
    together on the manifold. In this way, it is possible to use the eigenvectors
    of the graph Laplacian to ‘unwrap’ the manifold into a lower-dimensional Euclidean
    space.


    # 5.7.1 Calculation of the graph Laplacian


    Estimation of the graph Laplacian may be broken down into the following steps:


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_148_0.png)'
  merge: -1
  img_proc: true
