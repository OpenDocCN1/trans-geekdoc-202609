    # 5.5. Independent component analysis


    In contrast PCA which searches for a coordinate basis that aligns with the main
    sources of variance in the data, Independent Component Analysis (ICA) searches
    for a basis whose eigenvectors are maximally independent. A famous use of ICA
    is in the ‘cocktail party problem’, where the objective is to unmix sound recordings
    from various sources (e.g., microphone recordings at locations in a crowded room
    of people speaking). In medical applications, ICA is commonly applied to electrophysiological
    or functional brain recordings.


    # 5.5.1. Statistical independence


    To fully what it means to extract ‘independent’ signals, we must first revise
    probability theory. Consider the table shown in Fig. 5.9. This simulates the outcome
    of a survey of 100 people. Here, participants were asked whether they were suffering
    from any of the following illnesses: Cancer (C), Heart disease (H), Diabetes (D),
    Mental health illness (M), or none of the above (N). The responses were grouped
    by age bracket (< 20 years, 20–40 years, 40–60 years, 60–80 years, > 80 years).
    The sum of all values in the table adds up to 100.'
