- pgno: 162
  md: 'We can minimize the log-likelihood by setting the derivatives with respect
    to the Gaussian mixture models to zero, and this way we will arrive at a two-step
    iterative algorithm. In the first step we calculate the posterior probabilities
    $p_k = p(k|x_i, \phi)$, which are in fact probabilistic segmentations for individual
    tissues (Fig. 6.3):


    ```

    $p_k = \frac{\pi_k G(x, \mu_k, \sigma_k^2)}{\sum_{i=1}^N \pi_i G(x, \mu_i, \sigma_i^2)}$

    ```


    In the second step we update GMM parameters $\phi$


    ```

    $$\mu_k = \frac{\sum_{i=1}^N \pi_i x_i}{\sum_{i=1}^N \pi_i}, \quad \sigma_k^2
    = \frac{\sum_{i=1}^N \pi_i (x_i - \mu_k)^2}{\sum_{i=1}^N \pi_i}, \quad c_k = \frac{\sum_{i=1}^N
    \pi_i}{N}$

    ```


    The algorithm iterates between these two steps until the change in the log-likelihood
    (En. (6.6)) is below a specified threshold.


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_162_0.png)


    > Figure 6.3 Probabilistic segmentation $p_{ik} = p(y_i = k|x_i, \phi)$ in GMM
