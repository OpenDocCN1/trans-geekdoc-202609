    # 2.2. Starting with scikit-learn


    Scikit-learn is a Python library of machine learning algorithms integrated with
    Python packages as Numpy, Matplotlib, and Pandas. It is very intuitive and easy
    to use. The library can be accessed from Python by importing the module sklearn.

    in this section we introduce four types of objects available in scikit-learn:
    regressor, classifier, clusterer, and transformer, which implement various machine
    learning algorithms. Scikit-learn offers a user-friendly application interface
    (API) that requires these objects to implement a set of standard methods to access
    the machine learning algorithms. We list the most important ones:


    +   - fit implements fitting the mathematical model f (Eq. 2.3) to the training
    data composed of feature matrix X (Eq. 2.1) and for regressors and classifiers,
    also an output vector y (Eq. 2.2);


    +   - predict implements prediction of output vector y (Eq. 2.3) for regressors,
    classifiers, and clusters;


    +   - transform implements feature transformation (Eq. 2.3) for transformers;


    +   - fit_transform fits the models and transforms the feature vector for transformers;


    +   - score implements an evaluation metric.


    In the remainder of this section, we will implement examples of each of the algorithms.
    The datasets and the notebook with the code for this section can be loaded from
    github.com/MachineLearningBiomedicalApplications/notebooks. They are located in
    the folder Chapter 2 - Starting with Scikit-learn.


