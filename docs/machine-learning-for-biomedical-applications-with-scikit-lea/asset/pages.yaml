- pgno: 225
  md: '# 9.3. Single-layer perceptron


    A single-layer perceptron consists of multiple neurons organized in one layer.
    These neurons share the same input features, but each of them produces a different
    output, as illustrated in Fig. 9.5.


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_225_0.png)


    Figure 9.5 A single-layer perceptron consisting of three artificial neurons and
    three outputs. Each neuron $k$ is mathematically defined as $\hat{y}_k = f(z_k),
    z_k = \sum_j w_{jk}x_j$. For simplicity, the individual weights have been dropped
    from the diagram as compared to the diagram of the artificial neuron in Fig. 9.1.


    The multi-output single-layer perceptron model can be mathematically written as


    $z_k = \sum_{j=0}^D w_{jk}x_j \quad (9.9)$


    $\hat{y}_k = f(z_k), \quad k = 1, \dots, K \quad (9.10)$


    where the neuron $k$ has the weight vector $(w_{1k}, \dots, w_{Dk})^T$ and the
    output $\hat{y}_k$. Eq. (9.9) can be conveniently written in a matrix formulation
    as


    $\mathbf{z} = \mathbf{Wx}, \quad (9.11)$


    where the matrix $\mathbf{W}$ with shape $K \times (D+1)$ represents the weights
    of the neurons, $K$ is the number of outputs in the output vector $\mathbf{\hat{y}}
    =(\hat{y}_1, \dots, \hat{y}_K)^T$, and $D$ is the number of input features arranged
    in the feature vector $\mathbf{x} = (x_1, \dots, x_D)$. Eq. (9.11) represents
    one **linear layer**, also called a **fully connected layer**, as all inputs contribute
    to all outputs. The linear layer with $D$ inputs and $K$ outputs (Eq. (9.11))
    is implemented in PyTorch as


    ```

    torch.nn.Linear(D, K)

    ```


    Each output of the linear layer $z_k$ is passed through the same activation function
    $f$ (Eq. (9.10)) to obtain $\hat{y}_k$.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 9.3.1 Training the single-layer perceptron


    The training is performed using the forward and backward pass, similarly to the
    artificial neuron explained in Sect. 9.1.2. In the forward pass we evaluate the
    predicted output vector $\hat{y}$ using


    ```

    $$\hat{y}_{ik}^{(n)} = f\left(\sum_{j=1}^{D} w_{jk}^{(n)} x_{ij}\right) \quad
    (9.12)$

    ```


    and in the backward pass we update the weights according to


    ```

    $w_{jk}^{(n+1)} = w_{jk}^{(n)} - \frac{\partial L}(\mathbf{W}^{(n)})}{\partial
    w_{jk}^{(n)}} \quad (9.13)$

    ```


    Equations are direct extensions of Eqs. (9.5) and (9.6).


    # 9.3.2 Multi-label classification


    An important application of the single-layer perceptron is multi-label linear
    classification, such as *multinomial logistic regression* (Sect. 4.1.4). By fitting
    a single decision function $h$ to the training data, we can perform binary classification.
    We need multiple decision functions $h_k$ (Eq. 4.3) to perform multi-label classification.
    Each of these decision functions corresponds to one artificial neuron, with $z_k
    = h_k$.


    The activation function for multinomial logistic regression is **softmax** defined
    as


    ```

    $$\hat{p}_k = \frac{e^{z_k}}{\sum_{j=1}^K e^{z_j}}$

    ```


    Note softmax is different from the other activation functions because it uses
    all the linear-layer outputs $z_j, j=1, \dots, K$ to calculate the output class
    probabilities $\hat{p}_k$. This is visualized in Fig. 9.6.,


    We have discussed in Sect. 4.1.4 that multinomial logistic regression is optimized
    using the **cross-entropy loss**


    ```

    $-\sum_{i=1}^N \sum_{k=1}^K y_{ik} \ln p_k(\mathbf{x}_i)$

    ```


    where the labels $y_i$ have to be converted to **one-hot vectors** $(y_{i1}, \dots,
    y_{iK})^T$ where $y_{ik}$ is 1 if $y_i=k$ and zero otherwise. This way can be
    related to predicted probability vectors $(p_1(\mathbf{x}_i))^T$ where $\mathbf{x}_i
    = (x_{i1}, \dots, x_{iD})^T$ is the feature vector of a training'
