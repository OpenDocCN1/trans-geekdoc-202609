    The parameters $\mathbf{w}_k$ for each class-dependent decision function are found
    by minimizing the *cross-entropy*


    ```

    $$- \sum_{i=1}^N \sum_{k=1}^K y_{ik} \ln p_k(\mathbf{x}_i)$

