  md: '$(\mathbf{A} - \lambda\mathbf{I})\mathbf{v} = 0.$


    We enforce that $\mathbf{v}$ must be nonzero. This means that $(\mathbf{A} - \lambda\mathbf{I})$
    must be singular, with the determinant equal to zero


    $|\mathbf{A} - \lambda\mathbf{I}| = 0.$


    This expression is known as the *characteristic equation*.


    # Matrix determinant


    A determinant is a scalar value, derived as a function of a matrix, that is nonzero
    only if the matrix is invertible and represents an isomorphic transformation (one-to-one)
    such that all points in the original domain are mapped to exactly one location
    in the second domain. For a $2 \times 2$ matrix $\mathbf{B} = \begin{pmatrix}
    a & b \ c & d \end{pmatrix}$, the matrix determinant may be estimated as:


    $det\mathbf{B} = |\mathbf{B}| = ad - bc.$


    # Example: eigenvector calculation


    To estimate the eigenvectors and eigenvalues of the horizontal scaling operation
    $\mathbf{A} = \begin{pmatrix} 3 & 0 \ 0 & 1 \end{pmatrix}$, first substitute for
    $\mathbf{A}$ in the characteristic equation and calculate the determinant


    $|\mathbf{A} - \lambda\mathbf{I}| = |\begin{pmatrix} 3 & 0 \ 0 & 1 \end{pmatrix}
    - \lambda \begin{pmatrix} 1 & 0 \ 0 & 1 \end{pmatrix}|,$


    $= \begin{pmatrix} 3-\lambda & 0 \ 0 & 1-\lambda \end{pmatrix}| = 0,$


    $= (3-\lambda)(1-\lambda) = 0.$


    This tells us that the solutions (roots) are $(3-\lambda) = 0$ and $(1-\lambda)
    = 0$; thus, the eigenvectors of $\mathbf{A}$ are $\lambda_1 = 3$ and $\lambda_2
    = 1$. Now, estimate the eigenvectors by substituting into Eq. (5.8) for $\lambda$,
    starting with $\lambda = 3$


    $$\begin{pmatrix} 3-3 & 0 \ 0 & 1-3 \end{pmatrix} \begin{pmatrix} \nu_1 \ \nu_2
    \end{pmatrix} = 0.$


    Multiplied out this gives


    +   $\rightarrow 0\nu_1 + 0\nu_2 = 0$\n$\rightarrow 0\nu_1 - 2\nu_2 = 0,$'
