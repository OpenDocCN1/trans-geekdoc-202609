    where $sign(\mathbf{w}) = (sign(w_0), \dots, sign(w_D))^T$ and


    ```

    $sign(w_k) = \begin{cases} 1 & \text{if } w_k > 0 \ 0 & \text{if } w_k = 0 \ -1
    & \text{if } w_k < 0. \end{cases}$

    ```


    The lasso regression does not have an analytical solution and has to be solved
    using numerical methods. Additionally, the lasso penalty is not differentiable
    because its derivative is not defined at $w_0=0$, as can be seen from Fig. 3.5.
    However, we can still use the gradient descent by calculating a subgradient of
    the derivative. If we define the first derivative of $L_1$ norm at $w_0=0$ to
    be zero, the subgradient becomes $sign(\mathbf{w})$, and the gradient descent
    equation can be written as


    ```

    $$\hat{\mathbf{w}}^{(n+1)} = \hat{\mathbf{w}}^{(n)} + \eta(\mathbf{X}^T(\mathbf{y}
    - \mathbf{X}\hat{\mathbf{w}}^{(n)}) - \lambda sign(\hat{\mathbf{w}}^{(n)})) \quad
    (3.16)$

    ```


    In scikit-learn, `sklearn.linear_model Lasso` the lasso regression model is formulated
    as


    ```

    `from sklearn.linear_model import Lasso\nmodel = Lasso(alpha=1)`

    ```


    and, for the ridge model, it is important to scale the features before fitting
    the lasso model.


    # 3.2.3 Comparison of ridge and lasso penalties


    Ridge and lasso penalties both help to decrease the weights, however they have
    different effect on the resulting solution. In Fig. 3.5 we can observe that for
    small weights the ridge penalty is weaker than the lasso, and therefore the lasso
    will more likely push the small weights to zero. On the other hand, the ridge
    penalty is stronger for larger weights,'
