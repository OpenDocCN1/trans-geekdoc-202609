  md: 'We will also rename the negative label from 0 to -1. As before, we predict
    the label as 1 if the decision function is positive or zero, and -1 if it is negative:


    ```

    $$\hat{y} = \begin{cases} 1 & \text{if } h(\mathbf{x}) \geq 0 \ -1 & \text{if
    } h(\mathbf{x}) < 0. \end{cases} \quad (4.4)$

    ```


    The aim of the **hard-margin objective** is to keep the samples on or outside
    the margins on the correct side of the decision boundary, while keeping the margins
    as large as possible at the same time. This can be written as


    ```

    $$\minimize \frac{1}{2}\mathbf{w}^\top\mathbf{w} \text{ subject to } y(\mathbf{x})
    \geq 1 \text{ for } i=1,...,NN.$$

    ```


    The objective **$\mathbf{w}^\top$** measures the squared magnitude of the slope
    of the decision function. Smaller slopes mean larger margins. Note the similarity
    to the ridge penalty. The quantity $y(\mathbf{x})$ is larger than 1 for a positive
    sample if $h(\mathbf{x}) \geq 1$, which ensures that the sample is on or outside
    the margin and correctly classified. For negative sample we have $h(\mathbf{x})
    \leq -1$, which again means that it should be on or outside the margin and correctly
    classified.


    The hard-margin objective can only be applied to separable problems and is very
    sensitive to outliers. Practical implementations therefore use the soft-margin
    objective that addresses these problems instead.


    # 4.2.2 Soft-margin support vector classifier


    We would like to apply the support vector classifier also to nonseparable problems
    (Fig. 4.6) and reduce sensitivity to outliers. Slack variables $\zeta_i$ to allow
    margin violations. Slack variables $\zeta_i$ measure how much sample $\mathbf{x}_i$
    violates the margin—see Fig. 4.7. If $\zeta_i=0$, then the sample is on or outside
    the margin, on the correct side of the decision boundary. If $\zeta_i>0$, then
    the sample $\mathbf{x}_i$ violates the margin. Note that slack variables are never
    negative, e.g., $\zeta_i \geq0$. For the soft-margin SVC the **support vectors**
    are all the training samples that lie on the margins or violate them—see Fig.
    4.6.


    The goal of the **soft-margin objective** is to maximize the margin while minimizing
    margin violations. The latter is equivalent to minimizing the sum of slack variables
    $\sum_{i=1}^N\zeta_i$, as each slack variable $\zeta_i$ is proportional to the
    distance by which the sample $\mathbf{x}_i$ violates the margin. Similarly to
    the hard margin objective, maximising the margin is equivalent to minimising the
    slope of the decision function. Putting this together, soft'
