  md: "# Dimensionality reduction\n\nLet's say that we are interested in the marginal\
    \ probability of selecting a participant at random from a specific age bracket.\
    \ This can be written in general terms as $P(age_c) = \frac{r_c}{n}$, i.e. the\
    \ marginal probability of any age in the row $r_c$ as a fraction of all participants.\
    \ For the probability of selecting a participant under 20, we therefore have $P(c\
    \ < 20) = \frac{2+1+3+5+14}{100} = \frac{25}{100}$ (Fig. 5.9b (orange row)). If\
    \ we are interested in the marginal probability that an individual suffers from\
    \ heart disease, we instead need the column total (Fig. 5.9c); $P(H) = \frac{1+3+4+8}{100}\
    \ = \frac{16}{100}$.\n\nJoint probabilities summarize the chance of two more events\
    \ co-occurring. For example, if we want the joint probability that an individual\
    \ aged 60-80 with mental health illness, we need the total from the cell at intersection\
    \ of these two events: $q$ (shown in Fig. 5.9d). The joint probability is then\
    \ the value divided by the total number of samples: $P(60 - 80, M) = \frac{4}{100}$.\n\
    \nFinally, conditional probability measures the probability of one event given\
    \ another. For example, to calculate the probability of an individual suffering\
    \ from mental illness that they know are 20–40, it is first necessary to take\
    \ the subset of examples corresponding to participants of age 20–40 (Fig. 5.9e\
    \ highlighted in orange) and then estimate the proportion of examples that have\
    \ mental health illness relative to the row: $r_c$. Hence $P(M|20-40) = \frac{6}{30}\
    \ = 1/5$. If our interest was to include the conditional probability of age disease\
    \ status, we would express the conditioning as the cell total relative to the\
    \ column total, e.g., $P(20-40|M) = \frac{6}{20}$.\n\nIndependent variables for\
    \ which one gives us no information of the value of the other. In the case of\
    \ mental health and age groups, we can see that the marginal probabilities of\
    \ selecting an individual with mental health illness irrespective of age group\
    \ are $P(M<20) = P(M|20-40) = P(M|40-60) = P(M|60-80) = P(M>80) = 1/5$. Further,\
    \ the marginal probability of selecting an individual with mental health illness\
    \ irrespective of age (Fig. 5.9f (blue column)) is $P(M) = \frac{20}{100} = 1/5$.\
    \ So, $P(M|20-40) = P(M)$—the addition doesn't impact our certainty at all. Another\
    \ feature of independent events is that their joint probability is equal to the\
    \ product of the individuals. This is derived from the product rule: $P(A, B)\
    \ = P(A)P(B)$, where independent $P(A|B) = P(A)$, then $P(A, B) = P(A)P(B)$.\n\
