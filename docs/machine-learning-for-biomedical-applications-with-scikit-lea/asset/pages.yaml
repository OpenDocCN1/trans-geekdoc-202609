- pgno: 193
  md: '# CHAPTER 8


    # Feature extraction and selection


    In the previous chapters we have shown how to train machine learning models using
    features that have been extracted from biomedical datasets. In many cases we extracted
    features using dedicated application specific techniques. For example, in Chap.
    3 the brain MRI of newborn babies was segmented into 86 structures (Fig. 3.1)
    and the volumes of these structures were used as features for the machine learning
    algorithms. We have reduced the number of features from 86 to 6 to prevent overfitting
    using the domain knowledge—we simply added volumes of structures depending on
    the brain type (WM, GM, CSF, ...). Other examples of features extracted using
    dedicated techniques based on the clinical knowledge and global longitudinal strain
    calculated from cardiac MRI or ultrasound, or QRS duration calculated from ECG,
    which we used in Chap. 4.


    In this chapter we describe some more applicable techniques for extracting (Sect.
    8.1) and selecting (Sect. 8.2) features from medical images and signals. This
    is often called feature engineering. In the following chapters we will see that
    state-of-the-art machine learning based on deep neural networks helps us bypass
    this step by directly learning features from the data. Nevertheless, feature extraction
    and selection still an important role in many applications, in particular, if
    we have small datasets or if we want to control and interpret the types of features
    that drive the machine learning models.


    # 8.1. Feature extraction


    a feature is a measurable property of an observed phenomenon that should ideally
    be informative, discriminative, and independent. Some features can be observed
    directly, for example, a patient''s age, blood pressure, or history of diseases.
    Other features can be directly measured from the data, as the head circumference
    of an ultrasound image, cardiac ejection fraction, or tumor diameter on an MRI
    image. These features are often measured manually in clinical practice.


    Feature extraction is a type of dimensionality reduction where a large number
    of values in signals or images are reduced to a more manageable number of features
    that still accurately capture the original data. In other words, we aim to extract
    new salient features from high-dimensional data and remove redundant information.
    This way we can reduce overfitting and improve accuracy and computational efficiency
    of the machine learning models.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Machine Learning for Biomedical Applications


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_194_0.png)


    **Figure 8.1** ECG waveform. Red arrows show the QRS interval duration. The real
    ECG signal is shown on the pink background.


    In this section we will give a brief overview of several types of features that
    can be extracted from the biomedical signals and images. **Morphological features**
    describe geometric aspects of the objects, such as length, area, or volume. **Texture
    descriptors** look at statistical properties of the signal or image values. **Transform-based
    features** provide features in other domains, such as frequency domain.


    # 8.1.1 Morphological features


    We have seen several types of morphological features, for example, the volumes
    of brain structures (Fig. 3.1) or QRS interval duration in an ECG (Fig. 8.1).
    Morphological features can contain some basic measurements, such as **length,
