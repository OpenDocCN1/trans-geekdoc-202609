    \ for the kernel ridge regression model.\n\n# Kernel ridge regression in scikit-learn\n\
    \nKernel ridge regression can be fitted in scikit-learn as follows:\n\n```\nfrom\
    \ sklearn.kernel import KernelRidge\nmodel = KernelRidge(kernel='rbf',gamma=0.01,\n\
    alpha=0.0001)\nmodel.fit(X,y)\n```\n\nThe prediction of GA from brain structure\
    \ volumes using KernelRidge is shown in Fig. 3.8, right hyperparameter gamma is\
    \ equal to $\\frac{1}{2}$. The hyperparameters gamma and alpha were tuned using\
    \ GridSearchCV. The kernel ridge regression model achieved the cross-validated\
    \ RMSE of 0.79 weeks and completely removed the biases in predictions for young\
    \ babies.\n\n# Feature transformation or kernel?\n\nOne of the advantages of the\
    \ kernel methods is the intuitive interpretation of the kernel as a similarity\
    \ between feature vectors. Additionally, it enables the original feature transformations\
    \ to have very large, possibly infinite, dimension $D$. This is due to the fact\
    \ that we invert the matrix $\\mathbf{K} + \\mathbf{I}$, which has dimension $N\
    \ \times N$ related to number of samples. On the other hand, for ridge regression\
    \ with nonlinear transformation, we invert the feature transformation $\\Phi^T\\\
    Phi + \\lambda\\mathbf{I}$ with dimension $D \times D$, which is related to the\
    \ number of features instead. Kernel methods are much more flexible compared to\
    \ the parametric models such as polynomials, and are able to model the trends\
    \ in the data more accurately.\n\nFrom the point of computational efficiency,\
    \ we should choose between kernel and feature transformation methods depending\
    \ on whether the bottleneck is a large number of features or a large number of\
    \ samples. Kernel methods are slow for large datasets, during both fitting and\
    \ evaluation, because similarity with every single training sample needs to be\
    \ evaluated when predicting for an unseen sample. On the other hand, if the trend\
    \ can be captured by a nonlinear model with small number of parameters, such as\
    \ low-degree polynomial model, both training and evaluation can be very fast."
