    Finally, it is important to note that scikit-learn implementation of ridge and
    lasso regressions does not penalize the bias term $w_0$. There is a good reason
    for it: The bias term is not prone to overfitting, and forcing it to zero decreases
    the quality of the fit. In other words, very large $\lambda$ will result in regressor
    predicting zero values if all coefficient including bias are penalized. On the
    other hand, if the bias term is not penalized, large penalty will result in regressor
    predicting an average of the target values.


