  md: '# 5.4.4 Estimating PCA using singular value decomposition


    Often the covariance matrix will not be of full rank (several eigenvalues will
    be zero). This is particularly likely to be the case when the matrix is estimated
    from nonsquare data matrices with high numbers of features. In these cases, computation
    becomes unstable, and it is better practice to implement PCA using singular value
    decomposition (SVD). SVD generalizes eigendecomposition to matrices of any shape.
    For example, for $X \in \mathbb{R}^{n \times m}$,


    ```

    X = U\Sigma V^T (5.52)

    ```


    SVD factorizes $X$ into $U \in \mathbb{R}^{n \times m}, V \in \mathbb{R}^{m \times
    m}$ and $\Sigma \in \mathbb{R}^{n \times m}$. Here, $U$ and $V$ are the left and
    right singular vectors, with component vector having unit magnitude, and being
    orthogonal to one another; $\Sigma$ represents a rectangular diagonal matrix of
    singular values $(r_i)$. The maximum number of nonzero singular values is determined
    by the matrix rank $r \leq \min(n, m)$.


    The relationship between PCA and SVD can be seen if we substitute $X$. Eq. (5.52)
    into our expression for the eigenvectors and values of our covariances$^8$


    ```

    $X_C X_C^T = U\Sigma V^T (U\Sigma V^T)^T U = U\Sigma V^T V\Sigma^T U^T = U\Sigma^2
    U^T$ (5.53)

    ```


    Thus, $U$ reflect the eigenvectors of data covariance matrix $X_C X_C^T$. $V$
    represents the eigenvectors of $X_C^T X_C$.


    ```

    $X_C^T X_C V = (U\Sigma V^T)^T U\Sigma V^T V = V\Sigma^2 V^T$ (5.54)

    ```


    In both cases, covariance matrices share $r$ nonzero eigenvalues ($\Sigma \in
    \mathbb{R}^{r \times r}$), and these are related to the SVD singular values as9$


    ```

    $\lambda_i = \frac{\sigma_i^2}{n-1}$ (5.55)

    ```


    > ^7 Such that $U^T U = I$ and $V^T V = I$.


    > ^8 Temporarily dropping the $\frac{1}{n-1}$ normalization term for visualization
    purposes.


    > ^9 Here, we put the normalization term back in.'
