  md: "Deep learning basics 201\n\nWhen the function loss.backward() is called, the\
    \ functions stored in grad_fn will calculate the gradients by moving backward\
    \ through the computational graph, as shown in Fig. 9.3, bottom.\n\nNote that\
    \ gradients are only evaluated for the leaf nodes of the computational graph,\
    \ and these leaf nodes do not have the function grad_fn because there are no gradients\
    \ to propagate further. We run the function backward() on the root of the computational\
    \ graph (if in our case loss), which must be a scalar. Additionally, all tensors\
    \ must be of float.\n\n# 9.2.4 Creating models in PyTorch\n\n# Regression in PyTorch\n\
    \nNow we are ready to create our first neural network model. PyTorch offers the\
