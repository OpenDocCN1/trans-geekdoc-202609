    w_1, \dots, w_D)^T$ forms parameters of the model, and $\hat{y}$ is a predicted
    target value.


    We wish to fit the model (find the weight vector **w**) to $N$ training samples
    $x_i = (X_{i1}, \dots, X_{iD})$ with associated target values $y_i$, where $i
    = 1, \dots, N$. This can be done by minimizing the loss function that measures
    a **sum of squared errors between**'
