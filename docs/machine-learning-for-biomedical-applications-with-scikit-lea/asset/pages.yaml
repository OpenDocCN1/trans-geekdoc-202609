  md: '# Machine Learning for Biomedical Applications


    Note that x is a multidimensional feature vector for sample i, $\mu_k$ is the
    multidimensional mean for the cluster $k$, and $|\cdot|$ denotes the Euclidean
    distance. If we expand the expression for $\sigma_k^2$ (Eq. (6.1)) it directly
    the variance of each cluster, we will see that within-cluster variance is actually
    an average squared distance of each sample to its cluster center:


    ```

    $$\sigma_W^2 = \frac{1}{N} \sum_{i=1}^N |x_i - \mu_{y_i}|^2$

    ```


    where $y_i$ is the label assigned to the sample $i$. This intuitively gives an
    iterative algorithm to minimize the within-cluster variance. We will iterate between
    assigning the cluster with the closest feature mean each sample


    ```

    $y_i = \arg \min_k |x_i - \mu_k|$   (6.2)

    ```


    and recalculating the means of the clusters


    ```

    $$\mu_k = \frac{1}{n_k} \sum_{i \in S_k} x_i$.   (6.3)

    ```


    We start the process with random initialization of the cluster means $\mu_k$.
    Fig. 6.1 shows how this procedure finds the clusters of voxels by WM, GM, and
    CSF in T1- and T2-weighted MRI.


