    \ same spatial dimension. Since upsampled enc4 and enc3 have 32 channels, after\
    \ the concatenation, there will be 64 channels. The convolution reduces the channels\
    \ from 64 to 16, resulting in a third-decoder activation maps enc3. The final\
    \ two decoder levels are analogous:\n\n```\nconv2_up = nn.Conv2d(16+16,8,3,padding=1)\n\
    dec2=up(dec3)\ndec2=torch.cat([dec2, enc2], dim=1)\ndec2=ReLU(conv2_up(dec2))\n\
    dec2=shape\n>>> torch.Size([1, 8, 128, 128])\n```\n\n```\nconv1_up = nn.Conv2d(8+8,3,padding=1)\n\
    dcl1=up(dec2)\ndcl1=torch.cat([decl1, enc1], dim=1)\ndec1=ReLU(conv1_up(decl1))\n\
    dec1=shape\n>>> torch.Size([1, 2, 256, 256])\n```\n\n# UNet model\n\nWe can join\
