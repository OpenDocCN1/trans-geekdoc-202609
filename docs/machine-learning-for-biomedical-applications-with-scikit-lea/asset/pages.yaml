    \    n_estimators=n_trees)\n\n# create a random forest of 50 trees\n# with 30%\
    \ of the total number of features\nclf=RandomForestClassifier(n_estimators=n_trees,\n\
    \    max_features=0.3)\n```\n\nYou should consider the first argument of the bagging\
    \ classifier is the choice of base model, whereas for forests there is no choice.\
    \ In both cases, you can control the size of the ensemble using n_estimators.\n\
    \nThe arguments of the random forest class parallel those of the decision tree\
    \ class, max_features specifically determines the degree of undersampling of the\
    \ features at each node. In example, the use of a float (0.3) sets the number\
    \ of randomly selected features to 30% of the total available. For full options,\
    \ on all arguments, see the scikit-learn documentation.\n\n# 7.2.7 Out-of-bag\
    \ error\n\nOne advantage of training bagged ensembles is that it is possible to\
    \ return an estimate of the likely generalization by testing each tree on the\
    \ examples that were left out during bootstrap sampling. These are known as out-of-bag\
    \ (oob) samples. For large data sets, this can be set to approximately 37%.\n\n\
    Once all models are trained, out-of-bag predictions for each training example\
    \ can be combined, using averaging or majority voting; then, a final score can\
    \ be calculated from the accuracy (classification) or error (regression) across\
    \ all examples. To track error using scikit-learn, oob_score=True, when instantiating\
    \ your model, e.g.,\n\n```\n# track oob error during training\nclf=BaggingClassifier(DecisionTreeClassifier(),\n\
    \    n_estimators=n_trees, oob_score=True)\n```\n\nThe oob performance can be\
    \ returned after training using the oob_score_ attribute:"
