  md: '# Format strings


    In some cases we will use printed statements with formatted output using the str.format
    method for strings. Using this formulation, it is possible to cast different data
    types using the string, while also truncating floats, for example


    ```

    print(''var 1: {1}, var 2 {0}''.format(''dog'',''cat''))

    print(''Pi: {}''.format(3.14159))

    ```


    will return


    ```

    var 1: cat, var 2 dog

    Pi 3.14159

    ```


    with general syntax


    ```

    [argument]:[width][precision]type

    ```


    such that the example


    ```

    print(''Pi is {:0.8f}''.format(3.14159, 2.125))

    ```


    returns


    ```

    Pi is 3.14,

    ```


    in other words, pi to two decimal places preceded by five spaces; given, since
    the format placeholder {0.8f} selects the argument relative to its position in
    the format string, i.e. 3.14159 is not 2.125; 8 is the formatted width (where
    the width is longer than the white space is added in front); 2 is the number of
    decimal places; and f is the (float) type. Examples of other common types include
    d (signed integer) and s (string) type.


    # Booleans


    Booleans represent binary True or False statements. They may be returned from
    the bool(...) function or from Boolean operators (below). For the purpose of control
    flow (i.e. if) statements (section), the following objects would be considered
    as False:


    +   - integer or float zero (0 or 0.0)

    - None statement

    - empty lists, dictionaries, tuples, arrays etc. (e.g., (), [])


    Every other output would be considered True.


