  md: 'Parallel and sequential models reference the way in which the component models
    are trained and combined. Parallel learners, like the majority voting scheme already
    described, train large numbers of base learners independently and combine them
    to smooth away the impact of isolated errors. The objective is to learn models
    that are as uncorrelated as possible. Averaging uncorrelated errors (as seen for
    the majority voting scheme above) reduce variance, improving accuracy and generalization.
    However, it''s important to be conscious of the fact that, if predictions are
    stable, then parallel enrolling may even lead to a degradation of the result.
    In addition to voting, parallel methods including bagging and random forests.


    Sequential models, on the other hand, train weak learners one after another, up-weighting
    the importance of wrongly predicted examples in each subsequent round. Combining
    in this way enables methods to optimize the complementarity of base learners,
    to collectively reduce the bias of the model and to improve the performance on
    edge cases. The family of methods known as boosting are examples of sequential
    learners.


    # 7.2.3 Bagging


    Bagging (short for bootstrap aggregating [4]) is an example of a parallel homogeneous
    ensemble that seeks to reduce model variance by training a large number of decision
    trees, on others than those in the original data set. It seeks to leverage the
    statistical property that, for independent random variables, the sampling distribution
    of the mean is $\frac{1}{T}$ times the variance, where $T$ is the number of trained
    models, i.e.,


    $$\frac{var(Y)}{T}. \quad (7.22)$


    In other words, the act of averaging will naturally reduce the variance of the
    model. However, if we have only one training set, where do all these independent
    samples come from?


    It turns out that we can generate any number of datasets through a process known
    as bootstrapping. We create new sets $\mathbf{X}_i, i=\{0, 1, \dots, T\}$ by sampling
    with replacement. In this way, each example from $\mathbf{X}$ may be sampled,
    several times or not at all, with the result, even though the total number of
    examples within each bootstrapped sample remains $N$, the composition of each
    $\mathbf{X}_i$ will be different (see the example in Sect. 7.2.4). Importantly,
    for large-enough sample size, bagging will closely approximate any sampling distribution
    estimated from the full population [26].


    Additionally, the idea of bagging is to take repeated samples from the training
    data and use each to train a different predictive model (typically, a decision
    tree). Once trained, predictions for each test example are returned from all models
    in'
