  md: '# 11.2.4 Batch normalization


    ```

    conv = torch.Conv2d(1,8,5,padding=2,stride=2)

    downsampled = conv(input_image)

    print(downsampled.shape)

    >>> torch.Size([1, 8, 32, 32])

    ```


    Deep neural networks are typically trained with variants of stochastic gradient
    descent, which sample batches from the data sets and estimate average loss for
    each batch rather than estimating it across all examples. This can lead to noisy
    gradient updates since the composition of each batch is subject to change. Batch
    normalization [22] seeks to address this by normalizing and rescaling the features
    in each batch, at every layer throughout the network. By doing so, it can considerably
    speed up training. Commonly, the batch norm is placed before convolutional layer
    and activation, or after the activation.


    The batch normalization layer rescales its inputs to zero mean and variance. This
    is done by subtracting the mean and dividing by variance calculated from the data.
    The normalization is done across the batch and spatial dimensions, but separately
    for each output channel. Because means and variances across the batches, the batch-norm
    layer keeps track of them through the iterations and calculates moving averages.


    The batch-norm layer also learns a linear transformation (parameterized by two
    parameters, i.e., the slope and bias) for each channel, which is applied to the
    features after the normalizations.


    In the following example, we would like to apply batch-norm to the output of the
    convolutional layer:


    ```

    print(output.shape)

    >>> torch.Size([1, 8, 64, 64])

    ```


    Because we have 8 channels, we apply batch-norm as follows:


    ```

    bn = torch.nn.BatchNorm2d(8)

    normalized-bn(output)

    ```


    # 11.2.5 Dropout


    Dropout [43] is a technique that can be used to perform network regularization.
    It works by randomly dropping activations (setting them to zero) during training,
    in other words, by applying a randomized masking operation on the output of each
    layer. In doing so, the approach prevents individual network components from memorizing
    the inputs, which would lead to overfitting. There is a trade-off, because dropping
