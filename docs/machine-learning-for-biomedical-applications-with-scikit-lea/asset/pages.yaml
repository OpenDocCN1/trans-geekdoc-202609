    # 7.2.13 Heterogeneous ensembles


    In contrast to homogeneous ensembles, heterogeneous ensembles stack predictions
    made from various classes of machine learning model. In principle, this allows
    for the leveraging of complementary advantages across various types of models,
    for example, combining linear and nonlinear models.


    The basic framework of a stacking algorithm is shown in Fig. 7.10. Here, training
    X and labels y are passed to 3 different models—could be anything, e.g., a random
    forest, support vector machine or a logistic regression. Each model outputs a
    prediction: $\hat{y}^1$, $\hat{y}^2$, $\hat{y}^3$; these predictions form the
    data that is input to the second level (meta) learning model, which combines them
    to output a single final prediction $\hat{y}$. The meta model might be something
    as simple as majority voting but could equally be any other learning model (e.g.,
    a second forest, SVM or logistic regression).


