    where cdh, cdv, and cdd are horizontal, vertical, and diagonal detail coefficients,
    shown for the histological image in Fig. 8.5, right.


    So far, we have described single-level DWT. It is however common to perform DWT
    at multiple resolution levels. Multi-level DWT will further decompose approximation
    coefficients for the current level to the approximation and detail coefficient
    of the next lower resolution level. We can perform such decomposition either a
    predefined number of times, or until we have a single approximation coefficient.
    Multi-level DWT can be implemented using command wavedec:


    ```

    from pywt import wavedec

    ca3, cd3, cd2, cd1 = wavedec(signal, ''dbl'', level=3)

    ```


    shown here for 1D signal and 3 levels.


    Note that the DFT and DWT do not offer dimensionality reduction. In fact, the
    dimensionality of the data is preserved after transformation, and the inverse
    DFT and DWT can be used to reconstruct the original data without any loss. We
    might therefore need to reduce the dimensionality of the transformed data before
    training machine learning models. One way to do that is to calculate summary statistics,
    similarly to texture descriptors in Sect. 8.1.2. An alternative is to use one
    of the feature selection algorithms which will be covered in Sect. 8.2.'
