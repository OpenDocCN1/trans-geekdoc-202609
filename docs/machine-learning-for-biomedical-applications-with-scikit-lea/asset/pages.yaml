    #  11.4.1 UNet architecture


    We implement the UNet-style architecture shown in Fig. 11.9, which has fewer layers
    and weights compared to the original UNet implementation [38].


    UNet architecture is composed of encoder and decoder branches with skip connections.
    The encoder branch increases number of features in each layer, while reducing
    spatial resolution. In the decoder branch, the number of feature maps is reduced,
    while loss of spatial resolution in the encoder branch is addressed by imputing
    activations from the encoder layers to the decoder layers of the same spatial
    resolution, to ensure that fine detail is not lost in the final segmentation.


    Note that Fig. 11.9 shows the outputs of various layers for input images with
    a spatial resolution of 256 × 256, however, UNet architecture can be applied to
    images of various sizes because it is composed of only the convolutional (and
    no fully connected) layers. This type of architecture can be called a fully convolutional
    network.


    We will go through the UNet architecture shown in Fig. 11.9 in detail. We will
    start by generating a random image to demonstrate how we use different layers
    with


    ```

    import torch

    im = torch.randint(0,255,(1,1,256,256)).float()

    nim.shape

    >>> torch.Size([1, 1, 256, 256])

    ```


    # Encoder


    The first convolutional block of the encoder (blue arrow) extracts 8 low-level
    feature maps from the input image and uses ReLU activation function to produce
    activation maps. This is implemented with


    ```

    import torch.nn as nn

    conv1_down = nn.Conv2d(1,8,3,padding=1)

    ReLU = nn.ReLU()

    ```'
