    # 11.1.2 Convolutional neural networks


    Convolutional neural networks (CNNs) are designed to mimic the mammalian visual
    system. They learn spatial features of increasing complexity, from edge filters
    to object detectors. The architecture of CNNs combines three ideas [28]:


    +   * Local receptive fields: Features are extracted only from local neighborhoods,
    rather than the whole image. Convolution achieves that by applying a smaller filter
    to the image. In 11.2, the size of the filter (and the local neighborhood) is
    3 x 3 pixels. Local receptive fields support extraction of low-level features,
    such as edges and corners, as we illustrated in Fig. 11.1.


    +   * Shared weights: The features should be extracted the same way, independent
    of their location. This is called translation invariance. The convolution applies
    the same filter to all locations of the image.


    +   * Subsampling: The feature maps extracted by convolutions are subsampled and
    subsequently fed to the next convolutional layer to be combined into higher-level
    features. As the size of the feature maps reduces, the exact positions of extracted
    features become irrelevant, and only the patterns of salient features and their
    relative remain.


    Fig. 11.3 shows an example CNN architecture in LeNet style.¹ The input is one
    gray-scale image of size 64 x64 (shown as 1@64x64). The first convolutional layer
    extracts 8 filters making feature maps of the same size as the input (shown as
    8@64x64). These feature maps are then subsampled by a factor of two using the
    max-pooling operation, which simply selects a maximum feature value from each
    2 x 2 image patch (resulting feature maps shown as 8@32x32). The second convolutional
    layer applies 16 filters, resulting in 16 feature maps the second max-pooling
    layer reduces the feature maps to size 16 x 16 (shown as 16@16x16).


    > ¹Created using the NN SVG online tool: alexenal.me/NN-SVG/LeNet.html.'
