- pgno: 202
  md: 'techniques is a nearly impossible task: Not only is the dimensionality of the
    problem huge, but these raw features are not necessarily quantitative because
    the brains vary in position and shape and MRI intensities are not quantitative.
    We have extracted a much smaller number of meaningful morphological features,
    86 volumes of brain structures. We have seen in Chap. 3 that this number of features,
    though greatly reduced, could still lead to overfitting. We have already shown
    how to prevent overfitting regularization (Sect. 3.2, ridge or lasso), dimensionality
    reduction techniques (Sect. 5.4, PCA) and ensemble learning (Chap. 7).


    In this section we cover several feature-selection techniques, including univariate
    feature selection, model-based feature selection, and recursive feature elimination.
    We will show that feature selection not only prevents overfitting, but also offers
    ways to calculate the importance of features and interpret the trained machine
    models.


    # 8.2.1 Feature importances


    To be able to select the best features, we need a way to calculate the importance
    of each feature for the prediction task. We will consider two types of methods:


    +   - Univariate feature importances measure how each individual feature affects
    the target value

    - Model-based feature importances are extracted from fitted machine learning models.


    Examples of univariate feature importances are Pearson''s correlation coefficient
    and mutual information between the feature $x_i$ and the target value $\gamma$.
    To select features using linear regressors or classifiers, we fit a multivariate
    linear model as a prediction or decision function:


    > $$\gamma = w_0 + w_1x_1 + \dots + w_Dx_D$$


    If the features are normalized, for example, using a standard scaler, the absolute
    values of the coefficients $w_k$ can be considered as feature importances because
    they measure how much each feature $x_k$ contributes to the prediction model.
    In scikit-learn we can access coefficients through


    ```

    model.coef_

    ```


    In tree-based methods, we measure how each feature decreases the impurity in a
    tree. For an ensemble of trees, such as random forest, we average these decreases
    in impurities over all trees to obtain feature importances. In scikit-learn the
    tree-based methods return the feature importances through


    ```

    model.feature_importances_

    ```


    While, in the univariate approach, each feature is considered separately, the
    model-based approaches also consider relationships between features and are therefore
    better to discover complex predictive combinations of features and remove redundant
    features.'
  merge: -1
  img_proc: true
