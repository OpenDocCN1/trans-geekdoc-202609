  md: '# CHAPTER 4


    # Classification


    In Chap. 2 we introduced linear classification using the perceptron model (Sect.
    2.2.2). In this chapter we will describe various linear and non-linear classification
    methods in detail. In Sect. 4.1 we will cover linear binary and multi-label classifiers,
    including perceptron and logistic regression. We will also discuss how to correctly
    evaluate classification models. In Sect. 4.2 we will introduce support vector
    classifier and apply feature transformation and the kernel trick to turn a linear
    classifier into nonlinear.


    We will demonstrate training classification models using an example of the prediction
    of heart failure (HF) from measurements using cardiac ultrasound, MRI and ECG
    [36]. We have already introduced this dataset in Sects. 2.1.1 and 2.2.2. The dataset
    consists of three measurements (features):


    +   **Ejection fraction (EF):** the percentage of blood the left ventricle pumps
    out with each contraction;

    **Global longitudinal strain (GLS):** the percentage of change in length of the
    heart during the cardiac cycle;

    **QRS interval duration (QRS):** a characteristic of healthy cardiac function
    obtained from ECG.


    These measures were calculated from examinations of 120 patients with one of the
    following conditions:


    +   **Healthy:** No symptoms;

    **Mild Heart Failure:** Symptoms during physical activity;

    **Serious Heart Failure:** Symptoms while resting.


    # 4.1. Classification basics


    In this section we will introduce binary and multi-label classification techniques.
    We will look at perceptron and logistic regression models and discuss performance
    measures for binary and multi-label classifiers.


    # 4.1.1 Binary linear classification


    **Binary classifiers** predict two labels, usually 0 and 1, based on a $D$-dimensional
    feature vector $x = (x_1, \dots, x_D)^T$. The prediction is based on a **decision
    function**, which is the multivariate linear function


    ```

    $h(\mathbf{x}) = w_0 + x_1w_1 + \dots + x_Dw_D$.

    ```'
