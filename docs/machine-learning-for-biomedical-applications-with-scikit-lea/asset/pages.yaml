  md: '# 9.3.4 Limitations of the single-layer perceptron


    The key limitation of the models presented in this chapter is that they consist
    of a single linear layer. This means, that these models are inherently linear
    and therefore might not adapt well to complex real-world problems. In Chap. 10
    we will show how this limitation can be overcome by building networks of neurons
    organized in multiple layers, which are interleaved with nonlinear activation
    functions. Such deep nonlinear models are extremely flexible and can adapt to
    any real-world situation. This flexibility is one of the key factors in the success
    of the modern deep learning.


    # 9.3.5 Exercises


    +   1. What is the main difference between a single neuron and a single-layer
    perceptron?


    +   2. Describe the activation function and the loss that we use to create multi-label
