  md: '# Machine Learning for Biomedical Applications


    To check whether two variables point to the same object, use is or is not. These
    differ from == and != is they are checking whether the objects themselves are
    identical (in memory), as opposed to whether just their values are identical.
    This functionality is best demonstrated using:


    ```

    list_a=[1,2,3]

    list_b=list_a

    ```


    Here, list_a is copied to list_b, so they point to the same memory location (and
    therefore are the same object). If a new list_c is subsequently created with the
    same values as list_a, it is equivalent in value but will not point to the same
    location in memory:


    ```

    list_c=[1,2,3]

    # will return A

    print(list_a is list_b)

    # will return false

    print(list_a is list_c)

    ```


    To check whether an item is in a list, use in or not in:


    ```

    my_list=[1,2,3]

    #returns False

    print(5 in my_list)

    ```


    Finally, two conditional statements can be considered concurrently with and/or
    state-ments, where, for and, both statements must be true for the chained condition
    to return True; whereas, for or, only one needs to be true for the combination
    to return True, e.g.,


    ```

    a=10

    b=12

    # returns False

    print(a == b)

    #returns False

    print(a< 15 or b < 10)

    # returns True

    print (a < 15 or b < 10)

    ```


