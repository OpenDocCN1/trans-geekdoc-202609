  md: '# CHAPTER 10


    # Fully connected neural networks


    The flexibility of the neural networks comes from combining many artificial neurons
    into a single machine-learning model organized in multiple layers. In fact, neural-works
    are universal approximators, and can learn a good approximation of a function
    of any complexity, given a sufficient number of learnable parameters.


    In this chapter we will show how we can build fully connected neural networks.
    We will introduce the architecture of fully connected neural networks in Sect.
    10.1, 10.2 we will describe how neural networks are trained using back-propagation
    [40]. In the final section 10.3 we will show a complete deep learning solution
    for prediction of age from the brain connectivity in newborn babies.


    # 10.1. Fully connected network architecture


    In Chap. 9 we described in detail an artificial neuron (Sect. 9.1) and how multiple
    neurons can be organized in a single linear layer to produce multiple outputs,
    resulting in a single-layer perceptron model (Sect. 9.3). Multiple output features
    allow us to stack several layers of neurons, resulting in a multilayer perceptron
    model, as illustrated in Fig. 10.1. If we add nonlinear activation functions between
    the layers, we will be able to create flexible nonlinear models and overcome the
    in-built linearity of single-layer perceptrons. If the resulting network has at
    least three layers, we obtain a fully connected deep neural network.


    # 10.1.1 Multilayer perceptron


    A major limitation of the single-layer perceptron is that it is a linear model,
    and therefore not suitable for complex nonlinear machine-learning problems. In
    Fig. 10.2, we can see the single-layer perceptron fails to separate co-centric
    circles, which requires a highly nonlinear boundary. We can obtain more complex
    models by stacking multiple linear layers, which means that the output of the
    previous layer is the input of the following-layer. The resulting multilayer perceptron
    is shown in Fig. 10.1. Importantly, we can obtain nonlinear models only if we
    interleave the linear layers with nonlinear activation functions. This approach
    allows us to separate the co-centric circles, as seen in Fig. 10.2, middle and
    right.


    # 10.1.2 Stacking layers of neurons


    Single-layer perceptron models can be stacked one after another, to produce a
    more complex multilayer perceptron model. We will call the outputs of the layer
    l1-active'
