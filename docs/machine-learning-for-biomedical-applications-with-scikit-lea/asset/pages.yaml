  md: "# Training iteration\n\nTo simplify the code, we will create a function train\
    \ that will perform one training iteration and return the latest training loss.\
    \ This function takes the instance of the net-work as an input, together with\
    \ the training dataset. It performs the usual five steps that we need to train\
    \ a network in PyTorch. It returns the loss without gradients, which is extracted\
    \ as loss.data.\n\n```\n# performs one training iteration\ndef train(net,X):\n\
    \    # training iteration\n    optimizer.zero_grad()\n    prediction = net(X)\n\
    \    loss = loss_function(prediction, y)\n    loss.step()\n    # return loss without\
    \ gradients\n    return loss.data\n```\n\n# Validation\n\nWe also create a function\
    \ validate that calculates the loss for a given dataset without performing any\
    \ training. This function will be used to calculate the loss on the validation\
    \ set during each epoch to monitor the training:\n\n```\n# calculates the loss\
    \ without any training\ndef validate(net,X,y):\n    # do not no_grad():\n    with\
    \ torch.no_grad():\n        # forward\n        prediction = net(X)\n        #\
    \ calculate loss\n        loss = loss_function(prediction, y)\n    return loss\n\
    ```\n\n# Training loop\n\nWe are ready to train our first deep neural network!\
