- pgno: 132
  md: '# Machine Learning for Biomedical Applications


    matrix looks like


    ```

    $C = \begin{pmatrix} COV_{11} & COV_{12} & COV_{13} & COV_{14} \ COV_{21} & COV_{22}
    & COV_{23} & COV_{24} \ COV_{31} & COV_{32} & COV_{33} & COV_{34} \ COV_{41} &
    COV_{42} & COV_{43} & COV_{44} \end{pmatrix} \quad (5.39)$

    ```


    with variance of each individual feature ($COV_{11}, COV_{33}, COV_{44}, COV_{55}$)
    on the diagonal and covariances between different features ($COV_{12}, COV_{13},
    COV_{14}, COV_{21}, ...$) stored on the off diagonal. In this representation,
    the variance estimates the spread of values along a single feature dimension,
    whereas covariance is a measure of shared information between features. The covariance
    matrix is symmetric, which means its eigenvectors form a new orthogonal basis
    set that better represents the variance features.


    #  5.4.2 Deriving PCA


    We know from trigonometry that the projection of data point $\mathbf{x}_n$ onto
    $\mathbf{v}_1$ may be estimated as $|\mathbf{x}_n|cos\theta$ and that scalar (dot)
    product of these two vectors is


    ```

    $\mathbf{x}_n\mathbf{v}_1 = |\mathbf{x}_n|\mathbf{v}_1|cos\theta. \quad (5.40)$

    ```


    Thus, by rearranging Eq. (5.40), we see that the dot product is equivalent to
    the scalar projection, provided that $|\mathbf{v}_1| = 1$,


    ```

    $|\mathbf{x}_n|cos\theta = \frac{\mathbf{x}_n\mathbf{v}_1}{\|\mathbf{v}_1|}. \quad
    (5.41)$

    ```


    Putting this altogether, for PCA we are seeking the direction $\mathbf{v}_1$ for
    which the variance across all projected data points is maximized. Assuming, that
    we first normalize our eigenvectors ($\mathbf{v}_1 = \mathbf{v}_1/|\mathbf{v}_1|$),
    we can represent the variance of projected points onto $\mathbf{v}_1$ as


    ```

    $\frac{1}{N-1}(\mathbf{XC}\mathbf{v}_1)^T(\mathbf{XC}\mathbf{v}_1) = \mathbf{v}_1^T\mathbf{C}\mathbf{v}_1.
    \quad (5.42)$

    ```


    To find the direction that maximizes the projected variance, we must take the
    derivative of the variance $\mathbf{v}_1$ w.r.t. $\mathbf{v}_1$. At the same time,
    we enforce a plausible solution by constraining the estimated eigenvectors to
    have unit magnitude. This constraint is implemented through the method of Lagrange
    multipliers:


    ```

    $\mathcal{L}(\mathbf{v}_1, \lambda_1) = \mathbf{v}_1^T\mathbf{C}\mathbf{v}_1 +
    \lambda_1(1-\mathbf{v}_1^T\mathbf{v}_1). \quad (5.43)$

    ```


    Optimizing for $\mathbf{v}_1,\mathcal{L}(\mathbf{v}_1, \lambda_1)=0$, then this
    reduces to


    ```

    $\mathbf{C}\mathbf{v}_1 = \lambda_1\mathbf{v}_1. \quad (5.44)$

    ```


    meaning that $\mathbf{v}_1$ must be an eigenvector of $\mathbf{C}$, where eigenvalue
    $\lambda_1 = \mathbf{v}_1^T\mathbf{C}\mathbf{v}_1$ equates to the magnitude of
    the variance along that direction.'
