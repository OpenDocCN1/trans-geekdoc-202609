    \ using either SVD or the covariance method. Assuming the data matrix X has shape\
    \ $(n_{examples}, n_{features})$ and we are interested in the covariance between\
    \ features not examples, PCA may run from the following steps:\n\n+   1. Mean\
    \ center the data matrix $X_C = X - X$ using numpy.mean, Make sure to specify\
    \ which axis you want to average over (in this case you are looking for a mean\
    \ value for each feature)\n2. Estimate the principal components through either:\n\
    \   - The covariance method:\n     - Estimate the data covariance matrix using\
    \ Eq. (5.38), implemented using numpy.matmul(...).\n     - Estimate the eigenvector\
    \ and eigenvalues of the covariance matrix using Lambda, numpy.linalg.eig(...).\n\
    \     - This will return unsorted eigenvalues (Lambda) and eigenvectors (U).\n\
    \     - Sort eigenvalues and eigenvectors into descending order using numpy.argsort.$10\n\
    \   - The SVD method:\n     - Estimate the singular values and values using U,\
    \ Lambda, numpy.linalg.svd(...).\n     - This will return left singular vectors\
    \ (U), right singular vectors ($VH^{11}$) and singular values (Lambda)\n     -\
    \ calculate eigenvalues from singular values by implementing Eq. (5.55).\n\n#\
    \ 5.4.6 PCA for dimensionality reduction\n\nFor datasets that have more features\
    \ than examples, the action of projecting all points onto their PCA components\
    \ ($Y = XCU$) reduces dimensionality automatically since the total number of nonzero\
    \ components is at most equal to the smallest dimension of the data matrix (matrix\
    \ rank $r \\le min(n, n)$). Often, the rank of the data covariance matrix may\
    \ be less as a result of correlation between features. For example, predicting\
