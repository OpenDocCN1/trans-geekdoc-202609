  md: '# Classification


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_61_0.png)


    **Figure 2.2** An example of a classification problem: diagnosis of heart failure
    using the ejection fraction and global longitudinal strain, biomarkers calculated
    from ultrasound and magnetic resonance images.


    In **clustering** problems we look for groups of samples with similar feature
    vectors, and we assign a label to each group, which is called a **cluster**. An
    example of such a problem is the segmentation of images based on intensity values,
    such as segmentation of brain tissues on MRI. On a $T_1$-weighted MRI, the white
    matter (WM) has the brightest intensity values, grey matter (GM) are medium, and
    the cerebro-spinal fluid (CSF) is the darkest. On a $T_2$-weighted MRI, the order
    of intensities is reversed. Fig. 2.3 shows detection of the clusters of pixels
    based on feature vectors $T_1$-weighted and $T_2$-weighted intensity values.


    **Dimensionality reduction** reduces to the number of features in high-dimensional
    machine learning tasks, while preserving the important characteristics of the
