- pgno: 214
  md: 'equation (Eq. (3.8)):


    ```

    $w_j^{(n+1)} = w_j^{(n)} - \eta \frac{\partial L(w^{(n)})}{\partial w_j^{(n)}}
    \quad (9.6)$

    ```


    To perform the backward pass (Eq. (9.6)), we need to calculate the partial derivatives
    of the loss with respect to the weights. However, the mean-squared-error loss
    $L$ for regression (Eq. (9.3)) is a function of predicted target values $\hat{y}_i$,
    and the cross-entropy loss $L$ for binary classification (Eq. (9.4)) is a function
    of predicted probabilities $\hat{p}_i$, which we evaluated in the forward pass
    (Eq. (9.5)). We therefore need to use the sum and chain rules to calculate these
    derivatives.


    The loss $L(w)$ can be written as a sum of losses for the individual samples:


    ```

    $L(w) = \sum_{i=0}^{N} L_i(w)$

    ```


    We can therefore calculate the partial derivatives by first using the sum rule


    ```

    $\frac{\partial L(w)}{\partial w_j} = \sum_{i=0}^{N} \frac{\partial L_i}{\partial
    w_j}$

    ```


    followed by the chain rule


    ```

    $\frac{\partial L(w)}{\partial w_j} = \frac{\partial L_i}{\partial \hat{y}_i}
    \frac{\partial \hat{y}_i}{\partial z_i} \frac{\partial z_i}{\partial w_j} \frac{\partial
    L_i}{\partial z_i} \frac{\partial f}{\partial z_i} \cdot x_{ij}$

    ```


    where $z_i = \sum_{j=0}^{D} w_{ij}x_{ij}$ (Eq. (9.1)).


    # Training linear regression


    For the linear regression, we have the sum-of-squared-errors loss with


    ```

    $L_i = \frac{1}{2}(y_i - \hat{y}_i)^2$.

    ```


    and the derivative is


    ```

    $\frac{\partial L_i}{\partial \hat{y}_i} = -(y_i - \hat{y}_i)$.

    ```


    which represents the error in the predicted target value. The activation function
    $f$ is identity (Fig. 9.2, left), therefore,


    ```

    $\frac{\partial f}{\partial z_i} = 1$.

    ```'
