  md: '# 9.1.1 Artificial neuron examples


    Perceptron


    The perceptron model that we described in Sect. 4.1.2 is an example of a single
    artificial neuron binary classifier. For the perceptron model the sum z (Eq. (9.1))
    is in fact the decision function l(x) (Eq. 4.1), the activation function f(z)
    is the *heaviside* function (Fig. 9.2, middle) and the loss function is the perceptron
    criterion (Eq. (4.1)). The perceptron model is however not commonly used in deep
    learning because of difficulties with training due to its nondifferentiable activation
    function.


    # Linear regression


    Linear regression (Sect. 3.1) is an example of a single artificial regressor,
    where we choose the identity function f(z) = z as an activation function (see
    Fig. 9.2, left) and therefore the sum z is identical to the output $\hat{y}$.
    The loss L is the *sum-of-squared-error* loss


    ```

    $L(\hat{y}) = \frac{1}{2} \sum_{i=1}^{N} (y_i - \hat{y}_i)^2,$$

    ```


    where i represents the individual training samples and $\hat{y} = (\hat{y}_1,
    \dots, \hat{y}_N)^T$ represents the predicted target values.


    # Logistic regression


    Logistic regression (Sect. 4.1.3) is another example of a single artificial neuron
    binary classifier. The sum $z$ is the decision function $h$, and the activation
    function $f(z)$ is the sigmoid


    Figure 9.1 An artificial neuron. Inputs $x_j$ are multiplied by learnable weights
    $w_j$ (synaptic connections). Their sum $z = \sum x_j w_j$ is then passed through
    the activation function $f(z)$ to determine the neuron output $\hat{y}$.


    minimize suitable loss L(W). We have already seen several examples of artificial
    neuron models, as we show in the next section.


