    Note that this model selected the highly nonlinear feature 3, even though it does
    not have a unique relationship to the target values. This relationship can be
    resolved with unique relationships provided by the features 1 and 2. We can see
    that the random forest regressor successfully use highly nonlinear features.


    # 8.2.4 Recursive feature elimination


    The recursive feature elimination algorithm iteratively eliminates the least important
    features, based on the feature importances calculated by a fitted machine learning
    model. It iterates between these two steps:


    +   - Fit the model to the current set of features;

    - Eliminate the least important feature.


    The algorithm ranks all the features from the most important (the ones that were
    removed last) to the least important (the ones that were removed at the very beginning).'
