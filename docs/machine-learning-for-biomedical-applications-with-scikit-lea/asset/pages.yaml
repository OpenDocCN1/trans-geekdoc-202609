    # 11.4. CNN segmentation for medical images


    Segmentation is a very important task for processing of medical images. It enables
    extraction of quantitative measures, such as volumes of brain structures or indices
    of cardiac function, including ejection fraction and global longitudinal strain,
    which we have used in the previous chapters. Training convolutional neural networks
    for medical image segmentation, however, comprises unique challenges. Medical
    images are 03D, with hundreds of thousands or even millions of voxels. On the
    other hand, training data is very difficult to obtain because manual segmentation
    of these large 3D images are time-consuming. Therefore, the segmentation networks
    often need to be trained with a small number of segmented images, with data sets
    including hundreds or even tens of samples.


    In spite of these challenges, CNN segmentation has been extremely successful in
    medical imaging, due to specific approaches to deal with smaller datasets. These
    include:


    +   * using smaller networks with fewer layers and weights;

    * data augmentation, where the dataset is labeled by random spatial and intensity
    transformations [35,38];

    * employing encoder-decoder architectures, that reduce network overfitting [38].

    In this final section of the book, we will implement a CNN to segment cortex in
    neonatal MRI. But extension to multi-label segmentation is straightforward. The
    solution is based on encoder-decoder network called U/Net [38], called after its
    U-shape architecture (Fig. 11.9), or mTNet, consistently outperforms other architectures
    for medical image segmentation [23].


    > 4 Skeleton code and solutions for exercise 1 is available from github.com/MachineLearningBiomedicalApplications/notebooks.


    > 5 The dataset is available from gin.g-node.org/MachineLearningBiomedicalApplications/data.
    Code to load this dataset was provided in Chap. 8.


    > 6 Code available from github.com/MIC-DKFZ/nnUNet.'
