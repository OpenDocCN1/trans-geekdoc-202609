  md: 'Decision trees and ensemble learning 157


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_175_0.png)


    which threshold, to make at each stage?


    Like machine learning models, decision tree splits are parameterized via optimizing
    a cost function, where the appropriate choice of cost varies for classification
    and regression. Typical regression losses include those that we have seen before,
    specifically mean square error (MSE) and mean absolute error (MAE), where since
    trees a constant y for each branch, this branches to the value that is, on average,
    closest to the ground-truth values of the data points within that range.


    Decision tree classifiers focus more on nodes of purity than accuracy scores or
    counts of false positives/negatives. Specific examples include: information gain,
    which represents the decrease in entropy obtained after a dataset is split on
    an attribute; and gini impurity, which reflects how the classes are following
    the split. Let''s look at these in more detail, starting with a definition of
    entropy.


    Entropy: is an estimate of the amount of disorder in a system. It is calculated
    for decision tree classifiers, by considering the distribution of labels over
    all classes, at the node j,


    ```

    $H(S_j) = -\sum_{y\in Y} p(y_k) \log_2 p(y_k).$ (7.1)

    ```


    Here, Y are the class labels (e.g., (0, 1) for a binary problem), and $p(y_k)$
    is the proportion of examples that have class $k$, for the node under consideration
    $(j)$.


    Calculating entropy for decision tree nodes acts as a proxy for how separated
    data examples are for split. For example, Fig. 7.6 demonstrates three class partitions,
    for a two-class classification problem. In the left case, the group contains 5
    examples of each class, with $p(y_1)=p(y_2)=5/10=0.5$; this returns maximum entropy
    $H=(-0.5\log_2 0.5+0.5\log_2 0.5)=1$. The second group contains 2 circles and
    7 signs, with proportions $p(y_1)=2/9$ and $p(y_2)=7/9$, with entropy $H=(-2/9\log_2
    2/9+7/9\log_2 7/9)=0.7642$. The third group only has signs making its entropy
    to zero $(H=-1\log_2 1+0=0)$; this is the minimal entropy, meaning that the proposed
    split is pure. The objective of decision tree classifiers, there, is, to return
    leaf nodes with zero entropy.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Information gain for a classification tree node is a measure of the change
    in entropy of the system when data is split from the parent node into the two
    child nodes. It is estimated as the relative difference between the entropy of
    the parent $H(S_j)$ and a weighted sum of the entropies of the children $(H(S^i))$:


    ```

    $I(S_j) = H(S_j) - \sum_{i \in L,R} \frac{|S_i|}{|S_j|} H(S_i). \quad (7.2)$

    ```


    Here, $|S_j|$ represents the number of samples reaching the parent node, and $|S|$
    represents the number of samples in each child node. As the objective is to reduce
    entropy for each subsequent layer of the tree, *information gain* must be maximized.


    *Gini impurity*, on the other hand, takes a simpler approach, estimating the probability
    of misclassifying an example, based solely on the class probabilities $p(y_k)$.
    More specifically, it is computed by multiplying the probability of labeling class
    $p(y_k)$, with the probability $\sum_{k \neq i} p(y_k) = 1 - p(y_k)$ of labeling
    a different class, summed over all classes. This can be reduced to


    ```

    $Gini = \sum_{k}^K p(y_k)(1 - p(y_k))\n= \sum_{k}^K (p(y_k) - p(y_k)^2)\n= \sum_{k}^K
    p(y_k) - \sum_{k}^K p(y_k)^2\n= 1 - \sum_{y_k \in Y} p(y_k)^2. \quad \quad (7.3)$

    ```


    This represents the impurity of a single node, the full cost of any proposed split
    must be estimated by combining estimates of impurity, for the left and right splits,
    as the weighted sum


    ```

    $I(S_j, \theta_j) = \sum_{i \in L,R} \frac{|S_i|}{|S_j|} Gini_i. \quad \quad (7.4)$

    ```


    For Gini'
