  md: "# 1.7. Functions\n\nFunctions allow compact structuring of sections of code\
    \ that are intended to be used more than once in a program (or indeed multiple\
    \ programs). A function in Python is defined by a `def` statement. In pseudocode,\
    \ the general syntax looks like this:\n\n```\ndef function(arg1,arg2,arg3):\n\
    \    body of code to be repeated\n    return someval,someval\n```\n\nwhich takes\
    \ input arguments `arg1`, `arg2`, and `arg3`, performs operation(s), and outputs\
    \ variables `someval` and `some2`. As with control flows, the function definition\
    \ is `followed by a colon`, and all code within the function is `indented` relative\
    \ to the `def` statement. For simple functions the function can returned in one\
    \ line, e.g.,\n\n```\ndef sum(x,y):\n    return x+y\n```\n\nIt is also possible\
    \ to supply optional input arguments with default values, e.g., `z` in this example:\n\
    \n```\ndef sum2(x,y,z=0):\n    return x+y+z\n```\n\nwhereby, it is possible to\
    \ call the function either with, or without, z:\n\n```\na=5; b=10; c=20\n\nsum_of_a_and_b=sum2(a,b)\n\
    sum_of_a_b_and_c=sum2(a,b,c)\n```\n\nAlternatively, it is possible to specify\
    \ which exact optional arguments are required through the use of keywords (referencing\
    \ the specific argument name in the function call):\n\n```\ndef sum3(x, y, z1=0,\
    \ z2=0):\n    return x - y + z1 - z2\n```\n\n```\n@ apply function\n\na=5; b=10;\
    \ c=20; d=30\n\na_minus_b=sum3(12,4)\na_minus_b_minus_d=sum3(42,15,z2=10)\na_minus_b_plusc_minus_d=sum3(42,15,z1=20,\
    \ z2=10)\n```"
