  md: '# CHAPTER 6


    # Clustering


    In Chap. 2 we have shown that the dataset can be clustered into groups of similar
    samples (Sect. 2.2.3). We have seen in Sects. 2.1.2 and 2.2.3 unsupervised image
    segmentation is one of the most applications of clustering algorithms. In particular,
    we have seen how k-means clustering can be used to segment brain MRI into white
    matter (WM), grey matter (GM), and cerebrospinal fluid, each using a single feature
    (T1-weighted pixel or voxel intensity in Fig. 2.5) or a pair of features (T1-
    and T2-weighted intensities in Fig. 2.3). More advanced segmentation that often
    contain a clustering algorithm within their pipeline can delineate multiple structures
    or objects in the image, as we have seen in the example of 86 brain structures
    in Chap. 3 and Fig. 3.1.


    In this chapter we will revisit k-means clustering in Sect. 6.1 and introduce
    the Gaussian mixture model in Sect. 6.2. In Sect. 6.3 we will describe spectral
    clustering, which is particularly suitable for high-dimensional nonlinear feature
    spaces.


    # 6.1. K-means clustering


    Clustering is an unsupervised machine-learning task, where training labels are
    not given. We therefore need to split the samples into groups according to some
    predefined criterion. One of the simplest ideas is that within-cluster variance
    $\sigma_W^2$ can be expressed as a sum of cluster variances $\sigma_k^2$ weighted
    by the size $n_k$ of the cluster k


    ```

    $$\sigma_W^2 = \sum_{k=1}^{N} \frac{n_k}{N} \sigma_k^2. \quad (6.1)$

    ```


    where $n_k$ is the number of samples in the cluster $k$, $K$ is the number of
    clusters and $N$ is the number of all samples.


    # 6.1.1 K-means algorithm


    So, can we minimize the within-cluster variance $\sigma_W^2$? First, let''s write
    down the expression for variance of the cluster k:


    ```

    $$\sigma_k^2 = \frac{1}{n_k} \sum_{i \in S_k} |x_i - \mu_k|^2$

    ```'
