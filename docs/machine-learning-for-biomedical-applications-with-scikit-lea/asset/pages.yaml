    # 10.2.3 Backpropagation


    In this section we provide an in-depth mathematical explanation of the backpropagation
    algorithm. In Sects. 9.1.2 and 9.3.1, we have shown how the single-layer neural
    network can be trained in two steps—first predicting the outputs using the current
    estimate of the weights in the forward pass (Eq. (9.5)) and then updating the
    weights of the network (Eq. (9.6)) based on the errors between the predicted and
    desired outputs (Eq. (9.7) and (9.8)) in the backward pass. While expanding the
    forward pass to multiple layers is straightforward (Eq. (10.1) and (10.2)), the
    backward pass is slightly more complicated because the loss $L$ is directly calculated
    only from the errors in outputs $a_k^{(M)}$ of the final layer $M$. In order to
    calculate the gradients of the weights in all layers, we will backpropagate the
    output errors from the final layer $M$ to the lower layers.


    # Backpropagation works


    To calculate how the weights need to be updated to decrease the loss $L_i$ for
    a training sample $i$, we will keep track of the quantities $\delta_{ik}^{(l)}$
    defined as the gradient of the $L_i$ with respect to the total input $z_{ik}^{(l)}
    = \sum_{j=1}^{D_{l-1}} w_{ji}^{(l)}\delta_{jk}^{(l-1)}$ of the neuron in layer
    $l$'
  merge: -1
  img_proc: true
