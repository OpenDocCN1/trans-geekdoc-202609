  md: '# Derivation of the normal equation


    We will now have an in-depth look at the normal equation (Eq. (3.6)). The solution
    $\hat{\mathbf{w}}$ will be the minimum of the loss function $L(\mathbf{w})$. It
    is therefore necessary that the first derivative at the minimum is:


    ```

    $\frac{\partial L(\mathbf{w})}{\partial \mathbf{w}} = 0$

    ```


    To calculate the first derivative of Eq. (3.5), we will first use the product
    rule and then simplify the expression:


    ```

    $\frac{\partial L(\mathbf{w})}{\partial \mathbf{w}} = \frac{\partial \frac{1}{2}(\mathbf{y}-\mathbf{Xw})^T(\mathbf{y}-\mathbf{Xw})}{\partial
    \mathbf{w}} = \frac{1}{2}(\mathbf{y}-\mathbf{Xw})^T(-\mathbf{X}) + \frac{1}{2}(-\mathbf{X})^T(\mathbf{y}-\mathbf{Xw})
    = -\mathbf{X}^T(\mathbf{y}-\mathbf{Xw})$

    ```


    We can now set the first derivative to zero and find the expression for $\mathbf{w}$:


    ```

    $-\mathbf{X}^T(\mathbf{y}-\mathbf{Xw}) = 0\n$\mathbf{X}^T\mathbf{Xw}=\mathbf{X}^T\mathbf{y}\n$\mathbf{w}
    = $(\mathbf{X}^T\mathbf{X})^{-1}\mathbf{X}^T\mathbf{y}$

    ```


    # Implementation of normal equation in NumPy


    Let''s assume that we have a feature $X$ and a target vector $y$. We first need
    to add the feature $x_0=1$ using `np.hstack` to create a new feature $x_1$ (Eq.
    (3.2)).


    ```

    x0 = np.ones([X.shape[0],1])

    x1 = np.hstack([x0,X])

    ```


    We use a case of matrix multiplication using `np.matmul` and matrix inversion
    `np.linalg.inv` to implement Eq. (3.6).


    ```

    XtX = np.matmul(X1.T,X1)

    ty = np.matmul(X1.T,y)

    w = np.matmul(np.linalg.inv(XtX),X)

    ```


    We can calculate predicted target values `y_pred` using the estimated weight vector
    $\mathbf{w}$ (Eq. (3.3)):


    ```

    y_pred = np.matmul(X1,w)

    ```'
