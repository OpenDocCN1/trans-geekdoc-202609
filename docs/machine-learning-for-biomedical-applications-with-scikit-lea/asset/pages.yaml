- pgno: 19
  md: '# CHAPTER 1


    # Programming in Python


    The purpose of this chapter is to introduce the key features of Python coding
    that are needed to follow the content of this book. While MATLAB® remains the
    language of choice for biomedical engineers, we insist on training in Python because
    it is increasingly the dominant language of data science and machine learning.
    As well as being arguably better resourced and supported for such problems, Python
    is open-source, and forms the backbone of Pytorch and Tensorflow, the most commonly
    used deep learning libraries. This chapter assumes basic knowledge of coding,
    and focuses predominantly on core Python functionality and syntax. However, many
    of the most powerful features of Python involve importing external libraries.
    Here, we introduce NumPy [32], a package that provides support for multidimensional
    array manipulation and linear algebra. Further details of other important packages
