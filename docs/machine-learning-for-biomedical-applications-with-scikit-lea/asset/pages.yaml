- pgno: 24
  md: '# 1.2.2 Grouping structures


    In addition to simple data types, Python provides a range of different structures
    for storing variables. The key types (ignoring arrays and matrices, for the time
    being) are lists, tuples and dictionaries. The most important differences to be
    aware of when reviewing these types of structures is whether they store objects
    in order, and whether they are mutable.


    # Mutable and immutable objects


    The definition of a mutable object is one that may be changed after creation.
    All built-in simple Python variables (int, float, strings, Booleans) are immutable
    and therefore fixed. This means that, when a different value is assigned to a
    previously created variable, e.g.,


    ```

    my_var=5

    my_var=7

    ```


    the location in memory of these two instances of my_var will change, indicating
    that an entirely new variable has been created. This can be verified by running
    id(my_var) after each line of code.


    For group structures, the impact of this property is more noticeable since an
    attempt to assign a new variable to any location in an immutable group structure,
    e.g.,


    ```

    my_tuple=(1,2,3)

    # attempt to change the first item

    my_tuple[0]=4

    ```


    will cause Python to throw an error. The same thing happens if you try to assign
    a new character to an existing string.

    There are, however, many occasions when changing a data structure can be useful.
    For example, one can imagine creating a database of patient information where
    the contact information might change. For these occasions, we have mutable objects:
    dictionaries and lists.


    # Lists


    A list is an ordered collection of objects. These elements don''t have to be of
    the same type but can be an arbitrary mixture of numbers, strings, or other types
    of objects.'
