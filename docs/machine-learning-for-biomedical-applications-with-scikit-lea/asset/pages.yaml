    ```

    $$\hat{y} = \begin{cases} 1 & \text{if } h(\mathbf{x}) \geq 0 \ 0 & \text{if }
    h(\mathbf{x}) < 0 \end{cases}$

    ```


    We have already introduced an example of binary linear classification in Sect.
    2.1.1. In this example we predicted whether the patient is healthy or has heart
    failure (mild or serious) from two features (EF and GLS), see Fig. 2.2. In Fig.
    4.1 we visualize the decision function $h(\mathbf{x})$ for this example as a 2D
    plane embedded in 3D space. The decision boundary $h(\mathbf{x})=0$ is a 1D line,
    defined by the intersection of the decision function with the zero plane. The
    decision boundary separates the 2D feature space into two regions.


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_106_0.png)


    Figure 4.1 Binary classification for 2D feature vectors.


    # 4.1.2 Perceptron


    The objective of a binary classification model is to find the decision function
    (Eq. (4.1)) so that the resulting predicted labels match the training labels as
    closely as possible. The perceptron model achieves this by penalizing the misclassified
    labels proportionally to the absolute value of the decision function, called a
    perceptron criterion


    ```

    $$\hat{\mathbf{w}} = \arg\max_{\mathbf{w} \in \mathcal{M}} \sum |h(\mathbf{x}_i)|,
    \quad (4.2)$

    ```'
