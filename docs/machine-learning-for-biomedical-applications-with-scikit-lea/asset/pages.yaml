  md: "# Ridge regression\n\n# Lasso regression\n\n![](img/d219b4c20ff50f4b97845dec7a9acecb_96_0.png)\n\
    \n**Figure 3.6** Solutions of penalized regression for three different values\
    \ of $\\lambda$. The red star represents the nonpenalized solution, and green\
    \ circle represents the solution with medium penalty, while large penalty results\
    \ in a solution close to zero, depicted by a yellow square. For each $\\lambda$,\
    \ the solution needs to lie within the circle $|w_i| \\leq \beta$ for ridge or\
    \ the square $|w_i| \\leq \beta$ for lasso. The sum of squared error loss is depicted\
    \ by the background color, with blue representing small values and yellow large\
    \ values.\n\nand these will decrease faster with ridge than with lasso. Lasso\
    \ therefore produces sparse weights, preserving the larger weights, while forcing\
    \ the smaller weights to zero. On the other hand, the ridge penalty decreases\
    \ all weights at the same time.\n\nLet's demonstrate this on a simple example\
    \ where we seek to recover the model $y = 2x_1 + x_2$ from a noisy dataset. The\
    \ solution to this regression problem is $w_1 = 2$ and $w_2 = 1$, as depicted\
    \ in Fig. 3.6 by a red star. Because the noise in the dataset is minimal, the\
    \ solution is recovered almost exactly by linear regression with no penalty ($\\\
    lambda = 0$). The nonpenalized sum of squared errors loss (Eq. (3.1)) is depicted\
    \ by the background color and has a minimum (dark blue) around the solution.\n\
    \nThe solution for penalized regression can also be obtained using optimization,\
    \ where we minimize the sum of squared errors loss (Eq. (3.1)) to a constraint\
    \ $|w_2| \\leq B$ for ridge and $|w_1| \\leq B$ for lasso, where for each $\\\
    lambda$ we can find a suitable $B$. As we increase $\\lambda$, $B$ decreases,\
    \ and the solution moves away from the minimum of the sum-of-squared-errors loss\
    \ towards zero because the size of $w$ is restricted. In the case of ridge regression,\
    \ both weights are decreasing proportionally, and the solution follows a straight\
    \ path to the zero. On the other hand, the lasso penalty decreases the smaller\
    \ weight $w_2$ faster, eventually forcing it to zero, while the larger $w_1$ is\
    \ still nonzero, producing a sparse solution. By this property, the lasso penalty\
    \ is often used for feature selection.\n\n> 3 This can be shown using Karush-Kuhn-Tucker\
    \ conditions."
