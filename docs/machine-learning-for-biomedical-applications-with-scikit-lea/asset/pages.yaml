    # 8.1.3 Transform based features


    A classical transformation for extraction of features from signals is the Discrete
    Fourier Transform (DFT). The signal s(t), which is normally defined as a function
    of time t, is transformed into f(u) in a frequency domain


    ```

    f(u) = \sum_{t=0}^{N-1} s(t)e^{-2\pi iut/N}, u = 1, ..., N-1,

    ```


    f(u) is the complex transformed coefficients of the signal s that tells us how
    much of each frequency u is present in the signal s, N is the number of samples,
    and


