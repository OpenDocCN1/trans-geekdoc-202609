    # ## 10.4. Conclusions


    We have now seen the design, training, and evaluation process for fully connected
    neural network. We have seen that one of the primary advantages of fully connected
    neural networks is their flexibility to adapt to complex patterns in the data,
    demonstrated in Sect.10.1. However, their disadvantage is a large number of parameters
    and resulting overfitting, as we have seen in Sect. 10.3. In fact, the fully connected
    networks are not very different from classical machine learning models presented
    in later chapters of this book and may perform any better. The power of neural
    networks can be seen when the convolutional layers are introduced and more complex
    tasks, such as image segmentation, are attempted. We will demonstrate this in
    Chapter 11.


    Once we start working with large databases of images, rather than relatively compact
    feature matrices, we will also need to spend paying attention to computational
    resources, such as the training time and amount of memory. The problems with training
    time are addressed using a GPU to train networks and predict the outputs. The
    problems with memory can be addressed by training in smaller batches, rather than
    using the whole dataset, and loading these batches directly from the disk, rather
    than run-time memory. Training in batches also decreases the training time, as
    we explained in Sect. 3.1.2.


    These advanced concepts and techniques are the topic of the final chapter of this
    book.'
