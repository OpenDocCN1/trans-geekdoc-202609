  md: '# CHAPTER 2


    # Machine learning basics


    # 2.1. What is machine learning?


    Over the last 50–70 years, computer programs have become more and more important
    in solving various problems. A traditional way of building a computer program
    is to write a set of rules and execute them to calculate some outcomes. For example,
    processes fully determined by laws of physics, such as radioactive decay at a
    particular time point, can be predicted according to the simple formula $A = A_0
    \exp(-\lambda t)$, where $t$ is time, $\lambda$ is the decay constant, $A_0$ is
    the activity at $t=0$, and $A$ is the predicted activity at time $t$. A more sophisticated
    example is a complex and precise calculation of the path of the Rosetta probe
    that landed on a comet in 2014 after 10 years of journeying from the Earth.


    For many real-life problems it is difficult to write a set of rules because the
    underlying processes are too complex or not completely understood. Many biomedical
    applications fall into this category. Let''s take the example of brain growth
    during the last trimester of pregnancy. In a clinical setting we can measure the
    head circumference as a proxy for the brain size using fetal ultrasound. But how
    do we know whether the brain is healthy? We need to collect a large number of
    measurements, also called samples, and learn the pattern of normal growth from
    the collected data. For each patient we need to record the gestational age (age
    from the beginning of the pregnancy) and head circumference, and calculate the
    growth curve from this dataset. For each new patient, the growth curve determines
    the normal head circumference depending on the gestational age.


    A machine learning system is programmed to learn a mathematical model for training
    data, and it is therefore trained rather than explicitly programmed. In brain-growth
    example, the model that needs to be learned is the growth curve, and the training
    data consists of the gestational age and head circumference for a number of healthy
    fetuses. The machine learning task is to predict the head circumference from the
    gestational age of a fetus.


    In the remainder of this chapter, we will introduce various machine learning tasks,
    describe them using mathematical notation, and demonstrate how these tasks can
    be learned using the scikit-learn library.


    # 2.1.1 Supervised learning: regression and classification


    In supervised learning the task is to learn a model from a set of training samples
    that contain some measured inputs, also called features, and expected outputs.
    If the out-'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'puts are continuous, they are called target values, and a machine learning
    algorithm that finds a model to predict continuous target values from a set of
    features is called a regression.


    Prediction of the brain volume from the gestational age is an example of a regression
    task. In this case, the feature is the gestational age, and the target value is
    the brain volume. In a research setting we are able to accurately calculate brain
    volumes from segmented high-resolution volumetric magnetic resonance images (MRI).
    Fig. 2.1 shows the prediction of the brain volume from the gestational age in
    scans of preterm neonates using linear regression.


    # Regression


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_60_0.png)


    **Figure 2.1** Example of a regression problem: prediction of brain volume from
    gestational age in preterm neonates.


    If the expected outputs are discrete, they are called labels, and the machine
    learning task is called a classification. Diagnosis of heart failure using ultrasound
    or magnetic resonance imaging is an example of the classification task. Diagnostic
    measurements include the percentage of blood that the left ventricle can inject
    at each heartbeat and the global longitudinal strain between diastole and systole,
    two features per sample (or a two-dimensional feature vector). Our aim is to find
    a model to predict whether the patient is healthy or has heart failure, which
    we call a label. In this case the labels take only two values: label 0 for the
    healthy patient and 1 for the patient with heart failure. Our example classification
    problem is illustrated in Fig. 2.2.


    # 2.1.2 Unsupervised learning: clustering and dimensionality reduction


    In unsupervised problems the training samples are also characterized by the feature
    vectors, but outputs are not known, and we look for hidden patterns in the data
    instead.'
  merge: -1
  img_proc: true
