  md: "# 10.1.4 Multilayer perceptron architecture in PyTorch\n\nWe will now show\
    \ how we can create the multi-layer network architecture in PyTorch. To separate\
    \ the circles in Fig. 10.1, we will create a multilayer perceptron classifier\
    \ with two layers, implemented by the class Classifier. The first layer has two\
    \ inputs, defined by the dimension of the input data, and six outputs. The second\
    \ layer has six inputs, which are the outputs of the first layer, and one output\
    \ because this is a binary classifier. Between the two layers, we place a nonlinear\
    \ activation function ReLU. The output of the second layer is passed through a\
    \ sigmoid activation function to enable binary classification. Finally, we create\
    \ an instance of the network:\n\n```\nimport torch.nn as nn\nclass MLPClassifier(nn.Module):\n\
    \    def __init__(self, classifier):\n        super(MLPClassifier, self).__init__()\n\
    \        self.layer1 = nn.Linear(2, 6)\n        self.relu = nn.ReLU()\n      \
    \  self.layer2 = nn.Linear(6, 1)\n        self.sigmoid = nn.Sigmoid()\n\n    def\
    \ forward(self, x):\n        x = self.layer1(x)\n        x = self.relu(x)\n  \
    \      x = self.layer2(x)\n        x = self.sigmoid(x)\n        return x\n```\n\
    \n```\nnet = MLPClassifier()\n```\n\n# 10.2. Training neural networks\n\n# 10.2.1\
    \ Training a multilayer perceptron\n\nTo train the multilayer perceptron and also\
    \ deep neural networks in general, we need to evaluate the gradients with respect\
    \ to learnable weights $w_l$ in all layers so that we update them at each iteration\
    \ or epoch, as we have done with single-layer perceptron (Eq. (9.13)). We do that\
    \ by calculating the gradients of the weights iteratively, starting from the final\
    \ layer $M$ and working our way towards the lower layers. This is called backpropagation\
    \ [40]. In the practice, in Sect. 10.2.3, the backpropagation is performed in\
    \ PyTorch automatically by Autograd (see Sect. 9.2.3)."
