    # 2.1.4 Summary


    In this section we summarize the various machine learning tasks and algorithms
    to learn the tasks covered in this book.

    **A machine learning task is:**


    | Supervised: if we have both the features and the expected outputs for the training
    samples | Regression: if the outputs are continuous **Classification:** if the
    outputs are discrete |

    | Unsupervised: if we have only features for the training samples | Clustering:
    if the similar features are grouped together to form clusters

    **Dimensionality reduction:** if the number of features is reduced while preserving
    important properties of the data. |


    The **machine learning algorithms** covered in this book:


    | Regression: | Linear, ridge and lasso regression

    Polynomial regression

    Kernel ridge regression

    Random-forest regression

    (Deep) neural network regression |

    | Classification: | Perceptron

    Logistic regression

    Support-vector classification

    Random-forest classification

    (Deep) neural network classification |

    | Clustering: | K-means

    Gaussian mixture model

    Spectral clustering |

    | Dimensionality reduction: | Principal component analysis

    Independent component analysis

    Laplacian eigenmaps |


