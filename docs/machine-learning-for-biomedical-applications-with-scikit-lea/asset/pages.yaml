    ```


    We see that activation functions do not change the shape of the output feature
    maps.


    # ## 11.2.3 Downsampling


    An important feature of convolutional networks is that they use downsampling to
    create the receptive field of filter kernels to be able to learn to recognize
    objects across a hierarchy of scales. While early layers recognize low-level features,
    as sharp edges, middle layers can then learn more complex textures and shapes,
    building towards the deep layers recognizing the whole objects. There are two
    different mechanisms for downsampling in CNNs: pooling and striding.


    # ### Pooling


    Pooling works by applying a pooling kernel typically to nonoverlapping patches
    of an image. Pooling kernels perform maximum or averaging operations to produce
    downsampled outputs.


    Fig. 11.5 shows and example of max pooling, implemented by a pooling filter shape
    2 x 2 and a stride of 2. In this example, the image is split into 2 x 2 nonoverlapping
    blocks by different colors. The max-pooling filter takes the maximum of each block
    as an output. Because there is only one output value for each 2 x 2 block, the
    image is downsampled by a factor of 2.


    | 1 | 9 | 2 | 7 |

    |---|---|---|---|

    | 4 | 3 | 6 | 2 |

    | 1 | 4 | 8 | 8 |

    | 0 | 3 | 7 | 9 |


    Take max value of each block


    | 9 | 7 |

    |---|---|

    | 3 | 9 |


