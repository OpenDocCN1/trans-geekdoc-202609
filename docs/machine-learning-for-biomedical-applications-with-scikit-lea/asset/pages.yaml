  md: "# 3.3.2 Kernel trick\n\n# Dual representation\n\nAn alternative way to turn\
    \ a linear model into a nonlinear one is to use the **kernel trick**. First, we\
    \ will change the parameters of our model **w** to a **dual representation** a\
    \ defined as\n\n```\nw = \\Phi^T a.\n```\n\nLet us now find out what this representation\
    \ means. First of all, the weight vector **w** has dimension $D$, which is the\
    \ number of features. The feature matrix $\\Phi$ is $D \times N$, and therefore\
    \ dimension of the dual representation a is $N$, with one parameter $a_i$ per\
    \ **sample**. Let's now have a look at the new regression model\n\n```\n\\hat{y}\
    \ = \\phi(\\mathbf{x})^T\\mathbf{w} = \\phi(\\mathbf{x})^T\\Phi^T a = \\sum_{i=1}^{N}\
    \ \\phi(\\mathbf{x})^T\\phi(\\mathbf{x}_i)a_i.\n```\n\nThe regression model then\
    \ becomes a linear combination of **kernels** $\\kappa$\n\n```\n\\kappa(\\mathbf{x},\
    \ \\mathbf{x}_i) = \\phi(\\mathbf{x})^T\\phi(\\mathbf{x}_i)\n```\n\nthat define\
    \ the **similarity** between two feature vectors. In this case we calculate a\
    \ similarity between a training sample $\\mathbf{x}_i$ and a new sample $\\mathbf{x}$\
    \ for which we would like to evaluate the model. The most common choice for the\
    \ kernel $\\kappa$ is the **Gaussian kernel**:\n\n```\n\\kappa(\\mathbf{x}, \\\
    mathbf{x}_i) = \\exp(\\left(\\frac{|\\mathbf{x}-\\mathbf{x}_i|_2^2}{2\\sigma}\\\
    right).\n```\n\nwhere $|\\mathbf{x}-\\mathbf{x}_i|_2 = \\sqrt{\\sum_{j=1}^{D}(x_j-x_{ij})^2}$\
    \ is the Euclidean distance between two feature vectors. The Gaussian is shown\
    \ in Fig. 3.9. Note that pairs of features with larger distances have smaller\
    \ similarity $\\kappa$, while identical feature vectors have the largest similarity.\n\
    \n![](img/d219b4c20ff50f4b97845dec7a9acecb_101_0.png)\n\nFigure 3.9 Gaussian kernel."
  merge: -1
