    \ distances through $k$-NN graph. Top: green edges connect the 3 nearest neighbors\
    \ of every point from the distribution; Middle: black arrows indicate the shortest\
    \ path through the graph; Bottom: for correct choice of $k$ this will approximate\
    \ a geodesic along the manifold.\n\n+   1. Construction of the *adjacency* matrix\
    \ through calculation of squared Euclidean distances between all data points:\
    \ $SSD = \\sum(\\mathbf{x} - \\mathbf{x}_i)^2$;\n2. Set all the $k$ smallest distances\
    \ in each row to zero; then set all remaining distances to 1;\n3. Calculate the\
    \ *degree* matrix by summing the total number of neighbors of each node: $\\mathbf{D}\
    \ = \\sum \\mathbf{A}$; then\n4. Subtract the adjacency matrix from the degree\
    \ matrix to return the graph Laplacian: $\\mathbf{L} = \\mathbf{D} - \\mathbf{A}$\n\
    \nFor a set of $N$ examples, $\\mathbf{A}$ should be a $N \times N$ shaped matrix,\
    \ where each row represents each node and the entry column indicates which examples\
    \ are neighbors of that node. The first step in calculation is therefore to estimate\
    \ the squared distances between all points (since we are interested only in the\
    \ magnitude of the separation and not the direction). **A** is initialized with\
    \ all zeros; then, each row is populated with $1$ s"
