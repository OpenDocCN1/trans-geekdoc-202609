  md: '# 7.2.1 Motivation


    Take this toy example, where we have a test set for which the ground truth is
    class “1” for all ten examples:


    ```

    $y = {1, 1, 1, 1, 1, 1, 1, 1, 1} \quad (7.13)

    ```


    Let’s assume that we train three classifiers $A, B$ and $C$, and these return
    different predictions, each with 30% error


    ```

    $$\hat{Y}_A = {1, 1, 0, 0, 1, 1, 1, 0, 0} \quad (7.14)\n$\hat{Y}_B = {0, 0, 1,
    1, 1, 0, 1, 0, 1} \quad (7.15)\n$\hat{Y}_C = {1, 1, 1, 0, 0, 1, 1, 0, 1} \quad
    (7.16)

    ```


    Each model makes mistakes on different examples. This means that, if we fuse the
    predictions across all three models through majority voting (assigning each example
    the label predicted most commonly across all constituent models), then the resulting
    prediction is 90% accurate


    ```

    $$\hat{Y}_{ensemble} = {1, 1, 1, 1, 1, 1, 1, 0, 1} \quad (7.17)

    ```


    By contrast, if we instead had three highly correlated prediction models:


    ```

    $$\hat{Y}_D = {1, 1, 0, 1, 1, 1, 1, 0, 0} \quad (7.18)\n$\hat{Y}_E = {1, 1, 1,
    1, 1, 1, 1, 0, 0} \quad (7.19)\n$\hat{Y}_F = {1, 1, 0, 1, 0, 1, 1, 0, 0} \quad
    (7.20)

    ```


    then the potential gains throughsembling will be much less (or zero), i.e.,


    ```

    $$\hat{Y}_{corr,ensemble} = {1, 1, 0, 1, 1, 1, 1, 0, 0} \quad (7.21)

    ```


    The logic behind is therefore that, when decisions of uncorrelated prediction
    models are fused, the resulting prediction will have higher accuracy than any
    individual model.


    # 7.2.2 Classes of ensemble learning


    Ensemble methods come in several forms that can be broadly classed as homogeneous
    or heterogeneous, with the subtypes parallel and sequential models.


    Homogeneous models combine predictions from models trained on the same class of
    a machine learning method. For scikit-learn, the default base learning model is
    the decision tree, however, in principle, any classifier or regression model may
    be used. By contrast, heterogeneous models combine predictions trained from a
    variety of machine learning models. Colloquially, these methods are more often
    known as stacking models.'
