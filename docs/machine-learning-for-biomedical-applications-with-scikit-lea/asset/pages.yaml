    # 4.1.5 Evaluating performance of classifiers


    # Accuracy


    We have already seen in Sect. 2.2.2 that we can measure the performance of classifiers
    using the **accuracy** score, which is the proportion of the correctly classified
    samples. Accuracy works for both binary and multi-label classifiers and is the
    default classification performance measure in scikit-learn.


    We usually measure the accuracy error on the test set that has been excluded from
    the training, or using cross-validation on the training set, even though we can
    also check the accuracy on the whole training set to identify overfitting (Sect.
    2.3). To measure the accuracy using cross-validation, we can use scikit-learn
    function `cross_val_score` hyperparameters of the model, we use


    ```

    from sklearn.model_selection import cross_val_score

    model = LogisticRegression()

    scores = cross_val_score(model, X_train, y_train)

    print(round(scores.mean(),2))

    >>> 0.89

    ```


    This function will fit a model for each of the folds (number of folds can be set
    using parameter `cv`) and output one accuracy score per model. We print the average
    score over all folds, which tells us that 89% of samples were correctly classified
    for the example of the three-class prediction of heart failure (Sect. 4.1.4).
    To measure accuracy on the test set, we use the default scoring function of the
    model


    ```

    model.fit(X_train, y_train)

    score = model.score(X_test, y_test)

    ```


    Accuracy, has some limitations that it depends on the proportion of the data in
    each class. Let''s take an example dataset, with 90% of the samples with label
    1 and only 10% with label 0. If classifier assigns 1 to all the samples, it will
    achieve accuracy 0.9, even though it did not learn how to separate the classes.
    We call such a dataset **unbalanced**. In cases of unbalanced datasets, good accuracy
    will depend on the proportion of the samples in each class within the dataset.'
