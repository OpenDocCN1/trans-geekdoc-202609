    Interestingly, we ignore the distance between each point and itself and notice
    that the closest neighbors of the first row (with distances of 1 and 5) are not
    necessarily the distances highlighted in the first column. To create the adjacency
    matrix, we must first set the highlighted distances to 1 and all remaining distances
