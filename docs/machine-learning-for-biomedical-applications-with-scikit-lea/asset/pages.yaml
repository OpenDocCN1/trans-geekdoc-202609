    plt.plot(X[:,0][y==1], X[:,1][y==1],"bo")

    ```


    In scikit-learn we can also choose other types of affinity matrices to construct
    a Laplacian eigenmap. Symmetric k-NN graph is only one way to construct spectral
    embedding. The affinity matrix can be constructed from any measure of similarity
    between the pairs of samples. For example, Euclidean distances d between pairs
    of samples can be converted to similarities a using a Gaussian kernel


    > a = e^{d^2}


    This is implemented in scikit-learn


    ```

    model=SpectralClustering(affinity=''rbf'', gamma=0.0001)

    ```


    Finally, it is also possible to precompute the affinity matrix A and input it
    during fitting instead of the feature matrix X:


    ```

    model=SpectralClustering(affinity=''precomputed'')

    y = model.fit_predict(A)

    ```


