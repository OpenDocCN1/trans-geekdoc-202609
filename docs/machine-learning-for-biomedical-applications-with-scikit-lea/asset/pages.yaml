- pgno: 165
  md: '# Clustering 147


    we calculate the manifold embedding using eigen-decomposition of the graph Laplacian

    **L = D - A**, where **D** is the diagonal $degree$ matrix with number of nearest
    neighbours

    (or edges) for each node on diagonal, and zeros elsewhere. The new embedded space

    is defined by the eigenvectors corresponding to the predefined number of the smallest

    eigenvalues, except for the first which is always zero.


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_165_0.png)


    **Figure 6.4** Clustering of the manifolds dataset. Left: GMM fails to correctly
    separate the manifolds. Middle: k-neighbor graph used to build the nonlinear manifold
    embedding using a Laplacian eigenmap. Right: Spectral clustering correctly separates
    the manifolds.


    The graph Laplacian has one eigenvalue for each connected component of the

    graph. For this reason the smallest eigenvalue is always zero because there is
    at least

    one connected component and the first eigenvector is excluded from the

    embedding. In our example, we have two connected components in the graph.

    The graph Laplacian therefore has two eigenvalues, but one of them is excluded.

    The first embedded dimension therefore has zero eigenvalue and contains two discrete

    values that identify the two moon-shaped clusters—see Fig. 6.4, right.


    In Sect. 5.7 we have used the unnormalized graph Laplacian $L = D - A$. This is

    suitable when degrees of the nodes of the graph (e.g., the number of edges in
    each

    weighted graphs) are similar between the nodes. This is obviously the case

    of kNN graph because each node has a degree of approximately k. When degrees of

    todes vary, it is better to normalize the graph Laplacian, for example, by multiplying

    it by the inverse of the matrix D**


    **L = D^{-1}(D - A).**


    # 6.3.2 Spectral clustering in scikit-learn


