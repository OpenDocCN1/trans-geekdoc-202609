  md: 'function $\sigma$, shown in Fig. 9.2, right. The output of the logistic regression
    single-layer perceptron is not directly the label $\hat{y}_i$, but the probability
    $\hat{p}_i=f(z_i)$ for class 1, as we explained in Sect. 4.1.3. We use the *cross-entropy
    loss*


    ```

    $L(\hat{\mathbf{p}}) = \sum_{i=1}^N [y_i \log(\hat{p}_i) + (1 - y_i) \log(1 -
    \hat{p}_i)] \quad (9.4)$

    ```


    to train the logistic regression model. This model is a function of the predicted
    probability vector $\hat{\mathbf{p}}=(\hat{p}_1,\dots,\\hat{p}_n)^T$. It is convex
    and differentiable and therefore commonly used for deep learning classification.
    The predicted labels can be obtained by thresholding the probabilities $\hat{p}_i$
    at 0.5.


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_213_0.png)


    **Figure 9.2** Activation functions $f(z)$. Left: identity used in linear regression.
    Middle: Heaviside used in perceptron. Right: sigmoid used in logistic regression.


    # ## 9.1.2 Training an artificial neuron


    The artificial neuron can be trained with the gradient descent (Eq. 3.8), as explained
    in Sect. 3.1.2. The gradient descent iteratively updates the weights $\mathbf{w}$
    for a number of epochs. Each epoch $n$ is split into two steps:


    +   1. **Forward pass: Predict outputs.** Using currently estimated weights $\mathbfmathbf{w}^{(in)}$,
    predict the target values $\hat{y}_i^{(in)}$ (or probabilities $\hat{p}_i^{(in)}$)
    using Eqs. (9.1) and (9.2):


    ```

    $\hat{y}_i^{(n)} = f(\left(\sum_{j=1}^D w_j^{(n)} x_{ij}\right)) \\quad (9.5)$

    ```


    where $x_{ij}$ is the $j$th feature of the sample $i$.


    +   2. **Backward pass: Update model parameters.** Calculate the partial derivatives
    $\frac{\partial L(\mathbf{w})}{\partial w_j}$ of the loss $L$ with respect to
    the individual weights $w_j$ with the current estimate of the predictions $\hat{y}_i^{(n)}$
    or $\hat{p}_i^{(n)}$, and update the weights using the gradient descent'
