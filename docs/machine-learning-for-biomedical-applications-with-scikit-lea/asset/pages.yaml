  md: '# CHAPTER 9


    # Deep learning basics


    Modern deep learning is based on neural networks, which are one of the most versatile
    family of machine learning models. They can perform linear and nonlinear classification,
    regression, or dimensionality reduction, and are indeed base of the incredible
    success of modern deep learning.


    In this chapter we will introduce the basic building blocks necessary for understanding
    and implementing deep neural networks. Section 9.1 will introduce the concept
    of an artificial neuron, which is the smallest unit from which the neural networks
    are built. In Sect. 9.2 we will introduce PyTorch, the most modern library for
    implementation and training of the neural networks. We will conclude the chapter
    with the concept of single-layer perceptron in Sect. 9.3. Throughout the chapter
    we will demonstrate that linear classifiers regressors are in fact examples of
    single-layer neural networks. Using these simple examples, we will show how we
    can create regression, binary, and multi-label classification using neural networks.


    # 9.1. An artificial neuron


    Neural networks were inspired by how brains work. They are composed of artificial
    neurons that interact with each other. 9.1 shows a diagram of an artificial neuron.
    Inputs $x_j$ represent sensory information or the activity of other neurons that
    are connected with this artificial neuron through synapses $w_j$. The weights
    $w_j$ multiply the inputs $x_j$, and therefore represent the strength of the synaptic
    connections. The incoming signals are then collected in the body of the neuron,
    and their sum $z$ is passed through an activation function $f(z)$ resulting in
    the activity (or firing) of the neuron.


    The simplest neural network is composed of a single artificial neuron (Fig. 9.1).
    In this case, the inputs $x_j$ are the input features, and the output $\hat{y}$
    is the predicted target value or label.


    The artificial neuron can be written mathematically as


    ```

    $z = \sum_{j=0}^{D} w_j x_j$

    ```


    ```

    $$\hat{y} = f(z),$

    ```


    $\mathbf{w} = (w_0, ..., w_D)^T$ are the parameters of the model and index $j$
    represents the individual input features. We fit this model by finding the optimal
    weight vector $\mathbf{\hat{w}}$'
