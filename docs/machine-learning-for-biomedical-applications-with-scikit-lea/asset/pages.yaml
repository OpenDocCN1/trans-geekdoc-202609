    # ## 7.2.2 Feature importance


    Another aspect of tree-based ensembles is that they balance performance with interpretability
    very well. Since decision stumps make predictions by thresholding features, it
    becomes very easy to trace which features are most discriminative for a prediction
    simply by observing how each was used when training the ensemble. Such importance
    rankings are especially meaningful for biomedical problems, where it is vital
    that automated decisions are supported by clinically interpretable justifications.
    Knowledge of the most discriminative features for a problem can generate potential
    biomarkers of disease progression, or support the construction of mechanistic
    models of biological processes or the progression of disease. Importance rankings
    can also be used for feature selection in other models (see Chap. 8 for more details).


    Scikit-learn calculates the importance of decision trees by calculating the degree
    to which each feature decreases the node impurity that is accumulated throughout
    the entire tree. Importance for ensembles therefore reflects the mean importance
    across all trees and can be retrieved from each model using the feature_importances_attribute
    of random-forest and boosting methods.


    A visual example of how feature importance can aid interpretation and translation
    of machine learning findings is shown in Fig. 7.9. This shows importance values
    returned from a random forest to predict gestational age from neonatal brain features
    (volumes of 86 regions). The plot in Fig. 7.9a shows the mean and deviations of
    importance for the top 20 regions, where statistics were calculated across all
    trees in the ensemble. Fig. 7.9b shows


