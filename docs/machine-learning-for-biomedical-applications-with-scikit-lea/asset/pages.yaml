    ```

    from sklearn.model_selection import train_test_split

    bins = np.round(y)

    X_train, y_train, y_test = \

    train_test_split(X,y,test_size=0.2,stratify=bins)

    ```


    Next, we define our model, which will consist of SelectFromModel with the lasso
    scoring model and the linear regression. We will join these two objects into one
    model using the Pipeline:


    ```

    from sklearn.linear_model import LinearRegression

    from sklearn.linear_model import Lasso

    from sklearn.pipeline import Pipeline

    ```


    ```

    model = Pipeline(

    ("selector", SelectFromModel(Lasso)),

    ("lin_reg", LinearRegression()))

    ```


    There are two parameters of our model that we need to tune: the regularization
    parameter alpha for the scoring model accessed through attribute estimator of
    the selector SelectFromModel; and the threshold on the coefficients of the linear
    model that will be used to select the features. We will create the parameter grid
    par to test various values of these parameters, and fit GridSearchCV to find results
    in the best cross-validation score:


    ```

    par={"selector__estimator_alpha": np.logspace(-2,3.5),

    "selector__threshold": np.linspace(0.0,0.5,6)}

    grid = GridSearchCV(model, par)

    grid.fit(X_train,y_train)

    ```


