  md: '# CHAPTER 7


    # Decision trees and ensemble learning


    Ensemble learning is a branch of machine learning that seeks to improve model
    accuracy and/or generalization by combining predictions from several learners.
    The idea is to train multiple complementary models, each returning slightly different
    solutions, with the view that over enough trials the consensus solution will improve
    the prediction of edge cases. Over the course of the chapter, a variety of approaches
    to ensemble learning will be studied, including homogeneous ensembles: bagging,
    random forests and boosting, which merge predictions from models trained with
    the same class of method; and stacked generalization (or heterogeneous ensembles)
    which merge predictions estimated by a range of methods. Before doing so, we must
    learn about the most popular class of base models used by homogeneous ensembles:
    *decision tree*. These are simple and intuitive machine learning models, capable
    of adapting to a range of regression or classification problems.


    # 7.1. Decision trees


    The basic idea behind decision trees is to stack a series of weak learning models
    on top of another with the goal of learning a single strong generalizable, model
    (Fig. 7.1). Specifically, each node in the tree asks a simple question of the
    data. If the response for a given example is true, it passes down one branch of
    the tree (e.g., the right side


    ![](img/d219b4c20ff50f4b97845dec7a9acecb_171_0.png)


    **Figure 7.1** Decision tree.'
  merge: -1
