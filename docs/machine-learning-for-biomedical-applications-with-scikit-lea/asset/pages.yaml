  md: '# ## 11.2.2 Activations


    Convolutional networks require activation layers in order to learn nonlinear mappings
    of the data, similarly to the fully connected networks. In CNNs it is typical
    to implement activations as ReLU functions. Because activation functions operate
    element-wise, they are used the same way for the convolutional layers as for the
    linear layers.


    In this example, we apply the ReLU activation to the output of the convolutional
    layer


    ```

