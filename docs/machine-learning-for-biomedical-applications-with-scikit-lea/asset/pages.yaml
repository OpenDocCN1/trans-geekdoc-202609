    In both cases the function offers choices as to how the array is travelled through
    an optional argument "order". Order can have the values "C" (default), "F", and
    "A" (Fig. 1.7). Here, "C" to flatten in the same way as would be performed in
    C/C++, i.e., in row-major ordering that the row indices the slowest and the column
    index the quickest. "F" stands for Fortran column-major ordering and "A" preserve
    the C/Fortran style of the original array (where this is saved as an attribute
    when the array is created).


    More general reshaping operations may be implemented using reshape and resize
    functions. In this case, reshape creates a copy of the array, whereas resize modifies
    the original. It is also possible to concatenate two (or more) arrays together,
    provided all arrays share (at least one) compatible dimension:


    ```

    np.concatenate([a1, a2, ...]), axis=0)

    ```


    Here, (a1, a2, ...) are the arrays to concatenate. These must be comparable in
    shape along the chosen axis.


    # 1.9.5 Broadcasting


    Broadcasting is a powerful mechanism within Python that allows combined operations
    on arrays (apparently) different sizes, provided the sizes of equivalent dimensions
    between arrays are either the same or one. What this means is, if you have two
    arrays with different numbers of dimensions (e.g., a vector and a matrix), extra
    dimensions will be added to the smaller array to give it that dimensionality.
    Effectively, the smaller array will be copied along the dimension as many times
    as necessary until it has the exact same size as the larger array. Provided all
    other dimensions agree between the arrays, this will allow them to be operated
    on together. For example, when summing a (3,4) shaped matrix with a (4) shaped
    array (Fig. 1.8), Python will broadcast three copies of the vector in the row
    dimension until it has the shape (3,4). This will allow the two arrays to be summed
    together.'
