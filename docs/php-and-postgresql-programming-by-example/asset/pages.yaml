  md: "# 4.3 Listing Image Data\n\nNow we build PHP application to show a list of\
    \ image data. As we know, HTML provides tag img (<img />) to display an image.\
    \ We use the following format to display the image:\n\n```\n<img src='data:image/jpeg;base64,<base64_of_imagefile>'\
    \ width=200px heig\n```\n\nDepend on you image type, we can change data value,\
    \ for instance PNG image file, to be image/png. <base64_of_imagefile> is base64\
    \ value of image. We can use base64_encode() to convert image to base64. After\
    \ obtained image data from database, we should call pg_unescape_bytea() function.\n\
    \nNow create a PHP file, called list_images.php, and write this code.\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title>PHP and PostgreSQL Programming by\
    \ Example</title>\n</head>\n<body>\n<h1>List of Image file</h1>\n\n<p><br/></p>\n\
    \n<p>Retrieving image from database.</p>\n<br/>\n\n<?php\n\ninclude('dbinfo.php');\n\
    \nglobal $connString;\n$conn = pg_connect($connString);\nif ($conn === false)\
    \ {\n    echo \"Unable to connect PostgreSQL.<br>\";\n    return;\n}\n\n// query\
    \ data to insert image file\n$query = \"select id,filename,filetype,imgfile,created\
    \ from imagesfiles\";\n\n$result = pg_query($conn, $query);\nwhile ($row = pg_fetch_row($result))\
    \ {\n    echo \"<div>\";\n    $imgType = $row[2];\n    $imgfile = pg_unescape_bytea($row[3]);\n\
    \    $img = base64_encode($imgfile);\n\n    echo \"<p>ID: \" .$row[0].\"</p><p>\"\
    .$row[1].\"<p>\".$row[4].\n        \"</p><p><img src='data:\". $imgType. \";base64,\"\
    . $img. \"' width=\n    echo \"</div>\";\n```"
