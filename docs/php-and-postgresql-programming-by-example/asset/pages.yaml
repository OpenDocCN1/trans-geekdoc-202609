  md: "# 6.5 Calling Stored Procedure with Input and Output Parameters\n\nWe also\
    \ can call Stored Procedure with input and output parameters. Firstly, we create\
    \ a Stored Procedure, called **func_compute**. Write this code.\n\n```\nDROP FUNCTION\
    \ public.func_compute(INT,OUT INT);\n\nCREATE OR REPLACE FUNCTION public.func_compute(var_a\
    \ INT, OUT val_ret INT)\nRETURNS INT\nAS\n$BODY$\nBEGIN\n    val_ret = var_a *\
    \ 3;\nEND;\n$BODY$\nLANGUAGE plpgsql VOLATILE;\n```\n\nYou can see we define **val_ret**\
    \ parameter as **OUT**.\n\nBack to PHP file, **SPDemo.php**, we create a function\
    \ **compute()** and write this code.\n\n```\n<?php\n\npublic function compute($var_a)\
    \ {\n    $ret = -1;\n    try {\n        global $connString;\n        $conn = pg_connect($connString);\n\
    \        if( $conn === false )\n        {\n            $this->msg = \"Unable to\
    \ connect PostgreSQL Server.\";\n            return $ret;\n        }\n       \
    \ $query = \"select val_ret from func_compute($1);\";\n        $params = array(&$var_a);\n\
    \        $res = pg_query_params($conn,$query,$params);\n        if($res === false)\n\
    \        {\n            $this->msg = \"Error in executing query.\";\n        \
    \    return $ret;\n        }\n        if($row = pg_fetch_row($res))\n        {\n\
    \            $ret = $row[0];\n        }\n    }\n```"
