  md: '# 2.1 Connecting to PostgreSQL


    After we setup PHP and PostgreSQL driver on IIS and Apache, now we can test to
    connect PostgreSQL Server. We can use **pg_connect()** to connect database PostgreSQL
    Server and **pg_close()** to close connection.'
  merge: -1
  img_proc: true
- pgno: 27
  md: "# 2.2 Creating PHP and Connecting to PostgreSQL\n\nIn this section, we create\
    \ PHP file, called **hello.php**. The objective is to connect PostgreSQL via database\
    \ authentication.\n\nFirstly, we define server, username, password and database.\n\
    \n```\n```php\n<?php\n\n$dbServer = \"(local)\";\n$username = \"dbtester\";\n\
    $password = \"dbtester\";\n$database = \"postgres\";\n```\n```\n\nPlease change\
    \ $username and $password values.\n\nThen we connect to PostgreSQL using **pg_connect()**\
    \ by passing server information.\n\n```\n```php\n// Connecting, selecting database\n\
    $dbconn = pg_connect(\"host=$dbServer dbname=$database user=$username password=$password\"\
    )\nor die('Could not connect: ' . pg_last_error());\n\n$stat = pg_connection_status($dbconn);\n\
    \    if ($stat === PGSQL_CONNECTION_OK) {\n        echo 'Connection status ok';\n\
    \    } else {\n        echo 'Connection status bad';\n    }\n\n// Closing connection\n\
    pg_close($dbconn);\n```\n```\n\nAt the end of code, we close connection using\
    \ **pg_close()**.\n\nSave all code."
  merge: -1
  img_proc: true
