  md: "# 4.2 Uploading Image\n\nIn this section, we upload image using traditional\
    \ way: file html. After user choose image file and then click **Submit** button,\
    \ PHP file will process uploading file and store it into database.\n\nFirstly,\
    \ we create **uploadimage.html** and write this script.\n\n```\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <title>PHP and PostgreSQL Programming by Example</title>\n\
    </head>\n<body>\n<h1>Uploading Image file</h1>\n\n<p><br/></p>\n<p>Upload image\
    \ file (JPG/PNG/TIF/GIF) with file size maximum 500KB.</p>\n\n<form action=\"\
    upload_process.php\" method=\"post\"\n      enctype=\"multipart/form-data\">\n\
    \    <label for=\"file\">Image File (JPG/PNG/TIF/GIF):</label>\n    <input type=\"\
    file\" name=\"file\" id=\"file\"><br/><br/>\n    <input type=\"submit\" name=\"\
    submit\" value=\"Submit\">\n</form>\n\n</body>\n</html>\n```\n```\n\nYou can see\
    \ we use form multipart/form-data and input file to upload image file. The form\
    \ action is POST and navigate to **upload_process.php**.\n\nNow we create **upload_process.php**\
    \ to process uploading file. We validate file input for gif, tif, jpg and png\
    \ and restrict file size below 500 KB. Let’s write this code into **upload_process.php**.\n\
    \n```\n```php\n<?php\n\ninclude('dbinfo.php');\n\n$allowedExts = array(\"gif\"\
    , \"tif\", \"jpg\", \"png\");\n$filename = $_FILES[\"file\"][\"name\"];\n$temp\
    \ = explode(\".\", $filename);\n$fileExt = end($temp);\n$imageType = $_FILES[\"\
    file\"][\"type\"];\n\nif ((($imageType == \"image/gif\") || ($imageType == \"\
    image/jpg\") || ($imageType == \"image/jpeg\")\n    || ($imageType == \"image/gif\"\
    ) || ($imageType == \"image/tiff\")\n    || ($imageType == \"image/x-png\") ||\
    \ ($imageType == \"image/png\"))\n    && ($_FILES[\"file\"][\"size\"] < 500000)\n\
    \    && in_array($fileExt, $allowedExts)) {\n```\n```"
