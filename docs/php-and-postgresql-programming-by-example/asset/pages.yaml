    \  created timestamp without time zone\n)\nWITH (\n  OIDS=FALSE\n);\nALTER TABLE\
    \ public.hrd_employee\n  OWNER TO postgres;\n```\n\nYou can run it using pgAdmin.\
    \ You also can run itu using other tool, for instance, DataGrip from Jetbrains,\
    \ https://www.jetbrains.com/datagrip/ ."
