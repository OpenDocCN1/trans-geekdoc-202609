  md: "# 3.4 Update Data\n\nOn this section, we will update data on particular ID.\
    \ We use UPDATE statement and pass updated data.\n\nCreate a function called updateEmployee()\
    \ and write this code.\n\n```\n<?php\ninclude('dbinfo.php');\n\nclass CRUDDemo\
    \ {\n    private $msg = \"\";\n\n    public function getMsg()\n    {\n       \
    \ return $this->msg;\n    }\n    public function updateEmployee($id,$name,$department,$level)\
    \ {\n\n        $success = -1;\n        try {\n\n            global $connString;\n\
    \n            $conn = pg_connect($connString);\n            if( $conn === false\
    \ )\n            {\n                $this->msg = \"Unable to connect PostgreSQL\
    \ Server.\";\n                return $success;\n            }\n\n            $query\
    \ = \"update hrd_employee set name=$1,department=$2,leve\n            $params\
    \ = array(&$name,&$department,&$level,&$id);\n\n            $res = pg_query_params($conn,$query,$params);\n\
    \            if($res === FALSE) {\n                $this->msg = \"Error in executing\
    \ query.\";\n                return $success;\n            }\n            $num_rows=pg_affected_rows($res);\n\
    \            $success = $num_rows;\n            $this->msg = \"\";\n\n       \
    \     pg_close($conn);\n\n        } catch (Exception $e) {\n            $this->msg\
    \ = $e->getMessage();\n            $success = -1;\n        }\n\n        return\
    \ $success;\n    }\n}\n```"
