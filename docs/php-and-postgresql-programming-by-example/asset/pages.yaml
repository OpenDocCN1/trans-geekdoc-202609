- pgno: 34
  md: "# 3.2 Creating Data\n\nIn this scenario, we create new employee and try to\
    \ retrieve inserted ID. PostgreSQL driver provides function RETURNING to retrieve\
    \ ID from inserted query SQL statement. We will use SQL statement to insert data\
    \ but we use parameters to prevent SQL injection.\n\nWe use function pg_fetch_row()\
    \ to obtain ID value from query RETURNING. At the end of code, don’t forget to\
    \ release our usage resources and close connection using pg_close().\n\nNow we\
    \ add function createEmployee() to create new employee. Then, write this code.\n\
    \n```\n<?php\ninclude('dbinfo.php');\n\nclass CRUDDemo {\n    private $msg = \"\
    \";\n\n    public function getMsg()\n    {\n        return $this->msg;\n    }\n\
    \    public function createEmployee($name,$department,$level) {\n\n        $id\
    \ = -1;\n        try {\n\n            global $connString;\n\n            $conn\
    \ = pg_connect($connString);\n            if( $conn === false )\n            {\n\
    \                $this->msg = \"Unable to connect PostgreSQL Server.\";\n    \
    \            return $id;\n            }\n\n            // insert data\n      \
    \      $query = \"insert into hrd_employee(name,department,level,cre\n       \
    \     $params = array(&$name,&$department,&$level);\n\n            $res = pg_query_params($conn,$query,$params);\n\
    \            $row = pg_fetch_row($res);\n            $id = $row[0];\n\n      \
    \      pg_close($conn);\n\n        } catch (Exception $e) {\n            $this->msg\
    \ = $e->getMessage();\n            $id = -1;\n        }\n\n        return $id;\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
