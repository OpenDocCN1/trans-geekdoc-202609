  md: '# 5.1 PHP and PostgreSQL Transaction


    PostgreSQL driver provides transaction operations via query. We use BEGIN query
    to start a transaction and COMMIT to complete the transaction. Otherwise, we can
    use ROLLBACK to restore our previous transaction.


    How to use these functions? Let’s write PHP application.'
  merge: -1
  img_proc: true
- pgno: 58
  md: "# 5.2 Demo\n\nTo illustrate transaction demo, we create a simple PHP application.\
    \ We insert 5 data into database. We use the same code from chapter 3. If one\
    \ of them is failed we will call rollback transaction.\n\nLet’s build. Create\
    \ PHP file, called transaction_demo.php, and write the following code:\n\n```\n\
    <?php\n\ninclude('dbinfo.php');\n\n// connect to postgresql\nglobal $connString;\n\
    \n$conn = pg_connect($connString);\nif( $conn === false )\n{\n    echo \"Unable\
    \ to connect PostgreSQL Server.\";\n    return;\n}\necho \"Connected to PostgreSQL\
    \ Server.<br>\";\n\n// start transaction\npg_query(\"BEGIN\") or die(\"Could not\
    \ start transaction\\n\");\n\necho \"Inserting data.<br>\";\nfor($i=1;$i<=5;$i++)\
    \ {\n\n    $name = \"person-\".$i;\n    $department = \"finance\";\n    $level\
    \ = \"B\";\n    $query = \"insert into hrd_employee(name,department,level,created)\
    \ va\n    $params = array(&$name,&$department,&$level);\n\n    $res = pg_query_params($conn,$query,$params);\n\
    \    if($res === false)\n    {\n        echo \"Error in executing query.<br>\"\
    ;\n        echo \"Rollback transaction.<br>\";\n\n        pg_query(\"ROLLBACK\"\
    ) or die(\"Transaction rollback failed\\n\");;\n        pg_close($conn);\n   \
    \     return;\n    }\n\n    $row = pg_fetch_row($res);\n    $id = $row[0];\n \
    \   echo \"inserted data was success.id=\".$id.\"<br>\";\n}\n\n```"
  merge: -1
  img_proc: true
