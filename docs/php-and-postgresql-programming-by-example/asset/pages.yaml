- pgno: 62
  md: "# 6.1 Stored Procedures\n\nA stored procedure is a subroutine that access a\
    \ relational database system. Stored procedure can be accessed by application.\
    \ In this section, I will show you how to create a stored procedure in PostgreSQL\
    \ and then call it from PHP.\n\nThere are three Stored Procedure models:\n\n+\
    \   - Stored Procedure without parameter. It can be return value or not\n+   -\
    \ Stored Procedure with input parameter\n+   - Stored Procedure with input and\
    \ output parameters\n\nThese models will be implemented on next sections. Firstly,\
    \ we create PHP class, called **SPDemo**. Then, write this skeleton code:\n\n\
    ```\n<?php\n\ninclude('dbinfo.php');\n\nclass SPDdemo {\n    private $msg = \"\
    \";\n    \n    public function getMsg()\n    {\n        return $this->msg;\n \
    \   }\n}\n```\n\nSave this code as **SPDemo.php**.\n\nWe will add several functions\
    \ to access Stored Procedure. In chapter, we use **hrd_employee** table from postgres\
    \ database."
  merge: -1
  img_proc: true
- pgno: 63
  md: "# 6.2 Calling Stored Procedure\n\nTo call Stored Procedure from PHP with a\
    \ cursor, we do the following steps:\n\n+   - Open connection to PostgreSQL using\
    \ pg_connect()\n+   - Do a transaction BEGIN and COMMIT\n+   - Inside a transaction,\
    \ we call pg_query_params() to call stored procedure\n\nLet’s start.\n\nFirstly,\
    \ we create Stored Procedure, call **get all employees**. Write this SQL statement.\n\
    \n```\nDROP FUNCTION public.get_all_employees(refcursor);\n\nCREATE OR REPLACE\
    \ FUNCTION get_all_employees(ref refcursor) RETURNS refc\nBEGIN\n  OPEN ref FOR\
    \ SELECT id,name,department,level,created FROM hrd_employee\n  RETURN ref;\nEND;\n\
    $$ LANGUAGE plpgsql;\n```\n\nThis stored procedure call a query to retrieve data\
    \ on hrd_employee table. It returns a cursor.\n\nRun this script to PostgreSQL\
    \ database. If success, you can see this Stored Procedure on database."
  merge: -1
  img_proc: true
