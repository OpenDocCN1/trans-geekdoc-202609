    \ 应用程序。\n\n### 5.2 演示\n\n为了说明事务演示，我们创建一个简单的 PHP 应用程序。我们向数据库插入 5 条数据。我们使用第 3 章的相同代码。如果其中一个失败，我们将调用回滚事务。\n\
    \n让我们开始构建。创建一个名为 transaction_demo.php 的 PHP 文件，并编写以下代码：\n\n```\n<?php\n\ninclude('dbinfo.php');\n\
    \n// connect to postgresql\nglobal $connString;\n\n$conn = pg_connect($connString);\n\
    if( $conn === false )\n{\n    echo \"Unable to connect PostgreSQL Server.\";\n\
    \    return;\n}\necho \"Connected to PostgreSQL Server.<br>\";\n\n// start transaction\n\
    pg_query(\"BEGIN\") or die(\"Could not start transaction\\n\");\n\necho \"Inserting\
    \ data.<br>\";\nfor($i=1;$i<=5;$i++) {\n\n    $name = \"person-\".$i;\n    $department\
    \ = \"finance\";\n    $level = \"B\";\n    $query = \"insert into hrd_employee(name,department,level,created)\
    \ va\n    $params = array(&$name,&$department,&$level);\n\n    $res = pg_query_params($conn,$query,$params);\n\
    \    if($res === false)\n    {\n        echo \"Error in executing query.<br>\"\
    ;\n        echo \"Rollback transaction.<br>\";\n\n        pg_query(\"ROLLBACK\"\
    ) or die(\"Transaction rollback failed\\n\");;\n        pg_close($conn);\n   \
    \     return;\n    }\n\n    $row = pg_fetch_row($res);\n    $id = $row[0];\n \
    \   echo \"inserted data was success.id=\".$id.\"<br>\";\n}\n\npg_query(\"COMMIT\"\
    ) or die(\"Transaction commit failed\\n\");\npg_close($conn);\necho \"Committed\
    \ Transaction and close connection.<br>\";\n```\n\n保存此代码并运行它。\n\n在浏览器中打开文件 **transaction_demo.php**。如果成功，您可以看到如下响应。\n\
    \n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_59_0.png)\n\n您可以验证插入到 PostgreSQL 数据库的数据。\n\
    \n| # | id | name | department | level | created (yyyy-MM-dd HH:mm:ss.ffffff)\
    \ |\n|---|---|---|---|---|---|\n| 7 | 35 | person 8 | department 8 | A8 | 2016-03-25\
    \ 14:15:16.986468 |\n| 8 | 36 | person 9 | department 9 | A9 | 2016-03-25 14:15:16.993604\
    \ |\n| 9 | 37 | person 10 | department 10 | A10 | 2016-03-25 14:15:16.999911 |\n\
    | 10 | 38 | person-1 | finance | B | 2016-03-26 04:42:18.799703 |\n| 11 | 39 |\
    \ person-2 | finance | B | 2016-03-26 04:42:18.799703 |\n| 12 | 40 | person-3\
    \ | finance | B | 2016-03-26 04:42:18.799703 |\n| 13 | 41 | person-4 | finance\
    \ | B | 2016-03-26 04:42:18.799703 |\n| 14 | 42 | person-5 | finance | B | 2016-03-26\
    \ 04:42:18.799703 |\n| 15 | 43 | person-1 | finance | B | 2016-03-26 04:42:52.573706\
    \ |\n| 16 | 44 | person-2 | finance | B | 2016-03-26 04:42:52.573706 |\n| 17 |\
    \ 45 | person-3 | finance | B | 2016-03-26 04:42:52.573706 |\n| 18 | 46 | person-4\
    \ | finance | B | 2016-03-26 04:42:52.573706 |\n| 19 | 47 | person-5 | finance\
    \ | B | 2016-03-26 04:42:52.573706 |\n| 20 | 48 | person-1 | finance | B | 2016-03-26\
    \ 04:43:35.389129 |\n| 21 | 49 | person-2 | finance | B | 2016-03-26 04:43:35.389129\
    \ |\n| 22 | 50 | person-3 | finance | B | 2016-03-26 04:43:35.389129 |\n| 23 |\
    \ 51 | person-4 | finance | B | 2016-03-26 04:43:35.389129 |\n| 24 | 52 | person-5\
    \ | finance | B | 2016-03-26 04:43:35.389129 |\n\n## 6. 存储过程\n\n本章解释如何在 PostgreSQL\
    \ 上使用存储过程并从 PHP 调用它们。\n\n### 6.1 存储过程\n\n存储过程是访问关系数据库系统的子程序。存储过程可以被应用程序访问。在本节中，我将向您展示如何在\
    \ PostgreSQL 中创建存储过程，然后从 PHP 调用它。\n\n有三种存储过程模型：\n\n- Stored Procedure without\
    \ parameter. It can be return value or not\n- Stored Procedure with input parameter\n\
    - Stored Procedure with input and output parameters\n\n这些模型将在下一节中实现。首先，我们创建一个名为\
    \ **SPDemo** 的 PHP 类。然后，编写此骨架代码：\n\n```\n<?php\n\ninclude('dbinfo.php');\n\nclass\
    \ SPDemo {\n    private $msg = \"\";\n    \n    public function getMsg()\n   \
    \ {\n        return $this->msg;\n    }\n}\n```\n\n将此代码保存为 **SPDemo.php**。\n\n\
    我们将添加几个函数来访问存储过程。在本章中，我们使用 **hrd_employee** 表从 postgres 数据库。\n\n### 6.2 调用存储过程\n\
    \n要使用游标从 PHP 调用存储过程，我们执行以下步骤：\n\n- Open connection to PostgreSQL using pg_connect()\n\
    - Do a transaction BEGIN and COMMIT\n- Inside a transaction, we call pg_query_params()\
    \ to call stored procedure\n\n让我们开始。\n\n首先，我们创建存储过程，名为 **get all employees**。编写此\
    \ SQL 语句。\n\n```\nDROP FUNCTION public.get_all_employees(refcursor);\n\nCREATE\
    \ OR REPLACE FUNCTION get_all_employees(ref refcursor) RETURNS refcursor AS $$\n\
    BEGIN\n  OPEN ref FOR SELECT id,name,department,level,created FROM hrd_employee\n\
    \  RETURN ref;\nEND;\n$$ LANGUAGE plpgsql;\n```\n\n此存储过程调用查询以从 hrd_employee 表中检索数据。它返回一个游标。\n\
    \n运行此脚本到 PostgreSQL 数据库。如果成功，您可以在数据库中看到此存储过程。\n"
