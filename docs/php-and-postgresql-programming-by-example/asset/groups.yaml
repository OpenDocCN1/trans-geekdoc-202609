    \nA form of DataGrip.\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_32_0.png)\n\n\
    For database connection configuration, I created a PHP file, called **dbinfo.php**.\
    \ The following is a content of dbinfo.php.\n\n```php\n<?php\n\n$dbServer = \"\
    localhost\";\n$username = \"user_db\";\n$password = \"user_pass\";\n$database\
    \ = \"postgres\";\n\n$connString = \"host=$dbServer dbname=$database user=$username\
    \ password=$\n```\n\nPlease change database parameter values based on your configuration.\n\
    \nYou can modify this database configuration. The next step is to create a PHP\
    \ class, called **CRUDDemo**. This class provides several functions to execute\
    \ CRUD operations. Let’s start. Create PHP file, called **CRUDDemo.php**. Then\
    \ write this script.\n\n```php\n<?php\n\ninclude('dbinfo.php');\n\nclass CRUDDemo\
    \ {\n    private $msg = \"\";\n\n    public function getMsg()\n    {\n```\n\n\
    ```php\nreturn $this->msg;\n    }\n}\n```\n\nDepending on your **dbinfo.php**\
    \ location, you can change its path.\n\nWe will add some functions to execute\
    \ CRUD operations on next section.\n\n## 3.2 Creating Data\n\nIn this scenario,\
    \ we create new employee and try to retrieve inserted ID. PostgreSQL driver provides\
    \ function RETURNING to retrieve ID from inserted query SQL statement. We will\
    \ use SQL statement to insert data but we use parameters to prevent SQL injection.\n\
    \nWe use function pg_fetch_row() to obtain ID value from query RETURNING. At the\
    \ end of code, don’t forget to release our usage resources and close connection\
    \ using pg_close().\n\nNow we add function createEmployee() to create new employee.\
    \ Then, write this code.\n\n```php\n<?php\ninclude('dbinfo.php');\n\nclass CRUDDemo\
    \ {\n    private $msg = \"\";\n\n    public function getMsg()\n    {\n       \
    \ return $this->msg;\n    }\n    public function createEmployee($name,$department,$level)\
    \ {\n\n        $id = -1;\n        try {\n\n            global $connString;\n\n\
    \            $conn = pg_connect($connString);\n            if( $conn === false\
    \ )\n            {\n                $this->msg = \"Unable to connect PostgreSQL\
    \ Server.\";\n                return $id;\n            }\n\n            // insert\
    \ data\n            $query = \"insert into hrd_employee(name,department,level,cre\n\
    \            $params = array(&$name,&$department,&$level);\n\n            $res\
    \ = pg_query_params($conn,$query,$params);\n            $row = pg_fetch_row($res);\n\
    \            $id = $row[0];\n\n            pg_close($conn);\n\n        } catch\
    \ (Exception $e) {\n            $this->msg = $e->getMessage();\n            $id\
    \ = -1;\n        }\n\n        return $id;\n    }\n}\n```\n\nSave this code.\n\n\
    To test this class, we create PHP file, called **testcrud.php**. After that, we\
    \ try to insert 10 data.\n\n```php\n<?php\n\ninclude('CRUDDemo.php');\n\n$obj\
    \ = new CRUDDemo();\n\n// insert 10 data\nfor($i=1;$i<=10;$i++) {\n    $id = $obj->createEmployee(\"\
    person \" . $i,\"depertment \" . $i,\"A\".$i);\n    echo \"Inserted Id: \" .$id\
    \ . \" \\n\";\n    echo \"Error message: \" . $obj->getMsg() . \" \\n\\n\";\n\
    }\n```\n\nSave the code and try to run **testcrud.php**.\n\nThe following is sample\
    \ running test on Intellij IDEA.\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_35_0.png)\n\
    \nTo verify success or not, we can check database. If success, we can see 10 new\
    \ data on table hrd_employee. Here is a sample of 10 data from table **hrd_employee**\
    \ on PostgreSQL.\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_36_0.png)\n\n```php\n\
    \    return $data;\n}\n}\n```\n\nYou can see that we define $data to hold data\
