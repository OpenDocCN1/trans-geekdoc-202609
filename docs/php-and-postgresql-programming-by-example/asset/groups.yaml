    ;\n        }\n        echo $content . \"\\n\";\n    }\n}\n```\n```\n\n我们向函数传入\
    \ Id=40。你可以根据你自己的数据更改此值。\n\n保存此代码并运行它。以下是一个示例输出。\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_69_0.png)\n\
    \n## 6.5 调用带有输入和输出参数的存储过程\n\n我们还可以调用带有输入和输出参数的存储过程。首先，我们创建一个名为 **func_compute**\
    \ 的存储过程。编写以下代码。\n\n```\nDROP FUNCTION public.func_compute(INT,OUT INT);\n\nCREATE\
    \ OR REPLACE FUNCTION public.func_compute(var_a INT, OUT val_ret INT)\nRETURNS\
    \ INT\nAS\n$BODY$\nBEGIN\n    val_ret = var_a * 3;\nEND;\n$BODY$\nLANGUAGE plpgsql\
    \ VOLATILE;\n```\n\n你可以看到我们将 **val_ret** 参数定义为 **OUT**。\n\n回到 PHP 文件 **SPDemo.php**，我们创建一个函数\
    \ **compute()** 并编写以下代码。\n\n```php\n<?php\n\npublic function compute($var_a) {\n\
    \    $ret = -1;\n    try {\n        global $connString;\n        $conn = pg_connect($connString);\n\
    \        if( $conn === false )\n        {\n            $this->msg = \"Unable to\
    \ connect PostgreSQL Server.\";\n            return $ret;\n        }\n       \
    \ $query = \"select val_ret from func_compute($1);\";\n        $params = array(&$var_a);\n\
    \        $res = pg_query_params($conn,$query,$params);\n        if($res === false)\n\
    \        {\n            $this->msg = \"Error in executing query.\";\n        \
    \    return $ret;\n        }\n        if($row = pg_fetch_row($res))\n        {\n\
    \            $ret = $row[0];\n        }\n    }\n```\n\n```php\npg_close($conn);\n\
    \n} catch (Exception $e) {\n    $this->msg = $e->getMessage();\n}\n\nreturn $ret;\n\
    }\n```\n```\n\n现在我们在 **testsp.php** 中测试这个函数。添加以下代码。\n\n```php\n<?php\n\ninclude('SPDemo.php');\n\
    \n// call stored procedure\n$obj = new SPDemo();\n\n/// call stored procedure\
    \ with input and output parameters\n$val = $obj->compute(15);\necho \"func_compute(15):\
    \ \" . $val;\n```\n```\n\n保存此代码并运行 **testsp.php**。以下是一个示例输出。\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_73_0.png)\n\
