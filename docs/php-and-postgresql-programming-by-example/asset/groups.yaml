    \ Open file testcrud.php and add code as below.\n\n```php\n<?php\n\ninclude('CRUDDemo.php');\n\
    \n$obj = new CRUDDemo();\n\n// read data\n$list = $obj->readEmployeeList();\n\
    if($list) {\n    foreach($list as $item) {\n        $content = \"\";\n       \
    \ foreach($item as $key => $value) {\n            $content = $content . $key .\
    \ \": \" . $value . \"\\n\";\n        }\n        echo $content . \"\\n\";\n  \
