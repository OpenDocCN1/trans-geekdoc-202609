  - "[PAGE 47]\n\n# 4.1 Image and Blob Data\n\nPostgreSQL provides data type for BYTEA\
    \ which can store image file and binary type data.\n\nIn this chapter, we will\
    \ work with image file on PostgreSQL. The following is table schema, called ImagesFiles.\n\
    \n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_47_0.png)\n\nThe following is a script\
    \ for creating imagefiles table.\n\n```\nCREATE TABLE public.imagesfiles\n(\n\
    \  id SERIAL PRIMARY KEY,\n  filename character(50),\n  filetype character(10),\n\
    \  imgfile BYTEA,\n  created timestamp without time zone\n)\nWITH (\nOIDS=FALSE\n\
    );\nALTER TABLE public.imagesfiles\nOWNER TO postgres;\n```\n\nfiletype is image\
    \ type of uploading file. This is important while we want to display the image.\
    \ See section 4.3 for further explanation.\n\nThe next action we create two PHP\
    \ application, uploading image and listing image data."
