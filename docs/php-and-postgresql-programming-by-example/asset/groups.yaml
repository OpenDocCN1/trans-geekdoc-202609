    ## Preface


    In general people use PHP and database MySQL. This book provides alternative approach
    to build PHP application with database PostgreSQL. It describes how to work with
    PHP and PostgreSQL and illustrates their use with code examples.


    Agus Kurniawan

    Berlin, March 2016


    ## 1. Setting up Development Environment


    This chapter explains how to setup development to develop PHP and PostgreSQL.


    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_7_0.png)


    Checked Internet Information Services and World Wide Web Services. Don’t forget
    to check CGI, ISAPI Extensions and ISAPI Filters. You can check other several
    IIS features. If finished, click OK button.


    It will install all selected features. If done, you can check web server IIS on
    Administrative Tools. You can see Internet Information Services (IIS) Manager.
    Click it and then you can obtain web server IIS dialog, shown in Figure below.


    ### 1.1.2 Apache on Ubuntu and Mac


    On OS X, Apache is already installed for you. On Ubuntu, you can install it using
    this command.


    ```

    $ sudo apt-get update

    $ sudo apt-get install apache2

    ```


    ### 1.2 Deploying PHP on Web Server


    In this section, we will deploy PHP on web servers. I use IIS and Apache web servers
    for testing.


    Let’s go.


    ### 1.2.1 IIS for Windows Platform


    There are two options to install PHP on IIS. You can install it via Microsoft
    Web Platform Installer, http://php.iis.net/. After downloaded, you can run it
    and then you obtain the following dialog.


    ** this dialog is a sample for Web Platform Installer 4.6.


    ## Web Platform Installer 4.6


    ## PHP 5.3.28


    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_11_0.png)


    PHP (recursive acronym for PHP: Hypertext Preprocessor) is a widely-used open
    source general-purpose scripting language that is especially suited for web development
    and can be embedded into HTML. It generally runs on a web server, taking PHP code
    as its input and creating web pages as output. The non-thread-safe build of PHP
    offered here is the recommended build to use when running PHP on Windows via FastCGI
    support provided in Microsoft Internet Information Services.


    More information


    Publisher: PHP.net


    Download Size: 14.98 MB


    Version: 5.3.24


    Release date: Tuesday, May 8, 2012


    2 Items to be installed


    Options


    Click Options and select IIS. If done, click OK button.


    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_12_0.png)


    After that, click **Install** button to start installation.


    In this book, I installed PHP on IIS manually. You can install the latest PHP
    on web server IIS. How to install?


    Firstly, we must install PHP for Windows. You can download it on http://windows.php.net/download/
    . You can download it for x86 or x64 and Thread-Safe or Non Thread-Safe. It’s
    recommended to download Non Thread-Safe PHP. After downloaded, you obtain ZIP
    file (particular PHP version provides installer file). Extract it on the specific
    folder, for instance, C:\PHP.


    The following is a sample result of extracted PHP.


    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_13_0.png)


    After that, we can install PHP Manager for IIS. You can download it on [https://phpmanager.codeplex.com/](https://phpmanager.codeplex.com/).
    If you have installed PHP Manager for IIS, you can see PHP Manager on IIS.


    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_15_0.png)


    To verify, click Check phpinfo() and then you obtain a dialog as below.


    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_15_1.png)


    Select Default Web Site and URL http://localhost. If done, click OK button.


    If success, you can see phpinfo() output. The following is a sample output.


    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_16_0.png)


    ### 1.2.2 Apache for Linux and Mac Platforms


    For Linux platform, you can install Apache with PHP using these commands


    ```

    $ sudo apt-get update

    $ sudo apt-get install apache2

    $ sudo apt-get install php5 libapache2-mod-php5

    ```


    For Mac, Apache has installed by default. You can enable this service using this
    command.


    ```

    $ sudo apachectl start

    ```


    Then, open a browser and navigate to http://localhost


    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_17_0.png)


    To install PHP on Mac, you can use brew. For instance, I install PHP 7 with PostgreSQL
    driver using these commands.


    ```

    $ brew tap homebrew/dupes

    $ brew tap homebrew/versions

    $ brew tap homebrew/homebrew-php

    $ brew install php70 --with-postgresql

    ```


    After installing PHP, you can verify by checking PHP version using this statement


    ```

    $ php -v

    ```


    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_18_0.png)


    Now you can configure PHP on Apache. Firstly, backup your


    ```

    $ cd /etc/apache2/

    $ sudo cp httpd.conf httpd.conf.bak

    ```


    Now edit httpd.conf file.


    ```

    $ sudo nano httpd.conf

    ```


    Disable PHP5 and enable PHP 7 as follows.


    ```

    #disable PHP5 module

    #LoadModule php5_module libexec/apache2/libphp5.so


    #Enable PHP 7 module

    LoadModule php7_module /usr/local/opt/php70/libexec/apache2/libphp7.so


    <FilesMatch \.php$>

    SetHandler application/x-httpd-php

    </FilesMatch>

    ```


    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_19_0.png)


    Now restart Apache.


    ```

    $ sudo apachectl restart

    ```


    For testing PHP, create test.php on Document root of Apache.


    For Mac users, you can type this command.


    ```

    $ sudo nano /Library/WebServer/Documents/test.php

    ```


    In test.php, you can write this code.


    ```

    <?php phpinfo();

    ```


    Now you can open a browser and navigate to http://<server>/test.php


