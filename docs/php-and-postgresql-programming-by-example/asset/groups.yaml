    ```\n"
  mdcn: "\n## 1.3 PostgreSQL 服务器\n\n你可以从 [http://www.postgresql.org/download/](http://www.postgresql.org/download/)\
    \ 下载并安装 PostgreSQL 服务器。不要忘记安装 pgAdmin 工具来管理我们的数据库。你可以使用命令行或任何数据库工具。\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_21_0.png)\n\
    \n## 1.5 开发工具\n\n基本上你可以使用任何编辑器来开发 PHP。你可以在 http://en.wikipedia.org/wiki/List_of_PHP_editors\
    \ 上找到 PHP 编辑器列表。我使用 PHP WebStorm，http://www.jetbrains.com/phpstorm/ ，和 IntelliJ\
    \ IDEA，http://www.jetbrains.com/idea/ 。它们提供 30 天试用。\n\n以下是 PhpStorm 的示例。\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_23_0.png)\n\
    \n我还使用 DataGrip 来管理，https://www.jetbrains.com/datagrip/ ，PostgreSQL 服务器。\n\n##\
    \ postgres.public.employee - DataGrip 1.0.3\n\nPostgreSQL - postgres@localhost\n\
    \n+   - pg_catalog\n+   - public\n+     - sequences\n+     - tables\n+       -\
    \ employee\n+         - hrd_employee\n+           - id INTEGER\n+           -\
    \ name CHAR(30)\n+           - department CHAR(30)\n+           - level CHAR(10)\n\
    +           - created TIMESTAMP\n+     - routines\n\n<Filter criteria>\n\n0 rows\n\
    \n| id | name | department |\n|---|---|---|\n\nData DDL\n\n## 2.1 连接到 PostgreSQL\n\
    \n在 IIS 和 Apache 上设置 PHP 和 PostgreSQL 驱动程序后，现在我们可以测试连接到 PostgreSQL 服务器。我们可以使用\
    \ **pg_connect()** 连接 PostgreSQL 服务器数据库和 **pg_close()** 关闭连接。\n\n## 2.2 创建 PHP\
    \ 并连接到 PostgreSQL\n\n在本节中，我们创建一个名为 **hello.php** 的 PHP 文件。\n\n目标是通过数据库身份验证连接到\
    \ PostgreSQL。\n\n首先，我们定义服务器、用户名、密码和数据库。\n\n```php\n<?php\n\n$dbServer = \"(local)\"\
    ;\n$username = \"dbtester\";\n$password = \"dbtester\";\n$database = \"postgres\"\
    ;\n```\n\n请更改 $username 和 $password 值。\n\n然后我们通过传递服务器信息使用 **pg_connect()** 连接到\
    \ PostgreSQL。\n\n```php\n// Connecting, selecting database\n$dbconn = pg_connect(\"\
    host=$dbServer dbname=$database user=$username password=$password\")\nor die('Could\
    \ not connect: ' . pg_last_error());\n\n$stat = pg_connection_status($dbconn);\n\
    \    if ($stat === PGSQL_CONNECTION_OK) {\n        echo 'Connection status ok';\n\
    \    } else {\n        echo 'Connection status bad';\n    }\n\n// Closing connection\n\
    pg_close($dbconn);\n```\n\n代码末尾，我们使用 **pg_close()** 关闭连接。\n\n保存所有代码。\n\n## 2.3\
    \ 测试\n\n将文件 hello.php 部署到 Web 服务器。我测试了 PhpStorm 工具的内置 Web 服务器。打开浏览器并输入 hello.php\
    \ 文件的 URL。\n\n以下是运行 PHP 应用程序的示例。\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_28_0.png)\n\
    \n## 3. CRUD 操作\n\n本章解释如何使用 PHP 操作 PostgreSQL 数据。\n\n## 3.1 CRUD 操作\n\nCRUD (Create,\
    \ Read, Update, Delete) 操作是数据库的基本数据操作。在本章中我们将开发 PHP 应用程序来执行 CRUD 操作。我们使用现有数据库\
    \ postgres。然后，创建一个名为 **hrd_employee** 的表。以下是创建表的查询。\n\n```\nCREATE TABLE public.hrd_employee\n\
    (\n  id SERIAL PRIMARY KEY,\n  name character(30),\n  department character(30),\n\
    \  level character(10),\n  created timestamp without time zone\n)\nWITH (\n  OIDS=FALSE\n\
    );\nALTER TABLE public.hrd_employee\n  OWNER TO postgres;\n```\n\n你可以使用 pgAdmin\
    \ 运行它。你也可以使用其他工具运行它，例如 Jetbrains 的 DataGrip，https://www.jetbrains.com/datagrip/\
    \ 。\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_31_0.png)\n\nDataGrip 的表单。\n\n\
    ![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_32_0.png)\n\n对于数据库连接配置，我创建了一个名为 **dbinfo.php**\
    \ 的 PHP 文件。以下是 dbinfo.php 的内容。\n\n```php\n<?php\n\n$dbServer = \"localhost\";\n\
    $username = \"user_db\";\n$password = \"user_pass\";\n$database = \"postgres\"\
    ;\n\n$connString = \"host=$dbServer dbname=$database user=$username password=$\n\
    ```\n\n请根据你的配置更改数据库参数值。\n\n你可以修改此数据库配置。下一步是创建一个名为 **CRUDDemo** 的 PHP 类。此类提供多个函数来执行\
    \ CRUD 操作。开始吧。创建名为 **CRUDDemo.php** 的 PHP 文件。然后编写此脚本。\n\n```php\n<?php\n\ninclude('dbinfo.php');\n\
    \nclass CRUDDemo {\n    private $msg = \"\";\n\n    public function getMsg()\n\
    \    {\n```\n\n```php\nreturn $this->msg;\n    }\n}\n```\n\n根据你的 **dbinfo.php**\
    \ 位置，你可以更改其路径。\n\n我们将在下一节添加一些函数来执行 CRUD 操作。\n\n## 3.2 创建数据\n\n在此场景中，我们创建新员工并尝试检索插入的\
    \ ID。PostgreSQL 驱动程序提供函数 RETURNING 来从插入的查询 SQL 语句中检索 ID。我们将使用 SQL 语句插入数据，但我们使用参数来防止\
    \ SQL 注入。\n\n我们使用函数 pg_fetch_row() 从查询 RETURNING 中获取 ID 值。代码末尾，不要忘记释放我们使用的资源并使用\
    \ pg_close() 关闭连接。\n\n现在我们添加函数 createEmployee() 来创建新员工。然后，编写此代码。\n\n```php\n<?php\n\
    include('dbinfo.php');\n\nclass CRUDDemo {\n    private $msg = \"\";\n\n    public\
    \ function getMsg()\n    {\n        return $this->msg;\n    }\n    public function\
    \ createEmployee($name,$department,$level) {\n\n        $id = -1;\n        try\
    \ {\n\n            global $connString;\n\n            $conn = pg_connect($connString);\n\
    \            if( $conn === false )\n            {\n                $this->msg\
    \ = \"Unable to connect PostgreSQL Server.\";\n                return $id;\n \
    \           }\n\n            // insert data\n            $query = \"insert into\
    \ hrd_employee(name,department,level,cre\n            $params = array(&$name,&$department,&$level);\n\
    \n            $res = pg_query_params($conn,$query,$params);\n            $row\
    \ = pg_fetch_row($res);\n            $id = $row[0];\n\n            pg_close($conn);\n\
    \n        } catch (Exception $e) {\n            $this->msg = $e->getMessage();\n\
    \            $id = -1;\n        }\n\n        return $id;\n    }\n}\n```\n\n保存此代码。\n\
    \n为了测试此类，我们创建名为 **testcrud.php** 的 PHP 文件。之后，我们尝试插入 10 条数据。\n\n```php\n<?php\n\
    \ninclude('CRUDDemo.php');\n\n$obj = new CRUDDemo();\n\n// insert 10 data\nfor($i=1;$i<=10;$i++)\
    \ {\n    $id = $obj->createEmployee(\"person \" . $i,\"depertment \" . $i,\"A\"\
    .$i);\n    echo \"Inserted Id: \" .$id . \" \\n\";\n    echo \"Error message:\
    \ \" . $obj->getMsg() . \" \\n\\n\";\n}\n```\n\n保存代码并尝试运行 **testcrud.php**。\n\n\
    以下是 Intellij IDEA 上测试运行的示例。\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_35_0.png)\n\
    \n为了验证是否成功，我们可以检查数据库。如果成功，我们可以在表 hrd_employee 上看到 10 条新数据。以下是 PostgreSQL 上表 **hrd_employee**\
    \ 的 10 条数据的示例。\n\n![](img/c57c0fe41a78a4cec34dfc1c6ad7b9d6_36_0.png)\n\n```php\n\
    \    return $data;\n}\n}\n```\n\n你可以看到我们定义 $data 来保存来自 PostgreSQL 数据库的数据。\n\n\
    保存此代码。\n\n现在我们测试函数 readEmployeeList()。打开文件 testcrud.php 并添加以下代码。\n\n```php\n<?php\n\
    \ninclude('CRUDDemo.php');\n\n$obj = new CRUDDemo();\n\n// read data\n$list =\
    \ $obj->readEmployeeList();\nif($list) {\n    foreach($list as $item) {\n    \
    \    $content = \"\";\n        foreach($item as $key => $value) {\n          \
    \  $content = $content . $key . \": \" . $value . \"\\n\";\n        }\n      \
    \  echo $content . \"\\n\";\n    }\n}\n```\n\n保存此代码。\n\n你可以执行文件 testcrud.php。以下是输出示例。\n\
    \n```\n/usr/local/bin/php /Users/apusk/Documents/MyBooks/pearess/php_postgresql/codes/testcrud.php\n\
    id: 28\nname: person 1\ndepartment: depertment 1\nlevel: A1\ncreated: 2016-03-25\
    \ 14:15:16.876907\n\nid: 29\nname: person 2\ndepartment: depertment 2\nlevel:\
    \ A2\ncreated: 2016-03-25 14:15:16.896776\n\nid: 30\nname: person 3\ndepartment:\
    \ depertment 3\nlevel: A3\ncreated: 2016-03-25 14:15:16.913929\n\nid: 31\nname:\
    \ person 4\ndepartment: depertment 4\nlevel: A4\ncreated: 2016-03-25 14:15:16.931068\n\
    ```\n"
