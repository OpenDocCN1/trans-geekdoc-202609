  - "[PAGE 63]\n\n# 6.2 Calling Stored Procedure\n\nTo call Stored Procedure from\
    \ PHP with a cursor, we do the following steps:\n\n+   - Open connection to PostgreSQL\
    \ using pg_connect()\n+   - Do a transaction BEGIN and COMMIT\n+   - Inside a\
    \ transaction, we call pg_query_params() to call stored procedure\n\nLet’s start.\n\
    \nFirstly, we create Stored Procedure, call **get all employees**. Write this\
    \ SQL statement.\n\n```\nDROP FUNCTION public.get_all_employees(refcursor);\n\n\
    CREATE OR REPLACE FUNCTION get_all_employees(ref refcursor) RETURNS refc\nBEGIN\n\
    \  OPEN ref FOR SELECT id,name,department,level,created FROM hrd_employee\n  RETURN\
    \ ref;\nEND;\n$$ LANGUAGE plpgsql;\n```\n\nThis stored procedure call a query\
    \ to retrieve data on hrd_employee table. It returns a cursor.\n\nRun this script\
    \ to PostgreSQL database. If success, you can see this Stored Procedure on database."
