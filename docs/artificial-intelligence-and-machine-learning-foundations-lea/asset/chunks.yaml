- raw: "United Nations\n\n[https://un.org/sustainabledevelopment/sustainable-development-goals/](https://un.org/sustainabledevelopment/sustainable-development-goals/)\
    \ \n\n[https://un.org/en/development/desa/policy/cdp/cdp\\_publications/2012cdppolicynote.pdf](https://un.org/en/development/desa/policy/cdp/cdp_publications/2012cdppolicynote.pdf)\
    \ \n\nSmart Cities\n\n[https://smartcitiesworld.net/](https://smartcitiesworld.net/)\
    \ \n\nInternational Organization for Standardization\n\n[https://iso.org/home.html](https://iso.org/home.html)\
    \ \n\n# GLOSSARY\n\nArtificial intelligence (AI): Artificial intelligence refers\
    \ to systems designed by humans that, given a complex goal, act in the physical\
    \ or digital world by perceiving their environment, interpreting the collected\
    \ structured or unstructured data, reasoning on the knowledge derived from these\
    \ data and deciding the best action(s) to take (according to predefined parameters)\
    \ to achieve the given goal. AI systems can also be designed to learn to adapt\
    \ their behaviour by analysing how the environment is affected by their previous\
    \ actions.\n\nAs a scientific discipline, AI includes several approaches and techniques,\
    \ such as machine learning (of which deep learning and reinforcement learning\
    \ are specific examples), machine reasoning (which includes planning, scheduling,\
    \ knowledge representation and reasoning, search and optimisation) and robotics\
    \ (which includes control, perception, sensors and actuators, as well as the integration\
    \ of all other techniques into cyber-physical systems).\n\nAssistive robot: A\
    \ robot designed to provide physical or cognitive assistance to a person.\n\n\
    Autonomy: The ability of a machine to make its own decisions.\n\nAxon terminals:\
    \ Axon terminals are terminations of the telodendria (branches) of an axon.\n\n\
    Backpropagation: A method used in artificial neural networks to calculate a gradient\
    \ required in the calculation of the weights to be used in the network.\n\nBias:\
    \ The deviation of the expected value of a statistical estimate from the quantity\
    \ it estimates. It can also be considered to be a prejudice for or against something\
    \ or somebody that may result in unfair decisions. It is known that humans are\
    \ biased in their decision-making. Since AI systems are designed by humans, it\
    \ is possible that humans inject their bias into the systems, even in an unintended\
    \ way. Many current AI systems are based on machine learning data-driven techniques.\
    \ Therefore, a predominant way to inject bias can be in the collection and selection\
    \ of training data. If the training data are not inclusive and balanced enough,\
    \ the system could learn to make unfair decisions. At the same time, AI can help\
    \ humans to identify their biases, and assist them in making less biased decisions.\n\
    \nBig data: Data sets that are so big and complex that traditional data-processing\
    \ application software is inadequate to deal with them.\n\nChatbot: An artificial\
    \ intelligence program that conducts a conversation via auditory or textual methods.\n\
    \nClassification: The problem of identifying to which of a set of classes a new\
    \ observation belongs.\n\nClustering: Groups a set of objects in such a way that\
    \ objects in the same group are more similar to each other than to those in other\
    \ groups.\n\nCombinatorial explosion: The rapid growth of the complexity of a\
    \ problem due to the combinations of the problem’s input parameters.\n\nData analysis:\
    \ The process of inspecting, cleaning, transforming and modelling data with the\
    \ goal of discovering useful information, drawing conclusions and supporting decision-making.\
    \ Data analysis involves applying various techniques, such as statistical analysis,\
    \ data visualisation and machine learning, to identify patterns, trends, relationships\
    \ and insights from raw data.\n\nData cleaning: Detects and corrects (or removes)\
    \ corrupt or inaccurate records from a record set, table or database and refers\
    \ to identifying incomplete, incorrect, inaccurate or irrelevant parts of the\
    \ data and then replacing, modifying or deleting the dirty or coarse data.\n\n\
    Data mining: The process of discovering patterns in large data sets.\n\nData science:\
    \ Uses scientific methods, processes, algorithms and systems to understand data.\n\
    \nData scrubbing: See data cleaning.\n\nDecision trees: A decision support tool\
    \ that uses a tree-like graph or model of decisions and their possible consequences.\n\
    \nDeep learning: A class of algorithms that use a cascade of multiple layers for\
    \ feature extraction and transformation. Each successive layer uses the output\
    \ from the previous layer as input.\n\nDendrites: Branched extensions of a nerve\
    \ cell that propagate the electrochemical stimulation.\n\nEmotional intelligence\
    \ or emotional quotient (EQ): The understanding of our emotions and the emotions\
    \ of others.\n\nEnsemble: Methods that use multiple learning algorithms to obtain\
    \ better predictive performance than could be obtained from any of the constituent\
    \ learning algorithms alone.\n\nEthical purpose: Used to indicate the development,\
    \ deployment and use of AI, which ensures compliance with fundamental rights and\
    \ applicable regulation as well as respecting core principles and values. This\
    \ is one of the two core elements to achieve trustworthy AI.\n\nExpert systems:\
    \ A computer system that emulates the decision-making ability of a human expert.\n\
    \nFeedforward neural network: An artificial neural network wherein connections\
    \ between the nodes do not form a cycle.\n\nFunctionality: The tasks that a computer\
    \ software program is able to do.\n\nHardware: The physical parts or components\
    \ of a computer.\n\nHeuristic: A strategy derived from previous experiences with\
    \ similar problems.\n\nHuman-centred AI (HCAI): An approach to AI development\
    \ that puts humans at the forefront by designing systems that are user-friendly,\
    \ transparent, explainable and ethically responsible. It aims to create AI that\
    \ collaborates with humans in ways that are understandable, controllable and beneficial,\
    \ ensuring that AI solutions are designed to improve human experiences, safety\
    \ and wellbeing.\n\nHuman-centric AI: AI that emphasises enhancing and empowering\
    \ human abilities by ensuring that AI systems work alongside humans, augmenting\
    \ their capabilities and supporting decision-making processes. It focuses on aligning\
    \ AI with human values, ethical considerations and societal needs. Human-centric\
    \ AI is more about collaboration and augmentation, whereas human-centred AI emphasises\
    \ usability, transparency and ethical design.\n\nHyper-parameter: A parameter\
    \ whose value is set before the learning process begins.\n\nInductive reasoning:\
    \ Makes broad generalisations from specific observations.\n\nInternet of Things\
    \ (IoT): The network of physical devices, vehicles, home appliances and other\
    \ items embedded with electronics, software, sensors, actuators and connectivity\
    \ that enable these things to connect and exchange data.\n\nK-means: A clustering\
    \ algorithm that partitions observations into k clusters in which each observation\
    \ belongs to the cluster with the nearest mean, serving as a prototype of the\
    \ cluster.\n\nK-nearest neighbours: The simplest clustering algorithm used to\
    \ classify new data points based on the relationship to nearby data points.\n\n\
    Layers: Neural networks are organised into layers and a layer is a set of interconnected\
    \ nodes.\n\nLinear algebra: The branch of mathematics concerning linear equations\
    \ and functions and their representations through matrices and vector spaces.\n\
    \nLogistic regression: Used in binary classification to predict two discrete classes.\n\
    \nMachine learning (ML): A subset of artificial intelligence in the field of computer\
    \ science that gives computers the ability to learn from data.\n\nNarrow AI or\
    \ weak AI: Narrow artificial intelligence, also known as weak artificial intelligence,\
    \ is AI focused on one narrow task. It is the contrast of strong AI."
  fmt: "\n# United Nations\n\n[https://un.org/sustainabledevelopment/sustainable-development-goals/](https://un.org/sustainabledevelopment/sustainable-development-goals/)\
