  trans: '

    利益相关者的参与通常更关注业务与 IT 的对齐，而不需要专门的数据科学角色。由于我们的伦理和监管要求，`AI` 和 `ML` 项目将吸引更广泛的利益相关者的关注。来自多元利益相关者的参与至关重要。业务案例应概述每个利益相关者群体将如何为项目做出贡献并从中受益。特别重要的是，多元化的利益相关者基础在理解项目偏差和结果方面将发挥关键作用。这些人员可能是
    `AI` 伦理官、伦理委员会、法律部门（知识产权、版权）、采购等。


    根据项目类型，维护通常与软件更新、硬件维护和用户支持有关，这些工作更具预测性且强度较低。从数据中学习和从经验中学习带来了更多工作和挑战。对 `AI` 系统进行持续监控和维护是必要的，以确保它们保持准确和相关。业务案例应包含持续支持、模型重训练和性能监控的计划，以及硬件的维护。


    直到目前，试点项目（快速观察、查看、尝试）可能不再那么关键，如果需求和解决方案得到充分理解，项目可以直接进入实施。敏捷项目管理和最小可行性产品更强调从经验中学习，而试点变得更加常见。考虑到这一点，倾向于从经验中学习的
    `AI/ML` 项目通常从试点或概念验证阶段开始，在全面实施之前验证模型。业务案例应包含基于试点结果进行方案扩展的计划。


    伦理影响和监管合规性在 `ML` 和 `AI` 项目中更为突出。数据隐私、模型透明度和伦理 AI 实践等问题需要在业务案例中解决。例如，以人为本的伦理目标是《欧盟
    AI 法》的核心。虽然从传统的 IT 角度来看，监管合规仍然重要，但除非项目直接影响数据隐私或安全，否则伦理考虑不太可能成为重点。在这里需要承认，全球范围内涌出了许多竞争的标准和指南，包括来自英国政府各个部门的标准；但在英国，目前还没有明确的监管或立法指导。第二章专门关注这一点，并将帮助确定什么是符合用途的。一个包含领域专的多元团队将对此有所帮助。


    ## 5.2 利益相关者与项目


    在本节中，我们将更详细地介绍利益相关者，以及如果项目包含从经验中学习或从数据中学习，我们可以使用哪些项目管理方法。例如，利益相关者通过提供指导、资源和监督，在帮助组织遵守《欧盟
    AI 法》方面发挥着至关重要的作用。行业专家和学术研究人员将为 `AI` 开发和部署的最佳实践提供见解，确保组织充分了解监管要求和伦理考虑。公民社会组织将倡导透明度和问责，帮助监控合规性并提高对潜在风险的意识。决策制定者监管机构将提供清晰且可操作的指南，以及培训计划和合规工具等支持机制。通过合作和知识共享，利益相关者将协助组织实施稳健的治理框架，进行彻底的风险评估并对
    `AI` 系统进行持续监督，从而确保遵守法规（例如《欧盟 AI 法》、`NIST` 等）并培养负责任的 `AI` 创新文化。


    ### 5.2.1 利益相关者的识别与分类


    在 `AI/ML` 中，利益相关者涵盖了对 `AI` 技术开发、部署和使用感兴趣或受其影响的多元个人、组织和实体。随着对环境、气候和生物多样性的日益关注，这些利益相关者的影响力日益增强，并对社会和资源的未来方向产生重大影响。`AI/ML`
    可以以许多方式对代公平公平可持续性做出贡献。


    识别利益相关者对于有效的利益相关者管理至关重要，以确保对利益的平衡考虑、伦理实施和 `AI` 系统的负责任开发。识别利益相关者的方法之一是创建利益相关者轮；图
    5.1 给出了示例。记住，安全对所有利益相关者都至关重要，应该设计其中并不断改进。


    ### 5.2.2 利益相关者的权力和影响力


    在 `AI` 项目背景下，利益相关者管理中的权力和影响力概念仍然至关重要，但由于 `AI` 技术及其应用的性质，它们带有特定的细微差别。


    权力来自组织内部的正式角色，这些角色授权了决策和资源分配。它直接影响项目范围、资源分配和正式审批流程。


    图 5.1 `AI` 利益相关者轮示例


    ![image-JONHQCU4.jpg](img/image-JONHQCU4.jpeg)


    影响力源于专业知识、声誉以及说服和动员他人的能力。它间接塑造项目的技术方向、用户接受度和创新方法。


    #### 5.2.2.1 AI 项目中的利益相关者权力


    在 `AI` 项目中，权力是指利益相关者拥有的做出战略决策、分配资源和执行项目方向的正式权威。


    拥有权力的利益相关者具有以下特征：


    - **战略决策**：他们可以定义 `AI` 项目的范围、目标和方向。

    - **资源分配**：他们控制 `AI` 项目所需的预算、人员和技术基础设施。

    - **监管合规**：他们确保 `AI` 项目符合法律、伦理和组织标准。

    - **审批权限**：他们对项目里程碑、交付物和部署具有最终决定权。


    拥有权力的利益相关者示例可能是：


    - 执行人员和高层管理，他们决定 `AI` 项目的投资以及与业务目标的战略对齐。

    - 项目赞助人，批准 `AI` 项目的预算和资源需求。

    - 法律和合规官，确保 `AI` 项目遵循监管标准和伦理指南。


    #### 5.2.2.2 AI 项目中的利益相关者影响力


    在 `AI` 项目中，影响力是指利益相关者在没有正式权威的情况下，塑造与项目相关的感知、决策和行动的能力。


    拥有影响力的利益相关者具有以下特征：


    - **专家知识**：他们通常在 `AI`、数据科学或相关领域拥有深厚的技术知识。

    - **思想领导力**：他们通过自己的见解和创新想法来塑造项目的愿景和方向。

    - **社交与协作**：他们能够聚集支持并促进跨团队部门的协作。

    - **用户维护**：他们代表终端用户的利益和需求，确保 AI 解决方案是以用户为中心且有效的。


    影响力的利益相关者示例可能是：


    - 数据科学家和 `AI` 研究人员，他们为 `AI` 模型的可性和设计提供关键见解。

    - 技术负责人和工程师，他们影响 AI 解决方案的技术架构和实施。

    - 伦理和隐私倡导者，他们确保 `AI` 项目考虑伦理影响和用户隐私担忧。

    - 产品经理，他们将 `AI` 项目与市场需求和客户期望相结合。

    - 伦理委员会，他们确保 `AI` 项目符合组织的伦理。

