- raw: "Whether a node is activated or not is determined by the activation function.\
    \ The activation function uses the input function as its input. This input function\
    \ is the sum of the output of nodes connected by the links multiplied by the weights\
    \ of the links between the nodes. We then need to determine if the node is activated.\
    \ If a hard threshold (activation function output is above a set value) is used,\
    \ then this is a perceptron. These types of NN can represent non-linear problems\
    \ that are Boolean in nature. The sigmoid perceptron uses a differentiable sigmoid\
    \ activation function, and this means DNNs can now represent arbitrary functions,\
    \ again non-linear. This makes them very powerful. The threshold activation function\
    \ is a hard step change between the neuron activating or not. The sigmoid (logistic)\
    \ activation function is differentiable and is called softer because the decision\
    \ to fire the node is not a step change. There are other types of activation function,\
    \ for which use is determined by the experience of the trainer.\n\nThe trainer\
    \ needs to train the NNs to determine the unknown weights of each of the links.\
    \ This is not a simple task, and a role of the future for AI personnel. Training\
    \ a NN involves adjusting weights in order for the NN to improve. Techniques involve\
    \ forward and back propagation to update weights based on the error between the\
    \ desired output and the NN’s output. Knowledge of vector calculus will help here,\
    \ and a NN domain expert will help too. Up to now we could simplify the NNs as\
    \ ones that can understand functions, given examples of what those functions are.\
    \ We could use a NN to learn from examples that we know. This makes the error\
    \ known. What happens when we do not have labelled examples to learn from? We\
    \ could build learning examples and try to form labels from our understanding\
    \ of the NN.\n\nWhat happens if our problem has lots of unknown combinations –\
    \ such as a game with many possible moves? We simply may not have the data to\
    \ understand all the possible moves. We need to measure, somehow, the performance\
    \ of the NN. This is called reinforcement learning, and the NN can learn by itself.\
    \ Reinforcement learning fits naturally with the learning agent schematic. The\
    \ agent has a learning component, and the learning component tries to maximise\
    \ its reward or minimise its loss. Norvig and Russell (2016) note that reinforcement\
    \ learning might be considered as encompassing all of AI. In an environment, an\
    \ agent will have a percept and will learn via the learning element to achieve\
    \ a goal. It will use its actuators to act on the environment. This elevates products\
    \ to intelligent entities and gives products such as robots autonomy. An agent\
    \ using a NN and reinforcement learning has to learn how to achieve a goal in\
    \ an environment. This learning is complex. Somehow, we need to train the NN to\
    \ explore its environment, create a policy to achieve a goal and understand what\
    \ it can do to the environment with its actuators.\n\nExamples of reinforcement\
    \ NN successes are:\n\nAlphaGo, the computer that was taught to beat the world\
    \ Go champion (see Section 1.1.2.1). The computer was so successful, it used moves\
    \ that impressed Go masters. A supercomputer played itself at the game of Go to\
    \ learn how to play. This is an engineered simulation environment.\n\nOpenAI,\
    \ who used a NN to teach a robot how to solve a Rubik’s Cube (OpenAI, 2019). The\
    \ robotic hand can manipulate the cube to solve it because it has many sensors\
    \ and actuators. The NN learned how to solve the Rubik’s Cube and also how to\
    \ manipulate its environment.\n\n4.2.3.9 Hyper-parameters, algorithms and the\
    \ trade-off – under- and over-fitting\n\nOur learning from experience involves\
    \ assessing the efficacy of an algorithm to test our hypothesis. We will try different\
    \ types of algorithm and adjust the algorithms’ tuning parameters to get them\
    \ to perform the best they can. The tuning parameters are called hyper-parameters,\
    \ and they are used to set up our algorithms; or, to put it another way, they\
    \ tell the algorithm how to learn. Examples of hyper-parameters include layers\
    \ in a decision tree or NN, the order of a curve in regression, the number of\
    \ nodes in a NN, the type of activation function or the accuracy of a classification.\n\
    \nWe will not know before we start what our hyper-parameters need to be to obtain\
    \ the most effective algorithm. This is part of our learning from experience as\
    \ we build our ML system. There are also many ways to assess the efficacy of an\
    \ algorithm. The most common one used is the trade-off between complexity and\
    \ accuracy. To do this, we need to understand under- and over-fitting.\n\nThese\
    \ are exactly as their names imply: over-fitting the model over-fits the data\
    \ too well, and under-fitting under-fits the data and does not capture the true\
    \ nature of them. You can reproduce over-fitting and under-fitting on a spreadsheet\
    \ by simply fitting different curves to a data set.\n\nWith over-fitting we have\
    \ a data set that represents a linear straight line (see Figure 4.8). This could\
    \ be from experimental measures of temperature through a metal bar. The good fit\
    \ straight dashed line in the graph shows the best fit to the data set. There\
    \ is only a small variation of the data when compared to the best fit straight\
    \ line. If we try to be too clever and use a more complex mathematical fit, say\
    \ a parabola or a higher order polynomial, then we will begin to see larger errors.\
    \ In the curve fitting example, the higher the order of the curve, the more oscillatory\
    \ the data fit we obtain. These show up as large errors away from the actual data\
    \ points we use to train our ML solution. In fact, if we have nine data points,\
    \ we need a ninth order polynomial to obtain an exact match of the data points\
    \ with our polynomial. However, this ninth order polynomial could oscillate widely\
    \ and be a very poor fit away from the data points. To recap, over-fitting means\
    \ our model or algorithm is too complicated for the data we are working with.\n\
    \nUnder-fitting, on the other hand, is the opposite; it tries to fit a curve (using\
    \ our simple curve idea) that is not complicated enough. In Figure 4.9 we see\
    \ that our data set is well represented by a parabola (dashed line) or a second\
    \ order curve. If we try to fit a simple linear straight line to the data, we\
    \ again see large errors.\n\nSo, our algorithm suffers from two types of error:\
    \ bias error and variance error. The bias is how far your prediction is from the\
    \ actual data. Variance is how scattered around our prediction is. With over-fitting,\
    \ we see a high variance around and low bias with our training data. With under-fitting,\
    \ we see a low variance around and high bias with our training data. The trade-off,\
    \ shown graphically in Figure 4.10, minimises the error by finding the best level\
    \ of complexity. This is not the only way to assess the efficacy of an algorithm.\
    \ There are many other ways, and there are numerous examples to be found in the\
    \ books listed in Further Reading at the end of this book. We should also note\
    \ in passing that the trade-off uses test data that have not been used to train\
    \ our algorithm.\n\nFigure 4.8 A simple example of over-fitting\n\n![image-44QSSR0Y.jpg](images/image-44QSSR0Y.jpeg)\
    \  \n\nFigure 4.9 A simple example of under-fitting\n\n![image-Y6PB3R0J.jpg](images/image-Y6PB3R0J.jpeg)\
    \  \n\nRemember that the learning from experience within a ML project involves\
    \ the whole team. The domain expert is the person that defines what is fit for\
    \ purpose.\n\n## 4.3 GENERATIVE AI"
