- raw: 'Stuart Russell and Peter Norvig, the authors of the standard AI textbook Artificial
    Intelligence: A Modern Approach (2016), explain that AI is a universal subject
    and helpful to us all. Learning from experience is AI’s signature. We will use
    this concept a lot; it applies to machines as much as it does to humans, perhaps
    more so.


    Einstein is often quoted as saying: ‘The only source of knowledge is the experience.''
    Ask yourself: can machines help us to learn from experience? If the answer to
    this question is yes, then AI can help you.


    1.1.1.4 Machine learning


    In this section, we need to make the distinction between ML and AI. This is no
    easy task until we remind ourselves that AI is a universal subject that can help
    any pursuit of learning from experience to achieve a goal (Russell and Norvig,
    2016). ML is only part of this – the distinction starts with the definitions of
    an AI agent and ML. Tom Mitchell’s ML definition is the one usually quoted (Mitchell,
    2018); it relates well to digital computing that is part of all our lives.


    A computer program is said to learn from experience, E, with respect to some class
    of tasks, T, and performance measure, P, if its performance at tasks in T, as
    measured by P, improves with experience, E.


    AI is about intelligent entities, or AI agents, interacting with an environment
    to achieve a goal. Not just one entity but multiple. AI is about humans and machines,
    how they interact, how they learn, what they experience. AI asks us to be explicit
    about humans achieving their goals. Can we build machines that we can work with
    to improve us as humans? AI asks hard questions of consciousness, philosophy,
    ethics and science. It deals with complex phenomena that we do not currently have
    the machines to explore. AI of the future is about how humans and machines will
    co-exist. In 2019 Stuart Russell released his latest book on human-compatible
    AI, Human Compatible: Artificial Intelligence and the Problem of Control (2019),
    which captures the true nature of AI and how, used wisely, we can benefit from
    a future of humans and machines.


    As we are coming to realise the benefit of digital computing ML, this will unlock
    the potential of AI in other areas, such as:


    engineering and building intelligent entities;


    medicine and improving health- and social-care;


    business analytics, and others.


    When we simply think about products, representing the world in a digital simulation
    – or what is (at the moment) ones and zeros – is not ideal. Digital computation
    has its limitations, and we need better machines. We have run out of digital processing
    power. AI is much more than high-performance computing and programming of machines
    that deal with ones and zeros – digitally simulated pizza doesn’t taste of anything,
    and digital weather does not get us wet.


    The AI machines of the future will incorporate digital computers, but, when we
    think about it, it’s actually hard to represent the mathematical operations we
    need. We are limited by the processing power, energy and accuracy of today’s technology
    – and, as a result, we can only concentrate on narrow ML, focused on specific,
    well-defined tasks or goals.


    The examples given of these types of tasks are playing games such as chess, checkers
    and draughts. Modern-day games include simulation games and very advanced strategic,
    well-engineered games like Go; these types of games can be explicitly defined
    on a digital computer. Practical examples in the real world include optimising
    where aircraft park at an airport or the logistics of delivering a parcel; again,
    a reasonably well-ordered and engineered environment in which ML can optimise
    something.


    ML is focused on explicitly defining a problem that can be solved on a computer.
    These problems can be complicated, non-linear and statistical. If we are to use
    ML in our AI, we must be able to represent our problem mathematically and in such
    a way that it can be solved by a machine. Today, we typically use digital computers.
    However, quantum, analogue, optical and biological computers are on their way.


    THE REAL WORLD ISN’T A DIGITAL SIMULATION


    What would happen if we designed everything digitally? Would we trust something
    that is designed entirely by digital modelling? In this box we are not going to
    concentrate on a single example, but look at a concept that has been around for
    about 20 years – that of the digital twin.


    The digital twin is an example of where AI can be used to learn from a digital
    simulation, and maybe sensors; there are many examples where this concept has
    been used successfully (Wikipedia Contributors, 2024i). We also need to note that
    just because we have simulated something, it doesn’t mean it will perform the
    same way in reality.


    The digital twin has various definitions, and is not something to start without
    considering carefully if it is a good representation of the real world. Even a
    simple model of the Earth’s weather turns out to be incredibly complicated and
    requires large supercomputers to undertake.


    AI can also draw on the system of systems approach to modelling complex systems
    – lots of subsystems that, when combined, develop ever more complex behaviour.
    This has the advantage of being an academic subject linked closely with the fundamental
    disciplines that underpin AI and ML. Examples of these approaches are agent-based
    modelling and lifecycle analysis used in sustainability. With a system of systems
    approach, you can break the larger problem down into manageable chunks. Indeed,
    we might find out that one system requires so much computing power that the larger
    digital twin might not be feasible, or indeed realistic. In this case we need
    to build a model of the subsystem that can be incorporated into the system of
    systems approach.


    The digital twin concept built using the system of systems approach might be useful
    in ensuring that our AI is human-centric, technically robust and trustworthy.


    Digital ML has become very popular recently with the success of convolutional
    deep neural networks (NNs) and, more recently, generative AI. These numerical
    techniques have given us an understanding of how the human mind solves problems.
    Just to clarify this, the operation of the human eye led to the breakthrough in
    NNs: the convolution neural network (CNN). So, when we think about ML, we can
    think about an AI agent learning from data. These machines are now so good at
    playing games that they can beat the world champion at these types of games; we
    look at this in more detail in Section 1.1.2.1.


    The AI agent is much more than a narrowly focused computer program. ML works on
    data in the computer. We must work really hard to think of this as an interface
    with actuators and sensors in an environment. It is sensible to think, here, that
    ML learns from data in a computational environment. This is a good starting point
    to opening up the world of AI. AI is about humans and machines working together
    to achieve goals. We might even go on to say that ML is an AI enabler setting
    the foundation for a future of humans and machines.


    1.1.1.5 Deep learning and generative AI


    Deep learning and generative AI represent significant milestones in the journey
    of narrow ML; a step change in how we interact with technology to create new realms
    of possibility in art and science – these technologies are reshaping our world.
    As research progresses, we can anticipate even more innovative applications and
    breakthroughs, making deep learning and generative AI integral components of our
    future.'
