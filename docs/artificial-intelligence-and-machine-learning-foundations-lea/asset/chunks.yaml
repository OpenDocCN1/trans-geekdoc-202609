  trans: '

    在本章中，我们将探讨 AI 和 ML 将如何从近期未来发展到遥远的未来。特别是职业可能会如何演变，以及在这场令人兴奋的新兴第四次工业革命中，哪些职业正在兴起。你能够回溯
    20、30 或 40 年，并预见到你今天正在做的工作吗？你能预测出我们现在正在使用的技术和系统吗？对于某些人来说，我们今天生活的世界上令人失望，因为辩论认为，我们曾被许诺会有大量的个人机器人、飞行汽车和负担得起的太空旅行。我们仍在等待这些东西成为常态；尽管，说实实话，我们在
    `Mars` 行星上确实有几台自动漫游器。


    预测我们在 2030 年、2040 年甚至 2050 年的处同样困难，但我们根据目前的研究和正在开发中的技术创新进行尝试。如果你想看到不同的可能结果，马克斯·泰格马克的著作
    `Life 3.0 (2018)` 对可能的 AI 未来进行了智力且敏锐的探索，而雷·库兹韦尔的著作 `The Singularity is Near (2016)`
    则对未来进行了乐观的展望。


    AI 有许多益处。社交媒体的狂热、电视节目和电影都在赞美 AI 可能未来的成功，但我们需要务实，因为追逐象牙塔式的学术思想领袖实验并不能让这些益处变为现实。随着我们的进步，我们需要明确且谨慎地对待
    AI 和 ML 可以实现什么。


    Paul R. Daugherty 和 H. James Wilson 在 `Human + Machine: Reimagining Work in the
    Age of AI (2018)` 一书中写了他们作为管理顾问做这些事情的经历。在他们的书中，他们观察了 AI 如何应用于许多项目中的。他们描述了纯人类系统、纯机器系统和人机协作系统。他们描绘了未来的图景、人类和机器将扮演的角色，以及人类和机器将共同完成。未来将存在纯人类系统、纯机器系统和人机协作系统。


    ## 6.1 AI 提供的角色与职业机会


    在本节中，我们将描述纯人类系统、纯机器系统和人机协作系统，这些系统可能导致哪些角色，以及哪些已经存在。


    ### 6.1.1 纯人类系统


    人类擅长做什么？


    *   领导力与目标；

    *   创造力；

    *   共情能力；

    *   判断。


    在 `Chapter 1` 中，我们惊叹人类的能力。机器在某些方面还有差距——差几十年甚至可能几个世纪。人类擅长主观视角。我们富有创造力；例如，只有人类（在这种情况下是
    `Einstein`）才能想象出 `travelling\ on\ a\ light\ beam`的思想实验。它改变了我们对今天所知世界的理解。


    因此，人类将成为创造力的引擎。我们将让机器承担繁重的工作，自己留去做高价值的工作。模糊性也是人类的角色——如果 `AI` 因为矛盾而卡住了怎么办？这需要人类介入并决定结果。我们可以考虑许多需要人类干预的情况（例如，无法回答问题的困惑痴呆患者，或者一个伦理上的
    50/50 矛盾）。困惑的人类很容易困扰 `AI` 系统；其他人类需要在现场支持那个人。


    人类还必须提供领导力；我们必须设定目标和伦理标准。这些将形成原则、价值观和权利。我们将在法律中依赖这些，当判断是主观且模糊时，将由人类来完成这项高价值的工作。


    ### 6.1.2 纯机器系统


    机器擅长做什么？


    *   单调的任务；

    *   预测；

    *   迭代；

    *   适应。


    这四点描述了机器擅长的领域，这在数字计算机上显而易见。我们使用它们来执行单调的任务，如大量的精确计算。预测和迭代对于数字计算机解决我们的 `ML` 问题非常有用——大量的计算、重复的迭代、寻找解决方案。适应是未来机器的特征，机器将适应当天的需求。从这个意义上说，机器还将适应极端环境；这些环境可能是深海或人类暴露在极端环境下的其他行星。更务实地说，在无菌条件下准备食物或在手术室对人类进行手术，可能由机器完成得更好。


    #### 6.1.2.1 狭义（弱智能）AI、AGI 和强 AI


    弱智能或狭义 AI 是专注于特定任务的 AI。今天流行的 `ML`，即我们在云数字服务中发现的能力，是狭义 AI 或狭义 `ML`，专注于特定任务（例如监督学习和无监督学习）。狭义
    `ML` 的示例包括 `SVMs`、`decision trees` 和 `KNN` 算法。它们基于特定任务测试假设。从经验中学习实际上是从针对特定、专注任务的数据（`ML`）中学习。


    `AGI` 在 `Chapter 1` 中引入，是一种能够学习人类可以任何智力任务的机器。它是假设性的，对于一般的 `AI` 和 `ML` 并非必须。这种假设的
    AI 类型通常是推测的主题，有时令人类恐惧。我们距离实现 `AGI` 还很远，可能在几十年甚至几个世纪后才能接近它。


    `AGI` 可以更进一步。科幻小说热衷于假设机器具有意识；强 AI 是同样具有意识的 `AGI`。意识是复杂且困难的。有些人认为它是 AI 中最困难的问题。这将在章的后面部分详细介绍。


    `AGI` 和强力、或有意识的 `AGI` 目前是不可行的，在可预见的未来也是不现实的。这是一个活跃领域，但不是 `AI` 或 `ML` 的要求。


    ### 6.1.3 人机协作系统


    与其认为是由机器或人类承担某项任务，未来不是人类与机器和谐相处的吗？或者正如 Stuart Russell 所强调的那样，人类兼容 AI——这一概念是解决
    AI 控制问题的建议。Russell 的三个原则是 `(Russell, 2019)`：


    ‘1. 机器唯一的目标是最大化人类偏好的实现。

    2. 机器最初对这些偏好是什么不确定。

    3. 关于人类偏好的最终信息来源是人类行为。’


    这样设计的机器将控制 AI 的发展。理想情况下，人类将转向更高价值的工作，或有更多时间享受做人的乐趣。这些原则是新的，目前还不清楚它们将如何发展；然而，Stuart
    Russell 认为它们是面向未来的。


    人机协作的实际例子可以很容易地想象。使用外骨骼的人能够承担他们以前无法胜的任务，可能允许他们行走或举起重物。我们拥有搜索引擎和大型语言模型——学者可以在几秒钟搜索文献，这在
    40 年前可能需要几年甚至几十年。在医学领域，脑机接口和对大脑的研究让医生能够更好地理解中风恢复。事实上，我们可能能够对无法交流的患者进行意识测试。人类与机器结合的想法赋予了我们超人的能力。


    ### 6.1.4 AI 中的角色与职业机会


    在这里我们简要看看典型的 AI/ML 角色。这个列表并不完整，因为 AI 和 ML 领域发展非常快。然而，它应该让你了解我们预期和目前看到的。我们查看了 ML
    工程师、`数据科学家`、`AI 研究科学家`、`计算机视觉工程师`、`NLP 工程师`、`机器人工程师`、`AI 伦理专家`和 `AI 人类学家`的角色和职责。


    ML 工程师通常具有以下角色和职责：


    开发算法：设计、构建和实现 `ML` 模型和算法。


    数据处理：清洗、预处理和组织数据以供模型使用。


