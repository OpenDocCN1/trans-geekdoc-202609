    - 使用强化学习的构建算法；以及

    - `NN` 能够完成的一些基础示例。


    `NN` 赋予了机器从经验中学习并开发自身算法的能力（要解释这些算法是什么并不容易，因为它们被编码在 `NN` 中）。近年来，我们对 `NN` 如何运作的理解取得了显著进展。这些进展包括赢得了国际象棋和围棋等复杂的策略游戏，以及可能更具挑战性的任务，如控制机器人等复杂机器。通过这种方式，我们正在赋予机器更多的自主性。


    我们有许多种类型的 `NN` 可用，其中 `CNN` 因对 `ML` 做出的重大贡献而脱颖而出。然而，我们在这里不会详细介绍这种类型的 `NN`，因为其细节比我们在此处想要讨论的内容要复杂得多。


    为了从复杂且具有随机性（统计性）的问题中学习，我们需要使用深层神经网络（`DNNs`）。通常，我们采用 `DNNs` 处理机器人控制、图像分析（例如医学图像）和对抗性游戏等问题。随着本章节的深入，我们将介绍这些是什么，以及为什么这使得它们的训练是迭代的并需要专门的硬件（例如高性能计算机、`GPUs`
    等）。一个 `DNN` 许多许多层构成了 `NN`；这就是它被称为深层 `NN` 的原因。


    ### 4.2.3.7 NNs 与 AI 代理之间的联系


    `NN` 通常被显示为 `ML` 的子主题。`NN` 的发展始于 20 世纪 40 代，基于人类大脑的生物特性。1943 年，Warren McCulloch
    和 Walter Pitts 通过结合有限状态机、线性阈值元件和内存引入了神经逻辑网络的概念（McCulloch and Pitts, 1943），随后在
    1947 年发表了将这些思想扩展到模式识别的论文（Pitts and McCulloch, 1947）。Marvin Minsky 在 1951 年构建了第一个强化
    `NN`。这是一种使用强化学习进行学习的模拟或电子设备（Minsky and Papert, 1988）。这是自适应控制的开始，我们看到它与工程学之间正产生紧密的联系。1962
    年，Frank Rosenblatt 命名并定义了名为“感知器”的机器（Rosenblatt, 1962）；然而，直到 20 世纪 80 代 `NNs` 才获得显著关注。今天，该理论已被更深入地理解。数字计算机促进了使用
    `CNN` 执行复杂任务，如学习控制机器人和赢得组合复杂的游戏。


    学习型 AI 代理需要学习的能力。强化 `DNNs` 或 `CNNs` 正是如此。它们可以从传感器和执行器中学习，也可以从经过设计的计算机仿真或游戏中学习。


    狭义 AI 专注于特定问题。`NN` 是一种更通用的学习技术，可以应用于更广泛的场景。训练 `NNs` 容易，理解它们的输出也很困难。这为证明它们的合理性以及使用它们带来了挑战。


    ### 4.2.3.8 神经网络的基础构建模块


    在本节中，我们引入了对 `NNs` 关重要的学习概念。感知器是最初的概念，我们今天复杂的 `NNs` 就是从那里演变而来的。当我们构建 `NN` 的基础构建模块时，我们将看到感知器是如何其中的。


    `NN` 有一个基础的数学原理图，如图 4.6 所示，并基于 McCulloch 和 Pitts 在 1943 年的原工作。在图中，我们还看到了人类大脑神经元的简单表示。


    这些 `NN` 神经元中的每一个都构成了层（许多神经元），多个（隐藏）层构成了网络。第一层是输入层，数据从这里进入网络。这些 `NN` 神经元中的每一个都构成了层（许多神经元），多个（隐藏）层构成了网络。来自仿真、图像中的像素或来自传感器的数据。数据通过网络，就像人类大脑一样，神经元会被激活（或触发）。`NN`
    的三层版本如图 4.7 所示。


    图 4.6 神经网络原理图和人类大脑神经元（McCulloch and Pitts, 1943; https://commons.wikimedia.org/wiki/File:Neuron3.png,
    Creative Commons Attribution-Alike 3.0）


    ![image-LM7ASZ.jpg](img/image-LM7ASZ.jpeg)


    可以是任意数量，`DNNs` 有许多层。遗憾的是，在训练 `NN` 之前，我们不知道层数或 `DNN` 的深度。这是我们从经验中系统地学习的，也是超参数的一部分。在这种描述中，我们仔细地只使用前馈网络，其中节点的输入传递到下一层。`RNNs`
    还允许节点与同一层的其他节点进行通信。这些类型的网络被描述为更具动态性并可能会产生混沌。在这里我们将坚持前馈 `NNs`，因为我们正在建立直觉或理解。


    图 4.7 具有输入层、隐藏层和输出层的神经网络原理图。在 `NNs` 中，神经元是网络中的节点，节点由输入、激活函数和输出组成。节点通过链接连接（https://commons.wikimedia.org/wiki/File:Colored\_neural\_network.svg,
    Creative Commons Attribution-Alike 3.0）


    ![image-1ML95CI.jpg](img/image-1ML95CI.jpeg)


    `NNs` 通过从节点获取激活输出并通过链接传递这些信息来工作。链接连接节点的输出到下一层。节点输出的每个链接在传递到其他节点时都有独特的权重。我们不知道这些权重是多少，而训练就是关于确定它们应该是多少。


    这里有一个示例可能会帮助。假设我们有一张在智能手机上拍摄的高分辨率场景照片——照片类型并不重要。我们可以使用 `NN` 分析这张照片。照片以矩阵的形式存储在手机中，代表特定位置图像的颜色。`NN`
    将此矩阵作为输入，并将此数字传递给第一层的每个节点。在传递之前，它会根据输入节点与目标层节点之间的唯一权重对其加权。第一层中的每个节点然后相加它们收到的颜色数字和权重。这些加权颜色数字之和然后通过激活函数。如果该操作的输出大于设定值，则假设该节点被激活，并将结果传递到下一层。如果没有被激活，则该节点未被激活，其输出为零。


