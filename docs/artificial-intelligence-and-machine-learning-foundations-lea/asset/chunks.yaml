- raw: 'Deep learning has the ability to model and understand complex patterns in
    data. They are built on the use of artificial NNs that date back nearly a hundred
    years. In essence, they are a simple mathematical model of the human brain. Deep
    learning models consist of multiple layers, including an input layer, several
    hidden layers and an output layer. Each layer contains nodes (neurons) that process
    and transform data. The depth of the network (i.e. the number of layers) enables
    it to learn hierarchical representations of data, capturing intricate features
    at different levels of abstraction. The term ‘deep’ captures the large number
    of layers we see in the large model.


    Notable applications include autonomous vehicles, where deep learning algorithms
    enable perception and decision-making, and healthcare, where deep learning assists
    in diagnosing diseases and predicting patient outcomes. Moreover, deep learning
    models power recommendation systems, enhancing user experiences on platforms such
    as Netflix and Amazon. In natural language processing (NLP), recurrent neural
    networks (RNNs) and transformers have significantly improved machine translation,
    sentiment analysis and language generation.


    Generative AI creates new content rather than analysing existing data. This is
    achieved through generative models, which learn the underlying distribution of
    data and can produce novel samples that resemble the training data. Two prominent
    types of generative models are generative adversarial networks (GANs) and variational
    autoencoders (VAEs). GANs have been instrumental in generating high-quality images,
    videos and even music. They have applications in art, fashion and content creation,
    allowing for the synthesis of new, creative works. Here we see the immediate challenge
    of the ethical and legal issues this causes.


    AI foundation models are large-scale ML models trained on vast amounts of diverse
    data to perform a wide array of tasks. They have been developed within the AI
    industry, with academia now doing the rigorous fundamentals (Bommasani et al.,
    2021). These models, such as GPT-4, are designed to understand and generate human-like
    text by leveraging deep learning techniques and extensive NN architectures. They
    serve as a foundational base for various AI applications, including NLP, image
    recognition and decision-making systems. By being pre-trained on extensive data
    sets, foundation models can be fine-tuned for specific applications with relatively
    smaller amounts of data, making them highly adaptable and efficient. Their broad
    capabilities and scalability have unlocked the field of AI, enabling more sophisticated
    and versatile AI solutions.


    1.1.1.6 Distinctions between narrow, general and super-intelligent AI


    Weak or narrow AI is AI focused on a specific task (Russell and Norvig, 2016).
    Popular ML of today, the capability we find on cloud digital services, is narrow
    AI, or narrow ML, focused on a specific task (e.g. supervised and unsupervised
    learning). Examples of narrow ML are support vector machines (SVMs), decision
    trees and K-nearest neighbour (KNN) algorithms. They test a hypothesis based on
    a specific task. The learning from experience is on a specific, focused task.


    Artificial general intelligence (AGI) is a machine capable of learning any intellectual
    task that a human can. It is hypothetical and not required for AI and ML in general.
    This hypothetical type of AI is often the subject of speculation and sometimes
    feared by humans. We are nowhere near AGI, and it could be decades or even centuries
    before we are close to achieving it.


    AGI can be taken one step further. Science fiction is fond of machines that are
    assumed to have consciousness; strong AI is AGI that is also conscious. Consciousness
    is complex and difficult. Some consider it to be the hardest problem in AI. This
    is covered in more detail in Chapter 6, particularly Section 6.4.1.


    AGI and strong, or conscious, AGI is not currently feasible and is not realistic
    in the foreseeable future. It is an active area of research, but not a requirement
    for AI or ML.


    The origins of consciousness are not known; we can only speculate as to what consciousness
    is. Professor David Chalmers has posed two questions of consciousness, the easy
    question and the hard question (Chalmers, 1996):


    The easy question is to explain the ability to discriminate, react to stimuli,
    integrate information, report mental states – and we can study these with the
    scientific method.


    The hard question is about how and why physical processes give rise to experience.
    Why do these processes take place ‘in the dark’, without any accompanying state
    of experience?


    An essential part of being human is subjective experience. Understanding this
    conscious experience is not going to be easy. Professor Chalmers and Professor
    Roger Penrose both think that the answer to the hard question could be as hard
    as quantum mechanics. Professor Penrose has proposed a mechanism or foundation
    for consciousness based on quantum mechanics (Penrose et al., 2011). More detail
    of these concepts can be found in the Further reading list at the end of this
    book.


    There has been considerable debate about consciousness. It is an open question
    and an academic exercise. One of the core complete rejections of strong AI, at
    least in digital computers, is presented by Professor John Searle. He argues,
    using the Chinese Room thought experiment, that strong AI cannot occur, and states
    (Searle, 2002):


    Computational models of consciousness are not sufficient by themselves for consciousness.
    The computational model for consciousness stands to consciousness in the same
    way the computational model of anything stands to the domain being modelled. Nobody
    supposes that the computational model of rainstorms in London will leave us all
    wet. But they make the mistake of supposing that the computational model of consciousness
    is somehow conscious. It is the same mistake in both cases.


    Just like Sir James Lighthill’s report on AGI that started the AI ‘winter’ of
    the 1970s and 1980s (Lighthill, 1973), Professor Searle has given us an argument
    against the next step for strong AGI as well. In both cases – AGI and strong AI
    – we should note that they are a long way off and currently narrow, or weak, AI
    is here and working. Neither AGI nor strong AI are a requirement for AI. We, as
    humans, set the goals for our AI to achieve. Working within the European Union
    (EU) ethical guidelines for AI points us in the right direction for our AI to
    have a human-centric ethical purpose, to be trustworthy and technically robust.
    This approach echoes the work of Professor Max Tegmark, who emphasises the necessity
    of goals when making explicit what goals machines will achieve (Tegmark, 2018).
    What this means is that any explicit AI machine goal should be focused on achieving
    goals that are aligned with human goals. He shows that we need machines to align
    with our goals.


    ## 1.1.2 Key milestones in AI development


    Today we are mainly concerned with the current use and future applications of
    AI and the benefits we would like to obtain from its use, but we should not ignore
    where and when AI first appeared, the history of AI and the challenges encountered
    along the way. To ignore our AI history would be to risk some of those challenges
    recurring.


    Before we look at AI’s history, it’s worth noting that it is now generally recognised
    that John McCarthy coined the term ‘artificial intelligence’ in 1955.'
