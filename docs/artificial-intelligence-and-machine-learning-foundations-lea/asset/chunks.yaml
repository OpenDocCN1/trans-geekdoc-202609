  trans: '


    如果我们从机器学习（ML）进一步思考人类与机器的协同工作，我们现在需要考虑人类如何增强机器，以及机器如何增强人类。我们正处于一个 AI 系统的伦理目的至关重要的节点上。人类和机器的角色将明确出现，以确保我们的
    AI 系统具有以人人为本的伦理目的。


    ### 5.1.1 增强人类


    首先，让我们看看机器如何有效利用信息技术来增强人类的能力。改进的范围从性能的轻微提升到使我们成为超级人类。


    为了做到这一点，我们需要引入一个新概念：智能自动化或增强（`IA`）。`IA` 旨在使用 ML 技术来协助而非取代人类。`IA` 可以将计算机视觉、自然语言处理（NLP）和
    `ML` 等技术应用于 `RPA`，从而对不一定具有基于规则的结构的流程实现自动化，例如，与肿瘤学家一起使用 `IA` 系统来识别活检切片中的癌细胞——在以前，这项任务需要两个肿瘤学家。这是一个人类与机器共同工作以造福人类的例子。


    `IA` 技术的最新进展已通过提高工人生产力、减轻单调重复的任务以及在我们的生活中引入并增强便利性，帮助了人类潜力的提升。几十年来，某些机器在执行特定任务方面远优于人类，但我们现在越来越多地看到
    `IA` 在许多行业和生活领域渗透率的提高和持续加速。在未来几十年里，随着技术的改进和对 `IA` 接受度的提高，我们将看到这些领域进一步的快速进展。我们已经开始从经验中学习，看到
    `AI` 对知识工作者的技术颠覆正在重新定义他们的工作。合理的信任是采纳和利用这一技术的关键；它需要良好的治理以及一致的保证机制。


    ### 5.1.2 增强机器


    人类增强机器的关键领域在于让 `AI` 和 `IA` 对普通人们来说更易理解、更易接受。


    在简单的层面，机器可以增加我们的学习并使其更有效。我们人类必须协调这种学习，并在机器遇到矛盾或失败时提供支持。我们还需要确保机器正在做正确的事。记住，我们的
    `AI` 系统需要以人人为本的伦理目的。机器没有意识或情感，这使得共情变成了一个大问题。人类需要设定目标，不仅关于我们要去哪里，还关于我们如何到达那里。需要人类监督的一个例子是，引入在某种程度上会对员工造成压力的机器带来的后果。这是主观的，人类可以理解并可能纠正这一点。人类可能以对另一个人类有用的方式，解释
    `AI` 系统为何得出某个结论或诊断。


    ## 5.1.3 业务计划书的结构


    在本节中，我们将查看 `AI` 业务计划书的结构。业务计划书是一份正式的文档或演示稿，概述了投资或项目的合理性。它旨在帮助决策者评估与该倡议相关的潜在收益、成本和风险。编写和制作业务计划书的过程意味着团队开始从经验中学习并做出明智决策。一个构建良好的业务计划书通常包含几个关键要素：提供建议简要概述的执行摘要；对项目解决的问题或机会的清晰陈述；对拟议解决方案的详细分析，包括目标、范围和交付物；提供成本估算、资金需求和预期投资回报率（`ROI`）的彻底财务分析；风险和缓解策略的评估；以及概述时间表、里程碑和责任的实施计划。此外，它还应该包含对所考虑的替代方案的评估以及推荐方案的理由。通过结合这些要素，业务计划书确保了对项目可行性及其与组织目标对齐的全面评估。


    ### 5.1.3.1 AI 或 ML 业务计划书


    与传统的业务计划书相比，为 `AI` 或 `ML` 项目创建业务计划涉及几个独特的考虑。接下来强调的考虑显示了 `AI/ML` 项目的独特方面，这些方面需要在业务计划书中解决，以确保清晰性、管理预期并为实现预期结果提供清晰路径。传统业务计划书格式示例是：


    ```

    引言；

    管理或执行摘要；

    当前状态描述；

    已考虑的选项；

    描述的选项：

    成本与效益分析；

    影响评估；

    风险评估；

    建议；

    附录/支持信息。

    ```


    对于传统项目，技术可行性更为直接，侧重于标准的软件或硬件实现，不需要详尽的数据科学或模型训练。请注意，这侧重于 `ML` 项目。然而，硬件至关重要，因为包含了传感器和执行器。`AI`
    和 `ML` 项目需要对技术可行性进行详细评估，包括数据的可用性和质量、算法的复杂性、模型训练和部署挑战。你需要考虑基础设施需求以及 `AI/ML` 模型与现有系统的集成。记住我们人人为本的伦理目的所包含的伦理需求。


    如果我们把 `ML` 项目扩展到复杂的人类与代理与环境交互，我们的项目将具有一个新的维度。具体来说，计算能力（计算次数）和内存（数据存储）可能需要几十年来规划和构建；例如，天气建模。


    在过去的几十年里的项目中，我们看到技术可行性更为直接，侧重于标准的软件或硬件实现。如果我们拥抱从经验中学习或从数据中学习，那么这些项目就需要对可行性进行详细的评估，包括数据的可用性和质量、算法的复杂性、模型训练和部署挑战。我们需要考虑基础设施需求以及
    `AI/ML` 模型与现有系统的集成。`AI` 和 `ML` 算法是通过科学方法开发的，因此数据需要为算法做好充分准备。`AI/ML` 项目的成功在很大程度上取决于训练模型的数据，以及用于验证和确认模型训练的测试数据。


    我们习惯于风险更具预测性和可控，与项目范围、预算和时间相关，而我们现在正进入具有更高风险和不确定性的项目，这些风险源于模型准确性、过拟合、数据偏差以及持续模型维护和更新的需求等因素。业务计划书必须解决这些风险并提出缓解策略。例如，自动驾驶汽车在良好的高速公路上是安全可靠的但在乡村道路的细微差别面前很吃力。这是机器学习运营（`MLOps`）/人工智能运维（`AIOps`）或模型运营（`ModelOps`）方法的关键业务理由；它提供了跨生命周期的关键机制，以应用必要的流程降低风险并最可能实现预期结果。


    '
