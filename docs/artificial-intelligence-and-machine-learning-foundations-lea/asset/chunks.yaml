    代理性（Agency）一词源于中世纪英语后期（产生影响的人或物），基于拉丁语单词 `agere`，意为“做/行动”。


    ### 图 3.1 学习代理体——基于 Russell 和 Norvig (2016) 中的代理结构


    ![image-URVTQEGA.jpg](img/image-URVTQEGA.jpeg)


    “学习代理体”是一个 AI 代理的概括性图，它能够学习如何执行某些任务。与上述详细描述的根据提供的信息行动四种智能代理不同，这种特殊的代理能够从经验中学习。通常，它从一些基础知识开始，通过学习进行适应。学习代理体能够：


    - 执行任务；

    - 分析自己的性能；

    - 寻找改进这些任务的新方法。


    此外，它可以独立完成这一切。


    学习代理体的一个例子是个人助手，如 `Siri` 或 `Alexa`，它们可以在互联网上查询你当地的天气，并建议你是否需要穿外套，因为它已经学习到当你没有睡好觉时，你喜欢去散步。


    人类崇崇代理性，而人类是在环境中行动的代理（Coole, 2017）。人类想要行动的自由意志——这对我们来说很重要。为了让机器人拥有行动的自由意志，我们称之为自主性。自主机器人通常在电影中被描绘成反派，因为我们试图为机器人的行动赋予意义。机器人（至少目前）是客观且理性的，并按照我们告诉它们去去做（有时这可能会产生坏后果）。人类是主观的，我们的自由意志是主观的，当我们思考代理性时，必须考虑我们行动的主观方面——这导致了对人类在哲学和道德上的理解。在定义
    AI 代理时，我们依赖于代理是理性的，就像工程师使用客观科学来设计机器人一样。


    #### 3.2.1.1 理性代理的四个依赖条件


    我们期望 AI 代理是理性的，这取决于四个四个方面（Russell and Norvig, 2016）：


    1. 定义成功标准的性能衡量标准。

    2. 代理对环境的先验知识。

    3. 代理可以执行的行动。

    4. 代理到目前为止的感知序列。


    这四个要素是为理性代理提供基础学术依据所需的。如果我们仔细一想，我们需要所有四个要素，这样其他人才能复制我们的结果。如果没有它们，代理将是未定义的。


    我们知道 AI 是一门基于科学方法的学术学科。在思考 AI 代理时，理性是有帮助的。因此，在设计 AI 代理时——可能是一个机器人、数据机器人或观察人类行为的模拟代理——我们期望它们理性地行动，并执行我们要求它们做的事。回到
    Russell 和 Norvig 对理性代理的定义（2016）：


    对于每种可能的感知序列，理性代理应该在给定感知序列提供的证据以及代理所拥有的任何内置知识的情况下，选择一个预期能使其性能衡量标准最大化的行动。


    我们可以看到，当我们设计一个 AI 系统、机器人或工程产品时，它在告诉我们，它必须按照我们设计的方式来运行。


    #### 3.2.1.2 代理——性能衡量标准、环境、执行器和传感器


    如果我们是一个被要求设计一个智能实体的工程师，那么定义一个可以衡量其性能的性能衡量标准，定义它运行的环境，以及它用于操纵环境的执行器和传感器是非常有意义的。通过这种方式，我们创建了一个可以从经验中学习的智能实体。如果我们以人形机器人建造者为例，那么我们可以对每一项描述如下：


    - 性能衡量标准是在墙上铺设固定数量砖块的速度。

    - 环境是建筑区域或房间。

    - 传感器是触觉传感器、功率传感器、视觉和听觉传感器等。

    - 执行器是手、身体、脚、腿等。


    这是一个**分解状态**（factored state）。


    以某种方式，这似乎很简单，但在数学上它并不是显性的。我们可以考虑构建一个数字孪生（digital twin），以便我们对其进行建模和学习。这意味着我们可以为机器人构建一个供其学习的模拟环境，有点像电脑游戏。就像我们在飞行模拟器中教飞行员飞行一样，我们可以以同样的方式教机器人。或者，也许我们可以让机器人使用强化学习来教自己。要更详细地从数学角度理解这些概念，请参阅
    Russell 和 Norvig (2016)。


    代理可能想要自己的环境地图。我们将其称为代理的“世界状态”（state of the world）。它是代理的内部世界，代理可以用它来弥补信息的缺失。这个世界可以是简单的，例如，一段铁轨和轨道温度可能就是我们控制自动列车所需的所有。这是**原子状态**（atomic
    state）。它可能会稍微复杂一点，我们使用一系列传感器来确定我们运行的世界或环境的状态——例如，雨、温度、风和湿度决定了我们火车行驶的天气。这是一个**分解状态**。最后，我们有了最完整的理解：**结构化状态**（structured
    state）。在这里，对象以及这些对象之间的关系让代理对所运行的环境有更详细的理解。它可能使用 AI 来预测不同行动的结果；这在图 3.2 中以示意图所示。


    在理解代理时，我们需要理解其内部世界的数学，因此如果我们需要训练一个智能实体，使用数字孪生似乎是一个明智的主意。如果我们需要多个智能代理协作来实现一个目标，会发生什么？


    ### 图 3.2 世界状态——代理用于弥补信息缺失的内部世界


    ![image-5VSROFT.jpg](img/image-5VSROFT.jpeg)


    #### 3.2.1.3 基于建模


    基于代理的建模（ABM）被用于理解代理如何协作以实现目标（Wikipedia Contributors, 2024l）。我们认为这就像蜜蜂如何建造一个精妙的结构来产生蜜。基于代理的模型可以观察蜜蜂如何交流、如何维护秩序或控制；以及智能实体如何与人类或其他动物周围工作。ABM
    是理解涌现行为的一种非常有用的的方法。当我们思考 ABM 时，控制多个代理或寻找分层控制系统（subsumption）将成为一个关键概念（Wikipedia
    Contributors, 2024m）。这是一个日益增长的兴趣领域，我们稍后研究智能机器人时涉及到 ABM。


    ## 3.2.2 代理类型：反射、基于模型的反射、基于目标和基于效用的


    在 AI 中，智能代理指的是一种自主实体——通过传感器进行观察并随后使用执行器，朝着在环境中实现目标进行行动——因此它是智能的。基本上有四种理性代理类型，示例从简单的供暖系统控制代理到复杂的自动化全科医生（GP/doctor）代理不等。让我们来看每一种。


    #### 3.2.2.1 反射代理


    在 AI 中，简单反射代理是智能代理的一种，它仅根据当前情况执行行动。代理通过这些情况的预设规则来实现这一点。这通常被称为条件-行动规则（condition–action
    rule）：程序根据当前感知选择行动。它很容易理解和编写。


    示例：中央供暖过热，因此程序选择关闭电源的行动。


    #### 3.2.2.2 基于模型的反射代理


    在基于模型的反射代理中，代理拥有一个世界模型，需要时可以调用：


    - 它可以使用一个不需要传感器数据的虚拟世界来弥补传感器的缺失。


