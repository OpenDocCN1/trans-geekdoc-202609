  trans: '

    深度学习具有建模和理解数据中复杂模式的能力。它们建立在对人工 `NNs` 的使用之上，这种技术可以追溯到近百年前。从本质上说，它们是大脑的简单数学模型。深度学习模型由多个层组成，包括输入层、若干隐藏层和一个输出层。每一层都包含处理和转换数据的节点（神经元）。网络的深度（即层数）使其能够学习数据的层次化表示，捕获不同抽象层次的复杂特征。“深（deep）”一词概括了我们在大型模型中看到的大量层数。


    显著的应用包括自动驾驶汽车，深度学习算法在其中实现了感知和决策；以及医疗保健领域，深度学习协助诊断疾病并预测患者预后。此外，深度学习模型驱动着推荐系统，增强了
    Netflix 和 Amazon 等平台上的用户体验。在自然语言处理（NLP）中，循环神经网络（RNNs）和 transformers 显著改进了机器翻译、情感分析和语言生成。


    生成式 AI 创造新内容，而不是分析现有数据。这是通过生成式模型实现的，这些模型学习数据的底层分布，并能够产生类似于训练数据的新颖样本。两种主要的生成式模型类型是生成对抗网络（GANs）和变分自动编码器（VAEs）。GANs
    在生成高质量图像、视频甚至音乐方面发挥了重要作用。它们在艺术、时尚和内容创作中有着应用，允许合成新的创造性作品。在这里，我们看到了这引发的伦理和法律问题的直接挑战。


    AI 基础模型是大规模 ML 模型，在海量多样化数据上进行训练以执行各种任务。它们在 AI 行业内部开发，而学术界目前正在进行严谨的基础研究（Bommasani
    et al., 2021）。这些模型（如 `GPT-4`）旨在利用深度学习技术和广泛的 `NN` 架构来理解并生成类人文本。它们为各种 AI 应用（包括 NLP、图像识别和决策系统）提供了基础支撑。通过在广泛的数据集上进行预训练，基础模型可以使用相对较少的数据针对特定应用进行微调，使其具有极高的适应性和效率。它们广泛的能力和扩展性开启了
    AI 领域，使得更复杂、更多用途的 AI 解决方案成为可能。


