    \ energy and accuracy of today’s technology. As a result, we can only concentrate\
    \ on narrow ML, focused on specific well-defined tasks or goals. These tasks are\
    \ defined by Tom Mitchell’s often quoted definition (Mitchell, 2018: 2):\n\nA\
    \ computer program is said to learn from experience, E, with respect to some class\
    \ of tasks, T, and performance measure, P, if its performance at tasks in, T,\
    \ as measured by, P, improves with experience, E.\n\nThe examples given of these\
    \ types of tasks are playing games such as chess, checkers and draughts. Modern-day\
