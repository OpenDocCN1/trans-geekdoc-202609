    AI 代理（Agents）的概念通过理性代理得到了解释，这类代理会根据在给定环境中性能最大化的原则选择行动。本章详细介绍了不同类型的代理——反射型代理、基于模型的代理、基于目标的代理和基于效用的代理——并强调了它们在自主处理任务时日益增加的复杂性。


    本文探讨了机器人技术在 AI 中的作用，追溯了智能机器人的发展过程以及 AI 如何增强它们执行复杂任务的能力。介绍了机器人技术中的关键范式——分层式、反应式和混合式，展示了机器人如何处理传感器数据并做出决策。


    本章还深入探讨了机器学习（ML），讨论了其在线性代数、向量微积分和概率论方面的基础原理，以及监督学习、无监督学习、半监督学习和强化学习技术在 AI 应用中的作用。这些技术使
    AI 系统能够从数据中学习、解决复杂问题并与其环境进行交互。


    总之，本章将 AI 和 ML 的技术基础与实际应用结合起来，为智能代理和机器人技术如何推动各个领域 AI 技术的发展提供了见解。


    # 4 数据与 AI


    ## 4.1 AI 中的数据

    在本章中，我们扩展了数据的使用，通过 `ML` 从数据中学习。我们可以从各种来源获取数据，数据将以许多形式和水平出现。为了理解这些数据，我们将使用数字计算。


    ### 4.1.1 关键术语

    让我们定义在本节中探索的典型术语：

    * 数据类型（结构化、半结构化和非结构化）；

    * 大数据；

    * 数据可视化。


    ### 4.1.1.1 数据类型——结构化数据

    `ML` 中的结构化数据高度组织、易于检索且通常存储在表格或数据库中的信息。这些数据的特征是具有预定义的模式（schema），每一列代表特定的特征或属性，每一行代表一个记录或实例。结构化数据的示例包括客户信息、财务记录和来自
    `IoT` 设备的数据。在 `ML` 中，结构化数据至关重要，因为它们允许对分类、回归和聚类等任务进行直接分析。其良好定义的性质有助于数据预处理、特征提取以及与
    `ML` 流水线的集成。警告的是：尽管这是最简单的数据形式，但为了理解和使用 `ML` 算法，我们仍然需要精通标量（scalars）、数组（arrays）和张量（tensors）。


    ### 4.1.1.2 数据类型——半结构化数据

    `ML` 中的半结构化数据指不符合严格表格格式但仍包含组织化标记的信息，使其比结构化数据更灵活。示例包括 `JSON`、`XML` 和 `YAML` 文件，以及邮件和
    `HTML` 文档。在 `ML` 中，处理半结构化数据涉及将相关信息转换为更易分析格式，这通常需要复杂的预处理步骤，如归一化和特征提取，为建模做好准备。半结构化数据非常有价值，因为捕捉了来自各种来源（如网页和社交媒体动态）的复杂信息，使
    `ML` 算法能够利用丰富的数据集提高预测性能和更具洞察力的分析。本质上，我们对这些数据的实践越多，从中提取价值的能力就越强。这是一个更复杂的编排过程。


    ### 4.1.1.3 数据类型——非结构化数据

    `ML` 中的非结构化数据指缺乏预定义格式或组织框架的信息，使其在处理和分析上本质上更加复杂。这种数据类型包括文本文档、图像、音频文件、视频、社交媒体帖子和其他形式的多媒体内容。由于其自由形式的性质，非结构化数据无法整齐地放入行和列中，对传统的数据处理和分析方法构成了巨大挑战。在
    `ML` 中，从非结构化数据中提取有意义的见解涉及高级技术，如针对文本的 `NLP`、针对图像和视频的计算机视觉以及针对声音的音频信号处理。这些技术将非结构化数据转化为
    `ML` 算法可以利用的结构格式变得日益重要，因为它代表了数字时代产生的大部分数据，为开发预测模型、改进决策过程以及发现跨应用的隐藏模式和趋势提供了丰富的信息源。处理这类数据并从中提取价值可能需要使用
    `ML` 技术来理解这些数据。这是我们现在掌握的一个令人兴奋的 `ML` 领域。我们的手机很快将拥有更好地指导我们使用它们的 `AI`。可能我们的数字 `AI`
    能力将为我们开发，我们不需要像想象中那样频繁处理非结构化数据。我们只会习惯于让 `AI` 为我们完成。这里的意思是，我们不需要理解搜索引擎是如何工作的，可以通过学习如何使用它来最大化其收益。


    ### 4.1.1.4 大数据

    大数据是一个通常用于描述互联网上可以找到的海量数据的术语。大数据具有以下特征（Gregersen, 2024）：

    * `Volume`（量量）：衡量存储和生成的数据数量。

    * `Variety`（多样性）：衡量数据的性质和类型。

    * `Velocity`（速度性）：衡量数据移动的速度。

    * `Veracity`（真实性）：衡量数据质量、价值或效用。


    `ML` 中的大数据是指以高速度产生且具有多种格式的海量数据，传统的数据处理工具无法高效处理。这些数据涵盖源自社交媒体、传感器、交易系统和多媒体等众多来源的结构化、半结构化和非结构化信息。在
    `ML` 中，大数据提供了训练更准确、更稳健的模型所需的原材料。大数据的规模和多样性能够发现小型数据集可能会错的复杂模式、关系和见解。利用大数据需要专门的技术和架构。应用于大数据的
    `ML` 算法可以在预测分析、实时处理和个性化体验方面带来突破，推动从医疗到金融等各个行业的创新和竞争优势。


    我们可能通过思考从源上开启了什么来理解大数据。互联网为我们提供了互联性，意味着数据可以从世界各地被挖掘。它还允许我们访问处理大数据所需的海量数据处理。因此，为了利用大数据，我们必须熟悉并行计算和网络。


    '
