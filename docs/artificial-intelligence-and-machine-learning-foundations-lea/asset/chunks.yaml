    2002 年`iRobot`发布了`Roomba`，它能够在导航和避开障碍的同时自主清洁地面。到 2004 年，它的销量达到了百万台，到 2020 年超过了
    800 万台。`iRobot`随后又创造了一系列其他商业、环境、军事和医疗机器人。今天，你会看到由 AI 割草机、喂食器器和喷淋器维护的花园草坪。


    2004 年，美国国防部著名的研究机构美国高级研究计划局（`DARPA`）发起了“DARPA 大挑战赛”，为能够自主行驶超过 150 英里的车辆的竞争者提供奖金。随后，在
    2007 年，`DARPA`启动了“城市挑战赛”，要求自动汽车遵守交通规则并在城市环境中运行，在六小时内行驶 60 英里。


    Google 于 2009 年进入自动驾驶市场，并制造了第一辆自动驾驶汽车，这引发了`特斯拉`、通用汽车、大众和福特等若干进入同一市场的竞争者之间的商业之战。


    从 2011 年至 2014 年，推出了一系列智能手机应用程序，它们使用自然语言回答问题、提供建议并执行操作：苹果的`Siri`（2011）、Google
    的`Google Now`（2012）以及微软的`Cortana`（2014）。


    Google 的子公司日本`SCHAFT Inc`制造了机器人`HRP-2`，它在 2013 年击败了 15 支团队赢得了“DARPA 机器人挑战赛”。`HRP-2`机器人在灾难响应所需的八项任务中获得了
    32 分中的 27 分。这些任务包括驾驶车辆、越过碎片、爬梯子、清除碎片、穿过门、切开墙壁、关闭阀门和连接软管。


    2015 年，一封呼吁禁止开发和使用自主武器的公开信，由史蒂芬·霍金、埃隆·马斯克、史蒂夫·沃兹尼亚克以及 3000 多名人工智能和机器人领域的领军人物共同签署。


    2016 年，Google 的`DeepMind AlphaGo`超级计算机在五局围棋赛中击败了世界围棋冠军李世石（围棋是一种起源于 2500 多年前中国的战略棋类，被认为是世界上最复杂的策略游戏之一）。超级计算机仅通过
    30 小时的无监督学习就学会了下围棋。李世石是一位九段职业韩国围棋冠军，在 2002 年至 2016 年间获得过 27 场大赛冠军。他在 2019 年宣布退出这项比赛，称
    AI 创造了一个“无法击败”的对手（Vincent, 2019）。2017 年，`AlphaGo`的改进版本`AlphaGo Zero`击败了世界上最强的国际象棋程序`StockFish
    8`，在 100 局比赛中赢了 28 局，平了 72 局。令人震惊的是，`AlphaGo Zero`在不到四小时内就学会了下国际象棋。


    同样在 2017 年，加利福尼亚州蒙特利附近举行了“阿西洛有益 AI 会议”（`Asilomar Conference on Beneficial AI`）（Wikipedia
    Contributors, 2024j）。经济、法律、伦理和哲学领域的思想领袖花费了五时间专门讨论有益 AI。他们讨论了 AI 伦理以及如何在带来有益 AI
    的同时，避免通用人工智能（AGI）带来的生存风险。


    图 1.1 展示了 AI 和 ML 演变的简单示意图。在这里，在 2024 年，我们看到了基础模型的出现，它为 AI 提供了工具箱，用于构建利用海量数据的应用程序和产品。所有主要的科技公司都在生产专业人士使用的基础模型。AI
    用户现在可以随时触及生成式 AI。基础模型是对多用途 Transformer 模型的通用描述。Rothman 使用“基础模型”一词来强调我们拥有的丰富资源，并将其描述为一种范式转移（Rothman,
    2024）。将其转化为现实，显而易见的例子就是 OpenAI 的`ChatGPT`。


    图 1.1 AI 所在的位置


    ![image-B7UWMX8F.jpg](img/image-B7UWMX8F.jpeg)


    ## 1.1.3 AI 的类型


    在本节中，我们对 AI 这一通用性主题进行更广泛的描述。根据功能、能力和应用，我们可能会遇到几种类型。我们可以将 AI 类型视为同一主题的不同版本或实现目标的手段。


    - **功能性类型**包括反应式机器、有限记忆、心理理论和自我意识 AI。

    - **能力类型**包括节点 AI（或弱 AI）、通用 AI（或强 AI）和超级智能 AI。

    - **应用类型**包括专家系统、自然语言处理（NLP）、计算机视觉、机器人和推荐系统。


    这个列表并不是详尽的，因为发展速度正以极具激励性且不断增长的速度开辟新的创意和令人兴奋的方向。今天，我们已经可以使用专注于定义良好或工程化的特定任务的节点
    AI 了。


    ## 1.1.4 工业革命


    我们目前正处于第四次工业革命之中，一些人认为我们已经达到了第五次工业革命，尽管这尚未被定义。在每一次工业革命中，人类都设计并开发了使人类能力发生范式转移的技术，并利用这些技术推动进步，尽管也有人认为并非所有人类都从这些进步中获益。


    第一次工业革命发生在 18 世纪和 19 世纪，主要在欧洲和美国。它主要在 1760 年至 1840 年间范围内发展（尽管具体日期尚有争议），导致了从手工生产方式向机器生产的转变——最初由蒸汽机驱动的大纺织工厂引领。它是历史上的重大转折点，导致了全球贸易和人口快速增长，并使大量农村地区城市化和工业化。


    第二次工业革命发生在 1870 年至 1914 年间，主要跨越欧洲、美国和日本。有时被称为技术革命，由于大规模生产和流水线的引入，再次成为人类的范式转移。电力使用的增加允许制造业和生产的进步，并带来了内燃机、电话和灯泡等技术进步。


    第三次工业革命始于 20 世纪 50 年代，通常被称为数字革命。它为我们带来了太空探索、生物技术、半导体、大型机计算以及信息通信技术（ICT），并将个人电脑、互联网和商品自动化生产引入社会。


    第三次和第四次工业革命之间存在某种模糊。我们认为现在正处于第四次革命。第四次革命利用了数字革命取得的成就，并具有颠覆性，由 AI、机器人、物联网（IoT）、三维（3D）塑料打印、纳米技术、生物工程等驱动。


    我知道你们在想什么：“在工业革命之间发生了什么？”我们在革命之间并没有停止发明或改进，全球不同地区以不同的时间和不同的速度经历了这些，但这些特定时期是思维和发明的范式转移。


    创新扩散理论由 E.M. Rogers 于 1962 年开发，解释了想法或产品如何随时间推移在特定人群中获得动力并传播（扩散），他将创新者分为五类：创新者、早期采用者、早期大众、晚期大众和落后者。这是基于某些个人不可避免比其他人更容易采纳和适应的想法。全球范围内
    AI 技术的采用将比其他技术的采用更快，因为我们看到工业革命持续的时间从几个世纪缩短到十年，再到几年的几分之一，但我们仍将由创新者引领，仍然会有落后者甚至卢德分子。


