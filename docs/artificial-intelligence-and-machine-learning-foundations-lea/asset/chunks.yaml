    **Steve Lawless** – Steve 对科学技术一直有浓厚兴趣，在计算机行业工作了 40 多年。Steve 培训了数以千计的人使其使其运行计算机所需的技能。他在当地滑雪俱乐部做志愿者认识了
    Andy。他经营着一家成功的培训公司，拥有全球客户群。他编写了超过 100 门 IT 培训课程，并乐于让技术变得易于理解和获取。


    **Dr Andrew Lowe** – Andy 是一位工程师，专门利用计算机解决工程师面临的挑战。从经验学习和从数据学习是他职业生涯的基石，这有助于他的日常工作。他处理的一些问题只有通过超级计算机解决。他在剑桥大学获得博士学位，并在学术界和工业界工作过。他还帮助年轻的
    AI 初创公司获得了关注。


    ## 致谢


    我们要感谢我们耐心等待的家人。将经验学习汇编成一本简单易懂的书需要花费如此长时间，令人惊讶。AI 的技术方面具有挑战性，因此众多的老师、讲师、主管、导师和教练多到无法逐一感谢。感谢你们，你们知道自己是谁，特别是那些将讲座和笔记发布在网上供大家学习的人士。


    曾在 Sellafield Sites Ltd 工作过的 Paul Mort 博士是 AI Essentials 和 AI Foundation 课程的热心爱好者和支持者。他在审核课程时提出的挑战性问题使我们思考得非常仔细，我们感谢他。Paul
    是一位机器人专家，我们深知 AI 是一个比机器学习丰富得多、更广泛的主题。


    BCS 在整合这本书和课程方面发挥了巨大作用。我们想不分先后地感谢 Ian Borthwick、Heather Wood、Tope Gay、Gillian
    Cullen 和 James Benefield。我们确定还有许多其他人参与了其中。谢谢。


    Wikipedia 也发挥了巨大作用；在可能的情况下，我们让获取信息和参考变得简单易行。感谢所有将作品发布在网上供大家学习的作者们。


    我们希望你在这书中发现有用的内容，而且最重要的是，在学习过程中保持怀疑、批判和严谨的态度，但我们更希望你能够从经验中学习。


    我们是人——我们会犯错，并乐意听到所有的反馈，无论好坏。这是科学方法和从经验中学习的一部分。通过 LinkedIn 联系我们：`www.linkedin.com/in/stevelawless`。


