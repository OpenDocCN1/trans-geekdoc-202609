- raw: "ISO/IEC stands for the International Organization for Standardization (ISO)\
    \ and the International Electrotechnical Commission (IEC). These two organisations\
    \ collaborate to develop and publish international standards in various fields,\
    \ including information technology and telecommunications. ISO focuses on a broad\
    \ range of industries and services, while IEC specialises in electrical, electronic\
    \ and related technologies. Together, they produce joint standards to ensure quality,\
    \ safety, efficiency and interoperability in technological and industrial sectors\
    \ globally.\n\nThe ISO/IEC standards are an international effort to make our AI\
    \ human-centric ethical purpose more explicit. These are explained in more detail\
    \ Section 2.2.3.\n\n2.1.2.4 Japan, USA, Canadian and UK AI bodies\n\nInternationally,\
    \ Japan has also adopted the human-centric approach to AI. It published the ‘Social\
    \ principles of human-centric AI’ (Cabinet Office, Government of Japan, 2022).\
    \ The National Institute of Standards (NIST) are active producing US guidelines\
    \ and standards (NIST, 2023). In addition, The White House has published the ‘Blueprint\
    \ for an AI bill of rights’ (The White House, 2022). Their neighbours, the Canadians,\
    \ are at the heart of the ISO/IEC’s standard 42001 (ISO/IEC, 2023a) and also published\
    \ on the responsible use of AI in government (Government of Canada, 2024). The\
    \ UK’s Alan Turing Institute has published an AI standards hub, a sensible starting\
    \ point for AI publications, standards and ethics (The Alan Turing Institute,\
    \ 2024).\n\n## 2.2 UNDERSTANDING THE RISKS AI BRINGS TO PROJECTS\n\nThe challenges\
    \ to the development and implementation of AI solutions can manifest themselves\
    \ in several ways, including:\n\nself-interest;\n\nself-review;\n\nconflict of\
