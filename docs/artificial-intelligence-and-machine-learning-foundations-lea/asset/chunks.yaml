- raw: 'Model training and optimisation: train models using relevant data sets and
    optimise them for better accuracy and performance.


    Deployment and maintenance: deploy ML models into production and maintain them
    over time.


    Collaboration: work closely with data scientists and software engineers to integrate
    models into applications.


    A data scientist will typically have the following role and responsibilities:


    Data analysis: extract insights from structured and unstructured data using statistical
    techniques.


    Model building: develop predictive models and ML algorithms.


    Visualisation: create visualisations to communicate findings to stakeholders.


    Experimentation: design and conduct experiments to test hypotheses and improve
    models.


    Business solutions: translate business problems into data science problems and
    provide actionable solutions.


    An AI research scientist will typically have the following role and responsibilities:


    Research: conduct advanced research in AI and ML to develop new algorithms and
    techniques.


    Publications: publish findings in academic journals and present at conferences.


    Prototyping: develop prototypes to test new AI concepts.


    Collaboration: work with academic and industry partners to push the boundaries
    of AI technology.


    Innovation: stay updated with the latest advancements in AI and apply them to
    solve complex problems.


    A computer vision engineer will typically have the following role and responsibilities:


    Image processing: develop algorithms for image and video analysis.


    Feature extraction: implement techniques for object detection, recognition and
    tracking.


    Model training: train deep learning models specifically for computer vision tasks.


    Optimisation: optimise models for performance on different hardware and platforms.


    Application development: integrate computer vision capabilities into real-world
    applications such as AR/VR, autonomous vehicles, etc.


    An NLP engineer will typically have the following role and responsibilities:


    Text analysis: develop algorithms for processing and analysing large amounts of
    natural language data.


    Language modelling: build and train models for tasks such as text generation,
    translation and summarisation.


    Speech recognition: implement systems for converting speech to text, and vice
    versa.


    Sentiment analysis: develop systems to understand and categorise the sentiments
    expressed in text.


    Integration: work on integrating NLP capabilities into applications such as chatbots,
    virtual assistants and search engines.


    A robotics engineer will typically have the following role and responsibilities:


    Design and development: design, build and test robotic systems and components.


    Programming: develop software and algorithms for robot control and automation.


    System integration: integrate sensors, actuators and other hardware with robotic
    systems.


    Testing and validation: conduct tests to ensure reliability and performance of
    robots.


    Research: stay updated with the latest in robotics technology and apply it to
    innovate and improve existing systems.


    An AI ethics specialist will typically have the following role and responsibilities:


    Ethical analysis: analyse the ethical implications of AI systems and their potential
    impact on society.


    Policy development: develop guidelines and policies to ensure ethical AI practices
    within the organisation.


    Compliance: ensure compliance with relevant laws, regulations and ethical standards.


    Training and education: educate employees and stakeholders on ethical AI practices
    and considerations.


    Advisory: provide advice on ethical dilemmas related to AI development and deployment.


    An AI anthropologist will typically have the following role and responsibilities:


    Human-centric research: study the interaction between humans and AI systems, focusing
    on cultural and social impacts.


    Ethnographic studies: conduct ethnographic research to understand how AI is integrated
    into various communities and cultures.


    User experience: analyse and improve user experience by understanding human behaviour
    and cultural contexts.


    Interdisciplinary collaboration: work with engineers, designers and ethicists
    to ensure AI systems are culturally sensitive and user-friendly.


    Impact assessment: assess the long-term societal impacts of AI technologies.


    ## 6.2 AI IN THE REAL WORLD


    AI tools and services are now part of the real world. First, we need to make sense
    of what this means in an organisation before looking at examples of AI. We need
    to consider a number of human–AI interactions:


    human in the loop (HITL);


    anthropology;


    ergonomics;


    human-centred AI (HCAI):


    ethical AI design;


    collaborative intelligence;


    transparency and explainability;


    inclusive design;


    modelling human behaviour in interactions with AI.


    ## 6.2.1 Human in the loop


    Keeping HITL refers to the integration of human oversight and decision-making
    into AI systems. It ensures that humans remain actively involved in critical stages
    of AI processes, such as decision-making, monitoring and intervention (see Table
    6.1).


    Table 6.1 Human in the loop importance and example


    | ^(Importance) || ^(Example) |


    | --- | --- |


    | ^(Accountability – ensures that there is human accountability for decisions
    made by AI systems, especially in high-stakes or ethical scenarios. Error correction
    – allows for human intervention to correct or override AI decisions that may be
    flawed or biased. Trust and acceptance – enhances trust in AI systems by providing
    transparency and allowing human judgement in complex situations.)  || ^(In healthcare,
    AI may assist in diagnosing diseases, but the final decision and treatment plan
    are reviewed and confirmed by a human doctor to ensure accuracy and consider nuanced
    patient factors.) |


    ## 6.2.2 Anthropology


    Anthropology in the context of AI refers to the study of human behaviour, cultures
    and social interactions to inform the design and implementation of AI systems.
    It focuses on understanding how humans interact with technology and how AI can
    be designed to fit into various cultural and social contexts (see Table 6.2).


    Table 6.2 Anthropology importance and example


    | ^(Importance) || ^(Example) |


    | --- | --- |


    | ^(User-centred design (UCD) – helps create AI systems that are more intuitive,
    culturally sensitive and user-friendly by understanding the diverse needs and
    behaviours of users. Social impact – assesses the broader social implications
    of AI deployment, ensuring that AI systems enhance rather than disrupt social
    structures and relationships. Ethical considerations – informs the ethical design
    of AI systems by considering cultural values and societal norms.)  || ^(In designing
    a chatbot for customer service, anthropologists might study how different cultures
    communicate and interact with technology to ensure the chatbot’s language and
    interaction style are appropriate and effective for a global audience.) |


    ## 6.2.3 Ergonomics


    Ergonomics, also known as human factors engineering, involves designing AI systems
    and interfaces that optimise human wellbeing and overall system performance. It
    focuses on creating environments and tools that fit human physical and cognitive
    abilities (see Table 6.3).


    Table 6.3 Ergonomics importance and example


    | ^(Importance) || ^(Example) |


    | --- | --- |


    | ^(Usability – ensures that AI systems are easy to use and reduce the cognitive
    load on users, enhancing productivity and reducing errors. Comfort and safety
    – designs AI interfaces and environments that are comfortable and safe for users,
    minimising physical strain and health risks. Efficiency – enhances efficiency
    by creating AI systems that users can interact with smoothly and intuitively.)  ||
    ^(In manufacturing, ergonomically designed AI interfaces for operating machinery
    can reduce the risk of repetitive strain injuries and make it easier for workers
    to interact with complex systems, thereby increasing efficiency and reducing errors.)
    |


    ## 6.2.4 Human-centred AI'
