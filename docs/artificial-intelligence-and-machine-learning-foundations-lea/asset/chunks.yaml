    \nML is focused on explicitly defining a problem that can be solved on a computer.\
    \ These problems can be complicated, non-linear and statistical. In simple terms,\
    \ if we are to use ML in our AI, we must be able to represent our problem mathematically\
    \ and in such a way that it can be solved by a machine. Today, we typically use\
    \ digital computers. However, quantum, analogue, optical and biological computers\
    \ are on their way.\n\nDigital ML has become very popular recently with the success\
    \ of convolutional deep NNs. These numerical techniques have given us an understanding\
    \ of how the human mind solves problems. So, when we think about ML, we can think\
    \ about an AI agent learning from data. These machines are now so good at playing\
    \ games that they can beat the world champions.\n\nThe AI agent is much more than\
    \ a narrowly focused digital computer program. ML works on data in the computer.\
    \ We must work really hard to think of this as an interface with actuators and\
    \ sensors in an environment. It is sensible to think, here, that ML learns from\
    \ data in a computational environment. This is a good starting point to opening\
    \ up the world of AI. AI is about humans and machines working together to achieve\
    \ goals. We might even go on to say that ML is an AI enabler setting the foundation\
    \ for a future of humans and machines.\n\n3.2.4.1 How we learn from data\n\nML\
    \ is widely available nowadays and it is an enabler for more involved AI as we\
    \ accelerate our applications and build intelligent entities. ML is built by defining\
    \ what functionality we need, writing software to implement that functionality\
    \ and then constructing the machines (typically digital machines) to obtain our\
    \ functionality. So, our intuitive and simple model is functionality, software\
    \ and hardware. AI is about learning from experience and, if we have lots of data,\
    \ what type of functionality is needed to learn from those data.\n\n3.2.4.2 Introductory\
    \ theory of machine learning"
