    schedules, set reminders, control smart home devices and even engage in casual
    conversation. Their ability to learn from user interactions and improve over time
    exemplifies ML capabilities. We must be aware that ML answers can be creative
    or even made up (generated best guess) and lack rigour and accuracy.


    ## 3.1.2 Recommendation systems


    AI-driven recommendation systems are behind the personalised suggestions we encounter
    on platforms such as Netflix, Amazon and Spotify. These systems analyse user behaviour,
    preferences and interactions to suggest movies, products and music that are likely
    to interest the user. By leveraging techniques such as collaborative filtering
    and content-based filtering, these AI models enhance user experience and engagement.
    These are typical examples of learning from data, and use ML.


    ## 3.1.3 Fraud detection


    In the financial sector, AI plays a crucial role in detecting fraudulent activities.
    Banks and financial institutions employ ML algorithms to analyse transaction patterns,
    identify anomalies and flag potentially fraudulent transactions. These systems
    are designed to adapt and improve continuously, making them increasingly effective
    at spotting and preventing fraud.


    ## 3.1.4 Healthcare


    AI is revolutionising healthcare through applications such as diagnostic tools,
    personalised treatment plans and predictive analytics. AI systems can analyse
    medical images to detect conditions such as cancer, interpret genetic information
    to suggest personalised treatments and predict patient outcomes based on historical
    data. Indeed, some scientific disciplines cannot practise without powerful computers.
    Here, scientists and engineers use machine learning daily, but they don’t necessarily
    call it AI or ML. Numerical techniques used by engineers and scientists tend to
    be more effective for their work; however, they have the transferable skills to
    use ML and AI in developing better work.


    ## 3.1.5 Customer service


    Many businesses are adopting AI-powered chatbots and virtual customer service
    agents to handle routine inquiries, provide support and enhance customer experience.
    These AI systems can process and respond to customer questions, resolve issues
    and even handle transactions. Their ability to operate 24/7 and learn from interactions
    helps businesses improve efficiency and customer satisfaction.


    ## 3.1.6 Language translation


    AI has significantly advanced language translation services, with tools such as
    Google Translate utilising neural machine translation (NMT) to provide more accurate
    and natural translations. These systems can translate text and speech in real
    time, breaking down language barriers and facilitating global communication.


    ## 3.1.7 Social media monitoring


    AI is extensively used in monitoring and managing content on social media platforms.
    Algorithms are designed to detect and filter out inappropriate content, spam and
    fake news. Additionally, AI helps in analysing user engagement, understanding
    trends and personalising content feeds to keep users engaged.


    ## 3.1.8 Smart home devices


    AI is embedded in various smart home devices, including thermostats, security
    systems and household appliances. These devices learn user preferences and behaviours
    to optimise home environments, enhance security and improve accessibility, independence
    and convenience.


    ## 3.1.9 Robotics


    In manufacturing and service industries, AI-driven robots are used for tasks such
    as assembly line work, quality control and even customer interaction. These robots
    employ ML to perform complex tasks, adapt to new situations and collaborate with
    human workers.


    These examples of AI’s presence are commonplace now, with applications that enhance
    accessibility, convenience, efficiency and personalisation across various domains.
    As AI technology continues to advance, its impact on society is likely to expand,
    leading to even more innovative and transformative applications. The AI agent
    allows us to relate to AI as a technology or service that helps humans.


    ## 3.1.10 Education


    AI is transforming education by enhancing both teaching and learning experiences
    through personalised learning, intelligent tutoring systems and administrative
    automation. Personalised learning platforms use AI to tailor educational content
    to individual student needs, learning styles and pace, thereby improving engagement
    and understanding. Intelligent tutoring systems, such as those developed by Carnegie
    Learning, provide real-time feedback and support, simulating one-on-one instruction.
    AI-powered tools facilitate the creation of immersive learning experiences through
    virtual and augmented reality, making education more interactive and accessible.
    By leveraging data and advanced algorithms, AI helps to create more efficient,
    inclusive and effective educational environments.


    ## 3.2 AI, MACHINE LEARNING AND ROBOTICS


    In this section, we explore AI in terms of agents and robotics. While doing so,
    we should remind ourselves of the definition of human intelligence discussed in
    Section 1.1.1.1, from the Encyclopaedia Britannica (Sternburg, 2017):


    Human intelligence: mental quality that consists of the abilities to learn from
    experience, adapt to new situations, understand and handle abstract concepts,
    and use knowledge to manipulate one’s environment.


    It is really helpful to use the AI agent as the schematic of the artificial human,
    and it has a simple analogy in that it is similar to a robot. Unfortunately, this
    simple analogy has not been used by roboticists. Their focus hasn’t been human
    intelligence or the framework for the academic study of intelligence; instead,
    they have been focused on the engineering of a robot, which is complex and sophisticated
    engineering. We are now seeing these disciplines collaborating and exciting new
    areas emerging. It’s an exciting time because advances in ML have unlocked the
    ability of computers to teach themselves how to achieve a goal, in either a digital
    simulated environment or a practical engineered environment. It opens up a world
    of opportunities: autonomous smart cities, smart roads, smart homes, smart TVs,
    smartphones, smart watches, smart nano-bots.


    We can think of AI products, big or small, as AI agents. They can have a perception
    of the environment they are in and then act on the environment to achieve a goal.
    ML gives us the digital examples of how this can be achieved. It can also be used
    to give the AI agent or products autonomy to learn from experience, for example
    how to undertake a task or tasks and achieve a goal. The functionality we require
    for intelligent agents links simply with ML. Games can be used to understand the
    interaction of autonomous agents.


    Agent-based modelling is a fundamental method useful in academia, engineering,
    business, medicine and elsewhere. Through this, we can understand the emergent
    behaviour of multiple agents operating in an environment.


    ## 3.2.1 The AI agent


    We start with the academic description of an AI agent from Russell and Norvig
    (2016). They define a rational agent as:


    For each possible percept sequence, a rational agent should select an action that
    is expected to maximize its performance measure, given the evidence provided by
    the percept sequence and whatever built in knowledge the agent has.


    This can be illustrated as a learning agent (see Figure 3.1). The AI agent is
    the schematic of how AI describes a human acting in an environment; the traditional
    engineering concept of a robot or control system is the dashed line. ML has certainly
    been used inside this dashed line for many years – we will introduce perceptrons
    in Chapter 4. With the advent of deep learning and its more recent successes,
    this dashed line is now moving to encapsulate the whole AI agent. Learning from
    experience now means the potential for autonomy. We humans sometimes call this
    ‘agency’.'
