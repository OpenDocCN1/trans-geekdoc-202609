    ## 4.1.2 Data quality


    In this section, we start with the ever so familiar phrase about data:


    Garbage in, garbage out.


    With AI, and in particular `ML`, we need to perhaps change this to:


    Good quality data in, garbage out.


    We’ll see later in the chapter that, although we might give our `ML` system good
    quality data to learn from, incorrectly used it can generate garbage. We should
    remind ourselves of the scientific method and be sceptical of our work and remember
    that it must be reproducible. This is particularly important for generative AI
    that is incredibly popular at the moment. This book is not a data management book
    and in a real-world project we must be very careful how we work with data. It
    is vital we are ethical and obey the law.


    ### 4.1.2.1 Data quality metrics


    Five key data quality metrics are essential for ensuring the reliability and usability
    of data within an organisation: accuracy, completeness, consistency, timeliness
    and uniqueness.


    Accuracy measures how closely data values match the true values they represent,
    ensuring the data are correct and free from errors.


    Completeness assesses whether all required data are present, indicating that no
    critical information is missing.


    Consistency checks if data are uniform and standardised across different data
    sets and systems, reducing discrepancies and ensuring coherence.


    Timeliness evaluates the currency and relevance of data, ensuring they are up
    to date and available when needed.


    Uniqueness ensures that each data entry is distinct and not duplicated, maintaining
    the integrity and trustworthiness of the data set.


    Together, these metrics provide a comprehensive framework for monitoring and maintaining
    high data quality, which is crucial for informed decision-making and operational
    efficiency.


    ### 4.1.2.2 Poor-quality data and its consequences


    Poor-quality data can severely impact `ML` models, leading to a cascade of negative
    consequences. Inaccurate data introduce errors that can cause models to learn
    incorrect patterns, resulting in poor predictive performance and unreliable outputs.
    Incomplete data can skew the training process, leaving the model with insufficient
    information to generalise well to new, unseen data. Inconsistent data lead to
    difficulties in model training, as the algorithm struggles to reconcile conflicting
    information. Delayed or outdated data can make models irrelevant or inaccurate
    over time, especially in dynamic environments where timely insights are crucial.
    Additionally, duplicate data can inflate the significance of certain patterns,
    biasing the model. Overall, poor data quality undermines the integrity, accuracy
    and reliability of `ML` models, leading to misguided decisions, reduced efficiency
    and potential financial losses for organisations relying on these models for critical
    tasks.


    ## 4.2 DATA MANAGEMENT AND UTILISATION


    Throughout the data lifecycle, there are various challenges and risks to consider,
    from how data are legally gathered and stored to ensuring they are processed in
    line with their intended use and are free from bias or misinformation. Figure
    4.5 shows some of the typical legislation and regulation we must abide to when
    working with data.


    Figure 4.5 Legislation and regulation


    ![image-VHCF8VF5.jpg](images/image-VHCF8VF5.jpeg)


    Practical steps for compliance include:


    - Conduct regular audits: regularly review data-processing activities to ensure
    compliance with `UK GDPR` and `DPA 2018`.

    - Implement strong data governance: establish clear policies and procedures for
    data management.

    - Conduct training and awareness: train employees on data protection principles
    and the importance of compliance.


    By adhering to these principles and regulations, organisations can ensure that
    their AI applications are compliant with the `UK GDPR` and `DPA 2018`, thereby
    protecting individuals’ data rights and maintaining ethical standards. When using
    `AI` and `ML`, use the scientific method to systematically identify, analyse and
    mitigate data issues, leading to more robust, fair and accurate AI systems.


    ### 4.2.1 Risks in data handling


    Using data in `AI` and `ML` poses numerous challenges and risks that can undermine
    the effectiveness of models and lead to unintended consequences. One primary challenge
    is ensuring data quality, as poor data can introduce biases, inaccuracies and
    inconsistencies that skew model outputs. Managing and processing large data sets
    also require significant computational resources and expertise, complicating the
    development and deployment of models. Additionally, the risk of over-fitting arises
    when models learn noise or irrelevant patterns in the training data, resulting
    in poor generalisation to new data.


    Privacy and security concerns are paramount, as using sensitive or personally
    identifiable information necessitates stringent measures to prevent data breaches
    and misuse. Ethical considerations, such as avoiding discrimination and ensuring
    fairness, further complicate the use of data, especially when historical biases
    are embedded within data sets. Finally, regulatory compliance with laws such as
    `GDPR` adds another layer of complexity, requiring organisations to navigate legal
    frameworks while leveraging data for `ML`. These challenges and risks highlight
    the need for robust data management practices, ethical guidelines and continual
    monitoring to ensure the responsible and effective use of data in `ML`.


    ### 4.2.2 Preparing data for a machine learning project


    Preparing data is an important aspect of all work with computers, not just `AI`
    or `ML`. In `AI`, learning from experience is paramount, and in `ML` we focus
    on learning from data. There is no guaranteed, surefire way to ensure your data
    preparation is right first time. You have to learn from experience and improve
    your data preparation with each iteration. So, when do we stop? That is something
    determined by the domain expert – this person sets the standard for what is fit
    for purpose. An Agile project style lends itself to this very well.


    Data preparation is affected by numerous factors and is a science in its own right;
    it therefore needs experience to undertake. This experience could be learned during
    the project, or you could employ someone already experienced to do this for you.


    The Further Reading list at the end of this book has numerous `ML` examples that
    will give you a flavour of the data preparation needed.


    We should keep in the back of our minds that if we are working with large data
    sets, we have the added complexity of obtaining the data, storing them, organising
    them, keeping the data safe and obeying any laws associated with them – a time-consuming
    task in itself. Aurélien Géron’s eight stages of a machine project is a good place
    to start (Géron, 2017). These are:


    1. Frame the problem.

    2. Get the data.

    3. Explore the data.

    4. Prepare the data to better expose the underlying data patterns to `ML` algorithms.

    5. Explore many different models (or algorithms) and shortlist the best ones for
    the project.

    6. Fine-tune your models and combine them into a great solution.

    7. Present your solution.

    8. Launch, monitor and maintain your system.

