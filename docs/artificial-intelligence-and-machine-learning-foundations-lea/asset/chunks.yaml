  trans: '


    再次，我们立即注意到，这八个阶段涉及大量的经验学习。它们并不是顺序执行的，我们可能会重新访问或循环第 1–5 阶段、1–7 阶段或 1–8 阶段——一次性完成
    1 到 8 阶段是例外而非常态。我们可能会使用较小的数据组，这样我们可以学得更快，因为我们不需要处理大量数据。这在评估多个算法时很有帮助，因为这涉及到更多工作。在早期阶段对较小的子集进行工作可以获得一些学习。这简单地缩短了迭代之间的时间。


    如果我们拥有大型数据集，就需要将数据分为训练数据和测试数据。这对于权衡至关重要，我们希望在复杂性和误差之间进行权衡；这在第 4.2.3.9 节中有更详细的介绍。然后我们可以将训练数据分成不同大小的数据桶（bins），并使用这些不同大小的桶来测试我们的算法。随着方法的完善，我们随后可以使用测试数据来查看我们的学习对于
    `AI` 或 `ML` 系统以前未见过的数据是否有效。


    测试数据不能用于训练你的 `AI` 或 `ML` 系统。这样做的原因之一是算法会在训练期间使用测试数据，因此我们已经知道算法处理这些数据的效果如何。这在本质上是浪费时间，因为我们没有向系统添加更多信息。独立的测试数据为我们所完成的
    `ML` 提供了独立的测试。


    一旦我们有了数据并将其划分为合适的桶，就可以开始清洗或刷洗数据。这意味着我们以一种方式准备数据，使我们的算法获得成功的最佳机会。


    在 `AI` 中，我们可能会遇到许多数据类型，例如数字、字符串和 `Booleans`，或者它们可能是更复杂的数据，例如音频文件、电影文件、脚本、文本、文档，可能还有来自执行器、传感器的信号——我们甚至可能仿真中生成自己的数据。`Digital
    twin` 是一项在过去 20 年左右获得了发展动力的激动进展。数据将以多种形式、各种数量向我们到来。


    在 `AI` 中，我们需要处理模拟数据。在这里，我们通常会采用模拟数字转换器，以便将模拟信号表示为系列数字计算机可以理解的离散数字。


    数据准备的一部分是数据清洗或数据刷洗。在我们进行 `ML` 项目的各个阶段时，必须始终意识到数据准备的质量。糟糕的数据准备将导致虚假的 `ML` 结果，或歪曲我们试图分析的数据。


    刷洗可以包括：


    - 减少我们正在处理的数据量，可能删除无关数据；

    - 重新格式数据；

    - 删除不完整或重复的数据；

    - 处理缺失数据；

    - 生成数据；

    - 缩放数据以便算法运行良好。


    有很多用于数据准备的工具和技术以及标准库帮助我们，我们需要经验来做好这一点。


    数据准备虽然重要，数据可视化同样重要。数据可视化（见第 4.1.1.5 节）也会影响你准备数据的方式。在我们尝试对跨越大型超级计算机上多个处理器的的数据集进行可视化之前，这通常会被忽视。


    ## 4.2.3 从数据中学习的算法


    算法是解决问题、工程和计算机科学的核心。在 `AI` 中，我们感兴趣它们如何帮助我们从经验中学习；它们如何帮助我们创建出能够学习和改进的智能实体、产品和服务。算法在学术上被研究，这可能导致对复杂且丰富研究的终身追求。算法也是我们用来教自己如何编写数字计算机程序的简单程序（从简单的流程图到复杂的事件驱动面向对象软件）。狭义
    `AI`，特别是狭义 `ML`，给了我们一个理解算法如何从数据中学习的机会。`NN` 及其许多变体教会自己如何解决问题。这是一种学习其自身算法的算法，例如用于下棋。


    我们应该注意，`AI` 或 `ML` 算法并不总是解决我们问题的最佳选择。科学家、数学家和工程师通常会有更优雅、更高效的方法来解决问题。然而，我们并不总是具备这种能力，在这里
    `ML` 和 `AI` 可以帮助我们，特别是当我们有大量数据可以处理时（例如，来自望远镜、仿真、传感器等的数据）。此外，算法可以用多种方式表示，如计算机代码、流程图、数学符号、伪代码等。对于那些想要深入研究算法的人，Tom
    Mitchell 的书《`Machine Learning (2018)`》为对许多算法及其实际用途提供了极佳的介绍，包括我们在下面描述的算法及其推导。


    `AI` 和 `ML` 在其根本上基于科学方法，我们必须谨慎地使用这些技术。我们的学习问题是非线性的、迭代的，并且在本质上可能是统计性的。我们必须谨慎地使用算法，因为它们通常是问题的通用方法——领域特定技术可能更适合我们的问题。我们使用
    `ML` 和 `AI` 的方法之一是建立对算法能实现什么的学习和经验。


    `ML` 和 `AI` 汲用了成熟学术学科的技术，如运筹学、控制理论、数学、数值分析和工程。例如，决策树经常与 `ML` 相关，但几十年来它们一直是安全工程和管理理论的核心。


    在本章中，我们的目的是介绍什么是算法以及为什么算法对 `ML` 和 `AI` 如此重要。算法在准确性、性能和处理时间方面都有优缺点。本章还包括 `ML` 中一些常用算法的解释和示例。我们将解释它们的用途以及在选择时面临的挑战。


    ### 4.2.3.1 什么是算法？


    算法的定义是在计算或其他解决问题的操作中（特别是由计算机执行）遵循的过程或规则。简单来说，算法是为了执行特定任务而设计的指令集。这可以简单如我们两个数字相乘的过程，这是我们在小时候就学到的并认为理所当然的。人类使用十进制进行操作，而计算机使用二进制。只有当你必须解释自己在做什么时，它看起来才很复杂——我们需要明确，因为我们的数字计算机需要明确的指令。算法可以是复杂得多的，例如压缩计算机文件或播放压缩视频文件。


    我们之前涵盖了学习类型和数据类型，但在进一步探讨算法主题之前，有必要再次解决这些基本概念。


    在监督学习模型中，算法在标记数据集上进行学习，这提供了一个答案密钥，算法可以使用它来评估在训练数据上的准确性。在无监督模型中，它使用提供的无标记数据，算法通过自行提取特征和模式来理解数据。在半监督学习和强化学习模型中，数据可以是有标签的也可以无标记的。


    '
