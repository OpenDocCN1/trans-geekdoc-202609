    to adoption and exploitation of this technology; it requires good governance as
    well as aligned assurance regimes.


    ### 5.1.2 Augmenting machines


    The key areas where humans augment machines are in making `AI` and `IA` more understandable
    and acceptable to people in general.


    At a simple level, machines can increase our learning and make it more effective.
    We humans have to orchestrate that learning and provide support when the machine
    hits a contradiction or fails. We also need to ensure that machines are doing
    the right things. Remember, we need human-centric ethical purpose to our `AI`
    systems. Machines don’t have consciousness or emotion, which makes empathy a big
    problem. Humans will need to set the goals not just about where we are going but
    also how we are going to get there. An example where human oversight is required
    is the consequences of introducing machines that in some way cause stress to a
    workforce. This is subjective and humans can understand and possibly correct for
    this. A human may be able to explain why an `AI` system has come to a conclusion
    or diagnosis in way that is useful to another human.


    ## 5.1.3 Structure of a business case


    In this section we’ll look at the structure of a business case for `AI`. A business
    case is a formal document or presentation that outlines the justification for
    investment or a project. It is designed to help decision-makers assess the potential
    benefits, costs and risks associated with the initiative. The process of writing
    and producing a business case means the team starts learning from experience with
    informed decision-making. A well-constructed business case typically includes
    several vital elements: an executive summary that provides a concise overview
    of the proposal; a clear statement of the problem or opportunity that the project
    addresses; a detailed analysis of the proposed solution, including objectives,
    scope and deliverables; a thorough financial analysis that presents cost estimates,
    funding requirements and expected return on investment (`ROI`); an assessment
    of risks and mitigation strategies; and an implementation plan that outlines the
    timeline, milestones and responsibilities. Additionally, it should include an
    evaluation of alternatives considered and the rationale for the recommended approach.
    By incorporating these elements, a business case ensures a comprehensive evaluation
    of the project’s feasibility and strategic alignment with organisational goals.


    ### 5.1.3.1 AI or ML business cases


    Creating a business case for an `AI` or `ML` project involves several unique considerations
    compared to a traditional business case. The considerations highlighted next show
    the unique aspects of `AI/ML` projects that need to be addressed in a business
    case to ensure clarity, manage expectations and provide a clear path to achieving
    the desired outcomes. An example of the traditional format of a business case
    is:


    ```

    introduction;

    management or executive summary;

    description of current state;

    options considered;

    option described:

    analysis of costs and benefits;

    impact assessment;

    risk assessment;

    recommendations;

    appendices/supporting information.

    ```


    With traditional projects, the technical feasibility is more straightforward,
    focusing on standard software or hardware implementations without the need for
    extensive data science or model training. Note this is weighted towards a `ML`
    project. However, the hardware is vital because it includes sensors and actuators.
    `AI` and `ML` projects require a detailed assessment of technical feasibility,
    including data availability and quality, the complexity of algorithms, model training
    and deployment challenges. You need to consider the infrastructure requirements
    and the integration of `AI/ML` models with existing systems. Remember our ethical
    needs embraced by a human-centric ethical purpose.


    If we extend our `ML` project to include complex human and agent interactions
    with an environment, our project takes on a new dimension. Being more specific,
    the compute power (number of calculations) and memory (data storage) can take
    decades to plan and build; for example, weather modelling.


    In projects over the last few decades we have seen that the technical feasibility
    is more straightforward, focusing on standard software or hardware implementations
    without the need for extensive data science or model training. If we embrace learning
    from experience or learning from data, then these projects require a detailed
    assessment of feasibility, including data availability and quality, the complexity
    of algorithms, model training and deployment challenges. We need to consider the
    infrastructure requirements and the integration of `AI/ML` models with existing
    systems. `AI` and `ML` algorithms have been developed by the scientific method,
    so data need to be well prepared for the algorithms. The success of `AI/ML` projects
    heavily depends on the data used for training models, and also the test data used
    to verify and validate the training of the models.


    We are used to risks being more predictable and manageable, related to project
    scope, budget and timeline, whereas we are now moving into projects that carry
    higher risks and uncertainties due to factors such as model accuracy, over-fitting,
    biases in data and the need for continuous model maintenance and updates. The
    business case must address these risks and propose mitigation strategies. For
    example, an autonomous car is safe and reliable on the well-engineered motorway,
    but struggles with the nuances of country roads. This is the key business case
    for ML operations (`MLOps`)/`AI` to IT operations (`AIOps`) or model operations
    (`ModelOps`) approaches; it provides key mechanism across the lifecycle to apply
    the necessary processes to mitigate risk as well as have the best change of intended
    outcomes.

