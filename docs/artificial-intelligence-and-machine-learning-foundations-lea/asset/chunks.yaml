    \ (RPA) is a term used to describe agents that work with data in an enterprise\
    \ setting. RPA isn’t usually an intelligent agent, even though the rules it follows\
    \ are complex.\n\n3.2.3.6 Intelligent robotics to intelligent agents\n\nThe advent\
