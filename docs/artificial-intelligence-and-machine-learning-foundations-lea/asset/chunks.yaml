    这些 AI 系统利用自然语言处理（NLP）来理解并响应用户查询、管理日程、设置提醒、控制智能家居设备，甚至进行闲聊。它们从用户交互中学习并随时间改进的能力体现了机器学习（ML）的特性。我们必须意识到，ML
    给出的答案可能是创造性的，甚至是虚构的（生成的最佳猜测），并且缺乏严谨性和准确性。


    ## 3.1.2 推荐系统


    AI 驱动的推荐系统是我们在 Netflix、Amazon 和 Spotify 等平台上遇到的个性化建议背后的核心。这些系统通过分析用户行为、偏好和交互，推荐用户可能感兴趣的电影、产品和音乐。通过利用协同过滤和内容过滤等技术，这些
    AI 模型增强了用户体验和参与度。这些都是从数据中学习的典型示例，并使用了机器学习。


    ## 3.1.3 欺诈检测


    在金融领域，AI 在检测欺诈活动起着着关重要的作用。银行和金融机构采用 ML 算法分析交易模式、识别异常并标记潜在的欺诈交易。这些系统设计用于不断适应和改进，使其在发现和防止欺诈方面变得越来越有效。


    ## 3.1.4 医疗保健


    AI 正在通过诊断工具、个性化治疗方案和预测分析等应用彻底医疗保健。AI 系统可以分析医学图像以检测癌症等疾病，解释遗传信息以建议个性化治疗，并根据历史数据预测患者结果。事实上，某些科学学科如果没有强大的计算机就无法进行。在这里，科学家和工程师每天都在使用机器学习，但他们并不一定称为
    AI 或 ML。工程师和科学家使用的数值技术对他们的工作往往更有效；然而，他们拥有可迁移的技能，可以使用 ML 和 AI 来开发更好的工作。


    ## 3.1.5 客户服务


    许多企业正在采用 AI 驱动的聊天机器人和虚拟客服代理来处理常规查询、提供支持并增强客户体验。这些 AI 系统可以处理并响应客户问题、解决问题甚至处理交易。它们
    24/7 运行并从交互中学习的能力有助于企业提高效率和客户满意度。


    ## 3.1.6 语言翻译


    AI 显著推进了语言翻译服务，例如 Google Translate 等工具利用神经机器翻译（NMT）提供更准确、更自然的翻译。这些系统可以实时翻译文本和语音，打破语言障碍并促进全球交流。


    ## 3.1.7 社交媒体监控


    AI 广泛用于监控和管理社交媒体平台上的内容。算法旨在检测并过滤不当内容、垃圾信息和假新闻。此外，AI 帮助分析用户参与度、理解趋势并个性化内容推送以保持用户活跃度。


    ## 3.1.8 智能家居设备


    AI 嵌入在各种智能家居设备中，包括恒温器、安全系统和家用。这些设备学习用户的偏好和行为以优化家庭环境，增强安全性并提高可用性、独立性和便利性。


    ## 3.1.9 机器人


    在制造业和服务业中，AI 驱动的机器人被用于流水线工作、质量控制甚至客户互动等任务。这些机器人采用 ML 执行复杂任务，适应新情况并与人类协作。


    这些 AI 存在的例子现在已随处可见，其应用增强了各个领域的可访问性、便利性、效率和个性化。随着 AI 技术的不断进步，它对社会的影响可能会扩大，导致更多创新和变革性的应用。AI
    代理允许我们将 AI 视为一种帮助人类的技术或服务。


    ## 3.1.10 教育


    AI 正在通过个性化学习、智能辅导系统和行政自动化增强教学和学习体验来改变教育。个性化学习平台利用 AI 根据学生的个人需求、学习风格和节奏来定制教育内容，从而提高参与度和理解力。智能辅导系统（例如
    Carnegie Learning 开发的系统）提供实时反馈和支持，模拟一对一的教学。AI 驱动的工具通过虚拟和增强现实创造了沉浸式学习体验，使教育更具互动性和更易获取。通过利用数据和高级算法，AI
    帮助创建更高效、更包容且有效的教育环境。


    ## 3.2 AI、机器学习与机器人技术


    在本节中，我们从代理和机器人的角度探索 AI。在此过程中，我们应该提醒自己《大英百科全书》第 1.1.1.1 节讨论的人类智能定义（Sternburg, 2017）：


    人类智能：一种心理品质，由从经验中学习、适应新情况、理解和处理抽象概念以及使用知识操纵周围环境的能力组成。


    将 AI 代理作为人工人的蓝图是非常有用的，而且它有一个简单的类比，即类似于机器人。遗憾的是，机器人学家并没有使用这种简单的类比。他们的关注点不是人类智能或智能的学术研究框架；相反，他们专注于机器人的工程，这是一项复杂且精密的工程。我们现在正看到这些学科的协作，以及许多新领域的兴起。这是一个令人兴奋的时代，因为
    ML 的进步解锁了计算机在数字模拟环境或实际工程环境中自我学习如何实现目标的能力。它开启了一个机会世界：自主智能城市、智能道路、智能家居、智能电视、智能手机、智能手表、智能纳米机器人。


    我们可以将无论大小的 AI 产品视为 AI 代理（agents）。它们可以对所处的环境产生感知，然后对环境采取行动以实现目标。ML 为我们提供了如何实现这一点的数字示例。它也可以用于赋予
    AI 代理或产品从经验中学习的自主性，例如如何执行一项或多项任务并实现目标。我们智能代理所需的功能与 ML 直接相连。游戏可以用于理解自主代理的交互。


    基于代理的建模是学术界、工程、商业、医学等领域有用的基础方法。通过这种方法，我们可以理解在环境中运行的多个代理的涌现行为。


    ## 3.2.1 AI 代理


    我们从 Russell 和 Norvig (2016) 对 AI 代理的学术描述开始。他们将理性代理（rational agent）定义为：


    对于每个可能的感知序列，理性代理应该根据感知序列提供的证据以及代理拥有的任何内置知识，选择一个预期能够使其性能度量最大化的动作。


    这可以被说明为一个学习代理（见图 3.1）。AI 代理是 AI 如何描述人类在环境中行动的蓝图；机器人或控制系统的传统工程概念是虚线部分。多年来，这部分虚线内部一直在使用
    ML——我们将在第 4 章介绍感知器。随着深度学习的出现及其最近的成功，这条虚线现在正移动到包围整个 AI 代理。从经验中学习现在意味着自主性的潜力。我们人类有时将此称为“代理性”（agency）。


    '
