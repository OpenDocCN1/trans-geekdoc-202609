    In 2002 `iRobot` released `Roomba`, which autonomously vacuums a floor while navigating
    and avoiding obstacles. It sold a million units by 2004, and over 8 million units
    by 2020. `iRobot` then went on to create a range of other commercial, environmental,
    military and medical robots. Today, you’ll see garden lawns maintained by AI lawn
    mowers, feeders and sprinklers.


    In 2004 the Defense Advanced Research Projects Agency (`DARPA`), a prominent research
    organisation of the United States Department of Defense, introduced the `DARPA
    Grand Challenge`, offering prize money for competitors to produce vehicles capable
    of travelling autonomously over 150 miles. Then, in 2007, `DARPA` launched the
    `Urban Challenge` for autonomous cars to obey traffic rules and operate in an
    urban environment, covering 60 miles within six hours.


    Google entered the self-driving autonomous market in 2009 and built its first
    autonomous car, which sparked a commercial battle between `Tesla`, `General Motors`,
    `Volkswagen` and `Ford`, to name a few entrants into the same market.


    From 2011 to 2014 a series of smartphone apps were released that use natural language
    to answer questions, make recommendations and perform actions: Apple’s `Siri`
    (2011), Google’s `Google Now` (2012) and Microsoft’s `Cortana` (2014).


    `SCHAFT Inc` of Japan, a subsidiary of Google, built robot `HRP-2`, which defeated
    15 teams to win `DARPA’s Robotics Challenge Trial` in 2013. The `HRP-2` robot
    scored 27 out of 32 points over eight tasks needed in disaster response. The tasks
    were to drive a vehicle, walk over debris, climb a ladder, remove debris, walk
    through doors, cut through a wall, close valves and connect a hose.


    In 2015 an open letter petitioning for the ban in development and use of autonomous
    weapons was signed by leading figures such as Stephen Hawking, Elon Musk, Steve
    Wozniak and over 3,000 researchers in AI and robotics.


    In 2016 Google’s `DeepMind AlphaGo` supercomputer beat Lee Se-dol, a world Go
    champion, at a five-game match of Go (a strategic board game that originated in
    China more than 2,500 years ago and considered one of the most complex strategy
    games in the world). It took just 30 hours of unsupervised learning for the supercomputer
    to teach itself to play Go. Lee Se-dol was a ninth dan professional Korean Go
    champion who won 27 major tournaments from 2002 to 2016. He announced his retirement
    from the game in 2019, declaring that AI has created an opponent that ‘cannot
    be defeated’ (Vincent, 2019). In 2017 `AlphaGo Zero`, an improved version of `AlphaGo`,
    beat the world’s best chess-playing computer program, `StockFish 8`, winning 28
    of the 100 games and drawing 72 of them. What is astonishing is that `AlphaGo
    Zero` taught itself how to play chess in under four hours.


    Also in 2017, the `Asilomar Conference on Beneficial AI` was held near Monterey,
    California (Wikipedia Contributors, 2024j). Thought leaders in economics, law,
    ethics and philosophy spent five days in discussions dedicated to beneficial AI.
    It discussed AI ethics and how to bring about beneficial AI while at the same
    time avoiding the existential risk from AGI.


    Figure 1.1 shows a simple schematic of how AI and ML have evolved. Here, in 2024,
    we see the emergence of foundation models giving AI its toolkit to build applications
    and products that harness models of vast amounts of data. All the major tech companies
    are producing foundation models for professionals to harness. AI users now have
    generative AI at their fingertips. Foundation models are a general description
    of multipurpose transformer models. Rothman uses the foundation models term to
    emphasise the vast array available to us and describes them as a paradigm shift
    (Rothman, 2024). To put this into real terms, the obvious example is OpenAI’s
    `ChatGPT`.


    Figure 1.1 Where AI sits


    ![image-B7UWMX8F.jpg](images/image-B7UWMX8F.jpeg)


    ## 1.1.3 Types of AI


    In this section we look at the broader descriptions of this universal subject
    AI. We may come across several types based on functionality, capability and application.
    We can think of AI types as versions on a theme or a means to end.


    - **Functionality types** include reactive machines, limited memory, theory of
    mind and self-aware AI.

    - **Capability types** include narrow AI (or weak AI), general AI (or strong AI)
    and super-intelligent AI.

    - **Application types** include expert systems, NLP, computer vision, robotics
    and recommendation systems.


    This list is not exhaustive because the pace of development is opening up new
    creative and exciting directions at a highly motivating and ever increasing speed.
    Today, we have access to narrow AI that is focused on a well-defined or engineered
    specific task.


    ## 1.1.4 The industrial revolutions


    We are currently in the middle of the fourth industrial revolution, and some would
    argue that we have already reached the fifth, although that has yet to be defined.
    In each industrial revolution, mankind has designed and developed technologies
    that have made a paradigm shift in human capabilities and exploited those technologies
    to drive through progress, although some would argue that not all of mankind benefited
    as a result of these advancements.


    The first industrial revolution occurred during the 18th and 19th centuries, primarily
    in Europe and the United States. It mainly grew between 1760 and 1840 (although
    the exact dates are open to debate) and resulted in the transition from hand production
    methods to machine production – initially led by the development of the steam
    engine powering large textile factories. It was a major turning point in history,
    led to worldwide trading and rapid population growth and resulted in large swaths
    of rural societies becoming urbanised and industrial.


    The second industrial revolution occurred between 1870 and 1914, primarily across
    Europe, the United States and Japan. Sometimes known as the Technological Revolution,
    again it was a paradigm shift for mankind with the introduction of mass production
    and assembly lines. Increased use of electricity allowed for advancements in manufacturing
    and production, and resulted in technological advances such as the internal combustion
    engine, the telephone and the light bulb.


    The third industrial revolution started in the 1950s and is often known as the
    Digital Revolution. It brought us space exploration, biotechnology, semiconductors,
    mainframe computing and information and communications technology (ICT), and embedded
    technology into society with personal computers, the internet and automated production
    of goods.


    There is a bit of a blur between the third and fourth industrial revolutions.
    We believe that we are in the fourth today. The fourth exploits the gains made
    in the digital revolution and is disruptive, driven by AI, robotics, Internet
    of Things (IoT), three-dimensional (3D) plastic printing, nanotechnology, bioengineering
    and so on.


    I know what you’re thinking: ‘What happened between the industrial revolutions?’
    We didn’t stop inventing or improving between the revolutions, and different parts
    of the globe experienced them at different times at different speeds, but these
    particular periods were paradigm shifts in thinking and invention.


    The Diffusion of Innovation theory, developed by E.M. Rogers in 1962, explains
    how, over time, an idea or product gains momentum and spreads (diffuses) through
    a specific population, and he classifies adopters of innovations into five adopter
    categories: innovators, early adopters, early majority, late majority and laggards.
    This is based on the idea that certain individuals are inevitably more open to
    adoption and adaption than others. The adoption of AI technologies globally will
    be faster than the adoption of other technologies because we have seen a reduction
    in the time an industrial revolution lasts, from centuries to decades and now
    fractions of a decade, but we will still be led by innovators and there will still
    be laggards and even Luddites.

