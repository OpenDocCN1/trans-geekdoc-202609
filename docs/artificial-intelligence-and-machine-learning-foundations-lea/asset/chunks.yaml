    Agency comes from late middle English (someone or something that produces an effect),
    founded on the Latin word `agere`, ‘to do/act’.


    ### Figure 3.1 The learning agent – based on the structure of agents in Russell
    and Norvig (2016)


    ![image-URVTQEGA.jpg](images/image-URVTQEGA.jpeg)


    The ‘learning agent’ is an overarching schematic of an AI agent that can learn
    how to do something. This specialised agent is capable of learning from its experiences,
    unlike the four intelligent agents detailed above that act on information provided.
    Typically, it starts with some basic knowledge and adapts through learning. A
    learning agent is able to:


    - perform tasks;

    - analyse its own performance;

    - look for new ways to improve on those tasks.


    Moreover, it can do this all on its own.


    An example of a learning agent is a personal assistant such as `Siri` or `Alexa`,
    which can look up your local weather conditions on the internet and advise you
    whether to wear a coat or not because it has learned that you like to go for a
    walk when you haven’t slept well.


    Humans revere agency, and humans are agents that act in an environment (Coole,
    2017). Humans want the free will to act – it is important to us. For a robot to
    have free will to act, we call this autonomy. Autonomous robots are usually portrayed
    as baddies in movies because we try to wrap meaning around a robot’s actions.
    Robots, at least for now, are objective and rational and do what we tell them
    to do (sometimes this may have bad consequences). Humans are subjective, our free
    will is subjective and when we think about agency we must consider the subjective
    side of our actions – this leads to the philosophical and moral understanding
    of humans. In defining an AI agent, we rely on the agent being rational, in the
    same way that engineers use objective science to design robots.


    #### 3.2.1.1 The four rational agent dependencies


    We expect AI agents to be rational, and this depends on four things (Russell and
    Norvig, 2016):


    1. The performance measure that defines the criterion of success.

    2. The agent’s prior knowledge of the environment.

    3. The actions that the agent can perform.

    4. The agent’s percept sequence to date.


    These four elements are required to provide a fundamental academic basis for a
    rational agent. If we think about it, we need all four so that others can reproduce
    our results. Without them the agent would be ill-defined.


    We know that AI is an academic subject based on the scientific method. Rationality
    helps when we are thinking about AI agents. So, in designing an AI agent – maybe
    a robot or a data robot or a simulated agent looking at how humans behave – we
    expect them to act rationally and do what we ask them to do. Going back to Russell
    and Norvig’s definition of the rational agent (2016):


    For each possible percept sequence, a rational agent should select an action that
    is expected to maximize its performance measure, given the evidence provided by
    the percept sequence and whatever built in knowledge the agent has.


    We can see that when we design an AI system, a robot or an engineered product,
    it is telling us that it must perform as we design it to perform.


    #### 3.2.1.2 Agents – performance measure, environment, actuators and sensors


    If we are an engineer asked to design an intelligent entity, then it makes a lot
    of sense to define a performance measure by which its performance can be measured,
    define the environment in which it operates and the actuators and sensors it uses
    to manipulate its environment. By doing so, we create an intelligent entity that
    can learn from its experience. If we take a humanoid robot builder as an example,
    then we could describe each as the following:


    - Performance measure is the speed to lay a fixed number of bricks in a wall.

    - Environment is the building area or room.

    - Sensors are tactile sensors, power sensors, visual and sound sensors and so
    on.

    - Actuators are hands, body, feet, legs and so on.


    This is a factored state.


    Somehow, this seems easy, but it is not explicit mathematically. We could think
    about building a digital twin so we can model it and learn. By this we mean we
    can build a simulation environment for the robot to learn from, a bit like a computer
    game. Just as we teach pilots how to fly in a flight simulator, we can teach a
    robot in the same way. Or, perhaps, we can let the robot use reinforcement learning
    to teach itself. For a more detailed understanding of these concepts mathematically,
    see Russell and Norvig (2016).


    An agent might want its own map of the environment. We call this the state of
    the world of the agent. It is the agent’s internal world that it might use to
    make up for a lack of information. This world can be simple, for example a length
    of railway track and the temperature of the track might be all we need to control
    our autonomous train. This is the atomic state. It might be a little more involved
    where we use a range of sensors to determine the state of the world or environment
    in which we are operating – for example, rain, temperature, wind and humidity
    determine the weather that our train is travelling in. This is a factored state.
    Finally, we have the most complete understanding: the structured state. Here,
    the objects and the relationship of those objects give the agent a more detailed
    understanding of the environment it is operating in. It might use AI to predict
    the outcome of different actions; this is shown schematically in Figure 3.2.


    In understanding the agent, we need to understand the mathematics of its internal
    world, and so the use of a digital twin seems a sensible idea if we need to train
    an intelligent entity. What happens if we need multiple intelligent agents working
    together to achieve a goal?


    ### Figure 3.2 The state of the world – the agent’s internal world that can make
    up for incomplete information


    ![image-5VSROFT.jpg](images/image-5VSROFT.jpeg)


    #### 3.2.1.3 Agent-based modelling


    Agent-based modelling (`ABM`) is used to understand how agents working together
    can achieve a goal (Wikipedia Contributors, 2024l). We might think of this as
    how bees build a wonderful structure to produce honey. An agent-based model can
    look at how the bees communicate, how they maintain order or control; also, how
    an intelligent entity would work around humans or other animals. `ABM` is a really
    useful approach to understanding emergent behaviour. When we think about `ABM`,
    controlling multiple agents or finding a hierarchical controls system like subsumption
    will become a key concept (Wikipedia Contributors, 2024m). This is a growing area
    of interest, and we touch on `ABM` later when we look at intelligent robotics.


    ## 3.2.2 Types of agent: reflex, model-based reflex, goal-based and utility-based


    In AI, an intelligent agent refers to an autonomous entity that acts – directing
    its activity towards achieving goals in an environment using observation through
    sensors and consequently using actuators – and is therefore intelligent. There
    are basically four rational types of agent, examples ranging from a relatively
    simple heating system control agent, building up in complexity to an automated
    medical general practitioner (`GP/doctor`) agent. Let’s look at each of them.


    #### 3.2.2.1 Reflex agent


    In AI, a simple reflex agent is a type of intelligent agent that performs actions
    based solely on the current situation. The agent does this through predetermined
    rules for these conditions. This is commonly referred to as the condition–action
    rule: the program selects actions based on the current percept. It’s simple to
    understand and program.


    Example: the central heating overheats, so the program selects the action to switch
    off the power.


    #### 3.2.2.2 Model-based reflex agent


    In a model-based reflex agent, the agent has a model of the world that it can
    call upon if needed:


    - It can make up for a lack of sensors by using a virtual world that doesn’t need
    sensor data.

