- raw: "ISO/IEC 42001 is an artificial intelligence management system (AIMS) that\
    \ can be used within organisations. This standard aims to ensure responsible development,\
    \ deployment and use of AI technologies by addressing key areas such as risk management,\
    \ AI impact assessments, system lifecycle management and supplier management.\
    \ By adhering to ISO/IEC 42001, organisations can build trustworthy AI systems,\
    \ enhance governance and promote ethical practices, thereby fostering trust and\
    \ compliance with upcoming regulations such as the EU AI Act.\n\nFigure 2.2 Technical\
    \ and non-technical methods to achieve trustworthy AI (EU Creative Commons Attribution\
    \ 4.0 International (CC BY 4.0) licence)\n\n![image-71W4UUW2.jpg](images/image-71W4UUW2.jpeg)\n\
    \n## 2.3 REGULATION AND RISK MANAGEMENT\n\nUp to June 2024, there hasn’t been\
    \ significant regulation of AI apart from the EU AI Act. Regulating AI is crucial\
    \ to ensure safety, fairness and accountability. It helps to mitigate risks such\
    \ as bias, discrimination and privacy violations, while promoting ethical standards\
    \ and transparency. Regulations can also prevent harmful applications, such as\
    \ autonomous weapons, and ensure that AI development aligns with societal values\
    \ and human rights. By setting clear guidelines and oversight, regulations foster\
    \ public trust in AI technologies and facilitate their responsible and beneficial\
    \ use.\n\nThe Web Content Accessibility Guidelines (WCAG) regulate the use of\
    \ AI by providing standards to ensure web content, including AI-driven interfaces,\
    \ is accessible to people with disabilities (www.w3.org/TR/WCAG21/).\n\nWCAG focuses\
    \ on making content perceivable, operable, understandable and robust for all users.\
    \ This includes guidelines for AI systems to offer alternative text for images,\
    \ ensure navigability with assistive technologies, provide clear and understandable\
    \ language and maintain compatibility with various devices and user agents.\n\n\
    These standards help to ensure AI technologies are inclusive and accessible to\
    \ everyone.\n\nThe regulation and risk management should form part of a unified\
    \ strategy based on ISO 31000 (ISO/IEC, 2018) and be supplemented by ISO/IEC 23894\
    \ (ISO/IEC, 2023b), or, perhaps, NIST’s risk management framework (NIST, 2024)\
    \ supplemented by the AI risk management framework (NIST, 2023). Both NIST and\
    \ ISO approaches make risk assessment, governance, transparency, bias mitigation,\
    \ security and privacy, human oversight and continuous monitoring fundamental\
    \ to the management of risk with AI.\n\nTo assess the risk, the EU’s AI Act (European\
    \ Parliament, 2023) provides a useful way to assess the risks of an AI project,\
    \ product or service. This is shown in Figure 2.3.\n\nWe can see some important\
    \ categories: unacceptable risk, high risk, transparency risk and minimal risk.\
    \ The EU AI Act is a landmark legislative proposal aimed at regulating the development,\
    \ deployment and use of AI within the EU. It is the world’s first comprehensive\
    \ AI legislation. It seeks to ensure that AI technologies are safe, transparent\
    \ and aligned with fundamental rights and values.\n\n## 2.3.1 Role of regulation\
    \ in AI\n\nHere are the key objectives of the EU AI Act:\n\nEnsure the safety\
    \ and fundamental rights of people and businesses while fostering AI innovation.\n\
    \nStrengthen trust in AI by providing clear rules and guidelines.\n\nPromote investment\
    \ and innovation in AI across the EU.\n\nUnacceptable risk AI systems are systems\
    \ considered a threat to people and will be banned. They include:\n\nThe cognitive\
    \ behavioural manipulation of people or specific vulnerable groups, for example\
    \ voice-activated toys that encourage dangerous behaviour in children.\n\nSocial\
    \ scoring, which is classifying people based on behaviour, socio-economic status\
    \ or personal characteristics.\n\nThe biometric identification and categorisation\
    \ of people.\n\nThe real-time and remote biometric identification systems, such\
    \ as facial recognition.\n\nFigure 2.3 The EU AI Act risk pyramid\n\n![image-CLHDVT07.jpg](images/image-CLHDVT07.jpeg)\
    \  \n\nAI systems that negatively affect safety or fundamental rights will be\
    \ considered high risk and will be divided into two categories:\n\n1\\. AI systems\
    \ that are used in products falling under the EU’s product safety legislation.\
    \ This includes toys, aviation, cars, medical devices and lifts.\n\n2\\. AI systems\
    \ falling into specific areas that will have to be registered in an EU database:\n\
    \nManagement and operation of critical infrastructure.\n\nEducation and vocational\
    \ training.\n\nEmployment, worker management and access to self-employment.\n\n\
    Access to and enjoyment of essential private services and public services and\
    \ benefits.\n\nLaw enforcement.\n\nMigration, asylum and border control management.\n\
    \nAssistance in legal interpretation and application of the law.\n\nAs part of\
    \ the Act, there are transparency risk requirements: generative AI, such as ChatGPT,\
    \ will not be classified as high risk, but will have to comply with transparency\
    \ requirements and EU copyright law:\n\ndisclosing that the content was generated\
    \ by AI;\n\ndesigning the model to prevent it from generating illegal content;\
    \ and\n\npublishing summaries of copyrighted data used for training.\n\nWe must\
    \ abide by the law. Regulation is the control of AI by law enforced by the courts.\
    \ This is different from ethics, in that we cannot be punished by breaking an\
    \ ethical principle but there are consequences for breaking a law. The first and\
    \ specific AI legal framework is the EU’s AI Act (European Parliament, 2023).\
    \ This EU regulation applies to anyone who makes, uses, imports or distributes\
    \ AI systems in the EU, regardless of where they are based. It also applies to\
    \ AI systems used in the EU, even if they are made outside the EU. Saying that,\
    \ the legal landscape is changing as quickly as the field of AI is developing,\
    \ and we can expect more. We must also abide by existing laws such as the EU GDPR\
    \ (European Commission, 2018) and the UK’s Data Protection Act (UK Government,\
    \ 2018). Abiding by these regulations is a fundamental part of an ML or AI project.\n\
    \n## 2.3.2 Risk management in AI\n\nRisk is defined as the effect of uncertainty\
    \ on objectives, which can be positive or negative. It encompasses potential events\
    \ and their consequences, as well as the likelihood of occurrence (ISO/IEC, 2018).\n\
    \nRisk management is defined as the process of identifying, assessing and controlling\
    \ threats to an organisation’s capital and earnings. These threats, or risks,\
    \ could stem from various sources including financial uncertainty, legal liabilities,\
    \ strategic management errors, accidents and natural disasters (ISO/IEC, 2018).\
    \ Risk analysis is used to identify AI risks and involves systematically assessing\
    \ the potential threats and vulnerabilities associated with the development, deployment\
    \ and operation of AI systems. The key steps are:\n\nDefine scope and objectives:\n\
    \nIdentify assets and processes.\n\nIdentify threats and vulnerabilities.\n\n\
    Assess impact and likelihood.\n\nPrioritise risks.\n\nMitigate strategies.\n\n\
    Monitor and review.\n\nThe risks and challenges associated with AI adoption include:\n\
    \nbias and discrimination;\n\nprivacy concerns;\n\njob displacement;\n\naccountability\
    \ and transparency;\n\nregulatory compliance;\n\nsecurity risks;\n\ntechnical\
    \ limitations;\n\nethical dilemmas.\n\nAddressing these challenges requires comprehensive\
    \ strategies involving ethical guidelines, robust security measures, continuous\
    \ monitoring and adherence to regulatory frameworks. ISO 31000 provides a framework\
    \ for risk management that helps organisations to identify, assess and prioritise\
    \ risks, and develop strategies to manage them effectively.\n\nThe standard emphasises:\n\
    \nPrinciples: establishing a risk management culture that is integral to the organisation.\n\
    \nFramework: building a supportive environment through leadership, commitment\
    \ and integration into organisational processes.\n\nProcess: implementing a systematic\
    \ approach to identifying, analysing, evaluating, treating, monitoring and reviewing\
    \ risks."
  fmt: "\nISO/IEC 42001 is an artificial intelligence management system (AIMS) that\
    \ can be used within organisations. This standard aims to ensure responsible development,\
    \ deployment and use of AI technologies by addressing key areas such as risk management,\
    \ AI impact assessments, system lifecycle management and supplier management.\
    \ By adhering to ISO/IEC 42001, organisations can build trustworthy AI systems,\
    \ enhance governance and promote ethical practices, thereby fostering trust and\
    \ compliance with upcoming regulations such as the EU AI Act.\n\nFigure 2.2 Technical\
    \ and non-technical methods to achieve trustworthy AI (EU Creative Commons Attribution\
    \ 4.0 International (CC BY 4.0) licence)\n\n![image-71W4UUW2.jpg](images/image-71W4UUW2.jpeg)\n\
    \n## 2.3 REGULATION AND RISK MANAGEMENT\n\nUp to June 2024, there hasn’t been\
    \ significant regulation of AI apart from the EU AI Act. Regulating AI is crucial\
    \ to ensure safety, fairness and accountability. It helps to mitigate risks such\
    \ as bias, discrimination and privacy violations, while promoting ethical standards\
    \ and transparency. Regulations can also prevent harmful applications, such as\
    \ autonomous weapons, and ensure that AI development aligns with societal values\
    \ and human rights. By setting clear guidelines and oversight, regulations foster\
    \ public trust in AI technologies and facilitate their responsible and beneficial\
    \ use.\n\nThe Web Content Accessibility Guidelines (WCAG) regulate the use of\
    \ AI by providing standards to ensure web content, including AI-driven interfaces,\
    \ is accessible to people with disabilities (www.w3.org/TR/WCAG21/).\n\nWCAG focuses\
    \ on making content perceivable, operable, understandable and robust for all users.\
    \ This includes guidelines for AI systems to offer alternative text for images,\
    \ ensure navigability with assistive technologies, provide clear and understandable\
    \ language and maintain compatibility with various devices and user agents.\n\n\
    These standards help to ensure AI technologies are inclusive and accessible to\
    \ everyone.\n\nThe regulation and risk management should form part of a unified\
    \ strategy based on ISO 31000 (ISO/IEC, 2018) and be supplemented by ISO/IEC 23894\
    \ (ISO/IEC, 2023b), or, perhaps, NIST’s risk management framework (NIST, 2024)\
    \ supplemented by the AI risk management framework (NIST, 2023). Both NIST and\
    \ ISO approaches make risk assessment, governance, transparency, bias mitigation,\
    \ security, privacy, human oversight and continuous monitoring fundamental to\
    \ the management of risk with AI.\n\nTo assess the risk, the EU’s AI Act (European\
    \ Parliament, 2023) provides a useful way to assess the risks of an AI project,\
    \ product or service. This is shown in Figure 2.3.\n\nWe can see some important\
    \ categories: unacceptable risk, high risk, transparency risk and minimal risk.\
    \ The EU AI Act is a landmark legislative proposal aimed at regulating the development,\
    \ deployment and use of AI within the EU. It is the world’s first comprehensive\
    \ AI legislation. It seeks to ensure that AI technologies are safe, transparent\
    \ and aligned with fundamental rights and values.\n\n### 2.3.1 Role of regulation\
    \ in AI\n\nHere are the key objectives of the EU AI Act:\n\n- Ensure the safety\
    \ and fundamental rights of people and businesses while fostering AI innovation.\n\
    - Strengthen trust in AI by providing clear rules and guidelines.\n- Promote investment\
    \ and innovation in AI across the EU.\n\nUnacceptable risk AI systems are systems\
    \ considered a threat to people and will be banned. They include:\n\n- The cognitive\
    \ behavioural manipulation of people or specific vulnerable groups, for example\
    \ voice-activated toys that encourage dangerous behaviour in children.\n- Social\
    \ scoring, which is classifying people based on behaviour, socio-economic status\
    \ or personal characteristics.\n- The biometric identification and categorisation\
    \ of people.\n- The real-time and remote biometric identification systems, such\
    \ as facial recognition.\n\nFigure 2.3 The EU AI Act risk pyramid\n\n![image-CLHDVT07.jpg](images/image-CLHDVT07.jpeg)\n\
    \nAI systems that negatively affect safety or fundamental rights will be considered\
    \ high risk and will be divided into two categories:\n\n1. AI systems that are\
    \ used in products falling under the EU’s product safety legislation. This includes\
    \ toys, aviation, cars, medical devices and lifts.\n2. AI systems falling into\
    \ specific areas that will have to be registered in an EU database:\n    - Management\
    \ and operation of critical infrastructure.\n    - Education and vocational training.\n\
    \    - Employment, worker management and access to self-employment.\n    - Access\
    \ to and enjoyment of essential private services and public services and benefits.\n\
    \    - Law enforcement.\n    - Migration, asylum and border control management.\n\
    \    - Assistance in legal interpretation and application of the law.\n\nAs part\
    \ of the Act, there are transparency risk requirements: generative AI, such as\
    \ `ChatGPT`, will not be classified as high risk, but will have to comply with\
    \ transparency requirements and EU copyright law:\n\n- disclosing that the content\
    \ was generated by AI;\n- designing the model to prevent it from generating illegal\
    \ content; and\n- publishing summaries of copyrighted data used for training.\n\
    \nWe must abide by the law. Regulation is the control of AI by law enforced by\
    \ the courts. This is different from ethics, in that we cannot be punished by\
    \ breaking an ethical principle but there are consequences for breaking a law.\
    \ The first and specific AI legal framework is the EU’s AI Act (European Parliament,\
    \ 2023). This EU regulation applies to anyone who makes, uses, imports or distributes\
    \ AI systems in the EU, regardless of where they are based. It also applies to\
    \ AI systems used in the EU, even if they are made outside the EU. Saying that,\
    \ the legal landscape is changing as quickly as the field of AI is developing,\
    \ and we can expect more. We must also abide by existing laws such as the EU GDPR\
    \ (European Commission, 2018) and the UK’s Data Protection Act (UK Government,\
    \ 2018). Abiding by these regulations is a fundamental part of a ML or AI project.\n\
    \n### 2.3.2 Risk management in AI\n\nRisk is defined as the effect of uncertainty\
    \ on objectives, which can be positive or negative. It encompasses potential events\
    \ and their consequences, as well as the likelihood of occurrence (ISO/IEC, 2018).\n\
    \nRisk management is defined as the process of identifying, assessing and controlling\
    \ threats to an organisation’s capital and earnings. These threats, or risks,\
    \ could stem from various sources including financial uncertainty, legal liabilities,\
    \ strategic management errors, accidents and natural disasters (ISO/IEC, 2018).\
    \ Risk analysis is used to identify AI risks and involves systematically assessing\
    \ the potential threats and vulnerabilities associated with the development, deployment\
    \ and operation of AI systems. The key steps are:\n\n1. Define scope and objectives:\n\
    \    - Identify assets and processes.\n    - Identify threats and vulnerabilities.\n\
    \    - Assess impact and likelihood.\n    - Prioritise risks.\n    - Mitigate\
    \ strategies.\n    - Monitor and review.\n\nThe risks and challenges associated\
    \ with AI adoption include:\n\n- bias and discrimination;\n- privacy concerns;\n\
    - job displacement;\n- accountability and transparency;\n- regulatory compliance;\n\
    - security risks;\n- technical limitations;\n- ethical dilemmas.\n\nAddressing\
    \ these challenges requires comprehensive strategies involving ethical guidelines,\
    \ robust security measures, continuous monitoring and adherence to regulatory\
    \ frameworks. ISO 31000 provides a framework for risk management that helps organisations\
    \ to identify, assess and prioritise risks, and develop strategies to manage them\
    \ effectively.\n\nThe standard emphasises:\n\n- Principles: establishing a risk\
    \ management culture that is integral to the organisation.\n- Framework: building\
    \ a supportive environment through leadership, commitment and integration into\
    \ organisational processes.\n- Process: implementing a systematic approach to\
    \ identifying, analysing, evaluating, treating, monitoring and reviewing risks.\n"
  trans: "\nISO/IEC 42001 是一种可在组织内部的人工智能管理系统（AIMS）。该标准旨在通过解决风险管理、AI 影响评估、系统生命周期管理和供应商管理等关键领域，确保人工智能技术的负责任开发、部署和使用。通过遵循\
    \ ISO/IEC 42001，组织可以构建可靠的 AI 系统，增强治理并促进伦理实践，从而增强信任并符合即将出的法规（如《欧盟 AI 法案》）。\n\n\
    图 2.2 实现可靠 AI 的技术和非技术方法（欧盟知识共享署源许可 4.0 国际 (CC BY 4.0) 许可）\n\n![image-71W4UUW2.jpg](img/image-71W4UUW2.jpeg)\n\
    \n## 2.3 监管与风险管理\n\n截至 2024 年 6 月，除《欧盟 AI 法案》外，尚未对 AI 进行重大监管。监管 AI 对于确保安全、公平和问责制至关重要。它有助于缓解偏见、歧视和侵犯隐私等风险，同时促进伦理标准和透明度。法规还可以防止有害应用（如自主性武器），并确保\
    \ AI 开发符合社会价值观和人权。通过设定明确的指南和监督，监管培养了公众对 AI 技术的信任，并促进其负责任且有益的使用。\n\n《Web 内容无障碍指南》（WCAG）通过提供标准来确保网络内容（包括\
    \ AI 驱动的界面）残障人士可以访问，从而监管 AI 的（www.w3.org/TR/WCAG21/）。\n\nWCAG 重点在于让内容对所有用户都是可感知、可操作、可理解且稳健的。这包括\
    \ AI 系统为图像提供替代文本、确保使用辅助技术的可导航性、提供清晰易懂的语言，并保持与各种设备和用户代理的兼容性。\n\n这些标准有助于确保 AI 技术对所有人都是包容且可访问的。\n\
    \n监管和风险管理应形成基于 ISO 31000（ISO/IEC, 2018）的统一策略的一部分，并由 ISO/IEC 23894（ISO/IEC, 2023b）进行补充，或者由\
    \ NIST 的风险管理框架（NIST, 2024）辅以 AI 风险管理框架（NIST, 2023）。NIST 和 ISO 的方法都将风险评估、治理、透明度、偏见缓解、安全、隐私、人类监督和持续监控视为\
    \ AI 风险管理的基础。\n\n为了评估风险，欧盟的《AI 法案》（欧洲议会，2023 年）提供了一种评估 AI 项目、产品或服务风险的有效方法。这如图\
    \ 2.3 所示。\n\n我们可以看到一些重要的类别：不可接受的风险、高风险、透明度风险和极低风险。《AI 法案》是一项里程碑式的立法提案，旨在监管欧盟范围内\
    \ AI 的开发、部署和使用。它是世界上首部全面的 AI 立法。它寻求确保 AI 技术是安全、透明并符合基本权利和价值观。\n\n### 2.3.1 监管在\
    \ AI 中的作用\n\n以下是《欧盟 AI 法案》的主要目标：\n\n- 在促进 AI 创新的同时，确保个人和企业的安全与基本权利。\n- 通过提供明确的规则和指南增强对\
    \ AI 的信任。\n- 促进欧盟范围内 AI 的投资和创新。\n\n不可接受风险 AI 系统被认为是对人类构成威胁的系统，并将被禁止。它们包括：\n\n\
    - 对个人或特定脆弱群体的认知行为操纵，例如鼓励儿童产生危险行为的语音控制玩具。\n- 社会评分，即根据行为、社会经济地位或个人特征对人进行分类。\n- 对人的生物特征识别和分类。\n\
    - 实时和远程生物识别系统，如脸部识别。\n\n图 2.3 《欧盟 AI 法案》风险金字塔\n\n![image-CLHDVT07.jpg](img/image-CLHDVT07.jpeg)\n\
    \n对安全或基本权利产生负面影响的 AI 系统将被视为高风险，分为两类：\n\n1. 用于欧盟产品安全法规范围内产品的 AI 系统。这包括玩具、航空、汽车、医疗设备和电梯。\n\
    2. 属于特定领域且必须在欧盟数据库中注册的 AI 系统：\n    - 关键基础设施的管理与运营。\n    - 教育和职业培训。\n    - 就业、工人管理和就业机会。\n\
    \    - 对基本私人服务、公共服务和福利的获取和享受。\n    - 执法。\n    - 迁移、庇护和边境控制管理。\n    - 法律解释和法律应用的协助。\n\
    \n作为该法案的一部分，存在透明度风险要求：生成式 AI（如 `ChatGPT`）不会被归类高风险，但必须遵守透明度要求和欧盟版权法：\n\n- 披露内容由\
    \ AI 生成；\n- 设计模型以防止其生成非法内容；以及\n- 发布用于训练的版权数据的摘要。\n\n我们必须遵守法律。监管是通过法院执行的法律对 AI\
    \ 的控制。这与伦理不同，我们不会因为违反伦理原则而受到惩罚，但违反法律会有后果。首个且特定的 AI 法律框架是欧盟的《AI 法案》（欧洲议会，2023 年）。这项欧盟法规适用于任何在欧盟制造、使用、进口或分发\
    \ AI 系统的人，无论其总部位于何处。它也适用于在欧盟使用的 AI 系统，即使这些是在欧盟境外制造的。可以说，法律格局的变化与 AI 领域的发展一样快，我们可以预见到更多。我们还必须遵守现有法律，如欧盟\
    \ GDPR（欧盟委员会，2018 年）和英国的《数据保护法》（英国政府，2018 年）。遵守这些法规是机器学习或 AI 项目的基础部分。\n\n### 2.3.2\
    \ AI 中的风险管理\n\n风险被定义为不确定性对目标的影响，可以是正面的也可以是负面的。它包含了潜在事件及其后果，以及发生的概率（ISO/IEC, 2018）。\n\
    \n风险管理被定义为识别、评估和控制对组织资本和收益威胁的过程。这些威胁或风险可能来自来源，包括财务不确定性、法律责任、战略管理错误、事故和自然灾害（ISO/IEC,\
    \ 2018）。风险分析用于识别 AI 风险，涉及系统地评估与 AI 系统开发、部署和运行相关的威胁和漏洞。关键步骤包括：\n\n1. 定义范围和目标：\n\
    \    - 识别资产和流程。\n    - 识别威胁和漏洞。\n    - 评估影响和可能性。\n    - 风险排序。\n    - 缓解策略。\n \
    \   - 监控与审查。\n\n采用 AI 相关的风险和挑战包括：\n\n- 偏见和歧视；\n- 隐私担忧；\n- 岗位流失；\n- 问责制和透明度；\n\
    - 法规合规；\n- 安全风险；\n- 技术局限性；\n- 伦理困境。\n\n应对这些挑战需要综合策略，涉及伦理指南、稳健的安全措施、持续监控以及对监管框架的遵循。ISO\
    \ 31000 提供了一个风险管理框架，帮助组织识别、评估并优先风险，并制定有效的管理策略。\n\n该标准强调：\n\n- 原则：建立与组织不可分割的风险管理文化。\n\
    - 框架：通过领导、承诺和整合到组织流程中建立支持性环境。\n- 过程：实施系统的方法来识别、分析、评估、处置、监控和审查风险。\n"
