    Stakeholder engagement is often more focused on the business and IT alignment
    without the need for specialised data science roles. With our ethical and regulatory
    requirements, `AI` and `ML` projects will attract more exposure to a broader range
    of stakeholders. Involvement from a diverse set of stakeholders is crucial. The
    business case should outline how each stakeholder group will contribute and benefit
    from the project. Of particular importance is that a diverse stakeholder base
    will play a key role understanding bias and the outcome of a project. These may
    be `AI` ethics officers, ethics boards, legal (intellectual property, copyright),
    procurement, and so on.


    Depending on the type of project, maintenance is usually related to software updates,
    hardware maintenance and user support, which are more predictable and less intensive.
    Learning from data and learning from experience bring with it more work and challenges.
    Continuous monitoring and maintenance of `AI` systems are necessary to ensure
    they remain accurate and relevant. The business case should include plans for
    ongoing support, model retraining and performance monitoring – as well as the
    maintenance of hardware.


    Up to the present day, pilot projects (quick look, see, maybe) may not be as critical,
    and projects can move directly to implementation if the requirements and solutions
    are well understood. Agile project management and the minimum viable product has
    more emphasis on learning from experience, and the pilot is more commonplace.
    With this in mind, `AI/ML` projects, favouring a learning from experience approach,
    often start with a pilot or proof-of-concept phase to validate the model before
    full-scale implementation. The business case should include plans for scaling
    the solution based on pilot results.


    Ethical implications and regulatory compliance are more prominent in `ML` and
    `AI` projects. Issues such as data privacy, model transparency and ethical AI
    practices need to be addressed in the business case. For example, a human-centric
    ethical purpose is at the core of the `EU AI Act`. While regulatory compliance
    is still important from an old-school IT perspective, ethical considerations are
    less likely to be a central focus unless the project directly affects data privacy
    or security. It is important to acknowledge, here, that there is a plethora of
    competing standards and guidance emerging globally, including from various UK
    government departments; however, in the UK particularly there is no clear regulatory
    or legislative guidance yet. Chapter 2 is focused on this specifically and will
    help to determine what is fit for purpose. A diverse team with a domain expert
    will help this.


    ## 5.2 Stakeholders and Project Management


    In this section we look at stakeholders in more detail and what approaches to
    project management we can use if our project includes learning from experience
    or learning from data. For example, stakeholders will play a crucial role in helping
    organisations to comply with the `EU AI Act` by providing guidance, resources
    and oversight. Industry experts and academic researchers will offer insights into
    best practices for `AI` development and deployment, ensuring that organisations
    are well-informed about the regulatory requirements and ethical considerations.
    Civil society organisations will advocate for transparency and accountability,
    helping to monitor compliance and raise awareness about potential risks. Policymakers
    and regulatory bodies will provide clear and actionable guidelines, as well as
    support mechanisms such as training programmes and compliance tools. Through collaboration
    and knowledge sharing, stakeholders will assist organisations in implementing
    robust governance frameworks, conducting thorough risk assessments and maintaining
    continuous oversight of `AI` systems, thereby ensuring adherence to regulations
    and law (e.g. the `EU AI Act`, `NIST`, etc.) and fostering a culture of responsible
    `AI` innovation.


    ### 5.2.1 Stakeholder identification and categorisation


    In `AI/ML`, stakeholders encompass a diverse group of individuals, organisations
    and entities that have an interest in or are affected by the development, deployment
    and use of `AI` technologies. With the heightened concern over our environment,
    the climate and biodiversity, these stakeholders are growing in influence and
    making a significant impact on the future directions of society and resources.
    `AI/ML` can contribute to intergenerational equity and sustainability in many
    ways.


    Identifying stakeholders is crucial for effective stakeholder management, to ensure
    balanced consideration of interests, ethical implementation and responsible development
    of `AI` systems. One way of identifying stakeholders is to create a stakeholder
    wheel; an example is given in Figure 5.1. Remember that safety and security are
    vital to all stakeholders and should be designed in and continually improved.


    ### 5.2.2 Stakeholder power and influence


    In the context of `AI` projects, the concepts of power and influence in stakeholder
    management remain crucial, but they take on specific nuances due to the nature
    of `AI` technology and its applications.


    Power comes from formal roles within the organisation that authorise decision-making
    and resource allocation. It directly affects project scope, resource distribution
    and formal approval processes.


    Figure 5.1 An example of an `AI` stakeholder wheel


    ![image-JONHQCU4.jpg](images/image-JONHQCU4.jpeg)


    Influence derives from expertise, reputation and the ability to persuade and mobilise
    others. It indirectly shapes the project’s technical direction, user acceptance
    and innovative approaches.


    #### 5.2.2.1 Stakeholder power in AI projects


    In `AI` projects, power refers to the formal authority stakeholders possess to
    make strategic decisions, allocate resources and enforce project directions.


    Stakeholders with power have the following characteristics:


    - **Strategic decision-making**: they can define the scope, goals and direction
    of the `AI` project.

    - **Resource allocation**: they control budgets, personnel and technology infrastructure
    necessary for the `AI` project.

    - **Regulatory compliance**: they ensure the `AI` project complies with legal,
    ethical and organisational standards.

    - **Approval authority**: they have the final say on project milestones, deliverables
    and deployments.


    Examples of power stakeholders could be:


    - Executives and senior management who decide on the investment and strategic
    alignment of the `AI` project with business goals.

    - Project sponsors who approve the `AI` project’s budget and resource requirements.

    - Legal and compliance officers who ensure the `AI` project adheres to regulatory
    standards and ethical guidelines.


    #### 5.2.2.2 Stakeholder influence in AI projects


    In `AI` projects, influence refers to the ability of stakeholders to shape perceptions,
    decisions and actions related to the project without formal authority.


    Stakeholders with influence have the following characteristics:


    - **Expert knowledge**: they often possess deep technical expertise in `AI`, data
    science or related fields.

    - **Thought leadership**: they can shape the vision and direction of the project
    through their insights and innovative ideas.

    - **Networking and collaboration**: they can rally support and foster collaboration
    across different teams and departments.

    - **User advocacy**: they represent the interests and needs of end-users, ensuring
    the AI solutions are user-centric and effective.


    Examples of influence stakeholders could be:


    - Data scientists and `AI` researchers who provide critical insights into the
    feasibility and design of `AI` models.

    - Technical leads and engineers who influence the technical architecture and implementation
    of the `AI` solution.

    - Ethics and privacy advocates who ensure the `AI` project considers ethical implications
    and user privacy concerns.

    - Product managers who align the `AI` project with market needs and customer expectations.

    - Ethics boards/committees who align the `AI` project with the ethics of the organisation.

