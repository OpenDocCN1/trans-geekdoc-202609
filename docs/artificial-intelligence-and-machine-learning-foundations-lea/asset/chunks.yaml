    ## 1.3 SUMMARY


    This chapter has introduced the basic concepts that underlie AI and its relationship
    to human intelligence. The chapter sets the stage for understanding AI by framing
    it as a learning agent, similar to human intelligence, that interacts with its
    environment to achieve goals. AI encompasses creating intelligent entities, while
    ML involves the ability of systems to learn from data.


    The chapter has laid the groundwork for a deeper exploration of AI, clarifying
    its goals and limitations. By understanding the key principles of intelligence,
    learning and the scientific method, you are prepared for a more detailed analysis
    of AI’s applications, ethical implications and future developments in subsequent
    chapters.


    # 2ETHICS AND GOVERNANCE


    In this chapter we will make sense of how ethics, and how AI ethics, makes us
    think more carefully about the benefits of if and how AI can improve things –
    a human-centric ethical purpose. This is essentially what humans value, which
    is different for each person based on the context, and changes with time. We may
    also think of this as our principles that lead to the values and rights we expect.


    AI and ML are by no means a panacea – a silver bullet. Fred Brooks helped us understand
    complexity by distinguishing between two types: accidental complexity, which can
    be fixed, and essential complexity, which must be acknowledged and addressed by
    the system itself (Brooks, 1986). Brook’s careful thought gives us a warning that
    when we engineer accidental complexity there is a fair chance that AI/ML can help
    us, but essential complexity is something that AI/ML may not help us with. Making
    sense of a problem we face can be further enhanced by frameworks such as Cynefin
    (Cynefin, 2023). Our team, including the subject matter experts, must work with
    stakeholders to ensure ethics and governance is built in from the start and for
    the full life cycle of the project. This means our AI team integrates a human-centric
    ethical purpose into the design of AI systems, guided by our ethical principles
    (Floridi and Cowls, 2019), which prioritise protecting human rights and values.


    ## 2.1 ETHICAL AI


    As part of the EU’s guidelines on ethical AI, we must understand the ethical challenges
    AI raises (European Commission, 2024). This is by no means a simple subject; we
    must consider, for example:


    How do we deal with the ethics?


    Who is responsible?


    What does the law say?


    What about human rights?


    What about machine rights?


    With AGI and strong AI, robotics becomes another ethical question. General approaches
    to robotic AI have been published by the Engineering and Physical Sciences Research
    Council (Wikipedia Contributors, 2024k). Other organisations are preparing AI
    principles also; these include the International Organization for Standardization
    (ISO). The output from organisations like the ISO include standards on definitions
    (ISO/IEC, 2022a), risks (ISO/IEC, 2023b), management (ISO/IEC, 2023a) and guidance
    (ISO/IEC, 2022b).


    Key themes coming out from various organisations include transparency, accountability
    and care taken when considering bias, diversity, inequalities and unemployment.
    The themes link back to good ethics. The EU has built the guidelines for AI around
    an ethical purpose that we can measure (European Commission, 2024) using, for
    example, the United Nations sustainability goals (United Nations, 2015). These
    guidelines have now become AI law in the EU (European Parliament, 2023).


    ## 2.1.1 AI governance


    AI governance refers to the framework of policies, processes and controls designed
    to ensure the ethical, transparent and accountable development and deployment
    of AI systems. It involves setting standards for data usage, algorithmic fairness
    and decision-making processes to mitigate risks such as bias, privacy violations
    and lack of explainability. Effective AI governance aims to balance innovation
    with the protection of individual rights and societal values, fostering trust
    and compliance with legal and ethical standards.


    ## 2.1.2 Human-centric ethical purpose – fundamental rights, principles and values


    A human-centric ethical purpose aims to enhance human capabilities and societal
    wellbeing. It builds on the Universal Declaration of Human Rights and the Charter
    of Fundamental Rights of the European Union. Typical measures of how this might
    be demonstrated are the United Nations sustainability goals. There are several
    bodies and many organisations worldwide currently working on codes of ethics around
    AI. We should also note in passing that the Center for Human-Compatible Artificial
    Intelligence (https://humancompatible.ai) is also producing papers on AI and its
    human-centric use. This centre was founded by the author of Human Compatible:
    Artificial Intelligence and the Problem of Control, Stuart Russell (2019) – the
    book that addresses the control problem of AI head on.


    2.1.2.1 Future of Life Institute (US founded)


    The Future of Life Institute has developed the Asilomar Principles for AI (https://futureoflife.org).
    There are 23 principles relating to:


    Research – goals, funding, policy, cultures, race avoidance (speed of progress).


    Ethics and values – safety, failure transparency, judicial transparency, responsibility,
    value alignment, human values, personal privacy, liberty and privacy, shared benefit,
    shared prosperity, human control, non-subversion, AI arms race.


    Longer term issues – capability caution, importance, risks, recursive self-improvement,
    common good.


    The name Asilomar was inspired by the highly influential Asilomar Conference on
    Recombinant DNA in 1975. The biotechnology community are still influenced by the
    voluntary guidelines developed at this conference.


    2.1.2.2 The European Union – AI guidelines and AI Act


    The EU is one of the trailblazers tackling ethical use of AI from the front. It
    has produced AI guidelines that have been made fundamental and explicit in its
    AI Act.


    AI ethics guidelines are produced by the European Commission’s High-Level Expert
    Group on Artificial Intelligence (European Commission, 2024). The guidelines are
    for trustworthy AI.


    Trustworthy AI basically has two components:


    1\. It should respect fundamental rights, applicable regulation and core principles
    and values, ensuring an ‘ethical purpose’.


    2\. It should be technically robust and reliable, since, even with good intentions,
    a lack of technological mastery can cause unintentional harm.


    It also considers:


    Rights – a collection of entitlements that a person may have and that are protected
    by government and the courts.


    Values – ethical ideals or beliefs for which a person has enduring preference,
    and which determine our state of mind and act as a motivator.


    Principles – a fundamental well-settled rule of law or standard for good behaviour,
    or collectively our moral or ethical standards.


    The last revision of the EU’s ‘ethical guidance on AI’ was produced in April 2019,
    and this has now evolved into the European Union Artificial Intelligence Act 2024
    (European Parliament, 2023).


    The EU AI Act, proposed by the European Commission, represents a pioneering regulatory
    framework aimed at governing AI technologies within the EU. It seeks to ensure
    that AI systems are developed and utilised in a manner that is ethical, transparent
    and aligned with fundamental rights. The Act categorises AI applications into
    risk-based tiers, ranging from minimal to high risk, with stringent requirements
    imposed on the latter. These include rigorous conformity assessments, data governance
    standards and continuous monitoring to mitigate potential harms. By setting these
    comprehensive standards, the AI Act aspires to foster innovation while safeguarding
    public trust and safety, positioning the EU as a global leader in the responsible
    deployment of AI.


    2.1.2.3 The ISO/IEC'
