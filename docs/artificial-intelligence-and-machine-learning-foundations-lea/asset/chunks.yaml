- raw: 'Natural language processing (NLP): An area of artificial intelligence that
    focuses on the interaction between computers and humans through natural language.
    NLP enables machines to understand, interpret and generate human language, allowing
    them to perform tasks such as language translation, sentiment analysis, speech
    recognition and text generation. It combines computational linguistics, machine
    learning and deep learning techniques to process and analyse large volumes of
    natural language data.


    Nearest neighbour algorithm: One of the first algorithms used to determine a solution
    to the travelling salesman problem.


    Neural network: A machine learning algorithm that is based on a mathematical model
    of the biological brain.


    Nodes: Represent neurons (biological brain) and are interconnected to form a neural
    network.


    Ontology: The philosophical study of the nature of being, becoming, existence
    or reality, as well as the basic categories of being and their relations.


    Optical character recognition (OCR): The conversion of images of typed, handwritten
    or printed text into machine-encoded text.


    Over-fitting or over-training: A machine learning model that is too complex, has
    high variance and low bias. It is the opposite of under-fitting or under-training.


    Probability: The measure of the likelihood that an event will occur.


    Python: A programming language popular in machine learning.


    Random decision forests: An ensemble learning method for classification, regression
    and other tasks.


    Random forests: An ensemble learning method for classification, regression and
    other tasks that operate by constructing a multitude of decision trees at training
    time.


    Regression analysis: In machine learning, regression analysis is a simple supervised
    learning technique used to find a trendline to describe the data.


    Reinforcement machine learning: Uses software agents that take actions in an environment
    in order to maximise some notion of cumulative reward.


    Robotic process automation (RPA): A business process automation technology based
    on the notion of software robots or artificial intelligence workers.


    Robotics: Deals with the design, construction, operation and use of robots, as
    well as computer systems for their control, sensory feedback and information processing.


    Scripting: Programs written for a special run-time environment that automate the
    execution of tasks that could alternatively be executed one-by-one by a human
    operator.


    Search: The use of machine learning in search problems, e.g. shortest path.


    Semi-supervised machine learning: Machine learning that uses labelled and unlabelled
    data for training.


    Sigmoid function: A mathematical function having a characteristic S-shaped curve
    or sigmoid curve.


    Software: A generic term that refers to a collection of data and computer instructions
    that tell the computer how to work.


    Software robot: Replaces a function that a human would otherwise do.


    Strong AI or artificial general intelligence: Strong AI’s goal is the development
    of artificial intelligence to the point where the machine’s intellectual capability
    is functionally equal to a human.


    Supervised machine learning: The task of learning a function that maps an input
    to an output based on example input–output pairs.


    Support vector machine: Constructs a hyperplane or set of hyperplanes in a high-
    or infinite-dimensional space, which can be used for classification, regression
    or other tasks, such as an outlier’s detection.


    Swarm intelligence: The collective behaviour of decentralised, self-organised
    systems, natural or artificial.


    System: A regularly interacting or interdependent group of items forming a unified
    whole.


    The fourth industrial revolution: Builds on the digital revolution, representing
    new ways in which technology becomes embedded within societies and even the human
    body.


    Trustworthy AI: Has two components: (1) its development, deployment and use should
    comply with fundamental rights and applicable regulation as well as respecting
    core principles and values, ensuring ‘ethical purpose’; (2) it should be technically
    robust and reliable.


    Under-fitting: When the machine learning model has low variance and high bias.
    It is the opposite of over-fitting or over-training.


    Universal design: Refers to broad-spectrum ideas meant to produce buildings, products
    and environments that are inherently accessible to older people, people without
    disabilities and people with disabilities (close relation to inclusive design).


    Unsupervised machine learning: Infers a function that describes the structure
    of unlabelled data.


    Validation data: A set of data used to test the output of a machine learning model
    that is not used to train the model.


    Variance: The expectation of the squared deviation of a random variable from its
    mean.


    Visualisation: Any technique for creating images, diagrams or animations to communicate
    a message.


    Weights: A weight function is a mathematical device used when performing a sum,
    integral or average to give some elements more ‘weight’ or influence on the result
    than other elements in the same set.


