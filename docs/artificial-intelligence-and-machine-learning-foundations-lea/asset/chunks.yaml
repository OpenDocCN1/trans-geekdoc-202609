    6.2.6.8 Information technology


    IT is universal to all areas of our lives. It is easy to fall into the trap of
    thinking that IT is the driver of AI in an organisation. This is almost intuitive
    because of the importance attached to ML. IT enables AI, and in particular ML.
    Some areas where AI fits into IT are set out in Table 6.12.


    Table 6.12 Uses of AI in information technology


    | ^(Information technology area) || ^(Example) |


    | --- | --- |


    | ^(IT infrastructure management)  || ^(Automated system monitoring – AI-powered
    tools such as Dynatrace and Splunk monitor IT infrastructure in real time, detecting
    anomalies and potential issues before they cause significant problems. These tools
    use ML to analyse system performance and provide alerts for unusual behaviour.
    Predictive maintenance – AI algorithms predict hardware failures by analysing
    data from various sensors and logs, allowing for proactive maintenance and reducing
    downtime. For instance, IBM’s Predictive Maintenance and Quality solution uses
    AI to foresee and prevent equipment failures.)  |


    | ^(Cybersecurity)  || ^(Threat detection and response – AI-based cybersecurity
    solutions such as Darktrace and CrowdStrike use ML to detect unusual patterns
    and potential threats in real time, enabling quicker response to cyber-attacks.
    Fraud detection – financial institutions use AI to detect fraudulent activities
    by analysing transaction patterns and user behaviour. For example, PayPal uses
    AI to monitor transactions and flag suspicious activities.)  |


    | ^(IT service management)  || ^(Automated ticket resolution – AI chatbots and
    virtual assistants such as ServiceNow Virtual Agent handle routine IT support
    requests, such as password resets or software troubleshooting, improving efficiency
    and reducing the workload on human agents. Intelligent incident management – AI
    tools prioritise and categorise IT service requests and incidents, ensuring that
    critical issues are addressed promptly. Tools such as Moogsoft use AI to reduce
    alert noise and correlate incidents, helping IT teams to focus on resolving major
    issues.)  |


    | ^(Data management and analytics)  || ^(Data cleaning and preparation – AI tools
    such as Trifacta automate the process of cleaning and preparing data for analysis,
