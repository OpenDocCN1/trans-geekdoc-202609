    This approach ensures that risk management is structured, comprehensive and tailored
    to the organisation’s context and objectives.


    ## 2.3.2.1 SWOT, PESTLE and Cynefin


    In this section we give a brief overview of some techniques to make sense of risk
    so that we can manage it. The first is `SWOT` analysis, which looks at the opportunities
    and threats both internally and externally to your organisation. The second is
    `PESTLE`, a process to understand stakeholders. Finally, there’s `Cynefin`, the
    way to make sense of your AI project and manage complexity and chaos.


    By using a `SWOT` analysis to manage AI risks, organisations can gain insights
    into their internal capabilities and external environment, enabling them to make
    informed decisions and take proactive measures to mitigate risks and maximise
    the benefits of AI adoption. This is shown schematically in Figure 2.4.


    Figure 2.4 The SWOT analysis


    ![image-8XA0ULOA.jpg](images/image-8XA0ULOA.jpeg)


    The output from the `SWOT` analysis, an action plan, can be used to take advantage
    of opportunities and mitigate risks. The action plan can be used to learn from
    experience as the project progresses.


    With `PESTLE` analysis, organisations can gain a comprehensive understanding of
    the external factors influencing AI risks and opportunities. This analysis enables
    organisations to develop strategic plans and risk management strategies that account
    for the broader context in which AI operates, ensuring alignment with regulatory
    requirements, societal expectations and environmental considerations while maximising
    the benefits of AI adoption. This is shown schematically in Figure 2.5.


    `Cynefin`, shown schematically in Figure 2.6, provides a structured framework
    for understanding and managing AI risks by acknowledging the complexity and uncertainty
    inherent in AI systems.


    Figure 2.5 The PESTLE analysis


    ![image-L5G0IKQ3.jpg](images/image-L5G0IKQ3.jpeg)


    Figure 2.6 Cynefin


    ![image-C35H88OR.jpg](images/image-C35H88OR.jpeg)


    The `Cynefin` framework was developed by David J. Snowden in 1999. It aims to
    help leaders understand that every situation is different and requires a unique
    approach to decision-making. The framework outlines five situational domains that
    are defined by cause-and-effect relationships. By categorising risks based on
    their nature and context, organisations can tailor their risk management strategies
    and responses accordingly, leading to more effective risk mitigation and decision-making
    in the realm of AI. In addition, `Cynefin` helps the domain expert and AI experts
    to assess if narrow AI can help. Narrow AI focused on a well-defined task can
    be assessed more readily in the clear domain. The complicated domain requires
    more careful consideration of how narrow AI can help; the domain expert will play
    a pivotal role in this domain. In the complex domain, the management approach
    must embrace experimentation, adaptive approaches and scenario planning to navigate
    uncertainties. It will use techniques such as simulation, modelling and scenario
    analysis to understand potential risks and develop agile responses as situations
    evolve. This could involve more sophisticated AI based on domain expert simulations,
    or, as Brooks described, it will more than likely include essential complexity.


    ## 2.3.2.2 Human-centred AI


    Human-centred AI (`HCAI`) is an approach to designing and deploying AI systems
    with a primary focus on enhancing human capabilities, ensuring meaningful user
    control and promoting human values. `HCAI` aims to create AI technologies that
    are not only technically effective but also socially and ethically responsible.


    The key principles of `HCAI` are:


    - **User empowerment**: AI systems should empower users by augmenting their abilities
    and supporting their goals rather than replacing human roles. The aim is to create
    tools that enhance human decision-making, creativity and problem-solving.

    - **Transparency and explainability**: AI systems should be transparent about
    how they operate and make decisions. Explainable AI (`XAI`) techniques are often
    employed to ensure that users can understand, trust and appropriately manage the
    AI’s outputs.

    - **Ethical considerations**: `HCAI` emphasises the ethical implications of AI,
    including fairness, accountability and mitigation of biases. It seeks to design
    AI systems that respect user privacy, ensure data security and promote equity.

    - **Usability and user experience (UX)**: the design of AI systems should prioritise
    usability and `UX`, ensuring that they are intuitive, accessible and responsive
    to user needs. This includes iterative testing and refinement based on user feedback.

    - **Collaboration and interaction**: `HCAI` focuses on fostering effective collaboration
    between humans and AI systems. It encourages designs that facilitate smooth interaction,
    where AI systems act as cooperative partners rather than autonomous agents.


    ## 2.4 SUMMARY


    This chapter has focused on the ethical considerations and governance frameworks
    essential for the responsible development and deployment of AI systems. It has
    underscored the importance of a human-centric ethical purpose, ensuring that AI
    aligns with human values, rights and societal wellbeing. AI ethics, which revolve
    around transparency, accountability and fairness, are vital for preventing biases,
    privacy violations and unintended harm.


    The chapter has introduced key ethical questions related to AI, such as responsibility,
    human rights and the challenges posed by advanced AI systems, for example `AGI`.
    It has highlighted the importance of ethical frameworks and governance, referencing
    guidelines from the `EU` and organisations such as the `ISO`. The `EU`’s `AI Act`
    has been discussed as a pioneering regulatory framework aimed at ensuring that
    AI respects fundamental rights and promotes transparency and safety.


    The chapter has also explored AI governance, which involves setting standards
    for data usage, algorithmic fairness and decision-making to build trustworthy
    AI systems. Additionally, the chapter reviewed efforts by various countries, including
    the `US`, Japan, Canada and the `UK`, in setting ethical AI standards, stressing
    that ethical AI must be part of a broader regulatory and risk management strategy
    to prevent potential harms.


    Finally, ethical concerns such as bias, transparency and the societal impact of
    AI have been explored, emphasising that a human-centred approach is necessary
    for developing AI systems that enhance human capabilities and align with societal
    values. The chapter concluded by discussing risk management frameworks, such as
    `SWOT` and `PESTLE` analyses, and the role of regulation in balancing innovation
    with the need for safety.

