  trans: "\n\n### 4.1.1.5 数据可视化\n\n机器学习中的数据可视化是通过图形化表示数据，以帮助理解模式、趋势和洞察的过程。它在机器学习项目的每个阶段都具有无价的价值。它涉及创建图表、图形、热力图和点图等视觉上下文，使复杂的数据更易于获取和理解。\n\
    \n在数据探索期间，可视化有助于识别数据中的分布、离群值和关系，引导特征选择和特征工程。在预处理阶段，它有助于检测异常、缺失值和必要的转换。在模型评估期间，混淆矩阵、受者工作特征曲线（ROC\
    \ 曲线）和精确率-召回率等可视化工具有助于评估性能指标并理解模型行为。\n\n有效的数据可视化确保了结果沟通的更加清晰，使数据科学家、利益相关者和决策者理解机器学习模型及其底层数据的影响。将原始数据转换为视觉格式可以简化大型数据集和预测模型中固有的复杂性，有助于做出决策和更直观的洞察。\n\
    \n### 4.1.1.6 常见的数据可视化方法\n\n数据的视觉化表示是关注人工智能或机器学习可以增强你组织和展示数据方式的一个领域。良好可视化的优势必须是优先考虑的，因为最终，客户、利益相关者和/或用户将根据部署的\
    \ AI 或结果的展示来评价我们。可视化是团队中每个人从经验中学习的根本推动因素。图 4.1 显示了机器学习项目的阶段，并强调了可视化如何帮助在每个阶段从经验中学习（见第\
    \ 4.2.2 节中 Géron 的八个阶段）。\n\n图 4.1 可视化是机器学习项目每个阶段的从经验中学习\n\n![image-RUBV8K7H.jpg](img/image-RUBV8K7H.jpeg)\
    \ \n\n如果我们能从项目开始就对数据进行可视化，就能放大我们的学习——一画胜千言。此外，我们已经在组织数据了，以便我们管理和使用它们。如果我们处于一个高度监管的行业，那么早期与利益相关者和监管机构的接触可能有助于工作和结果的接受。如果我们提醒自己会遇到的数据类型——结构化、非结构化和半结构化数据——那么我们需要重视这些类型以及我们如何可视化它们。\n\
    \n值得注意的是，`Python` 是计算机和数据科学家最常用的机器学习编程语言（`Python`, 2019）。对此的解释通常是由于 `Python` 的交互性本质。此外，我们经常在数据可视化软件中看到数据流水线。通常，`Python`\
    \ 是这些软件软件包中的脚本语言，用于自动化标准任务；`SciKit-learn` 和 `TensorFlow` 都将 `Python` 作为编码语言（`Scikit-learn.org`,\
    \ 2024）。`TensorFlow` 还通过其他语言（如 `C++` 和 `Swift`）扩大其机器学习库的访问范围（`TensorFlow`, 2019）。\n\
    \n图 4.2 显示了一些典型的数据可视化类型。第一行（a–c）是在电子表格中可能遇到的数据图形。中间行是等值线图（iso-contour plot），可能是地图上的高度图。左侧的图像是等值面（d）；从等值线我们可以构建出\
    \ 3D 等值面（e）。通过一些矢量微积分，我们还可以计算梯度并可能找到最大和最小高度。如果我们绘制的数据是神经网络（`NN`）的学习率或业务活动的利润，这些想法将非常强大。我们可以关注快速的学习率或使利润最大化。示例的最后一行（f\
    \ 和 g）是网络；这些是更复杂的视觉化结构。在这里，立体视觉、增强现实或虚拟现实等技术可以提供帮助。即使是大显示器（如动力墙），也能为我们展示的数据提供不同的视角。\n\
    \n这些类型的数据可视化技术已经存在了几十年，我们计算机上的软件允许我们创建它们。然而，当我们转向来自仿真或大数据的数据时，我们需要并行数据处理能力。`ParaView`\
    \ (`www.paraview.org`）是一个以 `Python` 为核心的并行数据可视化生态系统。它基于`Visualization Toolkit`开源\
    \ 3D 图形图像处理和可视化软件库构建，并设计在并行计算机上运行，因此可以处理大型数据集并产生单个用户看到的图形。这是处理大型数据集时的一个重大挑战——在并行计算机上处理大型数据集不应该在你的第一个项目中尝试。\n\
    \n大多数笔记本电脑和桌面电脑都是多核多处理器机器，配备图形处理单元（`GPUs`），它们具有足够的处理能力来学习和开发机器学习/人工智能。一旦在小型硬件上通过测试，你就可以逐渐在高性能计算系统上使用更大的处理能力。\n\
    \n图 4.2 标准数据可视化示例：(a)折线图，(b)散点图，(c)直方图，(d)等值线图，(e)3D 等值线图，(f)网络图和(g)3D 网络图\n\n\
    ![image-3NIWV7C8.jpg](img/image-3NIWV7C8.jpeg) \n\n我们很的是大多数开源软件都可以为常见的操作系统进行编译，或者已经编译好了。你最初可以在你自己的硬件上工作，使用与你在更大型硬件设置上使用的相同的软件。我们也很幸运既有开源软件也有商业软件可以借鉴。两者都有优缺点，你需要考虑自己需要什么。在你最喜欢的搜索引擎上进行搜索将列出周围许多数据可视化包的列表。\n\
    \n我们知道可视化是从经验中学习的重要辅助，但还有一个额外的想法可能是我们可以纳入：我们能创建一个学习环境吗？我们能开发一个虚拟现实（`VR`）或增强现实（`AR`）仿真环境，让我们从中学习或让人类教导\
    \ AI 系统吗？我们在上一章中提到，人工智能机器人给了我们探索和利用极端环境的机会。我们可以构建仿真环境来生成设计和操作机器人的数据吗？我们可以构建一个学习环境让机器人学会如何执行任务吗？\n\
    \n`Blender` 是一个开源软件，具有用于构建仿真和展示数据的高级环境（见图 4.3）。它的图形能够产生写实的渲染和电影。这通常是电脑游戏、电影和科学可视化的基础。如果我们将其扩展到机器学习和人工智能，我们可以建立一个人机环境，机器和人类在其中互动相互教学。这种例子出现在工程领域，操作员在那里学习如何操作机器，飞行员在安全环境中学习飞行。我们总是受到从经验学习的引导，学习环境可以用于生成数据。\n\
    \n图 4.3 构建仿真环境的开源软件——`Blender` (https://commons.wikimedia.org/wiki/File:Blender_2.90-startup.png,\
    \ Creative Commons Attribution-Share Alike 4.0 International licence)\n\n"
