- raw: 'Human intelligence has led us through the various industrial revolutions.
    We are in the middle of the fourth, but what does this mean if we think about
    AI? It means increasingly that we will have more robots doing routine, monotonous,
    laborious and dangerous tasks – doing the ‘heavy lifting’. This introduces the
    idea of humans and machines working together at what they are each good at.


    ## 1.2 WHAT ARE ETHICS AND TRUSTWORTHY AI?


    AI is part of the ethics of how we operate as individuals, as organisations and
    in the wider context of the universe. At its core are our ethical principles,
    rights and values. Ethics brings unique challenges for philosophers and academics,
    in particular the ethical implications of AI challenging our freewill or agency,
    perhaps even having access to conscious capabilities. We’ll explore what this
    means in more detail in Chapter 2. The past decade has seen a movement towards
    trustworthy AI, capturing the spirit of Ada Lovelace (Wikipedia Contributors,
    2024a), who questioned the implications of technology on society, and more recently
    academic works from Stuart Russell and AI’s human compatibility (Russell, 2019)
    and Max Tegmark’s idea in Life 3.0 (2018) to let humans set the goals as well
    as designing the AI fire extinguisher before we start the AI fire. The culmination
    of this pioneering work has seen progress towards the EU’s law, The Artificial
    Intelligence Act, and AI having a human-centric ethical purpose that is technically
    robust and trustworthy (European Parliament, 2023). International standards give
    us a broad range of literature to draw on, and we’ll add more detail on this in
    Chapter 2.


    The world of AI is constantly changing, and the rate of change is not linear;
    you may not have noticed, but it is actually growing exponentially, which basically
    means it is accelerating faster and faster on an annual basis. Some would argue
    that its growth is potentially out of control and we need to put the brakes on
    (Future of Life, 2023); others suggest that we just let it run and see where it
    goes.


    Many people have fears that not all AI improvements are necessarily beneficial
    to humankind or in society’s best interests. For example, there is the potential
    to weaponise AI, for it to intrude into our lives and privacy by listening and
    watching everything, and for individuals’ identification without consent with
    covert AI systems. There is also the potential to have control of our personal
    data taken away from us. So, how should AI be managed and controlled? Or, what
    happens if we try to do the right thing – whatever that means – and we get it
    wrong?


    On a day-to-day practical level, we are using narrow AI that works on a well-engineered
    or well-defined task.


    ## 1.2.1 AI as part of universal design


    The concept of universal design was coined by the architect Ronald Mace, and is
    the design and composition of an environment so that it can be accessed, understood
    and used to the greatest extent possible by all people. For example, door handles,
    elevator controls and light switches should be designed for use by all people
    regardless of their age, size, ability or disability. A consideration, therefore,
    for any new AI service, system or product is that it is designed for all.


    Incorporating the potential of AI in universal design can allow someone who is
    visually impaired to ask a ‘home assistant’ what the weather is like, or for someone
    who is physically incapacitated to turn on the heating, or someone who is travelling
    home to turn on the heating while travelling. This is an exciting area where AI
    can bring superhuman capabilities to everyone.


    A human working alongside an intelligent AI-enabled machine has the capability
    to do a lot more, whether that is in a work environment reducing physical risk
    or exertion, or on a personal basis educating us or translating our conversations.
    AI systems have the potential to make us more human.


    Our efforts and endeavours developing AI-enabled products, systems and services
    should be focused on allowing us to be more human, improving us as humans (improving
    our physical and mental performance or by making us more active) or improving
    our ability to communicate or socialise.


    The continual emergence of AI systems and products means that we as individuals
    and as part of wider society are going to have to reimagine every area of our
    lives to use AI in a positive way for all.


    ## 1.2.2 The impact of AI on society


    How will AI change our society? We need to consider what implications AI will
    have on wider society now and in the long term, and what freedoms and human values
    we are prepared to give up in return for the benefits we will enjoy. Increased
    use of AI and wider adoption will come with some risks and challenges, such as
    the potential of its weaponisation, but it may also solve climate change and world
    poverty. How can we balance the risks versus the benefits?


    As a society, we need to start preparing now for how we manage AI today and in
    the future. For example, would you be prepared to give up your job to an AI entity
    but in return receive a basic universal income? Maybe, but would you be prepared
    to give up your child’s future career dreams and aspirations for short-term gains
    here and now? What happens if we charge off with the aim of utopia and get it
    wrong?


    We have previously talked about how AI will affect us as individuals in our workplace
    by improving efficiencies and augmenting what we do and are capable of. Of course,
    our human-centric ethical purpose can be used to mitigate disadvantages that affect
    us in our everyday lives, removing inequalities and allowing us to become more
    human, undertaking tasks that involve creativity and empathy, among others, in
    particular, helping to remove bias and improve sustainability and equality of
    outcome.


    ## 1.2.3 Sustainability and environmental impact


    Intergenerational equity is the concept or idea of fairness or justice in relationships
    between generations. It is often considered as a value concept that focuses on
    the rights of future generations. It describes how each future generation has
    the right to inherit the same level of diversity in natural and cultural resources
    enjoyed by previous generations, and equitable access to the use and benefits
    of these resources. A common example often quoted is current generations running
    up debt that will have to be paid off by future generations to come.


    The study of intergenerational equity and view of sustainability is based on three
    pillars: economic, social and environmental (see Figure 1.2).


    Economic – many economists have tried to predict the effect that AI will have
    on the economy. PwC forecast in 2017 that AI could contribute up to US$15.7 trillion
    to the global economy in 2030 (Rao and Verweij, 2017), more than the current output
    of China and India combined. Of this, US$6.6 trillion is likely to come from increased
    productivity and US$9.1 trillion is likely to come from consumption-side effects.


    Social – during the 1970s in the UK, whole communities felt the impact of large
    organisations closing down operations, including airlines, dockyards and mines.
    AI brings with it big headlines of major disruption and potential job losses.
    In an era of humans and machines, the possibility exists for humans to move onto
    higher value work or to enrich and develop their talents while machines take away
    the heavy lifting, reducing the burden on human effort. Sustainability is part
    of the EU’s AI guidelines, in particular the human-centric ethical purpose. It
    is essential, therefore, that assessing the impact of AI on society is a part
    of that.


    Environmental – the AI carbon footprint most certainly has an environmental impact,
    which needs to be factored into its business case. Donna Lu suggested in a 2019
    article in New Scientist that ‘Creating an AI can be five times worse for the
    planet than a car’ (Lu, 2019).


    Figure 1.2 The three pillars of sustainability'
