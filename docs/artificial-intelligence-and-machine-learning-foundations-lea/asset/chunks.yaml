    - the link between the `NN` and the AI agent;

    - the basic building blocks of the `NN`;

    - building algorithms using reinforcement learning; and

    - a few basic examples of what a `NN` can do.


    The `NN` gives machines the ability to learn from experience and develop their
    own algorithms (it is not easy to interpret what these algorithms are, as they
    are encoded in the `NN`). In recent years, our understanding on how a `NN` works
    has made significant progress. Progress includes winning complex strategy games
    such as chess and Go, as well as the perhaps more challenging tasks of controlling
    complex machinery such as robots. In doing so we are giving machines more autonomy.


    There are many types of `NN` available to us, and one that stands out as having
    made a significant contribution to `ML` is the `CNN`. However, we are not going
    to go into detail about this type of `NN` here because the details are more complicated
    than the discussion we intend to have at this point.


    To learn from problems that are complex and perhaps random (statistical), we need
    to use deep neural networks (`DNNs). Typically, we employ `DNNs` for problems
    such as robot control, image analysis (e.g. medical images) and adversarial game
    playing. We will introduce what these are and why this makes training them iterative
    and requires specialist hardware (e.g. high-performance computers, `GPUs`, etc.)
    as we progress through the chapter. A `DNN` has many layers making up the `NN`;
    this is why it is called a deep `NN`.


    ### 4.2.3.7 The link between NNs and the AI agent


    The `NN` is often shown as a sub-topic of `ML`. The development of the `NN` started
    in the 1940s and is based on the biological nature of the human brain. In 1943
    Warren McCulloch and Walter Pitts introduced the concept of a neuro-logical network
    by combining finite state machines, linear threshold decision elements and memory
    (McCulloch and Pitts, 1943), followed in 1947 by a paper extending these ideas
    to the recognition of patterns (Pitts and McCulloch, 1947). The first reinforcement
    `NN` built by Marvin Minsky occurred in 1951. This was an analogue or electronic
    device that used reinforcement to learn (Minsky and Papert, 1988). This was the
    start of adaptive control, and we see a close link to engineering emerging. In
    1962 Frank Rosenblatt named and defined machines called ‘Perceptrons’ (Rosenblatt,
    1962); however, it took until the 1980s for `NNs` to gain significant traction.
    Today the theory is understood in greater depth. Digital computers have facilitated
    the use of `CNN` to undertake sophisticated tasks such as learning to control
    robots and win combinatorically complicated games.


    The learning AI agent needs the ability to learn. Reinforcement `DNNs` or `CNNs`
    do just that. They can learn from sensors and actuators or from well-engineered
    computer simulations or games.


    Narrow AI has been focused on specific problems. The `NN` is a more generic learning
    technique that can be applied to a wider range of scenarios. Training `NNs` is
    not easy, and understanding their output is difficult also. This poses challenges
    for justifying them and using them.


    ### 4.2.3.8 The basic building blocks of the neural network


    In this section we introduce the concept of learning that is fundamental to `NNs`.
    The perceptron was the initial concept from which our more sophisticated `NNs`
    of today evolved. As we build up the basic building blocks of the `NN`, we will
    see how the perceptron fits in.


    The `NN` has a basic mathematical schematic, shown in Figure 4.6 and based on
    the original work of McCulloch and Pitts in 1943. In this figure, we also see
    a simple representation of a human brain neuron.


    Each of these `NN` neurons form layers (lots of neurons), and multiple (hidden)
    layers make up a network. The first layer is the input layer where data are fed
    into the network. The data can be output from a simulation, the colour of pixels
    in an image or data from sensors. The data pass through the network, and as they
    do, just like the human brain, neurons are activated (or fire). A simplified three-layer
    version of a `NN` is shown in Figure 4.7.


    Figure 4.6 The schematic of a neural network neuron and a human brain neuron (McCulloch
    and Pitts, 1943; https://commons.wikimedia.org/wiki/File:Neuron3.png, Creative
    Commons Attribution-Share Alike 3.0 Unported licence)


    ![image-LM7ASPHZ.jpg](images/image-LM7ASPHZ.jpeg)


    There can be any number of layers, and `DNNs` have lots of layers. Unfortunately,
    we do not know what number of layers, or depth of `DNN`, we need before we start
    training the `NN`. That is something we learn from experience as the trainer,
    and part of the hyper-parameters that we will systematically learn from. In this
    description we have been careful to use only feedforward networks where the input
    of the node is passed onto the next layer. `RNNs` also allow nodes to communicate
    with other nodes and themselves on the same layer. These types of network are
    described as more dynamic and can behave chaotically. We will stick with the feedforward
    `NNs` here, as we are building an intuition or understanding.


    Figure 4.7 The schematic of a neural network with an input, hidden and output
    layer. In `NNs`, a neuron is a node in the network and the node is made up of
    an input and activation function and an output. Nodes are connected via links
    (https://commons.wikimedia.org/wiki/File:Colored\_neural\_network.svg, Creative
    Commons Attribution-Share Alike 3.0 Unported licence)


    ![image-1ML095CI.jpg](images/image-1ML095CI.jpeg)


    `NNs` work by taking the output (if it is activated) from nodes and passing this
    information via a link. The link connects the output of a node to the next layer.
    Each link from the output of a node is uniquely weighted as it is passed to other
    nodes. We do not know what these weights are, and training is about determining
    what they should be.


    An example might help here. Say we have a high resolution picture of a scene taken
    on your smartphone – the type of picture doesn’t matter. We can analyse this picture
    using a `NN`. The picture is held on your phone as a matrix of numbers that represent
    the colour of the image at a particular location. The `NN` takes this matrix as
    its input and passes this number to every node on the first layer. Before it does
    so, it weights it by a unique weight between the input node and the layer node
    it is going to. Each node on the first layer then adds up the colour number and
    weights it has received. This sum of weighted input colour numbers is then passed
    through the activation function. If the output of this operation is greater than
    a set value, the node is assumed to be activated and the result is passed onto
    the next layer. If it is not activated, then this node is not activated, and its
    output is zero.

