    Whether a node is activated or not is determined by the activation function. The
    activation function uses the input function as its input. This input function
    is the sum of the output of nodes connected by the links multiplied by the weights
    of the links between the nodes. We then need to determine if the node is activated.
    If a hard threshold (activation function output is above a set value) is used,
    then this is a perceptron. These types of NN can represent non-linear problems
    that are Boolean in nature. The sigmoid perceptron uses a differentiable sigmoid
    activation function, and this means DNNs can now represent arbitrary functions,
    again non-linear. This makes them very powerful. The threshold activation function
    is a hard step change between the neuron activating or not. The sigmoid (logistic)
    activation function is differentiable and is called softer because the decision
    to fire the node is not a step change. There are other types of activation function,
    for which use is determined by the experience of the trainer.


    The trainer needs to train the NNs to determine the unknown weights of each of
    the links. This is not a simple task, and a role of the future for AI personnel.
    Training a NN involves adjusting weights in order for the NN to improve. Techniques
    involve forward and back propagation to update weights based on the error between
    the desired output and the NN’s output. Knowledge of vector calculus will help
    here, and a NN domain expert will help too. Up to now we could simplify the NNs
    as ones that can understand functions, given examples of what those functions
    are. We could use a NN to learn from examples that we know. This makes the error
    known. What happens when we do not have labelled examples to learn from? We could
    build learning examples and try to form labels from our understanding of the NN.


    What happens if our problem has lots of unknown combinations – such as a game
    with many possible moves? We simply may not have the data to understand all the
    possible moves. We need to measure, somehow, the performance of the NN. This is
    called reinforcement learning, and the NN can learn by itself. Reinforcement learning
    fits naturally with the learning agent schematic. The agent has a learning component,
    and the learning component tries to maximise its reward or minimise its loss.
    Norvig and Russell (2016) note that reinforcement learning might be considered
    as encompassing all of AI. In an environment, an agent will have a percept and
    will learn via the learning element to achieve a goal. It will use its actuators
    to act on the environment. This elevates products to intelligent entities and
    gives products such as robots autonomy. An agent using a NN and reinforcement
    learning has to learn how to achieve a goal in an environment. This learning is
    complex. Somehow, we need to train the NN to explore its environment, create a
    policy to achieve a goal and understand what it can do to the environment with
    its actuators.


    ### Examples of reinforcement NN successes are


    *   AlphaGo, the computer that was taught to beat the world Go champion (see Section
    1.1.2.1). The computer was so successful, it used moves that impressed Go masters.
    A supercomputer played itself at the game of Go to learn how to play. This is
    an engineered simulation environment.

    *   OpenAI, who used a NN to teach a robot how to solve a Rubik’s Cube (OpenAI,
    2019). The robotic hand can manipulate the cube to solve it because it has many
    sensors and actuators. The NN learned how to solve the Rubik’s Cube and also how
    to manipulate its environment.


    ## 4.2.3.9 Hyper-parameters, algorithms and the trade-off


    Hyper-parameters are the settings that we choose before the training process begins.
    They control how the algorithm learns. For example, the learning rate determines
    how much the weights are adjusted at each step. If the learning rate is too high,
    the algorithm might never converge. If it is too low, the training will be very
    slow. Other hyperparameters include the number of layers in a neural network,
    the number of neurons per layer, and the batch size.


    We need to measure, somehow, the performance of the NN. This is called over-fitting
    and under-fitting. Over-fitting occurs when the NN learns the training data too
    well, including the noise and random fluctuations. This leads to poor performance
    on new, unseen data. Under-fitting, conversely, occurs when the NN is too simple
    to capture the underlying patterns in the data. This also results in poor performance
    on both the training and test data.


    The balance between over-fitting and under-fitting is a key challenge in machine
    learning. We aim to find the sweet spot where the model generalizes well to new
    data. This is often achieved using techniques such as cross-validation, regularization,
    and adjusting the hyperparameters.

