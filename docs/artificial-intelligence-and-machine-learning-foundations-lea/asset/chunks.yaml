    ### Personalised learning

    - **Adaptive learning platforms**: platforms such as `Khan Academy` and `Coursera`
    use AI to create personalised learning paths for students based on their strengths,
    weaknesses and learning pace. These systems adjust content and exercises to match
    individual learning needs.

    - **Intelligent tutoring systems**: AI-powered tutoring systems such as `Carnegie
    Learning` provide real-time feedback and personalised tutoring to students, helping
    them to understand complex concepts and improve their skills.


    ### Automated grading and assessment

    - **Automated essay scoring**: AI tools such as `Grammarly` and `Turnitin’s Revision
    Assistant` use `NLP` to evaluate and grade written assignments, providing instant
    feedback on grammar, structure and content.

    - **Multiple-choice and short-answer grading**: systems such as `Gradescope` automate
    the grading of multiple-choice and short-answer tests, significantly reducing
    the time educators spend on grading.


    ### Virtual assistants and chatbots

    - **24/7 student support**: AI chatbots such as `IBM’s Watson Education` provide
    students with instant answers to their questions, assist with administrative tasks
    and offer study tips, enhancing student support services.

    - **Virtual teaching assistants**: AI teaching assistants such as `Georgia Tech’s
    ‘Jill Watson''` help to answer student queries and manage routine tasks, allowing
    human instructors to focus on more complex issues.


    ### Content creation and curation

    Platforms such as `Smart Sparrow` recommend additional resources and aim to create
    a more personalised, engaging and effective learning experience, ensuring that
    each student receives the support they need to succeed.


    ### Learning analytics and insights

    - **Student performance tracking**: AI-driven analytics platforms such as `Brightspace
    Insights` track student performance and engagement, providing educators with actionable
    insights to improve teaching strategies and student outcomes.

    - **Predictive analytics**: AI systems predict student success and identify at-risk
    students by analysing data on attendance, participation and grades, allowing for
    early interventions and support.


    ### Language learning

    - **AI language tutors**: apps such as `Duolingo` use AI to provide personalised
    language lessons, adapt to user proficiency levels and offer instant feedback
    on pronunciation and grammar.

    - **Real-time translation**: AI-powered translation tools such as `Google Translate`
    offer real-time translation and language practice, supporting multilingual education
    and communication.


    ### Enhanced classroom experiences

    - **Interactive learning environments**: AI-powered tools such as `Classcraft`
    create interactive and gamified learning experiences, engaging students and enhancing
    classroom participation.

    - **AR and VR**: AI integrates with `AR` and `VR` to create immersive educational
    experiences, such as virtual field trips and interactive simulations, enriching
    the learning process.


    ### Administrative efficiency

    - **Automated administrative tasks**: AI systems streamline administrative processes
    such as enrolment, scheduling and attendance tracking, freeing up time for educators
    and administrators to focus on teaching and student support.

    - **Resource management**: AI optimises resource allocation, such as classroom
    space and equipment usage, ensuring efficient use of educational resources.


    ### 6.2.6.6 Manufacturing

    Manufacturing is driven by ethical principles, and at its core is the scientific
    method. There appears to be a natural fit for AI. Areas where AI is used in manufacturing
    are set out in Table 6.10.


    #### Table 6.10 Uses of AI in manufacturing


    | Manufacturing area | Example |

    | --- | --- |

    | Predictive maintenance | **Equipment monitoring**: AI systems analyse data from
    sensors on machinery to predict when equipment is likely to fail, allowing for
    maintenance to be performed just in time. Companies as `Siemens` use AI-driven
    predictive maintenance to minimise downtime and extend equipment life. |

    | Quality control and inspection | **Automated visual inspection**: AI-powered
    computer vision systems inspect products during the manufacturing process, ensuring
    high quality. For instance, companies such as `IBM` use AI to detect defects in
    semiconductor manufacturing. |

    | Supply chain optimisation | **Demand forecasting**: AI models predict future
    demand for products by analysing historical sales data, market trends and external
    factors. This helps manufacturers to optimise inventory levels and production
    schedules. `Amazon` and `Walmart` use AI for logistics optimisation to optimize
    routing and scheduling, reducing transportation costs. |

    | Robotics and automation | **Collaborative robots (cobots)**: AI-powered cobots
    work alongside human workers to perform repetitive and physically demanding tasks,
    enhancing efficiency and safety. `Universal Robots` and `FANUC` are examples of
    companies using cobots in manufacturing. **Automated guided vehicles (AGVs)**:
    AI-driven `AGVs` transport materials and products within manufacturing facilities,
    optimising workflow and reducing manual handling. |

    | Process optimisation | **Production scheduling**: AI systems optimise production
    schedules based on real-time data and constraints, improving throughput and reducing
    lead times. `GE` uses AI for optimising manufacturing processes. **Energy management**:
    AI monitors and optimises energy consumption in manufacturing plants, reducing
    costs and environmental impact. `Siemens’` AI systems help to manage energy use
