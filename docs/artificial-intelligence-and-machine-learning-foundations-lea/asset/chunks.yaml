- raw: 'User-centred design in HCAI involves designing AI systems with a deep understanding
    of the end-users’ needs, preferences and contexts. This approach incorporates
    user feedback throughout the development process to create more intuitive and
    effective AI solutions (see Table 6.4).


    Table 6.4 Human-centred AI importance and example


    | ^(Importance) || ^(Example) |


    | --- | --- |


    | ^(Enhanced usability – AI systems that are easier to use and understand, leading
    to higher adoption rates and user satisfaction. Tailored experiences – personalised
    interactions and functionalities that cater to individual user needs and preferences.
    Reduced errors – by considering user behaviour and cognitive load, systems are
    less prone to user errors.)  || ^(In developing a personal health app, UCD ensures
    the app’s interface is intuitive, provides relevant health insights and supports
    users in managing their health effectively.) |


    HCAI is an approach to designing and deploying AI systems with a primary focus
    on enhancing human capabilities, ensuring meaningful user control and promoting
    human values. HCAI aims to create AI technologies that are not only technically
    effective but also socially and ethically responsible.


    The key principles of HCAI are:


    User empowerment – AI systems should empower users by augmenting their abilities
    and supporting their goals rather than replacing human roles, and the aim is to
    create tools that enhance human decision-making, creativity and problem-solving.


    Transparency and explainability – AI systems should be transparent about how they
    operate and make decisions, for example XAI techniques are often employed to ensure
    that users can understand, trust and appropriately manage the AI’s outputs.


    Ethical considerations – HCAI emphasises the ethical implications of AI, including
    fairness, accountability and mitigation of biases. It seeks to design AI systems
    that respect user privacy, ensure data security and promote equity.


    Usability and UX – the design of AI systems should prioritise usability and UX,
    ensuring that they are intuitive, accessible and responsive to user needs. This
    includes iterative testing and refinement based on user feedback.


    Collaboration and interaction – HCAI focuses on fostering effective collaboration
    between humans and AI systems. This encourages designs that facilitate smooth
    interaction, where AI systems act as cooperative partners rather than autonomous
    agents.


    What HCAI does:


    Enhances human abilities – by providing tools that support human tasks, HCAI systems
    help users to achieve better outcomes, for instance AI can assist doctors in diagnosing
    diseases, support artists in creating new works or aid workers in optimising productivity.


    Improves decision-making – HCAI systems provide users with insights, recommendations
    and data analyses that support informed decision-making. These systems are designed
    to present information in a way that is easily understandable and actionable.


    Promotes trust and reliability – through transparency and explainability, HCAI
    fosters user trust in AI systems, for example users are more likely to rely on
    AI tools if they understand how decisions are made and can see the rationale behind
    AI-driven recommendations.


    Supports ethical use – HCAI ensures that AI technologies are developed and used
    responsibly, and incorporate ethical guidelines to avoid harm, ensure fairness
    and respect user rights, thereby contributing to public good and trust in AI technologies.


    Facilitates human–AI collaboration – by designing AI systems that work seamlessly
    with humans, HCAI encourages collaborative problem-solving and innovation. This
    includes interfaces and interaction models that allow users to effectively guide
    and control AI processes.


    Applications of HCAI are:


    Healthcare – AI systems that assist clinicians by providing diagnostic suggestions,
    treatment recommendations and patient monitoring while ensuring the clinicians
    retain control over final decisions.


    Education – personalised learning systems that adapt to individual student needs
    and provide tailored educational experiences while supporting teachers in their
    instructional roles.


    Workplace productivity – AI tools that help workers manage tasks, optimise workflows
    and improve efficiency without overshadowing human judgement and expertise.


    Consumer technology – user-friendly AI in smartphones, smart homes and other consumer
    devices that enhance daily life by providing useful and easily controllable features.


    HCAI represents a shift from viewing AI as a replacement for human labour to seeing
    it as a partner that enhances human capabilities. By prioritising user needs,
    ethical considerations and collaborative interaction, HCAI aims to create AI systems
    that are not only powerful and efficient but also trustworthy, transparent and
    aligned with human values.


    ## 6.2.5 Modelling human behaviour in interactions with AI


    Several specialised models and frameworks have been developed for modelling human
    behaviour in interactions with AI. These models draw from psychology, human–computer
    interaction (HCI), cognitive science and behavioural economics. Here are some
    prominent ones:


    Human–AI interaction models


    Computational cognitive models: simulate human thought processes to predict how
    users will interact with AI systems. Examples include ACT-R (adaptive control
    of thought – rational) and SOAR (state, operator and result).


    User modelling: focuses on creating representations of user preferences, skills
    and behaviours to personalise interactions. Techniques include demographic models,
    psychographic models and behaviouristic models.


    Behavioural economics and decision-making models


    Prospect theory: describes how people make decisions based on perceived gains
    and losses rather than final outcomes, which can be used to design AI systems
    that align with user expectations.


    Nudge theory: proposes subtle changes in the environment or context to influence
    user behaviour in a predictable way without restricting options.


    HCI models


    The model human processor (MHP): a framework that describes human interaction
    with systems in terms of perceptual, cognitive and motor processors.


    GOMS model (goals, operators, methods and selection rules): analyses the user’s
    cognitive structure and processes in the context of HCI tasks.


    Norman’s interaction cycle: describes the stages of interaction between users
    and systems, focusing on how users form goals, execute actions and interpret feedback.


    Trust and transparency models


    Trust in automation: examines factors that influence user trust in AI systems,
    including transparency, reliability and user experience.


    XAI models: focus on making AI decisions understandable to users to increase trust
    and facilitate better interaction.


    Affective computing models


    Emotion recognition and response: systems designed to detect and respond to human
    emotions, enhancing user experience and engagement. Techniques include facial
    expression analysis, voice tone analysis and physiological signal detection.


    Social and collaborative interaction models


    Social presence theory: investigates the degree to which a person feels ‘present’
    in an interaction, which is critical for designing AI systems that engage users
    socially.


    Distributed cognition: studies how cognitive processes are shared across individuals
    and artefacts in an environment, relevant for collaborative AI systems.


    Learning and adaptation models


    Reinforcement learning for personalised systems: models user interactions to continuously
    improve recommendations and responses based on user feedback and behaviour.


    Interactive ML: involves users in the training process of the AI, where user feedback
    helps to refine the model’s predictions and behaviours.


    Ethical and reponsible AI frameworks'
