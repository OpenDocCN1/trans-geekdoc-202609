- raw: 'Hybrid Agile and waterfall project management is an approach that combines
    the structured, step-by-step processes of the waterfall model with the iterative,
    flexible practices of Agile methodologies. This hybrid model leverages the strengths
    of both approaches, using waterfall’s clear, upfront planning and well-defined
    stages for parts of the project that are stable and predictable, while applying
    Agile’s adaptability and iterative development cycles to areas that require flexibility
    and rapid feedback. This dual approach allows organisations to maintain control
    and predictability in project management while also being responsive to changing
    requirements and continuous improvement. By integrating the two methodologies,
    hybrid project management aims to maximise efficiency, mitigate risks and deliver
    high-quality results that align with both initial project scopes and evolving
    client needs.


    Hybrid projects'' key characteristics are:


    Combines Agile and waterfall: integrates elements of both Agile and waterfall
    methodologies, leveraging the strengths of each approach.


    Flexibility and structure: allows for flexibility in certain phases of the project
    while maintaining structured, sequential processes where necessary.


    Customised approach: tailors the project management approach to the specific needs
    and context of the project, balancing agility with predictability.


    Incremental delivery with fixed milestones: enables incremental delivery of project
    components while adhering to fixed milestones and deadlines.


    Its key characteristics mean that a hybrid project style is suitable for AI projects
    because:


    It deals with complex projects with mixed requirements: suitable for AI projects
    that have both well-defined and evolving requirements, allowing different parts
    of the project to use different methodologies.


    It has a balanced approach: ideal for projects that need the flexibility of Agile
    for development and experimentation, coupled with the control and documentation
    of waterfall for implementation and compliance.


    It includes stakeholder management: effective in projects where different stakeholders
    require different levels of involvement and where phased delivery is necessary.


    5.2.4.4 Selecting the appropriate project management approach for AI projects


    The most appropriate project management style depends on the objectives of the
    protect and the scale of it.


    Agile: best for AI projects that require rapid iteration, constant feedback and
    adaptability. Suitable for experimental AI solutions, ML model development and
    projects with evolving user requirements.


    Waterfall: appropriate for AI projects with stable, well-defined requirements,
    such as regulatory compliance systems, large-scale data infrastructure and projects
    with strict timelines and budgets.


    Hybrid: optimal for AI projects that need both flexibility and structure, such
    as large enterprise AI implementations, projects with multiple phases that vary
    in complexity and when balancing innovation with compliance is necessary.


    MLOps and ModelOps are frameworks that organisations have adopted to streamline
    the deployment, monitoring and maintenance of machine learning models in production.


    ## 5.3 RISK, COSTS AND GOVERNANCE


    This section makes sense of what AI governance means and the need for it. Of course,
    governance, risks and costs are context specific and relate to what you and your
    organisation currently do. Some additional areas that need to be understood for
    AI elements you are working with or incorporating are also mentioned.


    ## 5.3.1 Governance activities in AI implementation


    Effective governance in an AI implementation is crucial for ensuring compliance,
    managing risks and overseeing the lifecycle of AI models. The three primary areas
    of AI governance are:


    compliance to satisfy regulations, law and standards;


    risk management frameworks to proactively detect and mitigate risks; and


    lifecycle governance to manage, monitor and govern AI.


    5.3.1.1 Compliance to satisfy regulations


    Compliance ensures that AI systems are tested and adhere to existing laws, regulations
    and standards. This area of governance addresses the following aspects:


    Regulatory adherence:


    Data protection – ensure AI systems comply with data protection laws such as GDPR,
    ensuring user data privacy and security.


    Fairness and non-discrimination – adhere to laws that prevent bias and discrimination,
    ensuring AI systems provide fair outcomes across different demographic groups.


    Transparency requirements – meet regulatory demands for transparency, making AI
    decision-making processes understandable and explainable to regulators and the
    public.


    Auditability and accountability:


    Regular audits – implement regular audits of AI systems to verify compliance with
    regulatory standards (e.g. ISO/IEC 42001) and law (e.g. EU AI Act).


    Traceability – maintain records of AI system development, data sources and decision-making
    processes to provide traceability in case of investigations or audits.


    Safety – maintain records of AI system safety.


    Ethical standards:


    Ethical guidelines – develop and follow ethical guidelines that align with industry
    standards and regulatory expectations.


    Human oversight – ensure that human oversight is embedded in critical decision-making
    processes to maintain ethical standards and accountability.


    5.3.1.2 Risks, costs and benefits analysis


    Implementing an AI project or solution involves careful consideration of various
    risks, costs and benefits. Identifying and assessing these potential factors is
    crucial for successful implementation and alignment with the organisation’s risk
    strategy. By identifying these risks, costs and benefits, and implementing appropriate
    mitigation strategies, organisations can align their AI projects with their overall
    risk strategy and ensure successful implementation. Some industries already have
    existing regulations, policies and standards for managing risk, which would need
    to be complied with (e.g. safety critical industries, nuclear, aviation, healthcare,
    etc.).


    Proactive risk management involves identifying, assessing and mitigating risks
    associated with AI systems. This area of governance includes:


    Risk identification and assessment:


    Risk frameworks – develop comprehensive risk frameworks to identify potential
    risks in AI systems, including technical, operational, ethical and legal risks.


    Impact analysis – conduct impact analysis to understand the potential consequences
    of identified risks on stakeholders and the organisation.


    Mitigation strategies:


    Bias mitigation – implement strategies to detect and mitigate biases in AI models,
    ensuring fairness and equity.


    Robust security measures – strengthen security protocols to protect AI systems
    from cyber threats and data breaches.


    Incident response plans – develop and maintain incident response plans to address
    and mitigate the effects of AI system failures or malfunctions.


    Continuous monitoring:


    Real-time monitoring – use real-time monitoring tools to continuously assess the
    performance and behaviour of AI systems.


    Feedback loops – establish feedback loops to gather input from users and stakeholders,
    allowing for timely identification and correction of issues.


    We may find various types of risk that we’ll need to manage, including:


    Technical risks:


    System failures – AI systems may fail due to bugs, errors or unforeseen conditions.


    Scalability issues – AI models might not scale well with increased data or usage.


    Integration challenges – there may be difficulties in integrating AI with existing
    systems and processes.


    Data risks:


    Data privacy and security – there might be risk of data breaches and misuse of
    sensitive information.


    Data quality – poor-quality or biased data can lead to inaccurate or unfair AI
    outcomes.


    Data availability – insufficient data can hinder the training and effectiveness
    of AI models.


