    **Logistic regression** – this is a mathematical model used in statistics and
    ML to estimate the probability of an event occurring having been given some previous
    data. Logistic regression works with some previous data.


    **Decision tree** – this is a non-parametric supervised learning method used for
    classification and regression. It uses a tree-like model where each internal node
    represents a "test" on an attribute, each branch represents the outcome of the
    test, and each leaf node represents a class label or continuous value.


    **Random forest** – this is an ensemble method for classification and regression
    that constructs a multitude of decision trees at training and outputs the mode
    or average of the classes.


    **KNN** – this is a simple, non-parametric and instance-based learning method
    used for both classification and regression.


    **SVM** – this is a supervised ML algorithm that can be used for both classification
    and regression challenges.

