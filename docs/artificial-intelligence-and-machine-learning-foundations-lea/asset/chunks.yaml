    \n# Smart Cities\n\n[https://smartcitiesworld.net/](https://smartcitiesworld.net/)\n\
    \n# International Organization for Standardization\n\n[https://iso.org/home.html](https://iso.org/home.html)\n\
    \n# GLOSSARY\n\n### Artificial intelligence (AI): Artificial intelligence refers\
    \ to systems designed by humans that, given a complex goal, act in the physical\
    \ or digital world by perceiving their environment, interpreting the collected\
    \ structured or unstructured data, reasoning on the knowledge derived from these\
    \ data and deciding the best action(s) to take (according to predefined parameters)\
    \ to achieve the given goal. AI systems can also be designed to learn to adapt\
    \ their behaviour by analysing how the environment is affected by their previous\
    \ actions.\n\nAs a scientific discipline, AI includes several approaches and techniques,\
    \ such as machine learning (of which deep learning and reinforcement learning\
    \ are specific examples), machine reasoning (which includes planning, scheduling,\
    \ knowledge representation and reasoning, search and optimisation) and robotics\
    \ (which includes control, perception, sensors and actuators, as well as the integration\
    \ of all other techniques into cyber-physical systems).\n\n### Assistive robot:\
    \ A robot designed to provide physical or cognitive assistance to a person.\n\n\
    ### Autonomy: The ability of a machine to make its own decisions.\n\n### Axon\
    \ terminals: Axon terminals are terminations of the telodendria (branches) of\
    \ an axon.\n\n### Backpropagation: A method used in artificial neural networks\
    \ to calculate a gradient required in the calculation of the weights to be used\
    \ in the network.\n\n### Bias: The deviation of the expected value of a statistical\
    \ estimate from the quantity it estimates. It can also be considered to be a prejudice\
    \ for or against something or somebody that may result in unfair decisions. It\
    \ is known that humans are biased in their decision-making. Since AI systems are\
    \ designed by humans, it is possible that humans inject their bias into the systems,\
    \ even in an unintended way. Many current AI systems are based on machine learning\
    \ data-driven techniques. Therefore, a predominant way to inject bias can be in\
    \ the collection and selection of training data. If the training data are not\
    \ inclusive and balanced enough, the system could learn to make unfair decisions.\
    \ At the same time, AI can help humans to identify their biases, and assist them\
    \ in making less biased decisions.\n\n### Big data: Data sets that are so big\
    \ and complex that traditional data-processing application software is inadequate\
    \ to deal with them.\n\n### Chatbot: An artificial intelligence program that conducts\
    \ a conversation via auditory or textual methods.\n\n### Classification: The problem\
    \ of identifying to which of a set of classes a new observation belongs.\n\n###\
    \ Clustering: Groups a set of objects in such a way that objects in the same group\
    \ are more similar to each other than to those in other groups.\n\n### Combinatorial\
    \ explosion: The rapid growth of the complexity of a problem due to the combinations\
    \ of the problem’s input parameters.\n\n### Data analysis: The process of inspecting,\
    \ cleaning, transforming and modelling data with the goal of discovering useful\
    \ information, drawing conclusions and supporting decision-making. Data analysis\
    \ involves applying various techniques, such as statistical analysis, data visualisation\
    \ and decision learning.\n\n### Data cleaning: Detects patterns, trends, relationships\
    \ and insights.\n\n### Data mining: The process of discovering patterns in large\
    \ data sets.\n\n### Data science: Uses scientific methods, processes, algorithms\
    \ and systems.\n\n### Data scrubbing: See Data cleaning.\n\n### Decision trees:\
    \ A tree-like graph or model.\n\n### Deep learning: A class of algorithms that\
    \ use multiple layers. Each successive layer uses the output from the previous\
    \ layer.\n\n### Dendrites: Branched extensions of a nerve cell that propagate\
    \ electrochemical stimulation.\n\n### Emotional intelligence or emotional quotient\
    \ (EQ): The understanding of our emotions.\n\n### Ensemble: Methods that use multiple\
    \ learning algorithms to obtain better performance than could be obtained from\
    \ any constituent learning alone.\n\n### Ethical purpose: The development, deployment\
    \ and use of AI which ensures compliance with fundamental rights and applicable\
    \ regulation. This is one of the two core elements.\n\n### Feedforward neural\
    \ network: An artificial neural network wherein connections between the nodes\
    \ do not form a cycle.\n\n### Functionality: The tasks that a computer software\
    \ program is able to do.\n\n### Hardware: The physical parts or components of\
    \ a computer.\n\n### Heuristic: A strategy derived from previous experiences.\n\
    \n### Human-centred AI (HCAI): An approach to AI development that puts humans\
    \ at the forefront by designing systems that are user-friendly, transparent, explainable\
    \ and ethically responsible. It aims to create AI that collaborates with humans\
    \ in ways that are understandable, controllable and beneficial.\n\n### Human-centric\
    \ AI: AI that emphasises enhancing and empowering human abilities by ensuring\
    \ that AI systems work alongside humans, augmenting their capabilities and supporting\
    \ decision-making. It focuses on aligning AI with human values, ethical considerations\
    \ and societal needs. Human-centric AI is more about collaboration and augmentation,\
    \ whereas human-centred AI emphasises usability, transparency and ethical design.\n\
    \n### Hyper-parameter: A parameter whose value is set before the learning process\
    \ begins.\n\n### Inductive reasoning: Makes broad generalisations from specific\
    \ observations.\n\n### Internet of Things (IoT): The network of physical devices,\
    \ vehicles, home appliances and other items embedded with electronics, software,\
    \ sensors, actuators and connectivity that enable these things to connect and\
    \ exchange data.\n\n### K-means: A clustering algorithm that partitions observations\
    \ into k clusters in which each observation belongs to the cluster with the nearest\
    \ mean, serving as a prototype of the cluster.\n\n### K-nearest neighbours: The\
    \ simplest clustering algorithm used to classify new data points based on the\
    \ relationship to nearby data points.\n\n### Layers: Neural networks are organised\
    \ into layers and a layer is a set of interconnected nodes.\n\n### Linear algebra:\
    \ The branch of mathematics concerning linear equations and functions and their\
    \ representations through matrices and vector spaces.\n\n### Logistic regression:\
    \ Used in binary classification to predict two discrete classes.\n\n### Machine\
    \ learning (ML): A subset of artificial intelligence in the field of computer\
    \ science that gives computers the ability to learn from data.\n\n### Narrow AI\
    \ or weak AI: Narrow artificial intelligence, also known as weak artificial intelligence,\
    \ is AI focused on one narrow task. It is the contrast of strong AI.\n"
  trans: "\n\n# 联合国\n\n[`un.org/sustainabledevelopment/sustainable-development-goals/`](https://un.org/sustainabledevelopment/sustainable-development-goals/)\
    \ \n\n[`un.org/en/development/desa/policy/cdp/cdp_publications/2012cdppolicynote.pdf`](https://un.org/en/development/desa/policy/cdp/cdp_publications/2012cdppolicynote.pdf)\n\
    \n# 智能城市\n\n[`smartcitiesworld.net/`](https://smartcitiesworld.net/)\n\n# 国际标准化组织\n\
    \n[`iso.org/home.html`](https://iso.org/home.html)\n\n# 术语表\n\n### 人工智能 (AI)：人工智能是指由人类设计的系统，在给定复杂目标时，通过感知环境、解释收集的结构化或非结构化数据、对从这些数据中的知识进行推理，并根据预定义的参数决定最佳行动以实现给定目标，从而在物理世界或数字世界中运行。AI\
    \ 系统也可以设计为通过分析之前的行为对环境的影响来学习并适应其行为。\n\n作为一门科学学科，AI 包括多种方法和技术，例如机器学习（其中深度学习和强化学习是特定示例）、机器推理（包括规划、调度、知识表示与推理、搜索和优化）以及机器人（包括控制、感知、传感器和执行器，以及所有其他技术集成到信息物理系统中）。\n\
    \n### 辅助机器人：为个人提供物理或认知辅助的机器人。\n\n### 自主性：机器做出自己决策的能力。\n\n### 轴末端：轴末端是轴突末树（分支）的末端。\n\
    \n### 反向传播：人工神经网络中一种方法，用于计算网络中使用的权重所需的梯度。\n\n### 偏置：统计估计的期望值与其所估计的数量之间的偏差。它也可以被认为是对对某事或某人的偏见或反对，这可能导致不公平的决策。众周知，人类在决策过程中存在偏见。由于\
    \ AI 系统是由人类设计的，人类可能会将他们的偏见注入系统，即使是无意中如此。目前许多 AI 系统都基于机器学习数据驱动的技术。因此，注入偏见的主要方式是在训练数据的收集和选择上。如果训练数据不够包容和平衡，系统可能会学会做出不公平的决策。同时，AI\
    \ 可以帮助人类识别自己的偏见，并协助他们做出较少偏见的决策。\n\n### 大数据：规模大且复杂，导致传统数据处理应用程序软件无法处理的数据集。\n\n\
    ### 聊天机器人：通过听觉或文本方式进行对话的人工智能程序。\n\n### 分类：识别新观测属于一组类别中的哪一个类别的问题。\n\n### 聚类：将一组对象分组，使得同一组内对象之间的相似性高于与其他组对象之间的相似性。\n\
    \n### 组合爆炸：由于问题输入参数的组合导致问题复杂性的快速增长。\n\n### 数据分析：检查、清洗、转换和建模数据的过程，其目的是发现有用信息、得出结论并支持决策。数据分析涉及应用各种技术，如统计分析、数据可视化和决策学习。\n\
    \n### 数据清洗：检测模式、趋势、关系和洞察。\n\n### 数据挖掘：在大规模数据集中发现模式的过程。\n\n### 数据科学：使用科学方法、过程、算法和系统。\n\
    \n### 数据擦除：见“数据清洗”。\n\n### 决策树：一种树形图或模型。\n\n### 深度学习：一类使用多层的算法。每一连续层都使用前一层的输出。\n\
    \n### 树突：神经细胞的分支延伸，传播电化学刺激。\n\n### 情感智力或情感商 (EQ)：对我们情绪的理解。\n\n### 集成：使用多种学习算法以获得比单一学习算法更好性能的方法。\n\
    \n### 伦理目的：AI 的开发、部署和使用应确保符合基本权利和适用法规。这是两个核心要素之一。\n\n### 前馈神经网络：节点之间的连接不形成循环的人工神经网络。\n\
    \n### 功能：计算机软件程序能够执行的任务。\n\n### 硬件：计算机的物理部分或组件。\n\n### 启发式算法：源自以往经验的策略。\n\n###\
    \ 以人为中心的人工智能 (HCAI)：一种 AI 开发方法，通过将人类置于核心地位，设计用户友好、透明、可解释且符合伦理责任的系统。其目标是创建以理解、可控且有益的方式与人类协作的\
    \ AI。\n\n### 以人为中心的 AI：强调通过增强和赋予人类能力，确保 AI 系统与人类共同工作，增强其能力并支持决策。它关注于将 AI 与人类价值观、伦理考量和社会需求对齐。以人为中心的\
    \ AI 更多是关于协作和增强，而以人为中心的 AI 则强调可用性、透明度和伦理设计。\n\n### 超参数：在学习过程之前设置的参数。\n\n### 归纳推理：从特定的观测得出广泛的概括。\n\
    \n### 物联网 (IoT)：物理设备、车辆、家电和其他物品嵌入电子设备、软件、传感器、执行器和连接性的网络，使这些物品能够连接并交换数据。\n\n###\
    \ K 均值类：一种聚类算法，将观测值分为 k 个簇，每个观测值属于距离均值最近的簇，均值作为该类的原型。\n\n### K 近邻：一种最简单的聚类算法，根据与附近数据点的关系对新数据点进行分类。\n\
    \n### 层：神经网络组织成层，每一层是一组相互连接的节点。\n\n### 线性代数：涉及线性方程、函数及其通过矩阵和向量空间表示的数学分支。\n\n###\
    \ 逻辑回归：用于二分类以预测两个离散类别。\n\n### 机器学习 (ML)：计算机科学领域人工智能的一个分支，赋予计算机从数据中学习的能力。\n\n###\
    \ 狭义 AI 或弱人工智能：窄人工智能（也称为弱人工智能）是指专注于单一狭窄任务的 AI。它是强人工智能的对比概念。\n\n"
