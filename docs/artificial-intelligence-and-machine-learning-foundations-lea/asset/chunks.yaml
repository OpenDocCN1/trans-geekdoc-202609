    ones are emerging in this exciting new fourth industrial revolution. Could you
    jump backwards 20, 30 or 40 years and foresee what you are doing today? Could
    you have predicted the technologies and systems we are using now? For some, the
    world we live in today is a disappointment as we were, arguably, promised an abundance
    of personal robots, flying cars and affordable spaceflight. We are still waiting
    for that to become commonplace; although, for what it’s worth, we do have a couple
    of autonomous rovers on the planet `Mars`.


    Forecasting where we will be in 2030, 2040 or even 2050 is equally as difficult,
    but we try based on current research and technology innovations that are in the
    pipeline. If you want to see different possible outcomes, Max Tegmark’s book,
    `Life 3.0 (2018)`, is an intelligent and perceptive exploration of possible AI
    futures, and Ray Kurzweil’s book, `The Singularity is Near (2016)`, is an optimistic
    look at the future.


    The are many benefits of AI. Social media frenzy, television programmes and movies
    all extol the success of possible futures of AI, but we need to be practical because
    chasing ivory-tower academic thought-leader experiments won’t bring to life the
    benefits. As we move forward, we need to be explicit and careful about what AI
    and ML can achieve.


    Paul R. Daugherty and H. James Wilson have written about their experience doing
    just that as management consultants in `Human + Machine: Reimagining Work in the
    Age of AI (2018)`. In their book, they observe how AI is applied in many projects.
    They describe human-only systems, machine-only systems and human-plus-machine
    systems. They paint a picture of how the future may look, what roles humans and
    machines will play and what humans and machines will do together. There will be
    human-only, machine-only and human-plus-machine systems.


    ## 6.1 THE ROLES AND CAREER OPPORTUNITIES PRESENTED BY AI


    In this section we will describe the human-only, machine-only and human-plus-machine
    systems, what roles these may lead to and what is already here.


    ### 6.1.1 Human-only systems


    What do humans do well?


    *   leadership and goals;

    *   creativity;

    *   empathy;

    *   judgement.


    In `Chapter 1` we marvelled at what the human being is capable of. Machines are
    some way off this – decades or perhaps centuries off. Humans are good at the subjective
    viewpoint. We are creative; for instance, only a human, in this case `Einstein`,
    could have imagined a thought experiment of `travelling\ on\ a\ light\ beam`.
    It changed our understanding and the world as we know it today.


    So, humans will be the creative powerhouse. We will let machines do the heavy
    lifting, leaving us to do the higher value work. Ambiguity is also a role for
    humans – what happens if the `AI` is stuck because of a contradiction? It is up
    to a human to step in and determine the outcome. We can think of many situations
    where human intervention might be needed (e.g. a confused dementia patient unable
    to answer questions, or an ethical 50/50 contradiction). A human who is confused
    could easily confuse an `AI` system; other humans need to be on hand to support
    that person.


    Humans must also provide the leadership; we must set the goals and the ethical
    standards. These will form principles, values and rights. We will rely on these
    in law and, where the judgement is subjective and ambiguous, it will be humans
    who do this high value work.


    ### 6.1.2 Machine-only systems


    What do machines do well?


    *   monotonous tasks;

    *   prediction;

    *   iteration;

    *   adaption.


    These four points describe what machines do well, and this is easy to see with
    digital computers. We use them to do monotonous tasks such as lots of accurate
    calculations. Predicting and iterating are useful in digital computers for the
    solution of our `ML` problems – lots of calculations, repetitive iterations, finding
    a solution. Adaption is a trait of future machines, when machines will adapt to
    the needs of the day. Machines in this sense will also adapt to extreme environments;
    these could be deep in the ocean or on other planets where humans are exposed
    to extremes. More practically, preparing food in sterile conditions or operating
    on humans in an operating theatre could be better done by machines.


    #### 6.1.2.1 Narrow (weak) AI, AGI and strong AI


    Weak or narrow AI is AI focused on a specific task. Popular `ML` of today, the
    capability we find on cloud digital services, is narrow AI, or narrow `ML`, focused
    on a specific task (e.g. supervised and unsupervised learning). Examples of narrow
    `ML` are `SVMs`, `decision trees` and `KNN` algorithms. They test hypotheses based
    on a specific task. The learning from experience is really learning from data
    (`ML`) on a specific, focused task.


    `AGI`, introduced in `Chapter 1`, is a machine capable of learning any intellectual
    task that a human can. It is hypothetical and not required for `AI` and `ML` in
    general. This hypothetical type of AI is often the subject of speculation and
    sometimes feared by humans. We are nowhere near `AGI`, and it could be decades
    or even centuries before we are close to achieving it.


    `AGI` can be taken one step further. Science fiction is fond of machines that
    are assumed to have consciousness; strong AI is `AGI` that is also conscious.
    Consciousness is complex and difficult. Some consider it to be the hardest problem
    in `AI`. This is covered in more detail later in the chapter.


    `AGI` and strong, or conscious, `AGI` is not currently feasible and is not realistic
    in the foreseeable future. It is an active area of research, but not a requirement
    for `AI` or `ML`.


    ### 6.1.3 Human-plus-machine systems


    Rather than thinking of either a machine or a human undertaking a task, surely
    the future is one with humans and machines in harmony? Or, as Stuart Russell emphasises,
    human-compatible AI – this concept is a proposal to solve the AI control problem.
    Russell’s three principles are `(Russell, 2019)`:


    ‘1. The machine’s only objective is to maximise the realisation of human preferences.

    2. The machine is initially uncertain about what those preferences are.

    3. The ultimate source of information about human preferences is human behaviour.’


    Machines designed in this way will control the development of AI. Ideally, humans
    will move to higher value work or have more time to enjoy being human. These principles
    are new, and it’s not yet clear how they will pan out; however, Stuart Russell
    suggests they are futureproof.


    Practical examples of humans plus machines can be easily imagined. A person using
    an exoskeleton is able to undertake tasks they weren’t previously capable of,
    perhaps allowing them to walk or lift heavy weights. We have search engines and
    large language models – academics can search literature in seconds, something
    that would have taken years, if not decades, 40 years ago. In medicine, brain
    interfaces and the study of the human brain is allowing doctors to better understand
    stroke recovery. Indeed, we may be able to test for consciousness in patients
    that we can’t communicate with. The idea of humans and machines together gives
    us superhuman capabilities.


    ### 6.1.4 Roles and career opportunities in AI


    Here we take a brief look at typical AI/ML roles. The list is not complete because
    the field of AI and ML is growing very quickly. However, it should give you a
    flavour of what we expect and currently see. We look at the roles and responsibilities
    of an ML engineer, `data scientist`, `AI research scientist`, `computer vision
    engineer`, `NLP engineer`, `robotics engineer`, `AI ethics specialist` and `AI
    anthropologist`.


    An `ML engineer` will typically have the following role and responsibilities:


    Developing algorithms: design, build and implement `ML` models and algorithms.


    Data processing: clean, pre-process and organise data for use in models.

