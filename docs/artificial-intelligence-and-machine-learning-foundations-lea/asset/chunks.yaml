- raw: 'Way back in antiquity there were legends, stories and myths of effigies and
    artificial mechanical bodies endowed with some form of intelligence, typically
    the creation of a wise man or master craftsman. We still have references to golems
    of biblical times, which were magical creatures made of mud or clay and brought
    to ‘life’ through some incantation or magic spell. Aristotle (384–322 BCE), the
    Greek polymath and father of later Western philosophy, was the first to write
    about objects and logic and laid the foundations of ontology and the scientific
    method. As a result, today we teach natural science, data science, computer science
    and social science. Without the required technology, many centuries passed without
    any progress in the pursuit of AI.


    In the 18th century we saw the mathematical development of statistics (Bayes’
    theorem) and the first computer description and algorithm from Ada Lovelace. During
    the 19th century, AI entered the world of science fiction literature with Mary
    Shelley’s Frankenstein in 1818 and Samuel Butler’s novel Erewhon in 1872, which
    drew on an earlier (1863) letter he had written to The Press newspaper in New
    Zealand, ‘Darwin among the Machines’. Butler was the first to write about the
    possibility that machines might develop consciousness by natural selection.


    In 1920 Czech-born Karel Čapek introduced the word ‘robot’ to the world within
    his stage play, R.U.R. (Rossum’s Universal Robots). ‘Robot’ comes from the Slavic
    language word robota, meaning forced labourer.


    AI has since become a recurrent theme in science fiction writing and films, whether
    utopian, emphasising the potential benefits, or dystopian, focusing on negative
    effects such as replacing humans as the dominant race with self-replicating intelligent
    machines. To some extent, we can say that what was yesterday’s science fiction
    is quickly becoming today’s science fact.


    In 1943 Warren McCulloch and Walter Pitts created a computational model for NNs,
    which opened up the subject. The first was an electronic analogue NN built by
    Marvin Minksy. This sparked the long-lasting relationship between AI and engineering
    control theory. Then, in the 1950s, the English mathematician Alan Turing published
    a paper entitled ‘Computing machinery and intelligence’ in the journal Mind (Turing,
    1950). This really opened the door to the field that would be called artificial
    intelligence. It took a further six years, however, before the scientific community
    adopted the term ‘artificial intelligence’.


    John McCarthy organised the first academic conference on the subject of AI at
    Dartmouth College, New Hampshire, in the summer of 1956. The ‘summer school’ lasted
    eight weeks and brainstormed the area of AI. It was originally planned to be attended
    by 10 people; in fact, people ‘dropped in’ for various sessions and the final
    list numbered nearly 50 participants. Russell and Norvig quoted McCarthy’s proposal
    for the summer school (Russell and Norvig, 2016: 17):


    We propose that a 2-month, 10-man study of artificial intelligence be carried
    out during the summer of 1956 at Dartmouth College in Hanover, New Hampshire.
    The study is to proceed on the basis of the conjecture that every aspect of learning
    or any other feature of intelligence can in principle be so precisely described
    that a machine can be made to simulate it. An attempt will be made to find how
    to make machines use language, form abstractions and concepts, solve kinds of
    problems now reserved for humans, and improve themselves. We think that a significant
    advance can be made in one or more of these problems if a carefully selected group
    of scientists work on it together for a summer.


    The mid-1950s into the early 1960s also saw the start of machines playing draughts,
    checkers and chess. This was the start of ‘Game AI’, which is still big business
    to this day and has developed into a multi-billion-dollar industry. In 1959, Arthur
    Lee Samuel first used and popularised the term ‘machine learning’, although today
    Tom Mitchell’s definition is more widely quoted (see Section 1.1.1.4). Samuel’s
    checkers-playing program was among the world’s first successful self-learning
    programs, and was amazing given the limited technology available to him at the
    time.


    The 1960s saw the development of logic-based computing and the development of
    programming languages such as Prolog. Previously it took an astronomical number
    of calculations to prove simple theorems using this logic method. It opened up
    a debate regarding how people and computers think. Hubert Dreyfus, a professor
    of philosophy at the University of California Berkeley (1968–2017), challenged
    the field of AI in a book explaining that human beings rarely used logic when
    they solved problems (Dreyfus, 1972). McCarthy was critical of this argument and
    the association of what people do as being irrelevant to the field of AI (McCarthy,
    2000). He argued that what was really needed were machines that could solve problems
    – not machines that think as people think.


    In 1973 many funding sources for AI research were withdrawn, largely due to Sir
    James Lighthill''s report on the state of AI (Lighthill, 1973), along with increasing
    pressure from the US Congress and both the US and British governments. Consequently,
    research funding for AI was significantly reduced, and the difficult years that
    followed would later be known as an ‘AI winter’, lasting from 1974 to 1980. Sir
    James highlighted that other sciences could solve typical AI problems; AI would
    hit combinatorial explosion limits and practical problems would resign AI to solving
    only trivial toy problems. In his view, general AI could not be achieved and there
    was no prospect of a general AI robot ever. During the 1970s, however, a number
    of breakthroughs were made, most notably in 1974 by Ray Kurzweil’s company, Kurzweil
    Computer Products Inc, developing optical character recognition (OCR) and a text-to-speech
    synthesiser, thus enabling blind people to have a computer read text to them out
    loud. It was unveiled to the public in 1976 at the National Federation for the
    Blind, and became commercially available in 1978. Kurzweil subsequently sold the
    business to Xerox. It is widely considered to be the first AI product, although
    today we don’t associate OCR with AI or ML because it is now routine and we take
    it for granted, but it was the precursor to reading handwritten text and the development
    of NLP.


    Following on from the ‘AI winter’, the 1980s saw a boom in AI activity. In 1986
    David Rumelhart and James McClelland developed ideas around parallel distributed
    processing and NN models. Their book, Parallel Distributed Processing: Explorations
    in the Microstructure of Cognition (1986), described their creation of computer
    simulations of perception, giving computer scientists their first testable models
    of neural processing. The 1980s also saw the rise of the robots, with many researchers
    suggesting that AI must have a body if it is to be of use; it needs to perceive,
    move, survive and deal with the world. This led to developments in sensor-motor
    skills development. AI also began to be used for logistics, data mining, medical
    diagnosis and in other areas.


    During the 1990s a new paradigm called ‘intelligent agents’ became widely accepted
    in the AI community. An intelligent agent is a system that perceives its environment
    and takes actions that maximise its chances of success. In 1997, IBM’s Deep Blue
    became the first computer chess-playing system to beat a reigning world chess
    champion, Garry Kasparov. It won by searching 200,000,000 moves per second. By
    comparison, 20 years on, Apple’s iPhone7 was 40 times faster than Deep Blue had
    been in 1997. We have supercomputers in our pockets.


    1.1.2.1 Bringing us up to date, the last 20 years…


    Over the last 20 years, developments in technology with cheaper and faster computers
    have finally caught up with our AI aspirations. We have started to gain the computing
    power to really put AI to work.'
