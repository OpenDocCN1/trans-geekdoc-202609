    ## 4.2.3.4 What are the algorithms used in ML and AI?


    ML and AI algorithms include:


    **Linear regression** – this is a model that assumes a linear relationship between
    the input variables (`x`) and the single output variable (`y`). More specifically,
    that `y` can be calculated from a linear combination of the input variables (`x`).
