- raw: "Continuous random data are represented by probability density functions (PDFs)\
    \ (The Editors of Encyclopaedia Britannica, 2024b). Probability is now thought\
    \ of as being in a range, say in between two values. So, from our example of the\
    \ pressure acting on the skin of an aircraft’s wing, what is the probability of\
    \ the pressure being between 10Pa and 15Pa above atmosphere? Or we can think of\
    \ the traditional way we grade exam scores: different ranges are associated with\
    \ the grades received by the people taking the exam. This is shown in Figure 3.10.\
    \ Here we see a standard Gaussian curve and the mean score is in the middle. Particular\
    \ grades are associated with the bands in the curve that define a score range.\n\
    \nFigure 3.10 Example of a probability density function of continuous data (https://commons.wikimedia.org/wiki/File:Standard\\\
    _deviation\\_diagram.svg under Wikimedia Commons licence)\n\n![image-6NTTF9P2.jpg](images/image-6NTTF9P2.jpeg)\
    \  \n\nPDFs come in many forms and have different measures to describe them. By\
    \ describing our discrete or continuous random data via a distribution, we could\
    \ also generate random numbers, and we will come back to this later. There is\
    \ another important idea that can be described by example.\n\nIf we have five\
    \ dice, and use them to generate random scores, we could ask what the distributions\
    \ would look like; in particular, what happens as we increase the number of dice\
    \ that contribute each set of scores we generate. This experiment is shown graphically\
    \ in Figure 3.11. Rolling one die, as we expect, is a uniform distribution because\
    \ each score is equally probable. When we roll two dice, the distribution is no\
    \ longer uniform. As we increase the number of dice, the distribution converges\
    \ onto a normal distribution. The theorem that describes this is the central limit\
    \ theorem (Bronshteĭn et al., 2015). The central limit theorem suggests that,\
    \ under certain (fairly common) conditions, the sum of many random variables will\
    \ have an approximately normal distribution. So, if an event is a combination\
    \ of lots of random data with different distributions, it is likely our event’s\
    \ distribution will be Gaussian or normal.\n\nFrom our intuitive understanding\
    \ of statistics and probability we can express random data in terms of distributions\
    \ and how random events relate to each other. However, we are missing how we generate\
    \ random numbers or random data. Computers are explicit, linear, precise and deterministic.\n\
    \nFigure 3.11 An example of the central limit theorem using five dice and rolling\
    \ set of scores. Top left is a set of scores from rolling one die (n = 1); middle\
    \ right is a set of scores from rolling five dice (n = 5) (https://commons.wikimedia.org/wiki/File:Dice\\\
    _sum\\_central\\_limit\\_theorem.svg under Wikimedia Commons licence)\n\n![image-TJKQ5ZMU.jpg](images/image-TJKQ5ZMU.jpeg)\
    \  \n\nFortunately, they can produce pseudo-random numbers, and the algorithms\
    \ to do this are already written (Teukolsky et al., 1993; Knuth, 2011). If we\
    \ have incomplete data, but can somehow determine the probability distribution\
    \ from the data we have, then we can generate random numbers with the same distribution.\n\
    \nThis section has built up an intuitive understanding of the pillars of ML and\
    \ AI. Domain experts in these areas are needed if you are working with AI at an\
    \ algorithmic or training level, so you will more than likely need to have these\
    \ people in your team. What we have tried to show in this section is the level\
    \ of mathematical understanding someone implementing AI needs to have when working\
    \ with AI software. A programmer just learning Python, for example, is not prepared\
    \ to develop AI algorithms; however, if a programmer is confident in the material\
    \ in this section, then some higher-level mathematical training will make their\
    \ job much easier.\n\n## 3.3 MACHINE LEARNING CONCEPTS\n\nIn this section, we\
    \ describe some common techniques that we use to learn from data. These are high-level\
    \ descriptions that get us started. There are numerous and abundant examples in\
    \ the Further reading list and on the internet to learn from.\n\n## 3.3.1 Common\
    \ machine learning concepts\n\nHere, we introduce supervised, unsupervised, semi-supervised\
    \ and reinforcement learning. We describe some techniques for learning from data\
    \ in Chapter 4, along with how we typically visualise data while stepping through\
    \ the stages of a ML project.\n\n## 3.3.2 Supervised, unsupervised, semi-supervised\
    \ and reinforcement learning\n\nIf we have prepared our data well and are confident\
    \ that the data can be used to test a hypothesis, then we can begin to understand\
    \ the types of algorithms we employ in ML. What we mean by ‘type’ is the broad\
    \ categories that define our algorithms. They are typically organised as follows\
    \ (Russell and Norvig, 2016):\n\nSupervised learning – these types of algorithm\
    \ use labelled (actual solution) data to train the algorithm (see Figure 3.12).\n\
    \nUnsupervised learning – these types of algorithm use unlabelled data to train\
    \ the algorithm (see Figure 3.13).\n\nSemi-supervised learning – these types of\
    \ algorithm use labelled and unlabelled data to train the algorithm (see Figure\
    \ 3.14).\n\nReinforcement learning – these types of algorithm use the learning\
    \ of an agent to achieve a goal that is measured in terms of a reward or penalty\
    \ (see Figure 3.15).\n\nExamples of each of the types of ML are:\n\nSupervised\
    \ learning – classification, regression (linear, logistic), SVMs, decision forests,\
    \ NNs.\n\nUnsupervised learning – clustering, association rule learning, dimensionality\
    \ reduction, NNs.\n\nSemi-supervised learning – combinations of supervised and\
    \ unsupervised algorithms.\n\nReinforcement learning – Monte Carlo, direct policy\
    \ search, temporal difference learning.\n\nReinforcement learning fits naturally\
    \ with the AI learning agent schematic. It relates to both products (e.g. autonomous\
    \ robots) and data analysis. In reinforcement learning, an agent interacts with\
    \ an environment to achieve a goal. It can also learn how to achieve that goal.\n\
    \nWe can also categorise the way an algorithm learns in terms of the data it is\
    \ working with.\n\nBatch learning describes learning from large data sets. All\
    \ of the data are used to train and test the algorithm. The computer resources\
    \ required are governed by the volume, velocity, variety and veracity of data.\
    \ This learning is done offline. Online learning is undertaken with data in small\
    \ or mini batches. Learning occurs as data become available – an example is a\
    \ system that learns from stock market prices.\n\nThere will be times when we\
    \ come across types of learning from examples or learning from examples to build\
    \ a model; these types of learning are called instance-based learning and model-based\
    \ learning, respectively. These are possibly the simplest form of learning.\n\n\
    Figure 3.12 Supervised learning\n\n![image-IC0LARWV.jpg](images/image-IC0LARWV.jpeg)\
    \  \n\nFigure 3.13 Unsupervised learning\n\n![image-CEDXXOM9.jpg](images/image-CEDXXOM9.jpeg)\
    \  \n\nFigure 3.14 Semi-supervised learning\n\n![image-V2NV66F2.jpg](images/image-V2NV66F2.jpeg)\
    \  \n\nFigure 3.15 Reinforcement learning\n\n![image-MIMS0LV6.jpg](images/image-MIMS0LV6.jpeg)\n\
    \n## 3.4 SUMMARY\n\nThis chapter explored how AI, ML and robotics interrelate,\
    \ emphasising the importance of a human-centric ethical approach. It clarified\
    \ that, while AI and ML are often used interchangeably, ML is a subset of AI,\
    \ focusing on learning from data, whereas AI encompasses broader capabilities,\
    \ including learning from experience and making decisions autonomously. The chapter\
    \ discussed how intelligent agents, which can perceive and act in environments,\
    \ are fundamental to both AI and robotics. These agents can learn and adapt, whether\
    \ in simulated digital environments or physical, engineered ones."
  fmt: "\nContinuous random data are represented by probability density functions\
    \ (PDFs) (The Editors of Encyclopaedia Britannica, 2024b). Probability is now\
    \ thought of as being in a range, say in between two values. So, from our example\
    \ of the pressure acting on the skin of an aircraft’s wing, what is the probability\
    \ of the pressure being between `10Pa` and `15Pa` above atmosphere? Or we can\
    \ think of the traditional way we grade exam scores: different ranges are associated\
    \ with the grades received by the people taking the exam. This is shown in Figure\
    \ 3.10. Here we see a standard Gaussian curve and the mean score is in the middle.\
    \ Particular grades are associated with the bands in the curve that define a score\
    \ range.\n\nFigure 3.10 Example of a probability density function of continuous\
    \ data (https://commons.wikimedia.org/wiki/File:Standard\\_deviation\\_diagram.svg\
    \ under Wikimedia Commons licence)\n\n![image-6NTTF9P2.jpg](images/image-6NTTF9P2.jpeg)\
    \  \n\n`PDFs` come in many forms and have different measures to describe them.\
    \ By describing our discrete or continuous random data via a distribution, we\
    \ could also generate random numbers, and we will come back to this later. There\
    \ is another important idea that can be described by example.\n\nIf we have five\
    \ dice, and use them to generate random scores, we could ask what the distributions\
    \ would look like; in particular, what happens as we increase the number of dice\
    \ that contribute each set of scores we generate. This experiment is shown graphically\
    \ in Figure 3.11. Rolling one die, as we expect, is a uniform distribution because\
    \ each score is equally probable. When we roll two dice, the distribution is no\
    \ longer uniform. As we increase the number of dice, the distribution converges\
    \ onto a normal distribution. The theorem that describes this is the central limit\
    \ theorem (Bronshteĭn et al., 2015). The central limit theorem suggests that,\
    \ under certain (fairly common) conditions, the sum of many random variables will\
    \ have an approximately normal distribution. So, if an event is a combination\
    \ of lots of random data with different distributions, it is likely our event’s\
    \ distribution will be Gaussian or normal.\n\nFrom our intuitive understanding\
    \ of statistics and probability we can express random data in terms of distributions\
    \ and how random events relate to each other. However, we are missing how we generate\
    \ random numbers or random data. Computers are explicit, linear, precise and deterministic.\n\
    \nFigure 3.11 An example of the central limit theorem using five dice and rolling\
    \ set of scores. Top left is a set of scores from rolling one die (`n = 1`); middle\
    \ right is a set of scores from rolling five dice (`n = 5`) (https://commons.wikimedia.org/wiki/File:Dice\\\
    _sum\\_central\\_limit\\_theorem.svg under Wikimedia Commons licence)\n\n![image-TJKQ5ZMU.jpg](images/image-TJKQ5ZMU.jpeg)\
    \  \n\nFortunately, they can produce pseudo-random numbers, and the algorithms\
    \ to do this are already written (Teukolsky et al., 1993; Knuth, 2011). If we\
    \ have incomplete data, but can somehow determine the probability distribution\
    \ from the data we have, then we can generate random numbers with the same distribution.\n\
    \nThis section has built up an intuitive understanding of the pillars of ML and\
    \ AI. Domain experts in these areas are needed if you are working with AI at an\
    \ algorithmic level.\n\n## 3.3 MACHINE LEARNING CONCEPTS\n\nIn this section, we\
    \ introduce supervised, unsupervised, semi-supervised and reinforcement learning.\
    \ Here we describe the types of ML that get started. We can also categorise the\
    \ way an algorithm learns. \n\n### 3.3.1 Supervised, unsupervised, semi-supervised\
    \ and reinforcement learning\n\nWhat we mean by ‘type’ is organised as follows:\n\
    \n- `Supervised learning` – these use labelled data to train (see Figure 3.12).\n\
    - `Unsupervised learning` – these use unlabelled data (see Figure 3.13).\n- `Semi-supervised\
    \ learning` – these use labelled and unlabelled data to train (see Figure 3.14).\n\
    - `Reinforcement learning` – these use the learning of an agent to achieve a goal\
    \ (see Figure 3.15).\n\nExamples of each the types are:\n\n- `Supervised learning`\
    \ – classification, regression (`linear`, `logistic`), `SVMs`, decision forests,\
    \ `NNs`.\n- `Unsupervised learning` – clustering, association rule learning, dimensionality\
    \ reduction, `NNs`.\n- `Semi-supervised learning` – combinations of supervised\
    \ and unsupervised.\n- `Reinforcement learning` – `MonteCarlo`, direct policy\
    \ search, `temporal difference` learning.\n\nWe can also categorise the way an\
    \ algorithm learns in terms of the data it is working with:\n\n- `Batch learning`\
    \ describes learning from large data sets. All of the data are used to train and\
    \ test the algorithm. The computer resources required are governed by the volume,\
    \ velocity, variety and veracity of data. This learning is done offline.\n- `Online\
    \ learning` is undertaken with data in small batches. Learning occurs as data\
    \ become available – an example is a system that learns from stock prices.\n\n\
    There will be times when we come across types of learning from examples or learning\
    \ from examples to build a model; these types of learning are called `instance-based\
    \ learning` and `model-based learning`, respectively. These are possibly the simplest\
    \ form of learning.\n\n## 3.4 SUMMARY\n\nThis chapter explored how AI, ML and\
    \ robotics interrelate, emphasising the importance of a human-centric ethical\
    \ approach. It clarified that, while AI and ML are often used interchangeably,\
    \ ML is a subset of AI, focusing on learning from data, whereas AI encompasses\
    \ broader capabilities, including learning from experience and making decisions\
    \ autonomously.\n"
  trans: "\n连续随机数据由概率密度函数（PDFs）表示（The Editors of Encyclopaedia Britannica, 2024b）。概率现在被认为处于一个范围之内，例如在两个值之间。因此，以作用在飞机机翼表面的压力为例，压力在高于大气压的\
    \ `10Pa` 到 `15Pa` 之间的概率是多少？或者，我们可以考虑传统的考试成绩评分方式：不同的范围与考试者所获得的等级相关联。这如图 3.10 所示。在这里我们看到一条标准高斯曲线，平均分位于中间。特定的等级与曲线中定义分数范围的区域相关。\n\
    \n图 3.10 连续数据概率密度函数的示例（https://commons.wikimedia.org/wiki/File:Standard\\_deviation\\\
    _diagram.svg 遵循 Wikimedia Commons 许可）\n\n![image-6NTTF9P2.jpg](img/image-6NTTF9P2.jpeg)\
    \  \n\n`PDFs` 有许多形式，并有不同的衡量方法来描述。通过分布描述我们的离散或连续随机数据，我们还可以生成随机数，我们稍后会回到这一点。另一个可以通过例子描述的重要概念。\n\
    \n如果我们有五个骰子，并用它们来生成随机分数，我们可以询问分布看起来是怎样的；特别是，当我们增加生成每组分数的骰子数量时会发生什么。这个实验在图 3.11\
    \ 中形象所示。投掷一个骰子，正如我们预期的，是一个均匀分布，因为每个分数的概率相等。当我们投掷两个骰子时，分布不再是均匀的。随着骰子数量的增加，分布收敛于正态分布。描述这一点的定理是中心极限定理（Bronshteĭn\
    \ et al., 2015）。中心极限定理表明，在某些（相当常见的）条件下，许多随机变量的和具有近似正态分布。因此，如果一个事件是许多不同分布随机数据的组合，那么我们的事件分布很可能是高斯或正态的。\n\
    \n根据我们对统计学和概率的直观理解，我们可以用分布表示随机数据以及随机事件之间的相互关系。然而，我们缺少如何生成随机数或随机数据。计算机是显式的、线性的、精确的且定的。\n\
    \n图 3.11 使用五个骰子投掷得分组的中心极限定理示例。左上是投掷一个骰子的得分组（`n = 1`）；右中间是投掷五个骰子的得分组（`n = 5`）（https://commons.wikimedia.org/wiki/File:Dice\\\
    _sum\\_central\\_limit\\_theorem.svg 遵循 Wikimedia Commons 许可）\n\n![image-TJKQ5ZMU.jpg](img/image-TJKQ5ZMU.jpeg)\
    \  \n\n幸运的是，它们可以产生伪随机数，实现此点的算法已经编写（Teukolsky et al., 1993; Knuth, 2011）。如果我们有不完整的数据，但能从现有数据某种确定概率分布，那么我们就可以生成相同分布的随机数。\n\
    \n本节建立了对 ML 和 AI 柱的直观理解。如果你在算法层面处理 AI 工作，就需要这些领域的领域专家。\n\n## 3.3 机器学习概念\n\n在本节中，我们介绍了监督学习、无监督学习、半监督学习和强化学习。在这里我们描述了入门阶段的\
    \ ML 类型。我们也可以对算法的学习方式进行分类。\n\n### 3.3.1 监督学习、无监督学习、半监督学习和强化学习\n\n我们所说的“类型”组织如下：\n\
    \n- `Supervised learning` – 使用标记数据进行训练（见图 3.12）。\n- `Unsupervised learning` –\
    \ 使用未标记数据（见图 3.13）。\n- `Semi-supervised learning` – 使用标记和未标记数据进行训练（见图 3.14）。\n\
    - `Reinforcement learning` – 使用智能体的学习来达成目标（见图 3.15）。\n\n每个类型的示例为：\n\n- `Supervised\
    \ learning` – 分类、回归（`linear`、`logistic`）、`SVMs`、决策森林、`NNs`。\n- `Unsupervised learning`\
    \ – 聚类、关联规则学习、降维、`NNs`。\n- `Semi-supervised learning` – 监督和无监督的。\n- `Reinforcement\
    \ learning` – `MonteCarlo`、直接策略搜索、`temporal difference` 学习。\n\n我们还可以根据算法处理的数据对其学习方式进行分类：\n\
    \n- `Batch learning` 描述从大数据集中学习。所有数据都用于训练和测试算法。所需的计算资源由数据量、速度、多样性和真实性决定。这种学习是离线进行的。\n\
    - `Online learning` 通过小批次数据进行。学习在数据可用时发生——例如一个从股票价格学习的系统。\n\n我们有时会遇到从示例学习或通过示例构建模型学习的情况；这些学习类型分别被称为\
    \ `instance-based learning` 和 `model-based learning`。这些可能是最简单的学习形式。\n\n## 3.4\
    \ 总结\n\n本章探讨了 AI、ML 和机器人之间的相互关系，强调了以人为本的伦理方法的重要性。它澄清了，虽然 AI 和 ML 经常混用，但 ML 是 AI\
    \ 的子集，侧重于从数据中学习，而 AI 包含更广泛的能力，包括从经验中学习和自主决策。\n"
