  trans: '

    Stuart Russell 和 Peter Norvig 是标准人工智能教科书《人工智能：现代方法》（Artificial Intelligence: A
    Modern Approach，2016）的作者，他们解释说 AI 是一门通用的学科，对我们所有人都有帮助。从经验中学习是 AI 的特征。我们将频繁使用这个概念；它对机器和对人类同样适用，或许对人类更为如此。


    爱因斯坦经常被引用说：“知识的唯一来源是经验。”问问自己：机器能帮助我们从经验中学习吗？如果这个问题的答案是定的，那么 AI 就能帮助你。


    ### 1.1.1.4 机器学习


    在本节中，我们需要区分机器学习（ML）和人工智能（AI）。这不是一项容易的任务，除非我们提醒自己 AI 是一个通用的学科，可以帮助任何通过经验学习来实现目标的追求（Russell
    and Norvig, 2016）。ML 只是其中的一部分——区别始于对 AI 智能体和 ML 的定义。汤·米切尔（Tom Mitchell）定义的 ML
    是通常被引用的（Mitchell, 2018）；它与我们生活中各个部分的数字计算紧密相关。


    如果一个计算机程序对于某些任务类别 `T` 和性能衡量标准 `P`，其在 `T` 任务上的性能（通过 `P` 衡量）随着经验 `E` 的增加而提高，则认为是从经验
    `E` 中学习。


    AI 关乎智能实体或 AI 智能体与环境交互以实现目标。不仅仅是一个实体，而是多个。AI 关乎人和机器，它们如何互动、如何学习、经历什么。AI 要求我们明确人类如何实现他们的目标。我们能构建出可以与之协作以提升人类自身的机器吗？AI
    对意识、哲学、伦理和科学提出了严峻的问题。它处理我们目前还没有机器去探索的复杂现象。未来的 AI 将关人类和机器如何共存。2019 年，Stuart Russell
    发布了他关于人类兼容 AI 的最新著作《人类兼容：人工智能与控制问题》（Human Compatible: Artificial Intelligence
    and the Problem of Control，2019），该书揭示了 AI 的本质，以及如果我们使用得当，如何从人机共处的未来中受益。


    随着我们开始意识到数字计算 ML 的益处，这将释放 AI 在其他领域的潜力，例如：


    - 工程和构建智能实体；

    - 医疗以及改善健康和社交护理；

    - 业务分析等。


    当我们仅仅思考产品时，在数字模拟中表示世界——或（目前的） 0 和 1——并不是理想的。数字计算有其局限性，我们需要更好的机器。我们已经耗尽数字处理能力。AI
    不仅仅是高性能计算处理 0 和 1 的机器编程——数字模拟的披萨尝不出任何味道，数字天气也不会让让我们淋湿。


    未来的 AI 机器将整合数字计算机，但当我们思考时，实际上要表示我们所需的数学运算是非常困难的。我们受限于今天技术的处理能力、能量和准确性——结果是，我们只能专注于狭义机器学习（narrow
    ML），专注于特定的、定义良好的任务或目标。


    这些类型任务的示例包括玩国际象棋、跳棋和西洋棋等游戏。现代游戏包括模拟游戏以及非常先进的策略性、工程精良的游戏，如围棋；这类游戏可以在数字计算机上被明确定义。现实世界的实际例子包括优化飞机在机场的停放位置或包裹交付的物流；同样，这是一个足够良好且经过工程设计的环境，ML
    在其中可以优化某些事物。


    ML 专注于明确定义一个可以在计算机上解决的问题。这些问题可能是复杂的、非线性和统计性质的。如果我们要在 AI 中使用 ML，我们必须能够以数学方式表示我们的问题，并使其能够被机器解决。今天，我们通常使用数字计算机。然而，量子、模拟、光学和生物计算机正在路上。


    ### 现实世界并非数字模拟


    如果我们对一切都进行数字化设计会发生什么？我们会信任完全由数字建模设计的东西吗？在这个方框中，我们不会关注单一示例，而是观察一个已经存在了约 20 年的概念——数字孪生（digital
    twin）。


    数字孪生是 AI 用于从数字模拟、可能还有传感器中学习的一个例子；有很多该概念被成功使用的案例（Wikipedia Contributors, 2024i）。我们还需要注意，仅仅因为我们模拟了某些，并不意味着它在现实中的表现是相同的。


    数字孪生有多种定义，如果不仔细考虑它是否是对世界的良好表示，就不应该开始使用。即使是简单的地球天气模型也被证明是极其复杂的，需要大型超级计算机来完成。


    AI 还可以借鉴系统方法（system of systems approach）来对复杂系统进行建模——许多子系统结合后会发展出越来越复杂的行为。这种方法的优点是作为门学术学科，与支撑
    AI 和 ML 的基础学科紧密相关。这些方法的示例包括用于可持续性的基于智能体的建模（agent-based modelling）和生命周期分析。通过系统方法，你可以将较大的问题拆分为可管理的区块。事实上，我们可能会发现一个系统需要巨大的计算能力，以至于更大的数字孪生可能不可行，甚至不现实。在这种情况下，我们需要构建一个子系统的模型，并将其整合到系统方法中。


    使用系统方法构建的数字孪生概念可能有助于确保我们的 AI 以人为中心、技术上稳健且可信。


    数字 ML 近期变得非常流行，归功于卷积深度神经网络（`NNs`）的成功，以及最近的生成式 AI。这些数值技术让我们理解了人类大脑如何解决问题。为了澄清这一点，人类眼睛的运作导致了
    `NNs` 的突破：卷积神经网络（`CNN`）。因此，当我们思考 ML 时，可以将其视为 AI 智能体从数据中学习。


    ### 1.1.1.5 深度学习与生成式 AI


    深度学习和生成式 AI 是狭义机器学习旅程中的重要里程碑；改变了我们与技术交互以创造艺术和科学领域新可能的方式——这些技术正在重塑我们的世界。随着研究进展，我们可以期待更多创新应用和突破，使深度学习和生成式
    AI 成为未来不可或缺的一部分。


