    Artificial Intelligence and Machine Learning Foundations is a thought-provoking
    exploration of AI’s evolution, its core workings and practical applications. The
    case studies and toolbox are invaluable resources for anyone in the field.


    Darren Winter, Director, Duco Digital Training and PhD Student in AI Ethics


    This book is a highly recommended read for those starting out on Artificial Intelligence
    learning or as a refresher, written by two very knowledgeable authors, who put
    across the subject in an easy-to-understand manner.


    Mat Gardam, Cyber Security Professional, Armoured-Cyber Ltd


    This is a great book for executives to understand how AI may fit into their company
    and the types of benefits that they may gain and some of the pitfalls they may
    fall into. The book gives a clear picture of where AI fits with other types of
    decision-making processes. It covers many different aspects of how AI can be developed
    and how it affects society, with a particular focus on ethics and the human machine
    interface.


    Dr Paul Edward Mort, B.Eng. (Hons), PhD, MBA, MIMechE CEng FNucI, Lead Consultant
    for PM Advanced Technologies Consultancy Ltd


    Many commentators see AI as the key enabler of the fifth industrial revolution.
    In this clear and concise guide to the BCS Artificial Intelligence Foundation
    qualification, Andrew Lowe and Steve Lawless set out to clearly explain the core
    concepts around artificial intelligence, machine learning, applications in robotics
    and more in this new edition. A ‘must have’ guide in preparation for the newly
    updated BCS AI Foundation exam, this book will not only assist with exam success
    but will capture your imagination to the possibilities in front of us when reimagining
    the human vs machine relationship.


    Richard Webber, Digital Transformation Manager


    ## Reviews on previous edition:


    This book is a welcome read for those who want to know more about AI but don’t
    have a degree background in the subjects. It successfully brings the beginner
    up to speed and is written with such enthusiasm that the more complex topics become
    manageable. For a foundation level book it covers an impressive content range,
    whilst providing a solid grounding in machine learning. The topics are clearly
    and succinctly exemplified by three case studies which bring AI into the real
    world.


    Rosie Sheldon, Senior Trainer, TSG-training


    Produces a great storm of ideas and thoughts with a funny touch from the authors.
    This is a piece of art and a ‘must read’ for good immersion in the theme.


    David Mondón Tapia, IT & Business Consultant, DieresiS – Business and Professional
    Services


    Manages to provide a fundamental grounding in the theory and application of AI
    without relying on mathematical or data science skills the theory is colourfully
    illustrated with examples of both AI successes and challenges, which will prove
    an invaluable foundation to the reader’s learning from experience in the world
    of artificial intelligence.


    Mark Ainsworth, Director and Business Analyst, Promising ICT Limited


    ![image-NI0PQP8G.jpg](images/image-NI0PQP8G.jpeg)


    ## BCS, THE CHARTERED INSTITUTE FOR IT


    BCS, The Chartered Institute for IT, is committed to making IT good for society.
    We use the power of our network to bring about positive, tangible change. We champion
    the global IT profession and the interests of individuals, engaged in that profession,
    for the benefit of all.


    ### Exchanging IT expertise and knowledge


    The Institute fosters links between experts from industry, academia and business
    to promote new thinking, education and knowledge sharing.


    ### Supporting practitioners


    Through continuing professional development and a series of respected IT qualifications,
    the Institute seeks to promote professional practice tuned to the demands of business.
    It provides practical support and information services to its members and volunteer
    communities around the world.


    ### Setting standards and frameworks

