- raw: 'The concept of AI agents was explained through rational agents, which select
    actions based on maximising performance within a given environment. The chapter
    detailed various types of agents – reflex, model-based, goal-based and utility-based
    – highlighting their increasing complexity in handling tasks autonomously.


    The role of robotics in AI was explored, tracing the development of intelligent
    robots and how AI enhances their ability to perform complex tasks. Key paradigms
    in robotics – hierarchical, reactive and hybrid – were introduced, showcasing
    how robots process sensory data and make decisions.


    The chapter also delved into ML, discussing its foundational principles in linear
    algebra, vector calculus and probability, as well as the role of supervised, unsupervised,
    semi-supervised and reinforcement learning techniques in AI applications. These
    techniques enable AI systems to learn from data, solve complex problems and interact
    with their environments.


    In summary, this chapter connected the technical foundations of AI and ML with
    practical applications, offering insights into how intelligent agents and robotics
    contribute to advancing AI technologies in various fields.


    4DATA AND AI


    ## 4.1 DATA IN AI


    In this chapter, we expand the use of data to learning from it through ML. We
    may obtain data from various sources, and it will come in many forms and levels
    of quality. To make sense of this, we will use digital computation as our method
    for learning from data.


    ## 4.1.1 Key data terms


    Let’s define the typical key terms that we explore in this section. These are:


    data types (structured, semi-structured and unstructured);


    big data;


    data visualisation.


    4.1.1.1 Data types – structured data


    Structured data in ML refer to highly organised information that is easily searchable
    and typically stored in tabular formats such as spreadsheets or databases. These
    data are characterised by consistent, predefined schema with clearly defined rows
    and columns, where each column represents a specific feature or attribute, and
    each row represents an individual record or instance. Examples of structured data
    include customer information databases, financial records and sensor data from
    IoT devices. In ML, structured data are crucial as they allow for straightforward
    analysis and the application of various algorithms for tasks such as classification,
    regression and clustering. Their well-defined nature facilitates data pre-processing,
    feature extraction and integration with ML pipelines, enabling the development
    of predictive models that can uncover patterns and insights, leading to data-driven
    decision-making and automation in numerous applications.


    A word of warning: even though this is the simplest form of data to understand
    and use ML algorithms with, we will need to become proficient in the linear algebra
    or scalars, arrays, vectors and tensors. In particular, if we take advantage of
    the vast wealth of open-source ML algorithms available, we must prepare the data
    and send data to the algorithm in the form it is expecting. It is much more involved
    than defining arrays and lists in computer code.


    4.1.1.2 Data types – semi-structured data


    Semi-structured data in ML refer to information that does not conform to a rigid,
    tabular format but still contains organisational markers to separate semantic
    elements, making them more flexible than structured data yet more organised than
    unstructured data. Examples include JSON, XML and YAML files, as well as email
    messages and HTML documents. This type of data typically includes tags or keys
    that provide context and hierarchy, allowing for easier parsing and interpretation
    than unstructured data. In ML, handling semi-structured data involves techniques
    for extracting and transforming relevant information into a more analysable format.
    This often requires sophisticated pre-processing steps, such as parsing, normalisation
    and feature extraction, to prepare the data for modelling. Semi-structured data
    are valuable because they capture complex, nuanced information from various sources,
    such as web pages and social media feeds, enabling ML algorithms to leverage richer
    data sets for improved predictive performance and more insightful analytics.


    In essence, the more we practise working with these data the better at extracting
    value from them we will get. It is more of an orchestration rather than simply
    following a typical ML project checklist.


    4.1.1.3 Data types – unstructured data


    Unstructured data in ML refer to information that lacks a predefined format or
    organisational framework, making it inherently more complex to process and analyse.
    This data type includes text documents, images, audio files, videos, social media
    posts and other forms of multimedia content. Due to their free-form nature, unstructured
    data do not fit neatly into rows and columns, posing significant challenges for
    traditional data processing and analysis methods. In ML, extracting meaningful
    insights from unstructured data involves advanced techniques such as NLP for text,
    computer vision for images and videos and audio signal processing for sound. These
    techniques enable the transformation of unstructured data into a structured format
    that ML algorithms can utilise. The ability to harness unstructured data is increasingly
    important, as it represents a vast majority of the data generated in the digital
    age, providing a rich source of information for developing predictive models,
    improving decision-making processes and uncovering hidden patterns and trends
    across diverse applications.


    Working and extracting the value from this type of data requires an expert grasp
    of working with structured and semi-structured data. Indeed, it may require the
    use of ML techniques to understand these data. This is an exciting area of ML
    that we now have at our fingertips. Our smartphones will soon have AI that will
    better inform our use of them. It may be that our digital AI capabilities will
    be developed for us, and we won’t need to work with unstructured data as much
    as we think. We’ll just become used to having the AI do it for us. What we mean
    here is that we don’t need to understand how the search engine works, and we can
    maximise its benefit by learning how to use it.


    4.1.1.4 Big data


    Big data is a term that often describes the vast array of data that can be found
    on the internet. Big data has the following characteristics (Gregersen, 2024):


    ‘Volume measures the quantity of stored and generated data.


    Variety measures the nature and type of data.


    Velocity measures the speed at which the data is moving.


    Veracity measures the data quality, value or utility.’


    Big data in ML refers to the massive volumes of data generated at high velocity
    and with a wide variety of formats that traditional data-processing tools cannot
    efficiently handle. These data encompass structured, semi-structured and unstructured
    information originating from numerous sources such as social media, sensors, transactional
    systems and multimedia. In the context of ML, big data provides the raw material
    needed to train more accurate and robust models. The sheer scale and diversity
    of big data enable the discovery of complex patterns, relationships and insights
    that smaller data sets might miss. Leveraging big data requires specialised technologies
    and architectures. ML algorithms applied to big data can lead to breakthroughs
    in predictive analytics, real-time processing and personalised experiences, driving
    innovation and competitive advantage across industries from healthcare to finance,
    and beyond.


    We might make sense of big data by thinking more about what enables it in the
    first place. The internet gives us interconnectivity that means data can be dug
    from all over the world. It also allows us to access the vast amount of data processing
    we need to work with big data sets. So, to harness big data, we must be familiar
    with parallel computing and networks.'
