    \ adversarial network\n- `GDPR`: General Data Protection Regulation\n- `Gen AI`:\
    \ generative AI\n- `GOMS`: goals, operators, methods and selection rules\n- `GPAI`:\
    \ general purpose artificial intelligence\n- `GPT`: generative pre-trained transformer\n\
    - `GPU`: graphics processing unit\n- `HCAI`: human-centred artificial intelligence\n\
    - `HCI`: human–computer interaction\n- `HITL`: human in the loop\n- `IA`: intelligent\
    \ automation or augmentation\n- `ICT`: information and communications technology\n\
    - `IEC`: International Electrotechnical Commission\n- `IoT`: Internet of Things\n\
    - `ISO`: International Organization for Standardization\n- `KNN`: K-nearest neighbour\n\
    - `LSTM`: long short-term memory\n- `MHP`: model human processor\n- `ML`: machine\
    \ learning\n- `MLOps`: machine learning operations\n- `MLP NN`: multilayer perceptron\
    \ neural network\n- `ModelOps`: model operations\n- `NI`: natural intelligence\n\
    - `NIST`: National Institute of Standards\n- `NLP`: natural language processing\n\
    - `NMT`: neural machine translation\n- `NN`: neural network\n- `OCR`: optical\
    \ character recognition\n- `PDF`: probability density function\n- `PESTLE`: political,\
    \ economic, sociological, technological, legal and environmental\n- `RBM`: restricted\
    \ Boltzmann machine\n- `RNN`: recurrent neural network\n- `ROI`: return on investment\n\
    - `RPA`: robotic process automation\n- `SVM`: support vector machine\n- `SWOT`:\
    \ strengths, weaknesses, opportunities, threats\n- `TAM`: technology acceptance\
    \ model\n- `UCD`: user-centred design\n- `UX`: user experience\n- `VAE`: variational\
    \ autoencoder\n- `VR`: virtual reality\n- `WCAG`: Web Content Accessibility Guidelines\n\
    - `XAI`: explainable AI\n\n# PREFACE\n\nThis book was written with the express\
    \ purpose of supporting the BCS Essentials Certificate in Artificial Intelligence,\
    \ the BCS Foundation Certificate in Artificial Intelligence training courses and\
    \ other scheduled courses already under development in the BCS AI course pipeline.\n\
    \nIts aim is to document what artificial intelligence and machine learning are\
    \ and what they are not, separate fact from fiction and educate those with an\
    \ interest in AI and machine learning. We have included a number of topics that\
    \ introduce the basics of machine learning, and ethics.\n\nWe believe that this\
    \ book is relatively unique in that it brings together information and concepts\
    \ in one book that are, until now, spread across numerous other volumes. The book\
    \ also aims to simplify (where possible) complex and confusing concepts, making\
    \ the topic highly accessible to those without a high-level degree in the subjects\
    \ covered.\n\nStuart Russell and Peter Norvig, the authors of the standard Artificial\
    \ Intelligence textbook (`Russell and Norvig, 2016`) explain that AI is a universal\
    \ subject and helpful to us all. Learning from experience is AI’s signature. We\
    \ will use this a lot, it applies to machines as it does, perhaps more so, to\
    \ humans. Einstein is often quoted as saying, ‘The only source of knowledge is\
    \ the experience’. \n\nAsk yourself the question, where’s the learning from experience\
    \ and can machines help? If the answer to this question is yes, then AI can help\
    \ you!\n\nOur hope here is to bring these concepts to life by balancing theory\
    \ with practice. We want to make the human part of an AI project as important\
    \ as the AI itself. After all, machines are here to take the heavy lifting away\
    \ from us humans. Not only that, but to give us extra capabilities that we could\
    \ not do by ourselves. Humans and machines have unique capabilities and it is\
    \ important to find the right balance. We have not been tempted to write a machine\
    \ learning course which is very popular at the moment. If we did, we would somehow\
    \ have to stretch, contort and manipulate it to explain concepts like consciousness\
    \ and robotics. Even explaining narrow and strong artificial general intelligence\
    \ (`AGI`) would be tricky. And to embrace the practical human side would be virtually\
    \ impossible. BCS is also a chartered institute that can certify engineers to\
    \ be chartered and hold the title of `CEng`. This course goes right back to fundamentals\
    \ so engineers, scientists and mathematicians can gain some traction in AI.\n\n\
    Scientists, mathematicians and engineers all use machine learning but probably\
    \ don’t call it this. All of these professions operate ethically and so should\
    \ AI. People, society and governments are quite rightly concerned about AI and\
    \ its potential. As such, we have adopted the EU guidelines on the ethical use\
    \ of AI. In fact, the EU guidelines give us two practical benefits:\n\n- to measure\
    \ the success of our AI projects by concentrating on Design for All and sustainability;\n\
    - to use the metrics from the first part to build reasoning that can be used in\
    \ planning and business cases.\n\nThe EU guidelines for AI ask us to build a human-centric\
    \ ethical purpose that gives us trustworthy and technically robust AI. Stuart\
    \ Russell’s recent book on human compatible AI (`2019`) puts the human into our\
    \ consideration when undertaking an AI project. His take on this asks if we should\
    \ think about AI as serving our needs, telling us how to be better humans. In\
    \ doing so, it gives us an alternative to controlling AI by asking the AI what\
    \ is best for us as humans. In doing so, this elegant idea aims to solve the control\
    \ problem of AI.\n\nAs we move into the fifth industrial revolution, we have the\
    \ opportunity to think about humans and machines. How do we complement each other?\
    \ How can AI and machines leave humans to undertake more valued work and deal\
    \ with ambiguity or contradictions? To become more human, build better societies\
    \ and for all to exploit their talents. What are the new roles for humans, humans\
    \ and machines and machines only? Simply thinking of these roles, focusing on\
    \ opportunities, leaves a richer environment as we progress, less distracted by\
    \ robots coming to take over our jobs! Can you, your current career or organisation\
    \ benefit from learning from experience? If so, read on.\n\n# 1 FOUNDATIONS OF\
    \ ARTIFICIAL INTELLIGENCE\n\n## 1.1 UNDERSTANDING ARTIFICIAL INTELLIGENCE\n\n\
    In this chapter we are going to make sense of artificial intelligence (AI). In\
    \ particular, framing machine learning (`ML`) and AI into the concept of a learning\
    \ agent that maps onto a simple description of human intelligence. AI is about\
    \ creating intelligent entities (`Russell and Norvig, 2016`) and ML is about learning\
    \ from data (`Mitchell, 2018`).\n\n### 1.1.1 Definitions of key AI terms\n\n####\
    \ 1.1.1.1 Human intelligence\n\nHuman intelligence is the culmination of billions\
    \ of years of evolution from single cell organisms to what we are today, which\
    \ is ultimately marked by our ability to undertake complex mental feats and be\
    \ self-aware. It also includes the ability to recognise our place in the universe\
    \ and ask annoying philosophical questions such as ‘Why are we here?’ and ‘What\
    \ is our purpose?’\n\nThere are many definitions of human intelligence. Our chosen\
    \ definition is useful because it is intuitive and gives us a practical base that\
    \ builds a strong foundation for AI. In fact, it needs to be a little more than\
    \ intuitive: it also needs to guide us as to what AI is useful for in practice.\
    \ When considering this definition, we must keep in the back of our minds that\
    \ the need to find the right balance of theory and practice is paramount. We will\
    \ also need to understand that AI and ML have significant limitations, and this\
    \ will become apparent as we move through the book.\n\nTake five minutes to think\
    \ about what it means to be human.\n"
