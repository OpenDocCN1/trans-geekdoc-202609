    ## 1.3 总结


    本章介绍了 AI 及其与人类智能关系的基础概念。本章通过将 AI 设定为一种学习智能体（类似于人类智能，通过与环境交互来实现目标），为理解 AI 奠定了基础。AI
    涵盖了创建智能实体的过程，而机器学习（ML）则涉及系统从数据中学习的能力。


    本章为深入探索 AI 奠定了基础，阐明了其目标和局限性。通过理解智能、学习和科学方法的核心原则，你已准备好在后续章节中对 AI 的应用、伦理影响和未来发展进行更详细的分析。


    # 2 伦理与治理


    在本章中，我们将理解伦理以及 AI 伦理如何让我们更审慎地思考 AI 的益处，以及 AI 如何能够改善事物——这是一种以人为中心的伦理目标。这本质上是人类所重视的价值，价值观根据每个人的背景而异，并随着时间而改变。我们也可以将其视为引导我们所预期的价值和权利的原则。


    AI 和 ML 绝非万灵药——灵丹妙药。Fred Brooks 通过区分两种类型来帮助我们理解复杂性：可以修复的“偶然复杂性”，以及必须由系统本身承认并处理的“本质复杂性”（Brooks,
    1986）。Brooks 的严谨思考给了我们一个警告：当我们工程化处理偶然复杂性时，AI/ML 有很大机会帮助到我们，但本质复杂性是 AI/ML 可能无法帮助我们解决的。通过
    Cynefin 等框架（Cynefin, 2023），可以进一步增强我们对所面临问题的理解。我们的团队（包括领域专家）必须与利益相关者合作，以确保伦理和治理从项目开始并贯穿整个生命周期。这意味着我们的
    AI 团队在伦理原则（Floridi and Cowls, 2019）的指导下，将以人为中心的伦理目标整合到 AI 系统的设计中，这些原则优先保护人权和价值观。


    ## 2.1 伦理 AI


    作为欧盟道德 AI 指南的一部分，我们必须理解 AI 的伦理挑战（欧洲委员会, 2024）。这绝不是一个简单的主题；例如，我们必须考虑：


    我们如何处理伦理？


    谁负责？


    法律是如何说的？


    人权又如何？


    机器权利又如何？


    随着通用人工智能（AGI）和强人工智能的出现，机器人成为另一个伦理问题。工程与物理科学研究委员会（Wikipedia Contributors, 2024k）已发布了机器人
    AI 的通用方法。其他组织也在准备 AI 原则；包括国际标准化组织（ISO）。来自 ISO 等组织的输出包含了关于定义（ISO/IEC, 2022a）、风险（ISO/IEC,
    2023b）、管理（ISO/IEC, 2023a）和指导（ISO/IEC, 2022b）的标准。


    来自各种机构提出的关键主题包括透明度、问责制以及在考虑偏见、多样性、不平等和失业时所采取的关注。这些主题与良好的伦理相联系。欧盟围绕一个可以衡量的伦理目标构建了
    AI 指南（欧洲委员会, 2024），例如使用联合国的可持续发展目标（联合国, 2015）。这些指南现在已成为欧盟的 AI 法律（欧洲议会, 2023）。


    ### 2.1.1 AI 治理


    AI 治理指的是一套政策、流程和控制框架，旨在确保 AI 系统以伦理、透明且负责任的方式开发和部署。它涉及为数据使用、算法公平性和决策过程设定标准，以减轻偏见、隐私侵入和缺乏解释性等风险。有效的
    AI 治理旨在平衡创新与个人权利及社会价值观的保护，促进对法律和伦理标准的信任和合规。


    ### 2.1.2 以人为中心的伦理目标 – 基本权利、原则和价值观


    作为欧盟关于伦理 AI 指南的一部分，我们必须理解 AI 引发的伦理挑战（欧洲委员会, 2024）。这绝不是一个简单的主题；例如，我们必须考虑：


    我们如何处理伦理？


    谁负责？


    法律是如何说的？


    人权又如何？


    机器权利又如何？


    随着 AGI 和强人工智能的出现，机器人成为另一个伦理问题。工程与物理科学研究委员会（Wikipedia Contributors, 2024k）已发布了机器人
    AI 的通用方法。其他组织也在准备 AI 原则；包括国际标准化组织（ISO）。来自 ISO 等组织的输包含了关于定义（ISO/IEC, 2022a）、风险（ISO/IEC,
    2023b）、管理（ISO/IEC, 2023a）和指导（ISO/IEC, 2022b）的标准。


    来自各种机构提出的关键主题包括透明度、问责制以及在考虑偏见、多样性、不平等和失业时所采取的关注。这些主题与良好的伦理相联系。欧盟围绕一个可以衡量的伦理目标构建了
    AI 指南（欧洲委员会, 2024），例如使用联合国的可持续发展目标（联合国, 2015）。这些指南现在已成为欧盟的 AI 法律（欧洲议会, 2023）。


    ### AI 治理


    AI 治理指的是一套政策、流程和控制框架，旨在确保 AI 系统以伦理、透明且负责任的方式开发和部署。它涉及为数据使用、算法公平性和决策过程设定标准，以减轻偏见、隐私侵入和缺乏解释性等风险。有效的
    AI 治理旨在平衡创新与个人权利及社会价值观的保护，促进对法律和伦理标准的信任和合规。


    ### 2.1.2 以人为中心的伦理目标 – 基本权利、原则和价值观


    以人为中心的伦理目标旨在保护人权和价值观。它基于联合国人权宣言和欧盟基本权利宪章。这些指目标是可以衡量的。这些指南现在已成为欧盟的 AI 法律。我们还需要注意的是，人类兼容人工智能中心（https://humancompatible.ai）正在产生以伦理原则为指导的
    AI 设计。该中心是由《人类兼容：人工智能与控制问题》一书的作者 Russell（2019）创立的，书中探讨了 AI 的控制问题。


    #### 2.1.2.1 生命研究所 (Future of Life Institute)


    生命研究所制定了关于 AI 的**阿西马原则**（https://futureoflife.org）。这些原则涉及：


    - 研究 – 目标、资助、政策、文化、规避竞争。

    - 伦理与价值观 – 安全、透明度、责任、价值对齐、人类价值观、个人隐私、共同繁荣。

    - 长期问题 – 能力预防、递归自我改进、共同利益。


    “阿西马”这个名字的灵感源于 1975 年极影响力的阿西马重组 DNA 会议。生物技术界深受该会议的影响。


    #### 2.1.2.2 欧盟 – AI 指南与 AI 法案


    欧盟是应对 AI 伦理问题的先驱之一。它产生了 AI 指南，并在其 AI 法案中将其明确化。AI 伦理指南由欧洲委员会的人工智能高级专家小组产生（欧洲委员会,
    2024）。这些指南针对信赖 AI。信赖 AI 基本包含两个部分：


    1. 它应该尊重基本权利、适用法规和核心原则价值观，确保“伦理目标”。

    2. 它在技术上应该是健壮且可靠的，因为即使意图良好，缺乏技术掌握也可能造成无意伤害。


    #### 2.1.2.3 ISO/IEC


