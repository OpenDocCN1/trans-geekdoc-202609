- raw: 'Association – here features of data can be associated with other features
    and, in an unsupervised learning condition, can then associate other data, for
    example people who generally buy bread and butter also typically buy milk.


    Control – where the error measurement between a set point and a measured value
    will help to decide what to do, for example an autonomous vehicle controller can
    either apply controlled braking or a collision avoidance manoeuvre.


    In Table 4.1 we show a broad correlation between learning models, algorithm types
    and example algorithms, some of which will be described later in this chapter.


    4.2.3.2 What is special about AI/ML algorithms?


    Generally, an algorithm takes some input and uses mathematics and logic to produce
    the output. In contrast, an AI algorithm takes a combination of both – inputs
    and outputs – simultaneously in order to ‘learn’ from the data. In ML, once it
    has been trained, the ML algorithm can produce outputs when given new inputs.


    Table 4.1 Examples of the types of learning and algorithms


    | ^(ML categories) || ^(Algorithm types) || ^(Example) |


    | --- | --- | --- |


    | ^(Supervised learning/labelled data)  || ^(Regression)  || ^(Decision tree Linear
    regression)  |


    | ^(Classification)  || ^(SVM KNN Naive Bayes)  ||  |


    | ^(Unsupervised learning/unlabelled data)  || ^(Clustering)  || ^(K-means)  |


    | ^(Association)  || ^(Apriori)  ||  |


    | ^(Semi-supervised learning/mix of labelled and unlabelled data)  || ^(Classification)  ||
    ^(Semi-supervised SVM)  |


    | ^(Clustering)  || ^(K-means)  ||  |


    | ^(Reinforcement learning)  || ^(Classification)  || ^(Ensemble learning – decision
    forest)  |


    | ^(Control)  || ^(Q-learning)  ||  |


    4.2.3.3 What are self-learning algorithms?


    A self-learning algorithm is programmed to refine through iteration its own performance;
    that is, it learns from itself to improve its accuracy in its ability to perform.
    In the context of ML, this often requires considerable computational resource.
    It can be best described as a system into which you feed your requirements (i.e.
    the desired outcome plus various parameters) and over time the outcome is achieved.
    An example is recommendation engines where the system gets better and better at
    recommending ‘things’, which people then purchase as more data points are processed.


    4.2.3.4 What are the algorithms used in ML and AI?


    ML and AI algorithms include:


    Linear regression – this is a model that assumes a linear relationship between
    the input variables (x) and the single output variable (y). More specifically,
    that y can be calculated from a linear combination of the input variables (x).
    For example, imagine arranging a number of blocks by weight variable y when you
    cannot weigh them and only know their x (length, height and width) variables.
    A single input is known as simple linear regression and multiple input is known
    as multi-variable, multi-variate or multiple linear regression. One use could
    be to predict a human’s ideal weight based on height, build, gender and so on.


    Logistic regression – this is a mathematical model used in statistics and ML to
    estimate the probability of an event occurring having been given some previous
    data. Logistic regression works with data where either the event variable (y)
    happens (1), or the event does not happen (0). An example could be around credit
    card transaction approval when multiple inputs such as time of purchase, place
    of purchase and type of purchase may determine if the transaction is approved
    or not.


    Decision tree – this is one of the most common ML algorithms in use today. It
    is a supervised learning algorithm used for classifying problems by moving down
    a tree root from node to node testing an attribute at each node. It is typically
    used in expert or smart systems: it can advise a course of action to be taken
    based on previous successful actions, and is typically seen as a series of questions
    and suggestions culminating in a ‘was this information useful?’ question on self-help
    computer systems. An example could be the fault light on a non-functioning printer:
    is it red or green? If green, then check if there is paper in the input tray,
    if the answer is yes, then check for a paper jam and so on, until the problem
    is identified. The learning element of the algorithm can weight suggestions based
    on previous successes with particular attributes. Equally, decision trees can
    be used in association to classify patients and likely disease based on health
    questions, or loan applications and previous credit history.


    Random forest – this is an ensemble learning method for classification, regression
    and other tasks. It operates by constructing a multitude of decision trees at
    training time and outputting the class that is the mode of the classes or mean/average
    prediction of the individual trees. With that said, random forests are a strong
    modelling technique and much more robust than a single decision tree. Random forests
    aggregate many decision trees, which limits the over-fitting problem of deep decision
    trees as well as error due to bias, and therefore the ability of the system to
    give useful and meaningful results. The use of random forest adds additional randomness
    to the model, while growing the trees. Instead of searching for the most important
    feature while splitting a node, it searches for the best feature among a random
    subset of features.


    A commonly used example to explain the difference between decision trees and random
    forests is that in a decision tree a person may ask one friend to recommend a
    holiday destination based on a number of questions about preferences and previous
    holidays, whereas in random forest mode a person may ask the advice separately
    of multiple friends who again ask a series of different random questions based
    on their individual likes/dislikes and previous experiences of different holiday
    experiences.


    KNN – this is a supervised learning algorithm. This means that we train it under
    supervision and using the labelled data already available to us. It is a relatively
    simple algorithm used by many organisations and software tools – simple in that
    it assumes that similar things exist in close proximity to one another. It is
    typically used in recommendation applications or ‘more like this’ type systems
    such as Amazon recommending books or Netflix recommending films based on a particular
    genre, category, rating, lead actor, director and so on.


    The classic travelling salesperson problem is often solved using a nearest neighbour
    heuristic, and is one of the first algorithms that comes to mind in attempting
    to solve this particular type of location/route problem. This classic problem
    is one in which a salesperson has to plan a tour of cities that is of minimal
    length. In this heuristic, the salesperson starts at some random city and then
    visits the city nearest to the starting city and so on, only taking care not to
    visit a city twice. At the end, all cities must be visited and the salesperson
    must return to the starting city. Use of the KNN algorithm gives a quick solution
    compared to a brute force approach where every permutation is calculated. It should
    be noted, however, that KNN may not always give the optimal route, especially
    if there are many data points. The KNN can be applied to many other movement problems,
    such as moving a robot or planning the router of a machine tool.


    SVM – this is a supervised ML algorithm that can be used for both classification
    and regression challenges. An SVM model can be best described as points in space
    mapped into categories separated by gaps that are as wide as possible. New data
    points then fall on one side of the gap and are then placed into that category.
    SVMs have many uses, ranging from image recognition to handwriting recognition
    to satellite data classification. A simple example may be categorising images
    of cats and dogs where an image must fall on one side or other of the gap.'
