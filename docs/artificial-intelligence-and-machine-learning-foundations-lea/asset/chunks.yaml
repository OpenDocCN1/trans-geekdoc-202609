    ML，专注于特定任务（例如监督学习和无监督学习）。狭义 ML 的示例包括支持向量机（SVMs）、决策树和 K-近邻（KNN）算法。它们基于特定任务测试假设。从经验中学习是针对特定的、聚焦的任务的。


    通用人工智能（AGI）是一种能够学习人类可以胜任的任何智力任务的机器。它是假设性的，对于通用的 AI 和 ML 而言并非必须的。这种假设的 AI 类型通常是推测的主题，有时令人类感到恐惧。我们距离
