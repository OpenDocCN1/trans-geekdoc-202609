    \ the next natural step – multiple agents, multiple intelligent robots and, of\
    \ course, multiple intelligent humans interacting.\n\n## 3.2.4 Machine learning\
    \ basics\n\nML is about learning from data. What we see today, in 2024, is the\
    \ rapid growth and adoption of narrow ML. We have concentrated on narrow AI, and\
