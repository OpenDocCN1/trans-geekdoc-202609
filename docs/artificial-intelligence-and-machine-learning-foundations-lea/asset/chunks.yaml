- raw: '6.3.1.1 Potential problems of AI


    The existential risks associated with the use of AI are serious and well-recognised
    by experts in the field. These risks primarily stem from the potential for AI
    to surpass human intelligence and operate in ways that could be harmful if not
    properly controlled or aligned with human values. These can be summarised as follows:


    Misaligned objectives – an AI system could develop goals that are not aligned
    with human values and interests and, if the AI has advanced capabilities, it might
    pursue these goals in ways that are detrimental to humanity.


    Loss of control – as AI systems become more autonomous and capable, there is a
    risk that humans might lose control over them and this could happen if the AI
    develops the ability to resist human intervention or if it becomes too complex
    for humans to understand and manage.


    Unintended consequences – even well-intentioned AI systems can have unintended
    consequences due to unforeseen interactions or emergent behaviours, and the complexity
    of AI systems can make it difficult to predict all possible outcomes.


    Self-improvement and runaway AI – a super-intelligent AI might enter a self-improvement
    loop, rapidly enhancing its own capabilities beyond human control, and this ‘intelligence
    explosion’ could lead to an AI that is vastly more powerful than any human oversight
    can manage.


    Ethical and value alignment – ensuring that AI systems operate according to human
    ethical standards and values is a significant challenge; the misalignment in ethical
    frameworks could lead to AI making decisions that are morally unacceptable.


    Weaponisation – AI technologies could be used to develop autonomous weapons and
    other military applications that operate without human oversight, leading to uncontrolled
    and potentially indiscriminate use of force.


    Economic and social disruption – the widespread implementation of AI could lead
    to significant economic and social disruptions, such as mass unemployment, inequality
    and social unrest and, while not necessarily existential, these disruptions could
    contribute to broader societal collapse. The internet and poor IT security has
    given AI the opportunity for widespread manipulative and criminal behaviour. These
    include the quick exploitation of security failures, phishing and SMS scams, fake
    videos, audio and text and social manipulation. In the latter example, this has
    led to alledged manipulation of voting in elections all over the world.


    ## 6.4 CONSCIOUSNESS AND ETHICAL AI


    Human consciousness, sometimes referred to as sentience, is, in its simplest terms,
    having an awareness of an internal or external existence or having a mental state
    you are aware of being in. This can be compared to subconsciousness, which is
    that part of your mind that notices and remembers information when you are not
    actively trying to do so and can often influence your behaviour even though you
    do not realise it.


    Our human experience is inherently subjective and the way we judge situations
    or actions varies from person to person. As a result, ethics becomes a complex
    area that anyone working with AI must carefully consider. Since ethics are shaped
    by individual perspectives, understanding it requires thoughtful consideration
    of everyone''s unique experiences.


    AI is steeped in the scientific method and uses a basis of objects to make sense
    of our random, non-linear and complicated world. To do this we use objective science.
    Objectivity strives to provide a clear and unbiased view of reality, minimising
    the influence of subjective factors and personal biases. In the simplest terms,
    objectivity is something we all agree on.


    ## 6.4.1 AI and consciousness


    Some humans fear conscious machines, however unlikely they may be. Consciousness
    is a complex area at the cutting edge of AI research; our knowledge is growing,
    but we might never understand what consciousness actually is. Interfacing the
    human mind with machines could advance medical success or outcomes – examples
    that are currently being explored include stroke recovery.


    The most influential modern physical theories of human consciousness have been
    proposed by numerous neuroscientists, physicists and philosophers over the last
    couple of centuries, and they seek to explain consciousness in terms of neural
    events occurring within the brain.


    Nobody currently knows where consciousness actually comes from, but it’s thought
    to be an emergent property that comes from neurons connected in a specific but
    complex way. We do understand how parts of our brain function, but much is still
    unknown. Interestingly, the study of organoids (e.g. small blobs of brain tissue
    grown in the laboratory) is allowing scientists to gain an understanding of how
    parts of the brain function.


    In a broader physiological sense, our AI or more specific ML focuses on the cognitive,
    digital voice in our brain as being some sort of representation of consciousness
    – generative AI and large language models being our most up-to-date attempt. Our
    human whole body subjective experience draws on our brain, heart and stomach as
    well the interaction with our senses through the autonomous nervous system and
    vagus nerve. Where do you feel nervous? Describe love. As you can see, our AI
    and ML isn’t anywhere close yet.


    Machine consciousness or artificial consciousness is the domain of cognitive robotics
    and is primarily concerned with endowing an artificial entity with intelligent
    behaviour by providing it with a processing architecture. This will allow it to
    learn and reason about how to behave in response to complex goals in a complex
    world. The aim of the theory of artificial consciousness is to define what would
    have to be synthesised to develop artificial consciousness in an engineered artefact
    such as a robot.


    Many organisations are pursuing developments in artificial consciousness, but
    comparing consciousness in functional machines to consciousness in functional
    humans is more difficult than expected and the topic has raised a debate around
    the risks of developing conscious machines.


    Rather than sprinting into a rabbit warren of opinion, let’s look at how we may,
    in general, describe consciousness, the state of being aware of and able to think
    about one’s own existence, thoughts, and surroundings; or, as René Descartes (1596–1650)
    expressed it (Wikipedia Contributors, 2024b):


    I think, therefore I am.


    We can notice straight away that AI, an objective science, may be used to study
    our subjective experience. AI can certainly help us with understanding complex
    and random systems way beyond a human’s capabilities. Anil Seth, a scientist who
    has devoted 20 years to the study of the human brain, describes that there is
    no requirement of intelligence for something to be conscious (Seth, 2021). His
    research emphasises that consciousness is about having subjective experiences
    and awareness, whereas intelligence is related to problem-solving abilities, learning
    and adaptability. This isn’t good news for those who have the view that today’s
    digital AI (ML really) will suddenly become conscious. Perhaps it will reassure
    those who fear AI; however, we simply don’t know how AI will ultimately evolve,
    but its effect on humans and society as a whole must be a priority. Indeed, in
    1972 Herbert Dreyfus predicted we would come to this end point in his book, What
    Computers Can’t Do.


    Francis Crick is more frank about what consciousness is in his book, The Astonishing
    Hypothesis: The Scientific Search for the Soul (1994):


    you, your joys and your sorrows, your memories and your ambitions, your sense
    of personal identity and free will, are in fact no more than the behaviours of
    a vast assembly of nerve cells and their associated molecules.'
