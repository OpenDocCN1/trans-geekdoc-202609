    The program now looks at the percept and updates its own internal world (state).


    The program can then assess the possible actions and future states, and uses the
    reflex agent approach to determine what actions to take.


    Example: an underwater vehicle loses visual sensor data from stirring up silt
    – there’s not enough light – but it can continue on using its 3D mapped geometrical
    model.


    ### 3.2.2.3 Goal-based agent


    Goal-based agents can further expand on the capabilities of the model-based reflex
    agents by using ‘goal’ information. The goal information describes situations
    that are desirable.


    Search and planning are the subfields of AI devoted to finding action sequences
    that achieve the agent’s goals:


    The program needs more than just sensors and an internal world to implement the
    agent’s functionality: it needs a goal.


    These programs are more versatile and flexible and can adapt to changes.


    Example: an autonomous vehicle can choose one of five exits from a motorway –
    goals could be the safest, quickest, most scenic, cheapest and/or shortest route.


    ### 3.2.2.4 Utility-based reflex agent


    A utility-based agent is an agent that is a step above the goal-based agent. Its
    actions are based not only on what the goal is, but the best way to reach that
    goal. In short, it is the usefulness or utility of the agent that makes it distinct
    from its counterparts. The utility-based agent makes its decisions based on which
    action is the most pleasing or the most effective at achieving a goal. The goal
    is measured in terms of the agent’s utility.


    Utility is the scientific way economists measure an agent’s happiness; it is more
    versatile than a simple binary yes/no or happy/unhappy output, it actually measures
    how useful it is.


    Example: an AI chatbot doctor assesses the efficacy of a treatment based on a
    patient’s individual medical history and current health needs – that is, what
    utility is this medication to the patient?


    ### 3.2.2.5 The relationship of AI agents with machine learning


    An agent should be autonomous. What this means for an intelligent entity is that
    it can learn, and make up for incomplete knowledge and incorrect prior knowledge.
    For example, the Deep Blue machine that beat the world chess champion had not
    learned how to do that by itself. It relied on the prior knowledge of the programmers
    to win its games.


    A truly rational agent should be autonomous – it should learn to make up for incomplete
    and incorrect prior knowledge – but we think it’s safe to say that we are concerned
    about agents having too much autonomy. It should be recognised that, at present,
    a robot can’t just wake up one day and start doing something; we need to be realistic
    and give the robot a sensible starting point.


    An agent lacks autonomy if it relies on prior knowledge from its designer, but
    there needs to be some prior knowledge to get it going. It will certainly need
    an initial condition.


    ## 3.2.3 Role of robotics in AI


    As discussed in Chapter 1, the word ‘robot’ came into use in Czech-born Karel
    Čapek’s 1920 stage play R.U.R., which stands for Rossumovi Univerzální Roboti
    (Rossum’s Universal Robots). The play opens in a factory that makes artificial
    people called ‘robots’. The robots in the play are closer to the modern idea of
    androids or even clones, as they can be mistaken for humans and can think for
    themselves. Without giving the plot away too much, after initially being happy
    working for humans, a hostile robot rebellion then ensues that leads to the extinction
    of the human race. As we mentioned earlier, the word ‘robot’ comes from the Slavic
    language word robota, meaning ‘forced labourer’. Nowadays we consider a robot
    to be a machine that can carry out a complex series of tasks automatically, either
    with or without intelligence.


    Robots have been around for more than 60 years. In 1954 George Devol invented
    the first digitally operated and programmable robot, called the `Unimate`. In
    1956 he and his partner Joseph Engelberger formed the world’s first robot company,
    and the `Unimate`, the first industrial robot, went online in the General Motors
    automobile factory in New Jersey, USA, in 1961. Robot development has been ongoing
    around the world ever since, and robots in various guises are now in general use
    in most factories and distribution centres around the world, quite often working
    with and alongside humans on complex production lines.


    You may even have allowed domestic robots to invade your own home – robotic vacuum
    cleaners, first appearing in 1996, are the most widely recognised. The `Roomba`,
    first introduced in 2002, is an autonomous robotic floor vacuum cleaner with intelligent
    programming. Despite nearly 20 years of development, AI home helpers still struggle
    with obstacles such as dog faeces, cables and shoes. Similar technologies are
    often employed to mow lawns, but also struggle with discarded garden toys and,
    of course, humans’ best friend.


    One of the most widely recognised robots is `ASIMO` (Advanced Step in Innovative
    Mobility), which is a small child-like humanoid robot created by Honda in 2000
    (see Figure 3.3). It has been developed continually since then and now has become
    one of the world’s most advanced social robots. Unfortunately, `ASIMO` has recently
    gone into retirement, but Honda say that the technology will be diverted into
    ‘nursing care’ robots in the future.


    Figure 3.3 Honda’s `ASIMO`, conducting pose captured on 14 April 2008 (https://commons.wikimedia.org/wiki/File:ASIMO\_Conducting\_Pose\_on\_4.14.2008.jpg;
    Creative Commons Attribution-Share Alike 3.0 Unported licence)


    ![image-S2WD9QDS.jpg](images/image-S2WD9QDS.jpeg)


    Although many people look towards the positive aspects of robot development, others
    see robots in a negative light and project a future in which robots take jobs
    from human workers. However, ‘crystal ball gazers’ generally believe that the
    AI and robotics industries will probably create as many new jobs as are lost through
    increased automation.


    Although we have focused so far on intelligent robots, the vast majority in operation
    are unintelligent (i.e. there is no learning) and simply follow a computer program
    to carry out a limited action. Now, if we apply AI techniques to robots and allow
    them to learn and work autonomously across a number of areas, we could equally
    have created either a useful home assistive robot or the robot from The Terminator,
    depending on your point of view.


    ### 3.2.3.1 Robotic paradigms


    A paradigm is a philosophy or set of assumptions and/or techniques that characterise
    an approach to a class of problems. The word paradigm comes up a lot in the academic,
    scientific and business worlds. When you change paradigms, you are changing how
    you think about something; it is a way of looking at the world – it is also a
    set of tools for handling and solving robotic problems.


    Specifically, in robotics, a robotic paradigm is a mental model of how a robot
    operates. A robotic paradigm can be described by the relationship between the
    three primitives of robotics: sense, plan and act. It can also be described by
    how sensory data are processed and distributed through the system, and where decisions
    are made.


    In robotics, there are three paradigms:


    1. `hierarchical`;

    2. `reactive`;

    3. `hybrid hierarchical–reactive`.


    These three paradigms are used for organising intelligence in robots – and selecting
    the right paradigm makes problem-solving easier. The hierarchical, reactive and
    hybrid hierarchical–reactive paradigms all use two or three robotic primitives:


    `sense` (uses information from sensors and the output is sensed information);


    `plan` (sensed or cognitive information and the output is a directive);


    `act` (sensed information or directives and the outputs are actuator commands).


    In robotics there are two ways to describe a paradigm: either by the relationship
    of sense, plan and act, functions the robot undertakes are categorised into the
    three primitives; or by the way sensor data are utilised and organised:

