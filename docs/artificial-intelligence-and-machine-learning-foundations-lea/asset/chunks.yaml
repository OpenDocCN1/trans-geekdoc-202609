- raw: 'Again, we notice immediately that there is considerable learning from experience
    involved in these eight stages. They are not sequential, and we may revisit or
    loop over stages 1–5, 1–7 or 1–8 – going through stages 1 to 8 in one pass will
    be the exception rather than the rule. We might use smaller data groups so we
    can learn quicker because we are not processing lots of data. This can be helpful
    when assessing multiple algorithms, as there is more work associated with this.
    Some learning can be gained by working on smaller subsets at an early stage. It
    simply reduces the time between iterations.


    If we have the luxury of a large data set, we will need to break up the data into
    training data and test data. This is important for the trade-off, where we want
    to trade off complexity and error; this is covered in more detail in Section 4.2.3.9.
    We might then break up our training data into data bins of different sizes and
    use those different sized bins to test our algorithms. As we refine our approach,
    we can then use the test data to see if our learning works on data that have not
    been seen by the AI or ML system before.


    Test data must not be used for training your AI or ML system. One of the reasons
    for doing this is that the algorithm will use the test data while training, so
    we already know how well the algorithm deals with these data. It is essentially
    a waste of time because we are not adding further information to the system. Independent
    test data give us an independent test of the ML we have done.


    Once we have our data and they are divided up into appropriate bins, we can then
    start to clean or scrub the data. This means that we prepare our data in such
    a way that they give our algorithms the best chance of success.


    In AI, we can encounter many data types, such as numbers, strings and Booleans,
    or they could be more sophisticated data, such as audio files, movie files, script,
    text, documents and, perhaps, signals from actuators, sensors – we might even
    have to generate our own data in simulations. Digital twin is an exciting development
    that has gained momentum over the last 20 years or so. Data will come to us in
    many forms, in varying quantities.


    In AI, we will need to work with analogue data. Here we’ll typically employ analogue
    to digital converters so we can represent an analogue signal as a series of discrete
    numbers that can be understood by a digital computer.


    Part of the preparation of data is data cleaning or data scrubbing. As we are
    going through the stages of a ML project, we must always be aware of the quality
    of our data preparation. Poor data preparation will give spurious ML results or
    misrepresent the data we are trying to analyse.


    Scrubbing can include:


    reducing the volume of the data we are working on, perhaps removing irrelevant
    data;


    reformatting data;


    removing incomplete or duplicated data;


    dealing with missing data;


    generating data;


    scaling data so algorithms perform well.


    There are many tools and techniques for data preparation and standard libraries
    to help us, and we need experience to do this well.


    As important as data preparation is data visualisation. Visualisation of data
    (see Section 4.1.1.5) will also affect how you prepare your data. This is often
    overlooked until we try to visualise a data set that spans multiple processors
    on a large supercomputer.


    ## 4.2.3 Algorithms that learn from data


    Algorithms are at the core of problem-solving, engineering and computer science.
    In AI, we are interested in how they can help us with learning from experience;
    how they can help us to create intelligent entities, products and services that
    can learn and improve. Algorithms are studied academically, and this can lead
    to a lifetime’s pursuit into complex and rich research. Algorithms are also simple
    procedures we use to teach ourselves how to program a digital computer (from simple
    flowcharts to complex event-driven object-orientated software). Narrow AI, and
    in particular narrow ML, give us a chance to understand how an algorithm can learn
    from data. The NN and its many variants teach themselves how to solve a problem.
    It is an algorithm that learns its own algorithm to, say, play chess.


    We should note that an AI or ML algorithm may not always be the best option to
    solve our problems. Scientists, mathematicians and engineers will often have more
    elegant and efficient ways to solve problems. However, we don’t always have this
    capability, and here ML and AI can help us, especially where we have a lot of
    data to work with (e.g. data from telescopes, simulations, sensors and so on).
    Also, algorithms can be expressed in a multitude of ways, as computer code, flowcharts,
    mathematical notation, pseudocode and so on. For those that want to delve deeper
    into algorithms, Tom Mitchell’s book, Machine Learning (2018), provides an excellent
    introduction to many algorithms and their practical uses, including those that
    we describe below and their derivations.


    AI and ML are, at their fundamental core, based on the scientific method, and
    we must use these techniques with care. Our learning problems are non-linear,
    iterative and probably statistical in nature. We must use algorithms cautiously
    because they are often general approaches to problems – domain specific techniques
    may well be far better suited to our problems. Part of our approach to using ML
    and AI is to build our learning and experience of what algorithms can achieve.


    ML and AI draw on techniques from well-established academic disciplines such as
    operational research, control theory, mathematics, numerical analysis and engineering.
    For example, decision trees are frequently associated with ML, but they have been
    at the heart of safety engineering and management theory for decades.


    In this chapter we aim to introduce what an algorithm is and why algorithms are
    so important to ML and AI. Algorithms have their advantages and disadvantages
    in terms of accuracy, performance and processing time. This chapter also includes
    an explanation and examples of a few of the most common algorithms in ML. We will
    explain their use and the challenges that are encountered in deciding which to
    use and why.


    4.2.3.1 What is an algorithm?


    The definition of an algorithm is a process or set of rules to be followed in
    calculations or other problem-solving operations, especially by a computer. Simply
    put, an algorithm is a set of instructions designed to perform a specific task.
    This can be as simple as the process we follow to multiply two numbers together,
    something that we are taught at an early age and take for granted. Humans do this
    in decimal, and computers in binary. It is only when you have to explain what
    you are actually doing that it seems complicated – we need to be explicit because
    our digital computers need explicit instructions. An algorithm could also be something
    far more complex, such as compressing a computer file or playing a compressed
    video file.


    We have previously covered learning types and data types, but it is worth addressing
    the basic concepts again before we go any further into the topic of algorithms.


    In a supervised learning model, an algorithm learns on a labelled data set, which
    provides an answer key that the algorithm can use to evaluate its accuracy on
    training data. In an unsupervised model, it uses provided unlabelled data that
    the algorithm tries to make sense of by extracting features and patterns on its
    own. In both semi-supervised and reinforcement learning models, data can be both
    labelled and unlabelled.


    Basic algorithm types include:


    Regression – generally used for forecasting and finding out the cause-and-effect
    relationship between variables.


    Classification – where input data can be separated into groups, for example male
    or female.


    Clustering – the grouping together of data that are similar, for example grouping
    of images of cats, dogs and rabbits based on data attributes.'
