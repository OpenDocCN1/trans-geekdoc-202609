    这种方法确保了风险管理是结构化的、全面的，并根据组织的背景和目标进行了定制。


    ## 2.3.2.1 SWOT、PESTLE 和 Cynefin


    在本节中，我们将简要概述一些理解风险的技术，以便我们对其进行管理。第一个是 `SWOT` 分析，它关注组织内部和外部的机会与威胁。第二个是 `PESTLE`，这是一种理解利益相关者的流程。最后是
    `Cynefin`，一种用于理解你的 AI 项目并管理复杂性与混沌的方法。


    通过使用 `SWOT` 分析来管理 AI 风险，组织可以获得对其内部能力和外部环境的洞察，使其能够做出明智的决策并采取主动措施来减轻风险并最大化采用 AI
    的收益。这在图 2.4 中示意地所示。


    图 2.4 SWOT 分析


    ![image-8XA0ULOA.jpg](img/image-8XA0ULOA.jpeg)


    `SWOT` 分析的输出结果——行动计划，可以用于利用机会和减轻风险。随着项目的进行，行动计划可以从经验中学习。


    通过 `PESTLE` 分析，组织可以全面理解影响 AI 风险和机会的外部因素。这种分析使组织能够制定考虑到 AI 运行广泛背景的战略计划和风险管理策略，确保符合监管要求、社会预期和环境考量的同时，最大化采用
    AI 的收益。这在图 2.5 中示意地所示。


    `Cynefin` 在图 2.6 中示意所示，它通过承认 AI 系统固有的复杂性和不确定性，为理解和管理 AI 风险提供了一个结构化框架。


    图 2.5 PESTLE 分析


    ![image-L5G0IKQ3.jpg](img/image-L5G0IKQ3.jpeg)


    图 2.6 Cynefin


    ![image-C35H88OR.jpg](img/image-C35H88OR.jpeg)


    `Cynefin`框架由 David J. Snowden 于 1999 年开发。它旨在帮助领导理解每个情况都是不同的，需要独特的决策方法。该框架概述了五个由因果关系定义的情景领域。通过根据风险的性质和背景对其进行分类，组织可以此定制其风险管理策略和应对措施，从而在
    AI 领域实现更有效的风险缓解和决策。此外，`Cynefin` 帮助领域专家和 AI 专家评估窄 AI 是否可以提供帮助。专注于定义任务的窄 AI 可以在清晰领域（clear
    domain）中更容易评估。复杂领域（complicated domain）需要更仔细地考虑窄 AI 如何提供帮助；领域专家在该领域将发挥关键性作用。在复杂领域（complex
    domain）中，管理方法必须拥抱实验、自适应方法和场景规划以应对不确定性。它将使用模拟、建模和场景分析等技术来理解潜在风险，并根据情况的发展制定敏捷响应。这可能涉及基于领域专家模拟的复杂
    AI，或者正如 Brooks 所描述的，它很可能包含本质复杂性。


    ## 2.3.2.2 以人为中心的 AI


    以人为中心的 AI (`HCAI`) 是一种设计和部署 AI 系统的方法，其主要关注在于增强人类能力、确保有意义的用户控制并促进人类价值观。`HCAI` 旨在创建不仅在技术上有效而且在社会伦理上负责的
    AI 技术。


    `HCAI` 的核心原则是：


    - **用户赋能**：AI 系统应该通过增强用户的能力和支持其目标来赋能用户，而不是取代人类角色。目标是创建增强人类决策、创造力和解决问题的工具。

    - **透明度与可解释性**：AI 系统在如何运行和做出决策方面应该是透明的。通常采用可解释 AI (`XAI`) 技术以确保用户能够理解、信任并妥善地管理
    AI 的输出。

    - **伦理考量**：`HCAI` 强调 AI 的伦理影响，包括公平性、问责制和偏差缓解。它寻求设计尊重用户隐私、确保数据安全并促进公平的 AI 系统。

    - **可用性与用户体验 (UX)**：AI 系统的设计应优先考虑可用性和 `UX`，确保它们直观、易用并对用户需求做出响应。这包括基于用户反馈的迭代测试和改进。

    - **协作与交互**：`HCAI` 专注于促进人类与 AI 系统之间的有效协作。它鼓励设计促进顺畅交互的设计，使 AI 系统作为协作伙伴而非自主代理。


    ## 2.4 总结


    本章重点关注对于 AI 系统负责任开发和部署至关重要的伦理考量和治理框架。它强调了以人为中心的伦理目标的重要性，确保 AI 与人类价值观、权利和社会福祉保持一致。围绕透明度、问责制和公平性的
    AI 伦理对于防止偏差、隐私侵犯和无意伤害至关重要。


    本章引入了与 AI 相关的关键伦理问题，例如责任、人权以及高级 AI 系统（如 `AGI`）带来的挑战。它强调了伦理框架和治理的重要性，并引用了来自 `EU`
    和 `ISO` 等组织的指南。讨论了 `EU` 的《AI 法案》，其作为一个开创性的监管框架，旨在确保 AI 尊重基本权利并促进透明与安全。


    本章还探讨了 AI 治理，这涉及为数据使用、算法公平性和决策制定标准，以构建可靠的 AI 系统。此外，本章回顾了包括 `US`、日本、加拿大和 `UK` 在内的各国在制定伦理
    AI 标准方面的努力，强调伦理 AI 必须是更广泛的监管和风险管理策略的一部分，以防止潜在伤害。


    最后，探讨了偏差、透明度和 AI 社会影响等伦理关注问题，强调对于开发增强人类能力并符合社会价值观的 AI 系统来说，以人为中心的方法是必要的。本章通过讨论风险管理框架（如
    `SWOT` 和 `PESTLE` 分析）以及监管在平衡创新与安全需求方面的作用作为结束。


