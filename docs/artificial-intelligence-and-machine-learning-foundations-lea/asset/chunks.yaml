    `ISO/IEC` stands for the International Organization for Standardization (`ISO`)
    and the International Electrotechnical Commission (`IEC`). These two organisations
    collaborate to develop and publish international standards in various fields,
    including information technology and telecommunications. `ISO` focuses on a broad
    range of industries and services, while `IEC` specialises in electrical, electronic
    and related technologies. Together, they produce joint standards to ensure quality,
    safety, efficiency and interoperability in technological and industrial sectors
    globally.


    The `ISO/IEC` standards are an international effort to make our AI human-centric
    ethical purpose more explicit. These are explained in more detail Section 2.2.3.


    ### 2.1.2.4 Japan, USA, Canadian and UK AI bodies


    Internationally, Japan has also adopted the human-centric approach to AI. It published
    the ‘Social principles of human-centric AI’ (Cabinet Office, Government of Japan,
    2022). The National Institute of Standards (`NIST`) are active producing US guidelines
    and standards (`NIST`, 2023). In addition, The White House has published the ‘Blueprint
    for an AI bill of rights’ (The White House, 2022). Their neighbours, the Canadians,
    are at the heart of the `ISO/IEC`’s standard 42001 (`ISO/IEC`, 2023a) and also
    published on the responsible use of AI in government (Government of Canada, 2024).
    The UK’s Alan Turing Institute has published an AI standards hub, a sensible starting
    point for AI publications, standards and ethics (The Alan Turing Institute, 2024).


    ## 2.2 UNDERSTANDING THE RISKS AI BRINGS TO PROJECTS


    The challenges to the development and implementation of AI solutions can manifest
    themselves in several ways, including:


    - self-interest;

    - self-review;

    - conflict of interest;

    - intimidation;

    - advocacy.


    These challenges are not trivial and will require managing. Of particular importance
    is the false advocacy of AI’s capabilities; some might say this led to the AI
    winters. Ethical challenges can be compromised by intimidation (think of adversarial
    debate between politicians). Conflicts of interest or self-interest must be managed
    at all times, but the use of AI introduces the need for transparency, and reviews
    and audits of the AI’s output are necessary to ensure it is fit for purpose and
    fair.


    ### 2.2.1 Ethical concerns in AI


    We all want beneficial AI systems that we can trust, so the achievement of trustworthy
    AI draws heavily on the field of ethics. AI ethics could be considered a subfield
    of applied ethics and technology, and focuses on the ethical issues raised by
    the design, development, implementation and use of AI technologies.


    The goal of AI ethics is therefore to identify how AI can advance or raise concerns
    about the ‘good’ life of individuals, whether this be in terms of quality of life,
    mental autonomy or freedom to live in a democratic society. It concerns itself
    with issues of diversity and inclusion (with regard to training data and the ends
    to which AI serves) as well as issues of distributive justice (who will benefit
    from AI and who will not).


    What comes out of consideration of AI ethics are some general themes that most
    agree on:


    - **Transparency** – we might think of this as how we understand what went wrong
    when AI gets it wrong. Can we be explicit as to why an AI technology failed? For
    instance, a `NN` is generated by an algorithm that we can understand; however,
    for it to be transparent we would also need to understand explicitly why the `NN`
    came to a particular outcome. It gives us a basis on which to learn how the AI
    system performed and why.

    - **Accountability** – we need to be careful or we could get inequality, bias,
    unemployment and so on.

    - **Weaponisation** – creating lethal autonomous weapons is a red line that we
    must not cross; however, national security is a special subject that is beyond
    the general use of AI in society.

    - **Harm** – the AI must do no harm.

    - **Human dignity** – protecting an individual’s right to be valued and respected
    for their own sake, treated them ethically.

    - **Safety and security** – almost goes without saying, but this is an important
    ethical concern.

    - **Privacy** – this has been a source of much political debate and is now a fundamental
    requirement, for example with the implementation of the General Data Protection
    Regulation (`GDPR`) in the EU.

    - **Sustainability** – a set of goals that align with our stakeholders and the
    wider community, enshrining intergenerational equity.

    - **Fairness** – along with sustainability, bias raises more ethical challenges
    we must embrace and manage well.

    - **Social benefit** – how does everyone benefit from the opportunities of AI?


    ### 2.2.2 Guiding principles for ethical AI


    Ethics is a philosophical subject that manifests itself in individuals as what
    we term our moral principles; in fact, many people use the words interchangeably.
    Basically, both ethics and morals relate to ‘right’ and ‘wrong’ conduct.


    It is worth noting that ethics, the subject that academics and students study,
    is treated as singular, for example ‘my elected subject this term is ethics’.
    Our moral principles or ethical principles that motivate and guide us are treated
    as plural. This way we can differentiate between the subject, which is singular,
    and a person’s ethical principles, which are plural.


    Further expansion on ethics can be found in *An Intelligent Person’s Guide to
    Ethics* by Lady Warnock (2006).


    Morals tend to refer to an individual’s own personal principles regarding what
    is right and wrong. Ethics generally refer to rules provided by an external source
    or community, for example codes of conduct in the workplace or an agreed code
    of ethics for a profession such as medicine or law.


    Ethics as a field of study is centuries old and centres on questions such as:


    - What is a ‘good’ action?

    - What is ‘right’?

    - What is a ‘good’ life?


    ### 2.2.3 Addressing ethical challenges


    Addressing ethical challenges not only gives us an abundance of knowledge to work
    with, but it also addresses the rogue actors who do not provide AI services and
    products ethically. It builds on the Human Rights Act and data protection legislation.
    Specific legal frameworks give us the means to enforce ethical AI, such as the
    EU’s `AI Act`. So where do we start?


    [Figure 2.1 shows how we can gather guidance from various sources to help us develop
    a human-centric AI that is both trustworthy and robust, with a strong ethical
    foundation. We can start with the Alan Turing Institute’s AI Standards Hub (2024)
    and the `ISO/IEC`’s 42001 standard (`ISO/IEC`, 2023a). From here we might adopt
    the EU’s AI guidelines to produce a set of requirements. This is shown schematically
    in Figure 2.2. The schematic identifies that the 17 United Nations’ sustainability
    goals can be interwoven into our ethical purpose and also that the AI project
    is iterative where we are always learning from experience.](#index_split_021.html#id_Top_of_content0018_xhtml)


    Figure 2.1 Practical AI ethics


    ![image-ZVAESIPK.jpg](images/image-ZVAESIPK.jpeg)


    `ISO/IEC 42001` is considered a good AI governance model as it provides comprehensive
    guidelines for establishing, implementing and maintaining AI management systems.
    It emphasises risk management, ethical considerations, transparency and continuous
    improvement. By covering all phases of the AI lifecycle and extending controls
    to third-party suppliers, it ensures responsible AI development and deployment.
    Adopting `ISO/IEC 42001` helps organisations to build trustworthy AI systems,
    align with regulatory requirements and promote ethical AI practices.

    '
  trans: '


    `ISO/IEC` 代表国际标准化组织 (`ISO`）和国际电工委员会 (`IEC`）。这两个机构合作，在包括信息技术和电信在内的多个领域开发并发布国际标准。`ISO`
    关注广泛的行业和服务业，而 `IEC` 专注于电气、电子及相关技术。它们共同制定联合标准，以确保全球技术和工业部门的质量、安全、效率和互操作性。


    `ISO/IEC` 标准是一项国际性努力，旨在使我们以人为本的 AI 伦理目标更加明确。这些内容在第 2.2.3 节中有更详细的解释。


    ### 2.1.2.4 日本、美国、加拿大和英国 AI 机构


    在国际范围内，日本也采取了以人为本的 AI 方法。它发布了《以人为本的 AI 社会原则》（日本政府内阁，2022 年）。美国国家标准与技术研究院 (`NIST`）积极制定美国指南和标准（`NIST`，2023
    年）。此外，白宫发布了《AI 权利法蓝图》（白宫，2022 年）。他们的邻居加拿大人是 `ISO/IEC` 标准 42001 的核心（`ISO/IEC`，2023a），并发布了关于政府负责任使用
    AI 的报告（加拿大政府，2024 年）。英国的艾伦·图灵研究所发布了 AI 标准中心，这是 AI 出版、标准和伦理研究的一个明智起点（艾伦·图灵研究所，2024
    年）。


    ## 2.2 理解 AI 给项目带来的风险


    AI 解决方案开发和实施面临的挑战可能以多种形式出现，包括：


    - 自利；

    - 自审；

    - 利益冲突；

    - 恐吓；

    - 倡导。


    这些挑战并非小事，且需要进行管理。特别重要的是对 AI 能力的虚假宣传；某些人认为这导致了“AI 寒冬”。伦理挑战可能会因恐吓而受到损害（想想政治家之间的对抗性辩论）。利益冲突或自利必须随时管理，但
    AI 的引入带来了对透明度的需求，对 AI 的输出进行审查和审计是必要的，以确保其符合用途且公平。


    ### 2.2.1 AI 中的伦理关切


    我们都希望拥有可以信赖的有益 AI 系统，因此实现可信的 AI 很大程度上取决于伦理领域。AI 伦理可以被认为是应用伦理和技术的一个分支，专注于关注设计、开发、实施和使用
    AI 技术所引发的伦理问题。


    因此，AI 伦理的目标是识别 AI 如何推进或引发对个人“良好”生活的担忧，无论是在生活质量、心理自主性，还是在民主社会中生活的自由方面。它涉及多样化和包容性问题（涉及训练数据和
    AI 服务的目标），以及分配正义问题（谁将从 AI 中获益，谁又不会）。


    对 AI 伦理的思考产生了一些大多数人认同的通用主题：


    - **透明性** – 我们可以将其理解为当 AI 犯错时，我们如何理解哪里出了问题。我们可以明确说明某项 AI 技术失败的原因吗？例如，`NN` 是由我们能够理解的算法生成的；但为了实现透明化，我们还需要明确理解为什么
    `NN` 会得到特定的结果。这为我们学习 AI 系统的表现如何以及为何这样表现提供了基础。

    - **问责制** – 我们需要谨慎，否则可能会出现不平等、偏见、失业等问题。

    - **武器化** – 创建致命性自主武器是我们绝不能逾越的红线；然而，国家安全是一个特殊课题，超出了 AI 在社会的通用范围。

    - **伤害** – AI 必须不造成伤害。

    - **人类尊严** – 保护个人因自身而获得价值和尊重的权利，以伦理的方式对待他们。

    - **安全保障** – 这几乎是不言而喻，但这是一个重要的伦理关切。

    - **隐私** – 这一直是许多政治辩论的来源，现在已是一项基本要求，例如欧盟实施的《通用数据保护条例》(`GDPR`)。

    - **可持续性** – 一一组与我们的利益相关者和更广泛社区一致的目标，确立代际公平。

    - **公平性** – 与可持续性一起，偏见带来了我们必须接受并良好管理的更多伦理挑战。

    - **社会利益** – 每个人如何从 AI 的机会中获益？


    ### 2.2.2 伦理 AI 的指导原则


    伦理是一个哲学学科，它在个人身上表现为我们所谓的“道德原则”；事实上，许多人交替使用这两个词。基本上，伦理和道德都与“正确”和“错误”的行为有关。


    值得注意的是，伦理作为学者和学生学习的学科，被视为单数形式，例如“我这学期的选修课是伦理学”。激励和引导我们的道德原则或伦理原则则被视为复数形式。通过这种方式，我们可以区分学科本身（单数）与个人的伦理原则（复数）。


    关于伦理的进一步扩展，可以在 Warnock 爵士（2006 年）编写的《智能人士伦理指南》中找到。


    道德倾向于指个人关于对错的自身个人原则。伦理通常指的是由外部来源或社区提供的规则，例如职场中的行为准则，或医学、法律等职业的公认伦理准则。


    作为一个研究领域，伦理已有几个世纪的历史，其核心问题集中于：


    - 什么是“良好”的行为？

    - 什么是“正确”？

    - 什么是“良好”的生活？


    ### 2.2.3 应对伦理挑战


    应对伦理挑战不仅为我们提供了丰富的知识，而且解决了那些不以伦理方式提供 AI 服务和产品的违规者。它建立在人权法和数据保护立法的基础上。特定的法律框架为我们提供了伦理
    AI 的手段，例如欧盟的《AI 法案》。那么，我们从哪里开始呢？


    图 2.1 显示了我们如何从各种来源收集指导，帮助我们开发既可信又稳健的以人为本的 AI。我们可以从艾伦·图灵研究所的 AI 标准中心（2024 年）和 `ISO/IEC`
    标准 42001（`ISO/IEC`，2023a）开始。从这里，我们可以采用欧盟的 AI 指南来产生一组要求。这在图 2.2 中所示。示意图识别了联合国 17
    个可持续发展目标可以织入我们的伦理目标之中，而且 AI 项目是迭代的，我们始终从经验中学习。


    图 2.1 实践 AI 伦理


    ![image-ZVAESIPK.jpg](img/image-ZVAESIPK.jpeg)


    `ISO/IEC 42001` 被认为是一个良好的 AI 治理模型，因为它建立、实施和维护 AI 管理系统提供了全面的指南。它强调风险管理、伦理考虑、透明度和持续改进。通过覆盖
    AI 生命周期的所有阶段并将控制扩展到第三方供应商，它确保了 AI 的负责任开发和部署。采用 `ISO/IEC 42001` 有助于组织构建可靠的 AI 系统，符合监管要求并促进伦理
    AI 实践。


    '
