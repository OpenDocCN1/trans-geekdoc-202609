- raw: 'When supervised learning is not possible due to unlabelled data, then an unsupervised
    approach needs to be taken. SVM attempts to find natural clustering of data into
    groups and new data will then fall into one of these groups.


    Naive Bayes – this is a classification technique based on Bayes’ theorem with
    an assumption of strong independence among predictors. Simply put, a Naive Bayes
    classifier assumes that the presence of a particular feature in a class is unrelated
    to the presence of any other feature. It is used in predicting membership probabilities
    for each class, such as the probability that a given record or data point belongs
    to a particular class. A simple example could be the prediction of the probability
    of you having a particular illness or disease based on the data recorded about
    you, which may include ethnicity, age and gender, and not just a list of dependent
    symptoms such as a rash or high temperature.


    K-means – this is a centroid based clustering algorithm, which means that data
    are clustered around a centre. K-means is an iterative algorithm, and has two
    unique steps: the first being a cluster assignment and the second being a move
    to the centroid step.


    Initially, you must select a number of clustered centres depending on the number
    of clustered groups you want to create. Measurements are then made from the various
    data points through each of the data points and, depending on which cluster is
    closer (the cluster A centroid or cluster B centroid or cluster C centroid and
    so on), the algorithm assigns the data points to one of the cluster centroids.
    K-means then moves the centroids to the average of the points in a cluster. In
    other words, the algorithm calculates the average of all the points in a cluster
    and moves the centroid to that average location. The two steps are then repeated
    until an end condition is met.


    A real-world example of this algorithm is in the segmentation of customers for
    marketing purposes into various persona categories to allow better targeted marketing
    messages to be sent to the different personas, thereby helping to increase engagement
    or sales. In marketing you would typically try to limit the number of personas
    to a manageable number – let’s say six would be optimum – but how we determine
    that for our particular industry or market segment requires some learning from
    experience.


    The choice of the number of clusters to determine the optimum number of clusters
    (i.e. the ‘k’) can be quite complex and may be decided by adding an additional
    cluster until it no longer makes a significant difference. A single data point
    could also be considered a cluster. The decision criteria for k is beyond the
    scope of this book. Again, we see the importance of learning from experience while
    we are building our AI or ML technique.


    The examples above are the tip of the iceberg in terms of the algorithms used
    in ML and AI, where there are literally thousands, if not millions, used for specific
    industries, for solving specific problems or within individual applications.


    4.2.3.5 What is a deep learning algorithm?


    As with the algorithms described in the last section, there are also a number
    of algorithms used in deep learning on NNs. The detailed workings of the algorithms
    are beyond the scope of this book other than to provide a description of their
    function and use. These algorithms include:


    Multilayer perceptron neural network (MLP NN): this is a class of feedforward
    artificial neural network (ANN). MLP utilises a supervised learning technique
    called backpropagation for training. Its multiple layers and non-linear activation
    distinguish MLP from a linear perceptron. It can distinguish data that are not
    linearly separable.


    Backpropagation: this is short for ‘backward propagation of errors’, and is an
    algorithm for supervised learning of ANNs using gradient descent. Given an ANN
    and an error function, the method calculates the gradient of the error function
    with respect to the NN’s weights. Weights can then be adjusted to improve the
    error.


    Convolutional neural network: CNN is a deep learning algorithm that can take in
    an input image and assign importance, based on learnable weights and biases, to
    various aspects/objects in the image and be able to differentiate one from the
    other. The CNN was inspired by the human brain’s processing of visual data. These
    NN are more versatile and can be used on data other than images (e.g. audio, self-driving
    cars and more).


    Recurrent neural network: RNN is a class of ANN that processes a sequence of data
    along a timeline and remembers ‘in memory’ the sequence of data or a variable
    amount of data to use later in its processing. There is a connection between the
    data points, just as we have when we read individual words and link them together
    in a sentence. RNNs have been derived from feedforward NNs. They are typically
    used in speech recognition and connected handwriting recognition applications
    where what has come previously may influence what comes next or how it is interpreted.


    Generative adversarial network: GAN is a class of ML frameworks designed by Ian
    Goodfellow and his colleagues in 2014: two NNs contest with each other in the
    form of a zero-sum game, where one agent’s gain is another agent’s loss. Apart
    from gaming, GANs are also used in image improvement and event generation and
    are used in the generation of ‘deepfake’ photorealistic human images resembling
    real photographs and videos generated from a single image.


    Long short-term memory (LSTM): this is an artificial RNN architecture used in
    the field of deep learning. Unlike standard feedforward NNs, LSTM has feedback
    connections. It can not only process single data points (such as images), but
    also entire sequences of data (such as speech or video).


    Restricted Boltzmann machine (RBM): this is a restricted two-layer ANN with a
    visible and a hidden layer. Originally invented in the 1980s, and still used today,
    it can learn probability distribution from its data inputs. RBMs can also be trained
    in either supervised or unsupervised ways, depending on the task. RBMs are used
    in topic modelling, classification, collaborative filtering and feature learning,
    and have found uses in other applications such as speech recognition. The RBM
    is the basis for DBN.


    Deep belief network (DBN): this can be created from multiple layers of simple,
    unsupervised networks such as RBMs. The DBN in its simplest form is composed of
    many layers of latent variables, with connections between the layers but not between
    units within each layer. When the DBN is initially trained without supervision
    on a data set it can learn to construct its inputs probabilistically. After initial
    training, supervised training will then allow it to perform classification. DBNs
    are often used in the field of drug discovery.


    Many other deep learning algorithms are available, but the descriptions above
    show that significant skills, knowledge and experience are required to choose,
    apply and make successful use of these algorithms. Each type of algorithm described
    above is a rich area of mathematics and theory. They are all rooted in the scientific
    method, and a rigorous approach to the use of these algorithms is likely to be
    found. What we mean here is that, although the interpretation of a complex algorithm
    is difficult, its roots in the scientific method will help to build a professional
    and rigorous justification for its use and results. Deep learning approaches contain
    more data and steps than a human is capable of comprehending. Again, we should
    remind ourselves that these general learning techniques may not be the optimum
    solution to our problems. Here, the domain expert will play a pivotal role in
    ascertaining what is fit for purpose. They will also be able to help with heuristics
    that are so vital to ML.


    4.2.3.6 Neural networks – a closer look


    Here we take a closer look at the NNs. In particular we describe the following:'
