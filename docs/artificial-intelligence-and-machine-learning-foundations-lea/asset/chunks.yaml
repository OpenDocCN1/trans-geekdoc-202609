- raw: '## 5.2.3 Managing power and influence in AI projects


    5.2.3.1 Strategies for power stakeholder management


    Engage power stakeholders in high-level strategic planning, resource discussions
    and compliance checks using:


    Regular updates that provide structured reports to senior management and executives
    on project progress and challenges.


    Clear documentation that ensures all decisions, resource allocations and compliance
    measures are well-documented and transparent.


    Strategic alignment that continuously aligns the AI project’s goals with the overarching
    business objectives – maintain executive support.


    5.2.3.2 Strategies for influence stakeholder management


    Engage influential stakeholders by involving them in brainstorming sessions, technical
    reviews and user feedback processes using:


    collaborative workshops with brainstorming sessions to gather insights from technical
    experts and innovators;


    communication channels that establish open and frequent communication with influential
    stakeholders to incorporate their feedback;


    recognition and inclusion that acknowledges the contributions of influential stakeholders
    and includes them in key decision-making processes to leverage their expertise.


    By understanding and appropriately managing both power and influence, AI project
    managers can navigate the complexities of AI development, ensuring that both the
    organisation’s strategic and technical perspectives are balanced and the project
    progresses smoothly towards its goals.


    ## 5.2.4 Project management approaches


    In this section we look at how AI projects can be approached. We concentrate on
    two styles, Agile and waterfall (Wikipedia Contributors, 2024p and 2024q), along
    with the possible choice of a hybrid approach. Remember that AI is about learning
    from experience and ML is about learning from data. In an AI project, we often
    encounter tasks involving data learning. Here, we will focus on an ML project
    to align with the specific stages of ML workflow. We will describe a project in
    terms of software and hardware, but note that management of stakeholders is vital
    in the definition of the functionality that we need in our project. Note also
    that this is not a project management course, and larger scale projects will more
    than likely involve a mix of project management styles.


    Selecting the best project management approach depends on the specific characteristics
    of the AI project, including the clarity of requirements, the need for flexibility,
    the level of stakeholder involvement and regulatory considerations.


    There are many methodologies within project management, but they broadly fit into
    three main categories:


    Agile;


    waterfall;


    hybrid.


    5.2.4.1 Agile project management for AI projects


    Agile project management is an iterative and flexible approach to managing projects,
    particularly in software development, that emphasises adaptability, collaboration
    and customer satisfaction. Rooted in the Agile Manifesto, it prioritises individuals
    and interactions over processes and tools, working software over comprehensive
    documentation, customer collaboration over contract negotiation and responding
    to change over following a fixed plan. Agile methods break projects into small,
    manageable units called sprints or iterations, typically lasting two to four weeks,
    allowing teams to regularly reassess and adjust project direction based on feedback
    and evolving requirements. This approach fosters continuous improvement, rapid
    delivery of value and a high degree of transparency and communication within the
    project team and with stakeholders.


    Agile projects’ key characteristics are:


    Iterative development: projects are broken down into small, manageable units called
    sprints or iterations, typically lasting 2–4 weeks.


    Flexibility and adaptability: Agile allows for changes and revisions throughout
    the project lifecycle, adapting to evolving requirements and feedback.


    Collaborative and cross-functional teams: Agile emphasises close collaboration
    among team members and stakeholders, with daily stand-up meetings and continuous
    communication.


    Continuous delivery and improvement: Agile focuses on delivering functional components
    early and frequently, allowing for ongoing testing, feedback and improvement.


    Customer-centric: Agile prioritises customer needs and involvement, ensuring that
    the final product aligns closely with user expectations and requirements.


    Its key characteristics mean that an Agile project style is suitable for AI projects
    because it has:


    Rapid prototyping and feedback: ideal for AI projects where quick prototyping
    and iterative feedback are essential for refining algorithms and models.


    Uncertain and evolving requirements: suitable for AI projects with evolving requirements
    or where the final outcome is not fully defined at the outset.


    Innovation and experimentation: which are crucial in AI development.


    As an individual or an organisation becomes more skilled and experienced in AI
    projects and their management, some of the flexibility can be refined and made
    more efficient because the experience gained allows the organisation to predict
    and plan with more certainty. Agile style project management is complimented by
    MLOps.


    5.2.4.2 Waterfall project management for AI projects


    Waterfall project management is a sequential step-by-step approach to managing
    projects, traditionally used in industries such as construction and manufacturing
    but also applied in software development. Typical distinct phases are requirement
    gathering, design, implementation, testing, deployment and maintenance. Each is
    completed before moving on to the next. The waterfall model emphasises thorough
    planning, documentation and a clear definition of requirements at the project’s
    outset, ensuring that all aspects of the project are well understood and agreed
    upon before development begins. Once a phase is completed, it is typically not
    revisited, which makes this approach less flexible in accommodating changes. This
    rigidity can be beneficial for projects with well-defined goals and stable requirements
    where predictability and a structured progression are critical for success. Can
    you conduct an AI project using a waterfall methodology? Of course you can, as
    long as you understand the end-game before you kickstart the project. Unfortunately,
    many AI projects don’t know the end point from the outset, so naturally lend themselves
    towards a more Agile approach to project management, which incorporates a certain
    amount of experimentation.


    Waterfall projects’ key characteristics are:


    Sequential phases: projects progress through a series of distinct phases (requirements,
    design, implementation, testing, deployment) in a step-by-step fashion.


    Fixed requirements: requirements are gathered and defined upfront, and changes
    are typically minimised after the project begins.


    Documentation: thorough documentation at each phase is emphasised, ensuring a
    clear record of project decisions and processes.


    Predictability and control: projects follow a structured approach with clear milestones
    and deliverables, making it easier to manage and control the project timeline
    and budget.


    Its key characteristics mean that a waterfall project style is suitable for AI
    projects because it has:


    Well-defined requirements: suitable for AI projects with clearly defined requirements
    and objectives, where changes are unlikely.


    Regulatory and compliance needs: ideal for projects that require extensive documentation
    and adherence to regulatory standards.


    Large-scale infrastructure: appropriate for large-scale AI infrastructure projects
    where a sequential approach ensures systematic progress and risk management.


    5.2.4.3 Hybrid Agile/waterfall project management for AI projects'
