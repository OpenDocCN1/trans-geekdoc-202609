  trans: '


    在 `Section 1.1.1.6` 中引入的意识这一难题，让我们真正理解了感受的主观性，并意识到我们没有科学方法来定义为什么会有这些感受。对于许多领域的研究人员来说，这是一个令人兴奋的尝试，如果我们能正确解决，可能会导致对人类本质更好的理解。


    到为止，还没有机器实现过任何接近意识的东西。记住，我们无法定义它，更不用说模拟它。即使我们可以做到，研究人员认为这将像 `quantum mechanics`
    一样复杂。这仍然是一个研究挑战，但一些领先学者认为，在机器中产生意识是可能的（在几十年后）。如果我们真的开发出机器意识，将面临许多风险，大多数领先学者宁愿我们做好充分准备，甚至规避免这种可能。


    《Life 3.0》（2018）的作者马克斯·特格使用了这样一个例子：我们在发现火之后才制造了灭火器。这非常普遍；然而，如果我们采纳 Stuart·鲁塞尔在《Human
    Compatible》（2019）中的观点，即让 AI 寻找对人类最好的方案，那么我们将朝着正确的方向出发——手中还拿着马克斯·特格的“AI 灭火器”以备不万一。展望未来，只要我们在拥有安全保障的情况下朝着正确的方向努力，我们就可以利用目标
    AI 或 `ML` 的优势来帮助我们应对复杂的世界。


    ## 6.5 总结


    本章探讨了 AI 的未来及其对职业的影响，强调了 `AI` 和 `ML` 如何从现在演变到遥远的未来。本章讨论了随着 AI 的持续发展，新角色和职业路径的出现，以及纯人类系统、纯机器系统和人机协作系统。纯人类系统将侧重于领导力、创造力和共情能力等领域，而机器在重复性、可预测的任务和自动化方面表现优异。


    本章介绍了诸如 `data scientists`、`AI research scientists`、`computer vision engineers`
    和 `AI ethics specialists` 等职位的机会，展示了 AI 相关职业不断扩展的范围。它还概述了 AI 集成到各个行业的情况，包括医疗保健、金融、教育和娱乐，AI
    正在驱动这些领域的创新和效率。


    展望未来，本章考虑了 AI 的未来趋势，例如 `AGI` 的进展、人机协作、`AI ethics` 和 `quantum computing`。它还深入探讨了潜在的挑战，包括
    AI 的伦理影响、失去控制以及自主系统相关的风险。


    本章以对意识和 AI 的讨论结束，审视了开发机器意识的复杂性以及随这些进步的潜在伦理担忧。尽管 AI 具有巨大的前景，但它的未来取决于谨慎的治理、负责任的发展以及对增强人类能力的关注。


