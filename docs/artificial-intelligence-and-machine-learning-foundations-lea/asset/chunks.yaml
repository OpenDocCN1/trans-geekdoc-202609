- raw: 'At the core of AI is ML. In fact, ML is an enabler of AI. ML is most often
    associated with the popular computation we have today, that is, digital computation.
    AI is about learning from experience and ML is about learning from data. We will
    use this as the basis of our intuitive understanding of what ML is. The most popular
    machines used today are digital personal computers, computer clusters and large
    high-performance computers. As we look forward, we will move towards optical,
    quantum, biological and other types of learning machines to help us. And now,
    with our smart devices with onboard AI hardware, we see a growth in edge computing
    where digital ML is done on our smart devices such as phones, speakers and cars.
    Security is a key concept here; how do we ensure that our data are safe?


    To start, we need to think about what we are actually doing – we are going to
    instruct and teach a machine to help us with learning. If we use a digital machine,
    this means we need to understand our problem in such a way that we can let a machine,
    say a laptop or smartphone, do the learning for us. The hardware needs software
    and the software needs an algorithm and data. The algorithm will use mathematics,
    and we finally have our starting point.


    In 2019 Gilbert Strang, a professor at the Massachusetts Institute of Technology,
    wrote a book on linear algebra and learning from data (Strang, 2019). He tells
    us that ML has three pillars: linear algebra; probability and statistics; and
    optimisation. Much earlier, in the 1990s, Graham, Knuth and Patashnik produced
    a textbook to help students understand the mathematics needed for computational
    science – we might think of it as the book that describes algorithms mathematically,
    how they are defined and how they are understood (Graham et al., 1994). These
    two publications are detailed, rigorous mathematical texts. Tom Mitchell’s book
    on machine learning, as mentioned in Chapter 1, gives a taste of the theory of
    ML with examples, and is again a detailed, rigorous mathematical text (Mitchell,
    2018). These books are comprehensive and not for the novice. They are relevant
    to mathematicians, engineers and physicists who are well versed in these types
    of disciplines.


    Strang’s Linear Algebra and Learning From Data (2019) goes into the theory in
    depth and refers to many excellent examples and references for scientists, engineers
    and mathematicians.


    Graham, Knuth and Patashnik’s Concrete Mathematics (1994) is a book about the
    mathematics for computer science. It is more detailed in its explanations of algorithms
    and theory, and introduces statistics and probability. When coupled with Knuth’s
    The Art of Computer Programming (2011), these books provide an extensive reference
    literature on the nature of learning using computers, digital and other resources.


    AI is more than learning from data; when we think about AI products, we must also
    think about the world that they operate in, how actuators are controlled and how
    policies are decided given sensor readings and a percept. Stuart Russell and Peter
    Norvig’s book on AI goes into the theory and mathematics of how we frame our problem
    beyond just learning from data (Russell and Norvig, 2016); they cover ML too.
    They are also very clear that AI is a universal subject, so can be applied to
    any intellectual task – learning from experience.


    What is common to these technical books on the theory of AI are some key subject
    areas that are worth gaining an appreciation of. These are: linear algebra; vector
    calculus; and probability and statistics. Linear algebra is about linear systems
    of equations; vector calculus is about differentiation and integration of vector
    spaces, or, more practically, how mathematicians, engineers and physicists describe
    our physical world in terms of differences and summations and probability; and
    statistics is about the mathematics of understanding randomness.


    3.2.4.3 Linear algebra


    This section is designed to give an overview of linear algebra; as Gilbert Strang
    explains, linear algebra is the key subject to understanding data and is especially
    important to engineering (Strang, 2016).


    We learn from data using linear algebra. In school most of us learn about systems
    of equations or simultaneous equations. It is linear algebra that we use to solve
    equations using computers, and it is at the heart of AI, ML, engineering simulation
    and just about every other subject that relies on digital computers.


    A simple example will introduce what we mean. If we want a computer to learn,
    we have to represent that learning in the form of mathematical operations that
    a computer can undertake. It is the terrain or geometry that computers can work
    with. Computers can undertake these mathematical operations, such as add, subtract,
    divide and multiply, very quickly and accurately. Far quicker and more accurately
    than us humans. As we mentioned earlier, most of the problems in the real world
    require an adaptive or iterative approach – and computers are good at this too.
    In fact, they are so good at this, and quick, we might think it is easy. In doing
    so, we almost trivialise the amount of work that goes into preparing our machines
    for learning.


    The simplest example of how we do this is a problem we learn to do at school,
    solving simultaneous equations. This can be done by hand using a technique from
    the 1800s: Gaussian elimination (Chinese mathematicians were aware of this technique
    before Gauss: Wikipedia Contributors, 2024n). We could do this by hand with a
    calculator, a set of log tables or an analogue computer – the slide rule – however,
    digital computers can do this quicker and more accurately than we can. If our
    problem has more unknowns, say five or even 1,000, then this would be impossible
    to do by hand.


    To solve this problem with a computer we need to write it in a slightly different
    way, and to do this we can use linear algebra. Scientists, engineers and mathematicians
    use these techniques to set up problems with large matrices, and have to invert
    big matrices. This requires high-performance parallel computers, but it can be
    done. AI draws on these techniques also, and is another user of large supercomputers.


    If we are to formulate a learning problem that we want a digital computer to solve,
    then we need to understand linear algebra. There are already multi-billion-dollar
    industries (finite element analysis, computational fluid dynamics, business analytics,
    etc.) using these techniques.


    Armed with machines that we can use to enhance our learning, we now move onto
    the next core topic from mathematics, that of vector calculus.


    3.2.4.4 Vector calculus


    Vector calculus allows us to understand vector fields using differences and summation.
    Or, to use the mathematical terms, differentiation and integration. A good example
    of a vector field is the transfer of heat. Heat can move in three directions,
    and we observe that it moves from hotter sources to cooler sources. So, in a simple
    model, we can think that the amount of heat that moves between two bodies depends
    on the difference in temperature. If we monitor this over a long period of time,
    we can add these measurements up and calculate the total amount of heat that has
    been transferred. This is vector calculus; it allows us to represent problems
    that we encounter day-to-day, from the Earth’s electromagnetic field, the movement
    of the oceans to the motion of vehicles on a road. When we think of a learning
    agent, we need to represent the state of the world. When we use the analogy of
    a learning problem as a terrain, then vector calculus will help us to understand
    how our AI is learning. In particular, how quickly it learns.'
  fmt: 'At the core of AI is ML. In fact, ML is an enabler of AI. ML is most often
    associated with the popular computation we have today, that is, digital computation.
    AI is about learning from experience and ML is about learning from data. We will
    use this as the basis of our intuitive understanding of what ML is. The most popular
    machines used today are digital personal computers, computer clusters and large
    high-performance computers. As we look forward, we will move towards optical,
    quantum, biological and other types of learning machines to help us. And now,
    with our smart devices with onboard AI hardware, we see a growth in edge computing
    where digital ML is done on our smart devices such as phones, speakers and cars.
    Security is a key concept here; how do we ensure that our data are safe?


    To start, we need to think about what we are actually doing – we are going to
    instruct and teach a machine to help us with learning. If we use a digital machine,
    this means we need to understand our problem in such a way that we can let a machine,
    say a laptop or smartphone, do the learning for us. The hardware needs software
    and the software needs an algorithm and data. The algorithm will use mathematics,
    and we finally have our starting point.


    In 2019 Gilbert Strang, a professor at the Massachusetts Institute of Technology,
    wrote a book on linear algebra and learning from data (Strang, 2019). He tells
    us that ML has three pillars: linear algebra; probability and statistics; and
    optimisation. Much earlier, in the 1990s, Graham, Knuth and Patashnik produced
    a textbook to help students understand the mathematics needed for computational
    science – we might think of it as the book that describes algorithms mathematically,
    how they are defined and how they are understood (Graham et al., 1994). These
    two publications are detailed, rigorous mathematical texts. Tom Mitchell’s book
    on machine learning, as mentioned in Chapter 1, gives a taste of the theory of
    ML with examples, and is again a detailed, rigorous mathematical text (Mitchell,
    2018). These books are comprehensive and not for the novice. They are relevant
    to mathematicians, engineers and physicists who are well versed in these types
    of disciplines.


    Strang’s `Linear Algebra and Learning From Data` (2019) goes into the theory in
    depth and refers to many excellent examples and references for scientists, engineers
    and mathematicians.


    Graham, Knuth and Patashnik’s `Concrete Mathematics` (1994) is a book about the
    mathematics for computer science. It is more detailed in its explanations of algorithms
    and theory, and introduces statistics and probability. When coupled with Knuth’s
    `The Art of Computer Programming` (2011), these books provide an extensive reference
    literature on the nature of learning using computers, digital and other resources.


    AI is more than learning from data; when we think about AI products, we must also
    think about the world that they operate in, how actuators are controlled and how
    policies are decided given sensor readings and a percept. Stuart Russell and Peter
    Norvig’s book on AI goes into the theory and mathematics of how we frame our problem
    beyond just learning from data (Russell and Norvig, 2016); they cover ML too.
    They are also very clear that AI is a universal subject, so can be applied to
    any intellectual task – learning from experience.


    What is common to these technical books on the theory of AI are some key subject
    areas that are worth gaining an appreciation of. These are: linear algebra; vector
    calculus; probability and statistics.


    ### 3.2.4.3 Linear algebra


    Strang’s `Linear Algebra and Learning From Data` (2019) goes into the theory in
    depth and refers to many excellent examples and references for scientists, engineers
    and mathematicians.


    Graham, Knuth and Patashnik’s `Concrete Mathematics` (1994) is a book about the
    mathematics for computer science. It is more detailed in its explanations of algorithms
    and theory, and introduces statistics and probability. When coupled with Knuth’s
    `The Art of Computer Programming` (2011), these books provide an extensive reference
    literature on the nature of learning using computers, digital and other resources.


    ### 3.2.4.4 Vector calculus


    Vector calculus allows us to understand vector fields using differences and summation.
    Or, to use the mathematical terms, differentiation and integration. A good example
    of a vector field is the transfer of heat. Heat can move in three directions,
    and we observe that it moves from hotter sources to cooler sources. So, in a simple
    model, we can think that the amount of heat that moves between two bodies depends
    on the difference in temperature. If we monitor this over a long period of time,
    we can add these measurements up and calculate the total amount of heat that has
    been transferred. This is vector calculus; it allows us to represent problems
    that we encounter day-to-day, from the Earth’s electromagnetic field, the movement
    of the oceans to the motion of vehicles on a road. When we think of a learning
    agent, we need to represent the state of the world. When we use the analogy of
    a learning problem as a terrain, then vector calculus will help us to understand
    how our AI is learning. In particular, how quickly it learns.

    '
  trans: '

    AI 的核心是机器学习（ML）。事实上，机器学习是 AI 的推动者。机器学习通常与我们今天拥有的通用计算相关，即数字计算。AI 关乎从经验中学习，而机器学习关乎从数据中学习。我们将此作为我们对机器学习的直观理解的基础。今天最受欢迎的机器是数字个人电脑、计算机集群和大型高性能计算机。展望未来，我们将转向光学、量子、生物等类型的学习机器来为我们提供帮助。现在，随着带有内置
    AI 硬件的智能设备的出现，我们看到了边缘计算的增长，即在手机、扬声器和汽车等智能设备上进行数字机器学习。安全是这里的一个关键概念；我们如何确保数据是安全的？


    首先，我们需要思考我们实际上在做什么——我们正在指令并教导机器来帮助我们学习。如果我们使用数字机器，这意味着我们需要以这种方式理解我们的问题，以便让机器（例如笔记本电脑或智能手机）为我们进行学习。硬件需要软件，而软件需要算法和数据。算法将使用数学，我们最终就有了起点。


    2019 年，马萨诸理工学院的教授吉尔伯特·斯特朗（Gilbert Strang）写了一本关于线性代数和从数据学习的书（Strang, 2019）。他告诉我们机器学习有三个支柱：线性代数；概率与统计；以及优化。早得多，在
    20 世纪 90 年代，Graham、Knuth 和 Patashnik 出版了一本教科书，帮助学生理解计算科学所需的数学——我们认为将其看作是是用数学角度描述算法、它们如何被定义以及如何被理解的书（Graham
    et al., 1994）。这两部出版物都是详细、严谨的数学文本。汤姆·米切尔（Tom Mitchell）在第 1 章中提到的机器学习著作，通过示例提供了机器学习理论的介绍，这又是一部详细、严谨的数学文本（Mitchell,
    2018）。这些书籍内容全面，并不适合初学者。它们对于精通这些学科的数学家、工程师和物理学家来说具有相关性。


    Strang 的 `Linear Algebra and Learning From Data`（2019）深入探讨了理论，并为科学家、工程师和数学家引用了许多优秀的示例和参考文献。


    Graham、Knuth 和 Patashnik 的 `Concrete Mathematics`（1994）是一本关于计算机科学数学的书。它对算法和理论的解释更加详细，并引入了统计和概率。与
    Knuth 的 `The Art of Computer Programming`（2011）结合起来，这些书籍为利用计算机、数字和其他资源进行学习的本质提供了广泛的参考文献。


    AI 不仅仅是从数据中学习；当我们思考 AI 产品时，还必须考虑它们运行的世界、执行器是如何控制的，以及如何根据传感器读取值和感知器做出决策。斯图尔特·罗塞尔（Stuart
    Russell）和彼得·诺维格（Peter Norvig）的 AI 著作深入探讨了我们在从数据学习之外如何构建问题的理论和数学（Russell and Norvig,
    2016）；他们也涵盖了机器学习。他们非常明确地指出 AI 是一门通用学科，因此可以应用于任何智力任务——从经验中学习。


    这些关于 AI 理论的技术书籍的共同点是一些值得欣赏的关键学科领域。这些是：线性代数；矢量微积分；概率与统计。


    ### 3.2.4.3 线性代数


    Strang 的 `Linear Algebra and Learning From Data`（2019）深入探讨了理论，并为科学家、工程师和数学家引用了许多优秀的示例和参考文献。


    Graham、Knuth 和 Patashnik 的 `Concrete Mathematics`（1994）是一本关于计算机科学数学的书。它对算法和理论的解释更加详细，并引入了统计和概率。与
    Knuth 的 `The Art of Computer Programming`（2011）结合起来，这些书籍为利用计算机、数字和其他资源进行学习的本质提供了广泛的参考文献。


    ### 3.2.4.4 矢量微积分


    矢量微积分允许我们通过差和求和来理解矢量场。或者，用数学术语来说，就是微分和积分。矢量场的一个例子是热传递。热量可以向三个方向移动，我们观察到它从热源向冷源移动。因此，在一个简单的模型中，我们可以认为两个物体之间移动的热量取决于温度差。如果我们长时间监测这一点，就可以将这些测量值相加，计算出传输的热量总量。这就是矢量微积分；它允许我们表示每天遇到的问题，从地球电磁场、海洋运动到道路上车辆的运动。当我们思考学习智能体时，我们需要表示世界的状态。当我们把学习问题比作地形时，矢量微积分将帮助我们理解
    AI 是如何学习的。特别是，它学得有多快。

    '
