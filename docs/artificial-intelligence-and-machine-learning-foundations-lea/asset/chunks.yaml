    由于无标签数据无法进行监督学习时，则需要采用无监督方法。`SVM` 尝试将数据自然聚类的若干组，新数据将落入这些组之一。


    `Naive Bayes`（朴素贝叶斯）——这是一种基于`Bayes’ theorem`的分类技术，假设预测变量之间存在强独立性。简单来说，`Naive Bayes`
    分类器假设某一类中特定特征的存在与任何其他特征的存在无关。它被用于预测每个类别的成员概率，例如给定记录或数据点属于特定类别的概率。一个简单的例子是根据记录关于你的数据预测你患某种特定疾病或病病的概率，这些数据可能包括种族、年龄和性别，而不仅仅是皮疹或发热等依赖性症状列表。


    `K-means`——这是一种基于质心的聚类算法，意味着数据围绕一个中心进行聚类。`K-means` 是一种迭代算法，有两个独特的步骤：第一步是聚类分配，第二步是移动质心步骤。


    最初，你必须根据想要创建的聚类数量选择若干个聚类中心。然后从各个数据点对每个数据点进行测量，并根据哪个聚类更近（`cluster A` 质心、`cluster
    B` 质心或 `cluster C` 质心等），将数据点分配给其中一个聚类质心。`K-means` 然后将质心移动到聚类中点的平均值。换句话说，算法计算聚类中所有点的平均值，并将质心移动到该平均值位置。然后重复这两个步骤，直到满足终止条件。


    该算法在现实世界中的示例是出于营销目的将客户细分为不同的人物画像（persona）类别，以便向不同的画像发送更具针对性的营销信息，从而帮助增加参与度或销售额。在营销中，你通常会尝试将画像数量限制在可接受的范围内——假设六个是最佳的——但我们如何为特定的行业或市场细分确定这一数量，需要从经验中学习。


    确定最佳聚类数量的聚类数（即 `k`）可能非常复杂，可以通过添加额外的聚类，直到它不再产生显著差异来决定。单个数据点也可以被视为一个聚类。`k` 的决策标准超出了本书的范围。再次，我们看到了在构建
    AI 或 `ML` 技术时，从经验中学习的重要性。


    上述示例仅是 `ML` 和 AI 所用算法的冰山一角，实际上有成千上万甚至数百万的算法被用于特定行业、解决特定问题或个人应用。


    ### 4.2.3.5 什么是深度学习算法？


    与上一节中描述的算法一样，深度学习中也使用了许多针对 `NNs` 的算法。除了功能和用途的描述外，这些算法的详细原理超出了本书的范围。这些算法包括：


    - **多层感知器神经网络 (MLP NN)**：这是一种前馈人工神经网络（`ANN`）的类。`MLP` 利用一种称为 `backpropagation`（反向传播）的监督学习技术进行训练。它的多层结构和非线性激活函数将
    `MLP` 与线性感知器区分开来。它可以区分非线性可分的数据。

    - **反向传播 (Backpropagation)**：这是“误差反向传播”的缩写，是一种使用 `gradient descent`（梯度下降）对 `ANNs`
    进行监督学习的算法。给定一个 `ANN` 和一个误差函数，该方法计算误差函数相对于 `NN` 权重的梯度。然后可以调整权重以改进误差。

    - **卷积神经网络 (Convolutional neural network)**：`CNN` 是一种深度学习算法，它可以接收输入图像，并根据可学习的权重和偏置为图像中的各个方面/对象分配重要性，并能够区分它们。`CNN`
    的灵感源于人类大脑处理视觉数据。这些 `NNs` 更具通用性，可以用于图像以外的数据（例如音频、自动驾驶汽车等）。

    - **循环神经网络 (Recurrent neural network)**：`RNN` 是 `ANN` 的一类，它沿着时间线处理数据序列，并在“内存”中记住数据序列或可变数量的数据以便稍后处理使用。数据点之间存在连接，就像我们阅读单个单词并将它们连接成句子一样。`RNNs`
    派自前馈 `NNs`。它们通常用于语音识别和手写识别应用，在这些应用中，之前的内容可能会影响后续或解释方式。

    - **生成对抗网络 (Generative adversarial network)**：`GAN` 是 Ian Goodfellow 及其同事在 2014
    年设计的一种 `ML` 框架：两个 `NNs` 以零和游戏的形式相互竞争，其中一个代理的收益是另一个代理的损失。除了游戏，`GANs` 还用于图像改进和事件生成，并用于生成类似于单图像生成的真实照片和视频的“深度伪造”（deepfake）写实图像。

    - **长短期记忆 (LSTM)**：这是深度学习领域的一种人工 `RNN` 架构。与标准的前馈 `NNs` 不同，`LSTM` 具有反馈连接。它不仅处理单个数据点（如图像），还可以处理整个数据序列（如语音或视频）。

    - **受限玻尔兹曼机 (RBM)**：这是一种受限的双层 `ANN`，具有可见层和隐藏层。它最初发明于 20 世纪 80 年代，至今在使用，它可以从数据输入中学习概率分布。`RBMs`
    也可以以监督或无监督的方式训练，取决于任务。`RBMs` 用于主题建模、分类、协同过滤和特征学习，并在语音识别等其他应用中找到用途。`RBM` 是 `DBN`
    的基础。

    - **深度信念网络 (DBN)**：这可以通过多层简单的无监督网络（如 `RBMs`）创建。`DBN` 的最简单形式由许多潜变量组成，层与层之间有连接，但每层单元之间没有。当
    `DBN` 最初在数据集上进行无监督训练时，它可以以概率方式构建输入。初始训练后，监督训练将允许它执行分类。`DBNs` 通常用于药物发现领域。


    许多其他深度学习算法，但上述描述表明，选择、应用和成功使用这些算法需要大量的技能、知识和经验。上述描述的每种算法都是数学和理论的丰富领域。它们都根于科学方法，并且找到使用这些算法的严谨方法。我们在这里的意思是，虽然解释复杂的算法很困难，但它们在科学方法中的根有助于为其使用和结果建立专业且严谨的辩护。深度学习方法包含的数据和步骤超过了人类的理解能力。再次，我们应该提醒自己，这些通用学习技术可能不是我们问题的最佳解决方案。在这里，领域专家在确定适用性方面将起至关重要的作用。


