    - `FAT/ML`: 机器学习中的公平性、问责性和透明度

    - `GAN`: 生成对抗网络

    - `GDPR`: 通用数据保护条例

    - `Gen AI`: 生成式人工智能

    - `GOMS`: 目标、操作、方法和选择规则

    - `GPAI`: 通用人工智能

    - `GPT`: 生成式预训练变换器

    - `GPU`: 图形处理器

    - `HCAI`: 以人为中心的人工智能

    - `HCI`: 人机交互

    - `HITL`: 人在回路

    - `IA`: 智能自动化或增强

    - `ICT`: 信息与通信技术

    - `IEC`: 国际电工委员会

    - `IoT`: 物联网

    - `ISO`: 国际标准化组织

    - `KNN`: K-近邻算法

    - `LSTM`: 长短期记忆

    - `MHP`: 模型人类处理器

    - `ML`: 机器学习

    - `MLOps`: 机器学习运维

    - `MLP NN`: 多层感知器神经网络

    - `ModelOps`: 模型运维

    - `NI`: 自然智能

    - `NIST`: 美国国家标准与技术研究院

    - `NLP`: 自然语言处理

    - `NMT`: 神经机器翻译

    - `NN`: 神经网络

    - `OCR`: 光字符识别

    - `PDF`: 概率密度函数

    - `PESTLE`: 政治、经济、社会、技术、法律和环境

    - `RBM`: 受限玻尔兹曼机

    - `RNN`: 循环神经网络

    - `ROI`: 投资回报率

    - `RPA`: 机器人流程自动化

    - `SVM`: 支持向量机

    - `SWOT`: 优势、劣势、机会、威胁

    - `TAM`: 技术接受模型

    - `UCD`: 以用户为的设计

    - `UX`: 用户体验

    - `VAE`: 变分自动编码器

    - `VR`: 虚拟现实

    - `WCAG`: 网页内容无障碍指南

    - `XAI`: 可解释人工智能


    # 前言


    本书的编写目的明确，旨在支持 BCS 人工智能核心技能证书、BCS 人工智能基础证书培训课程，以及 BCS AI 课程路线图中正在开发的其他计划课程。


    其目标是记录人工智能和机器学习是什么，以及它们不是什么，将事实与虚言分开，并教育对人工智能和机器学习感兴趣的人士。我们包含了一些介绍机器学习基础和伦理的话题。


    我们认为这本书书是相对独特的，因为它在同一本书中汇集了直到为止分散在许多其他卷册中的信息和概念。这本书的目标还尽可能地（在可能的情况下）简化复杂且难以理解的概念，让那些没有相关领域高级学位的人士也能轻松理解这一主题。


    标准人工智能教材（`Russell and Norvig, 2016`）的作者 Stuart Russell 和 Peter Norvig 解释说，人工智能是一门通用的学科，对我们所有人都有益处。从经验中学习是人工智能的特征。我们将经常使用这一点，它不仅适用于机器，也适用于人类，或许对人类更为如此。爱因斯坦常被引用说：“知识的唯一来源是经验”。


    问问自己一个问题：从经验中学习在哪里？机器可以帮助吗？如果这个问题的答案是肯定的，那么人工智能就能帮助你！


    我们希望在这里通过平衡理论与实践让这些概念变得生动。我们希望 AI 项目中的人类部分与 AI 本身一样重要。毕竟，机器的出现是为了为我们人类分担负担。不仅如此，还为了赋予我们自己无法完成的额外能力。人类和机器具有独特的能力，找到正确的平衡至关重要。我们还没有受到诱惑去写一本目前非常流行的机器学习课程。如果我们这样做，我们就得以某种方式拉伸、扭曲和操纵它来解释意识和机器人学等概念。即使是解释狭义和通用人工智能（`AGI`）也是棘手的。而要拥抱实用的人类的一面几乎是不可能的。BCS
    也是一个特许协会，可以认证工程师成为特许工程师并获得 `CEng` 头衔。本课程正涵盖了这一点。


    '
