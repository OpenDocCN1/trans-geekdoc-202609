- raw: "4.1.1.5 Data visualisation\n\nData visualisation in ML is the process of graphically\
    \ representing data to help understand patterns, trends and insights. It is invaluable\
    \ at every stage of an ML project. It involves creating visual contexts such as\
    \ charts, graphs, heatmaps and plots to make complex data more accessible and\
    \ comprehensible.\n\nDuring data exploration, visualisation helps to identify\
    \ distributions, outliers and relationships within the data, guiding feature selection\
    \ and engineering. In pre-processing, it aids in detecting anomalies, missing\
    \ values and necessary transformations. During model evaluation, visual tools\
    \ such as confusion matrices, receiver operating characteristic curves and precision-recall\
    \ curves help to assess performance metrics and understand model behaviour.\n\n\
    Effective data visualisation ensures clearer communication of findings, enabling\
    \ data scientists, stakeholders and decision-makers to grasp the implications\
    \ of the ML models and the underlying data. Transforming raw data into visual\
    \ formats simplifies the complexity inherent in large data sets and predictive\
    \ models, facilitating better decision-making and more intuitive insights.\n\n\
    4.1.1.6 Typical methods of visualising data\n\nVisual representation of data is\
    \ one area where a focus on AI or ML can enhance how you organise and present\
    \ data. The benefits of good visualisation must be a priority as, ultimately,\
    \ we are judged by clients, stakeholders and/or users on the deployed AI or presentation\
    \ of results. Visualisation is a fundamental enabler of learning from experience\
    \ for everyone on the team. Figure 4.1 shows the stages of an ML project and highlights\
    \ how visualisation can help with learning from experience at every stage (see\
    \ Géron’s eight stages in Section 4.2.2).\n\nFigure 4.1 Visualisation is learning\
    \ from experience at every stage of an ML project\n\n![image-RUBV8K7H.jpg](images/image-RUBV8K7H.jpeg)\
    \  \n\nIf we can visualise data from the start of a project, we magnify our learning\
    \ – a picture paints a thousand words. In addition, we are already organising\
    \ our data so we can manage them and use them. If we are in a highly regulated\
    \ profession, then early engagement with stakeholders and regulators might aid\
    \ the acceptance of work and results. If we remind ourselves of the types of data\
    \ we encounter – structured, unstructured and semi-structured – then we’ll need\
    \ to appreciate these types and how we visualise them.\n\nIt is worth noting that\
    \ Python is the most common ML coding language of choice for computer and data\
    \ scientists (Python, 2019). The reason for this is often given as the interactive\
    \ nature of Python. In addition, we often see data pipelines in data visualisation\
    \ software. Typically, Python is the scripting language within these software\
    \ packages that automate standard tasks; SciKit-learn and TensorFlow have Python\
    \ as a coding language (Scikit-learn.org, 2024). TensorFlow is also widening access\
    \ to its ML libraries with other languages, such C++ and Swift (TensorFlow, 2019).\n\
    \nSome typical types of data visualisation are shown in Figure 4.2. The top row\
    \ (a–c) are graphs of data that we might encounter in a spreadsheet. The middle\
    \ row is an iso-contour plot, perhaps of the heights in a map. The image on the\
    \ left-hand side is an iso-surface (d); from the iso-contours we can build the\
    \ 3D iso-surface (e). With some vector calculus we can also calculate the gradients\
    \ and perhaps find maximum and minimum heights. These ideas are very powerful\
    \ if the data we are plotting are the learning rate of a NN or the profit from\
    \ business activities. We can focus on the fast learning rate or maximise our\
    \ profit. The bottom row of the examples (f and g) are networks; these are more\
    \ complex structures to visualise. Here techniques such as stereo vision, augmented\
    \ or virtual reality can help. Even large displays, such as power walls, allow\
    \ a different perspective on data we are presenting.\n\nThese types of data visualisation\
    \ techniques have been around for decades, and software on our computers enable\
    \ us to create them. However, when we move to large data sets from simulations\
    \ or big data, we need parallel data-processing capability. ParaView (www.paraview.org)\
    \ is a parallel data visualisation ecosystem with Python at its core. It is built\
    \ on the Visualization Toolkit open-source 3D graphics image processing and visualisation\
    \ software library and constructed to run on parallel computers, so can process\
    \ large data sets and produce graphics that an individual user can see. This is\
    \ a major challenge when working with large data sets – working with large data\
    \ sets on parallel computers is not something that should be attempted on your\
    \ first project.\n\nMost laptop and desktop computers are multi-core and multi-processor\
    \ machines with graphics processing units (GPUs) that have enough processing power\
    \ and capability to learn and develop ML/AI. Once tested on small hardware, you\
    \ can then gradually use greater processing power on high-performance computing\
    \ systems.\n\nFigure 4.2 Standard data visualisation examples: (a) line graph,\
    \ (b) scatter plot, (c) histogram, (d) contour plot, (e) 3D contour plot, (f)\
    \ network diagram and (g) 3D network diagram\n\n![image-3NIWV7C8.jpg](images/image-3NIWV7C8.jpeg)\
    \  \n\nWe are fortunate that most open-source software can be compiled, or is\
    \ already compiled, for common operating systems. You can initially work on your\
    \ own hardware using the same software you will use on larger hardware set-ups.\
    \ We are also lucky to have both open-source and commercial software we can draw\
    \ on. There are advantages and disadvantages to both, and you will need to consider\
    \ what you will require. A search on your favourite search engine will bring up\
    \ a list of the many data visualisation packages around.\n\nWe know that visualisation\
    \ is an important aid to learning from experience, but there is an additional\
    \ idea that we might be able to incorporate: can we create a learning environment?\
    \ Can we develop a virtual reality (VR) or augmented reality (AR) simulated environment\
    \ that we can learn from or humans can teach an AI system to learn from? We mentioned\
    \ in the previous chapter that AI robotics gives us the opportunity to explore\
    \ and utilise extreme environments. Could we build simulated environments to generate\
    \ the data we need to design and operate our robots? Could we build a learning\
    \ environment to let a robot learn how to do a task?\n\nBlender is open-source\
    \ software with a highly sophisticated environment for building simulations and\
    \ presenting data (see Figure 4.3). The graphics are capable of producing photorealistic\
    \ renderings and movies. This is often the base of computer games, movies and\
    \ scientific visualisation. If we extend this to ML and AI, we could build a human\
    \ and machine environment where the machine and humans interact to teach each\
    \ other. Examples of this are found in engineering, where operators are taught\
    \ how to operate machinery and pilots are taught how to fly in a safe environment.\
    \ We are always guided by learning from experience, and the learning environment\
    \ can be used to generate data.\n\nFigure 4.3 Open-source software to build simulated\
    \ environments – Blender (https://commons.wikimedia.org/wiki/File:Blender\\_2.90-startup.png,\
    \ Creative Commons Attribution-Share Alike 4.0 International licence)\n\n![image-P47AKCT9.jpg](images/image-P47AKCT9.jpeg)\
    \  \n\nIn medicine, AI can be used in diagnosis and treatment. Of particular importance\
    \ in a surgical environment is what the surgeon sees. This can be developed in\
    \ a digital environment first, then perhaps a physical environment and finally\
    \ used on a patient. We can easily imagine a basic system, developing from scanning\
    \ a patient to one where surgeons can work collaboratively with AI machines. Figure\
    \ 4.4 shows examples of how AI is working in medicine from diagnosis to treatment.\
    \ It shows robotic surgical equipment – the surgeon is potentially removed from\
    \ the sterile operating theatre."
