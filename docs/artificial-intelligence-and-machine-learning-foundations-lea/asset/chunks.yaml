  trans: '


    # 在古代，就有关于赋予某种形式智能的人偶和人工机械体的传说、故事和神话，它们通常是智者或大师级匠的作品。我们仍然对圣经时代的石魔（golems）有所记载，它们是由泥土或粘土形成的魔法生物，通过某些咒语或魔法被赋予“生命”。亚里士多德（公元前
    384–322 年），这位希腊多才学者和后世西方哲学之父，是第一个关于对象和逻辑的人，并奠定了本体论和科学方法的基础。因此，今天我们教授自然科学、数据科学、计算机科学和社会科学。由于缺乏所需的技术，在追求人工智能的过程中，过了几个世纪都没有取得任何进展。


    18 世纪，我们看到了统计学的数学化发展（`贝叶斯定理`）以及埃达·洛夫拉斯（Ada Lovelace）提出的第一个计算机描述和算法。19 世纪，人工智能进入了科幻文学领域：玛丽·谢莉在
    1818 年的作品《弗兰肯斯坦》，以及塞缪尔·巴特勒在 1872 年的小说《乌托地》（Erewhon），后者引用了他早先在 1863 年给新西兰《新闻报》写的一封信《机器中的达尔文》。巴特勒是第一个描写机器可能通过自然选择产生意识可能性的人。


    1920 年，出生于捷克的卡雷尔·恰普佩克（Karel Čapek）在他的舞台剧《R.U.R.》（罗萨姆环球机器人）中向世界引入了“机器人”（robot）一词。“机器人”源于斯拉夫语单词
    `robota`，意为苦力劳动者。


    自此以后，人工智能成为科幻小说和电影中反复出现的主题，无论是强调潜在收益的乌托邦式，还是关注负面影响的反乌托邦式（例如用自我复制的智能机器取代人类成为主导物种）。在某种程度上，我们可以说，昨天的科幻正迅速变成今天的科学事实。


    1943 年，沃伦·麦库卡洛（Warren McCulloch）和沃尔特·皮茨（Walter Pitts）创建了`NN`（神经网络）的计算模型，开启了这一学科。第一个是由马文·明斯斯基（Marvin
    Minsky）构建的电子模拟`NN`。这引发了人工智能与工程控制理论之间持久的关系。接着，在 20 世纪 50 年代，英国数学家艾伦·图灵（Alan Turing）在《心灵》（Mind）杂志上发表了一篇题为《计算机器与智能》的论文（Turing,
    1950）。这真正为后来被称为人工智能的领域开启了大门。然而，又过了六年，科学界才接受了“人工智能”这一术语。


    1956 年夏天，约翰·麦卡西（John McCarthy）在新罕布什尔州的达特茅斯学院组织了第一场关于人工智能的学术会议。这次“夏季课程”持续了八周，对人工智能领域进行了头脑风暴。最初计划有
    10 人参加；事实上，人们在不同的环节中“加入”，最终名单有 50 名参与者。罗塞尔（Russell）和诺维格（Norvig）引用了麦卡西对暑期学校的建议（Russell
    and Norvig, 2016: 17）：


    > 我们建议在 1956 年夏天于新罕布什州汉诺威的达特茅斯学院进行为期 2 个月、10 个人的人工智能研究。该研究基于这样一个假设进行：学习的每一个方面或智能的任何其他特征在原则上都可以被描述得如此精确，以至于机器可以对其模拟。我们将尝试找到如何让机器使用语言、形成抽象和概念，解决目前仅留给人类的问题，并自我完善。我们认为，如果让经过仔细挑选的科学家共同工作一个夏天，可以在这些问题的一个或多个方面取得重大进展。


    20 世纪 50 年代中期到 60 年代初，还见证了机器开始玩跳棋、西洋棋和象棋。这是“游戏 AI”的开始，直到今天它仍是一项大事业，并已发展成为数十亿美元的产业。1959
    年，亚瑟·塞缪尔（Arthur Samuel）首次使用并普及了“机器学习”一术，尽管当时的技术有限。塞缪尔的跳棋程序是当时世界上成功的例子之一，它让机器能够学习，这在当时是惊人的（见
    1.1.1）。随后，20 世纪 60 年代见证了基于逻辑计算的发展以及编程语言的发展。休伯特·德雷福斯（Hubert Dreyfus），这位加利福尼亚大学伯克利分校的教授，对这一领域提出了挑战（Dreyfus,
    1968–2017），他认为人工智能无法实现，只能解决微不足道的问题（McCarthy, 2000）。


    1973 年，由于詹姆斯·莱希尔（Sir James Lighthill）关于人工智能的报告（Lighthill, 1973）以及美国政府的压力，许多人工智能资金被取消。之后的困难时期被称为“AI
    寒冬”，从 1974 年持续到 1980 年。在他看来，通用人工智能无法实现，AI 被萎缩为仅解决一些微小的问题。然而，在 20 世纪 70 年代，取得了一项突破，最著名的是
    1974 年，雷·库兹维尔（Ray Kurzweil）的库兹维尔计算机公司开发了光学识别（`OCR`）和语音合成器，从而使盲人能够让电脑朗读。这项技术在 1976
    年的美国盲人协会公开，并于 1978 年投入市场。库兹维尔随后将该业务卖给了施乐。它被广泛认为是第一个人工智能产品，尽管今天我们不再将`OCR`与人工智能或机器学习联系起来，因为这已成为常态，但它是`NLP`发展的前身。


    在“AI 寒冬”之后，20 世纪 80 年代见证了人工智能活动的活跃。1986 年，大卫·鲁梅特（David Rumelhart）和詹姆斯·麦克莱德（James
    McClelland）提出了关于并行处理和`NN`模型的观点。他们的著作《并行分布式处理：认知微结构的探索》（1986）描述了他们对感知的计算机模拟的创建，为计算机科学家提供了首批可测试的神经处理模型。20
    世纪 80 年代还还见证了机器人的崛起，许多研究人员认为，人工智能要被使用必须拥有身体；它需要感知、移动、生存并与世界互动。人工智能开始用于物流、数据挖掘、医疗诊断和其他领域。


    20 世纪 90 年代，一种被称为“智能体”的新范式在人工智能社区被广泛接受。智能体是一种感知环境并采取行动以最大化其成功概率的系统。1997 年，IBM
    的`深蓝`（Deep Blue）成为第一个击败现任国际象棋冠军加里·卡斯帕罗夫（Garry Kasparov）的计算机象棋系统。它通过每秒搜索 20 万步赢得胜利。相比之下，20
    年后，苹果`iPhone7`速度比 1997 年的`深蓝`快了 40 倍。我们口袋里就有超级计算机。


    ## 1.1.2.1 带我们进入现在的过去的 20 年


    在过去的 20 年里，更廉、更快的计算机的发展终于跟上了我们对人工智能的追求。我们开始获得能够发挥人工智能作用的计算能力。


