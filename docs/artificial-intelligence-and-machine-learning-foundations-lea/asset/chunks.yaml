    \ to AI development and deployment.\n\nAn AI anthropologist will typically have\
    \ the following role and responsibilities:\n\nHuman-centric research: study the\
    \ interaction between humans and AI systems, focusing on cultural and social impacts.\n\
    \nEthnographic studies: conduct ethnographic research to understand how AI is\
    \ integrated into various communities and cultures.\n\nUser experience: analyse\
    \ and improve user experience by understanding human behaviour and cultural contexts.\n\
    \nInterdisciplinary collaboration: work with engineers, designers and ethicists\
    \ to ensure AI systems are culturally sensitive and user-friendly.\n\nImpact assessment:\
    \ assess the long-term societal impacts of AI technologies.\n\n## 6.2 AI IN THE\
    \ REAL WORLD\n\nAI tools and services are now part of the real world. First, we\
    \ need to consider what this means for:\n\n- `human in the loop` (`HITL`)\n- `anthropology`\n\
    - `ergonomics`\n- `human-centred AI` (`HCAI`)\n- `ethical AI`\n- `collaborative\
    \ intelligence`\n- `transparency and explainability`\n- `inclusive design`\n\n\
    ## 6.2.1 Human in the loop\n\n`HITL` refers to the integration of human oversight\
    \ into AI systems. It ensures that humans remain actively involved in critical\
    \ stages, such as decision-making. \n\n### Table 6.1 Human in the loop\n\n| Importance\
    \ | Example |\n| :--- | :--- |\n| Accountability: ensures there is human accountability\
    \ for decisions made by AI, especially in high-stakes scenarios. Error correction:\
    \ allows for human intervention to correct or override biased AI decisions. Trust\
    \ and acceptance: enhances trust in AI systems by providing human judgement. |\
    \ In healthcare, AI may assist in diagnosing diseases, but the final decision\
    \ and treatment plan are reviewed and confirmed by a human doctor. |\n\n## 6.2.2\
    \ Anthropology\n\nAnthropology in the context of AI refers to the study of human\
    \ behaviour, cultures and social interactions to inform the design and implementation\
    \ of AI systems. It focuses on how AI can be designed to fit into various cultural\
    \ and social contexts.\n\n### Table 6.2 Anthropology\n\n| Importance | Example\
    \ |\n| :--- | :--- |\n| User-centred design (`UCD`): helps create AI systems that\
    \ are more intuitive, culturally sensitive and user-friendly by understanding\
    \ diverse needs and behaviours. Social impact: assesses the broader social implications\
    \ of AI deployment, ensuring systems enhance rather than disrupt social structures.\
    \ Ethical considerations: informs the ethical design of AI by considering cultural\
    \ values and societal norms. | In designing a chatbot for customer service, anthropologists\
    \ might study how different cultures communicate and interact with technology\
    \ to ensure the chatbot’s language and interaction style are appropriate and effective\
    \ for a global audience. |\n\n## 6.2.3 Ergonomics\n\nErgonomics, also known as\
    \ human factors engineering, involves designing AI systems and interfaces that\
    \ optimise human wellbeing and overall system performance. It focuses on creating\
    \ environments and tools that fit physical and cognitive abilities.\n\n### Table\
    \ 6.3 Ergonomics\n\n| Importance | Example |\n| :--- | :--- |\n| Usability: ensures\
    \ AI systems are easy to use and reduce cognitive load, enhancing productivity\
    \ and reducing errors. Comfort and safety: designs AI interfaces and environments\
    \ that are comfortable and safe, minimising physical strain and health risks.\
    \ Efficiency: enhances efficiency by creating AI systems users can interact with\
    \ smoothly and intuitively. | In manufacturing, ergonomically designed AI interfaces\
    \ for operating machinery can reduce the risk of repetitive strain injuries and\
    \ make it easier for workers to interact with complex systems, thereby increasing\
    \ efficiency and reducing errors. |\n"
