    节点是否被激活取决于激活函数。激活函数使用输入函数作为其输入。该输入函数是连接节点的输出之和，并乘以节点间连接的权重。然后，我们需要确定该节点是否被激活。如果使用硬阈值（激活函数输出高于设定值），则这就是感知器。这类神经网络（NN）可以表示在本质上是布尔逻辑的非线性问题。sigmoid
    感知器使用可微的 sigmoid 激活函数，这意味着深度神经网络（DNN）现在可以表示任意函数，同样是非线性的。这使得它们非常强大。阈值激活函数是神经元激活或不激活之间的硬阶跃变化。sigmoid（逻辑回归）激活函数是可微的，并被称为更“软性”，因为触发神经元的决策不是阶跃变化。还有其他类型的激活函数，其使用取决于取决于训练者的经验。


    训练者需要训练神经网络来确定每条连接的未知权重。这不是一项简单任务，也是未来 AI 人员的职责。训练神经网络涉及调整权重以提高神经网络的性能。这些技术涉及正向传播和反向传播，根据期望输出与神经网络输出之间的误差来更新权重。向量微积分知识将在此帮助，神经网络领域的专家也会有所帮助。到目前为止，我们可以神经网络简化为能够理解函数的网络，前提是提供了这些函数的示例。我们可以使用神经网络从我们已知的示例中学习。这使得误差是已知的。当我们没有标记示例可以进行学习时会发生什么？我们可以构建学习示例，并尝试根据对神经网络的理解来形成标签。


    如果我们的问题有很多未知组合——例如一个具有许多可能移动的游戏怎么办？我们可能没有数据来理解所有可能的移动。我们需要以某种方式衡量神经网络的性能。这被称为强化学习，神经网络可以自己学习。强化学习自然符合学习智能体架构。智能体有一个学习组件，学习组件试图最大化奖励或最小化损失。Norvig
    和 Russell (2016) 注意到，强化学习可能被认为涵盖了整个 AI 。在一个环境中，智能体将有一个感知器，并通过学习元素来实现目标。它将使用执行器对环境采取作用。这把产品提升到了智能实体，并赋予了机器人等产品自主性。使用神经网络和强化学习的智能体必须学习如何在环境中实现目标。这种学习是复杂的。通过某种方式，我们需要训练神经网络去探索其环境，创建一个实现目标的策略，并理解它可以使用执行器对环境做什么。


    ### 强化神经网络成功的示例有：


    *   AlphaGo，被教击败世界围棋冠军的计算机（见第 1.1.2.1 节）。该计算机非常成功，它使用的步骤令围棋大师们印象深刻。超级计算机通过在围棋中自我对弈来学习如何玩。这是一个工程仿真环境。

    *   OpenAI，使用神经网络教机器人如何解决魔方（OpenAI, 2019）。机械手可以操作魔方来解决它，因为它有很多传感器和执行器。神经网络学会了如何解决魔方同时也学会了如何操作它的环境。


    ## 4.2.3.9 超参数、算法与权衡


    超参数是在训练过程之前选择的设置。它们控制算法如何学习。例如，学习率决定了每一步调整权重的大小。如果学习率太高，算法可能永远收敛。如果学习率太低，训练将非常缓慢。其他超参数包括神经网络的层数、每层的神经元数量以及批量大小（batch
    size）。


    我们需要以某种方式衡量神经网络的性能。这被称为过拟合和欠拟合。当神经网络对训练数据的学习过好时（包括噪声和随机波动），就会发生过拟合。这导致在新的未见数据上表现糟糕。相反，当神经网络太简单无法捕捉数据中的底层模式时，就会发生欠拟合。这也会导致在训练和测试数据的表现都很糟糕。


    过拟合与欠拟合之间的平衡是机器学习中的一个关键挑战。我们的目标是找到模型对新数据具有良好泛化的平衡点。这通常通过交叉验证、正则化和调整超参数等技术来实现。

    '
