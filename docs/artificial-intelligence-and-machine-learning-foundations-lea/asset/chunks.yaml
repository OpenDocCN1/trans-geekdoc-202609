  trans: '


    人类智能引领我们走过了各次工业革命。我们正处于第四次工业革命之中，但如果我们考虑到 AI，这意味着什么呢？这意味着我们会有越来越多的机器人执行常规、单调、劳累且危险的任务——即承担“重任”。这引入了人类与机器在各自擅长的领域进行合作的理念。


    ## 1.2 什么是人工智能伦理与可信 AI？


    AI 伦理关是我们作为个人、组织以及在更广泛宇宙背景下运作时伦理的一部分。其核心是我们的伦理原则、权利和价值观。伦理为哲学家和学者带来了独特的挑战，特别是
    AI 挑战我们的自由意志或主体性的伦理影响，甚至可能使其具备意识能力。我们将在第 2 章更详细地探讨这些含义。过去十年中出现了一场向可信 AI 发展的运动，捕捉了`阿达·洛芙莱`（`Wikipedia
    Contributors`, 2024a）的精神，她曾质疑技术对社会的影响；近期还有 `Stuart Russell` 的学术著作《AI 与人类兼容性》（`Russell`,
    2019），以及 `Max Tegmark` 在`生命 3.0`（2018）中提出的观点，即在引发 AI 火灾之前，让人类设定目标并设计好 AI 灭火器。这些先驱性工作的结晶推动了欧盟法律《人工智能法案》的进展，使
    AI 具有以人为本伦理目标，且这种目标在技术上是稳健且可信的（`European Parliament`, 2023）。国际标准为我们提供了广泛的文献供参考，我们将在第
    2 章对此增加更多细节。


    AI 世界在不断变化，而且变化率并非线性的；你可能没有注意到，但它实际上正在呈指数级增长，这基本上意味着它每年加速得越来越快。有些人认为，其增长可能会失控，我们需要采取刹车（`Future
    of Life`, 2023）；另一些人则建议让其自由运行，看看它会走向何方。


    许多人担心，并非所有的 AI 改进对人类都有益处，或符合社会的最佳利益。例如，AI 有武器化的潜力，它可能通过监听和观察一切来侵入我们的生活和隐私，并通过隐蔽的
    AI 系统在未经许可的情况下对个人进行识别。还存在个人数据控制权被夺走的可能。那么，AI 应该如何管理和控制？或者，如果我们尝试做正确的事（——无论那意味着什么）但却做错了，会发生什么？


    在日常实践层面，我们正在使用的是针对良好工程或良好定义任务的狭义 AI。


    ## 1.2.1 AI 作为通用设计的一部分


    通用设计概念由建筑师`罗纳德·梅斯`（Ronald Mace）提出，它是对环境进行设计和组成，使所有人都能最大程度地访问、理解和使用。例如，门把手、电梯控制按钮和灯开关的设计应该考虑到所有人，无论他们的年龄、体型、能力或残障。因此，任何新
    AI 服务、系统或产品的考虑因素都是：它是为所有人设计的。


    将 AI 的潜力融入通用设计，可以允许视障人士询问“家庭助手”天气如何，或者让身体不便的人开启暖气，或者让在回家的途中的人开启暖气。这是一个令人兴奋的领域，AI
    可以为每个人带来超能力。


    人类与智能 AI 驱动机器一起工作，有能力做更多事情，无论是在工作环境中减少物理风险或劳累，还是在个人层面教育我们或翻译我们的对话。AI 系统具有让我们变得更人性的潜力。


    我们开发 AI 功能产品、系统和服务的努力和尝试应当侧重于让我们更有人性，提升我们作为人类的素质（提高我们的生理和心理表现，或让我们变得活跃），或提高我们的沟通或社交能力。


    AI 系统和产品的不断出现，意味着我们作为个人以及作为广泛社会的一部分，将不得不重新想象生活的每一个领域，以一种对所有人都有积极意义的方式使用 AI。


    ## 1.2.2 AI 对社会的影响


    AI 将如何改变我们的社会？我们需要考虑 AI 现在和长远来看对更广泛社会产生什么影响，以及为了换取我们将享受的利益，我们准备放弃哪些自由和人类价值观。AI
    使用的增加和广泛采用将伴随着一些风险和挑战，例如武器化的可能，但它也可能解决气候变化和世界贫困。我们该如何平衡风险与收益？


    作为一个社会，我们现在就得准备好如何在现在和未来管理 AI。例如，你是否愿意将工作交给一个 AI 实体，以换取一份基本通用收入？也许愿意，但你是否愿意为了眼前的短期利益放弃孩子未来的职业梦想和抱负？如果我们冲着乌托邦的目标冲过去却搞错了，会发生什么？


    我们之前讨论过 AI 如何通过提高效率和增强我们所做及我们的能力，来影响我们在职场中作为个人的状态。当然，我们以人为本的伦理目标可以用来减轻影响我们日常生活的劣势，消除不平等，让我们变得更有人性，去承担涉及创造力和共情等的任务，特别是帮助消除偏见并提高结果的可持续性和公平性。


    ## 1.2.3 可持续性与环境影响


    代际公平是代际关系中公平或正义的概念或思想。它通常被视为一种关注后代权利的价值概念。它描述了每一代后代都有权继承前人所享有的自然和文化资源的多样性，并公平地获得这些资源的使用收益。一个经常被引用的例子是当代人欠下了必须由后代偿还的债务。


    代际公平的研究和可持续性观点基于三个支柱：经济、社会和环境（见图 1.2）。


    - **经济**——许多经济学家试图预测 AI 对经济的影响。`普华`在 2017 年预测，到 2030 年，AI 将为全球经济贡献高达 15.7 万亿美元（`Rao
    and Verweij`, 2017），超过中国和印度目前的产出总和。其中，6.6 万亿美元可能来自生产率的提高，9.1 亿美元可能来自消费端的效应。


    - **社会**——在 20 世纪 70 年代的英国，整个社区都感受到了大型组织关闭业务（包括航空公司、码头和矿井）的影响。AI 带来的是剧烈动荡和潜在失业的大头新闻。在人机协作的时代，人类有可能转向更高价值的工作，或者在丰富和发展自身才华的同时，让机器承担重任，减轻人类努力的负担。可持续性是欧盟
    AI 指南的一部分，特别是以人为本的伦理目标。因此，评估 AI 对社会的影响是至关重要的。


    - **环境**——AI 的碳足迹无疑对环境产生影响，这需要纳入其商业案例中。`Donna Lu`在 2019 年《新科学》杂志的一篇文章中指出，“创建一个
    AI 对地球的危害可能比汽车还糟糕五倍”（`Lu`, 2019）。


