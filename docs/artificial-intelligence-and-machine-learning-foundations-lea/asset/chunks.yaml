- raw: 'Leonardo da Vinci captured the essence of his science in art (Wikipedia Contributors,
    2024c). René Descartes stated ‘cogito, ergo sum’ (I think, therefore I am) (Wikipedia
    Contributors, 2024b). Ada Lovelace wrote the first algorithm and notes on the
    role of humans and society with technology (Wikipedia Contributors, 2024a). Neil
    Armstrong was the first to set foot on the moon, and changed our perspective of
    the world completely (Wikipedia Contributors, 2024d). Roger Bannister was the
    first to run a mile in under four minutes (Wikipedia Contributors, 2024h). Dr
    Karen Spärck Jones gave us the theoretical foundations of the search engine (Wikipedia
    Contributors, 2024e). Tu Youyou is a tenacious scientist who discovered a cure
    for malaria, which won her the Nobel Peace Prize in 2015 (Wikipedia Contributors,
    2024f). Tu’s intellectual talents are amazing, and, after perfecting her cure,
    she volunteered to be the first person for it to be tested on. We could ask ourselves
    if this was confidence or bravery.


    We have set ourselves up here to introduce the concept of subjectivity. We have
    free will and all of us have our own unique subjective experience. We are conscious
    and subjective, and conscious experience is something that we will need to be
    all too aware of as we develop AI.


    Robert Sternburg gives us a useful definition of human intelligence (Sternburg,
    2017), at least in so far as it relates to AI:


    Human intelligence: mental quality that consists of the abilities to learn from
    experience, adapt to new situations, understand and handle abstract concepts,
    and use knowledge to manipulate one’s environment.


    Here we can quickly recognise the desire to manipulate our environment in some
    way, and that we will use all our human talents to do so. This is a general desire
    so we still need to identify the type of learning from experience that humans
    do, or, to put it another way, what machines can help us with.


    Sometimes called natural intelligence (NI), human intelligence is generally considered
    to be the intellectual accomplishment of humans and has been discussed by philosophers
    for thousands of years. Of course, other living things possess NI to some degree
    as well, but for now let’s just consider human intelligence. We are biased, but
    it’s fair to say that humans are the most intelligent living organisms on the
    planet. Just as we developed tools in the Stone Age and Iron Age, we are now equipping
    ourselves with machines to help us intellectually.


    We may phrase this as coming to the correct conclusions – hypothesising and testing
    – and understanding what is real, although we sometimes get it wrong. It’s also
    about how to understand complex problems such as weather prediction or winning
    a game of chess; adapting what we have learned through things like abstraction,
    induction, simplification and creativity. It allows us to adapt and control our
    environment and interact socially, giving us an evolutionary advantage.


    It may also make sense to consider human intelligence from a number of perspectives,
    such as:


    Linguistic intelligence – the ability to communicate complex ideas to another.


    Mathematical intelligence – the ability to solve complex problems.


    Interpersonal intelligence – the ability to see things from the perspective of
    others, or to understand people in the sense of having empathy.


    So, how do we acquire these particular skills or traits? Through learning from
    experience. Human learning is the process of acquiring knowledge. It starts at
    a very early age, perhaps even before we are born. Our behaviour, skills, values
    and ethics are acquired and developed when we process information through our
    minds and learn from those experiences. Human learning may occur as part of education,
    personal development or any other informal/formal training, and is an ongoing
    process throughout our lives. Each person has a preference for different learning
    styles and techniques (e.g. visual, aural, kinaesthetic, etc.).


    1.1.1.2 The scientific method


    Since the 1980s, AI has adopted the scientific method (Russell and Norvig, 2016).
    The scientific method (Wikipedia Contributors, 2024g) is a systematic, empirical
    approach used for acquiring new knowledge or correcting and integrating previous
    knowledge. It relies on empirical evidence and the testing of hypotheses through
    controlled experiments and observations. This method is fundamental to scientific
    inquiry and is structured to minimise biases and maximise objectivity and reproducibility.
    Wikipedia makes this more explicit by identifying the following:


    careful observation;


    rigorous scepticism;


    hypothesis formulation;


    experiments for testing;


    hypothesis refinement.


    The process begins with careful observation. Scientists observe phenomena and
    gather data, noting patterns and irregularities. These observations often lead
    to questions (rigorous scepticism) about how or why something occurs. For instance,
    a biologist might notice a particular plant species thriving in one environment
    but not another and wonder what factors contribute to its success.


    Following observation, scientists formulate a hypothesis. A hypothesis is a testable
    statement that proposes a potential explanation for the observed phenomenon. It
    should be specific and measurable. For example, the biologist might hypothesise
    that the plant thrives due to higher nitrogen levels in the soil.


    The next step is experimentation. Experiments are designed to test the hypothesis
    under controlled conditions. They should include a control group that does not
    receive the experimental treatment and one or more experimental groups that do.
    The goal is to isolate the variable being tested to determine its effect. Continuing
    with the example, the biologist could plant the species in soils with varying
    nitrogen levels while keeping other factors constant.


    After conducting experiments, scientists engage in data analysis. They collect
    and examine the data to see if they support or refute the hypothesis. Statistical
    methods are often employed to determine the significance of the results.


    Based on the data analysis, scientists reach a conclusion. If the hypothesis is
    supported, it can lead to further experimentation and refinement. If it is not
    supported, the hypothesis may be rejected or modified.


    An important aspect of the scientific method is replication. Results must be reproducible
    by other researchers following the same methodology. This ensures that findings
    are not due to chance or specific experimental conditions. Peer review and publication
    in scientific journals facilitate this by allowing other scientists to scrutinise
    and replicate the work.


    Finally, the scientific method is an iterative process. New questions often arise
    from the conclusions of one study, leading to new hypotheses and experiments.
    This cycle of inquiry builds a more robust understanding of the natural world.
    Over time, hypotheses that consistently withstand rigorous testing may contribute
    to the development of scientific theories, which are comprehensive explanations
    of natural phenomena based on extensive evidence.


    The scientific method, therefore, is not just a series of steps but a dynamic
    and ongoing process of inquiry that drives scientific progress. It underscores
    the importance of scepticism, critical thinking and the constant quest for deeper
    understanding. Through this method, science continuously evolves, expanding our
    knowledge and capability to address complex questions and challenges. Later, we
    will explore how this has led to the industrial revolutions – we are approaching
    the fifth at a great pace.


    1.1.1.3 Artificial intelligence


    In simple terms, AI is intelligence demonstrated by machines, in contrast to the
    NI displayed by humans and other animals. AI is about creating intelligent entities.'
