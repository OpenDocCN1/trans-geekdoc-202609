    Generative AI represents a groundbreaking advancement in the field of AI, characterised
    by its ability to create new content, whether it’s text, images, music or even
    entire virtual environments, that closely mimics human creativity. Unlike traditional
    AI, which is often designed to recognise patterns and make predictions based on
    existing data, generative AI leverages complex algorithms and `NNs` to generate
    novel outputs. This technology has transformative potential across various industries,
    from entertainment and art to healthcare and scientific research, by enhancing
    innovation and automating complex creative processes. As it continues to evolve,
    generative AI is poised to redefine the boundaries of what machines can achieve,
    offering both exciting opportunities and ethical considerations for society.


    Figure 4.10 Algorithm assessment, the trade-off and finding the balance between
    under- and over-fitting


    ![image-7KOPJ3SF.jpg](images/image-7KOPJ3SF.jpeg)


    ## 4.3.1 Key generative AI (Gen AI) terms


    If we are interested in `Gen AI`, these are typical terms we should be familiar
    with:


    `GANs`: an `ML` framework with two `NNs` – the `generator`, which creates data,
    and the `discriminator`, which evaluates it – working together to produce realistic
    data.


    `VAEs`: a type of `NN` that learns to encode data into a compact form and then
    decode it to generate new, similar data.


    `Transformer models`: advanced `NN` architectures, such as a generative pre-trained
    transformer (`GPT`), that are particularly good at generating human-like text.


    `Deepfake`: synthetic media, especially videos or images, created using AI to
    mimic real people, often raising ethical concerns.


    `Neural style transfer`: a technique where AI applies the artistic style of one
    image (e.g. a painting) to another image.


    `Latent space`: a lower-dimensional representation of data that captures its essential
    features, allowing for the creation of new data points by sampling from this space.


    `Prompt engineering`: crafting specific input prompts for generative AI models
    to guide them in producing desired outputs.


    `Tokenisation`: the process of breaking down text into smaller units (`tokens`),
    such as words or subwords, which are then used by AI models for processing and
    generation.


    `Training data`: the data set used to train generative AI models, which they learn
    from to produce new content.


    `Inference`: the phase where a trained AI model generates new data or makes predictions
    based on new input data.


    ## 4.3.2 Purpose and use of generative AI


    If we have a human-centric ethical purpose, harnessing generative AI involves
    a few key steps:


    1. `Train the model`: we start by teaching the AI using lots of examples. For
    instance, if we want it to write stories, we give it many stories to learn from.

    2. `Create new content`: once trained, we can ask the AI to create new content.
    For example, we might give it a few words and ask it to write a paragraph, or
    show it a picture and ask it to create something similar.

    3. `Fine-tune with prompts`: we can guide the AI to produce specific results by
    giving it detailed instructions or examples of what we want.

    4. `Use for specific tasks`: generative AI can be used for various purposes, such
    as making artwork, writing articles, designing products or even creating music.

    5. `Improve over time`: we can keep improving the AI by giving it more data to
    learn from and adjusting its training to make it better at generating what we
    want.


    In simpler terms, we teach the AI by showing it lots of examples, ask it to create
    new things based on what it learned, guide it with instructions and continuously
    improve it to make it more useful for different tasks.


    ## 4.4 SUMMARY


    This chapter delved into the relationship between data and AI, focusing on how
    various data types contribute to `AI` and `ML` projects. It introduced key concepts,
    such as structured, semi-structured and unstructured data, and emphasised the
    importance of handling big data, its volume, variety, velocity and veracity. Additionally,
    the chapter explored data visualisation techniques and their critical role in
    every stage of a `ML` project, aiding in understanding patterns and improving
    decision-making.


    The chapter discussed the significance of data quality, highlighting how poor-quality
    data can lead to unreliable AI models. Key data quality metrics, such as accuracy,
    consistency and timeliness, were explained to ensure that AI systems perform effectively.
    It also underscored the legal and ethical responsibilities tied to data management,
    particularly in light of regulations such as `GDPR`, and outlined the risks involved
    in handling large data sets.


    The chapter introduced a step-by-step approach in preparing data for `ML` projects,
    from framing the problem to data cleaning and visualising the results. It stressed
    the iterative nature of `ML` projects, emphasising that learning from experience
    is central to success.


    The chapter then explored various `ML` algorithms, including supervised, unsupervised
    and reinforcement learning techniques. It provided examples of algorithms, such
    as `regression`, decision trees and support vector machines, explaining their
    uses and challenges. Finally, it covered deep learning algorithms, such as neural
    networks and reinforcement learning, which empower AI to learn autonomously from
    complex data, leading to advanced applications like `AlphaGo` and robotics.


    Generative AI, a groundbreaking AI field, was discussed, showing how it creates
    new content such as text, images and music. The chapter explained key terms and
    techniques such as `GANs` and `transformer models`, highlighting the immense potential
    and ethical considerations of generative AI in creative industries.


    # 5 AI IN ORGANISATIONS


    This chapter looks at the simple ways in which AI is an opportunity for an individual,
    a team, an organisation and in society as a whole. `AI`, and in particular `ML`,
    is helping us daily. It’s worth identifying how you are using it today (smartphones,
    smart TVs, smart roads, search engines). Paul R. Daugherty and H. James Wilson
    have written about their experience doing just that as management consultants
    in `Human + Machine: Reimagining Work in the Age of AI (2018)`. In their book
    they observe how AI is applied in many projects. They describe human-only systems,
    machine-only systems and human-plus-machine systems.


    ## 5.1 AI OPPORTUNITIES AND BUSINESS CASES


    Ever since the realisation that artificial intelligence was possible, we have
    considered the pros and cons of exploiting AI. It is only in the last couple of
    decades, when it has become technologically possible on a large scale, that we
    have seriously considered the challenges, issues and ethics around it; in particular,
    intelligent learning machines replacing humans in various roles. In fact, in some
    industries, automation has been a challenge since the first industrial revolution.
    In other industries and professions, it will be a long time until a machine will
    replace a human and, in certain roles, it will likely never be the case. It is
    likely that in many aspects of our personal and working lives we not be replaced
    by AI, but work alongside learning machines in some way.


    ### 5.1.1 Opportunities for AI in organisations


    In the simplest sense, AI can augment humans and machines and also augment how
    humans and AI machines can work together. This ties in nicely with Stuart Russell’s
    solution to the control problem of AI; we allow the AI to help us to achieve what
    is best for humans (`Russell, 2019`).


    #### 5.1.1.1 Augmenting humans and machines

