    value from them we will get. It is more of an orchestration rather than simply
    following a typical `ML` project checklist.


    ### 4.1.1.3 Data types – unstructured data

    Unstructured data in `ML` refer to information that lacks a predefined format
    or organisational framework, making it inherently more complex to process and
    analyse. This data type includes text documents, images, audio files, videos,
    social media posts and other forms of multimedia content. Due to their free-form
    nature, unstructured data do not fit neatly into rows and columns, posing significant
    challenges for traditional data processing and analysis methods. In `ML`, extracting
    meaningful insights from unstructured data involves advanced techniques such as
    `NLP` for text, computer vision for images and videos and audio signal processing
    for sound. These techniques enable the transformation of unstructured data into
    a structured format that `ML` algorithms can utilise. The ability to harness unstructured
    data is increasingly important, as it represents a vast majority of the data generated
    in the digital age, providing a rich source of information for developing predictive
    models, improving decision-making processes and uncovering hidden patterns and
    trends across diverse applications.


    Working and extracting the value from this type of data requires an expert grasp
    of working with structured and semi-structured data. Indeed, it may require the
    use of `ML` techniques to understand these data. This is an exciting area of `ML`
    that we now have at our fingertips. Our smartphones will soon have `AI` that will
    better inform our use of them. It may be that our digital `AI` capabilities will
    be developed for us, and we won’t need to work with unstructured data as much
    as we think. We’ll just become used to having the `AI` do it for us. What we mean
    here is that we don’t need to understand how the search engine works, and we can
    maximise its benefit by learning how to use it.


    ### 4.1.1.4 Big data

    Big data is a term that often describes the vast array of data that can be found
    on the internet. Big data has the following characteristics (Gregersen, 2024):

    * `Volume` measures the quantity of stored and generated data.

    * `Variety` measures the nature and type of data.

    * `Velocity` measures the speed at which the data is moving.

    * `Veracity` measures the data quality, value or utility.


    Big data in `ML` refers to the massive volumes of data generated at high velocity
    and with a wide variety of formats that traditional data-processing tools cannot
    efficiently handle. These data encompass structured, semi-structured and unstructured
    information originating from numerous sources such as social media, sensors, transactional
    systems and multimedia. In the context of `ML`, big data provides the raw material
    needed to train more accurate and robust models. The sheer scale and diversity
    of big data enable the discovery of complex patterns, relationships and insights
    that smaller data sets might miss. Leveraging big data requires specialised technologies
    and architectures. `ML` algorithms applied to big data can lead to breakthroughs
    in predictive analytics, real-time processing and personalised experiences, driving
    innovation and competitive advantage across industries from healthcare to finance,
    and beyond.


    We might make sense of big data by thinking more about what enables it in the
    first place. The internet gives us interconnectivity that means data can be dug
    from all over the world. It also allows us to access the vast amount of data processing
    we need to work with big data sets. So, to harness big data, we must be familiar
    with parallel computing and networks.

