    ### 3.2.3.2 Hierarchical


    Here, there is a fixed order of events, which is based on top-down planning (see
    Figure 3.4). These robots tend to have a central model to explicitly plan from.
    It tends to be highly controlling in a highly controlled environment and difficult
    to use in complex environments. This is probably OK in a highly organised and
    engineered world, but it does ignore the human cognitive and biological elements;
    for example, we can act and sense at the same time. An example is a robot that
    selects an item from a fixed location.


    Figure 3.4 Hierarchical paradigm in robotic design


    ![image-35ASLCHY.jpg](images/image-35ASLCHY.jpeg)


    ### 3.2.3.3 Reactive


    Reactive robots are always sensing and acting. As the sensing changes, so its
    behaviour changes (see Figure 3.5). Couple these behaviours together and you are
    not stuck with one sense action, which saves planning time. To gain a more intuitive
    understanding, it’s like the knee jerk reaction to being surprised – if we place
    our hand on a hot surface we pull away really quickly, and that is automatic.
    With the reactive paradigm, the robot reacts to a sense input. An example is a
    robot that maintains a set direction but, if a sensor senses an obstacle, the
    wheels react and turn away from the obstacle.


    Figure 3.5 Reactive paradigm in robotic design


    ![image-YTYS75S5.jpg](images/image-YTYS75S5.jpeg)


    ### 3.2.3.4 Hybrid


    This paradigm is a combination of the hierarchical and reactive paradigms. These
    robots plan their initial action to achieve a goal. Sense and act are then informed
    by a plan (see Figure 3.6).


    Figure 3.6 Hybrid deliberative/reactive paradigm in robotic design


    ![image-AE1ZKXZA.jpg](images/image-AE1ZKXZA.jpeg)


    Sensors can update the plan (e.g. identify an object), and this ability allows
    each of the sensors, actions and planning to run at a speed that is appropriate.
    This paradigm is a natural evolution of robotic design that allows different parts
    of the robot to be controlled by something that is appropriate for what it is
    doing. Some of our cars have automatic braking systems that help us to brake more
    effectively if there is an obstacle or an icy road. These systems are reactive,
    but we can think of the driver as the hybrid deliberative/reactive part of the
    system – the driver does the sense, plan, act. An engine management system can
    be thought of as a `sense – plan, act` robotic paradigm: it takes multiple readings
    from the engine (temperature, engine load, air flow rate), plans the optimum fuel
    to air mixture and ensures the car delivers the maximum power with the least emissions.


