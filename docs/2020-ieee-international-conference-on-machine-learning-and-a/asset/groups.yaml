    | 访问控制 | 关于网络中每个实体获得特定访问的详细信息。 | 用户对可能提供的权限没有控制权，可能无法提供访问控制。 | 区块链防止被允许允许的患者操纵数据。
    |

    | 效率 | 这包括患者数据的存储、交换和分析。 | 数据传输方法效率低下。即使使用标准化工具，这些操作也都是手动的。 | 区块链为数据传输提供了效率和安全性。
    |


    Jinglin Ou 等人，本文提供了医疗系统与智慧城市之间的集成，为智慧城市中的患者提供了更方便、质量更高的生活[2]。此外，使用区块链方法帮助系统将患者数据存储在安全的加密存储中。


    Thomas K 等人，区块链技术[3]已成为医疗系统中广泛使用的技术，改进每天都在发生。主要关注的三个方面是：i. 降低成本 ii. 数据隐私与患者数据共享。iii.
    访问控制、效率和透明度。通过此，能够有效的方式实现智慧城市与区块链的集成。


    Tanesh Kumar 等人，众所周知，区块链最初的应用是在金融和银行业，在医疗保健领域[4]，挑战很大，因为透明度和信任起着至关的作用。为了应对这些挑战，正在根据所有利益相关者之间的预定义协议在医疗系统中创建安全的智能合约。


    表 1：区块链可用于填补医疗管理系统中目前的空白


