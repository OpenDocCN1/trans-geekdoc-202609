    Jayneel Ora 等人，安全泄露事件不断增加，这在医疗保健系统中是一个严重问题。当医疗保健出现安全问题时，我们需要患者信息，而隐私将面临危险[6]。通过提供数据安全存储框架的改变数据共享的方式来解决问题。电子健康记录，通过这种方式，他正在分析患者、数据提供者和第三方之间的需求。


