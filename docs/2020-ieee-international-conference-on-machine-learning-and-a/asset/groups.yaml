    # 基于区块链的医疗保健系统


    Wetha M S 女士

    助理教授，

    信息科学与工程系

    BMS 技术与管理学院

    印度，班加罗尔

    swethams_isc204@bmsnit


    Muneshwari M S 先生

    助理教授，

    计算机科学与工程系

    BMS 技术与管理学院

    印度，班加罗尔

    muneshwarams@bmsnit


    Pushpak K 博士

    教授，

    信息科学与工程系

    BMS 技术与管理学院

    印度，班加罗尔

    npushpak@bmsnit


    **摘要—** 区块链技术以其在金融、银行和加密货币等领域的应用而闻名，这些都是可以安全存储和传输的敏感数据。区块链的一个重要优势是其去中心化的特性。在中心化系统中，数据存储存在许多缺点。区块链使用即时消息传递。区块链面临的风险之一是我们避免了单点故障。区块链的这一优势可以用于增加物联网（IoT）设备的数量，从而转向患者的医疗数据。本文旨在探讨区块链不仅可以用于保护电子健康记录（EHR）中的患者信息，还可以允许他们在在必要时向实体授予权限。我们在这里使用了
    Hyperledger，以展示 EHR 如何在医生、患者等网络中的各种实体之间分布。


    易于访问。链条是由 EHR 上的数据创建的，我们可以利用它来感知患者状况，并方便地传输数据 [6]。这减少了涉及的时间和金钱。


    区块链在哈希方面具有极重要性和效率。正如其名称所示，它是记录的扩展列表，被称为区块。这些区块中的每一个都使用密码学相互相连。每个区块不仅包含自身的密码学哈希值，还包含前一个区块的哈希值。它还包含时间戳或交易。此外，它还包含某些与交易相关的其他数据
    [9]。交易通过梅克尔树（Merkle Tree）表示。


    **关键词—** 电子健康记录（EHR）、电子医疗记录（EMR）、Hyperledger、以太坊、智能合约


    #1 引言


    区块链是由中本聪（Satoshi Nakamoto）某个人或一群人发明的。用于比特币的区块链变得流行，它是第一种不需要任何中心或某些第三方就能解决双重花费问题的数字货币
    [3]。此后，区块链开始在供应链、物联网、医疗保健等其他领域进行广泛应用。


    医疗保健系统中的区块链起着至关重要的作用，并变得越来越流行，因为它有助于患者和医生实时提供数据，其中双方可以在世界的不同部分，创建安全的且


    一个区块是一个记录，它是不可修改或删除的。它最重要的属性之一是它是一个开放且分布式的账本。它以一种非常符合规范且几乎永久的方式记录了发生在多个参与方任何两个之间的交易
    [2]。区块链在块链链上增加了一个用于通信和存储新区块的平台，并由 P2P（点对点）网络管理。如果任何区块被修复，则需要网络共识。区块链具有拜占庭容错性，因为数据没有被篡改并且已变得非常安全。


    区块是记录中的一个，它持有一系列有效交易，这些交易经过哈希处理并以梅克尔树的形式存储。正如我们所说的，区块包含自身的哈希值和前一个区块的哈希，它通过时间戳进一步加密
    [8]。因此，如果区块中的任何数据以任何方式被修改或篡改，哈希值就会发生变化，并且与下一个区块中的值不匹配，因此我们就知道它被修改了。另一个重要术语是


    区块时间（block time），即网络生成新区块的平均时间。


    区块时间与交易速度成反比。因此，较短的区块时间意味着更快的交易。当数据存储在由 P2P 网络管理的数据库中时，它消除了中心化系统中发生的若干缺点 [14]。区块链使用哈希机制。区块链面临的风险之一是避免了单点故障。区块链使用密码学。


    混合区块链，正如其名称所示，是公有链和私有链的结合。由于数据是高度分类的且应保持私密，混合链被用于医疗行业。公有链被授予了访问它的人员。


    #3 智能合约


    密钥（Key），正如其名称所示，是区块链上的地址。私钥类似于所有者可以使用的密码。区块链是一个可以在其上执行合约的平台。智能合约基本上是运行在区块链上的程序。触发条件和业务逻辑，因此智能合约通常控制值和状态
    [4]。它们用于两个或多个双方之间。


    智能合约的工作方式


    工作证明非常困难。但很容易验证。工作证明可以随机产生且概率较低 [16]。因此，需要大量的实验和尝试来触发并执行相应的操作。


    -   1. 智能合约在提交之前必须在区块链上达成一致并签署。


    -   2. 智能合约在区块链上提交之前。


    -   3. 创建智能合约的用户可以通过发送交易来调用合约。


    - 4. 矿工随后将验证交易。


    -   5. 代码在沙箱执行环境中执行。


    - 6. 在预言机（即可信数据源）上并且


    #2 区块链的类型


    区块链的类型如下所示：


    ### 公有链

    这种类型的区块链没有访问限制。任何拥有互联网连接的人都可以成为验证者。此外，他们还可以进行交易。区块链的流行例子是比特币和以太坊。


    ### 私有链与公有链不同，除非是网络管理员，否则任何人都可以加入或访问数据。访问权限授予参与者以及验证者。这种类型的区块链对于希望将区块链集成到网络但不想与公共互联网共享任何内容的公司非常有用。


    联盟链

    这种类型的区块链被认为是去中心化的。这也是一种许可网络，并非完全由私有公司控制，每个运行的节点将控制它。联盟链管理员在必要时向用户授予访问。此外，只有少数一组节点将被授予访问以执行共识协议。


    #4 文献综述


    电子健康记录（EHR）在医疗保健行业起着至关重要的作用。它是以记录形式存储的患者病史。它包含了患者状况、治疗进展、提供的处方等细节。


    Anastasia Theondoni 等人，区块链方法最初设计并用于会计和财务部门。但现在它在各种应用中都有用途，特别是在医学领域 [1]。患者健康详情可以在任何时间保存和共享，在获得患者许可的情况下让任何人需要。本文是


