  md: '# 6. OTHER APPLICATIONS OF BLOCKCHAIN IN HEALTHCARE


    Blockchain technology as shown above can be further extended and improved in the
    following technologies.


    # 6.1 Medical data sharing


    A critical and essential application of blockchain with respect to healthcare
    systems is the sharing of medical data digitally between the various subjects
    in the system. Electronic healthcare records (EHR''s) and Electronic Medical records
    (EMR''s) contain very sensitive medical information with respect to the patient.
    Thus, it is necessary to keep this data


    In addition to this it should also be secured and shared. This can be improved
    by decentralizing the data it can be stored and transferred between various participants
    of the network such as patients, doctors, medical practitioners, insurers, researchers,
    Pharmacies Institutions, and so on. However, in order to make so frequently and
    as many entities it has


    Each entity be accountable for their transactions therefore it is transparent.
    This can be obtained using blockchain technology. In addition to this, the entire
    data in the network is recorded along with metadata.


    # 6.2 Maintenance of patients Medical History


    Medical history of a patient is also very important. It is very in order to provide
    a diagnosis for any current health issue. It can be used by research institutions
    to predict and analyze health studies to discover a cure or even preventive measures.
    Examining a patient parent medical history is also very helpful. It is very secure
    to store the medical history of patient.


    As we have already double double is another major issue in the current healthcare
    systems. When patient is going to a different hospital he will have to explain
    again to several doctors who are already prepared with previous history. For example
    the example will be to take an X-ray in this hospital, even though it has already
    been taken in the previous hospital. This is not only a waste of time and money
    but also bad for the health of the patient. This can be avoided by standardizing
    and using blockchain to keep track of all the details, and reports hospital history
    visit, i.e. audit trail.


    # 6.3 Sharing data globally


    It is also possible that the patient is travelling and a situation arises where
    they need to seek treatment for some disease. Using it''s quite evident that the
    previous medical history is very important for the doctor to provide a diagnosis
    for the disease. This can be improved by using blockchain. It''s like to give
    an example to why this is so important. The patient is out of his/her hometown
    and far away and is unable to communicate. He/she is designated for a diagnosis
    in case but the


