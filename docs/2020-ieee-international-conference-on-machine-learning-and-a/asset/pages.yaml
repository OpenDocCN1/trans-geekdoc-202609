    # 2. BLOCKCHAIN TYPES


    The types of blockchains are presented given below:


    +   1) Public blockchains

    This kind of blockchain does not possess any access restriction. Anyone can become
    a validator if they have internet connection. In addition to they can also do
    transactions. They use algorithms such as Proof of Work or Proof of Stake Popular
    examples of blockchains are Bitcoin and Ethereum Blockchain.


