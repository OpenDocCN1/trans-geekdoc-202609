    # 6.4 Medical drug supply chain management


    # BLOCKCHAIN FOR DRUG TRACEABILITY


    ![](img/bf3d4ef673c4bd540c6d106ac5d56426_4_0.png)


    Fig 1: Drug Chain Traceability


    Medical drug supply management is facing several issues and losses due to counterfeit.
    It is very important to get the right drug from the right source. In addition
    to this the drug should also reach the end of the supply chain, to the patient
    without being tampered. For this reason traceability is very important but can
    be achieved using blockchain.


    To have an overview of how this we can look at the Fig 1. When a drug is first
    manufactured, the manufacturer marks it with a unique code. The hash is produced
    using timestamp stamp as proof-of-counterfeit. This information is added to the
    blockchain. The manufacturer then sends the drugs to the wholesaler.


    The wholesaler will be to verify the origin of the drug. The transaction between
    the manufacturer and the wholesaler is added to the blockchain. When the wholesaler
    sends the drugs to the pharmacist who can also verify the origin of the drug the
    transaction between wholesaler and the pharmacist is added to the blockchain.


    Finally, the pharmacist sends the drug to the patient and can verify its source.
    The transaction between the patient and the wholesaler is also added to the blockchain.
    Using blockchain for drug traceability increases the integrity of the process.


