- pgno: 381
  md: '72. C. A storage area network (SAN) is a data network composed of servers that
    connect to a centralized storage space. Storage can be easily expanded to increase
    data recovery. And, if the server’s boot from the SAN rather than DAS, a failover
    server can boot from the original SAN disk, reducing downtime. It costs more,
    but you get more.


    73. D. Patch management is expected, but unexpected software installs are not.
    Know your network, including what is normal and what is abnormal, and always assume
    you are under attack.


    74. D. Although every company is unique, you must ensure that technical, legal,
    and public relations are all on the same page. Technical teams obviously are in
    charge of incident handling, legal assures compliance with the law, and public
    relations needs a clear corporate position to communicate to the media and the
    rest of the company. For example, sales will need to know what to say to customers
    regarding the incident but will likely get that from PR.


    75. A. Mapping regulations to security metrics enables hunt team members to prove
    compliance quickly. If not, they have to gather, organize, and store the necessary
    metrics each time they need to prove compliance, which is time spent better elsewhere.


    76. B. Heuristics and behavior analysis supplement the rules with subtle and detailed
    interpretations of patterns of events, which are based on experience instead of
    a binary rule set.


    77. D. When a Windows machine blue-screens, it creates a memory dump or a crash
    dump. This file has all the computer’s memory at the time of the crash. It can
    help diagnose problems that led to the crash in the first place.


    78. D. Most organizations orchestrate their own incident classification framework
    and base severity on the same categories as the NIST CVE. Those categories are
    Critical, High, Moderate, and Low.


    79. C. You need to determine what types of records were compromised. Was it personal
    information with credit card information or personal information with healthcare
    data? Not only are each type valued differently on the dark web, but you will
    be fined differently based on your compliance requirements.


    80. C. If the hard disk fails due to a mechanical issue, then repeated access
    to the drive can result in losing more data or corrupting what still exists. You
    should minimize access to the drive.


    81. A. With vulnerabilities, patch management is crucial for reducing risk. Some
    vulnerabilities require compensating controls, whereas others require removal
    from the organization. Either way, a reevaluation of response times, head count
    acquisition, and process improvement can all come from an AAR.


    82. A. TCP port 20 is used to transfer data, and TCP port 21 is used for control
    commands. The FTP server listens for a client to initiate a session on port 21
    and then initiates the data connection over port 20.


    83. D. Security best practices and policies should be short—a maximum of two to
    three pages. Shorter policies are elaborated on with procedures, standards, and
    guidelines. Shorter policies are more easily understood and easier for an organization
    to comply with.'
