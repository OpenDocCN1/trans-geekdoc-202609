- pgno: 401
  md: '# Online Test Bank


    Register to gain one year of FREE access after activation to the online interactive
    test bank to help you study for your CASP+ certification exam—included with your
    purchase of this book! All of the chapter review questions and the practice tests
    in this book are included in the online test bank so you can practice in a timed
    and graded setting.


    # Register and Access the Online Test Bank


    To register your book and get access to the online test bank, follow these steps:


    +   1. Go to www.wiley.com/go/sybextestprep.

    +   2. Select your book from the list.

    +   3. Complete the required registration information, including answering the
    security verification to prove book ownership. You will be emailed a pin code.

    +   4. Follow the directions in the email or go to www.wiley.com/go/sybextestprep.

    +   5. Find your book on that page and click the “Register or Login” link with
    it. Then enter the pin code you received and click the “Activate PIN” button.

    +   6. On the Create an Account or Login page, enter your username and password,
    and click Login or, if you don’t have an account already, create a new account.

    +   7. At this point, you should be in the test bank site with your new test bank
    listed at the top of the page. If you do not see it there, please refresh the
    page or log out and log back in.'
