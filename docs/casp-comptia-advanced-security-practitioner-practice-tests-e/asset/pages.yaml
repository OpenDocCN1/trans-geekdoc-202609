- pgno: 270
  md: 'of unauthorized transfers are moving data to a cloud provider, via USB, and
    sending via email. Network-based IDSs and IPSs are looking for malicious network-based
    activities. A firewall is used to filter content flowing through the unit.


    +   9. A. Some more advanced FIM solutions are a part of a host-based intrusion
    detection system (HIDS). As a general rule, they can detect threats in other areas,
    not just files. An NIDS is network intrusion detection, and change management
    is an administrative control. ADVFIM is made up.


    +   10. D. Encrypted packets are not processed by most intrusion detection devices.
    Other potential issues with NIDSs are high-speed network data overload, tuning
    difficulties, and signature development lag time.


    +   11. D. A security information and event management (SIEM) system is used to
    collect logs from various devices on a network and to analyze those logs, looking
    for security issues. Because a SIEM can review logs from various devices, it gets
    a holistic view of actions going on over the network, as opposed to a single appliance
    analyzing only traffic flowing through it. A syslog server is a place to collect
    and monitor network devices. NIPSs and WIPSs are network and wireless intrusion
    protection systems that examine traffic flows to detect and prevent vulnerability
    exploits.


    +   12. D. A web application firewall (WAF) is used to inspect OSI Layer 7 data
    for malicious activity. HTTP/HTTPS/SOAP are all web application protocols that
    operate at OSI Layer 7. Screened host firewalls and packet filter firewalls don’t
    inspect OSI Layer 7 data. A DMZ is a type of screened subnet that permits external
    users’ access to a part of a private network.


    +   13. A. The 802.1x standard from IEEE provides for port-based network access
    control (NAC). It provides a means of authenticating devices that attempt to connect
    to the network. Based on authentication, the Ethernet port can be placed in the
    appropriate VLAN for that device. If a device does not authenticate, the port
    could be placed into a quarantined VLAN or configured for Internet access only.


    +   14. B. Not only can network access control (NAC) authenticate network devices,
    but it can also ensure the enforcement of corporate policies governing these devices.
    If a system is not in compliance with the corporate policy, the device can be
    quarantined until such time when the policy failures are remediated. An HIDS is
    for host detection. An agent is a software program that acts on behalf of a user
    or other program in a relationship. NIPS is for network protection.


    +   15. C. The software installed on devices that will connect to the network
    using NAC is called an agent. A program is a set of instructions that allow for
    a certain kind of digital operation. A process is a set of activities and outcomes
    that produces a software product. A thread of execution is the smallest sequence
    of programmed instructions, typically part of the operating system.


    +   16. D. Data at rest is stored on a device. A VPN contains data moving, which
    means data in transit. VPNs provide secure communications over an insecure network
    like the Internet. A variety of encryption protocols can be used to protect data
    as it moves across a VPN. A SAN is storage-attached network. NAS is network-attached
    storage, and an SSD is a solid-state hard drive.'
