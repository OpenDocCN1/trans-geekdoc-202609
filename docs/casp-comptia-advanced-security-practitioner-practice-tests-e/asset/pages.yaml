- pgno: 379
  md: '50. A. The Common Vulnerability Scoring System (CVSS) is a generic mathematical
    algorithm that scores a vulnerability based on the CIA triad, as well as attack
    vector, authentication, and complexity. The concern is how these vulnerabilities
    affect your specific environment, and for that you need a black-box test so that
    vulnerabilities can be prioritized based on local impact.


    51. D. An anomaly detection–based IDS is best at detecting the newest security
    threats. An anomaly detection device finds the oddities in network traffic behavior
    by taking a baseline first of what normal patterns look like. Once you have a
    baseline, it will compare current traffic to detect abnormal traffic.


    52. B. KillDisk is a tool that enables you to overwrite hard drives numerous times.
    Hard drives contain sectors, and groups of sectors are called clusters. When data
    is written to a sector, the OS can allocate the entire cluster to that data. Deleting
    data by using the OS does not remove the data from clusters. It removes the filename
    from the file allocation table and makes the space available for writing again.
    The data is still there, even when you delete the contents of the recycle bin.


    53. D. You should check the DNS because the FTP server is mapped to an IP address.
    The DNS server is used to resolved hostnames or fully qualified domain names (FQDNs)
    to an IP.


    54. B. A vulnerability scan should be used as an intruder would, without trusted
    credentials on a network. This type of scan can show vulnerabilities that can
    be accessed without logging into the network.


    55. A. An application scanner can help ensure that software applications are free
    from the flaws and weaknesses that attackers often use to exploit and exfiltrate
    data. Backdoors, malicious code, and threats are flaws present in both commercial
    and open source software.


    56. B. Option B is the only answer that is a legitimate process. Scan the client-facing
    web portal to identify any ports that are exposed and services running on those
    ports; then determine if they are vulnerable.


    57. C. Acunetix WVS (i.e., web vulnerability scanner) is used specifically for
    web vulnerabilities. It includes a login sequence recorder giving you access to
    password-protected areas of a website. Also, you can scan any WordPress site for
    more than 1,200 vulnerabilities.


    58. C. Metasploit is an open source collection of exploit tools that can be customized
    with your own tools. It is one of the most popular tools backed by hundreds of
    thousands of users. As a pentester, this tool enables you to pinpoint vulnerabilities
    as well as integrate with Nexpose, one of the best vulnerability management tools.


    59. C. Maltego is an open source platform that can be used as a forensics platform
    to show the complexity in your infrastructure. With Maltego, you can find individuals,
    email structure, websites, domains, IP addresses, DNS, and even documents and
    passwords. It has a GUI interface that can be customized.


    60. B. After running md5 "C:printer_driver.dll", the program returns a series
    of characters that you check against the checksum on the file''s original download
    page.'
