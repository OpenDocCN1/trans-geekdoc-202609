  md: '# Chapter 1: Security Architecture


    +   1. A. An incident is an event that could lead to loss of, or disruption to,
    an organization''s operation, services, or functions. Incident management is a
    term describing the activities of an organization to identify, correct, and analyze
    to prevent a future occurrence. Forensics are performed to find artifacts in an
    environment. Mandatory vacations and job rotation are administrative controls.


    +   2. A. RAID 1 is for redundancy; the data''s level of sensitivity is classified
    based on importance, which is correlated to security measures and who has access,
    and load balancers determine which server in a pool is available and route requests
    to that server. The other answers all pertain to either confidentiality or integrity,
    not availability.


    +   3. C. An intrusion detection system (IDS) is used to detect against intrusion
    from the outside untrusted network into an internal trusted network. It can be
    deployed to watch behind the firewall for traffic that was successful in circumventing
    the firewall, as well as for activity originating from inside the trusted network.
    A RAS (remote access service) is a combination of hardware and software to enable
    remote access tools connecting a client to a host computer. A private branch exchange
    (PBX) is a private telephone network used in a company. DDT is a modern synthetic
    insecticide originally used to combat malaria.


    +   4. A. You want to protect your endpoints from malware, viruses, and spyware.
    A host-based firewall will prevent malicious traffic, where the IDS will only
    report there is an intrusion. All two-factor authentication (TFA) is multifactor
    authentication (MFA), but not all MFA is TFA. Multifactor authentication grants
    a user access after presenting several separate pieces of evidence that belong
    to different categories (including something you are, something you know, and
    something you have). TFA is two pieces of evidence.


    +   5. B. A network-based intrusion detection system (NIDS) monitors traffic traversing
    the network and can alert based on observing attacks and intrusions. The alerts
    can come in various forms, including email and text messages. HIDSs (host-based
    intrusion detection systems) and HIPS/NIPS are intrusion prevention systems.


    +   6. A. A host-based intrusion prevention system (HIPS) is an intrusion prevention
    system used to detect intrusions on a host system like a server and stop those
    intrusions from compromising a system. A HIPS can also alert personnel of the
    intrusion detected. NIPS are network-based, and HIDSs/NIDSs are detection only
    and can be configured to alert but not actually stop anything.


    +   7. B. Wireless intrusion detection system (WIDS) solutions can locate and
    identify Wi-Fi devices as well as Bluetooth, Bluetooth Lower Energy, and devices
    emitting cellular signals. This means a WIDS can discover a cell phone even when
    the Wi-Fi and Bluetooth are not active. Network-based IDSs and IPSs are looking
    for malicious network-based activities. A firewall is used to filter content flowing
    through the unit.


    +   8. A. Data loss prevention (DLP) systems, also called data loss protection
    systems, are designed to examine data as it moves off the host system looking
    for unauthorized transfers. Examples'
  merge: -1
