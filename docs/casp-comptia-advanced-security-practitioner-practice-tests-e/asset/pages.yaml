    the Internet, their location, and how they are used. It is free and helps with
    digital fingerprinting. Shodan also offers a public API that enables other tools
    to access all Shodan’s data.


    +   48. B. A black-box penetration test occurs when the penetration tester has
    no knowledge of the organization.


    +   49. A. The black-box penetration test done by a small firm that has signed
    an NDA gives you a true external perspective of the environment that the CTO requires.'
