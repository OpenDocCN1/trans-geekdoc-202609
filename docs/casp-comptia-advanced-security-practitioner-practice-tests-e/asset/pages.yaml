- pgno: 14
  md: '# About the Technical Editor


    Ryan Hendricks (CISSP, CEH, CASP+, Security+) has more than 16 years of cybersecurity
    and intelligence experience. His first venture started while working intelligence
    operations for the U.S. Navy and then continued in the government and private
    sector as an educator, facilitator, consultant, and adviser on a multitude of
    information technology and cybersecurity principles.


    Hendricks holds many certifications covering hardware, networking, operating systems,
    and cybersecurity. He worked as a trainer for the U.S. Department of Defense,
    educating hundreds of students on everything from military communication systems
    to the CompTIA CASP+ and (ISC)² CISSP certifications.


    Hendricks is a staff architect and manager at VMware. He currently supports all
    technical content creation for the VMware Carbon Black portfolio and additional
    VMware Security products. Additional responsibilities include developing labs,
    updating materials, piloting and expanding the certification programs, mentoring
    and managing the security technical content team, and educating anyone who is
    willing to learn. When not working, Hendricks tries to balance spending his time
    learning new security tools and attack techniques to feed his need for knowledge
    and playing video games with his kids.'
