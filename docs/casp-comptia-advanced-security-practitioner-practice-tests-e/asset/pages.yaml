- pgno: 382
  md: '+   84. D. The situation described has a security risk of data remanence. Remanence
    is the residual information that remains on a disk after it has been erased. The
    VM is unavailable, but that doesn’t mean the data has been destroyed.


    +   85. D. Security marking uses human-readable labels. Security labeling is the
    use of security attributes for internal data structure inside information systems.
    Security marking enables organizational process-based enforcement of security
    policies, whereas labeling enables information system-based enforcement of security
    policies.


    +   86. C. A covert channel is a type of computer attack that enables information
    to be leaked through existing information channels or networks using the existing
    structure. It has been used to steal sensitive data by using some of the space
    available within network packets, enabling the attacker to receive the data without
    leaving a data trail. A packet may have only a single bit of the covert data,
    making it nearly impossible to detect. A primary way of defending against covert
    channels is to examine source code and monitor resource usage by critical systems.


    +   87. D. Software developers often leave a backdoor in tools but should remove
    them before the software goes to market. If the backdoor is left in a product
    by accident, it is called a maintenance hook. A security patch is often used to
    remove the maintenance hook.


    +   88. A. A workgroup is a prime example of privilege management where the user
    accounts are decentralized. The other options are all centralized privilege management
    solutions.


    +   89. C. NIST recommends that data storage media be physically destroyed at
    the final stage of media life. It is also considered the best method of sanitizing
    data.


    +   90. D. A hazard of machine learning is model drift. Machines learn for themselves,
    and it is impossible to figure out how they learned and why decisions were made.
    It is, therefore, difficult to prevent undesirable outcomes in advance or to trace
    them to correct them afterward.'
