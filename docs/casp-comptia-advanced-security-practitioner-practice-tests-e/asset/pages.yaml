- pgno: 380
  md: '61. D. ping is one of the most basic network commands. It helps determine connectivity
    and can be used to measure speed or latency.


    62. C. traceroute is a diagnostic network command and tells us where the packet
    is going.

    This will show the route a packet takes to the destination and can show if the
    network is

    working properly.


    63. B. With file integrity monitoring (FIM), the standard or regulation states
    that data must be

    monitored or managed so as to ensure integrity. FIM software is among the most
    critical

    PCI DSS compliance requirements for the health of a security program. As configurations

    and networks change, it''s possible to become noncompliant with PCI standards
    quickly. FIM

    works by detecting changes to files and configurations. When FIM is installed,
    it creates a

    baseline to determine your current status. It is stored in a database as cryptographic
    hashes

    that cannot be edited, deleted, or altered.


    64. D. Locks secure and fasten something with the goal that the only one with
    a key should have

    access. Lock picks or skeleton keys are tools used to unlock a lock by manipulating
    the tum-

    blers inside.


    65. B. Infrared (IR) cameras see at night by using light with wavelengths that
    are invisible to the

    human eye. If you need to monitor property at night, choose an IR camera.


    66. A. RFID is a tracking system that uses radio frequency. Placing tags on equipment
    enables

    you to trace who checks out the tools. And, if you have a portal type entrance/exit
    reader,

    you''ll know where these tools are, should someone need a specific tool and it''s
    checked out

    to another user.


    67. A. RFID is prone to virus attacks, with the backend database being the main
    target. An RFID

    virus can disclose the tag data or destroy what is in the database, disrupting
    the service.


    68. A. Do not save any program files or documents, because doing so makes your
    computer

    write data to the hard drive, which increases the possibility that the data you
    are trying to

    rescue will be overwritten. You should not move files or folders or reboot the
    machine.


    69. A. With storage, you need strong enough security systems that a break would
    cost potential

    attackers more time and effort (i.e., work factor) than the data is worth. Cost
    and value of

    data is most important—no one wants to end up with systems that are more expensive
    than

    the data''s value.


    70. D. Network topology and subnets are not a concern to be addressed with data-at-rest
    poli-

    cies and procedures.


    71. C. A direct-attached storage (DAS) system is often the cheapest option. The
    first problem

    with DAS is limited disk space, and depending on size, some servers have only
    two or three

    disk slots. This space can be consumed quickly, depending on the type of RAID
    deployed.

    The other problems with DAS are that they need to be backed up often, and they
    cannot

    share data with other servers on the network. DAS is best used for operating systems.'
