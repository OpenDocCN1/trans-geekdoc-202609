- pgno: 12
  md: '# About the Author


    Nadean H. Tanner is the manager of Consulting – Education Services at FireEye/Mandiant,
    working most recently on building real-world cyber-range engagements to practice
    threat hunting and incident response. She has been in IT for more than 20 years
    and specifically in cybersecurity for over a decade. She holds over 30 industry
    certifications, including CompTIA CASP+, Security+, and (ISC)² CISSP.


    Tanner has trained and consulted for Fortune 500 companies and the U.S. Department
    of Defense in cybersecurity, forensics, analysis, red/blue teaming, vulnerability
    management, and security awareness.


    She is the author of Cybersecurity Blue Team Toolkit, published by Wiley in 2019,
    and CASP+ Practice Tests: Exam CAS-003, published by Sybex in 2020. She also was
    the technical editor for CompTIA Security+ Study Guide: Exam SY0-601 (Sybex, 2021)
    and CompTIA PenTest+ Study Guide: Exam PT0-002 (Sybex, 2021), both written by
    Mike Chapple and David Seidl.


    In her spare time, Tanner enjoys speaking at technical conferences such as Black
    Hat, Wild West Hacking Fest, and OWASP events.'
  merge: -1
  img_proc: true
