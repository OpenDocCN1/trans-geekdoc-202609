- pgno: 33
  md: '1. Your organization experienced a security event that led to the loss and
    disruption of services. You were chosen to investigate the disruption to prevent
    the risk of it happening again. What is this process called?


    A. Incident management

    B. Forensic tasks

    C. Mandatory vacation

    D. Job rotation


    2. Brett is a new CISO, and he is evaluating different controls for availability.
    Which set of controls should he choose?


    A. RAID 1, classification of data, and load balancing

    B. Digital signatures, encryption, and hashes

    C. Steganography, ACLs, and vulnerability management

    D. Checksums, DOS attacks, and RAID 0


    3. Charles has received final documentation from a compliance audit. The report
    suggested his organization should implement a complementary security tool to work
    with the firewall to detect any attempt at scanning. Which device does Charles
    choose?


    A. RAS

    B. PBX

    C. IDS

    D. DDT


    4. Nicole is the security administrator for a large governmental agency. She has
    implemented port security, restricted network traffic, and installed NIDS, firewalls,
    and spam filters. She thinks the network is secure. Now she wants to focus on
    endpoint security. What is the most comprehensive plan for her to follow?


    A. Antimalware/virus/spyware, host-based firewall, and MFA

    B. Antivirus/spam, host-based IDS, and TFA

    C. Antimalware/virus, host-based IDS, and biometrics

    D. Antivirus/spam, host-based IDS, and SSO


    5. Sally''s CISO asked her to recommend an intrusion system to recognize intrusions
    traversing the network and send email alerts to the IT staff when one is detected.
    What type of intrusion system does the CISO want?


    A. HIDS

    B. NIDS

    C. HIPS

    D. NIPS'
  merge: -1
  img_proc: true
- pgno: 34
  md: "+   6. Kenneth is the CISO of an engineering organization. He asked the security\
    \ department to recommend a system to be placed on business-critical servers to\
    \ detect and stop intrusions. Which of the following will meet the CISO's requirement?\n\
    +   \n+   A. HIPS\n+   B. NIDS\n+   C. HIDS\n+   D. NIPS\n\n+   7. Paul's company\
    \ has discovered that some of his organization's employees are using personal\
    \ devices, including cell phones, within highly secure areas. The CISO wants to\
    \ know which employees are violating this policy. Which of the following devices\
    \ can inform the CISO who is violating this policy?\n+   \n+   A. DLP\n+   B.\
    \ WIDS\n+   C. NIPS\n+   D. Firewall\n\n+   8. Suzette's company discovered that\
    \ some of her organization's employees are copying corporate documents to Microsoft\
    \ blob cloud drives outside the control of the company. She has been instructed\
    \ to stop this practice from occurring. Which of the following can stop this practice\
    \ from happening?\n+   \n+   A. DLP\n+   B. NIDS\n+   C. NIPS\n+   D. Firewall\n\
    \n+   9. Troy must decide about his organization’s file integrity monitoring (FIM)\
    \ monitoring. Stand-alone FIM generally means file analysis only. Another option\
    \ is to integrate it with the host so that Troy can detect threats in other areas,\
    \ such a system memory or an I/O. For the integration, which of the following\
    \ does Troy need to use?\n+   \n+   A. HIDS\n+   B. ADVFIM\n+   C. NIDS\n+   D.\
    \ Change management\n\n+   10. Lisa is building a network intrusion detection\
    \ system (NIDS). What can an NIDS do with encrypted network traffic?\n+   \n+\
    \   A. Look for viruses\n+   B. Examine contents of email\n+   C. Bypass VPN\n\
    +   D. Nothing"
  merge: -1
  img_proc: true
- pgno: 35
