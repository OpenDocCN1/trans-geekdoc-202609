- pgno: 20
  md: '# Introduction


    CASP+ Advanced Security Practitioner Practice Tests is a companion volume to CASP+
    Study Guide. If you''re looking to test your knowledge before you take the CASP+
    exam, this book will help you by providing a combination of 1,000 questions that
    cover the four CASP+ domains and by including easy-to-understand explanations
    of both right and wrong answers.


    If you''re just starting to prepare for the CASP+ exam, we highly recommend that
    you use CASP+ Study Guide: Exam CAS-004 by Jeff T. Parker to help you learn about
    each of the domains covered by the CASP+ exam. Once you''re ready to test your
    knowledge, use this book to help find places where you might need to read a chapter
    again and study more.


    Because this is a companion to the CASP+ Study Guide, this book is designed to
    be similar to taking the CASP+ exam. It contains multipart scenarios as well as
    standard multiple-choice questions similar to those you will encounter on the
    certification exam.


    # How to Contact the Publisher


    If you believe you''ve found a mistake in this book, please bring it to our attention.
    At John Wiley & Sons, we understand how important it is to provide our customers
    with accurate content, but even with our best efforts an error may occur.


    To submit your possible errata, please email it to our Customer Service Team at
    wileysupport@wiley.com with the subject line “Possible Book Errata Submission.”'
  merge: -1
  img_proc: true
