    # 11.2.1 Definition and characteristics of big data


    “Big data” refers to large and complex datasets that are challenging to handle
    and analyze using traditional data processing approaches. Volume, velocity, variety,
    and value are the key traits that set it apart. This includes organized, semi-structured,
    and unstructured data sources [10]. It may reveal significant trends and insights
    that might help guide data-driven decision making across a range of businesses.
    “Big data” also applies to datasets too large for common systems to handle [11].
    In May 2011, the concept of big data was widely recognized as a promising domain
    for competition, advancement, and efficiency. The number of internet users experienced
    a 7.5% increase from 2016 to 2018, resulting in a total of 3.7 billion individuals
    accessing the internet. The global production of data reached approximately 1
    ZB at its highest point in 2010 and then increased to 7 ZB by 2014 [12]. The three
    dimensions, namely, volume, velocity, and variety, were initially proposed in
    2001 to delineate the growing characteristics of big data [13]. In 2011, the International
    Data Corporation (IDC) employed the four dimensions of volume, velocity, value,
    and to establish a comprehensive framework for defining big data. The inclusion
    of authenticity as a significant characteristic of big data occurred in 2012.
    The present study emphasizes the five predominant characteristics of big data,
    as depicted in the accompanying visual representation, notwithstanding the existence
    of numerous supplementary factors [14].


    Volume: Big data is data. We are currently witnessing the generation of an unprecedented
    amount of data, ranging from terabytes to exabytes and even exceeding these limits.
    This deluge of data comes from a variety of sources, including sensor networks
    that capture real-world phenomena, intricate financial records that document economic
    activities, the dynamic tapestry of social media interactions, and a variety of
    other generators. To deal with this data flood, scalable and reliable storage
    solutions must be implemented alongside cutting-edge processing technologies.
    These technological advancements are critical in facilitating the storage and
    comprehensive analysis of massive data volumes, allowing us to gain valuable insights
    and make informed decisions [10].


    Velocity: It refers to the rate at which massive amounts of data must be generated
    and processed. In today’s interconnected world, data is not only produced but
    it is frequently produced in real time or near real time. This necessitates the
    rapid and efficient processing of such data, which has emerged as a requirement.
