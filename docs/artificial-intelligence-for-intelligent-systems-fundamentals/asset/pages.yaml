    An improved support vector machine classifier (CSA-SVM) was proposed by Devannika
    et al. [8] using the Indian Liver Patients'' Records dataset for the accurate
    diagnosis of liver disease. With a classification accuracy of 99.49%, they excelled
    at optimizing SVMs using the crow search algorithm.


    To identify and predict liver illness, Shaheelum et al. [9] discuss the use of
    ML techniques. SVM, KNN, k-mean clustering, neural networks, and decision trees
    are some of the methodologies that are compared in the study. The decision tree''s
    98.46% accuracy was the maximum obtained. The research emphasizes the significance
    of early prognosis for efficient diagnosis and recovery.


    B. Khan et al. [10] aimed to predict liver disease at an early stage using different
    classification algorithms. They compared RF, logistic regression, and separation
    algorithm based on the parameters and predictive accuracies. Liver disease datasets
    from various sources were used. RF performed the best among the algorithms, offering
    potential to improve health services and early disease prediction. However, it
    has the limitation of focusing solely on related works without considering other
    influencing factors in liver disease prediction.


    Singh et al. [11] proposed a software-based approach for predicting liver illness
    using feature selection and classification approaches. They made use of the Indian
    Liver Patients'' Records dataset from the University of California, Irvine. The
    accuracy of six different categorization algorithms was examined. Several metrics
    were used to evaluate the results. The study discusses software development methodologies,
    the waterfall model being suggested for complicated projects and contributes to
    the development of intelligent liver disease prediction software.


    Nahar et al. [12] compared a comparison analysis of ensemble algorithms for the
    prediction of liver disease using the Indian Liver Patients'' Records dataset.
    The study compared AdaBoost, LogitBoost, BiggRep, BegJ48, and RF models and discovered
    that LogBoost was the most accurate. The work contributes by investigating and
    comparing the use of ensemble methods. The dataset includes 416 records with liver
    disease and 167 without. For model construction and evaluation, the WEKA toolbox
    was used.


    R. Khan et al. [13] conducted a systematic review of computer-aided diagnosis
    for hepatic lesions, focusing on ultrasonography, computed tomography, and magnetic
    resonance imaging. The paper analyzes preprocessing, attribute analysis, and classification
    techniques, highlighting the use of texture properties for attribute analysis
    and SVMs for classification.


    Using ML techniques, Kuzhippalli et al. [14] presented a new classifier for the
    automated diagnosis of liver disease in Indian patients. The evaluate various
    classification methods and visualization strategies using the Indian Liver Patients''
    Records dataset from the UCI repository. Outlier detection is performed using
    isolation forest, and a increased feature selection algorithm is used to improve
    performance. The results show increased accuracy and reduced classification time.
    The stacking estimator combined with RF achieves the highest accuracy.'
