    # 8.1 INTRODUCTION


    The internet of (IoT), a revolutionary technology that links diverse objects and
    allows them to interact and share data easily, has arisen in recent years [1,
    2]. The rapid proliferation of artificial intelligence-internet of things (AI-IoT)
    devices, as sensors, actuators, and intelligent appliances, has exponentially
    increased data traffic within AI-IoT networks [3]. However, this surge in data
    transmission presents significant challenges, including congestion and network
    inefficiencies [4]. Effective data traffic management ensures AI-IoT networks’
    smooth functioning and optimal performance [5]. Congestion, caused by the overwhelming
    amount of data being transmitted simultaneously, can lead to latency issues, packet
    loss, reduced throughput, and compromised reliability [6]. Therefore, developing
    robust strategies and mechanisms to mitigate congestion is paramount in the AI-IoT
    landscape [7].


    In an AI-IoT network, data traffic management is crucial in reducing congestion
    and optimizing device communication [8]. The volume of data created and transferred
    by the growing number of connected devices in AI-IoT networks can soon exceed
    the network infrastructure, causing congestion and performance problems [9]. To
    address this challenge, several approaches are employed. One strategy is prioritization
    and quality of service (QoS), which assigning different priority to various data
    types [10]. This ensures that critical data is delivered promptly while time-sensitive
    data is given lower priority, effectively managing traffic flow. Another approach
    is traffic segmentation, where the network is divided into logical segments or
    VLANs, allowing different types of devices or applications to operate independently
    [11]. This helps isolate traffic and prevents congestion affecting the entire
    network [12]. Bandwidth management techniques are also employed effectively [13].
    By setting limits on bandwidth for devices or applications, fair sharing of resources
    is ensured, preventing any single entity from monopolizing the available bandwidth
    and causing congestion [14]. The growing number of connected devices in AI-IoT
    networks can soon exceed


