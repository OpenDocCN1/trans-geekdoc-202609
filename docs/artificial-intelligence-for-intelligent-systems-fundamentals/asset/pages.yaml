- pgno: 20
  md: '# Part I: Recent trends and challenges of artificial intelligence


    Here, in the opening section, we set the stage. Chapter 1 examines thedisciplinary
    roles of AI and how it is revolutionizing several sectors, by introducing the
    concept of AI and the significance of a multidisciplinary approach in harnessing
    its potential. Chapter 2 introduces deep neural networks and their structures,
    methodologies, properties, and limits. Also discussed are the significant distinctions
    between deep neural networks and standard ML, as well as the big obstacles ahead.
    Chapter 3 focuses on reshaping a comprehensive comparative analysis of AI, deep
    learning (DL), and ML. It briefly outlines the state-of-the-art developments in
    these fields, highlighting key trends, challenges, and applications. Chapter 4
    sheds light on the challenges and possibilities offered by these technologies
    by addressing the fundamental principles of big data mining and distributed processing.
    Also discussed are the distributed processing frameworks'' roles in the administration
    of large datasets and the extraction of valuable intelligence. In Chapter 5, we
    embark on an exploration of quantum AI—an innovative domain, where quantum computing
    and AI converge to reshape our technological landscape.


    # Part II: Secure artificial intelligence in computing systems


    Our journey then takes a deep dive into the security of intelligent systems-based
    AI. Chapter 6 investigates the importance of AI in the realm of cybersecurity
    as well as its potential influence on the protection of computerized information
    and systems. This chapter also summarizes the most recent research on the applications
    and implications of ML and DL techniques in cybersecurity. Chapter 7 discusses
    IoT security issues and threats, reviews current countermeasures, and emphasizes
    the promise of blockchain technology. It explores the security aspects of blockchain,
    highlights its main uses, and compares implementations. Chapter 8 focuses on data
    traffic management in AI-IoT networks to reduce congestion. It explores the underlying
    causes of congestion in AI-IoT networks and presents a comprehensive overview
    of existing congestion control mechanisms. Chapter 9 is mainly based on AI-based
    anomaly IDS. Also, AI-based anomaly IDS''s real-time applications, future trends,
    and solutions are properly incorporated. In addition, technical issues regarding
    IDS are well explained, which will help AI/ML engineers, researchers, and practitioners
    in the near future.


    # Part III: Big data analytics applying in current applications


    Big data analytics in current applications emerges as a focal point. Chapter 10
    focuses on practical objectives and the application of certain methods, the many
    subfields of AI research, and big data-based health care. Some of the common'
  merge: -1
  img_proc: true
