    cancer detection is crucial [7]. There are other potential results, such as substitution,
    amplification, and gathering. While assemblage refers to the situation in which
    AI and people are dynamically combined to work as a single entity, augmentation
    describes the scenario in which AI and humans enhance one another. Last, but not
    least, substitution denotes the AI system''s total replacement of the human.'
