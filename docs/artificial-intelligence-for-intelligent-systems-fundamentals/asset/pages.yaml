    # 14.6 DISCUSSION


    The results of the research are quite interesting, as we have explored the effectiveness
    of various ML algorithms in a balanced dataset. The use of a voting classifier
    is commendable, as it allows for an ensemble approach to decision-making, which
    can improve accuracy. The incorporation of undersampling, oversampling, and SMOTE
    techniques is also a good practice, as it ensures that the dataset used for training
    is representative of the actual distribution. This approach helps to mitigate
    issues related to class imbalance, which is a common challenge in many ML applications.
    Notably, this study found that the extra classifier in each sector led to the
    highest accuracy. This shows that adding more classifiers could increase the performance
    of ML models in real-world applications. Overall, this study underscores the importance
    of carefully selecting appropriate ML algorithms and ensuring balanced datasets
    for achieving optimal model performance. These findings could be useful to researchers
    and practitioners working in this field.


    # 14.7 CONCLUSION AND FUTURE WORK


    Using various supervised ML classifiers, we attempted to provide an accurate diagnosis
    for patients with early detection of liver disease. After careful analysis of
    patient information parameters and implementing eight algorithms, we found that
    the extra classifier achieved the highest accuracy score of each section, followed
    closely by CatBoost algorithms. We also tested a voting classifier of AdaBoost,
    extra tree, and CatBoost algorithms, which demonstrated its effectiveness in improving
    overall performance. Our work has significant implications for health care research
    and development, particularly in low-income countries where access to medical
    resources is limited. By providing early detection and advice on maintaining liver
    health, our approach could help prevent chronic illness and contribute toward
    improving public health. Moving forward, there is still scope for further research
    in this area, including additional algorithms and refining the prediction model
    to improve accuracy.'
