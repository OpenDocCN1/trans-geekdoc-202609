    # 12.2 LITERATURE REVIEW


    In the research they carried out, Ma et al. [26] evaluated six separate machine
    learning algorithms to try to predict hepatitis C. In particular, they showed
    a high accuracy of 95% when using support vector machines (SVMs) and XGBoost algorithms.
    They employed the NHANES and UCI datasets, which include clinical data from a
    group of over 5,000 and 1,000 people diagnosed with hepatitis C, respectively.
    The main finding of the research was the active assessment and contrast of different
    learning methods for predicting the outcome of hepatitis C. The result of the
    research was that SVMs and XGBoost showed the highest degree of accuracy in the
    present situation.


    Wang et al. [27] identified hepatitis B virus (HBV) and HCV status utilizing four
    machine learning models. Notably, their HCV status displayed a 98.1% accuracy
    rate. The NHANES dataset, which consists of clinical data from over 5,000 adults
    in the United States was used by the researchers. This study employed five algorithms
    based on machine learning to predict hepatitis C. This study revealed that the
    k-nearest neighbors (KNN) model was incredibly accurate.


