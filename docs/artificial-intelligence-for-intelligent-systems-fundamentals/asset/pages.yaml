  md: '# 9.4.1 SVM-enabled cyberattack detection for IoT network


    SVM is a widely used technique for attack detection. Feature selection process
    can be made possible with the help of SVM. SVM has two stages: training and//.
    Suad Mohammed Othman et al. proposed a novel technique called spark chi SVM model.
    Data preprocessing using spark is performed. The SVM model is the optimal technique
    to detect cyber threats in IoT environments [36–38].


    # 9.4.2 Decision tree–enabled cyberattack detection for IoT network


    Decision tree is a machine learning classifier to extract information. Decision
    tree can be used for data mining and cyber threat detection as well. IoT network
    is at high risk these days. However, decision tree is considered fast/reliable
    to identify cyberattacks from IoT traces. Deployment of decision tree classifier
    can be made on either binary or multiclass classification. Hybridization of decision
    tree with genetic algorithm will be quite helpful for the feature selection process
    [39–43].


    # 9.4.3 Random forest–enabled cyberattack detection for IoT network


    Random forest (RF) is a machine learning technique that can be utilized for attack
    detection. Dangerous cyber threats like DoS/DDoS can be easily identified using
    RF classifier. Liguo Chen et al. proposed a novel model using RF for data traffic
    management. Also, other flooding attacks like user datagram protocol (UDP) and
    transmission control protocol (TCP) attacks can be detected with the help of RF.
    But RF classifier is time consuming. RF is based on the decision tree, which can
    do classification and regression [44–48].


    # 9.4.4 Logistic regression–based cyberattack detection for IoT network


    Logistic regression (LR) classifier is a machine learning approach that can be
    used for binomial or multiclass classification. However, difficult tasks like
    attack detection can be possible with the help of LR technique. LR is considered
    a lightweight classifier that can be applied in many applications like smart cities,
    drone communication, internet of medical things (IoMTs), smart grid, smart homes,
    and others [49–54].


    # 9.5 AI-BASED ANOMALY IDS APPLICATIONS


    There exist many AI-based anomaly IDS applications.'
