    # 3.6 EVALUATION PARAMETERS USED FOR AI, ML, DL


    Evaluating the effectiveness of solutions-based AI, ML, and DL models is important
    to ensure they align with the desired objective and satisfy all the requirements
    while resolving the studied problem. Many evaluation parameters are deployed to
    validate the efficiency and assess the performance of the models. Choosing the
    optimal parameters on the objectives of the studied problem; AI, ML, DL specifications;
    tasks, and the solution design (see Table 3.2). This section presents the most
    common evaluation metrics to evaluate the AI, ML, and DL models, which are described
    as follows:


    +   - Accuracy: They are used to measure the correctness of classifier prediction.
    It is calculated as the ratio of the correct predictions to the total number of
    predictions.

    - Precision: Also known as positive predictive value, which computes the proportion
    of instances that are truly classified under a specific class out of all the instances
    classified under that class (True Positives (TP) + False Positives (FP)). Precision
    is a valuable measure for determining the level of confidence we can have in considering
    a prediction [31].

    - Recall (Sensitivity or True Positive Rate): Recall, also sensitivity reveals
    the number of correctly classified instances belonging to a class (True Positives
    (TP) + False Negatives (FN)). It measures a model''s ability to classify specific
    class instances accurately.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# 60 Artificial intelligence for intelligent systems


    +   - F1-Score: The F1-score measures the model accuracy and is defined as a harmonic
    mean combining precision and recall, and it always falls within the range of 0
    to 1.

    - It is crucial to understand that the closer the value is to 1, the better our
    model performs. It is also essential to note that the F1-score is highly influenced
    by both recall and precision [32, 33].

    - Specificity (True Negative Rate): Specificity, also known as true negative rate
    (TNR), is measure the model''s capacity to predict the percentage of true negatives
    of each available class. It refers to the percentage of actual negative cases
    correctly identified, which means that a certain percentage of actual negative
    cases are predicted as positive, as false positives. Note that the sum of specificity
    and false positive rate will always be equal to 1. A high specificity indicates
    that the model accurately identifies most negative cases. In contrast, a low specificity
    suggests that the model incorrectly labels many negative cases as positive [34].

    - Area under the Receiver Operating Curve (AUC-ROC): It is mostly used for binary
    classification problems. It is used to estimate the accuracy of a model with a
    good measure of separability has AUC close to or to 1, while a bad one has a value
    close to 0, AUC-ROC relationship helps to measure the model''s ability to differentiate
    between classes [35].

    - Mean Absolute Error (MAE): It measures the average of the remainder of the dataset.
    It is calculated as the absolute difference between the predicted and actual values
    in the dataset.

    - Mean Squared Error (MSE): It is used to measure the variance of the remainder
    of a dataset. It represents the average squared differences between predicted
    and original values in regression tasks [36].

    - Root Mean Squared Error (RMSE): It evaluates the target variable''s consistency
    by measuring the remainder''s standard deviation. It is calculated as the square
    root of the mean squared error. RMSE is used in regression models to estimate
    the loss function. It has the same units as the dependent variable, making it
    widely used metric compared to MSE [36].

    - R-squared (Coefficient of Determination): It is considered a scale-free score
    where the value of R-square is less than one, regardless of the large or small
    values. It is calculated as the proportion of the variance in the dependent variable
    [37].

    - Average Precision (mAP): It measures the performances of object detection models
    such as Fast R-CNN, YOLO, and R-CNN. It considers both precision and recall, as
    well as false positives and negatives. This makes it a suitable metric for a wide
    range of detection applications [38, 39].n- IoU (Intersection over Union): It
    measures the overlap between the predicted and ground bounding boxes [40]. It
    is mostly used in object detection models to measure localization accuracy and
    errors. The higher the overlap region, the greater the IoU [41].'
