  md: '# Chapter 9


    # Artificial intelligence–enabled anomaly IDS for IoT network


    # Trends, Solutions, and Challenges


    Farhood Nishat


    # 9.1 INTRODUCTION


    Nowadays, the internet of things (IoT) is a trending technology that can be used
    to transfer information from one place to another. Wireless communication technologies
    are considered the backbone for IoT networks [1, 2]. IoT networks can be deployed
    in many fields of studies, including smart grid, smart cities [3], the transportation
    industry [4, 5], health care [6], and farming [7], and for military [8, 9] applications
    as well. Integration of artificial intelligence (AI) with IoT will revolutionize
    the concept of smart cities. Intelligent, cutting-edge smart cities will make
    use of AI, machine learning (ML) [10], deep learning (DL) [11], and federated
    learning (12). AI-enabled traffic monitoring applications need to be introduced
    in the near future. The IoT network consists of sensors, networks, and applications.
    Figure 9.1 presents real-time applications of the IoT network. Interconnectivity,
    bandwidth, and end-to-end delay are prime issues in IoT. Due to these problems
    in IoT, an intruder can easily influence the overall network. Also, IoT nodes
    are quite vulnerable to cyberattacks. Denial of service (DoS), distributed denial
    of service (DDoS), domain name system (DNS), ping of death, sinkhole and Sybil
    attacks are dangerous threats for IoT network. Intruder nodes send fake data packets
    to disrupt the overall communication channels within. Weak signals also facilitate
    the intruder to join or hijack the IoT network [13]. Traditional systems cannot
    guarantee or secure the IoT network. Cyberattack detection can be made possible
    with the help of an intrusion detection system (IDS). There exist at least seven
    types of IDS: anomaly, hybrid, network IDS, host IDS, protocol-based IDS, and
    application-based IDS. This chapter’s prime focus is anomaly-based IDS for IoT
    networks. Anomaly-based IDS is based on a specific threshold through which patterns
    can be easily detected. The signature-based IDS has a database of attack patterns.
    The hybrid IDS is a combination of anomaly and signature. The main contribution
    points of this chapter are as follows:


    +   - AI- and ML-anomaly-based IDS techniques and solutions.

    - AI-enabled anomaly-based IDS applications and cases.'
