    # 8.13.2 Dynamic bandwidth allocation


    Implement dynamic bandwidth allocation techniques to allocate bandwidth resources
    based on real-time demand. This approach dynamically adjusts the bandwidth for
    different data flows, prioritizing high-priority or time-sensitive traffic when
    congestion occurs. By adapting bandwidth allocation in real time, network resources
    are efficiently utilized, and congestion is mitigated [152].


    # 8.13.3 Network slicing


    Deploy network slicing, a technique that partitions the network into multiple
    virtual networks, each tailored to specific requirements. By creating dedicated
    slices for different types of traffic or services, such as video streaming, AI-IoT
    data, or critical communications, resources can be allocated optimally, reducing
    congestion and ensuring quality of service for each slice [153].'
