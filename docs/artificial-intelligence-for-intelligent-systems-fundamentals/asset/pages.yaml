  md: '# Artificial intelligence-enabled anomaly IDS for IoT network 195


    # 9.5.1 AI-based anomaly IDS for smart cities


    Recently, the concept of smart cities is trending, and many researchers, practitioners,
    and engineers are attracted to the idea. Therefore, the infrastructure of smart
    cities needs to be secured. As IoT-enabled smart cities mainly rely on wireless
    communication networks, AI/ML techniques can be utilized to safeguard smart cities.
    With anomaly-based IDS, a novel threshold can be either based on AI/ML-DL. With
    the help of these techniques, overall smart city communication will be properly
    secured. Also, through AI techniques, by using IoT-enabled IDS, cyberatacks can
    be easily detected [55].


    # 9.5.2 AI-based anomaly IDS for future transportation


    Nowadays, the world is moving toward future connected transportation systems like
    drone taxis, autonomous vehicles, electric vehicles, and solar-based vehicles.
    Accordingly, security is much needed for these systems. AI/ML-based anomaly IDS
    will help identify cyber threats and balance quality-of-service metrics [56].
    Also, vehicular hoc networks can be utilized to improve communication within future
    connected transportation networks [57].


    # 9.5.3 AI-based anomaly IDS for smart grid


    IoT-enabled smart grid system has electric connections. The smart grid mainly
    improves energy conservation, demand response, and smart metering. Due to complex
    IoT-connectivity, wireless technology is used. Therefore, the smart grid has many
    vulnerabilities, through which an intruder can send fake data packets. Moreover,
    AI/ML-based IDS can be used to identify cyber threats on the smart grid [58].


    Apart from that, AI-based anomaly IDS will detect cyber threats in smart agriculture
    [59], smart homes [60], the health care industry [61], and educational organizations,
    and the military [62] as well [63].


    # 9.6 AI-ENABLED ANOMALY DETECTION USE CASES


    In this section, AI-enabled anomaly detection cases are presented.


    # 9.6.1 AI-anomaly detection for health care industry


    AI tools can be deployed in the health care industry to detect cyber threats.
    The use of AI-enabled technologies will secure communication channels in wireless
    body sensor networks. Also, AI techniques will be used for diagnoses, detection,
    prediction, and analyzing. Moreover, clinical trials using AI tools will help
    medical doctors and patients. AI/ML with natural language processing will be utilized'
