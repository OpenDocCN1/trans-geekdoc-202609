    # 9.8 FUTURE TRENDS AND CHALLENGES


    AI-based IDS plays an important role in the security of IoT networks. Anomaly-based
    IDS using AI techniques are much better than signature and hybrid IDS. AI/ML-based
    IDS in the near future must be less costly and achieve a high level of accuracy
    to detect dangerous cyberattacks [69]. Cyber threats like DNS [70], DoS, DDoS
    [71], Sybil [72], TCP/UDP and man-in-the-middle attacks can be easily identified
    using optimization techniques, game theory, fuzzy logic, ANNs, and ML/DL.


    # 9.9 CONCLUSION


    This chapter provides detailed information about AI/ML-based IDS for IoT networks.
    Many IoT- and IDS-related issues are highlighted. ML techniques like SVM, decision
    tree, LR, and RF are discussed in detail. These techniques improve accuracy level
    in the detection of cyberattacks. AI/ML techniques can only be applied on a large
    number of datasets. Various real-time applications of AI-based IDS are incorporated.
    Also, AI/ML-based IDS can be helpful in both civil and military domains. Real-time
    case studies about health care, defense, government, and banking using AI-based
    IDS are discussed. False positive/negative rate needs to be balanced with the
    high level of AI/ML techniques. Apart from this, cybersecurity solutions and future
    trends are presented properly in this chapter.


