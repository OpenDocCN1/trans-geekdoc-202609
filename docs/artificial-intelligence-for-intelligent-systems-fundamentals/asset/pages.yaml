    # 8.5.3.2 Limited bandwidth


    AI-IoT networks often operate within constrained bandwidth environments, especially
    in wireless communication scenarios. The limited bandwidth becomes a bottleneck
    when numerous devices attempt to transmit data simultaneously, resulting in congestion
    [97].


    # 8.5.3.3 Bursty traffic patterns


    AI-IoT applications generate data sporadically, with bursts of activity during
    specific periods. For example, multiple devices, such as sensor readings or control
    commands, in a smart home environment, may simultaneously send data updates. These
    bursty traffic patterns can overwhelm the network and lead to congestion [97].


    # 8.5.3.4 Inefficient routing


    Inefficient routing protocols or network configurations can contribute to congestion
    in AI-IoT networks. Suboptimal routing decisions may cause data packets to take
    longer routes or encounter bottlenecks, leading to increased latency and congestion
    [98].


    # 8.5.3.5 Lack of quality-of-service mechanisms


    AI-IoT networks often encompass diverse applications with varying QoS requirements.
    Without appropriate QoS mechanisms, critical data packets may not receive the
    necessary prioritization, resulting in congestion and degraded performance for
    time-sensitive applications [99].


    # 8.5.3.6 Network interference


    In wireless AI-IoT networks, interference from other devices or networks operating
    on the same frequency bands can lead to congestion. Interference can cause packet
    loss, retransmissions, and increased collisions, reducing the overall work capacity
    and causing congestion [100].


    # 8.5.3.7 Security attacks


    Malicious activities such as distributed denial of service (DDoS) attacks or botnets
    targeting AI-IoT devices can overwhelm the network infrastructure and cause congestion.
    These attacks flood the network with malicious traffic, disrupting regular communication
    and degrading performance [101].'
