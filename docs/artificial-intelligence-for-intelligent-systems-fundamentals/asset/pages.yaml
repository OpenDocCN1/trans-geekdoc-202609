    procedures and streamlining operations increase productivity and efficiency [2].
    IoT generates enormous amounts of data, which allows for data-driven decision-making
    and making better results [3]. IoT significantly impacts the quality of life through
    smart homes and wearable technology, enhancing safety, convenience, and well-being
    [4]. IoT in health care makes it possible for customized health solutions and
    remote monitoring [5, 6]. IoT supports sustainable initiatives by encouraging
    energy sources and improving resource management [4]. With the integration of
    technologies like artificial intelligence (AI) and big data analytics made possible
    by the connectivity and interoperability fostered by IoT, new opportunities and
    innovation are made possible [3]. However, there are now more IoT gadgets on the
    market that may pose serious security risks.


    Cybercriminals are attracted to the IoT due to its unique characteristics, as
