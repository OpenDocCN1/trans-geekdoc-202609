- pgno: 223
  md: '# Artificial intelligence-enabled anomaly IDS for IoT network 193


    Utilizing IDS monitoring of data packets is easily possible. AI for IDS is considered
    a new concept to detect cyber threats. Traditional IDS is specialized to specific
    cyberattacks. Due to this, ML techniques can be used for anomaly-based IDS to
    identify cyber threats. AI/ML-based IDS is an effective approach that uses a huge
    amount of data. IoT sensor nodes collect information, which can be used in decision-making
    processes. AI/ML-based IDS has the learning capacity to identify illegal data
    packets. A training and testing process is involved in AI/ML techniques. Traditional
    methods in comparison with AI/ML techniques are less popular. A high level of
    accuracy can be achieved using AI-based IDS. Also, DL is a category of machine
    learning that can also be deployed to detect cyber threats. In addition, AI-enabled
    IDS relies on feature selection, ML pipelining, data preprocessing, labeling,
    data cleaning, data loading, and unbalancing datasets [21–24].


    # 9.4 MACHINE LEARNING-BASED ANOMALY IDS


    Machine learning is basically a data analytics approach. Also, ML is a subcategory
    of AI. There are two types of ML, including supervised and unsupervised learning.
    Instances with labeled data in the category of supervised learning. However, unsupervised
    learning has unlabeled data. ML techniques can be either semi-supervised, unsupervised,
    semi-supervised, and reinforcement learning. More interestingly, reinforcement
    techniques learn directly from the environment. Figure 9.2 illustrates the types
    of ML like supervised, unsupervised, semi-supervised, and reinforcement learning.
    During experimentation, binary or multilevel classification can be performed.
    Overfitting problem has been solved in ML techniques. Supervised learning–based
    IDS can easily predict or identify network traffic flow [25–27]. More interestingly,
    there are parametric and nonparametric models like logistic regression, naive
    Bayes, k-nearest neighbor, decision tree, and support vector clustering (SVM)
    that can be used for cyberattack detection. Unsupervised clustering algorithms
    and soft computing methods like artificial neural networks (ANNs), fuzzy logic,
    genetic model, colony optimization, and E-AntHocNet can also help identify cyber
    threats [28–35].


    ![](img/8c7c0992f9872f35977e949607bd4072_223_0.png)


    Figure 9.2 Types of machine learning (ML).'
