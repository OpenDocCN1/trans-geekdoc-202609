    predictive maintenance, reduces downtime, and improves efficiency of the production
    line [15]. Moreover, it could also be beneficial to optimize equipment by identifying
    the most efficient way to operate with the least energy consumption. By creating
    cybernetic models of products, designers can identify potential issues and test
    different design options before the product is manufactured. This reduces the
    risks of defects and improves product quality.


    In Industry 5.0, DT technology is used to create a people-centric manufacturing
    environment. By creating cybernetic models of physical assets or systems, engineers
