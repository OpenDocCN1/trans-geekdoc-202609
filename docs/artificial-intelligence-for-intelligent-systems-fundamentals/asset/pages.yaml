  md: '# Preface


    Recent technological infrastructure developments have diverse applications. Smart
    efforts from academia and industry have already been put to research on artificial
    intelligence (AI) for intelligent computation. Although, AI is designed to optimize
    5G, 6G, the internet of things (IoT), cloud computing, edge, ad hoc networks,
    and intrusion detection systems, the AI-based intelligent system, network security,
    and data analytics need to be used for better communication. As the overall topological
    structure has advanced with the passage of time, there exist several issues that
    need to be addressed. AI is deployed in real-time applications, including agriculture,
    transportation, health care, and industry. Nowadays, machine learning (ML) models
    have the capabilities of better prediction. Cognitive computing techniques schedule
    resources that provide better communication channels, and novel algorithms have
    been made possible using the ML approach to give low-cost solutions.


    The aim of this book is to highlight the most promising lines of research, using
    new technologies and methods based on AI/ML techniques to solve issues and challenges
    collects data using smart technological applications like IoT-based wireless networks,
    digital health care, transportation, blockchain, 5G industry, and deep learning
    for better decision-making. AI-enabled networks will be integrated in the smart
    cities’ interconnectivity. Wireless networks will play an important role. The
    digital era of computational intelligence will change the dynamics and lifestyles
    of human beings. Future networks will be introduced with the help of AI technology
    to implement cognition in real-world applications. Cyber threats are dangerous
    to encode information from networks. Therefore, AI intrusion detection systems
    need to be designed for identification of unwanted data traffic.


    This book is divided into three parts. Part I introduces the recent trends and
    challenges of AI. Part II goes in depth to the security of intelligent systems
    using AI, and part III explores the role of big data analytics in current.'
