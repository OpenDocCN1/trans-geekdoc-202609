    # 7.2.1 Risks associated with compromised IoT devices


    IoT device security risks can seriously impact user privacy, data security, and
    overall system integrity. First of all, since hackers can use IoT device vulnerabilities
    to take over and access critical data, unauthorized access becomes a serious problem
    that threatens both business and personal data. Furthermore, infected IoT devices
    act as an entry point for breaches, enabling hackers to enter networks and access
    important data, posing a serious risk to individuals and organizations.


    Attackers frequently used IoT devices to perform massive distributed denial of
    service (DDoS) attacks. Attackers overpower systems or networks via a bot of infected
    devices, resulting in service interruptions and financial losses [18]. In addition,
    hacked IoT devices in critical infrastructure, such as industrial control systems,
    present dangers to physical safety. Attackers may use these devices to harm people,
    damage property, or even jeopardize their lives [19].


    Malware spreads through the use of compromised IoT devices. Once a device has
    been infected, the malware can propagate throughout networks, contaminating further
    exposed devices and enlarging the scope of the attack [20]. In addition to compromising
    data security, this makes it difficult to patch and update these devices. The
    risk of unauthorized control, privacy invasion, and degraded device performance
    is increased when devices are not regularly updated with security patches or upgrades
    [21].


    # 7.2.2 Existing security measures


    To reduce risks and defend against potential threats, IoT device security mechanisms
    have already been put in place. Password-based authentication is one of the traditional
    authentication methods but is vulnerable to brute-force attacks and password-cracking
    methods [22]. While offering a secure authentication method, public key infrastructure
    (PKI) and digital certificates can be difficult to set up and manage, and a compromised
    private key represents a single point of failure. Transport layer security (TLS)
    encryption provides security but might only partially guard against sophisticated
    attacks like man-in-the-middle attacks. TLS installation in IoT devices could
    also result in security flaws [12].


    Firewalls and network segmentation separate IoT devices and network filters. Although
    this strategy aids in minimizing breaches, it is ineffective if an intruder gains
    access to the internal network. Complex network segmentation can be difficult
    to manage and maintain [23]. The ability of intrusion detection systems (IDS)
    and intrusion prevention systems (IPS) to detect new and undetected threats is
    constrained by their reliance on signature-based detection. Additionally, they
    can produce many false positives, requiring much manual analysis and verification
    [24].


    Updates to software and device firmware are essential for fixing security flaws.
    However, lack of centralized management and coordination makes updating many remote
    IoT devices challenging. Furthermore, IoT devices’ processing and memory capabilities
    are frequently constrained, affecting how well they can handle updates. Centralized
    security systems provide better management and monitoring capabilities, but'
