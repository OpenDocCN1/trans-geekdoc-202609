    # 8.13.5 Dynamic protocol selection


    Utilize dynamic protocol selection techniques that adaptively switch between communication
    protocols based on network conditions and congestion levels. For example, if congestion
    is detected in a specific protocol, the system can automatically switch to a less-congested
    protocol, reducing data traffic and minimizing congestion [155].


    # 8.13.6 Traffic off-loading to edge devices


    Off-load data processing and analytics tasks to edge devices or gateways, reducing
    the need for transmitting large volumes of raw data over the network. Traffic
    congestion can be minimized by performing data processing and optimizing bandwidth
    consumption [156].


