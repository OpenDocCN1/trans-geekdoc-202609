    # 6.6 FUTURE OF CYBERSECURITY


    There are several important points to consider despite the positive predictions
    made regarding the future of this type of safety. Datasets are essential to the
    ML process, yet compliance with privacy regulations can be challenging.


    “right to be forgotten” is in direct conflict with the requirement that software
    systems have access to massive datasets to generate reliable forecasts. Because
    of the possibility of data breaches, including personal identifiers, it will be
    necessary to take corrective actions. Increasing the difficulty of gaining access
    to the data that is required to train the algorithm is one potential solution
    to the problem. Anonymizing data points is yet another approach; this method involves
    additional work to guarantee that it does not disrupt the logic of the program
    in any manner. There is a significant need for specialists in AI and ML security
    who are also familiar with this type of programming. If people oversee updates
    and alterations, network security that relies on machine learning would be substantially
    more efficacious [26, 52]. However, there is a significant gap between the global
    demand for people who can provide these answers and the current supply of such
    people. Even in the far-off future, collaborative efforts from individuals must
    be maintained. The capacity to think critically as well as creatively will be
    beneficial when it comes to forming judgments [53].


