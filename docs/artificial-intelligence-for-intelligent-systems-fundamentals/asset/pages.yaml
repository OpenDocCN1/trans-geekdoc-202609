    # 10.1 INTRODUCTION


    The research into illness diagnostics is crucial in the realm of health care.
    A disease is defined as any factor or set of events that produces suffering, ailment,
    malfunction, or even death in humans. Both the physical and mental well-being
    of a person can be damaged by diseases, which also significantly alter the affected
    individual’s way of life. The medical field has a lengthy history of embracing
    new technology before their time. As of right now, machine learning (ML) and deep
    learning (DL), two subsets of artificial intelligence (AI), are on their approach
    to replacing humans as a dominant force in the health care industry. They are
    already utilized to create new health check activities and manage patient accounts
    and information.


    # 10.2 ALZIMER’S DISEASE


    Alzheimer’s disease (AD) is a neurodegenerative condition that is irreversible
    and gradually reduces intellectual capacity until dementia emerges. Objective
    cognitive abnormalities (which are often severe memory impairments) are used to
    make the clinical diagnosis of AD. In certain circumstances, AD may manifest with
    unusual symptoms, notably defects in non-amnesic areas. The DL algorithm correctly
    identified Alzheimer’s patients 90.2% of the time.


    # 10.2.1 AI for AD diagnosis


    Thanks in part to the use of ML algorithms, complex, extremely dimensional systems
    may be managed by AI technology that are beyond the capabilities of personal information
    processing. By combining data from recently invented tools with data from health
    records, net promoter score (NPS) examination, brain scanning, and biologic markers,
    ML has been applied in the diagnosis of a number of illnesses, including Alzheimer’s,
    which is given in Figure 10.1. Through the use of a magnetic resonance imaging
    PET, 18F-fluorodeoxyglucose-Positron, the


