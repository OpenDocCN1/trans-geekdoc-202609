  md: '# 92 Artificial intelligence for intelligent systems


    # 5.3.1 Quantum algorithms and their applications


    Current, quantum machine learning algorithms are categorized into three different
    approaches. These include quantum machine learning algorithms, which are quantum
    counterparts of the classical ML algorithms, along with algorithms that run on
    actual quantum computers, such as quantum support vector machine (QSVM), which
    is inspired by the classical support vector machine (SVM)—a powerful tool for
    classification and regression tasks in classical ML. QSVM binds the unique features
    of quantum computing to potentially provide an advantage in solving classification
    problems [13].


    A quantum neural network (QNN) represents a fusion of quantum computing principles
    and artificial neural networks, the core components of classical ML. While classical
    neural networks rely on classical bits (0s and 1s) for computation, QNNs operate
    using quantum bits or qubits as their fundamental processing units. This unique
    aspect enables QNNs to leverage quantum phenomena such as superposition and entanglement.
    Quantum gates, which manipulate qubit states, take the place of conventional activation
    functions in neural networks. Quantum superposition positions qubits to several
    states concurrently, potentially offering computational advantages for tasks like
    pattern recognition and optimization. Furthermore, quantum entanglement facilitates
    rapid convergence by connecting qubit states, even when they are spatially distant
    [14].


    Quantum linear regression (QLR) is a quantum machine learning algorithm specifically
    designed for addressing linear regression with increased computational efficiency
    compared to classical methods. Linear regression is a fundamental statistical
    and ML technique used to model associations between a reliable variable and one
    or more dependent variables.


    QLR operates by harnessing the exclusive properties of quantum computing to potentially
    expedite the process of finding optimal parameters in linear regression tasks.
    In linear regression, the primary objective is to identify the best-fit line or
    hyperplane that minimizes the differences between predicted and actual values
    of the dependent variable. This relationship is typically represented by a linear
    equation involving variables like slope and intercept.


    QLR begins by preparing quantum states that represent the dataset and its associated
    labels, which correspond to the dependent variable values. These quantum states
    are manipulated within a quantum circuit. The distinctive advantage of QLR lies
    in replacing classical optimization methods that can be computationally intensive,
    QLR exploits quantum parallelism to potentially accelerate the parameter optimization
    process, particularly for large datasets. Quantum algorithms like the quantum
    amplitude estimation algorithm (QAE) or the HHL algorithm (Harrow-Hassidim-Lloyd)
    are employed to perform this optimization more efficiently than classical counterparts.
    Following the quantum optimization process, measurements are taken to obtain the
    optimized parameters for the linear equation [15].'
