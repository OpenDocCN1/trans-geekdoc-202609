  md: '# Advancements in deep learning


    # 2.1.1 Machine learning


    Machine learning (ML) makes use of AI to let computers learn from their own data
    instead of needing to be specifically programmed for each task. (In other words,
    machines learn without human intervention.) The kind of data available determines
    the algorithms used and adopted to automate the job. ML is a subdivision of AI
    that lets computers secure data and information without being explicitly programmed.
    It begins with actual observations to prepare for data characteristics and trends,
    resulting in improved outcomes and results the. DL uses ML techniques to represent
    high-level abstractions in data via multiple nonlinear regressions.


    # 2.1.2 Categories of machine learning


    The following are the several types of deep learning approaches: unsupervised,
    supervised, semi-supervised, or partly supervised. Furthermore, there seems to
    be a category of learning method known as deep reinforcement learning (DRL), which
    is often addressed as part of unsupervised or semi-supervised learning approaches,
    as illustrated in Figure 2.3.


    # 2.1.2.1 Supervised learning


    Supervised learning is equivalent to training a child to walk. One should hold
    the child''s hand, put his or her foot forward, for demonstration, and so on,
    until the youngster is able to walk independently. Supervised learning is a kind
    of learning that uses labeled data that has a set of inputs and outputs $(x_i,
    y_i)$. For instance, for input $x_i$, the intellectual model might predict $\hat{y}_i
    = f(x_i)$, the model should obtain at that point repetively fine-tune the system
    constraints to get a nearer match to subdivided intended output. The model shall
    be capable of getting accurate responses towards queries from the surroundings
    after effective training. In addition to convolutional neural networks (CNN),
    supervised deep learning approaches include the recurrent


    ![](img/8c7c0992f9872f35977e949607bd4072_59_0.png)


    Figure 2.3 Categories of machine learning.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 30 Artificial intelligence for intelligent systems


    neural network (RNN), deep neural network (DNN), gated recurrent unit (GRU), and
    long short-term memory (LSTM).


    # 2.1.2.2 Unsupervised learning


    Unsupervised learning remains capable of learning devoid of the need of data labels.
    In this instance, the model discovers undiscovered connections or structure inside
    the input data by learning the internal representation or key characteristics.


    # 2.1.2.3 Deep reinforcement learning


    Reinforcement learning (RL) is more difficult to learn than traditional supervised
    approaches since we don''t have a simple function. RL and supervised learning
    differ in the following ways: when you are trying to optimize a function, there
    is no total access to it, and you must interact with it in a state-based context.
    Prior actions determine the value of input. Depending on the problem''s size and
    breadth, it''s possible to choose the appropriate RL for the job at hand. If the
    problem includes a large number of variables that need to be optimized, DRL is
    the ideal approach. When there are fewer parameters to optimize, a derivation-RL
    technique is advantageous.


    # 2.1.2.4 Deep learning


    Using images, text, or speech, a model learns to perform classification problems
    via deep learning. Neural network architecture is often used to accomplish deep
    learning. Network depth is proportional to its layer count, with an increase in
    layers leading to increased network complexity. Traditional neural networks have
    two or three layers, while deep neural networks may contain hundreds. Inspired
    by organic nerve systems, a DNN comprises many nonlinear processing layers, utilizing
    basic components in parallel.


    A deep CNN''s significant improvement in computing capacity, however, requires
    architectural innovations. Making use of spatial and channel depth, architectural
