    # A step toward the detection of alzheimer’s disease using ensemble learning


    Faiza Ayyob, Muhammad Azeem, and Muhammad Imad


    # 13.1 INTRODUCTION


    Amyloidosis (Alzheimer’s disease) is a progressive neurodegenerative illness that
    is chronic, irreversible, and incurable. It is characterized clinically by amnesia,
    cognitive dysfunction, and the progressive loss of numerous other brain functions,
    as well as changes in everyday living situations. Alzheimer’s disease (AD) is
    a neurological illness that progresses over time [1]. Moreover, with an increased
    estimate in the number of people with Alzheimer’s disease from the current 44
    million to 152 million by 2050, the condition is expected to be more prevalent.
    There will be significant economic, medical, and societal ramifications for society
    because of this event. The biology of AD is incompletely understood, and there
    is currently no FDA-approved medication that can cure the disease or halt its
    progression [2]. Mild cognitive impairment (MCI) is associated with an increased
    risk of developing AD compared to people with age-matched healthy cognition. MCI
    is a common state in both cognit normal elderly people and those suffering from
    AD [3]. To diagnose AD early through MCI screening to apply proper management
    and care methods, as well as explore novel drugs and treatments to slow the progression
    of the disease. In vivo, experiments on AD-related abnormalities in the brain
    have been possible because of the development of magnetic resonance imaging (MRI).
    Many promising applications of machine learning have made MRI for the prediction
    of AD [4]. Furthermore, random forest [5], support vector machine [6], and boosting
    techniques [7] are some machine learning examples that can be used. In contrast,
    machine learning algorithms often rely on the manual selection of predefined brain
    regions of interest (ROIs) by recognized MRI scans of AD to their calculations.
    Under our current understanding of definitive MRI biomarkers for AD, it looks
    likely that preselected ROIs will not capture all the information that could be
    useful in unraveling the intricacies of alz. Additionally, manual selection can
    be prone to subjective errors, and it can be time consuming and cumbersome to
    carry out correctly [8]. Moreover, deep learning (DL) is a more advanced'
