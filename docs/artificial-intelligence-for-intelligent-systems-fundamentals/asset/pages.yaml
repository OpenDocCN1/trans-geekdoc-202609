- pgno: 1
  md: '# # Artificial Intelligence for Intelligent Systems


    The aim of this book is to highlight the most promising lines of research, using
    new enabling technologies and methods based on AI/ML techniques to solve issues
    and challenges related to intelligent and computing systems. Intelligent computing
    easily collects data using smart technological applications like IoT-based wireless
    networks, digital health care, transportation, blockchain, 5.0 industry, and deep
    smart cities'' concept for interconnectivity. Future networks will play an important
    role for better decision-making. AI-enabled networks will be integrated in the
    smart cities. The digital era of computational intelligence will change the dynamics
    and lifestyle of human beings. Future networks will be introduced with the help
    of AI technology to implement cognition in real-world applications. Cyber threats
    are dangerous to encode information from networks. Therefore, AI intrusion detection
    systems need to be designed for identification of unwanted data traffic.


    This book:


    +   * Provides a better understanding of artificial intelligence-based applications
    for future smart cities

    * Presents a detailed understanding of artificial intelligence tools for intelligent
    technologies

    * Showcases intelligent computing technologies in obtaining optimal solutions
    using artificial intelligence

    * Discusses energy-efficient routing protocols using artificial intelligence for
    flying ad hoc networks (FANETs)

    * Covers machine learning-based intrusion detection system (IDS) for smart grid


    It is primarily written for senior undergraduate and graduate students and academic
    researchers in the fields of electrical engineering, electronics and communication
    engineering, and computer engineering.'
  merge: -1
  img_proc: true
