- pgno: 226
  md: '# Artificial intelligence for intelligent systems


    for medical image processing. ML techniques can be used for genetic applications.
    Classical AI/ML methods can be directly applied to anomalies. AI tools and techniques
    are quite helpful in the early diagnosis of cancerous cells, heart attacks, pregnancies,
    and others [64].


    In addition, AI-enabled robots will remove surgeries/operations. Also, in the
    near future, AI-enabled robots will change entire dynamics of hospitals. Due to
    this, the cybersecurity of these robots will be much needed. So AI/ML/DL techniques
    will help humans in better way.


    # 9.6.2 AI-anomaly detection for banking


    AI techniques can be used in the banking sector to secure the entire network.
    AI/ML tools are helpful to detect illegal information, which disrupts communication.
    Moreover, AI software''s algorithms can detect fraud and other illegal activities
    within the bank''s network. ML models can detect and prevent attacks to the overall
    banking system. AI-based real-time detection mechanisms have been developed with
    the help of researchers/engineers to accurately identify credit card theft and
    forged documents [65].


    # 9.6.3 AI-anomaly detection for defense and government


    AI-enabled robust detection models will be designed especially for defense and
    government communication. Intruders can send fake information to obtain legitimate
    data from government agencies. Cyberattacks using malware/viruses and unknown
    flooding of data can be utilized to obtain direct access to secret defense networks.
    So AI/ML classifiers can be simulated to identify unknown anomalies [66].


    # 9.7 REDUCING FALSE POSITIVE RATE USING AI


    Due to the increasing demand of IoT devices, they must be secured. AI-enabled
    IDS model can observe/monitor data traffic to detect unknown anomaly. ML and DL
    techniques are widely used to balance high-accuracy metrics. However, there is
    still the main problem of balancing false positive/negative rates. AI-based IDS
    always has the problem of high false positive rate. Due to this, fake messages
    will be generated to hijack/take control of the entire network. False negative
    rate shows a cyber threat like a normal data pattern that affects the whole network.
    Regular network traffic monitoring can be made possible through AI-based IDS.
    More interestingly, AI/ML/DL techniques can reduce the false rate [67, 68]. 9.3
    presents the balancing of high-accuracy metrics like false negative/positive and
    true positive/negative.'
