    in recent years [135]. The ability of electric mobility to reduce greenhouse emissions
    is one of its main benefits. As they run on energy stored in rechargeable batteries
    rather than burning fuels, EVs have no exhaust emissions. Can drastically reduce
    air pollution and climate change by switching from ICEs to electric vehicles.
    EVs have other advantages besides being environmentally friendly. Compared to
    ICE cars, they have reduced running expenses since electricity is often less expensive
    than gasoline or diesel fuel. Additionally, EVs save owners money since they require
    less maintenance and have fewer moving components [136]. Their environmental credentials
    are further strengthened by the incorporation of renewable energy sources and
    electric transport. Using electricity from renewable resources, to charge cars
