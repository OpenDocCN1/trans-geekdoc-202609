    +   - BLEU (Bilingual Evaluation Understanding): It measures the quality of predicted
    text based on the similarity of the human-generated reference text and the machine-generated
    text. It varies from 0 to 1, where more than 0.3 is considered a good score [42].

    - Perplexity (NLP): It measures how well a language model predicts a text sample.
    It is deployed to compare different language models, fine-tune a single model
    parameter, or identify problems in a dataset. The lower the perplexity, the better
    it is used only as a preliminary measure, not for final decision-making, because
    it does not present accuracy. A model can have low perplexity while providing
    a high error rate, negatively affecting the accuracy of the model predictions
    [43, 44].


