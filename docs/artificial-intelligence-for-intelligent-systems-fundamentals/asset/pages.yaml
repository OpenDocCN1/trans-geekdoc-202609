  md: '# Chapter 2


    # # Advancements in deep learning


    Unveiling future trends and applications across AI for intelligent computing


    K. Gurucharan, S. S. Kiran, Dr. Mallavarapu Rajanbabu, and P. Srujana


    # 2.1 INTRODUCTION


    Artificial intelligence (AI) refers to a method for teaching a computer, a computer-controlled
    machine, or software with the facility to think in the same manner as intelligent
    people do. AI is achieved by first researching in what the human intelligence
    works, as well as what method people learn, choose, and function while trying
    to resolve a problem, besides applying the outcomes towards the growth of intelligent
    software as structures. AI is a science and technology that combines disciplines
    such as computer science, biochemistry, neuroscience, linguistics, mathematics
    and engineering to produce intelligent machines. The advances in computer capabilities
    related to human cognition, such as thinking, learning, and problem-solving, is
    a primary focus of AI.


    One or more of the key areas may contribute to the development of an integrated
    system. The applications of AI include entertainment, natural language processing
    (NLP), decision support systems, imaging systems, voice recognition, detection,
    and autonomous robots as shown in Figure 2.1. The inspiration for artificial neural
    networks comes from human intelligence’s neural networks. The human brain is very
    intricate. Scientists and engineers studied the brain care-fully and devised an
    architecture that would work in the digital world of binary computers. Figure
    2.2 depicts such typical building.


    An input layer with many sensors is used to gather data from the outside environment.
    We have an output layer on the right-hand side that provides the network’s anticipated
    outcome. Several layers are concealed between these two. Each new layer increases
    the difficulty of training the network, but it also improves the outcomes in the
    majority of cases.'
