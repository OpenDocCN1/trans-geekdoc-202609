    # 15.7.3.3 Last-mile connectivity


    Bike-sharing and micro-mobility solutions are particularly valuable for last-mile
    connectivity, bridging the gap between public transportation and final destinations.
    Users can easily access bikes or electric scooters at transportation hubs or public
    transit stations, allowing them to complete the last leg of their journey conveniently
    and quickly [149].


    # 15.7.4 Flexibility and convenience


    Bike-sharing and micro-mobility systems offer the flexibility to travel at their
    own pace and choose the most convenient routes. Users can pick up and drop off
    bikes or electric scooters at designated stations or approved parking areas, providing
    for a hassle-free experience. The availability of these options at various locations
    allows users to find a nearby vehicle easily [150].


    # 15.7.4.1 Sustainable and environmentally friendly


    Bike-sharing and micro-mobility solutions promote sustainable transportation by
    reducing emissions and decreasing the reliance on fossil fuels. Encouraging cycling
    and the use of electric scooters, these systems contribute to cleaner air quality,
    lower noise pollution, and a more sustainable urban environment [151].


    # 15.7.4.2 Integration with technology


    Bike-sharing and micro-mobility systems often integrate with mobile apps, allowing
    users to find available bikes or electric scooters, unlock them, and make payments
    seamlessly. These apps provide real-time information about vehicle availability
    and nearby stations and trip planning features, enhancing the overall user experience
    [152].


    # 15.8 CHALLENGES AND FUTURE DIRECTIONS


    # 15.8.1 Data privacy and security


    In the digital era, data privacy and security have become paramount concerns across
    various domains, including the ITS. Safeguarding personal information and ensuring
    secure data practices are essential for maintaining individuals'' privacy rights.
    To secure sensitive data, organizations must adhere to data protection laws and
    put in place security measures. This includes employing secure communication protocols
    for data transmission, implementing access controls and authorization mechanisms,
    and anonymizing or aggregating data to minimize privacy risks. Obtaining informed
    consent and being transparent about data practices are crucial, as is securely
    retaining and deleting data as per regulations. Cybersecurity measures like firewalls
    and regular security audits help prevent'
