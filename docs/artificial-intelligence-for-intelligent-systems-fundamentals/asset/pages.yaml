    # 8.13.8 Adaptive multicast


    Utilize adaptive multicast to transmit data to multiple recipients efficiently.
    Adaptive multicast vastly dynamically adjusts the transmission parameters based
    on the network conditions, optimizing the data distribution and reducing unnecessary
    replication and congestion [158].


    # 8.13.9 Dynamic time slot allocation


    In time-sensitive AI-IoT networks, implement dynamic time slot allocation mechanisms
    that adapt on real-time data and priority. By efficiently scheduling data transmissions
    and avoiding collisions, congestion is reduced, and the overall network performance
    is improved [158].


    # 8.13.10 User-initiated traffic control


    Empower users with the ability to control data traffic and prioritize their communication
    needs. By providing user-configurable traffic controls, such as allowing users
    to define traffic priorities or set data usage limits, congestion can be managed
    at the individual user level, resulting in a more personalized and efficient data
    traffic management approach.


    These unique best practices can contribute to more efficient traffic management,
    reduced congestion, and improved network performance. Organizations should evaluate
    the applicability and feasibility of these practices based on their specific network
    environment and requirements [158].


