    for classification purposes, the raw brain image is far too big to be used in
    its entirety. As a result, to diagnose the disease, it is necessary to preprocess
    the MRI images and perform feature extraction and classification [11]. DL algorithms
    have gained popularity in recent years, and they are now being used to jointly
    learn features from images, as well as for discrimination for image classification
    and computer vision, over other applications [12]. While traditional approaches
    extracted handcrafted characteristics from raw image data using field-specific
    knowledge, deep learning may create a deep neural network architecture from raw
    image data to develop feature representation; traditional methods do not have
    this capability. Deep learning is capable of discovering complex patterns because
    of its capabilities. Whether CNNs interpret the qualities of MRI brain images
    for diagnosing AD was investigated [13]. The main objective of this research is
    to develop an automated process using CNN models that can classify MRI pictures
    and detect Alzheimer''s symptoms before the advanced phase. Three DL models, ResNet-50
    [14], DnsNet-121 [15], and VGG19 [16], are ensemble to detect AD and treat the
    patient to produce possible brain malfunction.


