  md: '# Digital twins for industry 4.0 and 5.0


    Indu Bala, Soumen Mondal, and Dipen Bipari


    # 16.1 INTRODUCTION


    The industrial revolution was a time of great upheaval, as new technologies and
    processes transformed the world of manufacturing. But with each new era came new
    challenges and complexities, as the boundaries between man and machine became
    increasingly blurred. The early days of Industry 1.0 were marked by the introduction
    of mechanized production processes, which brought with them a new level of efficiency
    and productivity. With the passage of time, the machines grew more powerful, and
    the human workers who operated them began to feel increasingly alienated and disconnected
    from their work. In Industry 2.0, the introduction of electricity brought with
    it a new era of automation and innovation. The assembly line revolutionized the
    manufacturing process, allowing factories to produce goods faster and more efficiently
    than before. Since the machines took on more and more tasks, the role of the human
    worker became increasingly marginalized [1].


    Industry 3.0 brought with it a new wave of technological advancements, as computers
    and automation took center stage. The semiconductor industry grew and computer-controlled
    machines and robots developed, productivity and efficiency increased dramatically.
    With the technological advancements and the emergence of Industry 4.0, the ever-steady
    human element of manufacturing began to wane in the face of cyber-physical systems
    and the internet of things (IoT). A new era of connectivity and cognition has
    been ushered in by smart factories. Advanced analytics and machine learning enable
    machines to operate at their peak efficiency. Yet, the integration of artificial
    intelligence (AI) and robotics brought about a bout of perplexity and complexity.
    As automation took over an increasing number of tasks, the role of the human worker
    became increasingly uncertain, leaving many to question their place in the rapidly
    evolving industry.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Digital twins for industry 4.0 and 5.0


    ![](img/8c7c0992f9872f35977e949607bd4072_355_0.png)


    **Figure 16.1** Evolution from Industry 1.0 to 5.0.


    approach to manufacturing to create a balance between automation and the work-force,
    where humans and machines work together to achieve the best possible outcomes.
    This approach is designed to create a more sustainable manufacturing process that
    is better for both workers and the environment [2, 3].


    The fusion of virtual reality (VR) and augmented reality (AR) is one of the major
    components of Industry 5.0. Workers are able to communicate with equipment and
    procedures in a more natural and engaging way through technologies. Virtual training
    programs can be developed using AR and VR to give employees the opportunity to
    learn new skills in an enclosed environment. Another feature of Industry 5.0 is
    the use of advanced analytics and data visualization tools that enable manufacturers
    to analyze data in real-time and make informed decisions. They also provide a
    way to monitor and optimize production processes, leading to increased efficiency
    and productivity [4]. The evolution of various industrial generations is depicted
    in Figure 16.1.


    # 16.2 WHAT MAKES INDUSTRY 5.0 DIFFERENT FROM INDUSTRY 4.0?


    Industry 4.0 is the integration of digital technologies into the manufacturing
    sector. It utilizes technology like IoT, AI, robotics, and cloud computing to
    build smart factories and supply chains that are more effective, adaptable, and
    customer responsive. However, as the world continues to evolve, so does technology.
    Industry 4.0 will soon be replaced by the next phase of industrial revolution—that
    is, Industry 5.0. This new era is focused on merging technology with human skills
    and creativity to create a sustainable, person-centric manufacturing environment.
    In Industry 4.0, machines and technology were given priority over human workers.
    While this was necessary to improve efficiency and productivity, it led to a decline
    in the importance of human skills and creativity. Technology and people will collaborate
    to develop a safer and environmentally friendly production process in Industry
    5.0 [5].


    One of the key differences between Industry 4.0 and Industry 5.0 is the focus
    on sustainability. Industry 4.0 was focused on maximizing efficiency and reducing'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Artificial intelligence for intelligent systems


    waste, but it did not prioritize sustainable practices. Whereas Industry 5.0 is
    all about creating a sustainable future by designing products and processes that
    are environmentally friendly and socially responsible. Another key difference
    is the role of human workers. In Industry 4.0, machines and robots were responsible
    for most of the manufacturing process, while humans were relegated to monitoring
    and maintaining machines. In Industry 5.0, humans will be at the center of the
    manufacturing process. They will use their skills and creativity to work alongside
    machines and technology to create innovative products. Industry 5.0 will also
    require a shift in the way we approach education and training. In the past, education
    focused on teaching technical skills that were necessary operate machines and
    equipment. However, in Industry 5.0, there will be a greater emphasis on soft
    skills such as creativity, communication, and problem-solving that will enable
    workers to collaborate more effectively with machines and technology to create
    innovative solutions [6, 7]. Table 16.1 shows the key differences between Industry
    4.0 and Industry 5.0.


    Table 16.1 Differences between industry 4.0 and industry 5.0


    | Parameter | Industry 4.0 | Industry 5.0 |

    | --- | --- | --- |

    | Technology | Connected devices and systems, IoT,AI, and machine learning | Advanced
    AI, augmented with virtual reality, quantum computing |

    | Data | Big data, real-time analytics | Contextual data, adaptive and predictive
    analytics |

    | Automation | Increased automation of processes and systems | Adaptive automation,
    autonomous decision-making |

    | Human-machine interaction | Humans as operators and maintainers of systems |
    Humans as collaborators and enablers with machines |

    | Cybersecurity | Network and system security, secure data transmission | Advanced
    cybersecurity, AI-powered threat detection and prevention |

    | Interoperability | Standardized communication protocols, open architecture |
    Integrated systems, cross-industry collaboration |

    | Sustainability | Resource optimization, energy-efficient processes | Circular
    economy, sustainable production and consumption |

    | Workforce | Reskilling and upilling of workers, increased demand for technical
    skills | Human-centered design, focus on creativity and social skills |

    | Customer experience | Personalized customer experiences, real-time responsiveness
    | Hyper-personalized experiences, cocreation and collaboration |

    | Business models | Digitally enhanced products and services, data-driven decision-making
    | Value creation ecosystems, innovation-driven business models |


    Note: AI, artificial intelligence; IoT, internet of things.'
