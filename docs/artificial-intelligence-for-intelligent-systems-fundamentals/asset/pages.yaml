    # 13.5 CONCLUSION


    AD is a progressive neurological brain illness that develops from birth. When
    AD is detected early, it can assist in avoiding further damage to the brain tissues
    and aid in the administration of appropriate treatment. A combination of algorithms
    is used to obtain higher prediction accuracy than any of the algorithms used individually
    in the ensemble learning process. Because of the increasing popularity of in-depth
    learning technologies, researchers have begun combining various technologies for
    a variety of different applications. In this study, we suggested a technique based
