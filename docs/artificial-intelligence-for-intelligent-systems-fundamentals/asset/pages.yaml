  md: '# 8.13.4 Peer-to-peer communication


    Implement peer-to-peer (P2P) communication models, where devices or nodes in the
    network can directly exchange data without passing through a centralized server.
    P2P communication reduces the reliance on a single congestion point and distributes
    data traffic across multiple nodes, improving overall network efficiency and reducing
    congestion [154]. Figure 8.5 depicts the concept of peer-to-peer communication,
    participants, known as peers, interact directly with each other without needing
