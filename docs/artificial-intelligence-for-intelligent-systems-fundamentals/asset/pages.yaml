    # 6.5.1 Physical security attack


    Physical attacks, in which the victim''s device''s physical properties are exploited,
    are a common type of low-tech cyberattack. There are many kinds of physical attack.
    Physical damage, in which machines or their parts get damaged to prevent appropriate
    performance; malicious code injection, where an attacker plugs a USB that contains
    a malicious program into the intended device; and object jamming, where signal
    blocks are utilized to disable and control the signals that are emitted by the
    objects. Outage attacks are another type of cyberattack; in this kind of attack,
    the network to which the devices are intentionally disabled to interfere with
    their operations [19, 26, 37].


    # 6.5.2 Man-in-the-middle


    Man-in-the-middle (MITM) attacks are among the most common ones against network
    devices. In terms of computers, in general, an MITM attack allows the attacker
    to act as a proxy by intercepting communication between two nodes. Connections
    between computers and routers; mobile devices; and, most commonly, servers and
    clients are all vulnerable to attack. When it comes to the internet of things
    (IoT), the attacker typically conducts MITM incidents against a device in IoT
    and the application it interfaces with [42]. IoT is especially vulnerable to MITM
    attacks because it lacks the standard methods to guard against the attacks. Figure
    6.3 illustrates MITM.


