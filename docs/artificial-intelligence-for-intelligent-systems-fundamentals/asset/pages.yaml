    # 8.5.4 Impact of congestion on AI-IoT network performance


    Congestion in AI-IoT networks can significantly impact network performance, leading
    to various challenges and disruptions. Here are some of the critical effects of
    congestion on AI-IoT network performance.


    # 8.5.4.1 Increased latency


    Congestion can introduce delays in data transmission, resulting in increased latency.
    The time taken for data packets to travel from the source to the destination can
    significantly increase, affecting real-time applications that require prompt responses.
    High latency can hinder critical AI-IoT applications such as remote monitoring,
    control systems, or autonomous vehicles, where timely actions are essential [105].


    # 8.5.4.2 Packet loss


    Congestion can cause packet loss in AI-IoT networks. When the network structure
    becomes overloaded, it may be unable to handle the incoming data packets. This
    can result in packets being dropped or discarded, leading to data loss and reduced
    reliability. Packet loss can adversely affect applications that require accurate
    and complete data, such as health monitoring or industrial automation systems
    [105].'
