- pgno: 118
  md: '# Artificial intelligence for intelligent systems


    mechanics, the common representation of a qubit state on a unit sphere is known
    as the Bloch sphere, as illustrated in Figure 5.1.


    Quantum gates serve as the quantum counterparts to classical logic gates used
    in classical computing. They form the foundational elements for constructing quantum
    circuits, which execute quantum operations on qubits. Quantum gates manipulate
    qubits, change their states, and enable complex computations. Here are some essential
    quantum gates:


    Pauli-X Gate (X-Gate): This gate is equivalent to a classical NOT gate. It flips
    the state of a qubit from |0> to |1> and vice versa.

    Pauli-Y Gate (Y-Gate): The Y-gate is analogous to the X-gate but also presents
    a complex phase shift, resulting in rotations in the Bloch sphere.

    Pauli-Z Gate (Z-Gate): The Z-gate leaves the basis states |0> and |1> unchanged
    but introduces a phase factor. It''s analogous to a classical phase inversion.

    Hadamard Gate (H-Gate): The Hadamard gate creates superposition by transforming
    |0> into an equal-weighted superposition of |0> and |1>.

    CNOT Gate: The Controlled-NOT gate is an entangling gate that operates on two
    qubits. It flips the second qubit if only if the first qubit is in the |1> state.
    It''s a fundamental gate for building quantum circuits.

    Tffoli Gate: This is a three-qubit gate that performs a classical AND operation,
    controlled by two qubits, on the third qubit.

    SWAP Gate: This swaps the states of two qubits. It''s essential for rearranging
    qubit states in quantum algorithms.


