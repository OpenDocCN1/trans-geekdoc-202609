    # 6.5.3 Bluetooth man-in-the-middle


    Bluetooth connections are often the target of the MITM attacks directed against
    IoT devices. The Bluetooth Low Energy (BLE) standard, which is used by many IoT
    devices, was developed specifically for IoT devices with the goal of being more
    compact, affordable, and power efficient [44–47].


    However, MITM attacks are possible with BLE connections. BLE employs AES-CM encryption
    standard. Although AES encryption is thought to be secure, the way encryption
    keys are often frequently not secure. The technique of pairing is used to exchange
    temporary keys between the devices and what determines the level of security that
    may be achieved [18, 22]. The BLE basically includes three-phase pairing processes:
    in the initial stages, the requesting machine makes a connection request, and
    the gadgets exchanging functions through a vulnerable channel; second, the gadgets
    transfer short-term credentials and confirm they share the same temporary key,
    and that, data can be encrypted using the newly created key, which is transferred
    through a secure link [37].


    # 6.5.4 False data injection attack


    An example of an attack that an adversary could carry out after getting access
    to a few or all the electronic devices that make an IoT network by means of an
    MITM attack is referred to as a false data injection (FDI) attack. FDI attacks,
    measures from IoT sensors are slightly altered by the attacker to evade detection,
    and the tampered data is then output [48–50]. There are other techniques to carry
    out FDI attacks; however in reality, MITM attacks are the most useful. Sensors
    that send information to a machine that does some sort of prediction or analysis
    based on that information are common targets of FDI attacks. These systems, also
    known as preventive maintenance systems, are widely employed to monitor the health
    of mechanical equipment and foretell when servicing or fine-tuning would be necessary.


    # 6.5.5 Botnets


    Attacks on network gateways frequently take the form of coordinated distributed
    denial of service (DDoS) attacks launched from a network of compromised devices
    known as a botnet. Denial of service (DoS) attacks, in which many parties work
    together to disrupt a service''s availability for legitimate users, are one type
    of DDoS attack. DDoS attacks are intended to overwhelm the intended service''s
    infrastructure and interrupt usual information transmission [43, 51]. DDoS attacks
    typically consist of different phases: recruitment, where the intruder searches
    for machines that are susceptible to the DDoS attack to harm the target; communication,
    in which the attacker assesses the affected machines, interprets those that are
    available online, and chooses when to perform the attempts or update a device;
    exploitation and infection, in which the compromised systems are exploited and
    malicious program is inserted. The botnet hierarchy is shown in Figure 6.4.'
