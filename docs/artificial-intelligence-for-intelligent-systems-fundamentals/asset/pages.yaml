    # 11.6 TRENDS AND OPPORTUNITIES


    Nowadays, mobile devices, sensors, patient control devices, the IoT, hospitals,
    researchers, and organizations are generating numerous datasets, which can be
    analyzed using different machine learning and artificial intelligence techniques
    [48]. The biggest challenge is to get datasets, analyze, and find innovations
    in health care systems to make the user''s life healthier and easier, by the induction
    of new methods which not only cure but also predict outcomes at earlier stages
    and real-time decisions.


    # 11.6.1 The evaluation of big data in health care


    The digital medical record, like the digital health record, serves as a storage
    system for consistent medical and clinical information gathered from individuals
    health care services. Software for managing medical practices, digital health
    records, personal health records, and various other components of health care
    information have the potential to improve health care quality, efficiency, and
    cost-effectiveness while decreasing errors. In the early 2000s, digital health
    records were greatly adopted. Nonetheless, the use of digital health records has
    increased significantly since 2009 [49]. Information technology is increasingly
    being used to manage and utilize health data. The development and application
    of technologies for monitoring well-being, as well as the associated software,
    has progressed in tandem with real-time systems for monitoring biomedical and
    health aspects. These technologies can be used to generate alerts and share patient
    health information with the appropriate health care providers. These devices generate
    large amounts of data that can be analyzed to provide immediate clinical or therapeutic
    interventions. The widespread use of data in the health care field has the potential
    to improve health outcomes while lowering costs [50].


    # 11.6.2 Emerging technologies and innovations


    Networked medical devices are getting better because they are getting smaller,
    wireless transmission technology is getting better, processing power is getting
    better, and computers can do more. These gadgets can gather, make, analyze, and
    send information. The phrase “internet of medical things” (IoMT) refers to a framework
    made up of software programs, medical devices, health care services, and computer
    systems that are all connected to each other. All these gadgets and'
