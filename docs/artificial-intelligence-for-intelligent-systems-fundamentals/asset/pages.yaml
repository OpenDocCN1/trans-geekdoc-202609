    # 15.4.10 Technologies enabling intelligent transportation channels


    # 15.4.10.1 Internet of things in transportation


    The transportation sector has radically transformed through the IoT, which has
    changed how infrastructure, cameras, and passengers are linked and communicated.
    The idea of linked automobiles is a crucial IoT application in transportation.
    Vehicles may interact with one another and the local infrastructure by being outfitted
    with connections, sensors, and actuators. This makes it possible for communication
    between vehicles (V2V) and vehicles and infrastructure (V2I), which enhances driving
    safety, efficiency, and convenience. Real-time data on traffic, accidents, and
    road dangers may be shared between connected cars, enabling drivers to make judgments
    and take preventive measures [66]. Intelligent traffic management is a driven
    use of IoT. Real-time information on traffic flow, congestion, and road conditions
    is gathered through IoT-based sensors and devices on roads, traffic signals, and
    infrastructure. The timing of traffic signals is then optimized, traffic lanes
    are managed dynamically, and drivers are given realtime information thanks to
    the analysis of this data. The ITMS helps more efficient transportation operations
    and with shorter times by easing traffic congestion and enhancing traffic flow
    [67].


