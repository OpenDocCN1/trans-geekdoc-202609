    # 8.4.8.6 Hierarchical architecture


    Hierarchical architecture involves organizing devices into multiple tiers or levels
    based on their proximity to the central system. Each tier may have gateways or
    aggregation points that collect and transmit data from a subset of devices. This
    architecture allows for scalable and efficient data aggregation and reduces the
    burden on the central system. It is commonly used in large-scale deployments,
    where devices are spread across different geographical areas [77].


    The choice of AI-IoT network architecture depends on factors such as the use case,
    data processing requirements, latency constraints, scalability needs, and available
    resources. Different architectures offer trade-offs in data latency, bandwidth
    usage, processing capabilities, and system complexity, and the selection should
    be based on the specific requirements of the AI-IoT application [78, 79].


    # 8.5 OVERVIEW OF AI-IOT NETWORKS


    AI-IoT networks are groups of networked gadgets, sensors, and systems that talk
    to one another and share information.


    These networks allow physical items and digital technology to coexist in various
    settings, including smart homes, health care, transportation, industrial automation,
    agriculture, and other areas [80–84].


    # 8.5.1 Overview of AI-IoT network components


    # 8.5.1.1 AI-IoT devices/things


    AI-IoT devices or things are physical objects embedded with sensors, actuators,
    and connectivity capabilities. These devices collect data from the surrounding
    environment or perform actions based on received instructions. Examples include
    intelligent sensors, wearables, home appliances, industrial machinery, and vehicles
    [85].


    # 8.5.1.2 Connectivity technologies


    AI-IoT devices rely on different connectivity technologies to communicate with
    each other and other network components. These technologies include Wi-Fi, Bluetooth,
    cellular networks (3G, 4G, 5G), LPWAN (low power area network) technologies like
    LoRaWAN and NB-AI-IoT, Zigbee, Z-wave, and Ethernet [86].


    # 8.5.1.3 Network infrastructure


    The network infrastructure consists of routers, switches, gateways, and access
    points that enable the transmission of data between AI-IoT devices and other network
    components. It provides the necessary connectivity and supports data routing,
    traffic management, and network security [87].'
