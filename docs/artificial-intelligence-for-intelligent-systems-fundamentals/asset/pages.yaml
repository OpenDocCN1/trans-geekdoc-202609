    # 8.4.8.1 Centralized architecture


    In a centralized architecture, all the data processing, storage, and control functions
    are concentrated in a central server or cloud platform. Devices typically send
    data to the main system, which performs data analysis, storage, and decision-making.
    This architecture offers simplicity and centralized control but may face scalability
    and latency challenges when dealing with large volumes of data [71, 72].


    # 8.4.8.2 Edge computing architecture


    Edge computing architecture distributes data processing and analytics functions
    closer to the devices at the network edge. Devices or gateways perform local data
    processing and filtering, reducing the need for transmitting large amounts of
    raw data to the central system. Edge computing improves latency and bandwidth
    usage and reduces the dependency on cloud connectivity. It is beneficial in applications
    real-time or low-latency processing [73].


    # 8.4.8.3 Fog computing architecture


    Fog computing architecture extends edge computing, introducing intermediate computing
    and storage capabilities between the edge and the cloud cloud. Fog nodes, near
    the devices or gateways, perform local processing and filtering of data. They
    also provide services like data caching, security, and real-time analytics. This
    architecture reduces latency, optimizes bandwidth, and provides a more distributed
    and scalable system than centralized architectures [74].


    # 8.4.8.4 Hybrid architecture


    A hybrid architecture combines elements of both centralized and distributed approaches.
    It leverages cloud platforms for storage, complex analytics, and longterm data
    retention while utilizing edge or fog computing for real-time processing, local
    control, and reduced latency. This architecture balances centralized management
    and distributed processing capabilities [75].


    # 8.4.8.5 Mesh architecture


    In a mesh architecture, devices in the AI-IoT network communicate directly, forming
    a self-configuring and self-healing network. This approach eliminates the need
    for a central gateway, making the network more resilient and scalable. Mesh architectures
    are commonly used in AI-IoT applications like smart homes, industrial automation,
    and smart cities, where devices must communicate efficiently [76].'
