    carpooling services. These initiatives help reduce carbon footprint, improve air
    quality, and promote eco-friendly transportation alternatives [37].


    # 15.3.1.4 Data-driven decision-making


    Transportation systems generate vast amounts of data, including traffic volumes,
    travel patterns, and user preferences. Smart cities leverage this data to gain
    insights into transportation behavior, plan infrastructure improvements, optimize
    route planning, and enhance transportation services. Data analytics and real-time
    monitoring enable evidence-based decision-making, ensuring that transportation
    systems are efficient and responsive to evolving needs [30].


    # 15.3.1.5 Safety and security


    The ITS contributes to enhancing road safety and security. Smart cities deploy
    surveillance technologies, advanced driver assistance systems, and ITMS to detect
    and respond to incidents. This proactive approach helps prevent accidents, improves
    emergency response times, and enhances overall safety for residents and commuters
    [38].


    # 15.3.1.6 Economic growth and productivity


    Efficient transportation networks are vital for economic growth and productivity
    in cities. Well-connected and accessible transportation infrastructure attracts
    businesses, encourages investment, and facilitates the movement of goods and services.
    Smart cities focus on developing efficient logistics systems, intelligent freight
    management, and last-mile delivery solutions to optimize urban logistics and support
    economic activities [39].


    # 15.3.2 Key goals and objectives of intelligent cities


    The goals and objectives of intelligent cities revolve around creating sustainable,
    efficient, and livable urban environments that enhance the quality of life for
    residents [30]. While specific goals may vary based on local priorities and challenges,
    the following are vital goals commonly associated with innovative cities.


    # 15.3.2.1 Sustainability and environmental stewardship


    Smart cities aim to reduce their environmental footprint and promote sustainable
    practices. This includes optimizing energy consumption, integrating renewable
    energy sources, implementing eco-friendly transportation options, managing water
    resources efficiently, and adopting green building standards [40].'
