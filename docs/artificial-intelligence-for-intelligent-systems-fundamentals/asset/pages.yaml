  md: '# Chapter 3


    # Comprehensive comparative analysis of artificial intelligence, machine learning,
    and deep learning


    Hanane Lamaazi and Elizabeth Mathew


    # 3.1 INTRODUCTION


    Artificial intelligence (AI), machine learning (ML), and deep learning (DL) have
    evolved into buzzwords in the world of contemporary technology and now dominate
    talks about the future [1, 2]. These sectors are at the cutting edge of innovation,
    altering industries and significantly affecting our daily lives. This introduction
    gives readers a basic grasp of AI, ML, and DL, their actions, and their relevance
    in the modern world [3]. The goal of the vast and all-encompassing area of AI
    in computer science is to build intelligent agents that can simulate cognitive
    functions in humans [4]. AI systems strive to display traits including perception,
    problem-solving, learning, and decision-making [5]. The search for AI has roots
    in ancient mythology about mechanical entities withlike abilities. Still, it is
    frequently cited that the Dartmouth Workshop in 1956 was the first to take it
    seriously [6]. AI covers many methods, including rule-based systems and neural
    networks, and is used in many industries, including banking and health care. Developing
    methods and models that allow computers to learn data and make predictions or
    judgments without being explicitly programmed is the focus of the AI subfield
    of machine learning [7]. Large datasets are analyzed, and then systems gradually
    improve in performance as they “learn” to generalize from past experiences to
    new ones. Unforeseen data is a fundamental idea in machine learning [5, 7]. There
    are three primary categories of machine learning: supervised learning (label-assisted
    data), unsupervised learning (label-free data), and reinforcement learning (learning
    by environment interaction) [7, 8]. It is used in translation, picture recognition,
    recommendation systems, and more. For instance, ML algorithms are used by chatbots
    powered by AI to comprehend and produce human language [9]. Based on medical data,
    AI systems in the health care industry may also use ML for disease diagnosis and
    prediction [10]. A part of machine learning called deep learning has become quite
    popular in recent years. It is defined using deep neural networks, artificial
    networks


    DOI: 10.1201/9781003946410-4


    51'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 52 Artificial intelligence for intelligent systems


    with many layers inspired by the human brain’s structure and operation [8]. These
    deep networks are ideally suited for picture and speech recognition tasks because
    they can autonomously learn hierarchical input representations [10]. AI has been
    revolutionized by deep learning, which has made breakthroughs in fields like computer
    vision, natural language processing (NLP), and autonomous cars possible. The link
    between DL and ML is extremely strong. Deep neural networks are models with more
    layers to learn hierarchical representations from data automatically. DL uses
    ML to create more complicated models for challenging tasks.


    This chapter explores the differences and common points between AI, ML, and DL
    concepts. It explores the key components of an AI-based system, from data processing
    to decision-making. Choosing an optimal model depends on the application objective.
    This chapter provides real-life use cases for AI, ML, and integration. Moreover,
    the chapter offers a vast of existing implementation tools and frameworks to develop
    smart and autonomous solutions. Choosing the optimal metrics is a mandatory and
    important step in evaluating the efficiency of any developed model. This chapter
    covers the most used evaluation metrics and provides a comprehensive comparative
    study that helps researchers select the most relevant metrics to evaluate their
    approaches.


    # 3. FUNDAMENTALS OF ARTIFICIAL INTELLIGENCE


    The origins of AI can be found in tales and fables from antiquity, which included
    mechanical creatures with humanlike characteristics. The Dartmouth Workshop in
    1956, where John McCarthy, Marvin Minsky, Nathaniel Rochester, and Claude Shannon
    first used the phrase “artificial intelligence,” is frequently cited as the official
    birthplace of AI as a scientific field [11]. The foundation for AI research and
    development was laid during this session. Fundamentally, AI aims to imitate human
    intelligence and problem-solving skills in robots [12]. The three fundamental
    tenets of AI are as follows:


    +   - **Learning:** AI programs data to learn. Machine learning, of AI, entails
    the creation of algorithms that allow computers to learn from their experiences
    and advance. This learning can be supervised, unsupervised, or reinforced.


    +   - **Reasoning:** AI systems make decisions logically and apply logic to address
    issues. These methods use expert systems, rule-based reasoning, and symbolic reasoning.


    +   - **Perception:** AI systems use sensors, cameras, microphones, and other
    sensors to collect data from their environment. Applications of perception-based
    AI include computer vision, speech recognition, and NLP.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Comprehensive comparative analysis of AI 53


    AI includes a diverse range of methods and strategies [13]. Among the essential
    methods are the:


    +   - **Machine Learning**: AI systems can extract patterns and forecasts from
    data thanks to ML techniques. Algorithms for regression, classification, and clustering
    are included.

    - **Neural Networks**: The key element of deep learning is the modeling of the
    human brain. Numerous-layered deep neural networks (also known as "deep learning")
    have revolutionized AI and made significant progress in speech and image recognition.

    - **Natural Language Processing**: The goal of NLP is to make it possible for
    computers to comprehend, analyze, and create human language. This has resulted
    in applications such as sentiment analysis, language translation, and chatbots.

    - **Computer Vision**: AI systems can now analyze and interpret visual data thanks
    to computer vision, paving the way for features like object identification, facial
    recognition, and autonomous driving.


    AI has enormous potential, but it also has problems and moral conundrums. Concerns
    include the influence of AI on the workforce, privacy concerns, and prejudice
    in AI systems. Finding a balance between technological and ethical considerations
    for the AI community continues to be quite difficult [14].


    #  3.2.1 Interrelationships


    AI, ML and DL are closely related to one another. The aim of building intelligent
    machines is the overarching concept of AI, while ML and DL are subsets of AI that
    offer the methods and tools to do. While AI seeks to imitate human intent, ML
    and DL give it a chance through data-driven learning and sophisticated neural
    networks [15]. The basis for DL, in turn, ML is a subset of ML that uses numerous
    hidden layers to simulate complicated relationships in data. Tasks that were previously
    thought to be prohibitively difficult, including speech and picture recognition,
    have significantly advanced thanks to DL. It is important to remember that ML
    comprises a wider range of methods than DL alone [16]. Here''s a simplified representation
    of their interrelationship illustrated in Figure 3.1:


    Where:


    +   - AI encompasses both ML and DL.

    - ML is a subset of AI, focusing on data-driven learning.

    - DL is a subset of ML, specifically using deep neural networks for complex tasks.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 54 Artificial intelligence for intelligent systems


    Within the larger field of AI, each layer represents a more specialized and narrowly
    focused domain. ML and DL offer the procedures and strategies to reach various
    levels of machine intelligence based on data and neural network topologies, whereas
    AI aspires toward intelligent machines [16]. Continued cooperation and innovation
    are promised for the future of AI, ML, and DL. Researchers and practitioners envision
    the best approaches to integrate the strengths of these professions. For example:


    +   * **Transfer Learning**: It is becoming possible to learn more and perform
    better thanks to the development of techniques for transferring information from
    one activity or to another.

    * **Explainable AI**: DL models and AI systems are being worked to increase their
    interpretability and transparency, which will increase their credibility [17].

    * **Federated Learning**: Decentralized learning techniques are becoming more
    common to protect data privacy while promoting group learning and model advances
    [17].


    # 3.2.2 AI instances


    There are numerous uses of AI in various industries, such as speech recognition
    that is used to identify and categorize images and audio [18], personalized recommendations
    for products and content that users are likely to be interested in, e-commerce
    websites, and streaming services [19]. It is also used for predictive maintenance
    systems to examine data from sensors and other sources to anticipate when equipment
    may fail, hence, minimizing downtime and maintenance expenses [20]. In medical
    diagnosis, AI systems are used to examine patient data and medical imaging to
    give clinicians more precise diagnoses and treatment options [21]. Virtual personal
    assistants (VPA) like Siri or Alexa were developed to comprehend user demands,
    such as playing music, setting reminders, and responding to inquiries, using NLP
    [19]. In image recognition, AI systems recognize objects, people, and scenes in
    photographs and applications, including photo organization, security systems,
    and autonomous robotics [18].


    # 3.3 MACHINE LEARNING: THE FOUNDATION


    One of the areas of AI with the biggest potential for change is the discipline
    of machine learning. Its roots and tenets have enabled a fundamental transformation
    in how computers see the environment and communicate with one another [4]. The
    idea of ML is not new; it dates back to the middle of the 20th century. Early
    innovators like Alan Turing and Arthur Samuel built the foundation for ML, by
    creating algorithms that could change and get better over time. Machine'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Comprehensive comparative analysis of AI 55


    learning did not, however, really take off until the digital era, when huge datasets
    and computing power became widely available [4, 5]. The Dartmouth Workshop launched
    AI and ML research formally in 1956. John McCarthy and his associates presented
    the concept of computers that learn from experience during this workshop. Rule-based
    systems, expert systems, and statistical techniques have all been phases of ML''s
    development since then. ML has reached new heights due to the development of neural
    networks in the 1980s and the following renaissance of DL in the 21st century
    [6]. Building algorithms and models that allow computers to recognize patterns
    in data and make predictions or judgments based on those patterns is at the heart
    of ML.


    ML frameworks rely on a systematic workflow that contains the main steps required
    to develop a solution for a domain-specific problem. Regardless of the domain
    of the application, these steps are mandatory. However, what makes a feature different
    from another one is the framework design, choice of the algorithm, type of collected
    data, and desired output. The main steps are illustrated in Figure 3.2 and described
    as:


    +   - Input: Data or input from various sources, including sensors, databases,
    or external systems, is used to start the process. This information may be presented
    as text, pictures, numbers, or any other appropriate way.

    - Preprocessing: Preprocessing is frequently needed before AI algorithms use the
    data. To prepare the data for analysis, this stage entails cleaning, converting,
    and organizing.

    - Feature Extraction: Sometimes extracting pertinent traits or attributes from
    the data is necessary. Feature extraction streamlines the data while preserving
    crucial details.

    - Algorithms: The data is sent into AI algorithms following preprocessing. These
    algorithms can vary depending on the AI objective, including ML models, rule-based
    systems, or DL networks.

    - Training: A training step is involved if the AI system is based on DL or ML.
    The algorithm is trained using previous data to generate predictions or choices,
    and its parameters are changed.

    - Inference: The AI model may forecast, decide, or classify, unexplored data after
    training. This is the stage where AI shows its intelligence by analyzing or producing
    new ideas using the learned patterns.

    - Output: The final product can take many shapes depending on the AI application.
    It might be a suggestion, forecast, choice, visualization, or any other kind of
    useful result [14].


    While ML has come a long way, it still has issues, including data privacy, algorithmic
    bias, and moral dilemmas. With improvements in fields like explainable AI and
    federated learning, the industry is continuously expanding and tackling some problems.
    In summary, ML is the cornerstone of contemporary AI [18–21].'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 56 Artificial intelligence for intelligent systems


    # 3.4 DEEP LEARNING:THE NEURAL NETWORK REVOLUTION


    Deep Learning has become a revolutionary force in the constantly changing field
    of AI, sparking a neural revolution that is transforming industries, advancing
    science, and expanding the capabilities of AI [1]. Although DL originated in the
    middle of the 20th century, the phrase “deep learning” only became popular in
    the 21st century. Individuals like Frank Rosenblatt and Marvin Minsk pioneered
    artificial neural networks (ANNs) and perceptrons. However, enthusiasm was waned
    due to their initial restrictions and computational limits [1, 3]. Several significant
    advances have contributed to the rebirth of DL, including:


    +   - Theoretical Foundations: The mathematical underpinnings of neural networks
    were uncovered by researchers like Geoffrey Hinton, Yann LeCun, and Yoshua Bengio,
    who made fundamental contributions to the DL theory.

    - Big Data: Deep networks could be trained successfully thanks to the abundance
    of labeled data possible by the digital age.

    - Computational Power: Deep network training was sped up by improvements in hardware,
    especially graphic processing units (GPUs), which enabled previously impossible
    tasks to be completed.


    ANNs, based on the human brain’s structure and operation, are at the heart of
    deep learning. Neural networks comprise layers of connected artificial neurons,
    each taking increasingly abstract representations from the input data. The recurrent
    neural network (RNN) for sequential data and convolutional neural network (CNN)
    for image analysis are the two neural architectures most commonly associated with
    deep learning [18]. One distinguishing feature of DL is the depth of these networks.
    Deep networks, as opposed to shallow networks, have several hidden layers, enabling
    them to simulate complicated and nuanced patterns in data. The success of DL can
    be primarily ascribed to the ability of these deep networks to capture hierarchical
    information representations, enabling tasks like speech synthesis, image recognition,
    and NLP [22].


    Although DL has had great success, there are still certain difficulties. Deep
    networks “black-box” nature raises questions about bias and interpretability.
    Large-dataset requirements and limited computational resources are other drawbacks
    (18–22).


    # 3.5 TOOLS AND FRAMEWORKS


    To assess any developed system’s efficiency, it must be implemented using an adequate
    tool and platform. Choosing optimal implementation tools or platforms relies on
    a set of factors, including the application domain, the availability and wide
    use of the tools, the community, and user expertise. In this section, a set'
  merge: -1
  img_proc: true
