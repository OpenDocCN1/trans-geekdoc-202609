    # ## II.7.3 Opacity of infrastructure


    One of the biggest problems with cloud computing has to do with how the technology
    works. The cloud markets itself has as a service-oriented answer with attractive
    price structures that hide the underlying infrastructure. Doing this gives economic
    benefits from economies of scale and frees cloud clients from having to keep track
    of the complicated operations of cloud resources. Even cloud computing is supposed
    to have the same features, it can be hard to get the best speed when there isn''t
    enough information about the infrastructure. There are always problems with how
    well networks work, how well information protocols work, and how well computers
    work. These problems are caused by things like limited speed and unpredictable
    times when transferring large amounts of data. Also, scientific papers show that
    worries about the scalability of implemented solutions are widespread, even when
    the scalability of cloud technology is generally accepted [17].


    # ## II.7.4 Data uncertainty


    Data uncertainty is a prominent feature of real-world data, typically resulting
    from insufficient data or a lack of operational context comprehension. The most
    important aspect of health care is data quality, which is evaluated based on its
    precision, exhaustiveness, and coherence. Thus, the efficacy of decision-making
    is wholly dependent on the quality of the data. Nonetheless, it is essential to
    recognize that the collection of real-world data is not error-free, as it is susceptible
    to errors caused by a variety of factors, such as disturbances and the presence
    of absent or inconsistent data. Sensor errors and imprecision, communication lags
    and delays, cyberattacks, physical damage to equipment, time-synchronized data,
    absent or inconsistent data, and extraneous sounds are among the primary contributors
    to data uncertainties and compromised data quality [54].


    # ## II.7.5 Ethical and legal issues


    The use of big data in health care raises many ethical and legal issues because
    the data being used is sensitive. Some of the ethical and legal difficulties that
    arise from using big data includes worries about how it might harm people''s privacy
    and freedom as well as how it might affect the public''s needs for transparency,
    trust, and justice. A number of significant technological and infrastructure issues
    could arise with the implementation of a health care system based on big data.
    These issues include the fact that data is not uniform, data security, managing
    data analytics, and inadequate infrastructure for data storage [55].


