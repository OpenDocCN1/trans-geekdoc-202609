    # 14.3 METHODOLOGY


    The proposed methodology for exploring the use of ML algorithms in early detection
    of liver diseases involves several steps. Figure 14.1 illustrates the proposed
    model workflow of this research.


    First, we will collect a dataset of liver disease patients from reliable sources.
    Once the data is collected, we will check for null values in the dataset and fill
    with median values. Then, to convert categorical data to numerical data, we will
    use label encoding. Next, we will check the correlation between features using
    a correlation matrix. Any features that are highly correlated or have the same
    information will be dropped. After this, we will perform data scaling to ensure
    that all features are on the same scale. Following that, the dataset will be divided
    into training and testing sets. Then, we will use ML methods, including gradient
    boosting classifier [15], random forest classifier [16], k-nearest neighbors [18],
    AdaBoost classifier [20], LogitBoost classifier [21], and CatBoost classifier
    [22] to predict liver illness. To combine the predictions of all the models, we
    will use a voting classifier to get the final prediction. We will balance the
    dataset by undersampling the majority class, or oversampling the minority using
    SMOTE [23] to enhance the model’s performance. Following that, the model’s performance
    will be evaluated using a range of metrics, such as accuracy, precision, recall,
    F1-score, and confusion matrix. We will conduct an analysis of the study’s findings.
    Overall, this methodology will provide a systematic strategy to forecasting liver
    illness using ML algorithms while maintaining the data’s quality and dependability.


    # 14.3.1 Data collection and preprocessing


    The dataset for this research will be obtained from a combination of sources,
    including the UCI ML Repository and Kaggle. The dataset contains a total of 1,858
    patient records, out of which 1,323 patients have liver disease and 535 do not
    have liver disease. The patients were collected from various locations. The


