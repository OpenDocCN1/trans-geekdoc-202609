    # 7.3.3.1 Comparing several blockchain systems and consensus methods


    It is crucial to consider both the advantages and disadvantages of blockchain
    topologies and consensus processes when assessing their suitability for IoT security.
    Although public blockchains provide great security and decentralization, they
    may not be appropriate for IoT devices with limited resources due to scalability
    and privacy issues. Private blockchains offer more privacy and control, making
    them suitable for IoT deployments in business, Blockchain consortia are well suited
    for cooperative IoT applications because they achieve a compromise between centralization
    and decentralization. Hybrid blockchains enable cross-domain interoperability
    by combining the advantages of public and private/consortium blockchains, but
    their complexity necessitates careful considerations.


    Proof of Work (PoW), one of consensus processes, offers excellent security but
    is computationally and energetically demanding, making it less suitable for IoT
    devices. By choosing validators based on the amount of cryptocurrency they own,
    proof of stake (PoS) enables scalability and energy efficiency, centralization
    has its hazards. Fast consensus is ensured by practical byzantine fault tolerance
    (PBFT), but scaling is constrained by validators’ overhead. The high throughput
    and scalability of delegated proof of stake (DPoS) make it appropriate for large-scale
    IoT applications. However, the fact that it depends on a select group of reliable
    delegates raises questions about centralization [35].'
