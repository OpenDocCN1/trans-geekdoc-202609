    After completing each of the previous procedures, we move on to implement a total
    of 12 machine learning models. The dataset was split in an 80:20 ratio for training
    and testing. As shown in Figure 12.3, it is clear that our dataset has an imbalance.
    To achieve a balanced dataset, the undersampling technique is employed. Undampling
    is a method that reduces the number of samples in the major class in line with
    the number of samples in the minority class [39]. This process aims to create
    a more equal distribution of data for training machine learning models. This approach
    minimizes bias towards the dominant class and improves the overall accuracy of
    classification. Next, we execute a comparative analysis of the results obtained
    from the machine learning models by evaluating the accuracy, recall, and precision
    metrics for before balancing and after balancing datasets.


