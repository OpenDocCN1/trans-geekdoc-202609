    records, ML algorithms can identify patterns and predict potential outcomes. With
    this information, health care professionals can make informed decisions on appropriate
    interventions and treatments for patients. One of the main benefits of ML algorithms
    in liver disease is the ability to detect diseases at earlier stages than traditional
    methods [5]. Early detection of liver cancers can significantly improve patient
    outcomes, as it allows for timely intervention and effective treatment before
    the disease progresses. Moreover, ML algorithms can help predict the risk of developing
    liver diseases by analyzing various factors such as lifestyle, genetics, and environmental
    exposures. This information can be used to create personalized prevention plans
    for patients. A promising strategy for enhancing patient outcomes and reducing
    mortality rates is the early detection of liver diseases using ML algorithms.
    The development of accurate and efficient methods for early detection of liver
    diseases can empower health professionals with reliable tools that can enhance
    diagnosis, improve patient outcomes, and save lives. As the field of ML continues
    to evolve rapidly, there are several challenges associated with its implementation.
    These include data privacy concerns, ethical considerations, and the need for
    specialized training and knowledge among health care professionals. However, if
    these challenges can be addressed effectively, ML algorithms have the potential
    to revolutionize liver disease diagnosis and pave the way for more personalized
    and effective health care solutions.


    # 14.2 LITERATURE REVIEW


    Gupta et al. [6] use different ML models for predicting liver disease by using
    the Indian Liver Patients’ Records dataset, including logistic regression, k-nearest
    neighbors (KNN), gradient boosting, decision tree, random forest (RF), extreme
    boosting, and LightGB. In addition to using and advanced classifiers, they also
    performed exploratory analysis (EDA), data preprocessing, outlier reduction, and
    SMOTE (synthetic minoritysampling technique). After feature selection, the study
    indicated that the accuracy of 63% was highest for LightGB and RF. However, the
    study was limited by its dependence on a single dataset and the exclusion of other
    potential factors impacting liver disease.


    ML techniques used by Drits et al. [7] to predict the prevalence of liver disease.
    Using the Indian Liver Patients’ Records dataset, they assessed various supervised
    ML models and ensemble methods. The voting classifier outperformed other models
    after SMOTE with tenfold cross-validation, achieving accuracy, recall, and F-measure
    of 80.1%, precision of 80.4%, and AUC of 88.4%. The report highlights the value
    of early liver disease detection without drawing attention to any limitations.'
