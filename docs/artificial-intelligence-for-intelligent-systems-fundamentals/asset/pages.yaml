    # 9.2 LITERATURE STUDY


    This section incorporates the limitations/drawbacks of traditional techniques
    for anomaly-based IDS for the IoT-enabled network:


    Anomalous based IDS is considered best practice for almost every field of study.
    This technique is quite helpful to detect possible cyber-attacks. Georgios Zachos
    et al., proposed anomaly IDS for internet of medical thing''s (IoMT''s) quite
    vulnerable. Although, proposed methodology easily use to collect history log files
    from IoMT sensors. However, machine learning techniques are utilized in simulation
    to reduce overheads. Apart from IoMT''s edge computing sensor is presented which
    consists of blood pressure sensor, body temperature sensor, motion sensor and
    insulin pump actuator. Therefore, data traffic monitoring needs to be ensured
    in overall IoT-network. During experimentation binary classification is used.
    While, weighty devices, computation overhead and delay are the problems which
    need to be addressed properly [14].


    Muadha Alsoufi al’s IoT-enabled DL-based IDS is designed and compared with unsupervised
    and semi-supervised learning techniques. Anomaly-based IDS can be applied to many
    fields of studies like transportation, smart grid, smart cities, agriculture,
    and others to identify possible attacks. Zero-day attacks are the main focus for
    detection using anomaly IDS. A DL-based IDS is formulated to'
