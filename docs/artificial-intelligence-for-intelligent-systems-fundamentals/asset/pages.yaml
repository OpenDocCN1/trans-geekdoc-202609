    the median method. We then proceeded to check two other features named total bilirubin
    and direct bilirubin and discovered the datasets contained huge outliers. Next,
    we performed label encoding on the dataset and looked for correlations between
    features. We observed that there was a high correlation between total bilirubin
    and direct bilirubin, as well as alanine aminotransferase and aspartate aminotransferase,
    and total proteins and albumin. To increase the transfer speed and accuracy of
    our model, we decided to eliminate one feature from each correlated pair. Therefore,
    we removed direct bilirubin, aspartate aminotransferase, and albumin from our
    model. Furthermore, we noticed that the dataset contained


