    # 8.5.4.3 Reduced throughput


    Congestion limits the available network bandwidth, which can significantly impact
    the throughput of AI- IoT networks. As more devices contend for the limited resources,
    the overall data transfer rate decreases, reducing throughput. Slower data transmission
    can impede the performance of AI-IoT applications that rely on high data rates,
    such as video streaming or large-scale data analytics [105].


    # 8.5.4.4 Degraded quality of service


    AI-IoT networks often have diverse applications with varying QoS requirements.
    Congestion can disrupt the expected QoS levels, causing degradation in service
    performance. Time-sensitive applications that require low latency and high reliability
    may experience compromised QoS, affecting their effectiveness and usability [105,
    106].


    # 8.5.4.5 Inefficient resource utilization


    Congestion leads to inefficient utilization of network resources in AI-IoT networks.
