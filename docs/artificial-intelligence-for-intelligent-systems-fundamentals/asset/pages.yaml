    IoT systems'' centralized nature and reliance on communication channels, traditional
    security measures fail to protect them [7]. Consequently, protecting IoT infrastructure
    and the underlying technology for cryptocurrencies such as bitcoin, blockchain
    technology has emerged as a powerful solution for addressing and trust issues
    in various domains [8]. Blockchain is a decentralized and distributed ledger that
    facilitates immutable and transparent transaction recording. Its decentralized
    consensus mechanism offers high security, data integrity, and trust [8, 9].


    Transparency, immutability, and tamper resistance are three core characteristics
    of blockchain that make it an internet platform for boosting IoT security [10].
    IoT systems can provide improved data integrity, secure device management, strong
    access control, and privacy preservation by utilizing blockchain.'
