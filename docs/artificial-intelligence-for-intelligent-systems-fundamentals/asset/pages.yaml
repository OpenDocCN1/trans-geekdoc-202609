    # 12.1 INTRODUCTION


    Hepatitis C is a major global health issue, affecting a significant number of
    people on a worldwide level. Hepatitis C is a liver problem connected to the hepatitis
    C virus (HCV) [1]. The illness can appear as either acute or chronic. Individuals
    who catch HCV and have been infected for a duration of less than six months suffer
    from a disease known as acute hepatitis C [2]. Usually, people don''t show symptoms
    [2]. Around 20% of the people who have been infected will properly rid themselves
    of the virus within a period of six months, which prevents them from suffering
    any consequences [3]. It is estimated that the remaining 80% of people infected
    with HCV will progress to a chronic state of the disease [4]. Individuals infected
    will continue to have the virus indefinitely, thereby maintaining their infectiousness
    and posing a potential risk to others. It is estimated that 71 million individuals
    approximately suffer from chronic HCV infection based on data provided by the
    World Health Organization [5]. The potential to induce various liver ailments,
    such as chronic hepatitis, liver cirrhosis, and hepatocellular carcinoma (HCC)
    [6]. The precise and prompt identification of hepatitis C is essential for efficiently
    controlling and mitigating disease advance. Traditional diagnostic techniques,
    including antibody tests and polymerase chain reaction (PCR) assays, have gained
    extensive utilization [7]. However, these methods possess drawbacks over their
    sensitivity, specificity, and cost-efficiency (Figure 12.1).


    The majority of people infected with hepatitis have no symptoms. The start of
    symptoms may occur within a period that varies from 14 to 18 days following the
    initial infection [8]. Yet it is possible that symptoms might begin after initial
    exposure, suggesting that the liver damage has reached an advanced stage. Currently,
    there is a lack of an effective vaccine to prevent hepatitis C [9]. However, various
    strategies are present to prevent the developing of the infection [10]:


    +   - For use done, dont share needles, spoons, and so on.

    - Sharing personal items like razors and toothbrushes that may come into contact
    with infectious blood is not recommended.'
