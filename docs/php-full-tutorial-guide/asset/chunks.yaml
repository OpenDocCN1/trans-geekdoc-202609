    \ (2015)             \n\n# Chapter 1:PHP INTRODUCTION\n\n## Requirement\n\nBefore\
    \ you proceed  to study php, it is recommended that you have a basic understanding\
    \ of the following: \n\n.CSS\n\n· HTML  \n\n##  What is PHP\n\n· PHP is an acronym\
    \ for Hypertext Preprocessor \n\n.PHP is a HTML embedded scripting language\n\n\
    · PHP scripts are executed on the server\n\n· PHP files have extension \".php\"\
    \ \n\n##  What PHP can do\n\nIt is also helpful to think of PHP in terms of what\
    \ it can do for you.  \n\n. Reduce the time to create large websites. \n\n. Create\
    \ a customized user experience for visitors based on information that you have\
    \ gathered from them. \n\n· can generate dynamic page content \n\n· can collect\
    \ form data \n\n· can send and receive cookies \n\n· can add, delete, modify data\
    \ in your databases\n\n· can create, open, read, write, and close files on the\
    \ server \n\n· can encrypt data\n\n##  Why choose PHP\n\n· PHP runs on various\
    \ operating system platforms (Windows, Unix, etc.) \n\n· PHP is easy to learn\
    \ and runs efficiently on the server side \n\n· PHP is compatible with almost\
    \ all servers used today (Apache,etc.) \n\n· PHP supports a wide range of databases\
    \ \n\n· PHP is freely available\n\n## PHP Syntax  \n\nA PHP script starts with\
    \ <?php and ends with ?> : \n\n<?php \n\n// PHP code  here \n\n?>  \n\nA PHP file\
    \ usually contains HTML tags, and some PHP scripting code. \n\nAs you notice in\
    \ the below example, there was a semicolon after the line of PHP code. The semicolon\
    \ signifies the end of a PHP statement and should never be forgotten. The semi\
    \ colon terminates that statement. \n\nHere is  an example of a simple PHP file,\
    \ with a PHP script that uses a PHP function (built-in)\"echo\" to output the\
    \ text \"Hello World!\" \n\n<html> \n\n<head> \n\n<title>My First PHP Page</title>\
    \ \n\n</head> \n\n<body> \n\n<?php \n\necho \"Hello World!\"; \n\n?> \n\n</body>\
    \ \n\n</html> \n\nDisplay: \n\nHello World! \n\n## Comments in PHP\n\nA comment\
    \ in PHP code is a line that is not executed as part of the program. Its  purpose\
    \ is to be read by someone who is editing the code.\n\nPHP supports three forms\
    \ or ways of expressing a comment\n\nComments are useful for:\n\n· To remind yourself\
    \ what you did - Most programmers have experienced coming back to their  Comments,this\
    \ remind you of what you were thinking when you wrote the code \n\n · To let others\
    \ understand what you are doing - Comments let other programmers understand each\
    \ of your steps\n\n// This is a single line comment \n\n\\# This is also a single\
    \ line comment \n\n/\\* \n\nThis is a multiple lines comment block that spans\
    \ over more than one line \n\n\\*/ \n\n## Case sensitivity in PHP\n\n In PHP,\
    \ all variables are case-sensitive.\n\nIn the next chapter is a detailed discussion\
    \ of the variables \n\nIn the example below, only the first statement will display\
    \ the value of the $pet variable (because $pet, $PeT, and $PET are treated as\
    \ three totally different variables): \n\nExample \n\n<html> \n\n<body> \n\n<?php\
    \ \n\n$pet=\"cat\"; \n\necho \"My animal is a \" . $pet . \"<br>\"; \n\necho \"\
    My animal is a \" . $PeT . \"<br>\"; \n\necho \"My animal is a \" . $PET. \"<br>\"\
    ; \n\n?> \n\n</body> \n\n</html> \n\nIn PHP, all user-defined functions, keywords,\
    \ and classes are case-insensitive. \n\nIn the example below, all two echo statements\
    \ below are legal: \n\nExample \n\n<html> \n\n<body> \n\n<?php \n\necho \"Hello\
    \ World!<br>\"; \n\nECHO \"Hello World!<br>\";\n\n?> \n\n\\-</body> \n\n</html>\
    \ \n\n## White spaces\n\nWith HTML, whitespace is ignored between PHP statements.\
    \ This is to mean that there can be  one line of PHP code, then 2 or more lines\
    \ of blank space before the next line of PHP code. Because of this you can indent\
    \ your code and the PHP interpreter will ignore those spaces as well.\n\nHere\
    \ is an elaborate example\n\n<html> \n\n<head> \n\n<title>My First PHP Page</title>\
    \ \n\n</head> \n\n<body> \n\n<?php \n\necho \"Hello World!\"; \n\necho \"Hello\
    \ World!\"; \n\n?>               \n\n</body> \n\n</html>\n\nDisplay: \n\nHello\
    \ World!Hello World! \n\n# Chapter 2:PHP VARIABLES\n\n##   Variable defination\n\
    \nA variable is a means of storing a value, such as text string \"Hello World!\"\
    \ or the integer value 30. A variable can then be reused throughout your code,\
    \ instead of having to type out the actual value over and over again,in other\
    \ words variables can be termed as \"containers\" for storing information\n\n\
    In PHP you define a variable with the following form: \n\n• $variable\\_name =\
    \ Value;\n\njust Like in mathematics\n\nr=1 \n\ns=2 \n\nt=r+s\n\nthe letters r,s\
    \ hold the numbers 1,2 respectively. \n\nFrom the expression t=r+s above, we can\
    \ calculate the value of r to be 3. \n\nIn PHP these letters are called variables.\
    \  \n\nExample \n\n<?php \n\n$r=1; \n\n$s=2; \n\n$t=$r+$s; \n\necho $t; \n\n?>\n\
    \nExample \n\n<?php \n\n$txt=\"Hello world”;\n\n?> \n\n## Conventions for assigning\
    \ variables\n\n. Variables with more than one word should be separated with underscores.\
    \ $my\\_variable\n\n· A variable starts with the $ sign, followed by the name\
    \ of the variable \n\n· Variable names are case sensitive ($r and $R are two different\
    \ variables) \n\n· A variable name cannot start with a number \n\n· A variable\
    \ name must start with a letter or the underscore character \n\n· A variable name\
    \ can only contain alpha-numeric characters and underscores (A-z, 0-9, and \\\
    _ ) \n\n# Chapter 3: PHP DATA TYPES \n\n## PHP Data Types \n\nString, Integer,\
    \ Floating point numbers, Boolean, Array. \n\n## String\n\nA string is a sequence\
    \ of characters, like \"Hello world!\". \n\nA string can be any text inside quotes.\
    \ You can use single or double quotes,either will work efficiently\n\nExample\
    \ \n\n<?php \n\n$x = \"Hello world!\"; \n\necho $x;  \n\n?> \n\n## Integers\n\n\
    \ An integer is a number without decimals. \n\nRules for integers: "
