    \ - 包含一个或多个数组的数组\n\n## Indexed arrays\n\n创建索引数组有两种方法：\n\n注意：索引始终从 0 开始\n\n1. 索引可以自动分配\
    \ `$books=array(\"computing\",\"religion\",\"history\");`\n\n2. 索引可以手动分配：\n\n\
    ```php\n$books[0]=\"computing\"; \n\n$books[1]=\"religion\"; \n\n$books[2]=\"\
    history\"; \n```\n\n以下示例创建一个名为 `$cars` 的索引数组，向其分配三个元素，然后打印包含数组值的文本：\n\n示例\n\n\
    ```php\n<?php \n\n$books=array(\"computing\",\"religion\",\"history\");\n\necho\
    \ \"I love \" . $books[0] . \", \" . $books[1] . \" and \" .$books[2] .\"; \n\n\
    ?> \n```\n\n## Looping in indexed array\n\n要遍历并输出索引数组的所有值，可以使用 `for` 循环 示例\n\n\
    ```php\n<?php \n```\n"
