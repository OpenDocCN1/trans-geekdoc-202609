    \n`$_SERVER` is a PHP super global variable which holds information about headers,\
    \ paths, and script locations. \n\nThe example below shows how to use some of\
    \ the elements in `$_SERVER`: \n\nExample \n\n```php\n<?php \n\necho $_SERVER['PHP_SELF'];\
    \ \n\necho \"<br>\"; \n\necho $_SERVER['SERVER_NAME']; \n\necho \"<br>\"; \n\n\
    echo $_SERVER['HTTP_HOST']; \n\necho \"<br>\"; \n\necho $_SERVER['HTTP_REFERER'];\
    \ \n\necho \"<br>\"; \n\necho $_SERVER['HTTP_USER_AGENT']; \n\necho \"<br>\";\
    \ \n\necho $_SERVER['SCRIPT_NAME']; \n\n?> \n```\n\nThe following table lists\
    \ the most important elements that can go inside `$_SERVER`: \n\nElement/Code\
    \ \n\n`$_SERVER['PHP_SELF']` \n\nReturns the filename of the currently executing\
    \ script \n\n`$_SERVER['GATEWAY_INTERFACE']` \n\nReturns the version of the Common\
    \ Gateway Interface (CGI) the server is using \n\n`$_SERVER['SERVER_ADDR']` \n\
    \nReturns the IP address of the host server \n\n`$_SERVER['SERVER_NAME']` \n\n\
    Returns the name of the host server (such as www.w3schools.com) \n\n`$_SERVER['SERVER_SOFTWARE']`\
    \ \n\nReturns the server identification string (such as Apache/2.2.24) \n\n`$_SERVER['SERVER_PROTOCOL']`\
    \ \n\nReturns the name and revision of the information protocol (such as HTTP/1.1)\
    \ \n\n`$_SERVER['REQUEST_METHOD']` \n\nReturns the request method used to access\
    \ the page (such as POST) \n\n`$_SERVER['REQUEST_TIME']` \n\nReturns the timestamp\
    \ of the start of the request (such as 1377687496)\n\n`$_SERVER['QUERY_STRING']`\
    \ \n\nReturns the query string if the page is accessed via a query string \n\n\
    `$_SERVER['HTTP_ACCEPT']` \n\nReturns the Accept header from the current request\
    \ \n\n`$_SERVER['HTTP_ACCEPT_CHARSET']` \n\nReturns the Accept_Charset header\
    \ from the current request (such as utf-8,ISO-8859-1) \n\n`$_SERVER['HTTP_HOST']`\
    \ \n\nReturns the Host header from the current request \n\n`$_SERVER['HTTP_REFERER']`\
    \ \n\nReturns the complete URL of the current page (not reliable because not all\
    \ user-agents support it) \n\n`$_SERVER['HTTPS']` \n\nIs the script queried through\
    \ a secure HTTP protocol \n\n`$_SERVER['REMOTE_ADDR']` \n\nReturns the IP address\
    \ from where the user is viewing the current page \n\n`$_SERVER['REMOTE_HOST']`\
    \ \n\nReturns the Host name from where the user is viewing the current page \n\
    \n`$_SERVER['REMOTE_PORT']` \n"
  trans: "\n\n# 隐藏表单控件\n\n隐藏表单控件用于隐藏页面中的数据，这些数据稍后可以推送到服务器。此控件隐藏在代码中，不会在实际页面上显示。例如，以下隐藏表单用于保存当前页码。当用户单击下一页时，隐藏控件的值将发送到\
    \ Web 服务器，服务器将根据传递的当前页码决定显示哪一页。\n\n以下是显示隐藏控件用法的示例 HTML 代码：\n\n```html\n<html>\n\
    \n<head>\n\n<title>hidden form control</title>\n\n</head>\n\n<body>\n\n<form>\n\
    \n<p>This is number 1</p>\n\n<input type=\"hidden\" name=\"pagenumber\" value=\"\
    1\" />\n\n<input type=\"submit\" name=\"submit\" value=\"Submit\" />\n\n<input\
    \ type=\"reset\" name=\"reset\" value=\"Reset\" />\n\n</form>\n\n</body>\n\n</html>\n\
    ```\n\n## Post 和 get 方法\n\n以下示例包含一个带有两个输入字段和一个提交按钮的简单 HTML 表单，使用 post 方法：\n\n\
    Example \n\n```html\n<html> \n\n<body> \n\n<form action=\"process.php\" method=\"\
    post\"> \n\nName: <input type=\"text\" name=\"surname\"><br> \n\nAge: <input type=\"\
    text\" name=\"age\"><br> \n\n<input type=\"submit\" name=\"submit\"> \n\n</form>\
    \ \n\n</body> \n\n</html> \n```\n\n当用户填写上面的表单并单击提交按钮时，表单数据将发送到名为 \"process.php\"\
    \ 的 PHP 文件进行处理。表单数据使用 `method=\"post\"` 发送。\n\n\"process.php\" 如下所示： \n\n```html\n\
    <html> \n\n<body> \n\nWelcome <?php echo $_POST[\"surname\"]; ?>!!!<br> \n\nYou\
    \ are <?php echo $_POST[\"age\"]; ?> years old. \n\n</body> \n\n</html> \n```\n\
    \n输出： \n\nWelcome oliver!!!\n\nYou are 36 years old. \n\n使用 `method=\"get\"` 也可以实现相同的结果：\
    \ \n\nExample \n\n```html\n<html> \n\n<body> \n\n<form action=\"process.php\"\
    \ method=\"get\"> \n\nName: <input type=\"text\" name=\"surname\"><br> \n\nAge:\
    \ <input type=\"text\" name=\"age\"><br> \n\n<input type=\"submit\" name=\"submit\"\
    > \n\n</form> \n\n</body> \n\n</html> \n```\n\n\"process.php\" 如下所示： \n\n```html\n\
    <html> \n\n<body> \n\nWelcome <?php echo $_GET[\"surname\"]; ?>!!!<br> \n\nYou\
    \ are <?php echo $_GET[\"age\"]; ?> years old. \n\n</body> \n\n</html> \n```\n\
    \n## Post 方法回顾\n\n代码片段： \n\n```html\n<form action=\"process.php\" method=\"post\"\
    > \n\nName: <input type=\"text\" name=\"surname\"><br> \n\nAge: <input type=\"\
    text\" name=\"age\"><br> \n```\n\n这段 HTML 代码指定表单数据将使用 POST 方法提交到 \"process.php\"\
    \ 网页。PHP 的处理方式是将所有“发布”的值存储到名为 \"`$_POST`\" 的关联数组中。请务必注意表单数据的名称，因为它们代表 \"`$_POST`\"\
    \ 关联数组中的键。\n\n既然你了解了关联数组，\"process.php\" 中的 PHP 代码应该更容易理解一些。 \n\n代码片段： \n\n```php\n\
    $y = $_POST['surname']; \n\n$x = $_POST['age']; \n```\n\n表单名称用作关联数组中的键，因此请确保 HTML\
    \ 表单中永远不会有两个名称相同的输入项。如果有，可能会出现一些问题。\n\n## Get 方法回顾\n\n如上所述，post 方法的替代方案是 get。如果我们将\
    \ HTML 表单更改为 get 方法，它将如下所示： \n\n代码片段： \n\n```html\n<form action=\"process.php\"\
    \ method=\"get\"> \n\nName: <input type=\"text\" name=\"surname\"><br> \n\nAge:\
    \ <input type=\"text\" name=\"age\"><br> \n```\n\nget 方法的不同之处在于，它通过将变量附加到 URL\
    \ 末尾的方式将变量传递到 \"process.php\" 网页。单击提交后，URL 末尾将添加以下内容： \n\n\"?item=##&quantity=##\"\
    \ \n\n问号 \"?\" 告诉浏览器，以下项目是变量。既然我们更改了 \"order.html\" 上发送信息的方法，就必须更改 \"process.php\"\
    \ 代码以使用 \"`$_GET`\" 关联数组。 \n\n代码片段： \n\n```php\n$y = $_GET['surname']; \n\n$x\
    \ = $_GET['age']; \n```\n\n更改数组名称后，脚本将正常工作。使用 get 方法会向访问者显示变量信息，因此请确保不要使用 get\
    \ 方法发送密码信息或其他敏感项目。你不希望访问者看到他们不应该看到的内容。\n\n## 安全预防措施\n\n每当你获取用户输入并使用时，都需要确保输入是安全的。如果你打算将数据插入\
    \ MySQL 数据库，则应确保已考虑防止 [MySQL 注入](http://www.tizag.com/mysqlTutorial/mysql-php-sql-injection.php)；如果你打算将用户输入公开，则应考虑使用\
    \ PHP `htmlentities`。\n\n# 第 9 章：全局变量\n\n## 全局变量 - 超全局变量\n\nPHP 中的几个预定义变量是“超全局变量”，这意味着它们始终可访问，无论作用域如何\
    \ - 你可以从任何函数、类或文件中访问它们，而无需做任何特殊操作。\n\nPHP 超全局变量包括：\n\n· `$GLOBALS`\n\n· `$_SERVER`\n\
    \n· `$_REQUEST`\n\n· `$_POST`\n\n· `$_GET`\n\n· `$_FILES`\n\n· `$_ENV`\n\n· `$_COOKIE`\n\
    \n· `$_SESSION`\n\n本章将解释其中一些超全局变量。\n\n## `$GLOBALS`\n\n`$GLOBALS` 是一个 PHP 超全局变量，用于从\
    \ PHP 脚本中的任何位置（包括函数或方法内部）访问全局变量。\n\nPHP 将所有全局变量存储在名为 `$GLOBALS[index]` 的数组中。索引保存变量的名称。\n\
    \n以下示例展示了如何使用超全局变量 `$GLOBALS`：\n\nExample \n\n```php\n<?php \n\n$x = 15; \n\n\
    $y = 5; \n\nfunctionmultipyl() \n\n{ \n\n$GLOBALS['z'] = $GLOBALS['x'] * $GLOBALS['y'];\
    \ \n\n} \n\nmultiply(); \n\necho $z; \n\n?> \n```\n\n在上面的示例中，由于 z 是 `$GLOBALS`\
    \ 数组中存在的变量，因此它也可以从函数外部访问！\n\n## `$_SERVER`\n\n`$_SERVER` 是一个 PHP 超全局变量，用于保存有关标头、路径和脚本位置的信息。\n\
    \n以下示例展示了如何使用 `$_SERVER` 中的一些元素：\n\nExample \n\n```php\n<?php \n\necho $_SERVER['PHP_SELF'];\
    \ \n\necho \"<br>\"; \n\necho $_SERVER['SERVER_NAME']; \n\necho \"<br>\"; \n\n\
    echo $_SERVER['HTTP_HOST']; \n\necho \"<br>\"; \n\necho $_SERVER['HTTP_REFERER'];\
    \ \n\necho \"<br>\"; \n\necho $_SERVER['HTTP_USER_AGENT']; \n\necho \"<br>\";\
    \ \n\necho $_SERVER['SCRIPT_NAME']; \n\n?> \n```\n\n下表列出了可以放入 `$_SERVER` 中的最重要元素：\n\
    \n元素/代码 \n\n`$_SERVER['PHP_SELF']` \n\n返回当前正在执行的脚本的文件名 \n\n`$_SERVER['GATEWAY_INTERFACE']`\
    \ \n\n返回服务器使用的通用网关接口 (CGI) 的版本 \n\n`$_SERVER['SERVER_ADDR']` \n\n返回主机服务器的 IP 地址\
    \ \n\n`$_SERVER['SERVER_NAME']` \n\n返回主机服务器的名称（例如 www.w3schools.com） \n\n`$_SERVER['SERVER_SOFTWARE']`\
    \ \n\n返回服务器标识字符串（例如 Apache/2.2.24） \n\n`$_SERVER['SERVER_PROTOCOL']` \n\n返回信息协议的名称和修订版本（例如\
    \ HTTP/1.1） \n\n`$_SERVER['REQUEST_METHOD']` \n\n返回访问页面时使用的请求方法（例如 POST） \n\n\
    `$_SERVER['REQUEST_TIME']` \n\n返回请求开始的时间戳（例如 1377687496）\n\n`$_SERVER['QUERY_STRING']`\
    \ \n\n如果页面是通过查询字符串访问的，则返回查询字符串 \n\n`$_SERVER['HTTP_ACCEPT']` \n\n返回当前请求的 Accept\
    \ 标头 \n\n`$_SERVER['HTTP_ACCEPT_CHARSET']` \n\n返回当前请求的 Accept_Charset 标头（例如 utf-8,ISO-8859-1）\
    \ \n\n`$_SERVER['HTTP_HOST']` \n\n返回当前请求的 Host 标头 \n\n`$_SERVER['HTTP_REFERER']`\
    \ \n\n返回当前页面的完整 URL（不可靠，因为并非所有用户代理都支持它） \n\n`$_SERVER['HTTPS']` \n\n脚本是否通过安全 HTTP\
    \ 协议查询 \n\n`$_SERVER['REMOTE_ADDR']` \n\n返回用户查看当前页面时的 IP 地址 \n\n`$_SERVER['REMOTE_HOST']`\
    \ \n\n返回用户查看当前页面时的主机名 \n\n`$_SERVER['REMOTE_PORT']` \n\n"
