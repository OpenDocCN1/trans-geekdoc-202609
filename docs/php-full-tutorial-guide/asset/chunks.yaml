    \ Operators \n\n1\\. Pre-increment (++$x )\n\nIncrements $x by one, then returns\
    \ $x \n\n2\\. Post-increment ($x++ )\n\nReturns $x, then increments $x by one\
    \ \n\n3\\. Pre-decrement (--$x )\n\nDecrements $x by one, then returns $x \n\n\
    4\\. Post-decrement ($x--) \n\nPost-decrement \n\nReturns $x, then decrements\
    \ $x by one \n\nThe example below shows the different results of using the different\
