    \ If you wish to limit the accessibility of the members of a class then you define\
    \ class members as `private` or `protected`.\n\n## Private members\n\nBy designating\
    \ a member private, you limit its accessibility to the class in which it is declared.\
    \ The private member cannot be referred to from classes that inherit the class\
    \ in which it is declared and cannot be accessed from outside the class.\n\nA\
    \ class member can be made private by using `private` keyword infront of the member.\n\
    \n```php\nclass MyClass {\n   private $car = \"audi\";\n   $driver = \"willy\"\
    ;\n   function __construct($par) {\n      // Statements here run every time\n\
    \      // an instance of the class\n      // is created.\n   }\n   function myPublicFunction()\
    \ {\n      return(\"I'm visible!\");\n   }\n   private function myPrivateFunction()\
    \ {\n      return(\"I'm  not visible outside!\");\n   }\n}\n```\n\nWhen `MyClass`\
    \ class is inherited by another class using `extends`, `myPublicFunction()` will\
    \ be visible, as will `$driver`. The extending class will not have any awareness\
    \ of or access to `myPrivateFunction` and `$car`, because they are declared private.\n\
    \n## Protected members\n\nA protected property or method is accessible in the\
    \ class in which it is declared, as well as in classes that extend that class.\
    \ Protected members are not available outside of those two kinds of classes. A\
    \ class member can be made protected by using `protected` keyword in front of\
    \ the member.\n\nHere is different version of `MyClass` −\n\n```php\nclass MyClass\
    \ {\n   protected $car = \"audi\";\n   $driver = \"willy\";\n   function __construct($par)\
    \ {\n      // Statements here run every time\n      // an instance of the class\n\
    \      // is created.\n   }\n   function myPublicFunction() {\n      return(\"\
    I'm visible!\");\n   }\n   protected function myPrivateFunction() {\n      return(\"\
    I'm  visible in child class!\");\n   }\n}\n```\n\n## interfaces\n\nInterfaces\
    \ are defined to provide a common function names to the implementers. Different\
    \ implementors can implement those interfaces according to their requirements.\
    \ You can say, interfaces are skeletons which are implemented by developers.\n\
    \nAs of PHP5, it is possible to define an interface, like this −\n\n```php\ninterface\
    \ email {\n   public function sendemail();\n}\n```\n\nThen, if another class implemented\
    \ that interface, like this −\n\n```php\nclass Report implements email {\n   //\
    \ sendemail() Definition goes here\n}\n```\n\n# CONCLUSION\n\n Thank you again\
    \ for choosing to read this book. I hope this book was able to help you learn\
    \ and understand more about PHP, and how to write PHP codes. The next step is\
    \ now upon you to apply what you have learned in this book.\n\nFinally, if you\
    \ enjoyed this book, please with humble request take the time to share your thoughts\
    \ and post a review on Amazon. It would be greatly appreciated.\n"
  trans: "\n\n这里是每一行的简单描述 −\n\n* 特殊形式 `class`，后跟你要定义的类的名称。\n* 一组花括号，括住任意数量的变量声明和函数定义。\n\
    * 变量声明以特殊形式 `var` 开头，后跟 `$ 变量名称`；它们也可以有一个初始赋值到常量值。\n* 函数定义看起来很像独立的 PHP 函数，但局限于类，并将用于设置和访问对象数据。\n\
    \nexample\n\n```php\nclass Books{\n   /* Member variables */\n   var $price;\n\
    \   var $title;\n   /* Member functions */\n   function setPrice($par){\n    \
    \  $this->price = $par;\n   }\n   function getPrice(){\n      echo $this->price\
    \ .\"<br/>\";\n   }\n   function setTitle($par){\n      $this->title = $par;\n\
    \   }\n   function getTitle(){\n      echo $this->title .\" <br/>\";\n   }\n}\n\
    ```\n\n变量 `$this` 是一个特殊变量，它指向同一个对象，即自身。\n\n## 创建对象\n\n一旦你定义了类，就可以创建任意数量的该类类型的对象。以下是使用\
    \ `new` 运算符创建对象的示例。\n\n```php\n$biology = new Books;\n$maths = new Books;\n$chemistry\
    \ = new Books;\n```\n\n这里我们创建了三个对象，这些对象彼此独立，并且它们将分别存在。接下来我们将看到如何访问成员函数和处理成员变量。\n\
    \n## 构造函数\n\n构造函数是一种特殊的函数，每当创建对象时会自动调用。因此，我们充分利用这种行为，通过构造函数初始化许多内容。\n\nPHP 提供一个名为\
    \ `__construct()` 的特殊函数来定义构造函数。你可以向构造函数传递任意数量的参数。\n\n以下示例将为 `Books` 类创建一个构造函数，它将在对象创建时初始化书籍的价格和标题。\n\
    \n```php\nfunction __construct( $par1, $par2 ){\n   $this->price = $par1;\n  \
    \ $this->title = $par2;\n}\n```\n\n现在我们不需要单独调用 set 函数来设置价格和标题。我们只能在对象创建时初始化这两个成员变量。查看下面的示例\
    \ −\n\n```php\n$physics = new Books( \"biology\", 10 );\n$maths = new Books (\
    \ \"maths\", 14 );\n$chemistry = new Books (\"chemistry\", 17 );\n\n/* Get those\
    \ set values */\n$physics->getTitle();\n$chemistry->getTitle();\n$maths->getTitle();\n\
    $physics->getPrice();\n$chemistry->getPrice();\n$maths->getPrice();\n```\n\n这将产生以下结果\
    \ −\n\n```text\n biology\n maths\n chemistry\n 10\n 14\n 17\n```\n\n## 继承 \n\n\
    PHP 类定义可以选择使用 `extends` 子句从父类定义继承。语法如下 −\n\n```php\nclass Child extends Parent\
    \ {\n   <definition body>\n}\n```\n\n继承的效果是子类（或子类或派生类）具有以下特征 −\n\n* 自动拥有父类的所有成员变量声明。\n\
    * 自动拥有与父类相同的所有成员函数，默认情况下，这些函数的工作方式与父类中的函数相同。\n\n示例：\n\n```php\nclass Novel extends\
    \ Books{\n   var publisher;\n   function setPublisher($par){\n      $this->publisher\
    \ = $par;\n   }\n   function getPublisher(){\n      echo $this->publisher. \"\
    <br />\";\n   }\n}\n```\n\n现在，除了继承的函数之外，类 `Novel` 还保留了两个额外的成员函数。\n\n## 覆盖 \n\n\
    子类中的函数定义会覆盖父类中同名的定义。在子类中，我们可以修改从父类继承的函数的定义。\n\n示例：\n\n`getPrice` 和 `getTitle`\
    \ 函数被覆盖以返回某些值。\n\n```php\nfunction getPrice(){\n   echo $this->price . \"<br/>\"\
    ;\n   return $this->price;\n}\n\nfunction getTitle(){\n   echo $this->title .\
    \ \"<br/>\";\n   return $this->title;\n}\n```\n\n## 公共成员\n\n除非你另有说明，否则类的属性和方法都是公共的。也就是说，它们可以在三种可能的情况下被访问\
    \ −\n\n* 从声明它的类之外\n* 从声明它的类之内\n* 从实现声明它的类的另一个类之内\n\n到目前为止，我们看到的所有成员都是公共成员。如果你希望限制类成员的可访问性，则可以将类成员定义为\
    \ `private` 或 `protected`。\n\n## 私有成员\n\n通过将成员指定为私有，你将其可访问性限制在声明它的类中。私有成员不能从继承声明它的类的类中引用，也不能从类之外访问。\n\
    \n类成员可以通过在成员前使用 `private` 关键字来设为私有。\n\n```php\nclass MyClass {\n   private $car\
    \ = \"audi\";\n   $driver = \"willy\";\n   function __construct($par) {\n    \
    \  // Statements here run every time\n      // an instance of the class\n    \
    \  // is created.\n   }\n   function myPublicFunction() {\n      return(\"I'm\
    \ visible!\");\n   }\n   private function myPrivateFunction() {\n      return(\"\
    I'm  not visible outside!\");\n   }\n}\n```\n\n当 `MyClass` 类被另一个类使用 `extends`\
    \ 继承时，`myPublicFunction()` 将可见，`$driver` 也将可见。扩展类将不会意识到或访问 `myPrivateFunction`\
    \ 和 `$car`，因为它们被声明为私有。\n\n## 受保护成员\n\n受保护的属性或方法在声明它的类中以及扩展该类的类中都可访问。受保护的成员在这两种类之外不可用。类成员可以通过在成员前使用\
    \ `protected` 关键字来设为受保护。\n\n以下是 `MyClass` 的不同版本 −\n\n```php\nclass MyClass {\n\
    \   protected $car = \"audi\";\n   $driver = \"willy\";\n   function __construct($par)\
    \ {\n      // Statements here run every time\n      // an instance of the class\n\
    \      // is created.\n   }\n   function myPublicFunction() {\n      return(\"\
    I'm visible!\");\n   }\n   protected function myPrivateFunction() {\n      return(\"\
    I'm  visible in child class!\");\n   }\n}\n```\n\n## 接口\n\n接口被定义以向实现者提供通用的函数名称。不同的实现者可以根据其要求实现这些接口。你可以说，接口是由开发者实现的骨架。\n\
    \n从 PHP5 开始，可以像这样定义接口 −\n\n```php\ninterface email {\n   public function sendemail();\n\
    }\n```\n\n然后，如果另一个类实现了该接口，像这样 −\n\n```php\nclass Report implements email {\n \
    \  // sendemail() Definition goes here\n}\n```\n\n# 结论\n\n 再次感谢你选择阅读本书。我希望本书能帮助你学习和了解更多关于\
    \ PHP 以及如何编写 PHP 代码的内容。接下来，将由你来应用在本书中所学到的知识。\n\n最后，如果你喜欢这本书，请恳请抽出时间分享你的想法并在 Amazon\
    \ 上发表评论。这将不胜感激。\n\n"
