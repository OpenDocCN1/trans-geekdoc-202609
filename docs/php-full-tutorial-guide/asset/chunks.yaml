    \ is a \" . $PET. \"<br>\"; \n?> \n</body> \n</html>\n```\n\nIn PHP, all user-defined\
    \ functions, keywords, and classes are case-insensitive.\n\nIn the example below,\
    \ all two `echo` statements below are legal:\n\nExample\n\n```html\n<html> \n\
    <body> \n<?php \necho \"Hello World!<br>\"; \nECHO \"Hello World!<br>\";\n?> \n\
