- raw: "• We next used a PHP if statement to check if the value contained in the variable\
    \ $my\\_name was equal to \"william\" \n\n• The comparison between $my\\_name\
    \ and \"william\" was done with a double equal sign \"==\", not a single equals\"\
    =\"! A single equals is for assigning a value to a variable, while a double equals\
    \ is for checking if things are equal. \n\n• $my\\_name is indeed equal to \"\
    william\" so the echo statement is executed\n\nSuppose  $my\\_name  is not equal\
    \ to\"william\" what would have happened\n\nPHP Code: \n\n$my\\_name = \"james\"\
    ; \n\nif ( $my\\_name == \"william\" ) { \n\necho \"Your name is william!<br />\"\
    ; \n\n} \n\necho \"Welcome to mysite!\"; \n\nDisplay: \n\nWelcome to mysite!\n\
    \n## If /else statement\n\nHas someone ever told you, \"if you study smart, then\
    \ you will pass\"? And what happens if you do not study smart? Well, you fail!\
    \ This is an example of an if/else conditional statement. \n\nPHP Code: \n\n$number\\\
    _four \\== 4; \n\nif ( $number\\_four == 4 ) { \n\necho \" true\"; \n\n} else\
    \ { \n\necho \" false\"; \n\n} \n\nDisplay: \n\n true \n\nexplanation \n\n• We\
    \ first made a PHP variable called $number\\_four and set it equal to 4. \n\n\
    • In this example we compared a variable to an integer value. To do such a comparison\
    \ we use \" \\==\". \n\n• $number\\_four is indeed equal to 4 and so this statement\
    \ will evaluate to true. \n\n• All code that is contained between the opening\
    \ curly brace \"{\" that follows the if statement and the closing curly brace\
    \ \"}\" will be executed when the if statement is true. \n\n• The code contained\
    \ within the else segment will not be used. \n\n## Using else if with if..else\n\
    \nexample\n\nPHP Code: \n\n$teacher = \"george\"; \n\nif($teacher == \"anne\"\
    ){ \n\necho \"Hello madam\"; \n\n} elseif ($teacher == \"george\"){ \n\necho \"\
    hello Sir!\"; \n\n}else { \n\necho \n\n\"Morning\"; \n\n} \n\nDisplay: \n\nhello\
    \ Sir! \n\nPHP first checked to see if $teacher was equal to \"anne\", which evaluated\
    \ to false. Next, PHP checked the first elseif statement $teacher did in fact\
    \ equal \"george\" so the phrase george Sir!\" was printed out. If we wanted to\
    \ check for more teachers names we could insert more elseif statements! ,note\
    \ that an elseif statement cannot be used unless it is preceded by an if statement.\n\
    \n## Switch statement\n\nThere are times when an if statement is not the most\
    \ efficient way to check for certain conditions. With the use of the switch statement\
    \ you can check for all these conditions at once, \n\nThis is how it works,first\
    \ we have a single expression (most often a variable), that is evaluated once.\
    \ The value of the expression is then compared with the values for each case in\
    \ the code structure. If there is a match, the block of code associated with that\
    \ case is executed. The use of break is to prevent the code from running into\
    \ the next case automatically. The default statement is used if no match is found.\
    \ \n\nExample \n\n<?php \n\n$color=\"pink\"; \n\nswitch ($color) \n\n{ \n\ncase\
    \ \"yellow\": \n\necho \"Your favorite color is yellow!\"; \n\nbreak; \n\ncase\
    \ \"red\": \n\necho \"Your favorite color is red!\"; \n\nbreak; \n\ncase \"pink\"\
    : \n\necho \"Your favorite color is pink!\"; \n\nbreak; \n\ndefault: \n\necho\
    \ \"Your favorite color is not known!\"; \n\n} \n\n?>\n\nThe if statement has\
    \ the else clause and the switch statement has the default case. It's usually\
    \ a good idea to always include the default case in all your switch statements.\n\
    \n## while Loops \n\nPHP while loops execute a block of code while the specified\
    \ condition is true. Often when you write code, you want the same block of code\
    \ to run over and over again in a row.Instead of adding several (which is tedious)almost\
    \ equal code-lines in a script, we can use loops to perform a task like this.\
    \ \n\nIn PHP, the following looping statements are used: \n\n· while \\- loops\
    \ through a block of code and executes as long as the specified condition is true\
    \ \n\nSyntax \n\nwhile ( condition is true) \n\n{ \n\n code to be executed; \n\
    \n} \n\nThe example below first sets a variable $x to 1 ($x=1;). Then, the while\
    \ loop will continue to run as long as $x is less than, or equal to 10. $x will\
    \ increase by 1 each time the loop runs ($x++;): Example \n\n<?php \n\n$x=1; \n\
    \nwhile($x<=10) \n\n{ \n\necho \"The number is: $x <br>\"; \n\n$x++; \n\n} \n\n\
    ?> \n\n· do...while - loops through a block of code once, and then repeats the\
    \ loop as long as the specified condition is true,the do...while loop will always\
    \ execute the block of code once, it will then check the condition, and repeat\
    \ the loop while the specified condition is true. \n\nSyntax \n\ndo \n\n{ \n\n\
    \ code to be executed; \n\n } \n\nwhile ( condition is true); \n\nThe example\
    \ below first sets a variable $x to 1 ($x=1;). Then, the do while loop will write\
    \ some output, and then increment the variable $x with 1. Then the condition is\
    \ checked and the loop will continue to run as long as $x is less than, or equal\
    \ to 10: \n\nExample \n\n<?php \n\n$x=1; \n\ndo \n\n{ \n\necho \"The number is:\
    \ $x <br>\"; \n\n$x++; \n\n} \n\nwhile ($x<=10) \n\n?> \n\nNote that in a do while\
    \ loop the condition is tested after executing the statements within the loop.\
    \ This means that the do while loop would execute its statements at least once,\
    \ even if the condition fails the first time. \n\n##  For Loop\n\nPHP for loops\
    \ execute a block of code a specified number of times. The for loop is used when\
    \ you know in advance how many times the script should run. \n\nSyntax \n\nfor\
    \ ( init counter; test counter; increment counter) \n\n{ \n\ncode to be executed;\
    \  \n\n} \n\nexplanation\n\n· init counter: Initialize the loop counter value\
    \ \n\n· test counter: Evaluated for each loop iteration. If it evaluates to true,\
    \ the loop continues. If it evaluates to false, the loop ends. \n\n· increment\
    \ counter: Increases the loop counter value \n\nThe example below displays the\
    \ numbers from 0 to 100: \n\nExample \n\n<?php \n\nfor ($x=0; $x<=100; $x++) \n\
    \n{ \n\necho \"The number is: $x <br>\"; \n\n} \n\n?> \n\n## Foreach Loop \n\n\
    The foreach loop works only on arrays, and is used to loop through each key pair\
    \ in an array. For every loop iteration, the value of the current array element\
    \ is assigned to $value and the array pointer is moved by one, until it reaches\
    \ the last array element. The following example demonstrates a loop that will\
    \ output the values of the given array ($fruits):\n\nSyntax \n\nforeach ($ array\
    \  as  $ value) \n\n{ \n\ncode to be executed;  \n\n} \n\nExample \n\n<?php \n\
    \n$fruits = array(\"mango\",\"orange\",\"pawpaw\",\"ovacado\"); \n\nforeach ($fruits\
    \ as $value) \n\n{ \n\necho \"$value <br>\"; \n\n} \n\n?> \n\n# Chapter 6:PHP\
    \ ARRAYS\n\n##  Array definition \n\nAn array stores multiple values in one single\
    \ variable,hence an array is a special variable, which can hold more than one\
    \ value at a time. \n\nIf you have a list of items (example a list of book names),\
    \ storing the books in single variables could look like this: \n\n$books1=\"computing\"\
    ; \n\n$books2=\"religion\"; \n\n$books3=\"history\"; \n\n$books4=\"philosophy\"\
    ; \n\nwhat if you want to loop through the books and find a specific one? And\
    \ what if you had not 4 books, but 4000? The best solution is to create an array,an\
    \ array can hold many values under a single name, and you can access the values\
    \ by referring to an index number. \n\n## Creating an array \n\nThe array() function\
