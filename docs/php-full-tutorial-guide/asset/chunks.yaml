- raw: "Hidden form controls are used to hide data inside the page which later on\
    \ can be pushed to the server. This control hides inside the code and does not\
    \ appear on the actual page. For example, following hidden form is being used\
    \ to keep current page number. When a user will click next page then the value\
    \ of hidden control will be sent to the web server and there it will decide which\
    \ page has be displayed next based on the passed current page.\n\nHere is example\
    \ HTML code to show the usage of hidden control:\n\n<html>\n\n<head>\n\n<title>hidden\
    \ form control</title>\n\n</head>\n\n<body>\n\n<form>\n\n<p>This is number 1</p>\n\
    \n<input type=\"hidden\" name=\"pagenumber\" value=\"1\" />\n\n<input type=\"\
    submit\" name=\"submit\" value=\"Submit\" />\n\n<input type=\"reset\" name=\"\
    reset\"  value=\"Reset\" />\n\n</form>\n\n</body>\n\n</html>\n\n## Post and get\
    \ methods\n\nThe example below contains a simple HTML form with two input fields\
    \ and a submit button, using the post method:\n\nExample \n\n<html> \n\n<body>\
    \ \n\n<form action=\"process.php\" method=\"post\"> \n\nName: <input type=\"text\"\
    \ name=\"surname\"><br> \n\nAge: <input type=\"text\" name=\"age\"><br> \n\n<input\
    \ type=\"submit\" name=”submit”> \n\n</form> \n\n</body> \n\n</html> \n\nWhen\
    \ a user fills out the form above and clicks the submit button, the form data\
    \ is sent for processing to a PHP file named \"process.php\". The form data is\
    \ sent with method=\"post\". \n\n\"process.php\" looks like this: \n\n<html> \n\
    \n<body> \n\nWelcome <?php echo $\\_POST\\[\"surname\"\\]; ?>!!!<br> \n\nYou are\
    \ <?php echo $\\_POST\\[\"age\"\\]; ?> years old. \n\n</body> \n\n</html> \n\n\
    The output: \n\nWelcome oliver!!!\n\nYou are 36 years old. \n\nThe same result\
    \ could also be achieved using method=\"get\": \n\nExample \n\n<html> \n\n<body>\
    \ \n\n<form action=\"process.php\" method=\"get\"> \n\nName: <input type=\"text\"\
    \ name=\"surname\"><br> \n\nAge: <input type=\"text\" name=\"age\"><br> \n\n<input\
    \ type=\"submit\" name=”submit”> \n\n</form> \n\n</body> \n\n</html> \n\nand \"\
    process.php\" looks like this: \n\n<html> \n\n<body> \n\nWelcome <?php echo $\\\
    _GET\\[\"surname\"\\]; ?>!!!<br> \n\nYou are <?php echo $\\_GET\\[\"age\"\\];\
    \ ?> years old. \n\n</body> \n\n</html> \n\n## Review of the post method\n\n Code\
    \ Excerpt: \n\n<form action=\"process.php\" method=\"post\"> \n\nName: <input\
    \ type=\"text\" name=\"surname\"><br> \n\nAge: <input type=\"text\" name=\"age\"\
    ><br> \n\nThis HTML code specifies that the form data will be submitted to the\
    \ \"process.php\" web page using the POST method. The way that PHP does this is\
    \ to store all the \"posted\" values into an associative array called \"$\\_POST\"\
    . Be sure to take notice the names of the form data names, as they represent the\
    \ keys in the \"$\\_POST\" associative array. \n\nNow that you know about associative\
    \ arrays, the PHP code from \"process.php\" should make a litte more sense. \n\
    \n Code Excerpt: \n\n$y = $\\_POST\\['surname'\\]; \n\n$x = $\\_POST\\['age'\\\
    ]; \n\nThe form names are used as the keys in the associative array, so be sure\
    \ that you never have two input items in your HTML form that have the same name.\
    \ If you do, then you might see some problems arise. \n\n## Review of the get\
    \ method\n\nAs we mentioned above, the alternative to the post method is get.\
    \ If we were to change our HTML form to the get method, it would look like this:\
    \ \n\n Code Excerpt: \n\n<form action=\"process.php\" method=\"get\"> \n\nName:\
    \ <input type=\"text\" name=\"surname\"><br> \n\nAge: <input type=\"text\" name=\"\
    age\"><br> \n\nThe get method is different in that it passes the variables along\
    \ to the \"process.php\" web page by appending them onto the end of the URL. The\
    \ URL, after clicking submit, would have this added on to the end of it: \n\n\"\
    ?item=##&quantity=##\" \n\nThe question mark \"?\" tells the browser that the\
    \ following items are variables. Now that we changed the method of sending information\
    \ on \"order.html\", we must change the \"process.php\" code to use the \"$\\\
    _GET\" associative array. \n\n Code Excerpt: \n\n$y = $\\_GET\\['surname'\\];\
    \ \n\n$x = $\\_GET\\['age'\\]; \n\nAfter changing the array name the script will\
    \ function properly. Using the get method displays the variable information to\
    \ your visitor, so be sure you are not sending password information or other sensitive\
    \ items with the get method. You would not want your visitors seeing something\
    \ they are not supposed to. \n\n## Security precaution\n\nWhenever you are taking\
    \ user input and using you need to be sure that the input is safe. If you are\
    \ going to insert the data into a MySQL database, then you should be sure you\
    \ have thought about preventing [MySQL ](http://www.tizag.com/mysqlTutorial/mysql-php-sql-injection.php)injection,if\
    \ you are going to make a user input available to the public,the you should think\
    \ about PHP htmlentities.\n\n# Chapter 9:GLOBAL VARIABLES\n\n## Global Variables\
    \ - Superglobals \n\nSeveral predefined variables in PHP are \"superglobals\"\
    , which means that they are always accessible, regardless of scope - and you can\
    \ access them from any function, class or file without having to do anything special.\
    \ \n\nThe PHP superglobal variables are: \n\n· $GLOBALS \n\n· $\\_SERVER \n\n\
    · $\\_REQUEST \n\n· $\\_POST \n\n· $\\_GET \n\n· $\\_FILES \n\n· $\\_ENV \n\n\
    · $\\_COOKIE \n\n· $\\_SESSION \n\nIn this chapter will explain some of the superglobals,\
    \ \n\n##  $GLOBAL \n\n$GLOBAL is a PHP super global variable which is used to\
    \ access global variables from anywhere in the PHP script (also from within functions\
    \ or methods). \n\nPHP stores all global variables in an array called $GLOBALS\\\
    [ index\\]. The index holds the name of the variable. \n\nThe example below shows\
    \ how to use the super global variable $GLOBAL: \n\nExample \n\n<?php \n\n$x =\
    \ 15; \n\n$y = 5; \n\nfunctionmultipyl() \n\n{ \n\n$GLOBALS\\['z'\\] = $GLOBALS\\\
    ['x'\\] \\* $GLOBALS\\['y'\\]; \n\n} \n\nmultiply(); \n\necho $z; \n\n?> \n\n\
    In the example above, since z is a variable present within the $GLOBALS array,\
    \ it is also accessible form outside the function! \n\n##  $\\_SERVER \n\n$\\\
    _SERVER is a PHP super global variable which holds information about headers,\
    \ paths, and script locations. \n\nThe example below shows how to use some of\
    \ the elements in $\\_SERVER: \n\nExample \n\n<?php \n\necho $\\_SERVER\\['PHP\\\
    _SELF'\\]; \n\necho \"<br>\"; \n\necho $\\_SERVER\\['SERVER\\_NAME'\\]; \n\necho\
    \ \"<br>\"; \n\necho $\\_SERVER\\['HTTP\\_HOST'\\]; \n\necho \"<br>\"; \n\necho\
    \ $\\_SERVER\\['HTTP\\_REFERER'\\]; \n\necho \"<br>\"; \n\necho $\\_SERVER\\['HTTP\\\
    _USER\\_AGENT'\\]; \n\necho \"<br>\"; \n\necho $\\_SERVER\\['SCRIPT\\_NAME'\\\
    ]; \n\n?> \n\nThe following table lists the most important elements that can go\
    \ inside $\\_SERVER: \n\nElement/Code \n\n$\\_SERVER\\['PHP\\_SELF'\\] \n\nReturns\
    \ the filename of the currently executing script \n\n$\\_SERVER\\['GATEWAY\\_INTERFACE'\\\
    ] \n\nReturns the version of the Common Gateway Interface (CGI) the server is\
    \ using \n\n$\\_SERVER\\['SERVER\\_ADDR'\\] \n\nReturns the IP address of the\
    \ host server \n\n$\\_SERVER\\['SERVER\\_NAME'\\] \n\nReturns the name of the\
    \ host server (such as www.w3schools.com) \n\n$\\_SERVER\\['SERVER\\_SOFTWARE'\\\
    ] \n\nReturns the server identification string (such as Apache/2.2.24) \n\n$\\\
    _SERVER\\['SERVER\\_PROTOCOL'\\] \n\nReturns the name and revision of the information\
    \ protocol (such as HTTP/1.1) \n\n$\\_SERVER\\['REQUEST\\_METHOD'\\] \n\nReturns\
    \ the request method used to access the page (such as POST) \n\n$\\_SERVER\\['REQUEST\\\
    _TIME'\\] \n\nReturns the timestamp of the start of the request (such as 1377687496)\n\
    \n$\\_SERVER\\['QUERY\\_STRING'\\] \n\nReturns the query string if the page is\
    \ accessed via a query string \n\n$\\_SERVER\\['HTTP\\_ACCEPT'\\] \n\nReturns\
    \ the Accept header from the current request \n\n$\\_SERVER\\['HTTP\\_ACCEPT\\\
    _CHARSET'\\] \n\nReturns the Accept\\_Charset header from the current request\
    \ (such as utf-8,ISO-8859-1) \n\n$\\_SERVER\\['HTTP\\_HOST'\\] \n\nReturns the\
    \ Host header from the current request \n\n$\\_SERVER\\['HTTP\\_REFERER'\\] \n\
    \nReturns the complete URL of the current page (not reliable because not all user-agents\
    \ support it) \n\n$\\_SERVER\\['HTTPS'\\] \n\nIs the script queried through a\
    \ secure HTTP protocol \n\n$\\_SERVER\\['REMOTE\\_ADDR'\\] \n\nReturns the IP\
    \ address from where the user is viewing the current page \n\n$\\_SERVER\\['REMOTE\\\
    _HOST'\\] \n\nReturns the Host name from where the user is viewing the current\
    \ page \n\n$\\_SERVER\\['REMOTE\\_PORT'\\] "
