    ; \n\n} \n\ndetail(\"james\",\"1937\"); \n\ndetail(\"kate\",\"1971\"); \n\ndetail(\"\
    anne\",\"1963\"); \n\n?> \n```\n\n## 默认参数值\n\n下面的示例说明如何使用默认参数。如果不带参数调用函数 `width()`，它将使用默认值作为参数。\n\
    \n示例\n\n```\n<?php \n\nfunction width($w=60) \n\n{ \n\necho \"The width is : $w\
    \ <br>\"; \n\n} \n\nwidth(65); \n\nwidth(); // will use the default value of 60\
    \ \n\nwidth(15); \n\nwidth(90); \n\n?> \n```\n\n## 返回值\n\n要让函数返回一个值，请使用 `return`\
    \ 语句。\n\n示例\n\n```\n<?php \n\nfunction div($x,$y) \n\n{ \n\n$z=$x/$y; \n\nreturn\
    \ $z; \n\n} \n\necho \"15 / 2 = \" . div(15,5) . \"<br>\"; \n\necho \"14/2= \"\
    \ . div(14,2) . \"<br>\"; \n\necho \"12 / 4 = \" . div(12,4); \n\n?> \n```\n\n\
    # 第 8 章：PHP 表单处理\n\n## 简单 HTML 表单说明\n\n当你想要从网站访问者那里收集一些数据时，需要 HTML 表单。例如，在用户注册期间，你可能希望收集姓名、电子邮件地址、信用卡等信息。\n\
    \n表单将从网站访问者那里获取输入，然后将其发布到后端应用程序，例如 CGI、ASP 脚本或 PHP 脚本等。后端应用程序将根据应用程序内定义的业务逻辑对传递的数据进行所需处理。\n\
    \n有多种表单元素可用，例如文本字段、文本区域字段、下拉菜单、单选按钮、复选框等。\n\nHTML `<form>` 标签用于创建 HTML 表单，其语法如下：\n\
    \n```\n<form action=\"Script URL\" method=\"GET|POST\">\n\n   form elements like\
    \ input, textarea etc.\n\n</form>\n```\n\n| Action | 准备处理传递数据的后端脚本。 |\n| --- |\
    \ --- |\n| Method | 用于上传数据的方法。最常用的是 GET 和 POST 方法。 |\n\n## HTML 表单控件\n\n你可以使用不同类型的表单控件来通过\
    \ HTML 表单收集数据：\n\n- 复选框控件\n- 单选按钮控件\n- 下拉列表控件\n- 文件选择框\n- 隐藏控件\n- 可点击按钮\n- 提交和重置按钮\n\
    \n## 复选框控件\n\n当需要选择多个选项时，使用复选框。它们也是使用 HTML `<input>` 标签创建的，但 `type` 属性设置为 `checkbox`。\n\
    \n以下是带有两个复选框的表单示例 HTML 代码：\n\n```\n<html>\n\n<head>\n\n<title>复选框控件</title>\n\n\
    </head>\n\n<body>\n\n<form>\n\n<input type=\"checkbox\" name=\"maths\" value=\"\
    on\"> Maths\n\n<input type=\"checkbox\" name=\"physics\" value=\"on\"> Physics\n\
    \n</form>\n\n</body>\n\n</html>\n```\n\n表单底部\n\n## 单选按钮控件\n\n当有多个选项但只需要选择一个选项时，使用单选按钮。它们也是使用\
    \ HTML `<input>` 标签创建的，但 `type` 属性设置为 `radio`。\n\n以下是带有两个单选按钮的表单示例 HTML 代码：\n\n\
    ```\n<html>\n\n<head>\n\n<title>单选按钮控件</title>\n\n</head>\n\n<body>\n\n<form>\n\
    \n<input type=\"radio\" name=\"subject\" value=\"maths\"> Maths\n\n<input type=\"\
    radio\" name=\"subject\" value=\"physics\"> Physics\n\n</form>\n\n</body>\n\n\
    </html>\n```\n\n表单顶部\n\n表单底部\n\n## 下拉列表控件\n\n下拉列表（也称为下拉框）提供一个选项，以列表形式列出各种选项，用户可以从中选择一个或多个选项。\n\
    \n以下是带有一个下拉列表的表单示例 HTML 代码：\n\n```\n<html>\n\n<head>\n\n<title>下拉列表控件</title>\n\
    \n</head>\n\n<body>\n\n<form>\n\n<select name=\"dropdown\">\n\n<option value=\"\
    Maths\" selected>Maths</option>\n\n<option value=\"Physics\">Physics</option>\n\
    \n</select>\n\n</form>\n\n</body>\n\n</html>\n```\n\n表单顶部\n\n表单底部\n\n## 文件上传框\n\
    \n如果你想允许用户将文件上传到你的网站，则需要使用文件上传框，也称为文件选择框。这也是使用 `<input>` 元素创建的，但 `type` 属性设置为\
    \ `file`。\n\n以下是带有一个文件上传框的表单示例 HTML 代码：\n\n```\n<html>\n\n<head>\n\n<title>文件上传框</title>\n\
    \n</head>\n\n<body>\n\n<form>\n\n<input type=\"file\" name=\"fileupload\" accept=\"\
    image/\\*\" />\n\n</form>\n\n</body>\n\n</html>\n```\n\n表单顶部\n\n表单底部\n\n## 按钮控件\n\
    \n在 HTML 中有多种方法可以创建可点击按钮。你也可以通过将 `<input>` 标签的 `type` 属性设置为 `button` 来创建可点击按钮。`type`\
    \ 属性可以取以下值：\n\n以下是带有三种类型按钮的表单示例 HTML 代码：\n\n```\n<html>\n\n<head>\n\n<title>按钮控件</title>\n\
    \n</head>\n\n<body>\n\n<form>\n\n<input type=\"submit\" name=\"submit\" value=\"\
    Submit\" />\n\n<input type=\"reset\" name=\"reset\" value=\"Reset\" />\n\n<input\
    \ type=\"button\" name=\"ok\" value=\"OK\" />\n\n<input type=\"image\" name=\"\
    imagebutton\" src=\"/html/images/logo.png\" />\n\n</form>\n\n</body>\n\n</html>\n\
    ```\n\n表单底部\n\n## 隐藏表单控件\n\n"
