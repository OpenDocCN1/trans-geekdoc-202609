    ## `$_REQUEST`


    PHP `$_REQUEST` 用于在提交 HTML 表单后收集数据。


    以下示例显示了一个带有输入字段和提交按钮的表单。当用户单击“提交”提交数据时，表单数据将发送到 `<form>` 标签的 action 属性中指定的文件。在此示例中，我们指向此文件本身以处理表单数据。如果您希望使用另一个
    PHP 文件来处理表单数据，请将其替换为您选择的文件名。然后，我们可以使用超级全局变量 `$_REQUEST` 来收集输入字段的值：


    示例


    ```html

