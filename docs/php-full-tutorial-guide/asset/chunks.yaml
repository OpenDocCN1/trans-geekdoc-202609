    \ (\\*) \n\n$x \\* $y \n\nProduct of $x and $y \n\n4\\. Division (/)\n\n$x / $y\
    \ \n\nQuotient of $x and $y \n\n5\\. Modulus (%)\n\n$x % $y \n\nRemainder of $x\
    \ divided by $y \n\nThe example below shows the different results of using the\
    \ different arithmetic operators: \n\nExample \n\n<?php \n\n$x=5; \n\n$y=3; \n\
    \necho ($x + $y); // outputs 8\n\necho ($x - $y); // outputs 2 \n\necho ($x \\\
    * $y); // outputs 15 \n\necho ($x / $y); // outputs 1.6666666666667 \n\necho ($x\
    \ % $y); // outputs 2 \n\n?> \n\n## PHP assignment operators\n\nThe PHP assignment\
    \ operator is used to write a value to a variable. \n\nThe basic assignment operator\
    \ in PHP is \"=\". It means that the left operand gets set to the value of the\
    \ assignment expression on the right. \n\nx = y and is the same as x = y \n\n\
    The left operand gets set to the value of the expression on the right \n\n1\\\
    . Addition \n\nx += y \n\nx = x + y \n\n2\\. Subtraction \n\nx -= y \n\nx = x\
    \ - y \n\n3\\. Multiplication \n\nx \\*= y \n\nx = x \\* y \n\n4\\. Division \n\
    \nx /= y \n\nx = x / y \n\n5\\. modulus\n\nx %= y \n\nx = x % y \n\nThe example\
    \ below shows the different results of using the different assignment operators:\
    \ \n\nExample \n\n<?php \n\n$x=10; \n\necho $x; // outputs 10 \n\n$y=10; \n\n\
    $y += 10; \n\necho $y; // outputs 20 \n\n$z=40; \n\n$z -= 25; \n\necho $z; //\
    \ outputs 15 \n\n$i=5; \n\n$i \\*= 9; \n\necho $i; // outputs 45\n\n$j=12; \n\n\
    $j /= 6; \n\necho $j; // outputs 2 \n\n$k=15; \n\n$k %= 4; \n\necho $k; // outputs\
    \ 3 \n\n?> \n\n## PHP string Operators \n\n1\\. Concatenation (.)\n\n$txt1 = \"\
