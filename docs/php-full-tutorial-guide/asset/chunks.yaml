- raw: "Here is a simple description of each line −\n\n*      The special form class,\
    \ followed by the name of the class that you want to define.\n\n*      A set of\
    \ braces enclosing any number of variable declarations and function definitions.\n\
    \n*      Variable declarations start with the special form var, which is followed\
    \ by $ variable name; they may also have an initial assignment to a constant value.\n\
    \n*      Function definitions look much like standalone PHP functions but are\
    \ local to the class and will be used to set and access object data.\n\nexample\n\
    \n<?php\n\n   class  Books{\n\n      /\\* Member variables \\*/\n\n      var $price;\n\
    \n      var $title;\n\n      /\\* Member functions \\*/\n\n      function setPrice($par){\n\
    \n         $this\\->price \\= $par;\n\n      }\n\n      function getPrice(){\n\
    \n         echo $this\\->price .\"<br/>\";\n\n      }\n\n      function setTitle($par){\n\
    \n         $this\\->title \\= $par;\n\n      }\n\n      function getTitle(){\n\
    \n         echo $this\\->title .\" <br/>\";\n\n      }\n\n   }\n\n?>\n\nThe variable $this is\
    \ a special variable and it refers to the same object ie. itself.\n\n## Creating\
    \ objects\n\nOnce you defined your class, then you can create as many objects\
    \ as you like of that class type. Following is an example of how to create object\
    \ using new operator.\n\n$biology = new Books;\n\n$maths = new Books;\n\n$chemistry\
    \ = new Books;\n\nHere we have created three objects and these objects are independent\
    \ of each other and they will have their existence separately. Next we will see\
    \ how to access member function and process member variables.\n\n## Constructor\
    \ functions\n\nConstructor Functions are special type of functions which are called\
    \ automatically whenever an object is created. So we take full advantage of this\
    \ behaviour, by initializing many things through constructor functions.\n\nPHP\
    \ provides a special function called \\_\\_construct() to define a constructor.\
    \ You can pass as many as arguments you like into the constructor function.\n\n\
    Following example will create one constructor for Books class and it will initialize\
    \ price and title for the book at the time of object creation.\n\nfunction \\\
    _\\_construct( $par1, $par2 ){\n\n   $this->price = $par1;\n\n   $this->title\
    \ = $par2;\n\n}\n\nNow we don't need to call set function separately to set price\
    \ and title. We can initialize these two member variables at the time of object\
    \ creation only. Check following example below −\n\n$physics \\= new Books( \"\
    biology\", 10 );\n\n$maths \\= new Books ( \"maths\", 14 );\n\n$chemistry \\=\
    \ new Books (\"chemistry\", 17 );\n\n/\\* Get those set values \\*/\n\n$physics\\\
    ->getTitle();\n\n$chemistry\\->getTitle();\n\n$maths\\->getTitle();\n\n$physics\\\
    ->getPrice();\n\n$chemistry\\->getPrice();\n\n$maths\\->getPrice();\n\nThis will\
    \ produce the following result −\n\n  biology\n\n  maths\n\n  chemistry\n\n  10\n\
    \n  14\n\n  17\n\n## Inheritance \n\nPHP class definitions can optionally inherit\
    \ from a parent class definition by using the extends clause. The syntax is as\
    \ follows −\n\nclass Child extends Parent {\n\n   <definition body>\n\n}\n\nThe\
    \ effect of inheritance is that the child class (or subclass or derived class)\
    \ has the following characteristics −\n\n.Automatically has all the member variable\
    \ declarations of the parent class.\n\n.Automatically has all the same member\
    \ functions as the parent, which (by default) will work the same way as those\
    \ functions do in the parent.\n\nExample:\n\nclass Novel extends Books{\n\n  \
    \ var publisher;\n\n   function setPublisher($par){\n\n      $this\\->publisher\
    \ \\= $par;\n\n   }\n\n   function getPublisher(){\n\n      echo $this\\->publisher.\
    \ \"<br />\";\n\n   }\n\n}\n\nNow apart from inherited functions, class Novel\
    \ keeps two additional member functions.\n\n## Overriding  \n\nFunction definitions\
    \ in child classes override definitions with the same name in parent classes.\
    \ In a child class, we can modify the definition of a function inherited from\
    \ parent class.\n\nExample:\n\n getPrice and getTitle functions are overridden\
    \ to return some values.\n\nfunction getPrice(){\n\n   echo $this\\->price . \"\
    <br/>\";\n\n   return $this\\->price;\n\n}\n\n   function getTitle(){\n\n   echo\
    \ $this\\->title . \"<br/>\";\n\n   return $this\\->title;\n\n}\n\n## Public members\n\
    \nUnless you specify otherwise, properties and methods of a class are public.\
    \ That is to say, they may be accessed in three possible situations −\n\n.From\
    \ outside the class in which it is declared\n\n.From within the class in which\
    \ it is declared\n\n.From within another class that implements the class in which\
    \ it is declared\n\nTill now we have seen all members as public members. If you\
    \ wish to limit the accessibility of the members of a class then you define class\
    \ members as private or protected.\n\n## Private members\n\nBy designating a member\
    \ private, you limit its accessibility to the class in which it is declared. The\
    \ private member cannot be referred to from classes that inherit the class in\
    \ which it is declared and cannot be accessed from outside the class.\n\nA class\
    \ member can be made private by using private keyword infront of the member.\n\
    \nclass MyClass {\n\n   private $car \\= \"audi\";\n\n   $driver \\= \"willy\"\
    ;\n\n   function \\_\\_construct($par) {\n\n      // Statements here run every\
    \ time\n\n      // an instance of the class\n\n      // is created.\n\n   }\n\n\
       function myPublicFunction() {\n\n      return(\"I'm visible!\");\n\n   }\n\n\
       private function myPrivateFunction() {\n\n      return(\"I'm  not visible outside!\"\
    );\n\n   }\n\n}\n\nWhen MyClass class is inherited by another class using extends,\
    \ myPublicFunction() will be visible, as will $driver. The extending class will\
    \ not have any awareness of or access to myPrivateFunction and $car, because they\
    \ are declared private.\n\n## Protected members\n\nA protected property or method\
    \ is accessible in the class in which it is declared, as well as in classes that\
    \ extend that class. Protected members are not available outside of those two\
    \ kinds of classes. A class member can be made protected by using protected keyword\
    \ in front of the member.\n\nHere is different version of MyClass −\n\nclass MyClass\
    \ {\n\n   protected $car \\= \"audi\";\n\n   $driver \\= \"willy\";\n\n   function\
    \ \\_\\_construct($par) {\n\n      // Statements here run every time\n\n     \
    \ // an instance of the class\n\n      // is created.\n\n   }\n\n   function myPublicFunction()\
    \ {\n\n      return(\"I'm visible!\");\n\n   }\n\n   protected function myPrivateFunction()\
    \ {\n\n      return(\"I'm  visible in child class!\");\n\n   }\n\n}\n\n## interfaces\n\
    \nInterfaces are defined to provide a common function names to the implementers.\
    \ Different implementors can implement those interfaces according to their requirements.\
    \ You can say, interfaces are skeletons which are implemented by developers.\n\
    \nAs of PHP5, it is possible to define an interface, like this −\n\ninterface\
    \ email {\n\n   public function sendemail();\n\n}\n\nThen, if another class implemented\
    \ that interface, like this −\n\nclass Report implements email {\n\n   // sendemail()\
    \ Definition goes here\n\n}\n\n#                                    CONCLUSION\n\
    \n Thank you again for choosing to read this book. I hope this book was able to\
    \ help you learn and understand more about PHP, and how to write PHP codes. The\
    \ next step is now upon you to apply what you have learned in this book.\n\nFinally,\
    \ if you enjoyed this book, please with humble request take the time to share\
    \ your thoughts and post a review on Amazon. It would be greatly appreciated."
