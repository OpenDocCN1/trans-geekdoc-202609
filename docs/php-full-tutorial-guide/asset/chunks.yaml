    \ \n\n?> \n\nYou will learn a lot more about arrays in later chapters of this\
    \ tutorial. \n\n# Chapter 4:PHP OPERATORS\n\n## PHP Operators \n\nThis chapter\
    \ shows the different operators that can be used in PHP scripts. \n\n## PHP arithmetic\
    \ operators\n\n1\\. Addition or summation (+)\n\n$x + $y \n\nSum of $x and $y\
