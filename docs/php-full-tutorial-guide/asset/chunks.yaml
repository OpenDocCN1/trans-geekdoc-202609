    \n$books2=\"religion\"; \n\n$books3=\"history\"; \n\n$books4=\"philosophy\"; \n\
    ```\n\n如果您想遍历书籍并查找特定书籍，该怎么办？如果您不是 4 本书，而是 4000 本书，该怎么办？最好的解决方案是创建一个数组，数组可以在一个名称下容纳许多值，并且您可以通过引用索引号来访问这些值。\n\
    \n## Creating an array\n\n`array()` 函数用于创建数组：\n\n数组有三种类型：\n\n• Indexed arrays\
