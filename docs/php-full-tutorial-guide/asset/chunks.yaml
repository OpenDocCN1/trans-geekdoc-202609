    ```php\n<?php \n\n$x = 15; \n\n$y = 5; \n\nfunctionmultipyl() \n\n{ \n\n$GLOBALS['z']\
    \ = $GLOBALS['x'] * $GLOBALS['y']; \n\n} \n\nmultiply(); \n\necho $z; \n\n?> \n\
    ```\n\nIn the example above, since z is a variable present within the `$GLOBALS`\
