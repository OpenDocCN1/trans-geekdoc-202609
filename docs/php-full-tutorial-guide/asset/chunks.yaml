  fmt: "\n## PHP 条件语句\n\n• 我们接下来使用了 PHP `if` 语句，检查变量 `$my_name` 中包含的值是否等于 `\"william\"\
    `。\n\n• `$my_name` 与 `\"william\"` 之间的比较是使用双等号 `\"==\"` 完成的，而不是单个等号 `\"=\"`！单个等号用于给变量赋值，而双等号用于检查事物是否相等。\n\
    \n• `$my_name` 确实等于 `\"william\"`，因此执行了 `echo` 语句。\n\n假设 `$my_name` 不等于 `\"william\"\
    `，会发生什么情况？\n\nPHP 代码：\n\n```php\n$my_name = \"james\";\n\nif ( $my_name == \"\
    william\" ) { \n\necho \"Your name is william!<br />\"; \n\n} \n\necho \"Welcome\
    \ to mysite!\"; \n```\n\n显示：\n\nWelcome to mysite!\n\n## If /else 语句\n\n有人曾经告诉过你，“如果你努力学习，你就会通过考试”？如果你没有努力学习，会发生什么？嗯，你会失败！这是一个\
    \ if/else 条件语句的示例。\n\nPHP 代码：\n\n```php\n$number_four == 4; \n\nif ( $number_four\
    \ == 4 ) { \n\necho \" true\"; \n\n} else { \n\necho \" false\"; \n\n} \n```\n\
    \n显示：\n\n true \n\n说明：\n\n• 我们首先创建了一个名为 `$number_four` 的 PHP 变量，并将其设置为 4。\n\n\
    • 在本示例中，我们将变量与整数值进行比较。要进行此类比较，我们使用 `\"==\"`。\n\n• `$number_four` 确实等于 4，因此该语句将计算为\
    \ true。\n\n• 位于 `if` 语句后面的左花括号 `\"{\"` 和右花括号 `\"}\"` 之间的所有代码，将在 `if` 语句为 true\
    \ 时执行。\n\n• `else` 段中包含的代码不会被使用。\n\n## 将 else if 与 if..else 一起使用\n\n示例\n\nPHP\
    \ 代码：\n\n```php\n$teacher = \"george\"; \n\nif($teacher == \"anne\"){ \n\necho\
    \ \"Hello madam\"; \n\n} elseif ($teacher == \"george\"){ \n\necho \"hello Sir!\"\
    ; \n\n}else { \n\necho \n\n\"Morning\"; \n\n} \n```\n\n显示：\n\nhello Sir! \n\n\
    PHP 首先检查 `$teacher` 是否等于 `\"anne\"`，结果为 false。接下来，PHP 检查第一个 `elseif` 语句，`$teacher`\
    \ 确实等于 `\"george\"`，因此打印出了短语 `george Sir!\"`。如果我们想检查更多教师姓名，可以插入更多 `elseif` 语句！请注意，除非\
    \ `elseif` 语句前面有 `if` 语句，否则不能使用 `elseif` 语句。\n\n## Switch 语句\n\n有时，`if` 语句不是检查某些条件的最有效方法。使用\
    \ `switch` 语句，您可以一次性检查所有这些条件。\n\n其工作原理如下：首先，我们有一个单个表达式（通常是一个变量），该表达式只计算一次。然后，将表达式的值与代码结构中每个\
    \ `case` 的值进行比较。如果匹配，则执行与该 `case` 关联的代码块。使用 `break` 是为了防止代码自动运行到下一个 `case`。如果没有找到匹配项，则使用\
    \ `default` 语句。\n\n示例\n\n```php\n<?php \n\n$color=\"pink\"; \n\nswitch ($color)\
    \ \n\n{ \n\ncase \"yellow\": \n\necho \"Your favorite color is yellow!\"; \n\n\
    break; \n\ncase \"red\": \n\necho \"Your favorite color is red!\"; \n\nbreak;\
    \ \n\ncase \"pink\": \n\necho \"Your favorite color is pink!\"; \n\nbreak; \n\n\
    default: \n\necho \"Your favorite color is not known!\"; \n\n} \n\n?>\n```\n\n\
    `if` 语句有 `else` 子句，而 `switch` 语句有 `default` case。通常，在所有 `switch` 语句中始终包含 `default`\
    \ case 是个好主意。\n\n## while 循环\n\nPHP `while` 循环在指定条件为 true 时执行一段代码。通常，当您编写代码时，希望同一段代码反复运行多次。与其在脚本中添加几个（这很乏味）几乎相同的代码行，不如使用循环来执行此类任务。\n\
    \n在 PHP 中，使用以下循环语句：\n\n• `while` - 循环执行一段代码，只要指定条件为 true 即可。\n\n语法\n\n```php\n\
    while ( condition is true) \n\n{ \n\n code to be executed; \n\n} \n\n```\n\n以下示例首先将变量\
    \ `$x` 设置为 1 (`$x=1;`)。然后，`while` 循环将继续运行，只要 `$x` 小于或等于 10。每次循环运行时，`$x` 都会增加 1\
    \ (`$x++;`)：\n\n示例\n\n```php\n<?php \n\n$x=1; \n\nwhile($x<=10) \n\n{ \n\necho\
    \ \"The number is: $x <br>\"; \n\n$x++; \n\n} \n\n?> \n\n```\n\n• `do...while`\
    \ - 循环执行一次代码块，然后只要指定条件为 true 就重复循环。`do...while` 循环总是会先执行一次代码块，然后检查条件，并在指定条件为 true\
    \ 时重复循环。\n\n语法\n\n```php\ndo \n\n{ \n\n code to be executed; \n\n } \n\nwhile\
    \ ( condition is true); \n\n```\n\n以下示例首先将变量 `$x` 设置为 1 (`$x=1;`)。然后，`do while`\
    \ 循环将输出一些内容，然后将变量 `$x` 增加 1。然后检查条件，只要 `$x` 小于或等于 10，循环就会继续运行：\n\n示例\n\n```php\n\
    <?php \n\n$x=1; \n\ndo \n\n{ \n\necho \"The number is: $x <br>\"; \n\n$x++; \n\
    \n} \n\nwhile ($x<=10) \n\n?> \n```\n\n请注意，在 `do while` 循环中，条件是在执行循环内的语句后进行测试的。这意味着，即使条件第一次失败，`do\
    \ while` 循环也会至少执行一次其语句。\n\n## For 循环\n\nPHP `for` 循环执行一段代码指定的次数。当您事先知道脚本应该运行多少次时，使用\
    \ `for` 循环。\n\n语法\n\n```php\nfor ( init counter; test counter; increment counter)\
    \ \n\n{ \n\ncode to be executed;  \n\n} \n```\n\n说明：\n\n• `init counter`：初始化循环计数器值。\n\
    \n• `test counter`：在每次循环迭代中进行计算。如果计算结果为 true，则循环继续。如果计算结果为 false，则循环结束。\n\n• `increment\
    \ counter`：增加循环计数器值。\n\n以下示例显示 0 到 100 的数字：\n\n示例\n\n```php\n<?php \n\nfor ($x=0;\
    \ $x<=100; $x++) \n\n{ \n\necho \"The number is: $x <br>\"; \n\n} \n\n?> \n\n\
    ```\n\n## Foreach 循环\n\n`foreach` 循环仅适用于数组，用于遍历数组中的每个键值对。在每次循环迭代中，当前数组元素的值被赋给\
    \ `$value`，数组指针移动一位，直到到达最后一个数组元素。以下示例演示了一个循环，它将输出给定数组 (`$fruits`) 的值：\n\n语法\n\n\
    ```php\nforeach ($ array  as  $ value) \n\n{ \n\ncode to be executed;  \n\n} \n\
    ```\n\n示例\n\n```php\n<?php \n\n$fruits = array(\"mango\",\"orange\",\"pawpaw\"\
    ,\"ovacado\"); \n\nforeach ($fruits as $value) \n\n{ \n\necho \"$value <br>\"\
    ; \n\n} \n\n?> \n\n# Chapter 6:PHP ARRAYS\n\n## Array definition\n\n数组将多个值存储在一个单个变量中，因此数组是一种特殊的变量，一次可以容纳多个值。\n\
