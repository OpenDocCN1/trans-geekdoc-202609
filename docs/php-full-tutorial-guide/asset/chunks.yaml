    \ outputs 10 \n\n$y=10; \n\necho $y++; // outputs 10 \n\n$z=6; \n\necho --$z;\
    \ // outputs 5 \n\n$i=5; \n\necho $i--; // outputs 5 \n\n?> \n\n## PHP comparison\
    \ Operators \n\nThe PHP comparison operators are used to compare two values (number\
    \ or string): \n\n1\\. Equal (== )\n\n$x == $y \n\nTrue if $x is equal to $y \n\
    \n2\\. Identical (===) \n\n$x === $y \n\nTrue if $x is equal to $y, and they are\
    \ \n\nof the same type \n\n3\\. Not equal (!=) \n\n$x != $y \n\nTrue if $x is\
    \ not equal to $y \n\n4\\. Not equal (<> )\n\n$x <> $y \n\nTrue if $x is not equal\
    \ to $y \n\n5\\. Not identical (!==) \n\n$x !== $y \n\nTrue if $x is not equal\
    \ to $y, or they \n\nare not of the same type \n\n6\\. Greater than (> )\n\n$x\
    \ > $y \n\nTrue if $x is greater than $y \n\n7\\. Less than (<) \n\n$x < $y \n\
    \nTrue if $x is less than $y \n\n8\\. Greater than or equal to (>=) \n\n$x >=\
    \ $y \n\nTrue if $x is greater than or equal to $y \n\n9\\. Less than or equal\
    \ to (<= )\n\n$x <= $y \n\nTrue if $x is less than or equal to $y \n\nThe example\
    \ below shows the different results of using some of the comparison operators:\
    \ \n\nExample \n\n<?php \n\n$x=100; \n\n$y=\"100\"; \n\nvar\\_dump($x == $y);\
    \ \n\necho \"<br>\"; \n\nvar\\_dump($x === $y); \n\necho \"<br>\"; \n\nvar\\_dump($x\
    \ != $y); \n\necho \"<br>\"; \n\nvar\\_dump($x !== $y); \n\necho \"<br>\"; \n\n\
    $a=50; \n\n$b=90; \n\nvar\\_dump($a > $b); \n\necho \"<br>\"; \n\nvar\\_dump($a\
    \ < $b); \n\n?> \n\n## PHP logical Operators \n\n1.and  \n\n$x and $y \n\nTrue\
    \ if both $x and $y are true \n\n2.or \n\n$x or $y \n\nTrue if either $x or $y\
    \ is true \n\n3.xor \n\n$x xor $y \n\nTrue if either $x or $y is true, but not\
    \ \n\n4.both (&& ) \n\n$x && $y \n\nTrue if both $x and $y are true \n\n5.|| (Or)\
    \ \n\n$x || $y \n\nTrue if either $x or $y is true \n\n6.! (Not) \n\n!$x \n\n\
    True if $x is not true \n\n## PHP array Operators \n\nThe PHP array operators\
    \ are used to compare arrays: \n\n1\\. Union (+) \n\n$x + $y \n\nUnion of $x and\
    \ $y (but duplicate keys are not overwritten) \n\n2\\. Equality (== )\n\n$x ==\
    \ $y \n\nTrue if $x and $y have the same key/value pairs \n\n3.Identity (===)\n\
    \n$x === $y \n\nTrue if $x and $y have the same key/value pairs in the same order\
    \ and of the same types \n\n4\\. Inequality (!= )\n\n$x != $y \n\nTrue if $x is\
    \ not equal to $y \n\n5\\. Inequality (<> )\n\n$x <> $y \n\nTrue if $x is not\
    \ equal to $y \n\n6\\. Non-identity (!== )\n\n$x !== $y \n\nTrue if $x is not\
    \ identical to $y \n\nThe example below shows the different results of using the\
    \ different array operators: \n\nExample \n\n<?php \n\n$x = array(\"a\" => \"\
    red\", \"b\" => \"green\"); \n\n$y = array(\"c\" => \"blue\", \"d\" => \"yellow\"\
    ); \n\n$z = $x + $y; // union of $x and $y \n\nvar\\_dump($z); \n\nvar\\_dump($x\
    \ == $y); \n\nvar\\_dump($x === $y); \n\nvar\\_dump($x != $y); \n\nvar\\_dump($x\
    \ <> $y); \n\nvar\\_dump($x !== $y); \n\n?> \n\n# Chapter 5:CONTROL STRUCTURES\
    \ \n\n## If statement\n\nThe PHP if statement is very similar to other programming\
    \ languages use of the if statement,  check the following: \n\nThis simple kind\
    \ of if/then statement is very common in every day life and also appears in programming\
    \ quite often. Whenever you want to make a decision given that something is true\
    \ and be sure that you take the appropriate action, you are using an if/then relationship.\
    \ \n\nexample \n\n$my\\_name = \"william\"; \n\nif ( $my\\_name == \"william\"\
    \ ) { \n\necho \"Your name is william!<br />\"; \n\n} \n\nDisplay: \n\nYour name\
    \ is william! \n\nexplanation \n\nDid you get that we were comparing the variable\
    \ $my\\_name with \"william\" to see if they were equal? In PHP you use the double\
    \ equal sign (==) to compare values. Additionally, notice that because the if\
    \ statement turned out to be true, the code segment was executed, printing out\
    \ \"Your name is william!\". Let's go a bit more into details\n\n• We first set\
    \ the variable $my\\_name equal to \"william\". "
