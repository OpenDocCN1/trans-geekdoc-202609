    \ bytes\" );\necho ( \"<pre>$filetext</pre>\" );\n```\n\n## Writing a file\n\n\
    A new file can be written or text can be appended to an existing file using the\
    \ PHP `fwrite()` function. This function requires two arguments specifying a file\
    \ pointer and the string of data that is to be written. Optionally a third integer\
    \ argument can be included to specify the length of the data to write. If the\
    \ third argument is included, writing would will stop after the specified length\
    \ has been reached.\n\nThe following example creates a new text file then writes\
    \ a short text heading inside it. After closing this file its existence is confirmed\
    \ using `file_exist()` function which takes file name as an argument\n\n```php\n\
    $filename = \"/home/user/guest/newfile.txt\";\n$file = fopen( $filename, \"w\"\
    \ );\nif( $file == false )\n{\n    echo ( \"Error occurred in opening new file\"\
    \ );\n    exit();\n}\nfwrite( $file, \"This is a simple file\\n\" );\nfclose(\
    \ $file );\n```\n\n```php\n$filename = \"newfile.txt\";\n$file = fopen( $filename,\
    \ \"r\" );\nif( $file == false )\n{\n    echo ( \"Error occured in opening file\"\
    \ );\n    exit();\n}\n$filesize = filesize( $filename );\n$filetext = fread( $file,\
    \ $filesize );\nfclose( $file );\necho ( \"File size is: $filesize bytes\" );\n\
    echo ( \"$filetext\" );\necho(\"file name: $filename\");\n```\n\n# Chapter 13:\
    \ OBJECT ORIENTED PHP\n\nOur universe made of different objects like moon, earth,\
    \ mars etc. Similarly we can imagine our car made of different objects like wheel,\
    \ steering, gear etc. Same way there is object oriented programming concepts which\
    \ assume everything as an object and implement a software using different objects.\n\
    \n## Object oriented concepts\n\nClass − This is a programmer-defined data type,\
    \ which includes local functions as well as local data. You can think of a class\
    \ as a template for making many instances of the same kind (or class) of object.\n\
    \nObject − An individual instance of the data structure defined by a class. You\
    \ define a class once and then make many objects that belong to it. Objects are\
    \ also known as instance.\n\nInheritance − When a class is defined by inheriting\
    \ existing function of a parent class then it is called inheritance. Here child\
    \ class will inherit all or few member functions and variables of a parent class.\n\
    \nParent class − A class that is inherited from by another class. This is also\
    \ called a base class or super class.\n\nChild Class − A class that inherits from\
    \ another class. This is also called a subclass or derived class.\n\nPolymorphism\
    \ − This is an object oriented concept where same function can be used for different\
    \ purposes. For example function name will remain same but it make take different\
    \ number of arguments and can do different task.\n\nOverloading − a type of polymorphism\
    \ in which some or all of operators have different implementations depending on\
    \ the types of their arguments. Similarly functions can also be overloaded with\
    \ different implementation.\n\nData Abstraction − Any representation of data in\
    \ which the implementation details are hidden.\n\nEncapsulation − refers to a\
    \ concept where we encapsulate all the data and member functions together to form\
    \ an object.\n\nConstructor − refers to a special type of function which will\
    \ be called automatically whenever there is an object formation from a class.\n\
    \n## Defining PHP classes\n\nThe general form for defining a new class in PHP\
    \ is as follows −\n\n```php\nclass phpClass{\n    var $var1;\n    var $var2 =\
    \ \"constant string\";\n    function myfunc ($arg1, $arg2) {\n        [...]\n\
    \    }\n    [...]\n}\n```\n"
  trans: "\n\n3\\. expiration: Cookie 将过期并被删除的日期。如果不设置此过期日期，则它将被视为会话 Cookie，并在浏览器重新启动时被删除。\n\
    \n在本示例中，我们将创建一个存储用户上次访问时间的 Cookie，以衡量人们返回访问我们网页的频率。我们希望忽略那些超过两个月才返回网站的人，因此我们将\
    \ Cookie 的过期日期设置为两个月后！\n\nPHP Code:\n\n```php\n//Calculate 60 days in the future\n\
    //seconds * minutes * hours * days + current time\n$inTwoMonths = 60 * 60 * 24\
    \ * 60 + time();\nsetcookie(lastVisit, date(\"G:i - m/d/y\"), $inTwoMonths);\n\
    ```\n\n如果你无法跟上本示例中稍微复杂的日期计算，请不要担心。重要的是，你要知道如何通过指定三个重要参数（名称、值和过期日期）来设置 Cookie。\n\
    \n## 检索 Cookie\n\n如果 Cookie 尚未过期，让我们使用 `$_COOKIE` 关联数组从用户的 PC 中检索它。存储 Cookie 的名称是键，它将让你检索存储的\
    \ Cookie 值！\n\nPHP Code:\n\n```php\nif(isset($_COOKIE['lastVisit']))\n$visit =\
    \ $_COOKIE['lastVisit'];\nelse\necho \"You've got some stale cookies!\";\necho\
    \ \"Your last visit was - \". $visit;\n```\n\n这个实用脚本首先使用 `isset` 函数来确保我们的 \"lastVisit\"\
    \ Cookie 仍然存在于用户的 PC 上，如果存在，则显示用户的上次访问时间。如果用户在 2015 年 5 月 14 日访问了我们的网站，它可能看起来像这样：\n\
    \n显示：\n\nYour last visit was - 10:41- 05/14/15\n\n# 第 12 章：使用文件\n\n## 打开和关闭文件\n\
    \n在 PHP 中，通常使用 `fopen()` 函数来打开文件。它需要两个参数，分别指定文件名和操作模式。如果文件打开不成功，`fopen()` 函数将返回\
    \ false，否则它将返回一个文件指针，用于读取或写入该特定文件。\n\n文件模式可以按如下方式指定\n\n| 文件模式 | 用途 |\n| --- |\
    \ --- |\n| r | 仅以读取方式打开文件。将文件指针放置在文件开头。 |\n| r+ | 以读取和写入方式打开文件。将文件指针放置在文件开头。 |\n\
    | w | 仅以写入方式打开文件。将文件指针放置在文件开头，并将文件截断为零长度。如果文件不存在，则尝试创建文件。 |\n| w+ | 以读取和写入方式打开文件。将文件指针放置在文件开头，并将文件截断为零长度。如果文件不存在，则尝试创建文件。\
    \ |\n| a | 仅以写入方式打开文件。将文件指针放置在文件末尾。如果文件不存在，则尝试创建文件。 |\n| a+ | 以读取和写入方式打开文件。将文件指针放置在文件末尾。如果文件不存在，则尝试创建文件。\
    \ |\n\n## 读取文件\n\n一旦使用 `fopen()` 函数打开文件，就可以使用名为 `fread()` 的函数来读取它。该函数需要两个参数。这些参数必须是文件指针和以字节表示的文件长度。\n\
    \n可以使用 `filesize()` 函数来查找文件的长度，该函数以文件名作为参数，并返回以字节表示的文件大小。\n\n以下是使用 PHP 读取文件所需的步骤。\n\
    \n* 使用 `fopen()` 函数打开文件。\n* 使用 `filesize()` 函数获取文件长度。\n* 使用 `fread()` 函数读取文件内容。\n\
    * 使用 `fclose()` 函数关闭文件。\n\n以下示例将文本文件的内容分配给一个变量，然后在网页上显示这些内容。\n\n```php\n$filename\
    \ = \"example.txt\";\n$file = fopen( $filename, \"r\" );\nif( $file == false )\n\
    {\n    echo ( \"Error occurred in opening file\" );\n    exit();\n}\n$filesize\
    \ = filesize( $filename );\n$filetext = fread( $file, $filesize );\nfclose( $file\
    \ );\necho ( \"File size is : $filesize bytes\" );\necho ( \"<pre>$filetext</pre>\"\
    \ );\n```\n\n## 写入文件\n\n可以使用 PHP 的 `fwrite()` 函数创建新文件或将文本追加到现有文件中。该函数需要两个参数，分别指定文件指针和要写入的数据字符串。可选地，可以包含第三个整数参数来指定要写入的数据长度。如果包含第三个参数，写入将在达到指定长度后停止。\n\
    \n以下示例创建一个新文本文件，然后在其中写入一个简短的文本标题。关闭此文件后，使用 `file_exist()` 函数确认其存在，该函数以文件名作为参数\n\
    \n```php\n$filename = \"/home/user/guest/newfile.txt\";\n$file = fopen( $filename,\
    \ \"w\" );\nif( $file == false )\n{\n    echo ( \"Error occurred in opening new\
    \ file\" );\n    exit();\n}\nfwrite( $file, \"This is a simple file\\n\" );\n\
    fclose( $file );\n```\n\n```php\n$filename = \"newfile.txt\";\n$file = fopen(\
    \ $filename, \"r\" );\nif( $file == false )\n{\n    echo ( \"Error occured in\
    \ opening file\" );\n    exit();\n}\n$filesize = filesize( $filename );\n$filetext\
    \ = fread( $file, $filesize );\nfclose( $file );\necho ( \"File size is: $filesize\
    \ bytes\" );\necho ( \"$filetext\" );\necho(\"file name: $filename\");\n```\n\n\
    # 第 13 章：面向对象 PHP\n\n我们的宇宙由不同的对象组成，如月球、地球、火星等。同样，我们可以想象我们的汽车由不同的对象组成，如车轮、方向盘、齿轮等。同样，面向对象编程概念将一切视为对象，并使用不同的对象实现软件。\n\
    \n## 面向对象概念\n\nClass − 这是一种程序员定义的数据类型，包括局部函数和局部数据。你可以将类视为制作同一类（或类）对象的多个实例的模板。\n\
    \nObject − 由类定义的数据结构的一个单独实例。你定义一次类，然后创建许多属于它的对象。对象也称为实例。\n\nInheritance − 当一个类通过继承父类的现有函数来定义时，这称为继承。在这里，子类将继承父类的全部或部分成员函数和变量。\n\
    \nParent class − 被另一个类继承的类。这也称为基类或超类。\n\nChild Class − 从另一个类继承的类。这也称为子类或派生类。\n\
    \nPolymorphism − 这是一种面向对象的概念，其中同一个函数可以用于不同的目的。例如，函数名称将保持不变，但它可以接受不同数量的参数并执行不同的任务。\n\
    \nOverloading − 一种多态类型，其中一些或所有运算符根据其参数的类型具有不同的实现。同样，函数也可以用不同的实现进行重载。\n\nData Abstraction\
    \ − 隐藏实现细节的任何数据表示。\n\nEncapsulation − 指将所有数据和成员函数封装在一起以形成对象的概念。\n\nConstructor\
    \ − 指一种特殊的函数，每当从类中创建对象时，它都会自动被调用。\n\n## 定义 PHP 类\n\n在 PHP 中定义新类的一般形式如下 −\n\n```php\n\
    class phpClass{\n    var $var1;\n    var $var2 = \"constant string\";\n    function\
    \ myfunc ($arg1, $arg2) {\n        [...]\n    }\n    [...]\n}\n```\n\n"
