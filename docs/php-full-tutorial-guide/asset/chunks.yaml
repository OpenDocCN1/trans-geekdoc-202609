    \ if `$x` is not true\n\n## PHP array Operators\n\nThe PHP array operators are\
    \ used to compare arrays:\n\n1. Union (`+`)\n\n`$x + $y`\n\nUnion of `$x` and\
    \ `$y` (but duplicate keys are not overwritten)\n\n2. Equality (`==`)\n\n`$x ==\
    \ $y`\n\nTrue if `$x` and `$y` have the same key/value pairs\n\n3. Identity (`===`)\n\
    \n`$x === $y`\n\nTrue if `$x` and `$y` have the same key/value pairs in the same\
    \ order and of the same types\n\n4. Inequality (`!=`)\n\n`$x != $y`\n\nTrue if\
    \ `$x` is not equal to `$y`\n\n5. Inequality (`<>`)\n\n`$x <> $y`\n\nTrue if `$x`\
    \ is not equal to `$y`\n\n6. Non-identity (`!==`)\n\n`$x !== $y`\n\nTrue if `$x`\
    \ is not identical to `$y`\n\nThe example below shows the different results of\
    \ using the different array operators:\n\nExample\n\n```php\n<?php \n\n$x = array(\"\
    a\" => \"red\", \"b\" => \"green\"); \n\n$y = array(\"c\" => \"blue\", \"d\" =>\
    \ \"yellow\"); \n\n$z = $x + $y; // union of $x and $y \n\nvar_dump($z); \n\n\
    var_dump($x == $y); \n\nvar_dump($x === $y); \n\nvar_dump($x != $y); \n\nvar_dump($x\
    \ <> $y); \n\nvar_dump($x !== $y); \n\n?> \n```\n\n# Chapter 5: CONTROL STRUCTURES\n\
    \n## If statement\n\nThe PHP if statement is very similar to other programming\
    \ languages use of the if statement, check the following:\n\nThis simple kind\
    \ of if/then statement is very common in every day life and also appears in programming\
    \ quite often. Whenever you want to make a decision given that something is true\
    \ and be sure that you take the appropriate action, you are using an if/then relationship.\n\
    \nexample\n\n`$my_name = \"william\";`\n\n`if ( $my_name == \"william\" ) {`\n\
    \n`echo \"Your name is william!<br />\";`\n\n`}`\n\nDisplay:\n\nYour name is william!\n\
    \nexplanation\n\nDid you get that we were comparing the variable `$my_name` with\
    \ `\"william\"` to see if they were equal? In PHP you use the double equal sign\
    \ (`==`) to compare values. Additionally, notice that because the if statement\
    \ turned out to be true, the code segment was executed, printing out \"Your name\
    \ is william!\". Let's go a bit more into details\n\n• We first set the variable\
    \ `$my_name` equal to `\"william\"`.\n"
  trans: "\n\n# 整数\n\n- 整数必须至少有一个数字 (`0-9`)\n- 整数不能包含逗号或空格\n- 整数不能有小数点\n- 整数可以是正数或负数\n\
    - 整数可以用三种格式指定：十进制 (`10`-based)、十六进制 (`16`-based - 前缀为 `0x`) 或八进制 (`8`-based -\
    \ 前缀为 `0`)\n\n在以下示例中，我们将测试不同的数字。PHP `var_dump()` 函数返回变量的数据类型和值：\n\nExample\n\n\
    ```php\n<?php \n\n$x = 5985; \n\nvar_dump($x); \n\necho \"<br>\"; \n\n$x = -345;\
    \ // negative number \n\nvar_dump($x); \n\necho \"<br>\"; \n\n$x = 0x8C; // hexadecimal\
    \ number \n\nvar_dump($x); \n\necho \"<br>\"; \n\n$x = 047; // octal number \n\
    \nvar_dump($x); \n\n?> \n```\n\n# 浮点数\n\n浮点数是带有小数点的数字或指数形式的数字。\n\n在以下示例中，我们将测试不同的数字。PHP\
    \ `var_dump()` 函数返回变量的数据类型和值：\n\nExample\n\n```php\n<?php \n\n$x = 10.365; \n\n\
    var_dump($x); \n\necho \"<br>\"; \n\n$x = 2.4e3; \n\nvar_dump($x); \n\necho \"\
    <br>\"; \n\n$x = 8E-5; \n\nvar_dump($x); \n\n?> \n```\n\n# 布尔值\n\n布尔值可以是 `TRUE`\
    \ 或 `FALSE`。\n\n`var x=true;` \n\n`var y=false;`\n\n布尔值常用于条件测试。您将在本教程的后续章节中了解更多关于条件测试的内容。\n\
    \n# 数组\n\n数组在一个单一变量中存储多个值。\n\n在以下示例中，我们创建一个数组，然后使用 PHP `var_dump()` 函数返回数组的数据类型和值：\n\
    \nExample\n\n```php\n<?php \n\n$fruits=array(\"mango\",\"apple\",\"ovacado\",’’banana’’);\
    \ \n\nvar_dump($fruits); \n\n?> \n```\n\n您将在本教程的后续章节中了解更多关于数组的内容。\n\n# Chapter\
    \ 4: PHP OPERATORS\n\n## PHP Operators\n\n本章展示了可以在 PHP 脚本中使用的不同运算符。\n\n## PHP\
    \ 算术运算符\n\n1. 加法或求和 (`+`)\n\n`$x + $y`\n\n`$x` 和 `$y` 的和\n\n2. 减法 (`-`)\n\n`$x\
    \ - $y`\n\n`$x` 和 `$y` 的差\n\n3. 乘法 (`*`)\n\n`$x * $y`\n\n`$x` 和 `$y` 的积\n\n4.\
    \ 除法 (`/`)\n\n`$x / $y`\n\n`$x` 和 `$y` 的商\n\n5. 取模 (`%`)\n\n`$x % $y`\n\n`$x`\
    \ 除以 `$y` 的余数\n\n下面的示例展示了使用不同算术运算符的不同结果：\n\nExample\n\n```php\n<?php \n\n$x=5;\
    \ \n\n$y=3; \n\necho ($x + $y); // outputs 8\n\necho ($x - $y); // outputs 2 \n\
    \necho ($x * $y); // outputs 15 \n\necho ($x / $y); // outputs 1.6666666666667\
    \ \n\necho ($x % $y); // outputs 2 \n\n?> \n```\n\n## PHP 赋值运算符\n\nPHP 赋值运算符用于将值写入变量。\n\
    \nPHP 中的基本赋值运算符是 `\"=\"`。它表示左操作数被设置为右侧赋值表达式的值。\n\n`x = y` 和是与 `x = y` 相同\n\n左操作数被设置为右侧表达式的值\n\
    \n1. 加法\n\n`x += y`\n\n`x = x + y`\n\n2. 减法\n\n`x -= y`\n\n`x = x - y`\n\n3. 乘法\n\
    \n`x *= y`\n\n`x = x * y`\n\n4. 除法\n\n`x /= y`\n\n`x = x / y`\n\n5. 取模\n\n`x %=\
    \ y`\n\n`x = x % y`\n\n下面的示例展示了使用不同赋值运算符的不同结果：\n\nExample\n\n```php\n<?php \n\n\
    $x=10; \n\necho $x; // outputs 10 \n\n$y=10; \n\n$y += 10; \n\necho $y; // outputs\
    \ 20 \n\n$z=40; \n\n$z -= 25; \n\necho $z; // outputs 15 \n\n$i=5; \n\n$i *= 9;\
    \ \n\necho $i; // outputs 45\n\n$j=12; \n\n$j /= 6; \n\necho $j; // outputs 2\
    \ \n\n$k=15; \n\n$k %= 4; \n\necho $k; // outputs 3 \n\n?> \n```\n\n## PHP 字符串运算符\n\
    \n1. 连接 (`.`)\n\n`$txt1 = \"Hello\"`\n\n`$txt2 = $txt1 . \" world!\"`\n\n输出是 hello\
    \ world\n\n2. 连接赋值 (`.=`)\n\n`$txt1 = \"Hello\"`\n\n现在 `$txt1` 包含 `\"Hello world!\"\
    `\n\n`$txt1 .= \" world!\"`\n\n下面的示例展示了使用字符串运算符的结果：\n\nExample\n\n```php\n<?php\
    \ \n\n$x = \"Hello\"; \n\n$y = $a . \" world!\"; \n\necho $y; // outputs Hello\
    \ world! \n\n$x=\"Hello\"; \n\n$x .= \" world!\"; \n\necho $x; // outputs Hello\
    \ world! \n\n?> \n```\n\n## PHP 自增/自减运算符\n\n1. 前自增 (`++$x`)\n\n将 `$x` 增加一，然后返回\
    \ `$x`\n\n2. 后自增 (`$x++`)\n\n返回 `$x`，然后将 `$x` 增加一\n\n3. 前自减 (`--$x`)\n\n将 `$x`\
    \ 减少一，然后返回 `$x`\n\n4. 后自减 (`$x--`)\n\n后自减\n\n返回 `$x`，然后将 `$x` 减少一\n\n下面的示例展示了使用不同自增/自减运算符的不同结果：Example\n\
    \n```php\n<?php \n\n$x=9; \n\necho ++$x; // outputs 10 \n\n$y=10; \n\necho $y++;\
    \ // outputs 10 \n\n$z=6; \n\necho --$z; // outputs 5 \n\n$i=5; \n\necho $i--;\
    \ // outputs 5 \n\n?> \n```\n\n## PHP 比较运算符\n\nPHP 比较运算符用于比较两个值（数字或字符串）：\n\n1.\
    \ 等于 (`==`)\n\n`$x == $y`\n\n如果 `$x` 等于 `$y`，则为真\n\n2. 全等 (`===`)\n\n`$x === $y`\n\
    \n如果 `$x` 等于 `$y`，并且它们的类型相同，则为真\n\n3. 不等于 (`!=`)\n\n`$x != $y`\n\n如果 `$x` 不等于\
    \ `$y`，则为真\n\n4. 不等于 (`<>`)\n\n`$x <> $y`\n\n如果 `$x` 不等于 `$y`，则为真\n\n5. 不全等 (`!==`)\n\
    \n`$x !== $y`\n\n如果 `$x` 不等于 `$y`，或者它们的类型不同，则为真\n\n6. 大于 (`>`)\n\n`$x > $y`\n\n\
    如果 `$x` 大于 `$y`，则为真\n\n7. 小于 (`<`)\n\n`$x < $y`\n\n如果 `$x` 小于 `$y`，则为真\n\n8. 大于或等于\
    \ (`>=`)\n\n`$x >= $y`\n\n如果 `$x` 大于或等于 `$y`，则为真\n\n9. 小于或等于 (`<=`)\n\n`$x <=\
    \ $y`\n\n如果 `$x` 小于或等于 `$y`，则为真\n\n下面的示例展示了使用一些比较运算符的不同结果：\n\nExample\n\n```php\n\
    <?php \n\n$x=100; \n\n$y=\"100\"; \n\nvar_dump($x == $y); \n\necho \"<br>\"; \n\
    \nvar_dump($x === $y); \n\necho \"<br>\"; \n\nvar_dump($x != $y); \n\necho \"\
    <br>\"; \n\nvar_dump($x !== $y); \n\necho \"<br>\"; \n\n$a=50; \n\n$b=90; \n\n\
    var_dump($a > $b); \n\necho \"<br>\"; \n\nvar_dump($a < $b); \n\n?> \n```\n\n\
    ## PHP 逻辑运算符\n\n1. `and`\n\n`$x and $y`\n\n如果 `$x` 和 `$y` 都为真，则为真\n\n2. `or`\n\
    \n`$x or $y`\n\n如果 `$x` 或 `$y` 为真，则为真\n\n3. `xor`\n\n`$x xor $y`\n\n如果 `$x` 或\
    \ `$y` 为真，但不是两者都为真，则为真\n\n4. 两者 (`&&`)\n\n`$x && $y`\n\n如果 `$x` 和 `$y` 都为真，则为真\n\
    \n5. `||` (Or)\n\n`$x || $y`\n\n如果 `$x` 或 `$y` 为真，则为真\n\n6. `!` (Not)\n\n`!$x`\n\
    \n如果 `$x` 不为真，则为真\n\n## PHP 数组运算符\n\nPHP 数组运算符用于比较数组：\n\n1. 并集 (`+`)\n\n`$x +\
    \ $y`\n\n`$x` 和 `$y` 的并集（但重复的键不会被覆盖）\n\n2. 相等 (`==`)\n\n`$x == $y`\n\n如果 `$x`\
    \ 和 `$y` 具有相同的键/值对，则为真\n\n3. 全等 (`===`)\n\n`$x === $y`\n\n如果 `$x` 和 `$y` 具有相同的键/值对，顺序相同且类型相同，则为真\n\
    \n4. 不相等 (`!=`)\n\n`$x != $y`\n\n如果 `$x` 不等于 `$y`，则为真\n\n5. 不相等 (`<>`)\n\n`$x\
    \ <> $y`\n\n如果 `$x` 不等于 `$y`，则为真\n\n6. 不全等 (`!==`)\n\n`$x !== $y`\n\n如果 `$x` 不全等于\
    \ `$y`，则为真\n\n下面的示例展示了使用不同数组运算符的不同结果：\n\nExample\n\n```php\n<?php \n\n$x = array(\"\
    a\" => \"red\", \"b\" => \"green\"); \n\n$y = array(\"c\" => \"blue\", \"d\" =>\
    \ \"yellow\"); \n\n$z = $x + $y; // union of $x and $y \n\nvar_dump($z); \n\n\
    var_dump($x == $y); \n\nvar_dump($x === $y); \n\nvar_dump($x != $y); \n\nvar_dump($x\
    \ <> $y); \n\nvar_dump($x !== $y); \n\n?> \n```\n\n# Chapter 5: CONTROL STRUCTURES\n\
    \n## If 语句\n\nPHP if 语句与其他编程语言中 if 语句的用法非常相似，请查看以下内容：\n\n这种简单的 if/then 语句在日常生活中非常常见，在编程中也经常出现。每当你想要在某件事情为真时做出决定，并确保采取适当的行动时，你都在使用\
    \ if/then 关系。\n\nexample\n\n`$my_name = \"william\";`\n\n`if ( $my_name == \"\
    william\" ) {`\n\n`echo \"Your name is william!<br />\";`\n\n`}`\n\nDisplay:\n\
    \nYour name is william!\n\nexplanation\n\n你是否明白我们是在将变量 `$my_name` 与 `\"william\"\
    ` 进行比较，看它们是否相等？在 PHP 中，你使用双等号 (`==`) 来比较值。此外，请注意，因为 if 语句结果为真，所以执行了代码段，打印出 \"\
    Your name is william!\"。让我们深入了解一下细节\n\n• 我们首先将变量 `$my_name` 设置为 `\"william\"`。\n\
    \n"
