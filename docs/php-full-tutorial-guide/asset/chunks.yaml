    \n版权所有 (2015)\n\n# 第 1 章：PHP 简介\n\n## 要求\n\n在开始学习 PHP 之前，建议您对以下内容有基本了解：\n\n- CSS\n\
    - HTML\n\n## 什么是 PHP\n\n- PHP 是 Hypertext Preprocessor 的缩写\n- PHP 是一种嵌入 HTML 的脚本语言\n\
    - PHP 脚本在服务器上执行\n- PHP 文件的扩展名为 \".php\"\n\n## PHP 能做什么\n\n从 PHP 能为您做什么的角度来思考也是有帮助的。\n\
    \n- 减少创建大型网站所需的时间。\n- 根据您从访问者那里收集的信息，为访问者创建定制的用户体验。\n- 可以生成动态页面内容\n- 可以收集表单数据\n\
    - 可以发送和接收 Cookie\n- 可以在数据库中添加、删除、修改数据\n- 可以在服务器上创建、打开、读取、写入和关闭文件\n- 可以加密数据\n\n\
    ## 为什么选择 PHP\n\n- PHP 可在各种操作系统平台上运行（Windows、Unix 等）\n- PHP 易于学习，并在服务器端高效运行\n-\
    \ PHP 与当今使用的几乎所有服务器兼容（Apache 等）\n- PHP 支持多种数据库\n- PHP 可免费获得\n\n## PHP 语法\n\nPHP\
    \ 脚本以 `<?php` 开始，以 `?>` 结束：\n\n```php\n<?php \n\n// PHP code here \n\n?>\n```\n\
    \nPHP 文件通常包含 HTML 标签和一些 PHP 脚本代码。\n\n如您在下面的示例中所见，PHP 代码行后面有一个分号。分号表示 PHP 语句的结束，绝不能遗忘。分号终止该语句。\n\
    \n下面是一个简单的 PHP 文件示例，其中包含一个使用 PHP 函数（内置函数）`echo` 输出文本 \"Hello World!\" 的 PHP 脚本：\n\
    \n```html\n<html> \n<head> \n<title>My First PHP Page</title> \n</head> \n<body>\
    \ \n<?php \necho \"Hello World!\"; \n?> \n</body> \n</html>\n```\n\n显示：\n\nHello\
    \ World!\n\n## PHP 中的注释\n\nPHP 代码中的注释是一行不会作为程序的一部分执行的代码。其目的是供编辑代码的人阅读。\n\nPHP\
    \ 支持三种表达注释的形式或方式。\n\n注释有以下用途：\n\n- 提醒自己做了什么 - 大多数程序员都有过回头查看自己注释的经历，这能让你想起写代码时的想法\n\
    - 让他人了解你在做什么 - 注释能让其他程序员理解你的每一个步骤\n\n`// This is a single line comment`\n\n`\\\
    # This is also a single line comment`\n\n```\n/*\nThis is a multiple lines comment\
    \ block that spans over more than one line\n*/\n```\n\n## PHP 中的大小写敏感性\n\n在 PHP\
    \ 中，所有变量都区分大小写。\n\n下一章将详细讨论变量。\n\n在下面的示例中，只有第一条语句会显示 `$pet` 变量的值（因为 `$pet`、`$PeT`\
    \ 和 `$PET` 被视为三个完全不同的变量）：\n\n示例\n\n```html\n<html> \n<body> \n<?php \n$pet=\"\
    cat\"; \necho \"My animal is a \" . $pet . \"<br>\"; \necho \"My animal is a \"\
    \ . $PeT . \"<br>\"; \necho \"My animal is a \" . $PET. \"<br>\"; \n?> \n</body>\
    \ \n</html>\n```\n\n在 PHP 中，所有用户定义的函数、关键字和类都不区分大小写。\n\n在下面的示例中，下面的两条 `echo` 语句都是合法的：\n\
    \n示例\n\n```html\n<html> \n<body> \n<?php \necho \"Hello World!<br>\"; \nECHO \"\
    Hello World!<br>\";\n?> \n</body> \n</html>\n```\n\n## 空格\n\n在 HTML 中，PHP 语句之间的空格会被忽略。这意味着可以有一行\
    \ PHP 代码，然后在下一行 PHP 代码之前有 2 行或更多空行。因此，您可以缩进代码，PHP 解释器也会忽略这些空格。\n\n下面是一个详细的示例：\n\
    \n```html\n<html> \n<head> \n<title>My First PHP Page</title> \n</head> \n<body>\
