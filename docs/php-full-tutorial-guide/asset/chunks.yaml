    `$_SERVER[''SCRIPT_FILENAME'']`


    Returns the absolute pathname of the currently executing script


    `$_SERVER[''SERVER_ADMIN'']`


    Returns the value given to the SERVER_ADMIN directive in the web server configuration
    file (if your script runs on a virtual host, it will be the value defined for
    that virtual host) (such as someone@w3scholls.com)


    `$_SERVER[''SERVER_PORT'']`


    Returns the port on the server machine being used by the web server for communication
    (such as 80)


    `$_SERVER[''SERVER_SIGNATURE'']`


    Returns the server version and virtual host name which are added to server-generated
    pages


    `$_SERVER[''PATH_TRANSLATED'']`


    Returns the file system based path to the current script


    `$_SERVER[''SCRIPT_NAME'']`


    Returns the path of the current script


    `$_SERVER[''SCRIPT_URI'']`


    Returns the URI of the current page


    ## `$_REQUEST`


    PHP `$_REQUEST` is used to collect data after submitting an HTML form.


    The example below shows a form with an input field and a submit button. When a
    user submits the data by clicking on "Submit", the form data is sent to the file
    specified in the action attribute of the `<form>` tag. In this example, we point
    to this file itself for processing form data. If you wish to use another PHP file
    to process form data, replace that with the filename of your choice. Then, we
    can use the super global variable `$_REQUEST` to collect the value of the input
    field:


    Example


    ```html

    <html>


    <body>


    <form method="post" action="<?php echo $_SERVER[''PHP_SELF''];?>"> Name: <input
    type="text" name="name">


    <input type="submit">


    </form>


    <?php


    $name = $_REQUEST[''fname''];


    echo $name;


    ?>


    </body>


    </html>

    ```


    # Chapter 10:SESSIONS


    ## Sessions overview


    As a website becomes more sophisticated, so must the code that backs it. When
    you get to a stage where your website need to pass along user data from one page
    to another, it might be time to start thinking about using PHP sessions.


    A normal HTML website will not pass data from one page to another. In other words,
    all information is forgotten when a new page is loaded. This makes it quite a
    problem for tasks like a shopping cart, which requires data(the user''s selected
    product) to be remembered from one page to the next.


    A PHP session solves this problem by allowing you to store user information on
    the server for later use (i.e. username, shopping cart items, etc). However, this
    session information is temporary and is usually deleted very quickly after the
    user has left the website that uses sessions.


    It is important to ponder if the sessions'' temporary storage is applicable to
    your website. If you require a more permanent storage you will need to find another
    solution, like a MySQL database.


    Sessions work by creating a unique identification (UID) number for each visitor
    and storing variables based on this ID. This helps to prevent two users'' data
    from getting confused with one another when visiting the same webpage.


    Note:If you are not experienced with session programming it is not recommended
    that you use sessions on a website that requires high-security, as there are security
    holes that take some advanced techniques to plug.


    ## Starting a session


    Before you can begin storing user information in your PHP session, you must first
    start the session. When you start a session, it must be at the very beginning
    of your code, before any HTML or text is sent.


    Below is a simple script that you should place at the beginning of your PHP code
    to start up a PHP session.


    PHP Code:


    ```php

    <?php


    session_start(); // start up your PHP session!


    ?>

    ```


    This tiny piece of code will register the user''s session with the server, allow
    you to start saving user information and assign a UID (unique identification number)
    for that user''s session.


    ## Storing a session variable


    When you want to store user data in a session use the `$_SESSION` associative
    array. This is where you both store and retrieve session data. In previous versions
    of PHP there were other ways to perform this store operation, but it has been
    updated and this is the correct way to do it.


    PHP Code:


    ```php

    <?php


    session_start();


    $_SESSION[''views''] = 1; // store session data


    echo "Pageviews = ". $_SESSION[''views'']; //retrieve data


    ?>

    ```


    Display:


    Pageviews = 1


    In this example we learned how to store a variable to the session associative
    array `$_SESSION` and also how to retrieve data from that same array.


    ## Using PHP''s isset Function


    Now that you know can easily store and retrieve data from the `$_SESSION` array,
    we can now explore some of the real functionality of sessions. When you create
    a variable and store it in a session, you probably want to use it in the future.
    However, before you use a session variable it is necessary that you check to see
    if it exists already!


    This is where PHP''s `isset` function comes in handy, `isset` is a function that
    takes any variable you want to use and checks to see if it has been set. That
    is, it has already been assigned a value.


    With our previous example, we can create a very simple pageview counter by using
    `isset` to check if the pageview variable has already been created. If it has
    we can increment our counter. If it doesn''t exist we can create a pageview counter
    and set it to one. Here is the code to get this job done:


    PHP Code:


    ```php

    <?php


    session_start();


    if(isset($_SESSION[''views'']))


    $_SESSION[''views''] = $_SESSION[''views'']+ 1;


    else


    $_SESSION[''views''] = 1;


    echo "views = ". $_SESSION[''views''];


    ?>

    ```


    The first time you run this script on a newly opened browser the if statement
    will fail because no session variable views would have been stored yet. However,
    if you were to refresh the page the if statement would be true and the counter
    would increment by one. Each time you reran this script you would see an increase
    in view by one.


    ## Destroying a Session


    Although a session''s data is temporary and does not require that you explicitly
    clean after yourself, you may wish to delete some data for your various tasks.


    Imagine that you were running an online business and a user used your website
    to buy your goods. The user has just completed a transaction on your website and
    you now want to remove everything from their shopping cart.


    PHP Code:


    ```php

    <?php


    session_start();


    if(isset($_SESSION[''cart'']))


    unset($_SESSION[''cart'']);


    ?>

    ```


    You can also completely destroy the session entirely by calling the `session_destroy`
    function.


    PHP Code:


    ```php

    <?php


    session_start();


    session_destroy();


    ?>

    ```


    Destroy will reset your session, so don''t call that function unless you are entirely
    comfortable losing all your stored session data!


    ## Session remarks


    Cookies have been around for quite some time on the internet. They were invented
    to allow webmaster''s to store information about the user and their visit on the
    user''s computer.


    At first they were feared by the general public because it was believed they were
    a serious privacy risk.


    Nowadays nearly everyone has cookies enabled on their browser, partly because
    there are worse things to worry about and partly because all of the "trustworthy"
    websites now use cookies.


    This lesson will teach you the basics of storing a cookie and retrieving a cookie,
    as well as explaining the various options you can set with your cookie.


    # Chapter 11:COOKIES


    ## Creating a cookie


    When you create a cookie, using the function `setcookie`, you must specify three
    arguments. These arguments are `setcookie(name, value, expiration)`:


    1. name: The name of your cookie. You will use this name to later retrieve your
    cookie, so don''t forget it!


    2. value: The value that is stored in your cookie. Common values are username(string)
    and last visit(date).

