    \ for the Python APIs created for the deep learning technologies in SAS Viya.\
    \ DLPy provides many prebuilt models, including VGG and ResNet. The pretrained\
    \ weights using ImageNet data are also provided for those models. This would give\
    \ you a warm start on your favorite task via transfer learning.\n\nDemonstration:\
    \ Using DLPy to Access SAS Deep Learning Technologies: Part 1\n\nThis demonstration\
    \ uses DLPy to create and manipulate training image data sets for use with CNN-based\
    \ object-detection models. The learning objective is to understand how you can\
