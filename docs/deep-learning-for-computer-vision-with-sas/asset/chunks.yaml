  trans: "\n\n# 池化层 (Pooling Layers)\n\n池化函数提供了输入信息某些局部区域的摘要。SAS 提供三种摘要选项：最大值（Maximum）、平均值（Average）和最小值（Minimum）。与卷积层类似，池化层也使用过滤器，但这些过滤器用于确定要总结的区域，不包含可学习的权重。与池化过滤器相关的超参数包括\
    \ `width`（宽度）、`height`（高度）和 `stride`（步长）。不需要指定池化过滤器的数量，因为数量由输入的二维网格数量决定。在 CNN\
    \ 架构中，在连续的卷积层之间定期插入池化层是常见的。尽管 Springenberg 等人证明了用卷积层替换池化层取得了巨大成功，并利用较大的步长对信息进行下采样（Springenberg\
    \ et al., 2015）。例如，使用过滤器大小为 2 x 2 步长为 2 的池化层或卷积层会将输入信息减少 75%。因此，`stride` 会激进地缩小网络。\n\
    \n生成每个局部区域的摘要还有一个额外好处，使得输出对输入中的微小偏差具有近似不变性。也就是说，当建模者更关注对象是否存在而非其精确位置时，池化函数是非常有用的。相反，如果空间差异非常重要，则应该谨慎使用池化，甚至不使用（Goodfellow,\
    \ Bengio, and Courville 2017）。\n\n使用较大的 `stride` 值进行池化也可以适用于输入信息大小可能变化的情况。考虑一种场景：你正在分类两种尺寸图像：128\
    \ x 128 和 192 x 192。每种图像尺寸将拥有其自己的输入层，较大的图像可以使用 `stride` 大于 1 的池化层进行下采样，以匹配较小的输入尺寸。对较大的信息进行下采样很重要，因为输出层要求信息的大小相同。\n\
    \n超参数 `Width` 和 `Height` 设置了邻域的大小，如图 2.16 所示。\n\n### 图 2.16：池化层\n\n![](img/Image1039.jpg)\n\
    \n每个池化函数都总结所检查的邻域。`POOL=` 用于指定池化层使用的摘要类型。这是一个示例：\n\n```\nlayer={type=’POOL’ width=2\
    \ height=2 stride=2 pool=”max”\n```\n\n与卷积层一样，`stride` 参数控制邻域的移动尺寸。邻域持续跨越输入空间，直到整个空间都被总结，如图\
    \ 2.17 和 2.18 所示。\n\n### 图 2.17：步长 = 2 的特征图\n\n![](img/Image1047.jpg)\n\n### 图\
    \ 2.18：完成的特征图\n\n![](img/Image1058.jpg)\n\n# 传统层 (Traditional Layers)\n\n## 全连接层\
    \ (Fully Connected Layer)\n\n全连接层中的神经元与上一层中的所有激活值都有全连接，如普通的神经网络所示。因此，它们的激活值可以通过矩阵乘法后接偏置偏移来计算。全连接层包含了大量的参数，因此训练成本很高。\n\
    \n## 输出层 (Output Layer)\n\n输出层本质上是一个与特定误差函数相关的全连接层。在二分类目标这种情况下，交叉熵误差函数\n\n![](img/Image1065.png)\n\
    \n简化为等效的伯努利误差函数：\n\n![](img/Image1073.png)\n\n如果目标结果有超过两个级别，则误差函数解析为\n\n![](img/Image10801.png)\n\
    \n其中 ![](img/Image1087.png) 是观测值的类别标签 ![](img/Image1095.png)。\n\n如果目标是二分类，则使用\
    \ logistic 激活函数：\n\n![](img/Image1103.png)，其中 ![](img/Image1112.png)\n\nlogistic\
    \ 激活函数将其输出限制在 0:1 的范围内，使其成为生成概率估计 (![](img/Image1123.png)) 的理想选择。统计学中，logistic\
    \ 函数广为人知的 logit-link 函数：\n\n![](img/Image1135.png)= ln(odds)\n\n如果你正在拟合多项分类目标，则\
    \ softmax 激活函数（见下文）是合适的。它是广义 logit-link 函数的反函数。\n\n![](img/Image1142.png)\n\n\
    由于 softmax 将每个神经元的输出激活值除以所有参与神经元的输出之和，它确保了估计值之和为 1。这产生了一种分布效应。\n\n# 跳跃层连接类型 (Types\
    \ of Skip-Layer Connections)\n\n用于图像分类的深度卷积神经网络利用增加堆叠层数来丰富特征的能力。然而，添加更多层有时会导致网络早期学习的信息由于梯度消失而被遗忘。归一化技术（如批标准化）成功地抑制了剧烈的梯度波动，在很大程度上解决了收敛问题。此外，添加跳跃层连接可以帮助神经网络记住结构早期学习的潜在特征。跳跃层连接的可视化如图\
    \ 2.19 所示。\n\n### 图 2.19：跳跃层连接\n\n![](img/Image1150.jpg)\n\n拼接层（Concatenation）和残差层（Residual）可以用于创建跳跃层连接。拼接层可用于跳跃层连接（见图\
    \ 2.20），但拼接操作会导致“胖”网络，处理成本很高。\n\n```\nAddLayer / model=’ModelName’ name=’LayerName’\
    \ layer={type=’concat’}  \n           srcLayers={‘A’,’B’,’C’,’D’};\n```\n\n###\
    \ 图 2.20：拼接层\n\n![](img/Image158.jpg)\n\n残差层由 Kaiming 等引入，作为一种结合跳跃层连接的方法，如图 2.21\
    \ 所示。残差层通过相加而非拼接来“瘦身”网络。使用 `TYPE=RESIDUAL` 添加残差层。\n\n```\nAddLayer / model=’ModelName’\
    \ name=’LayerName’  \n           srcLayers={‘A’,’B’,’C’,’D’};\n```\n\n### 图 2.21：残差层\n\
    \n![](img/Image167.jpg)\n\n## 演示：加载和准备数据\n\n此演示说明如何使用 action set 加载和准备数据。\n\n\
    1. 打开程序 `DL2D01.sas` 查看代码编辑器中的程序内容。首先加载 Image action set，并创建描述图像的元数据表。`loadImages`\
    \ action 将图像和相关的元数据读入内存。`loadImages` action 可以从各种来源上传信息，包括\n\n- 摄影图像\n- 医学图像文件（包括\
    \ DICOM 格式）\n- ZIP 文件\n- 包含图像或 ZIP 文件的目录\n- 包含一系列摄影或医学图像的目录\n- 包含上述任何项目的目录树\n\
    - URL\n- 包含上述项目组合的列表\n\n输出包含 CAS 表格形式的编码或解码格式图像，取决于输入参数 `decode` 的值。当此参数设置为 False（默认值）时，输出表具有以下列\n\
    \n- `_id_`: 每个图像唯一的整数\n- `_path_`: 图像的完整路径\n- `_image_`: 包含整个文件的二进制大型对象\n- `_size_`:\
    \ `_image` 列中二进制大型对象的字节长度\n- `_type_`: 指定图像格式的三字符字符串（例如，JPG 图像为 `jpg`）\n\n当 `decode`\
    \ 参数设置为 True 时，`_image` 列包含解压缩后的图像数据，输出表具有这些额外列\n\n- `_dimension_`: 图像的维度（例如，二维图像为\
    \ 2，三维图像为 3）\n\n"
