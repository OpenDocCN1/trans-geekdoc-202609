    \ ***/\n```\n\n```\nrun;\n```\n\nThe probability threshold value is set to 15%\
    \ in the example code above. This means that a candidate prediction, ![](image/Image913.png)(anchor\
    \ box), should have at least a predicted probability of 15% to be considered.\n\
    \nCandidate predictions that meet or exceed the posterior threshold are then assessed\
    \ using the intersection over union (IOU) between the candidate prediction and\
    \ the actual bounding box (ground truth). Candidate predictions that meet or exceed\
    \ the IOU threshold set by the IOUTHRESHOLD= property become predictions.\n\n\
    Here is an example of IOUTHRESHOLD = implementation in the ADDLAYER statement:\n\
    \n```\nAddLayer / model=’ObjectDetection’\n```\n\n```\n           name=’output_object_dectect’\
    \ layer={type=’detection’\n```\n\n```\n           coordScale = 5\n```\n\n```\n\
    \           objectScale = 1\n```\n\n```\n           predictionNotAObjectScale\
    \ = .25\n```\n\n```\n           classScale = 1\n```\n\n```\n           detectionThreshold\
    \ = 0.15\n```\n\n```\n           iouThreshold = 0.1\n```\n\n```\n /***Remaining\
    \ code not shown but will be displayed as topics are introduced later in the chapter\
    \ ***/\n```\n\n```\nrun;\n```\n\nThe IOU threshold value is set to 10% in the\
    \ example code above. This means that a candidate prediction, ![](image/Image913.png)(anchor\
    \ box), should have at least an IOU value of 10% to become a prediction.\n\nThe\
    \ appropriate number of anchor boxes and the size of the boxes is perhaps best\
    \ determined empirically. Clustering algorithms applied to the training data guide\
    \ the user to an appropriate number and size of anchor boxes. Prior sizes can\
    \ be determined empirically through clustering on the pixel width and pixel height\
    \ of actual bounding boxes. Average width and height for each cluster should be\
    \ downsampled equivalently to that of the original image. For example, going from\
