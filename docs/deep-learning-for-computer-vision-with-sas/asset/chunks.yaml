    \ increases the model’s awareness of objects at the cost of an increased false\
    \ detection rate. The scalar is adjusted using the `OBJECTSCALE=` option in the\
    \ object detection layer created by the last `ADDLAYER` statement.\n\nHere is\
    \ an example of `OBJECTSCALE=` implementation in the `ADDLAYER` statement:\n\n\
    ```\nAddLayer / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’\
    \ layer={type=’detection’\n```\n```\n           coordScale = 5\n```\n```\n   \
    \        objectScale = 1\n```\n```\n /***Remaining code not shown but will be\
    \ displayed as topics are introduced later in the chapter ***/\n```\n```\nrun;\n\
    ```\n\nIncreasing encourages the model to be more cautious when detecting objects.\
    \ Objects that exist in the picture are more likely to be missed if a large value\
    \ is assigned to the scalar.\n\nThe scalar is adjusted using the `PREDICTIONNOTAOBJECTSCALE=`\
    \ option in the object detection layer created by the last `ADDLAYER` statement.\n\
    \nHere is an example of `PREDICTIONNOTAOBJECTSCALE=` implementation in the `ADDLAYER`\
    \ statement:\n\n```\nAddLayer / model=’ObjectDetection’\n```\n```\n          \
    \ name=’output_object_dectect’ layer={type=’detection’\n```\n```\n           coordScale\
    \ = 5\n```\n```\n           objectScale = 1\n```\n```\n           predictionNotAObjectScale\
    \ = .25\n```\n```\n /***Remaining code not shown but will be displayed as topics\
    \ are introduced later in the chapter ***/\n```\n```\nrun;\n```\n\nIncreasing\
    \ encourages the model to pay more attention to correctly predicting the object,\
    \ as opposed to the location of the object within the image. The scalar is adjusted\
    \ using the `CLASSSCALE=` option in the object detection layer created by the\
    \ last `ADDLAYER` statement.\n\nHere is an example of `CLASSSCALE=` implementation\
    \ in the `ADDLAYER` statement:\n\n```\nAddLayer / model=’ObjectDetection’\n```\n\
    ```\n           name=’output_object_dectect’ layer={type=’detection’\n```\n```\n\
    \           coordScale = 5\n```\n```\n           objectScale = 1\n```\n```\n \
    \          predictionNotAObjectScale = .25\n```\n```\n           classScale =\
    \ 1\n```\n```\n /***Remaining code not shown but will be displayed as topics are\
    \ introduced later in the chapter ***/\n```\n```\nrun;\n```\n\nNote: `CLASSSCALE=`\
    \ should be set to zero if the business need is to detect a single object. That\
    \ is, no objects are competing for the model’s attention.\n\n### Anchor Boxes\n\
    \nAn anchor box provides a candidate set of starting points for bounding box predictions.\
    \ Including multiple anchor boxes of varying sizes decreases the need for the\
    \ optimization process to adjust the bounding box coordinates because the chances\
    \ of having a starting box that closely matches an object increases. This means\
    \ that there is a reduction in significant swings and starting error.\n\nEach\
    \ anchor box is itself a candidate prediction. The candidate prediction (anchor\
    \ box) must satisfy two criteria to become an actual prediction. First, the predicted\
    \ probability of being an object for prediction should be greater or equal to\
    \ the threshold value set by the `DETECTIONTHRESHOLD=` property.\n\nHere is an\
    \ example of `DETECTIONTHRESHOLD=` implementation in the `ADDLAYER` statement:\n\
    \n```\nAddLayer / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’\
    \ layer={type=’detection’\n```\n```\n           coordScale = 5\n```\n```\n   \
    \        objectScale = 1\n```\n```\n           predictionNotAObjectScale = .25\n\
    ```\n```\n           classScale = 1\n```\n```\n           detectionThreshold =\
    \ 0.15\n```\n```\n /***Remaining code not shown but will be displayed as topics\
    \ are introduced later in the chapter ***/\n```\n```\nrun;\n```\n\nThe probability\
    \ threshold value is set to 15% in the example code above. This means that a candidate\
    \ prediction (anchor box), should have at least a predicted probability of 15%\
    \ to be considered.\n\nCandidate predictions that meet or exceed the threshold\
    \ are then assessed using the intersection over union (IOU) between the candidate\
    \ prediction and the actual bounding box (ground truth). Candidate predictions\
    \ that meet or exceed the IOU threshold set by the `IOUTRESHOLD=` property become\
    \ predictions.\n\nHere is an example of `IOUTRESHOLD=` implementation in the `ADDLAYER`\
    \ statement:\n\n```\nAddLayer / model=’ObjectDetection’\n```\n```\n          \
    \ name=’output_object_dectect’ layer={type=’detection’\n```\n```\n           coordScale\
    \ = 5\n```\n```\n           objectScale = 1\n```\n```\n           predictionNotAObjectScale\
    \ = .25\n```\n```\n           classScale = 1\n```\n```\n           detectionThreshold\
    \ = 0.15\n```\n```\n           iouThreshold = 0.1\n```\n```\n /***Remaining code\
    \ not shown but will be displayed as topics are introduced later in the chapter\
    \ ***/\n```\n```\nrun;\n```\n\nThe IOU threshold value is set to 10% in the example\
    \ code above. This means that a candidate prediction (anchor box), should have\
    \ at least an IOU value of 10% to become a prediction.\n\nThe appropriate number\
    \ of anchor boxes and the size of the boxes is perhaps best determined empirically.\
    \ Clustering algorithms applied to the training data guide the user to an appropriate\
    \ number and size of anchor boxes. Prior sizes can be determined empirically through\
    \ clustering on the pixel width and pixel height of actual bounding boxes. Average\
    \ width and height for each cluster should be downsampled equivalently to that\
    \ of the original image. For example, going from a 416 x 416 image to a 13 x 13\
    \ tensor means that the data has been downsampled by a factor of 32.\n\nSAS software\
    \ includes a rich set of clustering algorithms for grouping to the height and\
    \ width of the labeled boxes. The average height and width of each group should\
    \ be divided by the same amount for which the model downsampled the image. For\
    \ example, a 416 x 416 image that has been downsampled to 13 x 13 has been decreased\
    \ by a factor of 32. The `ANCHORS=` property specifies the number and size of\
    \ the anchor boxes. Two numeric values are required for each anchor box. The first\
    \ value represents the width of the anchor box, and the second value represents\
    \ the height of the same box.\n\nHere is an example of `ANCHORS=` implementation\
    \ in the `ADDLAYER` statement:\n\n```\nAddLayer / model=’ObjectDetection’\n```\n"
  trans: "\n标量（Scalars）用于通过强调特定预测而非其他预测来微调预测。例如，《You Only Look Once: Unified, Real-Time\
    \ Object Detection》的作者发现，置信度预测得分被向零压缩，因为不包含对象的网格数量远大于包含对象的网格数量。因此，作者使用了较低的标量（即\
    \ 0.5）来抵消大多数网格单元缺乏对象的问题。作者进一步通过较高的标量（即 5）来调整预测，以增加边界框预测的权重（Redmon et al. 2016）。\n\
    \n在多损失误差函数中更改标量会强制模型在各种预测任务之间进行权衡。例如，增加 `COORDSCALE` 会导致优化过程强调边界框的预测，而以削弱置信度和分类预测为代价。该标量通过最后一个\
    \ `ADDLAYER` 语句创建的目标检测层中的 `COORDSCALE=` 选项进行调整。\n\n以下是 `COORDSCALE=` 在 `ADDLAYER`\
    \ 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’\
    \ layer={type=’detection’\n```\n```\n           coordScale = 5\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示\
    \ ***/\n```\n```\nrun;\n```\n\n增加 `COORDSCALE` 会提高模型对对象的感知能力，但代价是误检率的增加。该标量通过最后一个\
    \ `ADDLAYER` 语句创建的目标检测层中的 `OBJECTSCALE=` 选项进行调整。\n\n以下是 `OBJECTSCALE=` 在 `ADDLAYER`\
    \ 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’\
    \ layer={type=’detection’\n```\n```\n           coordScale = 5\n```\n```\n   \
    \        objectScale = 1\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示 ***/\n```\n```\n\
    run;\n```\n\n增加 `PREDICTIONNOTAOBJECTSCALE` 会使模型在检测对象时更加谨慎。如果给标量分配较大的值，图片中存在的对象可能会被遗漏。\n\
    \n该标量通过最后一个 `ADDLAYER` 语句创建的目标检测层中的 `PREDICTIONNOTAOBJECTSCALE=` 选项进行调整。\n\n以下是\
    \ `PREDICTIONNOTAOBJECTSCALE=` 在 `ADDLAYER` 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n\
    ```\n```\n           name=’output_object_dectect’ layer={type=’detection’\n```\n\
    ```\n           coordScale = 5\n```\n```\n           objectScale = 1\n```\n```\n\
    \           predictionNotAObjectScale = .25\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示\
    \ ***/\n```\n```\nrun;\n```\n\n增加 `CLASSSCALE` 会鼓励模型更多关注正确预测对象，而不是对象在图像中的位置。该标量通过最后一个\
    \ `ADDLAYER` 语句创建的目标检测层中的 `CLASSSCALE=` 选项进行调整。\n\n以下是 `CLASSSCALE=` 在 `ADDLAYER`\
    \ 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’\
    \ layer={type=’detection’\n```\n```\n           coordScale = 5\n```\n```\n   \
    \        objectScale = 1\n```\n```\n           predictionNotAObjectScale = .25\n\
    ```\n```\n           classScale = 1\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示 ***/\n\
    ```\n```\nrun;\n```\n\n注意：如果业务需求是检测单个对象，则应将 `CLASSSCALE=` 设置为零。这意味着没有对象在竞争模型的注意力。\n\
    \n### 锚点框 (Anchor Boxes)\n\n锚点框为边界框预测提供了一组候选起点。包含多个不同尺寸的锚点框可以减少优化过程调整边界框坐标的需求，因为产生与对象紧密匹配的起始框的概率会增加。这意味着显著波动和起始误差的减少。\n\
    \n每个锚点框本身都是一个候选预测。候选预测（锚点框）必须满足两个标准才能成为实际预测。首先，预测为对象的概率应大于或等于由 `DETECTIONTHRESHOLD=`\
    \ 属性设置的阈值值。\n\n以下是 `DETECTIONTHRESHOLD=` 在 `ADDLAYER` 语句中的实现示例：\n\n```\nAddLayer\
    \ / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’\
    \ layer={type=’detection’\n```\n```\n           coordScale = 5\n```\n```\n   \
    \        objectScale = 1\n```\n```\n           predictionNotAObjectScale = .25\n\
    ```\n```\n           classScale = 1\n```\n```\n           detectionThreshold =\
    \ 0.15\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示 ***/\n```\n```\nrun;\n```\n\n上述代码中将概率阈值设置为\
    \ 15%。这意味着候选预测（锚点框）至少应具有 15% 的概率才会被考虑。\n\n达到或超过阈值的预测将通过候选预测与实际边界框之间的交并比（IOU）进行评估。达到或超过\
    \ `IOUTRESHOLD=` 属性设置的 IOU 阈值的预测将成为预测。\n\n以下是 `IOUTRESHOLD=` 在 `ADDLAYER` 语句中的实现示例：\n\
    \n```\nAddLayer / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’\
    \ layer={type=’detection’\n```\n```\n           coordScale = 5\n```\n```\n   \
    \        objectScale = 1\n```\n```\n           predictionNotAObjectScale = .25\n\
    ```\n```\n           classScale = 1\n```\n```\n           detectionThreshold =\
    \ 0.15\n```\n```\n           iouThreshold = 0.1\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示\
    \ ***/\n```\n```\nrun;\n```\n\n上述代码中将 IOU 阈值设置为 10%。这意味着候选预测（锚点框）至少应具有 10% 的 IOU\
    \ 值才能成为预测。\n\n锚点框的合适数量大小最好通过实验方法确定。应用于训练数据的聚类算法可以引导用户确定合适的锚点框数量和尺寸。先尺寸可以通过对边界框的像素宽度和高度进行聚类来实验确定。每个类的平均宽度和高度应对应原始图像进行等效下采样。例如，从\
    \ 416x416 图像变为 13x13 的张量意味着数据被下采样了 32 倍。\n\nSAS 软件包含了丰富的聚类算法用于根据框的高度和宽度进行分组。每组的平均高度和宽度应以模型缩小图像的相同比例除除。例如，416x416\
    \ 的图像缩小到 13x13 缩小了 32 倍。`ANCHORS=` 属性指定了锚点框的数量和尺寸。每个锚点框需要两个数值。第一个值代表锚点框的宽度，第二个值代表同一框的高度。\n\
    \n以下是 `ANCHORS=` 在 `ADDLAYER` 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n\
    ```\n"
