- raw: "Scalars (![](image/Image1141.png)) are used to fine-tune predictions by emphasizing\
    \ specific predictions over others. For example, the authors of You Only Look\
    \ Once: Unified, Real-Time Object Detection discovered that the prediction scores\
    \ for confidence were being pressured toward zero because the number of cells\
    \ not containing an object largely outnumbered the number of cells containing\
    \ an object. Therefore, the authors used a lower scalar for![](image/Image1148.png)(that\
    \ is, 0.5) to offset the lack of objects in most grid cells. The authors further\
    \ adjusted their predictions with a higher scalar for![](image/Image1156.png)(that\
    \ is, 5) to upweight bounding box predictions (Redmon et al. 2016).\n\nChanging\
    \ scalars in the multi-loss error function imposes on the model a tradeoff between\
    \ various perdition tasks. For example, increasing![](image/Image1156.png)causes\
    \ the optimization process to emphasize the prediction of the bounding box at\
    \ the sacrifice of de-emphasizing confidence and classification predictions. The![](image/Image1156.png)scalar\
    \ is adjusted using the COORDSCALE= option in the object detection layer created\
    \ by the last ADDLAYER statement.\n\nHere is an example of COORDSCALE= implementation\
    \ in the ADDLAYER statement:\n\n```\nAddLayer / model=’ObjectDetection’\n```\n\
    \n```\n           name=’output_object_dectect’ layer={type=’detection’\n```\n\n\
    ```\n           coordScale = 5\n```\n\n```\n /***Remaining code not shown but\
    \ will be displayed as topics are introduced later in the chapter ***/\n```\n\n\
    ```\nrun;\n```\n\nIncreasing ![](image/Image1178.png)increases the model’s awareness\
    \ of objects at the cost of an increased false detection rate. The ![](image/Image1178.png)scalar\
    \ is adjusted using the OBJECTSCALE= option in the object detection layer created\
    \ by the last ADDLAYER statement.\n\nHere is an example of OBJECTSCALE= implementation\
    \ in the ADDLAYER statement:\n\n```\nAddLayer / model=’ObjectDetection’\n```\n\
    \n```\n           name=’output_object_dectect’ layer={type=’detection’\n```\n\n\
    ```\n           coordScale = 5\n```\n\n```\n           objectScale = 1\n```\n\n\
    ```\n /***Remaining code not shown but will be displayed as topics are introduced\
    \ later in the chapter ***/\n```\n\n```\nrun;\n```\n\nIncreasing ![](image/Image1148.png)encourages\
    \ the model to be more cautious when detecting objects. Objects that exist in\
    \ the picture are more likely to be missed if a large value is assigned to the![](image/Image1148.png)scalar.\n\
    \nThe ![](image/Image1148.png)scalar is adjusted using the PREDICTIONNOTAOBJECTSCALE=\
    \ option in the object detection layer created by the last ADDLAYER statement.\n\
    \nHere is an example of PREDICTIONNOTAOBJECTSCALE= implementation in the ADDLAYER\
    \ statement:\n\n```\nAddLayer / model=’ObjectDetection’\n```\n\n```\n        \
    \   name=’output_object_dectect’ layer={type=’detection’\n```\n\n```\n       \
    \    coordScale = 5\n```\n\n```\n           objectScale = 1\n```\n\n```\n    \
    \       predictionNotAObjectScale = .25\n```\n\n```\n /***Remaining code not shown\
    \ but will be displayed as topics are introduced later in the chapter ***/\n```\n\
    \n```\nrun;\n```\n\nIncreasing ![](image/Image12231.png)encourages the model to\
    \ pay more attention to correctly predicting the object classification, as opposed\
    \ to the location of the object within the image. The ![](image/Image12351.png)scalar\
    \ is adjusted using the CLASSSCALE= option in the object detection layer created\
    \ by the last ADDLAYER statement.\n\nHere is an example of CLASSSCALE= implementation\
    \ in the ADDLAYER statement:\n\n```\nAddLayer / model=’ObjectDetection’\n```\n\
    \n```\n           name=’output_object_dectect’ layer={type=’detection’\n```\n\n\
    ```\n           coordScale = 5\n```\n\n```\n           objectScale = 1\n```\n\n\
    ```\n           predictionNotAObjectScale = .25\n```\n\n```\n           classScale\
    \ = 1\n```\n\n```\n /***Remaining code not shown but will be displayed as topics\
    \ are introduced later in the chapter ***/\n```\n\n```\nrun;\n```\n\nNote: CLASSSCALE=\
    \ should be set to zero if the business need is to detect a single object. That\
    \ is, no other objects are competing for the model’s attention.\n\nAnchor Boxes\n\
    \nAn anchor box provides a candidate set of starting points for bounding box predictions.\
    \ Including multiple anchor boxes of varying sizes decreases the need for the\
    \ optimization process to adjust the bounding box coordinates dramatically because\
    \ the chances of having a starting box that closely matches the box of an object\
    \ increases. This means that there is a reduction in significant gradient swings\
    \ and starting error is reduced.\n\nEach anchor box is itself a candidate prediction.\
    \ The candidate prediction (anchor box) must satisfy two criteria to become an\
    \ actual prediction. First, the predicted probability of being an object for prediction\
    \ in the cell![](image/Image1095.png)(![](image/Image991.png)) should be greater\
    \ than or equal to the prediction threshold property value set by the DETECTIONTHRESHOLD=\
    \ property.\n\nHere is an example of DETECTIONTHRESHOLD= implementation in the\
    \ ADDLAYER statement:\n\n```\nAddLayer / model=’ObjectDetection’\n```\n\n```\n\
    \           name=’output_object_dectect’ layer={type=’detection’\n```\n\n```\n\
    \           coordScale = 5\n```\n\n```\n           objectScale = 1\n```\n\n```\n\
    \           predictionNotAObjectScale = .25\n```\n\n```\n           classScale\
    \ = 1\n```\n\n```\n           detectionThreshold = 0.15\n```\n\n```\n /***Remaining\
