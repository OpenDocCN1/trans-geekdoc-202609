  trans: "\n\n## 层定义与注意事项\n\n### 层参考表\n\n| RECURRENT | 循环层 | `layer={type=’recurrent’\
    \ n=50 act=’sigmoid’ rnnType=’gru’}` |\n| TRANSCONVO | 转置卷积层 | `layer={type=’transconvon’\
    \ Filters=32 width=5 height=5 stride=2 act=’tanh’ }` |\n\n注意：书中未描述许多其他层，包括：`DETECTION`、`PROJECTION`、`FCMP`、`CLOSS`、`NASLAYER`、`SPLIT`、`CHANNELSHUFFLE`、`CLUSTER`、`FASTRCNN`、`GROUPCONVO`、`LAYERNORM`、`MASKRCNN`、`MHATTENTION`、`REGIONPROPOSAL`、`ROIALIGN`、`ROIPOOLING`、`SCALE`、以及等。`DETECTION`\
    \ 层用于目标检测，`FCMP` 层用于实现用户定义的激活函数和误差函数。`CLUSTER` 层用于 `DeepCluster` 并应连接到全连接层。其他层在\
    \ SAS 文档中有详细说明。\n\n## 训练深度学习 CAS 动作模型\n\n`dlTrain` 可用于训练深度学习模型。`dlTrain` 的参数可以在\
    \ SAS 文档中通过搜索“Deep Learning Action Set: Syntax”找到。以下带有参数的示例代码：\n\n```\nPROC CAS;\n\
    \   dlTrain /\n      table=’ CAS-libref.data-table ‘\n      modeltable= ‘ model\
    \ name, specified in buildmodel action ‘\n      bestweights={name= ‘Name of output\
    \ table containing best model weights’ }\n      inputs={‘ List of ALL input variables\
    \ ‘}\n      nominals={‘ List of nominal input variables ‘}\n      validtable={name=\
    \ ‘ Name of validation data table’ }\n      target={‘ list of target variables’};\n\
    Quit;\n```\n\n注意：在训练模型时，可以使用 `OPTIMIZER` 参数来指定优化算法设置、优化模式以及其他设置（如种子、最大迭代次数等）。\n\
    \n## 演示 1：使用传统神经网络方法加载和建模数据\n\n以下演示说明了如何使用传统的神经网络建模方法对数据进行建模。该神经网络将拥有七隐藏层，但无法充分区分数据中的目标事件和非事件。本演示使用了开发数据（develop\
    \ data）。这些数据已根据目标变量通过分层随机抽样分为三个数据集（训练集、验证集和测试集），描述如下。\n\n某银行开展了一项目标营销活动，旨在识别可能对变额养老（一种保险产品）营销活动做出反应的客户群体。每个数据集包含银行客户和描述每个客户的\
    \ 47 个输入。这 47 个输入变量代表三个月内的其他产品使用情况和人口统计数据。其中两个输入变量是名义标度的，其他是间隔或二分类的。二分类目标变量 `Ins`\
    \ 表示客户是否购买了变额养老产品。开发数据集中的变量列如下。\n\n### 表 1.4：开发数据集变量\n\n| 变量 | 描述 | 角色 | 级别 |\n\
    | --- | --- | --- | --- |\n| ATM | 使用过 ATM 服务 (1=是，0=否) | 输入 | 二分类 |\n| ATMAmt\
    \ | ATM 取款金额 | 输入 | 间隔型 |\n| AcctAge | 最旧账户的年龄（年） | 输入 | 间隔型 |\n| Age | 客户年龄（年）\
    \ | 输入 | 间隔型 |\n| Branch | 银行分支机构 (B1 – B19) | 拒绝 | 名义 |\n| CC | 有信用卡账户 (1=是，0=否)\
    \ | 输入 | 二分类 |\n| CCBal | 信用卡余额 | 输入 | 间隔型 |\n| CCPurc | 信用卡购买次数 | 输入 | 间隔型 |\n\
    | CD | 有定存 (1=是，0=否) | 输入 | 二分类 |\n| CDBal | 定存余额 | 输入 | 间隔型 |\n| CRScore | 信用评分\
    \ | 输入 | 间隔型 |\n| CashBk | 客户收到现金回扣次数 | 输入 | 间隔型 |\n| Checks | 支票数量 | 输入 | 间隔型\
    \ |\n| DDA | 支票账户 (1=是，0=否) | 输入 | 二分类 |\n| DDABal | 支票账户余额 | 输入 | 间隔型 |\n| Dep\
    \ | 存款次数 | 输入 | 间隔型 |\n| DepAmt | 存款金额 | 输入 | 间隔型 |\n| DirDep | 直接转存款 | 输入 | 间隔型\
    \ |\n| HMOwn | 拥有房屋 | 输入 | 二分类 |\n| HMVal | 房屋价值 | 输入 | 间隔型 |\n| ILS | 分期贷款 |\
    \ 输入 | 二分类 |\n| IRABal | 退休账户 | 输入 | 间隔型 |\n| InArea | 区域分类 | 输入 | 二分类 |\n| Inv\
    \ | 投资账户 | 输入 | 二分类 |\n| LOC | 信用额度 | 输入 | 二分类 |\n| LOCBal | 信用额度余额 | 输入 | 间隔型\
    \ |\n| MMBal | 货币市场基金 | 输入 | 间隔型 |\n| MMCred | 货币贷 | 输入 | 间隔型 |\n| MTGBal | 贷款余额\
    \ | 输入 | 间隔型 |\n| NSF | 资金不足发生 | 输入 | 二分类 |\n| NSFAmt | 资金不足金额 | 输入 | 间隔型 |\n\
    | POS | 销售交易次数 | 输入 | 间隔型 |\n| POSAmt | 销售交易金额 | 输入 | 间隔型 |\n| Phone | 电话银行次数\
    \ | 输入 | 间隔型 |\n| Res | 区域分类 | 拒绝 | 名义 |\n| SDB | 安全箱 | 输入 | 二分类 |\n| Sav | 储蓄账户\
    \ | 输入 | 二分类 |\n| Teller | 柜员服务次数 | 输入 | 间隔型 |\n\n### 步骤\n\n1. 打开浏览器窗口，导航到 SAS\
    \ Studio 并登录。\n2. 展开服务器文件和文件夹。\n3. 打开名为 `DLUS1D01a.sas` 的程序。程序将在编辑器中打开。首先，创建一个名为\
    \ `mycas` 的 caslib：\n```\nlibname mycas cas;\n```\n接下来，创建一个名为 `local` 的本地库：\n\
    ```\nlibname local ‘home/student/LWUS’;\n```\n然后，使用三个 DATA 步骤创建并在内存中保存数据集：\n```\n\
    data mycas.train_develop;\n   set local.train_develop;\nrun;\n\ndata mycas.valid_develop;\n\
    \   set local.valid_develop;\nrun;\n\ndata mycas.test_develop;\n   set local.test_develop;\n\
    run;\n```\n4. 运行程序。\n5. 打开名为 `DLUS1D01b.sas` 的程序。首先，使用 FREQ 过程探索开发数据验证部分的二分类结果分布：\n\
    ```\nproc freq data=mycas.Valid_develop;\n   table ins;\nrun;\n```\n接下来，使用 NNET\
    \ 过程创建一个七隐藏层前馈神经网络。使用有限内存 BFGS (L-BFGS) 算法调整网络参数：\n```\nproc nnet data=MYCAS.Train_DEVELOP\
    \ standardize=std;\n   target Ins / level=nominal;\n   input AcctAge DDABal CashBk\
    \ \n         Checks NSFAmt Phone \n         Teller SavBal ATMAmt \n         POS\
    \ POSAmt CDBal \n         IRABal LOCBal ILSBal \n         MMBal MMCred MTGBal;\n\
    ```\n\n"
