- raw: "In the batch variant of the gradient descent algorithm, generation of the\
    \ weight update vector is determined by using all of the examples in the training\
    \ set. That is, the exact gradient is calculated, ensuring a relatively smooth\
    \ progression to the error minima.\n\nHowever, when the training data set is large,\
    \ computing the exact gradient is computationally expensive. The entire training\
    \ data set must be assessed on each step down the gradient. Moreover, if the data\
    \ are redundant, the error gradient on the second half of the data will be almost\
    \ identical to the gradient on the first half. In this event, it would be a waste\
    \ of time to compute the gradient on the whole data set. You would be better off\
    \ computing the gradient on a subset of the weights, updating the weights, and\
    \ then repeating on a new subset. In this case, each weight update is based on\
    \ an approximation to the true gradient. But as long as it points in approximately\
    \ the same direction as the exact gradient, the approximate gradient is a useful\
    \ alternative to computing the exact gradient (Hinton 2007).\n\nTaken to extremes,\
    \ calculation of the approximate gradient can be based on a single training case.\
    \ The weights are then updated, and the gradient is calculated on the next case.\
    \ This is known as stochastic gradient descent (also known as online learning).\
    \ (See Figure 1.6.)\n\nFigure 1.6: Stochastic Gradient Descent\n\n![](image/Image1013.jpg)\n\
    \nStochastic gradient descent is very effective, particularly when combined with\
    \ a momentum term, δ(t-1):\n\n![](image/Eq_pg_10.jpg)\n\nBecause stochastic gradient\
    \ descent does not need to consider the entire training data set when calculating\
    \ each descent step’s gradient, it is usually faster than batch gradient descent.\
    \ However, because each iteration is trying to better fit a single observation,\
    \ some of the gradients might actually point away from the minima. This means\
    \ that, although stochastic gradient descent generally moves the parameters in\
    \ the direction of an error minima, it might not do so on each iteration. The\
    \ result is a more circuitous path. In fact, stochastic gradient descent does\
    \ not actually converge in the same sense as batch gradient descent does. Instead,\
    \ it wanders around continuously in some region that is close to the minima (Ng,\
    \ 2013).\n\nIntroduction to ADAM Optimization\n\nThe ADAM method applies adjustments\
    \ to the learned gradients for each individual model parameter in an adaptive\
    \ manner by approximating second-order information about the objective function\
    \ based on previously observed mini-batch gradients. The “adaptive movement” nature\
    \ of the algorithm’s movement is where the name ADAM comes from (Kingma and Ba,\
    \ 2014).\n\nThe ADAM method introduces two new hyperparameters to the mix, (![](image/Image1030.png))\
    \ and (![](image/Image1037.png)) where t represents the iteration count. A learning\
    \ rate that controls the originating step size is also included. The adjustable\
    \ beta terms are used to approximate a signal-to-noise ratio that is used to scale\
    \ the step size. When the approximated single-to-noise ratio is large, the step\
    \ size is closer to the originating step size (that of traditional stochastic\
    \ gradient descent).\n\nWhen the approximated single-to-noise ratio is small,\
    \ the step size is near zero. This is a nice feature because a lower single-to-noise\
    \ ratio is an indication of higher uncertainty. Thus, more cautious steps should\
    \ be taken in the parameter space (Kingma and Ba 2014).\n\nTo use ADAM, specify\
    \ ‘ADAM’ in the METHOD= suboption of the ALGORITHM= option in the OPTIMIZER parameter.\
    \ The suboptions for β1 and β2, as well as the α and other options, also need\
    \ to be specified. In the example code below, β1 = .9, β2 = .999 and α = .001.\n\
    \n```\noptimizer={algorithm={method=’ADAM’,\n```\n\n```\n                    \
    \               beta1=0.9,\n```\n\n```\n                                   beta2=0.999,\n\
    ```\n\n```\n                                   learningrate=.001,\n```\n\n```\n\
    \                                   lrpolicy=’Step’,\n```\n\n```\n           \
    \                        gamma=0.5},\n```\n\n```\n                           \
    \        minibatchsize=100,\n```\n\n```\n                                   maxepochs=200}\n\
    ```\n\nNote: The authors of ADAM recommend a β1 value of .9, a β2 value of .999,\
    \ and an α (learning rate) of .001.\n\nWeight Initialization\n\nDeep learning\
    \ uses different methods of weight initialization than traditional neural networks\
    \ do. In neural networks, the hidden unit weights are randomly initialized to\
    \ ensure that each hidden unit is approximating different areas of relationship\
    \ between the inputs and the output. Otherwise, each hidden unit would be approximating\
    \ the same relational variations if the weights across hidden units were identical,\
    \ or even symmetric. The hidden unit weights are usually randomly initialized\
    \ to some specified distribution, commonly Gaussian or Uniform.\n\nTraditional\
    \ neural networks use a standard variance for the randomly initialized hidden\
    \ unit weights. This can become problematic when there is a large amount of incoming\
    \ information (that is, a large number of incoming connections) because the variance\
    \ of the hidden unit will likely increase as the amount of incoming connections\
    \ increases. This means that the output of the combination function could be more\
    \ extreme, resulting in a saturated hidden unit (Daniely et al. 2017).\n\nDeep\
    \ learning methods use a normalized initialization in which the variance of the\
    \ hidden weights is a function of the amount of incoming information and outgoing\
    \ information. SAS offers several methods for reducing the variance of the hidden\
    \ weights. Xavier initialization is one of the most common weight initialization\
    \ methods used in deep learning. The initialization method is random uniform with\
    \ variance\n\n![](image/Image1044.png)\n\nwhere m is the number of input connections\
    \ (fan-in) and n is the number of output connections (fan-out) (hidden units in\
    \ current layer).\n\nOne potential flaw of the Xavier initialization is that the\
    \ initialization method assumes a linear activation function, which is typically\
    \ not the case in hidden units. MSRA was designed with the ReLU activation function\
    \ in mind because MSRA operates under the assumption of a nonzero mean output\
    \ by the activation, which is exhibited by ReLU (He et al. 2015). The MSRA initialization\
    \ method is random Gaussian distribution with a standardization of\n\n![](image/Image1051.png)\n\
    \nSAS includes a second variant of the MSRA, called MSRA2. Similar to the MSRA\
    \ initialization, the MSRA2 method is a random Gaussian distribution with a standardization\
    \ of\n\n![](image/Image1059.png)\n\nAnd it penalizes only for outgoing (fan-out)\
    \ information.\n\nNote: Weight initializations have less impact over model performance\
    \ if batch normalization is used because batch normalization standardizes information\
    \ passed between hidden layers. Batch normalization is discussed later in this\
    \ chapter.\n\nConsider the following simple example where unit y is being derived\
    \ from 25 randomly initialized weights. The variance of unit y is larger when\
    \ the standard deviation is held constant at 1. This means that the values for\
    \ y are more likely to venture into a saturation region when a nonlinear activation\
    \ function is incorporated. On the other hand, Xavier’s initialization penalizes\
    \ the variance for the incoming and outgoing connections, constraining the value\
    \ of y to less treacherous regions of the activation. See Figures 1.7 and 1.8,\
    \ noting that these examples assume that there are 25 incoming and outgoing connections.\n\
    \nFigure 1.7: Constant Variance (Standard Deviation = 1)\n\n![](image/Image1080.png)\n\
    \nFigure 1.8: Constant Variance (Standard Deviation =)\n\n![](image/Image1094.png)\n\
    \nRegularization"
