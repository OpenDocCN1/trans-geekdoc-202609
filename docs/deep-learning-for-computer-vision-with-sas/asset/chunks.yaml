    \n```\nAddLayer / model=’Tiny-Yolov2’ name=’ConVL1’ layer={type=’CONVO’ nFilters=1000\
    \ /*588*/  width=1 height=1 stride=1 act=’identity’ includeBias=FALSE} srcLayers={‘convo.9’};\n\
    ```\n"
