- raw: "Note: Concatenation layers require that the incoming feature maps be the same\
    \ size. It is a common practice to use pooling layers to down-sample larger feature\
    \ maps when combining feature maps of varying sizes.\n\n```\nAddLayer / model=’ConVNN’\
    \ name=’concatlayer2’\n           layer={type=’concat’} \n           srcLayers={‘PoolLayer1max’,’ConVLayer1e’};\n\
    ```\n\nf. The concatenation layer is then connected to another 2 x 2 pooling layer\
    \ with a stride of 2, max pooling layer.\n\n```\nAddLayer / model=’ConVNN’ name=’PoolLayer2max’\
    \ layer={type=’POOL’ \n           width=2 height=2 stride=2 pool=’max’}\n    \
    \       srcLayers={‘concatlayer2’};\n```\n\ng. A concatenation layer is used to\
    \ combine the pooling layer with the convolutional layer that is connected to\
    \ the input layer and uses a 6 x 6 filter.\n\n```\nAddLayer / model=’ConVNN’ name=’concatlayer3’\n\
    \           layer={type=’concat’}\n           srcLayers={‘PoolLayer2max’,’ConVLayer1f’};\n\
    ```\n\nh. The concatenation layer is then connected to another 2 x 2 pooling layer\
    \ with a stride of 2, max pooling layer.\n\n```\nAddLayer / model=’ConVNN’ name=’PoolLayer3max’\
    \ layer={type=’POOL’ \n           width=2 height=2 stride=2 pool=’max’}\n    \
    \       srcLayers={‘concatlayer3’};\n```\n\ni. The pooling layer is then connected\
    \ to a convolution layer with 64 filters. The convolution layer includes 3 x 3\
    \ filters that move across the input columns using a stride of 1. The MSRA2 is\
    \ used to initialize the weights. A dropout rate of 20% is also applied to the\
    \ convolution layer. Typically, the hidden bias would be removed, and the activation\
    \ function would be set to Identity before applying batch normalization. However,\
    \ in an attempt to show the flexibility of SAS, we have decided to not follow\
    \ conventional methods.\n\n```\nAddLayer / model=’ConVNN’ name=’ConVLayer1g’ layer={type=’CONVO’\n\
    \           nFilters=64 width=3 height=3 stride=1 init=’msra2’\n           dropout=.2}\
    \ srcLayers={‘concatlayer3’};\n```\n\n```\nAddLayer / model=’ConVNN’ name=’BatchLayer1’\n\
    \           layer={type=’BATCHNORM’ act=’ELU’}\n           srcLayers={‘ConVLayer1g’};\n\
    ```\n\nj. The normalized values are then passed to another convolution layer with\
    \ 128 filters. The convolution layer includes 3 x 3 filters that move across the\
    \ input columns using a stride of 2. MSRA2, batch normalization, and dropout are\
    \ also used in this convolution layer.\n\n```\nAddLayer / model=’ConVNN’ name=’ConVLayer1h’\
    \ layer={type=’CONVO’\n           nFilters=128 width=3 height=3 stride=2 init=’msra2’\n\
    \           dropout=.2} srcLayers={‘BatchLayer1’}; \n```\n\n```\nAddLayer / model=’ConVNN’\
    \ name=’BatchLayer2’\n           layer={type=’BATCHNORM’ act=’ELU’}\n        \
    \   srcLayers={‘ConVLayer1h’};\n```\n\nk. A concatenation layer is then used to\
    \ concatenate the convolutional layer with the last applied pooling layer.\n\n\
    ```\nAddLayer / model=’ConVNN’ name=’concatlayer4’\n           layer={type=’concat’}\n\
    \           srcLayers={‘PoolLayer3max’,’BatchLayer2’};\n```\n\nl. A fully connected\
    \ layer is then added with 240 neurons. Batch normalization and a dropout rate\
    \ of 65% are applied to the fully connected layer.\n\n```\nAddLayer / model=’ConVNN’\
    \ name=’FCLayer2’\n           layer={type=’FULLCONNECT’ n=240 act=’Identity’\n\
    ```\n\n```\n           init=’msra2’ dropout=.65 includeBias=False}  \n```\n\n\
    ```\n           srcLayers={‘concatlayer4’};  \n```\n\n```\nAddLayer / model=’ConVNN’\
    \ name=’BatchLayer3’\n```\n\n```\n           layer={type=’BATCHNORM’ act=’ELU’}\n\
    ```\n\n```\n           srcLayers={‘FCLayer2’};\n```\n\nm. Finally, the normalized\
    \ values are passed to the output layer from the previous fully connected layer.\n\
    \n```\nAddLayer / model=’ConVNN’ name=’outlayer’ layer={type=’output’\n      \
    \     act=’SOFTMAX’} srcLayers={‘BatchLayer3’};\n```\n\n```\nrun;\n```\n\nNote:\
    \ The model generated by the code above resembles Figure 2.22 below.\n\nFigure\
    \ 2.22: Model Generated by Code\n\n![](image/Image1184.png)\n\nFitting and Assessing\
    \ the Model\n\n1\\. The dlTrain action is called to train the model. The best\
    \ weights are stored in a data set named ConVbestweights. The model will also\
    \ be trained using a GPU instead of a CPU because of the large number of weights\
    \ in the specified model. In addition, the table containing the model’s performance\
    \ for each epoch is saved in a table named ObjectModeliter. This table is used\
    \ to create an iteration plot.\n\n```\nods output OptIterHistory=ObjectModeliter;\n\
    ```\n\n```\nproc cas;\n```\n\n```\n     dlTrain / table={name=’LargeImageDatashuffled’,\
    \ \n```\n\n```\n        where=’_PartInd_=1’} model=’ConVNN’ \n```\n\n```\n   \
    \     modelWeights={name=’ConVTrainedWeights_d’, replace=1}\n```\n\n```\n    \
    \    bestweights={name=’ConVbestweights’, replace=1}\n```\n\n```\n        inputs=’_image_’\
    \ \n```\n\n```\n        target=’_label_’ nominal={‘_label_’}\n```\n\n```\n   \
    \     GPU=True\n```\n\n```\n         ValidTable={name=’LargeImageDatashuffled’,\n\
    ```\n\n```\n                     where=’_PartInd_=2’} \n```\n\n```\n  optimizer={minibatchsize=60,algorithm={method=’ADAM’,\
    \         \n```\n\n```\n  lrpolicy=’Step’, gamma=0.6, stepsize=5, beta1=0.9, beta2=0.999,\n\
    ```\n\n```\n  learningrate=.01}maxepochs=60} \n```\n\n```\n  seed=12345\n```\n\
    \n```\n;\n```\n\n```\nrun;\n```\n\nThe remaining code creates two macro variables\
    \ that store the lowest misclassification values for the training and validation\
    \ data, respectively. PROC SGPLOT is called to plot out the iteration history\
    \ for the validation and training misclassification rates, and macro variables\
    \ containing the lowest misclassification values are used to label each curve.\n\
    \n```\nproc sql noprint;\n```\n\n```\nselect min(FitError)\n```\n\n```\n   into\
    \ :Train separated by ‘ ‘\n```\n\n```\n   from ObjectModeliter;\n```\n\n```\n\
    quit;\n```\n\n```\nproc sql noprint; \n```\n\n```\nselect min(ValidError)\n```\n\
    \n```\n   into :Valid separated by ‘ ‘ \n```\n\n```\n   from ObjectModeliter;\
    \ \n```\n\n```\nquit;\n```\n\n```\nproc sgplot data=ObjectModeliter;\n```\n\n\
    ```\n   yaxis label=’Misclassification Rate’;\n```\n\n```\n   series x=Epoch y=FitError\
    \ / CURVELABEL=”&Train” \n```\n\n```\n          CURVELABELPOS=END;\n```\n\n```\n\
    \   series x=Epoch y=ValidError / CURVELABEL=”&Valid”\n```\n\n```\n          CURVELABELPOS=END;\
    \ \n```\n\n```\n run;\n```\n\n2\\. View the results after the program finishes\
    \ running.\n\nScroll down in the Results window to the Model convnn Information\
    \ Details table (Figure 2.23). Notice that the model contains 801,974 parameters!\n\
    \nFigure 2.23: Model Convnn Information Details Table\n\n![](image/Image1192.jpg)\n\
    \nNext, scroll down to the Optimization History of Deep Learning Model for LARGEIMAGEDATASHUFFLED\
    \ table. The best performance on the validation occurred at epoch 52. The model\
    \ has a 23.73% misclassification rate on the validation data. Notice that there\
    \ is considerable divergence between the training and validation misclassification\
    \ rates. Perhaps a greater use of regularizations could push the validation error\
    \ rate down further. This could include increasing the dropout rate, applying\
    \ dropout to other layers, incorporating L1 or L2 regularizations, or generating\
    \ synthetic cases with carefully chosen random mutations, as seen in Figure 2.24.\n\
    \nFigure 2.24: Misclassification Rate\n\n![](image/Image1201.jpg)\n\nNote: Results\
    \ might vary due to the distribution of data and computation.\n\nThe iteration\
    \ plot in Figure 2.25 shows the performance of the model’s misclassification rates\
    \ on the training and validation data sets.\n\nFigure 2.25: Performance of Model’s\
    \ Misclassification Rates\n\n![](image/Image1212.png)\n\nScoring with the Fitted\
    \ Model\n\n1\\. Open the program named DLMS02D02b.sas. Now that we have our model,\
    \ it is time to score new data. The dlScore action is used to score the validation\
    \ data. Notice that the INITWEIGHTS= option specifies the best weights discovered\
    \ by the trained model (that is, the weights discovered in epoch 55).\n\n```\n\
    proc cas;\n```\n\n```\n   dlScore / table={name=’LargeImageDatashuffled’,\n  \
    \                  where=’_PartInd_=2’} model=’ConVNet’ \n```\n\n```\n       \
    \       initWeights=’ConVbestweights’\n```\n\n```\n              layerOut={name=’Layer_data’,\
    \ replace=1}\n```\n\n```\n              layers=’ConVLayer1’\n```\n\n```\n    \
    \          layerImageType=’JPG’\n```"
