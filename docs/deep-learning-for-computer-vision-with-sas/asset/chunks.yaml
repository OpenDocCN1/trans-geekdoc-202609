- raw: 'Choosing which layers to freeze depends on the problem at hand. If the task
    is identical from the source to the target (![](image/Image3305.png)), then sharing
    the layers closer to the output layer is sensible. In this scenario, the adaptable
    layers are those closer to the input layer. Conversely, the layers closer to the
    input layer should be frozen and the layers closer to the output left adaptable
    if the relevant information exists primarily in the inputs.


    Unsupervised Pretraining


    Autoencoders are unsupervised models that have been leveraged with some success
    for unsupervised pretraining. One benefit to an unsupervised method is that the
    source data do not need to be labeled. An unsupervised pretraining strategy usually
    begins by combining the features of the source and target data. An autoencoder
    is then trained on the full data with hopes of capturing information that persists
    across domains. This is most useful when the source data is abundant and the target
    data is limited. The trained autoencoder is then assigned to score (inference)
    the target data and encoded projections are extracted. These encoders are provided
    as inputs to the target learner, along with the original target features. Glorot
    et al. (2011) have shown success using stacked denoising autoencoders for unsupervised
    transfer learning.


    Denoising autoencoders were introduced by Vincent et al. (2010) as autoencoders
    that are trained on corrupted (perturbed) inputs. Corrupting the inputs can be
    as simple as applying dropout to the input layer. A popular variant of a denoising
    autoencoder is called a stacked denoising autoencoder.


    A stacked denoising autoencoder is greedily trained, layer by layer. Meaning,
    the first layer is thoroughly trained on the perturbed inputs and then frozen.
    The perturbed input is then replaced with the unperturbed input and the next layer
    is trained thoroughly. This layer is then frozen, and the process repeats until
    the output layer is trained.


    Another variant of autoencoders is known as sparse autoencoders. Sparse autoencoders
    incorporate a constraint on the objective function. L1 and L2 regularizations
    can be used as the constraining mechanisms to generate a sparse autoencoder.


    Customizations with FCMP


    Sometimes data scientists want to create custom functions for models to better
    fit a particular deep learning requirement that the available default functions
    cannot deliver. Deep learning tools in SAS enable you to use the SAS Function
    Compiler (FCMP) to create and modify your own custom definitions for deep neural
    network activation and error functions. FCMP is a programming tool that you can
    use with the deep learning actions in SAS to produce your own custom deep learning
    entities:


    ● activation functions


    ● error functions


    ● model layers


    ● learning rate policies


    Custom FCMP network layers, functions, and learning rate policies are separate
    entities that perform different deep learning tasks. The one common factor is
    that all of the custom layers, custom activation and error functions, and custom
    learning rate policies were created for use with SAS deep learning using FCMP.


    The parameters of the FCMP action can be found in the documentation.


    Tuning a Deep Learning Model


    Selecting Hyperparameters


    The quality of the predictive model that a machine learning algorithm creates
    depends on the values of various attributes that govern the training process and
    model structure. The parameters that represent these attributes are also known
    as hyperparameters. Searching the hyperparameter space of a deep neural network
    can be prohibitively expensive for genetic or Bayesian optimization methods, because
    these methods require training with each hyperparameter combination until convergence
    of the algorithm. Alternatively, the Hyperband method (Li et al. 2017) is a good
    approach for dense model structures, because resources are adaptively allocated
    to only those model structures that show promise.


    Sampling the Hyperparameter Space


    The dlTune action implements the Hyperband method and begins by selecting sets
    of hyperparameters using a Latin hypercube sample of the search space. A Latin
    hypercube sample is preferred over a simple random, which is considered the least
    intelligent sample search. (See Figure 3.29.)


    Figure 3.29: Simple Random Sample


    ![](image/Image3318.png)


    The Latin hypercube sample is a discrete sample that is uniform in each hyperparameter
    but random in combinations. These so-called low-discrepancy point sets attempt
    to ensure that points are approximately equidistant from one another in order
    to fill the space efficiently, as seen in Figure 3.30.


    Figure 3.30: Latin Hypercube Sample


    ![](image/Image3325.png)


    This sampling allows for convergence across the entire search range of each hyperparameter.
    It is more likely to find good values of each hyperparameter when compared to
    a simple random sample. The method is considered to yield a fairly uniform sampling
    of the space (Koch, et al. 2018).


    To avoid overfitting, a holdout sample is recommended to evaluate each set of
    hyperparameters. Each set of sampled hyperparameters is assigned to the specified
    model structure, and resources are allocated proportionally per the Hyperband
    method, as seen in Figure 3.31.


    Figure 3.31: Hyperband Tuning


    ![](image/Image3333.jpg)


    The models are then trained for one or several epochs, and their accuracy assessed.
    Poor performing models are then removed from the training process. The user can
    control the proportion of hyperparameter sets that are retained with the TUNERETENTION=
    option. See Figure 3.32.


    Figure 3.32: Hyperband Tuning Over One or Several Epochs


    ![](image/Image3340.jpg)


    The resources previously provided to the poor performing models are reallocated
    and distributed among the remaining models, as seen in Figure 3.33.


    Figure 3.33: Poor Performing Model Resource Reallocation


    ![](image/Image3348.jpg)


    The remaining models are then trained for one or several epochs, and their accuracy
    is assessed. The process is repeated until a champion set of hyperparameters remains
    (Figure 3.34).


    Figure 3.34: Champion Model


    ![](image/Image3355.jpg)


    Hyperparameter Selection


    You can tune the following hyperparameter values through DLTUNE:


    ● Learning rate


    ● Momentum rate


    ● Mini-batch size


    ● Learning rate reduction (gamma)


    ● Step size


    ● L1 Regularization


    ● L2 Regularization


    ● Dropout


    ● Beta1


    ● Beta2


    The dlTune action can search for optimal values amongst many important hyperparameters.
    Tuning the learning rate (or rates) is recommended for easy gains in model lift.
    Tuning the regularizations (L1, L2, and dropout) is recommended if the model performs
    significantly better on the training data than on the validation data.


    Note: When the gpu parameter is specified, the dlTune action uses graphical processing
    unit hardware to accelerate the dlTune action. You can identify GPU devices with
    0-based 64-bit integers. For example, devices={0, 2} requests that the first and
    the third GPU device be used. When the devices= option is not specified, the action
    uses all available GPU devices in the system.


    Hyperband Properties


    The following optimization property values affect the behavior of DLTUNE:


    ● MAXEPOCHS (Maximum epochs)


    ● TUNEITER (Tuning iterations)


    ● NUMTRIALS (Number of trials)


    ● TUNERETENTION


    ● TUNERESTART


    The MAXEPOCHS property specifies the number of epochs to perform on each hyperparameter
    combination before comparing validation errors and culling. The number of combinations
    culled is a function of the TUNERETENTION property.'
