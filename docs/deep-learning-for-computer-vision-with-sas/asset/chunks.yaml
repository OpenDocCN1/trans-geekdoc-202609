    ### 引言


    图像分类本身是一个检查通常构图良好的图像的任务，并以描述图像的分类概率作为响应。目标检测比图像分类更高级，因为目标检测分析复杂的图像，这些图像包含位于不同距离和位置、处于变化的且通常带有视觉噪声背景中的多种物体。物体可以出现在视觉帧内的任何位置，远近不等，并且相互重叠。（参见图
    4.1。）目标检测定位并分类物体，并确定这些物体的边界以及与其他物体的关系。


    图 4.1：物体分类


    ![](img/Image873.jpg)


    目标检测是一项挑战性任务，也是计算机视觉中最基础的任务之一。我们使用卷积神经网络（`CNNs`）来执行包括目标识别、目标定位和边界以及目标分类在内的任务。最近，类似的基于
    CNN 的深度学习算法成功解决了与目标检测任务相关的问题：


    *   只看一次 (YOLO)

    *   单次多框检测器 (SSD)

    *   区域建议网络 (R-CNN)

    *   快速区域建议网络 (Faster R-CNN)

    *   目标检测骨干特征提取器 (DETNet)


    ### 目标检测算法类型


    目标检测算法可以分为以下几类。第一类目标检测算法通过预定义尺寸和预定义位置锚框一步寻找物体。这些位置和固定尺寸是经过策略选择的，以覆盖尽可能多的场景。算法通常将原始图像分为固定大小的网格区域。对于每个区域，这些算法尝试使用特定的形状和大小预测固定数量的物体。这一类的算法被称为单阶段方法（single-stage
    methods）。单阶段算法示例包括 `YOLO`、`SSD` 和 `RetinaNet`。此类算法通常运行速度更快，但准确性可能较低。这类算法通常用于需要实时检测的应用。


    第二类目标检测算法是涉及两个步骤的区域建议（region proposals）。在区域建议阶段，使用传统的计算机视觉技术（如选择搜索）或基于深度学习的区域建议网络（`RPN`）选择极有可能包含物体的区域。在收集一组候选窗口后，可以使用特定数量的回归模型和分类模型来解决目标检测问题。这一类包括
    `Faster R-CNN`、`R-FCN` 和 `FPN-FRCN` 等算法。此类算法通常被称为双阶段方法（two-stage methods）。它们通常更准确，但往往比单阶段方法慢。


    SAS 中的深度学习工具支持两种代表性的目标检测算法：`YOLO` 和 `Faster R-CNN`。`YOLO` 是一种单阶段固定尺寸的目标检测算法。`Faster
    R-CNN` 是一种双阶段、基于区域建议的目标检测算法。


    单阶段目标检测器如 `YOLO` 单次分析图像，并输出多个物体位置和分类预测。因此，与 `R-CNNs` 等多阶段算法相比，`YOLO` 网络更快。`YOLO`
    架构在训练期间还能利用更大的上下文进行图像推理。


