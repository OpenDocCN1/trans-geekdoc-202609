- raw: "YOLO applies a single CNN to the full image and then divides the image into\
    \ regions (usually 13 x 13 grid cells). Then, for each region, YOLO predicts a\
    \ fixed number of bounding boxes and associated object classification probabilities.\
    \ Anchor boxes for each region provide pre-set values for predicted object sizes,\
    \ and the actual prediction gives a correction to the anchor boxes. Anchor boxes\
    \ are typically obtained for a given data set using k-means clustering. Final\
    \ detection results are obtained by applying threshold and non-maximum suppression\
    \ operations on the predictive probabilities.\n\nData Preparation and Prediction\
    \ Overview\n\nThe data from which the model now learns has expanded to include\
    \ information describing the spatial dynamics of an object or objects. Depending\
    \ on the format used, the predictions that describe an object’s location can be\
    \ presented in the following three ways:\n\n1\\. RECT: Use the RECT format for\
    \ coordinates \\[xleft, ytop, width, height\\] in image pixels\n\n2\\. YOLO: Use\
    \ the YOLO format for coordinates \\[xMiddle, yMiddle, width, height\\] in normalized\
    \ image size (obtained by dividing the coordinates by the image size)\n\n3\\.\
    \ COCO: Use the COCO format for coordinates \\[xmin, ymin, xmax, ymax\\] in image\
    \ pixels\n\nAn output variable describing the number of objects is included in\
    \ addition to the output variables describing an object’s location. This chapter\
    \ focuses on the YOLO format, which includes four normalized variables that depict\
    \ an object’s location. Normalizing the values ensures that resizing transformations\
    \ can be used with minimal loss of precision with regard to the target location.\n\
    \n● \\_Objectn\\_x corresponds to the normalized horizontal location of the object.\n\
    \n● \\_Objectn\\_y corresponds to the normalized vertical location of the object.\n\
    \n● \\_Objectn\\_width corresponds to the normalized width of the bounding box.\n\
    \n● \\_Objectn\\_height corresponds to the normalized height of the bounding box.\n\
    \nNon-Normalized Data\n\nIn some cases, the data provided are not normalized.\
    \ For example, consider a scenario where xmin, max, ymin, and ymax represent unnormalized\
    \ pixel values in an image with dimensions of 500 x 400. The normalized values\
    \ are calculated by dividing each x and y coordinate by the maximum value of the\
    \ respective plane (that is, xmin/500, xmax/500, ymin/400, and ymax/400).\n\n\
    The following equations transform the normalized xmin, xmax, ymin, and ymax values\
