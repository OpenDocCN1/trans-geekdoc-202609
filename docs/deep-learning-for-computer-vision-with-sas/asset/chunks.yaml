    \ cas;\n```\n\n```\n    table.fetch  /\n```\n\n```\n     table=”Tiny-Yolov2”\n\
    ```\n\n```\n    to=500;\n```\n\n```\n   loadactionset ‘deeplearn’;\n```\n\n```\n\
    \   loadactionset ‘image’;\n```\n\n```\n   loadactionset ‘table’;\n```\n\n```\n\
    quit;\n```\n\nFigure 5.3 shows the results.\n\nFigure 5.3: Model Table\n\n![](image/Image861.jpg)\n\
    \nThe model table defines the architecture of the model and can be altered to\
