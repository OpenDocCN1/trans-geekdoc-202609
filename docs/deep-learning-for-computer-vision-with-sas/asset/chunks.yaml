    \ layer includes 3 x 3 filters that move across the input columns using a stride\
    \ of 2. `MSRA2`, batch normalization, and dropout are also used in this convolution\
    \ layer.\n\n```\nAddLayer / model=’ConVNN’ name=’ConVLayer1h’ layer={type=’CONVO’\n\
    \           nFilters=128 width=3 height=3 stride=2 init=’msra2’\n           dropout=.2}\
    \ srcLayers={‘BatchLayer1’}; \n```\n\n```\nAddLayer / model=’ConVNN’ name=’BatchLayer2’\n\
    \           layer={type=’BATCHNORM’ act=’ELU’}\n           srcLayers={‘ConVLayer1h’};\n\
    ```\n\nk. A concatenation layer is then used to concatenate the convolutional\
    \ layer with the last pooling layer.\n\n```\nAddLayer / model=’ConVNN’ name=’concatlayer4’\n\
    \           layer={type=’concat’}\n           srcLayers={‘PoolLayer3max’,’BatchLayer2’};\n\
    ```\n\nl. A fully connected layer is then added with 240 neurons. Batch normalization\
    \ and a dropout rate of 65% are applied to the fully connected layer.\n\n```\n\
    AddLayer / model=’ConVNN’ name=’FCLayer2’\n           layer={type=’FULLCONNECT’\
    \ n=240 act=’Identity’\n           init=’msra2’ dropout=.65 includeBias=False}\
    \ \n           srcLayers={‘concatlayer4’};\n```\n\n```\nAddLayer / model=’ConVNN’\
    \ name=’BatchLayer3’\n           layer={type=’BATCHNORM’ act=’ELU’}\n        \
    \   srcLayers={‘FCLayer2’};\n```\n\nm. Finally, the normalized values are passed\
    \ to the `outlayer` from the previous fully connected layer.\n\n```\nAddLayer\
    \ / model=’ConVNN’ name=’outlayer’\n           layer={type=’output’\n        \
    \   act=’SOFTMAX’} srcLayers={‘BatchLayer3’};\n```\n\n```\nrun;\n```\n\nNote:\
    \ The model generated by code above resembles Figure 22 below.\n\nFigure 22: Model\
    \ Generated by Code\n(image/Image184.png)\n\n### Fitting and Assessing the Model\n\
    \n1. `dlTrain` is called to train the model. The best weights are stored in data\
    \ set `ConVbestweights`. The model will also be trained using GPU instead of CPU\
    \ because of the large number of weights. In addition, the table containing the\
    \ model’s performance for each epoch is saved in table `ObjectModeliter`. This\
    \ table is used to create an iteration plot.\n\n```\nods output IterHistory=ObjectModeliter;\n\
    ```\n\n```\nproc cas;\n```\n\n```\ndlTrain / table={name=’LargeImageDatashuffled’,\n\
    \            where='_PartInd_=1’} model=’ConVNN’ \n        modelWeights={name=’VTrainedWeights_d’,\
    \ replace=1}\n        bestweights={name=’ConVbestweights’, replace=1}\n      \
    \  inputs='_image_’ \n        target='_label_’ nominal={‘_label’}\n        GPU=True\n\
    \        ValidTable={name=’LargeImageDatashuffled’,\n                   where='_PartInd_=2’}\
    \ \n        optimizer={minibatchsize=60,algorithm={method=’ADAM’,\n        lrpolicy=’Step’,\
    \ gamma=0.6, stepsize=5, beta1=0.9, beta2=0.999,\n        learningrate=.01}maxepochs=60}\
    \ \n        seed=12345\n;\n```\n\n```\nrun;\n```\n\nThe remaining code creates\
    \ two macro variables that store the lowest misclassification values for the training\
    \ and validation data, respectively. `PROC SGPLOT` is called to plot out the iteration\
    \ history for the validation and training misclassification rates, and macro variables\
    \ containing the lowest misclassification values are used to label each curve.\n\
    \n```\nproc sql noprint;\n```\n\n```\nselect min(FitError)\n   into :Train separated\
    \ by ‘\n   from ObjectModeliter;\n```\n\n```\nquit;\n```\n\n```\nproc sql noprint;\
    \ \n```\n\n```\nselect min(ValidError)\n   into :Valid separated by ‘\n   from\
    \ ObjectModeliter;\n \n```\n\n```\nquit;\n```\n\n```\nproc sgplot data=ObjectModeliter;\n\
    ```\n\n```\nyaxis label=’Misclassification Rate’;\n```\n\n```\nseries x=Epoch\
    \ y=FitError / CURVELABEL=\"&Train”\n      CURVELABELPOS=END;\n```\n\n```\nseries\
    \ x=Epoch y=ValidError / CURVELABEL=\"&Valid”\n      CURVELABELPOS=END; \n```\n\
    \n```\nrun;\n```\n\n2. View the results after the program finishes running.\n\n\
    Scroll down in the Results window to the Model `convnn` Information Details table\
    \ (Figure 2.23). Notice that the model contains 801,974 parameters!\n\nFigure\
    \ 2.23: Model Convnn Information Details Table\n(image/Image1192.jpg)\n\nNext,\
    \ scroll down to the Optimization History of Deep Learning Model for `LARGEIMAGEDATASHUFFLED`\
    \ table. The best performance on the validation occurred at epoch 52. The model\
    \ has a 23.73% misclassification rate on the validation data. Notice that there\
    \ is considerable divergence between the training and validation misclassification\
    \ rates. Perhaps a greater use of regularizations could push the validation error\
    \ rate down further. This could include increasing the dropout rate, applying\
    \ dropout to other layers, incorporating L1 or L2 regularizations, or generating\
    \ synthetic cases with carefully chosen random mutations, as seen in Figure 2.24.\n\
    \nFigure 2.24: Misclassification Rate\n(image/Image1201.jpg)\n\nNote: Results\
    \ might vary due to the distribution of data and computation. The iteration plot\
    \ in Figure 2.25 shows the performance of the model’s misclassification rates\
    \ on the training and validation data sets.\n\nFigure 2.25: Performance of Model’s\
    \ Misclassification Rates\n(image/Image1212.png)\n\n### Scoring with the Fitted\
    \ Model\n\n1. Open the program named `DLMS02D02b.sas`. Now that we have our model,\
    \ it is time to score new data. The `dlScore` action is used to score the validation\
    \ data. Notice that the `INITWEIGHTS=` option specifies the best weights discovered\
    \ by the trained model (that is, the weights discovered in epoch 55).\n\n```\n\
    proc cas;\n```\n\n```\ndlScore / table={name=’LargeImageDatashuffled’,\n     \
    \       where='_PartInd_=2’} model=’ConVNet’ \n              initWeights=’ConVbestweights’\n\
    \              layerOut={name=’Layer_data’, replace=1}\n              layers=’ConVLayer1’\n\
    \              layerImageType=’JPG’\n```\n"
  trans: "\n\n注意：拼接层（Concatenation layers）要求输入的特征图尺寸相同。在合并不同尺寸的特征图时，通常会使用池化层对较大的特征图进行下采样。\n\
    \n```\nAddLayer / model=’ConVNN’ name=’concatlayer2’\n           layer={type=’concat’}\
    \ \n           srcLayers={‘PoolLayer1max’,’ConVLayer1e’};\n```\n\nf. 随后将拼接层连接到另一个步长为\
    \ 2 的 2 x 2 池化层（最大池化层）。\n\n```\nAddLayer / model=’ConVNN’ name=’PoolLayer2max’\
    \ layer={type=’POOL’ \n           width=2 height=2 stride=2 pool=’max’}\n    \
    \       srcLayers={‘concatlayer2’};\n```\n\ng. 使用拼接层将池化层与连接到输入层并使用 6 x 6 器的卷积层结合。\n\
    \n```\nAddLayer / model=’ConVNN’ name=’concatlayer3’\n           layer={type=’concat’}\n\
    \           srcLayers={‘PoolLayer2max’,’ConVLayer1f’};\n```\n\nh. 随后将拼接层连接到另一个步长为\
    \ 2 的 2 x 2 池化层（最大池化层）。\n\n```\nAddLayer / model=’ConVNN’ name=’PoolLayer3max’\
    \ layer={type=’POOL’ \n           width=2 height=2 stride=2 pool=’max’}\n    \
    \       srcLayers={‘concatlayer3’};\n```\n\ni. 随后将池化层连接到具有 64 个滤波器的卷积层。该卷积层包含\
    \ 3 x 3 过滤器，以步长 1 跨越输入列。使用 `MSRA2` 初始化权重。卷积层还应用了 20% 的丢弃率（dropout rate）。通常会移除隐藏偏置，并在应用批归一化（batch\
    \ normalization）之前将激活函数设置为 `Identity`。然而，为了展示 SAS 的灵活性，我们决定不遵循传统方法。\n\n```\nAddLayer\
    \ / model=’ConVNN’ name=’ConVLayer1g’ layer={type=’CONVO’\n           nFilters=64\
    \ width=3 height=3 stride=1 init=’msra2’\n           dropout=.2} srcLayers={‘concatlayer3’};\n\
    ```\n\n```\nAddLayer / model=’ConVNN’ name=’BatchLayer1’\n           layer={type=’BATCHNORM’\
    \ act=’ELU’}\n           srcLayers={‘ConVLayer1g’};\n```\n\nj. 随后将归一化值传递到另一个具有\
    \ 128 个滤波器的卷积层。该卷积层包含 3 x 3 过滤器，以步长 2 跨越输入列。`MSRA2`、批归一化和丢弃率也用于此卷积层。\n\n```\n\
    AddLayer / model=’ConVNN’ name=’ConVLayer1h’ layer={type=’CONVO’\n           nFilters=128\
    \ width=3 height=3 stride=2 init=’msra2’\n           dropout=.2} srcLayers={‘BatchLayer1’};\
    \ \n```\n\n```\nAddLayer / model=’ConVNN’ name=’BatchLayer2’\n           layer={type=’BATCHNORM’\
    \ act=’ELU’}\n           srcLayers={‘ConVLayer1h’};\n```\n\nk. 随后使用拼接层将卷积层与最后一个池化层连接。\n\
    \n```\nAddLayer / model=’ConVNN’ name=’concatlayer4’\n           layer={type=’concat’}\n\
    \           srcLayers={‘PoolLayer3max’,’BatchLayer2’};\n```\n\nl. 随后添加一个具有 240\
    \ 个神经元的全连接层。全连接层应用批归一化和 65% 的丢弃率。\n\n```\nAddLayer / model=’ConVNN’ name=’FCLayer2’\n\
    \           layer={type=’FULLCONNECT’ n=240 act=’Identity’\n           init=’msra2’\
    \ dropout=.65 includeBias=False} \n           srcLayers={‘concatlayer4’};\n```\n\
    \n```\nAddLayer / model=’ConVNN’ name=’BatchLayer3’\n           layer={type=’BATCHNORM’\
    \ act=’ELU’}\n           srcLayers={‘FCLayer2’};\n```\n\nm. 最后，将归一化值传递到上一个全连接层的\
    \ `outlayer`。\n\n```\nAddLayer / model=’ConVNN’ name=’outlayer’\n           layer={type=’output’\n\
    \           act=’SOFTMAX’} srcLayers={‘BatchLayer3’};\n```\n\n```\nrun;\n```\n\
    \n注意：上述代码生成的模型类似于下方的图 22。\n\n图 22：由代码生成的模型\n(image/Image184.png)\n\n### 拟合与评估模型\n\
    \n1. 调用 `dlTrain` 来训练模型。最佳权重存储在数据集 `ConVbestweights` 中。由于权重数量巨大，模型将使用 GPU 而非 CPU\
    \ 进行训练。此外，包含模型每个 epoch 性能的表格被保存在 `ObjectModeliter` 表中。该表用于创建迭代图。\n\n```\nods output\
    \ IterHistory=ObjectModeliter;\n```\n\n```\nproc cas;\n```\n\n"
