    \ 2: Building and Training Deep Learning Neural Networks Using CASL Code\n\nThis\
    \ demonstration illustrates building and training two deep learning neural networks.\
    \ Both models will consist of the same number of hidden layers and hidden units\
    \ as the neural network created in the last demonstration. However, deep learning\
    \ techniques will be applied to these two new models.\n\nThis demonstration uses\
    \ CASL code to implement deep learning models. PROC CAS is used to facilitate\
    \ the use of CASL code.\n\n1\\. Open the program titled DLUS01D02a.sas and examine\
    \ the program’s contents in the code editor window.\n\nFirst, the DeepLearn action\
    \ set is loaded. This action set contains the bulk of SAS deep learning capabilities,\
    \ including deep feed-forward (DNN), convolutional (CNN), and recurrent (RNN)\
    \ neural networks.\n\nNote: DeepLearn must be loaded before using SAS deep learning\
    \ actions. The action set needs to be loaded only once.\n\n```\nproc cas;\n```\n\
    \n```\n   loadactionset ‘DeepLearn’;\n```\n\n```\nrun;\n```\n\nNext, an empty\
    \ deep learning model is created. The model’s reference name is DLNN and the deep\
    \ feed-forward model type is specified.\n\n```\nproc cas;\n```\n\n```\n   BuildModel\
    \ / modeltable={name=’DLNN’, replace=1} type = “DNN”;\n```\n\n```\nrun;\n```\n\
    \nNine layers are then added to the model using the AddLayer action, the first\
    \ of which is the input layer, as indicated by the TYPE=’INPUT’ option. Dropout\
    \ is applied to the input layer using the DROPOUOT= option.\n\n```\nproc cas;\n\
    ```\n\n```\n   AddLayer / model=’DLNN’ name=’data’ layer={type=’input’ \n    \
    \          STD=’STD’ dropout=.05};\n```\n\nSeven fully connected hidden layers\
    \ are added. Each hidden layer is given a unique name in the NAME= option. The\
    \ activation function used in each of these layers is the rectified linear (ReLU)\
    \ activation function, with the exception of the first hidden layer. The first\
    \ hidden layer incorporates the exponential linear (ELU) activation because ReLU\
    \ is prone to saturation when connected with the input layer (communication with\
    \ L. Lewis, SAS 2017). MSRA initialization is combined with the ReLU activation\
    \ function and a dropout rate of 5% is included.\n\nDropout is applied to each\
    \ of the hidden layers except for the middle hidden layer. Notice that the SRCLAYERS=\
    \ option indicates the layer pertaining to the incoming connections.\n\n```\n\
    AddLayer / model=’DLNN’ name=’HLayer1’ layer={type=’FULLCONNECT’ n=30 act=’ELU’\
    \ init=’xavier’ dropout=.05} srcLayers={‘data’};\n```\n\n```\nAddLayer / model=’DLNN’\
    \ name=’HLayer2’ layer={type=’FULLCONNECT’ n=20 act=’ReLU’ init=’MSRA’ dropout=.05}\
    \ srcLayers={‘HLayer1’};  \n```\n\n```\nAddLayer / model=’DLNN’ name=’HLayer3’\
    \ layer={type=’FULLCONNECT’ n=10 act=’ReLU’ init=’MSRA’ dropout=.05} srcLayers={‘HLayer2’};\
    \  \n```\n\n```\nAddLayer / model=’DLNN’ name=’HLayer4’ layer={type=’FULLCONNECT’\
    \ n=5 act=’ReLU’ init=’MSRA’} srcLayers={‘HLayer3’};  \n```\n\n```\nAddLayer /\
    \ model=’DLNN’ name=’HLayer5’ layer={type=’FULLCONNECT’ n=10 act=’ReLU’ init=’MSRA’\
    \ dropout=.05} srcLayers={‘HLayer4’};  \n```\n\n```\nAddLayer / model=’DLNN’ name=’HLayer6’\
    \ layer={type=’FULLCONNECT’ n=20 act=’ReLU’ init=’MSRA’ dropout=.05} srcLayers={‘HLayer5’};\n\
    ```\n\n```\nAddLayer / model=’DLNN’ name=’HLayer7’ layer={type=’FULLCONNECT’ n=30\
    \ act=’ReLU’ init=’MSRA’ dropout=.05} srcLayers={‘HLayer6’};     \n```\n\nLast,\
    \ an output layer is added. The softmax activation function is used because the\
    \ target is binary.\n\n```\nAddLayer / model=’DLNN’ name=”outlayer” layer={type=’output’\
    \ \n           act=’softmax’} srcLayers={“HLayer7”};\n```\n\n```\nrun;\n```\n\n\
    Figure 1.13 is an abbreviated transcription of the model architecture constructed\
    \  \n\nby the CASL code above.\n\nFigure 1.13: Transcription of the Model Architecture\n\
    \n![](image/Image1336.png)\n\nThe model has now been constructed. However, we\
    \ have not yet trained the model on our data. The dlTrain action is used to train\
