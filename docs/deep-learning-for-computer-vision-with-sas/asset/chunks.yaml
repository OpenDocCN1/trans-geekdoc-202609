    \ replace=1}\n        initWeights=’tinyYolo_pathways’\n        dataSpecs={{data={&ObjectTargets},\n\
    \                              layer=’detection1’,\n                         \
    \     type=’OBJECTDETECTION’}\n                       {data={‘_image_’},\n   \
    \                           layer=’input1’,\n                              type=’IMAGE’}\n\
    \                       }         GPU=True\nforceEqualPadding = True\n ValidTable={name=’Train_metabolic_pathways’,\
    \ where=’_PartInd_=2’}\n        optimizer={minibatchsize=4, ignoreTrainingError=true,\n\
    \                algorithm={method=’LARS’, lrpolicy=’Step’, gamma=0.901, stepsize=1,\n\
    \                learningrate=6.047E-7, scalefactor=.009,warmup=0,momentum=0.9395666667,\
    \ clipgradmin=-100, clipgradmax=100},loglevel=3, regL1=0.0022902367, regL2=0.0025301567,maxepochs=1}\n\
    seed=12345\n;\nquit;\n```\n\n该模型包含 23,511,562 个参数！性能比扩展训练期间的结果略差。\n\n8. 使用训练好的模型预测（评分或推理）数据中化合物和箭头的位置。\n\
    \n```\n /* 对全数据进行评分以生成提取结果 */;\nproc cas;\n                dlScore / table={name=’Train_metabolic_pathways’}\
    \ model=’Tiny-Yolov2’\n                                 initWeights=’tinyYolo’\n\
    \                                 casout={name=’PathwaysScored’, replace=1}\n\
    \                                 copyVars={‘_image_’}\n                     \
    \            gpu=true;\nQuit;\n```\n\n"
