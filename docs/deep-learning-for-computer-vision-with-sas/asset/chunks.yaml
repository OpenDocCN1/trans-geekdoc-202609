- raw: 'It is quite common to increase the number of filters as the network becomes
    deeper. For example, the first convolutional layer might contain 32 filters, the
    next convolutional layer has 64 filters, the next has 128 filters, and so on.
    The number of convolutional filters is increased to offset the reduction of information
    that occurs when larger stride values are used (that is, stride values greater
    than one).


    The following figures walk through the details of an example convolution layer.


    During the forward pass of the convolution, the filter is placed in a starting
    position of the input space as seen in Figure 2.5.


    Figure 2.5: Starting Position of the Filter


    ![](image/Image895.jpg)


    The dot products between the entries of the filter and the input at that position
    are calculated, as seen in Figure 2.6. For this example, we multiply 1\*245 +
    1\*97 + 1\*239 + 0\*185 + 0\*207 + 0\*11 + -1\*212 + -1\*175 + -1\*160 + our bias
    of 10, which gives us an output of 44 in the feature map.


    Figure 2.6: Products of the Entries Between the Filter and Input


    ![](image/Image903.jpg)


    Therefore, the value derived from the dot product between the filter and the localized
    input space becomes the first output value. The algorithm then slides each filter
    across the input space. The range of movement is determined by the STRIDE hyperparameter,
    as seen in Figure 2.7. The stride value controls movement across the width of
    the input space, as well as the height.


    Figure 2.7: Range Movement Due to STRIDE Hyperparameter


    ![](image/Image912.jpg)


    After the filter has moved, the cross-correlation operation is continued, calculating
    the next output value. The process is repeated, and as the filter moves over the
    width and height of the input volume, we produce a two-dimensional feature map
    that gives the responses of that filter at every spatial position, as seen in
    Figure 2.8.


    Figure 2.8: Feature Map with Filter Response at Every Spatial Position


    ![](image/Image919.jpg)


    The filter values are the learnable parameters of the convolution layer (that
    is, the weights of the layer), with the bias equal to β.


    Each filter will have the same number of channels as the incoming information.
    However, the output is always a two-dimensional grid, regardless of the number
    of channels. In the example presented in Figure 2.9, a single filter is combined
    with three channels of information. Each channel can be thought of as a “piece”
    of information. This single 3 by 3 filter has 28 weights. That is, each piece
    of information is assigned nine weights, which gives us 27 weights total. And
    then we have our bias, which gives us our 28th weight. A nonlinear activation![](image/Image927.png),
    such as an exponential linear, hyperbolic tangent, rectified linear, or other
    transformation, can be applied to the output values of the feature map, as seen
    in Figure 2.9.


    Figure 2.9: Filter Weights and Nonlinear Transformation


    ![](image/Image935.png)


    Padding


    Both convolution and pooling increase the pressures of underfitting due in large
    part to the reduction in information as more of these layers are added. Padding
    can be used to offset or mitigate the loss of information. Padding increases the
    relevance of pixels existing on the edge of an image.


    Padding is calculated with the goal of producing an output image in a size that
    will be “reasonable” based on the original input image size and filter size. The
    key issues are whether the input image dimensions are even or odd, whether the
    filter dimensions are even or odd, and the value of the user-specified stride.


    Here are some of the “reasonable” rules:


    ● The horizontal and vertical padding sizes are independent of each other. Changing
    the horizontal dimension of an image or filter has no effect on the vertical padding
    size.


    ● If the stride is 1, then the output image size is the same as the input image
    size. When discussing convolutions, this is sometimes referred to as same padding.


    ● If the stride is 2, then the output image size is about one half the input image
    size.


    ● Padding is first added to the right side of the image and then the left. So
    if padding is unequal, the right side will have more padding than the left.


    ● Images are padded with zeros.


    Without padding, the feature map might be considerably smaller than the input,
    depending on the size of the filter and stride, as seen in Figure 2.10.


    The shrinkage caused by convolution layers can be mitigated with the use of padding.
    If the stride is 1, the output map size is exactly the same as the input map size
    because the default behavior in the SAS DEEPLEARN action set is to automatically
    pad the channels or feature maps. If the stride is 2, the area of the output map
    is reduced by approximately 4 times (2\*2).


    Figure 2.10: Feature Map Without Padding


    ![](image/Image942.jpg)


    The shrinkage caused by convolution layers can be mitigated with the use of padding,
    as seen in Figure 2.11.


    Figure 2.11: Feature Map with Padding


    ![](image/Image953.jpg)


    To use padding in SAS with GPUs, the FORCEEQUALPADDING option must be set to True
    in the dlTrain action. This means that equal padding is applied to all sides of
    the feature map. SAS defaults to FORCEEQUALPADDING=TRUE if the GPU=TRUE option
    is specified:


    ```

    ForceEqualPadding=True

    ```


    Without padding, the output feature map is reduced, as seen in Figure 2.12.


    Figure 2.12: Without Padding


    ![](image/Image961.png)


    The dimension of the feature map is not what SAS produces by default, as shown
    next in Figure 2.13


    Figure 2.13: Automatic Padding with SAS


    ![](image/Image968.png)


    SAS automatically applies padding with the assumption the stride value equals
    one to offset the natural reduction in the feature map size. SAS still automatically
    applies padding when the stride value is greater than one, but the feature map
    will be smaller than the input matrix when the stride value is greater than one.
    Meaning using a stride value greater than one will decrease the output feature
    map size. Additionally, SAS automatically applies additional padding if the resulting
    convolution feature map is a noninteger matrix. For example, consider a scenario
    where the incoming information is a 12 x 12 matrix. Applying a filter of size
    3 x 3 with a stride value of two yields an output of 6.5 (a noninteger value),
    as seen in Figure 2.14.


    Figure 2.14: SAS Automatically Adjusts for Non-Integer Feature Maps


    ![](image/Image976.png)


    Feature Map Dimensions


    The dimensions of the output are determined by the dimensions of the input, filter,
    and padding in combination with the stride size, as seen in Figure 2.15.


    Figure 2.15: Feature Map Dimensions


    ![](image/Image983.jpg)


    The feature map dimensions can be calculated by the following:


    ![](image/Image992.png)


    ![](image/Image999.png)represents the input dimension,![](image/Image1007.png)represents
    the padding value (padding is discussed shortly),![](image/Image1016.png)represents
    the filter size, and![](image/Image1027.png)represents the stride size.


    Pooling Layers'
