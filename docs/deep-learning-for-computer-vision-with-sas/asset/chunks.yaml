    YOLO applies a single CNN to the full image and then divides the image into regions
    (usually 13 x 13 grid cells). Then, for each region, YOLO predicts a fixed number
    of bounding boxes and associated object classification probabilities. Anchor boxes
    for each region provide pre-set values for predicted object sizes, and the actual
    prediction gives a correction to the anchor boxes. Anchor boxes are typically
    obtained for a given data set using k-means clustering. Final detection results
    are obtained by applying threshold and non-maximum suppression operations on the
    predictive probabilities.


    # Data Preparation and Prediction Overview


    The data from which the model now learns has expanded to include information describing
    the spatial dynamics of an object or objects. Depending on the format used, the
    predictions that describe an object’s location can be presented in the following
    three ways:


    1. `RECT`: Use the `RECT` format for coordinates `[xleft, ytop, width, height]`
    in image pixels.

    2. `YOLO`: Use the `YOLO` format for coordinates `[xMiddle, yMiddle, width, height]`
    in normalized image size (obtained by dividing the coordinates by the image size).

    3. `COCO`: Use the `COCO` format for coordinates `[xmin, ymin, xmax, ymax]` in
    image pixels.


    An output variable describing the number of objects is included in addition to
    the output variables describing an object’s location. This chapter focuses on
    the `YOLO` format, which includes four normalized variables that depict an object’s
    location. Normalizing the values ensures that resizing transformations can be
    used with minimal loss of precision with regard to the target location.


    * `_Objectn_x` corresponds to the normalized horizontal location of the object.

    * `_Objectn_y` corresponds to the normalized vertical location of the object.

    * `_Objectn_width` corresponds to the normalized width of the bounding box.

    * `_Objectn_height` corresponds to the normalized height of the bounding box.


    ## Non-Normalized Data


    In some cases, the data provided are not normalized. For example, consider a scenario
    where `xmin`, `xmax`, `ymin`, and `ymax` represent unnormalized pixel values in
    an image with dimensions of 500 x 400. The normalized values are calculated by
    dividing each `x` and `y` coordinate by the maximum value of the respective plane
    (that is, `xmin/500`, `xmax/500`, `ymin/400`, and `ymax/400`).


    The following equations transform the normalized `xmin`, `xmax`, `ymin`, and `ymax`
    values into YOLO formatted values:


    ```

    _objectn_x=.5(x min + x max)

    _objectn_y=.5(y min + y max)

    _objectn_width=(x max - x min)

    _objectn_height=(y max - y min)

    ```


    Where `n` represents the object number.


    ## Normalized Locations


    Consider the example below where the object of interest is a person fishing in
    Figure 4.2. Pixels within a two-dimensional image represent coordinates on an
    X-axis and Y-axis grid. The grid itself can be thought of as a normalized representation
    of the image where the pixel in the top left corner has the coordinates (0,0),
    and the pixel in the bottom right corner has the coordinates (1,1). The variables
    `_objectn_x` and `_objectn_y` provide the normalized origin of an object. For
    example, the fisherman is located approximately 70.5% in the direction of the
    X axis’ terminal value, 1.


    Figure 4.2: Normalized Locations, `objectn_x` and `objectn_y`


    ![](image/Image881.jpg)


    This means that the fisherman’s origin is 70.5% of the way to the right side of
    the image. Similarly, the fisherman is located 73% in the direction of the Y axis’
    terminal value (that is, 73% of the way heading from top to bottom). The combination
    of `_objectn_x` and `_objectn_y` provides the fisherman’s normalized origin.


    The variables `_objectn_width` and `_objectn_height` provide the respective normalized
    width and height of an object, as seen in Figure 4.3. The object’s origin (in
    this case, the fisherman’s origin) lies in the center of the box. This means that
    the width and height extend in equal distances from the fisherman’s origin.


    Figure 4.3: Normalized Locations, `objectn_width` and `objectn_height`


    ![](image/Image890.jpg)


    Notice that the width of the box is approximately 10% the width of the image and
    the height of the bounding box is about one quarter, or 23%, the height of the
    picture.


    ## Multi-Loss Error Function


    The YOLOv2 multi-loss function combines several error functions and attempts to
    balance the model’s focus between classification and localization prediction task.
    The prediction task focuses on the following four areas:


    * bounding box error ![](image/ML1Eq.jpg)

    * `+ true confidence error` ![](image/ML2Eq.jpg)

    * `+ false confidence error` ![](image/ML3Eq.jpg)

    * `+ classification error` ![](image/ML4Eq.jpg)


    As seen in Figure 4.4, the image is separated into a matrix of S x S cells. In
    each cell, a number of bounding boxes are predicted ![](image/Image898.png). Each
    prediction includes the center location of the bounding box and the width and
    height of the bounding box error, the probability of the prediction being an object
    (source of true and false confidence errors), and the classification probabilities
    (source of classification error). The number of bounding boxes predicted are determined
    by the number of anchor boxes specified. Anchor boxes are discussed later in the
    chapter.


    ![](image/Image905.png) is 1 if the prediction ![](image/Image913.png) in the
    cell ![](image/Image1095.png) is correct. Otherwise, its value is 0.


    Figure 4.4: YOLOv2 Multi-Loss Error Function


    ![](image/Image969.jpg)


    If a cell does not contain an object of interest, then ![](image/Image976.png),
    and the multi-loss error function resolves to a simple squared error function:
    ![](image/Image984.png) where ![](image/Image991.png) represents the predicted
    probability of being an object for a prediction ![](image/Image913.png) in the
    cell ![](image/Image1095.png).


    If a cell contains an object of interest, then ![](image/Image1014.png), and the
    multi-loss error function drops ![](image/Image1023.png) and simplifies to the
    following: ![](image/Image1034.png)


    where ![](image/Image1046.png) represent predicted coordinate offsets from the
    anchor box, and ![](image/Image1056.png) represent coordinate offsets of the labeled
    object bounding box for which the prediction ![](image/Image1064.png) is responsible.


    Note: An anchor box provides a candidate set of starting points for bounding box
    predictions. This topic is discussed in more detail in a later section.


    Only a single anchor box that contains the highest intersection over union (IOU)
    value with the true bounding box is retained as the prior of best fit and is represented
    by ![](image/Image1056.png) offsets.


    Intersection over union (IOU) is calculated as shown in Figure 4.5.


    Figure 4.5: Intersection over Union


    ![](image/Image079.jpg)


    When a prediction is “responsible” for a true object, it means that the prediction
    is the closest match for a labeled object whose center falls into the cell, with
    respect to IOU. ![](image/Image1086.png) represents the predicted probability
    of being class ![](image/Image1093.png) for prediction ![](image/Image913.png)
    in the cell ![](image/Image1095.png). ![](image/Image1118.png) is 1 if the labeled
    object that this prediction is responsible for is class ![](image/Image1093.png).
    Otherwise, it is zero.

