- raw: "For example, you can use the sliding window method on input images and separately\
    \ flip input images. The output CAS table contains the resulting images. In addition,\
    \ the writeRandomly parameter enables you to randomly apply augmentations to input\
    \ images. This is very important for machine learning methods that are based on\
    \ deep neural networks.\n\nSetting both the sweepImage and useWholeImage parameters\
    \ to True is contradictory. Therefore, the useWholeImage parameter overrides the\
    \ sweepImage parameter.\n\nThe code below is an example that demonstrates how\
    \ to use the AugmentImage action to apply two transformations to a 32 x 32-pixel\
    \ image.\n\n```\nPROC CAS;\n```\n\n```\n AugmentImages / \n```\n\n```\n      \
    \ table={name= “MyInputTable”}\n```\n\n```\n       casOut={name= “MyOutputTable”}\n\
    ```\n\n```\n       writeRandomly= true\n```\n\n```\n              cropList={mutations=\
    \ {      colorjittering= true\n```\n\n```\nrotateright= true           }\n```\n\
    \n```\n                      width= 32\n```\n\n```\n                      heigth=\
    \ 32\n```\n\n```\n                      useWholeImage= true};\n```\n\n```\nRUN;\n\
    ```\n\nGaussian Filters\n\nGaussian filters are used to smooth steep variations\
    \ within an image.\n\nFigure 3.14: Gaussian Filter\n\n![](image/Image3151.jpg)\n\
    \nThis photometric transformation blends pixels to create a blurred version of\
    \ the image. Larger kernels increase the blurred effect of the transformation\
    \ as seen in Figure 3.14. A Gaussian filter applies larger weights to the center\
    \ of the kernel such that the area of interest is lightly blended with surrounding\
    \ pixels. An example Gaussian kernel filter might look something like the figure\
    \ below.\n\nFigure 3.15: Gaussian Kernel Filter\n\n![](image/Image3159.jpg)\n\n\
    The user needs to provide only the height and width of the Gaussian kernel. SAS\
    \ creates a valid kernel such that the volume under the two-dimensional kernel\
    \ equals 1. The processImages action is used to create images transformed by Gaussian\
    \ filters. Here is some example code:\n\n```\nPROC CAS;\n```\n\n```\n   image.processImages\
    \ /\n```\n\n```\n         imageFunctions= {{functionOptions= \n```\n\n```\n  \
    \  {functionType= “GAUSSIAN_FILTER”\n```\n\n```\n    KernelWidth= 5\n```\n\n```\n\
    \           KernelHeight= 5}}\n```\n\n```\n         table={name=’inputTable’}\n\
    ```\n\n```\n         casout={name=’outputTable’};\n```\n\n```\nRUN;\n```\n\nSharpen\n\
    \nSharpening an image is considered a photometric transformation, as seen in Figure\
    \ 3.16.\n\nFigure 3.16: Sharpen\n\n![](image/Image3166.jpg)\n\nTo sharpen an image,\
    \ SAS encodes the red, green, blue (RGB) color image to Y′CbCr, where Y′ is the\
    \ brightness component, Cb represents the blue-difference component, and Cr represents\
    \ the red-difference component. A high-pass filter is then applied to the encoded\
    \ image to detect edges. Figure 3.17 is an example of a high-pass filter.\n\n\
    Figure 3.17: High-Pass Filter\n\n![](image/Image3174.jpg)\n\nThen the image is\
    \ transformed back the RGB color space. Here is example code that sharpens an\
    \ image:\n\n```\nPROC CAS;\n```\n\n```\n   image.processImages /\n```\n\n```\n\
    \         imagefunctions= {{functionOptions=\n```\n\n```\n    {functionType=”MUTATIONS”\
    \ \n```\n\n```\n    type=”SHARPEN”\n```\n\n```\n         }}}\n```\n\n```\n   \
    \      table={name=’inputTable’}\n```\n\n```\n         casout={name=’outputTable’};\n\
    ```\n\n```\nRUN;\n```\n\nInverting Pixels\n\nPixel inversion is a photometric\
    \ transformation that reverses the color density such that light becomes dark\
    \ and dark becomes light, as seen in Figure 3.18.\n\nFigure 3.18: Inverting Pixels\n\
    \n![](image/Image3181.jpg)\n\nIt can be as simple as replacing each of the RGB\
    \ pixel values with (255 – pixel value). Here is sample code that demonstrates\
    \ how to invert pixels using SAS:\n\n```\nPROC CAS;\n```\n\n```\n   image.processImages\
    \ /\n```\n\n```\n        imagefunctions= {{functionOptions=\n```\n\n```\n    \
    \    {functionType=”MUTATIONS”\n```\n\n```\n        type=”INVERT_PIXELS”\n```\n\
    \n```\n        }}}\n```\n\n```\n        table={name=’inputTable’}\n```\n\n```\n\
    \        casout={name=’outputTable’};\n```\n\n```\nRUN;\n```\n\nPyramid Down\n\
    \nThe Pyramid Down transformation downsamples and then blurs the image. An example\
    \ is shown in Figure 3.19.\n\nFigure 3.19: Pyramid Down and Cropping Transformations\n\
