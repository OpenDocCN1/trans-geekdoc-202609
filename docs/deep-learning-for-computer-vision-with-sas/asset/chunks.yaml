    ```\n\n```\nrun;\n```\n\nSmall Sample can be seen in Figure 2.29.\n\nFigure 2.29:\
    \ Small Sample\n\n![](image/Image1250.png)\n\nLarge Sample can be seen in Figure\
    \ 2.30.\n\nFigure 2.30: Large Sample\n\n![](image/Image1257.png)\n\nThe small\
    \ sample can be used for practice if you want to run this example more quickly\
    \ instead of using the large sample.\n\nThe data are currently ordered by the\
    \ target values. For example, the data might begin with pictures of only frogs,\
    \ followed by pictures of cats, and so on. Ordering by the target can cause a\
    \ problem for variants of stochastic gradient descent (SGD, momentum, and ADAM).\
    \ The problem arises because ordering by the outcome can cause the model to become\
    \ entrenched with a set of parameters that overpredicts a single class. That is,\
    \ it fails to discriminate between all outcome classes. It is recommended that\
    \ the data be randomly shuffled. If fact, it is quite common to change the observation\
    \ order when blending (ensemble through weighted averages of predictions) models\
    \ together for image classifiers.\n\nNote: An alternative to random shuffling\
    \ is curriculum learning. Curriculum learning sorts the data by those observations\
