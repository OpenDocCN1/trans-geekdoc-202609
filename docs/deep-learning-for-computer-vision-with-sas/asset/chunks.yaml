- raw: "● CANNY\\_EDGE: detects edges in input images by using the Canny edge detection\
    \ algorithm. This function accepts three parameters: lowThreshold, highThreshold,\
    \ and kernelSize.\n\n● LAPLACIAN: applies the Laplace operator to input images.\
    \ The Laplace operator is a second-order differential operator in the n-dimensional\
    \ Euclidean space. When the value of the kernelSize parameter is 1, the resulting\
    \ value is approximated by convolving the kernel with input images.\n\n● Otherwise,\
    \ the value is approximated by summing the second x and y derivatives, which are\
    \ calculated using the Sobel operator.\n\n● SOBEL: uses the Sobel operator to\
    \ calculate the first, second, third, or mixed image derivatives. Derivatives\
    \ are calculated by convolving the image with a kernel. Kernels must be square.\
    \ The size can be only one of the following numbers: 1, 3, 5, and 7. When the\
    \ kernel size is 1, a kernel is used for the first or second derivative of x,\
    \ and a kernel is used for the first or second derivative of y. For the other\
    \ kernel sizes, the Sobel operator considers Gaussian smoothing and differentiation\
    \ together (handling noise).\n\n● NORMALIZE: normalizes the value range of an\
    \ image. You can specify the following normalization functions in the type parameter:\
    \ INF, L1, L2, L2SQR, HAMMING, HAMMING2, RELATIVE, and MINMAX. The MINMAX function\
    \ is commonly used to normalize an image between alpha and beta values.\n\n● THRESHOLD:\
    \ applies a threshold value to each pixel in an image. You can specify the following\
    \ threshold types: BINARY, BINARY\\_INVERSE, TRUNCATE, TO\\_ZERO, TO\\_ZERO\\\
    _INVERSE, OTSU, and TRIANGLE.\n\n● CONVERT\\_COLOR: converts an image’s color\
    \ space. Currently available conversions are COLOR2GRAY, GRAY2COLOR, BGR2RGB,\
    \ and RGB2BGR. The default color space for an image is BGR. COLOR2GRAY means BGR2GRAY.\n\
    \n● RESCALE: changes an image’s depth. You can specify the following types of\
    \ rescaling:\n\n◦ TO\\_8U where depth is changed to 8-bit, where a pixel is represented\
    \ by an unsigned integer.\n\n◦ TO\\_32F where depth is changed to 32-bit, where\
    \ a pixel is represented by a floating number.\n\n◦ TO\\_64F where depth is changed\
    \ to 64-bit, where a pixel is represented by a double-precision number).\n\nYou\
    \ can scale the values based on the alpha and beta parameters.\n\n● MORPHOLOGY:\
    \ performs a morphological transformation on images. You can specify the following\
    \ types of transformation: ERODE, DILATE, OPEN, CLOSE, GRADIENT, TOPHAT, BLACKHAT,\
    \ and HITMISS. Each of these operations can be in RECT (rectangular), CROSS, and\
    \ ELLIPSE shapes.\n\n● BOX\\_FILTER: blurs an image by using a normalized box\
    \ filter. The kernelWidth and kernelHeight parameters shape the filter. The anchor\
    \ is assumed to be at the kernel’s center.\n\n● GAUSSIAN\\_FILTER: blurs an image\
    \ by using a Gaussian filter. A convolution kernel is created based on the kernelWidth and kernelHeight parameters,\
    \ which must be positive and odd.\n\n● BILATERAL\\_FILTER: applies a bilateral\
    \ filter to images. A bilateral filter is a nonlinear, edge-preserving, noise-reducing\
    \ smoothing filter. The idea behind this filter is to consider pixels close if\
    \ they are  \n\nin spatially nearby locations, and similar if they have nearby\
    \ values (in color space).\n\n● MEDIAN\\_FILTER: blurs an image by using the median\
    \ filter. This filter uses a square matrix of the size specified in the kernelSize parameter,\
    \ which must be greater than 1 and odd.\n\n● BUILD\\_PYRAMID: blurs an image and\
    \ samples it down (PYR\\_DOWN) or up (PYR\\_UP). A Gaussian kernel is used for\
    \ blurring.\n\n● CONTOURS: applies several preprocessing steps for more accurate\
    \ results. This function accepts only one-channel images (for example, grayscale\
    \ images). It provides better results when the input image is a binarized image\
    \ (for example, pixel values are either black or white). If you provide a grayscale\
    \ image rather than a binarized image, you still see results, but they might be\
    \ inaccurate or unexpected. (For example, a contour could look like a frame that\
    \ contains the whole picture.)\n\n● CUSTOM\\_FILTER: creates a custom filter and\
    \ uses it in convolution. This operation takes the width, height, and values of\
    \ a filter.\n\n● ADD\\_CONSTANT: adds or subtracts a constant value from the pixel\
    \ intensity values input images. This function also makes sure that the resulting\
    \ values are in the permitted range that is determined by the depth of a pixel.\
    \ For example, if an image’s pixel depth is unsigned 8-bit (meaning that the pixel\
    \ values can be between 0 and 255 only), then this function makes sure that the\
    \ resulting values are within the range of 0 and 255 (meaning no overflows and\
    \ negative values are permitted in this case). Furthermore, if the image is a\
    \ one-channel image, then the function uses only the constant value of the first\
    \ input.\n\n● HIST\\_EQUALIZATION: aims to stretch out the intensity range. This\
    \ function maps the intensity distribution of an input image to another distribution\
    \ that is wider and has a more uniform distribution of intensity values. Two versions\
    \ are supported: global and adaptive. In the global version, the mapping is applied\
    \ by considering the whole image. In the adaptive version, the mapping is performed\
    \ in local patches of input images. Therefore, the adaptive version is more robust\
    \ to images where contrast is quite different at different regions of those images.\n\
    \n● LINEAR\\_TRANSFORMATION: performs linear transformation in one of the following\
    \ ways, based on the value of the method parameter:\n\n◦ STANDARDIZATION creates\
    \ an image that has zero mean and unit variance.\n\n◦ WHITENING\\_PCA uses principal\
    \ component analysis to create an image that has an identity covariance.\n\n◦\
    \ WHITENING\\_ZCA uses a ZCA transformation (also called a Mahalanobis transformation)\
    \ to create an image that has an identity covariance.\n\n◦ LOCAL\\_CONTRAST\\\
    _NORM is similar to STANDARDIZATION except that it convolves a 9 x 9 Gaussian\
    \ image with the input image.\n\n● MUTATIONS: mutates images by using different\
    \ augmentation techniques: flipping vertically, flipping horizontally, scaling\
    \ up and down with pyramids, changing the contrast (darkening or lightening),\
    \ sharpening, and rotating to the left or right. This function is useful for increasing\
    \ the variety of the input images, which is a major preprocessing step for training\
    \ methods based on deep neural networks.\n\nThe code below displays an example\
    \ code that demonstrates how to use the processImage action to apply a 5 x 5 Gaussian\
    \ filter to blur an image. The KERNELWIDTH= and KERNELHEIGHT= options specify\
    \ the width of the kernel width and height, respectively.\n\n```\nPROC CAS ;\n\
    ```\n\n```\n ProcessImages / \n```\n\n```\n       table={name= “MyInputTable”}\n\
    ```\n\n```\n       casOut={name= “MyOutputTable”}\n```\n\n```\n       imageFunctions=\
    \ {\n```\n\n```\n               {functionOptions= {functionType= “Gaussian_filter”\n\
    ```\n\n```\nKernelWidth= 5\n```\n\n```\n                     KernelHeight= 5}};\n\
    ```\n\n```\nRUN;\n```\n\nThe augmentImages action enables you to create patches\
    \ by using either sliding windows or coordinates of a rectangle. It also allows\
    \ image augmentation by using a number of methods, including rotating the image,\
    \ flipping it, and adjusting the contrast as seen in the code below.\n\n```\n\
    PROC CAS;\n```\n\n```\n AugmentImages / \n```\n\n```\n       table={name= “< image\
    \ table name >” }\n```\n\n```\n       casOut={name= “< output image table name\
    \ >” }\n```\n\n```\n       writeRandomly= < true | false\n```\n\n```\n       \
    \       cropList= {mutations= { < first mutation type > = < true | false >\n```\n\
    \n```\n                                  < second mutation type > = < true| false\
    \ >\n```\n\n```\n                                  < … > }\n```\n\n```\n     \
    \                 width= < input image width >\n```\n\n```\n                 \
    \     height= < input image height > \n```\n\n```\n                      useWholeImage=\
    \ true | false};\n```\n\n```\nRUN;\n```\n\nThis action can process more than one\
    \ patch or augmentation command in a single run."
