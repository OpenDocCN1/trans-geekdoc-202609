    Choosing which layers to freeze depends on the problem at hand. If the task is
    identical from the source to the target, then sharing the layers closer to the
    output layer is sensible. In this scenario, the adaptable layers are those closer
    to the input layer. Conversely, the layers closer to the input layer should be
    frozen and the layers closer to the output left adaptable if the relevant information
    exists primarily in the inputs.


    ### Unsupervised Pretraining


    `Autoencoders` are unsupervised models that have been leveraged with some success
    for unsupervised pretraining. One benefit to an unsupervised method is that the
    source data do not need to be labeled. An unsupervised pretraining strategy usually
    begins by combining the features of the source and target data. An `autoencoder`
    is then trained on the full data with hopes of capturing information that persists
    across domains. This is useful when the source data is abundant and the target
    data is limited. The trained `autoencoder` is then assigned to score (inference)
    the target data and encoded projections are extracted. These encoders are provided
    as inputs to the target learner, along with the original target features. Glorot
    et al. (2011) have shown success using stacked denoising autoencoders for unsupervised
    transfer learning.


    Denoising autoencoders were introduced by Vincent et al. (2010) as autoencoders
    that are trained on corrupted (perturbed) inputs. Corrupting the inputs can be
    as simple as applying `dropout` to the input layer. A popular variant of a denoising
    autoencoder is called a `stacked denoising autoencoder`.


    A `stacked denoising autoencoder` is greedily trained, layer by layer. Meaning,
    the first layer is thoroughly trained on the perturbed inputs and then frozen.
    The perturbed input is then replaced with the unperturbed input and the next layer
    is trained thoroughly. This layer is then frozen, and the process repeats until
    the output layer is trained.


    Another variant of autoencoders is known as `sparse autoencoders`. `Sparse autoencoders`
    incorporate a constraint on the objective function. `L1` and `L2` regularizations
    can be used as the constraining mechanisms to generate a sparse autoencoder.


    ### Customizations with FCMP


    Sometimes data scientists want to create custom functions for models to better
    fit a particular deep learning requirement that the available default functions
    cannot deliver. Deep learning tools in SAS enable you to use the `SAS Function
    Compiler` (`FCMP`) to create and modify your own custom definitions for deep neural
    network activation and error functions. `FCMP` is a programming tool that you
    can use with the deep learning actions in SAS to produce your own custom deep
    learning entities:


    * activation functions

    * error functions

    * model layers become* learning rate policies


    Custom `FCMP` network layers, functions, and learning rate policies are separate
    entities that perform different deep learning tasks. The one common factor is
    that all of the custom layers, custom activation and error functions, and custom
    learning rate policies were created for use with SAS deep learning using `FCMP`.


    The parameters of the `FCMP` action can be found in the documentation.


    ### Tuning a Deep Learning Model


    #### Selecting Hyperparameters


    The quality of the predictive model that a machine learning algorithm creates
    depends on the values of various attributes that govern the training process and
    model structure. The parameters that represent these attributes are also known
    as `hyperparameters`. Searching the hyperparameter space of a deep neural network
    can be prohibitively expensive for genetic or Bayesian optimization methods, because
    these methods require training with each hyperparameter combination until convergence
    of the algorithm. Alternatively, the `Hyperband` method (Li et al. 2017) is a
    good approach for dense model structures, because resources are adaptively allocated
    to only the most promising candidates.


    #### Sampling Hyperparameter Space


    The `dlTune` action implements the `Hyperband` method and begins by selecting
    hyperparameters using `Latin hypercube sampling`. A `Latin hypercube sample` is
    preferred over `simple random` because it ensures that points are approximately
    equidistant in the space.


    To avoid overfitting, a holdout sample is used to evaluate hyperparameters. The
    `dlTune` action uses the `Hyperband` method to allocate resources proportionally.
    The poor performing sets are culled based on the `TUNERETENTION` property.

