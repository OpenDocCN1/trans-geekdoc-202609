    \ to emphasize the prediction of the bounding box at the sacrifice of de-emphasizing\
    \ confidence and classification predictions. The scalar is adjusted using the\
    \ `COORDSCALE=` option in the object detection layer created by the last `ADDLAYER`\
    \ statement.\n\nHere is an example of `COORDSCALE=` implementation in the `ADDLAYER`\
