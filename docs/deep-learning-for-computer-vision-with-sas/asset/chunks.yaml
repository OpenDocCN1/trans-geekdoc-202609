    \ with the Fitted Model](#Chapter_2.xhtml#_idTextAnchor055)\n\nIntroduction to\
    \ Convoluted Neural Networks\n\nA convolutional neural network (CNN) is a type\
    \ of neural network that is viewed to be computationally and statistically efficient\
    \ (Goodfellow, Bengio, and Courville 2017). CNNs have popularized the field of\
    \ computer vision through many successes in image classification, object detection,\
    \ and semantic segmentation. CNNs can also be used for natural language processing\
    \ or other tasks where information is spatially correlated. A typical CNN consists\
    \ of five types of layers: input, convolution, pooling, fully connected, and output.\
    \ However, other types of layers are usually incorporated in more advanced structures,\
    \ including transpose convolutional, region of interest pooling, segmentation,\
    \ and many others. Each type of layer has its own specific properties and functionalities.\n\
    \nComputational efficiency is achieved through the use of convolution and pooling\
    \ layers. Neurons in a fully connected layer attach a unique parameter to each\
    \ incoming column of information. Conversely, convolution layers require fewer\
    \ parameters than a fully connected layer because the parameters are shared across\
    \ columns. Pooling layers themselves do not contain parameters, but instead they\
    \ combine columns with an output summary. Adding convolution and pooling layers\
    \ also enhances the model’s ability to capture important points in input distributions,\
    \ increasing the model’s statistical efficiency. The details of convolution and\
    \ pooling layers are discussed throughout this chapter.\n\nConvolutional neural\
    \ networks have popularized image classification and object detection. However,\
    \ CNNs have also been applied to other areas such as natural language processing\
    \ and forecasting. Many of the successes in self-driving cars, fault detection,\
    \ chatbots, and other applications are in large part built on the foundation of\
    \ convolutional neural networks.\n\nInput Layers\n\nConvolutional neural networks\
    \ (CNNs) are a class of artificial neural networks. Like regular neural networks,\
    \ a CNN begins with an input layer, consists of multiple layers, and contains\
    \ a number of neurons, as seen in Figure 2.1.\n\nFigure 2.1: Convolutional Neural\
    \ Network\n\n![](image/Image863.jpg)\n\nThe input layer might consist of the raw\
    \ pixel values of the image to be classified, while a grayscale image has only\
    \ a single channel as seen in Figure 2.2.\n\nFigure 2.2: Grayscale Image Channel\n\
    \n![](image/Image871.png)\n\nConversely, a color image has three color channels\
    \ of blue, green, and red as seen in Figure 2.3.\n\nFigure 2.3: Color Image Channels\n\
    \n![](image/Image880.png)\n\nFor example, each image in the CIFAR-10 data set\
    \ has a height of 32, width of 32, and three color channels of blue, green, and\
    \ red. Each color channel is represented by a matrix of values that indicate the\
    \ brightness of the pixel with regard to the respective channel. Pixel values\
    \ usually range from 0 to 255. Images are sometimes flattened before being passed\
    \ to the convolutional neural network. However, flattening is not required and\
    \ might even create problems when scoring with ASTORE. (ASTORE is a transportable\
    \ form of a model called an analytic store.) Nonetheless, each pixel becomes a\
    \ value in a respective column in a data set when an image is flattened. For example,\
    \ a standard color image created by a standard 8k photo has more than 33 million\
    \ pixels per channel. After it is flattened, the resulting table will consist\
    \ of more than 99 million columns (~33 million \\* 3 channels).\n\nCNNs in SAS\
    \ can also contain input layers for the consumption of tabular data. Therefore,\
    \ multiple input layers can be used. Quite often they are used when solving more\
    \ dynamic problems.\n\nConvolutional Layers\n\nThe convolution layer is most commonly\
    \ used after the input layer. The convolution layer derives an output (that is,\
    \ a feature map) from filter kernels that are connected to local regions in the\
    \ input (that is, the incoming information). Each filter computes a dot product\
    \ between their weights and a small region where they are connected to the input\
    \ volume. The operation is formally known as a cross-correlation but might sometimes\
    \ be referred to as a convolution without the kernel flipping. An example of single-channel\
    \ convolution without kernel flipping is displayed below in Figure 2.4.\n\nFigure\
    \ 2.4: Single-channel Convolution Without Kernel Flipping\n\n![](image/Image888.png)\n\
    \nA typical convolution layer can consist of many filters. The filters slide across\
    \ the input surface in parallel, capturing meaningful characteristics. Therefore,\
    \ the parameters in each filter are shared by multiple columns in the data. Parameter\
    \ sharing decreases the number of parameters needed to translate the input space.\
    \ Each filter creates equivariant representations of the input, which means that\
    \ changes in the input space are represented in the output.\n\nAdding a convolution\
    \ layer introduces new hyperparameters to the neural network. These hyperparameters\
    \ include width, height, and stride. Here is an example of a convolution layer\
    \ with 32 filters created in the SAS Cloud Analytic Services language (CASL):\n\
    \n```\nAddLayer   /    model=’ConVNet’ \n```\n\n```\n          name=’ConVLayer1’\
    \ \n```\n\n```\n          layer={type=’CONVO’\n```\n\n```\n                 nFilters=32\n\
    ```\n\n```\n                 width=3 \n```\n\n```\n                 height=3 \n\
    ```\n\n```\n                 stride=1\n```\n\n```\n                } \n```\n\n\
    ```\n          srcLayers={‘data’};\n```\n\nUsing Filters"
