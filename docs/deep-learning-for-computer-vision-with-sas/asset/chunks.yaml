- raw: "A pooling function provides a summary of some localized region of the incoming\
    \ information. Three summary options are available in SAS: Maximum, Average, and\
    \ Minimum. Similar to the convolution layer, the pooling layer uses filters, but\
    \ the filters are used to establish the area to be summarized and do not contain\
    \ learnable weights. The hyperparameters associated with the pooling filters include\
    \ width, height, and stride. There is no need to specify the number of pooling\
    \ filters because the filter count is determined by the number of incoming two-dimensional\
    \ grids. It is common to periodically insert a pooling layer between successive\
    \ convolution layers in a CNN architecture. Although, Springenberg et al. showed\
    \ great success replacing pooling layers with convolution layers and leveraged\
    \ stride a larger stride to down-sample the information (Springenberg et al.,\
    \ 2015). For example, a pooling or convolution layer with filters of size 2 x\
    \ 2 applied with a stride of 2 reduces the amount of incoming information by 75%.\
    \ Therefore, stride aggressively shrinks the network.\n\nGenerating a summary\
    \ of each localized region has the added benefit of making the output approximately\
    \ invariant to small deviations in the input. That is, the pooling function is\
    \ useful  \n\nwhen the modeler is more concerned with whether an object exists\
    \ instead of its exact location. Conversely, if spatial differences are of great\
    \ concern, then pooling should be used carefully, if even at all (Goodfellow,\
    \ Bengio, and Courville 2017).\n\nPooling with larger stride values can also be\
    \ used in situations where the size of your input information can vary. Consider\
    \ a scenario where you are classifying images of two different sizes: 128 x 128\
    \ and 192 x 192. Each image size would be given its own input layer, and the larger\
    \ image size can be down-sampled using pooling layers with stride greater than\
    \ one to match the smaller input size. Down-sampling larger information is important\
    \ because the output layer requires information to be of the same size.\n\nThe\
    \ hyperparameters Width and Height set the size of the neighborhood, as seen in\
    \ Figure 2.16.\n\nFigure 2.16: Pooling Layers\n\n![](image/Image1039.jpg)\n\n\
    Each pooling function summarizes the neighborhood under examination. The POOL=\
    \ option is used to specify the type of summary to be used by the pooling layer.\
    \ Here is an example:\n\n```\nlayer={type=’POOL’ width=2 height=2 stride=2 pool=”max”\n\
    ```\n\nJust as with the convolution layers, the stride parameter controls the\
    \ movement size of the neighborhood. The neighborhood continues to move across\
    \ the input space until the entire space has been summarized, as seen in Figures\
    \ 2.17 and 2.18.\n\nFigure 2.17: Feature Map with Stride = 2\n\n![](image/Image1047.jpg)\n\
    \nFigure 2.18: Completed Feature Map\n\n![](image/Image1058.jpg)\n\nTraditional\
    \ Layers\n\nFully Connected Layer\n\nNeurons in a fully connected layer have full\
    \ connections to all activations in the previous layer, as seen in regular neural\
    \ networks. Their activations can therefore be computed with a matrix multiplication\
    \ followed by a bias offset. A fully connected layer incorporates a large number\
    \ of parameters and therefore is expensive to train.\n\nOutput Layer\n\nThe output\
    \ layer is essentially a fully connected layer that is associated with a particular\
    \ error function. In this case of a binary target, the cross entropy error function\n\
    \n![](image/Image1065.png)\n\nis simplified to an equivalent Bernoulli error function:\n\
    \n![](image/Image1073.png)\n\nIf the target’s outcome has more than two levels,\
    \ then the error function resolves to\n\n![](image/Image10801.png)\n\nwhere![](image/Image1087.png)is\
    \ the class label for observation![](image/Image1095.png).\n\nIf the target is\
    \ binary, the logistic activation function is used:\n\n![](image/Image1103.png),\
    \ where ![](image/Image1112.png)\n\nThe logistic activation function constrains\
    \ its output to the range 0:1, making it ideal for generating probability (![](image/Image1123.png))\
    \ estimates. In statistics, the logistic function is better known as the logit-link\
    \ function:\n\n![](image/Image1135.png)\\= ln(odds)\n\nIf you are fitting a multinomial\
    \ target, the softmax activation function (see below) is appropriate. It is the\
    \ inverse of the generalized logit-link function.\n\n![](image/Image1142.png)\n\
    \nBecause softmax divides the output activation of each neuron by the sum of the\
    \ output by all participating neurons, it ensures that the estimates sum to 1.\
    \ This produces a distributed effect.\n\nTypes of Skip-Layer Connections\n\nDeep\
    \ convolutional neural networks developed for image classification exploit the\
    \ ability to enrich features by increasing the number of stacked layers. However,\
    \ adding more layers might sometimes cause information learned early in the network\
    \ to be forgotten as the gradient vanishes. Normalization techniques such as batch\
    \ normalization have been successful in damping the wild gradient swings, largely\
    \ addressing the convergence problems. Furthermore, adding skip-layer connections\
    \ can help the neural network remember latent features learned early in the structure.\
    \ A visualization of a skip-layer connection can be seen in Figure 2.19.\n\nFigure\
    \ 2.19: Skip-Layer Connection\n\n![](image/Image1150.jpg)\n\nConcatenation and\
    \ residual layers can be leveraged to create skip-layer connections. Concatenation\
    \ layers can be used to create skip-layer connections (see Figure 2.20), but the\
    \ concatenation operation results in “fat” networks, which are expensive to process.\
    \ \n\n```\nAddLayer / model=’ModelName’ name=’LayerName’ layer={type=’concat’}\
    \  \n           srcLayers={‘A’,’B’,’C’,’D’};\n```\n\nFigure 2.20: Concatenation\
    \ Layers\n\n![](image/Image1158.jpg)\n\nResidual layers were introduced by Kaiming\
    \ He et al. as a means of combining information from skip-layer connections, as\
    \ seen in Figure 2.21. Residual layers “thin out” the network because matching\
    \ columns of information are summed, as opposed to concatenated. Use TYPE= ‘RESIDUAL’\
    \ to add a residual layer.\n\n```\nAddLayer / model=’ModelName’ name=’LayerName’\
    \  \n           layer={type=’residual’} srcLayers={‘A’,’B’,’C’,’D’};\n```\n\n\
    Figure 2.21: Residual Layers\n\n![](image/Image1167.jpg)\n\nDemonstration 1: Loading\
    \ and Preparing Image Data\n\nThis demonstration illustrates loading and preparing\
    \ image data using the SAS Image action set.\n\n1\\. Open the program titled DLUS02D01.sas\
    \ and examine the program contents in the code editor window. First, the Image\
    \ action set is loaded, and a metadata table describing the images is created.\
    \ The loadImages action reads images and associated metadata into memory. The\
    \ loadImages action can upload information from a variety of sources, including\
    \ these:\n\n◦ photographic image files\n\n◦ biomedical image files, including\
    \ those in Digital Imaging and Communications in Medicine (DICOM) format\n\n◦\
    \ ZIP files\n\n◦ a directory that contains image files or ZIP files\n\n◦ a directory\
    \ that contains one or more series of photographic or biomedical images\n\n◦ a\
    \ directory tree that contains any number of the preceding items\n\n◦ URLs\n\n\
    ◦ lists that contain combinations of the sources in the preceding items\n\nThe\
    \ output contains images in a CAS table in encoded or decoded format, depending\
    \ on the value of the decode input parameter. When this parameter is set to False\
    \ (default value), the output table has the following columns:\n\n◦ \\_id\\_ –\
    \ an integer that is unique for each image\n\n◦ \\_path\\_ – the full pathname\
    \ of the image\n\n◦ \\_image\\_ – a binary large object that contains the entire\
    \ image file\n\n◦ \\_size\\_ – the byte length of the binary large object in the\
    \ \\_image\\_ column\n\n◦ \\_type\\_ – a three-character string that specifies\
    \ the format of the image (for example, jpg for JPG images)\n\nWhen the decode parameter\
    \ is set to True, the \\_image\\_ column contains decompressed image data, and\
    \ the output table has these additional columns:\n\n◦ \\_dimension\\_ – number\
    \ of dimensions of the image (for example, 2 for two-dimensional images, 3 for\
    \ three-dimensional images)"
