    注意：对于单机服务器上的 SGD 或分布式服务器上使用单个 worker 的会话，当操作通过一次数据时，即达到一个 epoch。对于使用多个 worker
    的会话，当所有 worker 均与控制器交换一次权重时，即达到一个 epoch。`syncFreq` 参数指定了每个 worker 在与控制器交换权重之前通过数据的次数。


    `TUNEITER` 属性指定了运行调优算法的迭代次数。调优算法的每次迭代使用指定的 `maxEpochs` 对所有激活的超参数集进行模型训练。具有最佳验证拟合误差的超参数在未来的调优迭代中将保持激活状态。


    `NUMTRIALS` 属性指定了在调优过程开始时尝试的超参数集数量。例如，将该属性指定为 100 将将开始训练 100 个具有不同超参数值的模型。


    `TUNERETENTION` 属性决定了每次调优迭代后保留的超参数配置比例。


    `TUNERESTART` 指定了重启参数调优过程的次数，使用之前搜索中提供的可用权重以及新选择的参数集。


    为 `maxepochs`、`tuneiter`、`numtrials`、`tuneretention` 和 `tunerestart` 选择一组合适的调优值并非易事。一种常见的方法是将
    `maxepochs` 设置为一个较小的值，以便为超参数组合（`numtrials`）分配较大的值。这种方法似乎意味着，对于超参数搜索方法，模型参数估计（权重）的重要性可能低于模型的特征。无论这是否真实，在某些情况下需要采用替代方法。例如，假设你模型当前的迭代图类似于图
    3.35。


    图 3.35：当前迭代图


    ![](img/Image3363.png)


    此时，逻辑上的做法是搜索 `L1` 和 `L2` 正则化值，以降低模型的方差。将 `maxepochs` 值设置为较小的数（如四），可能会导致过程在性能低下的峰值处评估每个超参数组合的性能，如图
    3.36 所示。


    图 3.36：将 Maxepochs 设置为小值


    ![](img/Image3370.png)


    在训练过程的此点评估模型可能会倾向于选择较大的 `L1` 和 `L2` 值，因为较大的值会限制权重的增长，这可能导致模型对数据中信息的响应能力降低。这意味着，较大的
    `L1` 和 `L2` 值在第四 epoch 似乎具有更优的性能，因为在过程早期观察到的退化会被抑制。但大 `L1` 和 `L2` 权重值从长期来看真的是模型“最佳”的吗？人们推测答案是“否”，因为模型将难以捕捉数据中可能存在的不那么明显的单一特征。因此，在这个例中，将
    `maxepochs` 设置为较大的值可能是最好的，以避免在训练早期观察到的低性能峰值处评估超参数组合，如图 3.37 所示。


    图 3.37：将 Maxepochs 设置为较大值


    ![](img/Image3378.png)


    在设置调优参数时，必须考虑业务问题以及模型与数据的交互。


