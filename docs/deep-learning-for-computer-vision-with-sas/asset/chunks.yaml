  trans: '

    YOLO 将单个 CNN 应用于整幅图像，然后将图像划分为区域（通常是 13 x 13 的网格单元）。然后，对于每个区域，YOLO 预测固定数量的边界框和相关的物体分类概率。每个区域的锚点框（Anchor
    boxes）为预测的物体尺寸提供了预设值，而实际预测则会对锚点框进行修正。锚点框通常使用 k-means 聚类针对给定数据集获取。最终检测结果通过对预测概率应用阈值操作和非极大值抑制（non-maximum
    suppression）获得。


    # 数据准备与预测概述


    模型现在学习的数据已经扩展，包含了描述一个或多个物体空间动态特征的信息。根据所使用的格式，描述物体位置的预测可以通过以下三种方式呈现：


    1. `RECT`：使用 `RECT` 格式表示像素单位的坐标 `[xleft, ytop, width, height]`。

    2. `YOLO`：使用 `YOLO` 格式表示归一化图像尺寸的坐标 `[xMiddle, yMiddle, width, height]`（通过坐标除以图像尺寸获得）。

    3. `COCO`：使用 `COCO` 格式表示像素单位的坐标 `[xmin, ymin, xmax, ymax]`。


    除了描述物体位置的输出变量外，还包含一个描述物体数量的输出变量。本章专注于 `YOLO` 格式，它包含了四个描述物体位置的归一化变量。值的归一化确保在使用缩放变换时对目标位置的精度损失最小。


    * `_Objectn_x` 对应物体的归一化水平位置。

    * `_Objectn_y` 对应物体的归一化垂直位置。

    * `_Objectn_width` 对应边界框的归一化宽度。

    * `_Objectn_height` 对应边界框的归一化高度。


    ## 非归一化数据


    在某些情况下，提供的数据不是归一化的。例如，考虑 `xmin`、`xmax`、`ymin` 和 `ymax` 代表 500x400 图像中未归一化的像素值的情况。归一化值通过将每个
    `x` 和 `y` 坐标除以相应平面的最大值计算（即 `xmin/500`、`xmax/500`、`ymin/400` 和 `ymax/400`）。


    以下方程将归一化的 `xmin`、`xmax`、`ymin` 和 `ymax` 值转换为 YOLO 格式的值值：


    ```

    _objectn_x=.5(x min + x max)

    _objectn_y=.5(y min + y max)

    _objectn_width=(x max - x min)

    _objectn_height=(y max - y min)

    ```


    其中 `n` 代表物体编号。


    ## 归一化位置


    考虑下面的示例，图 4.2 中感兴趣的物体是一个正在钓鱼的人。二维图像中的像素代表 X 轴和 Y 轴网格上的坐标。网格本身可以被视为图像的归一化表示，其中左上角的像素坐标为
    (0,0)，右下角的像素坐标为 (1,1)。变量 `_objectn_x` 和 `_objectn_y` 提供了物体的归一化原点。例如，该渔民位于 X 轴末端值方向约
    70.5% 处。


    图 4.2：归一化位置，`objectn_x` 和 `objectn_y`


    ![](img/Image881.jpg)


    这意味着渔民的原点位于图像右侧的 70.5% 处。同样，渔民位于 Y 轴末端值方向的 73% 处（即从上到下的距离的 73%）。`_objectn_x` 和
    `_objectn_y` 的组合提供了渔民的归一化原点。


    变量 `_objectn_width` 和 `_objectn_height` 提供了物体各自的归一化宽度和高度，如图 4.3 所示。物体的原点（在本例中为渔民的原点）位于框的中心。这意味着宽度和高度从渔民的原点向等距离距离延伸。


    图 4.3：归一化位置，`objectn_width` 和 `objectn_height`


    ![](img/Image890.jpg)


    注意，框的宽度大约是图像宽度的 10%，边界框的高度约为图片高度的四分之一，即 23%。


    ## 多损失误差函数


    YOLOv2 的多损失函数结合了多个误差函数，并尝试平衡模型在分类和定位预测任务之间的关注点。预测任务关注以下四个领域：


    * 边界框误差 ![](img/ML1Eq.jpg)

    * `+ 真置信度误差` ![](img/ML2Eq.jpg)

    * `+ 假置信度误差` ![](img/ML3Eq.jpg)

    * `+ 分类误差` ![](img/ML4Eq.jpg)


    如图 4.4 所示，图像被分为 S x S 的单元格矩阵。在每个单元格中，都会预测多个边界框 ![](img/Image898.png)。每个预测都包含边界框的中心位置、边界框误差的宽度和高度、预测为物体的概率（真置信和假置信误差的来源）以及分类概率（分类误差的来源）。预测的边界框数量由锚点框的数量决定。锚点框将在后文中讨论。![](img/Image905.png)
    如果预测 ![](img/Image913.png) 正确，则值为 1。


    图 4.4：YOLOv2 多损失误差函数


    ![](img/Image969.jpg)


    如果单元格不包含感兴趣的物体，则 ![](img/Image976.png)，多损失函数变为简单的平方误差函数：![](img/Image984.png)，其中
    ![](img/Image991.png) 代表单元格内预测 ![](img/Image913.png) 为物体的概率。如果单元格包含感兴趣的物体，则 ![](img/Image1014.png)，多损失函数下降
    ![](img/Image1023.png) 并简化为：![](img/Image1034.png)，其中 ![](img/Image1046.png) 代表相对于锚点框的坐标偏移，而
    ![](img/Image1056.png) 代表该预测所负责的标注物体边界框的坐标偏移。


    '
