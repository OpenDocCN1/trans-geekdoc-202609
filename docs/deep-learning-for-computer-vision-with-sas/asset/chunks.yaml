  trans: '

    选择冻结哪些层取决于当前面临的问题。如果任务从源数据到目标数据是相同的，那么共享更靠近输出层的层是合理的。在这种情况下，可适应的层是那些靠近输入层的层。相反，如果相关信息主要存在于输入中，则应该冻结更靠近输入层的层，并让靠近输出层的层保持可适应状态。


    ### 无监督预训练


    `Autoencoders`（自动编码器）是一种无监督模型，已在无监督预训练中取得了某种成功。无监督方法的一个优点是源数据不需要标签。无监督预训练策略通常从结合源数据和目标数据的特征开始。随后在全量数据上训练
    `autoencoder`，以期捕获跨领域存在的信息。当源数据丰富而目标数据有限时，这种方法非常有用。然后，使用训练好的 `autoencoder` 对目标数据进行评分（推理），并提取编码投影。这些编码器将连同原始目标特征一起作为输入提供给目标学习器。Glorot
    等人 (2011) 已经证明了使用堆叠去噪自动编码器进行无监督迁移学习是有效的。


    去噪自动编码器由 Vincent 等人 (2010) 引入，是一种在损坏（扰动）的输入上训练的自动编码器。对输入进行损坏只需简单对输入层应用 `dropout`。去噪自动编码器的一种流行变体
    `stacked denoising autoencoder`（堆叠去噪自动编码器）。


    `stacked denoising autoencoder` 是通过逐层贪婪地训练的。这意味着第一层在扰动输入上经过彻底训练，然后被冻结。随后将扰动输入替换为未扰动的输入，并对下一层进行彻底训练。该层冻结后，重复此过程直到输出层训练完成。


    自动编码器的另一种变体 `sparse autoencoders`（稀疏自动编码器）。`Sparse autoencoders` 在目标函数中引入了约束。可以使用
    `L1` 和 `L2` 正化作为约束机制来生成稀疏自动编码器。


    ### 使用 FCMP 进行自定义


    有时，数据科学家希望为模型创建自定义函数，以更好地适应可用默认函数无法提供的特定深度学习需求。SAS 中的深度学习工具允许您使用 `SAS Function
    Compiler`（`FCMP`）来创建和修改用于深度神经网络激活函数和误差函数的自定义定义。`FCMP` 是一种编程工具，您可以结合 SAS 中的深度学习操作使用它，以生成自己的自定义深度学习实体：


    * 激活函数

    * 误差函数

    * 模型层变为*学习率策略


    自定义的 `FCMP` 网络层、函数和学习率策略是执行不同深度学习任务的独立实体。它们的共同点是，所有自定义层、自定义激活函数和误差函数以及自定义学习率策略都是为了通过
    `FCMP` 用于 SAS 深度学习而创建的。


    `FCMP` 操作的参数可以在文档中找到。


    ### 调整深度学习模型


    #### 选择超参数


    机器学习算法创建的预测模型的质量取决于控制训练过程和模型结构的各种属性值。代表这些属性的参数称为`hyperparameters`。对于遗传算法或贝叶斯优化方法，搜索深度神经网络的超参数空间可能极其昂贵，因为这些方法需要对每种超参数组合进行训练，直到算法收敛。另一种，`Hyperband`
    方法（Li 等人，2017）是密集模型结构的一种良好方法，因为资源会自适应地分配给最有前景的候选方案。


    #### 采样超参数空间


    `dlTune` 操作实现了 `Hyperband` 方法，并开始使用 `Latin hypercube sampling`（拉丁超立方采样）选择超参数。相比
    `simple random`（简单随机），`Latin hypercube sample` 更为优，因为它确保了空间中的点大致等距。


    为了避免过拟合，使用留存样本来评估超参数。`dlTune` 操作使用 `Hyperband` 方法按比例分配资源。根据 `TUNERETENTION` 属性剔除性能较差的集合。

    '
