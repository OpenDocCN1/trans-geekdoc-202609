- raw: "However, when using multiple GPUs, the observations in the mini-batch are\
    \ distributed over the GPUs. It would be very inefficient to try to synchronize\
    \ each GPU’s batch normalization calculations for each batch normalization layer.\
    \ Instead, each GPU calculates the required statistics using a subset of available\
    \ observations and uses those statistics to perform the transformation on those\
    \ observations.\n\nResearch communities are still debating whether small or large\
    \ minibatch sizes yield better performance. However, when a minibatch of observations\
    \ is distributed across multiple GPUs, and the model contains batch normalization\
    \ layers, the deep learning team at SAS recommends that you use reasonably large-sized\
    \ mini-batches on each GPU so that the statistics will be stable.\n\nIn addition\
    \ to calculating feature map statistics on each mini-batch, the batch normalization\
    \ algorithm also needs to calculate statistics over the entire training data set\
    \ before saving the training weights. These statistics are the ones used for scoring\
    \ (whereas the mini-batch statistics are used for training). Rather than perform\
    \ an extra epoch at the end of training, the statistics from each mini-batch are\
    \ averaged over the course of the last training epoch to create the epoch statistics.\n\
    \nThe statistics computed in this way are a close approximation to the more complicated\
    \ computation that uses an extra epoch with fixed weights (as long as the weights\
    \ in the last epoch do not change much) after each mini-batch of the epoch. (This\
    \ is usually the case for the last training epoch.) When using multiple GPUs,\
    \ this calculation is performed exactly the same way as when using a single GPU.\
    \ That is, the statistics for each mini-batch on each GPU are averaged after each\
    \ mini-batch to compute the final epoch statistics for scoring.\n\nTraditional\
    \ Neural Networks versus Deep Learning\n\nRecall the differences between traditional\
    \ neural networks and deep learning are shown in Table 1.2. Traditional neural\
    \ networks leveraged the computation of a single central processing unit (CPU)\
    \ to train the model. However, graphical processing units (GPUs) have a design\
    \ that naturally fits well with the structure and learning process of neural networks.\
    \ There have been promising developments in the use of CPUs grouped together that\
    \ use a fixed-point architecture as opposed to a floating-point architecture (Vanhoucke\
    \ et al. 2011). The details of the distribution of computation is a deeply complex\
    \ topic and remains outside the scope of this book, although this brief comparison\
    \ of CPUs to GPUs is provided in Table 1.2.\n\nTable 1.2: Comparison of Central\
    \ Processing Units and Graphical Processing Units\n\n| Central Processing Unit\
    \ (CPU) || Graphical Processing Unit (GPU) |\n\n| --- | --- |\n\n| Faster Clock\
    \ Speed || Slower Clock Speed |\n\n| Fewer Processing Units || More Processing\
    \ Units |\n\n| More Branching || Less Branching |\n\n| Less Memory Bandwidth ||\
    \ More Memory Bandwidth |\n\nThe optimization techniques used to adjust the weights\
    \ of a neural network are iterative processes. However, within each iteration,\
    \ the weights are updated simultaneously. Therefore, calculations corresponding\
    \ to each weight update can be distributed among processing units. GPUs are designed\
    \ to perform many operations in parallel, which fits nicely with the weight update\
    \ process used by neural networks.\n\nThe use of GPUs should be reserved for larger\
    \ neural networks because the difference in performance between CPUs and GPUs\
    \ is negligible in neural networks with a small number of parameters.\n\nDeep\
    \ Learning Actions\n\nAs an integrated part of the SAS Platform, SAS Viya is a\
    \ cloud-enabled, in-memory analytics engine that provides quick, accurate, and\
    \ reliable analytical insights. SAS Viya offers a rich set of data mining and\
    \ machine learning capabilities that run on a robust in-memory distributed computing\
    \ infrastructure that provides a single environment that is unified, open, powerful,\
    \ and cloud ready.\n\nThe SAS Cloud Analytic Services actions can be surfaced\
    \ through SAS Viya on a number of interfaces, including SAS Studio and Jupyter\
    \ notebook.\n\nThis book highlights three of the deep learning actions in SAS\
    \ Cloud Analytic Services (CAS):\n\n● deep feed-forward neural network (DNN)\n\
    \n● convolutional neural network (CNN)\n\n● recurrent neural network (RNN)\n\n\
    DNN actions are used to solve more traditional classification problems, such as\
    \ fraud detection. CNN actions are commonly used to build more advanced neural\
    \ networks for either traditional or computer vision data problems. An RNN is\
    \ used to solve problems for data that is some function of a sequence, such as\
    \ time series or text analyses.\n\nSAS deep learning actions can be called using\
    \ several programming languages, including SAS, R, and Python. This book focuses\
    \ on the use of SAS to call Cloud Analytic Services through the CAS procedure.\n\
    \nThe CAS procedure enables you to interact with SAS Cloud Analytic Services from\
    \ the SAS client by providing a programming environment based on the CASL language\
    \ specification. The programming environment enables you to run CAS actions and\
    \ use the results to prepare the parameters for another action. Code is formatted\
    \ as\n\n```\nPROC CAS;\n```\n\n```\n     <CASL code>\n```\n\n```\nQuit;\n```\n\
    \nAn example of this is\n\n```\nPROC CAS < exc >< noqueue >;\n```\n\n```\nBuildModel/\
    \ modeltable={name=”<Model table name >”} \n```\n\n```\n            type=”DNN”;\n\
    ```\n\n```\nQuit;\n```\n\nFor CNNs and RNNs, replace the type=“DNN” with type=“CNN”\
    \ and type=“RNN”, respectively.\n\nThe CAS procedure has several features that\
    \ enable you to perform the following operations:\n\n● run any CAS action that\
    \ is supported by the server, even if the action did not exist at the time of\
    \ the release\n\n● use multiple sessions to perform asynchronous execution\n\n\
    ● operate on parameters and results as variables using the full function expression\
    \ parser\n\n● import your own executables that define callable functions\n\nOptional\
    \ arguments such as those below can be used in the PROC CAS statement.\n\n● EXC:\
    \ Executes the CASL code as soon as the previous block of code has completed processing.\
    \ The default option does not execute CASL code until a RUN statement is entered.\n\
    \n● NOQUEUE: Forces output to be displayed as soon as output is produced.\n\n\
    Note: Global statements, SAS macro code, and RUN statements do not terminate the\
    \ CAS procedure.\n\nBuilding a Deep Neural Network\n\nDeep neural networks can\
    \ be created using the following code:\n\n```\nPROC CAS < exc ><noqueue >;\n```\n\
    \n```\nBuildModel/ modeltable={name=”<model table name >”} type =”DNN”;\n```\n\
    \n```\nAddLayer/ \n```\n\n```\n      modeltable=”<model table name >”\n```\n\n\
    ```\n      name=”<name of layer >”\n```\n\n```\n      layer={type=”layer type”\
    \ \n```\n\n```\n         n=”< number of hidden units >”\n```\n\n```\n        \
    \ act=”< type of activation transformation >”\n```\n\n```\n         init=”< weight\
    \ initialization method >”}\n```\n\n```\n      srcLayers={“< previous layer name\
    \ >”};\n```\n\n```\nQuit;\n```\n\nThe AddLayer action is used to add a layer to\
    \ a deep learning neural network. Table 1.3 provides examples of different types\
    \ of layers that are used throughout the book.\n\nTable 1.3: Layer Types\n\n|\
    \ Type || Details || Example |\n\n| --- | --- | --- |\n\n| INPUT || Input Layer\
    \ || layer={type=’input’} |\n\n| CONVO/CONVOLUTION || Convolutional Layer || layer={type=’convolution’\
    \ nFilters=32 width=5 height=5 stride=1 act=’tanh’ } |\n\n| POOLING || Pooling\
    \ Layer || layer={type=’pooling’ width=2 height=2 stride=2} |\n\n| FC/FULLCONNECT\
    \ || Fully connected Layer || layer={type=’fullconnect’ n=50 act=’sigmoid’ } |\n\
    \n| OUTPUT || Output Layer || layer={type=’output’ act=’softmax’ } |\n\n| RESIDUAL\
    \ || Residual Layer || layer={type=’residual’ } |\n\n| BATCHNORM || Batch Normalization\
    \ || layer={type=’batchnorm’ act=’ELU’} |\n\n| CONCAT || Concatenation Layer ||\
    \ layer={type=’concat’} |\n\n| FCMP || FCMP Layer || layer={type=’FCMP’, forwardFunc=’forward\\\
    _prop’,  \n\nbackwardFunc=’back\\_prop’, height=1,  \n\nwidth=40, depth=1, nweights=1280}\
    \ |"
