- raw: "● activation functions that are more resistant to saturation than conventional\
    \ activation functions\n\n● fast moving gradient-based optimizations such as Stochastic\
    \ Gradient Descent and ADAM\n\n● weight initializations that consider the amount\
    \ of incoming information\n\n● new regularization techniques such as dropout and\
    \ batch normalization\n\n● innovations in distributed computing.\n\nThe elements\
    \ outlined above are included in today’s SAS software and are described below.\
    \ Needless to say, deep learning has shown impressive promise in solving problems\
    \ that were previously considered infeasible to solve.\n\nThe process of deep\
    \ learning is to formulate an outcome from engineering new glimpses of the input\
    \ space, and then reengineering these engineered projections with the next hidden\
    \ layer. This process is repeated for each hidden layer until the output layers\
    \ are reached. The output layers reconcile the final layer of incoming hidden\
    \ unit information to produce a set of outputs. The classic example of this process\
    \ is facial recognition. The first hidden layer captures shades of the image.\
    \ The next hidden layer combines the shades to formulate edges. The next hidden\
    \ layer combines these edges to create projections of ears, mouths, noses, and\
    \ other distinct aspects that define a human face. The next layer combines these\
    \ distinct formulations to create a projection of a more complete human face.\
    \ And so on. A brief comparison of traditional neural networks and deep learning\
    \ is shown in Table 1.1.\n\nTable 1.1: Traditional Neural Networks versus Deep\
    \ Learning\n\n| Aspect || Traditional || Deep Learning |\n\n| --- | --- | ---\
    \ |\n\n| Hidden activation  \n\nfunction(s) || Hyperbolic Tangent (tanh) || Rectified\
    \ Linear (ReLU)  \n\nand other variants |\n\n| Gradient-based  \n\nlearning ||\
    \ Batch GD and  \n\nBFGS || Stochastic GD,  \n\nAdam, and LBFGS |\n\n| Weight\
    \ initialization || Constant Variance || Normalized Variance |\n\n| Regularization\
    \ || Early Stopping, L1,  \n\nand L2 || Early Stopping, L1, L2,  \n\nDropout,\
    \ and Batch  \n\nNormalization |\n\n| Processor || CPU || CPU or GPU |\n\nDeep\
    \ learning incorporates activation functions that are more resistant to neuron\
    \ saturation than conventional activation functions. One of the classic characteristics\
    \ of traditional neural networks was the infamous use of sigmoidal transformations\
    \ in hidden units. Sigmoidal transformations are problematic for gradient-based\
    \ learning because the sigmoid has two asymptotic regions that can saturate (that\
    \ is, gradient of the output is near zero). The red or deeper shaded outer areas\
    \ represent areas of saturation. See Figure 1.2.\n\nFigure 1.2: Hyperbolic Tangent\
    \ Function\n\n![](image/Image938.jpg)\n\nOn the other hand, a linear transformation\
    \ such as an identity poses little issue for gradient-based learning because the\
    \ gradient is a constant. However, the use of linear transformations negates the\
    \ benefits provided by nonlinear transformations (that is, approximate nonlinear\
    \ relationships).\n\nRectified linear transformation (or ReLU) consists of piecewise\
    \ linear transformations that, when combined, can approximate nonlinear functions.\
    \ (See Figure 1.3.)\n\nFigure 1.3: Rectified Linear Function\n\n![](image/Image946.jpg)\n\
    \nIn the case of ReLU, the derivative for the active region output by the transformation\
    \ is 1 and 0 for the inactive region. The inactive region of the ReLU transformation\
    \ can be viewed as a weakness of the transformation because it inhibits the unit\
    \ from contributing to gradient-based learning.\n\nThe saturation of ReLU could\
    \ be somewhat mitigated by cleverly initializing the weights to avoid negative\
    \ output values. For example, consider a business scenario of modeling image data.\
    \ Each unstandardized input pixel value ranges between 0 and 255. In this case,\
    \ the weights could be initialized and constrained to be strictly positive to\
    \ avoid negative output values, avoiding the non-active output region of the ReLU.\n\
    \nOther variants of the rectified linear transformation exist that permit learning\
    \ to continue when the combination function resolves to a negative value. Most\
    \ notable of these is the exponential linear activation transformation (ELU) as\
    \ shown in Figure 1.4.\n\nFigure 1.4: Exponential Linear Function\n\n![](image/Image955.jpg)\n\
    \nSAS researchers have observed better performance when ELU is used instead of\
    \ ReLU in convolutional neural networks in some cases. SAS includes other, popular\
    \ activation functions that are not shown here, such as softplus and leaky. Additionally,\
    \ you can create your own activation functions in SAS using the SAS Function Compiler\
    \ (or FCMP).\n\nNote: Convolutional neural networks (CNNs) are a class of artificial\
    \ neural networks. CNNs are widely used in image recognition and classification.\
    \ Like regular neural networks, a CNN consists of multiple layers and a number\
    \ of neurons. CNNs are well suited for image data, but they can also be used for\
    \ other problems such as natural language processing. CNNs are detailed in Chapter\
    \ 2.\n\nThe error function defines a surface in the parameter space. If it is\
    \ a linear model fit by least squares, the error surface is convex with a unique\
    \ minimum. However, in a nonlinear model, this error surface is often a complex\
    \ landscape consisting of numerous deep valleys, steep cliffs, and long-reaching\
    \ plateaus.\n\nTo efficiently search this landscape for an error minimum, optimization\
    \ must be used. The optimization methods use local features of the error surface\
    \ to guide their descent. Specifically,  \n\nthe parameters associated with a\
    \ given error minimum are located using the following procedure:\n\n1\\. Initialize\
    \ the weight vector to small random values, w(0).\n\n2\\. Use an optimization\
    \ method to determine the update vector, δ(t).\n\n3\\. Add the update vector to\
    \ the weight values from the previous iteration to generate new estimates:\n\n\
    ![](image/Eq3.jpg)\n\n4\\. If none of the specified convergence criteria have\
    \ been achieved, then go back to step 2.\n\nHere are the three conditions under\
    \ which convergence is declared:\n\n1\\. when the specified error function stops\
    \ improving\n\n2\\. if the gradient has no slope (implying that a minimum has\
    \ been reached)\n\n3\\. if the magnitude of the parameters stops changing substantially\n\
    \nBatch Gradient Descent\n\nRe-invented several times, the back propagation (backprop)\
    \ algorithm initially just used gradient descent to determine an appropriate set\
    \ of weights. The gradient,![](image/Image972.png), is the vector of partial derivatives\
    \ of the error function with respect to the weights. It points in the steepest\
    \ direction uphill. (See Figure 1.5.)\n\nFigure 1.5: Batch Gradient Descent\n\n\
    ![](image/Image980.jpg)\n\nBy negating the step size (that is, learning rate)\
    \ parameter,η, a step is made in the direction that is locally steepest downhill:\n\
    \n![](image/Eq_pg_8.jpg)\n\nThe parameters associated with a given error minimum\
    \ are located using the following procedure:\n\n1\\. Initialize the weight vector\
    \ to small random values, w(0).\n\n2\\. Use an optimization method to determine\
    \ the update vector, δ(t).\n\n3\\. Add the update vector to the weight values\
    \ from the previous iteration to generate new estimates:\n\n![](image/Eq_pg_9-1.jpg)\n\
    \n4\\. If none of the specified convergence criteria has been achieved, then back\
    \ go to step 2.\n\nUnfortunately, as gradient descent approaches the desired weights,\
    \ it exhibits numerous back-and-forth movements known as hemstitching. To control\
    \ the training iterations wasted in this hemstitching, later versions of back\
    \ propagation included a momentum term, yielding the modern update rule:\n\n![](image/Eq_pg_9-2.jpg)\n\
    \nThe momentum term retains the last update vector, δ(t-1), using this information\
    \ to “dampen” potentially oscillating search paths. The cost is an extra learning\
    \ rate parameter (0 ≤ α ≤ 1) that must be set. This updated rule uses all the\
    \ training observations (t) to calculate the exact gradient on each descent step.\
    \ This results in a smooth progression to the gradient minima.\n\nStochastic Gradient\
    \ Descent"
  fmt: '

    * activation functions that are more resistant to saturation than conventional
    activation functions

    * fast moving gradient-based optimizations such as `Stochastic Gradient Descent`
    and `ADAM`

    * weight initializations that consider the amount of incoming information

    * new regularization techniques such as `dropout` and `batch normalization`

    * innovations in distributed computing.


    The elements outlined above are included in today’s SAS software and are described
    below. Needless to say, deep learning has shown impressive promise in solving
    problems that were previously considered infeasible to solve.


    The process of deep learning is to formulate an outcome from engineering new glimpses
    of the input space, and then reengineering these engineered projections with the
    next hidden layer. This process is repeated for each hidden layer until the output
    layers are reached. The output layers reconcile the final layer of incoming hidden
    unit information to produce a set of outputs. The classic example of this process
    is facial recognition. The first hidden layer captures shades of the image. The
    next hidden layer combines the shades to formulate edges. The next hidden layer
    combines these edges to create projections of ears, mouths, noses, and other distinct
    aspects that define a human face. The next layer combines these distinct formulations
    to create a projection of a more complete human face. And so on. A brief comparison
    of traditional neural networks and deep learning is shown in Table 1.1.


    ### Table 1.1: Traditional Neural Networks versus Deep Learning


    | Aspect | Traditional | Deep Learning |

    | --- | --- | --- |

    | Hidden activation function(s) | Hyperbolic Tangent (`tanh`) | Rectified Linear
    (`ReLU`) and other variants |

    | Gradient-based learning | `Batch GD` and `BFGS` | `Stochastic GD`, `Adam`, and
    `LBFGS` |

    | Weight initialization | Constant Variance | Normalized Variance |

    | Regularization | Early Stopping, `L1`, and `L2` | Early Stopping, `L1`, `L2`,
    `Dropout`, and `Batch Normalization` |

    | Processor | CPU | CPU or GPU |


    ### Activation Functions and Gradient


    Deep learning incorporates activation functions that are more resistant to neuron
    saturation than conventional activation functions. One of the classic characteristics
    of traditional neural networks was the infamous use of sigmoidal transformations
    in hidden units. Sigmoidal transformations are problematic for gradient-based
    learning because the sigmoid has two asymptotic regions that can saturate (that
    is, gradient of the output is near zero). The red or deeper shaded outer areas
    represent areas of saturation. See Figure 1.2.


    #### Figure 1.2: Hyperbolic Tangent Function

    ![](image/Image938.jpg)


    On the other hand, a linear transformation such as an identity poses little issue
    for gradient-based learning because the gradient is a constant. However, the use
    of linear transformations negates the benefits provided by nonlinear transformations
    (that is, approximate nonlinear relationships).


    Rectified linear transformation (or `ReLU`) consists of piecewise linear transformations
    that, when combined, can approximate nonlinear functions. (See Figure 1.3.)


    #### Figure 1.3: Rectified Linear Function

    ![](image/Image946.jpg)


    In the case of `ReLU`, the derivative for the active region output by the transformation
    is 1 and 0 for the inactive region. The inactive region of the `ReLU` transformation
    can be viewed as a weakness of the transformation because it inhibits the unit
    from contributing to gradient-based learning.


    The saturation of `ReLU` could be somewhat mitigated by cleverly initializing
    the weights to avoid negative output values. For example, consider a business
    scenario of modeling image data. Each unstandardized input pixel value ranges
    between 0 and 255. In this case, the weights could be initialized and constrained
    to be strictly positive to avoid negative output values, avoiding the non-active
    output region of the `ReLU`.


    Other variants of the rectified linear transformation exist that permit learning
    to continue when the combination function resolves to a negative value. Most notable
    of these is the exponential linear activation transformation (`ELU`) as shown
    in Figure 1.4.


    #### Figure 1.4: Exponential Linear Function

    ![](image/Image955.jpg)


    SAS researchers have observed better performance when `ELU` is used instead of
    `ReLU` in convolutional neural networks in some cases. SAS includes other, popular
    activation functions that are not shown here, such as `softplus` and `leaky`.
    Additionally, you can create your own activation functions in SAS using the SAS
    Function Compiler (or `FCMP`).


    > **Note:** Convolutional neural networks (`CNNs`) are a class of artificial neural
    networks. `CNNs` are widely used in image recognition and classification. Like
    regular neural networks, a `CNN` consists of multiple layers and a number of neurons.
    `CNNs` are well suited for image data, but they can also be used for other problems
    such as natural language processing. `CNNs` are detailed in Chapter 2.


    ### Error Functions and Optimization


    The error function defines a surface in the parameter space. If it is a linear
    model fit by least squares, the error surface is convex with a unique minimum.
    However, in a nonlinear model, this error surface is often a complex landscape
    consisting of numerous valleys, steep cliffs, and long-reaching plateaus. To efficiently
    search this landscape for an error minimum, optimization must be used. Specifically,
    the parameters associated with a given error minimum are located using the following
    procedure:


    1. Initialize the weight vector to small random values, `w(0)`.

    2. Use an optimization method to determine the update vector, `δ(t)`.

    3. Add the update vector to the weight values from the previous iteration to generate
    new estimates:

    ```

    (equation)

    ```

    4. If none of the specified convergence criteria have been achieved, then back
    to step 2.


    Here are the three conditions under which convergence is declared:


    1. when the specified error function stops improving

    2. if the gradient has no slope (implying that a minimum has been reached)

    3. if the magnitude of the parameters stops changing


    #### Batch Gradient Descent


    Re-invented several times, the back propagation (`backprop`) algorithm initially
    just used gradient descent to determine an appropriate set of weights. The gradient,
    ![](image/972.png), is the vector of partial derivatives of the error function
    with respect to the weights. It points in the steepest direction uphill. (See
    Figure 1.5.)


    ##### Figure 1.5: Batch Gradient Descent

    ![](image/980.jpg)


    By negating the step size (that is, learning rate) parameter,`η`, a step is made
    in the direction that is locally downhill:

    ```

    (equation)

    ```


    The parameters associated with a given error minimum are located using following
    procedure:


    1. Initialize the weight vector to small random values, `w(0)`.

    2. Use an optimization method to determine the update vector, `δ(t)`.

    3. Add the update vector to the weight values from the previous iteration to generate
    new estimates:

    ```

    (equation)

    ```

    4. If none of the specified convergence criteria have been achieved, then back
    step 2.


    Unfortunately, as gradient descent approaches the desired weights, it exhibits
    numerous back-and-forth movements known as hemstitching. To control the training
    iterations wasted in this hemstitching, later versions of back propagation included
    a momentum term, yielding the modern update rule:

    ```

    (equation)

    ```


    The momentum term retains the last update vector, `δ(t-1)`, using this information
    to “dampen” potentially oscillating search paths. The cost is an extra learning
    rate parameter (0 ≤ α ≤ 1) that must be set. This updated rule uses all the training
    observations (`t`) to calculate the exact gradient on each descent step. This
    results in a smooth progression to the gradient minima.


    Stochastic Gradient Descent

