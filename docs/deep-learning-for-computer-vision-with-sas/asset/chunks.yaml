    \ Space](#Chapter_3.xhtml#_idTextAnchor103)\n\n[Hyperparameter Selection](#Chapter_3.xhtml#_idTextAnchor105)\n\
    \n[Hyperband Properties](#Chapter_3.xhtml#_idTextAnchor107)\n\nIntroduction\n\n\
    Most traditional data such as transaction or survey data does not contain the\
    \ “truth.” For example, knowing the actual quality of an individual’s moral fiber\
    \ could dramatically improve the accuracy of a fraud model, although there are\
    \ types of data in which the truth is contained. Image data is one example where\
    \ the truth is present because the elements that define an object exist in the\
    \ image, albeit two-dimensionally. It is therefore not surprising that a properly\
    \ trained neural network can outperform a layperson in image classification and\
    \ other vision-related tasks.\n\nThe focus of this chapter is to highlight simple\
    \ techniques that can be deployed to improve computer vision models.\n\nArchitectural\
    \ Design Strategies\n\nA 1 x 1 convolution is commonly used to change the dimensional\
    \ depth of information flowing through the network. A 1 x 1 kernel shares a single\
    \ weight across all columns of all channels of information, which produces a summarized\
    \ motif. (See Figure 3.1.)\n\nFigure 3.1: 1 x 1 Convolutions\n\n![](image/Image2949.jpg)\n\
    \nGoogLeNet deployed 1 x 1 convolutions to reduce the dimensional depth before\
    \ applying larger kernel filters, a technique referred to as bottlenecking (Szegedy\
    \ et al. 2014). Bottlenecking can reduce the computational cost associated with\
    \ training, enabling resources to be allocated toward other areas, such as increasing\
    \ cardinality or constructing a deeper, wider network structure. (See Figure 3.2.)\n\
    \nFigure 3.2: Dimensional Depth Reduction Before Feature Extraction\n\n![](image/Image2956.png)"
