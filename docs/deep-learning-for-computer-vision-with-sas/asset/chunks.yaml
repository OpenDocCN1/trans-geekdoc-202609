    \n![](image/Image1299.jpg)\n\nDemonstration: Using DLPy to Access SAS Deep Learning\
    \ Technologies: Part 2\n\nThis demonstration examines the results from the object\
    \ detection model that was run in the previous demo.\n\nThe example begins with\
