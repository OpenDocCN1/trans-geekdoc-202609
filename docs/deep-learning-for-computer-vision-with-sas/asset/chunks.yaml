  trans: '


    * 比传统激活函数更具抗饱和性的激活函数

    * 快速基于梯度的优化算法，如 `Stochastic Gradient Descent`（随机梯度下降）和 `ADAM`

    * 考虑输入信息量的权重初始化

    * 新的正则化技术，如 `dropout` 和 `batch normalization`（批量归一化）

    * 分布式计算的创新


    上述元素包含在今天的 SAS 软件中，并在下方进行了描述。无需赘言，深度学习在解决以前被认为无法解决的问题方面展现了令人印象目的前景。


    深度学习的过程是通过对输入空间进行工程化的新观察来制定结果，然后用下一个隐藏层对这些工程化后的投影进行重新工程。此过程对每个隐藏层重复，直到到达输出层。输出层协调传入的隐藏单元单元层信息，以产生一组输出。这一过程的经典示例是人脸识别。第一个隐藏层捕捉图像的阴调。下一个隐藏层将这些阴调组合以形成边缘。下一个隐藏层将这些边缘组合，创建出耳朵、嘴巴、鼻子以及定义人脸的其他不同特征的投影。下一层结合这些不同的特征方案，创建出更完整的人脸投影。以此类推。传统神经网络与深度学习的简要比较见表
    1.1。


    ### 表 1.1：传统神经网络与深度学习


    | 维度 | 传统 | 深度学习 |

    | --- | --- | --- |

    | 隐藏激活函数 | 双曲正切 (`tanh`) | 修正线性单元 (`ReLU`) 及其他变体 |

    | 基于梯度的学习 | `Batch GD` 和 `BFGS` | `Stochastic GD`、`Adam` 和 `LBFGS` |

    | 权重初始化 | 常数方差 | 归一化方差 |

    | 正则化 | 早停、`L1` 和 `L2` | 早停、`L1`、`L2`、`Dropout` 和 `Batch Normalization` |

    | 处理器 | CPU | CPU 或 GPU |


    ### 激活函数与梯度


    深度学习包含了比传统激活函数更抗神经元饱和的激活函数。传统神经网络的经典特征之一是在隐藏单元中使用臭名昭著的 sigmoid 变换。sigmoid 变换对于基于梯度的学习是有问题的，因为
    sigmoid 有两个可以饱和的渐近区域（即输出的梯度接近于零）。红色或更深阴影的外围区域代表饱和区域。见图 1.2。


    #### 图 1.2：双曲正切函数

    ![](img/Image938.jpg)


    另一方面，恒等变换等线性变换对基于梯度的学习几乎没有问题，因为梯度是一个常数。然而，使用线性变换抵消了非线性变换带来的优势（即近似非线性关系）。


    修正线性变换（或 `ReLU`）由分段线性变换组成，这些变换组合在一起可以近似非线性函数。（见图 1.3。）


    #### 图 1.3：修正线性函数

    ![](img/Image946.jpg)


    在 `ReLU` 的情况下，变换输出的活跃区域的导数为 1，不活跃区域为 0。`ReLU` 变换的不活跃区域可以被视为该变换的弱点，因为它抑制了单元对基于梯度的学习的贡献。


    `ReLU` 的饱和可以通过巧妙初始化权重以避免负输出值在某种程度上缓解。例如，考虑建模图像数据的业务场景。每个未标准化的输入像素值范围在 0 到 255
    之间。在这种情况下，可以将权重初始化并限制为严格正，以避免负输出值，从而避免 `ReLU` 的非活跃输出区域。


    其他修正线性变换的变体也允许当组合函数解析为负值时继续进行学习。其中最著名的是指数线性激活变换 (`ELU`)，如图 1.4 所示。


    #### 图 1.4：指数线性函数

    ![](img/Image955.jpg)


    SAS 研究人员观察到某些情况下卷积神经网络中使用 `ELU` 代替 `ReLU` 性能更好。SAS 还包含了此处未显示的其他流行激活函数，如 `softplus`
    和 `leaky`。此外，您可以使用 SAS 函数编译器（或 `FCMP`）在 SAS 中创建自己的激活函数。


    > **注意：** 卷积神经网络 (`CNNs`) 是一种人工神经网络。`CNNs` 广泛用于图像识别和分类。与普通神经网络一样，`CNN` 由多个层和许多神经元组成。`CNNs`
    非常适用于图像数据，但也可以用于自然语言处理等其他问题。第 2 章将详细介绍 `CNNs`。


    ### 误差函数与优化


    误差函数定义了参数空间中的一个表面。如果它是通过最小二乘法拟合的线性模型，则误差表面是凸的，具有唯一的最小值。然而，在非线性模型中，该误差表面通常是一个复杂的地形，由许多山谷、陡峭的悬崖和长高原组成。为了在该地形高效搜索误差最小值，必须使用优化。具体而言，与给定误差最小值相关的参数通过以下程序确定：


    1. 初始化权重向量为小的随机值，`w(0)`。

    2. 使用优化方法确定更新向量，`δ(t)`。

    3. 将更新向量添加到上一次迭代的权重值以生成新估计：

    ```

    (equation)

    ```

    4. 如果没有达到收敛标准，返回第 2 步。


    收敛的条件如下：


    1. 指定的误差函数停止改进

    2. 梯度没有斜率（意味着已达到最小值）

    3. 参数幅度停止变化


    #### 批量梯度下降


    反向传播 (`backprop`) 经过多次重新，最初仅使用梯度下降来确定合适的权重。梯度 ![](img/972.png) 是误差函数对权的偏导向量。它指向向上最陡的方向。（见图
    1.5。）


    ##### 图 1.5：批量梯度下降

    ![](img/980.jpg)


    通过否定步长（即学习率）参数 `η`，向局部向下的方向迈出一步：

    ```

    (equation)

    ```


    与给定误差最小值相关的参数通过以下程序确定：


    1. 初始化权重向量为小的随机值，`w(0)`。

    2. 使用优化方法确定更新向量，`δ(t)`。

    3. 将更新向量添加到上一次迭代的权重值以生成新估计：

    ```

    (equation)

    ```

    4. 如果没有达到收敛标准，返回第 2 步。


