- raw: 'You can also use 1 x 1 convolutions to expand the dimensional depth, and they
    are sometimes used in place of fully connected layers to save on computational
    cost, as shown in Figure 3.3.


    Figure 3.3: Using 1 x 1 Convolutions to Expand Dimensional Depth


    ![](image/Image2965.png)


    Spatial Exploration


    Filters extract spatially correlated information and transcribe that information
    to an output feature map. Spatial exploration techniques such as the use of filters
    of different sizes enables the model to capture varying levels of granularity,
    providing a more complete understanding of the region for which the filters are
    located. The information captured at varying magnitudes can then be combined in
    subsequent layers to form a more detailed explanation of the information.


    In addition, increasing the stride influences the exploration scheme of each filter
    and reduces the size of the output feature map. The width and height of output
    feature maps are reduced by larger stride values.


    Creating Blocks


    GoogLeNet combined 1 x 1 filters with spatial exploration to create blocks (Szegedy
    et al. 2014). A block is a stage of feature extraction that commonly consists
    of multiple convolutions that are usually stacked and then combined with either
    a concatenation layer or residual layer in a split-transform-merge strategy. (See
    Figure 3.4.)


    Figure 3.4: A Block


    ![](image/Image2973.jpg)


    A block differs from a hidden layer because blocks can consist of multiple hidden
    layers that, when combined, produce a more relevant output. Sometimes pooling
    layers are used within a block, which was the situation in GoogLeNet. Blocks are
    usually stacked much like hidden layers.


    ResNet introduced residual layers as a means of combining previously learned information
    with the current feature state to formulate a model that can effectively support
    increased depth (He et al. 2015). ResNet leveraged residual layers within what
    are called residual blocks.


    Figure 3.5: ResNet Type Residual Block


    ![](image/Image2980.jpg)


    A residual block begins with a convolution layer applied to the incoming information.
    The output of the first convolution passes through a nonlinear activation before
    the next convolution layer. Batch normalization is used to prevent the gradient
    from exploding and is applied to normalize the information before another nonlinear
    activation is involved. The residual block closes with a skip-layer residual connection
    that combines the original information with the newly learned features. Residual
    blocks mitigate the vanishing/exploding gradient problem associated with increased
    network depth.


    Cardinality is in reference to the number of transformation sets within a block.
    Cardinality was first introduced in the ResNeXt model in 2017 as an alternative
    to depth exploration for more accuracy (Saining et al. 2017). It can be expensive
    to train, but if skip layers are used, residual connections are recommended to
    reduce the training cost.


    Figure 3.6: Cardinality


    ![](image/Image2989.jpg)


    Each transformation set consists of an independent track of information that is
    trained jointly, not independently. For example, Figure 3.7 below displays five
    transformation sets within the block.


    Figure 3.7: Transformation Sets Within a Block


    ![](image/Image2998.png)


    ResNeXt showed that cardinality can be used as an alternative to depth exploration.
    Specifically, the authors of ResNeXt demonstrated a lower misclassification rate
    compared to a ResNet with a similar number of parameters. Each transformation
    set used in ResNeXt begins with a 1 x 1 convolution to reduce the dimensional
    depth, followed with a 3 x 3 convolution used for feature extraction. Lastly,
    a 1 x 1 is used to expand the dimensional depth before the residual layer summarizes
    and combines all transformation sets.


    Figure 3.8: ResNet Type with Average Pooling


    ![](image/Image3005.jpg)


    Interestingly, this author has observed cardinality to behave much like a structural
    regularity. This means that cardinality would be a useful addition to a model
    that seems to overfit the training data.


    Comparing Structural Depth to Cardinality


    Consider the following case study that examines the performance of a ResNet type
    model and ResNeXt type model on the CIFAR-10 data. Specifically, the impact of
    cardinality versus network depth is examined. Table 3.1 highlights some of the
    differences between ResNet-type and ResNext-type models.


    Table 3.1: ResNet versus ResNext Architectures


    | Attribute || ResNet Type || ResNext Type |


    | --- | --- | --- |


    | Number of Blocks || 10 || 3 |


    | Cardinality || 1 || 6 |


    | Skip-Layer Connections || residual || residual |


    | Number of Parameters || 803,230 || 349,842 |


    Both the ResNet type and ResNeXt type models examined in this experiment have
    almost identical beginning and ending model structures. ResNet begins with a convolution
    layer containing 12 filters, followed by a 2 x 2 max pooling layer, and ends with
    a 3 x 3 average pooling layer followed by a fully connected layer with 660 neurons.
    ResNeXt begins with a convolution layer containing 8 filters, followed by a 2
    x 2 max pooling layer, and ends with a 3 x 3 average pooling layer followed by
    a fully connected layer with 660 neurons.


    The primary difference between the two architectures is the number of blocks and
    cardinality used between the beginning and ending layers. The ResNet type model
    uses 10 blocks with a single independent path, meaning that the cardinality is
    1. The ResNeXt type is a much shallower model, using only three blocks with six
    separate tracks, meaning that the cardinality is 6.


    Cardinality has an additional unforeseen computational cost. Therefore, despite
    the difference in model parameters, the ResNeXt type model takes slightly longer
    to train with fewer parameters than the ResNet type model.


    First, both models are trained on 10,000 observations for 60 epochs. ResNet performs
    significantly better, with a misclassification rate of 44.2% compared to ResNeXt’s
    misclassification rate of 48.55%. Interestingly, ResNeXt seems to have lower variance
    compared to ResNet. See Figure 3.9 and Table 3.2.


    Figure 3.9: ResNet versus ResNext, 10,000 observations for 60 Epochs


    ![](image/Image3049.jpg)


    Table 3.2: ResNet versus ResNext, 10,000 Observations for 60 Epochs


    | Validation Misc || ResNet || ResNext |


    | --- | --- | --- |


    | 10k obs, 60 epochs || 44.2 || 48.55 |


    Epochs were then increased from 60 to 1500, and both models were retrained. Performance
    for both models improved, and the discrepancy between the two models is reduced,
    although the ResNet type model still outperformed the ResNeXt type model. Training
    for 1500 epochs seems a bit extreme given that the data contains only 10,000 observations.
    See Figure 3.10 and Table 3.3.


    Figure 3.10: ResNet versus ResNext, 10,000 Observations for 1,500 Epochs


    ![](image/Image3071.jpg)


    Table 3.3: ResNet versus ResNext, 10,000 Observations for 1,500 Epochs


    | Validation Misc || ResNet || ResNext |


    | --- | --- | --- |


    | 10k obs, 60 epochs || 44.2 || 48.55 |


    | 10k obs, 1,500 epochs || 43.1 || 44.1 |


    A dropout rate of 10% is added to the first convolutional layer for both models,
    and the models are retrained. Both models show further improvement, and the discrepancy
    in performance between the two models is marginal. See Figure 3.11 and Table 3.4.


    Figure 3.11: ResNet versus ResNext, 10,000 Observations for 1,500 Epochs with
    10% Dropout Rate in First Convolution Layer


    ![](image/Image3093.jpg)


    Table 3.4: ResNet versus ResNext, 10,000 Observations for 1,500 Epochs with 10%
    Dropout Rate in First Convolution Layer


    | Validation Misc || ResNet || ResNext |


    | --- | --- | --- |


    | 10k obs, 60 epochs || 44.2 || 48.55 |


    | 10k obs, 1,500 epochs || 43.1 || 44.1 |


    | 10k obs, 1,500 epochs, 10% dropout added || 41.75 || 41.95 |'
