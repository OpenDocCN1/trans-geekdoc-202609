    \ “120”);\n```\n\n```\nrun;\n```\n\nDemonstration 2: Building and Training a Convolutional\
    \ Neural Network\n\nIn this demonstration, a convolutional neural network is built\
    \ and trained to classify images of 10 possible classes. A subset of the famous\
    \ CIFAR-10 data is used. The data consist of 32 x 32 color images.\n\nOpen the\
    \ program titled DLMS02D02a.sas and examine the program contents in the code editor\
    \ window.\n\nExamining the Image Data and Specifying the Model\n\n1\\. First,\
    \ the image data are summarized. The summary provides an average intensity for\
    \ each color channel: blue, green, and red.\n\n```\nproc cas;\n```\n\n```\n  \
    \ image.summarizeimages / table={name=’LargeImageDatashuffled’,\n            \
    \               where=’_PartInd_=1’};\n```\n\n```\nrun;\n```\n\n![](image/Image1175.jpg)\n\
    \nThe summarized values are subtracted from the values in each input channel using\
    \ the OFFSETS= option.\n\n2\\. Second, the BuildModel action is specified, and\
    \ an empty deep learning convolutional model is created.\n\n```\nproc cas;\n```\n\
    \n```\n BuildModel / modeltable={name=’ConVNN’, replace=1} type = ‘CNN’;\n```\n\
    \na. The first layer added is an input layer. The number of channels is set to\
    \ 3 in the NCHANNELS= option. The width and height of the image is also specified\
    \ in the input layer. The offsets are also applied.\n\n```\nAddLayer / model=’ConVNN’\
    \ name=’data’ layer={type=’input’\n  nchannels=3 width=32 height=32 offsets={113.852228,\
    \ 123.021097,125.294747}};\n```\n\nb. Next, a convolutional layer is added to\
    \ the data. The convolutional layer contains six filters, each of a different\
    \ size (1x1, 3x3, 5x5, 7x7, 4x4, and 6x6). The odd-value-sized filters use a stride\
    \ of 1, the 4x4-sized filters use a stride of 2, and the 6x6-sized filters use\
    \ a stride of 4. The 4x4 and 6x6 sets include two extra filters. In addition,\
    \ dropout is applied to both the 4x4 and 6x6 sets of filters.\n\n```\nAddLayer\
    \ / model=’ConVNN’ name=’ConVLayer1a’ layer={type=’CONVO’ \n           nFilters=8\
    \  width=1 height=1 stride=1}\n           srcLayers={‘data’};\n```\n\n```\nAddLayer\
    \ / model=’ConVNN’ name=’ConVLayer1b’ layer={type=’CONVO’\n           nFilters=8\
    \  width=3 height=3 stride=1}\n           srcLayers={‘data’};\n```\n\n```\nAddLayer\
    \ / model=’ConVNN’ name=’ConVLayer1c’ layer={type=’CONVO’\n           nFilters=8\
    \  width=5 height=5 stride=1}\n           srcLayers={‘data’};\n```\n\n```\nAddLayer\
    \ / model=’ConVNN’ name=’ConVLayer1d’ layer={type=’CONVO’\n           nFilters=8\
    \  width=7 height=7 stride=1}\n           srcLayers={‘data’};\n```\n\n```\nAddLayer\
    \ / model=’ConVNN’ name=’ConVLayer1e’ layer={type=’CONVO’\n           nFilters=10\
    \  width=4 height=4 stride=2 dropout=.2}\n           srcLayers={‘data’};\n```\n\
    \n```\nAddLayer / model=’ConVNN’ name=’ConVLayer1f’ layer={type=’CONVO’\n    \
    \       nFilters=10  width=6 height=6 stride=4 dropout=.2}\n           srcLayers={‘data’};\n\
    ```\n\nc. A concatenation layer is used to combine the four paths into a single\
    \ path in preparation for the next layer. Specifically, the convolutions that\
    \ use a stride of 1 are combined and connected to the next layer. The other convolutions\
    \ will be connected to later layers.\n\n```\nAddLayer / model=’ConVNN’ name=’concatlayer1a’\n\
    \           layer={type=’concat’}\n           srcLayers={‘ConVLayer1a’,’ConVLayer1b’,’ConVLayer1c’,\n\
    \                      ‘ConVLayer1d’};\n```\n\nd. The concatenation layer is connected\
    \ to a pooling layer that is set to extract the maximum value from each neighborhood.\
    \ The pooling layer creates a 2 x 2 neighborhood that moves across columns with\
    \ a stride of 2.\n\n```\nAddLayer / model=’ConVNN’ name=’PoolLayer1max’ layer={type=’POOL’\
    \ \n           width=2 height=2 stride=2 pool=’max’}\n           srcLayers={‘concatlayer1a’};\n\
    ```\n\ne. A concatenation layer is used to combine the pooling layer with the\
    \ convolutional layer that is connected to the input layer and uses a 4 x 4 filter."
