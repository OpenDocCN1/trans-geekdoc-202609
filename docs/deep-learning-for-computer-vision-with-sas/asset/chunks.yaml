  fmt: "\n# Demonstration 1: Loading and Modeling Data with Traditional Neural Network\
    \ Methods (#Chapter_1.xhtml#_idTextAnchor030)\n\n# Demonstration 2: Building and\
    \ Training Deep Learning Neural Networks Using CASL Code (#Chapter_1.xhtml#_idTextAnchor031)\n\
    \n## Introduction to Neural Networks\n\nArtificial neural networks mimic key aspects\
    \ of the brain, in particular, the brain’s ability to learn from experience. In\
    \ order to understand artificial neural networks, we first must understand some\
    \ key concepts of biological neural networks, in other words, our own biological\
    \ brains.\n\nA biological brain has many features that would be desirable in artificial\
    \ systems, such as the ability to learn or adapt easily to new environments. For\
    \ example, imagine you arrive at a city in a country that you have never visited.\
    \ You don’t know the culture or the language. Given enough time, you will learn\
    \ the culture and familiarize yourself with the language. You will know the location\
    \ of streets, restaurants, and museums.\n\nThe brain is also highly parallel and\
    \ therefore very fast. It is not equivalent to one processor, but instead it is\
    \ equivalent to a multitude of millions of processors, all running in parallel.\
    \ Biological brains can also deal with information that is fuzzy, probabilistic,\
    \ noisy, or inconsistent, all while being robust, fault tolerant, and relatively\
    \ small. Although inspired by cognitive science (in particular, neurophysiology),\
    \ neural networks largely draw their methods from statistical physics (Hertz et\
    \ al. 1991). There are dozens, if not hundreds, of neural network algorithms.\n\
    \n### Biological Neurons\n\nIn order to imitate neurons in artificial systems,\
    \ first their mechanisms needed to be understood. There is still much to be learned,\
    \ but the key functional aspects of neurons, and even small systems (networks)\
    \ of neurons, are now known.\n\nNeurons are the fundamental units of cognition,\
    \ and they are responsible for sending information from the brain to the rest\
    \ of the body. Neurons have three parts: a cell body, dendrites, and axons. Inputs\
    \ arrive in the dendrites (short branched structures) and are transmitted to the\
    \ next neuron in the chain via the axons (a long, thin fiber). Neurons do not\
    \ actually touch each other but communicate across the gap (called a synaptic\
    \ gap) using neurotransmitters. These chemicals either excite the receiving neuron,\
    \ making it more likely to “fire,” or they inhibit the neuron, making it less\
    \ likely to become active. The amount of neurotransmitter released across the\
    \ gap determines the relative strength of each dendrite’s connection to the receiving\
    \ neuron. In essence, each synapse “weights” the relative strength of its arriving\
    \ input. The synaptically weighted inputs are summed. If the sum exceeds an adaptable\
    \ threshold (or bias) value, the neuron sends a pulse down its axon to the other\
    \ neurons in the network to which it connects.\n\nA key discovery of modern neurophysiology\
    \ is that synaptic connections are adaptable; they change with experience. The\
    \ more active the synapse, the stronger the connection becomes. Conversely, synapses\
    \ with little or no activity fade and, eventually, die off (atrophy). This is\
    \ thought to be the basis of learning. For example, a study from the University\
    \ of Wisconsin in 2015 showed that people could begin to “see” with their tongue.\
    \ Attached to the electric grid was a camera that was fastened to the subject’s\
    \ forehead. The subject was blindfolded. However, within 30 minutes, as their\
    \ neurons adapted, subjects began to “see” with their tongue. Amazing!\n\nAlthough\
    \ there are branches of neural network research that attempt to mimic the underlying\
    \ biological processes in detail, most neural networks do not try to be biologically\
    \ realistic.\n\n### Mathematical Neurons\n\nIn a seminal paper with the rather\
    \ understated title “A logical calculus of the ideas immanent in nervous activity,”\
    \ McCulloch and Pitts (1943) gave birth to the field of artificial neural networks.\
    \ The fundamental element of a McCulloch-Pitts network is called, unsurprisingly,\
    \ a McCulloch-Pitts neuron. As in real neurons, each input (`xi`) is first weighted\
    \ (`wi`) and then summed. To mimic a neuron’s threshold functionality, a bias\
    \ value (`w0`) is added to the weighted sum, predisposing the neuron to either\
    \ a positive or negative output value. The result is known as the neuron’s net\
    \ input:\n\n![](image/Image875.png)\n\nNotice that this is the classic linear\
    \ regression equation, where the bias term is the y-intercept and the weight associated\
    \ with each input is the input’s slope parameter.\n\nThe original McCulloch-Pitts\
    \ neuron’s final output was determined by passing its net input value through\
    \ a step function (a function that converts a continuous value into a binary output\
    \ 0 or 1, or a bipolar output -1 or 1), turning each neuron into a linear classifier/discriminator.\
    \ Modern neurons replace the discontinuous step function with a continuous function.\n\
    \n![](image/Image882.png)\n\nThe continuous nature permits the use of derivatives.\
    \ There are three layers in the basic perceptron (MLP) neural network:\n\n1. An\
    \ input layer containing a unit for each input. The input layer have no adjustable\
    \ parameters (weights). They simply pass the positive or negative input to the\
    \ next layer.\n2. A hidden layer with hidden units (mathematical neurons) that\
    \ perform a nonlinear transformation of the weighted and summed input.\n3. An\
    \ output layer that shapes and combines the hidden layer activation values.\n\n\
    A single hidden-layer perceptron constructs a limited extent, or bump, of large\
    \ values surrounded by smaller values (Principe et al. 2000). The intersection\
    \ of the hyper-planes created by a hidden layer consisting of three units, for\
    \ example, forms a triangle-shaped bump.\n\nThe hidden and output layers must\
    \ not be connected by strictly linear function in order to act as separate layers.\
    \ Otherwise, the multilayerron collapses into a linear perceptron. More formally,\
    \ if matrix `A` is the set of weights that transforms input `X` into the hidden\
    \ layer output, and matrix `B` is the set of weights that transforms the hidden\
    \ unit output into the final estimates `Y`, then the linearly connected multilayer\
    \ network can be represented as `Y=B[A(X)]`. However, if a single-layer weight\
    \ matrix `C=BA` is created, exactly the same output can be obtained from the single-layer\
    \ network—that is, `Y=C(X)`.\n\nIn a two-layer perceptron with `k` inputs, `h1`\
    \ hidden units in the first hidden layer, and `h2` hidden units in the second\
    \ hidden layer, the number of parameters to be learned is ![](image/HiddenEq..jpg).\n\
    \nThe number 1 represents the biased weight `W0` in the combination function of\
    \ each neuron.\n\nFigure 1.1: Multilayer Perceptron\n\n![](image/Image891.png)\n\
    \nNote: The “number of parameters” equations in this book assume that the inputs\
    \ are interval or ratio level. Each nominal or ordinal input increases `k` by\
    \ the number of classes in the variable, minus 1.\n\n Deep Learning\n\nThe term\
    \ deep learning refers to the numerous hidden layers used in a neural network.\
    \ However, the true essence of deep learning is the methods that enable the increased\
    \ extraction of information derived from a neural network with more than one hidden\
    \ layer. Adding more hidden layers to a neural network provides little benefit\
    \ without deep learning methods that underpin the efficient extraction of information.\
    \ For example, SAS software has had the capability to build neural networks with\
    \ many hidden layers using the `NEURAL` procedure for several decades. However,\
    \ a case can be made to suggest that SAS has not had deep learning because the\
    \ key elements that enable learning to persist in the presence of many hidden\
    \ layers had not been discovered. These elements include the use of the following:\n"
  trans: "\n\n# 演示 1：使用传统神经网络方法加载和对数据建模 (#Chapter_1.xhtml#_idTextAnchor030)\n\n# 演示\
    \ 2：使用 CASL 代码构建和训练深度学习神经网络 (#Chapter_1.xhtml#_idTextAnchor031)\n\n## 神经网络引论\n\
    \n人工神经网络模拟了大脑的关键特征，特别是大脑从经验中学习的能力。为了理解人工神经网络，我们首先必须理解生物神经网络的一些关键概念，换句话说，就是我们自己的生物学大脑。\n\
    \n生物大脑具有许多在人工系统中非常理想的特征，例如能够学习或轻松适应新环境的能力。例如，想象你到达一个你从未访问过的国家的城市。你不了解那里的文化或语言。只要时间足够，你就会学会当地文化并熟悉当地语言。你将知道街道、餐厅和博物馆的位置。\n\
    \n大脑具有高度的并行性，因此速度非常快。它并不等同于一个处理器，而是等同于数以百万计的、所有并行运行的处理器。生物大脑还能处理模糊、概率性、噪声或不一致的信息，同时保持稳健性、容错性且较小的体积。尽管很大程度上受到认知科学（特别是神经生理学）的启发，但神经网络的方法主要源于统计物理学（Hertz\
    \ et al. 1991）。神经网络算法有几十种甚至数百种。\n\n### 生物神经元\n\n为了在人工系统中模仿神经元，首先需要理解它们的机制。虽然仍有许多需要学习，但神经元的关键功能层面，甚至是神经元的小系统（网络），已经已知。\n\
    \n神经元是认知的基本单元，负责将信息从大脑传递到身体的其他部分。神经元由三个部分组成：细胞体、树突和轴突。输入到达树突（短分支结构），并通过轴突（长细纤维）传输到链中的下一个神经元。神经元之间实际上并不相互接触，而是通过神经递质跨越间隙（称为突触间隙）进行通信。这些化学物质要么激发接收神经元，使其更容易“放电”，要么抑制神经元，使其激活的可能性降低。跨越间隙释放的神经递质数量决定了每个树突与接收神经元连接的相对强度。本质上，每个突触都会对其到达输入的相对强度进行“加权”。加权后的输入求和。如果总和超过一个可调节的阈值（或偏置）值，神经元就会沿着其轴突向网络中连接的其他神经元发送脉冲。\n\
    \n现代神经生理学的一个关键发现是，突触连接是适应性的；它们会随着经验而改变。突触越活跃，连接就越强。相反，活动很少或没有活动的突触会逐渐消失，并最终死亡（萎缩）。这被认为是学习的基础。例如，威斯康星大学\
    \ 2015 年的一的一项研究显示，人们可以用舌头“看”。电网上连接着一个固定在受试者额头上的摄像头。受试者被蒙住了眼睛。然而，在 30 分钟内，随着他们神经元的适应性，受试者开始用舌头“看”。太惊奇了！\n\
    \n尽管有一些神经网络研究分支试图详细地模拟底层的生物过程，但大多数神经网络并没有试图追求生物学上的真实性。\n\n### 数学神经元\n\n在一篇标题为相当低调的“神经活动中蕴含思想的逻辑演算”的开创性论文中，McCulloch\
    \ 和 Pitts (1943) 诞生了人工神经网络领域。McCulloch-Pitts 网络的基本元素，不所当然地被称为 McCulloch-Pitts\
    \ 神经元。正如真实神经元一样，每个输入 (`xi`) 首先被加权 (`wi`)，然后进行求和。为了模拟神经元的阈值功能，在加权和上加上一个偏置值 (`w0`)，使得神经元倾向于产生正或负输出值。其结果是已知的。\n\
    \n现代神经生理学的一个关键发现是，突触连接是适应性的；它们会随着经验而改变。突触越活跃，连接就越强。相反，活动很少或没有活动的突触会逐渐消失，并最终死亡（萎缩）。这被认为是学习的基础。例如，威斯康星大学\
    \ 2015 年的一项研究显示，人们可以用舌头“看”。电网上连接着一个固定在受试者额头上的摄像头。受试者被蒙住了眼睛。然而，在 30 分钟内，随着他们神经元的适应性，受试者开始用舌头“看”。太惊奇了！\n\
    \n \n\n在一篇标题为相当低调的“神经活动中蕴含思想的逻辑演算”的开创性论文中，McCulloch 和 Pitts (1943) 诞生了人工神经网络领域。McCulloch-Pitts\
    \ 网络的基本元素，不所当然地被称为 McCulloch-Pitts 神经元。正如真实神经元一样，每个输入 (`xi`) 首先被加权 (`wi`)，然后进行求和。为了模拟神经元的阈值功能，在加权和上加上一个偏置值\
    \ (`w0`)，使得神经元倾向于产生正或负输出值。其结果是已知的。\n\n(image/Image875.png)\n\n注意，这是经典的回归方程，其中偏置项是截距，与每个输入的关联是斜率。\n\
    \n原始 McCulloch-Pitts 神经元的最终输出通过将其网络输入通过一个阶跃函数来决定（0 或 1）。\n\n感知元（MLP）具有三层：\n\n\
    1. 包含每个输入的输入层。输入层没有可调参数（权重）。它们只是将正或负输入传递到下一层。\n2. 隐藏层（数学神经元），对加权和输入进行非线性变换。\n\
    3. 结合隐藏层值的输出层。\n\n现代神经元将不连续的阶跃函数替换为连续函数。\n\n(image/Image882.png)\n\n连续性允许使用导数。基础感知元（MLP）神经网络有三层：\n\
    \n1. 包含每个输入的输入层。输入层没有可调参数（权重）。它们只是将正或负输入传递到下一层。\n2. 隐藏层（数学神经元），对加权和输入进行非线性变换。\n\
    3. 结合隐藏层值的输出层。\n\n单隐藏层感知元构建了一个由小值包围的大值“凸起”（Principe et al. 2000）。例如，由三个单元组成的隐藏层的交叉形成了一个三角形。\n\
    \n隐藏层和输出层不能通过严格线性函数连接以作为独立的层。否则，多层网络将塌变为线性感知元。更正式地说，如果矩阵 `A`是将输入 `X` 转换为隐藏层输出的权重集，矩阵\
    \ `B`是将隐藏单元输出转换为最终估计 `Y` 的权重集，那么线性连接的多层网络可以表示 `Y=B[A(X)]`。然而，如果创建一个单层权重矩阵 `C=BA`，则可以从单层网络获得相同的输出——即\
    \ `Y=C(X)`。\n\n在一个具有 `k` 个输入、第一隐藏层有 `h1` 个隐藏单元、第二隐藏层有 `h2` 个隐藏单元的二层感知元中，要学习的参数数量为：(image/HiddenEq..jpg)。\n\
    \n数字 1 代表每个神经元组合函数中的偏置权重 `W0`。\n\n图 1.1：多层感知元\n\n(image/Image891.png)\n\n注意：书中的“参数数量”方程假设输入是等距或比例的。每个分类或序数输入都会使\
    \ `k` 增加变量的类别数减 1。\n\n深度学习\n\n深度学习一词指的是神经网络中使用的许多隐藏层。然而，深度学习的真正精髓是能够从多个隐藏层的神经网络中提取更多信息的方法。如果没有支持高效提取信息的深度学习方法，在神经网络中添加更多隐藏层的益处甚微。例如，SAS\
    \ 软件几十年来一直能够使用 `NEURAL` 过程构建具有许多隐藏层的神经网络。然而，有一种理由认为 SAS 一直没有深度学习，因为在存在许多隐藏层的情况下，能够保持学习持续的关键要素尚未被发现。这些要素包括使用以下内容：\n\
    \n"
