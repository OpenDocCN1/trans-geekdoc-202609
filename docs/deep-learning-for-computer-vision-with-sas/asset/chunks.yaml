- raw: "Regularization is a process of introducing or removing information to stabilize\
    \ an algorithm’s understanding of data. Regularizations such as early stopping,\
    \ L1, and L2 have been used extensively in neural networks for many years. These\
    \ regularizations are still widely used in deep learning, as well. However, there\
    \ have been advancements in the area of regularization that work particularly\
    \ well when combined with multi-hidden layer neural networks. Two of these advancements,\
    \ dropout and batch normalization, have shown significant promise in deep learning\
    \ models. Let’s begin with a discussion of dropout and then examine batch normalization.\n\
    \nDropout adds noise to the learning process so that the model is more generalizable.\
    \ Training an ensemble of deep neural networks with several hundred thousand parameters\
    \ each might be infeasible. As seen in Figure 1.9, dropout adds noise to the learning\
    \ process so that the model is more generalizable.\n\nFigure 1.9: Regularization\
    \ Techniques\n\n![](image/Image1101.jpg)\n\nThe goal of dropout is to approximate\
    \ an ensemble of many possible model structures through a process that perturbs\
    \ the learning in an attempt to prevent weights from co-adapting. For example,\
    \ imagine we are training a neural network to identify human faces, and one of\
    \ the hidden units used in the model sufficiently captures the mouth. All other\
    \ hidden units are now relying, at least in some part, on this hidden unit to\
    \ help identify a face through the presence of the mouth. Removing the hidden\
    \ unit that captures the mouth forces the remaining hidden units to adjust and\
    \ compensate. This process pushes each hidden unit to be more of a “generalist”\
    \ than a “specialist” because each hidden unit must reduce its reliance on other\
    \ hidden units in the model.\n\nDuring the process of dropout, hidden units or\
    \ inputs (or both) are randomly removed from training for a period of weight updates.\
    \ Removing the hidden unit from the model is as simple as multiplying the unit’s\
    \ output by zero. The removed unit’s weights are not lost but rather frozen. Each\
    \ time that units are removed, the resulting network is referred to as a thinned\
    \ network. After several weight updates, all hidden and input units are returned\
    \ to the network. Afterward, a new subset of hidden or input units (or both) are\
    \ randomly selected and removed for several weight updates. The process is repeated\
    \ until the maximum training iterations are reached or the optimization procedure\
    \ converges.\n\nIn SAS Viya, you can specify the DROPOUT= option in an ADDLAYER\
    \ statement to implement dropout. DROPOUT=ratio specifies the dropout ratio of\
    \ the layer.\n\nBelow is an example of dropout implementation in an ADDLAYER statement.\n\
    \n```\nAddLayer/model=’DLNN’ name=”HLayer1” layer={type=’FULLCONNECT’ n=30\n \
    \        act=’ELU’ init=’xavier’ dropout=.05} srcLayers={“data”};\n```\n\nNote:\
    \ The ADDLAYER syntax is described shortly and further expanded upon throughout\
    \ this book.\n\nBatch Normalization\n\nThe batch normalization (Ioffe and Szegedy,\
    \ 2015) operation normalizes information passed between hidden layers per mini-batch\
    \ by performing a standardizing calculation to each piece of input data. The standardizing\
    \ calculation subtracts the mean of the data and then divides by the standard\
    \ deviation. It then follows this calculation by multiplying the data by the value\
    \ of a learned constant and then adding the value of another learned constant.\n\
    \nThus, the normalization formula is\n\n![](image/Image1110.png)\n\nwhere gamma![](image/Image1117.png)and\
    \ beta![](image/Image1125.png)are learnable parameters.\n\nSome deep learning\
    \ practitioners have dismissed the use of sigmoidal activations in the hidden\
    \ units. Their dismissal might have been premature, however, with the discovery\
    \ of batch normalization. Without batch normalization, each hidden layer is, in\
    \ essence, learning from information that is constantly changing when multiple\
    \ hidden layers are present in a neural network. That is, a weight update is reliant\
    \ on second-order, third-order (and so on) effects (weights in the other layers).\
    \ This phenomenon is known as the internal covariance shift (ICS) (Ioffe and Szegedy,\
    \ 2015).\n\nThere are two schools of thought as to why batch normalization improves\
    \ the learning process. The first comes from Ioffe and Szegedy who believe batch\
    \ normalization reduces ICS. The second comes from Santurkar, Tsipras, Ilyas,\
    \ and Madry who argue that batch normalization is not really reducing ICS but\
    \ is instead smoothing the error landscape (Santurkar, Tsipras, Ilyas, and Madry\
    \ 2018). Regardless of which thought prevails, batch normalization has empirically\
    \ shown to improve the learning process and reduce neuron saturation.\n\nIn the\
    \ SAS deep learning actions, batch normalization is implemented as a separate\
    \ layer type and can be placed anywhere after the input layer and before the output\
    \ layer.\n\nNote: With regard to convolutional neural networks, the batch normalization\
    \ layer is typically inserted after a convolution or pooling layer.\n\nBatch Normalization\
    \ with Mini-Batches\n\nIn the case where the source layer to a batch normalization\
    \ layer contains feature maps, the batch normalization layer computes statistics\
    \ based on all of the pixels in each feature map, over all of the observations\
    \ in a mini-batch. For example, suppose that your network is configured for a\
    \ mini-batch size of 3, and the input to the batch normalization layer consists\
    \ of two 5 x 5 feature maps. In this case, the batch normalization layer computes\
    \ two means and two standard deviations. The first mean would be the mean of all\
    \ the pixels in the first feature map for the first observation, the first feature\
    \ map of the second observation, and the first feature map of the third observation.\
    \ The second mean would be the mean of all of the pixels in the second feature\
    \ map of the first observation, the second feature map of the second observation,\
    \ and the second feature map of the third observation, and so on. Numerically,\
    \ each mean would be the mean of (3 x 5 x 5) = 75 values.\n\nIn the case where\
    \ the source layer to a batch normalization layer does not contain feature maps\
    \ (for example, a fully connected layer), then the batch normalization layer computes\
    \ statistics for each neuron in the input, rather than for each feature map in\
    \ the input. For example, suppose that your network has a mini-batch size of 3,\
    \ and the input to the batch normalization layer contains 50 neurons. In this\
    \ case, the batch normalization layer would compute 50 means and 50 standard deviations.\
    \ The first mean would be the mean of the first neuron of the first observation,\
    \ the first neuron of the second observation, and the first neuron of the third\
    \ observation. The second mean would be the mean of the second neuron of the first\
    \ observation, the second neuron of the second observation, and the second neuron\
    \ of the third observation, and so on. Numerically, each mean would be the mean\
    \ of three values. NVIDIA refers to this calculation as per activation mode.\n\
    \nIn order for the batch normalization computations to conform to those described\
    \ in Sergey Ioffe and Christian Szegedy’s batch normalization research (Ioffe\
    \ and Szegedy, 2015), the source layer should have settings of ACT=IDENTITY and\
    \ INCLUDEBIAS=FALSE. The activation function that would normally have been specified\
    \ in the source layer should instead be specified on the batch normalization layer.\
    \ If you do not configure your model to follow these option settings, the computation\
    \ will still work, but it will not match the computation as described by Ioffe\
    \ and Szegedy.\n\nWhen using multiple GPUs, efficient calculation of the batch\
    \ normalization transform requires a modification to the original algorithm specified\
    \ by Ioffe and Szegedy. The algorithm specifies that during training, you must\
    \ calculate the mean and standard deviation of the pixel values in each feature\
    \ map, over all of the observations in a mini-batch."
  fmt: "\n# Regularization\n\nRegularization is a process of introducing or removing\
    \ information to stabilize an algorithm’s understanding of data. Regularizations\
    \ such as early stopping, `L1`, and `L2` have been used extensively in neural\
    \ networks for many years. These regularizations are still widely used in deep\
    \ learning, as well. However, there have been advancements in the area of regularization\
    \ that work particularly well when combined with multi-hidden layer neural networks.\
    \ Two of these advancements, `dropout` and `batch normalization`, have shown significant\
    \ promise in deep learning models. Let’s begin with a discussion of `dropout`\
    \ and then examine `batch normalization`.\n\n`Dropout` adds noise to the learning\
    \ process so that the model is more generalizable. Training an ensemble of deep\
    \ neural networks with several hundred thousand parameters each might be infeasible.\
    \ As seen in Figure 1.9, `dropout` adds noise to the learning process so that\
    \ the model is more generalizable.\n\nFigure 1.9: Regularization Techniques\n\n\
    ![](image/Image1101.jpg)\n\nThe goal of `dropout` is to approximate an ensemble\
    \ of many possible model structures through a process that perturbs the learning\
    \ in an attempt to prevent weights from co-adapting. For example, imagine we are\
    \ training a neural network to identify human faces, and one of the hidden units\
    \ used in the model sufficiently captures the mouth. All other hidden units are\
    \ now relying, at least in some part, on this hidden unit to help identify a face\
    \ through the presence of the mouth. Removing the hidden unit that captures the\
    \ mouth forces the remaining hidden units to adjust and compensate. This process\
    \ pushes each hidden unit to be more of a “generalist” than a “specialist” because\
    \ each hidden unit must reduce its reliance on other hidden units in the model.\n\
    \nDuring the process of `dropout`, hidden units or inputs (or both) are randomly\
    \ removed from training for a period of weight updates. Removing the hidden unit\
    \ from the model is as simple as multiplying the unit’s output by zero. The removed\
    \ unit’s weights are not lost but rather frozen. Each time that units are removed,\
    \ the resulting network is referred to as a thinned network. After several weight\
    \ updates, all hidden and input units are returned to the network. Afterward,\
    \ a new subset of hidden or input units (or both) are randomly selected and removed\
    \ for several weight updates. The process is repeated until the maximum training\
    \ iterations are reached or the optimization procedure converges.\n\nIn SAS Viya,\
    \ you can specify the `DROPOUT=` option in an `ADDLAYER` statement to implement\
    \ `dropout`. `DROPOUT=ratio` specifies the dropout ratio of the layer.\n\nBelow\
    \ is an example of `dropout` implementation in an `ADDLAYER` statement.\n\n```\n\
    AddLayer/model=’DLNN’ name=”HLayer1” layer={type=’FULLCONNECT’ n=30\n        \
    \ act=’ELU’ init=’xavier’ dropout=.05} srcLayers={“data”};\n```\n\nNote: The `ADDLAYER`\
    \ syntax is described shortly and further expanded upon throughout this book.\n\
    \n## Batch Normalization\n\nThe `batch normalization` (Ioffe and Szegedy, 2015)\
    \ operation normalizes information passed between hidden layers per mini-batch\
    \ by performing a standardizing calculation to each piece of input data. The standardizing\
    \ calculation subtracts the mean of the data and then divides by the standard\
    \ deviation. It then follows this calculation by multiplying the data by the value\
    \ of a learned constant and then adding the value of another learned constant.\n\
    \nThus, the normalization formula is\n\n![](image/Image1110.png)\n\nwhere `gamma`![](image/Image1117.png)\
    \ and `beta`![](image/Image1125.png) are learnable parameters.\n\nSome deep learning\
    \ practitioners have dismissed the use of sigmoidal activations in the hidden\
    \ units. Their dismissal might have been premature, however, with the discovery\
    \ of `batch normalization`. Without `batch normalization`, each hidden layer is,\
    \ in essence, learning from information that is constantly changing when multiple\
    \ hidden layers are present in a neural network. That is, a weight update is reliant\
    \ on second-order, third-order (and so on) effects (weights in the other layers).\
    \ This phenomenon is known as the internal covariance shift (`ICS`).\n\nThere\
    \ are two schools of thought as to why `batch normalization` improves the learning.\
    \ The first comes from Ioffe and Szegedy who believe `batch normalization` reduces\
    \ `ICS`. The second comes from Santurkar, Ilyas, and Madry who argue that `batch\
    \ normalization` is not really reducing `ICS` but instead smoothing the error\
    \ landscape. Regardless of which thought prevails, `batch normalization` has empirically\
    \ shown to improve the learning. In the SAS deep learning actions, `batch normalization`\
    \ is implemented as a separate layer and can be placed anywhere after the input.\
    \ Note: With regard to convolutional networks, `batch normalization` is typically\
    \ inserted after a convolution layer.\n\n### Batch Normalization with Mini-Batches\n\
    \nIn the case where the source layer to a `batch normalization` layer contains\
    \ feature maps, the `batch normalization` layer computes statistics based on all\
    \ of the pixels in each feature map, over all of the observations in a mini-batch.\
    \ For example, suppose that your network is configured for a mini-batch size of\
    \ 3, and the input consists of two 5x5 feature maps. In this case, the batch normalization\
    \ layer computes two means and two standard deviations. The first mean would be\
    \ the mean of all the pixels in the first feature map for the first observation,\
    \ the first feature map of the second observation, and the first feature map of\
    \ the third observation. The second mean would be the mean of all the pixels in\
    \ the second feature map of the first observation, the second feature map of the\
    \ second observation, and the second feature map of the third observation, and\
    \ so on. Numerically, each mean would be the mean of `3 * 5` values.\n\nIn the\
    \ case where the source layer to a `batch normalization` layer does not contain\
    \ feature maps (for example, a fully connected layer), then the `batch normalization`\
    \ layer computes statistics for each neuron in the input, rather than for each\
    \ feature map. For example, suppose that your network has a mini-batch size of\
    \ 3, and the input to the batch normalization layer contains 50 neurons. In this\
    \ case, the batch normalization layer would compute 50 means and 50 standard deviations.\
    \ The first mean would be the mean of the first neuron of the first observation,\
    \ the first neuron of the second observation, and the first neuron of the third\
    \ observation. The second mean would be the mean of the second neuron of the first\
    \ observation, the second neuron of the second observation, and the second neuron\
    \ of the third observation, and so on. Numerically, each mean would be the mean\
    \ of three values. NVIDIA refers to this calculation as per activation mode.\n\
    \nIn order for the batch normalization computations to conform to those described\
    \ in Sergey Ioffe and Christian Szegedy’s batch normalization research (Ioffe\
    \ and Szegedy, 2015), the source layer should have settings of `ACT=IDENTITY`\
    \ and `INCLUDEBIAS=FALSE`. The activation function that would normally have been\
    \ specified in the source layer should instead be specified on the batch normalization\
    \ layer.\n"
  trans: "\n\n# 正则化\n\n正则化是一个引入或移除信息以稳定算法对数据理解的过程。多年来，早停（early stopping）、`L1` 和 `L2`\
    \ 等正则化技术在神经网络中被广泛应用。这些正则化方法在深度学习中仍然被广泛使用。然而，正则化领域已经取得了进展，这些进展在与多隐藏层神经网络结合时效果特别好。其中两种进展\
    \ `dropout` 和 `batch normalization`（批归一化）在深度学习模型中展现了巨大的潜力。让我们先讨论 `dropout`，然后检查\
    \ `batch normalization`。\n\n`Dropout` 在学习过程中添加噪声，使得模型更具泛化能力。训练一个每个包含数十万个参数的深度神经网络集成模型可能是不可行的。如图\
    \ 1.9 所示，`dropout` 在学习过程中添加噪声，使得模型更具泛化能力。\n\n图 1.9：正则化技术\n\n![](img/Image1101.jpg)\n\
    \n`dropout` 的目标是通过一个扰动学习的过程来近似许多可能的模型结构的集成，试图防止权重产生协同适应。例如，假设我们正在训练一个识别人脸的神经网络，模型中使用的一个隐藏单元充分捕捉了嘴部。此时，所有其他隐藏单元至少在某些程度上依赖于这个隐藏单元，通过嘴部的存在来帮助识别脸。移除捕捉嘴部的隐藏单元会迫使剩余隐藏单元进行调整和补偿。这个过程使每个隐藏单元更多地成为“通才”而非“专家”，因为每个隐藏单元必须减少对模型中其他隐藏单元的依赖。\n\
    \n在 `dropout` 过程中，隐藏单元或输入（或两者）会在权重更新期间被随机从训练中移除。从模型中移除隐藏单元只需将该单元的输出乘以零。被移除的单元权重并没有丢失，而是被冻结了。每次移除单元时，生成的网络被称为稀疏网络。在几次权重更新后，所有隐藏和输入单元都会返回网络。之后，再次随机选择并移除一个新的隐藏或输入单元（或两者）进行几次权重更新。重复此过程直到达到最大训练迭代或优化过程收敛。\n\
    \n在 SAS Viya 中，你可以在 `ADDLAYER` 语句中指定 `DROPOUT=` 来实现 `dropout`。`DROPOUT=ratio`\
    \ 指定该层的丢弃率。\n\n以下是在 `ADDLAYER` 语句中实现 `dropout` 的示例。\n\n```\nAddLayer/model=’DLNN’\
    \ name=”HLayer1” layer={type=’FULLCONNECT’ n=30\n         act=’ELU’ init=’xavier’\
    \ dropout=.05} srcLayers={“data”};\n```\n\n注意：`ADDLAYER` 语法将在稍后描述并在全书中进一步扩展。\n\
    \n## 批归一化\n\n`batch normalization`（Ioffe and Szegedy, 2015）操作通过对每份输入数据进行标准化计算，归一化每个批次中在隐藏层之间传递的信息。标准化计算减去数据的平均值，然后除以标准差。随后通过将数据乘以一个学习常数的值并加上另一个学习常数的值来后续计算。\n\
    \n因此，归一化公式为\n\n![](img/Image1110.png)\n\n其中 `gamma`![](img/Image1117.png) 和 `beta`![](img/Image1125.png)\
    \ 是可学习参数。\n\n一些深度学习实践者放弃了在隐藏单元中使用 sigmoid 激活函数。然而，随着 `batch normalization` 的发现，他们的放弃可能为时过早。如果没有\
    \ `batch normalization`，当神经网络中存在多个隐藏层时，每个隐藏层本质上都在从不断变化的信息中学习。也就是说，权重更新依赖于二阶、三阶（依此类推）效应（其他层的权重）。这种现象被称为内部协方偏移（`ICS`）。\n\
    \n关于为什么 `batch normalization` 能改进学习，有两种观点。第一种来自 Ioffe 和 Szegedy，他们认为 `batch normalization`\
    \ 减少了 `ICS`。第二种来自 Santurkar, Ilyas 和 Madry，他们认为 `batch normalization` 并没有真正减少\
    \ `ICS`，而是平滑了误差平面。无论哪种观点占优，`batch normalization` 在经验上证明可以改进学习。在 SAS 深度学习操作中，`batch\
    \ normalization` 作为一个单独层，可以放在输入后的任何位置。注意：对于卷积网络，`batch normalization` 通常插入在卷积层之后。\n\
    \n#### 小批次的批归一化\n\n在 `batch normalization` 层的源层包含特征图的情况下，`batch normalization`\
    \ 层根据每个小批次中所有观测值的每个特征图的所有像素来计算统计数据。例如，假设你的网络配置的小批次大小为 3，输入包含两个 5x5 的特征图。在这种情况下，批归一化层计算两个平均值和两个标准差。第一个平均值是第一个观测的第一个特征图、第二个观测的第一个特征图以及第三个观测的第一个特征图中所有像素的平均值。第二个平均值是第一个观测的第二个特征图、第二个观测的第二个特征图以及第三个观测的第二个特征图中所有像素的平均值，依此类推。数值上，每个平均值是\
    \ 3 个值的平均值。\n\n在 `batch normalization` 层的源层不包含特征图的情况下（例如全连接层），`batch normalization`\
    \ 层为输入中的每个神经元计算统计数据，而不是每个特征图。例如，假设你的网络小批次大小为 3，批归一化层的输入包含 50 个神经元。在这种情况下，批归一化层将计算\
    \ 50 个平均值和 50 个标准差。第一个平均值是第一个观测的第一个神经元、第二个观测的第一个神经元以及第三个观测的第一个神经元的平均值。第二个平均值是第一个观测的第二个神经元、第二个观测的第二个神经元以及第三个观测的第二个神经元的平均值，依此类推。数值上，每个平均值是三个值的平均值。NVIDIA\
    \ 根据激活模式对此计算此类计算。\n\n为了使批归一化计算符合 Sergey Ioffe 和 Christian Szegedy 的批归一化研究（Ioffe\
    \ and Szegedy, 2015）中的描述，源层应设置 `ACT=IDENTITY` 和 `INCLUDEBIAS=FALSE`。通常应在源层中指定的激活函数，现在应指定在批归一化层上。\n\
    \n"
