    \ each anchor box. The first value represents the width of the anchor box, and\
    \ the second value represents the height of the same box.\n\nHere is an example\
    \ of ANCHORS= implementation in the ADDLAYER statement:\n\n```\nAddLayer / model=’ObjectDetection’\n\
    ```"
