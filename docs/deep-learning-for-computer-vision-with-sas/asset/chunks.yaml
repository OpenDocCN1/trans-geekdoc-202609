    \nAn example of the output produced by the code is displayed in Figure 2.28.\n\
    \nFigure 2.28: Code Output\n\n![](image/Image1242.png)\n\nThe PARTITION procedure\
    \ is used to sample data in SAS Viya. It performs simple random sampling, stratified\
