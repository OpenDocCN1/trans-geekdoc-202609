    \ to conform to those described in [Sergey Ioffe and Christian Szegedy’s Batch\
    \ Normalization](https://arxiv.org/abs/1502.0316), the source layer should have\
    \ settings of `ACT=identity` and `INCLUDEBIAS=False`. The activation function\
