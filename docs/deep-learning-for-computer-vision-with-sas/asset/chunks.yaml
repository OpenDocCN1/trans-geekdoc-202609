    \ 10 次迭代时终止了学习过程。\n\n**图 1.12：得分信息\n\n![](img/Image1326.png)\n\n## 演示 2：使用 CASL\
    \ 代码构建和训练深度学习神经网络\n\n本演示展示了如何构建和训练两个深度学习神经网络。这两个模型包含的隐藏层数和隐藏单元数将与上一个演示中创建的神经网络相同。然而，这两个新模型将应用深度学习技术。\n\
    \n本演示使用 CASL 代码来实现深度学习模型。使用 `PROC CAS` 来方便 CASL 代码的使用。\n\n1. 打开名为 `DLUS01D02a.sas`\
    \ 的程序，并在代码编辑器窗口检查程序内容。\n\n首先，加载 `DeepLearn` 动作集（action set）。该动作集包含了 SAS 深度学习的大部分功能，包括深度前馈\
    \ (`DNN`)、卷积 (`CNN`) 和循环 (`RNN`) 神经网络。\n\n注意：在使用 SAS 深度学习动作之前，必须加载 `DeepLearn`。该动作集只需要加载一次。\n\
    \n```\nproc cas;\n   loadaction ‘DeepLearn’;\nrun;\n```\n\n接下来，创建一个空的深度学习模型。模型的引用名称为\
    \ `DLNN`，并指定了深度前馈模型类型。\n\n```\nproc cas;\n   BuildModel / model={name=’DLNN’,\
    \ replace=1} type = “DNN”;\nrun;\n```\n\n然后使用 `AddLayer` 动作向模型中添加九层，其中第一个是输入层，如\
    \ `TYPE='INPUT'` 选项所示。使用 `DROPOUT=` 选项对输入层应用丢弃（Dropout）。\n\n```\nproc cas;\n \
    \  AddLayer / model=’DLNN’ name=’data’ layer={type=’input’ dropout=.05};\n```\n\
    \n添加七层全连接隐藏层。每个隐藏层在 `NAME=` 选项中都被赋予了一个唯一的名称。这些层中使用的激活函数都是修正线性 (`ReLU`) 激活函数，但第一个隐藏层除外。第一个隐藏层采用了指数线性\
    \ (`ELU`) 激活函数，因为当 `ReLU` 与输入层连接时容易饱和（与 Lewis 通信，SAS 2017）。`MSRA` 初始化与 `ReLU`\
    \ 激活函数结合，并包含了 5% 的丢弃率。除了中间隐藏层外，每个隐藏层都应用了丢弃。注意，`SRCLERS=` 选项表示与输入连接相关的层。\n\n```\n\
    AddLayer / model=’DLNN’ name=’HLayer1’ layer={type=’FULLCONNECT’ n=30 act=’ELU’\
    \ init=’xavier’ dropout=.05} srcLayers={‘data’};\n```\n\n```\nAddLayer / model=’DLNN’\
    \ name=’HLayer2’ layer={type=’FULLCONNECT’ n=20 act=’ReLU’ init=’MSRA’ dropout=.05}\
    \ srcLayers={‘HLayer1’};\n```\n\n```\nAddLayer / model=’DLNN’ name=’HLayer3’ layer={type=’FULLCONNECT’\
    \ n=10 act=’ReLU’ init=’MSRA’ dropout=.05} srcLayers={‘HLayer2’};\n```\n\n```\n\
    AddLayer / model=’DLNN’ name=’HLayer4’ layer={type=’FULLCONNECT’ n=5 act=’ReLU’\
    \ init=’MSRA’} srcLayers={‘HLayer3’};\n```\n\n```\nAddLayer / model=’DLNN’ name=’HLayer5’\
    \ layer={type=’FULLCONNECT’ n=10 act=’ReLU’ init=’MSRA’ dropout=.05} srcLayers={‘HLayer4’};\n\
    ```\n\n```\nAddLayer / model=’DLNN’ name=’HLayer6’ layer={type=’FULLCONNECT’ n=20\
    \ act=’ReLU’ init=’MSRA’ dropout=.05} srcLayers={‘HLayer5’};\n```\n\n```\nAddLayer\
    \ / model=’DLNN’ name=’HLayer7’ layer={type=’FULLCONNECT’ n=30 act=’ReLU’ init=’MSRA’\
    \ dropout=.05} srcLayers={‘HLayer6’};\n```\n\n最后，添加一个输出层。由于目标是二分类，因此使用了 `softmax`\
    \ 激活函数。\n\n```\nAddLayer / model=’DLNN’ name=”outlayer” layer={type=’output’ act=’softmax’}\
    \ srcLayers={“Layer7”};\nrun;\n```\n\n图 1.13 是上述 CASL 代码构建的模型架构简图。\n\n图 1.13：模型架构\n\
    \n![](img/Image36.png)\n\n现在模型已经构建完成。但我们还没有在数据上训练模型。使用 `dlTrain` 动作来训练模型。\n\n\
    `TABLE=` 选项填充加载到 CAS 中的数据集名称。在 `MODEL=` 选项中插入构建的模型名称。\n\n`BESTWEIGHTS=` 选项创建一个包含模型最佳权重的数据集。如果包含了验证数据，则根据模型在验证数据上的表现选择最佳权重。否则，使用训练数据。\n\
    \n```\nproc cas;\n   dlTrain / table='Train_Develop’ model='DLNN’ \n         \
    \    bestweights={name='bestdeepweights’, replace=1}\n```\n\n输入列表在 `INPUTS=` 选项中指定。\n\
    \n```\ninputs={‘AcctAge’,\n              ‘DDABal’,\n              ‘CashBk’,\n\
    \              ‘Checks’,\n              ‘NSFAmt’,\n              ‘Phone’,\n  \
    \            ‘Teller’,\n              ‘SavBal’,\n              ‘ATMAmt’,\n   \
    \           ‘POS’,\n              ‘POSAmt’,\n              ‘CDBal’,\n        \
    \      ‘IRABal’,\n              ‘LOCBal’,\n              ‘ILSBal’,\n         \
    \     ‘MMBal’,\n              ‘MMCred’,\n              ‘MTGBal’,\n           \
    \   ‘CCBal’,\n              ‘CCPurc’,\n              ‘Income’,\n             \
    \ ‘LORes’,\n              ‘HMVal’,\n              ‘Age’}\n```\n\n"
