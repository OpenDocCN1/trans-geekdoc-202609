    # 第 5 章：计算机视觉案例研究\n\n本章详细介绍了使用 SAS 编程语言进行的一个计算机视觉案例研究。\n\n全球最领先的医学研究中心之一寻求构建一个计算机视觉模型，用于从描述结构的图像中提取并总结对代谢通路的理解。也就是说，理解由化学化合物和箭头形成的几何序列。这些图像是从研究论文或期刊解析出的。\n\
    \n本案例研究详细说明了一种涉及创建两阶段计算机视觉模型的解决方案。第一阶段依赖于目标定位（检测）模型。第二阶段使用图像分类器对提取出的箭头的方向进行分类。然而，本案例研究仅描述了第一阶段。\n\
    \n训练数据包含 871 张标记图像，其中大约一半的图像是从论文中提取的，另一半是手动合成的。合成图像具有以随机方向放置的箭头变体，并结合随机选择的化合物。每张合成图像都包含噪声以提高泛化能力（文本、形状、随机噪声块等）。此外，合成图像的设计使得每个箭头都可以被“框选”而不会捕获其他边缘，如图\
    \ 5.1 所示。\n\n图 5.1：合成图像\n\n![](img/Image845.png)\n\n标记图像的示例见图 5.2。\n\n图 5.2：标记图像\n\
    \n![](img/Image52.png)\n\n数据位于一个名为 `Train_metabolic_pathways` 的 SAS 数据文件中。\n\n\
    1. 打开名为 `CASESTUD_1a` 的程序。该程序从一个定义数据和程序位置的宏变量开始。`%let datalocation=*specify the\
    \ location of programs here;` 然后建立 cas 库。\n\n```\nlibname mycas;\n```\n\n```\n\
    proc cas;\n```\n\n```\n   table.addlib name=’images’ path=”&datalocation”\n```\n\
    \n```\n               subdirectories=true;\n```\n\n```\nquit;\n```\n\n2. 接下来创建一个宏，用于创建一个输出变量列表，对应训练数据中图像中最大对象数量。在这种情况下，图像中对象的最大数量为\
    \ 41。输出变量列表包括图像中的对象数量（`nobjects_`）以及一组定义每个实体空间位置的变量（`Object#_x`、`Object#_y`、`Object#_width`\
    \ 和 `Object#_height`）。变量名列表存储在宏变量 `ObjectTargets` 中。\n\n```\n%macro makevars;\n\
    ```\n\n```\ndata mycas.createvars;\n```\n\n```\n_nObjects_.;\n```\n\n```\n%do\
    \ i=0 %to 40;\n```\n\n```\nlength _Object&i._ varchar(8);\n```\n\n```\nlength\
    \ _Object&i._x _Object&i._y _Object&i._width _Object&i._height 8;\n```\n\n```\n\
    _Object&i._=’;\n```\n\n```\n_Object&i._x=.;\n```\n\n```\n_Object&i._y=.;\n```\n\
    \n```\n_Object&i._width=.;\n```\n\n```\n_Object&i._height=.;\n```\n\n```\n%end;\n\
    ```\n\n```\nrun;\n```\n\n```\n%mend makevars;\n```\n\n```\n%makevars;\n```\n\n\
    ```\ndata mycas.createvars;\n```\n\n```\n_nObjects_.;\n```\n\n```\ntranspose=_vars;\n\
    ```\n\n```\nrun;\n```\n\n```\nproc sql;\n```\n\n```\nselect *\n```\n\n```\nfrom\
    \ work.createvars\n```\n\n```\nwhere _nobjects_ is not null\n```\n\n```\ninto\
    \ ObjectTargets;\n```\n\n```\nquit;\n```\n\n3. 接下来，程序上传 `Train_metabolic_pathways`\
    \ 数据。\n\n```\nproc cas;\n```\n\n```\nload file=”&datalocation/Train_metabolic_pathways.sdat”\n\
    ```\n\n```\ncasout=”ChemArrows”\n```\n\n```\n/*TrainFull*/\n```\n\n```\nquit;\n\
    ```\n\n训练数据中的图像已调整为 416x416 并转换为灰度图。数据还包含一个分区指示器 `_partind_`。\n\n4. 接下来，程序加载一个名为\
    \ `TinyYolov2` 的预训练模型。SAS 从以下 URL 获取了大量的预训练模型：`https://support.sas.com/documentation/prod-p/vdmml/index.html`。\n\
    \n```\nproc cas;\n```\n\n```\nload file=”&datalocation/Tiny-Yolov2.sdat”\n```\n\
    \n```\ncasout=”TinyYolov2”\n```\n\n```\nimportoptions=(filetype=”hdat”)\n```\n\
    \n```\nreplace;\n```\n\n```\nquit;\n```\n\n```\nproc cas;\n```\n\n```\nload file=”/data/roban/Pretrained/Tiny_Yolo/Tiny-olov2_weights.sdat”\n\
    ```\n\n```\ncasout=”TinyYolov2_weights”\n```\n\n```\nimportoptions=(filetype=”hdat”)\n\
    ```\n\n```\nreplace;\n```\n\n```\nquit;\n```\n\n5. 使用 `fetch` 操作显示模型表。还加载了几个动作集。\n\
    \n```\n  proc cas;\n```\n\n```\n    table.fetch /\n```\n\n```\n     table=”TinyYolov2”\n\
    ```\n\n```\n    to=500;\n```\n\n```\n   loadactionset ‘deeplearn’;\n```\n\n```\n\
    \   loadactionset ‘image’;\n```\n\n```\n   loadactionset ‘table’;\n```\n\n```\n\
    quit;\n```\n\n图 5.3 显示了结果。\n\n图 5.3：模型表\n\n![](img/Image861.jpg)\n\n模型表定义模型的架构，可以通过更改来改变或增强预训练模型的行为。例如，SAS\
    \ 提供的预训练 `Tiny-Yolov2` 不对输入图像进行任何内存翻转。这种行为在后续代码中进行了修改，允许模型翻转传入图像。坐标会自动调整以修正几何变变。\n\
    \n从 `Tiny-Yolov2` 模型中删除了输出层（`detections1`）。\n\n```\nproc cas;\n```\n\n```\nremovelayer\
    \ / model=’TinyYolov2’ name='detection1’;\n```\n\n```\nquit;\n```\n\n添加了几个适配层以及一个新的输出层。\n\
    \n```\nproc cas;\n```\n\n```\n \n```\n\n```\nAddLayer / model=’Tiny-Yolov2’ name=’ConVL1’\
    \ layer={type=’CONVO’ nFilters=1000 /*588*/  width=1 height=1 stride=1 act=’identity’\
    \ includeBias=FALSE} srcLayers={‘convo.9’};\n```\n\n"
