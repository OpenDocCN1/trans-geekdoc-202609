    Introduction


    By itself, image classification is a task of examining an image that is usually
    well framed and responding with a probability of classification that describes
    the image. Object detection is more advanced than image classification because
    object detection analyzes complex images that contain a mixed multitude of objects,
    at different distances and locations, amidst varying, often visually noisy backgrounds.
    Objects can appear anywhere within the visual frame, be near or far, and can overlap
    each other. (See Figure 4.1.) Object detection locates and classifies objects,
    and it determines these objects’ boundaries and relationships to other objects.


    Figure 4.1: Object Classification


    ![](image/Image873.jpg)


    Object detection is a challenging task, as well as one of the most fundamental
    tasks in computer vision. We use convolutional neural networks (CNNs) to perform
    tasks that include object identification, object localization, and bounding, as
    well as object classification. Lately, CNN-based deep learning algorithms like
    the following have been successful in addressing problems associated with object
    detection tasks:


    ● You Only Look Once (YOLO)


    ● Single Shot MultiBox Detector (SSD)


    ● Region Proposal Networks (R-CNN)


    ● Faster Region Proposal Networks (Faster R-CNN)


    ● Backbone feature extractor for object detection (DETNet)


    Types of Object Detection Algorithms


    Object detection algorithms can be categorized as follows. The first category
    of object detection algorithms looks for objects in one step with anchors of predefined
    sizes at predefined locations. The locations and fixed sizes are strategically
    selected in order to cover the greatest number of scenarios. The algorithms typically
    separate the original images into fixed-size grid regions. For each region, these
    algorithms try to predict a fixed number of objects using certain predetermined
    shapes and sizes. Algorithms in this category are called single-stage methods.
    Examples of single-stage algorithms include YOLO, SSD, and RetinaNet. Algorithms
    in this category usually run faster but can be less accurate. This type of algorithm
    is often used for applications that require real-time detection.


    The second category of object detection algorithms is region proposals that involve
    two steps. Under region proposal, the regions that are highly likely to contain
    an object are selected either using traditional computer vision techniques (like
    selective search) or by using a deep-learning-based region proposal network (RPN).
    After you gather the small set of candidate windows, you can formulate a specific
    number of regression models and classification models to solve the object detection
    problem. This category includes algorithms like Faster R-CNN, R-FCN, and FPN-FRCN.
    Algorithms in this category are usually called two-stage methods. They are generally
    more accurate but are often slower than single-stage methods.


    The deep learning tools in SAS support two representative object detection algorithms:
    YOLO and Faster R-CNN. YOLO is a one-stage, fixed-size object detection algorithm.
    Faster R-CNN is a two-stage region, proposal-based object detection algorithm.


    One-stage object detectors like YOLO analyze an image in a single pass, and they
    output multiple object location and classification predictions. As a result, YOLO
    networks are fast when compared to multi-stage algorithms like R-CNNs. YOLO architectures
    are also able to perform image reasoning with larger contexts during training.'
