  trans: '

    随着网络深度的增加，增加滤波器的数量是非常常见的。例如，第一层卷积层可能包含 32 个滤波器，下一层卷积层有 64 个，下一层有 128 个，依此类推。增加卷积滤波器的数量是为了抵消在使用较大步长值（即步长大于
    1 的值）时发生的信息减少。


    接下来的图将详细介绍一个示例卷积层的细节。


    在卷积的前向传播过程中，如图 2.5 所示，滤波器被放置在输入空间的起始位置。


    图 2.5：滤波器的起始位置


    ![](img/Image895.jpg)


    如图 2.6 所示，计算滤波器条目与该位置输入之间的点积。对于此示例，我们用 `1*245 + 1*97 + 1*239 + 0*185 + 0*207 +
    0*11 + -1*212 + -1*175 + -1*160` 加上我们的偏置 `10`，从而在特征图中得到 `44` 的输出。


    图 2.6：滤波器与输入条目之间的乘积


    ![](img/Image903.jpg)


    因此，滤波器与局部输入空间之间的点积得到的值变为第一个输出值。然后，算法在输入空间滑动每个滤波器。移动范围由 `STRIDE` 超参数决定，如图 2.7 所示。步长值控制跨越输入空间宽度的移动，以及高度。


    图 2.7：由 `STRIDE` 超参数引起的移动范围


    ![](img/Image912.jpg)


    滤波器移动后，继续执行相关操作，计算下一个输出值。重复此过程，随着滤波器在输入卷的宽度高度上移动，我们产生一个二维特征图，给出该滤波器在每个空间位置的响应，如图
    2.8 所示。


    图 2.8：每个空间位置具有滤波器响应的特征图


    ![](img/Image919.jpg)


    滤波器值是卷积层的可学习参数（即层的权重），偏置等于 `β`。


    每个滤波器的通道数将与输入信息相同。然而，无论通道数多少，输出始终是一个二维网格。图 2.9 所示的示例中，单个滤波器与三个通道的信息相结合。每个通道可以被认为是信息的“一部分”。这个单一的
    3x3 滤波器有 `28` 个权重。也就是说，每部分信息被分配了九个权重，总共 `27` 个权重。然后我们有偏置，它给了我们第 `28` 个权重。非线性激活![](img/Image927.png)，例如指数线性、双曲正切、修正线性或其他变换，可以应用于特征图的输出值，如图
    2.9 所示。


    图 2.9：滤波器权重和非线性变换


    ![](img/Image935.png)


    ### 填充 (Padding)


    卷积和池化都会增加欠拟合的压力，这在很大程度上是因为添加更多此类层会导致信息减少。填充可以抵消或减轻信息的丢失。填充增加了图像边缘现有像素的相关性。


    填充的目的是根据原始输入图像尺寸和滤波器尺寸产生尺寸“合理”的输出图像。关键问题在于输入图像维度是偶数还是奇数、滤波器维度是偶数还是奇数，以及用户指定的步长值。


    以下是一些“合理”规则：


    *   水平填充和垂直填充尺寸是相互独立的。改变图像或滤波器的水平维度不会影响垂直填充尺寸。

    *   如果步长为 `1`，则输出图像尺寸与输入图像尺寸相同。在讨论卷积时，这有时被称为相同填充 (same padding)。

    *   如果步长为 `2`，则输出图像尺寸大约为输入图像尺寸的一半。

    *   首先添加到图像的右侧，然后是左侧。因此，如果填充不均，右侧的填充比左侧多。

    *   图像用零进行填充。


    如果没有填充，取决于滤波器的尺寸和步长，特征图可能远小于输入，如图 2.10 所示。


    卷积层引起的收缩可以通过使用填充来缓解。如果步长为 `1`，输出图尺寸与输入图尺寸完全相同，因为 `SAS DEEPLEARN` 动作集中的默认行为是自动填充通道或特征图。如果步长为
    `2`，输出图的面积将减少约 4 倍（`2*2`）。


    图 2.10：没有填充的特征图


    ![](img/Image942.jpg)


    卷积层引起的收缩可以通过使用填充来缓解，如图 2.11 所示。


    图 2.11：带有填充的特征图


    ![](img/Image953.jpg)


    要在 SAS 中配合 GPU 使用填充，必须在 `dlTrain` 动作中将 `FORCEEQUALPADDING` 选项设置为 `True`。这意味着特征图的所有侧都应用相等填充。如果指定了
    `GPU=TRUE` 选项，SAS 默认 `FORCEEQUALPADDING=TRUE`：


    ```

    ForceEqualPadding=True

    ```


    如果没有填充，特征图会缩小，如图 2.12 所示。


    图 2.12：无填充


    ![](img/Image961.jpg)


    特征图的维度并不是 SAS 默认产生的，接下来的图 2.13 所示。


    图 2.13：SAS 的自动填充


    ![](img/Image968.png)


    SAS 在假设步值为 1 时自动填充以抵消特征图尺寸的自然减少。当步长大于 1 时，SAS 仍应用填充，但当步长大于 1 时，特征图将比输入小。这意味着使用大于
    1 的步长会减少输出特征图的大小。此外，如果生成的卷积特征图是非整数矩阵，SAS 会自动应用额外的填充。例如，考虑输入信息为 12x12 矩阵的情况。使用
    3x3 滤波器和步长二将产生 `6.5`（一个非整数值），如图 2.14 所示。


    图 2.14：SAS 自动调整非整数特征图


    ![](img/Image976.png)


    ### 特征图维度


    输出的维度由输入、滤波器和填充结合步长尺寸决定，如图 2.15 所示。


    图 2.15：特征图维度


    ![](img/Image983.jpg)


    特征图维度可以通过以下公式计算：


    ![](img/Image992.png)


    `image/Image999.png` 代表输入维度，`image/Image1007.png` 代表填充值（稍将讨论），`image/Image1016.png`
    代表滤波器尺寸，`image/Image1027.png` 代表步长尺寸。


    ### 池化层 (Pooling Layers)


