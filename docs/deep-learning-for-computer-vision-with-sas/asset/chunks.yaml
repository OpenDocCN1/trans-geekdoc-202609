    \nChapter 5: Computer Vision Case Study\n\nThis chapter details a computer vision\
    \ case study using the SAS programming language.\n\nOne of the world’s foremost\
    \ medical research centers seeks to build a computer vision model to automatically\
    \ extract and summarize an understanding of metabolic pathways from an image depicting\
    \ the structure. That is, understanding the geometric sequence created by a series\
    \ of chemical compounds and arrows. The images are parsed from research papers\
    \ or journals.\n\nThis case study details a solution that involves creating a\
    \ two-stage computer vision model. The first stage relies on an object localization\
    \ (detection) model. An image classifier is used in the second stage to classify\
    \ the orientation of an extracted arrow. However, only the first stage is described\
    \ in this case study.\n\nThe training data consist of 871 labeled images, of which\
    \ approximately half of the images were extracted from papers and the other half\
    \ of the images were synthetically generated by hand. The synthetic images have\
    \ variants of arrows positioned in random orientation in combination with randomly\
    \ selected compounds. Each synthetic image contains noise to improve generalization\
    \ (text, shapes, random noise patches, and so on). Additionally, the synthetic\
    \ images were designed so that each arrow and compound could be “boxed” without\
    \ capturing other protruding edges in hopes of reducing entity obfuscation, as\
    \ seen in Figure 5.1.\n\nFigure 5.1: Synthetic Images\n\n![](image/Image845.png)\n\
    \nAn example of several labeled images can be seen in Figure 5.2.\n\nFigure 5.2:\
    \ Labeled Images\n\n![](image/Image852.png)\n\nThe data is in a SASHDAT data file\
    \ titled Train\\_metabolic\\_pathways.\n\n1\\. Open the program titled CASESTUDY\\\
    _1a. This program begins with a macro variable defining the location of the data\
    \ and programs.\n\n%let datalocation= \\*specify the location of the programs\
    \ and data here;\n\nThen the cas libraries are established.\n\n```\nlibname mycas\
    \ cas;\n```\n\n```\nproc cas;\n```\n\n```\n   table.addCaslib / name=’Scoreimageslib’\
    \ path=”&datalocation”\n```\n\n```\n               subdirectories=true;\n```\n\
    \n```\nquit;\n```\n\n2\\. Next, a macro is created that is used to create a list\
    \ of output variable names corresponding to the maximum number of objects in an\
    \ image that exist in the training data. In this case, the largest number of objects\
    \ in an image is 41. The list of output variables includes the number of objects\
    \ in the image (\\_nobjects\\_) and a set of variables defining the spatial location\
    \ of each entity. (ex. \\_Object#\\_, \\_Object#\\_x, \\_Object#\\_y, \\_Object#\\\
    _width, and \\_Object#\\_height). The list of variable names is stored in a macro\
    \ variable called ObjectTargets.\n\n```\n%macro makevars;\n```\n\n```\ndata mycas.createvars;\n\
    ```\n\n```\n_nObjects_=.;\n```\n\n```\n%do i=0 %to 40;\n```\n\n```\nlength _Object&i._\
    \ varchar(8);\n```\n\n```\nlength _Object&i._x _Object&i._y _Object&i._width _Object&i._height\
    \ 8;\n```\n\n```\n_Object&i._=’        ‘;\n```\n\n```\n_Object&i._x=.;\n```\n\n\
    ```\n_Object&i._y=.;\n```\n\n```\n_Object&i._width=.;\n```\n\n```\n_Object&i._height=.;\n\
    ```\n\n```\n%end;\n```\n\n```\nrun;\n```\n\n```\n%mend makevars;\n```\n\n```\n\
    %makevars;\n```\n\n```\n proc transpose data=mycas.createvars out=createvars_Transposed;\n\
    ```\n\n```\n var _all_;\n```\n\n```\n run;\n```\n\n```\n proc sql;\n```\n\n```\n\
    \ \tselect quote(trim(_NAME_), “’”)\n```\n\n```\n         into: ObjectTargets\
    \ separated by “, “\n```\n\n```\n         from work.createvars_Transposed;\n```\n\
    \n```\n quit;\n```\n\n3\\. Next, the program uploads the Train\\_metabolic\\_pathways\
    \ data.\n\n```\nproc casutil;\n```\n\n```\nload file=”&datalocation/Train_metabolic_pathways.sashdat”\
