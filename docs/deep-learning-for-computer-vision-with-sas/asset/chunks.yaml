    \n# Chapter 5: Computer Vision Case Study\n\nThis chapter details a computer vision\
    \ case study using the SAS programming language.\n\nOne of the world’s foremost\
    \ medical research centers seeks to build a computer vision model to automatically\
    \ extract and summarize an understanding of metabolic pathways from an image depicting\
    \ the structure. That is, understanding the geometric sequence created by a series\
    \ of chemical compounds and arrows. The images are parsed from research papers\
    \ or journals.\n\nThis case study details a solution that involves creating a\
    \ two-stage computer vision model. The first stage relies on an object localization\
    \ (detection) model. An image classifier is used in the second stage to classify\
    \ the orientation of an extracted arrow. However, only the first stage is described\
    \ in this case study.\n\nThe training data consist of 871 labeled images, of which\
    \ approximately half of the images were extracted from papers and the other half\
    \ of the images were synthetically generated by hand. The synthetic images have\
    \ variants of arrows positioned in random orientation in combination with randomly\
    \ selected compounds. Each synthetic image contains noise to improve generalization\
    \ (text, shapes, random noise patches, and so on). Additionally, the synthetic\
    \ images were designed so that each arrow could be “boxed” without capturing other\
    \ edges, as seen in Figure 5.1.\n\nFigure 5.1: Synthetic Images\n\n![](image/Image845.png)\n\
    \nAn example of labeled images can be seen in Figure 5.2.\n\nFigure 5.2: Labeled\
    \ Images\n\n![](image/Image52.png)\n\nThe data is in a SAS data file titled `Train_metabolic_pathways`.\n\
    \n1. Open the program titled `CASESTUD_1a`. This program begins with a macro variable\
    \ defining the location of the data and programs. `%let datalocation=*specify\
    \ the location of programs here;` Then the cas libraries are established.\n\n\
    ```\nlibname mycas;\n```\n\n```\nproc cas;\n```\n\n```\n   table.addlib name=’images’\
    \ path=”&datalocation”\n```\n\n```\n               subdirectories=true;\n```\n\
    \n```\nquit;\n```\n\n2. Next, a macro is created that is used to create a list\
    \ of output variable names corresponding to the maximum number of objects in an\
    \ image that exist in the training data. In this case, the largest number of objects\
    \ in an image is 41. The list of output variables includes the number of objects\
    \ in the image (`nobjects_`) and a set of variables defining the spatial location\
    \ of each entity (`Object#_x`, `Object#_y`, `Object#_width`, and `Object#_height`).\
    \ The list of variable names is stored in a macro variable `ObjectTargets`.\n\n\
    ```\n%macro makevars;\n```\n\n```\ndata mycas.createvars;\n```\n\n```\n_nObjects_.;\n\
    ```\n\n```\n%do i=0 %to 40;\n```\n\n```\nlength _Object&i._ varchar(8);\n```\n\
    \n```\nlength _Object&i._x _Object&i._y _Object&i._width _Object&i._height 8;\n\
    ```\n\n```\n_Object&i._=’;\n```\n\n```\n_Object&i._x=.;\n```\n\n```\n_Object&i._y=.;\n\
    ```\n\n```\n_Object&i._width=.;\n```\n\n```\n_Object&i._height=.;\n```\n\n```\n\
    %end;\n```\n\n```\nrun;\n```\n\n```\n%mend makevars;\n```\n\n```\n%makevars;\n\
    ```\n\n```\n proc transpose data=mycas.createvars out=createvars_Transposed;\n\
    ```\n\n```\n var _all_;\n```\n\n```\n run;\n```\n\n```\n proc sql;\n```\n\n```\n\
    select quote(trim(_NAME_))\n```\n\n```\ninto: ObjectTargets separated by “,\n\
    ```\n\n```\nfrom work.createvars_Transposed;\n```\n\n```\n quit;\n```\n\n3. Next,\
    \ the program uploads the `Train_metabolic_pathways` data.\n\n```\nproc casutil;\n\
    ```\n\n```\nload file=”&datalocation/Train_metabolic_pathways.sashdat” /*TrainsetFull.sashdat\
    \ TrainsetFull*/\n```\n\n```\ncasout=”ChemArrows”\n```\n\n```\nimportoptions=(filetype=”hdat”)\n\
    ```\n\n```\nreplace;\n```\n\n```\nquit;\n```\n\nThe images in the training data\
    \ have been resized to 416 x 416 and have been converted to grayscale. The data\
    \ also includes a partition indicator, `_partind_`.\n\n4. Next, the program loads\
    \ a pretrained model called `Tiny-Yolov2`. SAS provides a large number of pretrained\
    \ models that can be retrieved from the following URL: `https://support.sas.com/documentation/prod-p/vdmml/index.html`.\n\
    \n```\n/* Load model - TinyYolov2 */\n```\nproc casutil;\n```\n\n```\nload file=”&datalocation/Tiny-Yolov2.sashdat”\n\
    ```\n\n```\ncasout=”Tiny-Yolov2”\n```\n\n```\nimportoptions=(filetype=”hdat”)\n\
    ```\n\n```\nreplace;\n```\n\n```\nquit;\n```\n\n```\nproc casutil;\n```\n\n```\n\
    load file=”/data/roban/Models/Pretrained/Tiny_Yolo/Tiny-Yolov2_weights.sashdat”\n\
    ```\n\n```\ncasout=”Tiny-Yolov2_weights”\n```\n\n```\nimportoptions=(filetype=”hdat”)\n\
    ```\n\n```\nreplace;\n```\n\n```\nquit;\n```\n\n5. The model table is displayed\
