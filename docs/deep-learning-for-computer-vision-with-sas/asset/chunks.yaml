  trans: '

    例如，你可以在输入图像上使用滑动窗口方法并单独对输入图像进行翻转。输出的 `CAS` 表包含生成的图像。此外，`writeRandomly` 参数允许你对输入图像随机应用数据增强。这对于基于深度神经网络的机器学习方法非常重要。


    将 `sweepImage` 和 `useWholeImage` 参数都设置为 `True` 是相互矛盾的。因此，`useWholeImage` 参数会覆盖
    `sweepImage` 参数。


    下面的代码演示了如何使用 `AugmentImage` 操作对一个 32 x 32 像素的图像应用两种变换。


    ```

    PROC CAS;

    AugmentImages / table={name= “MyInputTable” casOut={name= “MyOutputTable"} writeRandomly=
    true cropList={mutations= { colorjittering= true rotateright= true } width= 32
    heigth= 32 useWholeImage= true}};

    RUN;

    ```


    ## 高斯滤波器


    高斯滤波器用于平滑图像内部的剧烈变化。


    图 3.14：高斯滤波器


    ![](img/Image3151.jpg)


    这种光度变换通过混合像素来创建图像的模糊版本。如图 3.14 所示，较大的卷积核会增加变换的模糊效果。高斯滤波器对核的中心赋予更大的权重，使得感兴趣区域与周围像素轻微混合。一个高斯核滤波器的示例可能如下所示。


    图 3.15：高斯核滤波器


    ![](img/Image3159.jpg)


    用户只需要提供高斯核的高度和宽度。SAS 会创建一个有效的核，使得二维核下方的体积积等于 1。`processImages` 操作被用于创建经高斯滤波器变换的图像。以下是一些示例代码：


    ```

    PROC CAS;

    image.processImages / imageFunctions= {{functionOptions= {functionType= “GAUSSIAN_FILTER”
    KernelWidth= 5 KernelHeight= 5}} table={name=’inputTable''} casout={name=’outputTable’};

    RUN;

    ```


    ## 锐化


    对图像进行锐化处理被认为是一种光度变换，如图 3.16 所示。


    图 3.16：锐化


    ![](img/Image3166.jpg)


    为了锐化图像，SAS 将红、绿、蓝（RGB）彩色图像编码为 `Y′CbCr`，其中 `Y’` 是亮度分，`Cb` 代表蓝差分量，`Cr` 代表红差分量。然后对编码图像应用高通滤波器以检测边缘。图
    3.17 是高通滤波器的示例。


    图 3.17：高通滤波器


    ![](img/Image3174.jpg)


    然后将图像转换回 RGB 彩色空间。以下是锐化图像的示例代码：


    ```

    PROC CAS;

    image.processImages / imagefunctions= {{functionOptions= {functionType=”MUTATIONS”
    type=”SHARPEN”}}} table={name=’inputTable''} casout={name=’outputTable’};

    RUN;

    ```


    ## 像素反转


    像素反转是一种光度变换，它反转颜色密度，使得亮变暗，暗变亮，如图 3.18 所示。


    图 3.18：像素反转


    ![](img/Image3181.jpg)


    这可以简单地将每个 RGB 像素值替换为 `(255 – pixel value)`。以下是演示如何使用 SAS 反转像素的示例代码：


    ```

    PROC CAS;

    image.processImages / imagefunctions= {{functionOptions= {functionType=”MUTATIONS”
    type=”INVERT_PIXELS”}}} table={name=’inputTable''} casout={name=’outputTable’};

    RUN;

    ```


    ## 金字塔下采样


    金字塔下采样变换对图像进行下采样然后进行模糊。示例如图 3.19 所示。


    图 3.19：金字塔下采样与裁剪变换


    ![](img/Image3189.jpg)


    图 3.19 的示例中也使用了裁剪。经验证据，裁剪作为一种几何增强，可以显著提高卷积神经网络模型的泛化性能（Taylor and Nitschke 2017）。`augmentImages`
    操作用于在同次处理中同时裁剪并应用金字塔下采样变换。


    在下面的代码中，注意 `useWholeImage=` 被设置为 `false`，这表示可能会执行裁剪。


    ```

    proc cas;

    image.augmentImages / cropList= {{mutations= {pyramidDown=TRUE} x=60 y=60 }} useWholeImage=false;
    table={name=’inputTable''} casout={name=’outputTable’};

    run;

    ```


    ## 旋转


    图像旋转是最流行的几何变换之一，因为对象的角度在应用中可能会变化。图 3.20 显示了图像向左或向右旋转的方法，SAS 会自动用零填充填充外部边缘。然而，将零填充替换为噪声有助于模型的泛化能力。或者，你可以先旋转然后裁剪图像以移除零填充。以下是
    `processImages` 操作将图像向右旋转的代码：


    ```

    PROC CAS;

    image.processImages / imagefunctions= {{functionOptions= {functionType=”MUTATIONS”
    type=”ROTATE_RIGHT”}}} table={name=’inputTable’};

    RUN;

    ```


    ## 翻转


    图像翻转是另一种广泛的几何变换，但应该谨慎使用，因为它有时会创建标记错误的图像或代表不太可能的情况。图 3.21 显示了图像翻转的示例。


    ![](img/Image3209.jpg)下面的代码使用 `processImages` 操作垂直翻转图像。


    ```

    PROC CAS;

    image.processImages / imagefunctions= {{functionOptions= {functionType=”MUTATIONS”
    type=”VERTICAL_FLIP”}}} table={name=’inputTable''} casout={name=’outputTable’};

    RUN;

    ```


    ## 迁移学习引言


    传统的机器学习方法从一个数据源提取信息并用于另一个数据源，前提是分布是相同的，或者是非常相似的，如图 3.23 所示。


    '
