    ## Types of Transfer Learning


    There are two types of transfer learning: homogeneous (where `Xs=Xt`) and heterogeneous
    (where `Xs≠Xt`). An example of homogeneous transfer learning is shown in Figure
    3.24.


    ### Figure 3.27: Homogeneous Transfer Learning


    ![](image/Image3270.jpg)


    Note: `Xs=Xt`.


    ## Heterogeneous Transfer Learning and Domain Adaptation


    As mentioned above, heterogeneous learning refers to `Xs≠Xt`. An example of heterogeneous
    learning is shown in Figure 3.28.


    ### Figure 3.28: Heterogeneous Transfer Learning with Tabular Data


    ![](image/Image3277.jpg)


    Domain adaption is closely related to `Ds≠Dt`. For example, consider the task
    of generating text. The domains are the same, but the languages differ. It is
    common to leave the weights unfrozen and of the features from the source data
    to the target domain. Domain adaption would alter (or adapt) the source domain.
    Glorot et al. (2011) demonstrated stacked denoising autoencoders could be used
    for domain adaption. There are many inconsistencies in literature with the domain
    definition. Goodfellow et al. 2016.


    ## Transfer Learning Biases


    Transfer learning can be difficult because by invention, there exists a difference
    in transfer learning. These differences can give rise to biases and can cause
    the model to degrade to the point of negative learning. Bias is the primary cause
    of negative learning. The two most common types of transfer learning biases are
    frequency bias and context bias.


    ### Frequency Bias


    Frequency bias occurs when features are not independent of the domain, and the
    transfer learning strategy is deployed across different domains. For example,
    consider the task of sentiment analysis across two domains, a hospital domain,
    and a business domain. Words such as “people,” “help,” and “work” are independent
    of the domains and are likely to occur at similar rates. However, words such as
    “heart,” “patient,” and “medication” are likely to occur more frequently in the
    hospital domain, and words like “profit,” “customer,” and “sales” would be more
    frequent in the business domain. Therefore,(image/Image3285.png), meaning the
    marginal probability distribution of the features does not match.


    ### Context Bias


    Context bias occurs when the underlying relationship between the features and
    the output changes from source data to target data. Consider our earlier example
    of the hospital and business domains. The word “positive” used in a business domain
    would likely have positive sentiment. However, that same word used in a hospital
    domain might have negative sentiment. For example, “the test results came back
    positive,” where the word “positive” is in reference to the presence of a disease.
    Therefore, context bias refers to instances where![](image/Image3294.png), meaning
    that the conditional probability distributions are different from the source data
    to the target data.


    ## Transfer Learning Strategies


    There are many methods that are used for transfer learning. Two of the most general
    forms are supervised and unsupervised pretraining.


    ### Supervised Pretraining


    One method for supervised pretraining incorporates first training a model on the
    source data. The model weights are then transferred and frozen for use by the
    target data. It is common to leave some weights unfrozen to allow for reconciliation
    between the weights learned on the source data, and differences in the target
    data.

    '
  trans: '

    预测建模是一个经典案例，其利用从历史或当前数据中提取的信息，来预测与尚未观测到的数据相关的结果。预测模型假设特征分布从训练到评分阶段保持不变。


    迁移学习是机器学习的一个领域，如图 3.24 所示，它利用从一组分布中提取的信息，并将其应用于另一组不同的分布中。


    ### 图 3.24：不相似的分布


    ![](img/Image3239.png)


    也就是说，迁移学习指的是从一个设置（通常称为源域）中提取的信息被利用在另一个设置（通常称为目标域）中，以提高学习者的性能。这意味着所提取信息的特征空间与目标学习器（模型）关联的特征空间是不同的。迁移学习指的是从一个设置中提取的信息被利用在另一个设置，目标是提高学习者的性能。更正式地说，源域（`s`）和目标域（`t`）不匹配（`Ds
    ≠ Dt`），或者源任务和目标任务不匹配（`Ts ≠ Tt`）（Weiss, Khoshgoftaar, and Wang 2016）。


    ## 域与子域


    域是由一组特征描述的环境或设置。（参见图 3.25。）域是子域的先驱，域和子域的结构描述了相关信息的层级关系。域以及扩展的子域，由特征空间（`X`）和边缘概率分布（`P
    (X)`）定义。例如，英语、中文和冰兰语的翻译各是自然语言处理域的子域（Weiss, Khoshgoftaar, and Wang 2016）。


    ### 图 3.25：域与子域的示例


    ![](img/Image3246.jpg)


    注意：通常，在考虑源域和目标域是否相等时，出于实用考虑，最近的子域被视为“域”。即回答问题 `XS=XT` 且 `P(XS)=P(XT)` 是否？


    ## 任务


    域只考虑输入变量，而任务考虑结果。任务由输出空间（`Y`）和条件概率分布（`P(Y|X)`）定义。例如，图 3.26 显示，预测分类结果（例如根据狗的图像预测其品种）是计算机视觉域内的一个任务（Weiss,
    Khoshgoftaar, and Wang 2016）。


    ### 图 3.26：域与任务


    ![](img/Image3255.jpg)


    因此，我们可以正式地定义迁移学习为：“给定一个具有相应任务 `Ts` 的源域 `Ds` 和一个具有相应任务 `Tt` 的目标域 `Ts`，迁移学习是利用 `Ds`
    和 `Dt` 的相关信息来改进目标函数 `ft(x)`!(image/Image3262.png)，其中 `Ds≠Dt` 或 `Ts≠Tt`（Weiss,
    Khoshgoftaar, and Wang 2016）。”


    ## 迁移学习的类型


    迁移学习有两种类型：同质迁移（`Xs=Xt`）和异质迁移（`Xs≠Xt`）。图 3.24 展示了同质迁移的示例。


    ### 图 3.27：同质迁移学习


    ![](img/Image3270.jpg)


    注意：`Xs=Xt`。


    ## 异质迁移学习与领域自适应


    如上所述，异质学习指的是 `Xs≠Xt`。图 3.28 展示了异质学习的示例。


    ### 图 3.28：带有表格数据的异质迁移学习


    ![](img/Image3277.jpg)


    领域自适应与 `Ds≠Dt` 密切相关。例如，考虑生成文本的任务。域是相同的，但语言不同。通常的做法是保持权重冻结状态，并从源数据迁移到目标域。领域自适应会改变（或调整）源域。Glorot
    等人 (2011) 证明了堆叠去噪自动编码器可领域自适应。文献中关于领域的定义存在许多不一致之处。Goodfellow 等人 2016。


    ## 迁移学习偏差


    迁移学习可能是困难的，因为本质上迁移学习存在差异。这些差异会导致偏差，并引起模型性能下降。偏差是负面学习的主要原因。两种最常见的迁移学习偏差是频率偏差和上下文偏差。


    ### 频率偏差


    当特征不独立于域且迁移学习策略部署在不同域时，就会发生频率偏差。例如，考虑跨域（医疗域和商业域）的情感分析任务。“人们”、“帮助”和“工作”等词与域无关，可能以相似的频率出现。然而，“心脏”、“病人”和“药物”等词在医疗域中可能更频繁，而“利润”、“客户”和“销售”在商业域可能更频繁。因此，image/Image3285.png)，意味着特征的边缘概率分布不匹配。


    ### 上文偏差


    当特征与输出之间的底层关系从源数据变为目标数据变化时，就会发生上下文偏差。考虑我们之前关于医疗域和商业域的示例。商业域中的“阳性”一词通常具有积极的情感。然而，同一个词在医疗域中可能具有负面的情感。例如，“检测结果呈阳性”，这里的“阳性”是指疾病的存在。因此，上下文偏差指的是这种情况
    image/Image3294.png)，意味着条件概率分布从源数据到目标数据不同。

    '
