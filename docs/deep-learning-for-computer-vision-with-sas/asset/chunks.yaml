  fmt: '

    For example, you can use the sliding window method on input images and separately
    flip input images. The output `CAS` table contains the resulting images. In addition,
    the `writeRandomly` parameter enables you to randomly apply augmentations to input
    images. This is very important for machine learning methods that are based on
    deep neural networks.


    Setting both the `sweepImage` and `useWholeImage` parameters to `True` is contradictory.
    Therefore, the `useWholeImage` parameter overrides the `sweepImage` parameter.


    The code below is an example that demonstrates how to use the `AugmentImage` action
    to apply two transformations to a 32 x 32-pixel image.


    ```

    PROC CAS;

    AugmentImages / table={name= “MyInputTable” casOut={name= “MyOutputTable"} writeRandomly=
    true cropList={mutations= { colorjittering= true rotateright= true } width= 32
    heigth= 32 useWholeImage= true}};

    RUN;

    ```


    ## Gaussian Filters


    Gaussian filters are used to smooth steep variations within an image.


    Figure 3.14: Gaussian Filter


    ![](image/Image3151.jpg)


    This photometric transformation blends pixels to create a blurred version of the
    image. Larger kernels increase the blurred effect of the transformation as seen
    in Figure 3.14. A Gaussian filter applies larger weights to the center of the
    kernel such that the area of interest is lightly blended with surrounding pixels.
    An example Gaussian kernel filter might look something like the figure below.


    Figure 3.15: Gaussian Kernel Filter


    ![](image/Image3159.jpg)


    The user needs to provide only the height and width of the Gaussian kernel. SAS
    creates a valid kernel such that the volume under the two-dimensional kernel equals
    1. The `processImages` action is used to create images transformed by Gaussian
    filters. Here is some example code:


    ```

    PROC CAS;

    image.processImages / imageFunctions= {{functionOptions= {functionType= “GAUSSIAN_FILTER”
    KernelWidth= 5 KernelHeight= 5}} table={name=’inputTable''} casout={name=’outputTable’};

    RUN;

    ```


    ## Sharpen


    Sharpening an image is considered a photometric transformation, as seen in Figure
    3.16.


    Figure 3.16: Sharpen


    ![](image/Image3166.jpg)


    To sharpen an image, SAS encodes the red, green, blue (RGB) color image to `Y′CbCr`,
    where `Y’` is the brightness component, `Cb` represents the blue-difference component,
    and `Cr` represents the red-difference component. A high-pass filter is then applied
    to the encoded image to detect edges. Figure 3.17 is an example of a high-pass
    filter.


    Figure 3.17: High-Pass Filter


    ![](image/Image3174.jpg)


    Then the image is transformed back the RGB color space. Here is example code that
    sharpens an image:


    ```

    PROC CAS;

    image.processImages / imagefunctions= {{functionOptions= {functionType=”MUTATIONS”
    type=”SHARPEN”}}} table={name=’inputTable''} casout={name=’outputTable’};

    RUN;

    ```


    ## Inverting Pixels


    Pixel inversion is a photometric transformation that reverses the color density
    such that light becomes dark and dark becomes light, as seen in Figure 3.18.


    Figure 3.18: Inverting Pixels


    ![](image/Image3181.jpg)


    It can be as simple as replacing each of the RGB pixel values with `(255 – pixel
    value)`. Here is sample code that demonstrates how to invert pixels using SAS:


    ```

    PROC CAS;

    image.processImages / imagefunctions= {{functionOptions= {functionType=”MUTATIONS”
    type=”INVERT_PIXELS”}}} table={name=’inputTable''} casout={name=’outputTable’};

    RUN;

    ```


    ## Pyramid Down


    The Pyramid Down transformation downsamples and then blurs the image. An example
    is shown in Figure 3.19.


    Figure 3.19: Pyramid Down and Cropping Transformations


    ![](image/Image3189.jpg)


    Cropping was also used in the example in Figure 3.19. Empirical evidence indicates
    that cropping, a geometric augmentation, can significantly improve the generalization
    performance of a convolutional neural network model (Taylor and Nitschke 2017).
    The `augmentImages` action is used to both crop and apply the Pyramid Down transformation
    in the same pass.


    In the code below, notice that the `useWholeImage=` option is set to `false`,
    which indicates cropping will likely be performed.


    ```

    proc cas;

    image.augmentImages / cropList= {{mutations= {pyramidDown=TRUE} x=60 y=60 }} useWholeImage=false;
    table={name=’inputTable''} casout={name=’outputTable’};

    run;

    ```


    ## Rotating


    Rotating an image is one of the most popular geometric transformations because
    an object’s angle can vary in application. Figure 3.20 shows ways an image can
    be rotated either left or right, and SAS automatically pads the outer edges with
    zero-padding. However, replacing the zero-padding with noise might help the model’s
    generalizability. Alternatively, you can rotate and then crop the image to remove
    the zero-padding. Here is code that rotates an image to the right using the `processImages`
    action:


    ```

    PROC CAS;

    image.processImages / imagefunctions= {{functionOptions= {functionType=”MUTATIONS”
    type=”ROTATE_RIGHT”}}} table={name=’inputTable’};

    ```RUN;

    ```


    ## Flipping


    Flipping an image is another widespread geometric transformation, but it is one
    that should be used with care because it can sometimes create a mislabeled image
    or represent an unlikely scenario. Figure 3.21 shows an example of flipping an
    image.


    ![](image/Image3209.jpg)The code below flips an image vertically using the `processImages`
    action.


    ```

    PROC CAS;

    image.processImages / imagefunctions= {{functionOptions= {functionType=”MUTATIONS”
    type=”VERTICAL_FLIP”}}} table={name=’inputTable''} casout={name=’outputTable’};

    RUN;

    ```


    ## Transfer Learning Introduction


    Traditional machine learning methods extract information from one data source
    for use in another data source under the assumptions that the distributions are
    the same, or at least very similar, as in Figure 3.23.

