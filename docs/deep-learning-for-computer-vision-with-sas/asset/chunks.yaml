- raw: 'Note: For SGD with a single-machine server or a session that uses one worker
    on a distributed server, one epoch is reached when the action passes through the
    data one time. For a session that uses more than one worker, one epoch is reached
    when all the workers exchange the weights with the controller one time. The syncFreq
    parameter specifies the number of times each worker passes through the data before
    exchanging weights with the controller.


    The TUNEITER property specifies the number of iterations of the tuning algorithm
    to run. One iteration of the tuning algorithm trains the models using all active
    hyperparameter sets for the specified maxEpochs. The hyperparameters with the
    best validation fit error remain active for future tuning iterations.


    The NUMTRIALS property specifies the number of hyperparameter sets to try at the
    start of the tuning process. For example, specifying 100 for the property will
    begin the process training 100 models with different hyperparameter values.


    The TUNERETENTION property determines the proportion of hyperparameter configurations
    that are kept after each tuning iteration.


    The TUNERESTART specifies the number of times to restart the parameter tuning
    process, using the best available weights from a previous search, and newly chosen
    parameter sets.


    Choosing the appropriate set of tuner values for maxepochs, tuneiter, numtrials,
    tuneretention, and tunerestart is not trivial. A common approach is to set the
    maxepochs number to a small value so that the number of hyperparameter combinations
    (numtrials) can be assigned a larger value. This approach seems to imply that
    for hyperparameter search methods, the model parameter estimates (weights) matter
    less than the characteristics of a model. Regardless of whether this is true or
    not, there are instances when an alternative approach is warranted. For example,
    imagine your model’s current iteration plot resembles Figure 3.35.


    Figure 3.35: Current Iteration Plot


    ![](image/Image3363.png)


    It would then be logical to search L1 and L2 regularization values in hopes of
    reducing variance in the model. Setting the maxepochs value to a small number,
    such as four, might result in the process assessing the performance of each hyperparameter
    combination at a peak of poor performance, as seen in Figure 3.36.


    Figure 3.36: Setting Maxepochs to a Small Value


    ![](image/Image3370.png)


    Assessing the model at this point in the training process is likely to favor larger
    L1 and L2 values because larger values constrain weight growth, which is likely
    to cause the model to be less responsive to information in the data. Meaning,
    larger L1 and L2 values appear to have superior performance at epoch four because
    the degradation observed early in the process will be dampened. But are large
    L1 and L2 weight values really “best” for the model in the long run? One might
    postulate the answer is “no” because the model will struggle to capture less pronounced
    single that might exist in the data. Therefore, in this example it may be best
    to set maxepochs to a larger value to avoid assessing the hypermeter combination
    at the poor performance peak observed early in the training process, as seen in
    Figure 3.37.


    Figure 3.37: Setting Maxepochs to a Larger Value


    ![](image/Image3378.png)


    It is imperative that the business problem and the model’s interaction with the
    data should be considered when setting the tuning parameters.


