    \n```\nproc cas;\n```\n\n```\n table.shuffle / table=’smallImageData’ \n```\n\n\
    ```\n            casout={name=’SmallImageDatashuffled’, replace=1};\n```\n\n```\n\
    run;\n```\n\n```\nproc cas;\n```\n\n```\n table.shuffle / table=’LargeImageData’\
