    \ over others. For example, the authors of You Only Look Once: Unified, Real-Time\
    \ Object Detection discovered that the prediction scores for confidence were being\
    \ pressured toward zero because the number of cells not containing an object largely\
    \ outnumbered the number of cells containing an object. Therefore, the authors\
    \ used a lower scalar (that is, 0.5) to offset the lack of objects in most grid\
