- raw: "The data is increased from 10,000 observations to 50,000 observations. Variance\
    \ for both models decreases, and the performance on the holdout data has drastically\
    \ improved. The learning rate reductions are now clearly visible in the iteration\
    \ plots. See Figure 3.12 and Table 3.5.\n\nFigure 3.12: ResNet versus ResNext,\
    \ 50,000 Observations, 1,500 Epochs\n\n![](image/Image3119.jpg)\n\nTable 3.5:\
    \ ResNet versus ResNext, 50,000 Observations, 1,500 Epochs\n\n| Validation Misc\
    \ || ResNet || ResNext |\n\n| --- | --- | --- |\n\n| 10k obs, 60 epochs || 44.2\
    \ || 48.55 |\n\n| 10k obs, 1,500 epochs || 43.1 || 44.1 |\n\n| 10k obs, 1,500\
    \ epochs, 100% dropout added || 41.75 || 41.95 |\n\n| 50k obs, 1,500 epochs ||\
    \ 31.26 || 31.45 |\n\nImage Preprocessing and Data Enrichment\n\nIf there appears\
    \ to be a significant difference in performance between the training and validation\
    \ data partitions, then chances are that your model is suffering from high variance.\
    \ Gathering or generating more data and applying regularizations can mitigate\
    \ variance error. When generating images from the current data, translations and\
    \ minor distortions are added to the new permutations. However, the translations\
    \ should be random to avoid introducing bias. Enriching image data should be considered\
    \ when there is limited training data and there is a large discrepancy between\
    \ training and validation errors. This enrichment can be used to balance extreme\
    \ target distributions.\n\nSynthetic case creation is a practice used to enrich\
    \ training data with designer cases when obtaining more data is infeasible. These\
    \ artificial observations should represent possibilities that might exist in the\
    \ population but might not be observed in the actual training sample. The key\
    \ here is to create cases that represent the possible, not the impossible. For\
    \ example, suppose that we are analyzing images of people exiting a train onto\
    \ a station platform. We might want to add reasonable color distortions that might\
    \ mimic changes in lighting. However, we would not want to vertically invert the\
    \ picture because of gravitational influences present in the environment.\n\n\
    Sometimes, adding noise can improve model generalities. Consider modeling human\
    \ speech for a new application. It might be beneficial to add in white noise to\
    \ simulate the unpredictable environments in which the user might be attempting\
    \ to use the speech application. Even adding random patches can also be considered\
    \ a valid method used to generate more image data.\n\nData Augmentation Techniques\n\
    \nData augmentation techniques often fall into one of four broad categories: geometric,\
    \ photometric, domain, and generative.\n\n● Geometric transformations involve\
    \ changes in pixel orientation or position and are used to make the model more\
    \ robust to spatial differences. This means that the model is more invariant to\
    \ positional deviations of the elements in an image. Common transformations that\
    \ fit into this category include rotating, flipping, scaling, and cropping.\n\n\
    ● Photometric morphologies and transformations change the pixel intensity with\
    \ the intended consequence of making the model more robust (or invariant) to changes\
    \ in color. Common augmentation techniques include pixel inversion, lightening\
    \ / darkening, color shifting, color jittering, eroding, and many others.\n\n\
    ● Domain transformations incorporate data alterations driven by the modeler’s\
    \ knowledge of the data and the problem. Domain transformations usually incorporate\
    \ a photometric or geometric transformation (or both). For example, a government\
    \ agency building a facial recognition software using driver license photos might\
    \ want to create additional training images that incorporate black circles around\
    \ the individual’s eyes to simulate sunglasses. These types of transformations\
    \ are user generated.\n\n● Generative transformations often rely on a generative\
    \ model to create new translations of the input. These translations are defined\
    \ by the model and a set of input variable distributions. The generative modeling\
    \ field seems to be converging around one type of generative model, generative\
    \ adversarial models (GANs) (Goodfellow et al. 2014). The primary downside to\
    \ a generative model is the time that it takes to train and tune the model. Nevertheless,\
    \ the models’ generative capabilities are very impressive—so much so that, in\
    \ some cases, the generated content can be indistinguishable to the human eye.\n\
    \nFigure 3.13: Examples of Image Transformations\n\n![](image/Image3143.jpg)\n\
    \nWith all the complexities that accompany image data, generic synthetic case\
    \ creation is (perhaps surprisingly) quite simple. That is, an image can be augmented\
    \ with different techniques, such as flipping vertically, flipping horizontally,\
    \ scaling up and down with pyramids, changing the contrast (darkening or lightening),\
    \ sharpening, and rotating to the left or right. All these mutations can be applied\
    \ to new copies of a training image to generate new cases.\n\nMore complex data\
    \ augmentation techniques require extensive input from the modeler or incurring\
    \ the expense of time used to train a generative adversarial model.\n\nIt is important\
    \ to avoid mutations that might misrepresent the target. For example, vertically\
    \ flipping a 6 turns it into a 9, but with the label of a six. Care should be\
    \ taken to avoid these mistakes because they can degrade your model’s performance.\n\
    \nThe SAS Image action set contains a rich set of actions for image preprocessing\
    \ and data augmentation. The Image action set offers the ability to load, process,\
    \ and save images. It enables images to be used as a basic data type in SAS Viya.\
    \ The load and save actions support all common image formats such as JPG for photographic\
    \ images, and Digital Imaging and Communications in Medicine (DICOM) for biomedical\
    \ images. The process action supports all images loaded from a photographic format.\
    \ This chapter focuses on the ProcessImage and AugmentImage actions from the Image\
    \ action set.\n\nThe ProcessImage and AugmentImage actions are often used for\
    \ advanced augmentations. Augmenting the data before the modeling process incurs\
    \ additional cost because the data size is increased, reducing the overall speed\
    \ of the analysis. SAS deep learning provides basic augmentations “on the fly,”\
    \ which mitigates the speed reduction from data augmentation.\n\nProcess Image\
    \ Action\n\nThe processImages action performs single or multiple image-processing\
    \ functions on input images. The input of this action is a CAS table that contains\
    \ images and an array of functions (with their specific parameters) as shown in\
    \ the code below.\n\n```\nPROC CAS;\n```\n\n```\n ProcessImages / \n```\n\n```\n\
    \       table= {name= “< image table name >”}\n```\n\n```\n       casOut= {name=\
    \ “< output image table name >”}\n```\n\n```\n       imageFunctions= {\n```\n\n\
    ```\n              {functionOptions= {functionType= “< first transformation type\
    \ >”\n```\n\n```\n       < function type-specific-parameters >}},\n```\n\n```\n\
    \              {functionOptions= {functionType= “< second transformation type\
    \ >”\n```\n\n```\n       < function type-specific-parameters >}},\n```\n\n```\n\
    \                     {{….}}};\n```\n\n```\nRUN;\n```\n\nThe output is a CAS table\
    \ that contains the resulting images after the specified functions are applied.\
    \ You can define the following functions:\n\n● RESIZE: resizes an input image\
    \ based on the width and height parameters. The parameters must be specified as\
    \ positive integers.\n\n● GET\\_PATCH: creates a patch based on a rectangular\
    \ region (using x, y, width, and height parameters) from an input image. The x\
    \ and y parameters must be specified as integers that are greater than or equal\
    \ to 0. The width and height parameters must be specified as positive integers.\
    \ Further, if x + width is greater than the specified width of the input image,\
    \ then the width of the rectangular region is reduced to the input image’s specified\
    \ width. The same is true for the y and height parameters."
