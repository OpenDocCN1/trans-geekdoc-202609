    ```\n\n```\n                                   gamma=0.5},\n```\n\n```\n     \
    \                              minibatchsize=100,\n```\n\n```\n              \
    \                     maxepochs=200}\n```\n\nNote: The authors of ADAM recommend\
    \ a `β1` value of `.9`, a `β2` value of `.999`, and an `α` (learning rate) of\
    \ `.001`.\n\n## Weight Initialization\n\nDeep learning uses different methods\
    \ of weight initialization than traditional neural networks do. In neural networks,\
    \ the hidden unit weights are randomly initialized to ensure that each hidden\
    \ unit is approximating different areas of relationship between the inputs and\
    \ the output. Otherwise, each hidden unit would be approximating the same relational\
    \ variations if the weights across hidden units were identical, or even symmetric.\
    \ The hidden unit weights are usually randomly initialized to some specified distribution,\
    \ commonly Gaussian or Uniform.\n\nTraditional neural networks use a standard\
    \ variance for the randomly initialized hidden unit weights. This can become problematic\
    \ when there is a large amount of incoming information (that is, a large number\
    \ of incoming connections) because the variance of the hidden unit will likely\
    \ increase as the amount of incoming connections increases. This means that the\
    \ output of the combination function could be more extreme, resulting in a saturated\
    \ hidden unit (Daniely et al. 2017).\n\nDeep learning methods use a normalized\
    \ initialization in which the variance of the hidden weights is a function of\
    \ the amount of incoming information and outgoing information. SAS offers several\
    \ methods for reducing the variance of the hidden weights. Xavier initialization\
    \ is one of the most common weight initialization methods used in deep learning.\
    \ The initialization method is random uniform with variance\n\n![](image/Image1044.png)\n\
    \nwhere `m` is the number of input connections (fan-in) and `n` is the number\
    \ of output connections (fan-out) (hidden units in current layer).\n\nOne potential\
    \ flaw of the Xavier initialization is that the initialization method assumes\
    \ a linear activation function, which is typically not the case in hidden units.\
    \ MSRA was designed with the ReLU activation function in mind because MSRA operates\
    \ under the assumption of a nonzero mean output by the activation (He et al. 2015).\
    \ The MSRA initialization method is random Gaussian distribution with a standardization\
    \ of\n\n![](image/Image1051.png)\n\nSAS includes a second variant of MSRA, called\
    \ MSRA2. Similar to the MSRA initialization, the MSRA2 method is a random Gaussian\
    \ distribution with a standardization of\n\n![](image/Image1059.png)\n\nAnd it\
    \ penalizes only for outgoing (fan-out) information.\n\nNote: Weight initializations\
    \ have less impact over model performance if batch normalization is used because\
    \ batch normalization standardizes information passed between hidden layers. Batch\
    \ normalization is discussed later in this chapter.\n\nConsider the following\
    \ simple example where unit `y` is being derived from 25 randomly initialized\
    \ weights. The variance of unit `y` is larger when the standard deviation is held\
    \ constant at 1. This means that the values for `y` are more likely to venture\
    \ into a saturation region when a nonlinear activation function is incorporated.\
    \ On the other hand, Xavier’s initialization penalizes the variance for the incoming\
    \ and outgoing connections, constraining the value of `y` to less treacherous\
    \ regions of the activation. See Figures 1.7 and 1.8, noting that these examples\
    \ assume there are 25 incoming and outgoing connections.\n\n### Figure 1.7: Constant\
    \ Variance (Standard Deviation = 1)\n\n![](image/Image1080.png)\n\n### Figure\
    \ 1.8: Constant Variance (Standard Deviation =)\n\n![](image/Image1094.png)\n\n\
    Regularization\n"
  trans: "\n\n在梯度下降算法的批量变体中，权重更新向量的生成是通过使用训练集中所有的样本来决定的。也就是说，计算的是精确梯度，确保了能够平滑地向误差最小值移动。\n\
    \n然而，当训练数据集很大时，计算精确梯度的计算开销非常大。在沿梯度下降的每一步中，必须评估整个训练数据集。此外，如果数据是冗余的，数据后半部分的误差梯度与前半部分的梯度几乎相同。在这种情况下，计算整个数据集的梯度将浪费时间。较好的做法是计算权重子集的梯度，更新权重，然后在新的子集上重复此过程。在这种种情况下，每次权重更新都是基于对真实梯度的近似。但只要它指向与精确梯度大致相同的方向，近似梯度就是一种计算精确梯度的有效备用替代方案（Hinton\
    \ 2007）。\n\n推向极端，近似梯度的计算可以基于单个训练样本。然后更新权重，并在下一个样本上计算梯度。这被称为**随机梯度下降**（stochastic\
    \ gradient descent，也称为在线学习）。（见图 1.6。）\n\n### 图 1.6：随机梯度下降\n\n![](img/Image1013.jpg)\n\
    \n随机梯度下降非常有效，特别是当与动量项 `δ(t-1)` 结合时：\n\n![](img/Eq_pg_10.jpg)\n\n由于随机梯度下降在计算每个下降步的梯度时不需要考虑整个训练数据集，它通常比批量梯度下降更快。然而，由于每次迭代都试图更好地拟合单个观测值，某些梯度实际上可能会远离最小值。这意味着，尽管随机梯度下降通常向误差最小值的方向移动参数，但每次迭代并不一定这样做。结果是产生了一条更加迂折的路径。事实上，随机梯度下降并不会以批量梯度下降相同的方式收敛。相反，它在靠近最小值的某些区域内持续徘徊（Ng,\
    \ 2013）。\n\n## ADAM 优化简介\n\nADAM 方法通过根据之前观察到的小批量（mini-batch）梯度近似目标函数的二阶信息，以自适应的方式对每个单独的模型参数的学习梯度进行调整。算法运动的“自适应移动”特性正是\
    \ ADAM 名称的来源（Kingma and Ba, 2014）。\n\nADAM 方法引入了两个新的超参数，`![](img/Image1030.png)`\
    \ 和 `![](img/Image1037.png)`，其中 `t` 代表迭代次数。还包含一个控制初始步长的学习率。可调的 beta 项用于近似用于缩放步长的信噪比。当近似的信噪比较大时，步长更接近于初始步长（即传统随机梯度下降的步长）。\n\
    \n当近似的信噪比较小时，步长接近于零。这是一个很好的特性，因为较低的信噪比意味着不确定性更高。因此，在参数空间中应该采取更谨慎的步骤（Kingma and\
    \ Ba 2014）。\n\n要使用 ADAM，请在 `OPTIMIZER` 参数的 `ALGORITHM=` 子选项中指定 `ADAM`。还需要指定 `β1`\
    \ 和 `β2` 的子选项，以及 `α` 等选项。在下方的示例代码中，`β1 = .9`，`β2 = .999` 且 `α = .001`。\n\n```\n\
    optimizer={algorithm={method=’ADAM’,\n```\n\n```\n                           \
    \        beta1=0.9,\n```\n\n```\n                                   beta2=0.999,\n\
    ```\n\n```\n                                   learningrate=.001,\n```\n\n```\n\
    \                                   lrpolicy=’Step’,\n```\n\n```\n           \
    \                        gamma=0.5},\n```\n\n```\n                           \
    \        minibatchsize=100,\n```\n\n```\n                                   maxepochs=200}\n\
    ```\n\n注意：ADAM 的作者推荐 `β1` 值为 `.9`，`β2` 值为 `.999`，`α`（学习率）为 `.001`。\n\n## 权重初始化\n\
    \n深度学习使用的权重初始化方法与传统的神经网络不同。在神经网络中，隐藏单元权重随机初始化，以确保每个隐藏单元都在近似输入与输出之间关系的不同区域。否则，如果隐藏单元之间的权重相同甚至对称，那么每个隐藏单元将近似相同的关系变化。隐藏单元权重通常被随机初始化为某些指定的分布，通常是高斯分布或均匀分布。\n\
    \n传统的神经网络对随机初始化的隐藏单元权重使用标准方差。当有大量输入信息（即大量的输入连接）时，这可能会出现问题，因为随着输入连接数量的增加，隐藏单元的方差可能会增加。这意味着组合函数的输出可能更加极端，导致隐藏单元饱和（Daniely\
    \ et al. 2017）。\n\n深度学习方法使用归一化初始化，其中隐藏权重的方差是输入信息和输出信息的函数。SAS 提供了几种减少隐藏权重方差的方法。Xavier\
    \ 初始化（交叉初始化）是深度学习中最常用的权重初始化方法之一。该初始化方法是随机均匀分布，方差为\n\n![](img/Image1044.png)\n\n\
    其中 `m` 是输入连接数（入扇 fan-in），`n` 是输出连接数（出扇 fan-out）。\n\nXavier 初始化的一个潜在缺陷是该初始化方法假设了线性激活函数，这在隐藏单元中通常并非如此。MSRA\
    \ 是考虑到 ReLU 激活函数设计的，因为 MSRA 假设激活输出具有零均值（He et al. 2015）。MSRA 初始化方法是随机高斯分布，标准差为\n\
    \n![](img/Image1051.png)\n\nSAS 包含了 MSRA 的第二个变体，称为 MSRA2。与 MSRA 初始化类似，MSRA2 方法是随机高斯分布，标准差为\n\
    \n![](img/Image1059.png)\n\n并且对输出（出扇 fan-out）信息进行惩罚。\n\n注意：如果使用了批量归一化，权重初始化对模型性能的影响较小，因为批量归一化标准化了隐藏层之间传递的信息。批量归一化将在本章后半部分讨论。\n\
    \n"
