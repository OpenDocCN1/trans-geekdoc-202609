  trans: "\n\n- `CANNY_EDGE`: 使用 Canny 边缘检测算法检测输入图像中的边缘。此函数接受三个参数：`lowThreshold`、`highThreshold`\
    \ 和 `kernelSize`。\n\n- `LAPLACIAN`: 对输入图像应用拉普拉斯算子。拉普拉斯算子是 `n` 维欧几里得空间中的二阶微分算子。当\
    \ `kernelSize` 参数的值为 1 时，结果通过内核与输入图像的卷积来近似。\n- 否则，该值通过累加 `x` 和 `y` 的二阶导数来近似，这些导数是通过\
    \ `Sobel` 算子计算的。\n- `SOBEL`: 使用 `Sobel` 算子计算一阶、二阶、三阶或混合图像导数。导数通过图像与卷积卷积计算。内核必须是正方形。尺寸只能是以下数字之一：1、3、5\
    \ 和 7。当内核大小为 1 时，使用一个 `kernel` 计算 `x` 的一阶或二阶导数，使用另一个 `kernel` 计算 `y` 的一阶或二阶导数。对于其他内核尺寸，`Sobel`\
    \ 算子会将高斯平滑和微分结合（处理噪声）。\n- `NORMALIZE`: 归一化图像的值范围。你可以在 `type` 参数中指定以下归一化函数：`INF`、`L1`、`L2`、`L2SQR`、`HAMMING`、`HAMMING2`、`RELATIVE`\
    \ 和 `MINMAX`。`MINMAX` 函数通常用于将图像归一化在 `alpha` 和 `beta` 值之间。\n- `THRESHOLD`: 对图像中的每个像素应用阈值。你可以指定以下阈值类型：`BINARY`、`BINARY_INVERSE`、`TRUNCATE`、`TO_ZERO`、`TO_ZERO_INVERSE`、`OTSU`\
    \ 和 `TRIANGLE`。\n- `CONVERT_COLOR`: 转换图像的色彩空间。目前可用的转换为 `COLOR2GRAY`、`GRAY2COLOR`、`BGR2RGB`\
    \ 和 `RGB2BGR`。图像的默认色彩空间为 `BGR`。`COLOR2GRAY` 意味着 `BGR2GRAY`。\n- `RESCALEALE`: 更改图像的深度。你可以指定以下类型的重缩放：\n\
    \    - `TO_8U`：深度改为 8 位，其中像素由无符号整数表示。\n    - `TO_32F`：深度改为 32 位，其中像素由浮点数表示。\n\
    \    - `TO_64F`：深度改为 64 位，其中像素由双精度数字表示。\n    你可以根据 `alpha` 和 `beta` 参数对值进行缩放。\n\
    - `MORPHOLOGY`: 对图像进行形态学变换。你可以指定以下变换类型：`ERODE`、`DILATE`、`OPEN`、`CLOSE`、`GRADIENT`、`TOPHAT`、`BLACKHAT`\
    \ 和 `HITMISS`。这些操作中的每一个都可以采用 `RECT`（矩形）、`CROSS`（交叉）和 `ELLIPSE`（椭圆）形状。\n- `BOX_FILTER`:\
    \ 使用归一化均值滤波器模糊图像。`kernelWidth` 和 `kernelHeight` 参数决定了滤波器的形状。假设锚点位于内核中心。\n- `GAUSSIAN_FILTER`:\
    \ 使用高斯滤波器模糊图像。根据 `kernelWidth` 和 `kernelHeight` 参数创建卷积内核，这些参数必须为正数且奇数。\n- `BILATERAL_FILTER`:\
    \ 使用高斯滤波器模糊图像。根据 `kernelWidth` 和 `kernelHeight` 参数创建卷积内核，这些参数必须为正数且奇数。\n- `MEDIAN_FILTER`:\
    \ 使用中值滤波器模糊图像。根据 `kernelWidth` 和 `kernelHeight` 参数创建卷积内核，这些参数必须为正数且奇数。\n- `BUILD_PYRAMID`:\
    \ 创建图像金字塔。你可以使用 `PYRAMID_DOWN` 或 `PYRAMID_UP` 方法。\n- `CONTOURS`: 图像中的轮廓。\n- `CUSTOM_FILTER`:\
    \ 创建自定义滤波器。\n- `ADD_CONSTANT`: 为图像增加或减去常数值。\n- `HIST_EQUALIZATION`: 旨在拉伸强度范围。支持两种版本：全局和自适应。\n\
    - `LINEAR_TRANSFORMATION`: 根据 `method` 以以下方式之一执行线性变换：\n    - `STANDARDIATION`：创建均值为零、方差为一的图像。\n\
    \    - `WHITENING_PCA`：使用主成分分析创建协方差矩阵为单位的图像。\n    - `WHITENING_ZCA`：使用 ZCA 变换（也称为马哈拉诺变换）创建协方差矩阵为单位的图像。\n\
    \    - `LOCAL_CONTRAST_NORM`：与 `STANDARDIATION` 相似，但局部的。\n- `MUTATIONS`: 使用不同的技术变变图像：垂直翻转、水平翻转、通过金字塔缩放、改变对比度（变暗或变亮）、锐化以及左右旋转。\n\
    \n"
