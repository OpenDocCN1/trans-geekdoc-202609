    \ columns. Pooling layers themselves do not contain parameters, but instead they\
    \ combine columns with an output summary. Adding convolution and pooling layers\
    \ also enhances the model’s ability to capture important points in input distributions,\
    \ increasing the model’s statistical efficiency. The details of convolution and\
    \ pooling layers are discussed throughout this chapter.\n\nConvolutional neural\
    \ networks have popularized image classification and object detection. However,\
    \ CNNs have also been applied to other areas such as natural language processing\
    \ and forecasting. Many of the successes in self-driving cars, fault detection,\
    \ chatbots, and other applications are in large part built on the foundation of\
    \ convolutional neural networks.\n\n## Input Layers\n\nConvolutional neural networks\
    \ (CNNs) are a class of artificial neural networks. Like regular neural networks,\
    \ a CNN begins with an input layer, consists of multiple layers, and contains\
    \ a number of neurons, as seen in Figure 2.1.\n\nFigure 2.1: Convolutional Neural\
    \ Network\n\n![](image/Image863.jpg)\n\nThe input layer might consist of the raw\
    \ pixel values of the image to be classified, while a grayscale image has only\
    \ a single channel as seen in Figure 2.2.\n\nFigure 2.2: Grayscale Image Channel\n\
    \n![](image/Image871.png)\n\nConversely, a color image has three color channels\
    \ of blue, green, and red as seen in Figure 2.3.\n\nFigure 2.3: Color Image Channels\n\
    \n![](image/Image880.png)\n\nFor example, each image in the CIFAR-10 data set\
    \ has a height of 32, width of 32, and three color channels of blue, green, and\
    \ red. Each color channel is represented by a matrix of values that indicate the\
    \ brightness of the pixel with regard to the respective channel. Pixel values\
    \ usually range from 0 to 255. Images are sometimes flattened before being passed\
    \ to the convolutional neural network. However, flattening is not required and\
    \ might even create problems when scoring with `ASTORE`. (`ASTORE` is a transportable\
    \ form of a model.) Nonetheless, each pixel becomes a value in a respective column\
    \ in a data set. For example, a standard color image has more than 33 pixels per\
    \ channel. After it is flattened, the resulting table will consist of more than\
    \ 99 million columns (~33 million \\* 3).\n\nCNNs in SAS can also contain input\
    \ layers for the consumption of tabular data. Therefore, multiple input layers\
    \ can be used. Quite often they are used when solving more dynamic problems.\n\
    \n## Convolutional Layers\n\nThe convolution layer is most commonly used after\
    \ the input layer. The convolution layer derives an output (that is, a feature\
    \ map) from filter kernels that are connected to local regions in the input (that\
    \ is, the incoming information). Each filter computes a dot product between their\
    \ weights and a small region where they are connected to the input volume. The\
    \ operation is formally known as a cross-correlation but might sometimes be referred\
    \ to as a convolution without kernel flipping. An example of single-channel convolution\
    \ without kernel flipping is displayed below in Figure 2.4.\n\nFigure 2.4: Single-channel\
    \ Convolution Without Kernel Flipping\n\n![](image/Image888.png)\n\nA typical\
    \ convolution layer can consist of many filters. The filters slide across the\
    \ input surface in parallel, capturing meaningful characteristics. Therefore,\
    \ the parameters in each filter are shared by multiple columns in the data. Parameter\
    \ sharing decreases the number of parameters needed to translate the input space.\
    \ Each filter creates equivariant representations of the input, which means that\
    \ changes in the input space are represented in the output.\n\nAdding a convolution\
    \ layer introduces new hyperparameters to the neural network. These hyperparameters\
    \ include width, height, and stride. Here is an example of a convolution layer\
    \ with 32 filters created in the SAS Cloud Analytic Services language (CASL):\n\
    \n```\nAddLayer   /    model=’ConVNet’ \n          name=’ConVLayer1’ \n      \
    \    layer={type=’CONVO’\n                 nFilters=32\n                 width=3\
    \ \n                 height=3 \n                 stride=1\n                } \n\
    \          srcLayers={‘data’};\n```\n\n## Using Filters\n"
  trans: "\n\n```\n           algorithm=   {method=’ADAM’,\n                     \
    \     lrpolicy=’Step’,\n                          gamma=0.5,\n               \
    \           stepsize=10,\n                       beta1=0.9,\n                \
    \                beta2=0.999,\n                learningrate=.001}  \n        \
    \      regL1=0.003, \n             regL2=0.002, \n        maxepochs=50  \n   \
    \         }\nseed=54321\n;\nrun;\n```\n\n4. 运行程序并检查结果。\n\n5. 在结果窗口中向下滚动到模型信息详情表。\n\
    \n由于添加了批归一化（batch normalization），模型参数的总数增加了，因为我们增加了一个带有可学习参数的操作。\n\n图 1.16: 模型信息详情\n\
    \n![](img/Image1374.png)\n\n优化历史表显示，内存成本是值得的，因为模型改进了验证误分类率，将该率进一步降低至约 25.9%（在第\
    \ 15 次 `pepoch` 中观察到）。\n\n# 第 2 章：卷积神经网络\n\n- 卷积神经网络介绍\n- 输入层\n- 卷积层\n- 使用过滤器\n\
    - 填充\n- 特征图维度\n- 池化层\n- 传统层\n- 全连接层\n- 输出层\n- 跳跃层连接类型\n- 演示 1：加载和准备图像数据\n- 演示\
    \ 2：构建和训练卷积神经网络\n- 检查图像数据并指定模型\n- 拟合和评估模型\n- 使用拟合模型评分\n\n## 卷积神经网络介绍\n\n卷积神经网络（CNN）是一种被认为在计算和统计上都是高效的神经网络（Goodfellow,\
    \ Bengio, and Courville 2017）。CNN 通过在图像分类、目标检测和语义分割方面的许多成功普及了计算机视觉领域。CNN 还可以用于自然语言处理或其他信息具有空间相关性的任务。典型的\
    \ CNN 由五类层组成：输入层、卷积层、池化层、全连接层和输出层。然而，在更复杂的结构中通常还会包含其他类型的层，包括转置卷积、感兴趣区域池化（ROI pooling）、分割等。每种层都有其特定的属性和功能。\n\
    \n计算效率通过使用卷积层和池化层来实现。全连接层中的神经元为每个输入列分配一个唯一的参数。相反，卷积层所需的参数比全连接层少，因为参数在列之间是共享的。池化层本身不包含参数，而是将列组合为输出摘要。添加卷积和池化层还增强了模型捕捉输入分布中重要点的能力，提高了模型的统计效率。本章将贯穿卷积层和池化层的细节。\n\
    \n卷积神经网络普及了图像分类和目标检测。然而，CNN 也应用于自然语言处理和预测等其他领域。自动驾驶汽车、故障检测、聊天机器人和其他应用中的许多成功在很大程度上建立在卷积神经网络的基础之上。\n\
    \n## 输入层\n\n卷积神经网络（CNN）是人工神经网络的一类。与普通神经网络一样，CNN 从输入层开始，由多层组成，并包含数量的神经元，如图 2.1\
    \ 所示。\n\n图 2.1: 卷积神经网络\n\n![](img/Image863.jpg)\n\n输入层可能由待分类图像的原始像素值，而如图 2.2 所示，灰度图像只有一个通道。\n\
    \n图 2.2: 灰度图像通道\n\n![](img/Image871.png)\n\n相反，如图 2.3 所示，彩色图像有蓝、绿、红三个颜色通道。\n\n\
    图 2.3: 彩色图像通道\n\n![](img/Image880.png)\n\n例如，CIFAR-10 数据集中每张图像的高度为 32，宽度为 32，并有蓝、绿、红三个颜色通道。每个颜色通道由一个表示相应通道像素亮度的数值矩阵表示。像素值通常在\
    \ 0 到 255 之间。在传递给卷积神经网络之前，有时会对图像进行平坦化（flattened）。然而，平坦化并不是必须的，在使用 `ASTORE` 评分时可能会产生问题（`ASTORE`\
    \ 是模型的迁移形式）。尽管如此，每个像素变成了数据集中相应列中的一个值。例如，标准彩色图像每个通道有 33 万个像素。平坦化后，生成的表将包含 9900\
    \ 万列。\n\nSAS 中的 CNN 还可以包含用于处理表格数据的输入层。因此，可以使用多个输入层。在解决更动态的问题时，经常会使用这些层。\n\n##\
    \ 卷积层\n\n卷积层最常用在输入层之后。卷积层通过连接到输入局部区域的过滤器内核（filter kernels）推导出输出（即特征图）。该操作正式名称为互相关（cross-correlation），但有时被称为无内核翻转的卷积。单通道无内核翻转卷积的示例在图\
    \ 2.4 所示。\n\n图 2.4: 无内核翻转的单通道卷积\n\n![](img/Image888.png)\n\n典型的卷积层由许多过滤器组成。过滤器并行在输入表面滑动，捕捉有意义的特征。因此，每个过滤器的参数被数据的多个列共享。参数共享减少了转换输入空间所需的参数数量。每个过滤器创建输入的等变表示，这意味着输入空间的变化反映输出中。\n\
    \n添加卷积层为神经网络引入了新的超参数。这些超参数包括宽度、高度和步长。以下是使用 SAS 云分析语言（CASL）创建的具有 32 个滤波器的卷积层示例：\n\
    \n```\nAddLayer   /    model=’ConVNet’ \n          name=’ConVLayer1’ \n      \
    \    layer={type=’CONVO’\n                 nFilters=32\n                 width=3\
    \ \n                 height=3 \n                 stride=1\n                } \n\
    \          srcLayers={‘data’};\n```\n\n## 使用过滤器\n\n"
