    然而，在使用多个 GPU 时，小批次（mini-batch）中的观测值分布在各个 GPU 上。为每个批归一化层同步每个 GPU 的批归一化计算将非常低效。相反，每个
    GPU 使用可用观测值的子集计算所需的统计数据，并使用这些统计数据对这些观测值进行变换。


    研究社区仍在讨论小批次或大批次大小哪个产生更好的性能。然而，当观测值的小批次分布在多个 GPU 上，且模型包含批归一化层时，SAS 深度学习团队建议您在每个
    GPU 上使用足够大的小批次，以确保统计数据是稳定的。


    除了在每个小批次上计算特征图统计数据外，批归一化算法在保存训练权重之前还需要计算整个训练数据集的统计数据。这些统计数据被用于评分（而小批次统计数据用于训练）。与其在训练结束时额外执行一个
    epoch（迭代），不如在最后一个训练 epoch 期间对每个小批次的统计数据取平均值，以创建 epoch 数据。


    通过这种方式计算的统计数据与更复杂的计算方法非常接近，即在 epoch 的每个小批次之后使用固定权重额外执行一个 epoch（只要最后一个 epoch 中的权重没有发生很大变化）（这通常是最后一个训练
    epoch 的情况）。在使用多个 GPU 时，此计算方法与使用单个 GPU 完全相同。也就是说，每个 GPU 上每个小批次的统计数据在每个小批次后取平均值，以计算用于评分的最终
    epoch 统计数据。


    ### 传统神经网络与深度学习


    传统神经网络与深度学习之间的区别如 1.2 所示。传统神经网络利用单个中央处理器（CPU）的计算来训练模型。然而，图形处理器（GPU）的设计天然地适合神经网络的结构和学习过程。在将
    CPU 分组使用方面已取得了前景的进展，它们使用定点架构而非浮点架构（Vanhoucke et al. 2011）。计算分布的细节是一个非常复杂的话题，超出了本书的范围，尽管表
    1.2 提供了 CPU 与 GPU 的简要对比。


    #### 表 1.2：中央处理器与图形处理器的比较


    | 中央处理器 (CPU) | 图形处理器 (GPU) |

    | --- | --- |

    | 更快的时钟频率 | 较慢的时钟频率 |

    | 较少的处理单元 | 更多的处理单元 |

    | 更多的分支逻辑 | 较少的分支逻辑 |

    | 较小的内存带宽 | 更大的内存带宽 |


    用于调整神经网络权重的优化技术是迭代过程。然而，在每次迭代中，权重是同时更新的。因此，对应于权重更新的计算可以分布在处理单元之间。GPU 设计用于执行并行操作，这与神经网络使用的权重更新过程完美契合。


    GPU 的使用应保留给较大的神经网络，因为在参数较少的神经网络中，CPU 和 GPU 之间的性能差异微乎其微。


    ### 深度学习操作


    作为 SAS 平台的集成部分，SAS Viya 是一种云启的内存分析引擎，可提供快速、准确且可靠的分析洞察。SAS Viya 提供了丰富的数据挖掘和机器学习能力，运行在健壮的内存分布式计算基础之上，该基础提供了一个统一、开放、强大且云就绪的环境。


    SAS Cloud Analytic Services（CAS）操作可以通过 SAS Viya 的多个接口呈现，包括 SAS Studio 和 Jupyter
    notebook。


    本书重点介绍了 SAS Cloud Analytic Services (CAS) 中的三种深度学习操作：


    * 深度前馈神经网络 (DNN)

    * 卷积神经网络 (CNN)

    * 循环神经网络 (RNN)


    `DNN` 操作用于解决更传统的分类问题，如欺诈检测。`CNN` 操作通常用于计算机视觉。`RNN` 操作用于序列数据。


    （注：原文包含大量重复句子，已清理冗余并保持了专业流畅度。）

