- raw: 'Predictive modeling is a classic example where information extracted from
    historical or current data is used to predict an outcome associated with data
    not yet observed. Predictive models assume the feature distributions remain the
    same from training to scoring.


    Transfer learning is an area of machine learning that leverages information extracted
    from one set of distributions for use in another different set of distributions
    as seen in Figure 3.24.


    Figure 3.24: Dissimilar Distributions


    ![](image/Image3239.png)


    That is, transfer learning refers to a situation where information extracted from
    one setting (often referred to as the source) is exploited in another setting
    (often referred to as the target) to improve the learner’s performance. Meaning
    the feature space of the extracted information is different from the feature space
    associated with the desired learner (model). Transfer learning refers to a situation
    where information extracted from one setting is exploited in another setting with
    the goal of improving the learner’s performance. More formally, either the source
    (s) and target (t) domains do not match (Ds ≠ Dt) or the source and target task
    do not match (Ts ≠ Tt) (Weiss, Khoshgoftaar, and Wang 2016).


    Domains and Subdomains


    A domain is an environment or setting that is described by a set of features.
    (See Figure 3.25.) Domains are antecedents to subdomains, where the structure
    of domains and subdomains describe a hierarchical relationship of related information.
    Domains, and by extensions subdomains, are defined by a feature space (X) and
    a marginal probability distribution (P (X)). For example, English, Chinese, and
    Icelandic translations are each subdomains of a natural language processing domain
    (Weiss, Khoshgoftaar, and Wang 2016).


    Figure 3.25: Example of Domains and Subdomains


    ![](image/Image3246.jpg)


    Note: Usually, the nearest subdomain is considered as the “domain” for practical
    purposes when considering whether the source and target domains are equivalent.
    That is, when answering the question is XS=XT and P(XS)=P(XT)?


    Tasks


    Domains consider only the input variables, whereas the task, on the other hand,
    considers the outcome. Tasks are defined by an output space (Y) and a conditional
    probability distribution (P(Y|X)). For example, Figure 3.26 shows that predicting
    a classification outcome, such as the


    breed of a dog based on an image of the dog, is a task within the computer vision
    domain (Weiss, Khoshgoftaar, and Wang 2016).


    Figure 3.26: Domain versus Task


    ![](image/Image3255.jpg)


    Therefore, we can formally define transfer learning as, “given a source domain
    Ds with a corresponding task Ts and a target domain Ts with a corresponding task
    Tt, transfer learning is the process of improving the target function ft(x)![](image/Image3262.png)by
    using the related information from Ds and Dt, where Ds≠Dt or Ts≠Tt” (Weiss, Khoshgoftaar,
    and Wang 2016).


    Types of Transfer Learning


    There are two types of transfer learning: homogeneous (where Xs\=Xt) and heterogeneous
    (where Xs≠Xt). An example of homogeneous transfer learning is shown in Figure
    3.27 below, where each column represents a pixel density value.


    Figure 3.27: Homogeneous Transfer Learning


    ![](image/Image3270.jpg)


    Note: P(Xs) does not have to equal P(Xt) in homogenous transfer learning.


    Heterogenous Transfer Learning and Domain Adaptation


    As mentioned above, heterogenous transfer learning refers to cases where Xs≠Xt.
    An example of heterogeneous transfer learning is shown in Figure 3.28.


    Figure 3.28: Heterogeneous Transfer Learning with Tabular and Image Data


    ![](image/Image3277.jpg)


    Domain adaption is closely related to heterogeneous transfer learning. It is characterized
    by methods that alter the source domain (Xs and/or P(Xs)) to better fit the target
    domain in situations where the source and target task are the same Ts\=Tt, but
    the domains are different Ds≠Dt. For example, consider a task of text generation,
    which consists of generating text based on a set of criteria. An example of criteria
    could be the demeanor (happy, sad, angry, and so on) of the generated text. The
    domains are different when generating text for a Chinese conversation, as compared
    to an English conversation. Both tasks are the same, but the vocabulary, style,
    linearity, and systematicity of the languages differ. Domain adaption would alter
    (or adapt) the source domain to match the target domain. Glorot et al. (2011)
    demonstrated stacked denoising autoencoders could be used for domain adaption.


    Note: There are many inconsistencies in literature with regard to the formal definition
    of domain adaption. This book’s definition of domain adaptation is consistent
    with both Goodfellow et al. 2016, and Weiss et al. 2016.


    Transfer Learning Biases


    Transfer learning can be difficult because by invention, there exists a difference
    in the information being transferred from one setting to another. These differences
    can give rise to biases and can cause the model to degrade to the point of negative
    transfer learning.


    Negative transfer learning occurs when the desired target function performs worse
    after having incorporated a transfer learning strategy relative to the target
    function with no exposure to transfer learning. Bias is the primary cause of negative
    transfer learning. The two most common types of transfer learning biases are frequency
    bias and context bias.


    Frequency Bias


    Frequency bias occurs when features are not independent of the domain, and the
    transfer learning strategy is being deployed across different domains. For example,
    consider the task of sentiment analysis across two domains, a hospital domain,
    and a business domain. Words such as “people,” “help,” and “work,” are independent
    of the domains and are likely to occur at similar rates. However, words such as
    “heart,” “patient,” and “medication” are likely to occur more frequently in the
    hospital domain, and words like “profit,” “customer,” and “sales” would be more
    frequent in the business domain. Therefore,![](image/Image3285.png), meaning the
    marginal probability distribution of the features does not match.


    Context bias occurs when the underlying relationship between the features and
    the output changes from source data to target data. Consider our earlier example
    of the hospital and business domains. The word “positive” used in a business domain
    would likely have positive sentiment. However, that same word used in a hospital
    domain might have negative sentiment.


    For example, “the test results came back positive,” where the word “positive”
    is in reference to the presence of a disease. Therefore, context bias refers to
    instances where![](image/Image3294.png), meaning that the conditional probability
    distributions are different from the source data to the target data.


    Transfer Learning Strategies


    There are many methods that are used for transfer learning. Two of the most general
    forms are supervised and unsupervised pretraining. This chapter focuses on specific
    examples of supervised and unsupervised pretraining that can be used to capture
    and leverage information that exist across domains. Transfer learning is also
    known as representational learning.


    Supervised Pretraining


    One method for supervised pretraining incorporates first training a model on the
    source data. The model weights are then transferred and frozen for use by the
    target data. It is common to leave some weights unfrozen to allow for reconciliation
    between the weights learned on the source data, and differences in the target
    data. In neural network modeling, the layers with the unfrozen weights are referred
    to as the “adaptable layers.” The output layer is left unfrozen, permitting the
    generation of new posteriors that reflect the target data.'
