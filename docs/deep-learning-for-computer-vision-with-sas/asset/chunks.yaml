    ## Contents


    ### About This Book

    Deep learning is an area of machine learning that has become ubiquitous. This
    book introduces the basics of deep learning with SAS.


    ### What This Book Covers

    SAS has a rich set of deep learning capabilities. This book covers:

    - Deep learning

    - Computer vision

    - Sentiment analysis

    - Object detection

    - Time series

    - Classifications

    - Neural networks


