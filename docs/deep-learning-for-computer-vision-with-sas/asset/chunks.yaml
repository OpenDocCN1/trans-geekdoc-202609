    in performance between the two models is marginal. See Figure 3.11 and Table 3.4.


    Figure 3.11: ResNet versus ResNext, 10,000 observations for 1500 Epochs with 10%
    Dropout Rate in First Convolution Layer


    ![](image/Image3093.jpg)


    Table 3.4: ResNet versus ResNext, 10,000 observations for 1500 Epochs with 10%
    Dropout Rate in First Convolution Layer


    | Validation Misc | ResNet | ResNext |

    | --- | --- | --- |

    | 10k obs, 60 epochs | 44.2 | 48.55 |

    | 10k obs, 1500 epochs | 43.1 | 44.1 |

    | 10k obs, 1500 epochs, 10% dropout added | 41.75 | 41.95 |

