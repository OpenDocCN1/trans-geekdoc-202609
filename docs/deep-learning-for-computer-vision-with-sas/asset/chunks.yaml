  trans: '


    你也可以使用 1 x 1 卷积来扩展维度深度，它们有时被用来代替全连接层以节省计算成本，如图 3.3 所示。


    图 3.3：使用 1 x 1 卷积扩展维度深度


    ![](img/Image2965.png)


    ## 空间探索


    过滤器提取空间相关的信息，并将这些信息转换到输出特征图中。空间探索技术（如使用不同尺寸的过滤器）使模型能够捕捉不同粒度的细节，从而对过滤器所在的区域提供更完整的理解。在不同尺度上捕获的信息可以在随后的层中组合，以形成对信息更详细的解释。


    此外，增加步长（stride）会影响每个滤波器的探索方案，并缩小输出特征图的大小。较大的步长值会缩小输出特征图的宽度和高度。


    ## 创建块（Blocks）


    GoogLeNet 将 1 x 1 过滤器与空间探索相结合了块（Szegedy 等人 2014）。块是特征提取的一个阶段，通常由多个卷积层组成，这些层通常被堆叠，然后通过“分割-转换-合并”策略与拼接层或残差层相结合。（见图
    3.4。）


    图 3.4：一个块


    ![](img/Image2973.jpg)


    块与隐藏层不同，因为块可以包含多个隐藏层，这些隐藏层结合时会产生更相关的输出。有时块内部会使用池化层，GoogLeNet 就是如此。块通常像隐藏层一样被堆叠。


    ResNet 引入了残差层，作为将之前学习的信息与当前特征状态相结合的方法，以构建一个能够有效支持增加深度的模型（He 等人 2015）。ResNet 在所谓的残差块中利用了残差层。


    图 3.5：ResNet 类型残差块


    ![](img/Image2980.jpg)


    残差块始于一个应用于输入信息的卷积层。第一个卷积的输出在进入下一个卷积层之前通过一个非线性激活函数。使用批归一化（Batch normalization）来防止梯度爆炸，并在涉及另一个非线性激活之前对信息进行归一化。残差块以跳层残差连接（skip-layer
    residual connection）结束，它将原始信息与新学习的特征相结合。残差块缓解了与网络深度增加相关的梯度消失/爆炸问题。


    基数（Cardinality）是指块内变换集合的数量。基数首次在 2017 年的 ResNeXt 模型中引入，作为深度探索的替代方案以获得更高的准确率（Saining
    等人 2017）。其训练成本可能很高，但如果使用了跳层，则建议使用残差连接以降低训练成本。


    图 3.6：基数


    ![](img/Image2989.jpg)


    每个变换集由一条独立的信息轨迹组成，它们共同训练而非独立训练。例如，下面的图 3.7 显示了块内的五个变换集。


    图 3.7：块内的变换集


    ![](img/Image2998.png)


    ResNeXt 表明基数可以作为深度探索的替代方案。具体来说，ResNeXt 的作者证明了与具有相似参数量的 ResNet 相比，其分类错误率更。ResNeXt
    中使用的每个变换集始于 1 x 1 卷积以减少维度深度，随后是用于特征提取的 3 x 3 卷积。最后，在残差层总结并合并所有变换集之前，使用 1 x 1 卷积来扩展维度深度。


    图 3.8：带有平均池化的 ResNet 类型


    ![](img/Image3005.jpg)


    有趣的是，作者观察到基数的行为非常类似于一种结构正则性。这意味着对于一个似乎过拟合训练数据的模型，基数将是一个非常有用的补充。


    ## 比较结构深度与基数


    考虑以下案例研究，它检查了 ResNet 类型模型和 ResNeXt 类型模型在 CIFAR-10 数据上的性能。具体而言，检查了基数与网络深度的影响。表
    3.1 突出了 ResNet 类型和 ResNext 类型模型之间的一些差异。


    表 3.1：ResNet 与 ResNext 架构


    | 特性 | ResNet 类型 | ResNext 类型 |

    | --- | --- | --- |

    | 块数量 | 10 | 3 |

    | 基数 | 1 | 6 |

    | 跳层连接 | 残差 | 残差 |

    | 参数数量 | 803,230 | 349,842 |


    实验中检查的 ResNet 类型和 ResNeXt 类型模型在起始和结束模型结构上几乎完全相同。ResNet 起于一个包含 12 个滤波器的卷积层，随后是一个
    2 x 2 最大池化层，并以 3 x 3 平均池化层结束，随后是一个带有 660 个神经元的全连接层。ResNeXt 起于一个包含 8 个滤波器的卷积层，随后是一个
    2 x 2 最大池化层，并以 3 x 3 平均池化层结束，随后是一个带有 660 个神经元的全连接层。


    两种架构之间的主要区别在于起始和结束层之间使用的块数量和基数。ResNet 类型模型使用 10 个具有单一独立路径的块，这意味着基数为 1。ResNeXt
    类型是一个浅得多的模型，仅使用三个具有六条分离轨迹的块，这意味着基数为 6。


    基数具有额外的意外计算成本。因此，尽管模型参数上存在差异，但 ResNeXt 类型模型的训练时间比 ResNet 类型模型稍长，尽管参数更少。


    首先，两个模型都在 10000 个观测值上训练了 60 个轮次（epochs）。ResNet 表现更好，分类错误率为 44.2%，而 ResNeXt 为 48.5%。有趣的是，ResNeXt
    的方差比 ResNet 小。见图 3.9 和表 3.2。


    图 3.9：ResNet 与 ResNext，10000 个观测值，60 个轮次


    ![](img/Image3049.jpg)


    表 3.2：ResNet 与 ResNext，10000 个观测值，60 个轮次


    | 验证分类 | ResNet | ResNext |

    | --- | --- | --- |

    | 60 轮次 | 44.2 | 48.55 |


    然后轮次从 60 增加到 1500，两个模型都重新训练了。两个性能都得到了提高，之间的差异缩小了，尽管 ResNet 模型仍然优于 ResNeXt 模型。考虑到数据只有
    10000 个观测值，训练 1500 个轮次似乎有些极端。见图 3.10 和表 3.3。


    图 3.10：ResNet 与 ResNext，10000 个观测值，1500 个轮次


    ![](img/Image3071.jpg)


    表 3.3：ResNet 与 ResNext，10000 个观测值，1500 个轮次


    | 验证分类 | ResNet | ResNext |

    | --- | --- | --- |

    | 60 轮次 | 44.2 | 48.55 |

    | 1500 轮次 | 43.1 | 44.1 |


    两个模型的第一个卷积层都添加了 10% 的丢弃率，并重新训练了模型。两个模型都得到了进一步提高，模型之间的性能差异微乎其微。见图 3.11 和表 3.4。


    图 3.11：ResNet 与 ResNext，10000 个观测值，1500 个轮次，第一个卷积层添加 10% 丢弃率


    ![](img/Image3093.jpg)


    表 3.4：ResNet 与 ResNext，10000 个观测值，1500 个轮次，第一个卷积层添加 10% 丢弃率


    | 验证分类 | ResNet | ResNext |

    | --- | --- | --- |

    | 60 轮次 | 44.2 | 48.55 |

    | 1500 轮次 | 43.1 | 44.1 |

    | 1500 轮次，添加 10% 丢弃率 | 41.75 | 41.95 |


    '
