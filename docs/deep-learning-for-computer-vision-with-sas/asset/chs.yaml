- "# SAS 计算机视觉深度学习\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## \n\n## 关于本书\n深度学习是一个无处不在的机器学习领域。本书介绍了使用\
  \ SAS 进行深度学习的基础知识。\n\n### 本书内容\nSAS 拥有丰富的深度学习功能。本书涵盖了：\n- 深度学习\n- 计算机视觉\n- 情感分析\n\
  - 目标检测\n- 时间序列\n- 分类\n- 神经网络\n\n### 书中使用的软件\nSAS 软件可能提供某些第三方软件，包括但不限于开源软件，其受相应的第三方软件许可协议约束。有关\
  \ SAS 软件的第三方软件信息，请参考 `support.sas.com/thirdparty`。\n\n### 示例与代码\n本书包含以下工具的实战示例：\n\
  - SAS Viya\n- SAS Studio\n- `GitHub`\n\n### 我们想听听您的声音\n欢迎对 SAS Press 的书籍提供反馈。您可以：\n\
  - 注册评论\n- 推荐主题\n- 请求书籍信息\n- 对书籍提供反馈\n\n### 关于本书的问题\n如果您对本书有疑问，请通过 `saspress@sas.com`\
  \ 联系作者或访问 `support.sas.com/feedback`。\n\n### 关于作者\n\nRobert Blanchard 是 SAS 的高级数据科学家，负责构建端到端人工智能应用程序。他还从事深度学习领域的研究、咨询和教学。在加入\
  \ SAS 之前，Robert 在北卡来纳州立大学的教务长下工作，构建了与学生成功、教师发展和资源管理的模型。在北卡来纳州立大学工作期间，Robert 还创立了一家专注于房屋销售预测的私人分析公司。在进入学术界之前，Robert\
  \ 曾在 Travelers 保险的劳动力优化团队研发小组工作。Robert 毕业于康涅狄格大学，获得商业分析与项目管理硕士学位，并获得东卡罗来纳大学应用经济学硕士学位。\n\
  \n\n## 神经网络简介\n### 生物神经元\n### 数学神经元\n### 深度学习\n#### 批量梯度下降\n### 随机梯度下降\n## ADAM\
  \ 优化简介\n### 初始化\n## 正则化\n### 批量归一化\n### 小批量批量归一化\n### 传统神经网络与深度学习\n### 深度学习动作\n\
  ### 构建深度神经网络\n### 训练深度学习 CAS 模型\n\n\n\n\n\n\n\n## 神经网络引论\n\n人工神经网络模拟了大脑的关键特征，特别是大脑从经验中学习的能力。为了理解人工神经网络，我们首先必须理解生物神经网络的一些关键概念，换句话说，就是我们自己的生物学大脑。\n\
  \n生物大脑具有许多在人工系统中非常理想的特征，例如能够学习或轻松适应新环境的能力。例如，想象你到达一个你从未访问过的国家的城市。你不了解那里的文化或语言。只要时间足够，你就会学会当地文化并熟悉当地语言。你将知道街道、餐厅和博物馆的位置。\n\
  \n大脑具有高度的并行性，因此速度非常快。它并不等同于一个处理器，而是等同于数以百万计的、所有并行运行的处理器。生物大脑还能处理模糊、概率性、噪声或不一致的信息，同时保持稳健性、容错性且较小的体积。尽管很大程度上受到认知科学（特别是神经生理学）的启发，但神经网络的方法主要源于统计物理学（Hertz\
  \ et al. 1991）。神经网络算法有几十种甚至数百种。\n\n### 生物神经元\n\n为了在人工系统中模仿神经元，首先需要理解它们的机制。虽然仍有许多需要学习，但神经元的关键功能层面，甚至是神经元的小系统（网络），已经已知。\n\
  \n神经元是认知的基本单元，负责将信息从大脑传递到身体的其他部分。神经元由三个部分组成：细胞体、树突和轴突。输入到达树突（短分支结构），并通过轴突（长细纤维）传输到链中的下一个神经元。神经元之间实际上并不相互接触，而是通过神经递质跨越间隙（称为突触间隙）进行通信。这些化学物质要么激发接收神经元，使其更容易“放电”，要么抑制神经元，使其激活的可能性降低。跨越间隙释放的神经递质数量决定了每个树突与接收神经元连接的相对强度。本质上，每个突触都会对其到达输入的相对强度进行“加权”。加权后的输入求和。如果总和超过一个可调节的阈值（或偏置）值，神经元就会沿着其轴突向网络中连接的其他神经元发送脉冲。\n\
  \n现代神经生理学的一个关键发现是，突触连接是适应性的；它们会随着经验而改变。突触越活跃，连接就越强。相反，活动很少或没有活动的突触会逐渐消失，并最终死亡（萎缩）。这被认为是学习的基础。例如，威斯康星大学\
  \ 2015 年的一的一项研究显示，人们可以用舌头“看”。电网上连接着一个固定在受试者额头上的摄像头。受试者被蒙住了眼睛。然而，在 30 分钟内，随着他们神经元的适应性，受试者开始用舌头“看”。太惊奇了！\n\
  \n尽管有一些神经网络研究分支试图详细地模拟底层的生物过程，但大多数神经网络并没有试图追求生物学上的真实性。\n\n### 数学神经元\n\n在一篇标题为相当低调的“神经活动中蕴含思想的逻辑演算”的开创性论文中，McCulloch\
  \ 和 Pitts (1943) 诞生了人工神经网络领域。McCulloch-Pitts 网络的基本元素，不所当然地被称为 McCulloch-Pitts 神经元。正如真实神经元一样，每个输入\
  \ (`xi`) 首先被加权 (`wi`)，然后进行求和。为了模拟神经元的阈值功能，在加权和上加上一个偏置值 (`w0`)，使得神经元倾向于产生正或负输出值。其结果是已知的。\n\
  \n现代神经生理学的一个关键发现是，突触连接是适应性的；它们会随着经验而改变。突触越活跃，连接就越强。相反，活动很少或没有活动的突触会逐渐消失，并最终死亡（萎缩）。这被认为是学习的基础。例如，威斯康星大学\
  \ 2015 年的一项研究显示，人们可以用舌头“看”。电网上连接着一个固定在受试者额头上的摄像头。受试者被蒙住了眼睛。然而，在 30 分钟内，随着他们神经元的适应性，受试者开始用舌头“看”。太惊奇了！\n\
  \n \n\n在一篇标题为相当低调的“神经活动中蕴含思想的逻辑演算”的开创性论文中，McCulloch 和 Pitts (1943) 诞生了人工神经网络领域。McCulloch-Pitts\
  \ 网络的基本元素，不所当然地被称为 McCulloch-Pitts 神经元。正如真实神经元一样，每个输入 (`xi`) 首先被加权 (`wi`)，然后进行求和。为了模拟神经元的阈值功能，在加权和上加上一个偏置值\
  \ (`w0`)，使得神经元倾向于产生正或负输出值。其结果是已知的。\n\n\n注意，这是经典的回归方程，其中偏置项是截距，与每个输入的关联是斜率。\n\n原始\
  \ McCulloch-Pitts 神经元的最终输出通过将其网络输入通过一个阶跃函数来决定（0 或 1）。\n\n感知元（MLP）具有三层：\n\n1. 包含每个输入的输入层。输入层没有可调参数（权重）。它们只是将正或负输入传递到下一层。\n\
  2. 隐藏层（数学神经元），对加权和输入进行非线性变换。\n3. 结合隐藏层值的输出层。\n\n现代神经元将不连续的阶跃函数替换为连续函数。\n\n\n连续性允许使用导数。基础感知元（MLP）神经网络有三层：\n\
  \n1. 包含每个输入的输入层。输入层没有可调参数（权重）。它们只是将正或负输入传递到下一层。\n2. 隐藏层（数学神经元），对加权和输入进行非线性变换。\n\
  3. 结合隐藏层值的输出层。\n\n单隐藏层感知元构建了一个由小值包围的大值“凸起”（Principe et al. 2000）。例如，由三个单元组成的隐藏层的交叉形成了一个三角形。\n\
  \n隐藏层和输出层不能通过严格线性函数连接以作为独立的层。否则，多层网络将塌变为线性感知元。更正式地说，如果矩阵 `A`是将输入 `X` 转换为隐藏层输出的权重集，矩阵\
  \ `B`是将隐藏单元输出转换为最终估计 `Y` 的权重集，那么线性连接的多层网络可以表示 `Y=B[A(X)]`。然而，如果创建一个单层权重矩阵 `C=BA`，则可以从单层网络获得相同的输出——即\
  \ `Y=C(X)`。\n\n在一个具有 `k` 个输入、第一隐藏层有 `h1` 个隐藏单元、第二隐藏层有 `h2` 个隐藏单元的二层感知元中，要学习的参数数量为：(image/HiddenEq..jpg)。\n\
  \n数字 1 代表每个神经元组合函数中的偏置权重 `W0`。\n\n\n\n注意：书中的“参数数量”方程假设输入是等距或比例的。每个分类或序数输入都会使 `k`\
  \ 增加变量的类别数减 1。\n\n深度学习\n\n深度学习一词指的是神经网络中使用的许多隐藏层。然而，深度学习的真正精髓是能够从多个隐藏层的神经网络中提取更多信息的方法。如果没有支持高效提取信息的深度学习方法，在神经网络中添加更多隐藏层的益处甚微。例如，SAS\
  \ 软件几十年来一直能够使用 `NEURAL` 过程构建具有许多隐藏层的神经网络。然而，有一种理由认为 SAS 一直没有深度学习，因为在存在许多隐藏层的情况下，能够保持学习持续的关键要素尚未被发现。这些要素包括使用以下内容：\n\
  \n\n\n\n\n* 比传统激活函数更具抗饱和性的激活函数\n* 快速基于梯度的优化算法，如 `Stochastic Gradient Descent`（随机梯度下降）和\
  \ `ADAM`\n* 考虑输入信息量的权重初始化\n* 新的正则化技术，如 `dropout` 和 `batch normalization`（批量归一化）\n\
  * 分布式计算的创新\n\n上述元素包含在今天的 SAS 软件中，并在下方进行了描述。无需赘言，深度学习在解决以前被认为无法解决的问题方面展现了令人印象目的前景。\n\
  \n深度学习的过程是通过对输入空间进行工程化的新观察来制定结果，然后用下一个隐藏层对这些工程化后的投影进行重新工程。此过程对每个隐藏层重复，直到到达输出层。输出层协调传入的隐藏单元单元层信息，以产生一组输出。这一过程的经典示例是人脸识别。第一个隐藏层捕捉图像的阴调。下一个隐藏层将这些阴调组合以形成边缘。下一个隐藏层将这些边缘组合，创建出耳朵、嘴巴、鼻子以及定义人脸的其他不同特征的投影。下一层结合这些不同的特征方案，创建出更完整的人脸投影。以此类推。传统神经网络与深度学习的简要比较见表\
  \ 1.1。\n\n### 表 1.1：传统神经网络与深度学习\n\n| 维度 | 传统 | 深度学习 |\n| --- | --- | --- |\n| 隐藏激活函数\
  \ | 双曲正切 (`tanh`) | 修正线性单元 (`ReLU`) 及其他变体 |\n| 基于梯度的学习 | `Batch GD` 和 `BFGS` | `Stochastic\
  \ GD`、`Adam` 和 `LBFGS` |\n| 权重初始化 | 常数方差 | 归一化方差 |\n| 正则化 | 早停、`L1` 和 `L2` | 早停、`L1`、`L2`、`Dropout`\
  \ 和 `Batch Normalization` |\n| 处理器 | CPU | CPU 或 GPU |\n\n### 激活函数与梯度\n\n深度学习包含了比传统激活函数更抗神经元饱和的激活函数。传统神经网络的经典特征之一是在隐藏单元中使用臭名昭著的\
  \ sigmoid 变换。sigmoid 变换对于基于梯度的学习是有问题的，因为 sigmoid 有两个可以饱和的渐近区域（即输出的梯度接近于零）。红色或更深阴影的外围区域代表饱和区域。见图\
  \ 1.2。\n\n![](img/Image938.jpg)\n\n另一方面，恒等变换等线性变换对基于梯度的学习几乎没有问题，因为梯度是一个常数。然而，使用线性变换抵消了非线性变换带来的优势（即近似非线性关系）。\n\
  \n修正线性变换（或 `ReLU`）由分段线性变换组成，这些变换组合在一起可以近似非线性函数。（见图 1.3。）\n\n#### 图 1.3：修正线性函数\n\n\
  在 `ReLU` 的情况下，变换输出的活跃区域的导数为 1，不活跃区域为 0。`ReLU` 变换的不活跃区域可以被视为该变换的弱点，因为它抑制了单元对基于梯度的学习的贡献。\n\
  \n`ReLU` 的饱和可以通过巧妙初始化权重以避免负输出值在某种程度上缓解。例如，考虑建模图像数据的业务场景。每个未标准化的输入像素值范围在 0 到 255\
  \ 之间。在这种情况下，可以将权重初始化并限制为严格正，以避免负输出值，从而避免 `ReLU` 的非活跃输出区域。\n\n其他修正线性变换的变体也允许当组合函数解析为负值时继续进行学习。其中最著名的是指数线性激活变换\
  \ (`ELU`)，如图 1.4 所示。\n\n#### 图 1.4：指数线性函数\n\nSAS 研究人员观察到某些情况下卷积神经网络中使用 `ELU` 代替\
  \ `ReLU` 性能更好。SAS 还包含了此处未显示的其他流行激活函数，如 `softplus` 和 `leaky`。此外，您可以使用 SAS 函数编译器（或\
  \ `FCMP`）在 SAS 中创建自己的激活函数。\n\n> **注意：** 卷积神经网络 (`CNNs`) 是一种人工神经网络。`CNNs` 广泛用于图像识别和分类。与普通神经网络一样，`CNN`\
  \ 由多个层和许多神经元组成。`CNNs` 非常适用于图像数据，但也可以用于自然语言处理等其他问题。第 2 章将详细介绍 `CNNs`。\n\n### 误差函数与优化\n\
  \n误差函数定义了参数空间中的一个表面。如果它是通过最小二乘法拟合的线性模型，则误差表面是凸的，具有唯一的最小值。然而，在非线性模型中，该误差表面通常是一个复杂的地形，由许多山谷、陡峭的悬崖和长高原组成。为了在该地形高效搜索误差最小值，必须使用优化。具体而言，与给定误差最小值相关的参数通过以下程序确定：\n\
  \n1. 初始化权重向量为小的随机值，`w(0)`。\n2. 使用优化方法确定更新向量，`δ(t)`。\n3. 将更新向量添加到上一次迭代的权重值以生成新估计：\n\
  ```\n(equation)\n```\n4. 如果没有达到收敛标准，返回第 2 步。\n\n收敛的条件如下：\n\n1. 指定的误差函数停止改进\n2. 梯度没有斜率（意味着已达到最小值）\n\
  3. 参数幅度停止变化\n\n#### 批量梯度下降\n\n反向传播 (`backprop`) 经过多次重新，最初仅使用梯度下降来确定合适的权重。梯度 ![](img/972.png)\
  \ 是误差函数对权的偏导向量。它指向向上最陡的方向。（见图 1.5。）\n\n\n通过否定步长（即学习率）参数 `η`，向局部向下的方向迈出一步：\n```\n\
  (equation)\n```\n\n与给定误差最小值相关的参数通过以下程序确定：\n\n1. 初始化权重向量为小的随机值，`w(0)`。\n2. 使用优化方法确定更新向量，`δ(t)`。\n\
  3. 将更新向量添加到上一次迭代的权重值以生成新估计：\n```\n(equation)\n```\n4. 如果没有达到收敛标准，返回第 2 步。\n\n随机梯度下降\n\
  \n\n\n\n\n在梯度下降算法的批量变体中，权重更新向量的生成是通过使用训练集中所有的样本来决定的。也就是说，计算的是精确梯度，确保了能够平滑地向误差最小值移动。\n\
  \n然而，当训练数据集很大时，计算精确梯度的计算开销非常大。在沿梯度下降的每一步中，必须评估整个训练数据集。此外，如果数据是冗余的，数据后半部分的误差梯度与前半部分的梯度几乎相同。在这种情况下，计算整个数据集的梯度将浪费时间。较好的做法是计算权重子集的梯度，更新权重，然后在新的子集上重复此过程。在这种种情况下，每次权重更新都是基于对真实梯度的近似。但只要它指向与精确梯度大致相同的方向，近似梯度就是一种计算精确梯度的有效备用替代方案（Hinton\
  \ 2007）。\n\n推向极端，近似梯度的计算可以基于单个训练样本。然后更新权重，并在下一个样本上计算梯度。这被称为**随机梯度下降**（stochastic\
  \ gradient descent，也称为在线学习）。（见图 1.6。）\n\n\n\n随机梯度下降非常有效，特别是当与动量项 `δ(t-1)` 结合时：\n\
  \n\n由于随机梯度下降在计算每个下降步的梯度时不需要考虑整个训练数据集，它通常比批量梯度下降更快。然而，由于每次迭代都试图更好地拟合单个观测值，某些梯度实际上可能会远离最小值。这意味着，尽管随机梯度下降通常向误差最小值的方向移动参数，但每次迭代并不一定这样做。结果是产生了一条更加迂折的路径。事实上，随机梯度下降并不会以批量梯度下降相同的方式收敛。相反，它在靠近最小值的某些区域内持续徘徊（Ng,\
  \ 2013）。\n\n## ADAM 优化简介\n\nADAM 方法通过根据之前观察到的小批量（mini-batch）梯度近似目标函数的二阶信息，以自适应的方式对每个单独的模型参数的学习梯度进行调整。算法运动的“自适应移动”特性正是\
  \ ADAM 名称的来源（Kingma and Ba, 2014）。\n\n\n当近似的信噪比较小时，步长接近于零。这是一个很好的特性，因为较低的信噪比意味着不确定性更高。因此，在参数空间中应该采取更谨慎的步骤（Kingma\
  \ and Ba 2014）。\n\n要使用 ADAM，请在 `OPTIMIZER` 参数的 `ALGORITHM=` 子选项中指定 `ADAM`。还需要指定\
  \ `β1` 和 `β2` 的子选项，以及 `α` 等选项。在下方的示例代码中，`β1 = .9`，`β2 = .999` 且 `α = .001`。\n\n\
  ```\noptimizer={algorithm={method=’ADAM’,\n```\n\n```\n                        \
  \           beta1=0.9,\n```\n\n```\n                                   beta2=0.999,\n\
  ```\n\n```\n                                   learningrate=.001,\n```\n\n```\n\
  \                                   lrpolicy=’Step’,\n```\n\n```\n             \
  \                      gamma=0.5},\n```\n\n```\n                               \
  \    minibatchsize=100,\n```\n\n```\n                                   maxepochs=200}\n\
  ```\n\n注意：ADAM 的作者推荐 `β1` 值为 `.9`，`β2` 值为 `.999`，`α`（学习率）为 `.001`。\n\n## 权重初始化\n\
  \n深度学习使用的权重初始化方法与传统的神经网络不同。在神经网络中，隐藏单元权重随机初始化，以确保每个隐藏单元都在近似输入与输出之间关系的不同区域。否则，如果隐藏单元之间的权重相同甚至对称，那么每个隐藏单元将近似相同的关系变化。隐藏单元权重通常被随机初始化为某些指定的分布，通常是高斯分布或均匀分布。\n\
  \n传统的神经网络对随机初始化的隐藏单元权重使用标准方差。当有大量输入信息（即大量的输入连接）时，这可能会出现问题，因为随着输入连接数量的增加，隐藏单元的方差可能会增加。这意味着组合函数的输出可能更加极端，导致隐藏单元饱和（Daniely\
  \ et al. 2017）。\n\n深度学习方法使用归一化初始化，其中隐藏权重的方差是输入信息和输出信息的函数。SAS 提供了几种减少隐藏权重方差的方法。Xavier\
  \ 初始化（交叉初始化）是深度学习中最常用的权重初始化方法之一。该初始化方法是随机均匀分布，方差为\n\n\n其中 `m` 是输入连接数（入扇 fan-in），`n`\
  \ 是输出连接数（出扇 fan-out）。\n\nXavier 初始化的一个潜在缺陷是该初始化方法假设了线性激活函数，这在隐藏单元中通常并非如此。MSRA 是考虑到\
  \ ReLU 激活函数设计的，因为 MSRA 假设激活输出具有零均值（He et al. 2015）。MSRA 初始化方法是随机高斯分布，标准差为\n\n\n\
  SAS 包含了 MSRA 的第二个变体，称为 MSRA2。与 MSRA 初始化类似，MSRA2 方法是随机高斯分布，标准差为\n\n\n并且对输出（出扇 fan-out）信息进行惩罚。\n\
  \n注意：如果使用了批量归一化，权重初始化对模型性能的影响较小，因为批量归一化标准化了隐藏层之间传递的信息。批量归一化将在本章后半部分讨论。\n\n\n\n\n\
  \n## 正则化\n\n正则化是一个引入或移除信息以稳定算法对数据理解的过程。多年来，早停（early stopping）、`L1` 和 `L2` 等正则化技术在神经网络中被广泛应用。这些正则化方法在深度学习中仍然被广泛使用。然而，正则化领域已经取得了进展，这些进展在与多隐藏层神经网络结合时效果特别好。其中两种进展\
  \ `dropout` 和 `batch normalization`（批归一化）在深度学习模型中展现了巨大的潜力。让我们先讨论 `dropout`，然后检查\
  \ `batch normalization`。\n\n`Dropout` 在学习过程中添加噪声，使得模型更具泛化能力。训练一个每个包含数十万个参数的深度神经网络集成模型可能是不可行的。如图\
  \ 1.9 所示，`dropout` 在学习过程中添加噪声，使得模型更具泛化能力。\n\n图 1.9：正则化技术\n\n\n`dropout` 的目标是通过一个扰动学习的过程来近似许多可能的模型结构的集成，试图防止权重产生协同适应。例如，假设我们正在训练一个识别人脸的神经网络，模型中使用的一个隐藏单元充分捕捉了嘴部。此时，所有其他隐藏单元至少在某些程度上依赖于这个隐藏单元，通过嘴部的存在来帮助识别脸。移除捕捉嘴部的隐藏单元会迫使剩余隐藏单元进行调整和补偿。这个过程使每个隐藏单元更多地成为“通才”而非“专家”，因为每个隐藏单元必须减少对模型中其他隐藏单元的依赖。\n\
  \n在 `dropout` 过程中，隐藏单元或输入（或两者）会在权重更新期间被随机从训练中移除。从模型中移除隐藏单元只需将该单元的输出乘以零。被移除的单元权重并没有丢失，而是被冻结了。每次移除单元时，生成的网络被称为稀疏网络。在几次权重更新后，所有隐藏和输入单元都会返回网络。之后，再次随机选择并移除一个新的隐藏或输入单元（或两者）进行几次权重更新。重复此过程直到达到最大训练迭代或优化过程收敛。\n\
  \n在 SAS Viya 中，你可以在 `ADDLAYER` 语句中指定 `DROPOUT=` 来实现 `dropout`。`DROPOUT=ratio` 指定该层的丢弃率。\n\
  \n以下是在 `ADDLAYER` 语句中实现 `dropout` 的示例。\n\n```\nAddLayer/model=’DLNN’ name=”HLayer1”\
  \ layer={type=’FULLCONNECT’ n=30\n         act=’ELU’ init=’xavier’ dropout=.05}\
  \ srcLayers={“data”};\n```\n\n注意：`ADDLAYER` 语法将在稍后描述并在全书中进一步扩展。\n\n## 批归一化\n\n`batch\
  \ normalization`（Ioffe and Szegedy, 2015）操作通过对每份输入数据进行标准化计算，归一化每个批次中在隐藏层之间传递的信息。标准化计算减去数据的平均值，然后除以标准差。随后通过将数据乘以一个学习常数的值并加上另一个学习常数的值来后续计算。\n\
  \n因此，归一化公式为\n\n\n其中 `gamma`![](img/Image1117.png) 和 `beta`![](img/Image1125.png)\
  \ 是可学习参数。\n\n一些深度学习实践者放弃了在隐藏单元中使用 sigmoid 激活函数。然而，随着 `batch normalization` 的发现，他们的放弃可能为时过早。如果没有\
  \ `batch normalization`，当神经网络中存在多个隐藏层时，每个隐藏层本质上都在从不断变化的信息中学习。也就是说，权重更新依赖于二阶、三阶（依此类推）效应（其他层的权重）。这种现象被称为内部协方偏移（`ICS`）。\n\
  \n关于为什么 `batch normalization` 能改进学习，有两种观点。第一种来自 Ioffe 和 Szegedy，他们认为 `batch normalization`\
  \ 减少了 `ICS`。第二种来自 Santurkar, Ilyas 和 Madry，他们认为 `batch normalization` 并没有真正减少 `ICS`，而是平滑了误差平面。无论哪种观点占优，`batch\
  \ normalization` 在经验上证明可以改进学习。在 SAS 深度学习操作中，`batch normalization` 作为一个单独层，可以放在输入后的任何位置。注意：对于卷积网络，`batch\
  \ normalization` 通常插入在卷积层之后。\n\n#### 小批次的批归一化\n\n在 `batch normalization` 层的源层包含特征图的情况下，`batch\
  \ normalization` 层根据每个小批次中所有观测值的每个特征图的所有像素来计算统计数据。例如，假设你的网络配置的小批次大小为 3，输入包含两个 5x5\
  \ 的特征图。在这种情况下，批归一化层计算两个平均值和两个标准差。第一个平均值是第一个观测的第一个特征图、第二个观测的第一个特征图以及第三个观测的第一个特征图中所有像素的平均值。第二个平均值是第一个观测的第二个特征图、第二个观测的第二个特征图以及第三个观测的第二个特征图中所有像素的平均值，依此类推。数值上，每个平均值是\
  \ 3 个值的平均值。\n\n在 `batch normalization` 层的源层不包含特征图的情况下（例如全连接层），`batch normalization`\
  \ 层为输入中的每个神经元计算统计数据，而不是每个特征图。例如，假设你的网络小批次大小为 3，批归一化层的输入包含 50 个神经元。在这种情况下，批归一化层将计算\
  \ 50 个平均值和 50 个标准差。第一个平均值是第一个观测的第一个神经元、第二个观测的第一个神经元以及第三个观测的第一个神经元的平均值。第二个平均值是第一个观测的第二个神经元、第二个观测的第二个神经元以及第三个观测的第二个神经元的平均值，依此类推。数值上，每个平均值是三个值的平均值。NVIDIA\
  \ 根据激活模式对此计算此类计算。\n\n为了使批归一化计算符合 Sergey Ioffe 和 Christian Szegedy 的批归一化研究（Ioffe\
  \ and Szegedy, 2015）中的描述，源层应设置 `ACT=IDENTITY` 和 `INCLUDEBIAS=FALSE`。通常应在源层中指定的激活函数，现在应指定在批归一化层上。\n\
  \n\n\n\n然而，在使用多个 GPU 时，小批次（mini-batch）中的观测值分布在各个 GPU 上。为每个批归一化层同步每个 GPU 的批归一化计算将非常低效。相反，每个\
  \ GPU 使用可用观测值的子集计算所需的统计数据，并使用这些统计数据对这些观测值进行变换。\n\n研究社区仍在讨论小批次或大批次大小哪个产生更好的性能。然而，当观测值的小批次分布在多个\
  \ GPU 上，且模型包含批归一化层时，SAS 深度学习团队建议您在每个 GPU 上使用足够大的小批次，以确保统计数据是稳定的。\n\n除了在每个小批次上计算特征图统计数据外，批归一化算法在保存训练权重之前还需要计算整个训练数据集的统计数据。这些统计数据被用于评分（而小批次统计数据用于训练）。与其在训练结束时额外执行一个\
  \ epoch（迭代），不如在最后一个训练 epoch 期间对每个小批次的统计数据取平均值，以创建 epoch 数据。\n\n通过这种方式计算的统计数据与更复杂的计算方法非常接近，即在\
  \ epoch 的每个小批次之后使用固定权重额外执行一个 epoch（只要最后一个 epoch 中的权重没有发生很大变化）（这通常是最后一个训练 epoch 的情况）。在使用多个\
  \ GPU 时，此计算方法与使用单个 GPU 完全相同。也就是说，每个 GPU 上每个小批次的统计数据在每个小批次后取平均值，以计算用于评分的最终 epoch\
  \ 统计数据。\n\n### 传统神经网络与深度学习\n\n传统神经网络与深度学习之间的区别如 1.2 所示。传统神经网络利用单个中央处理器（CPU）的计算来训练模型。然而，图形处理器（GPU）的设计天然地适合神经网络的结构和学习过程。在将\
  \ CPU 分组使用方面已取得了前景的进展，它们使用定点架构而非浮点架构（Vanhoucke et al. 2011）。计算分布的细节是一个非常复杂的话题，超出了本书的范围，尽管表\
  \ 1.2 提供了 CPU 与 GPU 的简要对比。\n\n\n| 中央处理器 (CPU) | 图形处理器 (GPU) |\n| --- | --- |\n|\
  \ 更快的时钟频率 | 较慢的时钟频率 |\n| 较少的处理单元 | 更多的处理单元 |\n| 更多的分支逻辑 | 较少的分支逻辑 |\n| 较小的内存带宽 |\
  \ 更大的内存带宽 |\n\n用于调整神经网络权重的优化技术是迭代过程。然而，在每次迭代中，权重是同时更新的。因此，对应于权重更新的计算可以分布在处理单元之间。GPU\
  \ 设计用于执行并行操作，这与神经网络使用的权重更新过程完美契合。\n\nGPU 的使用应保留给较大的神经网络，因为在参数较少的神经网络中，CPU 和 GPU\
  \ 之间的性能差异微乎其微。\n\n### 深度学习操作\n\n作为 SAS 平台的集成部分，SAS Viya 是一种云启的内存分析引擎，可提供快速、准确且可靠的分析洞察。SAS\
  \ Viya 提供了丰富的数据挖掘和机器学习能力，运行在健壮的内存分布式计算基础之上，该基础提供了一个统一、开放、强大且云就绪的环境。\n\nSAS Cloud\
  \ Analytic Services（CAS）操作可以通过 SAS Viya 的多个接口呈现，包括 SAS Studio 和 Jupyter notebook。\n\
  \n本书重点介绍了 SAS Cloud Analytic Services (CAS) 中的三种深度学习操作：\n\n* 深度前馈神经网络 (DNN)\n* 卷积神经网络\
  \ (CNN)\n* 循环神经网络 (RNN)\n\n`DNN` 操作用于解决更传统的分类问题，如欺诈检测。`CNN` 操作通常用于计算机视觉。`RNN` 操作用于序列数据。\n\
  \n（注：原文包含大量重复句子，已清理冗余并保持了专业流畅度。）\n\n\n\n\n\n\n| RECURRENT | 循环层 | `layer={type=’recurrent’\
  \ n=50 act=’sigmoid’ rnnType=’gru’}` |\n| TRANSCONVO | 转置卷积层 | `layer={type=’transconvon’\
  \ Filters=32 width=5 height=5 stride=2 act=’tanh’ }` |\n\n注意：书中未描述许多其他层，包括：`DETECTION`、`PROJECTION`、`FCMP`、`CLOSS`、`NASLAYER`、`SPLIT`、`CHANNELSHUFFLE`、`CLUSTER`、`FASTRCNN`、`GROUPCONVO`、`LAYERNORM`、`MASKRCNN`、`MHATTENTION`、`REGIONPROPOSAL`、`ROIALIGN`、`ROIPOOLING`、`SCALE`、以及等。`DETECTION`\
  \ 层用于目标检测，`FCMP` 层用于实现用户定义的激活函数和误差函数。`CLUSTER` 层用于 `DeepCluster` 并应连接到全连接层。其他层在\
  \ SAS 文档中有详细说明。\n\n\n`dlTrain` 可用于训练深度学习模型。`dlTrain` 的参数可以在 SAS 文档中通过搜索“Deep Learning\
  \ Action Set: Syntax”找到。以下带有参数的示例代码：\n\n```\nPROC CAS;\n   dlTrain /\n      table=’\
  \ CAS-libref.data-table ‘\n      modeltable= ‘ model name, specified in buildmodel\
  \ action ‘\n      bestweights={name= ‘Name of output table containing best model\
  \ weights’ }\n      inputs={‘ List of ALL input variables ‘}\n      nominals={‘\
  \ List of nominal input variables ‘}\n      validtable={name= ‘ Name of validation\
  \ data table’ }\n      target={‘ list of target variables’};\nQuit;\n```\n\n注意：在训练模型时，可以使用\
  \ `OPTIMIZER` 参数来指定优化算法设置、优化模式以及其他设置（如种子、最大迭代次数等）。\n\n\n以下演示说明了如何使用传统的神经网络建模方法对数据进行建模。该神经网络将拥有七隐藏层，但无法充分区分数据中的目标事件和非事件。本演示使用了开发数据（develop\
  \ data）。这些数据已根据目标变量通过分层随机抽样分为三个数据集（训练集、验证集和测试集），描述如下。\n\n某银行开展了一项目标营销活动，旨在识别可能对变额养老（一种保险产品）营销活动做出反应的客户群体。每个数据集包含银行客户和描述每个客户的\
  \ 47 个输入。这 47 个输入变量代表三个月内的其他产品使用情况和人口统计数据。其中两个输入变量是名义标度的，其他是间隔或二分类的。二分类目标变量 `Ins`\
  \ 表示客户是否购买了变额养老产品。开发数据集中的变量列如下。\n\n| 变量 | 描述 | 角色 | 级别 |\n| --- | --- | --- | ---\
  \ |\n| ATM | 使用过 ATM 服务 (1=是，0=否) | 输入 | 二分类 |\n| ATMAmt | ATM 取款金额 | 输入 | 间隔型 |\n\
  | AcctAge | 最旧账户的年龄（年） | 输入 | 间隔型 |\n| Age | 客户年龄（年） | 输入 | 间隔型 |\n| Branch | 银行分支机构\
  \ (B1 – B19) | 拒绝 | 名义 |\n| CC | 有信用卡账户 (1=是，0=否) | 输入 | 二分类 |\n| CCBal | 信用卡余额\
  \ | 输入 | 间隔型 |\n| CCPurc | 信用卡购买次数 | 输入 | 间隔型 |\n| CD | 有定存 (1=是，0=否) | 输入 | 二分类\
  \ |\n| CDBal | 定存余额 | 输入 | 间隔型 |\n| CRScore | 信用评分 | 输入 | 间隔型 |\n| CashBk | 客户收到现金回扣次数\
  \ | 输入 | 间隔型 |\n| Checks | 支票数量 | 输入 | 间隔型 |\n| DDA | 支票账户 (1=是，0=否) | 输入 | 二分类\
  \ |\n| DDABal | 支票账户余额 | 输入 | 间隔型 |\n| Dep | 存款次数 | 输入 | 间隔型 |\n| DepAmt | 存款金额\
  \ | 输入 | 间隔型 |\n| DirDep | 直接转存款 | 输入 | 间隔型 |\n| HMOwn | 拥有房屋 | 输入 | 二分类 |\n| HMVal\
  \ | 房屋价值 | 输入 | 间隔型 |\n| ILS | 分期贷款 | 输入 | 二分类 |\n| IRABal | 退休账户 | 输入 | 间隔型 |\n\
  | InArea | 区域分类 | 输入 | 二分类 |\n| Inv | 投资账户 | 输入 | 二分类 |\n| LOC | 信用额度 | 输入 | 二分类\
  \ |\n| LOCBal | 信用额度余额 | 输入 | 间隔型 |\n| MMBal | 货币市场基金 | 输入 | 间隔型 |\n| MMCred | 货币贷\
  \ | 输入 | 间隔型 |\n| MTGBal | 贷款余额 | 输入 | 间隔型 |\n| NSF | 资金不足发生 | 输入 | 二分类 |\n| NSFAmt\
  \ | 资金不足金额 | 输入 | 间隔型 |\n| POS | 销售交易次数 | 输入 | 间隔型 |\n| POSAmt | 销售交易金额 | 输入 | 间隔型\
  \ |\n| Phone | 电话银行次数 | 输入 | 间隔型 |\n| Res | 区域分类 | 拒绝 | 名义 |\n| SDB | 安全箱 | 输入 |\
  \ 二分类 |\n| Sav | 储蓄账户 | 输入 | 二分类 |\n| Teller | 柜员服务次数 | 输入 | 间隔型 |\n\n\n1. 打开浏览器窗口，导航到\
  \ SAS Studio 并登录。\n2. 展开服务器文件和文件夹。\n3. 打开名为 `DLUS1D01a.sas` 的程序。程序将在编辑器中打开。首先，创建一个名为\
  \ `mycas` 的 caslib：\n```\nlibname mycas cas;\n```\n```\nlibname local ‘home/student/LWUS’;\n\
  ```\n然后，使用三个 DATA 步骤创建并在内存中保存数据集：\n```\ndata mycas.train_develop;\n   set local.train_develop;\n\
  run;\n\ndata mycas.valid_develop;\n   set local.valid_develop;\nrun;\n\ndata mycas.test_develop;\n\
  \   set local.test_develop;\nrun;\n```\n4. 运行程序。\n5. 打开名为 `DLUS1D01b.sas` 的程序。首先，使用\
  \ FREQ 过程探索开发数据验证部分的二分类结果分布：\nproc freq data=mycas.Valid_develop;\n   table ins;\n\
  run;\n```\n接下来，使用 NNET 过程创建一个七隐藏层前馈神经网络。使用有限内存 BFGS (L-BFGS) 算法调整网络参数：\nproc nnet\
  \ data=MYCAS.Train_DEVELOP standardize=std;\n   target Ins / level=nominal;\n  \
  \ input AcctAge DDABal CashBk \n         Checks NSFAmt Phone \n         Teller SavBal\
  \ ATMAmt \n         POS POSAmt CDBal \n         IRABal LOCBal ILSBal \n        \
  \ MMBal MMCred MTGBal;\n\n\n\n\n\n        CCBal CCPurc Income \n\n     LORes HMVal\
  \ Age \n\n        CRScore Dep DepAmt InvBal / level=interval;\n\n```\n   input DDA\
  \ DirDep NSF \n\n       Sav ATM CD \n\n       IRA LOC ILS \n\n       MM MTG CC \n\
  \n       SDB HMOwn Moved \n\n       InArea Inv / level=nominal;\n\n   hidden 30;\n\
  \n   hidden 20;\n\n   hidden 10;\n\n   hidden 5;\n\n   hidden 10;\n\n   hidden 20;\n\
  \n   hidden 30;\n\n   train outmodel=mycas._Nnet_model_ \n         validation=mycas.valid_develop\
  \ numtries=1 seed=12345 \n\n    optimization algorithm=LBFGS regL1=0.003 regL2=0.002\n\
  \                seed=12345 maxiter=50;\n\nrun;\n\n6. 运行程序并检查结果。\n\n`PROC FREQ`\
  \ 的结果显示，34.63% 的客户对营销活动做出了响应。\n\n\n\n接下来，显示了 `NNET` 过程的结果。结果从模型信息的摘要开始，随后是迭代历史（Iteration\
  \ History）表。\n\n**图 1.11：`NNET` 过程的结果\n\n\n\n看起来，最后几次迭代中的验证误差（误分类率）等同于数据中观察到的经验先验！这表明我们的模型表现并不优于“抛硬币”预测。\n\
  \n其余的结果确认了误分类率、读取的观测值数量以及神经网络使用的观测值数量。输出中的注释指出，由于在验证评估准则上没有改进，模型在第 10 次迭代时终止了学习过程。\n\
  \n\n\n\n本演示展示了如何构建和训练两个深度学习神经网络。这两个模型包含的隐藏层数和隐藏单元数将与上一个演示中创建的神经网络相同。然而，这两个新模型将应用深度学习技术。\n\
  \n本演示使用 CASL 代码来实现深度学习模型。使用 `PROC CAS` 来方便 CASL 代码的使用。\n\n1. 打开名为 `DLUS01D02a.sas`\
  \ 的程序，并在代码编辑器窗口检查程序内容。\n\n首先，加载 `DeepLearn` 动作集（action set）。该动作集包含了 SAS 深度学习的大部分功能，包括深度前馈\
  \ (`DNN`)、卷积 (`CNN`) 和循环 (`RNN`) 神经网络。\n\n注意：在使用 SAS 深度学习动作之前，必须加载 `DeepLearn`。该动作集只需要加载一次。\n\
  \nproc cas;\n   loadaction ‘DeepLearn’;\nrun;\n```\n\n接下来，创建一个空的深度学习模型。模型的引用名称为\
  \ `DLNN`，并指定了深度前馈模型类型。\n\nproc cas;\n   BuildModel / model={name=’DLNN’, replace=1}\
  \ type = “DNN”;\nrun;\n\n然后使用 `AddLayer` 动作向模型中添加九层，其中第一个是输入层，如 `TYPE='INPUT'` 选项所示。使用\
  \ `DROPOUT=` 选项对输入层应用丢弃（Dropout）。\n\nproc cas;\n   AddLayer / model=’DLNN’ name=’data’\
  \ layer={type=’input’ dropout=.05};\n\n添加七层全连接隐藏层。每个隐藏层在 `NAME=` 选项中都被赋予了一个唯一的名称。这些层中使用的激活函数都是修正线性\
  \ (`ReLU`) 激活函数，但第一个隐藏层除外。第一个隐藏层采用了指数线性 (`ELU`) 激活函数，因为当 `ReLU` 与输入层连接时容易饱和（与 Lewis\
  \ 通信，SAS 2017）。`MSRA` 初始化与 `ReLU` 激活函数结合，并包含了 5% 的丢弃率。除了中间隐藏层外，每个隐藏层都应用了丢弃。注意，`SRCLERS=`\
  \ 选项表示与输入连接相关的层。\n\nAddLayer / model=’DLNN’ name=’HLayer1’ layer={type=’FULLCONNECT’\
  \ n=30 act=’ELU’ init=’xavier’ dropout=.05} srcLayers={‘data’};\n\nAddLayer / model=’DLNN’\
  \ name=’HLayer2’ layer={type=’FULLCONNECT’ n=20 act=’ReLU’ init=’MSRA’ dropout=.05}\
  \ srcLayers={‘HLayer1’};\n\nAddLayer / model=’DLNN’ name=’HLayer3’ layer={type=’FULLCONNECT’\
  \ n=10 act=’ReLU’ init=’MSRA’ dropout=.05} srcLayers={‘HLayer2’};\n\nAddLayer /\
  \ model=’DLNN’ name=’HLayer4’ layer={type=’FULLCONNECT’ n=5 act=’ReLU’ init=’MSRA’}\
  \ srcLayers={‘HLayer3’};\n\nAddLayer / model=’DLNN’ name=’HLayer5’ layer={type=’FULLCONNECT’\
  \ n=10 act=’ReLU’ init=’MSRA’ dropout=.05} srcLayers={‘HLayer4’};\n\nAddLayer /\
  \ model=’DLNN’ name=’HLayer6’ layer={type=’FULLCONNECT’ n=20 act=’ReLU’ init=’MSRA’\
  \ dropout=.05} srcLayers={‘HLayer5’};\n\nAddLayer / model=’DLNN’ name=’HLayer7’\
  \ layer={type=’FULLCONNECT’ n=30 act=’ReLU’ init=’MSRA’ dropout=.05} srcLayers={‘HLayer6’};\n\
  \n最后，添加一个输出层。由于目标是二分类，因此使用了 `softmax` 激活函数。\n\nAddLayer / model=’DLNN’ name=”outlayer”\
  \ layer={type=’output’ act=’softmax’} srcLayers={“Layer7”};\nrun;\n\n图 1.13 是上述\
  \ CASL 代码构建的模型架构简图。\n\n图 1.13：模型架构\n\n\n现在模型已经构建完成。但我们还没有在数据上训练模型。使用 `dlTrain` 动作来训练模型。\n\
  \n`TABLE=` 选项填充加载到 CAS 中的数据集名称。在 `MODEL=` 选项中插入构建的模型名称。\n\n`BESTWEIGHTS=` 选项创建一个包含模型最佳权重的数据集。如果包含了验证数据，则根据模型在验证数据上的表现选择最佳权重。否则，使用训练数据。\n\
  \nproc cas;\n   dlTrain / table='Train_Develop’ model='DLNN’ \n             bestweights={name='bestdeepweights’,\
  \ replace=1}\n\n输入列表在 `INPUTS=` 选项中指定。\n\ninputs={‘AcctAge’,\n              ‘DDABal’,\n\
  \              ‘CashBk’,\n              ‘Checks’,\n              ‘NSFAmt’,\n   \
  \           ‘Phone’,\n              ‘Teller’,\n              ‘SavBal’,\n       \
  \       ‘ATMAmt’,\n              ‘POS’,\n              ‘POSAmt’,\n             \
  \ ‘CDBal’,\n              ‘IRABal’,\n              ‘LOCBal’,\n              ‘ILSBal’,\n\
  \              ‘MMBal’,\n              ‘MMCred’,\n              ‘MTGBal’,\n    \
  \          ‘CCBal’,\n              ‘CCPurc’,\n              ‘Income’,\n        \
  \      ‘LORes’,\n              ‘HMVal’,\n              ‘Age’}\n\n\n\n\n\n      \
  \        ‘Sav’,\n              ‘ATM’,\n              ‘CD’,\n              ‘IRA’,\n\
  \              ‘LOC’,\n              ‘ILS’,\n              ‘MM’,\n             \
  \ ‘MTG’,\n              ‘CC’,\n              ‘SDB’,\n              ‘HMOwn’,\n  \
  \            ‘Moved’,\n              ‘InArea’, \n              ‘Inv’\n         \
  \     }\n\n注意：名分类变量必须在 `INPUT=` 和 `NOMINAL=` 选项中均指定。此外，目标是二元的，因此必须在名分类列表中指定。\n\n\
  验证数据表名通过 `VALIDTABLE=` 选项指定，`INS` 目标包含在 `TARGET=` 选项中。\n\nValidTable=’Valid_Develop’\n\
  target=”INS”\n\n最后，包含了优化器选项。使用了 `ADAM` 方法，小批量大小为 60，学习率值为 `.001`。`LRPOLICY=` 选项指定了学习率策略——即在整个训练过程中降低学习率的策略。`STEP`\
  \ 策略根据 `STEPSIZE=` 选项指定的间隔周期性地将 `GAMMA=` 值乘以当前学习率。如果没有指定步长，则每 10 个 epoch 减少一次学习率。\n\
  \noptimizer=   {minibatchsize=60, \n         algorithm={method=’ADAM’,\n       \
  \                    lrpolicy=’Step’,\n                           gamma=0.5,\n \
  \                            stepsize=10,\n                             beta1=0.9,beta2=0.999,\n\
  \                             learningrate=.001}\n                             regL1=003,\
  \ \n                             regL2=002,  \n                             maxepochs=50\n\
  seed=12345\nrun;\n\n注意：`MINIBATCHSIZE=` 选项指定每个工作节点的批量大小。书中的示例是为了在使用 16 个 CPU 的机器上运行而编写的。因此，每个总批量实际上乘以\
  \ 16 CPUs。有时会形成长尾（后期迭代中使用的观测值较少），应尽可能减轻这种情况。包含优化属性的 `LOGLEVEL=3` 选项可以在日志中打印详细的优化信息。\n\
  \n运行程序并查看结果。第一组表格包含与模型外壳和模型中层相关的描述性信息。\n\n\n下一表包含模型信息。\n\n\n该模型包含 3,747 个参数和九层（七个隐藏层、一个输入和一个输出层）。优化历史表显示了学习率、训练损失（误差值）、验证损失、验证误差（误分类率）和训练误差。\n\
  \n\n传统方法无法区分数据中的事件。然而，深度学习方法的引入提高了模型的区分能力。误分类率从约 34.5% 下降到 26%。模型的最佳性能出现在第 28 个\
  \ epoch。也许模型可以通过批量归一化得到进一步改进。\n\n打开名为 `DL02b.sas` 的程序，并在代码编辑器中检查程序内容。下一个模型使用了与上一个模型相同的结构，但有两个例外。所有隐藏层（除第一个隐藏层外）都使用了批量归一化来代替\
  \ dropout，并且 `ReLU` 隐藏层激活函数被替换为双曲正切 (`tanh`) 激活函数。权重初始化也从 `MSRA` 更改为 `Xavier`。\n\
  \n注意：为了使批量归一化计算符合 [Sergey Ioffe 和 Christian Szegedy 的 Batch Normalization](https://arxiv.org/abs/1502.0316)\
  \ 中的描述，源层应具有 `ACT=identity` 和 `INCLUDEBIAS=False` 设置。通常在源层中指定的激活函数应改为在批量归一化层上指定。第一个隐藏层不使用批量归一化，因为输入层已经使用\
  \ z-score 标准化进行了归一化。\n\n注意：SAS 中的 DNN 类型架构不包含批量归一化层。然而，`CNN` 类型架构可以批量归一化，并将用于替代\
  \ `DNN`。\n\nproc cas;\n   BuildModel / modeltable={name=’BatchDLNN’, replace=1}\
  \ \n                type = ‘CNN’;\n\n   /*          输入层             */\n   AddLayer\
  \ / model=’BatchDLNN’ name=’data’ layer={type=’input’ \n              STD=’STD’\
  \ dropout=.05}; \n   /*          第一个隐藏层          */\n           layer={type=’FULLCONNECT’\
  \ n=30 act=’ELU’ init=’xavier’ \n           } srcLayers={‘data’};\n```\n\n注意，第一个隐藏层之后的每个隐藏层现在由两个\
  \ `AddLayer` 语句组成。第二个隐藏层中的第一个 `ADDLAYER` 语句指定了权重初始化方法和隐藏单元的数量。该层不使用偏置，激活函数设置为 identity。在第二个\
  \ `ADDLAYER` 语句中，`TYPE=` 选项被设置为 `BATCHNORM`。此外，注意非线性变换是在第二个 `ADDLAYER` 语句中应用的。\n\
  ```\n/*          第二个隐藏层       */\nAddLayer / model=’BatchDLNN’ name=’HLayer2’ layer={type=’FULLCONNECT’\
  \ n=20 act='identity’ init='xavier’ includeBias=False} srcLayers={‘HLayer1’};\n\
  AddLayer / model=’BatchDLNN’ name=’BatchLayer2’ layer={type=’BATCHNORM’ act=’TANH’}\
  \ srcLayers={‘HLayer2’};\n\n/*          第三个隐藏层          */\nAddLayer / model=’BatchDLNN’\
  \ name=’HLayer3’ layer={type=’FULLCONNECT’ n=10 act='identity’ init='xavier’ includeBias=False\
  \ } srcLayers={‘BatchLayer2’};  \nAddLayer / model=’BatchDLNN’ name=’BatchLayer3’\
  \ layer={type=’BATCHNORM’ act=’TANH’} srcLayers={‘HLayer3’};\n\n/*          第四个隐藏层\
  \       */\nAddLayer / model=’BatchDLNN’ name=’HLayer4’ layer={type=’FULLCONNECT’\
  \ n=5 act='identity’ init='xavier’ includeBias=False } srcLayers={‘BatchLayer3’};\
  \  \nAddLayer / model=’BatchDLNN’ name=’BatchLayer4’ layer={type=’BATCHNORM’ act=’TANH’}\
  \ srcLayers={‘HLayer4’};\n\n/*          第五个隐藏层          */\nAddLayer / model=’BatchDLNN’\
  \ name=’HLayer5’ layer={type=’FULLCONNECT’ n=10 act='identity’ init='xavier’ includeBias=False\
  \ } srcLayers={‘BatchLayer4’};  \n\n/*          第六个隐藏层          */\nAddLayer / model=’BatchDLNN’\
  \ name=’HLayer6’ layer={type=’FULLCONNECT’ n=20 act='identity’ init='xavier’ includeBias=False}\
  \ srcLayers={‘HLayer5’};\nAddLayer / model=’BatchDLNN’ name=”BatchLayer6” layer={type=’BATCHNORM’\
  \ act=’TANH’} srcLayers={‘HLayer6’};\n\n/*          第七个隐藏层       */\nAddLayer /\
  \ model=’BatchDLNN’ name=’HLayer7’ layer={type=’FULLCONNECT’ n=30 act='identity’\
  \ init='xavier’ includeBias=False } srcLayers={‘BatchLayer6’};     \nAddLayer /\
  \ model=’BatchDLNN’ name=”BatchLayer7” layer={type=’BATCHNORM’ act=’TANH’} srcLayers={‘HLayer7’};\n\
  \n/*          输出层             */\nAddLayer / model=’BatchDLNN’ name=’outlayer’ \n\
  layer={type=’output’ act=’LOGISTIC’} srcLayers={‘BatchLayer7’};\n\nrun;\n\n`dlTrain`\
  \ 代码与之前相同，但有一个例外。`MODEL=` 选项现在将操作指向上面创建的新模型结构 `BatchDLNN`。\n\nproc cas;\ndlTrain\
  \ / table=’Train_Develop’ model=’BatchDLNN’\n…\noptimizer=      {minibatchsize=60,\
  \ \n\n\n\n\n\n           algorithm=   {method=’ADAM’,\n                        \
  \  lrpolicy=’Step’,\n                          gamma=0.5,\n                    \
  \      stepsize=10,\n                       beta1=0.9,\n                       \
  \         beta2=0.999,\n                learningrate=.001}  \n              regL1=0.003,\
  \ \n             regL2=0.002, \n        maxepochs=50  \n            }\nseed=54321\n\
  ;\nrun;\n\n4. 运行程序并检查结果。\n\n5. 在结果窗口中向下滚动到模型信息详情表。\n\n由于添加了批归一化（batch normalization），模型参数的总数增加了，因为我们增加了一个带有可学习参数的操作。\n\
  \n\n\n优化历史表显示，内存成本是值得的，因为模型改进了验证误分类率，将该率进一步降低至约 25.9%（在第 15 次 `pepoch` 中观察到）。\n\n\
  \n- 卷积神经网络介绍\n- 输入层\n- 卷积层\n- 使用过滤器\n- 填充\n- 特征图维度\n- 池化层\n- 传统层\n- 全连接层\n- 输出层\n\
  - 跳跃层连接类型\n- 演示 1：加载和准备图像数据\n- 演示 2：构建和训练卷积神经网络\n- 检查图像数据并指定模型\n- 拟合和评估模型\n- 使用拟合模型评分\n\
  \n\n卷积神经网络（CNN）是一种被认为在计算和统计上都是高效的神经网络（Goodfellow, Bengio, and Courville 2017）。CNN\
  \ 通过在图像分类、目标检测和语义分割方面的许多成功普及了计算机视觉领域。CNN 还可以用于自然语言处理或其他信息具有空间相关性的任务。典型的 CNN 由五类层组成：输入层、卷积层、池化层、全连接层和输出层。然而，在更复杂的结构中通常还会包含其他类型的层，包括转置卷积、感兴趣区域池化（ROI\
  \ pooling）、分割等。每种层都有其特定的属性和功能。\n\n计算效率通过使用卷积层和池化层来实现。全连接层中的神经元为每个输入列分配一个唯一的参数。相反，卷积层所需的参数比全连接层少，因为参数在列之间是共享的。池化层本身不包含参数，而是将列组合为输出摘要。添加卷积和池化层还增强了模型捕捉输入分布中重要点的能力，提高了模型的统计效率。本章将贯穿卷积层和池化层的细节。\n\
  \n卷积神经网络普及了图像分类和目标检测。然而，CNN 也应用于自然语言处理和预测等其他领域。自动驾驶汽车、故障检测、聊天机器人和其他应用中的许多成功在很大程度上建立在卷积神经网络的基础之上。\n\
  \n\n卷积神经网络（CNN）是人工神经网络的一类。与普通神经网络一样，CNN 从输入层开始，由多层组成，并包含数量的神经元，如图 2.1 所示。\n\n图 2.1:\
  \ 卷积神经网络\n\n\n输入层可能由待分类图像的原始像素值，而如图 2.2 所示，灰度图像只有一个通道。\n\n图 2.2: 灰度图像通道\n\n![](img/Image871.png)\n\
  \n相反，如图 2.3 所示，彩色图像有蓝、绿、红三个颜色通道。\n\n图 2.3: 彩色图像通道\n\n![](img/Image880.png)\n\n例如，CIFAR-10\
  \ 数据集中每张图像的高度为 32，宽度为 32，并有蓝、绿、红三个颜色通道。每个颜色通道由一个表示相应通道像素亮度的数值矩阵表示。像素值通常在 0 到 255\
  \ 之间。在传递给卷积神经网络之前，有时会对图像进行平坦化（flattened）。然而，平坦化并不是必须的，在使用 `ASTORE` 评分时可能会产生问题（`ASTORE`\
  \ 是模型的迁移形式）。尽管如此，每个像素变成了数据集中相应列中的一个值。例如，标准彩色图像每个通道有 33 万个像素。平坦化后，生成的表将包含 9900 万列。\n\
  \nSAS 中的 CNN 还可以包含用于处理表格数据的输入层。因此，可以使用多个输入层。在解决更动态的问题时，经常会使用这些层。\n\n## 卷积层\n\n卷积层最常用在输入层之后。卷积层通过连接到输入局部区域的过滤器内核（filter\
  \ kernels）推导出输出（即特征图）。该操作正式名称为互相关（cross-correlation），但有时被称为无内核翻转的卷积。单通道无内核翻转卷积的示例在图\
  \ 2.4 所示。\n\n图 2.4: 无内核翻转的单通道卷积\n\n![](img/Image888.png)\n\n典型的卷积层由许多过滤器组成。过滤器并行在输入表面滑动，捕捉有意义的特征。因此，每个过滤器的参数被数据的多个列共享。参数共享减少了转换输入空间所需的参数数量。每个过滤器创建输入的等变表示，这意味着输入空间的变化反映输出中。\n\
  \n添加卷积层为神经网络引入了新的超参数。这些超参数包括宽度、高度和步长。以下是使用 SAS 云分析语言（CASL）创建的具有 32 个滤波器的卷积层示例：\n\
  \n```\nAddLayer   /    model=’ConVNet’ \n          name=’ConVLayer1’ \n        \
  \  layer={type=’CONVO’\n                 nFilters=32\n                 width=3 \n\
  \                 height=3 \n                 stride=1\n                } \n   \
  \       srcLayers={‘data’};\n```\n\n## 使用过滤器\n\n\n\n\n随着网络深度的增加，增加滤波器的数量是非常常见的。例如，第一层卷积层可能包含\
  \ 32 个滤波器，下一层卷积层有 64 个，下一层有 128 个，依此类推。增加卷积滤波器的数量是为了抵消在使用较大步长值（即步长大于 1 的值）时发生的信息减少。\n\
  \n接下来的图将详细介绍一个示例卷积层的细节。\n\n在卷积的前向传播过程中，如图 2.5 所示，滤波器被放置在输入空间的起始位置。\n\n图 2.5：滤波器的起始位置\n\
  \n![](img/Image895.jpg)\n\n如图 2.6 所示，计算滤波器条目与该位置输入之间的点积。对于此示例，我们用 `1*245 + 1*97\
  \ + 1*239 + 0*185 + 0*207 + 0*11 + -1*212 + -1*175 + -1*160` 加上我们的偏置 `10`，从而在特征图中得到\
  \ `44` 的输出。\n\n图 2.6：滤波器与输入条目之间的乘积\n\n![](img/Image903.jpg)\n\n因此，滤波器与局部输入空间之间的点积得到的值变为第一个输出值。然后，算法在输入空间滑动每个滤波器。移动范围由\
  \ `STRIDE` 超参数决定，如图 2.7 所示。步长值控制跨越输入空间宽度的移动，以及高度。\n\n图 2.7：由 `STRIDE` 超参数引起的移动范围\n\
  \n![](img/Image912.jpg)\n\n滤波器移动后，继续执行相关操作，计算下一个输出值。重复此过程，随着滤波器在输入卷的宽度高度上移动，我们产生一个二维特征图，给出该滤波器在每个空间位置的响应，如图\
  \ 2.8 所示。\n\n图 2.8：每个空间位置具有滤波器响应的特征图\n\n![](img/Image919.jpg)\n\n滤波器值是卷积层的可学习参数（即层的权重），偏置等于\
  \ `β`。\n\n每个滤波器的通道数将与输入信息相同。然而，无论通道数多少，输出始终是一个二维网格。图 2.9 所示的示例中，单个滤波器与三个通道的信息相结合。每个通道可以被认为是信息的“一部分”。这个单一的\
  \ 3x3 滤波器有 `28` 个权重。也就是说，每部分信息被分配了九个权重，总共 `27` 个权重。然后我们有偏置，它给了我们第 `28` 个权重。非线性激活![](img/Image927.png)，例如指数线性、双曲正切、修正线性或其他变换，可以应用于特征图的输出值，如图\
  \ 2.9 所示。\n\n图 2.9：滤波器权重和非线性变换\n\n![](img/Image935.png)\n\n### 填充 (Padding)\n\n\
  卷积和池化都会增加欠拟合的压力，这在很大程度上是因为添加更多此类层会导致信息减少。填充可以抵消或减轻信息的丢失。填充增加了图像边缘现有像素的相关性。\n\n填充的目的是根据原始输入图像尺寸和滤波器尺寸产生尺寸“合理”的输出图像。关键问题在于输入图像维度是偶数还是奇数、滤波器维度是偶数还是奇数，以及用户指定的步长值。\n\
  \n以下是一些“合理”规则：\n\n*   水平填充和垂直填充尺寸是相互独立的。改变图像或滤波器的水平维度不会影响垂直填充尺寸。\n*   如果步长为 `1`，则输出图像尺寸与输入图像尺寸相同。在讨论卷积时，这有时被称为相同填充\
  \ (same padding)。\n*   如果步长为 `2`，则输出图像尺寸大约为输入图像尺寸的一半。\n*   首先添加到图像的右侧，然后是左侧。因此，如果填充不均，右侧的填充比左侧多。\n\
  *   图像用零进行填充。\n\n如果没有填充，取决于滤波器的尺寸和步长，特征图可能远小于输入，如图 2.10 所示。\n\n卷积层引起的收缩可以通过使用填充来缓解。如果步长为\
  \ `1`，输出图尺寸与输入图尺寸完全相同，因为 `SAS DEEPLEARN` 动作集中的默认行为是自动填充通道或特征图。如果步长为 `2`，输出图的面积将减少约\
  \ 4 倍（`2*2`）。\n\n图 2.10：没有填充的特征图\n\n![](img/Image942.jpg)\n\n卷积层引起的收缩可以通过使用填充来缓解，如图\
  \ 2.11 所示。\n\n图 2.11：带有填充的特征图\n\n![](img/Image953.jpg)\n\n要在 SAS 中配合 GPU 使用填充，必须在\
  \ `dlTrain` 动作中将 `FORCEEQUALPADDING` 选项设置为 `True`。这意味着特征图的所有侧都应用相等填充。如果指定了 `GPU=TRUE`\
  \ 选项，SAS 默认 `FORCEEQUALPADDING=TRUE`：\n\n```\nForceEqualPadding=True\n```\n\n如果没有填充，特征图会缩小，如图\
  \ 2.12 所示。\n\n图 2.12：无填充\n\n![](img/Image961.jpg)\n\n特征图的维度并不是 SAS 默认产生的，接下来的图 2.13\
  \ 所示。\n\n图 2.13：SAS 的自动填充\n\n![](img/Image968.png)\n\nSAS 在假设步值为 1 时自动填充以抵消特征图尺寸的自然减少。当步长大于\
  \ 1 时，SAS 仍应用填充，但当步长大于 1 时，特征图将比输入小。这意味着使用大于 1 的步长会减少输出特征图的大小。此外，如果生成的卷积特征图是非整数矩阵，SAS\
  \ 会自动应用额外的填充。例如，考虑输入信息为 12x12 矩阵的情况。使用 3x3 滤波器和步长二将产生 `6.5`（一个非整数值），如图 2.14 所示。\n\
  \n图 2.14：SAS 自动调整非整数特征图\n\n![](img/Image976.png)\n\n### 特征图维度\n\n输出的维度由输入、滤波器和填充结合步长尺寸决定，如图\
  \ 2.15 所示。\n\n图 2.15：特征图维度\n\n![](img/Image983.jpg)\n\n特征图维度可以通过以下公式计算：\n\n![](img/Image992.png)\n\
  \n`image/Image999.png` 代表输入维度，`image/Image1007.png` 代表填充值（稍将讨论），`image/Image1016.png`\
  \ 代表滤波器尺寸，`image/Image1027.png` 代表步长尺寸。\n\n## 池化层 (Pooling Layers)\n\n\n\n\n\n##\
  \ 池化层 (Pooling Layers)\n\n池化函数提供了输入信息某些局部区域的摘要。SAS 提供三种摘要选项：最大值（Maximum）、平均值（Average）和最小值（Minimum）。与卷积层类似，池化层也使用过滤器，但这些过滤器用于确定要总结的区域，不包含可学习的权重。与池化过滤器相关的超参数包括\
  \ `width`（宽度）、`height`（高度）和 `stride`（步长）。不需要指定池化过滤器的数量，因为数量由输入的二维网格数量决定。在 CNN 架构中，在连续的卷积层之间定期插入池化层是常见的。尽管\
  \ Springenberg 等人证明了用卷积层替换池化层取得了巨大成功，并利用较大的步长对信息进行下采样（Springenberg et al., 2015）。例如，使用过滤器大小为\
  \ 2 x 2 步长为 2 的池化层或卷积层会将输入信息减少 75%。因此，`stride` 会激进地缩小网络。\n\n生成每个局部区域的摘要还有一个额外好处，使得输出对输入中的微小偏差具有近似不变性。也就是说，当建模者更关注对象是否存在而非其精确位置时，池化函数是非常有用的。相反，如果空间差异非常重要，则应该谨慎使用池化，甚至不使用（Goodfellow,\
  \ Bengio, and Courville 2017）。\n\n使用较大的 `stride` 值进行池化也可以适用于输入信息大小可能变化的情况。考虑一种场景：你正在分类两种尺寸图像：128\
  \ x 128 和 192 x 192。每种图像尺寸将拥有其自己的输入层，较大的图像可以使用 `stride` 大于 1 的池化层进行下采样，以匹配较小的输入尺寸。对较大的信息进行下采样很重要，因为输出层要求信息的大小相同。\n\
  \n超参数 `Width` 和 `Height` 设置了邻域的大小，如图 2.16 所示。\n\n### 图 2.16：池化层\n\n![](img/Image1039.jpg)\n\
  \n每个池化函数都总结所检查的邻域。`POOL=` 用于指定池化层使用的摘要类型。这是一个示例：\n\n```\nlayer={type=’POOL’ width=2\
  \ height=2 stride=2 pool=”max”\n```\n\n与卷积层一样，`stride` 参数控制邻域的移动尺寸。邻域持续跨越输入空间，直到整个空间都被总结，如图\
  \ 2.17 和 2.18 所示。\n\n### 图 2.17：步长 = 2 的特征图\n\n![](img/Image1047.jpg)\n\n### 图 2.18：完成的特征图\n\
  \n![](img/Image1058.jpg)\n\n## 传统层 (Traditional Layers)\n\n## 全连接层 (Fully Connected\
  \ Layer)\n\n全连接层中的神经元与上一层中的所有激活值都有全连接，如普通的神经网络所示。因此，它们的激活值可以通过矩阵乘法后接偏置偏移来计算。全连接层包含了大量的参数，因此训练成本很高。\n\
  \n## 输出层 (Output Layer)\n\n输出层本质上是一个与特定误差函数相关的全连接层。在二分类目标这种情况下，交叉熵误差函数\n\n![](img/Image1065.png)\n\
  \n简化为等效的伯努利误差函数：\n\n![](img/Image1073.png)\n\n如果目标结果有超过两个级别，则误差函数解析为\n\n![](img/Image10801.png)\n\
  \n其中 ![](img/Image1087.png) 是观测值的类别标签 ![](img/Image1095.png)。\n\n如果目标是二分类，则使用 logistic\
  \ 激活函数：\n\n![](img/Image1103.png)，其中 ![](img/Image1112.png)\n\nlogistic 激活函数将其输出限制在\
  \ 0:1 的范围内，使其成为生成概率估计 (![](img/Image1123.png)) 的理想选择。统计学中，logistic 函数广为人知的 logit-link\
  \ 函数：\n\n![](img/Image1135.png)= ln(odds)\n\n如果你正在拟合多项分类目标，则 softmax 激活函数（见下文）是合适的。它是广义\
  \ logit-link 函数的反函数。\n\n![](img/Image1142.png)\n\n由于 softmax 将每个神经元的输出激活值除以所有参与神经元的输出之和，它确保了估计值之和为\
  \ 1。这产生了一种分布效应。\n\n## 跳跃层连接类型 (Types of Skip-Layer Connections)\n\n用于图像分类的深度卷积神经网络利用增加堆叠层数来丰富特征的能力。然而，添加更多层有时会导致网络早期学习的信息由于梯度消失而被遗忘。归一化技术（如批标准化）成功地抑制了剧烈的梯度波动，在很大程度上解决了收敛问题。此外，添加跳跃层连接可以帮助神经网络记住结构早期学习的潜在特征。跳跃层连接的可视化如图\
  \ 2.19 所示。\n\n### 图 2.19：跳跃层连接\n\n![](img/Image1150.jpg)\n\n拼接层（Concatenation）和残差层（Residual）可以用于创建跳跃层连接。拼接层可用于跳跃层连接（见图\
  \ 2.20），但拼接操作会导致“胖”网络，处理成本很高。\n\n```\nAddLayer / model=’ModelName’ name=’LayerName’\
  \ layer={type=’concat’}  \n           srcLayers={‘A’,’B’,’C’,’D’};\n```\n\n### 图\
  \ 2.20：拼接层\n\n![](img/Image158.jpg)\n\n残差层由 Kaiming 等引入，作为一种结合跳跃层连接的方法，如图 2.21 所示。残差层通过相加而非拼接来“瘦身”网络。使用\
  \ `TYPE=RESIDUAL` 添加残差层。\n\n```\nAddLayer / model=’ModelName’ name=’LayerName’ \
  \ \n           srcLayers={‘A’,’B’,’C’,’D’};\n```\n\n### 图 2.21：残差层\n\n![](img/Image167.jpg)\n\
  \n## 演示：加载和准备数据\n\n此演示说明如何使用 action set 加载和准备数据。\n\n1. 打开程序 `DL2D01.sas` 查看代码编辑器中的程序内容。首先加载\
  \ Image action set，并创建描述图像的元数据表。`loadImages` action 将图像和相关的元数据读入内存。`loadImages`\
  \ action 可以从各种来源上传信息，包括\n\n- 摄影图像\n- 医学图像文件（包括 DICOM 格式）\n- ZIP 文件\n- 包含图像或 ZIP\
  \ 文件的目录\n- 包含一系列摄影或医学图像的目录\n- 包含上述任何项目的目录树\n- URL\n- 包含上述项目组合的列表\n\n输出包含 CAS 表格形式的编码或解码格式图像，取决于输入参数\
  \ `decode` 的值。当此参数设置为 False（默认值）时，输出表具有以下列\n\n- `_id_`: 每个图像唯一的整数\n- `_path_`: 图像的完整路径\n\
  - `_image_`: 包含整个文件的二进制大型对象\n- `_size_`: `_image` 列中二进制大型对象的字节长度\n- `_type_`: 指定图像格式的三字符字符串（例如，JPG\
  \ 图像为 `jpg`）\n\n当 `decode` 参数设置为 True 时，`_image` 列包含解压缩后的图像数据，输出表具有这些额外列\n\n- `_dimension_`:\
  \ 图像的维度（例如，二维图像为 2，三维图像为 3）\n\n\n\n\n\n- `resolution` – 图像在每个维度上的尺寸（例如，对于一个宽 100\
  \ 像素、高 200 像素的二维图像数组，使用 {100, 200}）。\n- `imageFormat` – 表示 `image` 列中数据组织形式的整数。最常见的值有\
  \ 0、16、2 和 18，分别对应 8 位灰度图、8 位 RGB 图像、16 位灰度图和 16 位 RGB 图像。\n\n位于 `Image Data` 文件夹中的\
  \ `LargetrainData` 和 `SmalltrainData` 文件夹都包含 10 个子文件夹。这 10 个子文件夹中的每一个都包含特定类的图像。例如，`truck`\
  \ 文件夹只包含卡车的图像。`RECURSE=TRUE` 选项指定从这 10 个目录读取所有图像的操作。`LABELLEVELS=1` 选项告诉操作根据存储图像的文件夹名称分配标签。例如，`truck`\
  \ 文件夹中的所有图像将被分配标签 `truck`。\n\n```\nproc cas;\n```\n\n```\n   loadactionset ‘image’;\n\
  ```\n\n```\n   loadactionset ‘table’;\n```\n\n```\n   table.addCaslib / name=’imagelib’\
  \   \n```\n\n```\n      path=’/home/student/LWDLUS/Image Data’\n```\n\n```\n   \
  \   subdirectories=true;\n```\n\n```\n    image.loadimages / caslib=’imagelib’ path=’LargetrainData’\n\
  ```\n\n```\n         decode=true recurse=true labellevels=1\n```\n\n```\n      \
  \   addcolumns={‘CHANNELCOUNT’}   \n```\n\n```\n             casout={name=’LargetrainData’,\
  \ replace=true};\n```\n\n```\n  image.loadimages / caslib=’imagelib’ path=’SmalltrainData’\n\
  ```\n\n```\n         decode=true recurse=true labellevels=1\n```\n\n```\n      \
