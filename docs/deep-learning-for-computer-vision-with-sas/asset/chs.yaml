  ```\n\n图 4.18：日志\n\n![](img/Image1379.png)\n\n11. 最后，使用训练后的模型对保留图像进行评分，并打印带有模型预测的图像。见图\
  \ 4.19。\n\n```\nyolo_model.predict(data=s.CASTable(name=’trainset’,\n```\n\n```\n\
  \    where=’_istrain_ eq 0’), gpu = Gpu(devices=[0]))\n```\n\n```\n    display_object_detections(conn=s,\n\
  ```\n\n```\n                              coord_type=’yolo’,\n```\n\n```\n     \
  \                         max_objects=1,\n```\n\n```\n                table=dict(name=yolo_model.valid_res_tbl.name,\n\
  ```\n\n```\n                     where=’_nobjects_ eq 1’)\n```\n\n```\n        \
  \             #,num_plot=10,\n```\n\n```\n                     #n_col=3\n```\n\n\
  ```\n                     )\n```\n\n图 4.19：结果。\n\n![](img/Image1386.jpg)\n\n# 第\
  \ 5 章：计算机视觉案例研究\n\n本章详细介绍了使用 SAS 编程语言进行的一个计算机视觉案例研究。\n\n全球最领先的医学研究中心之一寻求构建一个计算机视觉模型，用于从描述结构的图像中提取并总结对代谢通路的理解。也就是说，理解由化学化合物和箭头形成的几何序列。这些图像是从研究论文或期刊解析出的。\n\
  \n本案例研究详细说明了一种涉及创建两阶段计算机视觉模型的解决方案。第一阶段依赖于目标定位（检测）模型。第二阶段使用图像分类器对提取出的箭头的方向进行分类。然而，本案例研究仅描述了第一阶段。\n\
  \n训练数据包含 871 张标记图像，其中大约一半的图像是从论文中提取的，另一半是手动合成的。合成图像具有以随机方向放置的箭头变体，并结合随机选择的化合物。每张合成图像都包含噪声以提高泛化能力（文本、形状、随机噪声块等）。此外，合成图像的设计使得每个箭头都可以被“框选”而不会捕获其他边缘，如图\
  \ 5.1 所示。\n\n图 5.1：合成图像\n\n![](img/Image845.png)\n\n标记图像的示例见图 5.2。\n\n图 5.2：标记图像\n\
  \n![](img/Image52.png)\n\n数据位于一个名为 `Train_metabolic_pathways` 的 SAS 数据文件中。\n\n1.\
  \ 打开名为 `CASESTUD_1a` 的程序。该程序从一个定义数据和程序位置的宏变量开始。`%let datalocation=*specify the location\
  \ of programs here;` 然后建立 cas 库。\n\n```\nlibname mycas;\n```\n\n```\nproc cas;\n\
  ```\n\n```\n   table.addlib name=’images’ path=”&datalocation”\n```\n\n```\n   \
  \            subdirectories=true;\n```\n\n```\nquit;\n```\n\n2. 接下来创建一个宏，用于创建一个输出变量列表，对应训练数据中图像中最大对象数量。在这种情况下，图像中对象的最大数量为\
  \ 41。输出变量列表包括图像中的对象数量（`nobjects_`）以及一组定义每个实体空间位置的变量（`Object#_x`、`Object#_y`、`Object#_width`\
  \ 和 `Object#_height`）。变量名列表存储在宏变量 `ObjectTargets` 中。\n\n```\n%macro makevars;\n\
  ```\n\n```\ndata mycas.createvars;\n```\n\n```\n_nObjects_.;\n```\n\n```\n%do i=0\
  \ %to 40;\n```\n\n```\nlength _Object&i._ varchar(8);\n```\n\n```\nlength _Object&i._x\
  \ _Object&i._y _Object&i._width _Object&i._height 8;\n```\n\n```\n_Object&i._=’;\n\
  ```\n\n```\n_Object&i._x=.;\n```\n\n```\n_Object&i._y=.;\n```\n\n```\n_Object&i._width=.;\n\
  ```\n\n```\n_Object&i._height=.;\n```\n\n```\n%end;\n```\n\n```\nrun;\n```\n\n```\n\
  %mend makevars;\n```\n\n```\n%makevars;\n```\n\n```\ndata mycas.createvars;\n```\n\
  \n```\n_nObjects_.;\n```\n\n```\ntranspose=_vars;\n```\n\n```\nrun;\n```\n\n```\n\
  proc sql;\n```\n\n```\nselect *\n```\n\n```\nfrom work.createvars\n```\n\n```\n\
  where _nobjects_ is not null\n```\n\n```\ninto ObjectTargets;\n```\n\n```\nquit;\n\
  ```\n\n3. 接下来，程序上传 `Train_metabolic_pathways` 数据。\n\n```\nproc cas;\n```\n\n```\n\
  load file=”&datalocation/Train_metabolic_pathways.sdat”\n```\n\n```\ncasout=”ChemArrows”\n\
  ```\n\n```\n/*TrainFull*/\n```\n\n```\nquit;\n```\n\n训练数据中的图像已调整为 416x416 并转换为灰度图。数据还包含一个分区指示器\
  \ `_partind_`。\n\n4. 接下来，程序加载一个名为 `TinyYolov2` 的预训练模型。SAS 从以下 URL 获取了大量的预训练模型：`https://support.sas.com/documentation/prod-p/vdmml/index.html`。\n\
  \n```\nproc cas;\n```\n\n```\nload file=”&datalocation/Tiny-Yolov2.sdat”\n```\n\n\
  ```\ncasout=”TinyYolov2”\n```\n\n```\nimportoptions=(filetype=”hdat”)\n```\n\n```\n\
  replace;\n```\n\n```\nquit;\n```\n\n```\nproc cas;\n```\n\n```\nload file=”/data/roban/Pretrained/Tiny_Yolo/Tiny-olov2_weights.sdat”\n\
  ```\n\n```\ncasout=”TinyYolov2_weights”\n```\n\n```\nimportoptions=(filetype=”hdat”)\n\
  ```\n\n```\nreplace;\n```\n\n```\nquit;\n```\n\n5. 使用 `fetch` 操作显示模型表。还加载了几个动作集。\n\
  \n```\n  proc cas;\n```\n\n```\n    table.fetch /\n```\n\n```\n     table=”TinyYolov2”\n\
  ```\n\n```\n    to=500;\n```\n\n```\n   loadactionset ‘deeplearn’;\n```\n\n```\n\
  \   loadactionset ‘image’;\n```\n\n```\n   loadactionset ‘table’;\n```\n\n```\n\
  quit;\n```\n\n图 5.3 显示了结果。\n\n图 5.3：模型表\n\n![](img/Image861.jpg)\n\n模型表定义模型的架构，可以通过更改来改变或增强预训练模型的行为。例如，SAS\
  \ 提供的预训练 `Tiny-Yolov2` 不对输入图像进行任何内存翻转。这种行为在后续代码中进行了修改，允许模型翻转传入图像。坐标会自动调整以修正几何变变。\n\
  \n从 `Tiny-Yolov2` 模型中删除了输出层（`detections1`）。\n\n```\nproc cas;\n```\n\n```\nremovelayer\
  \ / model=’TinyYolov2’ name='detection1’;\n```\n\n```\nquit;\n```\n\n添加了几个适配层以及一个新的输出层。\n\
  \n```\nproc cas;\n```\n\n```\n \n```\n\n```\nAddLayer / model=’Tiny-Yolov2’ name=’ConVL1’\
  \ layer={type=’CONVO’ nFilters=1000 /*588*/  width=1 height=1 stride=1 act=’identity’\
  \ includeBias=FALSE} srcLayers={‘convo.9’};\n```\n\n\n\n\n\n```\nAddLayer / model=’Tiny-Yolov2’\
  \ name=’PoolL1’ layer={type=’POOL’  width=2 height=2 stride=1 pool=’max’} srcLayers={‘BatchL2’};\
  \ \n```\n\n```\nAddLayer / model=’Tiny-Yolov2’ name=’ConVL3a’ layer={type=’CONVO’\
  \ nFilters=250 /*45*/  width=1 height=1 stride=1 act=’identity’ includeBias=FALSE}\
  \ srcLayers={‘PoolL1’};\n```\n\n```\nAddLayer / model=’Tiny-Yolov2’ name=’BatchL3a’\
  \ layer={type=’BATCHNORM’ act=’ELU’} srcLayers={‘ConVL3a’};\n```\n\n```\nAddLayer\
  \ / model=’Tiny-Yolov2’ name=’ConVL3’ layer={type=’CONVO’ nFilters=250 /*2000*/\
  \  width=1 height=1 stride=1 act=’identity’ includeBias=FALSE} srcLayers={‘PoolL1’};\n\
  ```\n\n```\nAddLayer / model=’Tiny-Yolov2’ name=’BatchL3’ layer={type=’BATCHNORM’\
  \ act=’ELU’} srcLayers={‘ConVL3’};\n```\n\n```\nAddLayer / model=’Tiny-Yolov2’ name=’ConVL4’\
  \ layer={type=’CONVO’ nFilters=250 /*2000*/  width=3 height=3 stride=1 act=’identity’\
  \ includeBias=FALSE} srcLayers={‘BatchL3’};\n```\n\n```\nAddLayer / model=’Tiny-Yolov2’\
  \ name=’BatchL4’ layer={type=’BATCHNORM’ act=’ELU’} srcLayers={‘ConVL4’};\n```\n\
  \n```\nAddLayer / model=’Tiny-Yolov2’ name=’ConVL5a’ layer={type=’CONVO’ nFilters=25\
  \ /*250*/  width=1 height=1 stride=1 act=’identity’ includeBias=FALSE} srcLayers={‘BatchL4’};\n\
  ```\n\n```\nAddLayer / model=’Tiny-Yolov2’ name=’BatchL5a’ layer={type=’BATCHNORM’\
  \ act=’ELU’} srcLayers={‘ConVL5a’};\n```\n\n```\nAddLayer / model=’Tiny-Yolov2’\
  \ name=’ConVL5’ layer={type=’CONVO’ nFilters=25 /*250*/  width=3 height=3 stride=1\
  \ act=’identity’ includeBias=FALSE} srcLayers={‘BatchL5a’};\n```\n\n```\nAddLayer\
  \ / model=’Tiny-Yolov2’ name=’BatchL5’ layer={type=’BATCHNORM’ act=’ELU’} srcLayers={‘ConVL5’};\n\
  ```\n\n```\nAddLayer / model=’Tiny-Yolov2’ name=’concatl1’ layer={type=’concat’}\
  \ srcLayers={‘BatchL5’,’BatchL3a’};\n```\n\n```\nAddLayer / model=’Tiny-Yolov2’\
  \ name=’ConVL7’ layer={type=’CONVO’ nFilters=49  width=1 height=1 stride=1 act=’identity’\
  \ includeBias=FALSE} srcLayers={‘concatl1’};\n```\n\n```\nAddLayer / model=’Tiny-Yolov2’\n\
  name=’detection1’ layer={type=’detection’\ndetectionModelType = “YOLOV2”\nclassNumber\
  \ = 2\ngridNumber = 13\ncoordNumber = 4\npredictionsPerGrid = 7\nanchors ={\n0.459726,\n\
  1.103842,\n4.418608,\n2.111627,\n1.453295,\n2.195889,\n1.318375,\n0.840207,\n1.912652,\n\
  5.398259,\n0.485043,\n0.356428,\n2.295685,\n1.433674\n}\nsoftMaxForClassProb = True\n\
  objectScale = 1.01\npredictionNotAObjectScale =1\nclassScale = 1.0\ncoordScale =\
  \ 3\ncoordType = “YOLO”\ndetectionThreshold = 0.4\niouThreshold = 0.1\ntrainIouThreshold=.3\n\
  }\nsrcLayers={‘ConVL7’}; quit;\n```\n\n6. 预训练模型架构通过 `update` 表操作使用以下特征进行了进一步修改：\n\
  \n- 图像被随机选择并进行水平翻转\n- 图像被随机选择并进行垂直翻转\n- 除了输入层和第一个卷积层外，所有层都应用了 `0.01766666749` 的丢弃率（dropout）\n\
  \n将输入层的 `DLNumVal` 变量值改为“4”，告诉 SAS 对选取图像进行垂直和水平翻转。随机裁剪和 dropout 等其他修改也被应用于模型中。\n\
  \n```\nproc cas;\n/* 应用水平和垂直翻转变异 */\nmytbl.name=”Tiny-Yolov2”; \nmytbl.where = “input1’\
  \ = _DLKey0_ and ‘No flipping’ = _DLChrVal_”;\ntable.update /\ntable=mytbl\nset\
  \ = {var=_DLNumVal_, value=”4”}};\n\n/* 应用随机裁剪变异 */\nmytbl.name=”Tiny-Yolov2”; \n\
  mytbl.where = “input1’ = _DLKey0_ and ‘No cropping’ = _DLChrVal_”;\ntable.update\
  \ /\ntable=mytbl\nset = {var=_DLNumVal_, value=”2”};\n\n/* 对模型中的所有层应用 0.0176666749\
  \ 的 dropout 率 */\nmytbl.name=”Tiny-Yolov2”; \nmytbl.where = “dropout’ = _DLChrVal_”;\n\
  table.update /\ntable=mytbl\nset = {var=_DLNumVal_, value=”0.0176666749}};\n\n/*\
  \ 将第一个卷积层的 dropout 率重置为零 */\nmytbl.name=”Tiny-Yolov2”; \nmytbl.where = “convo.1’\
  \ = _DLKey0_ and ‘dropout’ = _DLChrVal_”;\ntable.update /\ntable=mytbl\nset = {var=_DLNumVal_,\
  \ value=”0”}};\n\n/* 将输入层的 dropout 率重置为零 */\nmytbl.name=”Tiny-Yolov2”; \nmytbl.where\
  \ = “input1’ = _DLKey0_ and ‘dropout’ = _DLChrVal_”;\ntable.update /\ntable=mytbl\n\
  set = {var=_DLNumVal_, value=”0.00003”}}; quit;\n```\n\nTiny-Yolov2 模型之前使用 `DLTRA`\
  \ 训练了 250 个轮次（epochs），如图 5.4 所示。\n\n图 5.4: Tiny-Yolov2 模型，DLTRA 250 轮次损失曲线\n\n![](img/870.png)\n\
  \n7. 我们继续训练模型一个额外的轮次。\n\n```\nproc cas;\n  dlTrain / table={name=’Train_metabolic_pathways’,\
  \ where=’_PartInd_=1’} model=’Tiny-Yolov2’\n        modelWeights={name=’ConVTrained_d’,\
  \ replace=1}\n        bestweights={name=’MinyYolo’, replace=1}\n        initWeights=’tinyYolo_pathways’\n\
  \        dataSpecs={{data={&ObjectTargets},\n                              layer=’detection1’,\n\
  \                              type=’OBJECTDETECTION’}\n                       {data={‘_image_’},\n\
  \                              layer=’input1’,\n                              type=’IMAGE’}\n\
  \                       }         GPU=True\nforceEqualPadding = True\n ValidTable={name=’Train_metabolic_pathways’,\
  \ where=’_PartInd_=2’}\n        optimizer={minibatchsize=4, ignoreTrainingError=true,\n\
  \                algorithm={method=’LARS’, lrpolicy=’Step’, gamma=0.901, stepsize=1,\n\
  \                learningrate=6.047E-7, scalefactor=.009,warmup=0,momentum=0.9395666667,\
  \ clipgradmin=-100, clipgradmax=100},loglevel=3, regL1=0.0022902367, regL2=0.0025301567,maxepochs=1}\n\
  seed=12345\n;\nquit;\n```\n\n该模型包含 23,511,562 个参数！性能比扩展训练期间的结果略差。\n\n8. 使用训练好的模型预测（评分或推理）数据中化合物和箭头的位置。\n\
  \n```\n /* 对全数据进行评分以生成提取结果 */;\nproc cas;\n                dlScore / table={name=’Train_metabolic_pathways’}\
  \ model=’Tiny-Yolov2’\n                                 initWeights=’tinyYolo’\n\
  \                                 casout={name=’PathwaysScored’, replace=1}\n  \
  \                               copyVars={‘_image_’}\n                         \
  \        gpu=true;\nQuit;\n```\n\n\n\n\n\n## 9. `DLSCORE` 的预测结果被传递给 `extractDetectedObjects`\
  \ 动作。`extractDetectedObjects` 动作将预测的边界框应用于数据 `PathwaysScored` 中的图像。\n\n```sas\n\
  proc cas;\nimage.extractDetectedObjects /\ncasOut={name=’ObjectsExtracted’, replace=true}\n\
  coordType=’YOLO’\nmaxObjects=50\nextractType=’highlight’ \nTable={name=’PathwaysScored’};\n\
  quit;\n```\n\n## 10. `PathwaysScored` 中的图像被保存并查看。\n\n```sas\nproc cas;\n   saveImages\
  \ / caslib=”Scoreimageslib”\n   subdirectory=’Predicted Locations’\n   images =\
  \ {table={name=’ObjectsExtracted’} image=’_image_’}\n   overwrite=TRUE   type=”JPG”;\n\
  \   image.loadimages / caslib='Scoreimageslib’ path=’Predicted Locations’\n    \
  \                                  recurse=true casout={name=’Imagesforviewing’,\
  \ replace=true};\nquit;\n```\n\n```sas\n/ */\n/* 查看图像 */\n/ */\ndata _null_;\n set\
  \ mycas.Imagesforviewing(where=(\n _id_<=6) \n         keep=_path_ _id_ ) end=eof;\n\
  \ if _n_=1 then\n         do;\n                dcl odsout obj();\n             \
  \   obj.layout_gridded(columns:1);\n         end;\nobj.region();\nobj.format_text(just:\
  \ “c”, style_attr: ‘font_size=8pt’);\nobj.image(file: _path_, width: “416”, height:\
  \ “416”);\n if eof then\n         do;\n                obj.layout_end();\n     \
  \    end;\nrun;\n```\n\n图 6.5 和 6.6 显示了结果。\n\n### 图 5.5：结果\n![](img/Image877.png)\n\
