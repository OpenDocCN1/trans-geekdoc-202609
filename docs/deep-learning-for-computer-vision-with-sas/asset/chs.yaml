  \n注意：随机洗牌的替代方案是课程学习。课程学习按最易学习的观测值对数据进行排序。要实现课程学习，从业人员将训练模型，根据预测与实际值对数据进行排序，然后重新训练模型。\n\
  \n以下代码使用 `shuffle` 操作随机排序观测值。创建了一个名为 `ImageDataShuffled` 的新数据集。\n\n```\nproc cas;\n\
