  \ replace=1};\n```\n\n```\nrun;\n```\n\n卷积神经网络在某些情况下可能需要训练几天、数周甚至几个月。此示例使用有限的数据构建了一个简单的卷积网络以节省时间。\n\
  \n3. 打开名为 `DLMS02D02a.sas` 的程序并运行它。\n\n# 第 3 章：提高准确性\n\n- 简介\n- 架构设计策略\n- 空间探索\n\
  - 创建块\n- 比较结构深度与基数\n- 图像预处理与数据增强\n- 数据增强技术\n- 处理图像\n- 高斯滤波\n- 锐化\n- 像素反转\n- 金字塔下采样\n\
  - 旋转\n- 翻转\n- 迁移学习介绍\n- 领域与子域\n- 任务\n- 迁移学习类型\n- 异质迁移学习与领域适应\n- 迁移学习偏差\n- 频率偏差\n\
  - 迁移学习策略\n- 监督预训练\n- 无监督预训练\n- 使用 FCMP 进行自定义\n- 调优深度模型\n- 选择超参数\n- 采样超参数空间\n- 超参数选择\n\
  - Hyperband 属性\n\n## 简介\n\n大多数传统数据（如交易或调查数据）并不包含“真相”。例如，知道一个人的真实的道德品质可以大大提高欺诈模型的准确性，尽管某些类型的数据包含真相。图像数据就是其中一个例子，因为定义对象的元素存在图像中，尽管是以二维形式存在的。因此，一个训练良好的神经网络在图像分类和其他视觉任务上优于外行并不意外。\n\
  \n## 架构设计策略\n\n本章的重点是介绍用于改进计算机视觉模型的简单技术。\n\n`1x1` 卷积通常用于更改流信息的维度深度。`1x1` 内核跨所有列和所有通道共享单个权重，产生一个摘要的主题。（参见图\
  \ 3.1。）\n\n图 3.1：1 x 1 卷积\n\n![](img/Image2949.jpg)\n\nGoogLeNet 在应用内核滤波器之前使用 `1x1`\
  \ 卷积减少维度深度，这种技术被称为瓶颈（Szegedy et al. 2014）。瓶颈可以减少训练相关的计算成本，从而将资源分配到其他领域，例如增加基数或构建更深、更宽的网络结构。（参见图\
  \ 3.2。）\n\n图 3.2：特征提取前的维度深度还原\n\n![](img/Image2956.png)\n\n\n\n\n\n你也可以使用 1 x 1\
  \ 卷积来扩展维度深度，它们有时被用来代替全连接层以节省计算成本，如图 3.3 所示。\n\n图 3.3：使用 1 x 1 卷积扩展维度深度\n\n![](img/Image2965.png)\n\
  \n## 空间探索\n\n过滤器提取空间相关的信息，并将这些信息转换到输出特征图中。空间探索技术（如使用不同尺寸的过滤器）使模型能够捕捉不同粒度的细节，从而对过滤器所在的区域提供更完整的理解。在不同尺度上捕获的信息可以在随后的层中组合，以形成对信息更详细的解释。\n\
  \n此外，增加步长（stride）会影响每个滤波器的探索方案，并缩小输出特征图的大小。较大的步长值会缩小输出特征图的宽度和高度。\n\n## 创建块（Blocks）\n\
  \nGoogLeNet 将 1 x 1 过滤器与空间探索相结合了块（Szegedy 等人 2014）。块是特征提取的一个阶段，通常由多个卷积层组成，这些层通常被堆叠，然后通过“分割-转换-合并”策略与拼接层或残差层相结合。（见图\
  \ 3.4。）\n\n图 3.4：一个块\n\n![](img/Image2973.jpg)\n\n块与隐藏层不同，因为块可以包含多个隐藏层，这些隐藏层结合时会产生更相关的输出。有时块内部会使用池化层，GoogLeNet\
  \ 就是如此。块通常像隐藏层一样被堆叠。\n\nResNet 引入了残差层，作为将之前学习的信息与当前特征状态相结合的方法，以构建一个能够有效支持增加深度的模型（He\
  \ 等人 2015）。ResNet 在所谓的残差块中利用了残差层。\n\n图 3.5：ResNet 类型残差块\n\n![](img/Image2980.jpg)\n\
  \n残差块始于一个应用于输入信息的卷积层。第一个卷积的输出在进入下一个卷积层之前通过一个非线性激活函数。使用批归一化（Batch normalization）来防止梯度爆炸，并在涉及另一个非线性激活之前对信息进行归一化。残差块以跳层残差连接（skip-layer\
  \ residual connection）结束，它将原始信息与新学习的特征相结合。残差块缓解了与网络深度增加相关的梯度消失/爆炸问题。\n\n基数（Cardinality）是指块内变换集合的数量。基数首次在\
  \ 2017 年的 ResNeXt 模型中引入，作为深度探索的替代方案以获得更高的准确率（Saining 等人 2017）。其训练成本可能很高，但如果使用了跳层，则建议使用残差连接以降低训练成本。\n\
  \n图 3.6：基数\n\n![](img/Image2989.jpg)\n\n每个变换集由一条独立的信息轨迹组成，它们共同训练而非独立训练。例如，下面的图 3.7\
  \ 显示了块内的五个变换集。\n\n图 3.7：块内的变换集\n\n![](img/Image2998.png)\n\nResNeXt 表明基数可以作为深度探索的替代方案。具体来说，ResNeXt\
  \ 的作者证明了与具有相似参数量的 ResNet 相比，其分类错误率更。ResNeXt 中使用的每个变换集始于 1 x 1 卷积以减少维度深度，随后是用于特征提取的\
  \ 3 x 3 卷积。最后，在残差层总结并合并所有变换集之前，使用 1 x 1 卷积来扩展维度深度。\n\n图 3.8：带有平均池化的 ResNet 类型\n\n\
  ![](img/Image3005.jpg)\n\n有趣的是，作者观察到基数的行为非常类似于一种结构正则性。这意味着对于一个似乎过拟合训练数据的模型，基数将是一个非常有用的补充。\n\
  \n## 比较结构深度与基数\n\n考虑以下案例研究，它检查了 ResNet 类型模型和 ResNeXt 类型模型在 CIFAR-10 数据上的性能。具体而言，检查了基数与网络深度的影响。表\
  \ 3.1 突出了 ResNet 类型和 ResNext 类型模型之间的一些差异。\n\n表 3.1：ResNet 与 ResNext 架构\n\n| 特性 |\
  \ ResNet 类型 | ResNext 类型 |\n| --- | --- | --- |\n| 块数量 | 10 | 3 |\n| 基数 | 1 | 6\
  \ |\n| 跳层连接 | 残差 | 残差 |\n| 参数数量 | 803,230 | 349,842 |\n\n实验中检查的 ResNet 类型和 ResNeXt\
  \ 类型模型在起始和结束模型结构上几乎完全相同。ResNet 起于一个包含 12 个滤波器的卷积层，随后是一个 2 x 2 最大池化层，并以 3 x 3 平均池化层结束，随后是一个带有\
  \ 660 个神经元的全连接层。ResNeXt 起于一个包含 8 个滤波器的卷积层，随后是一个 2 x 2 最大池化层，并以 3 x 3 平均池化层结束，随后是一个带有\
  \ 660 个神经元的全连接层。\n\n两种架构之间的主要区别在于起始和结束层之间使用的块数量和基数。ResNet 类型模型使用 10 个具有单一独立路径的块，这意味着基数为\
  \ 1。ResNeXt 类型是一个浅得多的模型，仅使用三个具有六条分离轨迹的块，这意味着基数为 6。\n\n基数具有额外的意外计算成本。因此，尽管模型参数上存在差异，但\
  \ ResNeXt 类型模型的训练时间比 ResNet 类型模型稍长，尽管参数更少。\n\n首先，两个模型都在 10000 个观测值上训练了 60 个轮次（epochs）。ResNet\
  \ 表现更好，分类错误率为 44.2%，而 ResNeXt 为 48.5%。有趣的是，ResNeXt 的方差比 ResNet 小。见图 3.9 和表 3.2。\n\
  \n图 3.9：ResNet 与 ResNext，10000 个观测值，60 个轮次\n\n![](img/Image3049.jpg)\n\n表 3.2：ResNet\
  \ 与 ResNext，10000 个观测值，60 个轮次\n\n| 验证分类 | ResNet | ResNext |\n| --- | --- | ---\
  \ |\n| 60 轮次 | 44.2 | 48.55 |\n\n然后轮次从 60 增加到 1500，两个模型都重新训练了。两个性能都得到了提高，之间的差异缩小了，尽管\
  \ ResNet 模型仍然优于 ResNeXt 模型。考虑到数据只有 10000 个观测值，训练 1500 个轮次似乎有些极端。见图 3.10 和表 3.3。\n\
  \n图 3.10：ResNet 与 ResNext，10000 个观测值，1500 个轮次\n\n![](img/Image3071.jpg)\n\n表 3.3：ResNet\
  \ 与 ResNext，10000 个观测值，1500 个轮次\n\n| 验证分类 | ResNet | ResNext |\n| --- | --- | ---\
  \ |\n| 60 轮次 | 44.2 | 48.55 |\n| 1500 轮次 | 43.1 | 44.1 |\n\n两个模型的第一个卷积层都添加了 10%\
  \ 的丢弃率，并重新训练了模型。两个模型都得到了进一步提高，模型之间的性能差异微乎其微。见图 3.11 和表 3.4。\n\n图 3.11：ResNet 与 ResNext，10000\
  \ 个观测值，1500 个轮次，第一个卷积层添加 10% 丢弃率\n\n![](img/Image3093.jpg)\n\n表 3.4：ResNet 与 ResNext，10000\
  \ 个观测值，1500 个轮次，第一个卷积层添加 10% 丢弃率\n\n| 验证分类 | ResNet | ResNext |\n| --- | --- | ---\
  \ |\n| 60 轮次 | 44.2 | 48.55 |\n| 1500 轮次 | 43.1 | 44.1 |\n| 1500 轮次，添加 10% 丢弃率 |\
  \ 41.75 | 41.95 |\n\n\n\n\n\n数据量从 10,000 个观测增加到 50,000 个观测。两个模型的方差均有所下降，在留出数据上的性能大幅提升。学习率的降低现在现在迭代图中清晰可见。请参阅图\
  \ 3.12 和表 3.5。\n\n### 图 3.12：ResNet 与 ResNext，50,000 次观测，1,500 次迭代\n\n![](img/Image3119.jpg)\n\
  \n### 表 3.5：ResNet 与 ResNext，50,000 次观测，1,500 次迭代\n\n| 验证杂项 | ResNet | ResNext |\n\
  | --- | --- | --- |\n| 10k 观测, 60 次迭代 | 44.2 | 48.55 |\n| 10k 观测, 1,500 次迭代 | 43.1\
  \ | 44.1 |\n| 10k 观测, 1,500 次迭代, 增加 100% dropout | 41.75 | 41.95 |\n| 50k 观测, 1,500\
  \ 次迭代 | 31.26 | 31.45 |\n\n## 图像预处理与数据增强\n\n如果训练数据和验证数据分区之间的性能存在显著差异，那么可能是你的模型遭受了高方差。收集或生成更多数据并应用正则化可以减轻方差误差。从当前数据生成图像时，会对新的排列添加平移和微小失真。然而，平移应该是随机的以避免引入偏差。当训练数据有限且训练与验证误差差异巨大时，应考虑增强图像数据。这种增强可以用于平衡极端的目标分布。\n\
  \n合成案例创建（Synthetic case creation）是一种在无法获取更多数据时，通过设计案例来丰富训练数据的做法。这些人工观测值应该代表总体中可能存在但在实际训练样本中可能无法观察到的可能性。这里的关键是创建代表“可能”而非“不可能”的案例。例如，假设我们正在分析人们从火车离开进入站台的图像。我们可能想要添加合理的颜色失真，以模拟光照的变化。然而，我们不会垂直翻转图片，因为环境中存在重力影响。\n\
  \n有时，添加噪声可以提高模型的泛化能力。考虑为新应用对人类语音建模。添加白噪声来模拟用户尝试使用语音应用程序的不可预测环境可能是有益的。即使是添加随机补丁（random\
  \ patches）也可以被视为生成更多图像数据的有效方法。\n\n## 数据增强技术\n\n数据增强技术通常分为四大类之一：几何、光学、领域和生成式。\n\n\
  - 几何变换涉及像素方向或位置的改变，用于使模型对空间差异更具鲁棒性。这意味着模型对图像中元素的位置偏移更具不变性。属于此类别的常见变换包括旋转、翻转、缩放和裁剪。\n\
  - 光学形态和变换通过改变像素强度，其目的是使模型对颜色变化更具鲁棒性（或不变性）。常见的增强技术包括像素反转、变亮/变暗、色彩偏移、色彩抖动、侵蚀等许多其他。\n\
  - 领域变换整合了由建模者对数据的知识所驱动的数据更改。\n- 生成式变换通常依赖生成式模型来创建新数据。\n\n### 图 3.13：图像变换示例\n\n![](img/Image314.jpg)\n\
  \n`processImage` 和 `augmentImage` 动作经常用于高级增强。在建模过程之前增强数据会额外成本，因为数据量增加了，从而降低了整体速度。SAS\
  \ 深度学习提供了“即时”基础增强，这缓解了速度下降的问题。\n\n## 过程操作\n\n`processImages` 动作对输入图像执行单个或多个图像处理函数。该动作的输入是一个\
  \ CAS 表，包含图像和一组函数（带有特定参数），如下代码所示。\n\n```\nPROC CAS;\n ProcessImages /\n       table={name=\"\
  < image table name>\"}\n       casOut={name=\"< output image table name>\"}\n  \
  \     imageFunctions={\n              {functionOptions={functionType=\"< first transformation\
  \ type>\"}\n              < function type-specific-parameters>}},\n            \
  \  {functionOptions={functionType=\"< second transformation type>\"}\n         \
  \     < function type-specific-parameters>}};\nRUN;\n```\n\n输出是一个 CAS 表，包含应用指定函数后的结果图像。你可以定义以下函数：\n\
  \n- `RESIZE`：根据宽度和高度参数缩放输入图像。\n- `GET_PATCH`：根据输入图像中的矩形区域（使用 `x`、`y`、`width` 和 `height`\
  \ 参数）创建一个补丁。\n\n\n\n\n\n- `CANNY_EDGE`: 使用 Canny 边缘检测算法检测输入图像中的边缘。此函数接受三个参数：`lowThreshold`、`highThreshold`\
  \ 和 `kernelSize`。\n\n- `LAPLACIAN`: 对输入图像应用拉普拉斯算子。拉普拉斯算子是 `n` 维欧几里得空间中的二阶微分算子。当\
  \ `kernelSize` 参数的值为 1 时，结果通过内核与输入图像的卷积来近似。\n- 否则，该值通过累加 `x` 和 `y` 的二阶导数来近似，这些导数是通过\
  \ `Sobel` 算子计算的。\n- `SOBEL`: 使用 `Sobel` 算子计算一阶、二阶、三阶或混合图像导数。导数通过图像与卷积卷积计算。内核必须是正方形。尺寸只能是以下数字之一：1、3、5\
  \ 和 7。当内核大小为 1 时，使用一个 `kernel` 计算 `x` 的一阶或二阶导数，使用另一个 `kernel` 计算 `y` 的一阶或二阶导数。对于其他内核尺寸，`Sobel`\
  \ 算子会将高斯平滑和微分结合（处理噪声）。\n- `NORMALIZE`: 归一化图像的值范围。你可以在 `type` 参数中指定以下归一化函数：`INF`、`L1`、`L2`、`L2SQR`、`HAMMING`、`HAMMING2`、`RELATIVE`\
  \ 和 `MINMAX`。`MINMAX` 函数通常用于将图像归一化在 `alpha` 和 `beta` 值之间。\n- `THRESHOLD`: 对图像中的每个像素应用阈值。你可以指定以下阈值类型：`BINARY`、`BINARY_INVERSE`、`TRUNCATE`、`TO_ZERO`、`TO_ZERO_INVERSE`、`OTSU`\
  \ 和 `TRIANGLE`。\n- `CONVERT_COLOR`: 转换图像的色彩空间。目前可用的转换为 `COLOR2GRAY`、`GRAY2COLOR`、`BGR2RGB`\
  \ 和 `RGB2BGR`。图像的默认色彩空间为 `BGR`。`COLOR2GRAY` 意味着 `BGR2GRAY`。\n- `RESCALEALE`: 更改图像的深度。你可以指定以下类型的重缩放：\n\
  \    - `TO_8U`：深度改为 8 位，其中像素由无符号整数表示。\n    - `TO_32F`：深度改为 32 位，其中像素由浮点数表示。\n  \
  \  - `TO_64F`：深度改为 64 位，其中像素由双精度数字表示。\n    你可以根据 `alpha` 和 `beta` 参数对值进行缩放。\n- `MORPHOLOGY`:\
  \ 对图像进行形态学变换。你可以指定以下变换类型：`ERODE`、`DILATE`、`OPEN`、`CLOSE`、`GRADIENT`、`TOPHAT`、`BLACKHAT`\
  \ 和 `HITMISS`。这些操作中的每一个都可以采用 `RECT`（矩形）、`CROSS`（交叉）和 `ELLIPSE`（椭圆）形状。\n- `BOX_FILTER`:\
  \ 使用归一化均值滤波器模糊图像。`kernelWidth` 和 `kernelHeight` 参数决定了滤波器的形状。假设锚点位于内核中心。\n- `GAUSSIAN_FILTER`:\
  \ 使用高斯滤波器模糊图像。根据 `kernelWidth` 和 `kernelHeight` 参数创建卷积内核，这些参数必须为正数且奇数。\n- `BILATERAL_FILTER`:\
  \ 使用高斯滤波器模糊图像。根据 `kernelWidth` 和 `kernelHeight` 参数创建卷积内核，这些参数必须为正数且奇数。\n- `MEDIAN_FILTER`:\
  \ 使用中值滤波器模糊图像。根据 `kernelWidth` 和 `kernelHeight` 参数创建卷积内核，这些参数必须为正数且奇数。\n- `BUILD_PYRAMID`:\
  \ 创建图像金字塔。你可以使用 `PYRAMID_DOWN` 或 `PYRAMID_UP` 方法。\n- `CONTOURS`: 图像中的轮廓。\n- `CUSTOM_FILTER`:\
  \ 创建自定义滤波器。\n- `ADD_CONSTANT`: 为图像增加或减去常数值。\n- `HIST_EQUALIZATION`: 旨在拉伸强度范围。支持两种版本：全局和自适应。\n\
  - `LINEAR_TRANSFORMATION`: 根据 `method` 以以下方式之一执行线性变换：\n    - `STANDARDIATION`：创建均值为零、方差为一的图像。\n\
  \    - `WHITENING_PCA`：使用主成分分析创建协方差矩阵为单位的图像。\n    - `WHITENING_ZCA`：使用 ZCA 变换（也称为马哈拉诺变换）创建协方差矩阵为单位的图像。\n\
  \    - `LOCAL_CONTRAST_NORM`：与 `STANDARDIATION` 相似，但局部的。\n- `MUTATIONS`: 使用不同的技术变变图像：垂直翻转、水平翻转、通过金字塔缩放、改变对比度（变暗或变亮）、锐化以及左右旋转。\n\
  \n\n\n\n例如，你可以在输入图像上使用滑动窗口方法并单独对输入图像进行翻转。输出的 `CAS` 表包含生成的图像。此外，`writeRandomly` 参数允许你对输入图像随机应用数据增强。这对于基于深度神经网络的机器学习方法非常重要。\n\
  \n将 `sweepImage` 和 `useWholeImage` 参数都设置为 `True` 是相互矛盾的。因此，`useWholeImage` 参数会覆盖\
  \ `sweepImage` 参数。\n\n下面的代码演示了如何使用 `AugmentImage` 操作对一个 32 x 32 像素的图像应用两种变换。\n\n\
  ```\nPROC CAS;\nAugmentImages / table={name= “MyInputTable” casOut={name= “MyOutputTable\"\
  } writeRandomly= true cropList={mutations= { colorjittering= true rotateright= true\
  \ } width= 32 heigth= 32 useWholeImage= true}};\nRUN;\n```\n\n## 高斯滤波器\n\n高斯滤波器用于平滑图像内部的剧烈变化。\n\
  \n图 3.14：高斯滤波器\n\n![](img/Image3151.jpg)\n\n这种光度变换通过混合像素来创建图像的模糊版本。如图 3.14 所示，较大的卷积核会增加变换的模糊效果。高斯滤波器对核的中心赋予更大的权重，使得感兴趣区域与周围像素轻微混合。一个高斯核滤波器的示例可能如下所示。\n\
  \n图 3.15：高斯核滤波器\n\n![](img/Image3159.jpg)\n\n用户只需要提供高斯核的高度和宽度。SAS 会创建一个有效的核，使得二维核下方的体积积等于\
  \ 1。`processImages` 操作被用于创建经高斯滤波器变换的图像。以下是一些示例代码：\n\n```\nPROC CAS;\nimage.processImages\
  \ / imageFunctions= {{functionOptions= {functionType= “GAUSSIAN_FILTER” KernelWidth=\
  \ 5 KernelHeight= 5}} table={name=’inputTable'} casout={name=’outputTable’};\nRUN;\n\
  ```\n\n## 锐化\n\n对图像进行锐化处理被认为是一种光度变换，如图 3.16 所示。\n\n图 3.16：锐化\n\n![](img/Image3166.jpg)\n\
  \n为了锐化图像，SAS 将红、绿、蓝（RGB）彩色图像编码为 `Y′CbCr`，其中 `Y’` 是亮度分，`Cb` 代表蓝差分量，`Cr` 代表红差分量。然后对编码图像应用高通滤波器以检测边缘。图\
  \ 3.17 是高通滤波器的示例。\n\n图 3.17：高通滤波器\n\n![](img/Image3174.jpg)\n\n然后将图像转换回 RGB 彩色空间。以下是锐化图像的示例代码：\n\
  \n```\nPROC CAS;\nimage.processImages / imagefunctions= {{functionOptions= {functionType=”MUTATIONS”\
  \ type=”SHARPEN”}}} table={name=’inputTable'} casout={name=’outputTable’};\nRUN;\n\
  ```\n\n## 像素反转\n\n像素反转是一种光度变换，它反转颜色密度，使得亮变暗，暗变亮，如图 3.18 所示。\n\n图 3.18：像素反转\n\n![](img/Image3181.jpg)\n\
  \n这可以简单地将每个 RGB 像素值替换为 `(255 – pixel value)`。以下是演示如何使用 SAS 反转像素的示例代码：\n\n```\nPROC\
  \ CAS;\nimage.processImages / imagefunctions= {{functionOptions= {functionType=”MUTATIONS”\
  \ type=”INVERT_PIXELS”}}} table={name=’inputTable'} casout={name=’outputTable’};\n\
  RUN;\n```\n\n## 金字塔下采样\n\n金字塔下采样变换对图像进行下采样然后进行模糊。示例如图 3.19 所示。\n\n图 3.19：金字塔下采样与裁剪变换\n\
  \n![](img/Image3189.jpg)\n\n图 3.19 的示例中也使用了裁剪。经验证据，裁剪作为一种几何增强，可以显著提高卷积神经网络模型的泛化性能（Taylor\
  \ and Nitschke 2017）。`augmentImages` 操作用于在同次处理中同时裁剪并应用金字塔下采样变换。\n\n在下面的代码中，注意 `useWholeImage=`\
  \ 被设置为 `false`，这表示可能会执行裁剪。\n\n```\nproc cas;\nimage.augmentImages / cropList= {{mutations=\
  \ {pyramidDown=TRUE} x=60 y=60 }} useWholeImage=false; table={name=’inputTable'}\
  \ casout={name=’outputTable’};\nrun;\n```\n\n## 旋转\n\n图像旋转是最流行的几何变换之一，因为对象的角度在应用中可能会变化。图\
  \ 3.20 显示了图像向左或向右旋转的方法，SAS 会自动用零填充填充外部边缘。然而，将零填充替换为噪声有助于模型的泛化能力。或者，你可以先旋转然后裁剪图像以移除零填充。以下是\
  \ `processImages` 操作将图像向右旋转的代码：\n\n```\nPROC CAS;\nimage.processImages / imagefunctions=\
  \ {{functionOptions= {functionType=”MUTATIONS” type=”ROTATE_RIGHT”}}} table={name=’inputTable’};\n\
  RUN;\n```\n\n## 翻转\n\n图像翻转是另一种广泛的几何变换，但应该谨慎使用，因为它有时会创建标记错误的图像或代表不太可能的情况。图 3.21 显示了图像翻转的示例。\n\
  \n![](img/Image3209.jpg)下面的代码使用 `processImages` 操作垂直翻转图像。\n\n```\nPROC CAS;\nimage.processImages\
  \ / imagefunctions= {{functionOptions= {functionType=”MUTATIONS” type=”VERTICAL_FLIP”}}}\
  \ table={name=’inputTable'} casout={name=’outputTable’};\nRUN;\n```\n\n## 迁移学习引言\n\
  \n传统的机器学习方法从一个数据源提取信息并用于另一个数据源，前提是分布是相同的，或者是非常相似的，如图 3.23 所示。\n\n\n\n\n预测建模是一个经典案例，其利用从历史或当前数据中提取的信息，来预测与尚未观测到的数据相关的结果。预测模型假设特征分布从训练到评分阶段保持不变。\n\
  \n迁移学习是机器学习的一个领域，如图 3.24 所示，它利用从一组分布中提取的信息，并将其应用于另一组不同的分布中。\n\n### 图 3.24：不相似的分布\n\
  \n![](img/Image3239.png)\n\n也就是说，迁移学习指的是从一个设置（通常称为源域）中提取的信息被利用在另一个设置（通常称为目标域）中，以提高学习者的性能。这意味着所提取信息的特征空间与目标学习器（模型）关联的特征空间是不同的。迁移学习指的是从一个设置中提取的信息被利用在另一个设置，目标是提高学习者的性能。更正式地说，源域（`s`）和目标域（`t`）不匹配（`Ds\
  \ ≠ Dt`），或者源任务和目标任务不匹配（`Ts ≠ Tt`）（Weiss, Khoshgoftaar, and Wang 2016）。\n\n## 域与子域\n\
  \n域是由一组特征描述的环境或设置。（参见图 3.25。）域是子域的先驱，域和子域的结构描述了相关信息的层级关系。域以及扩展的子域，由特征空间（`X`）和边缘概率分布（`P\
  \ (X)`）定义。例如，英语、中文和冰兰语的翻译各是自然语言处理域的子域（Weiss, Khoshgoftaar, and Wang 2016）。\n\n###\
  \ 图 3.25：域与子域的示例\n\n![](img/Image3246.jpg)\n\n注意：通常，在考虑源域和目标域是否相等时，出于实用考虑，最近的子域被视为“域”。即回答问题\
  \ `XS=XT` 且 `P(XS)=P(XT)` 是否？\n\n## 任务\n\n域只考虑输入变量，而任务考虑结果。任务由输出空间（`Y`）和条件概率分布（`P(Y|X)`）定义。例如，图\
  \ 3.26 显示，预测分类结果（例如根据狗的图像预测其品种）是计算机视觉域内的一个任务（Weiss, Khoshgoftaar, and Wang 2016）。\n\
  \n### 图 3.26：域与任务\n\n![](img/Image3255.jpg)\n\n因此，我们可以正式地定义迁移学习为：“给定一个具有相应任务 `Ts`\
  \ 的源域 `Ds` 和一个具有相应任务 `Tt` 的目标域 `Ts`，迁移学习是利用 `Ds` 和 `Dt` 的相关信息来改进目标函数 `ft(x)`!(image/Image3262.png)，其中\
  \ `Ds≠Dt` 或 `Ts≠Tt`（Weiss, Khoshgoftaar, and Wang 2016）。”\n\n## 迁移学习的类型\n\n迁移学习有两种类型：同质迁移（`Xs=Xt`）和异质迁移（`Xs≠Xt`）。图\
  \ 3.24 展示了同质迁移的示例。\n\n### 图 3.27：同质迁移学习\n\n![](img/Image3270.jpg)\n\n注意：`Xs=Xt`。\n\
  \n## 异质迁移学习与领域自适应\n\n如上所述，异质学习指的是 `Xs≠Xt`。图 3.28 展示了异质学习的示例。\n\n### 图 3.28：带有表格数据的异质迁移学习\n\
  \n![](img/Image3277.jpg)\n\n领域自适应与 `Ds≠Dt` 密切相关。例如，考虑生成文本的任务。域是相同的，但语言不同。通常的做法是保持权重冻结状态，并从源数据迁移到目标域。领域自适应会改变（或调整）源域。Glorot\
  \ 等人 (2011) 证明了堆叠去噪自动编码器可领域自适应。文献中关于领域的定义存在许多不一致之处。Goodfellow 等人 2016。\n\n## 迁移学习偏差\n\
  \n迁移学习可能是困难的，因为本质上迁移学习存在差异。这些差异会导致偏差，并引起模型性能下降。偏差是负面学习的主要原因。两种最常见的迁移学习偏差是频率偏差和上下文偏差。\n\
  \n### 频率偏差\n\n当特征不独立于域且迁移学习策略部署在不同域时，就会发生频率偏差。例如，考虑跨域（医疗域和商业域）的情感分析任务。“人们”、“帮助”和“工作”等词与域无关，可能以相似的频率出现。然而，“心脏”、“病人”和“药物”等词在医疗域中可能更频繁，而“利润”、“客户”和“销售”在商业域可能更频繁。因此，image/Image3285.png)，意味着特征的边缘概率分布不匹配。\n\
  \n### 上文偏差\n\n当特征与输出之间的底层关系从源数据变为目标数据变化时，就会发生上下文偏差。考虑我们之前关于医疗域和商业域的示例。商业域中的“阳性”一词通常具有积极的情感。然而，同一个词在医疗域中可能具有负面的情感。例如，“检测结果呈阳性”，这里的“阳性”是指疾病的存在。因此，上下文偏差指的是这种情况\
  \ image/Image3294.png)，意味着条件概率分布从源数据到目标数据不同。\n\n\n\n选择冻结哪些层取决于当前面临的问题。如果任务从源数据到目标数据是相同的，那么共享更靠近输出层的层是合理的。在这种情况下，可适应的层是那些靠近输入层的层。相反，如果相关信息主要存在于输入中，则应该冻结更靠近输入层的层，并让靠近输出层的层保持可适应状态。\n\
  \n### 无监督预训练\n\n`Autoencoders`（自动编码器）是一种无监督模型，已在无监督预训练中取得了某种成功。无监督方法的一个优点是源数据不需要标签。无监督预训练策略通常从结合源数据和目标数据的特征开始。随后在全量数据上训练\
  \ `autoencoder`，以期捕获跨领域存在的信息。当源数据丰富而目标数据有限时，这种方法非常有用。然后，使用训练好的 `autoencoder` 对目标数据进行评分（推理），并提取编码投影。这些编码器将连同原始目标特征一起作为输入提供给目标学习器。Glorot\
  \ 等人 (2011) 已经证明了使用堆叠去噪自动编码器进行无监督迁移学习是有效的。\n\n去噪自动编码器由 Vincent 等人 (2010) 引入，是一种在损坏（扰动）的输入上训练的自动编码器。对输入进行损坏只需简单对输入层应用\
  \ `dropout`。去噪自动编码器的一种流行变体 `stacked denoising autoencoder`（堆叠去噪自动编码器）。\n\n`stacked\
  \ denoising autoencoder` 是通过逐层贪婪地训练的。这意味着第一层在扰动输入上经过彻底训练，然后被冻结。随后将扰动输入替换为未扰动的输入，并对下一层进行彻底训练。该层冻结后，重复此过程直到输出层训练完成。\n\
  \n自动编码器的另一种变体 `sparse autoencoders`（稀疏自动编码器）。`Sparse autoencoders` 在目标函数中引入了约束。可以使用\
  \ `L1` 和 `L2` 正化作为约束机制来生成稀疏自动编码器。\n\n### 使用 FCMP 进行自定义\n\n有时，数据科学家希望为模型创建自定义函数，以更好地适应可用默认函数无法提供的特定深度学习需求。SAS\
  \ 中的深度学习工具允许您使用 `SAS Function Compiler`（`FCMP`）来创建和修改用于深度神经网络激活函数和误差函数的自定义定义。`FCMP`\
  \ 是一种编程工具，您可以结合 SAS 中的深度学习操作使用它，以生成自己的自定义深度学习实体：\n\n* 激活函数\n* 误差函数\n* 模型层变为*学习率策略\n\
  \n自定义的 `FCMP` 网络层、函数和学习率策略是执行不同深度学习任务的独立实体。它们的共同点是，所有自定义层、自定义激活函数和误差函数以及自定义学习率策略都是为了通过\
  \ `FCMP` 用于 SAS 深度学习而创建的。\n\n`FCMP` 操作的参数可以在文档中找到。\n\n### 调整深度学习模型\n\n#### 选择超参数\n\
  \n机器学习算法创建的预测模型的质量取决于控制训练过程和模型结构的各种属性值。代表这些属性的参数称为`hyperparameters`。对于遗传算法或贝叶斯优化方法，搜索深度神经网络的超参数空间可能极其昂贵，因为这些方法需要对每种超参数组合进行训练，直到算法收敛。另一种，`Hyperband`\
  \ 方法（Li 等人，2017）是密集模型结构的一种良好方法，因为资源会自适应地分配给最有前景的候选方案。\n\n#### 采样超参数空间\n\n`dlTune`\
  \ 操作实现了 `Hyperband` 方法，并开始使用 `Latin hypercube sampling`（拉丁超立方采样）选择超参数。相比 `simple\
  \ random`（简单随机），`Latin hypercube sample` 更为优，因为它确保了空间中的点大致等距。\n\n为了避免过拟合，使用留存样本来评估超参数。`dlTune`\
  \ 操作使用 `Hyperband` 方法按比例分配资源。根据 `TUNERETENTION` 属性剔除性能较差的集合。\n\n\n\n\n注意：对于单机服务器上的\
  \ SGD 或分布式服务器上使用单个 worker 的会话，当操作通过一次数据时，即达到一个 epoch。对于使用多个 worker 的会话，当所有 worker\
  \ 均与控制器交换一次权重时，即达到一个 epoch。`syncFreq` 参数指定了每个 worker 在与控制器交换权重之前通过数据的次数。\n\n`TUNEITER`\
  \ 属性指定了运行调优算法的迭代次数。调优算法的每次迭代使用指定的 `maxEpochs` 对所有激活的超参数集进行模型训练。具有最佳验证拟合误差的超参数在未来的调优迭代中将保持激活状态。\n\
  \n`NUMTRIALS` 属性指定了在调优过程开始时尝试的超参数集数量。例如，将该属性指定为 100 将将开始训练 100 个具有不同超参数值的模型。\n\n\
  `TUNERETENTION` 属性决定了每次调优迭代后保留的超参数配置比例。\n\n`TUNERESTART` 指定了重启参数调优过程的次数，使用之前搜索中提供的可用权重以及新选择的参数集。\n\
  \n为 `maxepochs`、`tuneiter`、`numtrials`、`tuneretention` 和 `tunerestart` 选择一组合适的调优值并非易事。一种常见的方法是将\
  \ `maxepochs` 设置为一个较小的值，以便为超参数组合（`numtrials`）分配较大的值。这种方法似乎意味着，对于超参数搜索方法，模型参数估计（权重）的重要性可能低于模型的特征。无论这是否真实，在某些情况下需要采用替代方法。例如，假设你模型当前的迭代图类似于图\
  \ 3.35。\n\n图 3.35：当前迭代图\n\n![](img/Image3363.png)\n\n此时，逻辑上的做法是搜索 `L1` 和 `L2` 正则化值，以降低模型的方差。将\
  \ `maxepochs` 值设置为较小的数（如四），可能会导致过程在性能低下的峰值处评估每个超参数组合的性能，如图 3.36 所示。\n\n图 3.36：将\
  \ Maxepochs 设置为小值\n\n![](img/Image3370.png)\n\n在训练过程的此点评估模型可能会倾向于选择较大的 `L1` 和 `L2`\
  \ 值，因为较大的值会限制权重的增长，这可能导致模型对数据中信息的响应能力降低。这意味着，较大的 `L1` 和 `L2` 值在第四 epoch 似乎具有更优的性能，因为在过程早期观察到的退化会被抑制。但大\
  \ `L1` 和 `L2` 权重值从长期来看真的是模型“最佳”的吗？人们推测答案是“否”，因为模型将难以捕捉数据中可能存在的不那么明显的单一特征。因此，在这个例中，将\
  \ `maxepochs` 设置为较大的值可能是最好的，以避免在训练早期观察到的低性能峰值处评估超参数组合，如图 3.37 所示。\n\n图 3.37：将 Maxepochs\
  \ 设置为较大值\n\n![](img/Image3378.png)\n\n在设置调优参数时，必须考虑业务问题以及模型与数据的交互。\n\n# 第 4 章：目标检测\n\
  \n### 引言\n\n### 目标检测算法类型\n\n## 数据准备与预测概述\n\n### 非归一化数据\n### 归一化位置\n### 多损失误差函数\n\
  ### 误差函数标量\n### 锚框 (Anchor Boxes)\n### 最终卷积层\n\n## 演示：使用 DLPy 访问 SAS 深度学习技术：部分 1\n\
  ## 演示：使用 DLPy 访问 SAS 深度学习技术：部分 2\n\n### 引言\n\n图像分类本身是一个检查通常构图良好的图像的任务，并以描述图像的分类概率作为响应。目标检测比图像分类更高级，因为目标检测分析复杂的图像，这些图像包含位于不同距离和位置、处于变化的且通常带有视觉噪声背景中的多种物体。物体可以出现在视觉帧内的任何位置，远近不等，并且相互重叠。（参见图\
  \ 4.1。）目标检测定位并分类物体，并确定这些物体的边界以及与其他物体的关系。\n\n图 4.1：物体分类\n\n![](img/Image873.jpg)\n\
  \n目标检测是一项挑战性任务，也是计算机视觉中最基础的任务之一。我们使用卷积神经网络（`CNNs`）来执行包括目标识别、目标定位和边界以及目标分类在内的任务。最近，类似的基于\
  \ CNN 的深度学习算法成功解决了与目标检测任务相关的问题：\n\n*   只看一次 (YOLO)\n*   单次多框检测器 (SSD)\n*   区域建议网络\
  \ (R-CNN)\n*   快速区域建议网络 (Faster R-CNN)\n*   目标检测骨干特征提取器 (DETNet)\n\n### 目标检测算法类型\n\
  \n目标检测算法可以分为以下几类。第一类目标检测算法通过预定义尺寸和预定义位置锚框一步寻找物体。这些位置和固定尺寸是经过策略选择的，以覆盖尽可能多的场景。算法通常将原始图像分为固定大小的网格区域。对于每个区域，这些算法尝试使用特定的形状和大小预测固定数量的物体。这一类的算法被称为单阶段方法（single-stage\
  \ methods）。单阶段算法示例包括 `YOLO`、`SSD` 和 `RetinaNet`。此类算法通常运行速度更快，但准确性可能较低。这类算法通常用于需要实时检测的应用。\n\
  \n第二类目标检测算法是涉及两个步骤的区域建议（region proposals）。在区域建议阶段，使用传统的计算机视觉技术（如选择搜索）或基于深度学习的区域建议网络（`RPN`）选择极有可能包含物体的区域。在收集一组候选窗口后，可以使用特定数量的回归模型和分类模型来解决目标检测问题。这一类包括\
  \ `Faster R-CNN`、`R-FCN` 和 `FPN-FRCN` 等算法。此类算法通常被称为双阶段方法（two-stage methods）。它们通常更准确，但往往比单阶段方法慢。\n\
  \nSAS 中的深度学习工具支持两种代表性的目标检测算法：`YOLO` 和 `Faster R-CNN`。`YOLO` 是一种单阶段固定尺寸的目标检测算法。`Faster\
  \ R-CNN` 是一种双阶段、基于区域建议的目标检测算法。\n\n单阶段目标检测器如 `YOLO` 单次分析图像，并输出多个物体位置和分类预测。因此，与 `R-CNNs`\
  \ 等多阶段算法相比，`YOLO` 网络更快。`YOLO` 架构在训练期间还能利用更大的上下文进行图像推理。\n\n\n\n\nYOLO 将单个 CNN 应用于整幅图像，然后将图像划分为区域（通常是\
  \ 13 x 13 的网格单元）。然后，对于每个区域，YOLO 预测固定数量的边界框和相关的物体分类概率。每个区域的锚点框（Anchor boxes）为预测的物体尺寸提供了预设值，而实际预测则会对锚点框进行修正。锚点框通常使用\
  \ k-means 聚类针对给定数据集获取。最终检测结果通过对预测概率应用阈值操作和非极大值抑制（non-maximum suppression）获得。\n\n\
  ## 数据准备与预测概述\n\n模型现在学习的数据已经扩展，包含了描述一个或多个物体空间动态特征的信息。根据所使用的格式，描述物体位置的预测可以通过以下三种方式呈现：\n\
  \n1. `RECT`：使用 `RECT` 格式表示像素单位的坐标 `[xleft, ytop, width, height]`。\n2. `YOLO`：使用\
  \ `YOLO` 格式表示归一化图像尺寸的坐标 `[xMiddle, yMiddle, width, height]`（通过坐标除以图像尺寸获得）。\n3. `COCO`：使用\
  \ `COCO` 格式表示像素单位的坐标 `[xmin, ymin, xmax, ymax]`。\n\n除了描述物体位置的输出变量外，还包含一个描述物体数量的输出变量。本章专注于\
  \ `YOLO` 格式，它包含了四个描述物体位置的归一化变量。值的归一化确保在使用缩放变换时对目标位置的精度损失最小。\n\n* `_Objectn_x` 对应物体的归一化水平位置。\n\
  * `_Objectn_y` 对应物体的归一化垂直位置。\n* `_Objectn_width` 对应边界框的归一化宽度。\n* `_Objectn_height`\
  \ 对应边界框的归一化高度。\n\n### 非归一化数据\n\n在某些情况下，提供的数据不是归一化的。例如，考虑 `xmin`、`xmax`、`ymin` 和\
  \ `ymax` 代表 500x400 图像中未归一化的像素值的情况。归一化值通过将每个 `x` 和 `y` 坐标除以相应平面的最大值计算（即 `xmin/500`、`xmax/500`、`ymin/400`\
  \ 和 `ymax/400`）。\n\n以下方程将归一化的 `xmin`、`xmax`、`ymin` 和 `ymax` 值转换为 YOLO 格式的值值：\n\n\
  ```\n_objectn_x=.5(x min + x max)\n_objectn_y=.5(y min + y max)\n_objectn_width=(x\
  \ max - x min)\n_objectn_height=(y max - y min)\n```\n\n其中 `n` 代表物体编号。\n\n### 归一化位置\n\
  \n考虑下面的示例，图 4.2 中感兴趣的物体是一个正在钓鱼的人。二维图像中的像素代表 X 轴和 Y 轴网格上的坐标。网格本身可以被视为图像的归一化表示，其中左上角的像素坐标为\
  \ (0,0)，右下角的像素坐标为 (1,1)。变量 `_objectn_x` 和 `_objectn_y` 提供了物体的归一化原点。例如，该渔民位于 X 轴末端值方向约\
  \ 70.5% 处。\n\n图 4.2：归一化位置，`objectn_x` 和 `objectn_y`\n\n![](img/Image881.jpg)\n\n\
  这意味着渔民的原点位于图像右侧的 70.5% 处。同样，渔民位于 Y 轴末端值方向的 73% 处（即从上到下的距离的 73%）。`_objectn_x` 和 `_objectn_y`\
  \ 的组合提供了渔民的归一化原点。\n\n变量 `_objectn_width` 和 `_objectn_height` 提供了物体各自的归一化宽度和高度，如图\
  \ 4.3 所示。物体的原点（在本例中为渔民的原点）位于框的中心。这意味着宽度和高度从渔民的原点向等距离距离延伸。\n\n图 4.3：归一化位置，`objectn_width`\
  \ 和 `objectn_height`\n\n![](img/Image890.jpg)\n\n注意，框的宽度大约是图像宽度的 10%，边界框的高度约为图片高度的四分之一，即\
  \ 23%。\n\n### 多损失误差函数\n\nYOLOv2 的多损失函数结合了多个误差函数，并尝试平衡模型在分类和定位预测任务之间的关注点。预测任务关注以下四个领域：\n\
  \n* 边界框误差 ![](img/ML1Eq.jpg)\n* `+ 真置信度误差` ![](img/ML2Eq.jpg)\n* `+ 假置信度误差` ![](img/ML3Eq.jpg)\n\
  * `+ 分类误差` ![](img/ML4Eq.jpg)\n\n如图 4.4 所示，图像被分为 S x S 的单元格矩阵。在每个单元格中，都会预测多个边界框\
  \ ![](img/Image898.png)。每个预测都包含边界框的中心位置、边界框误差的宽度和高度、预测为物体的概率（真置信和假置信误差的来源）以及分类概率（分类误差的来源）。预测的边界框数量由锚点框的数量决定。锚点框将在后文中讨论。![](img/Image905.png)\
  \ 如果预测 ![](img/Image913.png) 正确，则值为 1。\n\n图 4.4：YOLOv2 多损失误差函数\n\n![](img/Image969.jpg)\n\
  \n如果单元格不包含感兴趣的物体，则 ![](img/Image976.png)，多损失函数变为简单的平方误差函数：![](img/Image984.png)，其中\
  \ ![](img/Image991.png) 代表单元格内预测 ![](img/Image913.png) 为物体的概率。如果单元格包含感兴趣的物体，则 ![](img/Image1014.png)，多损失函数下降\
  \ ![](img/Image1023.png) 并简化为：![](img/Image1034.png)，其中 ![](img/Image1046.png) 代表相对于锚点框的坐标偏移，而\
  \ ![](img/Image1056.png) 代表该预测所负责的标注物体边界框的坐标偏移。\n\n\n\n\n标量（Scalars）用于通过强调特定预测而非其他预测来微调预测。例如，《You\
  \ Only Look Once: Unified, Real-Time Object Detection》的作者发现，置信度预测得分被向零压缩，因为不包含对象的网格数量远大于包含对象的网格数量。因此，作者使用了较低的标量（即\
  \ 0.5）来抵消大多数网格单元缺乏对象的问题。作者进一步通过较高的标量（即 5）来调整预测，以增加边界框预测的权重（Redmon et al. 2016）。\n\
  \n在多损失误差函数中更改标量会强制模型在各种预测任务之间进行权衡。例如，增加 `COORDSCALE` 会导致优化过程强调边界框的预测，而以削弱置信度和分类预测为代价。该标量通过最后一个\
  \ `ADDLAYER` 语句创建的目标检测层中的 `COORDSCALE=` 选项进行调整。\n\n以下是 `COORDSCALE=` 在 `ADDLAYER`\
  \ 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’\
  \ layer={type=’detection’\n```\n```\n           coordScale = 5\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示\
  \ ***/\n```\n```\nrun;\n```\n\n增加 `COORDSCALE` 会提高模型对对象的感知能力，但代价是误检率的增加。该标量通过最后一个\
  \ `ADDLAYER` 语句创建的目标检测层中的 `OBJECTSCALE=` 选项进行调整。\n\n以下是 `OBJECTSCALE=` 在 `ADDLAYER`\
  \ 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’\
  \ layer={type=’detection’\n```\n```\n           coordScale = 5\n```\n```\n     \
  \      objectScale = 1\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示 ***/\n```\n```\nrun;\n\
  ```\n\n增加 `PREDICTIONNOTAOBJECTSCALE` 会使模型在检测对象时更加谨慎。如果给标量分配较大的值，图片中存在的对象可能会被遗漏。\n\
  \n该标量通过最后一个 `ADDLAYER` 语句创建的目标检测层中的 `PREDICTIONNOTAOBJECTSCALE=` 选项进行调整。\n\n以下是\
  \ `PREDICTIONNOTAOBJECTSCALE=` 在 `ADDLAYER` 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n\
  ```\n```\n           name=’output_object_dectect’ layer={type=’detection’\n```\n\
  ```\n           coordScale = 5\n```\n```\n           objectScale = 1\n```\n```\n\
  \           predictionNotAObjectScale = .25\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示\
  \ ***/\n```\n```\nrun;\n```\n\n增加 `CLASSSCALE` 会鼓励模型更多关注正确预测对象，而不是对象在图像中的位置。该标量通过最后一个\
  \ `ADDLAYER` 语句创建的目标检测层中的 `CLASSSCALE=` 选项进行调整。\n\n以下是 `CLASSSCALE=` 在 `ADDLAYER`\
  \ 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’\
  \ layer={type=’detection’\n```\n```\n           coordScale = 5\n```\n```\n     \
  \      objectScale = 1\n```\n```\n           predictionNotAObjectScale = .25\n```\n\
  ```\n           classScale = 1\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示 ***/\n```\n\
  ```\nrun;\n```\n\n注意：如果业务需求是检测单个对象，则应将 `CLASSSCALE=` 设置为零。这意味着没有对象在竞争模型的注意力。\n\n\
  ### 锚点框 (Anchor Boxes)\n\n锚点框为边界框预测提供了一组候选起点。包含多个不同尺寸的锚点框可以减少优化过程调整边界框坐标的需求，因为产生与对象紧密匹配的起始框的概率会增加。这意味着显著波动和起始误差的减少。\n\
  \n每个锚点框本身都是一个候选预测。候选预测（锚点框）必须满足两个标准才能成为实际预测。首先，预测为对象的概率应大于或等于由 `DETECTIONTHRESHOLD=`\
  \ 属性设置的阈值值。\n\n以下是 `DETECTIONTHRESHOLD=` 在 `ADDLAYER` 语句中的实现示例：\n\n```\nAddLayer\
  \ / model=’ObjectDetection’\n```\n```\n           name=’output_object_dectect’ layer={type=’detection’\n\
  ```\n```\n           coordScale = 5\n```\n```\n           objectScale = 1\n```\n\
  ```\n           predictionNotAObjectScale = .25\n```\n```\n           classScale\
  \ = 1\n```\n```\n           detectionThreshold = 0.15\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示\
  \ ***/\n```\n```\nrun;\n```\n\n上述代码中将概率阈值设置为 15%。这意味着候选预测（锚点框）至少应具有 15% 的概率才会被考虑。\n\
  \n达到或超过阈值的预测将通过候选预测与实际边界框之间的交并比（IOU）进行评估。达到或超过 `IOUTRESHOLD=` 属性设置的 IOU 阈值的预测将成为预测。\n\
  \n以下是 `IOUTRESHOLD=` 在 `ADDLAYER` 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n\
  ```\n```\n           name=’output_object_dectect’ layer={type=’detection’\n```\n\
  ```\n           coordScale = 5\n```\n```\n           objectScale = 1\n```\n```\n\
  \           predictionNotAObjectScale = .25\n```\n```\n           classScale = 1\n\
  ```\n```\n           detectionThreshold = 0.15\n```\n```\n           iouThreshold\
  \ = 0.1\n```\n```\n /***剩余代码未显示，但将在章节后介绍主题时显示 ***/\n```\n```\nrun;\n```\n\n上述代码中将\
  \ IOU 阈值设置为 10%。这意味着候选预测（锚点框）至少应具有 10% 的 IOU 值才能成为预测。\n\n锚点框的合适数量大小最好通过实验方法确定。应用于训练数据的聚类算法可以引导用户确定合适的锚点框数量和尺寸。先尺寸可以通过对边界框的像素宽度和高度进行聚类来实验确定。每个类的平均宽度和高度应对应原始图像进行等效下采样。例如，从\
  \ 416x416 图像变为 13x13 的张量意味着数据被下采样了 32 倍。\n\nSAS 软件包含了丰富的聚类算法用于根据框的高度和宽度进行分组。每组的平均高度和宽度应以模型缩小图像的相同比例除除。例如，416x416\
  \ 的图像缩小到 13x13 缩小了 32 倍。`ANCHORS=` 属性指定了锚点框的数量和尺寸。每个锚点框需要两个数值。第一个值代表锚点框的宽度，第二个值代表同一框的高度。\n\
  \n以下是 `ANCHORS=` 在 `ADDLAYER` 语句中的实现示例：\n\n```\nAddLayer / model=’ObjectDetection’\n\
  ```\n\n\n\n\n```\nname=’output_object_dectect’ layer={type=’detection’}\n```\n\n\
  ```\ncoordScale = 5\n```\n\n```\nobjectScale = 1\n```\n\n```\npredictionNotAObjectScale\
  \ = .25\n```\n\n```\nclassScale = 1\n```\n\n```\ndetectionThreshold = 0.15\n```\n\
  \n```\niouThreshold = 0.1\n```\n\n```\nanchors ={10.71475, 10.43283,\n```\n\n```\n\
  5.139861, 11.92218}\n```\n\n上面的代码示例创建了两个分别是方形和矩形形状的锚框。\n\n 最后的卷积层\n\n对 CNN 最后一层的输出以及目标检测层参数有一些要求。\n\
  \n在最后一个卷积层中，输出的宽度和高度都应该等于 `gridNumber` 的值。输出的深度应该为通过 `predictionsPerGrid * (classNumber\
  \ + coordNumber + 1)` 计算的值。\n\n`gridNumber`、`predictionsPerGrid`、`classNumber` 和\
  \ `coordNumber` 都是检测层中的参数。检测层是目标检测模型的输出层。\n\n可以使用许多不同类型的代码编辑器访问 SAS 深度学习技术。SAS Studio\
