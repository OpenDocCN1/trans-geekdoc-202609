    分子机器学习的成功取决于它们所使用的表征。目前广泛使用的基于分子电子结构的图-化学-化学属性（图 1a）可解释性非常有限。然而，通过预测轨道相互作用的长度和强度来计算分子结构的量子力学属性的成本很高。这种立体电子信息提供了宝贵的化学洞察。例如，成键轨道与非键轨道之间的相互作用对于理解某些化学机制（如有机催化²）至关重要。立体电子信息的价值表明，将其纳入分子表征可以提高性能，并在训练和推理过程中避免昂贵的操作。这项工作引入了一种基于分子图的新表征，其中节点代表原子，它们在三维（3D）空间中的相互作用。我们描述了如何从自然分子表征（SIMD*）构建
    SIMG（注入立体电子的图）以进行快速预测。我们研究了这些表征作为消息传递二维机器学习算法输入的益处，以改进分子属性预测，以及 SIMG 在各种难以进行量子化学计算的系统中识别立体电子相互作用的能力，提供了此前无法获取的化学洞察。


    NBO 分析提供了 3D 结构以及波函数的清晰取值和描述（图 1b）。NBO 产生了一组局域原子轨道、成键/非键轨道，以及通过 Hartree–Hückel
    量子方法与分子属性的某种相互作用。在这项工作中，我们的目标是建立一种新的机器学习表征，实现三个基本目标：(1) 与标准分子图相比，增强下游模型的性能；(2)
    包含我们对分子结构是 3D 对象的理解；以及(3) 对人类可解释。


