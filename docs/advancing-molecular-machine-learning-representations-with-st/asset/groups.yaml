  mdcn: "\n\n# 论文\n\nhttps://doi.org/10.1038/s41586-020-01031-9\n\n使用了丢弃批层（dropout\
    \ batch layers）。随后将拼接后的输出输入到单层 MLP 中以构建整体架构。\n\n该架构旨在解决图网络的过度平滑（over-smoothing）问题。当多个图神经网络层堆叠时，会出现这个问题，导致计算图几乎相同。对于图级任务，过度平滑可能不是严重问题，但在执行节点网络任务时是一个问题。\n\
    \n## 演化器 (The evolver)\n\n学习不同目标的问题可以通过在损失函数中强制排列不变性（permutation invariance）并让模型预测不同的特征来解决。第一部分可以通过匹配模型的预测与目标来实现。第二部分可以通过向模型中引入随机性来解决（例如，为每个节点随机初始化状态）。\n\
    \n所有任务的 MLP 遵循相同的架构：一层 ReLU、一层批归一化和一层线性层。以下方程描述了这些网络任务的输入和输出函数。\n\n为了计算此函数，我们需要找到损失值最小的排列。考虑所有可能的排列是不可能的，其时间复杂度为\
    \ O(n!)。为了提高高效性，只选择了某些对。然后，在每组节点内部，迭代地随机交换节点。\n\n```\n$L = L_x + L_y + L_z + L_l$\n\
    ```\n\n最直接的方法是求解单个节点的预测。对于每类节点，仅使用一个网络。损失函数被定义为每个任务相应的损失。回归任务使用均方误差 (m.s.e.)，分类任务使用二元交叉熵\
    \ (BCE) 损失。该函数使用 m.s.e. 进行优化，这也是该类任务的关键指标。还计算了 $R^2$ 分。\n\n所有对 NBO 节点的预测都基于神经网络的嵌入（embeddings）。为了引入随机性，最直接的方法是随机初始化隐藏状态，然后使用\
    \ GMN 嵌入进行解码。进行预测时，挑战在于不同的嵌入需要足够相似以产生相同的预测。为了解决这个问题，我们利用了其他节点的存在。\n\n```\n$L_y\
    \ = m.s.e(y, \\hat{y}) = BCE(y, \\hat{y})$\n```\n\n原子级目标预测。某些键键特征与每个原子有关。为了预测它们，我们强制执行排列不变性。该任务通过拼接原子和键的嵌入并将它们通过\
    \ MLP 来解决。极化值预测使用 m.s.e. 优化。其他则使用交叉熵损失优化。与之前的方法类似，并使用 $R^2$ 分来控制训练。\n\n链路预测方法。从分子结构中无法获得轨道相互作用，因此我们应该首先预测它们。首先，将问题表述为链路预测任务。这是可能的，因为某些情况下从数据集中采样了负样本，以及键和链路对的负组合。此外，预测是至关重要的（因为它描述了供体-受体对，而不是顶点输入）。数据由节点嵌入和键特征的拼接组成。我们使用交叉熵损失训练了网络。计算了准确率、精确率、召回率、F1\
    \ 分和 AUC 等分类指标。\n\n# 数据可用性\n\n数据和模型权重可在 https://huggingface.co/gomesgroup/sim\
    \ 获取。\n\n# 代码可用性\n\n代码可在 https://github.com/gomesgroup/sim 获取，它被用于探索我们分子系统的电子结构信息。\n\
    \n```\n$L_y = m.s.e(y, \\hat{y})$\n```\n\n边相互作用目标预测。预测可以作为网络相互作用目标预测的输入。特征通过拼接嵌入和动力学获得并计算成对特征。我们使用\
    \ m.s.e. 损失训练了网络。\n\n# 参考文献\n\n- 1. Hoffmann, R. & Razlo, P. Representation in\
    \ chemistry. Angew. Chem. Ed. 39, 1-16, (1991).\n- 2. Cooke, H. structural studies\
    \ of formation of organic chemistry. Org. Biol. Chem. 22, 115-120.\n- 3. Springer,\
    \ M. Improving students' understanding of molecular structure through branch-based\
    \ use of models in undergraduate organic chemistry literature. J. Chem. Ed. 91,\
    \ 1662-1668 (2014).\n- 4. Gomes Dornelli, R. et al. Design of efficient organic\
    \ light-emitting diodes by a high-throughput virtual screening and experimental\
    \ approach. Nat. Mater. 15, 1220-1227 (2016).\n\nNature Intelligence | Volume\
    \ | 2025 | Pages 771-781\n\n779\n\n 文章\n\nhttps://doi.org/10.1038/s41586-020-01031-9\n\
    \n- Zharov, A. et al.. kinases enable rapid identification of potent DDR1 inhibitors.\
    \ Nat. Biotechnol. 37, 1038–1040 (2021).\n- Baer, S., Dhamerja, S., Sadav, J.,\
    \ Babu, S., Cam, M. & Ahsan, M. Machine learning in drug discovery: A review.\
