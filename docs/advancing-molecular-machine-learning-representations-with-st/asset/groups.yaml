    # Article


    https://doi.org/10.1038/s41586-020-01031-9


    of the dropout batch layers were used. Concatenated outputs were then fed into
    an MLP with single layer to construct the overall architecture.


    This architecture is designed to tackle the over-smoothing issues of graph networks.
    The problems arise when multiple graph neural layers are stacked, making the computational
    graph nearly identical. Over-smoothing might not be a severe issue for graph-level
    tasks, but it is an important issue in performing node network tasks.


    The evolver

    The problem of learning different targets for nodes can be solved by enforcing
    permutation invariance in the loss function and making the model predict different
    features. The first part can be achieved by matching the model''s predictions
    and targets. The second part can be solved by introducing randomness into the
    model (for example, by randomly initializing states for each node).


    All MLPs for tasks follow the same architecture: one layer, the ReLU, the batch
    normalization and one linear layer. The following equations describe input and
    output functions for these network tasks.


    To compute this function, we need to find a permutation with the least value of
    loss. Considering all possible permutations is impossible, which has O(n!) time
    complexity. To make it efficiently, only certain pairs are selected. Then, within
    each group of nodes, we randomly swap nodes iteratively.


    ```

    $L = L_x + L_y + L_z + L_l$

    ```


    The most straightforward way is to solve the prediction for individual nodes.
    For each type of nodes, only one network is used. The loss function was defined
    as the appropriate loss for each task. The mean squared error (m.s.e.) was used
    for regression tasks and binary cross-entropy (BCE) loss for classification tasks.
    The function was optimized with m.s.e. which was also the key metric for this
    type of task. $R^2$ scores were also calculated.


    All predictions for the NBO nodes are based on the embeddings of the neural network.
    To introduce randomness, the most straightforward way is to randomly initialize
    hidden states and then decode with GMN embeddings. To make predictions, it is
    a challenge that different embeddings will be similar enough to result in the
    same prediction. To solve this, we use the existence of other nodes.


    ```

    $L_y = m.s.e(y, \hat{y}) = BCE(y, \hat{y})$

    ```


    Atom-wise target prediction. Some bond features are related to each of the atoms.
    To predict them we enforce permutation invariance. The task was solved by concatenating
    embeddings of atom and bond and passing them in the MLP. Polarization value prediction
    was optimized with m.s.e. Others were optimized with cross-entropy loss. Similar
    to the previous method, and the $R^2$ score were used to control the training.


    Link prediction approach. Orbital interactions are not available from the molecular
    structure, so we should predict them first. First, the problem was formulated
    as a link prediction task. This is possible because there are cases, where negative
    examples were sampled from the dataset, while negative combinations of bonds and
    link pairs. Moreover, the prediction is essential (as it describes the donor-acceptor
    pair but not vertex input). The data is constructed of concatenated embeddings
    of nodes and bond features. We trained the network with cross-entropy loss. The
    classification metrics were calculated for accuracy, precision, recall, F1 score
    and AUC.


    # Data availability


    The data and model weights are available at https://huggingface.co/gomesgroup/sim


    # Code availability


    A code is available at https://github.com/gomesgroup/sim, where it is used to
    explore electronic structure information of our molecular systems.


    ```

    $L_y = m.s.e(y, \hat{y})$

    ```


    Edge interaction target prediction. Predictions can be used as input to the network
    for interaction target prediction. The features were obtained by concatenating
    embeddings and dynamics and calculated pairwise features. We trained the network
    with m.s.e. loss.


