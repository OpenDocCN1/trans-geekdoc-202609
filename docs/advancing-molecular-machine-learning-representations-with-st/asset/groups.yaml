    # 自然机器智能 (Nature Machine Intelligence)


    文章 https://doi.org/10.1038/s42256-025-01031-9


    # 通过注入立体电子效应的分子图推进分子机器学习表示


    接收于：2024年8月9日

    接受于：2025年4月3日

    发表于：2025年5月23日


    Daniil A. Boiko¹, Richard Reschütützger², Benjamin Sanchez-Lengeling³,8,9 ✉

    Samuel M. Blau⁴ ✉ & Gabe Gomes ⁵,⁶,⁷ ✉


    分子表征是理解物理世界的关键元素，也是现代分子机器学习的基础。以往的分子机器学习模型使用了字符串、指纹、全局特征和分子图，这些在本质上都是信息稀疏的表征方式。然而，随着预测任务复杂性的增加，分子表征需要编码更高保真的信息。这项工作引入了一种新方法，通过立体电子效应将量子化学信息注入分子图中，从而增强了其的表达能力和可解释性。通过定制的双图网络工作流学习预测注入立体电子效应的表征，使其能够应用于下游分子机器学习任务，而无需昂贵的量子化学计算。我们证明，显式添加立体电子信息显著提高了消息传递二维机器学习模型在分子属性预测中的性能。我们展示了在小分子上学习的表征可以准确外推到更大的分子结构，为蛋白质等实际上无法处理的系统提供了轨道相互作用的化学洞察，为分子设计开辟了新途径。最后，我们开发了一个应用程序（simg.chem.cmu.edu），用户可以在其中获取自己分子系统的表征。


    分子表征是化学的基石¹²。化学家的直觉通过骨架结构捕捉了化学的通用语言。它们能够捕捉（大多数有机）分子的广泛多样性，在保持简单性的同时让人类更容易识别模式。除了我们思考和描述的化学知识³之外，这些表征正证明分子机器学习的进步，该技术已用于各种应用。


    机器学习在类环境中最成功的应用之一是分子属性预测，这是化学、生物和材料科学的核心。从用于创纪录性新药开发的材料发现¹⁰，分子机器学习通过实现快速推理严重影响了该行业。分子表征的性能（被认为是成功的最关键因素）仍存在争议。目前的方法如分子图⁵将结构表示为序列和编码共价键信息的图¹¹，提供了拓扑信息（局部的）。也有方法将空间特征注入到后期的表征中，即结构信息¹¹。最近的方法探索了将力场表示与分子结构相结合如何能够同时预测结构和电子属性¹。一些重要的表征¹⁷扩展或改进了库仑矩阵特征值¹⁸。最后，表征的选择与分子架构和设计处理密切相关。许多方法，例如通过对多个坐标系进行平均⁹，这种方法的方法在
    AlphaFold 3（参考 19）中使用，或者可能在模型层面进行更改。


    所属单位完整列表见页末。✉ smblau@ibl.gov; gabegomes@cmu.edu


