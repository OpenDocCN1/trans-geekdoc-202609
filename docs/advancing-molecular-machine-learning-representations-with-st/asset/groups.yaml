    Daniil A. Boiko¹, Richard Reschütützger², Benjamin Sanchez-Lengeling³,8,9 ✉

    Samuel M. Blau⁴ ✉ & Gabe Gomes ⁵,⁶,⁷ ✉


    Molecular representation is a critical element in understanding of the physical
    world and the foundation for modern molecular machine learning. Previous molecular
    machine learning models have used strings, fingerprints, global features and molecular
    graphs that are inherently information-sparse representations. However, as the
    complexity of prediction tasks increases, the molecular representation needs to
    encode higher fidelity information. This work introduces a new approach to infuse
    quantum-chemical information into molecular graphs via stereoelectronic effects,
    enhancing expressivity and interpretability. Learning to predict the stereoelect-infused
    representation with a tailored double graph network workflow enables its application
    to a downstream molecular machine learning task without expensive quantum-chemical
    calculations. We show that the explicit addition of stereoelectronic information
    substantially improves the performance of messaging-two-dimensional machine learning
    models for molecular property prediction. We show that the learned representations
    on small molecules can accurately extrapolate to much larger molecular structures,
    yielding chemical insight into orbital interactions for practically intractable
    systems, such as proteins, opening new avenues of molecular design. Finally, we
    have developed a web application (simg.chem.cmu.edu) where users can capture representations
    for their own molecular systems.


