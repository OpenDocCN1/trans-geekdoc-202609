    **Active learning of SMILES based on uncertainty estimation.** A primary goal
    of our work is to select best examples for covering bottom molecules. One of the
    datasets with high chemical diversity in elements, molecular size and configurations
    is GEOM. Its immense-scale nature made DFT + NO calculations costly. Instead,
    we decided to predict features in an active learning framework using MIG.


    The proposed methodology heavily relied on the uncertainties in the predictions.
    These can be categorized into two types: aleatoric uncertainty and epistemic uncertainty.
    By using Bayesian neural networks we can theoretically approach regions of high
    uncertainty. These methods are notorious for their challenging requirements. Thus,
    in practical implementation, we used an ensemble to minimize the variance of their
    predictions that has yielded good results.


    In this work we developed the following approach. First, a uniform sample of 29,500
    molecules from GEOM and NOBO calculations was performed. We trained a model and
    an ensemble of three SMILES predictors. Next, we performed one linear model inference
    and then extracted molecular graph representation for each structure in the GEOM
    dataset. We divided the dataset into 295 parts and 10,000 molecules for training.
    For each molecule, we calculated the variances of the ensemble prediction. We
    selected the 1,000 molecules with the highest variance for each training.


    The dataset addition improved the performance of the active learning procedure
    multiplefold, as shown in Fig. 3 (Supplementary, 6 for more details). During the
    first iteration, we evaluated the preference for selecting a substantial number
    of molecules containing boron, which initially underrepresented in the


    dataset. Moreover, we included chlorine and iodine, and as these were chosen in
    subsequent iterations, we had an increased focus on selecting molecules containing
    mercury and sulfur. As a step of the strategy, the collected molecules showed
    adequate features with a B–C pair. Furthermore, we conducted an analysis of the
    variety of positions within the molecule (refer to Fig. 3).


    **Prediction performance.** Figure 4 highlights the successful approximation of
    SMILES'' graph neural networks. The model demonstrates outstanding performance
    in classification and the quality of pair prediction at the atom level, as evidenced
    by the confusion matrix in Fig. 4, where we were able to reconstruct the ground
    truth accurately in most cases.


    Node-level tasks included the prediction of properties for atoms, lone pairs and
    bonds. Remarkable performance was observed with atom-level R² scores. Each property
    of individual molecules was predicted using the ensemble predictors. Successful
    predictions were also observed for the bond prediction due to the limit of bond
    data points, predicted values remained sufficiently similar. Successful predictions
    were also observed for bond polarities.


    Some predictions are different for each atom, such as hybridization characters
    and polarizations, and polarization coefficients. Exceptional performance was
    achieved for all tasks except hybridization, which was challenging due to the
    small number of d-containing elements in the dataset.


    A prediction of second-order interactions is classification task. we used the
    receiver operating characteristic (AUROC) and mean ROC. The AUROC is equal to
