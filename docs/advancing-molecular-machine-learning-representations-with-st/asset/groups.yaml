    机器学习是药物和材料发现、催化剂优化以及研究生物过程的重要组成部分。将量子化学特征融合到分子表示中将增加模型的解释性，并为研究电子结构与分子性质之间的关系提供机会。预测的轨道信息可以用于分析系统的化学活性。


