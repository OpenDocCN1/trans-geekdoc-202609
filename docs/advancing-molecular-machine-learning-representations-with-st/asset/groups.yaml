    # 孤对预测


    任务有许多定义孤对数量的方法，我们认为数据驱动模型在这种情况下非常合适。NBO 分析提供了关于占据情况的信息，总计五个特征。


    轨道（二阶）相互作用。这些代表了供体和受体轨道之间的相互作用。由孤对和化学键表示供体是富电子的；由空原子轨道表示受体，我们的基础图将这些供体-受体相互作用表示为节点之间的连接。NBO
