    密度泛函理论（DFT）的更多细节见方法部分。在后续章节中，我们将讨论 QMAP NBO 数据（数据属性和近似）或 GEOM 数据（演化模块、主动学习、蛋白质应用和属性预测）的结论。我们开发了自己的大型分子基准测试数据集。


