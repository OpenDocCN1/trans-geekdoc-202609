    **用于神经网络的 SIMG 代理** 为 SIMG 构建计算 NBO 数据需要大量时间，限制了在分子结构和构象的大数据集上使用此类图。对于较大的分子，此类技术是不可行的，因为
    NBO 可以计算的基函数数量存在限制。我们使用代理结构，这种策略严重限制了我们研究此类系统。在这里，我们的目标是开发一种从分子模型（例如原子坐标）快速预测
