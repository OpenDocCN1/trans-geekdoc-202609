    两个任务都与消息传递 GNN 协同训练。优化器通过消息传递方案使用多种聚合函数。编码器通过堆叠若干层并通过 ReLU 激活层构建。节点嵌入与输入进行残差连接。最后，结果是分子感知的表示，它由两个层组成。


