    ![](img/add6c23c4952463c5c122678a2f96561_3_2.png)


    **图. 1** 主动学习方法用于选择额外的 NBO 数据以生成模型。a. b 的概述，计算出的特征，用于分析化学位移变化以及通过主动学习程序的数据获取。c.
    渐进式知识获取。


    基于图神经网络（GNN）的编码器（图 2b）。这些隐藏状态的输出使用图注意力层，并包含了解决过度平滑问题的连接（细节见方法部分）。编码器的输出是图中每个节点的一组嵌入（embeddings）。我们使用了两种提出的方法从这些嵌入中提取
    NBO，这是因为存在以下挑战：原子对和键的类型具有不同的目标。例如，氟原子有一个具有两个孤电子对的原子：一个 p 轨道和一个 s-3d 杂化孤电子对。左侧的伙伴可以参与氢键和其他非共价相互作用的形成，但输入和输出是相同的。我们提出了两种方法来解决这个问题：


    - (1) 赋值使得特征理想模型成为可能。这是通过建立一个孤电子对模型来预测孤电子对主要的 p 或 s 特性来实现的（细节见方法部分）。

    - (2) 随机隐藏状态并对这些隐藏状态进行更新。这是通过编码器模块的五个块（图 2d）实现的，该模块利用节点预测结合置换不变损失函数来更新这些隐藏状态（详细描述请见方法部分和补充图
    2）。


    这两种方法的效果都优于没有整合信息的基准模型（对比见补充图 4 和 5）。尽管该方法的效率远低于增强不同的特征，但它要通用得多。


    编码器模块执行的操作是隐藏状态的迭代更新。因此，我们可以研究嵌入如何随迭代变化。图……分别按元素和时间步（更具体的请见补充图……）。


