    # 讨论


    我们提出了 SimGC：一种新型分子学习表示法，它结合了超越经典结构的量子化学见解，增强了可解释性。SimGC 在下游基准测试中的表现显著优于传统方法，例如用于属性预测的传递-2D
    GNN。此外，我们展示了我们的表示如何通过图神经网络进行近似，从而产生 SimGC。我们进一步证明了 SimGC 模型可以在小规模数据上进行预测，在 DFT
    计算昂贵或完全无法处理的情况下，从分子相互作用信息中快速获取化学见解。


