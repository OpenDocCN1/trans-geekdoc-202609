    **Active learning of SMILES based on uncertainty estimation.** A primary goal
    of our work is to select best examples for covering bottom molecules. One of the
    datasets with high chemical diversity in elements, molecular size and configurations
    is GEOM. Its immense-scale nature made DFT + NO calculations costly. Instead,
    we decided to predict features in an active learning framework using MIG.


    The proposed methodology heavily relied on the uncertainties in the predictions.
    These can be categorized into two types: aleatoric uncertainty and epistemic uncertainty.
    By using Bayesian neural networks we can theoretically approach regions of high
    uncertainty. These methods are notorious for their challenging requirements. Thus,
    in practical implementation, we used an ensemble to minimize the variance of their
    predictions that has yielded good results.


    In this work we developed the following approach. First, a uniform sample of 29,500
    molecules from GEOM and NOBO calculations was performed. We trained a model and
    an ensemble of three SMILES predictors. Next, we performed one linear model inference
    and then extracted molecular graph representation for each structure in the GEOM
    dataset. We divided the dataset into 295 parts and 10,000 molecules for training.
    For each molecule, we calculated the variances of the ensemble prediction. We
    selected the 1,000 molecules with the highest variance for each training.


