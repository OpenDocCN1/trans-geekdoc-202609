    The problem of learning different targets for nodes can be solved by enforcing
    permutation invariance in the loss function and making the model predict different
    features. The first part can be achieved by matching the model''s predictions
    and targets. The second part can be solved by introducing randomness into the
    model (for example, by randomly initializing states for each node).


