    the wide diversity of (mostly organic) molecules, preserving simplicity and making
    it easier for humans to recognize patterns. In addition to the chemistry we think
    about and described³, these representations are proving advances in molecular
    machine learning, which has been used for various applications.


    One of the most successful applications of machine learning in such settings is
    the prediction of molecular properties, which is at the core of chemical, biological
    and material sciences. From the discovery


