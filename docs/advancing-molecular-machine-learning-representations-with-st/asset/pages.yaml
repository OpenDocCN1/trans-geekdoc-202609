    # Discussion


    We proposed SimGC: a type of new molecular learning representation that incorporates
    quantum-chemical insights beyond classical structures, enhancing interpretability.
    SimGCs substantially perform better on downstream benchmarks than traditional
    methods, such as passing-2D GNNs for property prediction. Moreover, we showed
    how our representation can be approximated with graph neural networks, yielding
    SimGCs. We further demonstrated that the SimGC model can be predicted on small-scale
    data to provide rapid access to chemical insight from molecular interaction information
    where DFT calculations are expensive or completely intractable.


    Lone pair features. Orbital hybridization is represented by the s, p, d and characters.
    The NBO analysis provides information about occupancy, summing up to five features.


    Orbital (second-order) interactions. These represent the interactions between
    donor and acceptor orbitals. Donors, represented by lone pairs and bonds, are
    electron rich; acceptors, represented by empty atomic orbitals, our ground-graph
    represents these donor-acceptor interactions as a connection between the nodes.
    The NBO analysis quantifies these interactions by perturbation energy, energy
    density and the Fock matrix method, with a total of three targets.


    # Model implementation and training


    All experiments were implemented using PyTorch framework. Training and metric
    collection were implemented using PyTorch Lightning. Our code is available at
    https://github.com/groupsys/grouping.


    # Model limitation and considerations


    In our representations, element one-hot encoded, so we need another element to
    encode NBO analysis data for each element. This element could be surrounded by
    the physical properties of elements features, but it requires further. The work
    presented is not limited to overall, closed-shell molecular structures, but we
    are in the process of extending the approach to radical and open-shell species.


    # Lone pair prediction


    Tasks have many ways to define the number of lone pairs, we argue that a data-driven
    model is well suited in this case since it can interpret different contexts. With
    this, we build a neural network capable of predicting the atom''s number of lone
    pairs and their types. Such types were used to distinguish lone pairs of the same
    atom, as there are differences in their NBO data. Therefore, we determine the
    types by an analytical threshold and s'' characteristics, expressing the likelihood
    conjugation of a lone pair. The threshold is defined by the inequality:


    > P_character < 80


    Indeed, this represents the likelihood conjugation of a lone pair. In turn, we
    train the neural network to predict how many pairs satisfy the threshold.


    # Graph encoder.


    Both tasks were trained in tandem with a message-passing GNN. The optimizer uses
    multiple aggregation functions through the message-passing scheme, along with
    residual connections. The encoder is constructed by stacking several layers followed
    by a ReLU (rectified unit) activation function. Node embeddings are connected
    with the residual connection from the input graph. Finally, the result is a representation
    of the molecular perception, which is composed of two layers by a ReLU activation.


    # Broader impacts


    Machine learning is a critical component of drug and material discovery, catalyst
    optimization and valuable tool for studying complex biochemical processes. Fusion
    of quantum-chemical features into graph representations for molecular learning
    will increase the interpretability of models and open opportunities to research
    the relationship between electronic structure and molecular properties. The predicted
    orbital information can be used to analyse chemical reactivity in a wide range
    of systems—¹.


    Training. In this case, we framed both tasks as node-level classification, in
    which each class represents the number of lone pairs and how many satisfy the
