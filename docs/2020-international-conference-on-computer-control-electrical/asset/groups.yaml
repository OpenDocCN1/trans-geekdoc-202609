  - '[PAGE 1]


    # II. PREVIOUS WORK


    Many of previous studies on applying different technologies in agriculture have
    been done in order to increase productivity and facilitating agricultural processes.


    In this study [2] precision agriculture is to provide the right amount of resources
    such as water, light and pesticides, and how to provide these resources for each
    duration of time. The implementation of the features for precision agriculture
    is done by sensing all resources from the drone and taking the appropriate decision
    to control the actuators. Actuators such as soil moisture, temperature, humidity,
    and light intensity are also used in this system to send data to thinkcloud, and
    an android application is developed.


    This study [5] proposed an embedded based system for soil monitoring and irrigation
    of the field and get information via a mobile application to help farmers increase
    the agriculture production. The system gets information from various sensors through
    the WiFi and provides it in real time which can then automate a crop that suits
    the soil. An automated irrigation system that switches ON or OFF based on the
    soil moisture. This system, it controls the crop and helps the farmer to manage
    and suggest pesticides. Raspberry Pi 2 is used in this system with MCP308 as an
    analog to digital converter to receive data from the sensor and deliver to Raspberry
    Pi.


    This study [6] is used in Arduino for building a farm automation system which
    uses DHT11 sensor to control Temperature and Humidity along with a soil moisture
    and water level sensor to monitor and control the water tank of irrigation. It
    is used to Arduino with ESP8266 Wi-Fi module to send data for processing and visualizing.


    In this study [7] GSM technology is used to develop an advanced system for agriculture.
    The parameters that provide growth and health of crops such as temperature, and
    soil moisture are monitored through GSM. The system is used to Arduino to accomplish
    this system as a controller by connecting the to GSM module to send data to his
    phone.


    In this study [8] proposed a system of smart agriculture to solve the problem
    of scarcity during the migration of people from rural to urban areas. Using various
    features like GPS based remote control monitoring and sensing many parameters
    as temperature, humidity, intruder, scarcity, and leaf ness to control a proper
    irrigation technique, by deploying sensor nodes in different locations of the
    farm with camera PIR sensor is used to protect the plant from any animals.


    In study [9] a smart irrigation system is used to water the farm efficiently to
    handle issue of water scarcity. The system based on soil moisture, temperature,
    and pH


    sensors for the required Arduino. Atmega microcontroller controls the system which
    gets data from the sensors to drive a servomotor and pump for irrigation. This
    system has the ability to collect the data to a server that can be accessed via
    an android application to suggest irrigation based on the soil type and control
    using Bayes algorithm on the database which is a machine learning algorithm. For
    estimating rain uses forecasting from the web and crops accordingly.


    Based on the above literature, the proposed system is useful for farmers in the
    rural area, it could be helpful and set up by any individual ever for those who
    don''t have experience with cultivation. Furthermore, this system can be used
    in a small area and at houses. This system is cost-effective and time-saving.


    # III. RESEARCH METHOD


    The main design of this work is to design a trendy system for farmers especially
    in the rural area to help farmers to be informative and sharing their time by
    getting benefit of the available technologies. To design this system uses sensors
    such as soil moisture, pH, and can be set for getting of irrigation, pH level,
    and intruder detection. Raspberry Pi is the main controller to control the difference
    between the field and monitoring through Blynk IoT cloud platform. Based on the
    soil moisture value controls the water pump on and off, the farmer adds the appropriate
    food and controls pH level. The system has ability to identify which type of intruder
    among human, animal, bird. All this will be visualized on the mobile phone application.


    # A. Proposed System


    In this system, sensors are used such as soil moisture, DHT11, PIR, and pH sensors
    are connected to Raspberry Pi. The sent values are collected in a farmer''s smartphone
    through Blynk IoT and its application to visualize the data remotely. If the sent
    value value goes beyond the threshold values set in the crop range (40%) during
    time test, but should be the irrigation will be turned ON/OFF by the relay circuit
    and it is connected to a driver circuit which supplies to the required water the
    water pump by Raspberry Pi and its sensors from home. PIR sensors detect motion
    on the field, the camera can capture the type of object among human, animal, bird.
    The system uses just a few bytes to connect cloud and mobile application through
    internet connectivity. The system also monitors the quality of the soil so it
    can easily detect suitable fertilizers will be visualized in the mobile application.
    The farmer will be informed about the field condition through his smartphone remotely
    saving valuable time for


