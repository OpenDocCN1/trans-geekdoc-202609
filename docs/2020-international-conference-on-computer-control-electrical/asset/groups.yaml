  mdcn: '

    物联网（IoT）是具有不同物理属性的互联系统的不可组成部分，涵盖家用、车辆以及各种已形成并完善的设备。它被视为由传感器和执行器带来的真正果实，网络网络汇聚事物并驱动信息，为现实物理世界接入结构开启了大门并实现了想象中的连接，实现了效率提升、经济效益并减少了人类劳动
    [4]。


    ## II. 前人工作


    以往许多关于在农业中应用不同技术的研究已经完成，旨在提高生产力并促进农业流程。


    在这项研究 [2] 中，精准农业旨在提供正确数量的资源（如水、光照和农药），以及在每个时间段内如何提供这些资源。精准农业各项功能的实现是通过从无人机感知所有资源，并做出相应的决策来控制执行器。该系统中还使用了土壤水分、温度、湿度和光强度等执行器将数据发送到思维云端，并开发了一个安卓
    应用程序。


    这项研究 [5] 提出了一种基于嵌入式的土壤监测和农田灌溉系统，通过移动应用程序获取信息以帮助农民增加产量。该系统通过 WiFi 从各种传感器获取信息并实时提供，从而可以实现对适合土壤作物的自动化管理。这是一种根据土壤水分自动开启或关闭的自动灌溉系统。该系统控制作物并帮助农民管理和建议农药。该系统使用了
    Raspberry Pi 2，配合 MCP308 模拟数字转换器接收来自传感器的数据并传输到 Raspberry Pi。


    这项研究 [6] 使用 Arduino 构建了一个农场自动化系统，该系统使用 DHT11 传感器控制温度和湿度，并配合土壤水分和水位传感器来监测和控制灌溉水箱。它配合
    ESP8266 Wi-Fi 模块用于 Arduino 用于发送数据进行处理和可视化。


    在这项研究 [7] 中，使用 GSM 技术开发了一种先进的农业系统。通过 GSM 监测温度和土壤水分等影响作物生长和健康的参数。该系统使用 Arduino
    作为控制器来实现该功能，通过连接 GSM 模块将数据发送到其手机。


    这项研究 [8] 提出了一种智能农业系统，以解决人口从农村向城市迁移导致的稀缺问题。通过使用多种功能（如基于 GPS 的远程控制监控以及感知温度、湿度、入侵者、稀缺和叶枯等参数）来控制适当的灌溉技术；通过在农场不同位置部署带有摄像头的
    PIR 传感器节点来保护植物免受任何动物侵害。


    在研究 [9] 中，使用智能灌溉系统高效灌溉农场以处理水短缺问题。该系统基于土壤水分、温度和 pH 传感器所需的 Arduino。Atmega 微控制器控制系统，系统从传感器获取数据以驱动伺服电机和泵进行灌溉。该系统具有收集数据到服务器的能力，可以通过安卓
    应用程序访问，根据土壤类型建议灌溉，并使用数据库上的贝叶斯算法（一种机器学习算法）进行控制。预测降雨时使用网络预报并相应调整作物。


    根据上述文献，所提系统对农村地区的农民非常有用，对于那些没有耕作经验的个人，它可以提供帮助并设立。此外，该系统可以在小区域和家庭中使用。该系统具有成本效益且节省时间。


    ## III. 研究方法


    这项工作的主要设计是为农民（特别是农村地区）设计一种时尚的系统，帮助他们利用现有技术获取信息并节省时间。设计该系统使用了土壤水分、pH 值等传感器，并可以设置为获取灌溉、pH
    水平和和入侵者检测。Raspberry Pi 是主控制器，通过 Blynk IoT 云平台控制农田差异并进行监控。根据土壤水分值控制水泵的开启和关闭，农民添加适当的肥料并控制
    pH 值。系统具有识别入侵者类型（人类、动物、鸟类）的能力。所有这些都将在手机 应用程序上可视化。


    ### A. 提系统


    在该系统中，土壤水分传感器、DHT11、PIR 和 pH 传感器连接到 Raspberry Pi。发送的值通过 Blynk IoT 及其应用程序在农民的智能手机中收集，以便远程进行数据可视化。如果发送的值在时间测试期间超过了作物范围（40%）设置的阈值，则灌溉将由继电器电路开启/关闭，该电路连接到驱动电路，由
    Raspberry Pi 及其家中的传感器为水泵提供所需的水。PIR 传感器检测农田上的运动，摄像头可以捕捉人类、动物、鸟类之间的物体类型。系统仅使用几字节即可通过互联网连接连接云端和移动应用程序。系统还监测土壤质量，因此可以轻松检测出合适的肥料并在手机
    应用程序中可视化。农民将通过其智能手机远程获取农田状况信息，为节省了宝贵的时间


    ## IV. 系统设计


    授权许可用于：Carleton University。2021年5月28日 04:33:08 UTC 选 IEEE Explorer。受限制。


    图 1. 显示了所提系统的框图。


    ### C. 系统概述

    Blynk 是一个 IoT 平台，允许用户快速构建用于控制和监控 iOS 或 Android 设备硬件接口。下载 Blynk 应用程序后，用户可以创建项目仪表板并排列按钮、滑块和其他组件。通过组件，用户可以虚拟开启或关闭引脚或显示传感器数据。


    ![](img/7b9ab3cbd4ece8eed8e44753068_2_0.png)


    图 1. 系统图。


    ### B. 系统操作

    共有三种操作：

    - 自动灌溉：当系统启动时，Raspberry Pi 作为主控制器命令开启水泵以记录小于阈值的当前水分。控制器检查是否仍低于阈值，以命令水泵保持开启或关闭。下图显示了该操作的流程图，如图
    2 所示。


    ![](img/7b9ab3cbd4ece8eed8e44753068_2_1.png)


    图 2. 自动灌溉流程图。


    ![](img/7b9ab3cbd4ece8eed8e44753068_2_2.png)


    肥料：基于 pH 传感器的输出作为动态参数以及我们目标培养的特定作物，系统将为作物提供适当的肥料以获得更高的产量。正常水平在（5.8-7）以上，如果 pH
    水平过低或过，用户将根据 pH 值获得肥料建议，如图 3 所示。


    ![](img/7b9ab3cbd4ece8eed8e44753068_2_3.png)


    图 3. 肥料建议流程图。


    - 运动检测：当房间内有运动时，PIR 传感器检测并信号控制器同时录制视频。然后 Flow Lite 机器学习算法使用这段视频对检测到的入侵者进行分类，并通知用户入侵者是人类、动物、鸟类还是未识别，如图
    4 所示。


    ![](img/7b9ab3cbd4ece8eed8e44753068_2_4.png)


    图 4. 运动检测流程图。


    Flow Lite 基本上是一个在设备上运行机器学习推理的工具包，因此我们可以获取任何机器学习模型并使用 Tensor Flow 转换器将其转换为可在...运行的格式

