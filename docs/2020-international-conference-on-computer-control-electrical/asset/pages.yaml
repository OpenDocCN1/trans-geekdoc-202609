    # C. System Overview

    Blynk an IoT platform that allows user to quickly build interfaces for controlling
    and monitoring a hardware projects from IOS or Android devices. After downloading
    Blynk application, user can create a project dashboard and arrange widgets, buttons,
    sliders, and other widgets on the screen. With the widgets, user can turn pins
    virtually ON or OFF or display data from sensors.


    ![](img/7b79ab3cbd4ece83eed8e44a74753068_2_0.png)


    Fig. 1. System diagram.


    # B. System Operations

    In there are three operations:

    Auto Irrigation: When the system starts Raspberry Pi as a main controller others
    gives order to switch on motor pump to start recording the current value of moisture
    sensor less than the threshold value. The controller checks whether it is still
    under threshold value or to give order for motor pump to keep it on or make it
    switch off. Figure below shows the flowchart of this operation as shown in Fig.
    2.


    ![](img/7b79ab3cbd4ece83eed8e44a74753068_2_1.png)


    Fig. 2. Auto irrigation flowchart.


    ![](img/7b79ab3cbd4ece83eed8e44a74753068_2_2.png)


    Fertilizers Suggestion: based on output of the pH sensor as a dynamic parameter
    and specific crop we are targeting to cultivate, the system is going to give the
    appropriate fertilizer for the crop to get higher productivity. The normal level
    above (5.8-7), if the pH level less, or greater, the user gives the suggestion
    of appropriate fertilizer on the pH level, as shown in Fig. 3.


    ![](img/7b79ab3cbd4ece83eed8e44a74753068_2_3.png)


    Fig. 3. Fertilizers suggestion flowchart.


    Motion Detection: when there is a motion in the room, PIR sensor detects and signals
    to the controller to record a video at the same time intruder is moving. Then
    Flow Lite machine learning algorithm uses this video to classify the detected
    intruder and inform the user that intruder is a human, animal, bird, or unidentified
    as shown in Fig. 4.


    ![](img/7b79ab3cbd4ece83eed8e44a74753068_2_4.png)


    Fig. 4. Motion detection flowchart.


    Flow Lite which is basically a toolkit for running machine learning inference
    on a device, so we can take any machine learning model and use the Tensor Flow
    converter to convert it to a format that will work on'
