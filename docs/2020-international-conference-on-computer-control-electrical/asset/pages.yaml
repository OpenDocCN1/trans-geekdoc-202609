    # VII. FUTURE SCOPE


    Using parameters such as temperature and humidity can help to predict the climate
    condition for better cultivation. Also connecting the system with other applications
    to provide other useful information for the user such as market status for crops.
    Furthermore, optimum fertilizing every crop gets its exact amount of fertilizer
    precisely. Finding and identifying the insects leads to protecting crops whereas
    productivity.


