  # Substack 第 41 周：机器学习与元宇宙


  **发布于 2021 年 11 月 5 日**


  这是一个谈论机器学习与元宇宙的绝佳周。您可以回顾 Substack，看到我在第 28 周设定了这个话题。话虽如此，这正好赶上马克·扎克伯格本周将 Facebook
  改名为 Meta [1]。关于此次改名，Gary Vaynerchuk 有一段最精彩的 60 秒点评：“过去二十年来，Facebook 最大的优势始终是去往注意力所在之处。”


  https://www.youtube.com/watch?v=qPkYzSLabLE


  在深入本期 Substack 文章的机器学习部分之前，最好先承认一个共识：大家普遍认为“元宇宙”一词是由 Neal Stephenson 在小说《雪崩》（1992
  年）[2]中创造的。我承认这本电子书现在就在我手机里，我正在非常缓慢地阅读它。此时值得一提的是，我现在回想起为什么我从未能从头读完这本书了。


  我的许多文章最终都关乎科技与现代性的交汇。多年来阅读我作品的你们知道，这源于我对公民社会和科技兴趣的结合。元宇宙的概念大致始于此。我非常喜欢 Ernest Cline
  的小说《头号玩家》（2011 年）[3]。书中的一个核心设定是，人们花费大量时间在一个本质上被称为“绿洲”的元宇宙虚拟世界中。为什么我们要回顾从 1992 年《雪崩》到
  2011 年《头号玩家》，再到 2021 年 Facebook 试图成为 Meta 的历程？答案很简单，这关乎一场以元宇宙形式构建在线世界的“土地争夺战”。在这场构建在线虚拟世界的竞赛中，投入最大的公司可能是
  Facebook/Meta。


  这一世界构建工作将包含大量机器学习。我本周在 Google Scholar 上搜索“machine learning metaverse”相关文章的阅读之旅，最终变成了一次奇特的体验，看到了伦理相关担忧与“元宇宙”一词的混杂
  [4]。我猜测原因是多年来（可能自 1992 年起），作者们发现：在他们正常发表的主题标题中加入“元宇宙”一词，有助于文章发表。同样的现象也发生在“机器学习”这个短语上。这意味着同时包含机器学习和元宇宙的学术文章搜索结果是一段奇特的旅程。


  机器学习领域最令人惊叹的事物之一是翻译的概念及其对实时对话的作用。请查看 2021 年 10 月 22 日的《The AI Show》，第 36 集：“Translator
  Now Supports 100+ Languages and Dialects”：https://www.youtube.com/watch?v=LdDK5SoUsHE


