  # 将机器学习投入运营


  将机器学习投入运营将涉及将 API 连接到您的工作流，或拥有必要的管道以大规模与您部署的模型进行交互。大量不同的开源 MLOps 工具可以做到这一点，我已公开分享了对它们的分析。能够大规模且在生产环境中主动使用这些类型的工具是一种技能组合。这与上文提到的模型创建和数据管理技能截然不同。大规模运行和操作化机器学习关乎用例执行的日常管理。模型的响应时间是否拖慢了生产？用例的准确性和交付是否在可接受的公差范围内？还是说需要采取行动？即使是最优秀模型的效率也会随着时间的推移而相对于您的
  ROI 发生衰减，这必须被核算和管理。请再次参阅图 3。


