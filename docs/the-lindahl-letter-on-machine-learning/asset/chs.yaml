  机器学习完全有可能演变成某种更出人意料的事物，或是更名易姓，但利用人工智能生成天然适配数据的模型这一原则与精神将不间断地延续下去。我之所以对此充满信心，是因为其底层技术已发生根本性变革。自动化以及对更高效完成任务的需求，改变了事物发生的预期范式，以及发生的速度与成本。在这两大影响因素的驱动下，创造技术的人们将采用他们能获得的最佳方法以求成功。这意味着融入机器学习（或无论未来将其称作何种动听的新名词），以迈出通往技术与现代性交汇未来的关键一步。该交汇点将在无声无息中到来，无需喧嚣庆祝；届时它将成为一种事后诸葛亮式的存在，并被视为理所当然的平常事物。


