  # Substack 第 13 周：构建你的 MLOps


  发布于 2021 年 4 月 23 日


  两周前，你收到了这场演讲的第一部分，作为《The Lindahl Letter》的一部分发送到你的收件箱，该演讲来自 Ai4。你现在收到了我在 Ai4 2021
  零售、供应链与营销峰会上演讲的另一半，该峰会于 2021 年 4 月 7 日至 8 日举行。我的主题是，“机器学习规模问题：思考在何处以及何时使用 ML、ROI
  模型、合成数据、可重复框架和团队。”你可以通过这个 YouTube 链接直接观看我的演讲视频：https://youtu.be/SXPZ6qNOErE






  # MLOps 工具生态与市场成熟度分析


  ## 主要参与者与工具选择


  一些信息技术领域的主要参与者正试图进军 MLOps 领域。与其他事物一样，选择合适的工具完成工作，关键在于将合适的技术与用例相匹配，以实现最佳可能的结果 [1]。大量报告和其他评论与建议的构建模块正在深入探究
  MLOps 框架 [2]。


  我们确实开始看到 MLOps 领域出现一些可靠的成熟度 [3]。下一阶段将是收购潮，即老牌参与者收购构建 MLOps 的初创企业，或者老牌参与者构建必要的元素，以便在企业级市场超越新晋参与者
  [4]。


  ## GitHub 趋势洞察


  让我们深入探讨，开始了解 MLOps 这部分内容。首先分享一个专业小技巧。如果你从未做过这件事，不妨考虑去 GitHub 看看 GitHub Trending：`https://github.com/trending`。如果你从未做过，也从未看过人们现在到底在做什么，这是一个让你思考当下从业者关注什么的有力方式。在撰写本文时，榜首趋势是一个与
  Dogecoin 相关的项目（`https://github.com/dogecoin/dogecoin`），得益于埃隆·马斯克本周的一条推文，这并不令人惊讶：


  `https://twitter.com/elonmusk/status/1382552587099062272`


  无论如何，我获取了几个我正在追踪用于对比的关键开源机器学习项目的 GitHub 仓库信息。在表 1 中，我将深入探讨一些我认为非常有价值的机器学习项目。


  **表 1. GitHub 顶级机器学习项目**


  ![](img/file3.png)


  ### 核心 ML 框架对比


  先看第一个：**TensorFlow**。TensorFlow 拥有 154,162 颗星，人们确实在广泛使用它。它有 2,933 位贡献者，意味着近 3,000
  人在为 TensorFlow 贡献代码。从此点来看，转到 **PyTorch**，可以看到指标大幅下降。星标数从约 154,000 降至仅 47,000。


  贡献者数量也显著下降，降至约 1,785 人。在 PyTorch 示例中，它们确实有 4,620 个分支，老实说我不知道为什么要查看那么多分支。没人想管理任何事物的
  4,000 个分支。在迭代方面，那是无法管理的。


  我当然更理解 TensorFlow 这边的情况，但这并不意味着 **scikit-learn**（拥有约 44,000 颗星和 1,936 位贡献者）没有吸引力。由此可见，目前用于机器学习的三大主要项目绝对已被广泛采用。人们正在使用它们、为它们创建分支、制作版本，并且现在正在软件开发的广阔天地中真正深入研究它们。


  ## MLOps 层面的深度观察


  现在我们将其提升到下一层级，更深入地看看 MLOps 部分发生了什么。你将看到一个主要的断层。还记得 TensorFlow 有 154,162 颗星吗？现在你开始看到星标数大幅下降。你开始看到星标数在
  10,000 或更少。你开始看到 **Kubeflow**、**MLflow**，以及一些你知道很复杂的东西，比如 Netflix 的 **Metaflow**，它们只有
  4,000 颗星，且每个项目的贡献者都少于 500 人。见表 2。


  **表 2. GitHub 次梯队机器学习项目**


  ![](img/file4.png)


  基于 TensorFlow 与这些项目之间的数量级差异，从该信息得出的一个直接观察是：这些 MLOps 工具**没有一个真正获得了显著的市场份额**。还没有哪一个成为关键产品。


  所以，我们还没有看到所有人蜂拥而至并开始使用这些东西。原因之一在于之前的图表（第 11 周的图 1），当我们看到 API 的不同事物时。你开始思考存在的不同生态系统：从存储桶中的某物到你可以到达的地方的管道和生态系统。


  你将开始使用可用的生态系统工具。所以如果你进入 Bucket 2，你在 Azure 上、在 GCP 上，就必须做决定。如果你在 AWS 上，你将在该生态系统可用的机器学习堆栈中工作。这就是你选择去那里的原因。


  我认为这里非常有趣，你可以看到这些项目的分支数都没有像之前那样多。所以这个领域，我们可以把这些项目拆解到一个图表（图 3）中，它有点类似于之前的图表（图 1）。


  **图 3. MLOps：规模与成熟度**


  ![](img/file5.png)


  你将看到我认为这里存在一个广泛的光谱。现在，你可能不完全同意我根据规模和成熟度对这些事物的定位，这没关系。随时欢迎你告诉我，如果你对其中某项技术有不同的看法。根据你的机器学习用例所处的阶段，你将会有非常不同的机器学习运维。


  主要参与者将在该领域占据主导地位。所以我认为这就是你开始看到之后其他事物真正起飞的地方，它们确实拥有充满活力的生态系统和社区。例如 **Weights & Biases**，人们对它非常感兴趣，并且它周围有一个充满活力的社区。其他一些项目绝对也有充满活力的社区，并且正在建设中。


  在未来一年左右，我将关注并寻找哪些项目真正冒泡上升，成为 Bucket 3 实例中超级成功的项目，人们在构建东西并需要 MLOps 工具来成功落地其战略。因为将会有大量事情不是在生态系统外完成的。


  那不会是草稿类型的东西。那将是你在机器学习领域所做并构建的东西，以达到那个层级。那个层级不会来自 API，因为那不会是你购买的用来做这些事的预训练模型。


  人们将想要做复杂且直接与其业务交付相关的事情。那些业务用例和你机器学习工作流中用于交付的那些高度定制的、特定的用例，将需要远超 API 所能提供的东西。


  因此，鉴于你将开始看到的这种交付，这些 MLOps 公司、GitHub 项目和事物将真正起飞。在未来一年左右，我将关注究竟哪些获得主导市场份额。


  ## 总结


  我们涵盖了什么？


  好吧，我们涵盖了规模究竟是什么的初步概念，对吧？我们谈到了 Bucket 1、Bucket 2 和 Bucket 3，那些图表讲过有一阵子了，可能已经失去了含义。


  - **Bucket 1 是 API**。它是你现在可以出去直接获取的东西，但你可以连接到它并开始在工作流中使用它。

  - **Bucket 2 包含那些生态系统中的事物**，我们将在该生态系统中构建你的机器学习，使用它们的工具。

  - **Bucket 3 将是当你处理本地构建的事物时、当你使用那些开源工具时、当你在自己的环境中构建时，究竟能发生什么的展望**。






  # 核心要点


  现在，我想以我的核心要点作为结束语。我的核心要点一如既往地是：要有机器学习策略。确保你真正了解将要传达的故事。理解你的流水线以及你正在构建什么来交付该邮件策略，因为如果你不考虑流水线，不思考
  MLOps，不查看我们在图表和表格中提取的那些内容，你就无法做好交付准备。


  如果你没有做好交付准备，可能会错失良机，因为当人们投入资金时，他们会期待结果。如果你无法基于 ROI 用故事进行回报沟通，从长远来看你将不会成功。这意味着真正要搞清楚你的
  MLOps。


