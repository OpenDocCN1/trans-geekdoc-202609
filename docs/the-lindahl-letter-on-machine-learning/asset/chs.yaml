  # Substack 第 33 周：人工智能投资来自何处？


  发布于 2021 年 9 月 10 日


  回答这个关于人工智能投资的问题采取了两种方法。首先，我开始思考哪些公司全力押注机器学习和人工智能。这让我很好地了解了企业投资的目标方向。其次，我开始深入探索风险投资这个充满冒险且往往难以理解的世界。


  几乎在你在网上看到的每个地方，人们都在推荐哪些股票受益于人工智能或机器学习投资 [1]。这在行业层面和基于特定公司层面进行。你会看到一份并不令人意外的公司名单。其中包括
  IBM、Qualcomm、Taiwan Semiconductor、NVIDIA、Intel、Micron、Apple、Alphabet、Amazon 和 Microsoft。现在退一步想一想，这份被归入人工智能投资受益者名单的公司列表。这真的是一份可靠的技术公司名单，对吧？大型科技公司正在利用人工智能和机器学习用例推动事物向前发展，并因这种努力而在市场上获得认可。许多学术团体也在研究和测试模型，最终形成学术论文。现代版的智库或团体正到处涌现，致力于机器学习研究。所有这些有趣的部分在于，有多少学者在企业界和学术界之间进出。除了这个旋转门之外，你还可以看到人工智能和机器学习领域大量的收购案例，上述大公司正在市场上吞噬技术和人才。


  除了对这些公司的思考，我们还需要审视风险投资的世界。我找到了一堆关于目前谁在投资人工智能的名单 [2]。如果你在过去十年里一直关注风险投资，那么投资人工智能和机器学习的这些公司名字应该不足为奇。许多投资者希望投资于某些会被收购或成长为光荣的神话独角兽的项目。即使一些实际上没有希望获得市场份额的公司，也会因机器学习人才和知识产权而被收购。有时专利的积累是一种商业策略，这是一个我应该加入写作日程的话题
  [3]。Forbes 的好心人实际上开始质疑所有的投资是否过度 [4]。在这个过程的研究途中，我遇到了一篇来自 McKinsey Quarterly 的文章，引起了我的注意，标题为“A
  Machine-Learning Approach to Venture Capital” [5]。这是一篇有趣的读物，你可能会喜欢。


