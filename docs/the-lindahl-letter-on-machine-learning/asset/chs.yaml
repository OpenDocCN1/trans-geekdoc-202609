  # Substack 第 28 周：机器学习认证？


  **发布于 2021 年 8 月 6 日**


  看来本周的热词是 `#Metaverse`（元宇宙），这本身就很有意思。早在 1992 年，科幻作家尼尔·斯蒂芬森就写了一本名为《*雪崩*》的书，书中使用了这个词并描述了它在实践中如何运作
  [1]。大概有不少人正在捧读这本书，或者下载有声书。这跟机器学习认证有什么关系？显然，我花了一整个上午试图找一个，结果大多是夸大其词或讽刺之作。可能需要在学术巨著中再深挖一点，才能理清从机器学习通往元宇宙的一条清晰路径。我非常确信机器学习将在元宇宙中得到应用，但我们很快就会见分晓，因为人们似乎正在积极尝试构建它。


  ## 从这一番异想天开转到更实际的事情上


  人们永远在寻找实战的机器学习经验。关键在于简历上的应用机器学习项目，以及展示真实、实用技能的能力。认证过去是、现在是、将来大概率仍会是人们谈论自身知识储备、展示掌握技能的一个关键词或途径。在任何严格的面试中，提问和技能演示大概会迅速将“书本知识”与“实战经验”区分开来。你必须能证明自己能将知识应用于相关问题，否则再好的认证最终也只是印在冰箱上好看而已（图
  4）。正是技能的演示，让证书超越了简历上的一行文字。这也是我尝试在 GitHub 上发布代码、积极演示并在该领域实战的原因之一。


  **图 4. 贴在冰箱上的认证**


  ![](img/file8.jpg)


  关于机器学习认证的底线是：它们是证明你曾学习并通过实验的绝佳方式。实战经验需要与认证相结合。如果你能凭借技能演示获得工作，或作为社区一员积极参与 GitHub
  项目，你就能朝着就业的轨迹前进。此处的寓意是：仅有一叠机器学习证书是远远不够的，必须辅以某种形式的技能演证。如今许多面试都倾向于包含某种练习或挑战来验证技能。


  这些年我收集的机器学习证书中有很多我都很喜欢。实验环境在模拟实际环境所需操作方面已经好太多了。那种引导式的练习真正让机器学习在我眼中“活”了起来。Google
