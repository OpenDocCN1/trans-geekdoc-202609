  # 困难在于将领域知识与深度机器学习技能相结合


  这意味着你需要开始在组织内部寻找主题专家（SME）的知识。当你真正开始将那些在极其细粒度、深层次上了解业务的人员，与能够操作模型并进行部署的人员配对在一起时，事情就会起飞。这最终很可能会变成一项团队工作。你拥有来自主题专家的深厚知识，也有来自机器学习专家的深厚知识。在实践中，将这两个群体结合在一个团队里，就是推动事情完成的方式。你可能需要引入一位真正擅长构建不同层和网络的专家；他们能够构建精细的模型，从而增强团队实力并加快进度。有时你必须引入合适的人才，在过程中为项目注入动力。


  ## 1. 人才从何而来？


  就我个人而言，我相信你可以从组织内部培养人才。如果你对这一断言持怀疑态度，请在脑海中记下一点：真正要挑战那种对内部成长和发展的偏见。在我的整个职业生涯中，我有着帮助内部人才成长的切实记录。这行得通，但它需要投入时间，并拥有与构建工具包相匹配的正确计划。我最引以为豪的职业成就之一，就是见证某人获得晋升。看到人们开始将先进的方法和技术带到组织的不同部门，是一件令人惊叹的事。你也可以体会这种感觉。你只需要走出去，开始为现有人员构建他们的工具包。真正花时间投资于他们作为团队成员和个人贡献者的成长与发展。


  我们正处于学习机器学习的黄金时代 [3]。现在网上存在的培训资源多到你无法全部消化。它们以各种不同的形式存在。我最喜欢的是现在可用的在线实验室。我用得最多的一个叫作
  `Coursera`。人们已经构建了完善的工具示例，展示如何进行机器学习。你不仅可以阅读相关内容，还能深入示例中实际操作一番。这正是自产品发布以来 `TensorFlow`
  一直吸引我的地方。如此多的人慷慨地分享他们的知识、技能和能力 [4]。他们通过易于获取的课程、讲座，甚至一些证书，在网上分享着通往机器学习王国的钥匙。我已经学习了
  50 多门课程。如果你真想深入了解我的学习历程，可以在我的 `LinkedIn` 个人主页上看到这些课程。那将展示我投入个人时间完成的课程。你也可以直接查看脚注中的链接，找到一个起点。


  有时，组建内部团队的速度根本不够快。帮助内部人才开发出机器学习领域的世界级技能——事实上是任何领域——都需要时间。我认识到这是一个长期目标，也是你必须在过程中逐步建设的目标。你有几个选择可以开始寻找补充人才的途径。其中一种是雇佣承包商，让他们帮你启动项目。另一种是找到合适的产品或公司，帮你快速起步。目前有几家公司正在做这件事，其中一些能为你的组织带来实质性影响。


  通常，组织内部的数据源并未建立良好的索引，也没有清晰映射的特征和关联。即使获取现成的数据源也是一个真正的挑战。在大多数情况下，人们使用的那些数据集是专门为这种用途而创建的。这些数据集并非自然产生于“野外”。即使制作定制的合成数据集，对于试图大规模落地机器学习的组织来说也是一项挑战。这就是为什么使用外部产品来管理数据、甚至访问
  API 都需要规划和持续的投入。发送给 API 的数据必须保持一致。不断变化的数据流无论在内部还是外部管理起来都是噩梦。许多像 `Databricks` 这样的公司正涌入这一领域，帮助理清复杂的数据存储
  [5]。


  这些思考一次性消化可能有点多，但当组建团队解决机器学习问题成为刚需时，所有这些都会变得清晰明了。我对于“人才从何而来”的回答是：随着时间推移，融合优秀的专业人士，打造高绩效团队。这可能涉及招聘关键技能人员来补充团队，或者如果有足够的缓冲时间，则投资培训团队。缓冲时间越短，快速引入外部人才的需求就越迫切。


  ## 2. 如何让人才协同工作？


  既然我们已经讨论了人才从何而来以及如何思考团队投资，现在让我们换个话题，聊聊如何让团队协同工作。这属于“说起来容易做起来难”的事情之一。你可以这样思考这一信条：让领导者领导，让管理者管理，让员工成功。当你拥有能够自我组织、快速完成工作的敏捷团队时，这套方法效果很好。如果你现在正处于这种状态，那么恭喜你，请珍惜你所拥有的。


  团队关乎不同角色的人员如何协同工作。我倾向于将机器学习项目视为拥有两个关键支柱。首先，你需要弄清楚谁拥有关于产品、数据以及数据如何关联客户旅程的深度知识。这可能显而易见，也可能很困难。有时，这些对数据拥有最大机构知识的人是发挥关键作用的主题专家，他们可能深藏在组织的分析师岗位上，或者可能已经转岗到了其他角色。


  其次，找到那个拥有深度知识的人，并帮助他/她与你找到的机器学习专家共事。将这两人配对在一起，将是你正在做的事情中最关键的枢纽。大多数组织拥有的数据结构，最初并非为机器学习而架构。弄清楚从哪里入手、给什么数据打标签、什么关联什么，这才真正是旅程的开始。这也是全栈机器学习技能人员如此重要的原因之一。那到底意味着什么？**全栈机器学习技能**。我可以走进你的组织，今天就搭建起
  `TensorFlow`，甚至让团队开始共享一些 `Jupyter notebooks`。拥有正确的数据流、正确的机器学习硬件，以及能够访问正确的生产侧基础设施，从而在不压垮或损坏系统的前提下快速移动数据，这些正是全栈技能必不可少的地方。


  也许真正敏捷的团队本应是自我组织的，但这在初次尝试时大概率不会发生。寻找共同或共享的目标听起来比实际操作容易得多。让人们围绕这个共同或共享的目标自我组织，可能需要一些基本规则或火花。


  有时高绩效团队会直面挑战，努力消除可能遇到的任何障碍或阻碍。大多数团队不具备那种程度的奉献、坚持或韧性。通常，是项目需求或普遍的业务问题将一群人聚在一起，采取某种行动。在这类情况下进行管理总是很有挑战性，通常包括尝试将具有不同技能的人聚集在一起。





  # 团队类型与人才策略


  你将遇到两类团队：已经组建好的高绩效团队，以及基于特定业务问题组建的团队。除了这两种常见场景，你可能面临的另一种人才状况是“解决方案追逐问题”。当市场上充斥着开源项目，让人们能够直接介入并开始使用复杂工具时，这种情况比以往更频繁地发生。这种模式的下一步是想用这些新奇的工具做点什么。为此，你可能会发现一个解决方案正等着去解决某个问题。然而，这可能不是正确的解决方案，甚至与应采取的行动方案完全背道而驰。


  对我来说，让人才协同工作的核心在于业务问题和团队试图达成的目标。如果最终目标模糊不清，或者被务实地挪用为除解决当前业务问题以外的其他目的，那么很难围绕该目标凝聚共识。


  我们大概应该深入了解一下必要的工具，以便让机器学习专家能高效地与团队协作。你现在大概能看出，我倾向于使用像 `TensorFlow` 这样健壮的工具来大规模开展机器学习工作。你也可以从日志文件入手，使用像
  `Splunk` 的机器学习工具包这样的现成产品深入研究。这是一个让团队开始使用通用平台完成工作的切入点。


  这是我非常热衷的话题。我总是乐于与人交流如何迈出第一步，建设内部机器学习人才。


