  # Substack 第 38 周：大多数机器学习项目会失败吗？


  **发布日期：2021 年 10 月 15 日**


  你可能听说过约 85% 的机器学习项目会失败。该统计数据源自 2018 年 `Gartner` 报告（新闻稿），其中包含以下内容：“Gartner 预测，至 2022
  年，85% 的 AI 项目将因数据、算法或负责管理它们的团队中的偏见而产生错误结果” [¹]。在过去 38 周（发布此 `Substack` 的过程中），我一直在谈论拥有一个顶层机器学习战略的必要性，该战略根据
  ROI 对用例进行优先级排序 [²]。你有大量专家和空谈者就如何使你的机器学习项目成功提供指导 [³]。对我来说，关键在于拥有一个机器学习战略，并以一种突出可定义、可重复的成功计划的方式有计划地执行。


  我们可以快进几年，追赶上 `Gartner` 团队分享的较新报告：“Gartner 研究显示，只有 53% 的项目能从人工智能 (AI) 原型走向生产。CIO
  和 IT 领导者发现很难扩展 AI 项目，因为他们缺乏创建和管理生产级 AI 管道的工具” [⁴]。我想这意味着成功的轨迹在过去几年有所改善，但 `Gartner`
  团队预测大多数（超过一半）机器学习项目将失败这一观点是一致的。这就是我花费大量时间和演讲机会谈论开源 `MLOps` 工作的原因之一。那是我看到最多人共同努力克服上述障碍的地方。


  **问：** 你做什么来帮助防止机器学习项目失败？


  **答：** 使用已知有效的模式。全止。






  # 机器学习用例与策略


  大量机器学习用例已被证明行之有效。首先应瞄准并部署类似的用例。这是进入机器学习生态系统、并可能从机器学习策略中获得可靠 ROI 的最佳方法。通过外部 API 执行可定义、可重复、且已被证明持久可靠的操作，总比尝试在组织内部做独特的事情要容易得多。其中一些用例回报可能非常丰厚，但要推动其走向成功将非常困难。因此，只想从
  AWS、Azure 或 GCP 访问机器学习 API 的人，将发现一条通往用例成功的更轻松之路。所有训练、实施和持续改进机器学习模型的工作均由提供商完成。您还能获得众多用户对
  API 进行压力测试的好处，而非局限于单一服务用例。


