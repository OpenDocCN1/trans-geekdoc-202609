  # Substack 第 23 周：公平性与机器学习


  发布于 2021 年 7 月 2 日


  用于协助机器学习中公平性和偏见检测的工具开始推出。其中一些针对缓解措施，其他部分则是真正的补救努力。真正最重要的部分是将公平性识别为一个概念。您必须开始理解偏见在机器学习中意味着什么，才能着手进行缓解和补救。确保流程可定义且可重复，创造了质量的潜力。在此框架内，一个高质量、可定义且可重复的流程可以在机器学习开发和部署生命周期中考虑公平性。人们一直在解决这个话题。您可以回顾加州大学伯克利分校
  2017 年秋季的这门课程，以了解我们当时的状况 [1]。您仍然可以在 Vimeo 上观看介绍视频 [2]。从讲座中您真切地感觉到，他们希望我们能以有意义的方式解决算法中的偏见，以减少来自以人为中心的数据收集或评估中的偏见。


  自该讲座发布以来的这些年里，我们看到了各种事物的构建，旨在帮助在技术顾虑之外考虑偏见。我读了一篇 2018 年的文章，被引用了 331 次，由 Sam Corbett-Davies
  和 Sharad Goel 撰写，题为“公平性的度量与误度：公平机器学习的批判性回顾” [3]。这加强了我的观点：人们一直在尝试深入思考和考虑机器学习中的公平性。不幸的是，这种教育努力并未转化为算法和机器学习在实践中的应用。许多用例是基于“技术上可能的艺术”来解决的，而非基于对该技术应用的适当性和公平性的考量。


