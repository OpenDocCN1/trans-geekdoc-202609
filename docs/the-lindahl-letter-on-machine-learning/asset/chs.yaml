  # Substack 第 27 周：机器学习的未来


  发布于 2021 年 7 月 30 日


  迟早，机器学习只会成为一个事后诸葛亮的想法。利用和优化机器学习的自动化工作将允许根据必要进行部署，且仅对相关用例有利。我们还看到机器学习工作被打包并构建到日常供应商交付的产品中。是的，我主张机器学习的未来是它变得无处不在，并不比将硬件层从日常操作中虚拟化更令人兴奋或更不令人兴奋。


  对于《The Lindahl Letter》的每一期，我都会为社交预览图标挑选一张图片，人们在访问在线版本时会看到它。据我所知，每一封邮件顶部都附带我最喜欢的丹佛照片之一。很自然地，我去我的
  Google 相册库搜索了一些带雪的东西，以此开个玩笑，暗示即将到来的人工智能寒冬[1]。关于这一点，最好的快速阅读材料可能来自 Towards Data Science，链接如下[2]。该网站包含一张精彩的图表，展示了
  1973 年和 1988 年发生在人工智能领域的普遍放缓。你大概能从第一段看出，基于机器学习已变得无处不在，我不相信另一轮人工智能寒冬即将来临。此时，我认为机器学习更有可能变得如此无处不在以至于成为事后诸葛亮的想法，而不是再次失宠。


