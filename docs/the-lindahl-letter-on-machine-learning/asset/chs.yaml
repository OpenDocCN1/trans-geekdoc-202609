  内尔斯·林达尔，俄克拉荷马州乔克托族注册成员，是《*以公民荣誉毕业*》的作者，也是 `www.civichonors.com` 的创始人，该网站倡导通过志愿者网络发展强化社区的方式。内尔斯是托马斯和芭芭拉·凯斯特·佩奇学者，毕业于堪萨斯大学，主修政治学，辅修公共服务与公民领导力。本科期间，内尔斯曾是公共管理领域的伊森·艾伦学者，连续四年榜上有名，并参与了堪萨斯城共识组织与公共管理系的一项关于职场识字的研究。内尔斯获得堪萨斯大学公共管理系公共管理硕士学位。内尔斯拥有沃尔登大学公共政策与管理博士学位，专攻知识管理和电子政府。除学术工作外，内尔斯正致力于完成一本探讨技术与现代性交汇点的新书。


