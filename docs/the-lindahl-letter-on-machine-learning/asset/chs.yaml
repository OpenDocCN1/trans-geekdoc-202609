  # Substack 第 42 周：时间晶体与机器学习


  **发布于 2021 年 11 月 12 日**


  事情确实变得有趣了。在到处关于元宇宙和 Facebook/Meta 改名的讨论声中，您还得混入在此之前发生的时间晶体事件，这清楚地证明我们生活在一个有趣的时代。您可能会想知道这两个话题是否相关。为什么我最终把它们安排成前后两期的主题？答案很简单。话题是按灵感迸发的顺序排列的。回溯到
  2021 年 7 月 28 日，来自 Google、Stanford 和 Princeton 的研究人员在 arXiv 上发布了一篇题为“Observation
  of Time-Crystalline Eigenstate Order on a Quantum Processor”（在量子处理器上观测时间晶体本征态序）的论文
  [1]。这篇 16 页的论文似乎得出结论：“这些结果建立了一种可扩展的方法，用于在当前的量子处理器上研究物质的非平衡相。”就原始科学成就而言，这是一篇真正有趣的论文。我们通常从固体、液体、气体和等离子体来理解物质状态。论文中解释时间晶体的数学有点复杂。它们建模并解释了时间晶体的概念：在不消耗任何能量的情况下创造出规律且可重复的循环
  [2]。这似乎违背了热力学第二定律，使其成为一个非常有趣的发现。


  您可能会问，所有这些关于时间晶体的讨论与机器学习有什么关系？我在第一段中试图铺垫：就理论物理和科学而言，这一发现非常酷。当将带引号的“time crystals”和“machine
  learning”放入 Google Scholar 时，共显示 240 篇论文 [3]。其中一些论文属于跨学科蹭热度现象：即有着明确学术研究方向的人，选择将一个非常热门的术语融入其常规学术研究轨迹的标题中。考虑到建模时间晶体所涉及数学的复杂性，这是一个非常值得考虑的有趣做法。我无法在家用电脑或我的任何云实例上建模时间晶体。我现有的任何资源都无法模拟量子计算。请回看上文论文标题的最后两个词，表明该研究是在量子处理器上完成的。这直接限制了能够为该领域做出贡献的研究人员数量。就成本和设备而言，获得量子计算访问权限属于稀缺资源。您或许可以通过
  `IBM Quantum` 等服务从云端获取量子计算访问权限 [4]。我在网上花了一些时间查看 `IBM Quantum` 的项目和服务 [5]。看到哪些在线、每个地点有多少量子比特，这挺有意思的。


  在思考时间晶体的定义并四处寻找如何在云端访问量子计算后，我最终深入研读了一本 2020 年的书籍《Machine Learning Meets Quantum
  Physics》（机器学习遇见量子物理）[6]。这本书似乎深入探讨了人们在量子物理背景下利用机器学习所做的工作。该预览链接可让您看到大约 61 页的内容，包括简介。他们的脚注方式与此周报非常相似。


