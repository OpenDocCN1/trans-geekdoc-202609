  # Substack 第 36 周：AIOps/MLOps：人工智能服务的消费与运维


  发布于 2021 年 10 月 1 日


  文末维护的未来发布清单刚刚新增了一个话题。英国（UK）刚刚发布了国家人工智能战略：“国家人工智能战略立足于英国的优势，也代表着英国人工智能发展的阶跃式变革的起点，认可了人工智能在私营和公共部门提升韧性、生产力、增长和创新的力量”
  [1]。我已经开始着手“第 56 周：国家人工智能战略比较分析”这篇 Substack 文章，将包含对美国、英国和中国人工智能战略的一些分析。所以你们有这颗智力大胆尝试的宝石可以期待了，根据发布计划大概明年才能见到。这是我未来某个时间点考虑写论文探讨的主题。我认为它值得更深入的考量。


  ## 脚注


  [1] https://www.gov.uk/government/publications/national-ai-strategy






  # 探讨 AIOps、MLOps 与 ModelOps


  回到手头与 AIOps 和 MLOps 相关的话题。前几天有人试图说服我将 `ModelOps` 视为方程式的主要组成部分。你们所见过的我的多场演讲，都是对开源
  `MLOps` 技术和公司领域的研究。该研究轨迹从未偏向 `ModelOps` 领域，也未深入与图相关的公司兔子洞。虽然有时基于图的事物非常有趣，且人们会用一系列充满激情的推销词来推销它们。然而，本话题旨在深入探讨在消费点上人工智能服务与运维之间的差异。


  在 Google Scholar 中快速搜索 `AIOps` 会得到约 657 个结果 [²]。其中一些结果颇具趣味，但最相关的结果非常简短，且仅被引用 59
  次：Dang 等人撰写的“AIOps: Real-World Challenges and Research Innovations” [³]。该文献似乎引用了
  `AIOps`，并聚焦于 `Moogsoft` 的一个网站，值得一读 [⁴]。我的工作聚焦于与 `MLOps` 相关的开源软件，这与谈论 `AIOps` 的人群关注的领域不同。在很大程度上，`MLOps`
  旨在解决如何构建工具和工作流，以在生产环境中运维机器学习模型。


