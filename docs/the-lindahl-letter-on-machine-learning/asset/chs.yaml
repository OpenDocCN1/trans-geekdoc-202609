  # Substack 第 40 周：应用机器学习技能


  发布于 2021 年 10 月 29 日


  在开始之前，我要承认关于如何在机器学习领域找工作的内容有很多。但关于机器学习从业者的学术研究却少得多 [1]。我对该主题学术内容的匮乏感到不满，所以不得不坐下来深思熟虑。学术界有人有机会对机器学习从业者进行详细的调查和研究。也许能从中产出像
  Walter Isaacson 的《创新者》（2015）这样的书籍。


  目前我正在查看名为“What Is ML Scale?”的演示文稿第 4 版，上次更新于 2021 年 7 月 16 日 [2]。这些内容没有专门涉及应用机器学习技能。总体而言，这些内容和涵盖的所有想法都与该考量相邻。这一认识让我产生了两组不同的问题，可能与今天的主题——应用机器学习技能——相关。要成为一名全栈机器学习（工程师）从业者，一个人必须能够同时驾驭两组截然不同的技能
  [3]。首先，他们需要能够管理机器学习模型以及该技能组合中的所有内容。其次，他们需要具备将机器学习投入运营的技能。这两点在前文中仅寥寥数语带过，在某些方面可被标记和剖析为
  MLOps 和 AIOps 混合了一些深度数据分析和策展。我将在下文深入探讨。


  如今模型无处不在，我们到处都有开源模型库、可供调用的 API，以及日益增多的自研解决方案。我们可能已达到机器学习模型普遍普及、绝对新颖或新型模型程度每日递减的阶段。处理模型训练所需数据、理解相关要素以制作最终可投入生产的最终产品，需要特定的技能组合。使模型具备生产就绪性需要大量的规划和执行。这就是人们购买预训练模型并使用
  API 来跳过该步骤的原因之一。相关数据和用例有可能过于专业化，以至于自行构建是唯一的前进道路。但许多用例不需要这样做，尤其是机器学习图像/视觉领域的用例。


