  # Substack 第 21 周：开展机器学习工作


  发布于 2021 年 6 月 18 日


  也许是时候有点“大胆”，开始在 Google 上搜索“机器学习项目为什么会失败？”了。我确信这会在未来几天给我带来各种奇怪的广告。你毫无疑问会被推向 Gartner
  关于该主题的一项研究 [1]。也许你应该试着关注那项研究的一个细节，即新闻稿发布于 2018 年。三年后人们仍然关注它的原因是这句话：“Gartner 预测，到
  2022 年，85% 的 AI 项目将因数据、算法或负责管理它们的团队中的偏见而产生错误结果。”也许出于显而易见的原因，这一指标一直萦绕在人们对机器学习项目的思考前沿
  [2]。多年来，依我之见，一直在发生两种截然不同的趋势。第一，组织建立大型机器学习部门的做法正在消退。第二，外部咨询机构的数量迅速增长。你可以从从事机器学习领域的初创公司数量，以及提供顾问团队帮助的大型组织数量中看到这一点。


  我仍坐在这里阅读关于机器学习项目为何失败的文章 [3]。在大多数情况下，它们都大同小异，汇聚成几个共同的观察：生产数据脏乱、模型不具备动态性、运营化需要持续投入以维持。这也是基于
  API 交付的机器学习解决方案往往比野外部署的其他方案更持久的原因之一。负责维护和“喂养”其提供的 API 模型的大公司，将运营维持和持续维护作为嵌入在 API
  交易价格中的服务提供。这些努力在很大程度上针对你试图通过 API 调用完成的具体任务。许多机器学习用例以这种方式效果足够好。


