  本周我真正想写的只是 OpenAI 发布的新 `Codex API` 演示，以及该技术从伦理和实践两个角度来看潜在的危险性。


  8 月 11 日，看完演示后，我写下了以下内容：






  # OpenAI Codex 演示与伦理考量


  “昨天，我在客厅的电视上观看了 OpenAI Codex 的演示。这可能是一项新技术极其重要的演示。它几乎是对话式编程的一种实现。在演示过程中观察一个生成式、交互式、基于代码插值的语言模型运作，非常有趣。这项技术很可能就是与计算接口进行编码交互的未来。我非常担忧这类技术的伦理考量。在意识到他们构建了什么之后，这是我脑海中浮现的第一个念头。OpenAI
  团队应该致力于开发一个伦理边界模块。这项行动很可能应该成为该整个团队的首要任务。波士顿动力公司的机器狗 Spot 完全有可能现在就拥有一个可工作的机器学习 API，而
  Codex 可以在功能上对其进行教导和指挥。请思考一下：‘使用 OpenAI Codex 通过 Spot API 发布编程指令的伦理边界是什么？’对我来说，这是一个非常现实的担忧，在构建并投入运营更复杂的机器人实现之前，应该对此进行深思熟虑。”


  # 机器学习集成：搜索现实与技术现实


  坐在这里搜索一些关于机器学习集成的内容，我了解到 Google Chrome 的自动完成功能一直试图诱导我点击“机器学习面试题”。显然，搜索面试题比研究集成要流行得多
  [1]。当我终于从这个震惊中缓过神来（花了几秒钟），我意识到在实际搜索结果之前展示了四个不同的广告。人们正在为这些展示位付费。我相信 Domo、Alteryx、Dataiku
  和 BMC 的市场部门初衷是好的，但竞得向我展示广告权利的这些公司，没有一家能赢得我的生意。与你的机器学习层进行集成很难。句号。目前没有任何办法绕过这个现实。方程式中有趣的部分在于，在
  Google Scholar 上你不会立即看到关于困难集成的文章 [2]。


  像 Towards Data Science 那边那些更务实的人，会很快谈论为什么将机器学习集成到你的应用程序中如此困难 [3]。人们正在大规模地将机器学习构建进应用程序中，并且你可以在工作流中调用外部供应商的
  API 并与之协作，没有太大困难。该 API 将明确定义你需要发送什么以及将收到什么。来自 GCP、AWS、Azure 或其他众多机器学习提供商的所有这些 API
  都将有完善的脚本，唯一真正的顾虑是成本和延迟。搭建你自己的机器学习栈并服务机器学习模型将会更困难。我们现在看到更多用于部署和管理机器学习管道以实现稳健集成的端到端平台
  [4]。所有让工作流与机器学习层之间集成变得更容易的基础工作正在进行中。我花时间研究的核心领域之一是 MLOps，这是人们渴望解决的问题。像 Weights &
  Biases 这样的工具正在增加功能，但它们还不是全栈任务控制系统。这就是 MLOps 领域的发展方向，但这一趋势的汇聚需要一些时间。请再看图 3。


