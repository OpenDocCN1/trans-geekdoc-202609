  # ML 规模问题：策略、分桶与阶段


  我曾是那些谈论规模化重要性的人之一。本周我们将在本期通讯中深入探讨机器学习规模化这一主题。本周早些时候，我作为演讲者参加了一个名为“Ai4 2021 零售、供应链与营销峰会”的虚拟人工智能会议，会议于
  2021 年 4 月 7 日至 8 日举行 [2]。我的演讲主题是“ML 规模问题：思考在何处及何时使用 ML、ROI 模型、合成数据、可复用框架与团队建设。”


  ## 演讲摘要


  在本次演讲中，我将重点关注机器学习规模化及大规模 MLOps 决策背后的策略。从概念上讲，我将机器学习用例的类别细分为三个桶：


  *   **桶 1**：“可调用之物”，例如外部 API 服务。

  *   **桶 2**：“可驻留之地”，例如你可以在其中构建业务版图的生态系统（AWS、GCP、Azure，以及为 MLOps 交付而涌现的许多其他平台）。

  *   **桶 3**：“自行构建之物”，例如开源和自研工具解决方案。


  这三个桶随后在四个阶段中进行考量：


  1.  **启动阶段**：规模究竟是什么？

  2.  **分析阶段**：用例中的“规模与成熟度”

  3.  **指导阶段**：深入推进机器学习规模化。

  4.  **平台化阶段**：MLOps 的吸引力何在？


  这将是一场精彩的 25 分钟演讲。


  以下是演讲前半部分的记录，源自实际演讲音频，并为语法通顺略作编辑。演讲的后半部分将在两周后发送至您的邮箱。


  你好，我是 Nels Lindahl 博士。我是一家财富 5 强企业的临床系统 IT 总监，《Graduation With Civic Honors》的作者，一位热衷写作的技术追随者、体育卡收藏家，以及一名资深
  TensorFlow 爱好者。


  ### 研究免责声明


  本演讲包含原创研究。所有内容均为我个人观点，反映了我对所讨论主题的当前看法。这些想法在发布时是当前的，但该领域变化迅速。


  ## 第一部分：启动阶段：规模究竟是什么？


  从概念上讲，我将机器学习用例的类别细分为三个桶：


  **桶 1** 是最简单的，因为你只需去获取并使用它。你只需连接到它，发送一些信息出去并获取一些信息回来，然后就可以开始工作了。


  **桶 2** 关乎你可以完全身处其中以构建业务版图的生态系统。AWS、Azure 和 GCP 以及许多为 MLOps 交付而涌现的其他平台——我确实是指很多其他的——已准备好为你提供生态系统。你开始看到除了三大巨头之外的其他生态系统。它们正在涌现，并将提供不同的工作流，在不同的地方部署你的机器学习模型并快速切入该领域。


  现在是第三类，即 **桶 3**，这是你自行构建东西的地方。这些是开源和自研工具解决方案。我试图让这个桶稍微大一点，因为我觉得很多工作都是从这里开始的。几年前，这是主要阵地，现在我们正看到一种转变。我们看到向其他桶的移动。那些
  API 如此易于获取，你可以进入这些生态系统并快速上手。事物正在移动和变化。这三个桶的分类帮助我思考用例目前处于何处，以及未来将在何处发生。这是一个非常战术性的问题，而非战略性的。


  要看到随机森林中树木之外的战略，需要一点透视。有时更容易锁定并专注于一个特定项目，而忘记了该项目如何融入更广泛的战略。拥有一个自上而下应用的有针对性的机器学习战略，有助于确保正确的高管赞助和资源专注于取得成果。与其运行一堆独立的自我孵化工作，不如拥有一个可定义、可复用的流程来推广，并有助于确保相同的方法能以具有成本效益的方式在组织内复制。话虽这么说……当然你需要一个机器学习战略。


  所以这不仅关乎三个桶以及你在做什么、在考虑什么。它关乎你如何组织这份推介。你的机器学习战略必须能够告诉人们你试图完成什么，以及它将为组织带来什么。


  现在，如果你要出去分享那个机器学习战略，并试图让组织投入他们宝贵的资金支持你的战略，你很可能是在谈论预算层面的投资。那笔预算级投资将要求你做一些有承诺的事情。


  这些承诺可能包括机器学习支出的预算级 KPI。我该如何管理？我该怎么做？嗯，你早就知道那将是一个 KPI 综合体，包含 ROI。所以我从一开始就在整个过程中构建这些指标，以便跟踪、建模并准确理解我的机器学习战略部署中将发生什么。这样做是为了让我能在各个层面沟通成功——或者在某些情况下，你可能会遇到一些需要重新调整并向人们解释你在做什么的失败。但你的
  KPI 综合体将能够构建那种沟通策略，让你取得成功。


  在你完成前面这四件事之后，然后且仅然后，你才能转向开始进行一些机器学习用例交付。那才是有趣的部分，对吧？当你开始交付机器学习用例时，你会很快发现，你将需要一个持续的
  MLOps 战略，以便维持并继续做所有你在申请资金获得预算级承诺时所承诺的事情。


  ## 第二部分：分析阶段：常见机器学习用例：“规模与成熟度”


  所以，在图 1 中，我所做的是查看来自 AWS、Azure 和 GCP 的一些不同常见 API，并从规模与成熟度的角度审视它们。所以你可以把这看作是桶 1。这些是“可调用之物”。所以它是你机器学习战略的一部分。


  **图 1. 常见 API 用例：规模与成熟度**


  ![图 1. 常见 API 用例：规模与成熟度](img/file1.png)


  你必须让一切围绕目的、复制和复用。这将成为为你的组织赢回价值的核心。出去使用 API 是快速赢回价值的好方法，因为如果你去使用 AWS 企业搜索、GCP Vision
  API 或 AWS 转录服务，所有的训练、所有的模型构建；所有的艰苦工作都由托管和运营这些 API 的人完成了。所以那笔前期投资已经花出去了，但不是由你或你的组织花的。所以你可以直接切入将其注入工作流的节点，并能快速做一些有趣且有用的事情。


  从预算行项到真正投入运营，你必须基于潜在 ROI 以统一的方式应用你的机器学习战略。做完这件事后，你就会知道你是出于正确的理由选择了正确的路径。然后你可以开始考虑在尽可能多的应用中复制结果和流程。迁移学习无论是在模型还是部署层面都在此发挥作用，你将很快了解到，一旦你弄清了如何以质量和速度去做，将其应用到一套事物上会变得快得多。这就是你的团队齐心协力、能够交付成果的力量。






  是的，我一直回到这一点。我始终围绕着战略。因此，你的机器学习战略必须处于你试图传达内容的最前沿。你希望它是可定义且可重复的；你希望能够分享这一愿景。你希望你的电梯演讲是自上而下的。人们必须知道这正在发生。这必须成为组织知晓正在发生之事的一部分。这非常有力，因为当你思考在何处以及何时使用机器学习时，你将从那些懂得如何在实践中思考案例的人那里获得最佳的自下而上工作。每个人都可以思考何时可能发生什么，人们可以带来他们所有关于机器学习用例的主题专家想法，并将其与你的机器学习战略相匹配。当这两者结合在一起时，那就是为你的组织创造成功的地方。


  现在，这种成功不仅源于构思阶段。它源于周密规划并以成功的方式将其运营化。它部分源于你的 ROI 模型。这需要持续监控，以便你确切了解发生了什么，这样你就能知道，从季度到季度，从月度到月度，这项工作是否成功？这个模型是否有效？是否需要调优？你是否需要对其做些什么？


  与此同时，你可能会进入一个领域，不得不在合成数据与其他数据战略之间做决定。现在，如果你正在构建机器学习模型，并且确切知道该做什么，而且在整个过程中对数据的样子有很好的了解，并且能够构建出类似真实数据的合成数据，这很可能意味着你确切了解正在发生什么。你可能处于一个有利位置，构建一些合成数据并拥有更多数据可用于训练和其他事情，这对你可能很有效。否则，你可能不得不研究其他数据战略以变得更复杂一些，但我认为能够创建合成数据绝对是你应该考虑的事情。这值得进一步考量。


  所以你需要确保拥有可重复的框架，它们是明确 MLOps 计划的关键。一旦你进入这个构建流水线并将机器学习运营化的过程，你会发现以可定义和可重复的方式去做是成功的关键。


  但是，如果你没有合适的团队，这行不通。你可能不得不寻找供应商；你可能不得不建立内部团队。你可能不得不采取一些措施来把事情做对。但我要告诉你，如果你有战略和构思在进行，却没有团队来执行，可能是时候踩刹车、多思考一会儿、深入挖掘，弄清楚能引入谁来使其成功。


  ## 第 3 节：指导：深耕机器学习规模


  图 2 是指导图。在这里我们将探讨深耕机器学习规模。这是第 2 类和第 3 类。所以我们在讨论你可以在其中构建东西的生态系统中的位置，以及第 3 类，即你可以自己构建东西的位置。这些只是通用用例。


  ### 图 2. 通用机器学习用例：规模与成熟度


  ![](img/file2.png)


  我认为这是思考你的机器学习战略中可能实现什么的好方法。你可以做一些图像识别、产品推荐、构建一些监控系统，也许还有一些账户优先级排序。也许你身处一个潜在客户优先级排序讲得通的业务中。并非每个企业都会发现声音模式匹配或地理空间分析讲得通。仅仅因为你可以用机器学习模型构建某些东西，并不一定意味着这对你的业务是正确的做法。


  现在，这是一个你可以立即着手做的事情的良好采样。所以，也许看看那些事情，弄清楚在你的战略中最能做什么，因为你将需要团队聚在一起才能成功实施和执行你的战略，但无论如何你都不想试图把所有事都做完。


  你的机器学习战略的一部分必须关乎目的、复制和重用。这将成为为组织挽回价值的核心。可定义和可重复的结果是可预测机器学习项目的基础。机器学习通常作为可定义和可重复流程的一部分应用于生产系统。这就是你获得质量和速度的方式。你必须设置护栏，将事物限制在该模型可能的范围内。除此之外，你必须明确使用机器学习为你的组织做某事的目的。


  我认为思考你在机器学习项目中能去哪里、能做什么真的很重要。所以现在我们看了可能的事情并审视了许多那些用例，我们可以深入探讨 MLOps [3]。


