  # 前言


  问候，受启发的机器学习荣耀读者。


  当我于 2021 年初开始这项事业时，几乎每个人似乎都在写 Substack。作为一个平台，Substack 迅速增长，一度占据了公众视野的几个焦点时刻。目前只有少数
  Substack 作者仍能从人群中脱颖而出。像所有拥有社区的时事通讯或写作项目一样，受众决定了持续成功的成败。这系列每周文章被汇编成了一部手稿。每篇文章都经过编辑，从原始形式转变为更适合出版的格式。Substack
  作为一个平台，提供了极大的自由度来包含链接和嵌入式内容，但这些无法转化为书面页面。


  我注意到的一件事是，前几篇文章比系列末尾的文章长得多。看来当我开始笼统谈论机器学习时，我想表达的相关内容要多得多。鉴于每周的文章都是为独立阅读而写，我的所有参考资料都以直观的脚注方式处理。任何旁注、链接或对其他作者的致谢都发生在章节末尾的脚注中。


