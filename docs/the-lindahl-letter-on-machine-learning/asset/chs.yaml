  # Substack 第 34 周：主要人工智能实验室在哪里？


  发布于 2021 年 9 月 17 日


  本周 The Brookings Institute 发布了一份关于人工智能的有趣报告。由 Mark Muro 和 Sifan Liu 撰写，标题为“The Geography
  of AI: Which Cities Will Drive the Artificial Intelligence Revolution?” [1]。你可以下载这份制作精良的完整报告，或者获取较短的执行摘要
  [2]。我的建议是去阅读完整报告。它值得花时间和精力投入。我们最近获得了大量阅读材料，我知道机器学习领域充满源源不断的新内容。请务必查看报告第 13 页。它有一张地图显示“AI
  employment concentration by U.S. metropolitan area”（美国大都市区人工智能就业集中度）。你会很快意识到，一群公司正在推动所有这些招聘，它们在该报告第
  15 页底部的 Table 2 中有介绍。这是地理位置上的“老面孔”：“这些包括八个大型科技中心——纽约；波士顿；西雅图；洛杉矶；华盛顿特区；圣地亚哥；德克萨斯州奥斯汀；和北卡罗来纳州罗利——以及五个相对于其规模拥有大量人工智能活动的较小大都市区：科罗拉多州博尔德；内布拉斯加州林肯；加利福尼亚州圣克鲁兹；加利福尼亚州圣玛丽亚-圣巴巴拉；和新墨西哥州圣菲。”


  撇开关于人工智能领域工作地理强度的那堆史诗级研究不谈，让我们深入探讨本周的主要问题：“主要人工智能实验室在哪里？”这个问题有趣的一点在于，像 EleutherAI
  和 Hugging Face 这样的团体是否应该被包括在内。为求简单起见，我将承认我考虑过这一点，然后转向通常在你思考人工智能实验室时会考虑的那些更大牌的参与者。






  # Google Brain 团队虽然官方总部设在加利福尼亚州山景城


  Google Brain 团队虽然官方总部设在加利福尼亚州山景城，但他们在世界各地都设有分支小组 [3]。他们在博尔德或丹佛没有团队，这有点令人惊讶。别忘了 DeepMind
  早在 2014 年就被 Google 收购，并在加拿大、法国和美国设有研究中心 [4]。OpenAI 总部位于加利福尼亚州旧金山 [5]。稍作调查后，我勉强也需要列入
  FAIR（Facebook AI Research，Facebook 人工智能研究院）的地理位置 [6]。他们分布在加利福尼亚州门洛帕克、西雅图、巴黎和纽约市
  [7]。总的来说，你可以看到人们协同工作的主要人工智能实验室地点都很相似。首段提到的那份 Brookings 报告用一份相当合理的数据集基本证实了这一推测。


  下一波关于一些真正有趣事物的协作浪潮，正发生在一些较小的开源项目和努力中。这些努力汇聚了来自世界各地的人才。考虑到我们正处于人们训练和学习人工智能的黄金时代，这种扩张将呈指数级增长，直到工作的本质发生改变。


  我读了 The Conversation 上的一篇文章，标题是“Google 和 Microsoft 正在用自然语言编程制造垄断” [8]。它让我思考：自然语言编程的重大进步，是会让上述知识工作实现民主化，还是人工智能和机器学习领域的变革与创新速度将再持续十年，直到饱和或耗竭在技术层面产生一种巨大的均衡效应。


