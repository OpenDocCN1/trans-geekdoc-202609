  # Substack 第 43 周：实用机器学习


  **发布日期**: November 19, 2021


  多年来，我修读了大量 Coursera 上与机器学习相关的课程 [1]。实验室和学习体验变得如此先进，令人惊叹；你可以在云端启动一个真实的环境，在那里你可以真正利用机器学习和精选数据集进行操作。这是过去五年实用机器学习蓬勃发展的方式之一
  [2]。在撰写此句时，约翰霍普金斯大学的实用机器学习课程已有 141,649 人注册。了解机器学习并投入到实际用例中，最终将代表实用机器学习最小的用例。随着时间的推移，最普遍的用例将是机器学习内置于人们正在使用的产品中。Google
  的开发者已将公式建议功能发布到 Google Sheets 产品中 [3]。多年来，Microsoft 的开发者一直致力于将机器学习构建到与 Office 相关的产品中。其中一些利用机器学习扩展了
  Microsoft Excel [4]。你可以看看 Yannic Kilcher 发布的视频，或热门机器学习课程的学习人数。你会很快意识到，大约 10,000
  人的受众会出现在许多机器学习内容中。向会议提交论文的研究人员数量和深度关注机器学习的受众，远少于 LinkedIn 上目前开放的机器学习职位数量，后者在美国的搜索结果约为
  153,481 个 [5]。


  除了机器学习领域的直接专业知识外，Google Sheets 或 Microsoft Excel 等产品的用户，得益于实用机器学习应用于现实场景，正在体验增强型体验。当机器学习被积极分发到电子表格世界时，应用机器学习的发生率将以远超一个数量级的指数级增长。截至
  2021 年 6 月，美国使用 Office 365 的公司数量超过 700,000 家 [6]。许多人将 Microsoft Excel 用于各种用途。这确实改变了职场中应用机器学习的动态，以及普通人的动态。由公司构建并内置到产品中的机器学习项目所产生的用例，其覆盖面将远大于基于这些主要行业驱动业务工具的任何东西。在这两个我正在考虑的用例之间——人们从事机器学习，以及人们从产品中的实用机器学习中受益——这真正是机器学习的黄金时代。


  花一些时间思考实用机器学习，让我好奇机器学习在该领域的下一步是什么。我对人们将用应用机器学习做什么新奇的事情感到好奇。越来越多的产品将把它内置到其核心功能中。


