    ## Substack 第 22 周：机器学习图形学


    发布于 2021 年 6 月 25 日


    您可以去查看 Hugging Face 关于 Transformer 模型的新课程：


    `https://twitter.com/nelslindahl/status/1408052384857686018`


    您可能猜到这篇文章可以朝多个方向发展。专注于为机器学习获取新显卡有多难，或者其他任何事情，都很容易。芯片短缺是真实存在的，让我想抨击加密货币挖矿，但我不会花时间做那种分析。您可以在互联网上到处看到相关报道
    [1]。本周我想探讨的是：人们究竟在做什么与使用机器学习技术相关的图形学工作。是的——我的兴趣纯粹是一个技术问题，关于人们在机器学习领域用图形学做什么。


    也许合乎逻辑的起点是 TensorFlow Graphics [2]。您可以快速访问 TensorFlow 网站，了解如何使用图形 API [3]。人们利用网络摄像头和其他基础部署在浏览器中完成的一些工作，展示了图形学如何用于模拟行为或让事物“动”起来，这些已变得无处不在，但这并不降低其表面价值的趣味性。


