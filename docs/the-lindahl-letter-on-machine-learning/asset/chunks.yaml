- raw: 'You get a lot of benefits from using an API service to support your machine
    learning use case. Most of those APIs have supported and will continue to support
    a multitude of different efforts. That means that the model delivery, although
    not specialized to your use case, is proven over time. You get to save on all
    the training and ongoing maintenance of models. If you are running a smaller company,
    then you also get the benefit of having all that other data in the real work conditioning
    and grounding the model. Those API services are not going to be highly specialized,
    and you sort of get what you get when it comes to using this method of getting
    your machine learning use case up and running. The cost is predictable per unit
    or, in most cases, per bunch of uses. That means you have to forecast how many
    times you are going to use the API on a monthly basis to predict cost and sustain
    your ROI models. 


    Bucket 2: “Places you can be,” or ecosystems where you can build out your footprint


    Some cost-forecasting calculators in the cloud are better than others. When you
    start building out your footprint in the cloud, you are going to find compute
    and storage start to combine forces and introduce costs to your organization.
    With more data and more compute to run against that data, your cost modeling is
    going to change. Those first few sentences of this paragraph might not have said
    machine learning, but they are inclusive of considering it. The totality of the
    data you need to work with, pipeline, transform, modify, or train models on is
    going to introduce costs within your cloud footprint. Somebody getting really
    excited about training data in the cloud can rent out a ton of cool hardware to
    make it happen faster. That might seem to them in the moment like a most excellent
    use of the cloud; it could end up being expensive. Maybe it was worth it in a
    short burst to get going and have that machine learning use case and model deployed
    to production. In that case, then, the whole training setup needs to be turned
    off as soon as possible to constrain the costs. Leave that on and training will
    just keep adding to the cost. You will find that you can get some pretty epic
    hardware in the cloud dedicated to your machine learning efforts. Some of it is
    priced more reasonably than other parts. 


    Bucket 3: “Building something yourself,” such as open-source and self-tooled solutions


    Depending on your setup, this bucket might not have any appreciable cloud costs.
    A lot of startups and other organizations might train on a small physical machine
    or rack. When you are building something yourself, you just have to figure out
    what the costs of that hardware would be, including any other associated costs
    like where it resides, how it is backed up, power, and internet. 


    Substack Week 17: Figuring out machine learning readiness


    Published on May 21, 2021


    Starting out along your machine learning journey can be an interesting and exciting
    time. People are probably trying to sell you on the benefits of a multitude of
    things. You can find academic interpretations and checklists of readiness for
    machine learning in production \[1\]. A lot of checklists and other rubrics exist.
    The very first place I start to question at the start of any machine learning
    journey happens to be the basic use cases the company handles. You need to start
    out with some back-of-the-envelope sketches of what exactly the company is trying
    to do or is actually doing. Maybe they are selling something or providing some
    type of service. After getting that initial sketch of what is happening, the next
    question is about your data storage, KPIs, and objective measures. Mentally I’m
    sketching out the use case the company is trying to achieve and how they are reporting
    and monitoring that use case. Between those two things is where your machine learning
    readiness is going to unfold. Maybe a straightforward API integration with AWS,
    GCP, or Azure could get you going without a ton of effort. It’s entirely possible
    that could be the answer, and getting going might happen very quickly. 


    Outside of your basic API-driven integrations for your use cases in the machine
    learning space, you are going to start to open the door to some fun and fantastic
    efforts that are highly specialized and custom. That is where things are going
    to get more difficult, and your data availability is going to determine your machine
    learning readiness. Building out something using internal tooling on your own
    or with a pattern is going to end up in data exploration followed by MLOps planning. 


    Boiling down your efforts to figure out your machine learning readiness could
    be summed up within these five questions to get you started:


    What are you actually trying to do? (the use case question)


    How are you collecting and storing data?


    Are your use case and data collection/storage aligned?


    Should you partner with a vendor, or are you ready internally to drive this forward?


    Have you considered the ROI, compendium of KPIs, and budget-level investments
    that are going to be required?


    Footnote:


    \[1\] Check out “ The ML Test Score : A Rubric for ML Production Readiness and
    Technical Debt Reduction”


    Substack Week 18: Could machine learning predict the lottery?


    Published on May 28, 2021


    I had a great time talking last week during the Argyle Digital panel discussion,
    “Language Arts—Crafting Effective Techniques to Advance NLP” as part of the DATAx
    conference. You can watch the panel discussion for free via this link: https://twitter.com/nelslindahl/status/1395842590256160772


    You can see the video here: https://vimeo.com/553105304


    Could machine learning predict the lottery? Trying to predict the lottery is not
    a novel effort. People have considered this in a variety of ways. You can Google
    this question, and the results are pretty interesting. I ended up watching a video
    on YouTube from 2018 by Raj Ramesh \[1\]. My next searching effort was aligned
    to trying to find some academic work on the subject. That effort involved taking
    a few quick strolls around Google Scholar and then heading over to ArXiv to see
    if maybe something was in pre-print \[2\]. Some research does exist and seems
    to surround a concept called the lottery ticket hypothesis. That research will
    not help you predict the lottery using machine learning or artificial intelligence.
    It actually seems to be explaining why the introduction of luck with overfitting
    is interesting but problematic.


    A lot of people (349 citations worth) seem to like to reference a paper out of
    MIT CSAIL by Jonathan Frankle and Michael Carbin called, “The Lottery Ticket Hypothesis:
    Finding Sparse, Trainable Neural Networks,” which was sent to pre-print in 2018
    and published officially in the proceedings of the 2019 International Conference
    on Learning Presentations \[3\]. From the abstract: “We articulate the lottery
    ticket hypothesis: dense, randomly-initialized, feed-forward networks contain
    subnetworks (winning tickets) that—when trained in isolation— reach test accuracy
    comparable to the original network in a similar number of iterations. The winning
    tickets we find have won the initialization lottery: their connections have initial
    weights that make training particularly effective.”


    What does that really tell us about how machine learning could predict the lottery? '
