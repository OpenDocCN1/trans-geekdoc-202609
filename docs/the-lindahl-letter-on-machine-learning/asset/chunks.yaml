- raw: 'Based on time, we can only spend a few moments on the compendium of KPIs and
    how important that is to the overall execution of your machine learning strategy.
    You must be able to present the results of machine learning within the organization
    in terms of ROI and other key drivers that show criticality to the business. Honestly,
    you must be able to think about your machine learning dashboard as something that
    is so simple to consume that in 30 seconds the overall status is consumable and
    intuitive to understand. That is good reporting. It takes time and a lot of hard
    work to pull off, but it is impactful when you do get to this point in the execution.
    I personally begin with the end in mind as part of my strategy, and while people
    are executing, I work to figure out how to compile the measures and how to tell
    the story. Sometimes the teams directly involved in the work do not have the time
    to dig in and dashboard as they are building and turning models. Getting the data
    sorted and ready to use alone is a major milestone in your machine learning journey.
    Pairing that with a dashboard at the same time can feel overwhelming to a team.


    Everything about figuring out how to use machine learning in your organization
    must come down to a strategic plan. You need to figure out how to visualize that
    strategic plan in action, which probably will involve having a compendium of KPIs
    that show the value within delivering your machine learning solution. Beginning
    with that outcome in mind is important. It helps to frame the entire solution
    being operationalized. At a strategic level, the things being operationalized
    by teams must contribute to specific budget-based outcomes. That inherently connects
    expenditure to benefit throughout the organization in a measurable way.


    From ideation to being operationalized, machine learning benefits must be mapped
    to a KPI. All those things wrapped up together in a compendium help present a
    picture of what strategic planning is contributing to specific action. All that
    gets defined in the form of clear and understandable results. Bringing those examples
    together within a compendium is the right way to ensure the organization has a
    clear view of what is going on. Understanding how the elements of the compendium
    of KPIs work together is what helps people visualize the strategic plan the organization
    is executing. It paints a very clear picture of the strategy and whether that
    strategy is being operationalized correctly.


    8.  What are some examples of machine learning turning the wheel?


    Processes abound in the workplace. Some sets of processes come together to form
    a workflow. Within that workflow, machine learning could help engage in a turn
    of the wheel. That specific application of machine learning could help push things
    forward, nudge things along, or even keep the train on the tracks if that is the
    desired outcome. Some of the ways I have seen machine learning turning the wheel
    include recommendations, detection, sorting, and assistive deployments. Every
    one of those possible turns can help add value and make machine learning part
    of ongoing strategic planning.


    In the health care space, we are seeing increasingly valuable diagnostic tools
    starting to show up. Models are being deployed that engage in complex detection
    from images. Some of those models have been highly accurate in identifying skin
    cancer or even checking for potential signs of atrial fibrillation. Each one of
    those advances helps turn the wheel just a little bit, allowing automation of
    tasking to help push things forward. Even if these advances in the health care
    space turn out to only be assistive for physicians, they are still major contributions.


    Substack Week 15: What are people really doing with machine learning?


    Published on May 7, 2021


    Machine learning is being built into just about everything these days. At this
    point, the largest user base of people accessing machine learning directly will
    probably be from Microsoft Excel \[1\]. You could probably make the argument that
    the machine learning happening on phones related to pictures is the single most
    active machine learning use case and you might be right in terms of pure passive
    computation. A lot of other office productivity software can invoke machine learning
    directly. Outside of machine learning being built into applications and software
    the next place to go looking to figure out what people are really doing with machine
    learning is to start looking at common use cases.


    During the course of my research and analysis related to machine learning, about
    26 use cases ended up making my list. That list is not exhaustive by any means.
    It is a good start in terms of thinking about what people are really doing with
    machine learning out in the wild. A lot of attention has been spent on computer
    vision machine learning related to the self-driving cars use case. Autonomous
    vehicles are an interesting pursuit and a fine use case for machine learning.
    During the course of driving a lot of it is very definable and repeatable. A lot
    of special cases and unique scenarios exist.


    Product recommendations


    Image recognition


    Account prioritization


    Lead prioritization


    Monitoring systems


    Speech recognition


    Marketing targeting


    Fraud detection


    Inventory management


    General forecasting


    Customer experience


    Voice assistants


    Dynamic pricing


    Email management


    Sentiment analysis


    Time series forecasting


    Image analysis


    Geospatial analysis


    Streamline data


    Optimize operations


    General chatbots


    Targeted chatbots (service/help)


    Health check monitoring


    Anomaly detection


    Sound pattern matching


    Sales trending


    Part of my research efforts were to place those use cases on a chart that evaluated
    scale versus maturity. See Figure 2 again. 


    Figure 2. General machine learning use cases: Scale versus maturity


    ![](media/file6.jpg)


    Footnote:


    \[1\] Data Analysis, Machine Learning and Microsoft Excel or check out this link
    from Venturebeat


    Substack Week 16: Ongoing machine learning cloud costs


    Published on May 14, 2021


    People make decisions about where to run instances of machine learning every day
    in the business world. Previously, we have talked about how that ongoing expense
    of being in the cloud is moving toward APIs from Azure, AWS, and GCP. Back during
    my Substack Week 11 post, “ What is ML scale? The where and the when of ML usage,”
    I introduced a concept that needs to be referenced here. That concept includes
    breaking down the categories of machine learning use cases into three buckets:


    Those three buckets are a useful construct to consider the ongoing machine learning
    cloud costs you might face. Those ongoing expense-based costs are going to end
    up falling into one of those buckets, and they present very differently. 


    Bucket 1: “Things you can call,” such as external API services


    This is an exciting and growing place to be. You found a use case that works for
    you, and you are ready to go out and work with an API from Azure, AWS, or GCP.
    A ton of them exist and can present an answer for a ton of different workflows.
    See Figure 1 again. 


    Figure 1. Common API use cases: Scale versus maturity


