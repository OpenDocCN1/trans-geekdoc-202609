    Conceptually I have been breaking down the categories of machine learning use
    cases into three buckets:


    - **“Things you can call,”** such as external API services

    - **“Places you can be,”** or ecosystems where you can build out your footprint,
    such as `AWS`, `GCP`, `Azure`, and many others that are springing up for machine
    learning operations (`MLOps`) delivery

    - **“Building something yourself,”** such as open-source and self-tooled solutions


    That categorization helps me think about where things for the use case are going
    to happen. It is a tactical rather than a strategic question. Each of the three
    buckets will receive more coverage later in this series [3]. In terms of API services,
    you can scale very quickly. You can go out right now and get access to several
    API machine learning solutions on `AWS`, `Azure`, or `GCP` without any real barriers.
    The level of friction to enter that external-technology-driven use case is relatively
    low. Seriously, these solutions are really low-friction options with highly scalable
    infrastructure on the back end. People are using them all over the place right
    now [4].


    ### Footnotes


    [1] https://www.youtube.com/watch?v=5dAZTvbmZZ4


    [2] Check out this fun little article from Forbes : https://www.forbes.com/sites/forbesinsights/2020/05/08/realizing-the-growth-potential-of-ai/?sh=1f25069033f3


