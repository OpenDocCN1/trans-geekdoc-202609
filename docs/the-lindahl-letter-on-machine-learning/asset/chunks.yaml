- raw: "\n\n![](EPUB/cover.jpg)\n\n# \n\n![](media/file0.jpg)\n\n# \n\nThe Lindahl\
    \ Letter: On Machine Learning\n\nALSO BY NELS LINDAHL\n\nNonfiction Books\n\n\
    Graduation With Civic Honors\n\nResponsive E-Government\n\nThe Lindahl Letter:\
    \ On Machine Learning\n\nBy Nels Lindahl\n\n“It takes someone willing to work\
    \ just beyond the edge of what is possible to accomplish something meaningful.”\n\
    \n: \n\nNels Lindahl ~\n\nThe Lindahl Letter: On Machine Learning\n\nAll Rights\
    \ Reserved © 2022 by Nels Lindahl\n\nNo part of this book may be reproduced or\
