    an API to your workflow or having the pipelines necessary to interact with your
    deployed model at scale. A ton of different open-source MLOps tools do that, and
    I have shared my analysis on them publicly. Being able to actively use these types
    of tools at scale and in production is a skillset. It is a skillset that is markedly
    different from the model-creation and data-management skills mentioned above.
    Running and operationalizing machine learning at scale is about the day-to-day
