    所以，我们还没有看到所有人蜂拥而至并开始使用这些东西。原因之一在于之前的图表（第 11 周的图 1），当我们看到 API 的不同事物时。你开始思考存在的不同生态系统：从存储桶中的某物到你可以到达的地方的管道和生态系统。


    你将开始使用可用的生态系统工具。所以如果你进入 Bucket 2，你在 Azure 上、在 GCP 上，就必须做决定。如果你在 AWS 上，你将在该生态系统可用的机器学习堆栈中工作。这就是你选择去那里的原因。


    我认为这里非常有趣，你可以看到这些项目的分支数都没有像之前那样多。所以这个领域，我们可以把这些项目拆解到一个图表（图 3）中，它有点类似于之前的图表（图 1）。


    **图 3. MLOps：规模与成熟度**


    ![](img/file5.png)


    你将看到我认为这里存在一个广泛的光谱。现在，你可能不完全同意我根据规模和成熟度对这些事物的定位，这没关系。随时欢迎你告诉我，如果你对其中某项技术有不同的看法。根据你的机器学习用例所处的阶段，你将会有非常不同的机器学习运维。


    主要参与者将在该领域占据主导地位。所以我认为这就是你开始看到之后其他事物真正起飞的地方，它们确实拥有充满活力的生态系统和社区。例如 **Weights &
    Biases**，人们对它非常感兴趣，并且它周围有一个充满活力的社区。其他一些项目绝对也有充满活力的社区，并且正在建设中。


    在未来一年左右，我将关注并寻找哪些项目真正冒泡上升，成为 Bucket 3 实例中超级成功的项目，人们在构建东西并需要 MLOps 工具来成功落地其战略。因为将会有大量事情不是在生态系统外完成的。


    那不会是草稿类型的东西。那将是你在机器学习领域所做并构建的东西，以达到那个层级。那个层级不会来自 API，因为那不会是你购买的用来做这些事的预训练模型。


    人们将想要做复杂且直接与其业务交付相关的事情。那些业务用例和你机器学习工作流中用于交付的那些高度定制的、特定的用例，将需要远超 API 所能提供的东西。


    因此，鉴于你将开始看到的这种交付，这些 MLOps 公司、GitHub 项目和事物将真正起飞。在未来一年左右，我将关注究竟哪些获得主导市场份额。


    ## 总结


    我们涵盖了什么？


    好吧，我们涵盖了规模究竟是什么的初步概念，对吧？我们谈到了 Bucket 1、Bucket 2 和 Bucket 3，那些图表讲过有一阵子了，可能已经失去了含义。


    - **Bucket 1 是 API**。它是你现在可以出去直接获取的东西，但你可以连接到它并开始在工作流中使用它。

    - **Bucket 2 包含那些生态系统中的事物**，我们将在该生态系统中构建你的机器学习，使用它们的工具。

    - **Bucket 3 将是当你处理本地构建的事物时、当你使用那些开源工具时、当你在自己的环境中构建时，究竟能发生什么的展望**。


