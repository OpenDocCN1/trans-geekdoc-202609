    \ the talent to work together?\n\nSubstack Week 4: Have a machine learning strategy…revisited\n\
    \n1.  What exactly is a machine learning strategy?\n\n2.  Do you even need a machine\
    \ learning strategy?\n\nSubstack Week 5: Let your ROI drive a fact-based decision-making\
    \ process\n\nSubstack Week 6: Understand the ongoing cost and success criteria\
    \ as part of your machine learning strategy\n\nSubstack Week 7: Plan to grow based\
    \ on successful ROI\n\nSubstack Week 8: Is the machine learning we need everywhere\
    \ now?\n\nSubstack Week 9: Valuing machine learning use cases based on scale\n\
    \nSubstack Week 10: Model extensibility for few-shot GPT-2\n\nSubstack Week 11:\
    \ What is machine learning scale? The where and the when of machine learning usage\n\
    \nBrief presentation abstract\n\nResearch disclaimer\n\nSection 1: Initiating:\
    \ What is scale exactly?\n\nSelection 2: Analyzing: Common machine learning use\
    \ cases: “Scale versus maturity”\n\nSection 3: Directing: Leaning into machine\
    \ learning scale\n\nSubstack Week 12: Confounding within multiple machine learning\
    \ model deployments\n\nSubstack Week 13: Building out your MLOps\n\nWhat did we\
    \ cover?\n\nSubstack Week 14: My Ai4 Healthcare NYC 2019 talk revisited\n\n1.\
    \  Where does the talent come from?\n\n2.  How do you get the talent to work together?\n\
    \n3.  What are these workflows, and why do they matter?\n\n4.  What problems can\
    \ you solve with machine learning?\n\n5.  What exactly is a machine learning strategy?\n\
    \n6.  What do you mean by machine learning vectors?\n\n7.  What is a compendium\
    \ of KPIs?\n\n8.  What are some examples of machine learning turning the wheel?\n\
    \nSubstack Week 15: What are people really doing with machine learning?\n\nSubstack\
    \ Week 16: Ongoing machine learning cloud costs\n\nBucket 1: “Things you can call,”\
    \ such as external API services\n\nBucket 2: “Places you can be,” or ecosystems\
    \ where you can build out your footprint\n\nBucket 3: “Building something yourself,”\
    \ such as open-source and self-tooled solutions\n\nSubstack Week 17: Figuring\
    \ out machine learning readiness\n\nSubstack Week 18: Could machine learning predict\
    \ the lottery?\n\nSubstack Week 19: Fear of missing out on machine learning\n\n\
    Substack Week 20: Week 20 Lindahl Letter recap edition\n\nSubstack Week 21: Doing\
    \ machine learning work\n\nSubstack Week 22: Machine learning graphics\n\nSubstack\
    \ Week 23: Fairness and machine learning\n\nSubstack Week 24: Evaluating machine\
    \ learning\n\nSubstack Week 25: Teaching kids\n\nSubstack Week 26: Machine learning\
    \ as a service\n\nSubstack Week 27: The future of machine learning\n\nSubstack\
    \ Week 28: Machine learning certifications?\n\nSubstack Week 29: Machine learning\
    \ feature selection\n\nSubstack Week 30: Integrations and your machine learning\
    \ layer\n\nSubstack Week 31: Edge machine learning integrations\n\nSubstack Week\
    \ 32: Federating your machine learning models\n\nSubstack Week 33: Where are artificial\
    \ intelligence investments coming from?\n\nSubstack Week 34: Where are the main\
    \ artificial intelligence labs?\n\nSubstack Week 35: Explainability in modern\
    \ machine learning\n\nSubstack Week 36: AIOps/MLOps: Consumption of artificial\
    \ intelligence services versus operations\n\nSubstack Week 37: Reverse engineering\
    \ GPT-2 or GPT-3\n\nSubstack Week 38: Do most machine learning projects fail?\n\
    \nSubstack Week 39: Machine learning security\n\nSubstack Week 40: Applied machine\
    \ learning skills\n\nSubstack Week 41: Machine learning and the metaverse\n\n\
    Substack Week 42: Time crystals and machine learning\n\nSubstack Week 43: Practical\
    \ machine learning\n\nSubstack Week 44: Machine learning salaries\n\nSubstack\
    \ Week 45: Prompt engineering and machine learning\n\nSubstack Week 46: Machine\
    \ learning and deep learning\n\nSubstack Week 47: Anomaly detection and machine\
    \ learning\n\nSubstack Week 48: Machine learning applications revisited\n\nSubstack\
    \ Week 49: Machine learning assets\n\nPostlogue\n\nAbout the author\n\nPreface\n\
    \nGreetings, inspired reader of machine learning glory.\n\nPretty much everybody\
    \ seemed to be writing a Substack when I began this endeavor at the start of 2021.\
    \ As a platform, Substack grew very rapidly, capturing a few moments of attention\
    \ from the public mind. Currently only a few Substack authors still stand out\
    \ from the crowd. Like all newsletters or writing efforts with a community, the\
    \ audience makes or breaks ongoing success. This series of weekly posts was compiled\
    \ into a manuscript. Each post has been edited from the original form into a more\
    \ publication-friendly format. Substack as a platform provides a lot of freedom\
    \ to include links and embedded content, which does not translate into the written\
    \ page. \n\nOne of the things I did notice is that the first few posts were much\
    \ longer than the ones at the end of the series. It appears that when I started\
    \ talking about machine learning in general, the amount of content related to\
    \ things I wanted to say was much larger. Given that each week is written to be\
    \ independently consumed, all of my references are handled in a straightforward\
    \ footnote method. Any aside, link, or acknowledgment to another author happens\
    \ in the footnotes ending the chapter.\n\nThings in this highly technology-driven\
    \ space are changing rapidly. I included the date of publication as a frame of\
    \ reference.\n\nDr. Nels Lindahl\n\nBroomfield, Colorado\n\nDecember 15, 2021\
    \ @ 7:49 PM\n\nSubstack Week 1: Machine learning return on investment\n\nPublished\
    \ on January 29, 2021\n\nBe strategic with your machine learning efforts.\n\n\
    Be\n\nstrategic\n\nwith\n\nyour\n\nmachine\n\nlearning\n\nefforts.\n\nSeriously,\
    \ those seven words should guide your next steps along the machine learning journey.\
    \ Take a moment and let that direction (strong guidance) sink in and reflect on\
    \ what it really means for your organization. You have to take a moment and work\
    \ backward from building strategic value for your organization to the actual machine\
    \ learning effort you are undertaking. Inside that effort you will quickly discover\
    \ that operationalizing machine learning efforts to generate strategic value will\
    \ rely on a solid plan for return on investment (ROI). Make sure you are beginning\
    \ with that end in mind to increase your chances of success. Taking actions within\
    \ an organization of any kind at the scale machine learning is capable of delivering,\
    \ without understanding the potential ROI or potential loss, is highly questionable.\
    \ That is why you have to be strategic with your machine learning efforts from\
    \ start to finish.   "
