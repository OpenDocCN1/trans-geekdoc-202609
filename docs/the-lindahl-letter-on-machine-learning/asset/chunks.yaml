- raw: 'If your team is starting to dig into using machine learning models to do something,
    then you will quickly begin to think about recommendations, detection, sorting,
    and assistive processes. You will find that machine learning in the wild is going
    to be all about the data and the use case. Do you have a source of data that is
    dependable and reliable, and does that data support your goal? Recently, it feels
    like a lot of more assistive type machine learning algorithms are being built
    to help speed up workflows and reinforce processes in the workplace.


    Making a recommendation is one problem that machine learning algorithms tackle
    well. Within a workflow involving purchasing, making recommendations is useful
    and can be very powerful. Really dialing in recommendations to have them be targeted,
    insightful, and useful can make a solid recommendation engine highly successful.
    Like anything else, it must be turned and maintained or diminishing returns will
    occur. You can only recommend the same thing so many times to the same user before
    it becomes ignored without effort.


    A ton of detection systems exist. Some are related to computer vision within the
    automotive space, and a lot of them are built around working with images. These
    are some of the most interesting use cases out in the wild right now.


    Building out awesome sorting machine learning algorithms always creates the possibility
    for fun. One of the best use cases for sorting machine learning must be the reduction
    of unwanted emails. That type of effort has almost worked too well recently.


    One of the exciting use cases developing out in the wild right now happens to
    be related to assistive processes and other forms of automation. It is amazing
    what can be built and utilized right now to help make things happen quicker and
    to take definable and repeatable processes and make them occur without effort.


    5.  What exactly is a machine learning strategy?


    We talked about talent, teams, and workflows and problems. Now it is time to dig
    into your machine learning strategy. I held off on this one until we had some
    foundational ground set up to walk here. Part of your machine learning strategy
    must be about purpose, replication, and reuse. Machine learning is typically applied
    in production systems as part of a definable and repeatable process. That is how
    you get quality and speed. You have guardrails in place that keep things within
    the confines of what is possible for that model. Outside of that, you must be
    clear on the purpose of using machine learning to do something for your organization.


    You could do it for purely employee engagement, because the team just really wants
    to do something cool. You may find yourself in a situation where the team really
    wants to do it, and you can make that happen. Sure, they might figure out a novel
    way to use that energy and engagement to produce something that aligns to the
    general guiding purpose of the organization. Some of that is where innovation
    might drive future strategy, but it is better to have your strategy drive the
    foundations of how innovation is occurring in the organization.


    Apply your philosophy in a uniform way based on potential ROI. After you do that,
    you will know you are selecting the right path for the right reasons. Then you
    can begin to think about replication of both the results and process across as
    many applications as possible. Transfer learning really plays into this. After
    you figured out how to apply processes with quality and speed, applying them to
    a suite of things can happen much more quickly. That is the power of your team
    coming together and being able to deliver results.


    Seeing the strategy beyond trees in the random forest takes a bit of perspective.
    Sometimes it is easier to lock in and focus on a specific project and forget about
    how that project fits into a broader strategy. Having a targeted machine learning
    strategy that is applied from the top down can help ensure the right executive
    sponsorship and resources focused on getting results. Instead of running a bunch
    of separate self-incubating efforts, have a definable and repeatable process to
    roll out and help ensure the same approach can be replicated in cost-effective
    ways for the organization.


    An example of a solid machine learning strategy might be related to a cost-containment
    or cost-saving program to help introduce assistive machine learning products to
    allow a workforce to do things more quickly with fewer errors. Executing that
    strategy would require operationalizing it and collecting data on the processes
    in action to track, measure, and ensure positive outcomes.


    6.  What do you mean by machine learning vectors?


    Now that we have kicked the tires on machine learning strategy, we need to really
    dig into the hard stuff. I know everything else that I have been talking about
    today has been leading up to this. We are really going to dig into machine learning
    vectors. This is the most technical part of machine learning we are going to talk
    about today, and it can be a little hard to begin to attack. That is why we are
    going to start small and work our way up to the hard things. Using machine learning
    at scale means that you have figured out how to use the model within your technology
    stack and you know how and where to apply that model.


    This is where vectors really come into play. If you have a stream of data and
    you need to call an API to an external product that verifies the images, that
    is an important part of the vector. In this case, your vector is an external approach
    point that allows that API to probably jump outside of your workflow and to apply
    a machine learning model. At this point, the model executes, the image is identified,
    and data are passed back; ideally that is happening near real time. If you are
    having to send over huge images to the external source and you have transport
    latency and model work time to account for, your lightning-fast stream might be
    slowing down rapidly.


    However, if your vector is internal and lightweight enough to run as the image
    is stored or even processed in memory as the stream is occurring, you have faster
    access to usable information.


    Okay—let’s try to explain this in a different way. Data arrive in a lot of different
    ways. The method of transport and where the data are being transported can form
    a vector. In this very specific use of the word vector , within the use case I
    am trying to describe how machine learning would be applied to some type of incoming
    data. This could be during an API exchange, it could be an API call within a process,
    on an internal cloud using a trained model, reaching across to an external cloud,
    on premise within your datacenter, or even within an edge computing instance.
    At the edge, you will need to make sure your model is well trained and deployed
    in a lightweight way to help drive your use case without adding a bunch of computing
    time within what should be your fastest use case.


    Figuring out the right way to apply a machine learning algorithm requires planning.
    Knowing how the application will work and where it will be is important. Knowing
    the vector makes a big difference on the flow of data and what can be done is
    important. In my mind, that makes it fundamental to thinking about how to design
    and deploy a machine learning model in production. Dealing with streaming data
    makes the directionality of the vector even more important to consider.


    7.  What is a compendium of KPIs?'
