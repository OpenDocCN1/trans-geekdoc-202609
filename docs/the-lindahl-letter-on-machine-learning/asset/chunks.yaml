    # 阅读关于异常检测的文章


    本周阅读关于异常检测的文章颇有收获。有趣的是，可以看到人们是如何构建机器学习模型、监管机器学习模型，以及尝试新技术以观察会发生什么。处理数据安全方面的内容要容易得多，你可以创建合成数据流，并以医疗领域无法实现的方式使用模型
    [2]。我最终读到美国食品药品监督管理局（FDA）提出了一个监管框架 [3]。这让我开始好奇该提议框架是否已获批准。看来他们正以审前评审的形式，对 2019
    年 4 月 2 日的讨论文件 [4] 进行大量考量。我仍在进一步深入了解审批流程，以明白有哪些模型获批了。总体而言，安全领域的模型考量与批准是在无限制的情况下进行的。这与医疗研究领域模型的使用方式截然不同。


    花些时间思考并查看有哪些公开可用的医疗研究数据集，本身就可以成为一个独立的话题。我打算把它加到未来讨论的清单中。


