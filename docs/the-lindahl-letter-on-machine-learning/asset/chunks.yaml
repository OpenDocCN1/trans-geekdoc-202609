    # Substack Week 3: Machine learning teams


    Published on February 12, 2021


    ## Learning and team building


    Learning. Keep learning. Being a lifelong learner is a solid plan. I do honestly
    believe we live in a golden age of machine learning training and talent. People
    are selflessly sharing world-class training materials and code on GitHub. The
    number of academic papers being shared is skyrocketing [1]. For those folks able
    to start sprinkling in a little bit of expertise as you go, you can start building
    teams from the ground up. That starts by helping people invest in understanding
    this type of machine learning knowledge. That sets the foundation for them so
    they can build the machine learning pipelines you need with something like TensorFlow
    Extended examples [2]. That is one way to help them understand how those pipelines
    work for building and deploying. I think all the training to be able to do that
    is just amazingly available online; people have been super gracious with sharing
    that kind of knowledge.


    ## Footnotes


    [1] Links to the referenced machine learning pipelines: `https://www.tensorflow.org/tfx`,
    `https://aws.amazon.com/sagemaker/pipelines/` or `https://docs.microsoft.com/en-us/azure/machine-learning/concept-ml-pipelines`


    [2] One of the best places to start to learn about machine learning communities
    would be `https://www.kaggle.com/`


    [3] Read this if you have a few minutes, it is worth the read: `https://hbr.org/2020/09/how-to-win-with-machine-learning`


    [4] `https://github.com/tensorflow/tfx`


    [5] This is one of the bigger ones: `https://aws.amazon.com/marketplace/solutions/machine-learning`


    [6] This is one example of services that are open for business right now: `https://cloud.google.com/products/ai`


    [7] This is a wonderful site and the article is spot on: `https://towardsdatascience.com/model-drift-in-machine-learning-models-8f7e7413b563`

