- raw: 'A lottery like the Powerball or some of the other large lottery programs are
    generally based on numbers. You have a defined number space, and your selection
    of x numbers needs to match the randomly selected set of x numbers from the lottery
    result. You can 100% look for patterns over time and try to figure out the most
    likely numbers to be selected. That effort might even make you feel better, but
    assuming the machine designed to select the numbers accurately enforces randomness
    of selection, the likelihood of any number being selected is going to be the same.
    It will be a fraction created by taking the one number being selected against
    the total number of balls in the number space being evaluated. Based on that little
    bit of logic, you have probably discerned that you don’t need machine learning
    to predict the lottery. The best way to win the lottery is to explicitly buy a
    ticket for every number combination. That effort would be expensive, time consuming,
    and logistically problematic to achieve. 


    Footnotes:


    \[1\] This is a video by Raj Ramesh called “Can AI Pick Your Next Winning Lottery
    Number?” https://www.youtube.com/watch?v=tCMyKRk2YVI


    \[2\] https://arxiv.org/pdf/1906.02768.pdf is a paper titled “Playing the Lottery
    With Rewards and Multiple Languages”


    \[3\] Paper by Frankle & Carbin from 2019 on ArXiv https://arxiv.org/abs/1803.03635


    Substack Week 19: Fear of missing out on machine learning


    Published on June 4, 2021


    All that hype leads to a certain degree of buzz. Given enough buzz, you almost
    certainly end up with more hype. That cycle goes up and down within the world
    of machine learning and certainly within the space of artificial intelligence
    \[1\]. We have reached a tipping point where a lot of machine learning use cases
    can go into production without much friction. A lot of more complex use cases
    face complex implementation problems, but the vast majority of possible ways to
    start using machine learning are now easy to access. You don’t even have to build
    out infrastructure or spend a ton of time training models on your data. GCP, Azure,
    and AWS are all providing easy access to stable and scalable APIs to fulfill the
    needs of your machine learning use cases. 


    All of that buzz and hype mentioned in the first paragraph of this missive has
    created a fear of missing out on machine learning with the C-suite of a lot of
    organizations. Deriving operational efficiency or competitive advantage from machine
    learning is a legitimate thing to fear missing out on from machine learning use
    cases. Right now the possibility of getting ROI from increasing operational intelligence
    by catching abnormalities or predicting them can be financially beneficial. Some
    groups do believe that the amount of hype is excessive \[2\]. One of the points
    that Andrew Ng made about this is that people can really showcase the art of the
    possible on a test data set, but getting into the daily hardening of running in
    production sometimes does not translate to the same efficiency \[3\].


    Footnotes:


    \[1\] Here is an example where even an interesting thing does not stand out in
    the sea of hype and buzz: https://techcrunch.com/2021/05/18/google-cloud-launches-vertex-a-new-managed-machine-learning-platform/


    \[2\] https://www.cioinsight.com/innovation/ai-machine-learning-substance-behind-the-hype/


    \[3\] Andrew Ng talked about this recently: https://spectrum.ieee.org/view-from-the-valley/artificial-intelligence/machine-learning/andrew-ng-xrays-the-ai-hype


    Substack Week 20: Week 20 Lindahl Letter recap edition


    Published on June 11, 2021


    Writing a Substack for the last 20 weeks has been an interesting endeavor to undertake.
    Frequently to conduct research, I go out and engage in exploratory efforts to
    really understand new technology and what is involved in being a part of it in
    practice. Part of that was learning how to set up a Substack, trying to get subscribers,
    and sticking to a publishing schedule. Having the agenda set up for the first
    30 weeks or so was key to kickstarting this effort. For me, the personal investment
    into the activity helps me demonstrate mastery of it and figure out how to add
    value from that activity. Part of this enterprise for the last 20 weeks has been
    to distill the chaotic and ever-changing landscape of artificial intelligence
    and machine learning into distinct trends and single-serving topic reviews that
    are highly consumable. Getting to that point of communication and writing weekly
    is what this effort has been about. You are welcome to be the judge of the success
    or failure of that effort. 


    Right now arriving in your inbox happens to be the 20th edition of The Lindahl
    Letter . Links to the first 19 weeks are listed. Feel free to check them out if
    you missed some of them or if you just want to review what was covered from the
    start until now. Probably the most essential part of everything that I have communicated
    can be summed up simply as the assertion, “make sure you have a machine learning
    strategy and work to execute that by monitoring your ROI on the activities you
    elect to undertake.”


    Substack Week 21: Doing machine learning work


    Published on June 18, 2021


    Maybe it is time to get a little dangerous and start searching Google for “Why
    do machine learning projects fail?” I’m sure that is going to cause all sorts
    of odd advertisements to come my way here in the next few days. You will no doubt
    get pushed toward a study from Gartner on the subject \[1\]. Perhaps the detail
    you should try to focus on from that one is that the press release came out in
    2018. The reason people are still focused on it after three years is this one
    quote: “Gartner predicts that through 2022, 85 percent of AI projects will deliver
    erroneous outcomes due to bias in data, algorithms or the teams responsible for
    managing them.” Maybe for rather obvious reasons, that one metric has remained
    in the forefront of people’s thoughts on machine learning projects \[2\]. Over
    the years, in my opinion, two divergent trends have been occurring. First, the
    practice where organizations stand up large machine learning divisions is evaporating.
    Second, the number of outside practices has grown rapidly. You can see this in
    the number of startups working in the machine learning space and the number of
    major organizations that are offering teams of consultants to help. 


    I’m still sitting here reading articles about why machine learning projects fail
    \[3\]. For the most part they all sort of blend together into a few common observations:
    production data are dirty, models are not dynamic, and operationalization requires
    investment for sustainment. This is one of the reasons that API-delivered machine
    learning solutions tend to outlast the rest of deployments in the wild. Major
    companies that are caring for and feeding the API models they are serving up are
    providing both the sustainment of operations and ongoing maintenance as services
    embedded in the price of the API transactions. Those efforts are for the most
    part specific to the thing you are trying to accomplish with the API call. A lot
    of machine learning use cases work out well enough that way. '
