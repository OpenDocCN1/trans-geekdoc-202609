- raw: 'Back to the topic at hand related to AIOps and MLOps. The other day somebody
    tried to persuade me to consider ModelOps as a major part of the equation. A number
    of my talks that you have seen are studies into the world of open-source MLOps
    technology and companies. That research trajectory has never veered over into
    the world of ModelOps or the rabbit hole of companies that relate to graphs. Now
    from time to time, the graph-based things are really interesting, and people sell
    them with a passionate series of pitches. This topic, however, was geared toward
    digging into the difference between artificial intelligence services and operations
    at the point of consumption. A quick search of Google Scholar for AIOps will bring
    you about 657 results \[2\]. Some of those results are a bit interesting, but
    the most relevant result is very short and has only been cited 59 times: “AIOps:
    Real-World Challenges and Research Innovations” by Dang et al. \[3\]. That work
    seems to reference out AIOps and is focused on a website from Moogsoft, which
    is an interesting read \[4\]. My work focuses on open-source software related
    to MLOps, which is a different set of space compared to the people who talk about
    AIOps. For the most part, MLOps is directed at how you build out the tooling and
    workflow to operate machine learning models in production.   


    Footnotes:


    \[1\] https://www.gov.uk/government/publications/national-ai-strategy


    \[2\] https://scholar.google.com/scholar?hl=en&as\_sdt=0%2C6&q=AIOPs&btnG=


    \[3\] https://ieeexplore.ieee.org/abstract/document/8802836


    \[4\] https://www.moogsoft.com/resources/aiops/guide/everything-aiops/


    Substack Week 37: Reverse engineering GPT-2 or GPT-3


    Published on October 8, 2021


    When I put this topic on the agenda for consideration, I thought at the time that
    the GPT-3 model was going to be the largest and the pinnacle of models for some
    time. It was and is an epic language model to understand and study in terms of
    both ethical considerations and as a practitioner. It turns out that people really
    like to compile exceedingly large language models. My prediction is that at some
    point this push forward will hit exhaustion and the language model will be as
    complete as it can be based on the parametrization. Back on August 18, 2021, a
    lot of researchers from Stanford University published that 212-page paper called,
    “On the Opportunities and Risks of Foundation Models” \[1\]. You may still be
    working your way through the sections in that paper. Just jump right to page 74,
    and you can start digging into modeling. Both researchers and machine learning
    collectives are focused on building increasingly large language models, which
    explains a little bit about what they are attempting to achieve. I’m not totally
    ready to call them all “foundation models” yet, but that way of describing them
    will probably take off based on that Stanford paper. It is bound to have a ton
    of citations to it in the next decade. 


    Everyone at OpenAI has been super busy recently releasing the Codex closed beta
    \[2\]. I have a login to the closed beta for Codex and am participating in testing
    it out. That project and the GitHub Copilot release are interesting uses of very
    large language models to drive coding and programming forward \[3\]. Between the
    two implementations, I had a lot more fun messing around with the Codex closed
    beta than I did with the Copilot. If I had been hardcore working on a coding effort
    at the time, then the Copilot implementation might have been more dynamic and
    entertained me more during the process. I have watched a ton of videos on both
    of them as well. 


    https://twitter.com/huggingface/status/1443246197779664903


    That tweet from Hugging Face pretty much says it all about the present state of
    reverse engineering GPT models. You can see that the team over at EleutherAI is
    now up to GPT-J, a model that contains 6 billion parameters \[4\]. You can drop
    right into the page for the model and start working with a prompt to get output.
    They made it super easy to jump in the pool and see what the model is all about.
    Given that GTP-3 is proprietary, the good folks of the internet (EleutherAI) promptly
    went out and worked to make GPT-Neo and share it with the world based on 1.3 and
    2.7 billion parameter versions \[5\]. You can see they are quickly scaling up
    to many billions of parameters in these models.


    A few weeks back I got focused on reading this article by Gao et al. from 2020,
    “ The Pile: An 800GB Dataset of Diverse Text for Language Modeling , ” from the
    arXiv website. People are pulling together really powerful datasets, and these
    large language models or foundational models, if you will, are starting to translate
    into interesting use cases. The entire premise of the closed beta that is running
    on the Codex implementation is to see what people are going to do with the model.
    It is a very clear “Field of Dreams” type of endeavor. They built it and are waiting
    for people to dream up things to do with it. 


    Footnotes:


    \[1\] https://arxiv.org/abs/2108.07258 or https://arxiv.org/pdf/2108.07258.pdf


    \[2\] https://openai.com/blog/openai-api/ and https://openai.com/blog/openai-codex/


    \[3\] https://copilot.github.com/


    \[4\] https://6b.eleuther.ai/


    \[5\] https://www.eleuther.ai/projects/gpt-neo/


    Substack Week 38: Do most machine learning projects fail?


    Published on October 15, 2021


    You have probably heard that around 85% of machine learning projects fail. That
    statistic comes from a 2018 Gartner report (press release) that contained the
    following, “Gartner predicts that through 2022, 85 percent of AI projects will
    deliver erroneous outcomes due to bias in data, algorithms or the teams responsible
    for managing them” \[1\]. For the last 38 weeks (during the course of publishing
    this Substack), I have been talking about the necessity of having a top-level
    machine learning strategy that prioritizes use cases based on ROI \[2\]. You have
    a ton of pundits and other pontificators giving guidance on how to make your machine
    learning project successful \[3\]. To me, it is about having a machine learning
    strategy and executing in a planful way that highlights a definable and repeatable
    plan to success. 


    We can fast forward a few years and catch up to current from a newer report Gartner
    teams shared: “Gartner research shows only 53% of projects make it from artificial
    intelligence (AI) prototypes to production. CIOs and IT leaders find it hard to
    scale AI projects because they lack the tools to create and manage a production-grade
    AI pipeline” \[4\]. I guess that means the trajectory of success has improved
    in the last few years, but the prediction from the Gartner team that most (more
    than half) of machine learning projects will fail is consistent. This is one of
    the reasons that I spend so much of my time and speaking appearances talking about
    open-source MLOps efforts. That is where I see the most people working together
    to overcome the obstacles described above. 


    Q: What do you do to help prevent your machine learning projects from failing?


    A: Use the patterns that are known to work. Full stop.'
