    # Substack 第 6 周：将持续成本和成功标准作为机器学习战略的一部分加以理解


    **发布于 2021 年 3 月 5 日**


    开始着手你的机器学习资产清单。你需要知道组织在哪里以及为什么应用了机器学习。很有可能机器学习内嵌在一路部署下来的某些事物中。说真的，你需要把这份清单建立起来。这就是战略开始成型的地方。一项针对
    1,870 家组织的最新调查发现，根据 80% 受访者的说法，实际落地的机器学习战略还有很长的路要走 [1]。你可以阅读关于该调查研究的新闻稿，并在填写表格后下载它
    [2]。


    要了解你机器学习战略的持续成本和成功标准，你需要掌握当前正在发生的事情以及未来将要发生的事情的脉搏。我们都有有限的时间和精力去弄清事情。这是你想要从一开始就确保做对的事情。你的机器学习和人工智能战略拥有巨大的潜在上行空间，搞砸它可能会产生多年的连锁反应。有时过早入场会让做难事变得几乎不可能。目前，企业中的机器学习正从早期阶段迈向规划和部署的合理化、实证考量阶段。


    网上有人公布的实际训练成本非常高昂 [3]。任何使用云系统进行训练的人，对几十万美元的成本大概率会有强烈反应。我通常的训练成本一直归因于我个人电脑系统的电费，或其他那些成本没有直接记在我的信用卡账单上的环境中。我开始阅读
    Brad Cordova 在 Medium 上关于机器学习惊喜的系列文章 [4]。其中甚至引用了一篇题为“机器学习系统中的隐性技术债”的论文，让我在这个寒冷的周日早晨感到非常欣慰
    [5]。


    ## 脚注


    [1] https://venturebeat.com/2021/02/25/why-machine-learning-strategies-fail/


    [2] https://www.rackspace.com/newsroom/new-global-rackspace-technology-study-uncovers-widespread-artificial-intelligence-and-0


    [3] 你可以在这里看到来自 Elliot Turner 推文的成本 https://twitter.com/eturner303/status/1143174828804857856
    或在此阅读更多相关内容 https://medium.com/syncedreview/the-staggering-cost-of-training-sota-ai-models-e329e80fa82
    亦或直接获取论文原文 https://arxiv.org/abs/1906.08237


    [4] https://medium.com/mysuperai/7-costly-surprises-of-machine-learning-part-seven-703f4a0298dd


    [5] 这篇论文在脚注 [4] 中被链接，不知为何我非常喜欢它：https://papers.nips.cc/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf


