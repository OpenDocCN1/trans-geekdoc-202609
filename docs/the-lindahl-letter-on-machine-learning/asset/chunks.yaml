    # Substack Week 39: 机器学习安全


    发布于 2021 年 10 月 22 日


    NVIDIA 的研究人员发布了一个非常大的语言模型：“使用 DeepSpeed 和 Megatron 训练 Megatron-Turing NLG 530B，世界上最大、最强大的生成式语言模型”
    [1]。拥有 5300 亿参数，这确实是一个超大规模的生成式语言模型。所有这些模型发布以及在 GitHub 和其他途径上进行的机器学习领域代码共享，造就了一种局面：该领域的共享安全性和每个单独项目的安全性都至关重要。


    本周在 Google Scholar 上出现的关于“机器学习安全”的文章比我预期的要多得多 [2]。部分内容涉及隐私相关项目，以及机器学习在安全领域的具体应用用例。部分归因于该主题内容的分散性，最好尝试同时考虑与安全相关的机器学习用例，以及围绕实际机器学习实现、代码和共享项目安全性的真实且日益增长的问题。我跟踪的许多实用开源
    MLOps 项目在 GitHub 上到处都被扫描，人们提交 Pull Request 并沟通潜在问题。偶尔，您甚至可能读到关于这些 MLOps 项目的临时私有
    Fork，有人正努力修补某块代码，使其通过扫描和其他安全措施 [3]。这是将问题推向解决的一种方式，但这是一个有趣的练习，因为它不属于推动产品功能的范畴，却是能够在企业环境中使用该产品的关键。


    机器学习实现完全有能力检测统计异常。人们似乎喜欢的一个用例与网络安全入侵检测有关 [4]。许多安全工作都是关于在正常使用模式中发现标记为异常的事物。这就是为什么监控和流量分析是安全工作的重要组成部分。机器学习可以在该类工作中发挥关键作用。为此，我花了一些时间阅读
    Cisco 团队关于利用机器学习的安全应用的文章 [5]。这是一篇关于机器学习如何增强安全用例的不错文章，但我试图更深入地挖掘实际机器学习实例内部安全运作的本质。AIOps
    和 MLOps 领域的软件已存在且每天都在快速变化；您可以在 GitHub 上看到更新。这些应用程序的安全性是我搜索期间关注的焦点。您可以在我定期关注的 MLOps
    软件的 GitHub 仓库中看到安全相关的推拉动态。我的计划是回过头来分析这些模式，看看能否分离出安全相关项目。


    ## 参考文献


    [1] https://developer.nvidia.com/blog/using-deepspeed-and-megatron-to-train-megatron-turing-nlg-530b-the-worlds-largest-and-most-powerful-generative-language-model/


    [2] https://scholar.google.com/scholar?q=machine+learning+security&hl=en&as_sdt=0&as_vis=1&oi=scholart


    [3] https://docs.github.com/en/code-security/security-advisories/collaborating-in-a-temporary-private-fork-to-resolve-a-security-vulnerability


    [4] https://ieeexplore.ieee.org/abstract/document/7307098


    [5] https://www.cisco.com/c/en/us/products/security/machine-learning-security.html#~how-ml-works


