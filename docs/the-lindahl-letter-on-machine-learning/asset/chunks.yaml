- raw: 'And yes, that’s what I keep coming back to. I keep circling back to strategy.
    So your machine learning strategy must be at the forefront of what you’re trying
    to communicate. You want it to be definable and repeatable; you want to be able
    to share that vision. You want your elevator pitch to be from the top down. People
    have to know it is happening. It has to be part of what the organization knows
    is happening. That’s so powerful because when you’re thinking about where and
    when to use your machine learning, you’re going to get the best bottom-up work
    from the folks who know how to think about the examples in practice. Everybody
    can think about what could happen when, and the people can bring all their subject-matter
    expert ideas about machine learning use cases and match that up to your machine
    learning strategy. When those two things come together, that’s where success is
    created for your organization. 


    Now, that success is not just from the ideation phase. It’s from being planful
    and operationalizing in a successful way. It is in part from your ROI model. That
    requires ongoing monitoring so you can understand exactly what’s going on, so
    that you know from quarter to quarter, from month to month, is this effort successful?
    Is this model working? Does it need tuning? Do you need to do something with it? 


    At the same time, though, you can get into a space where maybe you’re making decisions
    about synthetic data versus other data strategies. Now if you’re building your
    machine learning model and you know exactly what to do, and you have a really
    good idea about what the data look like during your entire process, and you can
    build data synthetically that look like your real data, that probably means you
    have a good understanding of exactly what’s going on. You could be in a position
    where building some synthetic data and having a lot more data available for training
    and other things may work out well for you. Otherwise, you may have to look into
    other data strategies to get a little bit more complex, but I think being able
    to create synthetic data is something that you should definitely take a look at.
    It’s worth further consideration. 


    So you need to make sure you have repeatable frameworks, and they’re key for defined
    MLOps plans. And once you get into this process where you’re building pipelines
    and you’re operationalizing your machine learning, you’re going to find out that
    doing it in a definable and repeatable way is key to that success. 


    But, it’s not going to work if you don’t have the right teams. You may have to
    go out to a vendor; you may have to build those internal teams. You may have to
    do things to get it right. But I’ll tell you, if you have the strategy and the
    ideation going but you don’t have the team to execute it, it may be time to put
    on the brakes and just think a little bit longer and dig more in and figure out
    who you can bring in to make it successful. 


    Section 3: Directing: Leaning into machine learning scale


    Figure 2 is the directing image. Here we’re going to look about leaning into machine
    learning scale. This is Bucket 2 and Bucket 3. So we are talking about places
    you can be in ecosystems where you can build stuff out as well as Bucket 3, where
    you can be building something out yourself. These are just general use cases.


    Figure 2. General machine learning use cases: Scale versus maturity


    ![](media/file2.png)


    I think this is a great way to think about what’s possible within your machine
    learning strategy. You could do some image recognition, some product recommendations,
    build some monitoring systems, maybe some account prioritization. Maybe you’re
    in a business where lead prioritization makes sense. Not every business is going
    to find sound pattern matching is going to make sense or geospatial analysis.
    Just because you can build something out with a machine learning model doesn’t
    necessarily mean it’s the right thing to do for your business. 


    Now, this is a good sampling of things you can do and can jump into right now.
    So, maybe look at those things and figure out where the best things you can do
    with your strategy are, as you are going to need the teams to come together to
    be successful implementing and executing your strategy, but by all means you don’t
    want to try to do everything. 


    Part of your machine learning strategy must be about purpose, replication, and
    reuse. That is going to be at the heart of getting value back for the organization.
    Definable and repeatable results are the groundwork to predictable machine learning
    engagements. Machine learning is typically applied in production systems as part
    of a definable and repeatable process. That is how you get quality and speed.
    You have to have guardrails in place that keep things within the confines of what
    is possible for that model. Outside of that, you must be clear on the purpose
    of using machine learning to do something for your organization.


    I think it’s really important to think about where you can go and what you can
    do within those machine learning engagements. So now that we took a look at what’s
    possible and looked at a lot of those use cases, we can dig into MLOps \[3\].


    Footnotes:


    \[1\] https://ai4.io/retail/ You are getting most of the content in the newsletter
    this week, but you don’t get to hear my delivery of it which makes it more fun…


    \[2\] Why scaling matters: https://www.codementor.io/blog/scaling-ml-6ruo1wykxf


    \[3\] This talk continues in Substack Week 13.


    Substack Week 12: Confounding within multiple machine learning model deployments


    Published on April 16, 2021


    This topic deserves a lot more attention than it got before. Confounding variables
    can really mess with expected relationships and expected outcomes \[1\]. A baseball
    game can be broken down into a definable and repeatable workflow. You could use
    machine learning models to predict the next most likely pitch a batter will face
    at the plate \[2\]. At the same time, a model might be engaged from the pitcher’s
    perspective to determine the best possible pitch and location to defeat the batter
    based on history and other variables. Both of those models can operate without
    any confounding effects. Both models could be inherently true within the moment.


    However, the next best action might change for both models based on a series of
    events within an adversarial model. Introducing an adversarial element to the
    model could be of a confounding nature compared to the original intent. A lot
    of things could happen in this example, but they all follow the general workflow
    that occurs during a baseball game. A large part of the process is definable and
    repeatable based on the rules both teams have collectively agreed to and umpires
    enforce. Model interference is an interesting question to entertain. Depending
    on the workflow in question, you could have a bunch of different machine learning
    algorithms occurring in a series. 


    Footnotes:


    \[1\] Check out this sweet video from a few years ago that explains confounding
    in detail generally as a statistical topic: https://www.youtube.com/watch?v=sKkCZqqZ3qE


    \[2\] Check out https://towardsdatascience.com/predicting-the-next-pitch-using-artificial-neural-networks-fc464383f53d
    or maybe for fun check out this https://medium.com/@matt42kirby/predicting-baseball-pitches-33f906cbbdee


