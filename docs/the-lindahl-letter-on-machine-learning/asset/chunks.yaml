- raw: 'Based on my research, an audience of about 15,000 to 20,000 people are actively
    consuming machine learning content online. You could go look at the average views
    of Yannic Kilcher on YouTube and get a sense for the audience size \[4\]. A potentially
    larger audience of academics and practitioners are publishing papers at record
    numbers. Let’s just consider the International Conference on Machine Learning
    conference paper submission number from 2021 was 5,513 versus 1,037 in 2015 \[5\].
    That can give you a line of sight into active academic work and professional endeavors.
    You mix in the next layer of the audience, and all of a sudden you are up to about
    the previously mentioned number. Consider that when you start to wonder about
    doing machine learning work and the overall audience of people really working
    within the space. You are starting to get a lot more people who are adjacent to
    machine learning where they have elements of it or connections to it in applications
    and services being provided. That localizes the actual team and spreads out the
    sales and hype a few layers within organizations.


    Go check out https://discuss.tensorflow.org/ …more on that later.


    Footnotes:


    \[1\] Here is that Gartner press release: https://www.gartner.com/en/newsroom/press-releases/2018-02-13-gartner-says-nearly-half-of-cios-are-planning-to-deploy-artificial-intelligence


    \[2\] https://iiot-world.com/industrial-iot/connected-industry/why-85-of-machine-learning-projects-fail/
    and a lot of other examples exist.


    \[3\] https://www.kdnuggets.com/2021/01/top-5-reasons-why-machine-learning-projects-fail.html


    \[4\] https://www.youtube.com/c/YannicKilcher/videos sorted by newest videos…
    look at the counts… 


    \[5\] https://github.com/lixin4ever/Conference-Acceptance-Rate


    Substack Week 22: Machine learning graphics


    Published on June 25, 2021


    You can go and check out the new Hugging Face course on transformer models:


    https://twitter.com/nelslindahl/status/1408052384857686018


    You might have guessed that this post could go a variety of directions. It would
    be easy enough to focus on how hard it is to get new graphics cards for machine
    learning, or anything else really. The silicon shortage is real and makes me want
    to throw shade at cryptocurrency mining, but I’m not going to spend time on that
    analysis. You can get that coverage all over the internet \[1\]. What I wanted
    to target this week was what exactly people are doing related to graphics using
    machine learning as a technology. Yep—my interest was a purely technical question
    about what people are doing with graphics in the machine learning space. 


    Maybe the logical place to start here is TensorFlow graphics \[2\]. You can quickly
    go over to the TensorFlow site and learn about how to use the graphics API \[3\].
    Some of the in-browser stuff people have done with webcams and other basic deployments
    to show how graphics can be used to mimic behavior or make things dance have become
    ubiquitous, but that does not make it any less interesting at face value. 


    Footnotes:


    \[1\] Here is some coverage from the Economist about the great graphics card shortage:
    https://www.economist.com/graphic-detail/2021/06/19/crypto-miners-are-probably-to-blame-for-the-graphics-chip-shortage


    \[2\] https://medium.com/tensorflow/introducing-tensorflow-graphics-computer-graphics-meets-deep-learning-c8e3877b7668


    \[3\] https://www.tensorflow.org/graphics/


    Substack Week 23: Fairness and machine learning


    Published on July 2, 2021


    Tools are starting to roll out to help with fairness and bias detection in machine
    learning. Some of it is targeted at mitigation, and other parts are true efforts
    to remediate. Really the most important part of the process is the recognition
    of fairness as a concept. You have to begin to understand what bias can mean within
    machine learning to start working on mitigation and remediation. Ensuring the
    process is definable and repeatable creates the potential for quality. Within
    that framework, a high-quality, definable, and repeatable process can consider
    fairness within the machine learning development and deployment life cycle. People
    have been tackling this topic for a long time. You can look back at this Fall
    2017 course from the University of California Berkeley to get a sense of where
    we were \[1\]. You can still watch the introduction over on Vimeo \[2\]. You really
    get the feel from the lecture that they were hopeful we could address bias in
    algorithms in a meaningful way to reduce bias from humancentric data collected
    or evaluated. 


    Over the years since that lecture was published, we have seen a variety of things
    being built to help consider bias outside of technical concerns. I read an article
    from 2018 that has been referenced 331 times, written by Sam Corbett-Davies and
    Sharad Goel and called, “The Measure and Mismeasure of Fairness: A Critical Review
    of Fair Machine Learning” \[3\]. This helped reinforce the idea for me that people
    have been trying to deeply think about and consider fairness in machine learning.
    That effort to educate unfortunately did not translate to the use of algorithms
    and machine learning in practice. A lot of use cases were tackled based on the
    art of what was possible and not based on considerations of how appropriate and
    fair the application of that technology was. 


    Footnotes:


    \[1\] https://fairmlclass.github.io/ CS 294: Fairness in Machine Learning, University
    of California Berkeley, Fall 2017


    \[2\] https://vimeo.com/248490141 , which had 8,855 views since the release in
    2017 and July 2021. \[Note: by the end of 2021, that number was up to 9,577.\]


    \[3\] https://arxiv.org/pdf/1808.00023.pdf


    Substack Week 24: Evaluating machine learning


    Published on July 9, 2021


    A lot of people are getting used to having to evaluate machine learning. You can
    even buy a book from O’Reilly dedicated to the subject \[1\]. Decisions are being
    made all the time. We are starting to see machine learning get built into applications
    and are actively starting to appear as use cases. For me it all goes back to evaluating
    the ROI being modeled as an outcome of using machine learning. In that case you
    are evaluating the financial effect of using machine learning on a specific use
    case. Sometimes you can get stuck on modeling performance and trying to understand
    the inside baseball of machine learning. Those elements are a vital part of managing
    and deploying machine learning in your organization, but they ultimately are simply
    processes and diagnostic measures; evaluation should focus on the outcome. All
    of that could very well be inputs within the evaluation of the ROI being calculated
    for your machine learning use case. 


    Getting ready to build up a stack of stuff about evaluating machine learning to
    write this post was a solid reminder of just how much content exists related to
    this topic. People are selling grids, white papers, and all sorts of marketing
    materials. Pretty much every consulting agency has a take on how to evaluate machine
    learning models and usage within an enterprise. It is surprising how much effort
    they go to within the process to obfuscate the final and true question of what
    the ROI would be from implementation. Generally in the business world the time
    when machine learning was a research and development question has passed. Within
    the industry, the technology has moved from speculative to something that can
    be used and developed with reasonable confidence. '
