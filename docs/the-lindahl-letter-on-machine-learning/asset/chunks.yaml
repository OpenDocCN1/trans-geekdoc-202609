    # Substack 第 34 周：主要人工智能实验室在哪里？


    发布于 2021 年 9 月 17 日


    本周 The Brookings Institute 发布了一份关于人工智能的有趣报告。由 Mark Muro 和 Sifan Liu 撰写，标题为“The
    Geography of AI: Which Cities Will Drive the Artificial Intelligence Revolution?”
    [1]。你可以下载这份制作精良的完整报告，或者获取较短的执行摘要 [2]。我的建议是去阅读完整报告。它值得花时间和精力投入。我们最近获得了大量阅读材料，我知道机器学习领域充源源不断的新内容。请务必查看报告第
    13 页。它有一张地图显示“AI employment concentration by U.S. metropolitan area”（美国大都市区人工智能就业集中度）。你会很快意识到，一群公司正在推动所有这些招聘，它们在该报告第
    15 页底部的 Table 2 中有介绍。这是地理位置上的“老面孔”：“这些包括八个大型科技中心——纽约；波士顿；西雅图；洛杉矶；华盛顿特区；圣地亚哥；德克萨斯州奥斯汀；和北卡罗来纳州罗利——以及五个相对于其规模拥有大量人工智能活动的较小大都市区：科罗拉多州博尔德；内布拉斯加州林肯；加利福尼亚州圣克鲁兹；加利福尼亚州圣玛丽亚-圣巴巴拉；和新墨西哥州圣菲。”


    撇开关于人工智能领域工作地理强度的那堆史诗级研究不谈，让我们深入探讨本周的主要问题：“主要人工智能实验室在哪里？”这个问题有趣的一点在于，像 EleutherAI
    和 Hugging Face 这样的团体是否应该被包括在内。为求简单起见，我将承认我考虑过这一点，然后转向通常在你思考人工智能实验室时会考虑的那些更大牌的参与者。

