    # 也许一个可靠的机器学习策略示例可能与成本控制或节约成本计划有关，旨在帮助引入辅助性机器学习产品，让员工能够更快、更少错误地完成工作。执行该策略需要将其落地实施，并收集流程运行中的数据，以追踪、衡量并确保积极成果。


    ## 脚注


    [1] 查看这篇 2020 年 2 月关于 KPI 和预算的文章：https://hbr.org/2020/02/create-kpis-that-reflect-your-strategic-priorities


