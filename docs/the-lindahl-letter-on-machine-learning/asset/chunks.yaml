    Substack Week 5: Let your ROI drive a fact-based decision-making process


    Published on February 26, 2021


    Use cases abound for machine learning in the enterprise. A lot of the steps and
    processes are definable and repeatable based on the sheer volume of use cases
    that have been utilized across many different enterprises \[1\]. You have to start
    getting your bearings around how those use cases can be operationalized. During
    that process is the right time to let ROI guide you to fact-based decision-making.
    Getting into that groove is about enabling defined and repeatable processes to
    deploy machine learning in ways that meet the needs of the organization’s machine
    learning strategy statement. One strategy statement could be as simple as “Always
    provide a machine learning driven recommendation for alternate purchases before
    the payment part of the workflow.” You can begin to work both forward and backward
    from that strategy. It would be pretty easy to line up a budget item toward making
    that strategy reality. It is also a well-known use case for providing alternatives
    based on fairly standardized models at this point for recommendation engines.


    Getting fact based is about letting the data drive your decision-making process.
    You can get a list of common use cases for machine learning that exist in the
    wild right now and are commonly used. Based on those common use cases, you should
    be able to quickly correlate them to your workflows and begin to engage in some
    ROI analysis on what it would take to apply machine learning to your workflows.
    Generally speaking, the start-up time to use a machine learning API from GCP,
    Azure, or AWS is very low \[2\]. Building out your own infrastructure and getting
    set up to attach it to your workflow with a pipelined machine learning setup to
    serve trained machine learning models would take a bit longer. You also don’t
    get the advantage of the scale, tuning, and investment those other companies are
    making with their API setups. However, the general API does not have any customization
    for your use case if you require something divergent from the nature use case
    the model they are serving was designed to solve. Some really good models designed
    to evaluate machine learning cost already exist \[3\]. Those models are being
    used in the wild of production, with more than half of respondents in one survey
    saying they could demonstrate actual ROI from what they were doing \[4\].


    Footnotes:


    \[1\] Here is a fun video about the common machine learning steps: https://www.youtube.com/watch?v=nKW8Ndu7Mjw


    \[2\] Building a model from scratch: https://www.youtube.com/watch?v=\_RPHiqF2bSs


    \[3\] https://www.altexsoft.com/blog/business/how-to-estimate-roi-and-costs-for-machine-learning-and-data-science-projects/


    \[4\] https://cloud.withgoogle.com/build/data-analytics/how-to-build-machine-learning-strategy-to-achieve-roi/


    Substack Week 6: Understand the ongoing cost and success criteria as part of your
    machine learning strategy


    Published on March 5, 2021


    Start working on your machine learning inventory. You need to know where and why
    the organization has applied machine learning. Chances are machine learning is
    built into some things that have been deployed along the way. Seriously, you need
    to get that list built out. That is where it all starts to come together as a
    strategy. A recent survey of 1,870 organizations found that machine learning strategies
    in the wild have a long way to go, according to 80% of respondents \[1\]. You
    can read the press release about that survey study and download it if you fill
    out a form \[2\].


    To understand the ongoing cost and success criteria of your machine learning strategy,
    you need a pulse of what is going on and what will be going on in the future.
    We all have limited time and energy to put into figuring things out. This is something
    you want to make sure you get right from the start. Your machine learning and
    artificial intelligence strategy has so much potential upside that getting it
    wrong could reverberate for years. Sometimes being early to the party makes doing
    the hard things nearly impossible. Right now machine learning in the enterprise
    is moving beyond the early party stage into the rationalized and empirically considered
    phase of planning and deployment. 


    Some of the actual training costs that people have advertised online are very
    large \[3\]. Anybody using a cloud system for training would probably have a reaction
    to a cost of several hundred thousand dollars. My general training costs have
    always been tagged to either electricity from my personal computer system or within
    other environments where those costs did not come directly back to my credit card.
    I started reading a post series from Brad Cordova on Medium about machine learning
    surprises \[4\]. It even had a reference to a paper titled “Hidden Technical Debt
    in Machine Learning Systems,” which brought me great joy on this cold Sunday morning
    \[5\]. 


    Footnotes: 


    \[1\] https://venturebeat.com/2021/02/25/why-machine-learning-strategies-fail/


    \[2\] https://www.rackspace.com/newsroom/new-global-rackspace-technology-study-uncovers-widespread-artificial-intelligence-and-0


    \[3\] You can see the cost from an Elliot Turner tweet here https://twitter.com/eturner303/status/1143174828804857856
    or read more about that here  https://medium.com/syncedreview/the-staggering-cost-of-training-sota-ai-models-e329e80fa82
    or you can get to the actual paper here https://arxiv.org/abs/1906.08237


    \[4\] https://medium.com/mysuperai/7-costly-surprises-of-machine-learning-part-seven-703f4a0298dd


    \[5\] This paper was linked in footnote \[4\] and for some reason I really enjoyed
    it: https://papers.nips.cc/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf


    Substack Week 7: Plan to grow based on successful ROI


    Published on March 12, 2021


    Whoa…the number of machine learning and artificial intelligence newsletters has
    grown out in the wild internet-based pages of Substack and Revue (Twitter owns
    that one). I was trying to figure out the differences between Substack and Review
    by searching and reading Twitter feedback from users. More prominent uses are
    on Substack; it seems to work. At the moment, I’m going to stay with Substack
    for a few more weeks and see how it goes. More people seem to be excited about
    and using Substack as a platform than are using Revue, within my online bubble. 


    I’m going to try to weave in some of my tweets into these newsletters that directly
    link to things that caught my interest each week. Here is the first example of
    that, regarding non-fungible tokens (NFTs): “I’m sure other people are looking
    for ways to explain #NFTs to people. This video from @garyvee takes a run at it
    in under 60 seconds. It’s unique ownership of a digital thing to sell or hold.”
    You can find it on YouTube under the title, “Explaining NFTs as Simple as Possible
    in Under 60 Seconds” \[1\].'
