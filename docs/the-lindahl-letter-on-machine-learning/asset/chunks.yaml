    edge.


    Your integrations at the edge are always going to be constrained by two distinct
    factors related to processing power and access to the internet. You cannot expect
    to have the bandwidth to egress your smartphone and work on a photograph in the
    cloud at all times. Our wireless network is not that great, and most people don’t
    have endless bandwidth to support that type of endeavor. You also would have another
    problem related to latency, where people just don’t like to wait for things to
    happen anymore. Long gone are the days where the internet booted up with a series
    of hums and beeps before things started to happen. A growing number of people
    using devices right now have never had to wait for a dial-up connection to initialize.
    That reality means that to avoid waiting, latency, and otherwise perceived failure,
    you have to work to train and deploy machine learning models that achieve real
    results with the lowest possible processing power requirements and space needs.


    I was reading this 2020 article by Gao et al. called “The Pile: An 800GB Dataset
    of Diverse Text for Language Modeling” from the arXiv website. That diverse collection
    of data includes 825 gigabytes of content, which functionally has been cleared
    of all sources and the authorship removed. This action has removed individuality
    from the language model in favor of generalization. Future models might end up
    going the other direction and favoring personality over generalization, but that
    might end up being more isolated based on what I’m seeing so far in terms of language
    modeling.


    ## Footnotes


    [1] A quick Google Scholar search for “edge machine learning”: https://scholar.google.com/scholar?q=edge+machine+learning&hl=en&as_sdt=0&as_vis=1&oi=scholart


    [2] https://www.ibm.com/cloud/blog/models-deployed-at-the-edge


