- raw: 'A lot of machine learning use cases have been demonstrated to be effective.
    Start out by targeting in and deploying similar use cases. That is the best method
    of getting into the machine learning ecosystem and probably getting a solid ROI
    from your machine learning strategy. Doing something that is definable and repeatable
    from an external API that has been proven durable and dependable is always easier
    than trying to do something unique within your organization. Some of those use
    cases could be really rewarding, but they are going to be difficult to drive toward
    success. To that end, people who are just looking to access a machine learning
    API from AWS, Azure, or GCP are going to find a much easier path to use case success.
    All of the work is happening to train, implement, and continuously improve the
    machine learning models by the provider. You also get the benefit of having many
    users pressure testing the API versus being siloed into a single service use case. 


