    # Substack Week 44: Machine learning salaries


    **发布日期**: November 26, 2021


    我们正迅速接近 The Lindahl Letter 在 Substack 上满一年，该事件将发生在 2022 年 1 月 21 日。半年似乎是一段很短的时间，但在机器学习的世界里，发生了太多事情。仅大语言模型的进步就足以真正改变机器学习领域的格局。机器学习模型的普遍性部分体现在市场上，以及它们如何在线自由共享。这两点都改变了机器学习薪资。你必须分别考虑
    OpenAI 等公司的顶级构建者与机器学习更实际应用之间的差异。在这种情况下，机器学习薪资的分布是双峰的。


    在 Indeed 上，你可以很快看到机器学习工程师的平均薪资目前为 $140,107 [1]。上周我分享了 LinkedIn 上列出的 152,352 个机器学习职位
    [2]。像其他事物一样，你会看到薪资的变化，以及真正被要求的技能。任何告诉我他们是“全栈机器学习工程师”的人总能引起我的注意。这是一件有趣的事。围绕构建机器学习模型并将其适配到新用例的一些技能高度专业化。在某些方面，这更像是艺术而非科学，而方程式的这一部分可能导致机器学习薪资的巨大差异。你可以回顾一篇精彩的
    2018 年《纽约时报》文章，他们在文中讨论了 OpenAI 的一些人工智能研究人员及其薪资 [3]。就说这些薪资足以让任何晚到派对的人质疑为什么他们没有早点参加。每年获得一百万美元进行研究太棒了。基于技术与现代性的已知交集，你会认为会有更多此类薪酬的例子存在。


    我花了一些时间寻找其他巨额机器学习薪资的例子，发现在 Indeed 和 LinkedIn 上通过简单搜索公开共享的薪资范围中有更多例子。看起来你有一个强烈的双峰分布：一小簇百万美元级别的薪资（或处于那个范围内），还有一大簇薪资将低于每年约
    $250,000。我的评估是，随着时间的推移，我们将继续看到这种双峰分布，处于未来技术曲线最前沿的人将获得高得多的薪酬。实用机器学习的普遍普及将使其余群体回归到信息技术领域的常见薪资范围内，除非资源需求激增，否则这将把平均薪资从
    $140,107 降低约 20%。


