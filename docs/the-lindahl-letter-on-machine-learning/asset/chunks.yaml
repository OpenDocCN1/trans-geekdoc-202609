    ## 受众规模与机器学习内容消费


    根据我的研究，约有 15,000 到 20,000 人正在积极在线消费机器学习内容。您可以查看 Yannic Kilcher 在 YouTube 上的平均观看次数，以了解受众规模
    [4]。学术界和从业者这一潜在的更大受众正在以创纪录的数量发布论文。仅以国际机器学习会议（ICML）为例，2021 年的论文投稿数量为 5,513 篇，而
    2015 年仅为 1,037 篇 [5]。这可以让您洞察活跃的学术工作和专业探索。加上受众的下一层，人数突然达到上述提到的数量。考虑到当您开始思考从事机器学习工作以及真正在该领域工作的总体受众时，您会发现有更多与机器学习相关的人员，他们在应用和服务中拥有机器学习的元素或联系。这将实际团队本地化，并将销售和炒作在组织内部向外扩散了几层。


    请访问 `https://discuss.tensorflow.org/` …稍后详述。


