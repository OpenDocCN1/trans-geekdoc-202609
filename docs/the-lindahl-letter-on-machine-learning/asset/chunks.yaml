    \[1\] https://www.youtube.com/watch?v=5dAZTvbmZZ4


    \[2\] Check out this fun little article from Forbes : https://www.forbes.com/sites/forbesinsights/2020/05/08/realizing-the-growth-potential-of-ai/?sh=1f25069033f3


    \[3\] https://www.marketsandmarkets.com/Market-Reports/machine-learning-market-263397704.html


