    ## Substack Week 29: Machine learning feature selection


    **Published on August 13, 2021**


    Well the buzzword of the week very quickly went from `#Metaverse` to `#TimeCrystal`,
    and I guess that means science is winning. It was very hard to switch it up from
    reading about time crystals to writing about machine learning feature selection,
    but for you, for continuity, and for the planned posting schedule, I don’t want
    to waste a second; here we go!


    The more time you spend working in the machine learning field, you will get tired
    of hearing about overfitting. Training to a use case or to a commonality of the
    data is an interesting thing to consider. Given enough time, you can navigate
    the best possible answer to a given training dataset or to the bias and limitations
    of the total dataset being split apart for training. Training is a major part
    of the adventure, and any model you work with could become overfit to the training
    data and won’t work correctly in production [1]. That is why feature selection
    to train the model on the right things is critical to success.


    ### What exactly is feature selection?


    You are going to have to train your machine learning model on some type of data.
    It would be a very interesting conversation to hear about models that require
    no data. It would be very interesting indeed. Your data are going to be made up
    of some things you are going to work with and model around, which is going to
    require you to define the features. Maybe, for example, you want to predict the
    price of houses based on location, size, and year constructed. Part of the art
    of data science is working with the features to find the right match for your
    model; sometimes it is easier to use automated methods that work through the possible
    features that you have in your dataset to locate potential combinations. That
    might sound super complex, but the idea of feature engineering and the methods
    behind selecting the right features have their own special place in the field
    of machine learning.


    ### Footnote


    [1] https://towardsdatascience.com/feature-selection-techniques-in-machine-learning-with-python-f24e7da3f36e


