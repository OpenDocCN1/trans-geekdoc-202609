    # Substack 第 5 周：让 ROI 驱动基于事实的决策过程


    **发布于 2021 年 2 月 26 日**


    企业中机器学习的用例比比皆是。基于跨众多不同企业利用的海量用例，许多步骤和流程都是可定义且可重复的 [1]。你必须开始理清这些用例如何实现运营化。在这个过程中，正是让
    ROI 引导你进行基于事实的决策的最佳时机。进入这种良性循环，关键在于启用已定义且可重复的流程，以满足组织机器学习战略声明所需的方式部署机器学习。一个战略声明可以简单到“在工作流的支付环节之前，始终提供机器学习驱动的替代购买推荐”。你可以开始从该战略出发，正向和反向双向推进。为实现该战略列出预算项会相当容易。这也是推荐引擎基于相当标准化的模型提供替代方案的一个著名用例。


    实现基于事实意味着让数据驱动你的决策过程。你可以获取一份当前现存的、常用的机器学习常见用例清单。基于这些常见用例，你应该能够快速将它们与你的工作流关联起来，并开始就将机器学习应用于工作流所需的成本进行一些
    ROI 分析。一般来说，从 `GCP`、`Azure` 或 `AWS` 使用机器学习 API 的启动时间非常短 [2]。构建自己的基础设施并设置好通过流水线机器学习设置将其连接到工作流以服务训练好的机器学习模型，则需要更长的时间。你也无法获得那些公司在其
    API 设置上进行的规模化、调优和投资带来的优势。然而，如果你需要偏离模型设计初衷所解决的用例性质，通用 API 并不具备针对你用例的任何定制化功能。一些用于评估机器学习成本的优秀模型已经存在
    [3]。这些模型正在生产环境中实际使用，一项调查中超过一半的受访者表示他们能够证明从所做工作中获得了实际 ROI [4]。


