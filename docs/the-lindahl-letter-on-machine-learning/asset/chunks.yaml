    Substack Week 8: Is the machine learning we need everywhere now?


    Published on March 19, 2021


    Just as you read that title that the machine learning we need is everywhere now,
    some of you looked at your Apple Watch. You don’t have to look very far to see
    some application of machine learning in your daily life. People for years have
    been making the argument that machine learning is everywhere \[1\]. Now if machine
    learning has become that obvious in your daily existence, you can only imagine
    how deeply it is starting to get ingrained in the business world \[2\]. Pretty
    much every vendor, every application, and every underlying technology are investing
    in some combination of machine learning and artificial intelligence \[3\]. This
    creates some interesting situations where you have machine learning models working
    in unanticipated compounding and confounding ways. Yeah, I’m really proud of that
    last sentence. I’m invested in the combination of talking about how models can
    be compounding and confounding. That is probably just a loquacious way of saying
    either the models have working results or conflicts develop. 


    We have reached a point where businesses may not be aware of all the different
    machine learning elements running in the organization. They could even be running
    at cross purposes. A chatbot could be trying to answer simple questions and close
    out the conversation as quickly as possible with very little friction for the
    customer. Another element of machine learning could be running to evaluate what
    options, opportunities, or suggestions the organization has for the customer,
    and that entire line of conversation might never be engaged. You have to remember
    that targeted optimization algorithms could be at odds with an engagement strategy.
    You also could have different parts or programs or different elements of a complex
    workflow working at very different purposes and outcomes along the way. That type
    of confounded interdependency will create havoc for your overall machine learning
    strategy. It is probably evidence of either a failed machine learning strategy
    or no real strategy at all. 


    Footnotes:


    \[1\] From 2017 https://www.datanami.com/2017/07/03/machine-learning-everywhere-preparing-future/


    \[2\] https://blog.udacity.com/2016/06/machine-learning-everywhere-netflix-personalized-medicine-fraud-prevention.html


    \[3\] https://www.nytimes.com/2021/02/23/technology/ai-innovation-privacy-seniors-education.html


    Substack Week 9: Valuing machine learning use cases based on scale


    Published on March 26, 2021


    This week we are jumping right into valuing machine learning use cases based on
    scale. You will find that most of the time scale is everything when it comes to
    adding value. Being able to quickly scale up your machine learning solution to
    provide value in a workflow is generally where the benefits begin to accelerate
    \[1\]. Very few examples exist in the wild where only a handful of interactions
    are going to bring the majority of value. Those might be use cases where machine
    learning might not be ready to handle such a critical part of your business. Sometimes
    applying machine learning to a use case is not a viable path to success \[2\].
    You have to evaluate and invest in machine learning use cases with high potential
    ROI. The value derived from the work being undertaken is going to directly line
    up with ROI. 


    Conceptually I have been breaking down the categories of machine learning use
    cases into three buckets:


    “Things you can call,” such as external API services


    “Places you can be,” or ecosystems where you can build out your footprint, such
    as AWS, GCP, Azure, and many others that are springing up for machine learning
    operations (MLOps) delivery


    “Building something yourself,” such as open-source and self-tooled solutions 


    That categorization helps me think about where things for the use case are going
    to happen. It is a tactical rather than a strategic question. Each of the three
    buckets will receive more coverage later in this series \[3\]. In terms of API
    services, you can scale very quickly. You can go out right now and get access
    to several API machine learning solutions on AWS, Azure, or GCP without any real
    barriers. The level of friction to enter that external-technology-driven use case
    is relatively low. Seriously, these solutions are really low-friction options
    with highly scalable infrastructure on the back end. People are using them all
    over the place right now \[4\]. '
