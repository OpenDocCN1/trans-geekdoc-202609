    ## Substack Week 28: Machine learning certifications?


    **Published on August 6, 2021**


    Well, the word of the week seems to be `#Metaverse`, and that in and of itself
    is interesting. Back in 1992 a science fiction writer named Neal Stephenson wrote
    a book called *Snow Crash* using the word and describing how it would work in
    practice [1]. A lot of people are probably picking up that book or maybe downloading
    the audiobook. What does that have to do with machine learning certifications?
    Obviously, I spent a chunk of my morning trying to find one, and most of it seemed
    to be hyperbole or sarcasm. It might require a little bit more digging in academic
    tomes to figure out a well-struck walk from machine learning to the metaverse.
    I’m pretty certain that machine learning will be used in the metaverse, but we
    will see what happens shortly on this one, as people appear to be actively trying
    to build it.


    ### From that bit of whimsy to something more practical


    People are always looking for practical machine learning experience. It’s all
    about the applied machine learning efforts on a résumé and the ability to demonstrate
    real and practical skills. Certifications have and will probably remain a keyword
    or a method for people to talk about what they know and demonstrate mastered skills.
    Within any stringent interview, the questions and demonstration of skills will
    probably separate the paper learning from the applied learning very quickly. You
    have to be able to demonstrate that you can apply the knowledge to the problems
    in question or even the best certifications are going to end up just looking nice
    printed out on the refrigerator (Figure 4). It’s the demonstration of skills that
    makes certificates become more than just a line on a résumé. That is one of the
    reasons that I have tried to put some code out on GitHub and to demonstrate and
    work actively in the space.


    **Figure 4. Certification on the fridge**


    ![](media/file8.jpg)


    The bottom line on machine learning certifications is that they are a great way
    to demonstrate that you were learning and passing labs. Practical experience needs
    to be mixed in with the certifications. If you can use the demonstration of skills
    to land a job or actively contribute to projects on GitHub as part of the community,
    you can work toward a trajectory of employment. The moral of the story here is
    that a stack of machine learning certificates alone is not going to be enough
    without some type of demonstration of your skills. A lot of interviews these days
    tend to include some type of exercise or challenge to prove the skills.


    I enjoyed a lot of the machine learning certificates that I have collected over
    the years. The labs have gotten so much better in simulating what you need to
    do in the actual environments. That type of practice really made machine learning
    come alive for me in a guided sort of way. The folks over at Google Cloud just
    launched another specialization, “Hands-on Machine Learning with Google Cloud
    Labs Specialization”: https://www.coursera.org/specializations/hands-on-machine-learning


