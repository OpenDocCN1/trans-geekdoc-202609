    # Substack Week 37: 逆向工程 GPT-2 或 GPT-3


    **发布日期：2021 年 10 月 8 日**


    当我将此主题列入议程考虑时，我认为 `GPT-3` 模型将在一段时间内保持最大规模和巅峰地位。无论从伦理考量还是从业者角度来看，它都是一个史诗级的语言模型，值得理解和研究。结果证明，人们真的很喜欢编译超大规模语言模型。我的预测是，在某个时刻，这种向前推进的势头将达到饱和，语言模型将基于参数化变得尽可能完整。


    2021 年 8 月 18 日，斯坦福大学的许多研究人员发布了那篇 212 页的论文，名为“On the Opportunities and Risks of
    Foundation Models” [^1]。你可能仍在逐节研读该论文。直接跳到第 74 页，即可开始深入研究建模。研究人员和机器学习团体都专注于构建越来越大的语言模型，这在一定程度上解释了他们试图实现的目标。我还不完全准备好称它们所有人为“Foundation
    Models”，但基于该斯坦福论文，这种描述方式很可能会流行开来。它注定将在未来十年获得大量引用。


    `OpenAI` 的所有人最近都忙于发布 `Codex` 闭源测试版 [^2]。我拥有 `Codex` 闭源测试版的登录权限，并正在参与测试。该项目和 `GitHub
    Copilot` 的发布，都是利用超大规模语言模型推动编码和编程向前发展的有趣用例 [^3]。在这两个实现中，我摆弄 `Codex` 闭源测试版的乐趣远多于
    `Copilot`。如果当时我正在硬核地进行编码工作，`Copilot` 的实现可能会更动态，并在过程中给我带来更多乐趣。我也看了大量关于它们的视频。


    https://twitter.com/huggingface/status/1443246197779664903


    `Hugging Face` 的那条推文非常精辟地道出了逆向工程 `GPT` 模型的现状。你可以看到 `EleutherAI` 团队现已推出 `GPT-J`，这是一个包含
    60 亿参数的模型 [^4]。你可以直接进入模型页面，通过提示词开始获取输出。他们让人非常容易地“跳进池子”看看模型究竟如何。鉴于 `GPT-3` 是专有的，互联网上的好心人（`EleutherAI`）立即着手制作
    `GPT-Neo` 并基于 13 亿和 27 亿参数版本与世界共享 [^5]。你可以看到他们正在迅速扩展到数百亿参数规模的模型。


    几周前，我专注于阅读 Gao 等人 2020 年的这篇文章，“The Pile: An 800GB Dataset of Diverse Text for
    Language Modeling”，来自 `arXiv` 网站。人们正在整合真正强大的数据集，这些大型语言模型或基础模型（如果你愿意这么叫）开始转化为有趣的用例。`Codex`
    实现上运行的闭源测试版的整个前提，是为了看看人们会用该模型做什么。这是一个典型的“Field of Dreams”式的尝试。他们建好了它，正等待人们梦想出用它做什么。


    **脚注：**


    [^1]: https://arxiv.org/abs/2108.07258 或 https://arxiv.org/pdf/2108.07258.pdf

    [^2]: https://openai.com/blog/openai-api/ 和 https://openai.com/blog/openai-codex/

    [^3]: https://copilot.github.com/

    [^4]: https://6b.eleuther.ai/

    [^5]: https://www.eleuther.ai/projects/gpt-neo/


    ---


    # Substack Week 38: 大多数机器学习项目会失败吗？


    **发布日期：2021 年 10 月 15 日**


    你可能听说过约 85% 的机器学习项目会失败。该统计数据源自 2018 年 `Gartner` 报告（新闻稿），其中包含以下内容：“Gartner 预测，至
    2022 年，85% 的 AI 项目将因数据、算法或负责管理它们的团队中的偏见而产生错误结果” [^1]。在过去 38 周（发布此 `Substack` 的过程中），我一直在谈论拥有一个顶层机器学习战略的必要性，该战略根据
    ROI 对用例进行优先级排序 [^2]。你有大量专家和空谈者就如何使你的机器学习项目成功提供指导 [^3]。对我来说，关键在于拥有一个机器学习战略，并以一种突出可定义、可重复的成功计划的方式有计划地执行。


    我们可以快进几年，追赶上 `Gartner` 团队分享的较新报告：“Gartner 研究显示，只有 53% 的项目能从人工智能 (AI) 原型走向生产。CIO
    和 IT 领导者发现很难扩展 AI 项目，因为他们缺乏创建和管理生产级 AI 管道的工具” [^4]。我想这意味着成功的轨迹在过去几年有所改善，但 `Gartner`
    团队预测大多数（超过一半）机器学习项目将失败这一观点是一致的。这就是我花费大量时间和演讲机会谈论开源 `MLOps` 工作的原因之一。那是我看到最多人共同努力克服上述障碍的地方。


    **问：** 你做什么来帮助防止机器学习项目失败？


    **答：** 使用已知有效的模式。全止。

    '
