    # Substack Week 35: Explainability in modern machine learning


    Published on September 24, 2021


    This is one of those topics that seems so obvious that it probably requires some
    deeper consideration. Boardrooms from coast to coast are hearing about gold hiding
    in the mountains of machine learning these days from all sorts of vendors and
    consultants, and the fear of missing out does not abide inaction. When you get
    into the process of actually doing some machine learning within your workflows
    and as a part of your use cases, the next question inevitably relates to the mechanics
    of how it happened. You can see the path your use case is going to take, but the
    question of why the modeling went a certain direction could be a bit of a black
    box. That is where explainability in modern machine learning has hit a crossroads
    of sorts. A lot of journal articles contain the words explainability and machine
    learning [1]. Seriously, academics talk about this a lot. Outside of that wealth
    of academic articles, companies like Weights & Biases are working to keep track
    of what is happening and to track all the steps along the way [2]. All of that
    helps you recreate the process of getting to machine learning deployment, but
    it does not necessarily explain what is happening. It more or less just shows
    you how to do it again.


    After a bit of digging into the topic, a lot of content starts to talk about the
    difference between explainability and interpretability [3]. Being able to go step
    by step and interpret what is happening is a different sort of activity than trying
    to explain the outcome of the machine learning model to somebody. I read it a
    bit deeper and focus on two other considerations. First, I’m always curious about
    how something can be reproduced. That begs the question, “Did the model training
    succeed on accident or is it something that can be replicated and understood as
    a process?” Second, I try to understand what potential biases or ethical considerations
    are present either in the data or the use case. Those two considerations combine
    to set the stage for understanding machine learning modeling at the very start
    of the process. Taking the time to consider those things after the fact breaks
    down any potential design considerations that could help begin with the end in
    mind. Building in a forward-looking way helps set up the effort for success. It
    is easier to understand what is being built at the very start of the process than
    trying to change the architecture of something that is already built or well on
    the way to deployment.


    Maybe you were looking for more coverage on this topic. You are in luck! Go check
    out this excellent video, “Explainability, Reasoning, Priors and GPT-3,” where
    Dr. Tim Scarfe and Dr. Keith Duggar discuss explainability, reasoning, priors,
    and GPT-3 while checking out Christoph Molnar’s book on interpretability. This
    video is from September 16, 2020, but it is still excellent: https://www.youtube.com/watch?v=25-kF_8etJ8


    ## Footnotes


    [1] https://scholar.google.com/scholar?hl=en&as_sdt=0%2C6&as_vis=1&q=explainability+machine+learning&btnG=


    [2] https://wandb.ai/site


