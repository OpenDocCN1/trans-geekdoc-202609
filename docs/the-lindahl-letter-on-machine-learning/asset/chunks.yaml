    # Substack 第 31 周：边缘机器学习集成


    发布于 2021 年 8 月 27 日


    我在 2021 年 8 月 17 日举行的 Ai4 人工智能大会上发表演讲，度过了愉快的时光。我的演讲主题是“什么是 ML 规模？ML 使用的地点与时机。”能在现场与人们聊聊机器学习用例非常有趣。在此次演讲中，我重点关注了大规模机器学习规模和
    MLOps 决策背后的战略。你可以通过此 Vimeo 链接观看演讲：https://vimeo.com/577702076


    你会很快发现，关于边缘机器学习这一理念，存在大量学术研究 [1]。这不应与前沿机器学习的概念混淆，后者是关于描述可能性的边界，而前者是关于边缘侧的机器学习。如果你考虑一下设备是如何设置和工作的，那么你就可以绘制出处于连接边缘的事物图。它可能是所有物联网设备、你的智能手机，或不断增长的连接设备池中的其他事物。我们在
    IBM 的朋友甚至专门设立了一个页面，介绍在边缘部署机器学习模型的乐趣 [2]。你现在正在基于 Apple 或 Android 的智能手机上使用边缘部署的机器学习模型进行摄影或语音助手操作。有人训练了一个模型来处理照片或帮助驱动相关搜索，并将其部署在你的智能手机上，没有任何真正的喧嚣或庆祝。这样做是为了让边缘侧的事情变得更简单。


    你在边缘的集成将始终受到两个与处理能力和互联网接入相关的不同因素的制约。你不能指望拥有足够的带宽，随时将智能手机的数据传出并在云端处理照片。我们的无线网络没那么好，而且大多数人没有无限的带宽来支持这种工作。你还会面临另一个与延迟相关的问题，人们就是不再喜欢等待事情发生。互联网伴随着一系列嗡嗡声和哔哔声启动、事情才开始发生的日子早已一去不复返。现在越来越多使用设备的人从未经历过等待拨号连接初始化的过程。这一现实意味着，为了避免等待、延迟和其他感知上的失败，你必须努力训练和部署机器学习模型，以最低可能的处理能力要求和空间需求实现真实结果。


    我正在阅读 Gao 等人 2020 年在 arXiv 网站上发表的题为“The Pile: An 800GB Dataset of Diverse Text
    for Language Modeling”（The Pile：一个用于语言建模的 800GB 多样化文本数据集）的文章。该多样化数据集包含 825GB 的内容，功能上已清除所有来源并移除了作者信息。这一举措为了泛化而牺牲了语言模型的个性。未来的模型可能会走向另一个方向，倾向于个性而非泛化，但根据我目前在语言建模方面所见，这可能最终会更加孤立。


