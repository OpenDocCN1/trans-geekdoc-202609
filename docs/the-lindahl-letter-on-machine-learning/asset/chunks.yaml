    # Substack 第 19 周：对错过机器学习的恐惧


    发布于 2021 年 6 月 4 日


    所有这些炒作导致了一定程度的轰动效应。给予足够的轰动效应，你几乎肯定会得到更多的炒作。这种循环在机器学习领域，当然也在人工智能领域 [1] 中起伏不断。我们已经达到了一个临界点，许多机器学习用例可以在几乎没有摩擦的情况下投入生产。许多更复杂的用例面临复杂的实现问题，但绝大多数开始使用机器学习的可能方式现在都很容易获得。你甚至不必构建基础设施或花费大量时间在你的数据上训练模型。GCP、Azure
    和 AWS 都提供了轻松访问稳定且可扩展 API 的途径，以满足你的机器学习用例需求。


    本简讯第一段提到的所有轰动效应和炒作，在许多组织的高层管理人员中制造了一种错过机器学习的恐惧。担心错过从机器学习用例中获得运营效率或竞争优势，是一件合理的事。目前，通过捕捉异常或预测异常来提高运营智能从而获得投资回报率（ROI）的可能性，在财务上可能是有益的。一些群体确实认为炒作的程度过头了
    [2]。Andrew Ng 关于这一点的观点之一是，人们确实可以在测试数据集上真正展示“可能的艺术”，但进入生产环境日常强化运行的阶段，有时并不能转化为相同的效率
    [3]。


    ## 脚注


    [1] 这是一个即使有趣的事物也淹没在炒作和轰动效应海洋中的例子：https://techcrunch.com/2021/05/18/google-cloud-launches-vertex-a-new-managed-machine-learning-platform/


    [2] https://www.cioinsight.com/innovation/ai-machine-learning-substance-behind-the-hype/


    [3] Andrew Ng 最近谈到了这一点：https://spectrum.ieee.org/view-from-the-valley/artificial-intelligence/machine-learning/andrew-ng-xrays-the-ai-hype


