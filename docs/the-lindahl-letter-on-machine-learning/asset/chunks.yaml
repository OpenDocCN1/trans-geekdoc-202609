- raw: 'I was one of those people talking about the importance of scaling. This week
    we are diving deep into the topic of machine-learning scale in this newsletter.
    Earlier this week I was a speaker at a virtual conference on artificial intelligence
    called Ai4 2021 Retail, Supply Chain, & Marketing Summit, which occurred April
    7–8, 2021 \[2\]. My topic was “The ML scale problem: Thinking about where and
    when to use ML, ROI models, synthetic data, repeatable frameworks, and teams.”


    Brief presentation abstract 


    During this talk, I will focus on the strategy behind both machine learning scale
    and MLOps decisions at scale. Conceptually, I have been breaking down the categories
    of machine learning use cases into three buckets:


    Bucket 1: “Things you can call,” e.g., external API services.


    Bucket 2: “Places you can be,” e.g., ecosystems where you can build out your footprint
    (AWS, GCP, Azure, and many others that are springing up for MLOps delivery).


    Bucket 3: “Building something yourself,” e.g., open-source and self-tooled solutions.


    Those three buckets are then considered across four phases:


    1.  Initiating: What is scale exactly?


    2.  Analyzing: Use cases “scale versus maturity”


    3.  Directing: Leaning into machine-learning scale.


    4.  Platforming: What is compelling about MLOps?


    It should be an entertaining 25 minutes.


    Here is the first half of the talk transcribed from the actual presentation audio
    and edited a little bit for better grammar. The other half of the talk will arrive
    in your inbox in 2 weeks.


    Hello, I’m Dr. Nels Lindahl. I’m a clinical systems IT director at a Fortune 5
    company, the author of Graduation With Civic Honors , an avid writer, tech chaser,
    sports card collector, and a major TensorFlow enthusiast. 


    Research disclaimer


    This presentation includes original research. All the content is mine and reflects
    my current views on the topics under consideration. Those thoughts were current
    at the point of this publication, but things in this space change rapidly.  


    Section 1: Initiating: What is scale exactly?


    Conceptually I have been breaking down the categories of machine-learning use
    cases into three buckets:


    Bucket 1 is the easiest because all you have to do is go out and consume it. You
    just need to connect to it, send some information out to it and get some information
    back, and you’re ready to go. Bucket 2 is about places where you can be totally
    within an ecosystem to build out your footprint for the endeavor. AWS, Azure,
    and GCP and many others that are springing up for MLOps delivery—and I do mean
    many others—are ready to provide you an ecosystem. You’re starting to see other
    ecosystems besides the major three. They’re popping up and going to provide a
    different workflow in a different place where you can serve up your machine-learning
    models and get going in this space. 


    Now the third category, or Bucket 3, is where you’re building something yourself.
    These are the open-source and self-tooled solutions. I tried to make this bucket
    just a little bit bigger because I feel like that’s where a lot of this gets started.
    A few years ago, it was the primary place, and now we are seeing a shift. We’re
    seeing that movement into other buckets. Those APIs are so easily available, and
    you can get into these ecosystems where you can get going so quickly. Things are
    moving around and changing. That categorization of the three buckets helps me
    think about where things are for use cases and where things are going to happen.
    It’s a very tactical question versus a strategic one. 


    Seeing the strategy beyond trees in the random forest takes a bit of perspective.
    Sometimes it is easier to lock in and focus on a specific project and forget about
    how that project fits into a broader strategy. Having a targeted machine learning
    strategy that is applied from the top down can help ensure the right executive
    sponsorship and resources are focused on getting results. Instead of running a
    bunch of separate self-incubating efforts, it might be better to have a definable
    and repeatable process to roll out and help ensure the same approach can be replicated
    in cost effective ways for the organization. That being said…of course you need
    an machine learning strategy.


    So it’s not just about the three buckets and what you’re doing and what you’re
    considering. It’s about how you put that pitch together. Your machine learning
    strategy has to be able to tell people what you’re trying to accomplish and what
    it’s going to do for the organization. 


    Now if you’re going out and sharing that machine learning strategy, and you’re
    trying to get the organization to commit their precious funds to your strategy,
    you’re probably talking about making a budget-level investment. That budget-level
    investment is going to require you to do a few things that have some commitments. 


    Those commitments are probably going to include a budget-level KPI for your machine
    learning spending. How do I go about managing that? What should I do? Well, you
    knew it was going to be a compendium of KPIs, including ROI. So I started to build
    those things throughout the process so that I’m tracking and modeling and understanding
    exactly what’s going to happen within the deployment of my machine learning strategy.
    That is done so that I can communicate at all levels the success—or, you know,
    in some cases, you may have some failure you need to retool and explain to people
    what you’re doing. But your compendium of KPIs is what’s going to be able to build
    that communication strategy and let you be successful. 


    After you’ve done those first four things, then and only then can you switch over
    and start doing some machine learning use case delivery. That’s where the fun
    happens, right? And as you start delivering your machine-learning use cases, you’re
    going to find out quickly that you’re going to need an ongoing MLOps strategy
    to be able to sustain and continue to do all the things that you committed to
    when you ask for those funds to have a budget-level commitment.


    Selection 2: Analyzing: Common machine learning use cases: “Scale versus maturity”


    So, in Figure 1, what I did was take a look at some different common APIs from
    AWS, Azure, and GCP and just kind of looked at them in terms of scale versus maturity.
    So you can think about this as Bucket 1. These are “things you can call.” So it’s
    part of your machine learning strategy. 


    Figure 1. Common API use cases: Scale versus maturity


    ![](media/file1.png)


    You must make it be about purpose, replication, and reuse. That’s going to be
    at the heart of getting value back for your organization. Going out and using
    an API is a great way to get value back really quickly, because if you go out
    and use AWS enterprise search or GCP Vision API or the AWS transcription service,
    you already have all the training, all the model building; all the hard work was
    done by the folks housing and working with these APIs. So that investment up front
    was spent already, but not by you or your organization. So you can get right to
    the point where you’re able to inject this into your workflow and be able to do
    some fun and interesting things quickly. 


    From a budget line item to actually being operationalized, you have to apply your
    machine learning strategy in a uniform way based on potential ROI. After you do
    that, you will know you are selecting the right path for the right reasons. Then
    you can begin to think about replication of both the results and process across
    as many applications as possible. Transfer learning both in terms of models and
    deployments really plays into this, and you will learn quickly that, after you
    figured out how to do it with quality and speed, applying that to a suite of things
    becomes much quicker. That is the power of your team coming together and being
    able to deliver results.'
