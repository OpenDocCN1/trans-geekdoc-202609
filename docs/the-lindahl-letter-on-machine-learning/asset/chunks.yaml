- raw: 'Based on the number of citations (1,267), a paper called “Federated Machine
    Learning: Concept and Applications” by Yang back in 2019 has drawn people at least
    as a starting point \[2\]. It seems to pop up very quickly within any searches
    you might start firing up on the subject. You could rewind a little further back
    in time to April 6, 2017, and see a post from the Google Research team that details
    federated learning \[3\]. That post by McMahan and Ramage occurred years earlier
    and might very well lead you to a paper cited by 2,852 researchers (and counting)
    called “Communication-Efficient Learning of Deep Networks From Decentralized Data”
    \[4\]. You can start to get a good foundation from those references about federated
    learning. 


    The idea of federated learning is pretty simple. It allows you to work on machine
    learning across several (even many) devices without exchanging the original base
    local data. You then bring all the learning elements back together, which based
    on the distribution, creates the federated part of federated learning. It remains
    a novel method of building out robust machine learning without data privacy and
    in some cases data transmission problems. Probably the best understood example
    of awesome federated learning has come from our efforts to build self-driving
    cars. They generate and abandon huge volumes of data while the sensors are running.
    It would be nearly impossible for all the Tesla cars to send all that data back
    for analysis. Instead of trying to manage it that way, federated learning allows
    distributed efforts without all that backhauling of the data, which is really
    interesting as a method and should be appreciated. 


    Footnotes:


    \[1\] https://arxiv.org/pdf/2108.07258.pdf


    \[2\] https://arxiv.org/pdf/1902.04885.pdf


    \[3\] https://ai.googleblog.com/2017/04/federated-learning-collaborative.html


    \[4\] https://arxiv.org/abs/1602.05629


    Substack Week 33: Where are artificial intelligence investments coming from?


    Published on September 10, 2021


    Two approaches were taken when starting to answer this question about artificial
    intelligence investments. First, I started to think about what companies were
    all in on machine learning and artificial intelligence. That gave me a good look
    at where the corporate investment is being targeted. Second, I started to dig
    into the adventurous and often difficult to understand world of venture capital. 


    Pretty much everywhere you look online, people are recommending what stocks benefit
    from artificial intelligence or machine learning investment \[1\]. It’s done at
    a sector level and based on specific companies. You will see a list of companies
    that are not all that surprising. It would include the likes of IBM, Qualcomm,
    Taiwan Semiconductor, NVIDIA, Intel, Micron, Apple, Alphabet, Amazon, and Microsoft.
    Take a step back right now and think about that list of companies that got looped
    into beneficiaries of artificial intelligence investments. It’s really a solid
    list of technology companies, right? The bigger technology companies are using
    artificial intelligence and machine learning use cases to drive things forward
    and are receiving recognition in the market for that type of effort. A lot of
    academic groups are working on and testing models as well that end up in academic
    papers. Modern versions of think tanks or collectives are popping up all over
    the place to work on machine learning. The interesting part of all of that is
    how many of those academics go in and out of the corporate world. Outside of that
    revolving door, you see a large number of acquisitions in the artificial intelligence
    and machine learning world, where those big companies listed above are eating
    up technology and talent within the market. 


    Outside of all of those thoughts about companies, we need to take a look at the
    world of venture capital investing. I found a bunch of lists about who is investing
    in artificial intelligence right now \[2\]. If you have been following venture
    capital throughout the last decade, then the names of the companies investing
    in artificial intelligence and machine learning should not be surprising. A lot
    of these investors are hoping to invest in something that will be acquired or
    grow into a glorious mythical unicorn. Even some companies that have no hope of
    actually gaining market share get acquired for machine learning talent and intellectual
    property. Sometimes the accumulation of patents is a business play, a topic I
    should add to my writing schedule \[3\]. The good folks over at Forbes actually
    started to question if all the investment was excessive \[4\]. Along the way of
    doing some research on this one, I ran into one article from McKinsey Quarterly
    that caught my attention, called, “A Machine-Learning Approach to Venture Capital”
    \[5\]. It was an interesting read, and you might enjoy it. 


    Footnotes:


    \[1\] So many examples exist of investment recommendations based on artificial
    intelligence and machine learning, but I thought it would be fun to provide one
    from Yahoo! https://www.yahoo.com/now/10-best-machine-learning-stocks-164924452.html


    \[2\] https://growthlist.co/blog/ai-vc


    \[3\] You will be able to read about “Who is acquiring machine learning patents?”
    during Week 55 of The Lindahl Letter . 


    \[4\] https://www.forbes.com/sites/cognitiveworld/2020/01/05/is-venture-capital-investment-for-ai-companies-getting-out-of-control/


    \[5\] https://www.mckinsey.com/industries/technology-media-and-telecommunications/our-insights/a-machine-learning-approach-to-venture-capital


    Substack Week 34: Where are the main artificial intelligence labs?


    Published on September 17, 2021


    This week an interesting report came out from The Brookings Institute about artificial
    intelligence. It was written by Mark Muro and Sifan Liu and titled, “The Geography
    of AI: Which Cities Will Drive the Artificial Intelligence Revolution?” \[1\].
    You can download the report, which is well put together, or grab the shorter executive
    summary instead \[2\]. My suggestion is to go read the full report. It is worth
    the time and investment. We are getting a lot of reading material coming out recently,
    and I know the machine learning space is full of a never-ending stream of new
    content. Make sure to go check out page 13 of the report. It has a map that shows
    “AI employment concentration by U.S. metropolitan area.” You will quickly realize
    that a group of companies are really driving all that hiring, and they are covered
    in Table 2 at the bottom of page 15 of that report. It’s the usual suspects for
    geographical location: “These include eight large tech hubs—New York; Boston;
    Seattle; Los Angeles; Washington, D.C.; San Diego; Austin, Texas; and Raleigh,
    N.C.—and five smaller metro areas that have substantial AI activities relative
    to their size: Boulder, Colo.; Lincoln, Neb.; Santa Cruz, Calif.; Santa Maria-Santa
    Barbara, Calif.; and Santa Fe, N.M.”


    All right, that epic pile of research on the geographical intensity of jobs in
    the artificial intelligence space aside, let’s dig into the main question for
    the week: “Where are the main artificial intelligence labs?” One of the interesting
    things about this question is whether groups like EluetherAI and Hugging Face
    should be included. For the sake of simplicity, I’m going to acknowledge that
    I thought about that and move along to the bigger named players who are typically
    considered when you think about artificial intelligence labs. '
