- raw: 'You have to set up and run a machine learning strategy from the top down.
    Executive leadership has to understand and be invested in guiding things toward
    the right path (a truly strategic path) from the start. Start by making an effort
    to begin with a solid strategy in the machine learning space. It might sound harder
    than it is in practice. You don’t need a complicated center of excellence or massive
    investment to develop a strategy. Your strategy just needs to be linked to the
    budget and ideally to a budget key performance indicator (KPI). Every budget results
    in the process of spending precious funds, and keeping a solid KPI around machine
    learning ROI levels will help ensure your strategy ends on a strong financial
    footing for years to come. All spending of an organization’s precious resources
    should translate to a KPI of some type. That is how your results will let you
    confirm that the funding is being spent well and that solid decision-making is
    occurring. You have to really focus and ensure that all spending is tied to that
    framework when you operationalize the organization’s strategic vision to be aligned
    financially to the budget. 


    That means that the machine learning strategy you are investing in has to be driven
    to achieve a certain ROI tied directly to solid budget-level KPIs. You might feel
    like that line has been repeated. If you noticed that repetition, then you are
    paying attention and well on your way to future success. Reading comprehension
    goes a long way to translating written argument to action. That KPI-related tieback
    you are creating is only going to happen with a solid machine learning strategy
    in place. It has to be based on prioritizing and planning for ROI. Your machine
    learning pipelines and frameworks have to be aligned toward that goal. That is
    ultimately the cornerstone of a solid strategic plan when it comes to implementing
    machine learning as part of a long-term strategy.


    We are about 500 words into this book, and it might be time to simply recap the
    message being delivered so far. Be ready to do things in a definable and repeatable
    way. Part of executing a strategy with quality is doing things in a definable
    and repeatable way. That is the essence of where quality comes from. You have
    to know what plan is being executed and focus on and support the plan in ways
    that make it successful at your desired run rate. In terms of deploying machine
    learning efforts within an enterprise, you have to figure out how the technology
    is going to be set up and invested in and how that investment is going to translate
    to use cases with the right ROI.  


    Know the business value for the use case instead of letting solutions chase problems.
    Just because you can do a thing does not always mean that you should. Having the
    ability to deploy a technology does create the potential of letting a technology-based
    solution chase a problem. Building up technology for machine learning in a very
    theoretical and lab-based way and then chasing use cases is a terrible way to
    accidentally stumble on an ROI model that works. The better way forward is to
    know the use cases and have a solid strategy to apply your technology. That means
    finding the right machine learning frameworks and pipelines to support your use
    cases in powerful ways across the entire organization. 


    This is a time to be planful. Right here, right now, in this moment of consideration
    you can elect to be planful going forward. Technology for machine learning is
    becoming increasingly available and plentiful. No code, low code, and just solidly
    integrated solutions are becoming omnipresent in the technology landscape. Teams
    from all over the organization are probably wanting to try proof of concepts,
    and vendors are bringing in a variety of options. People are always ready to pitch
    the value of machine learning to the organization. Both internal and external
    options are plentiful. It is an amazing time for applied machine learning. You
    can get into the game in a variety of ways rapidly and without a ton of effort.
    Getting your implementation right and having the data, pipeline, and frameworks
    aligned to your maximum possible results involves planning and solid execution. 


    Your machine learning strategy cannot be a back-of-the-desk project. You have
    to be strategic. It has to be part of a broader strategy. You cannot let all of
    the proofs of concept and vendor plays drive the adoption of machine learning
    technology in your organization. That will mean that the overall strategic vision
    is not defined. It happened generally because it might have a solid ROI, and the
    right use case might have been selected by chance from the bottom up in the organization.
    That is not a planful strategy. 


    Know the workflow you want to augment with machine learning and drive beyond the
    buzzwords to see technology in action. You really have to know where in the workflow
    and what pipelines are going to enable your use cases to provide that solid ROI. 


    At some point along the machine learning journey you are going to need to make
    some decisions…


    Q: Where are you going to serve the machine learning model from? 


    Q: Is this your first model build and deployment? 


    Q: What actual deployments of model serving are being managed?


    Q: Are you working on-premise for training or calling an application programming
    interface (API) and model serving in your workflow?


    Q: Have you elected to use a pre-trained model via an external API call? 


    Q: Did you buy a model from a marketplace, or are you buying access to a commercial
    API? 


    Q: How long before the model efficiency drops off and adjustment is required?


    Q: Have you calculated where the point of no return is for model efficiency where
    ROI falls below break-even?


    Substack Week 2: Machine learning frameworks & pipelines


    Published on February 5, 2021


    Ecosystems are beginning to develop related to machine learning pipelines. Different
    platforms (companies) are building out different methods to manage the machine
    learning frameworks and pipelines they support. Now is the time for your organization
    to get that effort going. You can go build out an easy-to-manage end-to-end method
    for feeding model updates to production. If you stopped reading this manuscript
    for a moment and started doing research or spinning things up, then you probably
    ended up using a TensorFlow Serving instance you installed, Amazon SageMaker pipeline,
    or an Azure machine learning pipeline \[1\]. Any of those methods will get you
    up and running. They have communities of practice to provide support \[2\]. That
    is to say the road you are traveling has been used before and used at scale. The
    path toward using machine learning frameworks and pipelines is pretty clearly
    established. People are doing that right now. They are building things for fun.
    They have things in production. While all that is occurring in the wild, a ton
    of orchestration and pipeline management companies are jumping out into the forefront
    of things right now in the business world \[3\]. 


    Get going on your machine learning journey. One way to get going very quickly
    and start to really think about how to make this happen is to go and download
    TensorFlow Extended (TFX) from GitHub as your pipeline platform on your own hardware
    or some type of cloud instance \[4\]. You can just as easily go cloud native and
    build out your technology without boxes in your datacenter or at your desk. You
    could spin up on Google Cloud Platform (GCP), Azure, or Amazon Web Services (AWS)
    without any real friction against realizing your dream. Some of your folks might
    just set up local versions of these things to mess around and do some development
    along the way. '
  fmt: '

    # 从上到下建立并运行机器学习策略


    高管领导层必须从一开始就理解并致力于引导事务走向正确的道路（一条真正具有战略意义的道路）。首先要努力在机器学习领域制定一个可靠的策略。这在实践中听起来可能比实际更难。你不需要复杂的卓越中心或大规模投资来制定策略。你的策略只需与预算挂钩，理想情况下与预算关键绩效指标（KPI）挂钩。每一笔预算都会导致宝贵资金的支出过程，围绕机器学习投资回报率（ROI）水平保持可靠的
    KPI，将有助于确保你的策略在未来多年内站在稳健的财务基础上。组织所有宝贵资源的支出都应转化为某种类型的 KPI。这就是你的结果如何让你确认资金花得好、决策可靠的方式。当你将组织的战略愿景落地为与预算在财务上对齐的执行时，你必须真正专注并确保所有支出都与该框架挂钩。


    这意味着你投资的机器学习策略必须致力于实现直接与可靠的预算级 KPI 挂钩的特定 ROI。你可能觉得这句话重复了。如果你注意到了这种重复，说明你很专注，已在通往未来成功的道路上。阅读理解能力在将书面论点转化为行动方面大有裨益。你正在创建的这种
    KPI 关联回溯，只有在建立可靠的机器学习策略后才会发生。它必须基于对 ROI 的优先级排序和规划。你的机器学习流水线和框架必须朝着该目标对齐。这最终是实施机器学习作为长期战略一部分时，可靠战略计划的基石。


    我们已经读了约 500 个单词，也许是时候简单回顾一下目前传达的信息了。准备好以可定义、可重复的方式做事。高质量执行策略的部分在于以可定义、可重复的方式做事。这是质量来源的本质。你必须知道正在执行什么计划，并以能使计划在你期望的运行速率下成功的方式专注于并支持该计划。就在企业内部署机器学习工作而言，你必须弄清楚技术将如何建立和投资，以及该投资将如何转化为具有正确
    ROI 的用例。


    了解用例的业务价值，而不是让解决方案追逐问题。仅仅因为你能做某事，并不总意味着你应该做。拥有部署技术的能力确实会产生让技术驱动的解决方案追逐问题的潜在可能。以非常理论化和实验室为基础的方式构建机器学习技术，然后再追逐用例，这是一种极其糟糕的方式，只能靠运气偶然发现行之有效的
    ROI 模型。更好的前进方式是了解用例，并拥有可靠的策略来应用你的技术。这意味着找到合适的机器学习框架和流水线，以强有力的方式支持整个组织的用例。


    这是一个需要周密计划的时刻。就在这里、就现在、就在这一刻的考量中，你可以选择从今往后做事有计划。机器学习技术正变得越来越易得且丰富。无代码、低代码以及可靠的集成解决正在技术版图中变得无处不在。来自整个组织的团队可能都想尝试概念验证，供应商也带来了各种选项。人们总是准备好向组织推销机器学习的价值。内部和外部选项都很丰富。这是应用机器学习的大好时机。你可以通过多种方式快速且毫不费力地入局。要让实施正确，并让数据、流水线和框架与你最大可能的结果对齐，需要规划和可靠的执行。


    你的机器学习策略不能是一个“拍脑袋”的项目。你必须具有战略眼光。它必须是更广泛战略的一部分。你不能让所有的概念验证和供应商方案驱动组织对机器学习技术的采用。那将意味着整体战略愿景未被定义。之所以普遍发生这种情况，可能是因为它拥有可靠的
    ROI，且正确的用例可能碰巧从组织底层自下而上被选中。那不是一个有计划的策略。


    了解你想用机器学习增强的工作流，并超越流行词汇去看技术的实际行动。你真的必须知道工作流中的哪个位置、哪些流水线将使你的用例能够提供可靠的 ROI。


    在机器学习旅程的某个节点，你将需要做出一些决策……


    - Q: 你将从哪里服务机器学习模型？

    - Q: 这是你的第一次模型构建和部署吗？

    - Q: 实际管理了哪些模型服务部署？

    - Q: 你是为训练在本地工作，还是在工作流中调用应用程序编程接口（API）和模型服务？

    - Q: 你是否选择通过外部 API 调用使用预训练模型？

    - Q: 你是从市场购买模型，还是购买商业 API 的访问权限？

    - Q: 模型效率多久会下降并需要调整？

    - Q: 你是否计算出模型效率的“无法回头点”在哪里，即 ROI 跌破盈亏平衡点？


    # 第 2 周：机器学习框架与流水线


    发布于 2021 年 2 月 5 日


    与机器学习流水线相关的生态系统开始发展。不同的平台（公司）正在构建不同的方法来管理它们支持的机器学习框架和流水线。现在是你的组织启动这项工作的时候了。你可以构建一个易于管理的端到端方法，用于将模型更新推送到生产环境。如果你此刻停下阅读手稿去做研究或启动环境，你最终可能会使用一个你安装的
    `TensorFlow Serving` 实例、`Amazon SageMaker` 流水线或 `Azure` 机器学习流水线 [1]。这些方法中的任何一种都能让你启动并运行。它们拥有实践社区提供支持
    [2]。也就是说，你正在走的这条路以前走过，且已在大规模场景下使用。使用机器学习框架和流水线的路径已经相当清晰。人们正在这么做。他们为了好玩在构建东西。他们已有东西在生产环境运行。而当所有这些在外部发生时，大量编排和流水线管理公司正在商业世界的前沿涌现
    [3]。


    开始你的机器学习之旅。一种快速上手并真正开始思考如何实现这一点的方法是去 `GitHub` 下载 `TensorFlow Extended (TFX)` 作为你自己的硬件或某种云实例上的流水线平台
    [4]。你同样可以轻松地走云原生路线，在没有数据中心机箱或桌面设备的情况下构建技术。你可以在 `Google Cloud Platform (GCP)`、`Azure`
    或 `Amazon Web Services (AWS)` 上启动，而不会在实现梦想的过程中遇到任何真正的摩擦。你的某些人员可能只是建立这些工具的本地版本，以便在过程中摆弄和进行一些开发。

    '
