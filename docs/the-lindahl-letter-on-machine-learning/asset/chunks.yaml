    Substack Week 14: My Ai4 Healthcare NYC 2019 talk revisited


    Published on April 30, 2021


    I took some time out of my day to rewrite/edit my Ai4 Healthcare NYC 2019 talk.
    It was super fun to talk with some really passionate people right by Times Square
    in New York City. The talk started out with me noting that I’m a director of clinical
    decision systems at a Fortune 10 company. I guess that is now less accurate of
    a statement than it could be. It could now be stated that my days are spent at
    a Fortune 5 company. 


    Today we are going to talk about figuring out applied machine learning. Specifically,
    we are going to dig into building frameworks and teams to operationalize machine
    learning at scale. We are going on a journey along that path for the next 30 minutes.
    We will go from the start of the process to the end of the process.


    That introduction being said…taking the time to truly think about machine learning
    holistically is the hard part of threading the needle on this topic.


    1.  Where does the talent come from?


    Personally, I believe you can build the talent from within your organization.
    Domain knowledge mixed with deep understanding of machine learning is going to
    be a team effort. It is unlikely a single person is going to end up your single
    point of failure on this one. Throughout my career I have a proven track record
    of helping grow internal talent. One of my proudest accomplishments as a professional
    is seeing somebody get promoted. That being said, now is the time to go out and
    start building out the toolkits of the people that you have. Really take the time
    to invest in people growing and developing as teammates and as individual contributors.


    We are in the golden age of learning about machine learning. More training than
    you can possibly consume now exists online. It exists in a variety of different
    forms. Among my favorites are the online labs. They let you do things in practice
    that would have required a ton of hardware and software. The one I have used the
    most is called Coursera. People have built out well-tooled examples of how to
    do machine learning. Not only can you read about it, but you also can get into
    examples and kick the tires. That is the thing that has drawn me to TensorFlow
    since the product launched in 2015. So many people have been so generous with
    their knowledge, skills, and abilities. They are sharing the keys to the machine
    learning kingdom online in some accessible classes, lectures, and even a few certificates.
    I have taken over 50 courses. Some of them were better than others. You can see
    them on my LinkedIn profile or just search TensorFlow on Coursera and pick one
    that inspires you. 


    Sometimes building internal teams is just not fast enough. Commitments and aggressive
    timelines can accelerate things far beyond any natural cadence. It takes time
    to help internal talent develop world-class skills in machine learning—or anything,
    for that matter. I recognize that is a long-term goal and something you have to
    be purposeful about building. That is where you have a few options to start looking
    for ways to supplement talent. One of those ways is to hire contractors or external
    vendor talent and have them help you kickstart your endeavor. Another way is to
    find the right product or company to help you get going fast. Several companies
    are doing that right now, and some of them can be impactful for your organization.


    Data will drive the end results. Typically, the data sources in an organization
    are not well indexed with clearly mapped features and associations. Even getting
    off-the-shelf data sources is a real challenge. For the most part, the ones that
    people use were created to be used that way. Those data sets did not occur naturally
    in the wild. Even making custom-tailored synthetic datasets can be a challenge
    for an organization that is trying to operationalize machine learning at scale.
    That is where using external products to manage the data and even accessing APIs
    requires planning and sustained dedication. That means data going to the APIs
    must be consistent. Constantly changing data streams are a nightmare to manage
    internally or externally.


    That might have been a lot to consider all in one stretch of thought, but it will
    all come into context the first time building a team to solve a machine learning
    problem becomes a necessity. My answer to where the talent comes from involves
    blending great professionals together over time to create high-functioning teams.
    That may involve hiring in key skill sets to help supplement a team or investing
    in training the team if enough ramp-up time exists. The shorter the amount of
    ramp-up time, the greater the need to quickly bring in external talent.


    2.  How do you get the talent to work together?


    Now that we talked about where the talent comes from and how to think about investing
    in your teams, let’s switch gears and talk about how to get the teams to work
    together. This is one of those things that is much easier to talk about than to
    manage in practice. You can think about the mantra: let your leaders lead, let
    your managers manage, and let your employees succeed. That works well enough when
    you have agile teams who self-organize and rapidly get work done. If that is where
    you are sitting right now, then congratulations and appreciate what you have.


    Teams are about how the different players work together. I try to think about
    machine learning engagements as having two key pillars. First, you need to figure
    out who has the deep knowledge on the product, data, and how the data relate to
    the customer journey. This is going to be either obvious or difficult. Sometimes
    these folks with the greatest institutional knowledge of the data are key subject-matter
    experts who play an impactful role, but they could be buried deeper in the organization
    at an analyst role, or maybe they moved to another role.'
