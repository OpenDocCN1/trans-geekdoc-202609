    unexpected or change names, but the same principle and spirit of using artificial
    intelligence to generate models that work inherently with data will continue without
    interruption. The reason I’m so confident about that is that the technology underpinning
    has fundamentally changed. Automation and the need to do things more efficiently
    have changed the paradigm of how things are expected to occur and with what pace
    and cost. Between those two influences, people who are creating technology are
    going to use the best methods available to them to succeed. That means layering
    in machine learning (or whatever amazing phrasing for it comes next) to make the
    next leap toward a future where technology and modernity intersect. That intersection
    will happen without fanfare or any celebration; it will be an afterthought and
    assumed to be mundane at that point. 


