    # 基于引用次数（1,267）的分析


    一篇名为“Federated Machine Learning: Concept and Applications”的论文由 Yang 于 2019 年发表，至少作为一个起点引起了人们的关注
    [2]。它似乎会在你开始搜索该主题时非常快地出现。你可以将时间倒回到 2017 年 4 月 6 日，查看 Google Research 团队的一篇详细介绍联邦学习的帖子
    [3]。McMahan 和 Ramage 的那篇帖子发生在几年前，很可能会引导你找到一篇被 2,852 位研究人员引用（且仍在增加）的论文，名为“Communication-Efficient
    Learning of Deep Networks From Decentralized Data” [4]。你可以从这些参考文献中获得关于联邦学习的良好基础。


    ## 联邦学习的概念


    联邦学习的概念非常简单。它允许你在不交换原始本地基础数据的情况下，跨多个（甚至许多）设备进行机器学习。然后你将所有学习元素汇聚在一起，根据分布情况，构成了联邦学习中“联邦”部分的含义。它仍然是一种在没有数据隐私问题、在某些情况下也没有数据传输问题的前提下，构建稳健机器学习模型的新颖方法。可能最广为人知的联邦学习绝佳案例来自于我们构建自动驾驶汽车的努力。它们在传感器运行时生成并丢弃海量数据。让所有特斯拉汽车将所有这些数据发回进行分析几乎是不可能的。联邦学习允许分布式协作，而无需回传所有这些数据，这作为一种方法非常有趣，值得赞赏。


    ## 脚注


    [1] https://arxiv.org/pdf/2108.07258.pdf


    [2] https://arxiv.org/pdf/1902.04885.pdf


    [3] https://ai.googleblog.com/2017/04/federated-learning-collaborative.html


    [4] https://arxiv.org/abs/1602.05629


