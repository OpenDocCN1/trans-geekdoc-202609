    # Substack Week 27: The future of machine learning


    Published on July 30, 2021


    Sooner than later, machine learning is just going to be an afterthought. Automated
    efforts to utilize and optimize machine learning will allow deployment as necessary
    and only to the advantage of the use case in question. We are also seeing machine
    learning efforts being packaged and built into products being delivered by day
    to day vendors. Yeah, I’m arguing that the future of machine learning is that
    it becomes omnipresent and no more or less exciting than virtualizing the hardware
    layer away from your day-to-day operations.


    For every edition of The Lindahl Letter, I pick an image for the social preview
    icon that people get when they visit the online edition. Every one of the emails,
    as far as I can tell, comes with one of my favorite images of Denver at the top
    of the email. Naturally, I went out to my repository of Google Photos and searched
    for something with snow in it to make a joke about the impending artificial intelligence
    winter that must be coming [1]. The best quick read about that is probably from
    Towards Data Science and is linked below [2]. That site includes a wonderful graphic
    about general slow-downs in the world of artificial intelligence that occurred
    in 1973 and 1988. You can probably tell from the first paragraph that I do not
    believe another round of artificial intelligence winter is coming based on how
    ubiquitous machine learning has become. At this point, I think it is more likely
    that machine learning will become so omnipresent that it’s an afterthought versus
    ever falling out of favor.


    **Footnotes:**


    [1] https://www.oreilly.com/data/free/files/evaluating-machine-learning-models.pdf
