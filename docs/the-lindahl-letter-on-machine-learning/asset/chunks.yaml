    大量机器学习用例已被证明行之有效。首先应瞄准并部署类似的用例。这是进入机器学习生态系统、并可能从机器学习策略中获得可靠 ROI 的最佳方法。通过外部 API
    执行可定义、可重复、且已被证明持久可靠的操作，总比尝试在组织内部做独特的事情要容易得多。其中一些用例回报可能非常丰厚，但要推动其走向成功将非常困难。因此，只想从
