    ## Substack 第 23 周：公平性与机器学习


    发布于 2021 年 7 月 2 日


    用于协助机器学习中公平性和偏见检测的工具开始推出。其中一些针对缓解措施，其他部分则是真正的补救努力。真正最重要的部分是将公平性识别为一个概念。您必须开始理解偏见在机器学习中意味着什么，才能着手进行缓解和补救。确保流程可定义且可重复，创造了质量的潜力。在此框架内，一个高质量、可定义且可重复的流程可以在机器学习开发和部署生命周期中考虑公平性。人们一直在解决这个话题。您可以回顾加州大学伯克利分校
    2017 年秋季的这门课程，以了解我们当时的状况 [1]。您仍然可以在 Vimeo 上观看介绍视频 [2]。从讲座中您真切地感觉到，他们希望我们能以有意义的方式解决算法中的偏见，以减少来自以人为中心的数据收集或评估中的偏见。


    自该讲座发布以来的这些年里，我们看到了各种事物的构建，旨在帮助在技术顾虑之外考虑偏见。我读了一篇 2018 年的文章，被引用了 331 次，由 Sam Corbett-Davies
    和 Sharad Goel 撰写，题为“公平性的度量与误度：公平机器学习的批判性回顾” [3]。这加强了我的观点：人们一直在尝试深入思考和考虑机器学习中的公平性。不幸的是，这种教育努力并未转化为算法和机器学习在实践中的应用。许多用例是基于“技术上可能的艺术”来解决的，而非基于对该技术应用的适当性和公平性的考量。


    ### 脚注


    [1] `https://fairmlclass.github.io/` CS 294: Fairness in Machine Learning, University
    of California Berkeley, Fall 2017


    [2] `https://vimeo.com/248490141`，自 2017 年发布至 2021 年 7 月已有 8,855 次观看。[注：到 2021
    年底，该数字已升至 9,577。]


    [3] `https://arxiv.org/pdf/1808.00023.pdf`


    ---


    ## Substack 第 24 周：评估机器学习


    发布于 2021 年 7 月 9 日


    许多人正逐渐习惯必须评估机器学习。您甚至可以买到 O''Reilly 专门针对该主题的书籍 [1]。决策一直在做出。我们开始看到机器学习被内置到应用程序中，并开始作为用例主动出现。对我来说，一切都回归到将使用机器学习的
    ROI 作为结果进行建模评估。在这种情况下，您是在评估在特定用例上使用机器学习的财务影响。有时您会陷入建模性能的细节，试图理解机器学习的“内部棒球”（内行细节）。这些要素是管理和在组织中部署机器学习的重要组成部分，但它们最终只是流程和诊断措施；评估应关注结果。所有这些完全可以作为计算机器学习用例
    ROI 评估中的输入。


    准备堆叠一堆关于评估机器学习的材料来写这篇文章，让我深刻意识到与该主题相关的内容有多少。人们在出售网格、白皮书和各种营销材料。几乎每家咨询公司都有关于如何在企业内评估机器学习模型和使用情况的看法。令人惊讶的是，他们在流程中投入了多少精力来掩盖最终且真实的问题：实施的
    ROI 会是多少。一般来说，在商业世界中，机器学习作为一个研发问题的时代已经过去了。在行业内，该技术已从投机性转变为可以合理置信地使用和开发的东西。

    '
