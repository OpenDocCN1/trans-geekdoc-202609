- raw: 'The hard part is pairing that knowledge with deep machine learning skills.
    That means you are going to need to start finding the subject-matter expert knowledge
    within your organization. When you start really pairing people that know what
    you’re doing at a super granular, deep level to be able to work with models and
    do deployments, things will take off. It will probably end up being a team effort.
    You have deep knowledge from subject-matter experts and machine learning experts.
    The combination of two groups in a team is how things get done in practice. You
    may want to bring in someone who is a real expert on building different layers
    and networks; being able to really build refined models, they may augment your
    team and speed things up. Sometimes you have to bring in the right folks to jumpstart
    things along the way.


    1.  Where does the talent come from?


    Personally, I believe you can build the talent from within your organization.
    If you doubted that assertion, then make a mental note to really challenge that
    bias against internal growth and development. Throughout my career, I have a proven
    track record of helping grow internal talent. It works, but it requires investing
    time and having the right programs aligned to building toolkits. One of my proudest
    professional accomplishments is seeing somebody get promoted. It is an amazing
    thing to see people start bringing advanced methods and techniques to different
    parts of the organization. You can capture that feeling as well. You just need
    to go out and start building out the toolkits of the people that you have. Really
    take the time to invest in them growing and developing as teammates and as individual
    contributors.


    We are in the golden age of learning about machine learning \[3\]. More training
    than you can possibly consume now exists online. It exists in a variety of different
    forms. Among my favorites are the online labs now available online. The one I
    have used the most is called Coursera. People have built out well-tooled examples
    of how to do machine learning. Not only can you read about it, but you can get
    into examples and kick the tires. That is the thing that has drawn me to TensorFlow
    since the product launched. So many people have been so generous with their knowledge,
    skills, and abilities \[4\]. They are sharing the keys to the machine learning
    kingdom online in accessible classes, lectures, and even a few certificates. I
    have taken over 50 courses. You can see them on my LinkedIn profile if you really
    want to dig into the road I traveled. That will show you which ones I invested
    my own time in completing. You can also just check the links in the footnotes
    to find a place to start. 


    Sometimes building internal teams is just not fast enough. It takes time to help
    internal talent develop world-class skills in machine learning—or anything, for
    that matter. I recognize that is a long-term goal and something you have to build
    toward along the way. You have a few options to start looking for ways to supplement
    talent. One of those ways is to hire contractors and have them help you kickstart
    your endeavor. Another way is to find the right product or company to help you
    get going fast. Several companies are doing that right now, and some can be impactful
    for your organization.


    Typically, the data sources in an organization are not well indexed with clearly
    mapped features and associations. Even getting off-the-shelf data sources is a
    real challenge. For the most part, the ones that people use were created to be
    used that way. Those data sets did not occur naturally in the wild. Even making
    custom-tailored synthetic datasets can be a challenge for an organization trying
    to operationalize machine learning at scale. That is where using external products
    to manage the data and even accessing APIs requires planning and sustained dedication.
    Data going to the APIs must be consistent. Constantly changing data streams are
    a nightmare to manage internally or externally. A lot of companies like Databricks
    are showing up to the party and helping make sense of complex data stores \[5\].


    That might have been a lot to consider all in one stretch of thought, but it will
    all come into context the first time building a team to solve a machine learning
    problem becomes a necessity. My answer to where the talent comes from involves
    blending great professionals together over time to create high-functioning teams.
    That may involve hiring in key skill sets to help supplement a team or investing
    in training the team if enough ramp-up time exists. The shorter the amount of
    ramp-up time, the greater the need to quickly bring in external talent.


    2.  How do you get the talent to work together?


    Now that we talked about where the talent comes from and how to think about investing
    in your teams, let’s switch gears and talk about how to get the teams to work
    together. This is one of those things that is much easier to talk about than to
    manage in practice. You can think about the mantra: let your leaders lead, let
    your managers manage, and let your employees succeed. That works well enough when
    you have agile teams who self-organize and rapidly get work done. If that is where
    you are sitting right now, then congratulations and appreciate what you have.


    Teams are about how the different players work together. I try to think about
    machine learning engagements as having two key pillars. First, you need to figure
    out who has the deep knowledge on the product, data, and how the data relate to
    the customer journey. This is going to be either obvious or hard. Sometimes these
    folks with the greatest institutional knowledge of the data are key subject-matter
    experts who play an impactful role, they could be buried deeper in the organization
    at an analyst role, or maybe they moved to another role.


    Second, find that person with deep knowledge and help them work with the machine
    learning expert you found. Pairing these two together is going to be the most
    critical lynchpin to what you are doing. Most organizations do have data structures
    that were architected to work from the start in machine learning. Figuring out
    the right places to start, what data to label, and what relates to what is really
    the beginning of the journey. This is one of the reasons why people with full
    stack machine learning skills are so important. What does that even mean? Full
    stack machine learning skills . I can walk into your organization and set up TensorFlow
    and even get the team sharing some Jupyter notebooks today. Having the right feeds,
    having the right machine learning hardware, and having access to right production
    side infrastructure to swiftly move data without crushing or breaking things are
    where full stack skills are essential.


    Maybe truly agile teams are supposed to be self-organizing, but that is probably
    not going to happen the first time out the gate. Finding a common or shared purpose
    sounds a lot easier than it really is in practice. Getting people to self-organize
    around that common or shared purpose probably requires some type of ground rules
    or spark.


    Sometimes high-functioning teams just embrace the challenge and work to knock
    down any barriers or obstacles they might face. Most teams do not have that level
    of dedication, persistence, or fortitude. Typically, the project needs or general
    business problems bring a group together to take some type of action. Managing
    during those types of situations is always interesting and generally includes
    trying to bring people with diverse skill sets together.'
