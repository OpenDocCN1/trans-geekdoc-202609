  trans: "\n\n![](img/cover.jpg)\n\n# 林达尔通讯：论机器学习\n\n## 奈尔斯·林达尔其他著作\n\n### 非虚构类书籍\n\
    \n- Graduation With Civic Honors\n- Responsive E-Government\n- The Lindahl Letter:\
    \ On Machine Learning\n\n作者：奈尔斯·林达尔\n\n> “只有那些愿意在可能的边缘之外努力工作的人，才能成就有意义的事业。”\n\
    >\n> — 奈尔斯·林达尔\n\n林达尔通讯：论机器学习\n\n版权所有 © 2022 奈尔斯·林达尔\n\n未经出版商书面许可，本书任何部分不得以任何形式或任何方式复制或传播，包括复印、录音、录像，或通过任何信息存储和检索系统。\n\
    \n由奈尔斯·林达尔出版\n\n在美国印刷\n\nISBN: 978-1-716-01740-7\n\n版次：Lulu.com\n\n## 献词\n\n献给那些展望未来、穿针引线以达彼岸的人们……\n\
    \n## 致谢\n\n感谢我第一年所有 Substack 文章的读者，你们帮助激发了这项工作。在写书的过程中能一路获得反馈真是太好了。我想明年这种方法将是再次做同样事情、为\
    \ 2022 年产出手稿的绝佳途径。\n\n# 目录\n\n- 献词\n- 致谢\n- 前言\n- Substack 第 1 周：机器学习投资回报率\n-\
    \ Substack 第 2 周：机器学习框架与流水线\n- Substack 第 3 周：机器学习团队\n  - 人才从何而来？\n  - 如何让人才协同工作？\n\
    - Substack 第 4 周：制定机器学习战略……重访\n  - 究竟什么是机器学习战略？\n  - 你真的需要机器学习战略吗？\n- Substack\
    \ 第 5 周：让投资回报率驱动基于事实的决策过程\n- Substack 第 6 周：将持续成本和成功标准纳入机器学习战略\n- Substack 第 7\
    \ 周：基于成功的投资回报率规划增长\n- Substack 第 8 周：我们需要的机器学习现在无处不在了吗？\n- Substack 第 9 周：基于规模评估机器学习用例价值\n\
    - Substack 第 10 周：小样本 GPT-2 的模型可扩展性\n- Substack 第 11 周：什么是机器学习规模？机器学习使用的地点与时机\n\
    \  - 简要演示摘要\n  - 研究免责声明\n  - 第 1 部分：启动：规模究竟是什么？\n  - 第 2 部分：分析：常见机器学习用例：“规模与成熟度”\n\
    \  - 第 3 部分：指导：深耕机器学习规模\n- Substack 第 12 周：多机器学习模型部署中的混淆因素\n- Substack 第 13 周：构建你的\
    \ MLOps\n  - 我们涵盖了什么？\n- Substack 第 14 周：重温我的 2019 年 Ai4 Healthcare NYC 演讲\n \
    \ - 人才从何而来？\n  - 如何让人才协同工作？\n  - 这些工作流是什么，为什么它们很重要？\n  - 你能用机器学习解决什么问题？\n  - 究竟什么是机器学习战略？\n\
    \  - 机器学习向量是什么意思？\n  - 什么是 KPI 汇编？\n  - 机器学习推动业务发展的例子有哪些？\n- Substack 第 15 周：人们真正在用机器学习做什么？\n\
    - Substack 第 16 周：持续的机器学习云成本\n  - 类别 1：“可调用之物”，如外部 API 服务\n  - 类别 2：“可驻留之地”，或可构建足迹的生态系统\n\
    \  - 类别 3：“自建之物”，如开源和自研工具解决方案\n- Substack 第 17 周：评估机器学习就绪度\n- Substack 第 18 周：机器学习能预测彩票吗？\n\
    - Substack 第 19 周：对错过机器学习的恐惧\n- Substack 第 20 周：第 20 周林达尔通讯回顾版\n- Substack 第 21\
    \ 周：开展机器学习工作\n- Substack 第 22 周：机器学习图形\n- Substack 第 23 周：公平性与机器学习\n- Substack\
    \ 第 24 周：评估机器学习\n- Substack 第 25 周：教导孩子\n- Substack 第 26 周：机器学习即服务\n- Substack\
    \ 第 27 周：机器学习的未来\n- Substack 第 28 周：机器学习认证？\n- Substack 第 29 周：机器学习特征选择\n- Substack\
    \ 第 30 周：集成与你的机器学习层\n- Substack 第 31 周：边缘机器学习集成\n- Substack 第 32 周：联邦化你的机器学习模型\n\
    - Substack 第 33 周：人工智能投资来自何处？\n- Substack 第 34 周：主要人工智能实验室在哪里？\n- Substack 第 35\
    \ 周：现代机器学习中的可解释性\n- Substack 第 36 周：AIOps/MLOps：人工智能服务消费与运营\n- Substack 第 37 周：GPT-2\
    \ 或 GPT-3 逆向工程\n- Substack 第 38 周：大多数机器学习项目都会失败吗？\n- Substack 第 39 周：机器学习安全\n\
    - Substack 第 40 周：应用机器学习技能\n- Substack 第 41 周：机器学习与元宇宙\n- Substack 第 42 周：时间晶体与机器学习\n\
    - Substack 第 43 周：实用机器学习\n- Substack 第 44 周：机器学习薪资\n- Substack 第 45 周：提示工程与机器学习\n\
    - Substack 第 46 周：机器学习与深度学习\n- Substack 第 47 周：异常检测与机器学习\n- Substack 第 48 周：重访机器学习应用\n\
    - Substack 第 49 周：机器学习资产\n- 后记\n- 关于作者\n\n# 前言\n\n问候，受启发的机器学习荣耀读者。\n\n当我于 2021\
    \ 年初开始这项事业时，几乎每个人似乎都在写 Substack。作为一个平台，Substack 迅速增长，一度占据了公众视野的几个焦点时刻。目前只有少数 Substack\
    \ 作者仍能从人群中脱颖而出。像所有拥有社区的时事通讯或写作项目一样，受众决定了持续成功的成败。这系列每周文章被汇编成了一部手稿。每篇文章都经过编辑，从原始形式转变为更适合出版的格式。Substack\
    \ 作为一个平台，提供了极大的自由度来包含链接和嵌入式内容，但这些无法转化为书面页面。\n\n我注意到的一件事是，前几篇文章比系列末尾的文章长得多。看来当我开始笼统谈论机器学习时，我想表达的相关内容要多得多。鉴于每周的文章都是为独立阅读而写，我的所有参考资料都以直观的脚注方式处理。任何旁注、链接或对其他作者的致谢都发生在章节末尾的脚注中。\n\
    \n这个高度技术驱动的领域变化迅速。我包含了出版日期作为参考坐标。\n\n奈尔斯·林达尔 博士\n\n科罗拉多州 布鲁姆菲尔德\n\n2021 年 12 月\
    \ 15 日 下午 7:49\n\n# Substack 第 1 周：机器学习投资回报率\n\n发布于 2021 年 1 月 29 日\n\n在机器学习工作上要具有战略眼光。\n\
    \n> 要\n> 具\n> 战\n> 略\n> 眼\n> 光\n\n认真说，这七个字（原文七个单词）应指引你在机器学习旅程中的下一步。请花一点时间，让这个方向（强有力的指引）沉淀下来，并反思它对你的组织真正意味着什么。你必须花一点时间，从为组织构建战略价值倒推，回到你正在开展的实际机器学习工作中。在这项工作内部，你会迅速发现，要将机器学习工作投入运营以产生战略价值，将依赖于一份可靠的投资回报率（ROI）计划。确保你从一开始就以此为终极目标，以增加成功的几率。在不了解潜在投资回报率或潜在损失的情况下，在任何类型的组织内采取机器学习所能实现规模的行动，是极其可疑的。这就是为什么你必须从头到尾在机器学习工作上保持战略性。\n\
    \n"
