- raw: 'You will encounter two types of teams: high-performing teams that are already
    assembled and teams that come together based on a specific business problem. Outside
    of those two common scenarios, the other type of talent situation you will face
    might very well be a solution-chasing problem. It happens now more than ever when
    the market is saturated with open-source projects that let people jump in and
    start working with complex tools. The next step in that pattern is wanting to
    do something with that new and exciting tooling. To that end, you may find a solution
    just waiting for a problem to tackle. However, it might not be the right solution
    or even remotely close to the course of action that should be taken.


    Getting talent to work together for me revolves around the business problem and
    what the team is trying to achieve. It is hard to rally around an end goal that
    is nebulous or otherwise pragmatic co-opted into something other than a resolution
    to the business problem in question.


    We should probably jump in and spend a little bit of time on understanding the
    tooling necessary to allow the machine learning expert to work with the team in
    a productive way. You can probably tell by now that my preference is for using
    something robust like TensorFlow to dig in and start doing machine learning at
    scale. You could just start out with log files and dig in with an off-the-shelf
    product like the machine learning toolkit from Splunk. That is an example of a
    way to open the door for the team to start using a common platform to get things
    done. 


    This is a topic that I’m super passionate about. I am always happy to talk to
    people about how to take the first steps to build up internal talent for machine
    learning.  


    Footnotes:


    \[1\] Here is a good look at machine learning papers. The volume of publication
    in the space is expanding exponentially. https://www.technologyreview.com/2019/01/25/1436/we-analyzed-16625-papers-to-figure-out-where-ai-is-headed-next/


    \[2\] https://github.com/tensorflow/tfx/tree/master/tfx/examples/chicago\_taxi\_pipeline


    \[3\] Check out https://www.coursera.org/browse/data-science/machine-learning
    and https://www.qwiklabs.com/focuses/3391?parent=catalog


    \[4\] Two of my favorite people to follow, @DynamicWebPaige and @lak\_gcp: https://twitter.com/DynamicWebPaige
    and https://twitter.com/lak\_gcp


    \[5\] I’m working daily to learn more about this company: https://databricks.com/


    Substack Week 4: Have a machine learning strategy…revisited


    Published on February 19, 2021


    Welcome to the fourth post in this ongoing Substack series. This is the post where
    I’m going to go back and revisit two very important machine learning questions.
    First, I’ll take a look back at my answers to the question, “What exactly is a
    machine learning strategy?” Second, that will set the foundation to really dig
    in and answer, “Do you even need a machine learning strategy?” Obviously, the
    answer to the question is a hard yes, and you know that without question or hesitation. 


    1.  What exactly is a machine learning strategy?


    As you start to sit down and begin the adventure that is linking budget line items
    to your machine learning strategy, it will become very clear that some decisions
    have to be made \[1\]. That is where you will find that your machine learning
    strategy has to be clearly defined and based on use cases with solid ROI. Otherwise
    your KPIs that are directly tied back to those budget line items are going to
    show performance problems. Being planful helps make sure things work out. 


    Over the last couple of weeks this Substack series, The Lindahl Letter , has dug
    into various topics including machine learning talent, machine learning pipelines,
    machine learning frameworks, and of course ROI modeling. Now (like right now)
    it is time to dig into your machine learning strategy. Stop reading about it and
    just start figuring out how to do it. Honestly, I held off on this post until
    we had some foundational groundwork set up to walk around the idea conceptually
    and kick the tires on what your strategy might actually look like. No matter where
    you are in an organization, from the bottom to the top, you can begin to ideate
    and visualize what could be possible from a machine learning strategy. Maybe start
    with something simple like a strategy statement written in a bubble located in
    the middle of a piece of paper and work outward with your strategy. That can help
    you focus on a data-driven machine learning strategy based on a planful decision-making
    process \[2\].


    Part of your machine learning strategy must be about purpose, replication, and
    reuse. That is going to be at the heart of getting value back for the organization.
    Definable and repeatable results are the groundwork to predictable machine learning
    engagements. Machine learning is typically applied in production systems as part
    of a definable and repeatable process. That is how you get quality and speed.
    You have to have guardrails in place that keep things within the confines of what
    is possible for that model. Outside of that, you must be clear on the purpose
    of using machine learning to do something for your organization. That strategy
    statement could be as simple as “locate five use cases where at-scale machine
    learning techniques could be applied in a definable and repeatable way.”


    Maybe your strategy starts out with a budget line item investing in the development
    of machine learning capabilities. Investment in training happens every year and
    is pretty straightforward. Now you have part of it tagged to machine learning.
    From that perspective, you could be walking down a path where you are doing it
    purely for employee engagement, because the team just really wants to do something
    cool and wants to leverage new technology. You may find yourself in a situation
    where the team really wants to do it and you can make that happen. Sure, they
    might figure out a novel way to use that energy and engagement to produce something
    that aligns to the general guiding purpose of the organization. Some of that is
    where innovation might drive future strategy, but it is better to have your strategy
    drive the foundations of how innovation is occurring in the organization. A myriad
    of resources about strategy exist, and some of them are highly targeted in the
    form of online courses \[3\].


    From a budget line item to actually being operationalized, you have to apply your
    machine learning strategy in a uniform way based on potential ROI. After you do
    that, you will know you are selecting the right path for the right reasons. Then
    you can begin to think about replication of both the results and process across
    as many applications as possible. Transfer learning both in terms of models and
    deployments really plays into this. You will realize that after you figured out
    how to do it with quality and speed, applying that to a suite of things can happen
    more quickly. That is the power of your team coming together and being able to
    deliver results. 


    2.  Do you even need a machine learning strategy?


    Seeing the strategy beyond trees in the random forest takes a bit of perspective.
    Sometimes it is easier to lock in and focus on a specific project and forget about
    how that project fits into a broader strategy. Having a targeted machine learning
    strategy that is applied from the top down can help ensure the right executive
    sponsorship and resources are focused on getting results. Instead of running a
    bunch of separate self-incubating efforts, have a definable and repeatable process
    to roll out and help ensure the same approach can be replicated in cost-effective
    ways for the organization. That being said…of course you need a machine learning
    strategy. '
