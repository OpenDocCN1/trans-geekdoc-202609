    # AIOps、MLOps 与 ModelOps 探讨


    回到手头与 AIOps 和 MLOps 相关的话题。前几天有人试图说服我将 `ModelOps` 视为方程式的主要组成部分。你们所见过的我的多场演讲，都是对开源
    `MLOps` 技术和公司领域的研究。该研究轨迹从未偏向 `ModelOps` 领域，也未深入与图相关的公司兔子洞。虽然有时基于图的事物非常有趣，且人们会用一系列充满激情的推销词来推销它们。然而，本话题旨在深入探讨在消费点上人工智能服务与运维之间的差异。


    在 Google Scholar 中快速搜索 `AIOps` 会得到约 657 个结果 [^2]。其中一些结果颇具趣味，但最相关的结果非常简短，且仅被引用
    59 次：Dang 等人撰写的“AIOps: Real-World Challenges and Research Innovations” [^3]。该文献似乎引用了
    `AIOps`，并聚焦于 `Moogsoft` 的一个网站，值得一读 [^4]。我的工作聚焦于与 `MLOps` 相关的开源软件，这与谈论 `AIOps`
    的人群关注的领域不同。在很大程度上，`MLOps` 旨在解决如何构建工具和工作流，以在生产环境中运维机器学习模型。


    **脚注：**


    [^1]: https://www.gov.uk/government/publications/national-ai-strategy

    [^2]: https://scholar.google.com/scholar?hl=en&as_sdt=0%2C6&q=AIOPs&btnG=

    [^3]: https://ieeexplore.ieee.org/abstract/document/8802836

    [^4]: https://www.moogsoft.com/resources/aiops/guide/everything-aiops/


