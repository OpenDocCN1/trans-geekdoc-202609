- raw: 'During the very long car ride back to Kansas City from Denver for Thanksgiving
    this year, the whole family got to listen to an audiobook called The Age of AI
    and Our Human Future by Henry Kissinger, Eric Schmidt, and Daniel Huttenlocher
    (2021). Outside of an oddly lengthy aside about the history of philosophical considerations
    going back to Plato that snuck into a chapter—you will know it when you get to
    it—the book itself was a pretty good read and provided solid examples of where
    artificial intelligence currently stands. They were super quick to point out limitations
    at the point when the book was written.


    One of the things about working within the space of modern machine learning is
    the very real necessity of prompt engineering and having people who understand
    it. Is this just a very fancy method of leading the witness? That could very well
    be the case. The cornucopia of large language models being released about monthly
    now are all pretty much interacted with based on prompt engineering \[1\]. The
    other day I spent some time looking at the Megatron-Turing large language model
    and trying to consider how much bigger a model could get before the language it
    was modeling would be exhausted \[2\]. To me it was sort of a modernity adjacent
    version of the Borges’ Map fable. To exhaustively map everything would seemingly
    be an effort to create a mirror of modernity. At 530 billion parameters, it is
    an exceedingly large generative language model. These models are super interesting.
    You might recall that paper from a ton of Stanford University professors, “On
    the Opportunities and Risks of Foundation Models” \[3\]. This paragraph took a
    bit to get to the point of this missive that these types of models are here to
    stay and require a special skill set called prompt engineering.


    To engage in prompt engineering, people are going to face challenges getting the
    expected outputs \[4\]. You work with the model by giving it prompts or writing
    a predefined prompt package to make it create outputs from the model. During the
    course of building my own bot using the GTP-2 model, I learned quickly that even
    with millions of words of my own writing corpus, it required the right type of
    prompt to get output from the model that matched my writing style \[ 5 \]. That
    is what makes prompt engineering so interesting in terms of supremely large language
    models. People spend so much effort compiling, training, and packaging these generative
    models (foundation models) that needing a specialized skill set to work with them
    is an interesting situation to have occurred. 


    Footnotes:


    \[1\] https://blog.andrewcantino.com/blog/2021/04/21/prompt-engineering-tips-and-tricks/


    \[2\] https://developer.nvidia.com/blog/using-deepspeed-and-megatron-to-train-megatron-turing-nlg-530b-the-worlds-largest-and-most-powerful-generative-language-model/


    \[3\] https://fsi.stanford.edu/publication/opportunities-and-risks-foundation-models


    \[4\] http://ai.stanford.edu/blog/in-context-learning/


    \[5\] https://github.com/nelslindahlx/NLP/blob/master/Yet\_another\_working\_GPT2\_corpus\_example\_with\_checkpoint.ipynb


    Substack Week 46: Machine learning and deep learning


    Published on December 10, 2021


    Our friends over at IBM are eager to answer questions about the differences between
    general artificial intelligence, artificial intelligence, deep learning, and machine
    learning \[ 1 \]. I’m listening to Bruce Springsteen’s song “Darkness on the Edge
    of Town” while working on this post this morning. You get questions of a digital
    divide, ethics, and equality starting to be generated as you evaluate all the
    different aspects of the above-mentioned technologies. My treatment of the terms
    here is really about functionality and not the potential consequences of that
    functionality. I’ll take a look at that during a future Substack post, but not
    explicitly during this turn of the wheel \[2\]. You can rest assured that Timnit
    Gebru (formerly of Google) is now hard at work on this topic with a new think
    tank, the Distributed Artificial Intelligence Research Institute (DAIR) \[ 3 \].
    We took an important veer to the philosophical side on the introduction here to
    the topics in question. A lot of complexity exists within both the technology
    and the applications of the technology in question. Both sides of those concerns
    have to be considered; just because you can do a thing does not mean that you
    should. While the logic in that last sentence is easy for you to parse and understand
    as a reader, it does not parse in a model with the same ethical frame of reference
    you bring naturally to the process.


    You might have snuck ahead to that link from the IBM blog, and you already know
    that general artificial intelligence is a desired future state (or at least much
    anticipated future state) where an instance of artificial intelligence could handle
    multiple scenarios like a person does. Right now most of the work in artificial
    intelligence is defined to a specific problem and use case, thus making it a special
    case and not a general case. Both machine learning and deep learning are going
    to end up being a highly focused effort to do a specific thing or to learn about
    a specific set of content. Our friends over at IBM would be quick to explain at
    length that deep learning is a subset of machine learning \[ 4 \]. Generally speaking,
    that is an easy assertion to make, but it might not celebrate deep learning in
    the way it deserves as a truly interesting method of discovery. You can do a ton
    of different types of machine learning based on algorithmic approaches, and at
    some point you will run into a problem where you have something like a ton of
    images you want to work against a neural network with layers to deeply learn features
    and elements. When you veer into deep learning, you are unlocking some capabilities
    in the machine learning space that are interesting at the very least.


    Footnotes:


    \[1\] https://www.ibm.com/cloud/blog/ai-vs-machine-learning-vs-deep-learning-vs-neural-networks


    \[2\] Right now Weeks 64 and 65 are queued up for a post on ethics in machine
    learning and a question about machine learning and the digital divide.


    \[3\] https://www.washingtonpost.com/technology/2021/12/02/timnit-gebru-dair/


    \[4\] https://www.ibm.com/cloud/learn/deep-learning


    Substack Week 47: Anomaly detection and machine learning


    Published on December 17, 2021


    Examples abound from how people are using machine learning to detect anomalies,
    going back 20 years \[1 \]. Let’s take this week’s consideration of anomaly detection
    in two general ways. First, the most interesting example to me of anomaly detection
    in terms of human life comes from the applied medical research space. Advances
    in medical imaging have allowed the possibility of using machine learning to detect
    anomalies in scans by either enhancing the process of detection or helping direct
    doctors to take a closer look at specific images. Second, anomaly detection is
    all over the security space. Given systems where data are generally consistent
    in that space, any abnormality could be pattern matched to help prove an outlier
    is an anomaly. Between those two spaces of medicine and security, you can see
    a wide variety of examples for anomaly detection.'
