    # 机器学习部署路径的分歧


    在机器学习领域，存在一个分岔路口：如何评估机器学习用例的价值，这在一定程度上将用例分为了两类。


    ## 开箱即用的云 API 方案


    您有大量开箱即用的选项，只需基于云 API 端点提供的模型进行少量配置和设置即可使用。当然，您需要建立连接并建立商业关系，但总体而言，这是大规模入门机器学习领域最简单的方式。这些解决方案并非高度定制化的部署，并且从一开始就包含了一定的按交易计费成本。


    ## 自建模型部署方案


    或者，您可以构建并提供自己的模型，而不必求助于基于云的 API 机器学习解决方案。这意味着开箱即用且可扩展的解决方案与需要一定程度的初始和持续投资的高度定制化部署之间存在天然冲突。


    ## 参考文献


    [1] *Big Data, Data Mining, and Machine Learning: Value Creation for Business
    Leaders and Practitioners* by Jared Dean (2014)


    [2] “When Not to Use Machine Learning or AI” (Towards Data Science) by Cassie
    Kozyrkov, who also shares some great content on decision-making here: https://decision.substack.com/


    [3] See “Substack Week 11: What is machine learning scale? The where and the when
    of machine learning usage” and “Substack Week 16: Ongoing machine learning cloud
    costs.”


