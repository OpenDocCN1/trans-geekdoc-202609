    # Substack 第 8 周：我们需要的机器学习现在无处不在吗？


    发布于 2021 年 3 月 19 日


    正如你读到的标题“我们需要的机器学习现在无处不在”，你们中的一些人看了一眼 Apple Watch。你不必费力寻找，就能在日常生活中看到机器学习的应用。多年来，人们一直在论证机器学习无处不在
    [1]。现在，如果机器学习在你的日常生活中已变得如此显而易见，你只能想象它在商业世界中渗透得有多深 [2]。几乎每个供应商、每个应用程序和每项底层技术都在投资机器学习和人工智能的某种组合
    [3]。这创造了一些有趣的局面：机器学习模型以意想不到的方式复合且相互干扰地运行。是的，我为最后那句话感到自豪。我致力于探讨模型如何既能复合又能相互干扰。这或许只是用啰嗦的方式说：要么模型产生了有效结果，要么产生了冲突。


    ## 我们已到达这样一个阶段：企业可能不了解组织内运行的所有不同机器学习要素


    我们已到达这样一个阶段：企业可能不了解组织内运行的所有不同机器学习要素。它们甚至可能相互冲突。聊天机器人可能试图快速回答简单问题并以极低摩擦结束对话。另一个机器学习要素可能正在运行，评估组织能为客户提供哪些选项、机会或建议，而那整条对话线可能永远不会被触发。你必须记住，定向优化算法可能与参与度策略背道而驰。你也可能拥有复杂工作流的不同部分、程序或要素，它们沿途以截然不同的目的和结果运行。这种相互纠缠的依赖关系将给你的整体机器学习战略带来灾难。这很可能是机器学习战略失败或根本不存在真实战略的证据。


    ### 脚注


    [1] 2017 年来源 https://www.datanami.com/2017/07/03/machine-learning-everywhere-preparing-future/


    [2] https://blog.udacity.com/2016/06/machine-learning-everywhere-netflix-personalized-medicine-fraud-prevention.html


    [3] https://www.nytimes.com/2021/02/23/technology/ai-innovation-privacy-seniors-education.html


