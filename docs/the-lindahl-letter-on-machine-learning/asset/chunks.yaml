- raw: 'Build models. You could of course buy a model \[5\]. Steps exist to help you
    build a model. All of the machine learning pipeline setup steps are rather academic,
    without models that utilize the entire apparatus. One way to introduce machine
    learning to the relevant workflow based on your use case is to just integrate
    with an API to avoid having to set up frameworks and pipelines. That is one way
    to go about it, and for some things it makes a lot of sense. For other machine
    learning efforts, complexity will preclude using an out-of-the-box solution that
    has a callable API. You would be surprised at how many complex APIs are being
    offered these days, but they do not provide comprehensive coverage for all use
    cases \[6\]. 


    What are you going to do with all those models? You are going to need to save
    them for serving. Getting set up with a solid framework and machine learning pipeline
    is all about serving up those models within workflows that fulfill use cases with
    defined and predictable ROI models. 


    From the point you implement, it is going to be a race against time to figure
    out when those models from the marketplace suffer an efficiency drop and some
    type of adjustment is required. You have to understand the potential model degradation
    and calculate at what point you have to shut down the effort due to ROI conditions
    being violated \[7\]. That might sound a little bit hard, but if your model efficiency
    degrades to the point that financial outcomes are being negatively impacted, you
    will want to know how to flip the off switch, and you might be wondering why that
    switch was not automated. 


    Along the way some type of adjustment to a model or parameters is going to be
    required. To recap, the way I look at ROI is pretty straightforward. You have
    to consider the value of the machine learning model in terms of what was invested
    in it and what you can potentially get out of it. It’s just going to give you
    a positive or negative look at whether that ROI is going to be there for you.
    At that point you are just following your strategy and thinking about the ROI
    model.


    So again, strict ROI modeling may not be the method that you want to use. I would
    caution against working for long periods without understanding the financial consequences.
    At scale, you can very quickly create breakdowns and other problems within a machine
    learning use case. It could even go so far that you may not find it worthwhile
    for your business case. Inserting machine learning into a workflow might not be
    the right thing to do, and that is why calculating results and making fact-based
    decisions is so important. 


    Really, any way you do it in a planful way that’s definable and repeatable is
    going to work out great. That is fairly easy to say given that fact-based decision-making
    and being willing to hit the off switch if necessary will help prevent runway
    problems from becoming existential threats to the business. So having a machine
    learning strategy, doing things in a definable and repeatable way, and being ruthlessly
    fact based is what I’m suggesting. 


    Obviously, you have to take everything that I say with a grain of salt; you should
    know up front that I’m a big TensorFlow enthusiast. That’s one of the reasons
    why I use it as my primary example, but it doesn’t mean that that’s the absolute
    right answer for you. It’s just the answer that I look at most frequently and
    always look to first before branching out to other solutions. That is always based
    on the use case, and I avoid letting technology search for problems at all costs.
    You need to let the use case and the problem at hand fit the solution instead
    of applying solutions until one works or you give up.


    At this point in the story, you are thinking about or beginning to build this
    out, and you’re starting to get ramped up. The excitement is probably building
    to a crescendo of some sort. Now you need somewhere to manage your models. You
    may need to imagine for a moment that you do have models. Maybe you bought them
    from a marketplace and you skipped training all together. It’s an exciting time,
    and you are ready to get going. So in this example, you’re going from just building
    (or having recently acquired) a machine learning model to doing something. At
    that moment, you are probably realizing that you need to serve that model out
    over and over again to create an actual machine-learning-driven workload. That
    probably means that you are not only getting to manage those models, but also
    going to need to serve out different models over time. 


    As you make adjustments and corrections that introduce different modeling techniques,
    you get more advanced with what you are trying to implement. One of the things
    you’ll find is that even the perfect model that you had, which was right where
    you wanted it to be when you launched, is slowly waiting to betray you and your
    confidence in it by degrading. You have to be ready to model and evaluate performance
    based on your use case. That is what lets you make quality decisions about model
    quality and how outcomes are being impacted. 


    I have a few takeaways to conclude this installment of The Lindahl Letter . You
    have to remember that at this point machine learning models and pipelines are
    pretty much democratized. You can get them. They are out in the wild. People are
    using them in all kinds of different ways. You can just go ahead and introduce
    this technology to your organization with relatively little friction.


    Footnotes:


    \[1\] Links to the referenced machine learning pipelines: https://www.tensorflow.org/tfx
    , https://aws.amazon.com/sagemaker/pipelines/ or https://docs.microsoft.com/en-us/azure/machine-learning/concept-ml-pipelines


    \[2\] One of the best places to start to learn about machine learning communities
    would be https://www.kaggle.com/


    \[3\] Read this if you have a few minutes, it is worth the read: https://hbr.org/2020/09/how-to-win-with-machine-learning


    \[4\] https://github.com/tensorflow/tfx


    \[5\] This is one of the bigger ones: https://aws.amazon.com/marketplace/solutions/machine-learning


    \[6\] This is one example of services that are open for business right now: https://cloud.google.com/products/ai


    \[7\] This is a wonderful site and the article is spot on: https://towardsdatascience.com/model-drift-in-machine-learning-models-8f7e7413b563


    Substack Week 3: Machine learning teams


    Published on February 12, 2021


    Learning. Keep learning. Being a lifelong learner is a solid plan. I do honestly
    believe we live in a golden age of machine learning training and talent. People
    are selflessly sharing world-class training materials and code on GitHub. The
    number of academic papers being shared is skyrocketing \[1\]. For those folks
    able to start sprinkling in a little bit of expertise as you go, you can start
    building teams from the ground up. That starts by helping people invest in understanding
    this type of machine learning knowledge. That sets the foundation for them so
    they can build the machine learning pipelines you need with something like TensorFlow
    Extended examples \[2\]. That is one way to help them understand how those pipelines
    work for building and deploying. I think all the training to be able to do that
    is just amazingly available online; people have been super gracious with sharing
    that kind of knowledge. '
