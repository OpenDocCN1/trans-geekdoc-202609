    a cost-containment or cost-saving program to help introduce assistive machine
    learning products to allow a workforce to do things more quickly with fewer errors.
    Executing that strategy would require operationalizing it and collecting data
    on the processes in action to track, measure, and ensure positive outcomes.


    Footnotes:


    \[1\] Check out this article from February 2020 about KPIs and budgets: https://hbr.org/2020/02/create-kpis-that-reflect-your-strategic-priorities


    \[2\] Interesting blog post from AWS: https://aws.amazon.com/blogs/machine-learning/developing-a-business-strategy-by-combining-machine-learning-with-sensitivity-analysis/


