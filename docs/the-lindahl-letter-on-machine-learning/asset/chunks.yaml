    ## Substack Week 16: Ongoing machine learning cloud costs


    Published on May 14, 2021


    People make decisions about where to run instances of machine learning every day
    in the business world. Previously, we have talked about how that ongoing expense
    of being in the cloud is moving toward APIs from `Azure`, `AWS`, and `GCP`. Back
    during my Substack Week 11 post, “What is ML scale? The where and the when of
    ML usage,” I introduced a concept that needs to be referenced here. That concept
    includes breaking down the categories of machine learning use cases into three
    buckets:


    Those three buckets are a useful construct to consider the ongoing machine learning
    cloud costs you might face. Those ongoing expense-based costs are going to end
    up falling into one of those buckets, and they present very differently.


    ### Bucket 1: “Things you can call,” such as external API services


    This is an exciting and growing place to be. You found a use case that works for
    you, and you are ready to go out and work with an API from `Azure`, `AWS`, or
    `GCP`. A ton of them exist and can present an answer for a ton of different workflows.
