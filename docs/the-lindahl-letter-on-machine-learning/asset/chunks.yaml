    # 在搜索引擎中搜索机器学习增长策略时要小心


    在搜索引擎中搜索机器学习增长策略时要小心。这会让你“被跟踪”一段时间。你会收到各种各样的广告推送 [2]。在顺着这条搜索路径探索的过程中，我看到一份预估，称机器学习市场规模将在
    2022 年达到约 88.1 亿美元 [3]。乍一看，这个预估似乎挺有意思。这可能源于我最近读到的一篇文章，关于 Google 构建了一个名为 Model
    Search 的工具，它本质上是一个用于寻找机器学习模型的开源平台 [4]。这真的引起了我的注意。存在大量用例，且许多用例已有训练好的模型。无需自行承担训练模型的成本即可快速上手，这能为你的工作提供一个良好的开端。我对此有个想法，将在几周后分享。未来它可能会演变成一个项目。


    ## 执行计划可以带来丰厚回报


    执行计划可以带来丰厚回报。当该计划与预算级 KPI 挂钩且拥有可靠的 ROI 时，回报甚至是可量化的。你必须基于成功的 ROI 来规划增长。这发生在支出与旨在实现成功结果的预算项目挂钩时。部分工作在于了解你的
    KPI 并管理过程，另一部分则在于具备财务纪律来构建 ROI 模型并执行该策略。是的，有计划的增长比听起来要难。你会发现，制定分层计划以推进工作涉及将战略愿景落地并按计划执行。其中一些对组织来说是触手可及的“低垂果实”，而其他部分则是更复杂的算法用例
    [5]。


    ## 梳理一份真正可靠的、能驱动增长的用例清单是一项值得尝试的挑战


    梳理一份真正可靠的、能驱动增长的用例清单是一项值得尝试的挑战。这不仅仅是规避成本或削减持续运营开支；而是寻找真正存在增长潜力的领域。这是理解业务的核心部分，最终应与预算定义紧密挂钩。一个可靠的战略规划会将正确的投资与未来正确的方向联系起来。这句话听起来简单，但实践起来很难。存在增长潜力的领域可能在一年内发生变化和转移。某些推进工作会比其他工作更成功。这就是为什么你需要正确的
    KPI 来驱动和引导进度证据，或揭示需要领导团队介入协助以保持正轨的领域。


