    # Substack Week 10: 面向小样本 GPT-2 的模型可扩展性


    **发布日期：2021 年 4 月 2 日**


    您可能已经听说过生成式预训练转换器模型，或在过去一年的新闻文章中读到过它。它在发布时引起了相当大的轰动。让我们深入探讨，从一个问题开始：“什么是 GPT-2
    甚至 GPT-3？” 让我们先了解一些关于小样本学习究竟包含什么的基础知识，随后再研究它如何与 GPT-2 相关联。


    您可能知道，小样本学习是一种方法，它获取一个构建完善且定义明确的模型，仅使用少量训练数据通过尝试几次来实现有利的结果 [1]。基本上，您是基于少量数据进行预测。网上有更好的表述方式并已免费分享，您稍微搜索一下就能找到，但我认为这为探讨主题的第二部分奠定了基础。


    我对 OpenAI 的 GPT-2 和 GPT-3 模型项目都非常感兴趣 [2]。它们是以预测性语言建模为目标设置的 GPT 模型。这是一套非常有趣的技术，基于其在实践中所承诺的潜力，吸引了我的注意力以及许多其他人的关注
    [3]。目前 GPT-3 的提供方式是，您可以通过 API 部署以功能性方式调用模型，并能获得非常有趣的结果。您只需给它一个提示或一小段文本，它就准备好输出内容。人们担心
    GPT-3 可能会创造出近乎无尽的内容流，变得如此普遍以至于挤占所有其他相关内容。这可能是首次通过泛滥内容流发起的“拒绝内容攻击”。它可能创建独特的内容，以至于过滤和拦截方法难以轻易遏制。


    完全基于调用 GPT-2 或 GPT-3 生成式语言模型的机器学习工作流部署，目前可能尚未达到生产就绪状态。模型可能会输出一些奇怪而有趣的东西，除非这正是您想要的用例，否则它可能还没准备好输出帮助台类型的文档或可直接面向客户的内容。考虑到模型偶尔会产生的惊人结果，那可能是一个非常糟糕的计划。


    您可以访问 OpenAI 网站，深入了解他们试图用语言模型做什么。大型语言模型的影响才刚刚开始从研究演示转向商业实现 [4]。人们正在谈论它们，用例在理论上开始堆积，但在实践中尚未完全落地。如果这些内容还不够您消费，也许可以去了解一下
    BERT [5]。


    ## 2020 年 6 月，我深度研究了 GPT-2


    https://github.com/nelslindahlx/NLP/blob/master/Yet_another_working_GPT2_corpus_example.ipynb


    十个月后，您仍然可以通过该链接在 Google Colab 上运行那个 GPT-2 笔记本。我刚检查过，代码仍然有效。它设置为运行 1,000 个训练步骤，这在您的
    Colab 实例上需要一些时间。如果您想让它运行得更快，可以减少训练步数，但这可能会使输出变得更“狂野”。仅在我的写作语料库上稍作训练，它就会吐出与我极有可能产出的内容相似的东西。它肯定在仅仅几轮学习中就掌握了我对写作过程抱怨的总体形式和结构。这正是该模型如此有趣的原因。


    ## 参考文献


    [1] Here is a Medium post that I enjoyed on the subject: https://medium.com/quick-code/understanding-few-shot-learning-in-machine-learning-bede251a0f67


    [2] https://github.com/openai/gpt-2 or https://openai.com/blog/better-language-models/


    [3] https://dailynous.com/2020/07/30/philosophers-gpt-3/#chalmers


    [4] https://openai.com/blog/better-language-models/ or read the full technical
    paper here https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf


    [5] https://towardsdatascience.com/bert-explained-state-of-the-art-language-model-for-nlp-f8b21a9b6270


