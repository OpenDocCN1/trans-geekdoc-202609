    [1] 存在许多基于人工智能和机器学习的投资推荐示例，但我认为提供一个来自 Yahoo! 的例子会很有趣：https://www.yahoo.com/now/10-best-machine-learning-stocks-164924452.html


    [2] https://growthlist.co/blog/ai-vc


    [3] 你将能在 The Lindahl Letter 第 55 周阅读关于“Who is acquiring machine learning patents?”的内容。


    [4] https://www.forbes.com/sites/cognitiveworld/2020/01/05/is-venture-capital-investment-for-ai-companies-getting-out-of-control/


