    \ 978-1-716-01740-7\n\nImprint: Lulu.com\n\nDedication\n\nTo those who look at\
    \ what could be and thread the needle to get there…\n\nAcknowledgments\n\nThanks\
    \ to all of my first-year Substack post readers who helped inspire this effort.\
    \ It was great to get feedback along the way while writing a book. I’m thinking\
    \ next year this method will be a great way to do the same thing again to produce\
    \ a manuscript for 2022.\n\n# \n\nTable of Contents\n\nDedication\n\nAcknowledgments\n\
    \nPreface\n\nSubstack Week 1: Machine learning return on investment\n\nSubstack\
    \ Week 2: Machine learning frameworks & pipelines\n\nSubstack Week 3: Machine\
