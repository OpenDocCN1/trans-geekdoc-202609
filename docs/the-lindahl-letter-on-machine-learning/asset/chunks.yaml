  trans: '


    # 构建模型


    当然，你也可以购买模型 [5]。这里有步骤帮助你构建模型。如果没有利用整套装置的模型，机器学习流水线的所有设置步骤都显得相当学术。根据你的用例，将机器学习引入相关工作流的一种方法是直接集成
    API，以避免设置框架和流水线。这是一种可行的途径，对于某些场景非常合理。对于其他机器学习工作，复杂性会使得使用开箱即用且具有可调用 API 的解决方案变得不可行。你会惊讶于如今提供了多少复杂的
    API，但它们并不能为所有用例提供全面的覆盖 [6]。


    ## 模型服务与 ROI


    你打算拿这些模型怎么办？你需要保存它们以供服务。建立可靠的框架和机器学习流水线，关键在于在满足具有明确且可预测 ROI 模型的用例的工作流中提供这些模型服务。


    从实施的那一刻起，你将与时间赛跑，以弄清楚市场上的那些模型何时会遭遇效率下降并需要某种调整。你必须了解潜在的模型退化，并计算在 ROI 条件被违反时必须在何时终止工作
    [7]。这听起来可能有点难，但如果你的模型效率下降到对财务结果产生负面影响的地步，你就会想知道如何关闭开关，并且可能会纳闷为什么那个开关没有自动化。


    在此过程中，需要对模型或参数进行某种调整。回顾一下，我看待 ROI 的方式相当直接。你必须从投入了什么以及可能获得什么的角度来考虑机器学习模型的价值。这只会给你一个积极或消极的视角，来判断该
    ROI 是否对你有利。那时你只是在遵循你的策略并思考 ROI 模型。


    所以再次强调，严格的 ROI 建模可能不是你想要使用的方法。我建议不要在不了解财务后果的情况下长时间工作。在大规模应用时，你可能会非常快地在机器学习用例中造成故障和其他问题。甚至可能发展到你发现这对你的业务案例不再值得的地步。将机器学习插入工作流可能并不是正确的做法，这就是为什么计算结果并做出基于事实的决策如此重要。


    实际上，只要你以一种可规划、可定义且可重复的方式去做，效果都会很好。考虑到基于事实的决策制定以及在必要时愿意“按下关闭开关”将有助于防止失控问题演变成对业务的生存威胁，这一点说起来相当容易。因此，拥有机器学习策略、以可定义和可重复的方式做事、以及无情地基于事实行事，就是我的建议。


    ## 技术选择


    显然，你应该对我所说的一切持保留态度；你应该提前知道我是 **TensorFlow** 的忠实拥护者。这也是我将其作为主要示例的原因之一，但这并不意味着它就是你的绝对正确答案。它只是我最频繁关注、且在转向其他解决方案前首选的答案。这始终基于用例，我坚决避免让技术去寻找问题。你需要让用例和手头的问题来适配解决方案，而不是不断尝试应用解决方案直到有一个奏效或你放弃为止。


    ## 管理模型


    故事发展到此，你正在思考或开始构建这一切，并且开始进入状态。兴奋感可能正积聚成某种高潮。现在你需要一个地方来管理你的模型。你可能需要想象一下你已经拥有模型了。也许你从市场上买来了它们，完全跳过了训练环节。这是一个激动人心的时刻，你已准备好启程。所以在本例中，你将从刚刚构建（或最近获得）一个机器学习模型，转向实际做点什么。在那一刻，你可能意识到需要反复提供该模型服务，以创建真正的机器学习驱动工作负载。这不仅意味着你要管理那些模型，还可能意味着你需要随着时间的推移提供不同模型的服务。


    当你进行调整和修正、引入不同的建模技术时，你的实现会变得更高级。你会发现的一点是，即使是你拥有的那个完美模型——在发布时完全符合你的预期——也在慢慢等待着背叛你和你对它的信心，通过退化来实现。你必须准备好根据用例对性能进行建模和评估。这才能让你对模型质量和结果影响做出高质量的决策。


    ## 关键要点


    我有几个要点来结束本期《林达尔通讯》。你必须记住，此时机器学习模型和流水线几乎已经**民主化**了。你可以获取它们。它们已在外面“野蛮生长”。人们以各种不同的方式在使用它们。你可以直接将这项技术引入你的组织，几乎没有任何摩擦。


    ---


    # Substack 第 3 周：机器学习团队


    发布于 2021 年 2 月 12 日


    ## 学习与团队建设


    学习。持续学习。做一个终身学习者是个可靠的计划。我诚心认为我们生活在机器学习培训和人才的**黄金时代**。人们在 GitHub 上无私地分享世界级的培训材料和代码。共享的学术论文数量正在飙升
    [1]。对于那些能够在过程中逐步融入一点专业知识的人来说，你可以从零开始建立团队。这始于帮助人们投资于理解这种机器学习知识。这为他们奠定了基础，以便他们能够使用类似
    TensorFlow Extended 示例 [2] 这样的工具构建你所需的机器学习流水线。这是帮助他们理解这些流水线如何用于构建和部署的一种方式。我认为所有能够做到这一点的培训都令人惊叹地在线上触手可及；人们在分享这类知识方面表现得极其慷慨。


    ## 脚注


    [1] 所引用机器学习流水线的链接：`https://www.tensorflow.org/tfx`、`https://aws.amazon.com/sagemaker/pipelines/`
    或 `https://docs.microsoft.com/en-us/azure/machine-learning/concept-ml-pipelines`


    [2] 了解机器学习社区的最佳起点之一：`https://www.kaggle.com/`


    [3] 如果你有几分钟时间，请阅读此文，值得一读：`https://hbr.org/2020/09/how-to-win-with-machine-learning`


    [4] `https://github.com/tensorflow/tfx`


    [5] 这是较大的市场之一：`https://aws.amazon.com/marketplace/solutions/machine-learning`


    [6] 这是目前开放业务的服务示例之一：`https://cloud.google.com/products/ai`


    [7] 这是一个很棒的网站，文章切中肯綮：`https://towardsdatascience.com/model-drift-in-machine-learning-models-8f7e7413b563`


    '
