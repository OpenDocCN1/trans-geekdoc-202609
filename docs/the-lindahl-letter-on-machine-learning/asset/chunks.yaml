    # Substack 第 4 周：拥有机器学习策略……重访


    发布于 2021 年 2 月 19 日


    欢迎阅读这个持续进行的 Substack 系列的第四篇文章。在这篇文章中，我将回顾并重访两个非常重要的机器学习问题。首先，我将回顾我对“究竟什么是机器学习策略？”这个问题的回答。其次，这将奠定基础，让我们真正深入回答“你到底需不需要机器学习策略？”显然，答案是肯定的，毫无疑问。


    ## 1. 究竟什么是机器学习策略？


    当你坐下来开始将预算条目与机器学习策略关联起来时，会非常清楚地发现必须做出一些决策 [1]。这就是你会发现机器学习策略必须清晰定义，并基于具有可靠 ROI
    的用例。否则，直接关联回那些预算条目的 KPI 将会显示出绩效问题。有计划地行事有助于确保事情朝着正确的方向发展。


    在过去几周里，这个 Substack 系列《The Lindahl Letter》深入探讨了包括机器学习人才、机器学习流水线、机器学习框架以及 ROI 建模在内的各种主题。现在（就是现在）是深入研究你的机器学习策略的时候了。别光读关于它的文章，直接开始着手弄清楚怎么做。老实说，我之所以推迟这篇文章，是因为我们需要一些基础铺垫，以便在概念上环绕这个想法，并试一试你的策略实际上可能是什么样子。无论你在组织中的位置如何，从底层到高层，你都可以开始构思和可视化机器学习策略可能实现的目标。也许可以从简单的事情开始，比如在一张纸中间的一个气泡里写下策略声明，然后向外发散展开你的策略。这有助于你专注于基于有计划决策过程的数据驱动机器学习策略
    [2]。


    你的机器学习策略的一部分必须关注意图、复制和复用。这是为组织挖掘价值的核心。可定义且可重复的结果是可预测机器学习项目的基础。机器学习通常作为可定义且可重复过程的一部分应用于生产系统。这就是你获得质量和速度的方式。你必须设置护栏，将事物限制在该模型可能的范围内。除此之外，你必须明确使用机器学习为组织做某事的目的。策略声明可以简单到“找出五个可以以可定义且可重复的方式应用大规模机器学习技术的用例”。


    也许你的策略始于一项投资于开发机器学习能力的预算条目。每年投资培训都很直观。现在你将其中一部分标记为机器学习。从这个角度看，你可能走在一条纯粹为了员工敬业度的道路上，因为团队真的很想做点酷的事，想利用新技术。你可能会发现团队真的很想做，而你可以成全他们。当然，他们可能会找到一种新颖的方式，利用这种精力和投入产出与组织总体指导目标一致的成果。其中一些是创新可能驱动未来战略的地方，但最好让你的战略驱动组织中创新发生的基础。关于战略的无数资源存在，其中一些以在线课程的形式高度聚焦
    [3]。


    从预算条目到真正落地运行，你必须基于潜在 ROI 以统一的方式应用你的机器学习策略。做完这步后，你就会知道你是出于正确的理由选择了正确的路径。然后你可以开始考虑跨尽可能多的应用复制结果和流程。迁移学习无论是在模型还是部署层面，都对此大有裨益。你会意识到，一旦你弄清楚了如何以质量和速度去做，将其应用到一系列事物上就能更快发生。这就是你的团队凝聚在一起并能够交付成果的力量。


    ## 2. 你到底需不需要机器学习策略？


    跳出随机森林中的树木来审视策略，需要一点视角。有时更容易锁定焦点在特定项目上，而忘记该项目如何融入更广泛的战略。拥有一个自上而下应用的有针对性的机器学习策略，有助于确保正确的高管赞助和资源专注于获取结果。与其运行一堆独立的自我孵化工作，不如拥有一个可定义且可重复的流程来推广，并帮助确保相同的方法能以具有成本效益的方式在组织中复制。话虽这么说……当然你需要机器学习策略。


    ---


    ### 脚注


    [1] 这里很好地展示了机器学习论文。该领域的出版量正呈指数级扩张。https://www.technologyreview.com/2019/01/25/1436/we-analyzed-16625-papers-to-figure-out-where-ai-is-headed-next/


    [2] https://github.com/tensorflow/tfx/tree/master/tfx/examples/chicago_taxi_pipeline


    [3] 查看 https://www.coursera.org/browse/data-science/machine-learning 和 https://www.qwiklabs.com/focuses/3391?parent=catalog


    [4] 我最喜欢关注的两个人，@DynamicWebPaige 和 @lak_gcp：https://twitter.com/DynamicWebPaige
    和 https://twitter.com/lak_gcp


    [5] 我正在每天努力了解更多关于这家公司的信息：https://databricks.com/

    '
