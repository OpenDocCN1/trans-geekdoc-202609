    Substack Week 43: Practical machine learning


    Published on November 19, 2021


    Over the years I have taken a ton of Coursera courses related to machine learning
    \[ 1 \]. It’s amazing how advanced the labs and experiences have become; you can
    spin up a real environment in the cloud, where you can actually do things with
    machine learning and curated data sets. That is one of the ways that practical
    machine learning has thrived over the last five years \[2\]. The John Hopkins
    University course on practical machine learning has had 141,649 people enrolled
    at the time this sentence was typed. Learning about machine learning and jumping
    into practical use cases eventually will represent the smallest use case for practical
    machine learning. Over time, the most prolific use case will be where machine
    learning is built into the products people are using. The developers over at Google
    have released a formula-suggestion feature into the Google Sheets product \[3\].
    Microsoft developers have been working to build machine learning into the products
    related to Office for years. Some of them extend Microsoft Excel using machine
    learning \[ 4 \]. You can take a look at the videos Yannic Kilcher releases or
    the counts of people taking popular machine learning courses. You will quickly
    realize that an audience of around 10,000 people shows up to a lot of machine
    learning content. The number of researchers submitting papers to conferences and
    the audience of people who deeply care about machine learning are much smaller
    than the number of machine learning jobs that are open on LinkedIn right now,
    which stands at around 153,481 results for machine learning in the United States
    \[ 5 \].


    Outside of direct expertise within the field of machine learning, users of products
    like Google Sheets or Microsoft Excel are seeing augmented experiences thanks
    to practical machine learning being applied to real-world scenarios. At the point
    where machine learning is being actively distributed to the world of spreadsheets,
    the incidence of applied machine learning rises exponentially by well over an
    order of magnitude. As of June 2021, the number of companies in the United States
    using Office 365 was over 700,000 \[ 6 \]. A lot of people use Microsoft Excel
    for all sorts of things. That really does change the dynamics for applied machine
    learning in the workplace and for people in general. Use cases that are the result
    of machine learning projects in companies building it into products are going
    to have a far greater reach than anything based on some of these major industry-driving
    business tools. Between these two use cases that I’m considering—people doing
    machine learning and people benefiting from practical machine learning being in
    products—this really is a golden age for machine learning. 


    Spending some time thinking about practical machine learning has made me wonder
    what is next for machine learning within the space. I’m curious about what new
    and interesting things people will do with applied machine learning. More and
    more products are going to have it built into their core functions. 


