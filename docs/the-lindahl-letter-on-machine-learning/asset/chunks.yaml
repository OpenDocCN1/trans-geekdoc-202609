    Substack Week 39: Machine learning security


    Published on October 22, 2021


    The folks over at NVIDIA released a new language model that is very large: “Using
    DeepSpeed and Megatron to Train Megatron-Turing NLG 530B, the World’s Largest
    and Most Powerful Generative Language Model” \[ 1 \]. At 530 billion parameters,
    that is a very large generative language model indeed. All of these model releases
    and the sharing of code that go on within the machine learning space on GitHub
    and via other means create a situation where both the shared security in the space
    and the security of each individual project are important.


    A lot more articles over in Google Scholar showed up for “machine learning security”
    than I expected to see this week \[ 2 \]. Some of that content veers off into
    privacy-related items and some very specific use cases on the security-related
    applications of machine learning. Thanks in part to the islands of content on
    this one, it is probably best to try to consider both the machine learning use
    cases related to security and the very real and growing questions around the security
    of actual machine learning implementations, code, and shared projects. A lot of
    the practical open-source MLOps projects that I track on GitHub are scanned all
    over the place, and people put in pull requests and communicate out potential
    problems. Every once in a while, you might even get to read about a temporary
    private fork of one of those MLOps projects, where somebody is working very hard
    to patch some block of code to the point it passes scanning and other security
    measures \[ 3 \]. That is one way to work something to resolution, but it is an
    interesting exercise as it is not part of driving the product features but is
    critical to being able to use the product in enterprise settings. 


    Machine learning implementations are fully capable of detecting statistical anomalies.
    One of the use cases that people seem to like relates to cyber security intrusion
    detection \[ 4 \]. A lot of security is about seeing things within the normal
    pattern of usage that flag as abnormal. That is one of the reasons why monitoring
    and traffic analysis is such a big part of security. Machine learning can play
    a vital part in that type of work. To that end, I spent some time reading an article
    from the Cisco team about security applications that utilize machine learning
    in practice \[ 5\]. It was a decent read about how machine learning can augment
    security use cases, but I was trying to dig more into the nature of how security
    is worked within the actual machine learning instances. Software in the AIOps
    and MLOps spaces exists and is rapidly changing every day; you can see the updates
    on GitHub. The security of those applications is where my attention was during
    all of my searching. You can see the security pushes and pulls within the GitHub
    repositories of the MLOps software I watch on a regular basis. My plan is to circle
    back with an analysis of those patterns to see if I can isolate security-related
    items.


    Footnotes:


    \[1\] https://developer.nvidia.com/blog/using-deepspeed-and-megatron-to-train-megatron-turing-nlg-530b-the-worlds-largest-and-most-powerful-generative-language-model/


    \[2\] https://scholar.google.com/scholar?q=machine+learning+security&hl=en&as\_sdt=0&as\_vis=1&oi=scholart


    \[3\] https://docs.github.com/en/code-security/security-advisories/collaborating-in-a-temporary-private-fork-to-resolve-a-security-vulnerability


    \[4\] https://ieeexplore.ieee.org/abstract/document/7307098


    \[5\] https://www.cisco.com/c/en/us/products/security/machine-learning-security.html#~how-ml-works


    Substack Week 40: Applied machine learning skills


    Published on October 29, 2021


    Before we start, I’m going to acknowledge that a lot of content exists about how
    to get a job in the machine learning space. The amount of scholarship on machine
    learning practitioners is a much smaller body of work \[ 1\]. I was not satisfied
    with the dearth of academic content on the subject, so I had to sit back and think
    deeply about it. An opportunity for somebody exists in the academic community
    to survey and study machine learning practitioners in detail. Maybe a book like
    The Innovators by Walter Isaacson (2015) could manifest from that effort.


    Right now I’m looking at version 4 of a presentation titled “What Is ML Scale?”
    that I last updated on July 16, 2021 \[ 2 \]. None of that content specifically
    deals with applied machine learning skills. Generally, that content and all the
    ideas covered are adjacent to that consideration. That realization shocked me
    into two different sets of questions that might be pertinent to the topic at hand
    today—applied machine learning skills. To be a full stack machine learning (engineer)
    practitioner, a person has to be able to handle two distinct sets of skills in
    tandem \[ 3 \]. First, they would need to be able to manage models for machine
    learning and everything that goes into that set of skills. Second, they need to
    have the skills to operationalize machine learning. Both of those things were
    shared in a matter of words, and they could in some ways be labeled and dissected
    as MLOps and AIOps mixed with some deep data analytics and curation in some cases.
    I’ll dive more into that in the next paragraphs.


    Models abound these days, and we have repositories of open-source ones all over
    the place, APIs that you can consume, and home-grown solutions increasing every
    day. We may have reached the point where machine learning models are generally
    ubiquitous and the degree of absolutely new or novel ones is shrinking daily.
    It takes a certain set of skills to work with the data necessary to do model training
    and understand the elements under consideration to make a finalized end product
    ready to go to production. Getting a model production ready requires a lot of
    planning and execution. That is one reason that people have been buying pre-trained
    models and using APIs to skip that step. It’s entirely possible that the data
    in question and use case might be so specialized that building is the only path
    forward. A lot of use cases don’t require that, especially ones in the image/vision
    space of machine learning. '
