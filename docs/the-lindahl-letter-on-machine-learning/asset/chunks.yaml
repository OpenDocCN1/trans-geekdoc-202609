    # Substack 第 48 周：重温机器学习应用


    发布于 2021 年 12 月 24 日


    我们大概可以用两种不同的方式来重温机器学习应用。首先，我们可以采用非常学术的方法进行分析，仅查看 Neurips 文集可视化 [1] 即可。这种可视化能准确展示人们在机器学习领域正在研究什么，你可以由此推断当前和未来的机器学习应用将走向何方。从纯智力角度来看，这种方法可能更有趣，因为能看到一些你可能未曾考虑过的主题论文聚类。若想寻找新颖事物，这就是方向。其次，你可以直接采用应用机器学习的方法，列出当前的应用清单。这种方法更直接，而且你可能已经知道，这是我持续研究中自然会做的事情。


    在我的 AIOps/MLOps 研究过程中，我一直在更新一张对比规模与成熟度的通用机器学习用例图表。基于工作簿中的最后更新标签，该图表上一次重大更新发生在
    2021 年 7 月 16 日（请再次参阅图 2）。目前，重温此处的机器学习应用似乎是个好主意，以便了解有什么变化或出现了什么新事物。通常当人们向我推销不同的机器学习技术时，我会阅读相关论文，或在每周观看的
    YouTube 视频中看到提及。我只需将它们添加到我的通用用例清单中。该清单现已包含 29 个用例。有时有人看完这张图表后，会问我一些似乎显而易见却遗漏了的内容，这些通常会迅速被添加到清单中。


