    # Substack 第 9 周：基于规模评估机器学习用例价值


    发布于 2021 年 3 月 26 日


    本周我们将直接切入主题：基于规模评估机器学习用例价值。你会发现，在增加价值方面，规模几乎是一切。能够快速扩展机器学习解决方案以在工作流中提供价值，通常是收益开始加速的地方
    [1]。极少有案例显示仅靠少量交互就能带来大部分价值。那些可能是机器学习尚未准备好处理你业务中如此关键部分的用例。有时将机器学习应用于某个用例并非通往成功的可行路径
    [2]。你必须评估并投资于具有高潜在 ROI 的机器学习用例。从工作中获得的价值将直接与 ROI 对齐。


    ## 从概念上讲，我一直将机器学习用例的类别细分为三大类


    从概念上讲，我一直将机器学习用例的类别细分为三大类：


    - **“可调用的事物”**，如外部 API 服务

    - **“可驻留的场所”**，或你可在其中构建版图的生态系统，如 `AWS`、`GCP`、`Azure`，以及许多其他为机器学习运营（`MLOps`）交付而涌现的平台

    - **“自行构建的事物”**，如开源和自研工具解决方案


    这种分类有助于我思考用例相关的事情将发生在何处。这是一个战术层面而非战略层面的问题。这三大类将在本系列后续文章中获得更多覆盖 [3]。就 API 服务而言，你可以非常快速地扩展。你现在就可以出去，在
    `AWS`、`Azure` 或 `GCP` 上获取多种 API 机器学习解决方案的访问权限，几乎没有任何真正的障碍。进入这种外部技术驱动用例的摩擦水平相对较低。说真的，这些解决方案确实是低摩擦选项，后端拥有高度可扩展的基础设施。人们现在到处都在使用它们
    [4]。


    ### 脚注


    [1] https://www.youtube.com/watch?v=5dAZTvbmZZ4


    [2] 请看这篇来自 Forbes 的趣味小文：https://www.forbes.com/sites/forbesinsights/2020/05/08/realizing-the-growth-potential-of-ai/?sh=1f25069033f3


    [3] https://www.marketsandmarkets.com/Market-Reports/machine-learning-market-263397704.html


    [4] https://www.marktechpost.com/2021/02/28/google-ai-introduces-model-search-an-open-source-platform-for-finding-optimal-machine-learning-ml-models/
    可在 GitHub 上查看 https://github.com/google/model_search


