    # AI、机器学习与异常检测：Substack 周刊精选


    ## 提示工程：大语言模型时代的新技能


    在今年感恩节从丹佛返回堪萨斯城的漫长车程中，全家一起收听了亨利·基辛格、埃里克·施密特和丹尼尔·胡特洛彻合著的有声书《AI 时代与人类未来》（2021）。除了一章中异常冗长的哲学史旁述（追溯至柏拉图，读到时你自然会知晓），本书整体阅读体验良好，并提供了人工智能现状的扎实案例。作者在书中写作时点上，迅速指出了
    AI 的局限性。


    现代机器学习领域的一个现实是：提示工程及懂行的人才显得至关重要。这仅仅是一种花哨的“诱导证人”手段？很有可能。如今每月如雨后春笋般发布的大语言模型，交互方式几乎全赖提示工程
    [1]。前几天我研究 Megatron-Turing 大语言模型，思考模型规模还能扩大多少，才会耗尽其所建模的语言空间 [2]。这让我想起博尔赫斯的“地图寓言”在现代的翻版：穷尽映射万物，似乎就是要为现代性造一面镜子。拥有
    5300 亿参数，它是一个超大规模生成式语言模型。这些模型极具吸引力。你可能还记得斯坦福众多教授联名的论文《基础模型的机遇与风险》[3]。以上铺垫只为说明：此类模型将长期存在，并催生了一项名为“提示工程”的专门技能。


    要从事提示工程，人们面临的挑战是如何获得预期输出 [4]。你通过给模型提供提示，或编写预定义提示包，让模型产出结果。在用 GPT-2 模型自建机器人时，我很快发现：即使拥有数百万字的个人语料，也需要恰当类型的提示，才能让模型输出符合我文风的内容
    [5]。这正是提示工程在超大语言模型中如此迷人的原因。人们投入巨大精力编译、训练、封装这些生成式模型（基础模型），结果却需要一套专门技能才能驾驭它们——这是一个颇有意味的局面。


    ### 参考资料


    [1] https://blog.andrewcantino.com/blog/2021/04/21/prompt-engineering-tips-and-tricks/


    [2] https://developer.nvidia.com/blog/using-deepspeed-and-megatron-to-train-megatron-turing-nlg-530b-the-worlds-largest-and-most-powerful-generative-language-model/


    [3] https://fsi.stanford.edu/publication/opportunities-and-risks-foundation-models


    [4] http://ai.stanford.edu/blog/in-context-learning/


    [5] https://github.com/nelslindahlx/NLP/blob/master/Yet_another_working_GPT2_corpus_example_with_checkpoint.ipynb


    ---


    ## Substack 第 46 周：机器学习与深度学习


    *发布于 2021 年 12 月 10 日*


    IBM 的朋友们乐于解答：通用人工智能、人工智能、深度学习、机器学习之间的区别 [1]。写这篇文章的早晨，我正听布鲁斯·斯普林斯汀的《Darkness on
    the Edge of Town》。当你评估上述技术的各个层面时，数字鸿沟、伦理、平等等问题便会浮现。本文侧重功能性阐释，暂不展开功能性背后的潜在后果——留待未来专文探访
    [2]。可以确信，Timnit Gebru（前 Google 员工）正在新智库“分布式人工智能研究院”（DAIR）全力攻克此类议题 [3]。引言难免偏向哲学，因为技术与应用两端都蕴含高度复杂性；双重关切必须并重——能做不等于该做。这句话对读者显而易见，但放入缺乏你天然伦理参照框架的模型中，却无法同等解析。


    你或许已点开 IBM 博客链接，了解到通用人工智能是备受期待的未来状态：一个 AI 实例能像人一样应对多种场景。目前绝大多数 AI 工作针对特定问题与用例，属于特例而非一般情况。机器学习与深度学习均聚焦于完成特定任务或学习特定内容集。IBM
    会详细解释：深度学习是机器学习的子集 [4]。这虽易断言，却未必充分彰显深度学习作为一种真正有趣发现方法的价值。你可以基于算法路径做大量机器学习，直到遇到这样一个问题：海量图像需要送入多层神经网络深度学习特征与要素。一旦转向深度学习，便在机器学习空间解锁了至少极具吸引力的新能力。


    ### 参考资料


    [1] https://www.ibm.com/cloud/blog/ai-vs-machine-learning-vs-deep-learning-vs-neural-networks


    [2] 目前第 64、65 周已排期，将探讨机器学习伦理与数字鸿沟问题。


    [3] https://www.washingtonpost.com/technology/2021/12/02/timnit-gebru-dair/


    [4] https://www.ibm.com/cloud/learn/deep-learning


    ---


    ## Substack 第 47 周：异常检测与机器学习


    *发布于 2021 年 12 月 17 日*


    机器学习用于异常检测的案例比比皆是，最早可追溯 20 年 [1]。本周我们从两个大方向切入。首先，对我而言关乎人类生命最有趣的异常检测案例，来自应用医学研究领域。医学影像进步使得机器学习能通过增强检测流程，或引导医生重点复查特定影像，来发现扫描件中的异常。其次，异常检测遍布安全领域。鉴于该领域数据通常具有一致性，任何异常均可通过模式匹配，辅助判定离群值是否为真正异常。医疗与安全这两大空间，已呈现出丰富多样的异常检测案例。


    ### 参考资料


    [1] （原文未给出具体链接）

    '
