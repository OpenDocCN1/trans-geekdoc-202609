    # Substack 第 26 周：机器学习即服务


    发布于 2021 年 7 月 23 日


    这是在企业讨论机器学习过程中你将开始遇到的事情之一。你很可能想看看能否获得机器学习即服务的访问权限。这是开始入手的一种方式，也可能成为你战略的一部分。其中一家将尝试向你推销机器学习即服务的组织是微软，其提供
    Azure 机器学习服务[1]。他们自豪地宣称将帮助你和你的组织“加速端到端机器学习生命周期”。这一说法听起来很有希望，获得机器学习即服务的访问权限这一想法确实很诱人。让某人帮助将交付机器学习的复杂性打包在一个易于使用的框架中，当然是加速销售的好方法。


    为了好玩，你可能想考虑出去快速在 Google 上搜索“Machine Learning as a Service”或“MLaaS”并查看结果[2]。请预先接受我的道歉，因为随后你在互联网上浏览时将会看到所有的
    MLOps 和其他机器学习广告。顺便说一句，在我的所有研究和持续了解机器学习的努力中，我极少甚至从未在实际应用中遇到过“MLaaS”这个首字母缩略词的使用。在大多数情况下，那些试图向你推销机器学习即服务的组织将是你预期的那些。你有上述的微软
    Azure 机器学习服务、IBM Watson 机器学习、GCP 和 AWS[3]。请记住，之所以看到 IBM Watson 与三大云厂商一起被提及，是因为将
    Watson 推向公众视野前沿投入了大量的推广和广告[4]。


