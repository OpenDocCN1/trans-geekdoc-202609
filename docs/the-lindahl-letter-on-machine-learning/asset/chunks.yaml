    # The hard part is pairing that knowledge with deep machine learning skills


    That means you are going to need to start finding the subject-matter expert knowledge
    within your organization. When you start really pairing people that know what
    you’re doing at a super granular, deep level to be able to work with models and
    do deployments, things will take off. It will probably end up being a team effort.
    You have deep knowledge from subject-matter experts and machine learning experts.
    The combination of two groups in a team is how things get done in practice. You
    may want to bring in someone who is a real expert on building different layers
    and networks; being able to really build refined models, they may augment your
    team and speed things up. Sometimes you have to bring in the right folks to jumpstart
    things along the way.


    ## 1. Where does the talent come from?


    Personally, I believe you can build the talent from within your organization.
    If you doubted that assertion, then make a mental note to really challenge that
    bias against internal growth and development. Throughout my career, I have a proven
    track record of helping grow internal talent. It works, but it requires investing
    time and having the right programs aligned to building toolkits. One of my proudest
    professional accomplishments is seeing somebody get promoted. It is an amazing
    thing to see people start bringing advanced methods and techniques to different
    parts of the organization. You can capture that feeling as well. You just need
    to go out and start building out the toolkits of the people that you have. Really
    take the time to invest in them growing and developing as teammates and as individual
    contributors.


    We are in the golden age of learning about machine learning [3]. More training
    than you can possibly consume now exists online. It exists in a variety of different
    forms. Among my favorites are the online labs now available online. The one I
    have used the most is called `Coursera`. People have built out well-tooled examples
    of how to do machine learning. Not only can you read about it, but you can get
    into examples and kick the tires. That is the thing that has drawn me to `TensorFlow`
    since the product launched. So many people have been so generous with their knowledge,
    skills, and abilities [4]. They are sharing the keys to the machine learning kingdom
    online in accessible classes, lectures, and even a few certificates. I have taken
    over 50 courses. You can see them on my `LinkedIn` profile if you really want
