    # Substack Week 21: Doing machine learning work


    Published on June 18, 2021


    Maybe it is time to get a little dangerous and start searching Google for “Why
    do machine learning projects fail?” I’m sure that is going to cause all sorts
    of odd advertisements to come my way here in the next few days. You will no doubt
    get pushed toward a study from Gartner on the subject [1]. Perhaps the detail
    you should try to focus on from that one is that the press release came out in
    2018. The reason people are still focused on it after three years is this one
    quote: “Gartner predicts that through 2022, 85 percent of AI projects will deliver
    erroneous outcomes due to bias in data, algorithms or the teams responsible for
    managing them.” Maybe for rather obvious reasons, that one metric has remained
    in the forefront of people’s thoughts on machine learning projects [2]. Over the
    years, in my opinion, two divergent trends have been occurring. First, the practice
    where organizations stand up large machine learning divisions is evaporating.
    Second, the number of outside practices has grown rapidly. You can see this in
    the number of startups working in the machine learning space and the number of
    major organizations that are offering teams of consultants to help.


    I’m still sitting here reading articles about why machine learning projects fail
    [3]. For the most part they all sort of blend together into a few common observations:
    production data are dirty, models are not dynamic, and operationalization requires
    investment for sustainment. This is one of the reasons that API-delivered machine
    learning solutions tend to outlast the rest of deployments in the wild. Major
    companies that are caring for and feeding the API models they are serving up are
    providing both the sustainment of operations and ongoing maintenance as services
    embedded in the price of the API transactions. Those efforts are for the most
    part specific to the thing you are trying to accomplish with the API call. A lot
    of machine learning use cases work out well enough that way.


    ## Footnotes


    [1] Gartner study reference


    [2] Reference for the 85% metric persistence


    [3] Articles on ML project failures

