    # Operationalizing Machine Learning


    Operationalizing your machine learning is going to involve either connecting an
    API to your workflow or having the pipelines necessary to interact with your deployed
    model at scale. A ton of different open-source MLOps tools do that, and I have
    shared my analysis on them publicly. Being able to actively use these types of
    tools at scale and in production is a skillset. It is a skillset that is markedly
    different from the model-creation and data-management skills mentioned above.
    Running and operationalizing machine learning at scale is about the day-to-day
    management of use case execution. Are the response times from the model slowing
    down production, and are the accuracy and delivery of the use case within acceptable
    tolerances, or does action need to be taken? Efficiency of even the best models
    can degrade over time in a drift against your ROI that has to be accounted for
    and managed. See Figure 3 again.


    ## Figure 3. MLOps: Scale versus maturity


