    # Substack 第 20 周：第 20 周 Lindahl Letter 回顾版


    发布于 2021 年 6 月 11 日


    撰写 Substack 这 20 周来是一项有趣的尝试。为了进行研究，我经常外出开展探索性工作，以真正了解新技术以及在实践中参与其中涉及的内容。部分工作是学习如何建立
    Substack、尝试获取订阅者并坚持发布计划。为前 30 周左右设定议程是启动这项工作的关键。对我来说，对这项活动的个人投入帮助我展示对它的掌握，并弄清楚如何从该活动中增加价值。过去
    20 周这项事业的一部分，是将混乱且不断变化的人工智能和机器学习格局，提炼成独特的趋势和单一主题的评论，使其高度易于消费。达到这种沟通和每周写作的水平，就是这项工作的意义所在。欢迎你来评判这项工作的成败。


    现在送达你收箱的恰好是《Lindahl Letter》第 20 期。前 19 周的链接列在下方。如果你错过了其中一些，或者只是想回顾从开始到现在涵盖的内容，请随意查看。我所传达的所有内容中最本质的部分，可以简单地概括为这一断言：“确保你有一个机器学习战略，并通过监控你所选择开展活动的投资回报率（ROI）来努力执行该战略。”


