    Substack Week 10: Model extensibility for few-shot GPT-2


    Published on April 2, 2021


    You have probably heard about the generative pre-trained transformer (GPT) model
    or read about it in news articles throughout the last year. It made a pretty big
    splash at launch. Let’s dig in and start with a question: “What is GPT-2 or even
    GPT-3?” Let’s get started with a few basics about what exactly few-shot learning
    entails and work toward how it relates to GPT-2 shortly after that. You might
    be aware that few-shot learning is a method to take a well-built-out and defined
    model and use just a bit of training data to get going by taking a few shots at
    achieving a favorable outcome \[1\]. Basically, you are making predictions based
    on a small amount of data. Better ways of saying that exist and have been freely
    shared online. You can probably find them with a little bit of digging, but I
    think that sets the stage to start looking at the second part of the topic at
    hand. 


    I’m very interested in both of the OpenAI GPT-2 and GPT-3 model projects \[2\].
    They are GPT models set up toward the goal of predictive language modeling. It
    is a really interesting set of technology that grabbed my attention and the attention
    of a lot of other people based on the promise and potential of what it could achieve
    in practice \[3\]. Right now the way GPT-3 is being provided, you are able to
    functionally call the model via API deployments, and it can have very interesting
    results. You just give it a prompt or a bit of text, and it is ready to spit out
    content. People worry that GPT-3 could create a nearly endless stream of content
    that could become so pervasive that it could crowd out all other related content.
    This could be the first ever denial of content attack from flooding the stream.
    It could create content that is unique so the filters and blocking methods used
    would not be able to contain it easily. 


    Machine learning deployments to a workflow that are wholesale based on calling
    either GPT-2 or GPT-3 based generative language models are probably not production
    ready at the moment. You can get some strange and interesting things coming out
    of the model and, unless that is the use case you really wanted, it is probably
    not ready to spit out Help Desk type documentation or something that could be
    instantly customer facing. That might be a very bad plan indeed based on the surprising
    results of the model from time to time. 


    You can go out to the OpenAI website and start to dig into what they are trying
    to do with language models. The implications of big language models are just now
    starting to move from research presentations to commercial implementations \[4\].
    People are talking about them, and the use cases are starting to stack up in theory,
    but not 100% in practice. If that content was not enough for you to consume, then
    maybe go and learn a little bit about BERT as well \[5\].


    June 2020, I worked on GPT-2 with a great deal of intensity:


    https://github.com/nelslindahlx/NLP/blob/master/Yet\_another\_working\_GPT2\_corpus\_example.ipynb


    Ten months later, you could still run that GPT-2 notebook on Google’s Colab from
    that link. I just checked on it, and the code still works. It is set to run with
    1,000 training steps, which will take a bit of time on your Colab instance. You
    could reduce the training steps if you wanted it to run faster, but that will
    probably make the output a bit wilder. With just a little training on my writing
    corpus, it will spit out content that is similar to what I might very well produce.
    It certainly masters the general form and structure of my whining about the process
    of writing in only a few shots of learning. That is what makes it so interesting
    as a model. 


    Footnotes:


    \[1\] Here is a Medium post that I enjoyed on the subject: https://medium.com/quick-code/understanding-few-shot-learning-in-machine-learning-bede251a0f67


    \[2\] https://github.com/openai/gpt-2 or https://openai.com/blog/better-language-models/


    \[3\] https://dailynous.com/2020/07/30/philosophers-gpt-3/#chalmers


    \[4\] https://openai.com/blog/better-language-models/ or read the full technical
    paper here https://cdn.openai.com/better-language-models/language\_models\_are\_unsupervised\_multitask\_learners.pdf


    \[5\] https://towardsdatascience.com/bert-explained-state-of-the-art-language-model-for-nlp-f8b21a9b6270


    Substack Week 11: What is machine learning scale? The where and the when of machine
    learning usage


    Published on April 9, 2021


    The topic this week is really at the heart of the presentation I have been working
    on for this year’s speaking season. You either found that compelling or you did
    not, but you should take it for what it is worth that I’m really interested in
    understanding this topic in depth. It was one that I invested my time in and felt
    was worth sharing with others during a formal talk. 


    When you sit down to think about machine learning, a lot of hype jumps out, and
    a little bit of truth is hiding somewhere in the middle of that. Some workflow
    is going to exist where a business-driven use case occurs. Within that workflow,
    some type of definable and repeatable task would benefit from machine learning
    to drive some inflection point. Maybe it is a straightforward recommendation engine,
    or maybe you need to figure out what is in a photograph or a block of text to
    trigger some type of action. Doing that one time or a couple times might be a
    fun little proof of concept to set up and execute. Working out the details to
    do it every time over and over again across hundreds of thousands or millions
    of executions is a different story altogether. 


    Executing a machine learning model at scale either by calling an API or serving
    the model up is going to reveal edge cases and unintended consequences. That is
    going to happen. Something that you thought had a really solid fit and was going
    to execute with a high degree of accuracy will face the challenges of the real
    world, and problems will ensure. You have to be ready for those by having a planful
    method of keeping things within pre-planned tolerances. That is how you ensure
    your ROI path works versus having one good performance problem breaking down your
    entire financial use case. People are really starting to talk about the importance
    of scaling in real-world machine learning examples \[1\].'
