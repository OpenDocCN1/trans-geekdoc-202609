- raw: 'Be careful searching for machine learning growth strategies in a search engine.
    That one is going to follow you around for a while. You are going to get all sorts
    of advertisements back \[2\]. During my journey down that search path, I read
    an estimate that the machine learning market is going to end up around $8.81 billion
    in 2022 \[3\]. That estimate seemed interesting enough at first glance. That might
    have been due to the context of a recent article I read about Google building
    out something called Model Search, which is essentially an open-source platform
    for finding machine learning models \[4\]. That really caught my attention. A
    ton of use cases exist, and models have been trained for a lot of them. Being
    able to get going without the cost of training a model yourself could kickstart
    your effort. I had an idea about it that I’ll share in a couple weeks. It could
    turn into a project at some point. 


    Executing a plan can be very rewarding. When that plan is tied to budget-level
    KPIs with solid ROI, the rewards are even quantifiable. You have to plan to grow
    based on successful ROI. That happens when spending is tied to budget items geared
    toward successful outcomes. Part of that is about knowing your KPIs and managing
    the process along the way, and the other part is about having the fiscal discipline
    to build ROI models and execute that strategy. Yeah, planned growth is harder
    than it sounds. You will find that building out a layered plan to get things done
    involves operationalizing your strategy vision and executing it in a planful way.
    Some of that is low-hanging fruit for the organization, and other parts are more
    complex algorithmic use cases \[5\].


    Getting a really solid list of the use cases where growth could be driving is
    a challenge worth attempting. That is more than just engaging in cost avoidance
    or reducing ongoing operational expenses; it is about finding the places where
    growth is really possible. That is a core part of understanding the business and
    ultimately should be very closely tied to how the budget is defined. A solid strategic
    plan would tie the right investments to the right places going forward. That sounds
    simple as a sentence but is difficult in practice. The places where growth was
    possible could change and shift within the year. Some efforts to move forward
    will be more successful than others. That is why you need the right KPIs to drive
    and guide evidence of progress or to shine the light on areas that need help from
    the leadership team to stay on track. 


