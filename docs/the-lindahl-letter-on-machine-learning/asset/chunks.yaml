    # Substack 第 35 周：现代机器学习中的可解释性


    发布于 2021 年 9 月 24 日


    这是一个看似显而易见、实则可能需要更深入思考的话题。从海岸到海岸的董事会，近来都在听各路供应商和顾问吹嘘机器学习这座大山里藏着金子，错失良机的恐惧不容许他们无所作为。当你真正着手在工作流和用例中开展机器学习时，随之而来的必然问题是：它究竟是如何发生的？你能预见用例将走向何方，但模型为何朝特定方向演进，这可能有点像个“黑箱”。这就是现代机器学习中的可解释性问题遭遇十字路口的原因。大量期刊文章都包含“可解释性”和“机器学习”这两个词
    [1]。说真的，学术界对此讨论得非常多。除了这海量的学术文章，像 Weights & Biases 这样的公司正致力于追踪发生了什么，并记录沿途的所有步骤
    [2]。所有这些都有助于你复现通往机器学习部署的过程，但未必能解释正在发生*什么*。它或多或少只是展示了*如何再做一遍*。


    稍微深挖一下这个话题，很多内容开始探讨**可解释性**（explainability）和**可阐释性**（interpretability）的区别 [3]。能够逐步推演并阐释正在发生的事情，与试图向他人解释机器学习模型的结果，是两种不同性质的活动。我深入阅读后，重点关注另外两个考量。首先，我总是好奇某事物如何被复现。这引出了一个问题：“模型训练的成功是偶然的，还是可以被复制并作为一个流程被理解？”其次，我试图理解数据或用例中存在哪些潜在偏见或伦理考量。这两个考量结合起来，为在流程最开始就理解机器学习建模奠定了基础。事后才花时间考虑这些事，会瓦解任何本可助你“始于终始”的潜在设计考量。以面向未来的方式构建，有助于为工作的成功奠基。在流程伊始理解正在构建什么，比试图改变已构建完成或已接近部署的架构要容易得多。


    也许你在寻找关于此话题的更多覆盖。你走运了！去看看这个精彩的视频吧，“可解释性、推理、先验与 GPT-3”，Dr. Tim Scarfe 和 Dr. Keith
    Duggar 在其中一边翻阅 Christoph Molnar 关于可阐释性的书，一边讨论可解释性、推理、先验和 GPT-3。这期视频发布于 2020 年
    9 月 16 日，但依然精彩：https://www.youtube.com/watch?v=25-kF_8etJ8


    ## 脚注


    [1] https://scholar.google.com/scholar?hl=en&as_sdt=0%2C6&as_vis=1&q=explainability+machine+learning&btnG=


    [2] https://wandb.ai/site


    [3] https://www.kdnuggets.com/2018/12/machine-learning-explainability-interpretability-ai.html


    ---


    # Substack 第 36 周：AIOps/MLOps：人工智能服务的消费与运维


    发布于 2021 年 10 月 1 日


    文末维护的未来发布清单刚刚新增了一个话题。英国（UK）刚刚发布了国家人工智能战略：“国家人工智能战略立足于英国的优势，也代表着英国人工智能发展的阶跃式变革的起点，认可了人工智能在私营和公共部门提升韧性、生产力、增长和创新的力量”
    [1]。我已经开始着手“第 56 周：国家人工智能战略比较分析”这篇 Substack 文章，将包含对美国、英国和中国人工智能战略的一些分析。所以你们有这颗智力大胆尝试的宝石可以期待了，根据发布计划大概明年才能见到。这是我未来某个时间点考虑写论文探讨的主题。我认为它值得更深入的考量。


    ## 脚注


    [1] https://www.gov.uk/government/publications/national-ai-strategy


