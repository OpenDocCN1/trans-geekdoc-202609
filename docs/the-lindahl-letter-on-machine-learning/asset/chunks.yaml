- raw: 'Some of the major players within the information technology space are trying
    to break into the MLOps space. Like anything else, picking the right tools to
    get things done is about matching the right technology and use case to achieve
    the best possible results \[1\]. A lot of reports and other building blocks of
    commentary and suggestion are digging into MLOps frameworks \[2\].


    We are really starting to see some solid maturity in the MLOps space \[3\]. The
    next stage will be either a round of purchasing, where established players buy
    up the upstart players building MLOps, or the established players will build out
    the necessary elements to move past the newer players in the enterprise-level
    market \[4\].


    Let’s dig in here and start to get into the MLOps part of the equation. So, I’ll
    tell you a pro tip real quick. If you’ve never done this, you might want to consider
    going out to GitHub and just look at GitHub slash trending: https://github.com/trending
    . Now if you’ve never done that, and you’ve never looked to see exactly what people
    were working on right now, it’s a powerful way for you to just think about what’s
    important to people working in the now. When I was writing this, the top trend
    was a project related to dogecoin ( https://github.com/dogecoin/dogecoin ), which
    is not all that surprising thanks to a tweet from Elon Musk this week:


    https://twitter.com/elonmusk/status/1382552587099062272


    So anyway, I grabbed this GitHub repository information for a few of the key open-source
    machine learning projects I’m tracking for comparison. Within Table 1, I’m going
    to dig a little bit deeper on some of the machine learning projects that I think
    are very valuable. 


    Table 1. GitHub top machine learning projects


    ![](media/file3.png)


    So, let’s look at the first one here: TensorFlow. So TensorFlow has 154,162 stars.
    People have really used it. It has 2,933 contributors, which means almost 3,000
    people are contributing to TensorFlow. From that point, to get to PyTorch, you
    can see it drops off considerably. It’s going to go from around 154,000 stars
    to just 47,000 stars. 


    And the number of contributors drops off significantly as well. Now, you’re down
    to around 1,785. Now on the PyTorch example, they do have 4,620 branches, which
    honestly I don’t know why you would want to look at that many branches. No human
    wants to manage 4,000 branches of anything. That is unmanageable in terms of iteration. 


    So I definitely understand more on the TensorFlow side of things, but that does
    not mean that scikit-learn, which has roughly 44,000 stars and 1,936 contributors,
    is not interesting. So you can see here that the three major projects out there
    for machine learning are definitely adopted. People are using them, they’re making
    forks of it, they’re making versions of it, and they’re starting to really dig
    into it out in the wild of software development right now.


    So now we take it to the next level and look a little deeper in terms of what’s
    happening with the MLOps part of it. You’re going to see a major drop-off. Remember
    TensorFlow had 154,162 stars. Now you’re starting to see the number of stars drop
    off considerably. You’re starting to see that number of stars at 10,000 or less.
    You are starting to see kubeflow, mlflow, and some of these things that you know
    are complex stuff, like metaflow from Netflix, and you’re only going to see 4,000
    stars, and each of these things has less than 500 contributors. See Table 2.


    Table 2. GitHub next tier machine learning projects


    ![](media/file4.png)


    Based on the order of magnitude difference between TensorFlow and some of these
    things, one of the direct observations from this information is that none of these
    tools for MLOps really grabbed significant market share. None has become the key
    product yet. 


    So, we haven’t seen everyone swarm in and start using these things. One of the
    reasons is on that previous chart (Figure 1 from Week 11) when we saw the different
    things for an API. You start thinking about the different ecosystems that are
    out there: the pipelines and the ecosystem for something in a bucket to where
    you can be. 


    You’re going to start using the ecosystem stuff that’s available. So if you start
    going into Bucket 2, where you’re on Azure, you’re on GCP, decisions have to be
    made. If you are on AWS, you’re going to work within the stack for machine learning
    that’s available for that ecosystem. That’s why you chose to go there. 


    I think it’s really interesting here, and you can see that none of these are branching
    out as many branches as the previous look at it. So this space here, we can take
    these items and break them out into a chart (Figure 3) that is sort of similar
    to the previous chart (Figure 1). 


    Figure 3. MLOps: Scale versus maturity


    ![](media/file5.png)


    You’re going to see that I think there’s a wide spectrum here. Now, you may not
    totally agree with how I place these things in terms of scale and maturity, and
    that’s okay. You know, feel free to let me know if you have a different opinion
    on one of these technologies. Depending on where you’re at with your machine learning
    use case, you’re going to have some very different machine learning operations.


    The major players are going to be predominant in that space. And so that’s where
    I think you’re starting to see the mix of other things after it that are really
    starting to take off, and they do have vibrant ecosystems and communities. Weights
    & Biases, for example, people are really interested in that, and it has a vibrant
    community around it. Some of these other items definitely have vibrant communities,
    and they’re building out. 


    And what I’ll be looking for here and probably in the next year or so is to see
    which ones really bubble up to being super successful for that Bucket 3 instance
    where people are building stuff out and they need MLOps tools to be able to successfully
    operationalize their strategy. Because there’s going to be so much stuff being
    done that’s not done out in an ecosystem. 


    It’s not going to be the back-of-the-envelope type stuff. It’s going to be the
    stuff that you’re doing and building within the machine learning space to do that
    next level of thing. And that next level thing isn’t going to happen from the
    APIs because it’s not going to be a pre-trained model that you’re buying to be
    able to do these things. 


    People are going to want to do things that are complex and directly tied to what
    they’re delivering from their business. Those business use cases and those very
    tailored, specific use cases for delivery in your machine learning workflow are
    going to require much more than what that API can provide. 


    Because of that and the delivery you’re going to start seeing, these MLOps companies
    and GitHub projects and things really take off. I’m looking in the next year or
    so to see exactly which ones gain the predominant market share. 


    What did we cover? 


    Well, we covered initiating what exactly is scale, right? We talked about Bucket
    1, we talked about Bucket 2, and we talked about Bucket 3, which may have lost
    meaning because those figures were covered a while ago. Bucket 1 is the APIs.
    It is the thing that you can go out and just get a hold of right now, but you
    can connect to it and start using it within your workflow.


    Bucket 2 holds those things in the ecosystems where we are going to build out
    your machine learning in that ecosystem, use their tools. And Bucket 3 is going
    to be a look at exactly what can happen for you when you’re dealing with things
    that are built on premise, when you’re using those open-source tools, when you’re
    building in your own environment. '
