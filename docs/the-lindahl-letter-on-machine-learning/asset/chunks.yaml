- raw: 'Reading articles about anomaly detection has been rewarding this week. It
    is interesting to see how people are building machine learning models, supervising
    machine learning models, and just trying out new techniques to see what will happen.
    It’s much easier to mock up and work with the security side of data. You can create
    synthetic data strea ms and work with models in ways that are not possible for
    the medical space \[2\]. I ended up reading that the U.S. Food & Drug Administration
    proposed a regulatory framework \[3\]. That made me start to wonder if that proposed
    framework had been approved. It seems like they are putting a lot of consideration
    into that April 2, 2019, discussion paper in the form of pre-market reviews \[4\].
    I’m still trying to dig in a little bit more about the approval process to understand
    what models are being approved. Overall, the consideration and approval of models
    in the security space occurs without restriction. That is very different from
    how models are used in the medical research space.


    Spending some time thinking and looking at what publicly available medical research
    datasets exist could be a topic of its own. I’m going to go ahead and add that
    to the list for future discussion.


    Footnotes:


    \[1\] http://ftp.cerias.purdue.edu/pub/papers/terran-lane/brodley-lane-nissc97\_paper.pdf


    \[2\] https://www.nature.com/articles/s41551-021-00751-8


    \[3\] https://www.fda.gov/files/medical%20devices/published/US-FDA-Artificial-Intelligence-and-Machine-Learning-Discussion-Paper.pdf


    \[4\] https://www.fda.gov/medical-devices/software-medical-device-samd/artificial-intelligence-and-machine-learning-software-medical-device


    Substack Week 48: Machine learning applications revisited


    Published on December 24, 2021


    We could approach revisiting machine learning applications in two different ways
    probably. First, we could do that analysis based on a very academic approach and
    it would be possible to just look at a Neurips Anthology visualization \[ 1 \].
    That time of visualization could show you exactly what people are working on in
    the machine learning space, and you can interpret from that where current and
    future machine learning applications are headed. From a purely intellectual perspective,
    that approach is probably going to be more interesting in terms of seeing paper
    clusters on topics you might not have considered. To find something novel, that
    is the direction to go. Second, you could simply take the applied machine learning
    approach and make a list of current applications. That method is much more straightforward,
    and you might already know it is something that I do as a natural part of my ongoing
    research.


    During the course of my AIOps/MLOps research, I have been updating a chart of
    general machine learning user cases compared by scale versus maturity. The last
    major update to that chart happened on July 16, 2021 based on the last updated
    tag in this workbook (see Figure 2 again). Right now it seems like a good idea
    to revisit those machine learning applications here to see what seems to be changing
    or what new things seem to be emerging. Typically as people try to sell me different
    machine learning technologies, I read papers about them, or they are mentioned
    in a YouTube video that I watch each week. I simply add them to my list of general
    use cases. That list is now 29 use cases long. Sometimes somebody comes back after
    seeing this graphic and asks me about something that seems to be an obvious miss,
    and those typically get added to the list posthaste.


    Product recommendations


    Image recognition


    Video recognition


    Account prioritization


    Lead prioritization


    Monitoring systems


    Speech recognition


    Marketing targeting


    Fraud detection


    Inventory management


    General forecasting


    Audio analysis


    Customer experience


    Voice assistants


    Dynamic pricing


    Deepfake detection


    Email management


    Sentiment analysis


    Time series forecasting


    Image analysis


    Geospatial analysis


    Streamline data


    Optimize operations


    General chatbots


    Targeted chatbots (service/help)


    Health check monitoring


    Anomaly detection


    Sound pattern matching


    Sales trending


