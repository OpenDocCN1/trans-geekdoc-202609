- raw: 'Expanding your search to really dig into and search for “evaluating machine
    learning return on investment” will change the results you are getting in surprising
    ways. The number of white papers, friendly guides, and marketing missives on the
    subject will drop off, and you can find a few more thoughts directed squarely
    at the subject in question. Adding the ROI part to the search helps dial in results
    that include people talking about what happens after the implementation and the
    modeling to figure out if the use case is having financially positive results
    for the organization. It really goes to answering questions about the outcomes
    of having invested in the deployment of machine learning within the organization.


    Footnote: 


    \[1\] https://www.oreilly.com/data/free/files/evaluating-machine-learning-models.pdf
    When something becomes mainstream you will see a book from O’Reilly on the subject.
    They pretty much celebrate the known within the technology world. 


    Substack Week 25: Teaching kids


    Published on July 16, 2021


    During the course of making my topic list for The Lindahl Letter , this was the
    one that I was most worried about writing. Over the course of the last few years,
    I have done a ton of machine learning and artificial intelligence training, but
    none of it was geared toward people without a strong foundation in mathematics
    and some statistics. My search started out with a few minutes of surfing the internet
    for content related to the topic at hand: “teaching kids machine learning.” The
