    # 4. Discussion


    Identifying influential genes and relevant drugs contributes to a greater understanding
    of the molecular mechanism of LP as well as of disease treatment. As a result,
    we presented a computational framework working as follows: first, we introduced
    three sparse optimization problems pertaining to SVM, named ssvm1, ssvm2, and
    ssvm3. We provide each gene expression dataset as input to our methods, solved
    using CVXR solver in R. The output of each method was a weight vector w, corresponding
    to the importance of each gene in the provided dataset. Genes associated with
    higher weights indicated the importance of these genes. We ordered and then selected
    the top 100 genes according to the top 100 weights in w. Then, we provided output
    genes via each method to Enrichr and Metascape to perform enrichment analysis.
    With Enrichr, our methods (ssvm1, ssvm2, and ssvm3) achieved the best results
    as compared to baselines methods, and the retrieved terms had a greater number
    of expressed genes in disease terms, which included LP, autoimmune diseases, dermatologic
    disorders, and skin diseases. Regarding tissue types, our methods also outperformed
    all baseline


    methods, having more expressed genes within the tissue type term (i.e., skin tissue).
    Furthermore, we identified drugs associated with genes via Enrichr. With Metascape,
    we identified important genes as well as TFs related to the skin, which have been
    reported to play a key role in the pathogenesis and treatment of LP.


    As shown in the presented results (See Tables 3–5, 6–8, and 9–11), our computational
    framework consists of two parts: machine learning and enrichment analysis. Specifically,
    machine learning identified important genes within gene expression datasets, which
    were then provided to enrichment analysis tools to retrieve terms related to drugs,
    diseases, tissues, PPI networks, and TFs related to LP. In a clinical trial setting,
    these obtained results could help doctors to identify drugs, expressed genes and
    therapeutic targets in T-cell mediated disease such as LP, which is incurable
    and for which current treatments aimed at disease management due to the unknown
    etiology. It is worth mentioning that deep learning (DL) models do not rely on
    domain experts for the feature engineering part. Therefore, it may be infeasible
    to obtain results as SVM models, relying on domain experts as in our study. This
    demonstrates a challenge arising from this study for the need to construct an
    end-to-end DL solution.


    As clinical trials involve testing already approved drugs, or new drugs, our computational
    framework enables the narrowing of the search for such drugs by providing a subset
    of effective drugs (Phatale et al., 2022); it also can narrow the search for putative
    therapeutic'
