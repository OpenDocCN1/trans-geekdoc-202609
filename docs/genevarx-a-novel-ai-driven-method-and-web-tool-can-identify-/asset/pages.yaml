    Turki Turki received a B.S. in computer science from King Abdulaziz University,
    an M.S. in computer science from NYU.POLY, and a Ph.D. in computer science from
    the New Jersey Institute of Technology. He is currently an associate professor
    with the Department of Computer Science, King Abdulaziz University, Saudi Arabia.
    His research interests include machine learning, data science and bioinformatics.
    His research has been published in journals such as Scientific Reports, IEEE Journal
    on Selected Topics in Signal Processing, Frontiers in Genetics and Computers in
    Biology and Medicine. He is an editorial board member of Sustainable Computing:
    Informatics and Systems, BMC Medical Genomics, PLoS ONE, and Computers in Biology
    and Medicine.


    Y.-h. Taguchi received a B.S. degree in physics from the Tokyo Institute of Technology
    and a Ph.D. degree in physics from the Tokyo Institute of Technology. He is currently
    a full professor with the Department of Physics, Chuo University, Japan. His works
    have been published in leading journals such as Physical Review Letters, Bioinformatics,
    and Scientific Reports. His research interests include bioinformatics, machine
    learning, and nonlinear physics. He is also an editorial board member of PLoS
    ONE, BMC Medical Genomics, Medicine (Lippincott Williams & Wilkins journal), BMC
    Research Notes, and IPSJ Transaction on Bioinformatics.'
