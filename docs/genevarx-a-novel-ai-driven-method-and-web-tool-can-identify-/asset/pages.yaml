    targets, thereby speeding up the drug discovery. It is worth noting that drugs
    associated with the genes in Tables 5, 8, and 11 could help clinicians personalize
    drug treatment. In other words, when these genes (or drug targets) are expressed,
    the corresponding drug could be a more suitable treatment choice (Keeley et al.,
    2020). This demonstrates the benefit of AI tools in clinical trials. Because LP
    is a complex disease and still has no cure, this study can help medical researchers
    unveil the molecular mechanisms contributing to the disease and thereby improving
    the personalized treatment stages through a potential linked causality (Xia et
    al., 2020). For example, retrieved enriched terms from Metascape demonstrated
    that our provided genes involved in biological pathway related to tryptophan metabolism,
    involved in B vitamins (together forming the so-called B complex). It has been
    reported that B vitamins have been prescribed and demonstrated to be more efficacious
    in the treatment of LP (Burgess, 1941). These results show that a dietary lifestyle
    change and treating nutritional deficiencies may help in the treatment of LP (Cosgarea
    et al., 2020; Li et al., 2020). To help medical researchers gain more biological
    insights about LP, we provide Metascape enrichment analysis results related to
    genes involved in biological pathways as well as other terms in Supplementary
    Metascape_Dataset1.zip, Metascape_Dataset2.zip, and Metascape_Dataset3.zip.


    In this study, we aimed to develop computational methods to identify important
    genes discriminating between healthy controls and LP patients followed by utilizing
    enrichment analysis to uncover molecular insights pertaining to the disease. As
    LP is categorized based on morphology and site of the lesion, LP may affect a
    patient in different sites with different subtypes (Muradova et al., 2022; Usatine
    and Tinitigan, 2011). In this study, published datasets included lesion sites
    for cutaneous LP (Datasets 1 and 2), genital and OLP (Dataset3). In this study,
    we reported results for cutaneous and OLP. Furthermore, reported results in terms
    of a given dataset demonstrated independent biological insights pertaining to
    a LP type. In terms of the running time and memory space, our methods (ssvm1,
    ssvm2 and ssvm3) were the slowest, having the highest user CPU time (1.09 s, 3.47
    s, and 4.05 s in Dataset1, Dataset2, and Dataset3, respectively). Moreover, our
    methods had the largest memory spaces of 141.04 MB, 401.51 MB, and 160.55 MB for
    running Dataset1, Dataset2, and Dataset3, respectively. On the other hand, for
    Dataset1, lasso was the fastest method requiring the least memory space of 7.80
    MB. For Dataset2, lasso was the fastest while t-test was the method requiring
    the least memory space of 14.43 MB. For Dataset3, limma was the fastest while
    t-test was the method requiring the least memory space. We provide running time
    and memory space of each method in Supplementary Running Time and Memory Space.'
