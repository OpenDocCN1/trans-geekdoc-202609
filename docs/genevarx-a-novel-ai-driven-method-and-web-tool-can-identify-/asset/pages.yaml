    was 100, the probability for other results coinciding with ours in the three datasets
    are ($\frac{1545}{\binom{100}{100}}$, $\frac{1916}{\binom{100}{100}}$, and $\frac{1355}{\binom{100}{100}}$,
    respectively; $\binom{n}{k}$ denotes the binomial coefficient, where n is the
    number of genes in the studied dataset and k refers to the number of genes selected
    by our method. Therefore, it is very unlikely that the results of other methods
    coincide with ours.


    # 5. Conclusion and future work


    Here, we introduce a computational framework consisting of machine learning coupled
    with enrichment analysis to identify important genes and drugs related to LP.
    The input to our framework was a gene expression dataset pertaining to healthy
    controls and LP patients; we downloaded three gene expression datasets from the
    gene expression omnibus (GSE63741, GSE193351, GSE52130). In each processed dataset,
    each sample was associated with a binary label (i.e., healthy'
