    De Lanna et al. (de Lanna et al., 2022) performed a bioinformatics analysis to
    gain further biological insights regarding the malignant transformation of OLP
    by identifying shared molecular signatures, thereby distinguishing OLP from oral
    squamous cell carcinoma (OSCC). The input datasets are publicly available from
    the GEO (GSE52130, GSE65532, and GSE41613) and were related to OLP and healthy
    controls), OSCC in advanced stages, and in stages I and II with the corresponding
    healthy controls. Analysis of co-expressed genes was performed using the Weighted
    Gene Coexpression Network Analysis (WGCNA) R package. Analysis of differentially
    expressed genes was performed on a given dataset using limma according to p <
    0.05, with Benjamini–Hochberg correction. In the three datasets, 107 DEGs were
    identified from OLP and healthy controls, 331 DEGs for early stage (i.e., I and
    II) OSCC against healthy controls, and 282 DEGs for advanced stage OSCC against
    healthy controls. Among the datasets, 35 overlapping DEGs were considered as to
    be gene signatures of OLP and OSCC. Out of 35 genes, 18 are shared between OLP
    and OSCC. Immune-related genes, such as IFI6 and IFI27, were among the 35, as
    well as keratinocyte differentiation genes such as S100A12 and S100P. Enrichment
    analysis also identified drugs, including oncogenes such as PI3, SPRR1B and others
    related to the immune system that were also dysregulated in OLP, such as CXCL13,
    and HIF1A. Co-expressed genes were also identified, elucidating the shared molecular
    mechanism of OLP and OSCC.


    Zhao et al. (Zhao et al., 2022) aimed to inspect the therapeutic effects of quercetin
    on OLP. For quercetin, 75 targets were identified using two databases, TCMSP (http://tcmspw.com)
    and UniProt (https://www.uniprot.org) Additionally, 6110 differentially expressed
    genes of OLP were considered targets. The intersection of 75 and 6110 targets
    resulted in 66 common targets, which were entered into a network-based enrichment
    analysis, which functions follows: first, a PPI network was constructed by entering
    the 66 common targets into the STRING database (https://string-db.org/cgi/input.pl).
    A topological analysis of the PPI network was then performed using the cytoHubba
    tool, identifying 12 important targets (F3, VEGFA, TNF, SELE, TP53, JUN, CCL1,
    VCAM1, PLAT, IL1B, IL6, and IFNG). Second, the common 66 targets were input into
    a Gene Ontology (GO) enrichment analysis to retrieve biological processes, cell
    components, and molecular function terms. Kyoto Encyclopedia of Genes and Genomes
    (KEGG) enrichment analysis reported pathways based on the 66 common targets. Then,
    a drug-disease-pathway-target interaction network showing the relationship of
    quercetin and OLP was visualized via Cytoscape. Outcomes were then validated using
    in-vivo experiments in which higher concentrations of quercetin were associated
    with higher apoptosis rates of T lymphocytes. Results indicated that quercetin
    interfered with T helper cells (TH1/TH2) through the protein expression levels
    of cytokines (IL-6 and IFN-γ) to modulate immune response in OLP. Other recent
    studies have relied on bioinformatics-based approaches to gain biological insights
    contributing to understanding the molecular mechanism of LP (Shao et al., 2019;
    Sun et al., 2022; Xin et al., 2021; Zouali et al., 2022). Other studies from bioinformatics
    perspective have also been presented to uncover molecular insights for LP (Deng
    et al., 2020; Du et al., 2020; Li et al., 2023; Meng et al., 2021; Rivera et al.,
    2020; Wang et al., 2021; Yao et al., 2023).


    Although current biological advances understanding of LP mainly relies on bioinformatics-based
    approaches with existing tools as well as


    biological databases of limited knowledge, computational frameworks derived with
    the help of advanced concepts in artificial intelligence (AI) are needed to unlock
    tremendous biological knowledge and to lay the foundations for AI as a driving
    force. Such an existing tool can help in reducing the search space of identifying
    therapeutic targets, drug targets, and effective drugs, helping to advance drug
    discovery and disease understanding.


    # Contributions.


    Our major contributions in this work can be summarized as follows:


    (1) To extract more biological knowledge pertaining to LP, we present a computational
    framework consisting of three new variants of support vector machines (SVM) coupled
    with enrichment analysis tools, including Enrichr and Metascape (Turki and Taguchi,
    2023; Turki and Wei, 2018) .


    (2) We downloaded three gene expression datasets pertaining to LP from the gene
    expression omnibus (GSE63741, GSE193351, and GSE52130). Then, we compared our
    framework against four baseline methods, including limma (Ritchie et al., 2015),
    significance analysis of microarrays (SAM), and t-test (Tusher et al., 2001),
    and lasso for the identification of LP skin disease related terms. Enrichment
    analysis results indicate the superiority of our methods when retrieving related
    terms to LP with more expressed genes.


    (3) Further enrichment analysis results report extensive biological insights as
    follows. In the first dataset, we identified drugs such as Alitretinoin, Vitinoin,
    and Dexamethasone. We also identified expressed genes related to Interferon alpha/beta
    signaling (e.g., IFI27 and IFITM1), and other keratin genes such as KRT17, all
    of which are related to the LP T-cell mediated disease affecting the skin. For
    the second dataset, expressed genes related to skin extracellular matrix (e.g.,
    COL6A3, COL3A1) were identified, which contribute to autoimmune skin diseases.
    Additionally, drugs (Quercetin, Vitinoin, and Retinoic acid) were identified.
    For the third dataset, three drugs (Retinoic acid, Vitinoin, and Alitretinoin)
    were reported as well as three expressed genes (PI3, LCE2A, LCE2D) related to
    the formation of the cornified envelope at the oral epithelium and skin epidermis.


    (4) To reproduce the results of this study, we made an efficient implementation
    of our methods publicly available within the GENEvaRX web server at https://aibio.shinyapps.io/GENEvaRX/.
    We provide datasets in the Supplementary Datasets folder. We also provide a GENEvaRX_Screenshots.docx
    file within the Supplementary Information to demonstrate the use of the web tool.


    # Organization.


    The rest of this paper is organized as follows. In Section 2, we provide a description
    of gene expression datasets employed in this study, followed by introduction to
    our computational framework. In Section 3, we conduct an experimental study evaluating
    and reporting the performance of our methods against existing baselines. A discussion
    is provided in Section 4. Finally, we conclude our work and point to future directions
    for research in Section 5.


    # 2. Materials and methods


    # 2.1. Gene expression profiles


    We downloaded three gene expression datasets with the following accession numbers
    from the GEO database (Barrett et al., 2012).


    # 2.1.1. GSE63741: Dataset1


    This gene expression dataset consisted of 60 samples and 1542 expression values
    (D''erme et al., 2015). Therefore, we had a 60 x 1543 matrix including a column
    vector for the sample type. The sample type distribution was unified, in which
    30 samples were designated as “Control” while the remaining samples were from
    “Lichen Planus” patients. The gene expression dataset was measured and performed
    according to the microarray platform, PIQOR (TM) Skin 2.0 Microarray, human, antisense
    (591). We refer to this dataset as Dataset1.'
