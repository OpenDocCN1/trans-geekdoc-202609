    cell-mediated autoimmune inflammatory mechanisms, therapeutic targets, and treatment
    of LP. Our methods are publicly available on the GENEvaRX web server at https://aibio.shinyapps.io/GENEvaRX/.


    Future work includes (1) adapting our computational framework to identify important
    expressed genes, therapeutics targets, and drugs in different skin diseases such
    as psoriasis, atopic dermatitis, and lupus; (2) collaborating with hospitals to
    utilize our tool in clinical trials;


    (3) identifying gene signatures from gene expression data using our methods; (4)
    comparing gene expression data generated via different high throughput technologies
    and performing an assessment from biological perspective; and (5) studying shared
    molecular mechanisms and involvement among LP variants.


