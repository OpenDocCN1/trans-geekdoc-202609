- raw: 'Initially the focus will be on the first scenario, where both players know
    exactly the current state of the game as well as all possible future states. Although
    seemingly simple, the number of possible game states makes solving these problems
    very difficult; a computer only recently (2016) was able to beat an expert player
    of the game Go. To express the number of possible game states, the same type of
    goal tree will be used for searching. Each level of the tree represents a set
    of possible system states; in this case, configurations of the game. An example
    of this tree is shown below for tic tac toe; each level represents the move of
    one player. Even with a simple game such as tic tac toe, the tree grows in width
    very quickly in order to consider all possible outcomes. 


    ![](image_rsrcU8.jpg)![](image_rsrcU9.jpg)


    Figure 5: Goal tree for tic tac toe


    The established method for solving these types of problems is known as minimax.
    This name comes from the fact that the algorithm’s goal will be to maximize the
    objective function while it is the “active” player (the player able to make a
    move), while minimizing the same objective function for turns where the other
    player is active. The objective function needs to be some quantitative evaluation
    of the current game state, usually where the best score is the highest. For tic
    tac toe, an example of this would be the number of possible winning configurations
    available to the active player minus the number of winning configurations available
    to the inactive player. With an empty board, this function will evaluate to 0
    (both players have 8 possible ways they could win). If the algorithm is the “X”
    player, they have 9 possible moves; using this objective function the scores for
    each possible move are listed in red. With only 1 “X” on the board the algorithm
    still has 8 ways to win; but by choosing the middle square the algorithm can block
    the most possibilities for its opponent.


    A simple implementation of minimax would choose the move with the highest objective
    value after 1 move (as shown in red). However, it is assumed that the opponent
    will also play to win the game; in this case, when it is the opponent’s turn,
    they will choose the move that maximizes the objective function for themselves
    (equal to minimizing it for the algorithm). Therefore, a smarter implementation
    of minimax would not only calculate all possible configurations after 1 of its
    own moves, but also calculate all possible configurations after 2 moves (1 by
    each player). This brings us to the second level of the tree, where each board
    will have 1 “X” and 1 “O”. Given all 9 possible configurations on level 1, each
    will have 8 possible configurations on level 2 (called “branches” or “children”).
    Given the move made by the algorithm on level 1, its opponent will choose the
    lowest score on level 2 (hence min then max). Therefore, an algorithmic player
    which looks 2 layers deep should choose the maximum of the level 2 minimums. In
    other words, each configuration on level 1 will receive a score that is the minimum
    of all of its children states. The algorithm should choose the maximum of these
    scores.


    This process can be repeated level by level until the algorithm evaluates every
    possible board state. From the possible outcomes of each, the algorithm can make
    the best choice for its first move. In a simple game like tic tac toe, it is possible
    for a normal computer to evaluate all possible moves in a reasonable amount of
    time. However, for more advanced games (chess or Go), this is impossible. A personal
    computer could only look a few levels deep before time ran out for it to make
    a move; similar to the search algorithm, the size of the tree grows nearly exponentially
    as new layers are added. Of course, it is possible to simply let the algorithm
    search to a given depth and then choose whatever state is best at that depth.
    In this situation, if two algorithms play each other, whichever one looks deepest
    is guaranteed to win a majority of the time.


    In order to eliminate some branch evaluations, constraints can be placed on the
    possible values each level can take. This is termed “pruning” the tree, as the
    branches that do not need to be evaluated are considered to be trimmed. It is
    possible to eliminate branches based upon upper (α alpha) and lower (β beta) limits
    for the values that each could take. This technique is named alpha-beta (or α-β)
    pruning. The elimination is done based upon at least 3 levels of a minimax tree.
    The process is described in the steps below using a simple 3 level tree:


    1)   ![](image_rsrcUA.jpg)A tree has a 0-level maximization decision block (indicated
    by an upward pointing arrow). The first branch is fully explored to level 2. Since
    level 1 is a minimization step (downward arrow), that node is assigned a value
    that is the minimum of its children. Since the level 0 block will choose the maximum
    of all level 1 values, it must be greater than or equal 3.


    2)  When exploring the next level 1 branch, the node has a lower limit of 3. If
    the node evaluates to 3 or less it will never be chosen by the top node, so its
    value will not affect the decision. Since it is a minimization step, if any level
    2 node is less than 3, the remainder of the level 2 nodes no longer need to be
    evaluated. In this case, the first level 2 node is 2, so the remaining nodes can
    be pruned (shown with an “x”) and not explored. 


    ![](image_rsrcUB.jpg)


    3)  This is continued for all level 1 branches until all have been explored or
    pruned. In some cases, no branches can be pruned if the values do not exceed the
    α or β constraints. In this case it will look similar to the sequence below.


    ![](image_rsrcUC.jpg)![](image_rsrcUD.jpg)![](image_rsrcUE.jpg)


    Figure 6: Alpha-beta pruning step by step


    Using alpha-beta pruning results in the exact same final result from the minimax
    tree, but with potentially much fewer function evaluations. The effectiveness
    of the pruning depends upon the order that nodes are evaluated, as can be seen
    in the example above. If the level 2 nodes of the last branch were evaluated in
    opposite order, 2 of them could be pruned. Typically there is little that can
    be done about the order in which nodes are visited, unless some other knowledge
    about their order is available.


    So far, the minimax tree has assumed that both players know all possible moves.
    Sometimes there is some portion of the decision that involves probability, such
    as a dice roll. It is also possible that some information about the game state,
    while deterministic, is unknown to each player (battleship). In these cases, some
    nodes of the tree can be expressed as a weighted mean of its children nodes. This
    is shown in the tree below, where the weights on each branch are specified next
    to the branch. It is important to remember that for any node, the sum of probabilities
    of all its children must equal 1. This ensures that the values of different nodes
    are comparable. In the example, there are 2 branches weighted at 0.5 each (0.5
    + 0.5 = 1). Another valid combination would be 0.85 and 0.15, or if there are
    3 branches 0.2, 0.2, and 0.6; whichever best describes the data. This type of
    node is called an expectimax node (and therefore a tree containing them is an
    expectimax tree), based upon the concept of expected value, which is the statistical
    term for a weighted mean. The other minimum and maximum nodes function the same
    as before. It is worth noting that evaluating several levels of expectimax nodes
    results in very low probabilities of reaching each bottom node. If the tree has
    many expectimax levels the advantage of α-β pruning is diminished due to 2 reasons:
    many nodes will have values very close to each other, and the randomness of the
    outcomes does not guarantee the true result will match the expected result.


    ![](image_rsrcUF.jpg)


    Figure 7: Expectimax tree example


