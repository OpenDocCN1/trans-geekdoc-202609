    In supervised learning, it is often impossible to look at the results and determine
    how well the algorithm is working. By definition, engineers use the trained algorithm
    to determine unknown data, so they do not have any known true values to compare
    against. This leaves them with no objective function for which to evaluate the
    performance of the classifier. In the kNN application, engineers needs to choose
    the k value; in order to do this they need to know if k = 1 performs better or
    worse than k = 5. To solve this problem, they should create an artificial unknown
    dataset from the known sample data. In other words, some of the labeled data is
    taken and the labels are removed. Then, they can take these unlabeled vectors,
    use the algorithm to determine the output, and compare this to the true labels.
    These will be referred to as the training data (that which is still labeled) and
    the test data (the artificial unknown data).


    Using this new dataset, it is necessary to develop an objective function to evaluate
    algorithm performance. The objective function of the entire model is typically
    a combination of its performance on each individual data point in the training
    set. In classification situations, a common evaluation function (often called
    a loss or cost function) is just a comparison between the predicted value (from
    the algorithm) and the known true class. Then, all of these comparisons are added
    and divided by the number of points in the test set. For a test set of n data
    points with Y as the known labels and Ŷ as the predicted labels, this loss function
    is expressed as:


    ![](image_rsrcUP.jpg)


    For regression problems there are different methods for computing loss, just as
    there are different distance functions for continuous variables. The simplest
    regression losses are the mean squared error (MSE) and mean absolute error (MAE),
    which are analogous to the Euclidean and Manhattan distances. The equations for
    each are shown below:


    ![](image_rsrcUR.jpg)


    Depending on the size of the known dataset and the application, about 5-30% of
    the sample points should be removed to join the test data. To select which data
    points get removed to be  part of the test data, a random selection is typically
    performed in order to avoid any human bias. Even with a random selection, it is
    possible that bias is introduced in the train-test split. To eliminate this, cross-validation
    can be implemented to generate multiple pairs of training and test sets. For example,
    cross validation can be used to divide the dataset randomly into 10 groups. Then
    the algorithm will be trained 10 times, each time treating 9 of these groups as
    the training data and the 10th as the test data. After training on all these different
    datasets any bias should be removed; in addition, the engineer has a better gauge
    for performance range of the model, since each training and test set pair will
    yield a different accuracy score.


    ## Decision Trees and Random Forests


    When discussing kNN, the labeled data was split into training and test sets; however,
    it was never really discussed what it means to train a classifier or regressor.
    From here on, the algorithm (classification or regression) will be referred to
    as a model, since it is trying to build a prediction of the real world based on
    data. In general, a model will have some parameters that can adjust how it makes
    predictions. Training the model is the process of adjusting these parameters to
    fit the training data. A kNN model is very simple, the only parameter that needed
    to be chosen was k. With this definition, training a kNN model would involve trying
    several different k values and seeing which resulted in the best (lowest) result
    from the loss function.'
