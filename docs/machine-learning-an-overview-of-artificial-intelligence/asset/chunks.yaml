    ## Search Algorithms and Goal Trees


    The simplest method to be covered is uninformed search. In this case, the algorithm
    does not know the distance to the goal; it simply tries every possible route until
    something works. If it is too large, there is little advantage over the standard
    breadth-first search. The problem with this method is that all paths that have
    been traversed must be saved while the algorithm is running. A example map is
    shown in Figure 1.


    ![](image_rsrcU1.jpg)


    Figure 1: Example of uninformed search


    Upon initialization, the graph shows the starting point `A`. The algorithm explores
    all neighbors of `A`, which are `Arad`, `Bucharest`, and `Sibiu`. These nodes
    are added to a queue. The algorithm then picks the first node from the queue,
    which is `Arad`, and explores its neighbors. The neighbors of `Arad` are `Zerind`,
    `Sibiu`, and `Ora`. Since `Sibiu` is already in the queue, `Zerind` and `Ora`
    are added. This process continues until the goal node `B` is reached.


    Breadth-first search is named after the visual representation of this technique
    according to a goal tree. If every path explored so far is defined as a state,
    then these states can be visually described according to a tree structure as shown
    in Figure 2, where the black lines are explored regions and the green are unexplored.
    Utilizing breadth-first or uniform-cost search, the tree grows in breadth very
    quickly, and the path representing each branch of the tree is saved separately.
    As the tree grows, the number of states saved in memory grows as well. The beam
    search method can be applied with breadth-first search in order to eliminate this
    problem. With beam search, only a limited number of paths at each level are saved.
    The beam width is chosen (for example, 10), then after each level of the tree
    is explored, only the 10 shortest paths so far are saved for further exploration.
    The beam width must be chosen according to the total number of possible paths;
    if it is too small then the correct path will be discarded, and the algorithm
    will not reach the goal, if it is too large then there is little advantage over
    the standard breadth-first search.


    ![](image_rsrcU2.jpg)


    Figure 2: Goal tree for uninformed search

