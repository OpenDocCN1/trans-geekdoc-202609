    it, all of the methods discussed so far have only made use of the paths already
    traveled in prioritizing which nodes to expand. If a little more information about
    the nodes is known, techniques called informed search can be utilized. These methods
    do not know the edge lengths between nodes but use some form of estimated distance
    to the goal node in order to prioritize search paths. Returning to the graph from
    Figure 1, the `GPS` coordinates of each city can be used to calculate a straight-line
    distance, and this can be used to estimate their driving distance from each other.
    In some situations, this may be a poor estimate (if there is a large lake between
    two cities that would need to be driven around), but in most cases it is a good
    estimate.


    One informed search technique is called greedy search, which simply expands the
    node with the smallest estimated distance to the goal. If the estimated distance
    is close to the true distance, this works well, but if there are large variations
    between the two it can take a long time to converge. A more intelligent method
    is called `A*` (A-star) search. Using `A*`, each unexplored node is assigned a
    score: ![](image_rsrcU3.jpg) where ![](image_rsrcU4.jpg) is the distance travelled
    so far from the start node to the node being scored, and ![](image_rsrcU5.jpg)
    is the estimated distance from the node being scored to the goal node.


    With this score, the nodes are expanded in order of lowest score. In this way,
    `A*` utilizes both the distance traveled so far as well as the estimated distance
    in order to prioritize which nodes to explore next. Although very simple, `A*`
    typically converges quickly and provides a solution very close to the optimum.
    This technique of scoring all possible choices is integral to machine learning
    methods, and similar concepts can be found in many algorithms. Since computers
    inherently rely on quantitative results, they typically need a numerical value
    in order to determine that a solution is preferred.


    A well-studied problem which involves a graph-based search is the “traveling salesman”
    problem; in this case the goal is not to find the path between two nodes but between
    multiple nodes where the nodes can be visited in any order. All of the search
    algorithms discussed so far can be used to find the paths one by one, and it is
    usually fairly straight forward to determine a route that reaches all of the required
    nodes. Once a solution is found, the goal is to determine if it is the optimal
    solution or if there exists a better route. A simple approach for this application
    is the hill-climbing algorithm. Given a solution, the hill-climber alters one
    aspect of it (for example, changing the order that two nodes are visited) then
    evaluates this new solution. If the new solution is better than the old, the old
    one is discarded; if the new solution is worse, it is discarded. This is repeated
    many times until no better solution can be obtained. The name hill-climbing is
    derived from the idea that the algorithm will only go “uphill” to improve the
    solution one step at a time. This guarantees that it will never arrive at a solution
    worse than the initial stat, but leaves it vulnerable to obtaining a local optimum.


    The concept of optimization is common in almost all machine learning techniques.
    The general flow involves an iterative process where the algorithm tries to locate
    the optimal solution based upon an objective function. The objective function
    is used to score the algorithm in order to provide a quantitative evaluation of
    the result. Depending on the application, the best result could be the maximum
    of the objective function or its minimum. Numerous techniques exist for optimization,
    and some will be discussed later in this overview; this is simply an introduction
    of the concept. Some objective functions contain only one optimum with a gradient
    along the whole function; these are named convex functions and are usually the
    easiest to optimize. A hill climbing algorithm will typically succeed in finding
    the global optimum of a convex function. In more complex problems (especially
    high dimensional objective functions), the function can contain multiple local
    minimums and local maximums, as well as flat regions with no gradient. A global
    optimum is the location of the highest or lowest value of the objective function;
    a local optimum is the location where the function is lowest or highest compared
    to nearby values, but not over the entire function domain. These complex functions
    can be very difficult to optimize, and different techniques can yield very different
    results for different functions. If a simple optimization algorithm such as the
    hill climber is used, its result depends heavily on the initial starting point.


    ![](image_rsrcU6.jpg)


    Figure 3: Local and global optimum of a simple function


    ## Game Playing


    A search algorithm works in an environment with defined rules, such as the constraint
    that movements can only be performed from one node to the next along an edge.
    For the class of algorithms considered in game-playing, there are also defined
    rules (rules of the game) but there is also an adversarial opponent attempting
    to stop the algorithm from reaching the optimum. The actions of this adversary
    depend upon how much knowledge it obtains about the goals and strategy. There
    are in general four categories of games, defined according to the amount of information
    known to all players, as well as whether the games contain a random component.


    ![](image_rsrcU7.jpg)


    Figure 4: Four game categories

