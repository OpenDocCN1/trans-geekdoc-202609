  trans: '

    最流行的提升算法被称为 `Adaboost`，它是自适应提升的简称。该概念源于这样一个想法：每个模型在某些数据点上表现良好，而在另一些数据上表现较差。因此，可以将多个“弱”分类器组合起来形成一个“强”分类器。提升的关键在于给每个弱分类器赋予一个权重
    `wt`。利用该权重，集成模型的输出公式如下：


    ![](img/image_rsrcVB.jpg)


    其中 `ht(x)` 是每个分类器的输出，总共有 `T` 个分类器。通常，会将更多的权重放在在训练数据上表现较好的分类器上。这个概念很清晰，它实际上是随机森林方程的推广版本；在随机森林中，每个决策树的权重是相等的，而在提升中这些权重是不等的。`Adaboost`
    算法用于确定这些权重 `wt`。在训练过程中，会引入另一个权重 `αi`，它仅在训练期间使用。`wt` 权重在训练期间确定验证集和测试集以及模型完成后。`αi`
    权重将用于加权训练样本，对于之前分类器表现较差的样本赋予更高的权重（更大的权重）。加权这些样本迫使下一个分类器正确地预测它们。`Adaboost` 的整体流程如下所示。


    ![](img/image_rsrcVC.jpg)


    图 19：Adaboost 整体流程


    假设分类器正在数据上进行训练，输出类别可能是 0 或 1，每个数据点具有多个维度 (`x1`, `x2`)。由于尚未确定哪些样本表现较差，初始数据权重 `αi`
    设置为相等。为了简单起见，初始权重均为 `(1/N)`，其中 `N` 是训练集中的样本数量。然后使用训练数据来训练第一个分类器 `h1(x)`，并将该分类器的预测输出
    `ŷ` 与每个训练样本的真实值进行比较，`ht(x)` 的加权误差计算如下：


    ![](img/image_rsrcVD.jpg)


    注意该误差值范围于 0 到 1 之间。对于第一个分类器，所有 `αi` 权重相等，因此它平等地对待所有样本；然而，在调整这些权重后，它们会强制分类器拟合权重更高的样本。利用该方程对高
    `αi` 权重的数据点产生更大的惩罚；由于分类器将被训练以最小化误差，它将优先拟合权重较大的数据点。利用该误差 `Et`，新训练分类器 `ht(x)` 的权重
    `wt` 计算如下：


    ![](img/image_rsrcVE.jpg)


    自然对数在 1 处取零；在二分类问题中，这等于 `Et = 0.5`；这是随机猜测分类器所预测的误差。随着误差接近 0，`wt` 将增加。同样，随着误差接近
    1，`wt` 会变得越来越负。如果分类器误差为 0 并完美预测所有样本，`wt` 将趋于无穷；在这种情况下，不需要提升，可以单独使用弱分类器。允许负的 `wt`
    权重虽然不直直觉，但对于二分类效果良好。如果单个分类器在数据集上的表现较差（误差大于 0.5），则它的反向表现会更好。在这种情况下，使用负权重将反转分类器的预测并提高整体准确率。


    在更新分类器权重 `wt` 后，必须如流程所示更新数据权重 `αi`。目标是给之前分类错误的样本赋予更高的权重，并给分类正确的样本赋予较低的权重。这是根据下面的方程执行的：


    ![](img/image_rsrcVF.jpg)


    利用这些方程，重复多次过程，直到在数据上训练出多个弱分类器，且每个器都有与其相关的权重。通常，会不断添加分类器，直到模型达到目标准确率或测试集准确率进入平台。训练完成后，可以丢弃
    `αi` 权重，因为使用集成模型只需要 `wt` 模型权重。如果向模型添加了足够的弱分类器，提升分类器最终可以完美地拟合训练数据。当然，这带来了过拟合的可能。因此，在训练期间应该像训练深度神经网络那样，监控测试集和验证集的准确率。


    ## 结论


    本概述介绍了许多不同类型的机器学习和数据分析算法，其中大多数的涵盖深度非常浅。此外，所提供的示例做了一些简化的假设，这些假设在现实世界的数据中往往并不成立。这里介绍的基础旨在为对数据科学和机器学习感兴趣的人，以及尝试解决该领域问题的人提供指南。所介绍的任何技术都可以按照描述的方法应用；然而，每个算法通常都有许多变体和改进，可以针对特定应用进行定制并获得更优的结果。

    '
