    to drop but the validation error will begin to rise. This is caused by the model
    overfitting the training data. By monitoring the validation error, the engineer
    can ensure that training ends when the validation error reaches a minimum; this
    will most likely correspond to where the test set error reaches a minimum as well.


    Figure 16: Training and Validation errors


    ## Genetic Algorithms


    Also called evolutionary algorithms, genetic algorithms are another optimization
    technique that can be applied to a wide variety of problems. The general concept
    is to start with a population of many possible solutions to a problem. Each individual
    solution in this population is scored according to some objective function. Then,
    the high scoring individuals are combined in some method to create a new population.
    The idea originates from the theory of evolution, in which the individuals most
    fit for their environment reproduce at higher rates than those less fit. Biological
    evolution takes many generations to converge to an optimal solution; similarly,
    genetic algorithms are typically slow to converge. Depending upon the implementation,
    however, they are sometimes able to escape from local optima and reach global
    optima.

    '
  trans: '

    从较大网络的图中可以看出，输入的每个属性都会被传递到第一层中的每个神经元。同样，第一层中每个神经元的输出也会传递到第二层中的每个神经元。这意味着每个输入都可以被不同的神经元以不同的方式（使用不同的权重）进行处理，同样，每个神经元的输出也可以通过多种方式进行处理。输入值有时被称为输入层，但这些仅仅是来自归一化数据的值。图中显示的是具有
    3 层的神经网络（不将输入数据视为层）；最后一层被称为输出层，所有其他层均称为隐藏层，因为它们的输出通常是不可见的。这种结构被称为密集型网络或全连接网络，因为每个神经元都与其所在层直接相邻的层所有神经元相连。


    训练大型网络的过程与图中所示单个神经元的示例相同。训练集中的每个示例都会通过网络，根据输入值和当前权重计算 `ŷ`；这也被称为正向传播。然后，计算每个示例的损失并将其反向传播以更新所有权重。当然，随着网络增长，确定用于反向传播偏导数的数学计算会变得越来越复杂。幸运的是，有许多专门为神经网络设计的软件程序。它们提供了框架，可以在其中非常容易地定义网络结构；此外，它们会自动计算用于反向传播的偏导数。


    从单个神经元的示例可以推出来，较大的网络将包含许多在训练过程中需要调整的参数。即使使用软件工具，训练大型网络的任务在计算上也是巨大的，在普通处理器上通常需要几小时或几天的时间。在之前对反向传播和神经元函数的描述中，计算是由单个神经元单独的。在具有许多神经元的大型网络中，单独评估每个神经元是非常低效的。该过程可以简化，使得这些计算并行进行，这被称为向量化。任何为处理神经网络设计的软件包都会默认包含此功能。计算机硬件也是训练网络所需时间的一个因素；任何神经网络的实际应用都会利用
    `GPUs`（图形处理器）进行训练，而不是使用 `CPUs`（中央处理器）。`CPUs` 执行逐个计算，而 `GPUs` 可以同时进行（许多）计算；这正是训练网络时所需要的，`GPU`
    可以以 `CPU` 的一部分时间完成训练。


    许多著名的机器学习问题最近通过神经网络得到了解决，通常被称为深度学习。深度学习这一术语用于代表具有许多层的神经网络，尽管在所有情况下，这种规模的网络都是必要的。没有阈值来定义什么是深度，但某些实现包含了成千上万的层。许多其他网络架构可以通过卷积层、循环层、残差网络来提高准确率。虽然使用正确的软件工具可以很容易处理神经网络的训练，但仍有很多网络结构需要由工程师决定。例如：是
    4 层每个神经元好还是 5 层每个神经元好？工程师还需要决定使用什么学习率、使用何种激活函数、使用何种优化算法等。这些决策没有明确的规则，通常涉及尝试错误。


    工程师通常将标记数据分为训练集、验证集和测试集。这些设计中的每一个都在验证集上进行评估。选择验证集上性能最好的模型。确定模型后，在测试集上进行评估以获取预测准确性的估计。测试集也用于确定需要多少次迭代。迭代仅仅是通过所有样本的过程。与大多数学习算法一样，神经网络倾向于过拟合训练数据。神经网络会在每次迭代中调整权重以更好地拟合训练数据。目标是识别训练数据中对于总体而言真实的模式，而不是识别仅存在训练数据中的模式（噪声）。为了确定这需要多久，最好的方法是观察每次迭代后训练和验证误差。在下面的图中，误差随迭代次数的变化的变化；目标是最小化测试集的误差。随着训练开始，训练集和验证集的误差都会减少。如果继续训练，训练误差将继续下降，但验证误差将开始上升。这是由于模型过拟合训练数据。通过监控验证误差，工程师可以确保在验证误差达到最小值时结束训练；这可能对应于测试集误差达到最小值的地方。


    图 16：训练和验证误差


    ## 遗传算法


    遗传算法也称为进化算法，是另一种应用于各种问题的优化技术。通用概念是从问题的许多可能解决方案开始。该种群中的每个个体解决方案根据某些目标函数进行评分。然后，通过某种方法将高分个体组合形成新种群。该思想源于进化论，适应环境最好的个体比适应性较差的个体繁殖率更高。生物进化需要许多代才能收敛到最优解；同样，遗传算法通常收敛缓慢。然而，取决于实现方式，它们有时能够跳出局部最优并达到全局最优。

    '
