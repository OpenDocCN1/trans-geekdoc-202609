  trans: '

    另一种简单的无启发搜索技术被称为深度优先搜索。在这种方法中，会扩展最深层的未探索节点。这一过程一直持续，直到路径到达终点目标，或者直到它终止（到达死胡同）。如果路径终止，将进行回溯直到到达另一个未探索的节点，并从该处继续搜索。该名称同样源自目标树；在这种情况下，树会沿着垂直方向（深度）增长得非常快。这种方法在很大程度上取决于运气；如果算法恰好很快扩展了正确的节点，它就能很快找到最优解。然而，如果扩展了错误的节点（那些永远无法到达目标或需要很长路径才能到达终的节点），这种方法可能花费很长时间才能收敛到最优解。


    改进深度优先搜索的一种可能称为深度限制搜索。回到目标树，每个水平层被分配一个深度，其中 `Arad` 的深度为 `0`，`Sibiu` 的深度为 `1`，`Faragas`
    的深度为 `2` 等。选择一个估计的深度限制（目标节点预计所在有多远），并且树的每个分支只探索到这个深度，而不是一直探索到终止。进一步的改进被称为迭代深度搜索，其中选择一个初始深度限制，然后按照深度优先顺序搜索树到该深度。如果在初始深度限制下没有达到目标，则增加限制并进一步扩展树，一直持续到达到目标。迭代深度可以根据目前为止的路径长度对分支进行排序；以便首先加深未扩展的最短路径。与广度优先或深度优先搜索相比，这显著节省了计算，并且通常收敛得更快。


    由于无启发搜索算法在探索之前并不知道图结构，因此目前为止讨论的所有方法在确定扩展哪些节点的优先级时，都只利用了已经走过的路径。如果已知关于节点的更多信息，就可以利用称为启发搜索的技术。这些方法不知道节点之间的边长度，但使用某种形式的到目标的估计距离来优先考虑搜索路径。回到图
    1，每个城市的 `GPS` 坐标可以计算直线距离，这可以用来估计它们之间的行驶距离。在某些情况下，这可能是糟糕的估计（如果两个城市之间有一个需要绕行的大湖），但在大多数情况下这是一个良好的估计。


    一种启发搜索技术被称为贪婪搜索，它简单地扩展到目标估计距离最小的节点。如果估计距离接近真实距离，效果就良好，但如果两者之间存在巨大差异，则可能需要长时间才能收敛。一种更智能的方法被称为
    `A*`（A 星）搜索。使用 `A*`，每个未探索节点被分配一个分数：![](img/image_rsrcU3.jpg) 其中 ![](img/image_rsrcU4.jpg)是从起始节点到被评分节点已过的距离，而
    ![](img/image_rsrcU5.jpg)是从评分节点到目标节点的估计距离。


    有了这个分数，节点按分数从低到高的顺序进行扩展。通过这种方式，`A*` 利用已过的距离和估计距离来优先下一个要探索的节点。尽管非常简单，但 `A*` 通常能迅速收敛并提供一个非常接近最优的解决方案。这种对所有可能的选择进行评分的技术是机器学习方法不可或缺的一部分，类似的概念可以在许多算法中找到。由于计算机本质上依赖于定量结果，它们通常需要一个数值来判断哪个方案是优的。


    一个涉及图搜索的经典问题是“旅行推员”问题；在这种情况下，目标不是寻找两个节点之间的路径，而是多个节点之间的路径，其中节点可以按任何顺序访问。到为止讨论的所有搜索算法都可以用来逐个寻找路径，确定一条到达所有所需节点的路线通常是相当直接的。一旦找到解决方案，目标就是确定它是最优解，还是存在更好的路线。该此应用的一种简单方法是爬山算法。给定一个解决方案，爬山算法会改变它的一个方面（例如，改变两个节点访问的顺序），然后评估这个新方案。如果新方案比旧的好，则丢弃旧的；如果新方案更差，也将其丢弃。重复多次，直到无法获得更好的解决方案为止。“爬山”的名称源于这样一个想法：算法只会“向上”移动以逐步改进解决方案。这保证了它永远不会得到比初始状态更差的解决方案，但让它容易陷入局部最优。


    优化概念在几乎所有的机器学习技术中都很常见。通用流程涉及一个迭代过程，算法尝试根据目标函数定位最优解。目标函数用于对算法进行评分，以便对结果提供定量评估。取决于应用程序，最佳结果可能是目标函数的最大值或最小值。存在许多优化技术，某些将在本概述的后面讨论；这只是对概念的简单介绍。某些目标函数只包含一个极值，且沿整个函数具有梯度；这些被称为凸函数，通常是最容易优化的。爬山算法通常能成功找到凸函数的全局最优解。在更复杂的问题中（尤其是高维目标函数），函数可能包含多个局部最小值和局部极大值，以及没有梯度的平坦区域。全局最优是目标函数最高或最低值的位置；局部最优是函数与周围值相比最低或最高的位置，但不是整个函数域上的。这些复杂函数可能很难优化，不同的技术对于不同的函数可能会产生非常不同的结果。如果使用像爬山算法这样的简单优化算法，其结果在很大程度上取决于初始起始点。


    ![](img/image_rsrcU6.jpg)


    图 3：简单函数的局部和全局最优


    ## 游戏玩


    搜索算法在具有定义规则的环境中运行，例如移动只能沿着边从一个节点到下一个节点。对于游戏玩中考虑的一类算法，也有定义的规则（游戏规则），但存在一个对抗性对手，试图阻止算法达到最优。该对手的行动取决于它获取了多少关于目标和策略的知识。游戏通常可分为四类，根据所有玩家已知的信息量，以及游戏是否包含随机组件来定义。


    ![](img/image_rsrcU7.jpg)


    图 4：四类游戏

