    # 表 1：常见距离指标


    ![](img/image_rsrcUM.jpg)


    同样值得，在讨论距离函数时，特征归一化是一种常用做法。对于每个输入向量，其变量都代表具有不同取值范围的不同数值。例如，如果一个向量描述的是天气，它可能包含在
    `[0, 1]` 范围内的 `humidity`、在 `[-40, 120]` 范围内的 `temperature` 以及在 `[0, 50]` 范围内的
    `wind speed` 特。大多数距离指标会自然地强调范围最大的特征。为了纠正这一点，可以将每个特征的范围调整到 `[0, 1]` 范围内，同时保持原始数据缩放后的均值和方差。其公式非常简单：对于每个特征减去最小值，然后除以最大值，如下所示


    ![](img/image_rsrcUN.jpg)


    如果已知变量的真实范围，可以使用该范围代替数据的 `min` 和 `max`。虽然还有其他根据均值或方差（而非范围）来调整数据的归一化技术，但这是最简单且常用的方法。通过下方的欧几里得距离示例可以看到结果的改进：


    # 表 2：归一化示例


    | 样本 || 湿度 (%) || 温度 (°F) || 风速 (mph) ||  || 样本 || 湿度归一化 || 温度归一化 || 风速归一化 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 1 || 0.08 || 90 || 35 || 1 || 0.00 || 1.00 || 1.00 |

    | 2 || 0.85 || 65 || 20 || 2 || 0.94 || 0.00 || 0.00 |

    | 3 || 0.90 || 85 || 25 || 3 || 1.00 || 0.80 || 0.33 |

    | 距离 || 样本 1 || 样本 2 || 样本 3 ||  || 距离 || 样本 1 || 样本 2 || 样本 3 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 样本 1 || 0.00 || 29.16 || 11.21 ||  || 样本 1 || 0.00 || 1.70 || 1.22 |

    | 样本 2 || 29.16 || 0.00 || 20.62 ||  || 样本 2 || 1.70 || 0.00 || 0.87 |

    | 样本 3 || 11.21 || 20.62 || 0.00 ||  || 样本 3 || 1.22 || 0.87 || 0.00 |


    显然，如果不进行归一化，样本 3 样本 2 的距离大约是样本 1 的两倍。这主要是由于样本 1 和 3 的温度接近；然而，这几乎忽略了样本 2 和 3 的
    `humidity` 和 `wind speed` 非常接近这一事实。如果分类器的目标是预测雨天，这种方法将不起作用。归一化后，样本 2 和 3 彼此距离最近，考虑到
    `humidity` 和 `wind speed`，这似乎是合理的。


    在定义距离指标和归一化后，k 最近邻算法（kNN）可用于分类或回归任务。在分类中，k 最近数据点的输出类别众数作为每个未知数据的分类决策。观察下表示例，如果
    `k = 1`，则算法将只查看最近的数据点。这将是样本 #3，属于 A 类；因此，当 `k = 1` 时，新数据点被分配到 A 类。在二分类中，通常使用奇数作为
    `k`，以避免新点到两个不同类别相等的情况。如果将 `k` 增加到 3，利用欧几里得或曼哈顿距离，最近的样本是 #3、5 和 7，分别属于 A 类、B 和
    B 类。因此，当 `k=3` 时，新点被分配到 B 类。回归任务的执行方式相同，但输出将是 `k` 个数值而非离散类别。这种问题的典型解决方法是取加权平均。


    # 表 3：NN 示例


    | 输入 | 输出 |

    | --- | --- |

    | 1 | 1 |

    | 2 | 2 |

    | 3 | 3 |

    | 4 | 2 |

    | 5 | 1 |

    | 6 | 0 |

    | 7 | 1 |

    | 8 | 0 |

    | 9 | 0 |

    | 10 | 2 |


    # 回归指标


    对于回归问题，有不同的损失计算方法，就像连续变量一样。最简单的回归损失是均方误差`MSE`）和平均绝对误差（MAE`），它们类似于欧几里得和曼哈顿距离。每个的方程所示：


    ```

    MSE = (1/n) * Σ(y_i - ŷ_i)²

    MAE = (1/n) * Σ|y_i - ŷ_i|

    ```


    取决于数据集的大小和应用，应移除 5%-30%的点以加入测试数据。为了选择哪些数据点被移除作为测试数据的一部分，通常进行随机选择以避免人为偏见。即使是随机选择，训练-测试划分中也可能引入偏见。为了消除这一点，可以实施交叉验证来生成多对训练和测试集。在对这些所有数据集进行训练后，工程师对模型的性能范围有了更好的衡量，因为每对训练和测试集都会产生不同的准确率。


    # 决策树与随机森林


    在讨论 `kNN` 时，标记数据被分成了训练集和测试集；然而，我们从未真正讨论过训练分类器或回归器意味着什么。从现在开始，算法（分类或回归）将被称为模型，因为它试图根据数据构建真实世界的预测。通常，模型会有一些参数，可以调整它如何进行预测。训练模型是调整这些参数以适应训练数据的过程。`kNN`
    模型非常简单，唯一需要选择的参数是 `k`。


    '
