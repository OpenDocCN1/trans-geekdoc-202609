- raw: "Genetic algorithms are often implemented with crossover; crossover is a set\
    \ method of combining samples from the population to produce new examples. Given\
    \ two samples (expressed as 1 dimensional vectors), a simple method is to take\
    \ the first half of one and the second half of the other. This can be seen in\
    \ the simple example diagram shown below. The two “parent” samples (A1 & A2) from\
    \ the initial population are combined to create two “child” samples (A5 & A6)\
    \ for the second generation. The red line at the middle of the vector is called\
    \ the crossover point, since the samples are split there and swapped. Crossover\
    \ could also involve swapping the two middle genes, or swapping then rearranging\
    \ the last 2 genes, or any combination imaginable.\n\n![](image_rsrcV7.jpg)\n\n\
    Figure 17: Example of one generation of a genetic algorithm\n\nAfter the first\
    \ crossover is performed as shown, the new population of 4 samples (A3, A4, A5,\
    \ and A6) is again evaluated with the objective function. Again, the two highest\
    \ scoring samples are combined and replaced to form a new generation. This process\
    \ can be repeated indefinitely until a local optimum is reached. Depending on\
    \ how large the initial population is, this can take many iterations. Similar\
    \ to the hill-climbing method, genetic algorithms are prone to identifying local\
    \ optima as opposed to global optima. The most popular technique for avoiding\
    \ this is to allow “genetic mutations” in the population. Borrowing another term\
    \ from biology, this is the concept of allowing samples to change outside of the\
    \ features that they “inherit” from the previous population.\n\nReturning to the\
    \ above example, the two samples A5 and A6 inherited all of their genes directly\
    \ from samples A1 and A2. If mutations were allowed, some of these genes could\
    \ change according to another rule; typically, this rule is just random chance.\
    \ For example, mutations could be allowed on the first and last genes with a 50%\
    \ random chance. In this case, each sample in the new population (A5 and A6) would\
    \ have a 50% chance of a 0 or a 1 for the first and last features. Since the new\
    \ population will be re-evaluated according to the objective function, undesired\
    \ mutations (as well as undesired inherited traits) will naturally be eliminated\
    \ from the population as more crossovers take place. By allowing random changes\
    \ in the population’s genes, mutations help prevent the algorithm from getting\
    \ stuck in a local optimum.\n\n## Support Vector Machines\n\nIn classification\
    \ problems, the objective is to determine the class of an unknown sample based\
    \ upon its input features. This goal can be conceptualized as finding the boundary\
    \ between the different classes in the input space, where the input space contains\
    \ the number of dimensions of the input features. This boundary is typically called\
    \ the decision boundary, since samples on one side of the boundary will be classified\
    \ differently from those on the other side.\n\nSupport vector machines (SVMs)\
    \ are based upon the idea that, in order to build a classifier, it is not necessary\
    \ to evaluate every point in the training set. It is only necessary to identify\
    \ all decision boundaries; and in order to identify a boundary, only the points\
    \ on either side of it must be evaluated. If two groups of data are able to be\
    \ separated by a single line, most likely there are multiple lines which can separate\
    \ them. The SVM method assumes that the best dividing line is that which is furthest\
    \ away from all points along the boundary. The distance from the closest data\
    \ point to the boundary is termed the margin. With SVMs, the goal will be to find\
    \ a straight line which maximizes this margin. Looking at the simple 2-dimensional\
    \ figure below there are many lines which can correctly divide all of the sample\
    \ points, of which two are shown. The optimal dividing line is the black horizontal\
    \ line, since its margin is greater than the green line’s margin. Traditional\
    \ SVMs, as presented here, can only be used to classify data that is able to be\
    \ separated by a straight line. If a nonlinear decision boundary is required,\
    \ the data must be projected onto another space where it is linearly separable.\n\
    \n![](image_rsrcV8.jpg)\n\nFigure 18: Two possible decision boundaries to separate\
    \ the negative class from the positive class\n\nGiven a two-dimensional input,\
    \ as shown in the figure above, each data point x will have two features (x1,\
    \ x2). The classifier’s goal is to take in these features and output a class ŷ,\
    \ which will be either -1 or 1 since this is binary classification. In logistic\
    \ regression the decision boundary is set at 0; if ŷ evaluates to any negative\
    \ value it is classified as the negative class (-1), and if it is positive then\
    \ the +1 class. However, in order to create some margin between the classes, two\
    \ decision boundaries will be defined. First, if ŷ is greater than or equal to\
    \ 1 then the point will be classified as positive. Similarly, if ŷ is less than\
    \ or equal to -1 then the point will be classified as negative. This forces the\
    \ classifier to be more cautious with its decision; ŷ must clearly belong to one\
    \ class or another. Given the multi-dimensional input x, the equation used by\
    \ an SVM is:\n\n![](image_rsrcV9.jpg)\n\nWhere ω is a vector of parameters of\
    \ the same length as x. For a two-dimensional problem this is equal to:  \n\n\
    ![](image_rsrcVA.jpg) \n\nTo determine the decision boundaries, this equation\
    \ for ŷ is set equal to the limits defined above. Since the goal is to have all\
    \ positive training examples greater than or equal to 1, the only points that\
    \ are necessary to define the boundary are those that lie on it. These points\
    \ will be equal to 1, and every other positive point will be greater than 1. The\
    \ inverse is true for the negative class. In the above diagram, the points closest\
    \ to the black boundary have a thicker circle around them. Substituting the features\
    \ of these three boundary points into the ŷ equation (equal to +1 and -1 respectively)\
    \ will create a system of equations where only the ω parameters are unknown. Solving\
    \ this system of equations yields the equation for the classifier. By solving\
    \ the problem in this manner, it forces the classifier to obtain an equation which\
    \ maximizes the distance between the two classes.\n\nAfter the classifier equation\
    \ has been obtained, it can be used on the validation and training data sets to\
    \ determine its accuracy. Although in the training data the equation was defined\
    \ so that all points evaluated to above +1 or below -1, in new data this will\
    \ not necessarily be true. In this case, the decision boundary is set at the 0\
    \ value, as shown by the black solid line in the diagram. The dashed boundaries\
    \ at +1 and -1 are only needed to ensure the line chosen maximizes the margin\
    \ between classes.\n\n## Boosting\n\nAn ensemble model is any model which combines\
    \ the output of several other models. This generic description of an ensemble\
    \ can be interpreted in several ways. The random forest classifier, as discussed,\
    \ can easily be viewed as an ensemble of decision trees. Similarly, an individual\
    \ decision tree can be viewed as an ensemble of many small binary classifiers.\
    \ In the standard decision tree each node divides the dataset according to the\
    \ value of only one feature; each of these nodes can be seen as a very simple\
    \ classification model. The boosting method can be applied to any ensemble type\
    \ model and will be introduced here through its application on a relatively simple\
    \ decision tree classifier. Boosting has been shown to provide significant performance\
    \ improvement over a non-boosted ensemble, and it is often utilized in winning\
    \ solutions to online competitions."
