  trans: "\n遗传算法通常通过交叉（crossover）来实现；交叉是一种从种群中组合样本以产生新示例的方法。给定两个样本（表示为一维向量），一种简单的方法是取其中一个的前半部分和另一个的后半部分。这可以在下方的简单示例图中看到。来自初始种群的两个“父”样本（`A1`\
    \ & `A2`）被组合以创建第二代的两个“子”样本（`A5` & `A6`）。向量中间的红线被称为交叉点，因为样本在那里被分割并交换。交叉也可能涉及交换两个中间基因，或者交换并重新排列最后\
    \ 2 个基因，或者任何可以想象的组合。\n\n![](img/image_rsrcV7.jpg)\n\n图 17：遗传算法的一代示例\n\n执行完所示的第一次交叉后，新的\
    \ 4 个样本种群（`A3`、`A4`、`A5` 和 `A6`）再次使用目标函数进行评估。同样，将得分最高的两个样本组合并替换以形成新的一代。这个过程可以无限重复，直到达到局部最优。取决于初始种群的大小，这可能需要多次迭代。与爬山法类似，遗传算法倾向于识别局部最优而非全局最优。避免这种情况的最流行技术是允许种群中出现“基因变异”。借用生物学的另一个术语，这是允许样本改变其从上一个种群中“继承”的特征之外的概念。\n\
    \n回到上面的示例，两个样本 `A5` 和 `A6` 直接从样本 `A1` 和 `A2` 继承了所有的基因。如果允许变异，这些基因中的一些可以根据另一个规则发生变化；通常，这个规则只是随机概率。例如，可以允许第一个和最后一个基因以\
    \ 50% 的随机几率发生变异。在这种情况下，新种群中的每个样本（`A5` 和 `A6`）的第一个和最后一个特征都有 50% 的概率变为 `0` 或 `1`。由于新种群将根据目标函数重新评估，随着更多交叉的发生，不理想的变异（以及不理想的遗传性）自然会从种群中消除。通过允许种群基因的随机变化，变异有助于防止算法陷入局部最优。\n\
    \n## 支持向量机\n\n在分类问题中，目标是根据输入特征确定未知样本的类别。这一目标可以概念化为在输入空间中寻找不同类别之间的边界，其中输入空间包含了输入特征的维度。该边界通常被称为决策边界，因为边界一侧的样本分类将与另一侧的样本不同。\n\
    \n支持向量机（`SVMs`）基于这样一个想法：为了构建分类器，没有必要评估训练集的每一个点。只需要识别所有的决策边界；而为了识别边界，只需要评估边界两侧的点即可。如果两组数据能够用单条线分开，很可能存在多条线可以分开它们。`SVM`\
    \ 方法假设最好的分割线是距离边界上所有点最远的那条。从最近的数据点到边界的距离称为间距（margin）。通过 `SVMs`，目标是找到一条使该间距最大化的直线。观察下方的简单二维图，有许多条线可以正确地划分所有样本点，其中显示了两个。最优分割线是黑色水平线，因为它的间距大于绿色线的间距。这里介绍的传统\
    \ `SVMs` 只能分类能够被直线分割的数据。如果需要非线性决策边界，则必须将数据投影到另一个线性可分的空间中。\n\n![](img/image_rsrcV8.jpg)\n\
    \n图 18：区分负类和正类的两种可能的决策边界\n\n给定一个二维输入（如上所示），每个数据点 `x` 将有两个特征（`x1`、`x2`）。分类器的目标是获取这些特征并输出一个类别\
    \ `ŷ`，由于这是二分类，它将是 `-1` 或 `1`。在逻辑回归中，决策边界设置在 `0`；如果 `ŷ` 评估为任何负值，则被归类为负类（`-1`），如果是正值，则是\
    \ `+1` 类。然而，为了在类别之间创建一些间距，将定义两个决策边界。首先，如果 `ŷ` 大于等于 `1`，则该点被分类为正。同样，如果 `ŷ` 小于等于\
    \ `-1`，则该点被分类为负。这迫使分类器在决策时更加谨慎；`ŷ` 必须明确属于一类或另一个。给定多维输入 `x`，`SVM` 使用的方程为：\n\n![](img/image_rsrcV9.jpg)\n\
    \n其中 `ω` 是一个与 `x` 长度相同的参数向量。对于二维问题，这等于：\n\n![](img/image_rsrcVA.jpg) \n\n为了确定决策边界，将此\
    \ `ŷ` 方程设等于上述定义的限制。由于目标是让所有正训练样本大于或等于 `1`，因此定义边界所需的点仅为位于边界上的点。这些点将等于 `1`，而其他所有正点将大于\
    \ `1`。对于负类，情况反之。在上面的图中，最接近黑色边界的点周围有一个较粗的圆。将这三个边界点的特征代入 `ŷ` 方程（分别等于 `+1` 和 `-1`），将创建一个方程组，其中只有\
    \ `ω` 参数是未知的。通过求解该方程组可以得到分类器的方程。通过这种方式解决问题，迫使分类器获得一个使两类之间距离最大化的方程。\n\n## 提升（Boosting）\n\
    \n集成模型（ensemble model）是任何结合了多个模型输出的模型。对集这种通用描述可以从多个角度解释。正如讨论的，随机森林分类器很容易被看作决策树的集成。同样，单个决策树可以被看作许多小型二分类分类器的集成。在标准决策树中，每个节点仅根据一个特征的值划分数据集；这些节点中的每一个都可以被看作非常简单的分类模型。提升方法可以应用于任何类型的集成模型，这里将通过其在相对简单的决策树分类器上的应用来介绍。事实证明提升比非提升集成模型提供了显著的性能改进，并且经常用于在线竞赛的获胜方案。\n"
