- raw: 'The most popular boosting algorithm is called Adaboost, which is short for
    adaptive boosting. The concept originated from the idea that each individual model
    will perform well on some data points, and that the samples it performs poorly
    on will be better evaluated by another model. Therefore, many simple “weak” classifiers
    can be combined in order to form a “strong” classifier. The key to boosting is
    that each weak model is given a weight wt with which its results will be weighted.
    Utilizing this weight, the equation for the ensemble model output will be:


    ![](image_rsrcVB.jpg)


    Where ht(x) is the output of each individual classifier, and there is a total
    of T classifiers. In general, more weight will be placed on classifiers which
    perform better on the training data.


    This concept is clear and is in fact just a generalized version of the equation
    used by the random forest classifier; with random forest the weights on each decision
    tree were equal, with boosting these weights are unequal. The Adaboost algorithm
    is used in order to determine the value of these weights wt. These weights are
    parameters of the ensemble model, and therefore are learned during training. Another
    weight is introduced, αi, which will be utilized only during training. The weights
    wt are determined during training but really only utilized on the validation and
    test sets, as well as after the model is finalized. The αi weights will be used
    to weigh individual training samples, completely separate from the wt weights.
    The αi weight is used to place greater emphasis (higher weight) on training examples
    for which the previous classifiers performed poorly. Weighing these samples forces
    the next classifier to focus on predicting them correctly. The overall process
    flow for Adaboost will follow the figure below.


    ![](image_rsrcVC.jpg)


    Figure 19: Adaboost overall process flow


    Assume that the classifier is being trained on data for which the output class
    may be either 0 or 1, and for which each data point has 2 dimensions (x1, x2).
    Utilizing all samples in the training data the initial data weights αi are set
    equal, since it has not yet been determined on which samples the classifiers behave
    poorly. For simplicity, the initial weights are all equal to (1/N), where N is
    the number of samples in the training set. The training data is then used to train
    the first classifier h1(x), where the classifier evaluates (x1, x2) for each data
    point. The predicted output from this classifier ŷ is compared to the true labeled
    value of each training sample, and the weighted error of ht(x) is calculated as:


    ![](image_rsrcVD.jpg)


    Note that this error value ranges between 0 and 1. For the first classifier, all
    αi weights are equal so it treats all samples equally; however, after these weights
    are adjusted they force the classifier to fit samples with higher weights. Utilizing
    this equation places a greater penalty on data points with higher αi weights;
    since the classifier will be trained so that it minimizes the error, it will give
    priority to fitting the points with larger weights. Utilizing this error Et, the
    weight wt for the newly trained classifier ht(x) will be calculated as:


    ![](image_rsrcVE.jpg)


    The natural logarithm evaluates to zero at 1; in the binary classification problem
    this is equal to Et = 0.5; this is the error that would be predicted from a classifier
    which generates random guesses. As the error approaches zero, wt will increase.
    Similarly, as the error approaches 1, wt will go further negative. If the classifier
    has 0 error and predicts all samples perfectly, wt will evaluate to infinity;
    in this situation boosting is not necessary and the weak classifier can be used
    alone. Allowing for negative wt weights, although counterintuitive, functions
    very well for binary classification. If an individual classifier performs poorly
    on a dataset (error of greater than 0.5), then its inverse will perform better.
    In this case, using a negative weight will invert the classifier predictions and
    improve overall accuracy.


    After updating the classifier weights wt, the data weights αi must also be updated
    as shown in the flow chart. The goal is to place a higher weight on the samples
    which were previously misclassified, and a lower weight on those samples which
    were correctly classified. This is performed according to the below equation:


    ![](image_rsrcVF.jpg)


    Utilizing these equations, the process is repeated multiple times until multiple
    weak classifiers have been trained on the data, and each one has a weight associated
    with it. Typically, classifiers will be added until the model reaches a goal accuracy
    or until the test set accuracy plateaus. After training is complete, the αi weights
    can be discarded as only the wt model weights will be needed to use the ensemble
    model. If enough weak classifiers are added to the model, a boosted classifier
    can eventually fit the training data perfectly. Of course, this brings with it
    the possibility of overfitting. For this reason, the test and validation set accuracies
    should be monitored during training in the same fashion they were monitored when
    training a deep neural network.


    ## Conclusion


    This overview has introduced many different types of algorithms for machine learning
    and data analysis, the majority of which were covered at a very shallow depth.
    In addition, the examples provided made some simplistic assumptions that are often
    not true in real world data. The foundation presented here is meant to provide
    a guide for those interested in learning more about data science and machine learning,
    as well as those attempting to solve a problem in the field. Any of the techniques
    introduced can be applied as described; however, there are typically numerous
    variations and additions to each of the algorithms which can tailor it for a specific
    application and yield superior results.


    It is recommended to research an individual topic in greater depth before implementing
    it on a real-world problem. There are numerous other machine learning techniques
    which have not been addressed here and may be better suited to a particular problem.
    Many of these techniques, however, share mathematics and underlying logic with
    the surface level content of this overview. A solid understanding of the theoretical
    background behind a specific algorithm is necessary in order to effectively apply
    it. Most machine learning techniques can be readily applied with publicly available
    software tools, but it is up to the engineer to choose the correct algorithm and
    approach.


    Recent advancements in machine learning have caused some expectations of the field
    to be sensationalized. From the introduction provided here, it should be clear
    that a machine learning algorithm is not a form of intelligence and is certainly
    not sentient. The field simply applies algorithms in order to recognize patterns
    in data and navigate these patterns. Machine learning has been successfully applied
    in almost every field of study and can reap significant performance and efficiency
    benefits.


