- raw: 'Although the search and game playing algorithms contain constraints, the field
    of constraint satisfaction is typically involved with more formal descriptions
    of constraints. In these fields, the system state is defined by a vector of variables
    \[X1, X2, X3, … Xn\] (often called features or attributes) where each variable
    has a value from a specific domain Di. The problem places constraints on each
    variable; the constraints can come in three forms: unary, binary, or n-ary. This
    problem will be introduced through the example of coloring a map of Australia
    as shown below. Australia has 7 territories (Xi variables), and the map will only
    contain 3 colors (\[Red, Green, Blue\] is the domain for all variables).


    ![](image_rsrcUG.jpg)![](image_rsrcUH.jpg)


    Figure 8: Territories of Australia and constraint graph


    A unary constraint is any constraint that applies to one variable; similarly,
    a binary constraint applies to two variables. A unary constraint would be of the
    form C(Xi) → Xi = Da, such as Western Australia must be red. A binary constraint
    would be of the form C(Xi, Xj) → Xi ≠ Xj, such as the color of Western Australia
    cannot equal the color of Northern Territory. An n-ary constraint is one that
    involves 3 or more variables; an example is that the color of 2 adjacent territories
    cannot be equal. An n-ary constraint can always be expressed as a group of binary
    and unary constraints. The constraints on each of the territories can be summarized
    through the graph shown next to the map, where each node is a territory and each
    edge is a binary constraint.


    Similar to depth-first search, an approach can simply start by assigning a value
    to one variable; then continue by updating constraints on all connected nodes
    and continuing to assign values one nodes at a time. Eventually, this approach
    will reach either a valid solution or a place where no solution exists that satisfies
    the constraints. At this time, the process can backtrack and make a different
    decision at the next unexpanded node. This is called backtracking search and is
    relatively inefficient and unintelligent. Again, all possible options can be expressed
    with a goal tree.


    ![](image_rsrcUJ.jpg)


    Figure 9: Goal tree for backtracking search


    Using some heuristics can improve the performance of backtracking search; a heuristic
    is guidance based upon the experience of experts. First is the Minimum Remaining
    Values heuristic: on each iteration, assign first the variable with the smallest
    domain. Initially all territories are white so only unary constraints are a factor
    in this decision. After the first color is assigned, as seen in the goal tree,
    then the domains of Northern Territory (NT) and Southern Australia (SA) are reduced
    to 2 options. Second is the Degree Heuristic: on each iteration, assign first
    the variable with the most constraints on other unassigned variables. In this
    example, that is SA since it has the greatest number of edges in the graph. Third
    is the Least Constraining Value: choose the variable value that eliminates the
    fewest possible values for the remaining variables. Looking at the last level
    of the goal tree shown above: if Q is assigned red, then SA can still be blue;
    however, if Q is assigned blue then SA has no valid options and the tree terminates
    and must be backtracked (so red should be chosen).


    In addition to tracking the constraints on each iteration of the algorithm, the
    valid domains of all variables should be tracked as well. This process is called
    forward checking, from the idea that the algorithm is looking ahead to possible
    outcomes for all variables. This also involves ensuring that the constraints on
    existing domains do not eliminate possible options. An example of a poor assignment
    is shown below with forward checking. After three variable assignments, SA has
    no possible values left within its domain. However, including constraints would
    have identified this issue after 2 variable assignments. On the third row of domains,
    SA and NT both have only blue left; since these territories border each other
    this map configuration should be rejected, and Q should be assigned a different
    color.


    ![](image_rsrcUK.jpg)


    Figure 10: Forward checking should have rejected the second decision to make Q
    green


    The functions covered so far introduce the core concepts of constraint satisfaction
    and searching. Of course, many different techniques exist which have not been
    discussed here. There are numerous variations of the algorithms discussed, as
    well as completely different tactics which have been applied to these problems. 
    The key lessons learned in solving these constrained problems will carry over
    into the true machine learning portion of this overview. First, the algorithm
    needs an evaluation function in order to determine the best solution; if this
    function is not chosen correctly no method will work. Second, there are a multitude
    of different approaches that could yield a solution for any given problem; a good
    engineer will be able to choose the application that functions efficiently and
    fits the problem. Third, computational complexity should always be considered
    when programming a solution. Due to noise, random variation, or an unfeasible
    number of outcomes; it is typically impossible to determine the perfect solution,
    so the goal should be to determine a good solution.


    ## Nearest Neighbors


    The field of machine learning is often divided into three subcategories: supervised
    learning, unsupervised learning, and reinforcement learning. The remainder of
    this overview will cover supervised learning, which encompasses a majority of
    machine learning algorithms. Supervised learning can be summarized as algorithms
    which evaluate known (“labeled”) data in order to make predictions on unknown
    (“unlabeled”) data. Data typically has a series of attributes (“input”) expressed
    as a vector for each data point, along with a vector of output variables for each
    data point. If the output variables are classes (i.e. data point Xi is Green from
    the domain \[Red, Green, Blue\]), the task is called classification. If the output
    variables are continuous (i.e. data point Xi is 0.65 from the domain \[0, 1\]),
    the task is called regression. In either case, the learning algorithm is supplied
    with a dataset of input vectors and their respective output vectors. After training
    the algorithm, it should be able to predict the output given an input vector.


    The first, and simplest, technique used in supervised learning is called k-Nearest
    Neighbors. The idea is that, for any new input vector, the algorithm will find
    the k-nearest input vectors from the known dataset where k is some small integer.
    Then it will look at only those k vectors to determine the output for the new
    vector. Although it is a simple concept, identifying the “nearest” examples needs
    to be done in a careful manner. Euclidean distance is the traditional metric for
    vectors defined by continuous numerical coordinates, and it is the straight line
    distance between the two points. Manhattan distance, also called the city block
    distance, is the distance used if lines can only be drawn parallel to coordinate
    axes (at right angles). For categorical input data the Hamming distance is applicable,
    which is simply the sum of attributes that are unequal between the two vectors.
    A distance metric is typically defined as one where the closest points have a
    distance of 0, and the higher the distance magnitude the further away the points.
    If the data points are sparse vectors (each vector contains many zeros), the cosine
    similarity is often used to compute distance. This metric measures the cosine
    of the angle between two vectors and is often used in text analysis. Note that
    for a similarity metric, a value of 0 means the points are far apart and the highest
    value equates to the closest points (cos(0) = 1). To substitute cosine similarity
    into a distance calculation, it is acceptable to use 1 – S(x, y) or cos\-1(S(x,
    y)).'
