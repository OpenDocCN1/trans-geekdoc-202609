- raw: 'The diagram makes clear that there are two separate steps: first all of the
    input variables xi are multiplied by some weight wi, these are added together
    with some constant bias term b; it is common to refer to this sum as the activation
    a. This activation is passed as input to some activation function g(a), which
    yields ŷ. The weights w and bias b are the model parameters which will be trained.
    Different activation functions exist but two common ones are the sigmoid and ReLU
    functions. These two functions are similar in that they have a nonlinearity at
    a = 0; this is key to provide a decision boundary to the neuron. In other words,
    if the activation a is below 0 then ŷ will equal 0 (or very close to it); if the
    activation function a is above 0, then ŷ will also be greater than 0. Their equations
    and graphs are shown below. For the remainder of this overview the default activation
    function will be the sigmoid function unless otherwise noted.


    ![](image_rsrcUX.jpg)


    Figure 14: Two common activation functions


    The primary technique to train a neuron is called backpropagation: it updates
    the weights wi and b in order to fit the training data. The equations to calculate
    backpropagation are derived from partial derivatives of the loss function, and
    therefore are particular to the loss function utilized by the model. Many problems
    in machine learning can be reduced to binary classification, which is simply classification
    where there are only two output classes. The process of training a one neuron
    network will be demonstrated in this format, although the process for more complex
    problems is similar. As an example, the entropy loss function will be used as
    defined below:


    ![](image_rsrcUY.jpg)


    Given that yi will be either 0 or 1 for each example in the training or test set,
    the loss will evaluate to either -![](image_rsrcUZ.jpg)(if yi = 1) or ![](image_rsrcV0.jpg)(if
    yi = 0). To understand why this works well as a loss function, the behavior of
    the logarithmic function is important to understand. The log function, regardless
    of what base is used, equals 0 when its input is 1 and equals ![](image_rsrcV1.jpg)when
    its input is 0. Looking again at the plot of the sigmoid activation function,
    ![](image_rsrcV2.jpg)will be some value between 0 and 1. The goal of training
    the classifier is for ![](image_rsrcV2.jpg)to be very close to 1 when yi = 1 and
    very close to 0 when yi = 0. Therefore, if yi = 1 and ![](image_rsrcV2.jpg)is
    a value close to 1, then the loss on that example will be very small; however,
    if yi = 1 and ![](image_rsrcV2.jpg)is very close to 0, the loss will be very large
    as the loss approaches ![](image_rsrcV3.jpg)as ![](image_rsrcV2.jpg)approaches
    0. The same relationship is true for examples where yi = 0. It is clear this loss
    function heavily penalizes instances where the model incorrectly predicts the
    output.


    An ideal classifier will predict every example in the test set correctly, which
    would result in a loss function evaluating to zero. Therefore, the goal of training
    a neural network is to minimize the loss function by adjusting the model parameters
    wi and b. From calculus, the minimum of a function is always located where its
    derivative equals 0. Since the loss function depends on multiple variables (parameters),
    the partial derivative with respect to each variable must be computed. Using the
    partial derivatives of the loss function, each individual parameter will be updated
    by a small step after evaluating each example from the training set. The size
    of this step is determined by a value chosen before training begins, called the
    learning rate α. This introduces the concept of a model hyperparameter. The model
    parameters are adjusted automatically by backpropagation during training. The
    term hyperparameter is a feature of the model that is not automatically adjusted
    but must be chosen by the engineer when designing the model. Methods for choosing
    hyperparameters will be discussed later when large neural networks are considered.


    After the model output for each training example is evaluated against the training
    set y values, each parameter will be updated according to the following formula:


    ![](image_rsrcV4.jpg)


    In other words, each parameter is adjusted according to how much of the loss function
    can be attributed to that parameter. If a particular xi has a very large magnitude,
    then it will have a large impact on the value of y. If that input value xi is
    very important to the determination of y, then it is appropriate for it to have
    a large impact. However, if variations in that particular xi should only have
    a small impact on y, then the weight on that input should be reduced. By repeating
    this process over and over for every example in the training set, the model slowly
    adjusts weights until they minimize the loss function. For each input feature,
    if the majority of training examples show that a high xi should result in a 1
    classification, then the weight wi corresponding to that input will increase.
    Similarly, if the majority of training examples agree on a 0 classification with
    a high xi, the weight wi will decrease until it is a large negative value. If
    the training set is inconsistent about the value of y given xi, then the weight
    wi will decrease towards 0 so that attribute xi has a very small impact on the
    predicted output ŷ. Working with only one neuron, the model is not very flexible
    so in most cases the minimum of the loss function will still have relatively poor
    accuracy.


    Calculating derivatives is very common in many machine learning applications.
    Mathematically, the derivative is defined as the rate of change of a function
    at a specific value. Knowing the rate and direction of change is very valuable
    when trying to understand the behavior of that underlying (unknown) function.
    For example, if the optimization objective is to find the global maximum or global
    minimum, it would make sense to obtain the gradient at several locations. The
    gradients identify which direction is “uphill” or “downhill”. If they all point
    towards one point being the global optimum, then it is worthwhile investigating
    that location for the optimum. If they all point in different directions, most
    likely the underlying function has multiple local optima. The technique of computing
    a gradient and moving “downhill” or “uphill” from that point is called gradient
    descent or gradient ascent.


    The example shown so far has dealt with only one neuron acting independently;
    however, the purpose of a neural network is to combine many neurons together so
    that their combined output can approximate a very complex function. In fact, most
    modern neural networks consist of hundreds or thousands of neurons. In a standard
    network, each neuron functions exactly as described above; it takes in many inputs,
    calculates a weighted sum of those inputs, and then passes that sum through a
    nonlinear function to generate one output. Although it may seem like a simple
    idea, combining many of these neurons together enables a network to fit nearly
    any complex function.


    ![](image_rsrcV5.jpg)


    Figure 15: Example of a neural network with 3 layers (2 hidden layers and 1 output
    layer)'
