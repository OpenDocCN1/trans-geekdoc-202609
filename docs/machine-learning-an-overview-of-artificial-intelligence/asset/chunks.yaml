    | Sample 3 || 11.21 || 20.62 || 0.00 ||  || Sample 3 || 1.22 || 0.87 || 0.00 |


    It is clear how, without normalization, sample 3 is about twice as far from sample
    2 as it is from sample 1. This is due primarily to the close temperatures of samples
    1 and 3; however, this nearly ignores the fact that the humidity and wind speed
    of samples 2 and 3 are very close. If the goal of the classifier is to predict
    rainy days, this will not work. After normalization, samples 2 and 3 are the closest
    to each other, which seems reasonable given the close humidity and wind speeds.


    After defining the distance metric and normalization, k-Nearest Neighbors (kNN)
    can be used for classification or regression tasks. In classification, the mode
    of the output classes of the k-nearest data points is used as the classification
    decision for each unknown data point. Looking at the example data below, if k
    = 1 then the algorithm will only look at the closest data point. This will be
    data sample # 3, which is class A; therefore, with k = 1 the new data point is
    assigned to class A. In binary classification, it is customary to only use odd
    number for k to avoid the case where the new point is equidistant from 2 points
    with different classes. If k is increased to 3, utilizing Euclidean or Manhattan
    distance, the closest sample points are # 3, 5, and 7 which are classes A, B,
    and B respectively. Therefore, with k=3, the new point is assigned to class B.
    The task for regression is performed in the same way, except the output classes
    will have k numeric values instead of discrete classes. A typical solution to
    this is to take a weighted mean of these numeric values, where each value is weighted
    by its distance from the new point (the closer values having a higher weight).


