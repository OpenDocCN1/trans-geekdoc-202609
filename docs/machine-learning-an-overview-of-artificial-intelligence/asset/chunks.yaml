- raw: 'A decision tree model follows the same structure as the goal trees that have
    been used repeatedly in this overview. The difference here is that the tree structure
    and decision nodes are determined by the training data. Whereas a kNN model compared
    the distance between all features of a vector, the decision tree will look at
    the features individually in order to create its prediction. Each node will only
    look at one feature of the training data, and it will make a decision based upon
    the value of that feature. These models will be described for a classification
    application, but they can also be used for regression problems. They can also
    be used for input vectors with continuous or discrete values; for continuous variables,
    each node will be a threshold. A weather-based example is shown below, where the
    data has three features with the following domains: Outlook \[Sunny, Overcast,
    Rain\], Humidity \[High, Normal\], and Wind \[Strong, Weak\]. Note that the tree
    reaches different depths along different branches, and that along the same level
    of the tree different branches can split according to different features.


    ![](image_rsrcUS.jpg)


    Figure 11: Simple decision tree example


    With a decision tree model, the parameters to be chosen are the order of features
    to be evaluated at each level, as well as the threshold values for continuous
    variables. It is beneficial to have a tree which splits the data cleanly into
    classes in as few branches as possible. To develop the tree the engineer needs
    a measure of class division, so that each node can split the data in the most
    efficient way. The standard measure of this division is entropy, a term borrowed
    from physics where it means the disorder of a system. The goal is to divide the
    data in a way that minimizes disorder, and therefore groups the data into cleanly
    defined classes. The entropy equation is shown below, where p(xi) represents the
    percentage of samples assigned to each class i.


    ![](image_rsrcUT.jpg)


    With entropy measurable for each possible split of the data, the engineer can
    simply evaluate the possible options at each node. At the top node: measure the
    entropy if data is split along feature X1, measure again if it is split along
    X2, etc, and choose the split that minimizes entropy. At level 1 of the tree:
    now all the data is divided into 2 (or more) groups, and for each group the split
    should be decided separately by again evaluating all options and choosing the
    lowest entropy.


    If the dataset is large and complex enough, this process of dividing the data
    can go on almost indefinitely. In practice the tree is usually limited to a certain
    depth (often around 10 or 20 levels), since the tree grows exponentially in size.
    If a tree is deep enough it can fit the training data perfectly; in other words,
    it will predict the class of the training data correctly on 100% of the samples.
    While this may sound beneficial, it is useful to remember that the goal is to
    predict the behavior of unseen data. There is always some noise or bias present
    in real world datasets; this means that the unseen data the algorithm will encounter
    will not behave exactly like the training data. If the model is near 100% accuracy
    on the training data, most likely it is identifying patterns in noise and bias
    in the training data as opposed to the true behavior of the underlying data. When
    the model fits the training data too well it is called overfitting; conversely
    when the model is too simple for the training or test data it is termed underfitting.
    Looking at the plots below, the best result is the model from the middle plot;
    even though the training accuracy of the third plot will be the highest, it will
    have lower accuracy on the test data.


    ![](image_rsrcUU.jpg)


    Figure 12: Underfitting vs. Overfitting


    Comparing the accuracy of the model on the training data and the test data can
    tell us when a model is overfitting, but now the engineer needs to solve this
    problem. Methods designed to prevent overfitting are called regularization techniques.
    One technique is to use cross validation as described previously, which serves
    to train the model on different pairs of training and testing datasets which will
    help account for bias in any one set. Another technique is to use an ensemble
    method. An ensemble model, broadly, is a model that combines several other models.
    A common ensemble model utilizing decision trees is called a random forest. The
    name of the method, unsurprisingly, comes from the idea that many trees combine
    to create a forest.


    A random forest uses multiple shallow trees, each of which would underfit the
    training data if used alone. The attributes to be used for each tree are selected
    at random before training begins, and each tree is trained independently to a
    fixed depth (i.e. 5 levels). The training data itself can also be randomly sampled.
    In a standard decision tree, the model will select the attributes that provide
    the greatest information gain given all of the training data. If some of these
    attributes are removed, that tree can no longer rely on them to make decisions,
    it must therefore rely on other attributes. Similarly, if some of the training
    data is randomly removed then the bias present in those samples is removed from
    the tree. The random sampling of features and samples is done with replacement;
    this means that the sampling for every tree is done using all original features
    and data, independent of what features or data samples were selected for other
    trees.


    After training a random forest, the model is comprised of several shallow trees,
    each of which can make a computationally quick prediction. These separate predictions
    are combined into the ensemble model to generate one output for each sample in
    the test set. In classification problems, the majority decision of the trees is
    typically used; as with a kNN model, it is therefore beneficial to use an odd
    number of trees for binary classification. In regression problems, the individual
    outputs are typically averaged to come to the ensemble prediction. It is also
    possible to unequally weigh the output of each model according to some criteria
    (i.e. its accuracy on the training or test data).


    ## Neural Networks


    The latest rage in machine learning is a supervised model called an artificial
    neural network (ANN or simply NN). The concept has been around for many decades,
    but recent advances in processing power have allowed ANNs to provide amazing results
    for many machine learning tasks. Neural networks cannot mimic the function of
    the human brain, but the name originates from the idea that many “neurons” making
    simple decisions can be combined to make a complex decision in the same general
    way that a brain is believed to function.


    First, it is worthwhile to examine the functionality of a single neuron in the
    network; one neuron can be used alone as a simple machine learning model for linear
    or logistic regression. Logistic regression is another method for binary classification,
    where a regression output is transformed to be either 0 or 1. Given an input vector
    x = \[x1, x2, … xn\] the model will make a prediction ŷ. Each neuron encompasses
    two functions: a linear combination of all input variables, and then an activation
    function on this combination. The equation and schematic of a single neuron will
    look like this, where g is the activation function:


    ![](image_rsrcUV.jpg)![](image_rsrcUW.jpg)


    Figure 13: Schematic of one neuron'
