- raw: 'As can be seen in the image of a larger network, each attribute of the input
    is passed to each neuron in the first layer. Similarly, the output from each neuron
    in the first layer is passed to each neuron in the second layer. This means that
    each input can be processed in a different way by different neurons (using different
    weights), and similarly the output from each neuron can be processed multiple
    ways. The input values are sometimes called the input layer, but these are simply
    the values from the normalized data. The figure shown above is a neural network
    with 3 layers (not counting the input data as a layer); the last layer is called
    the output layer and all other layers are termed hidden layers since their output
    is usually not seen. This structure is called a dense or fully-connected network,
    since each neuron is connected to all neurons in the layers directly adjacent
    to its layer.


    The process of training a large network is identical to the example shown for
    one neuron. Each example in the training set is passed through the network which
    calculates ŷ given the input values and current weights; this is also called forward
    propagation. Then, the loss for each example is calculated and backpropagated
    to update all weights. Of course, the mathematics to determine the partial derivatives
    for backpropagation become increasingly complicated as the network grows. Luckily,
    many software programs exist which are designed specifically for use with neural
    networks. They provide frameworks wherein it is very easy to define the structure
    of a network; in addition, they calculate the partial derivatives for backpropagation
    automatically.


    Extrapolating from the one neuron example, it is clear that a larger network will
    contain many parameters which need to be adjusted during training. Even with software
    tools, the task of training a large network is very computationally expensive
    and can often take hours or days on a normal processor. In the earlier description
    of backpropagation and neuron function, calculations were performed individually
    by one neuron. In large networks with many neurons, having each neuron evaluated
    individually is a huge inefficiency. The process can be streamlined so that these
    calculations are performed in parallel, known as vectorization. Any software package
    designed for working with neural networks will include this functionality by default.
    Computer hardware also plays a factor in the time required to train a network;
    any serious application of neural networks will utilize GPUs (graphics processing
    units) for training as opposed to CPUs (central processing units). CPUs perform
    calculations one at a time, whereas GPUs can perform many (simple) calculations
    simultaneously; since this is exactly what needs to be done when training a neural
    network, a GPU can train the same network in a fraction of the time that it would
    take a CPU.


    Many high-profile machine learning problems have recently been tackled with neural
    networks, often called deep learning. Deep learning is simply a term to represent
    neural networks with many layers, although the term “deep” is now being adopted
    by other methods which work in similar ways. There is no threshold to define what
    a deep network is, but some implementations have contained over 1000 layers with
    tens of thousands of neurons. In almost all situations, a network of this size
    is not necessary. There are various other network architectures which can improve
    accuracy without adding numerous layers. More advanced networks make use of convolutional
    layers, recurrent layers, residual networks, and many other techniques which will
    not be discussed in this overview.


    Although the training of a neural network can be handled fairly easily with the
    correct software tools, there are still many network structure options which need
    to be decided on by the engineer. For example: is it better to have 4 layers of
    5 neurons each or 5 layers of 4 neurons each? The engineer also needs to decide
    what learning rate to use, which activation function to use, which optimization
    algorithm to use, etc. There are no clear rules for making these decisions, and
    they typically involve some trial and error. A good technique is to find published
    research which tackles a related application. If a researcher was able to achieve
    high performance on a similar problem with a specific network, most likely it
    can be duplicated for similar performance. Many papers published on neural networks
    are the end result of numerous months of trial and error, utilizing different
    network architectures. In deep learning applications, it is often possible to
    find the fully trained network available online. Due to the large computational
    requirements of training deep networks, implementing a pre-trained network can
    save many hours of computational time. Of course, the weights trained on a particular
    dataset may or may not provide adequate performance on new samples.


    An engineer experimenting with different networks needs a method to determine
    which design yields the best performance. Expanding the rationale used for splitting
    the labeled data into training and test sets, labeled data is often split 3 ways
    to obtain another test set (typically named the validation set). The engineer
    then uses the training data for training different model designs, then each of
    these designs is evaluated on the validation set, and the model with the best
    performance on the validation set is chosen. After deciding on the model, it is
    evaluated on the test set in order to obtain an estimate of its prediction accuracy
    on unseen examples.


    The validation or test set is also used to determine how many iterations of training
    are needed for the model. An iteration is simply the process of passing all training
    samples to the algorithm once. As is the case with most supervised learning algorithms,
    neural networks tend to overfit the training data. The neural network will adjust
    its weights on every iteration to better fit the training data. Again, the goal
    is to identify the patterns in the training data which are true for the underlying
    population without identifying the patterns (noise) which are present in only
    the training data. To determine how long this will take, it is best to observe
    the training and validation errors after every iterations of training. In the
    figure below, the error is plotted against the number of training iterations;
    the goal is to minimize the error on the test set. As training begins, the error
    for both training and validation sets decreases. If training continues, the error
    on the training set will continue to drop but the validation error will begin
    to rise. This is caused by the model overfitting the training data. By monitoring
    the validation error, the engineer can ensure that training ends when the validation
    error reaches a minimum; this will most likely correspond to where the test set
    error reaches a minimum as well.


    ![](image_rsrcV6.jpg)


    Figure 16: Training and Validation errors


    ## Genetic Algorithms


    Also called evolutionary algorithms, genetic algorithms are another optimization
    technique that can be applied to a wide variety of problems. The general concept
    is to start with a population of many possible solutions to a problem. Each individual
    solution in this population is scored according to some objective function. Then,
    the high scoring individuals are combined in some method to create a new population.
    The idea originates from the theory of evolution, in which the individuals most
    fit for their environment reproduce at higher rates than those less fit. Biological
    evolution takes many generations to converge to an optimal solution; similarly,
    genetic algorithms are typically slow to converge. Depending upon the implementation,
    however, they are sometimes able to escape from local optima and reach global
    optima.'
