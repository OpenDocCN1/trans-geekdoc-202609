    # Regression Metrics


    For regression problems, there are different methods for computing loss, just
    as there are for continuous variables. The simplest regression losses are mean
    squared error (`MSE`) and mean absolute error (`MAE`), which are analogous to
    `Euclidean` and `Manhattan` distances. The equations for each are shown below:


    ```

    MSE = (1/n) * Σ(y_i - ŷ_i)^2

    MAE = (1/n) * Σ|y_i - ŷ_i|

    ```


