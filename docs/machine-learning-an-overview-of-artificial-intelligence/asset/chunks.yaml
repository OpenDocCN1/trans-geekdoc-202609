    # Introduction


    ![Kernel Machine.svg](image_rsrcU0.jpg)


    A graph of kernel machines being used to analyze separable functions


    Machine Learning


    Machine learning, in its broadest sense, is a series of methods to recognize and
    exploit patterns in data. The name comes from the goal of trying to automate (via
    machines) the process that humans have used to observe the world around them and
    draw conclusions (i.e. learn) from those observations. Although all practical
    work in the machine learning field is done through computer programming, the concepts
    are independent of programming knowledge and instead rely on a mathematical basis.
    This overview will look only at the conceptual and mathematical side of the field,
    with little mention of the programming or practical applications.


    There are a multitude of algorithms that are grouped within the general category
    of machine learning. Depending on the type of information available, as well as
    the goal of a problem, many techniques will not work well or simply be impossible
    to apply. The key to learning different algorithms is to know in which situation
    each functions best. In many situations there is some sample data from a system
    and the goal is to interpret this data to define the system or to predict the
    behavior of new situations. These techniques will be examined later in the overview.
    Initially, problems will not provide sample data, but instead define a problem
    according to some constraints; the goal will be to find an optimal solution given
    the constraints.


    Machine Learning: An Overview of Artificial Intelligence looks at the attempts
    to develop machine learning, from successes to failures. Along with pictures depicting
    important people, places, and events, you will learn about machine learning like
    never before.


    [Machine Learning: An Overview of Artificial Intelligence](#part0001.xhtml)


    [About Charles River Editors](#part0002.xhtml)


    [Introduction](#part0003.xhtml)


    [Search Algorithms and Goal Trees](#part0005.xhtml)


    [Game Playing](#part0005.xhtml#aRF)


    [Constraint Satisfaction](#part0005.xhtml#aRG)


    [Nearest Neighbors](#part0005.xhtml#aRH)


    [Decision Trees and Random Forests](#part0005.xhtml#aRJ)


    [Neural Networks](#part0005.xhtml#aRK)


    [Genetic Algorithms](#part0005.xhtml#aRM)


    [Support Vector Machines](#part0005.xhtml#aRN)


    [Boosting](#part0005.xhtml#aRP)


    [Conclusion](#part0005.xhtml#aRR)


    [Online Resources](#part0005.xhtml#aRS)


    [Bibliography](#part0005.xhtml#aRT)


    [Free Books by Charles River Editors](#part0006.xhtml)


    [Discounted Books by Charles River Editors](#part0007.xhtml)


    ## Search Algorithms and Goal Trees


    The first method to be covered in this overview will be goal trees and methods
    for searching through them; this type of problem is also referred to as uninformed
    search. These algorithms are typically taught through examples of route-planning
    or game-playing problems. For example, a character is in the city of Arad and
    need to drive to Bucharest; each vertex in the graph is called a node, and it
    is labeled with a letter (in this case we will use the first letter of each city’s
    name). Each node is connected to a limited number of other nodes with edges, and
    there is a specific distance assigned to each edge; in the example this would
    be the driving distance from one city to the next. These nodes and edges define
    the constraints on the problem; the goal is to go from A to B in the shortest
    distance or time. A simple map is shown as a graph below in Figure 1.


    ![](image_rsrcU1.jpg)


    Figure 1: Example of a graph-based map


    Upon initialization, the algorithm does not know how the nodes are connected or
    the distance from one node to another. It learns this information only as it encounters
    each node. So, starting at point A the algorithm knows that it can go to nodes
    Z, S, or T as well as the distance to each. While this example is quite simple,
    imagine the challenges that Google Maps faces when choosing the optimal route
    from Los Angeles to New York where there are millions of possible nodes. In this
    situation, it is computationally unfeasible to calculate every possible route
    and then compare all of them. The algorithm must choose which nodes to traverse
    and in what order. There are a variety of techniques to solve this problem, and
    the math behind them is very straight forward.


    The simplest method is called breadth-first search. In this case, the path with
    the least node so far is expanded to one more node; this is repeated until the
    end destination is reached. So, from A, the algorithm first evaluates the path
    A → Z, A → S, and A → T (in any order). From there it will expand one of these
    nodes to the next level and continue this until B is reached. Note that this approach
    does not make use of the distances between nodes; it simply expands nodes according
    to the count of nodes. A variation of breadth-first search called uniform-cost
    search does make use of these distances. In uniform-cost search, the path with
    the shortest distance so far is expanded (regardless of how many nodes are required
    to get there). The problem with this method is that all paths that have been traversed
    must be saved while the algorithm is running. The number of possible paths grows
    exponentially; with millions of nodes, the amount of information saved is immense.
    In addition, there is not much machine learning going on here; it is basically
    a brute-force approach that tries every possible route until something works.


    Breadth-first search is named after the visual representation of this technique
    according to a goal tree. If every path explored so far is defined as a state,
    then these states can be visually described according to a tree structure as shown
    in Figure 2, where the black lines are explored regions and the green are unexplored.
    Utilizing breadth-first or uniform-cost search, the tree grows in breadth very
    quickly, and the path representing each branch of the tree is saved separately.
    As the tree grows, the number of states saved in memory grows as well. The beam
    search method can be applied with breadth-first search in order to eliminate this
    problem. With beam search, only a limited number of paths at each level are saved.
    The name is derived from the idea that limiting the width of the tree follows
    a path similar to walking along a beam. The beam width is chosen (for example,
    10), then after each level of the tree is explored, only the 10 shortest paths
    so far are saved for further exploration. The beam width must be chosen according
    to the total number of possible paths; if it is too small then the correct path
    will be discarded, and the algorithm will not reach the goal, if it is too large
    then there is little advantage over the standard breadth-first search.


    ![](image_rsrcU2.jpg)


    Figure 2: Goal tree for uninformed search'
