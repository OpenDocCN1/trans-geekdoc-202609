    many `expectimax levels` the advantage of `α-β pruning` is diminished due to 2
    reasons: many nodes will have values very close to each other, and the randomness
    of the outcomes does not guarantee the true result will match the expected result.


    ![](image_rsrcUF.jpg)


    Figure 7: Expectimax tree example


    ## Constraint Satisfaction

