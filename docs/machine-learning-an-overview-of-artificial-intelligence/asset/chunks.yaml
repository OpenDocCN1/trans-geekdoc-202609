    决策树模型的结构与本文概述中反复使用的目标树具有相同的结构。区别在于，树结构和决策节点是由训练数据决定的。`kNN` 模型比较的是向量所有特征之间的距离，而决策树则会逐一查看特征以创建预测。每个节点将只查看训练数据中的一个特征，并根据该特征的值做出决策。这些模型将针对分类应用进行描述，但它们也可以用于回归问题。它们还可以用于具有连续或离散值的输入向量；对于连续变量，每个节点都将是一个阈值。下面展示了一个基于天气的示例，其中数据具有三个特征，其取值范围：`天气
    [晴, 阴, 雨]`、`湿度 [高, 正常]` 和 `风力 [强, 弱]`。请注意，树在不同分支上达到了不同的深度，并且在树的同一层，不同分支可以根据不同的特征进行分裂。


    ![](img/image_rsrcUS.jpg)


    图 11：简单决策树


    在使用决策树模型时，所选择的参数是每一层要评估的特征顺序，以及连续变量的阈值。为了开发一棵能够以最少分支将数据清晰地划分到各个类别的树，需要一种划分的衡量标准。这种划分的标准衡量方法是熵，这是一个借用自物理学的术语，意味着系统的无序度。目标是以最小化无序的方式划分数据，从而将数据清晰地分组。熵方程所示，其中
    `p(xi)` 表示分配给每个类别 `i` 的百分比。


    ![](img/image_rsrcUT.jpg)


    对于数据的每种可能划分的可测量熵，模型可以在每个节点评估可能的选项。在顶部节点：沿着 `X1` 分裂测量熵，再次沿着 `X2` 分裂，并选择使熵最小的分裂。在树的第
    1 层：所有数据被分为 2（或更多）组，对于每个组应通过单独评估所有选项来决定分裂。


    如果数据集足够大且复杂，这种划分数据的过程可以无限进行。在实践中，树通常被限制在特定的深度（通常约为 20 层），因为树的大小呈指数级增长。如果一棵树足够深，它可以完美地拟合训练数据；换句话说，它可以正确预测训练数据。虽然这听起来可能很有益，但要记住目标是预测未见的数据。真实世界的数据集中总是存在一些噪声或偏差，这意味着算法遇到的未见数据行为将是不完全相同的。如果模型在训练数据上的准确率很高，可能是识别了训练数据中的噪声和偏差。当模型过度拟合训练数据时，被称为过拟合（overfitting）；相反，当模型对于训练或测试数据太简单时，被称为欠拟合（underfitting）。观察图表，中间图表的结果最好，尽管它在测试数据上的准确率会较低。


    ![](img/image_rsrcUU.jpg)


    图 12：欠拟合与过拟合


    比较模型在训练数据和测试数据上的准确率可以告诉我们模型何时过拟合，现在需要解决这个问题。防止过拟合的方法被称为正则化技术。一种技术是使用之前描述的交叉验证，在不同的训练和测试数据集上训练模型，以处理任何集合中的偏差。另一种技术是使用集成方法。广义地说，集成模型是结合几个其他模型。利用决策树的常见集成模型被称为随机森林（random
    forest）。该方法的名称意外，源于许多树组合成一个森林的想法。


    随机森林使用了多个浅层树，如果单独使用，每棵树都会对训练数据产生欠拟合。每棵树使用的属性在训练开始前随机选择，并且每棵树独立地训练到固定深度（例如 5 层）。训练数据本身也可以进行随机采样。在标准决策树中，模型将根据所有训练数据选择信息增益最大的属性。如果删除了这些属性，该树就不能再依赖它们做出决策，因此必须依赖其他属性。同样，如果随机删除了部分训练数据，样本中的偏差就会从树中移除。特征和样本的随机采样是带回的；这意味着每棵树的采样都是使用所有原始特征和数据，与其他树选择的特征或数据无关。


    训练随机森林后，模型由几个浅层树组成，每棵树都可以进行快速预测。这些独立的预测组合到集成模型中，为测试集中的每个样本生成一个输出。在分类问题中，通常使用树的多数决策；与
    `kNN` 模型一样，因此对于二分类使用奇数树是有益的。在回归问题中，通常对单个输出取平均值以得到集成预测。还可以根据某些标准（例如其在训练或测试数据上的准确率）对每个模型的输出进行不均加权。


    ## 神经网络


    机器学习的最新热潮是一种称为人工神经网络（`ANN` 或简单的 `NN`）的监督模型。这个概念已经存在了几十年，但最近处理能力的进步使得 ANN 在许多机器学习任务中提供了惊人的结果。神经网络无法模拟人类的功能，但该名称源于一种观点：许多做出简单决策的“神经元”可以结合起来，以大脑认为的通用方式做出复杂决策。


    首先，值得检查网络中单个神经元的功能；一个神经元可以单独用作线性或逻辑回归的简单机器学习模型。逻辑回归是另一种二分类方法，它将回归输出转换为 0 或 1。给定输入向量
    `x = [x1, x2, … xn]`，模型将做出预测 `ŷ`。每个神经元包含两个函数：所有输入变量的线性组合，然后是在该组合上应用激活函数。单个神经元的方程和示意图看起来如下所示，其中
    `g` 是激活函数：


    ![](img/image_rsrcUV.jpg)!(image_rsrcUW.jpg)


    图 13：单个神经元的示意图

    '
