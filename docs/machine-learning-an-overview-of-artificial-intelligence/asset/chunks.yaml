    ## 搜索算法与目标树


    将介绍的最简单方法是非启发搜索。在这种情况下，算法不知道到终点的距离；它只是尝试每条可能的路线，直到某条路径有效。如果空间太大，它与标准的广度优先搜索相比没有太大优势。这种方法的问题在于，算法运行时必须保存所有遍历过的路径。图
    1 显示了一个示例地图。


    ![](img/image_rsrcU1.jpg)


    图 1：非启发搜索示例


    初始化后，图表显示了起点 `A`。算法探索 `A` 的所有邻居，即 `Arad`、`Bucharest` 和 `Sibiu`。这些节点被添加到队列中。然后算法从队列中取出第一个节点
    `Arad`，并探索它的邻居。`Arad` 的邻居是 `Zerind`、`Sibiu` 和 `Ora`。由于 `Sibiu` 已经在队列中，因此 `Zerind`
    和 `Ora` 被添加。这一过程持续到到达目标节点 `B`。


    广度优先搜索根据该技术在目标树中的视觉表示而命名。如果目前为止探索的每条路径都被定义为一个状态，那么这些状态就可以根据树结构进行视觉化描述，如图 2 所示，黑线是已探索区域，绿色是未探索区域。利用广度优先或均匀代价搜索，树在宽度上增长非常快，代表树每个分支的路径会被单独。随着树的增长，内存中保存的状态数量也随之增加。束搜索可以结合广度优先搜索来解决这个问题。在束搜索中，每层只保存有限数量的路径。选择束宽（例如
    10），然后在探索完树的每一层后，只保存目前为止最短的 10 条路径供进一步探索。束宽必须根据可能路径的总数来选择；如果太小，正确路径将被丢弃，导致算法无法到达目标；如果太大，则与标准的广度优先搜索相比没有太大优势。


    ![](img/image_rsrcU2.jpg)


    图 2：非启发搜索的目标树


