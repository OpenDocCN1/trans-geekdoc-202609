  \n## 引言\n\n![Kernel Machine.svg](img/image_rsrcU0.jpg)\n\n用于分析可分离函数的核机图\n\n### 机器学习\n\
  \n从广义上说，机器学习是一系列识别和利用数据中模式的方法。该名称源于一个目标：试图（通过机器）自动化人类用来观察周围世界并从这些观察中得出结论（即学习）的过程。尽管机器学习领域的所有实际工作都是通过计算机编程完成的，但这些概念独立于编程知识，而是依赖于数学基础的。本概述将仅关注该领域的概念和数学方面，很少提到编程或实际应用。\n\
  \n在机器学习这一大类下归类着众多的算法。根据可用信息的类型以及问题的目标，许多技术将无法良好工作，或者根本无法应用。学习不同算法的关键在于了解每种算法在什么情况下运行最好。在许多情况下，系统会提供一些样本数据，目标是解释这些数据以定义系统，或预测新情况的行为。这些技术将在概述的后续部分进行探讨。最初，问题不会提供样本数据，而是根据某些约束条件定义问题；目标是在给定约束条件下找到最优解。\n\
  \n《机器学习：人工智能概述》一书回顾了开发机器学习的尝试，从成功到失败。通过描绘重要人物、地点和事件的图片，您将以前所未有的方式学习机器学习。\n\n\n###\
  \ 搜索算法与目标树\n\n将介绍的最简单方法是非启发搜索。在这种情况下，算法不知道到终点的距离；它只是尝试每条可能的路线，直到某条路径有效。如果空间太大，它与标准的广度优先搜索相比没有太大优势。这种方法的问题在于，算法运行时必须保存所有遍历过的路径。图\
  \ 1 显示了一个示例地图。\n\n![](img/image_rsrcU1.jpg)\n\n图 1：非启发搜索示例\n\n初始化后，图表显示了起点 `A`。算法探索\
  \ `A` 的所有邻居，即 `Arad`、`Bucharest` 和 `Sibiu`。这些节点被添加到队列中。然后算法从队列中取出第一个节点 `Arad`，并探索它的邻居。`Arad`\
  \ 的邻居是 `Zerind`、`Sibiu` 和 `Ora`。由于 `Sibiu` 已经在队列中，因此 `Zerind` 和 `Ora` 被添加。这一过程持续到到达目标节点\
  \ `B`。\n\n广度优先搜索根据该技术在目标树中的视觉表示而命名。如果目前为止探索的每条路径都被定义为一个状态，那么这些状态就可以根据树结构进行视觉化描述，如图\
  \ 2 所示，黑线是已探索区域，绿色是未探索区域。利用广度优先或均匀代价搜索，树在宽度上增长非常快，代表树每个分支的路径会被单独。随着树的增长，内存中保存的状态数量也随之增加。束搜索可以结合广度优先搜索来解决这个问题。在束搜索中，每层只保存有限数量的路径。选择束宽（例如\
  \ 10），然后在探索完树的每一层后，只保存目前为止最短的 10 条路径供进一步探索。束宽必须根据可能路径的总数来选择；如果太小，正确路径将被丢弃，导致算法无法到达目标；如果太大，则与标准的广度优先搜索相比没有太大优势。\n\
  \n![](img/image_rsrcU2.jpg)\n\n图 2：非启发搜索的目标树\n\n\n\n\n另一种简单的无启发搜索技术被称为深度优先搜索。在这种方法中，会扩展最深层的未探索节点。这一过程一直持续，直到路径到达终点目标，或者直到它终止（到达死胡同）。如果路径终止，将进行回溯直到到达另一个未探索的节点，并从该处继续搜索。该名称同样源自目标树；在这种情况下，树会沿着垂直方向（深度）增长得非常快。这种方法在很大程度上取决于运气；如果算法恰好很快扩展了正确的节点，它就能很快找到最优解。然而，如果扩展了错误的节点（那些永远无法到达目标或需要很长路径才能到达终的节点），这种方法可能花费很长时间才能收敛到最优解。\n\
  \n改进深度优先搜索的一种可能称为深度限制搜索。回到目标树，每个水平层被分配一个深度，其中 `Arad` 的深度为 `0`，`Sibiu` 的深度为 `1`，`Faragas`\
  \ 的深度为 `2` 等。选择一个估计的深度限制（目标节点预计所在有多远），并且树的每个分支只探索到这个深度，而不是一直探索到终止。进一步的改进被称为迭代深度搜索，其中选择一个初始深度限制，然后按照深度优先顺序搜索树到该深度。如果在初始深度限制下没有达到目标，则增加限制并进一步扩展树，一直持续到达到目标。迭代深度可以根据目前为止的路径长度对分支进行排序；以便首先加深未扩展的最短路径。与广度优先或深度优先搜索相比，这显著节省了计算，并且通常收敛得更快。\n\
  \n由于无启发搜索算法在探索之前并不知道图结构，因此目前为止讨论的所有方法在确定扩展哪些节点的优先级时，都只利用了已经走过的路径。如果已知关于节点的更多信息，就可以利用称为启发搜索的技术。这些方法不知道节点之间的边长度，但使用某种形式的到目标的估计距离来优先考虑搜索路径。回到图\
  \ 1，每个城市的 `GPS` 坐标可以计算直线距离，这可以用来估计它们之间的行驶距离。在某些情况下，这可能是糟糕的估计（如果两个城市之间有一个需要绕行的大湖），但在大多数情况下这是一个良好的估计。\n\
  \n一种启发搜索技术被称为贪婪搜索，它简单地扩展到目标估计距离最小的节点。如果估计距离接近真实距离，效果就良好，但如果两者之间存在巨大差异，则可能需要长时间才能收敛。一种更智能的方法被称为\
  \ `A*`（A 星）搜索。使用 `A*`，每个未探索节点被分配一个分数：![](img/image_rsrcU3.jpg) 其中 ![](img/image_rsrcU4.jpg)是从起始节点到被评分节点已过的距离，而\
  \ ![](img/image_rsrcU5.jpg)是从评分节点到目标节点的估计距离。\n\n有了这个分数，节点按分数从低到高的顺序进行扩展。通过这种方式，`A*`\
  \ 利用已过的距离和估计距离来优先下一个要探索的节点。尽管非常简单，但 `A*` 通常能迅速收敛并提供一个非常接近最优的解决方案。这种对所有可能的选择进行评分的技术是机器学习方法不可或缺的一部分，类似的概念可以在许多算法中找到。由于计算机本质上依赖于定量结果，它们通常需要一个数值来判断哪个方案是优的。\n\
  \n一个涉及图搜索的经典问题是“旅行推员”问题；在这种情况下，目标不是寻找两个节点之间的路径，而是多个节点之间的路径，其中节点可以按任何顺序访问。到为止讨论的所有搜索算法都可以用来逐个寻找路径，确定一条到达所有所需节点的路线通常是相当直接的。一旦找到解决方案，目标就是确定它是最优解，还是存在更好的路线。该此应用的一种简单方法是爬山算法。给定一个解决方案，爬山算法会改变它的一个方面（例如，改变两个节点访问的顺序），然后评估这个新方案。如果新方案比旧的好，则丢弃旧的；如果新方案更差，也将其丢弃。重复多次，直到无法获得更好的解决方案为止。“爬山”的名称源于这样一个想法：算法只会“向上”移动以逐步改进解决方案。这保证了它永远不会得到比初始状态更差的解决方案，但让它容易陷入局部最优。\n\
  \n优化概念在几乎所有的机器学习技术中都很常见。通用流程涉及一个迭代过程，算法尝试根据目标函数定位最优解。目标函数用于对算法进行评分，以便对结果提供定量评估。取决于应用程序，最佳结果可能是目标函数的最大值或最小值。存在许多优化技术，某些将在本概述的后面讨论；这只是对概念的简单介绍。某些目标函数只包含一个极值，且沿整个函数具有梯度；这些被称为凸函数，通常是最容易优化的。爬山算法通常能成功找到凸函数的全局最优解。在更复杂的问题中（尤其是高维目标函数），函数可能包含多个局部最小值和局部极大值，以及没有梯度的平坦区域。全局最优是目标函数最高或最低值的位置；局部最优是函数与周围值相比最低或最高的位置，但不是整个函数域上的。这些复杂函数可能很难优化，不同的技术对于不同的函数可能会产生非常不同的结果。如果使用像爬山算法这样的简单优化算法，其结果在很大程度上取决于初始起始点。\n\
  \n![](img/image_rsrcU6.jpg)\n\n图 3：简单函数的局部和全局最优\n\n## 游戏玩\n\n搜索算法在具有定义规则的环境中运行，例如移动只能沿着边从一个节点到下一个节点。对于游戏玩中考虑的一类算法，也有定义的规则（游戏规则），但存在一个对抗性对手，试图阻止算法达到最优。该对手的行动取决于它获取了多少关于目标和策略的知识。游戏通常可分为四类，根据所有玩家已知的信息量，以及游戏是否包含随机组件来定义。\n\
  \n![](img/image_rsrcU7.jpg)\n\n图 4：四类游戏\n\n\n\n\n最初，重点将放在第一种场景上，即双方玩家都确切知道游戏的当前状态以及所有可能的未来状态。尽管看起来很简单，但可能的游戏状态数量使得解决这些问题变得非常困难；计算机直到最近（2016\
  \ 年）才能够击败围棋专家。为了表示可能的游戏状态数量，搜索将使用相同类型的目标树（goal tree）。树的每一层代表一组可能的系统状态；在本例中，即游戏的配置。下面展示了井棋（tic\
  \ tac toe）的这种树的示例；每一层代表一个玩家的走法。即使是像井棋这样简单的游戏，为了考虑所有可能的结果，树的宽度也会增长得非常快。\n\n![](img/image_rsrcU8.jpg)![](img/image_rsrcU9.jpg)\n\
  \n图 5：井棋的目标树\n\n### 极极大算法 (Minimax)\n解决这类问题的建立方法被称为 `minimax`（极极大）。这个名称源于算法的目标是在当它是“活跃”玩家（能够移动的玩家）时使目标函数最大化，而在另一个玩家活跃的回合中使相同目标函数最小化。目标函数需要是对当前游戏状态的某种量化评估，通常分数越高越好。对于井棋，这的一个示例是活跃玩家拥有的可能获胜配置数量减去非活跃玩家拥有的获胜配置数量。对于空棋盘，该函数的评估结果为\
  \ 0（两个玩家都有 8 种可能的获胜方式）。如果算法是“X”玩家，他们有 9 种可能的走法；使用此目标函数，每种可能走法的得分以红色列出。当棋盘上只有一个“X”时，算法仍然有\
  \ 8 种获胜方式；但通过通过选择中间方格，算法可以阻挡对手最多的可能性。\n\n`minimax` 的简单实现会在 1 步后选择目标值最高的走法（如红色所示）。然而，假设对手也会为了赢得游戏而行动；在这种情况下，当轮到对手回合时，他们将选择使自己目标函数最大化的走法（等同于让算法的函数最小化）。因此，更聪明的\
  \ `minimax` 实现不仅会计算自己移动 1 步后所有可能的配置，还会计算 2 步后（每个玩家各移动一次）所有可能的配置。这引导我们来到树的第二层，每个棋盘将会有\
  \ 1 个“X”和 1 个“O”。给定第 1 层的所有 9 种可能配置，每种配置在第 2 层都有 8 种可能的配置（称为“分支”或“子节点”）。根据算法在第 1\
  \ 层的移动，对手将选择第 2 层最低的分（因此先极极大）。因此，深度为 2 的算法玩家应该选择第 2 层最小值的最大值。换句话说，第 1 层的每个配置将获得一个其所有子节点状态的最小值。算法应该选择这些得分中的最大值。\n\
  \n这个过程可以层层重复，直到算法评估每一个可能的棋盘状态。从每个状态可能的结果中，算法可以为第一步走法做出最佳选择。在像井棋这样简单的游戏中，普通计算机可以在合理时间内评估所有可能的走法。然而，对于更高级的游戏（如象棋或围棋），这是不可能的。个人电脑在时间耗尽以做出移动之前，只能向前看几层；类似于搜索算法，随着新层级的添加，树的大小几乎呈指数级增长。当然，可以简单地让算法搜索到给定深度，然后选择该深度下最好的状态。在这种情况下，如果两个算法相互对弈，看的最深的那一个保证能赢得大多数比赛。\n\
  \n#### Alpha-Beta 剪枝 (Alpha-Beta Pruning)\n为了消除某些分支评估，可以对每层可能取的值设置限制。这被称为对树进行“剪枝”，因为不需要评估的分支被认为被修剪掉了。可以根据每个值可能取范围的上限（`α\
  \ alpha`）和下限（`β beta`）限制来消除分支。这种技术被称为 alpha-beta（或 `α-β`）剪枝。这种消除是基于 `minimax` 树的至少\
  \ 3 层进行的。下文通过述的步骤中，使用一个简单的 3 层树描述了该过程：\n\n1. ![](img/image_rsrcUA.jpg) 树具有一个 0 层极大化决策块（由指向向上的箭头指示）。第一个分支被完全探索到第\
  \ 2 层。由于第 1 层是最小化步骤（向下箭头），该节点被分配的值为其子节点的最小值。由于第 0 层块将选择所有第 1 层值的最大值，它必须大于或等于 3。\n\
  2. 当探索下一个第 1 层分支时，该节点的下限为 3。如果节点评估为 3 或更小，它永远不会被顶部节点选择，因此它的值不会影响决策。由于是最小化步骤，如果任何第\
  \ 2 层节点小于 3，剩余的第 2 层节点就不再需要评估。在这种情况下，第一个第 2 层节点是 2，因此剩余节点可以被剪枝（用“x”表示）且不再探索。\n\n\
  ![](img/image_rsrcUB.jpg)\n3. 这种情况持续到所有的第 1 层分支，直到它们都已探索或已剪枝。在某些情况下，如果值没有超过 `α`\
  \ 或 `β` 限制，则无法剪枝分支。在这种情况下，它看起来与下面的序列相似。\n\n![](img/image_rsrcUC.jpg)![](img/image_rsrcUD.jpg)!(image_rsrcUE.jpg)\n\
  \n图 6：逐步 Alpha-Beta 剪枝\n\n使用 alpha-beta 剪枝得到与之前完全相同的结果，但函数评估次数可能少得多。剪枝的有效性取决于节点评估的顺序，如上例所示。如果最后一个分支的第\
  \ 2 层节点以相反的顺序评估，则它们中的两个可以被剪枝。通常，除非有关于顺序的其他知识，否则对此无办法。\n\n#### 期望极大算法 (Expectimax)\n\
  到目前为止，`minimax` 树假设两个玩家都知道所有可能的走法。有时决策的某些涉及概率，例如掷骰子。也可能游戏状态的一些信息是确定的，但对每个玩家是未知的（如战舰）。在这些情况下，树的某些节点可以表示为其子节点的加权平均值。下方的树所示，每个分支的权重在分支旁边指定。重要的是，对于任何节点，所有子节点的概率之和必须等于\
  \ 1。这确保了不同节点的值具有可比性。在示例中，有两个分支，权重均为 0.5（`0.5 + 0.5 = 1`）。另一种有效组合是 0.85 和 0.15，或者如果有\
  \ 3 个分支，则是 0.2、0.2 和 0.6；取决于哪种最符合数据。这种节点被称为 `expectimax node`（因此包含它们的树是 `expectimax\
  \ tree`），基于期望值的概念，期望是加权平均值的统计术语。其他最小和极大节点的功能方式与之前相同。值得注意的是，评估几层 `expectimax 节点`\
  \ 会导致到达每个底部概率非常低。如果树有许多 `expectimax 层`，由于两个原因，`α-β 剪枝` 的优势会被削弱：许多节点的值非常接近，而且结果的随机性不能保证真实结果会匹配期望结果。\n\
  \n![](img/image_rsrcUF.jpg)\n\n图 7：期望极大树示例\n\n\n\n\n\n尽管搜索和游戏算法包含约束条件，但约束满足（constraint\
  \ satisfaction）领域通常涉及更正式的约束描述。在这些领域中，系统状态由变量向量 `[X1, X2, X3, … Xn]`（通常称为特征或属性）定义，其中每个变量都有特定定义域\
  \ `Di` 中的值。问题对每个变量施加约束；这些约束有三种形式：一元约束、二元约束或 n 元约束。通过通过所示的澳大利亚地图上色示例介绍这一问题。澳大利亚有\
  \ 7 个领地（`Xi` 变量），地图将包含 3 种颜色（`[Red, Green, Blue]` 是所有变量的定义域）。\n\n![](img/image_rsrcUG.jpg)!(image_rsrcUH.jpg)\n\
  \n图 8：澳大利亚领地与约束图\n\n### 约束的类型\n\n一元约束是任何适用于单个变量的约束；同样，二元约束适用于两个变量。一元约束的形式为 `C(Xi)\
  \ → Xi = Da`，例如西澳必须是红色。二元约束的形式为 `C(Xi, Xj) → Xi ≠ Xj`，例如西澳的颜色不能与北领地的颜色相同。n 元约束是涉及\
  \ 3 或更多变量的约束；例如两个相邻领地的颜色不能相同。n 元约束始终可以表示为一组二元约束和一元约束。每个领地的约束可以通过地图旁边所示的图进行总结，其中每个节点代表一个领地，每条边代表一个二元约束。\n\
  \n#### 回溯搜索\n\n类似于深度优先搜索，这种方法可以简单地从为一个变量分配值开始；然后通过更新所有连接节点的约束，并继续逐个为节点分配值。最终，这种方法将达到一个有效解，或者达到不存在满足约束的解。此时，过程可以回溯，并在下一个未扩展的节点处做出不同的决定。这被称为回溯搜索，其效率相对较低且不够智能。同样，所有可能的选项都可以用目标树来表示。\n\
  \n![](img/image_rsrcUJ.jpg)\n\n图 9：回溯搜索的目标树\n\n#### 优化的启发式方法\n\n使用某些启发式方法可以提高回溯搜索的性能；启发式是基于经验经验指导。\n\
  \n1. **最小剩余值启发式 (Minimum Remaining Values heuristic)**：在每次迭代中，首先分配定义域最小的变量。初始时所有领地都是白色，因此只有一元约束是此决策的因素。在分配第一个颜色后（如目标树所示），北领地\
  \ (`NT`) 和南澳 (`SA`) 的定义域减少到 2 个选项。\n2. **度启发式 (Degree Heuristic)**：在每次迭代中，首先分配对其他未分配变量约束最多的变量。在这个例子中，是\
  \ `SA`，因为它在图中的边数最多。\n3. **最少约束值 (Least Constraining Value)**：选择消除剩余变量的可能值最少的变量值。查看上方所示的目标树最后一级：如果\
  \ `Q` 分配为红色，则 `SA` 仍然可以是蓝色；然而，如果 `Q` 分配为蓝色，则 `SA` 将没有有效选项，树终止并必须回溯（因此应该选择红色）。\n\n\
  #### 前向检查 (Forward Checking)\n\n除了在算法的每次迭代中跟踪约束外，还应该跟踪所有变量的有效定义域。这一过程被称为前向检查，其思想是算法在展望所有变量的可能结果。这还涉及现有定义域上的约束不会消除可能的选项。下方显示了使用前向检查的糟糕分配示例。在分配三个变量后，`SA`\
  \ 在其定义域内没有剩余可能值。然而，如果包含约束，在分配两个变量后就能识别出此问题。在定义域的第三行，`SA` 和 `NT` 都只蓝色；由于这些领地相互接壤，这种地图配置应该被拒绝，且\
  \ `Q` 应该被拒绝。\n\n![](img/image_rsrcUK.jpg)\n\n图 10：前向检查应拒绝 Q\n\n## 结论\n\n到目前为止函数引入了约束满足的核心概念。在这些问题中存在许多算法，当然，存在许多未讨论的变体。在解决这些问题时，通常定义为距离度量。我们所讨论的这些技术将进入概述的机器学习部分。首先，算法需要一个评估函数来确定最佳解；如果该函数选择正确，则方法将工作。其次，存在许多方法可以解决任何问题；优秀的工程师能够选择它。第三，编程时应始终考虑计算复杂度。\n\
  \n### 最近邻 (Nearest Neighbors)\n\n机器学习领域通常分为三个子类：监督学习、无监督学习和强化学习。概述的其余部分将涵盖监督学习，监督学习可以总结为为了预测未知（未标记）数据而评估已知（标记）数据的算法。数据通常每个数据点有一系列属性（输入），以及输出变量的向量。如果输出变量是类别（例如\
  \ `Xi` 在定义域 `[Red, Green, Blue]` 中为绿色），任务称为分类。如果输出变量是连续的（例如 `Xi` 在定义域 `[0, 1]` 中为\
  \ 0.65），任务称为回归。无论哪种，学习算法都提供输入向量数据集。训练算法后，它应该能够根据输入向量预测输出。\n\n监督学习使用的第一种最简单的方法称为\
  \ k 最近邻（k-Nearest Neighbors）。该思想是，对于任何输入向量，算法将在已知集中找到最近的 `k` 个输入向量，其中 `k` 是一个小整数。然后它只查看这\
  \ `k` 个向量来确定新向量的输出。虽然这是一个简单的概念，但识别“最近”示例需要谨慎进行。\n\n\n\n\n\n## 表 1：常见距离指标\n\n![](img/image_rsrcUM.jpg)\n\
  \n同样值得，在讨论距离函数时，特征归一化是一种常用做法。对于每个输入向量，其变量都代表具有不同取值范围的不同数值。例如，如果一个向量描述的是天气，它可能包含在\
  \ `[0, 1]` 范围内的 `humidity`、在 `[-40, 120]` 范围内的 `temperature` 以及在 `[0, 50]` 范围内的\
  \ `wind speed` 特。大多数距离指标会自然地强调范围最大的特征。为了纠正这一点，可以将每个特征的范围调整到 `[0, 1]` 范围内，同时保持原始数据缩放后的均值和方差。其公式非常简单：对于每个特征减去最小值，然后除以最大值，如下所示\n\
  \n![](img/image_rsrcUN.jpg)\n\n如果已知变量的真实范围，可以使用该范围代替数据的 `min` 和 `max`。虽然还有其他根据均值或方差（而非范围）来调整数据的归一化技术，但这是最简单且常用的方法。通过下方的欧几里得距离示例可以看到结果的改进：\n\
  \n## 表 2：归一化示例\n\n| 样本 || 湿度 (%) || 温度 (°F) || 风速 (mph) ||  || 样本 || 湿度归一化 || 温度归一化\
  \ || 风速归一化 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 || 0.08\
  \ || 90 || 35 || 1 || 0.00 || 1.00 || 1.00 |\n| 2 || 0.85 || 65 || 20 || 2 || 0.94\
  \ || 0.00 || 0.00 |\n| 3 || 0.90 || 85 || 25 || 3 || 1.00 || 0.80 || 0.33 |\n| 距离\
  \ || 样本 1 || 样本 2 || 样本 3 ||  || 距离 || 样本 1 || 样本 2 || 样本 3 |\n| --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- |\n| 样本 1 || 0.00 || 29.16 || 11.21 ||  ||\
  \ 样本 1 || 0.00 || 1.70 || 1.22 |\n| 样本 2 || 29.16 || 0.00 || 20.62 ||  || 样本 2 ||\
  \ 1.70 || 0.00 || 0.87 |\n| 样本 3 || 11.21 || 20.62 || 0.00 ||  || 样本 3 || 1.22 ||\
  \ 0.87 || 0.00 |\n\n显然，如果不进行归一化，样本 3 样本 2 的距离大约是样本 1 的两倍。这主要是由于样本 1 和 3 的温度接近；然而，这几乎忽略了样本\
  \ 2 和 3 的 `humidity` 和 `wind speed` 非常接近这一事实。如果分类器的目标是预测雨天，这种方法将不起作用。归一化后，样本 2 和\
  \ 3 彼此距离最近，考虑到 `humidity` 和 `wind speed`，这似乎是合理的。\n\n在定义距离指标和归一化后，k 最近邻算法（kNN）可用于分类或回归任务。在分类中，k\
  \ 最近数据点的输出类别众数作为每个未知数据的分类决策。观察下表示例，如果 `k = 1`，则算法将只查看最近的数据点。这将是样本 #3，属于 A 类；因此，当\
  \ `k = 1` 时，新数据点被分配到 A 类。在二分类中，通常使用奇数作为 `k`，以避免新点到两个不同类别相等的情况。如果将 `k` 增加到 3，利用欧几里得或曼哈顿距离，最近的样本是\
  \ #3、5 和 7，分别属于 A 类、B 和 B 类。因此，当 `k=3` 时，新点被分配到 B 类。回归任务的执行方式相同，但输出将是 `k` 个数值而非离散类别。这种问题的典型解决方法是取加权平均。\n\
  \n## 表 3：NN 示例\n\n| 输入 | 输出 |\n| --- | --- |\n| 1 | 1 |\n| 2 | 2 |\n| 3 | 3 |\n\
  | 4 | 2 |\n| 5 | 1 |\n| 6 | 0 |\n| 7 | 1 |\n| 8 | 0 |\n| 9 | 0 |\n| 10 | 2 |\n\n\
  ## 回归指标\n\n对于回归问题，有不同的损失计算方法，就像连续变量一样。最简单的回归损失是均方误差`MSE`）和平均绝对误差（MAE`），它们类似于欧几里得和曼哈顿距离。每个的方程所示：\n\
  \n```\nMSE = (1/n) * Σ(y_i - ŷ_i)²\nMAE = (1/n) * Σ|y_i - ŷ_i|\n```\n\n取决于数据集的大小和应用，应移除\
  \ 5%-30%的点以加入测试数据。为了选择哪些数据点被移除作为测试数据的一部分，通常进行随机选择以避免人为偏见。即使是随机选择，训练-测试划分中也可能引入偏见。为了消除这一点，可以实施交叉验证来生成多对训练和测试集。在对这些所有数据集进行训练后，工程师对模型的性能范围有了更好的衡量，因为每对训练和测试集都会产生不同的准确率。\n\
  \n## 决策树与随机森林\n\n在讨论 `kNN` 时，标记数据被分成了训练集和测试集；然而，我们从未真正讨论过训练分类器或回归器意味着什么。从现在开始，算法（分类或回归）将被称为模型，因为它试图根据数据构建真实世界的预测。通常，模型会有一些参数，可以调整它如何进行预测。训练模型是调整这些参数以适应训练数据的过程。`kNN`\
  \ 模型非常简单，唯一需要选择的参数是 `k`。\n\n\n\n\n决策树模型的结构与本文概述中反复使用的目标树具有相同的结构。区别在于，树结构和决策节点是由训练数据决定的。`kNN`\
  \ 模型比较的是向量所有特征之间的距离，而决策树则会逐一查看特征以创建预测。每个节点将只查看训练数据中的一个特征，并根据该特征的值做出决策。这些模型将针对分类应用进行描述，但它们也可以用于回归问题。它们还可以用于具有连续或离散值的输入向量；对于连续变量，每个节点都将是一个阈值。下面展示了一个基于天气的示例，其中数据具有三个特征，其取值范围：`天气\
  \ [晴, 阴, 雨]`、`湿度 [高, 正常]` 和 `风力 [强, 弱]`。请注意，树在不同分支上达到了不同的深度，并且在树的同一层，不同分支可以根据不同的特征进行分裂。\n\
  \n![](img/image_rsrcUS.jpg)\n\n图 11：简单决策树\n\n在使用决策树模型时，所选择的参数是每一层要评估的特征顺序，以及连续变量的阈值。为了开发一棵能够以最少分支将数据清晰地划分到各个类别的树，需要一种划分的衡量标准。这种划分的标准衡量方法是熵，这是一个借用自物理学的术语，意味着系统的无序度。目标是以最小化无序的方式划分数据，从而将数据清晰地分组。熵方程所示，其中\
  \ `p(xi)` 表示分配给每个类别 `i` 的百分比。\n\n![](img/image_rsrcUT.jpg)\n\n对于数据的每种可能划分的可测量熵，模型可以在每个节点评估可能的选项。在顶部节点：沿着\
  \ `X1` 分裂测量熵，再次沿着 `X2` 分裂，并选择使熵最小的分裂。在树的第 1 层：所有数据被分为 2（或更多）组，对于每个组应通过单独评估所有选项来决定分裂。\n\
  \n如果数据集足够大且复杂，这种划分数据的过程可以无限进行。在实践中，树通常被限制在特定的深度（通常约为 20 层），因为树的大小呈指数级增长。如果一棵树足够深，它可以完美地拟合训练数据；换句话说，它可以正确预测训练数据。虽然这听起来可能很有益，但要记住目标是预测未见的数据。真实世界的数据集中总是存在一些噪声或偏差，这意味着算法遇到的未见数据行为将是不完全相同的。如果模型在训练数据上的准确率很高，可能是识别了训练数据中的噪声和偏差。当模型过度拟合训练数据时，被称为过拟合（overfitting）；相反，当模型对于训练或测试数据太简单时，被称为欠拟合（underfitting）。观察图表，中间图表的结果最好，尽管它在测试数据上的准确率会较低。\n\
  \n![](img/image_rsrcUU.jpg)\n\n图 12：欠拟合与过拟合\n\n比较模型在训练数据和测试数据上的准确率可以告诉我们模型何时过拟合，现在需要解决这个问题。防止过拟合的方法被称为正则化技术。一种技术是使用之前描述的交叉验证，在不同的训练和测试数据集上训练模型，以处理任何集合中的偏差。另一种技术是使用集成方法。广义地说，集成模型是结合几个其他模型。利用决策树的常见集成模型被称为随机森林（random\
  \ forest）。该方法的名称意外，源于许多树组合成一个森林的想法。\n\n随机森林使用了多个浅层树，如果单独使用，每棵树都会对训练数据产生欠拟合。每棵树使用的属性在训练开始前随机选择，并且每棵树独立地训练到固定深度（例如\
  \ 5 层）。训练数据本身也可以进行随机采样。在标准决策树中，模型将根据所有训练数据选择信息增益最大的属性。如果删除了这些属性，该树就不能再依赖它们做出决策，因此必须依赖其他属性。同样，如果随机删除了部分训练数据，样本中的偏差就会从树中移除。特征和样本的随机采样是带回的；这意味着每棵树的采样都是使用所有原始特征和数据，与其他树选择的特征或数据无关。\n\
  \n训练随机森林后，模型由几个浅层树组成，每棵树都可以进行快速预测。这些独立的预测组合到集成模型中，为测试集中的每个样本生成一个输出。在分类问题中，通常使用树的多数决策；与\
  \ `kNN` 模型一样，因此对于二分类使用奇数树是有益的。在回归问题中，通常对单个输出取平均值以得到集成预测。还可以根据某些标准（例如其在训练或测试数据上的准确率）对每个模型的输出进行不均加权。\n\
  \n## 神经网络\n\n机器学习的最新热潮是一种称为人工神经网络（`ANN` 或简单的 `NN`）的监督模型。这个概念已经存在了几十年，但最近处理能力的进步使得\
  \ ANN 在许多机器学习任务中提供了惊人的结果。神经网络无法模拟人类的功能，但该名称源于一种观点：许多做出简单决策的“神经元”可以结合起来，以大脑认为的通用方式做出复杂决策。\n\
  \n首先，值得检查网络中单个神经元的功能；一个神经元可以单独用作线性或逻辑回归的简单机器学习模型。逻辑回归是另一种二分类方法，它将回归输出转换为 0 或 1。给定输入向量\
  \ `x = [x1, x2, … xn]`，模型将做出预测 `ŷ`。每个神经元包含两个函数：所有输入变量的线性组合，然后是在该组合上应用激活函数。单个神经元的方程和示意图看起来如下所示，其中\
  \ `g` 是激活函数：\n\n![](img/image_rsrcUV.jpg)!(image_rsrcUW.jpg)\n\n图 13：单个神经元的示意图\n\
  \n\n\n该图表清晰地展示了两个独立的步骤：首先，所有的输入变量 `xi` 都乘以某个权重 `wi`，然后将这些值与一个常数偏置项 `b` 相加；通常将此和称为激活值\
  \ `a`。该激活值作为输入传递到某个激活函数 `g(a)` 中，产生 `ŷ`。权重 `w` 和偏置 `b` 是将要训练的模型参数。存在许多不同的激活函数，但最常用的两种是\
  \ `sigmoid` 和 `ReLU` 函数。这两个函数的相似之处在于它们在 `a = 0` 处具有非线性特征；这对于为神经元提供决策边界是关键。换句话说，如果激活值\
  \ `a` 低于 0，则 `ŷ` 将等于 0（或非常接近 0）；如果激活值 `a` 大于 0，则 `ŷ` 也大于 0。它们的方程和图表如下所示。在概述的剩余部分，除非另有说明，否则默认激活函数将是\
  \ `sigmoid` 函数。\n\n![](img/image_rsrcUX.jpg)\n\n**图 14：** 两种常用的激活函数\n\n### 反向传播与训练\n\
  \n训练神经元的主要技术称为反向传播（backpropagation）：它通过更新权重 `wi` 和 `b` 来拟合训练数据。计算反向传播的方程推导自损失函数的偏导数，因此它们特定于模型所使用的损失函数。机器学习中的许多问题可以简化为二分类，二分类简单只有两个输出类别的分类。我们将以这种格式演示单神经元网络的训练过程，尽管处理更复杂问题的过程是类似的。例如，将使用下文定义的熵损失函数：\n\
  \n![](img/image_rsrcUY.jpg)\n\n由于训练集或测试集中的每个样本的 `yi` 将为 0 或 1，损失将评估结果为 -![](img/image_rsrcUZ.jpg)（如果\
  \ `yi = 1`）或 ![](img/image_rsrcV0.jpg)（如果 `yi = 0`）。为了理解为什么这作为损失函数效果良好，对数函数的行为至关重要。`log`\
  \ 函数无论使用何种基数，当其输入为 1 时等于 0，当输入为 0 时等于 ![](img/image_rsrcV1.jpg)。再次查看 `sigmoid` 激活函数的图表，![](img/image_rsrcV2.jpg)\
  \ 将是 0 到 1 之间的某个值。训练分类器的目标是当 `yi = 1` 时 ![](img/image_rsrcV2.jpg) 非常接近 1，当 `yi =\
  \ 0` 时非常接近 0。因此，如果 `yi = 1` 且 ![](img/image_rsrcV2.jpg) 是一个接近 1 的值，那么该样本的损失将非常小；然而，如果\
  \ `yi = 1` 且 ![](img/image_rsrcV2.jpg) 非常接近 0，损失将很大，因为当 ![](img/image_rsrcV2.jpg)\
  \ 趋于 0 时，损失趋向 ![](img/image_rsrcV3.jpg)。对于 `yi = 0` 的样本也存在同样的关系。很明显，这种损失函数会严重惩罚模型预测输出错误的算例。\n\
  \n### 损失优化与超参数\n\n理想的分类器将正确预测测试集中的每个样本，这将导致损失函数评估为零。因此，训练神经网络的目标是通过调整模型参数 `wi` 和\
  \ `b` 来最小化损失函数。根据微积分，函数的最小值始终位于其导数为 0 的位置。由于损失函数取决于多个变量（参数），必须计算相对于每个变量的偏导数。使用损失函数的偏导数，在评估训练集中的每个样本后，每个单独参数将通过一个小步长进行更新。该步长的大小由训练开始前选择的值决定，称为学习率\
  \ `α`。这引入了模型超参数的概念。模型参数在训练期间通过反向传播自动调整。“超参数”项是模型的一个特征，它不会自动调整，而必须由工程师在设计模型时进行选择。选择超参数的方法将在以后考虑大型神经网络时讨论。\n\
  \n在对每个训练样本的模型输出与训练集值 `y` 值进行对比评估后，每个参数将根据以下公式进行更新：\n\n![](img/image_rsrcV4.jpg)\n\
  \n换句话说，每个参数的调整取决于损失函数中有多少部分可以归因于该参数。如果某个特定的 `xi` 幅值很大，那么它将对 `y` 的值产生很大影响。如果该输入值\
  \ `xi` 对确定 `y` 非常重要，那么它产生很大影响是合适的。然而，如果该特定 `xi` 的变化应该只对 `y` 产生很小影响，那么对该输入的权重就应该减少。通过对训练集中的每个样本反复此过程，模型会缓慢调整权重，直到它们最小化损失函数。对于每个输入特征，如果大多数训练样本显示高\
  \ `xi` 应导致 1 分类，那么对应于该输入的权重 `wi` 将增加。同样，如果大多数训练样本对高 `xi` 同意为 0 分类，权重 `wi` 将减少，直到它变成一个很大的负值。如果训练集在给定\
  \ `xi` 的情况下 `y` 的值不一致，则权重 `wi` 将向 0 减小，使得属性 `xi` 对预测输出 `ŷ` 的影响非常小。仅使用一个神经元，模型并不灵活，因此在大多数情况下，损失函数的最小值精度仍然较低。\n\
  \n### 梯度下降\n\n计算导数在许多机器学习应用中非常常见。从数学上讲，导数定义为函数在特定值处的变化率。在试图理解底层（未知）函数的行为时，知道变化率和方向非常有价值。例如，如果优化目标是寻找全局最大值或全局最小值，在几个位置获取梯度是有意义的。梯度识别了哪个方向是“上坡”或“下坡”。如果所有梯度都指向某一点为全局最优解，那么研究该位置是值得的。如果它们都指向不同的方向，很可能是底层函数有多个局部最优。这种计算梯度并从该点“下坡”或“上坡”移动的技术称为梯度下降或梯度上升。\n\
  \n到为止的示例处理的是一个独立运行的神经元；然而，神经网络的目的是将许多神经元结合在一起，使其组合输出可以近似非常复杂的函数。事实上，大多数现代神经网络由数百或数千个神经元组成。在标准网络中，每个神经元的功能与上述相同；它接收多个输入，计算这些输入的加权和，然后将该和通过非线性函数生成一个输出。尽管这似乎是一个简单的想法，但将许多这样的神经元结合使得网络能够拟合几乎任何复杂的函数。\n\
  \n![](img/image_rsrcV5.jpg)\n\n**图 15：** 三层（2 个隐藏层和 1 个输出层）的神经网络示例\n\n\n\n从较大网络的图中可以看出，输入的每个属性都会被传递到第一层中的每个神经元。同样，第一层中每个神经元的输出也会传递到第二层中的每个神经元。这意味着每个输入都可以被不同的神经元以不同的方式（使用不同的权重）进行处理，同样，每个神经元的输出也可以通过多种方式进行处理。输入值有时被称为输入层，但这些仅仅是来自归一化数据的值。图中显示的是具有\
  \ 3 层的神经网络（不将输入数据视为层）；最后一层被称为输出层，所有其他层均称为隐藏层，因为它们的输出通常是不可见的。这种结构被称为密集型网络或全连接网络，因为每个神经元都与其所在层直接相邻的层所有神经元相连。\n\
  \n训练大型网络的过程与图中所示单个神经元的示例相同。训练集中的每个示例都会通过网络，根据输入值和当前权重计算 `ŷ`；这也被称为正向传播。然后，计算每个示例的损失并将其反向传播以更新所有权重。当然，随着网络增长，确定用于反向传播偏导数的数学计算会变得越来越复杂。幸运的是，有许多专门为神经网络设计的软件程序。它们提供了框架，可以在其中非常容易地定义网络结构；此外，它们会自动计算用于反向传播的偏导数。\n\
  \n从单个神经元的示例可以推出来，较大的网络将包含许多在训练过程中需要调整的参数。即使使用软件工具，训练大型网络的任务在计算上也是巨大的，在普通处理器上通常需要几小时或几天的时间。在之前对反向传播和神经元函数的描述中，计算是由单个神经元单独的。在具有许多神经元的大型网络中，单独评估每个神经元是非常低效的。该过程可以简化，使得这些计算并行进行，这被称为向量化。任何为处理神经网络设计的软件包都会默认包含此功能。计算机硬件也是训练网络所需时间的一个因素；任何神经网络的实际应用都会利用\
  \ `GPUs`（图形处理器）进行训练，而不是使用 `CPUs`（中央处理器）。`CPUs` 执行逐个计算，而 `GPUs` 可以同时进行（许多）计算；这正是训练网络时所需要的，`GPU`\
  \ 可以以 `CPU` 的一部分时间完成训练。\n\n许多著名的机器学习问题最近通过神经网络得到了解决，通常被称为深度学习。深度学习这一术语用于代表具有许多层的神经网络，尽管在所有情况下，这种规模的网络都是必要的。没有阈值来定义什么是深度，但某些实现包含了成千上万的层。许多其他网络架构可以通过卷积层、循环层、残差网络来提高准确率。虽然使用正确的软件工具可以很容易处理神经网络的训练，但仍有很多网络结构需要由工程师决定。例如：是\
  \ 4 层每个神经元好还是 5 层每个神经元好？工程师还需要决定使用什么学习率、使用何种激活函数、使用何种优化算法等。这些决策没有明确的规则，通常涉及尝试错误。\n\
  \n工程师通常将标记数据分为训练集、验证集和测试集。这些设计中的每一个都在验证集上进行评估。选择验证集上性能最好的模型。确定模型后，在测试集上进行评估以获取预测准确性的估计。测试集也用于确定需要多少次迭代。迭代仅仅是通过所有样本的过程。与大多数学习算法一样，神经网络倾向于过拟合训练数据。神经网络会在每次迭代中调整权重以更好地拟合训练数据。目标是识别训练数据中对于总体而言真实的模式，而不是识别仅存在训练数据中的模式（噪声）。为了确定这需要多久，最好的方法是观察每次迭代后训练和验证误差。在下面的图中，误差随迭代次数的变化的变化；目标是最小化测试集的误差。随着训练开始，训练集和验证集的误差都会减少。如果继续训练，训练误差将继续下降，但验证误差将开始上升。这是由于模型过拟合训练数据。通过监控验证误差，工程师可以确保在验证误差达到最小值时结束训练；这可能对应于测试集误差达到最小值的地方。\n\
  \n图 16：训练和验证误差\n\n## 遗传算法\n\n遗传算法也称为进化算法，是另一种应用于各种问题的优化技术。通用概念是从问题的许多可能解决方案开始。该种群中的每个个体解决方案根据某些目标函数进行评分。然后，通过某种方法将高分个体组合形成新种群。该思想源于进化论，适应环境最好的个体比适应性较差的个体繁殖率更高。生物进化需要许多代才能收敛到最优解；同样，遗传算法通常收敛缓慢。然而，取决于实现方式，它们有时能够跳出局部最优并达到全局最优。\n\
  \n\n\n遗传算法通常通过交叉（crossover）来实现；交叉是一种从种群中组合样本以产生新示例的方法。给定两个样本（表示为一维向量），一种简单的方法是取其中一个的前半部分和另一个的后半部分。这可以在下方的简单示例图中看到。来自初始种群的两个“父”样本（`A1`\
  \ & `A2`）被组合以创建第二代的两个“子”样本（`A5` & `A6`）。向量中间的红线被称为交叉点，因为样本在那里被分割并交换。交叉也可能涉及交换两个中间基因，或者交换并重新排列最后\
  \ 2 个基因，或者任何可以想象的组合。\n\n![](img/image_rsrcV7.jpg)\n\n图 17：遗传算法的一代示例\n\n执行完所示的第一次交叉后，新的\
  \ 4 个样本种群（`A3`、`A4`、`A5` 和 `A6`）再次使用目标函数进行评估。同样，将得分最高的两个样本组合并替换以形成新的一代。这个过程可以无限重复，直到达到局部最优。取决于初始种群的大小，这可能需要多次迭代。与爬山法类似，遗传算法倾向于识别局部最优而非全局最优。避免这种情况的最流行技术是允许种群中出现“基因变异”。借用生物学的另一个术语，这是允许样本改变其从上一个种群中“继承”的特征之外的概念。\n\
  \n回到上面的示例，两个样本 `A5` 和 `A6` 直接从样本 `A1` 和 `A2` 继承了所有的基因。如果允许变异，这些基因中的一些可以根据另一个规则发生变化；通常，这个规则只是随机概率。例如，可以允许第一个和最后一个基因以\
  \ 50% 的随机几率发生变异。在这种情况下，新种群中的每个样本（`A5` 和 `A6`）的第一个和最后一个特征都有 50% 的概率变为 `0` 或 `1`。由于新种群将根据目标函数重新评估，随着更多交叉的发生，不理想的变异（以及不理想的遗传性）自然会从种群中消除。通过允许种群基因的随机变化，变异有助于防止算法陷入局部最优。\n\
  \n## 支持向量机\n\n在分类问题中，目标是根据输入特征确定未知样本的类别。这一目标可以概念化为在输入空间中寻找不同类别之间的边界，其中输入空间包含了输入特征的维度。该边界通常被称为决策边界，因为边界一侧的样本分类将与另一侧的样本不同。\n\
  \n支持向量机（`SVMs`）基于这样一个想法：为了构建分类器，没有必要评估训练集的每一个点。只需要识别所有的决策边界；而为了识别边界，只需要评估边界两侧的点即可。如果两组数据能够用单条线分开，很可能存在多条线可以分开它们。`SVM`\
  \ 方法假设最好的分割线是距离边界上所有点最远的那条。从最近的数据点到边界的距离称为间距（margin）。通过 `SVMs`，目标是找到一条使该间距最大化的直线。观察下方的简单二维图，有许多条线可以正确地划分所有样本点，其中显示了两个。最优分割线是黑色水平线，因为它的间距大于绿色线的间距。这里介绍的传统\
  \ `SVMs` 只能分类能够被直线分割的数据。如果需要非线性决策边界，则必须将数据投影到另一个线性可分的空间中。\n\n![](img/image_rsrcV8.jpg)\n\
  \n图 18：区分负类和正类的两种可能的决策边界\n\n给定一个二维输入（如上所示），每个数据点 `x` 将有两个特征（`x1`、`x2`）。分类器的目标是获取这些特征并输出一个类别\
  \ `ŷ`，由于这是二分类，它将是 `-1` 或 `1`。在逻辑回归中，决策边界设置在 `0`；如果 `ŷ` 评估为任何负值，则被归类为负类（`-1`），如果是正值，则是\
  \ `+1` 类。然而，为了在类别之间创建一些间距，将定义两个决策边界。首先，如果 `ŷ` 大于等于 `1`，则该点被分类为正。同样，如果 `ŷ` 小于等于 `-1`，则该点被分类为负。这迫使分类器在决策时更加谨慎；`ŷ`\
  \ 必须明确属于一类或另一个。给定多维输入 `x`，`SVM` 使用的方程为：\n\n![](img/image_rsrcV9.jpg)\n\n其中 `ω` 是一个与\
  \ `x` 长度相同的参数向量。对于二维问题，这等于：\n\n![](img/image_rsrcVA.jpg) \n\n为了确定决策边界，将此 `ŷ` 方程设等于上述定义的限制。由于目标是让所有正训练样本大于或等于\
  \ `1`，因此定义边界所需的点仅为位于边界上的点。这些点将等于 `1`，而其他所有正点将大于 `1`。对于负类，情况反之。在上面的图中，最接近黑色边界的点周围有一个较粗的圆。将这三个边界点的特征代入\
  \ `ŷ` 方程（分别等于 `+1` 和 `-1`），将创建一个方程组，其中只有 `ω` 参数是未知的。通过求解该方程组可以得到分类器的方程。通过这种方式解决问题，迫使分类器获得一个使两类之间距离最大化的方程。\n\
  \n## 提升（Boosting）\n\n集成模型（ensemble model）是任何结合了多个模型输出的模型。对集这种通用描述可以从多个角度解释。正如讨论的，随机森林分类器很容易被看作决策树的集成。同样，单个决策树可以被看作许多小型二分类分类器的集成。在标准决策树中，每个节点仅根据一个特征的值划分数据集；这些节点中的每一个都可以被看作非常简单的分类模型。提升方法可以应用于任何类型的集成模型，这里将通过其在相对简单的决策树分类器上的应用来介绍。事实证明提升比非提升集成模型提供了显著的性能改进，并且经常用于在线竞赛的获胜方案。\n\
  \n\n\n最流行的提升算法被称为 `Adaboost`，它是自适应提升的简称。该概念源于这样一个想法：每个模型在某些数据点上表现良好，而在另一些数据上表现较差。因此，可以将多个“弱”分类器组合起来形成一个“强”分类器。提升的关键在于给每个弱分类器赋予一个权重\
  \ `wt`。利用该权重，集成模型的输出公式如下：\n\n![](img/image_rsrcVB.jpg)\n\n其中 `ht(x)` 是每个分类器的输出，总共有\
  \ `T` 个分类器。通常，会将更多的权重放在在训练数据上表现较好的分类器上。这个概念很清晰，它实际上是随机森林方程的推广版本；在随机森林中，每个决策树的权重是相等的，而在提升中这些权重是不等的。`Adaboost`\
  \ 算法用于确定这些权重 `wt`。在训练过程中，会引入另一个权重 `αi`，它仅在训练期间使用。`wt` 权重在训练期间确定验证集和测试集以及模型完成后。`αi`\
  \ 权重将用于加权训练样本，对于之前分类器表现较差的样本赋予更高的权重（更大的权重）。加权这些样本迫使下一个分类器正确地预测它们。`Adaboost` 的整体流程如下所示。\n\
  \n![](img/image_rsrcVC.jpg)\n\n图 19：Adaboost 整体流程\n\n假设分类器正在数据上进行训练，输出类别可能是 0 或\
  \ 1，每个数据点具有多个维度 (`x1`, `x2`)。由于尚未确定哪些样本表现较差，初始数据权重 `αi` 设置为相等。为了简单起见，初始权重均为 `(1/N)`，其中\
  \ `N` 是训练集中的样本数量。然后使用训练数据来训练第一个分类器 `h1(x)`，并将该分类器的预测输出 `ŷ` 与每个训练样本的真实值进行比较，`ht(x)`\
  \ 的加权误差计算如下：\n\n![](img/image_rsrcVD.jpg)\n\n注意该误差值范围于 0 到 1 之间。对于第一个分类器，所有 `αi`\
  \ 权重相等，因此它平等地对待所有样本；然而，在调整这些权重后，它们会强制分类器拟合权重更高的样本。利用该方程对高 `αi` 权重的数据点产生更大的惩罚；由于分类器将被训练以最小化误差，它将优先拟合权重较大的数据点。利用该误差\
  \ `Et`，新训练分类器 `ht(x)` 的权重 `wt` 计算如下：\n\n![](img/image_rsrcVE.jpg)\n\n自然对数在 1 处取零；在二分类问题中，这等于\
  \ `Et = 0.5`；这是随机猜测分类器所预测的误差。随着误差接近 0，`wt` 将增加。同样，随着误差接近 1，`wt` 会变得越来越负。如果分类器误差为\
  \ 0 并完美预测所有样本，`wt` 将趋于无穷；在这种情况下，不需要提升，可以单独使用弱分类器。允许负的 `wt` 权重虽然不直直觉，但对于二分类效果良好。如果单个分类器在数据集上的表现较差（误差大于\
  \ 0.5），则它的反向表现会更好。在这种情况下，使用负权重将反转分类器的预测并提高整体准确率。\n\n在更新分类器权重 `wt` 后，必须如流程所示更新数据权重\
  \ `αi`。目标是给之前分类错误的样本赋予更高的权重，并给分类正确的样本赋予较低的权重。这是根据下面的方程执行的：\n\n![](img/image_rsrcVF.jpg)\n\
  \n利用这些方程，重复多次过程，直到在数据上训练出多个弱分类器，且每个器都有与其相关的权重。通常，会不断添加分类器，直到模型达到目标准确率或测试集准确率进入平台。训练完成后，可以丢弃\
  \ `αi` 权重，因为使用集成模型只需要 `wt` 模型权重。如果向模型添加了足够的弱分类器，提升分类器最终可以完美地拟合训练数据。当然，这带来了过拟合的可能。因此，在训练期间应该像训练深度神经网络那样，监控测试集和验证集的准确率。\n\
  \n## 结论\n\n本概述介绍了许多不同类型的机器学习和数据分析算法，其中大多数的涵盖深度非常浅。此外，所提供的示例做了一些简化的假设，这些假设在现实世界的数据中往往并不成立。这里介绍的基础旨在为对数据科学和机器学习感兴趣的人，以及尝试解决该领域问题的人提供指南。所介绍的任何技术都可以按照描述的方法应用；然而，每个算法通常都有许多变体和改进，可以针对特定应用进行定制并获得更优的结果。\n\
