  {\n    j = i*i\n    print(j)\n}\n```\n[1] 1\n[1] 4\n[1] 9\n\n#### While 循环 (While\
  \ loop)\n\n**语法：**\n\n```\nwhile (condition)\n{\n    (loop_body)\n}\n```\n\n**示例:**\
