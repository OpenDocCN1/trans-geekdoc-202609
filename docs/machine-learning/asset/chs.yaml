  **输出：**\n0.8387097\n\n#### A.6.1.4 随机森林分类器\n\n\n\n\n要实现此分类器，可以使用 `caret` 包中的 `train`\
  \ 函数，并配合参数 `method = “rf”` 来指示 `train` 函数将使用决策树分类器。可选，也可以使用 `randomForest` 包中的 `randomForest`\
  \ 函数。下面给出了实现所需的完整代码。\n\n```r\nlibrary(caret)\nlibrary(randomForest) # Optional\n\
