  \ 1.5 倍的 IQR（四分位距）值进行插补，代码如下：\n\n```r\nlibrary(dplyr)\noutliers <- boxplot.stats(data$mpg)$out\n\
  imputedrows <- data[which(data$mpg == outliers),] %>% mutate(mpg = 1.5*IQR(data$mpg))\n\
  outlier_removed_rows <- data[-which(data$mpg == outliers),]\ndata <- rbind(outlier_removed_rows,\
  \ imputedrows)\n```\n\n## A.3 建模与评估\n\n### 注意：\n\n`caret` 包（Classification And REgression\
  \ Training 的缩写）包含了许多函数，可以简化复杂回归和分类问题的模型训练过程。该包包含以下工具：\n\n* 数据划分\n* 不同的预处理功能\n* 特征选择\n\
  * 使用重采样的进行模型调优\n* 模型性能评估\n以及其他功能。\n\n## A.4 模型训练\n\n要开始使用 `caret` 包的函数，我们需要如下所示引入\
  \ `caret`：\n\n```r\nlibrary(caret)\n```\n\n### A.4.1 留出（Holdout）\n\n在监督学习中，开始建模的第一步是加载输入数据，留出部分输入数据作为测试数据，并将另一部分作为构建模型的训练数据。以下是执行此操作的标准步骤。\n\
  \n```r\ninputdata <- read.csv(\"btissue.csv\")\nsplit = 0.7 # 输入数据划分为训练集和测试集的比例。划分值\
  \ = 0.7 表示 70% 的数据将作为训练数据，即保留 30% 的输入数据作为测试数据\nset.seed(123) # 此步骤是可选的，用于结果的可复现性\n\
  trainIndex <- createDataPartition (y = inputdata$class, p = split, list = FALSE)\
  \ # 将数据分层随机划分为训练集和测试集\ntrain_ds <- inputdata [trainIndex,]\ntest_ds <- inputdata[-trainIndex,]\n\
  ```\n\n### A.4.2 K 折交叉验证\n\n让我们进行 10 折交叉验证。要创建交叉验证，可以使用如下 `caret` 包中的函数：\n\n![images](img/335.png)\n\
  \n接下来，我们执行数据留出。\n\n```r\ntrain_ds <- inputdata[-ten_folds$Fold01]\ntest_ds <- inputdata[ten_folds$Fold01]\n\
  ```\n\n### 注意：\n\n当我们执行数据留出时（即将输入数据划分为训练集和测试集），每个集合选择的记录是随机选取的。因此，显而易见，执行相同的代码可能会导致不同的训练集。训练出的模型也会所不同。在\
  \ R 中，有一个 `set.seed` 函数，它用于设置用于选取记录的随机数生成器的起点。这确保了每次都使用特定序列的随机数，因此每次都会选取相同的记录（即具有相同序列的记录），并以相同的方式训练模型。这对于结果的可复现性至关重要，即每次运行同一个机器学习程序都会生成相同的一组结果。代码如下：\n\
  \n```r\nset.seed(5)\n```\n\n### A.4.3 自助采样（Bootstrap Sampling）\n\n若要为任何统计量生成自助样本，可以使用\
  \ R 的 `boot` 包。下文给出了示例代码。\n\n```r\ninstall.packages(\"boot\")\nlibrary(boot)\nmyfunc\
  \ <- function (){\n  # 函数体\n  return (someval)\n}\nbootcorr <- boot(data = mydata,\
  \ statistic = myfunc, R = 500) # R 是自助采样的数量\n```\n\n### A.4.4 训练模型\n\n一旦完成数据留出等模型准备步骤，即可使用以下代码或类似代码开始实际训练。\n\
  \n```r\nmodel <- train(class ~ ., method = \"rpart\", data = train_ds) # 决策树\n```\n\
  \n## A.4.5 评估\n\n有多种方法可以评估监督和无监督学习中的模型。某些方法已经讨论过。现在是时候通过 R 实现这些方法。\n\n### A.4.5.1\
  \ 监督学习 - 分类\n\n在监督学习中，准确率是评估模型的关键指标。`caret` 包提供了 `confusionMatrix` 函数来显示混淆矩阵，以及敏感性、特异性和召回率等指标。图\
  \ 7 展示了特定数据集的混淆矩阵输出。\n\n![images](img/336.png)\n\n**图 7 决策树模型的性能评估**\n\n```r\npredictions\
  \ <- predict(model, test_ds, na.action = na)\ncm <- confusionMatrix(predictions,\
  \ test_ds$class)\nprint(cm)\nprint(cm$overall['Accuracy'])\n```\n\n### A.4.5.2 监督学习\
  \ - 回归\n\n`summary` 函数应用于回归模型时，会显示残差误差、R 平方等不同的性能指标，涵盖简单回归和多元回归。\n\n![images](img/337.png)\n\
  ![images](img/338.png)\n\n### A.4.5.3 无监督学习 - 聚类\n\n正如我们所见，聚类质量有两种流行的指标：纯度和轮廓系数。纯度只有在数据集类别标签已知时才能计算。另一方面，轮廓系数可以针对任何数据集计算。\n\
  \n#### 纯度\n\n我们将使用 Kaggle 发布的腰痛症状数据集（https://www.kaggle.com/sammy123/lower-back-pain-symptoms-dataset）。`spine.csv`\
  \ 数据包含 310 个观测值和 13 个属性（12 个数值预测变量，1 个二分类属性）。\n\n```r\nlibrary(fpc)\ndata <- read.csv(\"\
  spine.csv\") # 加载 Kaggle 数据集\ndata_wo_class <- data[,-length(data)] # 聚类前从数据集中分离类别属性\n\
  class <- data[,length(data)] # 将类别属性存储在独立变量中供以后使用\ndis = dist(data_wo_class)²\n\
  res = kmeans(data_wo_class,2) # 可以使用其他聚类算法\n\n# 定义一个自定义函数来比较类值与原始类别值并计算匹配率\nClusterPurity\
  \ <- function(clusters, classes) {\n  sum(apply(table(classes, clusters), 2, max))\
  \ / length(clusters)\n}\nClusterPurity(res$cluster, class)\n```\n\n**输出**\n[1] 0.6774194\n\
  \n#### 轮廓系数\n\n使用 R 库 `cluster` 来查找/绘制所形成簇的轮廓系数。下面的代码使用 `k-means` 算法对 `spinem.csv`\
  \ 数据集（与 `spine.csv` 相同但删除了目标变量）进行聚类，然后计算其轮廓系数。\n\n```r\nlibrary (cluster)\ndata\
  \ <- read.csv(\"spinem.csv\")\nsil <- silhouette(res$cluster, dist(data))\nfviz(sil)\n\
  ```\n\n\n\n\n\n```r\ndis = dist(data)²\nres = kmeans(data,2) #Can use other clustering\
  \ algorithms too\nsil_width <- silhouette (res$cluster, dis)\nsil_summ <- summary(sil_width)\n\
  sil_summ$clus.avg.widths # Returns silhouette width of each cluster\nsil_summ$avg.width\
  \ # Returns silhouette width of the overall data set\n```\n\n**输出**\n每个类的轮廓宽度：\n\
  1          2\n0.7473583 0.1921082\n\n整个数据集的轮廓宽度：\n[1] 0.5413785\n\n## A.5 特征工程\n\
  \n### A.5.1 特征构建\n\n为了执行特征构建，我们可以使用 `dplyr` 包中的 `mutate` 函数。以下是使用 iris 数据进行特征构建的小型代码。\n\
