  \n## 第 7 章\n\n## 监督学习：分类\n\n## 7.1 引言\n\n#### 本章目标：\n\n在关于贝叶斯概念学习的最后一章中，你学习到了一种重要的监督学习算法——朴素贝斯算法。正如我们所看到的，它是一种基于条件概率贝斯定理的非常简单但强大的分类器。然而，除了朴素贝斯分类器外，还有其他用于分类的算法。本章将关注其他分类算法。\n\
  \n我们在本章将研究的第一个算法是`k`-最近邻（`k`NN），它尝试根据相似性对无标记数据进行分类。然后，将详细解释另一个关键分类器，即`决策树`（decision\
  \ tree）。顾其名，决策树类似于一棵带有分支的树。接下来，我们将探索`随机森林`（random forest），它可以被看作是许多许多决策树的集合。最后，将探索一种非常强大且流行的分类器——支持向量机（`Support`\
  \ Machine`）。\n\n## 7.2 监督学习示例\n\n在监督学习中，标记数据提供了学习的基础。根据机器学习的定义，这些标记数据就是经验或先验知识。它之所以被称为监督学习，是因为机器的学习过程可以与老师相关。在这里，老师就是训练数据。因此，我们说在监督学习的情况下，`训练数据是有标记的`。相反，无监督学习没有标记数据。如图\
  \ 7.1 所示，半监督学习使用了少量的标记数据以及无标记数据。\n\n![images](img/176-1.png)\n**7.1** 监督学习与无监督学习\n\
  \n## 7.3 分类模型\n\n让我们考虑两个例子，例如“预测肿瘤是恶性的还是良性的”以及“房地产领域的价格预测”。这两个问题在性质上是一样的吗？\n\n\n\
  \n\n答案是“否”。确实，这两者都是与预测相关的问题。然而，对于肿瘤预测，我们正尝试预测与肿瘤相关的未知输入数据属于哪一类别或分类，即“恶性”或“良性”。在另一种情况下，即价格预测，我们尝试预测的是一个绝对值而不是一个类别。\n\
  \n当我们尝试预测分类变量或名义变量时，该问题被称为分类问题（classification problem）。分类问题是指输出变量为类别的问题，例如“红色”、“蓝色”或“恶性肿瘤”或“良性肿瘤”等。\n\
  \n而当我们尝试预测诸如“价格”、“重量”等数值型变量时，该问题属于回归（regression）的范畴。\n\n### 注意\n监督机器学习的好坏取决于用于训练它的数据。如果训练数据的质量很差，预测结果也将无法准确。\n\
  \n我们可以观察到，在分类中，整个问题都围绕着根据训练数据提供的标签、类别或分类信息，为测试数据分配一个标签、类别或分类。由于目标目标是分配类别标签，因此我们将这类问题称为分类问题。图\
  \ 7.2 展示了典型的分类过程，即通过分类器算法从标记的训练数据中获取分类模型。根据该模型，为测试数据分配一个类别标签（例如，图 7.2 中提到的测试数据对应的“Intel”）。\n\
  \n银行领域中一个关键的分类问题是识别潜在的欺诈交易。由于有数百万笔交易需要审查以确定某特定交易是否可能是欺诈交易，任何人类都不可能完成这项任务。机器学习被高效地用于此任务，这是分类的经典案例。根据历史交易数据（特别是标记为欺诈的交易），所有新进入的交易都会被标记或标注为“正常”或“可疑”。可疑交易随后会被隔离以便更仔细的审查。\n\
  \n![images](img/178-1.png)\n\n**图 7.2** 分类模型\n\n总结来说，分类是一种监督学习，它根据训练数据提供的信息，对测试数据预测分类类型的目标特征。该目标类别特征被称为\
  \ `class`。\n\n一些典型的分类问题包括：\n\n* 图像分类\n* 疾病预测\n* 游戏胜负预测\n* 自然灾害（如地震、洪水等）的预测\n* 手写识别：\n\
  \n### 你知道吗？\n* 机器学习拯救生命——它能够比患者确诊至少提前一年发现 52% 的乳腺癌细胞\n* 美国邮政局使用机器学习进行手写识别\n* Facebook\
  \ 的新闻动态使用机器学习为每位成员提供个性化馈送\n\n### 7.4 分类学习步骤\n\n首先，有一个需要解决的问题，然后根据算法对所需数据（与问题相关且已存储在系统中）进行评估和预处理。算法选择是监督学习中的一个关键点。迭代训练轮次后的结果是针对手头问题的分类器（参考图\
  \ 7.3）。\n\n![images](img/179-1.png)\n\n**图 7.3** 分类模型步骤\n\n**问题识别**：识别问题是监督学习模型的第一步。该问题需要是一个良好的问题，即具有明确目标和收益、且具有长远影响的问题。\n\
  \n**所需数据的识别**：根据上述识别的问题，需要识别/评估准确表示所识别问题的数据集。例如：如果问题是预测肿瘤是恶性还是良性，则需要识别与恶性肿瘤和良性肿瘤相关的患者数据集。\n\
  \n**数据预处理**：这涉及数据集的清洗/转换。这一步确保了所有不必要/无关的数据元素被删除。数据预处理是指在将识别出的数据输入算法之前对其应用的转换。由于数据是从不同的来源收集的，通常以原始格式收集，无法立即进行分析。这一步确保数据已准备好输入到机器学习算法。\n\
  \n**训练数据集的定义**：在开始分析之前，用户应该决定使用哪种的数据集作为训练集。例如，在签名分析中，训练数据集可能是单个手写字母、整个手写单词（即字母组）或一整行手写（即句子或一组单词）。因此，还会收集一组“输入元对象”和相应的“输出元对象”。训练集需要能够主动代表给定场景的现实世界用途。因此，通过专家或实验收集一组输入\
  \ `X` 和相应的输出 `Y`。\n\n**算法选择**：这涉及确定函数的结构和相应的学习算法。这是监督学习模型中最关键的步骤。根据各种参数为给定问题选择最佳算法。\n\
  \n**训练**：在上一步中确定的学习算法在训练集上运行以进行进一步微调。某些监督学习算法要求用户确定特定的控制参数（作为算法的输入）。这些参数也可以通过优化训练集的子集（称为验证集）进行调整。\n\
  \n**使用测试数据集进行评估**：在算法上运行数据并衡量性能。如果没有获得合适的结果，可能需要对参数进一步训练。\n\n### 7.5 常见分类算法\n\n\
  让我们深入研究一些常见的分类算法。以下是最常见的分类算法，其中我们已经在第 6 章中学习了朴叶斯分类器。我们将在本章介绍其他算法的细节。\n\n1. `k`-最近邻\
  \ (`k`NN)\n2. 决策树\n3. 随机森林\n4. 支持向量机 (SVM)\n5. 朴叶斯分类器\n\n#### 7.5.1 *k* -最近邻 (`k`NN)\n\
  \n`k`NN 算法是一种简单但强大的分类算法。该算法的名称源于 `k`NN 的底层哲学——即具有相似背景或思想的人倾向于聚集在一起。换句话说，当地的邻居具有类似的背景。同样，作为\
  \ `k`NN 算法的一部分，对于预测问题的未知未标记数据，是根据与未知元素相似的训练数据集元素进行判断的。因此，未知元素的类别标签是根据相似训练数据集元素的类别标签（比喻地可以认为是未知元素的邻居）分配的。让我们通过一个简单的数据集来理解该算法。\n\
  \n### 7.5.1.1 kNN 如何工作\n\n\n\n\n让我们考虑如图 7.4 所示的非常简单的学生数据集。它由一个班级的 15 名学生组成。每个学生在两个性能参数——“能力（Aptitude）”和“沟通（Communication）”上都被赋予\
  \ 10 分制的评分。此外，根据以下标准为每个学生分配了一个类别值：\n\n1. 具有良好沟通能力和高天赋的学生被分类为“领导者”（Leader）\n2. 具有良好沟通能力但天赋水平一般的学生被分类为“演讲者”（Speaker）\n\
  3. 沟通能力一般但高天赋的学生被分类为“智力者”（Intel）\n\n![images](img/181-1.png)\n\n**图 7.4** 学生数据集\n\
  \n正如我们在第 3 章中所看到的，在构建分类模型时，部分标记过的输入数据会被保留作为测试数据。输入数据的其余部分用于训练模型——因此被称为训练数据。保留部分数据作为测试数据的动机是为了评估模型的性能。正如我们所见，分类模型的性能取决于模型应用于未知数据集时所做的正确分类的数量。然而，在模型测试期间，无法得知未知数据的实际标签值。因此，作为标记输入数据一部分的测试数据被用于此目的。如果大多数测试数据预测出的类别值与其实际值匹配，则说明该分类模型具有良好的准确性。在学生数据范围内，为了保持简单，我们假设数据集中的一个元素作为测试数据。如图\
  \ 7.5 所示，名为 Josh 的记录被假设为测试数据。现在我们确定了训练数据和测试数据，可以开始建模。\n\n正如我们已经讨论过的，在 kNN 算法中，测试数据的类别标签是由邻近（即性质相似）的训练数据标签决定的。但存在两个挑战：\n\
  \n1. 两个元素相似的依据是什么？\n2. 决定每个测试数据的类别标签应该考虑多少个相似元素？\n\n对于第一个问题，尽管有很多相似性的衡量方法，但 kNN\
  \ 衡量两个元素之间相似性的常用方法是欧氏距离。考虑具有两个特征（假设为 `f[1]` 和 `f[2]`）的简单数据集，两个数据元素 `d[1]` 和 `d[2]`\
  \ 之间的欧氏距离可以通过测量：\n\n![images](img/183-1.png)\n\n其中 `f[11]` = 数据元素 `d[1]` 的特征 `f[1]`\n\
  `f[12]` = 数据元素 `d[2]` 的特征 `f[1]`\n`f[21]` = 数据元素 `d[1]` 的特征 `f[2]`\n`f[22]` = 数据元素\
  \ `d[2]` 的特征 `f[2]`\n\n![images](img/182-1.png)\n\n**图 7.5** 分类学生数据集\n\n因此，如图 7.6\
  \ 所示，仅考虑“能力”和“沟通”特征的学生数据集训练数据点可以表示为二维空间中的点。如图所示，具有相同类别值的训练数据点彼此靠近。考虑二维空间的原因是我们在进行分类时仅考虑学生数据集的两个特征。“名称”特征被忽略了，因为我们可以理解它在决定类别值时没有发挥作用。学生\
  \ Josh 的测试数据点在同一空间中表示为星号。为了找到测试数据点的最近邻，需要计算星号与不同点之间的欧氏距离。然后，最近邻的类别值有助于分配测试数据的类别值。\n\
  \n![images](img/183-2.png)\n\n**图 7.6** 学生数据集的二维表示\n\n现在让我们尝试找到第二个问题的答案，即应该考虑多少个相似元素。答案取决于\
  \ `k` 的值，它是作为算法输入的用户定义参数。在 kNN 算法中，`k` 值表示需要考虑的邻居数量。例如，如果 `k` 为 3，则只考虑距离测试元素最近的三个邻居或三个训练数据元素。在这三个元素中，占多数的类别被视为分配给测试数据的标签。如果\
  \ `k` 为 1，则只考虑最近的训练数据元素。该元素的类别标签直接分配给测试元素。这如图 7.7 所示。\n\n![images](img/184-1.png)\n\
  \n**图 7.7** 测试点与训练点之间的距离计算\n\n现在让我们尝试找到我们学生数据集的算法结果。换句话，我们看看 kNN 会为 Josh 的测试数据分配什么类别值。再次回到图\
  \ 7.7。显而易见，当 `k` 取值为 1 时，只需要考虑一个训练数据点。学生 Gouri 的训练记录距离 Josh 的测试记录最近，距离值为 1.118。Gouri\
  \ 的类别值为“Intel”。因此，测试数据点也被分配了类别标签“Intel”。当 `k` 值假设为 3 时，Josh 在训练数据集中的最近邻居是 Gouri、Susant\
  \ 和 Bobby，距离分别为 1.118、1.414 和 1.5。Gouri 和 Bobby 的类别值为“Intel”，而 Susant 的类别值为“Leader”。在这种情况下，Josh\
  \ 的类别值通过多数投票决定。因为“Intel”类别值是由大多数邻居形成的，所以 Josh 的类别值被分配为“Intel”。同样的过程可以扩展到任何 `k` 值。\n\
  \n但决定 `k` 的值往往是一个棘手的决策。其原因如下：\n\n* 如果 `k` 值很大（在极端情况下等于训练数据中的总记录数），无论距离测试数据的邻居的标签如何，训练数据集多数类别的标签都将被分配给测试数据。\n\
  * 如果 `k` 值很小（在极端情况下等于 1），训练数据集中距离测试数据最近的噪声或离群点的类别值将被分配给测试数据。\n\n最佳的 `k` 值位于这两个极端之间。\n\
  \n机器学习从业者采用以下得出的策略来确定 `k` 值：\n\n* 一种常见的做法是将 `k` 设置为训练记录数的平方根。\n* 另一种方法是在各种测试数据集上测试多个\
  \ `k` 值，并选择性能最好的一个。\n* 另一种有趣的方法是选择较大的 `k` 值，但应用加权投票过程，其中近邻的投票比远邻的投票具有更大的影响力。\n\n\
  ### 7.5.1.2 kNN 算法\n\n**输入：** 训练数据集、测试数据集（或数据点）、`k` 值（即需要考虑的邻居数量）\n\n**步骤：**\n\n\
  **对于所有**测试数据点\n\n计算测试点到不同训练数据点的距离（通常是欧氏距离）。\n\n找到最近的 `k` 个训练数据点，即距离测试数据点最近的训练数据点。\n\
  \n```\nif k = 1\n```\n\n\n\n\n\n**那么**将训练数据点的类标签分配给测试数据点\n\n**否则**\n\n将训练数据点中占主导地位的类标签分配给测试数据点\n\
  \n**结束循环**\n\n### 7.5.1.3 为什么 kNN 算法被称为懒惰学习者（Lazy Learner）？\n\n我们已经在第 3 章中讨论过，急进学习者遵循机器学习的一般步骤，即对从输入数据中获得的信息进行抽象，然后通过泛化步骤进行后续。然而，正如我们在\
  \ `kNN` 算法案例中所看到的，这些步骤被完全跳过了。它存储训练数据，并直接应用最近邻域查找策略来实现分类。因此，对于 `k`NN 来说，真正意义上并没有发生学习。因此，`k`NN\
  \ 属于懒惰学习者的范畴。\n\n### 7.5.1.4 kNN 算法的优点\n\n*   算法极其简单——易于理解\n*   在某些情况下非常有效，例如用于推荐系统设计\n\
  *   训练阶段非常快，或几乎不需要时间\n\n### 7.5.1.5 kNN 算法的缺点\n\n*   从真正意义上没有学习到任何东西。分类完全基于训练数据完成。因此，它对训练数据有严重的依赖。如果训练数据不能全面代表问题领域，该算法将无法进行有效的分类。\n\
  *   由于没有从真正意义上训练模型，且分类完全基于训练数据完成，因此分类过程非常缓慢。\n*   此外，需要大量的计算空间来加载训练数据进行分类。\n\n###\
  \ 7.5.1.6 kNN 算法的应用\n\n机器学习中 `kNN` 算法被广泛采用的热门领域之一是推荐系统。众所周知，推荐系统向用户推荐与其用户喜欢的特定项目相似的不同项目。喜好模式可以从过去的购买或浏览历史中发现，并使用\
  \ `kNN` 算法识别相似项目。\n\n另一个广泛采用 `kNN` 的领域是搜索与给定文档/内容相似的文档/内容。这是信息检索的一个核心领域，被称为概念搜索。\n\
  \n### 7.5.2 决策树\n\n决策树学习是应用最广泛分类算法之一。正如名称所示，它以树结构的形式构建模型。它的分组精确性侧重于不同的策略，并且效率极高。\n\
  \n决策树用于具有多个类别的多维分析。其特点是执行速度快，规则易于解释。决策树学习的目标是创建一个模型（基于过去的数据称为过去向量），根据特征向量中的输入变量来预测输出变量的值。\n\
  \n决策树的每个节点（或决策节点）对应于特征向量中的一个。从每个节点都有指向子节点的边，其中与节点相关的特征的每个可能值（或值范围）都有对应的边。树在不同的叶节点（或终端节点）处终止，每个叶节点代表输出变量的一个可能值。输出变量通过遵循路径确定。\n\
  \n### 7.5.2.1 构建决策树\n\n决策树根据训练数据按照一种称为递归划分的方法构建。如图 7.8 所示，决策树由：\n\n*   根节点\n*  \
  \ 分支节点\n*   叶节点\n\n通常的停止标准是：\n\n1. 特定节点的所有或大多数示例具有同一类\n2. 所有特征都已使用\n3. 树已增长到预定义的阈值限制\n\
  \n\n\n\n\n通过使用图 7.11 所示的决策树，我们需要根据给定的参数值`CGPA = High`、`Communication = Bad`、`Aptitude\
  \ = High`、`Programming skills = Bad`预测 Chandra 是否可能获得录取。有多种方法搜索训练后的决策树以找到给定预测问题的解决方案。\n\
  \n### 穷举搜索 (Exhaustive search)\n\n1. 将项放在第一组（类）中。递归检查项在第一组（类）中的解决方案。\n2. 将项放在第二组（类）中。递归检查项在第二组（类）中的解决方案。\n\
  3. 重复上述步骤直到找到解决方案。\n\n穷举搜索遍历整个决策树，但当决策树具有多个叶子节点和多个属性值时，将花费大量时间。\n\n### 分支限界 (Branch\
  \ and bound search)\n\n分支限界利用现有的最佳解来避免对整个决策树进行完全搜索。当算法开始时，最佳解被定义为最坏的值；因此，找到的任何解都是改进。这使得算法最初会沿着树的最左侧分支运行，尽管这不太可能产生实际结果。在划分问题中，该解决方案对应于将每个项放在一组，这是一个不可接受的解决方案。程序可以使用快速的启发式方法找到初始解，以加速这一过程。这可以作为分支限界的输入。如果启发式方法是正确的，节省将是巨大的。\n\
  \n![images](img/191-1.png)\n\n**图 7.12** 基于训练数据的决策树（展示了示例路径）\n\n图 7.12 描述了条件 `CGPA\
  \ = High`、`Communication = Bad`、`Aptitude = High` 和 `Programming skills = Bad` 的示例路径（粗线）。根据上述决策树，预测结果为\
  \ Chandra **将获得录取**。\n\n决策树有许多实现方式，最著名的是 C5.0、`CART`（分类与回归树）、`CHAID`（卡方自动交互检测器）和\
  \ `ID3`（迭代二分法 3）算法。决策树算法最大的挑战是确定根据哪个特征进行划分。识别特征的主要驱动因素是数据应该这样划分，使得划分创建的各个区域包含属于单一类的示例。如果发生这种情况，这些区域被认为是**纯的**。熵是许多算法（如\
  \ `ID3` 和 `C5.0`）采用的属性或特征的不纯度度量。信息增益基于数据集根据特定属性（`A`）划分后熵（`S`）的减少量。构建决策树的核心在于找到返回最高信息增益的属性（即最同性的分支）。\n\
  \n#### 注意：\n\n与信息增益类似，还有其他指标如基尼指数或卡方检验，用于单个节点以决定在哪个特征的基础上进行应用划分。`CART` 算法使用基尼指数，而\
  \ `CHAID` 算法使用卡方检验来决定应用划分的特征。\n\n### 7.5.2.3 决策树的熵\n\n假设 `S` 是训练示例的样本集。那么，衡量 `S`\
  \ 不纯度的 `Entropy(S)` 定义为：\n\n![images](img/191-2.png)\n\n其中 `c` 是不同类标签的数量，`p` 指属于第\
  \ `i` 个类标签值的比例。\n\n例如，对于图 7.10 中的训练数据，目标类“Job Offered?”有两个取值：Yes（是）和 No（否）。类值“Yes”的\
  \ `p[i]` 值为 0.44（即 8/18），类值“No”的值为 0.56（即 10/18）。因此，我们可以这样计算熵：\n\n`Entropy(S) =\
  \ -0.44 log 2 - 0.56 log 2 = 0.99.`\n\n### 7.5.2.4 决策树的信息增益\n\n信息增益基于数据集根据特定属性（`A`）划分后熵（`S`）的减少而产生。构建决策树的核心在于找到返回最高信息增益的属性（即最同性的分支）。如果信息增益为\
  \ 0，意味着根据该特定特征划分数据集时熵没有减少。另一方面，可能发生最大信息增益是数据集划分前的熵。\n\n特定特征 `A` 的信息增益通过划分前熵（或 `S[bs]`）与划分后熵（`S[as]`）之差计算得出。\n\
  \n`Information Gain(S, A) = Entropy(S[bs]) - Entropy(S[as])`\n\n为了计算划分后的熵，需要考虑所有划分的熵。然后，可以将每个划分的熵加权求和作为划分后的总熵。为了进行加权求和，使用进入每个划分的示例比例作为权重。\n\
  \n![images](img/192-1.png)\n\n让我们检查图 7.10 中训练数据的信息增益值。我们将找到划分前的熵值，然后是所有划分后的熵：\n\n\
  1. 使用 `CGPA` 划分\n2. 使用 `Communication` 划分\n3. 使用 `Aptitude` 划分\n4. 使用 `Programming\
  \ skills` 划分\n\n图 7.13a 给出了第一层的熵值。根据计算，划分前的熵（即 `S[bs]`）为 0.99，而划分后的熵（即 `S[as]`）为：\n\
  \n- 使用 `CGPA` 划分时为 0.69\n- 使用 `Communication` 划分时为 0.63\n- 使用 `Aptitude` 划分时为 0.52\n\
  - 使用 `Programming skill` 划分时为 0.95\n\n![images](img/193-1.png)\n\n**图 7.13A** 熵与信息增益计算（第一层）\n\
  \n因此，特征 `CGPA` 的信息增益为 0.99－0.69 = 0.3，而特征 `Communication` 的信息增益为 0.99－0.63 = 0.36。同样，`Aptitude`\
  \ 和 `Programming skills` 的信息增益分别为 0.47 和 0.04。\n\n因此，很显然在所有特征中，采用 `Aptitude` 返回的信息增益最高。因此，在第一层，将根据\
  \ `Aptitude` 的值进行划分，或者说 `Aptitude` 将成为决策树的第一个节点。这里需要注意的一点是，对于 **Aptitude = Low**，熵为\
  \ 0，这意味着无论其他特征值如何，结果总是相同的。因此，指向 Aptitude = Low 的分支将不再继续。\n\n作为第二层的一部分，在这种情况下我们只有一条分支需要导航——即\
  \ **Aptitude = High** 的分支。图 7.13b 展示了第二层的计算。从图中所示，熵值如下：\n\n- 划分前为 0.85\n- 使用 `CGPA`\
  \ 划分时为 0.33\n- 使用 `Communication` 划分时为 0.30\n- 使用 `Programming skill` 划分时为 0.80\n\
  \n\n\n\n因此，使用 `CGPA`、`Communication` 和 `Programming Skill` 特征进行划分后的信息增益分别为 0.52、0.55\
  \ 和 0.05。因此，应该使用特征 `Communication` 进行此项划分，因为它产生了最高的信息增益。所以，在第二层，将根据 `Communication`\
  \ 的值进行划分。再次，需要注意的一点是，对于 `Communication = Good`，熵为 0，这意味着无论其他特征的值如何，结果将始终是相同的。因此，通向\
  \ `Communication = Good` 的分支将不再继续向下。\n\n![images](img/194-1.png)![images](img/195-1.png)\n\
  \n**图 7.13B** 熵和信息增益计算（第 2 层）\n\n作为第 3 层的一部分，在这种情况下我们只有一个分支需要导航——即 `Communication\
  \ = Bad` 的分支。图 7.13c 展示了第 3 层的计算。从图中所示，熵值如下：\n\n*   划分前为 0.81\n*   使用特征 `CGPA` 划分时为\
  \ 0\n*   使用特征 `Programming Skill` 划分时为 0.50\n\n![images](img/196-1.png)\n\n**图 7.13C**\
  \ 熵和信息增益计算（第 3 层）\n\n因此，使用特征 `CGPA` 划分后的信息增益为 0.81，这是可能的信息增益（因为划分前的熵为 0.81）。因此，显而易见，将根据\
  \ `CGPA` 的值进行划分。由于已经实现了最大信息增益，树将不再继续生长。\n\n### 7.5.2.5 决策树算法\n\n**输入：** 训练数据集，测试数据集（或数据点）\n\
  \n**步骤：**\n\n**对所有**属性执行以下操作：\n\n计算属性 `F[i]` 的熵 `E[i]`\n\n**如果** `E[i]` < `E[min]`\n\
  \  则 `E[min]` = `E[i]` 且 `F[min]` = `F[i]`\n**结束如果**\n\n**结束循环**\n\n使用属性 `F[min]`\
  \ 将数据集划分为子集\n\n绘制包含属性 `F[min]` 的决策树节点，并将数据集划分为子集\n\n重复上述步骤，直到画出覆盖原始表中所有属性的完整树。\n\
  \n### 7.5.2.6 避免决策树的过拟合 – 剪枝\n\n决策树算法除非应用停止准则，否则可能会无限增长——对每个特征进行划分并将其划分为更小的分区，直到数据被完美分类。这显而易见会导致过拟合问题。为了防止决策树对训练数据产生过拟合，对决策树进行剪枝至关重要。剪枝决策树可以缩小树的大小，使模型更具泛化性，并更好地分类未知和未标记的数据。\n\
  \n剪枝有两种方法：\n\n*   预剪枝（Pre-pruning）：在树达到完美之前停止生长。\n*   后剪枝（Post-pruning）：允许树完全生长，然后从中剪掉一些分支。\n\
  \n在预剪枝的情况下，树树一旦达到一定数量的决策节点或决策就会停止进一步生长。因此，在这种策略中，算法既避免了过拟合，又优化了计算成本。然而，它也有可能忽略被跳过的特征所贡献的重要信息，从而导致遗漏数据中的某些模式。\n\
  \n另一方面，在后剪枝的情况下，允许树生长到最大。然后通过使用某些剪枝准则（例如节点处的错误率）减小树的大小。在分类准确性方面，这是一种更有效的方法因为它因为它了从训练数据中获得的所有细节信息。然而，其计算成本高于预剪枝。\n\
  \n### 7.5.2.7 决策树的优点\n\n*   它产生了非常简单易懂的规则。对于较小的树，理解该模型不需要大量的数学和计算知识。\n*   适用于大多数问题。\n\
  *   它可以同时处理数值型和分类型变量。\n*   对于大小不同的训练数据集都能良好工作。\n*   决策树为哪些特征对分类更有用提供了明确的线索。\n\n\
  ### 7.5.2.8 决策树的缺点\n\n*   决策树模型通常倾向于具有更多可能值（即层级更多）的特征。\n*   该模型很容易发生过拟合或欠拟合。\n*\
  \   在类别较多且训练样本较少的分类问题中，决策树容易出现错误。\n*   训练决策树的计算开销可能很大。\n*   大型树难以理解。\n\n### 7.5.2.9\
  \ 决策树的应用\n\n决策树可以应用于具有有限属性列表的数据集，每个数据实例都存储该属性的值（例如，属性 `CGPA` 的值为“高”）。当每个属性只有少数几个不同的值时（例如“高”、“中”、“低”），决策树建议（或选择）一个有效解决方案会更得而易举/更快速。该算法可以扩展扩展以处理实值属性（例如浮点数温度）。\n\
  \n当一个属性只有两个值时，情况最简单。例如：`Communication` 只有两个值“好”或“坏”。扩展决策树以创建具有两个以上值的函数也很容易。例如：`CGPA`\
  \ 取“高”、“中”、“低”之一的值。本质是离散的。\n\n#### **思考点**\n\n平衡决策树的过拟合和欠拟合是一个非常微妙的话题，更多是艺术而非科学。掌握这门艺术的方法是处理更多数据集的经验。\n\
  \n\n\n\n3. 继续拆分节点为子节点，直到树生长到最大可能的程度。\n\n4. 以“有放回”的方式选择不同的训练数据子集，按照步骤 (1) 到 (3) 训练另一棵决策树。重复此过程以构建并训练\
  \ `n` 棵决策树。\n\n5. 最终的类别分配基于 `n` 棵树的多数投票结果。\n\n### 思考点\n\n在随机森林分类器中，如果假设树的数量过大，模型可能会过拟合。在过拟合的极端情况下，模型可能会模仿训练数据，训练误差可能几乎为\
  \ 0。然而，当模型在未见过的样本上运行时，可能会导致非常高的验证误差。\n\n### 7.5.3.2 随机森林中的袋外 (OOB) 误差\n\n在随机森林中，我们已经看到每棵树都是使用来自原始数据的不同自助采样（bootstrap\
  \ sample）构建的。在自助采样中排除且未用于构建第 i 棵树的样本可以用于衡量模型的性能。在运行结束时，对每次评估的每个此类样本的预测结果进行统计，并通过投票获得该样本的最终预测。此类样本预测的总误差率被称为袋外\
  \ (OOB) 误差率。\n\n混淆矩阵中显示的误差反映了 OOB 误差率。由于这个原因，显示的误差率往往异常地高。\n\n### 7.5.3.3 随机森林的优点\n\
  \n* 它在大型且广泛的数据集上运行效率高。\n* 它具有稳健的缺失数据估计方法，并在数据大比例缺失时仍能保持精度。\n* 它拥有强大的技术来平衡不平衡数据集中类别群体中的误差。\n\
  * 它对整体分类中哪些特征是最重要的特征提供估计（或评估）。\n* 随着森林的生成，它会生成泛化误差的内部无偏估计（测量）。\n* 生成的森林可以保存以供未来在其他数据上。\n\
  * 最后，随机森林算法可以同时解决分类和回归问题。\n\n### 7.5.3.4 随机森林的缺点\n\n* 该模型由于结合了许多决策树模型，因此不像决策树模型那样容易理解。\n\
  * 它的计算开销比决策树等简单模型大得多。\n\n### 7.5.3.5 随机森林的应用\n\n随机森林是一种非常强大的分类器，它将许多决策树模型的多功能性整合到一个单一模型中。由于其卓越的结果，这种集成模型正在机器学习实践者中被广泛采用和欢迎，用于解决广泛的分类问题。\n\
  \n### 7.5.4 支持向量机\n\nSVM 是一种既可以线性分类也可以进行回归的模型。SVM 基于“表面”的概念，称为超平面（hyperplane），它在多维特征空间中绘制的图数据实例之间画出一条边界。SVM\
  \ 的输出预测是训练数据中已经定义的两个可能类别之一。总而言之，SVM 算法构建了一个 N 维超平面模型，将未来的实例分配到两个可能的输出类别之一。\n\n###\
  \ 7.5.4.1 使用超平面进行分类\n\n在 SVM 中，构建一个模型来区分属于不同类别的数据实例。为了 sake 简单起见，我们假设数据实例是线性可分的。在这种情况下，当映射到二维空间时，属于不同类别的数据实例将落在二维空间中画出的直线的两侧，如图\
  \ 7.15a 所示。如果将相同的概念扩展到多维特征空间，划分不同类别数据实例的直线将转换为超平面，如图 7.15b 所示。\n\n因此，SVM 模型将输入实例表示为特征空间中的点，通过映射，使得它们之间明显的间隙划分了各个分离类别的实例。换句话说，SVM\
  \ 分析的目标是找到一个平面，或者说是一个超平面，根据它们的类别分离实例。然后将新示例（即新实例）映射到该同一个空间中，并根据新实例落在间隙的哪一侧预测其属于哪一类。总而言之，在整个训练过程中，SVM\
  \ 算法分析输入数据并识别多维特征空间中的一个称为超平面的表面。可能存在许多可能的超平面，SVM 模型的挑战之一就是找到最优超平面。\n\n![images](img/202-1.png)\n\
  \n**图 7.15** 线性可分的数据实例\n\n具有显著分组外围的训练数据集与 SVM 配合效果会良好。从 SVM 的角度来看，泛化误差是衡量该 SVM 模型能多准确、精细地预测之前未见数据（新数据）值的标准。SVM\
  \ 的硬间隔（hard margin）意味着 SVM 模型在分类上是不灵活的，并试图在训练集上工作得异常拟合，从而导致过拟合。\n\n**支持向量：** 支持向量是数据点（代表类别），它们是数据集中关键的组件，位于已确定的线集合（超平面）附近。如果移除支持向量，它们将改变划分超平面的位置。\n\
  \n**超平面和间隔：** 对于 `N`-维特征空间，超平面是维度为 (`N-1`) 的平坦子空间，用于用于分离和分类一组数据。例如，如果我们考虑二维特征空间（这只是一个具有两个特征和一个类别变量的数据集），超平面就是一维子空间或直线。同样，对于三维特征空间（具有三个特征和一个类别变量的数据集），超平面是二维子空间或平面。然而，可以理解，很难可视化大于三维的特征空间。\n\
  \n从数学上讲，在二维空间中，超平面可以通过方程定义为：\n\n`c[0] + c[1]X[1] + c[2]X[2] = 0`\n\n这也就是直线的方程。将此概念扩展到\
  \ `N`-维空间，超平面可以通过方程定义为：\n\n`c[0] + c[1]X[1] + c[2]X[2] + … + c[N]X[N] = 0`\n\n简而言之，可以表示如下：\n\
  \n![images](img/202-2.png)\n\n自显然，数据点离超平面越远（距离越大），我们对正确分类的把握就越大。因此，当添加新的测试数据点/数据集时，它所在的超平面侧将决定我们分配给它的类别。超平面与数据点之间的距离被称为**间隔**（margin）。\n\
  \n### 7.5.4.2 在 SVM 中识别正确的超平面\n\n正如我们已经讨论过的，划分数据实例到不同类别的超平面可能有多种。我们需要识别哪一个能产生最好的分类结果。在得出结论之前，让我们检查几种场景。为了可视化方便，大多数图中的超平面显示为直线。\n\
  \n#### 场景 1\n\n如图 7.16 所示，在这种场景中，我们有三个超平面：A、B 和 C。现在，我们需要识别出更好地分离三角形和圆形所代表的两个类别的正确超平面。正如我们看到的，超平面‘A’很好地完成了这项任务。\n\
  \n![images](img/203-1.png)\n\n**图 7.16** 支持向量机：场景 1\n\n#### 场景 2\n\n\n\n\n\n如图 7.17\
  \ 所示，我们有三个超平面：A、B 和 C。我们必须识别出以最佳方式分类三角形和圆形的正确超平面。在这里，最大化两类最近数据点与超平面之间的距离有助于我们决定正确的超平面。这个距离被称为`margin`（间隔）。\n\
  \n在图 7.17b 中，你可以看到超平面 A 的间隔相对于 B 和 C 都要高。因此，超平面 A 是正确的超平面。选择具有更高间隔（距离）的超平面的另一个快速原因是鲁棒性。如果我们选择一个间隔（距离）较小的超平面，那么分类错误的概率就会很高。\n\
  \n![images](img/204-1.png)\n\n**图 7.17** 支持向量机：场景 2\n\n### 场景 3\n\n使用上一节讨论的规则来识别图\
  \ 7.18 所示场景中的正确超平面。你们中可能有人选择了超平面 B，因为它具有间隔（到类别的距离）比 A 大。但这里的问题在于：SVM 在最大化间隔之前，会选择能够准确分类类别的超平面。在这里，超平面\
  \ B 有分类错误，而 A 正确分类了所有数据实例。因此，A 是正确的超平面。\n\n![images](img/204-2.png)\n\n**图 7.18**\
  \ 支持向量机：场景 3\n\n### 场景 4\n\n在这种场景中，如图 7.19a 所示，无法使用直线来明确区分这两个类，因为属于其中一类（三角形）的一个数据实例作为离群点位于另一类（圆形）的范围内。\n\
  \n另一端的三角形就像是三角形类的的一个离群点。SVM 具有忽略离群点并找到具有最大间隔超平面的功能（如图 7.19b\n\n**图 7.19** 支持向量机：场景\
  \ 4\n\n因此，通过总结不同场景的观察结果，我们可以说：\n\n1. 超平面应该以最佳方式隔离属于两个类的数据实例。\n2. 它应该最大化两类最近数据点之间的距离，即最大化间隔（margin）。\n\
  3. 如果需要在高间隔和更少分类错误之间权衡优先级，超平面应该尝试减少分类错误。\n\n我们的下一个重点是找到一种识别能够最大化间隔超平面的方法。\n\n###\
  \ 7.5.4.3 最大间隔超平面\n\n寻找最大间隔超平面（MMH）无非是识别与两类数据实例具有最大分离度的超平面。虽然任何三个超平面集合都可以完成正确分类，但我们为什么需要寻找引起最大分离的超平面呢？\n\
  \n![images](img/205-2.png)\n\n**图 7.20** 支持向量\n\n`support vectors`（支持向量）是距离超平面最近的数据实例。如图\
  \ 7.20 所示，这些是定义超平面的数据点。事实上，只需要支持向量就能确定超平面，这降低了计算复杂度。\n\n### 线性数据的 MMH 识别\n\n![images](img/206-1.png)\n\
  \n**图 7.21** 为线性数据绘制 MMH\n\n正如我们之前所看到的，目标是最小化代价：\n\n![images](img/206-2.png)\n\n\
  ![images](img/206-3.png)\n\n![images](img/206-4.png)\n\n### 非线性可分数据的 MMH 识别\n\n\
  ![images](img/206-5.png)\n\n![images](img/207-1.png)\n\n**图 7.22** 为非线性可分数据绘制 MMH\n\
  \n成本值由以下公式决定：\n\n![images](img/207-2.png)\n\n### 7.5.4.4 核技巧\n\n正如我们在上一节中看到的，处理非线性可分数据的方法是使用松弛变量和优化函数来最小化成本。然而，这并不是使用\
  \ SVM 解决机器学习问题的唯一方法。SVM 拥有一种名为`kernel trick`（核技巧）的技术来处理非线性可分数据。如图 7.23 所示，这些可以将低维输入空间转换到高维空间的函数。在在此过程中，它将线性不可分的数据转换为线性可分的数据。这些函数被称为\
  \ `kernels`（核）。\n\n![images](img/208-1.png)\n\n**图 7.23** SVM 中的核技巧\n\n\n\n\n\n\
  *   `SVM` 仅适用于二分类，即当问题领域中只有两个类时。\n*   `SVM` 模型非常复杂——在处理高维数据集时，几乎像一个黑箱。因此，在这些情况下，理解该模型非常困难，几乎是不可能的。\n\
  *   对于大型数据集（即具有大量特征或大量实例的数据集），它的运行速度很慢。\n*   它非常消耗内存。\n\n### 7.5.4.7 SVM 的应用\n\n\
  `SVM` 在用于二分类时最有效，即解决具有两个类别的机器学习问题。`SVM` 可以应用的一个常见问题是生物信息学领域——具体来说，是检测癌症和其他遗传性疾病。它还可以用于通过将图像二分类为人脸部分和非人脸部分，来检测人脸图像。还可以描述更多此类应用。\n\
  \n## 7.6 总结\n\n1. 分类的目标是根据相似对象的先验类别相关信息，预测未知对象的类别。当已知如何对给定数据进行分类，或者换句话说数据实例的类别值可用时，可以使用这种学习。\n\
  2. 银行业背景下的一个关键分类问题是识别潜在的欺诈交易。由于有数百万笔交易需要审查以识别某笔特定交易是否可能是欺诈交易，任何人类都不可能完成任务。\n3. 常见的分类算法有\
  \ `k`NN、决策树、随机森林、`SVM` 和朴素贝叶（Naïve Bayes）。\n4. `k`NN 算法是机器学习算法中最好且简单之一。新实例通过其邻居的多数投票进行分类，该实例被分配为其\
  \ `k`NN 中占多数地位的类别。\n5. 决策树学习是最广泛利用的分类器。它的特点是执行时间快，规则易于解释。\n6. 决策树算法需要找到产生最大信息增益的属性划分。对于训练样本\
  \ `S`，熵衡量了 `S` 的不纯。\n\n   ![images](img/209-1.png)\n\n   其中 `c` 是不同类别标签的数量，`p` 指落入第\
  \ `i` 个类别标签值的比例。\n7. 信息增益是根据特定属性 (`A`) 对数据集进行划分后熵 (`S`) 的减少而产生的。对于特定特征 `A` 的信息增益通过划分前熵\
  \ (`S[bs]`) 与划分后熵 (`S[as]`) 之间的差异计算。\n\n   `Information Gain (S, A) = Entropy (S[bs])\
  \ - Entropy (S[as])`\n\n8. 随机森林是一种集成分类器（组合分类器），它使用并结合了许多决策树模型。集成模型的结果通常比单个模型的结果更好。\n\
  9. `SVM` 是一种二线性分类器。`SVM` 的输出预测是训练数据定义的两个可能类别之一。`SVM` 也是线性分类器和最大间隔分类器的示例。\n10. `SVM`\
  \ 有一种名为核技巧（kernel trick）的新技术。这些函数接收一个低维空间并将其转换为高维空间。\n\n##### 多选题\n\n1. `SVM` 仅适用于二分类，即当问题领域中只有两个类时。\n\
  2. `SVM` 模型非常复杂——在处理高维数据集时，几乎像一个黑箱。因此，在这些情况下，理解该模型非常困难，几乎是不可能的。\n3. 对于大型数据集（即具有大量特征或大量实例的数据集），它的运行速度很慢。\n\
  4. 它非常消耗内存。\n5. `SVM` 在用于二分类时最有效，即解决具有两个类别的机器学习问题。`SVM` 可以应用的一个常见问题是生物信息学领域——具体来说，是检测癌症和其他遗传性疾病。它还可以用于通过将图像二分类为人脸部分和非人脸部分，来检测人脸图像。还可以描述更多此类应用。\n\
