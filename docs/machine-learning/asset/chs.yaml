  \ B.3.1 留出（Holdout）\n\n在开始建模之前的第一步（如果是监督学习），是加载输入数据，留出部分输入数据作为测试数据，将其部分作为训练数据以构建模型。以下是实现此操作的标准方法。Scikit-learn\
  \ 提供了一个函数将输入数据集划分为训练集和测试集。\n\n```python\nimport pandas as pd\ndata = pd.read_csv(\"\
  btissue.csv\")\nfrom sklearn.model_selection import train_test_split\ndata.shape\n\
  (106, 10)\ndata_train, data_test = train_test_split(data, test_size = 0.3, random_state\
  \ = 123) # 参数 test_size 将测试数据与输入数据的比例设为 0.3 或 30%，random_state 设置随机数生成器的种子\nlen(data_train)\n\
  74\nlen(data_test)\n32\n```\n\n#### 注意：\n\n当我们进行数据留出时（即把输入数据划分为训练集和测试集），每个集合所选的记录是随机抽取的。因此，显而易见，执行相同的代码可能会导致不同的训练集。因此，训练出的模型也会有所不同。在\
  \ Python Scikit 函数 `train_test_split` 中，参数 `random_state` 设置了内部用于选取记录的随机数生成器的起点。这确保了每次都使用特定序列的随机数，因此每次都会选取相同的记录（即具有相同序列号的记录），并以相同的方式训练模型。这对于结果的可重复性至关重要，即每次运行同一个机器学习程序都会生成同一组结果。\n\
  \n### B.3.2 K 折交叉验证\n\n让我们进行 10 折的 K 折交叉验证。创建交叉验证有两种方法。可以使用 `sklearn.cross_validation`\
  \ 或 `sklearn.model_selection` 中的 `KFold` 函数，使用方法所示：\n\n```python\nimport pandas\
  \ as pd\ndata = pd.read_csv(\"auto-mpg.csv\")\n```\n\n#### 方案 1\n\n```python\nfrom\
  \ sklearn.cross_validation import KFold\nkf = KFold(data.shape[0], n_folds=10, random_state=123)\n\
  for train_index, test_index in kf:\n    data_train = data.iloc[train_index]\n  \
  \  data_test = data.iloc[test_index]\n```\n\n#### 方案 2\n\n```python\nfrom sklearn.model_selection\
  \ import KFold\nkf = KFold(n_splits=10)\nfor train, test in kf.split(data):\n  \
  \  data_train = data.iloc[train_index]\n    data_test = data.iloc[test_index]\n\
  ```\n\n### B.3.3 自举采样（Bootstrap sampling）\n\n正如第 3 节所示，自举采样用于从数据生成样本。在 Python 中，`sklearn.utils`\
  \ 的 `resample` 函数可以实现这一点。\n\n```python\nimport pandas as pd\nfrom sklearn.utils\
  \ import resample\ndata = pd.read_csv(\"btissue.csv\")\nX = data.iloc[:,0:9]\n![images](img/375-1.png)\n\
