  17. 讨论随机森林中的 OOB 误差和变量重要性。\n\n## 第 8 章\n\n## 监督学习：回归\n\n## 8.1 引言\n\n#### **本章目标**\n\
  \n在最后两个章节中，你已经对用于类别数据预测的监督学习算法有了非常好的概念概述。你详细了解了机器学习从业者用于解决各种类别变量预测问题的流行分类模型。\n\n\
  在本章中，我们将构建数值变量预测的概念——这是监督学习的另一个关键领域。该领域被称为回归，专注于解决诸如房地产价值预测、零售需求预测、天气预报等问题。\n\n\
  首先，你将接触最流行且最简单的算法，即简单线性回归。该模型源于拟合直线和最小二乘法的统计概念。我们将详细探讨该算法。在相同语境下，我们还将探索多元线性回归的概念。\n\
  \n随后，我们将简要介绍其他重要的回归算法，即多变量适应回归条、逻辑回归和极大似然估计。\n\n在本章结束时，你将获得监督学习各方面的充分知识，并准备好独立解决问题。\n\
  \n## 8.2 回归示例\n\n我们多次提到过，房地产价格预测是一个可以通过监督学习解决的问题，具体来说是通过回归来解决。那么，这个问题到底是什么？让我们深入探讨这个问题。\n\
  \n\n\n\n\n新城是该国商业活动的主要枢纽。在过去的几十年，随着全球化的不断加强，新城的商业活动变得日益激烈。与此同时，大量的人来到这座城市并定居，梦想着在生活中实现职业成长。作为一个显而易见的副作用，该城市的每个角落都启动了大量的住房项目。但对公寓的需求仍然超过了供应。为了从房地产行业的繁荣中获益，Karen\
  \ 成立了一家数字市场代理机构，买卖房地产（包括公寓、独立住宅、镇屋等）。最初，当业务规模较小时，她会亲自与买家和卖家互动，帮助他们达成报价——无论是出售房产（针对卖家）还是购买房产（针对买家）。她在房地产领域的丰富经验帮助她对房产的准确报价产生了直觉——考虑到某些标准参数的值，例如房产的面积（平方米）、位置、楼层、购买年限、可用设施等。然而，随着业务的急剧增长，她面临着一个巨大的挑战。她无法独自管理所有的个人互动，也无法为所有房产设定准确报价。她聘佣了一名助理来管理客户互动。但由于助理是房地产行业的新手，在报价方面非常吃力。Karen\
  \ 该如何解决这个问题呢？\n\n幸运的是，Karen 有一个朋友叫 Frank，他是一个对机器学习模型有深入了解的数据科学家。Frank 为 Karen 提供了一个解决方案。他建立了一个模型，如果具有某些标准输入（如房产面积（平方米）、位置、楼层、购买年限、可用设施等），就可以预测房产的准确价值。哇，听起来就像是\
  \ Karen 本人在做工作一样！好奇 Frank 使用了什么模型吗？是的，你猜得对。他使用回归模型来解决 Karen 的房地产价格预测问题。\n\n所以，我们刚刚讨论了一个可以使用回归解决的问题。同样，许多与其他数值预测相关的问题也可以用回归模型解决。在回归的背景下，因变量\
  \ `Y` 是需要预测其值的变量，例如在 Karen 的问题背景下，房地产的报价。该变量被认为与一个（假设为 `X`）或多个独立的自变量（称为预测变量）具有函数关系。在\
  \ Karen 的问题背景下，Frank 将房产面积、位置、楼层等作为他建立的模型的预测变量。换句话说，因变量取决于自变量或预测变量。回归本质上是寻找因变量 `Y`\
  \ 与自变量 `X` 之间的关系（或关联性），即为关联性 `Y = f (X)` 寻找函数 `f`。\n\n## 8.3 常见回归算法\n\n常见的回归算法有：\n\
  \n* 简单线性回归\n* 多元线性回归\n* 多项式回归\n* 多变量自适应回归样条\n* 逻辑回归\n* 最大似然估计（最小二乘法）\n\n### 8.3.1\
  \ 简单线性回归\n\n正如名称所示，简单线性回归是最包含一个预测变量的最简单回归模型。该模型假设因变量与预测变量之间存在线性关系，如图图 8.1 所示。\n\n\
  ![images](img/217-1.png)\n\n**图 8.1** 简单线性回归\n\n在 Karen 的问题背景下，如果我们以“房产价格”作为因变量并将“房产面积（平方米）”作为预测变量，可以使用简单线性回归建立一个模型。\n\
  \n```\nPrice[Property] = f(Area[Property])\n```\n\n假设存在线性关联，我们可以将模型重新表述为\n\n```\n\
  Price[Property] = a + b. Area[Property]\n```\n\n其中 `a` 和 `b` 分别是直线的截距和斜率。\n\n回顾一下，直线可以用斜截形式\
  \ `Y = a + bX` 定义，其中 `a` 为截距`b` 为斜率。截距的值表示当 `X = 0` 时 `Y` 的值。它被称为“Y 截距”，因为它指定了直线交叉垂直轴或\
  \ Y 轴的位置（参见图 8.1）。\n\n### 8.3.11 简单回归模型的斜率\n\n直线的斜率代表了图中垂直方向（Y 轴）的变化相对于水平方向（X 轴）的变化的程度，如图图\
  \ 8.2 所示。\n\n```\nSlope = Change in Y / Change in X\n```\n\n上升（Rise）是 Y 轴的变化（`Y[2]\
  \ - Y[1]`），下降（Run）是 X 轴的变化（`X[2] - X[1]`）。因此，斜率表示所示：\n\n![images](img/218-1.png)\n\
  \n**图 8.2** 上升与下降的表示\n\n![images](img/218-2.png)\n\n#### 斜率示例\n\n让我们计算图中低点为 `(-3,\
  \ -2)`，高点为 `(2, 2)` 的直线斜率。\n\n```\nRise = 2 - (-2) = 4\nRun = 2 - (-3) = 5\nSlope\
  \ = 4 / 5 = 0.8\n```\n\n线性回归有两种斜率：正斜率和负斜率。\n\n#### 正斜率\n\n正斜率在图中始终向上移动（参见图 8.3）。\n\
  \n![images](img/219-1.png)\n\n**图 8.3** 正斜率\n\n#### 负斜率\n\n负斜率在图中始终向下移动（参见图 8.4）。\n\
  \n![images](img/219-2.png)\n\n**图 8.4** 负斜率\n\n\n\n\n图 8.7 所示散点图显示了“无关系”曲线，因为很难断定\
  \ `X` 和 `Y` 之间的关系是正相关还是负。\n\n![images](img/221-1.png)\n\n**图 8.7** 无关系图\n\n### 8.3.1.3\
  \ 简单回归中的误差\n\n机器学习中的回归方程模型在算法中使用了上述斜率-截距格式。向机器提供 `X` 和 `Y` 的值，它通过关联 `X` 和 `Y` 的值来识别\
  \ `a`（截距）和 `b`（斜率）的值。然而，确定 `a` 和 `b` 值的精确匹配并不总是可能的。与之相关的将会存在某些误差值（`ε`）。这种误差被称为边际误差或残差误差。\n\
  \n`Y = (`a` + `bX`) + `ε`\n\n现在我们已经有了简单回归模型的背景知识，让我们尝试探索一个例子，清楚地理解如何为给定问题决定模型的参数（即\
  \ `a` 和 `b` 的值）。\n\n### 8.3.1.4 简单回归示例\n\n一位大学教授认为，如果一个班级的内部考试成绩很高，那么外部考试成绩也会很高。从该班中选取了\
  \ 15 名学生的随机样本，数据如下所示：\n\n![images](img/221-2.png)\n\n绘制了散点图，以探索映射到 `X` 轴的自变量（内部分数）与映射到\
  \ `Y` 轴的因变量（外部分数）之间的关系，如图图 8.8 所示。\n\n![images](img/222-1.png)\n\n**图 8.8** 散点图和回归线\n\
  \n从上述图中可以观察到，直线（即回归线）并没有精确地预测数据（参考图 8.8）。相反，它只是穿过了数据。某些预测值低于预期，而另一些则高于预期。\n\n**残差**是预测点（回归线上的点）与实际点之间的距离，如图图\
  \ 8.9 所示。\n\n![images](img/222-2.png)\n\n**图 8.9** 残差误差\n\n众所周知，在简单线性回归中，直线是使用回归公式绘制的。\n\
  \n`Y = (`a` + `bX`) + `ε`\n\n如果我们知道‘a’和‘b’的值，那么使用上述公式就可以很容易预测任何给定 `X` 的 `Y` 值。但问题是，对于一组给定的\
  \ `X` 和 `Y` 值，如何计算‘a’和‘b’的值呢？\n\n在散点图的点上尽可能近地绘制一条直线。普通最小二乘法（OLS）是用于估计一条使误差（`ε`）最小化的直线的技术，误差是\
  \ `Y` 的预测值与实际值之间的差。这意味着对每个预测的误差求和，或者更准确地说，是误差平方和（SSE）![img](img/223-1.png)\n\n观察到，当\
  \ `b` 取值为时，SSE 最小：\n\n![images](img/223-2.png)\n\n使用上述 `b` 的值计算出的相应‘a’值为：\n\n![images](img/223-4.png)\n\
  \n因此，让我们为给定的示例计算 `a` 和 `b` 的值。详细计算过程请参考图 8.10。\n\n#### 计算总结\n\n`X` 之和 = 299\n\n\
  `Y` 之和 = 8522\n\n`X` 的平均值 `M[X]` = 19.93\n\n`Y` 的平均值 `M[Y]` = 56.8\n\n平方和 (`SS[X]`)\
  \ = 226.9333\n\n乘积和 (SP) = 429.8\n\n回归方程 = `ŷ = bX + a`\n\n![images](img/223-3.png)\n\
  \n`a = M[Y] − bM[X] = 56.8 − (1.89 × 19.93) = 19.0473`\n\n`ŷ = 1.89395X + 19.0473`\n\
  \n因此，对于上述示例，估计的回归方程是基于 `a` 和 `b` 的估计值构建的：\n\n`ŷ = 1.89395X + 19.0473`\n\n所以在给定问题的背景下，我们可以说：\n\
  \n外部考试成绩 = 19.04 + 1.89 ×（内部考试成绩）\n\n或者，`M[Ext] = 19.04 + 1.89 × M[Int]`\n\n![images](img/224-1.png)\n\
  \n**图 8.10** 回归参数的详细计算\n\n上述构建的模型可以用图示表示为：\n\n*   扩展版本（参考图 8.11）\n*   放大版本（参考图 8.12）\n\
  \n#### 截距的解释\n\n正如我们所看到的，基于数据构建的简单线性回归模型是：\n\n`M[Ext] = 19.04 + 1.89 × M[Int]`\n\
  \n截距是 19.05。然而，19.05 是由内部考试解释的部分。\n\n![images](img/225-1.png)\n\n**图 8.11** 回归图的扩展版本\n\
  \n![images](img/225-2.png)\n\n**图 8.12** 放大回归线\n\n斜率衡量了当 `X` 每增加一个单位时 `Y` 的估计变化。这里，斜率为\
  \ 1.89 表示外部考试增加了 1.89。\n\n既然我们已经理解了如何为给定问题建立简单回归，现在是总结算法的时候了。\n\n#### 8.3.1.5 OLS\
  \ 算法\n\n*   步骤 1：计算 `X` 和 `Y` 的平均值\n*   步骤 2：计算 `X` 和 `Y` 的差\n*   步骤 3：乘积\n*   步骤\
  \ 4：乘积和\n*   步骤 5：差平方\n*   步骤 6：得到平方和\n*   步骤 7：将步骤 4 的输出除以步骤 6 的输出以计算 `b`\n*  \
  \ 步骤 8：使用 `b` 的值计算 `a`\n\n#### 8.3.1.6 曲线的极大值和最小值\n\n曲线上的极大值（参考图 8.13）和最小值（参考图 8.14）位于斜率为零的地方。它从正值或负值变为零。极大值是曲线上\
  \ `y` 坐标最高的点。最小值是曲线上 `y` 坐标最低的点。\n\n![images](img/226-1.png)\n\n**图 8.13** 曲线极大值\n\
  \n![images](img/227-1.png)\n\n**图 8.14** 曲线最小值\n\n### 8.3.2 多线性回归\n\n在多元回归模型中，涉及两个或多个独立变量（即预测变量）。如果我们考虑到\
  \ Karen 问题的背景，在上一节中，我们通过将物业价格作为因变量，将面积（平方米）作为预测变量，得到了简单线性回归。然而，位置、楼层、购买年限、便利设施等也是重要的预测变量，不应被忽略。因此，如果我们把物业价格（美元）视为因变量，并将面积（平方米）、位置、楼层、购买年限和便利设施视为自变量，我们可以形成如下所示的多元回归方程：\n\
  \n`Price[Property] = f (Area[Property, location, floor, Ageing, Amenities))`\n\n\
  简单线性模型和多元回归模型假设因变量是连续的。\n\n以下表达式描述了涉及两个预测变量（即 `X[1]` 和 `X[2]`）的方程。\n\n`Ŷ = a + b[1]X[1]\
  \ + b[2]X[2]`\n\n\n\n\n该模型描述了 `Ŷ`、`X[1]` 和 `X[2]` 三维空间中的一个平面。参数 `a` 是该平面的截距。参数 `b[1]`\
  \ 和 `b[2]` 被称为**部分回归系数**。参数 `b[1]` 代表在保持 `X[2]` 不变的情况下，`X[1]` 每变化一个单位时平均响应的变化。参数\
  \ `b[2]` 代表在保持 `X[1]` 不变的情况下，`X[2]` 每变化一个单位时平均响应的变化。\n\n考虑以下具有两个预测变量（即 `X[1]` 和\
  \ `X[2]`）的多元线性回归模型（参见图 8.15）。\n\n`Ŷ = 22 + 0.3*X[1] + 1.2*X[2]`\n\n![images](img/228-1.png)\n\
  \n**图 8.15** 多元回归平面\n\n当存在 `n` 个预测变量时，多元回归的估计方程如下：\n\n`Ŷ = a + b[1]*X[1] + b[2]*X[2]\
  \ + b[3]*X[3] + … + b[n]X[n]`\n\n在寻找最佳拟线时，我们可以拟合多项式回归或曲线回归。这些分别被称为多项式回归或曲线回归。\n\n\
  ### 8.3.3 回归分析中的假设\n\n1. 因变量（`Y`）可以计算/预测为特定一组自变量（`X`）的线性函数加上误差项（`ε`）。\n2. 观测值数量（`n`）大于待估计的参数数量（`k`），即\
  \ `n > k`。\n3. 回归决定的关系仅是基于数据集的相关关系，而不一定是所定义类别的因果关系。\n4. 回归线仅在有限的数据范围内有效。如果对线进行外推（超出外推范围），可能只会导致错误的预测。\n\
  5. 如果业务情况发生变化，且回归模型底的业务假设不再有效，那么过去数据集将无法预测未来的趋势。\n6. 所有 `X` 值的方差均相同（同方差性）。\n7. 误差项（`ε`）呈正态分布。这也意味着误差（`ε`）的均值的期望值为\
  \ 0。\n8. 误差（`ε`）的值是独立的，且与任何 `X` 值均无关。这意味着特定的 `X`、`Y` 值与另一个特定的 `X`、`Y` 值之间不存在关系。\n\
  \n给定上述假设，OLS 估计量是**最佳线性无偏估计量 (BLUE)**，这被称为**高斯-马尔可夫定理**。\n\n### 8.3.4 回归分析中的主要问题\n\
  \n在多元回归中，有两个主要问题：多共线性和异方差性。\n\n#### 8.3.4.1 多共线性\n\n如果两个变量之间存在精确线性关系，则它们是完全共线的。多共线性是指相关程度不仅存在因变量和自变量之间，而且存在于自变量内部。当存在多共线性时，多元回归方程可以进行良好的预测，但我们很难确定如果每次改变一个自变量，因变量将如何变化。当存在多共线性时，会增加系数的标准误差。通过过度膨胀标准误差，多共线性试图让某些本应具有统计学显著性的变量在统计上变得不显著（实际上具有较低的标准误差）。衡量多共线性的一种方法是计算方差膨胀因子\
  \ (VIF)，它评估了如果预测变量相关，估计的回归系数的方差会增加多少。如果没有因素相互相关，VIF 将等于 1。\n\n无完全共线性的假设是指自变量之间不存在精确的线性关系。这一假设意味着了关于自变量数据的两个方面：首先，除了与截距项相关的变量外，没有任何一个自变量可以是常数。其次，`X`\
  \ 的变化是必要的。通常情况下，自变量的变化越多，OLS 估计量在识别不同自变量对因变量的影响方面表现得越好。\n\n#### 8.3.4.2 异方差性\n\n\
  异方差性是指误差项方差的变化。如果误差项的方差在不同数据集之间不不变，将会产生错误的预测。通常，为了使回归方程做出准确的预测，误差项应该是独立且同分布（正态）分布的\
  \ (iid)。\n\n在数学上，这一假设写为：\n\n![images](img/230-1.png)\n\n其中 `var` 代表方差，`cov` 代表协方差，`u`\
  \ 代表误差项，`X` 代表自变量。\n\n这一假设更常见的写法是：\n\n![images](img/230-2)\n\n### 8.3.5 提高线性回归模型的准确性\n\
  \n在探索如何改进之前，让我们理解回归中的偏差和方差。准确性是指估计接近真实值的程度，而预测是指值的连续估计。\n\n高偏差 = 低准确性\n高方差 = 低预测\n\
  低偏差 = 高准确性\n低方差 = 高预测\n\n假设我们有一个高准确且高预测的回归模型，因此整体误差将会很低，这意味着低偏差（高准确性）和低方差（高预测）。同样，我们可以说如果方差增加（低预测），数据的分布程度就会增加。随着偏差增加（低准确性），预测值与观测值之间的误差会增大。因此，平衡偏差和准确性至关重要。\n\
  \n在回归中，假设观测值数量（`n`）大于参数数量（`k`），即 `n > k`，在这种情况下，最小二法估计具有低方差，因此在测试观测上表现良好。\n\n然而，如果观测值（`n`）并不比参数（`k`）大很多，那么最小二法可能会出现高变异性，导致过拟合并产生糟糕的预测。\n\
  \n如果 `k > n`，则线性回归不可用。这标志着方差无限，因此无法使用该方法。\n\n可以使用以下三种方法提高线性回归的准确性：\n\n1. 收缩方法\n\
  2. 子集选择\n3. 维度（变量）归约\n\n#### 8.3.5.1 收缩（正则化）方法\n\n通过限制（收缩）估计的系数，我们可以尝试在以轻微增加偏差为代价的情况下减少方差。这反过来可以大幅提高模型的准确性。\n\
  \n这种方法涉及拟合包含所有预测变量的模型，但估计的系数相对于最小二法估计进行了收缩。这种收缩（也称为正则化）具有减少整体方差的效果。某些系数也可能被估计为零，从而间接地执行了变量选择。将回归系数向零收缩的两种最著名的技术是\n\
  \n1. 岭回归\n\n\n\n\n\n## 2. lasso (最小绝对收缩选择算子)\n\n岭回归（Ridge regression）执行 L2 正则化，即它添加了等于系数幅度平方和的惩罚。\n\
  \n岭回归的最小化目标 = `LS Obj + α × (系数平方和)`\n\n岭回归（在最终模型中包含所有 `k` 个预测变量）与最小二法非常相似，不同之处在于系数是通过通过最小化一个略有不同的值来估计的。如果\
  \ `k > n`，则最小二法估计甚至没有唯一解，而岭回归可以通过通过微小的偏差增加来换取方差的大幅降低，仍然保持良好的性能。因此，岭回归在线最小二法估计具有高方差的情况下工作效果最好。岭回归的一个缺点是它会在最终模型中包含所有\
  \ `k` 个预测变量。这对于预测准确性可能不是问题，但在变量数量 `k` 较大的情况下，会给模型解释带来挑战。当响应是许多预测变量的函数且所有系数的大小大致相等时，岭回归的表现会更好。\n\
  \nLasso 回归执行 L1 正则化，即它添加了等于系数幅度绝对值的惩罚。\n\n岭回归的最小化目标 = `LS Obj + α × (系数幅度的绝对值)`\n\
  \n`lasso` 通过强制某些系数变为零值克服了这一缺点。我们可以说 lasso 产生了稀疏模型（仅涉及子集），这些模型更简单且更具解释性。在少数预测变量具有显著系数，而其余预测变量的系数非常小或等于零的情况下，预计\
  \ lasso 的表现会更好。\n\n### 8.3.5.2 子集选择\n\n识别一个假设与响应相关的预测变量子集，然后使用普通最小二乘法（OLS）在选定的简化变量子集上拟合模型。选择回归子集的方法有两种方法：\n\
  \n1. 最佳子集选择（考虑所有可能的 `(2^k)`）\n2. 逐步子集选择\n    1. 前向逐步选择（从 0 到 `k`）\n    2. 后向逐步选择（从\
  \ `k` 到 0）\n\n在最佳子集选择中，我们为 `k` 个预测变量的每一个可能的子集拟合一个单独的最小二法回归。由于计算原因，最佳子集选择不能应用于预测变量（`k`）非常大的情况。最佳子集选择程序考虑了所有包含\
  \ `p` 个预测变量子集的可能的 `(2^k)` 模型。\n\n可以使用逐步子集选择方法选择最佳子集。有两种逐步子集选择：\n\n1. 前向逐步选择（从 0\
  \ 到 `k`）\n2. 后向逐步选择（从 `k` 到 0）\n\n前向逐步选择是最佳子集选择的一种计算高效替代方案。与最佳子集选择相比，前向逐步考虑的模型集小得多，而且是逐步进行的。前向逐步选择从一个不包含预测变量的模型开始，然后逐个将预测变量添加到模型中，直到所有的\
  \ `k` 个预测变量都包含在模型中。特别是每一步中，都会添加对拟合额外改进最大的变量（`X`）。\n\n后向逐步选择从包含所有 `k` 个预测变量的最小二法模型开始，然后逐个移除最没用的预测变量。\n\
  \n### 8.3.5.3 降维（变量减少）\n\n前面的方法（即子集选择和收缩）通过使用原始变量的子集或将它们的系数向零收缩来控制方差。在降维中，预测变量（`X`）被变换，并使用降维后的变换变量建立模型。使用降维方法减少变量的数量。主成分分析是最重要的维度（变量）减少技术之一。\n\
  \n### 8.3.6 多项式回归模型\n\n**多项式回归模型**通过将每个原始预测变量的幂（平方）来获得额外的预测变量，是简单线性模型的扩展。例如，如果有三个变量，则使用\
  \ `X`、`X²` 和 `X³` 作为预测变量。这种方法为数据产生非线性拟合提供了一种简单的方法。\n\n```\nf(x) = c[0] + c[1].X¹\
  \ + c[2].X² + c[3].X³\n```\n\n在上述方程中，`c[0]`、`c[1]`、`c[2]` 和 `c[3]` 是系数。\n\n示例：让我们使用下面的\
  \ `(X, Y)` 数据集进行 3 次多项式。\n\n![images](img/232-1.png)\n\n如你所观察，对于上述 15 个数据点，3 次多项式的回归线（参考\
  \ 图 8.16）略有弯曲。如果我们增加多项式的次数，回归线将进一步弯曲（参考 图 8.17）。在所示的极端值处，回归线将过拟合到 `X` 的所有原始值。\n\n\
  ![images](img/233-1.png)\n\n**图 8.16** 3 次多项式\n\n![images](img/233-2.png)\n\n**图\
  \ 8.17** 1 次多项式\n\n### 8.3.7 逻辑回归\n\n逻辑回归取决于所使用的场景既是分类技术也是回归技术。逻辑回归（logit 回归）是一种用于预测分类因变量结果的回归分析，类似于\
  \ OLS 回归。在逻辑回归中，因变量（`Y`）是二元的（0,1），自变量（`X`）是连续的。逻辑回归的目标是在给定特定 `X` 值的情况下预测 `Y` 等于\
  \ 1 的概率。在逻辑回归中，没有 `R²` 来衡量拟合情况；然而，使用卡方检验来衡量逻辑回归的拟合程度。\n\n例如，我们可能会根据项目经理的经验年限来预测小项目是成功还是失败。我们假设管理项目多年的项目经理更有可能成功。这意味着随着\
  \ `X`（经验年限）的增加，`Y` 等于 1 的概率也会增加。\n\n为了说明这一点，方便将经验年限分为类别（例如 0–8，9–16，17–24，25–32，33–40）。如果我们为每个经验年限类别计算\
  \ `Y` 的平均分（对 0 和 1 取平均），我们将得到类似\n\n![images](img/234-1.png)\n\n当为上述 `X` 和 `Y` 值绘制图时，它看起来像\
  \ 图 8.18 中的图。随着 `X` 的增加，`Y` 等于 1 的概率也会增加。\n\n\n\n\n\n# 逻辑回归的解释从逻辑函数开始，逻辑函数的取值始终在\
  \ 0 到 1 之间。逻辑公式用 `Y` = 1 的概率表示，记作 `P`。`Y` 为 0 的概率为 `1 − P`。\n\n![images](img/234-2.png)![images](img/235-1.png)\n\
  \n**图 8.18** 逻辑回归\n\n“ln” 符号指代自然对数，`a + bX` 是回归线方程。概率（`P`）也可以通过回归方程计算。因此，如果我们知道回归方程，从理论上讲，我们可以计算出在给定\
  \ `X` 值下 `Y` = 1 的期望概率。\n\n![images](img/235-2.png)\n\n`exp` 是指数函数，有时也写成 `e`。\n\n\
  假设我们有一个模型，可以根据身高来预测一个人是男性还是女性。给定身高为 150 cm，我们需要预测此人是男性还是女性。\n\n我们知道系数 `a` = −100\
  \ 且 `b` = 0.6。使用上述方程，我们可以计算身高为 150 cm 或更高时男性的概率，或者更正式地说是 `P(male|height = 150)`。\n\
  \n```\ny = e^(a + b × X)/(1 + e^(a + b × X)) y = exp ( -100 + 0.6 × 150)/(1 + EXP(\
  \ -100 + 0.6 × X*) *y = 0.000046 \n```\n\n身高 150 cm 以上时是男性的概率。\n\n## 回归的假设\n\n在逻辑回归中：\n\
  \n- 逻辑函数与自变量 之间存在线性关系。\n- 回归模型满足以下假设：\n- 逻辑函数（logit）与自变量（预测变量）之间存在线性关系。\n- 因变量 `Y`\
  \ 必须是分类的（categorical）。\n- 误差项与因变量之间，误差项是同分布的。\n- 误差项 `ε` 相互独立且同分布（iid）。\n- 误差项 `ε`\
  \ 服从二项分布。\n- 逻辑回归中，误差项服从正态分布。\n\n## 8.3 最大似然估计\n\n逻辑回归的系数通过最大似然估计（MLE）来确定。最大似然估计是一种寻找一组参数，使得观测数据出现的概率最大的方法。在似然估计中，我们使用似然函数来对参数进行估计。似然函数是关于参数的函数，通过最大化该函数，我们可以得到参数的估计值。\n\
  \n在逻辑回归的似然估计中，我们假设观测值服从某种概率分布。\n\n![images](img/236-1.png)\n\n似然函数是观测概率的乘积。\n\n\
  ![images](img/236-2.png)\n\n似然函数是参数的函数。\n\n![images](img/236-3.png)\n\nMLE 是最大化似然函数值的过程。\n\
  \n![images](img/236-4.png)\n\n## 8.4 总结\n\n- 在监督学习中，当我们试图预测诸如“价格”、“重量”等真实变量时，问题属于回归。回归尝试预测连续的结果。因变量\
  \ `Y` 是被预测的值，自变量 `X` 是预测变量。\n- 回归本质上是寻找因变量 `Y` 与自变量 `X` 之间的关系（或关联）。\n- 如果回归只涉及一个自变量，则被称为简单回归。因此，如果我们取“二手车价格”作为因变量，将“制造年份”作为自变量，就可以建立简单回归模型。\n\
  - 斜率表示直线在垂直方向（`Y`）上的变化程度。\n\n## 示例题\n\n### 单选题\n\n1. 在监督学习中，当我们试图预测诸如“价格”、“重量”等真实变量时，该问题属于：\n\
