  \    2. 平均值\n    3. 四分位数\n    4. 以上都不是\n\n8. 为了理解两个变量之间的关系，可以使用 \\_\\_\\_\\_。 \n\
  \    1. 箱线图\n    2. 散点图\n    3. 直方图\n    4. 以上都不是\n\n9. 两种常见的数据问题是 \n    1. 离群值\n\
  \    2. 缺失值\n    3. 边界值\n    4. 以上都不是\n\n10. 数值数据的探索最好使用以下方法进行 \n    1. 箱线图\n  \
  \  2. 直方图\n    3. 散点图\n    4. 以上都不是\n\n11. 数据可以大致分为以下两类 \n    1. 定性\n    2. 推测性\n\
  \    3. 定量\n    4. 以上都不是\n\n12. 序数据可以自然地 \\_\\_\\_\\_\\_. \n    1. 测量\n    2. 排序\n\
  \    3. 分类\n    4. 以上都不是\n\n### 简答题（每题 5 分）：\n\n1. 在准备开始进行机器学习建模时，涉及哪些主要活动？\n2.\
  \ 机器学习中的基本数据类型有哪些？为每种类型提供一个例子。\n3. 区分：\n    1. 定性属性 vs 数值属性\n    2. 降维 vs 特征选择\n\
  4. 针对任意两项写要短评：\n    1. 直方图\n    2. 散点图\n    3. `PCA`\n5. 为什么我们需要探索数据？探索定性数据与定量数据的方法有区别吗？\n\
  6. 直方图不同的形状有哪些？什么是“箱（bins）”？\n7. 我们如何处理数据中的离群值？\n8. 中心趋势的不同度量方法有哪些？为什么在某些数据集中，平均值与中位数差异很大？\n\
  9. 解释如何使用散点图探索双变量关系。可以使用散点图检测离群值吗？\n10. 解释如何使用交叉表来理解两个变量之间的关系。\n\n### 答题（每题 10 分）：\n\
  \n1. 机器学习中涉及哪些主要活动？数据预处理是指什么？\n2. 详细解释定性数据和定量数据。区分这两者。\n3. 准备一个简单的数据集并包含一些样本记录。包含至少一种机器学习中使用的不同数据类型的属性。\n\
  4. 机器学习中数据问题的不同原因有哪些？后果是什么？\n5. 结合例子解释探索分类数据的不同方法。\n6. 我们如何处理数据中的离群值？\n7. 中心趋势的不同度量方法有哪些？为什么在某些数据集中，平均值与中位数差异很大？\n\
  8. 解释如何使用散点图探索双变量关系。可以使用散点图检测离群值吗？\n9. 解释如何使用交叉表来理解两个变量之间的关系。\n10. 1. 什么是 `IQR`？它是如何衡量的？\n\
  \    2. 针对任意两项写短评：\n        1. 间距数据\n        2. 交叉表\n    3. 写出以下区别：\n        1.\
  \ 名义数据与序数据\n        2. 箱线图与直方图\n    3. 平均值与中位数\n\n\n\n\n\n这可以通过人类学习来实现，即由侦查部门的人扫描每一张选定的照片，并尝试将这些照片与聚集人员中的面部进行匹配。记忆力强的人可以一眼看完所有犯罪犯的照片，然后尝试在人群中寻找与她看过的某张犯罪犯照片相似的面孔。这听起来很容易，不是吗？但在现实中是不可能的。数据库中的犯罪犯人数（以及照片数量）有数百甚至上千张。因此，查看所有照片并记住它们是不可能的。此外，精确匹配也是不完及的，因为大多数情况下犯罪犯会进行伪装。这里应该采取的策略是分较小数量的照片进行匹配，并基于某些显著的物理特征，如颌部形状、额头斜度、眼睛大小、耳朵结构等。因此，来自犯罪犯数据库的照片形成了输入数据。基于此，可以抽象出关键特征。由于人类对每张照片的匹配很快会导致视觉和心理上的疲劳，因此对抽象的特征数据进行泛化是检测人群中潜在犯罪犯面部的好方法。例如，从抽象的特征数据中观察到，大多数犯罪犯的内眼角距离较短，鼻子和嘴角之间的角度较小，上唇曲率较高等。因此，人群中的某个面部根据其是否符合这些泛化观察被分类为“潜在犯罪犯”。因此，使用输入数据可以构建基于特征的抽象，通过对抽象数据进行泛化，人类学习最终可以将面部分类为潜在犯罪犯，从而发现犯罪犯。\n\
  \n同样的事情也可以机器学习来实现。与人类检测不同，机器没有主观负担、没有情感、没有由于过去经验导致的偏差，最重要的是没有心理疲劳。机器可以使用相同的输入数据（即犯罪犯数据库照片），应用计算技术从输入数据中抽象出基于特征的概念映射，并以分类算法的形式对其进行泛化，以决定人群中的某个面部是否为潜在犯罪犯。\n\
  \n当我们谈论学习过程时，抽象是一个重要步骤，因为它将原始输入数据以总结和结构化的格式表示，从而从数据获得有意义的见解。这种从原始输入数据到意义模式的结构化表示被称为`model`。模型可能有不同的形式。它可能是一个数学方程，可能是图形或树形结构，可能是一个计算块等。针对特定数据集选择哪种模型由学习任务决定，取决于要解决的问题和数据的类型。例如，当问题与预测相关且目标字段是数值和连续的时，则分配回归模型。分配模型以及将特定模型拟合数据集的过程被称为模型`training`。一旦模型训练完成，原始输入数据就会被总结为抽象形式。\n\
  \n然而，通过抽象，学习者只能总结知识。这种知识可能仍然非常宽泛——由大量的基于特征的数据和相互关系组成。从这种宽泛的知识中产生可操作的见解是非常困难的。这正是泛化发挥作用的地方。泛化在海大的抽象知识集中进行搜索，以产生可操作的见解。\n\
  \n#### 思考点：\n\n*   就像相对于机器学习模型的目标函数一样，其他经常被跟踪的函数还有：\n*   `cost function`（成本函数，也称为`error\
  \ function`误差函数）有助于衡量模型在估计 `X` 和 `Y` 之间关系时的错误程度。从这个意义上说，成本函数可以告诉模型性能有多差。\n*   `Loss\
  \ function`（损失函数）与成本函数几乎同义——区别在于损失函数通常是定义在数据点上的函数，而成本函数是针对整个训练数据集。\n*   机器学习是一个优化问题。我们尝试定义一个模型并调整参数，以找到问题的最优解决方案。然而，我们需要一种评估解决方案质量或优度的方法。这是通过`objective\
  \ function`（目标函数）实现的。目标意味着目的。`objective function`接受数据和模型（以及参数）作为输入并返回一个值。目标是找到模型参数的值以最大化或最小化返回值。当目标是最小值一时，它与成本函数同义。\n\
  \n## 3.2 选择模型\n\n现在你已经熟悉学习过程并理解了抽象和泛化，让我们尝试将其形式化。我们想要开发一个模型根据潜在影响因素推断犯罪事件的变化。在机器学习范式中，干扰的潜在原因（例如人口平均收入、武器销售、移民入境等）是输入变量。它们被称为预测变量、属性、特征、独立变量或简单的变量。犯罪事件的数量是输出变量（也称为响应或因变量）。输入变量可以用\
  \ `X` 表示，而单个输入变量表示为 `X[1]`、`X[2]`、`X[3]`、…… `X[n]`，输出变量为 `Y`。`X` 和 `Y` 之间的关系表示为一般形式：`Y\
  \ = f(X) + e`，其中 `f(X)` 是`target function`（目标函数），而 `e` 是随机误差项。\n\n\n\n\n但我们刚刚讨论的问题是机器学习中的一种特定类型的问题。我们在第\
  \ 1 章中已经看到，用于解决不同类型问题的机器学习方法分为三大类。快速回顾一下，它们是：\n\n1. 监督学习\n    1. 分类\n    2. 回归\n\
  2. 无监督学习\n    1. 聚类\n    2. 关联分析\n3. 强化学习\n\n对于这种情况，需要创建/训练的模型都是不同的。当我们尝试选择模型来解决机器学习问题时，多个因素起了作用。最重要的因素是\
  \ (i) 我们想用机器学习解决的问题类型以及 (ii) 底层数据的性质。问题可能与类别值的预测有关，例如肿瘤是良性还是恶性、明天是否下雪或下雨等。它可能与预测有关——但针对某些数值，例如下个季度的房价应该是多少、某只\
  \ IT 股票在未来 7 天内的预期增长是多少等。某些问题与数据分组有关，例如使用某产品的客户群体、过去一年票房获得更大成功的电影类型等。因此，要对应该选择哪种机器学习提供通用的指导是非常困难的。换句话说，没有一种模型可以适用于所有的机器学习问题。这也是`无免费午餐`定理所陈述的。\n\
  \n任何学习模型都试图模拟现实世界的某些方面。然而，它在很大程度上被简化了，去除了所有复杂的细节。这些简化是基于某些假设的——这些假设很大程度上取决于情况。根据具体情况（即手中的的问题和数据特征），假设可能成立也可能不成立。因此，同一个模型在某种情况下可能会产生显著的结果，而在另一种情况下可能会完全失败。这就是为什么在进行上一章中介绍过的数据探索时，我们需要理解数据特征，将这种理解与我们正尝试解决的问题相结合，然后决定选择哪种模型来解决问题。\n\
  \n让我们尝试以结构化的方式理解模型选择的哲学。机器学习算法大分为两类：监督学习模型（主要关注解决预测性问题）和无监督学习模型（解决描述性问题）。\n\n###\
  \ 3.2.1 预测模型\n\n监督学习模型或预测模型，正如其名称所示，尝试使用输入数据集中的值来预测某些值。学习模型试图在目标特征（即被预测的特征）与预测特征之间建立关系。预测模型对于它们想要学习什么以及如何学习有明确的重点。\n\
  \n预测模型反过来可能需要预测数据实例所属的类别或类的值。以下是一些例子：\n\n1. 预测板球比赛的胜/负\n2. 预测交易是否为欺诈\n3. 预测客户是否可能转向其他产品\n\
  \n用于预测类别值目标特征的模型被称为分类模型。目标特征被称为类（class），而划分这些划分的类别称为水平（levels）。一些流行的分类模型包括`k`-Neighbor、`Naïve\
  \ Bayes（朴素贝叶）和`Decision Tree（决策树）。\n\n预测模型也可以根据预测特征来预测数值。以下是一些例子：\n\n1. 预测明年的收入增长\n\
  2. 预测未来季风季节的降雨量\n3. 预测明年冬的潜在流感患者\n\n用于预测目标特征数值的模型被称为回归模型。`Linear Regression（线性回归）和`Logistic\
  \ Regression（逻辑回归）是流行的回归模型。\n\n**思考点：**\n\n- 类别值可以转换为数值值，反之亦然。例如，对于股票价格增长，处于某些范围内的任何百分比都可以用类别值表示，例如将`0%–5%`表示为`low`（低），`5%–10%`表示为`moderate`（中），`10%–20%`表示为`high`（高），`>20%`表示为`booming`（爆发）。同样，在肿瘤检测问题中，`benign（良性）`为`0`，`malignant（恶性）`为`1`。\n\
  - 在选择模型时，需要考虑多个因素。例如，在选择预测模型时，训练数据的大小是一个重要因素。如果训练数据很小，像`Naïve Bayes`这样的低方差模型应该表现更好，因为在这种我们需要避免模型过拟合。同样，当训练数据很大时，应优先选择像`logistic\
  \ regression`这样的低偏差模型，因为它们可以更有效地表示复杂的关系。\n\n少数模型如`Support Vector Machines（支持向量机`和`Neural\
  \ Network（神经网络`既可以用于分类也可以用于回归。\n\n### 3.2.2 描述性模型\n\n无监督学习模型或描述性模型用于描述数据集或从数据集中获得洞察。在无监督学习的情况下没有目标特征或感兴趣的特征。根据所有特征的值，从数据集中得出有趣的模式或洞察。\n\
  \n将相似的数据实例（即具有相似特征值的数据实例）分组在一起的描述性模型被称为聚类模型。聚类的示例包括：\n\n1. 基于社会、人口、种族等因素的客户分组或细分\n\
  2. 根据流派、语言、时期等方面对音乐进行分组\n3. 对库存中的商品进行分组\n\n最流行的聚类模型是`k`-Means。\n\n\n\n\n在监督学习中，模型是通过带标签的输入数据训练的。然而，我们如何理解模型的性能呢？测试数据可能无法立即获得。此外，测试数据的标签值是未知的。这就是为什么需要保留部分输入数据（这就是“留出法”\
  \ holdout 一词的由来）来评估模型的原因。这部分输入数据的子被用作测试数据，以评估已训练模型的性能。通常，70%–80%的输入数据（显然是有标签的）被用于模型训练。剩余的\
  \ 20%–30%被用作测试数据以验证模型的性能。不过，将输入数据分为训练集和测试集的不同比例也是可以接受的。为了确保两个桶中的数据在性质上相似，划分是随机进行的。使用随机数将数据项分配到不同的分区中。这种将输入数据划分为两部分——训练数据和测试数据（如图\
  \ 3.1 所示）的方法，通过保留部分输入数据来验证训练后的模型，被称为留出法。\n\n![images](img/67-1.png)\n\n**图 3.1**\
  \ 留出法\n\n一旦使用训练数据训练了模型，就可以使用模型的目标函数预测测试数据的标签。然后，将预测值与标签的实际值进行比较。这是可能的，因为测试数据是具有已知标签的输入数据的一部分。模型的性能通常通过标签值预测的准确率来衡量。\n\
  \n在某些情况下，输入数据被划分为三个部分：训练数据、测试数据以及第三部分验证数据。验证数据被用来代替测试数据衡量模型性能。它被用于迭代，并在每次迭代中精炼模型。测试数据仅在模型精炼并最终定型后使用一次，用于衡量并报告模型的最终性能，为未来的学习工作提供参考。\n\
  \n该方法的一个明显问题是，不同类别的数据划分到训练集和测试集的比例可能并不均衡。如果与某些类别相关的数据总百分比远小于其他类别，这种情况会更加糟糕。尽管在选择测试数据时采用了随机抽样，这种情况仍可能发生。通过应用分层随机采样代替随机抽样，可以在一定程度上解决这个问题。在分层随机采样的情况下，将所有数据分为若干个同质组或分层，并从每个分层中选择一个随机样本。这确保了生成的随机分区具有各类别的相等比例。\n\
  \n### 3.3.2 *K*-折交叉验证方法\n\n采用分层随机采样方法的留出法在某些特定情况下仍会遇到问题。特别是较小的数据集可能难以在训练集和测试集之间按比例划分某些类别的数据。有时会采用留出法的特殊变体——“重复留出法”（repeated\
  \ holdout），以确保所组成数据集的随机性。在重复留出法中，使用多次随机留出来衡量模型性能。最后，取所有性能的平均值。由于抽取了多次留出，训练数据和测试数据（如果抽取了验证数据的话）更有可能包含所有类别的代表性数据，并类似于所有类别。这种将输入数据划分为两部分——训练数据和测试数据（如图\
  \ 3.1 所示）的方法，通过保留部分输入数据来验证训练后的模型，被称为留出法。\n\n![images](img/67-1.png)\n\n**图 3.1**\
  \ 留出法\n\n一旦使用训练数据训练了模型，就可以使用模型的目标函数预测测试数据的标签。然后，将预测值与标签的实际值进行比较。这是可能的，因为测试数据是具有已知标签的输入数据的一部分。模型的性能通常通过标签值预测的准确率来衡量。\n\
  \n在某些情况下，输入数据被划分为三个部分：训练数据、测试数据以及第三部分验证数据。验证数据被用来代替测试数据衡量模型性能。它被用于迭代，并在每次迭代中精炼模型。测试数据仅在模型精炼并最终定型后使用一次，用于衡量并报告模型的最终性能，为未来的学习工作提供参考。\n\
  \n\n\n急进学习（Eager learning）遵循机器学习的一般原则——它在模型训练阶段尝试构建一个通用的、与输入无关的目标函数。它遵循机器学习的典型步骤，即抽象和泛化，并在学习阶段结束时产生训练好的模型。因此，当测试数据进入以进行分类时，急进学习器已经准备好了模型，不需要再次引用训练数据。急进学习在学习阶段花费的时间比懒惰学习者长。采用急进学习方法的算法包括`Decision\
  \ Tree`（决策树）、`Support Vector Machine`（支持向量机）、`Neural Network`（神经网络）等。\n\n另一方面，正如典型的机器学习过程中解释的那样，懒惰学习（Lazy\
  \ learning）完全跳过了抽象和泛化过程。在这方面，严格来说，懒惰学习器并没有“学习”任何东西。它直接使用训练数据，并利用这些知识对未标记的测试数据进行分类。由于懒惰学习直接使用训练数据，因此也被称为死记硬背（rote\
  \ learning，即基于重复的记忆技术）。由于对给定的训练数据实例的高度依赖，它也被称为实例学习（instance learning）。它们还被称为非参数学习（non-parametric\
  \ learning）。懒惰学习者在训练上花费的时间极少，因为实际上并没有发生多少训练。然而，分类过程需要相当的时间，因为对于每一组测试数据元组，都会发生基于比较的标签分配。懒惰学习最流行的算法之一是`k`-nearest\
  \ neighbor（k-最近邻）。\n\n### 注意：\n\n参数学习模型具有有限数量的参数。在非参数模型中，与其名称相反，参数的数量可能是无限的。\n\n\
  诸如`Linear Regression`（线性回归）和`Support Vector Machine`（支持向量机）等模型由于系数构成了学习参数，它们的大小是固定的。因此，这些模型被归类为参数化。另一方面，对于`k`-Nearest\
  \ Neighbor（`k`NN，最近邻）和`decision tree`（决策树）等模型，参数的数量随训练数据规模增加而增加。因此，它们被认为是非参数学习模型。\n\
  \n## 3.4 模型表示与可解释性\n\n我们已经看到，监督机器学习的目标是学习或推导出目标函数，该函数能够从输入变量集中尽可能地确定目标变量。从训练数据中学习目标函数的一个关键考虑因素是泛化的程度。这是因为输入数据只是一个局限、特定的视角，而测试数据集中的新的未知数据可能与训练数据有很大不同。\n\
  \n由学习算法近似的目标函数的适应程度决定了它分类一组从未见过的数据数据的准确性。\n\n### 3.4.1 欠拟合（Underfitting）\n\n如果目标函数保持过于简单，它可能无法捕捉本质的细微差别并良好地表示底层数据。欠拟合的典型情况发生在尝试用线性模型表示非线性数据时，如图\
  \ 3.5 所示的两种欠拟合案例。很多时候，欠拟合是由于缺乏足够的训练数据。欠拟合导致训练数据性能差，且对测试数据的泛化能力差。可以通过以下方法避免欠拟合：\n\
  \n1. 使用更多的训练数据\n2. 通过有效的特征选择减少特征\n\n![images](img/72-1.png)\n\n**图 3.5** 模型的欠拟合与过拟合\n\
  \n### 3.4.2 过拟合（Overfitting）\n\n过拟合是指模型的设计方式过密地模拟了训练数据。在这种情况下，训练数据中的任何特定偏差（如噪声或离群值）都会被嵌入模型中。这不利于影响模型在测试数据上的性能。许多情况下，过拟合是尝试拟合一个过度复杂的模型以密切匹配训练数据的结果。这在图\
  \ 3.5 中的样本集中表示。在这些情况下，目标函数试图确保所有训练数据点都被决策边界正确划分。然而，通常这种精确的特性在未知的测试数据集中无法复制。因此，目标函数会导致测试集中产生错误的分类。过拟合导致训练数据集上的性能良好，但泛化能力差，因此在测试数据集上的性能差。可以通过以下方法避免过拟合：\n\
  \n1. 使用重采样技术，如`k`-fold 交叉验证\n2. 保留验证数据集\n3. 移除对给定的机器学习问题几乎或没有预测能力的节点。\n\n欠拟合和过拟合都会导致分类质量差，表现为分类准确率的低。\n\
  \n### 3.4.3 偏差-方差权衡（Bias – variance trade-off）\n\n在监督学习中，基于训练数据构建的学习模型所分配的类别值可能与实际类别值不同。这种学习中的误差可以分为两类——由于“偏差”（bias）引起的误差和由于“方差”（variance）引起的误差。让我们尝试详细理解每一个一个。\n\
  \n### 3.4.3.1 由“偏差”引起的误差\n\n由于偏差引起的误差源于模型为了使目标函数不复杂或更容易学习而所做的简化假设。简而言之，这是由于模型的欠拟合。参数模型通常具有高偏差，使得它们更容易被理解/解释且学习得更快。这些算法在本质上复杂且不符合算法所做的简化假设的数据集上表现不佳。欠拟合导致高偏差。\n\
  \n### 3.4.3.2 由“方差”引起的误差\n\n由于方差引起的误差源于用于训练模型的不同训练数据集之间的差异。使用不同的训练数据集（从输入数据集中随机采样）来训练模型。理想情况下，数据集之间的差异不应该是巨大的，使用不同数据集训练出的模型也不应该太不同。然而，在过拟合的情况下，由于模型密切匹配训练数据，训练数据中的微小差异会被放大。\n\
  \n![images](img/74-1.png)\n\n**图 3.6** 偏差-方差权衡\n\n所以，训练模型中的问题可能是因为 (a) 模型太简单，因此无法粗略地解释数据，或\
  \ (b) 模型极其复杂并放大了训练数据中的差异。\n\n这很容易理解：\n\n* 增加偏差会减少方差，且\n* 增加方差会减少偏差\n\n一方面，参数算法通常被认为具有高偏差但低方差。另一方面，非参数算法表现出低偏差和高方差。\n\
  \n如图 3.6 所示，最佳解决方案是具有低偏差和低方差的模型。然而，这在现实中可能并不。因此，监督机器学习的目标是在偏差和方差之间取得平衡。所选的学习算法和可以配置的用户参数有助于在偏差和方差之间进行权衡。例如，在流行的监督算法`k`-Nearest\
  \ Neighbor（`k`NN）中，用户可配置参数 `k` 可在偏差和方差之间进行权衡。\n\n## 3.5 评估模型性能\n\n### 3.5.1 监督学习\
  \ - 分类\n\n\n\n\n在监督学习中，一项主要任务是分类。分类模型的职责是根据预测特征的值为目标特征分配类别标签。例如，在板球比赛胜负预测问题中，分类器将根据其他特征的值（如球队是否赢得掷球、球队中旋转投手的数量、球队在锦赛中的获胜次数等）为目标特征分配“胜/负”类别值。为了评估模型的性能，必须记录模型进行正确分类或预测的次数。如果（例如在给定问题中）模型预测球队将获胜而球队确实赢了，则认为该分类是正确的。\n\
  \n根据模型做出的正确和错误分类或预测数量，可以计算模型的准确率。如果模型在 100 次中中有 99 次分类正确（例如在 100 场比赛中，99 场模型的预测结果与实际结果一致），则该模型的准确率为\
  \ 99%。然而，仅仅通过准确率值来判断模型表现是否良好是相当相对的。例如，对于运动胜负预测模型来说，99% 的准确率可能是合理的，但当学习问题涉及预测严重疾病时，同样的数字可能无法被认为是一个良好的阈值。在这种情况下，即使是\
  \ 1% 的错误预测也可能导致许多生命的损失。因此，需要根据具体的学习问题来评估模型性能。此外，在某些情况下，可能宁愿以整体准确率的代价来采取谨慎。出于这个原因，我们需要更仔细地观察模型准确率，同时观察模型的其他性能指标，如灵敏度（sensitivity）、特异性（specificity）、精确率（precision）等。因此，让我们更仔细地观察模型准确率，并尝试通过例子来理解它。\n\
  \n### 板球比赛预测示例\n\n关于板球比赛胜负预测有四种可能性：\n\n1. 模型预测胜且球队赢了\n2. 模型预测胜但球队输了\n3. 模型预测负但球队赢了\n\
  4. 模型预测负且球队输了\n\n在这个问题中，显然感兴趣的类别是“胜”。\n\n*   第一种情况，即模型预测胜且球队赢了，模型正确将数据实例分类为感兴趣的类别。这些情况被称为\
  \ `True Positive (TP)` 案例。\n*   第二种情况，即模型预测胜但球队输了，模型错误地将数据实例分类为感兴趣的类别。这些情况被称为 `False\
  \ Positive (FP)` 案例。\n*   第三种情况，即模型预测负但球队赢了，模型错误地将其分类为非感兴趣的类别。这些情况被称为 `False Negative\
  \ (FN)` 案例。\n\n![images](img/76-1.png)\n**图 3.7** 模型分类细节\n\n第四种情况，即模型预测负且球队输了，模型正确地将其分类为非感兴趣的类别。这些情况被称为\
  \ `True Negative (TN)` 案例。所有四种情况均在图 3.7 中所示。\n\n### 性能指标深度解析\n\n在某些情况下，可能宁愿以整体准确率的代价来采取谨慎。出于这个原因，我们需要更仔细地观察模型准确率，同时观察模型的其他性能指标，如灵敏度、特异性、精确率等。\n\
  \n在这种情况下，即使是 1% 的错误预测也可能导致许多生命的损失。因此，需要根据具体的学习问题来评估模型性能。\n\n在这个问题中，显然感兴趣的类别是“胜”。\n\
  \n第一种情况，即模型预测胜且球队赢了，模型正确将数据实例分类为感兴趣的类别。这些情况被称为 `True Positive (TP)` 案例。\n\n第二种情况，即模型预测胜但球队输了，模型错误地将数据实例分类为感兴趣的类别。这些情况被称为\
  \ `False Positive (FP)` 案例。\n\n...（此处省略后续重复部分，逻辑已对齐）\n\n\n\n\n精确率（Precision）表示模型预测感兴趣感兴趣类别的可靠性。当模型与板球比赛胜负预测相关时，精确率表示模型正确预测胜利的频率。在上述板球比赛胜负预测问题的混淆矩阵中\n\
  \n![images](img/79-3.png)\n\n可以理解，精确率较高的模型被认为更可靠。\n\n召回率（Recall）表示正例正确预测数占正例总数的比例。在板球比赛胜负预测的情况下，召回率类似于总胜利次数中有多少比例被正确预测出来。\n\
  \n![images](img/79-4.png)\n\n在上述板球比赛胜负预测问题的混淆矩阵中\n\n![images](img/79-5.png)\n\n\
  ### 3.5.1.1 F 测量\n\n`F`-measure 是另一种衡量模型性能的指标，它结合了精确率和召回率。它取精确率和召回率的调和平均数，计算如下：\n\
  \n![images](img/79-6.png)\n\n在上述板球比赛胜负预测问题的混淆矩阵中\n\n![images](img/80-1.png)\n\n\
  作为将多个指标合并为一个的方法，`F`-score 提供了一个正确的衡量标准，借此比较不同模型的性能。然而，计算基于的一个假设是精确率和召回率具有相同的权重，这在现实中可能并不总是成立。在某些问题中，例如疾病预测问题，精确率可能会被赋予更大的权重。在这种情况下，可能会为精确率和召回率分配不同的权重。然而，对于每个指标采用什么值以及采用该特定值的依据，可能会面临严峻的困境。\n\
  \n### 3.5.1.1.1 接收者工作特征 (ROC) 曲线\n\n正如我们目前所看到的，尽管准确率（accuracy）是最流行的指标，但还有许多其他指标可以评估监督学习模型的性能。然而，可视化是理解模型性能的一种更简单、更有效的方法。它也有助于比较两个模型的效率。\n\
  \n接收者工作特征（ROC）曲线有助于分类模型性能的化。它展示了模型在避免假正例（false positives）发生的同时检测真正例（true positives）的效率。为了复习，真正例是指模型正确地将数据实例分类为感兴趣类别的案例。例如，在肿瘤恶性预测问题中，模型正确地将肿瘤分类为恶性。另一方面，假正例（FPs）是指模型错误地将数据实例分类为感兴趣类别的案例。使用相同的例子，在一种情况下，模型错误地将肿瘤分类为恶性，即实际上为良性的肿瘤被分类为恶性。\n\
  \n![images](img/80-2.png)\n\n在 ROC 曲线中，假正例率（横轴）在不同的分类阈值下相对于真正例率（纵轴）进行绘图。如果我们假设分类阈值较小，模型会将更多项目分类为正例。因此，假正例和真正例的值都会增加。曲线下面积（AUC）值如图\
