  \n如果 `Y = X[1] + X[2] + … + X[n]`，使用中心极限定理估计 `P(4 ≤ Y ≤ 6)`。\n\n## 第 6 章\n\n## 贝叶斯概念学习\n\
  \n### 本章目标：\n\n分类的概率原理是机器学习算法的一个重要领域。在现实生活中，我们的决策受到我们对某一事件的先验知识或信念的影响。因此，如果我们知道在过去观察到其他事件时，该事件确实发生过，那么在某些情况下，一个原本极可能不发生的事件可能会被我们认真考虑发生。同样的概念也应用于机器学习，并使用了本章讨论的贝叶斯定理及相关算法。前几章讨论的概率概念在本章中被广泛使用。\n\
  \n## 6.1 引言\n\n在上一章中，我们讨论了概率的规则，以及概率、分布函数和假设检验原理在机器学习领域的可能用途。在本章中，我们将讨论贝叶斯定理的细节，以及它如何为机器学习概念提供基础。该技术源于\
  \ 18 世纪数学家托马斯·贝叶斯（Thomas Bayes）的工作。他开发了被称为贝叶斯方法的基础数学原理，这些方法描述了事件发生的概率，更重要的是描述了当额外信息可用时，应该如何修正概率。\n\
  \n## 6.2 为什么贝叶斯方法非常重要？\n\n贝叶斯学习算法（如朴素贝叶斯分类器）是解决某些类型学习问题的非常实用方法，因为它们可以计算假设的显式概率。在许多情况下，它们与其他学习算法（包括决策树和神经网络算法）同样具有，甚至表现更好。\n\
  \n贝叶斯分类器使用了一个简单的思想：利用训练数据根据特征值计算每个类别的观测概率。当稍后使用同一分类器处理未分类数据时，它使用观测概率来预测新特征最可能属于类别。对训练数据观测结果的应用也可以被看作是将我们的先验知识或先验信念应用到结果的概率上，使其有更高的概率符合实际或现实结果。这个简单的概念被用于贝叶斯规则，并应用于机器学习术语中的机器训练。贝叶斯分类器的一些现实生活应用如下：\n\
  \n*   基于文本的分类，如垃圾邮件过滤、作者识别或主题分类\n*   医学诊断，例如在给定疾病期间观察到某一组症状的情况下，识别新病人患该疾病的概率\n*\
  \   网络安全，如检测计算机中的非法入侵或异常\n\n贝叶斯分类器的优势之一是它们利用所有可用参数来细微地改变预测，而许多其他算法倾向于忽略影响较弱的特征。贝叶斯分类器假设，即使少数单个参数对结果的影响很小，这些参数的集体效应可能很大。对于这类学习任务，朴素贝叶斯分类器是最有效的。\n\
  \n贝叶斯学习方法广受欢迎的某些特性如下：\n\n*   候选假设的先验知识与观测数据相结合，以得出假设的最终概率。因此，两个重要组成部分是每个候选假设的先验概率以及对于每个可能的假设在观测数据集上的概率分布。\n\
  *   贝叶斯学习方法比其他方法更灵活，因为每个观测到的训练模式都可以通过增加或减少关于假设的估计概率来影响假设的结果，而大多数其他算法在假设与单个训练模式不一致时，倾向于舍弃该假设。\n\
  *   贝叶斯方法在验证做出概率预测的假设时，性能可能优于其他方法。例如，在启动一个新软件项目时，根据项目的人口统计，我们可以预测在项目执行期间遇到挑战的概率。\n\
  *   通过贝叶斯方法的简单方法，可以通过结合多个假设的预测（按各自概率加权）对新实例进行分类。\n*   在某些情况下，当贝叶斯方法无法确定性地计算结果时，可以使用它们创建一个最优决策的标准，以此衡量其他方法的性能。\n\
  \n正如我们上面讨论的，贝叶斯方法的成功在很大程度上取决于关于假设集概率的初始知识是否可用。因此，如果我们事先不知道这些概率，就必须使用一些背景知识、以前的数据或对数据集的假设，以及相关的概率分布函数来应用这种方法。此外，得出最优贝叶斯假设通常涉及很高的计算成本。\n\
  \n## 6.3 贝叶斯定理\n\n在讨论贝叶斯定理及其在概念学习中的应用之前，我们应该清楚什么是概念学习。让我们以孩子如何开始学习新词的含义为例，例如“球”（ball）。孩子提供了“球”这类物体的正向示例。起初，孩子可能会被许多不同颜色、形状和大小的球所困扰，也可能被看起来像球的物体（如气球或地球仪）所困扰。孩子的父母不断向她提供正向示例，如“那是球”、“这是球”、“把那个球拿给我”等。概念教学中很少使用负向示例，如“这不是球”，但当父母指着气球说“那不是球”它是气球时，可能会消除孩子的困惑。但观察发现，学习受正向示例的影响最大，而不是负向示例，预想是一旦孩子明确了“球”的概念，她就能从各种物体和放在一起的不同种类的球中识别出“球”这个物体。\n\
  \n将上述学习概念与贝叶斯的数学模型联系起来，我们可以将“学习单词含义”的学习过程等同于使用二分类的概念学习。让我们定义一个概念集 `C` 和一个相应的函数 `f(k)`。我们还定义当\
  \ `k` 在集合 `C` 内部时 `f(k) = 1`，否则 `f(k) = 0`。我们的目标是学习指示函数 `f`，定义哪些元素在集合 `C` 中。因此，通过使用函数\
  \ `f`，我们能够将元素分类在概念集内部或外部。在贝叶斯定理中，学习如何使用标准概率演算来确定函数 `f` 的不确定性，并可以通过提供正向示例来验证分类。\n\
  \n\n\n\n在深入研究贝叶斯定理](#chapter05.xhtml) 的细节之前，将引入一些符号。下面讨论了贝叶斯规则：\n\n![images](img/151-1.png)\n\
  \n其中 `A` 和 `B` 是相关事件，`p(A|B)` 表示事件 `B` 发生时事件 `A` 发生的概率。\n\n假设我们有一个观测数据集 `D`，我们的任务是通过使用\
  \ `D` 的知识在空间 `H` 中确定最佳假设。\n\n### 6.3.1 先验概率 (Prior)\n\n在贝叶斯定理的语文中，关于 `H` 中各种假设的先验知识或信念被称为**先验**。例如，如果我们需要判断特定类型的肿瘤是否为恶性，这种肿瘤的先验知识可以用来验证我们的假设，并简单地称为先验。\n\
  \n让我们引入一些符号来解释这些概念。我们将假设 `P(h)` 是仅根据恶性测试的先验知识，患者患恶性肿瘤 `h` 的初始概率。同样，`P(T)` 是训练数据\
  \ `T` 将被观测到的概率，在这种情况下，测试结果。我们将 `P(T|h)` 记为 `h` 成立时观测到数据 `T` 的概率。\n\n### 6.3.2 后验概率\
  \ (Posterior)\n\n基于先验的特定假设成立的概率被称为后验概率，或简单地称为**后验**。在上面的例子中，考虑到患者患恶性肿瘤的恶性测试先验是后验概率。在我们的符号中，我们感兴趣的是找出\
  \ `P(h|T)`，这意味着给定观测训练数据 `T` 时假设是否成立。这在机器学习语言中被称为后验概率或简单地称为后验。因此，先验概率 `P(h)`（独立于训练数据）现在通过\
  \ `P(h|T)` 的引入而得到了完善。\n\n根据贝叶斯定理\n\n![images](img/151-2.png)\n\n将先验和后验概率结合在一起。\n\
  \n从上面的方程可以推断出，随着 `P(h)` 和 `P(T|h)` 的增加，`P(h|T)` 也会增加，同时也取决于 `P(T)`。简单的解释是，当 `T`\
  \ 独立于 `h` 发生的概率更大时，那么 `h` 从 `T` 中获得支持的概率就较低。\n\n机器学习中的一个常见问题是在给定观测训练数据 `T` 的一组假设集合\
  \ `H` (`h∈H`) 中找到概率最大的假设 `h`。这种概率最大的假设被称为**后验概率 (MAP)**。通过使用贝叶斯定理，我们可以从每个候选假设的后验概率中识别出\
  \ MAP 假设：\n\n![images](img/152-1.png)\n\n由于 `P(T)` 是独立于 `h` 的常量，在这种我们可以我们可以：\n\n\
  ![images](img/152-2.png)\n\n### 6.3.3 似然 (Likelihood)\n\n在某些机器学习问题中，如果 `H` 中的每个假设具有相同的先验概率\
  \ `P(h[i]) = P(h[j])`，我们可以进一步简化方程 6.1，然后仅从概率 `P(T|h)` 确定 `P(h|T)`。因此，`P(T|h)` 被称为给定\
  \ `h` 时数据 `T` 的似然，而任何使 `P(T|h)` 最大化的假设都被称为极大似然 (ML) 假设，`h[ML]`。参见图 6.1 和 6.2，了解贝叶斯定理的概念和数学表示，以及先验、后验和似然之间的关系。\n\
