  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 第 1 章\n\n## 机器学习简介\n\n\
  #### **本章目标：**\n\n\n\n\n本章的目的是带大家进入机器学习领域。初学者在理解机器学习的哲学时往往面临很多困难。此外，他们不知道从何处，也不知道哪些问题可以以及应该使用机器学习工具和技术来解决。本章旨在为新学者提供一个开启机器学习之旅的起点。它从该领域的历史历程开始，并将其向未来，让大家对现代应用一目一斑。\n\
  \n## 1.1 引言\n\n距离计算机程序在被认为需要大量智能的游戏中击败现任世界冠军已经过去了 20 多年。当时那个计算机程序是 IBM 的 `Deep Blue`（深蓝蓝），它击败了世界国际象棋冠军加里·卡斯帕罗夫（Gary\
  \ Kasparov）。那可能正是大多数人开始关注计算机科学中一个快速发展的领域，或者更具体地说人工智能——即机器学习（ML）的时期。\n\n直到今天，机器学习已成为一个成熟的技术领域，应用于生活的几乎每一个领域。它可以向幼儿推荐玩具，就像它能向极客推荐科技书籍，或向作家推荐文学名著一样。它能预测未来市场，以帮助业余交易员与资深股票交易员竞争。它帮助肿瘤学家发现肿瘤是恶性还是良性。它有助于优化能源消耗，从而助力绿色地球事业。谷歌已成为领军者之一，将其大量研究投入到机器学习和人工智能——谷歌自动驾驶汽车和\
  \ `Google Brain`（谷歌大脑）是谷歌在机器学习领域创新之旅中两个最具野心的项目。简而言之，机器学习已成为一种生活方式，无论我们仔细观察生活的哪一个领域。但这一切是从哪里开始的呢？\n\
  \n机器学习的基础始于 18 世纪和 19 世纪。第一项相关工作可以追溯到 1763 年。那一年，托马斯·贝叶斯（Thomas Bayes）在他去世两年后发表了著作《概率论学中某一问题的解决尝试》（An\
  \ Essay towards solving a Problem in the Doctrine of Chances）。这部著作是`贝叶斯定理`（Bayes\
  \ Theorem）的基础，许多机器学习算法都基于此项工作。1812 年，贝叶斯定理由法国数学家皮埃尔·西蒙·拉普拉斯（Pierre-Simon Laplace）正式形式化。最小二乘法作为解决回归问题的基础概念，在\
  \ 1805 年被正式化。1913 年，安德烈·马尔可夫（Andrey Markov）提出了`马尔可夫链`（Markov chains）的概念。\n\n然而，机器学习领域专注工作的真正开始被认为是艾兰·图灵（Alan\
  \ Turing）在 1950 年的开创性工作。在他的论文《计算机器与智能》（Computing Machinery and Intelligence，*Mind*,\
  \ New Series, Vol. 59, No. 236, Oct., 1950, pp. 433–460）中，图灵提出了“机器能思考吗？”换句话说，“机器有智能吗？”。他是第一个提出机器可以“学习”并变得人工智能的人。1952\
  \ 年，IBM 实验室的亚瑟·塞缪尔（Arthur Samuel）开始研究机器学习程序，并首次开发了可以下棋的程序。1957 年，弗兰克·罗森布特（Frank\
  \ Rosenblatt）设计了模拟人类大脑的首个神经网络程序。从那时起，在后的 50 年里，机器学习的旅程异常迷胜。不同的研究人员制定了许多机器学习算法，例如\
  \ 1969 年的最近邻算法、1982 年的循环神经网络、1995 年的支持向量机和随机森林算法。机器学习发展史上的最新光光是谷歌的`AlphaGo` 程序，它利用机器学习技术击败了人类职业围棋选手。\n\
  \n### 思考\n\n*   当 `Deep Blue` 每秒搜索约 2 亿个位置时，卡斯帕罗夫每秒可能只搜索 5 到 10 个位置。然而，他的水平几乎在同一层线上。这清楚地表明，人类拥有某些计算机尚未掌握的“诀窍”。\n\
  *   `Go`（围棋）是一种双人玩的棋盘游戏。它几乎在 2500 年前发明在中国，被认为是最古老的棋类。尽管规则相对简单，但围棋是一个非常复杂的游戏（比国际象棋更复杂），因为它的棋盘更大，可能的走法更多。\n\
  \n从 1950 年开始机器学习的演变见图 1.1。\n\n机器学习领域的快速发展引发了每个人脑海中的一个问题——机器能比人类学得更好吗？要找到答案，第一步就是从人类的角度理解什么是学习。然后，才能对机器学习有更深入的认识。最后，我们需要知道机器学习在生活的各个方面是否已经超越或具有超越人类学习的潜力。\n\
  \n\n**图 1.1** 机器学习的演变\n\n## 1.2 什么是人类学习？\n\n在认知科学中，学习通常是指通过观察获取信息的过程。我们为什么需要学习？在日常生活中，我们需要执行多项活动。这可能是一个像散步或做作业这样简单的任务。也可能是某些复杂的任务，比如决定火箭发射的角度以获得特定的轨迹。要以正确的方式完成任务，我们需要拥有与任务相关的一个或多个事项的先验信息。此外，随着我们不断学习，或者说获取更多信息，执行任务的效率不断提高。例如，随着知识的增加，减少错误完成作业的能力之增强。同样，过去发射的信息有助于采取正确的预防措施并使发射更成功。\n\
  \n## 1.3 人类学习的类型\n\n直觉地想，人类学习以三种方式之一发生——(1) 由该领域的专家直接教我们，(2) 我们根据从专家那里学到的知识间接地地建立自己的概念，或(3)\
  \ 我们自己做，可能是在多次尝试（其中一些是不成功的）之后。第一类学习我们可以称之为专家指导下的学习，第二类属于专家引导的学习，而第三类是自学。让我们通过现实生活的例子深入观察这些类型，并尝试理解它们的含义。\n\
  \n### 1.3.1 专家指导下的学习\n\n婴儿可能会直接从监护者那里吸收某些特征和特性。他把自己的手称为`手`，因为那是他从父母那里获得的信息。天空对他来说是`蓝色`的，因为那是父母教他的。我们说孩子从父母那里`学习`东西。\n\
  \n人生的下一个阶段是孩子开始上学。在学校里，他开始熟悉熟悉字母和数字。然后孩子学习如何从字母组成单词，从数字组成数字。慢慢地，更复杂的学习以句子、段落、复杂的数学、科学等形式发生。孩子能够从已经这些领域知识的老师那里学习所有这些内容。\n\
  \n\n\n随后，这个人开始在某个领域作为专业人士工作。尽管他可能已经在该领域接受了足够的理论学习，但他仍然需要更多地学习他所学知识的实际应用。专业导师凭借他们多年实战经验积累的知识，帮助该领域的所有新人在工作中进行学习。\n\
  \n在人人生的所有阶段，都存在引导式学习的元素。这种学习由某人传授，纯粹是因为他/她已经根据在该领域的经验积累了相关知识。因此，引导式学习是从具有足够知识的人士那里获取信息的过程。\n\
  \n### 1.3.2 由专家获得的知识引导的学习\n\n学习的一个重要组成部分也发生在教师或导师在某个时刻以其他形式/语境传授的知识上。例如，婴儿即使父母没有专门教过他，也能将相同颜色的物体归类。他能够这样做，是因为父母在某个时刻告诉过他什么是蓝色，什么是红色，什么是绿色等。一个大大孩子可以从一组词中选出一个特殊的词，因为它是一个动词，而其他词都是名词。他之所以能做到，是因为他以前被英语老师教会了将单词标记为动词或名词的能力。在职业角色中，一个人能够根据很久以前老板给出的关于偏好的知识，判断出应该向哪些客户开展营销活动。\n\
  \n在所有这些情况下，都不存在直接学习。它是基于某些不同语境下分享的过去信息，被用作决策的学习依据。\n\n### 1.3.3 自主学习\n\n在许多情况下，人类被要求自主学习。一个经典的例子是婴儿学习绕过障碍物走路。他撞到障碍物并多次跌倒，直到他学会每当有障碍物时，他就需要跨越它。他在小时候学骑自行车或成年后学开车时，面临着同样的挑战。并不是所有的事情都是由别人教的。很多事情只能从过去犯的错误中学习。我们倾向于根据自己的经验，对应该做的事和不应该做的事列出一份清单。\n\
  \n## 1.4 什么是机器学习？\n\n在回答“什么是机器学习？”这个问题之前，脑海中浮现出的更基础的问题是：\n\n*   机器真的在学习吗？\n*   如果是，它们是如何学习的？\n\
  *   哪些问题可以被视为良好的学习问题？良好定义一个学习问题需要哪些重要特征？\n\n在开始阶段，将机器学习的定义形式化非常重要。这本身将解决第一个问题，即机器是否真的在学习。定义机器学习有多种方法。但最相关、简洁且被普遍接受的定义是卡内基·梅隆大学计算机科学学院机器学习系教授\
  \ Tom M. Mitchell 所述的。Tom M. Mitchell 将机器学习定义为：\n\n“如果一个计算机程序对于某些任务类 T 和性能指标 P，随着经验\
  \ E 的增加，其在任务 T 中的性能（通过 P 衡量）得到了提高，则称该程序从经验 E 中学习。”\n\n这本质上意味着，如果机器能够通过执行某些任务来积累经验，并提高其未来执行类似任务的性能，那么就可以认为机器在学习。当我们谈到过去的经验时，指的是与任务相关的过去数据。这些数据是从某些源输入到机器的。\n\
  \n在学习国际棋的语境下，`E` 代表玩游戏的经验，`T` 代表玩国际棋的任务，`P` 是由玩家胜率百分比表示的性能指标。同样的映射关系适用于任何其他机器学习问题，例如图像分类问题。在图像分类的语境下，`E`\
  \ 代表带有标签或分配类别的过去数据（例如图像是猫类、狗类还是象大类等），`T` 是给新的未标记图像分配类别的任务，`P` 是由正确分类的百分比表示的性能指标。\n\
  \n任何项目的第一步都是定义你的问题。即使使用最强大的算法，如果解决了错误的问题，结果也是没有意义的。\n\n### 1.4.1 机器是如何学习的？\n\n机器学习的基本过程可以分为三个部分：\n\
  \n1.  **数据输入**：过去的数据或信息作为基础。\n2.  **抽象**：以更广泛的方式表示输入数据。\n3.  **泛化**：对抽象后的表示进行泛化以形成决策。\n\
  \n\n**图 1.2 学习过程**\n\n\n\n\n\n1. `鱼类`：始终生活在水中并产卵\n2. `两栖动物`：半水生，即可以生活在水中也可以生活在陆地上；皮肤光滑；产卵\n\
  3. `爬行动物`：与两栖动物一样半水生；皮肤有鳞；产卵；变冷动物\n4. `鸟类`：会飞；产卵；温血动物\n5. `哺乳动物`：有毛或皮毛；用乳喂养幼崽；温血动物\n\
  \n这使得记忆变得更容易，因为范围现在缩小到只需要知道动物所属的动物分组。关于动物特征的其余答案可以从动物分组及其特征映射的概念中推导出来。\n\n转向机器学习范式，海量的知识可以从数据输入中获得。然而，我们并不是全部使用它，而是从输入数据中绘制出一张概念图，这与上面解释的动物分组到特征的映射非常一致。这无非是机器执行的知识抽象。最后，从输入数据中抽象出的映射可以用于得出关键性结论。例如，如果给出一个动物的分类，就可以自动理解其特征。反之，如果给出一个未知动物的特征，就可以对其所属的动物分组得出确定结论。这就是机器学习语境下的泛化。\n\
  \n### 1.4.1.1 抽象\n\n在机器学习过程中，知识以输入数据的形式馈入。然而，数据不能以原始的形状和形式使用。正如我们在上面的示例看到的，抽象有助于根据输入数据推导出概念图。这张图，或者在机器学习范式中被称为\
  \ `model`（模型），是原始数据的总结性知识表示。模型可以以以下任何一种形式存在：\n\n*   计算块，如 `if/else` 规则\n*   数学方程\n\
  *   特定的数据结构，如树或图\n*   相似观测结果的逻辑分组\n\n用于解决特定学习问题的 `model` 选择是一项人类任务。与模型选择有关的决策是根据多个方面做出的，其中一些列在下方：\n\
  \n*   要解决的问题类型：问题是否与预测或预判、趋势分析、理解对象的不同细分或分组等相关。\n*   输入数据的性质：输入数据的详尽程度、许多字段数据是否没有值、数据类型等。\n\
  *   问题领域：如果问题处于业务关键领域，且具有高数据输入率并需要即时推理，例如银行领域的反欺诈检测问题。\n\n一旦选择了 `model`，接下来的任务是根据输入数据拟合\
  \ `model`。让我们通过一个例子来理解这一点。在 `model` 由数学方程表示的情况下，例如 `y = c[1] + c[2]*x`（该模型被称为简单线性回归，我们将在后面的章节学习），根据输入数据，我们必须找到\
  \ `c[1]` 和 `c[2]` 的值。否则，方程（或 `model`）将毫无用处。因此，在这种情况下，拟合 `model` 意味着找到方程或模型中未知系数或常数的数值。这种基于输入数据拟合模型的\
  \ `process` 被称为 `training`（训练）。此外，用于确定模型的 `input data` 被称为 `training data`（训练数据）。\n\
  \n### 1.4.1.2 泛化\n\n机器学习过程的第一部分是抽象，即将以输入数据形式进入的知识抽象为 `model`。然而，这种抽象过程（或者更通俗的说是训练\
  \ `model`）只是机器学习的一部分。另一个关键部分是将抽象的知识调整为一种可以用于做出未来决策的形式。这是作为 `generalization`（泛化）的一部分实现的。这部分非常难以实现。这是因为\
  \ `model` 是基于有限的数据集训练的，这些数据可能仅具有有限的特征。但当我们想要应用 `model` 对一组未知数据（通常称为 `test data`，测试数据）做出决策时，我们可能会遇到两个问题：\n\
  \n1.  训练好的 `model` 与 `training data` 对齐过头，因此可能无法描述实际趋势。\n2.  `test data` 具有某些 `training\
  \ data` 显然未知的特征。\n\n因此，精确的决策方法将行不通。必须采用一种近似或启发式的方法，类似于人类中基于直觉的决策。这种方法存在无法做出正确决策的风险——这显然是因为所做的的某些假设在现实中可能并不成立。但就像机器一样，当人类基于直觉或感觉做出决策时（在无法进行基于精确理由的决策的情况下），人类也会犯同样的错误。\n\
  \n### 1.4.2 良好定义的学习学习问题\n\n为了定义一个可以使用机器学习解决的新问题，可以使用下面强调的简单框架。该框架也有助于判断该问题是否是使用机器学习解决的合适候选者。该框架涉及回答三个问题：\n\
  \n1. 什么是问题？\n2. 为什么需要解决这个问题？\n3. 如何解决这个问题？\n\n####  1：什么是问题？\n\n应该收集哪些信息以确定什么是问题。\n\
  \n**问题的非正式描述**，例如：我需要一个程序，在我打字时提示下一个单词。\n\n##### 形式化\n\n使用上述机器学习形式化来定义问题的 `T`、`P`\
  \ 和 `E`。\n\n例如：\n\n*   任务 (`T`)：在我打字时提示下一个单词。\n*   经验 (`E`)：常用词汇的语料库。\n*   性能 (`P`)：正确提示单词的百分比（这在机器学习中被称为准确率）。\n\
  \n**假设 -** 创建一个关于问题的假设列表。\n\n##### 相似问题\n\n你见过或能想到哪些和你尝试解决的问题相似的问题？\n\n####  2：为什么需要解决这个问题？\n\
  \n##### 动机\n\n解决问题的动机是什么？它将满足什么需求？\n\n例如，这个问题是否解决了任何长期存在的业务问题，如发现潜在的欺诈交易？或者目的更简单，如为即将到来的周末推荐一些电影。\n\
  \n##### 解决方案优点\n\n考虑解决问题的优点。它赋予了什么能力？\n\n清楚地理解解决问题的优点是非常重要的。这些优点可以用来推销项目。\n\n#####\
  \ 解决方案用途\n\n解决方案将如何被使用，预期寿命是多久？\n\n####  3：我会如何解决这个问题？\n\n尝试探索如何手动解决问题。详细说明解决问题的步骤收集、数据准备和程序设计。收集所有细节并更新问题定义之前的部分，特别是假设。\n\
  \n##### 总结\n\n*   **步骤 1 ：什么是问题？** 以正式和正式的形式描述问题，并列出假设和相似问题。\n*   **步骤 2 ：为什么需要解决这个问题？**\
  \ 列出解决问题的动机、解决方案提供的优点以及如何使用解决方案。\n*   **步骤 3 ：我会如何解决这个问题？** 描述如何手动解决问题，以提取领域知识。\n\
  \n#### **你知道吗？**\n\n\n\n\n索尼创造了一系列名为 Aibo 的机器人宠物。它于 1998 年诞生。尽管售出的大部分模型都像狗，但其他灵感来源还包括幼狮。它能够表达情感，还能识别主人。2006\
  \ 年，Aibo 被列入卡内基梅隆大学的“机器人名人堂”。新一代 Aibo 于 2018 年 1 月在日本在日本发布。\n\n## 1.5 机器学习的类型\n\n\
  如图 1.3 所示，机器学习可以分为三大类：\n\n1. 监督学习 – 也称为预测性学习。机器根据相似对象的先验类别相关信息，预测未知对象的类别。\n2. 无监督学习\
  \ – 也称为描述性学习。机器通过将相似对象归为类，在未知对象中发现模式。\n3. 强化学习 – 机器学习自主行动以实现既定目标。\n\n\n**图 1.3**\
  \ 机器学习的类型\n\n### 你知道吗？\n\n许多视频游戏基于名为“专家系统”的人工智能技术。这种技术可以模仿人类行为的领域，目标是模拟人类感官、感知和推理的能力。\n\
  \n### 1.5.1 监督学习\n\n监督学习的主要动力是从过去信息中学习。那么，机器进行监督学习需要哪种过去信息呢？它是机器必须执行的任务信息。在机器学习定义的语境下，这些过去信息就是“经验”。让我们尝试通过一个例子来理解它。\n\
  \n假设某机器接收不同对象的图像作为输入，任务是根据对象的形状或颜色对图像进行分类。如果是根据形状，圆形对象的图像需要与三角形对象的图像分开，以此此类推。如果需要根据颜色进行分类，则蓝色对象的图像需要与绿色对象的图像分开。但机器如何知道什么是圆形、什么是三角形呢？同样，机器如何根据颜色是蓝色还是绿色来区分对象的图像呢？机器就像一个小孩子，在开始执行任务之前，需要父母或成人提供形状和颜色的基础信息。机器需要被提供基础信息。这种基础输入，或者在机器学习范式中被称为经验，是以`training\
  \ data` 的形式提供的。训练数据是关于特定任务的过去信息。在图像分类问题的背景下，训练数据将包含许多图像在不同方面或特征上的过去数据，以及关于图像是圆形还是三角形、是蓝色还是绿色的标签。这个标签被称为`label`，我们说在监督学习的情况下，训练数据是有标记的。\n\
  \n图 1.4 是监督学习过程的简单描述。包含过去信息的标记训练数据作为输入。根据训练数据，机器建立一个预测模型，该模型可以用于测试数据，为测试数据中的每条记录分配标签。\n\
  \n\n**图 1.4** 监督学习\n\n监督学习的一些示例包括：\n\n* 预测游戏结果\n* 预测肿瘤是良性还是恶性\n* 预测房地产、股票等领域的价格\n\
  * 分类文本，例如将一组电子邮件分类为垃圾邮件或非垃圾邮件\n\n现在，让我们考虑上述两个例子，例如“预测肿瘤是良性还是恶性”和“预测房地产等领域的价格”。这两个问题在本质上相同吗？答案是“不相同”。尽管它们都是预测问题，但在一种情况（，我们正试图预测未知数据属于哪个类别或种类，而在另一种情况中，我们试图预测的是一个绝对值而不是类别。当我们试图预测分类或名义变量时，该问题被称为`classification`（分类）问题。而当我们试图预测一个实值变量时，该问题属于`regression`（回归）类别。\n\
  \n### 注意：\n\n监督机器学习的好坏取决于用于训练它的数据。如果训练数据质量差，预测结果也将不精确。\n\n让我们尝试更详细地理解监督学习的这两个领域，即分类和回归。\n\
  \n#### 1.5.1.1 分类\n\n让我们讨论如何根据形状对对象图像进行分类。如果图像是圆形对象，它被归为一类；如果图像是三角形对象，则归为另一类。机器应该将未知类别的图像（在机器学习术语中称为`test\
  \ data`）放在哪一类，取决于它从过去数据（我们称之为训练数据）中获得的信息。由于训练数据对每张图像都有定义的标签或类别，机器必须将新图像或测试数据映射到与其相似的图像集，并为测试数据分配相同的标签或类别。\n\
  \n因此我们观察到，整个问题围绕着根据训练数据提供的标签、类别或种类信息为测试数据分配标签、类别或种类。由于目标目标是分配类别标签，这类问题被称为分类问题。图\
  \ 1.5 描述了分类的典型过程。\n\n\n**图 1.5** 分类\n\n有很多流行的机器学习算法可以帮助解决分类问题。例如几个，朴素贝叶斯（Naïve Bayes）、决策树和\
  \ k 近邻（k-Nearest Neighbour）算法被许多机器学习从业者采用。\n\n在银行领域，一个关键的分类问题是识别潜在的欺诈交易。由于有数百万交易需要审查并确保其是否可能是欺诈交易，人类无法完成这项任务。机器学习被有效利用来执行这项任务，这是分类的经典案例。根据过去的交易数据（特别是标记为欺诈的交易），所有新进入的交易都被标记为正常或可疑。可疑交易随后会被分离以进行更仔细的审查。\n\
  \n总之，分类是监督学习的一种，它根据训练数据提供的信息为测试数据预测一个类别类型的目标特征。该目标类别特征被称为`class`。\n\n一些典型的分类问题包括：\n\
  \n* 图像分类\n* 疾病预测\n* 游戏胜负预测\n* 自然灾害预测（如地震、洪水等）\n* 手写体识别\n\n#### 1.5.1.2. 回归\n\n\n\
  \n\n\n在线性回归中，目标是预测如房地产或股票价格、温度、考试成绩、销售收入等数值特征。底层的预测变量和目标变量在性质上都是连续的。在线性回归中，利用统计学中的最小二乘法，在预测变量和目标变量之间“拟合”出直线关系。与最小二乘法一样，其目标是使目标变量实际值与预测值之间的误差平方和最小。在简单线性回归中，只有一个预测变量；而在多元线性回归中，模型中可以包含多个预测变量。\n\
  \n让我们以销售经理的年度预算编制为例。他们必须根据往年的销售数据以及投入的投资情况，对下一年的销售给出预测。显然，与过去的数据以及待预测的数据在性质上都是连续的。在基本方法中，可以使用简单线性回归模型，将投资作为预测变量，销售收入作为目标变量。\n\
  \n图 1.6 显示了一个典型的简单回归模型，其中回归线是根据目标变量相对于预测变量的值拟合的。典型的线性回归模型可以表示为形式——\n\n\n其中 `x` 是预测变量，`y`\
  \ 是目标变量。\n\n输入数据来自由英国统计学家和生物学家罗纳德·费舍（Ronald Fisher）的著名多变量数据集鸢尾花。该数据集包含三个鸢尾花的各 50\
  \ 个样本——*Iris setosa*（三角鸢尾）、*Iris virginica*（长叶鸢尾）和*Iris versicolor*（三色鸢尾）。每个样本测量了四个特征——花萼长度、花萼宽度、瓣长度和瓣宽。这些特征可以唯一地区分不同的花种。\n\
  \n鸢尾数据集通常用于训练，以解决基于特征值预测花种的分类问题。然而，我们也可以通过预测特征值来利用该数据集来演示回归。在图 1.6 中，我们可以通过使用一个特征的值来预测另一个特征的值来演示回归。\n\
  \n\n**FIG. 1.6** 回归\n\n回归的典型应用包括：\n\n*   零售需求\n*   销售预测\n*   天气预测\n*   市场需求\n\n\
  ### 1.5.2 无监督学习\n\n与监督学习不同，无监督学习中没有标记数据可以学习，也不进行预测。在无监督学习中，目标是获取数据集并发现其中的分组或模式。因此，无监督学习通常被称为描述性模型。无监督学习的一个关键应用是客户细分。\n\
  \n聚类是无监督学习的主要类型。它旨在将相似的对象聚集在一起。属于同一个簇的对象是非常相似的，而属于不同簇的对象则非常不同。聚类的目标是发现数据的内在分组，如图\
  \ 1.7 所示。常用的相似性度量之一是距离。如果两个数据项之间的距离较小，则被认为是同一个簇的一部分。同样，如果数据项之间的距离很大，通常不属于同一个簇。这被称为基于距离的聚类。图\
  \ 1.8 展示了高层面的聚类过程。\n\n\n**FIG. 1.7** 基于距离的聚类\n\n除了数据聚类并获取摘要视图，无监督学习的另一种变体是关联分析。在关联分析中，识别数据元素之间的关联性。让我们通过最常见的例子之一，如图\
  \ 1.9 所示的市场篮分析来理解关联分析的方法。\n\n\n### 1.5.3 强化学习\n\n我们见过婴儿在没有任何先验知识的情况下学会走路。我们经常好奇他们是如何做到的。他们以一种相对简单的方式这样做。首先他们注意到周围有人走路，例如父母或周围的任何人。他们理解必须一次使用一条腿走路。走路时，他们有时会撞到障碍物倒下，而有时又能平畅地避开凹凸不平。\n\
  \n同样，机器经常学会自主执行任务。让我们通过孩子学习走路的例子来理解。要尝试实现的动作是走路，孩子是智能体，而孩子尝试行走的地方类似于环境。它试图提高完成任务的表现。当成功完成子任务时，会给予奖励。当子任务执行不正确时，显然不给予奖励。这种过程一直持续到机器能够完成整个任务的执行。这种学习过程被称为强化学习。图\
  \ 1.10 捕捉了强化学习的高层过程。\n\n\n**FIG. 1.10** 强化学习\n\n\n\n\n\n- RL 是个性化在线营销的有效工具。它能实时考虑用户的人口统计细节和浏览历史，以展示最相关的广告。\n\
  \n## 1.5.4 比较 – 监督学习、无监督学习和强化学习\n\n\n## 1.6 不宜使用机器学习解决的问题\n\n机器学习不应应用于那些人类处理非常高效或需要人类频繁干预的任务。例如，空中交通管制是一项非常复杂的任务，需要人类的高度参与。与同时，对于可以使用传统编程范式实现的简单任务，使用机器学习是没有意义的。例如，简单的规则驱动或基于公式的应用程序（如价格计算器引擎、纠纷跟踪应用等）不需要机器学习技术。\n\
  \n只有当业务流程存在缺陷时，才应该使用机器学习。如果任务已经过优化，引入机器学习将无法证明其投资回报的合理性。\n\n在训练数据不足的情况下，机器学习无法有效使用。这是因为，在训练数据量较小的情况下，坏数据的影响会呈指数级恶化。为了保证预测或推荐的质量，训练数据应该是足够大的。\n\
  \n## 1.7 机器学习的应用\n\n只要有大量的历史数据，就可以使用机器学习从数据中生成可操作的洞察。尽管机器学习在每个业务领域以多种形式被采用，但我们在下面涵盖了三个主要领域，旨在让大家了解可以使用机器学习执行哪些类型的操作。\n\
  \n### 1.7.1 银行与金融\n\n在银行业，欺诈交易（尤其是与信用卡相关的交易）非常普遍。由于交易量和速度极快，全球几乎所有领先银行都实施了高性能的机器学习解决方案。这些模型基于实时运行，即在欺诈交易发生的瞬间就能被发现并阻止。这有助于避免在处理客户对这些欺诈交易提出的纠纷时产生大量的运营麻烦。\n\
  \n银行客户经常会收到其他竞争银行提供的优厚方案。更高的银行利率、更低的贷款手续费、零余额储蓄账户、无透支罚金等方案旨在吸引客户转到竞争银行。此外，有时客户会因为银行服务质量差而失去动力，并转向竞争银行。机器学习有助于防止或至少减少客户流失。描述性学习和预测性学习都可以用于减少客户流失。使用描述性学习，可以发现问题的特定环节，即特定的银行、特定的区域或特定类型的业务（如汽车贷款）流失率最高的地方。显然，这些是问题区域，需要进一步调查以发现并修复根源。使用预测性学习，可以识别出可能很快离开银行的易感客户。可以采取适当行动确保这些客户留下来。\n\
  \n### 1.7.2 保险\n\n保险业是数据密集型行业。因此，机器学习在保险行业被广泛使用。保险行业中使用机器学习两个主要领域是新客户入驻期间的风险预测和理赔管理。在客户入期间，需要根据历史信息预测新客户的风险状况。根据预测的风险量为客户生成报价。\n\
  \n### 1.7.3 医疗健康\n\n可穿戴设备的数据为机器学习提供了丰富的来源。一旦出现问题，可以向个人和医疗提供者发送警告。机器学习结合计算机视觉在医学影像诊断中也起着至关重要的作用。\n\
  \n## 1.8 机器学习中的先进语言/工具\n\n与不同机器学习任务相关的算法众所周知，可以使用任何语言/平台实现。然而，某些语言和工具是专注于实现机器学习而开发的。下面涵盖了其中几个被广泛使用的工具。\n\
  \n### 1.8.1 Python\n\nPython 是机器学习社区广泛采用的最流行的开源编程语言之一。它由 Guido van Rossum 设计，并于\
  \ 1991 年首次发布。Python 的参考实现 `CPython` 由 Python 软件基金会管理，这是一个非营利组织。\n\nPython 拥有强大的高级数学功能库\
  \ (`NumPy`)）、算法和数学工具库 (`SciPy`) 以及数值绘图库 (`matplotlib`)）。在这些库的基础上，有一个名为 `scikit-learn`\
  \ 的机器学习库，它包含了各种分类、回归和聚类算法。\n\n### 1.8.2 R\n\nR 是一种用于统计计算和数据分析的语言。它是一种开源语言，在学术界非常受欢迎——特别是在统计学家和数据挖掘者中。R\
  \ 被认为是 `S` 语言的变体，`S` 是贝尔实验室开发的 GNU 项目。目前，它由 R 统计基金会支持。\n\nR 是一种非常简单的编程语言，为机器学习的不同阶段提供了大量的库。在流行程度上突出的一些库包括\
  \ `plyr`/`dplyr`（用于数据转换）、`caret`（分类和回归训练）、`RJava`（便于与 Java 集成）、`tm`（用于文本挖掘）、`ggplot2`（用于数据可视化）。\n\
  \n### 1.8.3 Matlab\n\n\n\n\nMATLAB (矩阵实验室) 是一种受许可的商业软件，对广泛的数值计算提供强大的支持。MATLAB 在工业界和学术界拥有庞大的用户群。MATLAB\
  \ 由 `MathWorks` 开发，这是一家成立于 1984 年的公司。作为一种专有软件，MATLAB 的开发更加专业，经过了严格的测试，并拥有完善的文档。\n\
  \nMATLAB 还对统计函数提供了广泛的支持，并内置了大量的机器学习算法。它还能够通过集群和云端上的并行处理，扩展到处理大规模数据集。\n\n## 1.8.4\
  \ SAS\n\nSAS（早期名为“统计分析系统”）是另一种受许可的商业软件，为机器学习功能提供强力支持。SAS 由 `SAS Institute` 使用 C\
  \ 语言开发，于 1976 年首次发布。\n\nSAS 是一个由不同组件组成的软件套件。基础的数据管理功能嵌入在 `Base SAS` 组件中，而其他组件如 `SAS/INSIGHT`、`Enterprise\
  \ Miner`、`SAS/STAT` 等则帮助实现与数据挖掘和统计分析相关的专门功能。\n\n## 1.8.5 其他语言/工具\n\n还有许多其他支持机器学习功能的语言和工具。`SPSS`（原名为社会科学统计软件包）归\
  \ `IBM` 所有，是一个支持专门数据挖掘和统计分析的流行软件包。`SPSS` 最初在社会科学的统计分析中非常流行（正如其名称所示），现在在其他领域同样流行。\n\
  \n`Julia` 发布于 2012 年，是一种用于数值分析和计算科学的开源、采用自由许可的编程语言。它融合了 `MATLAB`、`Python`、`R` 以及其他用于机器学习的编程语言的所有优点，因此它正获得机器学习开发社区的持续关注。`Julia`\
  \ 的另一个大优势是它能够实现高性能的机器学习算法。\n\n## 1.9 机器学习面临的问题\n\n机器学习是一个相对较新且仍在不断演变的领域。此外，机器学习工具和技术的研究水平及使用情况在不同之间存在巨大差异。不同国家的法律法规、文化背景、人们的情感成熟度不相同。这些因素使得机器学习的使用以及由机器学习使用产生的问题非常不同。\n\
  \n机器学习引发的最大恐惧和问题与隐私及其泄露有关。学习的主要重点是分析数据（包括过去和现在的数据），并从数据中得出洞察。这些洞察可能涉及个人，而揭示的事实可能足够隐私以保持保密。此外，不同的人在信息共享方面有不同的偏好。有些人可能愿意公开分享某种程度的信息，但另一些人可能不愿向所有朋友分享，而将其限制在家庭成员范围内。经典的例子如出生日期（不是具体的某一天，而是整个日期）、与家人约会的照片、教育背景等。有些人会在\
  \ `Facebook` 等社交平台上与所有人分享这些信息，而另一些人则不会，或者如果分享了，也可能仅限朋友可见。当使用这些信息实现机器学习算法时，人们可能会无意中感到不悦。例如，如果存在一种利用信息的学习算法。\n\
  \n## 1.10 总结\n\n- 机器学习吸收了从经验中学习的哲学。\n- 基础的机器学习过程可以分为三个部分：\n    - **输入**：利用过去的数据作为未来的基础。\n\
  \    - **抽象**：以总结的方式表示输入数据。\n    - **泛化**：将抽象的表表示进行泛化，以形成决策。\n- 机器学习可以分为三类：\n  \
  \  - **监督学习**：也称为预测学习。目标是根据先验信息预测类别/值。例如：肿瘤是恶性的还是良性的、房产等领域的价格预测。\n    - **无监督学习**：也称为描述性学习，通过对相似对象分组来发现未知对象中的组或模式。例如：客户细分、推荐系统。\n\
  \    - **强化学习**：机器学会行动以实现给定目标。例如：自动驾驶汽车、智能机器人。\n- 机器学习已被多个领域采用，如银行金融服务、保险、医疗健康、生命科学。\n\
  - 实现机器学习的一些常用平台包括 `Python`、`R`、`MATLAB`、`SAS` 和 `SPSS`。\n- 应用机器学习之前需要进行关键考虑。\n\n\
  ## 示例题\n\n### 单选题（每题 1 分）：\n\n1. 机器学习是一个 ___ 领域。\n   1. 跨学科\n   2. 单一\n   3. 多学科的\n\
  \   4. 以上所有\n\n2. 如果一个计算机程序对于某些任务 T 和性能衡量标准 P，通过经验 E 使其在任务 T 上的性能（由 P 衡量）有所提高，则说它从\
  \ E 中学习了。\n   1. 训练\n   2. 经验\n   3. 数据库\n   4. 算法\n\n3. ___ 已用于训练车辆在道路上正确且自动地行驶。\n\
