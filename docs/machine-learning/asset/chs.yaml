  \n# 2. 离散度量\n### 2.1 数据离散程度 – 方差、标准差\n### 2.2 不同数据值的分布 – 分位数、四分位距 (IQR)\n\n在 R 语言中，有一个函数\
  \ `summary`，它可以生成数据集属性的概括统计量。它提供了对数据集的初步理解，并能引发对数据集以及可能存在的异常的思考。我们将使用另一个诊断函数 `str`，它能够紧凑地提供数据框（data\
  \ frame）的结构以及不同属性的数据类型。现在，让我们开始探索来自加利福尼亚大学欧文分校（UCI）机器学习库的 `Auto MPG 数据集`。我们将对 Auto\
  \ MPG 数据集运行 `str` 和 `summary` 命令。\n\n![images](img/326-1.png)![images](img/327-1.png)\n\
  \n仔细观察 `summary` 命令的输出，针对属性列出了六项度量（嗯，大多数属性都是如此）。这些是：\n\n1. Min. – 属性的最小值\n2. 1st\
  \ Qu. – 第一四分位数（详细信息请参考第 2 章）\n3. Median 中位数\n4. Mean 平均值\n5. 3rd Qu. – 第三四分位数（详细信息请参考第\
  \ 2 章）\n6. Max. – 属性的最大值\n\n这些度量对数据集属性提供了相当好的理解。现在注意，属性 `car.name` 并没有显示这些值，而是显示了其他内容。这是为什么呢？它显示的是什么值？让我们尝试理解这种差异的原因。\n\
  \n`car.name` 属性是一个名义变量，即分类属性。正如我们在第 2 章中已经看到的，对名义变量无法进行数学或统计操作。因此，只给出了属性的唯一值以及出现的次数或频率。我们可以使用以下\
  \ R 命令获取名义属性的完整列表。\n\n![images](img/327-2.png)![images](img/328-1.png)\n\n接下来，让我们尝试探索任何变量在数据值上是否存在需要进行清洗的问题。正如在第\
  \ 2 章中讨论的，可能存在两个主要数据问题：缺失值离群值。\n\n让我们首先尝试确定任何属性是否存在缺失值。让我们使用一小段 R 代码来查找数据中的某个属性是否存在缺失/不期望的值。如果存在此类问题，则返回该属性具有缺失/不期望值的行。通过检查所有属性，我们发现\
  \ `horsepower` 属性存在缺失值。\n\n![images](img/328-2.png)\n\n数据集中有六行的 `horsepower` 属性存在缺失值。在继续建模活动之前，我们必须修复这些行。我们很快就会处理这一点。\n\
  \n检测离群值最简单且有效的方法是通过属性的箱线图。在箱线图中，离群值被非常清晰地突出显示。当我们稍后使用箱线图探索属性时，将对此方面有一个清晰的视图。\n\n\
  让我们快速查看其他用于获取数值属性统计测量的 R 命令。\n\n```\nrange(data$mpg) #给出最小值和最大值\n[1] 9.0 46.6\n\n\
  diff(range(data$mpg))\n[1] 37.6\n\nquantile(data$mpg)\n0% 25% 50% 75% 100%\n9.0\
  \ 17.5 23.0 29.0 46.6\n\nIQR(data$mpg)\n[1] 11.5\n\nmean(data$mpg)\n[1] 23.51457\n\
