  ![images](img/152-5.png)\n\n**图 6.2**\n\n**先验、后验和似然的概念**\n\n#### 思考要点：\n\n根据相关事件的概率得出事件的完善概率是一个强大的概念，与我们日常处理事件以及利用我们的知识影响决策密切相关。\n\
  \n**示例**。让我们以特定患者肿瘤的恶性识别作为贝叶斯规则的应用。我们将计算样本人群中病例百分的先验知识以及测试结果正确的概率如何影响正确诊断的概率结果。我们有两个备选假设：(1)\
  \ 特定肿瘤是恶性类型，(2) 特定肿瘤是非恶性类型。可用的先验信息有——1. 只有 0.5% 的人口患这种恶性肿瘤；2. 实验室报告存在某种不准确性，因为它只能以\
  \ 98% 的准确率检测出恶性的存在，而只有在 97% 的情况下才能正确显示不存在恶性。这意味着测试预测存在恶性，而这实际上在 2% 的情况下是误报，并在 3%\
  \ 的情况下也漏检了真正的恶性肿瘤。\n\n**解**：让我们用恶性肿瘤 = MT，阳性实验室测试 = PT，阴性实验室测试 = NT\n\n`h[1]` =\
  \ 特定肿瘤是恶性类型 = MT\n\n`h[2]` = 特定肿瘤不是恶性类型 = !MT\n\n`P(MT) = 0.005` `P(!MT) = 0.995`\
  \ `P(PT|MT) = 0.98` `P(PT|!MT) = 0.02` `P(NT|!MT) = 0.97` `P(NT|MT) = 0.03`\n\n\
  所以，对于新患者，如果实验室测试报告显示阳性结果，让我们看看是否应该将其宣布为恶性病例：\n\n![images](img/153-1.png)\n\n由于 `P(h[2]|PT)`\
  \ 高于 `P(h[1]|PT)`，显然假设 `h[2]` 更有可能。因此，`hMAP` = `h2` = !MT。\n\n这表明即使恶性的后验概率显著高于非恶性，但基于先验知识，患者不患恶性的概率仍然更高。此外，应该注意到，通过贝叶斯定理，我们识别出一个假设的概率高于另一个，而并没有通过该定理完全接受或拒绝假设。此外，贝叶斯定理的成功应用高度依赖先验数据的可用。\n\
  \n## 6.4 贝叶斯定理与概念学习\n\n概念学习的一种简单观点可以是，如果我们向机器输入训练数据，它就可以计算假设的后验概率并输出概率最大的假设。这也被称为暴力贝叶斯学习算法，而且观察到该算法提供正确概率假设的一致性与其他算法非常相当。\n\
  \n### 6.4.1 暴力贝叶斯算法\n\n\n\n\n我们现在讨论如何使用 MAP 假设的输出来设计一种名为暴力 MAP 学习算法的简单学习算法。假设学习者考虑一个有限的假设空间\
  \ `H`，其中学习者将尝试学习某个目标概念 `c:X → {0,1}`，其中 `X` 是对应 `H` 的实例空间。训练示例的序列为 `{(x[1], t[1]),\
  \ (x[2], t[2]),…, (x[m], t[m])}`，其中 `x[i]` 是 `X` 的实例，`t[i]` 是 `x[i]` 的目标概念，定义为 `t[i]\
  \ = c(x[i])`。在不影响算法效率的情况下，我们可以假设实例 `x` 的实例序列 `{x[1],…, x[m]}` 是固定的，那么目标值序列就变为 `T\
  \ = {t[1],…, t[m]}`。\n\n为了计算最高后验概率，我们可以使用本章之前讨论过的贝叶斯定理：\n\n计算 `H` 中每个假设 `h` 的后验概率：\n\
  \n![images](img/154-1.png)\n\n识别具有最高后验概率的 `h[MAP]`\n\n`h[MAP] = argmax[h∈H]P(h|T)`\n\
  \n请注意，计算每个假设的后验概率需要巨大的计算量，对于大量的假设空间，这可能很难实现。\n\n让我们尝试将概念学习问题与识别 `h[MAP]` 的问题联系起来。基于概率分布\
  \ `P(h)` 和 `P(T|h)`，我们可以推导出学习任务的先验知识。需要做出以下几个重要的假设：\n\n1. 训练数据或目标序列 `T` 是无噪声的，这意味着它仅是\
  \ `X` 的直接函数（即 `t[i] = c(x[i])`）\n2. 概念 `c` 位于假设空间 `H` 之中\n3. 每个假设的概率相等，且相互独立\n\n\
