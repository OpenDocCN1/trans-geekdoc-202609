  \ pdf 本身并不代表概率。对 pdf 在连续区间上积分才产生概率。\n\n### 5.5 一些常见的离散分布\n\n在本节中，我们将讨论定义在离散状态空间（包括有限空间和可数无限空间）上的某些常用参数分布。\n\
