  \n#### 5.7.1 二元随机变量\n\n考虑实验样本空间 `S` 中的两个随机变量 `X` 和 `Y`。那么这对 `(X, Y)` 被称为二元随机变量或二维向量，其中\
  \ `X` 和 `Y` 的每一个都与 `S` 中的每个元素对应一个实数。二元变量 `(X, Y)` 的范围由 `R[xy]` 表示，且`(X, Y)` 可以看作是一个函数，它为\
  \ `S` 中的每个点 `ζ` 分配一个点 `(x, y)`。\n\n![images](img/134-5.png)\n\n如果 `X` 和 `Y` 都是离散的，则`(X,\
  \ Y)` 是离散二元变量；如果 `X` 和 `Y` 都是连续的，则`(X, Y)` 是连续二元变量；如果 `X` 和 `Y` 其中一个是离散的另一个是连续的，则为混合二元变量。\n\
  \n#### 5.7.2 联合分布\n\n`X` 和 `Y` 的联合累积分布函数（联合 cdf）定义为：\n\n![images](img/135-1.png)\n\
