  \ 聚类的 2-维和 3-维图\n\n#### B5.4 神经网络\n为了在 Python 中实现神经网络，`neurolab` 是一个极佳的选择。它是一个用于\
  \ Python 的简单且功能强大的神经网络库。你可以在命令行提示符中使用以下命令安装 `neurolab`：\n```bash\npip install neurolab\n\
  ```\n更多更多细节请参阅图 B.9。\n![images/392-2.png)\n\n**图 B.9** 从命令行提示符安装 neurolab\n让我们首先实现一个单层前馈神经网络。我们可以使用与第\
  \ 10 章, 第 10.6.2 节 示例相同的数据集。数据如下所示，输出见图 B.10。\n- `p1 = (5, 2)` 和 `p2 = (-1, 12)`\
  \ 属于 `c1`\n- `p3 = (3, -5)` 和 `p4 = (-2, -1)` 属于 `c2`\n这可以总结为：\n![images/393-1.png)\n\
  \n现在让我们开始编程。\n```python\nimport neurolab as nl\nimport matplotlib.pyplot as plt\
  \ # 绘制结果\ninput = [[5, 2], [-1, 12], [3, -5], [-2, -1]]\ntarget = [[1], [1], [2],\
  \ [2]]\n# 创建具有 2 个输入和 1 个神经元的单层神经网络\nnet = nl.net.newp([-2, 12], [1, 2], 1) # 函数\
  \ newp 用于实现单层感知器\nerror = net.train(input, target, epochs=10, show=10, lr=0.1)\n\
  plt.plot(error)\nplt.xlabel('Epoch number')\nplt.ylabel('Train error')\nplt.grid()\n\
  plt.show()\n```\n![images/393-2.png)\n**图 B.10** 单层神经网络中迭代次数与误差的关系\n\n接下来我们实现一个多层前馈神经网络。在这种情况下，我们可以有多个隐藏层。在本例中，我们将使用多层神经网络作为回归器，即预测连续变量。首先在指定范围内生成了一组\
  \ 75 个预测变量值。使用方程 `y = 4x² + 7.6` 生成对应的目标值并进行归一化。使用这组点训练多层神经网络。然后，使用训练好的模型生成预测值，并与从回归函数生成的实际数据点进行比较。\n\
  \n```python\nimport neurolab as nl\nimport matplotlib.pyplot as plt\n# 创建训练样本，假设最小值为\
  \ -2，最大值为 2，训练点数为 75\nminm_val = -2\nmaxm_val = 2\nno_points = 75\nx = np.linspace(minm_val,\
  \ maxm_val, no_points)\ny = 4*np.square(x) + 7.6\ny /= np.linalg.norm(y)\ninput_data\
  \ = x.reshape(no_points,1)\ntarget = y.reshape(no_points,1)\n# 创建具有 2 个隐藏层的网络 -\
  \ 第一层有 12 个神经元，第二层有 8 个神经元\n# 任务是预测值\nnet = nl.net.newp([-2, 12], [1, 2], 1)\n#\
  \ 然后将训练算法设置为梯度下降\nerror = net.train(input, target, epochs=200, show=100,\n=0.01)\n\
  # 模拟网络生成预测\noutput_data = net.sim(input_data)\n# 绘制结果\nplt.plot(x, output_data,\
  \ 'r')\nplt.plot(x, y, 'b')\nplt.legend(['Predicted', 'Actual'])\nplt.title('Actual\
  \ vs predicted')\nplt.grid()\nplt.show()\n```\n\n\n\nGT 观察到，Newtel 服务中心有大量的服务请求，这些请求在问题类型上具有重复性。这从服务请求的文本中显而易见。此外，在大多数情况下，客户需要遵循某些标准步骤来解决问题。因此，GT\
  \ 专家推断，可以通过机器学习算法根据历史服务请求创建聚类服务请求的“桶（buckets）”。对于每个“桶”，都可以关联一组相应的标准解决方案。每当有新的服务请求到达\
  \ Newtel 服务中心时，另一个机器学习算法将识别出新请求应该标记的“桶”，提取出相应的标准解决方案并发送给客户。所有这些过程都将在没有任何人工干预的情况下完成。因此，可以在不增加额外人员的情况下处理额外的呼叫量。这将显著减少对额外人力的需求，从而对运营成本和盈利能力产生影响。\n\
  \n在 GT 提供的解决方案中，存储中的服务请求通过特定描述性字段的文本分析、解决每个请求所需的时间以及用户选择的分类变量的组合进行聚类。所选的具体文本分析技术是\
  \ `Word2Vector`，聚类技术是 `DBSCAN`。为了将新的服务请求分类到已创建的某个桶中，使用了 `Cosine Similarity`（余弦相似度）算法。让我们详细回顾一下技术解决方案。\n\
  \n### (I) 准备 Python 环境\n\n#### 算法：\n\n1. 加载所需的 Python 库。这些库用于加载数据、执行计算和显示输出。一些重要的库包括：\n\
  \n    1. `Pandas`—数据分析库\n    2. `numpy`—Python 中的数组处理库\n    3. `nltk.data` 和 `nltk.corpus`—自然语言处理库\n\
  \    4. `import genism`—为了文本分析和聚类，我们将单词转换为向量。`genism` 实现的 `Word2vec` 函数在这里非常有用。\n\
  \    5. `from gensim.models import word2vec`\n    6. `from gensim.models.keyedvectors\
  \ import KeyedVectors`\n    7. `matplotlib.pyplot`—用于聚类结果可视化\n    8. `from sklearn.cluster\
  \ import DBSCAN`—用于聚类\n    9. `from sklearn.metrics.pairwise import cosine_similarity`—计算服务请求描述的相似度\n\
  \n#### 示例代码段\n\n![images](img/400-1.png)\n\n### (II) 数据加载\n\n#### 算法：\n\n根据数据源（如服务请求的表格或\
  \ csv 导出文件或直接访问服务请求数据库），将数据以字符串数组的形式加载到程序中。包含数据集的 `csv` 文件作为本书的在线材料可用。文件结构如下所示：\n\
  \n![images](img/400-2.png)\n\n#### 代码段\n\n![images](img/401-1.png)\n\n### (III)\
  \ 针对业务用户列出的分配组进行过滤。这将确保聚类是根据业务单元创建的。\n\n#### 算法：\n\n识别数据集中有助于简化数据分类或聚类的信息。在我们的示例中，我们将使用服务中心的分配组或部门作为聚类的驱动因素。以下是一些可以对服务请求分类的分配组示例。\n\
  \n![images](img/401-2.png)\n\n#### 代码段\n\n![images](img/401-3.png)![images](img/402-1.png)\n\
  \n### (IV) 文本分析以为机器学习算法创建训练数据。\n\n#### 算法：\n\n1. 通过对服务请求（SR）中单词的向量取平均值来创建训练数据。\n\
  2. 计算每个向量的平均特征向量并返回一个 2D `numpy` 数组。\n3. 该数组集现在就是你运行聚类所需的训练数据。\n\n#### 代码段\n\n![images](img/402-3.png)![images](img/403-1.png)\n\
  \n### (IV) 运行聚类\n\n#### 算法：\n\n此类聚类使用了 `DBSCAN` 算法，它采用基于密度的聚类方法。检查上述创建的向量的位置，将高密度区域视为新簇，而簇之间通过低密度区域分开。\n\
  \n#### 代码段\n\n![images](img/403-2.png)\n\n`DBSCAN` 结果生成的聚类见图 C.1。估计的簇数量：14，轮廓系数（Silhouette\
  \ Coefficient）：0.367。\n\n![images](img/404-1.png)![images](img/404-2.png)\n\n**图\
  \ C.1** 聚类输出\n\n### (V) 新 SR 分配到正确的桶 – 余弦相似度函数\n\n#### 算法：\n\n1. 使用 `word2vec` 函数根据\
  \ SR 的描述文本创建向量。\n2. 使用 `cosine_similarity` 函数计算向量的相似度得分。\n3. 根据该簇中所有服务请求的平均最大相似度得分，找到该服务请求所属的簇。\n\
  4. 如果没有找到与此 SR 向量匹配的簇，则该 SR 与训练库中的任何项都不相似，不分配到任何簇中。\n\n#### 代码段\n\n![images](img/405-1.png)\n\
