  \n**图 B.6** 分类模型的性能评估\n\n#### B.3.5.2 监督学习 - 回归\n\n我们在第 3 节中见过，R² 是回归模型有效的衡量指标。在\
  \ Python 中，`sklearn.metrics` 提供的 `mean_squared_error` 和 `r2_score` 用于评估回归模型的准确性。以下是代码：\n\
  \n```python\nfrom sklearn.metrics import mean_squared_error, r2_score\nprediction\
  \ = model.predict(predictors_test)\nmean_squared_error(target_test, prediction)\n\
  r2_score(target_test, prediction)\n```\n\n#### B.3.5.3 无监督学习 - 聚类\n\n正如我们在第 3 节中看到的，有两种流行的聚类质量衡量标准：纯度和轮廓系数。纯度只有在待聚类数据集的类别标签已知时才能计算。相反，轮廓系数可以在任何数据集上计算。\n\
  \n**纯度（Purity）**\n\n我们将使用由 Kaggle 的腰痛症状数据集（https://www.kaggle.com/sammy123/lower-back-pain-symptoms-dataset）。该数据集包含\
