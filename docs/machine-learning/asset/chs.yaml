  \n## 第 4 章\n\n## 特征工程基础\n\n### 本章目标\n\n在过去的三个章节中，你已经介绍了机器学习的基本概念。此外，还详细讨论了启动问题建模的过程。考虑到这些，在本章中，我们将向你介绍机器学习的另一个非常重要的方面，即特征工程。虽然特征工程不是机器学习过程的核心部分，但它是为了使学习更有效而需要执行的一项关键辅助任务。它包含三个关键组成部分——特征构建、特征选择和特征转换，本章将对每一个部分进行详细介绍。\n\
  \n## 4.1 引言\n\n在过去的三个章节中，我们对机器学习过程开启了序端。我们首先开始学习什么是人类学习，以及不同类型的机器学习如何模拟人类学习的各个方面。我们详细查看了可以使用机器学习技术解决的不同类型的问题。在应用机器学习解决问题之前，会有某些准备步骤。这些准备步骤已经得到了详细介绍。之后，我们进行了分步引导。\n\
  \n（注：由于原文中后续部分存在大量重复段落，已根据要求去重处理，仅保留核心逻辑结构。）\n\n### 4.1.1 什么是特征？\n\n特征是机器学习使用的数据集的属性。机器学习从业者中存在一种观点，认为只有对机器学习有意义的才是特征，但这种观点需要仔细对待。事实上，选择对机器学习有意义的子集是一个领域。数据集中的特征也被称为维度。因此，具有\
  \ `n` 个特征的数据集被称为 `n` 维数据集。\n\n以著名的机器学习数据集鸢（Iris）为例，它由英国统计学家和生物学家罗纳德·费舍（Ronald Fisher）引入，部分如图\
  \ 4.1 所示。它有五个属性或特征，即 `Sepal.Length`（花长）、`Sepal.Width`（花宽）、`Petal.Length`（瓣长）、`Petal.Width`（瓣宽）和\
  \ `Species`（种类）。在这些中，`Species` 代表类别变量，其余特征是预测变量。这是一个五维数据集。\n\n```\n图 4.1\n```\n\
  4.1 数据特征\n\n### 4.1.2 什么是特征工程？\n\n特征工程是将数据集转换为特征的过程，使得这些特征能够有效地表示数据集并获得更好的学习性能。\n\
  \n正如我们已经知道的，特征工程是机器学习中重要的预处理步骤。它包含两个主要元素：\n1. 特征转换\n2. 特征子集选择\n\n`feature transformation`\
  \ 将结构化或非结构化的数据转换为一组新的特征，这些特征可以表示机器学习试图解决的底层问题。特征转换有两种变体：\n1. 特征构建\n2. 特征提取\n\n两者有时被称为特征发现（feature\
  \ discovery）。\n\n\n\n\n与特征转换不同，在`特征子集选择`或简单称为`特征选择`的情况下，不会生成新的特征。特征选择的目标是从全特征集中提取出一个特征子集，该子集在特定的机器学习问题背景下最具意义。因此，本质上，特征选择的工作是从\
  \ `F[i]`（`F[1]`、`F[2]`、……、`F[n]`）中派生子集 `F[j]`（`F[1]`、`F[2]`、……、`F[m]`），其中 `m` <\
  \ `n`，使得 `F[j]` 对于该机器学习问题最有意义并获得最佳结果。我们将在下一节中详细讨论这些概念。\n\n## 思考题\n\n数据数据科学家和机器学习执业人员在不同的特征工程活动上花费了大量时间。选择正确的特征对于机器学习模型的成功起着至关重要的作用。显而易见，特征构建扩展了特征空间，而特征提取和特征选择则减小了特征空间。\n\
  \n## 4.2 特征转换\n\n构建良好的特征空间是任何机器学习模型成功的关键先决。然而，通常并不清楚哪个特征更重要。因此，数据集中的所有可用属性都被用作特征，并将识别重要特征的任务留给学习模型。这绝对不是一种可行的方法，特别是对于某些领域，例如医学图像分类、文本分类等。如果必须训练模型来将文档分类为垃圾邮件或非垃圾邮件，我们可以将文档表示为词袋。那么，特征空间将包含跨越所有文档的所有唯一单词。这将很容易成为包含几十万个特征的特征空间。如果我们开始在单词中加入双词（bigrams）或三词（trigrams），特征数量将达到百万级。为了解决这个问题，特征转换派上了用场。特征转换被视为降维的有效工具，从而提升机器学习模型的性能。总体，特征转换有两个不同的目标：\n\
  \n* 实现数据集中原始特征的最佳重建\n* 在学习任务中实现最高效率\n\n### 你知道吗？\n\n在自然语言处理领域，`n-gram` 是文本块或文档中连续的\
  \ `n` 个项目。使用数字前缀，大小为 1 的 `n-gram` 称为单词（unigram，即单个单词），大小为 2 的称为双词（bigram，即两个词的短语），大小为\
  \ 3 的称为三词（trigram，即三个词的短语）等等。\n\n### 4.2.1 特征构建\n\n特征构建涉及将给定的输入特征集转换以生成一组更强大的新特征。为了更清楚地理解，让我们以一个房地产数据集为例，该数据集包含特定区域内所有公寓的详情。\n\
  \n数据集有三个特征——公寓长度、公寓宽度和公寓价格。如果它被用作回归问题的输入，此类数据可以作为回归模型的训练数据。因此，给定训练数据，模型应该能够预测价格未知或刚上市的公寓的价格。然而，使用公寓的长度和宽度作为预测器，不如使用公寓面积要方便得多且更有意义，而面积并不是数据集中现有特征。因此，可以将这样的特征，即\
  \ `apartment area`（公寓面积），添加到数据集中换句话说，我们将三维数据集转换为四维数据集，将新“发现”的特征公寓面积添加到原始数据集中。这在图\
  \ 4.2 所示。\n\n![images](img/95-1.png)\n\n**图 4.2** 特征构建（示例 1）\n\n**注意：** 尽管为了简单起见，公寓长度和公寓宽度特征被保留在图\
  \ 4.2 中，但实际上在构建模型时排除这些特征更有意义。\n\n在某些情况下，在我们开始机器学习任务之前，特征构建是一项本质活动。这些情况包括：\n\n* 当特征具有分类值且机器学习需要数值输入时\n\
  * 当特征具有数值（连续）值且需要转换为顺序值时\n* 当需要进行特定文本的特征构建时\n\n#### 4.2.1.1 编码分类（名义）变量\n\n让我们另一个关于运动员的数据集为例，如图\
  \ 4.3a 所示。假设数据集具有年龄、出生地、父母是否为运动员（即指示父母中任一人是否为运动员）和胜率（Chance of Win）。特征 `chance of\
  \ a win`（胜率）是一个类别变量，而其他是预测变量。我们知道任何机器学习算法，无论是分类算法（如 `kNN`）还是回归算法，都需要数值来进行学习。因此，有三个特征——出生地、父母是否为运动员和胜率。\n\
  \n在这种情况下，特征构建可以用于创建可供机器学习使用的虚拟特征。由于 `City of origin`（出生地）具有三个唯一值 A、B、C，创建了虚拟特征 `origin_city_A`、`origin_city_B`\
  \ 和 `origin_city_C`。同样，`parents_athlete_Y` 和 `parents_athlete_N` 是为了 `Parents athlete`（父母是否为运动员）创建的，`win_chance_Y`\
  \ 和 `win_chance_N` 是为了 `Chance of win`（胜率）创建的。这些虚拟特征根据原始行的分类值取值为 0 或 1。例如，第二行 `City\
  \ of origin`（出生地）的分类值为“City B”。因此，`origin_city_A`、`origin_city_B` 和 `origin_city_C`\
  \ 的值将分别对应。同样地，`parents_athlete_Y` 和 `parents_athlete_N` 在第二行的值为 0 和 1，因为第二行原始特征\
  \ `Parents athlete`（父母是否为运动员）的分类值为“否”。运动员数据集的整个转换如图 4.3b 所示。\n\n![images](img/96-1.png)\n\
  \n**图 4.3** 特征构建（名义变量）\n\n然而，仔细观察发现，原始特征 `Parents athlete`（父母是否为运动员）和 `Chance of\
  \ win`（胜率）只有两个值。因此从它们创建两个特征是重复的，因为一个特征的值可以根据另一个特征决定。为了避免这种重复，我们可以保留一个特征并消除另一个，如图\
  \ 4.3c 所示。\n\n#### 4.2.1.2 编码分类（顺序）变量\n\n让我们来看学生数据集。假设三个变量——科学成绩、数学成绩和等级，如图 4.4a\
  \ 所示。我们可以看到，`grade`（等级）是一个具有 A、B、C、D 值的变量。为了将此变量转换为数值变量，我们可以创建一个特征 `num_grade`，将数值映射到每个顺序值。在当前示例背景下，图\
  \ 4.4a 中的等级 A、B、C 和 D 被映射到图 4.4b 所示转换变量中的值 1、2、3 和 4。\n\n![images](img/97-1.png)\n\
  \n**图 4.4** 特征构建（顺序变量编码）\n\n#### 4.2.1.3 将数值（连续）特征转换为分类特征\n\n\n\n\n有时候需要将连续型数值变量转换为分类变量。例如，我们可能希望将房地产价格预测问题（这是一个回归问题）视为房地产价格分类预测（这是一个分类问题）。在这种情况下，我们可以根据数据范围将数值数据“分箱（bin）”为多个类别。在房地产价格预测示例的背景下，原始数据集具有一个数值型特征\
  \ `apartment_price`，如图图 4.5a\n\n**图 4.5** 特征构建（数值到分类）\n\n文本数据，或更常用的术语语料库（corpus），通过一个被称为向量化（vectorization）的过程转换为数值表示。在这个过程中，属于语料库的所有文档中的词汇出现次数以词袋（bag-of-words）的形式合并。通常遵循以下三个主要步骤：\n\
  \n1.  分词（tokenize）\n2.  计数（count）\n3.  归一化（normalize）\n\n为了对语料库进行分词，使用空格和标点符号作为分隔符来分离单词或标记（tokens）。然后，统计每个文档中每个标记的次数。最后，当标记出现在大多数文档中时，通过降低其权重对其加加。然后形成一个矩阵，每个标记代表一列，语料库中的每个特定文档代表一行。每个单元格包含该标记在特定文档中的出现次数。这种矩阵被称为文档-项矩阵（也称为项-文档矩阵）。图\
  \ 4.6\n\n**图 4.6** 特征构建（文本特定）\n\n### 4.2.2 特征提取\n\n在特征提取中，通过原始特征的组合创建新特征。组合原始特征的一些常用操作符包括：\n\
  \n1.  对于布尔特征：逻辑与、逻辑或、否定等。\n2.  对于名义特征：笛卡尔积、M 的 N 等。\n3.  对于数值特征：最小、最大、加法、减法、乘法、除法、平均、等价、不等等。\n\
  \n让我们举一个例子来尝试理解。假设我们有一个具有特征集 `F[i]`（`F[1]`、`F[2]`、……`F[n]`）的数据集。在使用映射函数 `f` 进行特征提取后（`F[1]`、`F[2]`、……`F[n]`），假设我们将有一组特征\
  \ ![img](img/99-2.png)，使得 ![img](img/99-3.png) 且 `m` < `n`。例如，![img](img/99-4.png)。这在图\
  \ 4.7 中描述。\n\n![images](img/99-5.png)\n\n**图 4.7** 特征提取\n\n让我们讨论一下机器学习中最常用的特征提取算法：\n\
  \n#### 4.2.2.1 主成分分析\n\n正如我们所见，每个数据集都有多个属性或维度——其中许多属性之间可能具有相似性。例如，人的身高和体重通常是密切相关的。如果身高较高，通常体重也较高，反之亦然。所以，如果一个数据集具有身高和体重两个属性，显然预计它们会有很大的相似性。通常情况下，相关属性或特征的数量越少，任何机器学习算法的表现就越好。换句话说，机器学习成功的关键在于特征的数量较少，且彼此之间的相似性非常低。这是主成分分析（PCA）特征提取技术的主要指导哲学。\n\
  \n在 PCA 中，从原始特征中提取出一组性质上非常不同的新特征。因此，`n` 维特征空间被转换为 `m` 维特征空间，其中维度之间是正交的，即彼此完全独立。为了理解正交性的概念，我们必须回溯并深入研究线性代数中的向量空间概念。\n\
  \n我们都知道，向量是一个既有大小又有方向的量，因此它可以确定欧几里得空间中一点相对于另一个点的位置（即二维、三维或“n”维）。\n\n```\n![images](img/100-1.png)\
  \ 其中，`a[i]` 代表 `*n* 个标量，`u[i]` 代表基向量。\n```\n\n`n` 维向量空间中向量的正交性可以看作是二维空间中向量垂直的扩展。两个正交的向量之间是完全无关或相互独立的。因此，将一组向量转换为对应的基向量集有助于将向量分解为若干个独立组件。\n\
  \n现在，让我们这一概念扩展到数据集的特征空间。特征向量可以转换为基向量的向量空间，这些基向量被称为主成分。这些主成分就像基向量一样，彼此是正交的。因此，一组可能具有相似性的特征向量被转换为一组完全无关的主成分。然而，主成分捕获了原始特征空间的变异性。此外，导出的主成分数量就像基向量一样，比原始特征集少得多。\n\
  \nPCA 的目标是进行转换，使得：\n\n1.  新特征是彼此区分的，即新特征（即主成分）之间的协方差为 0。\n2.  主成分按照其捕获的数据变异性顺序生成。因此，第一个主成分应该捕获最大的变异性，第二个主成分应该捕获次高的变异性，以此此类推。\n\
  3.  新特征或主成分的方差和等于原始特征的方差和。\n\nPCA 基于数据集协方差矩阵的特征值分解过程。以下是需要遵循的步骤：\n\n1.  首先，计算数据集的协方差矩阵。\n\
  2.  然后，计算协方差矩阵的特征值。\n3.  具有最大特征值的特征向量代表方差最大的方向。因此，这有助于识别第一个主成分。\n\n\n\n\n4. 具有次高特征值的特征向量代表数据剩余方差最大的方向，且与第一个方向正交。因此这有助于识别第二个主成分。\n\
  \n5. 依此类，识别具有前 `k` 个特征值的前 `k` 个特征向量，以获得 `k` 个主成分。\n\n#### 4.2.2.2 奇异值分解\n\n奇异值分解（`SVD`）是一种线性代数中常用的矩阵分解技术。矩阵\
  \ `A` (`m` × `n`) 的 `SVD` 是如下形式的分解：\n\n![images](img/101-1.png)\n\n其中，`U` 和 `V`\
  \ 是正交矩阵，`U` 是一个 `m` × `m` 矩阵，`V` 是一个 `n` × `n` 矩阵，而 ∑ 是一个 `m` × `n` 矩形对角矩阵。∑ 的对角线元素被称为矩阵\
  \ `A` 的奇异值。`U` 和 `V` 的列分别称为矩阵 `A` 的左奇异向量和右奇异向量。\n\n`SVD` 通常用于 `PCA`，前提是已经去除了每个变量的均值。由于并不总是建议移除数据属性的均值，特别是当数据集是稀疏的（如文本数据所示），`SVD`\
  \ 是这些情况下降维的良好选择。\n\n数据矩阵的 `SVD` 预期具有以下突出特性：\n\n1. 属性中的模式由右奇异向量（即 `V` 的列）捕捉。\n2.\
  \ 实例之间的模式由左奇异向量（即 `U` 的列）捕捉。\n3. 奇异值越大，它所的矩阵 `A` 部分及其关联向量就越大。\n4. 使用等式获取具有 `k` 个属性的新数据矩阵：\n\
  \n   `D`′ = `D` × [`v[1]`, `v[2]`, …, , `v[k]`]\n\n   因此，维度被降低到 `k`\n\n   SVD 经常用于文本数据背景下。\n\
  \n#### 4.2.2.3 线性判别分析\n\n线性判别分析（`LDA`）是另一种类似于 `PCA` 或 `SVD` 的常用特征提取技术。`LDA` 的目标与其相似之处在于，它意图将数据集转换为低维特征空间。然而，与\
  \ `PCA` 不同，`LDA` 的重点不在于捕捉数据集的变化性。相反，`LDA` 关注类可别性，即根据类可别性分离特征，以避免机器学习模型的过拟合。\n\n\
  与计算数据集协方差矩阵特征值的 `PCA` 不同，`LDA` 计算类内和类间散度矩阵的特征值和特征向量。以下是遵循的步骤：\n\n1. 计算每个类的均值向量。\n\
  2. 计算类内和类间散度矩阵。\n3. 计算 `S[W]`^(-¹) 和 `S[B]` 的特征值和特征向量，其中 `S[W]` 是类内散度矩阵，`S[B]` 是类间散度矩阵。\n\
  \n   ![images](img/102-1.png)\n\n   其中，`m[i]` 是第 `i` 类的均值向量\n\n   ![images](img/102-2.png)\n\
  \n   其中，mi 是每个类的样本均值，m 是 `[]` 数据集的整体均值，Ni 是每个类的样本样本量。\n\n4. 识别具有前 `k` 个特征值的前 `k`\
  \ 个特征向量。\n\n##### 4.3 特征子选择\n\n特征选择无疑是任何机器学习项目中最关键的预处理活动。它意图选择系统属性或特征的子集，这些特征对机器学习活动做出最有意义的贡献。让我们快速讨论一个实际示例来理解特征选择背后的哲学。假设我们正尝试根据对相似学生的历史信息来预测学生的体重，这些信息记录在“学生体重”数据集中。学生体重数据集具有学号（Roll\
  \ Number）、年龄、身高和体重等特征。我们可以很好地理解，学号对于预测学生体重没有任何关系。因此，我们可以消除学号特征，并构建一个特征子集在该机器学习问题中进行考虑。该特征子集将比全集产生更好的结果。这一点在图\
  \ 4.8 中已有描述。\n\n![images](img/103-1.png)\n\n**图 4.8** 特征选择\n\n但在继续对特征选择进行更详细的讨论之前，让我们尝试理解使特征选择成为一个如此需要解决的问题的问题。\n\
  \n#### 4.3.1 高维数据中的问题\n\n随着数字领域的快速创新，产生的数据量已增加到难以置信的程度。同时，存储技术领域的突破使得大量数据的存储变得非常廉。。这进一步激励了对极大型和高维数据集的存储和挖掘。\n\
  \n#### 思考点\n\n“高维”指的是某些数据集中存在的高数量变量、属性或特征，在 DNA 分析、地理信息系统（GIS）、社交网络等领域尤为如此。高维空间通常有成百或上千个的维度或属性，例如，DNA\
  \ 微阵列数据可以有多达 450,000 个变量（基因探针）。\n\n与此同时，两个新应用领域经历了剧烈发展。一个是生物医学研究，包括从微阵数据中选择基因。另一个是文本分类，处理来自社交网络网站、电子邮件等的海量文本数据。第一个领域即生物医学研究产生的数据集特征数量达到数万。来自不同来源的文本也具有极高的维度。在一个嵌入了数千文档的大语料库中，代表数据集特征的词标记也可以达到数万。从这类高维数据获取见解对于任何机器学习算法来说都是一个巨大的挑战。一方面，需要大量的计算资源和大量的时间。另一方面，由于数据中存在不必要的噪声，无论是监督还是无监督机器学习任务，模型的性能都会急剧下降。此外，在极大量特征上构建的模型可能非常难以理解。因此，有必要选取特征子集而不是全集。\n\
  \n特征选择的目标是三个方面的：\n\n* 拥有更快且更具效益（即需要更少计算资源）的学习模型\n* 提高学习模型的效率\n* 更好地理解底层模型\n\n####\
  \ 4.3.2 特征选择的关键驱动力——特征相关性和冗余\n\n#### 4.3.2.1 特征相关性\n\n在监督学习中，输入数据集即训练数据集带有类标签。基于训练数据集归纳模型——以便归纳模型可以为新的未标记数据分配类标签。每个预测变量都预期为决定类标签的值贡献信息。如果一个变量没有贡献任何信息，则认为它是无关的。如果对预测的信息贡献很小，该变量被称为弱相关。剩余对预测任务有显著贡献的变量被称为强相关变量。\n\
  \n\n\n\n在无监督学习中，没有训练集或标记数据。它通过对相似的数据实例进行分组，并根据不同变量的值来评估数据实例的相似性来实现。某些变量对于判断数据实例的相似性或差异性无法提供任何有用信息。因此，这些变量在分组过程中没有产生显著的信息贡献。在无监督机器学习任务的语境下，这些变量被标记为无关变量。\n\
  \n为了直观理解，我们可以考虑在本节开头讨论过的学生数据集的简单例子。一个学生的学号（Roll number）对于预测学生的`Weight`（体重）没有提供任何显著信息。同样，如果我们正尝试将学术能力相似的学生归为类，`Roll\
  \ number`（学号）确实无法提供任何信息。因此，在预测学生`Weight`的监督任务或对学术水平相似的学生进行分类的无监督任务背景下，`Roll number`这一变量是完全无关的。\n\
  \n在机器学习任务背景下，任何无关的特征在选择特征子集时都是剔除的候选对象。我们可以根据具体情况考虑是否剔除弱相关特征。\n\n### 4.3.2.2 特征冗余\n\
  \n某个特征提供的信息可能与一个或多个其他特征提供的信息相似。例如，在节前提到的体重预测问题中，`Age`（年龄）和`Height`（身高）特征都提供了相似的信息。这是因为随着`Age`的增加，`Weight`预计随之增加。同样，随着`Height`的增加，`Weight`预计也会增加。此外，`Age`和`Height`相互增长。因此，在`Weight`预测问题的背景下，`Age`和`Height`提供了相似的信息。换句话说，无论特征`height`是否作为特征子集的一部分存在，学习模型给出的结果几乎相同。同样，如果没有`age`作为预测变量的一部分，学习模型的输出结果也大大相同。在一种一个特征与另一个特征相似的情况下，该特征在学习问题背景下被认为是具有潜在冗余的。\n\
  \n所有具有潜在冗余的特征都是最终特征子集的剔除候选对象。在一组潜在冗余的特征中，只有少数具有代表性的特征会被认为是最终特征子集的一部分。\n\n简而言之，特征选择的主要目标是移除所有无关特征，并选取一个对于潜在冗余特征的代表性子集。这在特定的学习任务背景下产生了一个有意义的特征子集。\n\
  \n现在，问题是如何找出哪些特征是无关的，或者哪些特征具有潜在冗余。为此，使用了多种衡量方法，其中一些在下一个小节中将被介绍。\n\n### 4.3.3 特征相关性和冗余性的衡量标准\n\
  \n#### 4.3.3.1 特征相关性的衡量标准\n\n如前所述，特征相关性通过特征贡献的信息量衡量。对于监督学习，互信息被认为是衡量特征对类别标签值贡献的良好指标。这就是为什么它是特征与类别变量相关性的良好指标。特征的互信息越高，该特征越相关。互信息的计算公式如下：\n\
  \n`MI(C, f) = H(C) + H(f) - H(C, f)`\n\n其中，类的边缘熵 `H(C) = ![img](img/105-1.png)`\n\
  \n特征`x`的边缘熵 `H(f) = ![img](img/105-2.png)`\n\n且`K` = 类别数量，`C` = 类别变量，`f` = 取离散值的特征集。\n\
  \n在无监督学习的情况下，没有类别变量。因此，特征到类别的互信息不能用于衡量特征的信息贡献。在无监督学习中，无法使用特征到类别的互信息来衡量特征的信息贡献。通过计算特征的熵来衡量特征的贡献：\n\
  \n`![img](img/105-3.png)`\n\n`![img](img/106-1.png)`\n\n`![img](img/106-2.png)`\n\
  \n对于离散值的特征，使用以下公式计算特征的熵，即`f`。\n\n#### 4.3.3.2 特征冗余的衡量标准\n\n特征冗余是指特征提供的信息与一个或多个特征提供的信息相似。正如我们讨论的，冗余性的衡量方法有：\n\
  \n1. 基于相关性的衡量\n2. 基于距离的衡量\n\n#### 1. 基于相关性的衡量\n\n相关性是两个变量之间线性关系的衡量。皮尔逊系数是衡量随机变量之间相关性的最流行的方法。对于两个随机变量：\n\
  \n`![img](img/106-3.png)`\n\n相关性值范围在+1 到 1 之间。1 表示完全相关。如果相关性为 0，则特征之间没有线性关系。通常，对于特征选择问题，采用阈值来判断特征是否具有相似性。\n\
  \n#### 2. 基于距离的衡量\n\n最常见的距离衡量是欧几里得距离，对于两个特征`F[1]`和`F[2]`计算如下：\n\n`![img](img/106-4.png)`\n\
