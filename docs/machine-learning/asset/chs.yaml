  \    i <- i+1\n}\n```\n[1] 1\n[1] 4\n[1] 9\n\n#### If-else 语句 (If-else statement)\n\
  \n**语法：**\n\n```\nif (condition 1)\n{\n    Statement 1\n}\nelse if (condition 2)\n\
  {\n    Statement 2\n}\nelse\n{\n    Statement 4\n}\n```\n\n**示例：**\n```\nx = 0\n\
  if (x > 0)\n{\n    print(“positive”)\n} else if (x == 0)\n{\n    print(“zero”)\n\
  } else\n{\n    print(“negative”)\n}\n```\n[1] “zero”\n\n### A.1.3.4 编写函数\n\n在脚本中）编写函数：\n\
