  \n双曲正切函数是另一种连续激活函数，其本质是双极的。它的形式如下\n\n![images](img/279-1.png)\n\n#### **你可能知道？**\n\
  \n与神经网络相关的工作可以追溯到 20 世纪 40 年代。Warren McCulloch 和 Walter Pitts 在 1943 年创建了一个受大脑生物过程启发的计算网络。该模型为神经网络的发展铺平了道路。\n\
  \n神经网络领域的的另一项显著工作是 20 世纪 40 年代后期由加拿大心理学家 Donald Olding Hebb 完成的。他提出了一种基于神经元和神经元之间突触连接的学习假设。这并作为赫布学习（Hebbian\
  \ learning）而闻名。\n\n1958 年，美国心理学家 Frank Rosenblatt 完善了赫布概念并演化了感知机概念。几乎在同一时间，1960\
  \ 年，斯坦福大学的 Bernard Widrow 教授提出了一种名为 ADALINE（自适应线性神经元或自适应线性元件）的早期单层 ANN。Marvin Lee\
  \ Minsky 和 Seymour Aubrey Papert 在 1969 年的研究论文中指感知机的两个关键问题。第一个问题是感知机无法处理 XOR（异或）电路。另一个问题是计算机的处理能力不足，无法有效处理大型神经网络。\n\
  \n从这里直到 20 世纪 70 年代中期，神经网络的研究工作有所放缓。1975 年，随着 Werbos 反向传播算法的出现，人们对神经网络和学习产生了新的兴趣。随后，随着计算机计算能力的大幅提升，在随后的几十年中进行了大量关于神经网络的研究。神经网络进一步演变为深度神经网络，并开始用于解决图像识别等大规模学习问题，从而获得了一个更流行的名称——深度学习。\n\
  \n\n\n\n\n\nMcCulloch–Pitts 神经模型（如图图 10.6 所示）是最早的 ANN 模型，它只有两种输入——兴奋性输入和抑制性输入。兴奋性输入具有正幅值的权重，抑制性输入具有负幅值的权重。McCulloch–Pitts\
  \ 神经元的输入可以是 0 或 1。它有一个阈值函数作为激活函数。因此，如果输入 `y[sum]` 大于或等于给定的阈值，输出信号 `y[out]` 为 1，否则为\
  \ 0。\n\n简单的 McCulloch–Pitts 神经元可以用于设计逻辑操作。为了这个目的，需要正确决定连接权重以及阈值函数（激活函数的阈值）。让我们来看一个小例子。\n\
  \n![images](img/280-1.png)\n\n**图 10.6** McCulloch–Pitts 神经元\n\n如果是晴天或下雨，约翰就会带伞。这里有四种给定的情况。我们需要决定约翰什么时候会带伞。情况如下：\n\
  \n*   情况 1 – 既没有下雨也不晴天。\n*   情况 2 – 没有下雨，但是晴天。\n*   情况 3 – 正在下雨，但不晴天。\n*   情况 4\
  \ – 哇，太奇怪了！既在下雨又是晴天。\n\n使用 McCulloch–Pitts 神经模型分析这些情况，我们可以这样考虑输入信号：\n\n*   `x[1]`\
  \ → 正在下雨吗？\n*   `x[2]` → 是晴天吗？\n\n因此，`x[1]` 和 `x[2]` 的值可以是 0 或 1。我们可以将两个权重 `x[1]`\
  \ 和 `x[2]` 的值视为 1，并将激活函数的阈值视为 1。因此，神经模型看起来就像图 10.7a 所示。\n\n![images](img/280-2.png)\n\
  \n**图 10.7** McCulloch–Pitts 神经模型（插图）\n\n形式上，我们可以说：\n\n![images](img/281-1.png)\n\
  \n根据该问题建立的真值表如图图 10.7b 所示。从真值表中我们可以得出结论：在 `y[out]` 值为 1 的情况下，约翰需要带伞。因此，他在情况 2、3\
  \ 和 4 下需要带伞。感到惊讶吗，这看起来像是一个典型的与“或”（OR）函数相关的问题？不要担心，这确实是使用 McCulloch–Pitts 模型实现的或逻辑。\n\
  \n### 10.5.2 Rosenblatt 感知机\n\nRosenblatt 感知机是基于 McCulloch–Pitts 模型构建的。感知机如图图 10.7\
  \ 所示，接收一组输入 `x[1]`、`x[2]`、……`x[n]`。线性组合器或加法节点计算作用于具有突触权重 `w[1]`、`w[2]`、……`w[n]`\
  \ 的突触的输入线性组合。然后，硬限位器检查结果之和是正还是负。如果硬限位器节点的输入为正，则输出为 +1；如果输入为负，则输出为 −1。在数学上，硬限制器的输入是：\n\
  \n![images](img/281-2.png)\n\n然而，感知机包含一个可调整的值或偏置，作为额外权重 `w[0]`。这个额外权重 `w[0]` 附加到虚拟输入\
  \ `x[0]` 上，该输入始终被赋值为 1。这一考虑修改了上述方程：\n\n![images](img/281-3.png)\n\n输出由：\n\n![images](img/281-4.png)\n\
  \n感知机的目标是将一组输入归分为两类：`c[1]` 和 `c[2]`。这可以通过简单的规则来实现：如果感知机的输出 `y[out]` 为 +1，则将输入 `x[0]`、`x[1]`、……`x[n]`\
  \ 分配给 `c[1]`；如果 `y[out]` 为 −1，则分配给 `c[2]`。对于 n 维信号空间（即 `n` 个输入 `x[0]`、`x[1]`、……`x[n]`），简单的感知机有两个决策区域，由超平面分开：\n\
  \n![images](img/281-5.png)![images](img/282-1.png)\n\n**图 10.8** Rosenblatt 感知机\n\
  \n因此，对于由变量 `x[1]` 和 `x[2]` 表示的两个输入信号，决策边界是：\n\n![images](img/282-2.png)\n\n因此，对于突触权重\
  \ `w[0]`、`w[1]` 和 `w[2]` 分别为 −2、½ 和 ¼ 的感知机，线性决策边界将：\n\n![images](img/282-3.png)\n\
  \n因此，任何位于图 10.9 所示边界之上的点（`x[1]`、`x[2]`）将被分配给类 `c[1]`，边界下方的点分配给类 `c[2]`。\n\n![images](img/282-4.png)\n\
  \n**图 10.9** 感知机边界\n\n让我们检查此感知机是否能归类以下点：\n\n*   `p[1]` = (5, 2) 和 `p[2]` = (−1,\
  \ 2) 属于 `c[1]`\n*   `p[3]` = (3, −5) 和 `p[4]` = (−2, −1) 属于 `c[2]`\n\n如图图 10.10\
  \ 所示，我们可以看到根据激活函数的输出，只有 `p[1]` 和 `p[2]` 输出 1。因此它们被分配到类 `c[1]`，正如预期。另一方面，激活函数输出为负的点\
  \ `p[3]` 和 `p[4]` 输出 0。因此它们被分配到类 `c[2]`，同样正如预期。\n\n![images](img/283-1.png)\n\n\
  **图 10.10** 通过感知机进行类别分配\n\n通过映射输入空间中的点获得相同的分类，如图图 10.11 所示。\n\n![images](img/283-2.png)\n\
  \n**图 10.11** 通过决策边界分类\n\n因此，我们可以看到对于具有线性分离的数据集，始终可以使用感知机使用决策线（二维空间）、决策平面（三维空间）或决策超平面（n\
  \ 维空间）来解决分类问题。\n\n通过训练感知机可以获得突触权重 `w[0]`、`w[1]`、……`w[n]` 的适当值。然而，感知机正常工作的一个假设是两类之间应该是线性分离的（如图图\
  \ 10.12a 所示），即类别之间应该有足够的间隔。否则，如果类别是非线性分离的（如图图 10.12b 所示），则感知机无法解决分类问题。\n\n![images](img/284-1.png)\n\
  \n**图 10.12** 类别分离性\n\n#### 10.5.2.1 多层感知机\n\n基础感知机对于具有线性分离模式的数据集非常成功。但在实际情况下，那是理想情况。这正是\
  \ Minsky 和 Papert (1969) 提出的观点。他们证明基础感知机无法学习计算即使是简单的 2 位异或（XOR）。为什么这样？让我们尝试理解。\n\
  \n图 10.13 是突出 2 位异或函数输出的真值表。\n\n![images](img/284-2.png)\n\n**图 10.13** 函数输出的类别分离性\n\
  \n正如我们在图 10.13 中所所示，数据不是线性分离的。只有曲线决策边界才能正确分离类别。\n\n为了解决这个问题，另一个选项是使用两条决策线代替一条。图\
  \ 10.14 显示了具有两条决策线的线性决策边界如何清晰地划分数据。\n\n![images](img/285-1.png)\n\n**图 10.14** 异或函数输出通过两条决策线进行分类\n\
  \n\n\n\n图 10.15 中的图类似于一个全连接多层感知器，在输入层和输出层之间有多个隐藏层。它之所以被称为全连接，是因为感知器任何层中的任何神经元都与前层的所有神经元（如果是第一个隐藏层则为输入节点）相连。信号从左到右从一层流向另一层。\n\
  \n### 10.5.3 ADALINE 网络模型\n\n自适应线性神经元（ADALINE）是由斯坦福大学的 Bernard Widrow 教授开发的早期单层神经网络（ANN）。如图\
  \ 10.16 所示，它只有一个输出神经元。输出值可以是 +1 或 −1。添加了一个具有权重 `w[0]` 的偏置输入 `x[0]`（其中 `x[0] = 1`）。激活函数规定：如果加权和大于或等于\
  \ 0，则输出为 1，否则为 −1。从形式上，我们可以说：\n\n![images](img/286-1.png)\n\n**图 10.15** 多层感知器\n\
  \n![images](img/286-2.png)![images](img/286-3.png)\n\n**图 10.16** ADALINE 网络\n\n\
  ADALINE 网络采用的监督学习算法被称为最小均方法（LMS）或 Delta 规则。\n\n多个 ADALINE 被称为 MADALINE（许多 ADALINE）。MADALINE\
  \ 网络可解决与非线性分离相关的问题。\n\n#### 注意：\n\n感知器和 ADALINE 都是神经网络模型。它们都是二分类的分类器。它们具有线性决策边界，并使用阈值激活函数。\n\
  \n### 10.6 神经网络的架构\n\n正如我们目前所看到的，ANN 是由大量相互连接的称为人工神经元的单元组成的计算系统。人工神经元之间的连接可以将信号从一个神经元传输到另一个神经元。根据我们为特定解决方案采用的架构，连接神经元有多种可能性。下面列了一些选择：\n\
  \n* 网络中可能只有两层神经元——输入层和输出层。\n* 除了输入层和输出层外，可能有一层或多层中间“隐藏”神经元层。\n* 神经元可能与下一层的一个或多个神经元连接。\n\
  * 神经元可能与下一层的所有神经元连接。\n* 可能有单个或多个输出信号。如果有多个输出信号，它们可能相互连接。\n* 来自一层的输出可能成为同一层或前一层中神经元的输入。\n\
  \n### 10.6.1 单层前馈网络\n\n单层前馈是 ANN 最简单、最基础的架构。它仅由两层组成，如图 10.17](#chapter010.xhtml#fig10_17)\
  \ 所示——输入层和输出层。输入层由一组“m”输入神经元 `X[1]`、`X[2]`、……`X[m]` 组成，连接到每个“n”输出神经元 `Y[1]`、`Y[2]`、……`Y[n]`。连接权重\
  \ `w[11]`、`w[12]`、……`w[mn]`。输入层神经元不进行任何处理——它们将输入信号传递给输出神经元。计算仅由输出层中的神经元执行。因此，尽管它有两层神经元，但只有一层在执行计算。这就是为什么该网络尽管有两层神经元，却被称为单层的原因。此外，信号始终从输入层流向输出层。因此，该网络被称为前馈网络。\n\
  \n输出神经元的净信号输入由下给出：\n\n![images](img/287-1.png)\n\n对于第 `k` 个输出神经元。每个输出神经元输出的信号将取决于所使用的激活函数。\n\
  \n![images](img/288-1.png)\n\n**图 10.17** 单层前馈\n\n#### 10.6.2 多层前馈 ANN\n\n多层前馈网络与单层前馈网络非常相似，区别在于输入层和输出层之间有一层或多层中间神经元层。因此，该网络被称为多层网络。该网络的结构如图\
  \ 10.18](#chapter010.xhtml#fig10_18) 所示。\n\n![images](img/288-2.png)\n\n**图 10.18**\
  \ 多层前馈\n\n每一层可以有不同数量的神经元。例如，图 10.18 中所示的输入层有“m”个神经元，输出层有“r”个神经元，并且有一个具有“n”个神经元的隐藏层。隐藏层神经元的净输入为：\n\
  \n![images](img/289-1.png)\n\n对于第 `k` 个隐藏层神经元。输出层神经元的净输入为：\n\n![images](img/289-2.png)\n\
  \n对于第 `k` 个输出层神经元。\n\n### 10.6.3 竞争网络\n\n竞争网络与单层前馈网络几乎。唯一的区别是输出神经元相互连接（部分或全部）。图\
  \ 10.19 展示了一个全连接网络。\n\n![images](img/289-3.png)\n\n**图 10.19** 竞争网络\n\n在竞争网络中，对于给定的输入，输出神经元相互竞争。它是一种用于数据聚类的无监督学习形式。\n\
  \n#### 10.6.4 循环网络\n\n我们已经看到在前馈网络中，信号始终从输入层流向输出层。对于循环网络，存在微小的偏差。如图 10.20 所示，存在从输出层到输入层的反馈回路。可能还存在自环。\n\
  \n![images](img/290-1.png)\n\n**图 10.20** 循环神经网络\n\n### 10.7 ANN 中的学习过程\n\n现在我们已经清楚了神经元、它们如何形成架构以及激活函数，现在是时候将这些与我们的核心——学习联系起来了。首先，我们需要理解什么是\
  \ ANN 背景下的学习？有四个需要考虑的主要方面：\n\n1. 层数\n2. 信号流的方向\n3. 每层的节点数量\n4. 每个连接的权重值\n\n### 10.7.1\
  \ 层数\n\n正如我们之前看到的，神经网络可以是单层的或多层的。在单层的情况下，输入层的一组神经元从数据集中接收信号，即每个神经元一个特征。特征值通过输入神经元的激活函数进行转换。输入层神经元处理后的信号随后转发到输出层神经元。输出层神经元使用它们自己的激活函数生成最终预测。\n\
  \n更复杂的网络可以在输入层和输出层之间设计多个隐藏层。\n\n#### 10.7.2 信号流的方向\n\n正如我们所看到的，在被称为前馈的网络中，信号始终向一个方向流动，即从输入层通过隐藏层（如果有的话）到输出层。然而，某些网络（如循环网络）也允许信号从输出层传输到输入层。\n\
  \n这也是选择正确学习模型的一个重要考虑因素。\n\n#### 10.7.3 每层的节点数量\n\n\n\n\n\n在多层网络中，每层的节点数量可以不相同。然而，输入层中的节点或神经元的数量等同于输入数据集的特征数量。同样，输出节点的数量将取决于可能的结果，例如在监督学习中类别的数量。因此，每个隐藏层的节点数量由用户来选择。隐藏层中节点数量较多有助于提高性能性能。但是，节点过多可能会导致过拟合以及增加计算开销。\n\
  \n### 10.7.4 神经元之间连接的权重\n\n确定每个神经元之间连接连接的权重值，以便正确地解决某个特定的学习问题，这本身就是一个相当困难的问题。让我们尝试在问题的背景下理解它。让我们退后一步，看看第\
  \ 10.6.2 节中的问题。\n\n我们有一组已知标签的点，如下所示。我们需要使用这些数据训练一个人工神经网络（ANN）模型，使其能够分类新的测试数据，例如\
  \ `p[5]` (3, −2)。\n\n* `p[1]` = (5, 2) 和 `p[2]` = (−1, 12) 属于 `c[1]`\n* `p[3]` =\
  \ (3, −5) 和 `p[4]` = (−2, −1) 属于 `c[2]`\n\n当我们讨论第 10.6.2 节中的问题时，我们假设突触权重 `w[0]`、`w[1]`\
  \ 和 `w[2]` 的值分别为 −2、½ 和 ¼。但我们到底是从哪里得到这些值的呢？对于我们将尝试使用 ANN 解决的每一个学习问题，我们都能得到这些权重值吗？答案是肯定的“否”。\n\
  \n为了使用 ANN 解决学习问题，我们可以从一组突触权重值开始，并在多次迭代中不断对这些值进行更改。在监督学习中，要追求的目标是减少分类错误的数量。理想情况下，更改权重值的迭代应该持续到没有分类错误为止。然而，在实践中，可能无法达到这样的停止标准。实际的停止标准可能是错误率小于特定的阈值值（例如\
  \ 1%），或最大迭代次数达到阈值（例如 25）等。可能还有其他需要处理的实际挑战，例如错误率没有逐渐减少。当连接数（以及权重数量）不断增加时，这可能会变成一个更大的问题。处理这些挑战的方法，我们将在下一节中详细介绍。\n\
  \n所以，总结一下，使用 ANN 的学习过程是多个方面的结合——这些包括决定隐藏层的数量、每个隐藏层的节点数量、信号流的方向，以及最后但同样关重要的，决定连接权重。\n\
  \n多层前馈网络是一种通用的架构。人们观察到，即使是有一个隐藏层的神经网络也可以合理地近似任何连续函数。用于训练多层前馈网络采用的学习方法被称为反向传播，我们将在下一节中学习。\n\
  \n### 10.8 反向传播 (BACK PROPAGATION)\n\n我们已经看到，训练 ANN 最关键活动之一是分配神经元之间的连接权重。这是一项非常密集的工作，对于具有大量隐藏层或每层具有大量节点的神经网络来说更是如此。1986\
  \ 年，发现了一种高效的 ANN 训练方法。在这种方法中，误差（即输出层输出值与预期值之间的差异）从输出层向之前的层回传播。因此，实现这种方法的算法被称为反向传播，即将误差向后传播到前面的层。\n\
  \n反向传播算法适用于多层前馈网络。反向传播算法通过多次迭代，被称为 `epochs`。每个 epoch 包含两个阶段：\n\n*   **前向阶段 (forward\
  \ phase)**：信号从输入层流向隐藏层再到输出层。\n*   **反向阶段 (backward phase)**：误差从输出层向后传播到之前的层，并根据这些误差调整权重。\n\
  \n反向传播算法通过输出信号与目标值的比较来工作。反向传播算法的一个主要部分是调整连接权重以减少代价函数。这种技术被称为**梯度下降 (gradient descent)**。简单来说，通过计算激活函数的偏导来实现。\n\
  \n```\n![images](img/293-1.png)\n```\n\n**FIG. 10.21** 反向传播算法\n\n#### 思考点：\n\n现实世界中梯度下降算法的类比是一个盲人在山上下山。他看不见路，但他可以通过感知脚下地面的坡度来判断下山的方向。如果他总是向坡度下降的方向走，他最终可能会到达山谷。然而，山中可能有许多山谷（局部最小值），而不是只有一个点（全局最小值）。他可能会被困在一个局部最小值处，认为自己到达了最低点。\n\
  \n\n\n\n\n梯度下降算法分为两种。当一次性使用完整数据集来计算梯度时，被称为`full batch gradient`（全批量梯度）下降。`stochastic\
  \ gradient descent`（随机梯度下降，也称为增量梯度下降）则是迭代地提取较小的数据样本并用于梯度计算。因此，随机梯度下降试图识别全局最小值。\n\
  \n因此，作为梯度下降算法的一部分，需要对代价函数 `E` 关于每个互连权重 `w′[01,]` `w′[02,]` […] `[` `w′*[nr.]` 求偏导。在数学上，可以表示如下：\n\
  \n![images](img/295-2.png)\n\n对于隐藏层中第 `j` 个神经元与输出层中第 `k` 个神经元之间的连接权重。该表达式可以推导出为\n\
  \n![images](img/295-3.png)\n\n如果我们假设 ![img](img/295-4.png) 是对应于第 `k` 个输出神经元的权重 `w[jk]`\
  \ 所需权重调整的一个组件，那么\n\n![images](img/295-5.png)\n\n在此基础上，权重和偏置需要如下进行更新：\n\n![images](img/295-6.png)\n\
  \n注意，“α”是神经网络的学习率。\n\n同样，我们可以对输入层与隐藏层之间的互连权重进行计算。输入层与隐藏层之间连接的权重和偏置需要如下进行更新：\n\n\
  ![images](img/296-1.png)\n\n### 注意\n学习率是一个用户参数，用于增加或减少神经网络互连权重调整的速度。如果学习率过高，作为梯度下降过程部分的调整可能会错过最小值。这时，训练可能无法收敛，甚至可能发散。另一方面，如果学习率太低，由于迈向最小值的步长较小，优化可能会消耗更多时间。\n\
  \n一种平衡的方法是从较大的学习率（例如 0.1）开始训练，因为在开始阶段，随机权重远非最优值。然后，在训练过程中应该降低学习率（例如指数级降低，如 0.01、0.001\
  \ 等），以允许进行更精细的权重更新。\n\n## 10.9 深度学习\n正如我们在本章看到的，神经网络是一类机器学习算法。正如我们所看到的，神经网络的架构有多种选择，多层神经网络是最采用的架构之一。然而，在多层神经网络中，随着隐藏层数量的增加，计算变得变得非常昂贵。在计算上，超过两到三层将变得相当困难。处理这种密集计算的唯一方法是使用图形处理器单元（GPU）计算。\n\
  \n当我们隐藏层数量较少时——最多两到三层——它是一个普通的神经网络，有时被赋予一个华丽的名字“浅层神经网络”。然而，当层数增加时，它被称为深度神经网络。最早的深度神经网络之一具有三个隐藏层。深度学习是深度神经网络的一种更具现代感的品牌化名称，即层数超过三层的多层神经网络。对深度学习更详细的理解超出了本书的范范围。\n\
  \n## 10.10 总结\n*   人工神经网络（ANN）受到生物神经网络的启发。在 ANN 中，神经元的生物形式以电子或数字形式的神经元形式进行复制。\n\
  *   每个神经元都有三个主要组件：\n    *   一组具有权重的突触\n    *   一个用于对相应突触权重加权输入信号的求和节点\n    *   一个阈值激活函数，只有当输入信号超过特定阈值并作为输入时，才会产生输出信号\n\
  *   不同类型的激活函数包括：\n    *   阈值/阶跃函数\n    *   恒等函数\n    *   ReLU 函数\n    *   Sigmoid\
  \ 函数\n    *   双正切函数\n*   ANN 的一些早期实现包括：\n    *   McCulloch–Pitts 神经元模型\n    *  \
  \ 罗森布特的感知器\n    *   ADALINE 网络模型\n*   神经网络的一些架构包括：\n    *   单层前馈 ANN：最简单、最基础的架构，由输入层和输出层组成。\n\
  \    *   多层前馈 ANN – 在输入层和输出层之间有一个或多个隐藏中间神经元层。\n    *   竞争网络 – 类似于单层前馈网络。唯一的区别是输出神经元相互连接（部分或全部连接）。\n\
  \    *   递归网络 – 单层或多层，具有从输出层神经元到输入层神经元的反馈回路。也可能存在自环。\n*   使用 ANN 学习时需要决定的四个主要方面\n\
  \    *   神经网络的层数\n    *   权重调整的方向\n    *   每层节点的数量\n    *   连接权重的值\n\n### 样例题\n\n\
