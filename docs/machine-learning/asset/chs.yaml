  \ rule）可以推导出：\n\n![images](img/120-7.png)\n\n### 5.3.1.4 条件概率\n\n我们在给定事件 `B` 为真的情况下，定义事件\
  \ `A` 的**条件概率**如下：\n\n![images](img/120-8.png)\n\n其中，`p(A, B)` 是 `A` 和 `B` 的联合概率，也可以记作\
  \ `p(A ∩ B)`。\n\n同样，\n\n![images](img/121-1.png)\n\n**示例。** 在一家玩具制造商店，观察到 1000 个零件中有\
  \ 25 个是次品。如果不放回地随机抽取两个样本（这意味着第一个样本不放回批次中），则从剩下的 999 个零件中计算两个样本都是次品的概率。\n\n**解：**\
  \ 让 `A` 表示第一个零件是次品的概率，`B` 表示第二个零件是次品的概率。在这里，在第一个零件已确定为次品的情况下，第二个零件是次品的条件概率。根据概率法则，`p(A)`\
  \ = ![img](img/121-2.png)。由于我们没有将第一个样本放回批次，剩下的 999 个零件中有 24 个次品。\n\n![images](img/121-3.png)\n\
  \n即两个样本都是次品的概率。\n\n### 5.3.1.5 贝斯法则\n\n**贝叶斯法则（Bayes rule）**也称为**贝叶斯定理**，可以通过结合条件概率定义和乘法法则得出：\n\
  \n![images](img/121-4.png)![images](img/121-5.png)![images](img/121-6.png)\n\n**示例：根据发件人姓名将邮件标记为垃圾邮件**\n\
  \n让我们来看一个例子，根据发件人姓名识别邮件是否为垃圾邮件的概率。我们经常收到包含 `bulk`、`mass` 等词汇的邮件，因此我们希望机器学习代理为我们标记这些垃圾邮件以便于删除。\n\
  \n同样，假设发件人名称为 `mass` 或 `bulk` 的邮件是垃圾邮件的可靠性概率为 80%，误报率为 10%，即即使邮件不是垃圾邮件，代理也会将其标记为垃圾。此外，我们知道只有\
  \ 0.4% 的总邮件是垃圾邮件。\n\n**解：** 令 `x` 为当发件人名称为 `mass` 或 `bulk` 时标记为垃圾邮件的事件，`y` 为某些邮件确实是垃圾邮件的事件。所以，`p(x=1|y=1)\
  \ = 0.8` 是标记为垃圾的概率。\n\n很多时候，这个概率被错误地解释为垃圾邮件的概率。这是错误的，因为这样做忽略了只有 0.4% 邮件实际上是垃圾邮件这一先验知识，且在\
  \ 10% 的情况下会出现误报。\n\n所以 `p(y=1) = 0.004`，且 `p(y=0) = 1 - p(y=1) = 0.996`。\n\n`p(x=1\
  \ | y) = 0.1`\n\n使用贝叶斯法则结合这些项，可以计算正确答案：\n\n![images](img/122-1.png)\n\n这意味着如果我们将先验知识与实际测试结果相结合，如果发件人名称包含\
  \ `bulk` 或 `mass`，邮件实际上是垃圾邮件的概率只有约 3%。这远低于之前 80%的假设，因此在开始根据此标记删除此类邮件之前，需要进行额外的检查。\n\
  \n*贝叶斯定理在机器学习中的实际应用将在第 6 章](#chapter006)中讨论。*\n\n## 5.4 随机变量\n\n让我们以掷一次硬币为例。我们可以关联随机变量\
