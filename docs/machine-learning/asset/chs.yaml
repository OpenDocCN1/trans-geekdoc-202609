  \n### 3.5.3 无监督学习 - 聚类\n\n聚类算法试图揭示数据集中的自然分组。然而，评估聚类算法的性能相当困难。聚类在本质上是非常主观的，聚类的好坏取决于解释。正如人们所说，“聚类，仁者眼中仁者智者”。这源于聚类过程中的两个固有挑战：\n\
  \n1.  通常不知道从特定的数据集中可以形成多少个类。在大多数情况下，这是完全开放的，并作为用户输入提供给聚类算法。\n2.  即使给出了类数量，相同数量的类也可以由不同的数据实例形成。\n\
  \n\n\n\n\n在这种方法中，根据用于聚类的底层数据对聚类进行评估。内部评估方法通常根据属于同一簇的数据同质性（homogeneity）以及不同簇数据的异质性（heterogeneity）来衡量聚类质量。同质性/异质性由某些相似性度量决定。例如，`silhouette\
  \ coefficient` 是最流行的内部评估方法之一，它使用数据元素之间的距离（最常用欧几里得距离或曼顿距离）作为相似性度量。轮廓系数的值介于 –1 到 +1，高值表示较高的簇内同质性和簇间异质性。\n\
  \n对于一个聚类为 `k` 个簇的数据集，轮廓的计算计算如下：\n\n![images](img/83-1.png)\n\n`a`(`i`)` 是第 `i` 个数据实例与同一簇内所有其他数据实例之间的平均距离，而\
  \ `b`(`i`)` 是第 i 个数据实例与其他所有簇数据实例之间的最小平均距离。\n\n让我们尝试结合图 3.10 所示的示例来理解这一点。共有四个簇，即簇\
  \ 1、2、3 和 4。让我们考虑簇 1 中一个由星号表示的任意数据元素 `i`。`a`(`i`)` 是簇 1 中不同数据元素与第 `i` 个数据元素之间距离\
  \ `a[i][1]`、`a[i][2]`、…… `a[in][1]` 的平均值，假设簇 1 中有 `n[1]` 个数据元素。用数学表示，\n\n![images](img/83-2.png)![images](img/84-1.png)\n\
  \n**图 3.10** 轮廓系数计算\n\n同样，让我们计算簇 1 中任意数据元素 `i` 与另一个簇（例如簇 4）中不同数据元素的距离，并取所有这些距离的平均值。因此，\n\
  \n![images](img/84-2.png)\n\n其中 `n[4]` 是簇 4 中的元素总数。同样，我们可以计算 `b[12]`（平均）和 `b[13]`（平均）的值。`b`(`i`)`\
  \ 是所有这些值中的最小值。因此，我们可以说，\n\n`b(i) = minimum b[12, b13, b14]`\n\n## 2. *外部评估*\n\n\
  在这种方法中，对于聚类的数据集，类别标签是已知的。然而，显而易见的是，这些类别标签并不是用于聚类的数据。聚类算法的评估基于结果与这些已知类别标签的接近程度。例如，`purity`\
  \ 是聚类算法最流行的度量标准之一——它评估了簇包含单个类别的程度。\n\n对于一个具有 `n` 个数据实例和 `c` 个已知类别标签并生成 `k` 个簇的数据集，纯净度的衡量方法为：\n\
  \n![images](img/84-3.png)\n\n##### 3.6 提高模型性能\n\n现在我们几乎到达了构建学习模型旅程的终点。我们对建模是什么、如何处理它来解决学习问题以及如何衡量我们模型的成功已经有了一些了解。现在来了一个价值百万美元的问题：我们能提高模型的性能吗？如果是，那么提高性能的杠杆是什么？事实上，在在此之前还会遇到模型选择的问题——对于哪种机器学习任务应该选择哪种模型？我们之前已经讨论过，模型选择是从几个方面完成的：\n\
  \n1. 手头任务的学习类型，即监督学习或无监督学习\n2. 数据类型，即类别数据或数值数据\n3. 有时取决于问题领域\n4. 最重要的是，在处理不同模型以解决不同领域问题方面的经验\n\
  \n那么，假设模型选择已经完成，提高模型性能的各种途径有哪些？\n\n提高模型性能的一种有效方法是调整模型参数。`Model parameter tuning`\
  \ 是调整模型拟合选项的过程。例如，在流行的分类模型 `k`-Nearest Neighbour（`k`NN）中，使用不同的 `k` 值或 `k`NN。\n\n\
  作为提高模型性能的另一种方法，可以组合多个模型。这种将具有不同优势的模型组合的方法被称为 `ensemble`（如图 3.11 所示）。集成方法结合较弱的学习器来创建更强的学习器。可以预期获得性能模型。以下是集成过程的典型步骤：\n\
  \n* 基于训练数据构建多个模型\n* 为了使生成的模型具有多样性，可以使用分配函数改变训练数据子集。可以使用自助采样（bootstrapping）等采样技术生成唯一的训练数据集\n\
  * 另一种，可以使用相同的训练数据，但组合的模型差异很大，例如，SVM、神经网络等\n* 使用组合函数组合不同模型的输出。一种非常简单的组合策略（例如在使用集成的预测任务中）可以是对模型进行多数投票。\n\
  \n![images](img/86-1.png)\n\n**图 3.11** 集成\n\n### 3.7 BAGGING\n\n最早且最流行的集成模型之一是自助聚合或\
  \ `bagging`。Bagging 使用自助采样方法（参见 3.3.3 节）生成多个训练数据集。这些训练数据集用于使用相同的学习算法生成（或训练）一组模型。然后通过多数投票（分类）或平均值（回归）组合模型的结果。Bagging\
  \ 是一种非常简单的集成技术，对于决策树等不稳定的学习器效果非常好，因为数据的微小变化会影响模型的输出。\n\n### 3.8 BOOSTING\n\n就像 bagging\
  \ 一样，`boosting` 是另一种关键的集成技术。在这种集成类型中，在重采样数据上训练较弱的学习模型，并根据不同模型的性能使用加权投票法组合结果。`Adaptive\
  \ boosting` 或 `AdaBoost` 是 boosting 算法的一种特殊变体。\n\n### 3.9 RANDOM FOREST\n\n随机森林是另一种集成技术。它是决策树的集成——因此名为随机森林，表示决策树森林。它在第七章\
  \ 中进行了更详细的讨论。\n\n\n\n\n\n[content]\n在本章中，你已经接触了机器学习的核心，即建模。深入理解本章中详述的技术方面对于任何机器学习项目的成功都至关重要。例如，第一个困境在于应该选择哪种模型。同样，在监督学习中，我们如何处理训练数据不足的问题。同样地，一旦在监督学习中完成了模型训练，或者在聚类中完成了分组，我们如何判断模型训练（针对监督学习）或分组（针对无监督）的好坏？所有这些及更多问题已作为本章的一部分进行了介绍。\n\
  \n## 3.7 总结\n\n* 将原始输入数据转换为意义模式的结构化表示称为`model`。\n* 将特定`model` 拟合到数据集的过程称为`model\
  \ training`。\n* 监督学习模型或预测模型试图使用输入数据集来预测某些值。\n* 无监督学习模型或描述性模型被用于描述数据集或从数据集中获取见解。\n\
  * 将输入数据划分为两个部分——训练数据和测试数据，留出部分输入数据以验证训练后的模型的方法称为`holdout method`。\n* 在`k`-折交叉验证技术中，数据集被分为`k`个完全独立的随机分区，称为`folds`（折）。它基本上是\
  \ holdout 方法重复应用到“k”折中。`k`-折交叉验证中的“`k`”值可以设置为任何数字。两种极其流行的方法是：\n    * 10 折交叉验证 (10-fold\
  \ CV)\n    * 留一交叉验证 (LOOCV)\n* `Bootstrap sampling`或简单称为`bootstrapping`是从输入数据集中识别训练集和测试集的一种常用方法。它使用了`有放回随机抽样\
  \ (SRSWR)`技术。Bootstrapping 从输入数据集中随机选取数据实例，存在同一个数据实例被多次选中的可能。\n* 模型的目标函数是定义输入变量（也称为预测变量或自变量）与输出变量（也称为响应变量、因变量或目标变量）之间关系的函数。它的通用形式为：`Y\
  \ = f(X) + e`，其中`Y`是输出变量`X`表示输入变量，“e”是随机误差项。\n* 学习算法近似的目标函数的拟合程度决定了它能多准确地预测其从未见过的数据集的值或类别。\n\
  * 如果目标函数保持过于简单，它可能无法捕捉本质的细差别并良好地表示底层数据。这被称为`underfitting`（欠拟合）。\n* `Overfitting`（过拟合）指的是模型设计得过于接近训练数据。在这种情况下，训练数据中的任何特定细差别（如噪声或离群值）都会嵌入模型中。这对模型在测试数据上的性能产生不利影响。\n\
  * 在监督学习中，基于训练数据构建的学习模型所预测的值可能与实际类别值不同。这种学习误差可分为两种类型——由于“偏差”（bias）引起的误差和由于“方差”（variance）引起的误差。偏差源于模型所做的简化假设，而方差产生于模型与训练数据集过度对齐。\n\
  * 对于任何分类模型，`model accuracy`（模型准确率）是衡量模型优坏的主要指标。它通过正确分类的总数（无论是感兴趣的类别，还是非感兴趣的类别）除以总分类次数得到的。其他指标还有错误率、敏感性、特异性、精确和召回率。\n\
  * 对于无监督学习（聚类），`silhouette coefficient`（轮廓系数或宽度）是最流行的内部评估方法之一。轮廓宽度的高值表示高类内同质性和高类间异性。如果数据集已知类别标签，`purity`（纯度）是另一种常用的衡量标准，评估簇包含单个类别的程度。\n\
  * `Model parameter tuning`（模型参数调优）调整模型拟合选项的过程。例如，在流行的分类模型`k`-最近邻（`k`NN）中，通过使用不同的“`k`”值或考虑的最近邻数量，可以对模型进行调优。\n\
  * 将不同优势的模型组合的方法称为`ensemble`（集成）。`Ensemble methods`组合较弱的学习器以创建更强的学习器。\n* 最早且最流行的集成之一是`bagging`。`Bagging`在多个数据集上组合学习器。\n\
  * 就像 bagging 一样，`boosting`是另一种技术。在 boosting 中，学习器在加权数据上进行训练。\n* `AdaBoost`是 boosting\
  \ 的一种特殊变体。\n\n## 题\n\n## 单选题（1 分题）：\n\n1. 原始输入数据到 ___ 的结构化表示被称为模型。\n    1. pattern\
