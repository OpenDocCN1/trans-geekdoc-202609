  \ 个**突触**。信号 `x[i]` 权重为 `w[i]` 的第 `i` 个突触的输入。权重 `w[i]` 的值可以正或负。正权重对求和节点 `y[sum]`\
  \ 的输出产生激发作用，而负权重则产生抑制作用。\n\n2. 输入信号的**求和节点**通过相应的突触权重进行加权。由于它是加权输入信号的线性组合器或加法器，求和节点的输出\
