  \ 0，则 `x` 和 `y` 之间的角为 90°。\n\n\n\n\n\n# 1. 特征变换\n# 2. 特征子集选择\n\n特征变换将数据转换为新的特征，这些特征可以表示底层的机器学习问题。\n\
  \n特征变换有两种变体：\n\n1. 特征构建\n2. 特征提取\n\n特征构建过程发现特征之间关系的缺失信息，并通过通过创建额外的特征来扩展特征空间。\n\n\
  特征提取是指使用某些函数映射，从原始特征集中提取或创建一组新特征的过程。\n\n机器学习中常用的一些流行的特征提取算法有：\n\n1. 主成分分析 (`PCA`)\n\
  2. 奇异值分解 (`SVD`)\n3. 线性判别分析 (`LDA`)\n\n特征子集选择旨在从完整的特征集中衍生出一个特征子集。它不会生成新特征。\n\n特征选择的目标有三个方面：\n\
  \n1. 获得更快且更具成本效益（即对计算资源的需求更少）的学习模型\n2. 提高学习模型的效率\n3. 更好地理解生成数据的底层模型\n\n特征选择旨在移除所有无关的特征，并从潜在冗余的特征中选取具有代表性的子集。这在特定的学习任务背景下产生了有意义的特征子集。\n\
  \n特征相关性通过根据相对熵测量的特征信息增益来指示。\n\n特征冗余性基于多个特征贡献的相似信息，通过特征与特征之间进行衡量：\n\n1. 相关性\n2. 距离（闵可夫斯距离，例如曼哈顿距离、欧几里得距离等是最常用的测量）\n\
  3. 其他基于系数的方法 (`Jaccard`、`SMC`、`余弦相似度`等）\n\n特征选择的主要方法有：\n\n1. 过滤 (Filter)\n2. 包装\
