  \n#### 3. 其他相似性衡量\n\nJaccard 指数/系数被用作两个特征之间相似性的衡量。Jaccard 距离作为两个特征之间差异性的衡量，是 Jaccard\
  \ 指数的互补。\n\n`![img](img/108-1.png)`\n\n**图 4.10 特征之间的距离衡量**\n\n对于具有二值的特征，Jaccard\
