  \ 3.460931 1.884826\n\n### A.5.2.3 线性判别分析 (LDA)\n\n为了执行线性判别分析，可以使用 `MASS` 包中的 `lda`\
  \ 函数。以下是使用 UCI 数据集 `btissue` 的代码。\n\n![images](img/343-1.png)\n\n上述函数的输出见图 A.9\n\
  \n![images](img/344-1.png)\n\n**图 A.9** btissue 数据集的 LDA\n\n## A.5.3 特征子集选择\n\n\
  特征子集选择是一个深入的研究的话题。有许多方法可以选择特征子集以提高模型性能。本文无法涵盖所有此类方法。然而，仅对于基础特征选择功能，可以使用 R 语言的 `FSelector`\
  \ 包。\n\n```r\nlibrary(FSelector)\ndata <- iris\nfeat_subset <- cfs(Species ~ .,\
  \ data) # 使用相关性和熵度量对连续和离散数据选择特征子集\n```\n\n以下是一个在应用于模型训练之前执行特征子集选择的程序。\n\n```r\n\
  library(caret)\nlibrary(FSelector)\ninputdata <- read.csv“apndcts.csv”)\nsplit =\
  \ 0.7\nset.seed(123)\ntrainIndex <- createDataPartition (y = inputdata$class, p\
  \ = split, list = FALSE)\ntrain_ds <- inputdata [trainIndex,]\ntest_ds <- inputdata\
  \ [-trainIndex,]\nfeat_subset <- cfs(class ~ ., train_ds) #Feature selection done\
  \ class <- train_ds$class\ntrain_ds <- cbind(train_ds[feat_subset], class) # Subset\
  \ training data created\nclass <- test_ds$class\ntest_ds <- cbind(test_ds[feat_subset],\
  \ class) # Subset test data created\ntrain_ds$class <- as.factor(train_ds$class)\n\
  test_ds$class <- as.factor(test_ds$class)\n# 在此处应用决策树分类器。任何其他模型也可以应用 ……\nmodel <-\
  \ train(class ~ ., method = “rpart”, data = train_ds) predictions <- predict(model,\
  \ test_ds, na.action = na.pass)\ncm <- confusionMatrix(predictions, test_ds$class)\n\
  cm$overall['Accuracy']\n```\n\n**注意：**\n`FSelector` 包包含了关键函数，如朴素贝叶（Naive Bayes）和支持向量机（SVM)。\n\
  \n## A.6 模型\n\n### A.6.1 监督学习\n\n`FSelector` 包对于分类算法非常重要。\n\n#### A.6.1.1 朴素贝斯\n\
  \n为了实现此分类器，使用了 `FSelector` 包中的 `naiveBayes` 函数。完整代码如下。\n\n```r\nlibrary(caret)\n\
  library(FSelector)\ninputdata <- read.csv“apndcts.csv”)\nsplit = 0.7\nset.seed(123)\n\
  trainIndex <- createDataPartition (y = inputdata$class, p = split, list = FALSE)\n\
  train_ds <- inputdata [trainIndex,]\ntest_ds <- inputdata [-trainIndex,]\ntrain_ds$class\
  \ <- as.factor(train_ds$class)\ntest_ds$class <- as.factor(test_ds$class)\nmodel\
  \ <- naiveBayes(class ~ ., data = train_ds)\npredictions <- predict(model, test_ds,\
  \ na.action = na.pass)\ncm <- confusionMatrix(predictions, test_ds$class)\ncm$overall['Accuracy']\n\
  ```\n\n**输出：**\n0.838797\n\n#### A.6.1.2 kNN 分类器\n\n为了实现此分类器，使用了 `caret` 包中的 `knn`\
  \ 函数。完整代码如下。\n\n```r\nlibrary(caret)\nlibrary(FSelector)\ninputdata <- read.csv“apndcts.csv”)\n\
  split = 0.7\nset.seed(123)\ntrainIndex <- createDataPartition (y = inputdata$class,\
  \ p = split, list = FALSE)\ntrain_ds <- inputdata [trainIndex,]\ntest_ds <- inputdata\
  \ [-trainIndex,]\ntrain_ds$class <- as.factor(train_ds$class)\ntest_ds$class <-\
  \ as.factor(test_ds$class)\nmodel <- knn(train_ds, test_ds, train_ds$class, k =\
  \ 3)\ncm <- confusionMatrix(model, test_ds$class)\ncm$overall['Accuracy']\n```\n\
  \n**输出：**\n1\n\n#### A.6.1.3 决策树分类器\n\n为了实现此分类器，可以使用 `caret` 包中的 `train` 函数并配合参数\
  \ `method = “rpart\"` 来指示 train 函数将使用决策树分类器。可选情况下，也可以使用 `rpart` 包中的 `rpart` 函数。完整代码如下。\n\
  \n```r\nlibrary(caret)\nlibrary(rpart)\ninputdata <- read.csv“apndcts.csv”)\nsplit\
