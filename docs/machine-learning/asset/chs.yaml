  2. 阶跃函数与 sigmoid 函数\n3. 单层感知与多层感知器\n\n## 第 11 章\n\n## 其他学习类型\n\n#### 本章目标：\n\n在之前的章节中，你已经对有监督学习算法和无监督学习算法有了良好的理解。在本章中，我们将讨论之前章节未涵盖的学习类型，包括表示学习、主动学习、基于实例的学习、关联规则和集成学习。在本章结束时，你将获得关于学习各个方面的充分知识，并准备好独立解决问题。\n\
  \n## 11.1 引言\n\n在本章中，我们将讨论之前章节未涵盖的学习类型，包括表示学习、主动学习、基于实例的学习、关联规则和集成学习。\n\n### 11.2\
  \ 表示学习\n\n表示学习（Representation learning）的另一个名称是特征学习。虽然许多企业现在保留了大量的业务相关数据，但其中大多数数据通常是非结构化且未标记的。创建新标签通常是耗时且昂贵的尝试。因此，能够直接从未标记数据中挖掘结构以提高业务性能的机器学习算法具有很高的价值。表示学习就是其中一种类型，它使用\
  \ `neural network` 从整体未标记数据中进行提取。表示学习（特征学习）的主要目标是基于特征找到数据的适当表示以执行机器学习任务。由于其流行，表示学习已成为一个独立的领域。请参考第\
  \ 4 章“特征工程基础”以了解更多关于特征和特征选择的过程。三角形的一些特征示例是角（顶点）、边和角度。三角形三个角之和等于 180°。系统的运行方式如下：\n\
  \n**输入** – 三角形图像\n**表示** – 三个角度，边长。\n**模型** – 它获取输入表示（角度、边长）并应用表 11.1 来检测三角形的类型。\n\
  \n很好！现在，我们有了一个检测三角形类型的表示系统。\n\n当我们开始输入正方形、矩形、圆形而不是三角形时会发生什么？如果图像同时包含三角形和圆形怎么办？在处理现实应用时，设计适应这种特征需要领域知识。深度学习更进一步，能够自己尝试学习特征。我们只需要输入图像作为输入，让系统像人类一样学习。表示学习广泛应用于单词、语音识别、信号处理、音乐和图像识别。例如，一个词的含义取决于上下文。\n\
  \n**表 11.1** 三角形类型\n\n![images](img/302-1.png)![images](img/303-1.png)\n\n**图 11.1**\
  \ 生成与识别\n\n在图 11.1 中，V 代表输入数据，H 代表原因。当原因(H)解释了我们观察到的数据(V)时，被称为识别。当未知原因(H)组合时，它可以生成数据(V)，被称为生成式（或生成）。\n\
  \n表示学习的灵感源于事实：机器学习任务（如分类）通常需要数学和计算上易于处理的数值输入。然而，对于图像和视频等现实物体，通过算法定义特征是非常的。另一种方法是通过观察直接发现此类特征或表示。因此，表示学习可以是有监督的也可以是无监督的。\n\
  \n1. 有监督神经网络和多层感知器\n2. 独立成分分析（无监督）\n3. 自动编码器（无监督）和\n\n\n\n\n\n# 4. 聚类的各种变形式。\n\n\
  ## 11.2.1 有监督神经网络与多层感知器\n\n请参考第 10 章标题“神经网络基础”，以了解更多关于神经网络的议题。\n\n### 11.2.2 独立成分分析（无监督）\n\
  \n独立成分分析，或 `ICA` 与主成分分析 (`PCA`) 相似，不同之处在于分量是独立且不相关的。`ICA` 主要用于在与未知矩阵 `(A)` 进行线性混合后，从观测到的线性混合中分离未知源信号。除了有\
  \ `N` 种不同的记录混合外，对源或混合过程一无所知。其任务是通过寻找一个方矩阵 `(W)`（指定了线性反转混合过程的空间滤波器，即 `U = WX`）来恢复源\
  \ `(S)` 的版本 `(U)`，这些版本除了缩放和排列外完全相同。最大化神经处理器输出的联合熵 `H(y)` 可以最小化输出分量之间的互信息（参考图 11.2）。\n\
  \n![images](img/304-1.png)\n\n**图 11.2** 独立成分分析\n\n### 11.2.3 自动编码器\n\n自动编码器属于神经网络族（参考图\
  \ 11.3），与主成分分析 (`PCA`) 相似。它们比 `PCA` 更灵活。自动编码器表示线性性和非线性变换，而 `PCA` 仅表示线性变换。神经网络（自动编码器）的目标输出是其以不同形式\
  \ `(x’)` 的输入 `(x)`。在自动编码器中，输入的维度等于输出的维度，本质上我们想要的是 `x’ = x`。`x’ = Decode (Encode(x))`\n\
  \n![images](img/304-2.png)\n\n**图 11.3** 自动编码器\n\n为了获得隐藏层的值，我们将（输入到隐藏层）权重乘以输入。为了获得输出层的值，我们将（隐藏层到输出）权重乘以隐藏层值。\n\
  \n```\nZ = f (Wx)\nY = g (Vz)\nSo `Y = g(V f (Wx)) = VWx`\n```\n\n因此目标函数 `J = ∑\
  \ [Xn – VWx (n)]²`\n\n### 自动编码器的启发式算法\n\n自动编码器训练算法可以总结如下：\n\n对于每个输入 `x`\n\n1. 进行前向传播以计算所有隐藏层的激活值，然后在输出层计算以获得输出\
  \ `X ^′`\n2. 测量 `X ^′` 与输入 `X` 的偏差\n3. 将误差反向传播通过网络并进行权重更新。\n\n## 11.2.4 聚类的各种形式\n\
  \n参考第 9 章标题“无监督学习”，了解更多关于聚类的各种形式。\n\n## 11.3 主动学习\n\n主动学习是半监督学习的一种类型，其中学习算法可以交互地查询（提问）用户，以在新数据点上获得期望的输出。\n\
  \n令 `P` 为所考虑的所有数据的种群。例如，已知在大学学习的所有男学生都有一种特别奇特的学习模式。\n\n在每次迭代 `I` 中，`P`（总种群）被分为三个子集。\n\
  \n1. `P(K, i)`：标签已知的 `(K)` 数据点\n2. `P(U, i)`：标签未知的 `(U)` 数据点\n3. `P(C, i)`：`P(U,\
  \ i)` 中被选择 `(C)` 进行标记的子集。\n\n这类主动学习目前的研究集中在识别选择 `(C)` 数据点的最佳方法 `P(C, i)`。\n\n###\
  \ 11.3.1 主动学习的启发式算法\n\n1. 从未标记数据池 `P(U, i)` 开始\n2. 随机选取几点并获取标签 `P(C, i)`\n3. 重复\n\
  \n某些主动学习算法基于支持向量机 (`SVMs`) 来确定确定要标记的数据点。此类方法通常计算 `P(U, i)` 中每个未标记数据的边际 `(W)`，并假设\
  \ `W` 是从待覆盖数据到划分超平面的 `n` 维空间距离。\n\n最小边际超平面 (`MMH`) 技术认为，具有最小边际 `(W)` 的数据记录是那些 `SVM`\
  \ 最不确定的数据，因此应保留在 `P(C, i)` 中进行标记。其他类似方法（如最大边际超平面）则选择具有显著 `W`（`n` 维空间）的数据。其他方法是选择最小和最大的\
  \ `Ws` 组合。\n\n### 11.3.2 主动学习查询策略\n\n确定哪些数据点应该标记的逻辑有：\n\n1. 不确定性采样\n2. 委员会查询\n3.\
  \ 期望模型变化\n4. 期望误差减少\n5. 方差减少\n\n**不确定性采样**：在该方法中，主动学习算法首先尝试对当前模型对于正确输出最不明确的点进行标记（因为这意味着在输出上存在很大困惑）。\n\
  \n**委员会查询**：在当前已标记数据上训练一系列模型，并对未标记数据的输出进行投票；标记那些“委员会”分歧最大的点。\n\n**期望模型变化**：在该方法中，主动学习算法首先尝试标记那些对模型产生最大影响的点。\n\
  \n**期望误差减少**：在该方法中，主动学习算法首先尝试标记那些能大幅减少模型误差的点。\n\n**方差减少**：在该方法中，主动学习算法首先尝试标记那些能显著减少方差的点。\n\
  \n## 11.4 基于实例的学习\n\n在实例学习（基于记忆的学习）中，算法将新实例与现有实例进行比较，而不是显式泛化。因为它从训练实例（记忆）本身构建假设，因此被称为基于实例的。\n\
  \n实例学习的示例包括 K 近邻算法 (`K`-NN)、核机和径基函数 (`RBF`) 网络。\n\n所有这些算法都存储已知实例并计算它们之间的距离或相似性以做出最终决策。实例减少算法可以解决内存复杂性和过拟合问题。让我们详细查看径基函数。\n\
  \n### 11.4.1 基函数\n\n径基函数 (`RBF`) 网络通常有三层：一个输入层、一个带有非线性 RBF 激活函数的隐藏层以及一个线性输出层。（参考图\
  \ 11.4）。\n\n![images](img/307-1.png)\n\n**图 11.4** 基函数\n\n在上面的图中，输入向量 `(x)` 用作所有径基函数的输入，每个函数具有不同的参数。输入层\
  \ `(X)` 仅仅是一个扇出层，在这里不进行处理。第二层（隐藏层）执行径基函数，这是从输入空间（向量 X）到高维空间的非线性映射。网络的输出 `(Y)` 是径基函数输出的线性组合。如果需要模式分类（在\
  \ Y 中），则可以在输出神经元上放置硬限位器或 Sigmoid 函数以产生 0/1 输出值。\n\n径基函数网络 (RFFN) 的独特部分是在隐藏层中实现的程序。其思想是输入空间中的模式形成了类。超出该区域（聚类区域、RFB\
  \ 函数区域），值会急剧。高斯函数是最常用的径基函数。在 RBF 网络中，*r* 是距离聚类中心的距离。\n\n\n\n\n\n从聚类中心计算的空间（距离）通常是欧几里得距离。对于隐藏层中的每个神经元，权重代表了聚类中心的坐标。因此，当该神经元接收到输入模式\
  \ `X` 时，通过以下方程找到距离：\n\n![images](img/307-2.png)\n\n变量 `sigma`、`σ` 表示钟形形状的宽度或半径，通过计算来确定。当距离高斯分布中心的距离达到\
  \ `σ` 时，输出从 1 降到 0.6。\n\n![images](img/307-3.png)\n\n输出 `y(t)` 是隐藏层输出的加权和，公式如下：\n\
  \n![images](img/308-1.png)\n\n其中\n\n* `u(t)` 是输入\n* `ϕ(.)` 是任意的非线性径向基函数\n* `‖.‖`\
  \ 表示范数，通常假设为欧几里范数\n* `c[i]` 是径向基函数的已知中心\n* `w[i]` 是函数的权重\n\n在径向函数中，响应随与中心点的距离而单调递（（增），并且它们是径向对称的。中心、距离尺度以及径向函数的精确形状是定义模型必须考虑的因素。最常用的径向函数是高斯径向滤波器，它在标量输入的情况下为：\n\
  \n![images](img/308-2.png)\n\n它的参数是中心 `c` 和半径 `β`（宽度），图中展示了一个中心 `c = 0` 半径 `β =\
  \ 1` 的高斯 RBF。高斯 RBF 随距离中心的距离而单调递减。\n\n### 11.4.2 基于实例的学习方法的优缺点\n\n**优点：** 基于实例的学习（IBL）方法特别适用于目标函数高度复杂的问题，但也可以通过一组不那么复杂的局部近似来定义。\n\
  \n**缺点 I：** 对新实例进行分类的代价很高（大部分计算发生在此阶段）。\n\n**缺点 II：** 许多 IBL 方法通常研究实例的所有特征，导致了与维度相关的问题。\n\
  \n## 11.5 关联规则学习算法\n\n关联规则学习是一种提取能够最能解释数据中变量间观测关系规则的方法。这些规则可以从大型多维数据集中发现重要且具有商业价值的关联，组织可以利用这些关联。最流行的关联规则学习算法是\
  \ Apriori 算法和 Eclat 算法。\n\n### 11.5.1 Apriori 算法\n\nApriori 设计用于处理包含各种类型交易的大型数据库（例如客户购买的产品组合，或客户频繁访问网站详情）。Apriori\
  \ 算法使用“自下而上”的方法，每次扩展一个重复的子集（这一步被称为候选生成，并根据数据对候选集组进行测试）。Apriori 算法是一种用于布尔关联规则频繁项集挖掘的强强大算法。请参考第\
  \ 9 章“无监督学习”以了解更多关于该算法的信息。\n\n### 11.5.2 Eclat 算法\n\nECLAT 代表“**等价类聚类（E**quivalence\
  \ Class **C**lustering）和自下而上的晶格遍历（Lat**tice Traversal”。Eclat 算法是另一组频繁项集生成方法，与 Apriori\
  \ 算法类似。它支持三种遍历方法，如“自上而下”、“自下而上”和混合方法。这里存储了事务 ID（TID 列表）。它以垂直格式表示数据。\n\n第 1 步：为每个项目获取事务\
  \ ID：`tidlist`（数据库扫描）。\n\n第 2 步：`{a}` 的事务 ID (`tidlist`) 正好是包含 `{a}` 的事务列表。\n\n\
  第 3 步：将 `{a}` 的 tidlist 与所有其他项目的 tidlist 取交，得到 `{a,b}`、`{a,c}`、`{a,d}` 等…… = `{a}`-条件数据库（如果删除了\
  \ `{a}`）。\n\n第 4 步：在 `{a}`-条件数据库上重复第 1 步。第 5 步：对所有其他项目重复此操作。\n\n## 11.6 集成学习算法\n\
  \n集成（Ensemble）意味着协作/联合/分组。集成方法是包含许多弱模型的模型，这些模型是经过自主训练的，它们的预测结果通过近似组合来创建一个整体预测模型。需要更多的精力来研究弱学习器的类型以及组合它们的各种方法。\n\
  \n最流行的集成学习算法有：\n\n* 自助自助聚合 (bagging)\n* 提升 (Boosting)\n* AdaBoost\n* 堆叠泛化 (blending)\n\
  * 梯度提升机 (GBM)\n* 梯度提升回归树 (GBRT)\n* 随机森林\n\n#### 11.6.1 自助聚合 (Bagging)\n\n自助自助聚合\
  \ (bagging) 使用自助采样方法的原理。给定的一个包含 `m` 个示例的训练数据集 `D`，自助采样方法通过有放回随机选取 `m` 个示例抽取样本 `D[i]`。它包含两个阶段，即训练阶段和分类阶段。\n\
  \n**训练阶段：**\n\n1. 初始化参数\n2. `D = {Ф }`\n3. `H = 分类数量`\n4. 对于 `k = 1 到 h`\n5. 从训练集\
  \ `S` 中取一个自助样本 `S[k]`\n6. 使用 `S[k]` 作为训练集构建分类器 `D[k]`\n7. `D = D ⋃ D[i]`\n\n**分类阶段：**\n\
  \n1. 在输入 `k` 上运行 `D[1]`、`D[2]`、……`D[k]`\n2. 选择得票最多的类别作为 `X` 的标签。\n\n![images](img/310-1.png)\n\
  \n在上面的示例中，原始样本有八个数据点。所有的自助样本也有八个数据点。在同一个样本中，由于放回选择，数据点是重复的。\n\n#### 11.6.2 提升 (Boosting)\n\
  \n就像 bagging 一样，boosting 是另一种基于集成的技术。Boosting 是一种迭代技术。它减少偏差误差。如果一个观测值被错误分类，则增加该观测值的权重。在这种集成类型中，弱学习模型在重采样数据上训练，并根据不同模型的性能使用加权投票法组合结果。自适应提升或\
  \ AdaBoost 是提升 算法的一种特殊变体。它基于通过生成弱学习器并缓慢学习的思想。\n\n### 11.6.3 梯度提升机 (GBM)\n\n正如我们所知，boosting\
  \ 是将弱学习器提升为强学习器的机器学习算法。我们可能已经知道学习器从训练数据估计目标函数。梯度提升是梯度的提升。\n\n**梯度：** 将 `L` 视为第 `i`\
  \ 个变量的函数，其他 `N - 1` 个变量固定在当前点，通过计算该点处的导数（`L` 是可微的），我们——如果导数为正/负——得到第 `i` 个变量的减少/增加值，以减小损失。对所有\
  \ `i = 1… N` 应用上述计算，我们将得到 `N` 个导数值组成一个向量，即 `N`变量函数在当前点的梯度。\n\n## 11.7 正则化算法\n\n\
  这是对另一种方法（通常是回归方法）的扩展，它根据复杂度对模型进行惩罚，倾向于泛化能力更好的简单模型。正则化算法在这里单独列出是因为它们有名、有影响力，且通常是对其他方法的简单修改。\n\
  \n最流行的正则化算法有：\n\n* 岭回归\n* 最小绝对收缩和选择算 (LASSO)\n* 弹性网络\n* 最小角回归 (LARS)\n\n请参考第 8 章“监督学习：回归”以了解岭回归和\
  \ LASSO 方法。\n\n**弹性网络**\n\n\n\n\n\n当我们处理具有大量独立变量的高维数据集时，变量之间的相关性（关系）往往会导致多共线性。这些严格相关的相关变量有时会形成组或聚类，称为相关变量的弹性网（elastic\
  \ net）。即使只选择了一个变量，我们也希望在模型选择中包含整个组。\n\n## 11.8 总结\n\n*   `表示学习`(Representation learning）的另一个名称是`特征学习`(feature\
  \ learning）。\n*   `表示学习`(Representation learnings）最广泛应用于词汇、语音识别、信号处理、音乐和图像识别。例如，一个词可以根据上下文具有含义。\n\
  *   `独立成分分析`(Independent component analysis）或`ICA`与`主成分分析`(principal components\
  \ analysis）相似，区别在于分量是独立的且互不相关的。\n*   `自动编码器`(Autoencoders）属于神经网络族，与`PCA`（主成分分析 PCA）相似。它们比`PCA`更灵活。\n\
  *   `主动学习`(Active learning）是一种半监督学习，其中学习算法可以交互地查询（提问）用户，以在新数据点上获得所需的输出。\n*   `不确定性采样`(Uncertainty\
  \ sampling)：在这种方法中，主动学习算法首先尝试对当前模型在正确输出上最不确定（这意味着很大困惑）的点进行标记。\n*   在`基于实例的学习`(instance-based\
  \ learning，即基于内存的学习)中，算法将新问题实例与训练中已经看到的实例进行比较，这些实例存储在内存中供参考，而不是进行显式的泛化。\n*   `基于实例的学习\
  \ 1instance-based learning)的示例包括`K 最近邻算法`(K-NN)、`核机器`(支持向量机 Support Vector Machine、PCA)和`径向基函数网络`(RBF\
  \ networks)。\n*   `径向基函数`(RBF) 网络通常有三层：一个输入层、一个具有非线性 `RBF` 激活函数的隐藏层，以及一个线性输出层。\n\
  *   `关联规则学习`(Association rule learning)是提取最能解释数据中变量观测关系规则的方法。这些规则可以在大型多维数据集中发现重要且具有商业价值的关联，供组织利用。\n\
  *   `Apriori` 设计用于运行包含各种类型交易的大型数据库（例如客户购买的产品集合，或客户频繁访问的网站详细信息）。\n*   `ECLAT` 代表“等价类聚类和自底向上的格遍历”。`Eclat`算法是另一组与`Apriori`算法类似的频繁项集生成方法。支持三种遍历方法，如“自顶向下”、“自底向上”和“混合”方法。\n\
  *   `集成 1Ensemble)意味着协作/联合/组合。`集成方法 1Ensemble methods)包含许多自主训练的弱模型，这些模型的预测结果经过组合以创建整体预测模型。\n\
