  \n### 注意：\n\n`\"#\"` 用于插入内联注释\n\n`<-` 和 `=` 是等效的替代赋值运算符\n\n### A.1.3.2 R 中的基本数据类型\n\
  \n* **向量 (Vector):** 该数据结构包含相似类型的数据，即整数、双精度浮点数、逻辑、复数等。使用函数 `c()` 创建向量。\n\n    ```\n\
  \    num <- c(1,3.4,-2,-10.85) #numeric vector\n    char <- c(“a”,“hello”,“280”)\
  \ #character vector\n    bool <- c(TRUE,FALSE,TRUE,FALSE,FALSE) #logical vector\n\
  \    print(num)\n    ```\n    [1] 1.0 3.4 -2.0 -10.85\n\n* **矩阵 (Matrix):** 矩阵是一个二维数据结构，可以使用\
  \ `matrix()` 函数创建。可以使用 `nrow` 和 `ncol` 参数定义行和列的值。然而，不需要提供两个参数，另一个维度可以通过 `length`\
  \ 参数（第一个索引：最后一个索引）自动获取。![images](img/319-1.png)\n\n* **列表 (List):** 这种数据结构与向量略有不同，之处在于它包含了不同数据类型的混合。列表使用\
  \ `list()` 函数创建。![images](img/319-2.png)\n\n* **因子 (Factor):** 因子将分类值存储为范围在 `[1…k]`\
  \ 内的整数向量（其中 `k` 是分类变量中唯一值的数量），以及一个映射到这些项目的内部字符字符串向量（原始值）。\n\n    ```\n    data <-\
  \ c(‘A’,‘B’,‘B’,‘C’,‘A’,‘B’,‘C’,‘C’,‘B’)\n    fact <- factor(data)\n    fact\n \
  \   [1] A B B C A B C C B\n    Levels: A B C\n    ```\n    ```\n    table(fact)\
  \ #以表格格式排列参数项 fact\n    A B C #唯一项目映射到频数\n    2 4 3\n    ```\n\n* **数据框 (Data frame):**\
  \ 这种数据结构是列表的一种特例，其中每个组件的长度相同。数据框使用 `frame()` 函数创建。![images](img/319-4.png)\n\n###\
  \ A.1.3.3 循环\n\n#### For 循环 (For loop)\n\n**语法：**\n\n```\nfor (variable in sequence)\n\
