  让我们来看一个例子，无监督学习如何帮助将电影推广推给正确的人群。在过去，电影推广是将相同的数据盲目地推给所有人口统计群体，无论人们的选择或偏好如何，每个人都会看相同的海报或预告片。因此，在大多数情况下，观看推广或预告片的人最终会忽略它，导致导致推广精力和金钱的浪费。但随着智能设备和应用程序的出现，现在有了海量数据库来理解不同人口统计群体喜欢什么种类型的电影。机器学习有助于发现该数据库中较小群体/簇的模式或重复行为，从而提供关于人口统计中不同群体对某些类型电影的喜好的智能信息。因此，通过使用这些智能信息，智能应用程序可以只向选定的群体推送相关的电影推广或预告片，这将显著增加触达电影目标感兴趣人群的概率。\n\
  \n在本章中，我们将讨论两种用于解释无监督学习底层原理的方法——聚类（Clustering）和关联分析（Association Analysis）。`Clustering`\
  \ 是一类广泛的方法，用于发现数据中未知的子群，这是无监督学习中最重要的概念。另一种技术是 `Association Analysis`，它识别观测值的低维表示，以解释方差并识别用于解释的关联规则。\n\
  \n## 9.3 无监督学习的应用\n\n由于无监督学习可以处理未分类和未标记的数据，具有灵活性，在许多领域都有其应用。以下是此类应用的少数示例：\n\n* 广告咨询机构根据人口统计、财务数据、购买习惯等少数维度对目标消费者群体进行细分，以便广告商能够高效地触达其目标消费者\n\
  * 银行业通过识别贷款违约者的模式进行异常或欺诈检测\n* 图像处理和图像分割，如人脸识别、表情识别等\n* 对基因中的重要特征进行分组，以识别遗传学新领域中的重要影响因素\n\
  * 数据科学家利用聚类减少样本数据中的维度以简化建模\n* 文档聚类和识别潜在的标记选项\n\n今天，无监督学习已用于许多涉及人工智能（AI）和机器学习（ML）的领域。聊天机器人、自动驾驶汽车以及许多近期创新都是无监督学习和监督学习结合的结果。\n\
  \n因此，在本章中，我们将涵盖无监督学习的两个主要方面，即 `Clustering`（它有助于将对象集合分成相似对象的组）和 `Association Analysis`（它与数据集中对象之间关系的识别有关）。\n\
  \n## 9.4 聚类\n\n聚类（Clustering）是指一组广泛的技术，根据数据集中对象的特征在数据集中寻找子群或簇（clusters），使得组内的对象是相似的（或相互相关的），但与其他组的对象不同（或互不相关）。聚类的有效性取决于组内对象有多相似或多相关，或者不同组之间的对象之间有多大差异或多不相关。定义两个对象是否相似或不相似通常取决于特定的领域，因此，它是无监督机器学习任务的一个重要方面。\n\
  \n例如，假设我们想为某项全国性的推广活动投放一些新电影的广告。我们拥有该国不同地区的人的年龄、位置、财务状况和政治稳定性的数据。我们可能希望根据已有的数据对不同地区进行分组并运行不同类型的活动。通过分析人员特征获得的任何逻辑分组都将帮助我们更有针对性地开展活动。聚类分析可以通过分析对人群分组的不同方式并得出不同类型的簇来帮助这项活动。\n\
  \n聚类分析在许多不同领域都得到了有效使用，例如：\n\n* 文本数据挖掘：这包括文本分类、文本聚类、文档摘要、概念提取、情感分析和实体关系建模等任务\n* 客户细分：根据人口统计、财务状况、购买习惯等参数创建客户簇，零售商和广告商可以使用这些簇在正确的领域中推广其产品\n\
  * 异常检查：检查异常行为，如欺诈银行交易、未经授权的计算机入侵、雷达扫描仪上的可疑移动等\n* 数据挖掘：通过对极大数据集中的大量特征进行分组来简化数据挖掘任务，使分析变得具有可操作性\n\
  \n在本节中，我们将讨论与聚类这一机器学习任务相关的方法，它涉及寻找数据的自然分组。重点将是：\n\n* 聚类任务与分类任务有何不同以及聚类如何定义组\n* 一个经典且易于理解的聚类算法，即\
  \ `k`-means，它与 `k`-medoids` 算法一起用于聚类\n* 聚类在现实场景中的应用\n\n### 9.4.1 作为机器学习任务的聚类\n\n\
  聚类知识的主要驱动力是发现而非预测，因为在开始聚类分析之前，我们可能甚至不知道在寻找什么。因此，聚类被定义为一种无监督机器学习任务，它自动将数据划分为`clusters`（簇）或相似项组。该分析在不需要预先知道所需的组类型的情况下实现，从而可以对数据集中的自然分组提供洞察。聚类任务的主要指南是，簇内部的数据之间应该非常相似，但与簇外部的数据非常不同。我们可以假设相似性的定义可能随应用而异，但基本思想始终是一样的，即创建一个组，将相关元素放在一起。利用这一原则，每当出现大量多样且多异的数据进行分析时，聚类能够以较少的分组来表示数据。它有助于降低复杂性，并对关系模式提供洞察，从而在数据内部产生意义且可操作的结构。聚类的有效性通过组内的质性以及不同组之间的差异来衡量。请参考图\
  \ 9.1。\n\n从上述讨论来看，似乎通过聚类，我们正尝试给对象标记类标签。但聚类与监督学习章节中讨论的分类和数值预测有所不同。在这些这些中，目标都是创建一个将特征与结果或其他特征联系起来的模型，并且模型识别数据内部的模式。相比之下，聚类创建了新数据。未标记的对象被赋予一个簇标签，该标签完全是从数据内部属性之间的关系推断出来的。\n\
  \n\n\n\n让我们来看一个例子。你被邀请到一所著名的大学进行关于机器学习的课程，以对该校教授进行培训。在创建课程材料之前，你想了解教授们对该主题的熟悉程度，以确保课程成功。但你不想询问邀请大学，而是根据免费获取的数据进行自行分析。由于机器学习是统计学和计算机科学的交叉学科，你还关注了来自这两个领域的教授。因此，你在互联网上搜索了这些教授的研究论文列表，并使用机器学习算法对论文进行分组，从而推断出教授们的专业领域分为三个类别：统计学、计算机科学和机器学习。\n\
  \n在绘制这些教授在两个核心领域（即统计学和计算机科学）的论文数量后，你得到了如图 9.2 所示的散点图。\n\n![images](img/245-1.png)\n\
  \n**图 9.1** 无监督学习 – 聚类\n\n![images](img/245-2.png)\n\n**图 9.2** 会议参与者的数据集\n\n从数据的模式分析中得出一些推论：数据中似乎出现了三个群体或聚类。纯统计学家的计算机科学相关论文非常少，而纯计算机科学教授的统计学相关论文数量少于计算机科学相关论文。还有第三类教授，他们在这两个领域都发表过论文，因此可以假设他们是精通机器学习概念的人员，如图\
  \ 9.3 所示。\n\n因此，在上述问题中，我们利用数据逻辑分组的视觉指示来识别模式或聚类，并将数据标记为三个不同的聚类。我们聚类的主要驱动因素是点与点之间的接近程度，形成了一个组。聚类算法使用非常相似的方法来衡量数据点之间的关联程度，并决定它们是否可以标记为一个同质组。在下一节中，我们将讨论几种重要的聚类类算法。\n\
  \n![images](img/246-1.png)\n\n**图 9.3** 会议参与者的聚类\n\n## 9.4.2 不同类型的聚类技术\n\n主要的聚类技术有：\n\
  \n*   划分方法 (Partitioning methods)，\n*   层次方法 (Hierarchical methods)，以及\n*   基于密度的方法\
  \ (Density-based methods)。\n\n它们在创建聚类的方法、衡量聚类质量的方法以及适用性上是不同的。表 9.1 总结了每种参考方法的主要特征。\n\
  \n**表 9.1** 不同的聚类方法\n\n![images](img/247-1.png)\n\n我们将在接下来的章节中详细讨论这些方法及其相关技术。\n\n\
  ## 9.4.3 划分方法\n\n基于划分的聚类的两个最重要的算法是 `k-means` 和 `k-medoid`。在 `k-means` 算法中，通过识别原型的质心（centroid）来进行聚类，质心通常是一组点的平均值。同样，`k-medoid`\
  \ 算法识别中心点（medoid），它是某组中最具代表性的点。我们还可以推断，在大多数情况下，质心并不对应于实际的数据点，而中心点始终是一个实际的数据点。让我们详细讨论这两个算法。\n\
  \n### 9.4.3.1 K-means - 一种基于质心的技术\n\n这是最古老且最常用的聚类算法之一。该算法使用的基本原理也为其他更高级、更复杂的算法提供了基础。表\
  \ 9.2 提供了该算法的优缺点。\n\n`k-means` 算法的原理是将 `n` 个数据点分配给 `K` 个聚类之一，其中 `K` 是用户定义的所需的聚类数量。其目标是最大化聚类内部的同质性，并最大化聚类之间的差异。同质性和差异是通过数据集中对象或点之间的距离来衡量的。算法\
  \ 9.1 显示了 `K-means` 的简单算法\n\n```\nStep 1: 在数据空间中选择 K 个点并将它们标记为初始质心\n\nloop\nStep\
  \ 2: 将数据空间中的每个点分配给最近的质心，以形成 K 个聚类\nStep 3: 测量聚类中每个点到质心的距离\nStep 4: 计算平方误差和 (SSE)\
  \ 以衡量聚类的质量（在本章稍后部分描述）\nStep 5: 根据点之间的距离识别每个聚类的新质心\nStep 6: 重复步骤 2 到 5，不断完善，直到质心不再发生\n\
  end loop\n```\n\n**表 9.2** K-means 的优缺点\n\n![images](img/248-1.png)\n\n让我们通过一个例子来理解这个算法。在图\
  \ 9.4 中，我们有一组数据点，我们将应用 `k-means` 算法找出从该数据集生成的聚类。设定 `K` = 4，意味着我们想从数据集中创建四个聚类。第一步，我们从数据集中随机分配四个点作为质心（用\
  \ ** 符号表示），并将数据点分配给最近的质心以创建四个聚类。在第二步中，根据点到相应质心的距离更新质心，并将点重新分配到更新后的质心。迭代三次后，我们发现质心不再移动，因为已经没有了改进的空间，因此\
  \ `k-means` 算法终止。这为我们提供了数据集最逻辑四种分组或聚类，此时组内部的同质性最高，组间的差异最大。\n\n![images](img/248-2.png)\n\
  \n**图 9.4** 聚类概念——聚类前后\n\n### 选择合适的聚类数量\n\n在得出正确聚类时，成功的因素之一是从正确的聚类数量假设开始。不同的起始聚类数量会导致完全不同的数据划分。如果我们对聚类数量有一些先验知识，并以此先验知识启动\
  \ `k-means` 算法，将始终会有帮助。例如，如果我们对某大学的学生数据进行聚类，最好从该大学的系的数量开始。有时，业务需求或资源限制决定了所需的聚类数量。例如，如果电影制作人想根据两个参数的组合对电影进行聚类——电影预算（高或低）和电影阵容（明星或非明星），那么就有\
  \ 4 种可能的组合，因此可以使用四个聚类来划分数据。\n\n对于小型数据集，有时遵循的经验规则是\n\n![images](img/249-1.png)\n\n\
  这意味着对于具有 `n` 个示例的数据集，K 被设定为 `n`/2 的平方根。但遗憾的是，这个经验规则对于大数据集并不适用。有几种统计方法可以得出合适的聚类数量。\n\
  \n### 肘部法\n\n\n\n该方法尝试衡量类内的同质性或异质性，并针对 `K` 的不同值帮助确定最佳的 `K`。从图 9.5 我们可以看到，随着 `K`\
  \ 的增加，每个聚类内部数据点的数量减少，同质性会增加或异质性会降低。但这些迭代需要大量的计算工作量，而且如图所示，在某一点之后，同质性的增加收益不再与其实现它所需的投入成正比。这一点被称为**拐点**（elbow\
  \ point），在该点处的 `K` 值可产生最佳的聚类性能。有许多算法可以计算聚类的同质性和异质性，但书中并未进行讨论。\n\n### 选择初始质心\n\n\
  `k-means` 算法的另一个关键步骤是正确选择初始质心。一种常见的做法是根据聚类数量在数据空间中选择随机点，并在迭代过程中对这些点进行细化。但这通常会导致最终聚类的平方误差较高，从而导致次优的聚类解决方案。选择随机质心的假设是，多次后续运行将最小化\
  \ SSE 并识别出最佳聚类。但根据数据集的分布和所求簇的数量，这通常并非如此。因此，一种有效的方法是在数据集的样本点上采用层次聚类技术，然后得到样本 `K`\
  \ 个簇。这些初始 `K` 个簇的质心被用作初始质心。当数据集点较少且 `K` 相对于数据点较小时，这种方法是实用的。还有诸如如二分 `k-means` 和使用后处理来修复初始聚类问题；这些程序可以产生质量更好的初始质心，从而为最终聚类获得更好的\
  \ SSE。\n\n![images](img/250-1.png)\n\n**图 9.5** 用于确定合适聚类数量的拐点\n\n### 重计算聚类质心\n\n\
  我们在 `k-means` 算法中讨论过迭代步骤是在每次迭代后重新计算数据集的质心。通过测量聚类内部数据点之间的接近程度来最小化距离。也可以计算数据点到最近质心的距离，以最小化距离并获得细化的质心。两个数据点之间的欧几距离计算方法如下：\n\
  \n![images](img/250-2.png)\n\n使用此函数，计算示例数据与其最近质心以及目标之间的距离，以最小化该距离。聚类的质量衡量使用 SSE\
  \ 技术。使用的公式如下：\n\n![images](img/251-1.png)\n\n其中 `dist()` 计算簇 `C[i]` 的质心 `c[i]` 与簇内数据点\
  \ `x` 之间的欧几里距离。所有 `K` 个簇的此类距离之和给出了总平方误差。正如你所理解的，聚类解决方案的 SSE 越低，质心的代表位置就越理想。因此，在我们算法\
  \ 9.1 的聚类算法中，质心的重计算涉及计算每个新质心的 SSE 并确定最佳质心。在质心重新定位后，分配距离质心最近的数据点。\n\n\n\n\n`k-means`\
  \ 往往会产生局部最优而非全局最优。此外，结果取决于随机聚类中心的初始选择。一种常见的做法是使用不同的聚类中心多次运行 `k-means` 算法，以确定最佳聚类。设置初始“`K`”值的必要也被认为是\
  \ `k-means` 算法的一个缺点。有一些方法可以解决这个问题，例如为“`K`”定义一个范围，然后比较这些不同“`K`”值的聚类结果，以获得尽可能好的聚类。改进聚类性能的方法是一个进一步研究的领域，并应用了许多不同的技术来实现这一目标。这超出了本书的范围，但可以在高级机器学习学习中进行探索。\n\
  \n### 注意\n\n聚类通常被用作识别无标记数据集中子组的第一步，然后用于对新观测到的数据进行分类。在开始阶段，我们并不清楚无标记数据集中内部存在什么模式或类别。通过在该阶段使用聚类算法，我们可以发现数据集中相似对象的组，并形成子组和类别。稍后观察到新对象时，使用分类算法尝试将其放入早期阶段识别出的某个子组中。让我们举个例子：我们正在进行软件测试活动，并识别了软件中的一组缺陷。为了方便将这些缺陷分配给不同的开发小组，团队正尝试识别相似的缺陷组。通常使用文本分析来用作识别这种相似性的指导原则。假设识别出\
  \ 4 个缺陷子组，即：GUI 相关的缺陷、业务逻辑相关的缺陷、需求缺失缺陷和数据库相关的缺陷。基于这种分组，团队确定了应该将缺陷发送给哪些开发人员进行修复。随着测试的持续，会有新的缺陷不断产生。我们现在已经识别了缺陷类别，因此团队可以使用分类算法将新缺陷分配到已识别的\
  \ 4 个组或类别之一，这将易于识别出应该修复该缺陷的开发人员。\n\n### 9.4.4 K-Medoids：一种代表性的基于对象的技术\n\n如前所述，`k-means`\
  \ 算法对数据集中的离群值敏感，当使用数据点的平均值作为中心时，会无意中产生偏斜的聚类。让我们以八个数据点为例，为了简单起见，可以将它们视为值为 1, 2, 3,\
  \ 5, 9, 10, 11 和 25 的一维数据。点 25 是离群值，当考虑点的平均值作为中心时，它会对聚类的形成产生负面影响。\n\n当 `K` = 2 时，我们得到的初始聚类是\
  \ {1, 2, 3, 6} 和 {9, 10, 11, 25}。\n\n聚类 ![img](img/255-1.png) 的平均值\n\n以及聚类 ![img](img/255-2.png)\
  \ 的平均值\n\n所以，聚类内的 SSE 为\n\n![images](img/256-1.png)\n\n如果我们将其与聚类 {1, 2, 3, 6, 9}\
  \ 和 {10, 11, 25} 进行比较，\n\n聚类 ![img](img/256-2.png) 的平均值\n\n以及聚类 ![img](img/256-3.png)\
  \ 的平均值\n\n所以，聚类内的 SSE 为\n\n![images](img/256-4.png)\n\n由于第二次聚类的 SSE 较低，`k-means`\
  \ 倾向于将点 9 与 1, 2, 3 和 6 放在同一个聚类中，尽管该点在逻辑上更接近 10 和 11。这种偏斜是由离群点 25 引入的，它将平均值移离聚类中心。\n\
  \n`k-medoids` 为这个问题提供了解决方案。`k-medoids` 不考虑聚类内点的平均值，而是从数据集中选择 `k` 个代表性数据点作为聚类的中心。然后根据数据点到这些中心的距离进行分配形成\
  \ `k` 个聚类。注意，在这种情况下，质心是数据中的实际点或对象，而不是像 `k-means` 技术中使用聚类内数据平均值作为中心那样的虚拟点。SSE 计算为\n\
  \n![images](img/256-5.png)\n\n其中 `o[i]` 是聚类 `C[i]` 的代表点或对象。\n\n因此，`k-medoids` 方法通过最小化\
  \ SSE 将 `n` 个对象分为 `k` 个聚类。由于使用了实际代表性数据点的质心，`k-medoids` 受数据中离群值的影响较小。`k-medoids`\
  \ 原理的一种实际实现是围绕质心划分（PAM）算法。参考算法 2 表：\n\n#### 算法 2：PAM\n\n**步骤 1**: 在数据集中随机选择 `k`\
  \ 个点作为初始代表点\n\n```\nloop\n**步骤 2**: 将每个点分配到距离最近的代表点的聚类中\n\n**步骤 3**: 在每个聚类中随机选择一个非代表点\
  \ `o[r]`\n\n**步骤 4**: 交换代表点 `o[j]` 与 `o[r]` 并计算交换后的新 SSE\n\n**步骤 5**: 如果 `SSEnew\
  \ < SSEold`，则交换 `o[j]` 与 `o[r]`\n\n**步骤 6**: 直到没有变化为止精炼 `k` 个聚类\nend\n```\n\n\n\n\
  \n到为止，我们已经讨论了将数据划分不同簇的各种方法。但在某些情况下，数据需要在不同层级上分组，例如在层次结构中进行。层次化聚类方法用于将数据分组为层次级结构或树形结构。例如，在一个组织大学不同部门员工的机器学习问题中，首先将员工归类到大学的不同部门下，然后在每个部门内部，可以根据他们的角色（如教授、助理教授、导师、实验助理等）对员工进行归类。这创建了员工数据的层次级结构，并便于可视化和分析。同样，可能存在一个具有潜在层次级结构的数据集，我们想要发现这种结构，此时我们可以使用层次化聚类方法来实现目标。\n\
  \n### 层次化聚类方法\n\n有两种主要的层次化聚类方法：凝聚聚类（agglomerative clustering）和分裂聚类（divisive clustering）。凝聚聚类是一种自下而上的技术，它从单个对象作为簇开始，然后迭代地合并它们以形成更大的簇。相反，分裂聚类从一个包含所有给定对象的簇开始，然后迭代地拆分它以形成更小的簇。参见图\
  \ 9.12。\n\n#### 凝聚层次化聚类\n\n凝聚层次化聚类方法采用自下而上的策略。它从每个对象形成自己的簇开始，然后根据它们的相似性迭代地合并簇以形成更大的簇。当满足用户设定的某些聚类条件或所有簇合并为一个单元簇时，算法终止。\n\
  \n#### 分裂层次化聚类\n\n分裂层次化聚类方法采用自上而下的策略。起点是包含所有对象的最大簇，然后递归地将其拆分以形成越来越小的簇，从而形成层次结构。当最终簇中的对象彼此具有足够的同质性，或者最终簇仅包含一个对象，或者达到了用户定义的聚类条件时，迭代结束。\n\
  \n在这两种情况下，仔细选择拆分点和合并点至关重要，因为随后的拆分或合并将使用之前操作的结果，且没有选项在簇之间进行任何对象交换或纠正之前步骤中做的决策，这可能导致最终聚类质量不佳。\n\
  \n树图（dendrogram）是一种常用的表示层次化聚类逐步创建过程的树形结构。它展示了簇如何迭代地`merged`（在凝聚聚类的情况下）或迭代地`split`（在分裂聚类的情况下）以获得最佳聚类解决方案。图\
  \ 9.13 展示了一个具有四层的树图，以及对象在每一层如何合并或拆分以形成层次化聚类。\n\n![images](img/259-1.png)\n\n**图\
  \ 9.12** 凝聚和分裂的层次化聚类\n\n### 距离度量\n\n簇之间接近性的核心标准之一是它们之间的距离。有四种衡量簇距离的标准方法：\n\n令 `C[i]`\
  \ 和 `C[j]` 分别为具有 `n[i]` 和 `n[j]` 个元素的簇。`p[i]` 和 `p[j]`分别代表簇 `C[i]` 和 `C[j]` 中的点。我们将簇\
  \ `C[i]` 的平均值标记为 `m[i]`。\n\n![images](img/259-2.png)\n\n参考图 9.14 以理解这些概念。\n\n![images](img/260-1.png)\n\
  \n**图 9.13** 层次化聚类的树图表示\n\n![images](img/260-2.png)\n\n**图 9.14** 算法方法中的距离度量\n\n\
  通常距离度量被用于决定何时终止算法。例如，在凝聚聚类中，一旦相邻簇之间的距离小于用户定义的阈值，合并迭代就可以停止。因此，当算法使用最小距离 `D[min]`\
  \ 来衡量簇之间的距离时，它被称为邻域聚类算法；如果停止算法的决策是基于对 `D[min]` 的用户限制，则被称为单链算法（single linkage algorithm）。\n\
  \n另一方面，当算法使用最大距离 `D[max]` 来衡量簇之间的距离时，它被称为邻域聚类算法；如果停止算法的决策是基于对 `D[max]` 的用户限制，则被称为全链算法（complete\
  \ linkage algorithm）。\n\n由于最小和最大度量提供了衡量簇距离的两种极端选择，它们容易受到离群值和噪声数据的影响。相反，使用平均和平均距离有助于避免此类问题并提供更一致的结果。\n\
  \n#### 9.4.6 基于密度的方法 - DBSCAN\n\n你可能已经注意到，当我们使用划分和层次化聚类方法时，生成的簇在本质上是球形或近球形的。对于其他形状的簇（如\
  \ S 形或不规则形状），上述两种方法无法提供准确的结果。基于密度的聚类方法为识别任意形状的簇提供了解决方案。其原理基于识别数据中的密集区域和稀疏区域，然后运行聚类算法。DBSCAN\
  \ 是流行的密度算法之一，通过使用高密度连接区域创建簇。\n\n##### 9.5 使用关联规则发现模式\n\n关联规则提供了一种识别大型数据集中有趣关系的方法。它也被称为**关联分析**（association\
  \ analysis），发现的关系可以表示为由频繁项集组成的关联规则形式。这种分析的一个常见应用是**购物篮分析**（Market Basket Analysis），零售商利用其对其进行交叉销售。例如，每家大型超市都会积累大量关于客户购买模式的数据。根据共同购买的物品，零售商可以通过将购买的物品放在相邻区域或针对这些不同产品类型创建组合优惠来推动交叉销售。下面的关联规则表示，买过面包和牛奶的人通常也会买鸡蛋；因此对于零售商来说，将这些物品放在一起寻找新的交叉销售机会是有意义的。\n\
  \n```\n{Bread, Milk} → {Egg}\n```\n\n\n\n\n关联分析的应用也广泛于其他领域，如生物信息学、医学诊断、科学数据分析和网络数据挖掘。例如，通过发现饮食习惯与患者患上乳腺癌之间的有趣关系，可以发现一种新的癌症预防机制，这将使全球数千万的人受益。在书中，我们将主要通过购物篮子示例来说明分析技术，但它也可以更广泛地应用于各个领域，以识别交易数据中项目之间的关联性。通过条形码扫描器、在线购买和库存跟踪系统等跟踪交易每天产生的海量数据，使得机器学习系统能够从这些丰富的数据中学习。我们将讨论如何使用简单的统计性能指标在大型数据库中寻找有用的关联，同时考虑到处理此类交易数据时的特殊性。在处理海量数据时，面临的一个重大挑战是，从此类数据中发现模式在计算上可能非常昂贵。此外，可能存在某些关联是偶然发生的情况，这可能导致潜在的虚假知识。在讨论关联分析时，我们将讨论这两点。\n\
  \n我们将使用下表中的交易数据作为关联分析的示例。这个简化版的购物篮子数据将展示如何有效利用关联规则进行购物篮分析。\n\n## 9.5.1 常用术语定义\n\n\
  让我们理解关联分析中一些常用的术语。\n\n### 9.5.1.1 项目集 (Itemset)\n\n一个或多个项目组合在一起并用括号括起来表示它们形成了一个集合，更具体地说，是一个在数据中以某种规律出现的\
  \ `itemset`（项目集）。例如，在表 9.3 中，`{Bread, Milk, Egg}` 可以被组合在一起形成一个项目集，因为它们经常被一起购买。将这一概念泛化，如果\
  \ `I` = `{i[1], i[2],…, i[n]}` 是购物篮数据中的项目，而 `T` = `{t[1], t[2],…, t[n]}` 是所有交易的集合，那么每条交易\
  \ `t[i]` 包含来自 `I` 的项目子集。零或多个项目的集合被称为项目集。空项目集是不包含任何项目的项目的项目集。在关联分析中，如果一个项目集包含 `k`\
  \ 个项目，则称为 `k`-项目集。因此，项目集 `{Bread, Milk, Egg}` 是一个三项目集。\n\n**表 9.3** 购物篮交易数据\n\n\
  ![images](img/262-1.png)\n\n### 9.5.1.2 支持计数 (Support count)\n\n支持计数表示包含特定项目集的交易数量。这是项目集的一个非常重要的属性，因为它表示了该项目集的出现频率。其表达式如下：\n\
  \n![images](img/262-2.png)\n\n其中 `|{}|` 表示集合中元素的数量\n\n在表 9.3 中，项目集 `{Bread, Milk,\
  \ Egg}` 共同出现 3 次，因此其支持计数为 3。\n\n## 9.5.2 关联规则 (Association rule)\n\n购物篮分析的结果表示为一组关联规则，这些规则规定了项目与项目之间关系的模式。一个典型的规则可以表示为\
  \ `{Bread, Milk}→{Egg}`，这表示如果购买了面包和牛奶，那么也很可能购买鸡蛋。因此，关联规则是从项目集的子集中学习得的。例如，上述规则是从\
  \ `{Bread, Milk, Egg}` 集合中识别出的。\n\n需要注意的是，关联规则是 `X → Y` 的表达式，其中 `X` 和 `Y` 是不交的项目集，即\
  \ `X ∩ Y = 0`。\n\n支持（Support）和置信度（Confidence）是用于衡量关联规则强度的两个概念。支持表示规则适用于给定数据集的频率。置信度表示包含\
  \ `X` 的交易中 `Y` 出现的频率。\n\n在讨论关联分析时，我们将同时讨论这两点。\n\n置信度表示 `Y` 在总交易 `N` 中包含 `X` 的情况下出现的频率。置信度表示规则的预测能力或准确性。因此，数学表达式为：\n\
  \n![images](img/263-1.png)\n\n在我们的数据集 9.3 中，如果我们考虑关联规则 `{Bread, Milk} → {Egg}`，那么根据上述公式\n\
  \n![images](img/263-2.png)\n\n理解支持和置信度在关联分析中的作用是重要的。低支持可能规则是偶然发生的。此外，从应用角度来看，由于项目很少被客户一起购买，该规则可能并不是非常有投资价值。因此，支持可以为识别最有趣的规则提供智能支持。\n\
  \n同样，置信度为推理的可靠性提供了衡量。高置信度 `X → Y` 表示在包含 `X` 的交易中存在 `Y` 的可能性更大，它是给定 `X` 时 `Y` 的条件概率估计。\n\
  \n此外，理解 `X` 指向 `Y` 的置信度并不等于 `Y` 指向 `X` 的置信度。在我们的示例中，`{Bread, Milk} → {Egg} = 0.75`\
  \ 的置信度，但![img](img/263-3.png)这里的规则是强规则。\n\n关联规则在大数据和数据科学背景下开发，不用于预测。它们用于大型数据库的无监督知识发现，不像分类和数值预测算法。我们仍然发现关联规则学习器与分类学习器密切相关并共享许多特征。\n\
  \n## 9.5.3 用于关联规则学习的 Apriori 算法\n\n如前所述，发现关联规则并从中学习的主要挑战是大量的交易数据以及相关的复杂性。由于交易数据中特征的变化，数据集中的特征集数量通常会非常大。这导致了处理大量项目集的问题，项目集的数量随特征数量呈指数级增长。如果有\
  \ `k` 个项目可能或不属于项目集，那么就有 `2^k` 种创建这些项目项目集的方法。例如，如果销售人员处理 100 个不同的项目，那么学习器需要评估 `2¹⁰⁰\
  \ = 1 × e³⁰` 个项目集以得出规则，这在计算上是不可能的。因此，过滤掉最重要的（即规模可控的）项目集并将资源用在这些项目集上以获得合理的关联规则是重要的。\n\
  \n\n\n\n我们的第一步是确定关联规则的最小支持度和最小置信度。从事务集 `T` 出发，假设我们将找到所有支持度 $\\ge$ `minS` 且置信度 $\\\
  ge$ `minC` 的规则，其中 `minS` 和 `minC` 分别是规则被认为接受的支持度和置信度阈值。现在，即使我们设定 `minS = 20%` 且\
  \ `minC = 50%`，可以看到超过 80% 的规则被丢弃；这意味着如果首先对待考虑的项目集进行剪枝，并移除无法生成具有合理支持度和置信度的关联规则的项目集，就可以避免大量的计算工作。实现这一目标的方法如下所示。\n\
  \n### 步骤 1：解耦支持度和信度需求。\n\n根据公式 9.8，规则 `X → Y` 的支持度仅取决于其对应项目集的支持度。例如，以下所有规则的支持度相同，因为它们的项目集都是\
  \ `{Bread, Milk, Egg}`：\n\n* `{Bread, Milk} → {Egg}`\n* `{Bread, Egg} → {Milk}`\n\
  * `{Egg, Milk} → {Bread}`\n* `{Bread} → {Egg, Milk}`\n* `{Milk} → {Bread, Egg}`\n\
  * `{Egg} → {Bread, Milk}`\n\n因此，可以根据项目集的频率对该关联规则应用相同的处理。在这种情况下，如果项目集 `{Bread, Milk,\
  \ Egg}` 在购物篮事务中很罕见，那么可以在不计算它们单独的支持度和置信度值的情况下丢弃这六条规则。这确定了一些生成关联规则的重要策略：\n\n1. **生成频繁项目集：**\
  \ 一旦为特定分配设置了 `minS`，识别所有满足 `minS` 的项目集。这些项目集被称为频繁项目集。\n2. **生成规则：** 从上一步找到的频繁项目集中，发现所有高置信度规则。这些被称为强规则。\n\
  \n请注意，识别频繁项目集的计算需求比规则生成更密集。因此，如下一节所述，演化出了不同的技术来优化频繁项目集生成以及规则发现的性能。\n\n#### 9.5.4\
  \ 构建 Apriori 原则规则\n\n用于减少搜索关联规则的项目集数量的最常用算法之一被称为 Apriori。它已被证明在很大程度上简化了关联规则学习。该原理的名称源于算法利用关于频繁项目集属性的简单先验信念（即\
  \ *a priori*）：\n\n*如果一个项目集是频繁的，那么它所有的子集也必须是频繁的*。\n\n这一原理显著限制了生成规则时需要搜索的项目集数量。例如，在购物篮分析中，如果发现像“盐”这样的物品并不经常与早餐食品一起购买，那么在生成规则时移除所有包含盐的项目集是完全可以，因为它们对规则的支持度和置信度的贡献微乎其微。\n\
  \n反之情况也成立：\n\n*如果一个项目集是频繁的，那么它所有的超集也必须是频繁的*。\n\n这些是非常强大的原理，有助于根据支持度量剪枝指数搜索空间，被称为基于支持度的剪枝。这里使用的支持度量的关键属性是：项目集的支持度永远不超过其子集的支持度。这也被称为支持度的反单调性。\n\
  \n让我们使用 **表 9.3** 中的事务数据来阐明 Apriori 原则及其应用。从六个物品的完整项目集 `{Bread, Milk, Egg, Butter,\
  \ Salt, Apple}` 中，有 $2⁶$ 种创建购物篮或项目集的方法（包括空项目集），如图 9.15 所示：\n\n```\n![images](img/266-1.png)\n\
  ```\n**图 9.15** 从 6 个物品创建项目集的 64 种方式\n\n\n\n\n通过继续迭代，让我们假设在迭代 2 中，发现 `{X, Y}` 和\
  \ `{Y, Z}` 是频繁的，但 `{X, Z}` 不是。虽然迭代 3 通常会从评估 `{X, Y, Z}` 的支持度开始，但这一步完全不需要发生。Apriori\
  \ 原则规定 `{X, Y, Z}` 不可能是频繁的，因为其子集 `{X, Z}` 不是。因此，在迭代 3 中，算法可能会停止，因为无法生成新的项目集。\n\n\
  一旦我们确定了用于分析的合格项目集，Apriori 算法的第二阶段就开始了。对于给定的频繁项目集，从所有可能的子集中生成关联规则。例如，`{X, Y}` 将产生针对\
  \ `{X}` → `{Y}` 和 `{Y}` → `{X}` 的候选规则。这些规则将根据最小置信度阈值进行评估，任何不符合所需置信度的规则将被消除，最终产生强规则集。\n\
  \n尽管 Apriori 原则被广泛应用于购物篮分析以及关联规则帮助发现对象之间新关系的应用中，但在应用于目标数据集之前，我们还需要注意它的某些优点和缺点：\n\
  \n![images](img/268-1.png)\n\n## 9.6 总结\n\n*   无监督学习是一种机器学习概念，通过分析未标记和未分类的信息来发现隐藏的知识。该算法在没有任何先验训练的情况下对数据运行，但它们的构建方式使其能够从数据集中识别出模式、分组、排序顺序以及许多其他有趣的知识。\n\
  *   聚类是指一组广泛的技术，根据数据集中内部对象的特征在数据集中寻找子组（或簇），使得组内的对象是相似的（或相互关联的），但与其它组的对象是不同的（或互不关联的）。\n\
  *   主要的聚类技术可归类为三大大类：\n    *   划分方法（Partitioning methods），\n    *   层次方法（Hierarchical\
  \ methods），\n    *   基于密度的方法（Density-based methods）。\n*   `k`-means 和 `k`-medoids\
  \ 是最常用的划分技术。\n*   `k`-means 算法的原理是将 n 个数据点中的每一个分配到 `k` 个簇中的一个，其中 `k` 是用户定义的所需的簇数量。其目标是最大化簇内的同质性，并最大化簇之间的差异。同质性和差异是通过点来衡量的。\n\
  *   `k`-medoids 考虑现有点中的代表性数据点作为簇的中心。然后根据数据点到这些中心的距离分配数据点以形成簇。\n*   层次聚类方法用于将数据分组为层次或树形结构。\n\
  *   有两种层次聚类方法：凝聚聚类（agglomerative clustering）和分裂聚类（divisive clustering）。凝聚聚类是一种自下而上的技术，从单个对象作为簇开始，然后合并它们形成更大的簇。相反，分裂方法从一个包含所有给定对象的簇开始，并迭代地将其以形成较小的簇。\n\
  *   `DBSCAN` 是基于密度的聚类方法之一，为识别任意形状的簇提供了解决方案。原理基于识别数据集中的密集区域和稀疏区域，然后运行算法。\n*   关联规则提供了一种对于识别大型数据集中有趣关系的方法论。它也被称为关联分析，发现的关系可以以包含一组频繁项目的关联规则的形式表示。\n\
  *   这种分析的一个常见应用是购物篮分析，零售商利用它对其产品进行交叉销售。\n\n## 示例题\n\n### 单选题（每题 1 分）\n\n1. `k`-means\
