  \ 0, 1)。\n\n\n\n\n正如我们在前面的章节中讨论过的，机器学习为我们提供了一套方法，可以自动检测数据中的模式，然后可以用于揭示模式以预测未来数据，或者在不确定性下进行其他类型的决策。在被称为`big\
  \ data`的巨量数据集上执行此类活动最佳方法是使用概率论工具，因为概率论可以应用于任何涉及不确定性的情况。在机器学习中，可能存在于不同形式的不确定性，例如根据过去数据得出对未来的最佳预测、根据某些数据得出最佳模型、在根据过去数据预测未来结果时得出置信水平等。机器学习中使用的概率方法与统计学领域密切相关，但正如在本章中看到的，其重点在不同的方向。在本章中，我们将讨论对机器学习领域有用的概率论工具、方程和模型。\n\
  \n## 5.2 统计工具在机器学习中的重要性\n\n在机器学习中，我们通过使用名为“训练数据”的限制数据集训练系统，并根据训练数据的置信水平，我们期望机器学习算法能够描述更大量的实际数据集的行为。如果我们对一组事件的子集（称为“样本”）进行观测，那么在将样本结果归于整个集合或总体时，将会存在某些不确定性。因此，问题在于如何利用对样本集的有限知识来以某种置信度预测真实集合的行为。数学家们意识到，即使某些知识是基于样本的，只要我们知道与之相关的不确定性程度，就可以以优化的方式使用，而不会导致知识的丢失。参考图\
  \ 5.1\n\n![images](img/118-1.png)\n\n**图 5.1** 知识与不确定性\n\n概率论为量化这种知识的不确定性提供了数学基础。由于关于训练数据的知识是以`interdependent`\
  \ 特征集的形式出现，在本章稍后讨论的条件概率理论（特别是`Bayes theorem`）构成了推导训练数据所需置信水平的基础。\n\n本章讨论的不同分布原理创建了我们在机器学习中将处理的数据集在特征分布方面可能如何表现的视角。理解这些每个分布背后的数学函数至关重要，这样我们就可以理解数据是如何偏离其平均值（由`mean`和`variance`表示）的了。在从这些分布集中选择样本时，我们应该能够计算样本在多大程度上代表了完整数据集的实际行为。这些与假设检验原理共同构成了发现训练集中不确定性以代表实际数据集的基础，而这是机器学习的根本原理。\n\
  \n## 5.3 概率的概念 —— 频率主义和贝叶斯解释\n\n概率的概念并不新奇。在日常生活中，我们在许多地方都使用概率的概念。例如，当我们谈论投掷硬币时得到正面和反面的概率相等时，我们实际上是想说如果投掷硬币很多次，硬币落在正面的次数将与落在反面的次数相同。这是概率的`frequentist`解释。这种解释代表了事件的长期频率。概率的另一个重要解释试图量化某些事件的不确定性，因此关注的是信息而非重复试验。这被称为概率的`Bayesian`解释。以同样的投掷硬币例子为例，其解释为——当我们下次投掷硬币时，硬币落在正面或反面的概率是相等的。\n\
  \n贝叶斯解释之所以能够对事件的不确定性建模，是因为并不预期事件的长期频率发生。例如，如果我们必须计算巴西赢得 2018 年足球世界杯决赛的概率，该事件只能发生一次，不能通过反复重复来计算其概率。尽管如此，我们应该能够量化关于该事件的不确定性，而只有当我们以贝叶斯的方式解释概率时这才是可能的。给出更多面向机器学习的例子，我们正在为一个大客户启动一个新的软件实施项目，并根据过去类似项目的数据计算该项目进入客户升级流程的概率；或者我们想根据相似特征患者中此类病例的概率分布，计算肿瘤为良性或恶性的概率。在所有这些情况下，都不可能对事件进行重复试验，而贝叶斯概念对于计算不确定性是有效的。因此，在本书中，我们将关注贝叶斯解释，以开发我们的机器学习模型。无论我们采用何种解释，概率的基本公式始终保持不变。\n\
  \n### 5.3.1 概率论的简要回顾\n\n我们将在本节中简要触及基础概率论，作为复习，以便我们转向机器学习使用概率的构建模块。正如在前面的章节中所讨论的，机器学习的基本概念是我们希望拥有一组有限的“训练”数据，我们将其作为大量实际数据的代表，并通过概率分布试图找到与训练数据相匹配的事件如何以某种置信度表示结果。\n\
  \n### 5.3.1.1 基础规则\n\n在本节中，我们将回顾概率的基本规则。\n\n让我们介绍一些在书中将使用的符号。\n\n* `p(A)` 表示事件 `A`\
  \ 为真的概率。例如，`A` 可能是逻辑陈述“巴西将赢得下一届世界杯决赛”。`0 ≤ p(A) ≤ 1` 表示该事件发生的概率在 0 到 1 之间。\n\n###\
  \ 5.3.1.2 两事件并集的概率\n\n如果两个事件不能同时发生，则它们被称为互斥事件。例如，英格兰赢得 2018 年足球世界杯和巴西赢得 2018 年足球世界杯是两个互斥事件，不能同时发生。对于任何两个事件\
  \ `A` 和 `B`，我们定义 `A` 或 `B` 的概率为\n\n![images](img/120-2.png)![images](img/120-3.png)\n\
  \n### 5.3.1.3 联合概率\n\n联合事件 `A` 和 `B` 的概率定义为`product rule`：\n\n![images](img/120-4.png)\n\
  \n其中 `p(A|B)` 定义为在事件 B 发生的情况下事件 A 发生的条件概率。基于两个事件的这种`joint distribution` `p(A, B)`，我们可以定义如下所示的`marginal\
