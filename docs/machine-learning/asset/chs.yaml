  \n```python\n>>> var2 = int(var2)\n>>> print (var2)\n8\n>>> type (var2)\nOut[42]:\
  \ int\n```\n\n### B.1.3.3 for–while 循环与 if–else 语句\n\n#### for 循环\n\n**语法：**\n```python\n\
