  \n\n### 5.7.6 协方差与相关性\n\n两个随机变量 `X` 和 `Y` 之间的 `covariance` 衡量了 `X` 和 `Y`（线性）相关的程度，这意味着\
  \ `X` 如何随 `Y` 变化，反之亦然。\n\n![images](img/137-2.png)\n\n因此，如果方差是随机变量随自身变化的衡量，那么协方差就是两个随机变量相互变化的衡量。\n\
  \n协方差可以介于 0 到无穷大之间。有时，使用归一化指标更为方便，因为仅凭协方差可能无法提供关于随机变量之间足够的信息。例如，让我们根据抛币实验定义 3 个不同的随机变量：\n\
  \n![images](img/137-3.png)\n\n通过观察这些随机变量，我们可以理解它们本质上是相同的，只是输出结果乘以了一个常数。但当使用方程 5.55\
  \ 计算时，它们的协方差会非常不同：\n\n`Cov(X, Y) = 2.5`, `Cov(X, Z) = 25`, `Cov(Y, Z) = 250`\n\n\
  为了解决这个问题，有添加一个提供这种智能信息的归一化项：![img](img/137-4.png)\n\n![images](img/137-5.png)\n\n\
  如果 `Cov(X,Y) = 0`，我们可以说 `X` 和 `Y` 是不相关的。那么根据方程 5.55，当满足以下条件时，`X` 和 `Y` 是不相关的：\n\n\
  `E(X, Y) = E(X)E(Y)`\n\n如果 `X` 和 `Y` 是独立的，可以证明它们是不相关的，但注意其逆命通常并不成立。\n\n所以，我们应该记住：\n\
  \n- 随机变量的结果按概率加权即为期望，`E(X)`。\n- 随机变量平方的期望与该随机变量期望的平方之间的差是方差：`E(X²) – E(X)²`。\n-\
  \ 协方差 `E(XY) – E(X)E(Y)` 与方差相同，但这里比较的是两个随机变量，而不是单个随机变量与其自身。\n- 相关系数 `Corr(X, Y)\
  \ = ![img](img/138-1.png)` 是归一化后的协方差。\n\n相关性的几个重要属性是：\n\n1. `-1 ≤ corr[X, Y] ≤ 1`。因此，在相关矩阵中，对角线上的每个元素均为\
  \ 1，其他元素在 -1 到 1 之间。\n2. `corr[X, Y] = 1` 当且仅当 `Y = aX + b`（对于某些参数 `a` 和 `b`），即如果\
  \ `X` 和 `Y` 之间存在线性关系。\n3. 根据属性 2，似乎相关系数与回归线的斜率有关，即表达式 `Y = aX + b` 中的系数 `a`。然而，回归系数实际上由\
  \ `a = cov[X, Y] / var[X]` 给出。解释相关系数的更好方法是将其视为一种线性程度。\n\n## 5.8 中心极限定理\n\n这是概率论中最重要的定理之一。它指出，如果\
  \ `X[1],… X[n]` 是一个独立同分布随机变量序列，且每个均值为 `μ`，方差为 `σ²`，![img](img/138-2.png)\n\n![images](img/138-3.png)\n\
  \n当 `n → ∞`（意味着对于非常大但有限的集合）则 `Z[n]` 趋于标准正态分布。\n\n![images](img/138-4.png)\n\n或者\n\
  \n![images](img/138-5.png)\n\n其中，`Φ(z)` 是标准正态随机变量的累积分布函数 (cdf)。因此，根据中心限定理，无论单个 `X[i]`\
  \ 的分布如何，对于较大的 `n`，和 `S[n] – X[1] + …X[n]` 的分布近似于正态分布。这是一个非常重要的结果，因为当我们需要处理大量随机变量之和的随机变量时，可以使用中心限定理假设该和服从正态分布。\n\
  \n## 5.9 抽样分布\n\n正如在本章之前讨论的，统计学在机器学习中的一个重要应用是基于集合随机样本的概率模型对集合或总体得出结论。例如，根据某些随机肿瘤病例的恶性样本测试结果，我们想要估计所有肿瘤中恶性的比例，从而对医生关于每个肿瘤病例是否需要进行活检提供建议。正如我们可以理解的，如果我们可以获得不同的随机样本，可能会给出不同的估计。为了方便理解，以下是本节使用的某些术语：\n\
  \n- 总体 (Population) 是一个有限集合。\n- 随机样本 (Random sample) 是从总体中抽取的样本。\n- 抽样分布 (Sampling\
  \ distribution) 是样本的分布。\n\n### 5.9.1 有回抽样 (Sampling with replacement)\n\n在有回抽样的情况下，从总体中抽取样本时，每个对象在被抽取后都会返回总体中。这意味着如果从总体中抽取了\
  \ `n` 个样本，由于重复是允许的，抽样大小为 `n` 且总体大小为 `N`，那么抽样数量为 `n`。\n\n此外，每个样本的概率是![img](img/139-1.png)。\n\
  \n例如，让我们从 3 个患者中选取 2 个患者的样本（允许重复），可能的组合如下：\n\n`(A, B), (A, C), (B, A), (B, C), (C,\
  \ A), (C, B)`\n\n这意味着这样的样本数量为 `3² = 9`。\n\n### 5.9.2 无回抽样 (Sampling without replacement)\n\
  \n在无回抽样的情况下，在选取下一个对象之前，不将选取的对象返回总体。这意味着从总体大小为 `N` 的总体中选取 `n` 个样本，重复是不允许的。\n\n在我们先的例子中，从\
  \ 3 个患者中选取 2 个患者（不允许重复），可能的无组合如下：\n\n`(A, B), (A, C), (B, C)`\n\n这意味着样本数量为 3。\n\n\
  ### 5.9.3 样本的均值与方差 (Mean and variance of sample)\n\n让我们考虑总体 `N` 中均值为 `μ`、标准差为 `σ`\
  \ 的随机变量 `X`。无回抽样的 `n` 样本将产生 `n` 个值 `x[1], x[2]…..[x[n]`。当样本是有回抽样时，这些值是相互独立的，可以被视为\
  \ `n` 个独立随机变量 `X[1], X[2],., X[n]` 的值，每个变量均值为 `μ`，方差为 `σ²`。样本均是一个随机变量 `Ẋ`，如下：\n\
  \n![images](img/140-1.png)\n\n由于 `X̅` 是随机变量，它也具有如下总体参数：\n\n![images](img/140-2.png)\n\
  \n对于较大的 `n`，如果 `X` 近似于正态分布，那么 `X̅` 也服从正态分布。\n\n当样本是无回抽样时，对于随机变量 `X` 的样本值 `x[1],\
  \ x[2]…..,x[n]` 不是独立的。样本均 `X̅` 的均值为 `μ[Ẋ]`，方差为 `σ[Ẋ]`²，公式如下：\n\n![images](img/140-3.png)\n\
  \n其中，`N` 是总体大小且 `n < N`。此外，如果 `X` 是正态分布，那么 `X̅` 也具有正态分布。\n\n\n\n\n\n现在，根据中心极限定理，如果基于有限总体的随机变量样本量足够大，则样本均值近似服从正态分布，无论总体的分布如何。在采样的大多数实际应用中，当样本量足够大时（经验法则\
  \ ≥ 30），样本均值近似服从正态分布。此外，当从大总体中抽取随机样本时，可以假设值 `x[1]`、`x[2]`……、`x[n]` 是相互独立的。这种独立性假设是概率论应用于统计推断的关键之一。我们使用“总体远大于样本量”或“总体相对于其样本量很大”等术语来表示总体足够大，以至于样本之间相互独立。在实践中，如果\
  \ ![img](img/140-4.png)，则可以假设独立性。\n\n## 5.10 假设检验\n\n在处理随机变量时，常见的情况是我们必须根据具有随机性质的观测或数据做出某些决策或选择。处理这些情况的解决方案被称为决策理论或假设检验，它在现实生活中是一个被广泛使用的过程。正如我们之前讨论的，机器学习的核心组件是使用基于样本的训练数据，这些数据可以代表更大量的实际数据，而且估计结果在多大程度上可以与训练数据的行为相关是至关重要的，以便对实际数据做出决策。因此，假设检验是机器学习不可或缺的一部分。\n\
  \n从统计学的角度来说，假设是对关于随机变量概率律的假设。例如，取随机变量的随机样本 `(X[1],….. X[n])`，其关于参数 `κ` 的概率密度函数（pdf）由\
  \ `f(x, κ) = f(x[1], x[2]…., x[n]; κ)` 给出。我们检验假设 `κ = κ[0]` 对于 `κ = κ[1]`。在这种情况下，假设\
  \ `κ = κ[0]`称为零假设，记作 `H[0]`。假设 `κ = κ[1]`称为备择假设，记作 `H[1]`。\n\n`H[0]:κ = κ[0]`\n\
  `H[1]:κ = κ[1]`\n\n简单假设是指所有参数都指定了精确值的假设，例如本例中的 `H[0]` 或 `H[1]`。但如果参数没有精确值，例如 `H[1]:κ\
  \ ≠ κ[1]`，则 `H[1]` 是复合假设。\n\n假设检验的概念是用于验证假设的决策过程。我们可以通过将观测空间（例如 `R`）划分为两个区域——`R[0]`\
  \ 和 `R[1]` 来解释决策过程。如果 `x = (x[1],…..x[n])` 是观测集，那么如果 `x ∈ R[0]`，则决策倾向于 `H[0]`；如果\
  \ `x ∈ R[1]`，则决策倾向于 `H[1]`。区域 `R[0]`称为接受区域，因为零假设被接受，而 `R[1]` 是拒绝区域。根据观测空间中的两个区域，共有\
  \ 4 种可能的决策：\n\n1. `H[0]` 是真的；接受 `H[0]` ➔ 这是一个正确的决策\n2. `H[0]` 是真的；拒绝 `H[0]`（意味着接受\
  \ `H[1]`）➔ 这是一个错误的决策\n3. `H[1]` 是真的；接受 `H[1]` ➔ 这是一个正确的决策\n4. `H[1]` 是真的；拒绝 `H[1]`（意味着接受\
  \ `H[0]`）➔ 这是一个错误的决策\n\n因此，我们可以看到存在 2 种正确和 2 种错误决策以及相应的行动。错误决策可以称为：\n\n第一类错误：当 `H[0]`\
  \ 为真时拒绝 `H[0]`（或接受 `H[1]`）。这种情况的例子是肿瘤的恶性检测，将良性肿瘤接受为恶性肿瘤并开始相应的治疗。这也被称为 `Alpha`，即将好解释为坏。\n\
  \n第二类错误：当 `H[1]` 为真时拒绝 `H[1]`（或接受 `H[0]`）。这种情况的例子是肿瘤的恶性检测，将恶性肿瘤接受为良性肿瘤且不开始治疗。这也被称为\
  \ `Beta`，将坏解释为好，可能会产生更具破坏性的影响。\n\n第一类错误和第二类错误的概率为：\n`P[I] = P (D[1]|H[0]) = P(x\
  \ ∈ R[1]; H[0])`\n`P[II] = P (D[0]|H[1]) = P(x ∈ R[0]; H[1])`\n\n其中，`D[i] (I = 0,\
  \ 1)` 表示决策接受 `H[i]` 的事件。`P[I]` 也记作 `α`，称为显著性水平，而 `P[II]` 记作 `β`，称为检验功效。在这里，`α` 和\
  \ `β` 与其他并不独立，因为它们代表来自同一个决策问题的事件概率。因此，在样本量固定的，通常一种类型错误的减少会导致另一种错误的增加。虽然减少两种类型的错误都是理想的，但这只有通过增加样本量来实现。在假设检验的所有实际应用中，四种可能的结果和行动方案都与相对重要性或特定成本相关，因此最终目标可以是降低总成本。\n\
  \n因此，正确决策的概率为：\n`P(D[0]|H[0]) = P(x ∈ R[0]; H[0])`\n`P(D[1]|H[1]) = P(x ∈ R[1];\
  \ H[1])`\n\n## 5.11 蒙特卡洛近似\n\n尽管我们讨论了随机变量的分布函数，但在实际情况下，使用变量换公式来计算它们是非常困难的。蒙特卡洛近似为此提供了一个简单但强大的替代方案。让我们先从分布中生成\
  \ `S` 个样本，作为 `x1, …, x[S]`。对于这些样本，我们可以通过使用集合 `{f(x[s])}^S[s = 1]` 的经验分布来近似 `f(X)`\
  \ 的分布。\n\n原则上，蒙特卡洛方法可以解决任何具有概率解释的问题。我们通过大数定律可知，由某些随机变量期望值描述的积分可以通过取独立样本的经验均值（或样本均值）来近似。随机变量概率分布的马尔可夫链蒙特卡洛\
  \ (`MCMC`) 是一种采样器，其核心思想是设计一个具有规定概率分布的马尔可夫链模型。蒙特卡洛技术现在广泛应用于统计学和机器学习。使用蒙特卡洛技术，我们可以通过从总体中抽取样本，然后计算应用于函数的算术平均值来近似随机变量任何函数的期望值，如下：\n\
  \n```\n![images](img/1.1)\n```\n\n这也被称为蒙特卡洛积分，比在固定网格点上评估函数的数值积分更容易计算。蒙特卡洛只在概率不可忽略的地方评估函数。\n\
  \n对于不同的函数 `f()`，可以获得某些重要量的近似：\n\n* ![img](img/142-2.png)\n* ![img](img/142-3.png)\n\
  * ![img](img/142-4.png)\n* `median{ x[1], …, x[s] } → median(X)`\n\n## 5.12 总结\n\
  \n1. 频率概率解释代表事件的长期频率，而贝叶斯概率解释试图量化某些事件的不确定性，因此关注信息而非重复试验。\n2. 根据贝叶斯规则 `p (A|B) =\
  \ p (B|A) p(A)/ p (B)`。\n3. 离散随机变量用概率质量函数（pmf）表示 `p(x) = p(X = x)`。\n4. 连续随机变量用概率密度函数（pdf）表示\
  \ `p(x) = p(X = x)`。\n5. 随机变量 `X` 的累积分布函数（cdf）可以通过 ![img](img/143-1.png) 。\n6. 随机变量\
  \ `X` 求均值的公式为：\n\n   ```\n   ![img](img/143-2.png)\n   ```\n   当 `X` 为离散时。\n\n \
  \  ``````\n   ![img](img/143-3.png)\n   ```\n   当 `X` 为连续时。\n\n\n\n\n\n7. 寻找随机变量\
  \ `X` 方差的方程为 ![images](img/143-4.png)\n\n8. 当我们处于试验结果仅为“成功”或“失败”的特定情况时，随机变量 `X`\
  \ 的行为可以用伯努利分布来表示。\n\n9. 如果进行了 `n` 次相互独立的伯努利试验，且 `X` 代表这 `n` 次试验中成功的次数，那么 `X` 被称为二项分布随机变量。\n\
  \n10. 为了对投掷 `K` 面骰子的结果进行建模，或者对于结果多可能的实验，我们可以使用多项分布。\n\n11. 泊松随机变量具有广泛的应用，因为当 `n`\
  \ 很大且 `p` 较小且 `np` 处于中等规模时，它可以作为参数为 (`n`, p`) 的二项分布的近似。\n\n12. 均匀分布、高斯（正态）分布、拉普拉斯分布是少数重要的连续随机分布的例子。\n\
  \n13. 如果随机实验的样本空间 `S` 中有两个随机变量 `X` 和 `Y`，那么这一对 (`X`, `Y`) 被称为双变量随机变量。\n\n14. 两个随机变量\
  \ `X` 和 `Y` 之间的协方差衡量了 `X` 和 `Y` 相关（线性）相关的程度。\n\n15. 根据中心极限定理，无论单个 `X[i]` 的分布如何，对于较大的\
  \ `n`，其和 `S[n]` – `X[1]` + … `X[n]` 的分布近似于正态分布。\n\n16. 在假设检验中：\n    - 第一类错误：当 `H[0]`\
  \ 为真时，拒绝 `H[0]`（或接受 `H[1]`）。\n    - 第二类错误：当 `H[1]` 为真时，拒绝 `H[1]`（或接受 `H[0]`）。\n\n\
  17. 使用蒙特卡洛方法，我们可以通过简单从随机变量的总体中抽取样本，然后计算应用于样本的函数算术平均值，来近似随机变量任何函数的期望值。\n\n## 示例题\n\
