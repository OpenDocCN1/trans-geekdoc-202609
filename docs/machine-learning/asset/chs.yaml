  \ 5 个类中，并使用了 `k-means algorithm`。\n\n## 第 10 章\n\n## 神经网络基础\n\n### 本章目标：\n\n在过去的\
  \ 9 章节中，你已经详细地接触了机器学习的概念。你从如何判断一个问题是否可以用机器学习来解决开始，一旦你做出了这个决定，你就学习了如何在机器学习的范式中开始对问题进行建模。在此背景下，你接触了三种类型的机器学习——监督学习、无监督学习和强化学习。然后，你探索了所有流行的监督学习和无监督学习算法。现在，你已经掌握了相当多的机器学习的基础知识，是时候介绍一下神经网络的概念了。\n\
  \n其实，你已经在书的开头看到了机器学习过程是如何映射到人类学习过程的。现在，是时候看看人类神经系统是如何以人工神经网络或简单神经网络的形式在计算机世界中模拟的。本章将简要介绍神经网络以及它如何帮助不同形式的学习。\n\
  \n## 10.1 引言\n\n在之前的章节中，我们逐渐揭示了机器学习的奥秘，即机器如何学习执行任务并随着经验、专家指导或自我学习随推移而改进。正如我们所看到的，机器学习模仿了人类的学习形式。另一方面，人类的学习，或者说人类的每一个动作都受到神经系统的控制。在任何人类身上，神经系统都通过向身体的不同部分发送接收信号来协调不同的动作。神经系统由一种特殊的细胞组成，称为\
  \ `neuron`（神经元），它具有特殊的结构，使其能够接收或向其他神经元发送信号。神经元之间相互连接，向其他神经元传输信号或接收来自其他神经元的信号。这种结构本质上形成了一个神经元网络或神经网络。\n\
  \n凭借拥有数十亿联网的神经元，生物神经网络是一个巨大复杂的并行计算网络。正是由于这个庞大的并行计算网络，神经系统帮助人类以极快的速度和如此轻易的方式执行动作或做出决策，以至于世界上最快的超级计算机也会感到嫉妒。例如，让我们想想板球世界杯中防守员完成的精彩飞行扑救。这是基于过去板球经验的优越计算、对地面状况的理解以及对球击出力度的预判的结合，防守员决定了何时跳、在哪里跳以及跳多高。这是一个非常复杂的任务，你可能认为并不是每个人都擅长这种神奇的动作。在这种情况下，让我们想些简单的事情。让我们考虑一个非常简单的日常活动，即在池里游泳。显然，游泳看起来很微不足道，但请思考游泳需要采取的并行动作和决策。游泳需要正确的体姿组合。\n\
  \n（注：原文后续存在大量重复段落，此处已根据要求去重并保留核心逻辑）\n\n\n\n\n轴突是人类神经元的一部分，直径为 10–12 μm。每个突触跨越的宽度约为百万分之一英寸。\n\
  \n## 10.3 探索人工神经元\n\n生物神经网络已以人工神经网络（ANN）的形式建模，用人工神经元模拟生物神经元的功能。如图图 10.2 所示，输入信号\
