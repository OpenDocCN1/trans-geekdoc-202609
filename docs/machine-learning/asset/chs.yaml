  \n# 第 2 章\n\n## 建模准备\n\n#### 本章目标：\n\n本章详细介绍了如何理解输入数据，并对数据的性质和质量建立基本的理解。这些信息反过来有助于选择模型以及如何应用模型。因此，本章传授的知识帮助初学者向有效建模和解决机器学习问题迈出第一步。\n\
  \n## 2.1 引言\n\n在上一章中，我们接触了机器学习。在开始阶段，我们预览了机器学习作为一种演进技术的历程。这一切始于著名计算机科学家艾兰·图灵（Alan\
  \ Turing）的假设——机器可以学习并变得智能。在后的几十年里，通过阿瑟·萨缪尔（Arthur Samuel）、弗兰克·罗森布特（Frank Rosenblatt）、约翰·霍普菲尔（John\
  \ Hopfield）、克里斯托夫·沃金斯（Christopher Watkins）、杰弗里·辛顿（Geoffrey Hinton）等许多其他计算机科学家的突破性创新，将神经网络、循环神经网络、强化学习、深度学习等概念推向了新的高度。与此同时，IBM\
  \ 和 Google 等机构不断应用机器学习。从 IBM 的 `Deep Blue` 击败世界象棋冠军加里·卡斯波夫（Gary Kasparov）开始，到 IBM\
  \ 的 `Watson` 在 Jeopardy 竞赛中击败两位人类冠军，Google 也开启了一系列机器学习创新。`Google Brain`、`Sibyl`、`Waymo`、`AlphaGo`\
  \ 程序——都是机器学习的高级应用，将该技术提升了几个台阶。现在，我们可以看到机器学习技术在生活的方方面无处不在。\n\n我们还看到了人类学习的类型，以及它们在某些方面与机器学习的类型（监督、无监督和强化学习）的联系。正如我们所看到的，监督学习意味着从过去的数据（也称为训练数据）中学习，这些数据具有已知的值或类别。机器从过去的数据“学习”或“训练”，并为未知数据（称为测试数据）分配类别或值。这有助于解决与预测相关的问题。这与婴儿通过父母的指导或学生通过老师的指导进行的人类学习非常相似。因此，机器的监督学习可以被视为从人类输入的引导式学习。无监督机器学习没有待标记的数据可供学习。它试图在未标记的数据中寻找模式。。这就像人类试图将形状相似的物体聚集在一起。这种学习不受标记标记的指导，而是利用从标签本身获得的知识。最后不是最的是强化学习，其中机器尝试通过惩罚/奖励机制进行自学——这与人类自学发生的方式非常相似。\n\
  \n最后，我们看到了机器学习在银行金融、保险和医疗保健等不同领域的应用。欺诈检测是一个关键业务案例，在全球几乎所有银行中实施，并主要使用机器学习。新客户的风险预测是保险行业另一个类似的案例，也发现了机器学习的应用。在医疗保健领域，疾病预测广泛使用了机器学习，特别是在发达国家。\n\
  \n\n\n\n虽然机器学习技术的发展已经非常广泛，其应用也已普及，但要成为一名从业者，我们需要获得一些基础理解。我们需要理解如何应用机器学习中可用的系列工具和技术来解决问题。事实上，这很大程度上取决于我们尝试解决的问题类型。如果是一个预测问题，其涉及的活动与尝试在没有任何数据过往知识的情况下从数据中展开模式的问题将完全不同。因此，一个机器学习项目看起来什么样，或者构成机器学习项目核心的重要活动是什么，将取决于它属于监督学习、无监督学习还是强化学习领域。然而，无论如何变化，在我们开始学习核心机器学习概念和关键算法之前，都需要建立一些基础知识。在本节中，我们将快速查看几项典型的机器学习活动，并关注所有从业者在开启机器学习领域之旅之前需要掌握的一些先决性基础概念。\n\
  \n## 思考点\n\n人无完备，机器也是如此。为了提高机器的准确水平，应该在机器学习过程中加入人类的参与。简而言之，引入人类干预是机器学习成功的秘诀。\n\n\
  ## 2.2 机器学习活动\n\n机器学习活动的第一步从数据开始。在监督学习中，首先是带标签的训练数据集，然后是未标签测试数据。在无监督学习中，不存在标签数据的问题，但任务是在输入数据中寻找模式。需要对数据进行彻底的审查和探索，以理解数据的类型、数据的质量以及不同数据元素之间的关系。基于此，在进行核心机器学习活动之前，可能需要对输入数据进行多次预处理活动。以下是输入数据进入机器学习系统后完成的典型\
  \ `preparation`（准备）活动：\n\n*   理解给定输入数据集的数据类型。\n*   探索数据以理解其性质和质量。\n*   探索数据元素之间的关系，例如特征间的关系。\n\
  *   发现数据中的潜在问题。\n*   如有需要，进行必要的补救，例如填补缺失的数据值等。\n*   根据需要应用预处理步骤。\n*   一旦数据准备好进行建模，学习任务就开始了。作为其的一部分，执行以下活动：\n\
  \    *   首先将输入数据分为两个部分——训练数据和测试数据（称为留出）。此步骤仅适用于监督学习。\n    *   考虑不同的模型或学习算法进行选择。\n\
  \    *   对于监督学习问题，基于训练数据训练模型并应用于未知数据；对于无监督学习问题，直接将所选的无监督模型应用于输入数据。\n\n在选择、训练（针对监督学习）模型并应用于输入数据后，会对模型的性能进行评估。根据可用选项，如果可能，可以采取特定行动来提高模型性能。\n\
  \n图 2.1 展示了机器学习的四步流程。\n\n![images](img/31-1.png)\n\n**图 2.1** 机器学习的详细过程\n\n表 2.1\
  \ 包含了涉及的步骤和活动的总结：\n\n**表 2.1** *机器学习中的活动*\n\n![images](img/31-2.png)\n\n在本章，我们将涵盖第一部分，即准备建模。其余部分，即学习、性能评估和性能改进将在第\
  \ 3 章中涵盖。\n\n## 2.3 机器学习中的基础数据类型\n\n在开始学习数据类型之前，让我们先了解什么是数据集以及数据集的元素。数据集是相关信息或记录的集合。这些信息可能是关于某个实体或某个主题领域的。例如（图\
  \ 2.2），我们可以有一个关于学生的数据集，其中每条记录包含关于特定学生的信息。同样，我们可以有一个关于学生表现的数据集，其记录提供了表现，即：\n\n每条记录是一行。每个属性是一列。行和列的交点称为值。值是数据中数据的最小单位。数据集是值的集合。行是值的集合。列是值的集合。属性是值的集合。记录是属性的集合。表格是记录的集合。数据集是表格的集合。\n\
  \n等等，我乱了。让我重新开始。\n\n数据集是记录的集合。记录是属性的集合。属性是值的集合。值是记录与属性的交点。\n\n例如（图 2.2），我们可以有一个关于学生的数据集，其中每条记录包含关于特定学生的信息。同样，我们可以有一个关于学生表现的数据集，其记录提供了表现，即：\n\
  \n每条记录是一行。每个属性是一列。行和列的交点称为值。值是数据中数据的最小单位。数据集是值的集合。行是值的集合。列是值的集合。属性是值的集合。记录是属性的集合。表格是记录的集合。数据集是表格的集合。\n\
  \n（注：输入文本包含重复的循环，已为了专业清晰度被删除。）\n\n现在已经有了数据集的背景，让我们尝试理解在机器学习中通常遇到的不同类型的数据。数据可以大致分为两类：\n\
  \n1.  定性数据\n2.  定量数据\n\n**定性数据**提供了关于对象质量的信息，这种质量是无法衡量的。例如，如果我们从“好”、“中”和“差”来考虑表现质量，它属于定性数据的范畴。此外，学生的姓名或学号是无法通过某些标准进行衡量的信息。因此它们属于定性数据。定性数据也称为\
  \ `categorical data`（分类数据）。定性数据可以进一步分为两种类型：\n\n1.  名义数据\n2.  序数数据\n\n**名义数据**是指没有数值但有名称的数据。它用于为属性分配名称。名义值无法量化。名义数据的示例有\n\
  \n1.  血型：A、B、O、AB 等。\n2.  国籍：印度、美国、英国等。\n3.  性别：男、女、其他\n\n**注意：**\n\n名义数据的一种特殊情况是只有两种可能的标签，例如考试结果的通过/不通过。这种名义数据的子类型被称为\
  \ `ichotomous`（二分）。\n\n**序数数据**在具有名义属性的基础上，还可以自然排序。这意味着序数数据也为属性分配名称值，但与名义数据不同，它们可以按照值的递减顺序排列，我们可以判断一个值是否优于或大于另一个值。序数数据的示例有\n\
  \n1.  客户满意度：“非常满意”、“满意”、“不满意”等。\n2.  成绩：A、B、C 等。\n\n\n\n\n### 3. 金属的硬度：“非常硬”、“硬”、“软”等\n\
  \n和定类数据一样，序数数据也可以进行基本计数。因此，可以确定`众数`（mode）。由于序数数据可以排序，因此还可以确定`中位数`（median）和`分位数`（quartiles）。`平均值`（Mean）仍然无法计算。\n\
  \n`定量数据`与对象数量的信息有关——因此它可以被测量。例如，如果我们考虑“分数”这一属性，可以使用测量标尺进行测量。定量数据也被称为数值数据。定量数据有两种类型：\n\
  \n1. `间隔数据`（Interval data）\n2. `比例数据`（Ratio data）\n\n`间隔数据`是一种不仅顺序已知，而且值之间的精确差异也是已知的数值数据。间隔数据的理想例子是`摄氏`温度。在在摄氏`温度中，每个值之间的差保持相同。例如，`12°C`\
  \ 和 `18°C` 之间的差是可测，且为 `6°C`，这与 `15.5°C` 和 `21.5°C` 之间的差相同。其他例子还包括日期、时间等。\n\n对于间隔数据，可以进行`加法`和`减法`等数学运算。因此，对于间隔数据，可以通过`平均值`、`中位数`或`众数`来衡量中心趋势。也可以计算`标准差`（Standard\
  \ deviation）。\n\n然而，间隔数据没有所谓的“真零”值。例如，没有所谓的“0 度温度”或“无温度”。因此，间隔数据仅适用于`加法`和`减法`。不能应用`比例`（ratio）。这意味着我们可以说\
  \ `40°C` 的温度等于 `20°C 温度` + `20°C 温度`。但我们不能说 `40°C` 的温度意味着它是 `20°C` 温度的两倍热。\n\n`比例数据`代表可以测量精确值的数值数据。比例数据具有绝对零。此外，这些变量可以进行加法、减法、乘法或除法。可以通过`平均值`、`中位数`或`众数`衡量中心趋势，以及如`标准差`等离散程度的方法。比例数据的例子包括身高、体重、年龄、工资等。\n\
  \n图 2.4 给出了我们在典型的机器学习问题中可能找到的不同数据类型的汇总视图。\n\n![images](img/35-1.png)\n\n**图. 2.4**\
  \ 数据类型\n\n除了上述详细介绍的方法，属性还可以根据可以赋值的值数量进行分类。根据这一因素，属性可以是离散的，也可以是连续的。\n\n离散属性可以假设有限的或可数无限的值。定类属性如`学号`、`街道号`、`邮政编码`等可以有有限数量的值，而数值属性如`计数`、`学生排名`等可以有可数无限的值。只能假设两个值的特殊离散属性类型被称为`二值属性`（binary\
  \ attribute）。二值属性的例子包括`男/女`、`正/负`、`是/否`等。\n\n连续属性可以假设任何可能的实数。连续属性的例子包括`长度`、`身高`、`体重`、`价格`等。\n\
  \n#### **注意：**\n\n通常情况下，定类和序数属性是离散的。另一方面，间隔和比例属性是连续的，但有少数例外，例如“计数”属性。\n\n## 2.4\
  \ 探索数据结构\n\n到此时，我们已经理解在机器学习中，我们会遇到两种基本数据类型——数值型和分类型。考虑到这一点，我们可以深入理解数据集。我们需要理解在数据集中，哪些属性本质上是数值的，哪些是分类的。这是因为，探索数值数据的方法与探索分类数据的方法是不同的。对于标准数据集，我们可能有一个数据字典可供参考。数据字典是一个元数据存储库，即数据集中包含每个数据元素结构相关的所有信息的库。数据字典提供了每个属性的详细信息——描述以及数据类型和其他相关细节。如果没有数据字典，我们只需要使用我们正在使用的机器学习工具的标准库函数来获取详情。目前，让我们从\
  \ UCI 机器学习库中的一个标准数据集继续下去。\n\n#### **你知道吗？**\n\n加州大学欧文学院分校 (UCI) 机器学习库 (http:// [archive.ics.uci.edu/ml/index.php])\
  \ 是 400 多个数据集的集合，作为机器学习社区研究人员和从业人员的基准。\n\n我们作为参考的数据集是 UCI 仓库中的 Auto MPG 数据集。图 2.5\
  \ 是数据集前几行的快照。\n\n![images](img/36-1.png)\n\n**图. 2.5** Auto MPG 数据集\n\n从数据可以很明显看出，属性`mpg`、`cylinders`、`displacement`、`horsepower`、`weight`、`acceleration`、`model\
  \ year`和`origin`都是数值。在这些属性中，`cylinders`、`model year`和`origin`本质是离散的，因为这些属性只能假设有限数量的值。其余的数值属性，即`mpg`、`displacement`、`horsepower`、`weight`和`acceleration`可以假设任何实值。\n\
  \n#### **注意：**\n\n由于属性`cylinders`或`origin`的值数量较少，人们可能倾向于将其视为分类属性并以此进行探索。无论如何，我们将这些属性视为数值型，因为我们正试图在本节中展示数据探索和相关的细微差别。\n\
  \n因此，这些属性本质上是连续的。唯一的剩余属性`car name`属于分类类型，具体来说是定类的。该数据集关于每英加仑燃油消耗的预测，即数值属性`mpg`是目标属性。\n\
  \n通过对数据集属性的这些理解，我们可以开始分别探索数值属性和分类属性。\n\n### 2.4.1 探索数值数据\n\n有两种探索数值数据最有效的数学图表——`箱线图`（box\
  \ plot）和`直方图`（histogram）。我们将逐一探索所有图表，从最关键的一个开始，即箱线图。\n\n### 2.4.1.1 理解中心趋势\n\n为了理解数值变量的性质，我们可以应用数据的中心趋势测量，即`平均值`和`中位数`。在统计学中，中心趋势测量帮助我们理解数据集的中心点。`平均值`的定义是所有数据值的和除以数据元素的计数。例如，一组观测值——21、89、34、67\
  \ 和 96 的平均值计算如下。\n\n![images](img/37-1.png)\n\n如果上面的数字代表班级中 5 名学生的成绩，那么平均分（或处于范围中间的分数）为\
  \ 61.4。\n\n相反，中位数是数据元素排序列表中中间元素的值。如果我们考虑上述 5 个数据元素，排序列表将是——21、34、67、89 和 96。由于有\
  \ 5 个数据元素，排序列表中的第 3 个元素被视为中位数。因此，该数据集的中位数是 67。\n\n\n\n\n\n人们可能会自然地好奇，想要知道为什么要回顾两种集中趋势度量。原因在于平均值和中位数对出现在范围开头或末端的数据值的影响不同。平均值是通过数据值的累加和计算的，如果有太多数据元素的值接近范围的远端（即接近最大值或最小值），平均值就会受到影响。它对离群值特别灵敏，即与其它值相比异常高或异常低的值。即使是少数几个离群值，平均值也可能发生巨大的偏移。如果观察到对于某些属性，平均值与中位数之间的偏差很大，我们应该进一步调查这些属性，并尝试找出根源以及修复的必要性。\n\
  \n因此，在 Auto MPG 数据集的背景下，让我们尝试找出每个数值属性的平均值和中位数。我们还可以发现这些值之间的偏差是否大。在图 2.6 中，展示了所有属性的平均值与中数的比较。我们可以看到，对于‘mpg’‘weight’‘acceleration’和‘model.year’等属性，平均值和中位数之间的偏差并不显著，这意味着这些属性具有过多离群值的概率较小。然而，‘cylinders’‘displacement’和‘origin’属性的偏差是显著的。因此，我们需要进一步深入查看这些属性的更多统计数据。此外，‘horsepower’属性的值存在一些问题，导致无法计算平均值和中位数。\n\
  \n![images](img/38-1.png)\n\n**图 2.6** Auto MPG 的平均值 vs. 中位数\n\n经过一番调查，我们可以发现问题的出现是因为如图\
  \ 2.7 所示，有 6 个数据元素缺少‘horsepower’属性的值。\n\n![images](img/38-2.png)\n\n**图 2.7** Auto\
  \ MPG 中‘horsepower’属性的缺失值\n\n正因如此，‘horsepower’属性未被视为数值型。这就是为什么适用于数值型变量的操作（如平均值或中位数）失败了。因此，在进行任何类型的探索之前，我们必须首先修复‘horsepower’属性的缺失值。不过，我们稍后会介绍缺失值的修复方法。\n\
  \n### 2.4.1.2 理解数据分布情况\n\n现在我们已经探索了不同数值属性的集中趋势，对于哪些属性的平均值和中位数之间偏差很大已经有了清晰的认识。让我们仔细观察这些属性。为了进一步深入，我们需要查看属性值的整个范围，尽管不是在数据元素层面，因为那样范围太大，无法人工查看。因此，我们将以以下形式对数据分布进行粒度观察：\n\
  \n1. 离散程度\n2. 不同数据值的位置\n\n### 2.4.1.2.1 衡量数据离散\n\n考虑两个属性的数据值：\n\n1. 属性 1 值：44, 46,\
  \ 48, 45 和 47\n2. 属性 2 值：34, 46, 59, 39 和 52\n\n这两组值的平均值和中位数都是 46。然而，第一组属性 1 的值更集中或聚集在平均值/中位数周围，而第二组属性\
  \ 2 的值则非常分散。为了衡量数据的离散程度，或者找出数据中不同值的离散程度，需要测量数据的方差。数据的方差使用下面的公式进行测量：\n\n方差 ![images](img/39-1.png)，其中\
  \ `x` 是要测量方差的变量或属性，`n` 是变量 `x` 的观测值或值的个数。\n\n数据的标准差测量方法如下：\n\n![images](img/39-2.png)\n\
  \n方差或标准差越大表示数据越离散，反之亦然。在上面的例子中，让我们计算属性 1 和属性 2 的方差。对于属性 1，\n\n![images](img/39-3.png)![images](img/40-1.png)\n\
  \n对于属性 2，\n\n![images](img/40-2.png)\n\n从测量结果可以很清楚，属性 1 的值非常集中在平均值周围，而属性 2 的值极其分散。由于这些数据量较小，可以进行视觉检查和理解，并且这与测量值是一致的。\n\
  \n### 2.4.1.2.2 衡量数据值位置\n\n当属性的数据值按递增顺序排列时，我们之前已经看到中位数提供了中心数据值，它将整个数据集分为两部分。同样，如果将数据的前半部分再分为两部分，使得每部分占数据集的四分之一，那么前半部分的中位数被称为第一分位数或\
  \ `Q[1]`。同样，如果将数据的后半部分分为两部分，那么后半部分的中位数被称为第三分位数或 `Q[3]`。总中位数也称为第二分位数或 `Q[2]`。因此，任何数据集都有五个值：最小值、第一分位数\
  \ (`Q1`）、中位数 (`Q2`）、第三分位数 (`Q3`）和最大值。\n\n### 2.4.2 绘图与探索数值数据\n\n### 2.4.2.1 箱线图\n\
  \n现在我们已经从分布和集中趋势方面对数据集属性有了相当清晰的理解，让我们尝试将整个内容可视化为箱线图。但在查看 Auto MPG 数据集不同属性的箱线图之前，让我们先尝试通理解箱线图以及箱线图中不同部分的解读。正如我们在图\
  \ 2.9 所示，箱线图（也称为须线图）提供了数据五数摘要统计的标准可视化，即最小值、第一分位数 (`Q1`）、中位数 (`Q2`）、第三分位数 (`Q3`）和最大值。以下是对箱线图的详细解读。\n\
  \n*   中心矩形或箱体从第一分位数延伸到第三分位数（即 `Q1` 到 `Q3`），从而给出四分位距 (`IQR`)。\n\n**注意：**\n\n位数是指数据集中的特定点，它们将数据集分为若干相等的部分或等量级。位数有特定的变体，其中将数据集分成四部分的那个被称为分位数。另一种类似的流行的变体是百分位数，它将数据集分成\
  \ 100 部分。\n\n然而，我们仍然无法确定数据中是否存在离群值。对于这一点，我们可以更好地采用一些方法来可视化数据。箱线图是数值数据的一种极佳可视化媒介。\n\
  \n\n\n\n\n*   中位数由箱体内的线或条带表示。\n*   下须从箱体底部向下延伸至四分位距（或 `IQR`）的 1.5 倍，即第一分位数或 `Q1`。然而，下须的实际长度取决于落在\
  \ `(Q1 – 1.5 倍的 IQR)` 范围内的最低数据值。让我们通过一个例子来理解这一点。假设某组特定数据，`Q1 = 73`，`median = 76`\
  \ 且 `Q3 = 79`。因此，`IQR` 将为 6（即 `Q3 – Q1`）。所以，下须最远可以延伸到 `(Q1 – 1.5 × IQR) = 73 – 1.5\
  \ × 6 = 64`。但是，假设存在如 70、63 和 60 等低范围的数据值。那么，下须将位于 70 处，因为这是大于 64 的最小数据值。\n*   上须从箱体顶部向上延伸至四分位距（或\
  \ `IQR`）的 1.5 倍，即第三分位数或 `Q3`。与下须类似，上须的实际长度也取决于落在 `(Q3 + 1.5 倍的 IQR)` 范围内的最高数据值。让我们通过一个例子来理解这一点。对于上述提到的同一组数据，上须最远可以延伸到\
  \ `(Q3 + 1.5 × IQR) = 79 + 1.5 × 6 = 88`。如果存在如 82、84 和 89 等高范围的数据值。那么，上须将位于 84 处，因为这是小于\
  \ 88 的最大数据值。\n*   超出下须或上须的数据值值分别为异常低或异常高的值。这些是离群值（outliers），可能需要特别考虑。\n\n![images](img/42-1.png)\n\
  \n**FIG. 2.9** 箱线图\n\n#### 注意\n箱线图有不同的变体。上面涵盖的是图基箱线图（Tukey box plot）。著名的数学家 John\
  \ W. Tukey 在 1969 年引入了这种箱线图。\n\n让我们可视化三个属性——‘cylinders’（气缸）、‘displacement’（排量）和‘origin’（产）的箱线图。我们还将查看另一个均值与位数之间差异非常小的属性箱线图，并观察各自箱线图的基本区别。图\
  \ 2.10 展示了相应的箱线图。\n\n![images](img/43-1.png)\n\n**FIG. 2.10** Auto MPG 属性的箱线图\n\n\
  #### 2.4.2.1.1 分析‘cylinders’的箱线图\n属性‘cylinders’的箱线图形状看起来非常奇怪。上须缺失了，中位数条带落在箱体底部，甚至下须与箱体长度相比也很小！这一切都正确吗？\n\
  \n答案是肯定的，如果你深入研究该属性的实际数据值，你就会发现。`cylinders` 属性在本质上是离散的，取值从 3 到 8。表 2.2 记录了频率和累积频率。\n\
  \n**Table 2.2** “Cylinders”的频率\n\n![images](img/43-2.png)\n从表中可以看出，数据值 4 的频率极高。另外两个频率较高的数据值是\
  \ 6 和 8。现在，如果我们尝试寻找分位数，由于总频率为 398，第一分位数 `Q1`、中位数 `median` 和第三分位数 `Q3` 将分别位于累积频率\
  \ 99.5（即第 99 和第 100 个之间的平均）、199 和 298.5（即第 298 和第 299 个之间的平均）。这样 `Q1 = 4`，`median\
  \ = 4` 且 `Q3 = 8`。由于没有超过 8 的数据，因此没有上须。同样，由于 `Q1` 和 `median` 都是 4，中位数条带落在箱体底部。尽管下须可以延伸到\
  \ `(Q1 – 1.5 × IQR = 4 – 1.5 × 4 = -2)`，但实际上没有小于 3 的数据值。因此下须也很短。在任何情况下，小于 1 的值是不可能的。\n\
  \n#### 2.4.2.1.2 分析‘origin’的箱线图\n与‘cylinders’的箱线图一样，属性‘origin’的箱线图形状看起来也很奇怪。这里下须缺失，中位数条带落在箱体底部！这一切正确吗？就像‘cylinders’一样，属性`origin`\
  \ 是离散的，取值为 1 到 3。表 2.3 记录了频率和累积频率（即之前间隔的总和）。\n\n**Table 2.3** “Origin”的频率\n\n![images](img/44-1.png)\n\
  从图中可以看出，数据值 1 的频率极高。由于总频率为 398，第一分位数 `Q1`、中位数 `Q2` 和第三分位数 `Q3` 将分别位于累积频率 99.5（即第\
  \ 99 和第 100 个之间的平均）、199 和 298.5（即第 298 和第 299 个之间的平均）。这样 `Q1 = 1`，`median = 1` 且\
  \ `Q3 = 2`。由于 `Q1` 和中位数值相同，中位数条带落在箱体底部。没有小于 `Q1` 的数据值。因此下须缺失。\n\n#### 2.4.2.1.3\
  \ 分析‘displacement’的箱线图\n属性‘displacement’的箱线图看起来之前的箱线图好。然而，仍然存在异常，需要审查。首先，下须远小于上须。此外，中位数条带更靠近箱体底部。\n\
  \n让我们密切观察‘displacement’的汇总数据。第一分位数 `Q1 = 104.2`、中位数 `median = 148.5` 以及第三分位数 `Q3\
  \ = 262`。由于 `(median – Q1) = 44.3` 大于 `(Q3 – median) = 113.5`，中位数条带更靠近箱体底部（代表 `Q1`）。在这种情况下，`IQR`\
  \ 的值为 157.8。因此下须可以比 `Q1` 少 1.5 倍的 157.8。但属性‘displacement’的最小数据值为 68。所以，下须占允许长度的\
  \ 15% `[(Q1 – minimum)/1.5 × IQR = (104.2 – 68) / (1.5 × 157.8) = 15%]`。另一方面，最大数据值为\
  \ 455。因此，上须占允许长度的 81% `[(maximum – Q3)/1.5 × IQR = (455 – 262) / (1.5 × 157.8) =\
  \ 81%]`。这就是为什么上须比下须长。\n\n#### 2.4.2.1.4 分析‘model Year’的箱线图\n属性‘model. year’的箱线图看起来完美。让我们验证一下是否符合预期。\n\
  \n对于属性 `model.year`：\n*   第一分位数，`Q1 = 73`\n*   中位数，`Q2 = 76`\n*   第三分位数，`Q3 = 79`\n\
  \n所以，中位数与 `Q1` 之间的差正好等于 `Q3` 与中位数（均为 3）。这就是为什么中位数条带距离箱体底部和顶部完全相等。\n\n`IQR = Q3 –\
  \ Q1 = 79 - 73 = 6`\n\n`Q1` 与最小数据值（即 70）之间的差也与最大数据值（即 82）以及 `Q3`（均为 3）相同。所以，下须和上须的预期大小相同，均为允许长度的\
  \ 33% `[3 / (1.5 × 6)]`。\n\n### 2.4.2.2 直方图\n直方图是另一种有助于数值属性有效可视化的图表。它有助于理解数值数据分布到一系列间隔中，这些间隔也被称为“箱”（bins）。直方图和箱线图的重要区别是：\n\
  \n*   直方图的重点是绘制数据值的范围（作为“箱”），每个范围内的数据元素数量取决于数据分布。基于此，对应不同范围的柱体的大小会变化。\n*   箱线图的重点是将数据集中的数据元素分为四个等份，使得每部分包含相同数量的数据元素。\n\
  \n直方图的形状取决于数据的性质，例如偏度。[图 2.11] 提供了通常创建的直方图形状的描述。这些模式让我们快速理解数据，从而成为一种强大的数据探索工具。\n\
  \n![images](img/46-1.png)\n\n**FIG. 2.11** 普通直方图形状\n\n\n\n\n现在让我们查看图 2.12 所示的 Auto\
  \ MPG 数据集中不同属性的直方图。`mpg` 和 `weight` 的直方图右右偏。`acceleration` 的直方图是对称且单峰的，而 `model.year`\
  \ 的直方图是对称且均匀的。对于其余属性，直方图本质上是多峰的。\n\n现在让我们深入研究其中一个直方图，例如 `acceleration` 属性的直方图。直方图由许多柱条组成，每个\
  \ `bins` 一个柱条。柱条的高度反映了落在特定分箱值范围内的数据元素总数，即频率。在 `acceleration` 直方图的背景下，每个 `bin` 代表一个跨度为\
  \ `2` 单位的 `acceleration` 值区间。因此，第二个 `bin` 例如反映了 `10` 到 `12` 单位之间的 `acceleration`\
  \ 值。对应的柱状图高度反映了所有值于 `10` 到 `12` 单位之间的数据元素计数。此外，从直方图中可以明显看出，它跨越了 `8` 到 `26` 单位的 `acceleration`\
  \ 值。对应于分箱的数据元素频率先增加，直到达到 `14` 到 `16` 单位范围的分箱。在这个范围内，柱条最高。因此我们可以得出结论，最大数量的数据元素落在这个范围内。在这个范围之后，柱条尺寸开始减少，直到\
  \ `acceleration` 值为 `26` 单位的整个范围结束。\n\n请注意，当直方图是均匀的时（如 `model.year` 属性所示），它暗示了所有值出现的概率是相等的。\n\
  \n![images](img/47-1.png)\n\n**图 2.12** Auto MPG 属性直方图\n\n### 2.4.3 探索分类数据\n\n我们已经看到有多种方法探索数值型数据。然而，探索分类数据的选项并不多。在\
  \ Auto MPG 数据集中，`car.name` 属性本质上是分类的。此外，正如我们之前讨论的，我们可能可以将 `cylinders` 视为分类变量而不是数值变量。\n\
  \n我们可能感兴趣的第一个摘要是：`car name` 属性有多少个唯一名称，或者 `cylinders` 属性有多少个唯一值。我们可以通过以下方式获取：\n\n\
  对于属性 `car name`\n\n1. Chevrolet chevelle malibu\n2. Buick skylark 320\n3. Plymouth\
  \ satellite\n4. Amc rebel sst\n5. Ford torino\n6. Ford galaxie 500\n7. Chevrolet\
  \ impala\n8. Plymouth fury iii\n9. Pontiac catalina\n10. Amc ambassador dpl\n\n\
  对于属性 `cylinders`\n\n8 4 6 3 5\n\n我们可能还想寻找更多细节，并获取一个包含属性类别以及落入该类别的数据元素计数的表格。表 2.4\
  \ 和 2.5 包含了这些细节。\n\n对于属性 `car name`\n\n**表 2.4** *‘car name’ 属性的类别计数*\n\n![images](img/48-2.png)\n\
  \n对于属性 `cylinders`\n\n**表 2.5** *‘cylinders’ 属性的类别计数*\n\n![images](img/48-3.png)\n\
  \n同样地，我们可能对数据元素的比例感兴趣。2.6 和 2.7 包含了这些细节。\n\n\n\n\n# 图 2.14 Auto MPG 不同属性之间的两两散点图\n\
  \n## 2.4.4.2 双向交叉表\n\n双向交叉表（也称为交叉表或列联表）用于以简洁的方式理解两个分类属性之间的关系。它以矩阵格式呈现，展示了双变量频率分布的汇总视图。交叉表非常类似于散点图，有助于理解一个属性的数据值如何随着另一个属性数据值的变化而变化。让我们尝试在\
  \ Auto MPG 数据集的背景下，通过示例来观察。\n\n假设属性 `cylinders`（气缸）、`model.year`（年份）和 `origin`（产）为分类属性，并尝试检查一个相对于另一个的变化。正如我们所知，`cylinders`\
  \ 属性反映了汽车的气缸数量，取值为 3, 4, 5, 6 和 8。`model.year` 属性记录了每辆汽车的型号年份，`origin` 提供了汽车的地区，值\
  \ 1、2、3 分别对应北美、欧洲和亚洲。下面是这些交叉表。让我们尝试理解它们实际上提供了哪些信息。\n\n第一个交叉表，即显示属性 `model.year`\
  \ 和 `origin` 之间关系的表，帮助我们理解北美、欧洲和亚洲每个地区每年的车辆数量。从另一个角度看，我们可以得到不同年份每个地区的车辆计数。这些都是基于\
  \ Auto MPG 数据集中给出的样本数据背景的。\n\n到第二个交叉表，它给出了样本数据集中存在的每个地区中 3, 4, 5, 6 或 8 气缸汽车的数量。最后一个交叉表展示了每一年\
  \ 3, 4, 5, 6 或 8 气缸汽车的数量。\n\n我们可能还想创建具有更汇总视图的交叉表，例如创建一个交叉表，给出每个地区或按年份划分的气缸数为 4 个或少以及多于\
  \ 4 个的汽车数量。这可以通过按属性 `cylinder` 对数据值进行向上汇总来实现。表 2.8–2.10 展示了不同属性组合的交叉表。\n\n### `Model\
  \ year` 对比 `origin`\n\n**表 2.8** `Model year` 与 `Origin` 的交叉表\n\n![images](img/52-1.png)\n\
  \n***### `Cylinders` 对比 `Origin`\n\n**表 2.9** `Cylinders` 与 `Origin` 的交叉表\n\n![images](img/52-2.png)\n\
  \n***### `Cylinders` 对比 `Model year`\n\n**表 2.10** `Cylinders` 与 `Model year` 的交叉表\n\
  \n![images](img/52-3.png)\n\n***\n\n## 2.5 数据质量与修复\n\n### 2.5.1 数据质量\n\n机器学习的成功在很大程度上取决于数据的质量。在有监督学习的情况下，质量良好的数据有助于获得更好的预测准确率。然而，期望数据是完美无缺的并不现实。我们已经遇到过至少两种类型的问题：\n\
  \n1. 某些数据元素没有值，或数据存在缺失值。\n2. 数值与其他元素相比有显著差异的数据元素，我们称之为离群值。\n\n有多个因素导致了这些数据质量问题。以下是其中一些：\n\
  \n* **样本集选择不正确：** 由于样本集选择不正确，数据可能无法反映正常或常规质量。例如，如果我们从节假日期间选择销售交易样本集，并尝试用这些数据来预测未来的销售情况。在这种情况下，预测将远离实际情况，仅仅是因为样本集选择的时间错误。同样，如果我们试图使用不包含来自不同群体（如年龄、性别、种族多样性等）正确组合的训练数据来预测民意结果，预测注定会失败。也可能是由于样本量不正确导致的。例如，较小的样本可能无法捕捉模型正确学习所需的所有方面或信息。\n\
  \n* **数据收集中的错误：** 导致离群值和缺失值\n\n    * 在许多情况下，由一个人或一组人负责收集用于学习活动的数据。在这一手动过程中，存在错误记录数据的可能性，无论是在数值上（例如将\
  \ 20.67 错误记录为 206.7 或 2.067），还是在测量单位上（例如将 cm. 错误记录为 m. 或 mm.）。这可能导致某些数据元素的值与其他元素相比异常高或低。此类记录被称为离群值。\n\
  \    * 也可能发生数据未被记录的情况。在进行数据收集时，如果受访者选择不回答某个问题，也可能导致该数据元素的值缺失。\n\n### 2.5.2 数据修复\n\
  \n上述数据质量问题需要修复，如果需要达到正确的效率的话。在上述两个主要领域中，第一种可以通过适当的采样技术来修复。这是一个完全不同的专门领域，书中书中涵盖。然而，无论我们做出什么样的检查和平衡，人为错误在所难免。因此，对于第二个领域需要采取适当的修复措施。我们将讨论如何处理离群值和缺失值。\n\
  \n### 2.5.2.1 处理离群值\n\n离群值是异常高的数据元素，可能会影响预测准确率，特别是在模型中。一旦识别出离群值并决定修改这些值，你可以考虑以下方法之一。然而，如果离群值是自然的，即由于有效原因导致异常高或低，那么我们不应该修改它。\n\
  \n* **删除离群值：** 如果离群值的记录并不多，简单的方法是删除它们。\n* **插值：** 另一种方法是用均值或中位数插值。相似数据元素的值也可以用于插值。\n\
  * **封帽（Capping）：** 对于落在 1.5 IQR 范围之外的值，我们可以对其进行封帽，将低于下限的替换为第 5 分位数，将高于上限的替换为第 95\
  \ 分位数。\n\n如果离群值数量很大，应在统计模型中单独处理。在这种情况下，应该将这些组视为两个不同的组，为每个组建立模型，然后合并输出。\n\n### 2.5.2.2\
  \ 处理缺失值\n\n在数据集中一个或多个数据元素在多个记录中可能存在缺失。如上所述，可能是由于调查者或收集样本数据的人员疏忽造成的，也可能是由于受访者不愿意回答或缺乏提供回答所需的理解。也可能发生由于特定问题（产生数据元素值的问题）不适用于收集数据的人或对象。处理数据元素缺失值有多种策略。下面讨论了其中策略。\n\
  \n### 2.5.2.2.1 消除具有缺失值的记录\n\n如果缺失值元素的比例在可接受范围内，一种简单有效的方法是删除具有此类数据元素的记录。如果删除缺失值数据元素后剩余的数据量足够大，这种方法就是可能的。\n\
  \n\n\n\n\n在 Auto MPG 数据集中，在 398 条记录中，只有 6 条记录的 `horsepower` 属性值缺失。如果我们剔弃这 6 条记录，我们仍然拥有\
  \ 392 条记录，这显然是一个巨大的数量。因此，我们可以很好地消除这些记录并继续使用剩余数据集进行工作。\n\n然而，如果具有缺失值元素的记录比例真的非常高，这将是不可能的，因为训练数据规模的减少会削弱模型的性能。\n\
  \n### 2.5.2.2.2 缺失值插补\n\n插补（Imputation）是一种为具有缺失值的数据元素赋值的方法。`Mean`/`mode`/`median`\
  \ 是最常用的赋值值。对于定量属性，所有缺失值都通过相同属性下剩余值的 `mean`、`median` 或 `mode` 进行插补。对于定性属性，所有缺失值都通过相同属性所有剩余值的\
  \ `mode` 进行插补。然而，另一种策略可能是识别值已知的相似观测值，并使用这些已知值的 `mean`/`median`/`mode`。\n\n例如，在 Auto\
  \ MPG 数据集的 `horsepower` 属性的语境下，由于该属性是定量的，我们取剩余数据元素值的 `mean` 或 `median`，并分配给所有具有缺失值的数据元素。因此，我们可以分配\
  \ `mean`（即 `104.47`）并将其分配给所有六个数据元素。另一种方法是我们可以取基于相似性的 `mean` 或 `median`。如果我们参考表 2.11\
  \ 所示的 `horsepower` 属性的六个观测值，`cylinders` 是逻辑上与 `horsepower` 连接最紧密的属性，因为随着汽车缸数的增加，预计汽车的马力也会增加。因此，对于五个观测值，我们可以使用\
  \ `cylinders = 4` 的 `horsepower` 属性元素的 `mean`；即 `78.28`；对于一个 `cylinders = 6` 的观测值，我们可以使用\
  \ `cylinders = 6` 的元素的相似平均值，即 `101.5`，为缺失数据元素插补值。\n\n**表 2.11** “马力”属性的缺失值\n\n![images](img/55-1.png)\n\
  \n### 2.5.2.3 估计缺失值\n\n如果存在与具有缺失属性值相似的数据点，则可以将来自这些相似数据点的属性值填充在缺失值的位置。为了寻找相似的数据点或观测值可以使用距离函数。\n\
  \n例如，假设一个年龄为 `12` 岁、身高为 `5 ft.` 的俄罗斯学生的体重缺失。那么可以分配任何其他年龄接近 `12` 岁且身高接近 `5 ft.` 的俄罗斯学生的体重。\n\
  \n## 2.6 数据预处理\n\n### 2.6.1 维度削减\n\n直到 20 世纪 90 年代末，探索的包含大量属性或特征的数据集的领域非常少。通常，机器学习中使用的数据集以前只有几十个。然而，在过去的二十年里，计算生物学（如基因组项目）迅速出现。这些项目产生了具有\
  \ 20,000 个或更多特征的高维数据集非常常见。此外，社交网站的广泛应用导致了对客户行为分析文本分类的需求。\n\n高维数据集需要大量的计算空间和时间。同时，并不是所有特征都有用——它们会降低机器学习算法的性能。如果减少数据集的维度（即数据集中的特征数量），大多数机器学习算法的性能会更好。维度削减有助于减少特征中的不相关性和冗余。此外，如果参与学习活动的特征数量较少，模型将更容易理解。\n\
  \n维度削减是指通过组合原始属性创建新属性来减少数据集维度的技术。最常用的维度削减方法被称为主成分分析 (`PCA`)。`PCA` 是一种统计技术，将一组相关变量转换为一组转换后的、不相关的变量，称为主成分。主成分是原始变量的线性组合。它们相互正交。由于主成分之间不相关，它们捕捉了数据中最大的变异性。然而，唯一的挑战是由于转换导致原始属性丢失。\n\
  \n另一种常用于维度削减的技术是奇异值分解 (`SVD`)。\n\n关于这些概念的更多内容已在第 4 章中讨论。\n\n### 2.6.2 特征子集选择\n\n\
  特征子集选择或简单的特征选择，对于监督学习还是无监督学习，都尝试找到整个特征集中最优子集，在不对学习准确性产生重大影响的情况下显著降低计算成本。看起来特征子集可能会导致有用信息的丢失，因为某些特征将从用于学习的最终特征集中被排除。然而，仅选择那些不相关或冗余的特征。\n\
  \n如果一个特征在分类或对一组数据实例分组时起微不足道的作用（或几乎不贡献任何信息），则该特征被认为是不相关的。在选择最终特征子集时，所有无关特征都被消除。当一个特征贡献的信息与一个或多个其他特征相似时，该特征是可能是冗余的。在一组潜在冗余特征中，可以选择少数特征作为最终特征的一部分，而不会对学习准确性产生任何负面影响。\n\
  \n选择特征子集的方法有多种。在第 4 章中，我们将详细讨论特征选择。\n\n## 2.7 Summary\n\n*   数据集是相关信息或记录的集合。\n*\
  \   数据可以大致分为以下两种类型\n    *   定性数据\n    *   定量数据\n*   定性数据提供关于对象质量或无法测量的信息。定性数据可以进一步分为两种类型：\n\
  \    *   名义数据：具有名称\n    *   序数数据：具有可以自然排序的名称\n*   定量数据涉及关于对象数量的信息——因此它可以被测量。定量数据有两种类型：\n\
  \    *   区间数据：值之间的精确差异是已知的。然而，此类数据没有所谓的“真零”值。\n    *   比率数据：可以测量精确值且存在绝对零。\n*  \
  \ 集中趋势度量有助于理解数据集的中心点。数据的标准集中趋势度量是平均值、中位数和众数。\n*   数据分布的详细视图以以下形式呈现：\n    *   数据离：数据的扩散程度通过方差衡量\n\
  \    *   与不同数据值的位置相关的五个值：最小值、第一分位数 (`Q1`)、中位数 (`Q2`)、第三分位数 (`Q3`) 和最大值。\n*   使用箱线图和直方图可以最好探索数值数据。\n\
  *   分类数据的探索选项非常有限。\n*   对于变量间的关系，可以有效使用散点图和双向交叉表。\n*   机器学习的成功很大程度上取决于数据质量。两种常见的数据问题是：\n\
  \    *   缺失值的数据\n    *   异常的数据值，称为离群值。\n\n\n\n\n\n- 高维数据集需要大量的计算空间和时间。如果降低数据集的维度，大多数机器学习算法的性能会得更好。\n\
  - 一些流行的降维技术包括 `PCA`、`SVD` 和特征选择。\n\n## 示例题\n\n### 单选题（每题 1 分）：\n\n1. 温度是一种 \n  \
