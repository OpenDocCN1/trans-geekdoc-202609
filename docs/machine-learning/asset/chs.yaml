  cm$overall['Accuracy’]\n```\n\n**输出准确率：**\n0.8709677\n\n### A.6.2 监督学习 – 回归\n如第\
  \ 9 章所示，用于回归的两种主要算法是简单线性回归和多元线性回归。下面展示了两种算法在 R 代码中的实现。\n\n```r\ndata <- read.csv(“auto-mpg.csv”)\n\
  attach(data) # 数据集已附加到 R 搜索路径中，这意味着在评估变量时，只需通过其名称即可访问数据集中的对象。因此，不需要“data$mpg”，只需提供“mpg”即可。\n\
  data <- data[!is.na(as.numeric(as.character(horsepower))]\ndata <- mutate(data,\
  \ horsepower = as.numeric(horsepower))\noutliers_mpg <- boxplot.stats(mpg)$out\n\
  data <- data[-where(mpg == outliers_mpg)]\noutliers_cylinders <- boxplot.stats(cylinders)$out\n\
  data <- data[-where(cylinders == outliers_cylinders)]\noutliers_displacement <-\
  \ boxplot.stats(displacement)$out\ndata <- data[-where(displacement == outliers_displacement)]\n\
  outliers_weight <- boxplot.stats(weight)$out\ndata <- data[-where(weight == outliers_weight)]\n\
  outliers_acceleration <- boxplot.stats(acceleration)$out\ndata <- data[-where(acceleration\
  \ == outliers_acceleration)]\n```\n\n#### A.6.2.1 简单线性回归\n```r\nreg_pred <- lm(mpg\
  \ ~ cylinders)\nsummary(reg_pred)\n```\n\n#### A.6.2.2 多元线性回归\n```r\nreg_pred <-\
