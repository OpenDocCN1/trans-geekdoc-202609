  \ `b` 的情况下，`y[sum]` 的值将如下：]\n\n![images](img/275-2.png)\n\n3. **阈值激活函数**（或简单的**激活函数**，也称为**压缩函数**）仅当输入信号超过特定阈值时才会产生输出信号。它的行为与生物神经元相似，后者仅在总输入信号满足发放阈值时传输信号。\n\
