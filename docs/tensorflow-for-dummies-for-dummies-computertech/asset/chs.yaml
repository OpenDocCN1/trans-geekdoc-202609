:mn>1</m:mn><m:mo></m:mrow></m:msub></m:mo></m:mo><m:mfrac><m:mn>1</m:mn><m:mn>9</m:mn></m:mfrac></m:msub></m:mtd></m:mtr></m:mtr></m:mtr></m:table></m:math>\n\
  \n这种滤波器被称为 `box filter`（盒滤波器）或 `averaging filter`（平均滤波器）。卷积后，过滤后的像素构成了图 8-2 中的图像：\n\
  \n![FIGURE 8-2: 盒卷积减少了图像中的噪声。](img/9781119466215-fg0802.png)\n\nFIGURE 8-2: 盒卷积减少了图像中的噪声。\n\
  \n\n\n\n\n假设你有其他的放大镜，每种放大镜上都刻有你家庭成员的图像。如果你检查不同放大镜显示的数字，你就能找到你的每个家庭成员，从而在人群中找到你的家人。\n\
  \n在这个类比中，每个放大镜都是一个过滤器，每个刻有的图像都是特征。在图像上移动放大镜并读取数字的过程对应卷积。\n\n### 设置卷积参数\n\n当你使用卷积对图像进行分类时，你并不直接设置过滤器的元素。相反，你提供输入图像及其对应的类别。应用程序的任务是确定哪些过滤器最支持正确分类。通过这种方式，过滤器类似于在第\
  \ 7 章中讨论的神经网络权重。\n\n尽管你不能设置过滤器的元素，但你可以设置许多过滤器的属性，例如数量和大小。你还可以配置卷积的另外三个方面：\n\n* `stride`（步长）：将滤波器从一个二维点积移动到下一个\
  \ \n* `dilation`（空胀）：通过插入零值元素来扩大滤波器的尺寸\n* `padding`（填充）：考虑图像边缘附近的像素\n\n这些参数在决定应用程序如何执行卷积方面起着重要作用。接下来的章节将详细探讨每一个参数。\n\
  \n#### Stride\n\n在每次二维点积之后，卷积过程会将滤波器向右移动一个像素。当完成一行像素的所有点积计算后，卷积会将滤波器向下移动一个像素，并继续计算二维点积。\n\
  \n这种行为是默认的，但开发者可以通过设置 `stride` 来自定义卷积的执行方式。步长决定了滤波器在每次点积后移动多少。要设置 `stride`，你需要提供两个值：水平像素偏移和垂直像素偏移。默认\
  \ `stride` 始终为 `(1, 1)`。\n\n例如，如果你将 `stride` 设置为 `(2, 3)`，则滤波器在每次点积后将向右移动两个像素。在完成一行所有的点积后，滤波器将向下移动三个像素并开始计算后续的点积。这种增加的步长减少了卷积所需的计算量，但也减少了细节量。在书中，`stride`\
  \ 将始终被设置为 `(1, 1)`。\n\n#### Dilation\n\n`dilation` 一词通常指身体部分的拉伸或扩张，例如瞳孔。在图像处理中，`dilation`\
  \ 指拉伸滤波器。与 `stride` 类似，你可以通过提供两个值（水平和垂直）来指定 `dilation`。默认 `dilation` 为 `(1, 1)`。\n\
  \n随着 `dilation` 的增加，滤波器的感受野在不增加参数数量的情况下增大。例如，如果你将 `dilation` 设置为 `(2, 2)`，滤波器元素之间会被零值元素分隔，允许网络捕获更广泛的上下文。\n\
  \n#### Padding\n\n填充考虑了图像边缘附近的像素。处理这种问题有两种主要方法：\n\n1. `valid`：不应用填充，输出图像比输入图像小。\n\
  2. `same`：在图像边界添加零填充，使得输出图像与输入具有相同的维度。\n\n### 卷积神经网络 (CNNs)\n\n卷积神经网络是一种专门用于处理网格状数据（如图像）的神经网络。它们使用卷积层来自动学习空间层次结构。\n\
  \nCNN 在许多方面与普通神经网络相似，但它们有关键区别：\n\n* 它们使用卷积层来提取特征。\n* 它们使用池化层来降低特征图的维度。\n* 它们在输入上共享权重，从而减少了参数的数量。\n\
  \n在 CNN 中，第一层通常检测边缘和纹理等低级特征，而深层层则组合这些特征来检测形状或物体等复杂模式。\n\n### 创建卷积层\n\n在 TensorFlow\
  \ 中，图像是一个包含通道的张量。例如，灰度图像有一个通道，而 RGB 图像有三个通道。\n\n卷积层接受一批图像，使用一组过滤器进行卷积，并返回一个输出张量。每个输出的大小取决于输入的大小以及\
  \ `padding` 的使用。\n\n你可以通过调用 `tf.layers.conv2d` 来创建一个卷积层。\n\n\n\n\n\n| `bias_initializer`\
  \ | `tf.zeros.initializer()` | 层偏置的初始化器 |\n| `kernel_regularizer` | `None` | 卷积核值（权重）的正则化\
  \ |\n| `bias_regularizer` | `None` | 层偏置的正则化 |\n| `activity_regularizer` | `None`\
  \ | 层输出的正则化 |\n| `trainable` | `True` | 布尔值，标识是否将滤波器的元素添加到图的可训练变量中 |\n| `name` |\
  \ `None` | 层的名称 |\n| `reuse` | `False` | 布尔值，标识是否重用同名作用域的权重 |\n\n应用程序必须将 `inputs`\
  \ 设置为形状取决于 `data_format` 参数的张量。如果你将 `data_format` 设置为 `channels_last`（默认值），则 `inputs`\
  \ 张量的形状应等于 `[batch_size, height, width, channels]`。如果你将 `data_format` 设置为 `channels_first`，则\
  \ `inputs` 张量的形状应等于 `[batch_size, channels, height, width]`。\n\n`filters` 参数标识卷积层所使用的滤波器数量。`kernel_size`\
  \ 参数标识每个滤波器的大小。如果你将此参数设置为单个值 `N`，则每个滤波器的大小将为 `NxN`。如果你将其设置为两个值，例如 `[M, N]`，则每个滤波器的大小将为\
  \ `MxN`。\n\n早前的“设置卷积参数”章节讨论了图像滤波器的步长（stride）和空洞（dilation）特性。在 `tf.layers.conv2d`\
  \ 中，你可以通过 `strides` 和 `dilation_rate` 参数设置这些属性。\n\n`padding` 参数告诉层如何处理图像的边界像素。如果你将\
  \ `padding` 设置为 `valid`，该层将忽略边界像素并返回比输入图像小的输出图像。如果你将 `padding` 设置为 `same`，该层将对输入图像进行零填充，并产生与输入图像大小相同的输出图像。\n\
  \n`tf.layers.conv2d` 返回一个张量，其形状取决于输入图像的形状、滤波数量以及 `padding` 参数。例如，如果输入的形状为 `[N, height,\
  \ width, num_channels]` 且 `padding` 设置为 `same`，则输出的形状将为 `[N, height, width, num_filters]`。\n\
  \n通道数不影响输出的形状。在执行卷积时，`tf.layers.conv2d` 会将通道合并，因此灰度输入图像和 RGB 输入图像将产生相同大小的输出图像。如果你想针对特定通道进行过滤，应该使用的函数是\
  \ `tf.nn.depthwise_conv2d`。\n\n如果应用程序将 `padding` 设置为 `valid`，每个输出图像都将比输入图像小。尺寸的缩小取决于卷积滤波器的维度。例如，如果\
  \ `padding` 为 `valid`，滤波器大小为 `[X, Y]`，且输入的形状为 `[N, height, width, num_channels]`，则每个输出图像的形状将为\
  \ `[N, height – (Y – 1), width – (X – 1), num_filters]`。\n\n### 创建池化层\n\n卷积层为每个滤波器生成一个输出图像，因此具有许多滤波器的\
  \ CNN 将产生许多图像。这些图像需要大量的内存，因此开发者通过在卷积层后跟随池化层来缩小图像尺寸。\n\n池化层将图像的像素划分为矩形块，并将每个块替换为单个像素。图\
  \ 8-5 显示了该过程的工作原理。池化操作将一个 9x8 的矩阵划分为 3x2 的块，并将每个块替换为单个值。\n\n![图 8-5：池化层接收输入图像，将其划分为块，对每个块进行操作，并返回一个压缩后的图像。](img/9781119466215-fg0805.png)\n\
  \n图 8-5： 池化层接收输入图像，将其划分为块，对每个块进行操作，并返回一个压缩后的图像。\n\n图 8-5 描述了两种池化方法。第一种找到输入块中的最大值并将该值存储在输出图像中。你可以通过调用\
  \ `tf.layers.max_pooling2d` 创建执行此操作的池化层。\n\n第二种池化方法计算输入块中像素的平均值并将该值存储在输出图像中。你可以通过调用\
  \ `tf.layers.avg_pooling2d` 创建使用此方法的池化层。\n\n在 `tf.layers` 包提供的池化函数中，`max_pooling2d`\
  \ 是最流行的。这种流行是有意义的，因为高最大值清楚地表明图像中存在滤波特征。表 8-2 列出了 `max_pooling2d` 的参数并提供了对每个参数的描述。\n\
  \n| 参数 | 默认值 | 描述 |\n| --- | --- | --- |\n| `inputs` | `--` | 输入 4D 张量 |\n| `pool_size`\
  \ | `--` | 用于池化的块的大小 |\n| `strides` | `--` | 从一次池化操作到下一次操作的偏移 |\n| `padding` | `'valid'`\
  \ | 算法：`valid` 或 `same` |\n| `data_format` | `'channels_last'` | 指定的输入形状 |\n| `name`\
  \ | `None` | 为层提供名称 |\n\n\n\n\n\nCIFAR-10 和 CIFAR-100 数据集的主页为 [`www.cs.toronto.edu/~kriz/cifar.html`](http://www.cs.toronto.edu/~kriz/cifar.html)。该网站提供了三个下载\
  \ CIFAR-10 数据集的链接：一个用于 Python 版本，一个用于 Matlab 版本，还有一个二进制版本（binary）。本节侧重于 Python 版本，我建议您将其下载到您的开发系统中。\n\
  \n在继续之前，我建议您将压缩包下载并解压到 `ch8` 目录中。在解压后的目录中，您将找到一个名为 `cifar-10-batches-py` 的文件夹。该文件夹包含\
  \ 5 个包含训练图像的文件（`data_batch_1` 到 `data_batch_5`）以及一个包含测试图像的文件（`test_batch`）。\n\n\
  ## 访问 CIFAR-10 图像和标签\n\nCIFAR 使用一种名为 *pickling*（序列化/ 尔克化）的过程对 CIFAR-10 文件中的数据进行序列化。要在\
  \ Python 中读取这些数据，应用程序需要导入 `pickle` 并调用其 `load` 方法来处理 CIFAR 文件。例如，以下代码访问了 `data_batch_2`\
  \ 中的数据：\n\n```python\nimport pickle\nwith open('cifar-10-batches-py/data_batch_2',\
  \ 'rb') as imgfile:\n    dict = pickle.load(imgfile)\n    imgfile.close()\n```\n\
  \n结果是一个包含四个键的字典：\n\n*   `b'batch_label'`: 批次的描述（`b' training batch 2 of 5'`）\n*\
  \   `b'labels'`: 批次图像的 10,000 个标签的列表\n*   `b'data'`: 包含批次图像数据的 ndarray（n 维数组）\n\
  *   `b'filenames'`: 包含图像数据的 10,000 个 PNG 文件的列表（`b'stealth_fighter_s_001650.png'`）\n\
  \n每个图像标签以 0 到 9 之间的整数形式提供。这些值对应于识别相应图像内容的十个类别。这些类别分别是：飞机 (0)、汽车 (1)、鸟 (2)、猫 (3)、鹿\
  \ (4)、狗 (5)、青蛙 (6)、马 (7)、船 (8) 和卡车 (9)。例如，图 8-6 显示了类别 7 图像的样貌。\n\n![图 8-6：每个 CIFAR-10\
  \ 图像包含 1,024 个像素 (32 x 32)。每个像素以 8 位无符号整数存储红、绿、蓝分量。](img/9781119466215-fg0806.png)\n\
  \n图 8-6： 每个 CIFAR-10 图像包含 1,024 个像素 (32 x 32)。每个像素以 8 位无符号整数存储红、绿、蓝分量。\n\n由 `data`\
  \ 键提供的 ndarray 在一个 10,000x3,072 元素的矩阵中包含 8 位无符号整数。该矩阵包含 10,000 行，每行包含一个 32x32 的图像，其中包含红、绿、蓝分量（32\
  \ x 32 x 3 = 3,072）。\n\n## 在代码中分类 CIFAR 图像\n\n`ch8/cifar_cnn.py` 中的代码演示了如何使用 TensorFlow\
  \ 加载 CIFAR-10 图像并使用卷积神经网络对其进行分类。代码列表 8-1 展示了模块的代码。\n\n### 代码列表 8-1：分类 CIFAR-10 图像\n\
  \n```python\n### 设置参数\nimage_size = 32\nnum_channels = 3\nnum_categories = 10\n\
  num_filters = 32\nfilter_size = 5\nnum_epochs = 200\nbatch_size = 10\nnum_batches\
  \ = int(50000/batch_size)\nkeep_prob = 0.6\n\n# 读取 CIFAR 训练数据\ntrain_data = None\n\
  train_labels = None\nfor file_index in range(5):\n    train_file = open('cifar-10-batches-py/data_batch_'\
  \ + str(file_index+1), 'rb')\n    train_dict = pickle.load(train_file, encoding='latin1')\n\
  \    train_file.close()\n\n    if train_data is None:\n        train_data = np.array(train_dict['data'],\
  \ float)/255.0\n        train_labels = train_dict['labels']\n    else:\n       \
  \ train_data = np.concatenate((train_data, train_dict['data']))\n        train_labels\
  \ = np.concatenate((train_labels, train_dict['labels']))\n\n# 预处理训练数据和标签\ntrain_data\
  \ = train_data.reshape([-1, num_channels, image_size])\ntrain_data = train_data.transpose([0,\
  \ 2, 1])\ntrain_labels = np.eye(num_categories)\n```\n\n\n\n\n这是一本关于 TensorFlow\
  \ 的书，因此应用程序使用 `NumPy` 而不是 TensorFlow 来预处理数据可能看起来很奇怪。但有一个重要的原因：`Sessions` 在训练期间无法将张量馈入占位符。另一个原因是\
  \ TensorFlow 在图中存储张量操作，但不存储 `NumPy` 操作。\n\n为了处理图像数据，应用程序创建了四个卷积层和三个池化层。每个卷积层使用 32\
  \ 个大小为 5 x 5 的过滤器，每个使用 `ReLU` 作为激活函数。池化层将其块大小设置为 2 x 2，步长设置为 2。\n\n要理解代码，关键在于理解输入张量的大小是如何变化的。每批包含十张图像，因此每个输入张量的初始大小为\
  \ `[10, 32, 32, 3]`。\n\n*   第一个卷积层有 32 个过滤器，因此输出张量的形状为 `[10, 32, 32, 32]`。\n*  \
  \ 第一个池化层将每个图像维度缩小一半，因此输出张量的形状为 `[10, 16, 16, 32]`。\n*   第二个卷积层有 32 个过滤器，因此输出张量的形状为\
  \ `[10, 16, 16, 32]`。\n*   第二个池化层将每个图像维度缩小一半，因此输出张量的形状为 `[10, 8, 8, 32]`。\n*   第三个卷积层有\
  \ 32 个过滤器，因此输出张量的形状为 `[10, 8, 8, 32]`。\n*   第三个池化层将每个图像维度缩小一半，因此输出张量的形状为 `[10, 4,\
  \ 4, 32]`。\n*   第四个卷积层有 32 个过滤器，因此输出张量的形状为 `[10, 4, 4, 32]`。\n\n当卷积完成后，模块将图像数据展平并将其传递给两个全连接层。第一个全连接层有\
  \ 512 个节点，并使用 `ReLU` 作为其激活函数。第二个全连接层有十个节点。\n\n## 执行图像操作\n\nTensorFlow 提供了许多执行通用图像处理的函数。为了展示这些函数，我将它们分为五类：\n\
  \n*   图像转换\n*   颜色处理\n*   旋转和镜像\n*   缩放和裁剪\n*   卷积\n\n后续章节将介绍这些函数并演示它们的用法。示例应用程序显示了如何为图像生成摘要数据并使用\
  \ `TensorBoard` 进行可视化。\n\n### 转换图像\n\n`tf.image` 包提供了在不同文件格式、颜色配置和数据类型之间转换图像的函数。表\
  \ 8-3 列出了这些函数并提供了对每个函数的描述。\n\n表 8-3 图像转换函数\n\n| **函数** | **描述** |\n| --- | --- |\n\
  | `decode_bmp(contents, channels=None, name=None)` | 将 BMP 格式的图像数据转换为张量 |\n| `decode_gif(contents,\
  \ name=None)` | 将 GIF 格式的图像数据转换为张量 |\n| `decode_png(contents, channels=None, dtype=None,\
  \ name=None)` | 将 PNG 格式的图像数据转换为张量 |\n| `decode_jpeg(contents, channels=None, ratio=None,\
  \ fancy_upscaling=None, try_recover_truncated=None, acceptable_fraction=None, dct_method=None,\
  \ name=None)` | 将 JPEG 格式的图像数据转换为张量 |\n| `decode_image(contents, channels=None,\
  \ name=None)` | 检测图像数据的格式并将数据转换为张量 |\n| `encode_png(image, compression=None, name=None)`\
  \ | 将包含图像数据的张量转换为 PNG 编码 |\n| `encode_jpeg(image, format=None, quality=None, progressive=None,\
  \ optimize_size=None, chroma_downsampling=None, density_unit=None, x_density=None,\
  \ y_density=None, xmp_metadata=None, name=None)` | 将包含图像数据的张量转换为 JPEG 编码 |\n| `rgb_to_grayscale(images,\
  \ name=None)` | 将一个或多个图像从 RGB 转换为灰度 |\n| `rgb_to_hsv(images, name=None)` | 将一个或多个图像从\
  \ RGB 转换为 HSV |\n| `grayscale_to_rgb(images, name=None)` | 将一个或多个图像从灰度转换为 RGB |\n\
  | `hsv_to_rgb(images, name=None)` | 将一个或多个图像从 HSV 转换为 RGB |\n| `convert_image_dtype(image,\
  \ dtype, saturate=False, name=None)` | 更改图像张量元素的数据类型 |\n\n图像张量的形状取决于图像的性质。对于简单的\
  \ 2-D 图像（例如 JPEG 中的图像），张量的形状为 `[height, width, num_channels]`。对于帧序列（例如 GIF 动画中的图像），形状为\
  \ `[frames, height, width, num_channels]`。\n\n在 表 8-3 中，`decode_*` 函数将数据转换为张量。`encode_*`\
  \ 函数反相反。图像张量的形状取决于图像的性质。对于简单的 2-D 图像（例如 JPEG 中的图像），张量的形状为 `[height, width, num_channels]`。对于帧序列（例如\
  \ GIF 动画中的图像），形状为 `[frames, height, width, num_channels]`。\n\n在 表 8-3 中，`decode_*`\
  \ 函数将数据转换为张量。`encode_*` 函数反相反。图像张量的形状取决于图像的性质。对于简单的 2-D 图像（例如 JPEG 中的图像），张量的形状为\
  \ `[height, width, num_channels]`。对于帧序列（例如 GIF 动画中的图像），形状为 `[frames, height, width,\
  \ num_channels]`。\n\n*(注：原文中存在大量重复段落，已根据“不重复输出原文”的要求进行处理)*\n\n\n\n\n| `random_contrast(image,\
  \ lower, upper, seed=None)` | 通过随机值调整对比度 |\n| `random_hue(image, max_delta, seed=None)`\
  \ | 通过随机数量改变图像的色调 |\n| `random_saturation(image, lower, upper, seed=None)` | 通过随机值更新图像的饱和度\
  \ |\n\n这些函数易于理解。`adjust_xyz` 函数通过特定数量更新图像的属性。`random_xyz` 函数则通过随机数量更新图像的属性。\n\n\
  `adjust_contrast` 和 `random_contrast` 改变图像像素与平均值之间的偏差。具体来说，如果一个像素分量等于 `x` 且平均值为\
  \ `x[avg]`，则调用因子为 `k` 的 `adjust_contrast` 将以以下方式更新 `x`：\n\n![images](img/eq08006.png)<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:mi>x</m:mi><m:mo>=</m:mo><m:mi>k</m:mi><m:mrow><m:mo>(m:mo><m:mrow><m:mi>x</m:mi><m:mo>&#45;</m:mo><m:msub><m:mi>x</m:mi><m:mrow><m:mi>a</m:mi><m:mi>v</m:mi><m:mi>g</m:mi></m:mrow></m:msub></m:mrow><m:mo)</m:mo></m:mrow><m:mo>+</m:mo><m:msub><m:mi>x</m:mi><m:mrow><m:mi>a</m:mi><m:mi>v</m:mi><m:mi>g</m:mi></m:mrow></m:msub></m:mrow></m:math>\n\
  \n`random_xyz` 函数接受一个或两个随机值边界。例如，以下代码通过介于 0.1 到 0.2 之间的随机因子改变 `img` 的对比度：\n\n```python\n\
  tf.image.random_contrast(img, 0.1, 0.2)\n```\n\n`adjust_hue` 和 `random_hue` 用于于\
  \ RGB 图像。这两个函数都会将图像像素转换为浮点值，然后将图像转换为 HSV。然后它们在色调通道上添加偏移量，并将图像转换回 RGB 以及像素的原始数据类型。\n\
  \n### 旋转与镜像\n\n`tf.image` 包还提供了用于旋转和镜像（翻转）图像像素的函数。表 8-5 列出了其中的六种函数，并提供了每种函数的描述。\n\
  \n#### 表 8-5：旋转与镜像函数\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `rot90(image, k=1, name=None)`\
  \ | 时针旋转图像 90 度的倍数 |\n| `flip_left_right(image)` | 水平镜像图像 |\n| `random_flip_left_right(image,\
  \ seed=None)` | 有一半的时间内水平镜像图像 |\n| `flip_up_down(image)` | 垂直镜像图像 |\n| `random_flip_up_down(image,\
  \ seed=None)` | 有一半的时间内垂直镜像图像 |\n| `transpose_image(image)` | 沿主对角线镜像图像 |\n\n`rot90`\
  \ 逆时针旋转图像 90 度的倍数。精确旋转角度等于 `90(k mod 4)`，其中 `k` 是 `rot90` 的第二个参数。\n\n了解 `transpose_image`\
  \ 与垂直或水平翻转图像函数之间的区别很重要。`transpose_image` 沿从左上到右下的对角线翻转图像。\n\n以下代码展示了应用程序如何解码 PNG\
  \ 数据然后旋转、翻转和转置图像。\n\n```python\nimg_tensor = tf.image.decode_png(smiley)\n\n# 逆时针旋转\
  \ 270 度\nrot_tensor = tf.image.rot90(img_tensor, 3)\nrot_png = tf.image.encode_png(rot_tensor)\n\
  \n## 水平翻转\nflip_tensor = tf.image.flip_left_right(img_tensor)\nflip_png = tf.image.encode_png(flip_tensor)\n\
  \n# 转置\ntranspose_tensor = tf.image.transpose_image(img_tensor)\ntranspose_png =\
  \ tf.image.encode_png(transpose_tensor)\n```\n\n图 8-7 展示了示例中执行操作的结果。\n\n![图 8-7：TensorFlow\
  \ 的函数使得旋转、翻转和转置成为可能](img/9781119466215-fg0807)\n\n图 8-7 TensorFlow 的函数使得旋转、翻转和转置成为可能。`random_flip_left_right`\
  \ 和 `random_flip_up_down` 在你需要识别可能翻转的图像时非常有用，它们在一半的时间内翻转图像。\n\n### 缩放与裁剪\n\n应用程序经常需要放大、缩小或裁剪图像。`tf.image`\
  \ 的表 8-6 列出了执行这些操作的函数。\n\n#### 表 8-6：缩放函数\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `resize_nearest_neighbor(image,\
  \ size)` | 使用最近邻插值调整 |\n| `resize_bilinear(image, size, ...)` | 使用双线性插值调整 |\n| `resize_bicubic(image,\
  \ size, ...)` | 使用三次立方插值调整 |\n| `resize_area(image, size, ...)` | 使用面积插值调整 |\n|\
  \ `resize(image, size, method)` | 使用指定的方法调整 |\n| `central_crop(image, fraction)`\
  \ | 居中裁剪 |\n| `crop_and_pad(image, height, width)` | 裁剪并填充 |\n\n插值（interpolation）一词指的是在已知数据范围内插入新的数据点。表\
  \ 8-6](#13_9781119466215-ch08.xhtml#tbl006) 中的前四个函数使用了不同的插值方法。\n\n`resize_nearest_neighbor`\
  \ 函数通过确定最近的像素来调整图像。如果你调用此函数放大图像，结果将包含原始像素的 `n` 倍。`resize_bilinear` 函数通过周围像素的线性组合来调整图像。它提供了良好的效果，因此是\
  \ TensorFlow 和许多显卡使用的默认插值方法。\n\n为了理解双线性插值，观察一维插值（即线性插值）是有帮助的。假设 `P` 是 `A` 和 `B`\
  \ 之间的一点。`P` 到 `A` 的距离为 `t`，`P` 到 `B` 的距离为 `1 - t`。线性插值通过以下方程设置 `P` 的颜色：\n\n![images](img/eq0807.png)<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:msub><m:mi>P</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>=</m:mo><m:mi>t</m:mi><m:msub><m:mi>A</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>+</m:mo><m:mrow><m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:mi>t</m:mi></m:mrow><m:mo)</m:mo></m:mrow><m:msub><m:mi>B</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub></m:mrow></m:math>\n\
  \n\n\n\n当 `t` 等于 1 时，`P` 的颜色等于 `A` 的颜色。当 `t` 等于 0 时，`P` 的颜色等于 `B` 的颜色。如果 `t` = 0.5，得到的颜色将等于\
  \ `A` 和 `B` 颜色的平均值。插值点形成直线，图 8-8 描述了在四个点之间进行插值的线条。\n\n![图 8-8: 线性插值通过计算现有点的线性组合找到内部点。](img/9781119466215-fg0808.png)\n\
  \n图 8-8： 线性插值通过计算现有点的线性组合找到内部点。\n\n双线性插值与线性插值相似，但它计算位于四个像素之间的二维点的值。例如，假设 `P` 被四个像素：`A`、`B`、`C`\
  \ 和 `D` 包围。确定 `P` 需要两个插值参数：`t[1]` 和 `t[2]`。图 8-9 描述了一个点 `P`、其周围的四个像素以及两个插值参数。\n\n\
  ![图 8-9: 双线性插值使用两个插值参数相对于四个周围点定位一个点。](img/9781119466215-fg0809.png)\n\n图 8-9： 双线性插值使用两个插值参数相对于四个周围点定位一个点。\n\
  \n双线性插值通过通过插值参数对周围像素的颜色来确定内部点的颜色。以下方程显示了双线性插值如何计算被 `A`、`B`、`C` 和 `D` 包围的点 `P` 的颜色：\n\
  \n![images](img/eq08008.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:msub><m:mi>P</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>=</m:mo><m:msub><m:mi>t</m:mi><m:mn>1</m:mn></m:msub><m:msub><m:mi>t</m:mi><m:mn>2</m:mn></m:msub><m:msub><m:mi>A</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>+</m:mo><m:mrow><m:mo>(</m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:msub><m:mi>t</m:mi><m:mn>1</m:mn></m:msub></m:mrow><m:mo)</m:mo></m:mrow><m:msub><m:mi>t</m:mi><m:mn>2</m:mn></m:msub><m:msub><m:mi>B</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>+</m:mo><m:msub><m:mi>t</m:mi><m:mn>1</m:mn></m:msub><m:mrow><m:mo>(</m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:msub><m:mi>t</m:mi><m:mn>2</m:mn></m:msub></m:mrow><m:mo)</m:mo></m:mrow><m:msub><m:mi>C</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>+</m:mo><m:mrow><m:mo>(</m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:msub><m:mi>t</m:mi><m:mn>1</m:mn></m:msub></m:mrow><m:mo)</m:mo></m:mrow><m:msub><m:mi>t</m:mi><m:mn>2</m:mn></m:msub></m:mrow><m:mo><m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:msub><m:mi>t</m:mi><m:mn>2</m:mn></m:msub></m:mrow><m:mo)</m:mo></m:mrow><m:msub><m:mi>D</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo><m:mo><m:mi><m:mi>m:m:mimm::mi:::mi</m:mi:m:mi:mi</m:mi:m:mi:r</m:mi></m:mrow></m:msub></m:math>\n\
  \n`resize_bicubic` 使用双三次值调整图像大小。双三次插值与双线性插值相似，但它不是寻找四个像素的线性组合，而是通过评估涉及 16 点的三次多项式来确定内部点的颜色。双三次插值产生的图像更平滑，但需要更多处理。`central_crop`\
  \ 通过缩放原始图像尺寸来确定裁剪图像的尺寸。例如，如果你将 `fraction` 参数设置为 25，裁剪的宽度将是原始宽度的四分之一，裁剪的高度将是原始高度的四分之一。`resize_image_with_crop_or_pad`\
  \ 在不插值的情况下调整。。如果尺寸小于图像，函数将从中心裁剪图像以符合指定的尺寸。如果指定的尺寸大于图像，函数将对图像进行填充。`crop_and_resize`\
  \ 可以执行多次裁剪操作。`boxes` 的每行识别要裁剪的图像部分，`box_ind` 的每个元素设置输出中裁剪图像的索引。函数使用双线性插值将每个裁剪图像调整为\
  \ `crop_size`。\n\n## 卷积\n\n除了创建卷积层外，TensorFlow 应用程序可以通过调用 `tf.nn.conv2d` 执行简单卷积：\n\
  \n```\ntf.nn.conv2d(input, filter, padding, use_cudnn_on_gpu=None, data_format='NHWC',\
  \ name=None)\n```\n\n`input` 的格式取决于 `data_format` 参数。也就是说，如果应用程序 `data_format` 设置为\
  \ `NHWC`，输入张量的形状应该是 `[batch, height, width, channels]`。如果 `data_format` 设置为 `NCHW`，张量的形状应该是\
  \ `[batch, channels, height, width]`。\n\n要执行卷积，你应该将 `filter` 分配与 `input` 相同的张量。在执行二维点积时，函数根据\
  \ `strides` 张量偏移滤波器。你必须将 `strides` 设置为具有四个元素的一维张量。要在每个方向上偏移 1，请将 `strides` 设置为 `[1,\
  \ 1, 1, 1]`。\n\n如果二维点积涉及图像边界或附近的像素，计算将取决于 `padding` 参数。如果你将 `padding` 设置为 `VALID`，卷积将不计算涉及像素的点积。如果你将\
  \ `padding` 设置为 `SAME`，函数将在执行卷积前对图像进行填充。\n\n![提示](img/tip.png)\n\n`tf.layers.conv2d`\
  \ 和 `tf.nn.conv2d` 名称相似，但用途不同。`tf.layers.conv2d` 在 CNN 中创建卷积层，而 `tf.nn.conv2d` 执行单次卷积操作。不要混淆两者。\n\
  \n![技术细节](img/technicalstuff.png) 除了 `conv2d`，`tf.nn` 包还提供名为 `conv2d_transpose`\
  \ 的函数。该函数执行常规卷积，但返回结果图像的转置。\n\n## 理论实践\n\n`ch8/img_proc.py` 模块中的代码演示了应用程序如何通过对元素等于\
  \ 1/9 的 3x3 滤波器进行卷积来去除图像中的噪声。除了卷积外，该模块还执行了四个操作：\n\n* 调用 `tf.image.adjust_contrast`\
  \ 改变图像的对比度\n* 调用 `tf.image.flip_left_right` 水镜像图像\n* 将转换为 PNG 格式并写入 PNG 文件\n* 生成用于在\
  \ TensorBoard 中查看图像的摘要数据\n\n`ch8/img_proc.py` 模块从 `input_aircraft.png` 读取数据并将结果写入\
  \ `output_aircraft.png`。[图 8-10] 描述了输入图像和输出图像。\n\n![图 8-10: TensorFlow 的图像处理程序可以方便修改图像的格式、取向和颜色。](img/9781119466215-fg0810.png)\n\
  \n图 8-10： TensorFlow 的图像处理程序可以方便修改图像的格式、取向和颜色。\n\n列表 8-2 展示了使用 TensorFlow 实现模块操作的代码。\n\
  \n\n\n\n```python\nimg_tensor = tf.image.convert_image_dtype(img_tensor, tf.float32)\n\
  ```\n\n## 使用均值滤波去噪\n\n```python\nconv_filter = np.zeros([3, 3, 1, 1])\nconv_filter[0,\
  \ 0, :, :] = 0.1111\nconv_filter[0, 1, :, :] = 0.1111\nconv_filter[0, 2, :, :] =\
  \ 0.1111\nconv_filter[1, 0, :, :] = 0.1111\nconv_filter[1, 1, :, :] = 0.1111\nconv_filter[1,\
  \ 2, :, :] = 0.1111\nconv_filter[2, 0, :, :] = 0.1111\nconv_filter[2, 1, :, :] =\
  \ 0.1111\nconv_filter[2, 2, :, :] = 0.1111\nimg_tensor = tf.nn.conv2d(img_tensor,\
  \ conv_filter, [1, 1, 1, 1], 'SAME')\n```\n\n# 增加对比度\n\n```python\nimg_tensor =\
  \ tf.reshape(img_tensor, [232, 706, 1])\nimg_tensor = tf.image.adjust_contrast(img_tensor,\
  \ 0.8)\n```\n\n## 水平翻转\n\n```python\nimg_tensor = tf.image.flip_left_right(img_tensor)\n\
  ```\n\n# 创建摘要数据和 FileWriter\n\n```python\nimg_tensor = tf.reshape(img_tensor, [1,\
  \ 232, 706, 1])\nimg_tensor = tf.image.convert_image_dtype(img_tensor, tf.uint8)\n\
  summary_op = tf.summary.image('Output', img_tensor)\nfile_writer = tf.summary.FileWriter('log')\n\
  ```\n\n# 将结果存储为 PNG\n\n```python\nimg_tensor = tf.reshape(img_tensor, [232, 706,\
  \ 1])\nimg_tensor = tf.image.encode_png(img_tensor)\nwith tf.Session() as sess:\n\
  coord = tf.train.Coordinator()\nthreads = tf.train.start_queue_runners(coord=coord)\n\
  \n## 执行会\noutput_data, summary = sess.run([img_tensor, summary_op])\n\n# 将输出 PNG\
  \ 数据写入文件\noutput_file = open('output_aircraft.png', 'wb+')\noutput_file.write(output_data)\n\
  output_file.close()\n\n## 打印摘要数据\nfile_writer.add_summary(summary)\nfile_writer.flush()\n\
  \n# 等待线程终止\ncoord.request_stop()\ncoord.join(threads)\n```\n\n在查看这段代码时，跟踪图像的形状和数据类型非常重要。在应用程序解码输入图像后，张量的形状为\
  \ `[232, 706, 1]`，其元素是 8 位整数。但在执行卷积操作之前，应用程序将张量的形状转换为 `[1, 232, 706, 1]`，并将元素转换为\
  \ 32 位浮点值。\n\n在更新图像的对比度之前，应用程序将图像的形状转换回 `[232, 706, 1]`。随后，该模块将图像的形状转换为 `[1, 232,\
  \ 706, 1]` 并将其类型转换为 `tf.uint8`，以便模块能够生成摘要数据。最后，应用程序将张量的形状转换为 `[232, 706, 1]`，以便将其将数据编码为\
  \ PNG 格式。\n\n为图像生成摘要数据的过程与为张量生成数据相似。唯一的区别是应用程序需要调用 `tf.summary.image` 而不是 `tf.summary.scalar`\
  \ 或 `tf.summary.histogram`。函数的签名如下：\n\n```python\ntf.summary.image(name, tensor,\
  \ max_outputs=3, collections=None)\n```\n\n`name` 参数提供了 TensorFlow 将与图像关联的标签。函数通过\
  \ `tensor` 参数接收图像数据，且张量的形状必须是 `[batch_size, height, width, num_channels]`。\n\n例如，`ch8/img_proc.py`\
  \ 模块通过以下代码创建了一个为 `img_tensor` 生成摘要数据的操作：\n\n```python\nsummary_op = tf.summary.image('Output',\
  \ img_tensor)\n```\n\n创建此操作后，应用程序会在会话中执行它，并使用 `FileWriter` 将协议缓冲区打印到事件文件中。启动 TensorBoard\
  \ 时，它将读取此事件文件并显示 `img_tensor` 的图形内容。\n\n# 第 9 章 使用循环神经网络 (RNNs) 分析序列数据\n\n本章内容\n\
  \n![使用循环神经网络 (RNNs) 分析序列数据](img/check.png)\n![使用长短期记忆 (LSTM) 提高性能](img/check.png)\n\
  ![使用门控循环单元 (GRU) 进一步提高性能](img/check.png)\n\n## 循环神经网络\n\n假设你想让神经网络预测短语“My hovercraft\
  \ is full of....”中的下一个单词。正如任何蒙提·派森的粉丝（或随意的网络搜索）所告诉你的，显而易见的答案是“eels（鳗鱼）”。但你如何训练神经网络得出这个答案呢？\n\
  \n你可以将互联网上写过的每一个句子输入网络，但仍然存在一个问题。为了做出预测，神经网络需要识别出单词形成了一个*有序序列*。也就是说，网络需要理解短语“My\
  \ hovercraft is full of”与“full is My hovercraft”是不同的短语。\n\n本书第 1 到第 8 章讨论的所有神经网络都不具备识别序列的能力。因此，它们无法利用过去的分析来解决未来的问题。例如，CNN\
  \ 可以分类图像，但它不能根据之前的分类对后续图像进行分类。为了弥补这些缺陷，机器学习研究人员发明了循环神经网络，或 RNNs。\n\n大多数神经网络（如卷积神经网络）按单方向传输数据：从输入层到输出层。由于这个原因，它们被称为*前馈*网络。与前馈网络不同，循环神经网络或\
  \ RNNs 利用了*反馈*。也就是说，它们将数据从网络中的后一个节点发送到较前的节点。\n\n图 9-1 展示了一个简单的 RNN。整体结构类似于普通网络，但输出节点被延迟并反馈到输出节点。这种反馈是\
  \ RNN 与其他神经网络的主要特征。\n\n![图 9-1: 循环神经网络将过去的数据反馈到一个或多个节点。](img/9781119466215-fg091.png)\n\
  \nRNN 的另一个重要特征是它们按*阶段*执行。例如，如果 RNN 需要解析音频或文本，它会对每个单词执行一个阶段。在每个阶段，RNN 都会接收新数据。区分训练步骤和阶段非常重要：\n\
  \n在图 9-1 中，网络的阶段由 `t` 标识。这衡量的不是时钟时间（例如 1.37 秒），而是离散时间，该时间随每个新阶段增加 1。因此，初始输入值表示为\
  \ `xi`，下一组输入表示为 `xi`，以此此类推。\n\nRNN 通过访问延迟值来利用之前的处理阶段。在图 9-1 中，延迟值由 Delay 元素提供。如果当前阶段是\
  \ 4，离开 Delay 元素的值将是 `y(3)`。如果当前阶段是 5，离开该元素的值将是 `y(4)`。\n\n### RNN 和递归函数\n\n为了更好地理解\
  \ RNN 的工作原理，观察它们如何与递归函数非常有帮助。例如，以下函数使用递归计算 N 的阶乘：\n\n```python\ndef factorial(N):\n\
  \  if n == 1:\n    return 1\n  else:\n    return N * factorial(N-1)\n```\n\n递归函数可以使用循环重写，如以下函数所示：\n\
  \n```python\ndef factorial(N):\n  x = 1\n  for i in range(2, N+1):\n    x *= i\n\
  \  return x\n```\n\n\n\n\n\n由于由于需要推送到栈中的所有数据，冗长的递归函数会消耗大量的内存。为了防止栈溢出，Python 将默认的最大递归限制设置为\
  \ 1000。\n\n同样，RNN 的处理需求会随着每个新阶段的出现而增加。就像 Python 设置了最大递归限制一样，每个 RNN 都有一个其可以处理的固定阶段数量。\n\
  \n将递归函数转换为基于循环函数的过程被称为 `unrolling`（展开）。为了更直观地可视化 RNN，你可以通过为每个待处理的阶段插入节点来对其进行展开。例如，假设图\
  \ 9-1 中的 RNN 有三个阶段。图 9-2 显示了 RNN 展开后的样子（为了清晰起见去除了权重）。\n\n![图 9-2: 展开 RNN 能够易于可视化其操作。](img/9781119466215-fg0902.png)\n\
  \n图 9-2： 展开 RNN 能够易于可视化其操作。\n\n如图 9-2 所示，`y(2)` 取决于当前输入（`xi` 的加权和）以及之前阶段的输出。开发者将过去阶段的组合结果称为节点的\
  \ `state`（状态）。\n\n简单来说，RNN 与普通神经网络之间的区别在于，RNN 的一个或多个节点具有状态。如果一个节点具有状态，它就可以将之前阶段的结果应用到当前阶段。这种使用过去结果的能力解释了为什么\
  \ RNN 在处理语言和其他序列化数据时如此受欢迎。\n\n## 训练 RNN\n\n正如本章早些图 9-2 所示，展开 RNN 会导致一个前馈网络，该网络在不同阶段接收其输入（`xi`、`xi`\
  \ 等）。这种行为意味着 RNN 可以像普通的前馈网络一样进行训练。一种流行的训练方法称为随时间反向传播（BPTT），它将反向传播方法应用于 RNN。第 7 章\
  \ 讨论了反向传播的基础理论。\n\n当你设计具有更多处理阶段的 RNN 时，节点数量数量会急剧增长。结果是，RNN 遭受着两个困扰所有复杂神经网络的问题：梯度消失和梯度爆炸。第\
  \ 7 章 解释了这些问题以及它们是如何降低神经网络性能的。\n\n为了弥补 BPTT 的缺陷，研究人员设计了替代训练方法。截断随时间反向传播（TBPTT）使用了有限的阶段。实时循环学习（RTR）并不展开\
  \ RNN，而是通过网络输出和状态相对于权重的偏导数进行训练。\n\n一些研究人员并没有关注新的训练方法，而是发明了完全全新的 RNN 变体。这些变体提供了 RNN\
  \ 的所有优点，但不会受到梯度消失和梯度爆炸的影响。最流行的变体是长短期记忆（`LSTM`）单元和门控循环单元（`GRUs`）。本章将讨论这两种变体以及如何使用它们。\n\
  \n## 创建 RNN 单元\n\n由于原生神经网络由节点组成，RNN 则由 `cells`（单元）组成。在大多数 RNN 文献中，单元是 RNN 的一部分，接收输入并产生单个输出。TensorFlow\
  \ RNN 的单元则并不那么简单。根据文档，TensorFlow RNN 的单元“是任何具有状态并执行某些接收输入矩阵的操作的物体”。换句话说，一个 RNN 单元具有状态，对输入矩阵进行操作，并产生一个输出矩阵。\n\
  \n在 TensorFlow 应用中，构建 RNN 的过程从创建一个单元开始。具体来说，该过程包含三个步骤：\n\n1. 创建一个 RNN 类的实例，并指定每个单元的单元数。每个单元都是\
  \ `tf.nn.rnn_cell.RNNCell` 的子类。\n2. 调用一个函数（例如 `tf.nn.static_rnn`），根据单元创建 RNN。该函数接受输入张量列表并返回\
  \ RNN 的输出和状态。\n3. 使用步骤 2 的输出计算损失。通过在会话中启动优化器来最小化损失。\n\n`RNNCell` 类在本文讨论中起着核心作用。它不能在代码中实例化，但它很重要，因为它是\
  \ TensorFlow RNN 类的基类，这些类包括 `BasicRNNCell`、`LSTMCell` 和 `GRUCell`。图 9-3 展示了继承自 `RNNCell`\
  \ 的七个 TensorFlow 类。\n\n![图 9-3: RNNCell 的每个子类都代表一种单元。](img/9781119466215-fg0902.png)\n\
  \n图 9-3： 展开 RNN 的操作易于可视化。不，RNNCell 的每个子类都代表一种单元。\n\n`RNNCell` 类定义了可以通过其实例访问的属性和方法。表\
  \ 9-1 列出了 `RNNCell` 的属性。\n\n表 9-1 RNNCell 的属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n\
  | state_size | 状态的形状 |\n| output_size | 输出的形状 |\n| graph | 单元中包含的图 |\n| losses |\
  \ 应用于单元的损失 |\n| update | 用于更新权重的张量 |\n| variables | 变量列表 |\n| weights | 权重列表 |\n\
  | scope_name | 包含变量的作用域名称 |\n\nRNN 的状态由一个或多个张量表示。因此，应用程序可以将 `state_size` 分配为整数、`TensorShape`、整数元组或\
  \ `TensorShape` 元组。应用程序必须将 `output_size` 分配为整数或 `TensorShape`。\n\n表 9-1 中的剩余属性是直观的。除了属性外，`RNNCell`\
  \ 类定义了一组方法，其中大多数方法可以自定义单元的行为。表 9-2 列出了四个非常有用的方法，并提供了每个方法的描述。\n\n表 9-2 RNNCell 类的方法\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| add_loss(losses, inputs=None) | 添加损失张量 |\n| add_update(updates,\
  \ inputs=None) | 为单元权重添加更新 |\n| add_variable(name, shape, dtype=None, initializer=None,\
  \ regularizer=None, trainable=true) | 向层添加新变量 |\n| zero_state(batch_size, dtype)\
  \ | 返回用于初始化单元状态的零填充张量 |\n\n## 创建基础 RNN\n\n`RNNCell` 最简单的子类是 `BasicRNNCell`。其构造函数如下：\n\
  \n```\nBasicRNNCell(num_units, activation=tf.nn.tanh, reuse=None)\n```\n\n\n\n\n\
  \n`num_units` 参数设置了单元格中隐藏单元的数量。该参数决定了 RNN 的学习能力。也就是说，随着单元数量的增加，单元状态内存的大小随之增加。遗憾的是，训练时间也会增加。此外，如果你将\
  \ `num_units` 设置得过高，就会面临过拟合的风险。\n\n构造函数的第二个参数设置单元格的激活函数。默认情况下，RNN 单元依赖反正切函数（`tanh`）来产生输出。\n\
  \n最后一个参数 `reuse` 指定应用程序是否可以访问由单元创建的同名变量。\n\n在创建单元实例后，应用程序可以通过调用 `tf.nn` 包中的几个函数之一来构建\
  \ RNN。这些函数中最简单的是 `static_rnn`：\n\n```\nstatic_rnn(cell, inputs, initial_state=None,\
  \ dtype=None, sequence_length=None, scope=None)\n```\n\n应用程序必须将 `inputs` 赋值给输入矩阵列表。对于列表中的每个输入矩阵，函数都会创建一个单元来接收并处理该矩阵。输入矩阵的行数等于应用程序的批大小（batch\
  \ size）。在讨论中，我将此数字称为 `batch_size`。\n\n默认情况下，`static_rnn` 假设 RNN 的序列长度等于输入矩阵的列数。应用程序可以通过将\
  \ `sequence_length` 设置为一个包含 `batch_size` 个值的一维张量来自定义此长度。`sequence_length` 的每个值设置了输入矩阵对应行的序列长度。\n\
  \n顾如其名，`initial_state` 参数初始化 RNN 的状态。应用程序必须为输入矩阵的每一行提供一个状态值，因此，如果单元格的 `state_size`\
  \ 是整数，应用程序必须将 `initial_state` 设置为形状为 `[batch_size, state_size]` 的矩阵。如果 `state_size`\
  \ 是一个元组，应用程序必须将 `initial_state` 设置为形状为 `[batch_size, element_size]` 的张量元组，其中 `element_size`\
  \ 是 `state_size` 中对应元素的大小。\n\n如果应用程序设置了 `initial_state` 参数，`static_rnn` 将使用状态的元素来确定\
  \ RNN 元素的数据类型。如果应用程序没有设置 `initial_state`，则它必须通过 `dtype` 参数指定数据类型。TensorFlow 没有为\
  \ RNN 内容设置默认数据类型。\n\n`static_rnn` 返回一个包含两个元素的元组：RNN 的输出和最终状态。输出包含 `batch_size` 个元素，最终状态的形状由单元格的\
  \ `state_size` 决定。\n\n单元、状态、输入和输出之间的关系可能会令人困惑，因此查看一个基础示例会有帮助。以下代码创建了一个具有五个单元的 `BasicRNNCell`：\n\
  \n```\nnew_cell = tf.nn.rnn_cell.BasicRNNCell(5)\n```\n\n由于 RNN 单元有五个单元，因此单元格输出矩阵中的每一行长度都将为五。\n\
  \n对于这个示例，每个输入矩阵有两个行，每行有四个元素。如果应用程序需要提供三个输入矩阵，可以使用以下代码设置 RNN 的输入：\n\n```\ninputs\
  \ = [tf.constant([[1.,2.,3.,4.], [1.,2.,3.,4.]]), tf.constant([[1.,2.,3.,4.], [1.,2.,3.,4.]]),\
  \ tf.constant([[1.,2.,3.,4.], [1.,2.,3.,4.])]\n```\n\n在创建 `new_cell` 后，应用程序可以使用以下代码创建一个新的\
  \ RNN 并传递输入矩阵列表：`dtype` 参数指定 RNN 的状态和输出应该由浮点值组成：\n\n```\noutput, state = tf.nn.static_rnn(new_cell,\
  \ inputs, dtype=tf.float32)\n```\n\n由于 `inputs` 包含三个输入矩阵，因此新 RNN 的结构包含三个单元。每个单元产生一个与输入矩阵行数相同的输出矩阵。[图\
  \ 9-4] 展示了简单 RNN 的样子。\n\n![图 9-4: TensorFlow 为每个输入矩阵创建一个 RNN 单元。每个单元产生一个输出矩阵。](img/9781119466215-fg0904.png)\n\
  \n[图 9-4:] TensorFlow 为每个输入矩阵创建一个 RNN 单元。每个单元产生一个输出矩阵。\n\n在[图 9-4] 中，`xi` 标识由 `inputs`\
  \ 参数提供的输入矩阵，而 `yi` 标识由 `static_rnn` 返回的输出矩阵。初始状态进入第一个单元，单元将其状态传递给第二个单元，第二个单元将其状态传递给第三个单元，第三个单元在\
  \ `static_rnn` 中返回其状态。\n\n`output` 和 `state` 的精确值并不重要，但查看它们的形状会有帮助。每个 RNN 产生一个输出矩阵列表，列表的大小由列表的大小决定。\n\
  \n\n\n\n\n```python\nfeed_dict={input_holder: input_block, label_holder: label_block}\n\
  num_correct += corr\naccuracy = 100*num_correct/(1000*batch_size)\nif step % 1000\
  \ == 0:\n    print('Step', step, '- Accuracy =', accuracy)\nnum_correct = 0\nstep\
  \ += 1\n```\n\n# 显示计时结果\n```python\nduration = time.time() - start_time\nprint('Time\
  \ to reach 95% accuracy: {:.2f} seconds'.format(duration))\n```\n\n首先，模块将 `lovecraft.txt`\
  \ 的内容读取到字符串中，将字符串拆分为单词，并将每个单词与一个数字关联。单词的数字由其频率决定。也就是说，模块将最常见的单词关联为 0，将次常见的单词关联为\
  \ 1，以此此类推。\n\n在获取与单词对应的数字数组后，模块创建了一个具有 600 个隐藏层的 RNN 单元。它使用 RNN 单元调用 `tf.nn.static_rnn`，该函数提供了\
  \ RNN 的输出值。为了确定损失，模块将 RNN 的输出与权重矩阵相乘，并在积上加上偏置。然后，它创建了一个 `AdagradOptimizer` 来最小化损失。\n\
  \n对于每次训练运行，应用程序构建一个包含十个（`batch_size`）序列的批量，每个序列包含六个（`input_size`）值。因此，RNN 最只能识别连续六个单词之间的依赖。对于每个六值序列，预期的标签是第七个值，它代表要预测的单词。\n\
  \n应用程序并没有执行固定次数的训练。相反，它会持续训练，直到预测准确率超过 95%。每训练一千次，应用程序会打印预测准确率。\n\n### 创建多层单元\n\n\
  应用程序可以通过顺序堆叠单元来提高 RNN 的分析能力。这种堆叠过程将一个单元的输出连接到另一个单元的输入。TensorFlow 应用可以通过创建 `tf.contrib.rnn.MultiRNNCell`\
  \ 类的实例来堆叠 RNN 单元，其构造函数如下：\n\n```python\nMultiRNNCell(cells, state_is_tuple=True)\n\
  ```\n\n要创建一个 `MultiRNNCell`，应用程序需要将第一个参数设置为 `RNNCell` 实例列表。返回的单元将按顺序包含列出的实例。\n\n\
  第二个参数设置单元状态的形式。如果你将 `state_is_tuple` 设置为 `True`，单元将将其状态作为元组提供，该元组包含每个组合单元的元素。如果你将此参数设置为\
  \ `False`，单元将把各个单元的状态合并。\n\n例如，以下代码创建了两个 `BasicRNNCell`，然后创建一个将单元堆叠在一起的 `MultiRNNCell`：\n\
  \n```python\nbrc1 = tf.nn.rnn_cell.BasicRNNCell(3)\nbrc2 = tf.nn.rnn_cell.BasicRNNCell(3)\n\
  multi_cell = tf.nn.rnn_cell.MultiRNNCell([brc1, brc2])\n```\n\n这段代码的结果是 `multi_cell`\
  \ 将 `brc1` 和 `brc2` 堆叠在一起，连接了 `brc1` 的输出。\n\n### 创建动态 RNN\n\n`static_rnn` 函数假设你提前知道输入的长度。`dynamic_rnn`\
  \ 函数通过动态构建图，为你提供了更多的灵活性。`dynamic_rnn` 的签名如下：\n\n```python\ndynamic_rnn(cells, inputs,\
  \ length, state_is_tuple=False, dtype=None, scope=None)\n```\n\n这些参数大部分与 `static_rnn`\
  \ 相同。如果应用程序将 `swap_memory` 设置为 `True`，则必须在 GPU 和 CPU 之间交换数据。`parallel_iterations`\
  \ 控制应并行执行多少操作。\n\n`dynamic_rnn` 的一个主要优势是尺寸。为了处理序列，`dynamic_rnn` 只使用它需要的数据。与 `static_rnn`\
  \ 一样，`dynamic_rnn` 返回输出和状态。以下代码了如何使用 `dynamic_rnn`：\n\n```python\nexample_cell =\
  \ tf.nn.rnn_cell.BasicRNNCell(4)\noutput, state = dynamic_rnn(example_cell, dtype=tf.float32)\n\
  ```\n\n## 长期记忆 (LSTM) 单元\n\n随着 RNN 处理阶段的增加，它们的展开网络变得越来越，更容易受到梯度消失的影响。因为 RNN 有固定数量的阶段，它无法识别元素之间的任何依赖关系。\n\
  \n为了弥补这些缺点，Sepp Hochreiter 和 Jürgen Schmiduber 在他们 1997 年的论文 *Long-Term Memory*\
  \ 中提出了一种改进。本质上，他们提议通过限制 RNN 接受数据的时间来缩小 RNN 的尺寸。具体来说，LSTM 使用了三种限制：\n\n*   限制 RNN\
  \ 接受输入的时间\n*   限制存储在 RNN 状态中的元素\n*   限制 RNN 输出的时间\n\nHochreiter 和 Schmiduber 将他们新类型的单元称为\
  \ *long-term memory*（长期记忆），通常缩短为 *LSTM*。因为有了这些限制，LSTM 只处理它需要的数据。\n\n为了实现这些限制，Hochreiter\
  \ 和 Schmiduber 在 RNN 结构中添加了三个门：输入门、遗忘门和输出门。图 9-5 展示了这些门如何控制 LSTM 单元的连接性。\n\nLM 的一个主要优势是尺寸。为了处理序列，LSTM\
  \ 需要的节点比同类的 RNN 更少。此外，由于 LSTM 可以阻塞无关数据，它的状态可以检查长期依赖关系。\n\n![图 9-5：LSTM 通过防止不必要的数据填充\
  \ RNN 状态来缩小 RNN 的尺寸。](img/978119466215-fg0905.png)\n\n将输入门的状态表示为 `i[t]`，遗忘门的状态表示为\
  \ `f[t]`，输出门的状态表示为 `o[t]`，以下方程显示了这些门的工作原理：\n\n\n\n\n\n![images](img/eq09002.png)<m:math\
