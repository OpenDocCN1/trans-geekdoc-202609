  \ 表 13-3 中列出的区域之一。\n\n`--module-name`、`--package-path` 和 `--job-dir` 标志的作用与本地训练作业中同名的标志相同。`--staging-bucket`\
  \ 标志标识存放部署包的桶。`--region` 标志接受 表 13-3 中列出的区域之一。\n\n### 运行远程预测作业\n\n第五章 介绍了 `SavedModel`，如果你将\
  \ `SavedModel` 上传到 Cloud Storage 存储桶，你可以使用以下命令启动预测作业：\n\n```bash\ngcloud ml-engine\
  \ jobs submit prediction $(JOB_ID)\n```\n\n此命令接受指定预测作业从哪里读取输入以及向哪里写入输出的标志。表 13-9\
  \ 列出了每一个标志。\n\n表 13-9 云端预测作业的标志\n\n| 标志 | 描述 |\n| --- | --- |\n| `--model-dir=MODEL_DIR`\
  \ | 包含保存模型的桶路径 |\n| `--model=MODEL` | 用于预测的模型名称 |\n| `--input-paths=INPUT_PATH,\
  \ [INPUT_PATH,...]` | 用于预测的输入数据路径 |\n| `--data-format=DATA_FORMAT` | 输入数据的格式 |\n\
  | `--output-path=OUTPUT_PATH` | 存储预测结果的路径 |\n| `--region=REGION` | 机器学习作业的区域 |\n\
  | `--batch-size=BATCH_SIZE` | 每批的记录数 |\n| `--max-worker-count=MAX_WORKER_COUNT`\
  \ | 用于并行处理时的最大工作节点数 |\n| `--runtime-version=RUNTIME_VERSION` | 作业使用的 ML Engine 版本\
  \ |\n| `--version=VERSION` | 使用的模型版本 |\n\nML Engine 接受三种格式的预测输入数据。你可以通过将 `--data-format`\
  \ 设置为以下值之一来识别你的数据格式：\n\n*   `text`: 每行一个实例的文本文件\n*   `tf-record`: TFRecord 文件\n\n\
  \n\n\n* `tf-record-gzip`: GZIP 压缩的 TFRecord 文件\n\n最后一个要求的标志是 `--output-path`。它告诉\
  \ ML Engine 哪个 Cloud Storage 桶（bucket）应该包含预测结果。\n\n## 查看作业状态\n\n启动作业后，你有两种方式查看作业状态。首先，你可以使用\
  \ `gcloud` 命令，例如：\n\n* `gcloud ml-engine jobs list`: 列出与默认项目关联的作业及其状态和创建时间\n* `gcloud\
  \ ml-engine jobs describe $(JOB_ID) --summarize`: 以人类可读的格式提供特定作业的详细信息\n\n当我想检查某个作业时，我更倾向于访问\
  \ Google Cloud 控制台。如果你点击左上角的菜单栏并向下滚动，你会看到一个名为 `ML Engine` 的选项。该条目指向两个选项：`Jobs`（作业）和\
  \ `Models`（模型）。\n\n如果你点击 `ML Engine` ⇒ `Jobs` 选项，页面将列出与项目关联的所有作业。如果你点击作业名称，新页面将提供有关作业执行的详细信息，包括其状态和任何日志消息。\n\
  \n## 在云端配置集群\n\n默认情况下，GCP 作业在单个 CPU 上执行。但如果你将 `--scale-tier` 设置为 `custom`，你可以启动一个在处理器集群上执行的作业。你可以通过在\
  \ `--config` 标志后跟随配置名称来配置集群及其处理性质。\n\n你可以使用 YAML（一种非标记语言）或 JSON（JavaScript 对象表示法）来格式化配置文件。如果配置文件中的设置与命令标志冲突，作业将使用文件中的设置。表\
  \ 13-12 列出了配置训练和预测的四个字段。\n\n### 表 13-12 训练/预测配置字段\n\n| 字段 | 类型 | 描述 |\n| --- | ---\
  \ | --- |\n| `trainingInput` | `TrainingInput` | 创建训练作业的输入参数 |\n| `trainingOutput`\
  \ | `TrainingOutput` | 当前训练作业的结果结果 |\n| `predictionInput` | `PredictionInput` |\
  \ 创建预测作业的输入参数 |\n| `predictionOutput` | `PredictionOutput` | 当前预测作业的 own |\n\n配置文件最多提供一个输入对象和一个输出对象。如果你正在启动训练作业，你可能想将\
  \ `trainingInput` 字段设置为 `TrainingInput` 和/或将 `trainingOutput` 字段设置为 `TrainingOutput`。如果你正在启动预测作业，你可能想将\
  \ `predictionInput` 字段设置为 `PredictionInput` 和/或将 `predictionOutput` 字段设置为 `PredictionOutput`。\n\
  \n### 设置训练输入\n\n`TrainingInput` 提供有关你想执行的训练的信息，并配置集群执行训练作业。表 13-13 列出了你可以设置的字段。\n\
  \n### 表 13-13 TrainingInput 字段\n\n| 字段 | 类型 | 描述 |\n| --- | --- | --- |\n| `scaleTier`\
  \ | `ScaleTier` | 作业的执行平台 |\n| `masterType` | `string` | 主节点的机器类型 |\n| `workerType`\
  \ | `string` | 工作节点的机器类型 |\n| `parameterServerType` | `string` | 参数服务器的机器类型 |\n\
  | `workerCount` | `string` | 集群中的工作节点数量 |\n| `parameterServerCount` | `string` |\
  \ 集群中的参数服务器数量 |\n| `packageUris` | `string` | 包及其依赖项的位置 |\n| `pythonModule` | `string`\
  \ | 安装包后运行的模块 |\n| `args` | `[ string ]` | 传递给模块的命令行参数 |\n| `hyperpameters` | `HyperparameterSpec`\
  \ | 指定在训练期间优化的参数 |\n| `region` | `string` | 运行作业的目标区域 |\n| `jobDir` | `string` |\
  \ 包含训练输出的云端存储路径 |\n| `runtimeVersion` | `string` | 用于训练的 Cloud ML Engine 版本 |\n\n\
  `scaleTier` 字段指定了集群期望的执行环境，它接受与 `--scale-tier` 标志相同的值。`masterType`、`serverType`\
  \ 和 `parameterServerType` 字段更加具体，标识了应用于提供给定角色的虚拟机类型。你可以将这些字段中的每一个设置为十个字符串之一：\n\n\
  * `standard`: 适用于中小型数据集的基础配置\n* `large_model`: 适用于大型数据集和许多隐藏层模型的高内存配置\n* `complex_model_s`:\
  \ 比 `standard` 配置提供更多的计算能力\n* `complex_model_m`: 核心数和层数都是两倍\n* `complex_model_l`:\
  \ 核心数和层数都是两倍\n* `standard_gpu`: 适用于中小型数据集的基础配置\n* `large_model_gpu`: 适用于大型数据集和许多隐藏层模型的高内存配置\n\
  * `complex_model_s_gpu`: 比 `standard` 配置提供更多的计算能力\n* `complex_model_m_gpu`: 核心数和层数都是两倍\n\
  * `complex_model_l_gpu`: 核心数和层数都是两倍\n* `standard_p100`: 适用于中小型数据集的基础配置\n* `large_model_p100`:\
  \ 适用于大型数据集和许多隐藏层模型的高内存配置\n* `complex_model_s_p100`: 比 `standard` 配置提供更多的计算能力\n*\
  \ `complex_model_m_p100`: 核心数和层数都是两倍\n* `complex_model_l_p100`: 核心数和层数都是两倍\n\n`scaleTier`\
  \ 字段指定了集群期望的执行环境，它接受与 `--scale-tier` 标志相同的值。`masterType`、`serverType` 和 `parameterServerType`\
  \ 字段更加具体，标识了应用于提供给定角色的虚拟机类型。你可以将这些字段中的每一个设置为十个字符串之一：\n\n（注：提供的文本在此处结束。）\n\n\n\n\n\
  你可以通过将配置文件的 `trainingOutput` 字段设置为 `TrainingOutput` 来配置训练作业的输出方式。表 13-14 列出了可能的字段。\n\
  \nTABLE 13-14 TrainingOutput 字段\n\n| 字段 | 类型 | 说明 |\n| --- | --- | --- |\n| `completedTrialCount`\
  \ | `string` | 成功完成的超参数实验次数 |\n| `trials` | `[ { HyperParameterOutput } ]` | 超参数实验的结果\
  \ |\n| `consumedMlUnits` | `number` | 作业执行期间消耗的机器学习引擎单元数 |\n| `isHyperparameterTuningJob`\
  \ | `boolean` | 作业是否对超参数进行了调优 |\n\n如果你设置了 `TrainingInput` 的 `hyperparameters` 字段，你可以在\
  \ `TrainingOutput` 的 `trials` 字段中访问结果。这是一个 `HyperparameterOutput` 列表，每个 `HyperparameterOutput`\
  \ 具有四个字段：\n\n* `trialId`: 用于标识实验的字符串\n* `hyperparameters`: 将参数名称与训练后的值关联的字典\n* `finalMetric`:\
  \ 标识实验最终目标指标的 `HyperparameterMetric`\n* `allMetrics`: 一个 `HyperparameterMetric`\
  \ 列表，包含该实验记录的所有对象指标\n\n机器学习 (ML) 引擎以 `HyperparameterMetric` 的形式提供训练指标，每个 `HyperparmeterMetric`\
  \ 具有两个字段：`trainingStep` 和 `objectiveValue`。`trainingStep` 字段标识全局训练步骤，`objectiveValue`\
  \ 标识给定步骤下的目标值。\n\n### 设置预测输入\n\n你可以通过将文件的 `predictionInput` 字段设置为 `PredictionInput`\
  \ 来配置预测作业的输入。表 13-15 列出了你可以在 `PredictionInput` 中设置的字段。\n\nTABLE 13-15 PredictionInput\
  \ 字段\n\n| 字段 | 类型 | 说明 |\n| --- | --- | --- |\n| `dataFormat` | `DataFormat` | 数据文件的格式\
  \ |\n| `inputPaths` | `[ string ]` | 包含数据文件的云存储桶 |\n| `outputPath` | `string` |\
  \ 存储输出文件的云存储位置 |\n| `maxWorkerCount` | `string` | 用于并行处理的最大工作数 |\n| `region` | `string`\
  \ | 启动预测作业的区域 |\n| `runtimeVersion` | `string` | 用于训练的 Cloud ML 引擎版本 |\n| `batchSize`\
  \ | `string` | 每批处理的记录数 |\n| `modelName` | `string` | 模型的完整名称 |\n| `versionName`\
  \ | `string` | 用于预测的模型版本 |\n| `uri` | `string` | 模型的云存储位置 |\n\n要执行预测作业，你需要提供一个 `SavedModel`\
  \ 和包含输入数据的文件。你可以通过设置前两个字段 `dataFormat` 和 `inputPaths` 来识别输入数据的格式和位置。要指定数据的格式，你需要将\
  \ `dataFormat` 设置为 `TEXT`、`JSON`、`TF_RECORD`、`TF_RECORD_GZIP` 或 `DATA_FORMAT_UNSPECIFIED`。\n\
  \n后三项组成一个名为 `model_version` 的联合类型，因此在 `PredictionInput` 中只能设置这三个字段之一。你可以通过将 `modelName`\
  \ 设置为以下格式的字符串来标识模型：\n\n`projects/[YOUR_PROJECT]/models/[YOUR_MODEL]`\n\n如果你使用 `versionName`\
  \ 识别模型，则需要提供略不同的字符串：\n\n`projects/[YOUR_PROJECT]/models/YOUR_MODEL/versions/[YOUR_VERSION]`\n\
  \n如果云存储桶只包含一个模型，你可以直接将 `uri` 字段设置为桶的位置。\n\n### 获取预测输出\n\n你可以通过将文件的 `predictionOutput`\
  \ 字段设置为 `PredictionOutput` 来配置预测作业的输出。表 13-16 列出了你可以设置的字段。\n\nTABLE 13-16 PredictionOutput\
  \ 字段\n\n| 字段 | 类型 | 说明 |\n| --- | --- | --- |\n| `outputPath` | `string` | 存储预测输出的云存储位置\
  \ |\n| `predictionCount` | `string` | 生成的预测次数 |\n| `errorCount` | `string` | 生成的预测次数\
  \ |\n\n\n\n\n`Graph` 类提供了许多用于访问图中包含数据的方法。你可以通过 `get_tensor_by_name` 访问特定的张量，或者通过调用\
  \ `get_operations` 访问图中所有的操作。\n\n每个 `Graph` 都将数据存储在系列名为 `collections` 的容器中。每个集合都可以通过特定的键访问，而\
  \ `get_all_collection_keys` 提供了完整的键列表。例如，图会将其全局变量存储在键为 `tf.GraphKeys.GLOBAL_VARIABLES`\
  \ 的集合中。\n\n## Session\n\n在向图中添加张量和操作之后，你可以通过创建并运行会话（session）来执行图的操作。你可以通过调用 `tf.Session`\
  \ 创建会话，然后通过其 `run` 方法启动会话。\n\n`run` 方法的第一个参数告诉会话要执行什么处理。如果该参数包含张量，会话将计算每个张量的元素并\
  \ NumPy 数组的形式返回这些元素。如果该参数包含 `Operation`，会话将执行每个操作并返回适当的结果。\n\n如果 StackOverflow 上的问题能反映现状的话，`run`\
  \ 的 `feed_dict` 困住了许多开发者。该参数接受一个字典，将值与图中的张量（通常是 `placeholders`）关联起来。但字典的值不能是张量。因此，通常在执行会话之前，使用\
  \ NumPy 数组存储和处理输入数据是一个好主意。\n\n## Variable\n\n变量在许多方面与张量相似。它们将值存储在 N 维数组中，并可以使用常规\
  \ TensorFlow 操作进行处理。但在训练操作期间，应用程序依赖变量来存储模型的状态。例如，如果一个应用程序由神经网络组成，那么网络的权重和偏置将作为变量存储。\n\
  \n另一个区别是，变量需要一套与张量不同的方法。例如，在你创建一个 `Variable` 之后，你需要在会话中运行一个特殊操作来初始化它的值。如果你的应用程序有很多变量，你可以通过调用\
  \ `tf.global_variables_initializer` 获取一个组合的初始化操作。\n\n在底层，训练的目标是将应用程序的变量设置为某些值，使模型与观测数据一致。这些变量至关重要，因此建议使用\
  \ `Saver` 将它们存储到检查点（checkpoint）文件中。第 5 章 解释了如何在 TensorFlow 中创建、初始化和保存变量。\n\n## Optimizer\n\
  \n应用程序模型与观测数据之间的差异被称为 `loss`（损失）。TensorFlow 应用程序使用优化器（optimizer）来减少损失。在代码中，你可以通过实例化\
  \ `Optimizer` 类的子类创建一个优化器。每个优化器都有一个 `minimize` 方法，该方法返回一个可以在会话中执行的操作。\n\nTensorFlow\
  \ 支持许多不同的优化算法，每种算法由 `Optimizer` 的不同子类表示。例如，最简单的优化算法——梯度下降法，由 `GradientDescentOptimizer`\
  \ 表示。但最简单的算法很少是最有效的，我建议改用 `AdamOptimizer` 或 `AdagradOptimizer` 来优化你的应用程序。\n\n##\
  \ Estimator\n\n正如第 12 章 中讨论的那样，估计器（estimators）极大地简化了机器学习算法的开发和部署过程。当你使用估计器时，不需要担心会话和图。你只需要知道\
  \ `Estimator` 类的三个方法：`train`、`evaluate` 和 `predict`。\n\n使用估计器的另一个优势是 TensorFlow\
  \ 提供了许多 `Estimator` 的子类。这些现成的估计器（如 `LinearRegressor` 和 `DNNClassifier`）使得训练和测试机器学习变得简单。`DNNLinearCombinedClassifier`\
  \ 特别有用，因为它让你利用宽深学习（wide and deep learning）。\n\n## Dataset\n\nTensorFlow API 最新的更改之一是将\
  \ `tf.contrib.data` 包提升为 `tf.data`。该包提供了至关重要的 `Dataset` 类，TensorFlow 推荐用它加载和处理数据。该类提供了许多用于批处理和转换数据的强大方法，在许多情况下，你可以以多线程方式执行这些操作。\n\
  \n`Dataset` 类也很重要，因为它是 `TextLineDataset` 和 `TFRecordDataset` 的父类。这两个类使得从文本文件和 TFRecord\
  \ 文件读取数据变得简单。提供了四种遍历数据集内容的方法。最简单的是单次迭代器（one-shot iterator），它只能遍历数据集一次。你可以重用可初始化（initializable）和可重初始化（reinitializable）迭代器，但你必须先运行特殊的初始化操作。可喂迭代器（Feedable\
  \ iterators）最复杂，但你可以将它们与多个数据集关联，且不需要在每次迭代之前初始化它们。\n\n## Saver\n\n训练的目标是确定哪些变量能产生最小的损失。训练可能花费几小时或几天，因此在训练期间和之后存储变量的值至关重要。TensorFlow\
  \ 通过提供 `Saver` 类实现了了可能。\n\n使用该类非常简单。在你创建一个 `Saver` 实例后，可以调用 `save` 将模型状态存储在编号的检查点文件中。你可以从检查点文件中加载模型变量。\n\
  \n\n\n\n当你测试机器学习应用或使用它进行实际预测时，你应该确保测试数据在统计学上与训练数据相似。也就是说，测试/预测数据应该与训练数据具有相同的均值和标准差。\n\
  \n正如第 7 章中讨论的那样，设置数据集均值和标准差的过程被称为标准化。许多应用程序通过将均值设置为 0、将标准差设置为 1 来对数据进行标准化。在 TensorFlow\
  \ 应用中，你可以通过调用 `tf.nn.moments` 和 `tf.nn.batch_normalization` 来实现这一点。\n\n## 使用适当的权重初始化\n\
  \n研究人员设计了许多初始化神经网络权重的数学程序。最流行的方法之一被称为 Glorot 方法或 Xavier 方法。你可以通过调用 `tf.contrib.layers.xavier_initializer`\
  \ 在你的应用程序中使用这种方法。\n\n## 从少数层数开始\n\n对于复杂的问题，你可能不知道需要创建多少个隐藏层。有些开发者认为越大越好，并构建了具有许多（超过\
  \ 10 层）隐藏层的神经网络。但这会增加过拟合的概率，导致神经网络过度关注你特定的训练数据，而无法分析通用数据。\n\n为了避免过拟合，从从小开始是一个好主意。如果准确率无法接受，就增加网络的深度直到准确率达到合适的值。除了减少过拟合概率外，“从小开始”方法比“从大开始”方法执行速度更快。\n\
  \n## 添加 Dropout 层\n\n除了全连接层之外，我建议你在神经网络中也添加 Dropout 层。Dropout 层在将信号作为输出之前，将其一定比例的输入设置为\
  \ 0。这通过减少进入 Dropout 层输入之间的依赖性来降低过拟合的概率。\n\n在 TensorFlow 中，你可以通过调用 `tf.nn.dropout`\
  \ 创建 Dropout 层。该层接受一个张量，其值标识了相应输入被丢弃的概率。\n\n## 使用小型随机批量训练\n\n在预处理数据、初始化权重并确定神经网络的初始结构后，你就可以开始训练了。不要一次性使用整个数据集进行训练，你应该将数据分成批次（batches）。神经网络会在处理每个批次时更新其梯度和权重。\n\
  \n减小批量大小会增加训练时间，但也会减少优化器陷入局部最优而非找到全局最优的概率。它还减少了分析对样本顺序的依赖。你可以在训练过程中通过打乱批次进一步减少这种依赖。\n\
  \n## 归一化批量数据\n\n即使对进入神经网络的样本进行了标准化，数据从一个隐藏层移动到下一个隐藏层时，其均值和方差也会发生变化。因此，开发者会在数据离开每一层时对其归一化。\n\
  \n这种归一化涉及将均值设置为零、标准差设置为一。但过程稍微复杂，因为你需要估计整个批的均值和方差。与其自己算数学，我建议调用 `tf.contrib.layers.batch_norm`。\n\
  \n## 尝试不同的优化算法\n\n你对优化器的选择对决定应用程序的准确性和性能起着至关的作用。写这本书期间，我在许多在线论坛上寻找“哪种优化方法最好？”的答案。但尽管经过数十年的分析，研究人员尚未达成共识。\n\
  \n个人个人从 Adam 和 Adagrad 优化器开始，如果你没有得到所需的性能和准确率，尝试其他方法也是好主意。在 TensorFlow 应用中，你通过创建优化器类的实例（例如\
  \ `tf.train.AdamOptimizer`）、调用其 `minimize` 方法并在会话运行返回的操作来设置优化方法。\n\n## 设置正确的学习率\n\
  \n优化器的学习率决定了优化器如何在每个训练步骤中更新其权重。如果你设置的学习率过高，优化器会对权重产生剧烈变化，可能永远无法收敛到解决方案。如果你设置的学习率过低，优化器的进展会缓慢，可能会收敛到局部最优而非全局最优。\n\
  \n典型的学习率从 0.0001 到 0.5 不，但最佳学习率因应用而异。我建议从高值开始，反复降低学习率，直到你对应用程序的准确性和性能感到满意。\n\n##\
  \ 检查权重和梯度\n\n机器学习应用经常失败是因为权重变为零（梯度消失问题）或变得非常大（梯度爆炸问题）。在这两种情况下，你都可能需要调整网络中的层数和/或每层的激活函数。\n\
  \n幸运的是，TensorFlow 允许你保存层的权重并使用 TensorBoard 可视化权重。第 4 章解释了如何使用 TensorBoard 可视化训练结果。\n\
  \n## 关于作者\n\nMatthew Scarpino 当程序员和工程师已有近 20 年。除了开发用于图像识别的神经网络外，他还为美国高级研究计划局（DARPA）设计过模拟人类认的电路。他目前是\
  \ plutocracy.com 的首席开发人员，该网站使用机器学习分析金融趋势。\n\nMatthew 在 2018 年成为 Google 认证数据工程师。在空余时间，他编写机器人并编写关于\
  \ TensorFlow 的博客，[`tfblog.com`](http://tfblog.com)。\n\n## 献辞\n\n本书献给 AI 驱驱 Frank\
