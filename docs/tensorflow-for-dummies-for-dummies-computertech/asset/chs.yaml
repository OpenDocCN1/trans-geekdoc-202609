  ><m:mrow><m:mi>y</m:mi><m:mo>=</m:mo><m:mi>m</m:mi><m:mi>x</m:mi><m:mo>+</m:mo><m:mi>b</m:mi></m:mrow></m:math>其中\
  \ `m` 是直线的斜率，`b` 是`y-截距`（当 `x` 等于 0 时的 `y` 值）。线性回归的目标是确定 `m` 和 `b`，使得生成的直线最好地近似（或拟合）点集。\n\
  \n损失（loss）的计算也很简单。如果图中包含点 (`x, y`)，系统与模型之间的差异为 ![images](img/eq06002.png)<m:math\
