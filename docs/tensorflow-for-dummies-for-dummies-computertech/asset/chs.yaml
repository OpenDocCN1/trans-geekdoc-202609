  \ 函数时，该函数并不会执行其操作。相反，它会将该操作存储在一个名为 `graph`（图）的数据结构中。一个 `graph` 可以包含许多操作，在程序在会话中执行图之前，这些操作都不会被执行。当会话执行图时，它会按顺序执行图的操作。\n\
  \n将操作存储在图中的好处是，可以将图导出到文件中，或在远程系统上启动。缺点是，图往往会让 TensorFlow 的初学者感到困惑。在编写这一章时，我的目标是通过提供对图和会话的完整解释来减少这种困惑。\n\
  \n## 构建图\n\n如果一个操作返回一个张量，那么该操作就可以将其输出馈给另一个操作。为了演示这个过程，以下代码将加法操作的结果输入到乘法操作中。\n\n\
  ```python\nc = tf.add(a, b)\ne = tf.multiply(c, d)\n```\n\n图 4-1 展示了这些嵌套操作与其张量之间的关系。\n\
  \n![图 4-1：加法操作接收了乘法的结果。](img/9781119466215-fg0401.png)\n\n图 4-1： 加法操作接收了乘法的结果。\n\
  \n在图 4-1 中，每个圆圈标识一个张量或操作，每条线传输张量数据。数学家和计算机科学家将这种节点和边的结构称为图。\n\n\n\n\n\n`GraphDef`\
  \ 将图的数据存储在一种名为 `protocol buffer`（也称为 `protobuf`）的特殊格式中。它可以以文本或二进制形式生成，在文本形式下，它看起来类似于\
  \ JavaScript 对象表示法 (JSON)。\n\n在 `GraphDef` 中，每个张量和操作由一个 `node` 元素表示。每个 `node` 都有一个\
  \ `name` 字段、一个 `op` 字段和一个或多个 `attr` 字段。以下文本 own `node` 元素的通用结构：\n\n```\nnode {\n\
  \  name: \"…\"\n  op: \"…\"\n  attr { … }\n  attr { … }\n  …\n}\n```\n\n`GraphDef`\
  \ 的最后一个元素是 `versions` 元素。该元素标识 `GraphDef` 结构的版本。\n\n理解 `GraphDef` 的最佳方法是查看示例。假设应用程序包含以下代码：\n\
  \n```python\na = tf.constant(2.5)\nb = tf.constant(4.2)\nsum = a + b;\n```\n\n在文本形式下，`GraphDef`\
  \ 的内容如下：\n\n```\nnode {\n  name: \"Const\"\n  op: \"Const\"\n  attr {\n    key:\
  \ \"dtype\"\n    value { type: DT_FLOAT }\n  }\n  attr {\n    key: \"value\"\n \
  \   value {\n      tensor {\n        dtype: DT_FLOAT\n        tensor_shape {}\n\
  \        float_val: 2.5\n      }\n    }\n  }\n}\nnode {\n  name: \"Const_1\"\n \
  \ op: \"Const\"\n  attr {\n    key: \"dtype\"\n    value { type: DT_FLOAT }\n  }\n\
  \  attr {\n    key: \"value\"\n    value {\n      tensor {\n        dtype: DT_FLOAT\n\
  \        tensor_shape {}\n        float_val: 4.2\n      }\n    }\n  }\n}\nnode {\n\
  \  name: \"add\"\n  op: \"Add\"\n  input: \"Const\"\n  input: \"Const_1\"\n  attr\
  \ {\n    key: \"T\"\n    value { type: DT_FLOAT }\n  }\n}\nversions {\n  producer:\
  \ 22\n}\n```\n\n这个 `GraphDef` 包含三个节点：两个代表张量，一个代表相加张量的操作。真实世界中的应用程序可能有数千个节点。在节点列表的末尾，`versions`\
  \ 对象标识版本为 `22`。\n\n`tf.train` 中的 `write_graph` 函数使得将 `GraphDef` 的数据存储到文件中成为可能。其签名如下：\n\
  \n```python\nwrite_graph(graph/graph_def, logdir, name, as_text=True)\n```\n\n第一个参数可以设置为\
  \ `Graph` 或 `GraphDef`。最后一个参数标识内容应以文本形式还是二进制形式写入。例如，以下代码将当前图存储到名为 `graph.dat` 的文本文件中：\n\
  \n```python\ntf.train.write_graph(tf.get_default_graph(), os.getcwd(), 'graph.dat')\n\
  ```\n\n同样，应用程序可以通过调用两个例程之一，从包含图数据的文件加载 `GraphDef`：\n\n*   `TextFormat.Merge(data,\
  \ graphdef)`：从文本元素初始化 `GraphDef`\n*   创建 `GraphDef`s：将图转换为协议缓冲区\n\n`TextFormat`\
  \ 类在 `google.protobuf` 中提供。关于在 Python 中中访问协议缓冲器的完整讨论，请访问 [`https://developers.google.com/protocol-buffers/docs/pythontutorial`](https://developers.google.com/protocol-buffers/docs/pythontutorial)。\n\
  \n## 创建和运行会\n\n作为 Python 开发者，你可能习惯于程序按行处理。但在 TensorFlow 应用程序中，涉及张量的操作在它们存储到图中并在会中执行之前是不会执行的。本节解释了如何编写创建并执行会的应用程序。\n\
  \n### 创建会\n\n与图一样，一次只能有一个活跃的会。但会和图之间有一个重要区别——每个会都必须显式创建。你可以通过调用 `tf.Session` 创建\
  \ `Session`，它接受三个可选参数：\n\n*   `target`：执行引擎的名称\n*   `graph`：要启动的 `Graph` 实例\n* \
  \  `config`：配置会执行 `ConfigProto`\n\n关于执行引擎的讨论在第 11 章中，该章节介绍了 `target` 参数。同样，`ConfigProto`\
  \ 中的大多数设置与线程和设备有关，因此第 10 章讨论了 `config` 参数。\n\n默认情况下，会访问默认图中的张量和操作。但如果你在 `tf.Session`\
  \ 中设置了 `graph` 参数，会将会执行该图。\n\n应用程序经常在 `with` 语句内部调用 `tf.Session`。该语句确保 `with` 块中的代码可以访问新的\
  \ `Session`。以下代码显示了它是如何工作的：\n\n```python\nwith tf.Session() as sess:\n```\n\n##\
  \ 执行会\n\n`Session` 最重要的方法是 `run`。该方法接受四个参数，只有第一个是强制的：\n\n*   `fetches`：输出张量或操作\n\
  *   `feed_dict`：馈入会的数据\n*   `options`：执行选项\n*   `metadata`：来自会的元数据\n\n如果你将 `fetches`\
  \ 赋值为张量列表，`run` 将返回类似的集合。以下代码使用两个张量调用 `run`：\n\n```python\nres1, res2 = sess.run([t1,\
  \ t2])\n```\n\n如果你将 `fetches` 赋值为操作，`run` 将返回包含结果的 `ndarray`。以下代码使用加法调用 `run`：\n\
  \n```python\nres = sess.run(t1 + t2)\n```\n\n`run` 的 `feed_dict` 参数在批量处理数据的应用程序中起着重要作用。第\
  \ 5 章详细讨论了该参数。\n\n### 交互式\n\n与其向解释器发送整个脚本，许多 Python 开发者喜欢交互式编写代码。在这种模式下，解释器会在处理每行时显示反馈。\n\
  \n为了支持交互式开发，TensorFlow 提供了 `InteractiveSession` 类。`InteractiveSession` 的作用与 `Session`\
  \ 相同，但它成为默认会。\n\n与其调用 `sess.run`，可以通过 `eval` 方法评估张量。同样，可以通过 `Operation` 类的 `run`\
  \ 方法执行操作。\n\n一个示例说明了 `InteractiveSession` 的工作原理。以下代码旨在普通模式下运行：\n\n```python\nt1\
  \ = tf.constant(1.2)\nt2 = tf.constant(3.5)\nprod = tf.multiply(t1, t2)\nwith tf.Session()\
  \ as sess:\n    print(\"Product: \", sess.run(prod))\n```\n\n此代码使用 `InteractiveSession`\
  \ 实现了相同的结果：\n\n```python\nt1 = tf.constant(1.2)\nt2 = tf.constant(3.5)\nprod = tf.multiply(t1,\
  \ t2)\nsess = tf.InteractiveSession()\nprint(\"Product: \", prod.eval())\n```\n\n\
  ## 向日志写入消息\n\n第 1 章到第 4 章中的所有示例代码都依赖 `print` 将数据写入标准输出。但 TensorFlow 提供了一种日志机制，其具有比普通\
  \ `print` 更多的消息功能。关于 TensorFlow 日志有五点需要了解：\n\n*   TensorFlow 通过 `tf.logging` 包启用日志。\n\
  \n\n\n\n\n- TensorFlow 的日志记录基于标准的 Python 日志记录，许多 `tf.logging` 函数与 Python 的 `Logger`\
  \ 类的方法相同。\n- TensorFlow 支持五种日志级别。按严重程度从低到高排序为 `DEBUG`、`INFO`、`WARN`、`ERROR` 和 `FATAL`。\n\
  - 要启用日志记录，应用程序需要调用 `tf.logging.set_verbosity` 并传入应记录的最低严重级别。\n- 默认情况下，TensorFlow\
  \ 将日志消息写入到标准输出。在本文编写时，TensorFlow 日志不支持将消息写入日志文件。\n\n对于每个日志级别，`tf.logging` 都提供了一个同名的函数，用于写入该级别的日志消息。例如，以下代码启用了\
  \ INFO 消息（以及更严重级别的消息），然后写入了一条显示 `output` 值的 INFO 消息：\n\n```\ntf.logging.set_verbosity(tf.logging.INFO)\n\
  with tf.Session() as sess:\n     output = sess.run(…)\n     tf.logging.info('Output:\
  \ %f', output)\n```\n\n如果 `output` 的值为 5.5，`tf.logging.info` 将向标准输出打印以下消息：\n\n```\n\
  INFO:tensorflow:Output: 5.5\n```\n\n表 4-3 列出了 `set_verbosity`、`info` 以及 `tf.logging`\
  \ 提供的其他函数。\n\n### 表 4-3 数据摘要函数摘要\n\n| 函数 | 描述 |\n| --- | --- |\n| `set_verbosity(level)`\
  \ | 启用给定严重级别及更高级别消息的日志 |\n| `debug(msg, *args, **kwargs)` | 记录 DEBUG 级别的消息 |\n|\
  \ `info(msg, *args, **kwargs)` | 记录 INFO 级别的消息 |\n| `warn(msg, *args, **kwargs)`\
  \ | 记录 WARN 级别的消息 |\n| `error(msg, *args, **kwargs)` | 记录 ERROR 级别的消息 |\n| `fatal(msg,\
  \ *args, **kwargs)` | 记录 FATAL 级别的消息 |\n| `flush()` | 等待日志记录操作完成 |\n| `log(level,\
  \ msg, *args, **kwargs)` | 记录给定严重级别的消息 |\n| `log_if(level, msg, condition, *args)`\
  \ | 如果条件为真，则记录给定严重级别的消息 |\n| `log_first_n(level, msg, n, *args)` | 在给定严重级别最多记录 `n`\
  \ 次消息 |\n| `log_every_n(level, msg, n, *args)` | 每隔 `n` 次记录一次给定严重级别的消息 |\n\n最后三个函数使得控制消息何时写入日志成为可能。`log_if`\
  \ 的第三个参数定义了一个决定何时记录消息的条件。以下代码在 `output` 大于 0 时记录其值：\n\n```\ntf.logging.log_if(tf.logging.INFO,\
  \ 'Output: %f', (output > 0), output)\n```\n\n`log_first_n` 和 `log_every_n` 的第三个参数是一个整数，决定执行的频率。在\
  \ `log_first_n` 中，该值设置了函数写入日志的最大次数。在 `log_every_n` 中，该值告诉函数每隔 `N` 次记录一次消息。\n\n##\
  \ 使用 TensorBoard 可视化数据\n\n日志记录对于监控简单数据已经足够，但在许多情况下，开发者需要追踪大型、复杂的数据集。实际应用可能会启动数百或数千次会，日志记录不足以监控数据如何执行执行的变化。\n\
  \n好消息是你的 TensorFlow 安装包含了 TensorBoard。这个强大的工具可以读取应用程序的数据并将其显示在网页中。图 4-2 展示了 Chrome\
  \ 浏览器中 TensorBoard 页面的样子。坏消息是 TensorBoard 需要名为“摘要数据”（summary data）的特殊格式数据，而生成这些数据并不容易。\n\
  \n### 运行 TensorBoard\n\n当你安装 TensorFlow 时，安装程序会将 TensorBoard 工具放置在顶层脚本目录下。如果你可以从命令行执行\
  \ `tensorboard` 命令，请将此目录添加到系统的 `PATH` 中。`tensorboard` 命令接受几个标志，包括：\n\n- `--logdir\
  \ DIR`: 包含摘要数据的目录\n- `--host HOST`: 标识网页 URL 的主机部分\n- `--port PORT`: 标识网页 URL 的端口\n\
  \n默认情况下，TensorBoard 的 IP 地址为 `127.0.0.1`，可以通过 `localhost` 访问。TensorBoard 的默认端口为\
  \ `6006`。因此，TensorBoard 的默认 URL 为 `http://localhost:6006`。\n\n`--logdir` 标志是必须的，所以没有数据无法启动\
  \ TensorBoard。你必须将此标志指向一个包含名为 event 的特殊文件的目录。该文件包含了 TensorBoard 执行所需的摘要数据。如果文件位于名为\
  \ `output` 的目录中，以下命令告诉 TensorBoard 读取该 event 文件：\n\n```\ntensorboard --logdir=output\n\
  ```\n\n### 生成摘要数据\n\n到此时，你应该已经了如何创建数学操作并在会中执行它们。本节引入了一种名为摘要操作（summary operation）的新类型操作。它类似于其他的\
  \ TensorFlow 操作，但当会执行摘要操作时，结果是一个包含摘要数据的协议缓冲区（protocol buffer）。应用程序可以将此缓冲区写入文件，其内容可以通过\
  \ TensorBoard 进行显示。\n\nTensorBoard 可以展示许多不同类型的数据，每种类型都对应 `tf.summary` 的一个函数。表 4-4\
  \ 列出了六个可用函数。\n\n### 4-4 数据摘要函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `scalar(name, tensor,\
  \ collections=None)` | 创建关于标量的摘要操作 |\n| `histogram(name, values, collections=None)`\
  \ | 创建提供直方数据的摘要操作 |\n| `audio(name, tensor, sample_rate, max_outputs=3, collections=None)`\
  \ | 创建提供音频数据的摘要操作 |\n| `image(name, tensor, max_outputs=3, collections=None)` |\
  \ 创建提供图像数据的摘要操作 |\n| `merge(inputs, collections=None, name=None)` | 将指定的摘要操作合并为一个摘要操作\
  \ |\n| `merge_all(key= GraphKeys.SUMMARIES)` | 将摘要操作合并为一个摘要操作 |\n\n在这些函数中，最流行的是\
  \ `scalar` 和 `histogram`。`scalar` 生成随多次会执行而变化的单个值的摘要数据。`histogram` 生成随会执行变化的数值集合数据。`image`\
  \ 函数生成与图像和图像分析相关的数据。第 8 章详细讨论图像。\n\n在我看来，理解摘要数据的最佳方法是看示例代码。以下代码执行了三个任务：\n\n- `tf.summary.scalar`\
  \ 生成提供标量数据的操作。\n- `tf.summary.merge_all` 将它们合并为一个操作。\n- `sess.run` 执行合并后的摘要操作。\n\
  \n```\n## 添加两个标量\na = tf.constant(2.5)\nb = tf.constant(4.5)\ntotal = a + b;\n\n\
  ## 创建生成摘要数据的操作\ntf.summary.scalar(\"a\", a)\ntf.summary.scalar(\"b\", b)\ntf.summary.scalar(\"\
  total\", total)\n\n## 将操作合并为一个操作\nmerged_op = tf.summary.merge_all()\n\nwith tf.Session()\
  \ as sess:\n     _, summary = sess.run([sum, merged_op])\n```\n\n\n\n\n如所示，每个感兴趣的实体都需要一个单独的操作来生成摘要数据。这意味着应用程序需要调用三次\
  \ `tf.summary.scalar`：针对每个要分析的张量调用一次。但你不需要访问每次 `tf.summary.scalar` 用的返回值，因为 `tf.summary.merge_all`\
  \ 将数据生成操作合并为了一个操作。\n\n### 创建自定义摘要\n\n与其调用表 4-4 中的函数，你还不如通过创建 `Summary` 对象来生成自定义摘要数据。`Summary`\
  \ 类是一个 Python 包装器，用于包含摘要数据的协议传输缓冲区（protocol buffer）。\n\n你可以通过调用 `tf.Summary` 并将其\
  \ `value` 参数设置为 `Summary.Value` 缓冲区的列表，来创建一个 `Summary` 实例。每个 `Summary.Value` 都可以拥有一个\
  \ `node_name`、一个 `tag` 以及以下五个数据字段之一：\n\n* `simple_value` — 一个 32 位浮点值\n* `image`\
  \ — 一个包含像素数据的 `Image` 实例\n* `histo` — 一个包含要在直方图中显示的数据的 `HistogramProto`\n* `audio`\
  \ — 一个包含音频数据的 `Audio` 实例\n* `tensor` — 一个包含张量相关数据的 `TensorProto`\n\n以下代码创建了一个自定义摘要并设置了它的\
  \ `simple_value` 字段：\n\n```python\ncustom_summary = tf.Summary(value=[\n    tf.Summary.Value(tag=\"\
  num_tag\", simple_value=5.0),\n])\n```\n\n这段代码并没有创建一个摘要数据的操作——它直接生成了摘要数据。在前面的代码中，TensorBoard\
  \ 显示 `custom_summary` 的内容就像它是通过 `tf.summary.scalar` 生成的一样。\n\n### 写入摘要数据\n\n在生成摘要数据后，下一步是创建一个目录并将摘要数据写入目录的事件文件中。此过程需要创建一个\
  \ `FileWriter` 并调用它的方法。\n\n## 创建 FileWriter\n\n应用程序可以通过调用其构造函数来创建一个 `FileWriter`：\n\
  \n```python\ntf.summary.FileWriter(logdir, graph=None, max_queue=10, flush_secs=120,\
  \ filename_suffix=None)\n```\n\n`logdir` 参数设置了用于包含摘要数据而应创建的目录名称。如果你设置了 `graph` 参数，图的数据将被添加到给定目录中的事件文件中。如果你设置了\
  \ `filename_suffix`，该后缀将附加到生成的事件文件的名称中。\n\n`FileWriter` 异步更新事件文件，这意味着可能同时有多个写入操作处于等待状态。`max_queue`\
  \ 参数指定了时间内可以等待的写入操作的最大数量。`flush_secs` 参数指定了 `FileWriter` 执行待处理操作的频率。\n\n例如，以下代码创建了一个\
  \ `FileWriter` 并将其配置为创建一个名为 `log` 的目录。该目录中的事件文件应包含默认图的摘要数据。\n\n```python\nfw = tf.summary.FileWriter(\"\
  log\", graph=tf.get_default_graph())\n```\n\n如果该目录已存在，构造函数可能会创建多个事件文件。在许多情况下，检查目录是否存在并在必要时删除它是一个好主意。\n\
  \n#### 将数据打印到事件文件\n\n`FileWriter` 构造函数创建一个带有事件文件的目录。`FileWriter` 的方法使数据写入事件文件成为可能。表\
  \ 4-5 列出了这些方法并提供了对种方法的描述。\n\n表 4-5 FileWriter 类的方法\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `add_summary(summary, global_step=None)` | 将摘要数据添加到事件文件 |\n| `add_event(event)`\
  \ | 将事件数据添加到事件文件 |\n| `add_graph(graph, global_step=None, graph_def=None)` | 将图的摘要数据添加到事件文件\
  \ |\n| `add_meta_graph( meta_graph_def, global_step=None)` | 将来自 `MetaGraphDef`\
  \ 的数据添加到事件文件 |\n| `add_run_metadata( run_metadata, tag, global_step=None)` | 将会\
  \ 的运行元数据添加到事件文件 |\n| `add_session_log( session_log, global_step=None)` | 将来自 `SessionLog`\
  \ 的数据添加到事件文件 |\n| `flush()` | 执行待处理的写入操作 |\n| `close()` | 刷新写入操作并关闭事件文件 |\n| `reopen()`\
  \ | 重打开事件文件以写入摘要数据 |\n\n`add_summary` 打印摘要数据。也就是说，它将数据生成操作产生的摘要数据写入事件文件。以下代码演示了如何调用它：\n\
  \n```python\n## 将操作合并为单个操作\nmerged_op = tf.summary.merge_all()\n\n## 创建 FileWriter\n\
  writer = tf.summary.FileWriter(\"summary\")\n\nwith tf.Session() as sess:\n    _,\
  \ summary = sess.run([merged_op])\n```\n（注：提示中的原始文本代码片段是碎片化的，我已将其重组为有效的代码块以保持清晰。）\n\
  \n### 将理论付诸实践\n\n`ch4/two_graphs.py` 中的代码演示了应用程序如何创建多个图并在单独会话中执行它们。在执行每个图后，应用程序会创建一个\
  \ `FileWriter` 并生成可以使用 TensorBoard 查看的摘要数据。列表 4-1 了代码：\n\n```python\n## 在会话中启动多个图\n\
  ## 启用日志\ntf.logging.set_verbosity(tf.logging.INFO)\n\n## 创建张量\nt1 = tf.constant([1.2,\
  \ 2.3, 3.4, 4.5])\nt2 = tf.constant([5.6, 6.7, 7.8, 8.9])\nt3 = tf.concat([t1, t2],\
  \ 0)\nt4 = tf.random_normal([8])\nt5 = tf.tensordot(t3, t4, 1)\n\n## 创建生成摘要数据的操作\n\
  tf.summary.scalar(\"t1\", t1[0])\ntf.summary.scalar(\"t2\", t2[0])\ntf.summary.scalar(\"\
  t3\", t3[0])\ntf.summary.scalar(\"t4\", t4[0])\ntf.summary.scalar(\"t5\", t5)\n\n\
  merged_op = tf.summary.merge_all()\n\n## 创建 FileWriter\nfile_writer = tf.summary.FileWriter(\"\
  log\", graph=tf.get_default_graph())\n\n## 执行第一个图\nwith tf.Session() as sess:\n\
  \    # 执行会话\n    dot_result, summary = sess.run([t5, merged_op])\n    # 将结果写入日志\n\
  \    tf.logging.info('Result of dot product: %f', dot_result)\n    # 打印摘要数据\n  \
  \  file_writer.add_summary(summary)\n    file_writer.flush()\n```\n\n\n\n\n\n##\
  \ 获取 GraphDef 并将其写入文件\n\n`tf.train.write_graph(sess.graph, os.getcwd(), 'graph1.dat')`\n\
  \n## 创建第二个图并将其设为默认\n\n`graph = tf.Graph()`\n`with graph.as_default():`\n\n## 计算平均值\n\
  `t6 = tf.random_uniform([8], 4.0, 8.0)`\n`t7 = tf.fill([8], 6.0)`\n`t8 = tf.reduce_mean(t6\
  \ + t7)`\n\n## 执行第一个图\n`with tf.Session() as sess:`\n\n## 执行会\n`sess.run(t8)`\n\n\
  ## 获取 GraphDef 并将其写入文件\n`tf.train.write_graph(sess.graph, os.getcwd(), 'graph2.dat')`\n\
  \n对 `sess.run` 的第一次调用特别有趣。它的第一个参数是一个包含两个元素的列表。第一个元素 `t5` 是结合 `t1`、`t2`、`t3` 和 `t4`\
  \ 的操作结果。第二个元素 `merged_op` 结合了五个生成摘要数据的操作。\n\n`sess.run` 返回 `t5` 的值和生成的摘要数据。当这些结果可用时，应用程序通过调用\
  \ `FileWriter` 的 `add_summary` 方法记录 `t5` 的值并将摘要数据打印到文件中。\n\n`FileWriter` 构造函数的第一个参数是\
  \ `log`，因此 `FileWriter` 将数据打印到 log 目录下的事件文件中。你可以通过以下命令启动 TensorBoard 来可视化这些数据：\n\
  \n`tensorboard --logdir=log`\n\n要在 TensorBoard 中查看生成的数据，请打开浏览器访问 `http://localhost:6006`。如果你点击页面顶部的\
  \ HISTOGRAMS 链接，可以查看张量 `t1` 到 `t4`。图 4-3 显示了 `t1` 直方图的样子。\n\n![图 4-3：TensorBoard\
  \ 直方图绘制了张量的元素。](img/9781119466215-fg0403.png)\n\n图 4-3： TensorBoard 直方图绘制了张量的元素。\n\
  \n与 `t1` 到 `t4` 不同，`t5`只有一个元素。应用程序通过调用 `tf.summary.scalar` 为 `t5` 生成数据，你可以点击页面顶部的\
  \ SCALARS 链接在 TensorBoard 中查看这些数据。结果并不特别，因为应用程序只执行了一次会话。第 5 章解释了如何执行包含多个步骤的会话并在\
  \ TensorBoard 中查看结果。\n\n第 5 章\n\n## 训练\n\n本章内容\n\n![check](img/check.png) **在 TensorFlow\
  \ 中训练应用程序**\n\n![check](img/check.png) **创建变量和占位符**\n\n![check](img/check.png) **使用优化器最小化损失**\n\
  \n![check](img/check.png) **将数据集划分为批次**\n\n在互联网出现之前，像我这样的老派人通过实际交谈来消遣。一种非常火的游戏是“20\
  \ 个问题”，其中一个玩家想出一个物体，另一个玩家通过提问来确定物体是什么。提问者最多可以问 20 个“是/否”问题，一个典型的游戏如下：\n\n* ：它比面包盒大吗？\n\
  * 答：是的。\n* ：它能动吗？\n* 答：是的。\n* ：它是动物吗？\n* 答：不是。\n* ：它是靠轮子移动的吗？\n* 答：不是。\n* ：（唉）Matt，它是一个坏机器人吗？又是？\n\
  * 答：就是它！你赢了！\n\n在本章中，我将解释“20 个问题”游戏如何与监督学习中使用的训练方法相似。\n\n## 在 TensorFlow 中训练\n\n\
  在“20 个问题”游戏中，提问者从一个猜测开始，并随着每个答案完善他的理解。这个游戏类似于监督学习中使用的训练方法。应用程序从对目标系统的通用想法或模型开始。应用程序将其模型与实验数据进行比较，确定它们之间的差异，并反复完善模型以缩小这种差异。\n\
  \n通用的训练过程易于理解，但使用 TensorFlow 实现训练并不容易。该过程涉及六步：\n\n1. **为通用模型构建数学表达式。**\n2. **声明在训练过程中需要更新的变量。**\n\
  3. **获取损失表达式，即是模型与观测值之间的差异。**\n4. **使用第 3 步的损失创建一个 `Optimizer` 并调用其 `minimize` 方法。**\n\
  5. **（可选）配置会话 `run` 方法的第二个参数，以向会话提供批次数据。**\n6. **通过调用会话的 `run` 方法执行会话。**\n\n从问题来看，许多开发者难以掌握这些步骤。\n\
  \n## 建模\n\n就像“20 个问题”游戏从猜测开始一样，机器学习也从一个初始估计开始。本书关注两种建模方法。第一种涉及形状。第二种方法涉及人工神经网络。无论你是用形状还是神经网络对系统建模，你都需要不断完善模型，直到它看起来像观测数据。这种完善涉及到更新模型的参数，例如\
  \ ![images/eq5001.png)<m:math xmlns=\"http://www.w3.org/1998/MathML/MathML\"><m:mrow><m:mi\
  \ mathvariant=\"normal\">y</m:mi><m:mo>=</m:mo><m:mi mathvariant=\"normal\">mx</m:mi><m:mo>+</m:mo><m:mi\
  \ mathvariant=\"normal\">b</m:mi></m:mrow></m:math> 中的 *m* 和 *b*。在 TensorFlow 应用程序中，这些可训练参数都是\
  \ `Variable` 类的实例。\n\n\n\n\n\n```python\nvariableA = tf.Variable(tensorA)\n```\n\
  \n变量的作用是存储在训练过程中需要更新的数据。许多应用程序并不使用常量值初始化变量，而是使用随机值。以下代码创建了一个名为 `variableB` 的变量，并将其初始值设置为正态分布数值的张量：\n\
  \n```python\nvariableB = tf.Variable(tf.random_normal([3]))\n```\n\n`tf.Variable`\
  \ 接受一个名为 `trainable` 的布尔参数。如果你将此参数设置为 `True`，则该变量可以通过训练进行更新。如果你将其设置为 `False`，该变量无法通过训练进行更新。\n\
  \n## 初始化变量\n\n变量与张量之间的一个重要区别是，你需要执行特殊的操作来初始化变量。也就是说，在训练变量之前，你需要先创建一个初始化操作并在会话（session）中执行它。如果应用程序尝试使用未初始化的变量，TensorFlow\
  \ 会抛出错误：`Attempting to use uninitialized value…`。\n\nTensorFlow 提供了三个创建初始化变量操作的函数。表\
  \ 5-1 列出了这些函数并对每个函数进行了描述。\n\n表 5-1 变量初始化函数\n\n| **函数** | **描述** |\n| --- | --- |\n\
  | `variable_initializer(var_list, name=‘init’)` | 返回一个初始化列表中给定变量的操作 |\n| `local_variables_initializer()`\
  \ | 返回一个初始化所有局部变量的操作 |\n| `global_variables_initializer()` | 返回一个初始化所有全局变量的操作 |\n\
  \n应用程序通常调用 `global_variables_initializer`，因为它会创建一个初始化会话中每个全局变量的操作。以下代码显示了如何调用此函数：\n\
  \n```python\ninit = tf.global_variables_initializer()\n…\nwith tf.Session() as sess:\n\
  \  sess.run(init)\n```\n\n应用程序可以通过带有变量名称的 `is_variable_initialized` 来检查变量是否已初始化。\n\
  \n#### 确定损失\n\n训练通过精炼模型变量，来最小化你的模型与观测数据之间的差异。机器学习文献通常将这种差异称为*代价函数*（cost function）。TensorFlow\
  \ 的文档将其称为*损失*（loss）。\n\n例如，如果你用直线对一组点进行建模，则模型的表达式为 `y = mx + b`。当然，线上的点不会与观测数据 `y[obs]`\
  \ 完美匹配。如果有 `N` 个点，你可以使用以下表达式来表示损失：\n\n![images](img/eq05002.png)<m:math xmlns:m=\"\
  http://www.w3.org/1998/Math/MathML\"><m:mrow><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>s</m:mi><m:mi>s</m:mi><m:mo>=</m:mo><m:mfrac><m:mn>1</m:mn><m:mi>N</m:mi></m:mfrac><m:mstyle\
  \ displaystyle=\"true\"><m:munderover><m:mo>&#8721;</m:mo><m:mrow><m:mi>i</m:mi><m:mo>=</m:mo><m:mn>0</m:mn></m:mrow><m:mrow><m:mi>N</m:mi><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:munderover><m:mrow><m:msup><m:mrow><m:mrow><m:mo>(</m:mo><m:mrow><m:msub><m:mi>y</m:mi><m:mrow><m:mi>o</m:mi><m:mi>b</m:mi><m:mi>s</m:mi></m:mrow></m:msub><m:mo>&#45;</m:mo><m:mrow><m:mo>(</m:mo><m:mrow><m:mi>m</m:mi><m:mi>x</m:mi><m:mo>+</m:mo><m:mi>b</m:mi></m:mrow><m:mo)</m:mo></m:mrow></m:mrow><m:mo>)</m:mo></m:mrow></m:mrow><m:mn>2</m:mn></m:msup></m:mrow></m:mstyle></m:mrow></m:math>\n\
  \n在 TensorFlow 应用程序中，你可以使用以下代码表示模型和损失：\n\n```python\nm = tf.Variable(tf.random_normal([]))\n\
  b = tf.Variable(tf.random_normal([]))\nmodel = tf.add(tf.multiply(x, m), b)\nloss\
  \ = tf.reduce_mean(tf.pow(model - y, 2))\n```\n\n这种计算损失的方法被称为*均方误差*（mean squared\
  \ error），它是许多可用方法之一——极大似然估计和对数似然估计也是流行的。第 6 章讨论了统计回归以及你计算损失的不同方法。\n\n如果你的模型包含了神经网络，你无法通过简单的方程来计算损失。前馈网络需要如反向传播等特殊算法。\n\
  \n\n\n\n尽管 `GradientDescentOptimizer` 广受欢迎，但很少有专家在有其他选择的情况下首选它。要理解其原因，你需要理解它在执行优化时所使用的算法。在本次讨论中，我将介绍梯度下降的理论，然后解释你如何在代码中创建和使用\
  \ `GradientDescentOptimizer`。\n\n### 梯度下降算法\n\n`GradientDescentOptimizer` 使用梯度下降算法来最小化损失，该算法依赖于一个关键的数学事实：函数在某一点处沿着该点负梯度所确定的方向下降最快。\n\
  \n如果你学过微积分，你就知道函数在某一点的导数等于该函数在该处的斜率。也就是说，如果 `f(x)` 是可微的，它对 `x` 的导数记为 `f’(x)`，点 `a`\
  \ 处的斜率记为 `f’(a)`。图 5-1 显示了函数导数的形态。\n\n![图 5-1: 点的导数等于曲线在该点的斜率。](img/97811119466215-fg0501.png)\n\
  \n图 5-1： 点的导数等于曲线在该点的斜率。\n\n多变量的函数有多个导数。例如，`f(x, y)` 具有对 `x` 的导数和对 `y` 的导数。这些是*偏导数*，它们用以下符号表示：\n\
  \n![images](img/eq05003.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mtable columnalign=\"left\"><m:mtr><m:mtd><m:mi mathvariant=\"normal\">Partial&#160;derivative&#160;of&#160;f(x,&#160;y)&#160;with&#160;respect&#160;to&#160;x:&#160;</m:mi><m:mfrac><m:mrow><m:mo>&#8706;</m:mo><m:mi>f</m:mi></m:mrow><m:mrow><m:mo>&#8706;</m:mo><m:mi>x</m:mi></m:mrow></m:mfrac></m:mtd></m:mtr><m:mtr><m:mtd><m:mi\
  \ mathvariant=\"normal\">Partial&#160;derivative&#160;of&#160;f(x,&#160;y)&#160;with&#160;respect&#160;to&#160;y:&#160;</m:mi><m:mfrac><m:mrow><m:mo>&#8706;</m:mo><m:mi>f</m:mi></m:mrow><m:mrow><m:mo>&#8706;</m:mo><m:mi>y</m:mi></m:mrow></m:mfrac></m:mtd></m:mtr></m:mtable></m:math>\
  \ \n\n图 5-2 描绘了关系 ![images](img/eq05004.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:mi:=\"normal\">f</m:mi><m:mrow><m:mo>(</m:mo><m:mrow><m:mi:=\"normal\"\
  >x</m:mi><m:mo>,</m:mo><m:mi:=\"normal\">&#160;y</m:mi></m:mrow><m:mo)m:mo></m:mrow><m:mo>=</m:mo><m:mn>16</m:mn><m:mo>&#45;</m:mo><m:mn>4</m:mn><m:msup><m:mi:=\"\
  normal\">x</m:mi><m:mn>2</m:mn></m:msup><m:mo>&#45;</m:mo><m:mn>2</m:mn><m:msup><m:mi:=\"\
  normal\">y</m:mi><m:mn>2</m:mn></m:msup></m:mrow></m:math>。在点 (1, 2) 处，对 `x` 的偏导数为\
  \ –8，对 `y` 的偏导数为 –8。\n\n![图 5-2: 梯度指向最陡上升的方向。](img/97811119466215-fg0502.png)\n\n\
  图 5-2： 梯度指向最陡上升的方向。\n\n从几何角度上说，*向量*是一个具有幅值和方向的量。向量可以通过识别其在正交方向上幅量的分量来定义。你可以将向量想象成空间中的箭头。如果一个向量在\
  \ x 正方向上指向两个单位，在 y 方向上指向三个单位，它可以被表示为 `2, -3`。\n\n梯度下降算法关注的是一种特殊的向量，称为*梯度*。函数的梯度是一个其分量等于该函数偏导数的向量。`f`\
  \ 的梯度记为 `∇f`，如果函数有三个变量，你可以将其梯度表示为：\n\n![images](img/eq05005.png)<m:math xmlns:m=\"\
  http://www.w3.org/1998/Math/MathML\"><m:mrow><m:mo>&#8711;</m:mo><m:mi>f</m:mi><m:mo\
  \ stretchy=\"false\">(</m:mo><m:mi>x</m:mi><m:mo>,</m:mo><m:mi>y</m:mi><m:mo>,</m:mo><m:mi>z</m:mi><m:mo\
  \ stretchy=\"false\">)</m:mo><m:mo>=</m:mo><m:mrow><m:mo>\\[</m:mo><m:mrow><m:mfrac><m:mrow>&#8706;</m:mo><m:mi>f</m:mi></m:mrow><m:mrow><m:mo>&#8706;</m:mo><m:mi>x</m:mi></m:mrow></m:mfrac></m:mtd><m:mrow><m:mo>&#8706;</m:mo><m:mi>f</m:mi></m:mrow><m:mrow><m:mo>&#8706;</m:mo><m:mi>y</m:mi></m:mrow></m:mfrac></m:mtd><m:mrow><m:mo>&#8706;</m:mo><m:mi>f</m:mi></m:mrow><m:mrow><m:mo>&#8706;</m:mo><m:mi>z</m:mi></m:mrow></m:mfrac></m:mrow></m:mrow></m:math>\n\
  \n\n\n许多开发者通过尝试误差来设置 `η`，初始估计值通常在 0.1 到 0.0001 之间。一种常用的方法是从一个较大的 `η` 值开始，并不断减小该值，直到优化器成功收敛。计算机科学家们已经设计了选择\
  \ `η` 的自动方法，但据我所知，还没有哪种方法获得广泛认可。\n\n如果你将 `use_locking` 参数设置为 `True`，`GradientDescentOptimizer`\
  \ 将获取一个锁，防止其他操作修改其变量。变量仍然可以被正常读取。\n\n## 缺点\n\n梯度下降算法是最小化损失的最古老、最简单的算法，但它也具有每个开发者都应该意识到的重要缺点。\n\
  \n第一个缺点涉及局部最小值和全局最小值之间的区别。优化寻求在函数整个范围内损失最小的点。这个值就是损失的`global minimum”（全局最小值）。\n\n\
  但 `GradientDescentOptimizer`可能会收敛到一个不是全局的最小值。这个值就是`local minimum”（局部最小值），图 5-3 展示了这种区别。在图中，函数有两个局部最小值环绕着一个全局最小值。如果优化器到达其中任何一个局部最小值，它将停止优化，因为损失的梯度\
  \ `∇J(θ)` 等于 0。\n\n![FIGURE 5-3: 一个函数可能有许多局部最小值，但只有一个全局最小值。](img/9781119466215-fg0503.png)\n\
  \n图 5-3： 一个函数可能有许多局部最小值，但只有一个全局最小值。\n\n在使用梯度下降算法时，你还需要注意其他三个问题：\n\n* 它收敛到最小值的速度通常很慢。\n\
  * 它只能优化可微函数。\n* 它可能会在各个值之间震荡，而永远无法到达最小值。\n\n最后一个问题值得解释。如果学习率过大，算法可能会在两个点之间反复跳跃，无法到达最小值。这种跳动被称为`oscillation`震荡），它是产生频繁挫败感的来源。\n\
  \n你可以通过降低学习率来减少震荡发生的概率。或者，你可以创建一个学习率随步骤变化的优化器。以下章节介绍了三个这样的优化器：`MomentumOptimizer`、`AdagradOptimizer`\
  \ 和 `AdamOptimizer`。\n\n## The MomentumOptimizer\n\n`MomentumOptimizer` 与 `GradientDescentOptimizer`\
  \ 有许多共同点，但它通常收敛更快，震荡概率较低。`MomentumOptimizer` 通过动量算法最小化损失，该算法使用损失梯度的前一个值来更新当前变量。\n\
  \n动量算法引入了一个 TensorFlow 称为`accumulation`积累的新量。该量（表示为 ![images](img/eq05007.png)<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:msub><m:mi>v</m:mi><m:mi>t</m:mi></m:msub></m:mrow></m:math>\
  \ 由当前损失的梯度、学习率以及积累的前一个值决定：\n\n![images](img/eq05008.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:msub><m:mi>v</m:mi><m:mi>t</m:mi></m:msub><m:mo>=</m:mo><m:mi>&#945;</m:mi><m:msub><m:mi>v</m:mi><m:mrow><m:mi>t</m:mi></m:mrow><m:mo>&#45;</m:mo><m:mn>1</m:mrow></m:msub><m:mo>&#45;</m:mo><m:mi>&#945;</m:mi><m:mi>J</m:mi><m:mrow><m:mo>(m:mo><m:mrow><m:mi>&#952;</m:mi><m:mo></m:mrow></m:mrow></m:math>\n\
  \n积累的前一个值（![images](img/eq05009.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:msub><m:mi>v</m:mi><m:mi>t</m:mi></m:msub><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:math>）通过\
  \ `α` 缩放，称为`momentum`动量。`α`设置为 0 到 1 之间的常量。应用程序通常将 `α` 设置为 0.9。\n\n计算积累后，你可以使用以下公式更新变量：\n\
  \n![images](img/eq05010.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:msub><m:mi>&#952;</m:mi><m:mi>t</m:mi></m:msub><m:mo>=</m:mo><m:msub><m:mi>&#952;</m:mi><m:mi>t</m:mi></m:msub><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:msub><m:mo>+</m:mo><m:msub><m:mi>v</m:mi><m:mi>t</m:mi></m:msub></m:mrow></m:math>\n\
  \n理解积累如何影响收敛速度是非常重要的。如果优化器向最小值移动，![images](img/eq05011.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:msub><m:mi>&#945;</m:mi><m:mi>v</m:mi><m:mi>t</m:mi></m:msub><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:math>\
  \ 将非常显著，优化器会更快接近最小值。如果优化器卡在两个值之间，![images](img/eq05012.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:msub><m:mi>&#945;</m:mi><m:mi>v</m:mi><m:mi>t</m:mi></m:msub><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:math>\
  \ 将减少变量更新的幅度。\n\n应用程序可以通过调用构造函数来创建 `MomentumOptimizer`：\n\n```\nMomentumOptimizer(learning_rate,\
  \ momentum, use_locking=False, name='Momentum', use_nesterov=False)\n```\n\n`use_locking`\
  \ 参数与 `GradientDescentOptimizer`构造函数中的 `use_locking` 参数相同。也就是说，如果 `use_locking`设置为\
  \ `True`，优化器将对其变量锁定。\n\n如果 `use_nesterov`设置为 `True`，优化器将采用 Nesterov 加速梯度，通常简称 NAG。NAG\
  \ 算法通过在计算损失*之前*更新变量来修改动量算法。以下公式显示了该算法如何工作：\n\n![images](img/eq05013.png)<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:msub><m:mi>v</m:mi><m:mi>t</m:mi></m:msub><m:mo>=</m:mo><m:mi>&#945;</m:mi><m:msub><m:mi>v</m:mi><m:mi>t</m:mi></m:msub><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:msub><m:mo>&#45;</m:mo><m:mo>&#8711;</m:mo><m:mi>J</m:mi><m:mrow><m:mo>(m:mo><m:mrow><m:mi>&#952;</m:mi><m:mo>&#45;</m:mo><m:mi>&#945;</m:mi><m:msub><m:mi>v</m:mi><m:mi>t</m:mi></m:msub><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:msub></m:mrow><m:mo)</m:mo></m:mrow></m:mrow></m:math>\
  \ ![images](img/eq05014.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:msub><m:mi>&#952;</m:mi><m:mi>t</m:mi></m:msub><m:mo>=</m:mo><m:msub><m:mi>&#952;</m:mi><m:mrow><m:mi>t</m:mi></m:mrow><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:msub><m:mo>+</m:mo><m:msub><m:mi>v</m:mi><m:mi>j</m:mi></m:msub></m:mrow></m:math>\n\
  \nNAG 算法通常比梯度下降算法收敛更快。Ilya Sutskever 等人的论文《On the Importance of Initialization and\
  \ Momentum in Deep Learning*详细讨论了该算法的性能。\n\n## AdagradOptimizer\n\n梯度下降算法和动量算法对每个训练变量应用相同的学习率。但不同的变量可能会以不同的速度收敛到最小值。自适应梯度（Adagrad）算法考虑了这一点。\n\
  \nAdagrad 算法有两个特点使其在学术界和专家中流行：\n\n* 学习率随变量变化并随步骤变化。第`t`步第`i`个变量的学习率表示为![images](img/eq05015.png)<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:msub><m:mi>&#951;</m:mi><m:mrow><m:mi>t</m:mi><m:mo></m:mo><m:mi>i</m:mi></m:mrow></m:msub></m:mrow></m:math>。\n\
  \n\n\n\n\n*   Adagrad 方法计算的是`subgradients`（子梯度）而不是梯度。子梯度是梯的推广，适用于不可微函数。这意味着 AdaGrad\
  \ 方法可以优化可微函数和不可微函数。\n\n2011 年，John Duchi、Elad Hazan 和 Yoram Singer 在他们的论文《在线学习与随机优化的自适应子梯度方法》（*Adaptive\
  \ Subgradient Methods for Online Learning and Stochastic Optimization*）中描述了第一个 Adagrad\
  \ 算法。数学公式非常复杂，我不尝试解释它。如果你好奇的话，这里是每个变量的学习率公式：\n\n![images](img/eq05016.png)<<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:msub><m:mi>&#951;</m:mi><m:mrow><m:mi>t</m:mi><m:mo>,</m:mo><m:mi>i</m:mi></m:mrow></m:msub><m:mo>=</m:mo><m:mfrac><m:mi>&#951;</m:mi><m:mrow><m:msqrt><m:mrow><m:msub><m:mi>G</m:mi><m:mrow><m:mi>t</m:mi><m:mo>,</m:mo><m:mi>i</m:mi><m:mi>i</m:mi></m:mrow></m:msub></m:mrow></m:msqrt></m:mrow></m:mfrac></m:mrow></m:math>\n\
  \n在这个方程中，`G[t, ii]` 是损失梯度与其外积所得矩阵对角线上的第 `i` 个元素。在计算出学习率后，优化器会更新变量：\n\n![images](img/eq05017.png)<<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:msub><m:mi>&#952;</m:mi><m:mrow><m:mi>t</m:mi><m:mo>,</m:mo><m:mi>i</m:mi></m:mrow></m:msub><m:mo>=</m:mo><m:msub><m:mi>&#952;</m:mi><m:mrow><m:mi>t</m:mi><m:mo>&#45;</m:mo><m:mn>1</m:mn><m:mo>,</m:mo><m:mi>i</m:mi></m:mrow></m:msub><m:mo>&#45;</m:mo><m:msub><m:mi>&#951;</m:mi><m:mrow><m:mi>t</m:mi><m:mo>,</m:mo><m:mi>i</m:mi></m:mrow></m:msub><m:msub><m:mi>g</m:mi><m:mi>t</m:mi></m:msub></m:mrow></m:math>\n\
  \n幸运的是，TensorFlow 开发者不需要担心子梯度或外积。因为 TensorFlow API 提供了 `AdagradOptimizer` 类，其构造函数如下。\n\
  \n```\nAdagradOptimizer(learning_rate, initial_accumulator_value=0.1, use_locking=False,\
  \ name='Adagrad')\n```\n\nadagrad 算法的一个缺点是学习率的幅度总是减小的。随着训练的持续，它们最终将变为零，导致训练停止。\n\
  \n### AdamOptimizer\n\nAdam（自适应动量估计）算法在许多方面与 adagrad 算法相似。它也类似于 Momentum 算法，因为它考虑了两个因素：\n\
  \n*   一阶动量向量：通过 `beta1` 对梯度进行缩放。\n*   二阶动量向量：通过 `beta2` 对梯度的 `square` 进行缩放。\n\n\
  这些向量分别表示为 `m[t]` 和 `v[t]`。以下方程显示了它们是如何变化的：\n\n![images](img/eq05020.png)<<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:msub><m:mi>m</m:mi><m:mi>t</m:mi></m:msub><m:mo>=</m:mo><m:msub><m:mi>&#946;</m:mi><m:mn>1</m:mn></m:msub><m:msub><m:mi>m</m:mi><m:mi>t</m:mi></m:msub><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:msub><m:mo><m:mo><m:msub><m:mi>&#946;</m:mi><m:mn>1</m:mn></m:msub></m:mrow></m:math></m:mrow><m:mo>&#8711;</m:mo><m:mi>J</m:mi><m:mrow><m:mo)m92m:mo></m:mrow></m:math![images](img/eq05021.png)<<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:msub><m:mi>v</m:mi><m:mi>t</m:mi></m:msub><m:mo>=</m:mo><m:msub><m:mi>&#946;</m:mi><m:mn>2</m:mn></m:msub><m:msub><m:mi>v</m:mi><m:mi>t</m:mi></m:msub><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:msub><m:mo><m:mo><m:msub><m:mi>&#946;</m:mi><m:mn>2</m:mn></m:msub></m:mrow></m:math></m:mrow><m:msup><m:mrow><m:mrow><m:mo>\\\
  [</m:mo><m:mrow><m:mo>&#8711;</m:mo><m:mi>J</m:mi><m:mrow><m:mo)m92m:mo></m:mrow></m:mrow><m:mo>\\\
  ]</m:mo></m:mrow></m:mrow></m:mrow></m:math>\n\n在计算出这些向量后，优化器使用以下方程更新模型变量：\n\n![images](img/eq05022.png)<<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:msub><m:mi>&#951;</m:mi><m:mi>t</m:mi></m:msub><m:mo>=</m:mo><m:mfrac><m:mi>&#951;</m:mi><m:msqrt><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:msub><m:mi>&#946;</m:mi><m:mn>2</m:mn></m:msub></m:mrow></m:math></m:mrow><m:msub><m:mi><m:mi><m:mi><m:mi>t</m:mi></m:mi></m:mi></m:mi></m:msub></m:mrow></m:math>\n\
  \n\n\n\n\n前两个参数指定了占位符元素的类型及其大小。占位符的实际内容由运行的会话设置，因此没有办法初始化占位符。\n\n例如，以下代码创建了一个包含\
  \ 32 位浮点值的占位符：\n\n```python\nph = tf.placeholder(tf.float32)\n```\n\n如果没有指定占位符的形状（shape），它可以被设置为任何形状的张量。如果指定了形状，赋值一个不同形状的张量会导致错误。\n\
  \n### 定义喂入字典（feed dictionary）\n\n第 3 章 介绍了 `Session` 类并解释了如何通过调用其 `run` 方法执行会话。但讨论并没有提到\
  \ `run` 的第二个参数 `feed_dict`，该参数使得向会话馈数据成为可能。要向会话馈数据，你需要将 `feed_dict` 赋值一个字典，该字典的键（keys）标识会话中的张量。大多数应用程序将这些键设置为占位符。`feed_dict`\
  \ 中的每个值都标识要传递给由键确定的张量（通常是占位符）的数据源。\n\n为了演示数据馈入，以下代码创建了一个占位符，在模型操作中使用它，然后通过 `run`\
  \ 方法的 `feed_dict` 参数将其馈入会话。\n\n```python\nph = tf.placeholder(tf.float32)\n…\nwith\
  \ tf.Session() as sess:\n  sess.run(optimizer, feed_dict={ph: data_src})\n```\n\n\
  在将数据与占位符关联时，有一个限制：数据源可以是常量列表或 NumPy `ndarray`，但不能是张量。以下代码将占位符与 `ndarray` 关联：\n\n\
  ```python\nph = tf.placeholder(tf.float32)\nvals = np.array([9., 8., 7.])\nincr\
  \ = tf.add(ph, 1.)\nwith tf.Session() as sess:\n  res = sess.run(incr, feed_dict={ph:\
  \ vals})\n  print(res)\n```\n\n在这种情况下，打印的结果为 `[10. 9. 8.]`，因为 `feed_dict` 通过 `ph`\
  \ 占位符将 `vals` 数组传递给会话。如果应用程序将 `vals` 赋值给张量，TensorFlow 将抛出错误：*The value of a feed\
  \ cannot be a tf.Tensor object.*。\n\n### 随机性（Stochasticity）\n\n为了防止优化器收敛到局部最小值而不是全局最小值，许多应用程序将其训练数据分成小批次，并随机将其馈入会话。这种随机性也称为随机性，它强制优化器在开始时较大的跳跃，随着训练的进行采取较小的跳跃。这种跳跃增加了优化器找到全局最小值的概率。\n\
  \n如果采用梯度下降算法处理随机数据，则被称为 `stochastic gradient descent`（随机梯度下降）算法。如果你在机器学习文献中术术 `SGD`，指的就是这种算法。\n\
  \n## 监控步骤、全局步骤和 Epoch\n\n在 TensorFlow 中，每次处理单批数据的会话执行称为一个 `step`。许多 TensorFlow 函数和方法接受一个名为\
  \ `global_step` 的参数，可以用于监控执行的步数。在实践中，`global_step` 作为批次的索引。\n\n你也可以通过以下方式跟踪步数：\n\
  1. 定义一个 `trainable` 设置为 `False` 的变量。\n2. 将 `global_step` 参数传递给 `minimize`。\n\n以下代码了如何使用\
  \ `global_step`：\n\n```python\n## 定义变量\nglobal_step = tf.Variable(0, trainable=False)\n\
  \n## 配置优化器\noptimizer = tf.train.AdamOptimizer(rate, global_step=global_step)\n\n\
  ## 启动会话\nwith tf.Session() as sess:\n  sess.run(tf.global_variables_initializer())\n\
  \  loss, step = sess.run([optimizer.minimize(loss), global_step])\n```\n\n## 保存和恢复变量\n\
  \n`Saver` 类使得加载和存储变量变得简单。默认情况下，`Saver` 访问每个变量。但 `Saver` 的构造函数可以识别特定的变量。例如，以下代码创建了一个可以保存两个变量的\
  \ `Saver`：\n\n```python\nsaver = tf.train.Saver([firstVar, secondVar])\n```\n\n\
  ### 保存变量\n\n`save` 方法存储变量以及与相关的数据。默认，该方法创建至少三个文件，每个文件具有相同的名称但后缀不同：\n\n- `filename.data-X-of-Y`：存储变量值\n\
  - `filename.index`：保存每个变量在数据文件中的偏移量\n- `filename.meta`：包含图结构的 `MetaGraphDef`\n\n\
  数据文件包含变量值，如果应用程序有许多变量，`save` 将创建多个数据文件。如果只有一个文件，其名称将为 `filename.data-00000-of-00001`。\n\
  \n你可以通过创建 `Saver` 并调用其 `save` 方法来创建这些：\n\n`save(sess, save_path, global_step=None,\
  \ latest_filename=None, meta_graph_suffix='meta', write_meta_graph=True, write_state=True)`\n\
  \n这些参数很容易理解。`sess` 是包含感兴趣变量的会话，`save_path` 标识包含保存数据的路径。`save_path` 的最后一个元素指定要生成的文件的文件。\n\
  \n如果设置了 `latest_filename`，`save` 将创建一个文本文件，列出保存操作涉及的文件路径。如果设置了 `global_step`，该值将附加到每个生成的文件中。\n\
  \n\n\n\n\n如果存储的变量不多，`save` 将仅生成三个文件：`output.data-00000-of-00001`、`output.index`\
  \ 和 `output.meta`。\n\n### 恢复变量\n\n`restore` 方法加载之前存储的变量。恢复变量的过程包含两个步骤：\n\n1. 调用\
  \ `import_meta_graph` 将变量的节点添加到当前图中。\n2. 调用 `restore` 访问变量数据。\n\n第一步是简单的。`tf.train.import_meta_graph`\
  \ 接受 `*.meta` 文件的路径，从文件中读取图数据，并将图的节点添加到当前图中。该函数返回一个 `Saver` 实例，允许你从加载的图中恢复变量。\n\n\
  例如，以下代码从 `output.meta` 导入图数据，并获取一个可以用于加载变量的 `Saver`：\n\n```\nsaver = tf.train.import_meta_graph(\"\
  output.meta\")\n```\n\n获取 `Saver` 后，应用程序可以通过调用其 `restore` 方法来加载变量，其方法签名如下：\n\n```\n\
  restore(sess, save_path)\n```\n\n与 `save` 方法一样，`sess` 标识包含变量的会话，`save_path` 是包含变量数据的文件的路径。该路径必须包含三个文件的名称（但不带后缀）。例如，以下代码使用\
  \ `saver` 将变量从 `output` 加载到当前图中：\n\n```\nsaver.restore(sess, os.getcwd() + \"/output\"\
  )\n```\n\n### 使用 SavedModels\n\n除了使用 `Saver` 存储变量外，你还可以通过创建 `SavedModel` 来存储应用程序的整个模型。如文档所述，`SavedModel`\
  \ 是“TensorFlow 模型的通用序列化格式”，并作为“导出 TensorFlow 图的标准方式”。\n\n准确来说，`SavedModel` 是一个包含\
  \ `*.pb` 或 `*.pbtxt` 文件的目录。该文件包含应用程序的模型，并将图定义存储在 `MetaGraphDef` 协议缓冲区中。除了该文件外，`SavedModel`\
  \ 还可能包含以下一个或多个子目录：\n\n* `variables`：包含应用程序变量的目录（文件与 `Saver` 的 `save` 方法产生的文件相似，但不包括\
  \ `*.meta` 文件）\n* `assets`：需要加载到图中的辅助文件\n* `assets.extra`：用户提供的、不需要加载到图中的文件\n\n\
  保存和恢复 `SavedModel` 在概念上并不困难，但代码会变得有点复杂。\n\n#### 保存 SavedModel\n\n将应用程序模型保存为 `SavedModel`\
  \ 的过程与存储变量的过程类似。但你不再是创建一个 `Saver`，而是需要创建一个 `tf.saved_model.builder.SavedModelBuilder`。构造函数接受一个参数，用于标识顶层目录：\n\
  \n```\nbuilder = tf.saved_model.builder.SavedModelBuilder(\"out\")\n```\n\n创建 `SavedModelBuilder`\
  \ 之后，你可以向模型中添加数据并将模型保存到指定的目录。要向模型中添加数据，你需要调用两个函数之一：`add_meta_graph` 或 `add_meta_graph_and_variables`。`add_meta_graph`\
  \ 的签名如下：\n\n```\nadd_meta_graph(tags, signature_def=None, assets_collection=None,\
  \ legacy_init_op=None, clear_devices=False, main_op=None)\n```\n\n元图通过称为 `tags`\
  \ 标签的字符串来标识其功能和用途。你可以通过设置 `tags` 参数来分配元图的标签。`tf_saved_model.tag_constants` 提供了三个常用标签：`GPU`、`SERVING`\
  \ 和 `TRAINING`。\n\n图的输入和输出构成了它的签名。在代码中，签名由 `SignatureDef` 表示，你可以通过调用 `tf.saved_model.signature_utils`\
  \ 包中的 `build_signature_def` 函数来创建它：\n\n```\nbuild_signature_def\n```\n\n为了创建签名，你需要将\
  \ `inputs` 和 `outputs` 设置为关联名称与 `TensorInfo` 协议缓冲区的字典。许多应用程序使用 `tf.saved_model.constants`\
  \ 中的常量。通过 `tf.saved_model.signature_utils.build_tensor_info` 可以获取张量的 `TensorInfo`：\n\
  \n```\nbuild_tensor_info(tensor)\n```\n\n`build_signature_def` 的 `method_name` 参数是一个作为签名方法的字符串。你可以将其设置为\
  \ `tf.saved_model.constants` 模块中的字符串之一，例如 `CLASSIFY_METHOD_NAME`。\n\n`add_meta_graph_and_variables`\
  \ 方法类似于 `add_meta_graph` 方法，但它多了一个参数。`add_meta_graph_and_variables` 的第一个参数是 `sess`，它标识提供元图变量的会话。\n\
  \n将元图添加到 `SavedModel` 后，可以通过调用 `save` 方法来存储 `SavedModel`。该方法接受一个 `as_text` 参数，用于标识协议缓冲区应保存为文本文件（*.pbtxt`）还是二进制文件（*.pb）。在默认情况下，`save`\
  \ 以二进制文件存储图数据。\n\n#### 加载 SavedModel\n\n虽然将元图保存为 `SavedModel` 很复杂，但加载它们很容易。你只需要知道一个函数：\n\
  \n```\ntf.saved_model.loader.load(sess, tags, export_dir, **saver_kwargs)\n```\n\
  \n该函数从 `export_dir` 和 `tags` 加载 `MetaGraphDef` 协议缓冲区。`sess` 参数标识包含元图变量、资源和签名的会话。\n\
  \n## 理论实践\n\n当我开始学习 TensorFlow 时，发现训练很难理解。除了理论之外，还需要处理许多新概念，如变量、优化器和占位符。\n\n为了解释训练的工作原理，我在示例代码中提供了\
  \ `ch5/simple_train.py`。该应用程序非常简单，甚至没有构建模型。相反，它使用简单的二次方程计算损失：$x² - 4x + 5$。图 5-4\
  \ 展示了这种形式。\n\n如图 5-4 所示，当 `x_var` 等于 2 时，损失达到全局最小值。因此，优化器的目标是更新 `x_var` 直到等于 2。列表\
  \ 5-1 中的代码展示了你如何在 TensorFlow 中实现这一目标。\n\n\n\n\n\n```python\n_, step, result, summary\
  \ = sess.run([optimizer, step_var, x_var, summary_op])\nprint('Step %d: Computed\
  \ result = %f' % (step, result))\n```\n\n## 打印摘要数据\n```python\nfile_writer.add_summary(summary,\
  \ global_step=step)\nfile_writer.flush()\n```\n\n## 存储变量数据\n```python\nsaver.save(sess,\
  \ os.getcwd() + '/output')\nprint('Final x_var: %f' %)\n```\n这段创建了两个变量：一个名为 `x_var`\
  \ 的可训练变量和一个名为 `step_var` 的不可训练变量。`loss` 被设置为一个二次方程，其自变量为 `x_var`。\n\n应用程序调用 `tf.global_variables_initializer`\
  \ 来获取一个初始化变量的操作。在优化过程中训练这些变量之前，会话必须执行此操作。\n\n在创建变量后，应用程序创建了一个 `GradientDescentOptimizer`（梯度下降优化器）并调用其\
  \ `minimize` 方法将 `loss` 降低到最小。然后，它将 `minimize` 方法的 `global_step` 参数赋值给 `step_var`。此赋值告诉会话在每次执行训练操作时递增\
  \ `step_var`。\n\n在每次训练操作后，`print` 会显示全局步数和 `x_var` 的当前值。随着训练的持续，`x_var` 接近 2，即损失最小点。同样，`step_var`\
  \ 接近 40，因为训练循环执行了 40 次迭代。\n\n优化完成后，应用程序将其变量存储到文件中。`Saver` 实例的 `save` 方法将变量数据存储到当前目录下的三个文件中：`output.data-00000-of-00001`、`output.index`\
  \ 和 `output.meta`。\n\n`ch5/restore_vars.py` 中的代码从新数据文件中加载 `x_var` 的值。列表 5-2 展示了该代码。\n\
  \n### 列表 5-2 从文件加载变量\n```python\n## 创建 session\nwith tf.Session() as sess:\n   \
  \ # 将存储的图加载到当前图中\n    saver = tf.train.import_meta_graph('output.meta')\n\n    #\
  \ 将变量恢复到图中\n    saver.restore(sess, os.getcwd() + '/output')\n\n    # 显示变量值\n  \
  \  print('Variable value: ', sess.run('x_result:0'))\n```\n重要的是，这段代码并不是通过调用该类的构造函数来创建\
  \ `Saver` 的。相反，它通过带有包含图数据的文件名调用 `import_meta_graph` 来获取 `Saver`。\n\n获取 `Saver` 后，应用程序通过调用\
  \ `Saver` 的 `restore` 方法和会话的 `run` 方法获取变量的值。尽管变量名是 `x_var`，但应用程序在调用 `run` 时使用的是\
  \ `x_output:0`，因为变量的 `name` 参数被设置为 `x_output`。\n\n## 可视化训练过程\n\n`ch5/simple_train.py`\
  \ 应用程序使用以下代码在每一步打印损失：\n\n```python\nprint(\"Step %d: Computed result = %f\" % (step,\
  \ result))\n```\n\nTensorFlow 提供了一种更好的方法来监控训练。第 4 章 介绍了 TensorBoard 工具，它可以读取由应用程序生成的摘要数据。`ch5/simple_train.py`\
  \ 中的代码通过以下步骤生成摘要数据来监控训练：\n\n1. 调用 `tf.summary` 写入摘要。\n2. 使用 `FileWriter` 写入数据。\n\
  3. 在每次训练操作后，调用 `flush`。\n4. 在实际训练中，以下代码显示了摘要数据：\n```python\nfile_writer.add_summary(summary,\
  \ global_step=step)\n```\n`global_step` 参数是重要的，图 5-5![图 5-5](img/09_9781119466215-ch05.xhtml#c05-fea-0002)\
  \ 展示了它。\n\n当优化完成后，应用程序将其变量存储到文件中。`Saver` 实例的 `save` 方法将变量数据存储到当前目录下的三个文件。\n\n`ch5/restore_vars.py`\
  \ 中的代码从新数据文件中加载 `x_var` 的值。列表 5-2 展示了该代码。\n\n## 会话钩子 (Session Hooks)\n\n在会话执行期间，你可以使用钩子来监控或执行特定的操作。会话钩子（Session\
  \ Hooks）允许你在会话生命周期的不同阶段运行代码。\n\n### 创建会话钩子\n\n要使用会话钩子，你需要了解 `SessionHook` 类的生命周期方法：\n\
  \n* `begin()`：在会话创建时调用。\n* `after_create_session(session)`：在图初始化后调用。\n* `before_run(run_context)`：在执行\
  \ `run` 之前调用。\n* `after_run(run_context, run_values)`：在执行 `run` 之后调用。\n* `end(session)`：在会话结束时调用。\n\
  \n重要的是 `begin` 和 `after_create_session` 之间的区别。应用程序在会话创建后立即调用 `begin`，此时你可以访问并修改图。但当调用\
  \ `after_create_session` 时，图的结构已经确定，无法更改。\n\n`before_run` 和 `after_run` 方法都提供一个\
  \ `run_context` 参数。这是一个 `SessionRunContext` 实例，它提供了四个成员：\n\n* `session`：关联的会话\n\
  * `original_args`：包含会话 `run` 方法参数的 `SessionRunArgs`\n* `stop_requested`：指示是否请求停止的布尔值\n\
  * `request_stop()`：告诉会话停止\n\n如果你想让会话钩子从图中读取值，可以编写 `before_run` 返回一个 `SessionRunArgs`\
  \ 实例。你需要将 `SessionRunArgs` 构造函数的参数设置为要访问的变量或张量的名称。\n\n如果你在 `before_run` 中添加了返回值，可以通过\
  \ `after_run` 方法的 `run_values` 参数获取所需的变量或张量。这个 `SessionRunValues` 对象有三个字段：\n\n*\
  \ `results`：通过 `before_run` 返回值访问的值\n* `options`：用于配置会话执行的 `RunOptions` 对象\n* `run_metadata`：包含会话执行信息的\
  \ `RunMetadata` 对象\n\n这种 `before_run` 和 `after_run` 之间的关系可能会让人困惑。为了澄清这两个方法是如何协同工作的，以下代码创建了\
  \ `SessionRunHook` 的子类，在会话运行前后打印信息：\n\n```python\nclass CustomHook(tf.train.SessionRunHook):\n\
  \    def before_run(self, run_context):\n        print(\"First argument: \", run_context.original_args.fetches)\n\
  ```\n\n\n\n\n```python\nreturn tf.train.SessionRunArgs(loss)\n\ndef after_run(self,\
  \ run_context, run_values):\n    print(\"Loss: \", run_values.results);\n```\n\n\
  在这段代码中，`before_run` 返回一个 `SessionRunArgs`，用于标识 `loss` 变量的名称。当 `after_run` 被调用时，`run_values`\
  \ 参数的 `results` 字段包含 `loss` 的当前值。\n\n## SessionRunHook 的子类\n\n你可以创建 `SessionRunHook`\
  \ 自己的子类，并为不同的生命周期方法添加代码。但在大多数情况下，实例化现有的子类更为简单。表 5-2 展示了 `tf.train` 包中每个会 hook 类的构造函数。\n\
  \n### 表 5-2 (#09_9781119466215-ch05.xhtml#rc05-tbl-0002) Session Hook 类\n\n| 类名\
  \ |or |\n| :--- | --- |\n| `LoggingTensorHook(tensors, every_n_iter=None, every_n_secs=None,\
  \ at_end=False, formatter=False)` | 在指定的步数后或指定时间后记录张量的值 |\n| `CheckpointSaverHook(checkpoint_dir,\
  \ save_secs=None, save_steps=None, saver=None, checkpoint_baseline='model.ckpt',\
  \ scaffold=None, listeners=None)` | 在指定的步数后或指定时间后将数据保存到检查点 |\n| `SummarySaverHook(save_steps=None,\
  \ save_secs=None, output_dir=None, summary_writer=None, scaffold=None, summary_op=None)`\
  \ | 在指定的步数后或指定时间后生成摘要数据 |\n| `StepCounterHook(every_n_steps=100, every_n_secs=None,\
  \ output_dir=None, summary_writer=None)` | 计算每秒的步数 |\n| `StopAtStepHook(num_steps=None,\
  \ last_step=None)` | 告诉 session 在执行指定步数或达到特定步数后停止 |\n| `NanTensorHook(loss_tensor,\
  \ fail_on_nan_loss)` | 如果 loss 等于 NaN 则停止训练 |\n| `GlobalStepWaiterHook(wait_until_step)`\
  \ | 延迟执行直到全局步数达到给定值 |\n| `FinalOpsHook(final_ops, final_ops_feed_dict=None)` | 在\
  \ session 结束时评估张量 |\n| `FeedFnHook(feed_fn)` | 运行给定函数并设置 session 的 feed dict |\n\
  \n前三个 session hook 类自动化了记录消息、保存变量和生成摘要数据的过程。你可以通过设置训练步数间隔（`every_n_iter` 或 `n_steps`）或时间间隔（`every_n_secs`\
  \ 或 `n_secs`）来指定操作的频率。自然地，你不能在同一个方法中设置两种类型的间隔。\n\n`StepCounterHook` 通过显示在给定时间范围内执行了多少训练步来告知\
  \ session 的性能。为了提供输出，它使用 summary writer 生成摘要数据。相比之下，`StopAtStepHook` 告诉 session\
  \ 在指定的全局步数值或指定数量的训练步数后停止。\n\n## 创建 MonitoredSession\n\n`MonitoredSession`并不是一个 `Session`，它包含一个\
  \ `Session` 实例并提供了与 session 交互的方法。例如，你可以通过调用 `run` 启动 `MonitoredSession` 的 session，通过调用\
  \ `close` 关闭 session。\n\n要创建一个 `MonitoredSession`，你需要调用它的构造函数：\n\n`MonitoredSession(session_creator=None,\
  \ hooks=None, stop_grace_period_secs=120)`\n\n第一个参数是 `SessionCreator` 实例，用于配置底层\
  \ session。TensorFlow 提供了 `SessionCreator` 的两个子类：`ChiefSessionCreator` 和 `WorkerSessionCreator`。`chief`\
  \ 和 `worker` 术语指的是分布式应用程序中不同的进程。\n\n你可以通过将 `hooks` 参数设置为 session hook 列表，将 session\
  \ hook 与 `MonitoredSession` 关联。最后一个参数 `stop_grace_period_secs` 设置了应用程序调用 `close`\
  \ 后，session 线程可以继续执行的秒数。\n\n`MonitoredSession` 类还提供名为 `should_stop` 的方法。应用程序经常使用此方法来确定\
  \ session 是否应该继续运行。session hook 可以通过其 `request_stop` 方法停止 session，该方法会调用监控 session\
  \ 的 `should_stop` 方法。以下代码演示了如何使用 `should_stop`：\n\n```python\nwith tf.train.MonitoredSession(hooks=[custom_hook])\
  \ as sess:\n    while not sess.should_stop():\n        sess.run(...)\n```\n\n这个\
  \ `should_stop` 方法对于分布式 TensorFlow 应用尤为重要。我在第 13 章 中讨论了分布式应用程序及其 session。\n\n##\
  \ 将理论付诸\n\n`ch5/monitor_train.py` 模块中的代码执行与 `ch5/simple_train.py` 模块中相同的训练操作。\n\n\
  ```python\n## 自定义 session hook\nclass CustomHook(tf.train.SessionRunHook):\n   \
  \ def begin(self):\n        print('Beginning the session!')\n\n    def before_run(self,\
  \ run_context):\n        return tf.train.SessionRunArgs(loss)\n\n    def after_run(self,\
  \ run_context, run_values):\n        if run_context.phase != 'init':\n         \
  \   print('Loss: ', run_values.results)\n\n    def end(self, session):\n       \
  \ print('The session is about end!')\n\n## 定义可训练变量\nx_var = tf.Variable(0., name='x')\n\
  \n## 定义一个不可训练的变量来存储全局步\nstep_var = tf.train.create_global_step()\n\n## 用变量表示 loss\n\
  loss = x_var * x_var - 4.0 * x_var + 5.0\n\n## 寻找最小 loss 的变量值\nlearn_rate = 0.1\n\
  num_epochs = 40\noptimizer = tf.train.GradientDescentOptimizer(learn_rate).minimize(loss,\
  \ global_step=step_var)\n\n## 初始化变量\ninit = tf.global_variables_initializer()\n\n\
  ## 创建摘要操作\nsummary_op = tf.summary.scalar('x', x_var)\n\n## 创建 hook\ncustom_hook\
  \ = CustomHook()\ncheckpoint_hook = tf.train.CheckpointSaverHook(checkpoint_dir='ckpt_dir',\
  \ checkpoint_basename='output', save_steps=10)\nsummary_hook = tf.train.SummarySaverHook(save_steps=10,\
  \ output_dir='log', summary_op=summary_op)\n\nhooks = [custom_hook, checkpoint_hook,\
  \ summary_hook]\n\n## 启动 session\nwith tf.train.MonitoredSession(hooks=hooks) as\
  \ sess:\n    sess.run(init)\n    for epoch in range(num_epochs):\n        sess.run(optimizer)\n\
  ```\n\n该模块创建了三个 session hook：\n\n*   `CustomHook`：在 session 执行的不同阶段打印消息\n*   `CheckpointSaverHook`：将检查点数据保存到\
  \ `ckpt_dir` 目录\n*   `SummarySaverHook`：将摘要数据保存到命名的 log\n\n在创建 session hook 后，该模块创建了一个\
  \ `MonitoredSession` 并配置了这三个 hook 实例。然后它初始化了 session 的变量并优化了模型。\n\n\n\n\n\n众周知，机器学习是一个对于聪明、有远见的人来说节奏快且令人兴奋的领域；而众周知，统计学是一个对于喜欢背景音乐的人来说是枯燥、死板的领域。因此，初学者可能会觉得在关于机器学习的书中看到关于统计分析的章节很奇特。\n\
  \n但机器学习和统计学有许多共同点。事实上，它们有相同的最终目标：用数学关系对真实世界的系统进行建模。机器学习高度依赖统计学方法，本章介绍了三种在 TensorFlow\
  \ 开发中起着至关作用的方法：线性回归、多项式回归和逻辑回归。此外，章中的示例代码巩了 TensorFlow 应用执行训练的方式。\n\n## 使用回归分析系统\n\
  \n统计学家使用的最有效工具之一是回归。`Regression` 通过测量系统变量之间的关系来分析系统。TensorFlow 为这种分析提供了许多功能，本章重点关注四种回归类型：\n\
  \n*   `线性回归`：对数据集中的点拟合直线\n*   `多项式回归`：对数据集中的点拟合多项式\n*   `二分类逻辑回归`：将点分为两个类别中的其中之一\n\
  *   `多分类逻辑回归`：将点分为多个类别中的其中之一\n\n接下来的章节将探索这些简单的操作。\n\n## 线性回归：为数据拟合直线\n\n在祖父的阁楼里搜寻时，你发现了一本品相完好的初版《速速指挥的太空之旅！》。这本稀有的漫画书可能价值数千美元，所以你决定把它卖掉。但你应该要多少钱呢？\n\
  \n在线搜索提供了 40 种售价，范围从 5,000 美元以下到 10,000 美元以上。图 6-1 在图表中展示了这些价格。\n\n![图 6-1：漫画书的价值随时间而增加。](img/9781119466215-fg0601.png)\n\
  \n图 6-1： 漫画书的价值随时间而增加。\n\n计算平均售价是很容易的，但你想知道价格是在上涨还是在下跌，以及上涨或下跌了多少。为了找到一个良好的售价，你决定用一条直线来近似你的数据，这条线表示书籍价格随时间的变化。这个过程被称为`线性回归`，而图\
  \ 6-1 中的虚线识别了漫画书价格的总体趋势。\n\nTensorFlow 训练的第一步涉及为模型选择初始表达式（参见第 5 章）。对于线性回归，这个决定很容易。模型是一条直线，其方程为\
