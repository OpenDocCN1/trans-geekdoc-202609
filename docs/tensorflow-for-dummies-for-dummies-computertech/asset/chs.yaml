  \ displaystyle=\"true\"><m:munderover><m:mo>&#8721;</m:mo><m:mrow><m:mi>i</m:mi></m:mrow></m:math>\n\
  \n这种方法被称为均方误差（MSE）。在 TensorFlow 中，你可以通过 `reduce_mean` 来计算它。\n\n损失值总是具有相同的符号。你可以通过计算每个点的误差平方并取误差值的平均值来确保所有损失值均为正。如果有\
