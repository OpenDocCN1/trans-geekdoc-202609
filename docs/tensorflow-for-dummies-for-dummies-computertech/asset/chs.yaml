  \nBN 使用单个批的均值和方差来估计整个总体的均值和方差。TensorFlow 使用移动平均计算总体的均值，并使用移动方差计算总体的方差。在测试期间，BN 使用总体均值和方差而不是批均值和方差对输入值进行缩放和偏移。\n\
  \n为了在代码中实现批量归一化，TensorFlow 提供了 `tf.contrib.layers.batch_norm`。表 7-3 列出了它的参数并对每个参数给出了描述。\n\
  \n### 表 7-3 (#12_9781119466215-ch07.xhtml#rc07-tbl-0003) tf.contrib.layers.batch_norm\
  \ 的参数\n\n| 参数 | 默认值 | 描述 |\n| --- | --- | --- |\n| `inputs` | -- | 要归一化的输入张量 |\n\
  | `decay` | 0.999 | 计算移动均值和方差的乘系数 |\n| `center` | True | 是否向归一化张量添加 beta |\n| `scale`\
  \ | False | 是否通过 gamma 缩放归一化张量 |\n| `epsilon` | 0.001 | 防止除零的因子 |\n| `activation_fn`\
  \ | None | 激活函数 |\n| `param_initializers` | None | beta、gamma、移动均值和移动方差的初始化器 |\n\
  | `param_regularizers` | None | beta 和 gamma 的正则化器 |\n| `updates_collections` |\
  \ `tf.GraphKeys.UPDATE_OPS` | 存放归一化操作的一个或多个集合 |\n| `is_training` | True | 归一化是否更新移动均值和移动方差\
  \ |\n| `reuse` | None | 是否可以重用变量 |\n| `variables_collections` | None | 存储归一化变量的集合\
  \ |\n\n\n\n\n\n| `outputs_collections` | `None` | 用于存储归一化输出的集合 |\n| `trainable`\
  \ | `True` | 是否将归一化变量添加到图的可训练集合中 |\n| `batch_weights` | `None` | 用于缩放批量均值和方差的权重\
  \ |\n| `fused` | `False` | 是否使用融合归一化（速度更快） |\n| `data_format` | `DATA_FORMAT_NHWC`\
  \ | 输入数据的格式 |\n| `zero_debias_moving_mean` | `False` | 更新移动均值的因子 |\n| `scope` |\
  \ `None` | 包含归一化变量的作用域 |\n| `renorm` | `False` | 是否在归一化过程中使用额外的变量 |\n| `renorm_clipping`\
  \ | `None` | 提供重归一化数值的字典 |\n| `renorm_decay` | `0.99` | 重归一化过程中更新移动均值/方差的因子 |\n\n\
  TensorFlow 使用 `decay` 参数来计算整体的均值和方差。以下公式展示了计算是如何进行的：\n\n![images](img/eq07017.png)\n\
  \n<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mtable columnalign=\"\
  left\"><m:mtr><m:mtd><m:msub><m:mi>&#956;</m:mi><m:mi>P</m:mi></m:msub><m:mo>=</m:mo><m:msub><m:mi>&#956;</m:mi><m:mi>P</m:mi></m:msub><m:mi>d</m:mi><m:mi>e</m:mi><m:mi>c</m:mi><m:mi>a</m:mi><m:mi>y</m:mi><m:mo>+</m:mo><m:msub><m:mi>&#956;</m:mi><m:mi>B</m:mi></m:msub><m:mrow><m:mo>(</m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:mi>d</m:mi><m:mi>e</m:mi><m:mi>c</m:mi><m:mi>a</m:mi><m:mi>y</m:mi></m:mrow><m:mo)</m:mo></m:mrow></m:mtd></m:mtr><m:mtr><m:mtd><m:msubsup><m:mi>&#963;</m:mi><m:mi>P</m:mi><m:mn>2</m:mn></m:msubsup><m:mo>=</m:mo><m:msubsup><m:mi>&#963;</m:mi><m:mi>P</m:mi><m:mn>2</m:mn></m:msubsup><m:mi>d</m:mi><m:mi>e</m:mi><m:mi>c</m:mi><m:mi>a</m:mi><m:mi>y</m:mi><m:mo>+</m:mo><m:msubsup><m:mi>&#963;</m:mi><m:mi>B</m:mi><m:mn>2</m:mn></m:msubsup><m:mrow><m:mo>(</m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:mi>d</m:mi><m:mi>e</m:mi><m:mi>c</m:mi><m:mi>a</m:mi><m:mi>y</m:mi></m:mrow><m:mo)</m:mo></m:mrow></m:mtd></m:mtr></m:mtable></m:math>\n\
  \n`center` 和 `scale` 参数决定了 `inputs` 参数的值是否应该被偏移和缩放。如果 `center` 为 `True`，函数将平移输入值；如果\
  \ `scale` 为 `True`，则将对输入值缩放。\n\n理解 `is_training` 和 `trainable` 之间的区别非常重要。将 `is_training`\
  \ 设置为 `True` 告诉函数归一化正在训练运行期间进行，这意味着它应该更新整体的均值和方差。将 `trainable` 设置为 `True` 则告诉函数将其归一化变量存储在由\
  \ `TRAINABLE_VARIABLES` 键表示的图集中。\n\n`batch_norm` 的最后三个参数与重归一化（renormalization）有关。当应用程序的批量小或相互依赖时，此过程可以改进归一化效果。\n\
  \n## 正则化\n\n机器学习中最困难的任务之一是为神经网络寻找合适的结构。如果你添加的节点太少，你的网络将过于简单，无法准确地分类数据。这被称为`欠拟合`（underfitting）。\n\
  \n如果你添加的节点太多，你的网络将专门针对你的训练集进行定制，而不适用于分析通用数据。这个问题被称为`过拟合`（overfitting），它是机器学习中的一个严重问题。\n\
  \n更新神经网络（或其他机器学习算法）以分析通用数据的过程被称为`正则化`（regularization）。研究人员发明了许多正则化网络的方法，本节重点关注两种：\n\
  \n*   **Dropout（丢弃）**：从网络中随机移除节点\n*   **L1/L2 正则化**：通过增加损失来减少权重\n\n对于这两种方法，我将解释正则化是如何工作的，以及你如何使用\
  \ TensorFlow 执行它们。\n\n#### Dropout\n\nDropout 过程从网络中随机移除节点。在 TensorFlow 中，你可以通过调用\
  \ `nn.dropout` 来配置 dropout。在该函数中`x` 是张量，`keep_prob` 是标量。\n\n```\nnn.dropout(x, keep_prob,\
  \ noise_shape=None, name=None)\n```\n\n#### L1/L2 正则化\n\nL1 和 L2 正则化通过减少权重来防止过拟合。在两种情况下，损失都会增加。在\
  \ TensorFlow 中执行 L1/L2 正则化，你可以调用 `contrib.layers.l1_regularizer` 或 `contrib.layers.l2_regularizer`：\n\
  \n*   `l1_regularizer(scope=None)`：执行 L1 正则化的函数\n*   `l2_regularizer(scope=None)`：执行\
  \ L2 正则化的函数\n\n这些函数返回正则化器。获取正则化器后，你可以通过 `contrib.layers.apply_regularization` 对权重进行正则化。\n\
  \n```\ncontrib.layers.apply_regularization(regularizer, weights_list=None)\n```\n\
  \n许多 TensorFlow 函数接受正则化器。其中一个重要的函数是 `contrib.layers.fully_connected`，我在“改进深度学习”部分中讨论过它。\n\
  \n## 使用作用域管理变量\n\n构建神经网络应用程序时，跟踪权重是一项任务任务。隐藏层接受加权输入并产生加权输出。如果没有适当的管理，层之间的权重名称可能会冲突。\n\
  \n### 变量作用域\n\n在深度学习应用中，层经常分配相同的名称。为了将变量分开，TensorFlow 允许定义变量的作用域。应用程序可以通过调用 `variable_scope`\
  \ 来定义作用域：\n\n```\nvariable_scope(name_or_scope, default_name=None, values=None,\
  \ initializer=None, regularizer=None, caching_device=None, partitioner=None, custom_getter=None,\
  \ reuse=None, dtype=None, use_resource=None)\n```\n\n应用程序通常作为 `with` 语句的一部分调用此函数，如下所示：\n\
  \n```python\nwith tf.variable_scope(\"MyScope\"):\n    …\n```\n\n如果应用程序在 `with`\
  \ 块中使用 `get_variable` 创建变量，TensorFlow 将将作用域名称添加到变量名称之前。这意味着，如果应用程序创建一个名为 `MyVar`\
  \ 的新变量，该变量的全名称将为 `MyScope/MyVar`。\n\n第 5 章解释了如何使用 `tf.Variable` 创建变量，但如果应用程序要在作用域内创建变量，则调用的函数是\
  \ `get_variable`。\n\n\n\n\n\n`get_variable(name, shape=None, dtype=None, initializer=None,\
  \ regularizer=None, trainable=True, collections=None, caching_device=None, partitioner=None,\
  \ validate_shape=True, use_resource=None, custom_getter=None)`\n\n如果 `name` 参数标识当前作用域中的一个变量，且作用域的\
  \ `reuse` 参数设置为 `True`，`get_variable` 将返回现有变量。以下代码显示了如何使用 `tf.get_variable`：\n\n\
  ```python\nwith tf.variable_scope(\"MyScope\"):\n    var = tf.get_variable(\"var\"\
  , [1])\n\nwith tf.variable_scope(\"MyScope\", reuse=True):\n    same = tf.get_variable(\"\
  var\") # 与 var 相同\n```\n\n如果 `variable_scope` 的 `name` 参数与作用域中现有的变量对应，函数将创建一个新变量。`initializer`\
  \ 参数决定变量的初始值。如果未设置此参数，则初始值将由周围作用域的 `initializer` 参数决定。如果周围作用域的 `initializer` 参数未设置，TensorFlow\
  \ 将使用 Glorot 初始化来初始化变量。\n\n### 从集合中检索变量\n\n正如第 4 章中讨论的，图通过一组集合（collections）存储操作和张量。应用程序可以通过调用\
  \ `tf.get_collection` 从集合中检索变量：\n\n```python\ntf.get_collection(key, scope=None)\n\
  ```\n\n`key` 参数标识图的集合之一。一个重要的键是 `tf.GraphKeys.TRAINABLE_VARIABLES`，它标识包含图中可训练变量的集合。\n\
  \n`scope` 参数标识应从中检索变量的作用域。例如，以下代码访问了包含 `hidden_layer_1` 作用域中所有可训练变量的列表：\n\n```python\n\
  tf.get_collection(tf.GraphKeys.TRAINABLE_VARIABLES, 'hidden_layer_1')\n```\n\n###\
  \ 名称和参数的作用域\n\n正如 `tf.variable_scope` 为变量创建作用域一样，`tf.name_scope` 为张量和操作创建作用域。该函数非常易于使用，以下代码显示了它的工作原理：\n\
  \n```python\nwith tf.name_scope('block1'):\n    t = tf.constant([1., 2.], name='tens')\n\
  ```\n\n此示例在标识符为 `block1` 的名称作用域内部创建了张量 `t`。结果，TensorFlow 将 `t` 的完整标识符设置为 `block1/tens`。\n\
  \n`tf.contrib.framework` 包提供了一个名为 `arg_scope` 的有用函数：\n\n```python\narg_scope(list_ops_or_scope,\
  \ **kwargs)\n```\n\n该函数创建一个作用域，将参数插入到作用域列出的操作中。也就是说，对于第一个参数中标识的每个操作，`arg_scope`\
  \ 插入第二个参数中提供的参数。\n\n一个示例说明了参数作用域是如何工作的。由于以下代码的作用，作用域内的每个 `foo` 调用都将把 `var` 设置为 `39`：\n\
  \n```python\nfrom tensorflow.contrib.framework import arg_scope\n\nwith arg_scope([foo],\
  \ var=39):\n    …\n```\n\n为了在参数作用域中访问某个操作，你必须用 `@add_arg_scope` 装饰操作的定义。如果一个函数需要许多参数且必须被多次调用，可以通过在参数作用域中设置参数来显著减少所需代码量。\n\
