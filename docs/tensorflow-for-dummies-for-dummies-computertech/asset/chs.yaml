  \ MNIST 图像进行分类的应用程序。\n\n| 参数 | 默认值 | 描述 |\n| :--- | :--- | :--- |\n| `inputs` |\
  \ -- | 输入张量 |\n| `num_outputs` | -- | 输出节点数量 |\n| `activation_fn` | `tf.nn.relu`\
  \ | 激活函数 |\n| `normalizer_fn` | `None` | 归一化函数 |\n| `normalizer_params` | `None`\
  \ | 传递给归一化的参数 |\n| `weights_initializer` | `initializers.xavier_initializer()` |\
  \ 权重初始化 |\n| `weights_regularizer` | `None` | 权重正则化 |\n| `biases_initializer` |\
  \ `tf.zeros_initializer` | 偏置初始化 |\n| `biases_regularizer` | `None` | 偏置正则化 |\n\
  | `reuse` | `None` | 是否复用该层 |\n| `variables_collections` | `None` | 变量集合 |\n| `outputs_collections`\
  \ | `None` | 输出集合 |\n| `trainable` | `True` | 是否是可训练的 |\n| `scope` | `None` | 作用域\
  \ |\n\n全连接层需要 `inputs` 是一个至少两个维的张量。如果 `tf_connected` 是添加输入层，应用程序应设置 `inputs` 为提供数据的占位符。对于连续层，应用程序应设置\
  \ `inputs` 为前一个层函数的返回值。\n\n\n\n\n\n`ch7/tuned_learning.py` 模块中的代码执行与本章之前介绍的 `ch7/deep_learning.py`\
  \ 相同的 MNIST 分类。区别在于它对神经网络进行了调优以提高准确率和性能。它通过调用 `tf.contrib.layers.fully_connected`\
  \ 而不是 `tf.add` 和 `tf.matmul` 来创建全连接层。列表 7-2 展示了代码。\n\n### 列表 7-2 带调优的深度学习\n\n```python\n\
  ## Read MNIST data\ndataset = learn.datasets.mnist.read_data_sets('MNIST-data',\
  \ one_hot=True)\n\n## Placeholders for MNIST images\nimg_holder = tf.placeholder(tf.float32,\
  \ [None, 784])\nlbl_holder = tf.placeholder(tf.float32, [None, 10])\ntrain = tf.placeholder(tf.bool)\n\
  \n## Layer settings\nhid_nodes = 200\nout_nodes = 10\nkeep_prob = 0.5\n\n## Create\
  \ layers\nwith tf.contrib.framework.arg_scope(\n    [fully_connected],\n    normalizer_fn=tf.contrib.layers.batch_norm,\n\
  \    normalizer_params={'is_training': train}):\n    layer1 = fully_connected(img_holder,\
  \ hid_nodes, scope='layer1')\n    layer1_drop = tf.layers.dropout(layer1, keep_prob,\
  \ training=train)\n    layer2 = fully_connected(layer1_drop, hid_nodes, scope='layer2')\n\
  \    layer2_drop = tf.layers.dropout(layer2, keep_prob, training=train)\n    layer3\
  \ = fully_connected(layer2_drop, hid_nodes, scope='layer3')\n    layer3_drop = tf.layers.dropout(layer3,\
  \ keep_prob, training=train)\n    out_layer = fully_connected(layer3_drop, out_nodes,\n\
  \    activation_fn=None, scope='layer4')\n\n## Compute loss\nloss = tf.reduce_mean(\n\
  \    tf.nn.softmax_cross_entropy_with_logits(\n    logits=out_layer, labels=lbl_holder))\n\
  \n## Create optimizer\nlearning_rate = 0.01\nnum_epochs = 15\nbatch_size = 100\n\
  num_batches = int(dataset.train.num_examples/batch_size)\noptimizer = tf.train.AdamOptimizer(learning_rate).minimize(loss)\n\
  \n## Initialize variables\ninit = tf.global_variables_initializer()\n\n## Launch\
  \ session\nwith tf.Session() as sess:\n    sess.run(init)\n\n    # Loop over epochs\n\
  \    for epoch in range(num_epochs):\n        # Loop over batches\n        for batch\
  \ in range(num_batches):\n            img_batch, lbl_batch = dataset.train.next_batch(batch_size)\n\
  \            sess.run(optimizer, feed_dict={img_holder: img_batch,\n           \
  \ lbl_holder: lbl_batch, train: True})\n\n        # Determine success rate\n   \
  \     prediction = tf.equal(tf.argmax(out_layer, 1), tf.argmax(lbl_holder, 1))\n\
  \        success = tf.reduce_mean(tf.cast(prediction, tf.float32))\n        print('Success\
  \ rate: ', sess.run(success,\n        feed_dict={img_holder: dataset.test.images,\n\
  \        lbl_holder: dataset.test.labels, train: False}))\n```\n\n该模块采用了三种方法来调优其多层神经网络：\n\
  \n* 它将每个全连接层的输出发送到 丢弃层（dropout layer）。该模块将 `keep_prob` 设置为 0.5。\n* 它通过 `tf.contrib.layers.batch_norm`\
  \ 对隐藏层进行批量归一化。\n* 默认情况下，`tf.contrib.layers.fully_connected` 使用 Glorot 方法初始化隐藏层的权重。\n\
  \n隐藏层有 200 个节点，输出层有 10 个节点。在创建层之前，该模块通过 `tf.contrib.framework.arg_scope` 定义了参数作用域（arg_scope）。\n\
  \n`arg_scope` 接收一个包含函数（`fully_connected`）的列表。每个 `fully_connected` 调用都会设置 `scope`\
  \ 参数。\n\n该应用通过 `tf.get_collection` 获取这些变量。\n\n前三个 `fully_connected` 调用没有设置 `activation_fn`，因此使用默认的\
  \ ReLU 激活函数。最后一个 `fully_connected` 调用将 `activation_fn` 设置为 `None`，因此输出层节点计算。\n\n\
  # 使用卷积神经网络 (CNN) 进行图像分类\n\n## 引言\n\n本章将介绍如何使用 TensorFlow 处理图像相关的任务。\n\n如果你用过像 Photoshop\
  \ 这样的图像编辑软件，可能对滤镜熟悉，例如模糊、锐化。从数学上讲，这些工具执行一种被称为`卷积`的过程。卷积将每个像素替换为点积的结果。\n\n你可以通过将\
  \ A 和 B 的对应值相乘并相加来计算它们的二维点积：例如，假设 A 和 B 是 3x3 矩阵，其元素如下：\n\n$$A = \\begin{bmatrix}\
  \ 1 & 2 & 3 \\\\ 4 & 5 & 6 \\\\ 7 & 8 & 9 \\end{bmatrix}, B = \\begin{bmatrix} 10\
  \ & 9 & 8 \\\\ 7 & 6 & 5 \\\\ 4 & 3 & 2 \\end{bmatrix}$$\n\n## 卷积\n\n卷积操作是通过一个小型矩阵（称为卷积核或滤波器）在图像上移动来实现的。在每个位置，卷积核与图像块之间执行元素级乘法，并将结果求和产生输出特征图的单个像素值。\n\
  \n从数学上看，对于输入图像 $I$ 和大小为 $k \\times k$ 的卷积核 $K$，$(i, j)$ 处的输出 $S$ 计算如下：\n\n$$S(i,\
  \ j) = \\sum_{m=0}^{k-1} \\sum_{n=0}^{k-1} I(i+m, j+n) \\cdot K(m, n)$$\n\n在深度学习中，这些卷积核是在训练过程中学习的参数，允许网络自动检测边缘、纹理和复杂物体等特征。\n\
  \n## 池化层\n\n为了减少特征图的空间维度，使用了池化层。常见的类型是最大池化（max pooling），它从每个窗口中选择最大值。这有助于减少计算负载，并对输入的微小平移提供某种程度不变性。\n\
  \n## 卷积神经网络\n\nCNN 由多个卷积层后若干池化层组成，最后通过全连接层进行分类。这种架构对于处理具有网格拓扑结构的数据（如图像）特别有效。\n\n\
  \n\n\n\n![images](img/eq08002.png)\n\n$1(-10) + 2(-9) + 3(-8) + 4(-7) + 5(-6) +\
  \ 6(-5) + 7(-4) + 8(-3) + 9(-2) = -210$\n\n参与图像卷积的第一个矩阵是围绕图像某个像素的 $M \\times N$\
  \ 矩形。参与点积的第二个 $M \\times N$ 矩阵通常被称为 `kernel`（内核），但 TensorFlow 将称为 `filter`（滤波器）。滤波器的元素决定了该滤波器对图像产生的影响。\n\
  \n例如，如果你将图像标记为矩阵 `M`，那么第 $i$ 行第 $j$ 列的像素为 `m[i,j]`。如果你将滤波器标记为矩阵 `K`，那么第 $i$ 行第 $j$\
  \ 列的元素为 `k[i,j]`。使用这种符号，卷积过程通过以下点积获得 `m[i,j]` 的新值：\n\n![images](img/eq08003.png)\n\
  \n$mi,j = |m[i-1,j-1] + m[i-1,j] + m[i-1,j+1] + m[i,j-1] + m[i,j] + m[i,j+1] + m[i+1,j-1]\
  \ + m[i+1,j] + m[i+1,j+1]| \\cdot |k_{0,0} + k_{0,1} + k_{0,2} + k_{1,0} + k_{1,1}\
  \ + k_{1,2} + k_{2,0} + k_{2,1} + k_{2,2}|$\n\n\n\n\n\n对图像进行过滤时，必须对原始图像中的每个像素计算此点积。这一操作涉及一个重要问题：如果像素\
  \ `m[i,j]` 位于图像的边界，你如何找到它周围的像素？\n\n![technicalstuff](img/technicalstuff.png)\n\n\
  许多工程师并不是对每个像素计算点积，而是通过将图像和滤波器转换为频率域来执行卷积。这个过程被称为 `fast convolution`（快速卷积），它涉及对图像和滤波器的每一行和每一列计算快速傅里变换（FFT）。\n\
  \n本书和其他机器学习文献的其他优秀佳作一样，使用“卷积”一词来泛指代计算二维点积矩阵的过程。但这种操作的专业术语是 `cross-correlation`（互相关）。卷积在计算点积之前会对其中一个操作数进行反转，而这里介绍的算法并没有反转任何一个操作数。\n\
  \n## 平均滤波器\n\n理解图像过滤的一种良好方法是看一个例子。本节重点关注图 8-1 中所示的颗粒状图像。\n\n![FIGURE 8-1: 图像的斑驳外观是噪声的结果。](img/9781119466215-fg0801.png)\n\
  \nFIGURE 8-1: 图像的斑驳外观是噪声的结果。\n\n从数学角度上看，图像的噪声可以被看作相邻像素之间不希望的变化。你可以通过将每个像素替换为其与周围相邻像素的平均值来减少这种变化。你可以通过将图像与如下滤波器卷积来实现这一点：\n\
