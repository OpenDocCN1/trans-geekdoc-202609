  ]</m:mo></m:mrow></m:mtd></m:mtr></m:mtable></m:math>\n\n请记住，在门控内部，底层的单元的行为类似于 RNN\
  \ 单元。也就是说，它依赖于（默认情况下）`tanh` 函数作为其激活函数。\n\nHolmes 的观点与 LSTM 发明者的观点非常相似。普通的 RNN 存储它接收到的所有数据，而\
  \ LSTM 只存储它需要的数据并丢弃其他所有内容。这种效率的提高解释了为什么基于 LSTM 的应用比基于 RNN 的应用具有更好的性能和灵活性。\n\n##\
  \ 在代码中创建 LSTM\n\n在 TensorFlow 中，创建 LSTM 的过程与创建普通的 RNN 类似：创建一个单元类的实例，并基于该单元形成 RNN。第二步需要使用与前面的章节“[创建\
  \ RNN 单元（Creating RNN cells）14_9781119466215-ch09.xhtml#c09-sec-0005)”中相同的 `static_rnn`\
  \ 和 `dynamic_rnn` 函数。\n\n`tf.nn.rnn_cell` 包提供了几个表示 LSTM 单元的类，基础类是 `BasicLSTMCell`\
  \ 和 `LSTMCell`。前者更容易使用，但后者提供了更多自定义选项。\n\n### 设置状态\n\n在普通的 RNN 中，你可以使用大小为[`batch_size`,\
  \ `state_size]` 的矩阵设置初始状态。但要初始化 LSTM 网络的状态，你需要提供一个包含两个状态矩阵的元组：一个用于标识单元状态，另一个用于标识隐藏状态。\n\
  \n为了简化初始化，`tf.nn.rnn_cell` 模块提供了一个名为 `LSTMStateTuple` 的类，它的构造函数接受这两个状态矩阵。将批大小表示为`batch_sz`，状态大小表示为\
  \ `state_sz`，以下代码创建了一个适用于初始化 LSTM 网络状态的 `LSTMStateTuple`：\n\n```\ncstate = tf.placeholder(tf.float32,\
  \ [batch_sz, state_sz])\nhstate = tf.placeholder(tf.float32, [batch_sz, state_sz])\n\
  init = tf.nn.rnn_cell.LSTMStateTuple(cstate, hstate)\n```\n\n创建 `LSTMStateTuple`\
  \ 后，应用程序可以将其赋值给 `static_rnn` 和 `dynamic_rnn` 等函数中的 `initial_state` 参数。\n\n### BasicLSTMCell\
  \ 类\n\n从开发者的角度来看，`BasicLSTMCell` 类与 `BasicRNNCell` 几乎相同。与 `BasicRNNCell` 构造函数一样，`BasicLSTMCell`\
  \ 的构造函数接受每个单元生成的单元数量。完整的构造函数如下：\n\n```\nBasicLSTMCell(num_units)\n```\n*(注：原文示例中\
  \ `BasicLSTMCell` 后的代码不完整，此处根据上下文理解为构造函数定义)*\n\n```\nBasicLSTMCell(num_units,\n\
  forget_bias=1.0,\nstate_is_tuple=True,\nactivation=tf.tanh)\n```\n`BasicLSTMCell`\
  \ 构造函数接受每个单元生成的单元数量。在创建 LSTM 之后，可以通过调用 `static_rnn` 或 `dynamic_rnn` 创建基于 `BasicLSTMCell`\
  \ 的 RNN。`forget_bias` 参数在 LSTM 的输入处添加了遗忘偏置。例如，以下代码创建了一个具有 7 个单元的 LSTM：\n\n```\n\
  lstm_cell = tf.nn.rnn_cell.BasicLSTMCell(7)\noutputs, _ = tf.nn.static_rnn(lstm_cell,\
  \ [input_holder], dtype=tf.float32)\n```\n\n### LSTMCell 类\n\n为了节省内存，可以使用 `LSTMCell`\
  \ 代替 `BasicLSTMCell`。`LSTMCell` 的构造函数如下：\n\n```\nLSTMCell(num_units,\ninitializer=None,\n\
  use_bias=False,\nmemory_size=None,\nstate_is_tuple=True,\nactivation=None)\n```\n\
  `LSTMCell` 构造函数接受每个单元生成的单元数量。如果你将 `cell_clip` 赋值为浮点值，该函数将限制激活函数的输出。为了减少输入维度，可以使用名为投影矩阵的矩阵乘以输入。`num_proj`\
  \ 参数标识投影的维度。如果你将 `num_proj` 设置为大于 0 的值，可以使用 `proj_clip` 限制范围。`cell_clip` 参数可以防止梯度爆炸。\n\
  \n### 使用 LSTM 预测文本\n\n`ch9/lstm_lovecraft.py` 中的代码与 `ch9/rnn_lovecraft.py` 执行相同的文本预测。唯一的区别是它基于\
  \ `LSTMCell` 创建 RNN。它通过以下代码创建 RNN：\n\n```\ncell = tf.nn.rnn_cell.LSTMCell(num_hidden)\n\
  outputs, state = tf.nn.dynamic_rnn(cell, [input_holder], dtype=tf.float32)\n```\
  \ \n\n`ch9/lstm_lovecraft.py` 的其余代码与 `ch9/rnn_lovecraft.py` 完全。应用程序从 `lovecraft.txt`\
  \ 读取文本，并将六个元素的批量输入 RNN。它将 RNN 的输出与权重矩阵相乘，加上偏置，并使用 `AdagradOptimizer` 最小化损失。\n\n\
  正如预期的，我的实验支持 LSTM 比原生 RNN 更有效地处理序列的结论。在我的系统上，RNN 平均需要 35.54 秒达到 95% 的准确率，而 LSTM\
  \ 平均需要 33.48 秒。\n\n## 门控循环单元 (GRU)\n\n2014 年，Kyunyun Cho、Bart van Merrienboer、Dzmitry\
  \ Bahdanau 和 Yoshua Bengio 写了一篇名为《神经机器翻译的属性：编码器-解码器方法》的论文。在文中，他们提出了一种用于检查变长度序列的新型\
  \ RNN，称为门控递归网络。今天，开发者将他们的网络结构称为门控循环单元（GRU）。\n\n与 LSTM 类似，GRU 使用门控来控制单元的数据流。但这两个单元有三个重要的区别：\n\
  \n* GRU 单元具有隐藏状态 (`h[t]`)，但没有单元状态 (`C[t]`)。\n* GRU 单元使用重置门来代替输入门，并使用更新门代替遗忘门。\n\n\
  \n\n\n\n*   GRU 单元没有任何输出门机制。\n\n主要的区别在于 GRU 有两个门，称为重置门（reset gate）和更新门（update gate），而\
  \ LSTM 有三个门。GRU 的重置门对应于 LSTM 的输入门， GRU 的更新门对应于 LSTM 的遗忘门。GRU 不使用门来限制单元的输出。图 9-6\
  \ 展示了一个 GRU 单元及其门控结构。\n\n![图 9-6：GRUs 与 LSTMs 相似，但它们有两个门而不是三个。](img/9781119466215-fg0906.png)\n\
  \n图 9-6： GRU 与 LSTM 相似，但它们有两个门而不是三个。\n\nGRU 缺少输出门似乎像是一个表面的区别，但更简单的结构意味着应用程序训练 GRU\
  \ 的速度比 LSTM 快得多。\n\n## 在代码中创建 GRU\n\n基于 GRU 单元创建 RNN 的过程与创建普通 RNN 非常相似。区别在于应用程序需要将\
  \ RNN 单元设置为 `tf.nn.rnn_cell.GRUCell` 类的实例。该类的构造函数如下：\n\n```\nGRUCell(num_units,\
  \ activation=None, reuse=None, kernel_initializer=None, bias_initializer=None)\n\
  ```\n\n第三个参数命名为 `kernel_initializer`；它与第 8 章中讨论的滤波内核没有关系。`kernel_initializer` 设置单元的初始权重，`bias_initializer`\
  \ 设置其偏置。\n\n### 使用 GRU 预测文本\n\n`ch9/gru_lovecraft.py` 中的代码执行与 `ch9/rnn_lovecraft.py`\
  \ 和 `ch9/lstm_lovecraft.py` 中代码相同的文本预测。唯一的区别是它使用 `GRUCell` 创建了 RNN，如下文所示：\n\n```\n\
  cell = tf.nn.rnn_cell.GRUCell(num_hidden)\noutputs, _ = tf.nn.static_rnn(cell, [input_holder],\
  \ dtype=tf.float32)\n```\n\n我的实验表明，GRU 在训练效率上比 LSTM 和原生 RNN 高出得多。在我的系统上，GRU 平均需要\
  \ 29.17 秒达到 95% 的准确率，而 LSTM 平均需要 33.48 秒，RNN 平均需要 35.54 秒。\n\n# 第 3 部分\n\n# 简化和加速\
  \ TensorFlow\n\n在本部分中……\n\n通过通过将数据加载到数据集中并使用迭代器提取数据，简化您的应用程序。\n\n探索 TensorFlow 的高级\
  \ Estimator API 以及适用于机器学习的预构建估计器。\n\n通过在多个线程和设备上部署执行来加速您的机器学习任务。\n\n利用 Google 机器学习引擎的强大力量来实现高性能的\
  \ TensorFlow 执行。\n\n# 第 10 章\n\n# 使用数据集和迭代器访问数据\n\n在本章中\n\n![check](img/check.png)**创建和操作数据集**\n\
  \n![check](img/check.png)**加载和存储 TFRecord 数据**\n\n![check](img/check.png)**探索四种迭代器类型**\n\
  \n当你开始学习机器学习时，你最大的愿望是让应用程序收敛到解决方案。但随着你在这个领域的不断进步，你会越来越关注性能。当你的训练数据占用数 GB 或 TB 内存时，性能变得尤为重要。\n\
  \n本章及接下来的两章将关注提高 TensorFlow 性能的方法——不再有冗长的方程或几何图。相反，我专注于你可以用来加速应用程序的能力。两个重要的能力是数据集和迭代器，它们使得加载和处理输入数据变得更容易。\n\
  \n## 数据集提高提高性能的一种有效方法涉及创建线程。现代处理器具有多个核心，开发者可以通过将应用程序的工作负载划分到线程来利用这些核心。当应用程序需要加载大量数据时，这种多线程变得特别有用。\n\
  \n过去，TensorFlow 开发者通过构建 `QueueRunner` 类的实例来创建线程。但从 1.4 版本开始，TensorFlow 建议使用 `Dataset`\
  \ 代替 `QueueRunner`。`Dataset` 不仅仅是一个大数据块——它提供了一个用于加载和处理数据的高性能流水线。\n\n在一般的 TensorFlow\
  \ 应用中，处理数据集的过程包含三个步骤：\n\n1.  **从数据或文件创建数据集。**\n2.  **将数据集拆分为批次并根据需要对批次进行预处理。**\n\
  3.  **在会话处理数据集的批次。**\n\n你可以通过调用 `Dataset` 类的方法执行前两个步骤。下面的讨论将探索这些方法并展示如何使用它们。\n\n\
  ## 创建数据集\n\n在实践中，数据集是训练/测试数据的容器，其元素是应用程序用于向会提供数据的批次（batches）。第 5 章详细解释了分批处理（batching）主题。\n\
  \n你可以通过调用 `Dataset` 类的方法执行前两个步骤。下面的讨论将探索这些方法并展示如何使用它们。\n\n#### 从数据创建数据集\n\n你可以从数据、文本文件或二进制文件创建数据集。\n\
  \n### 创建数据集的函数\n\n|  | 描述 |\n| :--- | :--- |\n| `range(*args)` | 创建包含范围的数据集 |\n\
  | `from_tensors(tensors)` | 创建组合输入的数据集 |\n| `from_tensor_slices(tensors)` | 创建每行包含一个元素的数据集\
  \ |\n| `from_sparse_tensor_slices(sparse_tensor)` | 创建稀疏张量每行包含一个元素的数据集 |\n| `from_generator(generator,output_types,output_shapes=None)`\
  \ | 从给定的生成器创建数据集 |\n\n\n\n\n\n## 2. 通过调用函数获取生成器对象。\n\n根据你的 Python 版本继续执行第 3 步或第\
  \ 4 步。\n\n### 3. 在 Python 2.x 中，调用对象的 `next` 方法来调用生成器函数。\n\n### 4. 在 Python 3.x\
  \ 中，调用内置的 `next` 函数并传入生成器对象。\n\n例如，以下生成器最多返回四个整数：\n\n```python\ndef simple_gen():\n\
  \    i = 0\n    while i < 4:\n        yield(i)\n        i += 1\n```\n\n以下代码获取生成器对象并调用\
  \ `next` 来访问生成器的前三个值：\n\n```python\nsimple_iter = simple_gen()\nnext(simple_iter)\n\
  next(simple_iter)\nnext(simple_iter)\n```\n\n`from_generator` 方法创建一个包含生成器产生的每个值对应元素的数据集。应用程序必须将该方法的\
  \ `generator` 参数设置为生成器函数，并将 `output_types` 参数设置为能够识别生成器值类型的结构。\n\n例如，以下代码从 `simple_gen`\
  \ 生成器创建一个数据集：\n\n```python\ndset = tf.data.Dataset.from_generator(simple_gen, output_types=tf.int32)\n\
  ```\n\n`simple_gen` 返回的生成器产生四个值。因此，`from_generator` 返回一个包含四个元素的数据集：每个元素对应一个整数。\n\
  \n### 从文本创建数据集\n\n你可以通过创建 `TextLineDataset` 实例（它是 `Dataset` 的子类）创建一个包含文本文件行的数据集。该类的构造函数如下：\n\
  \n```python\nTextLineDataset(filenames, compression_type=None, buffer_size=None)\n\
  ```\n\n要调用此构造函数，你需要将 `filenames` 赋值给包含一个或多个文件的张量。默认情况下，构造函数假设文件包含未压缩的文本。但如果你将 `compression_type`\
  \ 设置为 `ZLIB` 或 `GZIP`，构造函数会在访问数据之前解压缩存档。\n\n`TextLineDataset` 将为输入文件的每一行包含一个字符串元素。例如，如果\
  \ `test1.txt` 有三行而 `test2.txt` 有四行，以下代码将创建一个包含七个字符串的数据集：\n\n```python\nds = TextLineDataset(['test1.txt',\
  \ 'test2.txt'])\n```\n\n在将字符串读入数据集后，你可以使用 `Iterator` 遍历它们。我将在章节稍后的部分“Iterators”中解释什么是\
  \ `Iterator`。\n\n### 从二进制文件创建数据集\n\n除了文本文件外，如果文件包含 TFRecords，TensorFlow 支持从二进制文件创建数据集。当你需要访问大量数据时，TFRecords\
  \ 非常有用，但它们非常复杂且文档较少。将 TFRecord 数据存储到文件的总体过程包含三个步骤：\n\n1. 创建一个 `tf.train.Example`\
  \ 来保存你想存储的数据。\n2. 通过调用 `SerializeToString` 方法将 `tf.train.Example` 存储为协议缓冲区（protocol\
  \ buffer）。\n3. 创建一个 `tf.python_io.TFRecordWriter` 并使用它将协议缓冲区写入 TFRecord 文件。\n\n\
  与数据集一样，`Example` 存储训练和测试数据。与数据集不同，它们将数据存储在名为 `features` 的键值对中。每个特征由一个 `tf.train.Feature`\
  \ 表示，你可以通过调用其构造函数并传入包含一个或多个 `Feature` 的 `tf.train.Features` 对象来创建一个 `Example`。处理这些类可能会令人困惑，因此我尽力解释清楚：\n\
  \n*   在 `tf.train.Example` 构造函数中，`features` 参数接受 `tf.train.Features` 实例。\n*   在\
  \ `tf.train.Features` 构造函数中，`feature` 参数接受一个名称与 `tf.train.Feature` 实例关联的字典。\n* \
  \  在 `tf.train.Feature` 构造函数中，`bytes_list` 参数接受 `tf.train.BytesList`，`float_list`\
  \ 参数接受 `tf.train.FloatList`，而 `int64_list` 参数接受 `tf.train.Int64List`。\n\n在 `tf.train.Example`\
  \ 构造函数中，`features` 参数接受 `tf.train.Features` 实例。\n\n在 `tf.train.Features` 构造函数中，`feature`\
  \ 参数接受一个名称与 `tf.train.Feature` 实例关联的字典。\n\n在 `tf.train.Feature` 构造函数中，`bytes_list`\
  \ 参数接受 `tf.train.BytesList`，`float_list` 参数接受 `tf.train.FloatList`，而 `int64_list`\
  \ 参数接受 `tf.train.Int64List`。\n\n以下代码创建 `Example` 特征：\n\n```python\nfeat_a = tf.train.Feature(bytes_list=tf.train.BytesList(value=[b\"\
  abc\"]))\nfeat_b = tf.train.Feature(float_list=tf.train.FloatList(value=[1.0]))\n\
  feat_c = tf.train.Feature(int64_list=tf.train.Int64List(value=[42]))\nexample =\
  \ tf.train.Example(features=tf.train.Features(feature={'a': feat_a, 'b': feat_b,\
  \ 'c': feat_c}))\n```\n\n以下代码从 `Example` 创建数据集：\n\n```python\ndataset = tf.data.TFRecordDataset('example.tfrecord')\n\
  ```\n\n\n\n\n我将在稍后的“转换数据集”章节中讨论 `map` 方法。现在，重要的是知道 `map` 会将 `dataset` 替换为新的 `Dataset`，该新\
  \ `Dataset` 包含了 `parse_func` 的返回值。在这段代码中，`parse_func` 返回一个包含名为 `feat` 特征值的张量。\n\n\
  如果一个特征包含大量的零，你可以通过将特征名称与 `VarLenFeature` 关联将其加载到稀疏向量中。你可以通过调用 `tf.VarLenFeature`\
  \ 来创建一个新的 `VarLenFeature`：\n\n```python\ntf.VarLenFeature(dtype)\n```\n\n我希望大家很清楚\
  \ TFRecords API 是没必要的复杂。我诚地希望 TensorFlow 的未来版本能解决这个问题，并简化 TFRecords 的用法。\n\n###\
  \ 处理数据集\n\n在创建数据集后，可以通过调用 `Dataset` 类的许多方法之一来操作其元素。为了介绍这些方法，我将它们分为四类：\n\n*   处理批次（batches）\n\
  *   简单操作\n*   转换（Transformations）\n*   创建 `Iterator`\n\n接下来的章节介绍了前三类方法。我将在章节稍后的“迭代器（Iterators)”部分探讨\
  \ `Iterator`话题。\n\n### 处理批次\n\n正如第 5 章中所讨论，应用程序经常将数据集划分为批次。`Dataset` 类使得处理批次变得简单，表\
  \ 10-2 列出了两个执行批相关操作的方法。\n\n表 10-2 批次操作\n\n| 成员 | 描述 |\n| --- | --- |\n| `batch(batch_size)`\
  \ | 将数据集的内容划分为批次 |\n| `padded_batch(batch_size, padded_shapes, padding_values=None)`\
  \ | 将数据集的内容划分为批次，并使用填充确保每个批次具有预期的形状 |\n\n`batch` 将数据集的值划分为大小为 `batch_size` 的批次。以下代码将数据集划分为两个包含三个元素的批次。\n\
  \n```python\nvals = tf.constant([1, 2, 3, 4, 5, 6], dtype=tf.int64)\nds1 = tf.data.Dataset.from_tensor_slices(vals)\n\
  ds2 = ds1.batch(3) # contains [1, 2, 3], [4, 5, 6]\n```\n\n`padded_batch` 方法将数据集的每个元素（批次）填充到由\
  \ `padded_shapes` 参数指定的形状。然后该方法将这些元素合并为一个大的元素。\n\n```python\nvals = tf.constant([[1.,\
  \ 2.], [3., 4.]])\nds1 = tf.data.Dataset.from_tensor_slices(vals)\nds2 = ds1.padded_batch(2,\
  \ padded_shapes=[3], padding_values=1.)\n# ds2 contains [[1., 2., 1.], [3., 4.,\
  \ 1.]]\n```\n\n这段代码创建了每个包含两个元素的批次，并将每个批次填充到大小为三。由于该方法的 `padding_values` 参数，`padded_batch`\
  \ 将插入的值设置为 1.0。\n\n### 简单操作\n\n在将数据集划分为批次后，可以通过调用 `Dataset` 类的方法来操作批次。表 10-3 列出了九个执行简单操作的方法。\n\
  \n表 10-3 简单数据集操作\n\n| 成员 | 描述 |\n| --- | --- |\n| `take(count)` | 返回一个包含前 `count`\
  \ 个元素的数据集 |\n| `skip(count)` | 返回一个跳过前 `count` 个元素的数据集 |\n| `concatenate(dataset)`\
  \ | 将给定数据集追加到当前数据集 |\n| `repeat(count=None)` | 重复数据集 `count` 次 |\n| `shuffle(buffer_size,\
  \ seed=None)` | 随机化数据集子集元素的顺序 |\n| `shard(num_shards, index)` | 返回一个包含数据集子集的数据集\
  \ |\n| `list_files(file_pattern)` | 返回一个包含匹配指定模式的文件名的的数据集 |\n| `cache(filename='')`\
  \ | 缓存数据集的元素 |\n| `prefetch(buffer_size)` | 从数据集中预取指定数量的元素 |\n\n两个方法 `take` 和 `skip`\
  \ 是最简单的。它们返回包含其他数据集部分的数据集。\n\n```python\nds1 = tf.data.Dataset.range(1, 10)\n```\n\
  （注：原文中该部分有重复的碎片片段，此处已根据逻辑进行了整理和翻译）。\n\n\n\n\n在 `map` 方法中，函数接收输入数据集的每个元素，并产生一个要插入输出数据集的元素。在下面的代码中，lambda\
  \ 表达式将输入数据集的每个元素乘以 2，并将生成的元素插入输出数据集。\n\n```python\nvals = tf.constant([[2., 3.],\
  \ [4., 5.], [6., 7.]])\nds1 = tf.data.Dataset.from_tensor_slices(vals)\nds2 = ds1.map(lambda\
  \ x: x*2)\n# ds2  [[4., 6.], [8., 10.], [12., 14.]]\n```\n\n`flat_map` 类似于 `map`，但它返回的不是输出数据集的一个元素，而是整个数据集。`flat_map`\
  \ 将输出数据集拼接在一起并返回扁平化后的结果。\n\n```python\nvals = tf.constant([2, 3], dtype=tf.int64)\n\
  ds1 = tf.data.Dataset.from_tensor_slices(vals)\nds2 = ds1.flat_map(lambda x: tf.data.Dataset.range(x))\n\
  ### ds2 contains [0, 1, 0, 1, 2]\n```\n\n与 `flat_map` 一样，`interleave` 中的函数为输入数据集的每个元素返回一个数据集。与\
  \ `flat_map` 不同，它并不一定拼接生成的结果。`cycle_length` 参数指定了有多少元素应该交织。\n\n例如，如果你将 `cycle_length`\
  \ 设置为 2，输出数据集将包含前两个数据集的元素，然后是前两个数据集的下一个元素，以此此类推。以下代码展示了 `interleave` 如何工作。\n\n```python\n\
  vals = tf.constant([2, 3, 4], dtype=tf.int64)\nds1 = tf.data.Dataset.from_tensor_slices(vals)\n\
  ds2 = ds1.interleave(lambda x: tf.data.Dataset.range(x), cycle_length=3)\n# ds2\
  \  [0, 0, 0, 1, 1, 1, 2, 2, 3]\n```\n\n此代码为 lambda 提供了三个元素并将 `cycle_length` 设置为\
  \ 3。结果是，输出数据集包含三个数据集的前三个元素，然后是三个数据集的下一个三个元素，以此此类推。\n\n`zip` 方法也会交织多个数据集，但它不接受函数或\
  \ `cycle_length` 参数。该方法始终取第一个元素的第一个值，然后取第二个元素的第一个值，并向后进行。以下代码演示了如何使用 `zip`。\n\n\
  ```python\nds1 = tf.data.Dataset.range(0, 3)\nds2 = tf.data.Dataset.range(10, 13)\n\
  ds3 = tf.data.Dataset.range(20, 23)\nds4 = tf.data.Dataset.zip((ds1, ds2, ds3))\n\
  # ds4 contains (0, 10, 20), (1, 11, 21), (2, 12, 22)\n```\n\n`zip` 的 `datasets`\
  \ 参数接受嵌套结构的输入数据集。应用程序可以将其设置为元组，但不能设置为列表。\n\n## 迭代器\n\n`Iterator`（迭代器）允许你遍历一个或多个\
  \ `Dataset` 的元素。TensorFlow 提供了四种类型的迭代器：\n\n- **One-shot（单次迭代）：** 遍历数据集一次，无法参数化。\n\
  - **Initializable（可初始化）：** 需要特殊的初始化，可以参数化。\n- **Reinitializable（可重初始化）：** 可以与多个数据集关联，在每次迭代前必须初始化。\n\
  - **Feedable（可馈）：** 可以与多个数据集关联，不需要在每次迭代前初始化。\n\n### One-shot\n\nOne-shot 迭代器允许你遍历数据集。在迭代器中，one-shot\
  \ 迭代器是最简单的，但它们只能遍历一次。为了演示如何使用 one-shot 迭代器，以下代码通过调用数据集的元素来生成值：\n\n```python\n###\
  \ 创建数据集和迭代器\ntensor = tf.constant([1, 2])\ndataset = tf.data.Dataset.from_tensors(tensor)\n\
  iterator = dataset.make_one_iterator()\n\n## 访问下一个元素\nnext_elem = iterator.get_next()\n\
  \n# 打印值\nwith tf.Session() as sess:\n    print(sess.run(next_elem))\n```\n\n如果应用程序尝试执行第二次循环，TensorFlow\
  \ 将抛出 `OutOfRangeError`。\n\n### Initializable\n\n除了从常量张量创建数据集，你还可以从占位符创建数据集。这类数据集被称为参数数据集。One-shot\
  \ 迭代器无法遍历参数数据集，但可初始化迭代器可以。要创建可初始化迭代器并遍历数据集，你需要执行六步：\n\n1. 通过 `from_tensors` 或 `from_tensor_slices`\
  \ 从占位符创建数据集。\n2. 调用数据集的 `make_initializable_iterator` 创建迭代器。\n3. 调用迭代器的 `get_next`\
  \ 获取下一个元素。\n4. 在会话中运行 `initializer` 以初始化迭代器。\n5. 通过在会话的 `run` 方法中设置 `feed_dict`\
  \ 将占位符与数据关联。\n6. 通过评估 `get_next` 的结果访问迭代器元素。\n\n这个过程看起来很复杂，但参数数据集非常有用。以下代码通过包含四个浮点值的占位符创建一个数据集，然后使用可初始化迭代器访问数据集：\n\
  \n```python\n### 创建占位符和参数数据集\nholder = tf.placeholder(tf.float32, shape=[4])\ndset\
  \ = tf.data.Dataset.from_tensor_slices(holder)\n\n### 创建迭代器并访问其第一个元素\niter = dset.make_initializable_iterator()\n\
  next_elem = iter.get_next()\n\nwith tf.Session() as sess:\n    # 初始化迭代器\n    sess.run(iter.initializer,\
  \ feed_dict={holder: [0., 1., 2., 3.]})\n    for _ in range(4):\n        print('Element:\
  \ ', sess.run(next_elem))\n```\n\n\n\n\n\n在创建了可初始化的迭代器后，你可以通过为每个数据集创建一个单独的初始化器，将其与多个不同的数据集关联。以下代码创建了一个具有两个初始化器的迭代器。然后，使用该迭代器遍历两个数据集：\n\
  \n```python\n# 创建形状相似的数据集\nds1 = tf.data.Dataset.range(8)\nds2 = tf.data.Dataset.range(3)\n\
  \n### 创建迭代器并获取第一个元素\niterator = tf.data.Iterator.from_structure(\n  ds1.output_types,\
  \ ds1.output_shapes)\nnext_elem = iterator.get_next()\n\n### 为每个数据集创建一个初始化器\nds1_init\
  \ = iterator.make_initializer(ds1)\nds2_init = iterator.make_initializer(ds2)\n\n\
  ### 在话中运行两个初始化器\nwith tf.Session() as sess:\n  # 将迭代器与第一个数据集关联\n  sess.run(ds1_init)\n\
  \  for _ in range(8):\n    print('Element from ds1: ', sess.run(next_elem))\n\n\
  \  # 将迭代器与第二个数据集关联\n  sess.run(ds2_init)\n  for _ in range(3):\n    print('Element\
  \ from ds2: ', sess.run(next_elem))\n```\n\n这段代码使用 `ds1` 的形状和类型调用了 `from_structure`。然后它将迭代器与\
  \ `ds1` 和 `ds2` 关联。`ds1` 和 `ds2` 的形状不同，但由于它们的形状相似，因此它们是兼容的。\n\n### 可馈迭代器\n\n如果你希望在不从数据集开始重新初始化的情况下切换迭代器，可以创建一个可馈迭代器（feedable\
  \ iterator）。使用可馈迭代器的过程包含六个步骤：\n\n1. 创建一个包含字符串占位符。\n2. 使用占位符调用 `Iterator.from_string_handle`。\n\
  3. 创建多个迭代器来遍历数据集。\n4. 对于每个迭代器，通过调用 `string_handle` 获取唯一的字符串张量。\n5. 在话中评估每个唯一的字符串张量，以获取迭代器对应的唯一字符串。\n\
  6. 要切换到特定的迭代器，在话中评估 `get_next` 的结果，并使用 `sess.run` 的 `feed_dict` 参数提供迭代器的字符串。\n\n\
  以下代码演示了这一过程。它创建了两个数据集、每个数据集的一个单次迭代器（one-shot iterator），以及一个可以在迭代器之间进行切换的可馈迭代器。\n\
  \n```python\n## 创建数据集\nds1 = tf.data.Dataset.range(8)\nds2 = tf.data.Dataset.range(10,\
  \ 13)\n\n# 为每个数据集创建一个迭代器\nds1_iterator = ds1.make_one_shot_iterator()\nds2_iterator\
  \ = ds2.make_one_shot_iterator()\n\n# 创建字符串占位符和可馈迭代器\nholder = tf.placeholder(tf.string,\
  \ shape=[])\niterator = tf.data.Iterator.from_string_handle(\n  holder, ds1.output_types,\
  \ ds1.output_shapes)\nnext_element = iterator.get_next()\n\n# 为每个迭代器获取字符串张量\nds1_handle\
  \ = ds1_iterator.string_handle()\nds2_handle = ds2_iterator.string_handle()\n\n\
  # 创建话\nwith tf.Session() as sess:\n  # 从每个迭代器获取字符串\n  ds1_string = sess.run(ds1_handle)\n\
  \  ds2_string = sess.run(ds2_handle)\n\n  # 遍历 ds1 的前四个元素\n  for _ in range(4):\n\
  \    print('Element from ds1: ', sess.run(next_element, feed_dict={holder: ds1_string}))\n\
  \n  # 遍历 ds2\n  for _ in range(3):\n    print('Element from ds2: ', sess.run(next_element,\
  \ feed_dict={holder: ds2_string}))\n```\n\n这段代码使用 `ds1` 的形状和类型调用了 `from_structure`。然后它将迭代器与\
  \ `ds1` 和 `ds2` 关联。`ds1` 和 `ds2` 的形状不同，但由于它们的形状相似，因此它们是兼容的。\n\n---，如果你希望在不从数据集开始重新初始化的情况下切换迭代器，可以创建一个可馈迭代器。使用可馈迭代器的过程包含六个步骤：\n\
  \n（此处省略重复步骤，已在上文“可馈迭代器”部分详细说明，直接进入代码示例）\n\n以下代码演示了这一过程。它创建了两个数据集、每个数据集的一个单次迭代器，以及一个可以在迭代器之间进行切换的可馈迭代器。\n\
  \n```python\n## 创建数据集\nds1 = tf.data.Dataset.range(8)\nds2 = tf.data.Dataset.range(10,\
  \ 13)\n\n# 为每个数据集创建一个迭代器\nds1_iterator = ds1.make_one_shot_iterator()\nds2_iterator\
  \ = ds2.make_one_shot_iterator()\n\n# 创建字符串占位符和可馈迭代器\nholder = tf.placeholder(tf.string,\
  \ shape=[])\niterator = tf.data.Iterator.from_string_handle(\n  holder, ds1.output_types,\
  \ ds1.output_shapes)\nnext_element = iterator.get_next()\n\n# 为每个迭代器获取字符串张量\nds1_handle\
  \ = ds1_iterator.string_handle()\nds2_handle = ds2_iterator.string_handle()\n\n\
  # 创建话\nwith tf.Session() as sess:\n  # 从每个迭代器获取字符串\n  ds1_string = sess.run(ds1_handle)\n\
  \  ds2_string = sess.run(ds2_handle)\n\n  # 遍历 ds1 的前四个元素\n  for _ in range(4):\n\
  \    print('Element from ds1: ', sess.run(next_element, feed_dict={holder: ds1_string}))\n\
  \n  # 遍历 ds2\n  for _ in range(3):\n    print('Element from ds2: ', sess.run(next_element,\
  \ feed_dict={holder: ds2_string}))\n```\n\n（注：由于原文提供的文本后半部分存在大量且逻辑混乱的片段重复，根据“不要重复输出原文”的原则，此处仅对上述核心逻辑进行了翻译。若需对后半部分乱码进行翻译，请告知。）\n\
  \n## 理论实践\n\n`10/dataset.py` 中的代码展示了如何创建并处理数据集。它通过创建一个 `Example` 开始，并处理其数据。\n\n\
  创建和处理数据集\n\n```python\n### 生成器函数\ndef generator():\n  x = 20\n  while x < 28:\n\
  \    yield x\n    x += 1\n\n### 创建包含整数的示例\nint_list = tf.train.Int6List(value=[0,\
  \ 1, 2, 3])\ncontainer = tf.train.Features({'feat': tf.train.Feature(int_list=int_list)})\n\
  example = tf.train.Example(features=container)\n\n### 将示例写入 GZIP 文件\nopts = tf.python_io.TFRecordOptions(compression='GZIP')\n\
  writer = tf.python_io.TFRecordWriter('ex.tfrecord', opts)\nwriter.write(example.SerializeToString())\n\
  writer.close()\n\n### 解析 TFRecords 的函数\ndef parse_func(buff):\n  features = {'feat':\
  \ tf.FixedLenFeature(shape=[4], dtype=tf.int64)}\n  tensor_dict = tf.parse_single_example(buff,\
  \ features)\n  return tensor_dict['feat']\n\n### 从 TFRecords 创建数据集\ndset1 = tf.data.TFRecordDataset('ex.tfrecord',\
  \ 'GZIP')\ndset1 = dset1.map(parse_func)\niter1 = dset1.make_one_shot_iterator()\n\
  next1 = iter1.get_next()\n\n### 创建参数化数据集和可初始化迭代器\nholder = tf.placeholder(tf.int64,\
  \ shape=[2])\ndset2 = tf.data.Dataset.from_tensor_slices(holder)\ndset2 = dset2.concatenate(tf.data.Dataset.range(12,\
  \ 14))\n\n### 创建第三个数据集\ndset3 = tf.data.Dataset.from_generator(generator, output_types=tf.int64)\n\
  dset3 = dset3.filter(lambda x: x < 24)\n\n# 为第二个、第三个数据集创建可初始化迭代器\niter2 = tf.data.Iterator.from_structure(\n\
  \  dset2.output_types, dset2.output_shapes)\nnext2 = iter2.get_next()\n\n### 为第二个、第三个数据集创建初始化器\n\
  dset2_init = iter2.make_initializer(dset2)\ndset3_init = iter2.make_initializer(dset3)\n\
  \n### 打印每个数据集的内容\nwith tf.Session() as sess:\n  # 打印第一个数据集的内容\n  print('Element\
  \ from dset1: ', sess.run(next1))\n\n  # 打印第二个数据集的内容\n  sess.run(dset2_init, feed_dict={holder:\
  \ [10, 11]})\n  for _ in range(4):\n    print('Element from ds2: ', sess.run(next2))\n\
  \n  # 打印第三个数据集的内容\n  sess.run(dset3_init)\n  for _ in range(4):\n    print('Element\
  \ from ds3: ', sess.run(next2))\n```\n\n\n第二个迭代器是一个可重新初始迭代器，用于显示 `dset2` 和 `dset3`\
  \ 中的值。该模块为可重新初始迭代器创建了两个初始化器。在会话期间，模块会运行这两个初始化器并使用它们来遍历 `dset2` 和 `dset3` 中的值。\n\n\
  ## 异形数据集 (Bizarro Datasets)\n\n在第六章中，我解释了如何通过 `tf.contrib.learn.python.learn.datasets.mnist`\
  \ 包中的 `read_data_sets` 方法来创建一个包含 MNIST 手写样本的 `Dataset`。尽管这看起来很奇怪，但那个 `Dataset` 与本章讨论的\
  \ `Dataset` 类没有任何关系。`tf.contrib.learn.python.learn.datasets` 包通过以下代码定义了自身的 `Dataset`\
  \ 结构：\n\n```python\nDataset = collections.namedtuple('Dataset', ['data', 'target'])\n\
  ```\n\n我将这个 `Dataset` 称为“异形数据集”，因为它让我想起了比扎（Bizarro）——超人那丑陋且智力较低的镜像形象。这个 `Dataset`\
  \ 没有子类，也没有有趣的处理方法。它只是一个包含两个元素的命名元组：`data` 包含数据点，`target` 包含数据点的标签。例如，如果一个估计器的任务是将空间中的点分类为不同的类别，那么\
  \ `Dataset` 将点的坐标存储在它的 `data` 元素中，将类别 ID 存储在 `target` 元素中。\n\nTensorFlow 提供了两个 `Dataset`\
  \ 结构，这我很恼，但我不得不承认，`tf.contrib.learn.python.learn.datasets` 包的功能使得加载和访问数据变得简单。这种简单性解释了为什么\
  \ TensorFlow 的许多示例应用程序都依赖于这些函数。表 10-5 列出了五个创建异形数据集的函数，并提供了对每个函数的描述。\n\n表 10-5 创建异形数据集\n\
  \n| **成员** | **描述** |\n| --- | : --- |\n| `load_csv_with_header(filename, target_dtype,\
  \ features_dtype, target_column=-1)` | 从带有表头的 CSV 文件加载数据集 |\n| `load_csv_without_header(filename,\
  \ target_dtype, features_dtype, target_column=-1)` | 从不带表头的 CSV 文件加载数据集 |\n| `shrink_csv(filename,\
  \ ratio)` | 从 CSV 文件加载精简后的数据集 |\n| `load_iris(data_path=None)` | 从训练/测试 CSV 文件加载鸢尾花（Iris）数据集\
  \ |\n| `load_boston(data_path=None)` | 从训练/测试 CSV 文件加载波士顿房价价格数据集 |\n\n为了解释这些方法，我将它们分为两类。第一类函数从逗号分隔值（CSV）文件中加载数据。第二类函数从预先存在的机器学习数据集加载数据：鸢尾花（Iris）数据集和波士顿（Boston）数据集。\n\
  \n### 从 CSV 文件加载数据\n\n许多应用程序使用逗号分隔值（CSV）文件导入和导出数据。在 CSV 文件中，每行提供一条由逗号分隔的值组成的单一记录。这种格式并不是特别高效，但人类和计算机都可以轻松地读取\
  \ CSV 文件。\n\n表格中的前三个函数从 CSV 文件加载数据集。`load_csv_with_header` 从包含表头的 CSV 文件加载数据集，而\
  \ `load_csv_without_header` 从不带表头的 CSV 文件加载数据集。\n\n`shrink_csv` 的 `ratio` 参数决定了\
  \ CSV 文件中的哪些行应该存储在数据集中。如果应用程序将 `ratio` 设置为 `N`，`shrink_csv` 将每隔 `N` 行存储到数据集中。通过更改\
  \ `ratio`，应用程序可以为数据集选择不同的 CSV 记录组合。\n\n这些函数不会从通用的 CSV 文件创建数据集。它们期望 CSV 文件以特定格式化：\n\
  \n*   如果存在，文件表头应该以样本数量（包含记录的行数）和特征数量（每行的字段数）开头。\n*   每行数据行都应该以对应数据点的所需类别结束。\n\n\
  例如，以下文本展示了包含鸢鸢尾花数据集训练数据的 CSV 文件的前五行：\n\n```\n30,4,setosa,versicolor,virginica\n\
  5.9,3.0,4.2,1.5,1\n6.9,3.1,5.4,2.1,2\n5.1,3.3,1.7,0.5,0\n6.0,3.4,4.5,1.6,1\n```\n\
  \n根据表头，该文件提供了 30 条记录，每条记录有四个字段。每行的最后一个值标识了类别，因此第一个数据点属于类别 1。\n\n在常规 CSV 文件中，表头为记录中的每个字段提供名称。但在示例中，表头有三个名称，每个记录在类别之前有四个字段。结果证明，表头名称标识了类别名称：`setosa`\
  \ 标识为类别 0，`versicolor` 标识为类别 1，`virginica` 标识为类别 2。\n\n### 加载鸢尾和波士顿数据集\n\nTensorFlow\
  \ 网站提供了两个流行的数据集，使得训练和测试变得简单。第一个数据集称为鸢尾花数据集，将花卉物理特征与类型相关起来。第二个数据集称为波士顿数据集，将波士顿地区的统计数据（1978\
  \ 年）相关起来。\n\n对于每个数据集，TensorFlow 都两个 CSV 文件：一个包含训练数据，另一个包含测试数据。对于鸢尾花数据集，你可以从 [`download.tensorflow.org/data/iris_training.csv`](http://download.tensorflow.org/data/iris_training.csv)\
  \ 下载训练数据，并从 [`download.tensorflow.org/data/iris_test.csv`](http://download.tensorflow.org/data/iris_test.csv)\
  \ 下载测试数据。\n\n将文件下载到系统后，你可以通过 `load_iris` 调用其中一个来创建一个数据集。该函数返回一个 `Dataset`，其 `data`\
  \ 包含浮点值（花卉特征），`target` 包含整数。\n\n第 11 章\n\n## 使用线程、设备和集群\n\n本章\n\n*   在应用程序中配置线程\n\
  *   将操作分配给设备\n*   使用集群创建分布式应用程序\n\n*我感到需要……需要速度！* 如果你曾对机器学习说过这样，那么这一章就是适合你的。根据我的经验，你可以通过以下四种方法加速\
  \ TensorFlow ：\n\n*   生成多个执行线程\n*   访问高性能设备，如图形处理器单元（GPU）\n*   在网络设备集群上执行应用程序\n\
  *   将应用程序部署到云端\n\n本章讨论了前三种方案，并演示了如何在集群中执行 TensorFlow 。第 13 章解释了如何在云端运行 TensorFlow。\n\
  \n## 使用多线程执行\n\n*线程* 是能够独立于其他线程执行的操作序列。在 TensorFlow 应用程序中，你可以通过以下两种主要方式利用线程：\n\n\
  \n\n\n-   **在单独线程中执行耗时操作，例如数据的加载和存储。** 这种方法可以让你的处理线程在不受中断的情况下继续工作。\n-   **使用多线程运行会话。**\
  \ 从理论上讲，这种方法将减少处理会话操作所需的时间。\n\n对于第一点，开发者过去会创建 `QueueRunner`，它们存储了要在独立线程中执行的操作。但从\
  \ 1.4 版本开始，TensorFlow 文档建议使用数据集（datasets），这就是为什么 第 10 章 讨论的是数据集和迭代器（iterators），而不是线程、队列运行器和协调器（coordinators）。\n\
  \n要以多线程处理数据集，你可以设置 `Dataset` 的 `map` 方法的 `num_parallel_calls` 参数。例如，如果你将此参数设置为 4，TensorFlow\
  \ 将使用四个线程执行 `map` 操作。第 10 章 详细讨论了 `Dataset` 类及其 `map` 方法。\n\n对于第二点，你可以通过设置正确的配置参数来使用多线程执行会话。你可以在创建会话时或运行会话时设置这些参数。\n\
  \n### 配置新会话\n\n第 1 章 到 第 10 章 中的所有示例代码在调用 `tf.Session` 时都没有带任何参数。但你可以通过将 `tf.Session`\
  \ 的 `config` 参数设置为 `ConfigProto` 协议缓冲区来配置会话。该缓冲区的字段决定了会话的行为，表 11-1 列出了每一个字段。\n\n\
  表 11-1 ConfigProto 字段\n\n| **字段** | **类型** | **描述** |\n| --- | --- | --- |\n| `device_count`\
  \ | `map<string, int32>` | 标识会话可以访问的各类型设备数量 |\n| `intra_op_parallelism_threads`\
  \ | `int32` | 使用多个线程执行单项操作 |\n| `inter_op_parallelism_threads` | `int32` | 使用多个线程执行不同的操作\
  \ |\n| `session_inter_op_thread_pool` | `ThreadPoolOptionProto` | 配置会话线程池 |\n| `placement_period`\
  \ | `int32` | 决定将节点分配到设备的频率 |\n| `device_filters` | `string` | 防止会话访问命名的设备 |\n|\
  \ `gpu_options` | `GPUOptions` | 配置会话访问的任何 GPU |\n| `allow_soft_placement` | `bool`\
  \ | 决定如何将操作分配给 CPU 和 GPU |\n| `graph_options` | `GraphOptions` | 配置会话图（s）的选项 |\n\
  | `operation_timeout_in_ms` | `int64` | 配置会话阻塞操作的全局超时 |\n| `rpc_options` | `RPCOptions`\
  \ | 配置会话的分布式运行时 |\n| `cluster_def` | `ClusterDef` | 列出在此会话中使用的节点（workers） |\n\n\
  本节重点关注配置会话线程的选项。默认情况下，会话会为目标处理器上的每个核心执行一个线程。如果你在 Intel Core i5 CPU 上运行 TensorFlow，你的会话将以最多四个线程运行，因为该\
  \ CPU 有四个核心。\n\n理解 `intra_op_parallelism_threads` 和 `inter_op_parallelism_threads`\
  \ 选项之间的区别非常重要。许多 TensorFlow 操作（例如矩阵乘法）可以使用多个线程进行加速。`intra_op_parallelism_threads`\
  \ 选项决定了应该生成多少线程来执行*单项*操作。相比之下，如果一个图中有可以并行运行的操作，`inter_op_parallelism_threads` 选项决定了可以生成多少线程来执行它们。\n\
  \n为了演示如何配置线程，以下代码创建了一个 `ConfigProto`，它对单个操作使用最多六个线程，对并行操作使用最多八个线程。然后它使用该 `ConfigProto`\
  \ 创建了一个会话：\n\n```\nconf = tf.ConfigProto(intra_op_parallelism_threads=6, inter_op_parallelism_threads=8)\n\
  with tf.Session(config=conf) as sess:\n    …\n```\n\n默认情况下，会话将从全局线程池访问线程，而不是创建自己的线程。你可以通过\
  \ `use_per_session_threads` 选项更改此行为。如果你将此选项设置为 `True`，会话将创建自己的线程。\n\n如果你想让会话在执行主计算之外执行后台任务，可以通过将\
  \ `session_inter_op_thread_pool` 设置为一个或多个 `ThreadPoolOptionProto` 缓冲区来配置它。每个 `ThreadPoolOptionProto`\
  \ 标识一个独立的线程池。该协议缓冲区有两个字段：\n\n- `num_threads`: 线程池中的线程数\n- `global_name`: 全局名称\n\n\
  \n\n\nTensorFlow 是一个开源项目，你可以通过 `https://github.com/tensorflow/tensorflow` 访问源代码。如果你知道如何使用\
  \ `git`，可以使用以下命令克隆仓库：\n\n```bash\ngit clone https://github.com/tensorflow/tensorflow.git\n\
  ```\n\n如果你不知道如何使用 `git`，请点击带有 `Clone` 的绿色按钮或进行下载。然后选择 `Download ZIP` 选项下载包含 TensorFlow\
  \ 源代码的 `zip` 文件。下载完成后，解压该 `zip` 文件即可。\n\n## Bazel 与 Java\n\nBazel 是 Google 开发的一项工具，用于自动化软件构建过程。它通过执行在名为\
  \ `BUILD` 的文件中定义的操作来运行。该文件中的指令称为 `rules`，它们使用 Skylark 语言编写，它是 Python 的子集。\n\n如果你查看\
  \ TensorFlow 的文件层次结构，你会看到许多 `BUILD` 文件和 `*.BUILD` 文件。如果你打开 `tensorflow` 目录下的 `BUILD`\
  \ 文件，你会发现许多配置设置，如下所示：\n\n```python\nconfig_setting(\n  name = \"linux_x86_64\",\n\
  \  values = {\"cpu\": \"k8\"},\n  visibility = [\"//visibility:public\"],\n)\n```\n\
  \n每个 `config_setting` 块标识一个用于构建 TensorFlow 的支持平台。\n\n在安装 Bazel 之前，你需要在系统中安装 Java。具体来说，你需要安装版本\
  \ `8.*x` 的 Java 开发工具包 (JDK)。如果没有该版本，可以在 [`www.oracle.com/technetwork/java/javase/downloads/index.html](https://www.oracle.com/technetwork/java/javase/downloads/index.html)\
  \ 下载 Windows 和 macOS 的安装程序。\n\n如果你运行的是类似 Ubuntu 的 Debian 系系统，可以使用以下命令安装 OpenJDK\
  \ `8.*x`：\n\n```bash\nsudo apt-get install openjdk-8-jdk\n```\n\n安装好 JDK `8.*x`\
  \ 后，你就可以准备安装 Bazel 了。安装 Bazel 的指令取决于你的操作系统。\n\n## 图形处理器 (GPU) 加速\n\nCPU 设计用于安全、通用的计算，而\
  \ GPU 则是专为高速图形渲染设计的，而这涉及到大量的数学计算。对于许多机器学习应用，通过在 GPU 而非 CPU 上运行操作，你可以显著提高性能。\n\n\
  通用 GPU (GPGPU) 开发的两种主要语言是 OpenCL 和 CUDA。OpenCL 由多个供应商支持，并可以在许多不同设备上运行，包括 CPU、GPU\
  \ 和 FPGA。但 TensorFlow 仅在安装了 `ComputeCpp` 的系统上支持 OpenCL。你可以从 [`www.codeplay.com/products/computesuite/computecpp](https://www.codeplay.com/products/computesuite/computecpp)\
  \ 下载 ComputeCpp。\n\n另一种 GPGPU 语言 CUDA 仅在 Nvidia 的 GPU 上运行。要安装 CUDA，请访问 [`developer.nvidia.com/cuda-downloads`](https://developer.nvidia.com/cuda-downloads)\
  \ 并点击标识你的操作系统、架构和 OS 版本的按钮。然后下载并运行安装程序，它将引导你完成安装过程。\n\n## 在 Windows 上准备 TensorFlow\
  \ 构建\n\n在 Windows 上构建 TensorFlow 是很困难的，因为你需要设置一个支持 Bash 脚本、Python 以及 GNU 构建工具（如\
  \ `gcc` 和 `g++`）的类 Unix 环境。为了创建这个环境，大多数开发者使用 `Cygwin` 或 `MSYS2` (Minimal System\
  \ 2)。在本节中，我将解释如何使用 MSYS2 在 Windows 上构建 TensorFlow。\n\n要安装 MSYS2，请访问 [`www.msys2.org](https://www.msys2.org)\
  \ 并选择 32 位 (`i686`) 或 64 位 (`x86_64`) 可执行文件。下载完成后，运行该文件并按照安装说明操作。\n\n假设你选择了 Windows\
  \ 64 位选项，MSYS2 将将其所有文件放在名为 `C:\\msys64` 的新目录。有两个文件夹特别重要：\n\n* `C:\\msys64\\mingw64\\\
  bin` 包含由 MinGW 提供的实用。安装 MSYS2 时，此文件夹为空。\n* `C:\\msys64\\home\\<name>` 是你的主目录。启动\
  \ MSYS2 时，这将是初始目录。\n\n为了安装 TensorFlow，你需要访问 GNU 工具链中的构建工具，如 `gcc`、`g++` 和 `ld`。你可以通过下载\
  \ MinGW 包来获取这些工具。MSYS2 的包名为 `pacman`，你可以通过启动 MSYS2 并输入以下命令来安装必要的 MinGW 包：\n\n```bash\n\
  pacman -S --needed mingw-w64-x86_64-python3-pip base-devel mingw-w64-x86_64-toolchain\n\
  ```\n\n此命令向 `C:\\msys64\\mingw64\\bin` 目录了许多文件和可执行文件。为了让 MSYS2 找到这些可执行文件，你需要将该目录添加到系统的\
  \ `PATH` 变量。\n\n\n\n\n```bash\necho \"deb [arch=amd64] http://storage.googleapis.com/bazel-apt\
  \ stable jdk1.8\" | sudo tee /etc/apt/sources.list.d/bazel.list\n```\n\n```bash\n\
  curl https://bazel.build/bazel-release.pub.gpg | sudo apt-key add -\n```\n\n之后，你可以使用以下命令安装\
  \ Bazel：\n\n```bash\nsudo apt-get update && sudo apt-get install bazel\n```\n\n\
  在构建 TensorFlow 之前，你需要安装四个依赖包：`NumPy`、`Python-Dev`、`pip` 和 `wheel`。如果你在使用 Python\
  \ `2.x`，可以使用以下命令安装这些依赖项：\n\n```bash\nsudo apt-get install python-numpy python-dev\
  \ python-pip python-wheel\n```\n\n如果你在使用 Python `3.x`，可以使用以下命令安装 TensorFlow 的依赖项：\n\
  \n```bash\nsudo apt-get install python3-numpy python3-dev python3-pip python3-wheel\n\
  ```\n\n如果安装成功完成，你就可以开始构建 TensorFlow 了。\n\n## 构建 TensorFlow\n\n在将 TensorFlow 源代码下载到你的系统并安装了\
  \ Bazel 以及 TensorFlow 的依赖项后，就可以开始构建 TensorFlow 了。要开始，进入源代码所在的目录并输入以下命令：\n\n```bash\n\
  ./configure\n```\n\n该命令执行 `configure` 脚本，该脚本会提出一系列问题来配置 TensorFlow 软件包的功能。在下面的列表中，我列出了我在\
  \ Linux 上安装时遇到过的问题。每个问题都以方括号中的默认回答结束。你可以通过按回车键选择默认回答。\n\n*   **Python location**：包含\
  \ Python 解释器的目录\n*   **Python library path**：包含 Python 库的目录\n*   **jemalloc support**：TensorFlow\
  \ 是否应该使用改进的 `jemalloc` 函数代替 `malloc` 来分配内存。我建议选择 Yes (Y)。\n*   **Google Cloud Platform\
  \ support**：TensorFlow 是否应该支持 Google 的云计算服务——Google Cloud Platform (GCP)。第 14 章解释了如何在\
  \ GCP 上运行 TensorFlow。\n*   **Hadoop File System support**：TensorFlow 是否应该支持 Hadoop\
  \ 文件系统\n*   **Amazon S3 File System support**：TensorFlow 是否应该支持 Amazon 的分布式 S3 文件系统\n\
  *   **XLA JIT support**：TensorFlow 是否应该使用实验性的 XLA（加速线性代数）编译器来加速数学运算\n*   **GDR support**：TensorFlow\
  \ 是否应该启用 CUDA 的高速内存访问 GPUDirect RDMA\n*   **VERBS support**：TensorFlow 是否应该通过 VERBS\
  \ 包启用远程直接内存访问 (RDMA)\n*   **OpenCL support**：TensorFlow 是否应该通过 OpenCL 启用 GPU 计算\n\
  *   **CUDA support**：TensorFlow 是否应该通过 CUDA 启用 GPU 计算\n*   **MPI support**：TensorFlow\
  \ 是否应该通过消息传递接口 (MPI) 启用集群计算\n*   **Optimization flags**：构建 TensorFlow 时使用的优化标志\n\
  \n最后一个选项特别重要。默认情况下，构建过程将包含 `–march=native` 标志。该标志告诉编译器检查目标 CPU，并确保 TensorFlow 使用该处理器支持的最先进功能。通常情况下，我建议保持默认优化设置。\n\
  \n问卷结束后，脚本会将你的选择存储在名为 `.bazelrc` 的文件中。要继续，请输入以下命令：\n\n```bash\nbazel build --config=opt\
  \ //tensorflow\n```\n\n\n\n\n如果你的 TensorFlow 安装可以访问 GPU 且 TensorFlow 识别到符合标准的 GPU，则会话默认将数学操作分配给\
  \ GPU。你可以通过设置会话 `ConfigProto` 中的 `gpu_options` 字段来配置 CPU 与 GPU 的交互方式。你必须将 `gpu_options`\
  \ 分配给 `GPUOptions` 缓冲区，表 11-3 列出了它的字段。\n\n#### 表 11-3 (#17_9781119466215-ch11.xhtml#rc11-tbl-0003)\
  \ GPUOptions 字段\n\n| 字段 | 类型 | 说明 |\n| :--- | --- | :--- |\n| `per_process_gpu_memory_fraction`\
  \ | `double` | 配置要分配的 GPU 内存比例 |\n| `allocator_type` | `string` | 设置 GPU 分配策略 |\n\
  | `deferred_deletion_bytes` | `int64` | 延迟删除以减少驱动程序处理 |\n| `allow_growth` | `bool`\
  \ | 启用/禁用 GPU 内存预分配 |\n| `visible_device_list` | `string` | 决定 GPU 设备的映射方式 |\n|\
  \ `polling_active_delay_usecs` | `int32` | 配置活动状态下轮询之间经过的毫秒数 |\n| `polling_inactive_delay_msecs`\
  \ | `int32` | 设置非活动状态下轮询之间的毫秒数 |\n| `force_gpu_compatible` | `bool` | 强制将张量分配在 GPU\
  \ 的固定内存中 |\n\n默认情况下，TensorFlow 会为其操作预分配 GPU 的全部内存。但如果你将 `allow_growth` 设置为 `True`，TensorFlow\
  \ 将不会预分配任何内存。相反，它只会在需要时才分配内存。\n\n如果你将 `per_process_gpu_memory_fraction` 设置为小于 1\
  \ 的值，TensorFlow 将预分配 GPU 可见内存的该比例。例如，以下代码配置了一个会话，为其操作预分配 80% 的 GPU 内存：\n\n```\n\
  gpu_opts = tf.GPUOptions( per_process_gpu_memory_fraction=0.8)\nconf = tf.ConfigProto(gpu_options=gpu_opts)\n\
  with tf.Session(config=conf) as sess:\n     …\n```\n\n你可以通过减少 CPU 发送到 GPU 的命令数量来提高性能。一个频繁的命令涉及删除\
  \ GPU 内存中的对象。默认情况下，当对象占用超过几兆字节存储时，CPU 会告诉 GPU 删除对象。你可以通过将 `GPUOptions` 的 `deferred_deletion_bytes`\
  \ 字段设置为所需的内存大小来来自定义此行为。\n\n## 在集群中执行 TensorFlow\n\n除了在 GPU 上运行操作外，你还可以编写在多台计算机上执行的分布式应用程序。当我第一次遇到这个话题时，觉得它很难理解，因此我将其与一个更熟悉的话进行对比：网页浏览。\n\
  \n当你浏览网页时，你的浏览器（客户端）会向名为 `server` 的远程机器发送请求。准确来说，服务器是远程机器（服务器主机）上的一个进程，它在特定端口上监听请求。当你将请求发送到\
  \ Web 服务器的主机和端口时，服务器会发送一个包含网页的响应。一个主机可以执行多个服务器，但每个服务器始终监听来自特定端口的消息。\n\n在分布式 TensorFlow\
  \ 应用中，客户端访问多个服务器，这些服务器可能运行在独立的系统上或同一个系统上。像 Web 服务器一样，每个 TensorFlow 服务器都监听指向特定主机和端口的消息。\n\
  \n每个服务器执行一个名为 `task` 的单一工作单元。一组相关的任务形成一个 `job`。与应用程序关联的服务器集合称为 `cluster`（集群）。\n\n\
  如果你熟悉这些术语（server、task、job、cluster），那么编写分布式 TensorFlow 应用程序时将不会遇到困难。通常情况下，开发过程需要三个步骤：\n\
  \n1. 在 `ClusterSpec` 中定义应用程序的 job、任务以及服务器主机/端口。\n2. 为集群中的每个服务器创建一个 `tf.train.Server`。\n\
  3. 为每个任务定义操作。\n\n如果你的集群运行在多台计算机上，你就不必为每台计算机都重写一遍应用程序。只需编写一次应用程序，并向每个系统传递不同的命令行参数即可。或者，你可以使用像\
  \ Kubernetes 这样的集群管理器来管理集群，并自动定义服务器和任务。\n\n### 创建 ClusterSpec\n\n集群规范定义了应用程序的 job\
  \ 和任务，并将每个任务与服务器的网络地址关联。集群规范由 `tf.train.ClusterSpec` 实例表示。类构造函数接受一个参数，该参数可以采取三种形式之一：\n\
  \n* 将 job 名称与网络地址列表关联的字典\n* 将 job 名称与关联任务编号和网络地址的字典关联的字典\n* 现 `ClusterDef` 协议缓冲区\n\
  \n本文讨论重点关注前两种形式。例如，假设你想让集群在两个 job 中执行任务。第一个 job `j1` 有一个任务，第二个 job `j2` 有两个任务。你可以使用以下\
  \ `ClusterSpec` 定义你的集群：\n\n```\nspec = tf.train.ClusterSpec({\n 'j1': ['sys1.ex.com:121'],\n\
  \ 'j2': ['sys2.ex.com:122', 'sys3.ex.com:123']\n})\n```\n*（注：原文中关于 ClusterSpec 的代码是碎片化的，我已根据描述将其重构为逻辑块）。*\n\
  \n### 创建服务器\n\n在划分计算计算任务后，你需要创建服务器来执行这些任务。你可以通过调用 `tf.train.Server` 来创建服务器：\n\n\
  ```\ntf.train.Server(server_or_cluster_def, job_name=None, task_index=None, protocol=None,\
  \ config=None, start=True)\n```\n\n你可以将第一个参数设置为 `ServerDef`，它是定义服务器环境的协议缓冲区。但大多数应用程序会将第一个参数设置为\
  \ `ClusterSpec`。为了告诉服务器它应该执行哪个任务，你需要设置 `job_name` 和 `task_index` 参数。例如，以下代码创建一个执行\
  \ job `j2` 中任务 1 的服务器：\n\n```\nserver = tf.train.Server(spec, job_name='j2', task_index=1)\n\
  ```\n\n构造函数的 `protocol` 参数指定服务器用于接收任务的通信机制。目前唯一接受的协议是 `grpc`，它代表 gRPC 协议。\n\n`config`\
  \ 参数接受 `ConfigProto`，用于配置服务器上运行的所有会话。`start` 参数标识服务器是否在创建后立即启动。如果你将此参数设置为 `True`，服务器将在创建后开始处理任务。如果你将其设置为\
  \ `False`，可以稍后通过调用 `start` 方法启动服务器。\n\n### 指定 job 和任务\n\n在定义了集群并创建了服务器后，你需要为集群的任务提供代码。你不需要为每个任务编写单独的程序。相反，大多数开发者会编写一个程序并对其代码进行划分，以便不同的任务执行不同的部分。\n\
  \n\n\n\n\n你可以通过调用之前在“将操作分配到设备””节中讨论过的 `tf.device` 函数，将代码与特定任务关联。例如，以下代码仅在作业 `j1`\
  \ 的 Task 0 上执行：\n\n```python\nwith tf.device('/job:j1/task:0'):\n  const_a = tf.constant(3.6)\n\
  \  const_b = tf.constant(1.2)\n  total = const_a + const_b\n```\n\n你也可以使用 `if` 语句对代码进行拆分：\n\
  \n```python\nif job_name == 'j1' and task_num == 0:\n  …\nelif job_name == 'j1'\
  \ and task_num == 1:\n  …\n```\n\n当你定义一个集群时，可以根据需要创建任意数量的作业和任务。但许多分布式 TensorFlow\
  \ 应用程序只有两个作业：\n\n- 参数服务器 (`ps`)：存储应用程序的变量。\n- Worker 副本 (`worker`)：执行应用程序的计算，包括更新变量的处理过程。\n\
  \n你可以使用下面的代码在集群规范中定义这些作业：\n\n```python\nspec = tf.train.ClusterSpec({'ps': [..],\
  \ 'worker': [..]})\n```\n\n本节介绍了参数服务器和 worker，并向你展示如何在代码中创建它们。\n\n### 参数服务器\n\n\
  在分布式应用中，TensorFlow 识别到同一设备上同名的变量代表相同的数据。这意味着，如果 Task X 和 Y 都在操作一个名为 `weight_var`\
  \ 的变量，TensorFlow 会理解它们应该访问同一个 `weight_var` 变量。这些任务运行在不同的进程中，因此 TensorFlow 会进程之间复制这些变量。\n\
  \n参数服务器 (PS) 用作存储、保存和检索变量的中心位置。在许多应用程序中，PS 任务将只需声明变量，然后阻塞直到应用程序完成。为了演示这一点，以下代码定义了一个参数服务器，它声明了两个变量——`weights`\
  \ 和 `biases`，然后阻塞直到应用程序完成。\n\n```python\nserver = tf.train.Server(cluster, job_name='ps',\
  \ task_index=0)\nif job_name == 'ps':\n  weights = tf.Variable(…)\n  biases = tf.Variable(…)\n\
  \  server.join()\n```\n\n在参数服务器声明了 `weights` 和 `biases` 后，其他任务可以访问这些变量并根据需要更新它们。`join`\
  \ 方法告诉服务器无限阻塞。\n\n### Workers\n\n通常，任何执行计算的作业都被视为 worker 作业。worker 作业中的每个任务都称为 worker\
  \ 副本或简称 worker。为了执行其计算，每个 worker 需要创建并启动一个 session。\n\n这一要求带来了一个问题：你不能在分布式应用中创建普通的\
  \ session。你需要在适当的服务器进程中运行每个 session。要理解如何在服务器中运行 session，你需要熟悉服务器目标（server targets）。\n\
  \n就像 Web 服务器使用 HTTP 通信一样，TensorFlow 服务器使用 gRPC 通信。每个服务器都有由其主机和端口确定的 gRPC 地址。例如，如果你配置服务器执行一个地址为\
  \ localhost:123 的任务，则该服务器的 gRPC 地址将如下所示给出：\n\n`grpc://localhost:123`\n\n这个 gRPC\
  \ 地址被称为服务器目标。你可以通过 `Server` 实例的 `target` 属性访问此目标。\n\n要创建一个运行在服务器内部的 session，你需要将\
  \ `tf.Session` 的第一个参数设置为服务器的目标。以下代码创建了一个 `Server`，然后创建一个连接到它的 session：\n\n```python\n\
  server = tf.train.Server(spec, job_name='worker', task_index=1)\nwith tf.Session(server.target)\
  \ as sess:\n  …\n```\n\n这里有一个问题：如果分布式应用中的 workers 需要访问相同的变量数据，该如何初始化变量呢？参数服务器无法初始化它的变量，因为它没有运行\
  \ session。但如果每个 worker 都独立地初始化变量，TensorFlow 将无法在进程之间复制数据。\n\n答案是其中一个 worker 需要处理初始化，而其他\
  \ worker 需要等待初始化完成。处理初始化的 worker 被称为 chief（主节点）。你可以通过调用 `tf.train.MonitoredTrainingSession`\
  \ 在 session 中分配 chief 的操作。\n\n### Workers 和受监控 session\n\n第 5 章 介绍了 session 钩子（session\
  \ hooks）这一迷人的话题，并解释了如何将钩子与 `MonitoredSession` 关联。你可以通过调用名为 `tf.train.MonitoredTrainingSession`\
  \ 的函数为分布式应用配置 `MonitoredSession`：\n\n```python\nMonitoredTrainingSession(master='',\
  \ is_chief=True, checkpoint_dir=None, scaffold=None, hooks=None, chief_only_hooks=None,\
  \ save_checkpoint_secs=600, save_summaries_steps=USE_DEFAULT, save_summaries_secs=USE_DEFAULT,\
  \ config=None, stop_grace_period_secs=120, log_step_count_steps=100)\n```\n\n该函数看起来像类构造函数，但它返回的是\
  \ `MonitoredSession`，而不是 `MonitoredTrainingSession`。如果 worker 在 `is_chief` 设置为 `True`\
  \ 时调用此函数，`MonitoredSession` 将在启动时执行 session 的初始化。因此，只有一个 worker（chief）应该在 `is_chief`\
  \ 设置为 `True` 时调用此函数。第一个参数 `master` 的作用与 `Session` 构造函数中的 `target` 参数相同，它标识了运行 session\
  \ 的 gRPC 位置，例如 `grpc://localhost:123`。\n\n`MonitoredTrainingSession` 函数接受通用 session\
  \ 钩子（`hooks`）以及针对 chief session 的钩子（`chief_only_hooks`）。通过设置这些参数，你不需要创建 `CheckpointHook`\
  \ 或 `SummaryHook`。\n\n## 运行简单集群\n\n`ch11/cluster.py` 中的代码提供了一个分布式应用的简单示例。该模块没有执行任何机器学习，但展示了一组\
  \ worker 任务如何协作更新变量。\n\n具体来说，该应用程序创建了四个 worker 并使用它们近似 π。这种近似涉及对函数 `y = (1 + x)^-1`\
  \ 下的面积进行求和（`x` 从 0 到 1），然后乘以 4。在图 11-1 中，图形被分为 30 个区域。\n\n![图 11-1：应用程序可以通过将函数下区域划分为矩形并相加来近似\
  \ π](img/9781119466215-fg1101.png)\n\n`ch11/cluster.py` 模块生成了 worker 来执行近似。列表 11-1\
  \ 展示了代码。\n\n```python\n## 在分布式应用中近似 Pi\n\n# 用于输出的 session 钩子\nclass OutputHook(tf.train.SessionRunHook):\n\
  \  def before_run(self, run_context):\n    return tf.train.SessionRunArgs(pi_var)\n\
  \  def after_run(self, run_context, run_values):\n    print('Pi approximation:',\
  \ run_values.results)\n\n## 定义具有两个作业和五个任务的集群\nspec = tf.train.ClusterSpec({'worker':\n\
  \  ['localhost:31415', 'localhost:31416', 'localhost:31417', 'localhost:31418']})\n\
  \n## 执行与任务的操作\nflags = tf.flags\nflags.DEFINE_string('task', '', '')\nif not flags.FLAGS.task:\n\
  \  # 启动 worker 进程\n  subprocess.Popen('python cluster.py --task=0', stderr=subprocess.STDOUT)\n\
  \  subprocess.Popen('python cluster.py --task=1', stderr=subprocess.STDOUT)\n```\n\
  \n\n\n\n\n```python\nsubprocess.Popen('python cluster.py --task=2', stderr=subprocess.STDOUT)\n\
  subprocess.Popen('python cluster.py --task=3', stderr=subprocess.STDOUT)\n\nelse:\n\
  \    N = 10\n    num_workers = float(spec.num_tasks('worker') - 1)\n    delta_x\
  \ = float(1)/float(N * num_workers)\n    task_index = int(flags.FLAGS.task)\n\n\
  \    # Create server\n    server = tf.train.Server(spec, job_name='worker', task_index=task_index)\n\
  \n    with tf.device('/job:worker/task:0'):\n        pi_var = tf.Variable(0., dtype=tf.float32)\n\
  \n    with tf.device('/job:worker/task:1'):\n        for i in range(N):\n      \
  \      x_i = delta_x * (i * num_workers + 0.5)\n            pi_var += 4 * delta_x/(1\
  \ + x_i * x_i)\n\n    with tf.device('/job:worker/task:2'):\n        for i in range(N):\n\
  \            x_i = delta_x * (i * num_workers + 1.5)\n            pi_var += 4 *\
  \ delta_x/(1 + x_i * x_i)\n\n    with tf.device('/job:worker/task:3'):\n       \
  \ for i in range(N):\n            x_i = delta_x * (i * num_workers + 2.5)\n    \
  \        pi_var += 4 * delta_x/(1 + x_i * x_i)\n\n    # Launch session\n    output_hook\
  \ = OutputHook()\n    with tf.train.MonitoredTrainingSession(master='grpc://localhost:31415',\n\
  \        is_chief=(task_index == 0), chief_only_hooks=[output_hook]) as sess:\n\
  \        sess.run(pi_var)\n```\n\n该模块定义了一个 `ClusterSpec` 并启动了四个进程——每个 worker 对应一个进程。每个\
  \ worker 进程接收一个不同的参数，用于标识其任务编号。worker 使用该任务编号来创建并启动服务器，其网络地址由 `ClusterSpec` 决定。\n\
  \n该模块调用 `tf.device` 将代码分配给四个 worker。第一个 worker 声明并初始化了 `pi_var` 变量。其余 worker 通过累加函数\
  \ `y = (1 + x²)(-1)` 下方十个矩形区域的面积来更新 `pi_var` 的值。\n\n每个 worker 都调用 `tf.train.MonitoredTrainingSession`\
  \ 并将其目标设置为第一个 worker 的地址。主 worker 是任务索引为 0 的 worker，该 worker 的 session 会首先执行并初始化应用程序变量。初始化完成后，其他\
  \ worker 执行 session 并更新 `pi_var`。\n\n为了显示输出，该模块将 session 与一个 `OutputHook` 关联。该 session\
  \ 钩子（hook）会在 session 执行完成后打印 `pi_var` 的值。模块将 session 钩子与函数的 `chief_only_hooks` 关联，因此该钩子仅适用于主\
  \ worker 的 session。\n\n# 第 12 章 使用 Estimators 开发应用程序\n\n## 本章内容\n- 使用 estimators\
  \ 执行机器学习算法\n- 定义特征（features）和特征列（feature columns）\n- 在实践中使用预构建的 estimators\n- 使用\
  \ wide and deep 分析复杂数据集\n\n从根本层上说，使用统计回归进行机器学习的过程与使用神经网络的过程非常相似（参见第 7 章）：加载数据、训练模型并测试结果。为了简化开发和测试，TensorFlow\
  \ 提供了 `Estimator` 框架。`tf.estimator` 软件包包含了通过一组通用方法分析数据的模块。例如，执行线性回归的估计器类（`LinearRegressor`）与执行深度神经网络回归的类（`DNNRegressor`）具有相同的方法。你可以通过编写自己的估计器来利用这种共性。也就是说，如果你将你的机器学习算法封装成一个\
  \ estimator，其他开发者在训练你的应用程序时将不会遇到困难。当你调用 estimator 的构造函数时，需要为每个特征提供一个特征列。特征列将名称（如\
  \ `x-coords`）与特征中提供的数据类型相关联。我将在接下来的章节“使用特征列””中讨论特征列这一迷人的话题。\n\n## 介绍 Estimators\n\
  `tf.estimator` 软件包提供了系列分析数据的类，包括 `LinearClassifier` 和 `DNNClassifier`。这些类扩展了 `Estimator`\
  \ 类，该类的方法使得以以算法无关的方式进行机器学习。在整本书中，我使用 `estimator` 一词来指代 `Estimator` 类及其子类的实例。通常，使用\
  \ estimators 的过程包含六个步骤：\n\n1. 将数据加载到数据集（dataset）。\n2. 创建特征列，将数据集的字段与数据类型相关联。\n3.\
  \ 使用特征列创建 estimator 类实例。\n4. 使用训练数据训练 estimator。\n5. 使用测试数据评估 estimator 的性能。\n6.\
  \ 使用 estimator 进行真实世界的预测或分类。\n\n第 3 步取决于你感兴趣的估计器类型。你可以通过调用 `Estimator` 类的三个基本方法：`train`、`evaluate`\
  \ 和 `predict` 来执行第 4、5、6 步。\n\n## 训练 Estimator\n一旦你加载了数据并创建了 estimator，下一步是开始训练。每个\
  \ estimator 支持 `train` 方法：`train(input_fn, hooks=None, steps=None, max_steps=None)`\n\
  \n`input_fn` 参数是一个提供训练数据的元组。该元组包含两个元素：`features` 和 `labels`。如果 estimator 的目的是分类，标签代表类别。在\
  \ N 维空间中，为了标识特征，`input_fn` 提供一个将字符串与张量（tensors）关联的字典。每个字符串标识一个特征。为了演示如何设置 `input_fn`，以下函数提供了三个特征——每个维度一个：\n\
  \n```python\ndef train_func():\n    features = {\n        'x-coords': tf.constant([[0.1],\
  \ [0.2]]),\n        'y-coords': tf.constant([[0.5], [0.6]]),\n        'z-coords':\
  \ tf.constant([[1.0], [1.1]])\n    }\n    labels = tf.constant([[0], [1]])\n   \
  \ return features, labels\n```\n\n这组特征包含两个点：0.1, 0.5, 1.0) 和 (0.2, 0.6, 1.1)。但由于数据结构的原因，代码可能会看起来很困惑。它不是一次返回一个点，而是通过第一个特征提供所有的\
  \ x 坐标，通过第二个特征提供所有的 y 坐标，通过第三个特征提供所有的 z 坐标。\n\n`input_fn` 返回的元组的第二部分是包含标签的张量。标签代表特征的成功或失败。在之前的示例代码中，第一个点的标签为\
  \ 0，第二个点的标签为 1。\n\n看着这些代码，你可能会好奇 `x-coords`、`y-coords` 和 `z-coords` 是哪里来的。当你调用 estimator\
  \ 的构造函数时，需要为每个特征提供一个特征列。特征列将名称（如 `x-coords`）与特征中提供的数据类型相关联。\n\n默认情况下，estimator 会持续训练直到损失接近零。但你可以通过设置\
  \ `steps` 参数或 `max_steps` 参数来控制训练次数。区别在于 `steps` 参数是增量的，所以如果你想现在执行 30 步训练，稍后执行 20\
  \ 步训练，你可以先调用 `steps` 等于 30 的 `train`。之后，你可以调用 `steps` 等于 20 的 `train`。\n\n通过将 `hooks`\
  \ 参数设置为 session 钩子的列表，你可以监控训练过程。[第 5 章]解释了 session 钩子如何使得监控 session 的执行成为可能。\n\n\
  \n\n\n在创建并训练估计器之后，你应该确保它能够正常工作。测试估计器是 `evaluate` 方法的目的：\n\n```\nevaluate(input_fn,\
  \ steps=None, hooks=None, checkpoint_path=None, name=None)\n```\n\n`evaluate` 的参数与\
  \ `train` 类似。与 `train` 一样，`input_fn` 函数提供一个包含特征和标签的元组。唯一的区别是这些特征和标签代表的是测试数据而不是训练数据。\n\
  \n`checkpoint_path` 参数指定了方法存储其输出的目录。如果你将此参数设置为 `None`，该方法将使用估计器构造函数中的 `model_dir`\
  \ 参数。如果你不设置此参数，该方法将把输出存储在临时目录中。\n\n`evaluate` 返回一个字典形式测试结果，其内容取决于估计器的模型。TensorFlow\
  \ 的文档没有列出该字典所需的任何键，但我我用过的每个估计器都提供了以下内容：\n\n* `accuracy`: 正确预测的百分比\n* `loss`: 模型预测值与实际结果之间的差异\n\
  * `average_loss`: 损失的平均值\n\n除了这些指标外，`evaluate` 返回的字典还包含全局步数（global step）的值。应用程序可以通过\
  \ `global_step` 键访问此值。\n\n## 运行估计器\n\n在训练并测试了估计器并且对测试结果满意后，该上场场了！你可以通过调用 `predict`\
  \ 使用真实世界的数据点执行你的估计器：\n\n```\npredict(input_fn, predict_keys=None, hooks=None, checkpoint_path=None)\n\
  ```\n\n与 `train` 和 `evaluate` 一样，`predict` 接受一个函数作为第一个参数。但该函数不是提供包含特征和标签的元组，而是只返回特征。也就是说，`input_fn`\
  \ 返回一个字典，将字符串（特征列名称）映射到张量。这些张量包含了你真实世界应用的数据点。\n\n`predict` 返回一个映射名称到值的字典，作为估计器的预测结果。如果设置了\
  \ `checkpoint_path`，方法将将其输出文件存储在指定的目录。\n\n## 创建输入函数\n\n`train`、`evaluate` 和 `predict`\
  \ 方法需要一个输入函数作为第一个参数。`tf.estimator.inputs` 中的两个函数简化了编写此输入函数的过程：\n\n* `numpy_input_fn`:\
  \ 接受 NumPy 并返回一个提供 `features`/`target` 元组的函数\n* `pandas_input_fn`: 接受 pandas `DataFrame`\
  \ 并返回一个提供 `features`/`target` 元组的函数\n\n`numpy_input_fn` 的签名如下：\n\n```\nnumpy_input_fn(x,\
  \ y=None, batch_size=128, num_epochs=1, shuffle=None, queue_capacity=1000, num_threads=1)\n\
  ```\n\n`x` 参数标识特征，`y` 参数为每个特征提供标签。`shuffle` 参数标识是否应该对特征和标签进行洗牌。调用此函数时，你必须将 `shuffle`\
  \ 设置为 `True` 或 `False`。\n\n你必须将 `x` 和 `y` 参数设置为 NumPy 数组，你可以通过调用在 第 10 章 中讨论的 `load_csv_with_header`\
  \ 或 `load_csv_without_header` 函数从 CSV 文件加载这些数组。以下代码将特征数据从 `load_csv_with_header`\
  \ 传递给 `numpy_input_fn`：\n\n```\ndataset = tf.contrib.learn.datasets.base.\nload_csv_with_header(filename='example.csv',\
  \ target_dtype=np.int32, features_dtype=np.float32)\n…\ninput_fn = tf.estimator.inputs.numpy_input_fn(\
  \ x={'column': np.array(dataset.data)}, y=np.array(dataset.target), shuffle=True,\
  \ num_epochs=1000)\n```\n\n`num_epochs` 参数对于训练特别重要，因为它定义了会 将执行多少个 epoch。对于评估和预测，你应该将\
  \ `num_epochs` 设置为 1。\n\npandas 工具 set 将数据存储在 `DataFrame` 中。你可以通过调用 `pandas_input_fn`\
  \ 从 `DataFrame` 创建输入函数：\n\n```\npandas_input_fn(x, y=None, batch_size=128, num_epochs=1,\
  \ shuffle=None, queue_capacity=1000, num_threads=1, target_column='target')\n```\n\
  \n该函数的参数与 `numpy_input_fn` 几乎相同。唯一的区别是 `target_column` 参数，它标识包含目标（标签）数据的列。\n\n##\
  \ 配置估计器\n\n每个估计器类的构造函数都接受一个名为 `config` 的参数。通过将此项设置为 `tf.contrib.learn.RunConfig`，你可以配置估计器运行的许多方面，例如何时保存变量和生成摘要数据。\n\
  \n你可以通过调用其构造函数来创建一个 `RunConfig`。表 12-1 列出了构造函数的参数。\n\n表 12-1 RunConfig 构造函数的参数\n\
  \n| 参数 | 默认值 | 说明 |\n| --- | --- | --- |\n| `master` | None | 运行估计器的目标 |\n| `num_cores`\
  \ | 0 | 使用的核心数 |\n| `log_device_placement` | False | 标识估计器在哪些设备上运行 |\n| `gpu_memory_fraction`\
  \ | 1 | 使用 GPU 内存的比例 |\n| `tf_random_seed` | None | 初始化随机种子 |\n| `save_summary_steps`\
  \ | 100 | 保存摘要的步数 |\n| `save_checkpoints_secs` | 600 | 保存检查点的秒数 |\n| `save_checkpoints_steps`\
  \ | -- | 保存检查点的步数 |\n| `keep_checkpoint_max` | 5 | 保留检查点的数量 |\n| `keep_checkpoint_every_n_hours`\
  \ | 10000 | 每个检查点间隔的小时 |\n| `log_step_count_steps` | 100 | 记录全局步数的步数 |\n| `evaluation_master`\
  \ | '' | 评估目标 |\n| `model_dir` | None | 存储模型的目录 |\n| `session_config` | None | 用于配置的的\
  \ Proto |\n\n\n\n代码块是关于 **TensorFlow 特征列 (Feature Columns)** 的，而示例指令和上下文表明这是一个通用的\
  \ Markdown 工程任务。\n\n然而，根据你的**特定规则**（变量/函数/路径使用反引号，表达式使用代码块，层级优化），我已为你重新格式化了 TensorFlow\
  \ 相关的文本：\n\n[content]\n![图 12-1: TensorFlow 的特征列类决定了列中值的数据类型。](img/9781119466215-fg1201.png)\n\
  \n图 12-1 TensorFlow 的特征列类决定了列中值的数据类型。\n\n`_DenseColumn` 识别来自稠密张量的数据，而 `_CategoricalColumn`\
  \ 识别可以以分类方式表示的数据。也就是说，如果某一列需要存储表示为枚举类型的值，例如方向（`NORTH`、`SOUTH`、`EAST`、`WEST`），则你应该创建\
  \ `_CategoricalColumn` 的子类。对于所有其他类型的数据，你应该创建 `_DenseColumn` 的子类。\n\n`tf.estimator`\
  \ 包包含了图 12-1 中的类，但创建实例所需的函数位于 `tf.feature_column` 包中。表 12-2 列出了其中的八个函数并描述了由函数创建的特征列的内容。\n\
  \n### 表 12-2：创建特征列的函数\n\n| 函数 | 列内容 |\n| :--- | :--- |\n| `numeric_column(key, shape=(1,),\
  \ default_value=None, dtype=tf.float32, normalizer_fn=None)` | 实数值和其他数字 |\n| `categorical_column_with_identity(key,\
  \ num_buckets, default_value=None)` | 由唯一整数表示的类别 |\n| `categorical_column_with_hash_bucket(key,\
  \ hash_bucket_size, dtype=tf.string)` | 由哈希整数或字符串表示的类别 |\n| `categorical_column_with_vocabulary_list(key,\
  \ vocabulary_list, dtype=None, default_value=-1, num_oov_buckets=0)` | 通过与字符串或整数关联的整数\
  \ ID 列表访问类别 |\n| `categorical_column_with_vocabulary_file(key, vocabulary_file,\
  \ vocabulary_size, num_oov_buckets=0, default_value=None, dtype=tf.string)` | 通过关联整数\
  \ ID 与字符串或整数的文件访问类别 |\n| `bucketized_column(source_column, boundaries)` | 根据不同范围离散化的数值列值\
  \ |\n| `indicator_column(categorical_column)` | 将分类列转换为稠密列 |\n| `embedding_column(categorical_column,\
  \ dimension, combiner='mean', initializer=None, ckpt_to_load_from=None, tensor_name_in_ckpt=None,\
  \ max_norm=None, trainable=True)` | 将稀疏分类列转换为稠密列 |\n\n这些函数每个都接受一个标识列数据的 `key`。你可以将此键理解为数据库表中的列名。估计器通过\
  \ `train`、`evaluate` 和 `predict` 的输入函数接收列数据。正如在“介绍 Estimator”节中所讨论的，函数张量的第一部分是一个将特征列名称与张量关联的字典。\n\
  \n数值列的处理几乎非常简单。默认数据类型为 `tf.float32`，默认形状为 `(1)`。因此，以下代码返回了一个包含单精度浮点值的 `_NumericColumn`：\n\
  \n```temp = numeric_column('temp')\n```\n\n在分类列中，最简单的是 `_IdentityCategoricalColumn`，它可以通过调用\
  \ `categorical_column_with_identity` 创建。该列包含表示类别的整数。`num_buckets` 参数决定了类别的数量，因此以下代码创建了一个\
  \ `_IdentityCategoricalColumn`，其元素可以取 0 到 11 之间的任何值：\n\n```month = categorical_column_with_identity('month',\
  \ num_buckets=12)\n```\n\n如果你的应用程序使用字符串来识别类别，你可能会发现为每个类别提供唯一的整数很不方便。在这种情况下，你可以调用\
  \ `categorical_column_with_hash_bucket`，它使用哈希函数为字符串或整数数据生成 ID 值。以下代码创建了一个具有 195\
  \ 个类别的 `_HashedCategoricalColumn`：\n\n```nation = categorical_column_with_hash_bucket('nation',\
  \ num_buckets=195)\n```\n\n与其使用哈希函数，你可能会发现列出类别的不同值更简单。然后特征列将为类别确定自己的 ID。你可以通过调用\
  \ `categorical_column_with_vocabulary_list` 来实现。例如，以下代码创建了一个 `_VocabularyListCategoricalColumn`，它为\
  \ `vocabulary_list` 参数中的七个字符串中的每一个都创建一个类别：\n\n```day_of_the_week = categorical_column_with_vocabulary_list\
  \ (key='day', vocabulary_list=('Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday',\
  \ 'Saturday', 'Sunday'))\n```\n\n`categorical_column_with_vocabulary_file` 函数类似于\
  \ `categorical_column_with_vocabulary_list`，但你可以在文件中提供词汇表元素。如果你将字段分配给未定义的值，如果定义了该参数，则函数会将字段分配给\
  \ `default_value`。如果未定义 `default_value` 且应用程序为 `num_oov_buckets` 分配值，函数将根据需要创建额外的类别。\n\
  \n如果你需要根据范围将数字分类，可以调用 `bucketized_column`。该函数接受一个 `_NumericColumn` 和一个范围的列表/元组。例如，以下代码根据温度范围列表对\
  \ `temp_column` 的值进行分类：\n\n```boundaries = [-273.15, 0., 100.]\ntemp_state = bucketized_column(temp_column,\
  \ boundaries)\n```\n\n如果 `boundaries` 参数包含 N 个值，`bucketized_column` 将创建 N+1 个值范围。在示例中，第一个范围从负无穷大到\
  \ -273.15，第二个范围从 -273.15 到 0.0，第三个范围从 0.0 到 100.0，第四个范围从 100.0 到正无穷大。\n\n\n\n\n\
  我没有详细介绍这六类中的全部。相反，我专注于其中三个：`LinearRegressor`、`DNNClassifier` 和 `DNNLinearCombinedClassifier`。在每个情况下，我都会解释如何创建和训练该估计器，然后使用它进行预测。\n\
  \n![technicalstuff](img/technicalstuff.png)\n\nTensorFlow 提供的估计器类比我列出的六个要多。`tf.contrib.learn`\
  \ 包提供了许多估计器类，包括 `DynamicRnnEstimator`、`LogisticRegressor` 和 `SVM`。\n\n`Estimator`\
  \ API 使编写自己的估计器变得非常简单。除了实现 `train`、`evaluate` 和 `predict` 方法外，你还需要设置估计器的模型以及它用于计算损失的方法。\n\
  \n## 线性回归器\n\n第 6 章 解释了统计学家如何通过对一组数据点拟合直线来分析数据趋势。从数学角度来说，线性回归将 `mx + b` 设置为其模型，并使用均方误差计算损失。训练的目标是确定\
  \ `m` 和 `b` 的哪些值可以使直线与观测数据之间的距离最小化。\n\nTensorFlow 的估计器类中最简单的是 `LinearRegressor`，它执行相同的操作。构造函数如下：\n\
  \n```\nLinearRegressor(feature_columns, model_dir=None, label_dimension=1, weight_column=None,\
  \ optimizer='Ftrl', config=None, partitioner=None)\n```\n\n唯一要求的参数是 `feature_columns`，它接受一个\
  \ `_FeatureColumn` 列表，用于识别估计器的数据。`model_dir` 参数告诉估计器应该将输出存储在哪里，例如事件文件和检查点。如果你不设置\
  \ `model_dir`，估计器将使用临时目录。\n\n估计器的 `train` 函数期望一个返回特征和标签二元组的函数。在大多数应用程序中，标签由单个值组成，例如类别编号。但如果你的估计器需要多值目标，可以通过设置\
  \ `label_dimension` 参数来配置这一点。\n\n如果你设置了 `weight_column` 参数，估计器会创建一个额外的列，为每个特征分配权重。`train`\
  \ 和 `evaluate` 的输入函数必须为该列提供值。估计器会将特征的损失乘以此权重，因此高权重意味着高损失，这意味着估计器将在优化过程中采取更大的步长。\n\
  \n如果你查看此书中示例代码中的 `ch12` 文件夹，你会发现它包含名为 `lin_reg.csv` 和 `lin_reg.py` 的两个文件。第一个文件定义了一系列二维点。它的前五行如下：\n\
  \n```\n20,1\n0.5,0.25\n1.0,0.2\n1.4,0.25\n0.75,0.5\n```\n\n该头文件表示文件包含 20 个特征，每个特征由单个值组成。每个特征值识别点的\
  \ x 坐标，目标识别点的 y 坐标。图 12-2 图形展示了这些点。虚线是拟拟合数据的直线，其方程为 `y = 0.76x – 0.22`。\n\n![：LinearRegressor\
  \ 找到最拟合一组点的直线斜率和 y 轴截距。](img/9781119466215-fg1202.png)\n\n图 12-2： `LinearRegressor`\
  \ 找到最拟合一组点的直线斜率和 y 轴截距。\n\n为了分析 `ch12/lin_reg.csv` 中的点，`ch12/lin_reg.py` 代码创建了一个数据集并将数据馈给\
  \ `LinearRegressor`。列表 12-1 展示了代码。\n\n列表 12-1 使用估计器进行线性回归\n\n```python\n### 从 CSV\
  \ 文件读取数据集\ndataset = tf.contrib.learn.datasets.base.load_csv_with_header(\n  filename='lin_reg.csv',\
  \ target_dtype=np.float32,\n  features_dtype=np.float32, target_column=1)\n\n###\
  \ 创建包含 x 坐标的特征列\ncolumn = tf.feature_column.numeric_column('x', shape=[1])\n\n###\
  \ 创建线性回归器\nlin_reg = tf.estimator.LinearRegressor([column])\n\n### 训练估计器\ntrain_input\
  \ = tf.estimator.inputs.numpy_input_fn(\n  x={'x': np.array(dataset.data)},\n  y=np.array(dataset.target),\
  \ shuffle=True, num_epochs=50000)\n```\n\n```python\n### 进行预测\npredict_input = tf.estimator.inputs.numpy_input_fn(\n\
  \  x={'x': np.array(dataset.data)},\n  y=np.array(dataset.target), shuffle=False,\
  \ num_epochs=50000)\n\nresults = lin_reg.predict(predict_input)\n\n### 显示结果\nfor\
  \ prediction in results:\n  print(prediction)\n```\n\n我没有详细介绍这六类类中的全部。相反，我专注于其中三个：`LinearRegressor`、`DNNClassifier`\
  \ 和 `DNNLinearCombinedClassifier`。在每个情况下，我都会解释如何创建和训练该估计器，然后使用它进行预测。\n\n## DNN 分类器\n\
  \n`DNNClassifier` 使用深度神经网络将输入特征映射到标签。它的构造函数与 `LinearRegressor` 类似，但它使用多层神经元而不是单一线性模型。`hidden_units`\
  \ 参数允许你指定层数和每层中神经元数量。\n\n\n\n\n```python\ndataset = dataset.map(parser).repeat().batch(batch_size)\n\
  image, label = dataset.make_one_shot_iterator().get_next()\nreturn {'pixels': image},\
  \ label\ndnn_class.train(train_func, steps=num_steps)\n```\n\n### 测试估计器\n```python\n\
  def test_func():\n    dataset = tf.data.TFRecordDataset('mnist_test.tfrecords')\n\
  \    dataset = dataset.map(parser).batch(batch_size)\n    image, label = dataset.make_one_shot_iterator().get_next()\n\
  \    return {'pixels': image}, label\n\nmetrics = dnn_class.evaluate(test_func)\n\
  \n### 显示指标\nprint('\\nEvaluation metrics:')\nfor key, value in metrics.items():\n\
  \    print(key, ': ', value)\n```\n\n该模块创建一个特征列并使用它来构建一个 `DNNClassifier`。它将估计器的\
  \ `hidden_units` 参数设置为 `[128, 32]`，这意味着分类器具有两个隐藏层，分别包含 128 和 32 个隐藏单元。它将 `n_classes`\
  \ 参数设置为 10，因为每张 MNIST 图像可以属于十个类别之一。没有设置 `label_vocabulary` 参数，因此分类器假设标签将以 0 到 9\
  \ 的整数形式提供。\n\n在训练和评估之后，该模块会打印 `evaluate` 返回的字典的键和值。在我的系统中，结果如下：\n\n`Evaluation metrics:`\n\
  `accuracy : 0.9595`\n`average_loss : 0.129958`\n`loss : 10.3966`\n`global_step :\
  \ 8000`\n\n### 线性-DNN 结合分类器\n\n如果线性估计器和 DNN 估计器不能满足你的需求，你可以创建一个结合这两种学习方法的估计器。TensorFlow\
  \ 提供了两种估计器：`DNNLinearCombinedRegressor` 和 `DNNLinearCombinedClassifier`。本文重点讨论 `DNNLinearCombinedClassifier`。\n\
  \n在继续之前，我想澄清一些术语。这个估计器的名称包含“Linear（线性）”，但它并没有执行线性拟合。尽管名称如此，线性分类器依赖于逻辑回归而非线性回归来完成工作。第\
  \ 6 章 勇敢地探讨了线性回归和逻辑回归主题。\n\n要确定一个点属于哪个类别，TensorFlow 线性分类器依赖于 softmax 函数。如果 `j` 是\
  \ `N` 个类别之一，该函数的公式如下：\n\n![images](img/eq12001.png)\n<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:mi>&#963;</m:mi><m:msub><m:mrow><m:mrow><m:mo>(</m:mo><m:mrow><m:mi>f</m:mi><m:mrow><m:mo>(</m:mo><m:mi>x</m:mi><m:mo)</m:mo></m:mrow></m:mrow><m:mo></m:mo></m:mrow></m:mrow><m:mi>j</m:mi></m:msub><m:mo>=</m:mo><m:mfrac><m:mrow><m:msup><m:mi>e</m:mi><m:mrow><m:mi>f</m:mi><m:msub><m:mrow><m:mrow><m:mo>(</m:mo><m:mi>x</m:mi><m:mo)</m:mo></m:mrow></m:mrow><m:mi>j</m:mi></m:msub></m:mrow></m:msup></m:mrow><m:mrow><m:mstyle\
  \ displaystyle=\"true\"><m:munderover><m:mo>&#8721;</m:mo><m:mrow><m:mi>i</m:mi><m:mo>=</m:mo><m:mn>0</m:mn></m:mrow><m:mrow><m:mi>N</m:mi><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:munderover><m:mrow><m:msup><m:mi>e</m:mi><m:mrow><m:mi>f</m:mi><m:msub><m:mrow><m:mrow><m:mo>(</m:mo><m:mi>x</m:mi><m:mo)</m:mo></m:mrow></m:mrow><m:mi>i</m:mi></m:msub></m:mrow></m:msup></m:mrow></m:mstyle></m:mrow></m:mfrac></m:mrow></m:math>\n\
  \n如果 `f(x)` 是 `x` 的线性组合（例如 `mx + b`），则是线性的。为了确定损失，线性分类器计算交叉熵。\n\n`DNNLinearCombinedClassifier`\
  \ 结合了线性分类器和 DNN 分类器。你可以通过调用其构造函数来创建该分类器的实例：\n\n`DNNLinearCombinedClassifier(model_dir=None,\
  \ linear_feature_columns=None, linear_optimizer='Ftrl', dnn_feature_columns=None,\
  \ dnn_optimizer='Adagrad', dnn_hidden_units=None, dnn_activation_fn=tf.nn.relu,\
  \ dnn_dropout=None)`\n\n\n\n\n我通过两个 CSV 文件提供了人口普查数据：`ch12/adult.data` 包含训练数据，`ch12/adult.test`\
  \ 包含测试数据。加州大学欧文分校（UCI）在其网站 [`https://archive.ics.uci.edu/ml/machine-learning-databases/adult`](https://archive.ics.uci.edu/ml/machine-learning-databases/adult)\
  \ 免费提供这些文件。\n\n每条人口普查记录提供了关于个人的 14 项统计数据：\n\n- `age`: 人的年龄（年）\n- `workclass`: 工作类别状态（Private,\
  \ Self-emp-not-inc, self-emp-inc, Federal-gov, Local-gov, State-gov, Without-pay,\
  \ Never-worked）\n- `fnlwgt`: 由人口普查局计算的权重值（最终权重）\n- `education`: 最高教育程度（Preschool,\
  \ 1^(st)\\-4^(th), 5^(th)\\-6^(th), 7^(th)\\-8^(th), 9^(th), 10^(th), 11^(th), 12^(th),\
  \ HS-grad, Some-college, Prof-school, Assoc-acdm, Assoc-voc, Bachelors, Masters,\
  \ Doctorate）\n- `education-num`: 教育年限\n- `marital-status`: 婚姻状态（Never-married, Divorced,\
  \ Separated, Widowed, Married-civ-spouse, Married-AF-spouse, Married-spouse-absent）\n\
  - `occupation`: 工作地点（Tech-support, Craft-repair, Other-service, Sales, Exec-managerial,\
  \ Prof-specialty, Handlers-cleaners, Machine-op-inspct, Adm-clerical, Farming-fishing,\
  \ Transport-moving, Priv-house-serv, Protective-serv, Armed-Forces）\n- `relationship`:\
  \ 关系状态（Wife, Own-child, Husband, Not-in-family, Other-relative, Unmarried）\n- `race`:\
  \ 自认种族（White, Asian-Pac-Islander, Amer-Indian-Eskimo, Other, Black）\n- `sex`: 性别（Female,\
  \ Male）\n- `capital-gain`: 买卖资本资产的利润\n- `capital-loss`: 买卖资本资产的损失\n- `hours-per-week`:\
  \ 每周工作小时数\n- `native-country`: 国家（United-States, Cambodia, England, Puerto-Rico,\
  \ Canada, Germany, Outlying-US(Guam-USVI-etc), India, Japan, Greece, South Korea,\
  \ China, Cuba, Iran, Honduras, Philippines, Italy, Poland, Jamaica, Vietnam, Mexico,\
  \ Portugal, Ireland, France, Dominican-Republic, Laos, Ecuador, Taiwan, Haiti, Columbia,\
  \ Hungary, Guatemala, Nicaragua, Scotland, Thailand, Yugoslavia, El-Salvador, Trinad&Tobago,\
  \ Peru, Hong Kong, Holand-Netherlands）\n\n例如`adult.test` 文件包含以下记录：\n\n```\n36, Local-gov,\
  \ 403681, Bachelors, 13, Married-civ-spouse, Prof-specialty, Husband, White, Male,\
  \ 0, 0, 40, United-States, >50K\n```\n\n最后一列提供字符串格式的分类标签。标签 `>50K` 表示该人员年收入超过 50,000\
  \ 美元，而 `<=50K` 表示该人员年收入小于或等于 50,000 美元。\n\n遗憾的是，你无法使用 `load_csv_with_header` 或 `load_csv_without_header`\
  \ 加载这些普查数据。相反，我建议使用 pandas 数据分析库。如果你可以使用 pip，可以通过以下命令安装 pandas：\n\n```\npip install\
  \ pandas\n```\n\n安装好工具集后，你可以通过 `read_csv` 读取 CSV 数据。该函数接受许多参数，其中七个尤为重要：\n\n- `filepath_or_buffer`:\
  \ 包含 CSV 数据的文件的句柄\n- `header`: 包含列名的行号\n- `names`: CSV 字段的名称\n- `dtype`: 列的数据类型或数据类型列表\n\
  - `engine`: 解析器引擎\n- `skipinitialspace`: 指定是否忽略分隔符后的空格的布尔值（默认：`False`）\n- `skiprows`:\
  \ 从文件开始处要跳过的行数\n\n`read_csv` 返回一个持有 CSV 文件数据的 `DataFrame`。例如，以下代码获取了 `adult.data`\
  \ 的句柄，并调用 `read_csv` 将其数据读取到 `DataFrame` 中：\n\n```\ncolumns = ['age', 'workclass',\
  \ 'fnlwgt', 'education', 'education_num', 'marital_status', 'occupation', 'relationship',\
  \ 'race', 'gender', 'capital_gain', 'capital_loss', 'hours_per_week', 'native_country',\
  \ 'income_bracket']\ntrain_file = open('adult.data', 'r')\ntrain_frame = pd.read_csv(train_file,\
  \ names=columns, engine='python', skipinitialspace=True, skiprows=1)\n```\n\n创建\
  \ `DataFrame` 后，你可以调用 `pandas_input_fn` 将 `DataFrame` 转换为一个可以传递给估计器 `train` 或 `evaluate`\
  \ 方法的方法。`ch12/combined.py` 模块演示了应用程序如何使用 pandas 从 CSV 文件读取数据。\n\n\n\n\n```python\n\
  test_labels = test_frame['income_bracket'].apply(lambda x: '>50K' in x)\n\ntest_fn\
  \ = tf.estimator.inputs.pandas_input_fn(\n x=test_frame, y=test_labels,\n num_epochs=1,\
  \ shuffle=False)\n\nmetrics = classifier.evaluate(test_fn)\n\n### Display metrics\n\
  print('\\nEvaluation metrics:')\nfor key, value in metrics.items():\n print(key,\
  \ ': ', value)\n```\n\n在执行此模块之前，你需要将 `adult.data` 和 `adult.test` 文件放在当前目录下。你还需要安装\
  \ `pandas` 数据分析包。\n\n该模块的起始工作是为人口普查数据中的每个字段创建一个特征列（feature column）。然后，它创建了三个交叉列（crossed\
  \ columns）：一个结合了 `education` 和 `occupation` 列，一个结合了 `native_country` 和 `occupation`\
  \ 列，第三个则结合了 `workclass` 和 `occupation` 列。\n\n在创建交叉列后，模块创建了一组旨在用于 `DNN` 分类器的特征列。你不能将分类列（categorical\
  \ columns）直接输入神经网络，因此模块通过调用 `tf.feature_column.indicator_column` 将分类列转换为稠密列（dense\
  \ columns）。\n\n接下来，模块创建了一个 `DNNCombinedLinearClassifier` 并为其提供了两组特征列。也就是说，它将交叉列引导线性分类器，将稠密列引导\
  \ `DNN`。`dnn_hidden_units` 参数配置了神经网络具有两个隐藏层：一个有 120 个节点，另一个有 60 个节点。\n\n在创建分类器后，模块调用了它的\
  \ `train` 和 `evaluate` 方法。为了训练分类器，模块从 `adult.data` 读取字段并将 `DataFrame` 转换为数据集。训练过程包含\
  \ 500 个轮次（epochs），每个训练步长都在包含 100 个数据点的洗牌后批次（shuffled batches）上进行操作。\n\n为了测试分类器，模块从\
  \ `adult.test` 读取字段到一个 `DataFrame` 中并将 `DataFrame` 转换为数据集。然后，它会打印 `evaluate` 返回的字典中包含的每个指标。在我的系统中，该模块显示了如下结果：\n\
  \n`accuracy : 0.802285`\n`accuracy_baseline : 0.763774`\n`auc : 0.87448`\n`auc_precision_recall\
  \ : 0.710498`\n`average_loss : 0.511923`\n`label/mean : 0.236226`\n`loss : 65.1142`\n\
  `prediction/mean : 0.336511`\n`global_step : 195360`\n\n在此列表中，`auc` 代表“曲线下面积”（area\
  \ under the curve）。该指标对于分类器来说是常见的，因为它衡量了分类器做出成功预测与失败预测相比的概率。\n\n## 在集群中运行 Estimators\n\
  \n第 11 章 介绍了分布式 TensorFlow 应用，这涉及作业（jobs）、任务（tasks）和服务器（servers）。你可以在分布式应用中运行 estimators，但你需要告诉\
  \ TensorFlow 集群信息以及分配给运行 estimator 的服务器的任务。\n\n你可以通过设置一个 `TF_CONFIG` 变量来提供这些信息，该变量描述集群和服务器的任务。具体来说，你需要将\
  \ `TF_CONFIG` 设置为一个包含三个字段的 JSON（JavaScript 对象符号法）对象：\n\n* `cluster`: 集群的描述\n* `task`:\
  \ 节点的任务\n* `job`: 作业的参数\n\n你可以通过提供 `ClusterSpec` 实例的参数值来设置第一个字段。如果你有一个现有的 `ClusterSpec`，可以通过调用它的\
  \ `as_cluster_def` 方法获取合适的描述。\n\n`task` 字段标识分配给设置了 `TF_CONFIG` 的节点任务。该字段本身包含三个字段：\n\
  \n* `type`: 任务类型（`worker`、`master` 或 `ps`）\n* `index`: 任务在作业中的索引\n* `trial`: 运行试验的字符串标识符，以\
  \ `'1'` 开头\n\n`TF_CONFIG` 的 `job` 字段描述了节点的作业。分布式应用通常通过命令行参数接收此信息，因此你可以忽略该字段。以下代码向你展示了如何设置此变量：\n\
  \n```python\nTF_CONFIG = {\n 'cluster': {'ps': ['host1:123'],\n 'worker': ['host2:456']},\n\
  \ 'task': {\n 'type': 'worker',\n 'index': 0,\n 'trial': '1'\n }\n}\n```\n\n在这种情况下，集群有两个作业和两个任务。分配给带有此\
  \ `TF_CONFIG` 变量的节点任务索引为 `0`，类型为 `worker`。在这种情况下，集群有一个与任务类型相同的作业，但情况并非总是如此。你可以为作业分配任何名称，但任务的类型必须是\
  \ `worker`、`master` 或 `ps`。\n\n## 访问实验（Experiments）\n\n为了简化在分布式环境中执行 estimators\
  \ 的过程，TensorFlow 提供了 `Experiment` 类。在代码中使用 `Experiment`，你需要执行三个步骤：\n\n1. 创建一个 estimator。\n\
  2. 使用步骤 1 中创建的 estimator 构造 `tf.contrib.learn.Experiment` 实例。\n3. 通过调用 `tf.contrib.learn.learn_runner`\
  \ 启动实验。\n\n本节讨论了这些步骤，并演示了如何使用实验分类 MNIST 图像。第 13 章 展示了如何在云端启动实验。\n\n### 创建实验\n\n\
  每个实验都需要一个 estimator 以及用于训练和评估的函数。可以通过调用构造函数创建 `tf.contrib.learn.Experiment`，其参数如表\
  \ 12-3 所示。\n\n表 12-3 Experiment 构造函数的参数\n\n| 参数 | 默认值 | 描述 |\n| --- | --- | ---\
  \ |\n| `estimator` | -- | 由实验启动的 estimator |\n| `train_input_fn` | -- | 返回训练特征和标签的函数\
  \ |\n| `eval_input_fn` | -- | 返回评估特征和标签的函数 |\n| `eval_metrics` | `None` | 监控的评估指标\
  \ |\n| `train_steps` | `None` | 训练步数 |\n| `eval_steps` | `None` | 评估步数 |\n| `eval_hooks`\
  \ | `None` | 传递给 estimator 的会话钩子 |\n| `eval_delay_secs` | `120` | 评估前等待的秒数 |\n|\
  \ `continuous_eval_throttle_secs` | `60` | 评估开始后再次评估前等待的秒数 |\n| `min_eval_frequency`\
  \ | `None` | 评估之间的最小步数 |\n| `delay_workers_by_step` | `False` | 是否根据全局步数而非时间延迟 worker\
  \ |\n| `export_strategies` | `None` | 导出策略 |\n| `train_steps_per_iteration` | `None`\
  \ | 每次训练-评估迭代中的训练步数 |\n| `checkpoint_and_export` | `False` | 是否在训练期间保存检查点和导出 |\n\
  \n\n\n\n\n| `test()` | 执行单步的训练、评估和导出 |\n| `continuous_eval(delay_secs=None, throttle_delay_secs=None,\
  \ evaluate_checkpoint_only_once=True, continuous_eval_predicate_fn=None, name='continuous')`\
  \ | 持续评估估计器 |\n| `continuous_eval_on_train_data( delay_secs=None, throttle_delay_secs=None,\
  \ continuous_eval_predicate_fn=None, name='continuous_on_train_data')` | 使用训练数据持续评估估计器\
  \ |\n| `continuous_train_and_eval(*args, **kwargs)` | 交替训练和评估 |\n| `extend_train_hooks(additional_hooks)`\
  \ | 为训练关联额外的会话钩（hooks） |\n| `reset_export_strategies(new_export_strategies=None)`\
  \ | 关联新的导出策略 |\n| `run_std_server()` |  TensorFlow 服务器并加入服务线程 |\n\n前四个方法非常易于使用和理解。`train`\
  \ 方法会持续运行，除非你在构造函数中设置了 `train_steps` 参数。`evaluate` 将持续测试，直到输入耗尽或达到 `eval_steps`\
  \ 参数。在这两个方法中，你都可以通过设置 `delay_secs` 参数来指定实验应等待多久。\n\n`continuous_eval` 和 `continuous_eval_on_train_data`\
  \ 方法都执行重复评估。你可以通过将 `continuous_eval_predicate_fn` 赋值给合适的函数来控制评估是否继续。该函数接收上一次评估的结果，并决定是否应该继续评估。\n\
  \n`continuous_train_and_eval` 方法是实验性的，可能会随地发生更改。它会交替进行训练和评估，你可以通过构造函数的 `train_steps_per_iteration`\
  \ 参数来设置训练步数。\n\n### 运行实验\n\n你可以通过调用 `tf.contrib.learn.learn_runner.run` 来训练和/评估实验。该函数接受四个参数：\n\
  \n* `experiment_fn`: 返回实验对象的函数\n* `schedule`: 要调用的实验方法\n* `run_config`: 提供配置设置的\
  \ `RunConfig` 实例\n* `hparams`: 为实验提供额外数据的 `HParams` 实例\n\n要调用此函数，你需要将第一个参数分配给一个接收两个参数的函数：`RunConfig`\
  \ 和 `HParams`。该函数必须返回一个 `Experiment`。\n\n每个估计器构造函数都有一个 `config` 参数，接受 `tf.contrib.learn.RunConfig`\
  \ 实例。`run` 方法的 `run_config` 参数接受相同类型的 `RunConfig`。记住 `model_dir` 字段告诉实验存储其输出的位置。\n\
  \n你可以使用 `tf.contrib.training.HParams` 实例将数据传递给 `experiment_fn` 函数。构造函数接受一个或多个由逗号分隔的键值对。下面的代码展示了如何创建一个\
  \ `HParams` 实例：\n\n```\nhparams = tf.contrib.training.HParams(learning_rate=0.01,\
  \ hidden_units=[10, 20])\n```\n\n`schedule` 参数标识调用哪个实验方法。你可以通过设置 `RunConfig` 的 `model_dir`\
  \ 字段来控制方法的返回值的存储位置。\n\n### 将理论付诸实践\n\n`ch12/experiment.py` 模块中的代码演示了如何创建和启动实验。该实验使用\
  \ `DNNClassifier` 分析 MNIST 数据，该估计器类似于 `ch12/dnn_class.py` 中的类。列表 12-4 展示了相关代码。\n\
  \n列表 12-4 使用实验对 MNIST 分类\n\n```\n### 设置参数\nbatch_size = 80\nimage_dim = 28\nhparams\
  \ = tf.contrib.training.HParams(\n  num_labels=10,\n  batch_size=80,\n  num_steps=8000,\n\
  \  hidden_layers=[128, 32])\n\n# 解析 MNIST TFRecords 的函数\ndef parser(record):\n \
  \ features = tf.parse_single_example(record,\n    features={\n      'images': tf.FixedLenFeature([],\
  \ tf.string),\n      'labels': tf.FixedLenFeature([], tf.int64),\n    })\n  image\
  \ = tf.decode_raw(features['images'], tf.uint8)\n  image.set_shape([image_dim *\
  \ image_dim])\n  image = tf.cast(image, tf.float32) * (1. / 255) - 0.5\n  label\
  \ = features['labels']\n  return image, label\n\n### 创建 DNNClassifier\ndef create_estimator(hidden_layers,\
  \ num_labels, conf):\n  column = tf.feature_column.numeric_column('pixels',\n  \
  \  shape=[image_dim * image_dim])\n  return tf.estimator.DNNClassifier(hidden_layers,\
  \ [column],\n    n_classes=num_labels, config=conf)\n\n### 训练估计器\ndef train_func():\n\
  \  dataset = tf.data.TFRecordDataset('mnist_train.tfrecords')\n  dataset = dataset.map(parser).repeat().batch(batch_size)\n\
  \  image, label = dataset.make_one_shot_iterator().get_next()\n  return {'pixels':\
  \ image}, label\n\n### 测试估计器\ndef test_func():\n  dataset = tf.data.TFRecordDataset('mnist_test.tfrecords')\n\
  \  dataset = dataset.map(parser).batch(batch_size)\n  image, label = dataset.make_one_shot_iterator().get_next()\n\
  \  return {'pixels': image}, label\n\n### 创建实验\ndef create_experiment(conf, params):\n\
  \  return tf.contrib.learn.Experiment(\n    estimator=create_estimator(params.hidden_layers,\n\
  \    params.num_labels, conf),\n    train_input_fn=train_func,\n    eval_input_fn=test_func,\n\
  \    train_steps=params.num_steps)\n\n### 运行实验\nrun_config = tf.contrib.learn.RunConfig(model_dir='experiment_output')\n\
  tf.contrib.learn.learn_runner.run(\n  experiment_fn=create_experiment,\n  run_config=run_config,\n\
  \  schedule='train_and_eval',\n  hparams=hparams)\n```\n\n\n\n\n\n我喜欢使用 GCP，因为我的应用程序可以访问\
  \ Google 的技术，包括 Google Maps、Gmail、YouTube 和 AdSense。本章将重点介绍 Google 的机器学习（ML）引擎，它可以让你在\
  \ Google Cloud Platform 上运行 TensorFlow 应用程序。\n\n## 概述\n\n好消息是，通过将应用程序部署到 Google\
  \ 的机器学习（ML）引擎，你可以大幅缩短机器学习所需。坏消息是，配置和部署应用程序的过程并不简单。涉及到五个步骤：\n\n1. 为 Google Cloud\
  \ Platform (GCP) 创建项目并配置其使用 Cloud Machine Learning API。\n2. 安装云软件开发包 (SDK)。\n3.\
  \ 将你的 TensorFlow 结构化为一个包。\n4. 将你的包和处理数据上传到 Google Cloud Storage（谷歌云存储）。\n5. 使用 Cloud\
  \ SDK 执行训练或预测任务。\n\n在编写本章时，我假设你从未听说过 GCP。因此，在解释如何部署应用程序之前，我会先介绍云软件开发包（SDK）和云存储（Cloud\
  \ Storage），并解释如何创建 GCP 项目。\n\n## 使用 GCP 项目\n\n如果你想利用 GCP 的功能，第一步是创建一个项目。该项目是你开发工作的中心容器，包含了你所有的元数据和配置文件。在执行代码或启动\
  \ Web 应用程序之前，你需要将文件上传到项目中。同样，如果你想访问特殊功能，需要通过该项目提交请求。\n\n要构建一个可以访问 ML 引擎的 GCP 项目，你需要执行三个步骤：\n\
  \n1. 在 Google Developer Console（开发者控制台）中创建项目。\n2. 为项目启用结算功能。\n3. 允许项目访问机器学习引擎。\n\
  \n![tip](img/tip.png) 本书示例代码中的 `ch13` 包含两个文件夹：`cloud_mnist` 和 `cluster_mnist`。这些文件夹包含了可以部署到\
  \ ML 引擎的包，但它们不是 GCP 项目。GCP 项目位于云端，因此如果你想跟随本章进行开发，你需要自己创建并配置 GCP 项目。\n\n### 创建新项目\n\
  \n任何拥有有效电子邮件地址的人都可以创建 GCP 项目，无需费用或义务。该过程涉及五个步骤：\n\n1. 访问云控制台：[`console.cloud.google.com`](https://console.cloud.google.com)。\n\
  2. 如果你是首次访问控制台，请提供联系邮箱和密码。\n3. 在上方水平栏中，点击“选择项目”（Select a Project）。\n4. 在选择对话框中，点击右侧的加号按钮。\n\
  5. 在“新项目”（New Project）页面，输入项目名称并点击“创建”（Create）按钮。\n\n在操作 GCP 时，你需要理解项目名称（Name）和\
  \ ID 之间的区别。项目名称由开发者选择，控制台用它显示当前项目。\n\n相比之下，项目 ID 是 GCP 根据项目名称选择的，它在所有 GCP 项目中唯一标识该项目。如果你想上传代码或更改项目配置，需要通过\
  \ ID 访问你的项目。因此。\n\n### 结算\n\n机器学习非常强大，但它并不是免费的。机器学习的费用取决于操作类型、时长以及你所在地：\n\n* 训练：每小时\
  \ 0.43 美（美国）\n* 预测：每小时 0.01 美（美国）\n\n其他地区的价格更低。例如，在欧洲训练的价格为每小时 0.35 美，预测为每小时 0.008\
  \ 美。\n\n要使用 ML 引擎，你需要设置账户。可以通过云控制台实现：\n\n1. 访问云控制台。\n2. 登录你的账户。\n3. 创建项目。\n4. 启用结算。\n\
  5. 启用 ML 引擎。\n\n### 访问 ML 引擎\n\n安装 SDK 后，你可以通过命令行界面访问 ML 引擎。这使得自动化工作流成为可能。安装 SDK\
  \ 后，你将可以使用两个命令行工具：\n\n* `gcloud`：提供通用的项目交互，并访问 App Engine、Datastore、DNS 和 ML 引擎。\n\
  * `gsutil`：访问 Cloud Storage。\n\n### 云软件开发包 (SDK)\n\n在了解如何创建 GCP 项目后，你就可以使用 SDK 了。你可以从\
  \ [`cloud.google.com/sdk`](http://cloud.google.com/sdk) 下载 SDK。点击 Install（安装）按钮将提供在你的系统上下载\
  \ SDK 的说明。\n\n当你启动安装程序时，它会让你登录账户并授予权限。它还要求你选择一个项目作为默认项目。选择后，所有的 SDK 命令都会影响该默认项目。\n\
  \n### gcloud 工具\n\n安装 SDK 后，你可以在命令行中执行 `gcloud` 命令。所有的 `gcloud` 命令都具有相同的格式：\n\n\
  `gcloud [optional flags] <group | command>`\n\n例如，你可以通过输入以下内容来检查 `gcloud` 的版本：\n\
  \n```\ngcloud version\n```\n\n该命令会识别 SDK 的版本及其组件的版本。你可以通过输入以下命令安装最新版本的组件：\n\n```\n\
  gcloud components update\n```\n\n\n\n\n如果你输入 `gcloud help`，你将看到一个长长的 `gcloud` 组和命令列表。`gcloud`\
  \ 组使得管理 Web 应用程序、访问数据库和配置 DNS 设置成为可能。表 13-1 列出了这些组中的十个。\n\n表 13-1 gcloud 组\n\n|\
  \ 组名 | 操作 |\n| --- | --- |\n| `app` | 管理 App Engine 部署 |\n| `auth` | 管理 oauth2 凭据\
  \ |\n| `components` | 安装、更新和删除 SDK 组件 |\n| `compute` | 访问与 Compute Engine 相关的资源\
  \ |\n| `config` | 查看和编辑 SDK 配置 |\n| `domains` | 管理与项目关联的域名 |\n| `ml` | 访问机器学习能力\
  \ |\n| `ml-engine` | 管理机器学习作业和模型 |\n| `projects` | 创建和管理项目访问 |\n| `services` | 列出、启用和禁用\
  \ API 和服务 |\n\n`ml-engine` 组在本章中起着核心作用，因为它允许你在云端上传并执行 TensorFlow 。图 13-1 显示了许多与\
  \ `ml-engine` 相关的组和命令。\n\n![图 13-1：Cloud SDK 中的命令有很多层级和选项。](img/9781119466215-fg1301.png)\n\
  \n图 13-1： Cloud SDK 中的命令有很多层级和选项。\n\n要在云端部署并运行应用程序，你需要熟悉 `gcloud ml-engine` 中 `jobs`\
  \ 子组的命令。对于 ML Engine 而言，作业（job）指的是处理任务，可以是训练或预测。例如，以下命令告诉引擎你想要它启动一个训练作业：\n\n```\n\
  gcloud ml-engine jobs submit training\n```\n\n要告诉 GCP 在何处找到你的代码，你需要在命令后加上配置标志。其中三个标志特别为重要：\n\
  \n* `--package-path`：包含训练源码的本地目录\n* `--module-name`：包的主模块名称\n* `--staging-bucket`：存储包及其依赖项的\
  \ Cloud Storage 桶（bucket）\n\n在我解释如何向云端提交作业之前，我将在下一节解释 Cloud Storage 的工作原理，以便你设置\
  \ `--staging-bucket` 标志。然后，我将解释如何准备应用程序，以便你设置 --`package-path` 标志。\n\n## Google\
  \ Cloud Storage\n\nGCP 为云端数据存储提供了许多选项，包括 Datastore、BigTable 和 Spanner。但如果你想为机器学习存储和访问数据，就必须使用\
  \ Google Cloud Storage。也就是说，ML Engine 要求你将所有源文件、依赖项和数据上传到 Cloud Storage。\n\n幸运的是，Cloud\
  \ Storage 很容易使用。它将数据存储在名为 `buckets`（桶）的容器中，你可以将桶想象成云端的目录。桶中的每个数据项被称为 `object`（对象）。\n\
  \n### 桶 (Buckets)\n\n计算机上的文件系统使用文件存储数据并使用目录组织文件。Cloud Storage 使用对象存储数据并将对象收集在桶内部。桶与目录有很多共同点，但有一个主要区别：桶不能嵌套。也就是说，你不能像组织目录一样将桶组织层级结构。\n\
  \n在使用桶时，你应该熟悉以下三点：\n\n* 所有涉及 Cloud Storage 的加载/存储/删除操作必须识别至少一个目标桶。\n* 每个桶都有一个全局唯一的名称、存储类和地理位置。\n\
  * 一个项目每两秒最多可以创建/删除一次桶。\n\n最后这一点很重要。创建和删除桶需要花费大量时间，因此 Google 建议创建少数几个持久桶并在需要时重用它们。\n\
  \n### 桶名称 (Bucket names)\n\n当你访问桶时，你需要通过其统一资源标识符（URI）来识别它，它以 `gs://` 开头。桶的名称在所有\
  \ GCP 项目中必须唯一，而不仅仅是你自己的项目。因此，在桶名前加上项目 ID 是一个好主意，例如 `gs://myproject3712_tfbook`。\n\
  \nGCP 对桶名称设置了以下标准：\n\n* 桶的名称必须大于两个字符且少于 64 个字符。\n* 桶名称中的字符限于字母、数字、连字符、下划线和点。\n*\
  \ 桶名称不能以“goog”开头，且不能包含“google”或“google”的拼写错误。\n\n如果你创建一个名称中包含点的桶，Cloud Storage 会假设你以域名命名该桶，例如\
  \ [`www.evilrobot.com`](http://www.evilrobot.com)。好消息是，Cloud Storage 将域名命名桶的最大长度扩展到\
  \ 222 个字符。坏消息是，你需要说服 Google 你拥有该域名。\n\n### 存储类和位置 (Storage classes and locations)\n\
  \n每个桶都有一个存储类，决定了它的可用性。表 13-2 列出了四种存储类。\n\n| 存储类 | ID | 描述 |\n| --- | --- | --- |\n\
  | 多区域 (Multi-Regional) | `multi_regional` | 跨区域频繁访问（每月 0.02 美） |\n| 区域 (Regional)\
  \ | `regional` | 在区域内频繁访问（每月 0.02 美） |\n| 近线存储 (Nearline) | `nearline` | 每月访问少一次（每月\
  \ 0.01 美） |\n| 冷线存储 (Coldline) | `coldline` | 每年访问少一次（每月 0.007 美） |\n\n例如，假设你想让桶包含在全球范围内显示的视频。在这种情况下，你会创建一个桶并将其存储类设置为\
  \ `multi_regional`。你可以将多区域桶的位置设置为三个之一：`eu`、`us` 和 `asia`。\n\n如果你的数据只需要在特定区域访问，你应该将桶存储类设置为\
  \ Regional。你可以将区域桶关联到 13 个不同的位置，表 13-3 列出了所有位置。\n\n| `us-east1` | `us-east4` | `us-central1`\
  \ | `us-west1` |\n| --- | --- | --- | --- |\n| `asia-east1` | `asia-northeast1`\
  \ | `asia-southeast1` | `asia-south` |\n| `australia-southeast1` | `europe-west1`\
  \ | `europe-west2` | `europe-west3` |\n| `southamerica-east1` | | | |\n\nGoogle\
  \ 的区域列表定期增加。有关存储类的最新信息，请访问 GCP 文档 [`http://cloud.google.com/storage/docs/storage-classes`](http://cloud.google.com/storage/docs/storage-classes)。有关桶位置的最新信息，请访问\
  \ [`http://cloud.google.com/storage/docs/bucket-locations`](http://cloud.google.com/storage/docs/bucket-locations)。\n\
  \n### 对象和虚拟层级\n\nCloud Storage 桶中的每个数据项都是一个对象。桶可以包含无限数量的对象，但每个对象的大小必须为 5 TB 或以下。\n\
  \n每个对象都有数据和元数据。当你将文件上传到桶时，文件内容就成为对象的数据。对象的元数据持有描述对象的键值对。\n\n对象名称的标准比桶名称的标准要宽松得多：\n\
  \n* 对象名称可以包含任何有效的 Unicode 字符。\n* 对象名称不能包含任何回车符或换行符。\n* Google 建议不要在对象名称中使用 `#`、`[`、`]`、`*`\
  \ 或 `?`，因为 `gsutil` 会将这些字符解释为通配符。\n\n\n\n\n\n桶（bucket）的名字必须以字母开头和结束，但对象（object）的名字可以以斜杠（`/`）开头或结束。因此，你可以通过以斜杠开头对象的名称来构建虚拟层次结构。\n\
  \n例如，假设你创建了一个名为 `gs://dummies-tfbook` 的桶。你可以在该桶中创建一个名为 `gs://dummies-tfbook/data`\
  \ 的对象，以及另一个名为 `gs://dummies-tfbook/data/images` 的对象。Cloud Storage 不会识别这些对象之间的任何关系，但人类会理解这些对象形成了一个虚拟层级结构。\n\
  \n### gsutil 工具\n\n`gsutil` 工具允许你创建、访问和修改桶以及对象。在大多数情况下，`gsutil` 命令的名称和用途与常见的 *nix*\
  \ 命令相同。\n\n表 13-4 列出了 `gsutil` 的 13 条命令。如需进行更深入的讨论，请访问 Google 的官方文档：[`https://cloud.google.com/storage/docs/gsutil`](https://cloud.google.com/storage/docs/gsutil)。\n\
  \n表 13-4 gsutil 命令\n\n| **命令** || **描述** |\n| --- | --- |\n| `mb [-c class] [-l\
  \ location] [-p proj_id] url…` | 创建新桶 |\n| `rb [-f] url…` | 删除桶 |\n| `cp [OPTION]…\
  \ src_url dst_url`<<br>`cp [OPTION]… src_url… dst_url`<<br>`cp [OPTION]… -I dst_url`\
  \ | 复制文件和对象 |\n| `mv [-p] src_url dst_url`<<br>`mv [-p] src_url… dst_url`<<br>`mv\
  \ [-p] -I dst_url` | 移动对象和或子目录 |\n| `rm [-f] [-r] url…`<<br>`rm [-f] [-r] –I` |\
  \ 删除对象 |\n| `ls [-a] [-b] [-d] [-l] [-L] [-r] [-p proj_id] url…` | 列出桶和对象 |\n| `stat\
  \ url…` | 显示对象状态 |\n| `rewrite -k [-f] [-r] url…`<<br>`rewrite -k [-f] [-r] –I`\
  \ | 重写对象 |\n| `du url…` | 显示对象大小使用情况 |\n| `cat [-h] url…` | 将对象连接到标准输出 |\n| `compose\
  \ gs://bucket/obj1`<<br>`[gs://bucket/obj2 …]`. gs://bucket/composite` | 将多个对象合并为一个对象\
  \ |\n| `[-D] config [-a] [-b] [-e] [-f] [-n]`<<br>`[-o <file>] [-r] [-s <scope]\
  \ [-w]` | 获取凭据并创建配置文件 |\n| `web set [-m main_page_suffix]`<<br>`[-e error_page]\
  \ bucket_url…`<<br>`web get bucket_url` | 将一个或多个桶与网页关联 |\n\n这些命令中的许多都是直观的，但有几个值得额外解释。本文讨论探讨了\
  \ `mb`、`cp`/`mv`、`ls`/`stat` 以及 `cat`/`compose` 命令。\n\n### 创建桶 (mb)\n\n在向 Cloud\
  \ Storage 上传数据之前，你需要创建一个或多个桶。需要记住的命令是 `mb`：\n\n`gsutil mb [-c class] [-l location]\
  \ [-p project_id] url…`\n\n`-c`、`-l` 和 `-p` 标志特别为重要：\n\n* `-c`: 桶的存储类型：`multi_regional`、`regional`、`nearline`\
  \ 和 `coldline`。（默认：`multi_regional` 或 `regional`）。\n* `-l`: 桶的多区域位置或区域位置。（默认：`us`）。\n\
  * `-p`: 项目的 ID。（默认：`gsutil` 配置文件中的 ID）。\n\n例如，以下命令将创建一个名为 `gs://dummies123-tfbook/example`\
  \ 的区域桶，并将其与 `us-central1` 区域关联。\n\n```\ngsutil mb -c regional -l us-central1 gs://dummies123-tfbook/example\n\
  ```\n\n#### 复制 (cp) 和移动 (mv)\n\n创建桶后，你可以将文件上传到其中，从而向桶添加对象。同样，你可以将对象下载到你的系统作为文件。Google\
  \ 通过 `cp`（复制）和 `mv`（移动）命令实现了这些操作。这两个命令都会将源实体传输到目的地，但 `cp` 会保留源实体，而 `mv` 会移除源实体。\n\
  \n理解这些命令的最佳方法是看一些示例。以下命令将本地文件 `hello.txt` 上传到 Cloud Storage 中名为 `gs://newbucket`\
  \ 的桶中：\n\n```\ngsutil cp hello.txt gs://newbucket\n```\n\n同样，以下命令将 `hello.txt` 从\
  \ `gs://newbucket` 移动到你开发系统的当前目录。注意 `mv` 会从桶中移除 `hello.txt`：\n\n```\ngs mv gs://newbucket/hello.txt\
  \ .\n```\n\n`cp` 和 `mv` 接受与其在 Linux 中对应的许多相同标志。这些标志包括：\n\n* `-r`: 递归\n* `-I`: 输出详细信息\n\
  * `-e`: 覆盖\n\n例如，以下命令将 `mydir` 移动到 `firstbucket`：\n\n```\ngsutil mv -r firstbucket\n\
  ```\n\n由于 `-e` 标志，`gsutil` 将 `mydir` 合并到 `secondbucket`：\n\n```\ngsutil cp -e mydir\
  \ secondbucket\n```\n\n#### 读取信息 (ls 和 stat)\n\n`ls` 和 `stat` 命令提供关于对象的信息。`ls` 的一个有趣特性是可以识别层次结构。例如，以下命令列出桶的内容：\n\
  \n```\nutil ls bucket\n```\n\n如果你设置了 `-r`，将显示整个桶：\n\n```\nutil ls -r bucket\n```\n\
  \n另一个有用的标志是 `-l`，它让 `ls` 打印详细。这些细节包括大小、创建时间和所有者。\n\n```\nutil ls -l bucket\n```\n\
  \n如果你想要详细信息，`stat` 比 `ls` 更高效。`-L` 标志打印更多类型和更新时间。\n\n```\nstat ls -L bucket\n```\n\
  \n#### 连接 (cat 和 compose)\n\n`cat` 将对象的重定向到标准输出。例如，以下命令打印 `a.txt` 包含的内容：\n\n```\n\
  gsutil cat bucket/a.txt\n```\n\n尽管名字如此，你不能通过 `cat` 连接对象，但你可以通过 `compose` 连接对象。也就是说，以下命令将\
  \ `bucket` 中的 `a.txt` 和 `b.txt` 合并并将结果存储在 `c.txt` 中：\n\n```\ngsutil compose bucket/a.txt\
  \ bucket/b.txt bucket/c.txt\n```\n\n使用 `compose` 时请记住三点：\n\n* 项目每秒最多执行 200 次 `compose`\
  \ 操作。\n* 一个 `compose` 操作最多合并 32 个实体。\n* 给定的对象最多可以追加 1023 次。\n\n![tip](img/tip.png)`compose`\
  \ 对于你向 Cloud Storage 上传非常大的文件特别有用。与其从一台计算机上传整个文件，不如从不同的计算机上传文件的部分并使用 `compose` 合并这些部分。\n\
  \n## 准备部署\n\n在提交应用程序进行训练或预测之前，你应该通过以下两种方式对其准备：\n\n* 配置应用程序接收来自 ML Engine 的命令行参数\n\
  * 以包的形式组织应用程序的文件\n\n### 接收参数\n\n当 ML Engine 执行你的应用程序时，它会传递有关操作环境信息的参数。表 13-5 列出了可能的参数。\n\
  \n| **参数** || **操作** |\n| --- | --- |\n| `--job-dir` | 应用程序数据的位置 |\n\n\n\n\n\n|\
  \ `--train_batch_size` | 训练批大小 |\n| `--train_steps` | 每个训练 epoch 的步数 |\n| `--eval_batch_size`\
  \ | 评估批大小 |\n| `--eval_steps` | 在每个检查点处运行评估的步数 |\n| `--eval_delay_secs` | 首次评估之前的等待时间（秒）\
  \ |\n| `--min_eval_frequency` | 两次评估之间的最小训练步数 |\n\n`--job-dir` 特别重要，因为它告诉应用程序应该在何处存储输出文件。下面的代码演示了如何使用\
  \ `ArgumentParser` 访问该参数：\n\n```python\nif __name__ == '__main__':\n    parser =\
  \ argparse.ArgumentParser()\n    parser.add_argument(\n        '--job-dir',\n  \
  \      help='Checkpoint/output location',\n        required=True\n    )\n    args\
  \ = parser.parse_args()\n```\n\n除了内置参数外，你还可以提供自己的参数。当你提交作业时，ML Engine 将将你的参数传递给应用程序。但请记住以下两点：\n\
  \n- 用户定义的标志必须在所有内置标志之后。\n- 两个横线 (`--`) 必须将内置标志与用户定义的标志隔开。\n\n例如，假设你想向应用程序传递两个名为\
  \ `data_dir` 和 `num_epochs` 的参数。当你执行命令时，需要在命令末尾设置 `--data_dir` 和 `--num_epochs`\
  \ 标志，并用 `--` 将它们与命令的标准标志分开。\n\n### 打包 TensorFlow 代码\n\n你可以使用命令 `gcloud ml-engine\
  \ jobs submit training` 启动训练操作。当你执行该命令时，可以使用 `--package-path` 和 `--module-name`\
  \ 标志识别源代码。`--package-path` 标志标识包含代码的目录，该目录必须满足以下要求：\n\n- 目录必须包含由 `--module-name`\
  \ 标识的模块。\n- 父目录必须包含一个名为 `setup.py` 的文件。\n- 父目录下的每个目录都必须有一个名为 `__init__.py` 的文件。该文件通常是空的。\n\
  - 开发系统必须安装了 `setuptools`。\n\n最后一点非常重要。在上传包之前，ML Engine 使用 `setuptools` 将父目录压缩成一个\
  \ `*.tar.gz` 文件。如果你安装了 `pip`，可以通过 `pip install setuptools` 安装 `setuptools`。\n\n\
  ### setup.py\n\n在 Python 包中，`setup.py` 包含了构建和安装包的指令。如果你想让 ML Engine 安装你的包，`setup.py`\
  \ 必须执行两个操作：\n\n- 导入 `setuptools.setup`。\n- 调用 `setuptools` 模块的 `setup` 函数。\n\n`setup`\
  \ 函数接受关于包的大量信息，包括名称、版本和依赖项。表 13-6 列出了你可以设置的九个参数。\n\n#### 表 13-6 setup 函数的参数\n\n\
  | 参数 | 说明 |\n| --- | --- |\n| `name` | 包名 |\n| `version` | 发布版本 |\n| `packages`\
  \ | 依赖包 |\n| `install_requires` | 安装包时需要安装的包 |\n| `author` | 包作者名称 |\n| `author_email`\
  \ | 作者邮箱 |\n| `url` | 包的主页 |\n| `description` | 包的简短描述 |\n| `license` | 包的许可证 |\n\
  \n与其手动列出包的依赖项，不如调用 `setuptools` 提供的 `find_packages`。列表 13-1 显示了 `ch13/cloud_mnist`\
  \ 文件夹下 `setup.py`文件的内容：\n\n#### 列表 13-1 机器学习包的 Setup 脚本\n\n```python\nfrom setuptools\
  \ import find_packages\nfrom setuptools import setup\n\nREQUIRED_PACKAGES = ['tensorflow>=1.3']\n\
  \nsetup(\n    name='trainer',\n    version='0.1',\n    install_requires=REQUIRED_PACKAGES,\n\
  \    packages=find_packages(),\n    include_package_data=True,\n    author='Matthew\
  \ Scarpino',\n    description='Running MNIST classification in the cloud'\n)\n```\n\
  \n遗憾的是，ML Engine 并不总是安装了最新版本的包。在编写本文时，当前版本的 TensorFlow 版本为 1.4，但 ML Engine 支持的默认版本是\
  \ 1.2。\n\n你可以通过设置 `install_requires` 字段来请求特定版本的包。\n\n### 使用 Cloud SDK 执行应用程序\n\n\
  如果你了解如何使用 Cloud SDK、将数据传输到 Cloud Storage 以及如何构建你的包，你就可以开始使用 ML Engine 运行作业了。ML Engine\
  \ 支持两种类型的作业：训练和预测。尽管名称相似，但它们之间存在差异。\n\n本章侧重于云计算，因此使用 Cloud SDK 在本地启动作业可能看起来很奇怪。但\
  \ ML Engine 既不简单也不免费，因此我建议在将应用程序部署到云端之前，在本地对其进行测试。\n\n你可以通过输入以下命令之一在开发系统上启动作业：\n\
  \n- `gcloud ml-engine local train`：运行训练作业\n- `gcloud ml-engine local predict`：运行预测作业\n\
  \n这些命令产生不同的结果并接受不同的配置标志。\n\n#### 运行本地训练作业\n\n训练作业执行 Python 包并在 `--job-dir` 标志指定的目录中产生输出。表\
  \ 13-7 列出了 `--job-dir` 以及其他你可以为本地训练设置的标志。\n\n#### 表 13-7 本地训练标志\n\n| 标志 | 说明 |\n\
  | --- | --- |\n| `--module-name=MODULE_NAME` | 标识要执行的模块 |\n| `--package-path=PACKAGE_PATH`\
  \ | 包含执行模块的 Python 包路径 |\n| `--job-dir=JOB_DIR` | 存储训练输出的路径 |\n| `--distributed`\
  \ | 以分布式模式运行 |\n| `--parameter-server-count=PARAMETER_SERVER_COUNT` | 运行的参数服务器数量\
  \ |\n| `--start-port=START_PORT` | 本地集群保留端口范围的起始端口 |\n| `--worker-count=WORKER_COUNT`\
  \ | 运行的节点数量 |\n\n`--package-path` 标志标识包的顶层目录。这是包含包 `setup.py` 文件的目录。`--module-name`\
  \ 标志标识包内要执行的模块。\n\n如果你想亲自尝试，请将 `ch12` 目录下的 `mnist_train.tfrecord`s 和 `mnist_test.tfrecords`\
  \ 文件复制到 `ch13` 目录。然后进入 `ch13/cloud_mnist` 目录并输入以下命令：\n\n```bash\ngcloud ml-engine\
  \ local train --module-name trainer.task --package-path trainer --job-dir output\
  \ --data_dir ../images\n```\n\n\n\n\n在此命令中，`--package-path` 表示 `trainer` 目录代表一个包，而\
  \ `--module-name` 表示包模块的名称为 `trainer.task`。`--job-dir` 标志告诉应用程序将其结果存储在名为 `output`\
  \ 的目录中。\n\n两个横杠（`--`）将 `--job-dir` 与 `--data_dir` 分隔。这意味着 `--data_dir` 以及任何随后的标志都由用户定义。\n\
  \n### 运行本地预测作业\n\n训练完成后，你可以通过执行 `gcloud ml-engine local predict` 来启动本地预测作业。表 13-8\
  \ 列出了你可以设置的各种标志。\n\n表 13-8 本地预测的标志\n\n| 标志 | 描述 |\n| --- | --- |\n| `--model-dir=MODEL_DIR`\
  \ | 模型的路径 |\n| `--json-instances=JSON_INSTANCES` | 包含 JSON 格式预测数据的本地文件路径 |\n| `--text-instances=TEXT_INSTANCES`\
  \ | 包含纯文本预测数据的本地文件路径 |\n\n你应当将 `--model-dir` 标志分配给包含训练操作输出的目录。此外，你需要使用 `--json-instances`\
  \ 或 `--text-instances` 标志来标识预测参数。\n\n### 部署到云端\n\n如果你成功在本地启动了作业，那么将你的应用程序部署到云端应该不会有困难。但请注意两个问题：\n\
  \n*   你需要将训练/评估数据上传到 Cloud Storage（云端存储）。\n*   ML Engine 可能不支持你所需要的包版本。\n\n在执行 `ch13`\
  \ 目录中的任何一个应用程序之前，你需要将 `mnist_test.tfrecords` 和 `mnist_train.tfrecords` 文件上传到 Cloud\
  \ Storage 存储桶中。例如，如果你的项目 ID 为 `$(PROJECT_ID)`，你可以使用以下命令在中央部创建一个名为 `$(PROJECT_ID)_mnist`\
  \ 的存储桶：\n\n```\ngsutil mb -c regional -l us-central1 gs://$(PROJECT_ID)_mnist\n\
  ```\n\n创建存储桶后，你可以使用以下命令将两个 `MNIST` 文件上传到存储桶中：\n\n```\ngsutil cp mnist_test.tfrecords\
  \ mnist_train.tfrecords gs://$(PROJECT_ID)_mnist\n```\n\n命令执行后，最好检查 Cloud Storage\
  \ 是否为这两个文件创建了对象。你可以通过运行命令 `gsutil ls gs://$(PROJECT_ID)_mnist` 来验证这一点。\n\n### 运行远程训练作业\n\
  \n上传测试/评估数据后，你可以使用以下命令启动训练作业：\n\n```bash\ngcloud ml-engine jobs submit training\
  \ $(JOB_ID)\n```\n\n`$(JOB_ID)` 为训练作业提供了一个唯一标识符。启动作业后，你可以使用此 ID 检查作业状态。\n\n除了标识作业外，你还需要告诉\
  \ ML Engine 在哪里找到你的包和输入数据。你还需要告诉引擎它应该将输出文件存储在哪里。你可以通过在命令后标志标志提供这些信息，表 13-9 列出了每一个标志。\n\
  \n表 13-9 云端训练作业的标志\n\n| 标志 | 描述 |\n| --- | --- |\n| `--module-name=MODULE_NAME`\
  \ | 标识要执行的模块 |\n| `--package-path=PACKAGE_PATH` | 包含要执行模块的 Python 包路径 |\n| `--job-dir=JOB_DIR`\
  \ | 存储输出文件的路径 |\n| `--staging-bucket=STAGING_BUCKET` | 操作期间存放包的桶 |\n| `--region=REGION`\
  \ | 机器学习作业的区域 |\n| `--runtime-version=RUNTIME_VERSION` | 作业使用的 ML Engine 版本 |\n\
  | `--stream-logs` | 阻塞直到作业完成并流式传输日志 |\n| `--scale-tier=SCALE_TIER` | 作业的环境 |\n|\
