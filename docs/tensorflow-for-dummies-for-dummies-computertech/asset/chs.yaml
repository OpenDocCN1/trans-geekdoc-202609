  \ name=None)` | 创建具有给定形状和数据类型的单位矩阵 |\n| `matmul(a, b, transpose_a=False, transpose_b=False,\
  \ adjoint_a=False, adjoint_b=False, a_is_sparse=False, b_is_sparse=False, name=None)`\
  \ | 返回两个输入矩阵的积 |\n| `norm(tensor, ord='euclidean', axis=None, keep_dims=False, name=None)`\
  \ | 返回输入张量给定轴按指定阶数的范数 |\n| `matrix_solve(A, b, adjoint=None, name=None)` | 返回张量\
  \ `x` 以 `Ax = b`，其中 `A` 是矩阵，`b` 是向量 |\n| `qr(input, full_matrices=None, name=None)`\
  \ | 返回给定矩阵或矩阵的特征向量和特征值 |\n| `svd(tensor, full_matrices=False, compute_uv=True, name=None)`\
  \ | 将矩阵分解为正矩阵、对角矩阵和正矩阵的共轭转置 |\n| `einsum(equation, *inputs)` | 执行自定义数学运算 |\n\n在这些函数中，最常用的是\
  \ `tensordot` 和 `matmul`。`tensordot` 返回两个输入张量的一个或多个轴的点积。`axes` 参数告诉 `tensordot`\
  \ 应该处理哪些维度。如果你将此参数设置为标量，`tensordot` 将访问第一个张量的最后 `N` 个轴。如果你将 `axes` 设置为列表或张量，第一行识别第一个张量的轴，第二行识别第二个张量的轴。`matmul`\
  \ 执行传统的矩阵乘法。即，它将第一个张量的行乘以第二个张量的列，并返回一个包含这些和的矩阵。以下代码展示了它的样子：\n\n```python\nt1 = tf.constant([4.,\
  \ 3.])\nt2 = tf.constant([2., 1.])\ndot = tf.tensordot(t1, t2, 1) # 4*2 + 3*1 =\
  \ 11\n```\n\n我在表 3-8 中喜欢的函数是 `einsum`，它允许使用一种称为爱因斯坦求和收约的特殊格式来创建和执行数学运算。假设该操作有一个或两个输入。如果你提供两个输入，必须用逗号分隔它们。输入和输出的维度由下标（如\
  \ `i`, `j`, `k`）表示，并用 `->` 符号隔开。如果下标是重复的且没有输出下标，则执行加法。因此，`einsum('i,i', t1, t2)`\
  \ 计算张量 `t1` 和 `t2` 的点积。如果下标是重复的且有输出下标，则执行乘法。因此，`einsum('i->i', t1, t2)` 计算张量 `t1`\
  \ 和 `t2` 的元素积。\n\n以下代码调用 `einsum` 来转置矩阵并相乘两个矩阵：\n\n```python\nm1 = tf.constant([[1,\
  \ 2], [3, 4]])\nm2 = tf.constant([[5, 6], [7, 8]])\ne1 = tf.einsum('ij->ji', m1)\
  \ # 转置\ne2 = tf.einsum('ij,jk->ik', m1, m2) # 矩阵乘法\n```\n\n关于爱因斯坦求和收约更完整的讨论，我推荐\
  \ Samuel Prime 的演讲：`https://samprime.wordpress.com/2015/03/25/einstein-summation-convention`。\n\
  \n## 理论实践\n\n`ch3/simple_math.py` 中的代码演示了本章介绍的许多函数。列表 3-1 提供了完整的应用。\n\n### 列表 3-1\
  \ 简单数学运算\n\n```python\n## 使用常量张量进行运算\nconst_a = tf.constant(3.6)\nconst_b = tf.constant(1.2)\n\
  total = const_a + const_b\nquot = tf.div(const_a, const_b)\n\n## 使用随机张量进行运算\nrand_a\
  \ = tf.random_normal([3], 2.0)\nrand_b = tf.random_uniform([3], 1.0, 4.0)\ndiff\
  \ = tf.subtract(rand_a, rand_b)\n```\n\n\n\n\n```python\nmat_b = tf.constant([[6,\
  \ 4, 1], [3, 7, 2]])\nmat_prod = tf.matmul(mat_a, mat_b)\n```\n\n## 执行操作\n\n```python\n\
  with tf.Session() as sess:\n    print(\"Sum: %f\" % sess.run(total))\n    print(\"\
  Quotient: %f\" % sess.run(quot))\n    print(\"Difference: \", sess.run(diff))\n\
  \    print(\"Element-wise product: \", sess.run(prod))\n    print(\"Dot product:\
  \ \", sess.run(dot))\n    print(\"Matrix product: \", sess.run(mat_prod))\n```\n\
  \n这段代码大部分看起来都很熟悉。该程序创建并操作了常量张量、随机张量、向量和矩阵。为了处理向量，程序使用 `tf.multiply` 执行元素级乘法，然后使用\
  \ `tf.tensordot` 计算两个向量的点积。\n\n代码的最后部分需要解释。该程序创建了一个名为 `sess` 的 `Session`（会话），并为每个要执行的操作调用一次其\
  \ `run` 方法。要理解什么是会话以及它们如何工作，你需要熟悉图（graphs）。下一章将探讨会话和图的主题。\n\n# 第 4 章\n\n# 在会话中执行图\n\
