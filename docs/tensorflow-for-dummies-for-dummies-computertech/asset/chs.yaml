  \ 将数据写入日志的函数 |\n| `tf.summary` | 生成摘要数据所需的类 |\n| `tf.metrics` | 用于衡量机器学习结果的函数 |\n\
  \n一旦安装了 TensorFlow，你将拥有名为 `tensorflow` 的目录，其中包含各种文件和文件夹。有两个顶级文件夹尤为重要。`core` 目录包含了\
  \ TensorFlow 的主要包和模块。`contrib` 目录包含了可能以后合并到 TensorFlow TensorFlow 的辅助包。\n\n当你编写\
