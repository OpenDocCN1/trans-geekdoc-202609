  \ 包含了神经网络类及相关的数学运算。`tf.layers` 提供了与多层神经网络相关的函数。`tf.contrib` 包含了易变或实验性的代码。`tf.image`\
  \ 提供了图像处理函数。`tf.estimator` 提供了训练和评估的高级工具。`tf.logging` 包含了将数据写入日志的函数。`tf.summary`\
  \ 包含了生成摘要数据所需的类。`tf.metrics` 提供了衡量机器学习结果的函数。\n\n\n\n\n欢迎信息非常简单明了，但应用程序的代码可能没有那么清晰。`Tensor`\
  \ 实例是一个包含数值或字符串数据的 n 维数组。Tensor 在 TensorFlow 开发中起着核心作用，第 3 章 对它们进行了详细讨论。\n\n`Session`\
  \ 用了执行 TensorFlow 操作的环境。从加法到优化，所有的 TensorFlow 操作都必须通过 session 执行。第 4 章 解释了你如何创建、配置和执行\
  \ session。\n\n## 设定样式\n\nGoogle 在 [`www.tensorflow.org/community/style_guide`](http://www.tensorflow.org/community/style_guide)\
  \ 提供了 TensorFlow 风格指南。其中四条准则如下：\n\n* TensorFlow 应用程序中的代码应同时兼容 Python 2 和 Python\
  \ 3。\n* 与第一条准则一致，每个模块都应该包含用于 `absolute_import`、`division` 和 `print_function` 的 `import`\
  \ 语句。\n* 缩进应使用两个空格而不是四个空格。\n* TensorFlow 模块应依赖 PEP（Python 增强提案）8 风格指南，除非这些指南与 TensorFlow\
  \ 风格指南冲突。\n\n你可以在 [`www.python.org/dev/peps/pep-0008`](http://www.python.org/dev/peps/pep-0008)\
  \ 找到 PEP8 指南。它的许多建议包括使用 docstrings、类名使用大写、以及函数和模块使用小写。你可以通过安装 `pylint` 包并运行 `pylint\
  \ filename.py` 来检查 Python 代码是否符合 PEP8。\n\n本书中的示例代码遵循了 Google 的所有建议，外有两点。首先，我使用了四个空格，因为那是\
  \ Python 的惯做法。其次，我倾向于使用简单的小写名称来命名常量，例如本章前面的列表 2-1 中的 `msg` 常量。\n\n如果你觉得我的反叛不可理喻，我不怪你。但如果你向\
  \ Python 派出警察来抓我，他们永远无法活着抓住我。\n\n## 第 3 章\n\n# 创建张量与操作\n\n## 本章内容\n\n![check](img/check.png)\
  \ **使用已知值和随机值创建张量**\n![check](img/check.png) **调用转换张量的函数**\n![check](img/check.png)\
  \ **通过操作处理张量**\n\n研究生阶段，我上过一门张量数学的课程，涵盖了张量在电磁学中的用法。教授向我们保证该理论是“美”且“优雅”的，但我们这些苦不堪的学生描述相对论数学为“不可理解”且“恐怖”。\n\
  \nTensorFlow 的核心数据类型是张量，幸运的是，它与电磁学或相对论无关。在书中，张量就是一个普通的数组。如果你熟悉 Torch 的 `Tensor`\
  \ 或 NumPy 的 `ndarray`，你会高兴地发现 TensorFlow 的张量在许多方面都是相似的。\n\n遗憾的是，你无法通过普通的 Python\
  \ 程序访问这些张量。因此，TensorFlow API 提供了大量的函数，用于创建、转换和操作张量。本章介绍了其中许多函数，并演示了你如何使用它们。\n\n\
  ## 创建张量\n\n就像大多数程序从声明变量开始一样，大多数 TensorFlow 应用程序从创建张量开始。张量是一个具有零或多个维度的数组。零维张量称为 `scalar`（标量），一维张量称为\
  \ `vector`（向量），二维张量称为 `matrix`（矩阵）。记住关于张量的这三点：\n\n* 每个张量都是 `Tensor` 类的实例。\n* 每个张量可以包含数值、字符串或布尔值。\n\
  * 张量可以通过 `tf` 包中的函数进行创建、转换和操作。\n\n本节解释了如何创建已知值和随机值的张量。我还会介绍转换张量内容的函数。一旦你理解了这些主题，编写简单的张量处理程序将不再是困难。\n\
  \n## 创建已知值的张量\n\n`tf` 包提供了七个创建已知值张量的函数。表 3-1 列出了这些函数并提供了每个函数的描述。\n\n表 3-1 创建已知值的张量\n\
  \n| **函数** | **描述** |\n| --- | --- |\n| `constant(value, dtype=None, shape = None,\
  \ name = 'Const', verify_shape=False)` | 返回包含给定值的张量 |\n| `zeros(shape, dtype=tf.float32,\
  \ name = None)` | 返回填充为零的张量 |\n| `ones(shape, dtype=tf.float32, name=None)` | 返回填充为一的张量\
  \ |\n| `fill(dims, value, name=None)` | 返回填充为给定值的张量 |\n| `linspace(start, stop,\
  \ num, name=None)` | 返回线性等间距张量 |\n| `range(start, stop, num, dtype=None, name=None)`\
  \ | 返回包含的张量 |\n| `range(start, stop, num, dtype=None, name=None)` | 返回包含的张量 |\n\n\
  张量可能有多个维度，张量的维度数量称为其 `rank`（秩）。张量的各个长度构成了其 `shape`（形状）。[表 3-1] 中的许多函数都接受一个 `shape`\
  \ 参数来指定所需的形状。以下示例演示了你如何设置它：\n\n* `[]` — 张量包含单个值。\n* `[3]` — 张量是一维的。\n* `[3, 4]`\
  \ — 张量是一个 3x4 的矩阵。\n* `[3, 4, 5]` — 张量是多维数组。\n\n默认情况下，如果函数的第一个参数不具有 `shape` 参数所指定的形状，TensorFlow\
  \ 不会抛出错误。但如果你将最后一个参数 `verify_shape` 设置为 `True`，TensorFlow 将验证这两个形状是否相等。以下代码提供了一个形状不匹配的示例：\n\
  \n\n\n\n\n```\nt3 = tf.constant([4, 2], tf.int16, [3], 'Const', True)\n```\n\n在这种情况下，给定的形状\
  \ `[3]` 与第一个参数的形状 `[2]` 不匹配。结果是，TensorFlow 显示了以下错误：\n\n```\nTypeError: Expected\
  \ Tensor's shape: (3,), got (2,).\n```\n\n### zeros, ones, and fill\n\n`zeros`、`ones`\
  \ 和 `fill` 函数创建所有元素都具有相同值的张量。对于 `zeros` 和 `ones`，唯一必需的参数是 `shape`，它用于指明目标张量的形状。例如，以下代码创建了一个元素等于\
  \ 0.0 的简单 1-x-3 向量：\n\n```\nzero_tensor = tf.zeros([3])\n```\n\n同样，接下来的函数调用创建了一个元素等于\
  \ 1.0 的 4-x-4 矩阵：\n\n```\none_tensor = tf.ones([4, 4])\n```\n\n`fill` 函数需要一个 `value`\
  \ 参数，用于设置张量元素的值。以下代码创建了一个值被设置为 81.0 的三维张量：\n\n```\nfill_tensor = tf.fill([1, 2,\
  \ 3], 81.0)\n```\n\n与 `zeros` 和 `ones` 不同，`fill` 没有 `dtype` 参数。它只能创建包含 32 位浮点数值的张量。\n\
  \n### 创建序列\n\n`linspace` 和 `range` 函数创建元素在起始值和结束值之间规律变化的张量。它们之间的区别在于 `linspace`\
  \ 创建一个具有特定数量值的张量。例如，以下代码创建了一个元素从 5.0 到 9.0 的 1-x-5 张量：\n\n```\nlin_tensor = tf.linspace(5.,\
  \ 9., 5)\n# Result: [5. 6. 7. 8. 9.]\n```\n\n与 `linspace` 不同，`range` 不接受张量中的元素数量。相反，它通过增加一个名为\
  \ `delta` 的值来计算连续元素。在以下代码中，`delta` 被设置为 0.5：\n\n```\nrange_tensor = tf.range(3.,\
  \ 7., delta=0.5)\n# Result: [3.0 3.5 4.0 4.5 5.0 5.5 6.0 6.5]\n```\n\n与 Python 的\
  \ `range` 函数一样，TensorFlow 的 `range` 函数可以在不带 `start` 参数的情况下调用。在这种情况下，起始值被假设为 0.0。以下代码演示了这一点：\n\
  \n```\nrange_tensor = tf.range(1.5, delta=0.3)\n# Result: [0.0 0.3 0.6 0.9 1.2]\n\
  ```\n\n如果 `delta` 参数为正，则起始值必须小于结束值。如果 `delta` 为负，则起始值必须大于结束值。\n\n### 创建带有随机值的张量\n\
  \n许多 TensorFlow 应用需要包含随机值而非预定义值值的张量。`tf` 包提供了许多用于创建随机值张量的函数，表 3-3 列出了其中五个。\n\n|\
  \ 函数 | 描述 |\n| :--- | :--- |\n| `random_normal(shape, mean=0.0, stddev=1.0, dtype=tf.float32,\
  \ seed=None, name=None)` | 创建一个符合正态分布值的张量 |\n| `truncated_normal(shape, mean=0.0,\
  \ stddev=1.0, dtype=tf.float32, seed=None, name=None)` | 创建一个符合正态分布值的张量，但排除两个标准差之外的值\
  \ |\n| `random_uniform(shape, minval=0, maxval=1, dtype=tf.float32, seed=None, name=None)`\
  \ | 创建在最小值和最大值之间均匀分布的张量 |\n| `random_shuffle(tensor, name=None)` | 打乱张量的顺序 |\n|\
  \ `set_random_seed(seed)` | 设置随机种子 |\n\n`random_normal` 和 `truncated_normal` 函数创建包含正态分布值的张量，`truncated_normal`\
  \ 则排除了两个标准差之外的值。如图 3 所示，正态分布的 68% 的值落在均值的一个标准差范围内，95% 落在两个标准差范围内，99.7% 落在三个标准差范围内。对于\
  \ `truncated_normal`，值不会落在两个标准差之外。\n\n`random_uniform` 创建在最小值和最大值之间均匀分布的张量。对于 `random_normal`，默认情况下其均值为\
  \ 0.0，标准差为 1.0。在生成随机生成张量时，`random_shuffle` 会打乱张量的顺序。`set_random_seed` 用于设置生成随机数时的种子。\n\
  \n### 转换张量\n\n应用必须指定要转换的张量形状。`tf` 包提供了更新张量及其形状的转换函数。表 3-4 列出了这些转换函数及其描述。\n\n| 函数\
  \ | 描述 |\n| :--- | :--- |\n| `cast(tensor, dtype, name=None)` | 修改张量的数据类型 |\n| `reshape(tensor,\
  \ shape, name=None)` | 返回一个与给定张量具有相同元素的张量 |\n| `squeeze(tensor, axis=None, name=None,\
  \ squeeze_dims=None)` | 移除大小为 1 的维度 |\n| `reverse(tensor, axis, name=None)` | 反转给定的维度\
  \ |\n| `slice(tensor, begin, size, name=None)` | 提取张量的一部分 |\n| `stack(tensors, axis=0,\
  \ name='stack')` | 将张量列表合并为高阶张量 |\n| `unstack(tensor, num=None, axis=0, name='unstack')`\
  \ | 将张量拆分为低阶张量列表 | |\n\n尽管名字是 `reshape`，它也不会修改现有张量。相反，函数返回一个与给定张量具有相同元素且具有指定形状的张量。例如，以下代码使用\
  \ `reshape` 将一个四元素向量转换为 2-x-2 矩阵：\n\n```\nvec = tf.constant([1., 2., 3., 4.])\n\
  mat = tf.reshape(vec, [2, 2])\n```\n\n如果张量的任何维度大小为 1，调用 `squeeze` 将将其移除，从而降低张量的秩。如果函数的\
  \ `axis` 参数指定了一个或多个维度，则只有这些维度会受到 `squeeze` 的影响。\n\n在 `reverse` 函数中，`axis` 参数指定要反转的一个或多个维度。以下代码演示了\
  \ `reverse` 是如何运作的：\n\n```\nmat = tf.constant([[1., 2., 3.], [4., 5., 6.]])\nrev_mat\
  \ = tf.reverse(mat, [0])\n# Result: [[4. 5. 6.], [1. 2. 3.]]\n\nrev_mat = tf.reverse(mat,\
  \ [1])\n# Result: [[3. 2. 1.], [6. 5. 4.]]\n```\n\n\n\n\n\n```python\nrev_mat =\
  \ tf.reverse(end, [0, 1])\n# Result: [[6. 5. 4.], [3. 2. 1.]]\n```\n\n`slice` 函数从张量（tensor）中提取子张量。`begin`\
  \ 参数指定了要提取的第一个元素的索引，而 `size` 指定了从 `begin` 位置开始要提取的张量的形状。\n\n例如，假设你想从一个 `3-x-3` 矩阵中提取右下角的\
  \ `2-x-2` 矩阵。第一个提取元素的元素索引为 `[1, 1]`，目标张量的大小为 `[2, 2]`。以下代码使用 `slice` 执行此提取：\n\n\
  ```python\nmat = tf.constant([[1., 2., 3.], [4., 5., 6.], [7., 8., 9.]])\nslice_mat\
  \ = tf.slice(mat, [1, 1], [2, 2])\n# Result: [[5. 6.] [7. 8.]]\n```\n\n`stack` 接受一个秩（rank）为\
  \ `N` 的张量列表，并返回一个秩为 `N+1` 的单个张量。除了具有相同的秩，输入张量必须具有相同的形状。以下代码演示了如何使用 `stack`。该函数将三个一维张量合并为一个二维张量：\n\
  \n```python\nt1 = tf.constant([1., 2.])\nt2 = tf.constant([3., 4.])\nt3 = tf.constant([5.,\
  \ 6.])\nt4 = tf.stack([t1, t2, t3])\n```\n\n当这些操作执行时，`t4` 将等于 `[[1. 2.] [3. 4.]\
  \ [5. 6.]]`。如果 `axis` 参数设置为 `1`，将沿着第二个维度进行堆叠，因此 `t4` 将设置为 `[[1. 3. 5.] [2. 4. 6.]]`。\n\
  \n`unstack` 执行 `stack` 的逆操作。也就是说，`unstack` 接受一个秩为 `N` 的张量，并返回一个秩为 `N-1` 的张量列表。`num`\
  \ 参数决定了应该解包多少个张量，如果未设置，`unstack` 会从张量的形状推断出数量。\n\n## 创建操作\n\n机器学习应用本质上是数学的，TensorFlow\
  \ 提供了丰富的例程来对张量执行数学操作。每个例程都由 `tf` 包中的一个函数表示，每个函数都返回一个张量。本节介绍了大部分可用操作，但 `tensorflow`\
  \ 包提供的函数比这里讨论的要多得多。\n\n为了描述这些函数，我使用了像“函数 X 执行操作 Y”这样的语句。但这些陈述并不完全准确。这些函数与在前节中讨论的变换函数一样实际上并没有执行它们对应的操作——至少，不是直接执行。\n\
  \n例如，`tf.multiply` 不会立即乘以它的参数并返回乘积。相反，它向当前图中添加了一个乘法操作，当会执行图时，乘法将与图中其余的操作一起执行。这个过程看起来可能很困惑，但请不要担心。[第\
  \ 4 章] 将详细介绍图和会。\n\n### 基础数学操作\n\n涉及 TensorFlow 操作时，最好从简单开始。[表 3-5] 列出了 12 个执行基础数学操作的函数。\n\
  \n### 表 3-5 基础数学操作\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `add(x, y, name=None)` | 加两个张量\
  \ |\n| `subtract(x, y, name=None)` | 减两个张量 |\n| `multiply(x, y, name=None)` | 乘两个张量\
  \ |\n| `divide(x, y, name=None)` | 除两个张量 |\n| `div(x, y, name=None)` | 除两个张量 |\n\
  | `add_n(inputs, name=None)` | 多个张量相加 |\n| `scalar_mul(scalar, x)` | 用标量缩放张量 |\n\
  | `mod(x, y, name=None)` | 执行模运算 |\n| `abs(x, name=None)` | 计算绝对值 |\n| `negative(x,\
  \ name=None)` | 张量取反 |\n| `sign(x, name=None)` | 提取张量的符号 |\n| `reciprocal(x, name=None)`\
  \ | 计算倒数 |\n\n前四个函数执行算术运算。以下代码演示了它们是如何工作的：\n\n```python\na = tf.constant([3., 3.])\n\
  b = tf.constant([2., 2.])\nsum = tf.add(a, b)\ndiff = tf.subtract(a, b)\nprod =\
  \ tf.multiply(a, b)\nquot = tf.divide(a, b)\n```\n\n可以使用普通的 Python 运算符 `+`、`-`,`*`\
  \ 和 `//` 执行逐元素操作。例如，以下几行显示了 `ceil` 和 `floor` 如何产生浮点结果：\n\n```python\na = tf.constant([3.,\
  \ 3.])\nb = tf.constant([2., 2.])\ntotal = a + b\ntotal2 = a - b\ntotal3 = a * b\n\
  total4 = a // b\n```\n\n当处理浮点值时，`divide` 返回相同的结果。但对于整数，`divide` 返回整数。以下代码演示了差异：\n\
  \n```python\nt1 = tf.constant([5., 5.])\nt2 = tf.constant([2., 2.])\ndiv1 = tf.divide(t1,\
  \ t2)\ndiv2 = t1 / t2\ndiv3 = t1 % t2\ndiv4 = t1 // t2\n```\n\n### 取舍与比较\n\n`round`\
  \ 函数检查张量的每个元素并返回最近的整数。如果两个整数等近，它返回离零更远的一个。`rint` 类似，但舍入到最近的偶值。以下代码演示了你如何使用 `round`、`rint`、`ceil`\
  \ 和 `floor`：\n\n```python\nt = tf.constant([-6.5, -3.5, 3.5, 6.5])\nr1 = tf.round(t)\n\
  r2 = tf.rint(t)\nr3 = tf.ceil(t)\nr4 = tf.floor(t)\n```\n\n表中接两个函数 `maximum` 和 `minimum`\
  \ 很容易理解。`maximum` 返回包含输入张量较大元素的张量，而 `minimum` 返回包含输入张量较小元素的张量。\n\n`argmax` 和 `argmin`\
  \ 返回张量中最大和最小元素的索引值。以下代码显示了你如何使用这些函数：\n\n```python\nt1 = tf.constant([0, -2, 4, 6])\n\
  t2 = tf.constant([[1, 3], [7, 2]])\nr1 = tf.argmin(t1)\nr2 = tf.argmax(t2)\n```\n\
  \n\n\n\n机器学习应用经常需要使用指数和对数来计算误差和概率。为了满足这一需求，TensorFlow 提供了许多与 NumPy 相同的函数。表 3-7 列出了其中的\
  \ 11 种函数，并对每种函数提供了描述。\n\n### 表 3-7 指数和对数运算\n\n| 函数 | 描述 |\n| --- | --- |\n| `square(x,\
  \ name=None)` | 返回参数的平方 |\n| `squared_difference(x, y, name=None)` | 从第二个参数中减去第一个参数并返回平方\
  \ |\n| `sqrt(x, name=None)` | 返回参数的平方根 |\n| `rsqrt(x, name=None)` | 返回平方根的倒数 |\n\
  | `pow(x, y, name=None)` | 返回第一个张量量元素提升到第二个向量元素的幂 |\n| `exp(x, name=None)` | 返回参数的指数函数\
  \ |\n| `expm1(x, name=None)` | 返回参数的指数函数减 1，`exp(x) - 1` |\n| `log(x, name=None)`\
  \ | 返回参数的自然对数 |\n| `log1p(x, name=None)` | 返回参数加 1 的自然对数，`log(x + 1)` |\n| `erf(x,\
  \ name=None)` | 返回参数的误差函数 |\n| `erfc(x, name=None)` | 返回参数的补误差函数 |\n\n这些函数的使用和理解非常简单。每个函数都以逐元素的方式执行，以下代码演示了如何调用\
  \ `square`、`sqrt` 和 `rsqrt`：\n\n```python\nt = tf.constant([4.])\nt1 = tf.square(t)\
  \ # 16\nt2 = tf.sqrt(t) # 2\nt3 = tf.rsqrt(t) # 0.5\n```\n\n`exp` 函数计算张量元素的指数函数，而\
  \ `expm1` 则从每个指数减去 1。如果 `x` 是输入张量中的一个值，`expm1` 的结果等于 `exp(x) – 1`。\n\n同样，`log` 函数计算张量元素的自然对数。`logp1`\
  \ 在计算对数之前的值加 1，因此如果 `x` 是输入张量中的一个值，`logp1` 的结果等于 `log(x + 1)`。\n\n### 向量和矩阵运算\n\n\
  机器学习应用在向量（一维张量）和矩阵（二维张量）中存储大量数据。为了处理这些数据，TensorFlow 提供了许多对向量和矩阵的函数。表 3-8 列出了这些函数，并对每种函数提供了描述。\n\
  \n### 表 3-8 向量和矩阵运算\n\n| 函数 | 描述 |\n| --- | --- |\n| `tensordot(a, b, axes, name=None)`\
  \ | 返回给定轴上元素乘积的和 |\n| `cross(a, b, name=None)` | 返回逐元素的叉积 |\n| `diag(diagonal, name=None)`\
  \ | 返回一个具有给定对角线值的矩阵，其他值设为零 |\n| `trace(x, name=None)` | 返回对角线元素和 |\n| `transpose(x,\
  \ perm=None, name='transpose')` | 交换行和列 |\n| `eye(num_rows, num_columns=None, batch_shape=None,\
  \ dtype=tf.float32, name=None)` | 创建具有给定形状和数据类型的单位矩阵 |\n| `matmul(a, b, transpose_a=False,\
  \ transpose_b=False, adjoint_a=False, adjoint_b=False, a_is_sparse=False, b_is_sparse=False,\
  \ name=None)` | 返回两个输入矩阵的积 |\n| `norm(tensor, ord='euclidean', axis=None, keep_dims=False,\
  \ name=None)` | 返回输入张量给定轴按指定阶数的范数 |\n| `matrix_solve(A, b, adjoint=None, name=None)`\
  \ | 返回张量 `x` 以 `Ax = b`，其中 `A` 是矩阵，`b` 是向量 |\n| `qr(input, full_matrices=None, name=None)`\
  \ | 返回给定矩阵或矩阵的特征向量和特征值 |\n| `svd(tensor, full_matrices=False, compute_uv=True, name=None)`\
  \ | 将矩阵分解为正矩阵、对角矩阵和正矩阵的共轭转置 |\n| `einsum(equation, *inputs)` | 执行自定义数学运算 |\n\n在这些函数中，最常用的是\
  \ `tensordot` 和 `matmul`。`tensordot` 返回两个输入张量的一个或多个轴的点积。`axes` 参数告诉 `tensordot`\
  \ 应该处理哪些维度。如果你将此参数设置为标量，`tensordot` 将访问第一个张量的最后 `N` 个轴。如果你将 `axes` 设置为列表或张量，第一行识别第一个张量的轴，第二行识别第二个张量的轴。`matmul`\
  \ 执行传统的矩阵乘法。即，它将第一个张量的行乘以第二个张量的列，并返回一个包含这些和的矩阵。以下代码展示了它的样子：\n\n```python\nt1 = tf.constant([4.,\
  \ 3.])\nt2 = tf.constant([2., 1.])\ndot = tf.tensordot(t1, t2, 1) # 4*2 + 3*1 =\
  \ 11\n```\n\n我在表 3-8 中喜欢的函数是 `einsum`，它允许使用一种称为爱因斯坦求和收约的特殊格式来创建和执行数学运算。假设该操作有一个或两个输入。如果你提供两个输入，必须用逗号分隔它们。输入和输出的维度由下标（如\
  \ `i`, `j`, `k`）表示，并用 `->` 符号隔开。如果下标是重复的且没有输出下标，则执行加法。因此，`einsum('i,i', t1, t2)`\
  \ 计算张量 `t1` 和 `t2` 的点积。如果下标是重复的且有输出下标，则执行乘法。以下代码调用 `einsum` 来转置矩阵并相乘两个矩阵：\n\n```python\n\
  m1 = tf.constant([[1, 2], [3, 4]])\nm2 = tf.constant([[5, 6], [7, 8]])\ne1 = tf.einsum('ij->ji',\
  \ m1) # 转置\ne2 = tf.einsum('ij,jk->ik', m1, m2) # 矩阵乘法\n```\n[/content]\n```\n\n\
  关于爱因斯坦求和收约更完整的讨论，我推荐 Samuel Prime 的演讲：`https://samprime.wordpress.com/2015/03/25/einstein-summation-convention`。\n\
  \n## 理论实践\n\n`ch3/simple_math.py` 中的代码演示了本章介绍的许多函数。列表 3-1 提供了完整的应用。\n\n### 列表 3-1\
