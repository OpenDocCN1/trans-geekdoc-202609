- "# TensorFlow 入门指南\n\n\n\n\n## 引言\n\n机器学习是现代技术中最令人着迷且最重要的领域之一。在我写这本书时，NASA 已经利用机器学习来分析望远镜图像，并发现了遥远的行星。在仅训练了三天后，Google\
  \ 的 `AlphaGo` 程序就学会了复杂的围棋游戏，并击败了世界顶尖的大师。\n\n尽管机器学习如此强大，但很少有程序员知道如何利用它。部分原因在于，编写机器学习应用程序需要一种与常规编程不同的思维方式。其目标不是解决某个特定问题，而是编写一个能够解决许多未知问题的通用应用程序。\n\
  \n机器学习源自数学的许多不同分支，包括统计学、微积分、线性代数和优化理论。遗憾的是，现实世界并没有表现出按照数学方式运行的义务。即使你使用了最好的数学模型，仍然可能得到糟糕的结果。我多次遇到过这种挫败感，并曾不止一次将神经网络称为“高科技江湖骗油”。\n\
  \n`TensorFlow` 不会为你提供用于分析系统的理想模型，但它会减少机器学习开发中的花费和挫败感。你不需要从零开始编写激活函数和归一化程序，而是可以访问框架提供的许多内置功能。`TensorFlow\
  \ For Dummies` 解释了如何访问这些功能并将它们付诸实践。\n\n## 关于本书\n\n`TensorFlow` 是一个很难编写的主题。工具集不仅包含了数千计的类，而且其中许多类的功能相似。此外，某些类已经过时，而另一些则被标记为“不建议使用”。\n\
  \n尽管类极其繁多，但有三个类是每个 TensorFlow 开发者应该熟悉的：`Tensor`、`Graph` 和 `Session`。本书第一部分的章节详细讨论了这些类，并展示了它们的许多用法示例。\n\
  \n第 2 部分 中的章节解释了你如何在实际的机器学习任务中使用 `TensorFlow`。我从统计方法开始，包括线性回归、多项式回归和逻辑回归。然后，我深入了神经网络这一迷人的话题。我探索了基础神经网络的操作，然后介绍了卷积神经网络（`CNNs`）和循环神经网络（`RNNs`）。\n\
  \n第 3 部分 中的章节介绍了高层 `TensorFlow` 类，你可以使用它们来简化和加速你的应用程序。在讨论的许多主题中，最重要的是 `Estimator`\
  \ API，它允许你用极少的代码实现强大的机器学习算法。我解释了如何编写估计器（estimators）以及如何使用 Google Cloud Platform（`GCP`）高速执行它们。\n\
  \n## 愚的假设\n\n从本质上说，这本书涵盖了两个主题：机器学习理论以及使用 `TensorFlow` 对该理论的实现。关于理论，我很少做假设。我希望你了解线性代数的基础，但不要求你了解机器学习的任何知识。我也不要求你了解统计回归或神经网络，因此我对这些及其他概念提供了详尽的介绍。\n\
  \n关于 `TensorFlow` 开发，我针对你的编程背景做了假设。`TensorFlow` 支持几种编程语言，但核心语言是 `Python`。由于这个原因，本书以\
  \ `Python` 为中心，我提供的所有示例代码都是 `Python` 模块形式。我解释了如何安装 `TensorFlow` 并访问它的模块和类，但我没有解释什么是模块和类。\n\
  \n## 本书中使用的图标\n\n为了帮助你阅读文本，我在书的页边插入了图标。以下是它们的含义：\n\n![tip](img/tip.png)此图标表示文本包含开发机器学习应用程序的建议。\n\
  \n![technicalstuff](img/technicalstuff.png)此图标之前的内容将深入探讨机器学习的技术理论。许多读者可能发现这些理论很有帮助，但你不需要了解所有的细微细节。\n\
  \n![remember](img/remember.png)尽管我很喜欢 `TensorFlow`，但我承认它并没容易使用或理解。有许多关键点需要熟悉，在很多情况下，我使用这个图标来强调特别重要的概念。\n\
  \n## 本书之外\n\n本书涵盖了大量的 `TensorFlow` API，但仍有很多内容需要学习。首先要看的是官方文档，你可以在 [`www.tensorflow.org`](http://www.tensorflow.org)\
  \ 找到它。如果你对 `TensorFlow` 的函数感兴趣，最好的地方是 [`www.tensorflow.org/api_docs`](http://www.tensorflow.org/api_docs)。\n\
  \n如果你有无法通过本书或官方文档解决的问题，`StackOverflow` 是一个极佳的资源。该网站允许程序员提出问题并接收答案，在我的职业生涯中，我推荐访问\
  \ [`www.stackoverflow.com/tagged/tensorflow`](http://www.stackoverflow.com/tagged/tensorflow)。\n\
  \n除了你现在阅读的内容，这本书还附带了一份免费的快速参考（Cheat Sheet），为你提供了一些使用 `TensorFlow` 的提示。要获取此表，只需访问\
  \ [`www.dummies.com`](http://www.dummies.com) 并搜索“TensorFlow For Dummies Cheat Sheet”。我还提供了大量的示例代码，展示了如何将理论实践。以下是下载\
  \ `tfbook.zip` 文件的方法：\n\n1. 在 [`www.dummies.com`](http://www.dummies.com#_blank)\
  \ 上搜索 `TensorFlow For Dummies` 或书籍的 ISBN。\n2. 当书籍出现时，点击 `More about this book` 链接。\n\
  3. 解压缩存档后，你会发现一系列以本书章节命名的文件夹。第 3 章 的示例代码在 `ch3` 文件夹中，第 6 章 的代码在 `ch6` 中，依此类推。\n\n\
  ## 接下来的路程\n\n书中的材料由简单到复杂，从通用到深奥。如果你已经是 TensorFlow 专家，请随意跳过任何你熟悉的章节。但如果你是该工具集的新手，我强烈建议从第\
  \ 1 章开始，并线性顺序阅读第 2 章、第 3 章、第 4 章等章节。\n\n我非常非常写写这本书，也希望你喜欢这段发现之旅。*旅途愉快！*\n\n\n\n\
  在本部分中……\n\n探索迷人的机器学习领域，并发现为什么 TensorFlow 对机器学习开发至关重要。\n\n将 TensorFlow 包下载到你的电脑并安装完整的工具包。\n\
  \n发现 TensorFlow 的基础数据类型以及你可以对张执行的许多操作。\n\n理解张和操作如何存储在图中，以及图如何在会话中执行。\n\n研究 TensorFlow\
  \ 训练过程，该过程缩小数学模型与现实系统之间的差异。\n\n\n\n在本章中\n\n![check](img/check.png)**回顾时间变化的机器学习**\n\
  \n![check](img/check.png)**探索机器学习框架**\n\n\n\n\nTensorFlow 是 Google 开发的用于开发机器学习应用的强大框架。本书的大部分内容将深入探讨\
  \ TensorFlow 模块编码的细节，但本章将提供一个入门级的介绍。我将对该主题进行概述，然后讨论导致 TensorFlow 以及类似的机器学习框架诞生的进展。\n\
  \n## 理解机器学习\n\n和大多数正常、心理正常的人一样，我认为《终结者》是影史上最出色的电影之一。我第一次是在 13 岁时在一个生日派对上看到它，虽然故事的大部分内容我没太懂，但有一个场景给我留下了深刻印象：女主角给妈妈打电话，以为自己正在进行一段温暖的对话，但实际上她是在和一个来自未来的邪恶机器人通话！\n\
  \n这个机器人并没有预先设定好妈妈的声音或正确的短语序列。它必须自己找出这些内容。也就是说，它必须分析真实母亲的声音，检查英语语法规则，并为对话生成接受的句子。当计算机在没有收到精确指令的情况下从数据中获取信息时，它正在进行*机器学习*。\n\
  \n《终结者》是我第一次接触机器学习，但不会是最后一次。当我写下这本书时，机器学习已经无处不在。我的电子邮件提供商知道涉及“在线药”的消息是垃圾邮件，但关于“廉价麦司草”的消息就是重要的。Google\
  \ Maps 总是为我前往当地的埃维斯教派提供最佳路线，Amazon.com 总是知道我什么时候需要一个新的马头面具。这是魔法吗？不，这是机器学习！\n\n机器学习应用通过在海量数据中发现模式来实现这种力量。与普通程序不同，机器学习应用处理的是不性和概率。编码机器学习应用的过程与编码普通应用程序完全不同，这并不令人意外。开发者需要熟悉一套完全全新的概念和数据结构。\n\
  \n幸运的是，已经开发了许多框架来简化开发。在写本书期间，最流行的是 TensorFlow，它是由 Google 发布的一个开源工具集。在写这本书时，我的目标是教你如何利用\
  \ TensorFlow 开发你自己的机器学习应用。\n\n尽管本书没有涵盖伦理学话题，但我觉得有必要提醒读者编写邪恶机器人是错误的。是的，你会给教授留下深刻印象，这在简历上看起来很好。但社会会对这种行为嗤之以鼻，你的朋友也会疏远你。尽管如此，如果你必须编写邪恶机器人，TensorFlow\
  \ 是你应该使用的框架。\n\n## 机器学习的发展\n\n在我看来，机器学习是现代软件开发中最令人兴奋的话题，而 TensorFlow 是最好的使用的框架。为了说服你\
  \ TensorFlow 的伟大，我想向你介绍导致其诞的一些进展。图 1-1 展示了机器学习及相关软件开发的简要时间线。\n\n![图 1-1: 机器学习的发展从学术界延伸到企业。](img/9781119466215-fg0101.png)\n\
  \n图 1-1：\n\n### 统计回归\n\n在我看来，机器学习是现代软件开发中最令人兴奋的话题，而 TensorFlow 是最好的使用的框架。为了说服你 TensorFlow\
  \ 的伟大，我想向你介绍导致其诞的一些进展。图 1-1 展示了机器学习及相关软件开发的简要时间线。\n\n![图 1-1: 机器学习的发展从学术界延伸到企业。](img/9781119466215-fg0101.png)\n\
  \n### 逆转大脑\n\n在我看来，机器学习是现代软件开发中最令人兴奋的话题，而 TensorFlow 是最好的使用的框架。为了说服你 TensorFlow\
  \ 的伟大，我想向你介绍导致其诞的一些进展。图 1-1 展示了机器学习及相关软件开发的简要时间线。\n\n![图 1-1: 机器学习的发展从学术界延伸到企业。](img/9781119466215-fg0101.png)\n\
  \n### 稳步进展\n\n尽管失去了大众的赞誉，研究人员和学者仍继续研究机器学习。他们的工作导致了许多关键进展，包括：\n\n*   1965 年，Ivakhnenko\
  \ 和 Lapa 展示了具有非线性激活函数的多层感知器。\n\n\n\n\n\n*   1974 年，Paul Werbos 使用反向传播算法训练了神经网络。\n\
  *   1980 年，福岛邦彦（Kunihiko Fukushima）提出了 `neocognitron`，这是一种用于图像识别的层层神经网络。\n*   1982\
  \ 年，John Hopfield 开发了一种名为 `Hopfield network` 的循环神经网络（霍普网络）。\n*   1986 年，Sejnowski\
  \ 和 Rosenberg 开发了 `NETtalk`，这是一种学习如何发读单词的神经网络。\n\n这些发展扩展了机器学习的广度和能力，但其中没有一项曾能激发世界的想象力。问题在于，计算机缺乏在合理时间内执行现实世界机器学习所需的运行和内存。然而，这种情况即将发生改变。\n\
  \n#### 计算革命\n\n#### 计算革命\n\n随着 20 世纪 80 年代步入 90 年代，半导体设计的改进带来了计算能力的巨大飞跃。研究人员利用这种新力量来执行机器学习程序。最终，机器学习能够处理现实世界中的问题，而不仅仅是简单的概念证明。\n\
  \n随着冷战的加剧，军事专家对自动识别目标产生了兴趣。受福岛彦 `neocognitron` 的启发，研究人员专注于专为图像识别设计的神经网络，被称为 `卷积神经网络`\
  \ (CNNs)。1994 年发生了一个重大进展，Yann LeCunn 用他基于 CNN 的 `LeNet5` 架构成功演示了手写体识别。\n\n但存在一个问题。研究人员在应用中使用相似的理论，但他们都是从零开始编写所有代码。这意味着研究人员无法复制同行的结果，也无法重用彼此的代码。如果研究人员的经费耗尽，整个代码库很可能会消失。\n\
  \n20 世纪 90 年代后期，我的工作涉及编写卷积神经网络来识别脸。我热爱神经网络背后的理论，但在实践中我发现它们深感沮丧。机器学习应用需要仔细的调优和调整才能获得可以接受的结果。但代码的每次更改都需要重新运行训练，而训练一个\
  \ CNN 可能需要 `days`。即便如此，我仍然没有足够的训练数据来确保识别的准确。\n\n我和其他研究人员面临的问题之一是，虽然机器学习理论已经成熟，但软件开发过程仍处于婴儿阶段。程序员需要框架和标准库，以便他们不需要自己手写一切代码。此外，尽管英特尔（Intel）尽了努力，实际的机器学习仍然需要访问更多数据的快速处理器。\n\
  \n#### 大数据与深度学习的兴\n\n#### 大数据与深度学习的兴\n\n随着 21 世纪的到来，互联网的普及飞速增长，数据存储价格暴跌。大公司现在可以访问有关潜在消费者的\
  \ TB 数据。这些公司开发了改进的工具来分析他们的数据，这场数据存储和分析的革命被称为 `大数据革命`。\n\n现在，首席执行官们面临着一个难题：他们如何利用其海量数据为公司创造财富？一个首要任务是广告——如果公司知道应该向客户展示哪些广告，它们就能赚到更多的钱。但在将客户与产品关联方面还没有明确的规则。\n\
  \n许多公司启动了内部研究计划，以确定如何最好分析他们的数据。但在 2006 年，Netflix 尝试了不同的方法。他们将数据库大部分发布在网上，并向开发出最佳推荐引擎的人提供百万美元。获者\
  \ `BellKor’s Pragmatic Chaos` 结合了多种机器学习算法，将 Netflix 的算法提升了 10%。\n\nNetflix 并不是唯一使用机器学习的高知名公司。Google\
  \ 的 `AdSense` 使用机器学习来决定在其搜索引擎上显示哪些广告。Google 和特斯拉展示了自动驾驶汽车，这些汽车使用机器学习遵循道路并加入交通流。\n\
  \n全世界的大型组织都坐起来并给予了关注。机器学习已经离开了模糊的科幻小说领域，变成了一种实用的商业工具。创业者们继续思考，将机器学习应用于大数据还能获得哪些益处。\n\
  \n研究人员也注意到了这一点。一个主要任务是将现代机器学习（具有高复杂性和海量数据处理能力）与早期的机器学习（简单且很少有效）区分开。他们同意使用 `深度学习`\
  \ 术语来描述这种新的机器学习范式。第 7 章 对深度学习的技术含义进行了更详细的介绍。\n\n#### 机器学习框架\n\n#### 机器学习框架\n\n实际机器学习最重要的进展之一是框架的创建。`框架`\
  \ 自动化了开发机器学习应用程序的许多方面，并允许开发者重用代码并利用最佳实践。本讨论介绍了五个最流行的框架：`Torch`、`Theano`、`Caffe`、`Keras`\
  \ 和 `TensorFlow`。\n\n### Torch\n\nTorch 是第一个吸引大量追随者的机器学习框架。它最初由 Ronan Collobert\
  \ 于 2002 年发布，起作为一个数值计算的工具集。`Torch` 的计算涉及称为 `tensors` 的多维数组，这些可以通过可以通过向量/矩阵操作进行处理。随着时间的推移，`Torch`\
  \ 获取了构建、训练和评估神经网络的程序。\n\n`Torch` 吸引了学术界以及 IBM 和 Facebook 等公司的极大兴趣。但它的应用受到其依赖 `Lua`\
  \ 作为接口的限制。讨论中的其他框架——Theano、`Caffe`、`Keras` 和 `TensorFlow` 都可以通过 `Python` 接口，而 Python\
  \ 已成为机器学习领域的常用语言。\n\n### Theano\n\n2010 年，蒙特利尔大学的一个机器学习小组发布了 `Theano`，这是一个数值计算库。像\
  \ `NumPy` 一样，`Theano` 提供了系列操作多维数组的 `Python` 程序。与 `NumPy` 不同，`Theano` 将操作存储在名为 `graph`\
  \ 的数据结构中并将其编译为高性能代码。`Theano` 还支持 `符号微分`，这使得自动计算导数成为可能。\n\n由于其高性能和符号微分，许多机器学习开发者采用\
  \ `Theano` 作为他们首选的数值计算工具集。开发者特别欣赏 `Theano` 在图形处理器 (GPU) 和中央处理器 (CPU) 上执行图的能力。\n\n\
  ### Caffe\n\n贾扬庆（Yangqing Jia）在加州伯克利分校读博士期间创建了 `Caffe`，这是一个开发图像识别应用程序的框架。随着其他人的加入，`Caffe`\
  \ 扩展到支持其他机器学习算法和许多类型的神经网络。\n\n`Caffe` 用 `C++` ，像 `Theano` 一样，它支持 GPU 加速。这种对性能的强调使\
  \ `Caffe` 受深受学术和企业开发者喜爱。Facebook 对 `Caffe` 特别感兴趣，并在 2007 年发布了一个重构版本称为 `Caffe2`。这个版本改进了\
  \ `Caffe` 的性能并使在智能手机上执行应用程序成为可能。\n\n### Keras\n\n当其他产品关注性能和能力范围时，`Keras` 关注模块化和开发的简单性。François\
  \ Chollet 创建了 `Keras` 作为其他机器学习框架的接口，许多开发者通过 `Keras` 访问 `Theano`，以结合 `Keras` 的简单性与\
  \ `Theano` 的性能。\n\n\n\n\nKeras 的简单性源于其精简的 API 和直观的函数集。这些函数专注于完成机器学习中的标准任务，使得 Keras\
  \ 成为该领域新手的理想选择，但对于那些想要自定义操作的人来说，价值有限。\n\nFrançois Chollet 以 MIT 许可证发布了 Keras，Google\
  \ 已将他的接口整合到 TensorFlow 中。由于这个原因，许多 TensorFlow 开发者倾向于使用 Keras 来编写神经网络。\n\n## TensorFlow\n\
  \n正如标题所示，本书的核心是 TensorFlow，这是 Google 献给机器学习世界的礼物。Google Brain 团队于 2015 年发布了 TensorFlow\
  \ 1.0，截至本书编写时，当前版本为 1.4。它根据 Apache 2.0 开源许可证提供，这意味着你可以自由使用、修改和分发你的修改版本。\n\nTensorFlow\
  \ 的主要接口是 Python，但像 Caffe 一样，它的核心功能是用 C++ 编写以提高性能。像 Theano 一样，TensorFlow 将操作存储在图中，图可以部署到\
  \ GPU、远程系统或远程系统网络。此外，TensorFlow 提供了一个名为 `TensorBoard` 的工具，它使得图及其操作的可视化成为可能。\n\n\
  与其他框架一样，TensorFlow 支持在 CPU 和 GPU 上执行。此外，TensorFlow 应用程序可以在 Google Cloud Platform\
  \ (GCP) 上运行。GCP 以相对较低的成本提供了世界级的处理能力，在我看来，GCP 处理是 TensorFlow 最重要的优势。第 13 章 详细讨论了这个重要话题。\n\
  \n\n## 本章内容\n\n- ![check](img/check.png)**获取并安装 TensorFlow**\n- ![check](img/check.png)**探索\
  \ TensorFlow 软件包**\n- ![check](img/check.png)**运行一个简单的应用程序**\n- ![check](img/check.png)**理解风格规范**\n\
  \n本书的许多章节都介绍了复杂的术主题和冗长的数学公式。但本章并非如此。这一章非常简单，其目标是引导你完成安装 TensorFlow 并运行你的第一个 TensorFlow\
  \ 应用程序的过程。\n\n完整的 TensorFlow 安装包含大量的文件和目录。本章将探索其工作过程，并解释了许多文件和文件夹的作用。讨论涉及了 TensorFlow\
  \ 的许多包以及它们贡献的模块。\n\n一旦安装了 TensorFlow 工具集，就可以开始编写代码和运行应用程序了。本章最后提供了一个基础应用程序，对 TensorFlow\
  \ 开发送上热烈的欢迎。\n\n## 安装 TensorFlow\n\nGoogle 提供了两种安装 TensorFlow 的方法，更简单的选项涉及安装预编译包。本讨论介绍了安装这些包的三步流程：\n\
  \n1. **在你的开发系统上安装 Python。**\n2. **安装 pip 包管理器。**\n3. **使用 pip 安装 TensorFlow。**\n\
  \n第二种安装方法涉及从源代码编译 TensorFlow。此选项需要花费时间和精精力，但你可以获得更好的性能，因为你的 TensorFlow 包将充分利用你处理器的能力。第\
  \ 12 章 解释了如何获取和编译 TensorFlow 源码。\n\n### Python 和 pip/pip3\n\nTensorFlow 支持使用 Java\
  \ 和 C++ 开发，但本书侧重于 Python。我在示例代码中使用了 Python 3，但也欢迎你使用 Python 2。正如我在接下来的章节“设置风格”中所解释的，TensorFlow\
  \ 应用程序应该兼容这两个版本。\n\nPython 的官方包管理器是 `pip`，它是一个递归缩写，意为“pip installs Python”。要安装 TensorFlow\
  \ 等包，你可以在 Python 2 系统使用 `pip` 或在 Python 3 系统使用 `pip3`。包管理命令的格式如下：\n\n`pip <command-name>\
  \ <command-options>`\n\n`pip` 和 `pip3` 接受类似的命令并执行相似的操作。例如，执行 `pip list` 或 `pip3\
  \ list` 会打印出系统上安装的所有 Python 包。表 2-1 列出了该命令以及其他五个命令。\n\n表 2-1 包管理命令\n\n| 命令名称 | 描述\
  \ |\n| --- | --- |\n| `install` | 安装指定的包 |\n| `uninstall` |卸载指定的包 |\n| `download`\
  \ | 下载包但不安装 |\n| `list` | 列出已安装的包 |\n| `show` | 打印指定包的信息 |\n| `search` | 搜索名称或摘要包含给定文本的包\
  \ |\n\n对于本讨论来说，最重要的命令是 `pip install` 和 `pip3 install`。但请记住 `pip/pip3` 还可以执行许多其他操作。\n\
  \n![tip](img/tip.png)如果你使用预编译包执行 TensorFlow 应用程序，可能会收到类似这样的消息：“TensorFlow 库未针对使用\
  \ `XYZ` 指令进行编译，但这些指令在你的机器上可用并可以加速 CPU 计算。”要关闭这些消息，请创建一个名为 `TF_CPP_MIN_LOG_LEVEL`\
  \ 的环境变量并将其值设置为 3。\n\n### 在 Mac OS 上安装\n\n许多版本的 Mac OS 已经安装了 Python，但我建议获取并安装新的 Python\
  \ 包。如果你访问 [`python.org/downloads`](http://www.python.org/downloads)，你会看到 Python\
  \ 2 和 Python 3 的按钮。点击其中一个按钮，你的浏览器将下载一个作为 Python 安装程序的 PKG 文件。\n\n当你启动安装程序时，Python\
  \ 安装对话框会弹出。要安装包，请遵循以下步骤：\n\n1. 在介绍页面点击“继续”。\n2. 在 Read Me 页面点击“继续”。\n3. 在许可页面点击“继续”，然后点击“同意”接受软件许可协议。\n\
  4. 在安装类型页面点击“安装”开始安装，必要时输入密码。\n5. 安装完成后，点击“关闭”关闭对话框。\n\n如果安装成功，你可以在命令行运行 `pip` 或\
  \ `pip3`。你可以使用以下命令安装 TensorFlow：\n\n`pip install tensorflow`\n\n该命令告诉包管理器下载 TensorFlow、TensorBoard\
  \ 以及一系列依赖项。其中一个依赖项是 `six`，它支持 Python 2 和 3 之间的兼容性。如果预安装的 `six` 包导致安装失败，可以通过执行以下命令解决问题：\n\
  \n`pip install --ignore-installed six`\n\n此命令告诉 pip 在现有安装之上安装 `six`。在我的系统中，安装程序将\
  \ TensorFlow 文件存储在 `/Library/Frameworks/Python.framework/Versions/<ver>/lib/python<ver>/site-packages/tensorflow`\
  \ 目录下。\n\n### 在 Linux 上安装\n\n许多流行的 Linux 发行版基于 Debian，包括 Ubuntu 和 Linux Mint。这些发行版依赖高级软件包工具\
  \ (APT) 来管理包，你可以通过命令行输入 `apt-get` 来访问它。\n\n大多数 Linux 发行版已经安装了 Python，但建议安装完整的开发版本以及\
  \ pip/pip3。以下命令为 Python 2 安装这两者：\n\n`sudo apt-get install python-pip python-dev`\n\
  \n或者，以下命令为 Python 3 执行安装：\n\n`sudo apt-get install python3-pip python3-dev`\n\n\n\
  \n\n安装完成后，你应该能够在命令行中执行 `pip` 或 `pip3`。以下命令用于安装 TensorFlow 包及其依赖项（Python 3 请使用 `pip3`）：\n\
  \n```\nsudo pip install tensorflow\n```\n\n此命令安装了 `TensorFlow`、`TensorBoard` 及其依赖项。在我的\
  \ Ubuntu 系统上，安装程序将文件存储在 `/usr/local/lib/python<ver>/dist-packages/tensorflow` 目录下。\n\
  \n### 在 Windows 上安装\n\n对于 Windows 用户，TensorFlow 文档特别建议安装 64 位的 Python 3.5 版本。要下载安装程序，请访问\
  \ [`www.python.org/downloads/windows`](http://www.python.org/downloads/windows)，找到\
  \ Python 3 版本，并点击标题为 \"Windows x86-64 executable installer\" 的链接。这将下载一个作为安装程序的 `*.exe`\
  \ 文件。\n\n当你启动安装程序时，会弹出 Python 设置对话框。按照以下步骤在你的系统上安装 Python：\n\n1.  **勾选将 Python 安装目录添加到\
  \ `PATH` 变量的复选框。**\n2.  **点击标记为 Install Now 的链接。**\n3.  **安装完成后，点击 Close 按钮关闭安装程序。**\n\
  \n安装 Python 之后，你应该能够在命令行中运行 `pip3`。你可以使用以下命令安装 TensorFlow：\n\n```\npip3 install\
  \ tensorflow\n```\n\n包管理器会下载 `TensorFlow`、`TensorBoard` 以及这些包的依赖项。在我的 Windows 系统上，安装程序将文件存储在\
  \ `C:\\Users\\<name>\\AppData\\Local\\Programs\\Python\\Python<ver>\\Lib\\site-packages\\\
  tensorflow` 目录。\n\n## 探索 TensorFlow 安装\n\n一旦安装了 TensorFlow，你将拥有名为 `tensorflow` 的目录，其中包含各种文件和文件夹。有两个顶级文件夹尤为重要。`core`\
  \ 目录包含了 TensorFlow 的主要包和模块。`contrib` 目录包含了可能以后合并到 TensorFlow TensorFlow 的辅助包。\n\n\
  当你编写 TensorFlow 应用时，熟悉不同的包及其提供的模块是非常重要的。表 2-2 列出了至关重要的 `tensorflow` 包和其他九个包。\n\n\
