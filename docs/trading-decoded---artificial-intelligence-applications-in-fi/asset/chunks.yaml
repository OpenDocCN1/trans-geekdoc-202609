- raw: "At this point we have probably moved too far into the high bias setup. We\
    \ do some more parameter searches on max\\_depth and n\\_est and see the validation\
    \ accuracy increase to 48.9 at the cost of allowing some variance to come in.\
    \ As shown in Figure 6.5\n\n![](images/00056.jpeg)\n\nFigure 6. 5\n\n## Summary\n\
    \n*   Biased machines are opinionated and cannot even learn the trading set.\n\
    \n*   A high variance machine learns the data set really well but finds it hard\
    \ to generalize on unseen data.\n\n# CHAPTER SEVEN -   \n\nAPPLICATION: CARRY\
    \ TRADING\n\nLet us look at some practical applications of the tools and techniques\
    \ we have learnt so far. In this chapter, we will address several important considerations\
    \ on how to use Artificial Intelligence (AI) to trade. We will discuss pre-processing\
    \ of data, feature engineering, hyper parameter optimization, risk management,\
    \ and, most importantly, analysis of results to identify what the machine is doing\
    \ well and what it is not.\n\nBy the end of this chapter you will be able to:\n\
    \n1)      Understand the concept of carry trading and how it applies to commodities,\
    \ equities, currencies and rates. \n\n2)      Understand all the building blocks\
    \ that go into using AI to convert an economic concept into a trading algorithm.\n\
    \n3)      Understand and appreciate several details addressed in earlier chapters.\
    \ \n\nThere are several financial concepts that this approach could be applied\
    \ to, which were discussed in Chapter 1. We chose to uncover “Carry Trading” here.\
    \ Carry essentially refers to the yield that assets provide if you own them, after\
    \ deducting the cost of funding their purchase. This net yield can be positive\
    \ or negative, which means one could receive a net positive increment simply by\
    \ owning the asset or may have to pay a net amount for owning the asset.\n\n##\
    \ Carry in Foreign Exchange \n\nLet us make this more concrete with a simple example\
    \ from the foreign exchange markets. AUD versus USD. At the time of writing this\
    \ chapter, AUD benchmark interest rate is at 1% and USD benchmark rate is at 2%.\
    \ The AUD/USD spot exchange rate is 0.6771 USD per AUD.\n\nThe US central bank\
    \ seems to be more hawkish on the US economy, while the Australian central bank\
    \ holds a more dovish view on the Australian economy. Therefore, if we borrow\
    \ AUD for a maturity of say a month and use the proceeds to buy USD, we need to\
    \ pay 1% in AUD rates, as that is the currency, we have borrowed in. In return,\
    \ we receive 2% on the USD holdings, as that is our asset. The yield on our asset\
    \ (2%) is more than the cost of funding the purchase in AUD (1%). Therefore, the\
    \ carry on this trade is positive.\n\nApparently, the market already prices this\
    \ in. So, at that very instant, the 1-month forward rate for AUD/USD is .6777,\
    \ which implies that the AUD spot rate 1 month from now is expected to be .6777.\
    \ Therefore, the AUD is expected to strengthen from .6771 to .6777, which exactly\
    \ offsets the net carry yield that we were expecting by buying USD and selling\
    \ AUD. That is the way the market prices instrument as per efficient market hypothesis.\n\
    \nEffectively, if we borrow AUD and convert it to USD at a rate of .6771, we will\
    \ earn 2% on the USD asset and pay 1% on our AUD liability. At the same time,\
    \ we enter a commitment to repay our borrowing of AUD in one month’s time. We\
    \ intend to do this by selling our asset (USD) and using the proceeds to buy AUD,\
    \ which effectively means we buy AUD and sell USD for 1-month maturity. The forward\
    \ price will be such that the net gain in yield of 1% in holding USD over AUD\
    \ for 1 month gets exactly offset. The forward price therefore will be .6771\\\
    *(1+.01/12) = .6777.\n\nThe hypothesis we want to test here is that the forward\
    \ price does not accurately represent the gain or loss that may be incurred in\
    \ holding AUD/USD for a month. We would like to see if there is a benefit of holding\
    \ instruments that are net carry positive against a set of instruments that are\
    \ net carry negative. If we can make money by consistently holding assets that\
    \ are net carry positive against a set of instruments that are net carry negative,\
    \ then we can conclude that the forwards do not accurately price future outcomes.\
    \ We obviously intend to use machine learning and some of the techniques we discussed\
    \ earlier to prove/disprove this hypothesis. Before that, let us understand the\
    \ concept of carry as applied to other asset classes. In foreign exchange markets,\
    \ as discussed earlier, carry is simply the difference between the foreign interest\
    \ rate and the domestic interest rate.\n\nAssets that pay to be owned are positive\
    \ carry. Assets that you need to pay to own, are negative carry. We want to see\
    \ if owning positive carry instruments outperforms negative carry instruments.\n\
    \nOne last insight that we would like to share is that interest rates are the\
    \ “price” of money. If the price of a good is high, it means it is in demand and\
    \ vice versa. We want to test if we systematically own assets, which are in demand,\
    \ do we make money.\n\nLet us see how carry is calculated in other assets.\n\n\
    ## Carry in Commodities\n\nMost liquid commodities have at least two futures,\
    \ which reflect the supply and demand conditions for those 2 months.\n\nThe futures\
    \ (F) contract can be priced as in Equation1\n\nF = S0\\*(1 + (rfunding – rcommodity)\
    \ \\*T/365)                                  Equation 1\n\nHere T is the number\
    \ of days to maturity, F is the futures price (first or second liquid contract),\
    \ S0 is the spot price (spot or first futures contract, respectively), rfunding\
    \ is the interest rate of the currency the commodity is denominated in, and rcommodity\
    \ is the implied interest rate of the commodity (more commonly known as convenience\
    \ yield). If rcommodity\\>rfunding, F<S and the commodity is in backwardation.\
    \ If rcommodity<rfunding, F\\>S and the commodity is in contango. If rcommodity\
    \ is high, then it implies demand for that commodity is high and one should expect\
    \ it to outperform.\n\n## Carry in Equity Indices\n\nMost liquid indices are traded\
    \ through futures contracts. Futures are priced similarly\n\nF = S0\\*(1 + (rfunding\
    \ – rindex) \\*T/365)                                         Equation 2\n\nHere\
    \ T is the number of days to maturity, F is the futures price (first or second\
