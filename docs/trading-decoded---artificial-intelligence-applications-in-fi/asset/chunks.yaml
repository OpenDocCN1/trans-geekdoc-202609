    \ definitions. In a scenario like this, how do we extract content to take one\
    \ of the three decisions? This is where AI models come in to help us.\n\nThat\
    \ is a fair bit on what can be used to define momentum trading strategies. Let\
    \ us now endeavor to understand Carry Trading and see how AI can be used to enhance\
    \ performance.\n\n## Carry Trading\n\nCarry trading is a strategy that involves\
    \ borrowing at a low-interest rate and investing in an asset that provides a higher\
    \ rate of return. The hypothesis we are trying to establish with carry trading\
    \ is whether assets with a positive carry appreciate over time. We do that in\
    \ the succeeding text using a single instrument and not AI. Ideally, we would\
    \ like to test this hypothesis over several instruments and several regimes. We\
    \ then briefly talk about how AI could be used to improve performance of this\
    \ portfolio. The aim of this exercise is twofold:\n\n*   To understand what “carry”\
    \ is.\n\n*   To protect against the hammer and nail syndrome, where we use AI\
    \ to improve, fine tune, and quantify.\n\n### What is carry?\n\nWhen we talk about\
    \ carry, we essentially mean we are paid for owning an asset. There are various\
    \ ways by which one can earn carry in financial markets. Portfolios constructed\
    \ with the aim of benefitting from carry could include stocks that pay a high\
