    -   数据具有结构，并且存在需要学习的内容。有一句古老的英语谚语：“如果你手里只有一把锤子，那么看什么都像钉子”。AI 是一个非常强大的工具，但当被误用时，它完全有能力从纯随机的噪声中生成交易信号。我们在此过程中讨论各种潜在的陷阱。首先，我们倾向于关注数据集和交易策略，因为它们存在经济逻辑。我们可以使用
    AI 来量化它们，或改进现有策略。


    对于信号更强、噪声含量更低的较小数据集，可能使用传统的统计工具最好。使用传统统计工具的巨大优势在于模型是可解释的，这在交易中具有巨大的价值。


    ## 动量交易：高买高卖


    动量存在的经济逻辑是什么？我们认为它深根于价格发现过程。基本面和新闻驱动价格波动，但我们无法确定所有基本面和新闻因素被正确且充分定价的价格水平。这结合了信息不对称以及不同类型投资者对市场的理解，使其成为过去几十年和多个资产类别中表现最好的因子之一。


    动量是价格的一阶导数。作为一种交易策略，它在今天仍然最流行。模糊之处在于如何定义动量、识别其最盛行的时期，以及识别最可能受益的资产。作为一个洞察，图 1.1
    显示了钯期货在 2019 年的爆炸式增长（在几个月内上涨了 60%）。图 1.2 绘制了定义为价格一日变化的动量。图 1.2 比图 1.1 中看似线性的/指数价格波动杂嘈得多。在这个充满噪声的图
    1.2 数据集中寻找信号是一项挑战。


    ![地图的特写 自动生成的描述](img/00002.jpeg)


    图 1.1 是随时间变化的钯期货价格。


    图 1.2 动量，定义为价格的环比变化。


    问题是：我们想要包含什么来定义动量？


    我们应该如何定义像动量这样抽象的东西？


    ### 价格动量


    价格动量可以用多种方式定义。谁能说价格的环比变化是定义动量的最佳方式呢？周环、月环、同比或者任何非标准周期又如何？或者，使用上述所有方法并尝试在这个极其嘈的数据集中寻找信号如何？本质上，我们暗示，既然没有已知的定义动量的最佳方法，我们将接受所有可能的定义为合法的，并使用
    AI 来学习一个某种优的定义。


    ### 相关工具的动量


    钯是一个相对较小的市场，其价格波动也受黄金情况、一般风险资产（例如 `S &P` 期货）总体情况，或广义美元指数情况的影响。


    如果你在交易台度过一些时间（交易宏观工具），你可能只需要知道你所选择的一个或两个工具在隔夜的表现如何，这就能给你其他工具表现的参考。


    因此，为了尝试定义钯的动量，我们可能还会考虑包含相关工具的动量，即黄金的动量、广义美元指数的动量，以及风险工具（如股票指数）的动量。所以，如果我们最初有 100
    种定义动量的方法，现在又有 300 种（3 个工具 × 每个工具 100 种定义）。


    ### 状态变量


    需要注意的是，与其他工具的这种可能会随时间改变。


    在某些情况下，风险偏升可能与美元走软相关联，这可能支持钯等资产。然而，同样的由追求高收益率/股息工具驱动的风险偏升环境可能对黄金等不提供收益/股息的资产产生不利。此外，钯作为黄金的密切盟友，其实际实际上可能会受损。


    因此，我们可能想要添加关于情绪的信息或关于市场所处状态的信息，这进一步增加了我们的数据集。


    ### 市场微观结构


    我们可能还会将关于市场微观结构的信息加入我们的动量定义中。例如，图 1.3 提供了一级订单簿的的快照。让我们逐一分析。


    | 序号 || 买入量 || 买入价 || 卖出量 || 卖出价 || 成交量 || 成交价 |

    | --- | --- | --- | --- | --- | --- | --- |

    | 1 || 16 || 6989 || 7 || 6990 || 0 || 6989 |

    | 2 || 16 || 6989 || 7 || 6990 || 5 || 6990 |

    | 3 || 16 || 6989 || 2 || 6990 || 0 || 6990 |

    | 4 || 16 || 6989 || 2 || 6990 || 2 || 6990 |


    图 1. 3 限价订单簿快照。


    序号 1：

    在一个流动性较好的工具中，买入价有 16 手，卖出价有 7 手。由于由于买入量 16 大于卖出量 7，买入压力可能大于卖出压力。但到目前为止证据很弱。


    序号 2：

    5 手以 6990 的价格成交。


    序号 3：

    我们现在买入端有 16 手，卖出端仅剩 2 手。在这个阶段，“动量”倾向于买方，原因有两个：(1) 16 大于 2 ；(2) 卖单很大一部分（5）被消耗掉了。


    序号 4：

    如预期的那样，2 手以 6990 成交，完全基于订单簿的动量。


    现在我们将这些关于订单簿的信息加入到我们的动量定义中。


    因此，总结一下，对我们来说动量是一个抽象的噪声信号，我们通过四个大类来定义它：


    - 我们试图预测的工具的动量

    - 相关工具的动量

    - 状态 (Regime)

    - 市场微观结构中的动量


    现在的问题是如何结合所有这些信息做出买入、持有或卖出的决策。数据集爆炸了——我们有大约 500 种不同但相关的定义。在这种情况下，我们如何提取内容来做出三个决策之一？这就是
    AI 模型上场帮助我们的地方。


    关于可以用什么定义动量交易策略的内容有很多。让我们现在尝试理解套利交易，并看看如何使用 AI 来增强性能。


    ## 套利交易


    套利交易是一种涉及低利率贷款资金并投资于提供更高回报资产的策略。我们试图通过套利交易建立的假设是，具有正套利的资产是否随时间增值。我们将在随后的文中使用单一工具进行测试，而不使用
    AI。理想情况下，我们希望在多个工具和多个状态下测试这一假设。然后我们简要讨论如何使用 AI 来提高该组合的性能。这次练习的目的有二：


    - 理解什么是“套利”。

    - 防止“锤子钉子症”，即盲目使用 AI 来改进、微调和量化。


