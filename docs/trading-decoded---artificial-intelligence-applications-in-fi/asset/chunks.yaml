    \ are all set to zero. This is a rather simple representation. As a downside,\
    \ it is a very sparse representation with a whole lot of redundant zeros.\n\n\
    ![A picture containing knife, table Description automatically generated](images/00014.jpeg)\n\
    \n### Label Encoding\n\nContinuing with data in Figure 2.4 we could simply replace\
    \ the Month feature by a label as shown in the following table.\n\n| Serial No\
    \ || Av. Return over prev 10 days || Month || Label |\n\n| --- | --- | --- | ---\
    \ |\n\n| 1 || \\-2% || DEC || 12 |\n\n| 2 || \\-2.50% || NOV || 11 |\n\n| 3 ||\
