    如图 9.3 所示，sigmoid 激活函数始终为正，且处于 0 到 1 之间。假设 `Z` 是一个非常小的数字，即 `Z` 趋于负无穷，`e\-Z` 趋于无穷大，`A(Z)`
    将趋于 0。同样，当 `Z` 非常大，即 `Z` 趋于无穷大，`e\-Z` 趋于 0，`A(Z)` 将趋于 1。它被用于分类任务——特别是带有交叉熵损失的二分类最终输出。


    ## Tanh


    `A(Z) = (ez – e\-Z)/(eZ + e\-Z)`


    ![](img/00090.gif)


    图 9.4 Tanh 激活函数。


    ### 特性


    1. 于 -1 和 1 之间（图 9.4）


    如果我们使用交叉熵作为损失函数，不建议在输出层使用 `tanh` 作为激活函数。


    ## Relu (整流线性单元)


    `A(Z) = max(0,Z)`


    ![](img/00091.jpeg)


    图 9.5 Relu 激活函数。


    ### 特性


    1. 始终为正（图 9.5）

    2. 目前最流行的激活函数之一

    3. 它不能很好地映射负值，因为所有负值都会被映射为零。


    ## Leaky-Relu


    `A(Z) = max(aZ,Z)`


    ![](img/00092.jpeg)


    图 9.6 Leaky Relu 激活函数。


    ### 特性


    1. 试图减少 `Relu` 中负值映射的问题。（图 9.6）。

    2. 需要决定超参数 `a` 的值。它通常是一个小值，如 `0.01`、`0.001` 等。


    ## 线性激活


    `A(Z) = Z`


    ![](img/00093.jpeg)


    图 9.7 线性激活函数。


    不能单独使用，因为无论你的网络有多深，你本质上都在反复计算同一个函数（图 9.7）。


    ## Softmax 激活


    对于具有 `C` (>=2) 个可能类别值的多分类问题，`softmax` 输出定义为


    ![](img/00094.jpeg)


    这确保了每个样本的所有 `C` 个预测值之和为 1。


    ## 层


    一组连接到另一组神经元的神经元，但神经元之间并不一定相互连接。构成神经网络架构框架的层类型如下：


    ### 输入层


    如名所示，这是包含来自数据集输入特征的层。这是神经网络的第 0 层。它连接到一个或多个隐藏层。


    ### 隐藏层


    这些是神经网络的“力马”。它们接收来自输入层或其他隐藏层的输入，并将其输出提供给其他隐藏层或网络的输出层。


    ### 输出层


    这是网络的最后一层，提供处理的输出。根据我们处理的是分类问题还是回归问题，输出可以是概率、类别、实数等。


    如果隐藏层和输出层的总数等于“L”，则该神经网络被称为“L 层网络”。因此，一个具有一个输入层、一个输出层和一个隐藏层的神经网络（NN）被称为二层网络（输入层是第
    0 层）。此类网络的示例如图 9.8 所示。“深度学习”一词本质上意味着网络中存在大量的隐藏层。在图 9.8 中，我们只展示了前向传播的方向。反向传播在相反方向进行（此处未显示）。


    ![](img/00095.jpeg)


    图 9.8 前向传播与反向传播示意（注：此处原文表述略显重复，意指展示方向）。


    图中我们仅展示了前向传播的方向。反向传播在相反方向进行（此处未显示）。


    （此处翻译翻译...）


    需要决定超参数 `a` 的值。它通常是一个小值，如 `0.01`、`0.001` 等。


    （注：此处原文存在部分描述重复，已按逻辑整合翻译）


    ## Softmax 激活


    在具有 `C` (>=2) 个可能类别值的多分类问题中，`softmax` 输出定义为


    这确保了每个样本的所有 `C` 个预测值之和为 1。


    ## 全连接网络


    在神经网络中，每一层的所有神经元都连接到下一层的所有神经元，这被称为全连接网络。全连接网络在深度学习中非常常见，尽管它们计算开销较大。


    ## 轮次 (Epoch)


    一个 epoch 指整个训练数据集通过神经网络前向传播一次。


    ## 参数与超参数


    如前文所述，多个变量会影响神经网络的结果。其中某些变量称为参数，它们是在前向传播和反向传播过程中学习到的。权重和偏置属于这一类。另一方面，还有一些由用户提供的，例如学习率。这些变量被称为超参数。它们是用户选择的，但会影响网络的结果。我们目前为止的其它超参数包括层数、每层的神经元数量等。为了获得网络最佳性能，调整这些超参数至关重要。有几种方法可以选择最佳超参数。


    ### 网格搜索


    为所有超参数指定值范围。


    1. 为所有可能的超参数值组合训练神经网络。

    2. 从所有可能的组合中选择构建性能最好的神经网络值。

    3. 这种方法最大的问题是超参数组合数量呈指数级增长。


    （省略）


