    - There is a structure to the data and there is information content to be learned.
    There is an old English adage, “if all you have is a hammer then everything looks
    like a nail”. AI is a very powerful tool, but when misused, it is fully capable
    of generating trading signals from purely random noise. We will discuss various
    potential pitfalls along the way. For one, we like to focus on data sets and trading
    strategies, which have an economic rationale to exist. We can use AI to quantify
    it or to improve an existing strategy.


    Smaller data sets that have a much stronger signal and a lower noise content would
    probably be best tackled using traditional statistical tools. The huge benefit
    of using traditional statistical tools is that the models are interpretable, which
    is of immense value in trading.


    ## Momentum Trading: Buy High, Sell Higher


    What is the economic rationale for momentum to exist? We believe it is deeply
    rooted in the process of price discovery. Fundamentals and news drive price action
    but we do not know with certainty the price level at which all fundamentals and
    news actions have been correctly and fully priced in. This, coupled with asymmetric
    information and understanding of markets among various investor types, has made
    it one of the best performing factors over several decades and in several asset
    classes.


    Momentum is the first derivative of price. As a trading strategy, it is most prevalent,
    even today. The ambiguity lies in defining momentum, identifying the period where
    it is most prevalent, and identifying assets that will most likely benefit from
    it. As an insight, Figure 1.1 shows the astronomical rise of palladium futures
    in 2019 (60% in a matter of a few months). Figure 1.2 plots momentum defined as
    the one-day change in price. Figure 1.2 is much noisier than the seemingly linear/exponential
    price action in Figure 1.1. It is a challenge to fish for a signal in this noisy
    Figure 1.2 data set.


    ![A close up of a map Description automatically generated](images/00002.jpeg)


    Figure 1. 1 is the futures price of palladium plotted against time.


    Figure 1. 2 Momentum, which is defined as the day-on-day change in price.


    The question is: what would we want to include to define momentum?


    How should we define something as abstract as momentum?


    ### Price momentum


    Price momentum can be defined in multiple ways. Who is to say that day-on-day
    change in price is the best way to define momentum? How about a week-on-week,
    a month-on-month, a year-on-year or for that matter any nonstandard period? Alternatively,
    how about using all the aforementioned and trying to fish for a signal in this
    extremely noisy data set? Essentially, we are implying that, since there is no
    known optimal way of defining momentum, we will accept all possible definitions
    to be legitimate, and use AI to learn a somewhat optimal definition.


    ### Momentum in related instruments


    Palladium is a relatively small market and its price action is also affected by
    what is happening in gold, or what is happening to risky assets (`S &P` futures,
    for instance) in general or what is happening to the broad dollar index.


    If you have spent some time at the trading desk (trading macro instruments), you
    probably only need to know what your one or two instruments of choice have done
    overnight and that will give you an indication of other instruments’ performance.


    Therefore, to try and define momentum for palladium, we may also consider including
    momentum of related instruments, that is, momentum of gold, momentum of the broad
    dollar index, and, momentum of risky instruments (such as equity indices). So,
    if we originally had 100 ways of defining momentum, we now have another 300 (3
    instruments × 100 definitions per instrument).


    ### Regime variables


    The point to note is that this relation to other instruments may change with time.


    On some occasions, a risk-on move may be associated with dollar weakness, which
    may be supportive of things such as palladium. However, the same risk-on environment
    being driven by a search for high yield/dividend bearing instruments may be bad
    for assets such as gold, which do not provide any yield/dividends. In addition,
    palladium, being a close ally of gold, may actually suffer in performance.


    Therefore, we may want to add information about sentiment or information about
    the regime that the market is currently in and this further adds to our data set.


    ### Market microstructure


    We may also consider adding information about the market microstructure to our
    definition of momentum. For example, Figure 1.3 gives a snapshot of what the level
    one order book looks like. Let us go through it step by step.


    | S. No. || Bid Qty || Bid Price || Ask Qty || Ask Price || TradedQty || TradedPrice
    |

    | --- | --- | --- | --- | --- | --- | --- |

    | 1 || 16 || 6989 || 7 || 6990 || 0 || 6989 |

    | 2 || 16 || 6989 || 7 || 6990 || 5 || 6990 |

    | 3 || 16 || 6989 || 2 || 6990 || 0 || 6990 |

    | 4 || 16 || 6989 || 2 || 6990 || 2 || 6990 |


    Figure 1. 3 A snapshot of what the limit order book looks like.


    S.No.1:

    16 lots at the bid price and 7 lots at the offer price in a relatively liquid
    instrument. Since the bid quantity of 16 is greater than the ask quantity of 7,
    it is possible that the buying pressure may be more than the selling pressure.
    However, the evidence is weak so far.


    S.No. 2:

    5 lots trade at a price of 6990.


    S.No. 3:

    We now have 16 lots at the bid and only 2 lots left at the offer. The “momentum”
    is leaning on the buy side at this stage for two reasons:(1) 16 is greater than
    2 and (2) a significant portion of the offer (5) was taken away.


    S.No. 4:

    2 lots traded at 6990 as expected, purely on momentum of the order book.


    Now we include this information about the order book in our definition of momentum.


    Therefore, to summarize, momentum for us is an abstract noisy signal, which we
    define under four broad headings:


    - Momentum of the instrument we are trying to predict

    - Momentum of related instruments

    - Regime

    - Momentum in the market microstructure


    The question now is how one should combine all this information to take a decision
    to buy, to hold, or to sell. The data set has exploded - we have something like
    500 different yet related definitions. In a scenario like this, how do we extract
    content to take one of the three decisions? This is where AI models come in to
    help us.


    That is a fair bit on what can be used to define momentum trading strategies.
    Let us now endeavor to understand Carry Trading and see how AI can be used to
    enhance performance.


    ## Carry Trading


    Carry trading is a strategy that involves borrowing at a low-interest rate and
    investing in an asset that provides a higher rate of return. The hypothesis we
    are trying to establish with carry trading is whether assets with a positive carry
    appreciate over time. We do that in the succeeding text using a single instrument
    and not AI. Ideally, we would like to test this hypothesis over several instruments
    and several regimes. We then briefly talk about how AI could be used to improve
    performance of this portfolio. The aim of this exercise is twofold:


    - To understand what “carry” is.

    - To protect against the hammer and nail syndrome, where we use AI to improve,
    fine tune, and quantify.


    ### What is carry?


    When we talk about carry, we essentially mean we are paid for owning an asset.
    There are various ways by which one can earn carry in financial markets. Portfolios
    constructed with the aim of benefitting from carry could include stocks that pay
    a high dividend, bonds that pay high coupons, short option positions - thereby
    receiving premium, and short positions in futures with a steep upward slope (contango),
    long position in futures with a steep downward slope (backwardation).

