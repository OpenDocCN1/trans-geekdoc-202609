  trans: "\n\n![](img/00009.jpeg)\n\n# 图 2. 1 典型的表格数据看起来是什么样的\n\n样本（samples）是为了发现模式或经验关系而记录的观测值。观测频率可以是任何频率——每月、每日甚至是每次波动（tick）。特征（features）或列是数据的属性，我们认为这些属性将帮助我们发现模式。这些特征可以是多种不同的数据类型。\n\
    \n*   **数值型 (Numeric)**：通常指价格收益率、基本面数据（如收益公告）、大宗商品库存数据等。通常在任何编程语言中，这些数据被设置为 `float`\
    \ 或 `integer` 数据类型。\n*   **分类型/有序分类型 (Categorical/Ordered categorical)**：这些是代表有限离散项目集合的数据类型。例如，“1\
    \ 月”代表一年的前 31 天；“第 1 周”代表一个月的前 7 天，“优于预期”代表所有收益超过预期的公司等。我们如何以有意义的方式将这些信息呈现给机器？我们将在下一节中讨论。\n\
    *   **时间类型 (Date time)**：当天的日期和时间可能包含有意义的信息。不仅在日历月份中，在月的某几周和星期也存在季节性模式。甚至当天的某个时段（session）可能具有某些预测能力。以下是我们在市场上看到的几个例子：\n\
    \    1.  铂金和钯期货在 1 月和 2 月持续表现优异（图 2.2）。\n    2.  每月数据密集的前两周，各种工具的价格波动性更高。\n  \
    \  3.  各种期货合约成交量的日内季节性模式（图 2.2）。\n\n![一张自动生成的视频游戏描述截图](img/00010.jpeg)\n\n图 2.\
    \ 2 彭博的一张截图，显示了 1 月和 2 月的预期正收益（“来源：Bloomberg Finance L.P。经 Bloomberg Finance L.P.\
    \ 许可使用”）\n\n![一张包含白色、近距离、猫、红色的图片自动生成](img/00011.jpeg)\n\n图 2. 3 e-mini 标普 500\
    \ 期货成交量的日内季节性，由第二个面板中的双峰红线表示（“来源：Bloomberg Finance L.P。经 Bloomberg Finance L.P.\
    \ 许可使用”）\n\n*   **图像 (Images)**：用于研究农产品预期收益率的卫星数据。我们没有研究或交易过这一概念，因此本书将不会涵盖该内容。\n\
    \n在深入研究这些内容之前，值得强调的是你将数据呈现给机器的方式有时取决于你打算部署哪种机器。从这个角度来看，我们遇到两种类型的机器。像决策树（见第 4 章）这样的模型依赖于将样本放入特征空间的各种矩形区域。这些模型是**尺度无关（scale\
    \ independent）**的，改变输入的尺度对解决方案不会产生意义的影响。根据我们的经验，这有时会对性能产生不利影响。\n\n此外，还有诸如逻辑回归和人工神经网络等模型，特征的尺度对解决方案有非常显著的影响。\n\
    \n让我们讨论一个例子来理解特征缩放（scaling）背后的直觉。假设我们只有两个特征：`x1` 和 `x2`。决策树解决方案通常解释如下：\n\n1. \
    \ 所有 `x1 < a` 且 `x2 > b` 的样本都属于同一个隔室，预测值为 .35。这里 `a` 和 `b` 是算法求解的参数。所有满足此条件的样本都在区域\
    \ 1。\n2.  所有其他样本的预测值为 .75。所有满足此条件的样本都在区域 2。\n\n将 `x1` 的尺度改变 3 倍，将 `x2` 的尺度改变 2\
    \ 倍，只会以相似的比例改变 `a` 和 `b` 的值。属于区域 1 和区域 2 的样本不会改变。在这种情况下，解决方案不会改变，因为我们感兴趣的是特定样本所属的区域。特别是，我们感兴趣的是被分组在一起的样本。\n\
    \n另一方面，回归（**尺度依赖模型**）的解决方案如下：\n\n```\nY = F (a*x1 + b*x2)\n```\n\n这里的 `a` 和 `b`\
    \ 值再次是模型的输出。如果 `x1` 和 `x2` 的尺度发生变化，`a` 和 `b` 的值改变，输出 `Y` 也随之改变。\n\n现在让我们开始讨论如何处理各种数据类型。\n\
    \n## 数值型 (Numeric)\n\n作为决策树等尺度无关模型的通用指南，数值特征可以直接以给定的格式使用。在尺度依赖模型中，最好对它们进行预处理。可以使用\
    \ Scikit Learn 的 `Min Max scaler` 或 `standard scaler`。`Min Max scaler` 确保所有特征值都在预定义的范围内。\n\
    \n在 Scikit Learn 中进行缩放的简单方法在加载数据后的下方框中所示。\n\n![一张包含刀、桌子的图片自动生成](img/00012.jpeg)\n\
    \n相反，`Standard Scaler` 确保所有缩放后特征值的平均值为 0，标准差为 1。它所做的是从特征中减去平均值，并将结果除以结果的标准差。这些缩放技术对优化技术产生巨大影响，例如用于某些尺度依赖模型（如人工神经网络）的\
    \ `gradient descent`。在 Scikit Learn 中实现此点的简单方法如下。\n\n![一张包含刀、桌子的图片](img/00013.jpeg)\n\
    \n## 分类数据 (Categorical data)\n\n这些特征本质上代表某些类别，例如月份或星期。这些是非常有用且强大的特征，当处理正确时，可以为机器增加大量价值。\n\
    \n如果我们对捕捉金融工具的季节性感兴趣，我们需要从将月份作为特征开始。某些日子比其他日子波动性更大。例如，周三发布石油库存数据，周四在每个月的第一个周五发布就业报告。这些日子已知比其他日子更具方向性/波动性。无需说明，星期因此可能为机器增加价值。大多数美国经济数据在每月的前两周发布，这将其作为是否在上半月还是下半月的特征是合理的。\n\
    \n如果分类数据的类别代表某种形式的顺序或排名，那么分类数据集被称为**有序数据集 (ordinal data sets)**。\n\n假设我们正在跟踪市场对降息的预期与美联储（FED）中值预测之间的偏差。我们可以将差异分类为高（High）、中（Inline）和低（Low）：\n\
    \n*   高——意味着市场比美联储更鹰派\n*   中——意味着市场与美联储观点一致\n*   低——意味着市场比美联储更鸽派\n\n在这里，高、中、低意味着它们所代表的数据具有某种排名或顺序。\n\
    \n问题仍然我们如何呈现这些数据？\n\n### 独热编码 (One Hot Encoding)\n\n假设我们的数据集如图 2.4 所示，我们将月份名称作为特征之一。\n\
    \n| 序列号 | 10 天期间平均收益 | 月份 | 下一个 10 天的平均收益 |\n| --- | --- | --- | --- |\n| 1 |\
    \ \\-2% | DEC | \\-3.00% |\n| 2 | \\-2.50% | NOV | \\-3.00% |\n| 3 | 3% | JAN\
    \ | \\-2.00% |\n| 4 | 1% | FEB | 0.75% |\n| 5 | 2% | JAN | 1.50% |\n| 6 | 1.70%\
    \ | MAR | 2.30% |\n| 7 | \\-8% | DEC | \\-2.00% |\n| 8 | 7% | JAN | \\-2.20% |\n\
    \n图 2. 4 包含分类数据的数据集示例。\n\n"
