    Stocks in each sector bucket are further split into four sub buckets based on
    fundamental and technical information of the stock.


    The four sub buckets applied to each sector and their respective definitions are:


    ### 1. Value

    Stocks are ranked according to the three criteria mentioned below. Each criterion
    is given equal weight and we look to buy stocks in the top 10 percentile. The
    portfolio is rebalanced monthly.


    1. `Operating cash flow per share trailing 12 months`

    2. `Dividends that are expected to be paid in the next 12 months`

    3. `Sales per share trailing 12 months divided by enterprise value per share`


    ### 2. Momentum

    Stocks are ranked according to the below score and we buy the top 10 percentile.
    The portfolio is rebalanced monthly.


    1. `(12 month return – 1 month return)/ 1 month standard deviation`


    ### 3. Growth

    Stocks are ranked according to the below 2 criteria. Each criterion is given equal
    weight and we look to buy stocks in the top 10 percentile. The portfolio is rebalanced
    monthly.


    1. `Percentage change in earnings per share trailing 12 months over trailing 12
    months`

    2. `Percentage change in sales trailing 12months over trailing 12 months`


    ### 4. Quality

    Stocks are ranked according to the criteria below. Each criterion is given equal
    weight and we look to buy stocks in the top 10 percentile. The portfolio is rebalanced
    monthly.


    1. `Gross Margin`

    2. `Standard deviation of earnings per share`, lower the better


    Effectively we have an index for each sector and each style. The Indices we have
    created and used in this example are as shown in Figure 12.5. These indices will
    serve the purpose of targets.


    ![](images/00173.jpeg)


    Figure 12. 5 The targets of our data set.


    Just so that we do not lose sight of the objective, we are going to build a machine
    that takes macro-economic variables as the input and predicts the performance
    for each style.


    ## Training, Validation and Test data sets

    Our complete data set is from 2005 to 2020.


    - Jan 2005 – Jul 2017 Training Data

    - Aug, 2017 – Feb 2019 Validation Data

    - Mar, 2019 – Mar 2020 Test Data


    Ideally, we should have used a more rigorous validation strategy like the ones
    we have discussed earlier in this book, but the idea here is not to design a robust
    trading system, but rather to understand how it can be done.


    1. The python code that helps us do the split and pre-process the data is in Figure
    12.6.

    2. For a particular value of the hyper parameter `param` (which is essentially
    the `k` nearest neighbours), we fit the `KNN` object as in Figure 12.7 and make
    the prediction for the validation data sets, which essentially means that, for
    a given set of macro-economic conditions, we are able to predict the returns for
    each strategy.

    3. We then proceed to rank the performance of each sample in our validation datasets
    (Figure 12.8 ), go long the best 10 strategies and short the worst 10 strategies
    and calculate the profit and loss of our portfolio.

    4. Steps 1), 2) and 3) are repeated for various values of `param` and we select
