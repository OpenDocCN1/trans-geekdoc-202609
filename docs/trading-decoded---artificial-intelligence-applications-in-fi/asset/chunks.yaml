    当池化操作应用于具有多个通道的输入时，它会独立地应用于每个通道。因此，输出的通道数与输入相同。


    卷积神经网络的典型配置如图 10.16 所示：


    ![](img/00148.jpeg)


    图 10. 16 全卷积配置


    在图 10.16 中，我们从一个维度为 `1×100` 的输入开始，假设这是过去 `100` 天的收益率。我们将其通过六个过滤器；每个过滤器的维度为 `1×5`。输出的维度为
    `1×(100−5+1) = 1×96`，由于有 `six` 个过滤器，我们将它们各自的输出堆叠起来，得到维度为 `1×96×6` 的输出。


    然后，我们将此输出通过一个参数 `f =2` 步长 `s =2` 的最大池化层。池化算不会改变通道数（通道数设置为 `6`）。最大池化将维度从 `1×96×6`
    缩小到 `1×[(96−2)/2+1]×6 = 1×48×6`。


    接着，我们将此 `1×48×6` 的输出通过 `10` 个过滤器——每个大小为 `1×10`——但这次我们使用了步长 `2`，导致输出维度为 `(1× (48−10)/2
    +1×10) = 1×20×10`。


    随后，我们将此二维表示扁坦化为一个一维向量，其长度简单地为 `1*20*10 = 200`。然后将其通过一个具有 `20` 个神经元的普通全连接多层感知机。连接平坦化向量与该全连接密集层的权重矩阵维度为
    `20*200 = 4000` 参数。


    最后，这 `20` 个神经元的输出被传递给 `softmax` 函数，它帮助我们预测市场上涨还是下跌。


    上述是一个包含许多超参数的通用配置，需要彻底的随机搜索。


    让我们来看一个具体的例子。


