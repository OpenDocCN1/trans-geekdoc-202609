    # CHAPTER SEVEN - APPLICATION: CARRY TRADING


    Let us look at some practical applications of the tools and techniques we have
    learnt so far. In this chapter, we will address several important considerations
    on how to use Artificial Intelligence（`AI`) to trade. We will discuss pre-processing
    of data, feature engineering, hyper parameter optimization, risk management, and,
    most importantly, analysis of results to identify what the machine is doing well
    and what it is not.


    By the end of this chapter you will be able to:


    1) Understand the concept of carry trading and how it applies to commodities,
    equities, currencies and rates.

    2) Understand all the building blocks that go into using AI to convert an economic
    concept into a trading algorithm.

    3) Understand and appreciate several details addressed in earlier chapters.


    There are several financial concepts that this approach could be applied to, which
    were discussed in Chapter 1. We chose to uncover “Carry Trading” here. Carry essentially
    refers to the yield that assets provide if you own them, after deducting the cost
    of funding their purchase. This net yield can be positive or negative, which means
    one could receive a net positive increment simply by owning the asset or may have
    to pay a net amount for owning the asset.


    ## Carry in Foreign Exchange


    Let us make this more concrete with a simple example from the foreign exchange
    markets. AUD versus USD. At the time of writing this chapter, AUD benchmark interest
    rate is at 1% and USD benchmark rate is at 2%. The `AUD/USD` spot exchange rate
    is 0.6771 USD per AUD.


    The US central bank seems to be more hawkish on the US economy, while the Australian
    central bank holds a more dovish view on the Australian economy. Therefore, if
    we borrow AUD for a maturity of say a month and use the proceeds to buy USD, we
    need to pay 1% in AUD rates, as that is the currency, we have borrowed in. In
    return, we receive 2% on the USD holdings, as that is our asset. The yield on
    our asset (2%) is more than the cost of funding the purchase in AUD (1%). Therefore,
    the carry on this trade is positive.


    Apparently, the market already prices this in. So, at that very instant, the 1-month
    forward rate for `AUD/USD` is .6777, which implies that the AUD spot rate 1 month
    from now is expected to be .6777. Therefore, the AUD is expected to strengthen
    from .6771 to .6777, which exactly offsets the net carry yield that we were expecting
    by buying USD and selling AUD. That is the way the market prices instrument as
    per efficient market hypothesis.


    Effectively, if we borrow AUD and convert it to USD at a rate of .6771, we will
    earn 2% on the USD asset and pay 1% on our AUD liability. At the same time, we
    enter a commitment to repay our borrowing of AUD in one month’s time. We intend
    to do this by selling our asset (USD) and using the proceeds to buy AUD, which
    effectively means we buy AUD and sell USD for 1-month maturity. The forward price
    will be such that the net gain in yield of 1% in holding USD over AUD for 1 month
    gets exactly offset. The forward price therefore will be `.6771*(1+.01/12) = .6777`.


    The hypothesis we want to test here is that the forward price does not accurately
    represent the gain or loss that may be incurred in holding `AUD/USD` for a month.
    We would like to see if there is a benefit of holding instruments that are net
    carry positive against a set of instruments that are net carry negative. If we
    can make money by consistently holding assets that are net carry positive against
    a set of instruments that are net carry negative, then we can conclude that the
    forwards do not accurately price future outcomes. We obviously intend to use machine
    learning and some of the techniques we discussed earlier to prove/disprove this
    hypothesis. Before that, let us understand the concept of carry as applied to
    other asset classes. In foreign exchange markets, as discussed earlier, carry
    is simply the difference between the foreign interest rate and the domestic interest
    rate.


    Assets that pay to be owned are positive carry. Assets that you need to pay to
    own, are negative carry. We want to see if owning positive carry instruments outperforms
    negative carry instruments.


    One last insight that we would like to share is that interest rates are the “price”
    of money. If the price of a good is high, it means it is in demand and vice versa.
    We want to test if we systematically own assets, which are in demand, do we make
    money.


    Let us see how carry is calculated in other assets.


    ## Carry in Commodities


    Most liquid commodities have at least two futures, which reflect the supply and
    demand conditions for those 2 months.


    The futures (`F`) contract can be priced as in Equation1:


    ```

    F = S0*(1 + (rfunding – rcommodity) *T/365)

    ```


    Here `T` is the number of days to maturity, `F` is the futures price (first or
    second liquid contract), `S0` is the spot price (spot or first futures contract,
    respectively), `rfunding` is the interest rate of the currency the commodity is
    denominated in, and `rcommodity` is the implied interest rate of the commodity
    (more commonly known as convenience yield). If `rcommodity>rfunding`, `F<S` and
    the commodity is in backwardation. If `rcommodity<rfunding`, `F>S` and the commodity
    is in contango. If `rcommodity` is high, then it implies demand for that commodity
    is high and one should expect it to outperform.


    ## Carry in Equity Indices


    Most liquid indices are traded through futures contracts. Futures are priced similarly:


    ```

    F = S0*(1 + (rfunding – rindex) *T/365)

    ```


    Here `T` is the number of days to maturity, `F` is the futures price (first or
    second liquid contract), `S0` is the spot price (cash index), `rfunding` is the
    interest rate of the currency the index is denominated in, and `rinde` is the
    dividend yield.


    Quite often, there is difference between the closing time of the cash index and
    the futures, so we need to be careful if we are using end of day data.


    More appropriately we can use the actual dividends paid out by the companies forming
    the index and weigh them by the weights used to construct the index. We can also
    imply the dividend yield from “put call parity” relationships in the option market
    for the index, assuming sufficient liquidity.


    ## Carry in Rates


    The difference between short-term rates and long-term rates (2-year maturity vs.
    10-year maturity) can be used as a measure of carry in the government bond markets.


    In this chapter, we limit our focus to commodity futures. Let us do some pre-processing
    first.


    ## Adjusting for the Roll


    Our aim here is to create a continuous contract and adjust for the discontinuities
    in price we see while rolling positions at expiry.


    ![](images/00057.jpeg)


    Figure 7. 1 OCT and NOV futures price action.


    As shown in Figure 7.1, the Oct future for a commodity is trading at $100, and
    the Nov future (the second active contract) is trading at $102. For a $1000 investment,
    we purchase 10 units of the Oct future. We keep it till the Oct contract matures
    and then we roll to the Nov contract. Let us assume the price of the Oct and Nov
    contract at the time of rolling is still $100 and $102, respectively. After rolling
    we have 1000/102 units of the Nov contract. The price now rallies 1% to $103.02
    and we close our position. Our capital is now $1010.


    ![](images/00058.jpeg)


    Figure 7. 2 Price of the generic first contract.

