- raw: "While selecting values within a given range, it is not necessary to search\
    \ by uniformly selecting values. Values should be selected based on the range\
    \ of values. For example, if the range one is looking at for a hyper parameter\
    \ is 2–8, one can select uniform values of 2, 3, 4, 5, 6, 7, and 8. If the range\
    \ is 32–1024, one can select values separated by a power of 2 so it will be 32,\
    \ 64, 128, 256, 512, and 1024.It is important to note that, if it is allowed to\
    \ train long enough or with a complex-enough network, the neural network architecture\
    \ is capable of learning the exact outputs for the inputs provided in the training\
    \ set. However, it will not necessarily be able to predict the outputs on unseen\
    \ data. This is known as overfitting.\n\n## Overfitting\n\nLet us look at some\
    \ of the important and common ways of reducing overfitting.\n\n### More data \n\
    \nIf the neural network has overfitted on the existing training data, then the\
    \ logical step to solve this issue is to add more training data. However, this\
    \ is not always easy as this may be time consuming and/or expensive.\n\n### Regularization\
    \ \n\nPenalize the complexity of the network by adding a regularizing component\
    \ to the backward propagation. This essentially helps to reduce the impact of\
    \ lots of hidden units which, in effect, makes the network much simpler.\n\n###\
    \ Dropout \n\nFor every example that the neural network is trained on, some neurons\
    \ are dropped at random. The neurons chosen to be dropped, change with every example.\
    \ This makes the network simpler and prevents any one neuron to be dominant in\
    \ determining the output. Two things to remember while using dropout:\n\n*   Dropout\
    \ is used only for training and not at the time of prediction.\n\n*   As the expected\
    \ value of the activation is reduced by the proportion of the dropped neurons,\
    \ the expected value of the activation is pumped up to compensate for this. This\
    \ is known as an inverse dropout.\n\nBoth the aforementioned issues are handled\
    \ by all standard implementations of neural networks, so you do not need to explicitly\
    \ code for this.\n\n### Early stopping\n\nOne of the visual tools to determine\
    \ if overfitting is happening, is to plot the cost function against the number\
    \ of iterations. If both training and development/validation set costs are decreasing\
    \ with an increase in the number of iterations, we can continue training.\n\n\
    ![](images/00096.jpeg)\n\nFigure 9. 9 Identifying when overfitting is happening\n\
    \nThe problem with early stopping is that it mixes two orthogonal (or independent)\
    \ tasks of preventing overfitting and optimizing the cost function.\n\n## Methods\
    \ to improve optimization\n\nThis brings us to the next topic: How do we optimize\
    \ the cost function, that is, how do we make the training faster and more efficient?\n\
    \n### Scale/Normalize the inputs\n\nThe scaling parameters are based on the training\
    \ set only. Both validation and test set inputs or features need to be scaled\
    \ according to the learnt scaling parameters of the training set. How does scaling\
