    \ samples required to split an internal node.\n\n## Construction of Decision Trees\
    \ - Classification setting\n\nThe classification problem is dealt with in a very\
    \ similar way with a few changes.\n\n1.  Prediction is done based on voting. So,\
    \ once we have formed the rectangular region, the class label associated with\
    \ it will be that which occurs a majority of the times.\n\n2.  The metric used\
