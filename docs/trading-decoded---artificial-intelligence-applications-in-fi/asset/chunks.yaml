- raw: "One very important consideration that has not been explicitly stated so far\
    \ pertains to the data set we get our mean encodings from. So far, we have always\
    \ and only been concerned with a training, validation and test data set. However,\
    \ when we are getting the mean encodings for our training data set, we cannot\
    \ use the full training data set. If we do that, we have essentially embedded\
    \ information from the targets into our features and our models would overfit.\
    \ Ideally, and most appropriately, we need to keep a separate data set called\
    \ ‘pre training’ from which we could get our mean encodings. Alternatively, we\
    \ could design a k-fold validation strategy to get our mean encodings for our\
    \ training data set. \n\nTo get the mean encodings for our validation data set,\
    \ we can use the entire training data set. \n\nFinally, to get the mean encoding\
    \ of our test data set, we can use the training and validation data set.\n\n##\
    \ Summary\n\nWe have covered a fair bit in this chapter. The general theme has\
    \ been to try and modify weak learners to get powerful learning algorithms.  Therefore,\
    \ we have discussed early stopping and cost complexity pruning, the most used\
    \ techniques however are bagging, random forest and boosting. We discussed an\
    \ application on how decision trees can be used to convert numeric data to categorical\
    \ data and the pitfalls of mean encoding we need to avoid. \n\n## References\n\
    \n*   Constructing Equity Portfolios from SEC 13F Data Using Feature Extraction\
    \ and Machine Learning. Alexander Fleiss, Han Cui, Sasha Stoikov and Daniel M.\
    \ DiPietro The Journal of Financial Data Science Winter 2020, 2 (1) 45-60; DOI:\
    \ [https://doi.org/10.3905/jfds.2019.1.022](https://doi.org/10.3905/jfds.2019.1.022)\n\
    \n*   [https://www.kaggle.com/c/two-sigma-financial-news/notebooks](https://www.kaggle.com/c/two-sigma-financial-news/notebooks)\
    \ \n\n*   [https://xgboost.readthedocs.io/en/latest/tutorials/model.html](https://xgboost.readthedocs.io/en/latest/tutorials/model.html)\n\
    \n*   [https://medium.com/kaggle-blog/two-sigma-financial-modeling-code-competition-5th-place-winners-interview-team-best-fitting-279a493c76bd](https://medium.com/kaggle-blog/two-sigma-financial-modeling-code-competition-5th-place-winners-interview-team-best-fitting-279a493c76bd)\n\
    \n# CHAPTER SIX -   \n\nBIAS VARIANCE TRADE-OFF\n\nThis is a short chapter, but\
    \ we would like to dedicate a full chapter to this topic simply based on the universal\
    \ applicability of this concept. By the end of this chapter you should be able\
    \ to understand the bias variance trade-off, identify a biased machine, identify\
    \ a high variance machine, and be able to implement the bias variance trade-off\
    \ in any machine.\n\nWhat do you do if your machine is not giving desirable results?\
    \ We have an entire set of options. We could:\n\n1.  Change features\n\n2.  Change\
    \ target\n\n3.  Change machine\n\n4.  Change hyper parameters\n\n5.  Train longer\n\
    \n6.  Change validation strategy\n\nWe could also use any combination of the points.\
    \ Each of these and their combinations has several sub options that significantly\
    \ increases the number of things we can do to fit our machine. An exhaustive search\
    \ is practically impossible. Understanding the bias variance trade-off gives us\
