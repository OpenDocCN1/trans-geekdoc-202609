    到目前为止，有一个尚未被明确说明但非常重要的考虑因素与我们获取平均编码的数据集有关。到目前，我们一直且仅关注训练集、验证集和测试数据集。然而，当我们为训练集获取平均编码时，我们不能使用整个训练集。如果我们这样做，本质上是将目标中的信息嵌入到了我们的特征中，导致我们的模型产生过拟合。在理想情况下，也是最合适的情况下，我们需要保留一个名为`pre
    training`（预训练）的独立数据集，从从中获取平均编码。或者，我们可以设计一种`k-fold validation strategy`来获取训练集的平均编码。


    为了获取验证集的平均编码，我们可以使用整个训练数据集集。


    最后，为了获取测试集的平均编码，我们可以使用训练集和验证数据集。


    ## 总结


    我们在这一章中涵盖了相当多的内容。总体主题是尝试修改弱学习器以获得强大的学习算法。因此，我们讨论了早停和代价复杂度剪枝，但最常用的技术仍然是装袋法（bagging）、随机森林和提升法（boosting）。我们讨论了如何使用决策树将数值数据转换为分类数据的应用，以及我们需要避免的平均编码陷阱。


