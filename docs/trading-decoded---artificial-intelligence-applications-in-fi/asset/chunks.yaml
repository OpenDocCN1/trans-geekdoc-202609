    feature 1, we have the previous day returns of e-mini futures, and as feature
    2, we have the previous day returns of active crude oil futures. Our hypothetical
    data set looks something like Figure 4.1.


    | Sample No | Feature 1 | Feature 2 | Target |

    | --- | --- | --- | --- |

    | 1 | 0.50% | 1% | 0.25% |

    | 2 | 1% | 2% | 0.25% |

    | 3 | 2% | -2% | -1.00% |

    | 4 | -0.50% | -1% | -0.25% |

    | 5 | -1% | -2% | -0.25% |


