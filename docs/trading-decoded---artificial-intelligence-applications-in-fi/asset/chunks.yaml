    ![自动生成的手机屏幕](img/0105.jpeg)


    在下方添加第一个隐藏层，具有 `dl1= 64` 个神经元、`af1="relu"` 激活函数，权重使用 `l2` 正则化，参数为 0.08


    ![](img/0106.jpeg)


    添加下一层作为 dropout，丢弃概率设置为 .25


    ![](img/0107.jpeg)


    添加输出层，具有三个神经元且激活函数为 softmax


    ![](img/0108.jpeg)


    编译并拟合，损失函数设置为交叉熵，`Adam` 优化器且学习率为 `lr1`。在训练数据上拟合，在验证数据上验证，并在验证准确率上设置早停


    ![](img/0109.jpeg)


    针对 `lr1(学习率)`、`dfl1` 和 `af1(激活函数)` 的超参数优化。


    ![自动生成的手机屏幕](img/0110.jpeg)


    ## 金融应用：处理不平衡数据集


    之前提到的，神经网络是通用函数近似器，可以解决金融领域的各种问题。让我们讨论这样一种设定。


    我们在分类问题中经常遇到不平衡类别。假设我们对预测 CME 黄金期货的下一个跳价感兴趣。我们将其设定为一个 3 类问题，其中我们为样本分配


