  trans: "\n\n# 2. 执行划分的特征正确层次结构。哪些特征位于根节点，哪些特征位于根节点之下的节点，此类推。\n\n让我们粗略查看产生这些输出的算法。目前，我们坚持使用回归设置。为了算法的创新应用，这种程度的细节是必要的。\n\
