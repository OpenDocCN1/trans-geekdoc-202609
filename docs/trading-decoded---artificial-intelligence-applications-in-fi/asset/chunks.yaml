    # 第十章 - 卷积神经网络


    标签 1：对应下一个 tick 高于当前 tick 的样本。我们称之为 `class1`。


    标签 0：对应下一个 tick 与当前 tick 相同的样本。我们称之为 `class 0`。


    标签 -1：对应下一个 tick 低于当前 tick 的样本。我们称之为 `class 2`。


    图 9.10 是我们的数据集可能呈现的快照。


    ![一个白墙的近写 自动生成的描述](img/00111.jpeg)


    图 9. 10 CME 黄金期货高频数据的快照。


    在整个 2018 年，我们大约有 2000 万个样本，其中 15% 属于 `class 1`，15% 属于 `class 2`，70% 属于 `class
    0`。因此，如果我们的机器预测所有样本都属于 `class 0`，我们的准确率将达到 70%，这可能是相当合理的。在训练期间，我们的机器 70% 的时间都会看到属于
    `class 0` 的样本。如果超参数的选择使得机器具有“偏见”，那么很有可能所有样本都被预测为属于 `class 0`，这本质上意味着我们不会进行交易，因此不会盈利。这是我们在处理不平衡数据集时的一个经典问题。我们提出的解决方案涉及对代价函数的修改。让我们来看细节：


    对于一个特定样本，三分类问题的分类交叉熵为：


    `CE = -y0log(p0) –y1log(p1) –y2(logp2)`


    其中 `Yi=1,∀ i =0,1,2`


    且 `pi`：样本属于 `class i` 的概率


    针对不平衡类别的修改后的代价函数为：


    `CEmodified = -(w0y0log(p0)) –(w1y1log(p1)) –(w2y2(logp2))`


    其中 `wi` 是 `class i` 的权重，计算方法为该类别在我们的训练数据集中的出现频率的倒数。由于 `class 1` 出现在 15% 的样本中，`w1=1/(15%)
    = 6.66`，`w0 = 1/(70%) =1.42` 且 `w2 = 6.66`


    最后，这是我们在 Keras 中实现它的方式


    ![](img/00112.jpeg)


    该函数在编译模型时被调用


    ![](img/00113.jpeg)


    ## 总结


    - 我们引入了构建深层神经网络架构所需的所有构建组件。

    - 我们还向你介绍了了用于实现神经网络的 Keras API。

    - 最后，我们讨论了如何修改代价函数来处理不平衡数据集。


    ## 参考文献


    1. “Dropout: A Simple Way to Prevent Neural Networks from Overfitting” 由 Srivastava,
    Hinton 等撰。

    2. [`www.deeplearningbook.org/`](https://www.deeplearningbook.org/)

    3. [`keras.io/`](https://keras.io/)

    4. Gu, Shihao& Kelly, Bryan &Xiu, Dacheng (2018). Empirical Asset Pricing Via
    Machine Learning. SSRN Electronic Journal. `10.2139/ssrn.315957`.

    5. Lim, Bryan &Zohren, Stefan & Roberts (2019). Enh Time Series Momentum Strategies
    Using Deep Networks.


    ## 卷积操作


    本章介绍卷积网络。然后我们尝试揭示这种网络如何被用于发现用于交易的图表模式，这是一些交易员已经能够部署的方法。首先讨论点积操作，以及它如何与神经网络语境下定义的卷积操作相关。


    让我们从观察两个简单向量 `U` 和 `V` 开始。


    ![](img/00114.jpeg)


    两个向量之间的点积操作产生 `U.V`。


    让我们取另一个定义如下的向量 `W`：


    ![](img/00115.gif)


    请注意 `||W|| = ||V||`。向量 `U` 和 `W` 之间的点积操作产生 `U.W`。


    两个向量越相似，在对它们的模长 `|||` 进行调整后，它们的点积值越高。由于向量 `U` 和 `V` 的点积大于向量 `W`，即 `U.V > U.W`，我们推断向量
    `U` 和 `V` 比 `W` 更为相似。


    我们现在将讨论两个向量之间的卷积操作，以及它应用于卷积神经网络的方式。让我们定义一个长度为 6 的向量 `U` 为：


    ![](img/00116.jpeg)


    一个我们称为长度为 2 的滤波器向量 `f` 定义为 `|f=2|`。我们取 `U` 与 `f` 的点积。


