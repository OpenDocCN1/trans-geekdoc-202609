    \ high values somewhere around the end of wave 1 and wave 3, which is where the\
    \ similarity between the time series `P` and the filter `f` is the highest. The\
    \ convolution operation therefore helps us find where in the time series `P` does\
    \ the shape of filter `f` occur.\n\n![](images/00127.jpeg)\n\nFigure 10. 8 A hypothetical\
    \ discrete filter.\n\nSo far, we have understood what convolution means and what\
    \ it does. Where do neural networks fit into all this?\n\nThe neural network helps\
    \ us find this filter `f`. In other words, which shapes in this time series are\
    \ necessary to occur to meet the objective, that is, which cause the selloff.\n\
    \nThe neural network will essentially need to find the shape/values and length\
    \ of this filter such that the market sells off. The back-propagation algorithm\
    \ will be used to train and adjust the values of the filter such that the market\
    \ sells off. In that sense, the convolutional neural network helps us find patterns\
    \ that occur in the time series that meet our objective, which as defined by the\
    \ target is for the market to sell off. This helps in feature abstraction.\n\n\
    Whatever the filter values are, it is the same set of values that are applied\
    \ across the entire time series, to find a pattern. Wherever the same pattern\
    \ occurs in the timeseries, the filter can identify it. The value of the filter\
    \ doesn’t need to change to achieve the objective of finding the pattern. This\
    \ property is known as translation invariance. Hopefully, we have been able to\
    \ explain how CNN can be used to find features that meet the target function.\
    \ In the next few sections we will discuss a few more important elements of the\
    \ CNN architecture.\n\n## Padding\n\nIn its current form, the price points at\
    \ the edges of the vector seem to be given less importance than the price points\
    \ in the middle.\n\n![](images/00128.jpeg)\n\nFigure 10. 9 Time series convolved\
    \ with a filter\n\nIn Figure 10.9 during convolution, `P1` and `P5` are just used\
    \ once; each with the filter values `f1` and `f2` respectively. `P2`, `P3`, and\
    \ `P4`, on the other hand, are used twice with the filters. Besides, each time\
    \ we convolve a time series of length `n` with a filter of length `f`, the resulting\
    \ time series is of length `n-f+1 <n`. This may negatively affect learning capability\
    \ as we get deeper with the architecture. We may choose to pad the time series\
    \ with `2p` zeros, `p` on either side Figure 10.10. The time series is now of\
    \ length `n+2p`, which, when convolved with a filter `f`, produces a time series\
    \ of `n+2p-f+1`.\n\n![](images/00129.jpeg)\n\nFigure 10. 10 Padding time series\n\
    \nIf we desire to keep the length of the time series the same, `n+2p-f+1=n`\n\n\
    `P = (f - 1)/2`\n\nThis is called “same convolution”.\n\nIf we have `P=0`, it\
    \ is called “valid convolution”.\n\n## Strides\n\nWhen we were moving our filter\
    \ along the vector after performing each dot product operation, we were doing\
    \ it in steps of one. The stride was effectively assumed to be one. That need\
    \ not be the case always. Let us say we have a vector `u` given by\n\n![](images/00116.jpeg)\n\
    \nAnd the filter `f` given by \n\n![](images/00130.jpeg)\n\nThe convolution operation\
    \ with a stride of `2` is given by the following steps in Figure 10.11:\n\n![](images/00131.gif)\n\
    \nFigure 10. 11 stride 2 convolution operation\n\nEffectively,\n\n![](images/00132.jpeg)\n\
    \nTo generalize, when we convolve an `n` dimensional vector with an `f` dimensional\
    \ filter and use a stride of `s`, we get an output of size `[(n+2p-f)/s +1]`\n\
    \n`1 × n © 1 × f = 1 × [(n + 2p - f)/s + 1]`\n\nWhy would we want to add strides\
    \ to a time series for trading? One way to think about it is that we are looking\
    \ for opportunities across time frames. The pattern of interest does not necessarily\
    \ need to occur at the most granular time step - it may be more visible at a higher\
    \ time step. The same stride allows for monthly, daily, and intraday frames.\n\
    \n## Multiple Filters\n\nSo far, we have been working with one filter. However,\
    \ we are free to add many filters as needed.\n\n## Multiple Channels as Input\n\
    \nThe multi-dimensional inputs are also known as multiple channels. Different\
    \ representations of the same time series could be put into these different channels.\n"
