    《交易解码》（Trading Decoded）填补了交易和系统开发文献中的重要空白。它让交易员和精通技术的人都能利用计算能力和技术进步的力量来与大玩家竞争，而不至于在阿尔法（alpha）不断被侵蚀的传统交易策略中被抛弃。在读过许多交易书籍并一贯感到失望后，《交易解码》在其他书籍失败的地方取得了成功，因为它为读者提供了成功的所需的工具。


    Michael Annerl

    Viseroij Capital Management 首席合伙人

    前高盛亚洲大宗商品结构化负责人


    # 前言


    我们生活在这个知识分享的美妙时代，从社区分享的见解和经验中获益良多。这是我们回馈和表达谢意的方式。金融业将大规模地使用机器。这一趋势已经开始，但与其他行业适应这一技术的规模相比，还无可比日的。坐在银行、基金和其他金融机构的交易员也将随着时间的推移而演变。


    在本书书中，我们试图将人工智能技术与投资管理科学（如果它能是一门科学的话）相结合。本书从第一章开始介绍 AI 背景下的交易。后续章节解释了各种机器学习算法和概念。书中使用了实际的金融案例来解释
    AI 概念，以帮助联系这两个领域。套利交易（Carry trading）章节是一个例外，你可以在那里学习如何将金融概念应用于算法交易。最后一章包含了最大的收获，并为读本书的人提供了一个直观的指南。


    本书面向希望建立人工智能算法专业知识并以此增强其阿尔法搜索能力的专业交易员和投资管理专业人士。对于那些熟悉人工智能算法并希望建立交易和投资专业知识的读者来说，这本书同样有用。我们尽力保持解释非常直观，即将开启金融或
    AI 世界之旅的读者应该会发现这些内容很有帮助。机器学习算法的介绍将在假设没有先验知识的基础上。


    我们必须事先声明，我们没有通过本书出售任何交易系统或方法。我们只在认为 `python` 函数有助于用户理解时才提供了这些代码。我们的目标是建立概念、强调挑战，并建立一个在市场中寻找阿尔法时需要遵循的流程。


    请分享您的意见、反馈以及您希望我们如何改进这本书。期待您的回复。请通过 `tradingdecoded@gmail.com` 与我们联系。


    Avirath, Arvin, Raja


