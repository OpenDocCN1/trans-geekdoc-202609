    samples to these rectangular regions. As an example, sample numbers 1 and 2 belong
    to a rectangular region where:


    `0<=F1 <= 1%`


    and `0<=F2 <= 2%`


    The prediction is simply an average of the target of samples that have been assigned
    to that region. ,.22 any sample from the test data set that gets assigned to this
    rectangular region, will have a prediction of 0.25%.


    That is how simple decision trees are.


    To summarize, decision trees divide the feature space into rectangular regions
    as a result of which samples from the training data set are assigned to these
    rectangles. When a test sample arrives, it is assigned to a rectangular region
    based on its feature values F1 and F2. The dependent variable simply assumes a
