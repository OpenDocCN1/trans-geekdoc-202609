    One very important consideration that has not been explicitly stated so far pertains
    to the data set we get our mean encodings from. So far, we have always and only
    been concerned with a training, validation and test data set. However, when we
    are getting the mean encodings for our training data set, we cannot use the full
    training data set. If we do that, we have essentially embedded information from
    the targets into our features and our models would overfit. Ideally, and most
    appropriately, we need to keep a separate data set called `pre training` from
    which we could get our mean encodings. Alternatively, we could design a `k-fold
    validation strategy to get our mean encodings for our training data set.


    To get the mean encodings for our validation data set, we can use the entire training
    data set.


    Finally, to get the mean encoding of our test data set, we can use the training
    and validation data set.


    ## Summary


    We have covered a fair bit in this chapter. The general theme has been to try
    and modify weak learners to get powerful learning algorithms. Therefore, we have
    discussed early stopping and cost complexity pruning, the most used techniques
    however are bagging, random forest and boosting. We discussed an application on
    how decision trees can be used to convert numeric data to categorical data and
    the pitfalls of mean encoding we need to avoid.


    ## References


    *   Constructing Equity Portfolios from SEC 13F Data Using Feature Extraction
    and Machine Learning. Alexander Fleiss, Han Cui, Sasha Stoikov and Daniel M. DiPietro
    The Journal of Financial Data Science Winter 2020, 2 (1) 45-60; DOI: [https://doi.org/10.3905/jfds.2019.1.022](https://doi.org/10.3905/jfds.2019.1.022)

