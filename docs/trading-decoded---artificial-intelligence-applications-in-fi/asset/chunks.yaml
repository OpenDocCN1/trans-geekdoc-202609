    为了修改方程我们需要的是：


    寻找 $\beta_0, \beta_1, \beta_2 \dots \beta_p, \beta_{12}, \beta_{22} \dots \beta_{p2}$
    的值


    1. 使得使得 $M$ 最大化

    2. 使得对于所有 $n$ 个样本，$y_i(\beta_0 + \beta_1 x_{i1} + \beta_2 x_{i2} + \beta_3 x_{i3}
    \dots \beta_p x_{ip} + \beta_{12} x_{i1} + \beta_{22} x_{i2} + \beta_{32} x_{i3}
    \dots \beta_{p2} x_{ip}) \ge M$

    3. 且 $\beta_{12} + \beta_{22} + \beta_{22} \dots + \beta_{p2} + \beta_{122} +
    \beta_{222} + \beta_{222} \dots + \beta_{p22} = 1$


    某些文本对优化问题的陈述略有不同。让我们尝试理解其等价性。


    问题的另一种表述是：


    最小化 $\beta_0² + \beta_{12} + \beta_{22} \dots + \beta_{p2}$


    如果 $y_i = 1$，$\beta^T x_i \ge 1$

    如果 $y_i = -1$，$\beta^T x_i \le -1$


    正如本章开头所述，向量 $\beta$ 于直线 $\beta^T x$。并且


    $\beta^T x_i = \|\beta\| \|x_i\| \cos\theta \ge 1$


    $\|x_i\| \cos\theta$ 是向量 $x_i$ 沿向量 $\beta$ 的投影，因此 $\|x_i\| \cos\theta$ 沿着一个垂直于分类器
    $\beta^T x$ 的向量。由于我们的优化目标是最小化 $\|\beta\| = \beta_0² + \beta_{12} + \beta_{22}
    \dots + \beta_{p2}$，这等同于目标是最大化 $\|x_i\| \cos\theta$。这本质上是在说明我们需要选择一个能最大化 $\|x_i\|
    \cos\theta$ 的分类器，即样本到分类器的垂直距离。


    我们现在看到引入非线性的方法之一是引入非线性特征。一种更稳健的方法是核技巧（kernel trick）。


    我们在核技巧中所做的是取每个样本，将其通过核变换并得到样本的新表示。然后我们对这些转换后的特征应用上述的算法。


    那么，什么是核呢？核仅仅是一个函数。它可以是任何形式，但对于我们讨论的内容，它经常采取下面的形式：


    $K(x, x_i) = e^{-(x-x_i)²/2(\sigma²)}$


    当 $x$ 接近 $x_i$ 时，$K(x, x_i)$ 接近 1。

    当 $x$ 与 $x_i$ 差异很大时，$K(x, x_i)$ 接近 0。


    因此，对于特定的样本 $(x_u, y_u)$，我们为从 1 到 $n$ 的所有 $i$ 值计算 $K(x_u, x_i)$，其中有 $n$ 个样本。因此，原本是
    $p$ 维的 $x_u$，现在在特征空间中是 $n$ 维的。我们将原始数据集中的所有 $n$ 个样本表示为这些 $n$ 维特征。原本的 $n \times
    p$ 现在变为了 $n \times n$。然后我们对这个特征空间应用 SVM 算法。


    可以使用与树相同的特征，并如下所示训练一个 SVM 分类器：


    ![一张包含刀具描述的自动生成的图片](img/00086.jpeg)


    对相同输入比较不同的分类器通常是一个好主意。对于给定的特征集，建议对超参数进行网格搜索以获得最佳模型。当特征数量远高但可用数据很少时，SVM 的性能通常优于其他分类器。


    ## 总结


    我们从一些线性代数的基础知识开始本章，并讨论了一个理想且过度限制的分类器“最大间隔超平面”。然后我们放宽了一些限制条件以构建了 SVM。


