    ### 频率编码 (Frequency Encoding)

    在每个样本中，类别特征被其出现的频率替换，例如在图 2.4 中，共有八个样本`DEC`（十二月）在其中出现了两次，而 `NOV`（十一月）只出现了一次。我们将
    `DEC` 替换为其出现频率 `2/8 = 25%`，并将 `NOV` 替换为 `12.5%`。实现此操作的简单代码如下：


