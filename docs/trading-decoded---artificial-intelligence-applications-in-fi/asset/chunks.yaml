  fmt: '

    The way we approach this problem is slightly different to anything we have seen
    thus far. We draw motivation from the study of feature importance. So far, we
    are quite comfortable in predicting the expected performance of a strategy given
    a certain set of macro-economic conditions. This is step one of what we need to
    do, and we make a note of the expected profit and loss.


    Next we replace one of the macroeconomic variables with random numbers (from a
    standard normal distribution since we have scalarized the input). We re-compute
    the expected profit and loss and note the change to what was calculated in step
    one. If the profit and loss now is way lower than what was calculated in step
    one, this particular macroeconomic variable is important in predicting the strategies
    return. This process is repeated for all the macroeconomic variables, which can
    then be ranked based on the difference in profit and loss when compared to what
    was calculated in strategy one.


    ### Step 1

    - The index created by going long `ConsumerDiscretionaryValueLong` and short `ConsumerStaplesValueLong`
    based on the macro economic variables appreciates 25% per annum in the training
    data. The code that does it is shown in Figure 12.15. All that we are doing is,
    if the expected return is positive, we are long the portfolio (long `ConsumerDiscretionaryValueLong`
    and short `ConsumerStaplesValueLong`). If the expected return is negative, we
    are short the portfolio (short `ConsumerDiscretionaryValueLong` and long `ConsumerStaplesValueLong`).


    ![A screenshot of a cell phone Description automatically generated](images/00183.jpeg)


    Figure 12. 15 Calculate PnL of the portfolio.


    ### Step 2

    - We replace each macroeconomic variable with random numbers (sampled from a standard
    normal distribution) one at a time and recalculate the profit and loss as done
    in step 1. The lower this `PnL`, the greater the importance of this macroeconomic
    variable. Figure 12.16 lists what turn out to be the most important features impacting
    the portfolio.


    ![](images/00184.jpeg)


    Figure 12. 16 Most important features for `ConsumerDiscretionaryValueLong` vs
    `ConsumerStaplesValueLong`.


    Figure 12.17 shows the positioning of the portfolio in 2008, wherein for most
    part it was long `ConsumerStaples` and short `ConsumerDiscretionary`.


    ![](images/00185.jpeg)


    Figure 12. 17 Positioning of the portfolio.


    We make loads of other discoveries by analysing this model, which can offer numerous
    opportunities to us.


    - Which strategy performs the best 2 months after a recession?

    - Does this rally have the characteristics of a bull market or is it a bear market
    squeeze higher?

    - What is happening in the macroeconomic environment when there is a sudden and
    drastic change in the rank of one of these strategies?

    - How much capital is expected to flow into a particular strategy in a given economic
    environment? How much has flown in currently and what are the risks and opportunities?

    - What is the mean, median, maximum and minimum performance of a strategy in a
    given macro-economic environment? How much has it performed so far? What are the
    opportunities and risks?

    - Why has value suddenly stopped performing? Why is growth outperforming? What
    are the major long term trends that seemed over stretched and are beginning to
    falter? What has happened earlier when such trends have faltered?

    - What happens when our model breaks down, i.e. what happens when our macro-economic
    indicators are pointing south and the market is heading north?


    The list is endless and open to a lot of research with a whole lot of findings.
    That’s where we conclude the chapter and the book.


    ### Some parting thoughts from our trials and tribulations


    - Data quality is of paramount importance. The number of vendors providing usable
    high quality data can be counted in one hand. We have yet to come across a vendor
    who provides high quality data for all frequencies. Data access is expensive.
    We have found errors in data provided by some of the top vendors. We repeat: Data
    is expensive, and if you can get it directly from the source, that’s simply the
    best option. We cannot stress this enough.

    - The cloud is fantastic, but again its expensive and realistically you will need
    a whole lot of computing power to conduct meaningful experiments.

    - Pick an economic theory and use the AI to model, improve, understand that.

    - Validation strategy is a very important part of the problem.

    - Rule of thumb, if you have to run too much iteration to get a problem to work,
    you are doing something wrong or fishing in a pond with no fish.

    - Focus ONLY on improving the quality of your prediction, not on the strategies’
    ability to make money. The latter should be a natural result of the former. If
    you take the risk management away from your trading strategy and your back test
    loses money, you have overfit to your historical data and your signal quality
    is weak.

    - A lot of data helps. Select your problems accordingly.

    - Each and every decision that you make along the way should be backed by statistical
    evidence in favour of the path you intend to take. All decisions are important.

    - Have a plan on tracking how and when your model is breaking down and how and
    when should you recalibrate.

    - The error in your prediction has vital information.


    ## References


    - Bentley J (1975).“Multidimensional Binary Search Trees Used for Associative
    Searching.”

    - [https://www.msci.com/gics](https://www.msci.com/gics)

    '
  trans: '


    我们处理这个问题的方法与目前为止看到的任何方法略有不同。我们的灵感来源于对特征重要性（feature importance）的研究。到目前为止，我们非常擅长在给定的宏观经济条件下预测策略的预期性能。这是我们需要的第一步，并记录预期的盈亏。


    接下来，我们将其中一个宏观经济变量替换为随机数（来自标准正态分布，因为我们已经对输入进行了标量化）。重新计算预期盈亏，并记录与第一步计算结果之间的变化。如果现在的盈亏远低于第一步的结果，那么这个特定的宏观经济变量在预测策略收益方面就是重要的。对所有宏观经济变量重复此过程，然后根据其与策略一计算结果相比的盈亏差异进行排序。


    ### 步骤 1

    - 基于宏观经济变量做多 `ConsumerDiscretionaryValueLong` 并做空 `ConsumerStaplesValueLong` 创建的索引在训练数据中每年增
    25%。执行该操作的代码如图 12.15 所示。我们所做的只是：如果预期收益为正，我们就做多投资组合（做多 `ConsumerDiscretionaryValueLong`
    并做空 `ConsumerStaplesValueLong`）。如果预期收益为负，我们就做空投资组合（做空 `ConsumerDiscretionaryValueLong`
    并做多 `ConsumerStaplesValueLong`）。


    ![手机屏幕截图，自动生成的描述](img/00183.jpeg)


    图 12. 15 计算投资组合的盈亏 (PnL)。


    ### 步骤 2

    - 我们一次将每个宏观经济变量替换为随机数（从标准正态分布采样），并按照步骤 1 的方法重新计算盈亏。`PnL` 越低，该宏观经济变量的重要性就越高。图 12.16
    列出了对投资组合影响最重要的特征。


    ![](img/00184.jpeg)


    图 12. 16 `ConsumerDiscretionaryValueLong` 与 `ConsumerStaplesValueLong` 最重要的特征。


    图 12.17 显示了投资组合在 2008 年的持仓情况，大部分它是做多 `ConsumerStaples` 并做空 `ConsumerDiscretionary`。


    ![](img/00185.jpeg)


    图 12. 17 投资组合的持仓。


    通过分析该模型，我们有了许多其他发现，这些为我们提供了无数机会。


    - 在衰退 2 个月后，哪种策略表现最好？

    - 这种上涨具有牛市特征，还是熊市挤压导致的推升？

    - 当这些策略之一的排名发生突然剧烈变化时，宏观环境发生了什么？

    - 在给定的经济环境下，预计会有多少资金流入特定策略？目前流入了多少？风险和机会是什么？

    - 在给定的宏观经济环境下，策略的平均值、中位数、最大值和最小值是多少？到目前为止表现如何？机会和风险是什么？

    - 为什么价值股突然停止了表现？为什么增长股表现更优？哪些看似过度扩张并开始疲软的主要长期趋势是什么？当此类趋势疲软时之前发生了什么？

    - 当我们的模型失效时会发生什么？即当我们的宏观经济指标看空而市场看涨时，会发生什么？


    这个列表是无尽的，并且可以进行大量研究并会有很多发现。这就是我们本章和本书的结语。


    ### 参考文献


    - Bentley J (1975).“Multidimensional Binary Search Trees Used for Associative
    Searching.”

    - [`www.msci.com/gics`](https://www.msci.com/gics)


    '
