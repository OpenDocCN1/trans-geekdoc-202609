- raw: "![](images/00009.jpeg)\n\nFigure 2. 1 What a typical tabular data set looks\
    \ like\n\nThe samples are observations recorded for the purpose of discovering\
    \ a pattern or an empirical relationship. The observation frequency could be anything\
    \ - monthly, daily, or even every tick. The features or the columns are attributes\
    \ of the data that we think will help us uncover the pattern. These features could\
    \ be of various different data types.\n\n*   Numeric: Typically, price returns,\
    \ fundamental data such as earning releases, inventory data for commodities, and\
    \ so on. Typically, these are set to be of data type float or integer in any programming\
    \ language.\n\n*   Categorical/Ordered categorical: These are data types that\
    \ represent a finite set of discrete items. For instance, “January” represents\
    \ the first 31 days of a year; “Week 1” represents the first 7 days of a month,\
    \ and “better than expectations” represents all those companies whose earnings\
    \ beat expectations, and so on. How do we present this information to a machine\
    \ in a meaningful way? We will discuss that in the next section.\n\n*   Date time:\
    \ There could be meaningful information in the date and time of the day. There\
    \ are seasonal patterns not only in the calendar months, but also in the week\
    \ of the month, and the day of the week. Even the session of the day that may\
    \ have some predictive power. Below are a few examples that we see in the market.\
    \ \n\n1.  Consistent outperformance of platinum and palladium futures in January\
    \ and February (Figure 2.2).\n\n2.  Higher price volatility of various instruments\
    \ in the data intensive first two weeks of the month.\n\n3.  Intraday seasonality\
    \ pattern in volumes traded for various futures contracts (Figure 2.2).\n\n![A\
    \ screenshot of a video game Description automatically generated](images/00010.jpeg)\n\
    \nFigure 2. 2 A screenshot from Bloomberg showing the expected positive returns\
    \ in the month of January and February (\"Source: Bloomberg Finance L.P. Used\
    \ with permission of Bloomberg Finance L.P.\")\n\n![A picture containing white,\
    \ close, cat, red Description automatically generated](images/00011.jpeg)\n\n\
    Figure 2. 3 Intraday seasonality in volume for e-mini S&P 500 futures as represented\
    \ by the bimodal red colored lines in the second panel (“Source: Bloomberg Finance\
    \ L.P. Used with permission of Bloomberg Finance L.P.”)\n\n*   Images: Satellite\
    \ data to study the prospective yield of agricultural commodities. We have not\
    \ researched or traded this concept and therefore it will not be covered this\
    \ in this book.\n\nBefore diving into each of these, it is worth highlighting\
    \ that the way you present the data to the machine sometimes depends on the kind\
    \ of machine that you intend to deploy. From this perspective, there are two types\
    \ of machines we encounter. Models such as decision trees (see Chapter 4) rely\
    \ on putting the samples into various rectangular regions of the feature space.\
    \ These models are scale independent wherein changing the scale of the inputs\
    \ will not have a meaningful impact on the solution.In our experience, it sometimes\
    \ adversely affects performance.\n\nAdditionally, there are models such as logistic\
    \ regression and artificial neural networks where the scale of the features has\
    \ a very significant impact on the solution.\n\nLet us discuss an example to understand\
    \ the intuition behind scaling of features. Let us say we have only two features:\
    \ x1 and x2. A decision tree solution would typically be interpreted as follows:\n\
    \n1.  All samples with x1 < a and x2 > b belong to the same compartment and have\
    \ a predicted value of .35. Here a and b are the parameters which the algorithm\
    \ has solved for. All samples meeting this condition are in region 1.\n\n2.  All\
    \ the other samples have a predicted value of .75. All samples meeting this condition\
    \ are in region 2.\n\nChanging the scale of x1 by say a factor of 3, and x2 by\
    \ a factor of 2 is only going to change the values of a and b by similar scales.\
    \ The samples that belong to region 1 and region 2 will not change. In this case,\
    \ the solution does not change as we are interested in the regions that a specific\
    \ sample belongs to. In particular, we are interested in the samples that are\
    \ grouped together.\n\nA regression (scale-dependent model), on the other hand,\
    \ has a solution such as\n\nY = F (a\\*x1 + b\\*x2)\n\nThe a and b values here\
    \ are again the output of the model. If the scale of x1 and x2 changes, the values\
    \ of a and b change and the output Y changes.\n\nLet us now start our discussion\
    \ on how to handle various data types.\n\n## Numeric\n\nAs a general guideline\
    \ for scale-independent models such as decision trees, numeric features can just\
    \ be used in their given format. In scale-dependent models, it is best to pre-process\
    \ them. Scikit Learn’s Min Max scaler or standard scaler could be used. The Min\
    \ Max scaler ensures all feature values are within a predefined range.\n\nThe\
    \ simple way to do scaling in Scikit Learn is shown in the box below after loading\
    \ the data.\n\n![A picture containing knife, table Description automatically generated](images/00012.jpeg)\n\
    \nThe Standard Scaler, on the other hand, ensures the mean of all scaled feature\
    \ values is zero and the standard deviation is 1. All it does is to subtract the\
    \ mean from the feature and divide the result by the standard deviation of the\
    \ result. These scaling techniques can have a huge impact on optimization techniques\
    \ such as gradient descent used in some scale-dependent models, like Artificial\
    \ Neural Networks. The simple way to implement this in Scikit Learn is as follows.\n\
    \n![A picture containing knife, table Description automatically generated](images/00013.jpeg)\n\
    \n## Categorical data\n\nThese are features that essentially represent certain\
    \ categories, like months of the year or days of the week, for example. These\
    \ are extremely useful and powerful set of features that, when pre-processed correctly,\
    \ can add a lot of value to the machine.\n\nIf we are interested in capturing\
    \ seasonality effects on a financial instrument, we need to start by giving the\
    \ month of the year as a feature. Some days of the week are more volatile than\
    \ the rest. For instance, on Wednesdays, oil inventory data is being published,\
    \ Thursday’s WASDAE reports on crops, and US employment report on the first Friday\
    \ of every month. These days are known to be more directional/volatile days than\
    \ the rest. Needless to say, the day of the week may therefore add value to the\
    \ machine. Most of the US economic data is published in the first two weeks of\
    \ a month, which may set the tone for the rest of the month. It may therefore\
    \ make sense to use it as a feature of whether we are in the first half of the\
    \ month or the second half of the month.\n\nIf the categories of the categorical\
    \ data represent some form of an order or ranking, then the categorical data sets\
    \ are also known as ordinal data sets.\n\nLet us say we are tracking by how much\
    \ the markets expectation of rate cuts has deviated from what the median projection\
    \ of the FED (US Federal Reserve) is. We may categorize the difference in expectations\
    \ as High, Inline, and Low, where:\n\nHigh—implies that markets are way more hawkish\
    \ than the FED\n\nInline—implies that markets have the same view as the FED\n\n\
    Low—implies that markets are way more dovish than the FED\n\nHere High, Inline,\
    \ and Low imply some form of a rank or an order to the data they represent.\n\n\
    The question then remains, how do we present this data to the machine?\n\n###\
    \ One Hot Encoding\n\nLet us say our data set looks like Figure 2.4, where we\
    \ have name of the month as one of the features.\n\n| Serial No || Average return\
    \ over period of 10 days || Month || Average return over next 10 days |\n\n| ---\
    \ | --- | --- | --- |\n\n| 1 || \\-2% || DEC || \\-3.00% |\n\n| 2 || \\-2.50%\
    \ || NOV || \\-3.00% |\n\n| 3 || 3% || JAN || \\-2.00% |\n\n| 4 || 1% || FEB ||\
    \ 0.75% |\n\n| 5 || 2% || JAN || 1.50% |\n\n| 6 || 1.70% || MAR || 2.30% |\n\n\
    | 7 || \\-8% || DEC || \\-2.00% |\n\n| 8 || 7% || JAN || \\-2.20% |\n\nFigure\
    \ 2. 4 Example of dataset containing categorical data."
