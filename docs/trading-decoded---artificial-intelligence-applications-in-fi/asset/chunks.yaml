    ![自动生成的 Logo 特写](img/00028.jpeg)


    ### 灵敏度/召回率 (Sensitivity/Recall)


    继续之前的只做多基金例子，我们根据买入概率和阈值假设获得了某些买入信号。我们可能会发现这些信号的数量太少，无法在统计学上提供可靠的估计；或者我们发现信号太多，从而显著降低了单笔交易的盈利能力。无论哪种，我们都感兴趣与市场提供的总买入信号相比，我们获得了多少个买入信号。这就是**召回率（recall）**。它的计算方法是第四象限的样本数除以第三象限和第四象限的样本总数。


    ### 特异性 (Specificity)


    **特异性**是预测预测为属于类 `0` 的样本数除以实际属于类 `0` 的样本数。它的计算方法是混淆矩阵中第一象限样本数除以第一象限和第二象限样本的总数。


    ### F1 分数 (F1 score)


    基于对精确率和召回率的讨论，合理的假设我们不仅希望最大化买入预测的准确性（精确率），还希望最大化买入预测占市场能提供的总买入信号数的百分比。`F1 score`
    正代表了这一点。它是精确率和召回数的调和平均数。


    ![自动生成的 Logo 特写](img/00029.jpeg)


    上述代码可以提供精确率、召回率、f1 分数和准确率。


    ### AUC


    你可能已经注意到，样本分配到混淆矩阵的哪一个象限取决于阈值。退一步说，一旦我们有了概率，样本被分配到哪一类取决于我们选择的阈值。在不同的阈值值下，将灵敏度（y
    轴）与 x 轴上的 `1 – specificity` 进行绘图，就得到了我们的 `ROC`（接收者操作特征）曲线。ROC 曲线下的面积（`AUC`）是衡量分类性能的指标。`AUC
    = .5` 基本上意味着没有学习，而 `AUC = 1` 则意味着最好的机器。


    ![](img/00030.jpeg)


    本章最大的收获是我们讨论的关于如何构建验证策略的方法论。在此处的一个错误可能就是成功与失败的区别。


    我们还向你介绍了用于评估分类和回归机器的各种指标。


    ## 总结


    1. 我们详细讨论了验证数据集的特性和要求。

    2. 关键是将验证数据视为测试数据或从未来逐个样本流式传输的数据，而不是从数据库中读取整个块数据。这两种预测应该给出完全相同的结果。点在于，预测验证样本所需的所有信息在当时应该是可用的，并且不应该从未来泄露。

    3. 最后，我们讨论了衡量机器性能的各种指标。


    # 第四章 - 树模型


    在本章中，我们引入决策树作为金融领域可以部署的最强大且可解释的算法之一。根据我们的经验，这些算法最适用于数据有限但非稀缺的问题。有些人会认为决策树类似于人类的学习过程，它们依赖于模块化并排除低概率的情景。


    在开始时，重要的是，决策树本质上是弱学习器，但通过几个简单且极其直观的修改就可以使其变得非常强大。我们说的“弱学习器”是指什么？弱学习器是指那些在训练数据集上表现非常好，但在验证或测试数据集上难以良好泛化的算法。


    到本章结束，你将理解用于分类和回归任务构建决策树的逐步过程。这种理解对于理解我们在接下来几章中讨论的应用至关重要。


    ## 决策树


    让我们来看一个回归设置下的决策树，我们只有五个样本和两个特征。这只是一个玩具示例，我们需要更多的样本来进行有意义的学习，理想情况下也更多特征。作为目标，我们试图预测
    E-mini S&P 500 期货次日的收益率。作为特征 1，我们有 e-mini 期货的前一日收益率；作为特征 2，我们有活跃原油期货的前一日收益率。我们的假设数据集看起来如图
    4.1 所示。


    | 样本编号 | 特征 1 | 特征 2 | 目标 |

    | --- | --- | --- | --- |

    | 1 | 0.50% | 1% | 0.25% |

    | 2 | 1% | 2% | 0.25% |

    | 3 | 2% | -2% | -1.00% |

    | 4 | -0.50% | -1% | -0.25% |

    | 5 | -1% | -2% | -0.25% |


    图 4.1 假设数据集。


    ![自动生成的 Logo 特写](img/00031.jpeg)


    图 4.1 假设数据集。


    ![自动生成的 Logo 特写](img/00031.jpeg)


    图 4.2 F1, F2 特征空间中的样本表示。


    在 F1, F2 特征空间中表示的一种方法如图 4.2 所示，括号中的数字代表样本编号。我们将样本分配到这些矩形区域。例如，样本编号 1 和 2 属于一个矩形区域，其中：


    `0<=F1 <= 1%`


    且 `0<=F2 <= 2%`


    预测值仅仅是分配到该区域的样本目标的平均值。这意味着任何来自测试数据集并被分配到此矩形区域的样本，其预测值都将是 0.25%。


    决策树就是如此简单。


    总结来说，决策树将特征空间划分为矩形区域，结果导致训练数据集中的样本被分配到这些矩形中。当测试样本到达时，根据其特征值 F1 和 F2 将被分配到一个矩形区域。因变量简单地假设等于该特定区域训练数据集样本
    `target` 值的平均值。


    ![](img/00032.jpeg)


    图 4.3 F1, F2 特征空间中的样本表示。


    数据集的树状表示如图 4.3 所示，我们有根、节点、分支和叶子。


    节点是做出决策的地方。连接节点的线是分支。顶部的节点是根。最底部的节点是叶子或终止节点。终止节点就像我们训练数据本质上所在的矩形区域。现在我们来讨论构建这些决策树的内容。


    ## 决策树的构建 - 回归设置


    决策树算法本质上将我们的表格数据作为输入并构建决策树。


    我们期望算法产生两个输出：


    1. 分裂点帮助我们在每个节点做出决策，或定义早期表示中矩形区域的边界。因此，我们的一个节点可以做出如 `x<=2%` 的决策。这个 `2%` 的分裂点将由算法输出。

