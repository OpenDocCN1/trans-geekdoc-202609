    \ various potential pitfalls along the way. For one, we like to focus on data\
    \ sets and trading strategies, which have an economic rationale to exist. We can\
    \ use AI to quantify it or to improve an existing strategy.\n\nSmaller data sets\
    \ that have a much stronger signal and a lower noise content would probably be\
    \ best tackled using traditional statistical tools. The huge benefit of using\
    \ traditional statistical tools is that the models are interpretable, which is\
    \ of immense value in trading.\n\n## Momentum Trading: Buy High, Sell Higher\n\
    \nWhat is the economic rationale for momentum to exist? We believe it is deeply\
    \ rooted in the process of price discovery. Fundamentals and news drive price\
    \ action but we do not know with certainty the price level at which all fundamentals\
    \ and news actions have been correctly and fully priced in. This, coupled with\
    \ asymmetric information and understanding of markets among various investor types,\
    \ has made it one of the best performing factors over several decades and in several\
    \ asset classes.\n\nMomentum is the first derivative of price. As a trading strategy,\
    \ it is most prevalent, even today. The ambiguity lies in defining momentum, identifying\
    \ the period where it is most prevalent, and identifying assets that will most\
    \ likely benefit from it. As an insight, Figure 1.1 shows the astronomical rise\
    \ of palladium futures in 2019 (60% in a matter of a few months). Figure 1.2 plots\
    \ momentum defined as the one-day change in price. Figure 1.2 is much noisier\
    \ than the seemingly linear/exponential price action in Figure 1.1. It is a challenge\
    \ to fish for a signal in this noisy Figure 1.2 data set.\n\n![A close up of a\
    \ map Description automatically generated](images/00002.jpeg)\n\nFigure 1. 1 is\
    \ the futures price of palladium plotted against time.\n\nFigure 1. 2  Momentum,\
    \ which is defined as the day-on-day change in price.\n\nThe question is: what\
    \ would we want to include to define momentum?\n\nHow should we define something\
    \ as abstract as momentum?\n\n### Price momentum\n\nPrice momentum can be defined\
    \ in multiple ways. Who is to say that day-on-day change in price is the best\
    \ way to define momentum? How about a week-on-week, a month-on-month, a year-on-year\
    \ or for that matter any nonstandard period? Alternatively, how about using all\
    \ the aforementioned and trying to fish for a signal in this extremely noisy data\
    \ set? Essentially, we are implying that, since there is no known optimal way\
    \ of defining momentum, we will accept all possible definitions to be legitimate,\
    \ and use AI to learn a somewhat optimal definition.\n\n### Momentum in related\
    \ instruments\n\nPalladium is a relatively small market and its price action is\
    \ also affected by what is happening in gold, or what is happening to risky assets\
    \ (S &P futures, for instance) in general or what is happening to the broad dollar\
    \ index.\n\nIf you have spent some time at the trading desk (trading macro instruments),\
    \ you probably only need to know what your one or two instruments of choice have\
    \ done overnight and that will give you an indication of other instruments’ performance.\n\
    \nTherefore, to try and define momentum for palladium, we may also consider including\
    \ momentum of related instruments, that is, momentum of gold, momentum of the\
    \ broad dollar index, and, momentum of risky instruments (such as equity indices).\
    \ So, if we originally had 100 ways of defining momentum, we now have another\
    \ 300 (3 instruments × 100 definitions per instrument).\n\n### Regime variables\n\
    \nThe point to note is that this relation to other instruments may change with\
    \ time.\n\nOn some occasions, a risk-on move may be associated with dollar weakness,\
    \ which may be supportive of things such as palladium. However, the same risk-on\
    \ environment being driven by a search for high yield/dividend bearing instruments\
    \ may be bad for assets such as gold, which do not provide any yield/dividends.\
    \ In addition, palladium, being a close ally of gold, may actually suffer in performance.\n\
    \nTherefore, we may want to add information about sentiment or information about\
    \ the regime that the market is currently in and this further adds to our data\
    \ set.\n\n### Market microstructure\n\nWe may also consider adding information\
    \ about the market microstructure to our definition of momentum. For example,\
    \ Figure 1.3 gives a snapshot of what the level one order book looks like. Let\
    \ us go through it step by step.\n\n| S. No. || Bid Qty || Bid Price || Ask Qty\
    \ || Ask Price || TradedQty || TradedPrice |\n\n| --- | --- | --- | --- | ---\
    \ | --- | --- |\n\n| 1 || 16 || 6989 || 7 || 6990 || 0 || 6989 |\n\n| 2 || 16\
    \ || 6989 || 7 || 6990 || 5 || 6990 |\n\n| 3 || 16 || 6989 || 2 || 6990 || 0 ||\
    \ 6990 |\n\n| 4 || 16 || 6989 || 2 || 6990 || 2 || 6990 |\n\nFigure 1. 3  A snapshot\
    \ of what the limit order book looks like.\n\nS.No.1: \n\n16 lots at the bid price\
    \ and 7 lots at the offer price in a relatively liquid instrument. Since the bid\
    \ quantity of 16 is greater than the ask quantity of 7, it is possible that the\
