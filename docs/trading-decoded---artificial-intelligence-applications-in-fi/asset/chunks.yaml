- raw: "Before we jump into more details, let us quickly understand what shrinkage\
    \ is. It is a hyper-parameter (i.e. a parameter that needs to be given by the\
    \ user) which also goes by the name of the learning rate. It helps us control\
    \ the amount of learning (reduce overfit) at each stage that we want to incorporate\
    \ into the final model. If the shrinkage is too high, we risk overfitting to the\
    \ training dataset; if it’s too low, we risk underfitting and not learning anything.\
    \ Moving on, the first intuition we need to understand is that this is a stage\
    \ wise additive model. It is additive in the same sense as bagging and random\
    \ forest, where the final model is an aggregation of predictions from N models.\n\
    \nWhere boosting is different from bagging and random forest is that it is a stage\
    \ wise additive model. T2 can be built only after T1, T3 can be built only after\
    \ T2, and so on. In bagging and random forests, T1, T2, and T3 can be built simultaneously\
    \ and are independent of each other. The same cannot be said about boosting. We\
    \ first need to build T1, calculate the errors on the training data, build T2\
    \ to fit these residuals, calculate the errors of T2 on the training data, and\
    \ then build T3 to fit to the errors of T2’s prediction on the training data.\
    \ Accordingly, T1, T2, T3, and so on are dependent on each other and cannot be\
    \ created in a parallel way. They need to be created serially one after the other.\n\
    \nTherefore, unlike most other algorithms where we fit the model on the independent\
    \ variable, here we fit several models. The first is fit on the independent variable\
    \ and the rest are fit on the errors of the previous model. So, let us try to\
    \ understand why we need to build models to fit the errors of the previous model.\n\
    \nThe basic construct of a stagewise additive model is as follows:\n\nFm(X)=Fm−1(X)\
    \ + bm\\*Tm(X,Ym−1) Equation 5.2\n\nFm(X) is the ensemble after mth iteration.\n\
    \nTmis the tree built on the mth iteration.\n\nYm−1 is the error using Tm−1 as\
    \ the predictor for m\\> 1.\n\nYm−1 = Y, for m = 1.\n\nbm is the learning rate\
    \ that controls the amount of learning we want to take forward from each stage.\n\
    \nAll that Equation 5.2 is saying is that a model at any stage m (Fm) is equal\
