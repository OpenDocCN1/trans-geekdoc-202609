    # CHAPTER SIX - BIAS VARIANCE TRADE-OFF


    This is a short chapter, but we would like to dedicate a full chapter to this
    topic simply based on the universal applicability of this concept. By the end
    of this chapter you should be able to understand the bias variance trade-off,
    identify a biased machine, identify a high variance machine, and be able to implement
    the bias variance trade-off in any machine.


    What do you do if your machine is not giving desirable results? We have an entire
    set of options. We could:


    1.  Change features

    2.  Change target

    3.  Change machine

    4.  Change hyper parameters

    5.  Train longer

    6.  Change validation strategy


    We could also use any combination of the points. Each of these and their combinations
    has several sub options that significantly increases the number of things we can
    do to fit our machine. An exhaustive search is practically impossible. Understanding
    the bias variance trade-off gives us a framework wherein our search is more focused.
    Generally speaking, understanding the bias variance trade-off is the first step
    in troubleshooting most machine learning problems.


    ## Bias


    As the name suggests, a biased machine is one that has a biased view of the outcome.
    At an extreme, the outcome does not even change with varying inputs. A machine
    such as the one defined in Equation 6.1 for independent variable `X` taking values
    between `[0,1]` is


    ```

    P(Y = 1 |X) = 0.6 +.00002 * X

    ```

    Equation 6. 1


    Here `X` is the only feature. This is a highly biased machine as the coefficient
    of `X` (`.00002`) is very small and the outcome is almost always very close to
    `0.6`. Some machines are more prone to give biased results than others. For instance,
    there is a greater chance of getting a biased machine using logistic regression
    rather than decision trees. Why does this happen? The simplicity of the feature
    and the lack of an easily discoverable relationship can create a biased machine.
    In the relationship, the probability and `X` may not have a linear relationship
    that the machine is set up to capture. If we create a feature `X^2`, we may find
    the coefficient of `X^2` is larger and thereby the probability value may start
    getting less biased. Some machines may get biased due to heavy regularization.


    ### Detecting a Biased Machine


    The following two guidelines help us identify a biased machine:


    *   The error rate on the training data is high - essentially implying that the
    machine has not been able to learn any information.

    *   The range of probabilities/values predicted by the machine are quite tight.


    ### Reducing Bias of a Machine


    *   Add more nonlinearity in features.

    *   Reduce regularization.

    *   Add a more complex machine.


    ## Variance


    A machine suffering from a high variance problem is one that has learnt the training
    data well but gives very poor prediction on unseen (validation/test) data. As
    an analogy, consider a student who has studied the textbook very well, but finds
    it very difficult to apply those learning’s in solving real-life problems.


    Some algorithms are more prone to overfitting than others. As discussed, decision
    trees divide the feature space into rectangular regions and assign samples to
    each of these regions. If allowed to run long enough, they could divide the feature
    space to a very high level of granularity where there is only one sample per rectangular
    region, essentially creating zero-error on the training data. Very likely this
    machine will do quite poorly on validation data even though the features may only
    be slightly different.


    If we increase the number of features and are not able to provide more samples,
    we may cause overfitting.


    ### Detecting a High Variance Machine


    *   Performance is very good on training data but very poor on unseen data.

    *   Predictions change a lot with a small change in feature values.


    ### How Do We Solve a High Variance Problem?


    *   Feature selection, dimension reduction techniques, and regularization.

    *   Reducing the run time.

    *   Reducing the complexity of the machine.


    For illustrative purposes we present some simulations on training the `XGBOOST`
    algorithm on a sample dataset. This sample data set was a binary classification
    problem where 46% of the samples belonged to class 1 and 54% of the samples belonged
    to class 0. We are interested in predicting samples that belong to class1. The
    idea here is to give a bit more of an insight into the bias variance trade-off.


    We focus on three parameters of the `XGBOOST` algorithm namely `learning rate`
    (`lr`), `number of trees` (`n_est`) and `max_depth`. As the value of each of these
    parameters increases, the training error should reduce. For the set of values
    shown in figure 6.1, we have a high variance machine. Training accuracy of 70.4%
    is much higher than the validation accuracy of 46.6%.


    ![](images/00052.jpeg)


    Figure 6. 1 High Variance machine


    To reduce this high variance, we try reducing the `n_est` and as shown in Figure
    6.2. The overfit as measured by the difference between train loss/accuracy and
    validation loss/accuracy, has reduced. We also got a marginal improvement in the
    validation accuracy


    ![A screenshot of a cell phone Description automatically generated](images/00053.jpeg)


    Figure 6. 2


    We try and reduce the overfit further by reducing the `max depth` to 2 as shown
    in Figure 6.3 It is also followed by a marginal increase in validation accuracy


    ![](images/00054.jpeg)


    Figure 6. 3


    We then move the learning rate lower to .01 and further reduce the overfit as
    shown in Figure 6.4


    ![A screenshot of a cell phone Description automatically generated](images/00055.jpeg)


    Figure 6. 4

