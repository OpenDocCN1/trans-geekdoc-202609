    因此，如果 `f` 假设的形状如图 10.8 所示（虚线代表滤波器的离散性），并且我们将其与图 1 中的时间序列 `P` 进行卷积，那么卷积操作将在波形 1
    和波形 3 附近的某处产生高值，这就是时间序列 `P` 与滤波器 `f` 之间相似度最高的地方。因此，卷积操作有助于我们找到时间序列 `P` 中何出现了滤波器
    `f` 的形状。


    ![](img/00127.jpeg)


    图 10. 8 一个假设的离散滤波器。


    到目前为止，我们已经理解了卷积的含义以及它的作用。神经网络在这一切中处于什么位置呢？


    神经网络帮助我们找到这个滤波器 `f`。换句话说，时间序列中哪些形状是必须出现以满足目标的，即哪些形状导致了抛售。


    神经网络本质上需要找到该滤波器的形状/数值和长度，使得市场发生抛售。反向传播算法将用于训练和调整滤波器的数值，以确保发生抛售。从这个意义上说，卷积神经网络帮助我们在时间序列中找到符合我们目标的模式，而这些目标是由目标定义的，即市场抛售。这有助于特征抽象。


    无论滤波器值是多少，都是应用于整个时间序列的同一组值，以找到某种模式。只要时间序列中任何地方出现相同的模式，滤波器就能识别它。滤波器的值不需要改变即可实现寻找模式的目标。这种属性被称为平移不变性（translation
    invariance）。希望我们已经解释了如何使用 CNN 来寻找符合目标函数的特征。在接下来的几个章节中，我们将讨论 CNN 架构的更多重要元素。


    ## 填充（Padding）


    在目前的形式下，向量边缘的价格点似乎没有中间的价格点重要。


    ![](img/00128.jpeg)


    图 10. 9 与滤波器卷积的时间序列


    在图 10.9 中，卷积过程中，`P1` 和 `P5` 只被使用了一次；分别对应滤波器值 `f1` 和 `f2`。相比之下，`P2`、`P3` 和 `P4`
    与滤波器使用了两次。此外，每当我们对长度为 `n` 的时间序列与长度为 `f` 的滤波器进行卷积时，得到的时间序列长度为 `n-f+1 <n`。随着架构的加深，这可能会负面影响学习能力。我们可以选择在时间序列两侧填充
    `2p` 个零，每侧 `p` 个，如图 10.10。现在时间序列的长度变为 `n+2p`，当与滤波器 `f` 卷积时，产生长度为 `n+2p-f+1` 的时间序列。


    ![](img/00129.jpeg)


    图 10. 10 填充时间序列


    如果我们希望保持时间序列长度不变，则 `n+2p-f+1=n`


    `P = (f - 1)/2`


    这被称为“相同卷积”（same convolution）。


    如果 `P=0`，则被称为“有效卷积”（valid convolution）。


    ## 步长（Strides）


    当我们执行每次点积操作后沿向量移动滤波器时，我们是以 1 步为单位移动的。步长实际上被假设为 1。但这并不总是如此。假设我们有一个给定的向量 `u`：


    ![](img/00116.jpeg)


    以及给定的滤波器 `f`：


    ![](img/00130.jpeg)


    步长为 `2` 的卷积操作由图 10.11 所示的步骤组成：


    ![](img/00131.gif)


    图 10. 11 步长为 2 的卷积操作


    实际上，


    ![](img/00132.jpeg)


    泛而言之，当我们将一个 `n` 维向量与 `f` 维滤波器进行卷积并使用步长 `s` 时，我们得到大小为 `[(n+2p-f)/s +1]` 的输出。


    `1 × n © 1 × f = 1 × [(n + 2p - f)/s + 1]`


    为什么我们要对交易时间序列添加步长呢？一种思考是，我们正在跨时间框架寻找机会。感兴趣的模式并不一定需要出现在最细粒的时间步上——它在更高的时间步上可能更可见。相同的步长允许月线、日线和日内框架的使用。


    ## 多滤波器（Multiple Filters）


    到目前为止，我们一直在使用一个滤波器。然而，我们可以根据需要添加许多滤波器。


    ## 多通道作为输入（Multiple Channels as Input）


    多维输入也被称为多通道。同一时间序列的不同表示形式可以放入这些不同的通道中。

