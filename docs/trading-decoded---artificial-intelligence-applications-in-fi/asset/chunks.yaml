    \ >0`，目标类别 0 意味着 `return < 0`。\n\n![](img/00035.gif)\n\n图 4. 5 分类设置的假设数据集。\n\n\
    对于由 `F1<=2%` 定义的区域，大多数样本属于类别 0。因此，错误率为 40%。\n\n- `P0`：区域内目标为 0 的样本比例 (60%)。\n\
    - `P1`：区域内目标为 1 的样本比例 (40%)。\n\n```\nClassification error rate\\= 1–max(P0, P1)\n\
    Cross entropy\\= −P0log(P0) –P1log(P1)\nGini index\\= P0(1−P1)\n```\n\n"
