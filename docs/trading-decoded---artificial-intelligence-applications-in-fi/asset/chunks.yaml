    Figure 7. 3 Price of the generic first contract.


    If we download the data from Bloomberg, for instance, the price of the generic
    first month contract would look like Figure 7.2a. Let us look at it another way.
    Our aim is to create a continuous contract. We do not want the hassle of the roll.
    We simply adjust the `Nov` contract by the `100/102 = 98.039%`. Therefore, what
    was $102 becomes $100 (Figure 7.2b). In addition, when `Nov` rallied 1% to $103.02,
    our modified `Nov` rallies to `103.02*.98039 = $101`.The benefit is obvious; we
    do not need to bother about the roll in our simulations.


    We started with the commodity trading at $100, we parked $1000 of capital at $100
    and when the modified `Nov` contract moved to $101, we liquidated our position.


    ## Assets Under Consideration


    Below is the list of commodity futures we would like to trade. As discussed earlier,
    we pre-process all the prices to account for rolls:


    1. Corn (C 1)

    2. Soybeans (S 1)

    3. Copper (HG1)

    4. Crude oil (CL1)

    5. Bean oil (BO1)

    6. Soybean meal (SM1)

    7. Platinum (PL1)

    8. Palladium (PA1)

    9. Heating oil (HO1)

    10. IPE gasoil (QS1)

    11. Wheat (W1)


    ## Data


    We have used data from January 2000 to July 2019.


    ## Features


    Let us define a few variables. At this point, a snapshot of our data is shown
    in Figure 7.3, where each column contains the roll-adjusted asset price. `W1`,
    for instance, is the first active roll-adjusted contract for wheat futures, `W2`
    in the second active roll-adjusted wheat contract, and so on.


    ![A screenshot of a cell phone Description automatically generated](images/00060.jpeg)


    Figure 7. 4 Data set.


    Ret: Log return of prices.


    Carry: `(rfunding – rcommodity)`


    Based on the formula in Equation 3


    ```

    F = S0*(1+ (rfunding – rcommodity) *T/365)

    ```

    Equation 3


    We calculate `(rfunding – rcommodity)` simply by inverting the equation, which
    gives us


    ```

    (rfunding – rcommodity) = (F/S0 – 1) *365/T

    ```

    Equation 4


    Which, in the case for wheat, turns out to be

    ```

    (rfunding – rcommodity) = (W2/W1 – 1) *365/T

    ```

    We call `(rfunding – rcommodity)` to be `carry`. The higher the `rcommodity`,
    the lower the `carry`, the higher the demand for that commodity.


    standard deviation: We also calculate 20-day standard deviation of the returns,
    `σret`.


    carry vol ratio: We define `carry-vol ratio = carry/σret`. As features, we give
    `carry-vol` calculated for the previous weeks as an input.


    ## Target


    We treat this as a classification problem, and therefore there are several ways
    we define the target. For simplicity, we define it as the following:


    Target is:

    1 if next day return > 0

    -1 if next day return < 0

    0 if next day return = 0


    Note that we have defined the target for day 1 to be dependent on day 2’s return.
    Day 2’s return, however, is `log (price on day 2/price on day 1)`. Admittedly,
    there is some error introduced in doing it way; it assumes we can trade on the
    close of day 1, which is not entirely true the model requires the close as an
    input to calculate the feature and it will take some time to run and calculate
    the signal. To avoid this, define the returns as `log (close on day 1/open on
    day1)`, which implies we are expected to trade at the open of the next day.


    ## Train/Validation/Test Data Sets


    We train the model on 500 days of data; we test it on 50 days.


