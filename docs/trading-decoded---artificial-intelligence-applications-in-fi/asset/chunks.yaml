    These strategies have attracted a fair bit of capital over the last several years
    driven by low benchmark rates and investors’ desire to earn a higher yield. The
    strategies have done quite well too; however, that is not to suggest that the
    future performance is also expected to be as good.


    ## Drivers of carry


    Let us look at the risks and profile of one of these strategies. It will give
    us some insights into what we can do to enhance the performance of these strategies.
    We will analyze a short position in `VX-Cboe Volatility Index (VIX)` futures,
    which for the most part has been in a contango (upward sloping futures curve).


    We will begin by clearly defining two types of returns that futures trading exposes
    us to:


    * Spot return

    * Roll return


    It is best understood through a toy example.


    ## Hypothetical market setup


    Let us say we have a hypothetical commodity contract trading on a particular exchange
    with monthly listings and priced at $100 for the nearby active contract. Let us
    also assume the volatility of this contract is zero on all days, essentially implying
    the price does not change with time. On the expiry of a particular month, however,
    the next month always starts trading $2 higher. Figure 1.4 shows what the 3-month
    price history would look like.


    ![](images/00003.jpeg)


    Figure 1. 4 Plot showing price history of our toy example, which starts trading
    at $100, and stays there for all of March, jumps to $102 in April and stays there
    for all of April, and finally jumps to $104 in May.


    ### Trade 1


    On March 1, 2019, we took a long position in one lot of the hypothetical contract,
    which was trading at $100. The price remained $100 until expiry on March 31, 2019,
    which is when we sold it.


    ### Trade 2


    On April 1, 2019, we took a long position in one lot of the hypothetical contract,
    which was trading at $102. This contract remained at $102 for a month until expiry
    on April 30, 2019, when we sold it.


    ### Trade 3


    Finally, we went long on one lot of the contract on May 1, 2019 at $104, which
    we closed on May 31, 2019 at $104.


    Now, what is our PnL (Profit and Loss) on all these trades?


    When the commodity increased from $100 to $104, we made $4 in “spot returns”.
    We bought the contract on March 1, 2019 at $100 and sold it for $104 on May 31,
    2019, which is the spot return of $4. However, we did a few more trades.


    On March 31, 2019, we sold the March contract for $100 and on April 1, 2019, we
    bought the commodity for $102.


    On April 30, 2019, we sold the April contract for $102 and on May 1, 2019, we
    bought the May contract for $104, incurring another loss of $2.


    The total loss on these inter-period trades is $4, which we call the “roll return,”
    which exactly offsets what we made as “spot return.” The total PnL on this trade
    is zero.


    To be clear, we are incorrectly calling the change in price as return, but we
    will just move on. Finally, to summarize this hypothetical example, we could redraw
    Figure 1.4 as Figure 1.5, where we have adjusted the price at each stage by cumulative
    roll until that point.


    ### TIP ADDITIONAL MATERIAL


    Backwardation: A futures curve is backwardated when the deferred contract is trading
    at a discount to the spot contract.


    Contango: A futures curve is in contango when the deferred contract is trading
    at a premium to the spot contract.


    The roll return is positive for a long position in backward markets. The roll
    return is negative for a short position in contango markets.


    ![](images/00004.gif)

    Figure 1. 5 Alternate representation of the futures contract. Now, let us move
    back to the real world. Figure 1.6 shows what the cumulative “spot return” is
    for a long position in the front month VIX.


    ![](images/00005.jpeg)

    Figure 1. 6 Cumulative spot return for long month VIX futures.


    ![](images/00006.jpeg)

    Figure 1. 7 Cumulative roll return for long position in VIX futures.


    ![](images/00007.gif)

    Figure 1. 8 Cumulative spot and roll returns for long position in VIX futures.


    ![](images/00008.jpeg)

    Figure 1. 9 Cumulative spot and roll return for short position in VIX futures.


    A few things to take away from this analysis are:


    1. Roll return is a significant driver of performance.

    2. During periods of exceptional volatility (2008 great recession and 2011 European
    debt crisis), spot returns tend to dominate and pull down the performance.

    3. Roll return changes direction during periods of stress.


    We now have clues on what our machine needs to do. We can stay short the VIX front
    month futures and rely on our machine to give us a signal to cover our short.
    The machine needs to focus on:


    1. When the roll return is about to change direction.

    2. When the spot returns are about to explode.


    Hence, a good start could be:


    1. To provide historical roll returns as an input to be able to predict when the
    roll returns may change direction.

    2. To provide inputs about an impending slowdown, a debt crisis, or a war that
    may be able to predict when spot returns are about to explode.


    ## Summary


    AI provides a set of very powerful tools for quantifying our thoughts. In trading,
    AI can be used to quantify our trading ideas and for improving quant strategies.
    In this chapter, we discussed what inputs can go into a machine trying to trade
    momentum. We also established a hypothesis that positive carry instruments tend
    to appreciate over time but are subjected to drawdowns. The analysis gave us hints
    on how we can improve the performance of a carry portfolio.


    ## References


    * John C hull Options, Futures, and Other Derivatives, for basic definitions of
    futures and options.

    * Lepiere, Yves & Deremble, Cyril & Seager, Philip & Potters, Marc & Bouchaud,
    Jean-Philippe (2014). Two centuries of trend following. The Journal of Investment
    Strategies. 3. 10.21314/JOIS.2014.043.

    * Baz, Jamil and Granger, Nicolas and Harvey, Campbell R. and Le Roux, Nicolas
    and Rattray, Sandy, Dissecting Investment Strategies in the Cross Section and
    Time Series (December 4, 2015). Available at SSRN: https://ssrn.com/abstract=2695101
    or http://dx.doi.org/10.2139/ssn.2695101

    * Jusselin, Paul and Lezmi, Edmond and Malongo, Hassan and Masselin, Côme and
