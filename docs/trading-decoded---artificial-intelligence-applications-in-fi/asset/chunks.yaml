    \ therefore helps us find where in the time series P does the shape of filter\
    \ f occur.\n\n![](images/00127.jpeg)\n\nFigure 10. 8 A hypothetical discrete filter.\n\
    \nSo far, we have understood what convolution means and what it does. Where do\
    \ neural networks fit into all this?\n\nThe neural network helps us find this\
    \ filter f. In other words, which shapes in this time series are necessary to\
    \ occur to meet the objective, that is, which cause the selloff.\n\nThe neural\
    \ network will essentially need to find the shape/values and length of this filter\
    \ such that the market sells off. The back-propagation algorithm will be used\
    \ to train and adjust the values of the filter such that the market sells off.\
    \ In that sense, the convolutional neural network helps us find patterns that\
    \ occur in the time series that meet our objective, which as defined by the target\
    \ is for the market to sell off. This helps in feature abstraction.\n\nWhatever\
    \ the filter values are, it is the same set of values that are applied across\
    \ the entire time series, to find a pattern. Wherever the same pattern occurs\
    \ in the timeseries, the filter can identify it.  The value of the filter doesn’t\
    \ need to change to achieve the objective of finding the pattern. This property\
    \ is known as translation invariance. Hopefully, we have been able to explain\
    \ how CNN can be used to find features that meet the target function. In the next\
    \ few sections we will discuss a few more important elements of the CNN architecture.\n\
    \n## Padding\n\nIn its current form, the price points at the edges of the vector\
    \ seem to be given less importance than the price points in the middle.\n\n![](images/00128.jpeg)\n\
    \nFigure 10. 9 Time series convolved with a filter\n\nIn Figure 10.9 during convolution,\
