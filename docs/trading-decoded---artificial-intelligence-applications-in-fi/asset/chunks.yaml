    ## LSTM


    The concept behind the LSTM is very similar, it just has more gates. For one,
    the LSTM differentiates between the `At` and `C(t)`.


    It defines the output gate that bridges the gap between `At`and `C(t)`.


    `GO = Sigmoid (WO\[C(t−1), X(t−1)\] + bO)`

