  trans: '

    在我们进入更多细节之前，让我们快速了解一下什么是收缩（shrinkage）。它是一个超参数（即需要由用户提供的参数），也被称为学习率。它帮助我们控制在每个阶段我们想要整合到最终模型中的学习量（以减少过拟合）。如果收缩过高，我们可能会面临对训练数据集过拟合的风险；如果收缩过低，我们可能会面临欠拟合的风险且无法学到任何东西。接下来，我们需要理解的第一个直觉是，这是一个阶段性的加法模型（stage
    wise additive model）。它的加法方式与袋法（bagging）和随机森林相同，即最终模型是 N 个模型预测结果的聚合。


    提升（boosting）与袋法和随机森林的区别在于，它是一个阶段性的加法模型。`T2` 只有在 `T1` 之后才能构建，`T3` 只有在 `T2` 之后才能构建，依此类推。在袋法和随机森林中，`T1`、`T2`
    和 `T3` 可以同时构建且彼此独立。提升法则不能。我们首先需要构建 `T1`，计算训练数据上的误差，构建 `T2` 来拟合这些残差，计算 `T2` 在训练数据上的误差，然后构建
    `T3` 来拟合 `T2` 在训练数据上的预测误差。因此，`T1`、`T2`、`T3` 等是相互依赖的，不能并行创建。它们需要一个接地串行创建。


    因此，与大多数大多数在自变量上拟合模型的算法不同，在这里我们拟合了多个模型。第一个模型基于自变量拟合，其余的基于上一个模型的误差拟合。所以，让我们尝试理解为什么我们需要构建模型来拟合上一个模型的误差。


    阶段性加法模型的基本结构如下：


    `Fm(X)=Fm−1(X) + bm*Tm(X,Ym−1)` 方程 5.2


    `Fm(X)` 是第 `m` 次迭代后的集成模型。


    `Tm` 是第 `m` 次迭代构建的树。


    当 `m> 1` 时，`Ym−1` 是使用 `Tm−1` 作为预测器的误差。


    当 `m = 1` 时，`Ym−1 = Y`。


    `bm` 是学习率，控制我们想要从每个阶段向前推进的学习量。


    方程 5.2 表达的意思是，任何阶段 `m` 的模型（`Fm`）都等于上一个阶段 `m` 的模型（`Fm−1`）和一个新模型 `Tm`。


    ### 为什么要对上一阶段的残差拟合模型？


    现在我们的损失函数是一个简单的 MSE（均方误差）：


    ![](img/00040.jpeg)


    使用方程 5.2，我们将损失函数修改为


    ![](img/00041.jpeg)(y,Fm-1(X) + bm*Tm(X,Ym−1) )`![](img/00042.jpeg)(y-Fm−1(X)-
    bm*Tm(X,Ym−1))2 = (rm - bm*Tm(X,Ym−1))²`


    因此，第 `m` 阶段的树必须被构建以拟合上一阶段的残差 `r`。


    在查看实际实现之前，让我们快速了解树中的正则化。


    ### 正则化


    正则化是减少高方差问题的方法。该目标通过修改损失函数来实现。因此，我们不是简单地最小化损失函数 `L`，而是最小化损失函数 `L + gamma*|T|`，其中
    `|T|` 代表叶子数量。树的复杂度与 `|T|` 直接正比。`gamma` 是需要用户提供的参数。如果 `gamma` 为零，则 `gamma * T =
    0`，这实际上意味着我们保留了原始损失函数，因此并不打算减少高方差问题。当我们增加 `gamma` 的值到无穷大时，防止损失项爆炸的唯一方法是减少 `T`
    的值，这实际上意味着我们正在降低树的复杂度。因此，通过改变上述方程中的 `gamma`，我们能够控制树的复杂度，从而影响偏和方差。


    ### XGBOOST 包


    XGBOOST 包的损失函数包含两个部分：


    1. ![一张包含时钟、表表的自动生成的图片](img/00043.jpeg)


    这与我们在方程 5.2 中讨论的相同，并在所有样本上进行计算。


    2. 正则化部分表示为


    ![](img/00044.jpeg)j2


    `![](img/00045.jpeg)T` 之前在讨论代价复杂度剪枝的方程 5.1 中引入，具有相同的含义。`T` 是树中的终端节点数量。第二项是 L2
    正则化项，其中 `w` 是每棵树每个叶子的权重或得分。如果 `![](img/00046.jpeg)` 很大，那么 `w` 就需要很小，即叶子中的得分（例如准确率、AUC
    等）需要很小，这意味着我们减少了过拟合。如果 `![](img/00046.jpeg)` 很小，我们可以允许更高的准确率，从而允许在训练数据上进行更好的拟合。每棵树都受到这种正则化的影响，因此这部分在我们加法构建的所有树上进行求和。


    使用的最终损失函数如下：


    ![时钟的特写自动生成的图片](img/00047.jpeg)


    其中 `i` 是所有样本的求和，`k` 是所有树的求和。


    XGBOOST 中其他重要参数如下：


    1. `Eta`：我们之前讨论的收缩就是学习率

    2. `Gamma`：所需的最小损失减少

    3. `Lambda`：权重上的 L2 正则化

    4. `Alpha`：权重上的 L1 正则化

    5. `Maximum depth`：最大深度

    6. `Minimum child weight`：最小子权重

    7. 样本树、层、节点（参考 XGBoost 文档获取详细描述）


    ### 应用


    现在我们学习了决策树集成的直觉后，让我们考虑一个简单的例子。我们在第 2 章中提到过。均值编码是一种非常有用的工具，有时对数值特征进行处理是有益的。在对数值特征进行均值编码之前，我们需要对其进行分箱或将其类别化。对于本例，我们的数据集的前
    10 行所示（图 5.4），其中每一列本质上都是 CME 期货的收益。例如，`GC_ret` 是黄金期货的收益（这里为了提高分辨率乘以 1000）。


    ![](img/00048.jpeg)


    图 5.4 CME 交易品种的收益（黄金 GC、原油 CL、铜 HG、铂 PL、标普 500 指数 ES、欧元 6E、英镑 6B、日元 6J、纳斯达克 NQ）。


    这是我们的自变量矩阵或特征。我们想利用这些信息预测标普 500 指数在 10 个 tick 后会发生什么。我们有三种情况：上涨、下跌或持平，分别编码为 2、1
    和 0。图 5.5 显示数据集的快照。


    ![](img/00049.jpeg)


    图 5.5 分类问题的目标。


    现在我们定义随机森林分类器并对其进行拟合，如下：


    ```

    ![](img/00050.jpeg)

    ```


    在这里我们构建了 10 棵树的集成。下一行有助于获取每棵树中样本 X 所在的叶子索引：


    ```

    ![](img/00051.jpeg)

    ```

