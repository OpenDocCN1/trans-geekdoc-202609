    我们已经详细讨论了如何创建验证数据集以及我们需要避免哪些陷阱。接下来我们讨论用于衡量性能的各种指标。


    ## 回归指标


    我们在第 1 章中讨论了可以作为动量模型输入输入的各种因素。基于这些输入，我们可能感兴趣的是预测明天、下周或下个月的收益率。本质上，我们感兴趣的是预测一个数值结果。以下是用于评估回归机器性能的指标。


    ### 均方误差 (MSE)


    ![](img/00020.jpeg)


    `MSE` 是所有样本实际值与预测值之间差的平方和。


    其中 `N` 是样本总数，`yi` 是第 `ith` 个样本的目标，![](img/00021.jpeg) 是第 `ith` 个样本的预测值。以下有助于我们理解该指标用法的一些观察结果：


    计算 `MSE` 需要对预测误差进行平方，因此 `MSE` 往往更容易受到预测值与实际值差异显著的样本的影响。对于我们的问题，我们真的需要那样吗？


    那么，良好的 `MSE` 值是多少？这里有几条指南：


    * 将每个预测值替换为所有目标的平均值并计算 `MSE`；我们的机器的 `MSE` 应该低于此值。

    * 在尝试预测明天的收益率时，可以使用今天的实际收益率作为代理并计算一个基准 `MSE` 值。我们最终部署的机器其 `MSE` 值应该低于这个基准。通过这样做，我们实际上是确保了今天的价格不是明天价格的最优预测器。

    * 将预测值替换为前几天的平均实际值并计算一个基准 `MSE` 值。同样，我们希望机器的 `MSE` 低于这个基准。


    ### 平均绝对误差 (MAE)


    平均绝对误差 (`MAE`) 定义为样本实际值与预测值之间差的绝对值。给出的公式为：


    ![](img/00022.jpeg)


    其中 `n` 是样本总数，`yi` 是第 `ith` 个样本的目标，![](img/00021.jpeg)`y_cap` 是第 `ith` 个样本的预测值。


    在回归设置中，如果我们不希望过度强调较大的误差项，则使用 `MAE`。


    1. 由于我们没有像计算 `MSE` 那样对预测误差进行平方，`MAE` 计算不会对较大的误差施加更多压力。

    2. 良好的 `MAE` 值是多少？


    1. 将每个预测值替换为所有实际值的中位数并计算 `MAE`；我们的机器的 `MAE` 应该低于此值。

    2. 在尝试预测明天的收益率时，可以使用今天的实际收益率作为代理并计算一个基准 `MAE` 值。我们最终部署的机器其 `MAE` 值应该低于这个基准。通过这样做，我们实际上是确保了今天的价格不是明天价格的最优预测器。

    3. 将预测值替换为前几天的平均实际值并计算一个基准 `MSE` 值（注：原文此处为 MSE，根据上下文应为 MAE）。


    ### MSPE/MAPE


    这些只是通过因变量实际值标准化的 `MSE` 和 `MAE`。


    ![](img/00023.jpeg)


    ![](img/00024.jpeg)


    最好是在我们尝试同时预测多种资产收益率的情况下使用它。为了举例，假设我们正试图通过同一台机器预测 E-mini S&P 500 期货、国债期货和原油期货的下一个跳动。E-mini
    S&P 500 期货的跳动幅度为 25 分，国债期货为 0.015625 分，原油为 1 分。在这种情况下，使用标准化的误差衡量是有意义的。`MSPEs`/`MAPEs`
    是推荐的指标。


    ## 分类指标


    基于我们在第 1 章中说过的动量设置；我们可能感兴趣的是预测钯价格明天预计是上涨还是下跌。如果预计上涨，我们为这些样本分配类别标签 1。同样，如果预计下跌，我们为它们分配类别标签
    0。分类机器将帮助我们对这些情况设定概率。


    分类算法的输出是条件概率。对于标记为 1 和 0 的二分类问题，输出为：


    `P(Y=1 | Feature set)`：在给定特征的情况下 Y 等于 1 的概率。


    `P(Y=0 | Feature set)`：在给定特征的情况下 Y=0 的概率。


    一旦有了概率测量，我们需要假设一个阈值，即高于该概率值的样本分配到类别 1，低于该值的分配到类别 0。


    也就是说，如果：


    `P(Y = 1 | Feature set) > Threshold` 意味着类别 1，或者


    `P(Y = 0 | Feature set) > threshold` 意味着类别 0


    以下是最适合分类问题的指标列表。在此之前，我们需要理解混淆矩阵。


    ### 混淆矩阵


    混淆矩阵是一个包含四个象限的表格，有助于我们分析（二）分类机器的性能。在标记为 1 和 0 的二分类问题中，我们输入每个象限的样本数量。每个象限包含满足实际类别和预测类别条件的样本，例如，后文中第二个象限将包含所有预测属于类别
    1 但实际属于类别 0 的样本。


