  trans: '


    ![](img/00001.jpeg)


    献给我们的父母，


    Rajesh Kakkar 少将（博士，荣卓越服务勋章）


    以及 Shipra Kakkar 女士


    &


    Manjit Singh Sahni 先生和 Gurprit Kaur 博士


    以及我们美丽的女儿 Antara，希望她长大后


    能发现我们研究中的错误。


    ¬ Avirath 和 Arvin


    献给我的母亲 Anandhi


    ¬ Raja


    版权 © 2020


    版权所有所有


    未经出版者书面许可，不得以任何形式或通过任何手段复制或发本书的任何部分。


    # 致谢


    特别感谢 EIS global 董事兼首席官 Ajay Agarwal 先生，没有他在智力、财务和技术方面的帮助，这项研究将无法实现，价值也只有现在的一半。Ajay
    和他的兄弟 Vivek 在 17 岁时创立了 EIS，并在过去的二十多年里成功进行市场交易并取得了巨大成就。我们将在前言再次见到他。


    非常感谢 A stars Advisors 董事 Simon Sywak，他对手稿进行了极其详尽的校对，并提供了极具价值的反馈。Simon 在股票、外汇和商品市场拥有超过
    25 年的经验。他最近领导了摩根大利的亚洲电子交易工作。


    非常感谢 Amitesh Sinha，他一直是我们的支持支柱，并在过程中我们提供了巨大的指导，并随时准备讨论交易策略。他曾任澳银行外汇奇异期权业务全球主管。


    非常感谢 Brandon Liu，摩根士丹亚洲和美国美信美林银行的 eFX 量化交易员，他对书的各个技术方面提供了宝贵的反馈。


    最后，我们要感谢我们亲爱的朋友 Michael Annerl，他在整个职业生涯中一直是我们巨大的支持支柱。他从高盛亚洲商品结构化部门主管退休。如既往一样，他慷慨地分享了他对这本书的读后。


    # 前言


    我很荣幸也很兴奋为《交易解码：人工智能在金融领域的应用》一书写前言。在会议上的初次见面，Avirath 就给我留下了深刻印象。从那时起，在每一次合作互动中，他总是用自己的才智和知识不断超出我的预期。作者团队在各个领域拥有广泛的知识，从高级工程、技术、数学、统计及其在金融领域的应用（无论是期权、商品交易，还是将先进机器学习技术应用于金融领域）。


    读者将获得作者团队多年来在不同银行、对冲基金和技术公司从事交易和 AI 算法的不同角色和领域中积累的丰富经验和知识。我们特意简化了复杂的数学、科学和金融概念，以便读者更容易吸收。这本书将帮助读者开发与定量金融相关的概念，并为他们探索新的思路。这本书对于所有读者来说都将真正的宝藏，他们将在未来几年里反复翻阅。


    祝愿他们好运


    Ajay Agarwal


    董事


    EIS Global Pte Ltd


    # 作者简介


    Avirath Kakkar 在过去的 13 年里在金融行业担任过交易员、结构化师、策略师、企业家和创始人等多种职务。他加入新加坡摩根大利的结构化商品团队，负责为资产端和负债端的客户结构化、定价并执行奇异期权和其他衍生品交易。随后，他在标准银行亚洲地区负责贵金属期权交易和市场做市。Avirath
    加入了 Balyny 资产管理（香港），在那里他跨外汇和股票领域执行策略。Avirath 随后创立了自己的事业。他目前是在线学院的兼职教师，教授机器学习。


    Arvin Sahni 在数据科学和软件工程领域拥有共 13 年的工作经验。他从 Oracle 开始职业生涯。在完成 MBA 后，他加入了花银行新加坡的商品团队。鉴于目前优秀的职业发展，Arvin
    读了加州大学伯克利分校的数据科学硕士学位。他还拥有印度管理学院加尔各答（印度）的 MBA 学位和特里奇里国立理工学院（印度）的计算机科学工程学士学位。


    Rajalingamani 目前在伦敦的一家科技公司工作。在此之前，他在新加坡 SAP 担任高级机器学习主管。他拥有印度理工学院——马德拉斯分校的硕士学位。他编写了
    6 本书，并在同行评审的期刊和会议上发表了关于机器学习专利的文章。在空余时间，他指导学生编程和机器学习。


    # 证言


    “为了深入了解机器学习和人工智能在金融资产建模中的应用，这本书是必读之作。它既针对对这些技术知识有限的金融专家，也针对想要更多了解金融市场运作以及如何将 AI
    应用于金融资产建模的科技型人士。在整书中，作者提供了极佳的案例，说明了如何应用这些技术来预测未来。Avirath 在提醒读者避免过度拟合 AI 模型等陷阱，以及如何正确衡量模型性能方面做得非常出色。我向每一位想要开始开发
    ML 和 AI 模型并将其应用于金融资产的人强烈推荐这本书。”


    Jerome Cohen


    Viseroij Capital 管理合伙人


    前全球复杂外汇产品主管


    《交易解码》在多个方面都是必读之作。首先，对于交易员来说——他们的市场知识从初学者到专家不等，且对 ML 和 AI 技术理解有限——这本书清楚地解释了如何应用这些技术来改进他们现模型，并开发新的见解和交易模型，否则由于变量的海量排列和组合导致的巨大时间限制，这些模型是无法学习、测试和部署的。此外，《交易解码》通过提供每种
    ML 和 AI 技术的陷阱列表优化了学习曲线，为读者在决定采用哪些技术时节省了大量宝的时间精力。书中使用的真实案例也让读者能够更好地理解所使用的技术以及如何实现它们。其次，《交易解码》是为对
    AI 和 ML 有深入理解但对交易和金融市场了解较少的人写的。在阅读《交易解码》后，这第二类读者应该能够将 ML 和 AI 应用于构建交易系统、模拟金融时间序列，并在金融时间序列之间发现重要的、有时是隐藏的关系。”


