  trans: '

    在过去的几年里，受低基准利率和投资者对高收益追求的推动，这些策略吸引了大量的资金。这些策略的表现也相当出色；然而，这并不意味着未来的表现预期也会同样良好。


    ## 载利收益（Carry）的驱动因素


    让我们来看看其中一种策略的风险和特征。这将为我们如何增强这些策略的性能提供一些见解。我们将分析 `VX-Cboe 波动率指数 (VIX)` 期货的空头寸，该合约大部分时间处于升水状态（向上倾斜的期货曲线）。


    我们将从明确定义期货交易让我们面临的两种收益开始：


    * 现货收益（Spot return）

    * 展期收益（Roll return）


    通过一个简单的示例可以最好地理解。


    ## 假设的市场设定


    假设我们有一个在特定交易所交易的假设商品合约，该合约每月上市，近月合约的价格为 100 美元。我们还假设该合约在所有日的波动率均为零，这基本上意味着价格不随时间变化。然而，在特定月份结束时，下个月的交易价格总是高出
    2 美元开始。图 1.4 显示了 3 个月的价格历史情况。


    ![](img/00003.jpeg)


    图 1.4 显示了我们简单示例的价格历史图表，它从 100 美元开始交易，在整个 3 月保持不变，在 4 月跳到 102 美元并在整个 4 月保持，最后在
    5 月跳到 104 美元。


    ### 交易 1


    2019 年 3 月 1 日，我们买入了一手假设合约的多头，当时交易价格为 100 美元。价格保持在 100 美元，直到 2019 年 3 月 31 日到期，我们将其卖出。


    ### 交易 2


    2019 年 4 月 1 日，我们买入了一手假设合约的多头，当时交易价格为 102 美元。该合约在一个月内保持在 102 美元，直到 2019 年 4 月
    30 日到期，我们将其卖出。


    ### 交易 3


    最后，我们在 2019 年 5 月 1 日以 104 美元买入了一手合约的多头，并在 2019 年 5 月 31 日以 104 美元平仓。


    现在，我们所有交易的盈亏（PnL）是多少？


    当商品价格从 100 美元上涨到 104 美元时，我们获得了 4 美元的“现货收益”。我们在 2019 年 3 月 1 日以 100 美元买入合约，并在 2019
    年 5 月 31 日以 104 美元卖出，这就是 4 美元的现货收益。然而，我们又多进行了几次交易。


    2019 年 3 月 31 日，我们以 100 美元卖出 3 月合约，并在 2019 年 4 月 1 日以 102 美元买入商品。


    2019 年 4 月 30 日，我们以 102 美元卖出 4 月合约，并在 2019 年 5 月 1 日以 104 美元买入 5 月合约，产生了另外 2 美元的损失。


    这些跨期交易的总亏损为 4 美元，我们称之为“展期收益”，它恰好抵消了我们在“现货收益”中获得的收益。这笔交易的总盈亏为零。


    为了清楚起见，我们错误地将价格变化称为收益，但我们将继续。最后，为了总结这个假设示例，我们可以将图 1.4 重新绘制为图 1.5，其中我们在每个阶段都根据到该点为止的累计展期调整了价格。


    ### 提示 补充材料


    贴水（Backwardation）：当远期合约以低于现货合约的折价交易时，期货曲线即为贴水状态。


    升水（Contango）：当远期合约以高于现货合约的溢价交易时，期货曲线处于升水状态。


    在贴水市场中持有多头部位的展期收益是正的。在升水市场中持有空头部位的展期收益是负的。


    ![](img/00004.gif)

    图 1.5 期货合约的另一种表示形式。现在，让我们回到现实世界。图 1.6 显示了持有当月 VIX 多头部位的累计“现货收益”。


    ![](img/00005.jpeg)

    图 1.6 持有多当月 VIX 期货的累计现货收益。


    ![](img/00006.jpeg)

    图 1.7 持有 VIX 期货多头的累计展期收益。


    ![](img/00007.gif)

    图 1.8 持有 VIX 期货多头的累计现货收益和展期收益。


    ![](img/00008.jpeg)

    图 1.9 持有 VIX 期货空头的累计现货收益和展期收益。


    从这项分析中得出的几点结论是：


    1. 展期收益是性能的重要驱动因素。

    2. 在极端波动时期（2008 年大衰退和 2011 年欧洲债务危机），现货收益往往占据主导地位并拉低表现。

    3. 展期收益在压力时期会改变方向。


    我们现在有了关于机器需要做什么的线索。我们可以保持空空 VIX 当月期货，并依靠我们的机器向我们提供平补空头部位的信号。机器需要关注：


    1. 展期收益即将改变方向时。

    2. 现货收益即将爆发的时刻。


    因此，一个好的开始可以是：


    1. 提供历史展期收益作为预测展期收益何时改变方向的输入。

    2. 提供关于现货收益何时爆发的输入。


    ## 总结


    AI 提供了一系列非常强大的工具来量化我们的想法。在本章中，我们讨论了 AI 如何量化交易想法并改进交易策略。


    ## 参考文献


    * John C hull Options, Futures, and Other Derivatives, 用于期货和期权的基础定义。

    * Lepiere, Yves & Deremble, Cyril & Seager, Philip & Potters, Marc & Bouchaud,
    Jean-Philippe (2014). 趋势跟踪两个世纪。Journal of Investment Strategies. 3. 10.2131/JOIS.2014.

    * Baz, Jamil and Granger, Nicolas and Harvey, Campbell R. and Le Roux, Nicolas
    and Rattray, Sandy, Dissecting Investment Strategies in the Cross Section and
    Time Series (December 4, 2015).

    * Jusselin, Paul and Lezmi, Edmond and Malongo, Hassan and Masselin, Côme and
    Roncalli, Thierry and Dao, Tung-Lam, Understanding the Momentum Risk Premium:
    An In-Depth Journey Through Trend-Following Strategies (September 24, 2017).


    # 第二章 数据类型


    在本章中，我们将讨论各种数据集以及我们在金融领域可能遇到的数据类型。我们还将考虑如何向机器呈现这些数据，以提取最大的智能。我们将讨论一个适用于所有人工智能（AI）任务的通用框架。


    ## 学习目标


    1. 读者将介绍数值型、分类型和日期/时间特征

    2. 读者将接触各种数据预处理方案


    ## 通用设置


    想象一个典型的电子表格，其中行和列包含了大量数据。对于将 AI 算法应用于金融的任务，我们以表格形式呈现数据，看起来非常像图 2.1。数据的行被称为样本、观测值或实例。列被称为特征或预测变量。

