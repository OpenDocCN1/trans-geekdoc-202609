    ![](img/00150.jpeg)


    图 10. 18 重新调整原始数据


    其中 `n_col` 是某个特定的回溯窗口，例如 `100`。执行此转换的函数如图 10.19 所示


    ![手机截图 自动生成的描述](img/00151.jpeg)


    图 10. 19 重新调整原始数据以获取图 10.16 所示形状的代码


    我们现在图 10.20 中定义我们的架构


    ![手机截图 自动生成的描述](img/00152.jpeg)


    图 10. 20 卷积操作的示例代码


    当输入是像卫星图像之类的图像时，`CNN` 应该是首选。对于其他类型的数据，则需要进行实验。


    ## 总结


    * 我们分享了关于如何使用卷积操作进行特征生成的见解。

    * 卷积神经网络具有参数共享和连接稀疏的属性。

    * 整个时间序列使用相同的权重和偏置。这被称为参数共享。

    * 连接的稀疏性存在是因为时间序列的“局部”部分连接到了网络。

    * 与全连接多层感知机相比，连接的稀疏性和参数共享减少了潜在的过拟合。


