- raw: "Cost-complexity pruning improves the short-sighted nature of the early stopping\
    \ criteria. It starts by building a complete tree. From this complete tree, it\
    \ creates various sub trees. Any one of the generated trees could be the optimal\
    \ solution. The optimal tree is chosen by cross-validation.\n\nWhat is interesting\
    \ and important is a little bit of insight into the cost-complexity-pruning algorithm\
    \ by which we are able to generate the subset of trees. The cost function that\
    \ helps in implementing the cost complexity pruning algorithm is in Equation 5.1.\
    \ \n\n\\[∑(Yi - Yavg)2 + α |T|\\]                               Equation 5.1\n\
    \nThe first part of this equation does not require any explanation and is the\
    \ same as discussed in chapter 4 . The α |T| is the regularization term where\
    \ |T| represents the number of terminal nodes or leaves in the tree and α is a\
    \ parameter that we need to provide. So, if α =0, Equation 5.1 reduces to simply\
    \ minimizing MSE. The tree that we get is the entire un-pruned tree. However,\
    \ as we start increasing α, there is a price to be paid for having a large number\
    \ of terminal nodes and therefore Equation 5.1 will tend to be minimized for a\
    \ tree with a smaller number of terminal nodes. As α increases, we get smaller\
    \ and smaller trees, minimizing the value of the cost function. For instance,\
    \ for α equal to infinity we would need T to be zero, reducing the tree to a single\
    \ node. This way we are able to map α to |T| and hence the particular sub-tree.\n\
    \nThe tree we would use is the one that gives the best performance on a validation\
    \ data set.\n\n## Bagging\n\nAnother way of reducing the overfitting or high variance\
    \ problem in decision trees is bagging. Bagging is a two-step process comprising\
    \ first of “bootstrapping” and then of “averaging”.\n\nAs illustrated in Figure\
    \ 5.1, we start by creating several samples of the original dataset and then build\
    \ an ensemble of decision trees on each of the datasets. The final ensemble of\
    \ trees is just the average of all the predictions coming from each of these decision\
    \ trees. The idea is that this process creates a set of uncorrelated trees - each\
    \ learning some information and inevitably some noise. The averaging over several\
    \ such trees would reduce the noise component and retain the information.\n\n\
    ![](images/00037.jpeg)\n\nFigure 5. 1 The concept of bootstrapping illustrated.\n\
    \nThe process by which we extract multiple datasets from the original dataset\
    \ is called bootstrapping. Let us say the original data set has m samples. We\
    \ select n(<m) samples randomly with replacement. We do this b number of times.\
    \ Therefore, we now have b data sets with n samples each, rather than one data\
    \ set with m samples. We create b trees, one on each newly created data set. The\
    \ final machine is an aggregation of the results from each of these b trees.\n\
    \nNow if this is a regression problem, we will simply average the result of each\
    \ b tree, and if it is a classification problem, we will take a majority vote\
    \ on the predictions made by each of these classifiers.\n\n### Out-of-bag samples\n\
    \nEach sample from the original data set has either been used to create a particular\
    \ tree or has been left out in the bootstrapping process. Accordingly, each tree\
    \ has its own training data on which it has been built. Each tree also has some\
    \ data that it was not seen and that can be used as the validation data. Therefore,\
    \ to get the validation performance for all the b trees that we have built, we\
    \ will simply aggregate the results of each tree on its corresponding validation\
    \ data set. This is great and really data efficient, as we do not really need\
    \ a separate validation data set.\n\nOnly one important issue needs some attention\
    \ - while bootstrapping, we randomly select m (<n) samples with replacement. As\
    \ we have highlighted earlier in this book, we are not entirely comfortable with\
    \ this approach when dealing with time series data. Furthermore, as we are using\
    \ our validation data to be out-of-bag samples, we are hindering the process of\
    \ learning by destroying the time series aspect of this data set (that is what\
    \ random selection does).\n\nThe samples are not independent of each other. As\
    \ a reminder while designing our validation strategy, we need to be able to answer\
    \ the following question: If our validation data were our test data, would we\
    \ have all the information in time to predict our test data?\n\nIf the answer\
    \ to the aforementioned question is “no,” then we are using a suboptimal machine\
    \ to make our prediction. There may be information in the data, which we have\
    \ not attempted to learn yet.\n\nTo resolve this, each time we do bootstrapping,\
    \ we need to ensure that the samples selected are in order. A scheme that could\
    \ be used is as follows (also depicted in Figure 5.2):\n\n1.  Randomly select\
    \ a number i from 1 to (n − m)\n\n2.  Select i to (i + m) samples as a bag\n\n\
    3.  Repeat b times\n\n![](images/00038.jpeg)\n\nFigure 5. 2 Ideal way to bootstrap\
    \ time series data.\n\nBagging derives its benefits from the following two sources:\n\
    \n*   Averaging over multiple predictors reduces variance.\n\n*   Each bag forces\
    \ the tree to focus on fewer samples and not just on the prominent ones, thereby\
    \ forcing the tree to work hard to learn information content that may be overlooked.\n\
    \nLet us see what else we can do to deal with the high variance problem by using\
    \ Random Forest.\n\n## Random Forest\n\nAs mentioned earlier, one of the drivers\
    \ of the bagging algorithm was that each tree was focusing on a different set\
    \ of samples and was therefore forced to learn less obvious intelligence. The\
    \ random forest does all of that and a little more. Figure 5.3 shows the steps.\n\
    \nWhile forming the nodes of a tree, we need to identify which feature we place\
    \ at the node and at what point we split it. Our current algorithm has the option\
    \ to choose this split at each node from all available features. Random forest\
    \ changes that. We randomly select a subset of m features from the original p\
    \ set of features (m/p ≤ 1). It is from this subset that we identify the best\
    \ feature at a particular node. We no longer have the luxury of selecting a feature\
    \ from the original p set of features. We are limited to selecting the best splitting\
    \ candidate from the subset of features.\n\n![A screenshot of a cell phone Description\
    \ automatically generated](images/00039.jpeg)\n\nFigure 5. 3 Random forest schematic\
    \ diagram.\n\nRandom forest derives its benefits from the following two sources:\n\
    \n*   Averaging over multiple predictors reduces variance.\n\n*   Each bag forces\
    \ the tree to focus on a fewer samples and not just on the prominent ones, thereby\
    \ forcing the tree to work hard to learn information content that may be overlooked.\n\
    \nWhat happens very often in data sets is that only a few features are correlated.\
    \ Moreover, sometimes it is only a subset of the entire feature space that contributes\
    \ to the bulk of the predictive power of the model. By focusing only on a smaller\
    \ subset of the features each time a split is being made, the random forest forces\
    \ learning from even the less prominent features. This not only reduces the correlation\
    \ between the various tree models of the ensemble thereby reducing the variance\
    \ when averaging is done, but also learns more valuable information from the data\
    \ set.\n\n## Boosting\n\nLet us get straight to the algorithm first and then work\
    \ out the intuition later.\n\nThe steps for a boosting algorithm are as follows:\n\
    \n1.  Fit a tree (T1) to the training data set.\n\n2.  Calculate the residuals/errors/misclassifications.\n\
    \n3.  Fit a tree T2 to the residuals of T1.\n\n4.  Update Model as T1 + shrinkage\\\
    *T2.\n\n5.  Fit a model T3 to the residuals of T2.\n\n6.  Update Model as T1 +\
    \ shrinkage\\*T2 + shrinkage\\*T3.\n\n7.  Fit a model TN to the residuals of TN-1."
