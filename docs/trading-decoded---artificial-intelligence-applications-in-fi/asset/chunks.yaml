    \ Time Series Momentum Strategies Using Deep Networks.\n\n## Convolution Operation\n\
    \nThis chapter introduces convolutional networks. We then try and uncover how\
    \ this network can be used to discover chart patterns to trade, an approach that\
    \ some traders have been able to deploy. It starts by discussing the dot product\
    \ operation and how it relates to the convolution operation as defined in the\
    \ context of neural networks.\n\nLet us start by looking at two simple vectors\
