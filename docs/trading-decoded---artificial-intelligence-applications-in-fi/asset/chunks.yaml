    我们展示的一些算法非常强大。只要给它们一个数据集，它们就非常有能力学习一切，并产生近乎零误差的预测。问题是，这种零误差预测仅限于机器训练过的数据，即**训练数据**。如果我们将这台机器用于未见过的数据（如新进入的市场数据），预测误差将会飙升，你很容易就能推断出这台机器是零智能的。我们将这第二类数据称为**测试数据集**。


    因此，我们希望机器在它见过的数据（训练数据）上表现良好，在测试数据上的表现也足够合理。然而，这是否意味着我们要不断迭代各种可能性，直到最终找到一个在训练数据和测试数据上都表现良好的机器？答案是“否”的，因为如果我们对训练数据进行无限迭代以实现在训练数据和测试数据上获得良好结果，我们实际上是在两个数据集上都训练了机器，从而将两者合二为一了。


    因此，我们需要另一个数据集，称为**验证数据集**。现在我们在训练数据和验证数据之间进行这种反复迭代，一旦我们有了在训练和验证数据上表现良好的满意模型，我们就只引入一次测试数据集来查看性能。


    ## 验证数据的特征


    - 它在质量和分布上应该与我们预期表现良好的测试数据非常相似。

    - 训练数据与验证数据之间、验证数据与测试数据之间存在零泄露。

    - 样本应该是 IID（独立同分布）的。


    在设计验证数据集时，我们喜欢回答的一个有用问题是：如果验证数据是我们的测试数据，我们还会得到相同的结果吗？我们是否能够现实地实施完全相同的验证过程？在需要时，验证数据集的所有信息是否都可用，以便对验证数据集做出必要的预测？


    这些看似理论的考虑是极其重要的，并且可能是算法有效或无效的背后的原因。在详细讨论这些考虑之前，让我们先讨论一下通常采用哪些验证方法。


    ## 验证策略


    ### 独立的验证数据集


    我们将整个数据宇宙划分为三个不相等的部分，即训练集、验证集和测试集。训练数据通常占据整个集的 60–75%；剩余部分平均分配给测试数据和验证数据。更重要的考虑是验证数据，它在分布和特征上应该与测试数据相似。这种验证方法简单且稳健。然而，它有两个局限性。


    - **昂贵**：训练被强制在较小的数据集上进行，因为大约 20% 数据被留作验证。

    - **特定时期模型选择**：假设你正在设计一种基于收盘日数据交易黄金期货的策略。过去的 20 年将为提供大约 5000 个样本，其中我们保留 3000 个用于训练，750
    个用于验证，750 个用于测试。通常，3000 个样本对于大多数 AI 算法来说是不够的，对于深度学习算法更是明显不够。此外，我们被迫留出 3 年的样本用于验证。更重要的是，如果我们的验证数据包含
    2009 年、2010 年、2011 年，而测试数据包含 2012 年、2013 年、2014 年，那么大多数情况下，验证时期是一个平静的上升趋势（除 2011
    年的一段短时间外），而测试数据主要是下降趋势。这种设置的问题在于，验证数据在特征上本质上与测试数据不同，因此预期在验证数据上表现良好的模型在测试数据上的表现可能实际上很差。


    k 折交叉验证帮助我们解决这两个问题。


    ### k 折交叉验证


    1. 我们将数据宇宙划分为训练集和测试集。验证数据以以下方式从训练数据中：我们**随机**将训练数据分为 `K(=3)` 个相等的部分，并称它们为 A、B
    和 C。然后我们执行三次操作。


    - 在数据集 A 和 B 上训练模型，并在数据集 C 上验证。

    - 在数据集 A 和 C 上训练模型，并在数据集 B 上验证。

    - 在数据集 B 和 C 上训练模型，并在数据集 A 上验证。


    K 可以取任何值，如 3、5 和 10。这是大多数软件包实现它的方式。k 折交叉验证数据集可以通过几行代码来创建。


    ![一张包含刀、桌子的图片 - 自动生成的描述](img/00018.jpeg)


    这会将原始数据分为不同的子集。


    对于读者来说可能显而易见，这种验证过程确实解决了上一节讨论的两个局限性。但对于大多数金融数据集来说，这个过程是错误的，并在多个层面上失败了。


    在上述过程中，我们在验证数据上做了一些事情，如果验证数据被视为我们的测试数据，我们将无法做这些事情。我们还暴露自己允许训练数据和验证数据之间发生泄露。


    让我们来看一个简单的例子来获取直觉。


    在我们只有 2 个月的极小训练数据中（跨越 2018 年 1 月 1 日到 2018 年 2 月 28 日），假设我们正尝试预测 5 天后的市场情况。如果上涨，目标设置为“1”，如果下跌，目标设置为“−1”，否则设置为“0”。作为特征，我们提供的仅是过去
    5 天的每日市场收益率。


    1. 通过**随机**将训练数据中的样本分配到 `k = 3` 折中，我们往往会使用未来的数据来预测过去。如果我们的验证数据被处理得像测试数据一样（即未来要看到的数据），这是我们显然无法做到的。因此，我们希望避免对每个折进行随机选择。

    2. **数据的独立性**：为了更好地理解这一点，让我们看以下示例：


    | 折份 | 训练数据 |

    | --- | --- |

    | A | 2018 年 1 月 1 日 | 2018-1 月 2 日 | 2018-1 月 3 日 | 2018-1 月 4 日 | 2018-1 月 5
    日 | 2018-1 月 8 日 | 2018-1 月 9 日 | 2018-1 月 10 日 | 2018-1 月 11 日 | 2018-1 月 12
    日 | 2018-1 月 15 日 |

    | | 验证数据………… | | | | | | | | | | |

    | B | 2018 年 1 月 16 日 | 2018-1 月 17 日 | 2018-1 月 18 日 | 2018-1 月 19 日 | 2018-1
    月 22 日 | | | | | | |


    图 3.1 训练和验证日的示例，违反了 IID 标准中的独立性部分。


    图 3.1 显示了特定折份的 2018 日历训练和验证日的视觉化表示。1 月 15 日（训练数据的最后一天）的目标直到 1 月 22 日才已知。此时，我们需要问自己一个转瞬即逝的问题：我们可以使用截至
    1 月 15 日的训练数据预测 1 月 16 日的验证数据吗？答案是明显的“否”，因为在 1 月 16 日，我们不知道 1 月 9 日到 1 月 15 日样本的目标。1
    月 9 日到 1 月 15 日的信息不能用于预测 1 月 16 日的结果。在将 1 月 16 日纳入我们的验证数据时，绝对需要考虑到这一点。然而，正如之前设计验证数据集时提到的，我们应该将其视为测试数据。如果它可以作为测试数据，它就可以作为验证数据。

    '
