    # CHAPTER TWELVE - K NEAREST NEIGHBOURS


    In this chapter we will discuss the K Nearest Neighbour (`KNN`) algorithm that
    can be applied to classification and regression tasks. We will then discuss how
    this algorithm can be used as a ‘timing indicator’ in equity markets. As always,
    the focus will be on building the intuition rather than developing and selling
    a full-fledged system. Finally, we will draw insights about the equity market
    based on what our machine has learnt.


    ## KNN Algorithm

    To understand the `KNN` algorithm, we need to first understand `Minkowski Distance`.
    Figure 12.1 gives a snapshot of our data set.


    ![images/00168.jpeg)

    Figure 12. 1 Dataset under consideration


    Let us pick up two samples `xa` and `xb` from this dataset as shown in Figure
    12.2 with `n` samples and `P` features.


    ![images/00169.jpeg)

    Figure 12. 2 `xa` and `xb` sampled from our dataset


    The `minkowski distance` is defined as in Equation 12.1 below:


    ![images/0170.jpeg)Equation 12.1


    When `q =1`, it is known as the `Manhattan distance` and when `q =2` we call it
    the `Euclidean distance`. It is therefore a hyper parameter the user needs to
    specify.


    All that we do in the `KNN` algorithm is that, for a test sample, we calculate
    the `Minkowski distance` to each sample of the training data and select the `k`
    samples that are the closest to this test sample. Closeness, of course, is measured
    by the `Minkowski distance`. It is these `k` samples that form the nearest neighbours.


    The prediction is simply an aggregation or a vote of the target values of these
    `k` nearest neighbours. `k` itself is a hyper parameter and is found through the
    process of cross validation. We may also choose to weigh the target value of the
    `k` nearest neighbours by the distance to the test sample for purposes of prediction.
    Finally, there are two important considerations:


    * Since our distance measure is highly dependent on the scale of each feature,
    it is highly recommended to apply the `standard scalars` on the input features.
    Any of the `standard scalars` discussed in Chapter 2 could be used.

    * Computation can be slow. For each test sample we need to find the `Minkowski
    distance` to each sample of the training data set from which we then select the
    `k` nearest neighbours. This can be quite time consuming, and several modifications
    have been suggested. A `k –dimensional tree` or a `k –d tree` is one such modification,
    wherein in `Minkowski`, distance is computed only with a select number of samples.
    We refer the readers to the references for further reading.


    ## Financial Application : macro timing of various equity styles

    We will try and uncover patterns in macro-economic variable that help us position
    for moves in various equity markets. The macro economic variables that we have
    considered are shown in Figure 12.3. These may at best be representative of various
    regimes but by no means are exhaustive. These variables will go as inputs into
    our model and help us identify various regimes. Based on these regimes, we hope
    to be able to decide on an optimal investments style or strategy. In common parlance
    these macro-economic variables are the features to our model.


