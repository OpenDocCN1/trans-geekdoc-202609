    每个行业板块中的股票根据其基本面和技术面信息进一步分为四个子桶。


    应用于每个板块的四个子桶及其相应的定义如下：


    ### 1. 价值 (Value)

    根据下述的三个标准对股票进行排名。每个标准的权重相等，我们寻求购买前 10%分位的股票。投资组合每月进行一次再平衡。


    1. `过去 12 个月每股运营性现金流`

    2. `预计在未来 12 个月内支付的股利`

    3. `过去 12 个月每股销售额除以每股企业价值`


    ### 2. 动量 (Momentum)

    根据以下评分对股票进行排名，我们购买前 10%分位的股票。投资组合每月进行一次再平衡。


    1. `(12 个月收益率 – 1 个月收益率)/1 个月标准差`


    ### 3. 增长 (Growth)

    根据以下两个标准对股票进行排名。每个标准的权重相等，我们寻求购买前 10%分位的股票。投资组合每月进行一次再平衡。


    1. `过去 12 个月每股收益较前 12 个月的百分比变化`

    2. `过去 12 个月销售额较前 12 个月的百分比变化`


    ### 4. 质量 (Quality)

    根据下述标准对股票进行排名。每个标准的权重相等，我们寻求购买前 10%分位的股票。投资组合每月进行一次再平衡。


    1. `毛利率`

    2. `每股收益的标准差`，越低越好


    实际上，我们为每个行业和每种风格都建立了一个索引。我们在示例中创建并使用的索引如图 12.5 所示。这些索引将起到目标的作用。


    ![](img/00173.jpeg)


    图 12.5 我们数据集的目标。


    为了确保不偏离目标，我们将构建一个以宏观经济变量为输入并预测各风格表现的机器。


    ## 训练、验证和测试数据集

    我们的完整数据集范围从 2005 年至 2020 年。


    - 2005 年 1 月 – 2017 年 7 月 训练数据

    - 2017 年 8 月 – 2019 年 2 月 验证数据

    - 2019 年 3 月 – 2020 年 3 月 测试数据


    理想情况下，我们应该使用更严谨的验证策略，如我们在书中之前讨论过的那些策略，但这里的思想不是设计一个稳健的交易系统，而是理解如何实现它。


    1. 帮助我们进行数据划分和预处理的 Python 代码见图 12.6。

    2. 对于超参数 `param` 的特定值（本质上是 `k` 个最近邻），我们如图 12.7 所示拟合 `KNN` 对象，并对验证数据集进行预测，这意味着对于给定的宏观经济条件，我们能够预测每种策略的收益率。

    3. 随后，我们对验证集中每个样本的性能进行排名（图 12.8），做多最好的 10 种策略并做空最差的 10 种策略，然后计算投资组合的盈亏。

    4. 对不同的 `param` 值重复步骤 1), 2) 和 3)，并选择盈亏最高的那一个。


    ![白色背景上文字的特写 自动生成的描述](img/00174.jpeg)


    图 12. 6 用于划分和预处理数据的 Python 代码


    ![包含鸟的图片 自动生成的描述](img/00175.jpeg)


