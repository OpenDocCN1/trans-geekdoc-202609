    # 第七章 - 应用：套利交易


    让我们来看看我们目前为止所学过的工具和技术的一些实际应用。在本章中，我们将介绍有关如何使用人工智能（`AI`）进行交易的几个重要考虑。我们将讨论数据预处理、特征工程、超参数优化、风险管理，以及最重要的——结果分析，以识别机器在哪些方面做得好，哪些方面不好。


    在本章结束时，你将能够：


    1) 理解套利交易（carry trading）的概念以及它如何应用于商品、股票、货币和利率。

    2) 理解使用 AI 将经济概念转换为交易算法所需的所有构建模块。

    3) 理解并体会之前章节中涉及的几个细节。


    这种方法可以应用到几个金融概念，这些概念在第 1 章中讨论过。我们在这里选择揭示“套利（Carry Trading）”。套利本质上是指如果你拥有资产，在扣除购买资产的资金成本后所提供的收益。这种净收益可以是正的也可以是负的，这意味着只需通过拥有资产就可以获得净正收益，或者可能需要为拥有资产而支付净额。


    ## 外汇中的套利


    让我们通过外汇市场的一个简单示例来使其更具体。澳元（AUD）对比美元（USD）。在本章时，澳元的基准利率为 1%，美元基准利率为 2%。`AUD/USD`
    现汇汇率为 1 澳元兑 0.6771 美元。


    美国中央银行对美国经济似乎更加鹰派，而澳大利亚中央银行对澳大利亚经济持有更鸽派的观点。因此，如果我们借入期限为一月的澳元并用所得购买美元，我们需要支付 1%
    的澳元利率，因为这是我们借入的货币。作为回报，我们在美元持仓上获得 2% 的收益，因为这是我们的资产。我们资产的收益（2%）高于在澳元购买的资金成本（1%）。因此，这笔交易的套利是正的。


    显然，市场已经将此考虑在内。因此，在那个瞬间，`AUD/USD` 的一个月期远期汇率为 .6777，这意味着预计一个月后的澳元现汇将为 .6777。因此，预计澳元将从
    .6771 走强到 .6777，这恰好抵消了我们通过卖出美元买入澳元所预期的净套利收益。这就是有效市场假设下市场对工具定价的方式。


    实际上，如果我们借入澳元并按 .6771 的汇率转换为美元，我们将在美元资产上赚 2% 的收益，并对澳元负债支付 1%。同时，我们承诺在一个月后偿还我们借入的澳元。我们打算通过出售资产（美元）并使用所得购买澳元来实现此，这实际上意味着我们买入期限为一月的澳元并卖出美元。远期价格将使得持有美元一个月相对于澳元的
    1% 净收益被恰好抵消。因此，远期价格将为 `.6771*(1+.01/12) = .6777`


    我们想要测试的假设是，远期价格不能准确代表持有 `AUD/USD` 一个月可能产生的收益或损失。我们想看看持有净套利为正的工具相对于一组净套利为负的工具是否有收益。如果我们能通过持续持有净套利为正的资产相对于一组净套利为负的工具赚钱，那么我们就可以得出结论：远期没有准确定价未来结果。我们显然打算使用机器学习和我们之前讨论过的一些技术来证明或反驳这一假设。在此之前，让我们理解套利应用于其他资产类别的概念。在外汇市场中，如之前所述，套利简单来说是外国利率与国内利率之间的差。


    持有即可获得收益的资产是正套利。需要付费才能拥有的资产是负套利。我们想看看持有正套利工具的表现是否优于负套利工具。


    我们想分享的最后一个见解是，利率是货币的“价格”。如果商品的价格很高，意味着它需求很大，反之亦然。我们想测试如果我们系统地拥有受青的资产是否能赚钱。


    让我们看看套利在其他资产中是如何计算的。


    ## 商品中的套利


    大多数流动性商品至少有两个期货，反映了那两个月的供需情况。


    期货合约（`F`）可以用等式 1 进行定价：


    ```

    F = S0*(1 + (rfunding – rcommodity) *T/365)

    ```


    这里 `T` 是到期天数，`F` 是期货价格（第一个或第二个流动性合约），`S0` 是现货价格（分别为现货价格或第一个期货合约），`rfunding` 是商品计价货币的利率，`rcommodity`
    是商品的隐含利率（更常见的名称是便利收益）。如果 `rcommodity>rfunding`，则 `F<S` 且商品处于贴水（backwardation）。如果
    `rcommodity<rfunding`，则 `F>S` 且商品处于升水（contango）。如果 `rcommodity` 很高，意味着对该商品的需求很高，应该预期其表现会优异。


    ## 股指数中的套利


    大多数流动性指数通过期货合约进行交易。期货的定价方式类似：


    ```

    F = S0*(1 + (rfunding – rindex) *T/365)

    ```


    这里 `T` 是到期天数，`F` 是期货价格（第一个或第二个流动性合约），`S0` 是现货价格（现金指数），`rfunding` 是指数计价货币的利率，`rinde`
    是股息率。


    通常，现金指数和期货的收盘时间之间存在差异，因此如果我们使用日终数据，需要小心。


    更合适的方法是使用构成指数的公司实际支付的股利，并根据构建指数时使用的权重对其进行加权。我们也可以从指数期权市场的“认沽期权平价”关系中推出股息率，假设有足够的流动性。


    ## 利率中的套利


    短期利率与长期利率（2 年期对比 10 年期）之间的差额可以作为政府债券市场套利的衡量标准。


    在本章中，我们将重点放在商品期货上。让我们先进行一些预处理。


    ## 展期调整（Roll）


    我们这里的目标是创建一个连续合约，并调整我们在到期时展期头寸时看到的的价格不连续性。


    ![](img/00057.jpeg)


    图 7.1 10 月和 11 月期货价格走势。


    如图 7.1 所示，某商品的 10 月期货交易价格为$100，而 11 月期货（第二个活跃合约）交易价格为$102。对于 1000 的投资，我们购买了 10
    份 10 月期货。我们一直持有直到 10 月合约到期，然后展期到 11 月合约。假设展期时，10 月和 11 月合约的价格仍分别为$100 和$102。展期后，我们拥有
    1000/102 份 11 月合约。现在价格上涨了 1%到$103.02，我们平仓了头寸。我们的资金现在是$1010。


    ![](img/00058.jpeg)


    图 7.2 通用第一个合约的价格。


