    \ each time we convolve a time series of length n with a filter of length f, the\
    \ resulting time series is of length n − f+1 <n. This may negatively affect learning\
    \ capability as we get deeper with the architecture. We may choose to pad the\
    \ time series with 2p zeros, p on either side Figure 10.10. The time series is\
    \ now of length n + 2p, which, when convolved with a filter f, produces a time\
    \ series of n+2p − f +1.\n\n![](images/00129.jpeg)\n\nFigure 10. 10 Padding time\
    \ series\n\nIf we desire to keep the length of the time series the same, n+2p\
    \ − f+1= n\n\nP = (f − 1)/2\n\nThis is called “same convolution”.\n\nIf we have\
    \ P\\=0, it is called “valid convolution”.\n\n## Strides\n\nWhen we were moving\
    \ our filter along the vector after performing each dot product operation, we\
    \ were doing it in steps of one. The stride was effectively assumed to be one.\
    \ That need not be the case always. Let us say we have a vector u given by\n\n\
    ![](images/00116.jpeg)\n\nAnd the filter f given by \n\n![](images/00130.jpeg)\n\
    \nThe convolution operation with a stride of 2 is given by the following steps\
    \ in Figure 10.11:\n\n![](images/00131.gif)\n\nFigure 10. 11 stride 2 convolution\
    \ operation\n\nEffectively,\n\n![](images/00132.jpeg)\n\nTo generalize, when we\
    \ convolve an n dimensional vector with an f dimensional filter and use a stride\
    \ of s , we get an output of size \\[(n+2p − f)/s +1\\]\n\n1 × n © 1 × f = 1 ×\
    \ \\[(n + 2p − f)/s + 1\\]\n\nWhy would we want to add strides to a time series\
    \ for trading? One way to think about it is that we are looking for opportunities\
    \ across time frames. The pattern of interest does not necessarily need to occur\
    \ at the most granular time step - it may be more visible at a higher time step.\
    \ The same way chartists tend to look at monthly, weekly, daily, and intraday\
    \ time frames to firm up on a view, using various strides allows the neural network\
    \ to find shapes at multiple time frames that may impact the target.\n\n## Multiple\
    \ Filters\n\nSo far, we have been working with one filter. As discussed earlier,\
    \ the values of the filter are learnt via back propagation and it represents a\
    \ certain pattern that exits in the time series that helps us predict the target/outcome.\
    \ However, there could be several meaningful patterns that could give us meaningful\
    \ information to help us predict the outcome. We are free to add as many filters\
