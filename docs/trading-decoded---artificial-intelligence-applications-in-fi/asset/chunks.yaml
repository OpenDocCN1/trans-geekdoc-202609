    So why is January 9 to January 15 not suitable for training if January 16 is included
    in our validation data? What we need to appreciate is that if there is a very
    strong relationship between the targets from January 9 to January 15 on one hand
    and January 16 on the other, our machine will focus and pick up this relationship.
    We may be impressed by the validation accuracy, but the test data accuracy shall
    be poor. Importantly, if there is some actual intelligence in the training data,
    which could have resulted in discovering meaningful alpha for a test data set,
    we have obstructed that process.


    Very often, the machine will pick up the easier relations faster and first. If
    these easier relations are wrong, we may not be able to reach a stage where we
    actually allow the machine to focus on less obvious but valid relationships, which
    actually do exist.


    A visualization for a recommended `k = 3-fold cross-validation strategy for time
    series data is shown in Figure 3.2, where we have assumed train, validation, and
    test splits of the data set have been made, taking into account the aforementioned
    two concerns of nonrandom selection of samples and independence of training and
    validation data sets.


    ![A close up of a logo Description automatically generated](images/00019.jpeg)


    Figure 3. 2 A plausible threefold cross-validation strategy for time series data.


    We have discussed in fair bit of detail how to create a validation dataset and
    what are the pitfalls we need to avoid. Next we discuss various metrics for measuring
    performance.


    ## Regression Metrics


    We discussed various factors that could serve as inputs to a momentum model in
    Chapter 1. Based on these inputs we may be interested in predicting the returns
    for the next day, the next week or the next month. Essentially, we are interested
    in predicting a numeric outcome. The following are the metrics used to evaluate
    a regression machines performance.


    ### Mean Square Error (MSE)


    ![](images/00020.jpeg)


    `MSE` is the sum of the squared difference between the actual and the predicted
    values over all the samples.


    Where `N` are the total number of samples, `yi` is the target of the `ith` sample,
    and ![](images/00021.jpeg) is the prediction for the `ith` sample. Some observations
    that will help us understand the usage of this metric are as follows:


    Calculating the `MSE` requires squaring the error of the prediction, as a result
    the `MSE` tends to be influenced more by samples where the predictions are significantly
    different from their actual values. Do we really need that for our problem?


    What therefore is a good `MSE` value? Here are a few guidelines:


    * Replace each prediction by the mean value of all targets and calculate the `MSE`;
    our machine should have an `MSE` lower than this.

    * In trying to predict the returns for the next day we can use today’s actual
    return as a proxy and calculate a benchmark `MSE` value. The machine we eventually
    deploy should have an `MSE` value lower than this benchmark. In doing so we are
    necessarily ensuring that today’s price is not the best predictor of tomorrow’s
    price.

    * Replace the prediction with the average actual value for previous several days
    and calculate a benchmark `MSE` value. Again, we want our machine to have an `MSE`
    lower than this benchmark.


    ### MAE


    The Mean Absolute Error (`MAE`) is defined as the absolute value of the difference
    between the actual value and the predicted value of a sample. The formula given
    as:


    ![](images/00022.jpeg)


    Where `n` is the total number of samples, `yi` is the target of the `ith` sample,
    and ![](images/00021.jpeg)`y_cap` is the prediction for the `ith` sample.


    In a regression setting, if we do not want to overemphasize the larger error terms,
    we deploy `MAE`.


    1. Since we are NOT squaring the error of the prediction like we did while calculating
    the `MSE`, the `MAE` calculation does not lay more stress on larger errors.

    2. What is a good `MAE` value?


    1. Replace each prediction by the median value of all actual values and calculate
    the `MAE`; our machine should have a `MAE` lower than this.

    2. In trying to predict the returns for the next day we can use today’s actual
    return as a proxy and calculate a benchmark `MAE` value. The machine we eventually
    deploy should have a `MAE` value lower than this benchmark. In doing so we are
    necessarily ensuring that today’s price is not the best predictor of tomorrow’s
    price.

    3. Replace the prediction with the average actual value for previous several days
    and calculate a benchmark `MSE` value. Again, we want our machine to have a `MAE`
    lower than this benchmark.


    ### MSPE/MAPE


    These are just `MSE` and `MAE` standardized by the actual values of the dependent
    variable.


    ![](images/00023.jpeg)


    ![](images/00024.jpeg)


    It is best to use it in a setting where we are trying to predict the returns of
    several assets at the same time. To exemplify let us suppose we are trying to
    predict the next tick of E-mini S&P 500 futures, treasury futures, and crude oil
    future through the same machine. E-mini S&P 500 futures have a tick size of 25
    cents, treasury futures of 0.015625 cents, and crude oil of 1 cent. It makes sense
    to use a standardized measure of error in this case. `MSPEs`/`MAPEs` are the recommended
    metrics.


    ## Classification Metrics


    Building on the momentum setup we spoke about in Chapter 1; we may be interested
    in predicting whether palladium prices are expected to rise or fall the next day.
    If they are expected to rise, we assign those samples a class label of 1. Similarly,
    if they are expected to fall, we assign those samples a class label of zero. The
    classification machines will help us put a probability against these occurrences.


    The output of any classification algorithm is a conditional probability. For a
    two-class classification problem denoted by 1 and 0, the output is:


    `P(Y=1 | Feature set)`: Probability of Y equal to 1, given the Feature set.


    `P(Y=0 | Feature set)`: Probability of Y=0, given the Feature set.


    Once we have a probability measure, we need to make an assumption of a certain
    threshold value, which is the probability value above which samples are assigned
    to class 1 and below which are assigned to class 0.


    That is to say, if:


    `P(Y = 1 | Feature set) > Threshold` implies class 1 or


    `P(Y = 0 | Feature set) > threshold` implies class 0


    What follows is a list of metrics best suited for a classification problem. Before
    that we need to understand a confusion matrix.


    ### Confusion Matrix


    A confusion matrix is a table of four quadrants that helps us analyze the performance
    of a (binary) classification machine. In a binary classification problem with
    class labels 1 and 0, we enter the number of samples that belong to each quadrant.
    Each quadrant contains samples, which satisfy both conditions of the actual and
    predicted class values, for example, quadrant 2 in the succeeding text will contain
    all those samples, which were predicted to belong to class 1 and actually belonged
    to class 0.


    ![](images/00025.jpeg)


    It is constructed in sklearn using the following code:


    ![A close up of a logo Description automatically generated](images/00026.jpeg)


    Based on the confusion matrix, the following metrics are defined and easy to understand:


    ### Accuracy


    Of all the predictions made, what fraction of the total was predicted correctly?
    It is the number of samples in quadrants 1 and 4 divided by the total number of
    samples.


    ![](images/00027.jpeg)


    ### Precision

