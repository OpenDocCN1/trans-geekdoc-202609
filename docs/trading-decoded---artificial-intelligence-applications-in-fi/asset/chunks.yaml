    \ tree controls the overfit. Default results in all leaves being pure.\n\n*  \
    \ min\\_samples\\_split: The minimum number of samples required to split an internal\
    \ node.\n\n## Weak learners\n\nAs defined earlier, a weak learner is one that\
    \ finds it hard to generalize on unseen data but does well on training data. A\
    \ weak learner is of very little value to us. Decision trees are weak learners.\
    \ This was subtly alluded to in Equation 4.3, where the MSE for that region turned\
    \ out to be zero, because there was only one sample. This means we can keep dividing\
    \ our rectangular regions until we have only one sample per region. In such a\
    \ case the MSE (or the relevant metric for classification) will be zero and we\
    \ would have perfectly fit the training data. However, when used to predict test\
    \ or unseen data, the prediction will fail massively. We will explain how we overcome\
    \ this in the next chapter.\n\n## Summary\n\nSo now we know how to construct a\
    \ decision tree and the various cost functions associated with a classification\
    \ and a regression tree. We understand the problem of weak learners. \n\n## References\n\
    \n*   [https://scikit-learn.org/stable/modules/tree.html](https://scikit-learn.org/stable/modules/tree.html)\n\
    \n*   [https://faculty.marshall.usc.edu/gareth-james/ISL/ISLR%20Seventh%20Printing.pdf](https://faculty.marshall.usc.edu/gareth-james/ISL/ISLR%20Seventh%20Printing.pdf)\n\
    \n*   [http://appliedpredictivemodeling.com/](http://appliedpredictivemodeling.com/)\n\
    \n# CHAPTER FIVE -   \n\nENSEMBLE METHODS\n\nIn the previous chapter, we have\
    \ discussed the algorithm for constructing a decision tree in detail. It became\
    \ apparent that this algorithm could overfit the training data easily. In this\
    \ chapter, we will discuss modifications that can help us deal with the problem\
    \ of overfitting.\n\nThere are several ways of reducing overfit in decision trees.\
    \ These include the following:\n\n*   Early stopping\n\n*   Cost-complexity pruning\n\
    \n*   Bagging\n\n*   Random forest\n\n*   Boosting trees\n\nBagging, random forest,\
    \ and boosting trees are the more popular and powerful approaches.\n\n## Early\
    \ Stopping\n\nAs discussed in the previous chapter, while constructing a tree\
    \ we need to start by specifying a metric that we intend to minimize. For a regression\
    \ problem, it could be mean squared error (MSE) and for classification, it could\
    \ be cross-entropy. With early stopping, in case the MSE/cross-entropy stops changing\
    \ by a predetermined threshold, we could stop the compartmentalization of the\
    \ feature space. Alternatively, we could stop the further splitting of our samples\
    \ and our tree would be ready. This is a shortsighted approach. The eventual aim\
    \ of the decision tree algorithm is to get leaves that contain samples with a\
    \ very similar set of target values. Accordingly, the leaves should be as pure\
    \ as possible. Simply stopping the compartmentalization process because the MSE/cross-entropy\
    \ did not change adequately at a particular level obstructs a potential split\
    \ in the future, which could have created a pure leaf. This method is rarely deployed.\n\
    \n## Cost-Complexity Pruning"
