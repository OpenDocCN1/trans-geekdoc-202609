- raw: "\n\n![](images/00001.jpeg)\n\nDedicated to our parents,\n\nBrig (Dr.) Rajesh\
    \ Kakkar (Vishisht Seva Medal) \n\nand Mrs Shipra Kakkar\n\n&\n\nMr Manjit Singh\
    \ Sahni and Dr. Gurprit Kaur\n\nAnd our beautiful daughter, Antara who hopefully,\
    \ \n\nwill find errors in our research when she grows up.\n\n¬ Avirath and Arvin\n\
    \nDedicated to my mom Anandhi \n\n¬ Raja\n\nCopyright © 2020 \n\nAll Rights Reserved\n\
    \nNo part of this publication may be reproduced or distributed in any form or\
    \ by any means without the prior written approval of the publisher. \n\n# ACKNOWLEDGEMENTS\n\
    \nSpecial thanks to Mr Ajay Agarwal Director & CEO of EIS global, without whose\
    \ intellectual , financial and technological help this research would not have\
    \ been possible and not half as worthwhile. Ajay and his brother  Vivek  founded\
    \ EIS at the young age of 17 and have successfully traded the markets with a lot\
    \ of success for more than two decades. We’ll meet him again in the foreword.\
    \ \n\nBig thanks to Simon Sywak Director A stars Advisors for proofreading the\
    \ manuscript in painstaking detail and providing extremely valuable feedback.\
    \ Simon has over 25 years’ experience in equity , fx and commodity markets. He\
    \ recently led the Asian e-trading effort at JP Morgan. \n\nBig thanks to Amitesh\
    \ Sinha , who has been a pillar of support and provided us immense guidance along\
    \ the way, always ready to discuss trading strategies. He has been the Global\
    \ Head of foreign exchange exotic option business at ANZ. \n\nBig thanks to Brandon\
    \ Liu , eFX quant trader at Morgan Stanley Asia and Bank of America Merrill Lynch\
    \ for providing valuable feedback on various technical aspects of the book. \n\
    \nAnd finally and importantly our dear friend Michael Annerl, for being a pillar\
    \ of immense support throughout our career. Retired as the Head of commodity structuring\
    \ Goldman Sachs Asia. As always he has very kindly shared his testimonial on the\
    \ book. \n\n# FOREWORD\n\nI am honoured and excited to write the foreword for\
    \ “Trading Decoded – Artificial Intelligence applications in finance”. I was truly\
    \ impressed by Avirath at the first meeting at a conference. Since then he has\
    \ always beaten my expectations with his intellect and knowledge each time we\
    \ have interacted in our work together. The team of authors has extensive knowledge\
    \ across various domains starting from advance engineering, technology, mathematics,\
    \ statistics and their application to finance be it options, commodities trading\
    \ or applying advance machine learning techniques to finance.\n\nThe readers of\
    \ the book will get access to the vast experience and knowledge the team of authors\
    \ has gathered over the years working in various banks and Hedge funds and technology\
    \ firms in different roles and various domains of trading and AI algorithms. Special\
    \ care has been taken to simplify complex mathematical, scientific and financial\
    \ concepts to make them easier for the readers to absorb. The book will help readers\
    \ develop concepts related to quantitative finance and give them new ideas to\
    \ explore. The book will be a true treasure for all the readers and they will\
    \ keep referring back to it for years.\n\nHere’s wishing them all the luck\n\n\
    Ajay Agarwal\n\nDirector \n\nEIS Global Pte Ltd\n\n# AUTHORS BIO\n\nAvirath Kakkar\
    \ has spent the last 13 years in the finance industry in various capacities as\
    \ a trader, structurer, strategist, entrepreneur and founder. He joined JP Morgan,\
    \ Singapore in the structured commodity team to structure, price and execute exotic\
    \ options and other derivative trades for clients on the Asset and Liability side.\
    \ He was then responsible for Precious Metals Options trading and market-making\
    \ for Standard Bank Asia. Avirath joined Balyasny Asset Management (Hong Kong)\
    \ where he developed and executed systematic strategies across FX, Commodity and\
    \ Equity markets. Avirath went on to establish his own trading venture. He is\
    \ currently working with a family office building and executing AI based algorithms.\
    \ He is a part time instructor at an online training institute where he teaches\
    \ Machine Learning for trading.\n\nArvin Sahni has a total of 13 years of work\
    \ experience in data science, financial markets and software engineering. She\
    \ started her career with Oracle India as part of the E-business suite application\
    \ development team. After completing her MBA, she joined Citibank Singapore‘s\
    \ commodities team. She worked with the investor team providing structured investor\
    \ solutions for commodity assets. She then moved to a sales role within the metals\
    \ team covering corporates, hedge funds and other institutional clients for financial\
    \ products in the precious and industrial metals space for Asia Pacific region\
    \ ex Japan, Australia. With a strong career graph thus far, Arvin decided to shift\
    \ her focus to her passion in Data Sciences. She enrolled in UC Berkeley’s Master\
    \ in Data Science course. Arvin also holds an MBA from IIM Calcutta (India) and\
    \ Bachelor of Engineering (Computer Science & Engineering) degree from NIT Trichy\
    \ (India). She currently works on developing algorithmic trading strategies based\
    \ on machine learning \n\nRajalingappaa Shanmugamani is currently working at a\
    \ technology company on Machine learning in London. Previously, he worked as a\
    \ Senior Machine Learning Lead at SAP, Singapore and worked at various startups\
    \ in developing machine learning products. He has a Master’s from Indian Institute\
    \ of Technology – Madras. He has authored 6 books on various applications of machine\
    \ learning. He has published articles in peer-reviewed journals and conferences\
    \ and applied for few patents in the area of machine learning. In his spare time,\
    \ he coaches programming and machine learning to school students and engineers.\n\
    \n# TESTIMONIALS\n\n“For an in-depth overview of applications of machine learning\
    \ and artificial intelligence in modeling financial assets, this book is a much-have.\
    \ It caters towards financial experts who have limited knowledge of these techniques\
    \ as well as tech-savvy people who want to learn more about the working of financial\
    \ markets and how to apply ML and AI to modelling financial assets. Throughout\
    \ the book, the authors give excellent real-life examples to illustrate how to\
    \ apply these techniques to predict the future. Avirath does an excellent job\
    \ in warning the reader to avoid pitfalls like over-fitting AI models and how\
    \ to properly measure the performance of your model. I can highly recommend this\
    \ book to everyone who wants to start developing ML and AI models to apply on\
    \ financial assets”\n\nJerome Cohen\n\nManaging Member, Viseroij Capital Management\n\
    \nFormer Global Head Complex FX Products \n\n“Trading Decoded is a must read on\
    \ several fronts. Firstly, for traders - whose knowledge of markets ranges from\
    \ novice to expert – who have limited understanding of ML and AI techniques it\
    \ clearly explains how to apply these techniques to improve their existing models\
    \ and develop new insights and trading models. Models which would otherwise have\
    \ been impossible to learn, test and deploy due to the massive time constraints\
    \ resulting from the sheer number of permutations and combinations of variables.\
    \ Moreover, Trading Decoded, improves the learning curve by providing a list of\
    \ the pitfalls for each ML and AI technique saving the reader a lot of precious\
    \ time and effort in deciding which techniques to employ. The real-life examples\
    \ used also enable the reader to gain a greater understanding of the techniques\
    \ used and how to implement them. Secondly, Trading Decoded is written for those\
    \ with a strong understanding of AI and ML but who have little understanding of\
    \ trading and financial markets. After reading Trading decoded, this second group\
    \ of readers should be able to apply ML and AI to building trading systems, model\
    \ financial time series and find important, and sometimes hidden, relationships\
    \ among financial time series.”"
