    As shown in Figure 9.3, the sigmoid activation function is always positive and
    between 0 and 1. Let us say `Z` is a very small number, that is, `Z` moves to
    `-infinity`, `e\-Z` tends to infinity and `A(Z)` will tend to 0. Similarly, when
    `Z` is very large, that is, `Z` moves to infinity, `e\-Z` tends to 0 and `A(Z)`
    will tend to 1. It is used for classification tasks - especially for binary classification
    final output with a cross-entropy loss.


    ## Tanh


    `A(Z) = (ez – e\-Z)/(eZ + e\-Z)`


    ![](images/00090.gif)


    Figure 9. 4 Tanh activation function.


    ### Characteristics


    1. Lies between -1 and 1 (Figure 9.4)


    If we are using cross entropy as a loss function, using `tanh` as an activation
    function is not advisable in the output layer.


    ## Relu (Rectified Linear Unit)


    `A(Z) = max(0,Z)`


    ![](images/00091.jpeg)


    Figure 9. 5 Relu activation function.


    ### Characteristics


    1. Always positive (Figure 9.5)

    2. One of the most popular activations used currently

    3. It does not map negative values well as all are mapped to zero.


    ## Leaky-Relu


    `A(Z) = max(aZ,Z)`


    ![](images/00092.jpeg)


    Figure 9. 6 Leaky Relu activation function.


    ### Characteristics


    1. Tries to reduce the issue with the negative values mapping in the `Relu`. (Figure
    9.6)

    2. Need to decide the value of hyper parameter `a`. It is usually a small value
    such as `0.01`, `0.001`, and so on.


    ## Linear Activation


    `A(Z) = Z`


    ![](images/00093.jpeg)


    Figure 9. 7 Linear activation function.


    Cannot be used exclusively as irrespective of how deep your network is, you will
    essentially be calculating the same function over and over again (Figure 9.7).


    ## Softmax Activation


    In case of a multiclass classification problem with `C` (>=2) possible class values,
    the `softmax` output is defined as


    ![](images/00094.jpeg)


    This ensures that all the `C` predictions per sample sum to 1.


    ## Layers


    A group of neurons connected to another group of neurons, but not necessarily
    to each other. The types of layers that together form the framework of the neural
    network architecture are as follows:


    ### Input layer


    As the name suggests, this is the layer that contains the input features from
    the dataset. This is the 0th layer of the neural network. It connects to the hidden
    layer(s).


    ### Hidden layer


    These are the working horses of the neural network. They receive inputs from either
    the input layer or other hidden layers and provide its output to other hidden
    layers or output layer of the network.


    ### Output layer


    This is the final layer of the network and provides the output of the process.
    The output can be a probability, class, a real number, and so on based on whether
    we are dealing with a classification or regression problem.


    A neural network is called an “L-layer network” if the total number of hidden
    layers and output layers is equal to “L”. Hence, an NN with an input layer, one
    output layer, and one hidden layer is called a two-layer network (input layer
    is the 0th layer). Example of such a network is illustrated in the Figure 9.8.
    The term “deep learning” essentially implies a large number of hidden layers in
    the network. In Figure 9.8 we only show the direction of the forward pass. Backward
    propagation goes in the opposite direction (not shown here).


    ![](images/00095.jpeg)


    Figure 9. 8 Deep network.


    A connection between two neurons in layers `La` and `Lb` simply implies that during
    the forward pass, the receiving neuron in layer `Lb` uses the output of the neuron
    in layer `La` as part of its input to calculate the activation function. During
    backward propagation, layer `Lb`’s gradient descent output goes as an input to
    layer `La`’s gradient.


    ## Fully Connected Network


    In a neural network, if every neuron of a layer is connected to every neuron of
    the preceding and succeeding layer, it is known as a fully connected network.
    Why do deep networks work well? The initial layers can look at detecting low-level
    features of the inputs exploring simpler relations between inputs and outputs
    and the latter layers can work on more “complex” relations by using the simpler
    features detected in the earlier layers, hence exploring the entire gamut. This
    has contributed to the popularity of deep networks across domains even though
    they are computationally much more expensive than shallow networks.


    ### Epoch


    Once all the layers and neurons have completed the two-step process, we come to
    the end of phase 1, known as forward pass. At this point, we have a “predicted”/calculated
    value of the output(s), known as `Ypred`. This value may not be the same as the
    actual output `Yact`. Depending on the kind of problem we are dealing with, we
    find an appropriate representation of this error. For example, in the case of
    a regression problem, we may represent the error as mean square error or mean
    absolute error. In the classification setup, we may choose to go with a metric
    such as log loss. The aim is to minimize this error to get a function that “best”
    approximates the relationship between the input and the output. Let us call this
    `L(Yact, Ypred)`. To minimize this, we use partial derivatives of `L(Yact, Ypred)`
    with respect to the parameters, that is, weights and biases.


    ## Parameters and Hyper Parameters


    As described in the chapter so far, several variables affect the outcome of the
    neural network in various ways. Some of these variables, called parameters, are
    the ones that are learned during the process of training via forward pass and
    backward propagation. Weights and biases of the various layers fall under this
    category. On the other hand, there are variables such as learning rate that are
    provided by the user. Such variables are known as hyper parameters. These are
    user-chosen but affect the outcome and performance of the network. Other hyper
    parameters that we have come so far are the number of layers, the number of neurons
    in each layer, and so on. It is very important to tune these hyper parameters
    to get the best possible performance from the network. There are a few ways to
    select the best hyper parameters.


    ### Grid search


    Specify a range of values for all the hyper parameters.


    1. Train the neural network for each of the possible hyper-parameter value combinations.

    2. Select the values that construct the best performing neural network of all
    possible ones based on the hyper-parameter combinations.

    3. The biggest issue with this is the exponential increase in the number of possible
    hyper-parameter combinations.


    ### Random search


    Specify a range of values for all the hyper parameters.


    1. Train the neural network for a few randomly selected possible hyper-parameter
    value combinations.

    2. Select the values that construct the best performing neural network out of
    all the possible ones from the randomly selected hyper-parameter combinations.

    3. The biggest issue with this is that, while the number of models created is
    much lower than grid search because of random selection, you may miss the “best”
    possible hyper-parameter combination.


    ### Coarse to fine search


    1. Specify a range of values for the hyper parameters.

    2. Train the neural network on a comparatively widely spaced (or coarse) sample
    of the hyperparameter combinations.

    3. Select the range of values that get the highest performing neural network.

    4. Retrain neural networks for all possible values between the range of values
    selected earlier.

    5. Select the hyper-parameter combination that gives the highest performing neural
    network.

