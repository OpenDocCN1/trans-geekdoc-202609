    在给定范围内选择值时，没有必要通过均匀选择值来搜索。应该根据取值的范围来选择值。例如，如果某个超参数的观察范围是 2–8，可以选择 2, 3, 4, 5,
    6, 7 和 8 等均匀值。如果范围是 32–1024，可以按照 2 的幂次间隔选择值，即 32, 64, 128, 256, 512 和 1024。需要注意的是，如果允许训练足够长的时间或使用足够复杂的网络，神经网络架构能够针对训练集提供的输入学习到精确的输出。然而，它并不一定能够预测在未见数据上的输出。这被称为**过拟合**。


    ## 过拟合


    让我们来看减少过拟合的一些重要且常见的方法。


    ### 更多数据


    如果神经网络在现有的训练数据上发生了过拟合，那么解决此问题的逻辑步骤就是添加更多的训练数据。然而，这并不总是容易的，因为这可能耗时且成本昂贵。


    ### 正则化


    通过在反向传播中添加正则化组件来对网络的复杂度进行惩罚。这在本质上有助于减少大量隐藏单元的影响，实际上使网络变得简单得多。


    ### Dropout（丢弃）


    对于神经网络训练的每一个示例，都会随机丢弃一些神经元。被选择丢弃的神经元随每个示例而变化。这使得网络更简单，并防止任何神经元在确定输出中占据主导。使用 dropout
    时需要记住两点：


    *   Dropout 仅用于训练，而不用于预测阶段。

    *   由于激活值的期望值随丢弃神经元的比例而减少，激活值的期望值会被放大以补偿这种减少。这被称为反向 Dropout（inverse dropout）。


    上述两个问题都由所有神经网络的标准实现处理，因此你不需要显式地编写代码。


    ### 早停


    确定是否发生过拟合的视觉化工具之一是绘制代价函数随迭代次数的变化图。如果训练集和开发/验证集的代价都随着迭代次数的增加而减少，我们可以继续训练。


    ![](img/00096.jpeg)


    图 9. 识别何时发生过拟合


    早停的问题在于，它混合了防止过拟合和优化代价函数这两个正交（或独立）的任务。


    ## 改进优化的方法


    这引出了下一个主题：我们如何优化代价函数，也就是说，我们如何让训练更快更高效？


    ### 缩放/归一化输入


    缩放参数仅基于训练集。验证集和测试集的输入或特征需要根据训练集学习到的缩放参数进行缩放。缩放有什么帮助？缩放确保了即使底层输入的实际值发生变化，其均值和方差也是预知的。通过使用缩放，可以构建更优的模型。


    ### 批量归一化 (Batch normalization)


    与前文逻辑类似，归一化从一层传递到另一层的激活值是有益的。关于应该归一化中间值 `Z = wX + b` 还是激活值 `Act(Z)`，存在争议。


    另一个注意的点是，你可能不希望所有的隐藏单元具有 0 均值 1 方差。为了避免这种情况，将归一化的中间值乘以参数 `gamma` 并加上参数 `Beta`。这些都是通过梯度下降或其他方法（如后续描述的
    `RMSprop`、`Adam` 优化器）学习的参数。


    ### 参数初始化


    在训练开始之前，需要对各个层和神经元链接的权重和偏置进行初始化。根据实践经验，很明显初始化方法通过减少梯度消失或梯度爆炸的影响来影响网络的可学习性。神经网络的标准实现提供了各种初始化方法，如
    He 初始化、Xavier 初始化（细节超出本书范围）等，或者你也可以使用自定义的初始化器。注意，权重矩阵不应初始化为 0，因为这将由于多层结构而导致学习失效。


    ### 小批量梯度下降 (Mini-batch gradient descent)


    将训练集分成若干较小的子集，并每次对其中一个较小的批次应用梯度下降。这被称为小批量梯度下降。如果每个子集的大小为 1，则被称为随机梯度下降。小批量大小（Mini-batch
    size）也是一个超参数。


    ### 动量梯度下降 (Gradient descent with momentum)


    这利用梯度的指数平均来更新权重和偏置等可学习参数。


    ### RMSprop(均方根传播)


    在每次迭代中，计算梯度平方的指数加权平均。通过当前梯度的缩放值（由梯度平方的指数加权平均的平方根缩放）来更新权重和偏置。


    ### Adam 优化


    它结合了带动量的梯度下降和 RMSprop。大多数标准库都内置了 Adam 优化。


    ## 用于分类和回归问题的损失函数


    ### 多类分类


    如果我们有具有具有 C 个可能类别值的分类问题，则交叉熵损失定义为


    ![](img/00097.jpeg)


    其中 `images/00098.jpeg` 是真实值，`images/00099.jpeg` 是属于类别 `i` 的概率。这适用于一个样本可能属于多个类别的情况，因此
    `Yi` 可以是维度为 `C` 且包含多个值的向量。


    ### 回归


    回归设置中最常用的损失函数是均方误差、平均绝对误差和平均百分比误差。


    ## Keras 实现


    实现深度网络的首选包是 Keras。让我们来看示例代码。


