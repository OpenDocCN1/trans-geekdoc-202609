    \n# CHAPTER NINE -   \n\nDEEP LEARNING\n\nThe use of machine learning is increasingly\
    \ becoming synonymous with the use of neural network or more specifically, with\
    \ deep learning. In this chapter, we will explore the workings of deep learning\
    \ models in detail. To develop an intuitive understanding of the workings of a\
    \ neural network, we will be exploring the use of neural networks for tackling\
    \ supervised learning problems. We will break the network down to its components\
    \ so that you, the reader, can play around and build your models to suit your\
    \ specific requirements. In other words, we will try to demystify the black box,\
    \ as these models are commonly referred to, layer by layer, component by component.\n\
    \nA deep learning architecture is a logical, structured, sometimes complex aggregation\
    \ of some relatively simple building blocks. Let us open the structure and see\
    \ why it has become the go-to-architecture for seemingly difficult problems and\
    \ what makes it so powerful.\n\n![](images/00087.jpeg)\n\nFigure 9. 1 Neural network\
    \ basic architecture.\n\nA neural network, as the name rightfully suggests, is\
    \ a network of neurons that operates as a two-pass architecture. An example of\
    \ a very simple network is provided in Figure 9.1. The first pass that proceeds\
    \ from input to output is known as the forward propagation. The second pass traces\
    \ the reverse path from the output to the input and is known as the backward propagation.\n\
    \nThe idea is to quantify the relationship between the input features and the\
    \ target outputs. In the first pass that comprises a forward propagation, a nonlinear\
    \ function is used to derive the value of target output(s), using the input values.\
    \ A loss function is calculated to find the error between the actual and the predicted\
    \ value of the output. The network aims to minimize this loss by finding the global\
    \ minima of the loss. In the second pass, the backward propagation, the parameters\
    \ (weights and biases) are tweaked in a systematic way to try and minimize this\
    \ loss. The rate at which the biases and weights are changed is determined by\
    \ a hyper parameter called the learning rate. The forward pass and the backward\
    \ propagation are, often, repeated a few times for a step-by-step systematic move\
    \ toward the global minima. The rate at which we can converge to the global minima\
    \ is a function of the structure, data, and many other hyper parameters. This\
    \ will be discussed in more detail in this and future chapters.\n\n## Neuron\n\
    \nA neural network is, as the name rightfully suggests, a network of neurons.\
    \ Each neuron is a specialized unit of computation that does a two-step operation\
    \ during the forward pass phase to convert an input to a processed output. Depending\
    \ on the specific architecture, each neuron passes its output to one or more sets\
    \ of neurons as their inputs. These neurons, in turn, use these inputs and perform\
    \ a “similar” two-step operation to pass the processed output along further in\
    \ the network.\n\nLet us say the input to the neuron is “X” and the output of\
    \ the neuron is “Y\\*.” Each neuron is associated with a few parameters (which\
    \ the network learns during the process of training. More on that later). The\
    \ parameters are called weights “W” and bias “b.” These parameters appear in step\
    \ 1 of the two-step process undertaken by each neuron (Figure 9.2).\n\nStep 1:\
    \ Calculates a value, let us call it Z, such that\n\nZ = Wt X + b\n\nThe superscript\
    \ “t” essentially implies that we need to take the transpose of the W matrix.\
    \ We multiply or rather perform a dot product of the transpose of the W matrix\
    \ and the input X. We then add the bias to this value to generate our intermediate\
    \ output, Z.\n\nStep 2: It involves applying a nonlinear function to the intermediate\
    \ output Z to get the output Y\\*. The nonlinear functions are known as activation\
    \ functions, A(Z).\n\n![](images/00088.jpeg)\n\nFigure 9. 2 Two steps, step 1\
    \ and step 2 that are performed in every neuron.\n\nWhy do we need these activation\
    \ functions to be “nonlinear”? While we do have a linear activation function,\
    \ as described ahead, it is rarely used exclusively in a network. The reason why\
    \ we need to introduce nonlinearity is to be able to approximate all possible\
    \ relations or, mathematically speaking, all possible functions that link our\
    \ input to our final desired output. The ability to do this mapping from any input\
    \ to output is called universal function approximation. In other words, it is\
    \ this nonlinearity that helps create the universal function approximator - hence\
    \ providing the ability to the neural learning system to predict variables in\
    \ multiple domains.\n\n## Activation Functions\n\nSome of the more common activation\
    \ functions are as follows:\n\n### Sigmoid\n\nA(Z) = 1/(1 + e\\-Z)\n\n![](images/00089.gif)\n\
    \nFigure 9. 3 Sigmoid activation function."
