    # CHAPTER TWO - DATA TYPES


    In this chapter, we will discuss various types of data sets as well as data types
    we may come across in finance. We will also look at the best way to present them
    to a machine to extract maximum intelligence. We will discuss a general framework
    that needs to be applied to all artificial intelligence (AI) tasks.


    ## Learning Objectives


    1. Readers will be introduced to numeric, categorical and date/time features

    2. Readers will be presented with various data pre-processing alternatives


    ## The General Setup


    Imagine a typical spread sheet with a whole lot of data presented in rows and
    columns. For the task of applying AI algorithms to finance, we present the data
    in a tabular form that would look much like Figure 2.1. The rows of the data set
    are called samples, observations, or instances. The columns are called the features
    or the predictors.

