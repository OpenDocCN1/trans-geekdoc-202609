    # 第九章 - 深度学习


    机器学习的使用日益等同于神经网络的使用，或更具体地说，与深度学习的使用。在本章中，我们将详细探索深度学习模型的工作原理。为了对神经网络的工作原理建立直观的理解，我们将探索使用神经网络来解决监督学习问题。我们将网络拆解为它的组件，以便你（读者）可以尝试尝试并构建符合你特定要求的模型。换句话说，我们将试图揭开这个黑箱的迷秘。


    ## 神经元


    神经网络正如其名，是一个神经元网络。每个神经元都是一个特殊的计算单元，通过两步操作将输入转换为输出。根据架构的不同，每个神经元将其输出传递给一组或多个神经元。假设神经元的输入是
    $X$，神经元的输出是 $Y^*$。每个神经元关联着几个参数（稍后会详细介绍）。这些参数被称为权重 $W$ 和偏置 $b$。这些参数出现在每个神经元执行的两步骤的第一步。


    ### 第一步


    计算一个值，我们称其为 $Z$，使得：


    $Z = W^T X + b$


    上标 $T$ 意味着我们需要对矩阵 $W$ 取转置。我们将 $W$ 的转置矩阵与输入 $X$ 相乘。然后我们将偏置加到该值上，生成我们的中间输出 $Z$。


    ### 第二步


    涉及对中间输出 $Z$ 应用非线性函数以获得输出 $Y^*$。非线性函数被称为激活函数，$A(Z)$。


    ![](img/00088.jpeg)

    图 9.2 每个神经元执行的步骤：第一步和第二步。


    为什么我们需要这些激活函数是“非线性”的？虽然我们有线性激活函数（如后所述），但在网络中很少单独使用。我们需要引入非线性的是因为能够近似所有可能的关系，或者从数学上说，连接我们的输入到最终预期输出的所有可能的函数。这种从任何输入到输出映射的能力被称为通用函数近似。换句话说，正是这种非线性有助于创建通用函数近似器——从而为神经学习系统提供了预测多个领域变量的能力。


    ## 激活函数


    一些常用的激活函数如下：


    ### Sigmoid


    $A(Z) = 1/(1 + e^{-Z})$


    ![](img/00089.gif)

    图 9.3 Sigmoid 激活函数。

    '
