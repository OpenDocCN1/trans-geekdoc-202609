    Figure 12. 9 Hyper parameter selection.


    From Figure 12.9 it is clear that `k = 2200` is the value of the hyper parameter
    we want to choose. Before we move on to discussing the performance on test data
    sets, lets highlight some clear weaknesses that you would want to account for
