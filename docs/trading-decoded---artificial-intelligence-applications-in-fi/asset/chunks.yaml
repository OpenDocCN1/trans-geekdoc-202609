    \ are carried out starting from the final layer right up to the first layer. This\
    \ is the backward propagation step. One such pass through the entire training\
    \ set is known as an epoch.\n\n## Parameters and Hyper Parameters\n\nAs described\
    \ in the chapter so far, several variables affect the outcome of the neural network\
    \ in various ways. Some of these variables, called parameters, are the ones that\
    \ are learned during the process of training via forward pass and backward propagation.\
    \ Weights and biases of the various layers fall under this category. On the other\
    \ hand, there are variables such as learning rate that are provided by the user.\
    \ Such variables are known as hyper parameters. These are user-chosen but affect\
    \ the outcome and performance of the network. Other hyper parameters that we have\
    \ come across so far are the number of layers, the number of neurons in each layer,\
    \ and so on. It is very important to tune these hyper parameters to get the best\
    \ possible performance from the network. There are a few ways to select the best\
    \ possible hyper parameters.\n\n### Grid search\n\nSpecify a range of values for\
    \ all the hyper parameters.\n\n1.  Train the neural network for each of the possible\
    \ hyper-parameter value combinations.\n\n2.  Select the values that construct\
    \ the best performing neural network of all possible ones based on the hyper-parameter\
    \ combinations.\n\n3.  The biggest issue with this is the exponential increase\
    \ in the number of possible hyper-parameter combinations.\n\n### Random search\n\
    \nSpecify a range of values for all the hyper parameters.\n\n1.  Train the neural\
    \ network for a few randomly selected possible hyper-parameter value combinations.\n\
    \n2.  Select the values that construct the best performing neural network out\
    \ of all the possible ones from the randomly selected hyper-parameter combinations.\n\
    \n3.  The biggest issue with this is that, while the number of models created\
    \ is much lower than grid search but because of random selection, you may miss\
    \ the “best” possible hyper-parameter combination.\n\n### Coarse to fine search\n\
    \n1.  Specify a range of values for the hyper parameters.\n\n2.  Train the neural\
    \ network on a comparatively widely spaced (or coarse) sample of the hyperparameter\
    \ combinations.\n\n3.  Select the range of values that get the highest performing\
    \ neural network.\n\n4.  Retrain neural networks for all possible values between\
    \ the range of values selected earlier.\n\n5.  Select the hyper-parameter combination\
    \ that gives the highest performing neural network."
