    # 第六章 - 偏差与方差的权衡


    这是一个短章节，但仅仅基于这一概念的普遍适用性，我们希望专门用一章讨论这个主题。在本章结束时，你应该能够理解偏差-方差权衡，识别有偏差的机器，识别高方差机器，并在任何机器中实现偏差-方差权衡。


    如果你的机器没有给出理想的结果，你该怎么办？我们有一整套方案可选。我们可以：


    1.  更改特征

    2.  更改目标

    3.  更换机器

    4.  更改超参数

    5.  延长训练时间

    6.  更改验证策略


    我们也可以使用上述任何点的组合。这些每一个点及其组合都有几个子选项，显著增加了我们为拟合机器可以做的方法。进行穷举搜索实际上是不可能的。理解偏差-方差权衡为我们提供了一个框架，使得我们的搜索更有针对性。通常来说，理解偏差-方差权衡是解决大多数机器学习问题的第一步。


    ## 偏差 (Bias)


    顾名义，有偏差的机器是指对结果具有偏差视见的机器。在极端情况下，结果甚至不会随着输入的变化而改变。像方程 6.1 中定义的、独立变量 `X` 取值范围在 `[0,1]`
    之间的机器，其等式为：


    ```

    P(Y = 1 |X) = 0.6 +.00002 * X

    ```

    方程 6.1


    这里 `X` 是唯一的特征。这是一个高度偏差的机器，因为 `X` 的系数（`.00002`）非常小，且结果几乎总是非常接近 `0.6`。某些机器比其他机器更容易产生有偏差的结果。例如，使用逻辑回归而不是决策树更有可能得到有偏差的机器。为什么会发生这种情况？特征的简单性以及缺乏易于发现的关系可能会导致偏差机器。在
    particular 关系中，概率与 `X` 之间可能不存在机器被设定去捕捉的线性关系。如果我们创建一个特征 `X²`，我们可能会发现 `X²` 的系数更大，从而使得概率值开始变得不那么偏差。某些机器可能会因为过度正则化而产生偏差。


    ### 检测有偏差的机器


    以下两个准则有助于我们识别有偏差的机器：


    *   训练数据上的错误率很高 - 本质上意味着机器没有学到东西。

    *   预测概率的范围相当。


    ### 降低机器的偏差


    *   增加非线性。

    *   减少正则化。

    *   增加机器复杂度。


    ## 方差 (Variance)


    遭受高方差问题的机器是指那些良好学习了训练数据，但在未见数据（验证/测试数据）上表现非常差的机器。这就好比一个很好地学习了教科书但发现难以应用于现实问题中的学生。


    某些算法比其他算法更容易过拟合。正如提到的，决策树将特征空间划分为区域并将样本分配到这些区域中。如果运行得足够长，它们会将特征空间划分到极细的程度，在训练数据上产生零误差。


    ### 检测高方差机器


    *   在训练数据上性能良好，但在未见数据上非常差。

    *   预测结果随特征的微小变化而发生剧烈变化。


    ### 如何解决高方差问题？


    *   特征选择、降维技术和正则化。

    *   减少运行时间。

    *   降低机器复杂度。


    为了说明，我们展示了在样本数据集上训练 `XGBoost` 算法的一些模拟。该样本数据集是一个二分类问题，46% 的样本属于类别 1，54% 的样本属于类别
    0。我们感兴趣的是预测类别 1 的样本。这里的想法是为偏差-方差权衡提供更多的见解。我们关注 `XGBoost` 算法的三个参数，即学习率 (`lr`）、树的数量
    (`n_est`）和最大深度 (`max_depth`）。随着这些参数每个值的增加，训练误差应该会减少。对于图 6.1 所示的 set，我们有一个高方差机器。训练准确率
    70.4% 远高于验证准确率 46.6%。


