    \nThe first convolution operation between 1,2 and 1,−1 is 1\\*1− 2\\*1 = −1\n\n\
    The second convolution between 1,−2 and 1,0 which is =1.\n\nThe third convolution\
    \ −1,2 and 0,1 is =2.\n\nWe sum it up to −1+1+2 =2.\n\nThe full operation is as\
    \ follows in figure 10.14:\n\n![](images/00144.jpeg)\n\n![](images/00145.jpeg)\n\
    \nFigure 10. 14 Multiple channels convolution\n\nIn effect, a 1×n×m time series\
    \ is convolved with a 1×f×m filter to produce a 1×(\\[(n+2p− f)/s +1\\]×1 output.\n\
    \nThe multi-dimensional inputs are also known as multiple channels. Different\
    \ representations of the same time series could be put into these different channels.\
    \ For instance, one channel could contain the closing prices of the time series,\
    \ the other channels could contain the open, high, and low respectively. We may\
