  fmt: "\n# CHAPTER TEN - CONVOLUTION NEURAL NETWORKS\n\nLabel 1: to samples where\
    \ the next tick is higher than the current tick. We call it `class1`.\n\nLabel\
    \ 0: to samples where the next tick is the same as the current tick. We call it\
    \ `class 0`.\n\nLabel -1: to samples where the next tick is lower than the current\
    \ tick. We call it `class 2`.\n\nFigure 9.10 is a snapshot of what our dataset\
    \ would look like.\n\n![A close up of a white wall Description automatically generated](images/00111.jpeg)\n\
    \nFigure 9. 10 Snapshot of high frequency data for CME gold futures.\n\nFor all\
    \ of 2018 we had about 20 million samples, of which 15% belonged to `class 1`,\
    \ 15 % belonged to `class 2` and 70% belonged to `class 0`. So, if our machine\
    \ was to predict that all samples belong to `class 0`, we would register an accuracy\
    \ of 70%, which may be quite reasonable. Now during training, our machine will\
    \ be seeing samples that belong to `class 0` 70% of the time. If the choice of\
    \ hyperparameters is such that the machine is a “biased” one, then it may well\
    \ happen that all samples are predicted to belong to `class 0`, which essentially\
    \ means we won’t be trading and hence we won’t be making money. This is a classic\
    \ problem when we deal with unbalanced data sets. The solution we propose involves\
    \ modification of the cost function. Let uslook at the details:\n\nThe categorical\
    \ cross entropy for a 3-class problem for one particular sample would be\n\n`CE\
    \ = -y0log(p0) –y1log(p1) –y2(logp2)`\n\nWhere `Yi=1,∀ i =0,1,2`\n\nAnd `pi`:\
    \ the probability that the sample belongs to `class i`\n\nThe modified cost function\
    \ for unbalanced classes would be \n\n`CEmodified = -(w0y0log(p0)) –(w1y1log(p1))\
    \ –(w2y2(logp2))`\n\nWhere `wi` is the weight for `class i` calculated as the\
    \ inverse of the frequency of occurrence of that class in our training data set.\
    \ Since `class 1` occurs in 15% of the samples `w1=1/(15%) = 6.66`, `w0 = 1/(70%)\
    \ =1.42` and `w2 = 6.66`\n\nFinally, this is how we implement it in Keras\n\n\
    ![](images/00112.jpeg)\n\nThis function is called at the time of compiling the\
    \ model\n\n![](images/00113.jpeg)\n\n## Summary\n\n- We introduced all the building\
