    我们将 `time steps = 50` 和 `features = 4`。在通过 `data_generator` 函数后，我们将输入重塑为：


    `(样本数, 50, 4)`


    我们如下设置 `LSTM`，内存大小为 32。


    ![自动生成的图片](img/00166.jpeg)


    模型看起来如下：


    ![自动生成的截图](img/0167.gif)


    在此设置中，一个内存大小为 32 的 `LSTM` 层有 436 个参数，这是权重和偏置的总数。我们是如何得到的？


    `Xt= (batch size, 4)`

    `ht−1 = (batch size, 32)`

    因此输入大小为 `[Xt, ht−1] = [batch size, 36]`

    输出维度为 `[batch size, 32]`。

    权重矩阵 = `36*32`。

    偏置参数 = `32`。

    `WA, WC, WO = 4*36`

    `bA, bU, bO = 4*32`


    ## 总结

    在本章中，我们学习了 RNN、LSTM 和 GRU 等新概念。通过例子，我们解释了如何设置循环网络以及各种参数的含义。这些概念有助于自动化交易。


    ## 参考文献

    * [`deeplearning.cs.cmu.edu/`](http://deeplearning.cs.cmu.edu/)

    * [`www.deeplearningbook.org/`](https://www.deeplearningbook.org/)

