    Let us assume we are a long only fund. We are only interested in timing buy signals.
    Once our machine gives us the probabilities, we assume a certain threshold and
    convert the probabilities to an actionable buy signal. Our universe is now limited
    to these buy signals. How many of these buy signals made money for us? Or, how
    many of these predicted buy signals belong to `Class 1`? That is precision, which
    would be defined as the number of samples in quadrant 4 divided by the combined
    number of samples in quadrant 2 and quadrant 4.


    ![A close up of a logo Description automatically generated](images/00028.jpeg)


    ### Sensitivity/Recall


    Continuing with the example of the long only fund, we had certain buy signals
    that we got from the buy probabilities and a threshold assumption. We may find
    that these signals are too few in number to make the estimate statistically reliable,
    or we may find that there are way too many signals, thereby significantly reducing
    the profitability per trade. Either way, we are interested in knowing how many
    buy signals we are getting compared to the total number of buy signals the market
    gives us. That is recall. That would be computed as the number of samples in quadrant
    4 divided by the combined number of samples in quadrant 3 and quadrant 4.


    ### Specificity


    Specificity is the number of samples correctly predicted to belong to class `0`
    divided by the number of samples actually belonging to class `0`. That would be
    computed as the number of samples in quadrant 1 divided by the combined number
    of samples in quadrant 1 and quadrant 2 of the confusion matrix.


    ### F1 score


    From the discussion of precision and recall, it is reasonable to assume that we
    would not only like to maximize the accuracy of our buy predictions (precision)
    but also to maximize the total number of buy predictions as a percentage of the
    total number of buy signals that the market can give us. The `F1 score` represents
    just this. It is the harmonic mean of the accuracy and the precision.


    ![A close up of a logo Description automatically generated](images/00029.jpeg)


    The above code can provide precision, recall, f1-score, and accuracy.


    ### AUC


    You have probably noticed that which quadrant of the confusion matrix does a sample
    get assigned to depends on the threshold. To take a step back, which class a sample
    gets assigned to once we have the probability depends on the threshold we chose.
    A plot of sensitivity (y-axis) vs `1 – specificity` on the x axis for various
    values of threshold, gives us the `ROC` (receiver operating characteristics) curve.
    The area under the ROC curve (`AUC`) is a metric for measuring classification
    performance. `AUC = .5` essentially implies no learning, and `AUC = 1` implies
    the best possible machine.


    ![](images/00030.jpeg)


    The biggest take away from this chapter is the methodology we discuss on how to
    build the validation strategy. An error at this point could well be the difference
    between success and failure.


    We have also introduced you to various metrics for evaluating a classification
    and a regression machine.


    ## Summary


    1. We have discussed in some detail the qualities and requirements of a validation
    data set.

    2. The key is to think of validation data as test data or data from the future
    being streamed sample by sample as opposed to reading the full chunk from the
    database. Both predictions should give the exact same results. The point being
    that all information needed to predict a validation sample should be available
    at that time and should not be leaked in from the future.

    3. Finally, we’ve discussed various metrics to measure the performance of the
    machine.


    # CHAPTER FOUR - TREE MODELS


    In this chapter, we introduce decision trees as one of the most powerful and interpretable
    algorithms deployable in finance. In our experience, these are best suited for
    problems where the amount of data is limited, but not scarce. Some would say that
    decision trees are similar to human learning process, that they rely on compartmentalization
    and exclude lower probability scenarios.


    At the outset, it is important to note that decision trees are inherently weak
    learners, but a few simple and extremely intuitive modifications can make them
    extremely powerful. And what do we mean by “weak learners”? Weak learners are
    those algorithms that perform really well on the training data set but find it
    hard to generalize well on validation or test data sets.


    By the end of this chapter you will understand the step by step process of constructing
    a decision tree for classification and regression tasks. This understanding is
    instrumental in understanding the applications we discuss in the next few chapters.


    ## Decision Trees


    Let us look at a decision tree in a regression setting, where we have only five
    samples and two features. This is only a toy example and we need more samples
    for meaningful learning and ideally more features too. As a target we are trying
