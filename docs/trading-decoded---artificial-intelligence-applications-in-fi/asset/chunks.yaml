    Trading decoded fills an important void in the trading and system development
    literature. It allows both traders and the technology literate to harness the
    power of advancement in computing power and technology to compete with the big
    players and not get left behind in traditional trading strategies whose alpha
    is being consistently eroded. Having read many trading books and invariably being
    left disappointed, Trading Decoded succeeds where other books fail because it
    gives the reader the tools to succeed.


    Michael Annerl

    Managing Partner, Viseroij Capital Management

    Ex - Head of Commodity Structuring Asia Goldman Sachs


    # PREFACE


    We live in this wonderful era of knowledge-sharing and have gained a lot from
    the insights and experience shared by the community. This is our way of giving
    back and expressing our gratitude. Finance is going to use machines in a big way.
    That trend has already started but it is nowhere comparable to the scale at which
    other industries are adapting to this technology. Traders sitting at banks, funds
    and other financial institutions will also evolve with time.


    In this book we have tried to amalgamate the technology of Artificial Intelligence
    with the science (as much of a science it can be) of investment management. The
    book starts off with a chapter introducing trading in the context of AI. Rest
    of the chapters explain various machine learning algorithms and concepts. Practical
    finance examples are used for explanation of AI concepts to help relate the two
    areas. The chapter on Carry trading is an exception where you can learn how to
    apply finance concepts for algorithmic trading. The last chapter has the biggest
    takeaways and an intuitive guide for everyone who is reading the book.


    This book is for professional traders and investment management professionals
    who are looking to build their expertise in Artificial Intelligence algorithms
    and thereby enhance their search for alpha. This book will be equally useful for
    readers who are comfortable with Artificial Intelligence algorithms and are looking
    to build their expertise in trading and investments. We have tried to keep the
    explanations very intuitive and readers who are about to begin their journeys
    in the world of finance or in AI should find the contents helpful. Machine learning
    algorithms will be covered assuming no prior knowledge.


    We must declare up front, we are not selling any trading system or methodology
    through this book. We have given `python` functions only where we thought their
    presence would aid the users understanding. Our aim has been to build concepts,
    highlight challenges and build a process which needs to be followed to search
    for alpha in the market.


    Do share your comments, feedback and how would you like us to improve the book.
    Looking forward to hearing from you. Contact us at `tradingdecoded@gmail.com`.


    Avirath, Arvin, Raja


