    \ 6 || 1.70% || MAR || 3 |\n\n| 7 || \\-8% || DEC || 12 |\n\n| 8 || 7% || JAN\
    \ || 1 |\n\nFigure 2. 6 label encoding.\n\nThis would work fine for decision trees\
    \ but would be inappropriate for Artificial Neural Networks.\n\n![A picture containing\
    \ knife, table Description automatically generated](images/00015.jpeg)\n\n###\
    \ Frequency Encoding\n\nIn each sample, the categorical feature is replaced by\
    \ its frequency of occurrence, for example in Figure 2.4, there are eight samples,\
    \ DEC (December) appears in two of them and NOV (November)appears in only one.\
    \ We will then replace DEC by its frequency of occurrence which is 2/8 = 25% and\
    \ NOV by 12.5%. The simple code to do it is:\n\n![A close up of a logo Description\
    \ automatically generated](images/00016.jpeg)\n\nWe need to be careful of using\
    \ this method in this form if we have time series data. If we calculate the frequency\
    \ encodings from the entire data set, then we would have looked into the future.\
    \ The first sample has DEC as the categorical feature value. Replacing this with\
    \ 25% essentially tells us that there is only one sample in the future that has\
    \ a value of DEC for this feature. This practice is not acceptable for data sets\
    \ that have time series in it. The correct approach is to have an “ENCODING” data\
    \ set from which we derive the frequency encodings. We then use frequency embeddings\
    \ derived from the “ENCODING” data set in all data sets constructed from subsequent\
    \ time steps. This thinking will become more apparent in subsequent chapters.\n\
    \n### Mean Encoding\n\nContinuing with the data of Figure 2.4, we could replace\
    \ each categorical value by the mean value of some other column. Let us say we\
    \ were setting up a machine to predict the “Average return over the next 10 days,”\
    \ which would be our target variable. We could replace the “DEC” values of the\
    \ categorical feature with the average value of the target when the categorical\
    \ feature is “DEC.” In this instance, we have two samples that have “DEC” as a\
    \ categorical feature and the target or the “Average return over the next 10 days”\
    \ has been −3% and −2%, averaging −2.5%.\n\n![A picture containing object, red\
    \ Description automatically generated](images/00017.jpeg)\n\nWe will encounter\
    \ numeric and categorical data in all data sets in finance. Scaling numeric features\
    \ using a minmax scaler or a standard scaler can be extremely helpful in making\
    \ our optimizers converge when we are dealing with machines like Neural networks\
    \ or support vector machines.  On the other hand, frequency encoding and mean\
    \ encoding are simple techniques, however, they are immensely beneficial modifications\
    \ to data that help almost any machine to learn better. As a matter of fact, it\
    \ may be beneficial to convert numeric data to categorical data (see Chapter 4)\
    \ and then use mean encoding or frequency encoding to present it to a machine.\
    \ \n\n## Summary\n\n1.  We have introduced various data types we encounter in\
    \ finance and various pre - processing that are necessary to perform on the data\
    \ set.\n\n2.  The type of pre-processing we choose may also depend on the machine\
    \ learning algorithm that we intend to deploy and the kind of information we intend\
    \ to convey to the machine.\n\n## References \n\n1.  [https://www.fast.ai/2018/04/29/categorical-embeddings/](https://www.fast.ai/2018/04/29/categorical-embeddings/)\n\
    \n2.  Pairs Trading Strategy with Geolocation Data — The Battle between Under\
    \ Armour and Nike Jim Kyung-Soo Liew, Tamas Budavari, Zixiao Kang, Fengxu Li,\
    \ Xuzhi Wang, Shihao Ma and Brandon Fremin. The Journal of Financial Data Science\
    \ Winter 2020, 2 (1) 126-143; DOI: [https://doi.org/10.3905/jfds.2019.1.024](https://doi.org/10.3905/jfds.2019.1.024)\n\
    \n# CHAPTER  THREE -   \n\nVALIDATION STRATEGIES AND   \n\nPERFORMANCE METRICS\n\
    \nIn the previous chapter, we have discussed ways to deal with various types of\
    \ data that you may come across in finance. We have also discussed various preprocessing\
    \ techniques.\n\nIn this chapter, we introduce a broad classification of various\
    \ Artificial Intelligence (AI) algorithms. We then discuss a general framework\
    \ on how to organize the data for appropriate learning. We also highlight some\
    \ pitfalls that need to be avoided - some obvious, some not so obvious.\n\nBroadly\
    \ speaking, there are two types of learning algorithms: supervised and unsupervised.\n\
    \nAs the name suggests, supervised learning has a “supervisor,” which is the target\
    \ or the dependent variable that is to be predicted. All decisions that we make\
    \ to design the machine are taken with the sole purpose of being able to accurately\
    \ predict the target. All tools and tricks that we present and have presented\
    \ will be useful in trying to improve the quality of this prediction. Needless\
    \ to say, whether this target prediction meets a business objective is outside\
    \ the scope of the prediction algorithm. Therefore, you may have a machine that\
    \ has a great accuracy because the machine has been designed to predict just that.\
    \ Whether that makes money, or whether that makes enough money to meet costs,\
    \ or whether it has the right risk profile, is outside the scope of what the machine\
    \ is expected to do.\n\nIt may seem obvious, but it is important that we reflect\
    \ on it before we jump in and invest precious time in designing the algorithm.\
    \ Therefore, we may be designing an algorithm to predict the probability of prices\
    \ breaking a trend line. The business objective, however, is to make money. Does\
    \ the prediction help do that?\n\nAt the other end of the spectrum, we have unsupervised\
    \ learning. As the name suggests, in this case we do not have a supervisor or\
    \ a target. We present  data to the machine and expect the machine to return some\
    \ intelligence. For instance, the machine could cluster  data into similar subgroups.\
    \ Dimension reduction algorithms come under this as well. Our further discussions\
    \ shall not be focusing on this.\n\n## Organizing the Data"
