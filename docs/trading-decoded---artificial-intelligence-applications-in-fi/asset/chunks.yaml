    Enhance Time Series Momentum

    * [`colah.github.io/posts/2015-08-Understanding-LSTMs/`](https://colah.github.io/posts/2015-08-Understanding-LSTMs/)


    # 第十二章 - K 近邻


    在本章中，我们将讨论适用于分类和回归任务的 K 近邻（KNN）算法。我们将讨论如何将该算法作为股票市场的“择时指标”。一如既，重点将放在建立直觉，而不是开发一个完整的系统。最后，我们将根据机器学习的内容对股票市场得出见解。


    ## KNN 算法

    要理解 `KNN` 算法，首先需要理解 Minkowski 距离。图 12.1 给出了我们数据集的快照。


    ![images/0168.jpeg)

    图 12.1 考虑的数据集


    让我们从数据集中选取样本 `xa` 和 `xb`，如图 12.2 所示，具有 `n` 个样本和 `P` 个特征。


    ![images/0169.jpeg)

    图 12.2 从我们的数据集中采样的 `xa` 和 `xb`


    `minkowski distance` 的定义如下方的方程 12.1：


    ![images/0170.jpeg)

    方程 12.1


    当 `q =1` 时，被称为曼哈顿距离；当 `q =2` 时，我们称之为欧几里得距离。因此，它是用户需要指定的超参数。


    我们在 `KNN` 算法中所做的是，对于一个测试样本，计算它与训练数据每个样本的 Minkowski 距离，并选择距离该测试样本最近的 `k` 个样本。当然，距离是通过
    Minkowski 距离衡量的。这些 `k` 个样本形成了近邻。


    预测仅仅是这些 `k` 近邻目标值的聚合或投票。`k` 本身是一个超参数，通过交叉验证过程找到。我们也可以选择根据到测试样本的距离对 `k` 近邻的目标值进行加。最后，有两个重要的考虑：


    * 由于我们的距离测量高度依赖于每个特征的尺度，强烈建议在输入特征上应用 `standard scalars`。可以使用第 2 章中讨论的任何 `standard
    scalars`。

    * 计算可能很慢。对于每个测试样本，我们需要找到与训练数据集每个样本的 Minkowski 距离，然后从中选择 `k` 近邻。这可能非常耗时，已经建议了一些修改方案。`k-dimensional
    tree`（或 `k-d tree`）就是一种修改，其中在 Minkowski 中，距离仅通过选定的样本计算。我们建议读者参考参考文献以进一步阅读。


    ## 金融应用：各种股票风格的宏观择时

    我们将尝试在宏观经济变量中发现模式，帮助我们针对各种股票市场的波动进行布局。我们考虑的宏观经济变量如图 12.3 所示。这些变量最多可以代表不同的状态，但并非详尽。这些变量将作为模型的输入并帮助我们识别不同的状态。基于这些状态，我们希望能够决定最佳的投资风格或策略。通俗地说，这些宏观经济变量是我们模型的特征。


    ![images/0171.jpeg)

    图 12.3 作为模型输入的宏观经济变量


    ## 数据集目标

    作为目标，我们为各种股票投资风格创建指数。我们本质上是将美国上市的股票根据全球行业分类标准（GICS）划分归类到不同的板块，如图 12.4 所示。


    ![images/0172.jpeg)

    图 12.4 `https://www.msci.com/gics`


