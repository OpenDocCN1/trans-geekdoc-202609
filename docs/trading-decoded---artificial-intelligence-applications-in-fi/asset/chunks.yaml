    这些方程看起来可能很复杂，但在 `Keras` 中的实现相对简单。


    ## LSTM


    LSTM 背后的概念非常相似，它只是有更多的门控。其中，LSTM 区分了 `At` 和 `C(t)`。


    它定义了输出门，这桥接了 `At` 和 `C(t)` 之间的差距。


    `GO = Sigmoid (WO\[C(t−1), X(t−1)\] + bO)`

    `At= GO*tanH(Ct)`


    LSTM 保留了 `GU`，即更新门。`(1 – GU)` 或遗忘门的作用被建模建模：


    `GF = Sigmoid (WF\[C(t−1), X(t−1)\] + bF)`


    因此，内存的更新写为：


    `C(t) = GU*At + (GF)\* C(t−1)`


    描述 LSTM 行为的方程如下：


    `At = tanH (WA\[C(t−1), X(t−1)\] + bA)`

    `GU = Sigmoid (WU \[C(t−1), X(t−1)\] + bU)`

    `GF = Sigmoid (WF \[C(t−1), X(t−1)\] + bF)`

    `GO = Sigmoid (WO\[C(t−1), X(t−1)\] + bO)`

    `C(t) = GU*At + (GF)\* C(t−1)`

    `At = GO\*tanH(C(t))`


    所有这些方程和其他点起初可能看起来令人 overwhelming，但如果你理解了我们为什么要用 `GRUs` 和 `LSTMs` 替换 `RNN`，那么就是一个很好的开始。绝大多数
    `APIs`（应用程序接口）都为我们处理了这些严谨性，坦率地说，我本人几乎不关心这些方程。


    让我们来看一个简单的例子。我们的输入快照如图 11.14 所示：


    | 日期 || 开盘价 || 最高 || 最低 || 收盘价 || 目标 |

    | --- | --- | --- | --- | --- | --- |

    | 19950112 || \-2.05 || \-4.9 || \-2.5 || \-5.25 || 0 |

    | 19950113 || \-3.8 || 0.85 || \-1.8 || 2.3 || 1 |

    | 19950116 || 0.9 || 1.45 || 1.5 || 1.2 || 1 |

    | 19950117 || 1.75  || \-1.2  || \-0.3 || \-2.85 || 0 |

    | 19950118 || \-2.45 || \-4.25 || \-2.5  || \-1.8 || 0 |

    | 19950119 || \-2 || 1.35 || \-1.7 || \-1.35 || 0 |

    | 19950120 || \-1 || \-1.4 || \-1.4 || \-0.45 || 0 |

    | 19950123 || \-2.4 || \-0.95  || 3.2 || 2.7 || 1 |

    | 19950124 || 4 || 3.45 || \-0.9 || \-0.25 || 0 |

    | 19950125 || 0.2 || 0.2 || 0.1 || 0.65 || 1 |

    | 19950126 || 0.6 || 0.5 || \-0.05 || \-0.4 || 0 |

    | 19950127 || \-0.6 || 0.1 || 6.25 || 3.25 || 1 |

    | 19950130 || 4.5 || 3.7 || \-1.2 || 1.25 || 0 |

    | 19950131 || 0.3 || 0.6 || 1.3 || 1.9 || 1 |

    | 19950201 || 1.7 || 0.7 || 0.4 || \-1.1 || 0 |

    | 19950202 || \-1.2 || 0.2 || \-1.5 || \-0.05 || 0 |

    | 19950203 || \-0.35 || \-0.4 || 0.3 || \-0.05 || 0 |

