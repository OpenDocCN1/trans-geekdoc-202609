    The pooling operation when applied to inputs with multiple channels is applied
    independently to each channel. The output therefore has the same number of channels
    as the input.


    The typical setup for convolutional neural networks could look something like
    Figure 10.16:


    ![](images/00148.jpeg)


    Figure 10. 16 Full convolution setup


    In figure 10.16 We start off with an input of dimension `1×100`, say the returns
    of the previous `100` days. We pass this through six filters; each filter has
    a dimension of `1×5`. The dimension of the output is `1×(100−5+1) = 1×96` and
    since there are `six` filters, we stack each of their respective outputs, resulting
    in an output of dimension `1×96×6`.


    We then pass this output through a max pooling layer with `f =2` and `stride s
    =2`. The pooling operator does not change the number of channels, which have been
    set to `6`. The max pooling reduces the dimension from `1×96×6` to `1×[(96−2)/2+1]×6
    = 1×48×6`.


    We then pass this `1×48×6` output through `10` filters - each of size `1×10` -
    but this time, we use a stride of `2`, which results in an output of dimension
    `(1× (48−10)/2 +1×10) = 1×20×10`.


    We then flatten this two-dimensional representation into a one-dimensional vector,
    which simply has a length of `1*20*10 = 200`. This is then passed through a regular
    fully connected multi-layered perceptron with `20` neurons. The weight matrix
    connecting the flattened vector to this fully connected dense layer will be of
    dimension `20*200 = 4000` parameters.


    Finally, the output of the `20` neurons is passed to the `softmax` function, which
    helps us predict whether the market goes up or down.


    The aforementioned is a general setup with numerous hyper parameters, requiring
    a thorough random search.


    Let us take a concrete example.


