    \n![](images/00136.jpeg)\n\nFigure 10. 12 Multiple filter convolution\n\nWe can\
    \ stack these three vectors as a 1 × 5 × 3 matrix Figure 10.13.\n\n![](images/00137.jpeg)\n\
    \nFigure 10. 13 Stacking the output of Multiple filter convolution\n\nSo, whenever\
    \ we convolve 1× n with 1×f with m filters, we get 1× (n − f+1) ×m\n\nAgain, the\
    \ analogy to a chartist would be that the chartist for instance may have the 20,\
    \ 50, and 100 day moving averages always loading up on her charts. In a CNN, one\
    \ filter really captures “one shape”. Using multiple filters allows us to have\
    \ the capability to learn multiple “shapes” that may impact the target.\n\n##\
    \ Multiple Channels as the Input\n\nOur input could be multi-dimensional, of the\
    \ form 1×n×m.Say we have a vector U as 1×6×3.Where,\n\nvector 1 × 6 × 1 is \n\n\
    ![](images/00138.gif)\n\nvector 1 × 6 × 2 is \n\n![](images/00139.gif)\n\nvector\
    \ 1 × 6 × 3 is\n\n![](images/00140.gif)\n\nThis U is a three-dimensional vector;\
    \ the last dimension is the depth or the number of channels, which in this case\
    \ is 3.\n\nThe filter f we design needs to have the same depth or channels as\
    \ our input vector U, so that each filter can be applied to the whole image. Let\
