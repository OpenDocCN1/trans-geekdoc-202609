    LSTM retains the `GU`, which is the update gate. The role of `(1 – GU)` or the
    forget gate is modelled separately as:


    `GF = Sigmoid (WF\[C(t−1), X(t−1)\] + bF)`


    Therefore, the update of the memory is written as:


    `C(t) = GU*At + (GF)\* C(t−1)`


