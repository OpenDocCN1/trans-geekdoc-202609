    \n[References](#part0000_split_113.html#_Toc40435966)\n\n# CHAPTER ONE -    \n\
    \nINTRODUCTION\n\n## It is the Best of Times…\n\nThe subject of Artificial Intelligence\
    \ (AI), or Machine Learning (ML), has been adequately researched since the 1960s,\
    \ if not earlier, and it has recently received a lot of attention once again.\
    \ While there could be several reasons for that (advances in computing, deep learning,\
    \ and so on), what is most exciting for us is the disruptive nature of technology\
    \ companies such as Google, Facebook, Coursera, etc.\n\nSignificant advances in\
    \ technology, cutting-edge research, and discoveries daily are now readily available\
    \ to anyone who cares to find out. The economy of sharing gives individuals and\
    \ companies access to tools and information for research and product development,\
    \ which would have only been available to a handful a few years ago.\n\nThe rising\
    \ productivity and lowering barriers to entry have left many industries vulnerable\
    \ to the threat of disruption. That, of course, is the opportunity; the challenge,\
    \ however, is access to high-quality data.\n\nIn this chapter, we will take a\
    \ look at some of the trading concepts that AI can handle.\n\nLearning Objectives:\n\
    \nBy the end of this chapter, you will be able to:\n\n*   Explain how AI can be\
    \ used in trading to quantify trading ideas and for improving existing quant strategies.\n\
    \n*   Identify inputs that can go into a machine trying to trade momentum.\n\n\
    *   Hypothesize and analyze to improve the performance of a carry portfolio.\n\
    \n## Trading\n\nAI provides a generalized framework for quantifying our thoughts.\
    \ While algorithmic trading has always used statistical tools, AI provides a set\
    \ of tools that could quantify almost any trading idea. That, however, does not\
    \ mean that the AI-based solution will necessarily be better or most optimal.\n\
    \nIn our experience, AI is most suitable for problems where:\n\n*   The volume\
    \ of data is huge. How huge is huge? Empirically and speaking entirely from our\
    \ experience, we saw benefits of using deep learning models as we increased our\
    \ sample size from tens of thousands to 20–30 million.\n\n*   The signal is weak,\
    \ and the noise is high. We risk generalizing here but for most problems in trading,\
    \ this is the case."
