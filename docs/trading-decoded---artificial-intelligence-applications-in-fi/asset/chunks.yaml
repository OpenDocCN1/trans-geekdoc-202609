    \ the reason behind why an algorithm works and why it does not. Before we discuss\
    \ these considerations in more detail, let us discuss which validation methods\
    \ are generally adopted.\n\n## Validation Strategies\n\n### Separate validation\
    \ data set\n\nWe divide the entire universe of data into three unequal parts,\
    \ namely train, validation, and test. The training data generally is 60–75% of\
    \ the entire set; the balance is split equally between test and validation data.\
    \ The more important consideration is the validation data, which should be similar\
    \ in distribution and characteristics to test data. This method of validation\
    \ is simple and robust. However, there are two limitations.\n\n- Expensive: The\
    \ training is forced to happen on a smaller data set, as about 20% is being kept\
    \ aside for validation.\n- Regime-specific model selection: Let us say you are\
    \ designing a strategy to trade gold futures based on end of day data. The previous\
    \ 20 years would give us about 5000 samples, 3000 of which we keep for training,\
    \ 750 for validation, and 750 for test. Generally speaking, 3000 samples will\
    \ never be enough for most AI algorithms and definitely not enough for deep learning\
    \ algorithms. Furthermore, we are forced to keep 3 years of samples aside for\
    \ validation. More importantly, if our validation data included 2009, 2010, 2011\
    \ and the test data included 2012, 2013, 2014, then the validation period for\
    \ most part was a quiet upward trend (except for a short period in 2011) and the\
    \ test data were primarily a downward trend. The problem with this kind of setup\
    \ is that the validation data is inherently different in characteristics to the\
    \ test data, thereby models expected to perform well on the validation data may\
    \ actually perform poorly on the test data.\n\nk-fold cross validation helps us\
    \ address both these concerns.\n\n### k-fold cross validation\n\n1. We divide\
    \ the universe of data into train and test. The validation data is derived from\
    \ the training data in the following manner: We RANDOMLY divide the training data\
    \ into `K(=3)` equal parts, and call them A, B, and C. Then we perform three operations.\n\
    \n- Train the model on datasets A and B and validate on dataset C.\n- Train the\
    \ model on datasets A and C and validate on dataset B.\n- Train the model on datasets\
    \ B and C and validate on dataset A.\n\nK can assume any value like 3,5, and 10.\
    \ This is how most software packages would implement it. K-fold cross validation\
    \ datasets can be created with few lines of code.\n\n![A picture containing knife,\
    \ table Description automatically generated](images/00018.jpeg)\n\nThis splits\
    \ the original data into difference subsets.\n\nIt may be obvious to the reader\
    \ that this process of validation does address the two limitations discussed in\
    \ the previous section. For most financial data sets however, this process is\
    \ wrong and fails at multiple levels.\n\nWe have done things in the aforementioned\
    \ process on the validation data, which we would not be able to do if the validation\
    \ data were treated as our test data. We have also exposed our self to allowing\
    \ leakages to occur between the training and validation data.\n\nLet us take a\
    \ simple example to get the intuition.\n\nIn our very small training data of 2\
    \ months, spanning January 1, 2018 to February 28, 2018, let us say we are trying\
    \ to predict what the market did 5 days later. The target is set to “1” if it\
    \ went higher, “−1” if it went lower, else it is set to ”0”. As features, all\
    \ that we are providing is the daily market return for the previous 5 days.\n\n\
    1. By RANDOMLY assigning samples from our training into `k = 3` folds, we may\
    \ very often be using data from the future to predict the past. That is something\
    \ we obviously cannot do if our validation data were treated like our test data,\
    \ or data that we are to see in the future. Therefore, we want to avoid RANDOM\
    \ selection of samples into each fold.\n2. Independence of data splits: To understand\
    \ this better, let us look at the following example: \n\n| FOLD | TRAIN DATA |\n\
    | --- | --- |\n| A | 1-Jan-18 | 2-Jan-18 | 3-Jan-18 | 4-Jan-18 | 5-Jan-18 | 8-Jan-18\
    \ | 9-Jan-18 | 10-Jan-18 | 11-Jan-18 | 12-Jan-18 | 15-Jan-18 |\n| | VALIDATION\
    \ DATA………… | |\n| B | 16-Jan-18 | 17-Jan-18 | 18-Jan-18 | 19-Jan-18 | 22-Jan-18\
    \ | | | | | | |\n\nFigure 3. 1 Example of training and validation dates, which\
    \ violate the independent part of the IID criteria.\n\nA visual representation\
    \ of our training and validation dates for a particular fold is shown in Figure\
    \ 3.1 for calendar year 2018. The target for January 15(last day of our training\
    \ data) is known only on January 22. At this point, we need to ask ourselves the\
    \ ephemeral question: Can we use training data up to January 15 and predict the\
    \ validation data on January 16? The answer is an obvious ‘no’ because on January\
    \ 16, we do not know the targets for samples from January 9 to January 15. The\
    \ information between January 9 and January 15 cannot be used for learning to\
    \ predict an outcome on January 16. This definitely needs to be accounted for\
    \ when including January 16 in our validation data. However, as stated earlier\
    \ while designing our validation data set, we should look at it as a test data\
    \ set. If it can serve as a test data set, it can serve as a validation data set.\n"
