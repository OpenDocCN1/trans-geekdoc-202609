    # DNA dataset


    On the basis of our methodology, we partitioned the dataset into two parts. The
    first part is a simulated dataset containing random information from over 10000
    sequences to analyze the noise characteristics. The second part consists of 100000
    encoded sequences. The two datasets were generated by Twistsose and Biosilent,
    respectively, and adapted at different orientations for the synthesis and sequencing
    steps to ensure they are as independent.


    To examine our approach on different sequencing techniques, we used two datasets
    of different modalities: the DNA dataset with 5 million reads and 55000 encoded
    sequences. The second is a compressed (zip) file with multiple 24-channel signal,
    from Nanopore long read, and a fast5 file. The size of this compressed file is
    about 1.5 MB.


    To examine our approach on different sequencing techniques, we used one Illumina
    using Bmaa and one Nanopore Min with Illumina 528,336 sequences for the first
    dataset, with an error rate of 0.079 and an average cluster size of 529. The second
    dataset has 3,215,249 reads, with a 0.123% error rate and an average cluster size
    of 29.


    For the first dataset, the partitioned dataset produced 2,807,205 reads, with
    an error rate of 4.6% and an average cluster size of 75. The second dataset was
    used to ensure the error rate was sufficiently large. The first method produced
