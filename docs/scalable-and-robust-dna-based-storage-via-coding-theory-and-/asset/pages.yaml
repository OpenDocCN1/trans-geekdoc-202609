    # Conclusions


    In this article, we present a method for DNA-based storage that overcomes some
    of the major bottlenecks in DNA storage by balancing failure rate and redundancy.
    Our method improves the sequence retrieval without compromising redundancy on
    performance. Our solution reduces the ECC redundancy and the required number of
    reads for error-recovery of the information. Our results show that DNN can improve
    the decoding process in a DNA-based storage system and throughput. Our perspective,
    DNN-ECC approach overcomes a major bottleneck on the path to large-scale applications
    of DNA-based storage.


    # Methods


    Our method is end-to-end to handle the information retrieval process as shown
    in Fig. 1. As part of this approach, it is divided into several components, each
    with its own functionality: decoding, reconstruction, clustering of reads before
    sequences and decoding back to the different components. In addition, the interface
    and interplay between the different components were also considered as part of
    a complete system, optimized solution. The solution combines coding theory and
    deep machine learning to handle errors and coherent molecule to decode and decode
    the DNA.


