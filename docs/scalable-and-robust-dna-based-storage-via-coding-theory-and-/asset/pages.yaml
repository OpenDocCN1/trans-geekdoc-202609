    strands (such as oligos) are produced per sequence. The length of the strands
    is produced is typically bounded by 200–300 nucleotides to achieve an acceptable
    error rate. The synthesized strands are then stored in a container in vitro. The
    data is retrieved from the storage, amplified by PCR and then used by a DNA sequencer.
