  md: "# Article\n\nAfter the NCBI aligner, the model includes an embedding model\
    \ whose architecture corresponds to the aligner; however, operations are performed\
    \ on the whole cluster and not on each independently. The goal is to learn consistency\
    \ between different reads and prepare the data for the transformer. The embedding\
    \ module outputs a sequence with a larger feature space.\n\nThe transformer is\
    \ a multhead transformer architecture, using multihead attention to represent\
    \ 'words'. After this fashion, a linear layer is used to decode the number of\
    \ features to reduce, representing one-hot encoding for the DNA representation.\n\
    \nThe fusion layer is a vector of learnable features with a length of two. This\
    \ shrinks the consistency between the two reads into a single representation through\
    \ a softmax operator, which transforms consistency into probabilities. Additional\
    \ details and details are provided in the Supplementary Information.\n\nThe vertices\
    \ in the graph are the symbols of the first or second read that were predicted\
    \ based on the calculations. The graph connects any two vertices that correspond\
    \ to symbols that occur in the clusters. The weights of the edge are defined based\
    \ on the consistency of the two connected vertices in the editor versions. The\
    \ algorithm follows the path with maximum probability based on the algorithm's\
    \ estimations.\n\nConfidence filter and safety. One of the keys in our suggested\
    \ solution is the confidence filter, which is a function that allows us to decide\
    \ whether to trust the DNN's output. The confidence filter consists of two parts:\
    \ the first classifying erroneous DNN outputs as missing. This is achieved by\
    \ considering sequences which reduces redundancy rather than correcting sequences\
    \ of entries. The second purpose is to decide which of the clusters should be\
    \ sent to the CLI.\n\nThe main component of the confidence filter is a confidence\
    \ function that operates on the soft output of the DNN. The output of the DNN\
    \ is a n x 4 matrix, where the fourth entry of each row is the probability that\
    \ the predicted symbol is correct. This probability represents the consistency\
    \ between the reads in the cluster.\n\nIn confidence we utilize this property,\
    \ specifically, the arithmetic mean of the maximum value in each cluster, which\
    \ represents the probability that the predicted symbol is correct. This is calculated\
    \ by taking the maximum of m values in each row of the DNN matrix, where m(M)\
    \ corresponds to the consistency when the DNN is not in confident output.\n\n\
    Another property that is considered in the confidence filter is the cluster size.\
    \ More precisely, our confidence filter considers that the confidence score of\
    \ smaller clusters, with lower signal-to-noise ratio, tends to be lower in general\
    \ and integrates this into the final filtering decision. The confidence function\
    \ is defined as\n\n> $c(M, cluster) \\le c_{threshold} \\times cluster_{threshold}$\n\
    \nThe confidence filter evaluates the following:\n\n+   1. If $c(cluster) \\le\
    \ confidence_{threshold}$ and $cluster \\le cluster_{threshold}$, then the cluster\
    \ is classified as absent (that is, missing).\n2. Otherwise, it is included in\
    \ the pipeline,\n\n> $c(M, cluster) \\le confidence_{threshold}$\nand $cluster\
    \ \\le cluster_{threshold}$\n\nthen the cluster is passed to the CLI.\n\nLoss\
    \ function. To train a model of cluster assignment and consistency loss was low\
    \ and as shown in the following:\n\n```\n$L = L_{cluster} + L_{consistency}$\n\
    \\nL_{consistency} = \\frac{1}{2} \\sum y_{ij}log_{ij}$,\\n\\nL_{consistency}\
    \ = 0.5 \\times (L_{consistency}(Left Branch) + L_{consistency}(Right Branch))$\n\
    ```\n\nTraining data. Data generation and training was implemented in PyTorch,\
    \ the Adam optimizer was used with $\beta_1=0.9$, $\beta_2=0.999$, learning rate-rate\
    \ and batch size 64 were used to create synthetic cluster data from $10^{-3}$\
    \ to 341. A100 GPU used for training. Training took 50 epochs and 80 epochs for\
    \ the Nanopore experiment, each containing M clusters and an average of N reads\
    \ per cluster.\n\nCPL. The algorithm is a sequence reconstruction used with low\
    \ confidence from the DNN. The algorithm receives a cluster and decides to reconstruct\
    \ its sequence. The cluster is sent to the CLI if the cluster has low confidence,\
    \ or the DNN predictions of these sequences are not correct. We built to not use\
    \ either the inference provided by the DNN nor the prior knowledge of the consistency\
    \ and synthesis error rates. The algorithm works directly as they were obtained\
    \ by the cluster\n\nFirst, the first read of the cluster is taken, and then dynamic\
    \ programming to calculate the distance of the first read from any of the other\
    \ reads. This step is used to estimate the alignment. On the basis of this calculation,\
    \ the algorithm creates vectors of editor operations (deletions, insertions and\
    \ substitutions) that describe how to transform the first read to any of the other\
    \ reads in the cluster using edit operations. Editor versions return estimations\
    \ of the number of occurrences of each error in the cluster and their locations.\
    \ Then, the algorithm creates a acyclic graph based on these estimations of the\
    \ errors.\n\nThe optimization for the accuracy versus run-time tradeoff is controlled\
    \ by the values of $confidence_{threshold}$, $cluster_{threshold}$ and was performed\
    \ during the pilot tests. The performance of the DNN on the Illumina dataset was\
    \ good but not good enough. Therefore we used the $confidence_{threshold}$ from\
    \ 0.1 to 0.3 and the performance of the DNN on the Nanopore single flow required\
    \ additional mechanisms to ensure successful information retrieval and a robust\
    \ safety margin. We chose a safety margin of 1%, which yielded the values of a\
    \ $confidence_{threshold}$ of 0.7 and $cluster_{threshold}$ of 4. Evaluation was\
    \ performed on the test datasets provided in the Supplementary information."
