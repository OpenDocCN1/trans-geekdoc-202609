    # Coding scheme


    One of the merits of DNA-based storage is high data density, meaning extremely
    large files. To create a scalable storage system we must be able to quickly access
    random accesses. Our suggested solution allows us to do not require the entire
    file to be processed synchronously and design our method to process data in smaller
    batches, however our solution can be adapted to handle 1.5392 MB into 558 encoded
    sequences. Each sequence consists of 14-bit index, data, and a 4-bit checksum
    that serves as a filter. The 128 remainber bits were used for the binary data
    and the redundancy from the ECC and constructed code. Length was chosen to allow
    for efficient DNN processing on our GPU during the reconstruction


    Our coding scheme is a modular pipeline composed of several components, each addressing
    a different part of index: index decoding, constructed encoding and TP code. The
    complete encoding and decoding scheme is designed to integrate these four components
    in an interleaving order that allows each of them to achieve their goal without
    degrading the overall performance.


    There are three main considerations in the design of our coding scheme. First,
    our solution assumes that the decoding is possible after the clustering and reconstruction
    designs. These designs eliminate most of the deletions and insertion errors, and
    then the coding scheme should handle the length of the deletions and insertions.
    Here we need to take care of outlying errors and missing clusters or use a confidence
    filter, which is essential because a high number of error-free predictions can
    be used to correct a small fraction of the predictions, allowing for a reduction
    in the redundancy that would be needed to ensure error-free reconstruction of
    the data.'
