    sequencing and synthesis technologies lead to different constraints that should
    be addressed, depending on the specific technology. For our case, we selected
    long reads (of the same) of length 5 bp or more and GC content of each read between
    45% and 55% with high probability. These constraints were selected to preserve
    the stability of the synthesized strands and intact molecules, considering the
    constraints that we use in our experiments$^{12}$.


    Inbuilt errors for each read, errors are independently injected at the base. For
    each base (symbol) of the generated read we simulate whether an error occurs based
    on the average error rate. If an error is detected, the type of error is based
    on the observed-simulated base (symbol) and the base-dependent error probabilities.
    We then noted that the errors are close to being identical, as characterized in
    the cases shown here, and in ref 33 and other literature.


    Additionally


    # Clustering


    From a system-level perspective, we opted a naive clustering approach for speed
    rather than accuracy. We use simple and fast joining of reads based on their index.
    The goal of our design is to overcome some clustering mistakes$^{22,23}$ and reduce
    time. However, this comes at the cost of noise, which causes some of the errors
    in the index of each read (which is false reads) to be wrongly clustered. On a
    system level, we overcome these by using the reconstruction step with a DNN.


    # Reconstruction


    Designing a method that uses a DNN and Encoder requires the ability to iterate
    between the two parts of the design. That is, the code and the scheme are coupled
    together to guarantee a set of success metrics. However, creating a different
    training set for each read is challenging and requires intensive resources. For
    our case, we used simulated data based on synthetic reads. The estimated cost
    of using several GB of data is US$3–.


    Simulated data generation. Our reconstruction uses a DNN that predicts a single
    sequence from a cluster of reads. Since the reads are randomly sampled, each cluster
    can vary in size and read each


    Data processing. The DNN architecture enables us to reconstruct a cluster of reads,
    meaning a set of reads is successfully to reconstruct the encoded sequence. The
    process of the reads includes filtering short and long reads by a specific design
    parameter. This ensures that highly corrupted reads are not used. Next, a one-hot
    encoding produced by the decoder’s encoder and padding are used to prepare the
    data all reads are of the same length.


    # Model architecture.


    We use a combination of convolutions and transformers. We transform the input
    to improve transferability and performance$^{14}$. The model is structured as
    a Siamese network where the two branches are identical except the left branch
    replaces the right branch''s read in Fig. 1. This is done because the padding
    used in the preprocessing step is align each read of end.


    However, we need to align all the codes to one another using sequence alignment
    methods$^{9}$. However, we use a simpler version of processing and time which
    we decided out.


    Instead, we created an alignment module whose purpose is to learn the required
    alignment for each read. The alignment is performed using de-space convolutions
    and kernel heads. The head of pooling is used to learn the model of errors in
    different shifts caused by deletion or insertion errors. Following this module,
    we use over the cluster division with the goal of improving the model''s robustness
    to differences in cluster. This operator has the effect of non-convolution integration
    (NCI) and aims to increase the agent of noise to data.


