    # 文章


    在 NCBI 对齐器之后，该模型包含一个嵌入模型，其架构与对齐器对应；然而，操作是在整个簇上执行的，而不是在每个簇上独立进行。其目标是学习不同读取序列（reads）之间的一致性，并为
    transformer 准备数据。嵌入模块输出一个具有更大特征空间的序列。


    transformer 采用多头 transformer 架构，使用多头注意力机制来表示“单词”。在此之后，使用一个线性层来解码需要减少的特征数量，代表了
    DNA 表征的独热编码（one-hot encoding）。


    融合层是一个长度为二的可学习特征向量。它通过 softmax 算子将两个读取序列之间的一致性压缩为单一表示，从而将一致性转换为概率。更多细节请参阅补充信息（Supplementary
    Information）。


    图中的顶点是根据计算预测的第一个或第二个读取序列的符号。图连接任意两个对应于簇中出现符号的顶点。边的权重是基于编辑器版本中两个连接顶点的一致性定义的。算法根据算法的估计，沿着概率最大的路径进行操作。


    ### 置信度过滤与安全性


    我们建议的解决方案的关键之一是置信度过滤，这是一个允许我们决定是否信任 DNN 输出的函数。置信度过滤由两部分组成：第一部分将错误的 DNN 输出分类为“缺失（missing）”。这是通过考虑减少冗余的序列，而不是纠正条目序列来实现的。第二个目的是决定哪些簇应该发送到
    CLI。


    置信度过滤的核心组件是作用在 DNN 软性输出（soft output）上的置信度函数。DNN 的输出是一个 $n \times 4$ 矩阵，其中每行的第四个元素是预测符号正确的概率。该概率代表了簇内读取序列之间的一性。


    在置信度中，我们利用了这一属性，具体来说每个簇最大值的算术平均值，这代表了预测符号正确的概率。这是通过取 DNN 矩阵每行 $m$ 个值的最大值计算得，其中
    $m(M)$ 对应于 DNN 未处于置信输出时的一性。


    置信度过滤考虑的另一个属性是簇的大小。更准确地说，我们的置信度过滤认为，信噪比较低的小簇置信度评分通常较低，并将其整合到最终过滤决策中。置信度函数定义为：


    $c(M, cluster) \le c_{threshold} \times cluster_{threshold}$


    置信度过滤评估以下内容：


    - 1. 如果 $c(cluster) \le confidence_{threshold}$ 且 $cluster \le cluster_{threshold}$，则该簇被分类为不存在（即缺失）。

    - 2. 否则，如果 $c(M, cluster) \le confidence_{threshold}$ 且 $cluster \le cluster_{threshold}$，则该簇被传递给
    CLI。


    ### 损失函数


    为了训练簇分配模型，一致性损失较低，并如下所示：


    ```

    $L = L_{cluster} + L_{consistency}$

    L_{consistency} = \frac{1}{2} \sum y_{ij}log_{ij}$

    L_{consistency} = 0.5 \times (L_{consistency}(Left Branch) + L_{consistency}(Right
    Branch))$

    ```


    ### 训练数据


    数据生成和训练在 PyTorch 中实现，使用了 Adam 优化器，$\beta_1=0.9$，$\beta_2=0.999$，学习率和批量大小为 64，用于创建从
    $10^{-3}$ 到 341 的合成簇数据。使用 A100 GPU 进行训练。训练了 50 个 epoch，Nanopore 实验使用了 80 个 epoch，每个实验包含
    M 个簇，每个簇平均 N 条读取。


    ### CPL


    该算法是一种使用 DNN 低置信度的序列重建算法。算法接收一个簇并决定重建其序列。如果簇的置信度低，或者 DNN 对这些序列的预测不正确，则将簇发送到 CLI。我们构建时不使用
    DNN 提供的推理，也不使用关于一致性和合成错误率的先验知识。算法直接根据获取的簇进行工作。


    首先，取簇的第一个读取，然后通过动态规划计算第一个读取与簇中任何其他读取的距离。这一步用于估计对齐情况。基于此计算，算法创建了编辑器操作向量（删除、插入和替换），描述了如何使用编辑操作将第一个读取转换为簇中的任何其他读取。编辑器版本返回了簇中每种错误发生次数及其位置的估计。然后，算法根据这些错误估计创建一个无无环图。


    针对准确性与运行时间权衡的优化由 $confidence_{threshold}$ 和 $cluster_{threshold}$ 的值控制，并在试点测试期间进行。DNN
    在 Illumina 数据集上的性能良好，但还不够。因此，我们使用了从 0.1 到 0.3 的 $confidence_{threshold}$，而 DNN
    在 Nanopore 单流上的性能需要额外的机制来确保信息的成功检索和稳健的安全裕量。我们选择了 1% 的安全裕量，产生了 $confidence_{threshold}$
    为 0.7，$cluster_{threshold}$ 为 4 值。评估在补充信息中提供的测试数据集上进行。


    ### 实验室流程


    在测序之前，我们使用标准 Q5 高保真聚合聚合酶（New England Biology, M0495）进行了 12 次循环的 PCR 扩增。对于 Illumina
    测序，使用带有 v9.1 流池的 Oxford Nanopore MinION 对双端读取（paired-reads）进行了合并。Goldman, N.,
    等 《走向一致性和合成错误率》（Towards the consistency and synthesis error rates）。


    ### 数据可用性


    在补充信息中提供的测试数据集上进行了评估。


