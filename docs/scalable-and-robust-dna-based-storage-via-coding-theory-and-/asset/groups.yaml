    # 自然机器智能 (nature machine intelligence)


    文章


    https://doi.org/10.1038/s42256-025-01003-z


    # 基于编码理论和深度学习的可扩展且稳健的 DNA 存储


    接收于：2024年6月12日


    Daniella Bar-Lev<sup>1,3}, Itai Orr<sup>1,2,3}, Omer Samaby<sup>1,3}, Tuvi Etzion<sup>1</sup>
    & Eitan Yaakobi<sup>1</sup>


    接收：2025年1月23日


    在线发表：2025年2月21日


    全球数据领域正呈指数级增长，预计到2025年将达到180 泽字节（zettabytes），而目前的技术预计无法以同样的速度扩展。基于 DNA 的存储成为填补这一差距的关键解决方案，使数字信息能够存储在
    DNA 分子中。这种方法与磁存储和光存储解决方案相比具有许多优势，例如极高的存储密度、增强的耐用性以及维持数据完整性时几乎可以忽略的功耗。为了访问数据，需要采用信息检索过程，其中主要的瓶颈是可扩展性和准确性，长期数据研究在两者之间进行权衡。在这里，我们展示了一种模块化的整体方法，它将在模拟数据上训练的深度神经网络、张量积纠错码和安全机制整合进单一的流水线中。我们利用两种不同的测序技术在
    3 MB 的信息上演示了我们的解决方案。我们的工作相比现有方案有了改进：速度提高了 300 倍，准确性提高了 40%，并且在高噪声环境下的码率达到了每字节
    1.6 位。从更广泛的意义上说，我们的工作为受不便检索过程限制的 DNA 存储解决方案提供了一条可行的路径。


    在人工智能、互联网、广泛的网络连接以及互联设备数量增加的推动下，全球数据领域正面临不可持续的增长。虽然全球数据领域预计在 2025 年达到 180 泽字节，但由于容量限制，目前的存储技术无法在相似的空间内扩展。为了满足对数字资源的迫切需求，我们正在转向基于
    DNA 的存储等创新，通过提供调节数据密度和耐用性的方案来提供长期存储能力。


    DNA 分子由四种称为核苷酸碱基组成：腺嘌呤（A）、鸟嘌呤（G）和胸嘧啶（T）。DNA 链（即寡核苷酸链）是核苷酸的有序序列。化学合成任何可能的链的能力使得在
    DNA 分子上存储数据成为可能。


    标准的体外 DNA 存储流水线包含图 1 所示的步骤。二进制数据被编码为 4 字母表上的序列，这些被称为编码序列。序列通过 DNA 合成进行合成。由于目前的合成技术无法防止突变，每个序列会产生多条链（如寡核苷酸链）。产生的链长度通常限制在
    200–300 个核苷酸，以达到可接受的错误率。合成后的链存储在体外容器中。数据从存储中检索，通过 PCR 扩增，然后用于 DNA 测序仪。测序仪处理链并生成读取（reads），这些是
    DNA 字母表中序列的表示。在此阶段，数据是以无序的方式混合的。这阻碍了原始信息的恢复。


    *这些作者贡献相同：Daniella Bar-Lev, Itai Orr, Omer Samaby, 邮箱：daniel@cs.technion.il; itai@gmail.com;omersaby@cs.technion.il*

    *以色列特拉维理工学院计算机系，以色列海法。Uvey Ltd.，以色列特拉维夫。*

