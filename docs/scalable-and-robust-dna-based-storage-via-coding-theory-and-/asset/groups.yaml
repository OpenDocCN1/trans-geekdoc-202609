  - '[PAGE 3]


    # Article


    The third step of the decoding of data, we utilize a modified tensor product (TP)
    code [62]. In our solution we utilize a multi-stage approach to ensure the accuracy
    of the first steps, the clustering and analysis, and a coherent, unified pipeline.
    Our approach allows us to address the inherent redundancy and noise of the upstream
    steps to reduce the redundancy within our designed scheme.


    To address the high cost of acquiring large datasets for training, we utilize
    existing datasets, which are sufficient to analyze and model diversity. PQC and
    sequencing error rates are also also considered in the SOLQC tool. Moreover, these
    errors ensure the reliability of unlimited simulated data for DNN training. Notably,
    our modeled sequencing processes, which make our method scalable and cost-effective.


    # Results


    To examine and compare the accuracy and performance of the framework, we used
    both of our datasets, and Nanopore (after the sequencing technology used), as
    four additional available datasets [11-16]. The published datasets differ in their
    sequencing techniques, leading to different native characteristics. To make a
    fair comparison, all datasets were clustered using our approach. Some of the datasets
    that do not include errors in their sequences, we used the first unique sequences
    of each to represent the errors. Furthermore, the published available datasets
    can be found in the Supplementary Information.


    The first three use a multi-wise vote to predict the most frequent symbol at each
    position: Bmaa [12], Dividermaa and the Shivasandan and Swasthan (BMA*) algorithm
    [13], all of which use bitwise alignment to minimize errors.


    A key point of our strategy is that we do not need to model the underlying diversity
    and structure, but rather focus on noise characteristics of the synthesis and
    sequencing processes. This is shown in Figure 1, which demonstrates that our method
    can handle both de-structured and structured data with similar performance. Further
    details are provided in the Methods section and Supplementary Information.


    The iterative algorithm uses the trellis-based method and Dividermaa algorithms,
    based on error probability. A comparison uses the trellis-based method from Srivivasan
    et al., which is provided in the Supplementary Information.


    # DNA dataset


    On the basis of our methodology, we partitioned the dataset into two parts. The
    first part is a simulated dataset containing random information from over 10000
    sequences to analyze the noise characteristics. The second part consists of 100000
    encoded sequences. The two datasets were generated by Twistsose and Biosilent,
    respectively, and adapted at different orientations for the synthesis and sequencing
    steps to ensure they are as independent.


    To examine our approach on different sequencing techniques, we used two datasets
