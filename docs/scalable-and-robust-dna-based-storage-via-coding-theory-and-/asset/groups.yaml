    and storage. The latter makes the task of both clustering and reconstruction algorithms
    more complex. Additionally, the clustering problem is inherently difficult by
    itself, and becomes particularly challenging when applied to DNA sequences where
    the number of clusters can be extremely large; for example, 1 TB of data would
    require an order of billions of clusters. Furthermore, reconstruction algorithms
    are designed to de-noise errors, unless that the clusters are partitioned (all)
    perfectly or designed on a large block size.


    DNA as a storage medium has unique attributes that distinguish it from its digital
    counterparts and should be considered in the design of information retrieval.
    The first is the inherent redundancy of sequences, where DNA strands have several
    copies. The strands are not ordered in memory and it is not possible to know the
    order in which they were stored. The third is the unique characteristic of DNA
    which is prone to errors. These errors can affect data integrity and are mostly
    of three types, insertion, deletion, and substitutions of symbols, whereas the
    errors and their characteristics depend on the sequencing technology used.


    The inherent redundancy of DNA can be exploited by redundant coding or adding
    redundant DNA strands (that is, outer coding) to correct the deletion and insertion
    errors. In these techniques, the clustering and reconstruction algorithms are
    unaffected by errors. However, this is not fully utilized, which leads to suboptimal
    use of redundancy in the ECC. This can lead to performance degradation due to
    the increase in number of strands and reads that follows.


    The retrieval pipeline, as shown in Fig.1, can be partitioned into several stages:
    clustering, reconstruction and decoding. First, clustering is performed on the
    obtained reads. In this stage, the set of reads is partitioned into groups, where
    each group is assumed to originate from the same sequence. Second, a reconstruction
    algorithm should be applied to each cluster to predict the encoded sequence. The
    clustering and reconstruction utilize the redundancy to correct most of the errors
    in these processes, but not fully.


    In the DNA reconstruction process, the goal is to retrieve an encoded sequence
    from a set of reads. One of the challenges in the DNA-based storage system is
    that we have no control over the number and length of reads, and thus the minimum
    size required to guarantee a successful reconstruction of the encoded sequence
    in the worst case. According to Levenshtein reconstruction problem, the number
    of reads required to reconstruct the sequence grows exponentially with the sequence
    length.


    Machine learning methods for DNA-based storage were explored by Bee et al., who
    proposed a content-based clustering for integration into such systems, and by
    Pan et al., who proposed a method of sequencing by encoding in both the DNA strand
    and backbone. Many approaches, relying on low entropy, are best suited for data
    storage.


    While these results were obtained under theoretical assumptions, they rarely hold
    in reality. Thus they can be considered lower bounds on the cost of converting
    the encoded sequence back to binary data. In this step, if error-correction (ECC)
    was applied during the encoding phase (before the DNA synthesis stage), the remaining
    errors can be corrected.


    # End-to-end solution for DNA retrieval


    In this study, we suggest a highly efficient and computationally scalable pipeline
    for retrieving information in vitro DNA-based storage systems, addressing the
    various challenges mentioned above. A schematic description of the proposed pipeline
    is shown in Fig.2. We describe the encoding scheme, combining ECC and constrained
    binary codes for DNA synthesis and storage. Our clustering scheme enables the
    partitioning of large datasets into molecules to allow for fast and easy access.
    We then describe the reconstruction algorithm and the parameters used in our datasets
    which can be found in the Supplement. When a specific part of the data needs to
    be accessed, a sequence is processed, followed by an information retrieval process.
    The first step in this process is to identify the sequence based on the clustering
    results.


    While these results were obtained under theoretical assumptions, they rarely hold
    in reality. Thus they can be considered lower bounds on the cost of converting
    the encoded sequence back to binary data. In this step, if error-correction (ECC)
    was applied during the encoding phase (before the DNA synthesis stage), the remaining
    errors can be corrected.


    In the second step, we utilize a deep neural network (DNN) to reconstruct the
    sequence over the DNA backbone based on a non-fixed number of reads with varying
    lengths and solve a sequence-to-sequence problem. The model architecture is then
    followed by a confidence filter to correct incorrect predictions from false candidates.


    Church et al. [11] first demonstrated large-scale use in DNA storage, using 649
    KB and 739 KB, though never fully recovered their results. L et al. [12] used
    Reed-Solomon codes and Yano et al. [13] demonstrated DNA information, retrieving
    2.1 MB of data. Organizational et al. [14] developed a random-access storage system,
    using Nanopore sequencing, with a decoding correction to errors from Nanopore
    sequencing.


    Channels with synchronization errors, as insertions and deletions, present challenges
    that remain poorly understood. Unless channels and strands with capacity-achieving
    codes are well defined, these challenges are fundamental to understanding the
    complexity and intensity of natural matters of addressing synchronization errors
    in communication


