    # Article


    After the NCBI aligner, the model includes an embedding model whose architecture
    corresponds to the aligner; however, operations are performed on the whole cluster
    and not on each independently. The goal is to learn consistency between different
    reads and prepare the data for the transformer. The embedding module outputs a
    sequence with a larger feature space.


    The transformer is a multhead transformer architecture, using multi-head attention
    to represent ''words''. After this fashion, a linear layer is used to decode the
    number of features to reduce, representing one-hot encoding for the DNA representation.


    The fusion layer is a vector of learnable features with a length of two. This
    shrinks the consistency between the two reads into a single representation through
    a softmax operator, which transforms consistency into probabilities. Additional
    details and details are provided in the Supplementary Information.


    The vertices in the graph are the symbols of the first or second read that were
    predicted based on the calculations. The graph connects any two vertices that
    correspond to symbols that occur in the clusters. The weights of the edge are
    defined based on the consistency of the two connected vertices in the editor versions.
    The algorithm follows the path with maximum probability based on the algorithm''s
    estimations.


    ### Confidence filter and safety


    One of the keys in our suggested solution is the confidence filter, which is a
    function that allows us to decide whether to trust the DNN''s output. The confidence
    filter consists of two parts: the first classifying erroneous DNN outputs as missing.
    This is achieved by considering sequences which reduces redundancy rather than
    correcting sequences of entries. The second purpose is to decide which of the
    clusters should be sent to the CLI.


    The main component of the confidence filter is a confidence function that operates
    on the soft output of the DNN. The output of the DNN is an n x 4 matrix, where
    the fourth entry of each row is the probability that the predicted symbol is correct.
    This probability represents the consistency between the reads in the cluster.


    In confidence we utilize this property, specifically, the arithmetic mean of the
    maximum value in each cluster, which represents the probability that the predicted
    symbol is correct. This is calculated by taking the maximum of m values in each
    row of the DNN matrix, where m(M) corresponds to the consistency when the DNN
    is not in confident output.


    Another property that is considered in the confidence filter is the cluster size.
    More precisely, our confidence filter considers that the confidence score of smaller
    clusters, with lower signal-to-noise ratio, tends to be lower in general and integrates
    this into the final filtering decision. The confidence function is defined as:


    $c(M, cluster) \le c_{threshold} \times cluster_{threshold}$


    The confidence filter evaluates the following:


    - 1. If $c(cluster) \le confidence_{threshold}$ and $cluster \le cluster_{threshold}$,
    then the cluster is classified as absent (that is, missing).

    - 2. Otherwise, it is included in the pipeline, if $c(M, cluster) \le confidence_{threshold}$
    and $cluster \le cluster_{threshold}$, then the cluster is passed to the CLI.


    ### Loss function


    To train a model of cluster assignment and consistency loss was low and as shown
    in the following:


    ```

    $L = L_{cluster} + L_{consistency}$

    L_{consistency} = \frac{1}{2} \sum y_{ij}log_{ij}$

    L_{consistency} = 0.5 \times (L_{consistency}(Left Branch) + L_{consistency}(Right
    Branch))$

    ```


    ### Training data


    Data generation and training was implemented in PyTorch, the Adam optimizer was
    used with $\beta_1=0.9$, $\beta_2=0.999$, learning rate and batch size 64 were
    used to create synthetic cluster data from $10^{-3}$ to 341. A100 GPU used for
    training. Training took 50 epochs and 80 epochs for the Nanopore experiment, each
    containing M clusters and an average of N reads per cluster.


    ### CPL


    The algorithm is a sequence reconstruction used with low confidence from the DNN.
    The algorithm receives a cluster and decides to reconstruct its sequence. The
    cluster is sent to the CLI if the cluster has low confidence, or the DNN predictions
    of these sequences are not correct. We built to not use either the inference provided
    by the DNN nor the prior knowledge of the consistency and synthesis error rates.
    The algorithm works directly as they were obtained by the cluster.


    First, the first read of the cluster is taken, and then dynamic programming to
    calculate the distance of the first read from any of the other reads. This step
    is used to estimate the alignment. On the basis of this calculation, the algorithm
    creates vectors of editor operations (deletions, insertions and substitutions)
    that describe how to transform the first read to any of the other reads in the
    cluster using edit operations. Editor versions return estimations of the number
    of occurrences of each error in the cluster and their locations. Then, the algorithm
    creates a acyclic graph based on these estimations of the errors.


    The optimization for the accuracy versus run-time tradeoff is controlled by the
    values of $confidence_{threshold}$, $cluster_{threshold}$ and was performed during
    the pilot tests. The performance of the DNN on the Illumina dataset was good but
    not good enough. Therefore we used the $confidence_{threshold}$ from 0.1 to 0.3
    and the performance of the DNN on the Nanopore single flow required additional
    mechanisms to ensure successful information retrieval and a robust safety margin.
    We chose a safety margin of 1%, which yielded the values of a $confidence_{threshold}$
    of 0.7 and $cluster_{threshold}$ of 4. Evaluation was performed on the test datasets
    provided in the Supplementary information.


    ### Laboratory procedures


    Before sequencing, we performed PCR amplification using standard Q5 High Fidelity
    polymerase (New England Biology, M0495) for 12 cycles. For Illumina sequencing,
    the paired-reads were merged using the Oxford Nanopore MinION with flowcell v9.1.
    Goldman, N., et al. Towards high-capacity information storage in DNA. Nature 44,
    779-782 (2008).


    ### Data availability


    The datasets created and used in this Article are available at Zenodo: https://zenodo.org/1239873.
    The synthetic data used to create the trained data is available at https://github.com/itaitor/DNA-based-generator
    (ref. 51). The publicly available datasets used in study are available from the
    following:


    - Class et al., available at Zenodo: https://zenodo.org/1429075 (ref. 52).

    - Friedrich et al., available at https://doi.org/10.1038/s41586-022-33 (ref. 53).

    - Yan et al., available at NCBI: https://doi.org/10.1038/s41586-021-33 (ref. 54).

    - Chen et al., available at GitHub: https://github.com/msifcout/cluster-nanopore-datasets.
    The datasets used for de novo binning are available at Zenodo: https://zenodo.org/1469588
    (ref. 55).

    - With additional information on previous data experiments to be provided upon
    request.

    - Hall, J., Heckel, R., Puddu, M., Paunescu, D., & Stark, W. Robust chemical representation
    of genetic information on DNA in silico with error-correction codes. Angew Chem.
    Int. Ed. 54, 2552–2555 (2015).

    - Macillain, F., & Sloane, N. J. The Theory of Error-Correction for DNA. Science
    354, ea1133 (2016).


    ### Code availability


    The code used for this work is available at GitHub: https://github.com/itaitor/DNA-based-generator
    (ref. 51). Erlich, Y., & Zaleisel, D. DNA enables a robust and efficient storage.
    Science 355, 950–954 (2017). Organik, L., et al. Access to large-scale DNA storage.
    Biotechnology. 38, 242–248 (2020). Yan, Y., Kim, M. R., Mitchell, A., & Milester,
    O. Optimal approach for error-free DNA-based storage. Sci. Rep. 7, 5011 (2017).
    Wang, Y et al. High capacity DNA storage with variable-length oligonucleotides
    using repeat code and hybrid mapping. J. Mol. 13, 1–13 (2021).


    ### References


    1. Rydner, R. D. J. G., Reinzel, J., & Gant, J. The Digitization from Edge to
    Code (International Data Corporation, 2018).

    2. Ler, C., et al. Synthetic DNA applications in information technology. Nature
    Communications 11, 1–9 (2020).

    3. Cave, L., Nilai, V., & Strauss, K. Molecular data storage using DNA. Nat. Rev.
    Genet. 20, 455–469 (2016).

    4. Lehrout, E. M., et al. Synthesis of high-quality libraries of long (>150 nm)
    oligonucleotides by a new controlled polymerization process. Nature Methods 2020.

    5. Decker, R., Mitchell, Y., & Grace, R. R. A characterization of the DNA data
    channel. Sci. Rep. 9, 90653 (2019).

    6. Srivasan, N. R., Go, S. P., Fisher, H. D., & Wexman, Y. Trellis codes: Code-based
    correction for HDR channels on DNA data. In 2021 IEEE International Symposium
    on Information Technology (ISIT) (Dec.), pp. Bay 2453–2458 (2021). https://doi.org/10.1109/ISIT52233.2021.9577332

    7. Anavy, I., Lavakin, K., Otar, K. Next-generation information storage in DNA.
    Science 373, 1628–1628 (2021).

    8. Yan, Y., et al. High-capacity information storage in DNA. Biotechnology 38,
