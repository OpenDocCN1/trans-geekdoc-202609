    The global sphere is expanding exponentially, projected to hit 180 zettabytes
    by 2025, whereas current technologies are not anticipated to scale at nearly the
    same rate. DNA-based storage emerges as a crucial solution to this gap, enabling
    digital information to be archived in DNA molecules. This method enjoys many advantages
    over magnetic and optical storage solutions such as exceptional density, enhanced
    durability and negligible power consumption to maintain data integrity. To access
    the data, an information retrieval process is employed, where some of the main
    bottlenecks are the scalability and accuracy, which long-term data researches
    are a tradeoff between the two. Here we show a modular and holistic approach that
    combines deep neural networks trained on simulated data, tensor product error-correcting
    codes and a safety mechanism into a single coherent pipeline. We demonstrated
    our solution on 3 MB of information using two different sequencing techniques.
    Our work improves upon the current solutions with 300× increase in speed and 40%
    improvement in accuracy and order code rate of 1.6 bits per byte in a high-noise
    environment. In a broader sense, our work shows a viable path to DNA storage solutions
    hindered by inconvenient retrieval processes.


