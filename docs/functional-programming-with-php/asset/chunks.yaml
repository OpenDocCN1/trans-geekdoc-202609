    ### 列表类型检查 (List Type Checking)


    随着语言增加了变长参数，现在可以在函数上以非常原始的方式检查数组内容的类型提示。它对于 `PHP` 对象的一维数组有效，可以确保数组中的每个值都是特定类型，仅此而已。为了实现这一点，我们将使用变长参数和
