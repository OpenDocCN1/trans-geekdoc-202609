  trans: "\n在编写任何代码之前，规划 API 完成后的样子会很有帮助。实现此点的一种简单方法是列出你打算创建的命名空间。对于 HTML 来说，这可能像如下的命名空间列表：\n\
    \n* `\\FpPhp\\Utils`\n* `\\FpPhp\\Html\\Html4`\n* `\\FpPhp\\Html\\Html5`\n\n然后在每个命名空间下面，列出可能需要的函数就会变得更容易。在当前的示例中，这可能像下面的命名空间分组列表：\n\
    \n* `\\FpPhp\\Utils`\n    * `ensure_array`\n* `\\FpPhp\\Html\\Html4`\n    * `div`\n\
    \    * `a`\n* `\\FpPhp\\Html\\Html5`\n    * `section`\n    * `aside`\n\n虽然列表中不可避免地可以添加更多函数，但为了简洁起见，这里只包含了示例中要实现的那些函数。\n\
    \n我通常会在代码中进行这些功能的草图绘制，在代码中定义命名空间并在下方包含函数存根（stub）。这样，它们很容易移动，而且在进行实现时，部分工作已经完成了。与此同时，我还会开始为添加到命名空间中的函数编写单元测试。这允许我在开发过程中轻松地确保函数产生我预期的结果，并且有一个额外的好处：重构可以变得更容易。\n\
    \n首先，我们将创建 `Utils` 命名空间，它将包含我们可能想要重用的或并非专门用于生成 HTML 的函数。\n\n**列表 7.2**\n\n```\n\
    ```\n```\n```\n\n对于这个特定项目，我们需要一个简单的函数，给定一个值并确保它是一个数组，如果不是，则将其封装在数组中：`ensure_array()`。\n\
    \n下一个命名空间将是 `Html4`，它在我们的领域语言中实现 `div` 和 `a` 标签。\n\n**列表 7.3**\n\n```\n```\n```\n\
    ```\n\n如你在列表 7.3 所示，它实际上使用了另一个命名空间 `\\FpPhp\\Html`，并在 `div()` 和 `a()` 函数中调用了其内部的方法。这个底层命名空间将包含\
    \ `Html4` 和 `Html5` 在生成各自标签时将使用的函数。标签函数本身（`a()` 和 `div()`）实际上非常简单，所有的工作都交给了 `\\\
    FpPhp\\Html` 中的函数库。\n\n下一步是创建那个底层函数库——哦，还有一个用于存储 HTML 标签属性值的类（`Attribute`）。首先，我们将实现\
    \ `\\FpPhp\\Html` 命名空间，以便我们可以向其中添加函数：\n\n```\n```\n```\n```\n\n我们将首先向命名空间中添加一个简单的类，作为\
    \ HTML 属性（`class`、`href`、`style` 等）的容器。在这里使用类是必要的，因为我们稍后需要对属性值进行类型检查，并且它是预处理和存储结构化数据的良好方式。\n\
    \n**列表 7.4**\n\n```\n```\n```\n```\n\n构造函数是向结构中添加数据的唯一方法，这有效地创建了一个不可变结构，意味着我们可以拦截该值。我们需要该值为数组，所以我们使用列表\
    \ 7.2 中的 `Utils\\ensure_array()` 函数，这样任何标量值都会转换为数组元素。\n\n为每个属性创建一个新的 `Attribute`\
    \ 实例并不辛苦，但像任何优秀的程序员一样，我们是懒的，所以我们将添加一个名为 `attr()` 的函数。这个函数将作为一个工厂，简化创建新 `Attribute`\
    \ 实例的过程。\n\n```\n```\n```\n```\n\n传入一个名称和一个值（标量或数组）将为你返回一个包含该信息的 `Attribute` 类的新实例。使用这组代码为领域语言创建新属性的工作就到此结束了。接下来，我们将定义创建新标签并将其关联\
    \ `Attribute` 处理为 HTML 就绪字符串的函数。`tag()` 函数将生成一个新标签，这是一个非常好的起点。\n\n**列表 7.5**\n\
    \n```\n```\n```\n```\n\n当提供一个类型（`section`、`div` 等）和一些内容时，`tag()` 函数将产生一个 HTML\
    \ 标签。所以，如果你用 `div` 类型的类型和 `sawubona` 作为内容调用它，它将输出 `<<div>>sawubona</</div>`。这真的非常简单，这一个函数通过将名称作为类型（如\
    \ `div`、`section` 或 `a`）就可以轻松创建任何类型的 HTML 标签。\n\n那么属性数组呢？这里在处理 `Attribute` 实例时变得稍微复杂了一些，我们将其交给另一个函数\
    \ `attrs_to_html()`，以将问题拆分为更集中的函数。这是使用更严格的函数式风格编程的一个方便特性之一，因为它会自动为你留下更多可重用的函数。\n\
    \n**列表 7.6**\n\n```\n```\n```\n```\n\n在列表 7.7 中，`attrs_to_html()` 被定义为一个接受单个数组作为输入的函数，该数组应该包含\
    \ `Attribute` 实例。如果数组不为空，它将使用 `array_map()` 对数组中的每个值执行一个函数，然后将输出合并为用空格分隔的字符串。当\
    \ `$attrs` 为空时，`attrs_to_html()` 函数将简单地返回一个空字符串。现在，到下一个函数 `attr_to_html()`，它由\
    \ `attrs_to_html()` 针对每个 `Attribute` 实例调用。\n\n**列表 7.7**\n\n```\n```\n```\n```\n\
    \n实际上，`attr_to_html()` 是另一个函数，它将工作交给 `render_attr()` 以转换为 HTML 属性。\n\n**列表 7.8**\n\
    \n```\n```\n```\n```\n\n这就是 `FpPhp\\Html` 命名空间的全部内容了。在移动 `FpPhp\\Html\\Html5`\
    \ 命名空间之前，我们可能应该测试代码以确保它运行。\n\n**列表 7.10**\n\n```\n```\n```\n```\n\n如列表 7.10 中的\
    \ `div` 示例所示，使用这个简单的 DSL 生成 HTML 是容易的。通过封装 `tag()` 函数，你可以快速地向语言添加新标签并通过相同的通用接口使用它们。\n\
    \n为了这个目标，我们为之前提到的 HTML5 命名空间添加一些方法如何？\n\n**列表 7.1**\n\n``````\n\n```\n```\n\n\
    与之前的 HTML4 示例一样，列表 7.11 只是为 DSL 添加了两个新标签，你可以创建 `section` 和 `aside` 标签。在任一命名空间中实现\
    \ `script`、`nav` 或 `main` 标签都是轻而易举的。我发现引入新功能的简单方法是与其一起编写单元测试——本书一直使用 Sebastian\
    \ Bergmann 的 PHPUnit\n\n作为最后一个示例，我们将使用现在可以在 `HTML4` 和 `HTML5` 命名空间使用的领域语言函数创建一个简单的嵌套\
    \ HTML 片段。列表 7.12 创建了一个非常简单的 HTML 片段，描述了一篇带有侧边导航的文章。\n\n**列表 7.12**\n\n```\n```\n\
    ```\n"
