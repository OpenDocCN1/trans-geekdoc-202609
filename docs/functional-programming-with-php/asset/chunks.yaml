    addresses. In the case of a simple office intranet we could then allow the whole
    office in, but be more explicit with their home addresses. After all, we don’t
    want any old person with the same internet service provider getting in!


    To this end we will add a couple of partial IP addresses to the white list:


    ```


    ```


    The `array_filter` must also be changed to allow it to handle matching these new
    partial IP addresses against the users IP address.


    ```


    ```


    In order to handle partial IP addresses the function takes a substring (same length
    as the white list value) of the current user’s IP address and compares it against
    the white list value. A small complication, but one that is easy to add.


    So there you have it, a simple IP v4 white list checking script in three lines
    of code! OK, so you probably aren’t going to want to put this into production,
    but it does serve as a nice simple self-contained example, albeit with side effects
    (`die()`).


    ## 7.2 Functional Primitives


    ### The Setup


    Let’s run through a few examples of how these features could potentially be combined
    to assist in reporting for a vehicle repair business. Please see the code sample
    below for the base set of data all of these operations will be working upon.


    **Listing 7.1**


    ```


    ```


    The initial setup is simple enough, so let’s go ahead and pull in the vendor autoloader
    from Composer and the functional-php namespace:


    ```


    ```


    Another small piece of housekeeping also needs to be completed so we can make
    a more functional `uasort()` available to our program. Unfortunately, PHP edits
    the array in place and does not return the sorted array, but a Boolean value.
    This, of course, violates our pact to ensure all data in our functional program
    is immutable, so this wrapping function goes part of the way to rectifying it.


    ```


    ```


    ### Sort and Pluck


    Let’s keep it simple for the first example by pulling out the highest vehicle
    mileage in the records. A handy hint for you when reading nested function calls
    like this is it’s best to read from the inside out.


    ```


    ```


    First, `F\pluck()` is called to return an array of the mileage elements from the
    service logs. At this point, the value the program is operating on becomes:


    ```


    ```


    This functionality is available in PHP 5.5 under the name `array_column()` as
    the related RFC


    However, let’s get back to our odometer reading example. The next function to
    operate on the service logs is a sorting algorithm using the custom `functional_sort()`
    which we defined earlier. Then finally, `F\first()` grabs the top record off the
    stack and assigns the value `91234` to the `$highest_odometer_reading` variable.


    ### Reduction


    Cutting the data another way makes it possible to calculate the total profit the
    garage has made on the service work it has performed. Again, take a look at the
    first code sample in this chapter for the origin of the `$charge_per_hour` and
    `$overhead_per_hour` variables used in the algorithm closure.


    ```


    ```


    The code is simply using a reduce to go through each service record, calculating
    the profit on each job and adding it to the accumulating `$result` variable. When
    the value is finally assigned to `$profit`, it is a single float of `6825.38`.
    You may have noticed this function does not take into account the cost to the
    business of the parts (in the example, `parts_cost` is the cost for the customer)–this
    is just to simplify the example code.


    The `F\reduce_left()` function is functionally equivalent to PHP’s native `array_reduce()`,
    except like the rest of functional-php, it can operate on objects implementing
    `Traversable`. The library also makes `F\reduce_right()` available with the difference
    being it begins reducing from the last element in the collection whereas `F\reduce_left()`
    begins with the first element in the collection.


    It is possible to make some improvements to the program by factoring out the profit
    calculation code into a separate closure which can be reused.


    ```


    ```


    Now we can tighten up the collection processing functionality as well by using
    three functions from functional-php.


    ```


    ```


    Beginning with the inner functions first and working outwards, `F\pluck()` is
    used to pull the `hours` and `parts_cost` elements from each service log record.
    `F\zip()` is then employed to combine the two resulting arrays using the `$calculate_profit`
    closure as the combining operation and returns an array containing the profit
    subtotal for every service log record. These subtotals are then totaled up into
    one final profit total, which is then returned as a float from `F\sum()` and assigned
    to `$profit2`.


    ### Filtering with Partials


    Often, customers will want to obtain a complete list of the service history for
    their vehicle or a vehicle they have recently purchased. With the assistance of
    some filtering combined with a sorting algorithm, it is possible to return an
    array of service logs ordered by odometer reading for a particular vehicle registration
    number.


    ```


    ```


    Initially, the service logs are filtered down to only those matching the vehicle
    registration which has been passed in using `F\filter()` with a callback closure
    function. The resulting array is then ordered by each service record’s odometer
    reading with an ascending sort.


    To make it easier to use this function, we can bind the `$service_logs` variable
    to the function using the React/Partial function application library.


    ```


    ```


    It is then possible to easily obtain the records for a vehicle registration number
    by calling `$get_by_rego()`.


    ```


    ```


    This could also be implemented using functional-php’s `F\group()` function to
    first group all the records by a vehicle registration number instead of `F\filter()`,
    but this would be less efficient in terms of memory usage as the array would be
    much larger.


    From these highly contrived examples, you can see some of the ways functional
    primitives and higher order functions can be combined to achieve business goals.
    They also highlight the advantages of keeping functions simple and confined to
    answering one problem each, thereby facilitating their eventual combined use and
    re-use.


    ## 7.3 A Domain Specific Language in PHP


    This may seem like an unlikely application for the PHP language given its relatively
    inflexible nature. You can’t define your own keywords and there are no infix operators
    for example. On top of this there are no decent combinators available!


    Simple languages can be expressed in terms of PHP functions though, as this example
    implementing HTML will demonstrate. HTML was chosen for the DSL (Domain Specific
    Language) as the rules should be familiar to all PHP developers. In keeping with
    the theme of ensuring simplicity this example will only implement a small subset
    of HTML. There will be just enough to demonstrate the concept and allow you to
    see how it maps functions to the varying HTML requirements.


    To make things easier, you will notice the use of objects where appropriate in
    this example code. These objects have been implemented in an almost functional
    style with no global state changes and they are not really treated as classes
    in the object oriented sense. That is to say, the objects are merely being consumed
    as typed collections. This allows our code to make assumptions about what it is
    being passed, unlike if it were passed an array, for instance. It’s a way to emulate
    a very basic type system, a feature of many functional programming languages.


    Functional programming is not necessarily the nemesis of object-oriented code,
    but it does provide a compelling alternative. Well written object-oriented code
    can almost look functional as it shares some of the fundamental concepts. Keep
    things dedicated, reusable, and with an easily implementable interface.


    Onto the example itself where HTML is the domain we wish to convert into a language
    in PHP.'
