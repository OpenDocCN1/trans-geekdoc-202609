- raw: "It is also possible to do the same with `array_reduce()` by making use of\
    \ a closure to handle the requirement for keys. We can iterate over the keys and\
    \ then obtain the value later using the key inside `$fx`.\n\n```\n\n```\n\n###\
    \ Flat Map\n\nWhen we deal with mapping over lists it is quite common that we\
    \ will want to apply a function that will return an array. The final result we\
    \ want though is just a simple one dimensional array rather than the two dimensional\
    \ array we would be returned by default.\n\nLet us start with an example of the\
    \ problem so you can easily see where this might happen in your code.\n\n```\n\
    \n```\n\nWe actually want a simple one dimensional list to be returned and this\
    \ is where our friend `flat_map()` comes into play.\n\n```\n\n```\n\nIn PHP `flat_map()`\
    \ can be defined using an `array_reduce()` to merge the results of each function\
    \ application into the first dimension. It is worth noting that a `flat_map()`\
    \ does not flatten all dimensions—just the second into the first—so if you have\
    \ a deeply nested array it will not affect the lower dimensions. If you need this\
    \ then use `flatten()` (defined later in the book) to reduce the nesting after\
    \ using `array_map()` to apply the function.\n\n```\n\n```\n\nFlat map is a very\
    \ common operation in functional programming and most languages have a specialised\
    \ flat map function to help you work through this problem. It is very handy that\
    \ the same functionality can be replicated in PHP with a quite a simple set of\
    \ code.\n\n### Filter\n\nWith the help of filtering, you can return a result set\
    \ from a list of values by applying a callback function known as a predicate to\
    \ each item in the list. The predicate will return either a Boolean false to remove\
    \ the record, or true to keep the list item in the result set. While this may\
    \ sound a little complicated, in practice, it makes cleaning lists a breeze.\n\
    \n```\n\n```\n\nIn the preceding example, we are applying a filter callback to\
    \ a simple list of integers. The callback itself checks if the supplied number\
    \ is cleanly divisible by two, which is a simple way of detecting if the value\
    \ is an even or an odd number.\n\n`array_filter()` is then used to iterate over\
    \ the array of integers and apply the callback to each value therein. This results\
    \ in a new array being returned that contains only the even numbers, being two\
    \ and four in this case.\n\n## 3.6 Memoization\n\nThe process of result caching\
    \ can help to speed up expensive operations by returning a pre-chewed set of data.\
    \ Fetching the values from a cache allows an application to skip the slow running\
    \ code and still return the correct results. The secret sauce of PHP’s memoization\
    \ is the `static` keyword, which effectively pins a variable to a resource in\
    \ memory. Any time the resource is updated in the same PHP process, the new value\
    \ is recalled on the next invocation of the function.\n\n```\n\n```\n\nThis operation\
    \ can be simplified by using the `F\\memoize()` function of the functional-php\
    \ library (discussed more in-depth later):\n\n```\nuse Functional as F;\n\n$callback_function\
    \ = function($arg) {\n   return get_some_really_expensive_data($arg);\n};\n$result\
    \ = F\\memoize($callback_function, array('php'));\n```\n\nA good example of where\
    \ this might be useful is in caching the parsing of large documents into a hash\
    \ or limiting calls to a database for a widely-reused function.\n\n## 3.7 Generators\n\
    \nWhen working with a large dataset it becomes inefficient to have the entirety\
    \ of it loaded in memory such as with an array for example. To ease this process\
    \ PHP added the generator syntax\n\nIf we look at the sum example running through\
    \ this book we can write our own version of `array_sum()` that accepts a generator\
    \ instead of an array. This function will work its way through the values contained\
    \ in the generator and sum them all together.\n\n```\n\n```\n\nYou will immediately\
    \ note nothing special appears to be going on here and you would be correct. It\
    \ is simply a `foreach` loop adding each value (`$i`) to the `$total` variable.\
    \ You could pass an array into this function and it would work just as well. The\
    \ trick is in how `$values` is populated and not how it is consumed.\n\nTo generate\
    \ some values it is necessary to write a range function which produces a generator\
    \ instead of an array. This function will look very familiar too with one simple\
    \ exception that makes this a generator.\n\n```\n\n```\n\nNote the `yield` keyword\
    \ inside the for loop—the only real deviation from any array based range function\
    \ you may write. Now we have our two base functions we can call them together\
    \ to see how they work.\n\n```\necho sum2(range2(1, 10));\n// 55\n```\n\nA more\
    \ complex and useful example of a generator is one which makes file reading more\
    \ efficient. This can be used to work on large files without reaching memory limits\
    \ or exceeding an execution timeout.\n\nThe beauty of using a generator in this\
    \ way is you create a more abstract interface for operating on a file. The consuming\
    \ code does not need to even know its operating on a file; it just knows it has\
    \ an iterator it needs to work through. This means you could use the functions\
    \ from your library you have written to work with arrays all without changing\
    \ their implementation to handle file transformations.\n\nThis could also be achieved\
    \ with PHP’s `file()` function which reads an entire file as an array, but it\
    \ would not suit large files as it would have memory consumption implications.\n\
    \n* * *\n\n1.  [PHP SuperClosure—Version 2](https://github.com/jeremeamia/super_closure)[↩](#ch006.xhtml#fnref1)\n\
    \n2.  Cyclic Redundancy Checksum polynomial of 32-bit lengths[↩](#ch006.xhtml#fnref2)\n\
    \n3.  MD5 Message-Digest Algorithm[↩](#ch006.xhtml#fnref3)\n\n4.  US Secure Hash\
    \ Algorithm 1[↩](#ch006.xhtml#fnref4)\n\n5.  US Secure Hash Algorithm 2[↩](#ch006.xhtml#fnref5)\n\
    \n6.  [PHP Generators](http://php.net/language.generators)[↩](#ch006.xhtml#fnref6)\n\
    \n# 4 Helpful Libraries\n\n> “We can only see a short distance ahead, but we can\
    \ see plenty there that needs to be done.”\n\n> \n\n> —Alan Turing (Mathematician\
    \ and Computer Scientist, 1912–1954)\n\nNow that you have seen some techniques\
    \ for manipulating data in a functional way, you are probably wondering which\
    \ primitives and higher order functions PHP has to offer in the default installation.\
    \ Unfortunately, the answer is not many, although this constantly changing as\
    \ the language evolves. To help fill this void, Lars Strojny has created a PECL\
    \ extension called functional-php\n\nMany, if not all, of the functions are inspired\
    \ by implementations of functional primitives in other languages such as JavaScript\
    \ and Scala. Unfortunately, at this stage there is no implementation of any sorting\
    \ functionality in the extension or library, but it is on the road map for the\
    \ project.\n\nNot only does functional-php have handy primitives, but it also\
    \ unifies the interface for operating on lists. All functions have the same order\
    \ of parameters, so no more hassle remembering whether it is the collection or\
    \ callback which comes first! Another very handy feature is in addition to arrays,\
    \ its functions can operate on any object that implements PHP’s `Traversable`\
    \ interface.\n\nIt is important to try to keep the API consistent with your own\
    \ code and when importing other functional libraries to facilitate easier future\
    \ maintenance.\n\nAdditionally, there is the Underscore.php\n\nAs previously mentioned\
    \ in the partial function application section, React/Partial\n\n## 4.1 Library\
    \ Installation\n\nThe main library used throughout the following code samples\
    \ is functional-php, and it can either be installed as a PHP/PECL extension or\
    \ as a userland PHP library. If you have the option, then I would suggest the\
    \ extension route, but if you can’t build or install extensions on your server,\
    \ then you can use the library. For initial playing around, you may find it easier\
    \ to opt for the library route as well. If you are following along on a Windows\
    \ machine, then install it as a library."
  fmt: "\nIt is also possible to do the same with `array_reduce()` by making use of\
    \ a closure to handle the requirement for keys. We can iterate over the keys and\
    \ then obtain the value later using the key inside `$fx`.\n\n```\n\n```\n\n```\n\
    \n### Flat Map\n\nWhen we deal with mapping over lists it is quite common that\
    \ we will want to apply a function that will return an array. The final result\
    \ we want though is just a simple one dimensional array rather than the two dimensional\
    \ array we would be returned by default.\n\nLet us start with an example of the\
    \ problem so you can easily see where this might happen in your code.\n\n```\n\
    \n```\n\n```\n\nWe actually want a simple one dimensional list to be returned\
    \ and this is where our friend `flat_map()` comes into play.\n\n```\n\n```\n\n\
    Wait, I noticed some empty code blocks. Let me re-examine the text.\n\nIn PHP\
    \ `flat_map()` can be defined using an `array_reduce()` to merge the results of\
    \ each function application into the first dimension. It is worth noting that\
    \ a `flat_map()` does not flatten all dimensions—just the second into the first—so\
    \ if you have a deeply nested array it will not affect the lower dimensions. If\
    \ you need this then use `flatten()` (defined later in the book) to reduce the\
    \ nesting after using `array_map()` to apply the function.\n\n```\n\n```\n\nFlat\
    \ map is a very common operation in functional programming and most languages\
    \ have a specialised flat map function to help you work through this problem.\
    \ It is very handy that the same functionality can be replicated in PHP with a\
    \ quite a simple set of code.\n\n### Filter\n\nWith the help of filtering, you\
    \ can return a result set from a list of values by applying a callback function\
    \ known as a predicate to each item in the list. The predicate will return either\
    \ a Boolean false to remove the record, or true to keep the list item in the result\
    \ set. While this may sound a little complicated, in practice, it makes cleaning\
    \ lists a breeze.\n\n```\n\n```\n\nIn the preceding example, we are applying a\
    \ filter callback to a simple list of integers. The callback itself checks if\
    \ the supplied number is cleanly divisible by two, which is a simple way of detecting\
    \ if the value is an even or an odd number.\n\n`array_filter()` is then used to\
    \ iterate over the array of integers and apply the callback to each value therein.\
    \ This results in a new array being returned that contains only the even numbers,\
    \ being two and four in this case.\n\n## 3.6 Memoization\n\nThe process of result\
    \ caching can help to speed up expensive operations by returning a pre-chewed\
    \ set of data. Fetching the values from a cache allows an application to skip\
    \ the slow running code and still return the correct results. The secret sauce\
    \ of PHP’s memoization is the `static` keyword, which effectively pins a variable\
    \ to a resource in memory. Any time the resource is updated in the same PHP process,\
    \ the new value is recalled on the next invocation of the function.\n\n```\n\n\
    ```\n\nThis operation can be simplified by using the `F\\memoize()` function of\
    \ the functional-php library (discussed more in-depth later):\n\n```\nuse Functional\
    \ as F;\n\n$callback_function = function($arg) {\n   return get_some_really_expensive_data($arg);\n\
    };\n$result = F\\memoize($callback_function, array('php'));\n```\n\nA good example\
    \ of where this might be useful is in caching the parsing of large documents into\
    \ a hash or limiting calls to a database for a widely-reused function.\n\n## 3.7\
    \ Generators\n\nWhen working with large datasets it becomes inefficient to have\
    \ the entirety loaded into memory. To ease this, the `yield` keyword inside `foreach`\
    \ is used.\n\n```\necho range(1, 10);\n```\n"
