    \n```\n\n```\n\n```\n\n### 扁平映射 (Flat Map)\n\n在处理列表的映射时，我们通常想要应用一个返回数组的函数。然而，我们想要的最终结果是一个简单的一维数组，而不是默认返回的二维数组。\n\
    \n让我们从一个问题示例开始，这样你就能很容易地看到这在你的代码中可能何时发生。\n\n```\n\n```\n\n```\n\n我们实际上希望返回一个简单的一维列表，这就是我们的朋友\
    \ `flat_map()` 派上用场的地方。\n\n```\n\n```\n\n```\n\n等等，我注意到有一些空代码块。让我重新检查一下文本。\n\n\
    在 PHP 中，`flat_map()` 可以使用 `array_reduce()` 来定义，将每次函数应用的结果合并到第一维度。值得注意的是，`flat_map()`\
    \ 并不会展平所有维度——仅将第二维度展平到第一维度——所以如果你有一个深度嵌套的数组，它不会影响较低的维度。如果你需要这种功能，请在使用 `array_map()`\
    \ 应用函数后，使用 `flatten()`（在书的后面定义）来减少嵌套。\n\n```\n\n```\n\nFlat map 是函数式编程中非常常见的操作，大多数语言都有专门的\
    \ flat map 函数来帮助你解决这个问题。在 PHP 中，可以使用一组非常简单的代码复制相同的功能，这非常方便。\n\n### 过滤 (Filter)\n\
    \n通过过滤的帮助，你可以由于通过对列表中的每个项应用一个称为谓词（predicate）的回调函数，从值列表中返回结果集。谓词将返回布尔值 `false`\
    \ 以移除记录，或返回 `true` 在结果集中保留列表项。虽然这听起来可能有点复杂，但在实践中，它让清理列表变得轻而易举。\n\n```\n\n```\n\
    \n在前面的示例中，我们正对一个简单的整数列表应用过滤器回调函数。回调函数本身检查提供的数字是否能被二整除，这是检测该值是偶数还是奇数的一种简单方法。\n\n\
    然后使用 `array_filter()` 遍历整数数组并对其中的每个值应用回调函数。这将返回一个新数组，该数组仅包含偶数（在本例中为二和四）。\n\n##\
    \ 3.6 记忆化 (Memoization)\n\n结果缓存过程可以通过返回一组预处理过的数据集来加速昂贵的操作。从缓存中获取值允许应用程序跳过运行缓慢的代码，并仍然返回正确的结果。PHP\
    \ 记忆化的秘密配方是 `static` 关键字，它有效地将变量固定在内存中的资源上。每当在同一个 PHP 进程中更新资源时，下次调用函数时就会召回新值。\n\
    \n```\n\n```\n\n使用 functional-php 库的 `F\\memoize()` 函数可以简化此操作（稍后将深入讨论）：\n\n```\n\
    use Functional as F;\n\n$callback_function = function($arg) {\n   return get_some_really_expensive_data($arg);\n\
    };\n$result = F\\memoize($callback_function, array('php'));\n```\n\n这种方法可能实处的良好例子是缓存将大型文档解析为哈希的过程，或者对一个广泛重用的函数限制对数据库的调用。\n\
    \n## 3.7 生成器 (Generators)\n\n在处理大型数据集时，将整个内容加载到内存中会变得低效。为了缓解这个问题，`foreach` 内部使用了\
    \ `yield` 关键字。\n\n```\necho range(1, 10);\n```\n"
