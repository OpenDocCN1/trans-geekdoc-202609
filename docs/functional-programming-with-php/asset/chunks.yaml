    ```

    ```

    ```

    ```


    遗憾的是，日志破坏了我们的函数组合并触发了 PHP 错误。


    ```

    PHP Warning:  base64_encode() expects parameter 1 to be

    string, array given

    ```


    我们的函数只接受一个字符串参数，而我们现在正尝试将一个数组塞进其中一个函数里。这是你预期 PHP 会做的，但这不是我们想要的。


    你可能立即在思考考虑绕过这种烦恼的方法。至少有一种方法围绕修改第二个函数（`$base64`），让它接受数组作为第一个参数，但这将改变函数的签名。这意味着你将无法以反序组合函数。


    你可能考虑的下一个选项是编写一个包装函数，在内部调用两个函数并合并结果。它行得通，但它没有可能达到的那么灵活——再次考虑一下未来可能需要反转组合或其他重用方法。


    相反，让我们写一个高阶 `compose` 函数专门用于处理这些函数签名。它将接受我们之前创建的两个字符串函数作为参数，并返回一个组合后的函数。


