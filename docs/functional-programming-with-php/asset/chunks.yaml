    - A programming language which runs on the Java Virtual Machine and supports both
    functional and object oriented.

    - `scalar`: A category of base types containing one value such as `int` and `string`.

    - `ternary operator`: A short form conditional statement which allows for an operation
    based on a true or false response.

    - `type`: The category a value belongs to. `10` is a type of integer, for example.

    - `type definition`: A specification of a value’s type (int, string, etc.) in
    code.

    - `type hinting`: Specification of a type in locations where a variable is passed
    in.

    - `use`: Either a call to include a specific namespace, to include a PHP trait,
    or an indication the closure wants to pull in variables from the parent scope
    at the point of definition.

    - `UTF-8`: A unicode/multibyte character standard/table.

    - `UTF-8 ellipsis`: `…`

    - `vim`: A text editor suitable for command line interfaces or terminals. Typically
    available on most Linux distributions, but available for Windows too!

    - `weak typing`: Types are transient and the compiler/parser does not care and
    may at runtime convert between types based on an inferred meaning.

    - `Windows`: A Microsoft operating system. If you are using it and following this
    book install Vagrant and run Ubuntu in a virtual machine to save yourself pain.

    - `xdebug`: The go to extension in PHP land for interactive debugging and code
    profiling.


