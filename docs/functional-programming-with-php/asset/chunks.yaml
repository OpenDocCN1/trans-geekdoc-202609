    \n**参数 (argument)**\n: 传递给子程序的值。在 PHP 函数中，该值在函数括号之间传递。也与参数 (parameter) 混用。\n\n\
    `function x($argument)`\n\n**阻塞 (blocking)**\n: 一种会停止整个应用程序进度直到其执行完成的调用。\n\n**CLI**\n\
    : 命令行界面，允许通过终端使用。\n\n**闭包 (closure)**\n: 一种可以携带上下文的*匿名函数*。\n\n**集合 (collection)**\n\
    : 参见 *匿名函数*。\n\n**大括号 (curly braces)**\n: `{}`\n\n**柯里 (Curry)**\n: 参见 *列表 (list)*。\n\
    \n**确定性的 (deterministic)**\n: 总是返回相同结果的过程。\n\n**点 (dot)**\n: `.`\n\n**Doxy**\n\
    : 从行内注释生成文档。\n\n**DSL**\n: 领域特定语言。\n\n**Erlang**\n: 一种函数式语言。\n\n**F#**\n: 一种函数式语言。\n\
    \n**一等函数 (first class functions)**\n: 可以像变量一样处理。\n\n**函数 (function)**\n: 一个子程序。\n\
    \n**函数对象 (function object)**\n: 用户态 PHP 代码。\n\n**functional-php**\n: 一个库。\n\n\
    **句号 (full stop)**\n: `.`\n\n**生成器 (generator)**\n: 一种语言结构。\n\n**关键字 (keyword)**\n\
    : 一个特殊的单词。\n\n**lambda**\n: `λ`\n\n**列表 (list)**\n: 参见 *lambda*。\n\n**单子 (monad)**\n\
    : 一种设计模式。\n\n**命名空间 (namespace)**\n 子程序的分组。\n\n**IDE**\n: 集成开发环境。\n\n**不可变性 (immutable)**\n\
    : 无法更改。\n\n**无限递归 (infinite recursion)**\n: 参见 *递归 (recursion)*。\n\n**中缀运算符 (infix\
    \ operator)**\n: 一种运算符。\n\n**IO**\n: 输入/输出。\n\n**迭代 (iter)**\n: 函数列表。\n\n**关键字\
    \ (keyword)**\n: 一个特殊的单词。\n\n**空 (null)**\n: 无值的值。\n\n**空值合并 (null coalescence)**\n\
    : `??`\n\n**OCaml**\n: 一种多范式语言。\n\n**PAAS**\n: 平台即服务。\n\n**参数 (parameter)**\n\
    : 参见 *argument*。\n\n**括号 (parentheses)**\n: `()`\n\n**偏函数应用 (partial function\
    \ application)**\n: 一种通过默认值提供参数的技术。\n\n**PEAR**\n: 早期的库管理程序。\n\n**PECL**\n: PHP\
    \ 扩展管理程序。\n\n**点 (period)**\n: `.`\n\n**PHP 扩展 (PHP extension)**\n: 用 C 语言编写的可编译扩展。\n\
    \n**PHP 库 (PHP library)**\n: 用户态代码。\n\n**PHPDoc**\n: 一种行内代码文档方法。\n\n**PHPSH**\n\
    : PHP 的 REPL。\n\n**流水线 (pipelines)**\n: 函数列表。\n\n**POSIX**\n: 一种计算机指令集。\n\n**psyPHP**\n\
    : 一个 REPL。\n\n**纯的 (pure)**\n: 具有引用透明性的函数。\n\n**React/Partial**\n: 一个用户态库。\n\n\
    **递归 (recursion)**\n: 函数调用其自身的情况。\n\n**引用透明性 (referential transparency)**\n: 可以用直接值替换输入。\n\
    \n**REPL**\n: 读-求-打印循环。\n\n**返回类型 (return type)**\n: 函数将产生的值类型。\n\n"
