    处理不可变数据之所以复杂，是因为 `PHP` 原生并不支持它，而且函数式开发者有责任确保他们不会在代码中引入状态更改。曾多次尝试过在 `PHP` 中强制执行不可变数据，但没有一个是特别令人满意的，而且它们都需要基于类的技巧，例如
    Mikko Koppanen 的 `php-immutable` 扩展。


    你现在正处于 `PHP` 的未知荒野中，不断推向可能的边界。某些事情可能是次优的或者根本无法实现，因此你需要根据自己的判断来决定在项目中何时最佳使用这些技术——如果真的适用的话。


    另一个小问题是，其他 `PHP` 开发者可能难以理解你的代码并诅咒你的名字！


