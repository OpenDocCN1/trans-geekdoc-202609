- raw: "There is no golden rule recommending functional-style programming in certain\
    \ situations or object-oriented programming in others. Functional programming\
    \ is not a framework or design pattern, but a Turing complete programming methodology.\
    \ To this end, as you familiarize yourself with functional programming, you will\
    \ develop an innate sense of when a particular methodology is best employed to\
    \ solve a problem. It is worth noting this will be different for each programming\
    \ language and working in functional programming versus object-oriented programming\
    \ in Scala is very different compared to the same in PHP.\n\nIn the PHP world,\
    \ due to the bias towards object-oriented programming, functional programming\
    \ is mostly used for list (array) processing, but it does not stop us from exploring\
    \ more complex functional constructs as you will see further on.\n\n## 2.6 The\
    \ Benefits of Functional Programming\n\nSo how does removing features from your\
    \ imperative language help you?\n\nWith the ever increasing popularity of functional\
    \ programming, it is important to keep pace. Insights gleaned from your exploration\
    \ of functional code can be applied in object-oriented programming as well.\n\n\
    One regularly quoted rule states the increase in the legibility of a program improves\
    \ as the level of abstraction rises by virtue of the succinct code it encourages.\
    \ It is also often said a side effect of these attributes is an increase in productivity\
    \ with less typing and no global state to construct in your mind, helping to free\
    \ your time for the more difficult problems.\n\nTesting your code becomes much\
    \ easier because all values are final, which means you do not have to contend\
    \ with side effects. There is no particular order to maintain or global state\
    \ which needs to be put into place. All you need to do is pass in the correct\
    \ arguments, and you will always get the same result.\n\nThis concept is often\
    \ described as referential transparency, which basically means you can replace\
    \ any function call with the value it returns, and the resulting algorithm will\
