    可。这避免了你通过包含 `$this-$that` 跳跃的 `use` 语句传递上下文。


    ## 10.2 PHP 5.5


    `5.5` 带来了新的功能列表。以下是我针对函数式编程的挑选。


    ### 生成器 (Generators)


    生成器是简单的结构，允许你在构建数组（如 `range()` 返回的数组）时引入懒加载风格的功能。


