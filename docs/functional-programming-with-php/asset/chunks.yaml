    ### Namespaces


    With `5.6` namesacing got a little easier with the ability to import a specific
    function instead of the entire namespace. Note the `function` keyword included
    in the use statement to indicate we are importing a function.


    ```


    ```


    A particularly handy aspect of this development is it’s now possible to alias
    function identifiers when they are imported.


    ```


    ```


    You can see here the function identifier is aliased at the point it is imported
    into the namespace with the `as` keyword. This essentially tells `PHP` to treat
    and call `p()` as though it is a call to `e()`.


    For the sake of completeness it is worth pointing out here the same enhancement
    brought with it the ability to import namespaced constants as well:


    ```


    ```


    Namespaces are a great way of keeping functions in distinct libraries to prevent
    naming collisions and maintain logical separations. Additionally, it is now possible
    to alias a function as it is imported to further assist in avoiding namespace
    collisions. Tragically it became evident `PHP` still does not support autoloading
    of functions and it looks unlikely to do so in the near future.


    ## 10.4 PHP 7


    Following the vote to skip the version number 6 of `PHP`, it was decided to call
    `PHPNG` (next generation) `PHP 7`. There was once a `PHP 6`, but it never saw
    the light of day and remained unmerged into the master `PHP` branch. It was cancelled
    for several reasons and some features were backported into the `PHP 5.x` branch.
    Before it got cancelled, though, a number of companies wrote books, articles,
    and blog posts about it. These are still accessible via your favorite search engine!


    The `PHP` team decided it would be too confusing to call what is now being released
    PHP 6, All those old resources would come up and they would be inaccurate. So
    the version number was consigned to history.


    A number of new features have been added to the language alongside some bug fixes
    and speed enhancements. A lot of effort has been put in by many members of the
    `PHP` language team. This has resulted in `PHP`’s greatest release yet. There
    are a few new features I will highlight here which can be useful while producing
    functional `PHP` code. It goes without saying there are plenty of other features
    and improvements to the language so if I have missed your favorite I apologize.
    Profusely.


