- raw: 'Frege’s Basic Law V described a set logic which made defining membership easy.
    Unfortunately for Frege, it also allowed Bertrand Russell to find an inconsistency.
    Famously known as Russell’s Paradox, it relayed a self-referential set: “the set
    of things x that such that x is not a member of x.” This tongue twister would
    produce a set that was simultaneously not a member and a member of itself. This
    discovery stumped Frege and left him floundering with weak arguments and workarounds
    for the issue.


    Despite this, logicians continued to work towards a system that would describe
    the entire world. In the world of philosophy this leads to the formation of the
    hugely influential Vienna circle. The assembled members would discuss the division
    of statements into near enough two categories. On one side they would include
    statements which could not be observed, and on the other those that could be.
    Anything metaphysical is meaningless and rejected as a logical mistake or reduced
    to empirical statements that could be proven by scientific investigation. An example
    of a metaphysical statement would be “all art is pointless”–it can neither be
    proven true nor false.


    During this period they employed a student to oversee the discussions by halting
    conversations leading to metaphysical discourse. Initially they would yell “Metaphysik”,
    but as Rudolph Carnap would later relay they swiftly shortened it to just “M”.
    As discussion progressed further, “he was shouting ‘M’ so much we got sick of
    it so it was changed to ‘no-M’ whenever we said something legitimate.” In other
    words, most discussions lead to a metaphysical discussion. This brought Carnap
    to the realization there could be many logics, and not just one universal logic.


    Around the same time, an eminent German mathematician named David Hilbert was
    setting out with a similar goal in the world of mathematics. In the late 1920’s
    he was passionate about solving the Entscheidungs Problem by proving everything
    can be described by mathematical logic. Hilbert was certain everything could be
    reduced to either true or false.


    Somewhat famously, in 1930 a student of the Vienna Circle, Kurt Gödel, delivered
    his completeness theorem which helped to bolster Hilbert’s hypothesis. This, however,
    was short lived when the very next day Gödel also discussed his first incompleteness
    theorem, which undermined the very foundations of Hilbert’s assertions. It is
    now universally recognized the Hilbert cohorts were incorrect and there are some
    problems logic cannot solve or describe.


    So, how did Gödel upset the apple cart? *This statement is not provable.* Simple!


    If the statement can be proven then it is false, but it states it cannot be proven
    so it must be true. This statement cannot be decided because it is both true and
    false at the same time. You’ve probably heard of a similar statement before called
    The Liar Paradox. This predates Gödel by at least 2,000 years with some sources
    suggesting roots in 600BC to 400BC. “A man says that he is lying. Is what he says
    true or false?” Over time this has been distilled down to “this sentence is false”
    and is remarkably similar to the basis of Gödel’s incompleteness theorem. This
    though, is a layman’s simplification as Gödel proved this was a paradox in all
    logic.


    He proved this to be the case across two theorems using a logic expression system
    he designed himself. This may seem like the easiest paradox to modern eyes, but
    at the time Gödel was at the cutting edge of logic. To further prove the undecideability
    of the Entschiedungs Problem it was necessary to define effective computing. This
    lead to a number of systems being devised at once.


    In 1932, the first system was proposed by Alonzo Church in the form of the lambda
    calculus. He saw the potential in his new definition and wrote:


    > “There may, indeed be other applications of the system than its use as a logic.”


    Given that lambda calculus would go on to be the foundation for functional programming
    it is certainly fair to say he was right. Using lambda calculus as a base Church
    was able to put forward a problem without an effectively calculable answer. Again,
    the simplicity is striking; given a lambda expression, determine if it will loop
    forever. It can’t be done!


    Gödel was working on his own system of logic around the same time of recursive
    functions. While it may not look the same as Gödel’s formalisms, recursion is
    a core component of functional programming.


    Also at this time Alan Turing was introduced to Gödel’s undecideability problem
    and—just as Gödel—he came to the conclusion: to work on the Entschiedungs Problem
    you must define a system of effective calculability. He devised the Turing Machine
    which could calculate all the numbers naturally considered computable. By this
    I mean numbers a human could calculate with a pencil and paper.


    This allowed Turing along with Alonzo Church to show both lambda expressions and
    Turing Machines are functionally equivalent. Working with Church, Turing would
    go on to create the first program compute lambda expressions. They wrote a paper
    together in 1937 known as the Church-Turing Thesis which showed both techniques
    were equivalent and equally justified. Turing even went so far as to say “Church’s
    calculus…allows \[Turing\] ‘Machines’ which generate computable functions to be
    replaced by the more convenient λ-definitions.” Based on this we could be daring
    and say Turing preferred functional programming! A presumptuous extrapolation
    you might say, but certainly he developed a fondness for those formalisms.


    In the 1940’s Alonzo Church was working on a paper describing typed lambda calculus
    and its formal proofs. Independently Turing was also working a similar proof which
    went unpublished, although it serves as a good indication he saw mileage in the
    techniques.


    It’s interesting to note the world received no less than four techniques to describe
    effective computation: Alonzo Church’s lambda calculus, Alan Turing’s Turing machine,
    Kurt Gödel’s recursive functions, and the hitherto undiscussed combinatory logic
    from Haskell Curry. This is no coincidence and merely a consequence of the conditions
    being right for such a set of formalisms to be produced.


    The preparatory groundwork had been completed and the world of logic was ready
    for fresh ideas and discoveries. This explains the discoveries being so close
    to each other in time, even if they did not know others were also working on the
    same ideas.


    Back to Haskell’s combinatory logic for a moment and its function composing formalisms.
    Primitive functions are combined to create more powerful constructs; a principle
    you will see throughout functional programming. Published in 1927, it predates
    the other forms from Turing et. al. by a number of years.


    There is some debate that the first to create a proof may have been a Russian
    by the name of Moses Schönfinkel. This has an effect on the name given to the
    functional programming technique of currying, too, with some suggesting it should
    be Schönfinkelization to recognize his earlier discovery. Unfortunately, the story
    of Schönfinkel is a sad one. Aside from this paper, relatively little is known
    of his work. He was a member of Hilbert’s group and it was with their assistance
    he managed to have this paper published in 1924. A few years later he moved back
    to Russia from Göttingen and reports filtered back in 1927 he was mentally ill
    and confined to a sanitarium. It is not known precisely when, but sometime during
    1942 he died a pauper.


    All his papers were burnt by his neighbors for heat, so it will never be known
    what he had been working on.'
