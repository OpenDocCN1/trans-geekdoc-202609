    \n就像 PHP 采纳 Hack 其他特性一样，如果能看到关于引入带有隐式作用域的 lambda 表达式的 RFC 将太棒了。考虑到这种特性的语言演变性质，遗憾的是，它似乎无法通过投票阶段。\n\
    \n## 5.3 特殊（魔法）属性\n\nHack 中没有与这些特殊关键字对应的 PHP 等价，这些关键字为类提供了专门的功能。它们以类似于 PHP 的 `__toString()`\
    \ 或 `__construct()` 方法的方式为类添加了自定义魔力，但它们是以注解（annotations）的形式存在的。\n\n你可以使用特殊的 `<<__Memoize>>`\
    \ 属性轻松地缓存函数结果，该属性可以添加到函数和类方法上。在后续代码中，你可以看到对返回唯一字符串的函数的两次调用，在直接函数定义上方添加 memoize\
    \ 属性时会产生相同的结果——通常情况下 `$a` 和 `$b` 是不同的。\n\n```\n<<__Memoize>>\nfunction getUniqueString():\
    \ string {\n   return uniqid();\n}\n$a = getUniqueString();\n$b = getUniqueString();\n\
    $c = ($a === $b); // true\n```\n\n这是一个非常简单的注解，可以添加到任何方法或函数上方，立即赋予其缓存属性，而无需自己自己完成任何实现。不过，关于通过此注解传递给函数或方法的参数，有几点需要注意。只有以下类型可以作为参数传递：`null`、`bool`、`int`、`float`、`string`、`IMemoizeParam`\
    \ 的实现以及包含上述任何类型的数组。此外，参数不能通过引用传递，并且在函数的括号内定义，而不是通过变长参数（varargs）访问。\n\n趣味性较低的是\
    \ `<<__Override>>` 和 `<<__ConsistentConstruct>>` 属性，它们关系到 Hack 中的类定义。第一个实现在任何类方法之前，其目的是确保你的类与其父类之间的一致性。如果父类不包含相同方法的具体实现，将触发错误。这的效果是，当你尝试从父类中重构某个方法时，它让你知道子类重写了该方法。\n\
    \n如果将 `<<__ConsistentConstruct>>` 添加到类定义上方，它的效果是告诉 Hack 解析器检查所有扩展它的类是否都使用了兼容的\
    \ `__construct()` 方法定义。有时这可能没用，你可能希望通过在 `__construct()` 方法上方添加 `<<UNSAFE_Construct>>`\
