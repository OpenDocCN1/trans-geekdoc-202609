    ## 7.1 IP 地址限制


    按照引入新主题的惯例，第一个示例在解决的问题和实现的代码方面都将保持简单。虽然代码可能永远不会进入生产环境，但它提供了一个很好的起点。阻止不在 IP 白名单中的用户访问可以通过
    PHP 的多种方式实现。这个示例将采用代码最少的方法，据我所知。


    我们需要一个 IP v4 地址代表网站用户的地址。为了让代码更容易适应 Web 服务器而不是命令行，这样做最简单的方法是使用选择的静态 IP 地址覆盖 `$_SERVER[''REMOTE_ADDR'']`。通过
    Web 服务器运行此代码时，只需删除此行即可检查实际用户的地址：


    ```

    ```

    ```


    在开始之前必须定义 IP 地址白名单以便进行检查：


    ```

    ```

    ```


    利用 `array_filter()` 验证 IP 地址非常简单。回调函数将检查用户的 IP 地址是否匹配白名单中的任何项。


    Array filter 将针对 IP 地址白名单执行，因此该函数应该接受一个 IP 地址作为参数，如下：


    ```

    ```

    ```


    最后，代码对 `array_filter()` 的结果应用了短三运算符。这意味着如果列表为空，则没有匹配，用户应该被拒绝访问，这目前通过简单的 `die()`
    实现。如果数组包含内容，则表示有匹配，允许用户继续，因此此处代码什么都不做并继续执行。


    如果也能验证部分 IP 地址该多好了？


