    还可以将封装的函数应用到一个或多个封装的值上。


    ## 6.10 Monads


    将这个想法进一步延伸，你就接触到了单子（monads）的概念。在理解了泛子和 applicative 之后，你应该能够更容易上手单子的内部操作，所以如果你还没有良好掌握这些概念，我建议你在继续这里之前回顾一下它们。


    Monad 是一个很难理解的概念，而与之相关的三个法则只会加深围绕它们的误解。为了降低学习曲线，我将放弃形式主义，专注于结果。这可能不是纯函数代码，但主意是让你走上理解单
    ad 的道路。首先，让我们解决显而易见的问题。经常提到的使用 monad 的理由是你可以维护状态，但这只是益处之一。它们还提供了一种可重复的方法来使用起初互不兼容的函数。


    与纯函数语言相比，Monad 在 PHP 中并不一定那么有用。在 PHP 中，有其他方法可以处理 monad 解决的问题，并且得到了语言更好的支持。然而，尽管这并不一定直接对应真实世界的用例，但并不意味着不应该使用熟悉的编程语言来探索和学习。这是一个某种隐秘的秘密：任何拥有闭包和匿名函数的语言都可以产生
    monads！


    涵盖 monads 的意图希望构建出模拟，这样如果你想探索它们，这些模拟将帮助你理解函数式语言中的类似概念。谁知道呢，也许你以后在某个时刻会在 PHP 项目中发现它们非常有用。


    在说完免责声明后，让我们深入研究定义 monad 的核心原则。有三条通用法则，但我们稍后会处理这些，因为它们使其更难理解。Monad 是一种设计模式，函数在接收到封装的值时会返回一个封装的值，没有这样的规则来限制我们的这位新朋友。它可以接收一个返回不同上下文的函数，并使其屈服。


    Monad 实际上并没有操作容器中的任何值，因为那是你要求它执行的函数的工作。就像 applicative 一样，它只知道如何应用提供的函数，但实际上并没有定义任何变异逻辑。


    为了简单起见，在 PHP 中构建任何 monad 时，我们必须记住以下指南。Monad 维护一个容器——我们已经看到的容器示例是我们之前定义的 `Just`
    泛子。


    此外，monad 定义了两个函数，允许我们操作受保护的容器。第一个是向上述容器中注入一个值的函数。在 Haskell 中，它被定义为 `return`，但我们将它命名为
    `pack()`，因为它在我脑海中更清楚地描述了动作，我们正在将值封装到容器中。


    最后，当我们对对存储容器中的值应用函数时，我们将使用名为 `map()` 的方法，它等同于 Haskell 的 `bind()`。


    现在你有了关于 monad 是什么及其各种组成部分的 Basic 。所有 monad 都定义了这些基础，但当然，它们都有自己的实现细节，可能会暴露其他方法供使用。


