    ```由于 `pack()` 方法没有被重写，因此与我们已经为 `Only` 使用的相同，让我们直接跳过它，专注于 `map()` 中的微调——`mapAndPack()`。如果结果是空的（`isNothing()`
    将稍后定义），则 monad 直接返回自身。如果容器中有真实值，则应用该函数并返回封装在 `Maybe` 上下文中新值。


    `isNothing()` 方法本身只是检查包含的值是否为空，并根据其状态返回布尔值。


    一旦定义了 `getOrElse()` 方法，`Maybe` 会变得更有趣，因为它允许在容器为空时返回默认值，或者在有值时返回包含的值。为了演示此功能的实际运行，这里是使用
    `Maybe` monad 代替命令式 `if else` 实现的命令式示例。


    ```


    ```


    ```正如命令式示例一样，当没有可用行时，此代码将 echo“Name: Unknown”。如果有记录，它将显示“Name: verified”。在这种情况下使用
    monad 的优势在于它可以与其他函数应用链式调用，添加已验证标签的代码可以在其他地方轻松复用，而且代码显然更易读、编写更简单。


