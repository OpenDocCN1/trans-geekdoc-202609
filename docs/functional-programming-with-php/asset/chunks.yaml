    # 5 HHVM 的 Hack


    > “我从未和任何人进行过数学对话，因为我的领域没有其他人。”


    >


    > —Alonzo Church（数学家和逻辑学家，1903–1995）


    Facebook 多年来一直使用 PHP，但随着网站人数的增长，加载时间也随增加。为了加速 PHP，他们编写了一个内部专用的转换器，可以将 PHP 的一个子集转换为
    C 程序。这导致了更快的加载速度，但使用起来非常困难，并且需要内部知识才能正确运行。随着时间的推移，这种方法变得越来越不可行，编译时间越来越长。最终启动了一个新项目，该项目被称为
    HipHop Virtual Machine，简称 HHVM。它是一个即时解析器，在程序执行时创建高效的缓存表示。为了获得最佳性能，必须通过运行目标代码多次来预热此缓存，以便
    HHVM 获取最理想的代码视图。需要注意的是，JIT 部分在命令行上不会增强性能，因为每次调用都会使用新的缓存。


    除了这个新的更快的运行时，Facebook 还需要在语言中添加一些功能。这已经变成了 Hack 语言。这些语言本质上是相同的，Hack 是 PHP 的一个分支，尽管它有自己的运行时。


    要通知编译器您在使用 Hack 而不是 PHP，您只需使用 `<?hh` 作为起始标签而不是 `<?php`。HHVM 会看到此标签并按 Hack 而不是直接
    PHP 代码。在这些标签内部，您可以像使用 PHP 那样执行操作，但随着将代码逐渐重构为 Hack，可以从改进的 JIT 中获益。PHP 支持的一些功能 HHVM
    故意省略了，因为它们在 PHP 野外的实际实现是有限的。为了确保达到合理的等效，Facebook 选择了一些开源项目来编译单元测试。

    '
