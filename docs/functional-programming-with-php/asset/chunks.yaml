    Programming languages like PHP utilize a type system just like this, where the
    type is inferred from the value assigned to the variable. If you assign the word
    `"test"` to a variable, PHP will automatically infer the type should be a `string`.
    This, however, is just half of the story of dynamic typing. Other languages use
    a system where you specify the type of a variable at the point of its definition.
    Yet other languages use a combination of them both.


    In PHP there are the following scalar data types available to the parser. Scalar
    types are the most basic type and include simple things such as numbers and text.


    * `Boolean`—`true` or `false`

    * `integer`—Whole numbers (including negative numbers)

    * `float`—Floating point numbers (decimals)

    * `double`—Alias of `float`

    * `string`—Textual information


    As the needs of a program become more complex, values must be increased in power
    to accommodate their compound nature.


    * `array`—Ordered map or key/value list

    * `object`—Instance of a class


    Finally, PHP also has some special types it defines for specific language features.


    * `resource`—A reference to an external resource such as a file handle

    * `NULL`—Represents a variable with no value

    * `callable`—As of PHP 5.4 a variable to can be treated as a function


    None of these types can be explicitly set as a type directly on a PHP variable.
    As mentioned earlier if you set a variable to be a whole number PHP will automatically
    make the variable a type of `integer`.


    PHP does offer casts, which can make it possible to cause the type of the value
    to change. For example, if you cast a string of `"10"` to an integer the PHP parser
    will convert the type of the value to an integer (10) like so:


    ```

    ```

    ```


    This can be especially useful when trying to trigger a class’s `__toString()`
    method.


    ```

    ```


    Available casts include to `string`, `integer`, `double`, `float`, `array`, `object`
    and `boolean`. To determine the cast operator you require, you can use the following
    list.


    | type | cast operator |

    | --- | --- |

    | boolean | `(bool)` |

    | integer | `(int)` |

    | float | `(float)`, `(double)` and `(real)` |

    | array | `(array)` |

    | object | `(object)` |

    | string | `(string)` |

    | NULL | `(unset)` |


    In addition PHP also has a few functions that can be used to obtain the value
    of variable as a certain type.


    | type | `val` function |

    | --- | --- |

    | boolean | `boolval()` |

    | integer | `intval()` |

    | float | `floatval()` |

    | double | `doubleval()` (simply an alias of `floatval`) |


    When implemented in a block of code they can be used in the following way:


    ```

    ```

    ```


    You can also use the `settype()` function and pass the intended output type as
    the second argument as a string.


    ```

    ```


    This can accept one of either `''bool''`, `''int''`, `''float''`, `''string''`,
    `''array''`, `''object''` or `''null''`.


    The `gettype()` companion function allows you to simply get the type of the supplied
    variable.


    ```

    ```


    Typically, though, you would use the `is_*` set of functions to test the type
    of a variable. Again, there is a function for each type that PHP defines.


    | type | `is_*` function |

    | --- | --- |

    | array | `is_array()` |

    | bool | `is_bool()` |

    | float | `is_float()` |

    | integer | `is_int()` |

    | NULL | `is_null()` |

    | object | `is_object()` |

    | resource | `is_resource()` |

    | string | `is_string()` |


    ```

    ```


    There are also some looser functions to make it easier to assess the contents
    of a variable in a broader sense. This means you can determine if a value is one
    of a collection of types.


    | type | `is_*` function |

    | --- | --- |

    | `is_numeric()` | integer, float (and double) or a string containing a numeric
    value |

    | `is_scalar()` | integer, float, string, and boolean |

    | `is_callable()` | the value of the variable can be treated as a function |


    ```


    All of these attributes lead to PHP being a rather weak type system which can
    be a problem as it becomes difficult to ensure you are operating on the right
    type. There have been a number of attempts to bring stricter typing to PHP, and
    they were added in PHP 7. Enabling strict type hints is decided by the consuming
    code. Functions can use type hints to tell the PHP parser how to coerce arguments
    passed in.


    ## 3.2 Functions


    Functions are a way to encapsulate a set of instructions into a reusable block.
    In PHP, functions may accept one or more arguments (sometimes referred to as parameters)
    and return a result. This takes the form of a name for the function and names
    for each of the arguments. Next, a body of the function lays out the steps required
    to produce the result with the supplied arguments.


    ### Named Functions


    Functions are usually defined as named functions in PHP—these are functions which
    are given a name at the point of definition. A simple function to add one to a
    supplied parameter can be expressed in the following way:


    ```

    ```

    ```


    The arguments supplied to a function are substituted into the function’s body
    and operated upon by the algorithm defined within. In the case of the `add_one()`
    function, there is only one parameter in the form of `$x`. When `add_one()` is
    called against a value the following steps are undertaken by the parser:


    1.  Call the function with an argument


    ```

    ```

    ```


    2.  Argument values are substituted into the function—`$x` becomes 3 meaning the
    body becomes


    ```

    3 + 1

    ```


    3.  Computation completed and an answer is calculated—`4`


    4.  Result returned from the function


    Interestingly, this can easily be demonstrated with a nested call to `add_one()`
    in the form of `add_one(add_one(3))`. Essentially once this code is run the argument
    will have had `add_one()` applied to it twice in succession.


    1.  A call to the functions is made


    ```

    ```

    ```


    2.  The parser starts with the inner function first and substitutes its arguments
    into the body of the function


    ```

    ```

    ```


    3.  The computation is then worked upon giving


    ```

    ```


    4.  Now the parameter is passed into the outer function leaving the parser with


    ```

    4 + 1

    ```

