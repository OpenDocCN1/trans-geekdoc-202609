- raw: "5.  Once again the calculation or work is performed inside the function to\
    \ return a result—`5`\n\nThis illustrates the procedure of executing a function\
    \ in the parser, but what about scoping?\n\nWell, in PHP functions do not have\
    \ access to variables declared outside the functions body. The only exceptions\
    \ to the rules are variables passed into the function as arguments or those explicitly\
    \ pulled in with the use of the `global` keyword.\n\nTo access a variable in the\
    \ parent scope it must either be passed in as an argument or be declared as `global`\
    \ in the function’s body.\n\n```\n\n```\n\nAlthough `$a` is not passed as an argument\
    \ it is substituted into the function body by the use of the `global` keyword.\
    \ This means if the function is applied to an argument of `1` the function body\
    \ will be substituted to `10 + 1`.\n\n```\n\n```\n\nFor the sake of completeness\
    \ it is worth pointing out there are two further ways of doing this in PHP. You\
    \ could add the variable to a superglobal such as `$GLOBALS`, `$_POST`, `$_SESSION`,\
    \ etc. or you could use a closure, which will be discussed in an upcoming section\
    \ of the book.\n\n> Superglobals are variables available in every scope in PHP.\
    \ There are a total of nine superglobals defined by PHP and broadly speaking,\
    \ you would only add values to two of them. When storing a value you wish to persist\
    \ for the length of their session you would place the value in `$_SESSION`. Otherwise\
    \ for it to last until the end of the current process you could write to `$GLOBALS`.\
    \ Other superglobals include those concerned with request headers (`$_GET`, `$_POST`,\
    \ `$_REQUEST`, `$_FILES` and `$_COOKIE`) and the environment (`$_SERVER` and `$_ENV`).\
    \ While it is possible to change the values in these arrays it is generally advised\
    \ against as this could cause unexpected results from scripts relying on these\
    \ variables and their respective values.\n\n> \n\n> In the past I have had cause\
    \ to override `$_SERVER['DOCUMENT_ROOT']` in an `auto_prepend_file` for a mass\
    \ virtual hosting setup. Another use I found is when setting the value of a cookie\
    \ it will not be available until the next request from the user, so I will manually\
    \ set it in the `$_COOKIE` array too to force it to be immediately available.\
    \ However, this really is ill-advised.\n\nWhile globals can give you an easy way\
    \ of bringing values into a function body it is universally frowned upon—and with\
    \ good reason! By relying on a global variable you **introduce state into your\
    \ application**.\n\nState should be avoided as it is difficult to recreate and\
    \ leads to bugs in software. There will be more on this later, but for now just\
    \ don’t implement these schemes in your code!\n\nAt the end of the body (although\
    \ it may appear before) it is usual practice to include a `return` statement.\
    \ Those functions containing no return statement will emit a value of `null`.\
    \ This can be achieved by either leaving the `return` keyword out altogether or\
    \ by specifying `return;`. If you need to return more than one value from a function\
    \ then you can return an array of values.\n\nFinally, while it is possible to\
    \ nest named functions within each other in PHP, they probably don’t behave in\
    \ the way you would expect. All named functions—no matter where they are defined—are\
    \ interpreted to be at the parent scope. That is to say, functions nested inside\
    \ another can be called from outside the containing function. They pollute the\
    \ namespace too, so you cannot have a function with the same name as one declared\
    \ in a nested function.\n\nThis means that you cannot have the code in Listing\
    \ 3.1 and expect PHP to parse it.\n\n**Listing 3.1**\n\n```\n\n```\n\nAs there\
    \ are two functions defined with the name `expr()` PHP will throw a parse error\
    \ regardless of the fact they appear nested inside another function.\n\n### Function\
    \ Parameter Type Hinting\n\nIn functional programming it is common to use your\
    \ languages compiler to help you write functions which accept values of a certain\
    \ type and check your implementation before it even makes it to run time. In PHP\
    \ this is difficult, as it is quite a loose type system and instead of a compiler\
    \ PHP uses a runtime parser. As the code is not evaluated until it is run, errors\
    \ cannot be machine detected.\n\nThere are some simple keywords you can employ\
    \ to defend against the incorrect type being passed into a function.\n\n*   `array`\
    \ specifies it must be an array\n\n*   A class name (`stdClass`)\n\n*   The name\
    \ of an interface (`Traversable`)\n\nFinally there is another type hint added\
    \ in PHP 5.4 called `callable`, which denotes an argument which can be called\
    \ like a function. In PHP. a callable can be any of the following:\n\n*   The\
    \ name of an existing userland or PHP function as a string (`'substr'`)\n\n* \
    \  A class method can be specified as an array of two elements—first an instance\
    \ and then the method name as a string (`[$object, 'myMethod']`)\n\n*   Static\
    \ methods are similar, except instead of an instance you pass the class name as\
    \ a string (`['MyClass', 'myMethod']`) or `MyClass::myMethod`\n\n*   Lambda functions\
    \ and closures\n\nIf you value a stronger typing for PHP 5 (and you should), then\
    \ Joe Watkins of Pthreads fame has been working on a PHP extension called Strict.\
    \ This extension makes it possible to type hint for scalar types such as string\
    \ or integer values when defining function parameters.\n\nThese type hints will\
    \ trigger an exception if the incorrect type is passed into them. This allows\
    \ you to rely on the correct type being passed into your routine. By default,\
    \ PHP does not let you hint on scalar types at the moment.\n\nStrict also brings\
    \ a handy function using a so called lossless cast or throwing an exception where\
    \ this is not possible. To determine the success of such a cast operation Strict\
    \ checks if the conversion can be done without data or precision loss. So you\
    \ would not be able to cast a float with decimals to an integer.\n\nThe only problem\
    \ with the way Strict operates is default values cannot be specified for function\
    \ arguments. This is due to Strict handling the arguments as classes behind the\
    \ scenes. As you probably know it is not possible to supply an instance of a class\
    \ as the default value of a function argument so this cannot be worked around.\n\
    \nStrict can provide a neat way around the limitations of PHPs type system. For\
    \ functional programming this eases the need to check the input types of function\
    \ arguments. The only alternative is to accept the value assuming the caller is\
    \ passing in the correct type, and error if it is not. Hardly an elegant solution!\n\
    \n### Advanced Function Calling\n\nIt is sometimes useful to be able to call a\
    \ function programmatically by passing it an array of parameters. PHP has a couple\
    \ of ways of doing this depending on the version of the language you’re using.\n\
    \nCurrently, the default approach is to use the `call_user_func_array()` function,\
    \ but as we will see later variadics bring syntactic sugar to the exercise.\n\n\
    Quite possibly, the most common use of this technique is from inside a function\
    \ when calling a second function with the same parameters or a subset of them.\
    \ To illustrate this the following simple PHP log function outputs a terse debug\
    \ message before calling the target function.\n\n```\n\n```\n\nThis function is\
    \ very contrived and although it is not something I would employ in production\
    \ it does, however, serve as a concise example. Now we can call it to see how\
    \ it will react to input. Note the use of `array_slice()` to chop the first array\
    \ element from `$arguments` as we don’t need the name of the secondary function\
    \ passed into the secondary function!\n\n```\n\n```\n\nOutputs:\n\n```\nhello\
    \ called\nhello simon\n```\n\nAlthough this code may look complicated it is actually\
    \ in fact quite simple; `log_and_call()` takes a function name followed by a 0..N\
    \ list of parameters. Given these arguments it will echo the name of the function\
    \ it is to call and execute the requested function. Arguments are passed from\
    \ `log_and_call()` to the secondary function. Finally, the result of the function\
    \ call is returned."
