    ## 6.10 Monads


    Extending this idea further, you approach the concept of monads. With an understanding
    of functors and applicatives, you should be able to pick up on the internal operations
    of a monad more easily, so if you do not have a good grasp on those concepts yet,
    then I recommend you review them before continuing here.


    Monads can be a difficult concept to approach, and the three associated laws only
    help to deepen the misunderstanding surrounding them. To ease the learning curve,
    I am going to forgo the formalities and focus on the results. This may not be
    purely functional code, but the idea is to get you on the way to understanding
    monads. To begin with, let’s address the elephant in the room. The reason most
    often cited for using a monad is you can maintain state, but it is just one benefit.
    They also provide a repeatable way to use functions that, at the outset, are incompatible
    with each other.


    Monads may not necessarily be as useful in PHP when compared to purely functional
    languages. In PHP, there are other ways of handling the problems monads address
    with better support from the language. Just because it does not necessarily directly
    translate to a real world use case, however, does not mean it should not be explored
    and learned about using a familiar programming language. It’s a somewhat hidden
    secret that any language having closures and anonymous functions can produce monads!


    The intention of covering monads is to, hopefully, build emulations which will
    help you to understand similar concepts in functional languages should you wish
    to explore them. Who knows, you might even find them really useful in a PHP project
    at some point anyway.


    With the disclaimer out of the way, let’s dig in and review the core principles
    which define a monad. There are three universal mathematical laws, but we will
    address those later as they make it harder to grasp the concepts. A monad is a
    design pattern where a function returns a wrapped value when fed a wrapped value,
    which sounds just like the functors or applicatives we have already seen, but
    there is a gimmick or two, of course.


    Where a functor or an applicative will return the result of a function application
    by repackaging it into the same context, there is no such rule to constrain our
    new friend the monad. It can take a function which returns a different context
    and wrestle it into submission. Not only will it apply this function, but the
    monadic nature of the construct will assist in chaining up functions to be applied
    to the wrapped value.


    Monads do not actually manipulate any of the values in the container as this is
    the job of the functions you ask it to apply. Just like an applicative, it just
    knows how to apply the supplied function, but does not actually know or define
    any of the mutating logic.


    For the purposes of simplicity, we must keep in mind the following guidelines
    while constructing any monad in PHP. A monad maintains a container—an example
    of a container we have already seen is the `Just` functor we defined earlier.


    In addition, a monad defines two functions allowing us to manipulate the protected
    container. The first of which is a function to inject a value into the aforementioned
    container. In Haskell, this is defined as `return`, but we are going to call it
    `pack()` as it describes the action more clearly to my mind as we are packing
    the value into a container.


    Finally, when we want to apply a function to the values stored in the container,
    we are going use a method called `map()`, which is the equivalent of Haskell’s
    `bind()`.


    Now you have a basic description of what a monad is and its various constituent
    parts. All monads define these basics, but of course, each has their own implementation
    details which may expose various other methods for consumption.


    ### Setup a Monad Structure


    The monad structure must first be defined so we have a collection of base functionality
    to assist with the production of monads. Much like with the `Functor` and `Applicative`
    before it we will define an interface for the `Monad` first.


    ```


