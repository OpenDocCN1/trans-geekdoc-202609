- raw: "PHP’s lambdas and closures are very useful, but much like the rest of the\
    \ language the syntax is very verbose. Hack brings a nice succinct syntax that\
    \ still looks a lot like PHP. Dispensing with the need for a `use` clause is another\
    \ simple way that the syntax is decluttered. Smaller character counts are generally\
    \ good when it comes to maintenance as it is less to read and therefore to have\
    \ to build up in your mind. This map of execution we create in our minds has a\
    \ high cognitive load these expressions help to reduce.\n\nMuch like other features\
    \ of Hack adopted by PHP it would be great to see an RFC for the inclusion of\
    \ lambda expressions with their implicit scope. Given the language changing nature\
    \ of such a feature it would, unfortunately, seem unlikely it would make it past\
    \ the voting phase.\n\n## 5.3 Special (Magical) Attributes\n\nThere is no PHP\
    \ equivalent of these special keywords in Hack bringing specialist functionality\
    \ to classes. They add custom magic to classes in a similar way to PHP’s `__toString()`\
    \ or `__construct()` methods, but as annotations.\n\nYou can easily cache function\
    \ results with the special `<<__Memoize>>` attribute which can be added to both\
    \ functions and class methods. In the code that follows, you can see two calls\
    \ to a function which returns a unique string yield the same result when the memoize\
    \ attribute is added directly above the function definition—normally `$a` and\
    \ `$b` would be different.\n\n```\n<<__Memoize>>\nfunction getUniqueString():\
    \ string {\n   return uniqid();\n}\n$a = getUniqueString();\n$b = getUniqueString();\n\
    $c = ($a === $b); // true\n```\n\nThis is a very simple annotation to add above\
    \ any method or function to immediately give it memoized properties without having\
    \ to complete any of the implementation yourself. There are a few things to note\
    \ though about the parameters you can send to a function or method with this annotation.\
    \ Only the following types may be passed in as arguments: `null`, `bool`, `int`,\
    \ `float`, `string`, an implementation of `IMemoizeParam` and arrays containing\
    \ any of the aforementioned types. In addition to this, parameters may not be\
    \ passed by reference and should be defined within the parentheses of the function\
    \ rather than accessed by varargs.\n\nLess interesting are the `<<__Override>>`\
    \ and `<<__ConsistentConstruct>>` attributes relating to class definitions within\
    \ Hack. The first is implemented immediately before any class method and its purpose\
    \ is to ensure consistency between your class and its parent. An error is triggered\
    \ if the parent class does not contain a concrete implementation of the same method.\
    \ This has the effect of letting you know a child class overrides a particular\
    \ method when you attempt to refactor it out of the parent class.\n\nIf `<<__ConsistentConstruct>>`\
    \ is added above a class definition then it has the effect of telling the Hack\
    \ parser to check all classes that extend it use a compatible `__construct()`\
    \ method definition. Sometimes this may not be useful and you might like to prevent\
    \ it from applying to a subclass you are writing by adding `<<UNSAFE_Construct>>`\
    \ above the `__construct()` method. Hack will then ignore it and rely on the fact\
    \ the programmer who wrote it has accounted for consistency instead!\n\nIf you\
    \ want to use these special attributes together you can separate them with commas\
    \ to form a list between the angle brackets as demonstrated below:\n\n```\n\n\
    ```\n\n## 5.4 Conclusion\n\nHack provides a number of nice extras and some improved\
    \ syntax over PHP—this is more of an incentive to use HHVM than faster running\
    \ PHP scripts. Most of what I have covered in this chapter are features that set\
    \ Hack apart. For the most part, it implements PHP. This means that although not\
    \ documented here, you still get functionality for a variable number of arguments,\
    \ the SPL, and other PHP language functions. These are simply implemented in the\
    \ same manner and syntax as PHP.\n\nOf course, I have also glossed over a few\
    \ other features of Hack you may find useful in object-oriented code or where\
    \ it has felt like too much of a detour to include here. These features are all\
    \ very well documented in the Hack manual and also in various Facebook blog posts\
    \ should you wish to delve deeper into the language.\n\n# 6 Patterns\n\n> “Monads\
    \ are return types that guide you through the happy path.”\n\n> \n\n> –Erik Meijer\
    \ (Computer Scientist, @headinthebox)\n\nIn functional programming there are repeating\
    \ patterns just as in any other programming style. This is in fact a major source\
    \ of interest in functional programming from unacquainted coders, as it brings\
    \ with it concise code.\n\nSoftware patterns are generally agreed best practices\
    \ for completing similar tasks in a universally identifiable and understood way.\
    \ Much like object oriented programming, functional code also has a number of\
    \ patterns you will regularly see. These patterns assist in making more composable\
    \ functions allowing for greater reuse across various problem domains. Not only\
    \ this, but they can help to make your API more consistent for those implementing\
    \ any functional library you might have written. If the pattern is followed then\
    \ implementers can accurately anticipate the result when they call the pattern\
    \ from their code.\n\nPatterns can be reproduced across a large number of types\
    \ easily and quickly in most functional languages, but in PHP we need to lay the\
    \ ground work ourselves first. Looking to the world of mathematics there are far\
    \ more patterns than we will cover here. Some patterns are borrowed from the ideas\
    \ implemented in the Haskell programming language, which can be a little difficult\
    \ to produce given PHPs weak type system. It is, however, possible and they help\
    \ to present excellent ways of producing reusable code.\n\nIt does not mean we\
    \ will avoid implementing difficult patterns though with applicatives and monads\
    \ both discussed. Some might suggest only a Haskell programmer should be interested\
    \ in these formalisms, but they would be short sighted. It is easier to learn\
    \ a pattern in a language you already know well than a completely foreign one.\
    \ And, the patterns are actually useful in PHP code too, as we will explore further\
    \ into the book.\n\nReusable patterns are great and what we all strive for as\
    \ programmers. Good, functional code takes this up a notch and tries to abstract\
    \ all operations into reusable and immutable code. To this end we will now explore\
    \ some common and some complex patterns in functional PHP code.\n\nShould you\
    \ be unwilling to push the boundaries of PHP, turn back now and wallow in your\
    \ safe billabong (oxbow lake, resaca, bayou). The next section has a raft and\
    \ it is headed for the white water!\n\n## 6.1 Head and Tail\n\nWe will start with\
    \ a very simple pattern first though to ease our way into it. When working with\
    \ lists and recursion it can be very helpful to be able to easily obtain the first\
    \ element of an array (the head) and what is know as the tail of the array. Head,\
    \ given an array, will return the first value from that array.\n\n```\n\n```\n\
    \nAt the other end of the equation we have tail that will return a list with all\
    \ but the first value in the array contained in it.\n\n```\n\n```\n\nThese two\
    \ functions can be used together to work through a list using recursion.\n\n```\n\
    \n```\n\n## 6.2 Flattening lists\n\nLists of lists can be very helpful when dealing\
    \ with complex datasets or when transforming an array via `array_map()` where\
    \ it would return an array from the applied function. In some instances though,\
    \ you have a list of lists that really should just be one list with all values\
    \ at the top level. The problem could look something like:\n\n```\n\n```\n\nNow\
    \ you need to `array_sum()` all the values, but you have a multi-dimensional array.\
    \ You want to flatten your list.\n\n```\n\n```\n\nAfter flattening the array all\
    \ values are at the top level of the array and it is no longer multi-dimensional\
    \ so we are now able to perform that all important `array_sum()` call.\n\n```\n\
    \n```"
