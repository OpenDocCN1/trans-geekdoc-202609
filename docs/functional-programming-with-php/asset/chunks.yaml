  trans: '


    在二战期间的这段时间，阿兰·图灵曾著名的驻守布莱切利公园（Bletchley Park），与英国最伟大的智力团队一起致力于破解 Enigma 密码。Enigma
    密码的首次突破是在 1940 年通过所谓的“绿色密钥”实现的，随后德国军的“红色密钥”也被破解了。最近一部由本尼迪特·康康巴奇主演图灵的电影《模仿游戏》详细描述了这一时期。


    纳粹并没有花费多久就开始使用一种名为 `Geheimschreiber`（秘密写入者）的新设备进行更复杂的加密。图灵致力于破解 `Tunny`（该“秘密写入者”的英国代号），并于
    1942 年发明了一种名为 `Turingery` 的技术。在大规模上实现 `Turingery` 为 Tommy Flowers 和 Max Newman
    团队设计世界上第一台可编程电子计算机提供了灵感。


    这台被称为 `Colossus`（巨像型）的计算机与你现在可能阅读这本书的设备大不相同。它使用电子空管（如今除了昂贵的 HiFi 音响设备和专业吉他放大器外，已基本不再使用）来执行布尔运算，就像今天晶体管的作用一样。这些元件控制着一系列继电器和步进电机，使其成为非常活跃且具有物理感的机器——你一定能听到它工作的声音！


    现代机器完全不同，离散型和固态电子设备驱动着我们今天的计算。在如今的许多机器中，唯一的活动部件是冷却风扇，可能还有通过 `USB` 插入的偶尔外围设备。硬盘被固态硬盘取代，光驱器将便携式数据交给
    U 盘或云存储，使得机器几乎完全静音。


    在英国布莱切利公园的国家计算博物馆，可以看到一台功能完好的 `Colossus` 复制品。原机及其蓝图已被销毁，相关信息直到 20 世纪 70 年代一直处于机密状态。


    因此，尽管图灵的工作无疑有所帮助，但说他直接参与了该项目还是有些牵强的。相反，他当时正在开发一种可以加密语音的安全电话系统。该系统代号为 `Delilah`，遗憾的是缺乏远距离传输能力，没能在二战期间完成并投入使用。这让图灵回到了计算领域，他撰写了第一篇关于存储程序计算机的深度论文，险些击败了即将出版的约翰·冯·诺伊曼的草稿。回想起来，冯·诺伊曼草稿中包含的许多想法被认为是图灵的。


    此外，图灵还以致力于研究人工智能问题而闻名。对他而言，这不是机器“是否”能具有智能的问题，而是“何时”的问题。为了确定何时达到这一里程碑碑，图灵发明了一种简单的测试（对人类来说很简单，但对机器来说并不一定），这种测试现在被称为
    `图灵测试`。如果一台机器能够以与人无法区分的方式与人类观众进行交流，那么它就可以被认为是智能的。尽管这在我们听起来很简单，但值得注意的是，语言和复杂的交流是地球上人类特有的。即使是学过手语的灵长类动物也从未向饲养者问过一个单一的问题，这可能是由于认知限制，或者仅仅是因为语言极其难以掌握。


    最近有声称某个计算机程序通过了图灵测试。这就像汽车制造商的油耗声明一样，现实世界的实际使用结果并不会产生与实验室相同的结果。该测试是在一组试图操纵测试的条件下完成的。


    遗憾的是，图灵伟大的大脑和对战争的贡献并没保护他免受迫害。在 1950 年代的英国，同性行为是非法的。在向警方提到家中入室抢劫可能是男友的一位所为后，他被迅速逮捕。案件上庭后他被判定有罪，被判处监禁或在接受化学阉割的条件下获得减刑。图灵选择了医疗干预，而他的男友则获得了七个月的缓刑，可能是因为他比图灵年轻。


    尽管他的家人对此否认，但据信图灵在 1954 年通过氰毒害自己每天食用的苹果自杀。有人解释说，他设置的实验产生了致命剂量的氰化物。图灵的遗产在计算界广为人知，并在电影《模仿游戏》后进入了更广泛的观众。2009
    年，发起了一场要求英国政府道歉的广泛运动。2013 年，他获得了死后赦免。


    ### LISP 的遗产


    函数计算的下一个重大进展是 1958 年约翰·麦卡锡提出的 `LISP` 语言，它基于阿隆·丘奇的 lambda 演算。由于该语言对列表的依赖，其名称来源于列表处理（list
    processing）。


    有趣的是，`LISP` 后来成为人工智能社区的事实标准。麦卡锡在图灵去世前利用阿隆·丘奇的思想研究了人工智能。


    许多语言和整个计算机科学都要感谢 `LISP`。它以动态类型、数据树结构、条件语句、递归和高阶函数引入了新思想。其他语言可能包含类似的功能，但从未以如此统一的方式。


    等等，网络上有许多资源可以使用 `C`、`Python` 和 `C++` 创建 `LISP` 解释器。在 `PHP` 世界，已经完成了如 Mathias Verraes
    的 `Lambdalicious`、Igor Wiedler 的 `Lisphp` 以及 Tamreen Kahn 用 `PHP` 编写的交叉编译器 `Pharen`
    等项目。


    `LISP` 通过 S 表达式一眼就能被识别。它们被写为一个列表，函数名在前，参数在随后。在多年里，出现了许多 `LISP` 变体，其中 `Common Lisp`、`Scheme`
    和 `Clojure` 是目前最为人知的。


    随着时间的推移，函数领域几乎没有进展。现有的语言仍然局限于学术领域，用户群相对较小。


    ### Erlang


    在此之外，你需要向后推时间，直到电信行业开始寻找一种容错系统。毕竟，他们不能让客户的电话、短信和信息丢失或无法送达。爱信公司主导了电信领域函数领域的早期开发。在他们的实验室里，他们开发了一种可以解决他们行业面临问题的语言，其中可用性和可靠性是最重要的。


    80 年代中期的这些研究诞生了 `Erlang` 编程语言。它基于 `Prolog`，并最初用该语言实现，后来驱动了爱信的所有基础设施。然而，后来，由于 `Erlang`
    是一门私有语言，爱信决定在 20 世纪 90 年代停止使用自己的语言！在 1998 年语言团队的关键成员离开后（无疑是为了抗议），爱信开源了 `Erlang`
    语言，使其能够再次内部使用。


    '
