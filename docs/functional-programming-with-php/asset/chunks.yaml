    这段代码要短得多，因此运行速度更快且更易读。由于解包运算符只收集未分配的参数，我们能够避免切片 `$arguments` 数组。更不用说移除了不再需要的两个函数调用。


    PHP 5.6 版本中添加的解包或参数展开语法允许将数组转换为函数参数。该数组并不一定源自变长参数或 `get_args()`，它可以是你自己构造的数组。变长参数可以用于以数组的形式捕给函数的参数。它将捕获任何未分配给命名函数参数变量的参数。


    ### Lambda λ


    Lambda 函数仅仅是 PHP 基本函数概念的扩展。本质上，Lambda 是一个可以像变量一样处理的函数——它是一个没有正式标识符的函数。我的意思是该函数在定义时没有分配名称。这种特性通常被称为一等函数（first
    class function），这意味着它们可以作为参数传递给其他函数，从赋值给变量的函数返回，或者放置在更复杂的数据结构中。


    这些函数通常被称为 lambda (λ) 函数或匿名函数。为了说明它们在 PHP 中看起来是什么样，我们将重申之前的 `add one` 函数。


    ```

    虽然这可以编译，但它实际上不会执行任何操作，因为我们没有方法调用该函数。通常，lambda 函数会被赋值给一个变量，或者直接作为参数传递给另一个函数。

    ```


    当赋值给变量时，`add one` 函数可以像标准 PHP 函数一样被调用，尽管该变量受标准 PHP 作用域规则的影响。与命名函数不同，赋值给变量的 lambda
    函数无法从其他函数或类方法立即可用。


    ```

    标准命名函数与赋值给变量的 lambda 函数之间的关键区别在于，现在它可以被传递、赋值给另一个变量，甚至通过对 `$add_one` 调用 `unset()`
    来销毁。

    ```


    换句话说，可以将该函数像 PHP 中的任何其他变量一样对待。所有这些属性都导致了高阶函数的创建，我们将在下一节中讨论它。


    如果你有一些 JavaScript 经验，那么这种模式看起来也会非常熟悉。


    ```

    在 PHP 中，你可能遇到过用于懒加载的 lambda 函数，例如在框架路由系统中。另一个例子可以在老牌的 `spl_autoload_register()`
    中找到，它接受一个函数作为第一个参数：

    ```


    ```

    正如你所看到的，它们可以赋值给变量，同样，它们也可以直接定义在接收函数的参数中（在这种情况下，是 `spl_autoload_register()`）：

    ```


    匿名函数也被称为 lambda 函数，它们用正式名称或标识符声明。它们可以赋值给变量、作为参数传递，或从函数返回。PHP 限制你做的一件事是在是对匿名函数进行序列化，因为这会触发解析错误。在
    Jeremy Lindblom 的 SuperClosure 库的帮助下，至少有一种方法可以绕过。


    Lambda 函数在 Alonzo Church 的论文中正式，是 lambda 演算的基础。它们还构成了我们书中将看到的所有函数式编程的基础。在没有一等函数支持的语言中，函数风格编程是无法实现的。


    请原我的夸张，但几乎每一段编写过的函数式代码都使用了 lambda 函数，它们是你工具箱中重要的构建模块，并且在继续学习之前应该掌握它们。


    ### 闭包 (Closures)


    闭包是任何函数式语言的重要特性，并且被认为如此有用，以至于许多指令语言现在也支持它们。PHP 也不例外，从 5.3 版本引入了对闭包的支持。


    闭包是 lambda 函数形式的逻辑扩展，通过向函数引入上下文概念，因为它们可以作为一个包传输代码和数据。可以认为闭包在函数式编程中所扮演的角色类似于对象在面向对象编程中所扮演的角色。事实上，在
    PHP 中创建一个闭包实际上返回的是内部 `Closure` 类的实例。


    更具体地说，上下文是在定义点附加到函数的部分信息。这些信息可以是一个变量，例如数组、lambda 函数、标量或对象。这通过 PHP 中的 `use` 关键字实现，它可以从当前作用域将变量引入函数，而无需将其作为参数传递函数——`use
    ($add_value)`。


    ```

    注意的是，传入闭包的值是在定义时设置的。这与全局变量不同，全局变量可以在任何地方更改并影响稍后引用它的所有代码。操作全局变量的函数在全局变量被更改后再次调用时将返回不同的值。

    ```


    ```

    如果我们对闭包这样做，那么值将在定义闭包时被固定的。

    ```


    这简洁地证明了，对赋值给 `$my_global_var` 的值的后续更改对我们闭包中封装的值没有影响。这种作用域是 PHP 全局变量和常量与其闭包之间最明显的区别。


