- raw: "Hopefully this short run-down gives you an idea of how powerful PHP can be\
    \ in a functional style and what can be done with a domain specific language in\
    \ PHP. If you want more opportunities to put this into practice, then you could\
    \ write a DSL for building a JSON or XML builder or even a language for creating\
    \ RTF files.\n\n* * *\n\n1.  [Array Column RFC](https://wiki.php.net/rfc/array_column)[↩](#ch010.xhtml#fnref1)\n\
    \n2.  [PHPUnit](http://phpunit.de)[↩](#ch010.xhtml#fnref2)\n\n# 8 Event Driven\
    \ Programming\n\n> “If people do not believe that mathematics is simple, it is\
    \ only because they do not realize how complicated life is.”\n\n> \n\n> —John\
    \ von Neumann (Mathematician and Physicist, 1903–1957)\n\nOne well-established\
    \ use of functional-style code is in event-driven programming. If you have written\
    \ JavaScript code before, you will likely have previous experience with this paradigm.\
    \ Functions such as `setInterval()` and `onClick()` are just two such examples\
    \ which make use of an event-driven approach in JavaScript. This is not a method\
    \ of working PHP easily supports out of the box, but thankfully, there a few extensions\
    \ and libraries out there to help.\n\nThe functional approach of removing and\
    \ avoiding state is a major advantage when dealing with asynchronous code. Of\
    \ course, it would also be much more difficult to create such programs if simple\
    \ functional constructs—such as lambdas and closures—were not available to handle\
    \ callback duties.\n\nIn the PECL repository, there are a number of extensions\
    \ intended to provide PHP with non-blocking I/O functionality such as libevent,\
    \ eio, event, and ev. In terms of libraries, there is ReactPHP (you might recognize\
    \ this name from the partial function application section) and a few other less\
    \ well known options. For the purposes of demonstration, we will use ReactPHP\n\
    \n## 8.1 ReactPHP Installation\n\nInstallation is incredibly simple with the help\
    \ of Composer. After [installing Composer](#ch004.xhtml#php-libraries), in a fresh\
    \ directory, you can run:\n\n```\n\n```\n\nComposer will install the ReactPHP\
    \ components for use in your project.\n\n## 8.2 Getting Started\n\nJust like with\
    \ earlier examples of Composer installed libraries, you need to add the vendor\
    \ autoloading to your file (`server.php`) first.\n\n```\n\n```\n\nThen, we can\
    \ get on with the business of setting up a simple web server, which—at its heart—is\
    \ a long running PHP process. When a request is made to the server, this bubbles\
    \ up as an event and triggers the actioning callback. If you have previous experience\
    \ with NodeJS, then this pattern will be very familiar to you.\n\nFirst, we will\
    \ define a simple request-handling function that just returns a string.\n\n```\n\
    \n```\n\nNext up is the actual web server itself, and the necessary event loop\
    \ to turn it into a long-running process:\n\n```\n\n```\n\nFinally, we must bind\
    \ the request handler (`$rh`) to the server (`$http`), set a socket for the server\
    \ to listen to, and set the event loop in motion.\n\n```\n\n```\n\nThe server\
    \ can now be started on the command line with `php server.php`. You can now access\
    \ the server on `http://127.0.0.1:7355`, and you will receive a simple plain-text\
    \ response of `Sakubona, unjani?`.\n\nThe library is a high-level abstraction\
    \ above code which can be written in PHP with the `stream_*()` functions, but\
    \ if you install `libevent` or `libev`, then it will use their C implementations\
    \ as faster back ends. The HTTP server we have defined here could be written with\
    \ pure PHP code:\n\n```\n\n```\n\nIt is important to note ReactPHP has added a\
    \ number of logical higher-level abstractions and an event loop into the mix,\
    \ whereas this pure PHP example is as bare bones as it gets, so they are not completely\
    \ interchangeable examples.\n\n## 8.3 Add Some Logging\n\nAs fantastic as it is\
    \ to get a response from our HTTP server in a web browser, it would be nice if\
    \ we could also log each and every request for the purposes of debugging. The\
    \ trouble is we have a nice pure function used to handle the response to an HTTP\
    \ request, and we do not want to place another concern (logging) into such a tidy\
    \ function. We can make use of a closure to combine the calls to our functions.\n\
    \nFirst up is the logging function, which just writes the request method (`GET`,\
    \ `POST`, etc.) and the request path (`/`, `/page-name`) to a log file called\
    \ `access_log`.\n\n```\n\n```\n\nWe can also make a minor change to the definition\
