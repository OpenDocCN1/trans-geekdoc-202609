    没有所谓的黄金法则规定在某些情况下推荐函数式编程，而在另一些情况下推荐面向对象编程。函数式编程不是一种框架或设计模式，而是一种图灵完备的方法论。为此，随着你熟悉函数式编程，你将直觉地感知到何时采用特定方法解决问题最为合适。值得注意的是，这在不同语言之间会有，PHP
    与 Scala 非常不同。在 PHP 世界中，由于对面向对象编程的偏好，函数式编程主要用于列表处理，但正如你后续将看到的，这并不会阻止我们探索更复杂的结构。


    ## 2.6 函数式编程的优势


    那么，从你的命令式语言中移除特性有什么帮助呢？随着函数式编程的日益流行，跟上潮流至关重要。从探索函数式代码中获得的洞察也可以应用于面向对象编程。一条经常被引用的规则是：随着抽象层次的提高，由于其鼓励编写简洁的代码，程序的可读性也随之提高。人们还经常说，这些属性的副作用是生产力的提高，因为输入更少，且不需要在脑中构建全局状态，有助于你腾出时间处理更困难的问题。


    测试你的代码变得简单得多，因为所有值都是最终的（final），这意味着你不需要与副作用作斗。没有需要维护特定顺序，也没有需要设置的全局状态。你只需要传递正确的参数，就将始终获得相同的结果。这个概念通常被称为“引用透明性”（referential
    transparency），基本上意味着你可以将任何函数调用替换为它返回的值，结果算法将保持不变。因此，我们可以使用静态数组代替 `range()`，而仍然能得到相同的结果：


    ```

    将静态值替换到命令式示例中是不可能的（除非证明我是错的！），而这正是函数式风格真正出彩的地方。每个函数在给定相同输入时始终返回相同的值。不要低估这些函数比那些充满状态的对应函数容易测试得多。浪费在模拟全局状态上的时间更少，而且当测试失败时，它总是会失败。由于函数式程序避免了任何全局状态并对组件采用封装，重现
    bug 不需要长长的动作链就能出现。如果一个函数没有返回正确的值，那么它就是错误的。虽然这在 PHP 程序中通常不是问题，但函数式编程有助于防止线程或进程之间的竞态条件。维护函数式风格允许你充满信心地编写此类应用程序（嗯，几乎如此！）。随着计算机硬件的进步，并行处理的重要性在不断增长。


    计算机正在通过增加中央处理器的核心数量来获得越来越多的力量。如果你的软件要利用这种力量，你就需要考虑并行处理。这正是函数式编程放弃赋值语句能够有效保护你免受进程锁定或尝试更新内存中相同位置的影响。它还让执行顺序变得无关，因为由于没有需要更新的状态，函数将始终返回相同的值。只有当你允许状态渗透进代码时，分配到进程的任务才会出现问题。函数式编程的额外优势（通常不适用于
    PHP——所以我们在这里不讨论）是热部署和代码的机器优化。


    ## 2.7 函数式基础


    尽管 PHP 本身是命令式的，但它支持基础的函数式编程风格。为了更容易学习，最好舍弃语言的某些方面以模拟更纯粹的函数式风格：


    * 避免改变状态——即使在函数内部也是。

    * 尽量将函数保持在一行或尽可能短。

    * 将问题拆解为最小单元，并将这些转换为可重用的函数。

    * 从你的代码中移除控制语句。

    * 反复强调：避免状态并不要使用变量赋值！


    你本质上是想创建一个小的黑盒函数，在给定正确参数时它始终返回相同的值。PHP 有许多语言特性可以帮助建立这种编程风格的基础。可能最有用的是 lambda 函数，它使得处理将函数作为变量传递的代码变得更加容易。此外，诸如
    `array_map()` 和 `array_reduce()` 等语言函数对于将函数应用到值列表非常有帮助。PHP 中没有不可变值类型或静态类型变量，因此取决于你的实现如何保护你的函数式代码免受状态改变。


    当你开始以函数式方式工作时，你需要更多的原语来处理你遇到的复杂操作。幸运的是，路已经有人走过了，稍后我们会介绍一些库。


    ***


    1. [Simon Peyton Jones—Haskell is useless](http://youtu.be/iSmkqocn0oQ?t=1m23s)

    2. [Erik Meijer: Functional Programming](http://youtu.be/z0N1aZ6SnBk?t=16m44s)

    3. [Scala School](https://twitter.github.io/scala_school/)


    # 3 语言特性


    > “递归是函数式编程中的 GOTO。”

    >

    > —Erik Meijer (计算机科学家，@headinthebox)


    尽管 PHP 在严格的编程环境中声誉略显平庸，但它的功能相当丰富。它的大部分力量来自 5.3 及以上版本，但从 PHP 5 开始，它一直在朝着一个良好的方向发展。注意我说的是“良好”的方向，而不是“正确”的方向！随着版本
    5 的演进，语言中增加了许多新特性，这些特性也缓解了 PHP 的开发。


    虽然 true 许多这些特性本可以用更优的方式来实现以支持函数式风格，但它们确实存在。


    '
