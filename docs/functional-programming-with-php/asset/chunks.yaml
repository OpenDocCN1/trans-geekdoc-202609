    命名空间是将函数放在不同库中防止命名冲突并保持逻辑分离的好方法。此外，现在可以在导入时为函数设置别名以进一步避免命名冲突。不幸的是，`PHP` 仍然不支持函数的自动加载，而且在短期内看起来也不会。


    ## 10.4 PHP 7


    在跳过 `PHP` 版本 6 的投票后，决定将 `PHPNG`（下一代）称为 `PHP 7`。曾经存在过一个 `PHP 6`，但它从未问世，也没有合并到 `PHP`
    主分支。由于几个原因它被取消了，但一些功能被回移植（backported）到了 `PHP 5.x` 分支中。不过，在取消之前，许多公司为它编写了书籍、文章和博客帖子。你仍然可以通过你喜欢的搜索引擎访问这些内容！


    `PHP` 团队认为将现在发布的版本命名为 PHP 6 会太困惑，所有旧资源都会出现且是不准确的。因此该版本号成为了历史。


    语言增加了许多新功能，以及一些错误修复和速度增强。`PHP` 语言团队的许多成员付出了巨大努力。这成了 `PHP` 以来最重大的发布。我在这里重点介绍一些新功能，它们在编写函数式
    `PHP` 代码时非常有用。不必说，如果我漏掉了你最喜欢的，我深表歉意。深表歉意。


