    PHP 可用于纯函数式编程，这可以提高生产力并减少错误。良好的函数式代码属性还使其易于测试。一旦你学习了本章中的特性，你将看到该语言在这种风格下具有巨大的潜力。


    我将其比作一场冒险，就像 Sjaak Lucassen 所经历的那种，他骑着雅哈 R1 几乎环绕了整个世界。这辆超级摩托穿越了几乎无法识别的道路泥沼——这可能是
    R1 远离它的赛道环境最远的一次。很多人会告诉你这不切实际，甚至根本不可能。我在这里想告诉你，这是完全可能的，而且在很多方面，它是解决问题的非常优雅的方法——即使在
    PHP 中也是如此


    ## 3.1 类型


    PHP 中的类型将作为本章概念的起点。


    类型（Types）、类型（typing）和类型系统（type systems）都指的是值具有类型而不仅仅是内容。这意味着如果你将一个单词赋值为值的内容，它将被赋予
    `string` 类型。如果你赋值一个整数，那么它通常会被赋予 `integer` 类型。


    像 PHP 这样的编程语言使用类似的类型系统，类型是从赋值给变量的值推断出来的。如果你将单词 `"test"` 赋值给变量，PHP 会自动推断出类型应该是
    `string`。然而，这只是动态类型故事的一半。其他语言使用一种在定义变量时指定变量类型的系统。另一些语言则将两者结合使用。


    在 PHP 中，解析器可以使用以下标量数据类型（scalar data types）。标量类型是最基本的类型，包含了数字和文本等简单内容。


    * `Boolean`—`true` 或 `false`

    * `integer`—整数（包括负数）

    * `float`—浮点数（小数）

    * `double`—`float` 的别名

    * `string`—文本信息


    随着程序需求变得越来越复杂，值必须增强其能力以适应它们的复合性质。


    * `array`—有序映射或 键/值对列表

    * `object`—类的实例


    最后，PHP 还定义了一些为特定语言特性定义的特殊类型。


    * `resource`—指向外部资源的引用（例如文件句柄）

    * `NULL`—表示没有值的变量

    * `callable`—从 PHP 5.4 开始，可以被视为函数的变量


    这些类型中没有一个可以直接显式设置为 PHP 变量的类型。如前所述，如果你将变量设置为一个整数，PHP 会自动将该变量变为 `integer` 类型。


    PHP 确实提供了强制转换（casts），这使得改变值的类型成为可能。例如，如果将字符串 `"10"` 转换为整数，PHP 解析器将该值的类型转换为整数 (10)，如下所示：


    ```

    ```

    ```


    这在尝试触发类的 `__toString()` 方法时可能特别有用。


    ```

    ```

    ```


    可用的强制转换包括到 `string`、`integer`、`double`、`float`、`array`、`object` 和 `boolean`。要确定你所需的转换运算符，可以使用以下列表。


    | 类型 | 转换运算符 |

    | --- | --- |

    | boolean | `(bool)` |

    | integer | `(int)` |

    | float | `(float)`, `(double)` 和 `(real)` |

    | array | `(array)` |

    | object | `(object)` |

    | string | `(string)` |

    | NULL | `(unset)` |


    此外，PHP 还有几个可以用于获取作为特定类型的变量值的函数。


    | 类型 | `val` 函数 |

    | --- | --- |

    | boolean | `boolval()` |

    | integer | `intval()` |

    | float | `floatval()` |

    | double | `doubleval()`（仅为 `floatval` 的别名） |


    在代码块中实现时，可以按以下方式使用：


    ```

    ```

    ```


    你还可以使用 `settype()` 函数并将预期的输出类型作为第二个参数字符串传入。


    ```

    ```

    ```


    它可以接受 `''bool''`、`''int''`、`''float''`、`''string''`、`''array''`、`''object''` 或
    `''null''` 中的任意一个。


    辅助函数 `gettype()` 允许你直接获取提供的变量的类型。


    通常情况下，你会使用 `is_*` 系列函数来测试变量的类型。再次，PHP 定义的每种类型都有一个对应的函数。


    | 类型 | `is_*` 函数 |

    | --- | --- |

    | array | `is_array()` |

    | bool | `is_bool()` |

    | float | `is_float()` |

    | integer | `is_int()` |

    | NULL | `is_null()` |

    | object | `is_object()` |

    | resource | `is_resource()` |

    | string | `is_string()` |


    ```

    ```


    还有一些更宽松的函数，以便在更广泛的范围内评估变量的内容。这意味着你可以判断一个值是否属于一组类型中的一种。


    | 类型 | `is_*` 函数 |

    | --- | --- |

    | `is_numeric()` | 整数、浮（以及双）或包含数值的字符串 |

    | `is_scalar()` | 整数、浮、字符串和布 |

    | `is_callable()` | 变量的值可以被视为函数 |


    ```


    所有这些属性导致 PHP 成为一个相当弱的类型系统，这在难以确保操作的是正确的类型时可能会产生问题。PHP 曾尝试引入更严格的类型检查，这些是在 PHP 7
    中添加的。启用类型提示（type hints）是由调用代码决定的。


    ## 3.2 函数


    函数是将一组指令封装进重用块的方法。在 PHP 中，函数可以接受一个或多个参数（通常称为参数）并返回结果。这表现为函数名称以及每个参数名称。接下来，函数体列出了使用提供的参数产生所需的步骤。


    ### 命名函数


    函数在 PHP 中通常定义为命名函数——这些函数在定义时被命名。一个对提供的参数加 1 的简单函数可以表示如下：


    ```

    ```

    ```


    传递给函数的参数替换到函数体中并由定义的算法处理。在 `add_one()` 函数的情况下，只有一个形式为 `$x` 的参数。当调用 `add_one()`
    时，解析器会执行以下步骤：


    1. 带有参数调用函数


    ```

    ```

    ```


    2. 参数值替换到函数中——`$x` 变为 3，这意味着主体变为


    ```

    3 + 1

    ```


    3. 计算完成并计算出答案——`4`


    4. 从函数返回结果


    有趣的是，可以通过嵌套调用 `add_one()` 来轻松演示，形式为 `add_one(add_one(3))`。本质上，一旦运行此代码，参数将连续应用两次
    `add_one()`。


    1. 发起函数调用


    ```

    ```

    ```


    2. 解析器首先处理内部函数，并将其参数替换到函数体中


    ```

    ```

    ```


    3. 然后进行计算，得到


    ```

    ```

    ```


    4. 现在参数传递给外部函数，留下解析器处理


    ```

    4 + 1

    ```

