    正如你所预想的，它比 `fmap()` 要复杂得多，因此我将逐步进行演练，以描述正在发生什么。


    首先，它获取自己的函数名并将其存储在变量中供稍后使用。它还获取了传递给函数的除第一个参数以外的所有参数。这里来了一个另一个好消息，`amap()` 可以对参数应用多个
    `Applicative`！你只需要将一个 `Applicatives` 数组作为第一个参数传递给 `amap()`，它就会处理剩余的所有工作。这就是为什么你可以看到它在使用
    `array_map()` 遍历数组进行迭代，然后间接地调用自己。


    接下来是处理实际调用 `Applicative::__invoke()` 方法的代码，该代码位于一个对 `ApplicativeInterface` 的检查内部，以确保传递了正确的类型。如你所见，`amap()`
    函数的所有参数都被传递给 `Applicative`，以应用于所包含的函数。这意味着如果你传递了三个参数，那么封装在 `Applicative` 中的函数应该能够处理三个参数。如果你没有提供正确数量的参数，将触发
    PHP 错误。遗憾的是，这就是我们对 applicative 功能的 PHP 模拟稍显不稳定的地方。


    让我们回顾一下应用法则（applicative laws），并尝试根据这些法则验证我们的实现。我在这里只尝试证明其中两条法则，因为另外两条（见下方）在 PHP
    中模拟非常困难且复杂。


