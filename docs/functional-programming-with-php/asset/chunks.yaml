    There is no golden rule recommending functional programming in certain situations
    or object-oriented programming in others. Functional programming is not a framework
    or design pattern but a Turing complete methodology. To this end, as you familiarize
    yourself with functional programming, you will develop an innate sense of when
    particular methodology is best employed to solve problem. It is worth noting this
    will be different for each language and working in functional programming versus
    Scala is very different. In the PHP world due to the bias towards object-oriented
    programming functional programming is mostly used for list processing but does
    not stop us from exploring more complex constructs as you will see further.


    ## 2.6 The Benefits of Functional Programming


    So how does removing features from your imperative language help? With the ever
    increasing popularity of functional programming it is important to keep pace.
    Insights gleaned from your exploration of functional code can be applied in object-oriented
    programming as well. One regularly quoted rule states the increase in legibility
    of program improves as the level of abstraction rises by virtue of succinct code
    it encourages. It is also often said a side effect of these attributes is an increase
    in productivity with less typing and no global state to construct in your mind,
    helping to free your time for more difficult problems.


    Testing your code becomes much easier because all values are final which means
    you do not have to contend with side effects. There is no particular order to
    maintain or global state which needs to be put into place. All you need to do
    is pass in the correct arguments you will always get the same result. This concept
    is often described as referential transparency which basically means you can replace
    any function call with the value it returns and the resulting algorithm will remain
    the same. Therefore instead of `range()` we could use static array and still get
    the same result:


    ```

    Substituting static values into imperative example would be impossible (proving
    me wrong!), and this is where functional-style really shines. Each function given
    the same input will always return the same value. It should not be underestimated
    how much easier these functions are to test than their state-filled counterparts.
    There is less time wasted mocking global state and when a test fails it will always
    fail. Reproducing the bug does not require long chains of actions to surface due
    to functional program’s avoidance of any global state and adoption of encapsulation
    for its components. If a function is not returning the correct values then it
    is always incorrect. While it is not usually an issue with PHP functional programs
    help to prevent race conditions between threads or processes. Maintaining a functional
    style allows you to program these types of applications with confidence (well,
    almost!). The importance of parallel processing continues to grow with the advancement
    of computer hardware.


    Computers are gaining more and more power by increasing the number of cores central
    processing units contain. If your software is to take advantage of this power
    then you will need to account for simultaneous processing. This is where functional
    programming’s abandonment of assignment statements really helps to protect you
    from process locking or attempting to update the same locations in memory. It
    also serves to make the order of execution irrelevant as without state to update
    a function will always return the same value. It is when you allow state to creep
    into code that jobs off into processes falters. Additional benefits of functional
    programming which do not generally apply to PHP—so we won’t discuss them here—are
    hot code deployment and machine optimization of code.


    ## 2.7 Functional Basics


    Despite PHP being inherently imperative it can support a basic functional style
    of programming. To make it easier to learn it is best to esche some aspects of
    the language to emulate a purer functional one:


    * Avoid changing state—even within a function.

    * Attempt to keep functions to one line or as short as possible.

    * Break problems down to their smallest units and turn these into reusable functions.

    * Remove control statements from your code.

    * As it is worth repeating avoid state and do not use variable assignments!


    You want to essentially create a little black box function which will always return
    the same value given the correct arguments. PHP has a number of language features
    to help form the basis of programming in this style. Probably the most useful
    is the lambda function which makes it easier to deal with code passing functions
    around as variables. Additionally language functions such as `array_map()` and
    `array_reduce()` are very useful for applying functions to lists of values. There
    are no immutable value types or statically-typed variables in PHP so it is up
    to your implementation to protect your functional code from changing state.


    As you begin to work in a functional way you will need access to more primitives
    for the complex operations you will encounter. Luckily the path has been previously
    trodden and there are a number of libraries we will cover later.


    ***


    1. [Simon Peyton Jones—Haskell is useless](http://youtu.be/iSmkqocn0oQ?t=1m23s)

    2. [Erik Meijer: Functional Programming](http://youtu.be/z0N1aZ6SnBk?t=16m44s)

    3. [Scala School](https://twitter.github.io/scala_school/)


    # 3 Language Features


    > “Recursion is the GOTO of functional programming.”

    >

    > —Erik Meijer (Computer Scientist, @headinthebox)


    Despite PHP’s reputation for being a little lackluster in stringent programming
    environments it is reasonably well featured. Most of its power came in versions
    5.3 and above, but since PHP 5 it has been headed in a good direction. Notice
    I said “good” and not “the right” direction! As version 5 has progressed there
    has been a number of new features added to the language that have also eased development
    with PHP.


    While it is true a lot of these features could have been implemented in more optimal
    ways to support functional style, they none the less exist.

