    ```


    ```


    解析器必须处理所有对 `recursive_sum()` 的递归调用，最后才能将结果加到 `$x` 上。实现相同功能的尾递归看起来像如下函数：


    ```


    ```


    ```


    `tail_sum()` 没有相同的问题，因为每次迭代直接在行内执行计算。


    正如之前提到的，遗憾的是，PHP 与 Python 一样，并没有利用尾递归提供的性能机会。


    ### 相互递归（Mutual Recursion）


