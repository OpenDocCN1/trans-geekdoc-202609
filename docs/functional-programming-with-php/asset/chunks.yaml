    \ with the callback function always coming first where applicable. It is a very\
    \ well thought out library which replaces core PHP functions with a much neater\
    \ interface.\n\nWhere possible I would recommend you add it as a dependency to\
    \ all your applications be they functional or not. Then simply take a list of\
    \ any type and apply your will to it just as we would wish PHP’s in-built functions\
    \ to do.\n\n* * *\n\n1.  [functional-php](https://github.com/lstrojny/functional-php)[↩](#ch007.xhtml#fnref1)\n\
    \n2.  [Underscore.php](http://brianhaveri.github.com/Underscore.php/)[↩](#ch007.xhtml#fnref2)\n\
