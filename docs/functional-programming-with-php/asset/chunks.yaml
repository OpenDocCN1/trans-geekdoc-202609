    就像在 PHP 5.6 中，可以使用变长参数（variadics）和解包运算符（splat operator）来极大提高此类代码的可读性。


    在之前的示例中，我们使用了 `func_get_args()` 来获取参数数组。这个函数的遗憾之处在于它会返回所有参数，无论你是否已经将它们赋值给了参数变量。这导致我们在之前的示例代码中必须使用
    `array_slice()` 来移除第一个参数。


    变长参数通过对函数参数进行细微的语法调整，使这个过程变得更加简单高效。函数的最后一个参数可以以三个连续的点作为前缀。这指示 PHP 将所有后续参数作为数组传递给你的变长变量。


    ```

    然后我们可以使用一组参数调用此函数，以观察变长参数的行为。

    ```


    当执行 `sum3()` 时，PHP 将将第一个参数（`1`）赋值给 `$a`，将第二个参数（`2`）赋值给 `$b`。所有后续参数（3 到 10）都将赋值给变长变量
    `$xs`。该变量通过前面的三个点 `...$xs` 被指定为变长参数。


    > 你可能在想为什么我用 `xs` 作为变量名——嗯，这是一种 Haskell 风格的习惯，表示该变量包含一个 `x` 的列表。就像自然英语一样，“s”表示复数或多个。


    > 所以 `xs` 是类型为 `x` 的值的集合，其中 `x` 可以是 `int`、`float` 等。


    当然，这个示例并没有实际应用，因为你通常会放弃 `$a` 和 `$b` 变量，直接在 `array_sum()` 中使用变长参数。


    如前所述，解包运算符是变长参数不可或缺的补充。它也被称为展开运算符（unpacking operator），它接收一个数组并将其内容转换为函数的参数列表。鉴于它与我们检查过的变长参数相同，其语法很容易记忆。


