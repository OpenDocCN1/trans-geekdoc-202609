    ## 4.2 The iter Library


    Generators and iterators are very handy features of PHP, but like most of the
    features we have studied there are some rough edges. The userland `iter` library
    helps to make their usage simpler and cleaner. The library can be installed as
    a dependency with `composer` much like the other libraries we have reviewed here.
    The main benefit it provides is a set of functions which can be universally applied
    to all PHP iterables, arrays, traversables, and aggregates. These include implementations
    of `map`, `reduce`, and `range` which we have seen previously. The exception here
    is they can be applied everywhere and to all PHP collections.


    To make the code more efficient all access is completed via generators which allows
    the library to be lazy. By this I mean it will only actually complete the work
    when, and only when, it is needed for the continued execution of the program.
    This is the opposite of eager loading where as much work is done up front as possible,
    even if the result may not actually be used in this context.


    So you get the benefit of a better API and improved overall performance. To keep
    it simple we will start with an example we have seen a few times already: summing
    up a range of integers.


    ```


    ```


    It can also be used in more complicated functional code with good results. If
    you have to deal with an array of items and you cannot be sure they are all of
    the same type then the `iter\takeWhile` function can really help.


    ```


    ```


    This library is a very handy replacement for many of PHP’s list/iterable access
    functions. Alongside `functional-php` it can create a very useful toolkit of primitives.


    As this library is based upon generators the iterables are not currently rewindable
    by default. To work around this the library has in-built support for iterator
    conversion to rewindables.


    ```


    ```


    Generators from the `iter` library are already bestowed with a rewindable variant
    under the `iter\rewindable` namespace. Any function such as `map`, `reduce`, etc.
    from the `iter` library can be called this way for rewindable functionality.


    ```


    ```


    The functions this library provides are very useful when dealing with lists in
    PHP 5.5 and above where generators are supported. They are predictable with the
    callback function always coming first where applicable. It is a very well thought
    out library which replaces core PHP functions with a much neater interface.


    Where possible I would recommend you add it as a dependency to all your applications
    be they functional or not. Then simply take a list of any type and apply your
    will to it just as we would wish PHP’s in-built functions to do.


