    if there is one. To illustrate this functionality in action, here is the imperative
    example implemented using the `Maybe` monad instead of an imperative `if else`.


    ```


    ```


    Just as in the imperative example, when there is no row available, this code will
    echo “Name: Unknown”. If there is a record, it will display “Name: Marion (verified)”.
    The advantage of using the monad in this case is it could be chained with other
    function applications, the code to add the verified label can be easily reused
    elsewhere, and the code is arguably easier to read and simpler to write.


