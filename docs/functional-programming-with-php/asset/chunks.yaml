    First, it gets its own function name and stores it into a variable for later use.
    It’s also grabbing all the parameters passed to the function except for the first
    one. Here comes some more good news, `amap()` can apply more than one `Applicative`
    to the parameters! All you have to do is pass in an array of `Applicatives` as
