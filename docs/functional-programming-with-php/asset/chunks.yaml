    # 8 事件驱动编程


    > “如果人们不相信数学是简单的，那仅仅是因为他们没有意识到生活是多么复杂。”


    > —约翰·冯·诺曼（数学家、物理学家，1903–1957）


    函数式风格代码的一个非常成熟的应用领域是事件驱动编程。如果你以前写过 JavaScript 代码，你可能已经对这种范式有了先前的经验。`setInterval()`
    和 `onClick()` 等函数就是 JavaScript 中使用事件驱动方法的两个例子。虽然这并不是 PHP 开箱即用就能支持的方法，但幸运的是，有一些扩展和库可以提供帮助。


    在处理异步代码时，消除和避免状态的函数式方法是一个主要优势。当然，如果没有简单的函数式构造（如 lambda 和闭包）来处理回调任务，创建此类程序也将困难得多。


    在 PECL 仓库中，有许多扩展旨在为 PHP 提供非阻塞 I/O 功能，例如 `libevent`、`eio`、`event` 和 `ev`。在库方面，有
    ReactPHP（你可能在部分函数应用章节中见过这个名字）以及其他一些较少为人知的选项。为了演示目的，我们将使用 ReactPHP。


    ## 8.1 安装 ReactPHP


    在 Composer 的帮助下，安装极其简单。在安装 Composer 后，在一个新的目录中，你可以运行：


    ```


    ```


    ```


    Composer 将安装 ReactPHP 组件以供你的项目使用。


    ## 8.2 快速上手


    与之前安装 Composer 库的示例一样，你首先需要在你的文件（`server.php`）中添加 vendor 自动加载。


    ```


    ```


    ```


    然后，我们就可以开始设置一个简单的 Web 服务器了，它的核心是一个长时间的 PHP 进程。当向服务器发送请求时，它会作为一个事件向上触发并触发动作回调。如果你以前有
    NodeJS 经验，那么这种模式对你来说非常熟悉。


    首先，我们将定义一个简单的请求处理函数，它只返回一个字符串。


    ```


    ```


    ```


    接下来是 Web 服务器本身，以及将其转换为长时间运行进程的必要事件循环：


    ```


    ```


    ```


    最后，我们必须将请求处理器（`$rh`）绑定到服务器（`$http`），为服务器设置监听套字，并启动事件循环。


    ```


    ```


    ```


    现在可以使用命令行 `php server.php` 启动服务器了。你现在可以通过 `http://127.0.0.1:7355` 服务器，并收到一个简单的
    `Sakubona, unjani?` 纯文本响应。


    该库是对使用 `stream_*()` 函数用 PHP 编写的代码的高级抽象，但如果你安装了 `libevent` 或 `libev`，它将使用它们的 C
    实现作为更快的后端。我们在这里定义的 HTTP 服务器可以用纯 PHP 代码编写：


    ```


    ```


    ```


    需要注意的是，ReactPHP 在其中加入了许多逻辑上的高级抽象和事件循环，而这个纯 PHP 示例是最精简的，因此它们不是完全可以替换的示例。


    ## 8.3 添加日志


    在 Web 浏览器中从我们的 HTTP 服务器获取响应是很棒的，但如果我们能为了调试目的记录每一个请求就太好了。问题之处于，我们有一个用于处理 HTTP 请求响应的良好纯函数，我们不想把另一个关注点（日志）放入这样一个整洁的函数中。我们可以利用闭包来组合对函数的调用。


    首先是日志函数，它只需将请求方法（`GET`、`POST` 等）和请求路径（`/`、`/page-name`）写入名为 `access_log` 的日志文件。


    ```


    ```


    ```


    我们还可以对请求处理器（`$rh`）的定义进行微调，使其只接收它实际需要的参数（`$response`）：


    ```


    ```


    ```


    为了映射这些函数，我们将它们封装在一个方便的闭包中，以便它们可以随后相互调用：


    ```


    ```


    ```


    最后，更新请求处理器绑定行以进行匹配：


    ```


    ```


    ```


    如果你现在通过浏览器访问 `http://127.0.0.1:7355` 执行此代码，你将看到相同的消息，但你的日志文件将包含类似的内容：


    ```

    GET: /

    GET: /favicon.ico

    ```


    第二个请求是 Web 浏览器尝试在我们的服务器上寻找 favicon。当然，我们的服务器上没有，但如果没有日志记录，我们永远不知道服务器每个请求被访问了两次。


    ## 8.4 引入 Monad


    到目前为止，我们已经用少量的函数式代码设置了一个简单的 Web 服务器。接下来，我们迫切需要服务器来处理用户请求。当然，以下代码并不是真的为了生产环境编写的，更多是作为切入点和
    Monad 使用的示例。


    既然你已经见过 `Maybe` Monad，我们将采用该想法并通过与列表 Monad（list monad）结合来稍微扩展它。这将为传入我们小型 ReactPHP
    Web 服务器的 `GET` 参数提供可预测的访问。为了透明透明，这个 Monad 将命名为 `QueryList`。正如你所预测的那样，它将是一个查询字符串数组的容器。


    像上容器 Monad 一样，我们必须扩展 `Monad`，定义基本的构造函数和类属性来作为我们的容器。同样在这种情况下，`pack()` 函数非常简单，因为它接受一个数组并返回封装在新
    `QueryList` 容器中的相同数组——这是 `Monad` 的默认单态行为。


    **列表 8.1**


    ```


    ```


    ```


    再次，对于这个 Monad 来说，`map()` 方法非常简单，但我们创建了一个新的 `flatMap()` 方法来增强它的功能。它接收包含的数组并简单使用
    `array_map()` 对数组中的每个值应用函数，然后将结果数组封装进新的 `QueryList` 实例。


    在解决了基础 Monad 函数之后，是时候讨论特定问题的方法了。其中第一个是 `isNothing()` 方法，我们在 `Maybe` Monad 中见过它。对于我们的
    `QueryList` Monad，我们必须进行一些修改以方便所需的检查。代码必须知道整个容器是否为空，或者（如果提供了索引）容器中的特定索引是否为空。


    正如你所看到的，这是通过使用三元运算符判断是否提供了索引，并对容器的存在进行简单的到位布尔检查完成的。这个方法就像 `Maybe` 示例一样，稍将在内部使用，但公开使用也很有处。


    为了能够从容器中获取值，我们必须在列表 8.1 中添加 `get` 方法，就像 `Maybe` Monad 一样。当然，有一个非常微的变化，以便在提供可选
    `$index` 参数时从包含的数组中获取特定索引。


    为了让我们的访问更健壮，我们还将创建一个简单的 `getOrElse()` 方法，它将允许我们访问索引或整个数组。如果请求的容器部分 `isNothing()`，则它将返回提供的默认值。再次，这无疑与
    `Maybe` Monad 中的同名函数非常相似。


