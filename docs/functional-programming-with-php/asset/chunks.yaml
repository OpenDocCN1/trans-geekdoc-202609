    Next up is a simple PHP function object which will handle reading a stream from
    the Unix random source at `/dev/urandom`. For the sake of being obvious, we will
    call this class `ReadStream`.


    ```


    ```


    ```


    > `/dev/urandom` is a non-blocking source of random binary information on POSIX
    systems. It is similar in nature to `/dev/random`, but it is cryptographically
    less secure as it reuses the internal entropy pool to generate pseudo-random bits.
    This reuse makes it potentially less secure, but for our purposes, it will do
    nicely.


