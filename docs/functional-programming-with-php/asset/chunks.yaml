    # 5 HHVM’s Hack


    > “Never had any mathematical conversations with anybody because there was nobody
    else in my field.”


    >


    > —Alonzo Church (Mathematician and Logician, 1903–1995)


    Facebook has been using PHP for years, but as the site’s membership grew so did
    its load times. In a bid to speed up PHP they wrote an internal-use-only transpiler
    that could convert a small subset of PHP to a C program. This resulted in faster
    load times, but was cumbersome to use and required specialist internal knowledge
    to run correctly. As time wore on this became less and less viable and the code
    to take longer to compile. Eventually a new project was started which would go
    on to be HipHop Virtual Machine or HHVM for short. It is a just-in-time parser
    which creates an efficient cached representation of your program as it is executed.
    To obtain the best performance this cache must be warmed by running the target
    code a number of times to allow HHVM to get the most optimal picture of your code.
    It is worth noting the JIT aspect does not enhance performance on the command
    line as a new cache is used on every invocation.


    Alongside this new and faster runtime Facebook also needed a few features to be
    added to the language. This has grown to become the Hack language. The languages
    are essentially the same with Hack being a fork of PHP, albeit on its own runtime.


    To notify the compiler you are using Hack instead of PHP you simply use `<?hh`
    as the opening tag instead of `<?php`. HHVM will see this tag and then parse the
    code as Hack instead of straight PHP. Inside these tags you can perform operations
    just like you would with PHP, but benefit from improved JITing as you refactor
    the code slowly to Hack. There are some things PHP supports which HHVM has deliberately
    omitted as their actual implementations is in the wilds of PHP are limited. To
    ensure they achieve a reasonable parity, Facebook has chosen a number of open
    source projects to compile unit tests against.

    '
