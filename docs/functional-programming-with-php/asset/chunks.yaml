- raw: "It is worth pointing out that this is not an officially recognised emblem\
    \ of PHP and indeed Postgresql use the pachyderm for their own logo albeit designed\
    \ from a different angle. There have been numerous discussions about adopting\
    \ the elephpant with Rasmus Lerdof having liked the idea in the past according\
    \ to online gossip. It once even featured on the php.net logo download page.\n\
    \n* * *\n\n1.  [PHP Classes](http://www.phpclasses.org)[↩](#ch003.xhtml#fnref1)\n\
    \n2.  [7php.com](http://7php.com/elephpant/)[↩](#ch003.xhtml#fnref2)\n\n3.  [Adopt\
    \ your elephpant](http://elephant-php.com)[↩](#ch003.xhtml#fnref3)\n\n# 1 Introduction\n\
    \n> “I am in much dismay at having got into so amazing a quagmire & botheration\\\
    […\\]”\n\n> \n\n> —Ada Lovelace (Mathematician, 1815–1852) discussing mutability\
    \ with Charles Babbage (created first concept of a programmable computer, 1791–1871)\n\
    \nOver the course of the past twenty years or so, functional programming has seen\
    \ a slow and steady growth. This has led to many languages adopting functional\
    \ aspects, including the much-maligned PHP. As computer hardware and language\
    \ support improves, it is important to begin learning the basics of functional\
    \ programming. While it is true programming in this style requires a change in\
    \ thinking, you will find some understanding of it has a positive impact on your\
    \ object-oriented code as well.\n\nLet us begin our journey through the functional\
    \ aspects of the PHP language.\n\n## 1.1 Prerequisites\n\nYou must have access\
    \ to PHP version 5.4 or greater and command line access to the machine in question\
    \ is incredibly beneficial. When writing, I used a Debian-based machine, and a\
    \ similar POSIX computer is recommended, although not required.\n\nOne of the\
    \ best things you can do while learning is to install a decent REPL on your machine\
    \ as it will make it much easier to experiment with code as you follow along.\
    \ REPL stands for read-eval-print loop, and it’s basically a programming environment\
    \ most commonly used on the command line. It allows you to try out algorithms\
    \ easily without the need for an editor or even files to contain your code. Type\
    \ code into it, hit return, and your code is executed with the result printed\
    \ on screen.\n\nThere are a number of good REPLs out there, and I have had success\
    \ with PsySH\n\nIf you do not wish to install a REPL on your machine, you could\
    \ use the online service 3V4L\n\nAs we progress through more functional programming\
    \ in PHP, I will suggest useful PHP libraries and extensions. These are either\
    \ installed via Composer \n\nIt goes without saying this book is not aimed at\
    \ beginner PHP developers and some object-oriented experience is assumed. Having\
    \ said that, of course, this is as gentle of an introduction as possible and represents\
    \ a beginner guide to functional programming in PHP.\n\n## 1.2 Requirements\n\n\
    ### PHP\n\n*   PHP 5.4+ (for some libraries, a later version might be required)\n\
    \n### Other Software:\n\n*   Dependency management: Composer\n\n*   Extension/Library:\
    \ functional-php\n\n*   Library: React/Partial\n\n*   Library: nicmart/Functionals\n\
    \n## 1.3 For Users of Older PHP Versions\n\nIt is certainly possible to write\
    \ functional code and work through most of this book while using PHP 5.3.2 or\
