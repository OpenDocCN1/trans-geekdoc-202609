    这涉及到在 GitHub 上挑选几个具有良好测试套集的顶级 `PHP` 项目。然后他们在他们的 `HHVM` 构建中运行这些测试，以查看在哪些地方失败。在识别出缺乏支持的区域后，他们处理失败的测试，直到它们解决为止。这一理念是实现与
    `PHP` 对等性，以便让现有项目和 PHP 公司更容易采用该运行时。


    这种对匹配 `PHP` 的愿望甚至使 Facebook 团队创建了语言规范的初期。这仅仅是一份详细说明该语言应该做什么及其所需核心库的文档。在准备好之后，他们将其开源，由
    `PHP` 团队维护。


    这凸显了 `PHP` 与许多其他语言（如 `Python` 或 `Ruby`）不同的一个方面。在编写 `PHP` 运行时，他们并没有一个可以遵循的规范（他们只是简单地实现了这些功能——好吧，最开始只有
    Rasmus 一个人）。我想这是因为这样做更快、更简单，而且推测当时没有人认为会编写该语言的其他实现版本（例如 `HHVM`）。然而，几年之后，我们有了 `HHVM`、`Zephir`、`HippyVM`
    和 `Quercus`（在 Java 虚拟机或 `JVM` 上）。


    对于 `PHP` 来说，拥有如此知名的替代方案是一个新事物，但对于 `Python` 来说，这是他们习惯甚至要求的。在那里，语言实现为 `IronPython`
    (`.NET`)、`Jython` (`JVM`) 和 `CPython` (`C`)，为开发者提供了更多样化的选择。另一方面，`PHP` 的 `Zend
    Engine` 可以认为是该语言事实参考实现，任何其他运行时都必须模拟它的特性。


    回到 `Hack` 语言本身，它可以被认为是 `PHP` 语言的扩展。尽管如此，它包含一些非常有用的功能，极大地丰富了 `PHP` 的基础。哦，`Hack`
    是用 `OCaml` 编写的——一种函数式（以及其他范）。


    ## 5.1 类型


    在我看来，`PHP 5` 最薄弱的部分之一是类型系统，而 `Hack` 通过对类型系统的扩展在很大程度上解决了这个问题。在 `PHP` 中，几乎没有允许创建类型，除非你想将值封装在类中——这是一项艰巨的任务。


    然而，在 `Hack` 中，你可以使用类型别名来创建新类型，然后可以在整个代码中引用它们。这种更好的支持极大地减轻了代码维护的负担工作。它也让你在为应用程序编写新功能时，更容易对你编写的代码进行推理。


    首先，让我们回到基础，回顾 `Hack` 提供的核心内置类型。这些类型与 `PHP` 定义的类型相同。但一个关键区别是函数参数中可以提示类型（`int`、`string`
    等）。此外，还可以定义返回类型，允许你对代码进行进一步推理并让解析器报告类型不匹配。正如之前讨论的，这有助于消除整类错误。


    虽然 `PHP` 确实有类型，但它们很容易被提示，且变量可以任何时候更改类型。这使得编写预期对特定类型操作的代码变得困难。在 `PHP 7` 之前，你可以使用某种类型测试的
    switch 语句，或者强制转换为你预期的类型并希望该值仍然有效。这对于 `PHP` 来说是一个优点，因为它让语言更自由因此更容易学习。但当你想要编写抽象代码时，它成了一个阻碍。


    这就是 `Hack` 语言的类型系统可以帮助的地方。可以避免声明类型，因为 `Hack` 会从你赋值的值中推断类型。如果在声明时分配了一个整数，那么变量的最终类型将自动是
    `int`。这种行为与 `PHP` 非常相似，但在类型提示方面除外。


    一个函数可以定义为第一个参数仅接受整数，如下，它还声明了将返回一个 `int`。


    ```

    ```

    ```


    在此处，你可以看到参数 `$a` 被指定为整数。默认情况下，`Hack` 会在将值传递给函数之前尝试将任何非 `int` 值转换为整数。这可能会导致一些意料之外的行为。


    你可以通过在起始标签 `<?hh` 之后放置注释来设置你希望 `Hack` 解析器严格到什么程度。这允许你在不同的严格级别下运行各种代码，但这并不是一件好事。这可能会导致困惑，而且一直必须添加注释是很令人恼的。另一方面，它使得在必要时切换到不那么严格的模式成为可能。


    为了能够从 `Hack` 调用 `PHP` 代码，你必须在调用文件中不使用 `strict` 模式，例如。这是因为 `strict` 要求代码必须定义并编写类型。

    '
