    你还可以通过柯里化、组合和部分函数应用等技术利用高阶函数创建更有用的表达式——这些将在接下来的章节中介绍。


    ### 函数对象（Function Objects）


    在 PHP 中，通过调用任何实现了 `__invoke()` 魔术方法的对象，可以将类实例视为一个函数。这个过程在 PHP 世界中通常被称为泛子（functor）。实际上，类实例在这样调用时会变成一个闭包（closure）。


    **Listing 3.6**


    ```


    ```


    ```


    你可能有很多理由考虑以这种方式实现函数，但主要的优势是闭包变得更容易复用，并且在类型提示时可以更具体。当然，一个局限性是类只能有一个以这种方式调用的函数。你还可以访问类上下文，允许复杂的算法封装成一个整洁的包。


    当魔术方法被调用时，它的作用域与任何类方法相同，这意味着它可以访问对象包含的任何状态。在 `SumFunctor` 的情况下，可以调用另一个方法来执行计算。


    **Listing 3.7**


    ```


    ```


    ```


    这种方法的优势是可以使用标准的对象访问或通过 `__invoke()` 魔术方法访问同一个 `sum()` 方法。直接使用对象访问调用 `__invoke()`
    相当难看，为了遵循更具读性的方法名，应尽可能避免。


    ```


    ```


    ```


    现有的类实例还可以通过 `Closure::bind` 和 `Closure::bindTo` 方法与闭包共享上下文。这允许你获取一个现有的类作用域并与闭包共享。`bindTo`
    和 `bind` 都接受闭包作为参数，并返回一个具有关联类作用域的新闭包。


    **Listing 3.8**


    ```


    ```


    ```


    如果你还需要访问类的保护（protected）和私有（private）成员，可以通过提供类实例或字符串类型的类名作为 `bindTo` 的第二个参数来指定作用域。


    **Listing 3.9**


    ```


    ```


    ```


    使用 `bind` 非常相似，但它是一个静态方法，因此你必须将闭包传递给它，从而允许更短的代码。我们可以按照以下方式使用 `bind` 重写上一个示例：


    ```


    ```


    ```


    直接在 `bind` 调用内部定义闭包，允许我们跳过将其赋值给中间变量（如之前代码示例中的 `$echo_greeting`）的操作。


    与在类内部使用 `__invoke()` 不同，还可能将多个闭包绑定到实例的作用域上。相反，使用泛子可以允许你利用 PHP 的命名空间别名。


    ```


    ```


    ```


    这是一个较小的次要收益，而且 PHP 5.6 合并了一个补丁，以便使用 PHP 的命名空间语法来别名标准函数。


    然而，函数对象至少有两个缺点，其中第一个最令人烦恼。你目前无法在不先创建实例的情况下内联调用函数，如下所示：


    ```


    ```


    ```


    希望 PHP 会添加类似于下面的代码的内容，以方便这种更易的访问风格：


    ```


    ```


    ```


    此外，函数对象可能会受到诟病，因为它们不是自文档的（self-documenting）。每个 `__invoke()` API 都可能不同，使得预测性使用变得困难。在我的研究中，大多数
    IDE 也无法为函数对象提供参数提示。


    需要注意的是，此功能实际上并不是范畴论定义的泛子，一个更准确的基于计算的术语是函数对象。在范畴论中，泛子是两个范畴之间的映射，其中被映射范畴的结构被保留。


    话虽如此，泛子一词被用于描述跨语言的许多不同技术，PHP 在这方面倾向于 C++。


    ## 3.3 命名空间（Namespacing）


    PHP 在 5.3 版本中引入了命名空间，它们几乎普遍地取代了旧的 PEAR 风格命名空间（用下划线替换目录分隔符，因此 `/Vendor/MyClass.php`
    变为 `Vendor_MyClass`）。虽然语法被许多人诟病（很有道理），但能在 PHP 中最终拥有命名空间的代码真是太棒了。现在大多数项目只使用面向对象的代码，因此很少知道函数也可以拥有命名空间。


    它的语法与你在类中看到的几乎相同，在文件顶部声明一个命名空间，然后该命名空间被应用到整个类容器，如 Listing 3.9 所示。


    **Listing 3.9**


    ```


    ```


    ```


    另一方面，函数没有像边界容器来将它们分组，就像 Listing 3.2 中的方法通过其包装类（`MyNamespacedClass`）那样。这正是实际上可以使用命名空间直接包装我们的函数的地方。


    命名空间子可以与包裹在应该命名空间的功能周围的大括号一起使用，如 Listing 3.3 所示。


    **Listing 3.10**


    ```


    ```


    ```


    再次，调用这些函数就像实例化带命名空间的类或调用其中的方法一样。你只需要包含一个 `use` 语句来指示你想要引入的命名空间。


    ```


    ```


    ```


    这是编写函数式代码的一种简单方法，当你定义两个同名函数时它不会报错。遗憾的是，它能做的只有这些，如果你希望有自动加载（autoloading），你完全会感到沮丧。有解决这个问题的方法，但它们并不优雅且与命名空间无关，因此它们存在于
    *PHP 中函数式编程的风险 章中。


    ## 3.4 递归（Recursion）


    ### 基础（Basics）


    为了消除程序中的 `for`、`foreach` 和 `while` 等流控制语句，你可以使用递归创建循环。这是一个从函数内部反复调用自身的过程，直到达到预设的截止点。


    递归在 Web 编程中非常常见的用法围绕打印内容管理系统的站点菜单结构，它也适合处理文件系统的目录树。


    ```


    ```


    ```


    在上面的示例中，函数递归地调用自己直到到达数组结束。在此，它将数组的每个元素连接在一起。


    每次迭代中，代码首先确定请求的数组索引是否存在，如果存在，它就会递归调用自己(`concat()`），将索引 `$index` 加 1，并将当前数组元素连接到字符串
    `$result` 的末尾。当遇到数组结尾时，它将返回 `$result` 的值，递归结束。


    你永远不会这样连接字符串，但它作为了在没有变量赋值语句的情况下执行递归“循环”的简单说明。


    ### 尾递归（Tail Call Recursion）


    PHP 中的大多数递归函数不是用尾递归编写的，但在某些情况下它是更优的。


    递归会导致编译器等待被调用函数的结果，然后才能返回自己的结果。相反，尾递归允许编译器进行优化以提高速度并减少资源消耗。遗憾的是，PHP 并没有利用这一点，但它仍然是一个值得掌握的技巧，因为在某些情况下它可以让代码更清晰。


    这是一个展示两种风格的简单示例，首先是常见的递归形式：


