  trans: "\n到目前为止，我们涵盖了所谓的直接递归——即函数通过调用自身来创建循环。例如，如果函数 `x()` 调用了它自己 `x()`，那么就是直接递归。\n\
    \n你也可以实现间接递归（有时扩展称为互递归），通过创建一个函数，该函数稍后再次调用原始函数产生循环。这种情况是函数 `x()` 调用函数 `y()`，而\
    \ `y()` 随后再次调用 `x()`，循环就从那里开始重复。\n\n### 递归 Lambda 表达式 (Recursive Lambdas)\n\n\
    从表面上看，lambda 表达式似乎无法调用它们自己，但取决于你运行的 PHP 版本，有几种相对简单的方法可以实现。\n\n最明显的方法是传递变量；使用 `use`\
    \ 关键字将 lambda 赋值给自身。这看起来很简单，你可能已经想过要这样使用它，但在尝试过之后，你可能会对一个莫名其妙的 PHP 错误感到失望。\n\n\
    令人惊讶的是，变量实际上必须通过**引用**传递，操作才有有可能成功。这是因为在变量馈入 lambda 的那个点，它还没有被定义（被定义的是 lambda\
    \ 自身），因此它的值仍然是 `null`。当变量通过引用传递时，它的值是 `null` 并不重要，因为一旦解析器完成其定义的执行，它将更新为指向该 lambda\
    \ 函数的引用。\n\n```\n```\n\n```虽然通过引用传递避免了这个问题，但它破坏了匿名函数的标准定义。如果你稍后修改了通过引用传递的变量，它在\
    \ lambda 内部也会随之改变。这不符合直觉，因为这不是 lambda 默认的工作方式，而且你还允许全局可变状态进入你的应用程序。\n\n如果你使用过函数对象（function\
    \ object），那么就会变得更简单，因为有 `$this` 可以帮助你进行递归调用，而无需任何引用的复杂副作用。下一个代码示例解决了与上一个代码示例相同的问题，但使用的是函数对象。\n\
    \n```\n\n```\n\n虽然这种情况下代码的代码更长，但它消除了由 `use` 关键字引入的共享可变状态所带来的非常糟糕的体验。\n\n根据我的经验，递归\
    \ lambda 的需求并不常见，通常有其他选择，但当你需要它时，这些技巧确实大有帮助。\n\n### 不要导致栈溢出 (Don’t Blow the Stack)\n\
    \n递归循环是强大的，但在代码中实现它们时，有几点需要注意。如果你没有包含退出条件，或者选择了一个过于宽泛的条件，就会面临出现意外行为的风险。通常，这表现为栈溢出异常（stack\
    \ overflow exception）。\n\n编译器会一直循环直到某些东西停止它为止，所以如果你或超时保护机制没有停止它，最后的限制就是机器的物理资源。在这种情况下，你首先遇到的很可能是内存限制。\n\
    \n记住，递归调用中的所有调用、参数和变量赋值都会影响内存消耗量。例如，当代码内部有调试代码时，你的进程会更快耗尽内存！\n\n## 3.5 Map, Reduce\
    \ 和 Filter (Map, Reduce, and Filter)\n\nMap/reduce 提供了一种简单的方法，可以为复杂的列表处理操作创建优雅的代码解决方案，并且已被证明在高可用性、大规模处理中非常有用。你可能听过\
    \ Hadoop、CouchDB 以及类似的 NoSQL 解决方案实现了 map/reduce——更不用说 Google 的索引算法了。使用 `array_map()`\
    \ 和 `array_reduce()`，在 PHP 中也可以利用这些技术。\n\n### Map (映射)\n\nMap 遍历一组数据，通过对列表中的每个项应用函数来产生一个新的值列表。大多数的\
    \ `for` 和 `foreach` 循环都可以轻松替换为对 `array_map()` 的调用。区别在于它将计算函数与循环本身分离来。\n\n当然，这非常利于代码复用，你可能需要在不同的语境下对列表应用相同的操作。\n\
    \n另一方面，至少在 PHP 中，使用 `array_map()` 比使用 `foreach` 慢一点，但除非你是那种会纠结微优化的开发者，否则这种差异是可以忽略不计的。\n\
    \n```\n\n```\n\n现在给你提供一个有趣的想法——列表可以包含函数，而不仅仅是初元值。例如，你可以使用 `array_map()` 执行数组中包含的所有函数并返回它们的所有值。\n\
    \n### Reduce (归约)\n\n另一方面，Reduce 遍历列表，通过对列表中的每个值应用相同的处理函数，将其中的值折叠或合并为一个最终的值。这种操作有时被称为\
    \ fold 函数（折叠函数），PHP 的 `array_reduce()` 函数可以被比作左折（left fold）。\n\n在下面的 reduce 示例中，你可以看到它在一个整数列表上操作，并将每个元素加到总和中。这是一个迭代过程，每次处理数组中的一个元素。\n\
    \n```\n\n```\n\n### 并联使用 (In Tandem)\n\n当然，这两种技术可以结合起来产生极佳的效果。如果你有一个包含文档列表的集合，你可以使用映射函数遍历每一个文档并计算它在磁盘上的文件大小。此外，如果知道总文件大小将是好的，这样你可以使用\
    \ reduce 函数遍历文件大小并将它们相加，重用上面创建的 `sum()` 函数。\n\n```\n\n```\n\n在这里你已经看到 `array_reduce()`\
    \ 直接作用于 `array_map()` 返回的数组结果上。这是一个非常简单的示例，但你可以使用这两个操作来轻松处理列表，无论大小。\n\n你可能已经注意到了\
    \ PHP 实现这两个小函数的一个非常恼人的的事实——它们没有保持相同的参数顺序！Reduce 先接受集合（或数组），然后是回调函数，而 map 则是相反的。\n\
    \n### 给我键！(Gimme the Keys!)\n\n在 PHP 中，map 和 reduce 的困难之处在于无法访问数组键。解决此问题的唯一真正方法是编写你自己的实现。另一个与\
