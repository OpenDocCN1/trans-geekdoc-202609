  trans: '

    这本书向你介绍了一些你现在 PHP 项目中可以使用的函数式编程技术。虽然这可以作为你所熟悉语言的一门很好的入门课程，但如果你想更进一步，我建议你也应该开始关注其他语言，如
    `Haskell`、`Scala` 或 `Clojure`。我发现自己在非常熟悉的语言中学习新概念更容易，因此这本书是针对有类似背景的读者的。


    在我自己的项目中，我确实使用了一些函数式方法论，但到目前为止，我通过开源发布的项目都是用面向对象的 PHP 编写的。这反映了 PHP 倾向于使用命令式代码而非函数式编程的现状。我的商业代码也是如此，尽管我希望未来这些技术能被更广泛地理解。我们需要更多的函数式项目作为开源发布，更多的讨论，更多的演讲者进行分享，当然，还有更多的博客和杂志文章来撰写。


    并不是说目前没有任何开源项目在代码中使用函数式构造结构。我了解的几个例子包括 `ReactPHP`（事件驱动框架）、`Bullet`（自描述函数式 Web
    框架）、`Slim`（微框架）和 `Pimple`（依赖注入容器）——尽管（据我所知）它们没有一个利用了更复杂的函数式技术，通常只是在此处包含少量的 lambda
    或闭包。我相信还有许多其他项目也在使用类似的代码——如果你知道我遗漏的有趣项目，请告诉我。


    如果你想参与 PHP 函数式编程的开发，最好的起点是 PHP 内部主要邮件列表和 `RFCs`。


    ***


    1. [当前的 PHP RFCs](https://wiki.php.net/rfc)

    2. [PHP.net 维基](https://wiki.php.net)


    # 附录 A：补充说明


    ## 0.1 理解类型签名


    PHP 拥有弱类型结构，因此类型定义对你来说很可能是陌生的。实际上，它们非常简单，在本书中只是简单地描述了输入和输出。


    当你考虑 PHP 中的一个函数时，通常会查看它接受的参数。如果该函数在 PHP 手册中有记录，或者完全使用 `PHPDoc` 等工具进行记录，那么不仅会列出参数，还会列出它们期的返回类型。


    以 `substr()` 为例，它的定义如下：


    ```


    ```


    为了掌握 PHP 手册语法的基础，我们将从定义的开始看。


    1. `substr()` 是函数本身的名字。

    2. 下一个 `string` 实例指定了传递给第一个参数（示例中的 `$string`）的值类型。

    3. `$string` 是传递给函数的第一个参数名称。

    4. 逗号表示 `$string` 参数的结束，并指示后面还有另一个参数（`$start`）。

    5. 接下来，我们为 `$start` 提供了另一个类型指定（`int`）。

    6. `$start` 是第二个参数的变量名。

    7. 接着，左方括号表示后续将有一个可选参数。

    8. 逗号表示 `$start` 的结束和可选参数 `$length` 的开始。

    9. `$length` 是第三个也是可选的变量名。


    简而言之，从函数签名可以推断出函数 `substr()` 取两个参数加上一个可选参数。第一个参数应该是字符串，第二个应该是整数，第三个是可选的且为整数。变量的名字对我们来说并不重要，因为我们只是在调用函数，而不是在实际实现它的内部机制。


    这涵盖了函数的输入，但同样重要的返回类型呢？


    鉴于两个或三个参数，预期的输出是一个 `string` 类型的值。为了简洁，我特意在之前的定义中省略了它，完整的定义实际上应该是：


    ```


    ```


    > *注意* 在 PHP 7 中，返回类型的语法要求它写在函数定义之后。在本节中，我们关注返回类型如何在文档中呈现。


    初始的 `string` 关键字表示函数的返回类型。换句话说，这表示在调用 `substr()` 时将输出一个 `string` 类型的值。


    通常，用户态代码中的 API 手册也可以获得类似的文档。使用的格式通常可以通过如 `PHPDoc` 或 `Doxygen` 等命令行工具轻松编译成 API
    手册。


    它们看起来像这个用于 `PHPDoc` 的 `substr()` 版本：


    ```


    ```


    你可以看到它指定了与 PHP 手册版本相同的细节，但每个参数的描述跨越了多行，更加详细。在 PHP 5 中，类型定义基本上就是这样——它们只存在于文档中（如果存在的话）。如果每个实现函数的人都是完美的并且传递了正确的参数，这种特性运行得良好，但根据我的经验，这很少见。


    将定义放入代码中要好得多，这样编译器可以帮助你快速准确地识别错误。如果你想在 PHP 7 之前这样做，那么你必须考虑使用 `if` 语句检查函数参数的类型。当参数不符合预期要求时，你会抛出一个致命错误（fatal
    error）。


    **列表 A.1**


    ```


    ```


    再次，这强调了 PHP 与强类型语言之间的另一个重要区别（函数式语言遵循更严格的这一端）。PHP 是一种动态语言，这意味着代码在运行时的同时进行解析。任何致命错误都将在代码执行时触发，而不是在编译阶段和部署之前。


    当然，有了 PHP 7 的标量类型和返回类型提示，这个函数定义变得简洁得多。如果从严格模式的文件调用该函数，那么当参数不匹配类型时，引擎将抛出错误。在非严格模式下，PHP
    引擎会将输入参数转换为预期类型，只要这样做不会丢失数据。


    ```


    在像 `Haskell` 或 `Scala` 这样基于编译器的语言中，合约（通过类型设定）可以在编译时检查，而不是像 PHP 那样在运行时检查。这使得在交互代码时不太可能触发基于类型的致命错误。这就是为什么编译器和强类型系统非常有用的原因。


    在 PHP 中，你没有这种安全网，因为错误的类型错误只能在运行时发现。这意味着 IDE 也无法根据这些类型要求可靠地提示或显示错误。这有明显的缺点，但另一方面，动态语言在开发过程中提供了近乎即时的反馈。这种情况的坏处还有很多原因，但让我们回到类型上。


    正如我们所见，PHP 不强制类型，而且（有时糟）尝试将值转换为你正在尝试的操作所需的正确类型。在兼容 PHP 5 的代码中，标量类型定义位于注释中，因此无法强制执行。在
    `Scala` 或 `Haskell` 等其他语言中，类型是函数定义的一部分。函数的参数和返回值都是使用语言的类型系统定义的。如果返回或传递了错误的类型，编译器将在构建时抛出错误。


    `substr()` 函数的 Scala 类型定义看起来如下：


    ```


    ```


    这显示了一个与 PHP 的 `substr()` 函数 API 相同的函数，但是用 Scala 编写的。好吧，差不多！为了简化代码，所有参数都是必须的，而
    PHP 函数允许最后一个参数 `$length` 是可选的。


    以类似于之前 PHP 手册示例的方式进行推导，我们得到了一个类似的列表。

    '
