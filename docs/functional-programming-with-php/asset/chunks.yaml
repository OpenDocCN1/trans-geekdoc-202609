- raw: "Like in PHP 5.6 it is possible to make use of variadics and the splat operator\
    \ to greatly ease the readability of this kind of code.\n\nIn our previous examples\
    \ we used `func_get_args()` to obtain an array of arguments. The unfortunate thing\
    \ about this function is it returns all parameters regardless of whether you have\
    \ assigned them to an argument variable already or not. This lead to the use of\
    \ `array_slice()` to remove the first parameter in the previous example code.\n\
    \nVariadics make this process much easier and simpler with a slight syntax adjustment\
    \ to your functions parameters. The last argument to your function can be prefixed\
    \ with three consecutive dots. This instructs PHP to pass all subsequent parameters\
    \ to your variadic variable as an array.\n\n```\n\n```\n\nWe can then call this\
    \ function with a set of parameters to see how the variadic behaves.\n\n```\n\n\
    ```\n\nAs `sum3()` is executed PHP will assign the first argument (`1`) to `$a`\
    \ and the second (`2`) to `$b`. All subsequent arguments (3 through 10) will be\
    \ assigned to the variadic `$xs`. This variable is designated as being variadic\
    \ by the three preceding dots `...$xs`.\n\n> You may be wondering why I have used\
    \ the name `xs` for my variable—well it is a Haskell-esque convention to denote\
    \ the variable contains a list of `x`. Just like natural English the ‘s’ means\
    \ it’s a plural or many.\n\n> \n\n> So `xs` is a collection of values of type\
    \ `x` where `x` could be `int`, `float`, etc.\n\nOf course, this sample has no\
    \ real application as you would normally dispense with the `$a` and `$b` variables\
    \ and just use the variadic in `array_sum()`.\n\nAs previously mentioned the splat\
    \ operator serves as an invaluable counterpart to the variadics. Also known as\
    \ an unpacking operator it takes an array and turns the contents into an argument\
    \ list for a function. The syntax is easy to remember given it is just the same\
    \ as the variadic we examined.\n\nThis functionality can be shown in the following\
    \ function call where PHP is essentially converting the supplied array `$args`\
    \ into arguments against the `sum()` function defined earlier.\n\n```\n\n```\n\
    \nGoing back to the `log_and_call()` example it is possible to rewrite it using\
    \ variadics and argument unpacking.\n\n```\n\n```\n\nThis code is significantly\
    \ shorter and as a result quicker and easier to read. As the splat operator only\
    \ collects the unassigned arguments, we’re able to avoid slicing the `$arguments`\
    \ array. Not to mention removing two function calls which are no longer necessary.\n\
    \nThe splat or argument unpacking syntax added to PHP in version 5.6 allows for\
    \ an array to be converted into function arguments. This array does not necessarily\
    \ need to originate from a variadic or `get_args()` and can be an array you construct\
    \ yourself. Variadics can be used to capture the arguments passed to a function\
    \ as an array. It will pick up any arguments not already assigned to a named function\
    \ parameter variable.\n\n### Lambda λ\n\nLambda functions are simply an extension\
    \ of the basic PHP function idea. Essentially the lambda is a function which can\
    \ be treated like a variable—it is a function without a formal identifier. By\
    \ this I mean the function is not assigned a name at the time of definition. This\
    \ trait is often known as a first class function, which means they can be passed\
    \ as parameters to other functions, returned from a function assigned to a variable\
    \ or placed in more complex data structures.\n\nThese functions are often referred\
    \ to as lambda (λ) functions or anonymous functions interchangeably. To illustrate\
    \ how this looks in PHP we’ll reprise the add one function from earlier.\n\n```\n\
    \n```\n\nAlthough this will compile, it will not actually do anything as we have\
    \ no way of calling the function. Usually, a lambda function will be assigned\
    \ to a variable or passed directly into another function as an argument.\n\nWhen\
    \ assigned to a variable the add one function can be called much like a standard\
    \ PHP function although the variable is subject to the standard set of PHP scoping\
    \ rules. Unlike a named function, a lambda function assigned to a variable is\
    \ not immediately available from within other functions or class methods.\n\n\
    ```\n\n```\n\nThe key difference between a standard named function and a lambda\
    \ assigned to a variable is now it can be passed around, assigned to another variable,\
    \ or even destroyed by calling `unset()` against `$add_one`.\n\n```\n\n```\n\n\
    In other words, it is possible to treat the function just like any other variable\
    \ in PHP. All of these properties lead to the creation of higher order functions,\
    \ which will be addressed in the next section.\n\nIf you have some experience\
    \ with JavaScript, then this pattern will look very familiar as well.\n\n```\n\
    \n```\n\nIn PHP you may have encountered lambda functions used for lazy loading,\
    \ such as in a frameworks routing system. Another example can be found in the\
    \ venerable `spl_autoload_register()` which takes a function as its first parameter:\n\
    \n```\n\n```\n\nAs you can see, they can be assigned to variables, but equally,\
    \ they can be defined directly in the parameter of the receiving function (in\
    \ this case, `spl_autoload_register()`):\n\n```\n\n```\n\nAnonymous functions\
    \ are also known as lambda functions and they are declared with a formal name\
    \ or identifier. They can be assigned to a variable, passed as an argument, or\
    \ be returned from a function. One thing PHP will restrict you from doing is the\
    \ serialization of anonymous functions as it will trigger a parsing error. There\
    \ is at least one way round this with the help of Jeremy Lindblom’s SuperClosure\
    \ library\n\nFormalized in Alonzo Church’s papers, lambda functions are the basis\
    \ of the lambda calculus. They also underpin all of the functional programming\
    \ we will see in this book. Functional-style programming is not readily possible\
    \ in languages without first class function support.\n\nForgive the hyperbole,\
    \ but just about every piece of functional code ever written makes use of lambda\
    \ functions, and they are an important building block to add to your tool kit\
    \ and should be mastered before continuing.\n\n### Closures\n\nClosures are an\
    \ important feature of any functional language and have been deemed so useful\
    \ that a lot of imperative languages now also support their use. PHP is no exception\
    \ to this, with support for closures introduced in PHP 5.3.\n\nClosures are a\
    \ logical extension of the lambda function formalism by adding the concept of\
    \ context to functions as they can be used to transport code and data around as\
    \ a package. It could be considered that a closure represents a similar role in\
    \ functional programming as objects perform in object-oriented programming. In\
    \ fact, in PHP creating a closure actually returns an instance of the internal\
    \ PHP `Closure` class.\n\nMore specifically, the context is a piece of information\
    \ attached to the function at the point of definition. This information can be\
    \ an PHP variable such as an array, a lambda function, scalars or objects. This\
    \ is facilitated by the `use` keyword in PHP which pulls variables into a function\
    \ from the current scope without having to pass them into the function as arguments—`use\
    \ ($add_value)`.\n\n```\n\n```\n\nIt is important to note the value passed into\
    \ the closure is set at the point of definition. This is unlike a global variable\
    \ which can be changed anywhere and it will affect all code which later references\
    \ it. A function operating on a global variable will return a different value\
    \ if it is called again after the global variable is altered.\n\n```\n\n```\n\n\
    If we were to do this with a closure then the value will be fixed at the point\
    \ of defining our closure.\n\n```\n\n```\n\nThis succinctly demonstrates subsequent\
    \ alterations of the value assigned to `$my_global_var` make no difference to\
    \ the value encapsulated in our closure. This scoping is the most obvious difference\
    \ between PHPs globals and constants as opposed to its closures."
