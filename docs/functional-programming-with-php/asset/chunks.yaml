    ## 4.2 iter 库


    生成器（Generators）和迭代器（iterators）是 PHP 非常实用的功能，但与我们学习的大多数功能一样，它们存在一些不足。用户态 `iter`
    库有助于让它们的使用变得更简单、更简洁。该库可以像这里审查的其他库一样，通过 `composer` 作为依赖项安装。它提供的主要优势是一组函数，这些函数可以通用应用于所有
    PHP 可迭代对象、数组、可遍历对象和聚合。这些包括我们之前见过的 `map`、`reduce` 和 `range` 的实现。这里的例外是，它们可以应用于任何地方并适用于所有的
    PHP 集合。


    为了使代码更高效，所有的访问都通过生成器完成，这使得库具有懒加载（lazy）特性。我的意思是只有在程序继续执行需要时且仅在需要时，它才会实际完成工作。这与预加载（eager
    loading）相反，后者会在前端尽可能多完成工作，即使结果在当前语文中可能不会被实际使用。


    因此，您获得了更好的 API 和改进的整体性能优势。为了保持简单，我们将从一个已经见过几次的示例开始：对一个整数范围求和。


    ```


    ```


