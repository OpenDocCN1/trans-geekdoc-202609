- raw: "There you have it—a custom monad written for the job at hand. As you know,\
    \ it is built upon the groundwork in the `Maybe` monad and has been slightly augmented\
    \ with list-processing specific functionality. This allows us to easily wrap up\
    \ the `GET` query items in a robust container to facilitate easy universal access.\
    \ Not only that—it also provides a very handy way of applying functions to the\
    \ internal list. To that end, let us now define a simple lambda to wrap `htmlspecialchars()`.\n\
    \n```\n\n```\n\nIn order to support UTF-8 in PHP 5.3 and still set the correct\
    \ document type flag for PHP 5.4, we must have some simple version checking logic.\
    \ This means we have ended up with a very basic wrapping function we can now apply/map\
    \ against our `QueryList` monad.\n\nBefore we can do that, however, we must define\
    \ the ReactPHP server which will supply its `GET` parameters to us. Just like\
    \ last time, we need to implement an event handler with:\n\n```\n\n```\n\nAt the\
    \ moment, this takes in the request, extracts the query parameters, and packs\
    \ them into a `QueryList` monad. We then map `$html_escape()` to each value in\
    \ the array, which goes through applying `htmlspecialchars()`. The code then plucks\
    \ one particular index and prints it as the response.\n\nOf course, none of this\
    \ will run until we set up ReactPHP’s event loop and bind the event handler `$eh()`.\n\
    \n```\n\n```\n\nWith that complete you can start the server on the command line\
    \ as before and visit `http://127.0.0.1:7355?foo=bar` to see `bar` printed to\
    \ your web page. To see the `$html_escape()` lambda in action, we will need to\
    \ pass in some URL-encoded special characters instead of `bar`:\n\n```\nhttp://127.0.0.1:7355?foo=%3Cbang%3E\n\
    ```\n\nThis will print the result (`<bang>`) to screen in a properly HTML-encoded\
    \ manner.\n\nNow you have seen some event-driven programming and employed a monad\
    \ to save yourself from painful list interactions, but what is this hiding around\
    \ the corner? Callback hell! If you have ever written in an event-driven way before,\
    \ you have probably encountered the issue of having deeply-nested callback functions\
    \ rendering illegible code. There are a few patterns we can use to avoid this\
    \ issue which will be covered in the next section.\n\n## 8.5 Callback Wrangling\n\
    \nEvent-driven programming, if left to its own devices, can quickly enter a stage\
    \ known as *callback hell*. Unfortunately, the next level is certain death or\
    \ a major refactor, as the following highly-contrived code exemplifies.\n\n**Listing\
    \ 8.2**\n\n```\n\n```\n\nYou can save yourself from this right from the start\
    \ by adopting some predefined patterns in the code you are producing. To make\
    \ this deal sweeter, there are some simple, but powerful libraries which make\
    \ it easier to implement these patterns. This allows you to concentrate on your\
    \ code, abstracting the problem away.\n\nWe’re going to review two such libraries\
    \ with different approaches to the problem. They are both part of the greater\
    \ ReactPHP project although they are emulations of two different JavaScript libraries.\n\
    \n### Async\n\nStarting with the simpler of the two libraries, Async, which is\
    \ a PHP implementation of the ideas in async.js. It simplifies callbacks by allowing\
    \ you to define them as lists rather than being nested within each other. Much\
    \ as before, installation is relatively simple when using Composer in the same\
    \ directory you experimented with the ReactPHP web server earlier:\n\n```\n\n\
    ```\n\nYou can either call the functions in parallel or as a waterfall. By using\
    \ the parallel implementation, you are effectively passing the same call to a\
    \ set of functions and combining their results in the order they are returned,\
    \ rather than the order they are defined. This is demonstrated clearly in this\
    \ example (Listing 8.3) from the project’s documentation.\n\n**Listing 8.3**\n\
    \n```\n\n```\n\nThe waterfall model is different because it will pass the return\
    \ value from the preceding function as a parameter into the next one. In this\
    \ way, the functions return their results in the order they were defined. Listing\
    \ 8.4 is again taken from the documentation of the React/Async project.\n\n**Listing\
    \ 8.4**\n\n```\n\n```\n\nHere you have two simple methods for reigning in wild\
    \ callback functions, but I promised more! The next library is an implementation\
    \ of a subset of the functionality found in CommonJS.\n\n### Promises\n\nThis\
    \ pattern is known as a promise, and it is a little more complex, and more powerful\
    \ to boot. A piece of code can make a promise to return a certain value once its\
    \ asynchronous operation (known as a deferred) is complete. We do not want to\
    \ delay execution, so we take it at its word and accept a placeholder instead.\
    \ This placeholder, or promise, can be passed from function to function until\
    \ the result is required to continue execution. In the case of a database write,\
    \ you can stick it into an asynchronous operation and watch for a result to display\
    \ a notification or attempt a retry of the save.\n\nReact/Promise also makes it\
    \ possible to manage the processing of many operations. We will only address a\
    \ small subset of its functionality here, although there is more documentation\
    \ on the GitHub page for the project\n\nFirst, we need to install React/Promise\
    \ using Composer, and the installation instructions remain the same as specified\
    \ previously.\n\n```\n\n```\n\nTo begin with, we will create a simple logging\
    \ function called `elog()`, which is short for *echo log*. It will take a title,\
    \ a body, and an option to print or return the formatted log.\n\n```\n\n```\n\n\
    Next up is a simple PHP function object which will handle reading a stream from\
    \ the Unix random source at `/dev/urandom`. For the sake of being obvious, we\
