    method, which is sitting inside a check against the `ApplicativeInterface` to
    ensure the correct type is being passed in. As you can see, all the parameters
    for the `amap()` function are passed into the `Applicative` to be applied against
    the contained function. This means if you are passing in three parameters, then
    the function wrapped in `Applicative` should be able to handle three parameters.
    If you do not supply the correct number of arguments, then a PHP error will be
    triggered. Unfortunately, this is where our PHP emulation of applicative functionality
    is a little flaky.


    Let’s review the applicative laws and attempt to verify our implementations against
    them. I will only attempt to prove two of the laws here as the other two, seen
    below, are difficult and complex to emulate in PHP.


    ```

    pure (.) <*> u <*> v <*> w = u <*> (v <*> w)

    u <*> pure y = pure ($ y) <*> u

    ```


