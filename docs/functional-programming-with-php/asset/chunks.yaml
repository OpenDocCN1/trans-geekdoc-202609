    \nIf you are using version control (and you should be), then you will want to\
    \ remember to ignore/exclude `composer.phar`, and the `vendor` directory before\
    \ committing.\n\n## 4.2 The iter Library\n\nGenerators and iterators are very\
    \ handy features of PHP, but like most of the features we have studied there are\
    \ some rough edges. The userland `iter` library helps to make their usage simpler\
    \ and cleaner. The library can be installed as a dependency with composer much\
