    在处理纯 `PHP` 函数时，为了记录日志，向它们添加一些调试信息可能是很有用的。由于我们正处于纯函数内部，我们不能尝试设置状态或引起任何副作用，例如直接打印到屏幕。我们所有的函数都应该将输出作为返回值传递。你需要一种结构来为你的函数增加灵活性——这就是
    `Writer` 单元。


    `Writer` 单元允许你将内容输出到屏幕、磁盘、内存等，同时保持方法链和通用接口。为了演示这一实际操作，我们至少需要两个可以应用于 `Writer` 单元的简单函数。


    我们的第一个函数是一个简单的方法，用于从字符串中剔除非字母字符：


    ```

    php

    ```


    ```让我们将此函数应用到一个实际值上，以便我们看到它的运行效果：


