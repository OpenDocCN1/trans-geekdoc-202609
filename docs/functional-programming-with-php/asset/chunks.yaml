    1. `def` 等同于 PHP 的 `function` 关键字。

    2. `substr` 是我们为函数声明的名称。

    3. 接下来，函数参数在括号内被声明为用逗号分隔的列表。

    4. 第一个参数是 `string`，被声明类型为 `String`。在 Scala 中，类型紧跟在参数名后面并用冒号分隔——`string: String`。

    5. `start` 是我们给第二个函数参数的名称，它被声明为类型 `Int`（接受一个整数）。因此 `start: Int` 意味着我们期望一个 `Int`
    类型的参数传入函数。该参数在函数内部将通认为 `start`。

    6. 最后一个参数是 `length`，它的定义与 `start` 相同，请参阅第 5 步获取更详细的描述。

    7. 在括号之后，冒号后面紧接着写了另一个类型。在这种情况下，它是 `String`，因为该函数将返回一个字符串，就像它所模拟的原始 PHP 函数一样。


    函数定义的其余部分只是 `substr()` 内部工作机制的实现，在本书中无需进一步研究。


    同样，在 Haskell 中定义的相同函数也具有描述性，只是用略有不同的方言编写的：


    ```




    ```


    Haskell 的类型定义与 Scala 不同，最显著的区别是它们与函数定义的分离。第一行是预期的类型定义，第二行是实际实现。


    查看第一行，可以将其视为另一个列表来分析类型！


    1. 首先是函数名 `substr`。

    2. 接下来，两个连续的冒号表示这是一个类型定义，定义接下来将出现。

    3. 第一个参数的类型首先指定为 `String`。紧随其后的是 `->`，表示该参数的结束以及后面还有另一个参数。就像 Scala 或 PHP 中的逗号一样（好吧，大体如此，但我们在这里不讨论这一点）。

    4. 作为第二个参数，此函数将接受一个 `Int`（整数）。

    5. 第三个参数也是 `Int`。

    6. 最后的 `->` 表示接下来的类型定义将是函数的返回类型。与 Scala 示例一样，这是一个 `String`。


    同样，我们将直接跳过实际实现，因为它与本书无关。


    这两个定义非常简单，且它们各自的语言能够更具表达力。虽然深入研究它们的类型系统可能很有趣，但理解本书并不是必须的。我在描述这两个类型系统时特意放得比较宽泛，以便将它们简化为理解理解本书所需的知识。当然，这两者都有更多内容，但最好在
    Haskell 或 Scala 的书中进行探索。


    在本书中将使用 Haskell 语法来定义某些类型。这是因为算子（functors）、应用器（applicatives）和单数（monads）等概念是在 Haskell
    中定义的，并且在那里有完善的文档。这应该让你能够查看其他 Haskell Monad 实现的类型签名并在 PHP 中构建它们。


    如果你决定探索 Haskell 或 Scala，那么拥有《Hyperpolyglot》是值得的。


    ## 0.2 使用 UTF-8 省号


    在本书介绍过程中，引入了一个使用三个连续点作为函数的项目：React/Partial


    注意：React/Partial 使用下方的 Unicode 字符作为占位符。它不应与 PHP 自身的用于变变函数的 `...` 语法混淆。


    对于较小的用法，最简单的方法直接从 UTF-8 表中复制并粘贴该字符，例如 http://www.fileformat.info/info/char/2026/index.htm。


    如果你足够幸运地运行 MacOS 版本，则可以使用快捷键。通过同时按住 `Option` 键和分号，你可以在 QWERTY 键盘上获得该字符。对于使用 QWERT
    键盘的人，是 `Option` 和点/句号 (`.`)。在 Mac 上，`Option` 键也称为 `Alt`。


    在 Linux 上也有“快捷键”，但坦率说，一旦你见过它，我同意复制粘贴看起来更有吸引力。按住 `Ctrl` + `Shift` + `u` 进入 Unicode
    模式，然后输入 `2`、`0`、`6` 并回车。有人报告按 `Alt` 和点/句号可以在 Linux 中生成省号，但对我来说从未正常工作过。


    遗憾的是，Windows 也深受困扰，你必须按住 `Alt` 进入 Unicode 模式，然后在数字键盘上按下 `0`、`1`、`3` 然后松开 `Alt`
    键。如果你在没有数字键盘的笔记本电脑上，我不确定该怎么办！


    如果你想要一个简单的复制粘贴源，也可以制作像 http://www.functionalphp.com/utf8 这样的简单页面。省号字符在 HTML 中编码为
    `&hellip;` 或 `&#x2026;`。


    我倾向于使用 Vim 作为我的文本编辑器，虽然默认没有快捷键（为什么会有呢？），但它是高度可配置的。你可以使用 `imap` 指令在 Vim 中定义一个新键位映射。对于省号，我们可以定义一个
    `Ctrl` + `F5` 的简单快捷键——记住你需要从某处复制并粘贴 UTF-8 省号字符以插入到 `imap` 指令中。


    ```

    :imap <C-F5> …

    ```


    现在在编辑器的插入模式下，只需同时按住 `Control` 和 `F5` 键，省号就会插入到光标所在处。为了让此键绑定始终可用，你可以将其添加到 `.vimrc`
    中：


    ```

    imap <C-F5> …

    ```

