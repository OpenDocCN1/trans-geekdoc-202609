- raw: 'It was also around this time during World War Two Alan Turing was famously
    based at Bletchley Park where he worked to crack the Enigma code among a team
    of Britain’s greatest minds. The first break in the Enigma code was established
    with the so called Green Key in 1940, and later the Red key of the Luftwaffe was
    also established. A recent feature film, The Imitation Game, starring Benedict
    Cumberbatch as Turing details this period.


    It did not take the Nazis long to begin using a more sophisticated encryption
    in the form of new device called the Geheimschreiber (secret writer). Turing worked
    to break Tunny (the British code name for the secret writer) and devised a technique
    called Turingery in 1942. Implementing Turingery on a larger scale informed the
    design of the first programmable electronic computer by the team of Tommy Flowers
    and Max Newman.


    Known as the Colossus computer it was quite different to the device you are likely
    reading this book on right now. It used thermionic valves (mostly unused these
    days except in overpriced hifi equipment and professional guitar amplifiers) to
    perform Boolean operations as transistors might be used today. These controlled
    a series of relays and stepping motors making it a very active and physical machine—you
    certainly would have been able to hear it working!


    Modern machines are entirely different, with discreet and solid state electronics
    powering our computing today. In many machines today the only moving parts are
    cooling fans and perhaps the odd peripheral you’ve plugged in via USB. The replacement
    of hard drives with solid state drives and the disc drive ceding transportable
    data to memory sticks or cloud storage has left machines virtually silent.


    A functioning replica of the Colossus can be seen at The National Museum of Computing
    at Bletchley Park in England. The original and its blueprints were destroyed and
    the information remained classified until the 1970’s.


    So although Turing’s work undoubtedly helped it is a stretch to say he worked
    on the project directly. He was instead working on a secure telephone system which
    would encipher speech. Codenamed Delilah, it unfortunately lacked long distance
    capability and was not completed in time to be used during WWII. This lead Turing
    back to working in computing and he produced the first in depth paper on a stored-program
    computer, narrowly beating John Von Neumann’s draft which had been circulating
    towards publication. Many of the ideas contained in Von Neumann’s draft are said
    to be those of Turing in retrospect anyway.


    In addition, Turing was famously working on artificial intelligence problems.
    To him it was not a case of if a machine could be intelligent, but when. In order
    to determine when this milestone was reached Turing devised a simple test (well
    simple for a human, but not necessarily a machine) now known as The Turing Test.
    If a machine can communicate with a human audience in a manner indistinguishable
    from a person, then it could be considered intelligent. Although it sounds simple
    to us, it is worth noting speech and elaborate communication are unique to human
    beings on earth. Even primates that have been taught sign language have never
    asked their handlers a solitary question, perhaps due to limits in their cognition
    or simply due to the fact language is extremely hard to master.


    There have been recent claims the Turing test has been met by a computer program.
    Much like a car manufacturers fuel economy claims, actual real world usage does
    not yield the same results as those noted in the laboratory. The test was completed
    under a set of conditions which sought to game the test.


    Unfortunately, Turing’s great mind and contributions to the war effort would not
    protect him from persecution. In 1950’s England it was illegal to engage in homosexual
    acts and after mentioning to the police that a burglary at his home might have
    been committed by an associate of his boyfriend, he was swiftly arrested. He was
    found guilty when the case came to court and sentenced to prison or a commuted
    sentence on condition of having chemical castration. Turing opted for the medical
    intervention while his boyfriend received a seven month suspended sentence, perhaps
    due his being younger than Turing.


    Although his family disputes it, in 1954 Turing is believed to have committed
    suicide by poisoning his daily apple with cyanide. Some have pointed out a gold
    electro-plating experiment he had setup could have produced a lethal amount of
    cyanide. An alternative explanation could be he set it up so as to protect his
    mother and give her plausible deniability of her son’s suicide. Turing’s legacy
    is well-known in the computing world and has recently been promoted to a larger
    audience with the release of the feature film, *The Imitation Game*. Before this
    there was a wide scale campaign in 2009 to obtain an official apology from the
    British government for the way Turing was treated. In 2013 he was granted a posthumous
    pardon.


    The next major advance of functional computing came in 1958 with John McCarthy’s
    LISP programming language based upon Alonzo Church’s lambda calculus. The language’s
    name is a play on the term list processing, which makes sense given the language’s
    reliance on lists.


    Interestingly, LISP would go onto be the de facto standard in the artificial intelligence
    community. McCarthy used Alonzo Church’s ideas to work upon artificial intelligence
    ideas Turing must have pondered prior to his death.


    Many languages and computer science, in general, have a lot to thank LISP for.
    It brought new ideas to light in the form of dynamic typing, data tree structures,
    conditionals, recursion and higher order functions. Other languages may have included
    approximately similar functions, but never in such a cohesive fashion.


    LISP is instantly recognizable from its S-expressions which look like lists. They
    are written as a list with the function name first and the arguments following
    separated by spaces. Over the years there have been many LISP variants released
    with Common Lisp, Scheme, and Clojure being the most well-known today.


    If you’re interested in playing with writing your own programming language then
    one place to start is with a LISP of your own. A number of resources are available
    on the web to create LISP interpreters with C, Python and C++. In the PHP world
    limited work has been completed with projects like Mathias Verraes’ Lambdalicious,
    Igor Wiedler’s Lisphp, and Tamreen Kahn’s Pharen cross compiler written in PHP.


    As time progressed there was little movement in the functional space. The existing
    languages were still mostly confined to the academic arena with a relatively small
    user base. As mentioned previously, the artificial intelligence community did
    work in a functional style with LISP.


    Outside of this you need to skip forward in time until the telecommunications
    industry began looking for a fault tolerant system. After all, they couldn’t have
    customer’s calls, pages, and messages dropping out or going undelivered. The Ericsson
    telephone company spearheaded early developments in the functional space for the
    telecommunications sector. In their labs they worked on a language which would
    ease the problems their industry faced, with uptime and reliability being the
    most important.


    Out of these investigations in the mid-eighties the Erlang programming language
    was born. Based on Prolog and to begin with implemented in the language it would
    go on to power all of Ericsson’s infrastructure. Later, though, as Erlang was
    a proprietary language Ericsson decided to cease using their own language in the
    late 1990’s! Following the departure of key members of their language team in
    1998 (no doubt in protest) Ericsson open sourced the Erlang language and made
    it possible for it to be used internally again.'
