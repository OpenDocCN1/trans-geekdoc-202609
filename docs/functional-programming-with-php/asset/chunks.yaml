    ## 0.2 Using the UTF-8 Ellipsis


    During the course of the book a project using three consecutive dots as a function
    is introduced, React/Partial


    CAUTION React/Partial uses the Unicode character below as a placeholder. It should
    not be confused with PHP’s own `...` syntax for variadic functions.


    For smaller usages, the easiest method is to simply copy and paste the character
    from a UTF-8 table such as http://www.fileformat.info/info/char/2026/index.htm.


    If you are lucky enough to be running a version of MacOS then you can simply use
    a shortcut. By holding down the `Option` key and the semicolon together you get
    the character on a QWERTY keyboard. For those on QWERT keyboard it is `Option`
    and the period/full stop (`.`). On a Mac the `Option` key is also known as `Alt`.


    On Linux there is also a “shortcut”, but frankly once you have seen it I will
    agree copy and paste looks appealing. Hold down `Ctrl` + `Shift` + `u` to enter
    Unicode mode and then `2`, `0`, `6` and `Enter`. Some people report `Alt` and
    dot/full stop will get ellipsis out of Linux, but it has never worked properly
    for me.


    Unfortunately, Windows is similarly afflicted you must press and hold `Alt` to
    enter Unicode mode and then press `0`, `1`, `3` on the number pad releasing the
    `Alt` key. If you are on a laptop without a number pad I’m not sure what’re supposed
    to do!


    If you want an easy copy and paste source you can also make a simple page like
    http://www.functionalphp.com/utf8. The ellipsis character is encoded in HTML as
    either `&hellip;` and `&#x2026;` in HTML.


    I tend to use Vim as my text editor and although there is no shortcut by default
    (why would there?) it is highly configurable. You can use the `imap` directive
    to define a new keymap for use within Vim. In the case of ellipsis we can define
    a simple shortcut for `Ctrl` + `F5` – remember you will need to copy and paste
    the UTF-8 ellipsis character from somewhere to insert into the `imap` directive.


    ```

    :imap <C-F5> …

    ```


    Now in insert mode within the editor, you can simply hold down the `Control` and
    `F5` keys at the same time and an ellipsis will be inserted at the point of your
    cursor. To make this keybinding always available you can add it to `.vimrc` with
    a line:


    ```

    imap <C-F5> …

    ```


    For IDE I am mostly using Netbeans (with Vim keybindings) and much like Vim before
    there is no default way of inserting the ellipsis character. You can create a
    simple macro in the options dialogue that will insert an ellipsis when a keyboard
    shortcut is pressed.


    You too can enjoy this revelation in four simple steps:


    1. Tools > Options > Editor > Macros.

    2. Click New and give it a name (“ellipsis” perhaps).

    3. Enter the following (include the quotes!) into the Macro box: `"…"`.

    4. Click Set Shortcut and choose the keystroke you want (I chose `Control` + `Alt`
    + `.`).


    Now, by pressing the `Control` + `Alt` + `.` keys together a UTF-8 ellipsis character
    will be inserted into the document at the cursor position.


    So the ellipsis is one character and not three dots/periods/full stops in succession.
    While it may not be simple to use by default there are a few simple techniques
    to make this easier. While Vim and Net are detailed here I am sure Eclipse, PhpStorm,
    and Emacs have similar capabilities.


    ***


    1. [Hyperpolyglot](http://hyperpolyglot.org)

    2. [React/Partial](https://github.com/reactphp/partial)

    3. [Variadic Functions](http://php.net/functions.arguments#functions.variable-arg-list)


    # 12 Appendix B: Resources


    > “Programmers are the worst people to discuss programming with.”


    > —Brian McKenna (Functional programmer, @puffnfresh)


    For functional PHP extras and updates, please check out http://www.functionalphp.com
    and follow @FunctionalPHP on Twitter.


    ## 12.1 PHP REPLs


    ### Command line


    * phpsh—http://phpsh.org

    * PsySH—http://psysh.org

    * Boris—https://github.com/d11wtq/boris


    ### Online


    * 3v4l—http://3v4l.org

