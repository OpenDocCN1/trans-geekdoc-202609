  trans: '


    - 一种运行在 Java 虚拟机上并支持函数式和面向对象编程的编程语言。

    - `scalar`：基础类型类别，包含单个值，如 `int` 和 `string`。

    - `ternary operator`（三元运算符）：一种短格式条件语句，允许根据真或假响应进行操作。

    - `type`（类型）：值所属的类别。例如，`10` 就是整数类型。

    - `type definition`（类型定义）：代码中对值的类型（int、string 等）的规范。

    - `type hinting`（类型提示）：在传递变量的地方指定类型规范。

    - `use`：调用以包含特定的命名空间、包含一个 PHP trait，或者表示闭包在定义时想要从父级作用域引入变量。

    - `UTF-8`：一种 Unicode/多字节字符标准/表。

    - `UTF-8 ellipsis`（UTF-8 省号）：`…`

    - `vim`：适用于命令行界面或终端的文本编辑器。通常在大多数 Linux 发行版中可用，Windows 同样可用！

    - `weak typing`（弱类型）：类型是瞬时的，编译器/解析器并不关心，并可以在运行时根据推断的含义在类型之间转换。

    - `Windows`：微软操作系统。如果你正在使用它并遵循此书，请安装 Vagrant 虚拟机中运行 Ubuntu，以免受痛苦。

    - `xdebug`：PHP 领域用于交互式调试和代码性能分析的首选扩展。


