  trans: '


    弗格的《基本律五》描述了一种集合逻辑，使得成员关系的定义变得简单。遗憾的是对弗格来说，这让伯特兰·罗塞尔发现了一个不一致之处。这便是广为人知的“罗塞尔悖论”，它描述了一个自指集合：“所有满足
    $x$ 不是 $x$ 成员的 $x$ 组成的集合”。这个绕口令会产生一个既不是自身成员、又是自身成员的集合。这一发现让弗格陷入了困境，使他在处理这个问题时只能用弱的论据和权宜之计反复挣扎。


    尽管如此，逻辑学家们继续致力于建立一个描述整个世界的系统。在哲学领域，这导致了具有巨大影响的维也纳学派的形成。聚集在一起的成员讨论了将陈述大致分为两类：一类是无法观察的陈述，另一类是能够观察的陈述。任何形而上学的内容都是无意义的并作为逻辑错误被拒绝，或者被还原为可以通过科学调查证明的经验性陈述。形而上学陈述的一个例子是“一切艺术毫无意义”——它既无法被证明为真，也无法被证明为假。


    在此期间，他们雇了一名学生来监督讨论，中断导致形而上学论述的对话。起初他们会大喊“Metaphysik”，但正如鲁道夫·卡纳普后来提到的，他们迅速将其缩短为单字母“M”。随着讨论的深入，“他一直在大喊‘M’，以至于我们听厌了，所以每当我们说一些合法的话时，就把它改成‘no-M’。”换句话说，大多数讨论都会变成形而上学讨论。这让卡纳普意识到，可以存在许多逻辑，而不仅仅是一种通用的逻辑。


    ### 希尔伯特与哥德尔


    大约同一，一位名叫大卫·希尔伯特的德国德国数学家在数学领域正朝着类似的目标努力。在 20 世纪 20 年代后期，他热衷于解决 `Entscheidungs
    Problem`（判定问题），试图证明一切都可以用数学逻辑来描述。希尔伯特确定万物都可以被还原为真或假。


    相当著名的是，1930 年，维也纳学派的一位学生库尔特·哥德尔发表了他的完备定理，这有助于增强希尔伯特的假设。然而，这种局面是短暂的，因为就在第二天，哥德尔也讨论了他的第一个不完备定理，这动摇了希尔伯特断言的根基。现在全世界公认，希尔伯特派是错误的，且存在一些逻辑无法解决或描述的问题。


    那么，哥德尔是如何打乱计划的呢？*这个陈述是不可证明的。*很简单！


    如果这个陈述可以被证明，那么它就是假的；但它声称自己不可证明，所以它必须是真实的。这个陈述无法被判定，因为它同时是真也是假的。你可能以前听过类似的陈述，被称为“谎言者悖论”。它比哥德尔早至少
    2000 年，有些来源认为其根源可以追溯到公元前 600 年至公元前 400 年。“一个人说他在撒谎。他说的话是真的的还是假的？”随着时间的推移，这被提炼为“这句话是假的”，并且与哥德尔不完备定理的基础极其相似。尽管如此，这只是外外外行的简化，因为哥德尔证明了这在所有逻辑中都是一个悖论。


    ### 计算的诞生：丘奇、图灵及其他人


    他通过自己设计的逻辑表达式系统，在两个定理中证明了这一点。对于现代人来说，这似乎可能是最简单的悖论，但在当时，哥德尔处于逻辑的最前沿。为了进一步证明 `Entschiedungs
    Problem` 的不可判定性，必须定义“有效计算”。这导致了多个系统同时被设计出来。


    1932 年，阿隆佐·丘奇以 `lambda calculus` 的形式提出了第一个系统。他看到了自己新定义中的潜力并写道：


    > “该系统除了作为逻辑使用外，确实可能有其他应用。”


    鉴于 `lambda calculus` 未来将成为函数式编程的基础，完全可以说他是正确的。通过将 `lambda calculus` 作为基础，丘奇能够提出没有有效计算答案的问题。再次，这种简单性令人惊叹：给定一个
    `lambda expression`，判断它是否会无限循环。这是做不到的！


    哥德尔在同一时期也在研究关于递归函数的他自己的逻辑系统。虽然它看起来和哥德尔的形式化不同，但递归是函数式编程的核心组件。


    此时，艾兰·图灵也接触到了哥德尔的不可判定问题，并且像哥德尔一样，得出了结论：要研究 `Entschidungs Problem`，必须定义一个有效计算系统。他发明了
    `Turing Machine`，它可以计算所有自然认为可计算的数字。我的意思是人类可以用纸笔计算的数字。


    这使得图灵和阿隆佐·丘奇证明了 `lambda expressions` 和 `Turing Machines` 在功能上是等价的。图灵与丘奇合作创建了第一个程序
    `compute lambda expressions`。他们在 1937 年共同发表了一篇名为 `Church-Turing Thesis` 的论文，证明了两种技术是等价且同样合理的。图灵甚至说：“丘奇的演算……允许[图灵]生成可计算函数的机器被更方便的
    λ-定义所取代。”基于此我们可以大胆地说，图灵更喜欢函数式编程！你可能会说这是自取的推测，但他确实对那些形式产生了喜爱。


    20 世纪 40 年代，阿隆佐·丘奇致力于一篇描述 `typed lambda calculus` 及其形式证明的论文。与此同时，图灵独立地进行类似的证明，尽管未发表，但它很好地说明了他也看到了这些技术的价值。


    ### 四种计算技术


    有趣的是，世界收到了不少于四种描述有效计算的技术：阿隆佐·丘奇的 `lambda calculus`、艾兰·图灵的 `Turing machine`、库尔特·哥德尔的
    `recursive functions`，以及此前未讨论过的哈斯尔·柯里的提出的 `combinatory logic`。这并非巧合，仅仅是因为条件成熟使得这一系列形式化方法得以产生。


    准备性工作已经完成，逻辑世界已准备好接受新的思想和发现。这解释了为什么这些发现在时间上是如此接近，即使他们并不知道其他人也在研究相同的想法。


    回到哈斯尔的组合逻辑，以及它的函数组合形式化方法。原始函数通过组合来创建更强大的结构；这一原则在函数式编程中随处可见。它发表于 1927 年，比图灵等人的形式要早多年。


    有一种争论认为，第一个创建证明的可能是一个名叫摩西·舍芬费尔的俄罗斯人。这影响了函数式编程技术“柯里”（currying）的命名，有些人建议将其改为“舍芬费尔化”以承认他的早期发现。遗憾的是，舍芬费尔的故事是一个悲剧。除了这篇论文外，关于他的工作为人知的极少。他是希尔伯特小组的成员，在他们的帮助下，他成功地在
    1924 年发表了这篇论文。几年后，他从哥廷回到俄罗斯，1927 年的消息显示他有精神疾病并关在精神病院。具体时间不详，但他在 1942 年某时贫困中去世。


    他所有的论文都被邻居为了取暖烧掉了，因此人们永远无法知道他在研究什么。


    '
