  trans: '

    这允许代码针对子网而不仅仅是完整的 IP 地址进行使用。在简单的办公内网案例中，我们可以允许整个办公室进入，但对他们的家庭地址采用更明确的规定。毕竟，我们不希望任何使用相同互联网服务提供商的陌生人混进来！


    为此，我们将在白列表中添加几个部分 IP 地址：


    ```

    ```


    ```


    ```


    `array_filter` 也必须进行更改，以允许它处理将这些新的部分 IP 地址与用户的 IP 地址进行匹配。


    ```

    ```

    ```


    为了处理部分 IP 地址，该函数获取当前用户 IP 地址的一个子字符串（长度与白列表值相同），并将其与白列表值进行比较。这是一个很小的复杂之处，但很容易添加。


    所以，你已经学会了，这是一个用三行代码实现的简单 IP v4 白名单检查脚本！好吧，你可能不想将其放入生产环境，但它确实提供了一个很好的、简单且自包含的示例，尽管带有副作用（`die()`）。


    ## 7.2 功能原语


    ### 设置


    让我们运行几个示例，看看这些功能如何潜在结合，以辅助车辆维修业务的报告。请参阅下方的代码样本，这是所有操作将要处理的基础数据集。


    **列表 7.1**


    ```

    ```

    ```


    初始设置足够简单，让我们直接从 Composer 引入供应商自动加载器和 `functional-php` 命名空间：


    ```

    ```

    ```


    还需要完成另一项细小的清理工作，以便我们能为程序提供一个更具函数风格的 `uasort()`。遗憾的是，PHP 会就地编辑数组并且不返回排序后的数组，而是返回一个布尔值。这显然违反了我们确保函数式程序中所有数据都是不可变的契约，因此这个包装函数在某种程度上纠正了这个问题。


    ```

    ```

    ```


    ### 排序与提取 (Sort and Pluck)


    让第一个示例保持简单，从记录中提取出里程最高的车辆。在阅读像这样的嵌套函数调用时，一个实用的提示是从内向外阅读是最好的。


    ```

    ```

    ```


    首先，调用 `F\pluck()` 返回一个包含来自服务日志的里程元素的数组。此时，程序操作的值变成了：


    ```

    ```

    ```


    此项功能在 PHP 5.5 中以 `array_column()` 的名称可用，参见相关的 RFC。


    然而，让我们回到我们的里程表读取示例。下一个操作服务日志的是使用我们之前定义的自定义 `functional_sort()` 排序算法。最后，`F\first()`
    从栈中获取顶部的记录，并将值 `91234` 赋值给变量 `$highest_odometer_reading`。


    ### 归约 (Reduction)


    另一种数据处理方式使得计算修理厂对已执行的服务工作所总利润成为可能。再次查看本章中的第一个代码示例，了解算法闭包中使用的 `$charge_per_hour`
    和 `$overhead_per_hour` 变量的来源。


    ```

    ```

    ```


    代码简单地使用 `reduce` 遍历每个服务记录，计算每项工作的利润并将其累加到累加变量 `$result` 中。当值最终赋值给 `$profit` 时，它是一个为
    `6825.38` 的单个浮点数。你可能已经注意到此函数没有考虑业务的零件成本（在示例中，`parts_cost` 是客户的成本）——这只是简化示例代码。


    `F\reduce_left()` 函数在功能上等同于 PHP 原生的 `array_reduce()`，但像 `functional-php` 的其他部分一样，它可以操作实现
    `Traversable` 的对象。该还提供了 `F\reduce_right()`，区别在于它从集合的最后一个元素开始归约，而 `F\reduce_left()`
    从集合的第一个元素开始。


    通过将利润计算代码提取到可以重用的独立闭包中，对程序进行一些改进。


    ```

    ```

    ```


    现在我们还可以通过 `functional-php` 中的三个函数来收紧集合处理功能。


    ```

    ```

    ```


    从内层函数开始并向外处理，使用 `F\pluck()` 从每个服务日志记录中提取 `hours` 和 `parts_cost` 元素。然后采用 `F\zip()`
    使用 `$calculate_profit` 闭包作为组合操作来合并这两个数组，并返回一个包含每个服务日志记录利润小计的数组。这些小计随后汇总成一个最终的利润总额，然后通过
    `F\sum()` 作为浮点数返回并赋值给 `$profit2`。


    ### 使用部分进行过滤 (Filtering with Partials)


    客户通常希望获取其车辆或最近购买的车辆的完整服务历史列表。通过一些过滤结合排序算法，可以根据特定的车辆车牌号返回按里程读数排序的服务日志数组。


    ```

    ```

    ```


    最初，服务日志通过 `F\filter()` 配合回调闭包函数过滤为仅匹配传入的车辆注册号的记录。得到的数组将根据每个服务记录的里程读数进行升序排序。


    为了方便使用此函数，我们可以使用 React/Partial 函数应用库将 `$service_logs` 变量绑定到函数上。


    ```

    ```

    ```


    然后就可以通过 `$get_by_rego()` 轻松地获取特定车牌号的记录了。


    ```

    ```

    ```


    也可以使用 `functional-php` 的 `F\group()` 函数来实现，首先根据车辆注册号对所有记录进行分组，而不是使用 `F\filter()`，但在内存使用方面的效率会较低，因为数组会大得多。


    通过这些极为刻意的示例，你可以看到功能原语和高阶函数结合以实现业务目标的一些某些方法。它们还强调了保持函数简单并限制于只解决一个问题的优势，从而有利于它们最终的结合使用和重用。


    ## 7.3 PHP 中的领域特定语言


    考虑到 PHP 语言相对不灵活的本质，这似乎是一个不太可能的应用。例如，你不能定义自己的关键字，也没有中缀运算符。在此基础上，还没有好用的组合器（combinators）！


    不过，可以用 PHP 函数表达简单的语言，正如这个实现 HTML 的示例所展示的。选择 HTML 作为 DSL（领域特定语言）是因为这些规则对所有 PHP
    开发者都是熟悉的。为了保持简单的主题，此示例将仅实现 HTML 的一小部分集。它将足够演示概念并让你看到如何将函数映射到不同的 HTML 要求。


    为了让变得方便，你会注意到此示例代码在适当的地方使用了对象。这些对象几乎是以近函数式的风格实现的，没有全局状态更改，并且并没有真正被视为面向对象意义上的类。也就是说，这些对象仅作为类型集合被消费。这允许我们的代码对传递的内容做出假设，而不是像传递数组时那样。这是一种模拟非常基础类型系统的方法，这是许多函数式编程语言的特征。


    函数式编程并不是面向对象代码的宿敌，但它确实提供了一个极吸引力的替代方案。编写良好的面向对象代码看起来几乎是函数的，因为它们共享一些基本概念。保持专注、可重用并具有易于实现的接口。


    现在进入示例本身，HTML 是我们希望转换为 PHP 语言的领域。

    '
