  trans: "\n\n| `Pair` | | 存储两个值的索引集合 |\n\n这些类型处理了我们处理列表的常见方式，但它们减轻了我们像在 PHP 中那样手动实现集合的负担。要创建一个新集合，你可以定义如下内容：\n\
    \n```\n$vector = Vector {1, 2};\n$vector->add(3);\n// Vector(1, 2, 3)\n```\n\n\
    为了兼容性，你仍然可以像在 PHP 中一样使用数组，但你也可以使其更具体。数组的类型可以根据其值和其键/索引来定义。\n\n键和值的定义非常简单：\n\n\
    ```\narray<int, string>\n```\n\n其中数组具有整数键，且值为字符串。如果你只想指定值的类型而不是键类型，请使用：\n\n```\n\
    array<string>\n```\n\n这允许解析器对数组进行类型检查，并防止列表变成各种值的“大杂烩”。当你对列表进行操作时，你希望能够以尽尽的难度以相同的方式处理所有值。通过这样指定类型签名，你可以确保始终能获得一个字符串（或你指定的类型）。\n\
    \n```\nclass HackArray {\n   public array<int, string> $array = [\n      1 =>\
    \ 'ibizo',\n      2 => 'umuntu',\n      3 => 'inja',\n   ];\n}\n```\n\n如果你希望有一个不可变数组，Hack\
    \ 通过使用 `tuple` 实现了这一点，其定义方式如下：\n\n```\n$t = tuple(1, 2, 3);\n$sum = array_sum($t);\
    \ // 6\n```\n\n作为一种不可变类型，一旦定义了 `tuple` 就无法更改，尝试更改将导致错误。\n\n这些数组作为简单的集合或更自定义的针对应用程序集合类的基础。如果你需要像\
    \ `Set` 这样的集合，那么使用 Hack 提供的 `Set` 集合比自己编写更好。原因出于两点，主要是为了效率；它对任何 Hack 程序员来说都是易于识别的结构，而且作为语言的一部分，它默认经过优化。\n\
    \n除了集合和数组外，Hack 还定义了其他有用类型，如 `Enum`、`Generic` 和 `Shape`。在 `Enum` 的情况下，你可以定义一个枚举类型，允许将定义中指定的值赋值给任何变量。这在列表\
    \ 5.1 所示的博客文章发布状态中得到了演示。\n\n**列表 5.1**\n\n```\nenum BlogPostState: int {\n   Published\
    \ = 1;\n   Queued = 0;\n   Draft = -1;\n}\n\nclass BlogPost {\n   public BlogPostState\
    \ $state = BlogPostState::Published;\n   public function getState(): BlogPostState\
    \ {\n      return $this->state;\n   }\n}\n```\n\n`Enum` 类型有许多用途，当布尔值不再足够时，它为你提供了一个非常简单的存储机制。\n\
    \n稍微不那么令人的是为函数参数添加了 `nullable` 类型提示，形式是在参数名前面加一个问号（`?`）。这允许你在定义函数时指示哪些参数可以接受 `null`\
    \ 值。通常，它在函数式代码中不会出现，因为它允许 `null` 的存在。\n\n```\nfunction example(?string $param)\
    \ {\n    return $param;\n}\n```\n\n"
