    \ Return Type Declarations\n\nAlso in PHP 7 another RFC was merged called return\
    \ type declarations, which compliments the scalar type hints RFC excellently.\
    \ It allows you to declare the type that should be returned from a function. The\
    \ parser does not require a type to be defined on a function return value, but\
    \ much like the strict declaration in scalar type hints I would suggest it is\
    \ good practice to do so.\n\nTo specify a return type you simply add a colon after\
    \ the closing parenthesis of the function and then include the expected type keyword\
    \ such as `int` or `array`.\n\nYou can also declare classes or interfaces you\
    \ have written yourself as return types much like you can with function arguments.\n\
    \n```\n\n```\n\n```\n\nIt is not currently possible to have multiple return types\
    \ for a function. This means you cannot say, return an `int` on success or `null`\
    \ on failure for example—it must be one or the other. Again, much like with the\
    \ scalar type hints if there is a type mismatch then an `E_RECOVERABLE_ERROR`\
    \ will be triggered.\n\nThis brings more powerful type checking to PHP along with\
    \ a reduction in bugs. It also makes the code easier to reason about and assemble\
    \ in your mind when you come back to it. Finally, IDE’s and other tools can be\
    \ smarter when inspecting the code you write.\n\nWhere possible, ensure you declare\
    \ strict mode for type hints and make sure you include a return type declaration.\
    \ This will help to make sure you enjoy the benefits of these PHP 7 features.\
    \ There are some limitations too, but if you are writing good code then you shouldn’t\
    \ run into them. Use it for its strengths and you will be a happier developer\
    \ than yesterday.\n\nIn Listing 10.1 I have included a few examples of how this\
    \ can be used to great effect.\n\n**Listing 10.1**\n\n```\n\n```\n\n```\n\nSome\
    \ of the silly errors caught by the parser in Listing 10.1 are easy to miss and\
    \ cause programs to malfunction unexpectedly. Enabling type hinting and adding\
    \ return type declarations can help to ensure this does not happen.\n\nAs mentioned\
    \ previously there are a host of other improvements to the language and the Zend\
    \ runtime itself. These include new features and, frankly, amazing performance\
    \ enhancements. There are so many reasons to upgrade; hopefully it will be deployed\
    \ to PAAS and hosts around the world quickly as this is, of course, the best release\
    \ yet.\n\n### Namespace Group Syntax\n\nWith PHP 7 the namespace syntax has been\
    \ expanded to include group `use` statements that greatly reduce the amount of\
    \ typing required. It comes into play when you want to specify multiple namespaces\
    \ you want to use from the same parent namespace.\n\nTo make this simpler let\
    \ us assume we have a namespace `\\Treffynnon\\FunctionalPhp` and underneath that\
    \ the following classes:\n\n1. `Html`\n2. `Date`\n3. `Blog`\n4. `ShoppingList`\n\
    \nRendering a blog post requires the first, second, and third classes, but not\
    \ the last. We would use group statements to pull in just those items we want:\n\
    \n```\n\n```\n\n```\n\nWhile this feature will inevitably have limited use it\
    \ is handy to know of and could save you some effort when dealing with PHP’s clumsy\
    \ namespace syntax.\n\n### Closure Calls\n\nIn PHP 7 closure behavior in the language\
    \ has been augmented with bind at call time execution. As mentioned earlier PHP\
    \ 5 has the `bind` and `bindTo` methods, but they must be called before execution.\
    \ This can create unnecessary lines of code the new `call` method dispenses with\
    \ in favor of binding the closure to the class at call time.\n\n```\n\n```\n\n\
    ```\n\nThe previous example provides a neater and simpler method of calling closures\
    \ in a bound state.\n\n## 10.5 Further into the Future\n\nWhile it is difficult\
    \ to tell what will be accepted into future versions of PHP beyond that of the\
    \ RFCs which have completed votes against them, there has been some discussion\
    \ on the PHP internals list\n\nNikita Popov has provided a patch\n\n```\n\n```\n\
    \n```\n\nIt would also be possible to filter records to return only records which\
    \ have the registration number of `DG44-001`:\n\n```\n\n```\n\n```\n\nThe final\
    \ advantage is the ability of the system to work on nested `foreach` statements\
    \ like so (example taken directly from Nikita’s introductory email) reproduced\
    \ in Listing 10.2.\n\n**Listing 10.2**\n\n```\n\n```\n\n```\n\nAs you can see,\
    \ this is a powerful feature that would make operating on arrays in PHP far easier,\
    \ and given their succinct nature coupled with a stateless operation, they would\
    \ make a good addition to the functional programming toolkit.\n\nAs PHP moves\
    \ into the future, it looks like the new versions will add more features and functions\
    \ which should help to make functional programming a solid reality in PHP.\n\n\
    ***\n\n1. [Callable Type](http://php.net/language.types.callable)[↩](#ch013.xhtml#fnref1)\n\
    2. [class member access using `__invoke()` in php5.4](https://bugs.php.net/bug.php?id=63253)[↩](#ch013.xhtml#fnref2)\n\
    3. [Variadics RFC](https://wiki.php.net/rfc/variadic)[↩](#ch013.xhtml#fnref3)\n\
    4. [\\[PHP-DEV\\] List comprehensions and generator expressions for PHP](http://markmail.org/thread/uvendztpe2rrwiif)[↩](#ch013.xhtml#fnref4)\n\
    5. [addListComprehensions Branch](https://github.com/nikic/php-src/tree/addListComprehensions)[↩](#ch013.xhtml#fnref5)\n\
    \n# 11 Conclusion\n\n> “Functional programming is ‘just another tool’ in the sense\
    \ that being honest is a technique in addition to just making things up.”\n\n\
    > \n\n> —Rúnar Bjarnason (Functional programmer, @runarorama)\n"
  trans: "\n\n从 PHP 7 开始，一项新的 RFC 被并入语言核心，用以提供标量类型提示（scalar type hinting）。这是该语言向正确方向迈出的大一步，因此当它在\
    \ RFC 投票过程中幸存并克服了巨大的反对意见时，这是一个极好的消息。PHP 开发者们已经期待这样的功能多年了，尽管之前尝试过，但它从未进入过该语言。\n\
    \n这一新功能集涵盖了 `int`、`float`、`string` 和 `bool` 类型，允许它们像我们已经看到过的类、接口、`array` 和 `callable`\
    \ 一样被使用。一个实现了一半的语言核心特性终于朝着完成方向迈进。\n\n除了这些类型提示外，你还可以指定想要开启严格类型检查（strict type checking）。如果激活，当将错误的类型作为参数传递给函数时，解析器将抛出\
    \ `E_RECOVERABLE_ERROR`。正如你预期的，我建议你始终在开启严格类型的情况下开发，以帮助你创建更健壮的代码。只需在文件顶部包含以下内容即可激活：\n\
    \n```\n\n```\n\n```\n\n该文件中所有的函数调用现在都将以严格的方式处理。\n\n默认情况下，所有 PHP 文件都以弱类型检查模式解析，因此你必须在每个文件顶部声明此项。也许在\
    \ IDE 中创建一个创建新文件时的宏来自动添加此声明，可以防止你忘记添加这个至关重要的元素。\n\n有了声明后，PHP 解析器将通过对类型不匹配和违规行为发出警告来帮助你维护代码。这与\
    \ PHP 传统的尽可能将所有值自动合并为正确类型的做法背道而驰。虽然这种做法采取了“不计代价运行”的方法，但它意味着编写得糟糕的代码仍然运行，导致简单的错误无法被检测到。\n\
    \n声明函数时可以对其参数使用类型提示，导致 PHP 解析器检查传递给函数的值类型。在严格模式下，如果类型不匹配，将抛出错误。在更宽松的模式下，PHP 引擎会将参数强制转换为所需的类型。在\
    \ PHP 之前的版本中，你必须使用 `gettype` 或类似的方法手动完成此操作。\n\n```\n\n```\n\n```\n\n调用函数时，不小心反转参数顺序轻而易举，因此这种简单的解析器错误检查有助于发现这类问题。显然，如果两个参数都是相同类型，那么这对你将没有帮助！不过，你可以看到这种检查可以帮助你避免这类错误。\n\
    \n### 返回类型声明 (Return Type Declarations)\n\nPHP 7 中还合并了另一项 RFC，称为返回类型声明（return\
    \ type declarations），它与标量类型提示 RFC 完美互补。它允许你声明函数应该返回的类型。解析器并不要求在函数返回值上定义类型，但与标量类型提示中的严格声明一样，我建议这样做是一个良好的习惯。\n\
    \n要指定返回类型，你只需在函数的右括号后添加一个冒号，然后包含预期的类型关键字，例如 `int` 或 `array`。\n\n你也可以像函数参数一样，将你自己编写的类或接口声明为返回类型。\n\
    \n```\n\n```\n\n```\n\n目前一个函数还没有多个返回类型。这意味着你不能说，例如成功时返回 `int` 或失败时返回 `null`——它必须二选一。再次，就像标量类型提示一样，如果发生类型不匹配，将触发\
    \ `E_RECOVERABLE_ERROR`。\n\n这为 PHP 带来了更强大的类型检查，并减少了错误。它也让代码在你回来看时更容易在脑海中进行推理和组装。最后，IDE\
    \ 和其他工具在检查你编写的代码时可以变得更智能。\n\n在可能的情况下，确保为类型提示声明严格模式，并确保你包含了返回类型声明。这将有助于确保你享受到这些\
    \ PHP 7 特性的处。虽然也有一些局限性，但如果你编写良好的代码，就不会遇到它们。利用它的优点，你将比昨天更快乐的开发者。\n\n在列表 10.1 中，我包含了一些如何极佳使用这些特性的示例。\n\
    \n**列表 10.1**\n\n```\n\n```\n\n```\n\n列表 10.1 中解析器捕获的一些愚错误很容易忽略并导致程序意外故障。启用类型提示并添加返回类型声明可以帮助这种情况不再发生。\n\
    \n如之前所述，语言以及 Zend 运行时本身还有许多其他改进。这些包括新功能，坦率地说，还有惊人的性能增强。升级的理由有很多；希望它能尽快部署到全球的 PAAS\
    \ 和主机，因为这无疑是迄为止最好的版本。\n\n### 命名空间组语法 (Namespace Group Syntax)\n\n通过 PHP 7，命名空间语法得到了扩展，包含了组\
    \ `use` 语句，这极大地减少了所需的字符输入。当你想要从同一个父命名空间指定多个要使用的命名空间时，它就会发挥作用。\n\n为了使其更简单，假设我们有一个命名空间\
    \ `\\Treffynnon\\FunctionalPhp`，其下有以下类：\n\n1. `Html`\n2. `Date`\n3. `Blog`\n4.\
    \ `ShoppingList`\n\n渲染博客文章需要第一、第二和第三个类，但不需要最后一个。我们将使用组语句来只拉取我们需要的项：\n\n```\n\n\
    ```\n\n```\n\n虽然这个功能的使用不可避免地有限，但知道它是很有用的，在处理 PHP 笨拙的命名空间语法时，它可以为你节省一些精力。\n\n###\
    \ 闭包调用 (Closure Calls)\n\n在 PHP 7 中，语言中的闭包行为通过调用执行时的绑定（bind）得到了增强。正如之前提到的，PHP\
    \ 5 拥有 `bind` 和 `bindTo` 方法，但它们必须在执行之前调用。这会产生不必要的代码行，而新的 `call` 方法放弃了这一点，转而采用调用时将闭包绑定到类。\n\
    \n```\n\n```\n\n```\n\n之前的示例为在绑定状态下调用闭包提供了更整洁、更简单的方法。\n\n## 10.5 走向未来\n\n虽然在已经完成投票的\
    \ RFC 之外，很难判断未来的 PHP 版本将接受什么，但在内部列表中已经有一些讨论\n\nNikita Popov 提供了一个补丁\n\n```\n\n\
    ```\n\n```\n\n还可以过滤注册号为 `DG44-001` 的记录：\n\n```\n\n```\n\n```\n\n最后的优势是系统处理嵌套 `foreach`\
    \ 语句的能力（示例直接取自 Nikita 的邮件），如列表 10.2 所示。\n\n**列表 10.2**\n\n```\n\n```\n\n```\n\n\
    你可以看到，这是一个强大的功能，将使 PHP 中的数组操作变得简单得多，考虑到它们简洁且无状态的特性，它们将是函数式编程工具包很好的补充。\n\n随着 PHP\
    \ 迈向未来，看起来新版本将增加更多功能和函数，这有助于函数式编程在 PHP 中成为现实。\n\n***\n\n1. [可调用类型](http://php.net/language.types.callable)↩\n\
    2. [使用 __invoke() 访问类成员](https://bugs.php.net/bug.php?id=63253)↩\n3. [可变参数 RFC](https://wiki.php.net/rfc/variadic)↩\n\
    4. [[PHP-DEV] PHP 的列表推导式和生成器表达式](http://markmail.org/thread/uvendztpe2rrwiif)↩\n\
    5. [addListComprehensions Branch](https://github.com/nikic/php-src/tree/addListComprehensions)↩\n\
    \n# 11 结论\n\n> “函数式编程只是‘另一种工具’，就像诚实也是除了胡乱编造之外的一种技巧。”\n\n> \n\n> —Rúnar Bjarnason（函数式程序员，@runarorama）\n"
