    era. He taught himself mathematics and logic by spending extended periods in a
    reference library. Later on, he would become the first professor of mathematics
    at Queens College, Cork in Ireland. This is where he would meet his wife Mary
    Everest (a niece of George Everest whom Mt. Everest is named after). Interestingly
    while the mountain is pronounced Ever-est, their family name was actually Eve-rest.


    It was at this same institution Boole caught a cold that would lead to his eventual
    death. While walking to give a lecture, he was saturated by a heavy rain storm.
    After giving the lecture in wet clothes he became ill and was cared for by his
    wife. Unfortunately, she subscribed to a theory, common at the time, that cause
    is cure. To this end, she threw buckets of cold water over him as he lay stricken
    in bed. The theory held that if it was cold water that caused the illness, then
    more of the same would cure it. His condition worsened and on the 8th of December
    1864 he died. A highly illogical end to befall a seminal logician!


    While not a direct contributor to the history of functional programming he did
    influence the progress of logic and worked extensively on Boolean algebra. He
    did teach himself calculus, but it was not his primary area of study.


    In the interim, no major breakthroughs were found in the field of calculus. Logicians
    were hard at work though, formulating systems and proofs to describe the world.


    Gottlob Frege would go on to further develop calculus by defining the first predicate
    calculus. Some of the developments he worked on are still in use to this day.
    His main concern though was to prove mathematics could be completely described
    by logic. Unfortunately for him, this turned out to be false.

    '
  trans: '


    > “…关于使用数学函数的编程。每当你向它提供相同的参数，它就会返回相同的结果。每当我执行它时，它都会给我相同的结果。”


    一旦你接触过函数，这种对函数式编程的描述将变得更有意义，因为它提到了“引用透明性”（referential transparency），这在书中讨论完基础概念后会有更深入的探讨。


    那么，到底如何用函数式风格完成工作呢？难道没有了赋值语句，一切都不可能吗？你如何在程序中传递值呢？


    答案不可思地简单；值可以作为参数和返回值在函数之间传递。进一步扩展这个想法，我们可以拥有返回函数的函数，或者接受函数作为参数的函数。你思考得越多，它就变得越强大。


    这些函数的组合简洁、清晰地表达了程序的意图。不可变结构有助于确保副作用不会渗透到函数式程序中。在这里我指的是避免变量赋值，这是命令式语言的基础基础。


    谦逊的函数比大多数面向对象的 PHP 程序员所认为的要有用得多，也强大得多。


    ## 2.1 让我们来看一些代码


    为了消除你脸上的不可置信表情；这里有一个简单的命令式示例，用于计算从一到十的所有整数之和：


    ```


    ```


    相比，使用 PHP 的 `range()` 和 `array_sum()` 函数更具函数式的风格，生成一个从 1 到 10 的数组并求其所有值的和：


    ```


    ```


    在这里，我们触及了函数式编程的一个核心概念和优势。我们没有详细详述求和数字所需的步骤，而仅仅描述了在给定一组值时我们想要的结果。


    我们还成功地避免了状态跟踪变量（命令式示例中的 `$sum`）的使用，并自动将工作单元拆分为可重用的函数。如果我们在其他地方需要 `range()`，可以轻松重用相同的代码。


    相反，在命令式示例中，我们被要求完成所有的苦力工作，例如循环和使用变量赋值维护状态。也许这可以被认为有点像写菜谱，常量是你的配料表，而循环等同于具体的步骤说明。


    继续这个关于食物的类比，我们可能会说函数式示例更像是在餐厅点餐，你只需从菜单中选择。尽管，就像一家优秀的披萨店，你总是可以自己添加更多的配料！


    正如你可能看到的，函数式编程和设计良好的面向对象代码在某些方面非常相似，它们都追求封装，并将工作单元拆分为更小的、可重用的块。


    ## 2.2 历史


    函数式编程的历史，事实上是整个计算机科学的历史，完全依赖于数学和逻辑领域完成的工作。可以将这些领域知识的集体积累追溯到一些最早记录的哲学家和数学家。


    在考虑他们对逻辑理解的贡献时，提到苏格拉底和亚里士多德并不恰当。也就是说，计算的根源可以追溯到公元前 400 年以前。很久后在公元前 200 年中期，阿基米德写下了极早的微积分开端，这些内容后来在名为《阿基米德重写本》（Archimedes
    Palimpsest）的手稿中被发现。它在 13 世纪被重写了宗教文本，因此被人类遗忘。幸运的是，通过 X 射线等各种成像设备，大部分内容已经得到了恢复，但已经太晚了，无法告知我们即将遇到的微积分先驱们。


    然而，从函数式的角度来看，有趣的事情始于 1666 年和 1675 年，当时艾萨·牛顿和格特布里德·莱布尼茨（分别）记录了微积分的最早形式。这一数学发现是所有函数式思维的基础，也是整个计算史的重要组成部分。


    据推，在两人都不知情的情况下，他们都在同一时间撰写论文。纯属巧合，他们在相似的时间得出了相似的结论。事实上，更有可能是理论基础已经由之前的人士奠定，而条件允许某人迈出逻辑上的下一步。


    尽管如此，这段历史仍然存在一些争议，因为牛顿一直在研究微积分，但直到 1693 年才发表。相比之下，莱布尼茨在 1684 年就发表了，并且很可能知道牛顿早期的工作，因为他们都是伦敦皇家学会的成员。


    当被要求正式确定谁发明了微积分时，学会表示，虽然莱布尼茨是第一个发表的，但牛顿创造了它。令人不安的是，牛顿当时是伦敦皇家学会的英国，因此会对会对最终决定产生影响。后来，学会还对莱布尼茨提出了抄袭指控。尽管如此，他对数学和微积分的影响是显而易见的。


    ### 乔治·布尔的故事


    乔治·布尔是一位英国数学家和逻辑学家，布尔逻辑（Boolean logic）以此名字命名。他出生于工人家庭，并不是那个时代典型的天才。他通过在参考书库度过长时间自学了数学和逻辑。后来，他成为爱尔兰于科克皇后学院的第一位数学教授。就在那里，他遇到了他的妻子玛丽·埃弗里斯特（乔治·埃弗里斯特的侄女，珠穆玛峰正是以此命名的）。有趣的是，虽然这座山的读音是
    Ever-est，但他们的姓氏实际上是 Eve-rest。


    在同一所机构，布尔患了冒并导致了他最终的去世。在去讲座的路上，他被大雨淋透了。在穿着湿衣服做完讲座后，他病了，并得到了妻子的照顾。不幸的是，她信从了当时流行的“对治疗法”理论。为此，当他病在床上时，她向他泼了一桶桶冷水。该理论认为，如果是冷水导致了疾病，那么更多的冷水就能治愈它。他的病情恶化了，并在
    1864 年 12 月 8 日去世。对于一位开创性的逻辑学家来说，这是一个极其不逻辑的结局！


    虽然他不是函数式编程历史的直接贡献者，但他影响了逻辑学的进展，并广泛研究了布尔代数。他自学了微积分，但并不是他的主要研究领域。


    在此期间，微积分领域没有发现重大突破。不过逻辑学家们一直在努力，制定系统和证明来描述世界。


    哥特洛布·弗雷格将通过定义第一个谓词逻辑来进一步发展微积分。他研究的一些成果今天仍在使用。但他主要关注的是证明数学可以完全由逻辑描述。对他来说遗憾的是，这被证明是错误的。


    '
