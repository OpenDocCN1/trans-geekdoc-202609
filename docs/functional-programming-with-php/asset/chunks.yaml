    > It is also worth noting Erlang is not short for Ericsson Language, but rather
    it is named after a computer scientist named Erlang. Although, it does serve the
    dual purpose quite admirably.


    Since its creation Erlang has been used by numerous household names in a number
    of industry sectors. One of the most well-known recent uses of Erlang is as the
    base language for the `CouchDB` NoSQL server. This storage system uses `map` and
    `reduce` statements to make it possible to extricate the correct information—the
    significance of this will become clearer later. Well, at least in relation to
    functional programming anyway!


    At around the same time as Erlang was being designed with a practical purpose
    in mind, another functional language was in it’s infancy. Designed by committee
    and open source at its outset, `Haskell` has gone on to become arguably the most
    well-known pure functional language. In the beginning however it was not event
    able to output anything—it was a pure and solid state box.


    This reflects its beginnings as an experiment and an educational tool. As `IO`
    (input/output) is inherently stateful they grappled with the problem of defending
    their code from outside influences. You want to be able to access information
    such as a database or a text file on disk in such a way that it does not introduce
    stateful operations.


    If you have a knowledge of electronics then this could be considered similar to
    amplification circuits, in a simplified way. You need a power source to boost
    the signal, but it is important no noise be introduced from the power source to
    the signal. There really is only a passing resemblance so don’t delve too deeply
    in!


    `Haskell` now powers projects in the open source world and even in banking. A
    couple of projects you might have heard of include `Pandoc` and `xmonad`. It is
    still relatively small with many companies preferring to stick with familiar tools
    and methodologies.


    This set the scene for the creation of the `Scala` programming language in 2004
    on both the `Java` and `.NET` runtimes. It allowed a functional language to be
    used in existing infrastructures. The `.NET` version ceased in 2012 with language
    development becoming focused on the `JVM` (Java Virtual Machine). While these
    underpinnings sped up the development and adoption of the language, they did come
    with a cost. Neither platform was designed to host a functional language. This
    has led to some difficulties and shortcomings, but nothing warranting further
    discussion in the context of this book.


    Unlike `Haskell`, the `Scala` language is not purely functional and it is possible
    to write very elegant object oriented code in it. This is another one of its attractions;
    a familiar methodology neatly executed. As it also runs on the `JVM`, it is possible
    to use `Java` packages from `Scala` code directly.


    It could be argued `Scala` is more trendy than `Haskell` with companies such as
    `Twitter`, `LinkedIn`, `Foursquare`, and `The Guardian` making use of `Scala`
    in their core product offerings. Again this is very subjective! `Twitter` has
    written a number of onboarding guides for new engineers which serve as handy learning
    resources


    As these languages have evolved, the level of interest has increased. This can,
    at least partially, be attributed to the increased need for parallel processes
    to harness multi core and node architectures. Functional code eases the shared
    mutable state problem imperative code can suffer from. This has made it increasingly
    attractive as architectures become more and more complicated to handle increased
    load.


    More recent converts to functional code could easily have learned online from
    a MOOC with a number of courses touching on `Haskell` and `Scala`. These can serve
    as good introductions to those languages and `Scala` in particular has a number
    of good books written for learners of the language.


    The history of functional programming is irrevocably intertwined with discoveries
    in mathematics and logic. Off the back of those advancements programming and computing
    itself were created. While functional style programs are still not as popular
    as their state filled counterparts, adoption appears to be steadily increasing.


    ## 2.3 Other Functional Implementations


    The spectrum of languages that might consider themselves as implementing functional
    constructs is quite broad. In terms of pure functional languages, `Haskell` is
    possibly the most well-known. Somewhere in the middle are languages like `Scala`
    and `Clojure` which contain both imperative as well as functional styles.


    Then much further out on the fringes, there are languages like our beloved and
    oft-vilified `PHP`, which has slowly been acquiring the basic ingredients for
    functional programming.


    For the sake of contrast, here is the same `sum` example in `Haskell`, which is
    as simple as:


    ```

    ```


    As you can see, the syntax makes it very easy to clearly express the program in
    a minimal number of characters.


    ## 2.4 Commercial Uses


    One often cited benefit for a functional approach is in the construction of domain
    specific languages (DSLs). The functional constructs in most languages successfully
    reduce the amount of low-level work required when parsing a language as built-in
    type handling and pattern matching enable fast and complex parsers to be written
    in fewer lines of code.


    The advantage of this is it greatly eases maintenance chores and makes the code
    simpler to understand.


    A well-known commercial example of this can be found in the Functional Payout
    Framework for exotic trades at Barclays Bank. Written in `Haskell`, it defines
    a DSL for mathematicians to create trading applications upon. The compact and
    flexible functional implementations allow the team to react more effectively and
    quickly to user requests for new features. There were some concerns for the team
    at the outset of the project, chief among which was the need to interface with
    other legacy systems written in languages such as `C`. Not only was this easily
    completed with `Haskell`, but it worked out to be a bonus as it prevented tight
    coupling of the components.


    Probably the most well-known commercial use of functional programming is the inception
    of the `Erlang` language at `Ericsson`, which was specifically designed to improve
    productivity through a high-level symbolic language. Due to the stringent reliability
    and concurrency demands of telecommunications, Ericsson ruled out the array of
    functional languages at the time with `LISP` and `Prolog` being the front runners.


    `Erlang` has since been adopted by many commercial users and powers numerous mission
    critical pieces of hardware. It’s probably the biggest success story in terms
    of commercial adoption and continued use in its target domain.


    A more recent example comes from `Twitter`, which is using `Scala` to handle a
    number of key features for their social service. While `Scala` is not a purely
    functional language (it has object-oriented support as well), it is certainly
    well equipped to do so. Some of the features you use every day on `Twitter` are
    powered by `Scala`, including the store of user relationships, searching for users
    by name or interests, and the “who to follow” fuzzy suggestions `Twitter` provides.
    The abstractions allowed by functional programming in `Scala` have also meant
    it is being used in many other areas as well, such as the streaming API, the `Kestrel`
    queuing mechanism, and their geo systems.


    ## 2.5 What is Functional Programming Best for?


    As you will see, anything which can be done imperatively can also be completed
    using functional methodologies. Although each methodology has its advantages you
    can view them as simply another way of slicing the cake.

    '
  trans: '


    > 值得注意的是，Erlang 并不是 Ericsson Language 的缩写，而是以一位名为 Erlang 的计算机科学家命名的。尽管如此，它确实非常出色地起到了双重作用。


    自诞生以来，Erlang 已被许多行业领域的众多知名企业使用。Erlang 近期最为人知的用途之一是 `CouchDB` NoSQL 器的基础语言。该存储系统使用
    `map` 和 `reduce` 语句使得提取正确信息成为可能——这一点的意义在稍后将会变得更加清晰。嗯，至少在函数编程方面是如此！


    在设计 Erlang 并并考虑实用目的的同时，另一种函数式语言正处于婴儿期。`Haskell` 由委员会设计并从从初就开源，它此后已成为公认为最著名的纯函数式语言。然而，在开始阶段，它甚至无法输出任何内容——它是一个纯粹且稳固的状态黑盒。


    这反映了它作为一种实验和教学工具的起源。由于 `IO`（输入/输出）本质上是有状态的，他们一直在努力解决保护代码免受外部影响的问题。你希望能够以一种不引入状态操作的方式访问数据库或磁盘上的文本文件等信息。


    如果你了解电子学，那么这可以被简单地看作类似于放大电路。你需要一个电源来增强信号，但重要的是不要让噪声从电源引入信号中。这之间真的只有细微的相似之处，所以不要钻得太深！


    `Haskell` 现在为开源世界甚至银行业中的项目提供动力支持。你可能听过的几个项目包括 `Pandoc` 和 `xmonad`。它的规模仍然相对较小，许多公司倾向于坚持熟悉的工具和方法论。


    这为 2004 年在 `Java` 和 `.NET` 运行时上创建 `Scala` 编程语言铺了道路。它允许将函数式语言应用于现有的基础设施中。`.NET`
    版本于 2012 年停止，语言开发重点转向了 `JVM`（Java 虚拟机）。虽然这些基础加速了该语言的开发和采用，但也付出了代价。这两个平台都不是设计为托管函数式语言而设计的。这导致了一些困难和缺点，但在本书的语境下，没有进一步讨论的价值。


    与 `Haskell` 不同，`Scala` 语言不是纯函数式的，你可以在它编写非常优雅的面向对象代码。这是它的另一个吸引力；熟悉的方法论被完美地执行。由于它也运行在
    `JVM` 上，你可以直接从 `Scala` 代码中使用 `Java` 包。


    可以认为 `Scala` 比 `Haskell` 更赶潮流，像 `Twitter`、`LinkedIn`、`Foursquare` 和 `The Guardian`
    等公司在其核心产品提供中使用了 `Scala`。再次，这非常主观！`Twitter` 为新工程师编写了许多入职指南，这些指南都是方便的学习资源。


    随着这些语言的演变，人们的兴趣程度也提高了。这至少可以部分归功于对并行进程以利用多核和节点架构的需求增加。函数式代码缓解了命令式代码可能遭受的共享可变状态问题。随着架构为了处理日益增加的负载变得越来越复杂，这使其越来越具有吸引力。


    最近转向函数式代码的人可以很容易地通过 MOOC 在线学习，其中许多课程涉及了 `Haskell` 和 `Scala`。这些课程可以作为这些语言的良好介绍，特别是
    `Scala`，还有几本为该语言的学习者编写的好书。


    函数式编程的历史与数学和逻辑领域的发现有着不可分割的联系。正是在这些进步的基础上，编程和计算本身才应而生。虽然函数风格程序仍然不如它们充满状态的程序受欢迎，但采用率似乎在稳步增长。


    ## 2.3 其他函数式实现


    认为自认为实现了函数式构造的语言谱系非常广泛。在纯函数式语言方面，`Haskell` 可能是最著名的。在中间是 `Scala` 和 `Clojure` 这样的语言，它们既包含命令式也包含函数式风格。而在更边缘，还有像我们喜爱的、常被诟的
    `PHP`，它正在逐渐获取函数编程的基础。


    为了对比，这里是 `Haskell` 中相同的 `sum` 示例：


    ```

    ```


    正如你所见，这种语法使得用最少的字符清晰地表达程序。


    ## 2.4 商业用途


    函数式方法经常被引用的优点在于构建领域特定语言（DSLs）。大多数语言中的函数式构造成功地减少了解析语言时所需的底层工作。


    这种方法的优势在于它极大地减轻了维护工作并使代码更易理解。


    一个著名的商业案例可以在巴莱多银行的奇异交易结算框架找到。该框架用 `Haskell` 编写，为数学家创建交易应用程序定义了一个 DSL。紧凑且灵活的函数实现使团队能够更有效、更快地对新需求做出反应。项目初期团队面临一些担忧，主要是与
    `C` 等语言编写的遗留系统建立接口。使用 `Haskell` 不仅轻松完成了这一点，而且结果是一个惊喜，因为它防止了组件的紧耦合。


    函数编程最著名的商业用途可能是爱立信创立 `Erlang` 语言，该语言专门设计用于通过高级符号语言提高生产力。由于电信对可靠性和并发性的严苛要求，爱立信排除了当时的函数式语言，`LISP`
    和 `Prolog` 是领先者。


    自此以后`Erlang` 被许多商业用户采用并为许多任务关键硬件提供动力。在商业采用和持续使用方面，它可能是最大的成功故事。


    另一个最近的例子来自 `Twitter`，他们正使用 `Scala` 来处理其社交服务的许多关键功能。虽然 `Scala` 不是纯函数式语言（它也有面向对象的支持），但它完全能够胜任。你在
    `Twitter` 上每天使用的某些功能都是由 `Scala` 驱动的，包括用户关系的存储、按名称或兴趣搜索用户以及 `Twitter` 提供的“关注谁”模糊建议。


    ## 2.5 函数编程最适合什么？


    正如你所看到的，任何可以用命令式完成的任务都可以用函数式方法论完成。虽然每种方法论都有其优势，但你可以把它们仅仅看作切蛋糕的另一种方式。


    '
