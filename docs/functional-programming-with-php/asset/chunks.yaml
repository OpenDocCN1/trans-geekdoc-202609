    ### 其他新增


    现在也可以直接对数组和字符串字面量进行解引用：


    ```


    ```


    如前所述，`PHP`还将通过 `array_column()` 函数的形式获得数组提取（pluck）功能。


    ## 10.3 PHP 5.6


    ### 变长参数 (Variadics)


    Nikita 提出了一个 RFC，定义了 `PHP 5.6` 中变长参数函数的语法。


