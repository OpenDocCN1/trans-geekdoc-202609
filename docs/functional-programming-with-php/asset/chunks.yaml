    2. [React/Promise](https://github.com/reactphp/promise)[↩](#ch011.xhtml#fnref2)

    3. [React/Promise](https://github.com/reactphp/promise)[↩](#ch011.xhtml#fnref3)

    4. [PHPDaemon](http://daemon.io)[↩](#ch011.xhtml#fnref4)

    5. [PHP Simple Daemon](http://github.com/shaneharter/PHP-Daemon)[↩](#ch011.xhtml#fnref5)


    # 9 Hazards of Functional Programming in PHP


    > “‘I am not going to exploit functional programming because my coworkers would
    complain’ is such a gross and cynical thing to believe.”

    >

    > –Tony Morris (Functional programmer, @dibblego)


    PHP is not a functional language, and therefore, it is more than a lack of sugar
    we must overcome. Or more likely in PHP’s case, work around and make do! As a
    language, PHP has not evolved to support functions as we need, and there has been
    a deliberate choice to concentrate development resources on improving the language’s
    object-oriented capabilities. I am not criticizing this; given limited resources,
    it is important you focus on aspects which will have the greatest impact. Catering
    to a minority of PHP developers while ignoring the masses would hamper continued
    uptake of the language and disenfranchise current users.


    Having said all this, it is of course, frustrating when a language you are using
    is not able to cater to the code you wish to implement with it. “Use a more appropriate
    language,” you might rightly cry! I would counter there are a great number of
    developers who are immensely productive in PHP and may wish to use those skills
    in a functional style. More practically, there are those of us who must use PHP
    for various reasons such as it is the only deployment platform, integration with
    a legacy codebase, or it is an employer’s mandate.


    All of this means you will need to think about how you are going to manage your
    functional projects in PHP. First, how will you lay out your files and create
    functional “packages” for code sharing?


    Unfortunately, PHP does not have a mechanism for autoloading functions at present
    and from following the discussions surrounding two related PHP RFCs which leaves
    you with a few choices:


    1. Require/include in all the files for all requests.

    2. Set up the functions as static methods in a class file, which can then be autoloaded
    similar to `Underscore.php`.

    3. Use my simple functions which cause namespace `use` statements to perform more
    like an import clause. While it solves a problem, it is—at its core—a complete
    hack which will invariably slow down your code due to the use of the PHP Tokenizer
    to double parse the files.


    This is not a show stopper, but it’s annoying and does merit mentioning. If you
    are going to be implementing some basic functional styles, then it does not matter
    so much, but if you want to share or reuse a whole library of functions, then
    you are faced with these three horrible options.

