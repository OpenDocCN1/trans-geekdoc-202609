    \ fact they appear nested inside another function.\n\n### Function Parameter Type\
    \ Hinting\n\nIn functional programming it is common to use your languages compiler\
    \ to help you write functions which accept values of a certain type and check\
    \ your implementation before it even makes it to run time. In PHP this is difficult,\
    \ as it is quite a loose type system and instead of a compiler PHP uses a runtime\
    \ parser. As the code is not evaluated until it is run, errors cannot be machine\
    \ detected.\n\nThere are some simple keywords you can employ to defend against\
    \ the incorrect type being passed into a function.\n\n* `array` specifies it must\
    \ be an array\n* A class name (`stdClass`)\n* The name of an interface (`Traversable`)\n\
    \nFinally there is another type hint added in PHP 5.4 called `callable`, which\
    \ denotes an argument which can be called like a function. In PHP. a `callable`\
    \ can be any of the following:\n\n* The name of an existing userland or PHP function\
    \ as a string (`'substr'`)\n* A class method can be specified as an array of two\
    \ elements—first an instance and then the method name as a string (`[$object,\
    \ 'myMethod']`)\n* Static methods are similar, except instead of an instance you\
    \ pass the class name as a string (`['MyClass', 'myMethod']`) or `MyClass::myMethod`\n\
    * Lambda functions and closures\n\nIf you value a stronger typing for PHP 5 (and\
    \ you should), then Joe Watkins of Pthreads fame has been working on a PHP extension\
    \ called `Strict`. This extension makes it possible to type hint for scalar types\
    \ such as string or integer values when defining function parameters.\n\nThese\
    \ type hints will trigger an exception if the incorrect type is passed into them.\
    \ This allows you to rely on the correct type being passed into your routine.\
    \ By default, PHP does not let you hint on scalar types at the moment.\n\nStrict\
    \ also brings a handy function using a so called lossless cast or throwing an\
    \ exception where this is not possible. To determine the success of such a cast\
    \ operation Strict checks if the conversion can be done without data or precision.\
    \ So you would not be able to cast a float with decimals to an integer.\n\nThe\
    \ only problem with the way Strict operates is default values cannot be specified\
    \ for function arguments. This is due to Strict handling the arguments as classes.\
    \ As you probably know it is not possible to supply an instance of a class as\
    \ the default value of function argument so this cannot be worked around.\n\n\
    Strict can provide a neat way around the limitations of Pros type system. For\
    \ functional programming this eases the need to check the input types of function\
    \ arguments. The only alternative is to accept the value assuming the caller is\
    \ passing in the correct type, and error if it is not. Hardly an elegant solution!\n\
    \n### Advanced Function Calling\n\nIt is sometimes useful to be able to call a\
    \ function programmatically by passing it an array of parameters. PHP has a couple\
    \ of ways of doing this depending on the version of the language you’re using.\n\
    \nCurrently, the default approach is to use the `call_user_func_array()` function,\
    \ but as we will see later variadics bring syntactic sugar to the exercise.\n\n\
    Quite possibly, the most common use of this technique is from inside a function\
    \ when calling a second function with the same parameters or a subset of them.\
    \ To illustrate this the following PHP log function outputs a terse debug message\
    \ before calling the target function.\n\n```php\nfunction log_and_call($function,\
    \ $arguments) {\n    echo \"hello called \";\n    call_user_func_array($function,\
    \ array_slice($arguments, 1));\n}\n```\n\n```\n```\n\nThis function is very contrived\
    \ and although it is not something I would employ in production it does, however,\
    \ serve as a concise example. Now we can call it to see how it will react to input.\
    \ Note the use of `array_slice()` to chop the first array element from `$arguments`\
    \ as we don’t need the name of the secondary function passed into the secondary\
    \ function!\n\n```php\nlog_and_call(\"echo\", [\"simon\\n\"]);\n```\n\nAlthough\
    \ this code may look complicated it is actually in fact quite simple; `log_and_call()`\
    \ takes a function name followed by a 0..N list of parameters. Given these arguments\
    \ it will echo the name of the function it is to call and execute the requested\
    \ function. Arguments are passed from `log_and_call()` to the secondary function.\
    \ Finally, the result of the function call is returned.\n"
  trans: "\n\n5. 再次在函数内部执行计算或操作并返回结果——`5`\n\n这说明了在解析器中执行函数的流程，但作用域（scoping）呢？\n\n\
    其实，在 PHP 中，函数无法访问函数体之外定义的变量。该规则的唯一例外是作为参数传递函数的变量，或者通过 `global` 关键字显式引入的变量。\n\n\
    要访问父级作用域中的变量，必须将其作为参数传递，或者在函数体内部声明为 `global`。\n\n尽管 `$a` 没有被作为参数传递，但它通过使用 `global`\
    \ 关键字被替换到函数体中。这意味着如果将该函数应用于参数为 `1` 的输入时，函数体将被替换为 `10 + 1`。\n\n为了完整起见，值得指出在 PHP\
    \ 中还有两种方法实现此目的。你可以将变量添加到超全局变量中，例如 `$GLOBALS`、`$_POST`、`$_SESSION` 等，或者你可以使用闭包（closure），我们将在本书的后续章节中讨论。\n\
    \n> 超全局变量（Superglobals）是 PHP 中每个作用域内都可用的变量。PHP 总共定义了九个超全局变量，广义来说，你只会向其中两个添加值。当你存储一个希望在整个会话期间持久的值时，会将该值放在\
    \ `$_SESSION` 中。否则，为了让它持续到当前进程结束，你可以写入 `$GLOBALS`。其他超全局变量还包括请求头（`$_GET`、`$_POST`、`$_REQUEST`、`$_FILES`\
    \ 和 `$_COOKIE`）和环境（`$_SERVER` 和 `$_ENV`）。虽然可以更改这些数组的值，但通常建议这样做，因为这会导致依赖这些变量及其相应值的脚本产生意外结果。\n\
    \n> 过去，我曾为了批量虚拟主机设置在 `auto_prepend_file` 中覆盖 `$_SERVER['DOCUMENT_ROOT']`。我发现的另一个用途是在设置\
    \ cookie 值时，它在用户下一次请求之前是不可用的，因此我会手动在 `$_COOKIE` 数组中设置它，以强制其立即可用。然而，这确实是不明智的。\n\
    \n虽然全局变量可以提供一种将值引入函数体的简单方法，但它普遍是不受欢迎的——而且这很有道理！通过依赖全局变量，你**为你的应用程序引入了状态**。\n\n\
    应该避免状态，因为它很难重新创建并会导致软件出现 bug。稍后会有更多相关内容，但现在请不要在你的代码中实现这些方案！\n\n在体体的末尾（尽管可能出现在之前），通常的做法是包含一个\
    \ `return` 语句。不包含 `return` 语句的函数将输出 `null` 值。这可以通过完全省略 `return` 关键字或指定 `return;`\
    \ 来实现。如果你需要从函数返回多个值，可以返回一个值数组。\n\n最后，虽然在 PHP 中可以在函数之间嵌套命名命名函数，但它们的行为可能并不符合你的预期。所有命名函数——无论它们定义在何处——都会被解释为处于父级作用域。这意味着，嵌套在另一个函数内部的函数可以在包含它的函数的外部调用。它们还污染了命名空间，因此你不能拥有与嵌套函数中声明的同名的函数。\n\
    \n这意味着你不能编写列表 3.1 中的代码并期望 PHP 解析它。\n\n**列表 3.1**\n\n由于定义了两个名为 `expr()` 的函数，无论它们看起来是嵌套在另一个函数内部，PHP\
    \ 都会抛出解析错误。\n\n### 函数参数类型提示 (Function Parameter Type Hinting)\n\n在函数式编程中，通常使用语言的编译器来帮助你编写接受特定类型值的函数，并在它们运行之前检查你的实现。在\
    \ PHP 中这很困难，因为它的类型系统相当松散，PHP 不使用编译器，而是使用运行时解析器。由于代码在运行之前不会被求值，因此无法由机器检测。\n\n你可以使用一些简单的关键字来防止将错误的类型传递给函数。\n\
    \n*   `array` 指定它必须是一个数组\n*   一个类名（`stdClass`）\n*   接口名称（`Traversable`）\n\n最后，在\
    \ PHP 5.4 中添加了另一种类型提示，称为 `callable`，它表示可以像函数一样调用的参数。在 PHP 中，`callable` 可以是以下任何一种：\n\
    \n*   以字符串形式存在的现有用户空间或 PHP 函数名（`'substr'`）\n*   类方法可以指定为包含两个元素的数组——第一个是实例，然后是作为字符串的方法名（`[$object,\
    \ 'myMethod']`）\n* 静态方法类似，不同之处在于传递的不是实例而是作为字符串的类名（`['MyClass', 'myMethod']`）或\
    \ `MyClass::myMethod`\n*   Lambda 函数和闭包\n\n如果你看重 PHP 5 的强类型支持（你确实应该这样做），那么著名的\
    \ Pthreads 的 Joe Watkins 一直在使用一个名为 `Strict` 的 PHP 扩展。该扩展允许在定义函数参数时对字符串或整数值等标量类型进行类型提示。\n\
    \n如果传递错误的类型，这些类型提示将触发异常。这允许你依赖于传入例程序的正确类型。默认情况下，PHP 目前不允许你对标量类型进行提示。\n\nStrict\
    \ 还带来了一个实用的函数，可以使用所谓的无损转换（lossless cast）或在无法转换时抛出异常。为了确定此类转换操作是否成功，Strict 会检查是否可以在不丢失数据或精度的情况下完成转换。因此，你无法将带小数的浮点转换为整数。\n\
    \nStrict 运行方式的问题在于无法为参数指定默认值。这是由于 Strict 处理参数。\n\n### 高级函数调用 (Advanced Function\
    \ Calling)\n\n有时通过传递参数数组来程序化地调用函数是有用的。PHP 有几种方法实现这一点，取决于你使用的语言版本。\n\n目前默认的方法是使用\
    \ `call_user_array()` 函数，但正如我们之后看到的，变长参数（variadics）为这一练习带来了语法糖。\n\n极可能的，这种技术常用的用法是在函数内部调用具有相同参数或部分参数的另一个函数。为了说明这一点，下面的\
    \ PHP 日函数在调用目标函数之前会输出简短的调试信息。\n\n```php\nfunction log_and_call($function, $arguments)\
    \ {\n    echo \"hello called \";\n    call_user_func_array($function, array_slice($arguments,\
    \ 1));\n}\n```\n\n```\n```\n\n这个函数非常牵强，虽然我不会在生产环境中使用，但它确实可以作为一个简洁的示例。现在我们可以调用它看看它如何对输入做出反应。注意使用\
    \ `array_slice()` 从 `$arguments` 中切掉第一个元素，因为我们不需要将辅助函数的名称传递到辅助函数中！\n\n```php\n\
    log_and_call(\"echo\", [\"simon\\n\"]);\n```\n\n"
