    # 9 PHP 中函数式编程的风险


    > “‘‘我不会利用函数式编程，因为我的同事会抱怨’这种想法是如此荒谬且愤俗的。”

    >

    > –Tony Morris（函数式程序员，@dibblego）


    PHP 不是函数式语言，因此这更多是我们需要必须克服的语法糖缺失。作为语言，PHP 没有演进到支持函数，而是选择将开发资源集中在改进面向对象的能力上。我并不是在批评这一点；在资源有限的情况下，关注影响最大的方面是非常重要的。照顾少数
    PHP 开发者而忽视大多数将阻碍该语言的持续采用，并损害当前用户的利益。


    尽管如此，当然，当你使用的语言无法满足你想要实现的代码时，是很令人沮丧的。“使用更合适的语言，”你可能会正确地反驳！我会反驳说，有大量的开发者在 PHP 中极其高效，并希望以函数式风格使用这些技能。更务实地说，由于原因我们必须使用
    PHP，例如它是唯一的部署平台、与遗留库集成或老板的要求。


    这意味着你需要考虑如何管理你的 PHP 函数式项目。首先，你将如何布局文件并创建用于代码共享的函数式包？


    遗憾的是，PHP 目前没有自动加载函数的机制，在经历了两个相关 PHP RFC 的讨论后，这留下了几种选择：


    1. 在所有请求的文件中 require/include。

    2. 将函数设置为类文件中的静态方法，然后类似于 `Underscore.php` 进行进行自动加载。

    3. 使用我的简单函数，使命名空间的 `use` 语句执行起来更像 import true。虽然它解决了问题，但从根本上说这是一个黑科技，由于使用了 PHP
    分词器双重解析文件，不可避免会减慢你的代码运行。


    这不是一个致命问题，但很烦人且值得提及。如果你只是实现一些基本的函数式样式，那么这个问题并不重要，但如果你想共享或重用整个函数库，那么你就面临着这三个糟糕的选择。


