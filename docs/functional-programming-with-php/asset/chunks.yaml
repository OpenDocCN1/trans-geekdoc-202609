    > *Note* in PHP 7, the syntax for return types requires it to be after the function
    definition. In this section, we’re focusing on how return types have been presented
    in documentation.


    The initial `string` keyword denotes the return type of a function. In other words,
    this indicates a value of type `string` will be emitted from the `substr()` when
    it is called.


    Often, similar documentation is available via API manuals in userland code. The
    formats used are often easily compiled into an API manual with a command line
    utility such as `PHPDoc` or `Doxygen`.


    These look something like this version of `substr()` for `PHPDoc`:


    ```


    ```


    As you can see this specifies the same details as the PHP manual version, but
    each parameter is described more verbosely over multiple lines. In PHP 5 that
    is pretty much it for type definitions—they exist in documentation only, if they
    exist at all. This trait works out just fine if everyone implementing the function
    is perfect and passes in the correct arguments, but in my experience this is rarely
    true.


    It is much better to put the definitions into code so the compiler can help you
    to identify errors easily and quickly. If you wanted to do this prior to PHP 7,
    then you would have to consider checking the types of the function’s arguments
    with `if` statements. When arguments fail to meet the expected requirements you
    would throw a fatal error.


    **Listing A.1**


    ```


    ```


    Again, this highlights another important distinction between PHP and more strongly
    typed languages (functional languages subscribe to the stricter end of this).
    PHP is a dynamic language, which means the code is parsed at the same time it
    is run. Any fatal error is going to be triggered when the code executes rather
    than at compile time and before it is deployed.


    Of course, with PHP 7’s scalar type and return hints, this function definition
    becomes much more concise. If the function is called from a file in strict mode,
    then the engine will throw an error if an argument doesn’t match the expected
    type. In non-strict mode, the PHP engine will cast incoming arguments to the expected
    type, provided it can do so without data loss.


    ```


    ```


    In a compiler based language such as `Haskell` or `Scala` it is possible for the
    contracts (set out with types) to be checked at compiler time rather than at runtime
    like in PHP. This makes it unlikely you will trigger a type based fatal error
    when the code is being interacted with. This is why compilers and a strong typing
    system are very handy.


    In PHP you do not have this safety net as incorrect type errors can only be found
    at runtime. This means that IDEs also cannot reliably hint or show errors based
    on these type requirements. This has obvious downsides, but on the other hand
    dynamic languages provide near instant gratification with changes live and executable
    immediately during development. There are other reasons this is a bad thing, but
    let us get back to typing.


    As we have seen PHP does not enforce types and (sometimes worse) will attempt
    to coerce values to the correct type for the operation you are attempting. In
    PHP 5 compatible code, the only scalar type definitions are in comments and therefore
    unenforceable. In other languages such as `Scala` or `Haskell` types are part
    of the function’s definition. Both the parameters and return value of a function
    are defined using the language’s type system. If the incorrect type is returned
    or passed in, then the compiler will throw an error at build time.


    A Scala type definition for the `substr()` function would look like the following
    code:


    ```


    ```


    This shows a function with the same API as PHP’s `substr()` function, but written
    in Scala. Well, nearly! To make the code simpler all parameters are required where
    the PHP function allows the last parameter, `$length`, to be optional.


    Working through it in a similar way to the PHP manual example earlier we come
    up with a similar list.

