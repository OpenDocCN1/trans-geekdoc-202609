    \ point as anywhere.\n\n**Listing 7.5**\n\n```\n```\n```\n```\n\nWhen supplied\
    \ a type (`section`, `div`, etc.) and some content, the `tag()` function will\
    \ produce an HTML tag. So if you were to call it with a type of `div` and `sawubona`\
    \ as the content it would emit `<div>sawubona</div>`. It’s really very simple\
