  \n> 这种函数式方法的名称本身没有技术原因或特殊含义，但你可能在好奇“currying”一词从哪里来。它是以数学家 Curry 命名的，顺便用他的名字命名了组合逻辑（combinatory\
  \ logic）。这种技术广为人知，无论你如何称呼它，对于所有接受多个参数的函数来说都是一种非常强大的技术。\n\n## 6.6 流水线 (Pipelines)\n\
  \n流水线通过引入一些轻量级结构，使代码链变得更加清晰简单。一个常见的例子是在格式化字符串，其中 PHP 的 API 需要多个函数。假设你想接受一个字符串，确保只有首字母大写，然后将其截断为六个字符。在\
  \ PHP 中实现这一点，你需要链式 `strtolower()`、`ucfirst()` 和 `substr()`。使用这样的代码已经足够简单：\n\n```\n\
  \n如果你现在想将所有空格替换为连字符呢？简单——只需在链中添加对 `str_replace()` 的调用。一种更简单的方法是使用函数流水线，并以数组的形式提供你想要运行的函数列表。\n\
  \n但首先，我们需要更改之前看到的那些不接受我们的字符串作为第一个参数的函数。我们不需要担心 `substr($str, 0, 6)`，因为它确实接受字符串作为第一个参数。遗憾的是\
  \ `str_replace(' ', '-', $str)` 并不接受，因此必须对其进行部分应用。你可以简单地用另一个函数包装它来实现相同的结果，但我们将在示例中使用\
  \ `React/Partial` 库。在接下来的示例中，我们将 `str_replace(' ', '-', $str)` 放入一个仅带一个参数的部分函数，以便在流水线中链式调用。\n\
  \n``` ```\n\n现在我们有一组顺序正确的参数函数，可以应用于提供的数据。下一步是产生一个流水线函数，它将遍历函数列表并每次应用到提供的数据上。\n\n\
  这在 PHP 中可以用 `reduce` 来定义，如下所示，展示了一个直观的数组 `reduce`，正如我们在 `array_map()` 部分看到的那样，将每个函数应用于累加值。\n\
  \n这种流水线实现的一个巧妙功能是支持通过提供数组，在函数规范中传递后续参数。\n\n**列表 6.4**\n\n```\n\n```\n\n该函数的典型用法可能如下所示，其中一系列字符串处理函数在字符串值上顺序调用。\n\
  \n``````\n\n你会注意到 `substr()` 是以数组形式传递的——这允许为函数传递后续参数。`substr()` 的第一个参数将始终是传递给 `pipeline()`\
  \ 的第一个参数，而数组中的额外参数将组成 `substr()` 的第二和第三参数。这实际上意味着在我们之前的示例中，`substr()` 被调用为 `substr($a,\
  \ 0, 6)`。它在实现上类似于 Elixir 中的相应函数。\n\n\n\n\n处理完这个简单的示例后，我们可以进入一个更有用的流水线，它可以处理下方的值列表。它首先对数据列表进行映射（map），然后将其传递给之前定义的\
  \ `pipeline()`。\n\n```php\nfunction pipeline_list($functions, $list_data) {\n  \
  \ return array_map(function($data) use ($functions) {\n      return call_user_func_array(\n\
  \         'pipeline',\n         array_merge([$data], $functions)\n      );\n   },\
  \ $list_data);\n}\n```\n\n当给出一个字符串值列表时，`pipeline_list()` 函数可以遍历这些值并执行列表 6.5 中的函数列表。\n\
  \n**列表 6.5**\n\n```\n\n```\n\n如果你需要一种简单的方法来将一系列函数应用于一个值或值列表，那么流水线（pipeline）可能是让你的代码更整洁的好方法。与其从内向外读取一系列连续的函数，按照应用的顺序查看函数列表要容易得多。\n\
  \n## 6.7 模式匹配\n\n许多函数式编程语言的一个特性是能够对输入进行模式匹配（pattern match），并基于此产生不同的结果。在某些方面，可以被认为是\
  \ PHP 中更强大的 `switch` 语句。解析器将从顶部的匹配开始，向下运行，直到找到第一个匹配的模式。\n\nPHP 默认并不提供这种功能，因此我们必须自己实现一个，而这实际上比看起来的要简单。它会有一些缺点，而且确实没有像你在\
  \ Scala 或 Haskell 中使用的那些功能那样漂亮或强大，但它们是有用的，这也是为什么它们对本书非常重要的原因。\n\n为了让理解这一过程变得更容易，我们将从模式的样貌开始，稍后再讨论具体的实现细节。对于模式来说，最重要的一点是它将要操作的值。我们将此设置为第一个函数参数。此外，我们还需要指定该值应该针对哪些模式进行测试以及——如果匹配成功，结果或操作应该是什么。\n\
  \n在 PHP 中，保持模式语法的简单整洁是困难的，但数组表示法通过 `=>` 为我们提供了良好的外观，这可以类比 `then`。这让定义具有意义；如果 `matched`\
  \ => `执行此操作`。\n\n```\n\n```\n\n上面示例中的模式相对简单——要操作的值是 `stdClass()` 的实例，它作为第一个参数传递给\
  \ `pattern`。第二个参数是用于测试它的模式列表。\n\n当解析器遍历模式时，它将对值（`stdClass`）执行每个测试（数组键）。当测试返回 `true`\
  \ 时，将返回数组中匹配元素的值，或者如果它是一个 `callable`（可调用对象），则会执行它。请确保在传递给函数的模式列表中，将更具体的模式放在前面。\n\
  \n在这种情况下，它将在后台运行以下评估过程：\n\n1. `is_string(stdClass)`——评估结果为 `false`，因为 `stdClass`\
