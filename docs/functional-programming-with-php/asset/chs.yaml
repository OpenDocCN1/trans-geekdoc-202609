  \n### 也许我们可以有第二个 Monad\n\n基础打好后，是时候转向更具挑战性且实用的东西了。正如你已经在处理你的 NULL 值 中看到的 php-option\
  \ 库，我们将为相同的概念引入一种 monad 风格的解决方案。\n\n然而，首先，让我们简要回顾一下我们正在尝试解决的问题。在编码时，通常会对外部资源（例如数据库或文件）发出请求，这些资源可能返回也可能不返回结果。\n\
  \n```\n\n之前的代码说明了一个简单的数据库查询，从 person 表中获取人的名字。如果没有结果，它就简单打印“Name: Unknown”，但如果有记录，它应该在名字后面添加“(verified)”，显示“Name:\
  \ verified”。总是检查可能存在或不存在的调用返回值会非常疲惫，而总是假设它存在要容易得多。在 Haskell 中，这被称为 `Maybe` monad，我们在这里模拟它。\n\
  \n再次，`Maybe` monad 本质上是一个简单的容器，类似于我们之前定义的 `Only` monad。\n\n为此，我们将添加几个自定义方法来形成 `Maybe`\
  \ 结构的基础，但首先，让我们运行列表 6.11 中的基础方法。\n\n**列表 6.11**\n\n```\n\n```\n\n```由于 `pack()`\
  \ 方法没有被重写，因此与我们已经为 `Only` 使用的相同，让我们直接跳过它，专注于 `map()` 中的微调——`mapAndPack()`。如果结果是空的（`isNothing()`\
  \ 将稍后定义），则 monad 直接返回自身。如果容器中有真实值，则应用该函数并返回封装在 `Maybe` 上下文中新值。\n\n`isNothing()`\
  \ 方法本身只是检查包含的值是否为空，并根据其状态返回布尔值。\n\n一旦定义了 `getOrElse()` 方法，`Maybe` 会变得更有趣，因为它允许在容器为空时返回默认值，或者在有值时返回包含的值。为了演示此功能的实际运行，这里是使用\
  \ `Maybe` monad 代替命令式 `if else` 实现的命令式示例。\n\n```\n\n```\n\n```正如命令式示例一样，当没有可用行时，此代码将\
  \ echo“Name: Unknown”。如果有记录，它将显示“Name: verified”。在这种情况下使用 monad 的优势在于它可以与其他函数应用链式调用，添加已验证标签的代码可以在其他地方轻松复用，而且代码显然更易读、编写更简单。\n\
  \n\n\n\n\n在处理纯 `PHP` 函数时，为了记录日志，向它们添加一些调试信息可能是很有用的。由于我们正处于纯函数内部，我们不能尝试设置状态或引起任何副作用，例如直接打印到屏幕。我们所有的函数都应该将输出作为返回值传递。你需要一种结构来为你的函数增加灵活性——这就是\
  \ `Writer` 单元。\n\n`Writer` 单元允许你将内容输出到屏幕、磁盘、内存等，同时保持方法链和通用接口。为了演示这一实际操作，我们至少需要两个可以应用于\
