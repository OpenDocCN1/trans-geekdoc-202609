  \n将定义放入代码中要好得多，这样编译器可以帮助你快速准确地识别错误。如果你想在 PHP 7 之前这样做，那么你必须考虑使用 `if` 语句检查函数参数的类型。当参数不符合预期要求时，你会抛出一个致命错误（fatal\
  \ error）。\n\n**列表 A.1**\n\n```\n\n```\n\n再次，这强调了 PHP 与强类型语言之间的另一个重要区别（函数式语言遵循更严格的这一端）。PHP\
  \ 是一种动态语言，这意味着代码在运行时的同时进行解析。任何致命错误都将在代码执行时触发，而不是在编译阶段和部署之前。\n\n当然，有了 PHP 7 的标量类型和返回类型提示，这个函数定义变得简洁得多。如果从严格模式的文件调用该函数，那么当参数不匹配类型时，引擎将抛出错误。在非严格模式下，PHP\
  \ 引擎会将输入参数转换为预期类型，只要这样做不会丢失数据。\n\n```\n\n在像 `Haskell` 或 `Scala` 这样基于编译器的语言中，合约（通过类型设定）可以在编译时检查，而不是像\
  \ PHP 那样在运行时检查。这使得在交互代码时不太可能触发基于类型的致命错误。这就是为什么编译器和强类型系统非常有用的原因。\n\n在 PHP 中，你没有这种安全网，因为错误的类型错误只能在运行时发现。这意味着\
  \ IDE 也无法根据这些类型要求可靠地提示或显示错误。这有明显的缺点，但另一方面，动态语言在开发过程中提供了近乎即时的反馈。这种情况的坏处还有很多原因，但让我们回到类型上。\n\
  \n正如我们所见，PHP 不强制类型，而且（有时糟）尝试将值转换为你正在尝试的操作所需的正确类型。在兼容 PHP 5 的代码中，标量类型定义位于注释中，因此无法强制执行。在\
  \ `Scala` 或 `Haskell` 等其他语言中，类型是函数定义的一部分。函数的参数和返回值都是使用语言的类型系统定义的。如果返回或传递了错误的类型，编译器将在构建时抛出错误。\n\
  \n`substr()` 函数的 Scala 类型定义看起来如下：\n\n```\n\n```\n\n这显示了一个与 PHP 的 `substr()` 函数 API\
