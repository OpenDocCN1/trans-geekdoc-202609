  \ *PHP 中函数式编程的风险 章中。\n\n## 3.4 递归（Recursion）\n\n### 基础（Basics）\n\n为了消除程序中的 `for`、`foreach`\
  \ 和 `while` 等流控制语句，你可以使用递归创建循环。这是一个从函数内部反复调用自身的过程，直到达到预设的截止点。\n\n递归在 Web 编程中非常常见的用法围绕打印内容管理系统的站点菜单结构，它也适合处理文件系统的目录树。\n\
