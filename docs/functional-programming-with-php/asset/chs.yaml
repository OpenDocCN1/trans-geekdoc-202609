  \ `composer.phar` 和 `vendor` 目录。\n\n## 4.2 iter 库\n\n生成器（Generators）和迭代器（iterators）是\
  \ PHP 非常实用的功能，但与我们学习的大多数功能一样，它们存在一些不足。用户态 `iter` 库有助于让它们的使用变得更简单、更简洁。该库可以像这里审查的其他库一样，通过\
  \ `composer` 作为依赖项安装。它提供的主要优势是一组函数，这些函数可以通用应用于所有 PHP 可迭代对象、数组、可遍历对象和聚合。这些包括我们之前见过的\
  \ `map`、`reduce` 和 `range` 的实现。这里的例外是，它们可以应用于任何地方并适用于所有的 PHP 集合。\n\n为了使代码更高效，所有的访问都通过生成器完成，这使得库具有懒加载（lazy）特性。我的意思是只有在程序继续执行需要时且仅在需要时，它才会实际完成工作。这与预加载（eager\
  \ loading）相反，后者会在前端尽可能多完成工作，即使结果在当前语文中可能不会被实际使用。\n\n因此，您获得了更好的 API 和改进的整体性能优势。为了保持简单，我们将从一个已经见过几次的示例开始：对一个整数范围求和。\n\
  \n```\n\n```\n\n它也可以用于更复杂的函数式代码并产生良好。如果您必须处理一个项目数组且不能确定它们是否都是同一种类型，那么 `iter\\takeWhile`\
  \ 函数将非常有帮助。\n\n```\n\n```\n\n该库是 PHP 许多列表/可迭代访问函数的非常实用的替代品。与 `functional-php` 一起使用，它可以创建一个非常有用的原语工具包。\n\
  \n由于此库基于生成器，目前迭代对象默认是不可回溯的（rewindable）。为了解决这个问题，该库内置了将迭代器转换为可回溯对象的支持。\n\n```\n\n\
  来自 `iter` 库的生成器已经在 `iter\\rewindable` 命名空间下赋予了可回溯变体。`iter` 库中的任何函数（如 `map`、`reduce`\
  \ 等）都可以这样调用以获得可回溯功能。\n\n```\n\n该库提供的函数在处理支持生成器的 PHP 5.5 及以上版本中的列表时非常有用。它们具有可预测性，在适用的情况下回调函数始终在最前面。这是一个设计非常周全的库，它用更整洁的接口替换了\
  \ PHP 核心函数。\n\n在可能的情况下，我建议您将其作为依赖项添加到您所有的应用程序中，无论它们是否是函数式的。然后只需获取任何类型的列表，并对其对其施加您的意愿，就像我们希望\
  \ PHP 内置函数所做的那样。\n\n* * *\n\n1. [functional-php](https://github.com/lstrojny/functional-php)↩\n\
  2. [Underscore.php](http://brianhaveri.github.com/Underscore.php/)↩\n3. [nicmart/Functionals](https://github.com/nicmart/Functionals)↩\n\
  4. [React/Partial](https://github.com/reactphp/partial)↩\n5. [Functional PHP](https://github.com/lstrojny/functional-php/archive/master.zip)↩\n\
  6. [Composer documentation](http://getcomposer.org/doc/)↩\n\n# 5 HHVM 的 Hack\n\n\
  > “我从未和任何人进行过数学对话，因为我的领域没有其他人。”\n\n>\n\n> —Alonzo Church（数学家和逻辑学家，1903–1995）\n\n\
  Facebook 多年来一直使用 PHP，但随着网站人数的增长，加载时间也随增加。为了加速 PHP，他们编写了一个内部专用的转换器，可以将 PHP 的一个子集转换为\
  \ C 程序。这导致了更快的加载速度，但使用起来非常困难，并且需要内部知识才能正确运行。随着时间的推移，这种方法变得越来越不可行，编译时间越来越长。最终启动了一个新项目，该项目被称为\
  \ HipHop Virtual Machine，简称 HHVM。它是一个即时解析器，在程序执行时创建高效的缓存表示。为了获得最佳性能，必须通过运行目标代码多次来预热此缓存，以便\
  \ HHVM 获取最理想的代码视图。需要注意的是，JIT 部分在命令行上不会增强性能，因为每次调用都会使用新的缓存。\n\n除了这个新的更快的运行时，Facebook\
  \ 还需要在语言中添加一些功能。这已经变成了 Hack 语言。这些语言本质上是相同的，Hack 是 PHP 的一个分支，尽管它有自己的运行时。\n\n要通知编译器您在使用\
  \ Hack 而不是 PHP，您只需使用 `<?hh` 作为起始标签而不是 `<?php`。HHVM 会看到此标签并按 Hack 而不是直接 PHP 代码。在这些标签内部，您可以像使用\
  \ PHP 那样执行操作，但随着将代码逐渐重构为 Hack，可以从改进的 JIT 中获益。PHP 支持的一些功能 HHVM 故意省略了，因为它们在 PHP 野外的实际实现是有限的。为了确保达到合理的等效，Facebook\
  \ 选择了一些开源项目来编译单元测试。\n\n\n\n这涉及到在 GitHub 上挑选几个具有良好测试套集的顶级 `PHP` 项目。然后他们在他们的 `HHVM`\
  \ 构建中运行这些测试，以查看在哪些地方失败。在识别出缺乏支持的区域后，他们处理失败的测试，直到它们解决为止。这一理念是实现与 `PHP` 对等性，以便让现有项目和\
  \ PHP 公司更容易采用该运行时。\n\n这种对匹配 `PHP` 的愿望甚至使 Facebook 团队创建了语言规范的初期。这仅仅是一份详细说明该语言应该做什么及其所需核心库的文档。在准备好之后，他们将其开源，由\
  \ `PHP` 团队维护。\n\n这凸显了 `PHP` 与许多其他语言（如 `Python` 或 `Ruby`）不同的一个方面。在编写 `PHP` 运行时，他们并没有一个可以遵循的规范（他们只是简单地实现了这些功能——好吧，最开始只有\
  \ Rasmus 一个人）。我想这是因为这样做更快、更简单，而且推测当时没有人认为会编写该语言的其他实现版本（例如 `HHVM`）。然而，几年之后，我们有了 `HHVM`、`Zephir`、`HippyVM`\
  \ 和 `Quercus`（在 Java 虚拟机或 `JVM` 上）。\n\n对于 `PHP` 来说，拥有如此知名的替代方案是一个新事物，但对于 `Python`\
  \ 来说，这是他们习惯甚至要求的。在那里，语言实现为 `IronPython` (`.NET`)、`Jython` (`JVM`) 和 `CPython` (`C`)，为开发者提供了更多样化的选择。另一方面，`PHP`\
  \ 的 `Zend Engine` 可以认为是该语言事实参考实现，任何其他运行时都必须模拟它的特性。\n\n回到 `Hack` 语言本身，它可以被认为是 `PHP`\
  \ 语言的扩展。尽管如此，它包含一些非常有用的功能，极大地丰富了 `PHP` 的基础。哦，`Hack` 是用 `OCaml` 编写的——一种函数式（以及其他范）。\n\
  \n## 5.1 类型\n\n在我看来，`PHP 5` 最薄弱的部分之一是类型系统，而 `Hack` 通过对类型系统的扩展在很大程度上解决了这个问题。在 `PHP`\
  \ 中，几乎没有允许创建类型，除非你想将值封装在类中——这是一项艰巨的任务。\n\n然而，在 `Hack` 中，你可以使用类型别名来创建新类型，然后可以在整个代码中引用它们。这种更好的支持极大地减轻了代码维护的负担工作。它也让你在为应用程序编写新功能时，更容易对你编写的代码进行推理。\n\
  \n首先，让我们回到基础，回顾 `Hack` 提供的核心内置类型。这些类型与 `PHP` 定义的类型相同。但一个关键区别是函数参数中可以提示类型（`int`、`string`\
  \ 等）。此外，还可以定义返回类型，允许你对代码进行进一步推理并让解析器报告类型不匹配。正如之前讨论的，这有助于消除整类错误。\n\n虽然 `PHP` 确实有类型，但它们很容易被提示，且变量可以任何时候更改类型。这使得编写预期对特定类型操作的代码变得困难。在\
  \ `PHP 7` 之前，你可以使用某种类型测试的 switch 语句，或者强制转换为你预期的类型并希望该值仍然有效。这对于 `PHP` 来说是一个优点，因为它让语言更自由因此更容易学习。但当你想要编写抽象代码时，它成了一个阻碍。\n\
  \n这就是 `Hack` 语言的类型系统可以帮助的地方。可以避免声明类型，因为 `Hack` 会从你赋值的值中推断类型。如果在声明时分配了一个整数，那么变量的最终类型将自动是\
  \ `int`。这种行为与 `PHP` 非常相似，但在类型提示方面除外。\n\n一个函数可以定义为第一个参数仅接受整数，如下，它还声明了将返回一个 `int`。\n\
  \n```\n```\n```\n\n在此处，你可以看到参数 `$a` 被指定为整数。默认情况下，`Hack` 会在将值传递给函数之前尝试将任何非 `int`\
  \ 值转换为整数。这可能会导致一些意料之外的行为。\n\n你可以通过在起始标签 `<?hh` 之后放置注释来设置你希望 `Hack` 解析器严格到什么程度。这允许你在不同的严格级别下运行各种代码，但这并不是一件好事。这可能会导致困惑，而且一直必须添加注释是很令人恼的。另一方面，它使得在必要时切换到不那么严格的模式成为可能。\n\
  \n为了能够从 `Hack` 调用 `PHP` 代码，你必须在调用文件中不使用 `strict` 模式，例如。这是因为 `strict` 要求代码必须定义并编写类型。\n\
  \n\n\n\n| `Pair` | | 存储两个值的索引集合 |\n\n这些类型处理了我们处理列表的常见方式，但它们减轻了我们像在 PHP 中那样手动实现集合的负担。要创建一个新集合，你可以定义如下内容：\n\
  \n```\n$vector = Vector {1, 2};\n$vector->add(3);\n// Vector(1, 2, 3)\n```\n\n为了兼容性，你仍然可以像在\
  \ PHP 中一样使用数组，但你也可以使其更具体。数组的类型可以根据其值和其键/索引来定义。\n\n键和值的定义非常简单：\n\n```\narray<int,\
  \ string>\n```\n\n其中数组具有整数键，且值为字符串。如果你只想指定值的类型而不是键类型，请使用：\n\n```\narray<string>\n\
  ```\n\n这允许解析器对数组进行类型检查，并防止列表变成各种值的“大杂烩”。当你对列表进行操作时，你希望能够以尽尽的难度以相同的方式处理所有值。通过这样指定类型签名，你可以确保始终能获得一个字符串（或你指定的类型）。\n\
  \n```\nclass HackArray {\n   public array<int, string> $array = [\n      1 => 'ibizo',\n\
  \      2 => 'umuntu',\n      3 => 'inja',\n   ];\n}\n```\n\n如果你希望有一个不可变数组，Hack 通过使用\
  \ `tuple` 实现了这一点，其定义方式如下：\n\n```\n$t = tuple(1, 2, 3);\n$sum = array_sum($t); //\
  \ 6\n```\n\n作为一种不可变类型，一旦定义了 `tuple` 就无法更改，尝试更改将导致错误。\n\n这些数组作为简单的集合或更自定义的针对应用程序集合类的基础。如果你需要像\
  \ `Set` 这样的集合，那么使用 Hack 提供的 `Set` 集合比自己编写更好。原因出于两点，主要是为了效率；它对任何 Hack 程序员来说都是易于识别的结构，而且作为语言的一部分，它默认经过优化。\n\
  \n除了集合和数组外，Hack 还定义了其他有用类型，如 `Enum`、`Generic` 和 `Shape`。在 `Enum` 的情况下，你可以定义一个枚举类型，允许将定义中指定的值赋值给任何变量。这在列表\
  \ 5.1 所示的博客文章发布状态中得到了演示。\n\n**列表 5.1**\n\n```\nenum BlogPostState: int {\n   Published\
  \ = 1;\n   Queued = 0;\n   Draft = -1;\n}\n\nclass BlogPost {\n   public BlogPostState\
  \ $state = BlogPostState::Published;\n   public function getState(): BlogPostState\
  \ {\n      return $this->state;\n   }\n}\n```\n\n`Enum` 类型有许多用途，当布尔值不再足够时，它为你提供了一个非常简单的存储机制。\n\
  \n稍微不那么令人的是为函数参数添加了 `nullable` 类型提示，形式是在参数名前面加一个问号（`?`）。这允许你在定义函数时指示哪些参数可以接受 `null`\
  \ 值。通常，它在函数式代码中不会出现，因为它允许 `null` 的存在。\n\n```\nfunction example(?string $param) {\n\
  \    return $param;\n}\n```\n\n\n\n\n泛型（Generics）为 PHP 的姊妹语言 Hack 提供了一种实用的类型处理方法。它们通过接受任何类型（如标量类型（`int`、`string`\
  \ 等）、数组和类）来实现这一操作。一旦在 `Generic` 实例上设置了类型，就只能向该 `Generic` 中添加相同指定类型的内容。因此，如果创建了一个泛型并赋值为了一个\
  \ `string` 类型的值，那么它将推断出整个泛型为 `string` 类型，并禁止添加其他类型的值。\n\n这听起来不错，但仅凭这一点并不能提供全面的帮助。因此，你还可以向类定义中添加方法来处理对其内容的操作。这可能包括诸如\
  \ `map()` 之类的操作，它可以协助对值列表执行方法。泛型还允许你编写能够以通用方式操作数据结构的函数。这意味着你可以编写跨类型通用的代码，并避免为每种不同的类型重复编写形式化代码。\n\
  \n你可以通过一组 PHP 对象、`instanceof` 检查和值的类型转换来实现类似的效果。然而，语言层面对该特性的支持让你专注于业务问题，而不是尝试实现自己的类型系统。\n\
  \n### 列表 5.3\n\n```\nclass IO<T> {\n   private T $data;\n\n   public function __construct(T\
  \ $value) {\n      $this->data = $value;\n   }\n\n   public function toScreen()\
  \ {\n      echo (string) $this->data;\n   }\n\n   public function write() {\n  \
  \    file_put_contents('/tmp/io_out', $this->data);\n   }\n}\n```\n\n在列表 5.3 中，类型\
  \ `T` 用于表示当变量传入它时将推断出的类型。你可以几乎将其看作一种变量类型——它不是在定义点指定的，而是在第一次调用时指定的。如果你传入一个 `string`，解析器会将\
  \ `T` 设置为 `string` 类型；否则，当传入一个 `array` 时，`T` 将变为 `array` 类型。\n\n`Generic` 可以包含任何值，但一旦选择了类型（`T`），它就会提供相应的工具帮助你确保只有初始提供的类型是允许添加的。\n\
  \n```\n\n```\n\n观察上面的代码，变量 `$a` 将是 `IO` 的一个实例，其 `T` 为 `string`，而 `$b` 的 `T` 为 `int`。这种对\
  \ `T` 的类型推断使得 `Generic` 真正具有泛性。\n\n另一个实用的实现是创建一个更通用的列表处理类，无论列表包含什么类型的元素，都可以用于对列表执行常用操作。\n\
  \n### 列表 5.4\n\n```\nclass MappableList<T> {\n   public array<int, T> $data = [];\n\
  \n   public function __construct(\n      ?array<int, T> $initial_value = null\n\
  \   ) {\n      if($initial_value) {\n         $this->data = $initial_value;\n  \
  \    }\n   }\n\n   public function add(T $value) {\n      $this->data[] = $value;\n\
  \   }\n\n   public function map(callable $function) {\n      return new MappableList(\n\
  \         array_map($function, $this->data)\n         );\n   }\n}\n```\n\n列表 5.4\
  \ 故意设计得更复杂，并使用了更多的 Hack 类型检查，指定了 `array` 的键类型和值类型。在这种情况下，当第一个值被赋值给 `Generic` 时，数组值的类型将采用\
  \ `T` 的类型。因此，如果赋值了一个 `string` 类型的值，那么 `T` 和数组的值都将被设置为 `string` 类型。\n\n`MappableList`\
  \ 还有一个构造函数，它不仅在参数上指定了数组类型，前面还加上了可空符号 `?`。这允许使用默认值 `null` 调用构造函数，或者通过传递正确类型的数组作为\
  \ `$data` 类属性的初始值。\n\n这使得 `map()` 方法的封装返回值变得方便，因此每当调用 `map` 时，它会将函数映射的结果返回在一个整洁封装的\
  \ `MappableList` 实例中。\n\n### 列表 5.5\n\n```php\n$c = new MappableList;\n$c->add('Sawubona');\n\
  $c->add('Ibizo');\n$c->add('Inja');\n\n$xs = $c->map(function($item) {\n   return\
  \ strtoupper($item);\n});\n\n// MappableList (\n//   'SAWUBONA',\n//   'IBIZO',\n\
  //   'INJA',\n// )\n```\n\n实现 `Generic` 会设置 `T` 的类型，在列表 5.4 中，我们非常仔细地在处处将 `T` 指定为所需的类型。当我们从列表\
  \ 5.5 中调用它时，必须确保遵守初始设置的类型（在此例中为 `string`），后续所有的值必须是相同类型。\n\n从列表 5.5 中调用的映射是一个简单的匿名函数，用于将列表中的所有值转换为大写字母。`MappableList`\
  \ 类随后会将这个简单的 `array` 列表封装成它自己的实例，返回一个包含所有大写字母值的新 `MappableList`。\n\n### 形状 (Shapes)\n\
  \nShapes 允许在 Hack 中使用结构化数据类型，可以在其中描述记录并在之后依赖它们的“形状”。这可以是查询结果、地图坐标或其他形式的结构化数据。\n\n\
  要声明一个 `Shape`，你必须包含类型定义。\n\n```php\n$bp = shape(\n   'id' => 10,\n   'date' => '2015-05-08',\n\
  \   'tags' => [\n      'functional',\n      'programming',\n      'book',\n   ],\n\
  \   'title' => 'Blog post',\n   'content' => 'The content of blog post goes here.',\n\
  );\nprint $bp['id']; // 10\n```\n\nShapes 是一种简单且实用的方式，用于表示、存储和查询结构化数据。结构可以对其进行类型检查和处理。\n\
  \n### Lambda 表达式\n\n匿名函数在 Hack 中引入 Lambda 表达式后有了更优雅的语法。与 PHP 的闭包类似，Lambda 表达式可以从周围的环境获取上下文。实际上，Hack\
  \ 隐式地完成了这一点以减少代码量。这有效地消除了 PHP 中的 `use` 关键字，并改为自动引入环境变量。唯一的例外是按引用输入，这仍然需要在 `use`\
  \ 子句中指定并在前面加上 `&`。\n\n这是减少冗余的一种方法，但 Hack 还有另一个技巧，即使用 `==>` 快捷语法来定义 Lambda 函数。这就是\
  \ Lambda 表达式的精髓。\n\n这种示例最好通过对比相应的 PHP 代码来描述。不过，首先我们需要定义一个带有一个参数的简单辅助函数。\n\n```php\n\
  function applyFunc($arg, $func) {\n   return $func($arg);\n}\n```\n\n在 PHP 中我们随后会这样调用它，在这种情况下我们向它传递了一个匿名函数。\n\
  \n在 Hack 中，我们可以重用之前的 `apply()` 函数以更简单更短的方式编写它：\n\n```php\n$add_one = $v ==> $v +\
  \ 1;\n$y = applyFunc(1, $add_one); // 2\n```\n\n\n\nPHP 的 lambda 表达式和闭包非常有用，但与该语言的其他部分一样，其语法非常冗长。Hack\
  \ 带来了一种优美且简洁的语法，同时仍然很像 PHP。省去对 `use` 子句的需求是语法变得整洁的另一种简单方法。在维护方面，较少的字符数通常是好事，因为需要阅读的内容更少，因此在脑中构建的负担也小。我们在脑海中创建的这种执行映射具有很高的认知负载，而这些表达式有助于降低这种负载。\n\
  \n就像 PHP 采纳 Hack 其他特性一样，如果能看到关于引入带有隐式作用域的 lambda 表达式的 RFC 将太棒了。考虑到这种特性的语言演变性质，遗憾的是，它似乎无法通过投票阶段。\n\
  \n## 5.3 特殊（魔法）属性\n\nHack 中没有与这些特殊关键字对应的 PHP 等价，这些关键字为类提供了专门的功能。它们以类似于 PHP 的 `__toString()`\
  \ 或 `__construct()` 方法的方式为类添加了自定义魔力，但它们是以注解（annotations）的形式存在的。\n\n你可以使用特殊的 `<<__Memoize>>`\
  \ 属性轻松地缓存函数结果，该属性可以添加到函数和类方法上。在后续代码中，你可以看到对返回唯一字符串的函数的两次调用，在直接函数定义上方添加 memoize 属性时会产生相同的结果——通常情况下\
  \ `$a` 和 `$b` 是不同的。\n\n```\n<<__Memoize>>\nfunction getUniqueString(): string {\n\
  \   return uniqid();\n}\n$a = getUniqueString();\n$b = getUniqueString();\n$c =\
  \ ($a === $b); // true\n```\n\n这是一个非常简单的注解，可以添加到任何方法或函数上方，立即赋予其缓存属性，而无需自己自己完成任何实现。不过，关于通过此注解传递给函数或方法的参数，有几点需要注意。只有以下类型可以作为参数传递：`null`、`bool`、`int`、`float`、`string`、`IMemoizeParam`\
  \ 的实现以及包含上述任何类型的数组。此外，参数不能通过引用传递，并且在函数的括号内定义，而不是通过变长参数（varargs）访问。\n\n趣味性较低的是 `<<__Override>>`\
  \ 和 `<<__ConsistentConstruct>>` 属性，它们关系到 Hack 中的类定义。第一个实现在任何类方法之前，其目的是确保你的类与其父类之间的一致性。如果父类不包含相同方法的具体实现，将触发错误。这的效果是，当你尝试从父类中重构某个方法时，它让你知道子类重写了该方法。\n\
  \n如果将 `<<__ConsistentConstruct>>` 添加到类定义上方，它的效果是告诉 Hack 解析器检查所有扩展它的类是否都使用了兼容的 `__construct()`\
  \ 方法定义。有时这可能没用，你可能希望通过在 `__construct()` 方法上方添加 `<<UNSAFE_Construct>>` 来防止它应用于你正在编写的子类。此时\
  \ Hack 将忽略它，并依赖于编写它的程序员已经考虑了一致性这一事实！\n\n如果你想一起使用这些特殊属性，可以使用逗号将它们隔开，在角括号之间形成一个列表，如下所示：\n\
  \n```\n\n```\n\n```\n\n## 5.4 结论\n\nHack 相比于 PHP 提供了许多很棒的额外功能和一些比 PHP 改进的语法——这更多的是使用\
  \ HHVM 的动力，而不是让 PHP 脚本运行得更快。我在本章中涵盖的大部分都是使 Hack 脱颖而出的特性。在大多数情况下，它实现了 PHP。这意味着尽管在这里没有记录，你仍然可以获得变数量参数、SPL\
  \ 以及其他 PHP 语言函数的功能。这些只是以与 PHP 相同的方式和语法实现的。\n\n当然，我还简略了 Hack 的其他一些特性，你可能在面向对象的代码中发现它们有用，或者在某些情况下觉得包含在这里太像是在绕远路了。这些特性在\
  \ Hack 手册中以及在各种 Facebook 博客文章中都有详尽的文档，如果你想深入研究该语言的话。\n\n# 6 模式\n\n> “单子（Monads）是引导你走过顺利路径的返回类型。”\n\
  > \n\n> –Erik Meijer（计算机科学家，@headinthebox）\n\n在函数式编程中，存在重复的模式，就像任何其他编程风格一样。这实际上是不熟悉代码的人对函数式编程感兴趣的主要来源，因为它带来了简洁的代码。\n\
  \n软件模式通常是公认的完成实践，用于以通用可识别和理解的方式完成相似的任务。就像面向对象编程一样，函数式代码也有许多你将经常看到的模式。这些模式有助于创建更具组合性的函数，允许在不同的问题领域中实现更大的重用。不仅如此，它们还可以帮助实现你可能编写的任何函数库的人使你的\
  \ API 更加一致。如果遵循了模式，那么实现者在从代码中调用该模式时就可以准确地预判结果。\n\n在大多数函数式语言中，模式可以简单快速地在大量类型中复制，但在\
  \ PHP 中，我们需要自己自己基础工作。展望数学世界，模式比我们在这里涵盖的要得多。某些模式借用了 Haskell 编程语言中实现的想法，考虑到 PHP 较弱的类型系统，产生这些模式可能有些困难。然而，这是可能的，而且它们有助于提供产生复用代码的极佳方法。\n\
  \n这并不意味着我们会避免实现困难的模式，因为我们都讨论了应用算子（applicatives）和单子（monads）。有些人可能会认为只有 Haskell 程序员才对这些形式化方法感兴趣，但这种想法是目光短浅的。在已经非常熟悉的语言中学习一个模式比学习一个完全陌生的模式要容易。而且，这些模式在\
  \ PHP 代码中实际上非常有用，正如我们在书中进一步探索的那样。\n\n可重用模式是极好的，也是我们共同追求的。良好的函数式代码更上一层楼，尝试将所有操作抽象为可重用且不可变的代码。为此，我们现在将探索函数式代码中的一些常见和特殊模式。\n\
