  \ `compose()` 函数。\n\n```\n```\n```\n```\n\n如你所见，返回值符合预期——与你调用 `echo $base64($strip($str))`\
  \ 的结果是一样的。假设我们不知道这一点，并且好奇知道哪个函数是先应用到 `$str` 上的。为了证明我们的假设，我们可以使用日志来确定函数的调用顺序。\n\n\
  在 PHP 中你通常会做的第一件事是在每个函数中添加将消息打印到屏幕的陈句，但正如我之前提到的，那是作弊且破坏了纯函数！对于这个例子，请你从脑海中抹掉那个知识。相反，我们将日志字符串作为函数的返回值添加，参见列表\
  \ 6.12。\n\n**列表 6.12**\n\n```\n```\n```\n```\n\n现在我们已经设置了日志记录，可以再次组合函数并尝试相同的字符串操作。\n\
