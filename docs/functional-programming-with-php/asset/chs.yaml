  \n## 7.3 PHP 中的领域特定语言\n\n考虑到 PHP 语言相对不灵活的本质，这似乎是一个不太可能的应用。例如，你不能定义自己的关键字，也没有中缀运算符。在此基础上，还没有好用的组合器（combinators）！\n\
  \n不过，可以用 PHP 函数表达简单的语言，正如这个实现 HTML 的示例所展示的。选择 HTML 作为 DSL（领域特定语言）是因为这些规则对所有 PHP\
  \ 开发者都是熟悉的。为了保持简单的主题，此示例将仅实现 HTML 的一小部分集。它将足够演示概念并让你看到如何将函数映射到不同的 HTML 要求。\n\n为了让变得方便，你会注意到此示例代码在适当的地方使用了对象。这些对象几乎是以近函数式的风格实现的，没有全局状态更改，并且并没有真正被视为面向对象意义上的类。也就是说，这些对象仅作为类型集合被消费。这允许我们的代码对传递的内容做出假设，而不是像传递数组时那样。这是一种模拟非常基础类型系统的方法，这是许多函数式编程语言的特征。\n\
  \n函数式编程并不是面向对象代码的宿敌，但它确实提供了一个极吸引力的替代方案。编写良好的面向对象代码看起来几乎是函数的，因为它们共享一些基本概念。保持专注、可重用并具有易于实现的接口。\n\
  \n现在进入示例本身，HTML 是我们希望转换为 PHP 语言的领域。\n\n\n\n在编写任何代码之前，规划 API 完成后的样子会很有帮助。实现此点的一种简单方法是列出你打算创建的命名空间。对于\
  \ HTML 来说，这可能像如下的命名空间列表：\n\n* `\\FpPhp\\Utils`\n* `\\FpPhp\\Html\\Html4`\n* `\\\
  FpPhp\\Html\\Html5`\n\n然后在每个命名空间下面，列出可能需要的函数就会变得更容易。在当前的示例中，这可能像下面的命名空间分组列表：\n\n\
