  \ GitHub 上的文档。\n\nPromises 是一种组织回调函数并防止它们失控的非常方便的方法。有一些实用的代码片段可以更容易在 PHP 代码中处理异步操作。PHP\
  \ 并不以事件驱动著称，或者说以异步操作著称。大多数标准库调用并不是这样运行的——这让解析器串行处理任务，直到任务完成。在一些库的帮助下，可以用一种优雅的方式将这种力量引入\
  \ PHP。\n\nPromises 提供了一种缓解事件驱动编程可能带来的“回调地狱”的方法。\n\n## 8.6 总结演示\n\n事件驱动编程在 PHP 中不仅是可能的，而且得益于反应器模式和\
  \ ReactPHP，它是很容易实现的。正如我们看到的，事件驱动编程可能会导致回调地狱，但有很多你可以采用的库和模式来避免这种情况。就像函数式编程一样，我们在这里回顾的大多数事件驱动编程都是实验性的。玩起来很有趣，但很少出现在生产环境中。\n\
  \n在 Node.js（ReactPHP 以前被称为 NodePHP）和 Python 的 Twisted 中，至少有两个更受欢迎的替代方案。这两者在生产环境中的时间都比\
  \ PHP 的事件库多得多。这归因于 PHP 关注 Web 服务器的短运行进程。当然，它可以使用像 `PHPDaemon` 这样的库作为守护进程运行。\n\n\
  这一切使得它成为 PHP 编程中一个非常的小众领域，但正如 Igor Wiedler（ReactPHP 的创建者）所说：“他们拥有的任何我们都可以偷！”\n\n\
