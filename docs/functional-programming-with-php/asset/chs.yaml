  \n## 6.3 处理你的 NULL 值\n\nPHP 中有很多函数——我确信在你处理的遗留用户代码中还有更多——在找不到记录时（例如）会返回 `NULL`。当你接着调用该函数时，你无法确定它会返回你预期的记录还是一个空值，这违背了“函数应该始终返回相同类型以便以相同方式处理”的原则。\n\
