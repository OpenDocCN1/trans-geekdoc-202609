  \ Hack 为 PHP 添加的少量语法糖。我们。\n\n# 2 什么是函数式编程？\n\n> “函数式编程是指你的整个程序都是由其他透明表达式组成的。没有副作用。没有可变性。”\n\
  \n> —Rúnar Bjarnason (函数式程序员)\n\n很难对函数式编程给出定义，因为所有的函数式语言都不同，加上程序员们对于什么是函数式语言的意见不一，这产生了一个难题。为了引起混淆，许多语言都有函数式元素或原语。\n\
  \n虽然很危险，我将尝试对一个核心原则进行非常简化的解释。以函数式方式编程本质上是不进行任何赋值的。在那里，我说了！当然，这还有更多，但对于我们这些命令式背景的人来说，这是最简单也最令人惊讶的陈述。\n\
  \n这是对函数式方法中移除状态的一种非常简化的隐喻。当然，它对你目前的编程实践也是一种挑战。随着你对函数式编程理解的增长，你将开始理解构成函数式代码更全面的描述。\n\
  \n首先，定义什么是命令式编程是非常重要的，以便有一个良好的基础。命令式编程通常被认为是函数式编程的对立面，允许我们从函数式编程的描述中消除它。它是一种程序员一步步告诉计算机应该做什么来完成计算或程序的风格。\n\
  \n你可能认为这仅适用于过程 PHP（不使用 PHP 对象构造构造和函数的代码），但你是错误的。Haskell 的 Simon Peyton Jones 将命令式编程描述为\n\
  \n“…一个步骤序列。每一行都说做这个，然后做那个，做这个。当你调用一个方法时通常没有结果……因为调用它的唯一理由是对世界产生影响。改变状态。”\n\n他指出命令式编程的一个非常值得注意的属性——隐藏的状态变化。这意味着如果你在命令式程序中调用一个方法，你无法确定它只是根据你的参数计算结果，还是会调整程序的状态。由于函数式编程追求纯性，这些状态的变化必须被消除。\n\
  \n许多人根据这种无状态变化的属性来描述函数式编程。其中一人就是 Erik Meijer，他热爱 Haskell，并参与过 C# 编程语言等语言。他将函数式编程描述为\n\
  \n\n\n\n\n> “…关于使用数学函数的编程。每当你向它提供相同的参数，它就会返回相同的结果。每当我执行它时，它都会给我相同的结果。”\n\n一旦你接触过函数，这种对函数式编程的描述将变得更有意义，因为它提到了“引用透明性”（referential\
  \ transparency），这在书中讨论完基础概念后会有更深入的探讨。\n\n那么，到底如何用函数式风格完成工作呢？难道没有了赋值语句，一切都不可能吗？你如何在程序中传递值呢？\n\
  \n答案不可思地简单；值可以作为参数和返回值在函数之间传递。进一步扩展这个想法，我们可以拥有返回函数的函数，或者接受函数作为参数的函数。你思考得越多，它就变得越强大。\n\
  \n这些函数的组合简洁、清晰地表达了程序的意图。不可变结构有助于确保副作用不会渗透到函数式程序中。在这里我指的是避免变量赋值，这是命令式语言的基础基础。\n\n\
  谦逊的函数比大多数面向对象的 PHP 程序员所认为的要有用得多，也强大得多。\n\n## 2.1 让我们来看一些代码\n\n为了消除你脸上的不可置信表情；这里有一个简单的命令式示例，用于计算从一到十的所有整数之和：\n\
