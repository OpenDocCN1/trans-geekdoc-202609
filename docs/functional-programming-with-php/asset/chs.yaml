  \n## 6.9 应用子\n\n现在我们已经掌握了函子的精髓，可以转向一种稍微复杂的类型，称为应用子（applicative）。函子是将函数应用于封装的值，而应用子是将封装的函数应用于封装的值上。这听起来可能很疯狂，但实际上相对简单。\n\
  \n类似于函子，我们需要编写一些代码在将函数应用于值之前将其解包。当然，没有特殊的 PHP 语法来处理这些，因此我们需要一些样板代码来达到相同的效果。再次，让我们从实现应用子的接口开始：\n\
