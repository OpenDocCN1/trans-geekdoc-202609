  \n以类似于之前 PHP 手册示例的方式进行推导，我们得到了一个类似的列表。\n\n\n\n\n1. `def` 等同于 PHP 的 `function` 关键字。\n\
  2. `substr` 是我们为函数声明的名称。\n3. 接下来，函数参数在括号内被声明为用逗号分隔的列表。\n4. 第一个参数是 `string`，被声明类型为\
  \ `String`。在 Scala 中，类型紧跟在参数名后面并用冒号分隔——`string: String`。\n5. `start` 是我们给第二个函数参数的名称，它被声明为类型\
  \ `Int`（接受一个整数）。因此 `start: Int` 意味着我们期望一个 `Int` 类型的参数传入函数。该参数在函数内部将通认为 `start`。\n\
  6. 最后一个参数是 `length`，它的定义与 `start` 相同，请参阅第 5 步获取更详细的描述。\n7. 在括号之后，冒号后面紧接着写了另一个类型。在这种情况下，它是\
  \ `String`，因为该函数将返回一个字符串，就像它所模拟的原始 PHP 函数一样。\n\n函数定义的其余部分只是 `substr()` 内部工作机制的实现，在本书中无需进一步研究。\n\
