  \ `PHP 7`。曾经存在过一个 `PHP 6`，但它从未问世，也没有合并到 `PHP` 主分支。由于几个原因它被取消了，但一些功能被回移植（backported）到了\
  \ `PHP 5.x` 分支中。不过，在取消之前，许多公司为它编写了书籍、文章和博客帖子。你仍然可以通过你喜欢的搜索引擎访问这些内容！\n\n`PHP` 团队认为将现在发布的版本命名为\
  \ PHP 6 会太困惑，所有旧资源都会出现且是不准确的。因此该版本号成为了历史。\n\n语言增加了许多新功能，以及一些错误修复和速度增强。`PHP` 语言团队的许多成员付出了巨大努力。这成了\
  \ `PHP` 以来最重大的发布。我在这里重点介绍一些新功能，它们在编写函数式 `PHP` 代码时非常有用。不必说，如果我漏掉了你最喜欢的，我深表歉意。深表歉意。\n\
  \n### 量类型提示 (Scalar Type Hinting)\n\n\n\n\n\n从 PHP 7 开始，一项新的 RFC 被并入语言核心，用以提供标量类型提示（scalar\
  \ type hinting）。这是该语言向正确方向迈出的大一步，因此当它在 RFC 投票过程中幸存并克服了巨大的反对意见时，这是一个极好的消息。PHP 开发者们已经期待这样的功能多年了，尽管之前尝试过，但它从未进入过该语言。\n\
  \n这一新功能集涵盖了 `int`、`float`、`string` 和 `bool` 类型，允许它们像我们已经看到过的类、接口、`array` 和 `callable`\
  \ 一样被使用。一个实现了一半的语言核心特性终于朝着完成方向迈进。\n\n除了这些类型提示外，你还可以指定想要开启严格类型检查（strict type checking）。如果激活，当将错误的类型作为参数传递给函数时，解析器将抛出\
  \ `E_RECOVERABLE_ERROR`。正如你预期的，我建议你始终在开启严格类型的情况下开发，以帮助你创建更健壮的代码。只需在文件顶部包含以下内容即可激活：\n\
  \n```\n\n```\n\n```\n\n该文件中所有的函数调用现在都将以严格的方式处理。\n\n默认情况下，所有 PHP 文件都以弱类型检查模式解析，因此你必须在每个文件顶部声明此项。也许在\
  \ IDE 中创建一个创建新文件时的宏来自动添加此声明，可以防止你忘记添加这个至关重要的元素。\n\n有了声明后，PHP 解析器将通过对类型不匹配和违规行为发出警告来帮助你维护代码。这与\
  \ PHP 传统的尽可能将所有值自动合并为正确类型的做法背道而驰。虽然这种做法采取了“不计代价运行”的方法，但它意味着编写得糟糕的代码仍然运行，导致简单的错误无法被检测到。\n\
  \n声明函数时可以对其参数使用类型提示，导致 PHP 解析器检查传递给函数的值类型。在严格模式下，如果类型不匹配，将抛出错误。在更宽松的模式下，PHP 引擎会将参数强制转换为所需的类型。在\
  \ PHP 之前的版本中，你必须使用 `gettype` 或类似的方法手动完成此操作。\n\n```\n\n```\n\n```\n\n调用函数时，不小心反转参数顺序轻而易举，因此这种简单的解析器错误检查有助于发现这类问题。显然，如果两个参数都是相同类型，那么这对你将没有帮助！不过，你可以看到这种检查可以帮助你避免这类错误。\n\
  \n### 返回类型声明 (Return Type Declarations)\n\nPHP 7 中还合并了另一项 RFC，称为返回类型声明（return type\
  \ declarations），它与标量类型提示 RFC 完美互补。它允许你声明函数应该返回的类型。解析器并不要求在函数返回值上定义类型，但与标量类型提示中的严格声明一样，我建议这样做是一个良好的习惯。\n\
  \n要指定返回类型，你只需在函数的右括号后添加一个冒号，然后包含预期的类型关键字，例如 `int` 或 `array`。\n\n你也可以像函数参数一样，将你自己编写的类或接口声明为返回类型。\n\
  \n```\n\n```\n\n```\n\n目前一个函数还没有多个返回类型。这意味着你不能说，例如成功时返回 `int` 或失败时返回 `null`——它必须二选一。再次，就像标量类型提示一样，如果发生类型不匹配，将触发\
  \ `E_RECOVERABLE_ERROR`。\n\n这为 PHP 带来了更强大的类型检查，并减少了错误。它也让代码在你回来看时更容易在脑海中进行推理和组装。最后，IDE\
  \ 和其他工具在检查你编写的代码时可以变得更智能。\n\n在可能的情况下，确保为类型提示声明严格模式，并确保你包含了返回类型声明。这将有助于确保你享受到这些 PHP\
  \ 7 特性的处。虽然也有一些局限性，但如果你编写良好的代码，就不会遇到它们。利用它的优点，你将比昨天更快乐的开发者。\n\n在列表 10.1 中，我包含了一些如何极佳使用这些特性的示例。\n\
