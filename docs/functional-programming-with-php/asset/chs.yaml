  \ Haskell 或 Scala，那么拥有《Hyperpolyglot》是值得的。\n\n## 0.2 使用 UTF-8 省号\n\n在本书介绍过程中，引入了一个使用三个连续点作为函数的项目：React/Partial\n\
  \n注意：React/Partial 使用下方的 Unicode 字符作为占位符。它不应与 PHP 自身的用于变变函数的 `...` 语法混淆。\n\n对于较小的用法，最简单的方法直接从\
  \ UTF-8 表中复制并粘贴该字符，例如 http://www.fileformat.info/info/char/2026/index.htm。\n\n如果你足够幸运地运行\
  \ MacOS 版本，则可以使用快捷键。通过同时按住 `Option` 键和分号，你可以在 QWERTY 键盘上获得该字符。对于使用 QWERT 键盘的人，是\
  \ `Option` 和点/句号 (`.`)。在 Mac 上，`Option` 键也称为 `Alt`。\n\n在 Linux 上也有“快捷键”，但坦率说，一旦你见过它，我同意复制粘贴看起来更有吸引力。按住\
  \ `Ctrl` + `Shift` + `u` 进入 Unicode 模式，然后输入 `2`、`0`、`6` 并回车。有人报告按 `Alt` 和点/句号可以在\
  \ Linux 中生成省号，但对我来说从未正常工作过。\n\n遗憾的是，Windows 也深受困扰，你必须按住 `Alt` 进入 Unicode 模式，然后在数字键盘上按下\
  \ `0`、`1`、`3` 然后松开 `Alt` 键。如果你在没有数字键盘的笔记本电脑上，我不确定该怎么办！\n\n如果你想要一个简单的复制粘贴源，也可以制作像\
  \ http://www.functionalphp.com/utf8 这样的简单页面。省号字符在 HTML 中编码为 `&hellip;` 或 `&#x2026;`。\n\
  \n我倾向于使用 Vim 作为我的文本编辑器，虽然默认没有快捷键（为什么会有呢？），但它是高度可配置的。你可以使用 `imap` 指令在 Vim 中定义一个新键位映射。对于省号，我们可以定义一个\
  \ `Ctrl` + `F5` 的简单快捷键——记住你需要从某处复制并粘贴 UTF-8 省号字符以插入到 `imap` 指令中。\n\n```\n:imap <C-F5>\
  \ …\n```\n\n现在在编辑器的插入模式下，只需同时按住 `Control` 和 `F5` 键，省号就会插入到光标所在处。为了让此键绑定始终可用，你可以将其添加到\
  \ `.vimrc` 中：\n\n```\nimap <C-F5> …\n```\n\n\n\n\n* `functional-php` — [`github.com/lstrojny/functional-php`](https://github.com/lstrojny/functional-php)\n\
