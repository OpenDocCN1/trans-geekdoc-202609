- "# PHP 函数式编程\n\n\n\n![](img/cover.jpg)\n\n\n\n# 献辞\n\n献 Marion、Damien 和 Ariana。\n\
  \n# 关于作者\n\nSimon Holywell 是澳大利亚 Aurion ([http://aurion.com)) 的高级工程师，并对摩托车充满热情。他曾涉足\
  \ Python、Scala、JavaScript。他是 SQLStyle、HHVM 以及 MySQL 的作者。\n\n博客：`https://www.simonholywell.com`\n\
  \nTwitter：`@Treffnon`\n\n# 致谢\n\n> “函数式编程近年来变得越来越流行，因为它促进了安全、简洁且优雅的代码产生。”\n>\n>\
  \ —Martin Odersky（计算机科学家，Scala 语言作者）\n\n许多支持的人参与了本书的制作，我想感谢他们的敏锐见解。他们帮助我将一个想法变成一本成熟的书籍。\n\
  \n特别感谢 Beth Tucker，她从早期阶段就起了至关重要的作用。\n\n感谢那些帮助我构思想法并评审初稿的人——特别是 Craig Bendell 和\
  \ Jamie Matthews。\n\n感谢技术评审人员 Oscar Merida 和 Koen van Urk，排版和图表制作 Kevin Bruce、Eli\
  \ White 以及 Lori Pannier 的贡献。\n\n\n我构思了书封面的概念，Kevin Bruce 将其转化为你所看到的简洁设计。但这到底意味着什么呢？\n\
  \n长期以来，PHP 一直和大象标志联系在一起。这个标志最初由 Vincent Pontier（一位来自法国的设计师）设计，被很多人用来 PHP 编程语言。一些为人知的用法包括毛绒玩具以及老牌\
  \ PHP Classes 网站的标志。\n\n1998 年，当一位朋友向 Vincent 介绍 PHP 的可能性时，他在纸上随手画了 PHP 字母。转动纸张，发现这些字母似乎形成了一个大象的抽象轮廓。眯起眼睛，你可能也能看到。\n\
  \n后来他制作了一个粘土模型作为毛绒玩具的基础，并将其命名为 elephpant（注意中间多了一个 P）。有关 elephpant 创作的更多信息，你可以查看\
  \ Khayrattee Wasseem 在他的网站 7php.com 上对 Vincent 的采访。\n\n为了展示本书的函数式基础，大象被包含在括号内。左、右括号是函数的简写。\n\
  \n因此，实际上，这张封面图是一个函数性大象。\n\n如果你对毛绒玩具的存在产生了兴趣，你可以直接从原始设计师那里购买。\n\n\n\n\n\n值得注意的是，这并不是\
  \ `PHP` 的官方标志，实际上 `Postgresql` 也使用了象鼻（pachyderm）作为自己的标志，尽管其设计角度不同。关于采用这只“大象大象”（elephpant），曾有过许多讨论，根据网上的传闻，Rasmus\
  \ Lerdof 过去非常喜欢这个主意。它甚至曾出现在 `php.net` 标志下载页面上。\n\n\n# 1 引言\n\n> “陷入了如此令人惊叹的泥潭和困扰中，我感到非常沮丧……”\n\
  \n> — 埃达·洛芙莱斯（数学家，1815–1852）在与查尔斯·巴贝奇（可编程计算机概念的创造者，1791–1871）讨论可变性时。\n\n在过去的二十多年里，函数式编程经历了缓慢而稳健的增长。这导致许多语言采纳了函数式特性，包括饱受诟言的\
  \ `PHP`。随着计算机硬件和语言支持的改进，开始学习函数式编程的基础是非常关重要的。虽然这种风格的编程确实需要思维的转变，但你会发现，对它的理解对你的面向对象代码也有积极影响。\n\
  \n让我们开始探索 `PHP` 语言函数式方面的之旅吧。\n\n## 1.1 前提条件\n\n你必须能够访问 `PHP` 5.4 或更高版本，并且拥有相关机器的命令行访问权限非常有益。在编写时，我使用了一台基于\
  \ Debian 的机器，建议使用类似的 POSIX 计算机，尽管不是强制要求的。\n\n在学习过程中你可以做的最好的事情之一是在机器上安装一个好用的 REPL，因为这将使你在跟随学习时实验代码变得容易得多。`REPL`\
  \ 是“读取-评估-打印循环”（read-eval-print loop）的，它基本上是最常用于命令行编程环境。它允许你轻松尝试算法，而无需编辑器甚至不需要包含代码的文件。向其中输入代码，按回车键，你的代码就会执行并将结果打印在屏幕上。\n\
  \n这里有很多很好的 REPL，我在 `PsySH` 上获得过成功。\n\n如果你不想在机器上安装 `REPL`，可以使用在线服务 `3V4L`。\n\n随着我们深入学习\
  \ `PHP` 中的更多函数式编程，我将建议一些实用的 `PHP` 库和扩展。这些都通过 `Composer` 安装。\n\n不言而喻，这本书并不是为初级 `PHP`\
  \ 开发者准备的，并假设他们具备某些面向对象的编程经验。尽管如此，这无疑是尽可能温和的介绍，代表了 `PHP` 函数式编程的入门指南。\n\n## 1.2 要求\n\
