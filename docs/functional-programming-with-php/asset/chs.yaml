  \ `$index` 加 1，并将当前数组元素连接到字符串 `$result` 的末尾。当遇到数组结尾时，它将返回 `$result` 的值，递归结束。\n\n\
  你永远不会这样连接字符串，但它作为了在没有变量赋值语句的情况下执行递归“循环”的简单说明。\n\n### 尾递归（Tail Call Recursion）\n\n\
  PHP 中的大多数递归函数不是用尾递归编写的，但在某些情况下它是更优的。\n\n递归会导致编译器等待被调用函数的结果，然后才能返回自己的结果。相反，尾递归允许编译器进行优化以提高速度并减少资源消耗。遗憾的是，PHP\
  \ 并没有利用这一点，但它仍然是一个值得掌握的技巧，因为在某些情况下它可以让代码更清晰。\n\n这是一个展示两种风格的简单示例，首先是常见的递归形式：\n\n\
