  \ `Only` monad。\n\n### 三条 Monadic 法则\n\n首先，在新封装的值（`pack()`）上执行 `map()` 产生的结果必须与直接将值传递给你所应用的函数的结果。为了更清楚一点，假设我们有两个函数\
