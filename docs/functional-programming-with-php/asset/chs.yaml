  5. [PHP Simple Daemon](http://github.com/shaneharter/PHP-Daemon)↩\n\n# 9 PHP 中函数式编程的风险\n\
  \n> “‘‘我不会利用函数式编程，因为我的同事会抱怨’这种想法是如此荒谬且愤俗的。”\n>\n> –Tony Morris（函数式程序员，@dibblego）\n\
  \nPHP 不是函数式语言，因此这更多是我们需要必须克服的语法糖缺失。作为语言，PHP 没有演进到支持函数，而是选择将开发资源集中在改进面向对象的能力上。我并不是在批评这一点；在资源有限的情况下，关注影响最大的方面是非常重要的。照顾少数\
  \ PHP 开发者而忽视大多数将阻碍该语言的持续采用，并损害当前用户的利益。\n\n尽管如此，当然，当你使用的语言无法满足你想要实现的代码时，是很令人沮丧的。“使用更合适的语言，”你可能会正确地反驳！我会反驳说，有大量的开发者在\
  \ PHP 中极其高效，并希望以函数式风格使用这些技能。更务实地说，由于原因我们必须使用 PHP，例如它是唯一的部署平台、与遗留库集成或老板的要求。\n\n这意味着你需要考虑如何管理你的\
  \ PHP 函数式项目。首先，你将如何布局文件并创建用于代码共享的函数式包？\n\n遗憾的是，PHP 目前没有自动加载函数的机制，在经历了两个相关 PHP RFC\
  \ 的讨论后，这留下了几种选择：\n\n1. 在所有请求的文件中 require/include。\n2. 将函数设置为类文件中的静态方法，然后类似于 `Underscore.php`\
  \ 进行进行自动加载。\n3. 使用我的简单函数，使命名空间的 `use` 语句执行起来更像 import true。虽然它解决了问题，但从根本上说这是一个黑科技，由于使用了\
  \ PHP 分词器双重解析文件，不可避免会减慢你的代码运行。\n\n这不是一个致命问题，但很烦人且值得提及。如果你只是实现一些基本的函数式样式，那么这个问题并不重要，但如果你想共享或重用整个函数库，那么你就面临着这三个糟糕的选择。\n\
  \n\n\n\n\n额外的限制还包括无法在你的 `use` 语句中从命名空间或别名中直接导入一个函数。你可能通过将每个函数放在它自己的命名空间中来绕过第一个问题。然后你就可以使用更窄的命名空间来仅引入那一个函数。\n\
  \n然而，这是一个痛苦的权衡，因为会让调用函数的步骤变得更加繁琐。例如，如果你导入了父命名空间，你需要在每次函数调用之前指定子命名空间：\n\n```\n\n\
  ```\n\n```\n\n但是，它允许你像这样只引入一个函数：\n\n```\n\n```\n\n```\n\n处理不可变数据之所以复杂，是因为 `PHP`\
  \ 原生并不支持它，而且函数式开发者有责任确保他们不会在代码中引入状态更改。曾多次尝试过在 `PHP` 中强制执行不可变数据，但没有一个是特别令人满意的，而且它们都需要基于类的技巧，例如\
