  \n```\n\n```\n\n在这里，我们触及了函数式编程的一个核心概念和优势。我们没有详细详述求和数字所需的步骤，而仅仅描述了在给定一组值时我们想要的结果。\n\
  \n我们还成功地避免了状态跟踪变量（命令式示例中的 `$sum`）的使用，并自动将工作单元拆分为可重用的函数。如果我们在其他地方需要 `range()`，可以轻松重用相同的代码。\n\
  \n相反，在命令式示例中，我们被要求完成所有的苦力工作，例如循环和使用变量赋值维护状态。也许这可以被认为有点像写菜谱，常量是你的配料表，而循环等同于具体的步骤说明。\n\
  \n继续这个关于食物的类比，我们可能会说函数式示例更像是在餐厅点餐，你只需从菜单中选择。尽管，就像一家优秀的披萨店，你总是可以自己添加更多的配料！\n\n正如你可能看到的，函数式编程和设计良好的面向对象代码在某些方面非常相似，它们都追求封装，并将工作单元拆分为更小的、可重用的块。\n\
  \n## 2.2 历史\n\n函数式编程的历史，事实上是整个计算机科学的历史，完全依赖于数学和逻辑领域完成的工作。可以将这些领域知识的集体积累追溯到一些最早记录的哲学家和数学家。\n\
  \n在考虑他们对逻辑理解的贡献时，提到苏格拉底和亚里士多德并不恰当。也就是说，计算的根源可以追溯到公元前 400 年以前。很久后在公元前 200 年中期，阿基米德写下了极早的微积分开端，这些内容后来在名为《阿基米德重写本》（Archimedes\
  \ Palimpsest）的手稿中被发现。它在 13 世纪被重写了宗教文本，因此被人类遗忘。幸运的是，通过 X 射线等各种成像设备，大部分内容已经得到了恢复，但已经太晚了，无法告知我们即将遇到的微积分先驱们。\n\
  \n然而，从函数式的角度来看，有趣的事情始于 1666 年和 1675 年，当时艾萨·牛顿和格特布里德·莱布尼茨（分别）记录了微积分的最早形式。这一数学发现是所有函数式思维的基础，也是整个计算史的重要组成部分。\n\
  \n据推，在两人都不知情的情况下，他们都在同一时间撰写论文。纯属巧合，他们在相似的时间得出了相似的结论。事实上，更有可能是理论基础已经由之前的人士奠定，而条件允许某人迈出逻辑上的下一步。\n\
  \n尽管如此，这段历史仍然存在一些争议，因为牛顿一直在研究微积分，但直到 1693 年才发表。相比之下，莱布尼茨在 1684 年就发表了，并且很可能知道牛顿早期的工作，因为他们都是伦敦皇家学会的成员。\n\
  \n当被要求正式确定谁发明了微积分时，学会表示，虽然莱布尼茨是第一个发表的，但牛顿创造了它。令人不安的是，牛顿当时是伦敦皇家学会的英国，因此会对会对最终决定产生影响。后来，学会还对莱布尼茨提出了抄袭指控。尽管如此，他对数学和微积分的影响是显而易见的。\n\
  \n### 乔治·布尔的故事\n\n乔治·布尔是一位英国数学家和逻辑学家，布尔逻辑（Boolean logic）以此名字命名。他出生于工人家庭，并不是那个时代典型的天才。他通过在参考书库度过长时间自学了数学和逻辑。后来，他成为爱尔兰于科克皇后学院的第一位数学教授。就在那里，他遇到了他的妻子玛丽·埃弗里斯特（乔治·埃弗里斯特的侄女，珠穆玛峰正是以此命名的）。有趣的是，虽然这座山的读音是\
  \ Ever-est，但他们的姓氏实际上是 Eve-rest。\n\n在同一所机构，布尔患了冒并导致了他最终的去世。在去讲座的路上，他被大雨淋透了。在穿着湿衣服做完讲座后，他病了，并得到了妻子的照顾。不幸的是，她信从了当时流行的“对治疗法”理论。为此，当他病在床上时，她向他泼了一桶桶冷水。该理论认为，如果是冷水导致了疾病，那么更多的冷水就能治愈它。他的病情恶化了，并在\
  \ 1864 年 12 月 8 日去世。对于一位开创性的逻辑学家来说，这是一个极其不逻辑的结局！\n\n虽然他不是函数式编程历史的直接贡献者，但他影响了逻辑学的进展，并广泛研究了布尔代数。他自学了微积分，但并不是他的主要研究领域。\n\
  \n在此期间，微积分领域没有发现重大突破。不过逻辑学家们一直在努力，制定系统和证明来描述世界。\n\n哥特洛布·弗雷格将通过定义第一个谓词逻辑来进一步发展微积分。他研究的一些成果今天仍在使用。但他主要关注的是证明数学可以完全由逻辑描述。对他来说遗憾的是，这被证明是错误的。\n\
  \n\n\n\n\n弗格的《基本律五》描述了一种集合逻辑，使得成员关系的定义变得简单。遗憾的是对弗格来说，这让伯特兰·罗塞尔发现了一个不一致之处。这便是广为人知的“罗塞尔悖论”，它描述了一个自指集合：“所有满足\
  \ $x$ 不是 $x$ 成员的 $x$ 组成的集合”。这个绕口令会产生一个既不是自身成员、又是自身成员的集合。这一发现让弗格陷入了困境，使他在处理这个问题时只能用弱的论据和权宜之计反复挣扎。\n\
  \n尽管如此，逻辑学家们继续致力于建立一个描述整个世界的系统。在哲学领域，这导致了具有巨大影响的维也纳学派的形成。聚集在一起的成员讨论了将陈述大致分为两类：一类是无法观察的陈述，另一类是能够观察的陈述。任何形而上学的内容都是无意义的并作为逻辑错误被拒绝，或者被还原为可以通过科学调查证明的经验性陈述。形而上学陈述的一个例子是“一切艺术毫无意义”——它既无法被证明为真，也无法被证明为假。\n\
  \n在此期间，他们雇了一名学生来监督讨论，中断导致形而上学论述的对话。起初他们会大喊“Metaphysik”，但正如鲁道夫·卡纳普后来提到的，他们迅速将其缩短为单字母“M”。随着讨论的深入，“他一直在大喊‘M’，以至于我们听厌了，所以每当我们说一些合法的话时，就把它改成‘no-M’。”换句话说，大多数讨论都会变成形而上学讨论。这让卡纳普意识到，可以存在许多逻辑，而不仅仅是一种通用的逻辑。\n\
  \n### 希尔伯特与哥德尔\n\n大约同一，一位名叫大卫·希尔伯特的德国德国数学家在数学领域正朝着类似的目标努力。在 20 世纪 20 年代后期，他热衷于解决\
  \ `Entscheidungs Problem`（判定问题），试图证明一切都可以用数学逻辑来描述。希尔伯特确定万物都可以被还原为真或假。\n\n相当著名的是，1930\
  \ 年，维也纳学派的一位学生库尔特·哥德尔发表了他的完备定理，这有助于增强希尔伯特的假设。然而，这种局面是短暂的，因为就在第二天，哥德尔也讨论了他的第一个不完备定理，这动摇了希尔伯特断言的根基。现在全世界公认，希尔伯特派是错误的，且存在一些逻辑无法解决或描述的问题。\n\
  \n那么，哥德尔是如何打乱计划的呢？*这个陈述是不可证明的。*很简单！\n\n如果这个陈述可以被证明，那么它就是假的；但它声称自己不可证明，所以它必须是真实的。这个陈述无法被判定，因为它同时是真也是假的。你可能以前听过类似的陈述，被称为“谎言者悖论”。它比哥德尔早至少\
  \ 2000 年，有些来源认为其根源可以追溯到公元前 600 年至公元前 400 年。“一个人说他在撒谎。他说的话是真的的还是假的？”随着时间的推移，这被提炼为“这句话是假的”，并且与哥德尔不完备定理的基础极其相似。尽管如此，这只是外外外行的简化，因为哥德尔证明了这在所有逻辑中都是一个悖论。\n\
  \n### 计算的诞生：丘奇、图灵及其他人\n\n他通过自己设计的逻辑表达式系统，在两个定理中证明了这一点。对于现代人来说，这似乎可能是最简单的悖论，但在当时，哥德尔处于逻辑的最前沿。为了进一步证明\
  \ `Entschiedungs Problem` 的不可判定性，必须定义“有效计算”。这导致了多个系统同时被设计出来。\n\n1932 年，阿隆佐·丘奇以 `lambda\
  \ calculus` 的形式提出了第一个系统。他看到了自己新定义中的潜力并写道：\n\n> “该系统除了作为逻辑使用外，确实可能有其他应用。”\n\n鉴于 `lambda\
  \ calculus` 未来将成为函数式编程的基础，完全可以说他是正确的。通过将 `lambda calculus` 作为基础，丘奇能够提出没有有效计算答案的问题。再次，这种简单性令人惊叹：给定一个\
  \ `lambda expression`，判断它是否会无限循环。这是做不到的！\n\n哥德尔在同一时期也在研究关于递归函数的他自己的逻辑系统。虽然它看起来和哥德尔的形式化不同，但递归是函数式编程的核心组件。\n\
  \n此时，艾兰·图灵也接触到了哥德尔的不可判定问题，并且像哥德尔一样，得出了结论：要研究 `Entschidungs Problem`，必须定义一个有效计算系统。他发明了\
  \ `Turing Machine`，它可以计算所有自然认为可计算的数字。我的意思是人类可以用纸笔计算的数字。\n\n这使得图灵和阿隆佐·丘奇证明了 `lambda\
  \ expressions` 和 `Turing Machines` 在功能上是等价的。图灵与丘奇合作创建了第一个程序 `compute lambda expressions`。他们在\
  \ 1937 年共同发表了一篇名为 `Church-Turing Thesis` 的论文，证明了两种技术是等价且同样合理的。图灵甚至说：“丘奇的演算……允许[图灵]生成可计算函数的机器被更方便的\
  \ λ-定义所取代。”基于此我们可以大胆地说，图灵更喜欢函数式编程！你可能会说这是自取的推测，但他确实对那些形式产生了喜爱。\n\n20 世纪 40 年代，阿隆佐·丘奇致力于一篇描述\
  \ `typed lambda calculus` 及其形式证明的论文。与此同时，图灵独立地进行类似的证明，尽管未发表，但它很好地说明了他也看到了这些技术的价值。\n\
  \n### 四种计算技术\n\n有趣的是，世界收到了不少于四种描述有效计算的技术：阿隆佐·丘奇的 `lambda calculus`、艾兰·图灵的 `Turing\
  \ machine`、库尔特·哥德尔的 `recursive functions`，以及此前未讨论过的哈斯尔·柯里的提出的 `combinatory logic`。这并非巧合，仅仅是因为条件成熟使得这一系列形式化方法得以产生。\n\
  \n准备性工作已经完成，逻辑世界已准备好接受新的思想和发现。这解释了为什么这些发现在时间上是如此接近，即使他们并不知道其他人也在研究相同的想法。\n\n回到哈斯尔的组合逻辑，以及它的函数组合形式化方法。原始函数通过组合来创建更强大的结构；这一原则在函数式编程中随处可见。它发表于\
  \ 1927 年，比图灵等人的形式要早多年。\n\n有一种争论认为，第一个创建证明的可能是一个名叫摩西·舍芬费尔的俄罗斯人。这影响了函数式编程技术“柯里”（currying）的命名，有些人建议将其改为“舍芬费尔化”以承认他的早期发现。遗憾的是，舍芬费尔的故事是一个悲剧。除了这篇论文外，关于他的工作为人知的极少。他是希尔伯特小组的成员，在他们的帮助下，他成功地在\
  \ 1924 年发表了这篇论文。几年后，他从哥廷回到俄罗斯，1927 年的消息显示他有精神疾病并关在精神病院。具体时间不详，但他在 1942 年某时贫困中去世。\n\
  \n他所有的论文都被邻居为了取暖烧掉了，因此人们永远无法知道他在研究什么。\n\n\n\n\n\n在二战期间的这段时间，阿兰·图灵曾著名的驻守布莱切利公园（Bletchley\
  \ Park），与英国最伟大的智力团队一起致力于破解 Enigma 密码。Enigma 密码的首次突破是在 1940 年通过所谓的“绿色密钥”实现的，随后德国军的“红色密钥”也被破解了。最近一部由本尼迪特·康康巴奇主演图灵的电影《模仿游戏》详细描述了这一时期。\n\
  \n纳粹并没有花费多久就开始使用一种名为 `Geheimschreiber`（秘密写入者）的新设备进行更复杂的加密。图灵致力于破解 `Tunny`（该“秘密写入者”的英国代号），并于\
  \ 1942 年发明了一种名为 `Turingery` 的技术。在大规模上实现 `Turingery` 为 Tommy Flowers 和 Max Newman\
  \ 团队设计世界上第一台可编程电子计算机提供了灵感。\n\n这台被称为 `Colossus`（巨像型）的计算机与你现在可能阅读这本书的设备大不相同。它使用电子空管（如今除了昂贵的\
  \ HiFi 音响设备和专业吉他放大器外，已基本不再使用）来执行布尔运算，就像今天晶体管的作用一样。这些元件控制着一系列继电器和步进电机，使其成为非常活跃且具有物理感的机器——你一定能听到它工作的声音！\n\
  \n现代机器完全不同，离散型和固态电子设备驱动着我们今天的计算。在如今的许多机器中，唯一的活动部件是冷却风扇，可能还有通过 `USB` 插入的偶尔外围设备。硬盘被固态硬盘取代，光驱器将便携式数据交给\
  \ U 盘或云存储，使得机器几乎完全静音。\n\n在英国布莱切利公园的国家计算博物馆，可以看到一台功能完好的 `Colossus` 复制品。原机及其蓝图已被销毁，相关信息直到\
  \ 20 世纪 70 年代一直处于机密状态。\n\n因此，尽管图灵的工作无疑有所帮助，但说他直接参与了该项目还是有些牵强的。相反，他当时正在开发一种可以加密语音的安全电话系统。该系统代号为\
  \ `Delilah`，遗憾的是缺乏远距离传输能力，没能在二战期间完成并投入使用。这让图灵回到了计算领域，他撰写了第一篇关于存储程序计算机的深度论文，险些击败了即将出版的约翰·冯·诺伊曼的草稿。回想起来，冯·诺伊曼草稿中包含的许多想法被认为是图灵的。\n\
  \n此外，图灵还以致力于研究人工智能问题而闻名。对他而言，这不是机器“是否”能具有智能的问题，而是“何时”的问题。为了确定何时达到这一里程碑碑，图灵发明了一种简单的测试（对人类来说很简单，但对机器来说并不一定），这种测试现在被称为\
  \ `图灵测试`。如果一台机器能够以与人无法区分的方式与人类观众进行交流，那么它就可以被认为是智能的。尽管这在我们听起来很简单，但值得注意的是，语言和复杂的交流是地球上人类特有的。即使是学过手语的灵长类动物也从未向饲养者问过一个单一的问题，这可能是由于认知限制，或者仅仅是因为语言极其难以掌握。\n\
  \n最近有声称某个计算机程序通过了图灵测试。这就像汽车制造商的油耗声明一样，现实世界的实际使用结果并不会产生与实验室相同的结果。该测试是在一组试图操纵测试的条件下完成的。\n\
  \n遗憾的是，图灵伟大的大脑和对战争的贡献并没保护他免受迫害。在 1950 年代的英国，同性行为是非法的。在向警方提到家中入室抢劫可能是男友的一位所为后，他被迅速逮捕。案件上庭后他被判定有罪，被判处监禁或在接受化学阉割的条件下获得减刑。图灵选择了医疗干预，而他的男友则获得了七个月的缓刑，可能是因为他比图灵年轻。\n\
  \n尽管他的家人对此否认，但据信图灵在 1954 年通过氰毒害自己每天食用的苹果自杀。有人解释说，他设置的实验产生了致命剂量的氰化物。图灵的遗产在计算界广为人知，并在电影《模仿游戏》后进入了更广泛的观众。2009\
  \ 年，发起了一场要求英国政府道歉的广泛运动。2013 年，他获得了死后赦免。\n\n### LISP 的遗产\n\n函数计算的下一个重大进展是 1958 年约翰·麦卡锡提出的\
  \ `LISP` 语言，它基于阿隆·丘奇的 lambda 演算。由于该语言对列表的依赖，其名称来源于列表处理（list processing）。\n\n有趣的是，`LISP`\
  \ 后来成为人工智能社区的事实标准。麦卡锡在图灵去世前利用阿隆·丘奇的思想研究了人工智能。\n\n许多语言和整个计算机科学都要感谢 `LISP`。它以动态类型、数据树结构、条件语句、递归和高阶函数引入了新思想。其他语言可能包含类似的功能，但从未以如此统一的方式。\n\
  \n等等，网络上有许多资源可以使用 `C`、`Python` 和 `C++` 创建 `LISP` 解释器。在 `PHP` 世界，已经完成了如 Mathias Verraes\
  \ 的 `Lambdalicious`、Igor Wiedler 的 `Lisphp` 以及 Tamreen Kahn 用 `PHP` 编写的交叉编译器 `Pharen`\
  \ 等项目。\n\n`LISP` 通过 S 表达式一眼就能被识别。它们被写为一个列表，函数名在前，参数在随后。在多年里，出现了许多 `LISP` 变体，其中 `Common\
  \ Lisp`、`Scheme` 和 `Clojure` 是目前最为人知的。\n\n随着时间的推移，函数领域几乎没有进展。现有的语言仍然局限于学术领域，用户群相对较小。\n\
  \n### Erlang\n\n在此之外，你需要向后推时间，直到电信行业开始寻找一种容错系统。毕竟，他们不能让客户的电话、短信和信息丢失或无法送达。爱信公司主导了电信领域函数领域的早期开发。在他们的实验室里，他们开发了一种可以解决他们行业面临问题的语言，其中可用性和可靠性是最重要的。\n\
  \n80 年代中期的这些研究诞生了 `Erlang` 编程语言。它基于 `Prolog`，并最初用该语言实现，后来驱动了爱信的所有基础设施。然而，后来，由于 `Erlang`\
  \ 是一门私有语言，爱信决定在 20 世纪 90 年代停止使用自己的语言！在 1998 年语言团队的关键成员离开后（无疑是为了抗议），爱信开源了 `Erlang`\
  \ 语言，使其能够再次内部使用。\n\n\n\n\n\n> 值得注意的是，Erlang 并不是 Ericsson Language 的缩写，而是以一位名为 Erlang\
  \ 的计算机科学家命名的。尽管如此，它确实非常出色地起到了双重作用。\n\n自诞生以来，Erlang 已被许多行业领域的众多知名企业使用。Erlang 近期最为人知的用途之一是\
  \ `CouchDB` NoSQL 器的基础语言。该存储系统使用 `map` 和 `reduce` 语句使得提取正确信息成为可能——这一点的意义在稍后将会变得更加清晰。嗯，至少在函数编程方面是如此！\n\
  \n在设计 Erlang 并并考虑实用目的的同时，另一种函数式语言正处于婴儿期。`Haskell` 由委员会设计并从从初就开源，它此后已成为公认为最著名的纯函数式语言。然而，在开始阶段，它甚至无法输出任何内容——它是一个纯粹且稳固的状态黑盒。\n\
  \n这反映了它作为一种实验和教学工具的起源。由于 `IO`（输入/输出）本质上是有状态的，他们一直在努力解决保护代码免受外部影响的问题。你希望能够以一种不引入状态操作的方式访问数据库或磁盘上的文本文件等信息。\n\
  \n如果你了解电子学，那么这可以被简单地看作类似于放大电路。你需要一个电源来增强信号，但重要的是不要让噪声从电源引入信号中。这之间真的只有细微的相似之处，所以不要钻得太深！\n\
  \n`Haskell` 现在为开源世界甚至银行业中的项目提供动力支持。你可能听过的几个项目包括 `Pandoc` 和 `xmonad`。它的规模仍然相对较小，许多公司倾向于坚持熟悉的工具和方法论。\n\
  \n这为 2004 年在 `Java` 和 `.NET` 运行时上创建 `Scala` 编程语言铺了道路。它允许将函数式语言应用于现有的基础设施中。`.NET`\
  \ 版本于 2012 年停止，语言开发重点转向了 `JVM`（Java 虚拟机）。虽然这些基础加速了该语言的开发和采用，但也付出了代价。这两个平台都不是设计为托管函数式语言而设计的。这导致了一些困难和缺点，但在本书的语境下，没有进一步讨论的价值。\n\
  \n与 `Haskell` 不同，`Scala` 语言不是纯函数式的，你可以在它编写非常优雅的面向对象代码。这是它的另一个吸引力；熟悉的方法论被完美地执行。由于它也运行在\
  \ `JVM` 上，你可以直接从 `Scala` 代码中使用 `Java` 包。\n\n可以认为 `Scala` 比 `Haskell` 更赶潮流，像 `Twitter`、`LinkedIn`、`Foursquare`\
  \ 和 `The Guardian` 等公司在其核心产品提供中使用了 `Scala`。再次，这非常主观！`Twitter` 为新工程师编写了许多入职指南，这些指南都是方便的学习资源。\n\
  \n随着这些语言的演变，人们的兴趣程度也提高了。这至少可以部分归功于对并行进程以利用多核和节点架构的需求增加。函数式代码缓解了命令式代码可能遭受的共享可变状态问题。随着架构为了处理日益增加的负载变得越来越复杂，这使其越来越具有吸引力。\n\
  \n最近转向函数式代码的人可以很容易地通过 MOOC 在线学习，其中许多课程涉及了 `Haskell` 和 `Scala`。这些课程可以作为这些语言的良好介绍，特别是\
  \ `Scala`，还有几本为该语言的学习者编写的好书。\n\n函数式编程的历史与数学和逻辑领域的发现有着不可分割的联系。正是在这些进步的基础上，编程和计算本身才应而生。虽然函数风格程序仍然不如它们充满状态的程序受欢迎，但采用率似乎在稳步增长。\n\
  \n## 2.3 其他函数式实现\n\n认为自认为实现了函数式构造的语言谱系非常广泛。在纯函数式语言方面，`Haskell` 可能是最著名的。在中间是 `Scala`\
  \ 和 `Clojure` 这样的语言，它们既包含命令式也包含函数式风格。而在更边缘，还有像我们喜爱的、常被诟的 `PHP`，它正在逐渐获取函数编程的基础。\n\
  \n为了对比，这里是 `Haskell` 中相同的 `sum` 示例：\n\n```\n```\n\n正如你所见，这种语法使得用最少的字符清晰地表达程序。\n\n\
  ## 2.4 商业用途\n\n函数式方法经常被引用的优点在于构建领域特定语言（DSLs）。大多数语言中的函数式构造成功地减少了解析语言时所需的底层工作。\n\n\
  这种方法的优势在于它极大地减轻了维护工作并使代码更易理解。\n\n一个著名的商业案例可以在巴莱多银行的奇异交易结算框架找到。该框架用 `Haskell` 编写，为数学家创建交易应用程序定义了一个\
  \ DSL。紧凑且灵活的函数实现使团队能够更有效、更快地对新需求做出反应。项目初期团队面临一些担忧，主要是与 `C` 等语言编写的遗留系统建立接口。使用 `Haskell`\
  \ 不仅轻松完成了这一点，而且结果是一个惊喜，因为它防止了组件的紧耦合。\n\n函数编程最著名的商业用途可能是爱立信创立 `Erlang` 语言，该语言专门设计用于通过高级符号语言提高生产力。由于电信对可靠性和并发性的严苛要求，爱立信排除了当时的函数式语言，`LISP`\
  \ 和 `Prolog` 是领先者。\n\n自此以后`Erlang` 被许多商业用户采用并为许多任务关键硬件提供动力。在商业采用和持续使用方面，它可能是最大的成功故事。\n\
  \n另一个最近的例子来自 `Twitter`，他们正使用 `Scala` 来处理其社交服务的许多关键功能。虽然 `Scala` 不是纯函数式语言（它也有面向对象的支持），但它完全能够胜任。你在\
  \ `Twitter` 上每天使用的某些功能都是由 `Scala` 驱动的，包括用户关系的存储、按名称或兴趣搜索用户以及 `Twitter` 提供的“关注谁”模糊建议。\n\
  \n## 2.5 函数编程最适合什么？\n\n正如你所看到的，任何可以用命令式完成的任务都可以用函数式方法论完成。虽然每种方法论都有其优势，但你可以把它们仅仅看作切蛋糕的另一种方式。\n\
  \n\n\n\n\n没有所谓的黄金法则规定在某些情况下推荐函数式编程，而在另一些情况下推荐面向对象编程。函数式编程不是一种框架或设计模式，而是一种图灵完备的方法论。为此，随着你熟悉函数式编程，你将直觉地感知到何时采用特定方法解决问题最为合适。值得注意的是，这在不同语言之间会有，PHP\
  \ 与 Scala 非常不同。在 PHP 世界中，由于对面向对象编程的偏好，函数式编程主要用于列表处理，但正如你后续将看到的，这并不会阻止我们探索更复杂的结构。\n\
  \n## 2.6 函数式编程的优势\n\n那么，从你的命令式语言中移除特性有什么帮助呢？随着函数式编程的日益流行，跟上潮流至关重要。从探索函数式代码中获得的洞察也可以应用于面向对象编程。一条经常被引用的规则是：随着抽象层次的提高，由于其鼓励编写简洁的代码，程序的可读性也随之提高。人们还经常说，这些属性的副作用是生产力的提高，因为输入更少，且不需要在脑中构建全局状态，有助于你腾出时间处理更困难的问题。\n\
  \n测试你的代码变得简单得多，因为所有值都是最终的（final），这意味着你不需要与副作用作斗。没有需要维护特定顺序，也没有需要设置的全局状态。你只需要传递正确的参数，就将始终获得相同的结果。这个概念通常被称为“引用透明性”（referential\
  \ transparency），基本上意味着你可以将任何函数调用替换为它返回的值，结果算法将保持不变。因此，我们可以使用静态数组代替 `range()`，而仍然能得到相同的结果：\n\
  \n```\n将静态值替换到命令式示例中是不可能的（除非证明我是错的！），而这正是函数式风格真正出彩的地方。每个函数在给定相同输入时始终返回相同的值。不要低估这些函数比那些充满状态的对应函数容易测试得多。浪费在模拟全局状态上的时间更少，而且当测试失败时，它总是会失败。由于函数式程序避免了任何全局状态并对组件采用封装，重现\
  \ bug 不需要长长的动作链就能出现。如果一个函数没有返回正确的值，那么它就是错误的。虽然这在 PHP 程序中通常不是问题，但函数式编程有助于防止线程或进程之间的竞态条件。维护函数式风格允许你充满信心地编写此类应用程序（嗯，几乎如此！）。随着计算机硬件的进步，并行处理的重要性在不断增长。\n\
  \n计算机正在通过增加中央处理器的核心数量来获得越来越多的力量。如果你的软件要利用这种力量，你就需要考虑并行处理。这正是函数式编程放弃赋值语句能够有效保护你免受进程锁定或尝试更新内存中相同位置的影响。它还让执行顺序变得无关，因为由于没有需要更新的状态，函数将始终返回相同的值。只有当你允许状态渗透进代码时，分配到进程的任务才会出现问题。函数式编程的额外优势（通常不适用于\
  \ PHP——所以我们在这里不讨论）是热部署和代码的机器优化。\n\n## 2.7 函数式基础\n\n尽管 PHP 本身是命令式的，但它支持基础的函数式编程风格。为了更容易学习，最好舍弃语言的某些方面以模拟更纯粹的函数式风格：\n\
  \n* 避免改变状态——即使在函数内部也是。\n* 尽量将函数保持在一行或尽可能短。\n* 将问题拆解为最小单元，并将这些转换为可重用的函数。\n* 从你的代码中移除控制语句。\n\
  * 反复强调：避免状态并不要使用变量赋值！\n\n你本质上是想创建一个小的黑盒函数，在给定正确参数时它始终返回相同的值。PHP 有许多语言特性可以帮助建立这种编程风格的基础。可能最有用的是\
  \ lambda 函数，它使得处理将函数作为变量传递的代码变得更加容易。此外，诸如 `array_map()` 和 `array_reduce()` 等语言函数对于将函数应用到值列表非常有帮助。PHP\
  \ 中没有不可变值类型或静态类型变量，因此取决于你的实现如何保护你的函数式代码免受状态改变。\n\n当你开始以函数式方式工作时，你需要更多的原语来处理你遇到的复杂操作。幸运的是，路已经有人走过了，稍后我们会介绍一些库。\n\
  \n***\n\n\n# 3 语言特性\n\n> “递归是函数式编程中的 GOTO。”\n>\n> —Erik Meijer (计算机科学家，@headinthebox)\n\
  \n尽管 PHP 在严格的编程环境中声誉略显平庸，但它的功能相当丰富。它的大部分力量来自 5.3 及以上版本，但从 PHP 5 开始，它一直在朝着一个良好的方向发展。注意我说的是“良好”的方向，而不是“正确”的方向！随着版本\
  \ 5 的演进，语言中增加了许多新特性，这些特性也缓解了 PHP 的开发。\n\n虽然 true 许多这些特性本可以用更优的方式来实现以支持函数式风格，但它们确实存在。\n\
  \n\n\n\nPHP 可用于纯函数式编程，这可以提高生产力并减少错误。良好的函数式代码属性还使其易于测试。一旦你学习了本章中的特性，你将看到该语言在这种风格下具有巨大的潜力。\n\
  \n我将其比作一场冒险，就像 Sjaak Lucassen 所经历的那种，他骑着雅哈 R1 几乎环绕了整个世界。这辆超级摩托穿越了几乎无法识别的道路泥沼——这可能是\
  \ R1 远离它的赛道环境最远的一次。很多人会告诉你这不切实际，甚至根本不可能。我在这里想告诉你，这是完全可能的，而且在很多方面，它是解决问题的非常优雅的方法——即使在\
  \ PHP 中也是如此\n\n\nPHP 中的类型将作为本章概念的起点。\n\n类型（Types）、类型（typing）和类型系统（type systems）都指的是值具有类型而不仅仅是内容。这意味着如果你将一个单词赋值为值的内容，它将被赋予\
  \ `string` 类型。如果你赋值一个整数，那么它通常会被赋予 `integer` 类型。\n\n像 PHP 这样的编程语言使用类似的类型系统，类型是从赋值给变量的值推断出来的。如果你将单词\
  \ `\"test\"` 赋值给变量，PHP 会自动推断出类型应该是 `string`。然而，这只是动态类型故事的一半。其他语言使用一种在定义变量时指定变量类型的系统。另一些语言则将两者结合使用。\n\
  \n在 PHP 中，解析器可以使用以下标量数据类型（scalar data types）。标量类型是最基本的类型，包含了数字和文本等简单内容。\n\n* `Boolean`—`true`\
  \ 或 `false`\n* `integer`—整数（包括负数）\n* `float`—浮点数（小数）\n* `double`—`float` 的别名\n*\
  \ `string`—文本信息\n\n随着程序需求变得越来越复杂，值必须增强其能力以适应它们的复合性质。\n\n* `array`—有序映射或 键/值对列表\n\
  * `object`—类的实例\n\n最后，PHP 还定义了一些为特定语言特性定义的特殊类型。\n\n* `resource`—指向外部资源的引用（例如文件句柄）\n\
  * `NULL`—表示没有值的变量\n* `callable`—从 PHP 5.4 开始，可以被视为函数的变量\n\n这些类型中没有一个可以直接显式设置为 PHP\
  \ 变量的类型。如前所述，如果你将变量设置为一个整数，PHP 会自动将该变量变为 `integer` 类型。\n\nPHP 确实提供了强制转换（casts），这使得改变值的类型成为可能。例如，如果将字符串\
  \ `\"10\"` 转换为整数，PHP 解析器将该值的类型转换为整数 (10)，如下所示：\n\n```\n```\n```\n\n这在尝试触发类的 `__toString()`\
  \ 方法时可能特别有用。\n\n```\n```\n```\n\n可用的强制转换包括到 `string`、`integer`、`double`、`float`、`array`、`object`\
  \ 和 `boolean`。要确定你所需的转换运算符，可以使用以下列表。\n\n| 类型 | 转换运算符 |\n| --- | --- |\n| boolean\
  \ | `(bool)` |\n| integer | `(int)` |\n| float | `(float)`, `(double)` 和 `(real)`\
