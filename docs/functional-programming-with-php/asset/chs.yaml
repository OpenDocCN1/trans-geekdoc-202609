  \ y = pure ($ y) <*> u\n```\n\n幸运的是，我们可以创建一个足够的 applicative 用于演示并传达这里所需的概念。\n\n\
  第一条法则等同于我们之前看到的泛子法则 `pure id <*> v = v`，它翻译为以下 PHP 代码，并在图 6.3、图 6.4 和图 6.5 中进一步阐明：\n\
  \n```\n\n```\n\n![Figure 6.3: Creating a New Just Context](img/file2.png)\n\n图 6.3:\
  \ 创建一个新的 `Just` 上文\n\n```\n\n```\n\n![Figure 6.4: Inserting a Function into an Applicative\
  \ Context](img/file3.png)\n\n图 6.4: 将函数插入 Applicative 上文中\n\n```\n\n```\n\n![Figure\
  \ 6.5: Mapping the applicative](img/file4.png)\n\n图 6.5: 映射 applicative\n\n```\n\
  \n从结果中，我们可以推断出在针对 `$v` 封装进 `Applicative` 上文后调用 `$id()` 函数将得到 `$v`，因此我们证明了第一条恒等律。与之前的泛子示例一样，这确保了将函数封装到上下文并使用\
  \ `amap()` 应用它不会影响返回的值。改变值是被应用函数的职责。\n\n接下来是通过检查是否遵循 `pure f <*> pure x = pure (f\
  \ x)` 来检查同态性（homomorphism），这大致翻译为 Listing 6.9。\n\n**Listing 6.9**\n\n```\n\n```\n\
  \nPHP 对 `Applicative` 的模拟从外部上看确实符合这条法则，但重要的是，尽管结果相同，它们之间的上下文形状是不同的。\n\n所以总结一下，如果你能原谅这个双关语的话，applicatives\
  \ 就像是加强版的泛子——它们的力量更强！泛子允许你将函数应用到封装在上下文中的值上，但 applicatives 还可以将封装的函数应用到一个或多个封装的值上。\n\
  \n## 6.10 Monads\n\n将这个想法进一步延伸，你就接触到了单子（monads）的概念。在理解了泛子和 applicative 之后，你应该能够更容易上手单子的内部操作，所以如果你还没有良好掌握这些概念，我建议你在继续这里之前回顾一下它们。\n\
  \nMonad 是一个很难理解的概念，而与之相关的三个法则只会加深围绕它们的误解。为了降低学习曲线，我将放弃形式主义，专注于结果。这可能不是纯函数代码，但主意是让你走上理解单\
  \ ad 的道路。首先，让我们解决显而易见的问题。经常提到的使用 monad 的理由是你可以维护状态，但这只是益处之一。它们还提供了一种可重复的方法来使用起初互不兼容的函数。\n\
  \n与纯函数语言相比，Monad 在 PHP 中并不一定那么有用。在 PHP 中，有其他方法可以处理 monad 解决的问题，并且得到了语言更好的支持。然而，尽管这并不一定直接对应真实世界的用例，但并不意味着不应该使用熟悉的编程语言来探索和学习。这是一个某种隐秘的秘密：任何拥有闭包和匿名函数的语言都可以产生\
  \ monads！\n\n涵盖 monads 的意图希望构建出模拟，这样如果你想探索它们，这些模拟将帮助你理解函数式语言中的类似概念。谁知道呢，也许你以后在某个时刻会在\
  \ PHP 项目中发现它们非常有用。\n\n在说完免责声明后，让我们深入研究定义 monad 的核心原则。有三条通用法则，但我们稍后会处理这些，因为它们使其更难理解。Monad\
  \ 是一种设计模式，函数在接收到封装的值时会返回一个封装的值，没有这样的规则来限制我们的这位新朋友。它可以接收一个返回不同上下文的函数，并使其屈服。\n\nMonad\
  \ 实际上并没有操作容器中的任何值，因为那是你要求它执行的函数的工作。就像 applicative 一样，它只知道如何应用提供的函数，但实际上并没有定义任何变异逻辑。\n\
  \n为了简单起见，在 PHP 中构建任何 monad 时，我们必须记住以下指南。Monad 维护一个容器——我们已经看到的容器示例是我们之前定义的 `Just`\
  \ 泛子。\n\n此外，monad 定义了两个函数，允许我们操作受保护的容器。第一个是向上述容器中注入一个值的函数。在 Haskell 中，它被定义为 `return`，但我们将它命名为\
  \ `pack()`，因为它在我脑海中更清楚地描述了动作，我们正在将值封装到容器中。\n\n最后，当我们对对存储容器中的值应用函数时，我们将使用名为 `map()`\
  \ 的方法，它等同于 Haskell 的 `bind()`。\n\n现在你有了关于 monad 是什么及其各种组成部分的 Basic 。所有 monad 都定义了这些基础，但当然，它们都有自己的实现细节，可能会暴露其他方法供使用。\n\
  \n### 设置 Monad 结构\n\n必须首先定义 monad 结构，以便我们有一组基础功能来辅助产生 monads。与之前的 `Functor` 和 `Applicative`\
  \ 一样，我们先为 `Monad` 定义一个接口。\n\n```\n```\n\n\n\n\n`MonadInterface` 通过 `pack()` 和 `map()`\
  \ 方法勾勒了 monad 的最重要的两个方面，这两个方法代表了与任何 monad 通信的唯一统一方式。我们现在可以定义一个基础抽象类 `Monad` 供其他\
  \ monad 扩展。不过，如果开发者愿意，只要他们实现了 `MonadInterface`，就可以一直实现另一个用于集合的抽象类。\n\n**列表 6.10**\n\
  \n```\n\n```\n\n```\n\n列表 6.8 中的抽象类实现了一个容器类属性，该属性将用于在内部存储传递给它的值。更重要的是，它描述了 `pack()`\
  \ 和 `map()` 应该行为的基础指令集。\n\n![图 6.6: Only::pack() 的实际运行](img/file5.png)\n\n图 6.6:\
  \ Only::pack() 的实际运行\n\n调用 `pack()` 将返回一个新的 monad 实例，并将提供的值封装在其中——参见图 6.6。这是通过将值传递给新实例的构造函数完成的，这也是为什么\
  \ `MonadInterface` 也指定了构造方法的原因。\n\n![图 6.7: map() 促进函数应用](img/file6.png)\n\n图 6.7:\
  \ map() 促进函数应用\n\n在 `map()` 的情况下，定义仍然相当简单，尽管它使用了 `callable` 类型注解来指示只有可以作为函数调用的项应该传入。然后它将透明地将提供的函数（`$function`）应用到之前\
  \ `pack()` 到 monad 中的值，并返回结果——参见图 6.7。\n\n传递给 `Monad` 的 `map()` 方法的函数可以访问容器的内容，重要的是不要允许任何值泄漏到这些墙壁之外。这意味着\
  \ `$function` 必须将其计算结果封装在 monad 中。\n\n### 你的第一个 Monad\n\n困惑吗？我打赌你还在挠腮，所以让我们来看一些代码并查看一个\
