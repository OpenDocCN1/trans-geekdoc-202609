  \ --- | --- |\n| boolean | `boolval()` |\n| integer | `intval()` |\n| float | `floatval()`\
  \ |\n| double | `doubleval()`（仅为 `floatval` 的别名） |\n\n在代码块中实现时，可以按以下方式使用：\n\n```\n\
  ```\n```\n\n你还可以使用 `settype()` 函数并将预期的输出类型作为第二个参数字符串传入。\n\n```\n```\n```\n\n它可以接受\
  \ `'bool'`、`'int'`、`'float'`、`'string'`、`'array'`、`'object'` 或 `'null'` 中的任意一个。\n\
  \n辅助函数 `gettype()` 允许你直接获取提供的变量的类型。\n\n通常情况下，你会使用 `is_*` 系列函数来测试变量的类型。再次，PHP 定义的每种类型都有一个对应的函数。\n\
  \n| 类型 | `is_*` 函数 |\n| --- | --- |\n| array | `is_array()` |\n| bool | `is_bool()`\
  \ |\n| float | `is_float()` |\n| integer | `is_int()` |\n| NULL | `is_null()` |\n\
  | object | `is_object()` |\n| resource | `is_resource()` |\n| string | `is_string()`\
  \ |\n\n```\n```\n\n还有一些更宽松的函数，以便在更广泛的范围内评估变量的内容。这意味着你可以判断一个值是否属于一组类型中的一种。\n\n| 类型\
  \ | `is_*` 函数 |\n| --- | --- |\n| `is_numeric()` | 整数、浮（以及双）或包含数值的字符串 |\n| `is_scalar()`\
  \ | 整数、浮、字符串和布 |\n| `is_callable()` | 变量的值可以被视为函数 |\n\n```\n\n所有这些属性导致 PHP 成为一个相当弱的类型系统，这在难以确保操作的是正确的类型时可能会产生问题。PHP\
  \ 曾尝试引入更严格的类型检查，这些是在 PHP 7 中添加的。启用类型提示（type hints）是由调用代码决定的。\n\n## 3.2 函数\n\n函数是将一组指令封装进重用块的方法。在\
  \ PHP 中，函数可以接受一个或多个参数（通常称为参数）并返回结果。这表现为函数名称以及每个参数名称。接下来，函数体列出了使用提供的参数产生所需的步骤。\n\n\
  ### 命名函数\n\n函数在 PHP 中通常定义为命名函数——这些函数在定义时被命名。一个对提供的参数加 1 的简单函数可以表示如下：\n\n```\n```\n\
  ```\n\n传递给函数的参数替换到函数体中并由定义的算法处理。在 `add_one()` 函数的情况下，只有一个形式为 `$x` 的参数。当调用 `add_one()`\
  \ 时，解析器会执行以下步骤：\n\n1. 带有参数调用函数\n\n```\n```\n```\n\n2. 参数值替换到函数中——`$x` 变为 3，这意味着主体变为\n\
  \n```\n3 + 1\n```\n\n3. 计算完成并计算出答案——`4`\n\n4. 从函数返回结果\n\n有趣的是，可以通过嵌套调用 `add_one()`\
  \ 来轻松演示，形式为 `add_one(add_one(3))`。本质上，一旦运行此代码，参数将连续应用两次 `add_one()`。\n\n1. 发起函数调用\n\
  \n```\n```\n```\n\n2. 解析器首先处理内部函数，并将其参数替换到函数体中\n\n```\n```\n```\n\n3. 然后进行计算，得到\n\
  \n```\n```\n```\n\n4. 现在参数传递给外部函数，留下解析器处理\n\n```\n4 + 1\n```\n\n\n\n\n5. 再次在函数内部执行计算或操作并返回结果——`5`\n\
  \n这说明了在解析器中执行函数的流程，但作用域（scoping）呢？\n\n其实，在 PHP 中，函数无法访问函数体之外定义的变量。该规则的唯一例外是作为参数传递函数的变量，或者通过\
  \ `global` 关键字显式引入的变量。\n\n要访问父级作用域中的变量，必须将其作为参数传递，或者在函数体内部声明为 `global`。\n\n尽管 `$a`\
  \ 没有被作为参数传递，但它通过使用 `global` 关键字被替换到函数体中。这意味着如果将该函数应用于参数为 `1` 的输入时，函数体将被替换为 `10 +\
  \ 1`。\n\n为了完整起见，值得指出在 PHP 中还有两种方法实现此目的。你可以将变量添加到超全局变量中，例如 `$GLOBALS`、`$_POST`、`$_SESSION`\
  \ 等，或者你可以使用闭包（closure），我们将在本书的后续章节中讨论。\n\n> 超全局变量（Superglobals）是 PHP 中每个作用域内都可用的变量。PHP\
  \ 总共定义了九个超全局变量，广义来说，你只会向其中两个添加值。当你存储一个希望在整个会话期间持久的值时，会将该值放在 `$_SESSION` 中。否则，为了让它持续到当前进程结束，你可以写入\
  \ `$GLOBALS`。其他超全局变量还包括请求头（`$_GET`、`$_POST`、`$_REQUEST`、`$_FILES` 和 `$_COOKIE`）和环境（`$_SERVER`\
  \ 和 `$_ENV`）。虽然可以更改这些数组的值，但通常建议这样做，因为这会导致依赖这些变量及其相应值的脚本产生意外结果。\n\n> 过去，我曾为了批量虚拟主机设置在\
  \ `auto_prepend_file` 中覆盖 `$_SERVER['DOCUMENT_ROOT']`。我发现的另一个用途是在设置 cookie 值时，它在用户下一次请求之前是不可用的，因此我会手动在\
  \ `$_COOKIE` 数组中设置它，以强制其立即可用。然而，这确实是不明智的。\n\n虽然全局变量可以提供一种将值引入函数体的简单方法，但它普遍是不受欢迎的——而且这很有道理！通过依赖全局变量，你**为你的应用程序引入了状态**。\n\
  \n应该避免状态，因为它很难重新创建并会导致软件出现 bug。稍后会有更多相关内容，但现在请不要在你的代码中实现这些方案！\n\n在体体的末尾（尽管可能出现在之前），通常的做法是包含一个\
  \ `return` 语句。不包含 `return` 语句的函数将输出 `null` 值。这可以通过完全省略 `return` 关键字或指定 `return;`\
  \ 来实现。如果你需要从函数返回多个值，可以返回一个值数组。\n\n最后，虽然在 PHP 中可以在函数之间嵌套命名命名函数，但它们的行为可能并不符合你的预期。所有命名函数——无论它们定义在何处——都会被解释为处于父级作用域。这意味着，嵌套在另一个函数内部的函数可以在包含它的函数的外部调用。它们还污染了命名空间，因此你不能拥有与嵌套函数中声明的同名的函数。\n\
  \n这意味着你不能编写列表 3.1 中的代码并期望 PHP 解析它。\n\n**列表 3.1**\n\n由于定义了两个名为 `expr()` 的函数，无论它们看起来是嵌套在另一个函数内部，PHP\
  \ 都会抛出解析错误。\n\n### 函数参数类型提示 (Function Parameter Type Hinting)\n\n在函数式编程中，通常使用语言的编译器来帮助你编写接受特定类型值的函数，并在它们运行之前检查你的实现。在\
  \ PHP 中这很困难，因为它的类型系统相当松散，PHP 不使用编译器，而是使用运行时解析器。由于代码在运行之前不会被求值，因此无法由机器检测。\n\n你可以使用一些简单的关键字来防止将错误的类型传递给函数。\n\
  \n*   `array` 指定它必须是一个数组\n*   一个类名（`stdClass`）\n*   接口名称（`Traversable`）\n\n最后，在\
  \ PHP 5.4 中添加了另一种类型提示，称为 `callable`，它表示可以像函数一样调用的参数。在 PHP 中，`callable` 可以是以下任何一种：\n\
  \n*   以字符串形式存在的现有用户空间或 PHP 函数名（`'substr'`）\n*   类方法可以指定为包含两个元素的数组——第一个是实例，然后是作为字符串的方法名（`[$object,\
  \ 'myMethod']`）\n* 静态方法类似，不同之处在于传递的不是实例而是作为字符串的类名（`['MyClass', 'myMethod']`）或 `MyClass::myMethod`\n\
  *   Lambda 函数和闭包\n\n如果你看重 PHP 5 的强类型支持（你确实应该这样做），那么著名的 Pthreads 的 Joe Watkins 一直在使用一个名为\
  \ `Strict` 的 PHP 扩展。该扩展允许在定义函数参数时对字符串或整数值等标量类型进行类型提示。\n\n如果传递错误的类型，这些类型提示将触发异常。这允许你依赖于传入例程序的正确类型。默认情况下，PHP\
  \ 目前不允许你对标量类型进行提示。\n\nStrict 还带来了一个实用的函数，可以使用所谓的无损转换（lossless cast）或在无法转换时抛出异常。为了确定此类转换操作是否成功，Strict\
  \ 会检查是否可以在不丢失数据或精度的情况下完成转换。因此，你无法将带小数的浮点转换为整数。\n\nStrict 运行方式的问题在于无法为参数指定默认值。这是由于\
  \ Strict 处理参数。\n\n### 高级函数调用 (Advanced Function Calling)\n\n有时通过传递参数数组来程序化地调用函数是有用的。PHP\
  \ 有几种方法实现这一点，取决于你使用的语言版本。\n\n目前默认的方法是使用 `call_user_array()` 函数，但正如我们之后看到的，变长参数（variadics）为这一练习带来了语法糖。\n\
  \n极可能的，这种技术常用的用法是在函数内部调用具有相同参数或部分参数的另一个函数。为了说明这一点，下面的 PHP 日函数在调用目标函数之前会输出简短的调试信息。\n\
  \n```php\nfunction log_and_call($function, $arguments) {\n    echo \"hello called\
  \ \";\n    call_user_func_array($function, array_slice($arguments, 1));\n}\n```\n\
  \n```\n```\n\n这个函数非常牵强，虽然我不会在生产环境中使用，但它确实可以作为一个简洁的示例。现在我们可以调用它看看它如何对输入做出反应。注意使用\
  \ `array_slice()` 从 `$arguments` 中切掉第一个元素，因为我们不需要将辅助函数的名称传递到辅助函数中！\n\n```php\nlog_and_call(\"\
  echo\", [\"simon\\n\"]);\n```\n\n\n\n\n\n就像在 PHP 5.6 中，可以使用变长参数（variadics）和解包运算符（splat\
  \ operator）来极大提高此类代码的可读性。\n\n在之前的示例中，我们使用了 `func_get_args()` 来获取参数数组。这个函数的遗憾之处在于它会返回所有参数，无论你是否已经将它们赋值给了参数变量。这导致我们在之前的示例代码中必须使用\
  \ `array_slice()` 来移除第一个参数。\n\n变长参数通过对函数参数进行细微的语法调整，使这个过程变得更加简单高效。函数的最后一个参数可以以三个连续的点作为前缀。这指示\
  \ PHP 将所有后续参数作为数组传递给你的变长变量。\n\n```\n然后我们可以使用一组参数调用此函数，以观察变长参数的行为。\n```\n\n当执行 `sum3()`\
  \ 时，PHP 将将第一个参数（`1`）赋值给 `$a`，将第二个参数（`2`）赋值给 `$b`。所有后续参数（3 到 10）都将赋值给变长变量 `$xs`。该变量通过前面的三个点\
  \ `...$xs` 被指定为变长参数。\n\n> 你可能在想为什么我用 `xs` 作为变量名——嗯，这是一种 Haskell 风格的习惯，表示该变量包含一个\
  \ `x` 的列表。就像自然英语一样，“s”表示复数或多个。\n\n> 所以 `xs` 是类型为 `x` 的值的集合，其中 `x` 可以是 `int`、`float`\
  \ 等。\n\n当然，这个示例并没有实际应用，因为你通常会放弃 `$a` 和 `$b` 变量，直接在 `array_sum()` 中使用变长参数。\n\n如前所述，解包运算符是变长参数不可或缺的补充。它也被称为展开运算符（unpacking\
  \ operator），它接收一个数组并将其内容转换为函数的参数列表。鉴于它与我们检查过的变长参数相同，其语法很容易记忆。\n\n这一功能可以在下面的函数调用中看到，其中\
  \ PHP 本质上是将提供的数组 `$args` 转换为之前之前定义的 `sum()` 函数的参数。\n\n```\n回到 `log_and_call()` 示例，可以使用变长参数和参数解包来重写它。\n\
  ```\n\n这段代码要短得多，因此运行速度更快且更易读。由于解包运算符只收集未分配的参数，我们能够避免切片 `$arguments` 数组。更不用说移除了不再需要的两个函数调用。\n\
  \nPHP 5.6 版本中添加的解包或参数展开语法允许将数组转换为函数参数。该数组并不一定源自变长参数或 `get_args()`，它可以是你自己构造的数组。变长参数可以用于以数组的形式捕给函数的参数。它将捕获任何未分配给命名函数参数变量的参数。\n\
  \n\nLambda 函数仅仅是 PHP 基本函数概念的扩展。本质上，Lambda 是一个可以像变量一样处理的函数——它是一个没有正式标识符的函数。我的意思是该函数在定义时没有分配名称。这种特性通常被称为一等函数（first\
  \ class function），这意味着它们可以作为参数传递给其他函数，从赋值给变量的函数返回，或者放置在更复杂的数据结构中。\n\n这些函数通常被称为 lambda\
  \ (λ) 函数或匿名函数。为了说明它们在 PHP 中看起来是什么样，我们将重申之前的 `add one` 函数。\n\n```\n虽然这可以编译，但它实际上不会执行任何操作，因为我们没有方法调用该函数。通常，lambda\
  \ 函数会被赋值给一个变量，或者直接作为参数传递给另一个函数。\n```\n\n当赋值给变量时，`add one` 函数可以像标准 PHP 函数一样被调用，尽管该变量受标准\
  \ PHP 作用域规则的影响。与命名函数不同，赋值给变量的 lambda 函数无法从其他函数或类方法立即可用。\n\n```\n标准命名函数与赋值给变量的 lambda\
  \ 函数之间的关键区别在于，现在它可以被传递、赋值给另一个变量，甚至通过对 `$add_one` 调用 `unset()` 来销毁。\n```\n\n换句话说，可以将该函数像\
  \ PHP 中的任何其他变量一样对待。所有这些属性都导致了高阶函数的创建，我们将在下一节中讨论它。\n\n如果你有一些 JavaScript 经验，那么这种模式看起来也会非常熟悉。\n\
  \n```\n在 PHP 中，你可能遇到过用于懒加载的 lambda 函数，例如在框架路由系统中。另一个例子可以在老牌的 `spl_autoload_register()`\
  \ 中找到，它接受一个函数作为第一个参数：\n```\n\n```\n正如你所看到的，它们可以赋值给变量，同样，它们也可以直接定义在接收函数的参数中（在这种情况下，是\
  \ `spl_autoload_register()`）：\n```\n\n匿名函数也被称为 lambda 函数，它们用正式名称或标识符声明。它们可以赋值给变量、作为参数传递，或从函数返回。PHP\
  \ 限制你做的一件事是在是对匿名函数进行序列化，因为这会触发解析错误。在 Jeremy Lindblom 的 SuperClosure 库的帮助下，至少有一种方法可以绕过。\n\
  \nLambda 函数在 Alonzo Church 的论文中正式，是 lambda 演算的基础。它们还构成了我们书中将看到的所有函数式编程的基础。在没有一等函数支持的语言中，函数风格编程是无法实现的。\n\
  \n请原我的夸张，但几乎每一段编写过的函数式代码都使用了 lambda 函数，它们是你工具箱中重要的构建模块，并且在继续学习之前应该掌握它们。\n\n\n闭包是任何函数式语言的重要特性，并且被认为如此有用，以至于许多指令语言现在也支持它们。PHP\
  \ 也不例外，从 5.3 版本引入了对闭包的支持。\n\n闭包是 lambda 函数形式的逻辑扩展，通过向函数引入上下文概念，因为它们可以作为一个包传输代码和数据。可以认为闭包在函数式编程中所扮演的角色类似于对象在面向对象编程中所扮演的角色。事实上，在\
  \ PHP 中创建一个闭包实际上返回的是内部 `Closure` 类的实例。\n\n更具体地说，上下文是在定义点附加到函数的部分信息。这些信息可以是一个变量，例如数组、lambda\
  \ 函数、标量或对象。这通过 PHP 中的 `use` 关键字实现，它可以从当前作用域将变量引入函数，而无需将其作为参数传递函数——`use ($add_value)`。\n\
  \n```\n注意的是，传入闭包的值是在定义时设置的。这与全局变量不同，全局变量可以在任何地方更改并影响稍后引用它的所有代码。操作全局变量的函数在全局变量被更改后再次调用时将返回不同的值。\n\
  ```\n\n```\n如果我们对闭包这样做，那么值将在定义闭包时被固定的。\n```\n\n这简洁地证明了，对赋值给 `$my_global_var` 的值的后续更改对我们闭包中封装的值没有影响。这种作用域是\
  \ PHP 全局变量和常量与其闭包之间最明显的区别。\n\n\n\n\n闭包（closure）与任何其他 PHP 函数之间的视觉区别在于 `use` 关键字，它定义了将引入并封装在该闭包中的变量或多个变量。这是唯一的本质区别，否则闭包看起来与其他任何\
  \ lambda 函数无异。\n\n```\n\n```\n\n在上一个示例中，你会注意到 `use` 关键字发挥了作用并引入了 `$name` 变量。该函数能够对\
  \ `$name` 的值进行操作，就像它是传递给函数的其他参数一样。\n\n通过 `use` 向函数上下文中添加多个变量的相同示例将如下例所示。\n\n```\n\
  \n```\n\n```\n\n程序中添加了两个新变量（``$title`` 和 ``$surname``），并通过 `use` 关键字将它们引入函数的上下文中。这允许所有三个变量在闭包体内部使用，但当然，你不必使用所有引入的变量。在下一个示例中，`$name`\
  \ 变量被添加到了闭包的上下文中，但它实际上并没有在函数体内被消耗。\n\n```\n\n```\n\n```\n\n与任何其他函数一样，闭包也可以接受参数，这些参数是从闭包定义中第一组括号内部传递给它的。\n\
  \n```\n\n```\n\n```\n\n闭包对于那些在每次调用函数时都需要访问且在闭包定义后不会改变的值非常有用。通常，当你想要将其他闭包或 lambda\
  \ 函数传递到正在定义的闭包时，就会实现它。\n\n**列表 3.2**\n\n```\n\n```\n\n在这里你可以看到一个 lambda 函数被引入到一个闭包中，然后使用\
  \ `array_map()` 对 `$array` 中的每个元素调用它，为数组中的每个值创建一个 MD5 哈希值。\n\n### 高阶函数\n\n高阶函数（higher\
  \ order function）一术语指的是接受另一个函数作为参数或返回函数作为值的函数。当然，同样的名称也适用于同时具备这两者的函数。当一个函数接受另一个函数作为参数时（例如尊崇的\
