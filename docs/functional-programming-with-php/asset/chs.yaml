  \ 3.6 记忆化 (Memoization)\n\n结果缓存过程可以通过返回一组预处理过的数据集来加速昂贵的操作。从缓存中获取值允许应用程序跳过运行缓慢的代码，并仍然返回正确的结果。PHP\
  \ 记忆化的秘密配方是 `static` 关键字，它有效地将变量固定在内存中的资源上。每当在同一个 PHP 进程中更新资源时，下次调用函数时就会召回新值。\n\n\
  ```\n\n```\n\n使用 functional-php 库的 `F\\memoize()` 函数可以简化此操作（稍后将深入讨论）：\n\n```\nuse\
  \ Functional as F;\n\n$callback_function = function($arg) {\n   return get_some_really_expensive_data($arg);\n\
  };\n$result = F\\memoize($callback_function, array('php'));\n```\n\n这种方法可能实处的良好例子是缓存将大型文档解析为哈希的过程，或者对一个广泛重用的函数限制对数据库的调用。\n\
