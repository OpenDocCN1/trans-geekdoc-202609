  \n\n\n这本书向你介绍了一些你现在 PHP 项目中可以使用的函数式编程技术。虽然这可以作为你所熟悉语言的一门很好的入门课程，但如果你想更进一步，我建议你也应该开始关注其他语言，如\
  \ `Haskell`、`Scala` 或 `Clojure`。我发现自己在非常熟悉的语言中学习新概念更容易，因此这本书是针对有类似背景的读者的。\n\n在我自己的项目中，我确实使用了一些函数式方法论，但到目前为止，我通过开源发布的项目都是用面向对象的\
  \ PHP 编写的。这反映了 PHP 倾向于使用命令式代码而非函数式编程的现状。我的商业代码也是如此，尽管我希望未来这些技术能被更广泛地理解。我们需要更多的函数式项目作为开源发布，更多的讨论，更多的演讲者进行分享，当然，还有更多的博客和杂志文章来撰写。\n\
  \n并不是说目前没有任何开源项目在代码中使用函数式构造结构。我了解的几个例子包括 `ReactPHP`（事件驱动框架）、`Bullet`（自描述函数式 Web\
  \ 框架）、`Slim`（微框架）和 `Pimple`（依赖注入容器）——尽管（据我所知）它们没有一个利用了更复杂的函数式技术，通常只是在此处包含少量的 lambda\
  \ 或闭包。我相信还有许多其他项目也在使用类似的代码——如果你知道我遗漏的有趣项目，请告诉我。\n\n如果你想参与 PHP 函数式编程的开发，最好的起点是 PHP\
  \ 内部主要邮件列表和 `RFCs`。\n\n***\n\n1. [当前的 PHP RFCs](https://wiki.php.net/rfc)\n2. [PHP.net\
  \ 维基](https://wiki.php.net)\n\n# 附录 A：补充说明\n\n## 0.1 理解类型签名\n\nPHP 拥有弱类型结构，因此类型定义对你来说很可能是陌生的。实际上，它们非常简单，在本书中只是简单地描述了输入和输出。\n\
