    # Document Management System Empowered by Effective Amalgam of Blockchain and
    IPFS


    Shikhar Saranga*, Dhruv Rana*, Smit Patel^a, Darshil Salaviya*, Udai Pratap Rao*,
    Akhil Chaurasia*†


    *Department of Computer Science & Engineering, Darsh Vallabhhai National Institute
    of Technology, Surat, 395007, Gujarat, India


    # Abstract


    The world has started digitization, even before the global market, which had led
    to various processes, like verification and application of documents, going online.
    This also leads to an increase in the amount of data and traffic on the internet,
    causing an increase in cyber fraud, as document (digital) forgery. All this led
    to the need for a secure digital document management platform. With the help of
    Blockchain Technology, a safe alternative for the same can be developed. In this
    paper, we have studied the cases where digital forms of documents are used, and
    based on Blockchain Technology, we have created a secure web application for all
    the processing of documents. The web application generates credentials as requested
    for defined templates and stores them securely in the distributed network (Polygon)
    and the document as an IPFS (InterPlanetary File System). It provides the facility
    to verify the authenticity of the document. It also allows users to share access
    to their documents for a specific time.


