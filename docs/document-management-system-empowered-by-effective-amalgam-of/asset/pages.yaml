    # 2.2. LegitDoc


    LegitDoc is a flagship product developed by CrossForge Solutions Pvt. Ltd., which
    has developed a DApp which can issue any digital documents (Government-issued
    documents, educational certificates, records, banking documents, invoice papers,
    lab reports, medical reports, etc.) to its stakeholders who can be verified within
    10 seconds [10]. Using Ethereum as the underlying stack, LegitDoc has a proprietary
    method to calculate and process hashes of documents generated by issuers. Original
    document and its corresponding proof file are required for issues that can be
    used for verification.


    # 2.3. Blockchain Platforms


    There are many Blockchain platforms that can be used for deploying DApps and smart
    contracts. Let''s look at few of them with pros and cons.


    # 2.3.1. Ethereum


    Ethereum is an open-source Blockchain, which is widely used to develop and deploy
    decentralized and reliable applications. Every node in the Ethereum network stores
    a full copy of the Blockchain, so all the transactions are executed by the nodes
    must agree upon the transaction.

    Without incurring the expenditures of constructing their own, anyone may create
    a Blockchain-based system and operate on Ethereum''s infrastructure. Ether is
    used by the Ethereum network to reward nodes for computations and move money between
    accounts/wallets. Downtime, censorship, fraud, or third-party intervention do
    not affect Ethereum Blockchain applications.


    # 2.3.2. Hyperledger Fabric


    It is a business Blockchain network hosted by Linux Foundation, using a modular
    architecture ensuring confidentiality and scalability. The platform allows developers
    to build all types of private Blockchain apps. It is extremely popular for organizational
    use [11]. The differences between Ethereum and Hyperledger Fabric are mentioned
    in Table 1.


    Table 1. Comparison between Ethereum and Hyperledger Fabric [12]


