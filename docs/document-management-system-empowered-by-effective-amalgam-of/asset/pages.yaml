    # 2. Storing Data and Files


    # 2.4.1. MongoDB


    MongoDB is an open-source NoSQL relational database management system. MongoDB
    can store and retrieve document-oriented data. MongoDB works using records that
    contain data field and value pairs. Groups of documents that operate similarly
    to a relational database table are known as collections. All collections can hold
    any kind of data, this data cannot be distributed over many databases [15].


    # 2.4.2. BigchainDB


    BigchainDB is a scalable database. It was created to bring the advantages of two
    worlds: "conventional" distributed databases and "traditional" Blockchains. BigchainDB
    begins with a standard database (original RethinkDB) with the following properties:
    scale and query ability. From that, we will build Blockchain features such as
    decentralized, immutable assets.


    # 2.4.3. IPFS


    The Interetary File System (IPFS) is a distributed file protocol and a peer-to-peer
    network. Using IPFS, we can store and share information. IPFS takes advantage
    of a data structure called Directed Acyclic Graphs (DAGs). Specifically, we use
    Merkle DAGs, where each node has a unique identifier that is a hash of its contents.
    To identify an individual file in a global namespace that links the content, IPFS
    uses content-addressing [16]. When you upload a file to IPFS, it is split into
    smaller chunks of data, which are hashed cryptographically, and then assigned
    a fingerprint termed Content Identifier (CID). The SHA-256 hashing algorithm guarantees
    a unique CID for each default. This CID is a permanent record of your file as
    it exists. When others search for your file, they inquire whether their peers
    are storing the content referenced by the CID. They cache a copy of your file
    when they view or download it, and becomes another source of you until their cache
    is erased.

    A node in the network keeps the just as it is concerned, and adding some information
    to identify which node is storing what. When you upload a new version to IPFS,
    its cryptographic hash changes, and it obtains a new CID. This indicates that
    IPFS is resistant to manipulation and censorship – any modifications to a file
    do not erase the original, and common portions across files may be reused to'
