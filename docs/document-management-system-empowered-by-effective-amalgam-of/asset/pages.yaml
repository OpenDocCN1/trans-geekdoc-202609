    # 2.4. Evaluation of File Storage System


    MongoDB is a centralized database. The problem with centralized databases or even
    decentralized databases like Google Cloud is they are vulnerable to attacks. Also,
    Distributed systems provide advantages like security, accessibility, accountability,
    and cost reduction [18].


    BigchainDB is a hybrid of distributed databases and Regularchains that combine
    the best of both worlds [19]. Thus, being a perfect fit for DApps dealing with
    NFTs (Non-Fungible Tokens) or Ethereum Tokens. However, our solution requires
    storing documents in a safe system and getting them whenever needed. IPFS becomes
    a better fit for the implementation as it provides simplicity and security.


    # 3. Proposed Work


    In this research, we aim to build a system that helps to manage, verify and share
    Documents using Blockchain Technology. The workflow for this system includes starting
    with a basic template for a specific document and utilizing the same to generate
    documents with a unique Signature (hash) that will be used to verify the document.
    It has three parts: generation, verification, and sharing.


    # 3.1. Generating Certificate


    First, the certificate is created and uploaded on the platform. Then the end users
    can use these templates as application forms for getting the certificate. Afterward,
    the approver can verify all the details provided by viewing other supporting documents
    to be shared by the applicant on the approver dashboard, as identity card, and
    the certificate for the applicant. Also, the details are added to the Blockchain,
    and the applicant can download the PDF or use the platform service to share the
    certificate.


    # 3.1.1. Creating and Uploading Template


    For applicants to apply for a new type of certificate, the document issuer must
    provide the required fields and documents for approval. Then a template for the
    form using the pdfLib npm package is created.


    # 3.1.2. Getting the data


    To provide the data, the applicant has to fill out the form template, available
    in PDF format. After filling out the form template, the applicant needs to upload
    the filled form with the required documents as a PDF or use the shared service
    of the platform.


    # 3.2. Verify the data and generate the certificate


    Once the form is submitted, the approver completes the verification of all the
    provided data and approves the certificate. On approval, the details of the certificate
    holder are added onto the Blockchain, and the certificate is generated and made
    available for download.


    # 3.2.1. Storing the certificate onto the Blockchain


    Once the certificate is approved and generated, it is stored in the IPFS, and
    a unique CID is generated. This CID is saved in the Blockchain along with the
    owner details.


    # 3.3. Verifying Certificate


    For verification of the certificate, it needs to be uploaded on the platform.
    On uploading the certificate, we use the “pdf-lib” npm package to read the content
    of the certificate, using the “load” method of the “PDFDocument” class, which
    reads all the data fields in the form of metadata. Now, we search for the same
    user’s certificate in the Blockchain'
