    Polygon makes a distinctive approach to L2 scaling by plasma, a L2 scaling solution
    that generates a tree-like set of "child Blockchains" that utilize the Ethereum
    as a tree and arbitration layer.

    Polygon''s new Blockchain is developed as a "commit chain" rather than a "side
    chain." The main difference is noted that sidechains mostly rely on their validators
    for security purposes. In contrast, for example, Polygon'
