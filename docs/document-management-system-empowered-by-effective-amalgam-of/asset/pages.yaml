    # 1. Introduction


    With rapid digitalization, many government or private organizations have moved
    to online platforms. Though the conventional onsite procedure continues for the
    most of various reasons, it is evident that the online procedure provides a convenient
    experience for both the applicant and the processing agency. Some underlying concerns
    are also faced as the process goes online, infrastructural constraints for the
    data and redundancy as the documents are required for different applications,
    resulting in the requirement to provide the data and document under the constraints.
    Including other minor concerns, the major concern is cyber fraud and digital forgery.


