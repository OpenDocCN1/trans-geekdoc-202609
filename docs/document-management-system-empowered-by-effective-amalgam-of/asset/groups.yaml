    ## 2. 存储数据和文件


    ### 2.4.1. MongoDB


    MongoDB 是一个开源的 NoSQL 关系数据库管理系统。MongoDB 可以存储和检索面向文档的数据。MongoDB 的工作基于包含数据字段和键值对的记录。操作方式类似于关系型数据库表格的文档组被称为集合（collections）。所有集合都可以包含任何类型的数据，这些数据无法分布在多个数据库中
    [15]。


    ### 2.4.2. BigchainDB


    BigchainDB 是一个可扩展的数据库。它的创建是为了带来两个世界的优势：“常规”分布式数据库和“传统的”区块链。BigchainDB 从一个标准数据库（原始
    RethinkDB）开始，具有以下属性：扩展性和查询能力。在此基础上，我们将构建区块链功能，如去中心化、不可篡的资产。


    ### 2.4.3. IPFS


    星际文件系统 (IPFS) 是一种分布式文件协议和点对点网络。使用 IPFS，我们可以存储和共享信息。IPFS 利用了名为有向无环图 (DAGs)的数据结构。具体来说，我们使用
    Merkle DAG，每个节点都有一个唯一标识，它是其内容的哈希。为了在全局命名空间中标识链接内容的单个文件，IPFS 使用内容寻址 [16]。当你将文件上传到
    IPFS 时，它会被分成较小的数据块，对数据块进行加密哈希，然后分配一个称为内容标识符 (CID) 的指纹。SHA-256 哈希算法保证每个默认文件都有唯一的
    CID。这个 CID 是你的文件存在状态的永久记录。当其他人搜索你的文件时，他们会询问其节点是否存储了 CID 所引的内容。当他们查看或下载你的文件时，会缓存该文件的副本，并在缓存擦除之前成为你文件的另一个来源。

    网络中的节点只负责保持其原样，并添加一些信息来识别哪个节点存储了什么。当你向 IPFS 上传新版本时，其加密哈希会发生变化，并获得新的 CID。这表明 IPFS
    能够抵抗操纵和审查——对文件的任何修改都不会删除原始文件，且文件之间的共同部分可以重用，这意味着你必须记住一长串的 CID，因为 IPFS 可以利用 IPNS
    去中心化命名系统来定位你的最新版本，而 DNSLink 可以将 CID 链接到人类可读的 DNS 名称 [17]。


    ## 2.4. 文件存储系统的评估


    MongoDB 是中心化数据库。中心化数据库甚至像 Google Cloud 这样的去中心化数据库的问题在于它们容易受到攻击。此外，分布式系统提供了安全性、可访问性、可解释性和降低成本等优势
    [18]。


    BigchainDB 是分布式数据库和常规区块链的混合体，结合了两者的优点 [19]。因此，它非常适合处理 NFT（非质化代币）或以太坊代币的 DApp。然而，我们的解决方案需要在安全系统中文档并在需要时获取它们。IPFS
    成为实现的更佳选择，因为它提供了简单性和安全性。


    ## 3. 设计工作


    在这项研究中，我们旨在构建一个利用区块链技术帮助管理、验证和共享文档的系统。该系统的流程包括从特定文档的基础模板开始，并利用它生成具有唯一签名（哈希）的文档，该签名将用于验证文档。它包含三个部分：生成、验证和共享。


    ## 3.1. 生成证书


    首先，在平台上创建并上传证书。然后终端用户可以使用这些模板获取证书。之后，审核者可以在审核仪表板上验证申请者共享的所有细节。


    ### 3.1.1. 创建和上传模板


    为了申请新类型的证书，文档发行者必须提供审核所需的字段和文档。然后使用 pdfLib 包创建表单。


    ### 3.1.2. 获取数据


    为了提供数据，申请者必须填写 PDF 格式的表单。填写完表单后，申请者需要上传填充后的表单或使用平台服务共享证书。


    ## 3.2. 验证数据并生成证书


    一旦表单提交，审核者将完成对所有数据的验证并批准证书。批准后，证书持有者的详情被添加到区块链中，并生成证书供下载。


    ### 3.2.1. 将证书存储到区块链上


    一旦证书被批准并生成，它会被存储在 IPFS 中，并生成唯一的 CID。该 CID 与所有者详情一起保存在区块链中。


    ## 3.3. 验证证书


    为了验证证书，需要将其上传到平台。上传证书时，我们使用 “pdf-lib” npm 包读取证书内容，使用 “PDFDocument”类的 “load” 方法以元数据的形式读取所有数据字段。现在，我们在区块链中搜索同一用户的证书。


