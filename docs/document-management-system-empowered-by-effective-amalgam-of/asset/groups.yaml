    ## 1.1. Motivation


    The cybercrime rate is constantly increasing with the use of digital space. However,
    cybercriminals like digital forgery and document tampering can go unnoticed if
    proper checking and inquiries are not made. Thus, there may be cases where the
    crime has taken place, but due to unawareness of the victim, they are not noticed.
    Moreover, in a country like India, where the percentage of the uneducated population
    is considerable, and are dependent on third parties for their various work related
    to documents, the act of crime against them is high. Thus, the Blockchain-based
    management system will help improve this situation, especially against unaware
    people, as it is a more secure option and will lead to a cleaner organization
    in terms of fake or tampered documents.


    ## 1.2. Objectives


    In this paper, we are analyzing the cases of Blockchain with the primary objective
    of how it can be used to develop a prototype of the safe and secure online document
    management portal. To begin, we will discuss Blockchain technology and its fundamentals
    and understand how it can reduce the possibility of tampering, provide a reliable
    way of approval of new documents.


    ## 1.3. Contribution


    Following are the contribution made by us:

    - Selection of documentation using Blockchain

    - Secured storage of documents using InterPlanetary File System (IPFS)


    ## 1.4. Organization of Paper


    This paper is divided into five sections. Section 1 presents a brief introduction
    of the management system, the limitations of existing systems, the motivation
    behind choosing this topic, its objectives, and our contribution. Section 2 presents
    the theoretical background and literature review. Section 3 presents the proposed
    work and methodology. Section 4 presents the simulation and results. Section 5
    presents the concluded work and future scope.


    ## 2. Related Work


    ### 2.1. Blockchain


    Blockchain is a decentralized network updated by cryptography. Unlike the traditional
    system, the registry is distributed and stored by all participants, and each instance
    contains all transactions [3].


    #### 2.1.1. Distributed Consensus


    Distributed consensus is a critical component of Blockchain and cryptocurrencies.
    It signifies that many agree, as opposed to unanimity, which occurs by methods
    comprised of specific protocols and well-defined rules between Peer-to-Peer (P2P)
    network participants [4].


    #### 2.1.2. Transactions


    With cryptocurrencies, the data structure that captures the semantics of the application
    is similar to that of a balance sheet. It is made up of the following:

    - Timestamp

    - Previous Transaction''s Hash

    - Input Value

    - Output Value

    - Receiver Account Key of Receiver [5]


    #### 2.1.3. Chain of Blocks (Blockchain)


    Merkle Tree is a tree structure based on hashes that connects transactions in
    a block [6]. The leaves of the Merkle Tree represent transactions, and the hashes
    of the children develop the hashes of the parents. The hashes of the leaves and
    the hashes of the intermediate branch are calculated using the hashes of the immediate
    branches until the hash of the tree''s root is included in the block.


    #### 2.1.4. Smart Contracts


    A Smart Contract is defined as a piece of code written in some specific programming
    language that can be deployed to the Blockchain network to create contract accounts.
    The contract contains the instructions which define the contract account must
    be. Smart contracts are self-executing and self-enforcing when the rules are met
    at all stages. They are tamper-proof, as no one can change what has been programmed
    directly into lines of code. Smart contracts offer several advantages such as
    [7]:

    - Speed and real-time updates

    - Less execution risk

    - Fewer intermediaries

    - Lower costs


    #### 2.1.5. Decentralized Applications (DApps)


    Decentralized Applications (DApps) are open-source entities that a group of users
    may deploy by agreement. They do not need centralized entities like governments
    or public companies. DApps share some characteristics, which are as follows [8]:

    - Open source

    - Decentralized

    - Incentivize

    - Proof of value protocol


