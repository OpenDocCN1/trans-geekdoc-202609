    # Shikhar Saraf et al. (Procedia Computer Science 215 (2022) 340-349 341


    With the increasing accessibility of the internet throughout the country, the
    rate of cybercrime is increasing, with an 18% rise in the cybercrime rate [1].
    The number of cases of digital forgery is also increasing, with 580 cases in 2020,
    515 cases in 2019, and 338 cases of digital document tampering were also seen
    in the year 2020 [2]. In today''s world, the need for a more convenient and secure
    way to authenticate, share, approve and official digital documents is rising.
    The existing portals for online processes generally involve filling registration
    forms, and then uploading a few documents for the verification of information
    are typically stored in a centralized server, which makes data vulnerable to attacks.
    The documents are stored at an onsite-server and, in most of the cases is digital
    form of paper-based original document, which increases the chance of digital forgery
    and tampering.

    Thus, using Blockchain-based services for online applications and other processes
    provides a solution to improve the security of the document and also result in
    a decrease of counterfeiting.


    # 1.1. Motivation


    The cybercrime rate is constantly increasing with the use of digital space. However,
    cybercriminals like digital forgery and document tampering can go unnoticed if
    proper checking and inquiries are not made. Thus, there may be cases where the
    crime has taken place, but due to unawareness of the victim, they are not noticed.
    Moreover, in a country like India, where the percentage of the uneducated population
    is considerable, and are dependent on third parties for their various work related
    to documents, the act of crime against them is high. Thus, the Blockchain-based
    management system will help improve this situation, especially against unaware
    people, as it is a more secure option and will lead to a cleaner organization
    in terms of fake or tampered documents.


    # 1.2. Objectives


    In this paper, we are analyzing the cases of Blockchain with the primary objective
    of how it can be used to develop a prototype of the safe and secure online document
    management portal. To begin, we will discuss Blockchain technology and its fundamentals
    and understand how it can reduce the possibility of tampering, provide a reliable
    way of approval of new documents and provide safe sharing features.


    # 1.3. Contribution


    Following are the contribution made by us in the direction of solving the problem
    statement:


    +   - Selection of distributed file system using centralised database for storage
    of documentation by comparing them various parameters

    - Secured and distributed storage of documents using Blockchain and Inter Planetary
    File System (IPFS)

    - Unification of generation, verification, storage and sharing of documents


    # 1.4. Organization of Paper


    This paper is divided into five sections. Section 1 presents a brief introduction
    of the document management system, the limitations of existing systems, the motivation
    behind choosing this topic, its objectives, and our contribution to the same.
    Section 2 presents the theoretical background and literature review, which covers
    Blockchain technology and file management system techniques. Section 3 presents
    the proposed work and details of the methodology. Section 4 presents the simulation
    and the results of the implementation of the proposed work. Section 5 presents
    the concluded work and provides information about the future scope that can be
    built upon the proposed system.'
