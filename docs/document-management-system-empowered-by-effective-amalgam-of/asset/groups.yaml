    # ScienceDirect


    Procedia Computer Science 215 (2022) 340–349


    # 第4次创新数据通信技术与应用国际会议


    # 基于块链与 IPFS 有效融合的文档管理系统


    Shikhar Saranga*, Dhruv Rana*, Smit Patel^a, Darshil Salaviya*, Udai Pratap Rao*,
    Akhil Chaurasia*†


    *达尔·瓦拉布国家技术学院计算机科学与工程系，苏拉特，395007，古吉拉特邦，印度


    # 摘要


    世界在全球市场之前就已经开启了数字化，这导致了文档验证和申请等各种流程的在线化。这也导致了互联网数据量和流量的增加，引发了网络欺诈（如文档（数字）伪造）的增加。这一切导致了对安全的数字文档管理平台的需求。通过区块链技术的帮助，可以开发出安全的替代方案。在本文中，我们研究了使用数字形式文档的情况，并基于区块链技术创建了一个用于处理所有文档的安全
    Web 应用程序。该应用程序根据定义的模板生成所需的凭证，并将其安全地存储在分布式网络（Polygon）中，并将文档作为 IPFS（星际文件系统）存储。它提供了验证文档真实性的功能。它还允许用户在特定时间内共享其文档的访问权限。


