    ## 55 错误归因的一般情况


    以下是错误归因的一般步骤。假设流水线有三个步骤 A、B 和 C，其中 A 直接馈入 B，B 直接馈入 C。


    ![](img/bef73f83187c4fb59f46276044c2c531_110_0.png)


    对于系统在开发集上犯的每个错误：


    - 1. 尝试手动修改 A 的输出使其成为“完美”输出（例如，猫的“完美”边界框），并在此输出上运行流水线的其余部分 B、C。如果算法现在给出正确输出，则说明如果只有
    A 给出更好的输出，整体算法的输出本应是正确的；因此，你可以将此错误归因于组件 A。否则，继续进行第 2 步。

    - 2. 尝试手动修改 B 的输出使其成为 B 的“完美”输出。如果算法现在给出正确输出，则将错误归因于组件 B。否则，继续进行第 3 步。

    - 3. 将错误归因于组件 C。


    让我们看一个更复杂的例子：


    ![](img/bef73f83187c4fb59f46276044c2c531_110_1.png)


    你的自动驾驶汽车使用此流水线。你如何使用分部件错误分析来决定应关注哪些组件？


    你可以将三个组件映射到 A、B、C 如下：


    - A: Detect cars

    - B: Detect pedestrians

    - C: Plan path for car


    按照上述程序，假设你在封闭赛道上测试汽车，发现汽车选择的转向方向比熟练司机更突兀。在自动驾驶领域，这样的情况通常被称为 **场景**。你将：


    - 1. 尝试手动修改 A（检测车辆）的输出使其成为“完美”输出（例如，手动输入告诉它其他车辆的位置）。像之前一样运行流水线的其余部分 B、C，但允许 C（规划路径）使用
    A 现在完美的输出。如果算法现在为汽车规划出好得多的路径，则说明如果只有 A 给出更好的输出，整体算法的输出本会更好；因此，你可以将此错误归因于组件 A。否则，继续进行第
    2 步。

    - 2. 尝试手动修改 B（检测行人）的输出使其成为 B 的“完美”输出。如果算法现在给出正确输出，则将错误归因于组件 B。否则，继续进行第 3 步。

    - 3. 将错误归因于组件 C。


    ML 流水线的组件应按照有向无环图（DAG）排序，这意味着你应能够以某种固定的从左到右顺序计算它们，并且后面的组件应仅依赖于前面组件的输出。只要组件映射到
    A->B->C 顺序遵循 DAG 排序，则错误分析就会没问题。你可能会得到略有不同的结果如果你交换 A 和 B：


    - A: Detect pedestrians (was previously *Detect cars*)

    - B: Detect cars (was previously *Detect pedestrians*)

    - C: Plan path for car


    但此分析的结果仍然有效，并能很好地指导你关注的重点。


    ## 56 分部件错误分析与与人类水平性能的比较


    对学习算法进行错误分析就像使用数据科学分析 ML 系统的错误以得出下一步该做什么的见解。其最基本的形式，分部件错误分析告诉我们哪些组件的性能值得投入最大努力去改进。


    假设你有一个关于客户在网站上购买商品的数据集。数据科学家可能有许多不同的数据分析方法。她可能会得出许多不同的结论，关于网站是否应提高价格，关于通过不同营销活动获得的客户的生命周期价值等等。没有一种“正确”的分析数据集的方法，可以得出许多有用的见解。同样，也没有一种“正确”的进行错误分析的方法。通过这些章节，你已经学习了许多最常见的设计模式，用于为你的
    ML 系统得出有用的见解，但你也可以自由尝试其他分析错误的方法。


    让我们回到自动驾驶应用，其中车辆检测算法输出附近车辆的位置（以及可能的速度），行人检测算法输出附近行人的位置，这两个输出最终用于为汽车规划路径。


    ![](img/bef73f83187c4fb59f46276044c2c531_112_0.png)


    为了调试此流水线，而不是严格遵循上一章中看到的程序，你可以更非正式地问：


    - 1. How far is the Detect cars component from human-level performance at detecting
    cars?

    - 2. How far is the Detect pedestrians component from human-level performance?

    - 3. How far is the overall system’s performance from human-level performance?
    Here, human-level performance assumes the human has to plan a path for the car
    given only the outputs from the previous two pipeline components (rather than
    access to the camera images). In other words, how does the Plan path component’s
    performance compare to that of a human’s, when the human is given only the same
    input?


    如果你发现某个组件远未达到人类水平性能，你现在就有充分理由专注于改进该组件的性能。


    许多错误分析流程在我们试图自动化人类可以做的事情并且因此可以与人类水平性能进行基准比较时效果最好。我们之前的大多数示例都隐含了这一假设。如果你正在构建一个
    ML 系统，其中最终输出或某些中间组件执行的是即使人类也无法做好的事情，那么这些程序中的一些将不适用。


    这是解决人类可以解决的问题的另一个优势——你拥有更强大的错误分析工具，因此可以更有效地优先安排团队的工作。


    ## 57 发现有缺陷的 ML 流水线


    如果你的 ML 流水线的每个单独组件都达到人类水平性能或接近人类水平性能，但整体流水线远未达到人类水平怎么办？这通常意味着流水线存在缺陷，需要重新设计。错误分析也可以帮助你了解是否需要重新设计流水线。


    ![](img/bef73f83187c4fb59f46276044c2c531_114_0.png)


    在上一章中，我们提出了每个三个组件的性能是否达到人类水平的问题。假设这三个问题的答案都是肯定的。即：


    - 1. The Detect cars component is at (roughly) human-level performance for detecting
    cars from the camera images.

    - 2. The Detect pedestrians component is at (roughly) human-level performance
    for detecting pedestrians from the camera images.

    - 3. Compared to a human that has to plan a path for the car given only the outputs
    from the previous two pipeline components (rather than access to the camera images),
    the Plan path component’s performance is at a similar level.


    然而，你的整体自动驾驶汽车的性能明显低于人类水平性能。即，被给予访问摄像头图像的人类可以为汽车规划明显更好的路径。你能得出什么结论？


    唯一可能的结论是 ML 流水线存在缺陷。在这种情况下，Plan path 组件在给定其输入的情况下已经做得尽可能好，但输入不包含足够的信息。你应该问自己，除了来自两个早期流水线组件的输出之外，还需要什么其他信息才能非常好地为汽车规划行驶路径。换句话说，熟练的人类驾驶员还需要什么其他信息？


    例如，假设你意识到人类驾驶员还需要知道车道标记的位置。这表明你应该按如下方式重新设计流水线¹⁸：


    ![](img/bef73f83187c4fb59f46276044c2c531_115_0.png)


    最终，如果你认为即使每个单独组件都具有人类水平性能（记住你是将组件与被给予相同输入的人类进行比较），你的流水线整体也无法达到人类水平性能，那么流水线存在缺陷，应该重新设计。


    ¹⁸ In the self-driving example above, in theory one could solve this problem by
    also feeding the raw camera image into the planning component. However, this would
    violate the design principle of “Task simplicity” described in Chapter 51, because
    the path planning module now needs to input a raw image and has a very complex
    task to solve. That’s why adding a Detect lane markings component is a better
    choice--it helps get the important and previously missing information about lane
    markings to the path planning module, but you avoid making any particular module
    overly complex to build/train.

