    # 51 Choosing pipeline components: Task simplicity


    Other than data availability, you should also consider a second factor when picking
    components of a pipeline: How simple are the tasks solved by the individual components?
    You should try to choose pipeline components that are individually easy to build
    or learn. But what does it mean for a component to be “easy” to learn?


    ![](img/bef73f83187c4fb59f46276044c2c531_98_0.png)


    Consider these machine learning tasks, listed in order of increasing difficulty:


    +   1. Classifying whether an image is overexposed (like the example above)

    +   2. Classifying whether an image was taken indoor or outdoor

    +   3. Classifying whether an image contains a cat

    +   4. Classifying whether an image contains a cat with both black and white fur

    +   5. Classifying whether an image contains a Siamese cat (a particular breed
    of cat)


    Each of these is a binary image classification task: You have to input an image,
    and output either 0 or 1. But the tasks earlier in the list seem much “easier”
    for a neural network to learn. You will be able to learn the easier tasks with
    fewer training examples.


    Machine learning does not yet have a good formal definition of what makes a task
    easy or hard.¹⁶ With the rise of deep learning and multi-layered neural networks,
    we sometimes say a task is “easy” if it can be carried out with fewer computation
    steps (corresponding to a shallow neural network), and “hard” if it requires more
    computation steps (requiring a deeper neural network). But these are informal
    definitions.


