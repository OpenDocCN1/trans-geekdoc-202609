    # 57 Spotting a flawed ML pipeline


    What if each individual component of your ML pipeline is performing at human-level
    performance or near-human-level performance, but the overall pipeline falls far
    short of human-level? This usually means that the pipeline is flawed and needs
    to be redesigned. Error analysis can also help you understand if you need to redesign
    your pipeline.


    ![](img/bef73f83187c4fb59f46276044c2c531_114_0.png)


    In the previous chapter, we posed the question of whether each of the three components’
    performance is at human level. Suppose the answer to all three questions is yes.
    That is:


    +   1. The Detect cars component is at (roughly) human-level performance for detecting
    cars from the camera images.

    +   2. The Detect pedestrians component is at (roughly) human-level performance
    for detecting cars from the camera images.

    +   3. Compared to a human that has to plan a path for the car given only the
    outputs from the previous two pipeline components (rather than access to the camera
    images), the Plan path component’s performance is at a similar level.


    However, your overall self-driving car is performing significantly below human-level
    performance. I.e., humans given access to the camera images can plan significantly
    better paths for the car. What conclusion can you draw?


    The only possible conclusion is that the ML pipeline is flawed. In this case,
    the Plan path component is doing as well as it can given its inputs, but the inputs
    do not contain enough information. You should ask yourself what other information,
    other than the outputs from the two earlier pipeline components, is needed to
    plan paths very well for a car to drive. In other words, what other information
    does a skilled human driver need?'
