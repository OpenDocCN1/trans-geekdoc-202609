  mdcn: '

    如果你能够将一个复杂任务拆解为更简单的子任务，那么通过显式地编码子任务的步骤，你就为算法提供了先验知识，这可以帮助它更高效地学习任务。


    ![](img/bef73f83187c4fb59f46276044c2c531_99_0.png)


    假设你正在构建一个暹罗猫检测器。这就是纯端到端架构：


    ![](img/bef73f83187c4fb59f46276044c2c531_99_1.png)


    相比之下，你也可以使用一个包含两个步骤的流水线：


    ![](img/bef73f83187c4fb59f46276044c2c531_99_2.png)


    第一步（猫检测器）检测图像中的所有猫。


    ![](img/bef73f83187c4fb59f46276044c2c531_100_0.png)


    第二步然后将每个检测到的猫的裁剪图像（一次一个）传递给猫品种分类器，最后如果检测到的猫中有暹罗猫则输出 1。


    ![](img/bef73f83187c4fb59f46276044c2c531_100_1.png)


    ![](img/bef73f83187c4fb59f46276044c2c531_100_2.png)


    与仅使用 0/1 标签训练纯端到端分类器相比，流水线中的两个组件——猫检测器和猫品种分类器——似乎更容易学习，并且需要显著更少的数据。17


    17 如果你熟悉实用的目标检测算法，你会认识到它们不仅仅使用 0/1 图像标签进行学习，而是使用作为训练数据一部分提供的边界框进行训练。对它们的讨论超出了本章的范围。如果想了解更多此类算法，请参阅
    Coursera 上的深度学习专项课程 (http://deeplearning.ai)。


    作为最后一个例子，让我们重新审视自动驾驶流水线。


    ![](img/bef73f83187c4fb59f46276044c2c531_101_0.png)


    通过使用这个流水线，你是在告诉算法驾驶有 3 个关键步骤：（1）检测其他车辆，（2）检测行人，（3）为你的汽车规划路径。此外，每一个都是相对更简单的函数——因此可以用更少的数据学习——比纯端到端方法。


    总之，在决定流水线的组件时，尝试构建一个流水线，其中每个组件都是相对“简单”的函数，因此可以仅从适量的数据中学习。


    ## 52 直接学习丰富的输出


    图像分类算法会输入图像 x，并输出表示对象类别的整数。算法能否改为输出完整的一句话来描述图像？


    例如：


    x =


    ![](img/bef73f83187c4fb59f46276044c2c531_102_0.png)


    y = “一条黄色公共汽车驶下道路，背景中有绿树和绿草。”


    监督学习的传统应用学习一个函数 h:X→Y，其中输出 y 通常是整数或实数。例如：


    | Problem | X | Y |

    |---|---|---|

    | Spam classification | Email | Spam/Not spam (0/1) |

    | Image recognition | Image | Integer label |

    | Housing price prediction | Features of house | Price in dollars |

    | Product recommendation | Product & user features | Chance of purchase |


    端到端深度学习最令人兴奋的发展之一是它让我们可以直接学习比数字更复杂的 y。在上面的图像描述示例中，你可以让神经网络输入图像 (x) 并直接输出描述 (y)。


    ### 这里有更多示例：


    | Problem | X | Y | Example Citation |

    |---------|---|----|------------------|

    | Image captioning | Image | Text | Mao et al., 2014 |

    | Machine translation | English text | French text | Sutskever et al., 2014 |

    | Question answering | (Text,Question) pair | Answer text | Bordes et al., 2015
    |

    | Speech recognition | Audio | Transcription | Hannun et al., 2015 |

    | TTS | Text features | Audio | van der Oord et al., 2016 |


    这是深度学习中加速的趋势：当你拥有正确的（输入、输出）标注对时，有时即使输出是句子、图像、音频或其他比单个数字更丰富的输出，也能实现端到端学习。


    ## 按部分进行错误分析


    ## 53 按部分进行错误分析


    假设你的系统使用复杂的机器学习流水线构建，并且你希望提高系统的性能。流水线的哪一部分应该改进？通过将错误归因于流水线的特定部分，你可以决定如何优先安排工作。


    让我们使用我们的暹罗猫分类器示例：


    ![](img/bef73f83187c4fb59f46276044c2c531_105_0.png)


    第一个部分，猫检测器，检测猫并将其从图像中裁剪出来。第二个部分，猫品种分类器，判断它是否是暹罗猫。花费数年时间改进这两个流水线组件中的任何一个都是可能的。你如何决定关注哪个组件？


    通过进行 **按部分进行错误分析**，你可以尝试将算法犯的每个错误归因于流水线两个部分中的一个（有时是两者）。例如，算法将此图像错误分类为不包含暹罗猫 (y=0)，尽管正确标签是
    y=1。


    ![](img/bef73f83187c4fb59f46276044c2c531_105_1.png)


    让我们手动检查算法的两个步骤做了什么。假设暹罗猫检测器检测到猫如下：


    ![](img/bef73f83187c4fb59f46276044c2c531_106_0.png)


    这意味着猫品种分类器得到以下图像：


    ![](img/bef73f83187c4fb59f46276044c2c531_106_1.png)


    猫品种分类器随后正确地将此图像分类为不包含暹罗猫。

    因此，猫品种分类器是无辜的：它被给予了一堆岩石并输出了一个非常合理的标签 y=0。事实上，一个对上述裁剪图像进行分类的人也会预测 y=0。因此，你可以清楚地将此错误归因于猫检测器。


    如果另一方面，猫检测器输出了以下边界框：


    ![](img/bef73f83187c4fb59f46276044c2c531_106_2.png)


    那么你会得出结论猫检测器已完成其工作，而猫品种分类器有问题。


    假设你检查了 100 张被错误分类的开发集图像，发现 90 个错误可归因于猫检测器，只有 10 个错误可归因于猫品种分类器。

    你可以安全地得出结论，你应该更关注改进猫检测器。


    此外，你现在也方便地找到了 90 个猫检测器输出了错误边界框的示例。你可以使用这 90 个示例对猫检测器进行更深入的错误分析，以了解如何改进它。


    到目前为止，我们对如何将错误归因于流水线某一部分的描述是非正式的：你查看每个部分的输出，看看是否能判断哪个部分犯了错误。这种非正式方法可能已经足够你使用。但在下一章，你也会看到一种更正式的归因错误的方法。


    ## 54 将错误归因于某一部分


    让我们继续使用这个示例：


    ![](img/bef73f83187c4fb59f46276044c2c531_108_0.png)


    假设猫检测器输出了这个边界框：


    ![](img/bef73f83187c4fb59f46276044c2c531_108_1.png)


    因此猫品种分类器得到这个裁剪图像，随后错误地输出 y=0，即图片中没有猫。


    ![](img/bef73f83187c4fb59f46276044c2c531_108_2.png)


    猫检测器做得不好。然而，一个技艺高超的人或许仍能从裁剪不佳的图像中识别出暹罗猫。那么我们应该将此错误归因于猫检测器，还是猫品种分类器，或两者兼有？这是模糊的。


    如果像这样的模糊案例数量很少，你可以做出任何决定并得到类似的结果。但这里有一个更正式的测试，可以让你更明确地将错误归因于确切的一个部分：


    - 1. 用手工标注的边界框替换猫检测器的输出。


    ![](img/bef73f83187c4fb59f46276044c2c531_109_0.png)


    - 2. 将对应的裁剪图像通过猫品种分类器运行。如果猫品种分类器仍然将其错误分类，则将错误归因于猫品种分类器。否则，将错误归因于猫检测器。


    换句话说，进行一个实验，给猫品种分类器一个“完美”的输入。有两种情况：


    - Case 1: 即使给出“完美”的边界框，猫品种分类器仍然错误地输出 y=0。在这种情况下，显然猫品种分类器有问题。

    - Case 2: 给出“完美”的边界框后，品种分类器现在正确地输出 y=1。这表明如果猫检测器只提供更完美的边界框，那么整个系统的输出就会正确。因此，将错误归因于猫检测器。


    通过对被错误分类的开发集图像进行此分析，你现在可以明确地将每个错误归因于一个组件。这使你能够估计流水线每个组件导致的错误比例，从而决定将注意力集中在哪里。

    '
