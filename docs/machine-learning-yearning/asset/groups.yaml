    by the human pilot, and let T_out be the trajectory achieved by the algorithm.
    According to our description above, T_human is a superior trajectory to T_out.
    Thus, the key test is the following: Does it hold true that R(T_human) > R(T_out)?


    Case 1: If this inequality holds, then the reward function R(.) is correctly rating
    T_human as superior to T_out. But our reinforcement learning algorithm is finding
    the inferior T_out. This suggests that working on improving our reinforcement
    learning algorithm is worthwhile.


    Case 2: The inequality does not hold: R(T_human) ≤ R(T_out). This means R(.) assigns
    a worse score to T_human even though it is the superior trajectory. You should
    work on improving R(.) to better capture the tradeoffs that correspond to a good
    landing.


    Many machine learning applications have this “pattern” of optimizing an approximate
    scoring function Score_x(.) using an approximate search algorithm. Sometimes,
    there is no specified input x, so this reduces to just Score(.). In our example
    above, the scoring function was the reward function Score(T)=R(T), and the optimization
    algorithm was the reinforcement learning algorithm trying to execute a good trajectory
    T.


    One difference between this and earlier examples is that, rather than comparing
    to an “optimal” output, you were instead comparing to human-level performance
    T_human. We assumed T_human is pretty good, even if not optimal. In general, so
    long as you have some y* (in this example, T_human) that is a superior output
    to the performance of your current learning algorithm—even if it is not the “optimal”
    output—then the Optimization Verification test can indicate whether it is more
    promising to improve the optimization algorithm or the scoring function.


    ## End-to-end deep learning


    ### 47 The rise of end-to-end learning


    Suppose you want to build a system to examine online product reviews and automatically
    tell you if the writer liked or disliked that product. For example, you hope to
    recognize the following review as highly positive:


    This is a great mop!


    and the following as highly negative:


    This mop is low quality--I regret buying it.


    The problem of recognizing positive vs. negative opinions is called “sentiment
    classification.” To build this system, you might build a “pipeline” of two components:


    - 1. Parser: A system that annotates the text with information identifying the
    most important words.¹⁵ For example, you might use the parser to label all the
    adjectives and nouns. You would therefore get the following annotated text:

    - This is a great<sub>Adjective</sub> mop<sub>Noun</sub>!

    - 2. Sentiment classifier: A learning algorithm that takes as input the annotated
    text and predicts the overall sentiment. The parser’s annotation could help this
    learning algorithm greatly: By giving adjectives a higher weight, your algorithm
    will be able to quickly hone in on the important words such as “great,” and ignore
    less important words such as “this.”


    We can visualize your “pipeline” of two components as follows:


    ![](img/bef73f83187c4fb59f46276044c2c531_90_0.png)


    There has been a recent trend toward replacing pipeline systems with a single
    learning algorithm. An end-to-end learning algorithm for this task would simply
    take as input the raw, original text “This is a great mop!”, and try to directly
    recognize the sentiment:


    ¹⁵ A parser gives a much richer annotation of the text than this, but this simplified
    description will suffice for explaining end-to-end deep learning.


    ![](img/bef73f83187c4fb59f46276044c2c531_91_0.png)


    Neural networks are commonly used in end-to-end learning systems. The term “end-to-end”
    refers to the fact that we are asking the learning algorithm to go directly from
    the input to the desired output. I.e., the learning algorithm directly connects
    the “input end” of the system to the “output end.”


    In problems where data is abundant, end-to-end systems have been remarkably successful.
    But they are not always a good choice. The next few chapters will give more examples
    of end-to-end systems as well as give advice on when you should and should not
    use them.

