    ![](img/bef73f83187c4fb59f46276044c2c531_87_0.png)


    假设你正在使用机器学习教直升机执行复杂机动。以下是计算机控制的直升机在发动机关闭的情况下执行降落的延时照片。


    这被称为“自转”机动。它允许直升机即使发动机意外失效也能着陆。人类飞行员在训练中会练习这种机动。你的目标是使用学习算法让直升机沿着轨迹 T 飞行并最终安全着陆。


    要应用强化学习，你必须开发一个“奖励函数” R(.)，它给出衡量每种可能轨迹 T 好坏的分数。例如，如果 T 导致直升机坠毁，那么奖励可能是 R(T) =
    -1,000——一个巨大的负奖励。导致安全着陆的轨迹 T 可能会产生正的 R(T)，其具体数值取决于着陆的平稳程度。奖励函数 R(.) 通常由人工选择来量化不同轨迹
    T 的期望程度。它必须权衡着陆的颠簸程度、直升机是否恰好降落在期望位置、乘客下降过程中的颠簸程度等等。设计好的奖励函数并不容易。


    给定一个奖励函数 R(T)，强化学习算法的工作是控制直升机使其实现 max_T R(T)。然而，强化学习算法会做出许多近似，可能无法实现这种最大化。


    假设你选择了一些奖励 R(.) 并运行了你的学习算法。然而，其性能看起来远不如你的人类飞行员——着陆更颠簸，似乎也不如人类飞行员安全。你如何判断过错在于试图执行实现
    max_T R(T) 的轨迹的强化学习算法，还是在于试图衡量并指定颠簸程度与着陆点精度之间理想权衡的奖励函数？


    要应用优化验证测试，设 T_human 为人类飞行员实现的轨迹，设 T_out 为算法实现的轨迹。根据我们上面的描述，T_human 是优于 T_out 的轨迹。因此，关键测试如下：是否成立
    R(T_human) > R(T_out)？


    Case 1：如果该不等式成立，则奖励函数 R(.) 正确地将 T_human 评为优于 T_out。但我们的强化学习算法找到了劣等的 T_out。这表明改进强化学习算法是值得的。


    Case 2：不等式不成立：R(T_human) ≤ R(T_out)。这意味着 R(.) 给 T_human 分了更差的分数，尽管它是更优的轨迹。你应改进
    R(.) 以更好地捕捉对应于良好着陆的权衡。


    许多机器学习应用都有这种“模式”：使用近似搜索算法优化近似评分函数 Score_x(.)。有时没有指定的输入 x，这就简化为只是 Score(.)。在我们上面的例子中，评分函数是奖励函数
    Score(T)=R(T)，优化算法是试图执行良好轨迹 T 的强化学习算法。


    与早期示例的一个不同之处在于，与比较“最优”输出不同，你是与人类水平性能 T_human 进行比较。我们假设 T_human 相当不错，即使不是最优。一般来说，只要你有一些
    y*（在此例中为 T_human）是优于当前学习算法性能的输出——即使它不是“最优”输出——优化验证测试就可以指示改进优化算法还是评分函数更有前景。


    ## End-to-end deep learning


    ### 47 The rise of end-to-end learning


    假设你想构建一个系统来检查在线产品评论并自动判断作者是否喜欢或不喜欢该产品。例如，你希望将以下评论识别为高度正面：


    This is a great mop!


    以及以下评论识别为高度负面：


    This mop is low quality--I regret buying it.


    识别正面与负面意见的问题称为“sentiment classification”。要构建此系统，你可能会构建由两个组件组成的“pipeline”：


    - 1. Parser：一个用信息标注文本以识别最重要的词的系统。¹⁵ 例如，你可能会使用解析器来标记所有形容词和名词。你因此会得到以下标注文本：

    - This is a great<sub>Adjective</sub> mop<sub>Noun</sub>!

    - 2. Sentiment classifier：一个学习算法，其输入为标注文本并预测整体情感。解析器的标注可以极大地帮助该学习算法：通过给形容词更高权重，你的算法能够迅速聚焦于“great”等重要词，并忽略“this”等不太重要的词。


    我们可以将你的两个组件的“pipeline”可视化如下：


    ![](img/bef73f83187c4fb59f46276044c2c531_90_0.png)


    最近出现了一种趋势，用单一学习算法取代 pipeline 系统。对于此任务的端到端学习算法只需将原始原始文本“This is a great mop!”作为输入，并尝试直接识别情感：


    ¹⁵ 解析器对文本的标注比这丰富得多，但这种简化描述足以解释端到端深度学习。


    ![](img/bef73f83187c4fb59f46276044c2c531_91_0.png)


    神经网络在端到端学习系统中常用。“端到端”指的是我们要求学习算法直接从输入到期望输出。也就是说，学习算法直接连接系统的“输入端”到“输出端”。


    在数据充足的问题中，端到端系统取得了显著成功。但它们并不总是好的选择。接下来的几章将给出更多端到端系统的例子，并提供关于何时应使用以及不应使用它们的建议。

    '
