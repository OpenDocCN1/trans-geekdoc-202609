    ## 35 Surpassing human-level performance


    You are working on speech recognition and have a dataset of audio clips. Suppose
    your dataset has many noisy audio clips so that even humans have 10% error. Suppose
    your system already achieves 8% error. Can you use any of the three techniques
    described in Chapter 33 to continue making rapid progress?


    If you can identify a subset of data in which humans significantly surpass your
    system, then you can still use those techniques to drive rapid progress. For example,
    suppose your system is much better than people at recognizing speech in noisy
    audio, but humans are still better at transcribing very rapidly spoken speech.


    For the subset of data with rapidly spoken speech:


    - 1. You can still obtain transcripts from humans that are higher quality than
    your algorithm’s output.

    - 2. You can draw on human intuition to understand why they correctly heard a
    rapidly spoken utterance when your system didn’t.

    - 3. You can use human-level performance on rapidly spoken speech as a desired
    performance target.


    More generally, so long as there are dev set examples where humans are right and
    your algorithm is wrong, then many of the techniques described earlier will apply.
    This is true even if, averaged over the entire dev/test set, your performance
    is already surpassing human-level performance.


    There are many important machine learning applications where machines surpass
    human level performance. For example, machines are better at predicting movie
    ratings, how long it takes for a delivery car to drive somewhere, or whether to
    approve loan applications. Only a subset of techniques apply once humans have
    a hard time identifying examples that the algorithm is clearly getting wrong.
    Consequently, progress is usually slower on problems where machines already surpass
    human-level performance, while progress is faster when machines are still trying
    to catch up to humans.


    ## Training and testing on different distributions


    But in the era of big data, we now have access to huge training sets, such as
    cat internet images. Even if the training set comes from a different distribution
    than the dev/test set, we still want to use it for learning since it can provide
    a lot of information.


    For the cat detector example, instead of putting all 10,000 user-uploaded images
    into the dev/test sets, we might instead put 5,000 into the dev/test sets. We
    can put the remaining 5,000 user-uploaded examples into the training set. This
    way, your training set of 205,000 examples contains some data that comes from
    your dev/test distribution along with the 200,000 internet images. We will discuss
    in a later chapter why this method is helpful.


    Let’s consider a second example. Suppose you are building a speech recognition
    system to transcribe street addresses for a voice-controlled mobile map/navigation
    app. You have 20,000 examples of users speaking street addresses. But you also
    have 500,000 examples of other audio clips with users speaking about other topics.
    You might take 10,000 examples of street addresses for the dev/test sets, and
    use the remaining 10,000, plus the additional 500,000 examples, for training.


    We will continue to assume that your dev data and your test data come from the
    same distribution. But it is important to understand that different training and
    dev/test distributions offer some special challenges.


    ## 37 How to decide whether to use all your data


    Suppose your cat detector’s training set includes 10,000 user-uploaded images.
    This data comes from the same distribution as a separate dev/test set, and represents
    the distribution you care about doing well on. You also have an additional 20,000
    images downloaded from the internet. Should you provide all 20,000+10,000=30,000
    images to your learning algorithm as its training set, or discard the 20,000 internet
    images for fear of it biasing your learning algorithm?


    When using earlier generations of learning algorithms (such as hand-designed computer
    vision features, followed by a simple linear classifier) there was a real risk
    that merging both types of data would cause you to perform worse. Thus, some engineers
    will warn you against including the 20,000 internet images.


    But in the modern era of powerful, flexible learning algorithms—such as large
    neural networks—this risk has greatly diminished. If you can afford to build a
    neural network with a large enough number of hidden units/layers, you can safely
    add the 20,000 images to your training set. Adding the images is more likely to
    increase your performance.


    This observation relies on the fact that there is some x → y mapping that works
    well for both types of data. In other words, there exists some system that inputs
    either an internet image or a mobile app image and reliably predicts the label,
    even without knowing the source of the image.


    Adding the additional 20,000 images has the following effects:


    - 1. It gives your neural network more examples of what cats do/do not look like.
    This is helpful, since internet images and user-uploaded mobile app images do
    share some similarities. Your neural network can apply some of the knowledge acquired
    from internet images to mobile app images.

    - 2. It forces the neural network to expend some of its capacity to learn about
    properties that are specific to internet images (such as higher resolution, different
    distributions of how the images are framed, etc.) If these properties differ greatly
    from mobile app images, it will “use up” some of the representational capacity
    of the neural network. Thus there is less capacity for recognizing data drawn
    from the distribution of mobile app images, which is what you really care about.
    Theoretically, this could hurt your algorithms’ performance.


    To describe the second effect in different terms, we can turn to the fictional
    character Sherlock Holmes, who says that your brain is like an attic; it only
    has a finite amount of space. He says that “for every addition of knowledge, you
    forget something that you knew before. It is of the highest importance, therefore,
    not to have useless facts elbowing out the useful ones.”¹²


    Fortunately, if you have the computational capacity needed to build a big enough
    neural network—i.e., a big enough attic—then this is not a serious concern. You
    have enough capacity to learn from both internet and from mobile app images, without
    the two types of data competing for capacity. Your algorithm’s “brain” is big
    enough that you don’t have to worry about running out of attic space.


    But if you do not have a big enough neural network (or another highly flexible
    learning algorithm), then you should pay more attention to your training data
    matching your dev/test set distribution.


    If you think you have data that has no benefit, you should just leave out that
    data for computational reasons. For example, suppose your dev/test sets contain
    mainly casual pictures of people, places, landmarks, animals. Suppose you also
    have a large collection of scanned historical documents:


    ![](img/bef73f83187c4fb59f46276044c2c531_73_0.png)


    These documents don’t contain anything resembling a cat. They also look completely
    unlike your dev/test distribution. There is no point including this data as negative
    examples, because the benefit from the first effect above is negligible—there
    is almost nothing your neural network can learn from this data that it can apply
    to your dev/test set distribution. Including them would waste computation resources
    and representation capacity of the neural network.


    ## 38 How to decide whether to include inconsistent data


    Suppose you want to learn to predict housing prices in New York City. Given the
    size of a house (input feature x), you want to predict the price (target label
    y).


    Housing prices in New York City are very high. Suppose you have a second dataset
    of housing prices in Detroit, Michigan, where housing prices are much lower. Should
    you include this data in your training set?


    Given the same size x, the price of a house y is very different depending on whether
    it is in New York City or in Detroit. If you only care about predicting New York
    City housing prices, putting the two datasets together will hurt your performance.
    In this case, it would be better to leave out the inconsistent Detroit data.¹³


    How is this New York City vs. Detroit example different from the mobile app vs.
    internet cat images example?


    The cat image example is different because, given an input picture x, one can
    reliably predict the label y indicating whether there is a cat, even without knowing
    if the image is an internet image or a mobile app image. I.e., there is a function
    f(x) that reliably maps from the input x to the target output y, even without
    knowing the origin of x. Thus, the task of recognition from internet images is
    “consistent” with the task of recognition from mobile app images. This means there
    was little downside (other than computational cost) to including all the data,
    and some possible significant upside. In contrast, New York City and Detroit,
    Michigan data are not consistent. Given the same x (size of house), the price
    is very different depending on where the house is.


    ¹³ There is one way to address the problem of Detroit data being inconsistent
    with New York City data, which is to add an extra feature to each training example
    indicating the city. Given an input x—which now specifies the city—the target
    value of y is now unambiguous. However, in practice I do not see this done frequently.

