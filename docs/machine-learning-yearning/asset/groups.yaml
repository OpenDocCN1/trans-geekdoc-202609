  mdcn: '


    ## 27 种降低方差的技术


    如果你的学习算法存在高方差问题，可以尝试以下技术：


    - 添加更多训练数据：这是解决方差最简单、最可靠的方法，前提是你能够获得显著更多的数据，并且有足够的计算能力来处理这些数据。


    - 添加正则化（L2 正则化、L1 正则化、随机失活）：这种技术能降低方差，但会增加偏差。


    - 添加早停法（即根据开发集误差提前停止梯度下降）：这种技术能降低方差，但会增加偏差。早停法的行为与正则化方法非常相似，有些作者称其为一种正则化技术。


    - 特征选择以减少输入特征的数量/类型：这种技术可能有助于解决方差问题，但也可能增加偏差。稍微减少特征数量（比如从 1,000 个特征减到 900 个）不太可能对偏差产生巨大影响。大幅减少特征数量（例如从
    1,000 个特征减到 100 个——减少 10 倍）则更可能产生显著影响，前提是你没有排除太多有用的特征。在现代深度学习中，当数据充足时，人们已经不再强调特征选择，而是更倾向于把所有特征都交给算法，让算法根据数据自行决定使用哪些特征。但当你的训练集较小时，特征选择可能非常有用。


    - 减小模型规模（例如神经元/层数）：请谨慎使用。这种技术能在可能增加偏差的同时降低方差。不过，我不推荐用这种技术来解决方差问题。添加正则化通常能带来更好的分类性能。减小模型规模的优点在于降低计算成本，从而加快模型训练速度。如果加快模型训练是有用的，那么完全可以考虑减小模型规模。但如果你的目标是降低方差，并且不在意计算成本，那么可以考虑改而添加正则化。


    以下是上一章讨论解决偏差问题时提到过的另外两种策略：


    - 根据误差分析的洞察修改输入特征：比如，误差分析启发你创建一些附加特征，帮助算法消除某一类特定错误。这些新特征可能同时有助于解决偏差和方差问题。理论上，添加更多特征可能会增加方差；但如果你发现确实如此，可以使用正则化，这通常能消除方差增加的问题。


    - **修改模型架构**（如神经网络架构），使其更适合你的问题：这种技术能同时影响偏差和方差。


    ## 28 诊断偏差和方差：学习曲线


    我们已经了解了一些估算多少误差可归因于可避免偏差与方差的方法。我们通过估算最优错误率，并计算算法在训练集和开发集上的误差来做到这一点。下面我们来讨论一种信息量更大的技术：绘制学习曲线。


    学习曲线将开发集误差作为训练样本数量的函数绘制出来。为了绘制它，你需要使用不同的训练集规模来运行算法。例如，如果你有 1,000 个样本，你可能要在 100、200、300、...、1000
    个样本上分别训练算法副本。然后你就可以绘制开发集误差如何随训练集规模变化。下面是一个示例：


    ![](img/bef73f83187c4fb59f46276044c2c531_55_0.png)


    随着训练集规模增大，开发集误差应该降低。


    我们通常会有某个“期望错误率”，希望学习算法最终能达到。例如：


    - 如果我们追求人类水平的性能，那么人类错误率就可以作为“期望错误率”。

    - 如果我们的学习算法服务于某个产品（比如推送猫咪图片），我们可能对需要达到什么样的性能水平才能给用户良好的体验有所直觉。

    - 如果你在一个重要应用上工作了很久，你可能对下一个季度/年还能合理取得多少进展有所判断。


    将期望的性能水平添加到你的学习曲线中：


    ![](img/bef73f83187c4fb59f46276044c2c531_56_0.png)


    你可以通过目测外推红色“开发误差”曲线，猜测添加更多数据后，你能离期望性能水平近多少。在上面的例子中，看起来如果训练集规模翻倍，你有可能达到期望性能。


    但如果开发误差曲线已经“趋于平缓”（即变平），那么你马上就能判断，添加更多数据无法让你达到目标：


    ![](img/bef73f83187c4fb59f46276044c2c531_56_1.png)


    因此，查看学习曲线可能帮助你避免花费数月时间收集两倍的训练数据，却最终发现它无济于事。


    这个过程的一个缺点是，如果你只看开发误差曲线，很难外推并准确预测如果有更多数据红色曲线会走向哪里。还有一个额外绘图可以帮助你估计添加更多数据的影响：训练误差。


    ## 29 绘制训练误差


    你的开发集（和测试集）误差应该随训练集规模增大而下降。但你的训练集误差通常会随训练集规模增大而*增加*。


    下面用一个例子说明这种效应。假设你的训练集只有 2 个样本：一张猫的图片和一张非猫的图片。那么学习算法很容易“记住”训练集中的两个样本，并取得 0% 的训练集误差。即使其中一个或两个训练样本的标签有误，算法仍然很容易记住这两个标签。


    现在假设你的训练集有 100 个样本。也许即使有少数样本被错误标记或存在歧义——比如一些图像非常模糊，连人都不清楚是否含有猫。学习算法也许仍然能“记住”训练集的大部分或全部内容，但现在想获得
    100% 的准确率就更难了。通过将训练集从 2 个样本增加到 100 个样本，你会发现训练集准确率会略有下降。


    最后，假设你的训练集有 10,000 个样本。在这种情况下，算法要完美拟合全部 10,000 个样本就更难了，尤其是一些样本存在歧义或被错误标记。因此，你的学习算法在这个训练集上的表现会更差。


    让我们在之前的图中加入训练误差的曲线：


    ![](img/bef73f83187c4fb59f46276044c2c531_58_0.png)


    你可以看到，蓝色“训练误差”曲线随训练集规模的增大而上升。此外，你的算法通常在训练集上的表现优于开发集；因此，红色开发误差曲线通常严格位于蓝色训练误差曲线上方。


    接下来，我们来讨论如何解读这些图。


    ## 30 解读学习曲线：高偏差


    假设你的开发误差曲线如下所示：


    ![](img/bef73f83187c4fb59f46276044c2c531_59_0.png)


    我们之前说过，如果你的开发误差曲线趋于平缓，仅靠添加数据不太可能达到期望性能。


    但很难准确知道红色开发误差曲线外推后会是什么样子。如果开发集很小，你会更不确定，因为曲线可能会有噪声。


    假设我们在这张图中加入训练误差曲线，得到下图：


    ![](img/bef73f83187c4fb59f46276044c2c531_59_1.png)


    现在，你可以绝对肯定，仅仅添加更多数据是不够的。这是为什么呢？回想我们的两条观察结果：


    - 随着我们添加更多训练数据，训练误差只会变得更差。因此，蓝色训练误差曲线只能保持不变或继续走高，因而只会离（绿线代表的）期望性能水平越来越远。

    - 红色开发误差曲线通常高于蓝色训练误差。因此，当训练误差都已经高于期望性能水平时，添加更多数据几乎不可能让红色开发误差曲线下降到期望性能水平。


    在同一张图中同时检查开发误差曲线和训练误差曲线，可以让我们更有信心地外推开发误差曲线。


    假设为了讨论方便，期望性能就是我们估计的最优错误率。那么上图就是高可避免偏差学习曲线的标准“教科书”式示例：在最大的训练集规模上——大概对应我们拥有的全部训练数据——训练误差与期望性能之间存在很大的差距，表明存在较大的可避免偏差。此外，训练曲线与开发曲线之间的差距很小，表明方差较小。


    之前，我们只在本图最右边的点测量训练集和开发集误差，这对应使用所有可用的训练数据。绘制完整的学习曲线可以让我们更全面地了解算法在不同训练集规模下的表现。


    '
