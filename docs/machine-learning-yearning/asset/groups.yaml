    # 6 Your dev and test sets should come from the same distribution


    ![](img/bef73f83187c4fb59f46276044c2c531_16_0.png)


    You have your cat app image data segmented into four regions, based on your largest
    markets: (i) US, (ii) China, (iii) India, and (iv) Other. To come up with a dev
    set and a test set, say we put US and India in the dev set; China and Other in
    the test set. In other words, we can randomly assign two of these segments to
    the dev set, and the other two to the test set, right?


    Once you define the dev and test sets, your team will be focused on improving
    dev set performance. Thus, the dev set should reflect the task you want to improve
    on the most: To do well on all four geographies, and not only two.


    There is a second problem with having different dev and test set distributions:
    There is a chance that your team will build something that works well on the dev
    set, only to find that it does poorly on the test set. I''ve seen this result
    in much frustration and wasted effort. Avoid letting this happen to you.


    As an example, suppose your team develops a system that works well on the dev
    set but not the test set. If your dev and test sets had come from the same distribution,
    then you would have a very clear diagnosis of what went wrong: You have overfit
    the dev set. The obvious cure is to get more dev set data.


    But if the dev and test sets come from different distributions, then your options
    are less clear. Several things could have gone wrong:


    +   1. You had overfit to the dev set.

    +   2. The test set is harder than the dev set. So your algorithm might be doing
    as well as could be expected, and no further significant improvement is possible.'
  - '[PAGE 17]


    +   3. The test set is not necessarily harder, but just different, from the dev
    set. So what works well on the dev set just does not work well on the test set.
    In this case, a lot of your work to improve dev set performance might be wasted
    effort.


    Working on machine learning applications is hard enough. Having mismatched dev
    and test sets introduces additional uncertainty about whether improving on the
    dev set distribution also improves test set performance. Having mismatched dev
    and test sets makes it harder to figure out what is and isn’t working, and thus
    makes it harder to prioritize what to work on.


    If you are working on a 3rd party benchmark problem, their creator might have
    specified dev and test sets that come from different distributions. Luck, rather
    than skill, will have a greater impact on your performance on such benchmarks
    compared to if the dev and test sets come from the same distribution. It is an
    important research problem to develop learning algorithms that are trained on
    one distribution and generalize well to another. But if your goal is to make progress
    on a specific machine learning application rather than make research progress,
    I recommend trying to choose dev and test sets that are drawn from the same distribution.
    This will make your team more efficient.'
  - '[PAGE 18]


    # 7 How large do the dev/test sets need to be?


    The dev set should be large enough to detect differences between algorithms that
    you are trying out. For example, if classifier A has an accuracy of 90.0% and
    classifier B has an accuracy of 90.1%, then a dev set of 100 examples would not
    be able to detect this 0.1% difference. Compared to other machine learning problems
    I’ve seen, a 100 example dev set is small. Dev sets with sizes from 1,000 to 10,000
    examples are common. With 10,000 examples, you will have a good chance of detecting
    an improvement of 0.1%.²


    For mature and important applications—for example, advertising, web search, and
    product recommendations—I have also seen teams that are highly motivated to eke
    out even a 0.01% improvement, since it has a direct impact on the company’s profits.
    In this case, the dev set could be much larger than 10,000, in order to detect
    even smaller improvements.


    How about the size of the test set? It should be large enough to give high confidence
    in the overall performance of your system. One popular heuristic had been to use
    30% of your data for your test set. This works well when you have a modest number
    of examples—say 100 to 10,000 examples. But in the era of big data where we now
    have machine learning problems with sometimes more than a billion examples, the
    fraction of data allocated to dev/test sets has been shrinking, even as the absolute
    number of examples in the dev/test sets has been growing. There is no need to
    have excessively large dev/test sets beyond what is needed to evaluate the performance
    of your algorithms.


    ² In theory, one could also test if a change to an algorithm makes a statistically
    significant difference on the dev set. In practice, most teams don’t bother with
    this (unless they are publishing academic research papers), and I usually do not
    find statistical significance tests useful for measuring interim progress.'
