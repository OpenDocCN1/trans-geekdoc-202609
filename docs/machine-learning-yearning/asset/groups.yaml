    ## 23 Addressing Bias and Variance


    Here is the simplest formula for addressing bias and variance issues:


    - If you have high avoidable bias, increase the size of your model (for example,
    increase the size of your neural network by adding layers/neurons).

    - If you have high variance, add data to your training set.


    If you are able to increase the neural network size and increase training data
    without limit, it is possible to do very well on many learning problems.


    In practice, increasing the size of your model will eventually cause you to run
    into computational problems because training very large models is slow. You might
    also exhaust your ability to acquire more training data. (Even on the internet,
    there is only a finite number of cat pictures!)


    Different model architectures—for example, different neural network architectures—will
    have different amounts of bias/variance for your problem. A lot of recent deep
    learning research has developed many innovative model architectures. So if you
    are using neural networks, the academic literature can be a great source of inspiration.
    There are also many great open-source implementations on github. But the results
    of trying new architectures are less predictable than the simple formula of increasing
    the model size and adding data.


    Increasing the model size generally reduces bias, but it might also increase variance
    and the risk of overfitting. However, this overfitting problem usually arises
    only when you are not using regularization. If you include a well-designed regularization
    method, then you can usually safely increase the size of the model without increasing
    overfitting.


    Suppose you are applying deep learning, with L2 regularization or dropout, with
    the regularization parameter that performs best on the dev set. If you increase
    the model size, usually your performance will stay the same or improve; it is
    unlikely to worsen significantly. The only reason to avoid using a bigger model
    is the increased computational cost.


    ## 24 Bias vs. Variance tradeoff


    You might have heard of the “Bias vs. Variance tradeoff.” Of the changes you could
    make to most learning algorithms, there are some that reduce bias errors but at
    the cost of increasing variance, and vice versa. This creates a “trade off” between
    bias and variance.


    For example, increasing the size of your model—adding neurons/layers in a neural
    network, or adding input features—generally reduces bias but could increase variance.
    Alternatively, adding regularization generally increases bias but reduces variance.


    In the modern era, we often have access to plentiful data and can use very large
    neural networks (deep learning). Therefore, there is less of a tradeoff, and there
    are now more options for reducing bias without hurting variance, and vice versa.


    For example, you can usually increase a neural network size and tune the regularization
    method to reduce bias without noticeably increasing variance. By adding training
    data, you can also usually reduce variance without affecting bias.


    If you select a model architecture that is well suited for your task, you might
    also reduce bias and variance simultaneously. Selecting such an architecture can
    be difficult.


    In the next few chapters, we discuss additional specific techniques for addressing
    bias and variance.


    ## 25 Techniques for reducing avoidable bias


    If your learning algorithm suffers from high avoidable bias, you might try the
    following techniques:


    - **Increase the model size** (such as number of neurons/layers): This technique
    reduces bias, since it should allow you to fit the training set better. If you
    find that this increases variance, then use regularization, which will usually
    eliminate the increase in variance.

    - **Modify input features based on insights from error analysis**: Say your error
    analysis inspires you to create additional features that help the algorithm eliminate
    a particular category of errors. (We discuss this further in the next chapter.)
    These new features could help with both bias and variance. In theory, adding more
    features could increase the variance; but if you find this to be the case, then
    use regularization, which will usually eliminate the increase in variance.

    - **Reduce or eliminate regularization** (L2 regularization, L1 regularization,
    dropout): This will reduce avoidable bias, but increase variance.

    - **Modify model architecture** (such as neural network architecture) so that
    it is more suitable for your problem: This technique can affect both bias and
    variance.


    One method that is not helpful:


    - **Add more training data**: This technique helps with variance problems, but
    it usually has no significant effect on bias.

