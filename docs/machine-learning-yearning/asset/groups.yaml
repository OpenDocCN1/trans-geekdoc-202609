    ## 48 More end-to-end learning examples


    Suppose you want to build a speech recognition system. You might build a system
    with three components:


    ![](img/bef73f83187c4fb59f46276044c2c531_92_0.png)


    The components work as follows:


    - 1. Compute features: Extract hand-designed features, such as MFCC (Mel-frequency
    cepstrum coefficients) features, which try to capture the content of an utterance
    while disregarding less relevant properties, such as the speaker’s pitch.

    - 2. Phoneme recognizer: Some linguists believe that there are basic units of
    sound called “phonemes.” For example, the initial “k” sound in “keep” is the same
    phoneme as the “c” sound in “cake.” This system tries to recognize the phonemes
    in the audio clip.

    - 3. Final recognizer: Take the sequence of recognized phonemes, and try to string
    them together into an output transcript.


    In contrast, an end-to-end system might input an audio clip, and try to directly
    output the transcript:


    ![](img/bef73f83187c4fb59f46276044c2c531_92_1.png)


    So far, we have only described machine learning “pipelines” that are completely
    linear: the output is sequentially passed from one stage to the next. Pipelines
    can be more complex. For example, here is a simple architecture for an autonomous
    car:


    ![](img/bef73f83187c4fb59f46276044c2c531_92_2.png)


    It has three components: One detects other cars using the camera images; one detects
    pedestrians; then a final component plans a path for our own car that avoids the
    cars and pedestrians.


    Not every component in a pipeline has to be learned. For example, the literature
    on “robot motion planning” has numerous algorithms for the final path planning
    step for the car. Many of these algorithms do not involve learning.


    In contrast, an end-to-end approach might try to take in the sensor inputs and
    directly output the steering direction:


    ![](img/bef73f83187c4fb59f46276044c2c531_93_0.png)


    Even though end-to-end learning has seen many successes, it is not always the
    best approach. For example, end-to-end speech recognition works well. But I’m
    skeptical about end-to-end learning for autonomous driving. The next few chapters
    explain why.


    ## 49 Pros and cons of end-to-end learning


    Consider the same speech pipeline from our earlier example:


    ![](img/bef73f83187c4fb59f46276044c2c531_94_0.png)


    Many parts of this pipeline were “hand-engineered”:


    - MFCCs are a set of hand-designed audio features. Although they provide a reasonable
    summary of the audio input, they also simplify the input signal by throwing some
    information away.

    - Phonemes are an invention of linguists. They are an imperfect representation
    of speech sounds. To the extent that phonemes are a poor approximation of reality,
    forcing an algorithm to use a phoneme representation will limit the speech system’s
    performance.


    These hand-engineered components limit the potential performance of the speech
    system. However, allowing hand-engineered components also has some advantages:


    - The MFCC features are robust to some properties of speech that do not affect
    the content, such as speaker pitch. Thus, they help simplify the problem for the
    learning algorithm.

    - To the extent that phonemes are a reasonable representation of speech, they
    can also help the learning algorithm understand basic sound components and therefore
    improve its performance.


    Having more hand-engineered components generally allows a speech system to learn
    with less data. The hand-engineered knowledge captured by MFCCs and phonemes “supplements”
    the knowledge our algorithm acquires from data. When we don’t have much data,
    this knowledge is useful.


    Now, consider the end-to-end system:


    ![](img/bef73f83187c4fb59f46276044c2c531_94_1.png)


    This system lacks the hand-engineered knowledge. Thus, when the training set is
    small, it might do worse than the hand-engineered pipeline.


    However, when the training set is large, then it is not hampered by the limitations
    of an MFCC or phoneme-based representation. If the learning algorithm is a large-enough
    neural network and if it is trained with enough training data, it has the potential
    to do very well, and perhaps even approach the optimal error rate.


    End-to-end learning systems tend to do well when there is a lot of labeled data
    for “both ends”—the input end and the output end. In this example, we require
    a large dataset of (audio, transcript) pairs. When this type of data is not available,
    approach end-to-end learning with great caution.


    If you are working on a machine learning problem where the training set is very
    small, most of your algorithm’s knowledge will have to come from your human insight.
    I.e., from your “hand engineering” components.


    If you choose not to use an end-to-end system, you will have to decide what are
    the steps in your pipeline, and how they should plug together. In the next few
    chapters, we’ll give some suggestions for designing such pipelines.


    ## 50 Choosing pipeline components: Data availability


    When building a non-end-to-end pipeline system, what are good candidates for the
    components of the pipeline? How you design the pipeline will greatly impact the
    overall system’s performance. One important factor is whether you can easily collect
    data to train each of the components.


    For example, consider this autonomous driving architecture:


    ![](img/bef73f83187c4fb59f46276044c2c531_96_0.png)


    You can use machine learning to detect cars and pedestrians. Further, it is not
    hard to obtain data for these: There are numerous computer vision datasets with
    large numbers of labeled cars and pedestrians. You can also use crowdsourcing
    (such as Amazon Mechanical Turk) to obtain even larger datasets. It is thus relatively
    easy to obtain training data to build a car detector and a pedestrian detector.


    In contrast, consider a pure end-to-end approach:


    ![](img/bef73f83187c4fb59f46276044c2c531_96_1.png)


    To train this system, we would need a large dataset of (Image, Steering Direction)
    pairs. It is very time-consuming and expensive to have people drive cars around
    and record their steering direction to collect such data. You need a fleet of
    specially-instrumented cars, and a huge amount of driving to cover a wide range
    of possible scenarios. This makes an end-to-end system difficult to train. It
    is much easier to obtain a large dataset of labeled car or pedestrian images.


    More generally, if there is a lot of data available for training “intermediate
    modules” of a pipeline (such as a car detector or a pedestrian detector), then
    you might consider using a pipeline with multiple stages. This structure could
    be superior because you could use all that available data to train the intermediate
    modules.


    Until more end-to-end data becomes available, I believe the non-end-to-end approach
    is significantly more promising for autonomous driving: Its architecture better
    matches the availability of data.


    ## 51 Choosing pipeline components: Task simplicity


    Other than data availability, you should also consider a second factor when picking
    components of a pipeline: How simple are the tasks solved by the individual components?
    You should try to choose pipeline components that are individually easy to build
    or learn. But what does it mean for a component to be “easy” to learn?


    ![](img/bef73f83187c4fb59f46276044c2c531_98_0.png)


    Consider these machine learning tasks, listed in order of increasing difficulty:


    - 1. Classifying whether an image is overexposed (like the example above)

    - 2. Classifying whether an image was taken indoor or outdoor

    - 3. Classifying whether an image contains a cat

    - 4. Classifying whether an image contains a cat with both black and white fur

    - 5. Classifying whether an image contains a Siamese cat (a particular breed of
    cat)


    Each of these is a binary image classification task: You have to input an image,
    and output either 0 or 1. But the tasks earlier in the list seem much “easier”
    for a neural network to learn. You will be able to learn the easier tasks with
    fewer training examples.


    Machine learning does not yet have a good formal definition of what makes a task
    easy or hard.¹⁶ With the rise of deep learning and multi-layered neural networks,
    we sometimes say a task is “easy” if it can be carried out with fewer computation
    steps (corresponding to a shallow neural network), and “hard” if it requires more
    computation steps (requiring a deeper neural network). But these are informal
    definitions.


    ¹⁶Information theory has the concept of “Kolmogorov Complexity”, which says that
    the complexity of a learned function is the length of the shortest computer program
    that can produce that function. However, this theoretical concept has found few
    practical applications in AI. See also: https://en.wikipedia.org/wiki/Kolmogorov_complexity

