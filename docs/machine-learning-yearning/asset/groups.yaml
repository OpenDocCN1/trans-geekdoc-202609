    # 39 Weighting data


    Suppose you have 200,000 images from the internet and 5,000 images from your mobile
    app users. There is a 40:1 ratio between the size of these datasets. In theory,
    so long as you build a huge neural network and train it long enough on all 205,000
    images, there is no harm in trying to make the algorithm do well on both internet
    images and mobile images.


    But in practice, having 40x as many internet images as mobile app images might
    mean you need to spend 40x (or more) as much computational resources to model
    both, compared to if you trained on only the 5,000 images.


    If you don’t have huge computational resources, you could give the internet images
    a much lower weight as a compromise.


    For example, suppose your optimization objective is squared error (This is not
    a good choice for a classification task, but it will simplify our explanation.)
    Thus, our learning algorithm tries to optimize:


    min_θ Σ_{(x,y)∈MobileImg} (h_θ(x) − y)² + Σ_{(x,y)∈InternetImg} (h_θ(x) − y)²


    The first sum above is over the 5,000 mobile images, and the second sum is over
    the 200,000 internet images. You can instead optimize with an additional parameter
    β:


    min_θ Σ_{(x,y)∈MobileImg} (h_θ(x) − y)² + β Σ_{(x,y)∈InternetImg} (h_θ(x) − y)²


    If you set β=1/40, the algorithm would give equal weight to the 5,000 mobile images
    and the 200,000 internet images. You can also set the parameter β to other values,
    perhaps by tuning to the dev set.


    By weighting the additional Internet images less, you don’t have to build as massive
    a neural network to make sure the algorithm does well on both types of tasks.
    This type of re-weighting is needed only when you suspect the additional data
    (Internet Images) has a very different distribution than the dev/test set, or
    if the additional data is much larger than the data that came from the same distribution
    as the dev/test set (mobile images).'
  - '[PAGE 76]


    # 40 Generalizing from the training set to the dev set


    Suppose you are applying ML in a setting where the training and the dev/test distributions
    are different. Say, the training set contains Internet images + Mobile images,
    and the dev/test sets contain only Mobile images. However, the algorithm is not
    working well: It has a much higher dev/test set error than you would like. Here
    are some possibilities of what might be wrong:


    +   1. It does not do well on the training set. This is the problem of high (avoidable)
    bias on the training set distribution.

    +   2. It does well on the training set, but does not generalize well to previously
    unseen data *drawn from the same distribution as the training set*. This is high
    variance.

    +   3. It generalizes well to new data drawn from the same distribution as the
    training set, but not to data drawn from the dev/test set distribution. We call
    this problem **data mismatch**, since it is because the training set data is a
    poor match for the dev/test set data.


    For example, suppose that humans achieve near perfect performance on the cat recognition
    task. Your algorithm achieves this:


    +   - 1% error on the training set

    +   - 1.5% error on data drawn from the same distribution as the training set
    that the algorithm has not seen

    +   - 10% error on the dev set


    In this case, you clearly have a data mismatch problem. To address this, you might
    try to make the training data more similar to the dev/test data. We discuss some
    techniques for this later.


    In order to diagnose to what extent an algorithm suffers from each of the problems
    1-3 above, it will be useful to have another dataset. Specifically, rather than
    giving the algorithm all the available training data, you can split it into two
    subsets: The actual training set which the algorithm will train on, and a separate
    set, which we will call the “Training dev” set, that we will not train on.


    You now have four subsets of data:'
  - '[PAGE 77]


    +   - Training set. This is the data that the algorithm will learn from (e.g.,
    Internet images + Mobile images). This does not have to be drawn from the same
    distribution as what we really care about (the dev/test set distribution).

    +   - Training dev set: This data is drawn from the same distribution as the training
    set (e.g., Internet images + Mobile images). This is usually smaller than the
    training set; it only needs to be large enough to evaluate and track the progress
    of our learning algorithm.

    +   - Dev set: This is drawn from the same distribution as the test set, and it
    reflects the distribution of data that we ultimately care about doing well on.
    (E.g., mobile images.)

    +   - Test set: This is drawn from the same distribution as the dev set. (E.g.,
    mobile images.)


    Armed with these four separate datasets, you can now evaluate:


    +   - Training error, by evaluating on the training set.

    +   - The algorithm’s ability to generalize to new data drawn from the training
    set distribution, by evaluating on the training dev set.

    +   - The algorithm’s performance on the task you care about, by evaluating on
    the dev and/or test sets.


    Most of the guidelines in Chapters 5-7 for picking the size of the dev set also
    apply to the training dev set.'
  - '[PAGE 78]


    # 41 Identifying Bias, Variance, and Data Mismatch Errors


    Suppose humans achieve almost perfect performance (≈0% error) on the cat detection
    task, and thus the optimal error rate is about 0%. Suppose you have:


    +   - 1% error on the training set.

    +   - 5% error on training dev set.

    +   - 5% error on the dev set.


    What does this tell you? Here, you know that you have high variance. The variance
    reduction techniques described earlier should allow you to make progress.


    Now, suppose your algorithm achieves:


    +   - 10% error on the training set.

    +   - 11% error on training dev set.

    +   - 12% error on the dev set.


    This tells you that you have high avoidable bias on the training set. I.e., the
    algorithm is doing poorly on the training set. Bias reduction techniques should
    help.


    In the two examples above, the algorithm suffered from only high avoidable bias
    or high variance. It is possible for an algorithm to suffer from any subset of
    high avoidable bias, high variance, and data mismatch. For example:


    +   - 10% error on the training set.

    +   - 11% error on training dev set.

    +   - 20% error on the dev set.


    This algorithm suffers from high avoidable bias and from data mismatch. It does
    not, however, suffer from high variance on the training set distribution.


    It might be easier to understand how the different types of errors relate to each
    other by drawing them as entries in a table:'
  - '[PAGE 79]


    |  | Distribution A: Internet + Mobile Images | Distribution B: Mobile Images
    |

    |---|---|---|

    | Human level | "Human Level Error" (≈0%) |  |

    | Error on examples algorithm has trained on | "Training Error" (10%) |  |

    | Error on examples algorithm has not trained on | "Training-Dev Error" (11%)
    | "Dev-Test Error" (20%) |


    *Right side labels: Avoidable Bias, Variance*

    *Data Mismatch between Training-Dev Error and Dev-Test Error*


    Continuing with the example of the cat image detector, you can see that there
    are two different distributions of data on the x-axis. On the y-axis, we have
    three types of error: human level error, error on examples the algorithm has trained
    on, and error on examples the algorithm has not trained on. We can fill in the
    boxes with the different types of errors we identified in the previous chapter.


    If you wish, you can also fill in the remaining two boxes in this table: You can
    fill in the upper-right box (Human level performance on Mobile Images) by asking
    some humans to label your mobile cat images data and measure their error. You
    can fill in the next box by taking the mobile cat images (Distribution B) and
    putting a small fraction of into the training set so that the neural network learns
    on it too. Then you measure the learned model’s error on that subset of data.
    Filling in these two additional entries may sometimes give additional insight
    about what the algorithm is doing on the two different distributions (Distribution
    A and B) of data.


    By understanding which types of error the algorithm suffers from the most, you
    will be better positioned to decide whether to focus on reducing bias, reducing
    variance, or reducing data mismatch.'
