    ## 1 Why Machine Learning Strategy


    Machine learning is the foundation of countless important applications, including
    web search, email anti-spam, speech recognition, product recommendations, and
    more. I assume that you or your team is working on a machine learning application,
    and that you want to make rapid progress. This book will help you do so.


    Say you’re building a startup that will provide an endless stream of cat pictures
    to cat lovers.


    ![](img/bef73f83187c4fb59f46276044c2c531_5_0.png)


    You use a neural network to build a computer vision system for detecting cats
    in pictures.


    But tragically, your learning algorithm’s accuracy is not yet good enough. You
    are under tremendous pressure to improve your cat detector. What do you do?


    - Get more data: Collect more pictures of cats.

    - Collect a more diverse training set. For example, pictures of cats in unusual
    positions; cats with unusual coloration; pictures shot with a variety of camera
    settings; ... .

    - Train the algorithm longer, by running more gradient descent iterations.

    - Try a bigger neural network, with more layers/hidden units/parameters.

    - Try a smaller neural network.

    - Try adding regularization (such as L2 regularization).

    - Change the neural network architecture (activation function, number of hidden
    units, etc.)

    - ...


    If you choose well among these possible directions, you’ll build the leading cat
    picture platform, and lead your company to success. If you choose poorly, you
    might waste months. How do you proceed?


    This book will tell you how. Most machine learning problems leave clues that tell
    you what’s useful to try, and what’s not useful to try. Learning to read those
    clues will save you months or years of development time.


    ## 2 How to use this book to help your team


    After finishing this book, you will have a deep understanding of how to set technical
    direction for a machine learning project.


    But your teammates might not understand why you''re recommending a particular
    direction. Perhaps you want your team to define a single-number evaluation metric,
    but they aren''t convinced. How do you persuade them?


    That''s why I made the chapters short: So that you can print them out and get
    your teammates to read just the 1-2 pages you need them to know.


    A few changes in prioritization can have a huge effect on your team''s productivity.
    By helping your team with a few such changes, I hope that you can become the superhero
    of your team!


    ![](img/bef73f83187c4fb59f46276044c2c531_7_0.png)


    ## 4 Scale drives machine learning progress


    Many of the ideas of deep learning (neural networks) have been around for decades.
    Why are these ideas taking off now?


    Two of the biggest drivers of recent progress have been:


    - **Data availability.** People are now spending more time on digital devices
    (laptops, mobile devices). Their digital activities generate huge amounts of data
    that we can feed to our learning algorithms.

    - **Computational scale.** We started just a few years ago to be able to train
    neural networks that are big enough to take advantage of the huge datasets we
    now have.


    In detail, even as you accumulate more data, usually the performance of older
    learning algorithms, such as logistic regression, “plateaus.” This means its learning
    curve “flattens out,” and the algorithm stops improving even as you give it more
    data:


    ![](img/bef73f83187c4fb59f46276044c2c531_9_0.png)


    It was as if the older algorithms didn’t know what to do with all the data we
    now have.


    If you train a small neural network (NN) on the same supervised learning task,
    you might get slightly better performance:


    ![](img/bef73f83187c4fb59f46276044c2c531_10_0.png)


    Here, by “Small NN” we mean a neural network with only a small number of hidden
    units/layers/parameters. Finally, if you train larger and larger neural networks,
    you can obtain even better performance:¹


    ![](img/bef73f83187c4fb59f46276044c2c531_10_1.png)


    Thus, you obtain the best performance when you (i) Train a very large neural network,
    so that you are on the green curve above; (ii) Have a huge amount of data.


    Many other details such as neural network architecture are also important, and
    there has been much innovation here. But one of the more reliable ways to improve
    an algorithm’s performance today is still to (i) train a bigger network and (ii)
    get more data.


    > This diagram shows NNs doing better in the regime of small datasets. This effect
    is less consistent than the effect of NNs doing well in the regime of huge datasets.
    In the small data regime, depending on how the features are hand-engineered, traditional
    algorithms may or may not do better. For example, if you have 20 training examples,
    it might not matter much whether you use logistic regression or a neural network;
    the hand-engineering of features will have a bigger effect than the choice of
    algorithm. But if you have 1 million examples, I would favor the neural network.

