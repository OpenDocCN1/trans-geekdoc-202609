    ## 31 解读学习曲线：其他情况


    考虑下面这条学习曲线：


    ![](img/bef73f83187c4fb59f46276044c2c531_61_0.png)


    该图表示高偏差、高方差，还是两者兼有？


    蓝色训练误差曲线相对较低，而红色开发误差曲线远高于蓝色训练误差。因此，偏差较小，但方差较大。增加更多训练数据很可能有助于缩小开发误差与训练误差之间的差距。


    现在，考虑这个：


    ![](img/bef73f83187c4fb59f46276044c2c531_61_1.png)


    这次，训练误差很大，因为它远高于期望的性能水平。开发误差也远大于训练误差。因此，你同时具有显著的偏差和显著的方差。你需要找到一种方法来同时减少算法中的偏差和方差。


    ## 32 绘制学习曲线


    假设你有一个非常小的训练集，包含 100 个样本。你使用随机选择的 10 个样本子集训练算法，然后是 20 个样本，接着 30 个，直到 100 个，每次增加
    10 个样本。然后你用这 10 个数据点绘制学习曲线。你可能会发现，在较小的训练集规模下，曲线看起来略有噪声（即数值高于或低于预期）。


    当仅用 10 个随机选择的样本进行训练时，你可能运气不好，得到一个特别“差”的训练集，例如其中包含许多模糊或错误标记的样本。或者，你可能运气好，得到一个特别“好”的训练集。训练集较小意味着开发误差和训练误差可能会随机波动。


    如果你的机器学习应用严重偏向于某一个类别（例如猫分类任务，其中负样本的比例远大于正样本），或者它包含大量类别（例如识别 100 种不同的动物物种），那么选出一个特别“不具有代表性”或糟糕的训练集的概率也会更大。例如，如果
    80% 的样本是负样本（y=0），只有 20% 是正样本（y=1），那么一个包含 10 个样本的训练集有可能只包含负样本，这使得算法很难学到有意义的内容。


    如果训练曲线中的噪声使得难以看清真实趋势，这里有两种解决方案：


    - 不要只在一个包含 10 个样本的训练集上训练一个模型，而是通过从你原来的 100 个样本中有放回地抽样¹⁰，选择多个（例如 3 到 10 个）不同的随机选择的
    10 样本训练集。在每个训练集上训练一个不同的模型，并计算每个模型的训练误差和开发误差。计算并绘制平均训练误差和平均开发误差。

    - 如果你的训练集偏向于某一类，或者包含许多类别，请选择一个“平衡”的子集，而不是从 100 个样本中随机抽取 10 个作为训练样本。例如，你可以确保 10
    个样本中有 2 个是正样本，8 个是负样本。


    ¹⁰ 这里有放回抽样的含义：你会从 100 个样本中随机挑出 10 个不同的样本组成第一个训练集。然后，组成第二个训练集时，你会再次挑出 10 个样本，但不会考虑第一个训练集中已经选择了哪些。因此，一个特定的样本有可能同时出现在第一个和第二个训练集中。相比之下，如果你是无放回抽样，第二个训练集将从第一次未被选中的
    90 个样本中选出。在实践中，有放回和无放回抽样不会有太大差别，但有放回抽样是常见做法。


    ## 与人类水平表现进行比较


    ### 33 为什么我们要与人类水平表现进行比较


    许多机器学习系统旨在自动化人类擅长的事情。例如图像识别、语音识别和电子邮件垃圾邮件分类。学习算法也已经取得了很大进步，以至于我们在越来越多的这类任务上超越了人类水平的表现。


    此外，如果你要完成的任务是人类能够做好的，那么构建 ML 系统会更容易，原因如下：


    1.  更容易从人类标注者那里获取数据。例如，由于人类能够很好地识别猫的图像，因此人们可以直接为你的学习算法提供高精度的标签。


    2.  误差分析可以借助人类直觉。假设一个语音识别算法的表现不如人类水平的识别。假设它错误地将一段音频转写为“This recipe calls for a
    pear of apples”，把“pair”误认成了“pear”。你可以借助人类直觉，尝试理解人类使用哪些信息来获得正确的转写，并利用这些知识来修改学习算法。


    3.  使用人类水平的表现来估计最优误差率，并设定一个“期望误差率”。假设你的算法在某项任务上达到了 10% 的误差，但一个人可以达到 2% 的误差。那么我们知道最优误差率是
    2% 或更低，而可避免的偏差至少为 8%。因此，你应该尝试减少偏差的技术。


    尽管第 3 点听起来可能不重要，但我发现，拥有一个合理且可实现的目标误差率有助于加快团队的进展。知道你的算法具有很高的可避免偏差是极其有价值的，它为你提供了一个可以尝试的各种选项菜单。


    有些任务即便是人类也不擅长。例如，挑选一本书推荐给你；或者在网站上为用户选择要展示的广告；或者预测股票市场。计算机在这些任务上已经超越了大多数人的表现。对于这些应用，我们会遇到以下问题：


    -   更难获得标签。例如，人类标注者很难为用户的数据库标注“最优”的图书推荐。如果你运营一个销售图书的网站或应用，你可以通过向用户展示图书并观察他们购买什么来获取数据。如果你不运营这样的网站，你需要寻找更有创造性的方式来获取数据。


    -   **人类直觉更难依赖。** 例如，几乎没有人能预测股票市场。因此，如果我们的股票预测算法并不比随机猜测好多少，就很难弄清楚如何改进它。


    -   **很难知道最优误差率和合理的期望误差率是多少。** 假设你已经有一个表现相当好的图书推荐系统。在没有人类基线的情况下，你怎么知道它还能改进多少？


    ### 34 如何定义人类水平的表现


    假设你正在处理一个医学影像应用，该应用根据 X 射线图像自动进行诊断。一个除了接受过一些基本训练外没有医学背景的普通人，在此任务上的误差为 15%。一名初级医生的误差为
    10%。一名经验丰富的医生误差为 5%。一个由医生组成的小团队，讨论并辩论每张图像后，误差为 2%。在这些误差率中，哪一个定义了“人类水平的表现”？


    在这种情况下，我会使用 2% 作为我们最优误差率的人类水平表现代理。你也可以将 2% 设定为期望的性能水平，因为上一章中提到的与人类水平表现进行比较的三个原因都适用：


    -   从人类标注者那里获取带标签数据更容易。你可以让一个医生团队为你提供误差率为 2% 的标签。

    -   误差分析可以借助人类直觉。通过与医生团队讨论图像，你可以借助他们的直觉。

    -   使用人类水平的表现来估计最优误差率，并设定可实现的目标误差率。使用 2% 的误差作为我们对最优误差率的估计是合理的。最优误差率可能低于 2%，但不可能更高，因为一个医生团队可以达到
    2% 的误差。相比之下，使用 5% 或 10% 作为最优误差率的估计是不合理的，因为我们知道这些估计必然过高。


    在获取带标签数据方面，你可能不想与整个医生团队讨论每一张图像，因为他们的时间很昂贵。也许你可以让一名初级医生为绝大多数病例打标签，只将较难的病例交给更有经验的医生或医生团队。


    如果你的系统目前有 40% 的误差，那么无论是使用初级医生（10% 误差）还是经验丰富的医生（5% 误差）来为你的数据打标签并提供直觉，都没有太大区别。但如果你的系统已经处于
    10% 的误差水平，那么将人类水平参考定义为 2% 将为你提供更好的工具来持续改进系统。


    '
