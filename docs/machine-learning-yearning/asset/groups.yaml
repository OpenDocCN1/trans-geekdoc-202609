  - '[PAGE 34]


    +   - Overall accuracy on dev set.................. 98.0% (2.0% overall error.)

    +   - Errors due to mislabeled examples....... 0.6%. (30% of dev set errors.)

    +   - Errors due to other causes.................. 1.4% (70% of dev set errors)


    30% of your errors are due to the mislabeled dev set images, adding significant
    error to your estimates of accuracy. It is now worthwhile to improve the quality
    of the labels in the dev set. Tackling the mislabeled examples will help you figure
    out if a classifier’s error is closer to 1.4% or 2%—a significant relative difference.


    It is not uncommon to start off tolerating some mislabeled dev/test set examples,
    only later to change your mind as your system improves so that the fraction of
    mislabeled examples grows relative to the total set of errors.


    The last chapter explained how you can improve error categories such as Dog, Great
    Cat and Blurry through algorithmic improvements. You have learned in this chapter
    that you can work on the Mislabeled category as well—through improving the data’s
    labels.


    Whatever process you apply to fixing dev set labels, remember to apply it to the
    test set labels too so that your dev and test sets continue to be drawn from the
    same distribution. Fixing your dev and test sets together would prevent the problem
    we discussed in Chapter 6, where your team optimizes for dev set performance only
    to realize later that they are being judged on a different criterion based on
    a different test set.


    If you decide to improve the label quality, consider double-checking both the
    labels of examples that your system misclassified as well as labels of examples
    it correctly classified. It is possible that both the original label and your
    learning algorithm were wrong on an example. If you fix only the labels of examples
    that your system had misclassified, you might introduce bias into your evaluation.
    If you have 1,000 dev set examples, and if your classifier has 98.0% accuracy,
    it is easier to examine the 20 examples it misclassified than to examine all 980
    examples classified correctly. Because it is easier in practice to check only
    the misclassified examples, bias does creep into some dev sets. This bias is acceptable
    if you are interested only in developing a product or application, but it would
    be a problem if you plan to use the result in an academic research paper or need
    a completely unbiased measure of test set accuracy.'
  - '[PAGE 35]


    # 17 If you have a large dev set, split it into two subsets, only one of which
    you look at


    Suppose you have a large dev set of 5,000 examples in which you have a 20% error
    rate. Thus, your algorithm is misclassifying ~1,000 dev images. It takes a long
    time to manually examine 1,000 images, so we might decide not to use all of them
    in the error analysis.


    In this case, I would explicitly split the dev set into two subsets, one of which
    you look at, and one of which you don’t. You will more rapidly overfit the portion
    that you are manually looking at. You can use the portion you are not manually
    looking at to tune parameters.


    ![](img/bef73f83187c4fb59f46276044c2c531_35_0.png)


    Let’s continue our example above, in which the algorithm is misclassifying 1,000
    out of 5,000 dev set examples. Suppose we want to manually examine about 100 errors
    for error analysis (10% of the errors). You should randomly select 10% of the
    dev set and place that into what we’ll call an Eyeball dev set to remind ourselves
    that we are looking at it with our eyes. (For a project on speech recognition,
    in which you would be listening to audio clips, perhaps you would call this set
    an Ear dev set instead). The Eyeball dev set therefore has 500 examples, of which
    we would expect our algorithm to misclassify about 100.


    The second subset of the dev set, called the Blackbox dev set, will have the remaining
    4500 examples. You can use the Blackbox dev set to evaluate classifiers automatically
    by measuring their error rates. You can also use it to select among algorithms
    or tune hyperparameters. However, you should avoid looking at it with your eyes.
    We use the term “Blackbox” because we will only use this subset of the data to
    obtain “Blackbox” evaluations of classifiers.'
  - '[PAGE 36]


    ![](img/bef73f83187c4fb59f46276044c2c531_36_0.png)


    Why do we explicitly separate the dev set into Eyeball and Blackbox dev sets?
    Since you will gain intuition about the examples in the Eyeball dev set, you will
    start to overfit the Eyeball dev set faster. If you see the performance on the
    Eyeball dev set improving much more rapidly than the performance on the Blackbox
    dev set, you have overfit the Eyeball dev set. In this case, you might need to
    discard it and find a new Eyeball dev set by moving more examples from the Blackbox
    dev set into the Eyeball dev set or by acquiring new labeled data.


    Explicitly splitting your dev set into Eyeball and Blackbox dev sets allows you
    to tell when your manual error analysis process is causing you to overfit the
    Eyeball portion of your data.'
  - '[PAGE 37]


    # 18 How big should the Eyeball and Blackbox dev sets be?


    ![](img/bef73f83187c4fb59f46276044c2c531_37_0.png)


    Your Eyeball dev set should be large enough to give you a sense of your algorithm’s
    major error categories. If you are working on a task that humans do well (such
    as recognizing cats in images), here are some rough guidelines:


    +   - An eyeball dev set in which your classifier makes 10 mistakes would be considered
    very small. With just 10 errors, it’s hard to accurately estimate the impact of
    different error categories. But if you have very little data and cannot afford
    to put more into the Eyeball dev set, it’s better than nothing and will help with
    project prioritization.

    +   - If your classifier makes ~20 mistakes on eyeball dev examples, you would
    start to get a rough sense of the major error sources.

    +   - With ~50 mistakes, you would get a good sense of the major error sources.

    +   - With ~100 mistakes, you would get a very good sense of the major sources
    of errors. I’ve seen people manually analyze even more errors—sometimes as many
    as 500. There is no harm in this as long as you have enough data.


    Say your classifier has a 5% error rate. To make sure you have ~100 misclassified
    examples in the Eyeball dev set, the Eyeball dev set would have to have about
    2,000 examples (since 0.05*2,000 = 100). The lower your classifier’s error rate,
    the larger your Eyeball dev set needs to be in order to get a large enough set
    of errors to analyze.


    If you are working on a task that even humans cannot do well, then the exercise
    of examining an Eyeball dev set will not be as helpful because it is harder to
    figure out why the algorithm didn’t classify an example correctly. In this case,
    you might omit having an Eyeball dev set. We discuss guidelines for such problems
    in a later chapter.'
