    Merkle tree: A Merkle tree is a hierarchical structure of hash codes responding
    to a large data structure. A hash is made for each data element, then a hash of
    these hashes, and so on, hierarchically up until there is just one top-level hash
    for the data structure, the Merkle root.


    NISQ device: A NISQ (noisy intermediate-scale quantum) device is a near-term quantum
    computer that is able to conduct some degree of quantum information processing
    despite imperfect physical components.


    Quantum error correction: Quantum error correction is the technique of smearing
    the information of one quantum information bit (qubit) onto entangled qubits such
    that it can be recovered if damaged.


    Quantum smart networks: Quantum smart networks are smart network technologies
    implemented at the quantum scale (1×10⁻⁹m) or in quantum computing environments.


    Renormalization: Renormalization is a mathematical technique that allows a system
    to be investigated at different scales, especially as it changes dynamically.


    Quantum internet: The quantum internet is a very-fast ultra-secure future internet
    concept based on technologies such as quantum key distribution, entanglement,
    and quantum memory.


    Smart networks: Smart networks are intelligent self-operating computation networks
    such as blockchains and deep learning neural nets.'
