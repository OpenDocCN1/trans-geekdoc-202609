  md: '# 3.1 Introduction


    Quantum computers are in the early stages of development and would likely be complementary
    to existing computational infrastructure, interacting with classical devices,
    and being accessed either locally or as a cloud service. Currently, the top methods
    demonstrate 30–70 qubits of processing power and achieve fidelity rates above
    99% (i.e. below a fault tolerance of 1%). However, there is uncertainty about
    the reliability of scalable quantum computers. Quantum computers may excel at
    solving certain types of problems such as optimization. This could offer a step-up
    in computing such that it is possible to solve many classes of problems, but not
    all. For example, considering well-known optimization problems, it may be possible
    to search twice as many possibilities in half the time (exploring a fixed-size
    space in the square root of the amount time required for a classical computer).


    Quantum computing is an early-stage technology with numerous risks and limitations
    (Dyakonov, 2018). The long-term goal of universal quantum computing is not immediate
    as many challenges including error correction need to be resolved. In the short
    term, the focus is on solving simple problems in which quantum computers offer
    an advantage over classical methods through NISQ devices (noisy intermediate-scale
    quantum devices) (Preskill, 2018).


