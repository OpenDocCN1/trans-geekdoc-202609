  md: '# 244 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    # 11.3.1.2 Correlation functions and moment-generating function


    An important insight is that correlation functions (measures of distance in the
    network can be expressed as the sum over all paths of the system, as path integrals.
    A moment-generating function (probability distribution) can be introduced as the
    path integral associated with the system. A moment-generating function is an alternative
    statistical means of specifying a probability distribution (in contrast to probability
    density functions and cumulative distribution functions), based on computing the
    moments in the distribution. Cumulants (another set of quantities which provide
    an alternative to the moments of the distribution) can be obtained the same way.
    These processes are well known. The correlation functions that influence system
    criticality are expressed in a standard way, through a moment-generating function
    (that is a path integral) (Ginzburg & Sompolinsky, 1994).


    In Gaussian Markov random walks, the Gaussian propagator or Green’s function solution
    to the differential equations can be used to collapse the function into a two-point
    correlation function. All of the higher moments depend on the first two moments,
    so the function can be collapsed under this solution method. For example, the
    evaluate only the even moments, so the odd moments vanish, while preserving the
    general structure of the function. This is a result of Wick’s theorem (a method
    of reducing high-order derivatives to a more-easily solvable combinatorics problem).
    Wick’s theorem, it is only necessary to compute two-point correlation functions
    (assuming the one-point function is zero). The result is that a usable action
    is obtained from the two-point correlation function, which is equal to a Gaussian
    propagator or the Green’s function. Wick also shows that if imaginary time is
    used in the Schrödinger equation, it becomes the diffusion equation, further underlining
    the connection between Brownian motion and quantum mechanics.


