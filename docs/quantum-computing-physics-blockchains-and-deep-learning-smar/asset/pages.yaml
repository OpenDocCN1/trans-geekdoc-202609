    # 9.3.3.1 Backpropagation of errors


    An important advance is the proposal of backpropagation as a solution to combinatorial
    complexity (Rumelhart et al., 1986). Backpropagation is an optimization method
    in which the error contribution of each node is calculated after a batch of data.
    Both the total error and the contribution to the error at each step backwards
    are computed. The technique is referred to as the backpropagation of errors method
    since intermediate errors are transmitted backwards through the network in subsequent
    cycles as solutions have a higher power of potential accuracy. A variety of statistical
    error calculation methods are mostly used mean squared error (MSE), sum of squared
    errors of prediction (SSE), cross-entropy (softmax), and softplus (a smoothing
    function). The error calculation method may depend on the type of network and
    the problem. CNNs (using classification for image recognition) are more likely
    to use cross-entropy for error calculation, whereas RNNs (using regression for
    speech and text recognition) more often use MSE.


    # 9.3.3.2 Gradient descent


    Related to backpropagation is another important optimization method, gradient
    descent. The gradient is the slope of a function, and gradient descent is a loss
    function for quickly finding the minimum of a function (for example, the fastest
    path for rain water to reach the bottom of a canyon). In gradient descent, two
    values are calculated for each node, the error contribution and the gradient (slope).
    These values are used to identify the least contributive nodes while reducing
    combinatorial complexity by directly directing the function to an optimal solution.
    Although the concept of loss functions is straightforward, implementation is more
    complicated. Networks might deploy a multi-phase approach to loss functions, just
    as they do for learning (beginning with unsupervised learning to characterize
    a data set and then transitioning to supervised learning for more rigorous analysis
    and prediction). Likewise, with loss functions, the first optimization phase might
    be using coarse-grained models with steep gradient descent to quickly identify
    system minima and estimate the'
