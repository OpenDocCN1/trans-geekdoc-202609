    # 5.5.1 Verifiable markets


    Verifiable markets are trust markets (markets in which it is not necessary to
    trust any of the participants) because trust is conferred by proof technology.
    Whereas blockchains are trustless due to the algorithm process that confirms transactions,
    verifiable markets are trustless due to verifiable proofs. Verifiable markets
    use cryptography and game theory to verify the market that trusting participants
    is not required. A verifiable market is a new kind of market in which market participants
    (goods and services providers and customers) are not trustled, only the computational
    proofs they provide.


    A prototype of verifiable transactions is smart contracts. Smart contracts can
    be used to solve the Amazon problem. The Amazon problem is that it is necessary
    to trust Amazon or another centralized intermediary in order for remote buyers
    and sellers to exchange goods. A trustless market with decentralized intermediaries
    might be preferable. In the current model, Amazon sits as a centralized escrow
    service between the buyer and the seller. Instead, with blockchains, an Amazon-type
    transaction between a remote buyer and a seller can be instantiated with smart
    contracts. The buyer orders the item and submits the payment to a smart contract
    address that serves as an escrow. The seller ships the item, and upon confirmation'
