    # 14.2.2 Ryu–Takayanagi quantum error correction codes


    Performing quantum error correction between the bulk and the boundary regions
    requires articulating how entropy in the two regions operates differently. Whereas
    bulk entropy scales by area, boundary entropy scales by volume, and their interrelation
    is non-trivial. The Ryu-Takayanagi formula for entanglement entropy links the
    two, by relating the entropy of a boundary region to the area of a corresponding
    minimal surface in the bulk (Ryu & Takayanagi, 2006). Research continues on the
    issues raised in this body of work. A quantum-correction interpretation for the
    Ryu–Takayanagi formula for entropy is proposed (Harlow, 2017). The quantum error-correction
    interpretation is based on the specification of a new subalgebra code. The subalgebra
    code (subalgebra: closed under all of its operations) produces a complementary
    recovery mechanism between the boundary entanglement and the bulk geometry, using
    the entanglement wedge reconstruction method. The subalgebra code is intended
    as a general purpose technology that might be used as a standard feature in any
    well-formed quantum error-correction code that is based on the holographic correspondence.


    # 14.2.3 Extending MERA tensor network models


    Other work extends tensor networks and MERA-type models, specifically as used
    in the context of quantum error correction (Ferris & Poulin, 2014). An important
    advance is implementing the renormalization group in a MERA tensor network environment
    (Evenbly & Vidal, 2015). Renormalization is a mathematical technique that allows
    a system to be investigated at different scales, especially as it changes dynamically
    and undergoes phase transition. The work is based on the renormalization group
    (Wilson, 1971). The initial renormalization group articulates scaling near the
    critical point for an Ising ferromagnet in a differential form.'
