    A reduced model can be created by appeal to solid-state physics. A simple neural
    Hamiltonian is generated as the spike Hamiltonian instead of the Hamiltonian of
    all possible state transitions. To do this, a minimal model is considered, one
    in which spike (activation) rates are low (the probability of a neuron emitting
    a spike is low). Most neurons exist in the quiescent state Q (thus, Q is close
    to one), which makes the reduced Hamiltonian easy to analyze.


    # 11.3.3.3 Coherent states


    The next step is deriving the moment-generating function for the field theory
    using coherent states. Coherent states are of interest because they are good representations
    to use for expressing the statistics of quantum field theory and Markov fields.
    Coherent states are functions that do not change their state under the action
    of the evolution of the wave equation. Schrödinger coherent states in 1926, soon
    after introducing the wave equation, and they were further developed through work
    in quantum optics (Glauber, 1962). There are different kinds of coherent states.
    Although it might seem that the appropriate coherent states for the neural field
    theory would be those that express the sophisticated Lie algebra SU(3) for the
    reduced model, the more basic coherent states introduced by Wigner with U(1) symmetry
    are most effective. Using U(1) symmetry, it is possible to define an accurate
    theory of spiking action on a neural network.


