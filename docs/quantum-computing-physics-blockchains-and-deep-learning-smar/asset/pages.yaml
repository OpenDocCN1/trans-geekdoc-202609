    # 13.2.2 Holographic principle formalized in the AdS/CFT correspondence


    The holographic principle is made more precise in the AdS/CFT correspondence (Maldacena,
    1998, 2012). As an instantiation of the holographic principle, the AdS/CFT correspondence
    is a duality between a bulk with (d+1) dimensions and a boundary with (d) dimensions.
    One theory describes the bulk or the interior, and is an effective field theory
    that includes gravity (in the general formulation, the bulk effective field theory
    is a quantum theory of gravity). Another theory describes the boundary, and is
    an ordinary conformal field theory (meaning no gravity and a flat space-time).
    Conformal field theories are specific examples of field theories, in one fewer
    dimensions. A conformal field theory is a robust formulation for the boundary
    because it is a quantum field theory that is invariant under certain kinds of
    changes. More technically, conformal field theory is invariant to conformal transformations.


    Conformal transformations are mappings that preserve local angles (leaving the
    size of the angle between corresponding curves unchanged). Conformal field theories
    are used in the AdS/CFT correspondence to articulate a gravitational theory in
    the AdS bulk is equivalent to a conformal field theory in the boundary. The point
    is that the two regions are related to the AdS/CFT correspondence, the bulk interior
    of the volume and its flat boundary on the edge. They have a relationship (duality)
    that can be formalized. The bulk and the boundary are not just randomly connected,
    but there is a certain mapping that can be made between the two regions or theories.
    The holographic principle is most specifically conceived as the mapping between
    conformal field theories and higher dimensional theories of gravity.


