  md: '# Holographic Quantum Error-Correcting Codes 331


    The renormalization group helps to address the so-called Kondo problem of understanding
    magnetic impurities in non-magnetic metals (the impurity problem is related to
    the interaction between localized magnetic impurities and wandering electrons)
    (Kondo, 1964), and also the problem of infinities arising in the application of
    quantum field theories. The renormalization group has been established as a canonical
    analysis tool for phase transition (Goldenfeld, 1992).


    Impurities in materials (natural or doped) are a form of anomaly that can be exploited
    in analytical models to test the robustness and invariance of the system. Evenbly
    & Vidal employ quantum critical Hamiltonians to test between two phase transition
    situations. The theoretical result is the notion of using directed influence in
    the renormalization group (closely following Wilson). The practical result is
    that directed influence is a method that can be implemented in tensor networks
    to exploit impurities (anomalies) in other homogeneous systems. Other research
    uses the renormalization group to investigate the strong-coupling limit (the moment
    of exchange between light and matter), which is an important feature of superconducting
    materials. The renormalization group calculations reveal anomalies in the strong-coupling
    limit, such as impurity entropy and the effective impurity moment (Fritz, 2006).
    Some of the kinds of insights gained from the application of the renormalization
    group by MERA tensor networks might lead to improved superconducting materials
    and error-correction methods for quantum computing.


