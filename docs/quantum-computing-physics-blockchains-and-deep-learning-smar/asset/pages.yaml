    # 3.2 Basic Concepts: Bit and Qubit


    Quantum computing springs from Nobel physicist Richard Feynman’s intuition that
    it should be possible to perform very powerful computations using quantum computing
    building blocks. He suggests that simulating physics with computers using a universal
    simulator.


    Feynman worked on many problems at the small scales of the quantum mechanical
    device. He famously announced that “There’s plenty of room at the bottom” (Feynman,
    1960), referring to the idea of miniaturization at the atomic scale such that
    the entire 24-volume set of the Encyclopedia Britannica might be printed on the
    head of a pin. These ideas helped to sponsor the nanotechnology industry in the
    1990s and are likewise motivating the current development of quantum computing.
    To get an idea of scale, the nanometer scale is $10^{-9}$ m, the atomic scale
    (in terms of the Bohr radius being the probable distance from the nucleus to the
    electron) is $10^{-11}$ m, and the electron scale (the size of the electron) is
    $10^{-15}$ m.


    Feynman suggested that a quantum computer could be an efficient universal simulator
    of quantum mechanics. A “universal quantum simulator” (Feynman, 1982, 474) would
    be a different kind of computer that is not a traditional Turing machine. He posits
    two ways to simulate quantum mechanics with ones conceiving the notion of computers
    and building computers out of quantum mechanical elements that obey quantum mechanical
    laws. The other idea is to imitate quantum mechanical systems with classical systems.


    Feynman’s key thought is that the more closely computing systems can be built
    in the structure of nature, the better they can simulate nature. He says that
    the “various field theories have the same kind of behavior, and can be simulated
    in every way, apparently, with little latticework'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Quantum Computing: Basic Concepts


    spins and other things” (Feynman, 1982, 474–5). Assuming the world is made in
    a discrete lattice, “the phenomena of field theories can be well imitated by many
    phenomena in solid state theory (which is simply the analysis of a latticework
    of crystal atoms, and in the case of the kind of solid state I each atom is just
    a point which has numbers associated with it, with quantum mechanical rules”)
    (Feynman, 1982, 475).


    Feynman proposed the idea of the universal simulator in 1982, following which
    there have been other theoretical developments. In 1985, David Deutsch proposed
    a universal quantum computer based on the idea that quantum gates could function
    in a similar fashion to traditional digital computing binary logic gates [Deutsch,
    1985]. In 2000, Charlie Bennett showed that it is possible to efficiently simulate
    any classical computation using a quantum computer (Bennett & DiVenzo, 2000).


    Other advances have led to the practical realizability of quantum computers. In
    the 1990s was the discovery of quantum error correction. Unlike classical bits,
    quantum bits are extremely sensitive to environmental noise and may decohere before
    they can be used in a 1 or 0 state to perform a computation. Quantum error correction
    overcomes some of the challenges of working in quantum mechanical domains.


    Second, since 2012, there have been advances in room-temperature superconducting
    materials and a proliferation of ways of making qubits such that quantum systems
    have increased from 1–2 qubits to 50–100 qubits. A research goal is demonstrating
    quantum advantage, which is specific cases in which quantum computing confers
    an advantage over classical computing.


    # 3.2.1 Quantum computing and classical computing


    Quantum information processing is not only a potentially faster means of computing
    but also a new paradigm in that information is conceived and managed in a completely
    different way due to the properties of quantum objects. According to W.D. Phillips,
    1997 Nobel Prize winner in physics and NIST scientist, “Quantum information is
    a radical departure in information technology, more fundamentally different from
    current technology than the digital computer is from the abacus” (Williams, 2007).'
