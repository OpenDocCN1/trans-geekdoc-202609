    # 7.3 Zero-Knowledge Proofs: Interactive Proofs


    Zero-knowledge proofs are a further extension of the basics concepts used in PKI
    cryptography. The proofs rely on the fact that each user has a private key that
    is only accessible to that entity (whether a person, computer, robot, or IoT sensor).
    Since each entity has their own private key, encrypted messages can be sent to
    them only they can decrypt and answer. It is the same idea as sending messages
    that only the recipient with the private key can decode. This functionality can
    be used to test identity claims that parties are really who they say they are.
    Demonstrating the truth claim requires an iterative process.


    To prove A, B selects text to send to A a secret message (as “secret message”).
    B encrypts the message with A''s public key and sends it to A. If A is real then
    A has A''s private key and can decrypt the message and pass it back to B as an
    open string on the internet. A sends back “secret message”. However, if A is an
    imposter, A might be able to guess the message contents, so the process for B
    to repeat a sufficient number of times guessing the secret message text. There
    is an iterated interaction (hence name interactive proofs) such that A can answer
    a sufficiently-high probabilistic amount of times (10–20) attending that A is
    real. Then, when B is sure that A is real, A sends the real transaction. The key
    point is that A does not share any private information (the private key), but
    can prove its identity to B. Notably, A and B do not need to know or trust each
    other.


    There are important implications of using zero-knowledge proofs for internet data
    privacy. In a zero-knowledge proof-enabled world, A''s identity can be authenticated
    and verified without A having to share actual information (whether it is a private
    key, social security number, account number, or other directly-identifying information).
    Blockchains assume lack of trust from the beginning, and a computational system
    to confer trust. Zero-knowledge proofs demonstrate this principle.'
