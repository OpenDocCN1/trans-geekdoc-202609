  md: '# Zero-Knowledge Proof Technology


    Regarding whether zero-knowledge proof systems are post-quantum secure, it depends
    on the cryptography used in the security on which a particular zero-knowledge
    proof system rests. The earlier projects such as SNARKs and bulletproofs are not
    post-quantum secure because they rely on cryptographic assumptions which are known
    to be vulnerable to quantum attacks (namely the hardness of discrete log calculations
    in certain elliptic curves). On the other hand, zero-knowledge proof systems that
    only use collision-resistant hash functions are plausibly post-quantum secure.
    This includes STARKs and also Hyrax and Aurora.


    There are many different zero-knowledge proof projects. The field is growing and
    there are many ongoing developments. One example is Bolt, which implements zero-knowledge
    proofs in payment channels on the Lightning Network (a Layer 2 payment channel
    over Bitcoin) (Green & Miers, 2017). Substantial change may be likely as the technology
    matures. There are various known computational methods that prove zero-knowledge
    in various domains, such as Schnorr protocols, sigma protocols, and password hashes.
    However, private transactions on blockchains require more complicated and dedicated
    forms of zero-knowledge proof technology such as SNARKs, bulletproofs, STARKs,
    and Zether.


