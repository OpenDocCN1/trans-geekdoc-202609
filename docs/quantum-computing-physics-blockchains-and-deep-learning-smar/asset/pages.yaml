    # 5.3.5.2 Atomic multi-path routing


    The atomic principle in blockchains is being applied to another envisioned upgrade
    to payment channels, in the form of atomic multi-path routing. In this smart routing
    concept, instead of routing payment transactions through channels that only have
    the capacity for the full amount, atomic multi-path routing is used. Atomic multi-path
    routing accommodates the use of multiple channels with smaller amounts as long
    as the full amount can be delivered with the same atomicity that all or none settlement
    provides. In atomic multi-path routing, either of the smaller channel payments
    go through and a receipt is produced, or none of them go through and the transaction
    is canceled and must be resubmitted using another set of routes.


