- pgno: 235
  md: '# Quantum Machine Learning


    The framing concept in information geometry is selective geometries, the idea
    that geometry can be chosen as a parameter as any other, perhaps in the same way
    that the space and regimes can be selectable parameters of a physics problem.
    In machine learning, there could be a choice of geometries which pertain to the
    kind of geometrical space in which the optimization is performed. Different geometries
    might be better for different applications. One parameter-related choice could
    be simplification, for example, discretizing high-dimensional continuous geometries
    to simplified discretized geometries for useful computation.


    Information geometry is an interdisciplinary field that considers geometry in
    the context of information science (Amari, 2016). Differential geometry techniques
    are applied to the study of probability theory and statistics. One focus is statistical
    manifolds, which are Riemannian manifolds whose points correspond to probability
    distributions. Geometry (whether assumed or selected) is a foundation for probabilistic
    modeling, in which the underlying geometry can have a substantial influence on
    how the optimization or statistical modeling problem is solved. Information geometry
    enables new kinds of more sophisticated machine learning techniques that take
    advantage of the properties of non-Euclidean geometry. For example, a deep learning
    problem could be instantiated as an optimization problem defined over a statistical
    manifold in which points are probability distributions. One effort in information
    geometry and deep learning is the DeepRiemann project (Malago et al., 2018). Riemannian
    optimization methods and differential geometry are applied towards the development
    of improved deep learning algorithms.


    # 10.1.3 Geometric deep learning


    Geometric deep learning is a deep learning method in which algorithms analyze
    information in its native form, rather than translating it into a lower-dimensional
    representation to be processed by the system. The insight is that input data (images,
    text, audio, or otherwise) often exist naturally in higher-dimensional forms.
    Data are compressed to conducive to processing by machine learning algorithms,
    which may destroy the very relationships between data elements that the system
    is attempting to'
