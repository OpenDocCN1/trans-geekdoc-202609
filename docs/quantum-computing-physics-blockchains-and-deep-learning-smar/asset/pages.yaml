    # 7.5.1 SNARKs and multi-party computation


    The original blockchain zero-knowledge proof system is SNARKs. SNARKs have the
    shortest proof length, and verification time is short. However, a trusted setup
    is required using multi-party computation in a public parameter generation ceremony
    to establish proof circuits. Every time the project wants to make a change to
    the zero-knowledge proof circuit or instantiate a new circuit, there needs to
    be a trusted setup process. SNARK uses multi-party computation, which is an advanced
    method for secure blockchain computing derived from multi-party cryptography protocols.
    In this approach, multiple non-trusting computers conduct a computation on their
    own unique fragments of a larger dataset to collectively produce a common outcome,
    without any node knowing the details of the fragments held by the others.


    One of the main applications of multi-party computation is secure key generation
    and management in the context of facilitating group operations. The technique
    is generically useful and features prominently in the trusted setup used in SNARKs.
    The idea is that it is possible to sharing responsibility among a group of otherwise
    non-trusting entities. Key generation is part of the trusted setup, in that the
    private key that executes the transaction is a collectively-generated value by
    the participants, which is the security feature that makes the process invulnerable
    to attack.


