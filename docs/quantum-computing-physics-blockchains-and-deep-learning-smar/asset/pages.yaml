  md: '# 13.4.4 Extending AdS–Rindler with quantum secret-sharing


    The notion of the AdS–Rindler reconstruction as a model for quantum error correction
    might be applied in different ways. One idea is that the reconstruction could
    be extended if the quantum error correction can be instantiated as a quantum secret-sharing
