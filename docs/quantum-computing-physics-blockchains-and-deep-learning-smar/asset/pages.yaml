    in Physics) (Bednor & Müller, 1986). Before high-temperature superconductors,
    ordinary superconductors were known materials that become superconducting at critical
    temperatures below 30 K (−303°C), when cooled with liquid helium. High-temperature
    superconductors constitute advanced materials because transition temperatures
