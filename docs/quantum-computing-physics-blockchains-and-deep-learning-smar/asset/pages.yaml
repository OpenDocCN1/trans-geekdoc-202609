    # 12.5.1 Particles (nodes)


    In smart networks, the particles are the constituent network elements. In blockchains,
    this is the peer-to-peer nodes, and in deep learning networks, the percept processing
    units. In blockchain networks, the core unit is the peer-to-peer node. This is
    the flat-hierarchy, distributed peer-to-peer nodes that offer fee-based services
    for activities such as validation and recording (mining), and currently free services
    such as recordkeeping (ledger-hosting). There are also other nodes in blockchain
