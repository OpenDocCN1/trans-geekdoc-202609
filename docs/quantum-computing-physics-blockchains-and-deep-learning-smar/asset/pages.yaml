  md: '# The AdS/CFT Correspondence


    The so-called entanglement area law refers to entropy that scales by area not
    volume (Bekenstein, 1973).


    The next important finding is that the entanglement area scaling law applies to
    any quantum mechanical domain more generally, including quantum many-body problems,
    quantum information science, and black hole physics (Eisert et al., 2010). In
    quantum systems, entropy scales by area not volume. The important practical implication
    is that quantum mechanical problems immediately become much easier to compute,
    since area is easier to calculate than volume. Scaling by area not volume means
    that previously intractable numerical models of quantum systems are in fact possible,
    particularly with tools such tensor networks. A crucial advance is the Ryu–Takayanagi
    entanglement entropy formula that implements the Bekenstein–Hawking area entropy
    in the Ads/CFT correspondence (Ryu & Takayanagi, 2006). In the Ryu–Takayanagi
    formula, entropy in the boundary is computed by the area of a certain minimal
    surface in the bulk geometry. Bulk entropy is black or quantum mechanical-type
    entropy that scales by area not volume, whereas boundary entropy is “traditional”
    thermodynamic or Neumann-type entropy that scales by volume. The difference in
    bulk entropy and boundary entropy alone implies many interesting problem-solving
    applications.


    One puzzle about the fact bulk entropy and boundary entropy are different relates
    to how information moves between the two domains. New forms of the black hole
    information paradox point out information is radiated out of black holes, and
    ask how this could be possible since nothing can escape from a black hole. Perhaps
    there are two versions of the information, one that goes into the black hole and
    one that radiates out, but this would violate the no-cloning theorem of quantum
    information (quantum information cannot be copied). As a solution to this, Susskind
    (extending the ideas of ’ Hooft) proposed the holographic principle (Susskind,
    1995). The holographic principle is that there are different but complementary
    views of the same physical phenomenon. There are not two instances of the information,
    but two different viewpoints from which the same information can be seen. From
    relativity, it is known that a phenomenon looks different to different observers.
    A far-off observer only sees information smearing out on the event horizon of
    the black hole'
  merge: -1
  img_proc: true
- pgno: 318
  md: '(boundary) and never actually entering the black hole, whereas a near-by observer
    that is jumping into the black hole sees the information going into the bulk.
    Each could analyze the entropy per their own stance, with the area entropy law
    in the bulk, and the volume entropy law on the boundary. Due to the complementary
