    Deep learning is based on the principles of the artificial intelligence argument.
    The artificial intelligence argument is that basic data classification problems
    may be solved by running fairly straightforward algorithms over very-large datasets.
    Having enough data is what makes the difference. Indeed, this has proven successful
    so far in artificial intelligence advances, in contrast to other methods such
    as creating expert systems and attempting to digitally catalog the entropy of
    human knowledge. Large data corpora have enabled progress in machine translation
    (Halevy *et al.*, 2009), the image recognition of cats and faces (Le *et al.*,
    2012), and systems with greater than human-level capability in object recognition
    (He *et al.*, 2015).


    # 9.1.3 Big data is not smart data


    The reason that data analysis techniques such as deep learning is needed to keep
    pace with the exponential rate of data growth. The modern era is one of big data,
    characterized by very large datasets that are too big and complex for traditional
    data processing methods. Big data is characterized by three “Vs”: volume (size),
    velocity (speed), and variety (text, graphics, video, and audio data), and comprises
    large datasets that must be analyzed computationally to find patterns, trends,
    and associations. IDC estimates that global data volumes will reach 40 zettabytes
    in 2020, of which only 1% are analyzed and 20% are protected (Burn-Murdoch, 2012).
    The problem is that the rate of data growth eclipses the ability to process it,
    and consequently, big data is not smart data. Only 42% of organizations say that
    they are able to extract meaningful insights from the data available to them (Oxford
    Economics, 2018), even though data analytics and artificial intelligence initiatives
    are crucial to strategic plans for digital transformation. Conventional statistical
    analysis techniques such as regression work well on small data sets, but large
    datasets require different and more sophisticated tools (Varian, 2014). As a result,
    data science has arisen as an academic and vocational field for the application
    of scientific methods for data analysis (Cleveland, 2001).'
