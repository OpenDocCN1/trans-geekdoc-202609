  md: '# Post-quantum Cryptography and Quantum Proofs


    The point is that the underlying technology used to create the hashes in standard
    public-key cryptography at present (2048-bit RSA encryption) is not quantum-secure.
    Potentially quantum-breakable technology includes hash functions based on 2048-bit
    RSA encryption, elliptic curve cryptography (used for digital signatures in blockchains),
    and any other kind of cryptography based on factoring and discrete logarithms,
    pairings, and knowledge assumptions (such as the knowledge-of-exponent assumption).


    Hash functions based on other technologies (that are not quantum-breakable algorithms)
    may be quantum-secure. For example, a lattice-based hash function might be quantum-secure.
    STARKs, which hash the output of PCPs, are conjectured to be quantum-secure. A
    hash function itself is a generic structure that can be upgradable to post-quantum
    technologies as they become standard.


    # 8.4 Quantum Proofs


    In quantum proofs, the prover and the verifier exchange and process quantum information
    instead of classical information. In computational complexity theory, a proof
    is a computation (a mechanical process). The traditional notion of a proof in
    mathematics consists of an individual who proves a theorem (the prover) and another
    individual who verifies the proof (the prover). Computer-assisted or computational
    proofs quickly became an expedient to conduct proofs. Since they are computations,
    proofs can be analyzed with complexity theory. Computational complexity is calculated
    for the two parts of the proof, assessing both efficient construction and efficient
    verification. A key principle is that it takes longer to generate the proof than
    to check it. In both classical and quantum settings, proof generation takes NP
    time (non-polynomial time) and proof verification takes polynomial time. Notably,
    the verification takes place in fewer dimensions. In a mixed computation setting,
    it might take an equal amount of time to generate a proof in a quantum system
    and verify it in classical system. This suggests time arbitrage between computational
    complexity domains as a design principle.


    There are extremely interesting implications for proofs and computational complexity
    theory in quantum computing. For example, in'
