    (typically to the zero state), (3) qubits that have a long-enough coherence time
    for the calculation (with low error rates), (4) a universal set of quantum gates
    (that can be implemented in any system), and (5) the capability of measuring any
    specific qubit in the ending result.


    There are several approaches to quantum computing (Table 3.1) (McMahon, 2018).
    Those with the near-term focus are superconducting chips, ion trapping, topological
    matter, and quantum photonics. Irrespective of the method, the objective is to
    produce quantum computing chips with qubits, using a series of quantum logic gates
    that are built into quantum circuits, whose operation is programmed with quantum
    algorithms. Quantum systems may be accessed locally or as a cloud service. As
    of June 2019, one method is commercially available, which is superconducting circuits.
    Verification of computational claims is a considerable concern. External parties
