  md: 'Compared to classical states, quantum states are much richer and more depth.
    Superposition means that quantum states can have weight in all possible classical
    states. Each step in the execution of a quantum algorithm mixes the states into
    more complex superpositions. For example, starting with the qubit in a position
    of 0–0–0 leads to a superposition of 1–0–0, 1–0–1, and 1–1–1. Then each of the
    three parts of the superposition state branches out into even more states. This
    indicates the extensibility of quantum computers that could allow faster problem
    solving than available in classical computers.


    # 3.2.3 Creating qubits


    A qubit can be created in any quantum system which has two levels of energy that
    can be manipulated (Steane, 1997). Qubits can be conceived as being similar to
    harmonic oscillators at the macroscale. Physical systems that vibrate in a wave-like
    form between two levels of energy are called harmonic oscillators. Some examples
    include electrical circuits with oscillating current, sound waves in, and pendulums.
    Harmonic oscillators can be modeled as a wave function that cycles between the
    peak and trough energy levels. The same wave function concept is true at the quantum
    scale. In this sense, whenever there is a quantum system with two levels of energy,
    it can be said to be a qubit and possibly engaged as a two-state quantum device.
    This implies that there can be many different ways of building qubits. Hence,
    the method for creating qubits might be an engineering choice similar to the way
    that different methods have been used in classical computing for the physical
    implementation of logic gates (methods have ranged over time and included vacuum
    tubes, relays, and most recently integrated circuits).


