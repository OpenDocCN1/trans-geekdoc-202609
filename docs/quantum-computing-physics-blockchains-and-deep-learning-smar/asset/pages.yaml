- pgno: 100
  md: '# 4.4.3.3 Shor''s code


    It is not by accident that Shor''s code, the first quantum error-correction code
    discovered, is 9 qubits. Nine qubits are the smallest encara that can be used
    to confirm that the original qubit was not flipped (changed or damaged), by checking
    various pairwise sequences of possible flipping along the X, Y, and Z axes of
    the qubit. A simple error-correction code could instantiate a single logical qubit
    of data as three physical qubits for each scenario of the three axes. With pairwise
    evaluation, it is possible to determine whether the first and second qubits have
    the same value, and whether the second and third qubits have the same value, determining
    what that value is. If one of the qubits turns out to disagree with the other
    two, it can be reset to their value. Further, the pair-wise evaluation might be
    performed in both time and space suggesting quantum information processing architectures
    with time speed-ups.


    Shor''s code is a sequential method using Pauli operators (3D operators with X,
    Y, and Z values) to act on the system according to the different error permutations
    that could have occurred. Since the ancillary qubits and the original qubit are
    entangled, any error will have a recognizable signature and can be corrected (by
    repairing it into the initial phase or into an irrelevant phase that does not
    impact the original qubit''s information). Since the states of the system are
    eigenstates of eigenvalue of the operators, the measurement does nothing to the
    overall state. The Shor code is redundant, in that the number of bits of information
    it protects is significantly fewer than the number of physical qubits that are
    present. Noise can come from the environment without disrupting the message. Also,
    the Shor code is nonlocal in the sense that the qubit information is carried in
    the entanglement between the multiple qubits to protect it against local decoherence
    and depolarization.


    The Pauli operator that uses X–Y–Z quantum spin representations is one proposed
    method. Kraus operators, which are operator-sum representations, are another (Verlinde
    & Verlinde, 2013). However, Kraus operators can be difficult to engage because
    they require details of the interaction with the environment, which may be unknown.
    Single Pauli operators suggest a more straightforward implementation model.'
