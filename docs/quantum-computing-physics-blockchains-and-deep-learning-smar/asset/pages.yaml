    # 4.3.1 Computability and computational complexity


    The advent of quantum computing calls into sharper relief theories for analyzing
    the kinds of problems that are computable. Computability relates to the theory
    of computation, and investigates how efficiently problems can be solved by different
    kinds of algorithms and models of computation. Quantum computing might extend
    the range of the kinds of problems that can be computed efficiently, but would
    not allow the computability of all problems. Quantum computing could provide an
    incremental yet crucial extension to the kinds of real-world problems that might
    be solvable.


    In computational complexity, two parameters are studied, the required computation
    resources in time and space that are necessary to calculate the problem. The theoretical
    basis for computational complexity is the Church–Turing computability thesis (Table
    4.2). The original Church–Turing thesis is concerned only with the theoretical
    status of whether a given problem is computable at all, irrespective of the time
    required. The extended Church–Turing thesis also incorporates the practical consideration
    of whether a problem is efficiently computable in time. A given problem might
    fail within any of varying tiers of time complexity and space complexity in the
    hierarchy of computational complexity classes.


