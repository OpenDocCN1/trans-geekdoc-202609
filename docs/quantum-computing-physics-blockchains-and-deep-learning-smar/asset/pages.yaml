    field theories attempt to explain problems such as the Fermi theory of beta decay.
    In general relativity, effective field theories have been used to simplify gravitational
    waves, and theorize that general relativity itself may be the low-energy effective
    field theory of a full theory of quantum gravity (in which the expansion scale
    is the Planck mass). Particularly relevant for quantum computing is the practical
    application of effective field theories in the domains of superconductivity and
    condensed matter physics.


    #  2.6.4 Complex multi-level systems


    A key requirement for a SNFT is that it can be used to manage across diverse scale
    levels within a complex system. Such a theory should be able to “identify macroscopic
    smoothness from microscopic noise” as prescribed by complexity theory (Mitchell,
    2009). Various methods, including statistical physics, may be used for linking
    multiple dimensions within complex systems to obtain signal from noise.


    Some aspects of a system are easier to measure on different scales. For example,
    computing the energy spectrum of the Hamiltonian at different levels of quantum
    mechanical systems can be challenging. Such calculations may be straightforward
    at higher levels of the system abstraction, but more difficult when incorporating
    the energetic fields in which the particles actually behave. At this scale, it
    is essentially impossible to compute because there is so much data about particle
    movement. One strategy is to reinterpret particles as states of a quantized field
    (Jaffe & Witten, 2001). A field theory helps to reinstate or roll the system up
    to a higher level of abstraction at which such calculations can be made.'
