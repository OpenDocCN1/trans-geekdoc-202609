    # 11.6 Detailed Description of the Spin-Glass Model


    # 11.6.1 Spin glasses


    Spin glasses are magnetic systems with quenched disorder, meaning an ongoing competition
    between ferromagnetic and antiferromagnetic interactions. Classically, a glass
    is made by applying fire to sand. Most liquids freeze when they are cooled (e.g.
    water). However, when a liquid is supercooled, it becomes a glass. This means
    that it gets viscous and only becomes amorphously solid (even appearing fully
    solid in everyday use). It is thought that all liquids can be made into glasses,
    if they are supercooled quickly enough.


    # 11.6.1.1 The glass transition


    The transition to glass is not a normal and complete phase transition (as in the
    case of particles to a gaseous state) because the atoms are held suspended, or
    quenched. In the transition to glass, the arrangement of atoms is amorphous (i.e.
    ill-defined), but not completely random. Different cooling rates and annealing
    techniques produce different glassy states (glass becoming either brittle or stiff).
    Energetics (the relation of energy and entropy within a system) is implicated
    in bringing about the glass transition.


    # 11.6.1.2 Overcoming the glass transition problem


    The glass transition problem is explaining how a system that seems to be stuck
    in a flat and persistent glassy state can one enter in which the energy landscape
    funnels down to converge on a critical point in order to use useful work, folding
    a protein, for example. Levinthal''s paradox arises in this domain, highlighting
    that although proteins appear to be folding randomly, this cannot be the case
    because they fold in nanoseconds, whereas trying every possible random permutation
    would take longer than the known time of the universe (Mayor et al., 2000).'
