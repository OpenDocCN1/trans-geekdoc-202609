  md: '# Post-quantum Cryptography and Quantum Proofs 177


    Since the random oracle is known and widely implemented, it makes sense to assume
    that a quantum attacker can access the random oracle, and evaluate it in superposition.
    The random oracle is particularly threatening because of all of its potential
    random states, which exponentates the potential advantage of a quantum attacker
    over a classical system.


    # 8.6 Quantum Cryptography Futures


    The long-term goal is not just to quantum-protect existing cryptographic methods,
    but eventually to quantum-instantiate new kinds of cryptographic systems. A fully-quantum
    proof ecosystem might be envisaged with quantum key distribution, quantum algorithms,
    quantum proofs, and quantum accumulators, running on quantum computing infrastructure.
    Quantum accumulators are the post-quantum analog to Merkle trees (accumulating
    paths to system information). Different kinds of quantum accumulators are proposed
    as RSA-style accumulators and class group-style accumulators (Boneh et al., 2018).
    Post-quantum zero-knowledge proofs for accumulators are also proposed (Derler
    et al., 2018), as every part of the infrastructure demonstrates its integrity
    with cryptographic proofs.


