    # 5.6 Consensus


    # 5.6.1 Next-generation classical consensus


    Consensus refers to the process by which a blockchain network reaches agreement
    over updates to the ledger, using a software algorithm, and without the involvement
    of any human parties. The consensus algorithm is the source of the blockchain''s
    trustless trust. The principle between trust is not to avoid trust, but rather
    to transform trust instead of trusting one entity or the parties involved in transactions
    to trusting a mathematical application, and over time, offloading more and more
    trust functionality to such verifiable computation mechanisms. Thus far, consensus
    algorithms have succeeded at providing the high level of cryptographic security
    that is necessary for digital monetary systems, but at an expensive cost. Bitcoin''s
    over 10-year history demonstrates the success of digital consensus-based value
    transfer (Bitcoin’s first transactions were in January 2009, and the chain has
    logged over 583,000 blocks of transactions as of June 30, 2019 (Blockexplorer,
    2019)). The Bitcoin blockchain'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 108 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    has not been successfully attacked (the attacks that have happened typically at
    the blockchain on-ramps and off-ramps of user wallets and exchange websites).
    The downside is that the cost of providing cryptographic security through the
    competitive proof-of-work mining effort is expensive and perhaps not scalable,
    and therefore next-generation consensus algorithms seek to provide the same level
    of cryptographic security with greater efficiency.


    There are a number of projects underway for next-generation consensus algorithms,
    including DFINITY, Hashgraph, IOTA, Nano, and ByteBall. Such algorithms would
    purportedly improve the scalability of existing blockchains. Many next-generation
    algorithms are in the form of Practical Byzantine Fault Tolerance (PBFT), meaning
    that a network of distributed computers can reach a consensus about system updates
    in the face of adversaries. Like many issues in the blockchain context, the problems
    are known challenges in a variety of computer science, cryptography, and network
    science fields. Of specific focus are computer science problems such as fast Byzantine
    agreement and the leader election problem. Classic and quantum solutions have
    been proposed.


    # 5.6.2 Next-generation PBFT: Algorand and DFINITY


    Two notable next-generation consensus projects with available solutions are Algorand
    and DFINITY. Both rely on randomness generation and proof verification. The law
    of large numbers is used, in that a large group of nodes are selected at random
    to confirm each block. Algorand is an open solution, whereas DFINITY is proprietary.
    These next-generation methods could ideally provide secure-efficient consensus
    to blockchains with millions of users.


    Algorand (algorithm providing randomness) uses a fast Byzantine agreement protocol
    as the consensus algorithm. Unlike Bitcoin, the agreement is not performed between
    all of the users in the network, but confined to a small community of randomly
    chosen users for each round. A decentralized voting mechanism is used to pool
    and randomly select users to develop a unique committee to approve each block.
    The approach is based on Verifiable Random Functions (Micali et al., 1999). A
    verifiable random function is a cryptographic building block that maps inputs'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Classical Blockchain


    to verifiable pseudandom outputs. Verifiable random functions extend earlier work
    in cryptography known as the Goldreich–Goldwasser–Micali construction of pseudandom
    functions and zero-knowledge proofs (Goldreich et al., 1986). The process combines
    unpredictability and verifiability. Algor uses verifiable random functions to
    perform cryptographic sorting to select committees to run the consensus protocol
    (this is called the leader selection problem in computer science). Sortition means
    selecting a random sample from a larger group. The decentralized voting mechanism
    pools and randomly selects available users to develop a unique committee to approve
    each block.


    DFINITY also relies on randomness, including a scalable decentralized random beacon
    directly in the consensus protocol. The project uses a threshold relay technique
    for decentralized, deterministic randomness is made possible by certain characteristics
    of the Boneh–Lynn–Shacham (BLS) signature system used in the algorithm. The signature
    scheme uses a bilinear pairing for verification in which signatures are elements
    of an elliptic curve. The DFINITY consensus algorithm also uses a notarization
    technique that overcomes some of the traditional problems in proof-of-stake systems.
    Security proofs are also incorporated (Hanke et al., 2018). The general concept
    is that 250 of 300 signatures are required to confirm a block, and that the 300
    possible signatures have not participated in a recent consensus process.


    # 5.6.3 Quantum Byzantine Agreement


    Another line of consensus algorithm development specifically targets post-quantum
    security. Fast Byzantine Agreement is an ongoing area of computer science research
    (Byzantine Agreement refers to distributed computers in a network reaching agreement
    about updates irrespective of adversaries.) Fast Byzantine Agreement uses faster
    processing algorithms than regular Byzantine Agreement. Such faster processing
    algorithms may be polylogarithmic as opposed to logarithmic (the Hashcash proof-of-work
    used by Bitcoin is logarithmic). Other complexity features are proposed, for example,
    a probabilistic Byzantine Agreement algorithm in which both the time and the communication
    algorithms are polylogarithmic (Braud-Santoni et al., 2013). The algorithm is'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    based on an almost everywhere-to-everywhere agreement protocol (by analogy to
    a complete graph in network theory).


    Various methods for fast quantum Byzantine Agreement algorithms are also proposed.
    One such fast quantum Byzantine Agreement algorithm claims to offer a substantial
    speed-up over classical methods, including in situations of dynamic adversaries
    and faulty nodes (Ben-Or & Hassid, 2005). Other work addresses the topic of distributed
    consensus algorithms on quantum networks. Where most of the progress has been
    focused on optimizing the convergence rate of the algorithm for quantum networks
    with undirected underlying topology, this approach uses directed underlying graphs
