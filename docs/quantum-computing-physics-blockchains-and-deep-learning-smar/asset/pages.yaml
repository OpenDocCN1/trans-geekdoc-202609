    # Quantum Computing: Basic Concepts


    ... it seems that the laws of physics present no barrier to reducing the size
    of computers until bits are the size of atoms, and quantum behavior holds sway


    > — Richard P. Feynman (1985)


    # Abstract


    Quantum computing is a research frontier in physical science with a focus on developing
    information processing at the quantum scale. Quantum computing involves the use
    of algorithms to exploit the special properties of quantum mechanical objects
    (such as superposition, entanglement, and interference) to perform computation.
    In physics, quantum mechanics is the body of laws that describe the behavior and
    interaction of electrons, photons, and other subatomic particles that make up
    the universe. Quantum computing engages the rules of quantum mechanics to solve
    problems using quantum information. Quantum information is information concerning
    the state of a quantum system which can be manipulated using quantum information
    algorithms and other processing techniques. Although quantum computing is farther
    along than may be widely known, it is an early-stage technology fraught with uncertainty.
    The overall aim in the longer term is to construct universal fault-tolerant quantum
    computers.'
  merge: -1
