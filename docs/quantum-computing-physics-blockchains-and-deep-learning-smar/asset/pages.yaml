    (human or machine). Other examples of generic technologies include zero-knowledge
    proofs, error correction, and hash functions, each of which, when generalized,
    conveys a new concept in technology.


    Zero-knowledge proofs are computational proofs that are a mechanistic of algorithms
    that could be easily incorporated as a feature in many technology systems to provide
    privacy and validation. Zero-knowledge proofs are reveal no information except
    the correctness of the statement (data verification is separated from the data
    itself, conveying zero knowledge about the underlying data, keeping it private).
    The proofs are used first and foremost to prove validity, for example, that someone
    is who they claim to be. Proofs are also an information technique. Some amount
    of activity is conducted and the abstracted output is all that is necessary as
    the outcome (the proof evaluates to a bit True/False answer or some other short
    output). The main concept of a proof is that some working is performed and a valid
    answer is produced as the result.


    Quantum error correction is necessary to repair quantum information bits (qubits)
    that become damaged, adhering to quantum properties such as the no-cloning theorem
    (quantum information cannot be copied) and the no-measurement rule (quantum information
    cannot be measured without damaging it). Consequently, quantum error correction
    involves relying on entanglement between qubits to smear the original qubit''s
    information onto entangled qubits which can be used to error-correct (restore)
    the initial qubit. The proximate use is quantum error correction. However, the
    great benefit is that a structural feature is created in the form of the error
    correction apparatus that can be more widely deployed. One such project deploys
    the error correction feature to control local qubit interactions in an otherwise
    unpredictable quantum annealing solver (Lechner et. al., 2015). The overall concept
    is system manipulation and control through quantum error correction-type models.


    Hash functions are another example of a general-purpose smart technology whose
    underlying mechanism is not, but is finding a wider range of uses. Like proofs,
    hash functions are a form of information compression technology. A hash function
    is an algorithm that can be run over arbitrarily large-sized digital data file
    (e.g. a genome, movie,'
