    LSTM RNN forecasting results have been observed in network traffic analysis and
    real-time oil pipeline monitoring. Anomaly detection is an important relation
    that has been demonstrated in network intrusion detection (Bontemp et al., 2016),
    and with various data sets including ECG, electrical power demand, engine data,
    and shuttle valves (Malhotra et al., 2015). In forecasting competitions such as
    the KDD Cup and the Web Traffic Time Series Forecasting competition (run on platforms
    Kaggle, CrowdAnalytix, and Tunedit), hybrid methods employing both traditional
    statistical models and machine learning methods are often used.


    # 9.5.3.1 CNNs for time series forecasting


    Although the sequential estimation techniques used by RNNs correspond obviously
    to forecasting, CNNs might also make a contribution. CNNs are used for image recognition,
    in which an important feature that might be distinguished is symmetry, for example,
    in facial recognition (Saber & Tekalp, 1998). In genomic data, there are symmetries
    between alternating areas of exons (coding regions) and introns (non-coding regions),
    and thus one application of CNNs could be identifying symmetry pattern disruptions
    in genomic analysis that might indicate disease-causing mutations (Leung et al.,
    2015). The known temporal dimension'
