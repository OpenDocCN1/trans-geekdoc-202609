    coupled plasmas, and anomaly detection (Natsume, 2015). The correspondence is
    proving to be a standard model for interrogating complicated bulk domains (any
    kind of spatial volume) with a surface theory in one fewer dimensions. One area
    of research is ongoing work on the correspondence itself. Another focus is in
    astrophysics and cosmology, since the holographic correspondence arose as a purported
    mapping between quantum field theories and higher dimensional theories of gravity.
    One area of study is previously unknown forms of macroscopically entangled quantum
    matter found in stars, black holes, and other cosmological systems.


    A key advantage of the correspondence is a change in overall perspective. Previously,
