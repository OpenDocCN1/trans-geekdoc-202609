    # 4.3 Noisy Intermediate-Scale Quantum Devices


    The long-term goal of quantum computing is to realize universal quantum computation
    on fault-tolerant quantum information processors. In the shorter term, the objective
    is to solve problems with NISQ devices, which are quantum processors that are
    not error-corrected. Quantum computing is developing in different steps based
    on available technical functionality. The first phase of quantum computing (2001–2012)
    consisted of several demonstrations of 1–2 qubits and up to 10-qubit systems using
    a variety of hardware approaches. The second phase of quantum computing is currently
    underway (2012–2019) and includes general-purpose 30–70 qubit systems with gate
    model superconducting circuits, and special-purpose 2048-qubit systems with quantum
    annealing machine superconducting circuits. The landmark discovery in 2012 of
    high-temperature superconductors helped propel the development of general-purpose
    gate model logic in superconducting circuits, in which operations can be controlled.
    Superconducting circuits, whether based in standard gate models or quantum annealing
    machines, are the hardware approaches that are commercially available as of June
    2019.


