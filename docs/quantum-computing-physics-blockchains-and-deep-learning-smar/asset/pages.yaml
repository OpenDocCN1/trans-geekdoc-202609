  md: '# Chapter 13


    # The AdS/CFT Correspondence


    # Abstract


    The anti-de Sitter space/conformal field theory (AdS/CFT) correspondence is the
    theory of a proposed duality between a bulk region with $(d+1)$ dimensions and
    a boundary region with $(d)$ dimensions. The AdS/CFT correspondence (also called
    gauge/gravity duality) suggests that in any physical system, there is a correspondence
    between a volume of space and its boundary region where the interior bulk can
    be described by a boundary theory in one fewer dimensions. The AdS/CFT correspondence
    is a formalization of the holographic principle which denotes the possibility
    of a 3D volume being reconstructed on a 2D surface. There is an information-theoretic
    interpretation of the AdS/CFT correspondence as a quantum error-correction code,
    which is formally solved with tensor network models. Many other fields use the
    AdS/CFT correspondence to study various phenomena in superconducting materials,
    condensed matter plasmas, and network theory.


    # 13.1 History and Summary of the AdS/CFT Correspondence


    The key moments in the history of the anti-de Sitter space/conformal field theory
    (AdS/CFT) correspondence are encapsulated in Table 13.1. The ideas related to
    the holographic principle and the AdS/CFT correspondence began with Bekenstein
    and Hawking wondering about how'
