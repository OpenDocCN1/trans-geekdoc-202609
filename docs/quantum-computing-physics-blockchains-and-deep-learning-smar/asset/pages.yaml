- pgno: 80
  md: '(Wang, 2010). Majorana fermions appear in particle–antiparticle pairs and are
    assigned to quantum states or modes. The computation is built up around the exchange
    of the so-called Majorana zero modes in a sequential process. The sequentiality
    of the process is relevant to changing the order of the exchange operations of
    the particles change the final result of the computation. This feature is called
    non-Abelian, denoting that the steps in the process are non-commuting (non-exchangeable
    with one another). Majorana zero modes obey a new class of quantum statistics,
    in which the exchange operations of particles are non-commutative.


    The Majorana zero modes (modes indicate a specific state of a quantum object related
    to spin, charge, polarization, or other parameter) are an important and unique
    state of the Majorana fermionic system (unlike other known bosonic and fermionic
    phases). The benefit of the non-Abelian quantum statistics of the Majorana zero
    modes is that they can be employed for wave function calculations, namely average
    over the particle wave functions in sequential order. The sequential processing
    of particle wave function behavior is important for constructing efficient logic
    gates for quantum computation. Researchers indicate that wellseparated Majorana
    zero modes should be able to manifest non-Abelian braiding statistics suitable
    for unitary gate operations for topological quantum computation (Sarma et al.,
    2015).


    Majorana fermions have only been realized in the specialized conditions of temperatures
    close to 1 K (−272°C) under high magnetic fields. However, there are recent proposals
    for more reliable platforms for producing Majorana zero modes (Robinson et al.,
    2019) and generating more robust Majorana fermions in general (Jack et al., 2019).


    # 3.3.6 Quantum photonics


    Qubits formed from either matter (atoms or ions) or light (photons). Quantum photonics
    is an important approach to quantum computing given its potential linkage to optical
    networks, in the fact that global communications networks are based on photonic
    transfer. In quantum photonics, single photons or squeezed states of light in
    silicon waveguides'
