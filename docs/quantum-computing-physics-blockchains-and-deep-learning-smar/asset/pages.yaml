  md: '# 13.2 The AdS/CFT Correspondence:

    Basic Concepts


    # 13.2.1 The holographic principle


    The holographic principle was proposed by Susskind, building on work from ''t
    Hooft (Susskind, 1995). The holographic principle is the general phenomenon of
    a physical theory that can be written in some number of dimensions (e.g. the bulk
    volume of a 3D space), which turns out to be dual in a completely different physical
    theory defined on the boundary of that region (a 2D surface). The two theories
    are different but comprise two ways of looking at the same physical situation.
    The duality between them is that there is a one-to-one mapping between the states
    of the first theory and the states of the second theory. For example, there could
    be a particle inside the bulk, which in the boundary theory might correspond to
    an enormous smeared out object. This is how quantum correction is performed, by
    smearing the information to be protected (the logical qubit) across extra qubits
    (physical qubits).


    The holographic principle refers to the notion of a hologram, in which a 3D image
    is recorded on a 2D surface. Las are used to create interference patterns. A hologram
    captures the interference pattern between the laser beams and records it on the
    recording medium, which is a 2D surface. Later, when the hologram is lit up in
    a certain way, the recorded pattern can be seen by an observer.


    In a hologram, the idea is that a 3D image is stored on a 2D space, or more generally
    that a 2D surface can represent a 3D volume. A (d+1) dimensional surface can represent
    the representation of the bulk in one fewer dimensions. The key point is that
    the information needed to describe a 3D volume can be compressed into a 2D surface,
    and the compressed information on the 2D surface can be used to reconstruct the
    information in the 3D volume. One can imagine a bug smeared out on a car''s windshield.
    The bug had a 3D existence, but is now stored on a 2D plane. All of the information
    is still there, it is just smeared out on a plane in one fewer dimensions.


    Reconstruction is an important concept in the AdS/CFT correspondence, in that
    one region can be used to reconstruct the other. Either the'
