    # 13.5.2.1 Coupling in physical systems


    In physics, two objects are said to be coupled when they are interacting with
    one another. In classical mechanics, an example of coupling is the relationship
    between two oscillating systems, such as pendulums connected by a string. In quantum
    mechanics, two particles that interact with one another are coupled. The interaction
    is caused by one of the forces, whose strengths are usually given by a coupling
    constant. Forces that have a coupling constant greater than 1 are said to be strongly
    coupled, and those with constants less than 1 are said to be weakly coupled. The
    basic idea is that strongly coupled particles are experiencing a significant amount
    of fundamental force.


