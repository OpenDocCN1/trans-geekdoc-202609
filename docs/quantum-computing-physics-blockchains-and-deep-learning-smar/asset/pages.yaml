- pgno: 81
  md: '# Quantum Computing: Basic Concepts 59


    used to represent qubits, and they are controlled in a computational model in
    cluster states (entangled states of multiple photons). Quantum photons can be
    realized in computing chips or in free space. Single photons or squeezed states
    of light are sent through the chip or the free space for the computation and then
    measured with photon detectors at the other end.


    For photonic quantum computing, a cluster state of entangled photons must be produced.
    The cluster state is a resource state of multidimensional highly entangled qubits.
    There are various ways of generating and using the cluster state (Rudolph, 2016).
    The general process is to produce photons, entangle them, compute with them, and
    measure the result. One way of generating cluster states is in lattices of qubits
    with Ising-type interactions (phase transitions). Lattices translate well into
    computation. Cluster states are represented as graph states, in which the underlying
    graph is a connected subset of a d-dimensional lattice. The graph states are then
    instantiated as a computation graph with directed operations to perform the computation.


    # 3.3.6.1 Photonic time speed-ups


    The normal speed-up in quantum computing compared to classical computing is due
    to the superposition of 0s and 1s, in that the quantum circuit can process 0s
    and 1s at the same time. This provides massive parallelism by being able to process
    all of the problem inputs at the same time. Photonics allows an additional speed-up
    to the regular speed-up of quantum computing. In photonic quantum computing, superposition
    can be used not only for problem inputs but also for processing gates (Proocio
    et al., 2015). Time can be accelerated by superpositioning the processing gates.
    Standard quantum architectures have fixed gate arrangements, whereas photonic
    quantum architectures allow the gate order to be superimposed well. This means
    that when computations are executed, they run through circuits that are themselves
    superpositioned. The potential computational benefit of the superposition of optical
    quantum circuits is an exponential advantage over classical algorithms and a linear
    advantage over regular quantum algorithms.'
