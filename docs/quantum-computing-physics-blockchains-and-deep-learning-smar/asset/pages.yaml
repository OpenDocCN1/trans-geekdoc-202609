- pgno: 71
  md: '# Quantum Computing: Basic Concepts


    This is a linear combination of the 1 and the 0 (the trajectory or probability
    it is in the 1 or the 0 state). A model of computation can be built by assigning
    states closer to the 0 as being 0 and states closer to the 1 as being 1 (when
    measured).


    A bit is in a state of either 1 or 0. A qubit exists in a state of being both
    1 and 0 until it is collapsed into a 1 or 0 at the end of the computation. A bit
    is a classical object that exists in an electronic circuit register. A qubit is
    a quantum object (an atom, photon, or electron) that bounces around in a 3D space
    with a different probability of being any particular place in the 3D sphere called
    a Hilbert space (and has vector coordinates in the X, Y, and Z directions). Figure
    3.1 shows the physical space of the states of the bit and the qubit.


    The interpretation is that whereas a classical bit is either on or off (in the
    state of 1 or 0), a qubit can be on and off (1 and 0) at the same time, a property
    called superposition. One example of this is the spin of the electron in which
    the two levels can be understood as spin-up and spin-down. Another example is
    the polarization of a single photon in which the two states can be taken to be
    the vertical polarization and the horizontal polarization (single photons are
    often transmitted in communications networks on the basis of polarization). In
    a classical system, a bit needs to be in one state or the other. However, in a
    quantum mechanical system, the qubit can be in a coherent superposition of both
    states or levels of the system simultaneously, a property which is fundamental
    to quantum mechanics and indicates the greater potential range of computation
    in quantum systems.


