    # 4.1.1 Quantum statistics


    Quantum superposition, entanglement, and interference (SEI) properties come together
    in the discipline of quantum statistics. Quantum phenomena have a signature. They
    produce certain kinds of recognizable quantum statistical distributions that could
    only have come from quantum mechanical systems. This includes patterns from interference
    (through amplitudes), superposition (through qubit spins, such as in quantum annealing),
    and entanglement (through Bell pairs and otherwise). These quantum signatures
    are unique and identifiable. It is not surprising, given that quantum statistics
    means studying how wave functions in a quantum mechanical system, in a statistical
    format (i.e. distribution-based). The key point is that only a quantum system
    could produce such output, and thus it can be used as a source of provable randomness.


    As an indication of the unique signifiers of quantum phenomena, one relevant interpretation
    of quantum statistics is Porter–Thomas distribution. These are distributions in
    which the probabilities themselves are exponentially distributed random variables.
    The quantum statistics are known and have been developed elsewhere in physics
    to model quantum many-body systems. The practical application is that quantum
    statistical distributions can be set up to generate predictable patterns or randomness.
    In particular, many applications require a guaranteed source of randomness. True
    randomness instill trust in believing that events have been fairly determined.
    From cryptography (setting the parameters for a system that cannot be back-doored
    or otherwise breached), and blockchains more generally, both in cryptography and
    in facilitating the creation of next-generation consensus algorithms (PBFT) based
    on entropy. Other uses for randomness include running lotteries (picking numbers
    fairly) and auditing election results (selecting precincts to review at random).


    At present, most randomness is not guaranteed to be random, and a potential trend
    would be the widespread use of quantum computers to generate guaranteed randomness
    for use in various security applications.'
