  md: '# 222 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    rather that the quantum solver exists in a 3D blanket-like spread over the entire
    problem space. The landscape comprises all of the qubits in the system. The blanket
    or fog layer lying over the landscape is a direct analogy to the quantum wave
    function. As the annealing cycle runs, the fog layer condenses to reveal one point
    at the global minimum of the landscape. All of the qubits participate in the annealing
    cycle, with their spins flipping back and forth until settles into one of the
    two possible final states (0,1), which overall indicates the lowest-energy state
    of the system. The quantum annealer is programmed to fix gaps in the annealing
    trajectory between the ground state and the first excited state, the second excited
    state, and so on, as the mechanism for identifying the lowest-energy configuration
    of the system.


