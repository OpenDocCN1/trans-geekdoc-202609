    # 14.1.3.1 Pastawski’s holographic code


    Pastawski at al.’s quantum error-correcting code consists of encoding a single
    logical spin in a block of (2n-1) physical spins, such that the logical spin is
    protected against the erasure of any (n-1) physical spins (Pastawski et al., 2015,
    p. 5). Further, the quantum error-correcting code is the basis for a threshold-based
    quantum secret-sharing scheme. The code states the property that a party holding
    any (n-1) qubits does not have information about the logical qubit, whereas a
    party holding any n-qubits has complete information about the logical spin (since
    erasure of the remaining (n-1) qubits is correctable). The structure of such secret-sharing
    schemes is a known cryptographic specification (Cleve et al., 1999).


    Pastawski et al propose a 5-qubit code called the holographic pentagon code. The
    5-qubit code is encoded as a six-leg tensor. The code is represented as a pentagon
    shape (five-sided) with six tensor legs. A network of the pentagon shapes with
    six-leg tensors is tilted to cover a hyperbolic space (Pastawski et al., 2015,
    p. 6). The holographic quantum code is represented as a network of pentagons with
    six-leg tensors covering a hyperbolic space. Each pentagon has six tensor legs,
    one towards the bulk, two towards the neighbors on the left and right, and three
    towards the boundary. Each tensor has one open leg. This creates a structure for
    flowing computationally from the bulk to the boundary.


    The open legs on the bulk are interpreted as the logical input legs of a quantum
    error-correcting code, and the open legs on the boundary are identified as outputs
    in which quantum information is encoded. The tensors have two types of indices,
    those that face the bulk and those that face the boundary. The indices on the
    legs are differentially contracted and uncontracted, with more contraction in
    the bulk logical space and less contraction in the boundary physical space. Overall,
    each tensor has at most two incoming indices from the previous layer and at most
    one bulk index. This provides an isometric mapping from incoming bulk indices
