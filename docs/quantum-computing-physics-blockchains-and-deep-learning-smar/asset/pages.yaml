    # 4.5.4 State transitions


    The objective of SNFT is is to characterize, monitor, and control smart network
    systems. Therefore, an important goal of a field-theoretic formulation is the
    ability to identify system phase transitions. This means both positive and negative
    state transitions, and also first-order and second-order transitions (e.g. a change
    for a continuous parameter or a dynamical evolution of the system) (Sole *et al.*,
    1996). State transitions are the threshold levels of node actions (system-level
    quantities measured). The point is to understand what happens when the system
    reaches certain threshold levels of system-wide quantities. The quantities could
    be measured with temperature terms, operators (Hamiltonian and Lagrangian terms),
    or variational parameters and system path integrals (actions). The complete analysis
    would capture the system-wide calculation of the probability that certain nodes
    are in certain states, derive an interpretation of how this impacts system criticality,
    and monitor and control such criticality.


