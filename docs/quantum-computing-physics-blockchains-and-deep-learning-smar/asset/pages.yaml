- pgno: 61
  md: '# Smart Networks: Classical and Quantum Field Theory 39


    generate a metric as a system composite measure such as a Hamiltonian or Lagrangian.


    An effective field theory example in a biological neural network is that the system-wide
    quantity of interest might be the spiking activation (the threshold at which neurons
    fire), and other data would be superfluous. Another example is a minimal effective
    field theory that only specifies the fields, the interactions, and the power counting
    of the system (the dimensions of power counting across scales).


    Beyond the basic steps, effective field theories might include more complicated
    aspects. There could be additional quantities to measure such as available energy,
    propagation, and the range of system states. Also relevant is identifying the
    dynamics of the system, the dimensions into which the system is expanding. There
    could be various degrees of freedom. The term degrees of freedom generally connotes
    system parameters. More specifically, degrees of freedom is a statistical term
    that means each a number of independently variable factors can affect the range
    of states in which a system may exist, and the directions in which independent
    motion can occur. Degrees of freedom can be conceived as system parameters, and
    with greater sophistication as a statistical measure of the number of states and
    ways in which a dynamic system can move, whether this “motion” is considered in
    physical space or in an abstract space of configurations.


    Overall, the key steps in specifying an effective field theory consist of defining
    (1) the system, (2) the system elements and interactions, (3) the variables of
    interest, (4) the irrelevant structure that can be ignored, and (5) the quantitative
    metrics that can be averaged over the system to produce a temperature-type term.
    Applying the effective field theory development technique to the smart network
    context, the idea is to consider the different levels and dimensions of the system,
    and identify the elements, interactions, and relevant quantities to calculate
    in order to obtain the system behavior. This is developed in more detail in Chapters
    11 and 12.


