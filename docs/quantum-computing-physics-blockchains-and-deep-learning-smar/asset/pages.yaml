    | 4. Reduce complexity by eliminating unnecessary system substructure | Identify
    the degrees of freedom (the system that matters for the problem of study), and
    irrelevant substructure that can be ignored, and note symmetries, anomalies, or
    other known complexity attributes. |

    | 5. Identify quantitative metrics | Articulate the mathematics to measure the
    system, averaging the underlying behavior to derive a simplified model with a
