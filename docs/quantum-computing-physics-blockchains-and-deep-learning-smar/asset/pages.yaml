  md: '# Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    # 3.3.7.3 Quantum dots


    Another early-stage approach, in the form of a semiconductor concept, is quantum
    dots are nanoparticles of semiconducting material (Loss & DiVincenzo, 1998). In
    this method, electrically controlled quantum dots that can be used as qubits are
    created from electron spins trapped in a semiconductor nanostructure, and then
    electrical pulses are used to control them for computation. A semiconductor-based
    structure is fabricated that is similar to that of classical processors. Metal
    electrodes are patterned on the semiconductor layer so that electrostatic fields
    can be made from the wires to trap single electrons. The spin degrees of freedom
    of the electrons are used as qubits. Within the semiconductor nanostructure, there
    are small silicon chambers that keep the electron in place long enough to hybridize
    its charge and spin and manipulate the electron spin-orbit interactions for computation
    (Petta et al., 2005). The coherence interactions typically last longer than silicon
    in other materials, but can be difficult to control. There has been some improvement
    in controlling qubit decoherence in quantum dot computing models (Kloeffel & Loss,
    2013).


    # 3.3.7.4 Nuclear magnetic resonance


    Nuclear magnetic resonance (NMR) is one of the first approaches to quantum computing,
    but is seen difficult to scale for commercial purposes. NMR uses the same technology
    that is used in medical imaging. The physics principle is that atoms have spin
    and electrical charge, they may be controlled through the application of an external
    magnetic field. In 2001, IBM demonstrated the first experimental realization of
    quantum computing, using NMR (Vandersypen et al., 2001). A 7-qubit circuit performed
    the simplest instance of Shor''s factoring algorithm by factoring the number 15
    (into its prime factors of 3 and 5).


