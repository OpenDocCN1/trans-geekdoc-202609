    in a quantum system remain dependent, no matter how far they are) and Bell’s inequality
    as a test to disprove the hidden variables theory (Bell, 1964). The crux of Bell’s
    experiment is noticing that the two different arms of the EPR paradox would deliver
    different predictions, and that these could be tested mathematically with inequalities.
    The most crucial inequality for quantum computing is Bell’s inequality (also called
    Bell inequalities), in particular, the point that Bell’s inequality cannot be
    violated, which allows entangled quantum pairs to be produced. Bell’s inequality
    is implicated in resolving the EPR paradox. Proposed in 1935, the Einstein–Podolsky–Rosen
    (EPR) paradox is a thought experiment proposed by Einstein, Podolsky, and Rosen
    to demonstrate what they thought was a lack of completeness in quantum mechanics
    (Einstein et al., 1935). The paradox refers to the problem that in a system with
    two particles, if one particle is measured, the other is affected, no matter how
    far apart they are. The paradox seems to be that one particle’s changing must
    be due to local variables (instructions carried by the particle or found in the
