    # 4.5.1.1 Chebyshev''s inequality


    One way that inequalities are used is as a tool for analyzing probabilities in
    large datasets. In the practical case of automobile insurance, claims are independent
    events that occur at random times and in random sizes. To estimate required capital
    reserves, it is useful to have a function indicating the distribution and predicting
    the maximum loss. Chebyshev''s inequality is used to project the event distribution
    of insurance claims, and to structure the distribution such that 90% of future
    claims would be expected to fit certain metrics as falling within three standard
    deviations of the mean.


    # 4.5.1.2 Jensen''s inequality


    Another way that inequalities are used is to determine convex and concave functions.
    A convex function is an upward-facing curve (an empty bowl) and a concave function
    is a downward-facing curve (an upside-down bowl). Having convex and concave functions
    is useful for optimization because the tools of calculus can be applied to identify
    minima and maxima. Defining a phenomenon in the profile of an s-curve, with concave
    partitions, suggests the possibility of risk management to accentuate positive
    outcomes and limit negative outcomes. Jensen’s inequality is used in financial
    markets (Taleb, 2007) and medicine (for optimal patient drug dosing)(Reynolds,
    2010).


