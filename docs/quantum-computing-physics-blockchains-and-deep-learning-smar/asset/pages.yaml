  md: '# Classical Machine Learning


    # 9.1.3.1 Size of deep learning networks


    AlexNet (2012) is an early example of an image recognition network, using eight
    layers, 60 million parameters (variables that determine the network structure),
    and 650,000 processing nodes to classify 1.3 million images (Krizhevsky et al.,
    2012). In the 2012 ImageNet LSVR competition, AlexNet beat other networks, performing
    at an error rate of 15.3% versus 26.2% (second place) (Gao, 2017). Since then,
    deep learning networks have grown. Microsoft''s ResNet launched in 2015 with 7
    FLOPS of processing power and 60 million parameters. Baidu''s Speech 2 model was
    introduced in 2016 with 20 exFLOPS and 300 million parameters. In 2017, Google''s
    Machine Translation system had 105 exFLOPS and 8.7 billion parameters (Sherbin,
    2017). Digital Reasoning, a government contractor in Nashville TN provides cognitive
    computing services, a much larger system with 160 billion parameters (Trask, 2018).
    Deep learning networks are run on training data overnight or for a few days, and
    then the resulting algorithms are applied to new sets of test data. Deep learning
    performance is reported as the error rate of the network, meaning the percent
    of data not classified correctly.


    # 9.1.4 Types of deep learning networks


