    information to and from individual ions by causing transitions between the electronic
    states of the ion. The ions influence each other through electrostatic interactions
    and their coupling can be controlled. More specifically, the IonQ ions form a
    crystal structure because they repel each other (since they are all of the same
    isotope of the same element (ytterbium-171)). The electrodes underneath the ions
    hold the charged particles together in a linear array by applying electrical potentials.
    The lasers initialize qubits, entanglement through coupling, and produce quantum
    logic gates to execute the computation. At the end of the computation, another
    laser causes ions to fluoresce if they are in a certain qubit state. The fluorescence
    is collected to measure each qubit and compute the result of the computation.
    One design principle is already becoming clear in ion trap systems, that the number
    of qubits scales as the square root of the gates


    # 3.3.5 Majorana fermions and topological quantum computing


    An interesting and somewhat exotic approach for building a universal quantum computer
    is Majorana fermions. Qubits are made from particles in topological superconductors
    and electrically controlled in a computational model based on their movement trajectories
    (“braiding”). One of the main benefits of topological quantum computing is physical
    error correction (error correction performed in the hardware, not later by software).
    The method indicates very low error rates as compared with other approaches (Freedman
    et al., 2002).


    Topological superconductors are novel classes of quantum phases that arise in
    condensed matter, characterized by structures of Cooper pairing states (i.e. quantum
    computable states) that appear on the topology (the edge and core) of the superconductor
    (hence the name topological superconductors). The Cooper pairing states are a
    special class of matter Majorana fermions (particles identified with their antiparticles).
    Topological invariants constrained by the symmetries of the systems produce the
    Majorana fermions and ensure their stability.


    As the Majorana fermions bounce around, their movement trajectories resemble a
    braid made of different strands. The braids are wave functions that are used to
    develop the logic gates in the computation model'
