    # 9.4 Challenges and Advances


    # 9.4.1 Generalized learning


    So far, the success of deep learning has been limited to a specific range of applications,
    mainly supervised learning for image and text recognition. Data availability and
    low-cost computing resources have facilitated this success, but there is a critique
    that deep learning may have reached a plateau and cannot progress without a different
    paradigm. For example, Google DeepMind researchers suggest the need to extend
    the field with structures that allow for reasoning about the relationships between
    elements in a network (in more of a traditional network science approach) to learn
    how the nodes in a network are connected (Battaglia et al., 2018).


    The problem is that deep learning systems have not produced learning techniques
    that are generalizable beyond their initial scope. Although a computer can beat
    a human opponent in Go, Chess, checkers, or backgammon in each case it is a specialized
    machine. The AlphaGo system (beating human players in Go in 2016) was directed
    at the task of Atari game play (47 classic arcade games), with the result that
    the system can learn and beat human competitors at any particular game, the architecture
    is not portable (Karpathy, 2017). The system can only play one game at a time,
    and must learn the rules from scratch for each game. There is still a vast gap
    between human and machine intelligence in the area of generalized learning.'
