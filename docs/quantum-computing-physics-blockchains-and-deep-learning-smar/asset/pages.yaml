    # 10.2.5 Examples of quantum machine learning


    Quantum machine learning is an interdisciplinary field comprising quantum computing
    and machine learning. This could involve the implementation of machine learning
    in quantum computers (e.g. a quantum computer analyzing classical data with machine
    learning methods), and using machine learning to build and evaluate quantum computers
    (Biamonte et al., 2017). Quantum machine learning may also be used to refer to
    the study of quantum data with machine learning techniques, for example, to analyze
    the large volumes of data generated in experimental particle physics (Radovic
    et al., 2018).


    The two main applications in quantum computing, optimization and simulation, are
    conducive to deployment in quantum machine learning. Machine learning techniques
    excel at pattern recognition (implicated in both optimization and simulation)
    and have led to the widespread adoption of statistical models in computing. Machine
    learning models are probabilistic and statistical, and statistical distributions
    are likewise a native feature of quantum computing (per quantum statistics). The
    statistical distributions available on quantum processors (quantum statistical
    distributions) are likely to be a superset of those available classically. Hence,
    it is possible that quantum computers may outperform classical computers in machine
    learning tasks.'
