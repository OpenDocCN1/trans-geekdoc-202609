    # 12.4.3 Scale-spanning portability


    A key objective of a field theory is to be able to transition portably across
    system scales. Smart network technologies (such as blockchain and deep learning)
    are not just microscopic and macroscopic level, but rather extend for many levels
    up and down, both quantitatively and qualitatively. Two examples of multi-level
    quantitative spanning are as follows. The first is the situation where US Treasury
    officials track dollar bills at 20 different levels of details. In a blockchain
    system, arbitrarily many levels can be rolled up with a Merkle tree structure,
    as the entire Bitcoin blockchain (over 580,000 transaction blocks as of June 30,
    2019) can be called with one composite value, a single hash code or Merkle root.
    Controlled pharmaceutical inventories could be similarly tracked in blockchain-based
    digital asset registries and aggregated at any level of detail, on a hospital,
    county, state, national, or international basis. It could be expected that eventually
    nearly all assets might be registered, tracked, and managed with blockchain-based
    digital inventories (Swan, 2019).


    Turning to deep learning networks, there are examples of spanning both quantitative
    and qualitative system levels. A basic deep learning network might have 5–8 processing
    nodes on average, and different ways of abstracting the operation of these nodes
    into higher-level feature sets. Convolutional networks combine simple features
    (a jaw line) into'
