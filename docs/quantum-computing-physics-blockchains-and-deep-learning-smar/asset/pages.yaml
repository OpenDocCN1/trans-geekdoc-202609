    # 4.2 Interference


    In physics, wave interference is a phenomenon in which two waves in a system have
    either a reinforcing or canceling effect upon one another. There can be positive
    coherence if the two waves are in the same phase, reinforcing each other in a
    stronger way, as in the ocean when multiple big waves come into shore at once.
    Alternatively, there can be negative coherence if waves are in phases that counter
    or cancel each other out, as when there is noise from the environment.


    Interference is used in building quantum circuits and calculating with vectors
    in quantum computing. A quantum circuit harnesses the qubit wave action with matrix
    multiplications (linear algebra). Each time a vector (corresponding to qubit position)
    is multiplied by a matrix (the computational movement through the quantum system),
    the matrix combines numbers in the vector, and the combination reinforces the
    numbers or cancels them out. In this real physical sense, coherent wave behavior
    is calculated as a vector passing through quantum gates. This is an important
    factor that is competing against the fact that coherent behavior is the environmental
    noise of the system. The coherent action of the waves is fragile, and can be easily
    destroyed if the system has too much noise or other interference.


    This is a challenge in quantum computing because irrespective of the qubit-generation
    method (superconducting circuits, trapped ions, topological matter, etc.), there
    is always going to be noise in the system, and if the noise overwhelms the coherent
    wave action, the quantum computer is not going to work. Hence, quantum error correction
    becomes important for mitigating the noise.


