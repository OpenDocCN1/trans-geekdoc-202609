- pgno: 259
  md: '# Chapter 11


    # Model Field Theories:

    Neural Statistics and Spin Glass


    # Abstract


    Smart network field theory (SNFT) is derived from statistical physics (statistical
    neural field field theory and spin-glass models) and information theory (the anti-de
    Sitter space/conformal field theory, AdS/CFT, correspondence). In this chapter,
    statistical neural field theory and spinglass models as two model field theories
    are elaborated in a step-by-step method with regard to the various physics concepts
    and methods they employ. The theories are exemplars of the technophysics principle
    of formulating systems in a way that is analytically solvable. For both theories,
    first an initial approximation of the system is made (with a mean field theory
    and a random energy model). Then, a more detailed analytical formulation is posited
    that can be solved exactly (statistical neural field theory and p-spherical spin-glass
    theory). The approximation reflects the system at stable equilibrium, and the
    solvable model, the system at criticality. Field minimization and statistical
    distributions are key organizing principles in both models. The field theories
    are selected for their comprehensive technophysics focus in complex systems such
    as the brain and superconducting materials, and because these physical models
    continue to inspire advances in machine learning. The model theories might be
    used as a template for formulating field theories in any domain, whether physical
    or algorithmic.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 11.1 Summary of Statistical Neural Field Theory


    The first of the two model systems is a statistical neural field theory for describing
    brain activity (Cowan, 2014). A field theory of large-scale brain activity is
    proposed based on statistical mechanics. For the basic network description in
    stable non-critical situations, a mean field theory is articulated with the Wilson-Cowan
    equations (Wilson & Cowan, 1972). To assess system criticality and phase transition,
    a more complicated field theory is proposed in which network behavior evolves
    over time, and is represented with Markov random walks and Markov random fields
    as a path integral (Buice & Cowan, 2007). Recent works apply statistical neural
    field theory in the context of deep learning models of the visual cortex (Yamins
    & DiCarlo, 2016). A summary of the key aspects of statistical neural field theory
    appears in Table 11.1.


    The overall structure of the field theory is to define the dynamical system, its
    state transitions, how action occurs within the system and evolves, and how system
    criticality and phase transition arise and may be controlled. The system is formulated
    as a Markov process (random walks, random fields) to derive path integrals for
    overall measures such as correlation (distance) functions, moment-generating (probability
    distribution) functions, and actions. The action (an abstract quantity describing
    the aggregate motion of the system such as neural firing threshold) is derived
    as the path integral of the Lagrangian (the overall configuration of network fields,
    particles, and states).


    Table 11.1. Key aspects of statistical neural field theory.


    +   1. Statistical field theory: A statistical field theory is needed to model
    the effects of correlations and fluctuations in a dynamical non-equilibrium system
    such as the brain, particularly in neuronal firing.


    +   2. System dynamics: A field theory is specified to identify system state transitions,
    evolution, and trigger points (a field theory is defined as a set of functions
    to assess system state and criticality).


    +   3. Path integrals: The theory is formulated such that path integrals can be
    derived for overall system measures (actions and functions corresponding to configurations
    of the underlying system).


    +   4. Simplification and renormalization: The model of the neural system is simplified
    with the application of various physics methods.'
