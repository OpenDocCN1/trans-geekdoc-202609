    # 3.3.2 Superconducting circuits: Standard gate model


    The most prominent approach to quantum computing is superconducting circuits.
    Qubits are formed by an electrical circuit with oscillating current and controlled
    by electromagnetic fields. Superconductors are materials which have zero electrical
    resistance when cooled below a certain temperature. (In fact, it is estimated
    that more than half of the basic elements in the periodic table could become superconducting
    if they are cooled to sufficiently low temperatures.) Mastering superconducting
    materials could be quite useful since as a general, about 20% of electricity is
    lost to resistance. The benefit of zero electrical resistance for quantum computing
    is that electrons can travel completely without any energy dissipation. When the
    temperature drops below the critical level, electrons (which usually repel each
    another) form a weak bond and become a so-called Cooper pair that experiences
    no resistance when going through metal (tunneling) and which can be manipulated
    in quantum computing.


    Superconducting materials are used in quantum computing to produce superconducting
    circuits that look architecturally similar to classical circuits, but are made
    from qubits. There is an electrical circuit with oscillating current in the loop
    and a corresponding magnetic field that can hold the qubits in place. Current
    is passed through the superconducting loop in both directions to create the two
    states of the qubit. More technically, the superconducting loop is a quantum interference
    device (SQUID) magnetometer (a device for measuring magnetic fields), which has
    two superconductors separated by insulating layers to form two parallel Josephson
    junctions. Josephson junctions are key to quantum computing because they are nonlinear
    superconducting inductors that create the energy levels needed to make a distinct
    qubit.


    Specifically, the nonlinearity of the Josephson inductance breaks the degeneracy
    of the energy-level spacings, allowing the dynamics of the'
