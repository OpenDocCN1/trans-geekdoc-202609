  md: '# Quantum Computing: Basic Concepts


    system to be restricted to only the 2-qubit states. The Josephson junctions are
    necessary to produce the qubits; otherwise, the superconducting loop would just
    be a circuit. The point is that the linear inductors in a traditional circuit
    are replaced with the Josephson junction, which is a nonlinear element that produces
    energy levels with different spacings from each other that can be used as a qubit.
    Josephson (after whom the Josephson junction is named) was awarded the Nobel Prize
    in Physics in 1973 for work predicting the tunneling behavior of superconducting
    pairs.


    As an example of a superconducting system, Google’s qubits are electrical oscillators
    constructed from aluminum (niobium is also used), which becomes superconducting
    when cooled to below 1 K (−272°C). The oscillators store small amounts of electrical
    energy. When the oscillator is in the 0 state, it has zero energy, and when the
    oscillator is in the 1 state, it has a single quantum of energy. The two states
    of the oscillator with 0 or 1 quantum of energy are the logical states of the
    qubit. The frequency of the oscillators is 6 gigahertz (which corresponds to 300
    millikelvin) and sets the energy differential between the 0 and 1 states. The
    frequency is low enough that control electronics can be built from readily available
    commercial components and also high enough so the ambient thermal energy does
    not scramble the oscillation and introduce errors. In another example, Rigetti
    has a different architecture. This system consists of a single Josephson junction
    on a sapphire substrate. The substrate is embedded in a copper waveguide cavity.
    The waveguide is coupled to qubit transitions to perform quantum computations
    (Rigetti et al., 2012).


