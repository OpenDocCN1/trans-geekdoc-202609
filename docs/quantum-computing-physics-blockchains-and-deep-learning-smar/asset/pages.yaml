    # 5.3.1 Introduction to the Lightning Network


    Envisioned as a Bitcoin scalability solution, the Lightning Network is a decentralized
    system in which transactions are sent over a network of micropayment channels
    (Poon & Dryja, 2016). The transfer of value occurs off-chain through untrusted
    parties along the network route by contracts which, in the event of uncooperative
    or hostile participants, are enforceable via broadcast over the blockchain and
    through a series of decrementing timelocks. The Lightning Network uses onion-style
    routing that the payment information and other transaction details are encrypted
    in a nested fashion so that intermediary nodes along the route only know the previous
    and next hop in the route.


    The benefits of the Lightning Network are that for the first time; transactions
    that have instantaneous settlement without the ~10-min wait for confirmation.
    Very small micropayment transactions are free (no transaction fee). The payment
    channel structure further enables more sophisticated contractual relationships
    between parties. Other variations of payment channels have been proposed, the
    Lightning Network is the most prominent live project.


    As of June 30, 2019, the public-facing Lightning Network consisted of 34,242 public
    channels on 8,944 nodes with a network capacity of 940 Bitcoin (US$10,428,752)
    (1ML, 2019). The biggest nodes are associated with blockchain ecommerce and retail
    service providers. Examples include Bitref (cryptocurrency gift cards), Bitstream
    (blockchain financial services), tippin.me (a custodial wallet for receiving and
    cashing out Lightning payments), Hodl Monkey (crypto clothing (T-shirts and gear)),
    and Living Room of Satoshi (everyday bill pay with Bitcoin). Consumer-friendly
