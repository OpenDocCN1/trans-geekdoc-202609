    uses including password protection and the sending of secure messages across the
    internet such that a receiving party with the hashing algorithm and a key can
    decrypt the message. Hash functions are also finding novel uses. One is that since
    internet content can be specified with a URL, the URL can be called with a hash
    format by other programs (the hash function standardizes the length of an arbitrarily-long
