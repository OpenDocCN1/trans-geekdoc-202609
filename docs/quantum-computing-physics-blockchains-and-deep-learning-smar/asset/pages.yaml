    values to real numbers for calculation, the softmax function exponentiates a set
    of numbers, and rescales them so that they sum to one, allowing a state interpretation
    based on probability. The general idea is that field-theoretic formulations such
    as the softmax function allow deep learning networks to be evaluated with a Hamiltonian-type
    system-wide probability measure.'
