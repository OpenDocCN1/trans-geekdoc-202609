    # # Classical Machine Learning


    ### Abstract


    Machine learning refers to mechanistic systems that “learn” by modeling high-level
    abstractions in data and cycling through trial-and-error guesses with feedback
    to establish an optimally weighted system that can make accurate predictions over
    new data. The main forms of deep learning networks are convolutional neural nets
    (CNNs) for image recognition and recurrent neural nets (RNNs) for text and speech
    recognition. Learning may be supervised (executed on pre-classified datasets)
    or unsupervised (finding patterns in unlabeled data). Prominent advances include
    adversarial nets, dark knowledge, and manifold learning. The technical aspects
    of machine learning include formulating the problem as a logistic regression,
    running it on a modular processing network, and iterating to find an optimal solution.
    Although machine learning excels at certain tasks, namely image and text recognition,
    its expandability to more complicated data analysis problems has been questioned.


    # ## 9.1 Machine Learning and Deep Learning Neural Networks


    Artificial intelligence, using computers to do cognitive work (physical or mental)
