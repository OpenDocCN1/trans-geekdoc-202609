    # 3.3.1 The DiVincenzo criteria


    DiVincenzo criteria have been proposed as standards that constitute the five elements
    of producing a well-formed quantum computer (DiVincenzo, 2000). The criteria are
    having (1) a scalable system of well-characterized qubits, (2) qubits that can
    be initialized with fidelity'
