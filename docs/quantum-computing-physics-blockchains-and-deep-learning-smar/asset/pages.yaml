    Quantum secret sharing is a standard method used in cryptography (Cleve et al.,
    1999). The notion is to have a threshold scheme in which a quantum secret state
    is divided into n-shares where any k of those shares can be used to reconstruct
    the secret, but any set of k-1 or fewer shares cannot. The core concept is essentially
    the same as a quantum error correction scheme, in which a smaller set of information
    (a logical qubit) is recapitated from a sufficiently larger set of information
    (entangled physical qubits).


    Although similar in concept, quantum secret-sharing is more secure, and expands
