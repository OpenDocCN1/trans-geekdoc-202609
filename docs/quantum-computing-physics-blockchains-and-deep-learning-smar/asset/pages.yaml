    # ## Abstract


    The special properties of quantum objects (atoms, ions, and photons) are superposition,
    interference, and entanglement. Superposition refers to particles existing across
    all possible states simultaneously. Interference is the situation where intervention
    from noise in the environment damages the quantum object, and also the possibility
    that the wave functions of particles can either reinforce or diminish each other.
    Entanglement means that groups of particles are connected and can interact in
    ways such that the quantum state of each particle cannot be described independently
    of the state of the others even when the particles are separated by a large distance.
    One of the most important implications of entanglement is that qubits can be error-corrected,
    which will likely be necessary for the advent of universal quantum computing.
    An application of quantum computing that is already available is certifiably random
    bits, a proven source of randomness, which is used in secure cryptography.


