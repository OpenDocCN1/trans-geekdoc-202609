    Smart networks are state transition machines (systems that track individual and
    global state changes). The state values may be binary (quantal; discrete), or
    continuous, depending on the modeling technique. A field-theoretic model can expand
    in complexity. Having continuous state values would require a more complicated
    configuration, and eventually introduce operators instead of merely point functions.


    Nodes have states. In the statistical neural field system, biological neurons
    may be one of two or three states (quiescent or active (QA), or also refractory
    (QAR)). In blockchain systems, the same two-state structure could be used initially,
    to model nodes that are either broadcasting or quiescent (BQ). In deep learning
    networks, different node states might likewise be identified. These could include
    a basic measure of whether the node is processing or finishing (PF), or more complicated
    measures such as a maximum or minimum error for the particular node, or a continuous
    value for error-maximizing contribution. The system may be already set up to operate
    by calculating the maximum error contributed by each node and a field theory could
    be a more effective or alternative aggregator of such information. In deep learning
    systems, the softmax function is essentially a field-theoretic application of
