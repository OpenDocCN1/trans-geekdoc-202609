    # 14.1.3.2 Holographic codes: Qutr and qubits


    The most basic quantum error-correction code is a stabilizer code which acts to
    flip the sign back in a quantum information bit that has been changed (i.e. stabilize
    the qubit). Other quantum error-correction codes perform more sophisticated operations
    such as projection.) Almhei et al. (2015) discuss a theoretical example of a quantum
    error-correction code with qutr (three-state quantum information bits). The qutrit
    is a [3,1,2] stabilizer code, in the format of [ancilla size, logical bit size,
    distance] bit format. This means having 3 physical qubits, to protect 1 logical
    qutrit, over a distance of 2 (deletions up to 1 can be protected (2−1=1)), and
    the bit format is 3 (a qutrit, not a qubit). In the qutrit code, there is 1 logical
    quantum information distributed into 3 physical qutr, each of which has 3 states,
    for a total of 9 elements (3×3). The 9-element qutrit is conceptually similar
    to Shor’s code which is qubit-based but also has 9 elements (Shor, 1995). This
    compares with the slightly shorter [7,3,2] Steane code, also qubit-based, which
    has a 7-qubit ancilla (Steane, 1996).


    Whereas the qutrit example is more theoretical, Pastawski et al.’s holographic
    pentagon code is an explicit tensor network model that can be solved and implemented.
    The holographic pentagon code is a [5,1,2] code, meaning having 5 physical qubits,
    1 logical qubit, with distance 3, and bit format 2 (qubit as opposed to qutrit).
    There is 1 logical degree-of-freedom in the bulk (at the center of the pentagon)
    related to 5 physical degrees-of-freedom on the boundary (the five sides of the
    pentagon). The distance is 3, meaning that information recovery is possible for
    two'
