    Although not imminent, methods are constantly improving, and readying cryptographic
    systems for the quantum era are prescribed.


    A 2019 report published by the US National Academies of Sciences predicts that
    breaking RSA encryption is unlikely within the next decade. The report indicates
    that any serious applications of quantum computing'
