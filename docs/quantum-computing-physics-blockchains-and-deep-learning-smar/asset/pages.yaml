    # 11.6.3.2 Entropy: Coffee cup example


    Most basically, entropy is a measure of how many ways a system can be organized
    so that it looks the same. For example, a coffee cup with coffee and milk mixed
    together is a system with high entropy. There are many different molecular structures
    that produce the same effect. A coffee cup is at maximum entropy when the coffee
    and the milk are stirred together. The more disordered the system, the higher
    the entropy. On the other hand, an ordered system has low entropy. When the coffee
    and the milk are in two separate containers before they are mixed, the systems
    of the coffee and the milk are in an ordered state with low entropy. If one molecule
    is pulled out of the milk and placed in the coffee, it will be noticeable. Whereas
    in the disordered system at maximum entropy with the coffee and the milk mixed
    up together, it does not matter if a molecule is moved around. The mixed state
    is more entropic, it is overall, entropy is a way of thinking about the order
    or disorder of the possible arrangements of a system. A disordered system is at
    maximum entropy (when the coffee and milk are fully mixed together). An ordered
    system is at minimal entropy (when the coffee and the milk are separate).


