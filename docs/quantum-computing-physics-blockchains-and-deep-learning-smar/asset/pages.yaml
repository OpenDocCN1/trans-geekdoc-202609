- pgno: 119
  md: '# Classical Blockchain 97


    The Lightning Network uses a combination of source routing and onion routing.
    Source routing is a standard internet routing protocol in which the sender specifies
    the route to the recipient. This contrasts with conventional routing, in which
    routers in the network determine the path incrementally based on the destination.
    Onion routing is a privacy-protection technique that each hop only knows the previous
    hop and the next hop. The initial message has nested layers of instructions for
    routing the whole path (the name onion routing). The first router peels off the
    outside message layer and executes the instructions which culminate in the information
    routed to the next router. That router peels off the then-top message layer and
    runs the instructions, and so on, until the information payload reaches its destination.
    Key-based encryption prevents the routers from seeing inside the sent messages.


    # 5.3.3 Smart routing: Sphinx routing and rendez-vous routing


    The Lightning Network is a counterintuitive because it is not possible to send
    a payment directly to another party, the receiving party must first send an invoice
    to the sending party. The sender sends the information in the invoice to route
    the payment, such as the amount, the pay-to address (the recipient''s Lightning
    node public key), and a hash. The hash is the hash of a cryptographic secret that
    allows each participant in the route to redeem the previous payment and forward
    the next payment. Using this information, the sender constructs a route to the
    destination.


    New smart routing protocols, sphinx routing and rendez-vous routing, previously
    developed in computer science, are proposed to eliminate the invoice requirement
    and generally improve the usability and security of Lightning transactions. Sphinx
    routing (connoting enigma, or unknown route) is a cryptographic message format
    that is essentially an improved onion-like method for relaying anonymized messages.
    Sphinx routing has additional security features such as path length and the inability
    to link the legs of a message’s journey through a network (Danezis & Goldberg,
    2009).


    In the Lightning Network, sphinx routing is used to reduce some of the invoicing
    requirements. The line-of-trust structure still operates the same way, the recipient
    sends the sender the hash and the routing'
  merge: -1
