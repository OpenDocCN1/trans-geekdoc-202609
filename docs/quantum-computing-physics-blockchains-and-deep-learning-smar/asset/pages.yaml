    # 7.2 Zero-Knowledge Proofs and Public Key Infrastructure Cryptography


    # 7.2.1 Public key infrastructure


    The significance of zero-knowledge proofs is that they could potentially become
    a standard part of cryptographic network infrastructure. The problem is that the
    internet was not designed to be secure, and hacking, break-ins, and espionage
    have become routine. Zero-knowledge proofs are one way of making the internet
    secure and private by ensuring the confidentiality and integrity of data. The
    internet can be turned into a VPN (virtual private network) such that all transactions
    are private. Zero-knowledge proofs are a privacy overlay for the internet, and
    are based on public key infrastructure (PKI).


    PKI is a method for securely exchanging cryptographic keys over a public channel.
    Contemporary PKI infrastructure was originally conceptualized by Merkle (1978)
    and implemented as the Diffie–Hellman key exchange protocol (Diffie & Hellman,
    1976). The open internet is a public channel. Users would like to send each other
    messages across the public channel, and need a way to encrypt them so they stay
    secure and cannot be read by other parties. (In computer science, this is called
    the Byzantine general’s problem, namely that in a war, generals would like to
    secure messages to each other across the battlefield.) In a PKI system, each user
    has a public–private key pair. Users keep their private key secure and knowable
    only to themselves, and distribute their public key on the open internet. The
    keys are each strings of a certain length (for example,'
