  md: '# Model Field Theories: Neural Statistics and Spin Glass 241


    model is mobilized in the notion of spin glasses (disordered magnets which are
    metastable systems with roughly half of their bonds spin-up, and half spin-down
    (Anderson, 1988)). Through Ising ferromagnetics incorporated as a spin-glass model,
    the motivation is to try to explain phase transition (such as neuronal firing)
    and to examine energy minimization problems (with the spin-glass model as a physical
    system in which energy can be minimized).


    The Wilson-Cowan equations (for approximating continuous system kinematics) can
    be applied with symmetric or anti-symmetric weights in the formulation, which
    has application implications. In the neural field theory, anti-symmetric weights
    are used to explain neuronal signaling, by constructing a theory of coupled oscillators
    (excitatory and inhibitory oscillators).


    In machine learning, on the other hand, symmetric weights are used to build a
    mechanistic system for computation. The idea is to analogy with spin glasses as
    a physical system in which energy can be minimized as a computational feature.
    Whereas asymmetric weights allow critical behavior such as neuronal firing to
    be assessed, symmetric weights enable a general architecture using neurons as
    processing units to be constructed. A symmetrically weighted Ising model is used
    to instantiate neurons as generic nodes in machine learning.


    The field of machine learning was developed using the principles of spin-glass
    ferromagnets to create an artificial neural net, called a Hopfield network (modeled
    on a symmetrically weighted computational model of brain neurons) (Hopfield, 1982).
    A further instantiation of this kind was proposed in the notion of Boltzmann machines
    (Ackley et al., 1985). Like the Hopfield network, the Boltzmann defines a system
    “energy” term as an overall network parameter and level for calculation.


    In machine learning, spin-glass-inspired energy functions are a key feature, and
    also the sigmoidal structure of neuronal processing, which is likewise defined
    in statistical neural field theory. The sigmoidal structure of neuronal processing
    is used in machine learning in the logistic regression formulation of the problem
    to be calculated (sigmoid) format. In the brain, the sigmoidal structure is used
