  md: '# 9.2 Perceptron Processing Units


    Deep learning networks comprise thousands or millions of modular processing nodes,
    which are identical and assembled into layers in a Lego-like fashion. The architecture
    is highly scalable and networks can be organized into arbitrarily many layers.
    The processing units may be variously called perceptrons, artificial neurons,
    neurons, logits, or nodes, all of which are (generally) synonymous. The structure
    of the processing node is derived from graph theory, with edges (lines indicating
    input and output values) and nodes (where processing takes places).


    The node computation is in the form of a computation graph with three phases:
    input, processing, and output. The incoming data values (numbers) that come into
    the node to be processed. The node performs an operation (such as addition) on
    the input values. This results in an output value (a number) that becomes one
    of the input values for the downstream node in the next layer. The operations
    conducted by the node structure are fixed, but there are other variables which
    the network adjusts in-of the node structure in its learning process.


    Each node has two variable parameters, a weight and a bias. The input values may
    be weighted (applying the weight as a coefficient), and the node processing center
    may have a bias (applying the bias as a threshold value). The weights and the
    biases are the variable parameters that the system adjusts with trial-and-error
    guessing as it tries to identify relevant features in the data set. The input
    and output values change as the network operates. The weights assigned to the
    input edges vary as learning proceeds, increasing or decreasing the strength of
    the signal that is sent into the node to be processed. Nodes may have a threshold
    value (bias) such that the downstream signal is sent only if the aggregate signal
    is above or below a certain level (analogous to signal transmission thresholds
    in the brain). The system cycles forward and backward (feeding forward and back-propagating),
    iteratively updating the variables (weights and biases) as it establishes which
    features are most relevant for making correct guesses about the training data.
    A deep learning system is a vast modular network of layers of processing nodes,
    with variable information flows'
