  md: '# Chapter 8


    # Post-quantum Cryptography and Quantum Proofs


    # Abstract


    Zero-knowledge proofs are just the basic concept in proof technology. Many other
    sophisticated formulations of proofs and related quantum-secure technology are
    proposed. Earlier forms of zero-knowledge proof technology are not quantum-resistant.
    Proofs based on generic hash formulations as opposed to classical PKI cryptography
    are thought to be post-quantum secure because the cryptography can be upgraded,
    whereas classical PKI cryptography is known not to be quantum-secure. STARKS are
    a new form of zero-knowledge proofs for blockchains with a sophisticated architecture
    based on error correction codes, random queries, and inconsistency checks. The
