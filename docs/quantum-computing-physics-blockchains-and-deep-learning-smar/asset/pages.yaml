    # 3.3.3 Superconducting circuits: Quantum annealing machines


    Within the superconducting circuits approach to quantum computing, there are two
    architectures, the standard gate model (described above) and'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Quantum Computing: Basic Concepts


    quantum annealing (invented first, but more limited). The two models are used
    for solving different kinds of problems. The universal gate model denotes a general-purpose
    computer, whereas the annealing machine is specialized. Quantum annealing machines
    have superconducting qubits with programmable couplings that are designed to solve
    QUBO problems (quadratic unconstrained binary optimization), a known class of
    NP-hard optimization problems that minimize a quadratic polynomial over binary
    variables.


    In quantum annealing, the aim is to harness the natural evolution of quantum states
    over time. A problem is set up at the beginning and then the system runs such
    that quantum physics takes its natural evolutionary course. There is no control
    over the system’s evolution, and ideally, the ending configuration corresponds
    to a useful answer to the problem. As compared with quantum annealing, the gate
    model aims to fully control and manipulate the evolution of quantum states during
    the operation. This is more difficult given the sensitivity of quantum mechanical
    systems, with having more control implies that a bigger and more general range
    of problems can be solved. The difference in approach explains why quantum annealing
    machines appeared first and have been able to demonstrate 2048 qubits, whereas
    only 30–70 qubits are currently achieved in the standard gate model.


    Quantum annealing is an energy-based model related to the idea of using the fluctuations
    of spinning atoms to find the lowest energy state of a system (Kadowaki & Nishimori,
    1998). Annealing refers to the centuries-old technique used by blacksmiths to
    forge iron. The thermal annealing process, the iron becomes uniformly hot so that
    the atoms settle in the lowest energy landscape, which makes the strongest material.
    Similarly, quantum annealing is based on the idea of finding the lowest energy
    configuration of a system.


    Quantum annealing is deployed as a method for solving optimization problems by
    using quantum adiabatic evolution to find the ground state of a system (adiabatic
    means heat does not enter or leave the system). Run on a quantum computer, the
    quantum annealing process starts from a ground state which is the quantum mechanical
    superposition of all possible system states with equal weights. The system then
    evolves per the time-dependent Schrödinger equation in a natural physical evolution
    to'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'settle in a low-energy state. The computational problem to be solved framed
    in terms of an energy optimization problem in which the low-energy state signals
    the answer. (The quantum annealing process is described in more detail in Chapter
    10.)


    Overall, the quantum annealing process allows the system of spins (spinning atoms
    of qubits) to find a low-energy state. Superconducting circuits in the quantum
    annealing model can be thought of as programmable annealing engines (Kaminsky
    & Lloyd, 2004). Optimization problems are framed such that they can be instantiated
    in the form of an energy landscape minimization. Although annealing machines are
    not purpose quantum computers, one advantage is since annealing systems constantly
    attempt to reach the lowest energy state, they are more tolerant and resistant
    to noise than gate model systems and may require much less error correction at
    large scales.


    # 3.3.4 Ion trapping


    Another prominent approach to quantum computing is trapped ions. In these quantum
    chips, ions are stored in electromagnetic traps and manipulated by lasers and
    electromagnetic fields. Ions are atoms which have been stripped of or received
    electrons, which leaves them positively or negatively charged and therefore more
    easily manipulatable. The advantage of ion trap qubits is that they have a long
    coherence time (making calculations easier) and (like annealing machines) may
    require less error correction at large scales. A single qubit trap may accommodate
    30–100 qubits, and 23 qubits have been demonstrated in a research context (Murali
    et al., 2019).


    The IonQ quantum chip uses ytterbium ions, which unlike superconducting qubits,
    do not need to be supercooled. Bulky cryogenic equipment is not required, and
    the entire system occupies about one cubic meter, as opposed to a much larger
    footprint for superconducting circuit machines. The chip is a few millimeters
    across. It is fabricated with silicon and contains 100 electrodes that confine
    and control the ions in an ultra-high-vacuum environment.


    To operate, the ion trap quantum computer holds the ions in a geometrical array
    (a linear array for IonQ). Laser beams encode and read'
