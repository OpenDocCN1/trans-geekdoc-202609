    # 10.2.4.2 Molecular and materials simulation


    Understanding the nitrogen fixation process is a pressing problem, but the promise
    of quantum computing more generally is that a new computational platform may become
    available for simulating every kind of molecules and materials. As Feynman envisioned
    universal quantum computers that simulate the world of quantum mechanical physics,
    Laplace dreamed of a probabilistic system which could instantiate Newtonian mechanics
    and "comprehend all the forces by which nature is animated" (Laplace, 1812). Laplace
    was instrumental in developing the probability theories that enable modern statistics.


    The method used in classical computing systems for molecular simulation is called
    molecular dynamics (MD). MD is a computer simulation method for studying the physical
    movements of molecular systems in which the atoms and molecules are allowed to
    interact for a fixed period of time, which provides a view of the dynamic evolution
    of the system. However, since molecular systems typically consist of a vast number
    of particles, it is only possible to simulate basic configurations for short amounts
    of time in classical computers.


    In molecular simulation, the first task of quantum computation is recapitulating
    already-known solutions for simple molecules such as the hydrogen molecule. In
    one example, research has extracted both the ground state and excited states for
    the H2 molecule by computing the molecular spectra on a quantum processor (Coless
    et al., 2018). The limitations of classical computing systems make it difficult
    to solve problems involving a few atoms, but near-term NISQ devices may be able
    to address some of these challenges. Quantum simulation initially focused on simple
    molecules (hydrogen and helium), but is now being used to tackle more complicated
    atomic configurations as well. Other research demonstrates the experimental optimization
    of Hamiltonian problems with up to 6-qubits and more than one hundred Pauli terms,
    determining the ground-state energy for molecules of increasing size, up to BeH2
    (Beryllium hydride, a medium-sized'
