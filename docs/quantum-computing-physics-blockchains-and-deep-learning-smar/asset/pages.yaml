    # 14.1.2 Tensor networks and MERA tensor networks


    Tensor networks are mathematical modeling tools for quantum many-body systems.
    Such tensor networks are collections of tensors with indices connected according
    to a computation graph or network pattern. The key advance of tensor networks
    is that they can be used to efficiently represent quantum many-body states with
    only polynomially many parameters (e.g. in a computable fashion). For example,
    specific physical quantities of interest in quantum many-body problems (such as
    correlation functions and local expectation values) can be reduced to the operation
    of contracting the indices of a tensor network.


    Tensor networks have allowed tremendous progress in the domain of previously unsolvable
    quantum many-body problems. Quantum many-problems refer to the challenge that
    systems with more than even just two particles (i.e. quantum many-body systems)
    are nearly computationally impossible to calculate given the multi-dimensional
    particle movements'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# 322 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    of each quantum body and their interactions. Exact calculations of particle interactions
    are impractical for several reasons including the emergence of many-body effects
    as a result of electron correlations (each electron being influenced by the presence
    of other electrons). Tensor networks were introduced in the context of cerebellum
    neural networks, as a geometrization of brain function using tensors (Pellionix
    & Linas, 1980), and have been taken up in many fields, including physics in relation
    to the holographic principle and the AdS/CFT correspondence (Maldacena, 1998;
    Witten, 1998). Tensor networks are used in the contemporary context of quantum
    computing to reduce dimensionality in high-dimensional tensor spaces, for tasks
    such as validating quantum-classical programming models with tensor network simulations
    (McCaskey et al., 2018).


    MERA is a tensor network method which specifically incorporates the entanglement
    property of quantum many-body systems. MERA (multiscale entanglement renormalization
    (guess)) combines tensor networks with entanglement renormalization (portability
    scales) to create a family of tensor networks that efficiently approximates the
    wave functions of quantum bodies with long-range entanglement (Vidal, 2008).


    MERA provides an efficient representation of quantum many-body states on a d-dimensional
    lattice that is equivalent to a quantum circuit, and can be instantiated to compute
    exact measures such as local expectation values. The research advance is that
    the AdS/CFT correspondence can be modeled by a MERA-like tensor network in which
    quantum entanglement in the boundary theory is used as a building block for emergent
    bulk structure such as geometry (Swingle, 2012). The practical benefit is that
    MERA tensor network methods can be used to prepare initial states of complicated
    quantum many-body systems for use in quantum computing and mathematical theory-testing.
    Here, Pastawski et al. (2015) use a MERA tensor network instantiation to formalize
    the holographic quantum error-correction proposal made by Almheiri et al. (2015).


