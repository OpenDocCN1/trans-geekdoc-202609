    # 10.2.2.3 Quantum computing gates


    The three basic quantum computing gates are the Hadamard gate, the CNOT gate,
    and the Toffoli gate. Respectively, the gates act on one, two, and more qubits.
    The Hadamard gate creates the superposition of qubits, the CNOT gate can flip
    the bits, and the Toffoli gate can execute all of the regular Boolean operations
    of a classical circuit. A qubit is initialized to a 1 or a 0 when it enters the
    quantum circuit (typically, all qubits are initialized to 0). Since the qubits
    all start in the 0 state, a transformation needs to be applied so that a qubit
    enters a superposition state of 0 and 1, and this is accomplished with a Hadamard
    gate. When a Hadamard gate is applied to a qubit, the qubit becomes a superposition
    of 0 and 1. The qubit is essentially now a vector in the Hilbert space. The application
    of the Hadamard gate means that the qubit is in a position that is the sum of
    the 0 vector and the 1 vector, with a 50% change of being in either, or essentially
    being in all possible states, in the 3D space.


    The Hadamard gate acts on 1 qubit to put it in a superposition state and the CNOT
    gate acts on 2 qubits. The CNOT (controlled NOT) gate is a simple IF statement
    operating in a 2-qubit system that flips the target bit if the control bit is
    1. The instruction is that in a pair of qubits, if the control bit is 0, nothing
    happens to the target bit. If the control bit is 1, the target bit is flipped
    (a 0 becomes a 1 or vice versa). The CNOT gate starts to introduce a basic computational
    instruction set into the quantum logic gate with IF/THEN logic.'
