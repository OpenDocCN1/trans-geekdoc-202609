    Bulletproofs cannot be directly applied to the account-based transaction model.
    An issue arises in the commitment structure of bulletproofs of replacing the transaction
    amount with a commitment. Since the account state is used in the computation to
    generate the commitment, the commitment will be invalid if the account state has
