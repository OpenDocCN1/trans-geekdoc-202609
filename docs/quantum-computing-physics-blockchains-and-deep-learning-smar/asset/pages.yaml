    # 6.4.3 Key lifecycle management


    The possibility of QKD raises the question of standardized practices more generally
    regarding key use and lifecycle. Although many keys are for one-time use, other
    keys are issued for persistent use, may not be part of a lifecycle management
    program. For example, blockchains do not typically have any deactivation policy
    for private keys. The US NIST has published guidelines for defining appropriate
    crypto-periods for cryptographic keys (Barker et al., 2016, p. 64). The crypto-period
    is the period of time between the key activation and the key deactivation (i.e.
    the lifecycle of the key). The NIST report suggests that private signature keys
    should expire or be deactivated relative to the sensitivity of their use, not
    necessarily based on a fixed amount of time. Other factors might concern the risk
    of key compromise and the cost of new key generation. Aside from the crypto-period,
    there are other issues to consider in an overall key management program. These
    could include the types of keys (public, private, and symmetric) and their corresponding
    usage (authentication, authorization, signing, and verification). Further, there
    are considerations relating to how a key is properly generated, distributed, stored,
    replaced, deleted, and recovered during its lifetime, and how it is protected
    against threats.


