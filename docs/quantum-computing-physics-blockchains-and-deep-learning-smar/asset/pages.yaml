    #  10.2.1 Standardized quantum computation tools


    A standardized set of tools and algorithms is starting to be established for

    quantum computing. The Bernstein–Vazirani algorithm is the “Hello,

    World!” equivalent in quantum computing, in that it is one of the first

    basic demonstrations performed in whatever form of quantum computing

    hardware is being used. The Bernstein–Vazirani algorithm is used to

    extract specific encoded bits from a string (Bernstein & Vazirani,

    1997). The team contributed early work regarding the compu-

    tational complexity of quantum computers and classical computers, quan-\ifying
    the potential benefits of quantum computing.


    A second standardized tool that is emerging in quantum computation

    is the variational eigensolver (VQE) (Peruzzo et al., 2014). The

    VQE is a quantum-classical hybrid algorithm that can be used to find the

    eigenvalues of a matrix. The method was initially developed in the context

    of quantum chemistry. An eigensolver is a program designed to calculate

    solutions to 3D problems (for example, in quantum mechanical systems

    or in big data problems with multiple dimensions). In the quantum

    computing context, the VQE is well suited to solving certain classes of

    problems on near-term NISQ devices. The strategy of the method is that

    ever minimal quantum resources are useful when combined with classical

    routines. VQEs have been demonstrated in many kinds of quantum

    computation problems in optimization and simulation, for example, in

    finding the ground state energy of a Hamiltonian in an energy landscape

    optimization problem.


    A third important standardized tool is the quantum approximate opt-

    mization algorithm (QAOA) proposed by (Farhi et al., 2014) and devel-

    oped into a readily-usable format as a quantum alternating ansatz

    (guess) (Hadfield et al., 2019). The QAOA is designed to work on combi-

    tatorial optimization problems. The algorithm uses a QAOA to solve an

    optimization routine, for example, providing solutions to the Traveling

    salesman Problem. Computationally, the QAOA is a polynomial time'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 216 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    algorithm for finding a “good” solution to an optimization problem (meaning finding
    an acceptable answer in a reasonable amount of time (polynomial time)). Graph
    theoretically, QAOA is a form of a Max-Cut solution on regular graphs in which
    the quantum algorithm finds a cut that is as close to the optimal cut as possible.


    Max-Cut (maximum cut) refers to using partition functions to find the best division
    or optimal cut through a set of data (the best way to cut a data plot in half,
    for example). Instead of checking every point, the idea is to use an optimization
    algorithm to efficiently divide the data, finding the maximum cut that is closest
    to the actual optimal cut or partition through the data. Quantum computers could
    likely execute the calculation more quickly than classical computers.


    There are different ways of setting up the Max-Cut problem in quantum computers
    to apply the QAOA. One approach is instantiating the Max-Cut problem as an energy
    optimization. The implementation constructs a physical system (in a quantum annealing
    machine), typically with a set of interacting spin particles, whose lowest energy
    state encodes the solution to the problem, so that solving the problem is equivalent
    to finding the ground state of the system. A QAOA is used to identify the energy
    landscape minimum. Another approach, in graph theory, involves starting with a
    set of unlabeled points and assigning labels based on a similarity metric (such
    as Euclidean distance). Then, the points are mapped onto a planar graph, and treated
    as a Max-Cut problem. A QAOA is applied to solve through an optimization routine.


    # 10.2.2 Standardized quantum computation algorithms


    In addition to standardized tools (the VQE and QAOA), standardized quantum algorithms
    are also necessary for the successful implementation of quantum computation. The
    first step in the DiVincenzo Criteria of allstandards is having a reliable system
    for making qubits (DiVincenzo, 2000). The next four items involve manipulating
    the qubits into executable computations. The four criteria are initializing the
    qubits, using universal quantum gates, computing with the qubits in a coherence
    time that is long enough to be useful, and measuring the result at the end.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Quantum Machine Learning 217


    Although there are many ways of making qubits, once they are produced, there is
    more of a standardized approach for computing with them. Whatever hardware method
    is used to produce the qubits, a quantum chip is typically the result. The quantum
    computing chip can then be used to solve problems with a set of standard quantum
    algorithms. The aim is to have generalized algorithms and programming models that
    can be designed for any quantum chip or architecture. Quantum programmers program
    the quantum algorithms and access quantum computing through an internet-based
    interface, either locally or as a cloud service. Initially, classical algorithms
    were being run on quantum computers to demonstrate quicker problem-solving. More
    recently, there is a shift to developing native quantum algorithms to take advantage
    of the specific properties of quantum systems.


    # 10.2.2.1 Quantum logic gates and circuit diagrams


    In classical computing, information units (bits) are passed through a series of
    gates in a logic circuit to perform a series of computational operations. Likewise,
