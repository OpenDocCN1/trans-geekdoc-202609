  md: '# # Chapter 10


    # # Quantum Machine Learning


    # ## Abstract


    One of the first uses of quantum computing is machine learning. Both techniques
    are aimed at the same kinds of problems in statistical data analysis and optimization.
    In this sense, quantum computing may be an improved method over machine learning.
    Machine learning applications such as optimization and simulation are instantiated
    in quantum computing formats. Standardized tools are emerging such as the variational
    quantum eigensolver (VQE) and the quantum approximate optimization algorithm (QAOA).
    Quantum algorithms are being specified with standard gate logic, including the
    Hadamard gate (which acts on 1 qubit to put it in a superposition state), the
    CNOT gate (which acts on 2 qubits to flip one), and the Toffoli gate (which acts
    on three or more qubits to implement the Boolean operators). Other advances in
    deep learning and information geometry facilitate a wider range of 3D computational
    operations in problem-solving.


    # ## 10.1 Machine Learning, Information Geometry, and Geometric Deep Learning


    # ### 10.1.1 Machine learning as an n-dimensional computation graph


    Machine learning is already quantum-ready (ready for implementation in quantum
    information systems) in several ways. First, machine learning'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# 210 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    operates on computation graphs, which are a 3D format (any graph implies 3D).
    Second, relevant operations in machine learning are migrating to tensor networks,
    the analytic tool of choice for modeling quantum information problems. Third,
    there are new formulations such as information geometry and geometric deep learning
    (deployed in convolutional networks, GCNs). These advances allow a wider range
    of non-Euclidean geometries to be engaged in deep learning problems (geometry
    is a selectable parameter), and information is analyzed in its native form rather
    than being compressed into lower-dimensional representations for processing by
    the deep learning system.


    # 10.1.1.1 Tensor networks for machine learning


    Machine learning methods are based on linear algebra applied in matrix multiplications.
    The matrix multiplications multiply ranges of scalars, vectors, matrices, and
    tensors. A scalar is a single number. A vector is representable by an array of
    multiple numbers arranged in order, with each number identified by its index in
    that ordering. A matrix is representable as a 2D array of numbers, with each element
    identified by two indices. A tensor is representable by an array of numbers arranged
    on a regular grid with a variable number of axes identified by indices. Efficient
    hardware for processing matrix multiplications extends from CPUs to GPUs and tensor-processing
    units (TPUs). TPUs, are operated in clusters with TensorFlow software (an open
    source machine learning library). The specialized hardware and software allow
    the machine learning algorithms to flow through the vast series of matrix multiplications
    without having to store intermediate values in memory.


    Tensor networks refer to a specific technophysics method that is starting to be
    implemented to a greater degree in machine learning, particularly in the contemplation
    of quantum computing (Huggins et al., 2019). A tensor network is a collection
    of tensors with indices connected to a network pattern (as in the usual method
    of tensor-based machine learning), but in particular, it is used to efficiently
    represent quantum mechanical problems such as a many-body wave-function in an
    exponentially large Hilbert space (functionality that has not always been needed
    for machine learning problems).'
  merge: -1
  img_proc: true
