    # 9.3.1 Logistic regression: s-curve functions


    The first step in operating deep networks is defining the problem in terms of
    a logistic regression. Regression is a standard data analysis technique used to
    find an equation or function that describes a set of data. A function is a higher-order
    representation of the same information. For example, different levels of representation
    of the same data can be specified as the plotted data, a linear regression, and
    a logistic regression. Each subsequent level represents the data more abstractly.
    Linear regression is useful for predicting a continuous set of values such as
    house price per house size. However, as the term suggests, linear regression is
    limited to situations in which there is a linear relationship between the dependent
    and independent variables (in the house example, usually the larger, the higher
    price).


    Logistic regression on the other hand, allows the same kind of discrete outcome
    to be predicted, but from a larger set of complex input variables. Input data
    may have different forms and relationships (e.g. continuous, discrete, dichotomous,
    or mixed). Logistic regression can be used to predict a binomial value (Yes/No,
    1/0), or a probabilistic value (between 0 and 1, 0–100%) for a dependent variable,
    based on one or more independent variables. For example, the problem might be
    to predict a company’s customer based on multiple independent variables such as
    income, education, mortgage, and work experience. Using logistic regression, these
    variables can be mapped into one higher-order equation in which the outcome is
    interpreted as the probability of any particular individual becoming a customer.


    The logistic regression is represented as an s-shaped curve that compresses an
    entire range of values into an easily readable nonlinear probability function.
    The function accommodates different output values, all in the same structure,
