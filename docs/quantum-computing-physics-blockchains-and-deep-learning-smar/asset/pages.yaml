    # 10.2.3 Quantum optimization


    Optimization means the best or most effective way to carry out a task, and is
    the first application in which quantum computing may offer an advantage over classical
    computing. In computing networks and decision science, a canonical optimization
    challenge is the Traveling Salesman Problem. The problem is that given a list
    of cities and the distances between each pair of cities, the shortest possible
    route to visit each city and return to the original city. In terms of computational
    complexity, the Traveling Salesman Problem is an NP-hard problem.


    In both classical and quantum systems, optimization is modeled in many different
    ways. One technique is framing optimization as a minimization problem. This could
    be in the algorithmic domain as an error minimization problem (for example, deep
    learning neural networks are measured by error rate), or in the physical domain
    as a minimal energy landscape problem (for example, annealing and spin glass models
    find the most stable energy configurations). Quantum annealing is one of the most'
