- pgno: 261
  md: '# Model Field Theories: Neural Statistics and Spin Glass


    With the path integral, a master evolution equation is written for the system.
    A single random walk is generalized to random walks in a continuum, to frame the
    problem as a Markov random field. A neural dynamics for the system is obtained
    by quantizing the neuron into three states: quiescent, active, and refractory
    (QAR). A simpler two-state model (quiescent and active, QA) could also be used.
    Simplifications are applied such as Wick''s theorem, Gell-Mann’s 3 × 3 matrices,
    and eigenfunction ladder operators. An Algebraic version of the master evolution
    equation is specified, which describes the QAR state transition diagrams of the
    neural network.


    To articulate action occurs within the dynamical system, a neural state vector
    (a probability state vector) is derived. This is possible because the algebraic
    equation is a number density operator that can be used to count the number of
    neurons in the different QAR states, and the total excitation coming onto the
    network (with a Hamiltonian) as a network quantity. Euclidean field theory (a
    modern form of statistical mechanics) is applied to derive a Wiener–Feynman path
    integral (one that mathematically defined using imaginary time (unlike the original
    Feynman path integral, which is not easily computable)). This allows a simplification,
    to write the system with only the spike Hamiltonian instead of the full Hamiltonian
    (the Hamiltonian indicating the spiking threshold of the system).


    Having described the dynamical system and how action occurs within it, next is
    defining a mathematical model of system evolution, for which coherent states are
    used. Coherent states are functions that do not change their state under the action
    of the evolution of the Schrödinger wave equation. A theory of spiking action
    on a neural network is obtained using coherent states, applying the U(1) symmetry
    (rather than that of the complicated Lie algebra topology group SU(3)). A theory
    of spiking action explains system evolution.


    However, the theory thus described is a linearized spiking model, so to specify
    a nonlinear spiking model, perturbation techniques (the renormalization group)
    are used to define a renormalized (rescaled) action. The issue is that there are
    multiple time and space scales in nonlinear systems, so a renormalized action
    that takes into account new critical points at longer time and length scales is
    necessary.'
