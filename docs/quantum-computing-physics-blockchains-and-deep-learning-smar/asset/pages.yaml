  md: '# 13.3 The AdS/CFT Correspondence is Information-Theoretic


    A key advance of Harlow Harlow & Hayden (2013) is seeing the AdS/CFT correspondence
    as an information-theoretic problem. Black holes can be conceived as a quantum
    mechanical domain with entangled qubits that can be error-corrected. The problem
    is as follows. Over time, black holes evaporate, by radiating qubits of information
    that comprise them out into the universe. This is called Hawking radiation. The
    claim is that information is not lost, in a black hole, although it may be difficult
    to access. An analogy is made to a book that was burned in a fire. The information
    is still there, but it is very difficult to access. At any moment in time, all
    of the qubits related to a particular black hole will be in one of three locations,
    in the black hole interior, on the event horizon, or in the exterior of the black
    hole.


    A question arises as how quickly information can be obtained from a qubit that
    is entering or exiting a black hole. One way would be to have a giant tracking
    system that catalogs all of the qubits related to the black hole. Qubits have
    the property of being monogously entangled with other qubits. Therefore, such
    a tracking system could assess whether an outgoing qubit is part of a pair whose
    first qubit has already radiated out of the black hole (comprising a 1 of 2 pair).
    Whereas it is part of an as-yet unknown pair (comprising a l of 2 pair). Whereas
    AMPS thought experiment (Almheiri et al., 2013) suggests that these kinds of calculations
    would be possible, Harlow & Hayden (2013) apply an information-theoretic approach
    and conclude that the black hole would evaporate before such calculations would
    be possible, even with a quantum computer. More formally, the situation comprises
    the well-defined computational problem of a polynomial-sized quantum circuit acting
    on three systems (black hole interior, horizon, and exterior) to determine if
    maximal entanglement can be decoded, and it can not (Harlow & Hayden, 2013, p.
    7).


