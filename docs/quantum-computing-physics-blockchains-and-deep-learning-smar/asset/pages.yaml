- pgno: 23
  md: '# Chapter 1


    # Introduction


    Quantum computing ... has established an unprecedented deep link between the foundations
    of computer science and the foundations of physics


    > — John Preskill (2000, p. 127)


    The implication is that reality can be computed. The startling premise of quantum
    computing is that the bizarre quantum mechanical realm that was thought incomprehensible,
    but at least it can be computed. Quantum mechanics might remain incomprehensible,
    but the bigger notion is that the link between quantum computing and quantum physics
    suggests the possibility of delivering on the promise of understanding the true
    nature of physical reality.


    Merely the first step is simulating the quantum mechanical world with quantum
    computers in its image as Feynman envisioned. Beyond that milestone, the real
    endpoint is mobilizing the quantum mechanical domain to compute more difficult
    problems and create new possibilities.


    Engaging the quantum realm makes clear that tools are needed to comprehend the
    two domains together, the microscale of the quantum and the macroscale of lived
    reality. The issue concerns not only understanding about quantum mechanics, but
    also linking the quantum and non-quantum domains such that the quantum realm can
    be activated in a useful way at the macroscale. This book is a journey towards
    a model to do'
  merge: -1
  img_proc: true
