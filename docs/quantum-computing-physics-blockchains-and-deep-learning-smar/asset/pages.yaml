    matter physics, and hence on these specific problems instead of a larger overall
    attempt at unification. The term gauge/gravity duality is indicative of the shift
    in viewpoint that gauge theories refer to the behavior of subatomic particles,
    for whom gravity (geometric aspects) is relevant, in condensed matter for example.
