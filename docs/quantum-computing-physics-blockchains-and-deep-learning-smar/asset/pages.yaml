    of receipt of the item, the escrow contract transmits the payment to the seller.
    A third-party-oracle such as FedEx or UPS online shipment tracking can be used
    to confirm the item delivery.


    Verifiable markets envision a more robust version of market activity between remote
    participants by using cryptographic proofs to confirm each step of the transaction.
    The buyer deposits the money with a decentralized third party (which could still
    be a smart contract), that generates a cryptographic proof (with SNARKs or other
    proof protocols) that the funds have been deposited. Likewise, a cryptographic
    proof is generated when the goods have been shipped and delivered.


