    can process data natively may improve results.


    One means of implementing geometric deep learning is through GCNs. In one example,
    semi-supervised learning is conducted on graph-based data using a version of convolutional
    neural networks that operate directly on graphs (Kipf & Welche, 2017). The method
    is congruent with the data. The model scales linearly in the number of graph edges
    and learns hidden layer representations that encode both graph structure and the
    features of the nodes. The results outperform traditional methods.


    Another way that geometric deep learning is employed in trying to understand why
    deep learning has been so successful at certain machine learning tasks such as
    image recognition. Deep learning is a proven method, but it is also a black box,
    in that specifically how it works is not understood. In geometric deep learning
    purports that the success may be due to a manifold structure existing in the underlying
    data (Lei et al., 2018). The claim is that in its native representation, high-dimensional
    data may be naturally concentrated close to a low-dimensional manifold. A geometric
    deep learning algorithm can be used to learn the shape of the manifold and the
    probability distributions on it. The point is that improved computational methods
    that are more in line with the natural attributes of phenomena may be better at
    detecting the patterns and structure present in the phenomena. Other proposals
    might be similarly tested with a geometric view, such as the idea that the success
    of deep learning is due to a pruning mechanism in the deep learning network that
    forces information through a bottleneck (Schwartz-Ziv & Tishby, 2017).


