    Overall, there are many methods for generating qubits and computing with them
    (Table 3.3). In addition to the four main approaches (superconducting circuits,
    ion traps, Majorana fermions, and photonics), four additional approaches are discussed
    briefly. These include neutral atoms, diamond defects (nitrogen-vacancy defect
    centers), quantum dots, and nuclear magnetic resonance (NMR).


