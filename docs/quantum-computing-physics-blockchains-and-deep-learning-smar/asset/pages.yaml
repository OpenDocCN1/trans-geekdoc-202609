    # 11.3.3.5 Neural action: Nonlinear renormalized action


    It is possible to use a linearized spiking model to describe the linear model.
    However, in more realistic neural models, the firing rate function is nonlinear
    across the field, so it is necessary to conduct a power series (Taylor) expansion
    of the firing norm or probability function. In this case, the action is no longer
    quadratic, so the perturbation methods of quantum field theory must be used for
    the calculation. The primary perturbation method used is the renormalization group
    (Chen et al., 1996; Efrati et al., 2013). The renormalization group is a mathematical
    apparatus that allows for the systematic investigation of changes in a system
    viewed at different scales.


    Renormalization group techniques are applied to the action. The issue is that
    in a nonlinear system, there are multiple time and space scales. Thus, it is necessary
    to use a standard singular perturbation analysis to arrive at a renormalized action
    that takes into account new critical points at longer time scales and longer length
    scales. The action changes, and a renormalized action is obtained as the result.
    This introduces a diffusion term since longer time scales, reactions resemble
    reaction–diffusion networks. This is the action that is required to obtain finite
    results from a nonlinear system. As time goes to infinity, the propagator approximates
