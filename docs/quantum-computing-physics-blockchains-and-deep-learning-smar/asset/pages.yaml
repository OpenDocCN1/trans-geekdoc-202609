    system will have a macroscopic term capturing the aggregate activity (e.g. temperature,
    pressure, etc.). A temperature occurs naturally in any system in which there is
    a conserved quantity, which could include energy or system state, and therefore
    applies to smart networks.


    In the SNFT, temperature is used literally, in the operational sense as a physical
    quantity that expresses hot and cold. Temperature is a proportional measure of
    the average kinetic energy of the random motions of the constituent particles
    of matter (such as atoms and molecules) in a system. Smart network systems are
    physical, and thus temperature as heat makes sense to infrastructure operators
    and any party focused on the physicality of the system, such as for design and
    risk management purposes. In smart networks, one form of the temperature term
    is quantitative measure of the overall system, such as blockchain hash rate and
    deep learning error rate.


    In the SNFT, temperature is also used conceptually, as the temperature term is
    based on theoretical arguments from thermodynamics, kinetic theory, and quantum
    mechanics. A temperature or pressure term links the levels in a system between
    a microscopic and a macroscopic domain. Temperature is the consolidated measure
    that describes the movement of all of the particles in a room. Likewise, in a
    field theory, a temperature term is a consolidated measure that comprises all
    of the activity of a microscopic level at one or more tiers down in the system.
    The temperature term might be employed as a control lever for the system.


    The third use of a temperature term in a statistical mechanical system is as a
