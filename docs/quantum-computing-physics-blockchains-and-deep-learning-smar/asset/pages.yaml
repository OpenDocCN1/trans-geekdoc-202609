  md: '# Smart Networks: Classical and Quantum Field Theory


    The method is finding or defining an effective field theory at a scale that renders
    the system analytically solvable.


    For example, the elliptical orbits of the planets are more easily calculated with
    Newtonian gravity than general relativity. This simplification can be all that
    is necessary for certain applications. The benefit of a field theory is that it
    provides the ability to focus on a particular scale of a system, emphasizing one
    while limiting others (Georgi, 1993). The objective is to find the simplest framework
    that captures the essential physics of the target area. For example, when there
    is interest in lighter particles (such as bottom quarks), heavier particles (e.g.
    z-bosons and w-bosons) can be eliminated from the model.


    In complex multi-level systems, identifying a macroscopic term responding to microscopic
    behavior is a key challenge. The analogs to the temperature and pressure terms
    arising from a row of septillions of moving particles in a model system are not
    always clear. Hence, an effective field theory is a formal process that can be
    used to identify a system’s “temperature” term and other system-level metrics.
    Effective field theories are similar to the renormalization concept (in the sense
    of mathematically scaling to a different level of the system to focus on a parameter
    of interest in a simplified manner that can be calculated.


    # 2.7 Five Steps to Defining an Effective Field Theory


    Effective field theories are important because there is interesting physics at
    all scales. Being able to travel up and down scale dimensions can make it easier
    to analyze certain aspects of systems. The idea is to use effective field theories
    as a tool for isolating parameters of interest within a system and engaging the
    system at that level. Effective field theories may work best when there is a large
    separation between the length scale of interest and the length scale of the underlying
    dynamics.


    A distillation of the steps involved in deriving an effective field theory is
    outlined in Table 2.5. The aim of an effective field theory is to specify the
    simplest framework that captures the essential physics of interest. The zeroth
    step is to confirm that there are no already existing fundamental theories to
    describe the phenomenon and that an an effective'
