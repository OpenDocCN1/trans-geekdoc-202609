    # 10.2.4 Quantum simulation


    Optimization is one class of problems that may have improved problem-solving possibilities
    in quantum computing, and simulation is another. A concept in simulation is digital
    twin technology. The idea is that in an advanced computational society, all systems
    of sufficient complexity are simulated (have a digital twin). This already includes
    national defense systems, satellite networks, transportation systems, global financial
    markets, supply chains, food webs, aircraft design, and building HVAC and security
    systems. In the future given, with greater computational capacity, there could
    be a digital twin for each individual person for data collection related to logging
    and health management. In some ways, simulation is a more complicated version
    of optimization, with additional factors and scenarios, including the evolution
    of dynamics over time. The main objective is to use quantum computers to simulate
    chemical, physical, and biological systems to understand and replicate how they
    operate, and to generate new materials, processes, and pharmaceutical substances
    as a result. Any kind of complex quantum simulation will likely require millions
    of qubits and error correction.


    # 10.2.4.1 Nitrogen fixation


    Nitrogen fixation is a high-profile problem that is targeted for potential resolution
    with quantum computing. Nitrogen fixation refers to understanding the natural
    process of biological nitrogen fixation in nitrogenase, which is fixing or assimilating
    nitrogen into organic compounds. This could be important since manmade nitrogen
    fertilizer production consumes 1–2% of global energy and generates about 3% of
    total global CO2 emissions (Bourzac, 2017). The artificial nitrogen fixation process
    uses metal catalysts and the Haber–Bosch process to produce ammonia fertilizer
    from atmospheric nitrogen at high temperatures and pressures. On the other hand,
    nature uses the nitrogenase enzyme to (easily) fix atmospheric nitrogen into ammonia.
    Quantum computers might be employed for molecular simulation to understand the
    details of the nitrogenase mechanism to help design less energy-intensive industrial
    processes for synthesizing nitrogen fertilizers. Simulating the basics of nitrogen
    fixation may'
