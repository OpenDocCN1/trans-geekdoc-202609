    information, but the recipient does not need to specify an exact amount for the
    payment. This makes the channel operations more flexible.


    Another smart routing advance is rendezvous-vous routing, a security improvement
    in which the two parties build the route together (Valloppillil & Ross, 1998).
    Instead of the sender transmitting all the way to the recipient (and thus knowing
    information about the recipient), a rendezvous-vous point is specified at an intermediary
    node in the network. Using onion routing, the recipient provides the sender with
    two-step delivery instructions, that the sender cannot open. The sender delivers
    the sealed message from the recipient to the specified intermediary node (a public
    node willing to act as an intermediary). The intermediary node has the key to
    open this message and route it the rest of the way to the recipient.


    # 5.3.4 A new layer in the Lightning Network: Channel factories


    Channel factories provide a further innovation to the flexibility of payment channels
    (Burchert et al., 2018). The so-called channel factories refer to a new layer
    (a factory to generate new channels) that sits between the underlying blockchain
    layer and the payment channel layer. The aim of the channel factory layer is to
    enable trustless off-chain channel funding (since opening and closing channels
    is an on-chain event, which means transaction fees and non-immediate processing).


    The channel factory concept involves having a multi-party channel in which new
    channels are created through off-chain contracts. This contrasts with payment
    channels, in which payments between members are created through off-chain contracts.
    The channel factory system allows rapid changes to the allocation of funds to
    channels and reduces the cost of opening new channels. Instead of one blockchain
    transaction per channel, each user only needs one transaction to enter a group
    of nodes, and then within the group, the user can create arbitrarily many channels.
    For a group of 20 users with 100 intra-group channels, the cost of the blockchain
    transactions might be reduced by 90% as compared with 100 regular micropayment
    channels opened on the Bitcoin blockchain (Burch et al., 2018).'
