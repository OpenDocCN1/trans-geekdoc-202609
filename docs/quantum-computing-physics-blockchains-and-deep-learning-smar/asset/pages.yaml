  md: '# 372 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    **Smart network field theory:** A smart network field theory (classical or quantum)
    is a field theory for the orchestration of particle-many systems from a characterization,
    control, criticality, and novelty emergence perspective.


    **Spin glass:** A spin glass is a disordered magnet that is a metastable system
    in which half of its molecular bonds are spin-up, and half spin-down, which can
    be used as a computation system.


    **Technophysics:** Technophysics is the application of physics principles to the
    study of technology.


    **Temperature term:** A temperature term is an aggregate informational state of
    a system that might be employed as a control lever.


    **Time complexity:** Time complexity is the computational complexity related to
    the time required to calculate a certain problem. (By analogy, geometric complexity
    denotes diverse geometric computational classes based on the underlying geometry
    used in the problem.)


    **Web 3.0:** Web 3.0 is a functionality, collaboration, and trust upgrade for
    the internet''s operating infrastructure (Web 1.0 was the read web, Web 2.0 the
    read/write web, and Web 3.0 the read/write/trust web), including new standards
    such as hash-linked data structures to call data uniformly.


    **Zero-knowledge proof:** A zero-knowledge proof is a proof that reveals no information
    except the correctness of the statement. Data verification is separated from the
    data itself, conveying zero knowledge about the underlying data, thereby keeping
    it private.'
