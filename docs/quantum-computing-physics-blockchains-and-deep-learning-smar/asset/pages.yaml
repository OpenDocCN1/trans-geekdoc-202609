    # 5.3.2 Basic routing on the Lightning Network


    The Lightning Network operates (transparently to the end user) by setting up a
    temporary line of trust between the sender and the recipient with promises that
    flow forward and receipts that flow backward across the network of Lightning nodes.
    The payment is transferred in the forward direction through a series of promises
    between the sender, intermediary nodes, and the recipient. A chain of receipts
    is transferred backwards towards confirm the payment and pay any network fees
    associated with the transaction.


    Technically, the sender (the sender''s Lightning wallet) sets up a series of promises,
    one to each intermediary node in the route and to the final node (the recipient),
    flowing through a number of intermediary nodes to the recipient. When the recipient
    receives the final promise, the recipient applies the hash to redeem the payment
    (the hash is the hash of a cryptographic secret included in the initial invoice
    from the recipient to the sender). The recipient''s redemption of the payment
    triggers a receipt (which also has a copy of the hash) to flow back hop to the
    last intermediary node, who applies the hash to redeem their micropayment. This
    in turn triggers a receipt released to the last-previous intermediary node to
    redeem their micropayment, and so forth through the network to the sender. There
    could be any number of user-selected intermediary nodes, there are typically three
    nodes involved in standard onion routing.'
