  md: '# 6.4.1 Quantum key distribution


    Although quantum cryptography includes many applications, the first and foremost
    is QKD. QKD appears to be one of the most likely quantum technologies to be adopted
    in the short-term, on top of otherwise existing internet infrastructure. The global
    communications network uses key distribution as a secure method of encryption
    to protect everything from credit card transactions to passwords and SMS texts.
    The further implied use of key distribution is to make every use case of user
    identity and credential verification more secure. At present, personal information
    must be revealed for various purposes such as to validate a bank account, health
    record, or other accounts. With QKD as a built-in feature of the communications
    infrastructure, possibly used in conjunction with proof technology, validation
    could occur without having to disgorge personal information. The aim is to make
    the internet more private and secure.


    QKD is trying to solve the problem where classical methods for key distribution
    are insecure. At present, keys are sent as classical bits in a stream of electrical
    or optical pulses representing 1s and 0s that can be read and copied. It is physically
    difficult to detect the presence of an intruder when communicating through a classical
    communication channel. Also, classical methods of key distribution may be broken
    if enough computing power is available. QKD ensures that an eavesdropper can succeed
    only with a low probability, and also that no amount of computing power will allow
    a QKD protocol to be broken. Any attempt to intercept the quantum key would collapse
    the quantum state, destroying the information and signaling the presence of an
    intruder. This means that quantum distributed keys are far more secure than keys
    sent as classical bits. QKD uses quantum methods in both steps of the process,
    key generation and distribution.


    Classical keys are physically instantiated as classical bits that are 1s and 0s
    that can be copied. Quantum keys are physically instantiated as quantum bits (qubits)
    that are quantum states of photons or atoms that cannot be copied (per the no-cloning
    theorem of quantum information), and cannot be measured (because it will damage
    the qubits). Thus, quantum keys are secure because any tampering would be immediately
    known. If this were to happen, the users would just restart the'
