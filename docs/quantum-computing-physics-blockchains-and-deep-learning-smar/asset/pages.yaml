  md: '# 7.6.1 Bulletproofs: Confidential transactions for UTXO chains


    The basic structure of a bulletproof is that a party opens a commitment, and then
    proves that the commitment has some value (a positive value within a small range).


    In the general use case of bulletproofs for creating confidential transactions,
    two cryptographic blocks are employed, and zero-knowledge proofs. Instead of the
    transaction amount being broadcast publicly as Bitcoin and Ethereum transactions,
    the balance is replaced by a commitment. Bulletproofs use Pedersen commitments.
    The commitment has two properties: it shields the amount, and it is binding (once
    there is a commitment to a value, it cannot be opened to another value later).
    It can be seen publicly that a commitment has been made, but only the sending
    party knows the amount, which has been committed. The receiver does not know (for
    sure) the transaction amount until the commitment is opened.


    The challenge with confidential transaction is how the blockchain system can check
    to validate the transaction and prevent double-spending given that the amount
    is hidden. Zero-knowledge proofs can be used to check various conditions such
    as the transaction inputs are equal to the outputs plus the fees. In particular,
    the range proof functionality of zero-knowledge proofs is engaged to prove that
    a commitment is in a small range.


