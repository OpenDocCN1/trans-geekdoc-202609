  md: '# Quantum Machine Learning 211


    # 10.1.1.2 Dimensionality reduction


    A problem in machine learning and beyond is widely dimensionality reduction. The
    concept of dimensionality is widely used in data science and machine learning
    to refer to the overall size and complexity of a dataset, but dimensionality also
    has a special technical definition. In the analytically precise definition, the
    number of dimensions correlates with the number of features (attributes) per datapoint
    in a dataset. The term high dimensionality is a specialized situation that arises
    in data analysis in which p > n; there are n samples and p features (Buhlmann
    & van Geer, 2011). The dataset has more features than samples.


    This could be true for datasets of any size. For example, a dataset with 3 data
    points and 5 features constitutes high-dimensional data, whereas another dataset
    with 500,000 features and 1 million samples is lowdimensional data, based on the
    technical definition. A canonical example of high-dimensional data occurs in genomic
    analysis, for example, having a dataset of n = 1500 people and p = 1 million SNP
    (polymorphism) locations in the genome. Healthcare data are known for having large
    numbers of variables (e.g. height, weight, blood pressure, cholesterol level),
    but unless p > n, it is not high-dimensional data. Datasets with high numbers
    of variables may still be difficult to process, but they are not as computationally
    difficult to treat statistically as high-dimensional data. High-dimensional data
    are difficult to treat statistically because there cannot be a deterministic answer
    when p > n unless additional assumptions are introduced to the model.


    A key complexity technology (ComplexityTech: A tool for managing complexity) is
    dimensionality reduction. Dimensionality reduction is a challenge in processing
    datasets, whether they are large and complicated or specifically high-dimensional.
    The idea of dimensionality reduction refers to any variety of techniques that
    are used to simplify the structure of complex datasets while maintaining data
    integrity. Initially, only linear models such as principal component analysis
    and classical metric multidimensional scaling were available. However, since the
    1990s, nonlinear dimensionality reduction methods have been a substantial advantage
    (Lee & Verleysen, 2007). Nonlinear approaches may be applied to both problem representation
    and analysis.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '212 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    One nonlinear dimensionality reduction method is manifold learning, in which data
    are configured on a curved manifold so that they can be visualized in a lower-dimensional
    space. Such visualization techniques use graphs to represent the manifold topology
    of data problems, introduces new computational metrics such as geodesic distance.
    Other methods are being used for improved optimization in the context of dimensionality
    reduction, for example, algorithms based on kernel techniques and spectral decomposition.
    This has led to a new method, spectral embedding, which may outperform previous
    tools. Even with the new nonlinear dimensionality reduction techniques, though,
    certain problems in machine learning are not yet resolved as the so-called “curse
    of dimensionality”. The curse of dimensionality refers to the situation in which
    the performance of machine learning algorithms spikes at first, but then levels
    off after a certain number of features are added. The reason is not understood,
    but might be explored in more sophisticated quantum machine learning models.


    # 10.1.2 Information geometry: Geometry as a selectable parameter


    > One geometry cannot be more true than another; it can only be convenient


    Henri Poincaré (1905, p. 59)


    Just as there are different kinds of space in mathematics and physics, there are
    different kinds of geometry. As mathematician Poincaré indicates (when talking
    about non-Euclidean geometries), there is no true geometry, only different geometries
    that may be more or less convenient for the problem at hand. The main kinds of
    geometries are Euclidean geometry (familiar everyday geometry) and non-Euclidean
    geometry as spherical and hyperbolic geometry. Spherical geometry is geometry
    on the edge of a sphere, and hyperbolic geometry is the geometry on saddle surfaces.
    Riemannian geometry (also called elliptical geometry), is another form of non-Euclidean
    geometry, based on differential calculus that is relevant for calculating spacetime
    curvature.'
