  md: '# 7.3.1 Interactive proofs: Graph isomorphism example


    Zero-knowledge proofs are a known technique outside of the blockchain context.
    A zero-knowledge proof is a proof in which the verifier does not learn anything
    about the statement in question except that it is true. A canonical example of
    zero-knowledge proofs is the graph isomorphism problem. Two graphs are isomorphic
    if the vertices can be relabeled in one of the graphs to obtain the other. (For
    example, vertex A is connected to vertex B in one of the graphs, then vertex A
    is likewise connected to vertex B in the other graph.) More formally, the graph
    isomorphism problem is the situation of determining whether it is possible to
    permute the vertices of one graph that it is identical to another graph.


    Considering two graphs, each with 10 vertices, it is not clear just by looking
    at them they are isomorphic. However, if the vertices can be labeled 1–10 on the
    first graph, and 1–10 on the second graph, it can be checked computationally whether
    the two graphs are isomorphic. Notably, solving graph isomorphism problems with
    classical computers is difficult, quantum computers are to be able to solve such
    problems. The method is creating the graph G, and calculating the superposition
    over all certain vertex labelings of G to test for isomorphism. One hotspot is
    that a certain method of cryptography, graph-based cryptography, is not quantum-resistant.


    The graph isomorphism problem introduces the concept of one-way functions. On
    the one hand, it is easy to check that the two graphs are isomorphic (if this
    claim is made), but on the other hand, it is hard to derive the actual isomorphism
    (the labeling). In a one-way function, similarly, it is easy to verify the claim
    that is being made, but difficult to calculate the inputs that constitute the
    claim.


    The issue that interactive proofs tries to solve is as follows. Considering two
    graphs, if the graphs are isomorphic, it is easy to prove. The prover makes a
    claim that two graphs are isomorphic, and gives the labeling to the verifier.
    The verifier can easily check whether this is an accurate isomorphic mapping between
    the two graphs, and if it is, then indeed, the graphs are isomorphic. However,
    if the graphs are non-isomorphic, this is hard to prove. The problem is how the
    prover can demonstrate the claim to the verifier that the graphs are non-isomorphic.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Zero-Knowledge Proof Technology


    Such claims can be demonstrated with an interactive zero-knowledge proof. The
    verifier picks one of the two graphs at random, creates a small change or permutation
    to the graph (as a slight reordering of the data points), and asks the prover
    to identify which graph it is (A or B). If the claim is correct, the prover should
    be able to consistently answer the question correctly. If the claim is incorrect,
    the prover should only be able to answer the question correctly 50% of the time
    (a 50/50 chance of being correct). Therefore, after a few rounds, it should be
    easy for the verifier to confirm whether or not the prover is making a truthful
    claim.


    The key point about the zero-knowledge proof is that the verifier becomes convinced
    that the graphs are non-isomorphic without learning anything about the underlying
    data in the graphs (i.e. keeping the underlying data of the vertex labeling private).
    This is the core idea in zero-knowledge proof technology that the prover can prove
    that they have access to their own private key, without sharing key, by generating
    messages with the key that the verifier can confirm.


    In terms of computational complexity, assuming (non-trivially) that one-way functions
    exist, it can be shown that zero-knowledge proofs exist for every NP-complete
    problem (Goldreich et al., 1991). The implication is that as a computational complexity
    class, all NP-complete problems are reducible to each other, in the sense that
    it is possible to give a zero-knowledge proof for any one NP-complete problem.
    This suggests the treatment of computational complexity by class.


    # 7.3.1.1 ZKP example: Colorblind and red and green balls


    In this example of zero-knowledge proofs, the problem is how a person who is not
    colorblind can prove this fact to a person who is colorblind. The zero-knowledge
    proof solution is as follows. The colorblind person holds two balls, red and green.
    The colorblind person puts their hands behind their back, decides whether to switch
    the balls or not, and then reveals the balls in their hands. The non-colorblind
    person can immediately tell if the balls have been switched and say “switched”
    or “not switched” (in the form of a 1-bit answer). To make sure this was not a
    lucky guess, the rounds continue until there is probabilistic certainty that the
    non-colorblind person’s claim is true, and indeed she is not colorblind,'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 142 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    and not just randomly guessing whether the balls have changed hands. The fact
    of non-colorblindness can be proved without sharing underlying data about the
    functioning of the visual receptors, the “private information” in this case.


    There are two levels of information in the system, the underlying information
    about the color of the balls, red and green, and the meta information of whether
    there has been a switch in any round. The colorblind person can distinguish and
    report publicly whether there has been a switch without revealing the underlying
    information itself (red and green). Zero-knowledge proofs operate on this principle
    of two-tier information systems comprising the underlying information itself and
    statements that can be made about the information without disclosing the information.


    # 7.3.1.2 ZKP example: Grocery store private transactions


    A basic use of zero-knowledge proofs in blockchains is the grocery store example.
    Zero-knowledge proof technology could be used to enable private purchases in the
    sense of not having to disclose an actual card number when making a purchase.
    Someone could go to the supermarket and purchase goods with a credit card without
    revealing the card information to the merchant. A smart credit card using zero-knowledge
    proof technology could identify the cardholder to the merchant without giving
    the merchant the private information (the credit number). The cardholder’s private
    information is protected, and the merchant is also protected, in the zero-knowledge
    proof that this is a valid credit card with the available limits, and not a forged
    card.


