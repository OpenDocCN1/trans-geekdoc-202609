    #  9.1.1 Why is deep learning called “deep”?


    Deep learning is called deep in the sense of there being “hidden” layers in the
    network architecture. The deep learning system is constructed like a sandwich,
    with an input and output layer at each end, and processing layers between them
    whose operation is hidden to the user. The system uses the hidden layers of computational
    processing to map functions between the input data and output guesses. Whereas
    shallow networks have only one or two layers of processing, deep networks have
    three and possibly many more layers.


    A basic demonstration case for contemporary deep learning networks is 5–8 layers.
    On the larger size, GoogleNet’s 22-layer network for image classification and
    object recognition is one of the largest existing networks. In research, the theoretical
    possibilities are higher, suggesting that with stochastic depth (randomly determined
    layers), networks might be increased in the order of 1200 layers and still yield
    meaningful results with error-decreasing improvements (Huang et al., 2016). Optimal
    network structure is a complex problem in which depth (number of layers) is only
    one factor.


    #  9.1.2 Why is deep learning called “learning”?


    Deep learning is called learning in the sense that the system “learns” by creating
    a mapping function from input to output to identify salient features in a dataset
    for the purpose of accurately identifying new examples. Deep learning networks
    are mechanistic systems that learn by cycling through trial-and-error guesses
    with feedback to establish higher levels of abstraction and probabilistic solutions.
    A deep learning system is “dumb” in the sense that it is a mechanical system like
    Searle’s Chinese Room (simply executing tasks without actually “understanding”
    what it is doing). As any computer, the deep learning system simply executes algorithmically
    specified instructions. In this sense, deep learning is a programmed optimization
    method for discovering the best set of'
