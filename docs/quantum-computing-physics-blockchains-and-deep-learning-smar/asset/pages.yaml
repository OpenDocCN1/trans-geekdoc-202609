    # 10.2.5.3 Supervised quantum machine learning


    A comprehensive system for developing QNNs that can represent labeled data and
    be trained through supervised learning is proposed (Farhi & Nevin, 2018). The
    model is developed using the standard dataset of labeled images of handwritten
    digits (the MNIST database of images of 0s and 1s). For training, the classical
    data are converted to a quantum format consisting of n-bit strings with binary
    labels. The quantum input state is an $n$-bit computational basis state corresponding
    to a sample string. The input data can be represented as quantum superpositions
    of computational basis states corresponding to the different label values. The
    quantum circuit consists of a sequence of parameter-dependent unitary transformations
    which act on the quantum input state. The measured output is the QNN''s predictor
    of the binary label of the input state. For binary classification, a single Pauli
    operator is measured on a designated readout qubit. The work uses the classical
    simulation of small quantum systems to confirm the results and fine tune the model.
    Through classical simulation, it is demonstrated that the system finds parameters
    that allow the QNN to correctly distinguish between the images of 0s and 1s. The
    QNN model could be run on a near-term gate model quantum computer to test a wider
