  md: '# 14.1.3.4 Causal and entanglement wedge reconstructions


    Pastawski et al. recapitulate the Rindler causal wedge reconstruction, and make
    additional progress toward the entanglement wedge reconstruction in the AdS/CFT
    correspondence discussed by Almheiri et al. (2015). The different wedge reconstructions
    are important because they indicate the range over which error correction can
    be conducted through the subregion–subregion correspondence in the overall bulk/boundary
    relationship. The causal wedge reconstruction of bulk logical operators is implemented
    in the tensor network model. A Pauli operator (which means quantum spins) is injected
    into an arbitrary open tensor leg in the bulk. The operator is defined such that
    it can be pushed into three additional legs of the tensor, which are in turn injected
    into tensors. By repeatedly pushing operators to the boundary of the network,
    eventually there can be some representation of the operator in the boundary region.
    The bulk operator is contained inside the causal wedge of this boundary region,
    thereby demonstrating the causal wedge reconstruction. Different operators can
    be pushed into the boundary by choosing different tensor legs, which leads to
    different representations of a logical operator.


    The more expansive wedge reconstruction is difficult to calculate due to aspects
    of the Ryu–Takayanagi formula (2006), in which boundary entanglement entropy is
    related to the area of a corresponding minimal surface in the bulk (in particular,
    it is difficult to determine the entropy of the boundary state). However, different
    kinds of entanglement wedges might be tested such the greedy entanglement wedge
    and the geometric entanglement wedge (Pastawski et al., 2015, 33). Subsequent
    work has established a workable entanglement wedge reconstruction in the AdS/CFT
    correspondence (Dong et al., 2016). The benefit of the entanglement wedge approach
    is that it offers a greater range over which the AdS/CFT correspondence can be
    formally defined, as compared with the smaller range of the causal wedge approach.


