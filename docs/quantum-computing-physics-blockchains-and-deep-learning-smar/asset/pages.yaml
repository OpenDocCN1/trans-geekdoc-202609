    # 14.1.1 Quantum error correction


    Quantum error correction is a procedure used such that quantum information bits
    do not get lost or damaged. Quantum information bits are more sensitive to environmental
    damage and decay than their counterpart, classical information bits. The idea
    is to embed the qubits into a larger state with more qubits so that even if some
    qubits are lost, the message can still be recovered (i.e. embed a smaller number
    of qubits into a large qubit state). A simple example of quantum error correction
    involves qubits, as opposed to qubits. Quantum bits are quantum information bits
    with three states, qubits are quantum information bits with two states (qu-trits:
    three, qu-bits: two). Ququarts (four-state quantum information bits) have been
    proposed (Traina, 2007). There is also the general notion of quantum digits or
    quantum bits with d-superpositions, units of quantum information described by
    a superposition of d states), for which Bell pair entanglement (nonlocality) has
    been tested in a 7-qubit system (Fonseca et al., 2018). The idea is that quantum
    information bits are “artificial atoms”, and as such, can be defined by arbitrarily
    many states; qubits (with two ending states, 0 and 1) are most aligned with the
    current quantum information infrastructure based on classical bits (also with
    0 and 1 values). The reason to use qubits and other quantum information unit formats
    is that by having more states, they may be more efficient, for all operations,
    including error correction.


    The 3-qudit example is used to demonstrate quantum error correction. The model
    designs a larger Hilbert space and a smaller subspace. An overall system with
    3-quits implies a 27-dimensional Hilbert space as its total scope of operation
    (3 qutrits × 3 states equals 27). The Hilbert space (or density matrix) of possible
    qudit states is 27. A 3-qudit code can be written to pick out 3D subspace within
    the overall 27-dimensional Hilbert space. The implication for error-correcting
    is that the qudits are entangled, any 2 qudits can be used to reconstruct a particular
    state. Since any 2 qudits can be used for the reconstitution, this is called a
    unitary transformation, which implies symmetry (i.e. well-formedness) as a property
    of the system. The system protects against the erasure of any single qurit because
    the state can be reconstructed from the other 2 qutrits.'
