    # 4.5.1 Introduction to inequalities


    Mathematical inequalities are important concepts in quantum computing and statistical
    physics. A mathematical inequality is two quantities that are not equal to one
    another. More formally, an inequality is the situation in which two quantities
    have different values (an inequality contrasts with an equality, in which two
    quantities have the same value).


    The theoretical implication of mathematical inequalities is that they can be used
    as a technique to prove other mathematical statements, or make statements about
    other mathematical statements that might be useful in problem solving. For example,
    inequalities can be used to frame problems by bounding quantities for which exact
    formulas cannot be easily computed. As such, mathematical inequalities can be
    used as an analytic tool to marshal probabilistic data, in various application
    areas such as machine learning and quantum mechanical systems. The idea is using
    mathematics as a tool to rewrite or transform complicated problems into'
