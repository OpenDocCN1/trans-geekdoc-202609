    32-character alphanumeric codes) that are mathematically related (for example,
    comprising two points on a certain elliptical curve function.


    With a clever scheme using public keys, users can send each other encrypted messages
    over the internet that only the receiving party can decode and read them. If A
    and B are both using the same PKI infrastructure, if A wants to send B a secret
    message, A asks B for B''s public key. B''s key may be published on the internet,
    or B sends A''s public key across the open internet. A uses B''s public key to
    encode a message to B (with only B can read, and sends the encoded message. B
    receives the encoded message, and because only B has B''s private key, B is able
    to decode the message and read it. It is possible because B''s public and private
    keys are related in the encryption mechanism; any encoded message with B''s public
    key can be decoded with B''s private key. A and B are participating in the same
    PKI system, meaning that each is running the same software which mathematically
    relates the public and private keys held by each specific user together in a known
    method to encrypt and decrypt the messages on either end without revealing the
    underlying keys.


