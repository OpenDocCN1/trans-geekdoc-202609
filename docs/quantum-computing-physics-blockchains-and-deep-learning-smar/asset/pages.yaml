    is that the information of 1 qubit can be stored on a highly entangled state of
    several qubits. A local point, 1 qubit can be smeared out, and represented with
    a larger number of qubits. The auxiliary qubits are called ancilla (ancillary
    qubits). Quantum error correction is typically performed by introducing an ancilla
    in the form of additional qubits with which the qubit of interest is entangled.
    Entangling the qubit of interest with ancillary qubits allows the qubit to be
    protected by smearing its information over a larger system. The qubit of interest
    can be error-checked its information can be examined indirectly through the entangled
    qubits (through parity measurements). In this way, quantum error correction is
    used to test the integrity of quantum information without damaging it. Quantum
    error correction makes quantum computing feasible, in that a quantum computer
    can tolerate some degree of noise in the environment by correcting errors. Many
    different kinds of quantum error-correction codes (encoding schemes) have been
    proposed. Shor''s code uses a 9-qubit smear, and others require fewer qubits (a
    7-qubit code and a 5-qubit code, for example) (Shor, 1995).


    # 4.4.3.2 Classical error correction


    In general, all forms of computing systems use error correction to check for data
    integrity. An error-correcting process seeks to determine whether information
    has been damaged or destroyed and restores its initial state. Error correction
    is well-understood in classical logic. For example, there could be a memory chip
    storing bits that is hit by a cosmic ray. If one bit in a 32-bit word is flipped,
    there are many known ways of recovery. With redundancy, having several copies
    of the information means that a mechanistic majority-voting mechanism can be used
    to confirm the intact version of the data. With quantum logic, however, error
    correction based on making redundant copies of the information cannot work. It
    is not possible to copy quantum information due to the no-cloning theorem, which
    states that it is impossible to create an identical copy of an arbitrary unknown
    quantum state. Therefore, quantum error-correction methods such as those based
    on entanglement are needed.'
