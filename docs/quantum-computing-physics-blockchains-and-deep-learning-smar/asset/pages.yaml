  md: '# 184 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    (Swan, 2017). In academic study, artificial intelligence is a sub-field of computer
    science. Within artificial intelligence, machine learning is one of the biggest
    focal areas. Machine learning is the study of algorithms and statistical models
    used by computers to perform tasks relying on information patterns and inference
    as opposed to explicit instructions. Machine learning has outperformed conventional
    methods (digital and human) in various fields with demonstrated success in machine
    recognition, machine translation, and speech recognition.


    A widely used technique for developing machine learning algorithms is neural networks,
    a computer system architecture that is modeled on the human brain and nervous
    system. Neural networks comprise multiple layers of computational processing to
    instantaneously achieve higher levels of abstraction. Computational neural networks
    attempt to imitate the brain extracts multiple levels of representations from
    sensory input and has signaling thresholds that trigger action. Deep learning
    networks are the latest incarnation of these methods. So-called “deep networks”
    were proposed as multi-layer neural networks with top-down connections (Hinton,
    2007), and the term “deep learning” arose to describe Google’s successful cat
    and facial image recognition project based on YouTube data (Le et al., 2012).


    Conceptually, deep learning is a computer software program that can identify an
    object, either a physical object or a digital object. More technically, deep learning
    is a class of machine learning algorithms in the form of a neural network that
    uses a cascade of layers of processing units to model high-level abstractions
    in data and extract features with to make predictive guesses about new data. Mathematically,
    deep learning is the instantiation of a problem with logistic regression, applied
    to a computation graph of modular processing units with variable weights and biases,
    to create a mapping function between input and output guesses, which is optimized
    by cycling forward and backward through the layers using a loss function (such
    as gradient descent) to obtain predictive results. A representative task for a
    deep learning network, in autonomous driving for example, is to identify whether
    another object in the landscape is a car or not. The immediate goal of deep learning
    networks is to create an image, speech, or text recognition system that determines
    which features are relevant (at increasingly higher levels of abstraction)'
