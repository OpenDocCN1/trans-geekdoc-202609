    is computed for the transaction execution. Account states may change frequently,
    whereas a UTXO’s state remains “unspent” until the coin is “spent” by a particular
    address.


    To accommodate the situation of changing account states, sigma bullets (bulletproofs
    + sigma protocols) implement a paired account system of a stable account. The
    stable account is the account from which commitments and proofs are made, and
    the temporary account is used for the incoming and outgoing activity of the account.
    There are periodic rollovers (every few blocks) to merge the temporary account
    into the stable account. To prove that there is no-doubling between the linked
    accounts, a basic zero-knowledge proof is performed by hashing the private key
    to create a proof that the hash of the private key is correct (Monero and Zcash
    also use this basic application of zero-knowledge proof technology to confirm
    the private key). The stable-temporary account pairs provide a protected time
    window for the validity of commitments to be updated.


    The commitment changes (and needs to be re-proven as valid) if the account state
    changes, and also if the account holder adjusts the commitment. Although Pedersen
    commitments are binding, there may be some flexibility for the account holder
    to add to the commitment or make other kinds of allowable adjustments. If the
    account holder changes the commitment, another zero-knowledge proof must be submitted
    that proves the requisite commitment for the initial transaction is still in place.
    Formally, Zether combines bulletproofs-based range proofs with sigma protocol-encoding
    features (specifically ElGamal encryptions) to provide zero-knowledge proofs in
    the case of updates to commitments.


