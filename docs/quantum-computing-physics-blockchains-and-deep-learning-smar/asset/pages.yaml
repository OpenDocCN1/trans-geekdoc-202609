    the energy landscape minimum is a probabilistic sum of the values in the landscape.
    The output of the classical Hamiltonian is a specific point value. In quantum
    computing on the other hand, the algorithm in the optimization calculation is
    a quantum Hamiltonian. The quantum Hamiltonian still calculates the total energy
    in the system, but the quantum Hamiltonian is an operator on the multi-dimensional
    Hilbert space of qubits. As a quantum operator, the'
