  md: '# Chapter 15


    # AdS/Smart Network Correspondence and Conclusion


    # Abstract


    The smart network theories are derived from statistical physics (statistical neural
    field theory and spin glass models) and information theory (the he anti-de Sitter/conformal
    field theory, AdS/CFT, correspondence). Whereas the smart network field theory
    (SNFT) is aimed at the next phases of the classical development of smart network
    systems, the smart network quantum field theory (SNQFT) is intended to facilitate
    the potential expansion into the quantum domain, in the implementation of quantum
    smart networks. This chapter develops the SNQFT from the AdS/CFT correspondence,
    and suggests the possibility of the correspondence supplanting probability as
    a central organizing principle for certain ways understanding physical reality.
    The SNQFT is developed and motivated towards a variety of potential applications.
    It is suggested that everyday macroscale reality is the boundary to the quantum
    mechanical bulk. An emphasis is placed on models that integrate quantum mechanical
    field views and geometric views, including for the exploitation of quantum mechanical
    systems in macroscale reality. Finally, the work considers risks and limitations
    and concludes. The content in this chapter is more speculative and conjectural
    than that in previous chapters.'
