    Quantum annealing-based optimization has many practical demonstrations. For example,
    Volkswagen has used a D-Wave quantum annealing machine to optimize travel time
    in Beijing for a network of 418 taxis, and intends to implement the resulting
    traffic management system in Lisbon (Hetzner, 2019). The same kind of large-scale
    quantum optimization is used in AdTech for web browser promotion placement, and
    in UK online grocer Ocado’s automated warehouses for scheduling. The optimization
    algorithm coordinates hundreds of robots passing within 5 mm of each other at
    speeds of 4 m/s, in the process of fulfilling 65,000 orders per week (Fassler,
    2018).


    # 10.2.3.1 Optimization: Quantum annealing


    Quantum annealers are physical devices that attempt to solve NP-complete optimization
    problems by exploiting quantum mechanical properties. The basic principle of quantum
    annealing is to encode the optimization problem in Ising interactions (ferromagnetic
    phase transitions) between qubits (Lechner et al., 2015). Quantum annealing is
    emblematic of framing computational problems as an energy landscape. The way that
    quantum annealing (or simulated annealing more generally in classical computing)
    is used in optimization problems is to solve the problem of local minima in gradient
    descent. In gradient descent, an algorithm selects a random point in the landscape,
    checks the height of near-by neighbors, and descends in the steepest slope indicated
    by the local landscape. The problem is that although gradient descent may find
    local minima points, these may not be the global minimum (and therefore, the best
    answer for the optimization problem). Annealing is a technique that is able to
    scour the entire landscape by going up and down all of the peaks in the landscape
    to find the global minimum (as opposed to only being directed downwards as in
    basic gradient descent algorithms).


    In quantum annealing, qubits exist in a superposition state of being 0 and 1 at
    the same time. This means that the quantum solver is not traversing the landscape
    by point (all X and Y coordinates), but'
  merge: -1
  img_proc: true
