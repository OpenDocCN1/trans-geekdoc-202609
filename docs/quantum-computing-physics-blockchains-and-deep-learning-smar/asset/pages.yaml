    # 14.1.3.3 Practical error correction in quantum computing


    The benefit of holographic codes is that they represent a concrete possibility
    for quantum error correction in quantum computing that might be realized immediately
    on near-term NISQ devices. The earliest theoretical quantum error-correction codes
    were proposed by Shor (1995) and Steane (1996), and have been elaborated into
    practical implementations by other researchers such as Gottesman (2009). Pastawski’s
    holographic code generalizes the concatenated quantum codes that Gottesman discusses
    for fault-tolerant quantum computing. Some of the next steps include developing
    a theory of holographic codes that studies efficient schemes for correcting general
    errors beyond erasure errors, addressing problems such as the friction between
    rate and distance, and identifying ways to realize a universal set of logical
    operations acting on the codespace.


    The benefit of the holographic model is that it provides a way to balance the
    trade-offs in quantum error-correction code design between redundancy and security,
    a familiar concern in network security design. On the one hand, quantum error-correction
    codes must be redundant enough to error-correct by having a number of ancilla
    qubits. On the other hand, quantum error-correction codes must be secure from
    external eavesdroppers. The threshold secret-sharing property of the holographic
    code can be used to manage the trade-off between redundancy and security, by specifying
    the required threshold for secure codes and efficiently sized qubit ancillas.'
