  md: '# Quantum Computing: Basic Concepts 61


    an electron stripped away from them or added to them. Qubits are produced by exciting
    neutral atoms trapped in optical lattices or optical arrays, and qubits are controlled
    in computation by another set of lasers. The neutral atoms are trapped in space
    with lasers. An optical lattice is made with interfering laser beams from multiple
    directions to hold the atoms in wells (an egg carton-shaped structure). Another
    method is holding the atoms in an array with optical tweezers. Unlike ions (which
    have strong interactions and repel each other), neutral atoms can be held in close
    confinement with each other and manipulated in computation. Atoms such as cesium
    and rubidium are excited into Rydberg states from which they can be manipulated
    to perform computation (Saffman, 2016). Researchers have been able to accurately
    program a two-rubidium atom logic gate 97% of the time with the neutral atoms
    approach (Levine et al., 2018), as compared to 99% fidelity with superconducting
    qubits. A 3D array of 72 neutral atoms has also been demonstrated (Barredo et
    al., 2018).


    # 3.3.7.2 Diamond defects (nitrogen-vacancy defect centers)


    An interesting approach, although one that may have scalability challenges for
    commercial deployment, is diamond center defects. Imperfections in the crystal
    lattice within diamonds are commonplace and have been exploited for a variety
    of uses from crystallography to the development of novel quantum devices. Defects
    may be the result of natural lattice irregularities or artificially introduced
    impurities. For quantum computing, impurities are introduced by implanting ions
    to make nitrogen-vacancy photonic centers. A nitrogen vacancy can be created in
    a diamond crystal by knocking out a carbon atom and replacing it with a nitrogen
    atom and by knocking out a neighboring carbon atom so there is a vacant spot.
    The nitrogen vacancy produces the so-called Farbe center (color center), which
    is a defect in a crystal lattice that is occupied by an unpaired electron. The
    unpaired electron creates an effective spin which can be manipulated as a qubit.
    The nitrogen-vacancy defect center is attractive for quantum computing because
    it produces a robust quantum state that can be initialized, manipulated, and measured
    with high fidelity at room temperature (Haque & Sumaiya, 2017).'
