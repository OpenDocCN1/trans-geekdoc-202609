    A private key is generated iteratively between two parties. The key generation
    process between Alice and Bob could be as follows. Alice sends a bit (a photon)
    at a time, measuring certain information parameters about each photon sent. Bob
    receives and records information about each photon received. At some point, the
    two parties compare information about what has been sent and received (not the
    information itself because it cannot be inspected without damaging it, but the
    metadata about the information that has been sent). When half of the bits are
    verified, the rest of the stream is dropped and the current bits that have been
    sent and received are used as a key. The keys are not exactly the same. Alice
    and Bob have slightly different bits due to noise and the possibly of eavesdropping.
    If the error rate between the keys is low enough (typically 20%), the key is deemed
    secure and communication proceeds (Bennett, 1992).


