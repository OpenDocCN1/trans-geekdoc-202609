    # 14.4.1 Novel uses of quantum error-correction architecture


    In machine learning, quantum error correction has been proposed as a method for
    allowing greater control during quantum annealing processes (Lechner et al., 2015).
    Quantum annealers are physical devices that attempt to solve optimization problems
    by exploiting quantum mechanics. A standard method of quantum annealing is encoding
    the optimization problem between qubits, in a spin glass model. Controlling the
    qubit interactions in the spin glass model is not possible, though, and the quantum
    computation must run until it is finished. However, instead of using a spin glass
    model of the Ising interactions, an error-correction model could be used to engage
    certain qubits as they perform the computation, offering a control mechanism for
    the computation.


    The proposed solution is in the form of a scalable architecture with fully controllable
    all-to-all connectivity that can be implemented selectively over local interactions.
    The method is in the form of a quantum error correction scheme. The input of the
    optimization problem is encoded in local fields that act on an extended set of
    physical qubits. The output is redundantly encoded in the physical qubits, which
    instantiates an error-correction architecture for the system. The control mechanism
    is applied by allowing only portions of the output into the computation. The error-correction
    architecture creates a tableau of extra qubits that can be engaged selectively
    to perform the computation, from the spread-out entanglement of qubits in the
    error-correction scheme. More formally, the model can be understood as a lattice
    gauge theory, in which long-range interactions are mediated by gauge constraints.


