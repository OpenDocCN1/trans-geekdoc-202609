    # 8.5 Post-quantum Random Oracle Model


    The quantum random oracle model is one of the single most challenging risks to
    quantum cryptographic security (Boneh et al., 2011). This is because it indicates
    a greater acceleration of the advantage of quantum computing over classical computing
    than other comparisons. The quantum random oracle model is a quantum-accessible
    random oracle. The adversary can query the random oracle with quantum states and
    evaluate the oracle in superposition. The attacker has access to a known random
    oracle structure (some random function such as a hash function) which it can evaluate
    in superposition.


    A random oracle is an oracle (a generic technology) that responds to every query
    with a random response uniformly from its output domain. Random oracles are used
    in proof systems to check if a sample is within the random oracle output range;
    if so, suggesting a valid proof, if no, an invalid proof. The random oracle in
    computational models typically uses an abstraction of a known cryptographic hash
    function, currently SHA-256, Keccak, or Blake. A known cryptographic hash function
    is used for two reasons. First, it is a proven and established standard (so it
    is assumed to work), and second, it serves as an independent party to query to
    obtain valid quantum statistical query distributions for the proof.'
