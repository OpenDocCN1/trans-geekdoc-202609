    # 8.4.1 Non-interactive and interactive proofs


    There are different proof formats, namely non-interactive and interactive. One
    is not better than the formats, rather there are trade-offs in using the different
    variations. The key difference is that interactive proofs are used when the verifier
    wants to make use of randomness in the verification process such as in the STARKs
    example. A non-interactive proof is a proof that does not require an interaction
    to take place between the prover and the verifier. The proof generation is a computational
    operation which is abstracted as strings of symbols and verified by any computational
    operation. An interactive proof (in computational complexity theory) is an abstract
    machine that models computation as the exchange of messages between two parties.


    Whether non-interactive or interactive, in computational complexity theory, a
    proof is a computational process. This is distinct from a proof in real-life such
    as having to present a passport, or the zero-knowledge proof example of Bob sending
    encrypted messages to Alice until he is convinced that it is really her. In non-interactive
    proofs, one computational process generates the proof and another process confirms
    it. In interactive proofs, the computational process models an interaction between
    the prover and the verifier, introducing randomness to make the proof better and
    quicker. Either takes place very quickly in the time frame of computation,'
