- pgno: 70
  md: '# 48 Quantum Computing: Physics, Blockchains, and Deep Learning Smart Networks


    Some of the special properties of quantum objects (be it atoms, ions, or photons)
    are superposition, entanglement, and interference (SE properties). Superposition
    means that particles can exist across all possible states simultaneously. This
    is known as a superposition of states. For example, an electron may exist in two
    spin states simultaneously, referred to as 1 and 0, spin-up and spin-down. Entanglement
    is the situation that groups of particles are related and can interact in ways
    such that the quantum state of each particle cannot be described independently
    of the state of the others when the particles are separated by a large distance.
    Across large distances, this is called Bell pair entanglement or nonlocality.
    Interference relates to the wave-like behavior of particles. Interference can
    be positive or negative, in when two waves come together, they are either reinforced
    or diminished.


    Classical computing is based on electrical conductivity, using Boolean algebra
    (namely expressions evaluating as true/false, and/or, etc.) to manipulate bits.
    Quantum computing is based on quantum mechanics, using vectors and linear algebra
    to manipulate matrices of complex numbers. Aiming toward universal model of quantum
    computation, the idea is to package the quantum mechanical matrix manipulations
    such that they run quantum states that are executed with a set of gates that offer
    the kind of Boolean logic is in classical computing.


    # 3.2.2 Bit and qubit


    In classical computing, the bit is the fundamental computational unit. The bit
    is an abstract mathematical entity that is either a 0 or a 1. Computations are
    constructed as a series of manipulations of 0s and 1s. In the physical world,
    a bit might be represented in terms of a voltage inside a computer, a magnetic
    domain on a hard disk, or light in an optical fiber. The qubit (quantum bit) is
    the equivalent system in quantum mechanics. The qubit is likewise an abstract
    mathematical entity (a logical qubit), existing in a superposition state of both
    a 0 and a 1, until collapsed in the measurement at the end of the computation
    being a classical 0 or 1. The qubit can be instantiated in different ways in the
    physical world. There are realizations of qubits in atoms, photons, electrons,
    and other kinds of physical systems. The quantum state of a qubit is a vector
    in a 2D space.'
