    # 5.3.5 Smart routing through atomic multi-path routing


    Other blockchain functionality is also being deployed in smart routing solutions,
    notably atomic swap technology in atomic multi-path routing.


    # 5.3.5.1 Atomic swaps


    An atomic swap is a smart contract technology that enables the exchange of one
    cryptocurrency for another without using centralized intermediaries, such as exchanges.
    The idea is a peer-to-peer exchange of funds of the same value between two cryptocurrencies
    using a smart contract as an escrow service. A programmatic feature called hash
    time-locked contracts is used to ensure that both parties fulfill the requirements
    of the trade. If both parties do not deposit their funds within a certain time
    parameter, the trade is canceled. In this context, atomic means “all or nothing”
    or undeniable (as indivisible material). The two sides of the transaction are
    necessary to compose the atom (the whole) of the transaction. This prevents one
    party from tending their funds and the other party stealing them without fulfilling
    their part of the deal. The swap is not executed unless both parties deposit their
    funds.


    The notion of atomic transactions is derived from computer science more generally
    and database management, in which atomic transactions are those that either occur
    completely or not at all (there is no partial file transfer). Likewise, in blockchains,
    atomic transfers either happen completely or not at all. Atomic swaps on blockchains
    were proposed in 2013 and one of the biggest execution venues is Komodo platform
    (a multi-chain platform) (Nolan, 2013). Similar kinds of order structures'
