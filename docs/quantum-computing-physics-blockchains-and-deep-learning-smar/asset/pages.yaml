    # 4.4.3 Entanglement property of qubits


    Unlike classical information, which can be examined arbitrarily many times to
    determine if it has changed, quantum information cannot be measured directly because
    it will change or destroy the information. However, quantum information has the
    interesting property of entanglement. The entanglement property refers to quantum
    particles being entangled with one another. Quantum particles are not isolated
    and discrete, but rather correlated, with each other, and the history of the system.
    Particles and previous states are correlated as part of the full information landscape
    of the quantum system. Hence, quantum error correction is performed by taking
    advantage of the entanglement property of qubits. The insight is that due to entanglement,
    it is possible to measure relationships between qubits without measuring the values
    stored by the qubits themselves.


    # 4.4.3.1 Error-correction codes


    Quantum error correction uses the entanglement property to smear out the information
