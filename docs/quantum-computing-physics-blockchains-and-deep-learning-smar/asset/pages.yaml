    surprising, given that these features are applied to information domains in which
    a key question is the extent to which any signal is compressible (or more generally
    signal-to-noise ratios and the total possible system configurations (entropy)).
    However, proofs and hash functions are different from traditional information
    compression techniques since they can convert an arbitrarily-large input to a
    fixed output, which denotes the attributes of a flexible and dynamical real-time
    system. This book (especially Chapter 15) extends these insights to interpret
    the emerging features (proofs, error correction, and hash functions) and quantum
    smart networks more generally, in a dimensional model (the bulk-boundary correspondence).
    In the bulk-boundary correspondence, the compression or expansion activity is
    performed in a higher-dimensional region (the bulk), and then translated such
    that the result appears in fewer dimensions in another region (the boundary).


