    dynamics. It''s also important to keep in mind that most justice systems require
    considerable financial contribution for cases similar to those Kleros is dealing
    with. Kleros does not claim to be able to solve the many injustices we live with
    today.


    So, does Kleros''s framework complicate the idea of code being law? While it is
    possible that the results of disputes handled through Kleros could be recognised
    by various international frameworks, there is no guarantee that interventionist
    courts would not seek to overturn or not'
  merge: -1
