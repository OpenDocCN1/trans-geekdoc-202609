- pgno: 112
  md: 'Over the past few years, as cryptocurrencies have continued to penetrate into
    the mainstream, many projects, even if mainly managed through smart contracts,
    have sought to play it safe and register as a legally recognised organisation.
    Legislation has been passed in places like Wyoming, Vermont, Switzerland and elsewhere
