  md: '# Smart Contracts and Decentralised Applications


    Once it was realised that we could create a system of holding some form of digital
    currency using computers on a P2P network without the need for banks or governments,
    then hypothetically it should also be possible to program this digital currency
    as we do with any other computer program. In late 2013 Vitalik Buterin, a nineteen-year-old
    Canadian college dropout who had previously founded Bitcoin Magazine, published
    a white paper describing a blockchain that could do everything Bitcoin could as
    well as facilitate a software development platform for “smart contracts”. He called
    it Ethereum. Like Bitcoin it uses the ether cryptocurrency to pay for transactions
    on the network, but either should not be considered to be money (even though it
    has money-like properties).


    According to the Ethereum Foundation, the non-profit that stewards the development
    of the Ethereum blockchain, a “smart contract” is:


    +   simply a program that runs on the Ethereum blockchain. It’s a collection of
    code (its functions) and data (its state) that resides at a specific address on
    the Ethereum blockchain.


    Smart contracts are a type of Ethereum account. This means they have a balance
    and they can send transactions over the network. However, they’re not controlled
    by a user, instead they are deployed to the network and run as programmed. User
    accounts can then interact with a smart contract by submitting transactions that
    execute a function defined on the smart contract. Smart contracts can define rules,
    like a regular contract, and automatically enforce them via the code. Smart contracts
    cannot be deleted by default, and interactions with them are irreversible.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'The term “smart contract” was actually first used by computer scientist Nick
    Szabo in 1994, predicting that the digital revolution would at at some point come
    to automate the same functions as legal contracts. This would facilitate global
    free markets in which small businesses could compete with large corporations on
    a level playing field. Buterin, however, popularised the term with his white paper,
    describing Ethereum as not just as an electronic peer to peer payment system,
    but as a platform for “decentralised applications” which are also commonly referred
    to as “dapps”.


    At this point there are many more blockchains that have smart contracts, but to
    keep it simple, let''s stick to Ethereum for now as the others work similarly.
    An Ethereum smart contract can be thought of as a facilitator of an automatically
    enforceable event that has many different possible outcomes depending on the inputs
    of the contract and how other accounts on the network are interacting with it.
    Like a normal computer program or a script, a smart contract is an IF-THEN statement
    defined by the smart contract programmer. It waits for certain conditions to be
    met (IF) which defines the next step in the process (THEN). A major difference
    with a smart contract compared to a legal contract is that the enforcement of
    the consequences of the conditions being met is automatic, as it is with any computer
    program, opposed to enforcement by a legal jurisdiction like a government or state.
    However, similar to a legal contract, it can define and have concrete consequences
    for assets and property in a way that a normal computer program without a link
    to the state system cannot.


    In some ways you could think of it like a vending machine which takes the inputs
    of your money plus the snack you want to receive and then outputs the snack you
    wanted plus any change. While a vending machine is largely a physical interaction,
    a smart contract is largely a digital one. This has had many implications in not
    only thinking about money or finance, but also politics and democracy.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Here are some simple examples for how a smart contract could be used:


    +   1. **IF your flight is cancelled THEN** receive a refund from the airlines

    2. **IF enough ether is raised from investors THEN** send all of the ether to
    the fundraisers and a token to represent the proportional stake to investors

    3. **IF the proposal has over 51% of the vote for "yes" THEN** proceed with the
    proposal

    4. **IF enough people in the organisation have expressed dissatisfaction with
    the current leader THEN** recuse them and start a new vote to choose a new leader


    The technical reason why Ethereum is able to handle smart contracts comes from
    pushing the function of nodes on the network beyond just tracking a single cryptocurrency
    to assisting in computation more broadly, making the P2P network that secures
    Ethereum not just a distributed database but also a distributed computer. In one
    way, you could see Ethereum as one big computer that is made of smaller computers
    distributed around the world running an Ethereum client that exerts the computational
    power necessary to track the movement of ether and execute smart contracts. This
    is often referred to as the Ethereum virtual machine (EVM).


    By combining the permissionless nature of blockchains with the Turing completeness
    of programming languages and the EVM, Ethereum creates permissionless composability
    for the creation of dapps. If a programming language is “Turing complete”, it
    means it can perform any computation that any other system can perform. It’s considered
