    # CLIMATE COLLAPSE: THE COORDINATION PROBLEM OF OUR LIFETIME


    It is clear that we are unsure as to what our long-lived pollutants are doing
    to our environment; however, there seems to be no doubt that the potential damage
    to our environment could be severe.


    > — E. Robinson and R.C. Robbins, Sources, Abundance, and Fate of Gaseous Atmospheric
    Pollutants, final report to the American Petroleum Institute, 1968


    In the fall of 2003, British Petroleum (BP), one of the largest non-state-owned
    oil companies in the world, began a very successful advertising campaign, pushing
    for people to start measuring their own “carbon footprint”. The commercial begins
    with the question, “What size is your carbon footprint?”, after which a series
    of people (likely actors) explain what they believe the term “carbon footprint”
    means, guiltily implying that their lifestyle choices were hurting the environment.
    The last third of the commercial includes the line, “We can all do more to emit
    less”, along with a description of how BP was working on projects to reduce its
    own emissions. On the surface, the purpose of the campaign was to get people to'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'visit BP’s “carbon footprint calculator” website, but digging deeper, it’s
    clear that the intentions were much more sinister.


    What was the purpose behind legitimising the term “carbon footprint”? Since the
    campaign, the term has exploded in use and our understanding of climate change
    and what we need to do in order to prevent it has been framed by the idea of climate
    change as a personal failing. We each need to be allotting ourselves a budget
    of carbon, and if you go above that, climate change is your fault. This type of
    framing plays on well-meaning people’s sense of personal responsibility and downplays
    systemic issues in regard to greenhouse gas emissions. When you live in a community
    that has no public transport or bike lanes you need to travel long distances,
    how can as an individual be blamed for wanting a car? At the same time, while
    the individual citizen is supposed to worry about the emissions quantified in
    their carbon footprint, large oil companies have been funding lobbying efforts
    to prevent cities from building infrastructure that would allow for less carbon-intensive
    modes of transportation and energy use in order to justify more fossil fuels.
    The campaign was an early example of “greenwashing”, a marketing trick to convince
    the public that a company’s practices, policies and product are environmentally
    friendly. It obscures the need for systemic solutions that solve the issue at
    its root, forcing you to make “better” consumer choices within a range of options
    in which you can largely choose the best bad.


    One of the largest funders of climate disinformation in their attempt to prevent
    action on transitioning away from fossil fuels has been the group of fossil fuel
    corporations, lobbyists and politicians known as “Big Oil”. Reports have shown
    that as early as 1968,² of the largest oil and gas companies in the world, Exxon,
