    The systemic risk posed by shadow banking, as shown in the 2008 crash, makes it
    reasonable to speculate on proposing regulations as a way to limit the risks that
    could end up being borne by consumers. In order to take a deeper look into the
    criticisms levelled by Senator Warren, that crypto is a new form of shadow banking,
    let''s first understand a couple more common mechanisms prominent in DeFi.


    # DeFi Primitives: Lending Protocols and Stablecoins


    Smart contracts designed to allow lending between agents are an important primitive
    for DeFi. A couple of the most popular ones on Ethereum at the time of writing
    are Compound and Aave. These protocols function like a money market, which is
    a market for short-term loans in the noncrypto economy. Similar to the AMM model
    for DEXs, in DeFi lending anyone can be a lender for a specific token facilitated
    by a smart contract which can earn them interest, often referred to as an annual
    percentage yield'
  merge: -1
  img_proc: true
- pgno: 139
  md: '(APY). Suppliers earn return from borrowers who take out loans from the pool
    of tokens held by the smart contract. Borrowers pay back their loan plus their
    accrued borrower interest rate, which is always more than the supplier APY. Usually
    in this set-up, every loan needs to be over-collateralised, meaning that the borrower
    must supply more value of another asset as collateral in order to take out a loan.
    The excess amount that needs to be supplied is determined by the “collateral factor”
    set in the smart contract. For example, let’s say you want to use ether for a
    loan you want to take out, and the collateral factor for ether is 0.75. This means
    that you can borrow up to 75% of the value of your collateral. So, if your collateralised
    ether is worth $100 then you can borrow up to $75 of the asset you want to borrow.


    This DeFi primitive has a very popular way for people to earn interest fairly
    safely on their digital assets. The reason it’s fairly safe as a lender is because
    of the required over-collateralisation of the borrower. If the price of the asset
    put on collateral drops below the collateral factor threshold required to back
    the loan, their collateral is automatically liquidated through the smart contract
    in order to pay off the loan. In order to determine the real price that the lending
    smart contract should consider for liquidation, it uses oracles to receive data
    from multiple other exchanges, taking the average of them so they are not dependent
    on a single exchange that could be hacked or manipulated. Additionally, it is
    sometimes common for these dapps to offer extra rewards as incentives for being
    a lender for a specific market, making it a part of liquidity mining strategies.


    At the time of writing, taking out under-collateralised loans is still widely
    available. This makes sense when you’re using a medium that can’t reliably use
    your personal information and give it to lenders to make risk assessments on its
    own. One way that Aave allows users to take under-collateralised loans is through
    a technique called “flash loans”. Here, a user'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'can take an under-collateralised loan as long as the loan itself is paid off
    in the same block that they are taking out the loan on the blockchain being used.
    If the loan can''t be paid off in the same block, then the loan isn''t made. At
    the moment it''s largely used for very niche scenarios and has been a common weapon
    for DeFi hackers to try to manipulate markets and as a way to steal money from
    smart contracts. In this environment, it makes sense that the vast majority of
    loans require at least an equal amount in collateral to the loan, but plenty of
    people are trying to find out ways to make it work through third-party risk assessments
    and credit scores.


    But why would you want to take a loan with an equal amount of value of collateral
    on the line? This is not so different to when people use their house as collateral
    for a loan from a bank, but as an active trader of different cryptocurrencies,
    you may want to have exposure to a different asset without completely losing the
    collateralised asset, similar to getting exposure to cash without necessarily
    losing your house. By doing this you take a risk, but you can get exposure to
    more stable assets while holding on your riskier ones. It could also occur that
    unexpected expenses come up that require you to pay for something denominated
    in something stable, like US dollars. This brings us to another DeFi primitive,
    stablecoins.


    A stablecoin is a cryptocurrency whose price is pegged to a usually stable asset
    like the US dollar, a commodity like gold, a basket of different assets or even
    to another cryptocurrency in order to prevent its price being too volatile. This
    is not only an extremely useful thing for traders so that they can move in and
    out of volatile positions, but for anyone who would want to use cryptocurrency
    without needing to worry about big changes in price relative to the underlying
    asset being pegged. Stablecoins most commonly try to stay pegged to the US dollar.
    There are a few different ways different stablecoins are able to keep their peg.'
