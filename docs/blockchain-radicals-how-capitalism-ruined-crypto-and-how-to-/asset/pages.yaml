    # Sci-Hub: Making Science Like Communism


    In 1942 Robert K. Merton, considered to be the founding father of modern sociology,
    published The Normative Structure of Science,22 in which he laid out a set of
    four principles that to be adhered to society to benefit from the fullest measures
    of scientific achievement. For Merton these principles are imperative for scientific
    institutions to follow since together they describe the ethos of modern science.
    The principles are: universalism, disinterestedness, organised scepticism and
    communism. That''s right,


    Merton explains that science requires full and open communication as opposed to
    secrecy. Scientific goods and discoveries should not be held back by turning them
    into intellectual property, since all findings in science benefit from the social
    collaboration of scientists who came before well as their peers. He cites the
    court’s decision in the case of US v. American Bell Telephone Co., which states
    that “The inventor is one who has discovered something of value. It is his absolute
    property. He may withhold the knowledge of it from the public”, as being detrimental
    to science, while praising scientists like Albert Einstein who used patents as
    a way to make sure their work was available to the public. Collective collaboration
    is required for science to reach its fullest capacity. Therefore,'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'having communism in terms of communication is part of the essence of science.
    However, unfortunately, in line with the trend of general institutional failure
    in modern capitalist society, this principle is not adhered to by many large scientific
    institutions, especially scientific journals.


    Unprising to those who have published in academic journals, but surprising to
    those outside of them, many articles published in academic journals, some filled
    with work funded by public grants, are behind a paywall. Academic journals can
    charge somewhere from $30 to upwards of $70 per PDF download. Not only that, but
    it is also common practice for scientists who want to have their papers published
    after rigorous peer review to need to pay the journal for it, something that can
    cost upwards of $5,000 in addition to the nonrefundable application fee to have
    your article even considered for peer-review and publication. On top of that,
    journals earn revenue from organisations, universities, companies, non-profits
    and others that need access to academic articles, by selling them subscriptions.
    In 2012, Harvard’s Faculty Advisory Council revealed that the school spent $3.75
    million annually on academic journal subscriptions with some costing up to $40,000
    every year.23 On top of all of this, the authors of the articles being purchased
    do not receive a cut of the sales of their publication. It’s easy to see how these
    pricing and revenue practices can be detrimental for institutions that don’t have
    the same deep pockets as universities with large endowments.


    Even though much of the research published comes from public money, the most prestigious
    journals for scientists to publish in, that are of most to help their careers,
    are private companies whose purpose is to maximise their profits. The top for-profit
