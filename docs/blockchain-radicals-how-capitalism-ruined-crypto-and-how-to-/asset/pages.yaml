    # Structure vs Agency in Uncertainty


    Debates about capitalism and how to change our economy’s mode of production are
    as old as capitalism itself. The main frameworks for understanding how one can
    take part in this change of human behaviour can be summarised, and perhaps oversimplified,
    as structure versus agency.


    For a structuralist, human behaviour and culture must be understood in relationship
    to the broader systems in which they are nested, because the choices humans make
    are dictated by forces beyond their control. This is a common framework for some
    on the left, who believe that people are limited by the material conditions imposed
    by capitalism and the unequal social relations it requires. The power of this
    structure means that there are only a few specific conditions that must be present,
    and cannot be created by a single person, in order to make a shift for the better
    possible.


    For those on the side of agency, a single human’s independent ability should be
    recognised as a power and resource to make changes in the world. This was a common
    concept among Enlightenment thinkers who were exploring notions of freedom and
    individual will heavily inspired by European settlers’ interactions with the Indigenous
    populations of the Americas, who lived in much less rigidly hierarchical political
    structures.


    The debate between structure and agency can become heated because it has implications
    for many other big philosophical questions, like whether'
  merge: -1
  img_proc: true
