    Each user in the network issues 1 circle token (CRC) per hour with a 7% yearly
    demurrage on the money supply.¹¹ Demarrage is the cost incurred for holding currency
    over time. So in this case, each CRC loses 7% of its value every year. This system
    incentivises users to spend rather than hoard their CRC. This also means that
    the accounting looks more like what we use since there are no negative balances.
