    So let''s walk through the entire process of the creation of one block on the
    Bitcoin blockchain. Users who are connected to the Bitcoin network sign transactions
    with their private key to send to the receiver''s public address along with a
    market determined transaction fee. These transactions are then requested to the
    P2P network of miners who are competing to create hashes with a predetermined
    amount of zeroes in the front using the requested transactions, the hash of the
    previous block and a "nonce". When a miner is able to create a block meeting the
    criteria, it serves as a proof of work to other miners that they won the competition
    for that block, and the winning miner receives newly minted bitcoin as well as
    the transaction fees paid by users whose transactions are included in the block,
    and the process repeats itself.


    ![](img/220602ca4af0f7c12ded8d4ba94bd5ab_48_0.png)'
