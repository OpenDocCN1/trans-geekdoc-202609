    # Augmented Bonding Curves: Liquidity for the Commons


    Only knowing the example of bonding curves to facilitate AMMs as shown above may
    lead you to think that bonding curves are the same as the DEXs, or that DEXs are
    the only use of bonding curves, but this is not correct. Bonding curves are multi-purpose
    tools that use algorithms to manage a pair or basket of assets held in a smart
    contract. By doing so, bonding curves act as an automated counterparty that will
    engage on any side of a trade based on the ratio determined by the algorithm used.
    Notice that it only makes trades happen when another agent initiates and does
    not create trades, hence the reason they are commonly called “automated market
    makers” but can also be seen as an automated counterparty. This helped solve the
    problem of liquidity for tokens that may have low or no liquidity on DEXs as well
    as not needing to rely on exchanges to have custody of a user’s assets.


    We can further dissect AMMs into two more specific functions. The type of AMM
    we have been most focused on here to facilitate DEXs are secondary-market AMMs
    (SAMMs) in that the assets held in the smart contract originate from somewhere
    else but are used to trade between them. For example, all of the AMM smart contracts
    that use bonding curves in Uniswap are all technically SAMMs the assets in the
    pool originate from elsewhere. So where do these crypto assets originate from?


    While there are many mechanisms used to create new crypto assets, primary-market
    AMMs (PAMMs) are a popular one.¹⁰ PAMMs are bonding'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'curve mechanisms that issue new assets based on the supply provided in another
    asset. They are used to determine an appropriate ratio and price of tokens to
    give to a single person relative to the total amount of new tokens purchased.
    They can further be used to purchase back the assets they mint at a dynamically
    fixed price based on the algorithm used. In this way, PAMMs are a primary issuance
    market that provides an alternative to projects needing to mint their own tokens
    at the start to raise money in an ICO while also providing guardrails on the price
    that make it more stable and less attractive to speculators. PAMMs use the assets
    provided by buyers to able to provide liquidity for selling assets back or buyers
    can move their assets to trade on SAMMs.


    The Commons Stack, a development collective inspired by Elinor Ostrom’s work on
    the commons, is building a library of open source component blueprints for helping
    communities build what they call a “minimum viable commons” with tools that realign
    incentives toward the public good. One of the first components they have been
    building is termed an “augmented bonding curve” (ABC), in which they have taken
    the bonding primitive and adapted it to include a community-owned pool of funds
    through a tax for buying and selling assets in the ABC. The common pool of funds
    can then be put towards the collective goals of the community through the use
    of the newly issued asset as a token for voting over the allocation of those funds.
    This configuration is also called Commons Market Maker (CMM), since it does everything
    else that AMMs do added fees that help fund the commons. Inspired by systems in
    the biological world, those from the Commons Stack think of this mechanism like
    a cell wall which separates the wider capitalist economy from the more localised
    commons economy by combining tokens, markets, liquidity and a desire to grow the
    commons. CMMs enable circular, regenerative flows of value within the cyber-physical
    commons that promote sustainability while also interfacing with the wider economy.¹11'
