    # Pathetic Doc Theory


    Traverse the forums, subreddits and other communities around Ethereum and other
    cryptocurrencies and you may stumble across the phrase “code is law” being used
    by its proponents. This is understandable how intertwined finance and law are
    in the non-crypto economy. If you are trying to create a financial system outside
