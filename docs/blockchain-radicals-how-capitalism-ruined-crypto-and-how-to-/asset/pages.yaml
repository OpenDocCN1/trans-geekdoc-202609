    How do we reconcile the various voting mechanisms mentioned and the ideals of
    democracy with the need for anonymity? Under a anonymous system, you’re vulnerable
    to Sybil attacks, in which an attacker creates a large amount of pseudonymous
    identities to gain disproportionate influence over a system. Blockchain networks
    solve this problem through their consensus mechanism. However, this largely relies
    on having access to significant capital, whether in mining equipment or in tokens
    for staking. This is antithetical to democratic principles.


    Many identity solutions for the blockchain space require some amount of doxxing
    of one’s real identity to others, Idena is a project that has managed to find
    a way to get around this some clever designs. Instead of PoW or PoS, Idena uses
    a consensus mechanism they call Proof of Person (PoP). In order to be able to
    take part in the PoP consensus mechanism and earn their cryptocurrency, one needs
    to prove that they are a unique human through solving a series of flip-tests in
    a short, designated time slot.


    A flip-test is a special type of CAPCAPT (the test you do when you’re asked to
    prove you’re a human to access certain webpages) that is very difficult for artificial
    intelligence to solve. In a flip-test, it is submitted by validated participants
    and verified by other validated participants, you are given two choices, with
    four of the same pictures in different orders. In order to solve it, you must
    correctly choose the series of pictures that make the most sense as a series of
    logical steps. For example, you could have a full trash can, then someone holding
    a full trash bag, pulling out a new trash bag and then an empty trash can with
    an empty bag in it. In this order it makes logically, but in a different order
    it would not. These types of tests are very difficult for an artificial intelligence
    to figure out, but it is ultimately an arms race between the protocol and those
    trying to game the'
