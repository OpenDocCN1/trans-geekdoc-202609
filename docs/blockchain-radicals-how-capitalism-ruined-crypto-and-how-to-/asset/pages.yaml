    # Markets and the Commons without Capitalism


    Most theories of capitalism were developed in the eighteenth and nineteenth centuries,
    when markets expanded and the privileges of the nobility were'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'challenged. It was also a period of intense competition between capitalists
    as they jockeyed for power not only in markets, but also politically. The rise
    of capitalism also coincided with the rise of the modern nation state, in which
    political rights were expanded from the nobility to include countrymen (but not
    women) who owned property. Nation state governments played an important role in
    codifying the powers of both the noble and capitalist classes, governed their
    relations and introduced the current legal regime that made accumulating extensive
    amounts of private property possible. This truth, however, is normally ignored
    in liberal and conservative accounts about how capitalism and competition are
    just “human nature”.


    Due to this widely accepted mythology, it is easy to equate capitalism with markets,
    a view that has been re-enforced in the past few decades by neoliberal policies
    within which markets have increasingly impacted public services negatively through
    privatisation. Today, capitalism is more and more driven by large corporations,
    powerful financial actors and platform unicorns such as Meta, Uber and Amazon.
    The goal of these companies is not to compete on the market, but rather to own
    it.


    Capitalism, however, is not the same thing as markets, which existed well before
    capitalism became the dominant mode of production. They are universal in recorded
    history going back as far as the origins of urban civilisation. Capitalism is
    more recent, and is usually imposed from above, mostly via the exercise of state
    power and the creation of legal regimes that prioritise private property (capital).
    Marx calls such precapitalist market-oriented relations of production “petty production”
    — when capital concentration has not yet proceeded beyond the limits of individual
    property. While private ownership of the means of production remains an essential
    precondition, some historians have stressed that petty production also relied
    on various forms of commons. In fact, one of the major events that brought forth
    capitalism in England was termed “the'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'enclosure of the commons”, in which land that was legally owned by the Crown
    but used by local peasants and vital to village life at the time, became subject
    to newly imposed restrictions by the nobility and wealthy landlords in the 1500s,
    more closely resembling the way we think of private property today. Many contemporary
    companies also rely on different commons, like open-source software, commonly
    held intellectual property with public institutions and the collective intelligence
    of workers.


    There are essentially two definitions of the commons. It can be used to signify
    a resource that is freely available like water, air or land, and at least before
    private property enforcement to prevent local populations from accessing land
    or water. Alternatively, as the work of Elinor Ostrom showed, it can also be seen
    as an institution. Ostrom was the first woman to win the Nobel Prize in Economics
    for her work on how types of communities have managed common resources like forests,
    fisheries or grazing without the need for governments or private companies. In
    contrast to the “tragedy of the commons”, to Ostrom, the commons are an alternative
    form of property to that of the market or state which permits collective governance
    of a resource system with some degree of success over a long period of time.


    The truth is that the story of the “tragedy of the commons”, commonly used to
    justify the need for capitalist markets and push for neoliberal economic policy,
    was one made up by the conservative American ecologist Garrett James Hardin. Hardin
    later retracted his original thesis in response to evidence of historical and
    existing commons, stating that “The Tragedy of the Unmanaged Common” would have
    been a better title, but the damage already been done. What is also problematic
