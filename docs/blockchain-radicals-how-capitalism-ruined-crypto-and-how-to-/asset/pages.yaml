    So, what exactly is an NFT? You may have already consumed many different pieces
    of media that try to explain it, but let’s first understand the concept of non-fungibility.
    Fungibility refers to the property of an asset being interchangeable with another
    asset of the same type. Money especially needs to have this property to be considered
    good money. For example, when you withdraw money from the ATM, you likely don’t
    mind that these aren’t the dollar bills you deposited. If you have five $1 bills,
    you can get one $5 bill and both arrangements would be equal to each other. Of
    course, this gets more complicated if for example you’re trying to launder money
    through cash and people know the exact serial numbers to look for on the bills,
    but let’s not complicate too much yet. But the property of fungibility can be
    applied to a lot of commodities broadly.


    As an example of non-fungibility, when you pick up your child from day care, you
    likely won’t accept it if they give you any random child back. This is because
    your child is non-fungible, they have a unique value which is not exchangeable.
    So, in short, a non-fungible token, or NFT, is a representation of a unique thing
    in the form of a token on a blockchain. Similar to the ERC-20 standard discussed
    in previous chapters, the thing that is represented through the ERC-721 token,
    what it means and how it’s valued, can take many different forms based on the
