    So while the cypherpunk had good reason to promote decentralisation of digital
    infrastructure to bake privacy into the Internet, this should be supplemented
    with the decentralisation of the ownership of private property itself, so that
    the people who actually work can democratically manage the economy and society
    together, rather than leaving it to the collection of (some not so) mini dictatorships
    we call corporations and their billionaire owners. Even if the term often is misappropriated,
    decentralisation is an imperative in the blockchain world, and this obligation
    has created space for other areas of centralisation to be questioned. One of the
    largest sources of centralisation in most people’s lives is their 9-to-5, or the
    place people spend forty or more hours per week.


    # Cooperatives: Decentralisation within an Economic Organisation


    Spurred by the need for remote work, COVID-19 caused working people to question
    the pre-pandemic habits around the spatial relationships between employee and
    employer. This is far from the first time the nature of work has been questioned.
    By the 1800s, capitalism had become the dominant mode of production in England,
    and joint-stock corporations, like the East India Company, accounted for at least
    half of the world’s trade. Due to the disproportionate increase in wealth for
    those owned the corporations versus those who worked in them, a movement to create
    an alternative form of organisation came through the work of Robert Owen, William
    King and the Rochdale Pioneers; the cooperative, or coop.


    The International Cooperative Alliance (ICA) defines coops as “peoplecentred enterprises
    owned, controlled and run by and for their members to realise their common economic,
    social, and cultural needs and aspirations”. While a standard corporate hierarchy
    can be pyramidal, with the stock'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'holders at the top making all the executive decisions and the workers below,
    in a worker cooperative structure, all workers own a share of the company and
    have a say and vote in the governance of the firm, with each worker having the
    same amount of votes. Cooperatives are to corporations what democracy is to a
    dictatorship. However, this is not the only type of cooperative. Consumer cooperatives
    are businesses that are owned and managed by the people who use their services.
    R.E.I. — which sells outdoor sporting equipment — is the largest consumer coop
    in the United States, and all credit unions are forms of financial coops.


    It’s been proposed that worker ownership could save small businesses under the
    threat of closure due to worsening economic conditions while also protecting the
    employees, to the likelihood of lower rates of internal inequality as workers
    decide jointly on rates of pay. For example, the Mondragon Corporation, based
    in the Basque region of Spain, is one of the largest and most successful cooperative
    enterprises. It is a federation of ninety-six worker coops employing more than
    81,000 people, and selling in more than 150 countries in four industries. Mondragon
    coops have a CEO-to-line worker pay, ranging from 6-to-1 to 9-to-1, compared to
    the European average of 129-to-1 and the US average of 339-to-1. Mondragon coops
    have also been less affected by economic downturns compared to standard hierarchical
    corporations.


    Another good example is Emilia-Romagna in Italy, a region which is known for having
    one of the highest quality of life indices and lowest rates of unemployment in
    the country, partially because coops make up 30% of the region’s GDP and involve
    two thirds of the population as members.3 In the United States even, there has
    also been a major increase in trailer parks converting into community-owned coops
    to provide alternatives to the encroachment of private equity-funded parks that
    seek to maximise rent fees and minimise investment investment into infrastructure.4
    Even the global financial system that was criticised by the creator of Bitcoin
    is facilitated by a coop.'
