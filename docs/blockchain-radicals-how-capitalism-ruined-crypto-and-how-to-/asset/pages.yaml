- pgno: 44
  md: 'As you may be able to tell, there are many different ways this kind of hashing
    function could be used. For the Bitcoin network, hashes are used for a “Proof
    of Work” (PoW), a method of cryptographic proof by which the prover proves to
    the verifiers that a certain computational effort was expended. It was first proposed
    as a way to prevent denial-of-service attacks by slowing down the speed that bad
    actors can flood online sites or services as well send spam email. However, it’s
    used as a way to ensure the security and validity of the P2P network of nodes
    and the digital ledger of bitcoin they track.


    The name for the nodes on the Bitcoin network that help upkeep the network’s security
    are commonly referred to as miners. Bitcoin miners however are not mining for
    gold, but for hashes in a cryptographic competition that earn them the right to
    add a block of bitcoin transactions to the Bitcoin blockchain, as well as some
    newly minted bitcoin cryptocurrency and the transaction fees included in all of
    the transactions in the block as a reward. The reward serves as an incentivisation
    for miners to continue the job of securing the network.


    As bitcoin transactions are sent to the network (Alice sends 1 bitcoin to Bob),
    they are used as inputs for a hash function. The “block” in blockchain refers
    to a group of transactions that are organised by a miner to be added to the ledger.
    Miners compete by inputting as many bitcoin transactions as possible (up to two
    megabytes), along with the hash of the previous block of transactions added, and
    a random number called a “nonce”, into a hashing function to create an output
    with enough preceding zeros. Since a property of the hashing function is that
    the output of the function is impossible to predict until you process the inputs,
    the more preceding zeros that are required in the output to win, the more difficult
    the competition becomes. The difficulty of the problem is adjusted regularly to
    ensure that each block is added at approximately every ten minutes. Since the
    competition is purely based on probability and a miner’s ability to exert'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'computational work (or commonly referred to as hashing power), the more energy
    a miner is able to exert, the higher chances they have at winning the competition
    at each block interval until the point they are not profitable many times due
    to the increasing energy costs incurred^8 So the creation of a winning hash with
    appropriate inputs acts as a proof of work that bitcoin miners need to show to
    the cryptographic competition. Proof of work is also commonly referred to as the
    consensus mechanism of the network since it is how nodes are part of the Bitcoin
    protocol come to consensus about the current state of the Bitcoin ledger.


    Problem: Can you make a hash that includes recent bitcoin transactions, a hash
    of the previous block, a nonce, and begins with at least 4 zeros?


    Reward: Newly minted bitcoin


    ![](img/220602ca4af0f7c12ded8d4ba94bd5ab_45_0.png)


    The “chain” part of the blockchain is the pattern of including the winning hash
    of the previous block in newly added blocks to the ledger. By repeating this pattern,
    the protocol creates a publicly verifiable record of the'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'ledger shows the relative chronological order of transactions made. You can
    think of a blockchain as a shared database like a Google Sheet (but without Google)
    that is hosted redundantly by each node in the network, however, since we''re
    using a P2P architecture as opposed to a generalised client-server architecture,
    Bitcoin uses this proof of work competition as a way to solve the double spending
