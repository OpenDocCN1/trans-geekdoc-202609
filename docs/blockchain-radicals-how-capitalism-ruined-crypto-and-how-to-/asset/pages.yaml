    Koomey, who has now been recognised as one of the leading experts in understanding
    the environmental effects of information technology and measuring the energy use
    associated with it, co-wrote a paper titled “Sorry, Wrong Number: The Use and
    Misuse of Numerical Facts in Analysis and Media Reporting of Energy Issues”. It
    covered four different incidences where incorrect data about energy use and consumption
