- pgno: 116
  md: 'recognise the results.12 There is also a question of how courts disagree with
    a Kleros judgement will enforce their decision on the parties. Only time will
    tell how legal courts will interpret disputes handled through Kleros, but it is
    unlikely to be the case that all will agree.


    Putting that aside, these examples, and the many more to come, show some of the
    advantages of using smart contracts. Smart contracts give predictability and confidence
    when using templates that are tried and audited for bugs. They can automate many
    of the same functions of various types of agreements that people are likely to
    make with each other without involving more parties. They do not need to try to
    foresee every single possible outcome and implement structures that take into
