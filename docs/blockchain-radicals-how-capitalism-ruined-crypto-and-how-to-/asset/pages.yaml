  md: 'essentially the same as DALL-E 2 for voices. Herndon has been experimenting
    with these technologies for long enough that she has developed her own AI model
    that can replicate the sound of her own voice in real time, no matter who is singing
    into the microphone. One of her latest projects is called Holly+, a custom voice
    instrument that allows anyone to upload polyphonic audio and receive a download
