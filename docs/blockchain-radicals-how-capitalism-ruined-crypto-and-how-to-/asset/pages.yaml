    would no longer have the funds. A hard fork is when new rules or history are introduced
    into the blockchain code for nodes to follow that are not compatible with the
    rules of the blockchain’s previous code. This can result in the blockchain splitting
    into two networks, one operates with the old rules and history and one which operates
    with the new. After much debate between developers, node operators and exchanges,
    the hard fork was implemented and Ethereum’s history was effectively rewound before
    the attack, and all of the ether were reallocated to another smart contract so
    investors could withdraw their funds.


    To put mildly, this was a split in the face to those who truly believed in the
    immutability of smart contracts and that code was law, creating a rift in the
    community. The more die-hard libertarian believers in code being law stuck with
    the old chain, now called Ethereum Classic. However, the choice to hard fork forcibly
    proved its legitimacy and the new Ethereum chain has vastly performed Ethereum
    Classic, which has largely become a “zombie chain” with little activity and interest.


    This seminal event exposes how smart contracts are deterministic, but only up
    to a point, and that point has a lot to do with what humans collectively decide
    is legitimate or not. When bugs are found in smart contracts, just like any other
