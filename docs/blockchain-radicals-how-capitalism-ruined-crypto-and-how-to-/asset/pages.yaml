    the NFT. It''s a way I''ve found to give myself more resilience from platform
    risk while also giving fans an alternative to the tools I often talk about my
    show and in my writing.


    While hypemen try to onboard new people into NFTs using limiting mental models
    of speculating on art, digital scarcity and the Metaverse, and gatekeepers criticise
    these very incorrect representations of what NFTs are as a reason to stay away
    from them, it''s clear that the story is not so simple. Built of a resilient blockchain
    paired with crypto protocols as hyperstructures, we can begin to see that, while
    influenced by dystopian ideas about the Metaverse from Snow Crash, there are positive
