    # A Recap of Proof of Work


    As you may recall in the first chapters, Bitcoin uses a consensus mechanism called
    proof of work (PoW) in order to get nodes on the Bitcoin network to agree on the
    current state of the Bitcoin ledger. To quickly recap, the consensus mechanism
    is necessary in order to solve the double spend problem, which states that for
    a digital currency without a centralised authority to be possible, someone cannot
    be able to spend their funds more than once. The first step in solving the problem
    is to build a decentralised network, which this poses the Byzantine general’s
    problem, which is a generic problem in distributed computing where a concerted
    strategy is needed to avoid catastrophic failure of the system, but some of its
    actors are unreliable. The name of the problem is taken from an analogy in which
    a group of generals and their armies are surrounding an enemy fort and in order
    to successfully take it, they must coordinate together such that all of them attack
    at the same time. There is a chance that some of the generals are traitors and
    may lie about attacking the fort. For a peer-to-peer network like a blockchain,
    this problem is solved by all of the nodes following the specific rules of the
    protocol to come to agreement in a coordinated fashion.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'In the protocol, miners compete with each other to solve a difficult provably
    random maths problem using cryptography. Miners are essentially participating
    in a game of probability where their odds of winning increase if they can make
    new guesses faster than others. The game is played through the use of cryptographic
    hashes. A hash is the output of a hash function that has received a string of
    data as an input. A hash function is one-directional and its hash output is random
    and always the same size. It is always impossible to guess what the input of a
    hash output would be and similar inputs create different outputs.


    In Bitcoin''s PoW, miners are competing to create a hash starting with some number
    of zeros with 1) the inputs of all transactions recently sent to the network,
    2) the hash created to make the previous block, and 3) a random number called
    a nonce. If they guess first, they can “mine” the next block of transactions to
    add to the blockchain. Miners are incentivised to solve this problem because they
    also newly created bitcoins. Winning miners are also given the transaction fees
    by people to get their transaction added to the new block. This means the more
    you pay for a transaction, the more likely you are to get your transaction verified
    by a miner sooner.


    On the surface, hashing is a useful way to hide information, but in PoW, Bitcoin
    makes an unholy alliance between cryptographic hashing and free market competition.
    Since 1 and 2 are inputs that cannot be changed, the only way a miner can make
    new guesses is by changing 3, the nonce. Combined with the logic of profit-seeking
    under capitalism, this means that miners are also incentivised to use specialised
    hardware that is really good at doing one, guessing. The faster you can guess,
    the more likely you are to create a hash with the appropriate amount of zeros
    at the beginning. The more zeros needed, the more difficult the competition is,
    which is adjusted so that a block is created around every ten minutes. This in
    turn creates an arms race for the fastest guessing machine, and the more'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'have, the greater your chances of making the right hash and earning a profit.
    On top of that, these machines use a considerable amount of energy.


    How quickly a miner is able to make new guesses for the winning hash is called
    its hashing power. Therefore hashing power is a direct way to quantify and compare
    the strengths of different miners. The total hashing power of all the miners combined
    also gives us a relative idea of how secure the network is from direct attacks.
    The original logic behind the PoW algorithm designed by Satoshi was to ensure
    the safety of the system from bad actors that wanted to take the whole thing down
    and to make it impossible to cheat. It should be very difficult for one mining
    entity to reach over 50% of the total hashing power as that would give them enough
    power over the network to corrupt the system.


    It’s important to note that Bitcoin’s PoW was the first successful attempt at
    creating a Byzantine fault-tolerant algorithm for a digital currency that was
    built on a decentralised network. Since its inception, there have been very few
    modifications to the protocol, in part because many in the bitcoin maximalist
