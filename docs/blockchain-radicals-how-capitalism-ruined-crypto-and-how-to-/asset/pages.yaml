- pgno: 17
  md: '# INTRODUCTION

    FORGING A NEW MAP OF THE CRYPTO TERRITORY


    Writing has nothing to do with meaning. It has to do with land surveying and cartography,
    including the mapping of countries yet to come.


    > — Gilles Deleuze


    In early 2022, truckers protested against vaccine mandates for crossing the US
    border in Ottawa, the capital of Canada. This “Freedom Convoy” campaign became
    later a protest against general COVID-19 restrictions. In response to several
    crowdfunding campaigns that raised millions of dollars from Canadians, and problematically,
    Americans associated with far-right political groups, Canada’s Prime Minister
    Justin Trudeau invoked the 1988 Emergencies Act for ten days. This declared that
    the government could freeze the bank and payment service provider accounts of
    individuals suspected of being part of the convoy without needing to go through
    the court system. This also included platforms that used cryptocurrencies and
    led to a decree by the Canadian government that specific cryptocurrency firms
    had to give information about any assets being used in the campaign.


    A month or so later, a week into the Russian invasion of Ukraine, longterm Putin
    foe Pussy Riot singer Nadya Tolokonnikova started a blockchain-enabled DAO (decentralised
    autonomous organisation) and'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'used the much-derided medium of NFTs to raise money for the Ukrainian resistance,
    announcing on Twitter that blockchain was an important part of the fight against
    dictators. In Kyiv meanwhile, the besieged government also made public several
    cryptocurrency wallets that supporters could donate to. By the end of February
    2022, they had raised over $60 million in bitcoin, ether and other cryptocurrencies,
    spending the funds on fuel, food and other supplies like bulletproof vests and
    night-vision goggles for soldiers. Alex Bonnyakov, the deputy minister of the
    Ministry of Digital Transformation, which facilitated the spending of the cryptocurrency,
    stated that cryptocurrency “is easier, not complicated, transparent, and faster
    in comparison to a SWIFT transaction, which could take more than a day.


    Suddenly crypto, once a shorthand for cryptography and now also for cryptocurrencies,
    was, for the first time since Occupy Wall Street and the financial blockade of
    WikiLeaks occupying centre-stage in a political and economic crisis. However,
    while these developments are headline-grabbing and not unambiguously politically
    progressive, it is also important not to overlook the myriad ways in which cryptocurrency
    is also being used by others experiencing state repression, for example in Palestine
    and elsewhere in countries with economic sanctions, or by sex workers who are
    constantly in a fight against financial service providers due to the legal grey
    area in which they work. For many who don’t have the privilege of proper financial
    services, turning to cryptocurrency has been one of their lifelines.


    Why has blockchain been greeted with such hostility and scepticism by much of
    the left? One of the earliest critiques of Bitcoin, the first and most famous
    of the cryptocurrencies, is David Golumbia’s The Politics of Bitcoin: Software
    as Right-Wing Extremism. His argument was largely that Bitcoin’s right-libertarian
    origins meant it was predisposed to having utility and application only for a
    right-wing agenda (if any at all). This has continued with left-wing publications
    like Jacob, which in 2022 published several articles related to crypto, with nearly
    all of them'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'concluding that cryptocurrency is a scam, a Ponzi scheme and something that
    the left should stay away from. A look through many of the claims made and the
    sources cited in these articles shows that few of the writers properly understood
    many of the basic technical principles and workings of the technology, making
    their claims weak for people who are actually working on the infrastructure they
    are critiquing. It seems that their audience is not those who are closest to being
    able to answer their critiques (i.e., people working in the industry), but instead
    others who are jockeying for position within what might be termed “Critique Economy,”
    a largely discursive and academic mini-industry that seems to have consumed much
    of the left’s energy late, as its actual institutional power has declined.


    Blockchain is not a simple technology, so while technical inaccuracies can be
    forgiven, what is disturbing about the articles written by incorrect but otherwise
    intelligent journalists and academics are how their claims inadvertently erase
    the crypto industry. By taking the socio-political descriptions of what cryptocurrencies
    or blockchains are at value, these critics inadvertently doing the job of the
    crypto-marketers and hypemen they despise. At the same time, they also try to
    en themselves as gatekeepers of what constitutes appropriate left-wing endeavours
    and resources. The truth is that crypto-markers use right-wing libertarian rhetoric
    in order to attract a particular audience (whether or not would describe themselves
    as libertarian is beside the point) because it is also one that is willing to
    part with their government-backed money. This is not meant to disparage that audience
    — the marketing is designed to tap into the disillusionment and sense of disenfranchisement
    that many people feel, and especially the idea that there is something wrong with
    the monetary system. This is twisted into the adoption of a right-wing politics
    that has gained in popularity and become very profitable for some. In the past
    decade or two, there has been a process of implicit and explicit association'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'that has led many believe that anything cryptrelated is right-wing and libertarian,
    this attitude adopted and promoted by many of its figureheads.


    What the left-wing Critique Economy failed to grasp, however, is that this has
    all been intentional as a way to keep the left out of the sphere of influence,
    limiting its capacity to decide on the direction that this new technological space
    should take. It was a poisoning of the well that the gatekeepers, writing scratching
    pieces as part of the Critique Economy, have continued to add more poison to.
    They inadvertently re-enforced the legitimacy of an incorrect framework created
    by the crypto industry, and thus provided a poor map for helping others on the
    left navigate this space. Responses to crypto tend to be either excessively boosterish
    or completely skeptical, but this book argues that blockchains can both support
    existing political strategies on the left and open up new ones — novel strategies
    that blockchains make visible, legible or possible.


    A typical writer of the Critique Economy attacks “techno-determinism”, the idea
    that progress in “technology” is the key to society’s development as well as its
    cultural values, making the main agent of societal change. Optimistic techno-determinism
    is usually what is called upon by Silicon Valley elites to justify pushing more
    and more technological solutions, with the prescriptions that “improving” technology
    helps progress society and therefore leads to more progressive outcomes. Sometimes
    it is referred to as “techno-utopianism” or “the Californianian Ideology”, a term
    coined in an essay by Richard Barbrook and Andy Cameron that claims its origins
    can be traced to the philosophy of the right-libertarian author Ayn Rand. Pessimistic
    techno-determinism as a counterclaim has emerged largely on the left after promises
    about technology leading us to more fulfilled and prosperous lives have repeatedly
    failed. This can more broadly be generalised as the feeling that, if not all,
    new technology that has come about can only be used in ways that are exploitative
    or against your goals if you’re on the left of the political spectrum.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'This book is not techno-deterministic in either direction, and is instead meant
    to recognise the positives and the negatives of this emerging technology, an approach
    needed in order to make important assessments as to what this technology feasibly
    allow us to do that will be beneficial to society as a whole and not just those
    that control the means of technological “innovation”. Instead of viewing technology
    as deterministic, we can see it as probabilistic, recognizing that the current
    situation we''re in significantly favours the haves over the have-nots, but also
    understanding that it doesn''t have to be this way — the left has an opportunity
    to alter the status quo, perhaps with the very technology supporting it. The advancement
    of new technology is not the only agent for political change, but we cannot separate
    it away neatly from our social relations, especially in a world where many of
    these social relations are mediated by the advanced and complex infrastructure
    that makes up the Internet. Ultimately, social movements are what lead to political
    change, but technology has always been important for movements — without the printing
    press, many important ideas would never have been spread. The advance of technology
    creates the material conditions for what is possible, but it''s important for
    people seeking social justice to recognise their own agency in influencing what
    is done with it. How much agency is recognised and how it is used is what the
    scales for or against the public benefit. I would name this position and framework
    as “techno-probabilism”.


    Techno-probabilism is a framework for thinking critically about the potential
    futures enabled by a particular technology given certain conditions and uncertainties.
    It avoids both optimistic and pessimistic techno determinism by attempting to
    recognise the full spectrum of practical possibility. It is a way of thinking
    about technology that is more open-ended and exploratory. It allows for space
    to think about the potential conditions that would need to be had in order to
    steer us towards particular futures. It understands that the same technology built
    with the intention to be used in'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'one application or one political ideology is often not loyal to its creators
    and can be used for multiple other situations. This is especially the case for
    cryptocurrency and blockchains as will be covered throughout the book.


    By applying a progressive political view to this framework on the technological
    space inhabited by blockchain and cryptocurrencies, we can begin to develop a
    strategy that recognises the potential of technology to enable collective action,
    while also taking into account the political conditions and risks that accompany
    technological development. It is a strategic framework that gives us permission
    to reappropriate technology developed with capital in mind to sustain collective
    liberation, while also being aware of the need for strategic duality in order
    to navigate the contradictions of a globalised, technologised political economy.


    New technology has always been a political consideration, from new smithing techniques
    for creating stronger metals for swords, to companies implementing systems that
    make half their workforce redundant, to state-issued identity cards. There is
    a growing likelihood that cryptocurrencies and blockchains will creep into the
    mainstream, whether or not the values of cryptocurrencies ever reach the unrealistically
    high levels their hypemen predict on social media. If that''s the case, it''s
    important to have an appropriate map of the territory in order to create strategies
    and tactics that heighten the probability for desired outcomes.


    This book will demonstrate that crypto and blockchain have played a much more
    complex role in attacking and circumventing traditional power structures in ways
    which are amenable to a number of ostensibly contradictory political projects.
    While much of the focus is on it since then has been from either boosters or sceptics,
    its emergent qualities and the ways in which people have been actively engaging
    with it in ways that would be interesting for the left is largely the focus of
    this book. The left sceptics around crypto and blockchain have been by far the
    most vocal and strident voices, often drowning out more tentative and exploratory'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'practitioners, artists, activists and programmers. I am not claiming that blockchain
    is a panacea, but the insistence that you need not investigate it yourself because
    the relevant academics have already done that for you and have decided it is fruitless
    another part of the set of presumptions this book hopes to work against. Based
    on my experience of working in this space in various capacities and talking to
    precisely those artists, activists and programmers working within the blockchain
    space who are committed to an egalitarian politics, we need to have a fuller and
    clearer understanding of the strengths and limitations of blockchain.


    I would argue it is precisely blockchain''s emergent properties, its newness and
    plasticity, and the ways it might be imaginatively developed, that is what makes
    it so exciting and troubling to many. Of course nothing that develops out of and
    under capitalism is going to avoiding hucksterism, scams, volatility, exploitation
    and straight criminality. Unfortunately, there is no pure space in which the revolution
    can be organised, only a set of conditions of no one''s choosing that have to
    be grappled with. While there were constructive reactions to the rise of the Internet,
    like 1990s cyberfeminism and the left blogosphere around Mark Fisher''s k-punk,
    the larger left does not have the time to make the same mistakes it made with
    the Internet and again with social media, by ignoring it until a crisis like the
    2008 recession occurs. When just a couple of decades ago left-wing institutions
    and groups were deriding the Internet as just another bourgeois distraction, today
    social media is undoubtedly essential for organising and collective action, yet
    relies on platforms owned by some of the most powerful tech companies in the world.
    While there were groups on the left fighting over the political terrain of early
    cyberspace, their successes were limited. The left needs to be engaged in building
    its technological infrastructure if it wants to stay resilient in the future.


    The blockchain space is fraught with all kinds of questionable practices a messy,
    complicated and developing territory pulling in numerous'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'directions. The questionable or even outright illegality that is associated
    with cryptocurrency can be particularly deeply offputting to many, especially
    left-liberal commentators, who have trust in dominant institutions and want a
    measured and measurable progress within well-defined and narrow parameters. But
    it is from the potentially disturbing foment of the blockchain space, I would
    argue that the new is likely to emerge, partly because now that the more conventional
    electoral and parliamentary models of the attempt to push toward socialism have
    been thwarted (Sanders in the US and Corbyn in the UK, to give the two most pertinent
    examples for Anglophone readers), so the energy that animated those concerns will
    flow elsewhere. Into other militant forms of worker organising no doubt, but also,
    given the centrality of online life in the twenty-first century, into digital
    networks that are attempting to create more equitable and open forms of mutualism,
    socialism and interrelation. What''s is that the impulses toward socialism, communism,
    economic democracy (call what you will) develop in lockstep with capital, wrestling
    it all the way. The moment blockchain is a new frontier and it''s there that we
    must also contest territory, rather than merely cede it as always-already belonging
    to the right.


    # The Map Is Not the Territory


    In the 1930s, the Polish-American scientist and philosopher Alfred Korzyski made
    the remark, “the map is not the territory”, or that abstraction derived from a
    thing is different from the thing itself. His view was that many people confuse
    conceptual models of reality with reality. For example, the map of Peru’s geography
    is still very different from the actual geography of Peru. The symbols used on
    the map to denote where the Andes mountains are are helpful in limited ways, unless
    the map zooms in closer and contains more details, but even then, it will differ
    from actually being in the Andes. This is not to say that conceptual models are
    useless, but that they need to be paired with critical thinking because, as another'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'aphorism goes, “all models are wrong, but some are useful”. While these observations
    are more common to academic circles for semantics, linguistics or statistics,
    among other fields, they are also important for understanding politics, including
    the politics of technology.


    Gilles Deleuze was a French post-Marxist philosopher born in 1925, who witnessed
    the civil unrest throughout France in May 1968 that saw the largest strike ever
    attempted in the country''s history, as decentralised wildcat strikes popped up
    in support of ongoing protests against capitalism, consumerism and imperialism.
    While there were significant gains made by workers once the Gaullist government
    realised that increased police violence was making the situation worse, the call
    for revolution by socialists and communists didn''t succeed. No Western country
    had come so close to a political revolution in the past several decades. In the
    midst of this era, Deleuze published his magnum opus, Difference and Repetition,
    a critique of representational thinking which would heavily influence his two
    most popular books, co-written with Félix Guattari: Anti-Oedipus and A Thousand
    Plateau


    Deleuze’s work is notoriously difficult to understand, but has been a significant
    influence on me in trying to better understand crypto while writing this book.
    The most fundamental part of his critique of representational thinking, or what
    is also commonly referred to as “skeomorphic thinking” by others, is the framework
    I use for the structure of this book. To understand Deleuze’s critique of representational
    thinking, we can turn to a video made by the popular YouTube video essay Jonas
    Čika.


    To explain Deleuze’s critique of representational thinking, Čika uses the example
    of the drum machine. The drum machine was originally created as a tool for musicians
    to use in a situation where they may not have a drummer for their musical ensemble.
    From the viewpoint of representational thinking, the drum machine is simply a
    lesser version of an'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'drummer with a real drum set, a representation that does not match the ideal.
    Representational thinking is thus arborescent, or similar to a tree, with branches
    (representations) stemming from the base (the ideal drummer and drum set). This
    type of thinking, however, is extremely limiting for understanding the drum machine
    and does not map well onto the ways in which drum machines have actually been
    deployed.


    Instead of limiting the drum machine to this representation, musicians ended pushing
    the drum machine to do things that a drummer with a drum could never do, thus
    starting the creation of new genres of music. This new box of repeated synthetic
    sounds became the basis of not just the Cambrian explosion of electronic music
    genres, but is now used to complement existing genres of music. These first experimental
    musicians were not limiting themselves because they were not asking what the drum
    machine represents, but instead asking “What can the drum machine do?” Deleuze
    calls this a form of “rhizomatic thinking”. You can think of a rhizome as a network
    that has a clear centre, and it is by thinking rhizatically that we are able to
    understand the possibilities in present that allow for the creation of the new,
    uninhibited by representations.


    For Deleuze, many people are trapped in representational ways of thinking that
    are limiting their understanding of the world. These representations can be seen
    as tracings, or stickers that we try to put on top of the world to make it easier
    to understand, even if they are ultimately incorrect. My argument in this book
    is that representational thinking is also rampant in the crypto industry as a
    way to market crypto to a large audience quickly, as well as in the minds of the
    critics of crypto. Discussions and debates between hypemen and gatekeepers of
    crypto tend to happen over a map which is covered in tracings derived from representational
    thinking, creating unresolvable tensions because neither is talking about the
    actual territory.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'This is obviously problematic if the left wants to be able to respond to the
    changes being brought on by the introduction of crypto and blockchains. The left
    cannot be using an incorrect map, or a conceptual model, to derive a response.
    The left must also be cognizant that whatever model or mapping is created will
    be wrong or limited to some extent. The point is to try to make one which is at
    least useful. The book therefore asks readers to not ask what crypto represents,
    but instead ask, “What can crypto do?”, without too much concern for the current
    map of the territory they may have in their head.


    The purpose of this book is to provide a more useful map of the crypto territory
    to help you and the social movement you may be a part of navigate it safely. By
    understanding the way past social movements from the right and the left have influenced
    the trajectory of crypto, and by making new connections that are not made in mainstream
    discourse as it exists at the time of writing, a new map can be drawn to lead
    us into new futures. One that is neither optimistic nor utopian about a future
    with crypto, nor deterministically pessimistic. Another important consideration
    to keep in mind is that the map drawn in this book is just a snapshot of a particular
    moment in time in a space that is rapidly evolving. The projects mentioned in
    this book should not be considered an endorsement or financial advice (I am not
    a good person to listen to that) and are all likely to be different (or bankrupt)
    to varying degrees by the time you read this book. They should only be seen as
    examples for helping us draw a more useful and rhizomatic map.


    # Collective Emergence


    Using Deleuze’s framework for his critique of representational thinking, I go
    through various different common representational models used by crypto hypemen
    and describe why they are wrong, but why just because they are wrong does not
    mean that crypto is useless for the left, as'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'many of its critics would you believe. This book is separated into three sections
    that move from the worst to least bad form of representational thinking common
    in the crypto world. In the first section we will explore the idea of crypto as
    money, which was the original idea that propelled Bitcoin into existence. Taking
    a critical analysis of these claims, it is not hard to see that bitcoin, and cryptocurrency
    generally, is not money. However, the fact that it is not money can be a good
    thing, especially for its radical political potential. This is very fact, along
    with its properties that cryptocurrencies share with money, allows cryptocurrency
    to be used for circumventing financial blockades by states or banks in various
    contexts through counter trade, as has been the case for WikiLeaks and SciHub
    among others. The flexibility of the system also allows us to explore alternative
    democratic monetary systems that would otherwise not be possible and that defy
    the "digital metal" narratives embraced by rightwing libertarian hypemen.


    In the second section we explore the next common representation, which is crypto
    as finance. Starting with a dive into Ethereum, and its innovative creation of
    smart contracts, we see how this attempt at cryptographically enforced contracts
    written in computer code do not actually prove the common dictum from the crypto
    hype that "code is law". The affordances of smart contracts are however important
    for the functioning of the very quickly growing Decentralised Finance (DeFi) space
    in which many financial products that normally only be available to those on Wall
    Street are available to anyone through a blockchain. While much of this space
    is a reformulation of many of the most capitalistic financial products, representational
    thinking can limit our abilities to look into the details of these mechanisms
    and discover the potentials of smart contracts and crypto tokens. The differences
    between the traditional financial system and DeFi are important to understand
    for developing strategies that subvert financial systems for different ends'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'profit. We will also cover the phenomena of non-fungible tokens (NFTs) and
    how, similar to many DeFi mechanisms, they are commonly misunderstood and can
    be repurposed for more collective ends.


    The third section will take a critical look at the least worst representational
    model used to understand this space, which is crypto as a coordination. While
    many of the most well-meaning people in the crypto space like to use the metaphor
    of the monetary system and economy as a coordination system, this type of thinking
    ends up overlooking the importance of power relationships. In this section we
    will map out the similarities and differences between decentralised autonomous
