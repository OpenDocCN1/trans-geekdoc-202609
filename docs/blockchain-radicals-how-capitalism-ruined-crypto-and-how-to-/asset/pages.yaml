    One of Senator Warren''s campaign slogans in the 2020 Democratic primaries was
    “capitalism without rules is theft”. One could infer from this slogan that capitalism
    is thus theft with rules. Progressive capitalism may be more desirable over a
    less regulated capitalism, but it doesn''t solve the inherent contradictions of
    capitalism itself (and neither does crypto or any similar technology, for that).
    Part of the solution to limiting potential damage done to everyday people could
    be by increasing regulation on shadow banking, but at the same time this changes
    the rules of theft.


    Regulating shadow banking institutions in a way similar to that of traditional
    banks has been discussed for a long time, with little to nothing to show for it.
    This is largely because the US has a toxic and dependent relationship with shadow
    banking. The shadow banking system is crucial to keep the economy moving and stimulated
    when more regulated, traditional banks can''t service everyone. At the same time,
    shadow banking is one of the loopholes used within the traditional financial system
    by wealthy elites to avoid paying taxes and preserve their wealth. This dependency
    makes federal insurance a double-edged sword, treading the line of limiting systemic
    risk and moral hazard. The tendency for the state to bail out financial institutions
    intentionally encourages risk-taking, but also increases the probability of later
    panics and crashes, leading the state to have to undertake a bailout again.


    Within the current paradigm, the cycle won''t end. While the right may blame the
    spending of states for economic crashes, it looks more like states understand
    who the ones with the real power are and create policies that favour them, leading
    to greater financialisation. While shadow banking'
  merge: -1
