- pgno: 179
  md: '# SECTION 3

    CRYPTO AS COORDINATION


    The least problematic representational model used to understand this space. Comparing
    crypto to a system for coordination has recently become popular as interest has
    grown in applications for blockchains that are not purely financial. Many already
    see money and finance as means to coordinate in the modern economy, with blockchains
    now able to complement or provide alternatives to legacy systems. Through the
    affordances of blockchains, technologists and artists have become interested in
    blockchain-enabled decentralised organisation like DAOs, as well as traditional
    forms of decentralised organisations like cooperatives. A meta-critique of the
    status quo of crypto systems has led to the burgeoning Regenerative Finance (ReFi)
    movement, which is looking to combat the climate crisis through alternative financial
    systems that attempt to account for environmental externalities. While many of
    the most well-meaning people in the crypto space like to use the coordination
    metaphor, it commonly overlooks the importance of power relationships embedded
    in these systems. If those who are believers in crypto as a technology that can
    improve'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'the world for the better are serious, then it''s not just about coordination
    but being able to enact change. This means engaging in politics and using the
    technology to not only enhance democratic systems, but also to enable forms of
    political resistance when inevitable pushback comes from those who want to keep
    the sinking ship of the status quo afloat. Only then can one be considered a Blockchain
    Radical.


    OceanofPDF.com'
