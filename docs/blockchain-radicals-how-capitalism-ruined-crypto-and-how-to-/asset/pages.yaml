  md: '# GLOSSARY


    # Bitcoin


    The first cryptocurrency created in 2009 by an unidentified person or group of
    people only known as Satoshi Nakamoto in online forums. The underlying technology
    that facilitated its function later became known as a blockchain and has been
    modified for new cryptocurrencies ever since.


    # Blockchain


    A specific type of distributed ledger technology in which all nodes (computers)
    of the network hold a copy of the shared database (commonly referred to as the
    ledger) and information is stored in blocks of data (much of its transactions
    of cryptocurrency) created at certain variable time intervals (block time) using
    a consensus mechanism for all of the nodes in the network to come to agreement
    in a “decentralized” fashion without relying on a centralized authority. The resilience
    of the system usually relies on some amount of economic incentives for node operators
    that secure the network. Blockchains are one of, if not the only, system to solve
    the “double-spending problem”, which states the difficulty of unique objects with
    scarcity like money in a digital space. It serves as the foundation for how most
    cryptocurrencies, like Bitcoin and Ethereum, work, but some cryptocurrencies don’t
    use a blockchain.'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'Some like to explain a blockchain as a P2P digital ledger kept by all nodes
    in the network that is specifically for making financial transactions with cryptocurrency.
    Others will prefer to think of a blockchain as a shared/collective computer for
    general computation, especially if the blockchain has smart contract functionality.
    How shared that computer (the blockchain) can be debated, depending on the transaction
    costs, block availability and other factors. While the first example of a blockchain
    was Bitcoin, which explicitly wanted to make a form of digital cash without a
    central authority to administer it, it is debatable whether that has been achieved
    and the potential uses for blockchains have moved beyond that original goal.


    There are two main types of blockchains, public and private. Public blockchains
    allow for anyone to set up a node to take part in the upkeep of the network and
    include most cryptocurrencies that can be purchased on exchanges. To take part
    in a private blockchain, one needs to be invited into the network and is much
    much more than corporate blockchain solutions. Many believe that private blockchains
    are in fact not blockchain because they do not reach consensus in a “decentralized”
    manner.


    # Blockchain Radical


    Someone who believes in the transformative potential of blockchain technologies
    to enable new and positive forms of social relations is frustrated and dissatisfied
    by the current crypto status for its greed, deception and often its stupidity.
    They understand that the status quo exists because marketers and hypemen are stuck
    in dangerous representational modes of thinking that fail to recognise the centralizing
    aspects of capitalism, thus leading to what has happened in the crypto space so
    far. They are therefore interested in pursuing and building out with fundamentally
    different models in mind that don’t fit within a capitalist paradigm, acknowledging
    the political nature of such an endeavour. They'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'have the unfortunate burden of needing to push back against both crypto hypemen
    and gatekeepers.


    # Capital


    Often incorrectly thought of as being synonymous with money or commodities, capital
    is a relationship of production that encourages circuits of accumulation of wealth
    which can be in the form of money or other assets. Capital is a control system
    for moving labour towards one endeavour or another, with feedback loops that intensify
    its position of power over labour.


    # Capitalism


    An economic system evolving out of the feudal system that came before, it is characterised
    by a few private individuals (capitalists), rather than the state or government,
    owning and controlling the means of production and distribution of goods and services
    through a legal system of private property rights. The main type of work that
    most live under capitalism take part in is wage-labour, in which a capitalist,
    often through a company, hires a worker to perform a job in which the capitalist
    makes more money than the worker is paid. The difference is often referred to
    as profit. In this way, one economic class systematically exploits the other in
    order to continue competing in capitalist markets against others in the same class,
    or other capitalists. It is the dominant mode of production in the world today
    and has led to a myriad of innovations along with systemic inequities with help
    from the state in its development.


    # Centralised Exchange (CEX)'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'The most common way for people to be first onboarded into having some amount
    of cryptocurrency is through centralised exchanges like Coinbase, Binance, etc.
    which are companies that facilitate the exchange of cryptocurrencies for nationstate
    money. By having cryptocurrency on a centralised exchange, you are not actually
    owning what you may have purchased, since the CEX is acting as the custodian of
    your crypto assets. They are also usually required to have your personal information
    in order to comply with KYC and AML regulations, similar to many other financial
    institutions. They are generalised choke-points for imposing regulation by states.


    # Consensus Mechanism


    The protocol/method in which computers that take part in a distributed database
    like a blockchain are able to reach to an agreement on the current state of the
    database. It can be seen as the pre-determined set of rules that nodes in the
    blockchain network follow, showing that although blockchains may use decentralized
    P2P infrastructure, they are logically centralized through consensus mechanism
    protocols. There are many different types and the decisions on which are chosen
    are highly consequential in the development of that blockchain.


    # Crypto


    Since the advent of bitcoin and cryptocurrency, the term has become the colloquial
    term for anything related to cryptocurrency, although previously it largely referred
    to the field of cryptography which also heavily influenced the creation of cryptocurrencies.
    Cryptographers who dislike cryptocurrency are mad about this.


    # Cryptocurrency'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'A digital currency that doesn''t rely on a bank or government for it to function,
    usually thanks to a blockchain or some other DLT. They can be used as a medium
    of exchange between parties, but have most commonly used as vehicles for speculation.
    A cryptocurrency can refer to one that is native to a blockchain or a token created
    through a smart contract.


    # Cryptography


    A study and practice of secure and private communications under the threat of
    attackers in which, largely through the use of encryption, only the intended receiver
    can know the contents of a message. It has become extremely important in modern
    warfare to protect secrets from opposing militaries and for creating secured networks
    over the Internet. The field of study, especially when applied to the internet,
    leverages many advanced mathematical theories in order to hide messages.


    # Decentralised Application (Dapp)


    Commonly referred to as a dapp, it is an application (on phone, web, etc.) which
    is built on top of a blockchain using smart contracts in the backend. Dapps that
    are in production sometimes use non-blockchain-related technologies as well to
    function. Depending on the design of the smart contracts, the dapp can be centralised
    through control of the smart contracts embedded in the code, they can also be
    created to where no one controls them, making the smart contracts a type of immutable
    permissionless infrastructure. Many frontends could theoretically be built for
    any backend made of smart contracts, which is different than normal applications
    in which an entity normally owns the back and frontends.


    # Decentralised Autonomous Organization (DAO)'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'Commonly referred to as a DAO, it is an ever-changing term for an organization
    using smart contracts to facilitate the governance of itself. It is sometimes
    simply defined as an online community with a multisignature wallet as a joint
    bank account, but this is contested by many as people have different ideas about
    decentralisation and autonomy. The original term was “Decentralised Autonomous
    Corporation” (DAC), which detailed a company that ran entirely on smart contracts,
    but Vitalik Buterin suggested changing the C to an O since contracts are not the
    only type of organizational structure amenable to smart contracts. Lately there
    has been a lot of interest in cooperatives by those who first came across DAOs
    since they share many of the same concerns and issues. DAOs will likely have a
    profound effect on labour in the future in either a dystopian or post-capitalist
    direction.


    # Decentralised Exchange (DEX)


    An exchange completely facilitated by smart contracts that does not need to collect
    your personal information to allow you to exchange. Instead of liquidity of exchangeable
    assets being provided by the exchange or its partners like in DEXs, DEXs allow
    for anyone to provide liquidity and be rewarded for doing so through trading fees
    paid by traders.


    # Decentralised Finance (DeFi)


    DeFi is a growing industry and ecosystem of protocols and dapps using smart contracts
    that give access to anyone with a cryptocurrency wallet to many of the same types
    of financial products available only to banking and investment professionals.
    Due to the composable design space allowed by smart contracts, many innovative
    forms of financial products have been created that were not possible before (for
    better or worse). The most active'
