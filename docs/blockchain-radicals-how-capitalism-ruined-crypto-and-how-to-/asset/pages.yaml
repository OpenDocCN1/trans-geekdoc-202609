- pgno: 113
  md: 'event that there is a dispute, although how this is done depends on the agreement.
    To raise a dispute, the offended party must pay arbitration fees as collateral
    and a group of jurors will be randomly selected to help make a decision. In order
    to be chosen as a juror, you must also have provided some PNK as collateral to
