    some practical reasons to think this is not a desirable outcome, in part because
    Bitcoin does not fulfil every property of what money should have. The three functions
    of money are to be:


    +   1. Store of value: Money that you hold onto should have the same or close
    to the same value from one day to the next or even to the next year, the value
    should stay relatively stable.'
