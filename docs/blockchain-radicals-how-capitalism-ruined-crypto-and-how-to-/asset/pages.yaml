    # Decentralised Court Systems


    Blockchain is commonly hailed as a new mechanism to escape state regulations in
    ways that are similar to claims made by early Internet pioneers. The decentralised
    architecture of many blockchains (like the early Internet) make them resistant
    towards surveillance and control. This has led to some describing blockchains
    as “alegal”, in that they operate beyond the purview of the law, neither completely
    legal or illegal. Developers can easily create smart contract code-based systems
