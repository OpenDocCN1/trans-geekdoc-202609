- pgno: 189
  md: 'In their 2016 book Blockchain Revolution, entrepreneurs and early blockchain
    hypymen Don and Alex Tapscot ask the question, “Why do you need a $60 billion
    company called Uber” when most of the processes generalised by Uber could be automated
    through smart contracts, reducing the costs for upkeep of the platform? With a
    blockchain, you could instead automate the administrative processes with smart
    contracts, and allow the drivers to own the platform themselves, similar to The
    Drivers Coop mentioned above, but with more automation. To some extent these entrepreneurs
    advocated a business model which was against their own interests. This was one
    of the early examples to describe the potential impacts of a “decentralised autonomous
    organisation” (DAO) on a blockchain.


    So what exactly are DAOs? If you search around, in common with other complex and
    emergent concepts, you''ll likely encounter many, often divergent definitions.
    DAO is a term for an organisation using smart contracts to facilitate its own
    governance. It is sometimes simply defined as an online community with a joint
    bank account, but this is contested as many people have different ideas about
    what constitutes decentralisation, autonomy and even organisation. Since the experiment
    with “The DAO” (one of the first attempts at a real DAO), in which millions were
    stolen to a bug in the smart contract code as discussed in a previous chapter,
    the ethos and expectations have changed significantly. The original term was Decentralised
    Autonomous Corporation (DAC), which focused on how a company could run entirely
    on smart contracts, but Vitalik Buterin suggested changing the C to an O corporations
    are far from the only type of organisational structure able to be impacted by
    smart contracts.


    In a “A Pre-History of DAOs”, Kei Kreutler goes through the many evolutions of
    what a DAO was imagined to be and the many different emergent forms it has taken
    since its first experiments.² She notes the overlap some DAOs have with the foundational
    ideals for the operation of'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'cooperatives, the Rochdale Principles, including autonomy, open membership,
    democratic member control and others. But are DAOs digital cooperatives or another
    form of platform cooperative? The quick answer is neither.


    Organisations can come in many different shapes and sizes, with just as many types
    of goals and organisations in mind, which dictate how humans inside those organisations
    interact with one another. The same can be applied to what people are calling
    DAOs. If you hear about DAOs in the media, it will most probably be a DAO that
    tries to raise enough capital to purchase something as a group, often resulting
    in what can only be described as a financial frenzy. For example, ConstitutionDAO
    was an effort in November 2021 to purchase an original copy of the US constitution
    in a Sotheby''s auction, in which they raised around $47 million in ether. They
    ended up losing the auction, likely because of the transparency of the amount
    they raised through the Ethereum blockchain made it easier for another bidder
    to know the exact price that would be out of reach for the DAO. After the bid
    was lost, those who gave to the DAO were refunded what was left, although much
    was lost in transaction fees.


    This type of DAO is focused on joint investments and ventures. Founded by investors
    and basketball fans, Krause House DAO is trying to buy a professional NBA basketball
    team. If they were to succeed at some point, members of the DAO would take part
    in decisions affecting the operations of the team, including general management,
    ticketing, merchandising and partnerships. This is perhaps not unlike how cooperatively
    owned sports teams like the Green Bay Packers or FC Barcelona are owned. This
    type of capital-raising model for DAOs can be applied also for philanthropic purposes,
    as in the case of UkraineDAO, which was created to use crypto to raise money for
    the war efforts in Ukraine against the invasion from Russia. The crypto raised
    was'
  merge: -1
