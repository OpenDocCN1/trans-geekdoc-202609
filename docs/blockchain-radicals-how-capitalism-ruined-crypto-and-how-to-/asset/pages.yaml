- pgno: 277
  md: 'Similar to the ethos of DIWO, Camp Chaos emphasised collective creation, rather
    than the individual genius, through a headless band. While the headless brand
    of Bitcoin attracted a particular type of person, so did Camp Chaos, which expressed
    a very different ethos and set of beliefs around the role of the individual. This
    is just one more example of how if we restrict our understanding of this space
    to right-wing libertarianism, we either miss out or simply refuse to acknowledge
    the more collective efforts happening there, especially in the arts, an arena
    which has historically been a good place to look to see where technological trends
