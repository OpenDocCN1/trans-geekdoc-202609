    On the Bitcoin network, and most other blockchains, in order to make a transaction,
    you “sign” it with your private key. This means that you prove you are the owner
    of the public address (sometimes referred to as a wallet) that holds the bitcoin
    or cryptocurrency by proving you are the owner of the associated private key.
    As long as you are able to prove you know the private key, you are able to access
