- pgno: 107
  md: 'relations are legitimated through the state. In what seems to be a purely digital
    world, it''s easy to think that code can replace law, but the issue is a bit more
    complicated than that.


    While many may only have come across that phrase in the context of some proposed
    future run by smart contracts rather than governments, the term is actually not
    new. One of the proponents of the dictum was liberal law scholar Lawrence Lessig,
    who wrote about it in his 1999 book Code and Other Laws of Cyberspace. His influential
    argument was that computer code can regulate behaviour in similar ways to legal
    code, therefore enforcing the amendment of code could be a tool for states to
    impose regulation, among other things. It came about in a time the Internet was
    just starting to really take off and the start of when our lives became more dependent
    on it.


    According to Lessig''s "pathetic dot theory", there are four major regulators
    of individuals (pathetic dots) in the meat space legal system: the law, social
    norms, the market, and physical architecture. By architecture, Lessig is referring
    to the facts of life that dictate what is and is not possible biologically, physically,
    technologically, etc. In his book he equates code to physical architecture but
    for cyberspace, giving it the ability to constrain behaviour as law does. However,
    similar to how bitcoin is like money in some ways but not the same, code is like
    law but not the same, and also like physical architecture but not the same. Cornell
    law scholar James Grimmelmann wrote in 2005:


    The structures that can be built out of software are so much more intricate and
    fragile than the structures that can be built out of concrete that there is a
    qualitative difference between them. You can hack a computer program into destroying
    itself; you will have no such luck hacking a highway.2'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'According to Grimmelmann, software has three distinct characteristics that
    differentiate qualitatively from architecture, as Lessig uses the term. Software
    is automated, in that once it is deployed, it deterministically keeps going without
    human intervention. It is immediate, in that it doesn''t wait for an infraction
    to occur to impose punishment, but it prevents forbidden behaviour from happening
    once it starts. And it is plastic, in such a way that a programmer can implement
    almost any system they can imagine and describe in code. These properties produce
    consequences that make it different from both law and physical architecture, including
    the fact that one bug can have immediate unexpected effects on an entire system
    with dire consequences. Grimmelmann suggests that code instead its own modality
    for regulation that should be separated from the others.


    The same is true for smart contracts, which are run through code, as can be in
    the various hashes of smart contracts since the start of Ethereum and other smart
    contract blockchains. The most famous one is “The DAO” hack, the first major hack
    on the Ethereum blockchain. To not be confused with a DAO, or a decentralised
    autonomous organisation, which is a loose term for entire organisations that run
    on smart contracts (DAOs will be covered in a later chapter), The DAO hack was
    the first attempt at making the idea of DAOs a reality as a collectivised investment
    firm where those who helped it could vote on where to allocate the funds. It launched
    on 30 April 2016, with an ICO that distributed DAO tokens in exchange for ether
    over the course of twenty-eight days. Three weeks into the sale, they had raised
    over $150 million in ether, or about 14% of the total ether supply. Before the
    ICO finished, however, 30% of the funds in the smart contracts that made up The
    DAO were hacked and stolen. A group of white hat hackers were able to protect
    the other 70% of the funds, however the damage had already been done. A very large
    percentage of the total supply of ether was now owned by black hackers and many
    who had entrusted'
