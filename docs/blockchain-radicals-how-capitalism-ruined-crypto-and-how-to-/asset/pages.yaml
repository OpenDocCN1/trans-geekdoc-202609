    But first, what exactly is a token and why are they important?


    # Tokens


    A token is an empty representation of something else that only derives value and
    meaning from the context it is in. When people first hear the word, they may think
    of arcade tokens used to spend on arcade games. At an arcade, you purchase arcade
    tokens with normal money based on a set arcade. The token is very useful inside
    the arcade, but if you were to take it outside, it would be useless — the token
    is only valuable within a certain context.


    In the arcade token example, there is a clear link between an arcade token and
    financial value by way of the exchange rate by the arcade owners. However, a token
    does not always represent something of financial value. If we think of the phrase
    “a token of my gratitude”, this is used largely in a non-financial sense. You
    may have done a favour for me by helping me without an expectation of receiving
    anything back, and I may offer you some cold beers after a long day of work as
    a token of my gratitude. The beer represents my gratitude for your help with moving
    my furniture and is valuable to you because it shows we have a strong friendship.
    However, we could also potentially financialise our interaction by trying to give
    a monetary amount for the work you did and a contract for me to pay off the work
    you did over time in five payments at 2% interest, or I can give you an equal
    amount in monetary value of cold beer, but that would be a strange thing for friends
    to do.


    In a capitalist economy though, many of the tokens that have influence over our
    lives have financial value. We could also think of stocks as a type of token that
    represent ownership rights in a company, or depending on the class of stock you
    have, as a claim to dividends at the end of the quarter'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'with no say in voting on matters pertaining to the company. A stock almost
    always has a financial value attached to it, but it could also have a political
    value too if it gives control rights. In this way we can also say that the vote
    you have a right to as a citizen of a country is a token of political value that
    is difficult to quantify in financial value.


    A token is a very important "primitive" for Ethereum development, and the ERC-20
    token standard is by far the most widely used. The ERC-20 token standard contract
    is essentially its own ledger that tracks a completely different digital asset
    as the native cryptocurrency for the Ethereum blockchain, ether. While the Ethereum
    blockchain is tracking the movement of ether, it is also tracking the state of
    smart contracts deployed on the network. For example, I can make a token, let''s
    say Josh Coin, that I want to give out to my friends to thank them for all helping
    me move. I can deploy an ERC-20 smart contract on the Ethereum blockchain with
    the appropriate inputs (e.g., there are only 100 tokens in supply, give the entire
    supply to me, you can''t send decimal amounts, etc) and then send the Josh Coin
    tokens to my friends'' Ethereum addresses. In order to deploy the contract and
    send the tokens, I will also need to pay the transaction cost (sometimes referred
    to as “gas cost” on Ethereum) in ether. Once this has all started, my friends
    and I can begin to develop together the exact context and system in which we use
    our Josh Coins. That can stay in the form of just a token of gratitude or evolve
    into something else. One way in which that could happen is by creating new smart
    contracts that use Josh Coins for other types of interactions. We could use them
    like a vote, as a representation of ownership over some other assets, or anything
    we decide to conjure upon. The composability and inherent interoperability built
    into blockchains and smart contracts makes it easy to create new contexts for
    a particular token which imbues different types of value.


    # Financial Tokens'
