    One project that tackles the issue of privacy at the network level of the Internet
    is NYM, founded by Harry Halpin, a research scientist at MIT and radical open
    Internet advocate. NYM uses a decentralised mix network, where servers are given
    economic incentives through its own cryptocurrency Services in the mix network
    additionally make data packets of the same size and obscure the timing in order
    to increase the anonymity of data passing through it. This increases resistance
    to surveillance, including by states. The better service a server in the mix network
    provides to, the more they are rewarded. With the NYM cryptocurrency, token holders,
    users and those providing mix network services can govern and approve software
