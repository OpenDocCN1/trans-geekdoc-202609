- pgno: 191
  md: 'used to fund organisations working on the ground in Ukraine, providing supplies.


    Many of these types of DAOs could have instead just done a crowdfunding campaign
    on GoFundMe, but what DAOs offer regular crowdfunding campaigns don''t a way to
    govern assets in many different ways with real value across borders, thanks to
    multisignature wallets or multisigs. You can think of a multisig as a joint bank
    account represented through a smart contract. Normal wallets native to a blockchain
    are largely meant for a single person. Multisigs, like a normal wallet and all
    smart contracts have a public address that holds crypto assets for a group of
    wallets. You can encode the number of confirmations needed from other wallets
    that are part of the multisig in order to make a transaction, e.g., three out
    of five owners are required to confirm a transaction. The most common multisig
    contract is the one developed by Gnosis Safe, and at the time of writing has never
    been exploited by hackers.


    There are also DAOs, that govern over protocols, especially those involved in
    DeFi. For example, MakerDAO, mentioned in a previous chapter, has a protocol for
    creating DAI, a stablecoin pegged to the US dollar through over-collateralisation
    with other crypto assets like ether. The management of these vaults, the interest
    rates and voting on proposals put forth to the community are handled through the
    MKR governance token. The more MKR someone has, the more power they have over
    voting for changes to the protocol, in the same way that voting shares for a corporation
    work. This is usually referred to as token governance. Since holders of MKR can
    receive part of the fees generated by the DAO, the point of the MKR token is to
    align incentives around creating a system that people want to use (i.e., reasonable
    fees), but that also makes MKR holders money in fees. Vote for fees that are too
    high and fewer people will want to use the protocol. Too low and you won''t make
    money from MKR.'
  merge: -1
