  md: 'The other option being proposed by many states are central bank digital currencies
    (CBDCs), another potential financial privacy nightmare. While the exact architecture
    and technology to be used for proposed CBDCs in different countries is unclear
    at the time of writing, the reasons are obvious as to why states have been interested
