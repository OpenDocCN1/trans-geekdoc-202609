    similar methodologies to previous studies, Koomey found many issues with the numbers
    published by Digicominist, which was one of the studies included in the review.
    He noted that the approach has the advantage of being tractable using available
    data, it relies on error-prone assumptions about economic parameters and bitcoin
    miner behaviour (e.g., optimal allocation of mining resources) to estimate physical
    characteristics of the technological system. He states:


    Real economic systems may tend toward optimality, but they often don’t get close
    because of transaction costs, cognitive failures, and other imperfections in people
    and institutions. In addition, the assumptions used by Digicominist (like 60%
    of Bitcoin revenues equalling electricity costs and 5E US/kWh the electricity
    price) are so simplistic as to make any careful analyst wary.


    In fact, the 73.12146 TWh claimed by Digicominist for 2018 is a highly questionable
    estimate, given that the price of bitcoin, an important input for the stated methodology
    because prices influence how much energy miners will use, fluctuated by over 40%
    during the period. There was also no clarity over which periods the average price
    of bitcoin was taken to lead to the estimate.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Koomey also pointed many other issues with the estimations and assumptions
    in this widely reported source, making it difficult to conclude that the method
    used could be a reliable indicator of Bitcoin electricity use. Of the six studies
    reviewed in the report, Koomeyd found that three of them were credible estimates
    that agreed with each other and the other three had serious shortcomings, including
    the one from Digicomist. Based on one of the credible studies, the Bitcoin network
    used five gigawatts of power on 30 June 2018. To make a comparison, one gigawatt
    is equal to about 364 utility-scale wind turbines.15 Converting the five gigawatts
    to annual electricity consumption, which would equal 44 TWh, almost half of the
    claim made by Digicomist and equal to about 0.2% of global electricity use.


    Digicomist also reported on the electricity consumption of Ethereum before it
    switched to Proof of Stake (PoS) and was using PoW for its consensus mechanism.
    Based on recommendations made by Koomey in making estimates for PoW cryptocurrency
    networks, artist and developer Kyle McDonald performed his own analysis of Ethereum
    and produced similar criticisms of Digicomist''s findings. To summarise the issues
    made by Digicomist for Koomey and McDonald, they take a top-down approach to calculations,
    rather than a bottom-up one. Instead of starting from the bottom, understanding
    the energy usage of the machines involved in PoW, Digicomist starts its inputs
    from the top, assuming a fixed portion of mining revenue is spent on expenses
    like electricity and hardware. They estimate what miners spend on electricity,
    and how much electricity they are using, working backwards from their mining revenue.
    McDonald performed his own analysis and concluded that the energy and carbon emissions
    of the Ethereum network were closer to the “minimum estimate” from Digicomist,
    quite a bit lower than the estimate that is often quoted in the media.16 The study
    suggested the total electricity use for 2018 was 9.9 TWh, while Digicomist put
    their estimate at 20.8 TWh.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'These rebuttals and critiques of course have not reduced the media attention
    and subsequent moral panic around energy use of cryptocurrency networks. The rebuttals
    were in no way defences of the energy use of cryptocurrency, but they are simply
    likely to be more accurate based on the methodology used. One of the issues crypto
    advocates face is that energy use is a difficult topic to discuss with any nuance
    because it is filled with complex technicalities that to a layman may seem to
    not matter, but in reality are highly consequential. And of course, for the media
    companies, nuanced conclusions are not compelling headlines to sell readers.


    The issue can be summarised by what has been termed “Brandolini’s Law”, which
    states that “The amount of energy needed to refute [nonsense] is an order of magnitude
    bigger than to produce it”.17 Unfortunately, debunking misinformation necessarily
    always lags behind the creation of misinformation, and in the world we live in
    today information can spread across the globe in an instant. Peer review attempts
    to fix this, but so in comparison. Ideally, analysts and the media would show
    restraint before pushing partial narratives. However, the attention economy works
    against this, and it is often only the prospect of reputational damage that can
    persuade analysts to exercise caution. But what reputation when the next controversial
    factoid is released the next day and the conversation has moved on?


    Another issue with current discussion around energy use being framed heavily by
    cryptocurrencies is how it restricts the scope of energy use scrutiny, thereby
    slowing the rate at which we can properly identify feasible routes for climate
    action. Its'' attention-grabbing headlines claim a single Ethereum or Bitcoin
    transaction uses up the same amount of energy as hundreds or thousands of European
    households. However, it ignores the fact that the largest polluter in the world
    is the US military and that it is the might of the US that backs the power of
    the US dollar around the globe.18'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'We also have very little information about the energy use of tech corporations
    like Google, Amazon or Meta that have massive data centres all over the world,
    since that information is behind closed doors. The estimates that we can make
    on cryptocurrency networks are based heavily on data that is inherently publicly
    available, unlike corporate or military infrastructures.


    This is not a defence of the high energy use of cryptocurrencies, but an attempt
    to be honest and accurate about the current state of the discussion in much of
    the popular media and many progressive circles. Similar to the effects of the
    framing developed by BP on carbon footprints, trying to measure the amount of
    carbon per transaction puts the blame on the individual and misunderstands the
    roots of the energy consumption. McDonald states:


    The Ethereum network is a bit like your home network router. When you turn on
    your home router, it uses a fixed amount of energy whether you are streaming high-resolution
    movies or just sending emails. Ethereum also uses a fixed amount of energy regardless
    of how many transactions are on the network (at least, during normal activity).
    Because there is no direct marginal increase in energy from additional use, this
    makes the question of responsibility a philosophical one rather than a technical
    one. Clearly the responsibility for the emissions should belong to those who are
    investing in and profiting from the system. By dividing the total emissions per
    day by the total transactions per day might give a sense of scale, but it could
    be more misleading than helpful.19


    For those who are concerned about the environment, their anger would be better
    directed at the institutions that have been delaying the transition away from
    fossil fuels for half a century, rather than artists exploring NFTs for'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'their artistic practice. Instead, we should be digging deeper to identify the
    systemic issues that are leading to increased energy use across the globe every
    year as we face the prospect of climate collapse within much of the population''s
    lifetime. What are the patterns of behaviour that are being socially reproduced
    to prevent swift climate action and how do we reverse them? What does it say about
    us as a society that it is so profitable for people to be mining supposedly useless
    cryptocurrency? Would a global ban on cryptocurrency get us closer to reaching
    climate goals, or would the unintended consequences be too severe? Is there an
    alternative to energy-intensive PoW?


    # The Merge to Proof of Stake


    Much of what people have said about PoW energy use on Ethereum has become obsolete
    at this point. While it''s unlikely that Bitcoin will ever move to a different
    consensus mechanism, and the implications of that for electricity use should certainly
    be studied and scrutin, the second largest cryptocurrency by market cap has moved
    away from PoW, as was planned since its launch, to Proof of Stake (PoS).


    PoS is where a blockchain network is secured by stakeholders who "stake", or lock,
    some of the native cryptocurrency, in batches of 32 other in the case of Ethereum.
    The more someone stakes, the more likely they are to be randomly chosen by an
    algorithm to validate the next block on the blockchain. If a chosen stake is found
    to be attempting to check the system, they can be "slashed" or lose the cryptocurrency
    that they have staked, enforcing the rules laid out by the protocol. The hardware
    needs of a staking node are a fraction of what''s needed for a mining node and
    can be as little as a Raspberry Pi or any other miniature computer. All that''s
    needed is sufficient memory to hold the full state of the blockchain and maybe
    at least eight gigabytes of RAM, depending on the requirements.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'PoS has been around for several years now, with many of the newest blockchain
    networks like Cosmos, Cardano and Tezos using some version of it without any serious
    security breach to their chain. Since Ethereum started before much research into
    real-world examples of PoS existed, it had the difficult task of creating a completely
    new consensus mechanism at the same time as allowing their PoW chain to continue,
    analogous to trying to fix an aeroplane when it''s already in the air. The way
    it did this was by creating a parallel blockchain called the Beacon Chain that
    performed the task of the PoS. Once the Beacon Chain was connected to the Ethereum딨
    while it was running PoW, the entire network officially moved to PoS, making Ethereum
    miners obsolete in the process. This process was dubbed “the Merge” by the Ethereum
    Foundation.20


    In this setup, the two chains work as one to provide all the features that the
    PoW Ethereum offered while securing them through PoS. The Beacon Chain did not
    replace the process of executing transactions, but instead only focuses on coordinating
    stakers for facilitating the consensus mechanism. Hence why it''s sometimes referred
    to as the “consensus layer”. The original Ethereum딨 continues to process transaction
    and smart contract interactions. Sometimes this chain is referred to as the “execution
    layer.


    Even according to Digicomist, the Merge reduced Ethereum’s energy consumption
    by at least 99.84%.21 To put this into perspective, if we compare the relative
    energy of Bitcoin with the two versions of Ethereum, using height as an analogy,
    Bitcoin would be equal to the Burj Khalifa, PoW Ethereum would be equal to the
    leaning Tower of Pisa and the PoS Ethereum would be equal to a screw. While some
    may try to downplay the significance of the technical achievement of massively
    decreasing energy consumption and the carbon emissions for a decentralised network
    currently in use, there are few if not any other examples of something like this
    being achieved. There has not been a single'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'corporation or government agency to publicly announce plans to reduce their
    emissions by such a large factor, actively communicate on its progress, have constant
    real-time information to confirm the claims and achieve it without being forced
    to by any other institution. Will the media coverage shift when it comes to reporting
    on Ethereum energy use? It''s hard to say at this moment, since little has been
    said about the event in mainstream media, but it''s likely that many critics will
    still not be sold.


    Criticisms will likely shift towards the pitfalls of a PoS system. Does PoS still
    produce inequality? Yes, because it still follows the logic of capitalism, and
    PoS was never posed as a fix for capitalism. Ironically, many of the progressive
    critics are in agreement with right-wing Bitcoin-maximalists that PoS is a “rich
    get richer” scheme, that seeks those with wealth to earn more rewards. The bitcoin
    maximalist position for PoW over PoS claims that stakes are able to compound their
    wealth only comes from owning the native cryptocurrency, whereas in PoW anyone
    can buy mining equipment. What this claim misses is that miners are able to take
    advantage of economies of scale inherent to the physical operations of mining
    operations. Wealthy miners are able to buy equipment in bulk and have access to
    cheaper electricity than poorer miners, while a cryptocurrency itself will cost
    about the same for everyone. While those who bought the cryptocurrency early are
    more likely to receive more benefits from staking than those who come later, a
    similar dynamic is at play with miners as well. As it stands, it is very difficult
    for the general public to begin mining bitcoins without significant capital up
    front. We have seen the centralisation effects of capitalism on Bitcoin today
    where the majority of mining power comes from organised operations and rarely
    from hobbyists in their bedroom. Considering the significantly lower costs for
    equipment as well as need for electricity for stakers, engaging in staking is
    much more attainable, especially with the creation of staking pools which'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'allow people to pool their crypto together in order to reach the 32 ether minimum
    needed to begin staking.


    A study by chainleft.eth compared the centralising forces of PoW against PoS assuming
    much higher operating costs for PoW, equal living expenses, a 2% annual depreciation
    on mining equipment, a 10% annual reward base for both and a 5% economies of scale
    on operational and equipment costs.22 The model showed that wealth inequality
    between rich and poor miners increased by 6.2% in the PoW system, whereas the
    number was 0.9% for PoS. The wealth gap between the rich and the poor increases
    more in a PoW network than in a PoS network according to their estimate. The conclusion
    to be drawn is that while both are centralising-over-time, PoS at least not centralise
    faster than PoW.


    Still, some may claim that neither is good enough and that all cryptocurrency
    networks should still be banned at a global scale. We''ve alluded to the reasons
    why this is problematic for activists but we will go into more detail later.


    # The Emergence of Regenerative Finance


    Discussions around energy use in the face of climate collapse often tend towards
    a moralistic judgement of what is and not worth doing. When some estimates say
    we have only a few years left to dramatically decrease our carbon emissions to
    prevent the worst from happening, it''s easy to look at the way cryptocurrencies
    are reported on in the media and conclude that a decentralised network dedicated
    to gambling isn''t something that should exist. This is a reasonable position
    to take and it is distressing seeing masses of pseudo-anonymous investors using
    this global coordination technology in order to risk their life savings on some
    of the most ludicrous financial products one could think of. In crypto speak,
    these types of people are referred to as “degens” (short for degenerates).'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'With the pandemic lockdowns that began in 2020, people began looking even more
    to the Internet to pass the time. As a result, the technology and user interfaces
    for DeFi applications built on Ethereum became friendlier for new users, and extra
    spending became available through government support programs. It was a perfect
    mix of conditions for DeFi to grow. Total value locked in DeFi was $690.9 million
    on 1 January 2020, growing to $11.3 billion by November 2020. 23 Even in mid-February
    2023, after a crash that has seen prices cut by more than 50%, the total value
    locked in DeFi on Ethereum is approximately $45 billion.24 Needless to say, although
    it does not come close to the size of the US financial services industry, which
    is well into trillions of dollars, DeFi has become significant. For contrast,
    Apple has a market cap of about $2.5 trillion in May 2022. The growth in DeFi
    was a result of hype and speculation led by crypto markets, hypemen and scam artists
    for people drawn into crypto by inflated promises of getting rich through dog
    memes. It was clear, however, for those who have more idealistic goals for the
    development of the technology and the culture behind it, that this was not a good
    direction to be in.


    One of the attempts to shift much of the resources and capital going into crypto
    towards climate-related projects has been termed Regenerative Finance, or ReFi.
    ReFi projects generally involve attempting to account for and regenerate what
    is normally considered a negative externality, especially when it comes to nature
    and climate. That sounds laudable, but is this just another form of greenwashing?


    Many of the first projects to adopt the ReFi banner have been focused on carbon
    credits in one form or another. Existing carbon markets generally run on a “cap
    and trade” system where government bodies or a voluntary third-party system set
    a cap, or maximum amount of carbon dioxide that a single company is allowed to
    emit. It is then divided into credits that companies can use as their allowance
    for carbon emissions. If a company'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'uses up all of their credits, they will then need to purchase credits from
    another company that has extra. As the maximum decreases every year, the credits
    should become more expensive for companies that choose not to decarbonise their
    business. While in theory this sounds like a good idea for pricing negative externalities,
    the issue so far, according to some economists, has been that the system has failed
    because the prices of carbon are much too low, as are the fines that companies
    face for not complying with environmental regulations.


    Two of the projects that have sought to ameliorate the current issues with carbon
    markets by making it easier to purchase carbon credits through tokenisation is
    Toucan Protocol and KlimaDAO Toucan, launched in October 2021 as the infrastructure
    provider behind Base Carbon Tonne (BCT), a carbon reference token. Each token
    represents one tonne of carbon from the Verra Verified Carbon Unit (VCU) registry.
    Verra is a major voluntary carbon credit issuer and each VCU in their registry
    represents emissions savings that have been measured and audited by independent
    third parties. Tokenises VCUs as BCT on a blockchain and because BCT is a fungible
    ERC-20 token it can be directly integrated into any DeFi application. KlimaDAO
    launched the first application to use BCT on their platform. BCT achieved $2 billion
    in trading volume through KlimaDAO within the first month of launching.


    For those who believe in carbon markets as a viable strategy for pushing reform
    around climate action, the higher the prices for carbon credits, the more successful
    they become. And so, while for a short time KlimaDAO pushed the price of BCT to
    just above $8, starting from approximately $5 in late 2021, the price fell to
    nearly $1 by December 2022 and has continued to fall since. Even more strikingly,
    the price of KLIMA, the token that governed KlimaDAO and was backed partially
    by participants in the DAO that purchased BCT, went from a high of around $3,600
    to $3.50 by June 2022 — needless to say, a major loss for who'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'took part. Although it does feel strange to judge a climate-based project based
    on financial return, there are actually other reasons to be critical, especially
    regarding the types of complex financial mechanisms utilised to promise high returns
    for investors which inevitably didn''t pan out.


    It’s important to note that these protocols are buying credits on the voluntary
    market. Voluntary markets are not backed by any government standard or mandatory
    goals, but on specific organisations certifying that emission reductions have
    environmental integrity. These types of markets have had issues before, as many
    of the credits being found to be very credible after investigation, including
    Verra, with some claiming that 90% of their rainforest credits are worthless.²25
    Even with government-enforced carbon markets, regulations differ (or may not exist)
    between countries, something which incentivizes businesses to move to countries
    with more lax rules. Governments need to be both strict and aligned to prevent
    companies from gaming the system or finding loopholes.


    While carbon credit markets have been growing over the years due to pressures
    on companies to have a corporate social responsibility policy, they still follow
    the logic of carbon footprints. Many new blockchains have started since 2018 have
    claimed to strive for being carbon neutral or even carbon negative. This trend
    can be seen in many other industries, however the main way that these entities
    justify their claims to being environmentally friendly is through showing the
    carbon credits that they have purchased to offset their emissions. The truth,
    however, is that offsetting through carbon trading is a way to avoid the problem
    and essentially a continuation of “greenwashing” by corporations. It limits the
    framing of the issue, much as the idea of a carbon footprint does, in it again
    obscures the need for systemic solutions, focusing instead on specific choices
    that each corporation makes. Are there ways to move beyond this frame?'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# From Degen to Regen


    One of the most vocal projects to attempt breaking away from the “degenerative”
    culture of DeFi into something more socially beneficial is Gitcoin. Founded by
    open-source development advocates Scott Moore and Kevin Owocki, Gitcoin is a platform
    that leverages the Ethereum blockchain to enable open source developers to monetise
    their work. Not unlike blockchains today, open-source code, or code that is publicly
    available for anyone to copy, modify, or share, started off as a seeming fad for
    many in the 1990s but has become extremely important for the development of many
    products that millions of people and businesses now depend on, the Linux operating
    system, or LibreOffice, the suite of tools similar to Microsoft Office which I
    used to write this book. Notoriously though, open source development is difficult
    to make money from unless there are enough good, willing people wanting to donate,
    or a large corporate that uses your software to prepare you money for your work.
    Gitcoin has come up with a way for open source developers to be paid from donations
    using crypto protocols through their platform and we will cover how Gitcoin does
    this in the next chapter.


    What is interesting about the Gitcoin project is how they have explicitly attempted
    to push those who take part in degen activity (e.g., financial speculation without
    any regard for externalities) towards the social good by propagating new memes.
    For example, one is a call for profits made from crypto for funding public goods,
    which in economics refers to a commodity or service that is made available to
    all members of a society. This frames open-source software, the foundation of
    much of our digital infrastructure, as a public good in the digital world.


    Regen refers to someone who engages in ReFi. For Owocki, ReFi is a “cultural preference
    for the funding of community and the public good over (or in parallel to) projects
    that are expected to produce a return for the funder.”26 Owocki expands on these
    memes again by encouraging degens to'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'take “greenpill”, a play on the famous scene in The Matrix, and become regens
    instead.


    One of the overall goals of Gitcoin is to use aesthetics to create a shift in
    perspective and culture. While the pessimistic may feel that we''re careening
    towards a future of cyberpunk authoritarianism and eventual collapse, Gitcoin
    is trying to create a “solarpunk” vision of the future. Opposing cyberpunk’s grey
    and degraded, highly technologised corporate authoritarianism, typified by films
    like Blade Runner, solarpunk proposes a world where technology is used instead
    in a utopian fashion that we can more readily interrelate with the natural world.
    It is an optimistic vision focused on local sustainability and collective human
    thriving. However, one of the obvious things that need to be addressed for a cryptobased
    organisation intent on building a solarpunk future is how to engage with the world
    beyond their computers, the blockchain and crypto markets.


    The Regen Network is a sovereign, PoS blockchain built to verify claims, agreements
    and data related to ecological states, and according to their white paper, you
    can think of it as “living capital accounting”.27 The project was founded by Gregory
    Landau, a long-time advocate and social entrepreneur of regenerative agriculture
    who has worked with several agricultural cooperatives and permaculture initiatives.
    Landau has described the project as trying to “align short term economic gain
    with long term ecological health”.


    The Regen Network is meant to be foundational infrastructure on which other projects
    can build their own climate-focused endeavours, but that already started helping
    those who are already engaged in carbon sequestration practices to onboard to
    their protocol, even if they have not been verified by an existing carbon market.
    The Regen Registry is a voluntary carbon credit market that is interoperable with
    several other existing carbon credit registries. The Regen Network also has its
    own rules for farmers and others to make claims about their ecological-'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'work. This is helpful for many small farmers, since getting accredited by many
    of the existing organisations can be time-consuming. The Regen Network blockchain
    is used to verify the provenance and quality of ecological data claimed and payments
    for ecosystem services, and employs smart contracts that automate the necessary
    administration based on verified changes in ecological health. The Regen Registry
    maintains high standards by combining remote sensing technologies with satellites,
    sensors or ground observations. This makes it easier for small farmers across
    the world to sell credits, so that they can also benefit and not just larger agricultural
    organisations.


    REGEN is the native cryptocurrency token, and is a way for users to pay transaction
    fees, secure the blockchain through PoS and governance over the protocol itself,
    meaning that it is governed by token holders. Many of the tokens are given and
    paid to the projects that are sequestering carbon for carbon credits, which thereby
    gain voting power over the network that it can be developed in ways that are beneficial
    to them. While the blockchain is meant to reward and track positive changes to
    ecology, on its own this could be problematic in that it could induce the use
    of exploitative mass production practices for the creation of carbon credits.
    To avoid that, Regen works closely with these organisations and has dedicated
    staff to help them onboard to the technology and register their carbon credits.
    They have also explicitly recognised the important role that many black, indigenous
    and people of colour play in stewarding the Earth and have committed to equity
    and inclusion for these communities with dedicated funds. Although Regen Network
    does focus on voluntary carbon credits, they go beyond just facilitating trade
    for trade’s sake.


    Kolektivo a ReFi project focused primarily on the Caribbean island of Curaçao,
    with the aim of finding solutions to many of the economic and sustainability issues
    island-nations face by creating a complementary economic system driven by social
    impact.28 The hope is that Curaçao will'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'be the ground-zero for building a framework for regenerative economic solutions
    that others can build on. Founders Luuk Weber and Andy Kirchner, natives of Curaçao,
    saw the problems already endemic to the country exacerbated by the COVID-19 pandemic,
    which slowed down the tourism to the island is dependent on.


    One of the first projects they embarked on was the creation of a regenerative
    alternative to traditional farming called a food forest, which involves planting
    a diversity of edible plants that require little water and resources once established.25
    Food forests are a way to provide food security, conserve water and provide local
    employment in a resilient way, and was funded by selling forty unique NFTs for
    250 DAI for each a total of $10,000.30 Each NFT represents 1% ownership of the
    forest and therefore 1% of the yield from the harvests, something paid out in
    CuraDAI, a localcoin pegged to the local currency, the Antillean Guilder, by Kolektivo
    created using PoS-based blockchain Fuse. This can be used to pay for products
    or services, exists in parallel with the official currency and is already accepted
    at local grocery stores. The benefit of CuraDAI is that the payment is received
    within seconds, even if a user is in another country. Since many of the native
    island inhabitants either live or have family abroad, it facilitates the easy
    sending of money across borders.


    The vision is the creation of a regenerative economy that works with local people,
    puts products on the market, and accepts local payments. Kolektivo hold workshops
    about blockchain and cryptocurrencies, partner with local businesses to educate
    the community, and gather data about the food production of the food forest in
    order to continue expanding in a regenerative way. What the experiments by Kolektivo
    are showing that by combining digital technologies with blockchains with real
    in-person human coordination in particular combinations, we can begin to think
    about larger scales of coordination for climate action that the affordances of
    a blockchain enable. However, it’s important to remember that the issues'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'around climate change are not just about coordination failure, but are also
    a power struggle against the largest polluters in the world and the defeatism
    they often engender in wider society.


    We need to be careful with the issues we push forward when it comes to climate
    change in order to address it the best we can, given the circumstances. For example,
    the story of how oil companies intentionally tried stopping the development of
    electric cars might lead to the conclusion that we should be supportive of billionaire-owned
    electric car companies like Tesla without even considering the other option of
    building more and better public transportation services, something which would
    produce significantly less greenhouse gases than simply replacing gasoline-based
    cars with electric ones as well as removing the reliance on roads that destroy
