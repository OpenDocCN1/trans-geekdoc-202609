  img_proc: true
- pgno: 134
  md: 'Looking back at Lessig’s framework from the previous chapter, we know that
    code has similar properties to architecture, but still with qualitative differences.
    Smart contracts, being not just code but agents within an economy, whether free-market
    or commons-based, also have properties similar to the market as a regulator in
    Lessig''s framework. What is clear now how smart contracts can be used to create
    the conditions for libertarian free markets but can also be designed in a way
    that reduces the effects of a free market, depending on how liquidity is designed
    to be used in the system. Smart contract code is still qualitatively different
    from law, architecture and the market in Lessig''s framework, but nonetheless
    still useful.


    By systematising and creating best practices and methods for token engineering,
    we can break down the different elements that are needed to create a cryptoeconomy
    and choose from a library of primitives to build the infrastructure for it. This
    in turn makes economic design more approachable by more people, and when more
    people can take part in discussions they can provide more input for collective
    decision-making. And if a community were given the choice between an economy built
    for a free-for-all market and one for treating shared resources as a commons with
    clear rules for the benefit of all, I''m willing to bet they would pick the second.


    OceanoPDF.com'
