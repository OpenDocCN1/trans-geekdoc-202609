  img_proc: true
- pgno: 320
  md: 'blockchain for this industry is Ethereum, but others like Cosmos also have
    their own ecosystem of DeFi applications.


    # Distributed Ledger Technology (DLT)


    This is an umbrella term for peer-to-peer network infrastructure technologies
    that allow for users to reliably access and add data to a shared digital ledger.
    As opposed to a centralized database, DLTs do not have a central administrator.
    A blockchain is one type of DLT, but there are many types out there.


    # Ether


    The native cryptocurrency for the Ethereum blockchain used to pay for any transaction
    made on the network and the reward for adding a new block as a miner or staker.


    # Ethereum


    A blockchain created by Vitalik Buterin at nineteen years old that showed how
    it was possible to build smart contract functionality on top of a blockchain.
    Many other similar blockchain-based cryptocurrencies have been created with the
    functionality of smart contracts and at the time of writing Ethereum is the largest
    and most used blockchain with smart contract functionality.


    # Fork


    In software development, forking refers to creating a copy of a project''s codebase
    to start a new, separate project that can be developed independently. It''s like
    taking a snapshot of a project at a certain point in time, either starting from
    the source code or while the projects is live, and'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'then going in a different direction with your own version of the code. This
    is often done when different groups of people want to work on a project in different
    ways, or when someone wants to create a new version of an existing project with
    different goals or features. In blockchains there are two types of forks. A hard
    fork is a permanent separation of the original codebase, creating a completely
    independent project, usually after a major change that is not backwards-compatible.
    A soft fork is a temporary separation of the original codebase, creating a new
    project that can still communicate with the original project, usually after a
    minor change that is backwards-compatible.


    # Hash


    A one-directional cryptographic algorithm in which any input creates a fixed size
    output of random numbers and letters, but there is no feasible way to know the
    input when given just the output. It is an important technique for encryption
    (hiding messages) over the internet as well as saving memory. While collisions
    are theoretically possible (when two different inputs create the same output),
    the chances are astronomically low and would require a very significant amount
    of energy to find one purposely. There is currently no known example of a collision
    for many of the common hashing algorithms used in the most popular blockchains.
    When quantum computers become more prevalent, many hashing algorithms will likely
    become obsolete, but there are already many that have been created to be quantum-resistant.


    # Layer 2


    While a blockchain is considered to be layer 1 and since most blockchains currently
    cannot scale sufficiently for global general use, layer 2 refers to scaling solutions
    that are built on top of layer 1 blockchains like Ethereum.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'They are separate but connected networks meant to increase the total transaction
    output speed at lower costs for users while preserving the security and decentralization
    guaranteed by a layer 1 blockchain. Examples include Optimism and Arbitrum for
    the Ethereum network.


    # Non-Fungible Token (NFT)


    An NFT is a special type of token which represent a unique digital asset which
    cannot be interchanged with another in the way that money, cryptocurrency, or
    other token can be since they are largely fungible. Industries that have had the
    quickest growth in NFT includes digital art and gaming since they already have
    significant use of artificial scarcity of unique assets.


    NFTs should not be seen as crypto art or solely as something to buy or sell as
    a unique asset, but as a unique token with many different users depending on the
    context encoded in their smart contracts and in the social network it exists.
    For example, many of the bonus episodes I release for my podcast on Patreon are
    also available on my website if you purchase an NFT to access the episode on its
    own with Unlock Protocol. In this way, the NFT is essentially a key to access
    digital media, similar to pay walls used by many other websites, except here you
    can pay with cryptocurrency instead.


    # Node


    A computer on a P2P Network which takes part in keeping the network to date. In
    blockchains they can actively or passively take part in consensus making. Nodes
    are necessary for any P2P network like blockchains, whether they use PoW, PoS,
    or any other consensus mechanism.


    # Oracle'
