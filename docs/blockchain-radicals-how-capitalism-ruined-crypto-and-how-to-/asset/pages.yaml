  md: '# REPEATER BOOKS


    is dedicated to the creation of a new reality. The landscape of twenty-first-century
    arts and letters is faded and inert,  by fashionable cynicism, egotistical self-reference
    and a nostalgia for the recent past. Repeater intends to add its voice to those
    movements that wish to enter history and assert control over its currents, gathering
    together scattered and isolated voices with those who have already called for
    an escape from Capitalist Realism. Our desire is to publish in every sphere and
    genre, combining vigorous dissent and a pragmatic willingness to succeed where
    messianic abstraction and quiescent co-option have stalled: abstention is not
    an option: we are alive and we don’t agree.


    OceanofPDF.com'
