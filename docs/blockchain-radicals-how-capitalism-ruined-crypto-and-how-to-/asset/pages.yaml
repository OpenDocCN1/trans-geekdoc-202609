    being a content creator or influencer has grown to be one of the most sought-after
    careers by young people,9 few very actually succeeded in making it their full
    time of income.10


    What was once just the attention economy has produced is now the creator economy,
    or the ability for “creators” to earn revenue through platforms like Instagram,
    YouTube, Twitch, TikTok, OnlyFans and many others. There are about fifty million
    creators in the creator economy, approximately 2.3 million of whom earn to make
    it a full-time job, but the revenue is far from evenly distributed. The “middle-class”
    creators are almost non-existent, beyond the lucky few who earn a comfortable
    living. Only 2% of creators on Patreon earned the US minimum wage of $1,160 per
    month in 2017, while on Spotify it takes 3.5 million streams for the equivalent
    of a full-time US minimum-wage worker’s $15,080 a year. Content creators are essentially
    working for free for platform owners, who pocket billions of dollars in advertising
    revenue'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'year while also often having other commercial rights over the content shared
    on their platform. Additionally, content creators are dependent on the very algorithms
    created by the platform operators in a black box that are used to display information
    on users’ feeds. The reasoning given for this opacity is that if the algorithm
    was public, it would be gamed by advertisers, though in fact it is already gamed
    through search engine optimisation strategies.


    Many of the trends that we’ve seen in the creator economy have mirrored what has
    happened in the arts. The arts have long been dominated by an awkward relationship
    between cultural institutions largely controlled by wealthy elites with occasional
    state support and a class of precarious artists in the fringes of culture producing
    the most innovative works. Platforms like YouTube and others have become sites
    of cultural production similar to Hollywood but with much more ubiquitous and
    plentiful content. It’s not a stretch to say that artists are a type of content
    creator. Many content creators use similar digital tools to create particular
    audio or visual aesthetics that require some artistic talent, even if its aim
    is more explicitly commercial than many more artistic attempts.


    Traditionally in the fine arts, artists are commonly dependent on either wealthy
    patrons, a well-funded public arts program from the state or being well known
    to be able to sell their art through auction houses and galleries. Before an artist
    is able to accomplish any of these things, they are largely in a very precarious
    position. This usually means that there is some amount of accommodating the tastes
    of the dominant cultural institutions in order to survive as an artist. It isn’t
    uncommon for artists to critique the situation they find themselves in their art
    and especially through the use of new mediums for art, like the Internet.


    "Internet art” is a term that encompasses many artistic movements, including net.art.
    net.art is the use of the Internet as a medium to distribute art that circumvents
    the physical galleries and museums that many artists'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'are dominated by. In the introduction to the German art critic Tilman Baumgärtel’s
    book net.art. Materialien zur Netkunst, he describes net.art as having “connectivity,
    global reach, multimodality, immateriality, interactivity and equality”. The net.art
    movement started in the 1990s in the wake of the fall of the Soviet Union, the
    rise of dot companies and the tech stock bubble, a time in fight the narrative
    that the Internet was inherently a democratic tool to fight state and corporate
    control was widespread. Net artists, however, questioned the structures that undergird
    the Internet to show that it was in fact heavily controlled by corporations like
    Microsoft and Netscape. The movement was also a critique of the art world as a
    business itself.


    The Internet presented the art world with a central problem: how can you sell
    a piece which is digital and infinitely reproducible? There were a number of responses
    to this. Russian artist Olia Lialina created an online gallery for showcasing
    and selling net.art its “original” URL in the 1990s using her web platform Teleportacia.org.
    The owner could control the location address as a way to limit access to the piece.
    The project was subverted by artists Eva and Franco Mattes who cloned the site
    with the same quality as the original. This moment seems now like a foreshadowing
    of the creation of NFTs and its critics’ “right click save as” strategy as a way
    to subvert NFT art. While it seems that no piece was purchased from Lialina’s
    experimental satire, in May 1999, Theo Spiller sold his work Megatronix to the
    Mestna galerija Ljubljana for approximately $500 through a sale negotiation hosted
    on an online forum. As a result, Spiller was one of the first net.art artists
    to sell an “original” piece to a gallery or collector.


    Fast forward a few decades, however, and there are still few options for digital
    artists to make a stable living outside of the traditional cultural institutions.
    Some may make a living from selling prints of their work or requests from those
    in niche digital communities who want customised'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'avatars or banners, but it''s rarely sustainable. Before Beeple started selling
    his work as NFTs, the most he had ever sold a print for was $100. Although he
    amassed a large audience from his digital work, he still needed to work for large
    corporate clients, as many digital artists do. The contradiction between capitalism
    predicated on the idea of living with a scarce amount of resources, paired with
    a new globally connecting media with a theoretically infinite amount of resources,
    since all it is, information, had not been addressed. The introduction of NFTs
    however was a first step toward helping to resolve this.


    NFTs of digital art created a way for artists to sell something which was infinitely
    copyable without having to restrict who gets to see it. The artist makes money
    and the collector gets something that is authoritatively theirs through the record
    of the blockchain, and anyone is still able to view the piece of art if they go
    to the smart contract or URL where it is stored. This point and its implications
    are critically missed by both critics and hypeymen of NFTs alike. On one side,
    it''s not uncommon to find hypeymen on Twitter claiming their NFT is their personal
    property thereby barring others from using or saving the image they purchased,
    forgetting that code is not law and private property is enforced by law. On the
    other side, many who are anti-NFT can be found online claiming to “right-click
    save” NFT pictures on their personal computer as a way to violate the NFT hypeymen’
    property rights. The Australian artist Geoffrey Huntley “right-clicked” many of
    the most popular NFT art projects and mirrored all the images on a separate site
    called NFT Bay, an allusion to The Pirate Bay, a common P2P file torrent site,
    as a way to “steal” the NFTs. However, this attempt at subversion only in fact
    exposes the same basic misunderstanding of NFTs’ relationship to art and property.


    In her essay “My Collectible Ass”, McKenzie Ward detailed a funny story about
    how a famous performance artist sold a piece of their work in which the collector
    would receive oral instructions on how to perform,'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'with a verbal contract in the presence of an army of lawyers and witnesses.12
    One of these pieces almost went on the secondary market, where art is sold by
    the current owner of an art piece and not the original artist, a peculiar thing
    for a performance art piece since nothing physically exists. The logistics for
    something like that would presumably incredibly difficult. Wark then proceeded
    to try to convince a few collectors who liked that particular artist that her
    was signed by the same artist via a tattoo and asked if they wanted to see it.
    They did not take her up on the offer. Upon further reflection, she notes that
    similar “to any other financial instrument, the artwork in a collection gains
    and loses value on the volatile edge between information and noise”. Her attempt
    to make her own collectible failed because there was not much around it. She further
    notes that paradoxically, an object whose image is very widely spread is in itself
    a rare object in the sense that few objects have their images spread widely. This
    can be exploited to create value in art objects that are not rare and singular
    in the traditional sense. The future of collecting may be less in owning the thing
    that nobody else has and more in owning the thing that everybody else has. This
    helps explain the attraction for collectors of “purchasing a JPEG” through an
    NFT even though it is still copyable. The fact that it is copyable is a good thing
    for collectors who understand what they’re getting into, and attempts at debunking
    and subversion like The NFT Bay actually assist those who are collecting NFTs
    by propagating the images and by creating backups of them for later provenance.


    In her blog post “Welcome to the Dessert of the Real”, Rhea Myers, one of the
    first artists to start using blockchain and cryptocurrencies as a medium for art,
    explains how art, especially when in the form of “high culture”, is also an exploration
    of new property regimes for capitalism.13 Capitalism is always interested in finding
    new ways to enclose art pieces as'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'property for private collectors as the art market proposes potentially new
    property regimes for other types of commodities.


    In a discussion between Wark and Myers, the explicit connection was made that
    art is like the research and development arm of capitalism for new property relations.
    A big part of the backlash, especially from artists, who have historically had
    a contentious relationship with cultural institutions and property well before
    net.art came about, is a reaction to this new and seemingly abrupt change in property
    relations brought in a lot of money from a new social class of collectors who
    are perkish kids in their artistic tastes, open about their intent to speculate
    by (incorrectly) treating it as a commodity, and an overall confusion around both
    this and the highly technical nature of it all. It looks as though, with NFTs
    and digital art, there is no longer a way to do art online without commodification.
    But this perspective depends on mental models based on other types of commodification.
    It seems lost on many similar to other types of art, the existence of an NFT of
    a particular digital image does not take away from the ability for others to enjoy
    it.


    So why is there so much focus on NFTs when DRM is an actually existing mechanism
    for creating digital scarcity? DRM prevents you from doing things like screenshoting
    a Netflix show, uploading copyrighted music on YouTube, or the iTunes store limiting
    the amount of devices that can store your purchased music. NFTs do not do this.


    In an article written by artist and researcher on technical and ethical protocols
    Mat Dryhurst titled “Digital Scarcity Feasible Abundance and the Shock of the
    Nude”, he pushes back against the claim made by critics that these technologies
    arbitrarily introduce scarcity to digital media:


    Digital media has always been scarce, because there is a rights holder conferred
    by law unless that rights holder renounces those rights with a'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'license... No scarcity is being imposed on media, existing scarcity is being
    surfaced and experimented with.15


    The truth is that the real scarcity lies in the realm of the law and how rights
    over digital media are recognised. Although platforms make money off of the content
    created by users, the rights to that content is still owned by the user, even
    if not formally registered.16


    The financialisation of digital media has been happening for a long time at this
    point, mainly through advertising in order for big tech platforms to make revenue
    as users largely don''t want to pay for digital media. For Dryhurst,"NFTs represent
    an elegant proposal to attempt what I would describe as feasible abundance, i.,
    how we make media fair for the people creating it?” Tech platforms are essentially
    black boxes where we know financialisation happens, but we don''t know all of
    the particular details since they are often considered business secrets.\Public
    blockchains, through making visible latent forces such as financing, unequal returns,
    or scarce and valuable ownership, are bringing long existing dynamics to the surface
    to be scrutinised. These forces are not new, they are nude.” And so, similarly
    to the moral panics from social conservatives about nudity or other forms of sexual
    expression in media, critics of NFTs seem to be uncomfortable with viewing the
    naked truth about digital media.


    # Platform Risk vs Hyperstructure


    While part of the distaste from the critics seems to also stem from their subjective
    feeling that NFT art lacks taste, this can''t be the reason for the strong reaction
    NFTs have provoked. To understand this more deeply, we need to understand the
    incentives that the Big Tech platform economy runs on.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'When content creators publish on any Big Tech platform, there is almost always
    a check using automated software for DRM, looking for anything that is under the
    IP of giant media conglomerates like Disney, Warner Bros, MGM, major music labels,
    etc. This has been a standard practice since before NFTs ever existed. At the
    moment, becoming a content creator, similar to many other forms of work, is like
    making a deal with the devil. You may be lucky enough to amass the following nets
    you earn enough in revenue and sponsor deals, but you are beholden to the policies
    of the platform in terms of the percentage of ad revenue it shares with you, the
    DRM policies you must follow, its black box algorithm for showing your content
    to users, and if the platform fails to make enough money for its shareholders
    or you are suddenly removed from a platform, it could also mean an end to sustainable
    income. Platforms, like any other business, like to privatise gains and social
    losses. This creates platform risk for all types of creators, pushing many of
    them to use multiple platforms at once in order to be shielded against the possibility
    of removal or the platform losing popularity. The inertia that goes along with
    joining a platform and finding your own followers also makes it difficult to bring
    a following to a new platform, creating even inertia.


    Part of what these platforms have done, similar to all capitalist businesses,
    is create mechanisms for people’s labour to be fungible through the commodification
    of attention. Users’ attention is commodified while creators’ content is commodified
    through advertising. This system promotes having users engaged on platforms for
    as long as possible through weaponised and gamified emotion inducement. What at
    first was the promise of removing middlemen like record labels and studios has
    actually created more alienated artists, creators and users while platforms and
    their shareholders take in the profits, just like the cultural institutions that
    the net.art movement sought to criticise in the 1990s.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Similar to the first uses of tokens in crypto as (bad) money or equity in a
    barely existing crypto project via ICOs, the trajectory of NFTs has followed a
    similar path of popular use within a narrow mental model. The main reason is that
    using already existing models or concepts in important ways makes marketing and
    creating systems easier. In other words, the quickest to market are those with
    the simplest language and mental models that are accessible to an already existing
    large clientele. Continuing the trend of financial speculation and already existing
    libertarian ideas, JPGs, but with auction houses that act as a membership card
    into an exclusive club, was an easy concept to sell. It also made easy for media
    and critics to write and opine about it at the expense of more interesting examples
    that foreshadow new systems and create new types of relationships.


    The typical process in the world of video games is for a central company to create
    a video game with in-game assets that are only relevant for the game in which
    they originate. The eighth thousand NFT collection Loot is attempting to reverse
    that relationship by creating NFTs of a plain list of randomised adventurer gear
    generated and stored on Ethereum. Each “loot bag” is one NFT that contains eight
    items: a piece for an adventurer’s chest, foot, head, neck, ring, waist, and weapon.
    For example the items could be a Short Sword, Leather Armor, a Pendant, a Heavy
    Belt, a Gold Ring of Power, etc. The stats, images and other functionality are
    intentionally omitted from the NFT to allow others to build on top of the NFTs
    to create their own worlds and lore with it. Since its release in September 2021,
    multiple derivative projects have sprung up. These allow who have a Loot NFT to
    purchase a generated image in various styles with the NFT bag inventory items
    on them and others that offer quests for your characters to go on.


    Unlike the typical video game, Loot has no parent company and no way to gatekeep
    decisions made by others who build on top of it. It is a permissionless smart
    contract that can be used as long as the blockchain'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'keeps going and and therefore an infinite amount of games or derivative projects
    can be built from it. Many of these derivative projects also let people create
    their own bags of loot without the costs associated with the original Loot and
    only require the payment of the gas fee for using the Ethereum blockchain. No
    single company is able to ban players or control the future development of the
    game, at least without legitimacy, since their smart contracts would be open source
    and copyable, allowing access to anyone. This starts to get close to Jacob Horne,
    co-founder of the NFT marketplace Zara, has termed "hyperstructure".


    In his blog post "Hyperstructures", Horne outlines a new mental model to describe
    how crypto-enabled protocols can create new resilient infrastructure.17 More specifically,
    a hyperstructure is a protocol with some specific properties that run on blockchains.
    It must be unstoppable (it runs for as long as the underlying blockchain exists),
    free (besides the gas cost), valuable, expansive (built-in incentives for participants
    in the protocol), permissionless (universally accessible and censorship resistant),
    positive sum (it creates a win-win environment for participants) and credibly
    neutral. So, while all hyperstructures are protocols, not all protocols are hyperstructures.
    What this highlights is the major difference between using a platform versus a
    protocol. With smart contracts it is now possible to create public economic infrastructure
    as protocols that can run forever and for free, something a platform controlled
    by a generalised company is not able to do.


    For an NFT to go to auction or on sale, it needs to interact with a separate smart
    contract that facilitates the listing and the type of market or auction the seller
    prefers. On many of the most popular NFT marketplaces like OpenSea, the platform
    takes a 2.5% fee from sales made using their smart contracts (much less than 30%
    taken by Apple). Horne''s conception of hyperstructures stems from his work on
    creating Zora, which differs from most other NFT marketplaces in that it takes
    no fees from'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'sales. The Zora smart contracts for creating NFT markets is a type of hyperstructure
    that would continue to exist without the presence of the Zora companies, which
    allows for other entities to make new frontends for artists or collectors. This
    is a different paradigm for content creators used to thinking about platform risk.


    The implications of hyperstructures were tested when the largest NFT marketplace
    on the Tezos blockchain (a blockchain similar to Ethereum in that there are smart
    contract functionalities but using a different programming language) called Hicetunc
    was abruptly ended by its founder. While in most cases this would have meant the
    end of all of the work that was created from their smart contracts, as was assumed
    by many in the beginning, within hours of the discontinuation of the website over
    fifty mirror sites live where artists could continue to browse, mint and collect
    NFTs originally from Hicetunc. Building protocols as hyperstructure helps alleviate
    many of the problems around platform risk for creators.


    This potential to move away from platforms to using protocols on blockchains allows
    for new economic models that don’t rely on the alienating dynamics of the attention
    and creator economy. While platforms like Patreon introduced a new way for creators
    to be paid by their most supportive fans via subscriptions, each creator needs
    to have their own separate page and do marketing for themselves. A very individualistic
    endeavour. Since Patreon makes money from transaction fees that patrons pay to
    creators, the incentives around the platform don’t align with allowing creators
    to more easily collaborate by combining payments. Wishing to take advantage of
    the affordances of blockchains and its potential for a more collaborative form
    of content creation and funding, and realising they had overlapping audiences,
    the podcasters from Inter (co-hosted by Mat Dryhurst), New Models and Joshua Citarella,
    started Channel.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Essentially, Channel is a token-enabled RSS feed that gives access to all of
    the podcasts, including paid premium episodes that listeners would only otherwise
    receive through Patreon.18 An RSS feed is a standardised content distribution
    method that is common for many types of media including newscasts, blogs and podcasts.
    Since it’s standardised, it is interoperable in a way that can syndicate multiple
    media sources into one feed so you don’t have to manually look up each separate
    source of media. Listeners who are interested in the offer from Channel can purchase
    an NFT that includes a digital artwork, and through verifying that they have the
    NFT on the Channel website they get access to the RSS feed that syndicates all
    three podcasts. So, in this context, the NFTs are not just media, they are also
    content distribution and a direct connection to the premium listeners and the
    podcasts. At the same time, the podcasters are able to collectivise without necessarily
    losing the autonomy of their own show. They form a collective or “quad” that doesn’t
    need to compete for the same group of listeners who would likely enjoy all three
    podcasts, greatly reducing the alienation between creators. Along with the RSS
    feed, those who purchased the first NFTs to be released can also directly interact
    with the team behind Channel to make suggestions and steer the direction of the
    project, in turn reducing the alienation between the listeners and the creators.


    The ultimate goal of the project is to build it a hyperstructure that stores subscription
    data and functions as a pseudonym community registry. Assuming it’s successful,
    it’s not difficult to see how this type of setup be used for other types of content
    creators or artists to squad up in collectives rather than trying to compete according
    to the rules set by large tech platforms. It can be a way for creator communities
    to be portable, interoperable and durable in ways that are impossible using existing
    legacy platforms and payment processors.


    For my own content creation for The Blockchain Socialist, while I use Patreon
    for fans to support my work through normal means, I also offer an'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'alternative using crypto. People can access my podcast episodes through most
    podcast platforms, but occasionally I release bonus episodes available only to
    those who support me financially to thank them. While Patreon works for most of
    the time, I know it is a centralised service which could at any point remove me
    from their platform. To not dependent on a single centralised platform for monetisation,
    I also use Unlock Protocol so that fans can purchase an NFT to access bonus episodes
    directly on my website (theblockchainsocialist.com) through token gated posts.


    The NFTs are unlimited supply and can be non-speculative and be purchased by anyone
    for a single monthly subscription price. The NFT is stored in the wallet of the
    user who purchased it and when visiting a token gated page, my website can check
    their wallet to see if they own the NFT. Once the NFT ownership is confirmed,
