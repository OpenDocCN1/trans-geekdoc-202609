- pgno: 186
  md: 'SWIFT, the entity that enables banks around the world to send and receive information
    about financial transactions, is a cooperative society under Belgian law, owned
    by its member banks. Some of the largest banks and agricultural businesses are
    also oops, like Rabobank, Desjardins and Groupe Crédit Agricole.


    Sceptics who may have never come across cooperatives before may ask, how can you
    coordinate a business, which is already difficult, by complicating things with
    democratic ownership? Surely you can''t stay competitive enough if everything
    you needs to be democratically decided on? Well, yes that''s probably correct,
    but that''s not how the majority of cooperatives are run.


    Having every single decision made only through a majority vote by an entire organisation,
    especially a large one, is usually not a great practice. There are many ways to
    run a democratic organisation that don''t require constant consensus and voting,
    something which can lead to burnout or make the process too slow to function effectively.
    While there are many different types of governance structures and philosophies
    in cooperatives, one that is becoming more popular among newer coops is called
    “sociocracy”. In sociocracy, decisions are made through consent rather than consensus.
    Sociocracy does not expect or require full agreement for a decision to be made,
    but instead makes sure that there are no objections by the group. The point is
    that if it is good enough for now, it is at least safe enough to try. Members
    of a soci organisation are able to vote on whether they fully consent to a decision,
    whether they object or whether they disagree with the decision but are able to
    live with it for now. This allows for a more granular type of political expression
    than is commonly allowed in democratic organisations focused on consensus.


    While blockchain protocols commonly rely on consensus between all individual nodes
    to agree on the current state of the ledger, this is a much more difficult thing
    to achieve for human-based organisations. Consensus is'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'simpler when what you are agreeing on is mathematically determined through
    cryptography. So, while blockchains are a kind of decentralised technological
    infrastructure that seek to get out of the dictatorial spaces owned by banks,
    governments and Big Tech, coops are a decentralisation of the workplace and the
    social relationships within it. Consensus for coops requires a process of social
    reasoning and deliberation designed to produce a shared culture and commitments,
    which is inherently more time-consuming than blockchain consensus.


    The most recent evolution of the coop, made for a digital and connected world,
    is the platform coop, an alternative to venture capital-funded and centralised
    platforms, that puts stakeholders before shareholders. The term was coined by
    New School professor Trebor Scholz in a *Medium* article in 2014 that criticised
    the sharing economy.The sharing economy was represented by quickly (at the time)
    growing generalised platforms like Uber, Airbnb and Taskabbit, that were able
    to tap into digital technologies to create new business models based on their
    platforms.


    Platform coops were proposed to give workers who relied on work provided by these
    platforms ownership in the business and direct governance of the platform that
    directs their work, and to provide employee benefits that centralised platforms
    don’t. For example, Proposition 22, recently passed as a referendum in California,
    exempts ride-sharing companies from treating drivers as employees, limiting workers’
    abilities to receive health insurance through the gig works that provide for their
    income. It was reported that Uber, Lyft and DoorDash spent over $200 million on
    the “Yes on 22” campaign, which advocated in favour for these platform companies
    not to consider their drivers employees. Uber and Lyft drivers in California filed
    a lawsuit to overturn the bill, claiming it “illegally” excludes ride-hail drivers
    from the state workers’ compensation program.'
