    # Web 1.0/web1


    The beginning of the internet which was perceived to be largely decentralized
    but users could only visit and read static websites. This stage of the internet
    is believed to be long over. Examples include AOL, Netscape, etc. The exact time
    period and meaning of Web 1.0 (or any of the stages) is generally vague and nebulous,
    but is used to historicize and create content often primarily for marketing purposes.


    # Web 2.0/web2


    In this stage of the narrative, users could now interact with one another through
    messaging, create accounts, and has led to the development of Big Tech which has
    centralized the internet through their platforms that act as “walled gardens”
    and which their business models depend largely on advertisement and invasive tracking
    methods. Examples include Meta, Twitter, Google, etc. While originally the term
    was used as a way to refer to the rise of publicly accessible APIs of various
    platforms, in the context of crypto, that aspect of it has been largely ignored.


    # Web 3.0/web3


    This refers to what is meant to be the next evolution of the internet incorporating
    new technologies like blockchains, artificial intelligence, and others allowing
    for users to maintain more control over their data among other things. Generally,
    this attempt at periodizing the development of the'
