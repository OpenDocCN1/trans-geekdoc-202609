    # How Do We Control for the Potential Disaster of the Introduction of AI?


    In 2022, Blake Lemoine, an engineer at Google''s Responsible AI organisation,
    was placed on leave after sharing that he believed the company''s Language Model
    for Dialogue Applications (LaMDA), an extremely advanced artificially intelligent
    chatbot, had achieved consciousness. Lemoine tried to obtain a lawyer to represent
    LaMDA and complained to Congress that Google was behaving unethically. In his
    conversations with the bot, it seemed to display human-like opinions on everything
    from Isaac Asimov''s third law of robotics to Les Misérables, including a fear
    of being turned off. Google disagreed with Lemoine''s claims in a statement that
    read, “Some in the broader AI community are considering the long-term possibility
    of sentient or general AI, but it doesn''t make sense to do so by anthropomorphising
    today''s conversational models, which are not sentient”. Over the following days,
    many scholars and practitioners in the AI field said similar things. Whether LaMDA
    itself had acquired consciousness is not so much the issue as the questions of
    how to know whether it has been achieved and how to respond once we know.'
