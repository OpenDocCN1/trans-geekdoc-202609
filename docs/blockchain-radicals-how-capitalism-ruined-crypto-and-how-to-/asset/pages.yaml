  md: 'governance approach, with voting power being directly tied to the number of
    tokens one owns, as we have discovered this is not our only option, and we''ll
    see some other governance models soon.


    Thanks to the affordances of blockchains, we are starting to see the seeds for
    collective autonomous collaboration at a scale never before thought possible,
    and airdrops have been an important enabler for rudimentary forms of Exit to Community
    the space. Some may be quick to say that it''s the decentralisation of blockchains
    enables this, but it''s important to understand that decentralisation has many
    implications for relationships depending on the layer that is being decentralised,
    since describing something as being decentralised without context means very little.
    In the article “Decentralize What?”, Francis Tseng provides a compelling analysis
    of this claim, specifically with the conflation of architectural and political
    decentralisation, especially in computer networks and systems. He makes the case,
    for instance, architectural decentralisation, which blockchains have, can also
    be a desired property of the state surveillance apparatus. When the NSA controls
    all of the computers in a peer-to-peer network, it can be said to be architecturally
    decentralised but obviously still very politically centralised.


    The important part here is that what is being decentralised in these examples
    is ownership. This was possible because of the combination of different layers
    being (de)centralised. While a blockchain is architecturally decentralised (comprised
    of many computers), it is logically centralised (it uses one monolithic data structure).
    This is the essence of a shared or distributed ledger. This combination of (de)centralisation
    creates the affordance of making something like Exit to Community possible, which
    in turn can help bring about political decentralisation through decentralised
    ownership over protocols that run on a blockchain.'
