    # Beyond Democracy: Crypto for Direct Action


    The issue of how and whether to engage in electoral systems that are part of centralised,
    non-adaptive systems that characterise traditional democratic institutions is
    an old one that has split revolutionary for centuries. When looking at politics
    through the lens of cybernetics, it’s important to keep in mind what we colloquially
    refer to as “politics” in the electoral sense is not the entirety of the system
    that makes up politics. Those who decide to take action out of their place in
    the electoral system engage in “direct action”. Direct action therefore is the
    term that describes political or economic actions taken in order to directly reach
    goals, either through nonviolent or violent means, rather than appealing to authorities.
    Examples include strikes, sit-ins, property destruction, mutual aid and anything
    else that can help the problem that needs to be addressed or serve to highlight
    alternatives and solutions. There is significant evidence from history that taking
    action outside of the voting booth is one of the more effective ways to create
    political change, as seen in the Civil Rights movement, the labour movement and
    many more that have enshrined human rights for those who previously lacked them.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Politically decentralised organising is not new. Radical groups like the Zapatistas
    in Mexico have practised decentralised community decision-making for much longer
    than any other organisation that we’d call a DAO today.11 We can even find potential
    precursors to DAOs in the digital activism that arose with the growth of the world
    wide web.


    In Hacker, Hoax, Whistleblower, Spy, digital anthropologist Gabriella Coleman
    details the most famous examples of digital direct action — hacks undertaken by
    groups like Anonymous and LutSec, as well as by whistleblower organisations like
    WikiLeaks.12Coleman describes the exploits committed by these “decentralised”
    organisations and the complicated albeit sometimes contradictory politics behind
    them. Although there were many other hacker groups well before Anonymous, they
    brought hacking to the mainstream and signalled a marked increase in digital activism
    and its ability to effect politics. Citing the Arab Spring, the multiple hackings
    of large corporations who form part of the military-industrial complex and Denial
    of Service attacks towards online payment companies that assisted the financial
    blockade of WikiLeaks, Coleman’s research challenges the assumption that all hackers
    are white, middle-class, libertarian males with little political consciousness,
    showing in great detail that while the same technologies and tactics for hacking
    can be used solely for profiteering, they can also be used for digital direct
    action, something often called “hacktivism”.


    With the evolution of the Internet to now include blockchains, direct action has
    also migrated into this arena. When people think of hacking in the cryptocurrency
    space, they often imagine “shadowy super coders,” as Senator Elizabeth Warren
    dubbed them, who are all out to take your money. One of the newer developments
    in hacking that involves cryptocurrency called cryptjacking. This is when a hacker
    hacks into someone else’s computer to use its hardware for mining cryptocurrency,
    making the hackee one to pay for the electricity.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'But cryptojacking can also be used for more radical efforts. Grayson Earle,
    an anti-capitalist American artist and activist, co-developed Bailbloc, a cryptocurrency
    scheme that uses cryptojacking to fight against bail, with The New Inquiry, an
    online cultural and literary magazine. In the US, a bail bond is a deposit of
    money to a court by someone who has been charged as a suspect in a crime, in order
    not to have to stay in pre-trial detention. Essentially, you are held in jail
    before you are even proven guilty and can only get out if you pay a significant
    amount of money. The practice been repeatedly found to be racist and classist,
    since people of colour and minorities are targeted by police at a much higher
    frequency than whites, leading to greater poverty and creating a vicious circle.
    The wealthy are almost always able to make bail, while those who are poor are
    isolated and unable to prepare for a trial that could have drastic consequences.
    Bail has been a target for abolition activists for a long time, and although there
    have been some successes in getting a number of states to eliminate cash bail,
    it is still widely practised.


    Bailbloc allows people to download an app and visit their website in order to
    immediately start donating a small portion of their computer’s unused processing
    power to mining the privacy-centric cryptocurrency Monero.¹³ It’s a simple application,
    and when you open it, the page simply states “YOU ARE NOW MINING FOR BAIL BLOC”.
    It’s designed as an opt-in form of cryptojacking that gives money earned from
    the Monero to bail funds in the National Bail Fund Network. The project blends
    artwork with activism to produce a *détour*, or subversion, of traditional notions
    around cryptojacking with much deeper implications for digital action. As the
    project is open source, it is relatively easy to replicate this model for funding
    other forms of activism. It’s not difficult for other groups to appropriate this
    model to allow their community to engage in digital direct action that helps fund
    other efforts.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Another form of direct action is called mutual aid. Anarchist philosopher Peter
    Kropotkin first popularised the idea in Mutual Aid: A Factor of Evolution, where
    he argued that cooperation, not competition, drives evolution. Mutual aid refers
    to a voluntary reciprocal exchange of resources and services for mutual benefit.
    It is distinct from charity in that it is a form of political expression in which
    people choose to take responsibility for each other’s well-being, rather than
    relying on the state or other institutions. Many supporters of mutual aid argue
    that most charity and non-profit models not only fail to solve systemic issues,
    but actually work to perpetuate the inequality that these systems create. In his
    book Mutual Aid: Building Solidarity in this Crisis and the Next, author Dean
    writes:


    The charity model encourages us to feel good about ourselves by “giving back.”
    Convincing us that we have done enough if we do a little volunteering or posting
    online is a great way to keep us in our place. Keeping people numb to the suffering
    in the world — is essential to keeping things as they are. In fact, things are
    really terrifying and enaging right now, and feeling more rage, fear, sadness,
    grief, and despair may be appropriate. Those feelings may help us be less appeased
    by false solutions and stir us to pursue ongoing collective action for change.


    Mutual aid work, the cooperation between people in a community to meet the needs
    of everyone in that community, acknowledges the failings of the current system
    and creates a new one in response — a network of neighbours looking to each other
    for support. The relationships cultivated via mutual aid, built on interdependence,
    gives us a model for what an ideal, post-capitalist society could look like. One
    of reduced isolation and'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'deeper connection, freedom, safety and reciprocal exchange for mutual benefit.


    Breadchain, mentioned previously, is a post-capitalist project with the aim of
    providing a kind of mutual aid for more progressive-leaning projects in the crypto
    space, not only through the Crowdsaking Application described in a previous chapter,
    but also through the creation of an organised network of aligned projects that
    knowledge-shares and works together to meet mutual needs. With mutual aid being
    one of the main principles behind Breadchain, the goal of the project is to facilitate
    experiments with new technology to explore and create novel forms of direct action
    through the building of solidarity primitives like the B token.


    One of the projects that is part of the Breadchain network is Pact Collective
    — a New York City-based mutual aid DAO that seeks to connect with and mobilize
    neighbors, build coalitions between grassroots organisations, and create sustainable
    institutions of care in the city. The Pact Collective started during the storm
    of the 2020 COVID-19 pandemic and Black Lives Matter protests when people were
    looking for better ways to give to their community outside large national-level
    charities. Pact was formed to allow people to directly support local organisations
    in their communities in New York City through a monthly subscription to Pact,
    who then distributed the funds to on-the-ground local groups working on mutual
    aid.


    Wanting to make the organisation more democratic and give mutual aid activists
    more say, they found that it was not easy to do through the traditional legal
    and financial system. This is when Pact started investigating blockchain and decentralized
    tools. One ongoing project to allow mutual aid organisations to sustain and collaborate
    with each other is PactDAO’s partnership with Breadchain. Through the use of solidarity
    primitives, mutual aid organizations can create systems of mutualistic'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'support to continue their work and create counter institutions in their communities.


    Another highly successful form of direct action throughout the history of capitalism
    has been the labour strike. You can thank labour unions for the existence of weekends,
    holiday pay, sick pay, lunch breaks, workplace safety requirements and much more.
    While many progressives tend to simplistically consider blockchains as something
    purely to work in favour of capital, LaborDAO is exploring the impacts of this
    technology on the labour movement. It was started by Larry Williams Jr, founder
    of the Progressive Workers Union and UnionBase, a social media network for unions
    and their members. Williams believes that the labour movement needs to be included
    in the development of the technology and vice-versa. But why would the labour
    movement need these tools?


