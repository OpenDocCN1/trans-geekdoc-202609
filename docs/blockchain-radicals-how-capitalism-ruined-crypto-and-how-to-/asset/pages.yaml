- pgno: 74
  md: 'Similarly to the way that you may have a bank account with your bank, your
    bank likely has its own bank account with the central bank from which it can take
    out loans at a fixed interest rate which they then loan out to their customers
    at a higher interest rate in order to pay for the original loan. This is handled
    through digital ledgers between the involved entities and regulators. In this
    way, it is actually private banks that “print” most money, not governments. In
    fact, in most “first-world” countries, it is private banks who also facilitate
    digital payments, through private infrastructure, not government infrastructure.


    Central banks are also generally in charge of the distribution of physical money
    (bank notes and coins) in order to help private banks give this form of money
    to their customers, though this makes up a very small percentage of the total
    money supply. Essentially, we have two money systems that as normal citizens take
    part in. The state physical (cash) and the bank digital (numbers on a digital
    ledger) money systems.


    The writer Bret Scott, in his book Cloudmoney, has presented extensive evidence
    of how private banks have been influencing consumers and businesses to be more
    “cashless”, hurting the state physical money system so that private banks can
    have more influence over the money supply and reduce their costs related to dealing
    with cash. Electricity and computers can move faster than a bank teller counting
    cash. This amounts to the privatisation of what was once the nationally formed
    form of money system, since physical cash gives people real ownership over their
