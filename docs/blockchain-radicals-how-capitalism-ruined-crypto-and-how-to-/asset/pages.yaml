- pgno: 233
  md: '# CHAPTER 10


    # RETHINKING POLITICAL SYSTEMS

    AND ACTION


    As the powers of states fade... efforts to pluralize and socialize the rights
    of property must look beyond the public to other means of support.


    > — Michael Hardt and Antonio Negri, Assembly


    On paper, most “Western” countries are liberal capitalist democracies where every
    citizen has the right to vote, and therefore theoretically the outcomes of elections
    and the legislations that are passed into law are democratically determined. In
    practice, however, this could not be further from the truth. In many countries,
    but particularly in the United States of America, bribery is essentially legal,
    it’s simply referred to as “lobbying”.


    In 2014, a Princeton study by Martin Gilens and Benjamin Page investigated groups,
    including average citizens, who had the highest likelihood to have their preferred
    policies into legislation by the US government.¹ They concluded “that economic
    elites and organised groups representing business interests have substantial independent
    impacts on US government policy, while average citizens and mass-based groups
    have little or no independent influence.” They found that the opinions of the
    bottom 90% of income earners have essentially no impact at all on the'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'government policy passed by their representatives. Hardly democracy by anyone’s
    standards.


    A favourable policy only costs a fraction of what wealthy economic and business
    interests earn from, making lobbying a profitable endeavour. The growing influence
    of capital on politics can be seen in the political campaigns of the majority
    of senators and congressmen and women. Elected officials commonly spend 30-70%
    of their time in office fundraising for the next election. They become dependent
    on the money needed to defeat their opponent, pressuring them to pass laws that
    are preferred by their donors. A few, like Bernie Sanders have been able to overcome
    this barrier by running campaigns that prioritise engaging as many of their constituents
    as possible.


    It’s no surprise therefore voting rates in the US, even compared to similar Western
    countries, are so low. When your opinion doesn’t matter to those that represent
    you at the highest levels, why better to express your political preferences? The
    largest political constituency in the country is non-voters, and is generally
    made up of those who are working pay check to pay and simply may not have time
    to vote on a weekday afternoon². The country appears stuck in a downward spiral;
    political institutions are unresponsive as people grow more apathetic and thus
    the institutions become even less responsive in turn. This trend has been seen
    in many developed countries, and it’s this dynamic that has led to the rise of
    populist governments and parties, and has increasingly pushed people into fringe,
    extremist ideologies that flirt with fascism.


    The default left-leaning techno-pessimist’s conclusion is that the only future
    that can be created with blockchains is an ever-more oppressive technocracy, but
    this would ultimately defeatist and ignore the full design space. While not a
    solution by themselves, blockchains when designed and used in intentional ways,
    blockchains and what they enable can help us envision'
