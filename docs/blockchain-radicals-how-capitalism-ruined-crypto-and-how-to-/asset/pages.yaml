  md: 'designs. While the word “blockchain” is never mentioned in the Bitcoin white
    paper, Bitcoin was the first blockchain. Within the code were particular assumptions
    about economics and money which created the impression that all blockchains make
    the same assumptions. However, the modifiability and default open source nature
    of blockchain code makes it just as possible to apply different assumptions.


    But first, in order to understand how Bitcoin and blockchains works, we need a
    top-down view of how most Internet architecture is configured today. In the vast
    majority of applications users are likely to interact with (most of which are
    developed or owned by a Big Tech corporation), the data that they see and manipulate
    comes from servers owned by the company. When we post on Facebook or Twitter,
    or interact with any other big tech company online, we are sending a request to
    those servers. Once that post finishes going through an automated system of approvals
    to make sure the post doesn’t contain anything blocked on the platform, it appears
    on other users’ clients (or apps). All of this takes a couple of seconds at most
    usually. This is commonly referred to as a “client-server model”.


    The implications of this architecture is that these big tech corporations have
    significant control over what information gets displayed. While those on the right
    decrypt corporations for censoring conservative voices in the United States, it
    has also been shown that companies like Google and Meta have censored left-wing
    activists as well. Indeed, prominent figures across the political spectrum have
    been denied access to their accounts for various reasons revolving around adherence
    to the company’s terms and conditions.


    While some argue that these companies have a right to censor who they want on
    their platforms because it is their private domain of business, it is undeniable
    that this has very serious political implications when the Internet is also seen
    as public infrastructure for communication. The client-server model of network
    architecture gives excessive power to the owners of the server (Big Tech). An
    additional issue is that there are single points of'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'failure that, if compromised, can lead to complete outages of communication
    infrastructure that people are dependent on.


    An alternative to the client-server model of architecture is the peer-to-peer
    (P2P) model, where the network infrastructure is not held or owned by a single
    entity but is instead spread out across a network of connected computers or servers.
    Computers on the network have equal permissions and responsibilities for processing
    the data and peers can be both suppliers and consumers of resources as needed.
    This is done largely through the use of open protocols opposed to creating walled
    gardens in the case of Big Tech platforms. While this might sound like a foreign
    concept for some, there''s a chance you have benefited from P2P networks before
    you''ve ever used services like Napster, LimeWire, BitTorrent or any other file
    sharing service to download movies, music or other media. P2P networks have been
    very influential in the media industry and have led to rapid changes in how media
    is consumed. As consumers we''re to gain access to an almost limitless library
    of media for free. This led to a drastic decrease in total profits in the music
    industry from 1999 to 2010 as people bought fewer CDs, and led to the rise of
    streaming giants like Spotify and Netflix. This is a situation which has its own
    problems, but the point is that by using a different underlying network architecture,
    the relationship people had with institutions changed drastically.


    Bitcoin uses a P2P network to try to create a digital monetary system that does
    not rely on current financial institutions or state actors that have control over
