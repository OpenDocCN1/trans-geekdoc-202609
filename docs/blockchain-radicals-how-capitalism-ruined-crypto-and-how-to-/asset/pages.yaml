  md: '“Blockchain Radicals takes you through a part of the crypto space that is very
    different both from its libertarian beginnings and from the money and trading-obsessed
    world of three-million-dollar digital monkeys. An important complement to the
    existing narratives about the technology.”


    # VITALIK BUTERIN, FOUNDER OF ETHEREUM


    “Joshua Dvila lifts the veil on the actual workings of crypto, offering access
    to those working for social justice. The book bucks the lefty knee-jerk norm of
    crypto-aversion. This is important because dangerous power imbalances are addressed
    by social movements armed with the tools of the day, not by critics sitting on
    the sidelines tumbling!”


    # RUTH CATLOW, CO-FOUNDER OF FURTHERFIELD


    “The radical potential of blockchain technology lies not in its ability to replicate
    existing power structures, but in its capacity to enable more collaborative economies
    and participatory governance practices. In this book, Davila engages in a critical
    and nuanced examination of the ways in which blockchains can be used to create
    a more equitable and sustainable society, by challenging rather than exacerbating
    — the extractive practices of traditional capitalism. While the book is written
    for a contemporary audience, its insights are likely to become ever more relevant
    in the years to come.”


    # PRIMAVERA DE FILIPPI, AUTHOR OF BLOCKCHAIN AND THE LAW'
