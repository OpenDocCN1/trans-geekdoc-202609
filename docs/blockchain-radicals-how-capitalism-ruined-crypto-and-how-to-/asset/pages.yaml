    However, at the same time, there are also certain dangers that come with this
    low-friction and interoperable economic infrastructure. The increasing complexity
    of financial products built on decentralised architecture opens up the potential
    for there to be bugs in the smart contract code that can be exploited by hackers.
    In order to limit potential losses, many times the creators of these DeFi apps
    add admin keys that can turn off certain parts of the system in an emergency,
    however this adds a central risk that becomes worse if the admin keys are stolen
    by a bad actor. This is one of many examples of how blockchain projects need to
