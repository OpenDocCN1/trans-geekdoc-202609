- pgno: 181
  md: '# CHAPTER 8

    DAOS AND DIGITAL COOPERATIVES: DECENTRALISING THE WORKPLACE AT SCALE


    Robert Owen’s was a true insight: market economy if left to evolve according to
    its own laws would create great and permanent evils.


    > — Karl Polanyi, The Great Transformation: The Political and Economic Origins
    of Our Time


    “Socialism” became an English word in 1827, when Cooperative Magazine described
    Welsh reformer Robert Owen (1771–1858) as a socialist — an advocate of the view
    that industrial wealth should be owned in common, on a cooperative basis. Owen
    was the first Briton to grasp the meaning of the Industrial Revolution.


    > — Gary J. Dorrien, Social Democracy in the Making: Political and Religious Roots
    of European Socialism


    Decentralisation is an old question that can be viewed through many lenses. In
    terms of government and politics in Europe, the quest for decentralisation can
    be traced as far back as the 1600s and into the 1800s, as multiple kingdoms suffered
    civil and revolutionary wars internally and in'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'their colonies. These conflicts, led by the rising middle class and often supported
    by commoners, questioned the “divine right” of the royalty to rule. In a society
    that was moving further away from its feudal traditions, should the king still
    have as much centralised control? Or should power be more distributed through
    a governing body of many people? Does royalty deserve their centralisation of
    wealth over those they rule? These were important questions for the masses, who
    began recognising their collective power in limited ways as seen in the English
    Civil War and the French Revolution. One of the common arguments against decentralisation
    was, and still is, about the difficulty in coordinating people and resources without
    centralised power, but over time the monarchists lost, leading to more republics
    and parliamentary democracies.


    Jumping ahead to the present, it is easy to say that these conceptions of the
    nation state were flawed, as they led to the oppression of those who did not fit
    within its model, and they were the driving forces of atrocities committed during
    the First and Second World Wars, to give two examples. However, today we do not
    find ourselves in such a different situation from that led to the transition from
    divine kingdoms to nation states in Europe. In 2019, in the United States, it
    was reported that income inequality was the highest it had been since the Census
    Bureau started tracking it in 1967. Since the Great Recession, one of the drivers
    for this wage disparity for the middle class and asset inflation in the portfolios
    of the top 10% of earners due to the enactment of particular monetary and fiscal
    policies.¹ Although there has been a growth in movements to try to overturn and
    disrupt these policies, there are several barriers inherent to the American political
    landscape that need to be removed before significant changes are likely to occur.


    The Internet and digital technologies are one of the more popular ways of promoting
    decentralisation abstractly without seemingly caught up in traditional politics.
    Decentralisation was important especially for the'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'cypherpunks, as it was seen as necessary to decentralise the Internet to prevent
    it from becoming a surveillance dystopia that allows states to listen in the private
    lives of citizens. Looking back now, it''s easy to say their fears have been confirmed,
    but there were contradictions within many of the cypherpunk''s approach, as they
    also advocated free market fundamentalism without acknowledging capitalism itself
    tends toward monopoly and centralisation. Over time, without significant mechanisms
    for redistribution, capitalism centralises wealth and power in the hands of those
    who own capital. And there’s little reason to believe that those who are in the
    upper echelons of power will not fight any attempt to regulate this process. Given
    this, even if redistribution can happen intermittently, because of the process
    of centralisation capitalism entails through the profit incentive and capital
    accumulation, inequality will only increase over time as the rich get richer.
    In this way capitalism is a centralisation machine.


    Some are able to reach extraordinary levels of power through the social relationships
    that define capitalism. This relationship is defined by the ability of the minority
    who own the companies, infrastructure and private property to coerce the majority
    of people who do not own any of these. This relationship is not just an economic
    one, but a power relationship that exists not within one company, where owners
    are essentially miniature dictators by design, but also in aggregate throughout
    society. Those who do not own significant capital are thus exploited for their
    labour; profit represents the wages that are not paid to the workers who created
    the value of the products sold or services that were rendered by the company.
    If someone relies on their labour to make money to survive, they also have very
    little choice but to succumb to “agreeing” to being exploited, because it’s better
    than starvation. Welfare and unemployment benefits may help some, but they vary
    by country and globally we have been seeing the trend of once social-democratic
