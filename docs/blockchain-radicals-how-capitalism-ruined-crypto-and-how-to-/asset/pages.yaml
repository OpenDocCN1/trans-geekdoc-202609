- pgno: 43
  md: '| Blockchain Radicals | a4aa88a0677e1c1e0a8c9bbb-5f2529d72d5a4f46884154e51d-eefb52d50dd0d
    |

    | by Joshua Dávila |


    The properties of a good hash include:


    +   1. It only operates in one direction

    2. It is highly unlikely to generate the same hash twice

    3. Slight changes in the input data significantly change the output


    What you''ll notice in the table is that by making a very small change in the
    input, we can produce a very different output in which there is no way to tell
    that actually both inputs are almost identical. This is because knowing the output
    tells us nothing about the properties of the input. Someone looking at just the
    first three hash outputs would not have way of telling that all three of them
    essentially the same thing in slightly different ways.


    Additionally, we could combine the hashes above to create one hash that holds
    all of these hashes, therefore using half of the space needed to store both. What''s
    also neat is that I could even use a hash to prove I am the writer of this book.
    To keep it simple, let''s say that the entirety of my book is just the title like
    is shown in the last row of the table. I can now append “by Joshua Dávila” to
    the end of that text and create the hash of my book. If this hash is provably
    stored somewhere and I were to notice somebody plagiarising my work, I could recreate
    the above hash which includes the text I wrote along with my name. Since my name
    and the text recreate the hash that existed before the plagiarised version of
    the book, this could serve as evidence against the plagiariser that they are stealing
    my work.'
