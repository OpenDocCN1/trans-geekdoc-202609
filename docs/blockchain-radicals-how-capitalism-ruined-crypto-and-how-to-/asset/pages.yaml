    This development of AI-with-voice still raises novel questions about voice ownership
    that Herndon thinks can be addressed by DAO governance. Based on her model, open
    sourcing her voice leaves the possibility for its noncommercial use, however only
    those who are part of the Holly+ DAO are able to certify and profit from derivative
