- pgno: 36
  md: 'The effects of the Great Recession and the reactions to it can still be seen
    today. Many millennials in the United States who graduated during its peak have
    significantly less wealth and more debt compared to previous generation at the
    same age. In Europe, Greece still has the highest ratio of debt to GDP in the
    EU after more than a decade,³ yet Iceland, a small island country which saw a
    similarly large economic collapse but put many bankers into jail, has seen one
    of the best economic recoveries since then.⁴


    It was into this socio-economic context in 2008 that the Bitcoin paper was introduced,
    in a “cypherpunk” mailing by a pseudonymous account list named Satoshi Nakamoto
    (Nakamoto’s true identity at the moment of writing has still not been discovered)
    who called on other cypherpunks and cryptographers to help them build it.⁵ Cypherpunks
    will be explained in more detail shortly, but then they advocate for the use of
    cryptography, the study and practice of secure and private communications under
    the threat of attackers in which only the intended receiver can know the contents
    of a message, largely through the use of encryption and many advanced mathematical
    theories. Cryptography has become extremely important under late capitalism, for
    example in modern warfare, where it is used to protect secrets from opposing militaries
    and for creating secured networks over the Internet.


    The paper, titled Bitcoin: A Peer-to-Peer Electronic Cash System, described a
    value transfer system that was not reliant on a third party or central authority
    like a central bank, Wells Fargo, Western Union, Visa or any other financial institution.
    If it worked, we wouldn’t need to trust the same banks that had screwed people
    to make money from gambling on subprime mortgages, at least in theory.


    The idea of using the Internet for facilitating a system of transferring money
    between people without the need for banks or governments was not new. One of the
    first attempts at digital cash over the Internet was'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'DigiCash, founded by David Chaum in 1990 and based on his own 1983 research
    paper. The paper detailed a protocol with every proposed element of the Bitcoin
    blockchain except for Proof of Work (more on that later) but did not experience
    the same success as bitcoin. Part of the reason DigiCash didn achieve the same
    success is that it still required banks to adopt it, and few were inclined to
    do so at the time. Based on the technical specifications of DigiCash, a user had
    to trust that the company and the banks would follow through on their transaction.
    This is unlike cash works. When I give you cash, we don''t need a third party
    to make the transaction happen. This makes cash peer-to-peer, whereas DigiCash
    was still an electronic form of money reliant on the company’s servers and banks
    to send the currency, even if there were solid cryptographic protocols that directed
    the system.


    Chaum’s research is said to be a direct inspiration for “cypherpunks”. The term
    was coined by Jude Milhon (or St Jude, as she was sometimes referred to), a civil
    rights activist and cyber-feminist in the 1960s and 1970s, to mean computer users
    who were dedicated to online privacy through encryption. In 1992, a small group
    of cryptographers and early Internet advocates, including St Jude, started the
    Cypherpunks mailing list, which was used as a form to discuss a plethora of different
    topics that revolved around privacy over the Internet, both from a political and
    a technical standpoint. Many of the subscribers to the mailing list went on to
    become open source developers, privacy researchers, entrepreneurs and activists.
    While it is difficult to say where exactly the cypherpunks lay on the political
    spectrum, the people involved could be largely described as civil libertarians,
    with the desire to use technology to get around, or make obsolete, any form of
    censorship that could be imposed by states and governments.


    DigiCash also inspired other early attempts at cryptographic digital currencies
    from other cypherpunks like Hashcash, Bit Gold and B-Money.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Unsurprisingly, then, the release of the Bitcoin source code and start of the
