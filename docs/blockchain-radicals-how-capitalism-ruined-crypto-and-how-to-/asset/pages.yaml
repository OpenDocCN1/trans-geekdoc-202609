  md: 'we actually have free will, the role of nature versus nurture, predestination
    and general questions about how predetermined our lives are. Are the structures
    so strong that we are simply unable to move towards some kind of post-capitalism
    in our lifetimes? Would attempting to change society without the recommended recipe
    of conditions be futile or perhaps do more harm than good? These are loaded questions.


    For the structure maximalist, it is naïve to think that agency is so powerful
    that a single person would be able to make significant changes to politics without
    changing the structure. For the agency maximalist, the structuralist looks like
    the armchair critic or the over-thinker while they are the doer. It can appear
    that at its worst, structure maximalism leads to an immobilising nihilism while
    agency maximalism leads to a naive reliance on voluntary actions.


    What is important to note, however, is that both structure and agency maximalism
    are speculations about how best to go about making political change. If someone
