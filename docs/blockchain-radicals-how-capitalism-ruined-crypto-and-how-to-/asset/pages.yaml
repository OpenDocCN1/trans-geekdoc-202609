- pgno: 192
  md: 'While many of these DeFi protocols were the first types of organisations to
    start working toward becoming a DAO and thus the first to start experimentations
    around governance, it shouldn’t be surprising that many took a skeomorphic approach
    and tried representing something like a voting share with these tokens in order
