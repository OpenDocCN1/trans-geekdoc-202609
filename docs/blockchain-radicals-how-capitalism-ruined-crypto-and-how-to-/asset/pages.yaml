  md: 'Holly+ in perpetuity, even when she is no longer alive, while still retaining
    the exclusive rights to her real physical voice.


    Only time will tell how this experiment goes, but it sheds light on the potential
    of using DAO governance-based blockchains as viable tools for stewarding Internet-native
    assets, including AIs, in a way that doesn’t rely purely on centralised authorities.
    The current ownership models of AI seem to largely lean on trust in supposedly
    well-meaning institutions. While this may work if the institution is trusted by
