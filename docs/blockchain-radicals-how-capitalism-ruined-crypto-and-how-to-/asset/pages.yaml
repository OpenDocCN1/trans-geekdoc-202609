- pgno: 305
  md: 'determinism. Technological determinism is the idea that the progression of
    technology follows its own logic and is the key mover in history and catalyst
    for social change. The term is seen as anti-democratic in academic circles as
    it implies the inevitability of particular outcomes, but deterministic assumptions
    and language permeate the writings of many technology businessmen, the business
    pages of popular magazines and much of the reporting on the subject. This ideological
    power that has been able to gain over the public imagination has led to tech-critic
    Evgeny Moroz has termed “technological solutionism⁶ or the idea that tech alone
    can solve our hard societal problems. However, there is no app that can fix capitalism.
    It''s not difficult to see the truth behind these critiques and thus be wary of
    technologies introduced with extravagant promises like blockchains.


    The rise of tech-criticism is in many ways a much-needed pushback against the
    last few decades of failed promises from the tech industry. However, a valid counter-criticism
    would be that few alternatives are proposed beyond vague appeals for a failing
    state to regulate harder, something which can work in some situations but not
    all. Many times the tech-criticisms ironically veer into a pessimistic techno-determinism.


    In order to summarise a position that seeks to move beyond any complete determinism
    while also acknowledging the structures that do exist, I''d like to coin the term
    “technological probabilism.” It means technological progression can help determine
    what is and is not materially possible, the extent to which social movements are
    coherent the scales towards particular outcomes. In other words, it''s up to save
    ourselves collectively, and seizing these technologies, albeit in the perhaps
    problematic and undesirable state in which they currently exist, should be part
    of a coherent strategy for political change. I think the first of the historian
    Melvin Kranzberg’s six laws of technology is particularly relevant here: “Technology
    is neither good nor bad; nor is it neutral.”⁷ In Donna'
