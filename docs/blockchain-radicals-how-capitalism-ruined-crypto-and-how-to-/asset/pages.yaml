- pgno: 129
  md: 'The commons are not simply freely available natural resources, however, but
    are defined and regulated by social systems. Ostrom argues that such social systems,
    or “communities”, enable the commons to be regulated. They define rules of access
    and norms of common property, and enforce these rules and norms collectively.
    Based on her research, Ostrom outlined eight principles for managing a commons
    that most successful communities that have managed a commons follow:


    +   1. Define clear group boundaries.

    2. Match rules governing use of common goods to local needs and conditions.

    3. Ensure that those affected by the rules can participate in modifying the rules.

    4. Make sure the rule-making rights of community members are respected by outside
    authorities.

    5. Develop a system, carried out by community members, for monitoring members’
    behaviour.

    6. Use graduated sanctions for rule violators.

    7. Provide accessible, low-cost means for dispute resolution.

    8. Build responsibility for governing the common resource in nested tiers from
    the lowest level up to the entire interconnected system.


    Following these principles helps solve the free-rider problem, where group members
    that don''t actually participate in the work can nonetheless benefit from the
    wider collective effort. This is not just a problem for the governance of commonly
    held resources, but also in organisations like labour unions. I mention labour
    unions because they are an example of a type of organisation that does not fit
    neatly into the category of private (with the purpose to make profit in order
    to survive) or public entity (they are not run by the state). Labour unions are
    similar to a commons, with the defined group boundary being in a certain industry
    or company.'
