    a few hiccups and controversies in the governance of the ENS DAO and it is not
    completely a liquid democracy, the seeds are there and some missteps in governance
    should be expected in such a new technological medium.


    The truth is, the crypto space is a breeding ground for many new democratic mechanisms
    that have never been tried before, many of them near impossible to try something
    like a blockchain. In the framework of a feedback control system, these new voting
    mechanisms allow for a more expressive measurement to be taken of people’s preferences
    so that the rest of the feedback system can act accordingly with new information.


    Thinking through the concept of governance surface, one of the biggest differences
    between DAOs and other types of systems, including political systems, is that
    DAOs are generally more legible. When the field of action and possibility for
    your organisation is defined by smart contract code, your governance surface is
