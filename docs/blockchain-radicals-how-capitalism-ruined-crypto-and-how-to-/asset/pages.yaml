- pgno: 323
  md: 'Smart contracts can only refer to data that is recorded on the blockchain that
    it exists on top of. This limits the functionality for smart contracts that need
    inputs that are off-chain. Oracles are APIs that retrieve data from an outside
    data source to be used in a smart contract. Oracles can be centralized attack
    vectors depending on how they are designed and so need to be used and designed
    carefully.


    # Peer-to-Peer (P2P) Network


    An infrastructure or technology in which two or more computers are connected in
    order to share resources as opposed to a client-server network in which clients
    request data from centrally owned servers. Napster, Limewire, and BitTorrent are
    examples of P2P networks used for file sharing. Blockchains are P2P networks largely
    for tracking value of some kind. P2P networks are generally considered to be more
    decentralized than client-server networks. The internet was built on top of what
    could be considered a P2P network, leading many to believe in the beginning that
    it would be unenclosable by corporate interests, but this has clearly been disproven.


    # Proof of Stake (PoS)


    A consensus mechanism in which a special subset of nodes called stakers have the
    power to validate transactions and create blocks by "staking" a certain amount
    of cryptocurrency as collateral for maintaining their node online and earn more
    cryptocurrency when selected to add a block to the blockchain. A staker can also
    lose their collateralized cryptocurrency if their node is not online when chosen
    to add a block. Using PoS is thought to be at least 99% more energy efficient
    than PoW as it does not rely on large amounts of computation to reach consensus.
    Many blockchains have been using PoS as their consensus mechanism for some time
    now like'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'Cosmos Tezos, and recently Ethereum switched from PoW to PoS in which its total
    energy use fell by 99%.


    # Proof of Work (PoW)


    A consensus mechanism in which a special subset of nodes called miners compete
    with one another to solve a hash equation by exerting energy in order to earn
    the right to add (also referred to as mining) a new block on the blockchain and
    earn cryptocurrency (providing an economic incentive to mine). It is the consensus
    mechanism used currently for Bitcoin and uses significantly more energy than PoS.


    # Smart Contract


    A program on a blockchain that automatically executes once a predetermined condition
    is met, allowing cryptocurrencies and tokens to be programmed. Ethereum was the
    first blockchain network to show smart contracts were possible. A major reason
    for using smart contracts is to create decentralized applications (dapps) that
    use them as the backend but also more generally as a way to enter into automatically
    executable agreements between different parties. They should also be seen as social
    agents in themselves that can have many types of logic embedded in them.


    # Stablecoin


    A cryptocurrency who''s price is pegged to a stable outside asset like the US
    dollar, a commodity like gold, a basket of different assets, or even to another
    cryptocurrency to prevent its price from being volatile. This is not only a useful
    thing for traders so that they can move in and out of volatile positions, but
    for anyone who would want to use cryptocurrency without'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'needing to worry about big changes in price relative to the underlying asset
    being pegged. Most popular stablecoins try to stay pegged to the US dollar. There''s
    a few different ways stablecoins try to keep their peg including over-collateralisation.


    # Token


    Although it is commonly used to refer to purely financially-based cryptocurrencies,
    tokens can be seen more abstractly to represent many different types of values
    based on their designed use. While “native” cryptocurrencies like bitcoin and
    ether are tracked through their consensus mechanisms and blockchain network, tokens
    are generally created and tracked on top of a blockchain with that functionality,
    like Ethereum. Examples include social tokens to access a community, governance
    tokens for voting, utility tokens to access particular functionalities in a decentralized
    application.


    # Wallet


    This refers to the “place” where your cryptocurrency would be held however it
    is not exactly a place at all. Using various kinds of one-way algorithms and functions,
    a blockchain allows someone to own cryptocurrency or anything else built on top
    of it key pairs, referred to as a private and public key, which are essentially
    a random string of numbers and letters. The public key is usually what people
    mean by wallet because it is something you can share with anyone without any risk.
    The private key gives access to your wallet because if put through the appropriate
    algorithms, it will create the public key. What is important is knowing the public
    key, gives you no way to know the private key. Therefore, you should NEVER share
    your private key. Proof of knowing your private key gives you access to the assets
    associated with the public'
