- pgno: 199
  md: '# Worker Cooperatives on the Blockchain


    Some may be surprised by the influence of cooperativism in the blockchain space,
    but for others it was an obvious connection. In the early days of DAOs, during
    and even shortly after the infamous hack of “The DAO” on the Ethereum network,
    there were very few, if any, accepted software tools and smart contract standards
    for actually starting a DAO. During the ICO boom of 2017, there were very few
    dapps built out for people to use their ether cryptocurrency other than investing
    in ICOs. This was the case for Or Shimoni in 2019 when he first co-founded dOrg.


    While most attempts at DAOs before it were largely “decentralised” investment
    firms, dOrg was the first attempt at creating a DAO that provided services as
    a business. dOrg is a full-stack development collective that helped build some
    of the largest crypto applications on the market today and it works similarly
    to a workers’ cooperative. Every official employee at the company owns one share
    of the company’s Vermont LLC. It was also the first legally recognised DAO in
    the United States. By completing projects for the company, you accumulate tokens
    and can use them to vote on company decisions. In a world where venture capital
    is everywhere, dOrg has managed to never need to raise any money, preventing any
    dilution of ownership that would otherwise have occurred.


    Although co-founded the organisation, Shimoni holds no official leadership title
    and instead prefers taking a more fluid approach to positions in general. When
    a project is commissioned, a call is made internally in the DAO to see who, with
    the skills needed, is available to work on it. Once the people have been decided
    on, they create their own multis for collecting payment from the commissioners
    of the project and for paying out those who are working on the project, with a
    percentage of the revenue also sent to the DAO. Depending on the project, people
    can assume different roles, and although there are no bosses, there is a natural
