    # Holochain: Agent-Centric Data Architecture


    One of the most popular non-blockchain DLT projects being developed is called
    Holochain. Although it has “chain” in the name, Holochain is a DLT that uses a
    different architecture from a blockchain. Holochain is an end-to-end open-source
    P2P application framework, which means that similar to the Ethereum or Cosmos
    blockchain framework, you can build decentralised applications on top of it. Before
    going into the technical details of Holochain, it’s important to understand the
    philosophy it has developed from, heavily influenced by the work of the MetaCurrency
    Project, which has proposed a re-framing of the way we think about currencies
    after its members worked for decades on alternative currency systems.


    In the MetaCurrency philosophy, currencies are records of current or flows of
    value that are sometimes denoted by symbols. In this way, currencies are a form
    of information that act as the records of flows of value broadly defined. Contrary
    to popular belief, for MetaCurrency, currency is different from money and does
    not have to have “intrinsic value” in the form of gold or some other commodity.
    Currencies are “formal symbol systems which shape, enable and measure currents
    which allow communities to interact with those currents.” A better way of thinking
    about currencies is instead as “currentisees”.


    Using their definition of currencies, money is just one type of currency which
    is a flawed and limited measure of value since its focus is purely financial.
