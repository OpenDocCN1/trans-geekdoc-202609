    The concept of a zero-knowledge proof describes how one party (the prover) can
    prove to another (the verifier) that a given statement is true without revealing
    any additional information about the statement. Zero-knowledge proofs are generalised
    by the fact that it is trivial to show that one possesses knowledge of something
    by just revealing it. The difficult part is proving such possession without revealing
    any information that is irrelevant to the verifier. The classic example to explain
    this type of cryptographic proof is when you give your identity card to a bouncer
    in front of a bar. The only thing that the bouncer needs to know is that you are
    of legal drinking age, however by giving your identity card you are also providing
    them with a lot of extra information that they don’t need, like your exact birthdate,
    place of birth, etc. Using a zero-knowledge proof would be a way for you to be
