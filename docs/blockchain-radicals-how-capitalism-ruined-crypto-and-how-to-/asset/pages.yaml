  md: 'not possible for something trying to create a monetary system in which people
    need to be confident that it won''t be hacked or destroyed by a bad actor. The
    way Bitcoin solves this is through economic incentivisation using a cryptographic
    competition utilising hashes that helps keep the network secure from direct manipulation.


    A hash is a cryptographic function that can take any sized input and create a
    corresponding fixed sized output. What’s different about a hash compared to other
    types of functions though, is that it only goes in one direction, meaning if you
    have the input, you can easily produce the output, but by knowing the output,
    you cannot say what the input was. It is one way in which messages or data can
    be hidden inside another piece of data without others knowing what is about being
    hidden. In the table below you''ll see that for each input for the SHA256 hashing
    algorithm, we get a radically different output with relation to one another.


    | Input | Hash Output |

    | Blockchain Radicals | 1c402875f66d1284ca0fa601a534d30b3110df7f6c2dd903f66383c-d42a87991
    |

    | Blockchain Radicals! | f5a53722dfbc322b48b3ba70c98ab-23f78e688dc71a72257fbcb8cd-b614a0
    |

    | blockchain radicals | df9811e7faec6a3a62783dc-c274e35140268f33038cdfe-3830a67bcd720249a
    |

    | (Combination of the three hashes above) | ca11a8c0a3480358a421551e6f-e7358891c9d88bca1e228b4cec-50f3ae5f2051
    |'
