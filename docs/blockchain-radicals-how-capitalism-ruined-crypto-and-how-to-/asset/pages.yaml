    After a white paper was published, there would be a marketing campaign to advertise
    the new token to potential investors, generally through the Internet, and a time
    would be set for when the ICO smart contract would become open for investment.
    Once the ICO started, investors could give ether in exchange for an equivalent
    amount of the token being offered. The amount of tokens received would usually
