    contracts allow for ex-post resolution through courts and arbitration. All contracts
    are incomplete due to the existence of future uncertainty.


    Programmers looking at the legal text of contracts may bark at the (intentional
    or not) ambiguous logic or unenforceable specifications common to them, but that
