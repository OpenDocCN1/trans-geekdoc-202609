- pgno: 132
  md: 'The system is launched in two stages: the Hatch Phase and the Open Phase. In
    the Hatch Phase, the first contributors to a community start a crowdfunding based
    on set initial parameters (like hatch tribute, hatch price, and exit tribute)
    for the bonding curve, This allows those without much financial capital to still
    be able to take part in the crowdfunding and the parameters can be set so that
    those who can only contribute through their labour still receive a share. Depending
    on the parameters set, a lockup period begins where the initial tokens minted
    from the hatch are slowly vested to contributors to combat potential early speculation
    that would hurt the stability of the price. When the Open Phase begins, anyone
    is able to take part in the CMM to purchase the new tokens while also contributing
    to the common pool.


    The design space for CMMs is much wider than I can possibly detail. On the Commons
    Stack''s website, you can simulate the potential results of a hatch with the parameters
    you''ve chosen to tadCAD, a simulator built by their research partners, BlockScience.12
    However, to make it more comprehensible, let''s look at how the Token Engineering
    Commons (TEC), the first community to work with the Commons Stack, took advantage
    of a CMM for their initial infuse.


    The TEC is a collective of people who are interested in token engineering, a cross-disciplinary
    field of study that combines cryptography, political science, economics and cybernetics,
    to name a few, and in advancing it as a science. It asks us the questions, "What
    if we could create our own economies? How would we design them if we could do
    it intentionally together?", while also providing the tooling necessary with blockchains
    and smart contracts, like CMMs. The TEC is particularly interested in using token
    engineering for creating the standards and open-source tools for building stable
    commons-based economies inspired by Ostrom''s principles. The purpose of using
    a CMM to bootstrap its community is to be able to fund projects from within the
    community that'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'discover, develop and proliferate best practices for engineering safe tokenised
    economies.


    To prepare for the Hatch Phase, members of the community came together and took
    part in parameter debates in which they discussed parameters for their CMM they
    wanted to build to understand the trade-offs and risks. The chosen set of parameters
    included a Minimum Funding Goal of $800,000 worth of cryptocurrency with a funding
    period of thirty days. If the goal was not met, all of the funds would be returned
    to contributors and the Hatch Phase would need to restart. They successfully successfully
    met the target and raised approximately $1,571,223.57 in the thirty-day period
    and vested the appropriate amount of TEC tokens over time. The tokens allowed
    the hatch participants to be able to vote on new proposals for the community using
    the funds raised in the common pool or to be swapped back for some amount of cryptocurrency
    through the CMM.


    What''s interesting to note about this example is that against the free market
    fundamentalist underpinnings of Szabo''s idea of smart contracts, the smart contract-based
    mechanism helps the commons by *reducing* the effects of an unrestricted free
    market. Where capitalism was birthed from the enclosure of the commons and the
    imposition of private property legal regimes to create new markets, here we are
    seeing attempts to reinvigor the commons commons tools that crypto hypemen and
    gatekeepers will declare are meant only for capitalism. At the same time, the
    burgeoning field of token engineering blurs the line between markets and economic
    planning, to the dismay of Szabo. The idea of intentional economic design looks
    more like the experimentation under Cybersyn, the decentralised economic planning
    system implemented under Chilean socialist president Salvador Allende with the
    help of famous cybernetic Stafford Beer, than it does laissez-faire libertarian
    capitalism. The common pool of funds raised through a CMM also looks more like
    a non-state-based social wealth fund then it does an ideally libertarian free
    market.'
