    # Social and Technological Relationships: A False Dichotomy


    While for some may be disconcerting to think using a technological medium as a
    basis for socially relating to each other as humans, humans have been using technology
    as a mediator for our social relationships and as an extension of our selves for
    millennia. The Internet has been an extension of our ability to communicate with
    one another, just like the telephone, telegraph and writing letters on paper before
    it. Sometimes those who take a default tech-critical or pessimistic view like
    to proclaim thattechnology can’t solve our problems” and that it’s all about social
    relationships around the means of production. While this sentiment is understandable
    and not untrue in and of itself, it can lead to the idea that social and technological
    relationships are somehow completely separate from one another. It’s not about
    social versus technological relationships,'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'but socio-technological relationships in which both interact with one another.


    If we recall from the first chapter, most platforms and services we use over the
    Internet run on a client-server model for IT architecture. Within this technological
    arrangement, users must use clients or applications that can interact with generalised
    servers owned by large corporations. The technological relationship between the
    computers, devices, and servers facilitates a particular social relationship in
    which there is clearly a hierarchy between the company who owns the data, including
    much of your personal data, and you as a user.


    P2P architecture helped facilitate a new kind of social relationship, as seen
    with file-sharing services like Napster and Limewire where anybody could use their
    computer as a server to share files without permission with anybody else who wanted
    to download them. Even though the programs were shut down after long legal battles
    with media companies who wanted to control their intellectual property, decentralising
    music distribution still had a profound effect on the music industry.


    According to the Recording Industry Association of America, from the 1980s to
    about 1999 (when Napster was released), the music industry was growing in total
    revenue at a steady pace, peaking at about $20 billion. The emergence of Napster,
    however, triggered a steep decline, cutting music revenues in half within the
    next fifteen years that people didn''t need to purchase overpriced CDs to get
    their music. Over time the market responded with the iTunes Store and Spotify,
    which took the basic premise of Napster (access to limitless music), but with
    a better user interface for a monthly subscription and no fear of being charged
    for downloading music illegally. At the same time, this has changed how musicians
    are able to release music, are treated and paid. Artists only received an average
    of approximately $4,370 per one million streams on Spotify in 2022. Here we can
    see how new technical structures create new possibilities for'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'facilitating social relationships that were not possible before, whether for
    better or for worse.


    We can say that this relationship also exists in the opposite direction. The structure
    of a standard corporation is usually very hierarchical and like a pyramid, compared
    to a cooperative, which is much flatter hierarchically (and in wage differentials).
    The way that people in the two different organisations relate to one another is
    different, given that cooperatives require more democratic participation. At the
    same time, for many industries, in order to be able to compete, the use of digital
    technologies is a necessity for any number of functions. However, the vast majority
    of software meant for businesses is created with the social relationships of corporations
    and not cooperatives in mind, making it difficult for cooperatives to find the
    appropriate tools. This is because technological relationships help facilitate
    social ones. This was observed by the New Zealand-based cooperative Enspiral.
    Based on their experiences as part of Occupy Wall Street, they realised that there
    few any software tools out there that could allow for democratic deliberation,
    voting and so on. In response they developed a tool called Loomio which helps
    facilitate democratic participation in organisations. It''s now become popular
    among many types of democratic organisations, including cooperatives who wish
    to take advantage of the digital while staying true to their principles. This
    highlights that social and technological relationships cannot be cleanly separated
    from each other. The technological and social are intertwined in such a way that
    it makes more sense to refer to the totality of the system as socio-technological
    relationship.


    # Exit to Community


    This framework can thus be broadly applied to the technological architecture of
    a blockchain and the social relationships it is able to facilitate. A big difference
    between blockchain-based identity versus your'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'identity on legacy tech platforms with client-server architecture is that a
    company does not own your identity or the data that is produced from your account
    (your wallet). This means that the assets that you would own on a blockchain medium
    are yours to control, compared to client-server-based mediums that require a company
    to give you access to your assets. Let''s use the example of “Exit to Community”,
    a term first created by Nathan Schneider, journalist and Professor of Media Studies
    at the University of Colorado, who wrote extensively about his experience at Occupy
    Wall Street and collaborated with Scholz in organising the first platform co-op
    conference.¹⁰ He wrote the first book mentioning platform cooperatives, Everything
    for Everyone: The Radical Tradition That Is Shaping the Next Economy, in 2018.


    Exit to Community was first proposed in September 2016 by Schneider in an article
    in the *Guardian* calling for Twitter to be converted into a platform coop so
    that the most active users would have the ability to vote on things like how their
    data is monetised and community moderation.¹¹ As stands, most start-up founders
    have two choices in order to get a payout for building a digital platform: IPO
    on the stock market or a buy-out from a larger company. Exit to Community is an
    alternative strategy in which founders can give or sell ownership shares of the
    digital platforms to the community that uses it. Users can purchase the shares
    in small amounts rather than selling most of their business to venture capital
    firms as many platforms have done.


    There were many different reasons why the campaign for Twitter to undertake an
    Exit to Community wasn''t successful, although there was little reason to believe
    that it would be. The article was largely meant to be a way to use a moment when
    Wall Street was hesitating on the platform to share the idea of an alternative
    ownership model. The transactional costs that were needed to organise all of the
    current investors as well as all of the users of Twitter to become stakeholders
    of the platform, and the highly'
  merge: -1
  img_proc: true
