    Despite the previous chapter’s focus on the hype around cryptocurrencies and the
    use of Bitcoin to give money to entities under financial blockades, this book
    is not really about money. Although much of the marketing around cryptocurrencies
    has revolved around a particular critique of monetary systems with the conclusion
    that cryptocurrencies like bitcoin are “better forms of money”, it’s clear that
    this does not hold up under scrutiny. To dig into this, let’s try to understand
    at a high level what money is and how it functions.


    First of all, money is pervasive in modern capitalist society. Unless we live
    off-grid on self-subsistence farms or have the ability to live very alternative
    lifestyles, we need money to be able to buy food, pay for housing, pay taxes,
    bills and get access to the other things that make life'
