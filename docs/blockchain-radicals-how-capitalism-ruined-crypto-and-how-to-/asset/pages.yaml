    Soon after, an open letter was published by someone claiming to be the attacker,
    stating that the funds they took were “legally” since “code is law” (which was
    also a tag line used for The DAO), therefore it was in accordance with the rules
    stipulated by the smart contracts. As tensions rose, it was proposed by the leadership
