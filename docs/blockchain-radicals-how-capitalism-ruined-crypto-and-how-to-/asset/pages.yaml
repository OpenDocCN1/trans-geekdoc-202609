- pgno: 49
  md: 'This entire process makes it extremely difficult to change the balances of
    users on the Bitcoin network by bad actors. Let’s say miners on the bitcoin network
    are working on block #400 and you made a very large transaction back on block
    #100 that you want to reverse. In order to accomplish this, you would need to
    re-mine block #100 as well as all of the blocks between it and the most current
    block being mined by all the other miners on the networks and then beat the other
    miners on mining the most current block to broadcast to the rest of the network.
    This is because nodes on the Bitcoin network default towards the largest chain
    of blocks that is shared with them. However, in order to achieve this practically,
    you would need to have more than half of the total hashing power of the rest of
    the network, which would not only be extremely expensive but require a significant
    amount of energy that few have access to. This is called a 51% attack, which becomes
    much more difficult to pull off the transaction desired to be changed falls further
    behind the current block of transactions being minded.


    Bad actors are disincentivised to cheat the Bitcoin network because if they were
    to pull off such an attack, the price of bitcoin would very likely fall since
    it would be proven that the network is not as safe as believed. Therefore any
    bitcoins stolen would lose their value significantly, making their heist less
    valuable. Of course this may not be as much of a concern if the bad actor did
    not care for the price of bitcoin and instead had the intention of throwing off
    the network.


    Another important thing to note about how Bitcoin works is that in the design
    of the protocol, new bitcoin is minted at a fixed rate that decreases over time
    until there is a total of 21 million, at which point no new bitcoin will ever
    be created. This means that over time, bitcoin has a deflationary effect (theoretically
    becomes more valuable) and has similar properties to gold that there is in a limited
    supply that can exist. In the context of the 2008 financial crisis, “too big to
    fail” banks were receiving bailout'
