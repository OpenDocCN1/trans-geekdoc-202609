- pgno: 138
  md: 'Protection Bureau in 2010. Originally a conservative Republican, as she believed
    they were the party that best supported markets, she switched parties in the mid-1990s
    in the belief that it was the Democrats who now did.


    While certainly not a conservative libertarian, it is clear that Senator Warren
    believes in markets under capitalism as the optimal system for allocating resources
    in the economy. Her politics essentially advocate for a slightly more progressive
    and regulated capitalist economy, a position which would be considered centre-right
    liberalism in many other countries that are not the United States. From a point
