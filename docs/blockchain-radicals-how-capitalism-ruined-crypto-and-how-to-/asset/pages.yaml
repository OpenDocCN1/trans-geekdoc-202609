  md: 'While the practice of ICOs was already quite common before smart contracts,
    and Ethereum itself did do an ICO to raise funds in bitcoin to start its development,
    the bar at which people could start an ICO technically became much lower through
    smart contracts. In an environment in which there is very little regulation and
    a lot of money to be invested, it is unsurprising that this became a hotbed of
    crude scams. Nefarious actors could raise capital solely through a white paper
    that detailed an application that would theoretically become essential infrastructure
    for the future without ever building anything because there were enough people
    wishing to invest. Often the nefarious and sometimes completely anonymous actors
    that led these ICOs would disappear along with all of the ether that was raised,
    leaving investors with a bunch of useless tokens. No context was built for some
    of these tokens, leaving them empty and valueless.


