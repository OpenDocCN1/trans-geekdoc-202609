    # Web3 and the Metaverse


    A common way to make new concepts, memes or trends understandable to an audience
    is by historicising them, or placing them within an often oversimplified narrative
    account. In mainstream media, you may have come across the term “web3”, or the
    suggestion that we are now at a third rendition of the Internet, one that is heavily
    influenced by blockchains and other decentralised infrastructures and protocols
    like IPFS. While largely synonymous with what people were calling “crypto” before
    the time came about, web3, like its predecessor **web2**, is an attempt at a periodisation
    of the Internet. A summary of the story goes usually something like this:


    web1 = read


    web2 = read and write


    web3 = read, write and own


    Famously, in 1995, when explaining the Internet on *The David Letterman Show*,
    Bill Gates described it as a way to find others who have the same unusual interests
    as you.¹ He not foreshadowed the rise of social media platforms, but he conveniently
    left out that these digital spaces would never be designed to be co-owned by those
    that used them. **Web1** was the beginning of the Internet, which was perceived
    to be largely decentralised, but its users could only visit and read static websites.
    In Web2, users could now interact with one another through messaging and create
    accounts, which led to the development of Big Tech, which centralised the Internet
    through platforms that act as “walled gardens” and with business models mine'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'that depend largely on advertising and invasive tracking methods, like Meta,
    Twitter, Google, etc. While originally web2 was used as a way to refer to the
    rise of publicly accessible APIs of various platforms, in the context of crypto
    that aspect of it has been largely ignored. Web3 is meant to be the next evolution
    of the Internet, incorporating blockchains so users can have more control over
    their data and the ability to own the protocols over the Internet.


    While there is some truth to the story, this attempt at historicising the development
    of the Internet is largely a simplified narrative used for marketing purposes.
    Indeed, it largely seems to be a way to talk about crypto-enabled tools, projects
    and companies without using the word “crypto”, a term which, for many, has a negative
    connotation. The term “Web3” was originally coined by Gavin Wood, a co-founder
    of Ethereum who is now focused on his own crypto project, Polkadot. This is generally
    why in this book I have preferred to use the term “crypto” in order to fully acknowledge
    that I’m talking about cryptocurrencies and blockchains.


    While tokens have the potential to provide users with much more ownership of protocols,
