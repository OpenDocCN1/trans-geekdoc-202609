    a “bonding curve” to always have a known price. In a bonding curve, the relative
    price of the assets in the liquidity pool are determined by the ratio of supply
    of each asset in the pool. For example, in a liquidity pool for Josh Coin and
    ether, if there are two times as much Josh Coin as is ether in the pool, then
