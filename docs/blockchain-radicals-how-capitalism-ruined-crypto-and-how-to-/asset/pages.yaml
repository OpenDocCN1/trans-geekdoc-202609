    for this is because the state is able to provide certain assurances that blockchain-based
    systems still are not able to the event of a hack or misuse of funds. Many investors
    and those who engage in these systems are right to be sceptical that smart contracts
    can protect them, considering the known risks associated. In spite of all this,
    there will still be some who attempt to resolve these contradictions.


    One such attempt is the project Kleros, a cooperative that received funding from
    the European Commission''s Horizon 2020 grant programme, which looks to creating
    a decentralised court for arbitration and dispute settlement for the crypto economy.
    In essence, it is a platform that allows individuals to form a variety of mutual
    agreements that are also accompanied by a course of action and arbitrated by neutral
    parties in the event of a dispute. Through the use of game theory and cryptoeconomics,
    the smart contracts can factor in human subjectivity and discourse. This is facilitated
    largely through the use of their Pinakion token (PKN), inspired by the token used
    by Ancient Athenians to draw jurors for their popular trials.


    Using Kleros, people who enter into an agreement have the option to raise a dispute,
    for example claiming another party did not fill their end of the deal. Rather
    than trying to automate every possibility, the agreement can be completely based
    on text, similar to legal code, and the smart contract code would refer to the
