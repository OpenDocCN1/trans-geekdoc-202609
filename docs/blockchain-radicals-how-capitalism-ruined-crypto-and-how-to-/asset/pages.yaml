  md: '# CHAPTER 12


    # ALL CHAINS ARE NOT CREATED EQUAL


    Rather than trying to make one global, anonymous, digital cash (“One ring to rule
    them all…”), we are interested in the resilience that comes from building a rich
    ecosystem of interoperable currencies.


    > — Arthur Brock, Beyond Blockchain: Simple Scalable Cryptocurrencies


    Throughout the last two sections of this book, with a few exceptions, I’ve focused
    on projects built on the Ethereum blockchain. That’s because the newest innovations
    in the cryptocurrency space that I’m interested in started there — it was the
    first to utilise smart contracts, and its native cryptocurrency, ether, is second
    in market cap size to Bitcoin. This, however, should not be taken as an endorsement
    of all the projects built on Ethereum, or even the exact protocol design of Ethereum.
    For anyone who has used the Ethereum Mainnet during 2020, one of the issues Ethereum
    has had is with scaling its transactions. Making a transaction with a smart contract
    on the Ethereum Mainnet can at times be be prohibitively expensive, to the degree
    that the only activities that take place on it are very high-value. Essentially,
    the crypto rich crowd out the.


    Ethereum is not the only blockchain to have this problem. All cryptocurrency projects
    that have had any amount of popular use have'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'issues with scaling their protocol to be able to handle the necessary amount
    of transactions needed if the blockchain is to fulfil its promises. From 2014
    to 2017, the Blocksize Wars rocked Bitcoin as the community was split on whether
    to increase the 1MB block size limit so as to increase the amount of transactions.
    Ultimately, the limit stayed, a win for more conservative-minded bitcoiners. However,
    as it stands, popular cryptocurrency blockchains can output only a fraction of
    the amount of transactions done by credit card companies and other types of financial
    service entities, albeit at the cost of centralisation.


    There are a few different camps in regards to this issue, and each of them comes
    with a preferred technological specification, along with a vision of how decentralised
    technologies like blockchains should be used. While on the surface it may look
    like different people competing to “shell their bags”, if we peer deeper, we can
    see that each of these different proposed technical infrastructures (which commonly
    have an associated cryptocurrency) have socio-technological political implications
    that create new social possibilities. Even though it’s common to hear hypen in
    crypto proclaim they are not political or don’t want politics in crypto, this
    is simply unavoidable.


    Each architecture of these decentralised technologies gives, in a real materialist
    sense, a different way to coordinate with each other in order to reach consensus.
    This difference in how you are able to coordinate via the protocol thus projects
    political tendencies that may or not correspond to tendencies along our present
    political spectrum. For example, we have seen that Bitcoin’s focus on immutability,
    digital metallism and very little governance space attracts people with political
    tendencies that find those qualities desirable, i.e., right-wing conservative
    libertarians. After the DAO hacked early in its existence, many bitcoin-maximalists
    left Ethereum as it showed that strict immutability along the lines of “code is
    law” was not something the larger community would'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'adhere to. This has made the culture and politics around Ethereum much less
    dogmatic and more open to experimentation. It’s very likely that the functionality
    of smart contracts existing on Ethereum rather than Bitcoin has heavily influenced
    political lines being drawn between the two blockchains. This is not to say that
    Bitcoin is right-wing and Ethereum is left-wing, but Ethereum has a more open
    political culture in comparison to Bitcoin. There are still plenty of libertarians
    in Ethereum, they just tend to be more nuanced.


    As we near the end of the book, I want to go through some of the different camps
    professing visions for scaling blockchains and distributed ledger technologies
    (DLTs). These different visions of how to scale transaction speed have various
    socio-political implications, and while we don''tt have the space or time to fully
    flesh out every aspect, we can at least summarise what these technical solutions
    are and what they mean for anyone thinking about building their own project with
    specific political goals in mind.


    # Scaling the World Computer: Layer 2


    If we take a second to consider the functions and things that the Ethereum blockchain
    is able to do, we can think of it in some senses as a “World Computer”. Ethereum
    is not just a ledger or database that tracks transactions, but is also a protocol
    for computation on the shared knowledge held in its memory, with the added caveat
    that it is significantly slower than, say, your average personal computer. While
    for this slowness is a bug that proves blockchains are useless for various computational
    purposes, in fact blockchains are often better for global distributed computation,
    or computation that has consequences for many people. Because they solve the double
    spend problem and the Byzantine General’s problem, they are able to take inputs
    from many different parties for computation through smart contracts. Blockchains
    solved these problems for the most part by'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'integrating into the lowest common denominator of capitalism, or by appealing
    to the pursuit of profit inherent to being a subject of capitalism, with block
    rewards, transaction fee collecting and more.


    This method has clearly worked in terms of making a resilient infrastructure for
    various high-stakes projects around money and finance that theoretically anyone
    can take part in. However, the limited transaction speed, which in some ways also
    ensures the security of the network, has also limited what people want to do with
    it. Limiting, for example, the ability for people to use the technology for non-financially-used
    cases since transactions cost so much. Within a capitalist logic of profit, only
