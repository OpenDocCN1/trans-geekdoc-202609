    likely be determined by the creator of a liquidity pool (anyone can create a liquidity
    pool for two ERC-20 compatible tokens).


    With a very simple equation, a price can always be based on the available liquidity
    of each token in the AMM smart contract.⁵ When a trade is made with the liquidity
    pool, the price will inherently change and could do so if you are trading a large
    amount relative to the size of the liquidity pool. The price could also change
    from what is originally shown because other trades are taking place in the liquidity
    pool that change the price right before you submit your own trade. The change
    in price while a trade is happening is called “slippage” — the difference between
    where the dapp signalled the entry and exit price for a trade and what actual
    average price entered and exited the liquidity pool. In the Uniswap dapp (and
    most others that use AMMs), you can set your slippage tolerance so that if slippage
