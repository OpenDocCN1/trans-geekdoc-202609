- pgno: 188
  md: 'Additionally, social media platforms are facing increasingly difficult choices
    on moderation and censorship, as research shows social media as an enabler of
    “fake news” that continues to have negative impacts on democracy. The growing
    trend for alternatives to platforms like Facebook and Twitter show that consumers
    want more decentralisation, privacy and choice in digital marketplaces, however
    the lack of success in creating them demonstrates the tremendous inertia created
    once a platform has solidified its place. They should be considered private monopolies
    in digital space that do everything they can to maintain their positions of power.


    Some existing platform coops have been able to fill gaps in the market with success
    in various industries. Some examples include Stroudco, a platform coop based in
    the UK that helps farmers sell their products online, now also part of the thousands
    of food cooperatives around the world that make up the Open Food Network. Equal
    Care is a social care platform coop in the UK that uses a multi-stakeholder model
    (supported members, advocate members, investor members and worker members) to
    improve social care work conditions without increasing the cost of social care.
    Stocksy is a platform owned by photographers that sells stock photos at a fair
    price and practices fair-sharing with around 980 photographer shareholders. The
    Drivers Coop is a ride-hailing coop based in NYC which is similar to Uber except
    the drivers own part of the cooperative. Ampled is a platform coop, with many
    Patreon and Bandcamp, that focuses on musicians, where they are owners of the
    platform as well. While platform coops are often healthy businesses, they have
    serious obstacles in competing with their venture capital-funded start-up counterparts
    because the current policy environment for financing venture capital. However
    they do prove the upside of decentralised ownership in business for more democratic
    forms of work.


    # Decentralised Autonomous Organisations'
