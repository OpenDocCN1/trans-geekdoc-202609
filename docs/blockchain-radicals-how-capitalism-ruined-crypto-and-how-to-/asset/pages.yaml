- pgno: 271
  md: '# Democratic Art: Culture Stake


    It might be strange for those who do not work in the arts to think that art has
    much influence in their lives. After all, if you''re not an artist, participating
    in art is usually seen as something that only those with certain privileges are
    able to do, as if it''s only some sort of rarefied, elitist endeavour. It is important
    to bear in mind the influence that various artistic movements have had on political
    movements, also (and especially) among the disempowered. It is perhaps an understanding
    of the disruptive political power of art that has made it a target for elite capture,
    an attempt to corral the pesky imaginations of those who would gain from reimagining
    a world without those elites. Any art that can be seen as being influenced by
    or created for the masses is commonly referred to derisively as “low art” by those
    who see themselves as part of the more exclusive “high art” scenes.


    Anyone who got sucked into the NFT hype cycle in 2021/2022 believe that NFTs are
    the first attempt to “democratise art”, similarly to how DeFi “democratises finance”
    (although it''s more like democratising financial speculation in many cases),
    but this is far from true. One of the leading listed organisations exploring the
    democratisation of art as well as innovative technologies is Furtherfield, set
    in 1996. Based on Finsbury Park in London and founded by Ruth Catlaw and Margaret
    Garret, Furtherfield has been exploring the Internet as an artistic medium for
    collaboration and experimentation and is influenced by free and open source software,
    community arts and other activist movements that challenge the notions of the
    individual “genius artist”. One of the ways they do this in practice is through
    their “do-it-with-others” practice, or DIWO, an idea opposed to that of DIY, or
    do-it-yourself.


    DIWO is an artistic framework that prioritises critical engagements to shift power
    away from top-down initiations into co-produced, networked artistic activities.
    It applies the DIY ethos and directs towards artistic collaboration and treating
    art as a commons. It encourages a mixing of roles'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'between artists, curators, observers and others during the event or project.
    DIWO-based artistic collaborations try to ask others whether decentralised methods
    of peer empowerment are possible today in other contexts beyond art.


    Furtherfield was also one of the first groups to begin exploring blockchains for
    art and boasts many of the first artists to use the technology that preceded NFTs
    as fellow collaborators. One example was Rhea Myers, who created several art pieces
    using smart contracts on Ethereum, even in its test network stage before it went
    live in 2015⁶ Her work was an early exploration of many of the properties that
    NFTs have today. Furtherfield also published a book entitled Re:Thinking the Blockchain
    that includes the works and writings of multiple artists and thinkers who were
    well ahead of their time.⁷ In a crypto world dominated by right-wing libertarianism,
    it was clear to that Furtherfield that this was not the end of the story.


    In order to put the DIWO framework to the test in regard to blockchain, one of
    the projects group undertook was a new application they called CultureScale.⁸
    One of these tests took place at Finsbury Park in London in 2021 as a project
    they called People’s Park Plinth⁹ During the event, throughout May, June and July,
    local residents were allowed to come to the park to look at three “taster” digital
    public works that incorporated local stories and spoke about the park’s heritage.
    In August the residents were then allowed to take part in a quadratic vote on
    the Ethereum blockchain to choose which piece of work they would like to be commissioned
    so that a larger version of it could be made for the park. The project was a success
    and the people voted for an art piece Based on a Tree Story made by HERVISIONS,
    a “femme-focussed curatorial agency supporting and promoting artists working across
    new and emergent technologies, and platforms with a strong focus on the intersection
    of art, technology and culture”.¹⁰ A collaborative artistic exploration like this'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'pushes us to ask questions about democracy (or the lack thereof) in the public
    spaces that we inhabit every day. Furtherfield has shown that an application like
    CultureStake has real implications for facilitating democratic governance with
    a blockchain. In a world where democracy would be taken at least as seriously
    as the state of the market, we couldn’t use these technologies for facilitating
    more democratic control, taking control away from centralised institutions that
    are indifferent to what their constituents think about their decisions? Combining
    this imperative with the various novel democratic mechanisms enabled by a blockchain,
    along with intentional design insert inspired by the ethos of DIWO, it’s not so
    difficult to see alternative possibilities that are not overpowered by the clamour
    of crypto hypemen and the shortsighted gaps of gatekeepers.


    # Headless Brands and Decentralised Music-Making


    In October 2019, the web3-focused research group Other Internet released one of
    their first seminal pieces of writing, describing what they termed “Headless Brands”.
    Traditionally, brands can be thought of as the centrally planned identity of corporations,
    and although sometimes problematic, social movements themselves can also have
    brands. In the piece, they posited that network technologies like blockchains
    have made it possible for decentralised organisations to give users incentives
    to spread brand narratives of their own. In this way, a community-driven organisation
    without a central authority could be seen as a headless brand.


    In the article they explain:


    As a brand grows, it becomes more than a set of first impressions and associations.
    Its reputation precedes it. As impressions are shared across users and consumers,
    they often develop similar sentiments. In this way, a brand operates as a consensus
    system, facilitating a consistent set of beliefs across people.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'They connect this idea to Bitcoin, calling it the first headless brand within
    this technology. While it started off as the creation of Satoshi Nakamoto, after
    their disappearance in 2011 branding was created by those in the bitcoin community
    and not just developers. Over the years, this setup has made branding inconsistent
    and contradictory, as the brand story of Bitcoin shifted between being electronic
    cash, to a censorship-resistant store of value, to an uncorrelated financial asset.
    However, at the same time, all of these narratives have seemed to coalesce around
    a fairly consistent audience of right-leaning libertarian bitcoin maximalists
    who abhor anything related to the state, deride anything they don’t like as “fiat”
    and prophesise a hyper-bitcoinisation event when all money becomes backed by bitcoin.


    The attraction for these types of supporters could likely also be linked to the
    technological decisions that made Bitcoin what it is. The decision to encode hard
    money characteristics (only 21 million bitcoin will ever exist), the immutability
    of the protocol itself having very little, if any, governance space built in,
    and its status as non-state money, makes it appealing to those who believe in
    free markets over democracy. Being the first headless brand also made it influential
    for the subsequent blockchains and cryptocurrencies which were made following
    similar logic to Bitcoin. A cryptocurrency network with anonymous founders, a
    white paper and deflationary economics defined much of the rest of the space,
    and likely boosted these tendencies as part of the headless brand behind cryptocurrency,
    creating a snowball effect of attracting the politically disaffected. At this
    point in the story though, we know that this is not the only way of doing things.


    Songcamp is a decentralised organisation for artists who are fed up with the current
    state of the music industry and want to explore the use of web3 tools that don’t
    rely on centralised platforms and other bad business practices.12 They are a group
    especially interested in experimenting with NFTs and music in collaborative ways.
    They do this by running month-long'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'cohort projects called “camps”, similar to songwriting camps but with an added
    element of web3. New artists, songwriters, producers and hackers are invited to
    every camp where music, visual art and their NFT rollout are all part of their
    collaboration.


    One of their first camps was called Songcamp Elektra, from which, after an eight-week
    songwriting and art creation made up of musicians, visual artists, developers
    and strategists, three songs were made with associated visual art and NFTs.¹13
    It was an immediate success as all three songs were sold for a total of a little
    than $30,000. The artists earned significantly more money for their work than
    if they had posted them on streaming platforms, especially as they used an NFT
    from Zora, which takes no commission from artists using their smart contracts.
    After the success of this experiment, they upped the ante for their next camp,
    Camp Chaos.


    For Camp Chaos, forty-five musicians were split into fifteen bands of three; each
    band had two weeks to create a song.¹14 Once the weeks was up, the artists were
    reshuffled into fifteen bands of three, a cycle that was repeated two more times.
    By the end, forty-five musicians had collectively created forty-five songs in
    six weeks, with each musician taking part in the creation of three songs. For
    those that participated, they were making their own headless brand, or perhaps
    headless band, made up of several combinations of different bands. There were
    eighty participants in total, including thirty-five non-musicians — visual artists,
    developers and others — involved in creating the final products that would become
    the NFTs. These were designed in a way that had never been done before.


    In total there were twenty thousand NFTs created for the forty-five songs, which
    were sold in packs of four songs each.¹15 You not know which songs were inside,
    so it was something like creating five thousand packs of Pokémon cards with each
    one on sale for 0.2 ether. After mining'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'the pack, the collector then had the choice to either keep their pack closed
    (in the same way collectors keep items in mint condition) or open the pack to
    reveal the four random music NFTs. Though there were only forty-five songs, the
    cover artwork was made of multiple generative visual layers, each with a different
    rarity, making each unique. The strategy for releasing their NFTs was innovative,
    what is perhaps more innovative was how they collaborated and shared the financial
    rewards.


    To be a truly headless brand, musicians could not be paid based on the specific
    pieces of art they produced, instead everyone was engaged in the success of the
    project as a whole.¹⁵ Their headless brand expressed the desire to provide a better
    experience for artists, which included, before anything had been created or sold,
    a one-time basic income equal to 0.3 ether for taking part, a stark contrast to
    the current situation for most artists. The second aspect of the financial flows
    set for this experiment was the Chaos Split. A split contract is a type of smart
    contract that automates the splitting of payments based on the parameters set
    in the contract. For example, you can set up a split contract for an album that
    automatically splits the revenue amongst all the members of the band.


    ForCamp Chaos, they determined the split based on ownership of their CHAOS token.
    The 1,000,000 total supply token was split into 30% for Songcamp to facilitate
    camps, 20% for self-selection where each contributor was able to say if they believed
    they worked a lot or a little for each two weeks, and 10% for a holdback to be
    decided on collectively afterwards. The other 40% was designated as a gratitude
    flow where each participant used Coordinateina to allocate tokens amongst their
    two-week cohort on the basis of those they felt deserved the most. This made it
    so that people could be rewarded based on how helpful they were perceived to be
    by those who worked closest with. This struck an agreeable balance for the participants,
    who could then receive the revenue generated by each sale through the split contract
    automatically.'
