  md: '# CHAPTER 6


    # THE PEOPLE''S SHADOW BANK


    Crypto is the new shadow bank. It provides many of the same services, but without
    the consumer protections or financial stability that back up the traditional system.


    > — Senator Elizabeth Warren¹


    The 2008 global financial crisis was a wake-up call for many people, showing that
    the so-called free market system was far from perfect. It was caused by a number
    of factors, but one of the key problems was the “shadow banking” system. Shadow
    banking is a term for the activities of financial institutions that are not subject
    to the same regulations as traditional banks. This includes hedge funds, private
    equity firms, investment banks, insurance firms, payday lending and other non-bank
    financial institutions.


    But why do state allow shadow banking to exist? Why not submit these bank-like
    but non-bank financial institutions to the same regulations as proper banks? A
    part of the reason is that shadow banking is necessary because it provides credit
    to businesses and households that would not otherwise have access to it from traditional
    banks. One of the main jobs of a nation state in a liberal capitalist country
    is to create the conditions for the economy to continue to grow. Allowing for
    a more deregulated section of'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'the financial economy provides a way for consumers or businesses to take out
    loans or engage in other types of financial activity at rates that they cannot
    get through traditional banks and thereby stimulate the economy. It provides credit
    for economic growth without the responsibility that comes through regulation.


    However, it can be very risky to engage with shadow banking institutions since
    there is no deposit insurance guarantee from the government, as there is with
    traditional banks. The tradeoff is similar to the difference between products
    categorised as medicine, which are strictly regulated, versus supplements, where
    there is significantly less regulation. At the same time, shadow banking is the
    part of the economy where wealthy elites are able to stash away money and assets
    for higher returns or find loopholes for paying much less proportionally in taxes
    than the average person.


    One of the by-products of shadow banking is the tendency for these institutions
    to make loans and securitise them, or pool them together, to create new financial
    products that can be traded on newly created markets once there is enough liquidity.
    It is a way to make illiquid assets into more liquid ones. The most obvious example
    of this was with the subprime mortgage crisis in 2008, where shadow banking institutions
    were responsible for securitising hundreds or thousands of mortgage loans (a house
    being a very illiquid asset generally) to turn them into collateralised debt obligations
    (CDO), making all of these mortgage loans very liquid. Credit default swaps (CDS)
    were a counter financial product to CDs, acting as insurance against default risks
    with all of the mortgage loans bundled inside the CDO. Once there was critical
    number of defaults, enough holders of the CDSs demanded settlement. Since there
    was no deposit insurance from the government, this led to the collapse of AIG,
    the largest insurance company in the world at the time.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'This collapse led to a series of further financial catastrophes. Many people
    could no longer afford their mortgages, which created a credit crunch, a sudden
    reduction in available credit being loaned by banks and other financial institutions,
    followed by the bailouts stimulus packages. For many this showed that the shadow
    banking system was clearly a systemic risk to the entire global economy if not
    managed correctly. For those looking closely enough, it also showed how shadow
    banking institutions were able to introduce new credit, and therefore new money,
    into the economy without the same regulations imposed on normal banks. Once again,
    this challenges the right-wing libertarian assertion that there being too much
    money or credit is strictly a consequence of central banks, as a significant amount
    of money via credit was introduced into the economy through the deregulated private
    sector (i.e., shadow banking), thanks to neoliberal public policy decisions.


    While one would hope that governments would have learned from this experience,
    unfortunately the shadow banking economy is larger today than it was before the
    2008 crash — according to the Financial Stability Board, assets held by shadow
    banking institutions totalled $63.2 trillion in 2020.³ This includes investment
    firms like BlackRock, with $10 trillion of assets under management as of January
    2022, and Vanguard, with about $8 trillion of assets in 2022. Just these two companies
    own a very significant amount of the mutual fund and exchange-traded fund market,
    giving them a worrying amount of control.


    Although questionable from a prioritisation standpoint, it is surprising to see
    states adopt seemingly appropriate regulations for a growing cryptocurrency industry
    with a market of about $1 trillion by February 2023.³ One of the loudest voices
    in US politics to be calling for more strict regulation for fear of expanding
    the shadow banking system is Democratic Senator Elizabeth Warren, known for her
    progressive positions on financial regulation and role in the creation of the
    Consumer Financial'
