  img_proc: true
- pgno: 235
  md: 'and create political futures that are more democratic and politically expressive
    in ways that were not possible before.


    # Understanding DAOs through Cybernetics


    One of the biggest issues facing many Western democracies is that they have calcified,
    becoming slow, bureaucratic and poorly adapted to contemporary conditions. While
    conservative libertarians may argue that this is the natural state of “big government”,
    the more likely cause has been the increasing power of capital over the government
    itself, spearheaded by the same economic elites and business interests that lobby
    those who enter into the highest levels of government with donations, through
    which they are able to keep the system that they benefit from place using legalised
    bribery. Many of the institutions of these countries were designed in a time that
    looked very different from today, and while there is still space for some adaptability,
    it is well-known that, in America’s case, the Founding Fathers also encoded already
    existing inequalities into the original Constitution, from keeping the practice
    of slavery intact to the creation of the Senate and disallowing the right of anyone
    who was not a land-owning white man to vote.


    This system of current government institutions, however, is not the only one that
    we live in. There are a number of systems and subsystems that overlap and interact
    with each other which can be explained through cybernetics. Cybernetics is a transdisciplinary
    field of study and framework for understanding systems of all kinds, including
    ecological, technological, biological, cognitive and social systems, and Artificial
    Intelligence is itself an evolution of cybernetics thinking. Cybernetics can be
    a way to understand how we design, learn, manage organisations, speak and more.
    The way it does this is by abstracting the similarities of all systems into categories
    like sensors, controllers and feedback loops, to name but a few, that describe
    how a system is able to sustain itself and be autonomous, or'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'otherwise. Self-governing systems include biological systems, such as plants
    and animals, computer systems, and institutions, including corporations and governments.


    One of the most famous cyberneticians was Stafford Beer, an ex-captain in the
    British military who served in World II and became a pacifist. In his book Brain
    of the Firm, Beer details what he calls the Viable System Model (VSM), starting
    off what would come to be known as management cybernetics, or the application
    of cybernetics to all types of organisations. VSM represents the organisational
    structure of an autonomous system that is able to adapt to changes in its environment
    in order to fulfil its purpose. Autonomy in this context refers to a system that
    is self-governing.


    In the VSM, there are five interacting subsystems that operate on a progressively
    larger spatial and temporal scale. Systems 1 and 2 are related to day-to-day primary
    functions and aligning their activities with the collective purpose of the organisation.
    System 3 refers to the rules and structures that support the activities of Systems
    1 and 2. System 4 is the parts of the system that are looking outward to the environment
    to monitor outside influences that may require adaptation. System 5 is what governs
    the policies of the overall body of the organisation to balance the demands from
    the various systems.


    While at first glance this seem merely an academic or intellectual exercise, it
    has real-world application. For example, VSM was being used in Chile in the early
    1970s as part of Project Cybersyn — that was before the US-supported fascist coup
    killed the democratically elected socialist president Salvador Allende and installed
    the dictator General Augusto Pinochet in his place. The purpose of Cybersyn was
    to create a control centre that allowed for decentralised management of the economy,
    taking inputs from the workers and businesses in order to make appropriate real-time
    decisions. The principal architect was Stafford Beer himself.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'This system consisted of a network of about five hundred telex machines located
    in government offices in Santiago and enterprises throughout the country. These
    machines were connected to a government mainframe computer that received information
    on production operations, fed that information into economic modelling software
    and reported on variables (like the supply of raw materials) that might need attention.
    Cysyn allowed Chile to pursue its own destiny, different from Soviet bureaucratic
    or American corporate power centralisation. It is still a tragedy for the human
    race that the experiment was discontinued as a result of the coup, after which
    instead Chile became the testing ground for the neoliberal economic policies that
    would later be implemented across the world and which have led to the failing
    institutions we see today.


    With regard to DAOs, cybernetics can also be a very useful framework for assessing
    the degree to which a DAO practices the principles of decentralisation or autonomy
    that the name lays claim to. In April 2022, Michael Zargham and Kelsie Nabben
    published a working paper titled “Aligning Decentralized Autonomous Organization’
    to Precedents in Cybernetic” that elucidates the connections between cybernetics
    and DAOs. They note that in DAOs, Systems 1 and 2 are generally embodied through
    both human activities and software processes, but System 3 is entirely software-based,
    with many heavy influence from smart contracts enforced by a blockchain network.
    Systems 4 and 5 deal with the strategic and governance functions of a DAO that
    allow for the organisation to adapt to identified threats.


    In order to be truly viable, an organisation must have a governance system able
    to survive a wide range of unknown changes in its environment, as well as threats
    from adversaries. There are two main strategies to staying viable for a system.
    Either it must be resilient by having a wide enough range of behaviours and reachable
    states to adapt to'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'changes, or it must stay robust in the face of changes to its environment having
    a narrow set of reachable states. The set of actions that enable an organisation
    to respond to its changing environment is called the “governance surface”. Consequently,
    a larger governance surface provides greater resilience, while a smaller governance
    surface provides greater robustness. The concept of governance surface was introduced
    by Zargham and was inspired by the cybernetic concept of “control surface”, a
    term used to describe the portion of a system that is used to control the system’s
    behaviour. It is typically the part of the system that is exposed to the user
    or operator, and it may include buttons, switches, dials or other types of controls
    that can be manipulated to affect the system’s operation.


    With DAOs, this is defined by the set of parameters that can be changed in the
    software that governs the DAO in System 3, i.e., the smart contract code. The
    processes for making those changes are Systems 4 and 5. This process can be akin
    to the way that governments create and pass policies that then become law, which
    means that this is inherently a political process informed by the purpose of those
    that make up the organisation. The word for iterative decision-making that needs
    to be made for governance feedback control.


    By control, this doesn’t necessarily mean a type of control that is coercive,
    but rather a method for regulating or balancing the direction of the organisation.
    Decentralised governance is no simple task, however, and its difficulty has likely
    been one of the reasons why we are so dependent on many failing generalised systems.
    While not normally acknowledged for their political commitments, Zargham and Nabben
    note that DAOs are a “digital expression of the political will to self-organise”
    and that understanding control is crucial to the problem of decentralised governance.


    A feedback control system is a recursive process made up of several parts that
    inform how a system adapts to changes. The first part is a sensor that takes measurements
    about the current state of the system. How well it'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'can do this is called “observability”. These measurements are then inputs for
    an estimator which evaluates them based on a set of beliefs based on previous
    measurements. The controller is a process by which a decision is made based on
    the beliefs of how to pursue the goal, which could be as human-directed or automated
    as the designers make it. The actuator is then the mechanism that turns the decision
    into a concrete action, which leads to an outcome. The decisions and actions possible
    are limited to making changes to variables which are part of the governance surface.
    The outcomes are then observed by sensors to be turned into new measurements in
    order to repeat the whole process. Much of this terminology is derived from systems
    engineering, the key concepts are just as relevant for decentralised governance
    and decision-making in DAOs.


    For DAOs, like any other type of system, there is always a trade-off in the design
    of a governance surface. A larger governance surface may provide an organisation
    with a larger set of choices that could help reach its goals, but it also creates
    a larger risk of undesirable system states. A smaller governance surface can decrease
    the risk that an organisation would come to an untenable state, but it limits
    its adaptability. A middle ground needs to be found as to set the governance surface
    at the minimum required for it to stay viable for its purpose. This is sometimes
    referred to as governance minimisation.


    # Expanding Democratic Expression


    Stafford Beer coined the term “POSIWID” — or, the “purpose of a system is what
    it does”. It’s a basic starting point for cyberneticians to see through what may
    be good intentions, expectations or moral judgements about a system to the system’s
    concrete functions. When we observe situations like the growing influence of money
    on politics in the US, with the average federal politician becoming wealthier
    and the average citizen poorer,⁴ or the re-election of Emmanuel Macron in France
    when surveys show that nearly'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'half of those who voted for him were voting against his far-right rival

    Marine Le Pen and not in direct support of his policies,5 or the 2020 US

    presidential elections,6 it''s clear that the purpose of the political system
    of

    liberal capitalism is not to respond to most people''s needs or preferences.

    Understanding adaptability and purpose through a cybernetics lens, it''s easy

    to see that nation states have largely not been answering the needs of

    average citizens in recent history, and that purpose is in fact to support

    wealthy elites and engrain their power while making the capitalist system

    adaptable to threats from the average citizens, i.e., the working class.


    | Measurements | Beliefs | Decisions |

    | :--- | :--- | :--- |

    | Sensor | Estimator | Controller | Actuator |


    ![](img/220602ca4af0f7c12ded8d4ba94bd5ab_240_0.png)


    With the recent rise of populism of various stripes, it''s clear that the

    feeling that something is deeply wrong with current political and

    governmental institutions are shared by many opposite ends of the

    political spectrum. If we think of the systems already in place as a feedback

    control system that can be steered towards outcomes and conditions that are

    more desirable and equitable, the first thing that would need to happen is

    for those who have the same goal of changing this system to be able to

    recognise each other so that coordinating games can begin. In one of the most

    well-known coordination games developed by economist Thomas Schelling

    in *The Strategy of Conflict*, you are asked to meet a stranger in New York

    City but are not allowed to communicate with them directly. When and

    where would you decide to try and meet this person? In his study, he

    found that the most common answer was noon at Grand Central. This'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'concept, the time and place that a majority predict others to be at a particular
    set of conditions, is called a “Schelling point”.


    Zuccotti Park was a Schelling point for the Occupy Wall Street movement. The campaigns
    of Bernie Sanders and Jeremy Corbyn were Schelling points for those who believed
    in their policies of reducing the influence of capital on politics and the economy
    in the US and the UK respectively. This book is possibly a Schelling point for
    those who believe there is something wrong with the current state of capitalism
    and are curious to explore blockchains as a useful way for achieving collective
    liberation.


    Gitcoin, the public goods funding platform mentioned in the previous chapter,
    considers Ethereum to be a “Schelling point for the hopeful”, and Gitcoin itself
    to be a Schelling point for regens in the cryptocurrency space. They have hosted
    several Schelling point events during various cities around the world where speakers,
    some of whom would consider themselves to be regens, share their thoughts and
    experience from their own endeavours and speak to others who are curious or looking
    to take part in similar projects.


    Gitcoin has helped various open source and public goods-oriented projects get
    through use of a mechanism called “quadratic funding”. This is a form of fund-matching
    that limits the influence of those with significantly more capital than everyone
    else. The Gitcoin platform hosts thousands of projects being built with open source
    code, some readily done with crypto projects, as due to the nature of blockchains
    they inherently have some aspect of their code as open source. Anyone is able
    to donate to the projects during a grants round, which normally lasts about two
    weeks and happens every three months. Whatever is donated to a project is matched
    using a pool of funds given by sponsors of the round based on a quadratic formula.
    For example, if you were to donate $100 to a project, you could have $10 matched
    with your donation to that project, and if you'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'were to donate $1,000, you could have $50 matched from the pool. Here we can
    see that the matching is higher as a percentage with smaller amounts, but more
    in absolute terms with higher amounts. It therefore encourages people to give
    in smaller amounts across more projects rather than focusing on giving everything
    to one project.


    Quadratic funding is a derivative of an alternative voting system called “quadratic
    voting”, first coined by Glen Weyl, the founder of RadicalXChange. In quadratic
    voting, voters are given a set of possible choices and several vote credits which
    they can disburse across them, however it costs more votes for each additional
    vote given to a single choice at a quadratic rate. If for example you wanted to
    vote for an issue once, it would cost one credit, but a second time it would cost
    two credits, then four, then eight, encouraging participants to split their votes
    across many choices rather than focusing on just one. Of course, this is not the
    only way a quadratic vote can be set up. Thinking of it as a cybernetic system
    itself, the parameters can be changed in multiple ways depending on what’s desired
    by those administering the vote, but this can help to provide a snapshot of a
    different system beyond the one-person-one-vote two-party system of the US or
    plutocratic token governance that resembles stock voting in large centralised
    corporations common in some protocols. Quadratic voting has already been used
    by the Democratic Caucus of the Colorado House of Representatives to determine
    legislative priorities, and in Taiwan’s e-democracy platform for public participation
    in determining budgets.


    “Conviction voting” is another example of an alternative voting mechanism being
    investigated in the Blockchain space. First proposed by Michael Zargham and tested
    by The Commons Stack, conviction voting is a decision-making process where community
    members’ aggregated preferences are used to fund proposals continuously over time.
    Rather than casting their votes in a single time-boxed session, voters are always'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'expressing their preference for which proposals they would like to see approved.
    The longer a member keeps the same preference for the same proposal, the “stronger”
    their preference becomes. This gives members of the community with consistent
    preferences more power than those participating inconsistently. Similar to quadratic
    voting, people can have multiple credits to allocate across many choices, however,
    time plays a determining role.


    A conviction vote works similarly to neurons in the brain, where an increase in
    collective preference can be compared to a neuron’s action potential. A proposal
    is approved when a preset threshold of collective preference is reached, just
    as a neuron fires only when its action threshold is reached. This is how, and
    in the feedback control system, aggregating information about individual preferences
    can turn into concrete decisions or actions, like the acceptance of a proposal.
    The mechanism can also be helpful for preventing vote buying, last-minute vote
    swings and voter apathy, since you don’t need to be available at a specific time
    and place in order to participate. 1Hive is one DAO that has been actively utilising
    conviction voting for the allocation of funds in their community treasury toward
    project-based proposals. Proposals pass when they have sufficient support over
    sufficient time and majority consensus is not required to pass a proposal.


    DAOs have also experimented with aspects of “liquid democracy”, which is a form
    of dynamic delegation of power. As in a direct democracy, liquid democracy voters
    have the right to directly vote on all policy issues, but they also have the option
    to delegate their votes to someone who will vote on their, as in a representative
    democracy. Delegates can collect as many votes from others as are willing to give
    to them, however their votes can always be taken away from them if someone objects
    to their voting. Delegates could also redelegate the votes they’ve been given
    to someone else. Depending on the design, delegation can be limited to'
