  md: 'complex legal apparatus needed to coordinate with users in various countries,
    would be too much.


    Likely to the surprise of Schneider, the place where Exit to Community has seemed
    to take off most is in crypto. One interesting example was the “airdrop” of the
    UNI token, a governance token used for the DEX Uniswap. On 16 September 2020,
    this DEX on the Ethereum blockchain created the UNI governance token to be used
    by token holders to vote on the direction of the project. 60% of the total supply
    was allocated to users based on their use of Uniswap, and a user who had the platform
