- "# 人工智能技术：深度学习的概念\n\n\n\n# 1 引言\n\n“深度网络的革命是非常深远的，它绝对让我感到惊讶，尽管我当时就坐在那里。” —— 谢尔·布林\n\
  \n在计算机和互联网时代之前，甚至在手绘地图和磁性指南针时代之前，有一群天才横溢的人仅凭自己的智力，划着小木舟穿越了印度洋和太平洋。他们从一个岛屿航到另一个岛屿，带着他们的文化——语言、技术和信仰——并一直传播到西部的马达加斯加和东部的复活节岛。这些航海民族被认为属于一个名为“波利尼西亚人”的共同群体。[HRS]\n\
  \n![](img/image00171.jpeg)\n\n图 1.0 波利尼西亚人的迁徙：[AUS]\n\n如果你看世界地图就会发现马达加斯加距离复活节岛非常遥远。如果我们从马达加斯加到复活节岛画出一条经过东南亚的直线，距离大约是\
  \ 1.3 万海里。维京人横跨大西洋到达了西部的加拿大大西洋和东部的欧洲俄罗斯，相比之下，这段距离大约只有 2.7 千海里。为了帮助波利尼西亚人，他们开发了原始但有效的技术：带有外支和帆的独木舟或木板舟，并创造了仅依靠他们在大浩瀚海洋中观察到的稀缺信息进行导航的寻找方法。[BEL]\n\
  \n遗憾的是，原始方法很少在现代化进程中存存，但留下的部分正由部落和爱好者保护着，他们让古代波利尼西亚人的智慧和传统得以延续。原始的波利尼西亚船只设计可以在马达加斯加岛、复活节岛以及它们之间的数千个岛屿上找到，这揭示了这些简单的设计对于海洋规模的导航是多么有效。[HRS]\n\
  \n“寻路”（Way-finding）是现代从业者采用的术语，指仅用最少仪器航行海洋的艺术。寻路是指人类必须极大化其观察能力并培养直觉，以便在广阔的海洋中到达一个小岛屿。\n\
  \n然而，这并不是一本关于人类直觉的书，而是另一本关于另一种直觉的书。这是一本关于人类创造的技术的书。具体来说，它是关于**人工直觉**的。人工直觉是一种在复杂的信息海洋中航行，以发现重要小岛的技术。\n\
  \nCoursera 创始人、斯坦福大学兼职教授吴恩达（Andrew Ng）最近提到 AI 如何转型行业：\n\n“AI 是新的电力。电力改变了行业：农业、运输、通信和制造业。我认为我们现在正处于这样一个阶段，AI\
  \ 技术已经进步到我们可以看到它转型多个行业的清晰路径。正如 100 年前的电力一个接一个地改变行业一样，我认为 AI 将做同样的事。” [EAD]\n\nAI\
  \ 自 20 世纪 50 年代出现以来，经历了多次繁荣与衰落的循环。然而在过去的五年里，一种被称为深度学习的新型 AI 意外出现。自 2012 年以来，它一直取得了惊叹和惊讶的结果。许多人看到了进步，但并没有意识到催化剂。之前的\
  \ AI 失败、对 AI 含义的模糊理解以及这种新兴技术的新奇性，都让人们难以理解正在发生什么。\n\n这个问题由于大众媒体不断发布展示繁荣与黑暗的煽动性文章而进一步恶化。媒体要么描写超出可行范围的能力，要么描写遥不可及的结果。\n\
  \n## 一种新型的人工智能\n\n深度学习与之前的互联网和移动计算一样具有革命性。目前兴趣的复苏主要归于深度学习的成功。许多风险投资者喜欢紧抓住 AI 这个词，但但如今，这个词已经变得毫无意义。[BOG]\n\
  \n为了直观深度学习的程度，请看这张来自 Google 的图表：\n\n![](img/image0172.jpeg)\n\n图 1.1 Google 深度学习的增长。[GIL]\n\
  \n如你所见，Google 的采用率是指数级增长，对于 Facebook 和微软等许多其他大公司来说，统计数据可能相似。\n\n当 Google 开始将他们的自然语言翻译软件转换为深度学习时，他们惊讶地发现了巨大的收益。这在《纽约时报》最近发表的一篇名为《AI\
  \ 的大觉醒》的文章中描述得恰当：\n\n神经系统在英法语语对上比旧系统提升了 7 个点。休斯告诉舒斯特（Schuster）的团队，他们自己的系统改进还没有对方的一半多。\n\
  \n为了确保这不是某种巧合，他们还转向他们的人工承包人员进行侧对比。用户感知评分（样本句子从 0 到 6 分评分）显示平均提高了 0.4 分——大约等同于旧系统在整个开发周期内获得的总收益。\n\
  \n*3 月中旬，休斯给他的团队发送了一封邮件。所有旧系统的项目必须立即停止。* [LEW]\n\n\n\n\n\nSundar Pichai 在最近的季度财报会议中提到\
  \ `[LEV]`：\n\n机器学习是一项核心且变革性的方式，我们正借此重新思考我们的一切。`[LEV]`\n\n更准确的术语是“深度学习”。他只是用那些受教育程度较低的财经媒体或许能理解的语言描述了它。\n\
  \n深度学习的进展正席卷学术界。两篇由经典机器学习从业者写的文章总结了他们为何认为深度学习正在统治世界。`NLP` 领域的著名专家 Chris Manning\
  \ 写了关于“深度学习海啸”的 `[MAN]`：\n\n深度学习的波浪已拍击了计算语言学的岸边多年，但 2015 年似乎是海啸全方位冲击主要自然语言处理（`NLP`）会议的一年。然而，一些专家预测，最终的损害将更加严重。`[MAN]`\n\
  \n从事计算机视觉领域的 Nicholas Paragios 也表达了同样的情绪。Paragios 在《计算机视觉研究：深度低谷》`[PARG]` 中写道：\n\
  \n这可能仅仅是因为，深度学习在高度复杂、在自由度上极其复杂的图上，一旦被赋予了海量的标注数据以及直到最近才无法想象的计算能力，它就能解决所有的计算机视觉问题。如果情况如此，那么行业接管（看起来已经这样了）只是时间问题，计算机视觉研究将成为一个边缘学术目标，而该领域将遵循计算机图形学的路径（从活动量和学术研究规模方面来看）。`[PARG]`\n\
  \n不要误会——深度学习是一项“颠覆性”技术，正在接管世界上最先进科技公司的运营。\n\n当某种处理事物的新方法完全改变我们思考、行动、学习和处理日常活动的方式时，颠覆就发生了。Clayton\
  \ Christensen 更具体地表达了这一点：颠覆取代了现有的市场、行业或技术；它用更简单的东西取代了现在的现状。\n\n互联网为文明提供了更高效的通信方式。万维网引入了更好的知识交换方式。移动计算让人们能够随地访问通信和计算。深度学习通过其之前的技术增强了我们的认知能力。深度学习是一项赋能技术，它将改进我们在每一项人类活动中的工作方式。Mark\
  \ Cuban 最近评价道 `[CLI]`：\n\n“无论你现在正在学习什么，如果你不跟上深度学习、神经网络等领域，你就输了，”Cuban 说。“我们正在经历这样一个过程，即软件将自动化软件，自动化将自动化自动化。”`[CLI]`\n\
  \n# 什么是深度学习？\n\n深度学习，拆开来，是两个我们都能理解的简单词汇，但在人工智能的背景下，当这两个词组合在一起时，对于门外汉来说就变得深不可测。事实上，即使对于知情人士来说，它也是深不可测的。这是因为几十年的统计训练已成为理解其含义的负担。\n\
  \n深度学习是人工智能的一种连接主义（Connectionist）方法。联结主义系统由许多简单组件组成，这些组件共同表现出复杂的行为。深度学习专门采用排列在无环图（即没有循环）中的多层组件。层有许多种类，但它们的共同属性是这些层是可微的。换句话说法是，可以为任何一层计算梯度。我们将在随后的章节中更详尽地探讨这种结构。\n\
  \n以下是九点，旨在消除一些对深度学习的误解，并提供一些相反的解释：\n\n## 1. 深度学习不是“老派”人工智能 (GOFAI)\n\n专家系统、语义网和演绎逻辑系统是基于符号逻辑的系统示例。这些系统传统上与人工智能相关联。它们都能起作用，但它们确实有一个缺点：它们无法从数据中有效学习。`GOFAI`\
  \ 需要开发者手工构建符号规则。\n\n## 2. 深度学习不是机器学习\n\n机器学习最精基础的提炼是“曲线拟合”。也就是说，如果你有一个算法能够找到你的数学模型与观测数据之间的最佳拟合，那么它就是机器学习。尽管\
  \ `ML` 和 `DL` 都能从数据中学习，但 `DL` 中存在许多 `ML` 中不存在的能力。这些差异的例子支持了迁移学习和增量训练。\n\n## 3. 深度学习并不模拟生物大脑\n\
  \n`DL` 的架构在结构上与生物神经元相去甚远。在行为上，它们也是不同的。生物神经元基于脉冲行为（spiking behavior）工作，而 `DL` 系统作为连续动力系统工作。一些\
  \ `DL` 系统使用人工神经网络，但这只是至今仍然存在的历史术语。任何用生物神经元来解释 `DL` 的人真的不知道自己在说什么。`DL` 的设计并不是为了“模拟”生物学，`DL`\
  \ 恰好是一种学习能力惊人的计算架构。\n\n## 4. 深度学习不是通用人工智能\n\n`DL` 可以做一些神奇的事情，比如在不同人类语言之间交叉翻译以及读取图像字幕。然而，这种智能是非常专门化且狭窄的。诚然\
  \ `DL` 可以开车，但这远不是 `AGI` 的能力。\n\n## 5. 深度学习不是“仅仅是数学”\n\n《连线》杂志上有一篇标题为《深度学习不是危险的神灯，它仅仅是数学》`[ETZ]`\
  \ 的文章，这真的是我听过的最空洞的陈述！这就像说计算机只是布尔电路，或者大脑仅仅由神经元组成，或者 `DL` 仅仅由用数学函数描述的层组成。它并没有解释你在计算机、大脑和\
  \ `DL` 系统中发现的涌现复杂行为。\n\n## 6. 深度学习不是统计学\n\n经典统计学关于使用聚合指标分析数据。然而，`DL` 系统工作在一个统计方法不适用的领域；它是高维数据，变量之间具有很高的互信息。简化\
  \ `i.i.d.`（独立同分布 `[IID]`）假设在许多现实场景中并不适用。\n\n## 7. 深度学习不是大数据\n\n大数据技术基于这样观点：如果你能够对海量数据进行存储和计算，并且通常托管在成百上千台现成计算机上，那么你就能获得洞察。`DL`\
  \ 是一种运行在单机上的算法，并可以增量地（特别强调增量）处理你的数据并从中学习。大数据可以处理海量数据，但仅仅因为你能处理大量数据，并不意味着你就能获得洞察或从数据中学习。最后一点：与大数据不同，`DL`\
  \ 不需要大量数据就能有用。\n\n## 8. 深度学习并不被数据科学家理解\n\n数据科学家接受过数据建模、特征工程和数据分析训练。`DL` 做数据科学家要做，但没有人类参与。这其实有点夸张。现实是，大多数接受过其他方法训练的数据科学家尚未跟上\
  \ `DL` 技术。\n\n## 9. 深度学习不仅仅是人工神经网络 (ANN) 或多层感知器 (MLP)\n\n\n\n\n\n`ANN` 或 `MLPs`\
  \ 在 20 世纪 50 年代就开发了。如今有一种误解，认为现在的`深度学习` 与旧的方法并无区别。然而，近年来，新型层模型如`卷积层`、`自回归层`、`长短期记忆`和`残差层`扩展了原始方法。该领域拥有的概念集合比你最初在研究生阶段学习它时要丰富得多。\n\
  \n观察 `AI`、`GOFAI`、`机器学习` 和 `深度学习` 之间对应关系的一种方法是通过演进化树。不同的方法在不同的时间出现，随着时间的推移，新方法相继涌生。因此，在\
  \ 1955 年，`人工智能`一词被创造出来。统治该领域的首种方法是 `GOFAI`（即`符号主义`）。这可以类比为植物的出现。随着`基于贝叶斯的图模型`和`机器学习`等统计方法的发展，一种能够适应数据的新型方法出现了。将这些看作是爬行动动物的出现。`深度学习`虽然脱颖而出，但这些思想从\
  \ 20 世纪 50 年代后期就已经存在了。让我们做一个类比，这些就像哺乳动物，它们从爬行动物进化而来，具有截然不同的能力。因此，当许多作者声称`深度学习`就是`机器学习`时，这就像说哺乳动物是爬行动物一样毫无意义。同样，`GOFAI`并不是`深度学习`，而是像变成了哺乳动物工具的植物，`GOFAI`\
  \ 与`深度学习`的对应关系就像纸张与人类。符号主义方法是编码知识的方式。\n\n### 向五岁小孩解释\n\n理查德·费曼有一种学习复杂学科的方法。这种方法非常简单——尝试向五岁小孩解释这个复杂学科。如果你做不到，就回去精炼你的语言并再次尝试。\n\
  \n`深度学习`是那些持续困扰人的复杂学科之一。在这里，我将尝试一种解释，希望五岁的孩子也能理解。\n\n只需阅读以下内容：\n\n```\nDE3p Larenn1g\
  \ mhica3ns wrok smliair to hOw biarns wrok. Tehse mahcnies wrok by s33nig f22Uy\
  \ pa773rns and conc3t1ng\nt3Hm t0 fU22y cnoc3tps. T3hy wRok l4y3r by ly43r, j5ut\
  \ lK1e A f1l73r, t4k1NG cmopl3x sc3n2s aNd br3k41ng tH3m dwon itno s1pmLe iD34s.\n\
  ```\n\n当我向人们展示这个时，许多人实际上惊讶于它确实相当可读。人类的大脑像`深度学习`一样，运行在某种深层原理之上，能够补偿世界的模糊性。\n\n###\
  \ 人工智能的部落\n\n关于“人工智能”的最大的困惑之一是它的术语非常模糊。这是因为`人工智能`或`AI`是 1955 年带着极度自大所创造的术语：我们提议在\
  \ 1956 年夏天，在新罕布什尔州汉诺威的达特茅斯学院进行一项为期 2 个月、10 人参加的人工智能研究。\n\n该研究将基于这样一个假设进行：学习的每一个方面或智能的任何其他特征在原理上都可以如此精确地描述，以至于机器也可以做到。\n\
  \n#### 符号主义者\n符号主义方法是影响基于规则的框架以进行归纳的专家。利用`Lisp`和`Prolog`以及`语义网`、`RDF`的方法论。其中最具雄心的尝试之一是道格·莱纳特（Doug\
  \ Lenat）在 80 年代开始的`Cyc`，他试图编码逻辑。这种方法的显著弱点是比例上的脆弱性。\n\n#### 进化论者\n应用交叉和变异等变换循环来展示发展行为方式的人。这种方法通常被称为`遗传算法`(`GA`)。\n\
  \n## 连接主义者\n该部落的专家还研究`细胞自动机`和`复杂自适应系统`(`CAS`)。\n\n#### 贝叶斯者\n利用概率标准及其条件进行推演的人。`概率图模型`(`PGMs`)\
  \ 是这种方法的推测，核心计算系统是用于检查分布的`蒙特卡洛`技术。\n\n#### 核保守派\n在`深度学习`强大之前的最佳策略之一是`支持向量机`(`SVM`)。杨·勒昆（Yann\
  \ LeCun）将其称为“著名的布局协调”。众所周知是一种技巧，可以将通常非直的划分问题转化为直接的问题。\n\n#### 拥树主义者\n使用基于树的模型的人，如`随机森林`和`梯度提升决策树`。这些本质上是逻辑规则的树，通过递归分割区域来制造分类器。\n\
  \n\n\n\n\n# 瑞士帮\n基本上是指长短期记忆网络（`LSTM`），通过利用两个协调的循环神经网络（`RNN`）来实现认知。`Jurgen Schmidhuber`\
  \ 在瑞士的团队在深度学习热潮之前已经做了大量的先驱性工作。\n\n# 英国 DeepMind 团队\n强调一种交叉方法，即 `AI = 深度学习 + 强化学习\
  \ (RL)`。他们迄今为止最伟大的成就是就是围棋框架 `AlphaZero` 和 `AlphaGo Zero`。我将在本书书中讨论这两个框架。\n\n# 预测性学习者\n\
  我使用 `Yann LeCun` 提及的术语来描述无监督学习。这既是 `AI` 的精髓，也是 `AI` 的晦涩之处。这是 `AI` 领域一个重要且难以解释的领域。\n\
  \n# 其他方法\n除了上述标准方法外，我们还有：\n\n## 压缩主义者\n认知和学习就是压缩（实际上是不同流派共同的观点）。这里的思想源于 `Kolmogorov`\
  \ 的复杂性理论和 `Solomonoff` 的归纳推测。Marcus `Hutter` 通过伪通用知识扩展了他们的思想假设，即 `AIXI`。\n\n## 复杂性理论学家\n\
  涉及材料科学、基于能量的假设和可测量力学。`Swarm AI` 可能属于这一类。假设真的有一个群体可能对 `Deep Learning` 且何有效给出良好的解释，那很可能来自这个群体。\n\
  \n## 模糊逻辑学家\n这种方法曾经非常有名，但由于未知原因，我最近没有听到太多关于它的消息了。考虑到深度学习这种类比“模糊”方法的进展，人们本该会对这里产生更浓厚的兴趣。最近的一项分布式结果显示，利用\
  \ `Fuzzy` 原则在虚拟空战中击败了一名军事飞行员。\n\n## 生物启发主义者\n那些构建的模型更接近科学中神经元模型的人。包括 `Numenta` 的人们以及研究\
  \ `Spikeand-Integrate`（脉冲整合）或`神经形态`的人，例如 `IBM 的 TrueNorth` 芯片。\n\n## 连连接主义者\n相信大脑的相互连接（即\
  \ `Connectome`）是智能的来源的人。有一个项目试图复制一个虚拟蠕虫，还有一些雄心勃勃且资金丰富的的研究 `[CNC]` 试图以这种方式绘制大脑地图。`[CNC]`\n\
  \n## 信息整合理论学家\n这些人提出了一种观点，意识产生于机器的某种反映现实世界因果关系的内部创造力。这个群体的灵感在于，如果我们真的……这种方法利用了来自模型、复杂性假设、模糊来理解意识的策略，那么我们至少应该开始考虑它！然而，在他们的方法中，我没有看到学习与意识之间的关系。它们之间可能完全没有联系！这也许就是我们真正需要睡眠的原因。\n\
  \n# PAC 理论学家\n由 `Leslie Valiant` 在他的书《可能近似正确》（Likely Approximate Correct）中提出。`Valiant`\
  \ 实际上并不需要研究`人工智能`，而是更倾向于单独研究智能，因为他至少知道它的存在！他的整个想法是，自适应系统高效地执行计算（术称为 `ecorithms`），使得它们很可能都是近似正确的。简单来说，知识并不具有巨大计算的优势。\n\
  \n## 总结\n总而言之，处理 `AI` 的确实存在一组令人困惑的选择性方法。我相信我遗漏了一些方法。某些方法是相互对立的，而另一些可以协同使用。事实上，我确实需要提到，对现有领域有一点了解可以帮助资者探索这一空间。\n\
  \n还有很多……\n\n\n\n\n\n2011 年，IBM 在人工智能领域占据主导地位。该机构展示了其 `DeepQA` 框架如何超越了之前的“危险！”挑战赛冠军。这项成就是令人印象深刻，以至于《危险一答》冠军肯·詹宁斯在即将落败前宣布：“我个人非常欢迎我们新的计算机主宰。”\n\
  \nIBM 的 `DeepQA` 利用了许多如今已成为理想的 AI 进展，包括自然语言处理（NLP）、档案搜索、信息表征、推理引擎和人工智能。随后，IBM 利用其获得的关注度开启了一个新品牌：`Watson`。Watson\
  \ 是 IBM 旗下许多成熟产品以及一些较新产品的集合，它们通常在“认知计算”的理念下整合在一起。随着这些事件的发生，深度学习在 2012 年开始兴起。IBM\
  \ 按照计划开始将深度学习整合到他们最新的 `Watson Developer Cloud` 平台中。\n\n几乎像每一家科技公司一样，IBM 发现自己对这一新兴的\
  \ AI 方法的投入不足。然而，IBM 非常清楚数据的价值，因此公司着手收购了数据丰富的公司，例如 `Merge Healthcare`（10 亿美元）、`The\
  \ Weather Company` 和 `Truven Health Analytics`（26 亿美元）。相比之下，英特尔在 2016 年发现自己在深度学习方面处于落后，于是迅速收购了数家深度学习初创公司（如\
  \ `Nervana`、`Movidius`），并在 2017 年以 153 亿美元收购了 `Mobileye`。\n\n## 深度学习工业复合体\n\n深度学习的精通被世界上大多数创新机构所占据。约书·本丘（Yoshua\
  \ Bengio）在最近接受《金融时报》采访时发表了以下评论：`[WAT]`\n\n> “业界正在选拔大量人才——学术界缺乏这种人才。对于这些机构来说这很好，但对于学术界来说并不稀奇。”`[WAT]`\n\
  \n《连线》（Wired）有一篇类似的文章，“巨头公司正在囤积全球 AI 人才”`[MET4]`：\n\n> “即使是巨头也在讨论人才池狭的问题：微软研究院负责人李彦表示，获得一名顶级\
  \ AI 分析师的费用与聘请一名 NFL 四分卫的费用相当。”`[MET4]`\n\n深度学习在这些巨型组织中蓬勃发展，奇的是，它们正以各种方式向深度学习系统和研究迈进：\n\
  \n### Google DeepMind\n\n自从 Google 在看到他们的 Atari 游戏 AI 后收购了 DeepMind 以来，DeepMind\
  \ 通常倾向于在他们的方法中使用强化学习。他们确实在大多数研究中使用深度学习作为一部分，但总是强调其与强化学习的结合。DeepMind 的研究通常侧重于利用作为模型中非参数层的变分技术。他们还拥有注意力机制系统和记忆增强网络。在研究广度方面，我认为没有哪个机构能与\
  \ DeepMind same。据报道，DeepMind 的研究是由发现知识概念的需求驱动的。你可以在这里找到他们的更多工作：https://deepmind.com/research/distributions/\n\
  \n### Google Brain\n\nGoogle 在开展研究方面有一套独特的逻辑和设计方法。你可以看到他们如何在底层工程上进行巨大的变革。他们对于如何围绕可用的计算资源来组织其\
  \ DL 模型有明确的工作。Google 还将将条形搜索、图交叉和汇总线性模型等传统计算与深度学习结合。这种方法似乎也强调了对灵活配置的需求。得益于巨大的计算和数据资源，Google\
  \ 取得了显著的成果。你可以在这里找到他们的研究：https://research.googleblog.com/\n\n除了构建软件，Google 还开发了自己的硬件。他们有一个专用于深度学习的\
  \ `ASIC`，正处于其下一代。最新版本适用于每秒高达 180 万亿的操作。\n\n### FacebookFAIR `[PFB]`\n\n由杨恩·库恩（Yann\
  \ LeCun）领导。这个团队的性质很复杂，因为似乎最具创新的研究来自库恩在纽约大学（NYU）的团队。库恩的团队会对一些基础性问题进行尝试性研究，这是一个团队往往未能充分执行的迫切缺失的视角。FAIR\
  \ 在 `Torch` 中发布了二三个优秀的开源实现。他们在特定问题上应用深度学习方面取得了一些伟大成就。然而，要检查是否存在特定的研究偏好很难。我们很难识别出他们研究的一个整体主题。也许你会有更好的发现：https://research.fb.com/?cat=2\n\
  \n### Microsoft\n\n微软与 Google 类似，其方法非常均衡且以设计为中心。惊讶的是，微软尽管在这场比赛中落后，但仍设计领域的顶尖力量。他们的研究中心是可能的。我们同意微软可能仅次于\
  \ Google。所有的首批 DL 分析师都加入了他们的团队。参见：https://www.microsoft.com/en-us/research/region/man-made/\n\
  \n### OpenAI\n\nOpenAI 由埃隆·马斯克（以及其他少数赞助者）创立，动力是对不同公司如何获得深度学习能力的担忧。如果你在财务上无法竞争，那就提供学术自由。OpenAI\
  \ 通常会倾向于使用生成模型的方法，更具体地说是生成对抗网络。他们还在强化学习领域做出了真正的尝试。然而有趣的是，尽管生成对抗网络（GANs）具有显著效果，DeepMind\
  \ 总体上似乎倾向于变分模型。你可以在这里看到他们的研究重点：https://openai.com/demands for-research/。微软为 OpenAI\
  \ 提供了其 Azure 支持，从而可能确保了 OpenAI 的忠诚。\n\n### SalesForce MetaMind\n\n由理查德·索克（Richard\
  \ Socher）领导，该团队的大部分工作明显倾向于利用 RNN 方法来处理 NLP 问题。这些配置倾向于在开发中使用记忆。这些人的成果非常出色，并且应该以非常严肃的方式对待。这里是他们的工作：http://metamind.io/research-list.html\n\
  \n### 百度\n\n百度是吴恩达（Andrew Ng）领导的团队，可能是最早真正使用 Infiniband 网络构建大规模 GPU 框架的机构。他们在基础设施方面做了大量工作，并公了部分答案。他们的研究中心一直处于图像和语音处理。在最后一个选项上，他们取得了巨大的成功。你可以在这里找到他们的研究：http://research.baidu.com/establishment\
  \ of-profound。百度最初也与 BMW 在自动驾驶方面合作。\n\n### Nvidia\n\n\n\n\n\nNvidia 正在冒着一切的风险押注在深度学习架构上。他们拥有世界上最顶尖的设计团队，不断调整他们的\
  \ `GPUs` 以获得最极端的执行性能。然而，在学术论文方面，他们完全不在行上，但你可以信任他们在为构建深度学习预期的计算资产上投入了巨大的精力。Nvidia\
  \ 最新的基于 Volta 架构的芯片集成了一个深度学习专用的硬件单元，即 `Tensor Core`，每秒可处理 120 万亿次操作。\n\nNvidia 同样是自动驾驶汽车的主要执行者之一。他们为自动驾驶提供的端到端深度学习解决方案是我们记得的那些非常著名的深度学习研究论文之一。\n\
  \n## Intel Nervana\n\nIntel 在收购 Nervana 这初创公司之前曾陷入过一些困境。他们的硬件架构与 Nvidia 相比完全不可同日。Nervana\
  \ 通常非常擅长编程，即深度学习所使用的计算基础。我的理论是，收购 Nervana 是为了它的产品能力，而不是真的为了他们当时计划的硬件。有趣的是，Nervana\
  \ 硬件的预计发布时间是 2017 年底。在深度学习领域，这似乎是永远的。你不会发现 Nervana 涌现出大量的研究成果（我们认为在他们还是初创公司时，还没有机会积攒足够的深度学习能力）。无论如何，Intel\
  \ 是一个你不能忽视的参与者，他们提供给 `Micron` ($MU) 的内存创新可能会让他们在这个领域获得一种近乎不可思议的优势。\n\n## IBM\n\n\
  当 Watson 在《危险边缘》（Jeopardy）中击败了人类对手时，IBM 引发了整场 AI 热潮。在 2011 年，他们被认为领先所有人。遗憾的是，深度学习一直在持续发展，而\
  \ IBM 在这方面的反应滞后了。Watson 在其部分解决方案中确实包含了深度学习；尽管如此，在深度学习研究方面，他们几乎不存在。他们拥有这种名为 `TrueNorth`\
  \ 的神经形态处理方法，但这更多是出于宣传而非实际内容。IBM 在深度学习领域并不是一个显著的研究者，但如果你观察得足够仔细，你也能找到一些：`https://arxiv.org/abs/1604.08242`。\n\
  \n## Apple\n\n这里真的没什么说的，除了从卡内基梅大学（CMU）聘佣了 Russ Salakhutdinov，这告诉我们未来的研究将强调他对无监督学习方法的偏好。Apple\
  \ 正忙于进行人才型收购（acqui-hiring）。一些较大的收购（例如 Dato）是在机器学习领域。遗憾的是，他们的这类人才型收购大多在数据科学和大数据领域。我想当\
  \ Apple 意识到深度学习与机器学习不同时，他们急于出手并买下了 Salakhutdinov。随着对 Salakhutdinov 的聘佣，Apple 承诺在他们的研究上将变得更加透明：Apple\
  \ 将开始发布他们的工作。`[SHE]`\n\n## Amazon\n\n与 Apple 类似，也没有什么说的，除了支持 `MXNet`是一件好事。他们最初开源了一个名为\
  \ `DSSTNE` 的框架，遗憾的是，这个框架注定会被社区忽视。在外面有这么多竞争性框架的情况下，它很难获得关注。考虑到 `MXNet` 并没有大型公司作为主要后盾，它实际上表现得令人惊叹地好。\n\
  \n## Uber\n\nUber 最近收购了 `Otto`（自动驾驶卡车），并且最近通过收购 `Geometric Intelligence` 建立了他们的\
  \ AI 实验室。`[MET3]` 创始人 Gary Marcus 之前在其他出版物中被介绍过，他当时对深度学习的能力并不印象无好。`[KNI3]` 值得注意的是，Gary\
  \ Marcus 是一个认知心理学家，而不是计算机科学家。然而，`Geometric Intelligence` 能够聘佣大量的机器学习从业业者。`[LUX]`\
  \ Uber 的收购极可能是一次人才型收购，因为 Geometric Intelligence 不可能有任何收入，更不用说任何可以讨论的产品了。\n\n这些公司在深度学习方面投入了巨资。不同的组织对于他们认为重要的事情有不同的优先级。AI\
  \ 竞赛中可能的获胜者将是那个真正足够幸运拥有这些优势的公司。\n\n\n\n\n\n我们可以在比特币世界看到同样的情况发生。在该领域，矿工迅速从 `CPU`\
  \ 移动到 `GPU`，再到 `FPGA`，最后是 `ASICs`。性能的飞跃发生在从 `CPU` 到 `GPU` 以及从 `FPGA` 到 `ASICs` 的转换过程中`FPGA`\
  \ 路线很有趣，并作为 `ASICs` 的良好测试阶段，但收益微乎其微。因此，那些押注于 `FPGA` 为深度学习带来价值的人（即 `Xilinx` 和 `Intel`），应该卖出多头头并做空。简而言之，它只会对小众且新颖的用例有用，而市场小到不值关注。\n\
  \n这种设计将被复制，因为每个人都想要低功耗的深度学习组件。它不需要高内存带宽。它是一个 `CISC` 设备，因此指令集非常紧凑，每条指令平均需要 10–20\
  \ 个周期，只有 12 条指令。（提示：搞微代码的小伙伴们，看起来这里有未来的机会！）芯片面积的 29% 是内存，其中 24% 全是 8 位的 MAC 计算，因此半导体设计并不是什么尖端科学。\n\
  \n按照典型的谷歌风格，使用简单的硬件，在软件上解决问题，而这里的秘诀在于软件。要实现这一点，你必须对深度学习工作负载有极其深入的理解。否则，你如何看出哪些 `CISC`\
  \ 指令是重要的？你还需要一点编译器设计，因为显然主机 `CPU` 似乎做了大量的准备工作来对齐数据和管理结果。\n\n`ASIC` 脉动阵列将冲击市场，可能会有中国政府补贴的硬件制造商在大量生产这些东西。只需要有人出一个开源参考设计即可。就像在比特币世界发生的那样。这些都是老旧的设计。\n\
  \n自从谷歌的 `TPU` 最初发布以来，出现了许多新进展。最初的谷歌开发者决定成立属于自己的 `TPU` 公司并筹了 1000 万美元。`[LER]` `Nvidia`\
  \ 新的 `Volta` 架构包含类似的受脉动的的设计，每秒能够执行 120 万亿次运算。`[DUR]` 谷歌拥有第二代 `TPU`，每秒可执行 180 万亿次运算，并配有\
  \ 64GB 的超高带宽内存。`[CLO]`\n\n### 亚洲的“卫星时刻”\n\n许多年轻读者可能对 `Sputnik`（卫星）的历史并不熟悉。苏联在 1957\
  \ 年发射第一颗人造卫星（即 `Sputnik`）的成就对美国心理产生了巨大的影响。`Sputnik` 让美国产生了升级科学技术基础设施的紧迫感。\n\n`Sputnik`\
  \ 直接促进了美国学校对科学技术的新重视。在紧迫感下，国会颁布了 1958 年的《国防教育法》`[NDEA]`，为攻读数学和科学专业的学生提供低息学费贷款。在卫星发射后，密歇根大学进行并发布的一项调查显示，26%\
  \ 的受访美国人认为俄罗斯的科学和工程优于美国。\n\n2016 年 3 月，DeepMind 的 `AlphaGo` 击败了围棋世界冠军李世石。这一幕被超过\
  \ 2 亿震惊的观众目睹。大部分观众来自围棋流行的国家（即中国、日本、韩国）。围棋在中国具有特殊的崇高地位，它是一项拥有 2500 年历史的游戏，传统上是贵族认为必修修养的“四艺”之一\
  \ `[ART]`：\n\n它们是`琴`（古琴 `[GQN]`，一种弦乐，琴 `[QIN]`）、`棋`（围棋策略游戏 `[GGO]`，棋 `[CHR1]`）、`书`（中国书法\
  \ `[CHI]`书 `[CHR2]`）和`画`（中国画 `[PNT]`画 `[CHR3]`）。\n\n西方开发的自动化技术出现并击败了李世石这样的传奇选手，无疑让许多亚洲人内心深受震动。中国当局对这种可能造成的社会动荡感到担忧，匆忙在全国范围内禁止了该比赛的直播\
  \ `[BAN]`。这种对个人核心世界观的冲击，可能会激励一个国家采取严肃行动。\n\n韩国人在比赛结束后立即创建了一项价值 8.6 亿美元的基金 `[ROK]`：\n\
  \n`韩国于 3 月 17 日宣布，将在未来五年内投入 8.63 亿美元（1 万亿韩元）用于人工智能（AI）研究。这项承诺包括已为 2016 年预算的 1388\
  \ 亿韩元；如果剩余资金平均分配到接下来的四年，则代表 AI 的年度资金增长了 55%。` `[ROK]`\n\n紧随其后的是，2017 年 7 月 20 日《纽约时报》`[CHN]`\
  \ 的一篇文章报道了中国对 AI 的巨额投资：\n\n`许多人正花费数亿美元，但有些人甚至预留了更多。6 月，北京附近的东部城市天津市政府表示，计划设立一项价值\
  \ 50 亿亿美元的基金来支持 AI 行业。` `[CHN]`\n\n此外，看看流向中国 AI 初创公司的巨额资金。`[AIS]` 这些资金似乎比你在美国和欧洲\
  \ AI 初创公司看到的多 10 倍。\n\n2017 年 8 月，《日经新闻》`[NIK]` 题为“日本将向 AI 芯片开发注入资金”，报道了日本对 AI 硬件的深度投资：\n\
  \n`为了资助该计划，该部门计划从 2018 财年预算中申请超过 100 亿日元，还将资助下一代半导体的基础研究。` `[NIK]`\n\n上述所有公告都表明了政府的大力支持。俄罗斯人（他们通常不玩围棋）没有自己的“卫星时刻”来激励更多投资。然而，弗拉基米尔·普京通过对俄罗斯学生\
  \ `[PUT1]` 进行广播演讲，亲手强调了通过教育其国民的必要性。他告诉俄罗斯学生，“成为这一领域领导者的人将成为世界的主。”按照典型的俄罗斯风格，如果他们不能为人民提供武器，也可以依靠毅力和坚韧。然而，俄罗斯的目标\
  \ `[RUSS]` 相当惊人：`政府军工委员会设定了一个目标，到 2025 年使 30% 的军事设备机器人化。` `[RUSS]`\n\n与这些恐慌的国家形成鲜明对比的是，欧盟和美国政府在宣布人工智能（特别是深度学习）的大规模投资方面一直处于缺席状态。我不会等待这种情况改变。对于大多数西方人来说，很少有人玩过围棋，更不用说见过。DeepMind\
  \ 的成就被视为某种深奥的成就，不需要什么紧迫应对。人们完全没有意识到这项成就的规模。\n\n我推测，人工智能并没有被视为由其公民共享的公共利益。西方似乎完全乐意向少数私人垄断者交出自己的隐私，以换取偶尔的多巴胺刺激。最近的一篇文章\
  \ `[SPU]` 告诉了我们悲惨的现状：`迄为止，特朗普政府很少关注 AI 可能如何影响美国乃至整个世界。财政部长曼彻肖轻率地驳了 `[MNUC]` 对自动化取代美国工人的担忧；科学技术政策办公室陷入混乱\
  \ `[TRP]`；美国国务院科学特使最近辞职 `[SCI]` 并要求弹劾总统。` `[SPU]`\n\n嗯，至少加拿人正在积极投入一些零钱 `[CND]` 来应对日益激烈的竞争：`在\
  \ 2017 年预算中，加拿大政府宣布拨款 1.25 亿加元用于由加拿大高级研究学院（CIFAR）领导的泛加拿大人工智能（AI）战略。` `[CND]`\n\n\
  \n\n\n美国政府补贴的严重匮乏正迫使学术机构向私营企业出卖灵魂。企业希望尽快锁定知识产权，而实现这一点的最佳方法就是锁定深度学习研究人员。与此同时，拥有才华的学术机构正面临政府研究资金的匮乏，被迫陷入契约奴役。麻省理工学院（MIT）和\
  \ IBM 最近发布的公告 [MIB] 仅仅是这种严峻困境的反映。\n\n总之，东亚国家确实经历了一个“斯普尼克时刻”。其后果是迫切需要提升其在人工智能和深度学习领域的竞争力。与此同时，世界其他地区大多处于自得乐的状态，忽视了关键的研究资金，并对这项新技术的颠覆性潜力一所知。\n\
  \n在我看来，我不认为西方可以寄于谷歌、微软和 Facebook 等公司正在进行深度学习绝大部分研究的想法。无疑，我们看到他们分享了一些研究成果。然而，我非常怀疑他们会迅速分享他们最大的突破。这些公司远领先于政府所做的任何事情。最近的一份报告显示了国防行业\
  \ [DEF] 目前面临的问题：\n\n“这是一个很难解决的问题，因为……许多最优秀的人才正转向这些大型商业实体，”他说，“你甚至无法在大学里找到他们了。他们正从大学中抽离出来，去硅谷等地工作并开发算法。”\
  \ [DEF]\n\n总之，当前的人工智能研究和资金将仅使少数公司和国家受益。对于我们其他人来说，我们不得不恳求他人大慈地分享他们的发现。\n\n# 深度学习正在吞噬世界\n\
  \n*曾有一段时间人们觉得互联网是另一个世界，但现在人们意识到它是我们在在这个世界中使用的一种工具。*\n- 蒂姆·伯纳斯-李\n\n在本章中，我将从更广义的角度讨论深度学习的应用。我将涵盖自动驾驶企业、辅助性和生成式自动化、行为预测，以及关于深度学习如何教我们理解复杂性的最新进展揭示。我们以列出使用这种颠覆性技术开发的应用程序作为本章的结束。\n\
  \n## 自动驾驶机器\n\n自动驾驶汽车如今正风靡一时。当 Udacity 在几个月前宣布“自动驾驶汽车工程学位”时，他们收到了 11,000 名充满希望的申请者\
  \ [SAG]：\n\n申请人数之多——针对课程的 250 个名额——凸显了 Alphabet 旗下的谷歌和苹果、传统汽车公司以及汽车初创公司对人才的迫切需求，因为它们正竞逐在未来十年内开发出投产的自动驾驶车辆。[SAG]\n\
  \n自动驾驶自动化是一个完全全新的领域。它通常被描述为自动驾驶汽车。该领域的知识尚处于婴儿阶段。这是一个复杂的领域，涉及许多不同技术的集成以及这些集成的实时编排。在\
  \ Amazon Go 中可以窥见这一理念的一角——雇用了深度学习（视觉、传感器融合以及许多其他技术）的自动化系统。Amazon Go 并不是一辆汽车——它是一家自助零售商店！[ALB]\n\
  \n至于其“随走随走”购物体验如何运作，Amazon 似乎非常不愿分享细节。它对系统运作方式的描述充斥着术语：计算机视觉、传感器融合和深度学习。它在整个商店使用传感器和人工智能来判断客户在看哪个方向（即使在人群中也是如此），并能识别被部分遮挡的标签。除此之外，细节仍然是模糊的。[ALB]\n\
  \n软件开发领域极大地贡献了我们工作的方式和经营业务的方式。在 21 世纪初，“敏捷开发宣言》 [BEC] 的诞生是为了应对我们集体有效管理复杂软件开发的无能。该宣言的原则如下：\n\
  \n- 个人和交互优于流程和工具\n- 可行的软件优于详尽的文档\n- 客户合作优于合同谈判\n- 响应变化优于遵循计划\n\n也就是说，虽然右侧的项目具有价值，但我们更看重左侧的项目。[BEC]\n\
  \n软件开发从根本上是一种知识创造活动。物理世界中如此有效的工厂化流程在虚拟世界中并不适用。为了挑战我们对流程的传统认知而创建的敏捷宣言在当时非常盛行。\n\n\
  敏捷开发自那以后不断演变，我们看到的是在需要的地方采用自动化的实践。程序员是极度懒惰的人——与其进行任何种重复单调的工作，他们更倾向于通过编写代码来实现自动化。因此，在敏捷实践中发现如此自动化并不意外。这些示例包括智能编辑器、自动化测试、持续集成和部署、跟踪仪表板、自动跟踪的问题跟踪器，以及自动控制变更的版本控制。自动化最复杂的用法见于敏捷软件开发中，而这确实是关于如何将先进的\
  \ DL 技术整合到自身流程中的丰富思想来源。\n\n敏捷的关键优势在于其能够对变化做出快速响应。如果你能自动化反馈循环的部分，那么你就有了更紧凑的环路，从而拥有了更灵活的过程。\n\
  \n“持续集成”和 DevOps 概念的实现是因为自动化。换句话说，敏捷流程之所以有效，是因为人们有一种持续不断的动力去引入自动化以减少人工工作。然而，这种自动化与人工流程协同工作。在流程中引入自动化的正确处方是从以人为中心的流程开始，然后用自动化对其进行放大。\n\
  \n敏捷方法与瀑布方法形成对比，后者从工厂模型开始，然后对部分进行自动化。这导致你拥有更加不灵活的流程和许多不快的工人。工作的机械化在缺乏计算机协调和通信能力的早期可能行之有效。但在计算和设备丰富且无处不在的世界，人们应该考虑的唯一高效工作模型是基于自适应原则的模型。\n\
  \n来自敏捷开发的理念在初创领域得到了进一步应用。初创世界是一个敏捷是生存关键领域。初创公司正在接受优先考虑客户反馈的敏捷哲学。其目的是通过有效迭代许多业务计划创建一个学习型组织。对于缺乏愿的初创公司来说，这种“精益创业”过程比没有流程要好得多。[LEA]\
  \ 我们如何能更快地学习哪些是有效的，哪些是无效的？这就是该方法的精髓。\n\n\n\n\n我们对具有辅助能力的机械化非常熟悉。当我们通过手机上发消息时，我们每天都能感受到它的存在！因此，电话可以在我们完成写作之前准确地拼写并提供建议词汇。我们在使用的摄像机中也能观察到这种能力。我们目前低估了手机摄像头的自动对焦功能。更先进的\
  \ `DL` 驱动相机（如在 `Google Pixel` 手机中发现的那种）甚至可以模糊图像的背景以产生虚化效果（bokeh impact）。这在曾经是只有配备了更适合深焦镜头（或更小\
  \ f 光圈）的相机才具备的能力。辅助能力允许我们以更快的速度工作，在创作过程中不断提升我们的内容，使其达到显著更高的质量。\n\n我们同样在产品开发领域看到了许多这类辅助技术的应用。IDE（集成开发环境）被赋予了许多能力，可以实时帮助和改进工程师。我们有样式检查器、错误检查器、安全漏洞检查器、代码度量工具、代码包含工具等，在写编写代码时将其应用于源代码中。这种通过持续协调来实现的机械化批判是编程开发中的最佳实践。有些工具甚至可以执行重构等对精确性有要求的单调任务。显而易见，辅助能力可以持续发生，也可以在后端发生。`DL`\
  \ 允许我们执行诸如整理和排序照片集等枯燥乏味的任务。\n\n我们同样经常被数据所淹没。在某些场景中，组织和分析数据的能力非常重要。我们可以通过将数据洪流快速减少为更小、更易于处理的区块，来提升这些策划和分析能力。\n\
  \n生成式能力是另一种被证明是更加不可避免的能力。目前，我们都已实现过移动端应用 `Prisma` 的功能，它可以将照片渲染成各种艺术家的风格：\n\n![](img/image00177.jpeg)\n\
  \n图 2.0 `Prisma` 多功能应用。\\[TMA\\]\n\n“视觉属性迁移”领域的进展非常值得关注，风格可以迁移，以及像色调、纹理或色调等不同的属性。一篇名为《通过深度图像类比进行视觉属性迁移》（Visual\
  \ Attribute Transfer through Deep Image Analogy）[LIA] 的新论文揭示了一些令人惊叹的能力：\n\n（注：原文此处在\
  \ [LIA] 之后未提供具体内容，此处按要求翻译）\n\n---\n\n（注：由于您提供的待翻译文本在 [LIA] 之后出现了大量语义重复且逻辑不通的英文片段（如\
  \ \"Progress in 'visual characteristic' move...\" 等部分），根据“一定不要重复输出原文”以及“高级文档工程师”的逻辑，我已对上述重复部分进行了针对性的整合翻译。如果该部分有特定的逻辑要求，请提供完整文本。）\n\
  \n\n\n传统的行为模型方法论是让社会研究人员对人类行为方式构建见性的模型（通常是实证模型），并利用离散拟合活动来确认模型的合法性。`DL` 方法无论如何都是独特的，因为从一开始就不预期会有一个先验模型。相反，`DL`\
  \ 框架通过观察人类成员的行为方式来学会预测。我们可以通过检查一些利用这种方法的新研究工作来简要了解这一重量级程序。\n\n麻省理工学院（MIT）在《办公室》和《绝望主妇》等节目的\
  \ YouTube 视频上训练了一个预测性视觉 `[VIS]` 系统，用于预测两个人是否会拥抱、亲吻、握手或击掌。`[CSI]`。他们在 600 小时的视频上准备了深度学习框架。该框架能够以\
  \ 43% 的概率预测某项活动。这对比了以往的计算方法，后者预测的准确率仅为 36%。\n\n预测人类行为的一种实用的应用是在车辆范围内进行此类操作。`Brains4Cars`\
  \ 使用了一种基于 `LSTMs` 的传感器融合深度学习系统，在驾驶行为发生前 3.5 秒进行预测。`[BRA]`。它利用摄像头、触觉传感器和可穿戴设备等传感器集合来做出预测。\n\
  \n最近的一篇 NIPS 2016 论文使用深度学习来预测策略行为 `[HWL]`。在许多框架中，假设是参与者以完全理性的方式表现，并基于认知心理学和实验经济学的见解。尽管该框架如此，但从深度学习的角度来看，框架可以在不需要主信息的情况下学习心理模型。这种框架可以击败那些基于精心构建特征的框架。\n\
  \n除了预测之外，深度学习框架已被用于辅助人类交流的设定。在一篇名为《多问题谈判对话策略的强化学习》`[NEG]` 的论文中，作者使用了强化学习和手工的基于议程的策略，并通过让双方在不同设置下相互谈判来评估了它们。`[PAP]`。发现强化学习（`RL`）模型可靠地击败了基于手工计划的模型。同样，人们被要求对这两个框架进行评分，结果是：基于\
  \ `RL` 的方法被认为更加“理性”。\n\n最后，在一次惊人的设计演示中，一个来自捷克和加拿大的小组制作了一个扑克框架，在单人无限制德州扑克中击败了来自 17\
  \ 个国家的 33 名专家扑克选手。该框架获得的成功率远高于优秀玩家的水平。该小组创作了他们的作品 `DeepStack`。`[MMN]`。\n\n`DeepStack`\
  \ 采用了一种大致不同的策略。它继续利用反事实推理（`CFR`）的递归思考来处理数据不平衡。无论如何，它在之前并不确定并存储总策略，因此不需要显式思考。相反，它会考虑游戏过程中发生的情况，但并非孤立地考虑。它尝试通过用快速近似估计代替特定深度的过去计算，而不对整个剩余游戏进行推理。\n\
  \n这种估计可以被认为是 `DeepStack` 的直觉 `[DEE]`：对持有任何可能的手牌在经历相同情况下收益的预感。最终，`DeepStack` 的本能类似于人类本能，应该是准备就绪。我们利用深度学习利用任意扑克情况产生的模型来训练它。我们证明了\
  \ `DeepStack` 在假设上是稳健的，创造了比基于深思的策略少得多的可利用策略，并且是在 `HUNL` 中以超过 450 mbb/g 的平均成功率击败职业扑克选手的唯一程序。`[DEE]`。\n\
  \n`DeepStack` 计算由三个部分组成：用于公共状态变化的稳健区域程序计算、在随机扑克情况下使用学习价值能力的深度限制前瞻，以及限制的前瞻动作配置。\n\
  \n《技术评论》中还有关于 `DeepStack` 的更多评论：`[KNI2]`。\n\n科学家们将 `DeepStack` 的估计方法与人类玩家在对手伪装或持有获胜牌时的直觉进行了对比，尽管机器需要根据对手的下注策略组合其评估，而不是他们的非语言交流。他们写道：“这种评估可以被认为是\
  \ `DeepStack` 的直觉。对持有任何可能的手牌在经历相同情况下收益的预感。”`[KNI2]`。\n\n在这一特殊情况下，除了 `DeepStack`\
  \ 的表现是对对手行为方式的精确预期外，它执行的方式使得它自己的行为方式是不可预测的！\n\n总结，深度学习可以对推断的人类行为以及合理的行为进行预测。预测行为、预见行为或在欺诈游戏中占据主导的能力是商业武器库中非常有价值的工具。然而，如果你仍然不相信深度学习可以预测人类行为，那么你可能会奇怪为什么\
  \ Facebook 会有这样一种工作的职位空缺：Facebook 神秘的招聘列表听起来像是在研究如何读取你的脑想法。”`[JRB]`。\n\n### 会教的机器\n\
  \n西方世界对 `AlphaGo` 统治围棋领域对中国、日本和韩国居民心理产生的重大影响一无所知。我们对围棋很陌生，所以 `DeepMind` 的成就对我们并不适用。尽管如此，这些国家现在已经专注于此，以便在深度学习技术的发展上保持领先。\n\
  \n与此同时，美国存在一种对科学的反感，并没有关于旨在加速这里进展的公共讨论。无论如何，美国幸运的是拥有 `Google`、`Facebook`、`Amazon`\
  \ 和 `Microsoft` 这样深度的互联网巨头，他们基本上为深度学习人才切除了自己的限制性基础设施。\n\n`AlphaGo` 的深远意义不仅限于在策略性游戏技术上取得突破。它是其创造者（即\
  \ `DeepMind`）意识到，`AlphaGo` 不仅击败了最有技能的人类，而且正在发明超越人类想象的新策略。简而言之，它是超越性的技术。这不是夸张，而是确实真实。\n\
  \n这里需要一点澄清以便理解 `AlphaGo` 的机制。`AlphaGo` `[AGO]` 使用许多不同的技术构建。它以一种创新的方法结合深度学习、强化学习和蒙特卡洛树搜索（`MCTS`），以解决大师级围棋的受限\
  \ AI 问题。`AlphaGo` 利用正则化深度学习来引导强化学习策略工作。设计者从一组最近乱过的棋棋集开始。然后该框架被用来进行自我对弈，学习用于 `MCTS`\
  \ 的价值能力以发现创新的玩法。\n\n\n\n\nDeepMind 的 Demis Hassabis 在几次讨论中一直在推动这一观点。DeepMind 借此方式让\
  \ AlphaGo 所对过的游戏的细微之处变得易于理解，并让玩家能够从中获得预期收益。这无疑是一种视角的转变。[HAS] 也就是说，我们目前正处于机器训练人类如何游戏的阶段。当你从辅助性创新跨越到生成创新时，你就进化到了一个全新的范式。\n\
  \n## 总结\n\n总而言之，人工直觉（或 `Deep Learning`）是一种被证明优于过去 AI 技术的创新。无论是否存在“人造意识”（AI），兴趣热度的回升主要由于深度学习研究所取得的卓越成果。这种新的量子跨越完全是由深度学习的成功所驱动的。\n\
  \n全球最顶尖的机构正在迁移它们的基石以帮助这种新的世界观。人工直觉是对传统还原论视角的突破，是“计算机机器人化”的一种完全更好的方法。经常，媒体会不断揭示 AI\
  \ 的惊人进展。此外，你会发现像 `Google` 和 `Microsoft` 等公司正在改变它们的整个编程 DNA 以进入 AI 领域。这一巨大运动背后的依据就是深度学习。\n\
  \n深度学习正在为自动驾驶汽车和其他自动驾驶计算机支持。自动驾驶自动化是一个全新的领域。该领域的信息处于起步阶段。关于这种利用深度学习、`Vision`、`Sensor\
  \ Fusion` 以及许多不同创新的机械化思想，可以在 `Amazon Go` 中找到。`Amazon Go` 并不是一辆汽车 —— 它是一家自助零售商店！\n\
  \n深度学习通过提供辅助能力，此外更具想象力的生成能力来支持工作。辅助能力可以渐进地出现，也可以在后台出现。在某些场合中，整理和分解数据的能力至关重要。我们可以通过将数据流减少为更小、更易于消化的片段，来提高这些策划和分析能力。\n\
  \n生成能力是另一种正变得越来越不可或缺的能力。现在，我们都掌握了多功能应用 `Prisma` 的能力，它可以将照片渲染成各种艺术家的风格。深度学习还赋予了预测人类行为的能力。利用\
  \ AI 控制人类行为已经开始出现。深度学习可以对人类的隐性行为以及正常行为做出预测。预测行为、预期行为或在模拟比赛中获胜的能力，是个人业务武器库中非常有价值的工具。\n\
  \n大型公司正在疯狂地获取深度学习能力。深度学习正突然且充满争议地接管世界。\n\n我将通过不报告现有的深度学习应用来节省一些树。无论如何，这里有一份已构建的应用简短表格：\n\
  \n务必探索链接以查看更多详情。\n\n如果这一切对你来说都是全新的，或者你目前似乎无法启动你的深度学习设想，那么这篇文章对你来说应该很有用：“如果你不在桌上，你就在菜谱上。”\n\
  \n## 3 我们的认知栈\n\n“高智能效率和高能量效比是同义词。”\n\n人类直觉的卓越性可以在奥南语民族的敏锐性中看到。因此，在接下来的章节中，我们将研究奥南语民族的历史背景，将他们置于舞台上，以作为人类自然能力的说明。尽管他们的起点仍处于推测阶段，但关于奥南语人扩散的最明显的推测之一是\
  \ Peter Bellwood 提出的“出台说”或“南中国假说”。正如该假设所示，奥南语人在公元前 4000 年至 3000 年间从中国大陆的云南迁往台湾。从那时起，他们在公元前\
  \ 2500 年左右向南航行菲律宾的吕宋岛，最终遍布整个菲律宾群岛并分散到当地岛屿，最后在公元 500 年左右到达马达加斯加和复活节岛。尽管推测奥南语人是从中国移动的，但在奥南语人的船只设计中并没有发现中国造船技术的痕迹。这支持奥南语人在离开亚洲中部地区后发展了自己的船只设计，使其技术适应了海洋水域，而海洋需要与中亚湖泊和水道船只完全不同的设计方案。[BEL]\n\
  \n然而，Wilhelm Solheim 的一个竞争性假说认为奥南语人来自东南亚岛屿并向中心地区移动，分为四个地理投影：中心、北部、东部和西部，从越南东部海岸开始。与\
  \ Solheim 的假设类似，Stephen Oppenheimer 博士提出奥南语人是从东南亚群岛迁徙，并受到该地区洪水的影响到达此。他提出了三次大洪水，迫使人们向海拔较低的中心地区移动。[BEL]\n\
  \n尽管所有的假设都叙述了奥南语人的起点，但每一个假设都显示了奥南语人学习和适应测试条件的能力。审视 Bellwood 的假设，从亚洲大陆到东南亚群屿的转变实现了更适合海洋的各种船只设计。考虑到\
  \ Solheim 和 Oppenheimer 的假设，从东南亚群屿到亚洲大陆的发展是由洪水引起的，迫使奥南语人制造船只以逃避危险。\n\n奥南语人在海洋上的之旅需要他们的技术和策略所展现的创新和机敏应对。他们协调了在旅途中从遇到并交流的所有社会中收集的信息，并通过追踪当前环境中细微但重要的变化中的模式，建立了自己的数据汇集。奥南语人依靠直觉使他们能够迁移到远至马达加斯加和远至复活节岛的岛屿。在\
  \ 21 世纪的这 100 年里，我们观察到另一种基于直觉的硬件。人工直觉是研究高复杂度空间的设备。\n\n### 人类智能的多样性\n\n深度学习网络是设计识别机器。事实上，它们是以一种自相似的方式开发的，设计识别存在于多个尺度。这些组织是自相似的分形设计识别机器。也就是说，深度学习框架由由其他设计识别机器组成设计识别机器组成。递归构造结束在每个神经元处，神经元本身就是设计识别机器。\n\
  \n它们旨在根据最近训练的设计识别来感知隐藏的设计识别。推测，从广义来看，未见设计识别的类是“易于构想和预期的”类，或者更令人惊讶的是，“完全出意料且难以想象”类。\n\
  \n\n\n\n\n# 新颖性与创新\n\n研究论文《扩张空间上的动力学：新颖性涌出的建模》指出，发现后者（创新）的机制与发现前者（新颖性）的机制是相同的。同一个模型解释了这两种现象。`[LOR]`。似乎我们发现新颖性的方式——如新歌曲、新书等——背后的模式，与创新从“相邻可能”（adjacent\
  \ possible）中产生的模式是相同的。\n\n因此，这是一个极其引人入胜的问题。如果我们假设新颖性发现是 `DL` 系统的内在能力（即泛化能力），那么或许创新性发现也是如此。也就是说，这种能力远超我的预期！\n\
  \n总而言之，直觉是一种通过大规模并行模式识别来得出预测的认知机制。泛化是通过对已识别的相邻模式进行组合而产生的涌现行为。这些模式可能是新颖的类型（即此前未见过的），也可能是意料之外的（即出乎意料的）。我推测，我们可以利用“相邻可能”这一概念作为泛化的抽象解释。\n\
  \n本能的另一个令人好奇的特质是其永恒性的品质。我的意思是，当我们动用本能时，我们无法准确预判它何时会得出一个合理的知识。它就像某些独立运行的后台等效推理机器。我们多久会通过冥思某个问题来发现新的知识点？当我们的意识没有处于自觉状态时，我们的本能似乎工作得比要求的更久。另一方面，它还以一种认知心理无法察觉的方式非常快速地工作。这向我证明，本能的等效理念使其无法精确测算时间。\n\
  \n# 多重智能理论\n\n心理学家霍华德·加德纳（Howard Gardner）有他的“多元智能理论”，他在其中描述了理论上人类拥有的八种智能。`[THE]`\
  \ 与马文·明斯基（Marvin Minsky）的“心灵社会”观点相似。执行数值估算或存储记忆的普通 `PCs` 可以被视为另一种类型的知识。`[SOC]`。这种机器智能无疑在这些领域早已超越了人类的能力。没有人会质疑机器执行数学估算的能力比人类更好。\n\
  \n霍华德·加德纳的人类智能列表（细节请参考维基百科条目）：`[THE]`\n\n- **音乐节奏感与和谐性，也称为音乐智能**：这一区域涉及对声音、节奏、音调和音乐的感知。\n\
  - **视觉-空间智能，也称为空间智能**：这一区域负责空间判断以及在大脑中进行视觉构象的能力。\n- **语言-词源智能，也称为语言智能**：具有高语言语音知识的人在文字和语言方面表现出天赋。\n\
  - **逻辑-数学智能，也称为推理**：这一区域涉及理性、审议、思考、数字和基础思维。\n- **身体-感觉智能，也称为大和小精细动作技能**：对个人身体动作的控制以及熟练处理物体的能力。\n\
  - **人际智能，也称为社交技巧**：这指的是对他人的性格、情感、举止、灵感的感知，以及他们作为群体特征进行协调运作的能力。\n- **内省智能，也称为自我反省**：这一区域涉及沉思和自我智能能力。\n\
  - **自然智能，也称为生态感受力**：这种生物反应能力在对世界及其错综复杂的“敏锐、道德且全包容的理解”中已经根深蒂固，包括人类在更显著生态圈中的作用。\n\n\
  加德纳又增加了几个同样深刻的见解和教育性的知识。`[THE]`\n\n与此部分相关的是 Brendan Lake 等人的论文《构建像人类一样学习和思考的机器》`[LAK]`，关注了加德纳八种智能中的一个子集，研究应该关注这些智能以构建更强大的机器。分析师处理了心理和实际本能，因为这些可能需要机器来完成。\n\
  \n一个合理的图示可能是启发性的，展示了许多见解和不同的心理系统是如何联系起来的：\n\n![](img/image0181.jpeg)\n\n\n\n\n\n\
  这描述了一种处理主题的解构与重构方法。这种课程策略实际上是预料之中的。费曼本人（在加州理工学院《工程与科学杂志》1996 年某期出版的一本书选段中）曾评论过，有必要利用更简单的概念来理解复杂的思想：`[FEY]`\n\
  \n> “费曼是一个非常不可思议的导师。他非常看重能够设计出方法，让初学者理解即使是最复杂的计划。有一次，我告诉他：‘迪克，给我解释清楚，让我能听懂，为什么费半粒子要服从费米-狄拉克理论。’费曼完美地评估了他的听众，说：‘我会针对这个主题准备一个面向一年级新生的讲座。’但他几天后回来告诉我：‘我没能做到。我无法把它简化到绿豆就能懂的水平。这意味着我们并没有真正理解它。’\
  \ `[FEY]`\n\n最后，这是他在 1988 年去世时写在黑板上的内容：\n\n![](img/image00182.jpeg)\n\n图 3.1 理查德·费曼的黑板\
  \ `[RIC]`\n\n它审视了“我无法做出来的，我没有任何想法。”这再次强调了从可能的第一原理创建清晰性的必要性。这随后被 OpenAI 的科学家引用为他们深度学习生成模型方法论的动力。`[OAI]`\
  \ 然而，对于他们的情况来说，他们表达的观点是，理解与恢复想法或思想的能力之间确实存在联系。尽管 `GANs` 可以创建实用的图像，但我非常怀疑 `GANs`\
  \ 是否理解其中的任何内容！\n\n然而，我们应该回到技术本身，因为它可以揭示人类大脑如何进化，以及深度学习框架（机器）可能如何进一步发展其学习。该策略包含三个值得关注的关键组件：\n\
  \n1. 理解某些复杂点的行为。（生成）\n2. 将一个令人费解的主题分解为简单的术语。（拆解）\n3. 重构该主题，寻找任何不规则之处。（构建与验证）\n4.\
  \ 策略的迭代思想。（重复与完善）\n\n我有这样一个观点：人类和深层学习机器都是本能机器。进化为人类提供了一台通过接受和相似性进行推理的心理机器。无论如何，我们的发育硬件并没有具备特定的符号和逻辑思维能力。人类基本上没有获得足够的转化机会来提升这种能力。相反，我们的本能装置一直在以一种浪费的方式执行清醒的思考。\n\
  \n与可以在本地获取符号结构并以极快速度执行理性思维的 `PCs` 不同，我们大脑没有这些特定能力。这是 `GOFAI` 处理 `AI` 方式令人们失望的原因之一，那种方式假设人类思想可以从形式推理中发展出来。\n\
  \n然而，由于进化成为社交动物，人类被赋予了使我们能够在群体内成功工作的工具。我们的大脑允许我们 (1) 从群体中获取人的行为模式 (2) 向群体成员传递并分享我们的思想。随着时间的推移，人类创造了跨越多个时代延续并演化的语言。我们的大脑已经学会了如何理解和交流我们所学到的语言。\n\
  \n语言从根本上说是数据压缩。事实上，甚至总结的能力也可以归类为数据压缩。我们通过语言表达观点的能力同样是我们智力的一部分。\n\n我们大脑拥有不同类型的智能。这个层栈的高层（即逻辑、人际、言语和内省）受到更原始认知能力（即视视觉-空间、韵律、感官和运动）的支持。然而，我们大脑只构建了这些高级认知能力的近似值。我们假装自己是理性的，但实际上处理一个理性的思维过程需要消耗大量的精神精力。我们的自然倾向是利用直觉来做出快速且有时错误的（或有偏见的）判断。\n\
  \n我需要说明的点是，要很好学习某东西，人类和本能机器需要在基础的视觉空间、音乐、触觉层面来学习。当信息仅以符号和智能水平传递时，它是无法在大脑中的。我们大脑通常无法理解反射。相反，我们的大脑对极其粗糙的发展所捕捉的反射有着类比。正如认知语言学家乔治·拉考夫所说：\n\
  \n> *你可以与身体产生深刻且深思熟虑的联系。*\n\n如果你曾站在那里听费曼的许多演讲之一，你会注意到他如何耗费巨大的精力利用联系关系来理解复杂主题。他充分利用了我们的本能。他使用了费曼图，这是一种关于复杂分子材料科学协作的视觉文档（参见\
  \ `tensor networks`）。\n\n![](img/image00183.jpeg)\n\n图 3.2 费曼图。`[FMD]` 此外，他理解元素的方法利用了“路径积分”的可能性，这也是对元素的一种极其本能的描述。某些事情也可以通过视觉方式传递：\n\
  \n![](img/image00184.jpeg)\n\n图 3.3 路径积分 `[PIF]` 简单来说，框架的元素可以被视为从 A 点到 B 点的可选路径。显然，费曼理解了吸引我们的本能来研究前沿动态概念的益处。\n\
  \n\n\n\n其中一项要求是审视自己在阐述中所使用的思想，并决定你是否可以将这些思想拆解为不可改变的思想。我们应该检查每个不可改变思想的合法性（这通常只涉及少数几个领域！）这种认可的部分，正是埃隆·马斯克评论的原因：[BAE]\n\
  \n“我认为，从第一性原理进行推理，比通过类比进行推理更为重要” [BAE]\n\n从关系中进行思考并不困难，因为这是我们天生就会做的。尽管如此，在许多先进的逻辑和机械领域，许多想法是荒谬的。我们基本上无法接受现实的运作方式像我们粗浅的人格所能接受的那样。通过关系来思考对于我们在荒野中生存时非常有帮助，但在面对复杂课题时可能会成为一个问题。\n\
  \n首要规则，或者说“费曼第一原理”，赋予了我们的本能推理地位。本能允许我们探索不同的可选方式，同时呈现出新颖的见解设计。在任何情况下，它都可能包含错误，因此，通过更严密的细致和理性的推理对我们的思考进行重新验证是必不可少的。\n\
  \n印度数学家拉马努金拥有巨大的数字直觉，这使他能够在不彻底推演微妙之处的情况下，追踪无限级数的数值假设。拉马努金的直觉是无与伦比的，他没有正式的高级数学训练，是自学的。拉马努金对数字有非凡的直觉，然而，也有某些时候，他的直觉只能“看到”到此。也就是说，某些无限级数在前百个实例中是有效的，但最终会崩溃。拉马努金培养出了一种在抽象代数方面具有难以想象的先进直觉的心脑。然而，这种直觉无论多先进都有其局限性。这些局限性可以通过更严谨的理性思考（即严谨的手工计算）来验证。\n\
  \n这就是直觉的本质，它倾向于创新和快速，但容易出错。我们人类物种中最才华的“记录机器”目前还无法像 PC 那样进行计算，相反，它们培养了自己的直觉，以进行无法解释的智力杂技表演。\n\
  \n尼尔·劳伦斯认为 [LAW]，人类与机器智能之间的区别在于具身化因素。这是计算能力与通信带宽之比。人类并没有被赋予心灵感应或思想融合的能力。相反，我们受限于语言来与他人交流。相比之下，机器可以通过高带宽通道建立接口，并拥有巨大的计算能力。劳伦斯归于人类的具身化因素是\
  \ `10¹⁶`，而对于机器仅仅是 `10`。\n\n因此，作为人工智能进步的衡量，机器需要在高具身化因素的限制下接受训练。因此，机器需要能够解释其思维过程。这种说法的另一种方式是，机器必须能够进行足够的泛化，使其能够在受限的顺序语言中解释其结论。\n\
  \n## 天性愚蠢\n\n你知道什么比人工智能更危险的吗？天性愚蠢。让我们更详细地探索天性愚蠢，并展示我们目前的技术（由狭义人工智能驱动）是如何让我们集体性地变得更加愚蠢的。\n\
  \n我们都曾有过这样的经历：使用 GPS 引导我们在陌生的地方行走，结果后来发现，如果没有 GPS 的帮助，我们没有记忆也没有能力再次到达那个地方。这不仅由于缺乏使用导致我们的方向直觉减弱了，我们自己的记忆也是如此。我们都经历过由于过度使用\
  \ Google 而失去回忆的能力。我们现在记得更多的是如何搜索某东西，而不是那个东西的细节。\n\n我经常用来探索直觉的框架是位于维基百科的认知偏误法典 [LIS]。它是一份巨大的偏误列表，但要对其有一个概览，有四个高层类别是这些偏见的驱动因素。这些是“信息过载”、“意义不足”、“需要快速行动”以及“我们应该记住什么？”\n\
  \n![](img/image00185.jpeg)图 3.4 认知偏误法典 [LIS]\n\n我们的世界需要更多的自动化来高效且可持续地运行。需求的产品和服务是那些补偿我们短板的产品。这一个明显的缺点是，随着每一次辅助，我们锻炼已经虚弱的功能的机会就越少。\n\
  \n那些不断锻炼智力的人才在维持他们的智力。与此同时，我们的人口正变得由于功能萎缩而变得懒惰。我们想象自己更聪明，因为我们可以多任务处理。然而，我们的大脑并没有进化得擅长多任务。事实上，最近的研究表明，鸽子的多任务处理能力比人类强。[PGN]\
  \ 讽刺的是，我们对自己发现的多任务技能感到自豪，结果发现我们比鸽子更蠢！\n\n然而，有一个比自动化让我们变蠢更糟糕的问题。更大的问题是，其他人类意识到这让我们变蠢，并且他们正机会利用我们的天性愚蠢来影响我们的行为。几十年来，广告业花费了数万亿美元发明新方法来“激励”我们做事，而我们并没有意识到这种影响。这些这些技术完全属于对我们认知偏误的利用。毕竟，如果我们确实完全理性，我们将以最高效率花费资金，而很少公司希望我们这样做。如果我们减少支出，我们的经济就会停滞！（顺便说一下，为了避免经济停滞，我们必须加速消费。）\n\
  \n所以，“天性愚蠢”基本上就是我们缺乏意义、缺乏记忆、无法快速思考以及无法处理过量信息。我们现有的系统提供的和服务是为了替代这些无能。这是寻求最小行动方法的自然倾向。也就是说，最不需要努力或我们能做的最懒惰的方法。\n\
  \n让我们更详细地探索认知偏误的四个驱动因素。人类从出生开始就被驱动着寻找意义。“对于这种现象，最简单的解释将是最具有吸引力的。”文明自然地创造了宗教，不仅是为了创建一个对接受行为的必要共同理解，而且是由我们对意义的需求驱动的。文字（即书籍）及其更高级的形式——互联网是解决我们有限记忆的设备。记忆不仅需要存储，还需要回想的能力。在历史上，宗教和法律被记录在卷轴、书籍中，现在记录在自动化中（参见：区块链）。钱是记忆的形式，也就是说，一个人拥有的钱衡量获取商品服务的标准。人类创造计算机是为了自动化我们发明的数学。计算机不仅存储记忆，还能执行繁琐且无错误的计算。我们发现使用现金不方便，因为我们必须在脑中计算找零金额，以防止错误或直接的欺诈。我们有计时设备，所以不需要观察天空来判断时间。我们有\
  \ GPS 设备帮助我们避免阅读地图并计算通目的地的路径。最后，我们面临信息过载的问题。我们的知识正\n\n\n\n\n\n驱动型经济加速了我们对信息的消费。\n\
  \n然而，我们的大脑并没有发生魔法般的进化来处理这种如洪水般的量量。我们用来处理更多信息的设备，是那些对信息进行筛选并以更易于消化的形式呈现的服务。\n\n今天，如\
  \ `Twitter` 和 `Facebook` 等社交网络已成为我们筛选和接收世界新信息的主要工具。令人大惊的是，这两家公司的领导者认为，“管辖”他们协助传播的内容并不属于他们的章程范围。权力越大，责任越大，除非正如我猜的那样，如果这会影响到底线的话！当我们把责任和问责交给为我们提供认知辅助的自动化（或\
  \ `AI`）时，我们集体就会变得更加愚蠢。\n\n此外，当我们避免质疑宗教领袖的立场，并为了维护自己的信仰而忽视显然令人反感的行为时，问题随之而来。我们回避验证历史，固守虚假的历史信息来证明自己的信念。`新纳粹主义者`和`邦联军`便是如此，他们希望想象一个更仁慈、更公正的过去。我们通过遵循算法执行程序而忽视了常识。就像美国航空发生的一事件，一位\
  \ 70 岁的医生遭到袭击并被赶下飞机，仅仅因为机组人员盲目遵循协议，而不是遵循自己的常识。最后，我们没有对那些利用大规模虚假信息来操纵舆论的组织追究责任。\n\
  \n### 破解直觉\n\n2015 年 7 月 28 日，由 `Max Tegmark` 领导的一群 `AI` 科学家发布了一封关于创建武器化 `AI` 的开放信。\n\
  \n[关于自主武器的开放信 - 生命未来研究所 [OPE]]\n\n他们在信中写写道：\n\n今天人类面临的关键问题是开启一场全球性的 AI 军备竞赛，还是阻止它的开始。如果有任何主要的军事大国推进\
  \ AI 武器化开发，全球军备竞赛将是不可避免的，这一技术轨迹的终点显而易见：自主武器将成为明天的卡拉什民族。与核武器不同，它们不需要昂贵或难以获取的原材料，因此它们对所有主要军事大国来说将变得无处不在且廉价。它们出现在黑市以及恐怖分子、希望更好地控制民众的独裁者、希望实施种族灭绝的军阀等手中，只是时间问题。自主武器是暗杀、动摇国家、镇压人口以及选择性杀死特定族群任务的理想工具。[OPE]\n\
  \n这导致了对“AI 安全中的具体问题”的研究。[AMO]遗憾的是，到 2016 年 11 月，另一种武器化 AI 出现，并造成了毁灭性的影响：“我们是如何破坏民主的（但并非以你认为的方式）”：[ROS]\n\
  \n这种接触在我们社交渠道的背景下非常重要。它们的设计初衷是让我们与我们不希望看到的人和观点隔离开来。[ROS]\n\n在《蓝色信息流，红色信息流》[KEE]\
  \ 中，作者写道：\n\nFacebook 为美国人提供政治新闻方面的作用从未像现在这样强大——或这样具争议。学者们担心社交网络可以创建“回声室”，让用户只看到来自志同道合的朋友和媒体来源的帖子。[KEE]\n\
  \n这些“过滤泡泡”或“回声室”是进一步剥削的主要舞台。说服性机器（Persuasive Machines）是 AI 驱动的自动化，利用对我们认知偏误的了解来破解我们的思维过程，导致说服（或者换句话说，洗脑）。[LIS]\
  \ 这种剥削的一个例子是 Facebook 上假新闻和事件的泛滥。[PIC] Mike Caulfied 写道，“尽管扎克伯格抗议，假新闻在 Facebook\
  \ 上的表现比真实新闻更好。这里有数据证明这一点”：[CAU]\n\n![](img/image00186.jpeg)\n图 3.5 假新闻来源 [CAU]\n\
  \n假新闻的流行比真实新闻高出几个数量级。问题不仅在于假新闻，安全泄露也是另一个。Maria Korolov 写道：[KOR]\n\n“这是我们多年来看到的许多因素汇聚的结果，”位于佛特蒙特州伯灵顿的廉普兰学院（Champlain\
  \ College）网络安全计划负责人 Ric Messier 说。[CHP] “这种泄露并以这种方式操纵人类是如此容易，这无疑表明我们可能刚刚开始看到这类活动或攻击的端。”[KOR]\n\
  \n以 Twitter 机器人形式存在的自动化放大了信息的传递，带来了“从众效应”以影响大众。在《算法民主》[CAM] 中：\n\n通过在分析三场电视辩论期间的\
  \ Twitter 数据，他们发现 20% 的所有政治推文是由机器人发布的。……他们写道，这些机器人可以使网络对话更加极化。它们让传播事实性错误的新闻故事变得更容易。而且它们很容易制造：几乎任何人‘都能获得部署社交机器人军队并影响网络政治对话方向的运营能力和技术工具’。[CAM]\n\
  \n这些自动机器，结合国家级的大规模黑客攻击和网络钓鱼攻击，是一项旨在破坏民众决策的协同努力的一部分。[SZO] 《时尚绅员》（Esquire）杂志在《俄罗斯如何发动历史上最伟大的选举黑客行动》中对此有更详细的描述。[RID]\n\
  \nJonathan Albright 对他所说的“微型宣传机器”进行了更详尽的分析。[ALBR] Albright 写道：\n\n在网络上存在一个庞大的可疑“新闻”网站网络。大多数网站设计简单，且许多看起来是用从相同的网页模板制成的。这些网站创建了一个实时宣传的生态系统：它们包括“病毒式”造谣引擎，这些引擎可以通过对严肃政治话题和新闻事件的大规模“反应”来即时塑造舆论。[ALBR]\n\
  \n人类非常擅长通过说服自己来放弃对新型颠覆性技术的大投入。以下是你周围专家会用来说服你不要投资深度学习的一些理由。\n\n\n\n\n\n还有其他一些方程与\
  \ `DL` 不同的 ML 方法。然而，所有 ML 方法的基本目标都是曲线拟合的通用概念。也就是说，如果数据与某个模型拟合得很好，那么也许它就是一个很好的解决方案。遗憾的是，对于\
  \ `DL` 系统而言，这些系统默认会过度拟合任何任何数据，因为模型中的参数数量太庞大了。这足以说明 `DL` 与 `ML` 系统是两种完全不同的“生物物种”。\n\
  \n### 它仅仅是优化\n\n`DL` 系统拥有一个损失函数，它用于衡量其预测结果与输入数据之间的匹配程度。经典的优化问题也有损失函数（也称为目标函数）。在两类系统中，都使用了不同类型的启发式方法在巨大的配置空间中寻找最优点。人们曾认为，`DL`\
  \ 系统的求解表面极其复杂，因此无法得到解决方案。但奇怪的是，简单的优化方法之一——`Stochastic Gradient Descent`（随机梯度下降）算法，就足够取得惊人的结果了。\n\
  \n这告诉你，这里发生着一些其他事情，而且实际上与优化人士所习惯的完全不同。\n\n### 它是一个黑盒\n\n许多数据科学家由于 `DL` 预测缺乏可解释性而对其产生反感。这不仅是\
  \ `DL` 方法的特征，也是经典 `ML` 方法的特征。数据科学家更倾向于使用概率方法，因为他们对模型或先验概率有更好的控制。结果，他们拥有能够以最少参数进行预测的系统。这一切源于一种信念：简洁性（或奥卡姆剃刀）是万物的最优解释。\n\
  \n遗憾的是，概率方法在图像、语音甚至文本的分类方面并不具备竞争力。这是因为 `DL` 方法在发现模型方面优于人类。纯力量恰恰击败了“生物硬件（wetware）”。在\
  \ `DL` 领域，没有任何实验证据表明简洁模型比纠缠模型运行得更好。对于那些绝对要求提供某种解释的情况，现在 `DL` 中有了更新的方法来为可解释性以及不确定性提供帮助。如果一个\
  \ `DL` 系统可以生成图像的说明，那么它很有可能也可以被训练来为预测生成解释。\n\n### 现在还太早，也太快了\n\n人们存在一种自然的偏见，认为某种存在了五年且正在快速演进的技术太新、太不稳定，而不值得信任。我想，当微处理器、互联网、Web\
  \ 和移动技术出现时，我们都说过同样的话。对于几乎所有人来说，观望是安全的方法，这对于任何没有真正花时间研究细节的人来说，这无疑是一个合理的方法。然而，这是一种非常有风险的策略，无知可能是种福，但另一家公司抢走你的饭碗意味着灭绝。\n\
  \n### 存在过度的炒作\n\n`DL` 能做的很多事情在几年前被认为是不可思议的。没有人预料到计算机能击败围棋顶尖高手。没有人预料到自动驾驶汽车会在今天存在。没有人预料能看到像《星际迷航》通用翻译器的能力。它是如此令人难以信，以至于更像是夸大，而不是某种可能真实存在。我讨厌打破你的无知之梦，但\
  \ `DL` 实际上是非常真实的，当你使用任何智能手机时就能体验到它的好处。\n\n### AI 寒冬可能再次到来\n\n我们经历过很多次 AI 的承诺导致了失望的结果。这种论点更进一步，因为它的失败已经发生过很多次，而且注定再次发生。这个论点的问题在于，尽管令人失望，AI\
  \ 研究已经带来了许多我们今天认为理所当然的软件能力，以至于我们从未注意到过它的存在。优秀的、老式的 AI（`GOFAI`）被嵌入在今天的许多系统中。\n\n\
  目前 `DL` 的发展速度正在加速，确实存在需要解决的问题。对更多训练数据的需求以及缺乏无监督训练是两个问题。然而，这并不意味着我们拥有的东西没有价值。`DL`\
  \ 已经可以开车。这本身就告诉你，即使另一个 AI 寒冬到来，我们也已经达到了一种仍然非常有用的开发状态。\n\n### 缺乏关于其工作原理的理论\n\n研究社区对于\
  \ `DL` 为什么运行得如此有效还没有稳固的理论理解。我们对于多层神经网络在拟合函数方面比层数较少的网络更高效的原因有些了解。然而，我们并不理解为什么会发生收敛，或者为什么会产生良好的泛化。此时，`DL`\
  \ 具有很大的实验性，我们正在学习如何表征这类系统。与此同时，尽管没有良好的理论理解，工程仍在向前发展。研究人员利用他们的直觉和有根据的推测，能够构建出极其优秀的模型。换句话说，没有人停止工作去等待更好的理论。这与生物技术研究中发生的情况几乎相似。人们正在尝试许多不同的组合，并取得了他们尚无法解释的新发现。科学和技术的进步是非常混乱的，人们不应该因为混乱而逃避其益处。\n\
  \n### 它并非生物学启发\n\n`DL` 系统与我们大脑中的神经元非常不同。`DL` 学习的机制（即 `SGD`）不是我们能通过大脑中发生的情况来解释的。但这里的论点是，如果它不像大脑，那么它就不可能执行大脑的那种推理和学习。这无疑是一个极其弱的论点。毕竟，飞机不像鸟，但它们确实会飞。\n\
  \n### 我不是这方面的专家\n\n缺乏内部专家不应成为找不到外部专家的借口。这也不应阻止你学习这项新技术。然而，如果这些专家持有教条主义观点，那么说明你应该寻求第二意见。\n\
  \n### 它不适用于我的问题\n\n企业是由许多业务流程组成的。除非你已经对可以使用当前的 `DL` 技术自动化的流程进行了审查，否则你没有立场声称 `DL`\
  \ 不适用于你。此外，你可能会发现目前不存在的新业务流程和商业机会，这些都是 `DL` 创新的双重带来的可能。在你投入预期的努力工作之前，你无法对这个问题做出回应。\n\
  \n### 我没有资源\n\n\n\n\n\n南岛尼人所跨越的广阔水域和岛屿并非容易精确描述的。然而，这一族群掌握了如何在马达加斯加到复活节岛之间的岛屿间扩张和殖民。盛行的南岛尼人独木舟是个人在星球上的重大投入，它们带着他们穿越东南亚的岛屿以及更远的地方。其中一部分独木舟被描述为长度\
  \ 15 米，可以承载 30 到 50 人。有些则更大，据可以运送整个超过 100 人的 `barangay`（村庄或城镇）。少数描述显示这些独木舟可以到达约\
  \ 10 个方位，且行驶距离可超过 800 公里。`[BEL]`。\n\n然而，这些独木舟仅仅是工具。如果没有南岛尼人所创造的路线信息，在海洋中航行模糊岛屿将变得非常麻烦，甚至是不切可能的。通过这种方式，他们创造了心理技术，使能够在没有明确参考焦点的情况下进行探索。这些策略中的一部分保留了下来，并受到一些现代家族的保护；今天，这些技术被修改并教授，作为高级导航框架的一部分，一种非基于工具的路线类型。其中一种策略利用星星罗盘，这是一个具有\
  \ 32 个焦点的心理构造，用恒星和天体命名。为了探索，他们还会观察鸟类，鸟类在水面上觅食并寻找陆地定居。特定的云层排列也会岛屿周围形成，可以从良好的角度看到。此外，这些航海者还会阅读海流。不同的洋流可以引导导航员到达陆地，也可以告诉他们风暴是否正在形成\
  \ `[DIP]`。\n\n回到章节引用部分，理查德·费曼在一次解释电脑如何运作的演讲中表达了上述话语。他引入了“`recording framework`”作为其解释的类比。费曼所描述的是机器的限制与人类能力的相似性，这是一个有效的例子：南岛尼人从海洋中获取数据并自然调节的能力。他无法预料的是，这种自然能力将在\
  \ 2012 年通过“深度学习”实现。\n\n这一部分探讨了人类推理、其局限性及其干扰。这里的揭示是，`Deep Learning` 框架是本能机器。理解这一观点将使开拓者在掌握这项新兴技术的优势和局限方面获得强大的平衡。这是应用任何新技术的性基础阶段。\n\
  \n### 理性的局限性\n\n获取知识有三个基本的修复，遗憾的是，现代数学在处理这些问题方面存在困难。科学是增强我们思维过程的工具。科学是我们用来确定理解真实世界的人类语言。无论如何，数字语言并非万能，并且具有局限性。我们在这里研究这些限制的一部分，特别是针对对\
  \ AI 至关重要的领域。\n\n尽管科学的发展通常会比现在进步得多，但通常情况下，将另一种类型的数学应用于另一个领域会带来飞跃。例如，理查德·费曼利用极其古老的路径积分科学获得了对创建量子电动力学的新见解。科学中总有很多限制，这一部分关注这些关于我们理解认知基本要素能力的局限。\n\
  \n数学的“`Quasi -empiricism`”并非一个新观点 `[QUA]`。数学是人类用来描述生存的人类语言。引用自 Wikipedia 文章 `[WIKI]`：\n\
  \n尤金·维格纳 (1960) 注意到，这种文化的异步性并不限于数学、物理科学，甚至是人类 `[EUG]`。\n\n### 关于时间的推理\n\n主要的局限是时间和记忆的概念。时间是一个难以处理的概念。我推测处理它最简单的方法是像爱因斯坦做的那样：简单地视为另一个维度。\n\
  \n大多数材料科学对时间是不变的。这意味着，你可以沿着时间向前或向后移动，材料保持不变。尽管如此，在宏观世界中我们并不这样看待它。由于熵的存在，时间才存在。时间的箭矢遵循着不断膨的熵。\n\
  \n坦率地说，如果不考虑时间的存在，实际上没有记忆的概念。大多数科学并不理解记忆。记忆可以比作拥有状态，而几乎所有的数学包含了无状态的函数式结构。函数式编程遵循单一任务准则，其中任何因素被设置后，它将保持在该状态，永远不会改变。这种指令性使得它有效地可以被并行化为某些东西。\n\
  \n### 关于涌现行为的推理\n\n下一个修复局限是聚合涌现行为的概念。\n\nRobert Sapolsky 在 YouTube 上有一段短讲 `[SAP]`（“思考涌现与混沌”），他引出了自下而上行为的观点。正如他说：“和他朋友所做的大部分工作都是非常局限的还原性工作。”\n\
  \n\n\n\n\n智能源于数百万甚至亿相互作用组件的集体行为所产生的涌现行为。这正是连接主义人工智能（Connectionist AI）概念的本质。组件本身并不需要以复杂的方式构建。它们可以非常简单，实际上可以全是统一或同质的。人工神经网络和深度学习源于这种从被称为“神经元”的简单组件中推导出智能的理念。需要提醒自己的是，`ANN`\
  \ 中的神经元是生物神经元的卡通化版本。然而，重要的并不是神经元的精确构造，而是它们的集体行为。这就是为什么，认为由于 `ANN` 和 `DL` 不符合生物学合理性而应该拒绝它们的推理，是一个非常糟糕的论点。完全可以想象，使用不同类型的“神经元”也可以获得智能。这是因为神经元执行了某些基本能力（即信息动力学，意味着计算、记忆和信号传递），这些都是必需的，但智能是在连接性中涌的。\n\
  \n## 关于元推理的推理\n\n第三种修复是元级推理（meta-level reasoning）的思想。\n\n这是最难处理的计划，事实上，它可能正是“认知”（cognizance）存在的理由。我们可以通过额外粗糙思想的组织来获得发展中的思想。我们可以理解这一点，因为这是语言发展的方式：从字母到音节，再到单词、句子、段落等。\n\
  \n我们还知道关于元级思维（meta-level thinking）。它是对于初级开发者来说难以解释的思想之一，但存在于许多编程语言中。也就是说，你拥有可以在实际语言的结构上运行的程序。这促成了极具表现力且短小的源代码。经验丰富的开发者在元级上工作没有问题。尽管如此，这类框架非常难以调试。\n\
  \n然而，元思维并不仅止于一个层级。你可以有不断发展的元级。我在统一建模语言（`UML`）中经历过这种思想。元模型（meta-models）的概念，其定义如下：\n\
  \n> *元模型或替代模型是模型的模型，元建模是涉及创建此类模型的方法。*\n\n这是泛化（Generalization）最广泛的含义。\n\n### 人工直觉\n\
  \n本能是如何创造的？它是如何推动进步的？这与深度学习有什么关系？直觉与认知类似，是我们已知的事物，但尚未以任何种状态对其进行研究，以对其倾向产生基础性的理解。说实话，我们会认同对认知概念的审查比对本能的研究要多。存在一些小组研究了关于人工通用见解的认知，但我不认为这与对直觉的研究相比已经投入了同等的精力。\n\
  \n我特定的兴趣不在于人类直觉，而在于人工直觉。总而言之，人工直觉同样适用于直觉，它具有与更受研究的认知形式（即逻辑性的、理性的）不同的属性。我深信深度学习系统是人工直觉系统，而不是基于理性认知的\
  \ `GOFAI`（传统符号人工智能）。这一判断是基于直觉和深度学习属性的共同性。`[PERR]`\n\n有一些被我们归为人类特有的心理能力术语。智能、直觉、自我意识和意识就是其中一些。今天，我们不再将计算归为人类特有，因为我们已经创造了\
  \ `PCs`。说实话，无论笛卡尔怎么想，我们没有一刻认为智能的说服性生物是人类特有的。这是因为利用计算机可以更好地执行真正的思考。\n\n通过深度学习，另一种理解——明确的本能——正在被计算机化。它与理性思考并不完全相同，因为它没有模型。特别是，它在没有问题表述的情况下开始，随后通过归纳思维的过程创建一个。这是人类本能执行的非常独特的交互——从归纳中获益。\n\
  \n尽管如此，人们可能会辩称人类执行本能的方式与深度学习框架不同。这显然是一个真实的断言。尽管如此，这等于说人类进行数值计算的方式与 `PC` 不同。例如，人们并不使用配对运算。\n\
  \n对本能的研究并不新鲜。双过程理论（Double Process Theory）提出心理利用两种不同类型的心理框架运作。卡尼曼（Kahneman，见《思考，快与慢》`[HOL]`）利用双过程理论探索人类如何由于直觉和理性的相互作用而陷入偏见和错误的思维。`[HOL]`\n\
  \n尽管如此，不同的专家更仔细地关注本能。也许最著名的解释本能的书籍是马尔克斯·格拉德威尔的《闪念：无意识思考的力量》。`[GLA]` 格拉德威尔对直觉的类比是，大脑“完善了从海量变量中过滤出极少数重要因素的艺术”。我认为这是一种松散的相似。通过直觉做出的推理或预测通常非常难以理解。心理并没有进行“分离”；相反，它以一种巨大的均衡执行预期，给人一种减少过程的印象，但完全是独特的。奇怪的是，格拉德威尔说：“在破坏某物的演示中，你失去了它的重要性。”`[GLA]`\n\
  \n格拉德威尔提高了本能的可能性，足以让马克斯·普朗克人类发展研究所主任兼专家格尔德·吉根泽（Gerd Gigerenzer）写了自己的书籍《预感：无意识的智能》，更详细地解释了他的研究`[ELR]`。吉根泽将本能描述为具有以下属性：\n\
  \n> “迅速出现在意识中”，\n> “我们对其基本原因并不完全知晓”\n> “能够被跟进。”`[ELR]`\n\n但大脑如何提高直觉思维？西奥·汉姆布莱在《设计与心理学背景下的直觉》`[HUMP]`\
  \ 中探讨了这一点。汉姆布莱挑战了心理学家将本能概念标记为“大脑研究领域的边缘，即超心理学、灵异和预感的领域”。`[HUMP]` 从设计的角度来看，这让他感到惊讶，并给出了：\n\
  \n> *从设计观点来看，直觉具有所有与“规划世界”合作时是如此重要的特征。作为一个糟糕和优秀自然设计的说明：*\n\n![](img/image00187.jpeg)图\
  \ 4.0 不直觉的设计（左）和直觉的设计（右）。`[HUMP]`\n\n\n\n\n\n# 设计哲学\n\n无论如何，设计师并不在每种情况下都完全凭直觉工作。大师规划师显然比初创者拥有更优的直觉，他们通过经验获取信息。在许多复杂领域，这种经验通过使用\
  \ `Design Patterns`（设计模式，亦称为“模式语言”）`[DES]` 以显式的形式记录下来：\n\n> *这种语言的组件是被称为“设计”的元素。每个示例都描绘了我们当前环境中反复发生的问题，随后描述了该问题的解决方案的核心，以便你能够多次利用这种安排，而永远用相同的方式执行两次。——克里斯托夫·亚历山大*\
  \ `[DES]`\n\n大脑是设计识别机器，随着足够的经验，我们开始感知更多的示例；然而，随着经验的增长，我们逐渐发现了更复杂的示例。这正是专家与学习者的区别。`Bruce\
  \ Kasanoff` 有此深刻见解：\n\n*如果你所做的一切只是坐着并相信你的直觉，那么你并没有在实践大量的知识。但如果你深入研究一个学科并探索许多可能性，那么当你的直觉告诉你什么重要、什么不重要时，你是在锻炼智力*\
  \ `[KAS]`。\n\n`Design Patterns` 的实践在于将这些模式（即隐性知识或直觉）以一种集体策划并能向更广泛受众传播的形式记录。与其让每个个体独自从经验中学习，不如通过\
  \ `Design Patterns` 捕捉集体智慧。在某种意义上，`Design Patterns` 是“工业化的直觉”。\n\n## 创新之路\n\n既然我们已经有了这些示例（无论是已安排的还是未言的），那么它们是如何转化为洞察或创新的呢？我们处理模式的方法有哪些？`Technology\
  \ Review` 评述了近期的一篇名为《数学模型揭示创新产生的模式》的研究论文 `[MAT]`。\n\n在所引用的论文中，创新是由“相邻可能”（the adjacent\
  \ possible）`[BRO]` 实现的。即那些与现有学习设计仅隔一步的示例。因此，与其创建没有任何关联的设计，不如新示例是通过现有示例识别出来的，并通过这种方式发现被忽视的设计的新领域：\n\
  \n> *通过对相关新颖性的动态提供首次定量表征，可以作为更深入地理解触发事件不同性质（时机性、规模、传播、个体与集体属性）以及个人和集体层面“相邻可能”的特征、其结构及其在个人发明时刻的重建的起点。*\
  \ `[BRO]`\n\n未被探索的模式包括：\n\n- **新颖性 (Novelties)**：易于构想和预期的模式。\n- **发展模式 (Developments\
  \ Patterns)**：完全无法预测且难以想象的模式。\n\n令人惊讶的是，进步的可衡量事件显示出惊人的常性，这可以在更深层次上进行探索。\n\n## 深度学习\
  \ vs 经典 AI\n\n深度学习正在人工智能领域经历复兴。对于该领域的一些资深专家来说，这种翻天覆地的变化并不显而易见。`Deep Learning` 是对旧\
  \ AI 策略的跨越。一位意识到我们对通用人工智能（AGI）的经典方法几乎已经失效的研究人员是 `Monica Anderson`。`[GK]`。\n\n`Anderson`\
  \ 是早期几位专家之一，他们察觉到还原论的逻辑方法已经处于不可挽救的混乱之中。还原论在寻找 AGI 的过程中让探索偏离了方向。\n\n`Deep Learning`\
  \ 与旧式 AI 方法之间存在的一个惊人相似点是直觉与理性之间的对比。`Double Process Theory`（双过程理论）推测存在两种认知，通常命名为“框架\
  \ 1”和“框架 2”。\n\n### 表格 4.0 双过程理论\n\n`[DPT]`\n\n\n\n\n\n卡尼曼的书探讨了人类的认知偏误，并将双系统过程视为这些偏见的根源。然而，在本节中，我将探索系统\
  \ 1（即直觉），更具体地说是人工直觉以及产生这种直觉的机制。\n\n深度学习有着悠久的历史。该方法论始于连接主义方法，并在很大程度上受到复杂科学中思想的启示。某种多或少说，这种思想是：新的复杂行为可以从基础工具中产生。动荡和复杂性是复杂系统中存在的两个主要动力。\n\
  \n因此，我们在那个点的目标是理解或更深入地理解显性特征是如何通过混乱和复杂性产生的。以下是几个关键亮点，以及一些需要极佳答案的问题：\n\n-   **自组织**：框架如何自我安排，以赋予能够预期的持久性行为，并抑制破坏性行为？复杂的层级结构是如何从基础结构中产生的？\n\
  -   **鲁棒性**：框架如何组织自己以对失败更具韧性？框架如何获得在意外环境中生存所需要的灵活性？\n-   **多样性**：适应性和持久性需要多样性，而这种多样性可能比同质化安排更理想。专家组合或组合技术的结合强调了多样性在提高预测性方面的价值。\n\
  -   **抽象**：框架如何熟悉在敌对性复杂环境中执行精确预期的预期反映？推测是如何从对抽象的学习中产生的？\n-   **适应性**：哪些变异工具对于补偿错误预测至关重要？框架如何忽略可能对其生存不利的学行为？\n\
  -   **有界预测**：用于预测的计算资源如何被限制？预期应该被立即赋予持久性重要性。框架如何能弄出如何改进其预测以适应在固定边界内？\n-   **协调**：框架何时能弄出如何与其他参与的实体协调其活动？环境包含无生命物体，还包含其他具有学习能力的框架。框架如何熟练掌握其当前处境，并弄出如何与其他学习系统接口？\n\
  \n这些复杂多功能框架的元素都与过去关于“三性”（Ilties）的对话有关。即表达性（Expressibility）、可训练性（Trainability）和泛化性（Generalizability）。专家之间存在的合理陷阱之一是，我们无意中可能会获得基于数值或设计准备的不利策略。也就是说，我们接受了诸如对最优性的需求、对不完美安排的需求、对可解释性和合理安排的需求、对完成和可重复行为的需求。这些需求显然是吸引人的，但我们不应该在初始阶段为了这些进行优化。这导致了过早优化，一个我们在软件工程中非常熟悉的想法。相反，我们都应该首先拥抱复杂和混乱，并制定全面整合这些因素的安排。深度学习的研究是一个重大的视角转变，这需要另一种思维方式。\n\
  \n我们需要做的主要理论跳跃是理解学习框架在非平衡设置中进化。换句话说，科学家在研究这些框架时，应该非常谨慎地使用测量或其他质量热力学测量。我们相信，AI 研究中最不恰的工具之一是贝叶斯方法。我可以理解它在一致性领域的用途，但我怀疑它在自然系统领域的可行性。\n\
  \n第二个计算跳跃是对比“推测”（Speculation）的理解极其匮乏。该词在机器学习中的用法非常随意。此外，机器学习的“弯曲拟合”方法以及由此产生的在相邻焦点点之间的拟合弯曲中的推测，偏离了深度学习中最近发现的重复保留概念。死记硬背如何导致泛化充其量是一个模糊的想法。老实说，卡尼曼的分析引起了注意：人类心理倾向源于我们自然系统\
  \ 1 演化中的错误思维。正如上述所，是极其糟糕且不完美的推测。最后，重复记忆引发了一种本质上存在缺陷的推测！\n\n\n\n\n\n# 变量的操作\n\n##\
  \ 排序标记的区分\n\n- 一种处理集合、区域、方式、方向并穿透`个体`的能力\n- 一种处理文章功能的方法：质量的`时空连续性/保持`\n- `因果关系`\n\
  - `平移不变性`\n- 成本效益分析能力 `[MAR]`\n\n## Marcus vs Yann LeCun：关于硬件与学习的观点\n\n### Marcus\
  \ 的观点：内在能力与以硬件为中心的方法\nMarcus 接受这些能力是存在于人类中的内在硬件。在辩论中，他展示了 `Allen Institute` `[MOL]`\
  \ 的一些工作，该研究估计 90% 的 `DNA` 编码被用于重建（我推测是通过间接编码）大脑机制。Marcus 遗憾 AI 探索缺乏对硬件的关注。Marcus\
  \ 同样接受计算资产拥有运行这些天然硬件（当它们被发现时）的选择。\n\n相比之下，Yann LeCun 以一种意想不到的方式接受了这一点。我们需要更多的计算资产，而我们对人类大脑计算必要性的评估是极其错误的。LeCun\
  \ 看到，`Deep Learning` 的进步已经证明了我们可以通过更简单的机器学习精细的精神能力。总的来说，`PC vision` 是用人类设计的部件构建的。然而，从\
  \ 2012 年开始，`ConvNets` 已经超越了设计最好的算法。这是在没有任何准备的情况下获得视觉能力而完成的。LeCun 认为，我们不应该再次陷入那种手动设计内在机制的方法中。\n\
  \n### 深度学习方法论\n`Deep Learning` 群并非没有设计新类型的组织。与常规定相反，很大一部分的研究与为各种空间提出新类型的组织模型相关。无论如何，这种方法与过去的方法相比是不可思议地独特的。与完全为特定空间指定另一种部件不同，这些部件通常更具通用性，并准备适应某个区域。可以建立植物生长的关系。分析师只需要描述框架并基本上执行更改，以引导组织“生长”成理想形状。解决我们目前已经足够的这些内在机制的发展。\n\
  \n### LeCun 的担忧：简单性与奥姆剃刀\nLeCun 对设计内在机制的担忧是它可能是次优的，甚至糟糕，它可能是错误的。LeCun 使用的规则是部件应该尽可能简单。他引用\
  \ `Occam’s Razor` 作为他方法的支撑。他同样区分了子符号框架和代表框架之间应该跨越的语义鸿沟。此外，他反复强调对自主学习或他自己的术语“预见学习”的需求。`[PER25]`。\n\
  \n### Marcus 的挑战：蓝图\n相比之下，Marcus 接受他理解应该构建的特定内在装置。尽管如此，他无法交流事物将如何被制造，甚至是这些天然装置如何被组合在一起作为一个理性的整体。这还没到猜测哪里错误的程度。人们至少需要理解缺失的部分大部分程度上将如何组合在一起。人们感觉\
  \ Marcus 的提议承认了应该建立的子计划，但无法交流这些子程序如何被创建一个有意识的程序。\n\n### 现状差距\n因此，我们留下的是非常不可接受的东西。Marcus\
  \ 对应该构建什么有一些想法，但对它将如何组合在一起一无头绪。LeCun 意识到算法缺少了什么，但他对于规划新算法的最优方法几乎几乎没有方向。我认为 LeCun\
  \ 比 Marcus 更正确，因为他本质上有一个引导我们到达那里的解决方案相似性。Marcus 只理解我们真正想去哪里，但似乎对如何组合它的最佳方法没有任何知识。\n\
  \n## 元模型解决方案\n\n### 结构块\n允许我分享比这两位著名辩论者更有意义的见解。\n\n这显然是一个在元模型层面解决的问题。我在之前的“元模型与深度学习的元模型”中研究过这个问题。如果我们有制造它们的术语，我们就可以制造这种内在装置。也就是说，我们需要找到内在装置的结构块。如果我们真的拥有这些结构块，演化技术就可以启动它。我们在这里真正需要演化技术的解释是，除了一个可以驱动该计划的近似耦合规则外，没有合理的初始标准。此外，目前存在的演化语言证明了制造我们认知所需的天然硬件确实是可行的。这种语言目前编码在我们的\
  \ DNA 中，我们的大脑中也有案例。\n\n### 松散耦合原则\n元模型层的术语应该符合`Loosely Coupled Principle`（松耦合原则）。特别是，我们要求使用构建块（注意：内在硬件是由构建块组成的），这些构建块遵循任何近似耦合的计划设计。如下表所示：\n\
  \n![](img/image00188.jpeg)\n*表 4.1 构建块*\n\n这些示例迫使计划空间避免任何具有紧耦合特质的方法。这比像 LeCun 那样仅仅搬出\
  \ `Occam’s Razor` 是一种更微妙的方法。任何近似耦合的方法都要求极小的怀疑量，从而这是一种更明确的简单性。如果你在考虑这些示例来自哪里，它们来自过去十年对可互操作约的研究。\n\
  \n## 结论：互操作性与演化\n所以，为了限制形成规划专家的侵蚀，人们需要倾向于支持互操作性的约定。这些约定是近似耦合的，即那种期望以最少（接受基本假设）来启动事务的类型。因此，当我们讨论如何构建内在装置以及天然硬件将如何安排执行任何事情时，我们最终需要从一个类似的原则安排开始。\n\
  \n当你拥有激发互操作性的工具时，你就有了一个竞争的机会来达到一些新的自我关联。当你准备了如此数量的假设时，那么一部分就会变得不那么精确，随后也就不那么准备参与组合。\n\
  \n自然演化的基本要素是，你有一个介质（例如流体水），它为分子提供了寻找组合的机会，并且它需要与其他分子组合机制的分子。这里有一个搜索机制和一个组合机制。目前，我们有搜索机制的泛化版本，但我们不知道那些分子是什么。\n\
  \n### 直觉摧毁了逻辑\n现代人类演化和创新的特征促使我们自身直觉的衰落。我们许多人已经忽视了它的价值，甚至它的实际存在。作为复杂计算的前提，直觉被轻易地推脱为一种超越常规的方法。这种平凡的缺失导致许多专家忽略了它的潜力。\n\
  \n\n\n\n仅仅是叠加在基于本能的硬件之上的重新创造（参见：“认知堆栈” `[PER26]`）。这与笛卡尔广为人知的名言“我思，故我在”（`Cogito`\
  \ therefore aggregate）形成了鲜明对比，后者推断出我们理性的推理将我们与所有科学隔离开来。沿着这一思路，我们从心理上倾向于要求由智能硬件驱动的进展和策略。这无疑解释了为什么过去几十年里，“老派人工智能”（`GOFAI`）一直令人失望，因为它从初试图从形式化逻辑的起点来解决洞察力问题。\n\
  \n关于基于本能的机器，其荒谬的预测之一是：“合理的理念是如何在任何时间点从本能机器中产生的？”自 2012 年以来，我们见证了深度学习创新的惊人进展。正如我之前所说，深度学习网络是本能机器。这些框架通过利用接受学会如何进行推导（或做出预测）。深度学习框架已经能够执行通常留给有机大脑的任务。对于普通记录系统来说极具挑战性的任务，如人脸识别和语音识别，这些机器可以以神一般的水平完成。\n\
  \n然而，深度学习网络无法执行长除法等逻辑任务。人们不应期望能够教导动物（例如，你的狗）进行乘法，更不用说加减法了。然而，人类大脑能够处理各种逻辑问题。但我们必须问：穴人能做乘法吗？我们天生就具备高级逻辑认知能力，还是说这种能力是我们随着先进文明的发展而学会的？\n\
  \n实现更广泛的人造脑力需要跨越的巨大鸿沟被称为“语义鸿沟”。`[PER27]`。我们如何将深度学习（`亚符号`）系统与逻辑（`符号`）系统融合起来？\n\n\
  人类人格可以完成持续思考的非凡成就。假设我们的设备完全是基于本能的，大脑是如何准备做到这一点的？我在这里假设我们没有先天的智能硬件。人类（`Homo sapiens`）在地球上存在的短暂时间范围内，不可能发展出这种心理硬件。因此，为了弥补语义鸿沟，我们希望利用本能工具来连接它。这意味着我们不需要将逻辑部分与本能部分进行组合。我们任何时候需要的都是本能组件。\n\
  \n因此，我们真的希望尽力证明，复杂的本能机器可以执行持续的推理。这正是 `AlphaZero` 实现其渐进式展示的地方。`AlphaZero` 是 DeepMind\
  \ 围棋程序的最新进展。我之前写过关于 `AlphaGo Zero` `[PER28]`（与 `AlphaZero` 不同），介绍它是如何从零开始学习掌握围棋的（无需人类知识）。西方人从未玩过围棋，本质上无论如何想象都无法理解。因此，DeepMind\
  \ `AlphaGo Zero` 成就的相关性被忽视了。围棋被认为是一种本能的游戏，因为显而易见，一台本能机器（考虑到深度学习）可以主导这项游戏。\n\nDeepMind\
  \ 的新作品 `AlphaZero` 所能做的是国际象棋。这对于某些人来说可能并不令人惊讶，因为自 1996 年 IBM 的 `DeepBlue` 击败卡斯帕罗夫以来，国际象棋就被电脑“解决”了。人们不应期望能够教导动物（例如，你的狗）进行乘法，更不用说加减法了。然而，人类大脑能够处理各种逻辑问题。但我们必须问：穴人能做乘法吗？我们天生就具备高级逻辑认知能力，还是说这种能力是我们随着先进文明的发展而学会的。\n\
  \n# 5\n\n### 不确定的现实\n\n“在发现的道路上，理力几乎没有作用。会有意识的飞跃，称之为直觉或随你怎么称呼都可以，解决方案就会来到你，而你不知道它是如何或为什么出现的。”\
  \ —— 阿伯特·爱因斯坦\n\n\n\n\n概述深度学习限制主题的一个极佳方法是关于斯蒂芬·沃尔夫（Stephen Wolfram）的`计算等效性原理`。沃尔夫显示，简单的细胞机可以表现出复杂的行为方式，这种行为是根据初始情况或指示其稳定变形的基本准则无法预判的。特定类型的细胞机可以表现出复杂的行为，这种行为无法通过数值模型来捕获其在封闭结构中的行为方式。沃尔夫展示这种复杂行为的“最终”框架实例是心灵和气候框架。沃尔夫将这类框架归类为表现出“全包含”。[WEW]\n\
  \n具有记忆深度学习框架属于这类通用机器范畴，但并不意味着这些框架可以复制另一个通用机器的行为。Bernhard Scholkopf 在名为《走向因果关系的学习理论》的论文中揭示了这一结论。[LPD]\
  \ 因此，一个学习框架仅仅准备好在注意到影响的同时确定原因。这让你知道学习框架无法熟悉某些组件，例如 `DNA` 是如何产生蛋白质的。任何从信息中获益的框架的一个主要限制是，它无法从影响中识别出原因。这一假设与计算理论中的“终结问题”相似。\n\
  \n我经常听到关于深度学习的一种分析是，它没有捕捉心灵的自然系统。这是一个合理的分析。无论如何，沃尔夫的`普适性`解释了为什么它不应该成为实现通用人工智能（AGI）的一个重大问题。深层学习框架可能具有自然心灵相同的能力，但使用了不同的计算组件。在基础层面，这些大量的框架是显示出三个结构区块的计算框架：`计算`、`记忆`和`标记`。复杂行为是一种不断发展的行为方式，作为细胞机，它从极其简单的规则中涌现出来。\n\
  \n理解框架学习或发现问题的能力的价值大纲可以表达如下：\n\n- **可知的已知 (Knowable knowns)**：在准备信息时相遇的显著性模型。\n\
  - **可理解的问题 (Comprehensible questions)**：是用于对非准备信息做出准确预测的教学模型。\n- **神秘的已知 (Mysterious\
  \ knowns)**：反映了获取已知框架掌握能力的无力，这涵盖了对其他不可变的通用机器进行预测的领域。\n- **神秘的问题 (Mysterious questions)**：是指无法找到机器完全没有概念的东西。\n\
  \n我们对此进行更详细的划分：\n\n1. **可知的已知**：给定足够大的已知集合（即 `training data`），我们可以获得我们预测误差的良好收敛。\n\
  2. **可知的未知**：这是对推测想法的陈述。通过伟大的推测，我们可以察觉到机器在准备集中从未经历过的测试信息。\n3. **不可知的已知**：存在某些类别的框架是深度学习永远无法学习的。这些属于计算最终框架这一类。无论如何，一个深度学习框架可能会识别因果关系的联系，并可能意识到它可以从该框架中获益。它它无法意识到的（神秘的）情况发生在框架处于计算不可变系统类的情况下。\n\
  4. **不可知的未知**：最后，存在一类完全的遗忘。这实际上是一种超自然的解释。那些无法被认知的未知类是神秘的。将其视为知识的“不可比拟的防火墙”。\n\n\
  ### 表格 5.0 什么是可知的？\n\n用户可能以前通过一个著名的安全秘书处经历过一次比较分组。即：“已知的已知”、“已的问题”、“模糊的已知”和“模糊的问题”。“已知的已知”是我们目前知道的。“已的问题”是我们意识到自己对此完全没有头绪的。“模糊的已知”是对顽固遗忘的印象，某些立法者可能会称之为“选择性现实”。模糊的问题”只是对自己完全没有头绪的东西的遗忘。一个体面的陈词是“黑天鹅”。这是在黑天鹅事实上存在时却认为它们不存在的信念。这种映射的不同在于，“可理解的”框架传达的是视觉的现状，而不是学习的能力。\n\
  \n### 表格 5.1 知识的当前阶段是什么？\n\n对于学习机器的研究，获取可理解的内容比获取知识的现状更重要。\n\n尽管上述遗忘模式看起来很复杂，但它仍然获取遗忘的更大型事物的提示。考虑更多复杂性，如虚假、识别模型偏差、不确定性、冲突和强迫改变。\n\
  \n### 概率与因果\n\n那么，当 Yann LeCun 说“他准备好把概率论抛到车下”时，他在说什么什么？[LEC]\n\nLeCun 说这些话是为了引起房间里另一位演讲者\
  \ Joshua Tenenbaum 的反应。Tenenbaum 在 2011 年写了一篇名为《如何生长大脑：统计学、结构与抽象》的论文 [TEN]，论证了为了实现人工智能而采用贝叶斯驱动的方法。这篇文章试图调查这种方法论看起来是否可行，并更好地理解\
  \ LeCun 的感受。\n\n`概率论`（更明确地说，`贝叶斯推断`）的问题在于它在做出预期方面的充分性。查看随后的生动 GIF：\n\n```image\n\
  ![](img/image00189.jpeg)\n```\n图 5.0 概率论 GIF [MAJ]\n\n显而易见的是，这些散度是独特的，不幸的是，事实测量是无法区分的！用一种意想不到的方式说，如果你的预测的前提是根据似然分布确定的假设，你无疑会被欺骗。\n\
  \n\n\n\n\n来自香农熵（以及根据贝叶斯推演）的将过去概率和流概率与未来预测联系起来的方程，对于非直接捕获框架中的期望值基本上是徒用的。这里有一篇值得研究的相关论文：James\
  \ 和 Crutchfield 编写的《超越香农信息的多变量依赖关系》[JAM]。在正文中，创作者研究了一种贝叶斯组织，以便在一个简单的三变量关联网络中进行推导。以下是那些让贝叶斯主义者怀疑其十八世纪信仰的结论：\n\
  \n![](img/image00191.jpeg) \n图 5.1 贝叶斯结论 [JAM]\n\n总而言之，除了我们意识到这些非线性框架运行良好之外，我们对这些框架一无所知。Crutchfield\
  \ 揭示的后果（可以通过重构而非理性的论证来验证）是：概率性接受在非线性领域并不有效。\n\n现实显然是复杂且非线性的，但我们足够幸运地找到了现实的微小修复点，在这些地方，非线性的影响可以被整体测量所忽略。因此，概率性接受的工作类似于人们用分段直线部分来拟合弯曲线。这在某种程度上是一种权宜之计，但它确实解决了问题。尽管如此，不安全的策略不应应用于所有地方。\n\
  \n### 预测框架的局限性\n\n处理预测框架的分析师应该提出的问题是：我们是否可以在某一点进行改进？我们是否可以在某一点直接利用单纯的扰动策略，而不需要概率性接受？概率性征用的问题在于它是“不合时增强”的实例。我的意思是，数学的存在是为了考虑脆弱性。因此，当我们利用这种数学运行我们的预见机器时，我们实际上是在为机制中的脆弱性做准备。\n\
  \n大脑可能并没有在使用蒙特卡洛检验来评估概率。那么，大脑是如何处理不确定性的？它的处理方式与“乐观交易”处理不确定性的方式相似。它类似于任何强大且多功能的框架处理失望的方式。任何强大的框架都会接受失望将会发生，并应该有工具进行调整。当大脑遇到它没有预到的事物时，它会付出代价。它通过扰动技术研究如何解决。这就是深度学习框架额外做的事情，而且与确定概率无关。这仅仅是一整套“微小”的稳态调整。\n\
  \n### 扰动框架与迭代系统\n\n扰动框架可能是一个糟糕的循环，毕竟它们很像迭代函数系统（IFS）。任何强调自身或具有记忆的框架都可能是动荡行为的可能因素，也可能是一个泛化的机器。这些框架本质上超出了概率技术可以分析的范围。这是一个我们应该准备好承认的基本真理。遗憾的是，贝叶斯主义者似乎拥有一种不可动摇的信念框架，要求他们的策略是通用的。\n\
  \n这里是 Max Tegmark 和 Henry Lin 的的论文：《形式语言与统计物理学中的关键性》[LIW]，探讨了各种语言的逐点互信息：\n\n图 5.2.\
  \ 不同语言与马尔可夫过程的崩溃 [LIW]\n\n注意马尔可夫过程的坍塌。简单来说，如果你的预测引擎没有任何类型的记忆，那么它绝对不可能预见复杂行为。\n\n\
  ### 因果关系与反因果关系\n\n然而，我听到观点认为概率性征用（贝叶斯规则）适用于特定领域。这些领域是哪些？Bernard Schölkopf 准确地告诉了适用的领域。[SHO]。它们是存在反因果关系的领域：\n\
  \n图 5.3 存在反因果关系的领域 [SHO]\n\n简单来说，你可以预测 `Y` 是因为 `Y` 是 `X`（你的输入）的原因。所以事实上，即使对于线性系统，你也必须非常小心地应用概率归纳。因此，当我们应用概率归纳来判断我们能否区分恐龙、恒星、椭圆或十字时，我们发现我们不能。这是为什么？因为观察到的输入（即\
  \ `X`）并不是由其来源（即 `Y`）直接导致的。\n\n\n\n\n\n与之鲜明对比的是，贝叶斯推断和统计学试图通过观察分布来发现知识。通过观察宏观现象，我能获得新知识吗？所建立的假设（即先验）是，人们可以推测最佳先验以得出后验（即预测）。在许多现实世界场景中，这类系统以难以准确而闻名。最近的一篇\
  \ Arxiv 论文《合作更好吗？由模块组成的模型的统计学习》`[JAC]` 解释了为什么要让这些概率图模型正确是如此困难：\n\n> *从原则上说，给定数据，传统的统计更新允许在模块内部以及模块之间进行连贯的不确定量化和信息传播。尽管如此，任何模块的规格错误都会损害其他模块的基准和更新，而且往往以反复不定的方式进行。在不同的设置，特别是当某些模块比其他模块更可靠时，专家倾向于不使用完整模型进行学习，而是采用限制模块间数据产生的方法，例如通过将扩散限制在图表边缘的特定标题上。*\
  \ `[JAC]`\n\n这种方法论通过大量的人为偏见来破坏结果，其实非常简单。坦率说，可测量方法论的应用被操纵到了这种程度，以至于一项试图重现 100 项脑科学研究的新任务发现只有一半是可重复的。`[HAN]`\
  \ 所讨论的问题在于受争议的“P 值”（phacking）做法。`[NES]` 这确实是把人类倾向引入概率计算时产生的一类温和问题。\n\n许多人似乎拥有的心理倾向是，他们接受这些行为是对框架的澄清，而不仅仅是框架的影响。为了让人理解这一点，不要将贝叶斯推导作为理解诸如理解等复杂非线性特性的方式。更糟糕的是，不要将贝叶斯技术作为你制造伪智能机器的工具。假设你面对的是基础且不复杂的问题，尽管去使用拟合设备。因为你的锯子能锯木头，并不意味着它能锯钛钛。\n\
  \n洞察的核心在于输入循环的存在，这推断出一个具有循环条件的非线性框架。贝叶斯推演仅仅是一种工具，而不是任何一种现实或精深框架的关键要素。作为一种工具，它在相关领域具有局限性。因此，我们应该在使用这一工具作为获取复杂框架的灵感时保持谨慎。人类意识已经斗争了很长时间，也许进步可能在于重新评估和审查我们自身的分析偏偏。\n\
  \n### 货运崇拜科学与炼金术\n\n今天存在着一场为了人工智能核心和大脑的战斗。这是一场复杂的“权力的游戏”式斗争，涉及许多家族（或部落）（参阅：“AI 的多个部落”\
  \ `[PER29]`）。我将重点关注的两个战斗群体将是：作为贝叶斯洞察的训练货运崇拜科学，以及作为探索性深度学习的投机化学。\n\n对于未开化的人，我们应该讨论货运崇拜科学意味着什么。货运崇拜科学是理查德·费曼写的一个表达，用于说明一种并非基于普遍良好标准的研究训练。以下是理查德·费曼对“货运崇拜科学”的独特解释。`[FEM]`\
  \ 如果你从未读过它，这是一次不可置信且振奋人心的阅读。我小时候在专注于材料科学时读过它。我不确定这对于物理学家来说是否是必读的，但大多数物理学家都非常清楚这个观点。费曼写道：\n\
  \n> *在南太平洋群岛有一群货运崇拜者。在冲突期间，他们看到飞机载着大量的物资降落，他们坚认为现在应该发生完全相同的事情。于是他们组织了像跑道的东西，在跑道边缘点火，为一个人造了一个可以坐进去的木屋，在他头上放着两个像耳机的木块，竹竿像无线电天线一样伸出来，他是调节员，他们相信飞机会降落。他们所做的是正确的。结构很棒。它看起来和之前一模一样。但它不起作用。没有飞机降落。所以我把这些东西称为货运崇拜科学，因为它们遵循每一项显而易见的规则和逻辑检验类型，尽管它们缺失了根本性的东西，理由是飞机没有降落。*\
  \ `[FEM]`\n\n费曼提出的问题是，特定的科学行为是取决于探索性证明，还是取决于仅仅看起来像是建立在 18 世纪推测之上的逻辑假设基础之上：*然而却依赖于草率的建立*。在我看来，贝叶斯就是那种草率的逻辑请求类型之一。它有它的`![](img/image00193.jpeg)`\n\
  \n图 5.5 贝叶斯定理 `[WIKI4]`\n\nJudea Pearl 基本上在 2001 年发布的一篇文章中总结了贝叶斯推理的问题，他写道：\n\n>\
  \ *我 [Pearl] 在 1971 年转向贝叶斯，当时我开始阅读 Savage 的单著《统计推断的基础》`[Savage, 1962]`。内容是不可辩驳的：(i)\
  \ 忽略我们所知道的显然是愚蠢的，(ii) 用概率语言投影我们所知的是常规且有价值的，(iii) 如果我们的抽象概率是错误的，随着感知数量的增加，其影响将会被清除。三十年后，我\
  \ [Pearl] 在 (i) 的感觉上仍然是一个热衷的贝叶斯主义者，但我现在怀疑 (ii) 的洞察力，并且我知道通常 (iii) 是虚假的。* `[PEA3]`\n\
  \nMarcus Hutter 在《通用归纳与智能的开放问题》中写道：\n\n> *严格来说，贝叶斯主义者需要在看到信息之前选择推测/模型类先验，这从时间推来看仅反映了逻辑实践。*\
  \ `[HUT]`\n\n总结一下，如果通过概率来处理信息，那是很牵强的。错误的认知不会被调整，如果你不允许将推测作为选择先验的手册，那么这是很难实现的。贝叶斯推断堆积了这么多问题，以至于其应用非常可。然而，Tenenbaum\
  \ 在 2011 年的《如何成长心灵：统计、结构与抽象》中解释了贝叶斯推断的内容：*本质上，贝叶斯法则的本质仅仅是一个用于回答问题的工具：抽象知识如何引导从不完整数据中进行推断？*\
  \ `[TEN]`\n\n然而，贝叶斯推断对于选择底层先验的最优方法没有方向，对于在给定底层先验的情况下信息如何变化也没有进展工具。在表象之下，根本没有引擎。它就像通过仅仅注意到车辆的外壳和轮子，却完全忽略了内部的发动机。这是因为事实技术仅仅是描述性的。已故的物理学家\
  \ David MacKay 在他的书《数据理论、推断与学习算法》`[MAC]` 中写道，他从信息论的角度探讨了机器学习。David Mackay `[WIKI5]`，一位受过训练的物理学家，写道：\n\
  \n\n\n\n在本书中，偶尔会低估贝叶斯方法似乎可行，但会提醒读者，这还不是一种普遍接受的观点——在二世纪的大部分时间里，测量领域是由非贝叶斯策略主导的，在这些策略中，概率被允许用于描述任意因素。两种方法论之间的巨大区别在于，贝叶斯主义额外使用概率来描述推导过程。\
  \ `[MAC]`\n\n随后他专门安排了一个关于“`贝叶斯推断与采样理论`”的章节。在这里写道：\n\n*这部分只是为了那些对假设检验/贝叶斯技术讨论感兴趣的读者。如果你发现本章的任何内容难以理解，请跳过。没必要尝试去理解这些讨论。直接使用贝叶斯方法吧——它们比辩论本身容易理解得多！*\
  \ `[MAC]`\n\n理解贝叶斯推断的主要群体仅仅是贝叶斯人士。理解它们的最佳方法就是全投入。所有的争论都可以因为“你完全不知道贝叶斯是什么”而被原谅。事实领域倾向于根据不定的质量引发争论。这里是\
  \ John Rauser 2014 年的一篇论文，其中包含了这个问题：\n\n*坦率说，洞察的行为更接近于投机性化学，而非科学。*\n\n*看看这个荒谬的单变量分布分类：*\n\
  \n![](img/image00194.jpeg)图 5.6 单变量分布分类 `[UNI]`\n\n统计学中的论证方法是引入上述分布的某种组合，并将其作为你的假设（即先验），以此说明你如何得出结论。它是伪装成数学语言的炼金术。它并不是给各种类型的工具命名，并将一切放入贝叶斯推导的煮炉中搅拌以得到最终结果。对于从小在计算中长大的人来说，这是不符合直觉的。与语言学家为了获取语言而提出的大量推测相比，这种训练有什么独特之处？我猜\
  \ Fred Jelinek 在评论时说到了一个要点：`[FRJ]`\n\n*每当我解雇一名语言专家时，我们话语认知框架的呈现方式就会变得提升。* `[FRJ]`\n\
  \nJelinek 话的暗示，关于复杂框架如何运作的过早想法可能会干扰其呈现。我们在软件工程中将此称为“过早优化”，即如果我们轻率地推进一个子组件，它以后可能会变成性能瓶颈。\n\
  \n不可置信的艾萨克·牛顿实际上非常专注于投机性化学。这是他关于黄金变化的构思图：\n\n![](img/image00195.jpeg)图 5.7 艾萨克·牛顿的黄金转化\
  \ `[GRS]`\n\n艾萨克·牛顿同样来自十八世纪，非常托马斯·贝叶斯。当你没有坚实的标准支撑时，一切都是投机性化学。由于我们经常观察到模式，不断编造事实是人类心理的正常状态。反复重复谎言并不会使其变得真实，但人们对这种心理倾向无能为力。（最后一句话看起来像是贝叶斯推断！）\n\
  \n事实领域倾向于根据不定的质量引发争论。\n\n\n\n\nVapnik 认为思想和直觉要么来自上帝，要么来自撒鬼。他提出的区别在于，上帝是狡猾的，而撒鬼并非如此……Vapnik\
  \ 提出，撒鬼通常表现为一种野蛮的力量。此外，在承认深层学习框架在处理功能性问题上展现出的惊人能力的同时，他认为大规模信息和深度学习都具有这种野蛮的力量。*[LIP]\n\
  \n这种通过蛮力（计算）来获得发现的观点，强调了深度学习领域目前现有的实验性本质。Vapnik 的论点更多在于是对其信念框架的确认，以及一种直觉——即在持续缺乏假设的情况下，这种直觉是危险的。目前存在的假设是极其无力的，且大部分推测是以粗略的贝叶斯术语准备就绪的。当然，还有源自信息论领域（Tali\
  \ Tishby [TIS]）、统计力学（Surya Ganguli）甚至宇宙学（Max Tegmark）的替代性理论。\n\n深度学习的理论进展不应被诸如贝叶斯策略等已记录的内容所阻碍。我希望看到来自其他领域（如复杂性科学、临界现象、非平衡统计力学、混沌理论和控制论）的更多先进现实模型应用于深度学习的解释中。\n\
  \n贝叶斯者的问题在于，他们没有意识到自己信念框架的适用范围。名为《推测的事实材料科学：阈值与算法》[ZDE] 的论文对此问题进行了详细阐述。你可以自由地将你的学术精力投入这篇综述。总结这篇论文，贝叶斯相关性的响应取决于你之前拥有的数据量。悲剧的是，真理并不慷慨给予人们完美的信息。\n\
  \n深度学习解释的大部分被概述在一个充满疑且过时的信念框架中，这完全是一种罪过。人们会认为正在进行某种阴谋，倾向于让利用新术语和算术的新推测，而非贝叶斯假设。我们真的希望有更卓越的数值工具来分解深度学习中的启示，否则它将永远停留在目前炼金术的阶段。\n\
  \n## 利用、探索与表示\n\n反向传播（Back-spread）是深度学习的核心组成部分。科学家发现，可以利用答案中的任何计算层，主要前提是该层应该是可微的。用一种出人意料的方式说，可以确定该层的斜率。更通俗地说，在“更热”和“更冷”的这一轮中，语言线索精确地镜像了蒙眼者与其目标之间的距离。\n\
  \n关于反向传播有几个问题。第一个是确定的斜率是否通常是学习的正确路径。这在直觉上是有问题的。人们可以不断发现某些问题，即朝着最清晰的方向移动并不一定能产生答案。因此，忽略斜率也可能产生答案，这并不意外。（不过，我不认为你可以永远忽略斜率）。\n\
  \n让我们稍微后退一步，尝试理解这个反向传播的想法从何而来。从历史上看，机器学习源于曲线拟合的通用想法。在线性回归的特殊情况下（即将预测拟合到直线），计算梯度等同于求解最小二乘问题。在优化领域，除了使用梯度寻找最优解外，还有许多替代方法。事实上，随机梯度下降可能是通优化的最基础的方法之一。因此，人们能想到的最简单的算法之一实际上效果异常出色，这真是令人惊叹的。\n\
  \n大多数增强专家早已接受，深度学习涉及的高层空间将要求非拱形结构，并以此使得改进变得极具挑战性。尽管如此，出于某些不明的原因，深度学习利用随机梯度下降（SGD）运行良好。后来，许多分析师构思了各种解释，说明为什么带有\
  \ SGD 的深度学习进展如此惊人的简单。另一个不容疑的案例是，在高层空间中，人们必然会观察到鞍点而非局部山谷。通常会有足够的角度特征突显出逃生路线。\n\n\
  同样还有一个问题，它被用于尊重目标工作吗？反向传播是根据目标函数确定的。通常，目标函数是预测分布与真实分布之间差异的比例。这种差异可以是 Kullback-Leibler\
  \ 散度或其他距离度量。在任何情况下，这些估计中存在着“标记”。\n\n没有目标函数就无法反向传播。没有假设就无法进行反向传播。正因如此，深度学习似乎在“无监督学习”领域尚未获得真正的成功。\n\
  \n\n\n\n在压缩阶段，调查占据主导，随机化技术与这些调查共同工作。在这个系统中，梯度携带了可以忽略不计的信息 `[GBDL]`，因此收敛速度极慢。这就是表现压力（portrayal\
  \ pressure）发生的地方。泛化（Generalization）的微妙目标通过表现压力来实现。我们可以对泛化的真正含义进行许多理解上的探讨，但无论如何，它最终归结为能够准确捕捉观测环境行为方式的最简表述。\n\
  \n进化算法（也称为遗传算法）消耗了接近调查绘制的空间。在深度学习中，进化算法通常用于寻找模式的 `Meta-picking`（元选择）。它是超边界优化的更复杂实现，因为它不是打乱如\
  \ `learning rates` 之类的常量，而是通过算法打乱组织中每一层的合成。它被用作学习算法的外层循环。变换算法的特点在于，幸运的发现是核心。简单来说，它只有在你足够好时才起作用。\n\
  \n任何一种技术或两者的结合都能导致更佳的表示（Representation）。我们应该解构表示的可能性。在本书，我讨论了正在创建的三种不同的洞察维度（计算的、通用的和社会的）。情况是，这些是不同类型的洞察。显而易见的是，它们工作的领域并不相同。因此结构应该遵循工作。为每种知识创建的策略和模型将各不相同。表示的一个要素显然是它适用的领域。\n\
  \n显然，存在我们是否应该研究不同类型的表示的问题。我在更广泛的层面上是指这一点。在深度学习中，存在各种不同的脑嵌入（brain embeddings）。这些嵌入是语义的向量表示。这些向量空间在整个准备过程中被学习。这些向量应该对应真实思想的不变类型。深度学习框架的一个重大问题是，这些表示是非常局限的。它们所捕捉的现实可以解释了为什么深度学习框架对它们预测的内容没有理论上的理解。理解需要概念的形成，如果概念无法被计算出来，那么对于理解意味着什么？至关重要的是，在很多情况下，胜任并不需要理解。\n\
  \n我认为 `AlphaGo` 并不像人类那样理解围棋。人类通过驱动他们所用策略的自己的概念来理解围棋。`AlphaGo` 并不理解这些概念。相反，它拥有数十亿移动及其后果的记忆和洞察。\n\
  \n作为表示特征存在的概念可能以三种方式存在：作为泛化、原型或范例。深度学习侧重于通过捕捉不变表示来创建泛化。这就是为什么数据增强是一种最佳实践方法。在处理图像时，图像会被旋转、裁剪、去饱和等。这训练网络忽略这些变化。此外，`Convolution\
  \ Networks`（卷积网络）的设计是为了忽略图像平移（即位置差异）。DL 系统需要许多训练集的原因是它需要“看到”足够的变化，以便学习忽略什么以及继续保持什么相关。也许对不变性（invariances）的要求太高了，我们应该寻求等变性（equivariances）这种要求那么刻的形式。\n\
  \n在少样本或零样本学习领域，自动化系统必须通过只看一次或几次来学习某些东西，那么发现不变性的机会为零。自动化根本没有机会发现不变性。\n\n### 深度学习路线图\n\
  \nDARPA 有一个非常好的视频，我鼓励每个人观看（注意：仅看幻灯片会给人错误的印象）。`[LAU]` 该视频将该工作的现状提炼为三波：\n\n1. **手工知识**：软件工程师制定一套规则来处理显而易领域的信息。\n\
  2. **统计学习**：开发者为显式问题建立可衡量的模型并在海量数据上进行训练。\n3. **上下文自适应**：框架为类别构建面向上下文的逻辑模型。\n\n还有很多处理\
  \ AI 的方式不符合 DARPA 的这三波。`[LAU2]` 《主算法》的作者 Pedro Domingos 描述了 AI 的五个派系：`连接主义者`、`符号主义`、`进化主义`、`贝叶斯主义`和`类比主义`。但让我们给予\
  \ DARPA 简化其领域现状介绍的权利。他们确实涵盖了深度学习的一些已知问题，例如对抗特征以及对监督训练数据的需求。\n\n\n\n\n语义鸿沟没有像以前那样被积极解决的原因之一，是因为连接主义系统（即人工神经网络）在历史上表现并不理想。随着深度学习的出现，人们开始重点关注寻找一种结合了符号系统和连接主义系统的解决方案。目前，许多研究正在攻克这一问题。然而，令人兴奋的是，研究人员似乎已经取得了巨大的进展！\n\
  \nArend Hintze [HIN] 写了一篇关于“理解四种类型的 AI：从反应式机器人到自我意识实体”的优良短文，他在ر文中概述了以下类型 [HIN2]：\n\
  \n-   **反应式机器（Reactive Machine）**：最基本的类型，无法形成记忆，也无法利用过去的经历来指导决策。它们无法在预定的特定任务之外工作。\n\
  -   **有限记忆（Limited Memory）**：准备好研究过去以阐明当前的选择。但无论如何，这种记忆是瞬即逝的，不会用于未来的经验。\n-   **心理理论（Theory\
  \ of Mind）**：这些框架可以构建对世界以及与其合作的不同专家的建模。\n-   **自我意识（Self-Awareness）**：这是一个极具理论性的描述，因此我将不再进行讨论。\n\
  \n我显然喜欢他的这种分类，优于“薄 AI”和“通用 AI”的划分。这种分类法试图将狭义 AI 分为三类。这为我们区分不同的 AI 执行方式提供了更多思路。尽管我们对这些定义的看法是它们似乎源于\
  \ GOFAI（传统符号人工智能）思维模式。此外，从“准备好利用过去的受限记忆”跨越到“心理假设”，从任何角度来看都是一次非常巨大的飞跃。\n\n无论如何，我可能想编写一套我们自己的指南，更地针对深度学习领域。我相信这份指南对专业人士来说会更具体、更实用。这份指南让我们对目前所处的位置以及未来可能走向何方有了直。。\n\
  \n我们不断沉浸在 AI 的宣传中，以至于忽略了建立一个良好的理论框架来对现状进行准确评估。这可能仅仅是因为许多记者难以跟上深度学习研究的最新进展。需要阅读的内容太多了，而且最新的发现不断改变着我们现有的认知。\n\
  \n在这里，我们介绍了一种人工智能直觉（即深度学习）能力的务实路线图：\n\n### 1. 基础推理 (BI)\n\n![](img/image00196.jpeg)图\
  \ 5.8 基础推理\n\n这一层包含了全连接脑结构（`FCN`）、卷积脑结构（`CNN`）以及它们的各种混合体。这些框架将高层向量作为信息并输出单一结果，通常是信息向量的排列。你可以将这些框架视为无状态能力，这意味着它们的运行方式只是连续信息的一个元素。生成模型是这些研究深入的领域之一，这些模型也属于这一类。因此，这些框架本身非常强大。\n\
  \n### 2. 带有记忆的推理 (IM)\n\n![](img/image00197.jpeg)图 5.9 带有记忆的推理\n\n这一层包含了与 C 层结构集成的内存组件`LSTMs`\
  \ 是这些实例，在 `LSTM` 单元内部插入了内存单元。它们的不同变体包括神经图灵机 (`NTM`）和 DeepMind 的可微神经计算机 (`DNC`）。这些框架在记录其行为的同时维护状态。这类框架导致了更总结的推理框架，可以处理分组和其他组织化的信息及输出对。\n\
  \n### 3. 带有知识的推理 (IK)\n\n![](img/image00198.jpeg)图 5.10 带有知识的推理\n\n这一层与 `IM` 层非常相似，但使用的不是原始记忆，`BI`\
  \ 层组织可以访问的数据是一个符号知识库。我发现实际上有三种符号混合：一种迁移学习方法、一种层次方法和细粒度视角。主要方法涉及一个作为正则化器的符号框架。接种方法将符号组件放在由脑表示在底层构建的有序进展的顶端。最后一种方法则反过来，即\
  \ `BI` 层组织真正连接到符号知识库。\n\n### 4. 带有不完美知识的推理 (IIK)\n\n![](img/image00199.jpeg)图 5.11\
  \ 带有不完美知识的推理\n\n在这一层，我们有一个基于 `IK` 之上的框架，但它可以排除错误数据。这类框架的例子是 `AlphaGo` 和 `Poker`。\n\
  \n### 5. 带有不完美知识的协作推理 (CIIK)\n\n![](img/image00200.jpeg)图 5.12 带有不完美知识的协作推理\n\n\
  这一层基本上与“心理假设”相同，我们在这里有多个专家网络协作来解决问题。DARPA 的研究表明第三波浪潮正在 `IK` 层发生。不同层次实现了以前层次不存在的能力。例如，`BI`\
  \ 框架仅适用于对因果关系进行预测。`IM` 层系统能够进行很好的翻译。`IIK` 层框架具备关键的博弈能力。\n\n### 元模型 (Meta Model)\n\
  \n深度学习可以被深地认为由一个通过构建不同层级而开发的计算图组成。大多数早期文献强调单个神经元，但最终，神经元层的聚合行为更为重要。因此，从计算的角度来看，计算单元的层而不是单个神经元，是理解深度学习的正确概念。Google\
  \ 的张量处理单元 (`TPU`）为这一观点提供了支持性证据。`TPU` 与将标量和向量视为原生的普通 `CPUs` 和 `GPUs` 不同，它将网格视为一种原始数据。\n\
  \n\n\n\n# 深度学习系统已经进步到能够催生简化深度学习设计的模型。Theano 拥有 `Blocks`、`Lasagne` 和 `Keras`。Tensorflow\
  \ 拥有 `Keras` 和 `TF-Slim`。`Keras` 依赖于 `Torch`，因此自然具有不可忽视的特定应用程序编程接口 (`API`)。许多其他较较少的系统如\
  \ `Nervana`、`CNTK`、`MXNet` 和 `Chainer` 实际上也拥有大量的模型 API。无论如何，这些 API 都在描述模型。那么，什么是深度学习元模型（meta-model）？是否存在元模型呢？\n\
  \n图 5.13 这是一个深度学习模型的样子。\n\n让我们先研究一下元模型像什么。真正的模型位于面向对象设计的 UML 空间中。这是 UML 元模型：\n\n\
  ![](img/image00201.jpeg)\n图 5.14 UML 元模型。\n\n这阐明了 `Keras` API 中的 `Layers`、`Objectives`、`Activations`、`Optimizers`\
  \ 和 `Metrics` 是深度学习的元模型。这个概念很容易理解。\n\n图 5.15 深度学习元模型\n\n所描绘的模型捕捉了监督学习组织的每一个主要组件。模型的关键组件由许多不同类型的层组成。模型包含一个目标工作（goal\
  \ work），有时被称为损失工作或健康度工作。最后，有一个增强器或学习算法，用于准备模型的各个层。流优化器通常只在组织的准备阶段需要。下方的图是对正在使用的各种类型组织、目标能力和分析器的半部分视角：\n\
  \n![](img/image00202.jpeg)\n图 5.16 深度学习监督学习\n\n许多类型的组织可以组合起来形成一个答案。在较传统的 AI 方法中，花费了大量精力来处理数据以分离元素。有趣的是，在深度学习中，预计对良好层进行合理利用可以产生良好的配置。之前描述了四种常见类型。它们包括\
  \ `Fully Connected` 层或`多层感知器` (`MLP`)）、`Convolution` 层、`Recurrent` 层 (`RNN`) 和自回归组织。请注意，`RNN`\
  \ 没有在任何模式中被描述，因为它的更常见变体——长短期记忆（`LSTM`）在实践中被广泛使用。\n\n传统上，一个 `Objective` 是一种能力，而 `Optimizer`\
  \ 是一个算法。然而，想象一种场景，我们将它们也视为演示。考虑到，我们有以下内容：\n\n![](img/image00203.jpeg)\n图 5.17 每一个能力都是一个神经网络\n\
  \n这显然变得越来越复杂了。目标工作已经变成了一个神经网络，流优化器也变成了一个神经网络。对这主要的回答是，这种设计是否被尝试过？可能现在有人正在写这篇论文。这是因为一个作为神经网络的目标工作等同于生成对抗网络\
  \ (`GAN`) 中的判别器 (`Discriminator`)，而一个作为神经网络的优化器无异就是元学习（meta-student）的本质。所以，这个想法并没有超出常规研究的范畴。\n\
  \n第二个回答是，我们难道不应该把一切都变成神经网络并就此结束吗？图中仍然有属于能力和算法的框。`Objective` 的流优化器是其中，还有另外三个。当你这样做时，总而言之，没有什么是规划者需要刻画的！没有能力了，一切都是从零开始获得的！\n\
  \n所以，一个一切都是神经网络的元模型看起来如下：\n\n![](img/image00204.jpeg)\n图 5.18 深度学习元模型\n\n为了清晰起见，模式被分为三个部分。这清楚地表明，可用的层来自于一个固定的集合（例如：全连接、卷积、`LSTM`\
  \ 等）。确实有研究论文利用这种选择不同类型层来生成 DL 架构的观点。DL 元模型语言充当了基于探索性 `RL` 系统的乐高积木。它可以生成多个 DL 元模型实例，以优化出最佳架构。这反映了深度学习模式的重要性。在你可以生成架构之前，你必须知道有哪些构建块是可以供利用的。\n\
  \n### 随机梯度下降\n\nGeoffrey Hinton 终于传达了许多人一直感到不安的想法。在最近的一次 AI 会议上，Hinton 表示他对反向传播表示“深度怀疑”\
  \ \\[LES\\]，并说“我的观点是全部抛弃并重新开始。” \\[RUM\\]\n\n合成梯度 \\[[JAD\\]]（一种解耦层的方法，使得通常不需要反向传播，或者可以推迟角度估计）也被证明是同样成功的。这一发现可能是某种更广泛的不同事物正在发生。也许任何在通常不太考虑负载（由于制造偏差导致是不规则的）的情况下保持稳定的更新都同样成功。我曾写过“生物学合理的反向传播”\
  \ \\[PER31\\]，它检查了多种替代技术。\n\n无论如何，在我们把孩子和洗澡水一起扔掉之前，让我们从一个更通用的角度来看目标函数的意义。目标工作衡量了自动化的内部模型预测其当前情况的准确程度。任何智能自动化背后的动力都是创建一个准确的内部模型。然而，没有任何东西要求模型与其当前情况之间的估计必须一致或持续地进行。也就是说，自动化不需要执行反向传播来学习。自动化可以通过其他事情来进一步完善其内部模型。\n\
  \n其他事情，称之为创造力或梦幻，不需要实时确认。我们现在最接近实现是生成对抗组织 (`GAN`)。一个 `GAN` 由两个组织组成：生成器和一个判别器。我们可以将判别器视为与目标工作共同工作的神经网络。沿着这些线，它与真实世界验证内部生成网络。生成器是模拟真实世界的自动化。所以无监督学习不需要目标工作，但在任何情况下可能都需要反向传播。\n\
  \n观察自主学习的另一种方法是它是某种元学习。框架可能不需要引导训练数据的一个机会是，学习算法到目前已经培养了自己的内部模型来如何如何继续。学习算法是如何被赋予这种能力是一个巨大的未知数。\n\
  \n总结来说，现在判断我们是否可以消除反向传播还为过早。我们当然可以使用一个不那么严格的版本（例如合成梯度或其他启发式方法）。然而，渐进式学习（或爬山算法）的要求似乎仍然存在。我当然非常感兴趣发现任何推翻渐进式学习或爬山算法的研究。\n\
  \n\n\n\n\n感谢于少数研究小组对随机梯度下降（`SGD`）行为方式的卓越探索性工作，我们正整体对收敛附近发生了什么情况获得更清晰的理解。\n\n## SGD\
  \ 在泛化中的作用\n\n故事始于 ICLR 2017 最佳论文奖获得者《重新考虑泛化》[ZHA]）。我之前在一篇名为“反思深度学习中的泛化”的博客文中[PER24]\
  \ 首次讨论过这篇论文。该论文中一个有趣的观察是 `SGD` 的作用。这种观点非常具有革命性，作者们写道：\n\n事实上，在大脑组织中，我们经常将模型视为运行随机梯度下降的结果。有趣的是，我们研究了\
  \ `SGD` 如何作为一种隐式正则化器发挥作用。对于直接模型，`SGD` 通常会收敛到一个标准较小的答案。随后，实际计算过程无疑对模型进行了正则化。[ZHA]\n\
  \n这种 `SGD` 被称为“隐式正则化”的观点非常奇妙。巧合的是，另一篇由 Daniel Jiwoong Im、Michael Tao 和 Kristin Branson\
  \ 撰写的论文——《深度网络损失表面的经验分析》[IM2] 检查了各种 `SGD` 计算的损失表面设计，发现它们各不相同：\n\n![](img/image00205.jpeg)\n\
  \n图 5.19 损失表面的结构 [IM2]\n\n这些探索性的估计似乎支持这样一个观点：就像正则化一样，你选择的 `SGD` 计算会影响模型的收敛位置。因此，通过不同的\
  \ `SGD` 计算你会达到不同的平衡点。这与我们对 `SGD` 的看法不同。此前，不同的 `SGD` 仅仅因为不同的系统而产生不同的收敛速度，但我们确实期望它们最终都能得到相似的结果！我们某种程度上接受\
  \ `SGD` 无论什么策略都会达到等优解。（顺便提一下，这篇非常出色的论文在 ICLR 2017 中被拒绝了 [PER33]。在深度学习领域撰写学术论文的竞争是异常的。）\n\
  \n## 收敛行为与拓扑\n\nLeslie Smith 和 Nicholay Topin 最近向 ICLR 2017 研讨会提交了一篇研讨会论文：“通过循环学习率探索损失函数拓扑”[SMI]，他们在那里发现了一些奇特的收敛行为：\n\
  \n![](img/image02206.jpeg)\n\n在这里，随着我们单调地增加和减少学习率，收敛系统附近发生了变化：足够大的学习率会立即将系统从碗盆中推到一个损失高得的空间。然后\
  \ `SGD` 再次快速收敛（注意观察更快的收敛速度）。在这里到底发生了什么？\n\nArxiv 上最近的一篇论文《通过信息打开深度神经网络的黑箱》[SHW]\
  \ 由 Ravid Shartz-Ziv [SHW2] 和 Naftali Tishby [TIN] 编写，对 `SGD` 的运作有了优雅的解释。他们将 `SGD`\
  \ 描述为两个明显的阶段：扩散阶段和扩散阶段。`SGD` 开始于主阶段，从根本探索模型的多层空间。每当它开始收敛时，就会进入扩散阶段，在那里极其剧烈，收敛速度慢回爬行。对这一阶段发生情况的直觉是，模型正在寻找如何压缩。该图最好地描述了这种行为：\n\
  \n![](img/image00207.jpeg)\n\n图 5.21 学习压缩 [SHW]\n\n这种行为使得阶段从高均值低波动转变为低均值但高变化。这进一步阐明了\
  \ Smith 等人的观点，即在收敛区域，那里是极其剧烈的。这显然并不能完全解释为什么高学习率会将模型撞入一个高损失的位置。\n\n## 经验风险的图谱\n\n\
  Tomaso Poggio 和 Qianli Liao 已经有了自己的测试，并提出了一个假设：“假设二：深度学习中经验风险的景观。”[POG]。在这里，他们详细描述了那个混沌区域的行为：\n\
  \n![](img/image00208.jpeg)\n\n图 5.22 混沌区域的行为 [POG]\n\n全局最小值的“碗盆”是平坦的，但也极不平整。不仅如此，还有大量的这类碗盆。他们引用了一些深奥的数学假设并得出了结论：\n\
  \n我们可以援用 Bezout 假设来推断存在大量的零误差最小值，且这些零误差最小值是高度退化的，而周围的非零最小值（如果它们存在的话）可能不是退化的。由于聚类作用，零误差意味着一个边缘的存在，即在零误差周围各个方面都是平坦的区域。[POG]\n\
  \n非常引人入胜的论文，值得仔细读读。这篇论文中有一个实际的缺陷：“在一个碗盆内平均两个模型通常会得到一个两个模型平均值（或更小）的误差。在两个碗盆之间平均两个模型通常会得到比两个模型都高的误差。”\n\
  \n## 未来方向\n\n关于如何利用这一新信息的最佳方法仍有许多问题。我们如何能利用它来实现迁移学习、领域遗忘等关键能力？这些压缩阶段与泛化之间存在什么关系？这里确实有很多有趣的方向！\n\
  \n## 总结与现实清单\n\n总而言之，许多研究小组在尝试更容易理解深度学习框架的行为方面做出了良好的努力。通过这些核心探索工作，我们整体上获得了更好地处理自己工作的方法。会议不幸地倾向于推崇新模型（越疯狂越好），而不是良好的实验数据。遗憾的是，这倾向于投机化学的行为，而不是对化学研究的追求。适应和规避阶段，特别是\n\
  \n\n\n### 现实清单\n\n深度学习材料在哪里？这是理解深度学习和相关 AI 技术的额外计划之一。\n\n- **执行脆弱性**：从环境的状态来看，执行者的行为组合是否一致会导致相似的最终状态？\n\
  - **观测脆弱性**：执行者是否拥有环境的所有数据？\n- **持续脆弱性**：执行者是否知道将持续多久？\n- **动作脆弱性**：执行者动作的影响是否确切已知？\n\
  \n\n\n\n\n# 评估漏洞\n\n评估漏洞：是否存在一种评估规则来衡量活动的有效完成情况？\n\n训练漏洞：是否存在过去有效安排的信息或相关信息，可以被用作学习的方向？\n\
  \n在大多数现实世界问题中，这些问题的答案可能是负定的。自动化要求上述问题中的大多数问题能得到肯定的回答。然而，基于深度学习的自动化为实践者提供了更多的回旋余地。深度学习网络的本质是近似机器。但是，只有当存在已经消除了不确定性的信息时（即监督学习），`DL`\
  \ 才能对不确定的情况学习到良好的近似。\n\n任何机器都无法知不可知之物（即无监督学习问题）。具体来说，系统通过利用“已知的已知”来增加“已知的未知”的确定性。上面的检查清单引导人们识别什么是未知的，因此这是一份“已知的未知”列表。让我们面对现实吧，如果你不知道自己不知道什么，你就无法解决难题！努力通过识别你的问题领域中哪些不仅是不确定的，而且是不可预知的，来打破那种“现实扭曲场”。\n\
  \n无论深度学习是否像推测性化学那样的被反复训练，它都无法施展魔法。尽管如此，弄清现实与科幻之间的模糊界限，可以让你在竞争中获得巨大的、决定性的优势。\n\n\
  ## 深度学习的局限性\n\n尽管深度学习框架在预判方面存在整体限制，但深度学习框架还有其他已知障碍。这些限制与过去领域中描述的完全不同，并不至关重要。归根结底，有一个假设认为这些限制最终将得到解决。\n\
  \n最大的缺陷在于揭示了通过带有特定目标的微调信息图像，人们可以欺骗深度学习神经网络进行错误分类。这被称为对抗性样本或组件。这不仅对深度学习是一个问题，对于几乎每种利用线性多项式数学来精确其指令的\
  \ AI 技术来说也是如此。奇怪的是，受限玻尔兹曼机（`RBMs`）并没有表现出这个问题。\n\n次于这一缺陷的是，学习新想法需要海量标记训练数据的先决条件。虽然有研究试图减少准备数据量，但我们目前似乎无法实现我们在人类身上发现的那种学习：人类只需看一眼另一个新想法就能进步。\n\
  \n第三是所学习模型缺乏可解释性。我们目前似乎无法对深度学习框架如何得出其预期结果给出合理的解释。这些从信息中获益的框架其预测结果往往是黑箱。\n\n第四，大多数深度学习框架需要监督学习。虽然在创建自学框架方面取得了大量进展，但在研究之外，这并没有被广泛使用。\n\
  \n深度学习的进展非常快，但我们可以通过参考之前描述的能力水平来确定方向。我们目前处于 2 级的早期阶段（即 `CM`）。内存对于能够分析序列和时间行为的系统来说是一个核心要素。这些系统的最先进类型是编码器-解码器网络，或者将序列翻译成其他序列的网络。最令人深刻的例子是\
  \ Google 的神经机器翻译器(`GNMT`）`[MER]`。\n\n`GNMT` 有趣之处在于，Google 将其称为“零样本翻译”`[SCH]`：\n\n\
  ![](img/image00209.jpeg)图 5.23 Google NMT. `[SCH]``\n\n这种零样本能力是指机器具备进行例如日语译英语翻译的能力，无论它是否针对这种特定的翻译对进行过训练！引用他们的话：\n\
  \n*这意味着组织应该对句子的语义进行编码，而不仅仅是记住短语到状态的翻译。我们将其解读为组织内部存在某种通用语言的指示。* `[SCH]`。\n\n翻译框架是尖端深度学习的实例。对于深度学习存在一种极大的误解，认为它们仅适用于分类。这是我们分类中的第\
  \ 1 级能力。2 级能力赋予了解释能力。评估 `DL` 机会的一个大原则是：如果一个问题可以被描述为一个解释问题，那么 `DL` 很有可能成为一个非常有力的解决方案。\n\
  \nDeepMind 是一家没有收入且处于前线的公司，于 2014 年以约数十亿亿美元的价格被 Google 收购。据传，Google 的领导层被他们的雅达达游戏程序深深迷了，以至于无法避免进行收购。DeepMind\
  \ 可能会“解决知识”，他们通过将深度学习与一种更成熟的 AI 创新技术——强化学习来实现这一点。这种结合通常被称为“深度强化学习”。雅达达游戏程序整合了 `Convolution\
  \ Networks` 和 `Q-Learning`。随后的框架图描述了不同 `RL` 算法之间的关系：\n\n![](img/image00210.jpeg)\n\
  \n图 5.24 强化学习\n\n尽管 DeepMind 展示了许多进展，但 Yann LeCun 反复强调过这一类比：`[ROB]`。\n\n*如果洞察是一个蛋糕，无监督学习就是蛋糕，监督学习是击败一切的东西，而强化学习是蛋糕上的樱桃。我们知道如何制作糖霜和樱桃，但我们不知道如何制作蛋糕。*\
  \ `[ROB]`。\n\n自 NIPS 2016 以来，LeCun 开始使用“预测学习”代替“无监督学习”`[CUN]`。LeCun 说：\n\n*我们缺失的一个关键部分是预见性（或自主）学习：机器展示环境、预见潜在前景并通过观察和在其中行动来理解世界运作方式的能力。*\
  \ `[CUN]`。\n\n这是一个迷人的变化，展示了他在他认为的预期要开发的“蛋糕”的观点上发生的微妙转变。在 LeCun 看来，在我们获得 AI 领域的加速进展之前，应该先建立基础。归根结底，通过增加内存、数据库和协调专家等更多能力对现有的管理进行改进，将是一个缓慢的过程，直到我们准备好去制造那个“预见性的基础层”。\n\
  \n预测学习是我们面临的一个严峻问题。预测学习显然要求机器不仅要在没有人类监督的情况下进行学习，还要学习一个世界的预测模型。强调这一点并理解为什么 LeCun\
  \ 试图改变我们对 AI 经典分类法（即无监督、监督和强化学习）的观点非常重要。\n\nRuslan Salakhudinov，Apple 的首席 AI 研究员，在关于无监督学习\
  \ `[FRI]`（即预测学习）中做了一场精彩的报告演讲，他在其中提供了这种富有启发性的分类法：\n\n![](img/image00211.jpeg)图 5.25\
  \ 无监督学习，来自 Ruslan Salakhudinov 的演讲 `[FRI]`\n\n在幻灯片的右角，他指定了生成对抗网络(`GANs`)。GANs 由两个对抗的大脑组成：生成器和判别器。前者尝试产生伪造图像，而后者尝试区分真伪图像。这些框架的有趣元素在于，它们不需要一个封闭的结构。\n\
  \n\n\n\n\n这种能够自找苦吃的能力简直令人惊叹！对抗性组织的一个障碍在于它们难以准备。恶性学习包含了在双人非合作博弈游戏中寻找纳什平衡。在关于单人学习（solo\
  \ learning）的新演讲中，Yann LeCun 将良性网络称为“过去二十年 AI 领域最酷的想法”。[C18]\n\n埃隆·马斯克的 `OpenAI`\
  \ 研究重点关注生成式模型 [KAR]。他们的灵感可以总结为理查德·费曼的一句话：“对于我做不出来的东西，我完全没有头绪。” 费曼暗示了他的“第一性原理”思维技法，即他应该有权通过创建可证明的构想来发展理解。这里的核心思想是，如果机器能够创建具有高度真实性的模型，它可能就能培养对这种远见模型的理解。\n\
  \n以下是这种顶尖技术的几张图片：\n\n![](img/image00212.jpeg)图 5.26 生成的图片。[NGU]\n\n这些是 `DL` 框架在接收到所示单词时生成的图片。这无疑非常惊人。我没有预见到会有许多人有权画得如此好！\n\
  \n目前的共识是，这些生成模型无法捕捉任务的语义。它们并不理解昆虫、熔岩或红嘴�鹬的意义。但无论如何，它们在模仿和做出预期方面非常出色。这些图片并不是机器最近训练的图片的简单堆砌。相反，机器构思了某种总结模型，允许它推出一个极其合理的结果。\n\
  \n这种使用对抗网络的方法与更经典的机器学习方法不同。在这里我们有两个竞争的神经网络（即 `discriminator` 分类器和 `generator` 生成器），它们似乎协同工作以完成某种泛化。在经典的\
  \ `ML` 世界中，人们会定义一个目标函数来触发自己最喜欢的优化算法。然而，在这个研究领域，正确的目标函数尚不明确。令人惊讶的是，这些系统能够学习自己的目标函数！\n\
  \n这里引人注目的认识是，`DL` 框架极具可塑性。经典的 `ML` 思维认为目标能力、指令或改进计算是固定的，这对于 `DL` 并没有影响。更神奇的是，可以利用元级方法。因此，`DL`\
  \ 框架可以学会如何学习。\n\n生成式模型是前沿策略，在需要探索许多方案备选问题的设置中具有实质意义。\n\n当我们看到解释和生成能力时，开始意识到我们对 `DL`\
  \ 能做什么的认知是在不断移动。因此，为 `DL` 的远端提供一个明确解决方案是困难的。可能的边界不断向外推移，我们对“深层洞察”可行的想法也在不断改变。\n\n\
  受限知识的实质性可以完全概述为需要受控学习且环境得到充分控制的环境。受控环境是独立的，或与外部影响隔离。这种定义承认了需要响应意外信息的框架的局限性。我们目前无法精确衡量我们的框架泛化能力如何。\n\
  \n这是工艺的现状。尽管如此，我目前无法判断这个定义何时应该改变。理解创新的局限性是了解如何有效使用它的初始阶段。\n\n### 人工智能\n\n有一个通用人工智能（AGI）指南至关重要。不是因为我们将在不久的将来某个实现它，而是因为我们需要一个框架来理解深度学习正在发生的进展。问任何一个分析师，他们都会告诉你深度学习的进展快得惊人。Russ\
  \ Salakhutdinov（苹果 AI 负责人）在新的 Simon 学院演讲中评论道，这些改进是“疯狂的”。因此，在这种“疯狂”的背景下，我们必须明确方向，并看清我们正处于世界的什么位置！\n\
  \n之前我提供了一个关于我们对深度学习预期的能力的指南。遗憾的是，这并没有对每个能力水平上什么是可能的提供足够的感觉。Peter Voss 在他关于“认知架构”的帖子中指出了\
  \ Pat Langley 在 2012 年的一篇论文 [LAN]。[VOS] Pat Langley 的论文是评估 AGI 需要取得什么样的进展的良好框架。我必须承认，我没有花费大量精力来尝试区分现有的不同\
  \ AGI 方法。尽管如此，我认为 Pat Langley 的论文是明智、直观且适度的，这可以作为评估当前 AGI 进展的一个很好的理由。\n\n我将根据深度学习持续进展的观点回到论文中的位置。在我的审查中，我将忽略其他\
  \ AI 团队的任何改进，并敦促读者阅读 Langley 的论文。这篇论文写于 2012 年，在深度学习爆发之前，所以我今天回到这里，以检查我们是否在论文描述的\
  \ AGI 前线方面取得了任何进展。\n\n#### 1. 高级认知\n\n像深度强化学习和 AlphaGo 这样的混合设计揭示了一种非常有说力的方法，将 `DL`\
  \ 框架中固有的基于直觉的洞察融入到需要安排和方法的更高层次的能力中。我们在实现独特的思考、理解和解决问题方面还有很长的距离。\n\n#### 2. 结构化表示\n\
  \n深度学习的表示是不透明且不可捉的。然而，有趣的是，神经嵌入的许多形式（例如 `word2vec`、`Glove` 等）似乎能够捕捉作为其他网络输入特征的有用语义。关于世界的先验知识似乎可以通过这些嵌入引入。集成通常需要端到端训练，尽管这是一个极具前景的领域。我不认为很快就会发生的是表示的可解释性。\n\
  \n#### 3. 系统级方法\n\n我认为“心理协同”将是深度学习最重大的进展之一。心理协同是许多专家可以基于相同表示进行工作的想法。我认为深度学习在“多目标”框架以及编码器-解码器网络方面正在取得巨大的进步。\n\
  \n#### 4. 启发式与满足法\n\n研究领域存在一种固有的倾向，要求使用深度学习的工具来适应更僵化的数值思维。我仍然支持复杂的行为方式产生于过于简化的系统。\n\
  \n\n\n\n对深度学习行为路径的基础性探索，让那些在有限空间内产生显著成果的新颖方法处于次要位置。这种情况可能会持续一段时间。如今的“考量”市场对好奇心和基准测试的溢价远高于对深刻洞察的需求。\n\
  \n请注意，这些是“在人工智能最初的三十年里被普遍接受的六项假设”。这种做的优之处在于，我们可以区分我们今天对深度学习的认知，并感知它是如何与多年前关于应该如何发展的观点相契合的。显而易见，五个或六个领域取得了巨大的进展。\n\
  \n深度假设和这种模式的实验与设计不会很快结束，与更明确的“尖端”结果相比，该领域对检验的需求并不大。尽管如此，这并不意味着我们应该忽略思考更宏大的 AGI（通用人工智能）指南，例如上述的六项假设。本文旨在揭示更多关于深度学习实现\
  \ AGI 还需要走多远路的见解。\n\n学习远超或以任何方式超越。基础\n\n## 6 学习宇宙\n\n“****我相信，总有一天，信息将被视为像能量和物质一样基础的东西。****”\n\
  \n- Demis Hassabi - DeepMind 创始人\n\n当我们考虑到能量和物质时，从记忆中恢复的最早的东西可能是星星。它们是点缀我们夜空的热气团团。然而，这些绝美的光芒不仅仅为人类提供简单的视觉景观。这些星星被用作我们的助手。奥罗尼西亚人在航行中利用星星，尽管这并不是沿着第二颗星向一侧就能到达彼得岛那么简单。奥罗尼西亚向导培养了自己的星罗盘，根据恒星和季节来引导他们的划艇。不同恒星的升起和落下为奥罗尼西亚人提供了相对于已知岛屿的位置想法，或者仅仅为他们提供了方向。\n\
  \n尽管看起来奥罗尼西亚人基本上是在追随星星和天体，但星罗盘的使用需要对空间科学进行更深入的研究，并且可能仅由专家向导所知。除了宇宙学，这些向导还学习并记住了已知区域的地质情况，并在穿过不明水域时基于这些信息。这构成了向导控制支独舟到达其理想目标时应使用的多种理念。`[DIP]`\n\
  \n就像星星一样，深度学习的能力是奇特的。无论如何，关于现实和宇宙如何组织，有一件大事似乎让某些显然无法运作的东西变得可行。\n\n### 我们中的外星智能\n\
  \n这里有一种误解的想法，认为 AGI 最终会像人类一样行动。这可能是极好的事情，也可能是极其糟糕的事情。事实是，AGI 可能会以意想不到的方式行动。今天的深度学习框架似乎很好地模仿了一些人类能力，但它们在本质上是不同的。首先，人工神经网络的配置更像是一种晶格增强，而不是真正的神经元。然而，无论这种区别如何，这些框架可以执行惊人的类人理解，如人脸识别和运动。\n\
  \nAnil Seth 介绍了章鱼：\n\n*章鱼是我们独特的地球外来生物，有八条带有吸盘的抓握臂；三个心脏；一个基于墨水的保护系统；深度设计的流驱动；一个可以改变大小、形状、表面和种类的身体。*\n\
  \n章鱼是我们自己独特的地球外来生物，有八条带有吸盘的抓握臂；三个心脏；一个基于墨水的保护系统；深度设计的流驱动；一个可以改变大小、形状、表面和种类的身体。\n\
