  \ 的每一回合的行为并不出乎意料，但至少那些可验证的框架并非如此。\n\n### 协作架构\n\n在许多现实场景中，我们仍然可以建立准确的模拟或虚拟世界。这些模拟可以作为初始的启动引导。考虑到各种不同的漏洞都是已知的，它可以有效地做到这一点。一系列活动的结果不具有不确定性。有已完成的数据。活动的影响并不出乎意料。有一种估算成就的方法。因此，`Go`\
  \ 的每一回合的行为并不出乎意料，但至少那些可验证的框架并非如此。\n\n尽管如此，在许多现实场景中，我们仍然可以建立准确的模拟或虚拟世界。这些模拟可以作为初始的启动引导。考虑到各种不同的漏洞都是已知的，它可以有效地做到这一点。一系列活动的结果不具有不确定性。有已完成的数据。活动的影响并不出乎意料。有一种估算成就的方法。因此，`Go`\
  \ 的每一回合的行为并不出乎意料，但至少那些可验证的框架并非如此。\n\n\n\n理想情况下，我们可能希望尽可能拥有多个交互点，以减少冲突并增加粘性和可玩性。考虑\
  \ `USB` 标准在电源传输和连接便利性方面是多么具有说服力。另一个信念是利用 `FIPA` 信息演示或话语行为（discourse acts）构建此类框架。目前\
  \ `DL` 系统的方法是学习如何自主通信 `[PER48]`。也许包含对通信概念的需求，并由话语行为驱动，可能会促使更好的可重用性。例如，一个大脑组织可能已经准备好接入另一个以话语行为作为惯例的框架，这种框架可能在另一个同样使用话语行为作为协议的环境中具有通用性。\n\
  \n### 基于消息传递的文档传递\n通信可能将是“发出去后不管（fire and neglect）”的消息传递。这学习起来要要简单得多。久而久之，大多数关于如何传达意图的研究将会使用消息传递，而不是指令式的请求/响应模式或过程式的调用。\n\
  \n### 动态类型\n人们可能会认为在 `DL` 框架中，表示方式没有类型概念。然而，正如我们在 Google 的 `NMT` 系统 `[PER49]` 中看到的，扩展显示表示方式语言的名称是实现单次跨语言解释的重要步骤之一。因此有证据表明，为数据标记其类型即使对于\
  \ `DL` 系统来说也是有价值的。\n\n### 异步同步\n单体 `DL` 情况在通过其层进行前向和后向生成具有非常僵化的同步类型。在更稳健的解释中，我们可能希望释放这些限制，目标是部分之间不需要同步。此外，自然大脑不需要像\
  \ PC 框架那样的单一时钟。因此，`DL` 系统不应该有这种类似的同步需求。\n\n### 查询引用\n在 `DL` 框架中，存在 `Pointer Networks`，它们维护着类似于内存指针的硬编码引用。一个更高级的框架需要第二级间接，目标是引用指向一个查询，而不是根本上指向某个内部表示。这类似于基于索引或基于设置的恢复。换句话说，如果要进行检索，那么对该信息的请求是通过查询进行的，而不是通过不透明的标识符（正如我们在传统计算机中看到的那样）。\n\
  \n### 自描述本体\n`DL` 框架的表示显然不是自描述的，它们实际上是模糊的。这显然使得在没有信息共享工具的情况下，在不同的通信专家之间进行促进变得困难。此外，目前没有公开的研究尝试去熟悉信息的“元级别”表示。这将是多专家协作框架面临的重大技术障碍。这种问题的一种较轻的类型是固定动词方法（Fixed\
  \ Verb approach）。然而，需要注意的一点是，在 DeepMind 的 `PathNet` `[PER23]` 方法中，低级表示在网络之间随机划分。\n\
  \n### 基于模式的架构\n基于示例的蓝图比基于语言的蓝图具有更精确特征。这里的想法是，主要的不完整细节对于互操作性至关重要。`DL` 中有一种观点，即在准备时忽略了扰动因素，或者对信息中不变元素的思想。人们可能希望准备忽略不变的信息，同时专注于那些与众不同的特征。\n\
  \n### 多播通信\n理想情况下，人们不需要关心子网络是如何连接在一起的。已经有研究表明组织是以不同的分层方式连接的（参见：Maluuba 和 DeepMind）。其中某些网络是许多更简单组织的组织者。多播网络允许成员就哪些消息值得关注进行独立推理。这是一个非常值得证明的权衡。\n\
  \n### 中介交互\n理想情况下，在一个灵活的框架中，没有两个部分是硬编码连接的，通信可以根据环境逐渐变化。我们在“深度学习中的条件逻辑”`[PER15]`\
  \ 中见过这样的设计，其中子网络的选择也由一个层控制。\n\n### 惰性求值\n或者我们可以考虑这种延迟执行；即只有在需要时才执行工作。这种能力的价值在于执行。`DL`\
  \ 系统的一个主要缺陷是其缺乏灵活性。\n\n### 灵活性，互操作性\n这些仅仅是指导近似耦合框架的通用规则，并且应该适用于 DL 框架。\n\n### 响应式行为\n\
  有研究关于学习增强或学习设计，其中 DL 框架被用于提出执行计划。RL 框架由于其倾向性，学习响应式行为而不是规划，绝对要困难得多。\n\n\n\n\n在更具理论性的表述中，自由耦合策略具有三个重复属性。这些是：延迟限制、干预和退化。有趣的是，有研究论文涵盖了这三个属性中的每一个；其中最引人注目的是，延迟限制在连接主义架构中的应用方式。\n\
  \n有一点频繁出现且引起人们考虑的内容，是元级表征（meta-level portrayal）的思想。元级表征的存在是因为对协调的需求。这种能力被比作拥有一个具有内在正念的框架。这种正念显然是一种危险的必要性。我们应当希望在不需要智能子组件的情况下，就能制造出具有洞察力的框架（见：`Artificial\
  \ Intuition [PER34]`）。尽管如此，元级思维的这些部分本身可能同样是不具备智能的，并且可能不知道自身的活动处于元级水平。\n\n这里的另一个观点是，一旦我们开始研究元级理念，就很难将自己与符号主义方法分离开。因此，上述框架的缩影极可能是一个半符号主义/半连接主义的设计，或者相反，非常像人类，是一种基于双重交互假设运作的东西。也就是说，本能和普通机器通常协作工作。\n\
  \n我在这里所做的是观察来自分布式处理的观点，并检查自由耦合或无知耦合的核心思想是否可以作为组装多专家深度学习（DL）框架的最优方法的动力。一个主要的计算障碍是元级数据存在于适当框架中的思想。无论如何，无疑仍然有许多显然应该被利用的常规思想。这项研究两个两个很有前景：第一是识别基本标准，第二是区分关于多专家框架如何传递的指令。需求的身份识别（ID），或者又称为对话语言的含义，为研究提供了有限的空间，并以这种方式，使发现如何协调的可能性变得可行。\n\
  \n## 机器自我意识\n\n我们很大程度上都意识到意识的存在，但我们对其发展还没有一个满意的解释。我之前阐述过我认为的深度学习的五个能力级别：`[PER39]`。\n\
  \n- `仅分类 ( C )`\n- `带记忆的分类 (CM)` \n- `带知识的分类 (CK)`\n- `带不完美知识的分类 (CIK)`\n- `带不完美知识的协作分类\
  \ (CCIK)`\n\n我特意忽略了倒数第二级，即实现正念和意识的级别。这样做是因为如此宽阔的鸿沟最终必须跨越，而我们对此几乎一无所知。我可能希望我的研究是经过证明的组合，而不是基于思想实验的组合。\n\
  \n无论如何，有一些我认为值得考虑的推测。并不是因为有任何强有证据，而是因为它们背后的逻辑似乎看起来可行。我们没有检查这些假设中是否有是有效的，但无论如何，我们都可以利用预期的属性，可能将其作为我们深度学习研究的辅助。\n\
  \n在我们开始研究意识之前，我需要提到我们正在作为起始阶段使用的工程类型。我推测，要实现模拟意识，你必须以解耦方式通信的自由 DL 专家设计为基础。我在我的文章“单体深度学习的终结”`[PER46]`\
  \ 中简要讨论过这一点，并在“市场驱动协调”`[EQU]` 中讨论了一种协调代理的方法，将其称为模块化深度学习。\n\n我想检查两个我认为很有前景的假设。第一个是\
  \ Giulio Tononi 的整合信息理论（IIT），第二个是 Jurgen Schmidhuber 的推测。\n\n`从现象学到意识机制：整合信息理论 3.0\
  \ 或 IIT 3.0` `[OIZ]` 描述了该理论（这里有一个关于此点的 TED 演讲）：`[CHL]`。\n\nIIT 从几个格言开始，解释了这些话语，并提出了实现意识必须满足的条件。假设如下：\n\
  \n- `存在 (EXISTENCE): 某种状态的机制存在。框架是一组机制。`\n- `组合 (COMPOSITION): 元素组件可以合并成更高层次的组件。`\n\
  \n以及相关的机制：\n\n- `信息 (INFORMATION): 只要工具指示了框架内部“产生影响的对比”，它就可以增加意识。也就是说，状态中的一个工具产生数据，前提是它迫使框架的条件，而这些条件可以是其潜在环境，其结果可以是其目标影响反应库。`\n\
  - `整合 (INTEGRATION): 只要系统指示出一个对于自由部分是最终的影响集合（数据），它就可以增加意识。`\n- `排除 (EXCLUSION):\
  \ 在所有覆盖组件集合中，只有一个集合是可以感知意识的，即其系统指示了一个对自由部分具有最大最终性（MICS）的计算结构。`[OIZ]`\n\n随后的现实模型捕捉了这些格言和假设，并以详多的细节进行了阐述：\n\
  \n![](img/image00248.jpeg)\n\n图 10.7 公理与假设 [WIKI9]\n\nIIT 认为意识涉及程度，并提出了意识的比例。归根结底，许多框架现在是有意识的，但意识水平存在波动。该假设非常复杂，关键在于强调捕捉因果关系的数据结构，以及该因果结构的冗余展示了意识的比例。注意，因果关系、环境和逻辑结果、贝叶斯规则与共同信息密切相关。\n\
  \nSchmidhuber 是一个迷人的人，因为他几乎确定意识的概念已经解决。他的假设将组件与 DL 专家更自然地联系起来，但他通过他所谓的“哥德尔机”来研究意识。他的案例是\
  \ AI 早在 1991 年就获得了意识：`[CMJ]`。\n\n*我可能希望确保我们在大约 25 年里几乎没有任何简单的、有意识的学习框架。在那些日子里，我之前提出了由两个模块组成的通用学习框架。*`[CMJ]`\n\
  \n其中一个是间歇组织调节器，负责如何解码传入的信息（例如来自感觉传感器的视频和疼痛信号，以及来自渴望传感器的需求数据）转化为动作。\n\n\n\n\n自 1990\
  \ 年以来，我们的代表们一直在尝试做同样的事情，使用一个额外的循环模块，它基本上试图预测将发生什么。它观察执行的每一项活动，并在当感知信息输入时，利用这些经验来预测接下来的事情。由于这是一个间歇性组织，它可以以正常的方式预测未来的共性，许多人将其称为预测性编码。\n\
  \n当信息输入时，通过与环境的交互，这种孤立模型能够发现新的一致性、平衡或重复。从长远来看，它可以用更少的计算资源或更少的机会来处理整个过程。关于意识的一点是，当专家观察它与世界交互时，会发现一种通常被认为是自动化的机制。\n\
  \n我非常确信，理解意识的每一个要素就在那里，并且已经存在了 25 年了。在神经科学领域，那些可能不知道这些基本原理的人，还没有意识到这些简单性。\n\nJürgen\
  \ Schmidhuber 的假设是，两个循环——一个负责活动，另一个负责预测世界——是实现意识的基本结构。这在学习中被称为“元学习”。这确实非常迷人。这里是\
  \ Schmidhuber 讨论的：\n\n> 这种模型的独特之处在于它们具有相似的案例。也就是说，意识目前存在于简单的组件中，人类水平的意识仅仅是一个问题。这两个假设确保了不需要另一个组件来实现意识。现在已知这种循环。[PER21]\n\
  \n额外的接近性在于存在一种处理因果关系的工具。Schmidhuber 的方法利用 `RNNs` 来感知时间中的设计。\n\n我怀疑假设在 `IIT` 中提出的这种工具是深度学习框架中常见的。我们正处于发现它的起始阶段。再次，Schmidhuber\
  \ 说我们不需要看得很太远。他在最近的 NIPS 会上声称，`GANs`（过去 20 年 AI 最伟大的思想）与他 1992 年的论文《通过可预测最小化学习因子》是不可区分的。这篇论文描述了一个包含“两个对抗力量”的框架。我不确定这篇论文是否关于\
  \ Schmidhuber 所声称的同样的事情，我无法说 `GANs` 是否已经实现了意识！\n\n这让我感到困扰的是，如果这两个假设是正确的，我们将非常接近通用人工智能（AGI）。另一方面，我们可能非常遥远，不知道缺失的连接是什么。在两种选项中，人们无法预测何时\
  \ true AGI 的出现，这非常令人不安。\n\n### 奇异循环（Strange Loop）\n\n在过去的领域，某些类型的智能具有自我引用或反思能力。明确来说，内在和关系智能需要自我展示和反思。Douglas\
  \ Hofstadter 在他的书《我是奇异循环》（*I Am a Strange Loop*）中创造了这个概念：\n\n> 最终，我们是自我观察的、自我构建的，处于自我引用的超自然现象之中。[HOF]\n\
  \n他在那里将自我引用系统描述为心灵的奇特性。奇异循环是一个跨越几个层级的循环框架。通过遍历这个循环，人们找到了自己最初开始的地方。\n\n巧合的是，这个“奇异循环”实际上是\
  \ Yann LeCun 所描述的“过去二十 年 AI 界最伟大的思想”。YAN]\n\n循环在深度学习框架中随处可见。这些框架传统上由非循环计算层组成。然而，随着我们现在开始发现的，输入循环（input\
  \ circles）的工作正在为自动化创造最神奇的新能力之一。这并非诗意的夸张，这是正在发生的，研究人员正在创造执行人类能力的完全自动化。\n\n我对使用 `input\
  \ circles` 的可行深度学习框架的记忆是在《阶梯网络》（*Stepping Stool Networks*）。阶梯网络在 2015 年引入。[RAS]。这是其架构的描述：\n\
  \n```\nImages/00249.jpeg\n```\n图 10.8 解构阶梯网络 [RAS]\n\n阶梯网络是一个跨越所有层的循环，随后是最后一次前向传递。框架从内部部分收集数据并将其作为正则化要求。在提出时，它在组合上显示出惊人的速度。论文的第一批专家在\
  \ 2016 年中期扩展了这一点：\n\n```\nImages/00250.jpeg\n```\n图 10.9 Tagger：深度无监督感知分组 [GRE]\n\
  \n在 Tagger 设计中，你有多个连接在一起的阶梯网络，构成一个执行更优图像聚类问题的框架。\n\n生成对抗网络（GAN）也有自己的循环，但并非在工程上是明确的，而是作为其训练的一部分。一个\
  \ GAN 包含一个带有生成网络和对决网络的训练循环。这包括一个生成网络和一个判别网络。判别网络试图对生成网络产生的数据进行判定。生成网络试图通过观察数据来欺骗判别网络，作为结果，形成了一个更健壮的判别器和生成器。GAN\
  \ 执行了一种图灵测试，并且目前是图像的最佳生成模型。\n\n影响学习循环的系统还涉及到关于“渐进式学习”的更现代的研究。深度学习框架的缺点之一是针对新信息进行“微调”训练可能会破坏能力。这是框架“忽略”之前学习的问题。在斯坦福大学创建的一种名为“批评网络”（*Criticism\
  \ Networks*),[ZAM] 的架构中，研究人员探索了一种不同的网络，它向自身反馈并开发出逐渐改进的内部表示：\n\n```\nImages/00251.jpeg\n\
  ```\n图 10.10 FeedbackNet. [ZAM]\n\n\n\n处理“遗忘”问题仍有大量工作需要完成。然而，一篇名为《有标记监督下学习表示的限制》的研究论文\
  \ `[`SON\\]` 证明了基于 `GAN` 的系统具有与直接前馈神经网络相当的更高表征能力。因此，除了 `GANs` 引发了更进一步的推测外，它们可能还可以减少干扰。[`SON\\\
  ]`。\n\n## 10. CycleGAN 与图像到图像的解释\n\n最近 `UC Berkeley` 发布的一项研究（2017 年 3 月）利用 `GANs`\
  \ 和一种巧妙的正则化方法实现了能力令人惊叹的图像到图像解释。他们将该系统称为 `CycleGAN` `[`ZHU\\]`，并取得了一些卓越的结果：\n\n![](img/image00252.jpeg)\n\
  \n图 10.11 `CycleGAN` 示例。`[`ZHU\\]` `CycleGAN` 可以执行卓越的图像翻译。如上所示，它接受艺术创作作为信息并生成实用的照片。它可以执行诸如语义翻译的任务，例如将马转换为斑马，或将某个季节拍摄的照片使其看起来像是在另一个季节拍摄的。\n\
  \n`CycleGAN` 技术的本质是利用“循环一致性损失”（cycleconsistency misfortune）。这种损失保证了组织可以用正向解释和反向解释产生几乎忽略不计的损失。因此，组织不仅需要学会解读第一张图片，还需要精通反向（或相反）的翻译。\n\
  \n准备 `Deep Learning` 框架的巨大困难在于缺乏标记信息。命名信息是驱动 `Deep Learning` 模型准确性的燃料。然而，这些开始利用循环的较现代框架正在解决这种缺乏监督的问题。这就像拥有一台无尽的运动机器，这些自动化设备创建了新的标记信息类型。结果，它们通过额外信息变得非常有活力。这些自动化设备与自己进行博弈游戏，经过足够的游戏次数后，成为了该领域的专家。\n\
  \n这与 `AlphaGo` 如何通过自我对弈来培养新的围棋技术几乎相当。当自动化设备被植入一个输入循环并能够复制（有些人会称之为“创造力”）广泛的情况并个人测试这些情况的准确性时，我们正处于某些极其强大的创新的边缘，这些创新将迅速转化为我们文明中许多人已准备好应对的能力。因此，下次当你看到一些惊人的\
  \ `Deep Learning` 结果时，请观察方法中安装的奇特循环。\n\n让我提一下，`Hofstadter’s Strange Loop` 是无限递归的空间中构想出来的。尽管如此，`Deep\
  \ Learning` 过程接受的是有限的计算。无论是否存在循环，它通常被限于有限的计算。同样，过去也有利用循环或递归的策略。尽管如此，它们并没有处理包含许多层反思的阶级。这正是\
  \ `Hofstadter` 所拥有的直觉，而这种直觉在目前的研究中似乎意外地得到了证实。\n\n我将最后这段引用自一篇标题有趣的文章《谷歌围棋 AI 的胜利如何引发韩国恐惧》\
  \ `[`ZAS\\]`：\n\n“AlphaGo 真的有直觉，”谷歌首席支持者 `Sergey Brin` 在他的公司连续获得第三场胜利几小时后告诉《新科学人》，当时他飞往现场观察。“它做出了奇妙的行动。它下出了比我们大多数人想象的还要奇妙的棋。”\
  \ `[`ZAS\\]`\n\n## 11 人类兼容型 AI\n\n“通过人工智能，我们正在召唤魔鬼。在所有那些拿着五角星和圣水的家伙的故事里，就好像他确信自己能控制魔鬼。”\n\
  - `Elon Musk`\n\n从主体部分到第 10 章，我们环绕了波尼罗斯人（Austronesians）所创造的世界以及我们目前生活的场景。不久之后，我们将我们的经历称为更强大的\
  \ AI 时代之前的时期。那么波尼罗斯人之前的世界是怎样的？在波尼罗斯人参与之前，东南亚、马达加斯加或大洋洲的岛屿是什么样的？\n\n在波尼罗斯人出现在他们迁移或殖民的岛屿之前，有一些岛屿此前被作为其他人类种族的避难所。在波尼罗斯人出现之前，许多岛屿上就有采集者。在波尼罗斯人出现之前，也存在一些农夫。然而，早期波尼罗斯人在东南亚岛屿的出现，实现了木材采集者交换的专业化形成，以及狩猎群体与农民及其他群体的整合。[`BEL\\\
  ]`。\n\n波尼罗斯人对岛屿的影响无法与他们不同经济体系的进步以及航海的发展隔离开。与气候的交流无疑影响了波尼罗斯社会的发展。一个伟大群体的产生和发展最终将带来他们出现之前个人生活方式的变化。此外，`AI`\
  \ 的发展也带来了我们目前社会能力和工作方式的变化。考虑到这一点，关于这项技术的进一步发展，引发了一些问题，特别是关于它将给人类带来的进步。\n\n最后这一部分包含了许多与\
  \ `AI` 对社会影响相关的观点。这些观点一部分围绕着我们确实希望尽快追踪并实现某个目标的问题。然而，当 `AI` 技术取得巨大进展时，大部分观点将需要目标支持。进步的速度将是戏剧性的，但要评估`通用人工智能`（`AGI`）何时亮相实际上具有挑战性。\n\
  \n这一部分并不提供计划，而是人们应该思考的想法。尽管这完全不是一个极其合情理的部分，但我认为作为一个文明，人类需要对 `AI` 对未来的影响进行一场真正的讨论。\n\
  \n### 安全的职业\n\n`Thomas Frey` 有一篇有趣的文章《78 难以自动化的技能》。`[`FRE\\]` Frey 分类了他认为将保持“安全”状态的职业类别：\n\
  \n- 成本高到无法考虑的复杂框架\n- 只有人类才能欣赏的创造性任务\n- 产生强烈情感反应的人类之间的交流\n- 需要人类判断的复杂产出\n- 需要人类触感的情况\n\
  - 程序员抗性人员忠诚度优于先进机器的环境\n- 人类之间的交流\n- 人类之间的价值评判\n- 人类控制机器的职位 `[`FRE\\]` \n\n我将尝试根据……的观点处理每一项\n\
  \n\n\n\n\n我们创建了“深度学习画布”。在我们的方法论中，我们将“待办事项”（`JTBD`）方法的思想——即这种方法用于识别需要处理的任务——以及通过“深度学习”（`Deep\
  \ Learning`）所改进的对心理限制的理解交织在一起。\n\n在 Frey 的文章中，他发展了自己的观点，即可能被保护的职位是那些考虑了人类不合理性的职位。`JTBD`\
  \ 方法进一步超越了纯粹的实用性，而且倾向于关注人类需求，如倾向和社交货币。任何可以被深度学习（`Deep Learning`）框架计算机化的，都应该聚焦于这三种必要性的任何结合。目前，我们并没有使用强硬的手段并试图取代所有任务。相反，我们以一种谨慎的方式这样做：首先识别能够满足客户需求的能力，然后区分哪些具体的心理任务可以通过自动化来改进。\n\
  \n人们似乎错过了的一点是，职业的替代是分阶段且逐渐进行的。许多预测者忽略了这种细节。留任人员的能力将变得越发强大。首先失去职位的平平无奇群体在利用自动化工具方面的熟练程度会降低。这是一个良性循环：具备素质的人获得了更先进的能力。而那些没有素质的人被迫支付溢价来获取这些技能。通常情况下，目前没有任何教育基础来向他们展示这些技能。此外，能力较少意味着更多的商品化。人们将被迫进入“零工经济”，被迫在优势被推向零的业务领域中不断竞争。\n\
  \n然而，我们来分析一下 Frey 的大纲如何，因为它是开始更详细分析的基础。\n\n### 自动化成本过高的复杂系统\n\n复杂的框架将始终需要具有尖端能力的人来安排。然而，这并不意味着推动这一运动的自动化减少。事实上，应该预期尖端企业将尽可能使用自动化来加速工作。与其竞争对手相比，`Tesla`\
  \ 和 `SpaceX` 是非常自动化的公司。\n\n那些认为即使是考虑机械化也太贵的公司，可能是那些完全不知道如何利用自动化来降低开发成本的公司。\n\n###\
  \ 只有人类才能欣赏的创意活动\n\n这与上一点相似，但涉及更多的创意性任务。在许多好莱坞科幻大片中，我们不断利用日益进步的自动化来降低成本。制作人不再需要招募大量的群众演员来拍摄巨大的战斗场面。这些现在完全通过\
  \ `CGI` 复制完成。曾几何几何时候，史诗片贵到甚至无法考虑制作，但今天这已经不是问题了。\n\n当然，我们将创意人才继续推动情节的发展，但对人力资源的预期将继续减少。以后，我们可能不再需要电影的演员，而是可以使用知名演员的\
  \ `CGI` 诠释。事实上，假设我们某次对看类似的脸感到厌倦了，我们可以不断生成不相同的面孔！\n\n### 产生情感反应的人与人的互动\n\nFrey 描述的大部分内容（例如微笑、拥抱、亲吻、按摩等）通常不是付费的。事实上，在许多社会，为这些“人与人的互动”付费会被认为是违法的！\n\
  \n### 需要人类推理的决策\n\n人类充当了防止不受控自动化的“看门狗”。我认为，如果政府机构建立要求此类任务的规定，这种工作就不会消失。就像人们充当气体专家一样。某些国家需要这样做，尽管这实际上并非必须。尽管如此，这种监管可以保留许多人的工作。\n\
  \n### 需要人类翻译官的复杂输出\n\n示例：`医生`、`数据审查员`、`法官`、`商业领袖`、`安全倡导者`、`关系建立程序`、`分娩过程`、`谱系制图`。\n\
  \n这与前一类并不完全相同，甚至是更高级的。它位于顶端而非底部。无论如何，这涉及到人类来解释机器，以便人们可以理解（并接受）机器的结论。\n\n然而，由于目前的法律规定此类任务必须由人类执行，这可能不会改变。这种任务位于顶端而非底部。我们绝不能让非授权的人员送入终身监禁。\n\
  \n### 需要人类触感的情境\n\n示例：`教学`\n\nFrey 在这一分类中提供的模型似乎都围绕着教学。然而，我认为教学正极大地转向网络，我们需要创造出更智能的环境来服务更多的学生，并提供更好的质量。\n\
  \n我们目前的教育模式的问题在于讲授模式占据主导地位。我们真的希望投入更多主动学习（`Active Learning`）。人们通过实践学习得最好。这需要对直觉技术的深刻理解、对人类行为的理解以及教学策略。深度学习（`Deep\
  \ Learning`）成为重要因素的地方，在于它响应人类行为的能力。\n\n### 人类忠诚度优于数字机器的场景\n\n示例：`保护 VIP`、`守护秘密`、`个人信谊`、`保护公司信息`、`专家`、`游说者`、`机器人阻止小组负责人`。与常识相反，`区块链`框架被证明是抗黑的，而不是容易被社交工程攻击的人性。\n\
  \n### 人与人的评估\n\n示例：`股票市场`、`投票`、`政府方案`、`侵权结果`、`购买`、`采购专家`、`评分机构`、`调查和民意`。\n\n我们现在拥有框架对我们应该关注的事物做出广泛的“评估”。`Facebook`\
  \ 处理我们的理解列表。`Amazon` 推荐我们可能喜欢的物品。`Google` 引导我们的列表项。`AI` 正在为我们追求选择。\n\n\n\n\n在 AI\
  \ 经济中，操纵个人信誉将变得日益困难。机器知识将变得精细，以至于能够在工作环境中识别出许多伪装者。我们何不完全坦诚呢，个人报酬超过其应得价值的动机，是因为人们衡量代表人价值的方式存在严重缺陷。大约\
  \ 20% 的代表人完成了绝大部分工作，而 80% 的人是充场者。\n\n## 人类控制机器人的职位\n\n示例：所有者和董事、编程设计师、框架工程师、项目规划师、机器人维护人员、销售机器人的销售员。\n\
  \n这与过去的三个主题相似，特别是作为改进人类工作工具的计算机化。\n\n总而言之，这种流程可以进一步重组为：\n- 利用机器人化作为工具的职位。\n- 利用人类作为防止机械化幻灭感的安全阀的职位。\n\
  - 解读机器选择的职业。\n- 设计人机接口的职位。\n- 设计机械化以控制人类行为的职位。\n\n这就是未来可能存在且看起来是安全的五类工作。但尽管如此，除了“人类安全阀”之外，这些许多不同的职位都需要不可否认的水平能力。未来的职业需要对人类和机器有深刻的理解，而职业正存在于这种人与机器的交流之中。\n\
  \n我认为许多人并没有意识到，深度学习 AI 是一项类似于人类本能的创新。它与侧重思考的更传统的 AI 进展相比是相反的创新。目前存在着语义鸿沟 `[SMT]`。然而，人类的能力处于人工智能直觉\
  \ `[INT]` 和人工智能推理之间的困境中。正如此，许多人似乎未能理解哪些职业是保护的，哪些职业不受保护。不要让我们陷入这种幻梦，即我们独特的人类本能免受机器人化的取代。\n\
  \n随着深度学习的兴起，受保护的职位并不。我们需要理解这一现实，以便在审视我们的经济体系时获得早期优势。计算机智能可能会打破企业，而遗憾的是，我们还没有开始就什么将取代它进行真正的对话。显而易见的真相是，崛起的\
  \ AI 经济是为高技能人才准备的。\n\n### 时间阻抗不匹配\n\n“阻抗失误（impedance bungle）”一词源于设备，但在计算机编程中指信息源和受益者之间存在合理差异时所经历的挑战。\n\
  \n无论如何，还有一种“阻抗困惑”，即数据传输的速度与受益者处理数据的能力之间的差异。一个很好代表这种情况的情况可以在任何新编程产品的发布中找到。例如，另一个具有另一种\
  \ UI 的工作框架。为了在 UI 设计上改进，一组设计师和工程师可能花费很长时间来处理另一个设计方案。在此过程中，他们可能会构建新的比喻和更好的交流方式。从长远来看，对于设计者来说，该方案变得熟悉并最终变得直观了。\n\
  \n然而，当这个新程序很有趣地遇到另一个客户时，客户需要处理的新想法数量可能是巨大的。这是因为长期以来为连接构思许多新想法被打包并引入到另一个客户中，以便其快速摄取。因此，对于（用户界面）`UI`\
  \ 设计者来说，最佳实践是持续地提供更好的关联方法。这被称为“渐进式披露（moderate disclosure）”。这是一种策略，只引入完成所需任务所需的基础信息。这通过减少干扰和心理负荷，进一步提升了易用性。\n\
  \n渐进式披露对于机械化系统至关重要。这基本上是因为人类处理新数据的能力要慢得多。自动化应该旨在以客户实际上可以消耗的速度展示数据。拙劣的机械化只是简单地倾倒新数据，并期望客户应该从水龙中饮水。\n\
  \n从瞬时视角来看，理解自动化可以发现的数据范围是很有启发性的。这些包括：\n- 过去发现的信息\n- 正在发生的信息\n- 你在过去提到未来将告知的信息\n\
  - 确定性活动的建议\n- 对未来事件的预测\n- 减轻未来风险的预防性活动建议\n\nAI 机器人需要考虑这些数据被及时传输，而且以一种人类能够真正处理和跟进的方式传输。我们将在下一节探讨更复杂的情况，即由许多个人负责决策。\n\
  \n### 决策与责任\n\n#### 决策权\n\n随着机械化程度提高，对保护的要求也更加显著。当自动化运行速度远快于人类时，这种瞬态阻抗困惑将是危险的。因此，人机连接点的设计至关重要，以免让人类变成瓶颈，或避免可能导致快速连锁故障的机械化。\n\
  \n一种规定的做法是在组织内部传递和执行自主指导方面变得更加正式。机器将积极地摄取、分解并跟进新数据。尽管如此，存在人类做出最终结论或人类有选择覆盖自动化自主指导的情况。这是为了扩大机械化可行性必须达的重要平衡。许多组织可以毫不费力地限制机械化，就像人类一样。\n\
  \n其中一种框架是 RACI 分配矩阵，涉及以下 `[RACI]`：\n- Responsible（负责者）：谁在完成任务？\n- Accountable（责任者）：谁对任务做出决策并采取行动？\n\
  - Consulted（咨询者）：就选择和任务将与谁交流？\n- Informed（知情者）：项目期间谁将获得选择和行动的更新？`[RACI]`\n\n这个“谁”可能不是一个个人，而是一个机器。我们应该问自己的问题，以及我们参与的业务流程将是：“在什么情况下我们推卸所有责任和义务？”\n\
  \n\n\n然而，随着流程变得越来越自动化；随着决策由精细调优的算法执行；随着我们在规避责任时集体性逃避责任；随着当我们躲在自动化那毫无感情的界面之后而丧失所有同理心时；我们是否在无意中正向一个冷漠且肆无忌忌的世界迈进？毕竟，美国航空的一位付费客户难道不是被愚蠢地遭受了暴待，只为了事后获得对被“重新安排”的困扰所出的歉意吗？\n\
  \n从一般规律来说，我们可能都希望接受自己大部分时候是富有关怀的个体。尽管如此，这并不意味着我们可以轻易被诱导做出粗俗的行为，或执行不符合我们自身利益的行为。\n\
  \n## AI 监管\n\n现在让我们研究 AI 指南的问题。我们观察一下机器人化的连续谱如何？在这里要理解 `AI` 仅仅是一种能力更强的机械化，随后我们应该调查不同领域中适用于自动化利用的现有指南。\n\
  \n计算机化有一个广泛的连续谱，我们在之前的章节中已经讨论过。以下是回顾：\n\n- 等级 0（手动流程）\n- 等级 1（人工参与流程）\n- 等级 2（人工参与多个流程）\n\
  - 等级 3（无人值守流程）\n- 等级 4（智能流程）\n- 等级 5（全自动流程）\n- 等级 6（自优化流程）\n\n让我们现在分析不同领域的各种监管规定，并将它们与之前推荐的等级联系起来。我认为几乎可以肯定是正确的：适用于较低等级的监管规定同样适用于每一个更高的等级。\n\
  \n以下是目前存在的一些监管规定：\n\n- **自动拨语音电话 (Robocalling)**：由 `FTC` 于 2009 年颁布。`[ROB]`。禁止预录制的推销营销电话，除非广告商已获得购买者先先拟定的同意以做出决定。随后\
  \ `FCC` 于 2016 年颁布了关于政治竞选自动拨语音电话的法规 `[RBO]`。这属于等级 1 或等级 2 的自动化。\n- **垃圾邮件 (Spam)**：2003\
  \ 年的《垃圾邮件法案》`[SPM]` 基本上说“电子邮件不应在来源或内容上误导接收者，且此类邮件的所有接收者都有权拒绝它们”。这是等级 2 自动化。\n- **病毒、木洛马和蠕虫**：1990\
  \ 年《计算机滥用法》`[MIS]` 涵盖了未经授权的访问和“对计算机材料的非法修改”。这是等级 3 自动化。\n- **程序化交易 (Programmed Trading)**：1987\
  \ 年 10 月 19 日也被称为“黑色星期一”。新标准要求交易具有“交换控制”或“断路器”，允许交易在高度不可预测的情况下停止交换。这是等级 3 自动化。\n\
  - **高频交易 (HFT)**：`CFTC` 正在就自动交易提议监管规定 `[REG]`，例如 `AT` 战术，包括“欺骗交易（spoofing）”、“闪电交易”和“报价单填充”。高频交易包括利用\
  \ `PCs` 利用由于延迟和成员反应时间而出现的市场缺陷。总而言之，金融协会通过黑入我们的货币框架来观察他们可以合法掠夺市场成员的缺陷领域和条款，从而赚取足够支付租金的钱。这可能是等级\
  \ 2 或等级 3 的机器人化。\n- **无人机监管**：现生效的 `FAA` 规章 `[DRO]`。具体的指南通用到足以适用于其他机械化：“机器人需要保持在飞行员的视线范围内。”尽管无人机配备了更高级别的机器人化能力，但法律将它们限制在等同等级\
  \ 2。\n- **基因工程监管**：基因设计被限制在少数特定用途的生物上。`[GEN]`。对于实验和衍生产品的开发大多是合法的，但让这些经过遗传设计的生物进入野外是非法的！这是等级\
  \ 6 自动化。\n- **生物武器**：1989 年法案。`[BIO]`。该法案规定购买、出售或制造用于武器的生物剂是非法的。这是等级 6 自动化。注意，等级\
  \ 2 的武器化自动化已在中东地区偶尔的“无人机打击”中使用。还要注意，巡航导弹是等级 4 自动化武器。\n- **核不扩散条约**：与 `AI` 可能相关的两个重要方面是：`AI`\
  \ 可能“不得以任何方式协助、鼓励或诱导”非核武器国家获得核武器（第一条），以及“所有方为和平目的开发核能并从该领域的国际合作中受益的权利（第四条）”。\n\n\
  这只是对现有监管规定的简短回顾，包括其中一项指南。通过这种方式，我们可以得出什么结论？\n\n## 七大罪\n\n有一天发生在我身上的事情是，七大罪：*愤怒（以弗所）、贪食（斯密腊）、傲慢（以弗所哥）、色欲（提阿拉）、懒惰（撒底）、嫉妒（非腓城）和贪婪（老西西）。*它们大多源于我们的忽视，最明确地说源于我们的直觉。\n\
  \n早些时候我详细阐述过本能。双过程理论总结了两种感知。框架 1 是我们的本能。丹尼尔·卡尼曼 `[Kahn]` 在他的书《思考，快与慢》中指出，我们的认知偏差不利我们并导致我们做出许多非理性的决策。`[KAH]`\
  \ 我的问题是，这七种危险的罪是否同样源于我们的心理倾向，因此源于我们的本能？\n\n事实上，只需看看上面的表格，想必如此，因为很多鲁莽的行为似乎都是直觉驱动的。好了，我们来识别这些错误行为，并提出这些过界行为可能源自心理倾向。（如果你迷路了，请参考“认知偏差速表”`[BEN]`。）\n\
  \n- **愤怒**：由意义缺失触发。我们认为知道自己在想什么。\n- **贪食**：需要快速移动。为了保持正轨，我们倾向于眼前的诱人事物，而不是延迟和遥远的事物。\n\
  - **傲慢**：信息过多。我们注意到他人的缺陷，而不是自己的缺陷。\n- **色欲**：不是一种倾向，而是由本能决定。\n\n\n\n\n懒惰——信息过载。我们被证实现有的信念所吸引。\n\
  \n确认偏误。\n\n嫉妒——需要快速行动。为了采取行动，我们应该确定自己有影响能力，并觉得我们所做的是重要的。\n\n贪婪——需要快速行动。为了完成任何事情，我们受驱动去完成那些我们之前投入过精力的事情。\n\
  \n这种联系看起来非常精确。七大罪恶是出格的行为方式，这些行为可能作为额外的适度倾向而产生，然而，通过不同元素的融合，可能会引发风险行为。现在，让我们转向另一个可能同样相关的探究：人工智能是否能从这些危险的罪恶中获得灵感？目前有一种观点认为，AI\
  \ 不会像人们想象的那样具有破坏性，因为 AI 不是自然的，因此不具备导致我们偏见和种族灭绝等可怕悲惨行为的原始感官。\n\nGoogle 发表了一篇名为《为\
  \ AI 安全讨论带来精确性》的论文 `[PRE]`，在其中讨论了为了确保我们的安全 AI 系统面临的五个未来（而非现在）要求。我大胆将这些要求重新编写为戒律：\n\
  \n- AI 不得负面干扰环境\n- AI 不得操纵奖励函数\n- AI 不得骚扰其主人\n- AI 不得做不安全的事\n- AI 不得在学校外鲁莽行动 `[PRE]`\n\
  \n这个列表并不让人感到安心。\n\n所以问题是，受七大危险罪恶驱动的灵感在这些规则下是否足够？这五条 Google 指令的问题在于，主要的真正的防火墙是第 2\
  \ 条。即，“你不操操奖励能力。”不幸的是，我们从人类的一系列经验中得知，要建立一套不会被冒险者操纵的规则几乎是不可能的。\n\n也许我们需要另一套基于“七大美德”\
  \ `[VIR]` 的 AI 戒律：\n\n- 节制——AI 将练习自控。\n- 慈善——AI 将慷慨并为了人类的利益进行忏悔。\n- 勤奋——AI 将不对工作说任何负面话。\n\
  - 耐心——AI 将对人类表现出克制。\n- 体贴 AI 将对人类产生同情心。\n- 谦虚 AI 将崇拜人类。\n- 纯洁——AI 将不繁殖。\n\n目前，这确实让人感到安心得多。\n\
  \n这正是阿西莫夫推断机器人三大法则的方式：“当艾萨·阿西莫夫创作他的高级机械三大法则时，它们是直接摘自婚姻誓言的：爱、荣誉和服从”—— 迪·普兰特。因此，为什么这比“你不得操纵框架”的法令要好得多？在一个完美的世界里，你需要从根本上控制行为的选择，这样它是本能的，而不是可以被“操纵”的。从顶部开始的组件是有危险的，因为它们可以被轻易操纵。我们在政府监管中看到了一种关系，大众似乎通常有一个可以利用的逃生条款。因此，作为执行的一种方式，人们需要研究如何将理想设计到\
  \ AI 中。我认为这是主要的进展方向，而表征规则的分层方法将很难做到无无不入。\n\n让我提议在区块链中设计这些伦理。换句话说，通过网络共识来设计规则和行为。\n\
  \n网络共识实际上是人们实现深刻品质的方式。尤瓦·诺亚·哈拉里将现实分为三种类型：\n\n- 客观现实，即独立于我们对其是否有信心的现实。\n- 主观现实，根据信者单一大脑的观点的真理。\n\
  - 互主现实，存在于众多信者心智中的真理。\n\n这是一个非常有启发性的描述，有助于我们关注 AI 监管可能归类于何。文明已经涉及互主现实作为监管和宗教来实施个人的行为方式。尽管对\
  \ AI 幸福的最新探索仍包含了情感现实的编码。这无论如何都是危险的，因为学习机械化在特征上是多变的，沿着这一线，对真理的理解取决于未来的发展。另一方面，互主现实更难改变。改变一个人的观点比改变整个社会的观点要容易得多。\n\
  \n"
