    ## 结论


    总之，我们开发了一种基于 Ti3C2Tx 的多变量传感器，用于选择性 VOC 检测。该传感器通过在 IDE 表面沉积一层薄薄的 Ti3C2Tx 薄膜制备而成。所提传感器的八个代表性参数被选为
    VOC 特征，多参数传感响应为每种 VOC 创建了独特的指纹。多变量传感器在 PCA 中表现出高数据维度。在 LDA 中，分别对含氧 VOCs 和 VOC
    混合物的识别达到了 90.9% 和 90% 的正确率。基于所提传感器，乙醇浓度估计准确率高达 93.4%。较高的识别水平和浓度预测真正表明了 MXene 基多变量传感器在已知和未知干扰存在下检测感兴趣
    VOCs 方面的潜力。我们预期，本工作解决气体传感器交叉敏感性的策略可以轻松适应其他气体传感器，并应用于一系列新兴应用，包括农业、污染监测、食品质量保证和医疗诊断。


