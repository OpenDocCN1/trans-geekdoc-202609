    # CONCLUSION


    In summary, we developed a Ti3C2Tx based multivariable sensor for selective VOC
    detection. The snesor was fabricated by depositing a thin film of Ti3C2Tx on the
    surface of an IDE. Eight representative parameters of the proposed sensor were
    selected as VOC characteristics and the multi-parameters sensing responses create
    a unique fingerprint for each VOC. The multivariable sensor showed a high data
    dimensionality in PCA. Correct rates of 90.9% and 90% for the identification was
    achieved for oxygenated VOCs and VOCs mixtures in LDA, respectively. The ethanol
    concentration estimation accuracy is up to 93.4% based on the proposed sensor.
    The high level of identification and concentration prediction truly shows the
    potential of MXene based multivariable sensors for detection of VOCs of interest
    in the presence of known and unknown interferences. We anticipate that the strategy
    to solve the cross-sensitivity of gas sensors of this work could be easily adapted
    to other gas sensors and implemented in a range of emerging applications, including
    agriculture, pollution monitoring, food quality assurance, and medical diagnosis.


