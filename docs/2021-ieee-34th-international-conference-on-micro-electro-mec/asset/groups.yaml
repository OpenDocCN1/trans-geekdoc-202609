    ## 基于MXene和机器学习的多变量传感器，用于VOCs的选择性检测


    Dongsheng Li, Mengjiao Qu, Qian Zhang, and Jin Xie*


    State Key Laboratory of Fluid Power and Mechatronic Systems, Zhejiang University,
    Hangzhou, Zhejiang 310027, China


    ## 摘要


    二维过渡金属碳化物/氮化物，即MXene，最近在气体传感应用方面受到了广泛关注。然而，MXene对多种挥发性有机化合物（VOCs）具有强吸附性，因此基于MXene的气体传感器通常选择性较差。在此，我们开发了一种基于Ti3C2Tx的多变量传感器，可用于识别不同的VOCs，并在可变背景下预测目标VOC的浓度。传感器从宽带阻抗谱中获得的响应为每种VOC创建了独特的指纹。基于主成分分析和线性判别分析的方法，我们利用这种多变量传感器对不同类型的VOCs及其混合物进行了高精度识别。此外，我们证明在存在不同浓度的水和甲醇时，乙醇浓度预测的准确率为93.2%。较高的识别水平和浓度估计表明，基于MXene的多变量传感器在已知和未知干扰存在下检测目标VOCs方面具有巨大潜力。


    ## 关键词


    MXene；2D材料；选择性；多变量VOC感应；宽带阻抗谱。


    ## 引言


    气体传感在近年来引起了相当大的研究兴趣 [1, 2]。特别是，呼出气体中挥发性有机化合物（VOCs）的检测被视为早期疾病诊断的一种有前景的方法 [3]。在人类呼出气体中已检测出约200种VOCs，这些VOCs的含量反映了一个人的身体状况
    [4]。因此，气体传感器不仅需要灵敏地检测单个VOC，还需要在复杂背景下有效地区分不同的VOCs并定量特定的目标VOC。


    二维（2D）材料是气体传感应用中最有前途的材料之一，因为它们具有大比表面积、多样的表面化学性质以及在室温下进行灵敏检测的能力 [5]。最近，基于一种称为MXene的新型二维材料家族的气体传感器也显示出有前途的性能
    [6]。作为二维过渡金属碳化物/氮化物之一，MXene具有金属导电性，而其表面覆盖有官能团。这种良好的组合使得基于MXene的气体传感器相比其他二维材料基传感器具有超高信噪比和低检测限。


    然而，MXene对多种VOCs具有强吸附性。这些基于MXene的VOC传感器的选择性仍然是一个关键挑战。可以通过将传感器组合成阵列来缓解选择性差的问题 [7]。然而，传感器阵列中传感器数量的增加会增加故障的可能性。最近的突破来自多变量传感器
    [8]，其中单个传感器可以产生类似于传感器阵列所产生的多维信号。这些多变量传感器大多依赖于改变感应元件的温度，以克服基于电阻（或电容）测量的传感器的交叉敏感性
    [9]。然而，当应用温度循环时，感应层的材料特性可能会发生永久性变化。


    在此，我们提出了一种基于Ti3C2Tx的多变量传感器，可用于识别不同类型的VOCs，并估计多VOCs混合物中单个VOC的浓度。在此方法中，我们将Ti3C2Tx薄膜沉积在指间电极（IDE）表面上以形成多变量传感器，然后将其暴露于不同浓度的一系列不同VOCs中。在各种条件下获得了基于Ti3C2Tx的传感器的宽带阻抗谱。然后将其作为有监督和无监督机器学习的输入，并系统地分析了在不同频率下获得的阻抗响应。据我们所知，这是首次报道基于MXene和宽带阻抗谱的多变量传感器。


    ## 实验部分


    ### 基于MXene的多变量传感器的制备


    制备的基于Ti3C2Tx的传感器的示意图如图1a所示。传感器是通过在制备的IDE上覆盖一层Ti3C2Tx制备的。在Ti3C2Tx结构中，两层碳原子夹在三层钛原子之间。采用典型的合成方法，我们预期Ti3C2Tx的表面会随机终止于羟基（-OH）、氧（-O）和氟（-F）基团。IDE在Al2O3陶瓷基底（5
    mm × 5 mm）上制备，具有11对指间Au/Ni/Cu电极（厚度分别为10 μm / 4 μm / 1 μm）。Au条之间的距离及其宽度均为100 μm。将浓度为0.05
    mg/mL的Ti3C2Tx去离子水分散液滴加到制备好的IDE上，并在真空室中干燥，从而形成感应层。


    ### 基于Ti3C2Tx传感器数据的分析


    通过将基于Ti3C2Tx的多变量传感器暴露于不同浓度的不同VOCs来研究其感应性能。宽带阻抗谱（频率范围从20 Hz到2 MHz）


    ![](img/0a26dfd3b403563edffabb903a3a54f8_1_0.png)


    图1：（a）基于Ti3C2Tx薄膜传感器的示意图。（b）基于Ti3C2Tx传感器表面的SEM图像。（c）Ti3C2Tx薄膜的横截面图。


    ![](img/0a26dfd3b403563edffabb903a3a54f8_1_1.png)


    图2：不同VOCs的独特指纹图案的等高线图。


    ![](img/0a26dfd3b403563edffabb903a3a54f8_1_2.png)


    图3：含氧（a）和非含氧（b）VOCs的前3个主成分的3D图。


    的传感器进行了测量。响应定义为传感器暴露于VOCs后相对于基线阻抗的阻抗相对变化（ΔR(X)/R0(X0) (%)）。利用从宽带阻抗谱中获得的八个代表性参数开发了预测模型，即使用20
    Hz、336 kHz、2 MHz处的电阻值，以及189 kHz、299 kHz、710 kHz、1.19 MHz、2 MHz处的电抗值。首先，应用主成分分析（PCA）对多变量数据进行分类并降低原始数据集的维度。PCA是一种强大的无监督分析工具，允许对传感器的区分能力进行定性调查
    [10]。线性判别分析（LDA）作为一种有监督的模式识别工具进行，这意味着每个对象的正确分类是已知的。PCA中得到的主成分被用作LDA的输入变量，以定量识别不同的测试物质
    [11]。采用交叉验证方法来估计识别结果。为了量化混合物中单个蒸气的浓度，我们应用了带有五个潜在变量（LVs）的偏最小二乘法（PLS）[8]。在本研究中，多变量数据处理（PCA、LDA和PLS）是在MATLAB程序中进行的。


    ## 结果与讨论


    基于Ti3C2Tx传感器的表面形貌如图1b所示，揭示了Ti3C2Tx薄膜的均匀沉积。图1c显示了Ti3C2Tx薄膜的横截面SEM图像，该图像是通过真空过滤用于传感器制备的相同Ti3C2Tx溶液产生的。观察到的层状结构是由于单个Ti3C2Tx层的有序堆叠造成的，这导致比表面积增加，可能有助于产生较大的传感响应。基于Ti3C2Tx的传感器暴露于八种不同的VOCs（即甲醇（MeOH）、乙醇（EtOH）、丙酮、异丙醇（IPA）、乙腈（MeCN）、二氯甲烷（DCM）、正己烷和甲苯（TOL）），浓度范围从100
    ppm到800 ppm，并测量了宽带阻抗谱。基于获得的阻抗谱，我们选择了上述八个代表性参数作为VOC


