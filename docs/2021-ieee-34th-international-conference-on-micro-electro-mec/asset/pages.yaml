    We further used the PLS to quantify concentrations of ethanol in a background
    of variable humidity levels and methanol concentrations. Fig. 5a presents a simple
    visualization of the quantitative prediction of ethanol vapors in the presence
    of variable backgrounds. The position of each point is given by its real concentration
    (x-axis) and predicted concentration (y-axis). Perfect predictions will lay on
    the diagonal (i.e., prediction matches the real gas concentration). All the VOC
    concentrations were predicted quite well, as all the points are close to the diagonal
    positions. The average accuracy is 93.4% using 5 LVs.


