    # Principal component analysis


    We performed the PCA to discriminate the VOCs with the similar response and determine
    the dimensions of the resulting data set of multi-parameters sensing responses.
    The responses of the two groups of VOCs (i.e., the oxygenated and non-oxygenated
    VOCs) were analyzed by PCA separately. High contributions of the first three principle
    components (PCs) were achieved: i.e., 76.58%, 15.67% and 7.6% (oxygenated VOCs);
    87.7%, 8.9% and 3.2% (non-oxygenated VOCs), for PC1, PC2, PC3, respectively. This
    shows that the high data dimensionality can be obtained from the sensor on exposure
    to only four vapors.


    Fig. 3 shows a 3D plot of the first 3 PCs keeping most of the information (accounting
    for a total of 99.8%). Each point corresponds to an entire fingerprint of a VOC
    at a specific concentration (consists of eight parameters) and is colored according
    to the VOC it represents. Points belonged to different VOCs are well-separated
    in space, as can be seen in Fig. 3, indicating that the sensor can


    differentiate the VOCs very well. Points belonging to same VOC but with the different
    concentrations (from 100 ppm to 800 ppm) are located approximately in one line.
    These results show that the sensor has high data dimensionality and a potential
    to distinguish between different VOCs and quantify concentrations of individual
    vapors.


    # Linear discrimination analysis


    To quantitatively identify the types of various VOCs, LDA was carried out for
    oxygenated VOCs. Fig. 4a shows a 3D plot of LDA results. Each point is colored
    according to the VOC type and a pentagram represents the center of mass of each
    points group. Results shown in Fig. 4a clearly indicate that each VOC can be well
    determined. The LDA results of oxygenated VOCs are depicted in Fig. 4b. LDA identification
    accuracies of 95.4% were achieved, corresponding to 1 misclassification out of
    22 total samples. Cross-validation is an effective way to verify the obtained
    results, and leave-one-out cross validation (LOOCV) is often used as the validation
    algorithm [11]. The cross-validation results are depicted in Fig. 4c, indicating
    a cross-validation rate of 90.9% was achieved.


    Furtherly, to provide a more stringent test of the sensor, the identification
    ability toward similar VOC mixtures has been investigated. We use the LDA to discriminate
    the mixtures of EtOH and acetone (A), EtOH and IPA (B), acetone and DCM (C), as
    well as acetone and MeCN (D). Fig. 4d shows a 3D plot of LDA results of the VOCs
    mixtures. From different view angles, four kinds of VOC mixtures are well separated
    in a 3D feature space. A correct classification rate of 100% was achieved, as
    shown in Fig. 4e. The cross-validation results of mixture are depicted in Fig.
    4f, indicating a correct cross-validation rate of 90% has been achieved. These
    results demonstrate that utilizing the Ti3C2Tx based multivariable sensor is a
    promising approach for identification of pure VOCs and similar complex mixtures.'
