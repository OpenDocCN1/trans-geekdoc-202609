    \nBlockchain: Blockchain Technology 2018 - The Complete Guide To New Blockchain\
    \ Revolution!\n\n# Table of Contents\n\n[Table of Contents](#index_split_003.html#id_Toc346961131)\n\
    \n[Introduction](#index_split_004.html#mai34)\n\n[Chapter 1. What exactly is the\
    \ blockchain?](#index_split_005.html#id_Toc506748547)\n\n[Chapter 2. How the Blockchain\
    \ Works](#index_split_006.html#id_Toc346961137)\n\n[Chapter 3. Blockchain and\
    \ Cryptocurrencies](#index_split_007.html#id_Toc506748549)\n\n[Chapter 4. Benefits\
    \ of The Blockchain Technology](#index_split_008.html#id_Toc506748550)\n\n[Chapter\
    \ 5. Blockchain as a Service](#index_split_009.html#id_Toc506748551)\n\n[Chapter\
    \ 6. Blockchain Predictions of What Will Happen in 2018](#index_split_010.html#id_Toc506748552)\n\
    \n[Chapter 7. Conclusion](#index_split_011.html#id_Toc506748553)\n\nThis book\
    \ is meant to serve as a guide to help you understand what blockchain is and how\
    \ to leverage its benefits. It’s in no way intended to be a professional manual\
    \ for anything including trading. If you need cryptocurrency trading advice, consult\
    \ a professional financial analyst.\n\n# Introduction to Blockchain\n\nFirst,\
    \ let me congratulate you for purchasing this book and “thank you” for choosing\
    \ this copy. While you may not understand most of the basics behind blockchain,\
    \ I’m sure you know about Bitcoin and perhaps, Ethereum or Bitcoin Cash. Well,\
    \ all these digital currencies have one thing in common; they are written on the\
    \ blockchain.\n\nBut that’s not all. Blockchain has many other functions besides\
    \ providing cryptocurrencies with a basis to operate on. This technology is regarded\
    \ as the next big thing after the internet itself and therefore, learning its\
    \ ins and outs can help you leverage its advantages in the digital world.\n\n\
    Since much about blockchain can be confusing, this book has been written in most\
    \ basic language, so even a tenth-grader can understand much of the concepts discussed.\
    \ We will kick off by defining what this tech is, how it operates, its applications,\
    \ merits, demerits and how it’s likely to change as the years go by.\n\nThis book\
    \ won’t touch on the complex algorithms on how this technology is curated or anything\
    \ that makes you think you are back in college dealing with advanced algebra.\
    \ Once again, there is an overwhelming number of blockchain books out there, so\
    \ thank you for making this one your number one choice.\n\nEnjoy reading\n\n~Mark\
    \ Sloss\n\n# Chapter 1. What exactly is the blockchain?\n\n![C:\\\\Users\\\\MUSMART\\\
    \\Downloads\\\\bitcoin-3023881\\_1280.jpg](images/image-1.jpeg)\n\nA blockchain\
    \ is a decentralized ledger where everyone’s transaction history is stored. This\
    \ ledger automatically gets updated in regular time frames, is accepted by the\
    \ community as a fact, and gets stored on every participant’s computer. This way,\
    \ no central party has to govern the network, as issues like double spending rarely\
    \ exist in this ecosystem.\n\nInstead of a central party dictating what is “real,”\
    \ the community does so in a decentralized manner. Blockchain technology thereby\
    \ allows storage of any kind of information without needing a governing body.\
    \ This can be applied to any type of ownership, identification, knowledge, or…currency.\n\
    \nBlockchain and digital currency.\n\nBlockchain technology provides the infrastructure\
    \ for a digital currency to exist without a central bank. Currency is one of the\
    \ many different applications that can run on a blockchain, using the benefits\
    \ of decentralization in the digital world.\n\nSince this currency on a blockchain\
    \ uses cryptography, it is called cryptocurrency.\n\nWhat is a cryptocurrency?\n\
    \n![C:\\\\Users\\\\MUSMART\\\\Downloads\\\\wear-3080558\\_1920.jpg](images/image-2.jpeg)\n\
    \nIn a cryptocurrency, any rule or regulation is programmed into the cryptographic\
    \ algorithm that governs the decentralized community using the currency. The combination\
    \ of cryptography and currencies gives crypto-currencies their name. This basically\
    \ means a currency that is backed by and made rare through cryptography.\n\nNote\
    \ that trust in a cryptocurrency network is derived from the underlying cryptography.\
    \ Since this is a new concept compared to thousands of years of using precious\
    \ metals, it will take a bit of time until more and more people start to understand\
    \ the true benefits of the new system.\n\nBlockchain and Cryptocurrency nomenclature.\n\
    \nTo clear up some confusion, let’s define a few terms:\n\n**Blockchain:** The\
    \ immutable transaction history of a decentralized community.\n\n**Cryptocurrency:**\
    \ An application using blockchain technologies by which the transaction history\
    \ and therefore the exact amount of currency everyone owns gets stored via a blockchain.\n\
    \n**Bitcoin (capital B):** This is used to name the idea and protocol of the first\
    \ decentralized cryptocurrency on a blockchain.\n\n**Bitcoin(s)—lower case b:**\
    \ the currency itself.\n\n![C:\\\\Users\\\\MUSMART\\\\Downloads\\\\oie\\_oie\\\
    _trim\\_image.png](images/image.png)\n\nWHAT WAS THE FIRST DECENTRALIZED CURRENCY?\n\
    \nThere have been several cultures around the world that refused to have a centralized\
    \ monetary system. While it is very hard to say which one was the largest or first,\
    \ the concept of Rai stones on the island of Yap is quite fascinating and describes\
    \ the concept of a blockchain and decentralized currency in an easy to understand\
    \ way. The Islanders did not own much gold, so in order to have some kind of currency\
    \ that everyone could have access to if they wanted, they carved huge round stones\
    \ out of limestone. They would then be used as currency. In theory, every islander\
    \ would have been able to do this, but it mostly became a specialized task done\
    \ by few, while the others preferred to sell products or services to receive such\
    \ stones in return. The system was decentralized, as it was completely open for\
    \ anyone to join, and everyone had the same rights. \n\nLooking at blockchain\
    \ and cryptocurrencies, you will recognize how similar this concept of the Rai\
    \ stones actually is—with the difference that Rai stones are physical, and cryptocurrencies\
    \ are digital. That is why cryptocurrencies need a blockchain as an underlying\
    \ technology."
