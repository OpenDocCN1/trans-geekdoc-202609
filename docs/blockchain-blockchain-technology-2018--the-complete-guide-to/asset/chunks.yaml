  trans: '

    -   [微软和 IBM 最近发布了私有区块链服务技术（分别在其云平台 Azure 和 Bluemix 中）](https://example.org)，这些私有网络在其实验性质方面引发了相当大的问题，因为目前尚不清楚这些尝试将如何受到规模和操作规模以及其基础设施的影响。


    -   [区块链体验的更易获取性：微软和 IBM 将简化区块链访问的过程。]


    -   [规模灵活性：与比特币区块链网络不同，这些网络将允许更好地控制您运营的网络大小，因此您可以更轻松地添加或移除节点。]


    -   [全球可访问性：通过利用这两个云技术，区块链技术的访问将不再局限于世界特定部分。]


    -   [区块链技术的更易互操作性使用：目前，将区块链与不直接关联且与其协同开发的其他程序进行使用仍然困难。换句话说，区块链不只是用于与 Spotify 协同工作。随着区块链进一步发展为服务，将区块链技术简化并集成到其他平台的可能性将变得更加广泛可用。]


    -   [更易的开发机会：目前，运营区块链网络很难管理，但未来启动和管理它们将更加容易。]


    -   [新的程序创建模式：区块链仍然是一个需要高级技术知识才能进入的艰难行业。目前，它仍然过于复杂，无法拥有简单的界面。然而，随着区块链服务的不断开发，正在致力于开发能够更轻松地设计区块链应用的编程，从而提升其易用性。]


    -   [随着区块链被视作服务而非仅仅是平台，技术的进步将面临更多机遇。这为未来的发展铺平了道路。理解其作为服务的实施方式是理解当前正在考虑的未来应用的关键，尽管该技术尚未足够先进，无法将这些概念转化为现实。]


    ## THE MARKETS WHERE BLOCKCHAIN COULD PROVE USEFUL


    ![Image result for blockchain business](img/image-6.jpeg)


    ## 金融行业


    众所周知，金融行业在投资区块链技术方面发挥了最大作用。金融领域的参与者已经向开发区块链技术的公司投资了近 10 亿美元。成功在全球银行领域实施该技术后，预计每年可节省
    200 亿美元。


    事实上，许多区块链初创公司是由银行家创立的。纳斯达克、维萨和 JPMorgan 只是一些参与提供资产以进一步发展该技术的大公司。他们在研究什么？凭借他们投资的资金，这些公司将能够探索如何商业化区块链技术以处理股票、债券、贷款、衍生品等资产的交易。目前，这些交易由中央银行和其他机构记录和存储。这一过程成本高昂且耗时。


    区块链技术可以使这些交易更快、更安全。无论是在公司内部还是之间，正在试点交易程序，以便银行能够安全、快速地进行交换。这些交易与比特币区块链的交易不同，它们是私有的而非公开的，这意味着可能存在监管方监督交易。今年早些时候，已经成功进行了测试，纳斯达克成功使用其自有的区块链交易所完成一笔证券交易。


    ## 追踪黑市商品


    区块链技术可以用于建立一个登记册，使用户能够追踪物品的所有权，以确定其是否为非法或假冒的。保险公司正在被网络安全问题所吸引，其中一家已经与区块链初创公司合作，开始追踪钻石从矿山出发到达的过程。


    工作方式如下：物品的定义属性信息被记录并赋予一个分配给该物品的序列号。序列号在某些情况下可以直接刻在物品上。这些信息随后进入区块链数据库；由于信息在每个节点上复制并加密，因此无法被盗取或损坏。这种系统将使每个物品的溯源能够由销售者认证，并让买家能够了解他们正在寻找的物品。同时，这也为警察和其他当局在寻找被盗物品时提供了资源。


    这将是一个私有网络的例子，仅限于已证明自己在行业中可信赖的人员。未来，区块链技术将扩展以安全追踪其他有价值的市场，如艺术品或昂贵技术。


    ## 医疗行业


    区块链技术的隐私原则非常适合用于需要保护数据传输的行业，例如医疗记录的交易。医疗系统长期以来因低效的做法而落后，这些做法必须实施以保护患者身份。因此，医疗行业正在关注区块链的潜力。对于制药公司来说，吸引点在于追踪和标记药品以规范商品交易，防止非法交易和假冒。


    区块链技术允许重新定义对隐私的控制。正在进行的项目正在研究让个人能够将其个人数据存储在安全且私密的服务器上，从而赋予他们对谁可以访问该数据的控制权。以下情景将成为可能：当发出研究呼吁时，个人将拥有权力出售或允许研究人员访问其数据。数据将作为资产被利用，而非免费赠送。个人可以拥有数据并因此获得报酬。


    **保险公司**


    将区块链技术应用于保险领域可以创造新的业务，同时也有潜力破坏其他形式。可以发明新的保单类型；例如，由于区块链技术的 24 小时可用性，您可以在周末甚至公司营业时间之外购买保险。通过实时数据库更新，您可以选择在极短时间内投保。这将使长期事故保险变得不那么受欢迎，从而可能削弱利润。


    ## 媒体企业


    音乐行业正受到流媒体服务和非法下载的影响。如果能让音乐在线安全且便捷地访问，会有什么样的结果？区块链有潜力改变音乐产业处理版税成本的方式。众所周知，音乐产业正面临危机。这就是为什么艺术家
    Imogen Heap 通过基于以太坊的点对点开源实体 Ujo 平台发布她的单曲，创造了音乐历史。


