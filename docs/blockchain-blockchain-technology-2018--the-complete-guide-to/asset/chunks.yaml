- raw: "Bitcoin for example allows for around 6-7 Transactions per second, Ethereum\
    \ around 15 Tx/s. In Bitcoin, a miner therefore gets around 4,200 puzzle pieces\
    \ to fit every 10 minutes into a puzzle (7 Tx/s \\* 60s \\* 10min = 4,200 Tx per\
    \ block). Such a block in Bitcoin takes up 1MB of space. If you wanted to store\
    \ more Tx within a block, you either have to make the size of a transaction smaller\
    \ (less data per Tx), or you increase the blocksize (more data stored). Segragation\
    \ Witness (SegWit) solves that partially from the size angle.\n\nSegWit ( Segragation\
    \ Witness\n\nIn late 2017, Bitcoin introduced an update called Segregated Witness,\
    \ in short—SegWit—to enhance Bitcoin’s scaling. If you remember the puzzle piece\
    \ analogy of a cryptocurrency transaction, you remember that half the puzzle is\
    \ the transaction information itself and the other half is the signature of the\
    \ private key. With the SegWit update, the transactions got structured in a different\
    \ manner, where now the signature was taken away and stored “segregated.”\n\n\
    Instead of needing an area of the puzzle piece to store the signature, which is\
    \ only needed for verification and not for actual information, it can now be stored\
    \ differently, for example as a type of color on the piece itself. That’s why\
    \ it is called a “segregated witness.” Since the puzzle pieces are now only half\
    \ the original size (the signature is not taking up space anymore), twice as many\
    \ SegWit transactions can be stored in the same 1 MB block (around 8,400 SegWit\
    \ puzzle pieces fit into a complete puzzle).\n\n![C:\\\\Users\\\\MUSMART\\\\Downloads\\\
    \\bitcoin-3137150\\_1920.jpg](images/image-3.jpeg)\n\nFor the user, SegWit is\
    \ a soft-fork, meaning they can still send the old transaction format, just like\
    \ they can use an older version of WhatsApp and newer versions can still understand\
    \ them. “Old” Bitcoin addresses for example start with a “1,” SegWit addresses\
    \ start with a “3.” It will take a few more months until the full storage capabilities\
    \ are being utilized, and of course, the blocksize and the scaling debate of Bitcoin\
    \ will continue.\n\n Chapter 3. Blockchain and Cryptocurrencies\n\nWhile blockchain\
    \ is poised to do a great many different things in the near future, for now, the\
    \ most important thing you will want to keep in mind is that blockchains make\
    \ cryptocurrency possible. Bitcoin jumped in price to more than $19,000 during\
    \ 2017. While this price has pushed it out of the league of many amateur investors,\
    \ there are more than 1,000 different cryptocurrencies on the market these days,\
    \ so there are plenty of opportunities out there for those who are interested\
    \ in a potentially profitable investment. This is not to say that there isn’t\
    \ risk involved as well, however; it is important to keep the risks of cryptocurrency\
    \ investment in mind as well before making any investments in the space.\n\n![C:\\\
    \\Users\\\\MUSMART\\\\Downloads\\\\image-3046639\\_640.png](images/image-4.png)\n\
    \nHere are the advantages and disadvantages of cryptocurrencies:\n\nAdvantages\n\
    \nReduced probability of fraud\n\nAs cryptocurrencies are an all-digital currency,\
    \ this means there is less likelihood of fraud taking place around them; they\
    \ cannot be counterfeited, and there is no way for one member of the transaction\
    \ to reverse it once a transaction has taken place. \n\nExtreme access\n\nCurrently,\
    \ there are three billion people in the world who have access to the internet\
    \ but do not have regular access to any form of exchange. This leaves the cryptocurrency\
    \ market with a lot of room to maneuver, and it is expected to see significant\
    \ growth as it gains wider acceptance. This means that an increasing amount of\
    \ business will take place purely through digital currencies, which means those\
    \ who invest in cryptocurrency now aren’t just likely to see an increase; they\
    \ are likely to see a dramatic increase.\n\nLess chance of identity theft\n\n\
    Once you have bought into a cryptocurrency, there is less chance that you will\
    \ have to worry about identity theft than when working with traditional online\
    \ exchanges. This is a concern in traditional instances, as credit or debit cards\
    \ are charged with each new transaction, which means that there is a far greater\
    \ opportunity for identity thieves to find a way to crack the system and make\
    \ off with personal information.\n\nLower costs involved\n\nDespite the fact that\
    \ every cryptocurrency transaction comes with an accompanying transaction fee,\
    \ the fees for utilizing a cryptocurrency exchange are almost always going to\
    \ be lower than what the traders who use more traditional exchanges pay on a regular\
    \ basis. \n\nDisadvantages\n\nUnpredictable future\n\n![C:\\\\Users\\\\MUSMART\\\
    \\Downloads\\\\Blockchain guides\\\\blockchain limitation.jpg](images/image-4.jpeg)\n\
    \nWhile Bitcoin has proved to be a winning investment for the past eight years,\
    \ and Ethereum has grown year over year since its inception, despite some down\
    \ times in-between, that doesn’t mean that this will continue to be the case in\
    \ the long-term. There simply not enough past data to say with any real degree\
    \ of certainty what the market will look like in a year from now, much less 5\
    \ or 10, which means that both the potential for loss and the potential for gain\
    \ are virtually limitless. Basically, what this means is that up until the time\
    \ that the cryptocurrency market stabilizes, any dollar you put into Ethereum\
    \ is just as likely to be worth more next year than it is today as it is to be\
    \ completely worthless.\n\nPurely digital\n\nWhile the digital nature of cryptocurrency\
    \ is often touted as a positive, it is important to consider its negative aspects\
    \ as well. For example, as a purely digital construct, if you were keeping your\
    \ cryptocurrency in an exchange that had a server error that resulted in a loss\
    \ of all its backup drives, what would happen to your currency then? Likewise,\
    \ what were to happen if you put your coins into a physical wallet that then stopped\
    \ reading on your computer? \n\nBoth of these cases are unlikely to happen, but\
    \ if they were, then your cryptocurrency would be gone as if it had never existed\
    \ in the first place. Furthermore, the massive potential for profits means that\
    \ hackers are never going to stop trying to access these exchanges, so eventually,\
    \ they will succeed. When investing in cryptocurrency, it is important to value\
    \ security as highly as possible because there is very little standing between\
    \ your investments and the void.\n\nExtremely volatile\n\nWhile bitcoin can be\
    \ thought of as the most stable cryptocurrency, it is still six times as volatile\
    \ than investing in the S&P 500 and five times as volatile as investing in gold.\
    \ While this means there is an increased chance of profit, it also means there\
    \ is an increased chance for risk as well. A vast majority of all cryptocurrency\
    \ transactions are currently speculative in nature, which means that investors\
    \ are buying and holding them. This, in turn, creates a bubble that has to eventually\
    \ burst sooner or later. The trick with the bubble is to get in as early as possible\
    \ and keep an eye out for signs that it will burst so you can get while the getting\
    \ is good.\n\nBENEFITS TO TRADING IN BLOCKCHAIN CRYPTOCURRENCIES\n\n![Image result\
    \ for benefits of blockchain](images/image-5.png)\n\nGlobal currency\n\nWhen it\
    \ comes to standard currency, the number of things that can influence the price\
    \ is naturally going to be fairly limited. The opposite is true for cryptocurrencies,\
    \ however, it is difficult to tell what will set investors off before it happens.\
    \ Any currency news anywhere has the potential to set prices shifting dramatically;\
    \ in fact, several of Bitcoin’s most significant moves have come about due to\
    \ the introduction of controls for capital in Greece and when China devalued the\
    \ Yuan.   \n\nMarket is always ready"
