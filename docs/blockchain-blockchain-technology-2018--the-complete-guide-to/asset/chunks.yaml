    \ on a public Blockchain. And, these blockchains are where “Brave New World” apps\
    \ are being developed. In other words, applications on a public Blockchain are\
    \ those that didn’t exist or couldn’t have existed before Blockchains but are\
    \ now being developed - like cryptocurrencies.\n\nPrivate Blockchains\n\nNow let’s\
    \ contrast public Blockchains with private Blockchains. There are several private\
    \ Blockchains that are available on the marketplace. HyperLedger, which has big\
    \ backing by IBM, and Ripple which focuses on high transaction throughput in the\
    \ financial markets are two of the most well-known private Blockchains.\n\nThe\
    \ first distinctive quality of a private Blockchain is that, it is based on a\
    \ permissioned private ledger. Who can participate in the network and who can\
    \ validate transactions is known and vetted in advance. Participants must have\
    \ a level of trust within the network and be invited to join the network.\n\n\
    Since private Blockchains usually have large corporations as participants, sensitive\
    \ data will often be stored “off the chain” while consensus and validation information\
    \ will be store inside the blockchain. For example, the fact that two companies\
    \ agreed on a contract can be validated inside of the Blockchain, while the actual\
    \ terms of the contract might be stored “off chain” in a relational database.\
    \ Private Blockchains are the choice for “reconstructing existing world applications”\
    \ where old applications get a facelift with Blockchain technology to gain the\
    \ processing efficiencies that were discussed earlier.\n\n# Chapter 5. Blockchain\
    \ as a Service\n\n![Image result for common blockchain issues](images/image-5.jpeg)\n"
  trans: "\n虽然外汇市场通常被认为是最稳健的市场，因为它每周开放 120 小时，而加密货币市场每周开放 168 小时，交易在世界任何部分活跃时都在进行。目前，全球约有\
    \ 100 家主要的加密货币交易所，它们提供不同级别的交易服务，并根据服务水平收取不同的费率。因此，只需进行一些研究即可找到适合你的交易所。\n\n这也可能是一个负面因素，取决于你对风险的容忍度，因为这些因素足以在日常\
    \ basis 上产生大幅波动。事实上，大多数大型加密货币在大多数日子里价格波动超过 5%是常见的，而小型货币如果看到 15%或以上的波动并不感到惊讶。\n\
    \n高波动性\n\n加密货币由于没有受到任何更高权力的监管，且是一种新型投资形式，加上任何地方的任何事件都可能导致意想不到的剧烈波动，这些因素共同导致市场极度波动。单日价格波动超过\
    \ 5%对于多种加密货币来说并不罕见，而小额货币则能够以更频繁和更大幅度的方式波动。\n\n![Stock Market, Charts, Graphs,\
    \ Finance, Money, Stocks](img/00009.jpeg)\n\n**以太坊平台的指示**\n\n在当今市场上所有的加密货币中，致力于整体提升区块链体验质量的最专注的是以太坊。虽然它的加密货币以太币（ether）受到一定程度的投机，但它主要用于支付智能合约和运行在以太坊平台上的应用的交易费用。它已经处理的交易量约为比特币的一半，尽管它只存在了比特币三分之一的时间。它也更加专注于未来，凭借其与智能合约的改进交互以及去中心化应用平台。\n\
    \n也许更重要的，如果你查看比特币的交易图表，你会发现它不过是高低起伏。虽然整体趋势呈正向，但这很难被称为稳定增长。\n\n相反，以太坊的图表显示出更加看涨的整体前景，即使在\
    \ 2017 年夏季区块链处于当前高峰期。需要记住的是，加密货币始终是社会建构，这意味着以太坊强大的网络效应使得网络及其价值更容易持续稳步增长。\n\n以太币的最后一枚“点缀”是以太坊区块链全部基于智能合约技术。智能合约是可以加入区块并在此特定条件满足时激活的简单程序。虽然它们目前主要用于金融目的，但已经有兴趣将其用于从医院患者监测到公证服务的各种领域。事实上，以太坊的一个明确目标是简化传统合同的工作方式，从而显著降低相关服务成本。\n\
    \n以太坊平台每秒可处理 25 笔交易，尽管还可以进一步扩展。这个过程可能导致更多未被正确处理的孤儿块，但这并非常见现象。截至 2017 年 11 月，一枚以太币的价值约为\
    \ 350 美元，到 1 月份已上涨至 900 美元以上。\n\n# 第四章. 区块链技术的益处\n\n![C:\\\\Users\\\\MUSMART\\\
    \\Downloads\\\\Blockchain guides\\\\blockchain business.png](img/image-6.png)\n\
    \n## \n\n区块链创建了一个包含所有参与者的网络，并作为交易和资产所有权的验证机制。单一的交易副本存储在共享、分布式的账本中，该账本在网络中复制，因此每个成员都能在近实时获得精确的交易活动副本。区块链带来的独特益处包括：\n\
    \nTrustless（无需信任）\n\n区块链在“无信任”生态系统中运行，参与者无需相互了解或信任即可参与交易。\n\nProvenance（溯源）\n\n\
    溯源是资产完整历史的捕获。这段历史可能包含质量保证规格、所有权历史或其他对给定资产有价值的信息。\n\nConsensus（共识）\n\n共识是区块链验证交易的方式（而非由受信第三方）。书中专门有一章讲解此主题。\n\
    \nImmutability（不可变性）\n\n区块链在实践中一旦区块加入主链，基本上无法被修改。区块链不存在像其他数据库那样的“删除”或“更新”命令。\n\
    \n区块链类型\n\n主要有两种区块链：公共（开放）和私有（闭源）。先来看公共区块链的特点。你很可能听说过比特币和以太坊，它们以及其他当前市场上的许多加密货币都使用公共区块链。\n\
    \n**公共区块链**是无需权限的分布式账本。这意味着任何人都可以加入网络，无需申请或获得加入权限。公共区块链是匿名的，参与者无需透露身份即可参与。\n\n\
    开放区块链还具有匿名验证功能，任何人都可以参与验证交易的共识过程。这为潜在的坏人提供了篡改数据的可能性。该主题将在后续详细讨论。\n\n正如上述优势所示，公共区块链是无信任系统*。信任不是在公共区块链上进行业务的前提。你无需了解、喜欢或信任交易对手。这些区块链正是“新世界”应用正在被开发的地方。换句话说，公共区块链上的应用是那些在区块链出现之前不存在或不可能存在的，如今正在被开发的应用——例如加密货币。\n\
    \n私有区块链\n\n现在让我们对比公共区块链与私有区块链。市场上有多种私有区块链。由 IBM 支持的 HyperLedger 和专注于金融市场高交易吞吐量的\
    \ Ripple 是两种最知名的私有区块链。\n\n私有区块链的第一个显著特征是，它基于受权的私有账本。谁可以参与网络以及谁可以验证交易在加入前已知并经过审查。参与者必须在网络内建立信任并被邀请加入。\n\
    \n由于私有区块链通常由大型公司参与，敏感数据往往存储在“链下”，而共识和验证信息则存储在区块链内部。例如，两家公司达成的合同可以在区块链内验证，而合同的具体条款可能存储在链下的关系型数据库中。私有区块链是“重构现有应用”的选择，旧应用通过区块链技术进行改造，以获得前文提到的处理效率。\n\
    \n# 第五章. 区块链即服务\n\n![Image result for common blockchain issues](img/image-5.jpeg)\n\
    \n"
