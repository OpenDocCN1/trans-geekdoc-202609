- raw: "While the Forex market is traditionally thought of as the most robust market,\
    \ as it is open 120 hours each week, the cryptocurrency market is open 168 hours\
    \ each week, and trades are always happening regardless of what part of the world\
    \ is currently active. Currently, there are about 100 major cryptocurrency exchanges\
    \ in the world who all offer various levels of trading, along with differing rates\
    \ based on their level of service. As such, it should not take more than a little\
    \ research to find the one that is right for you. \n\nThis can also be seen as\
    \ a negative, depending on your tolerance for risk, as these factors can be enough\
    \ to generate large swings on a daily basis. In fact, price shifts of more than\
    \ 5 percent are common on most days for the larger cryptocurrencies, and the smaller\
    \ ones aren’t surprised if they see 15 percent movement or more.   \n\nHigh volatility\n\
    \nThe fact that cryptocurrencies are not regulated by any higher power, coupled\
    \ with the fact that they are a new form of investment and the fact that any event\
    \ anywhere can lead to essentially unexpected movement, all combine to create\
    \ an extremely volatile market. Swings of more than 5 percent in a single day\
    \ are not uncommon for several different types of cryptocurrency, and the smaller\
    \ currencies are capable of swinging with even greater frequency and to larger\
    \ degrees. \n\n![Stock Market, Charts, Graphs, Finance, Money, Stocks](images/00009.jpeg)\n\
    \n**A pointer on the Ethereum Platform**\n\nOf all the cryptocurrencies on the\
    \ market today, the one that is the most dedicated to improving the quality of\
    \ the blockchain experience as a whole is Ethereum. While its cryptocurrency,\
    \ ether, sees a fair amount of speculation, it is mainly used to pay for transactions\
    \ with smart contracts and applications designed to run on the Ethereum platform.\
    \ It has already seen about half as many transactions as Bitcoin, despite only\
    \ being around for a third of the time. It is also more firmly focused on the\
    \ future, with its improved interactions with smart contracts and its decentralized\
    \ app platform, as well. \n\nPerhaps more importantly, if you look at the transaction\
    \ chart for Bitcoin, then you will see that it is nothing but peaks and valleys.\
    \ It’s true that things tend to move in an overall positive direction, but it\
    \ can hardly be called steady growth. \n\n![Ethereum, Bitcoin, Black, Eth, Block\
    \ Chain](images/00010.jpeg)\n\nOn the contrary, the Ethereum chart shows a much\
    \ more overall bullish outlook, even through the summer of 2017, when blockchain\
    \ was at its current peak. It is important to keep in mind that cryptocurrencies\
    \ are always going to be social constructs, which means that Ethereum’s robust\
    \ network effects make it easier for the network, and its value, to continue to\
    \ grow steadily moving forward.\n\nThe final feather in ether’s cap is the fact\
    \ that the Ethereum blockchain is all done on smart contract technology. Smart\
    \ contracts are simple programs that can be added to blocks and then activated\
    \ once a specific set of circumstances occur. While they are currently primarily\
    \ being used for financial purposes, there is already interest in them for everything\
    \ from monitoring patients in hospitals to providing notary services. In fact,\
    \ one of the stated goals of Ethereum is to simplify the way that traditional\
    \ contracts work, thus reducing the costs of such services significantly. \n\n\
    The Ethereum platform can process a total of 25 transactions per second, though\
    \ additional scalability is also possible. This process can lead to additional\
    \ orphaned blocks that are never processed correctly; however, this isn’t a common\
    \ occurrence. As of November 2017, a single ether is worth about $350. By January,\
    \ it was above $900.  \n\n# Chapter 4. Benefits of The Blockchain technology\n\
    \n![C:\\\\Users\\\\MUSMART\\\\Downloads\\\\Blockchain guides\\\\blockchain business.png](images/image-6.png)\n\
    \n##  \n\nBlockchains create a network that includes all the participants and\
    \ acts as a verification mechanism for both transactions and asset ownership.\
    \ A single copy of the transactions is stored in a shared, distributed, ledger\
    \ that is replicated across the network, so each member has the exact same accurate\
    \ copy of the transaction activity in near real-time. The unique benefits that\
    \ accrue from a Blockchain are:\n\nTrustless\n\nBlockchains run in a “trustless”\
    \ ecosystem where the participants don’t have to know or trust each other to take\
    \ part in transactions.\n\nProvenance\n\nProvenance is the capturing of the complete\
    \ history of an asset. This history can contain quality assurance specifications\
    \ or ownership history or anything else of value for a given asset.\n\nConsensus\n\
    \nConsensus is a way by which transactions are validated by the Blockchain (not\
    \ by a trusted third party). There is a whole chapter of the book dedicated to\
    \ this topic.\n\nImmutability\n\nBlockchains are, for all practical purposes,\
    \ unalterable once a block has been added to the main chain. There is no Delete\
    \ or Update command in the Blockchain sphere as exists with other databases.\n\
    \nTypes of Blockchains \n\nThere are two main types of Blockchains: Public (open)\
    \ and private (closed). Let’s first take a look at the characteristics of a public\
    \ Blockchain. Most likely, you have heard of Bitcoin and maybe Ethereum. Both\
    \ of these and several others in the marketplace today operate using public Blockchains.\n\
    \n**Public blockchains** are permission-zero distributed ledgers. That means that\
    \ ANYONE can join the network and you don’t have to be asked nor do you need permission\
    \ to join the network. Public Blockchains are anonymous so members don’t have\
    \ to reveal who they are to participate.\n\nOpen blockchains also have anonymous\
    \ validation which means that anyone can participate in the Consensus  process\
    \ that validates transactions. This opens the door for potential bad guys to try\
    \ and tamper with the data in a Blockchain. This topic will be covered extensively\
    \ later on.\n\nAs you’ve seen in advantages mentioned above, public blockchains\
    \ are trustless systems*.* Trust is not a prerequisite for doing business on the\
    \ network. You do not have to know, or like, or trust the other party in a transaction\
    \ on a public Blockchain. And, these blockchains are where “Brave New World” apps\
    \ are being developed. In other words, applications on a public Blockchain are\
    \ those that didn’t exist or couldn’t have existed before Blockchains but are\
    \ now being developed - like cryptocurrencies.\n\nPrivate Blockchains\n\nNow let’s\
    \ contrast public Blockchains with private Blockchains. There are several private\
    \ Blockchains that are available on the marketplace. HyperLedger, which has big\
    \ backing by IBM, and Ripple which focuses on high transaction throughput in the\
    \ financial markets are two of the most well-known private Blockchains.\n\nThe\
    \ first distinctive quality of a private Blockchain is that, it is based on a\
    \ permissioned private ledger. Who can participate in the network and who can\
    \ validate transactions is known and vetted in advance. Participants must have\
    \ a level of trust within the network and be invited to join the network.\n\n\
    Since private Blockchains usually have large corporations as participants, sensitive\
    \ data will often be stored “off the chain” while consensus and validation information\
    \ will be store inside the blockchain. For example, the fact that two companies\
    \ agreed on a contract can be validated inside of the Blockchain, while the actual\
    \ terms of the contract might be stored “off chain” in a relational database.\
    \ Private Blockchains are the choice for “reconstructing existing world applications”\
    \ where old applications get a facelift with Blockchain technology to gain the\
    \ processing efficiencies that were discussed earlier.\n\n# Chapter 5. Blockchain\
    \ as a Service\n\n![Image result for common blockchain issues](images/image-5.jpeg)"
