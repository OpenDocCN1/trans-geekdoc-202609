- raw: "If major firms like Apple Music, Pandora, or Spotify were to release music\
    \ using a Blockchain, they would be able to capitalize on collection of royalties\
    \ in a way no platform has ever been able to guarantee its artist’s before. Instead\
    \ of having the music encoded on a file as with MP3s, a new type of file would\
    \ be used. MP3s can carry meta-data, but the amount is not significant and it\
    \ can be easily removed and passed on further without the ability to trace it.\
    \ This new type of file would be one that plays music as well as wears the Blockchain\
    \ data on intellectual property rights and requirements for payment. \n\nReal\
    \ Estate Market\n\n![Image result for blockchain and real estate](images/image-7.jpeg)\n\
    \nBlockchain can revolutionize the functioning of the real estate market by making\
    \ contracts, deeds and titles more secure and trackable than ever before. This\
    \ is particularly useful for instances where this information is at a risk for\
    \ loss. Imagine the dangers posed in the face of the loss of a paper archive,\
    \ for example, in a war-torn environment. With an updated record distributed across\
    \ multiple platforms, the risk of this loss is avoided and can be better maintained.\n\
    \nManufacturing Industries\n\nBlockchain can play a huge hand in preserving and\
    \ protecting the intellectual property of businesses, both small and large. 3D\
    \ Printing, as mentioned above, can be risky in terms of transferring data. This\
    \ applies to other goods as well. Particularly for smaller companies, the task\
    \ of protecting the IP of their products is high challenging when they are also\
    \ trying to operate on a platform to sell their wares. Using Blockchain, people\
    \ who hold rights on their creations have a platform to store metadata on actual\
    \ substances, thereby ensuring the safety of their wares.\n\nPersonal Data Management\n\
    \nBlockchain has the potential to put people in control of their own personal\
    \ data. Consider platforms such as Facebook and Instagram. Every time you interact\
    \ with information through these platforms, you are creating data that is then\
    \ controlled by those companies and sold off to other parties to design marketing\
    \ targeting your tastes. This is an example of companies having ownership off\
    \ your own data, data that you have created.\n\nWith a decentralized platform\
    \ like Blockchain, that information could be stored by you personally and selectively\
    \ released at your discretion rather than available in the ownership of the companies.\
    \ This ties into the concept of Internet of Things, because with the implementation\
    \ of identity-protecting Blockchain technology, you can have control over who\
    \ has access to what aspects of your identity. Combined with smart contracts,\
    \ you will have opportunities to authorize and more effectively manage the collection\
    \ of data on your identity. A new era of privacy is ushered in with the development\
    \ of Blockchain.\n\n# Chapter 6. Blockchain Predictions of What Will Happen in\
    \ 2018\n\n![C:\\\\Users\\\\MUSMART\\\\Downloads\\\\BLOCKCHAIN.jpg](images/image-8.jpeg)\n\
    \nMore adoption by both people and institutions\n\nThere is more value to the\
    \ blockchain-enabled technology other than top-notch security. For instance, individuals\
    \ can transact or communicate via secure channels. Transactions don’t go through\
    \ intermediaries and hence simpler and faster than those run by centralized entities.\
    \ Colleges, universities, hospitals, and financial firms are a few of the institutions\
    \ expected to leverage the pros of this technology.\n\nBut how will extreme volatility\
    \ of cryptocurrencies be dealt with? Sure, that’s an important question that if\
    \ answered could lead to many people adopting cryptocurrencies and its underlying\
    \ blockchain technology. UBIQUICOIN is one of the crypto companies with a two-coin\
    \ system, where one is crafted in such a way that it’s stable and thus not impacted\
    \ by traditional price swings.\n\nEmergence of tech and B2B giants\n\nThe first\
    \ month of 2018 hasn’t been merciful to the cryptocurrencies as we witnessed prices\
    \ dropping in massive scales. Even Bitcoin wasn’t spared, either. Despite these\
    \ unfortunate circumstances, huge companies such as Amazon and Facebook are said\
    \ to be interested in adopting the blockchain technology. TraDove is a Francisco—based\
    \ B2B company that raised millions in ICO pre-sales to help them move their services\
    \ onto the blockchain for secure and faster transactions.\n\nCryptocurrencies\
    \ will become the everyday payment method\n\n![Image result for companies accepting\
    \ bitcoin](images/image-7.png)\n\nAt the moment, WordPress, Expedia, Subway, and\
    \ Shopify are few of the companies accepting payment in form of cryptocurrencies.\
    \ The number of companies accepting this medium is expected to grow. Actually,\
    \ any enterprise that won’t be accepting Bitcoin and other major cryptocurrencies\
    \ will likely be frowned upon by customers.\n\nThere will be a surge in smart\
    \ contract use\n\nThe smart contract is a safe and secure form of payment in a\
    \ trustless system. Some of the companies leveraging the benefits of this technology\
    \ include JoyToken (gaming platform) and meVu, a betting platform with an aim\
    \ to make betting less expensive. Towards the end of 2018, smart contracts will\
    \ have taken over from signed paper contracts and other expensive escrow services\
    \ we are using at the moment.\n\nBlockchain will disrupt well-established industries\n\
    \nWe have companies that have dominated traditional markets for hundreds of years.\
    \ As the blockchain find its way into the mainstream use, it’s going to cause\
    \ disruption and shake things up in the conventional industries. For instance,\
    \ ODEM is an education blockchain technology that aims to connect educators with\
    \ leaners directly thereby cutting out intermediaries who make education costly.\n\
    \n# Chapter 7. conclusion\n\nIn short, blockchain is the technology that gives\
    \ power back to the people. If it gets widely accepted, we won’t have to part\
    \ with much in fees or worry about not receiving a payment or worst, losing money\
    \ through double-spending. This technology is the solution to all the losses we’ve\
    \ been incurring through centralized authorities.\n\nNow, it’s important to point\
    \ out that your knowledge of blockchain should not end here. Read as more books\
    \ and articles as possible so you can have a very clear understanding of it.\n\
    \n![Image result for conclusion](images/image-8.png)\n\nOnce again, I’d like to\
    \ thank you for purchasing this book. Feel free to leave some good review.\n\n\
