- raw: "Blockchain has dominated media channels for quite some time now, leading to\
    \ many people becoming interested to know why this technology matters. It’s expected\
    \ that as 2018 draws toward its end, we will be able to know just how well blockchain\
    \ fits into the nerves of the society.\n\n###   \n\n# Chapter 2. How the Blockchain\
    \ Works\n\n![Image result for common blockchain issues](images/image-1.png)\n\n\
    The blockchain operates through consensus. This is an agreement from all the participants\
    \ in a blockchain regarding the truth about certain data. Cryptocurrencies operate\
    \ around this method to avoid a single entity from having dominion over every\
    \ decision. Usually, when a transaction has been dispatched, miners will review\
    \ it and validate or discard it in unison.\n\nIn traditional systems, a single\
    \ authority like the government, banks and other agents are the ones to review\
    \ everything and issue the green light. The problem with such centralized systems\
    \ is that they put too much power in a few individuals who can abuse it.\n\nConsensus,\
    \ if not configured properly, can open loopholes that can lead to system corruption.\
    \ For instance, since all you need for your transaction to be valid is other miners\
    \ to confirm your transaction, why not create thousands of miners yourself? They,\
    \ in turn could confirm that someone sent you millions of dollars. This would\
    \ be called a Sybil attack, and may need a good number of pages to describe it\
    \ in full.\n\nCONSENSUS ALGORITHMS\n\nIn order to avoid all this chaos, legit\
    \ cryptocurrencies have developed consensus mechanisms that govern the above-mentioned\
    \ problems in a decentralized system:\n\nConflict of opposing information—one\
    \ miner saying one thing and another saying something else.\n\nPossibility of\
    \ creating fake miners who work in your interest and allow you to cheat.\n\nIncentive\
    \ mechanisms to motivate as many people in the system to participate in the consensus\
    \ and not only participating as a user.\n\nWhile there are many more consensus\
    \ algorithms in the making and they might be labeled differently in different\
    \ cryptocurrencies, these are the three most important ones:\n\n*   Proof of Stake\n\
    \n*   Proof of Work\n\n*   Proof of Importance\n\nThe latter is one of the least\
    \ used so far. It might be adopted more in the coming years, but so far Proof\
    \ of Work has mostly been used. With a Proof of Importance consensus algorithm,\
    \ the participant with the “most importance” gets to say which transactions happened\
    \ and also receives incentives most often. Since the person will not be the only\
    \ participant with importance, it is a probabilistic mix of when they have authority\
    \ and when someone else does. \n\nHow importance is established\n\nDifferent cryptocurrencies\
    \ have different mechanisms for that, but one factor is the length of time someone\
    \ is part of the system, combined with the number of other miners trusting them\
    \ by opting in to receive information from them. Compare it to social media. You\
    \ are more likely to trust the friend request of someone on Facebook that has\
    \ been there for quite some time already, has a legit looking profile, and many\
    \ of your friends are already connected to this new friend.\n\nIt is similar in\
    \ the world of decentralization when Proof of Importance is used. Someone’s importance\
    \ percentage is based on the value the system decides, which assigns how much\
    \ “voting power” they have, how often they get to go first with transaction processing,\
    \ and how often they are rewarded.\n\nThe upside of this system is that, literally,\
    \ anyone, poor or rich, can achieve a high level of importance. The downside is\
    \ that this system could be gamed by simply creating fraudulent participants who\
    \ then vote for each other, thereby creating importance. See it like a fake social\
    \ media account that people start to follow only because many others are following\
    \ it. Few blockchain algorithms are using this mechanism for this reason, and\
    \ it probably still needs some additional features to scale well. \n\nProof of\
    \ Stake\n\n![Image result for proof of stake](images/image-2.png)\n\nThe idea\
    \ of importance can be taken a step further, where money resembles importance.\
    \ Basically, whoever controls more money in the system has more importance. As\
    \ you might already imagine, this system has a lot of critics, as it begs the\
    \ question of how such a network could be decentralized, if only a few rich accounts\
    \ share all the consensus power. So far, only a few blockchains are using this\
    \ consensus mechanism, but for those that do, it seems to be working well. The\
    \ risk of one large player ruling it all is eminent, but the advantages of this\
    \ system are on the table:\n\n*   The mechanism of understanding how much voting\
