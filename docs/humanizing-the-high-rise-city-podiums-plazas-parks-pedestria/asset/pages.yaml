  md: '# ■ Podiums


    # Trump International Hotel & Tower (Trump Tower), Chicago [2009]


    The Trump International Hotel & Tower, standing at a height of 423 meters (1,388
    feet) and consisting of 98 stories, was constructed in 2009. It now holds the
    position of the second-highest structure in the city, with the 1974 Willis Tower,
    more commonly referred to as the Sears Tower, surpassing it in height.


    The tower’s podium design is distinguished by its unique integration with the
    Chicago River. This feature contributes to the building’s iconic presence in the
    cityscape. The tower’s base is artistically sculpted to reveal the “topographical”
    outlines of the lower floors, creating an undulating design that emulates the
    curves of the adjacent river. This architectural choice gives the base a dynamic
    and visually engaging appearance (Al-Kodmany, 2020; Kamin, 2022).


    The recessed floors of the base ingeniously reveal the structural columns of the
    building, infusing the design with a captivating rhythm and sense of order. This
    intentional transparency in the structure not only adds an intriguing layer of
    architectural interest but also offers observers a unique glimpse into the inner
    workings and foundational elements of the tower. It creates a dynamic interplay
    between form and function, engaging viewers in an exploration of the building’s
    structural intricacies.


    In addition to the thoughtful design of an articulated base, the tower’s connection
    with the river is elevated through the incorporation of cascading terraces. These
