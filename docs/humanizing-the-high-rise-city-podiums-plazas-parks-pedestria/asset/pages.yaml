    # CHASE TOWER PLAZA, CHICAGO


    Chase Tower Plaza (the Exelon Plaza) is a public space in the heart of Chicago,
    surrounded by some of the city''s most iconic landmarks. It covers an area of
    approximately 1.5 acres and features a large fountain, seating areas, and a variety
    of trees and plants. The plaza is a popular spot for office workers to take a
    break or have lunch, and it also hosts events throughout the year, such as concerts
    and farmers'' markets. It is a vibrant and inviting public space that adds to
    the character of downtown Chicago. The plaza is home to Chase Tower, a 60-story
    skyscraper completed in 1969 and the tallest building inside the Chicago "L" (short
    for elevated) Loop. Chase Tower has a distinctive curved shape and houses the
    headquarters of Chase Bank and Exelon, among other tenants (Al-Kodmany and Ali,
    2013; Al-Kodmany, 2017; Kamin, 2022; Saliga & Clarke, 1998).


    The plaza features a jet fountain, a clock tower, and a colorful ceramic mural
    by Marc Chagall called Four Seasons. One of the most eye-catching features of
    the plaza is the fountain, which occupies a central position. The fountain comprises
    a level basin with nine square sections, each with a water jet that shoots to
    different heights. The basin is raised above the ground and can be seen from the
    street even when the water is not running. When the water is turned on, it creates
    a dynamic and captivating spectacle that attracts the attention of the pedestrians
    who walk by. The fountain has a wide rim surrounding the basin, holding a thin
    water layer flowing gently over the edge. This water layer is separated from the
    deeper basin by a metal lip that prevents the water from spilling over. This design
    discourages visitors from sitting on the rim or entering the fountain but allows
    them to interact with water by touching or splashing it lightly. The fountain
    is a source of delight and relaxation for the visitors and a symbol of the plaza''s
    elegance and vitality. Being inside the Chase Plaza can be a truly special experience,
    given how the space is separated from the city and how the surrounding skyscrapers
    fade into the background (Figure 3.11). The wall of the sunken level moves to
    the forefront, creating a human-scale environment (Pridmore & Larson, 2005).'
