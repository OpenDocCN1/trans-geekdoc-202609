  md: '# ■ Waterfront Parks


    Fish ecologists used creative intervention techniques to support subsurface aquatic
    habitats in this area. For example, they integrated seven limnetic “habitat curtains,”
    each consisting of steel frames and wire mesh, from which nylon ropes dangle.
    These are made to make algae grow on them, providing food for fish. These curtains
    also offer an artificial filamentous substrate for inhabiting sessile organisms
    such as barnacles. Ecologists wrapped around and attached “pole hulas” to the
    underwater structural poles closer to the walkway. Pole hulas promote algae growth
    and the breeding of amphibious insects, which are primary food sources for fish.


    Further, ecologists installed caisson-mounted “lunkers,” porous steel cylinders
    that offer a place for fish to shelter from powerful river currents and aquatic
    predators, larger fish, and mammals. Fish lunkers were installed on seven of the
    caissons away from the walkway. A 10-inch (25.4-centimeter) gap between the lunker
    and the caisson provides a shelter for fish. Interestingly, these ecological techniques
    implemented in the Jetty were partially inspired by the “fish hotel” project that
    attracted and provided habitat for river species before the Riverwalk was built
    (Hill, 2019, p. 236).


    In essence, the Jetty emerges as a dynamic riverfront space where the serenity
    of fishing, the richness of ecological habitats, and the opportunity for education
    converge, creating a holistic and engaging environment that resonates with diverse
    interests and promotes a sustainable coexistence between the urban and natural
    realms (Figure 9.8).


