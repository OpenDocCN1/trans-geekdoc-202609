    # GARDENS BY THE BAY, SINGAPORE


    Gardens by the Bay, an expansive nature park in Singapore, sprawls over 101 hectares
    (250 acres) of meticulously reclaimed land along the picturesque Marina Reservoir.
    This iconic destination is distinguished by its triad of waterfront gardens, seamlessly
    integrating horticulture, architecture, and sustainability to create a truly immersive
    experience. Bay South, the most extensive garden, showcases a breathtaking array
    of plants from the Mediterranean and tropical regions, fostering a vibrant and
    lush landscape. Meanwhile, Bay East provides a serene retreat, offering visitors
    a peaceful panorama of the city skyline. Bridging the two is Bay Central, which
    interconnects the gardens through a scenic 3-kilometer promenade, allowing visitors
    to traverse the breathtaking landscape while enjoying the captivating synthesis
    of nature and design.


    Gardens by the Bay has a dual mission: to highlight exceptional horticulture,
    sustainability, and architectural design in the context of a tropical city while
    also serving as an educational platform to underscore the significance of environmental
    conservation (Rowe et al., 2019). Under the auspices of Singapore’s National Park
    Board, this visionary project was the collaborative brainchild of two distinguished
    firms: Grant Associates, renowned for its expertise in landscape architecture,
    and Wilkinson Eyré Architects, a firm specializing in innovative architectural
    design. Together, their collective vision has brought forth a botanical oasis
    that not only captivates with its aesthetic brilliance but also serves as a catalyst
    for environmental awareness and conservation education. The seamless integration
    of horticulture, sustainability, and architecture in the Gardens by the Bay is
    a testament to Singapore’s commitment to pushing the boundaries of urban green
    spaces (Al-Kodmany, 2018; Flannery & Smith, 2015; Leet, 2013).


    The Gardens feature a myriad of attractions that blend nature and innovation seamlessly.
    The Flower Dome, one of the largest glass greenhouses globally,'
