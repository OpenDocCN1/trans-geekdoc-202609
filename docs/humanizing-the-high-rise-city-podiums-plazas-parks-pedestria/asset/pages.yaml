  md: '# Podiums


    engagement with the pedestrian realm. Podiums often have a monolithic and sterile
    appearance, creating a visually dull and cold atmosphere that detracts from the
    urban fabric and streetscape. Moreover, they may disrupt the continuity of the
    urban fabric and fail to blend in with the surrounding context (Gehl, 2010; Whyte,
    1980).


    # Westin Bonaventure Hotel, Los Angeles [1976]


    The Westin Bonaventure Hotel in Los Angeles, CA, represents a controversial emblem
    of modern architecture. Central to the debate is the hotel''s extensive podium,
    which dominates a significant portion of the ground level and has been criticized
    for its failure to harmonize with human scale, fulfill basic needs, and provide
    aesthetic charm. This substantial concrete podium not only obstructs views of
    the street but also contributes to a feeling of isolation and detachment from
    the surrounding urban environment. Lacking inviting or engaging elements conducive
    to pedestrian activity or interaction (Figure 2.1), the podium''s design is seen
    as emblematic of the hotel''s perceived disregard for the public realm, reflecting
    a preference for exclusive and private spaces.


    The architectural complex was conceived by John Portman & Associates (Goldberger,
    2011).


