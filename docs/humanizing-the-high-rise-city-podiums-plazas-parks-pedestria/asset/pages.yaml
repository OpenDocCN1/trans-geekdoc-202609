  md: '# Podiums


    In contrast to the historical reverence seen in the Tribune Tower''s use of fragments
    from iconic landmarks worldwide, 101 California Street adopts a more eclectic
    approach, blending modernist elements with historical references. The cylindrical
    shape and sawtooth profile, coupled with a glass curtain wall, showcase a departure
