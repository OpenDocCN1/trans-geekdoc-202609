    # Phase 3


    Phase 3, completed in 2016, unfolds along the Chicago Riverwalk from LaSalle Street
    to Lake Street, introducing three distinctive “urban rooms”: the Water Plaza,
    the Jetty, and the Riverbank (formerly known as the “Boardwalk”). Each thoughtfully
    designed space spans considerable lengths, with the Riverbank extending 500 feet
    and the Water Plaza and the Jetty spanning 300 feet each. Much like the “urban
    rooms” introduced in Phase 2, these spaces are strategically framed by the iconic,
    historic bridges, contributing to a heightened sense of visual enclosure and the
    unique character of the place. The deliberate delineation of these urban rooms
    along the riverfront enhances the overall coherence of the Riverwalk and invites
    visitors to explore and engage with varied environments, each offering its unique
    blend of urban charm and scenic beauty (Al-Kodmany, 2023; Chicago Riverwalk; Kamin,
    2023).


    # The Water Plaza


    The Water Plaza, gracefully extending from LaSalle Street to Wells Street, emerges
    as a captivating aquatic haven within the heart of Chicago’s urban landscape.
    This expansive plaza is characterized by a long, rectangular, zero-depth water
    fountain adorned with sleek black granite floor. The focal point of this aquatic
    spectacle lies in its interactive water jets, thoughtfully designed to engage
    children and inspire delightful play.


    Functioning as a lively splash pad, the Water Plaza transcends generational boundaries,
    captivating the imaginations of people of all ages and welcoming the playful antics
    of pets. The interactive water features create an inclusive environment, fostering
    a sense of community and shared enjoyment as families and friends gather to revel
    in the refreshing embrace of water.


    The Water Plaza is crucial in compensating for the limited opportunities to directly
    engage with the river water. Its design acknowledges the desire for a hands-on,
    immersive experience with water, offering a dynamic alternative that invigorates
    the senses.


    Beyond its role as a splash pad, the Water Plaza caters to practical needs by
    including public restrooms, ensuring the comfort and convenience of visitors.
    Mechanical equipment discreetly integrated into the plaza’s infrastructure powers
    the mesmerizing water jets, a testament to the thoughtful planning that underlines
    this urban aquatic retreat (Al-Kodmany, 2021; Chicago Riverwalk).


    In essence, the Water Plaza transcends the conventional boundaries of public spaces,
    transforming the riverfront into an interactive playground that resonates with
    children’s laughter, the joyous splashes of water, and the collective appreciation
    of a unique urban oasis. As visitors engage with the interactive water features,
    the Water Plaza becomes a vibrant focal point, enriching the urban experience
    by seamlessly blending recreation, aesthetics, and practical amenities (Figure
    9.7).'
