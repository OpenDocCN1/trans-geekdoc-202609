  md: '# **Shimao International Plaza, Shanghai [2006]**


    Shimao International Plaza is a skyscraper in the Huangpu District of Shanghai,
    China. It was designed by Ingenhoven Overdick and Partners, a German architectural
    firm specializing in ecological and sustainable buildings. Completed in 2006 after
    five years of construction, the building has a height of 333 meters and consists
    of 60 floors above ground. The building features a distinctive triangular shape
    that narrows as it rises, creating a sleek and elegant silhouette. The shape also
    reduces the wind load and optimizes the use of space. The facade comprises glass
    and aluminum panels, with horizontal louvers that provide shading and reduce energy
    consumption.


    The podium design of Shimao International Plaza is conceived to craft a vibrant
    and interactive urban space that mirrors the vitality and diversity of the city.
