    greenery in urban environments mitigates climate change, reduces urban heat island
    effects, and improves air quality, acting as a natural filter for pollutants and
    enhancing overall environmental health. Integrating biodiversity into the urban
    fabric enriches the visual appeal of high-rise living and plays a crucial role
    in creating sustainable and harmonious cityscapes (Giffordy, 2006; Peters, 2010).


    The following case studies highlight the roles of public parks in humanizing the
