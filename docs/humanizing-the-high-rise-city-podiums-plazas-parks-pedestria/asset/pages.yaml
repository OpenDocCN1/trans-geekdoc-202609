    expression.


    # Thompson Center, Chicago [1985]


    The building, originally known as the State of Illinois Center, was renamed in
    1993 to honor former Illinois Republican Governor James R. Thompson. It is a 17-story,
    94-meter (308-foot) building in Chicago''s Loop, the heart of the CBD. Helmut
    Jahn, the building''s architect, has formulated an exciting design characterized
    by sweeping arcs of glass that wrap around an enormous cylindrical atrium, spanning
    the building''s full height, to culminate in a skylight. As the central office
    for State government employees, the building''s transparent appearance reflects
    the transparency of government in a democratic society. Its skylight and central
    atrium convey a modern reinterpretation of the traditional rotunda or dome. Furthermore,
    the changing patterns of light and shadow create a dynamic visual display along
    the facade of the building, enriching the experience of this urban space. At its
    completion in 1985, the building was considered a significant departure from more
    conventional modern architecture.


    Helmut Jahn''s design subtly tapers backward to address "tallness" issues and
    respect human scale. In this context, the building doesn''t maintain a uniform
    width from the ground to the top; instead, it narrows and tapers slightly as it
    rises. Tapering forges several effects, including reducing the visual impact of
    height, improving wind conditions at the pedestrian level, enhancing structural
    stability, and creating a more aesthetically pleasing silhouette. The structure
    feels more proportional and integrated within the surrounding environment. This
    consideration aligns with the idea that overly tall structures can sometimes dominate
    the skyline and create a sense of imposing scale that may not be conducive to
    the human experience at the street level (Al-Kodmany, 2020; Jahn, 2015).'
