    # JOHN HANCOCK CENTER PLAZA, CHICAGO


    The John Hancock Center Plaza is a public space at the base of the 100-story,
    1,128-foot supertall skyscraper in the Magnificent Mile district of Chicago. The
    plaza features a sunken garden, a fountain, benches, and temporary sculptures.
    It is a popular spot for tourists and locals to enjoy the views of the iconic
    building, designed by Skidmore, Owings, and Merrill and completed in 1969. The
    iconic structure, officially rebranded as 875 North Michigan Avenue in 2018, still
    resonates with its original designation, paying homage to the esteemed U.S. Founding
    Father, John Hancock. Initially christened in honor of the insurance giant, the
    John Hancock Mutual Life Insurance Co., the building’s nomenclature intricately
    ties back to the visionary founder of this significant insurance entity. The building
    houses offices, restaurants, a hotel, condominiums, and an observation deck with
    a 360-degree view of the city and Lake Michigan. The observation deck also features
    TILT, a moving platform that leans visitors over the edge of the skyscraper to
    a 30-degree angle, and a full bar with local selections (Al-Kodmany, 2017; Kamin,
    2022; Saliga & Clarke, 1998).


    The plaza is situated at the tower’s western edge. Originally designed as a rectangular
    sunken plaza containing trees and a public ice-skating rink, the Center’s owner
    planned to cover the plaza with a gabled glass atrium in 1988. However, the proposal
    was rejected by Mayor Richard M. Daley and the residents. In 1994, the plaza was
    successfully refashioned into a semi-circular sub-level space, creating good public
    access through multiple staircases extending to the street level (Figure 3.15).
    The renovation included the replacement of the previous white marble with gray/black
    granite that more closely resembles that of the building (Binder, 2006; Zukowsky
    et al., 2004).


    The plaza provides sufficient sitting areas at the sub-ground level with plenty
    of recreational options. A permanent seating area built into the semi-circular
    granite structure is interspersed with planted sections and stairs. The plaza’s
    middle point is slightly raised and contains a fountain and waterfall. It serves
    as a place for movable chairs, tables, and stages for small, programmed events.
    The plaza offers good access to shopping and restaurants, with the south end of
    the plaza being used as the Cheesecake Factory’s outdoor seating area. One can
    enjoy a miniature “urban oasis” here in the summer and experience what has become
    known as the neighborhood’s unofficial Christmas tree in the winter. Overall,
    the sunken plaza’s relatively small size and narrow footprint bring it into scale
    with the richly pedestrian setting of the area,'
