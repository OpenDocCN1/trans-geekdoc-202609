  md: '# ■ Sky Parks, Gardens, and Green Walls


    Salesforce Park incorporates sustainable design elements, such as energy-efficient
    lighting, eco-friendly technologies, and a rainwater collecting system, aligning
    with the city''s environmental goals. Salesforce Park manages 67% of stormwater
    runoff annually, providing habitat for 47 bird species and reducing energy costs
    by 36,100 kWh annually. It attracts an average of 1,067 weekday and 917 weekend
