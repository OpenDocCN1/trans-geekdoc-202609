  md: '# **Richard J. Daley Center, Chicago [1965]**


    The 32-story, 198-meter (648-foot) tower is in the heart of Chicago''s Loop. It
    embraces a Modernist style of architecture and is constructed out of Cor-Ten steel,
    which, when rusted, strengthens the structure and gives it a unique reddish-brown
    color. The tower''s exterior is buttressed by twelve large cruciform columns that
    enable column-free interior spaces. The ground floor is completely enclosed in
    wall-to-wall glass windows, allowing passersby to glimpse the main lobby. In essence,
    the Daley Center is an island of steel and glass in a sea of granite, with the
    plaza covering 80% of the entire block, not counting the space created by the
    setbacks. Designed by C. F. Murphy Associates, the Daley Center was the tallest
    building in the city when it was built in 1965. However, its status as such was
    short-lived, given the completion of the John Hancock Center only four years later
    (Al-Kodmany & Ali, 2013; Schulze & Harrington, 2003).


    The podium of the Daley Center Building stands as a testament to architectural
    ingenuity, seamlessly integrating transparency to enhance the interaction between
    the towering structure and the surrounding pedestrian space. This innovative design
    goes beyond mere aesthetics, creating an inviting environment that fosters a harmonious
    connection between the architectural marvel and the individuals traversing the
    area. Using a transparent base transforms the entryway into a permeable portal,
    breaking physical barriers and establishing a sense of openness. Visitors are
    greeted by a welcoming environment where the boundaries between the interior and
    exterior blur, creating a dynamic spatial experience. The podium''s transparency
    fulfills an aesthetic purpose and plays a crucial role in fostering a symbiotic
    relationship among the Daley Center Building, its plaza, and the pedestrians it
    accommodates. It is a testament to the commitment to creating spaces that transcend
    traditional architectural norms, embracing a design philosophy prioritizing accessibility,
    openness, and seamless integration with the urban fabric (Figure 2.7).


    +   2.7

    Richard J. Daley Center, Chicago, IL. Located in Chicago''s Loop, it is a 32-story,
