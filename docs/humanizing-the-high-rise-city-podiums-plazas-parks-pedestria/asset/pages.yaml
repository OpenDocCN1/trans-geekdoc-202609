    & Chicago River Museum is a five-story, 1,200-square-foot (111 square-meter) bridgehouse
    at the western edge of Michigan Avenue. At the river level, this historic structure
    lively exhibits the bridge’s machinery and giant gears that make it open and close.
    It also exhibits a series of visuals illustrating'
