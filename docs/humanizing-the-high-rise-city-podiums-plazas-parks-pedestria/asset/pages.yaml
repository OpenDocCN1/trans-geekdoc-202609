- pgno: 269
  md: '# 11.6 Sky Gardens


    in Shanghai Tower. Inspired by traditional Chinese gardens, they incorporate elements
    such as water features, rocks, plants, and trees to create a harmonious, serene
    environment that complements the modern tower’s architecture. Source: Photograph
    by author.


    ![](img/86224a12e9c033ac264ec8aca6249ec6_269_0.png)


    Green walls can vary in size, complexity, and design, ranging from small installations
    to expansive vertical gardens covering entire building exteriors.


    Green walls typically consist of the following components (Sheweka & Magdy, 2011;
    Wong & Baldwin, 2016):


    +   * **Support Structure**: The support structure is the foundation for growing
    plants. It includes a framework, trellis, or modular system that is securely attached
    to the wall or façade.

    * **Growing Medium**: The growing medium is a soil-like substrate that provides
    a medium for plant roots to anchor and receive nutrients. It is designed to be
    lightweight and porous, allowing for proper root growth and water retention.

    * **Plants**: Various plant species, including ornamental and functional plants,
    can be chosen for green walls. The selection of plants depends on factors such
    as light conditions, climate, and the desired aesthetic.

    * **Irrigation System**: Green walls require a reliable irrigation system to deliver
    plant water and nutrients. Irrigation can be achieved through drip systems, hydroponic
    methods, or automated misting.

    * **Drainage**: Proper drainage is crucial to prevent water accumulation and ensure
    the health of the plants. Drainage systems are designed to remove excess water
    and prevent root rot.


    Green walls offer several benefits, both aesthetic and functional (Cuce, 2017):


    +   * **Aesthetic Enhancement**: Green walls add natural beauty and visual appeal
    to spaces, softening hard architectural lines and creating a soothing and inviting
    atmosphere.'
