  md: '# **9/11 MEMORIAL PLAZA, NEW YORK CITY**


    9/11 Memorial Plaza in New York City is an 8-acre public space that connects the
    iconic buildings of the complex, including One World Trade Center, the tallest
    skyscraper in the Western Hemisphere. The plaza features a memorial to the victims
    of the 9/11 attacks, a museum, a performing arts center, and a transportation
    hub. It is designed to be a vibrant and welcoming place for visitors, workers,
    and residents, offering green spaces, art installations, and cultural events throughout
    the year. The 9/11 Memorial & Museum is the primary institution in the United
    States dedicated to exploring, documenting, and examining the impact of 9/11,
    with a focus on honoring those killed in the attacks (9/11 Memorial).


    9/11 Memorial Plaza occupies the area between One World Trade Center (the prime
    tower) and the surrounding buildings within the World Trade Center complex. It
    spans several city blocks, bounded by West Street to the west, Liberty Street
    to the south, Church Street to the east, and Vesey Street to the north. The plaza’s
    design was led by architect Daniel Libeskind, with landscape architect Peter Walker
    contributing to landscaping. The overall design reflects a spirit of renewal and
    remembrance, paying homage to the original Twin Towers while creating a modern
    and resilient space (Parakh et al., 2017).


    The plaza incorporates extensive landscaping, including trees, shrubs, and grassy
    areas. The designers aimed to create a peaceful and inviting environment for visitors,
    with carefully curated plantings that provide shade, beauty, and a connection
    to nature amid the urban landscape. The centerpiece of the plaza is the Memorial
    Reflecting Pools, which are located within the footprints of the original Twin
    Towers. These vast one-acre, square-shaped pools feature cascading waterfalls
    along the sides, creating a serene and contemplative atmosphere (9/11 Memorial).


    The pools have North America’s most expansive artificial cascades, each dropping
    30 feet into a square reservoir. Subsequently, the water in every pool descends
    a further 20 feet and vanishes into a more compact, central cavity. As per architect
    Michael Arad, the ponds symbolize the concept of “visible absence.” While water
    enters the empty spaces, they cannot be filled entirely. The auditory experience
    of the flowing water creates an atmosphere of serenity and deep thought, distinct
    from the bustling urban soundscape.


    The memorial pools are bordered by bronze parapets that bear the names of the
    2,983 individuals who lost their lives in the terrorist attacks of 2001 and 1993.
    The names are categorized based on the locations and circumstances where the victims
    were situated during the attacks. The North Pool parapets bear the names of individuals
    who lost their lives in the North Tower, on hijacked American Airlines Flight
    11, and in the 1993 bombing. The South Pool parapets bear the names of both first
    responders and victims who lost their lives in the South Tower, on hijacked United
    Airlines Flight 175, at the Pentagon, on hijacked American Airlines Flight 77,
    and on hijacked United Airlines Flight 93 (9/11 Memorial); (Figure 3.18).'
