    * Develop a maintenance and management plan to ensure the long-term sustainability
    and attractiveness of the sky park or garden.

    * Consider the required maintenance tasks, including pruning, irrigation, and
    regular inspections.

    * Collaborate with building management or external partners to establish ongoing
