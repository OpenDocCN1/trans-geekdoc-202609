    # *Park’s Rules*


    Among the salient restrictions are: No Smoking. No Bicycles. No Pets. No Drinking
    Alcohol. No Skateboards, Skates, or Recreational Scooters. However, the complete
    list is displayed in Figure 10.5.


    # *Membership*


    Members contribute almost 90% of the High Line’s annual operating support. Friends
    of the High Line relies on its members to employ personnel responsible for maintaining
    the park’s cleanliness, tending to the plant life, and developing activities and
    artwork to captivate visitors. Members receive the biannual High Line Magazine,
    exclusive event invitations, discounts at local businesses, and other privileges.


    # HIGHLIGHTS


    # *Positive Aspects*


    +   • **Green Space in an Urban Environment**: The High Line offers a much-needed
    green area in the middle of New York City’s congested, tall buildings. It is a
    linear park built on a former elevated railway track, bringing nature and greenery
    to an otherwise concrete-dominated environment. The park features a variety of
    plants, trees, and flowers, creating a serene and refreshing atmosphere for visitors.


    +   • **Pedestrian-Friendly Space**: The High Line offers a pedestrian-friendly
    pathway above street level by repurposing the elevated railway tracks. It allows
    people to explore the city from a different perspective, away from the noise and
    traffic of the streets. The design of the High Line incorporates seating areas,
    gathering spaces, and overlooks, providing opportunities for relaxation and social
    interaction.


    +   • **Cultural and Artistic Elements**: The High Line includes murals, sculptures,
    and public art installations. These creative elements enhance the city’s cultural
    fabric and add visual appeal. The park frequently hosts temporary art exhibitions,
    performances, and educational programs, enriching the cultural experience for
    visitors.'
