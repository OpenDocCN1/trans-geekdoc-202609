    # HANGZHOU GRAND THEATER (THE MOON)


    Hangzhou Grand Theater, built in the newly established Hangzhou Central Business
    District, is located across from InterContinental Hangzhou and adjacent to the
    river. The municipality has devised a comprehensive strategy to eventually incorporate
    a convention center, a new municipal building, and a sizable shopping mall. The
    city plans to establish a new commercial hub, separate from the downtown district
    along West Lake, connected by a newly constructed boulevard, offering land for
    new construction projects.


    The Hangzhou Grand Theatre, designed to resemble a sculpture, is the main cultural
    establishment in the capital city of Zhejiang Province. The moon-shaped building,
    characterized by intricate double-curved glass facades and a titanium roof, includes
    the surrounding green space inside its design, resembling a pearl within its oyster
    shell. The facility includes an Opera Hall with a seating capacity of 1,600 in
    an inverted conical shape, a Concert Hall with a seating capacity of 600, a Theatre
    with a seating capacity of 400, and a rooftop Chinese restaurant open 24 hours
    a day. The restaurant offers views of the outdoor amphitheater and the river.
    The venue features adaptable flooring, walls, ceilings, and acoustic materials,
    enabling performances of both Eastern and Western repertoires and special lighting
    effects to synchronize activities. The project was completed in 2004 (Al-Kodmany,
    2017; Liu et al., 2011).


