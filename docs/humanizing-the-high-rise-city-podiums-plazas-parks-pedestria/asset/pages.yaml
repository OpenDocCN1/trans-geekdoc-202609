    # FLAMINGO SCULPTURE, CHICAGO


    The Flamingo Sculpture in Chicago is an engaging and captivating artwork that
    captures the attention and imagination of viewers. Created by the renowned American
    artist Alexander Calder (1898–1976), this sculpture stands as a prominent feature
    in the Federal Plaza, captivating passersby with its striking design and vibrant
    presence. The Flamingo Sculpture’s engaging nature is evident in its unique form
    and composition. Calder’s artistic vision comes to life through the sculpture’s
    dynamic lines, curves, and bright red color (Figure 14.4). The abstract representation
    of a flamingo evokes a sense of movement and vitality, inviting viewers to interpret
    and engage with the artwork from different perspectives. Situated in a prominent
    location in front of the Klucznyski Federal Building, the Flamingo Sculpture serves
    as a visual anchor in the urban landscape of Chicago. Its towering height (53-ft
    [16 m] tall) and commanding presence create a sense of awe and curiosity, drawing
    people in to explore its intricacies and appreciate its artistic craftsmanship.
    As visitors interact with the Flamingo Sculpture, they are encouraged to contemplate
    its form, engage with its vibrant colors, and consider the interplay between art
    and the surrounding architecture. The sculpture introduces a captivating juxtaposition
    to Mies van der Rohe’s architectural design, known for its disciplined orthogonal
    lines and dark facades. Mies van der Rohe, a pioneer of modernist architecture,
    was renowned for his minimalist approach, emphasizing clean lines and a restrained
    color palette. In contrast, the sculpture injects a dynamic and vibrant palette
    into the surroundings. This iconic artwork, commissioned by the United States
    General Services Administration, has been a prominent fixture since its unveiling
    in 1974 (Marter, 1979).'
