    At their essence, urban rooms aspire to be more than just well-defined and specialized;
    they aim to be unique and inviting urban public spaces. This design philosophy
    harmonizes with the notion that these outdoor environments should be experienced
    and cherished by the city''s inhabitants in a manner akin to appreciating various
    rooms within their homes. The deliberate incorporation of varied activities, attention
    to perceptual details, and a focus on human scale collectively define urban spaces,
