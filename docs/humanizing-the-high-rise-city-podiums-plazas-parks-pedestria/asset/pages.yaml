    This concept signifies a departure from conventional park design, embracing a
    nuanced and purposeful approach to urban planning. By prioritizing the creation
    of spaces that are not only functional but also engaging and meaningful, urban
    rooms reshape the urban fabric, fostering dynamic, interconnected, and lively
    environments for individuals to explore, experience, and appreciate in their daily
    lives (Al-Kodmany, 2020b).


    # MILLENNIUM PARK, CHICAGO


    Millennium Park, spanning 24.5 acres in downtown Chicago, Illinois, is a testament
    to urban transformation, converting a former rail yard and parking lot into a
    dynamic urban oasis. This farsighted project not only repurposes land but also
    realizes Daniel Burnham''s century-old vision for a grand civic space along the
    lakefront, as documented by Gilfoyle in 2006. The site''s history intertwines
    with the Illinois Central Railroad, which utilized the land since 1852, exchanging
    it for building a protective breakwater along the shore. In the mid-1900s, a section
    evolved into a parking lot until the initiation of park construction in 1997.
    Millennium Park officially opened in 2004, becoming a celebrated attraction and
    a defining feature of Chicago''s urban identity, blending history, visionary design,
    and civic engagement in a harmonious tapestry of urban revitalization (Al-Kodmany,
    2020a).


    The park is a remarkable urban oasis that offers diverse attractions, including
    stunning artworks, elegant pavilions, lovely gardens, and seasonal exhibitions.
    These attractions appeal to different senses and create a contrast with the dense
    downtown area. One of the most striking aspects of this area is the smooth transition
    from the skyscraper-filled surroundings to the spacious green area with rich vegetation,
    vendors, music, and, most importantly, people. The park is open and free of charge
    for everyone, attracting people of various ages, ethnicities, and languages who
    come to enjoy the public, the art, and the social activities within the space.
    Visually, the city''s skyline (two intersecting rows of impressive skyscrapers
    forming an L-shaped edge) frames the park and serves as a magnificent backdrop.
    Moreover, the park''s artworks, such as the Crown Fountain and'
