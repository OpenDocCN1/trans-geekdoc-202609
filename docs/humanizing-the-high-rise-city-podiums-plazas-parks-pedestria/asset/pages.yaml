  md: '# *Vietnam Veterans Memorial*


    Chicago''s Vietnam Veterans Memorial, completed in 2005 and situated between Wabash
    and State streets, stands as a poignant tribute to the fallen heroes of the Vietnam
    War. This expansive memorial encompasses multiple tiers adorned with water features,
    including a soothing waterfall and a fountain embellished with 14 jets. A significant
    aspect of the memorial is a long granite slab along the waterfall, bearing the
    engraved names of all Illinois Vietnam War veterans who made the ultimate sacrifice.
    Notably, this memorial ranks among the largest Vietnam War Memorials outside Washington,
    DC.


    The design of the Vietnam Veterans Memorial is intentionally secluded from the
    bustling city streets, creating a serene and contemplative refuge amid the urban
    landscape. The abundance of greenery and thoughtful landscaping contribute to
    the tranquility of the space. Despite its quiet ambiance, the memorial is frequented
    by pedestrians, joggers, and photographers drawn to its unique blend of natural
    elements and urban vistas (Al-Kodmany, 2017; Chicago Riverwalk; Kamin, 2022a).


    The grassy areas adjacent to the Chicago River emerge as popular gathering spots,
    where visitors can relish the scenic views while finding respite from the city''s
    hustle and bustle. Informal concrete sitting ledges provide convenient spots for
    people-watching, as the constant flow of pedestrians along the river adds to the
    dynamic urban experience. These sitting spaces offer a vantage point for admiring
    the memorial, the river, and the skyline and evoke a sense of connection to a
    more natural environment within the heart of the city (Figure 9.3).


    # *Phase 2*


    Phase 2 extends from State Street to LaSalle Street. Completed in 2015, it contains
    three “urban rooms,” a concept coined and promoted by Daniel Burnham and Edward
    H. Bennett in their Chicago 1909 Plan (See Chapter 7). In the context of the Chicago
    Riverwalk, each urban room spans 300 feet (91 meters) along the river and features
    a distinct river-inspired theme. These rooms are also bordered by iconic, historic
    bridges, which promote a strong sense of visual enclosure and placemaking. The
    second phase involved the creation of three urban rooms, including Marina Plaza,
    The Cove, and The River Theater (Al-Kodmany, 2021; Chicago Riverwalk).


