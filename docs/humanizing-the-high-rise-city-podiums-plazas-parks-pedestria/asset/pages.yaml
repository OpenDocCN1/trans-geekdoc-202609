- pgno: 238
  md: '# Elevated Parks


    a harmonious balance between nature and urban development. They can also offer
    panoramic views of the city skyline, providing a unique vantage point for residents
    and tourists.


    +   12. **Stromwater Management:** Rooftop parks can aid in managing stormwater
    run off. Vegetation absorbs rainwater, reducing the strain on drainage systems
    and minimizing the risk of flooding during heavy rainfall. They improve stormwater
    management by retaining and filtering rainwater.


    +   14. **Economic benefits:** The establishment and maintenance of these parks
    help stimulate the economy and generate employment opportunities for residents.
    Also, surrounding areas can benefit from elevated parks. Increased foot traffic
    and economic activity result from their ability to attract visitors, tourists,
    and businesses.


    # THE HIGH LINE, NEW YORK CITY


    The High Line is a New York City Park maintained and supported by Friends of the
    High Line. It is a public park built on a historic freight rail line above Manhattan''s
    West Side Street. It spans approximately 1.5 miles (2.4 kilometers) and runs through
    the Chelsea and Meatpacking District neighborhoods, offering panoramic city views,
    art installations, gardens, and gathering spaces. The High Line is a model of
    urban renewal and sustainability, as it preserves the area''s industrial heritage
    and features native plants and wildlife habitats. It offers visitors a unique
    perspective of the city, its architecture, and various art installations, events,
    and programs throughout the year. In its first full year of operation in 2010,
    the park welcomed approximately 2 million visitors. The numbers continued to rise,
    and by 2019, it was reported that the High Line had attracted over 8 million visitors.
    This figure has been sustained or even increased in recent years. Through its
    integration of green space, pedestrian-friendly design, cultural elements, community
    engagement, and unique viewpoints, the High Line humanizes the high-rise city
    of New York. It creates a harmonious balance between nature and urbanity, providing
    a welcoming and enriching experience for residents and visitors alike (Avni, 2019;
    Littke et al., 2016; Park & Lee, 2019).


    # BACKGROUND AND HISTORY


    The High Line''s history dates to the early 20th century when it was initially
    built as a freight rail line known as the West Side Elevated Line. The railway
    served the industrial and manufacturing district of the area, transporting goods
    between factories, warehouses, and the waterfront. Construction of the High Line
    began in 1929, and the first section of the elevated railway opened in 1934. The
    railway was designed to elevate the trains above street level, alleviating traffic
    congestion and improving safety for both pedestrians and trains. It operated for
    several decades, but due to the rise of interstate trucking and a decline in rail
    traffic, the last train on the High Line ran in 1980 (Al-Kodmany, 2018; Sim et
    al., 2019).'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'After the railway ceased operation, the elevated structure faced an uncertain
    future. There were discussions about demolishing the structure. However, residents
    and community activists recognized its potential as a unique public space and
    advocated for its preservation and repurposing. In 1999, Friends of the High Line
    advocated converting the abandoned railway into a public park. They envisioned
    transforming the elevated structure into a green space providing recreational
    opportunities, promoting urban renewal, and preserving the neighborhood’s historic
    character (Park, 2019).


    Through years of advocacy, fundraising, and collaboration with city officials,
    the first section of the High Line was opened to the public in 2009. The design
    of the High Line is a joint effort involving James Corner Field Operations as
    the project lead, together with Diller Scofidio + Renfro and Piet Oudolf. They
    designed the park to retain the industrial aesthetic of the railway while incorporating
    natural elements, landscaping, seating areas, and unique design features. The
    success of the initial section led to the development of subsequent phases, with
    the final section of the High Line completed in 2023. Overall, the project involved
    a multidisciplinary team that combined the expertise of architects, landscape
    architects, urban designers, and horticulturists. The design team worked closely
    with the City of New York and community stakeholders to create a unique and transformative
    elevated park experience (Littke et al., 2016).


    # KEY DATES


    The development of the High Line, an innovative urban park in New York City, unfolded
    through key dates that marked its transformation from a disused rail track into
    a celebrated green space, reshaping the city’s landscape (The High Line; Lindner
    & Rosa, 2017):


    +   - **1934.** The initial railway was established to transport a substantial
    quantity of meat, dairy, and produce, amounting to millions of tons.

    - **1980.** The cessation of train operations resulted in the abandonment of the
    railway tracks.

    - **1999.** Until then, the structure was at risk of being demolished. However,
    Joshua David and Robert Hammond started advocating for preservation and conversion
    to a public open area.

    - **2003.** The High Line organized an “ideas competition” and received 720 submissions
    from individuals in 36 different countries. These submissions proposed various
    ways in which the park could be utilized. Some ideas, such as a rollercoaster
    or a mile-long lap pool, were neither feasible nor practical.

    - **2009.** Following the establishment of Friends of the High Line a decade ago,
    the initial portion of the High Line, spanning from Gansevoort to 20th Streets,
    became accessible to the public.

    - **2011.** Section 2 was inaugurated, including the area between 20th and 30th
    Streets.

    - **2014.** The Rail Yards segment from 30th to 34th Streets was inaugurated.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '+   • **2019.** The Spur, the concluding segment of the ancient edifice, commenced
    operation.


    +   • **2023.** The new High Line—Moyhiran Connector opened in June. This new
    pathway, comprised of two intersecting bridges, allows visitors to move from anywhere
    on the High Line to Moyhiran Train Hall with only one street crossing.


    # PARK FEATURES


    The Highline’s key features include (The Highline; Lindner & Rosa, 2017; Little
    et al., 2016):


    +   1. **Tiffany & Co. Foundation Overlook** (At Gansevoort St.): This striking
    balcony signifies where the southern portion of the High Line was separated in
    the 1980s to accommodate the construction of residential units in the former Manhattan
    Refrigerating Warehouse. The location is situated east of the Whitney Museum of
    American Art and the headquarters of Friends of the High Line.


    +   2. **Donald Pels and Wendy Keys Gansevoort Woodland** (Between Gansevoort
    St. and 13th St.): During the summer, vines elegantly drape over the railings
    at this location, creating a vibrant curtain that may be seen by anyone passing
    by. Below is a red brick structure that serves as the last functioning meatpacking
    facility in the Meatpacking District. Directly to the north is a striking glass
    hotel, The Standard High Line.


    +   3. **14th Street Passage** (Between 14th St. and 15th St.): Each evening,
    beginning at twilight, within this partially covered pathway, one may discover
    an open-air TV program called the High Line Channel. This program showcases art
    videos, historical pieces, recent creations, and carefully selected series.


    +   4. **Diller-Von Furstenberg Sundeck & Water Feature** (Between 14th St. and
    15th St.): When the High Line was devoid of any activity and served as a vacant
    railway track, water would naturally gather at this location. This is precisely
    why the designers intentionally incorporated a discreet water element in this
    area. During the warmer months, this location is beloved by families and individuals
    of all ages, providing an opportunity to enjoy wading in the water.


    +   5. **Chelsea Market Passage** (Between 15th St. and 16th St.): This section
    of the High Line is situated on the previous site of the National Biscuit Company,
    also known as Nabisco, which Chelsea Market currently occupies. The Oreo cookie
    was developed at this location, using flour transported by trains along this route.
    From April to October, the food court is open-air.


    +   6. **Northern Spur Preserve** (At 16th St.): This spur traverses 10th Avenue
    to establish a connection with the old Merchants Refrigerating Warehouse. It represents
    the historical botanic aspect of the High Line, with crab apples, asters, sedges,
    goldenrods, and alumroot that evoke the untamed period before the park was accessible
    to the public.'
