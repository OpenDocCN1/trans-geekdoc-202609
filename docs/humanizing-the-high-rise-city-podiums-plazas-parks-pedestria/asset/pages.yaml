  md: '# **Shanghai Tower, Shanghai**


    The Shanghai Tower, a 632-meter (2,073-foot) skyscraper in Shanghai, China, is
    an iconic landmark with a distinctive design and impressive height and is the
    third-tallest building in the world. Designed by Gensler, the tower was constructed
    between 2008 and 2015. It serves multiple functions, such as office spaces, retail
    areas, hotels, and observation decks. Its unique twisting spiral form provides
    structural stability and reduces wind loads. The tower has 128 floors above-ground
    and 5 below-ground floors.


    The tower''s 118th-story observation deck offers a 360-degree panoramic viewing
    hall. A double-skin facade, rainwater collecting systems, wind turbines, and modern
    air filtration systems are some of the sustainable elements of the skyscraper.
    The Shanghai Tower symbolizes Shanghai''s modernization and economic development,
    making it a popular tourist attraction and a significant landmark in the city''s
    skyline (Binder, 2015).


    The sky gardens in the Shanghai Tower are a series of lush green spaces located
    at various heights within the building. These gardens serve as communal areas
    for relaxation, recreation, and socialization, offering stunning panoramic cityscape
    views. They are strategically positioned near common areas, such as restaurants,
    cafés, and event spaces (Al-Kodmany, 2018a).


    The design of the sky gardens draws inspiration from traditional Chinese gardens,
    incorporating elements such as water features, rocks, trees, plants, and shrubs.
    These green elements not only enhance the aesthetic appeal of the spaces but also
    improve air quality and reduce the building''s carbon footprint. The aim is to
    create a harmonious and serene environment that blends with the modern architecture
    of the tower.


    The sky gardens are designed to maximize natural lighting. Including large glass
    panels ensures ample daylight penetrates the spaces, reducing the need for artificial
    lighting during the daytime. This design approach promotes energy efficiency and
    creates a pleasant indoor environment (Figure 11.6).


    The Shanghai Tower''s sky gardens have been criticized for their restricted public
    access, scarce vegetation, and inadequate recreational facilities. The tower is
    a notable feature of the cityscape, but the sky gardens are mainly intended for
    building tenants and guests, limiting public appreciation. The scarce vegetation
    may reduce the quality and expected advantages of a garden-like setting. Although
    the sky gardens offer magnificent city vistas, they lack practical use beyond
    giving visual enjoyment. This limitation hinders their effectiveness for activities
    such as work, leisure, or social interactions (Binder, 2015).


    # **GREEN WALLS**


    Green walls, also known as living walls or vertical gardens, are architectural
    features that consist of vegetation growing vertically on a structure, such as
    a wall or a façade. These walls are intentionally designed to incorporate plants
    and greenery, creating a natural and vibrant display within indoor or outdoor
    spaces.'
