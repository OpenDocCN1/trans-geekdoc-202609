    # BOSCO VERTICALE, MILAN


    Bosco Verticale (Vertical Forest) is a pioneering example and the epitome of the
    greenery-covered high-rise building model. Its boldness, significant height, and
    extensive greeneries have promoted this project among the most remarkable. Nestled
    in Milan, Italy, Bosco Verticale consists of two residential towers renowned for
    seamlessly incorporating an abundance of plants and trees into their design. The
    visionary architecture is credited to the esteemed firm Stefano Boeri Architetti.
    The design was inspired by the traditional ivy-covered buildings in Italy but
    multiplied to create a living facade that absorbs CO $_{2}$, reduces energy consumption,
    and protects against noise and radiation. Bosco Verticale is a landmark of green
    design that demonstrates the possibility of integrating nature and urbanism harmoniously
    (Belcher et al., 2018; Flannery et al., 2015; Boeri & Insulza, 2010; Ishween,
    2021; Varro, 2017).


    # Architectural Design


    Bosco Verticale comprises two towers measuring 80 meters and 112 meters in height,
    respectively. The towers have a unique shape with a graceful profile. They feature
    a contemporary design aesthetic, incorporating clean lines and a combination of
    glass, spacious balconies, and concrete elements. The defining feature of Bosco
    Verticale is the numerous balconies protruding from the facade of each tower.
    Crafted to cultivate a “vertical forest” ambiance, the balconies of Bosco Verticale
    exhibit diverse sizes and configurations, enriching the overall architectural
    composition with visual intrigue and dimension. The towers are'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'designed with sustainability in mind. They include rainwater harvesting systems,
    photovoltaic panels for solar energy generation, and high-performance building
    envelopes to enhance energy efficiency. The integration of greenery also contributes
    to improved air quality and insulation (Flannery et al., 2015; Ishween, 2021;
    Varrato, 2017).


    # Plant and Tree Integration


    The selection of plant species for Bosco Verticale was carefully considered to
    ensure the vitality and sustainability of the vertical forest. The chosen plants
    include various trees, shrubs, and other vegetation suited to the local climate.
    The selection prioritizes species with unique root systems, adaptability to urban
    environments, and resistance to wind and pollution. The balconies of Bosco Verticale
    accommodate a different selection of plants, creating a diverse and visually dynamic
    facade. The two skyscrapers are adorned with various deciduous plants, such as
    beeches, yellow acacias, oaks, maples, ash trees, ferns, and ivy, in addition
    to the evergreen species. The trees are strategically placed at various heights,
    with taller trees on the lower floors to provide residents privacy and maximize
    visual impact. Light exposure, wind patterns, and artistic composition are some
    considerations that went into the intentional distribution of the plants throughout
    the balconies. The trees are supported by a complex system of structural elements
    and specially designed planters (Belcher et al., 2018; Boeri & Insulza, 2010).
    The ultimate configuration creates a lush and layered effect, resembling a natural
    forest ecosystem or a vertical forest (Figure 12.1).


    The ongoing maintenance and care of the plants and trees in Bosco Verticale are
    critical to their longevity and vitality. A dedicated team of horticulturists
    and experts oversees the regular pruning, watering, and fertilization of the vegetation.
    Careful monitoring and management ensure that the greenery remains healthy and
    well-maintained.


    # Awards and Recognition


    Since its completion, Bosco Verticale has received several recognitions, certifications,
    and awards for its innovative and sustainable design, including:


    +   - The 2014 International Highrise Award

    - The 2015 Best Tall Building Worldwide by the Council on Tall Buildings and Urban
    Habitat (CTBUH)

    - The 2018 Emporis Skyscraper Award


    Overall, the architectural design and plant integration in Bosco Verticale aims
    to create a harmonious and sustainable living environment. The towers'' unique
    form, combined with the extensive presence of vegetation, contributes to the aesthetic
    appeal, ecological value, and overall well-being of the residents and the surrounding
    urban context.'
