    # **500 West Madison, Chicago [1987]**


    500 West Madison, also known as the Citigroup Center, is a 42-story, 179-meter
    (588-foot) tower in downtown Chicago, Illinois. The mixed-use tower has 1,400,000
    square feet of floor space and houses offices and a two-story shopping mall. The
    second floor connects to a commuter railroad station, the Northwestern Station,
    which serves the north and west suburbs. An enclosed skywalk connects the station
    level to the neighboring North Riverside building. The Citigroup Center was completed
    in 1987 and is a remarkable all-glass building in Chicago (Figure 2.10).


    Helmut Jahn designed the building in a Late Modernist/Postmodernist style, blending
    contemporary elements with innovation in architecture. The design features a mesmerizing
    cascading waterfall curtain wall with bluish reflective glass. Consequently, despite
    its considerable size, the tower''s tapered profile plays a crucial role in its
    urban integration, preventing it from overpowering the surrounding area. This
    intentional design choice ensures that the Citigroup Center harmonizes with its
    context, contributing to the overall urban experience and enhancing human-scale
    interaction within the vibrant cityscape (Jahn, 2015; Saliga & Clarke, 1998).
    From this perspective, the cascading waterfall curtain wall design of 500 West
    Madison resembles the tapering profiles of the Thompson Center (discussed earlier)
    by improving the connection to the streetscape and enhancing the relationship
    with the human scale (Al-Kodmany, 2020).


    The waterfall effect metaphorically connects the tower to the nearby Chicago River.
    Therefore, the design establishes a meaningful and evocative relationship between
    the Citigroup Center and its urban context. By metaphorically connecting to the
    Chicago River, the tower becomes more than just a physical structure; it becomes
    a part of the broader narrative and identity of the city, contributing to the
