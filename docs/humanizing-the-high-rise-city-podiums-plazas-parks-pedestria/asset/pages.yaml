  md: '# ■ Waterfront Parks


    # DIVERSITY OF ACTIVITIES


    The design of the path introduces creative land-water typologies, seen in its
    sections, such as Marina Plaza, Cove, River Theater, Water Plaza, Jetty, and Riverbank.
    The design and spatial layout vary, so each room has a distinct identity, while
    each space offers different functionalities and experiences. Further, the McCormick
    Bridgehouse & Chicago River Museum and the Vietnam Veterans Memorial serve educational
    and cultural purposes. Overall, along the path, people engage in various social
    activities such as walking, chatting, relaxing, jogging, running, eating, dining,
    drinking, photographing, sightseeing, and fishing. Also, some visitors perform
    yoga and work out. Other people could be seen biking (or walking the bikes), scooting,
    hoverboarding, or Segwaying. Visitors can enjoy boating, kayaking, canoeing, cruising,
    and joining architectural and recreational tours on the river. One can also observe
    various recreational boat types, such as yachts, power boats, and personal boats,
    including rowboats, canoes, kayaks, and paddleboards (Cotton, 2018).


    # SOCIOCULTURAL BENEFITS


    Notably, accessing the river’s social, cultural, and educational activities and
    gathering places is free. Consequently, the Riverwalk attracts many people, including
    residents, local and global visitors, business owners, professionals, and public
    officials. Accessible public spaces promote inclusivity, and the mixed crowd that
    the Riverwalk attracts reflects Chicago’s cultural values of equality and diversity.
    Among the most beautiful feelings visitors experience is sharing space and experiences
    with people from all walks of life. Their combined presence creates a vibrant
    downtown and engenders solid social bonds and an enduring sense of belonging (Al-Kodmany,
    2021; Elliott, 2010).


    # WALKING BENEFITS


    The Riverwalk encourages people to engage in a healthy habit: walking! Walkable
    cities are increasingly desirable (See Chapter 13). Overall, emphasis on walking
    prevails for numerous reasons, such as health benefits, social interaction, environmental
    well-being, and energy savings, to name a few. Dan Burden, an expert on walkability,
    makes a good point,


    > Walkability is a word that did not exist just 20 years ago. We made walking
    so unnatural that we had to invent a word to describe what we were missing. .
    . . Essentially, walkability is allowing people to do what the human body was
    designed to do in the first place: to go places without having to get into some
    mechanical instrument.

    (Burden, 2014)


    Walking is the simplest form of exercise; people are pedestrians by design. In
    his book *Walkable City: How Downtown Can Save America One Step at a Time*, urbanist
    Jeff Speck (2013, p. 38) poetically explains the importance of walking'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'by stating: “As a fish needs to swim, a bird to fly, a deer to run, we need
    to walk, not to survive, but to be happy.” A daily walking routine of 20 minutes
    can prevent heart disease, diabetes, depression, and some cancers (Elliott, 2010).


    # Economic


    The Riverwalk project has converted the area into a vibrant entertainment hub,
    drawing in vendors, businesses, and visitors. Since its opening, the number of
    vendors has doubled, and their businesses have significantly improved. The increased
    number of visitors has increased parking revenue, and collected fees from boat
    docking and vendors have also increased. This has supported existing jobs and
    created new ones, with the project resulting in 66 permanent, 170 seasonal, and
    125 part-time jobs from 2016 to 2019. Additionally, the project has increased
    property value and the City’s property tax base, enhanced Wacker Drive’s marketability,
    and attracted top employees and companies (Al-Kodmany, 2023; Cotton, 2018).


    The project has catalyzed a substantial influx of economic development, resulting
    in a noteworthy increase in hotel bookings, retail sales, contributions to local
    businesses, and income tax revenues. The project has collected over $16 million
    in just six years to repay the $99-million federal loan granted for the second
    and third phases (Cotton, 2018). The project’s costs are relatively reasonable,
    estimated at hundreds of millions of dollars, compared to surrounding skyscrapers
    such as Trump Tower, River Point, and 150 North Riverside.


    # Environmental


    The Riverwalk project aims to improve the environmental well-being of the Chicago
    River by promoting the recovery and restoration of on-land and in-stream habitats.
    By reintroducing native trees, plants, and grasses, water quality has been enhanced,
    attracting local fish, birds, turtles, and muskrats. This process encourages aquatic
    land animals to help remove toxins from the river through their natural habits.
    Several bird species have been invited, including mallards, ring-billed, house
    sparrows, herring gulls, rock pigeons, American robins, European starlings, and
    peregrine falcons (Movahedzadeh et al., 2015).


    The Riverwalk project also includes floating eco-gardens, or floating wetland
    islands, which reintroduce plant species native to Illinois wetlands and prairies.
    These plants have intimate, symbiotic interactions with the river water, increasing
    their function of cleansing water and nourishing plants. The floating eco-gardens
    also reduce nitrogen and phosphorus levels in the river, attracting fish and land-water
    animals like turtles (Al-Kodmany, 2020; Movahedzadeh et al., 2015).


    The Riverwalk project has contributed to sensible ecological improvement in the
    river, with the Floristic Quality Index (FQI) increasing from 0 to 38.2 in an
    area of 19,529 square feet (1,814 square meters). The floating gardens also serve
    as an outdoor classroom for learning about fish, fauna, and critters, encouraging
    people to consider the importance of their natural and ecological functions. Public
    programming along the Riverwalk promotes environmental awareness of'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'climate change, flooding resiliency, and sustainable design (Al-Kodmany, 2017;
    Mowedhzadeh et al., 2015).


    While the Chicago Riverwalk is celebrated for its positive contributions to the
    city, there are also some social, economic, and environmental downsides associated
    with the development:


    # Social


    +   * The popularity of the Chicago Riverwalk has led to congestion during peak
    times, potentially diminishing the experience for visitors and residents.

    * Accessibility challenges, especially for individuals with mobility issues, may
    limit inclusivity and equal enjoyment of the space.

    * Chicago’s harsh winters can limit the usability of the Riverwalk during colder
    months, reducing the social benefits for a significant portion of the year.


    # Economic


    +   * Maintaining the Riverwalk’s infrastructure, landscaping, and amenities requires
    ongoing investment. Balancing maintenance costs against the economic benefits
    can be challenging, particularly during economic downturns.

    * The economic benefits of the Riverwalk are not evenly distributed. Some businesses,
    particularly those with prime locations, may thrive while others struggle. This
    can lead to commercial exclusivity, with only certain businesses being economically
    viable in the area.

    * The success of the Riverwalk might draw foot traffic away from other nearby
    businesses that do not directly benefit from the increased tourism, potentially
    impacting their revenue.


    # Environmental


    +   * The construction and maintenance of the Riverwalk infrastructure may have
    ecological consequences, such as alterations to the natural riverbank habitats
    and potential disruption to local wildlife.

    * Increased human activity along the river may contribute to water pollution,
    with litter and runoff potentially affecting the quality of the Chicago River.
    Balancing development with environmental preservation is crucial for the long-term
    health of the river ecosystem.

    * The Riverwalk’s amenities, lighting, and other features may contribute to increased
    energy consumption. Ensuring the sustainability of these elements and incorporating
    eco-friendly practices is essential to mitigate the environmental impact of the
    development.


    # KEY TAKEAWAYS: PLANNING AND DESIGN PRINCIPLES


    The Chicago Riverwalk is a remarkable example of successfully retrofitting an
    aging, underutilized waterfront. The project transformed the previously neglected
    and industrialized banks of the Chicago River into a vibrant public space that
    has'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'become a popular destination for residents and visitors. Here are some key
    factors that contribute to the success of the Chicago Riverwalk:


    +   1. **Partnerships and Community Engagement:** Revamping aging urban infrastructure
    requires serious collaboration and an earnest commitment by local, state, and
    federal governments and community-based organizations, individuals, businesses,
    and institutions.


    +   2. **Persistence:** River infrastructure projects take a long time to study,
    redesign, and implement. From vision to completion, the Chicago Riverwalk project
    took over 25 years. During a quarter century, there were moments of frustration
    and giving up. However, persistence and perseverance have helped keep this project''s
    momentum (Kamin, 2022a). Even after completion, planning and design efforts to
    upgrade it continue.


    +   3. **Urban Rooms:** The urban room concept (See Chapter 7) helps break vast
    spaces into smaller ones that fit human scale and senses. It also helps create
    multiple destinations along the river, offering visitors more choices and enriching
    their experiences with layered, diverse activities. As such, the “Urban Room”
    concept, although was proposed a century ago, retains its valuable applications
    to today''s cities.


    +   4. **Continuity and Connectivity:** While the urban room concept proved effective,
    some factors are needed to support it, including continuity and connectivity.
    A “pedestrian spine” that threads through these urban rooms will enable visitors
    to reach their destinations quickly. The Chicago Riverwalk serves as a “connective
    tissue” that seamlessly connects pedestrians with sidewalks, stairways, and elevators
    (for the handicapped) and links to neighboring activities, communities, and the
    city at large. Continuous public access and uninterrupted paths entice more people
    to walk along the river and visit urban rooms (Movahhadedeh et al., 2015).


    +   5. **Right Location:** What has also contributed to the connectivity of the
    Chicago Riverwalk is being in the epicenter of Chicago Downtown. As such, in addition
    to providing amenities and entertaining facilities, it serves as a transport conduit
    connecting many different parts, activities, and downtown transportation nodes.
    It has supported a multimodal transport model, which Chicago has worked on for
    the last two decades.


    +   6. **Intimacy with Water:** It would be more interesting if visitors could
    interact with the river''s water. The Chicago Riverwalk allows visitors to do
    many activities, including fishing, canoeing, docking, boarding boats, sitting,
    relaxing, dining, drinking, picnicking, and feeding the ducks. It also has a water
    plaza that allows children to play with water. However, water quality is hoped
    to improve so visitors can touch the water with their hands, dip their feet, and
    even swim in the river.


    +   7. **Extending Operation Hours:** The Chicago Riverwalk operates from 6 a.m.
    to 11 p.m. Since it enjoys a central location in the city and connects many activities
    downtown, it could benefit from extending its hours of operation.'
