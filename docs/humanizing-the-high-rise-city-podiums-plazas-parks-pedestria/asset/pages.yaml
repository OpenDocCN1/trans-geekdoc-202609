    # HANGZHOU CIVIC CENTER


    Hangzhou Civic Center in Hangzhou, China, consists of six trapezoidal 26-floor
    towers connected via five 85-meter (279-foot) sky bridges. They cluster around
    a central public garden surrounded by four low-rise podiums. Initially, the client
    wanted to build a single supertall building of 300 meters (984 feet). However,
    the project architect persuaded the client to replace that with multiple shorter
    connected towers. This arrangement of shorter buildings has fostered a more human
    scale while functioning as the visual terminus to a pedestrian axis, making the
    complex a unique landmark in the city. A pair of sister buildings also flank the
    Hangzhou Civic Center, the Hangzhou International Convention Center (The Sun),
    and the Hangzhou Grand Theater (The Moon). The project was designed by Tongii
    Architectural Design Group and completed in 2012 (Al-Kodmany, 2017; Parker & Wood,
    2013).'
