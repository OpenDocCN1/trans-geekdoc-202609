    Dvorak & Drennan, 2021). The park improves mood, supports health and well-being,
    and enhances educational opportunities.


    Visitors report feeling happy and learning something while visiting, with 68%
    stopping for 33 seconds to read interpretive signs. The park also reduces noise
    levels by .06 to 7.65 decibels compared to the street level, reducing the sounds
    of the city. Additionally, the park contributes to an assessed property value
    of $51,000 higher on average or $40 more per square foot for condos with views
    of Salesforce Park compared to similarly sized condos overlooking the street (Al-Kodmany,
    2022; Dvorak & Drennan, 2021). Overall, Salesforce Park is a significant environmental
    and social asset to the neighborhood and the city of San Francisco (Figure 11.4).


    Nevertheless, Salesforce Park faces some challenges. The park''s innovative architecture,
    lush vegetation, and eco-friendly features come at a high cost, which may burden
    the public with increased taxes or fees. The park''s greenery and landscaping
    also demand constant maintenance and care to ensure the vitality and beauty of
    the trees, plants, and grass. The park''s small active recreation area, absence
    of large open spaces, and central location can result in less usability, making
    it less appealing. Moreover, the park provides little sheltered areas; therefore,
    inclement weather, such as rain or strong winds, can limit the enjoyment of the
    park and restrict activities (Dvorak & Drennan, 2021).


    # 20 Fenchurch Street, London


    20 Fenchurch Street is a skyscraper located in the financial district of London,
    United Kingdom. It was completed in 2014 and stands at a height of 160 meters
    (525 feet) with 37 floors. The building was designed by Uruguayan architect Rafael
    Viñoly and developed by Land Securities and Canary Wharf Group. It is primarily
    an office building home to various businesses and organizations. The building
    was nicknamed "the Walkie-Talkie" due to its concave structure and reflective
