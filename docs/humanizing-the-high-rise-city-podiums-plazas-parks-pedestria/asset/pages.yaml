    # Marina Bay Sands, Singapore


    Marina Bay Sands is a world-renowned integrated resort in Singapore, designed
    by architect Moshe Safdie and owned by the Las Vegas Sands Corporation. With over
    2,500 rooms and suites, the hotel rooms offer stunning views of the bay. Guests
    can access various facilities, including a fitness center, spa, swimming pool,
    and various entertainment options, including the Sands Theatre, Grand Theatre,
    ArtScience Museum, and The Shoppes at Marina Bay Sands. The casino, one of the
    largest and most luxurious in the world, offers a wide array of table games, slot
    machines, and electronic gaming machines. The resort offers extensive dining options
    (Safdie, 2011; Rowe et al., 2019).


    The SkyPark is one of the most remarkable features of Marina Bay Sands. It is
    a 340-meter-long and 40-meter-wide structure that connects the resort’s three
    towers at a height of 200 meters. It resembles a giant surfboard resting on the
    towers, creating a striking contrast with the Singapore skyline. The SkyPark is
    more than just a visual spectacle. It is also a green sanctuary with landscaped
    gardens, jogging trails, and an infinity pool that offers breathtaking views of
    the city. The SkyPark also boasts fine dining and drinking options that cater
    to different tastes and preferences. It is a versatile venue that can host various
    events, such as concerts, exhibitions, and private parties. At night, visitors
    can enjoy the dazzling light and sound shows at Gardens by the Bay, which creates
    a mesmerizing ambiance (Bourg-Meyer et al., 2018). The resort’s unique architecture,
    as well as curved and cantilevered SkyPark, create a dramatic visual impact against
    the Singapore skyline (Figure 11.1).


