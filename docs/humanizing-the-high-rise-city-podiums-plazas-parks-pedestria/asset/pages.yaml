    +   8. **Public Programs.** The Chicago Riverwalk engages in public programs,
    including educational, cultural, and recreational. It also hosts some seasonal
    activities, for example, the dyeing green of the river in honor of St. Patrick''s
    Day. However, it is recommended that additional public programs that invigorate
