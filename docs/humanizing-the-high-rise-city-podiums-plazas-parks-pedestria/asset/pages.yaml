    # JING''AN TEMPLE PLAZA, SHANGHAI


    Jing''an Temple, situated in the bustling downtown center of Shanghai at West
    Nanjing Road, Jing''an District, is renowned as one of the city''s most prominent
    temples. Predating the establishment of Shanghai, the Jing''an Temple is currently
    recognized as one of the most prominent religious sites in this Chinese metropolis.
    Throughout its extensive chronology, the temple has seen several destruction,
    reconstruction, and renovation instances. It has garnered fame for its large bronze
    bell, Buddha statues, artwork, and collection of Buddha images.


    The temple has a long and illustrious history, making it one of the oldest Buddhist
    temples in the southern region of the lower Yangtze River. It was first called
    Hudu Chongyuan Temple, later renamed Yongtaichan Temple during the Tang Dynasty
    (618–907). Finally, in 1008 during the Song Dynasty (960–1279), it acquired its
    current name, Jing''an Temple. The temple, previously situated on'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# ## Public Plaza


    the edge of the ancient Wusong River (now known as the Suzhou River), succumbed
    to the relentless assault of the river''s waves and ultimately collapsed during
    a flood in 1216. Subsequently, the temple was relocated to the riverside of Bubbling
    Well Creek, where it currently stands at 1686 Nanjing Road W (Al-Kodmany & Ali,
    2013; Al-Kodmany, 2017; Binder, 2015).


    In 1972, the temple was reduced to ashes and ruins. Nevertheless, the reconstruction
    process commenced after 1984, resulting in the successive restoration of the Hall
    of Heavenly Kings and the Three-Sage Hall. The entire temple was ultimately made
    accessible to the public in 1990. The existing complex is aesthetically pleasing
    and creates a noticeable juxtaposition with the cluster of tall buildings that
    encircle it. The architectural design of Jing''an Temple incorporates Tibetan
    elements, resulting in a fusion of classical and contemporary styles. At nightfall,
    the temple is illuminated by a radiant light that imparts a golden hue.


    The temple consists of the primary courtyard or a plaza, flanked by two pavilions,
    the main hall, and the entry hall. The primary entrance to the temple is in the
    southern section, and the entry hall serves as a passage from the bustling street
    to the serene courtyard of the holy compound. The plaza''s design and landscaping
    scheme are carefully crafted to reflect the area''s rich history, cater to various
    activities, and create a harmonious balance between tradition and modernity. The
    plaza''s design complements the architectural style of the Jing''an Temple, featuring
    elements such as traditional Chinese roofs, intricate latticework, and decorative
    details that align with the temple''s visual language. The plaza offers a spacious
    and open area for visitors to gather, relax, and engage in various cultural and
    spiritual activities. This open space caters to tourists and locals, making it
    a versatile public gathering place (Weishan, 2019).


    The plaza is adorned with carefully selected plants, flowers, and trees that add
    greenery and soften the urban environment. The landscaping enhances the sensory
    experience and creates a soothing atmosphere. The Plaza features cultural installations,
    sculptures, and art pieces that resonate with the temple''s history and spirituality.
    These elements contribute to the plaza''s identity as a cultural destination.
    Designated areas within the plaza accommodate cultural performances, events, and
    outdoor exhibitions, fostering a sense of community engagement and artistic expression.
    Jing''an Temple Plaza serves as a serene urban retreat where visitors can escape
    the urban hustle, find solace, and connect with the temple''s spiritual ambience
    (Figure 3.22).


    The Hongwu Bell is a significant artifact kept within the Jing''an Temple. The
    bell is a substantial bronze artifact forged in the era of the Ming Dynasty (14th
    to 17th century) and is thought to have been the possession of Emperor Taizu.
    The bell was named after him since he was renamed as the Hongwu Emperor. The main
    hall has a significant Silver Statue of Gautama Buddha, weighing around 15 tons.
    The god is depicted seated on a pedestal, with the hands in a meditative posture.'
