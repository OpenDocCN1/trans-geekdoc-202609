    Loop was one of the city''s final available plots of land. This mixed-use development
    encompasses 4,950 residential units, 1,500 hotel rooms, 2.2 million square feet
    of gross commercial space, 770,000 square feet of retail space, and an elementary
    school (Hill, 2021). It is accessible by public transportation and the underground
