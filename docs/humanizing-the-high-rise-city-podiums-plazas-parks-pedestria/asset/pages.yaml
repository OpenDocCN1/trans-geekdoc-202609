    # *Hours*


    The High Line operates daily, and its operating hours vary based on the season.


    +   • Winter Hours: 7:00 AM–7:00 p.m.

    • Spring Hours: 7:00 AM–10:00 p.m.

    • Summer Hours: 7:00 AM–11:00 p.m.

