    # Renaissance Center, Detroit [1977]


    The Renaissance Center (often referred to as the RenCen) in Detroit, Michigan,
    is an impressive complex of seven interconnected skyscrapers that dominate the
    city''s skyline. However, the design has received criticism for its insensitivity
    to human scale and needs, as well as its perceived lack of visual attractiveness.
    The podium, or the base of the complex, is a massive concrete structure that blocks
    the view and access to the riverfront, creates a hostile and unwelcoming environment
    for pedestrians, and isolates the complex from the rest of the city. The podium
    also lacks any architectural interest or variation, resulting in a monotonous
    and dull appearance that contrasts with the historic buildings nearby. The Renaissance
    Center''s podium exemplifies how a building can fail to respect its context and
    users (Figure 2.2). John Portman & Associates designed the complex (Al-Kodmany
    & Ali, 2013).'
