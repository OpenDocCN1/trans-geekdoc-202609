    # **Heller International Building, Chicago [1992]**


    The Heller International Building (500 West Monroe) is a 45-story skyscraper in
    the West Loop area of Chicago, IL. The 600-foot (183-meter)-tall building was
    designed by Skidmore, Owings & Merrill and completed in 1992. The Postmodern-style
    building has an area of 965,000 square feet and houses offices, retail, and other
    commercial spaces. The building has a distinctive turret-like structure on its
    southeast corner, reaching the highest point, and is illuminated at night.


    The arcade of the Heller International Building stands out as a distinctive and
    noteworthy feature, adding character and functionality to the skyscraper''s design.
    Comprising a series of double openings spanning the building''s base, the arcade
    serves practical and aesthetic purposes.


    Functionally, the arcade creates a covered pedestrian walkway, offering shelter
    and a visually engaging pathway. This utilitarian feature contrasts visually with
    the skyscraper''s rectangular tower above. The arcade''s design introduces an
    element of dynamism and movement, breaking away from the rigid geometry of the
    tower and adding a layer of architectural interest at the street level (Al-Kodmany
    & Ali, 2013; Kamin, 2022).


    Structurally, the arcade is supported by steel columns clad in granite and limestone,
    harmonizing with the materials used in the facade of the building. This material
    consistency contributes to a seamless integration of the arcade with the overall
    aesthetic of the skyscraper. The choice of materials also adds a touch of elegance,
    reinforcing the building''s visual appeal.


    Beyond its role as a covered walkway, the arcade serves as an entrance to the
    building''s lobby. The entrance is marked by a hollowed-out rotunda, creating
    a sense of grandeur and emphasizing the transition from the exterior to the interior
    space. The lobby, featuring a vaulted ceiling, adds to the overall luxurious ambiance
    of the building (Al-Kodmany, 2018; Saliga & Clarke, 1998).'
