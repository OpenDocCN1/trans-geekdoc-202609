  md: 'Employing traditional bronze but enveloping it in white paint, he achieves
    an unconventional sense of lightness. Unlike traditional monuments, Claassen''s
    rabbit sculptures are grounded, offering a departure from typical public sculpture
    perspectives. Through the use of rabbits, Claassen introduces a "down-to-earth"
    quality to his art, adding a touch of whimsy and relatability to his distinctive
    approach.


    +   8. **La Riviere by Aristide Maillol:** Maillol''s later works primarily center
    around the depiction of the female nude. In contrast to the usual themes of calmness,
    tranquility, and emotional restraint found in sculptures like La Riviere, Maillol
    explores a departure from these principles. Through a deliberate placement of
    the figure near the ground and extending the head and arms beyond the pedestal,
    he introduces a sense of instability and motion. The figure, with flexed legs
    suggestive of movement, captures the essence of water, deviating from Maillol''s
    more serene portrayals to evoke a dynamic and fluid energy.


    +   9. **Scarecrow by Donald Baechler:** The genesis of Scarecrow was inspired
    by the artist''s agricultural estate in upstate New York. Baechler envisioned
    placing a sculpture suspended above the rolling hills and barns, drawing parallels
    to the Christ the Redeemer sculpture atop Mount Corcovado in Rio de Janeiro. Depicting
    the scarecrow as a solitary figure in a vast field, devoid of life and engagement
    with its surroundings, Baechler captures an essence akin to an inanimate observer.
    The inaugural sculpture of the Scarecrows series is on display at Citygarden.
    Additionally, the artist crafted a duplicate, now positioned on his East Coast
    farm.


    +   10. **Bird by Laura Ford:** Ford crafts whimsical and disconcerting hybrid
    organisms by blending human and animal features, a process influenced by her keen
    observation of her children and reflections on her own childhood experiences.
    Growing up exposed to sideshows and fairgrounds, these early encounters left a
    profound and lasting imprint on her worldview. This exposure has equipped Ford
    with a unique ability to seamlessly navigate between the tangible and intangible,
    the eerie and delightful, and the humorous and malicious realms in her art.


