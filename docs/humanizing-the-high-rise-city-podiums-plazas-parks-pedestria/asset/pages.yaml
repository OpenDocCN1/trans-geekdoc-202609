    # The Jetty


    The Jetty, an expansive stretch from Wells Street to Franklin Street, is a testament
    to the harmonious integration of ecology, recreation, and education along the
    Chicago River. The Jetty is a multifaceted space designed to cater to various
    interests and experiences, comprising seven piers that boldly extend over the
    river''s expanse.


    This unique area serves as a haven for fishing enthusiasts, providing designated
    spots where individuals can engage in this leisurely pursuit. However, a pertinent
    reminder accompanies this recreational aspect, emphasizing the need for an appropriate
    fishing license to partake in the activity. As people cast their lines into the
    river, the Jetty transforms into a tranquil space where individuals can enjoy
    the solitude of fishing and witness the underwater world teeming with aquatic
    life (AI-Kodmany, 2020; Kamin, 2022b, 2023).


    The ecological consciousness embedded in the Jetty''s design extends beyond surface-level
    engagement. Underwater fish habitats have been strategically installed, contributing
    to the river''s biodiversity. Floating gardens, anchored by resilient stainless-steel
    pylons, enhance the ecological fabric by providing a healthy habitat for fish
    populations. Remarkably, these floating gardens exhibit adaptability, capable
    of rising to 8 feet in response to flooding, showcasing a thoughtful approach
    to environmental resilience.


    The plant selection for the floating wetlands and water gardens prioritizes water-tolerant
    species, further emphasizing the commitment to sustainable landscaping practices.
    The Jetty creates recreational opportunities, enhances ecological well-being,
    and serves as an educational platform. Visitors are invited to explore and interact
    with the aquatic ecosystem, fostering a deeper understanding of the delicate balance
    between urban development and environmental conservation (AI-Kodmany, 2020; Kamin,
    2022a).'
