    # Salesforce Transit Center, San Francisco


    Salesforce Transit Center, formerly the Transbay Terminal, is a central transportation
    hub in downtown San Francisco, California. Designed by Pelli Clarke Pelli Architects,
    the modern, architecturally striking building was completed in 2018. It serves
    as a central hub for various public transportation modes, including buses, regional
    and intercity buses, trains, and future high-speed rail services.


    Located in the South of Market neighborhood, it is primarily designed to accommodate
    local, regional, and intercity bus lines and serves as a central terminal for
    several bus agencies. The center offers a range of amenities and facilities, including
    a spacious bus terminal, retail spaces, restaurants, public art installations,
    a rooftop park called Salesforce Park, and a pedestrian bridge connecting neighboring
    areas. The Salesforce Transit Center is about 440 meters long and 165 meters wide
    (Al-Kodmany, 2022; Salesforce Transit Center, Schorung, 2019).


    Based on the transit center''s rooftop, Salesforce Park is a 5.4-acre public park
    with landscaped gardens, walking paths, plazas, and various seating areas spread
    over four blocks. One of the defining characteristics of Salesforce Park is its
    lush greenery and extensive landscaping. Situated 70 feet above the grand hall,
    the park has 16,000 plants arranged in 13 different botanical feature areas (ecosystems),
    600 trees, and a linear fountain, creating a serene and inviting atmosphere. The
    tree canopy provides shade and helps mitigate the urban heat island effect, making
    the park a refreshing escape from the surrounding cityscape. PVVP landscape architects
    designed the park (Al-Kodmany, 2018a; Salesforce Transit Center).'
