    Bryant Park distinguishes itself in a city with a scarcity of monuments honoring
    women by including two notable public art installations dedicated to women. The
    Josephine Shaw Lowell Memorial Fountain, located near the western terminus of
    the park, holds the distinction of being the inaugural monument in New York City
    specifically honoring a woman. Its installation took place in 1912. The fountain,
    created by Charles Adam Platt, pays tribute to Ms. Lowell''s contributions as
    a social worker and the establishment of the Charity Works Organization. A bust
    of the renowned writer Gertrude Stein, crafted by Jo Davidson in 1923, can be
    found on the Upper Terrace. The original artwork is currently housed in the permanent
    collection of the Museum of Modern Art, while a replica was installed in the park
    in 1992.


    At the heart of the park''s charm lies its meticulously maintained facilities,
    with the lush, perfectly groomed lawns standing out as the primary draw, beckoning
    visitors to relax and immerse themselves in the tranquil embrace of nature. Comfort,
    a cornerstone of the Bryant Park experience, is epitomized by the thoughtfully
    arranged seating scattered throughout the park. Whether nestled under the shade
