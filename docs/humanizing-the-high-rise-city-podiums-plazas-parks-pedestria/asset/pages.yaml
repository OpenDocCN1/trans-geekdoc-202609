    The park comprises three distinct sections: the eastern region, the central area,
    and the western area. The primary point of interest in the eastern region is the
    Memorial to the May Thirtieth Movement. In the expansive central region, one may
    locate the Antarctic Stone, the Shanghai Museum of Contemporary Art, a teahouse,
    an outdoor theater, and a dance hall. Located along the park''s central axis,
    the Shanghai Museum of Contemporary Art is a pioneering gallery establishment
    that showcases modern art and design. The museum has hosted many expansive art
    exhibitions, drawing in many visitors. In addition, visitors can relax, engage
    in a game of chess, or have a picnic on the stone tables and stools inside the
    rainforest of the central region. The western region boasts many landscapes with
    pavilions, corridors, artificial hills, pools, and pergolas, starkly contrasting
    with the eastern and central parts (Wang et al., 2016).


    The Memorial to the May Thirtieth Movement, an anti-imperialist movement on May
    30th, 1925, is located on the northeastern side of the park. It was founded in
    1985 to commemorate the 60th anniversary of the movement. Unveiled in 1990, it
    covers 4,000 square meters and includes a stainless-steel sculpture, a bronze
    sculpture, and three granite stones. The central sculpture, weighing 50 tons,
    bears the inscriptions of “May 30th” and symbolizes the optimism and enthusiasm
    of Chinese people. The bronze sculpture features two workers, showcasing their
    bravery and determination. The middle granite stone features inscriptions by Chen
    Yun and Lu Ding, while the other two tablets depict the movement''s history (Wang
    et al., 2016).


    The Lotus Pond, located in the park''s western section, consists of two pools
    and spans 3,300 square meters (3,947 square yards). Lotus flowers are cultivated
    in the eastern pool, while goldfish are bred in the western pool. The luxuriant
    morning redwoods are located to the east of the pond, while a square pavilion
    rises to the west. To the south of the pond is a meandering corridor and a rectangular
    pavilion by the water. A bamboo pavilion with eight sides is located northeast
    of the bridge, spanning the pond''s center. During the summer, there is an intriguing
    exhibition of lotus flowers in the lotus pond. Visitors are welcome to visit and
    see the exquisite lotus blossoms (China Tour Star).


    Shanghai People''s Park is renowned for its central focus on the Marriage Market,
