    park in the United States. In 1853, state authorities purchased land from 59th
    to 106th Streets, between Fifth and Eighth Avenues, formerly used for modest agricultural
    plots and communities due to its rugged and marshy soil. The park was designed
    by landscape architects Frederick Law Olmsted and Calvert Vaux and constructed
