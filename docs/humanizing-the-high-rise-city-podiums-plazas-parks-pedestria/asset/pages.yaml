    The Crown Fountain is an immersive and interactive experience for visitors as
    water cascades from the summits of the towers and playfully sprays from the mouths
    of the faces displayed on the screens. This dynamic installation, funded by the
    Crown Family with a generous $17 million investment, reflects their commitment
    to enriching public spaces. The design blends artistic vision, technical innovation,
    and engineering expertise to bring this fountain to life. The fusion of technology
    and artistry creates a unique space that engages the senses and symbolizes the
    harmonious integration of public and private support for cultural enrichment within
    urban environments.


