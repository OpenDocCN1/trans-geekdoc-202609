    panels unfolds, adopting a staggered pattern that imparts a pronounced sense of
    movement and rhythm. This deliberate arrangement contributes to the visual dynamism
    of the space and allows natural light to permeate the interior.


    A prominent feature of the podium is the expansive space-frame canopy that extends
    from the structure''s pinnacle, creating a distinctive roofline that stands in
    deliberate contrast to the tower''s verticality. This canopy comprises triangular
    modules of varying sizes and angles, resulting in a dynamic and sculptural form.
    The irregular arrangement of these modules adds an artistic flair to the canopy,
    creating an intriguing interplay of light and shadow (Al-Kodmany, 2018; Binder,
