    +   3. **Enhancing Health and Well-being:** Access to green spaces has been linked
    to improved physical and mental health. Sky parks and gardens offer physical activity,
    exercise, and relaxation opportunities, which can help reduce stress, improve
    mood, and enhance overall well-being. Vegetation in sky parks and gardens is crucial
    in improving air quality by absorbing carbon dioxide and releasing oxygen through
    photosynthesis. They act as natural filters, helping to reduce air pollution and
    creating a healthier living environment for residents and workers.


    +   4. **Improving Aesthetics and Urban Design:** Sky parks and gardens appeal
