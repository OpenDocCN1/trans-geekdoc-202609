    ambiance. The gloomy atmosphere that greets visitors as they descend into the
    museum captures the seriousness of the historical event. Artifacts bearing witness
    to the destruction of that dreadful day are showcased in the displays, including
    pieces of the Twin Towers’ original pillars. Touching artifacts from the museum’s
    collection include broken telephone booths, a burned ambulance, and the melancholy
    remnants of helmets that firefighters and rescuers who responded to the unparalleled
