    by William Wrigley, Jr. and created by James Earle Fraser. "The Discoverers" depicts
    explorers Louis Joliet, Jacques Marquette, René-Robert Cavelier, Sieur de La Salle,
    and Henri de Tonti, commemorating their exploration'
