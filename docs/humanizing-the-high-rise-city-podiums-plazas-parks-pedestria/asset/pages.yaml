- pgno: 181
  md: 'the Cloud Gate, are oversized to connect the towering buildings nearby and
    the “flat” park they occupy (Gifford, 2006).


    Millennium Park is a remarkable urban design that integrates environmental, economic,
    and social benefits. The park spans an area of almost half a million square meters
    and has one of the largest green roofs in the world. This green roof effectively
    mitigates urban heat island effects, purifies the air, and serves as a reservoir
    for rainfall to avoid flooding. The park, which draws in millions of people yearly,
    produces substantial revenue and tax money for the city. Its construction was
    funded by a combination of public and private sources, amounting to around $490
    million. The park has won many awards for its accessibility, sustainability, tourism,
    and social impact. Southworth notes, “Millennium Park . . . is undoubtedly a popular
    success. Since its opening in 2004, it has been visited by millions of tourists
    and hailed by many in the design community as one of our most successful urban
    parks” (Southworth, 2011, p. 504).


    One of the most remarkable features of Millennium Park is that it was a collaborative
    effort involving many different parties. Mayor Richard M. Daley led the park’s
    vision, design, and implementation. Important participants include Project Design
    Director Edward Uhlir; Millennium Park Foundation Chairman John H. Bryan; Landscape
    Architect Kathryn Gustafson, Architect Adrian Smith; and architectural firm Skidmore,
    Owings, and Merill (SOM). Moreover, the park benefited from the contributions
    of various cultural organizations, private donors, architects, planners, city
    employees, and volunteers who participated in the project. The park thus demonstrates
    how a diverse group of stakeholders can create a vibrant public space that caters
    to both locals and visitors from around the globe (Gifford, 2006).


    # MASTER PLAN


    SOM designed the master plan for Millennium Park, which combines a classical,
    Beaux-Arts-inspired layout with modern art installations. The park has clear boundaries,
    a symmetrical layout, a main north–south walkway, a large lawn, and a limestone
    colonnade while showcasing the creations of contemporary architects and artists
    such as Frank Gehry, Jaume Plensa, and Anish Kapoor. Underground train stations
    have been upgraded, two new parking levels have been built, and bus stops have
    been added, creating a multimodal hub that reduced traffic congestion. SOM finished
    the master plan in 2002 (Al-Kodmany, 2020a; Kent, 2011).


    The spatial layout of Millennium Park in Chicago follows the concept of an “urban
    room” structure, which originated from the design of Grant Park by Daniel Burnham
    and Edward Bennett in 1909. This concept was further realized in Millennium Park,
    where each distinct space within the park is designed to convey a unique and memorable
    design idea. The park comprises 12 principal “rooms” offering different experiences
    and design elements. These rooms include notable features such as the AT&T Plaza
    and Cloud Gate Sculpture, the Crown Fountain,'
