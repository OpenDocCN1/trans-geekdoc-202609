  md: '**2. Concept Development:**


    +   - Develop a clear concept and vision for the sky park or garden, considering
    the purpose, theme, desired user experience, and overall design objectives.

    - Identify the unique selling points and desired features, such as seating areas,
    walking paths, recreational spaces, water features, or panoramic viewpoints.


    **3. Site Analysis and Microclimate Considerations:**


    +   - For outdoor parks, conduct a thorough site analysis to understand the microclimate
    and environmental conditions of the building’s location.

    - Factors such as sunlight exposure, wind patterns, temperature variations, and
    noise levels should inform the design.

    - Use this information to select appropriate plant species, design shading structures,
    and consider the need for wind mitigation measures.


    **4. Landscape Design and Plant Selection:**


    +   - Collaborate with landscape architects and horticulturists to design the
    green spaces within the building. Consider the chosen plant species’ aesthetics,
    functionality, and maintenance requirements.

    - Select vegetation that can thrive in a specific microclimate and is easily maintained
    in an elevated environment.

    - Integrate green walls, vertical gardens, hanging plants, or rooftop vegetation
    to maximize greenery and create a pleasant atmosphere (Tian & Jin, 2011).


    **5. Accessibility and Circulation:**


    +   - Ensure the sky park or garden is accessible to building occupants and visitors.

    - Design safe and convenient access points, including elevators, staircases, or
    dedicated entrances.

    - Consider universal design principles to ensure accessibility for people of all
    abilities.

    - Create a coherent circulation design that effectively directs people through
    the different sections of the sky park or garden.


    **6. Amenities and Functionality:**


    +   - Incorporate amenities and functional spaces within the sky park or garden
    to enhance user experience.

    - Include seating areas, gathering spaces, recreational facilities, and possibly
    food and beverage outlets.


    **7. Sustainability Considerations:**


    +   - Integrate sustainable design practices into the sky park or garden.

    - Utilize green infrastructure elements such as rain gardens, living walls, or
    green roofs to manage stormwater runoff and improve insulation.'
