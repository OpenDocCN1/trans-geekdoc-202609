    # **CapitaLand Building, Hangzhou [2017]**


    CapitaLand Building, also known as Raffles City Hangzhou, is in Hangzhou, one
    of China’s most picturesque cities. It is the eighth Raffles City development
    in China by CapitaLand. Completed in 2017, the architectural design of the CapitaLand
    Building is inspired by the movement of the Qiantang River and the historic cityscape
    of Hangzhou. The two streamlined towers twist and rise to 250 meters, creating
    a dynamic and elegant landmark along the green axis of the city’s new CBD (Qian,
    2015).


    The podium design of CapitaLand Building is characterized by a sculptured six-story
    pedestal that serves as a crucial link connecting the towers to the broader complex.
    This multifunctional pedestal has been thoughtfully designed to accommodate various
    amenities, including parking facilities, shops, restaurants, and entertainment
    venues. Additionally, it features a direct underground connection to the nearby
    metro stop, enhancing accessibility for the inhabitants and visitors.


    An integral aspect of the podium’s design is its commitment to human-scale proportions,
    ensuring aesthetic appeal and practical functionality. The podium’s swooping and
    arching glass façade creates a striking visual impression, instilling a sense
    of arrival. This architectural feature contributes to an overall atmosphere of
    openness and transparency, enhancing the visual experience for those approaching
    the building.


    Furthermore, a landscaped plaza, serving as an additional podium component, expands
    the public realm around the complex. This outdoor space adds a touch of greenery
    and fosters a lively and inviting environment for both inhabitants and guests.
    The plaza’s design aligns with contemporary urban planning principles, creating
    a communal space that encourages social interaction and contributes to the well-being
    of the building’s occupants.


    In summary, the CapitaLand Building’s podium design in Hangzhou integrates functionality,
    aesthetics, and human-scale considerations. The sculptured pedestal, with its
    diverse amenities and visually striking features, enhances the overall appeal
    of the complex while providing a welcoming and engaging environment for the community
    (Figure 2.30).


    # **River Point Tower, Chicago [2017]**


    Designed by New Haven, CT, Pickard Chilton Architecture + Master Planning and
    completed in 2017, the 52-story River Point is a dramatic landmark addition to
    the City of Chicago. The tower’s striking image is created by a sleekly sculpted
    form and a shimmering convex façade featuring an exuberant, silver-blue curving
    glass wall that creates a robust spatial kinship with its neighboring building,
    333 W. Wacker Drive, which also features a tremendous curving green glass curtainwall.


    The convex façade displays a tall, tilted parabolic arch at its base, echoed by
    a shallower arch at the tower’s top. The arch at the base is structural: the whole
    façade and columns tilt due to the active Amtrak and Metra railroad tracks and
    subway portion of the CTA Blue Line underneath. However, the arch at the top is
    decorative (Al-Kodmany, 2020; Kamin, 2016, 2022).'
