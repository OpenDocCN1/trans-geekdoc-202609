- pgno: 140
  md: 'popular gathering spot for residents and visitors alike. The park holds historical
    significance as one of the oldest public spaces in Los Angeles. Its historical
    monuments and markers contribute to its cultural value and serve as educational
    resources. It was initially dedicated in 1866 as la Plaza Abaja and renamed later
    after General John J. Pershing, a prominent military figure during World War I.
    It is also a historic site for LGBTQ+ activism and culture as it was part of the
    5th Street corridor known as “The Run” from the 1920s to the 1960s. The park has
    witnessed significant events and protests throughout history, making it a site
    of historical and social importance (Moody, 2016; Parson, 2002). The Department
    of Recreation and Parks manages the square.


    Pershing Square''s central location in downtown Los Angeles makes it easily accessible
    to residents, workers, and visitors. Its proximity to public transit and surrounding
    businesses increases its convenience and potential for foot traffic. The park
    is surrounded by various office buildings, restaurants, and shops, making it a
    bustling hub during weekdays. It offers a tranquil oasis amid the busy urban environment,
    providing relaxation and recreation for locals and visitors. Pershing Square has
    undergone several renovations and redesigns, reflecting the changing needs and
    tastes of the city. The current design, completed in 1994, features a colorful
    and geometric style by architect Ricardo Legorreta, landscape architect Laurie
    Olin, and artist Barbara McCarren. Today, Pershing Square is a vibrant and diverse
    space that welcomes visitors of all ages and backgrounds (Ling, 2024).


    The square is a communal area where individuals from the community and visitors
    may convene, converse, gather, and unwind in the heart of the downtown. The square
    consists of hardscapes and grassy areas that provide a space for concerts, gatherings,
    political rallies, and public celebrations. Pershing Square is adorned with fountains,
    monuments, statues, a spacious seating platform, two children''s playgrounds,
    a chess area, a pet area, and an elevated open-air amphitheater inspired by the
    Mayan style. The park''s central plaza and performance stage make it suitable
    for various events, including concerts, festivals, and public gatherings. Several
    sculptures and public art installations are scattered throughout the park, contributing
    to its appeal. Collectively, these elements allow the park to contribute to the
    city''s cultural scene (Moody, 2016).


    One of the notable features of Pershing Square is the iconic purple bell tower,
    a recognizable landmark in the area. The tower stands 125 feet tall and serves
    as a visual centerpiece of the park. The purple bell tower is not merely a structure;
    it is a symbol that defines the park''s skyline and serves as a reference point
    for those navigating the bustling city streets. Its bold hue adds a vibrant splash
    of color to the urban landscape, creating a dynamic contrast against the backdrop
    of buildings and greenery. Whether seen from a distance or admired up close, its
    commanding presence prompts curiosity and wonder, encouraging people to explore
    the surrounding park and discover its diverse offerings (Ling, 2024); (Figure
    5.4).'
