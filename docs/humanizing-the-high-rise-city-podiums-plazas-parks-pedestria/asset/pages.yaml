    # CITYGARDEN SCULPTURE PARK, SAINT LOUIS


    # Saint Louis, Missouri


    Saint Louis, Missouri, boasts a rich historical tapestry seamlessly interwoven
    with a vibrant contemporary presence. Founded in 1764 by French fur traders, it
    has played a significant role in the westward expansion of the United States,
    earning the nickname “Gateway to the West.” St. Louis is part of the Greater St.
    Louis metropolitan area and has a diverse economy with strengths in healthcare,
    finance, manufacturing, and transportation. The city is home to world-class cultural
    institutions like the Saint Louis Symphony Orchestra, Saint Louis Art Museum,
    and Missouri Botanical Garden. St. Louis’ sports culture thrives with passionate
    fans supporting teams like the St. Louis Cardinals and St. Louis Blues. Educational
    institutions like Washington University and Saint Louis University contribute
    to the city’s intellectual vibrancy. Despite challenges related to urban development
    and economic transitions, efforts are being made to revitalize neighborhoods and
    enhance cultural amenities (Proctor, 2018).


    # Citygarden


    Citygarden is a 3-acre urban park and sculpture garden in St. Louis, Missouri,
    owned by the City and maintained by a private foundation, the Gateway Foundation.
    The site is situated within the confines of Eighth, Tenth, Market, and Chestnut
    Streets, specifically in the “Gateway Mall” area, just a few blocks west of the
    iconic Gateway Arch and the majestic Mississippi River. The park’s prime downtown
    location makes it easily accessible to residents, workers, and visitors. Art and
