  md: '+   * **Double Horizon:** Sarah Sze''s Double Horizon, a 5,500-pound boulder
    split open like a geode, uses tiles to create pixellated sky images, highlighting
    the fragility of time and the desire for permanence.


    +   * **Deep Gradient/Suspect Terrain:** John Roloff''s 18-foot-high sculpture,
    “Deep Gradient/Suspect Terrain,” creates an illusion of land and convention space,
    symbolizing the ocean and its surface.


    +   * **Roll:** Brendon Monroe''s “Roll” is a modern, fluid mural inspired by
    water and air movement, resembling a layer of fog over San Francisco’s coastal
    mountains below the Paseo bridge.


    +   * **Genesis:** Christine Corday''s “Genesis” entrance to Moscone North and
    Yerba Buena Gardens features massive stainless steel arc segments and a concrete
    form.


    +   * **PointCloud:** Leo Villareal’s “PointCloud” light installation features
    50,000 full-color LEDs and 800 mirrored stainless-steel rods, supporting the world’s
