  md: '# About the Author


    Dr. Kheir Al-Kodmany, an internationally reputed professor of urban planning at
    the University of Illinois Chicago (UIC), boasts an extensive career spanning
    40 years. His extensive research and teaching portfolio encompasses diverse subjects,
    including vertical urbanism, sustainable design, Geographic Information Systems,
    visualization systems, public participation, and crowd management. Dr. Al-Kodmany
    has published a dozen books and about 150 scholarly works, earning widespread
    acclaim for their comprehensive insights into architecture and urban design. His
    publications are highly regarded, with over 250,000 reads on ResearchGate. Recognized
    for his academic excellence, he serves on 20 editorial boards of professional
    journals. Dr. Al-Kodmany''s impactful teaching and research-career spans 30 years
    at UIC and UIUC, where he secured grants totaling several hundred thousand dollars
    and developed innovative visualization software. Beyond academia, Dr. Al-Kodmany''s
    expertise has been sought by governments, mayors, and organizations worldwide.
    Notably, the Saudi Government invited him to contribute to the planning of Hajj,
    earning international recognition for enhancing safety. His involvement in Chicago''s
    "Taste of Chicago" event and contributions to Mayor Daley''s bid for the 2016
    Summer Olympics further demonstrate his impactful civic engagement. Dr. Al-Kodmany
    delivered over 200 presentations globally at prestigious institutions as a sought-after
    keynote speaker and trainer. His leadership roles at UIC, including Director of
    Graduate Studies, Associate Director of the City Design Center, and the Urban
    Data Visualization Laboratory Co-Director, demonstrate his commitment to innovative
    tools in participatory planning and design. Affiliated with esteemed professional
    organizations such as the APA, ACSP, CTBUH, and URISA, Dr. Al-Kodmany continues
    to contribute significantly to the field of urban planning, carrying forward the
    legacy of his early architectural training from his father, Dr. Abdul Muhsen Al-Kodmany,
    a Le Corbusier trainee and École des Beaux-Arts graduate.'
  merge: -1
