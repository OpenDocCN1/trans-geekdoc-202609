    # One World Trade Center, New York City [2014]


    The 541-meter (1,776-foot) One World Trade Center, the tallest building in the
    Western Hemisphere, is a remarkable architectural achievement that symbolizes
    the resilience and strength of New York City. Completed in 2014, it replaced the
    former Twin Towers post-9/11 attacks. However, its design has been criticized
    for being bland and uninspiring, especially the podium that supports the tower.
    The podium is a massive concrete structure that covers the base of the building
    and houses the lobby, security, and mechanical systems. It is clad in glass panels
    that are supposed to reflect the sky and the surroundings but instead create a
    dull and monotonous appearance. The podium lacks any distinctive features or details
    that could make it more appealing and inviting. It contrasts sharply with the
    slender and elegant tower above it, creating a sense of disproportion and imbalance.
    The podium of One World Trade Center is not attractive because it fails to convey
    the beauty and dynamism of the city that it represents (Figure 2.5). David Child
    of SOM designed the building (Al-Kodmany, 2018; Dupré, 2016).'
