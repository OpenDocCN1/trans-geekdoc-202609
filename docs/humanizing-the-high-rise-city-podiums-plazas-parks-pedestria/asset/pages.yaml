    # Recreational Trail


    The Recreational Trail segment of the Chicago Riverwalk, extending from Lake Shore
    Drive to Michigan Avenue, stands as the inaugural section of this iconic urban
    space. Constructed in the early 2000s, this eastern component connects the Chicago
    Loop with Lakefront Trail and Navy Pier, seamlessly intertwining with the cityscape
    along the Chicago River. As a docking point for boats offering educational and
    recreational tours, the Recreational Trail or Riverwalk Esplanade has become a
    hub of activity and leisure (Hill, 2019).


    Among the most exciting tours is the Chicago River Architecture Cruise. It is
    a captivating and educational boat tour that navigates the iconic Chicago River,
    offering participants a unique perspective on the city''s remarkable architectural
    landscape. This immersive experience provides a front-row seat to some of Chicago''s
    most renowned architectural marvels, showcasing the city''s rich history and innovative
    design. The cruise typically passes by landmarks such as the Willis Tower (formerly
    known as the Sears Tower), the Wrigley Building,'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'the Tribune Tower, and the Trump Tower, among others. These iconic structures
    come to life as the boat glides through the city’s heart, providing passengers
    with a comprehensive understanding of Chicago’s architectural heritage (Al-Kodmany,
    2021; Kamin, 2015; Hill, 2019).


    The trail’s carefully curated design incorporates lush landscaping, verdant trees,
    and diverse plants, contributing to its aesthetic appeal. Additionally, the inclusion
    of thoughtfully designed play areas, stylish LED lighting fixtures, comfortable
    furniture, artistic railing, and welcoming seating areas enhances the overall
    experience for visitors. Public restrooms provide convenience, ensuring a visitor-friendly
    environment. Despite its early completion, ongoing projects focusing on retrofitting
    and improvement underscore a commitment to continuous enhancement, maintaining
    the Recreational Trail as a dynamic and cherished urban oasis (Figure 9.2).


    The western section of the Chicago Riverwalk, stretching from Michigan Avenue
    to Lake Street, offers a distinct contrast to its eastern counterpart. Unlike
    the natural park-like ambiance of the east, the “west part” embodies the essence
    of civic space. Here, the landscape takes on a more urban character, reflecting
    the dynamic and bustling atmosphere of the city. As visitors traverse this stretch,
    they are immersed in an environment that seamlessly blends urban design with recreational
    elements, providing a multifaceted experience within the heart of Chicago’s vibrant
    urban fabric.


    The west part consists of block-long sections or “bays” that contain civic plazas.
    It was constructed in three phases (Phase 1, Phase 2, and Phase 3), as follows.


    # Phase 1


    Phase 1, spanning from Michigan Avenue to State Street, was finalized in 2009
    and encompasses noteworthy landmarks, including the McCormick Bridgehouse & Chicago
    River Museum and Chicago’s Vietnam Veterans Memorial. Two pivotal pedestrian connections
    at the river level were strategically incorporated to enhance the path’s continuity.
    In the previous layout, the pedestrian experience was hindered and dissuasive,
    as individuals were required to ascend stairways to the upper level of Wacker
    Drive, cross a city street, and then descend once more to reach the river level.
    The introduction of under-bridge crossings effectively addressed this challenge,
    providing pedestrians with a seamless and uninterrupted route along the Chicago
    River (Al-Kodmany, 2023; Chicago Riverwalk; Kamin, 2015, 2023).


