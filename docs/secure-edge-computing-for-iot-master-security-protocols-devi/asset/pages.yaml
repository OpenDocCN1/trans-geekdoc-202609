  md: '# Key Terms


    # Internet of Things


    Radio-frequency identification (RFID) technology; RFID enables objects to be uniquely
    identified and tracked.


    # Internet Engineering Task Force


    Message Queuing Telemetry Transport; It is a standard-based messaging protocol,
