- pgno: 5
  md: '# About the Author


    ![](img/31919f230142cc926c349c85b30fe4d2_5_0.png)


    Oluyemi James Odeyinka has over a decade of experience serving as a cloud and
    data solution architect and cybersecurity leader. Throughout his career, he has
    played pivotal roles in numerous cloud projects, demonstrating both leadership
    and hands-on engineering expertise. His project delivery encompasses the deployment
    of resources for major companies, employing Infrastructure as Code methodologies.
    Notably, he has achieved success with high-profile projects in the United States.


    Currently holding the positions of Senior Solution Architect and Senior Manager
    at Walgreens Boot Alliance (WBA), and serving as the Founder and President of
    CloudALL Technologies, Oluyemi is a multifaceted professional. His academic background
    includes the attainment of a postgraduate MBA degree in Data Analysis, coupled
    with in-depth'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'knowledge of Agile Methodologies. He is currently a PhD candidate at Purdue
    University in the USA.


    As an accomplished information technology leader, Oluyemi has amassed significant
    experience in Cybersecurity, Hybrid Cloud, Product Management, Data Engineering,
    Data Analytics, Governance, IoT, and Data Protection and Data Management. He has
    actively contributed to the field by authoring and leading numerous cloud and
    cybersecurity training sessions on a global scale.


    A sought-after speaker, Oluyemi has addressed audiences at various conferences,
    such as IoT World in 2020 and 2021, Edge Computing 2021, Embedded Devices 2022,
    and the latest Infosec World 2022. He currently serves on the Board of Advisors
    at Sensor Converge. His expertise is further solidified by his CISSP certification
    and proud membership in ISC2, a leading IT Security organization. In recognition
    of his substantial contributions to technical communities worldwide, he was honored
    with the Outstanding Leadership Award at the 2022 Internet 2.0 Conference.'
  merge: -1
  img_proc: true
