- pgno: 8
  md: '# Preface


    This comprehensive book delves into the multifaceted realm of edge computing security,
    emphasizing the crucial role of automation in safeguarding edge environments.
    Exploring the intersection of edge computing with Artificial Intelligence and
    Machine Learning, it underscores the significance of decentralized data processing
    for various industries. Addressing fundamental concepts, it demystifies edge computing’s
    relevance in today’s data landscape while emphasizing the pivotal roles of data
    engineering, monitoring, and security.


    By meticulously examining the layers of information technology, this book provides
    a nuanced understanding of the indispensability of edge computing security. Bridging
    theory with practical insights, it offers diverse use-case scenarios, including
    insights into the Internet of Things (IoT) within the edge computing ecosystem.
    Moreover, it elucidates how AI and Machine Learning stand to gain from edge computing,
    elucidating its suitability and benefits.


    Serving as an invaluable resource for both novice and seasoned learners, this
    book offers a structured approach to learning about edge computing, complemented
    by real-world examples. From outlining the necessity of secure edge computing
    to detailing its intricacies across 10 comprehensive chapters, it illuminates
    the vital role of cybersecurity in this domain. Whether readers seek theoretical
    knowledge or practical application, this book serves as a trusted companion, providing
    insights, frameworks, and the latest technological tools to secure edge computing
    environments effectively.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'Chapter 1 covers the extraordinary journey to explore the foundations, principles,
    and applications of IoT and edge computing. Readers will learn the core concepts
    underpinning this technological convergence and its profound impact on industries
    and societies worldwide. From smart cities and healthcare to agriculture and manufacturing,
    the transformative power of IoT and edge computing permeates our modern existence.
    The chapter will uncover the visions of pioneers and trailblazers who have shaped
    this technological marvel. Simultaneously, it will peer into the horizon of possibilities
    yet to be unveiled, embracing the unique synergy between the IoT and edge computing.
    The chapter gives details of the IoT ecosystem, use cases, and benefits of IoT.


    Chapter 2 explores the importance of edge computing and its potential to transform
    applications by overcoming the constraints of centralized cloud computing. Readers
    will gain insight into the distinctions between edge computing and cloud computing,
    as well as how to utilize ping tools to gauge latency. Through an examination
    of data center decentralization, readers will uncover the fundamentals of edge
    computing and familiarize themselves with the hardware of edge devices. Additionally,
    the chapter will delve into various operating systems for edge computing, including
    containerization at the edge. Finally, readers will discover a range of use cases
    for edge computing, including those involving AI models at the edge.


    Chapter 3 uncovers edge networking, encompassing both edge LAN and edge WAN. By
    the end, readers will possess a comprehensive grasp of convergence types across
    LAN and WAN landscapes. Exploring further, readers are acquainted with edge routing
    protocols and Quality of Service'
  merge: -1
  img_proc: true
- pgno: 10
  md: '(QoS) implementations at the edge. Additionally, the chapter sheds light on
    edge network security measures. Throughout this discourse, users will uncover
    the practical applications of edge networking, understanding its significance
    and its pivotal role at the periphery. Furthermore, they will gain insights into
    programming and coding the edge infrastructure, leveraging open-source tools like
    Ubuntu for implementation.


    Chapter 4 delves into the IoT threat landscape, exploring the proliferation of
    insecure devices within the ecosystem. Readers will gain insight into new and
    emerging threat vectors, developing a comprehensive understanding of malware and
    ransomware attacks at the edge and their significant risks across the network.
    Additionally, they will learn to utilize threat-hunting tools and understand the
    role of bash scripts in this process. This chapter also addresses various edge
    computing security models, including Zero Trust, AAA, and blockchain. Furthermore,
    readers are introduced to monitoring tools at the edge, enabling effective monitoring
    of their edge systems for business purposes.


    Chapter 5 covers data analytics at the edge, delving into the deployment of machine
    learning models and algorithms directly onto edge devices. It will explore the
    advantages of conducting machine learning at the edge as opposed to in the cloud.
    Various types of machine learning algorithms applicable at the edge will be introduced
    to the reader. Additionally, the chapter will elucidate different machine learning
    types, followed by an examination of the opportunities and challenges inherent
    in data analytics and machine learning at the edge. A specific agricultural use
    case for edge machine learning will be presented, alongside a comprehensive exploration
    and explanation of the data engineering process within this context.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Chapter 6 covers foundational aspects of edge security, understanding the intricacies
    of fortifying different access points at the edge. Readers will explore the pivotal
    security paradigm of Zero Trust, unpacking essential principles such as risk assessment,
    and the integral roles of microservices and containers within the edge security
    architecture. Additionally, the chapter provides insights into end-to-end encryption,
    elucidating the procedures for encrypting traffic, devices, and data at the edge.
    Furthermore, readers will gain expertise in safeguarding edge applications through
    industry-leading methodologies and tools, with step-by-step instructions for securing
    applications at the edge.


    Chapter 7 delves into penetration testing in edge computing, which encompasses
    a diverse array of devices and endpoints, spanning from IoT devices to edge servers
    and gateways. Emphasizing the significance of scoping in penetration testing,
    readers will gain insights into how to effectively scope penetration testing activities
    at the edge. Furthermore, the readers will learn various methodologies employed
    in penetration testing within edge environments. Additionally, the chapter elaborates
    on the rules of engagement pertaining to penetration testing, as well as delve
    into discussions surrounding ethics and legal considerations in this domain. Readers
    will be acquainted with the formulation of penetration testing plans, along with
    the tools and techniques utilized specifically for edge computing penetration
    testing. Finally, the chapter will conclude with a comprehensive overview of incident
    management at the edge and the associated mitigation processes.


    Chapter 8 uncovers how to discover vulnerabilities at the edge, emphasizing the
    importance of understanding the distinct threats they pose. Consequently, the
    chapter delves into the intricacies of cybersecurity challenges extensively. Exploring
    the fundamentals of cryptography'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'within edge computing illuminates the fusion of these concepts, marking a significant
    evolution towards securing the edge. The chapter will explore encryption algorithms
    tailored for the edge, encompassing aspects such as hash function algorithms,
    key rotation, and PKI key management within the edge ecosystem.


    Chapter 9 discovers the symbiotic relationship between cloud computing and edge
    computing, understanding their mutual necessity and significance. Delve into the
    foundational principles of both cloud and edge computing, unraveling their essential
    concepts. Explore the pivotal components within the cloud and edge ecosystems.
    Gain insight into various cloud models, ranging from Infrastructure as a Service
    (IaaS) to Platform as a Service (PaaS) and Software as a Service (SaaS). Explore
    the dynamic interplay between cloud computing and edge computing, including strategies
    and methodologies for seamlessly integrating resources from both realms.


    Chapter 10 puts into action the knowledge acquired from Chapters 1 to Readers
    will actively engage in hands-on activities through a step-by-step setup and implementation
    guide. Here, you will master the creation of an Azure virtual network, setting
    up an Azure IoT hub, installing IoT Edge, and deploying the container engine.
    Complete with shared Python code and detailed explanations, this chapter provides
    a comprehensive walkthrough of each process.'
  merge: -1
  img_proc: true
