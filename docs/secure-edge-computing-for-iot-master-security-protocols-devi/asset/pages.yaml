    This may result in the device accumulating logs over time and running out of disk
    space. While configuring local logging is optional, it is recommended to prevent
    such issues. Refer to the Production Deployment Checklist for more information
    on logging configuration.


    Follow these steps to configure your container to use the local logging driver
