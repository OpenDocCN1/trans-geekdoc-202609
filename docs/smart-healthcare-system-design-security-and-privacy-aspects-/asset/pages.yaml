  md: '# # Security and Privacy of IoT Devices in Healthcare Systems


    Himadri Nath Saha¹* and Subhradip Debnath²


    ¹Department of Computer Science, Surendranath Evening College, Calcutta University,
    Kolkata, India


    ²Department of Computer Science, Institute of Engineering and Management, Maulana
    Abul Kalam Azad University of Technology, Kolkata, India


    # ## Abstract


    Evolving Internet of Things (IoT) paradigms contribute significantly to the enhancement
    of current healthcare systems. It would be a universal fact to claim that the
    IoT provides many advantages in healthcare, including that of the opportunity
    to better track patients. Focusing on the patient''s end helps healthcare providers
    to quickly collect details and make data-based recommendations to enable quicker
    medical intervention. Healthcare firms, however, sometimes don''t consider the
    safety risks of linking such devices to the internet. There are many privacy and
    security issues that end-users must acknowledge. End-users can be prone to malware
    activity when permission is granted to any potentially insecure or any leaky third-party
    applications. Smart technologies offer many advantages in healthcare, but the
    same devices pose higher incidence to both confidentiality and protection. Some
    possible threats include hacks on frameworks, threats to privacy, data eavesdropping,
    etc. Our proposed system uses Wireless Body Area Network (WBAN) along with a cloud
    server to keep a patient''s record to make it accessible to the only concerned
    people by developing a role based assigning and least access privilege system.
    It collects the patients’ medical histories for future reference. This system
    is efficient and robust as compared to similar existing systems.


    **Keywords:** Centralized network coordinator, Internet of Things, healthcare
    systems, patient monitoring, centralized ledger, database, smart sensors, cloud
    application


    *Corresponding author: contactathimadri@gmail.com'
