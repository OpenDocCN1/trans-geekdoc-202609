  md: '# 13.2 AI-Assisted Methods


    We believe that fast and accurate identification of COVID-19 with the help of
    AI models can save lives and limit the multiplying of the ailment. In this work,
    we divide the entire methodology into two subsections [6]. The first subsection
    explains the role of AI tools such as ML, ANN, expert systems and DL techniques
    to predict and investigate the patterns of COVID-19 from various heterogeneous
    datasets (social networking data, public protein–protein interaction datasets,
    etc.). However, the second subsection describes the role of AI techniques to improve
    image processing tools'' performance to diagnose the COVID-19 virus from patient''s
    X-Ray and CT images. A series of published research works on these areas are explained
    in brief in this survey.


    # 13.2.1 AI-Driven Tools to Diagnose COVID-19 and Drug Discovery


    It is possible to predict the COVID-19 pattern and its saturation time with the
    help of Artificial Intelligence. There are some areas in which AI can contribute
    to COVID-19 fighting [7].


    +   - Alerts and early warnings.

    - Tracking, prediction and the finding of patterns.

    - Controlling dashboards of information through social networking sites.

    - Diagnosis and forecast

    - Cures and treatments.


    In the last few months, the most frequently searched words in various social networks
    and search engines are ‘CORONA’, ‘COVID-19’ and ‘Pneumonia’ [8]. So, AI and data
    processing techniques (classification [22], clustering [23], feature selection
    [24], etc.) help us to understand the longer term effect of COVID-19 by mining
    intelligent social networking data supported some specific keywords. However,
    this type of study helps the government in preparing the medical facilities to
    resist such an epidemic situation at the first stage. Besides that, the social
    networking data (like Twitter data) are often used to identify epicenters of COVID-19
    efficiently and during a faster way without consuming a large amount of resources.
    A region-based geographical heat map is often generated from Twitter data to keep
    track of the epicenters of COVID-19 [9].'
