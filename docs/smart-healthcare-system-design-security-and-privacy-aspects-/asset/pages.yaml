- pgno: 250
  md: '# 9.10.4.3 Third Layer


    “This is the upper layer or the foundation of the” cloud supplier. IoT machines,
    in fact, are in typically completed by cloud computing and storage capabilities.
    A domain-level blockchain is important to monitor the relationship between cloud
    services in order to allow each other access to patient data wherever it is stored.


    # 9.11 Conclusion


    The purpose of this research is to discover new IoT-driven healthcare technologies,
    sensors, or systems to provide healthcare practitioners with improved knowledge,
    helping them to take action to prevent and diagnose diseases. In addition, our
    research opens a forum for data protection experts to do further research to mitigate
    IoT healthcare sensor and system vulnerabilities. Healthcare is a major industry
    in the country, and since the IoT revolution, healthcare systems have become more
    effective and secure. Health experts and scientists have improved the diagnosis
    and prevention of diseases with the exponential development of IoT products. As
    a consequence, multiple sensors and systems powered by IoT have been launched
    and some are now being used successfully in hospitals and for personal healthcare.
    In a relatively short time span, these instruments gather a vast volume of data.
    Therefore, during the use of such instruments, data breaches may occur.


    We found that the most important advantage of using smart healthcare technologies
    and systems was performance. Around the same time, we have found that the protection
    and privacy of personal data were the most critical problem when using IoT healthcare
    devices. Researchers interested in biomedical science may focus their studies
    and experiments on advanced IoT sensors to detect health problems and diseases
    by measuring various body parameters. In order to ensure the secrecy and credibility
    of the information, information management professionals and IoT-driven healthcare
    manufacturers are advised to concentrate further on establishing users’ protection
    and privacy. Future researchers may pay further attention to the development of
    IoT-based devices or sensors that help other body systems-related medical conditions
    that have not been described in this segment.'
