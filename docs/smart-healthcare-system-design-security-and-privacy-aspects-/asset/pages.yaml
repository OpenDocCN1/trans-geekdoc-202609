    # Advances in Learning Analytics for Intelligent Cloud-IoT Systems


    **Series Editor: Dr. Souvik Pal and Dr. Dac-Nhuong Le**


    The role of adaptation, learning analytics, computational Intelligence, and data
    analytics in the field of cloud-IoT systems is becoming increasingly essential
    and intertwined. The capability of an intelligent system depends on various self-decision-making
    algorithms in IoT devices. IoT-based smart systems generate a large amount of
    data (big data) that cannot be processed by traditional data processing algorithms
    and applications. Hence, this book series involves different computational methods
    incorporated within the system with the help of analytics reasoning and sense-making
    in big data, which is centered in the cloud and IoT-enabled environments. The
    series publishes volumes that are empirical studies, theoretical and numerical
    analysis, and novel research findings.


    **Submission to the series:**

