    # ### 5.3.3 Blood Pressure (BP)


    The most important cardiopulmonary test, showing the blood pressure on the wall
    of the artery, is considered to be blood pressure (BP). As the heart contracts
    (systole) and relaxes (diastole), BP provides additional information on blood
    supply and can also indicate the distribution of cellular oxygen. It is affected
    by various different physiological features: peripheral vascular resistance, cardiac
    production, blood flow, and viscosity; and blood vessel elasticity. Using only
    a stethoscope on the patient''s arm and inflatable pressure belts, BP is usually
    measured. For autonomous BP assessment, this method is well adapted, along with
    a fully computerized inflatable cuff that measures BP by comparing peripheral
    pressure to the degree of arterial volume pulsing. Prolonged monitoring of the
    cuff can outcome in undesirable side effects, such as interrupted sleep with itchy
    skin and increased levels of stress. To explain final issue, new BP monitoring
    technologies have been developed. One is to forecast BP, all calculated on the
    chest or with the wrist-acquired PPG signal, depending on the transition time
    of the pulse signal between the photoplethysmography (PPG) and ECG (R-peak) pulse
    wave.


    # ### 5.3.4 Electrocardiogram (ECG)


    Among the most widely used biosignals, electrocardiograms (ECGs) have revealed
    information about the cardiac electrical cycle as a diagnostic instrument in the
    medical setting. Five peaks and troughs (called P, Q, R, S, T, and U) are known
    as the ECG waveform each of which reflects a difference in the heart''s electrical
    potential, resulting in muscle activity and as a consequence of heart movement.
    The ECG waveform is intended to measure the heart rate, as well as to predict
    and diagnose serious myocardial and coronary events. The study of ECG waveform
    rhythms holds an important role in diagnosing cardiovascular diseases (CVD), such
    as'
