    IoT networks [47].


    # ## 11.7 Case Study of DeWalt


    Problem: A manufacturing company called DeWalt manufactures tools like screwdrivers,
    jigsaws, floodlights, and other common tools. They have a huge factory with tons
    of people assigned for a series of operations, right from designing to packaging.
    With loads of labor and thousands of machines working together, it is quite challenging
    to monitor and keep these machines’ connectivity effective. Due to timely technical
    or manual errors, product delivery is being delayed. This not only increases delays
    but also affects the company and its customers [48].


    Solution: The issue reflects the importance of monitoring the machinery and labor
    of a factory. Hence DeWalt incorporated Cisco wireless infrastructure and AeroScout
    real-time location solutions. By mounting an aero scout tag over every cisco Wi-Fi
    network across each factory’s production line, any minor fault at any line is
    effectively monitored and tracked through the servers that connect the monitored
    data to the management. This helped improve visibility and motivated the labor
    to work better, ensuring synchronizing all the production lines effectively without
    much loss [48].'
