    # 7.3 Proposed System Design and Architecture


    IoT Devices and sensors measuring, tracking and recording the patient data are
    transferred to a Raspberry Pi which would be unique to every bed in an institution.
    The Raspberry Pi collects the data provided by the sensors in close proximity,
    encrypts it over and sends it to the private server setup locally within the compound
    of the institution. This procedure ensures that the data is secure when in transit
    (Figure 7.1). After the data is received and decrypted in the server end the text
    based data are parsed and saved in an


