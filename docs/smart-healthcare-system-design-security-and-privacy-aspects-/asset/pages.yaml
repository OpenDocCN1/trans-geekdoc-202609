  md: '# Implementation of Machine Learning Techniques for the Analysis of Transmission
    Dynamics of COVID-19


    C. Vijayalakshmi1* and S. Bangusha Devi2


    1Department of Statistics and Applied Mathematics, Central University of Tamil
    Nadu, Thiruvavur, Tamil Nadu, India

    2Department of Science and Humanities, JP College of Engineering, Tenkasi, Tamilnadu,
    India


    # Abstract


    This paper mainly deals with the design of Machine Learning model for the analysis
    of transmission dynamics of Covid 19. The entire globe is affected because of
    Corona virus. Ventilator dependent, Severe Acute respiratory and quarantine care
    ICU patients frequently face difficulties for their most basic human interactions,
    namely communication due to either respiratory illness, language problem or intubated.
    ICU patients have serious implications with respect to physical and psychological
    due to non communication problems. Researchers have developed different types
    of services like Speech language Pathologist so that Augmentative and alternative
    communication assistance can be given to all health professionals and caretakers.
    A probabilistic model is designed to analyse the new cases and death cases. Using
    machine learning approach Regression model is designed and future predications
    are displayed. The adequacy of the model is discussed along with the residuals
    of new cased and death cases. PCF and APCAF are obtained. This paper mainly deals
    with a probabilistic model to analyse and predict the new cases and deaths of
    covid 19. A new transformation of analyzing stationarity is carried out and based
    on this forecasting is executed.'
  merge: -1
  img_proc: true
