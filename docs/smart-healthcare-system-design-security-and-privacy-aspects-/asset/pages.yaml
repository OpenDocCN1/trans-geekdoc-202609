    # The Implementation of AI and AI-Empowered Imaging Systems to Fight Against COVID-19—A
    Review


    Sanjay Chakraborty^{1*} and Lopamudra Dey^{2}


    ¹CSE, JIS University, Kolkata, India


    ²CSE, Heritage Institute of Technology, Kolkata, India


    **Abstract**


    COVID-19 has already affected the world with this deadly virus, resulting in over
    3.5 lakh deaths. The behavior of this virus is extraordinarily peculiar and mutates
    frequently. So, the scientific community faces the problems to analyze and forecast
    the virus''s growth and transmission capability. The combined effort of powerful
    Artificial intelligence and Image processing techniques to predict the initial
    pattern of COVID-19 disease identifies the most affected areas in each country
    through social networking information and predicts drug-protein interactions for
    making new drugs vaccines. However, AI-empowered X-Ray and computed tomography
    image acquisition and segmentation techniques help us identify and diagnose the
    COVID-19 affected patients with minimal contact. In this chapter, our primary
    motivation is to sum up the essential roles of some AI-driven techniques (Machine
    learning, Deep learning, etc.) and AI-empowered imaging techniques to analyze,
    predict, and diagnose against COVID-19 disease. An essential set of open challenges
    and future research issues on AI-empowered procedures for handling COVID-19 are
    also discussed in this chapter.


    **Keywords:** Artificial intelligence, COVID-19, diagnosis, image processing,
    machine learning


