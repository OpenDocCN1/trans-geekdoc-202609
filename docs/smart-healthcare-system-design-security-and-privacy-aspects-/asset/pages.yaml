  md: '# ## 9.2 Medical IoT Application Domains


    This Medical IoT provides many benefits through healthcare apps, con-sidering
    the difficulties surrounding this domain [5]. First, because a patient''s vital
    signs can be tracked in real diagnosis, whichallows patients and healthcare personnel
    to interact immediately. This declines the budget of hospital treatment by lowering
    the number of visits. Another advantage of Medical IoT is to improve the health
    and lifestyle of patients. The direct access to vital patient signs enables early
    diagnosis, drug prescription, and medication injection through a wearable device.


    In the positions of physicians, medical practitioners, healthcare devices and
    receptionists, the future of Medical IoT aims to further include devices and applications.
    The general public, however, also has security and pri-vacy concerns, privacy,
    confidence and accuracy of certain medical IoT systems that are required.


    # ### 9.2.1 Smart Doctor


    In order to fulfil the function and duties of a real physician, the notion of
    autonomous robotics is one of the future goals. Some patients have raised doubts
    about this issue, while others have felt more comfortable talking about their
    private medical problems with a robot doctor than with a real surgeon. In spite
    of the contrary viewpoints, the word smart-doctor that is used in the near future
    can constantly be heard.


    # ### 9.2.2 Smart Medical Practitioner


    Smart-healthcare robots may also carry out minor medical duties, like the task
    of a nurse. In certain circumstances, in order to facilitate the tasks of the
    nurse, they can execute the role of a smart helper to a nurse. Depending on the
    medical conditions and requirements, the aim is to focus on the medical robotics
    to perform a minor or/and supporting healthcare role.


    # ### 9.2.3 Smart Technology


    It includes intelligent medical equipment and kits which paramedics now use to
    provide emergency assistance to patients who are desperately in need of medical
    treatment and assistance. One example is the use of these medical drones to accomplish
    such a mission. Medical drones have orig-inally been equipped in response to heart
    arrest emergencies, as they are'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'the fastest drones to reach the medical scene. The drones are programmed to
    travel to their targets, save time and save lives as a result, so paramedics can
    get stuck and not respond as quickly as possible. It encourages a focus on intelligent
    medical robots [13] in hospital surgery. Medical technology focused on Virtual/Augmented
    Reality and Artificial-Intelligence (AI) has also been used for numerous clinical
    purposes. Medical technologies based on AI are therefore relies to guarantee a
    greater rate of accuracy [17]. This involves exploring biochemical interactions
    [8], such as IBM Watson and Gene Network Sciences (GNS) AI systems for healthcare
    used to find the best treatment for cancer.


    # 9.2.4 Smart Receptionist


    Another trend in the Medical IoT sector is a smart receptionist; a medical robot
    is able to act like a regular receptionist, possessing the capacity to “think”
    and “understand” a specific Medical or trauma situation until the patient is referred
    to the proper department of healthcare. Such robots will also respond to telephone
    calls and book patient appointments, thus classifying urgent and regular appointments.
    Such a grouping may even be based on mathematical or machine-learning algorithms.


    # 9.2.5 Disaster Response Systems (DRS)


    These mechanisms rely on the concept of alerting clinicians and patients where
    high emergency medical occurrence of any patient (e.g. seizure, stroke, heart
    arrest, etc.) by transmitting critical indications to the hospital remotely [8]
    on the basis of a proactive risk evaluation method [2]. For a greater precision
    and quick response time, DRS are now being updated to become location-based [3].
    The Active-Protective intelligent band that can be mounted on the wrist of a patient
    and uses Bluetooth and AI to communicate data during real scenario.


    # 9.3 Medical IoT Concerns


    Medical IoT-related issues can be categorized into three key categories, each
    being presented by the common public and that relates to issues in the security,
    privacy and trust areas.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# 9.3.1 Security Concerns


    These devices are vulnerable to different wirelless/security threats because of
    the dependency of medical IoT devices around the practicein the unsecu red cordless
    communications. In fact, because of the lack of safety measures in which most
    clinical IoT devices as shown in Figure 9.3 the perpetrator will eavesdrop and
    decrypt received data and information, either because of nature, or due to inadequate
    security authentication mechanisms that could easily be prevented by a competent
    assailant. Another problem with protection is the potential to get unauthorized
    access even without detection, so such attacks cannot be known and stopped. This
    will result in higher rights, malicious codes being injected, or malware devices
    being infected. Medical IoT computers, on the other hand, may be hacked and used
    to initiate attacks against Distributed Denial of Service (DDoS). In Ref. [7]
    how medical equipment is vulnerable to botnet attacks may lead to physical attacks
    on individuals. For instance, an attack can potentially control a drug dose that
    kills a singre patient or has serious health consequences. In addition, when seized
    by terrorists, medical IoT systems may be used as a form of targeted assassination.
    In addition, as stated in Ref. [7], medical IoT devices may have a detrimental
    impact on patients''


