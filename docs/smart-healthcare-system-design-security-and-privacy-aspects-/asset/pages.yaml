    # ### 10.3 Data Filtering and Predicting Processes


    This study aims to reduce redundant data transmissions and thus help minimize
    energy consumption of the IoT device (RasPi), to help minimize transmission delay,
    amount of data and bandwidth used over the entire network (i.e., from publisher
    to the subscriber device) [21]. The proposed work also provides a real-time remote
    monitoring system to the end-user that allows checking and tracking of the status
    of the IoT-device. In such a study, the data aggregation is generally divided
    into two stages. The first stage is called the energy-efficient data forward (EEDF)
    algorithm. While the second stage is called the predicted non-dispatch data (PNDD)
    algorithm. The EEDF protocol senses, filters and forwards the data by RasPi to
    the MQTT broker. However, the PNDD protocol predicts and receives the data from
    the MQTT broker and then stores and plots these data on the monitoring server.
    The EEDF and PNDD algorithms were written in Python and implemented in the RasPi
    and monitoring server, respectively.


    In the following sub-sections, further details about the proposed algorithms are
    described by highlighting their techniques and strategies.


    # #### 10.3.1 Filtering Process


    The first purpose of the EEDF algorithm is to sense the analog data from the six
    sensors connected to the RasPi via the CPi. The RasPi is required to establish
    a connection with the MQTT broker before the actual data communication begins.
    Any device that is linked to the network and'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'establishes the connection with the MQTT broker requires an MQTT client. Therefore,
    an MQTT client is installed on both publisher (RasPi) and subscriber devices (monitoring
    server) to connect, disconnect, publish and subscribe data. The RasPi must specify
    a topic to publish data to the MQTT broker, and only the device that is subscribed
    to the same specified topic can receive that data from the MQTT broker. By establishing
    connections between the RasPi and the MQTT broker based on MQTT QoS (2), the important
    decisions taken are based on the EEDF algorithm.


    Each sensor senses 7 B of data, obtained by sensing events from the test section.
    Thus, the total data gathered by all sensors is 42 B. It is now proposed that
    the EEDF algorithm also checks and compares simultaneously collected data with
    the previous record for each sensor individually. If the collected data in each
    sensor is not equal to the previous record, then it is sent to the broker via
    the internet. Otherwise, the EEDF protocol detects no change in the data and then
    filters the duplicated data out and thus this data is not sent to the broker.
    As a result, the RasPi anten na goes into sleep mode. Of course, in the first
    round, all the collected data is sent to the broker because there is no previous
    data record for comparison. As a result, the proposed scheme minimizes the processing
    and transmission time for the RasPi. This, in turn, helps minimize the energy
    consumption of the RasPi. It also reduces the delay time and bandwidth used over
    the entire path of the network and improves the performance of the end-to-end
    system. The flowchart of the proposed algorithm to sense and forward the data
    is presented in Figure 10.10.


    # **10.3.2 Predicting Process**


    The first concern of the PNDD protocol is to establish the connection between
    the monitoring server and MQTT broker based on MQTT QoS (2). When the QoS (2)
    process is complete, the connection is created and the monitoring server can communicate
    with the MQTT broker and receive messages. However, the PNDD algorithm requires
    a database to store the data that comes from the MQTT broker. Therefore, SQLite
    was installed on the monitoring server to store, analyze and plot the data.


    After that, the PNDD protocol listens to the MQTT broker and gets a copy of the
    data forwarded by RasPi. The transmitted data could be a number of bytes or an
    empty row based on the EEDF publisher policy. The PNDD algorithm receives and
    stores the empty row of data when there is a connection between monitoring server
