  md: 'psychological status, as patients may actually be frightened when they are
    rounded by robots instead of humans, which leads them to have a heart attack.


    # 9.3.2 Privacy Concerns


    Passive threats including certain traffic monitoring contribute to privacy concerns
    as information about the identities of patients may be gathered and revealealong
    with patient clinical confidential information. As an intruder is able to recognize
    his/her clinical history and health conditions, this is a very dangerous threat
    to patients that leads to dramatic serious impacts on patients. Another justification
    for compromising patients'' pri- vacy, by targeting hospitals, is identity fraud.
    Several of these actual attacks lead either to leaks or to the publication of
    confidential data compromising the confidentiality and privacy of the patients.


    # 9.3.3 Trust Concerns


    The violation of the privacy of patients transforms into significant lack of identity.
    The idea of automation takes over the duties of physicians, nurses, and receptionists
    is becoming sceptical among patients. As a result, cus- tomers are more worried
    about having their health conditions monitored and controlled by a smart medical
    robot or a healthcare device.


    # 9.4 Need for Security in Medical IoT


    IoT applications in real time gather vast quantities of personal data from Company
    firms in hospitals, household and financial transactions. In order to access user
    data, heterogeneous real time IoT presents a need for proper protection algorithms.
    While several security algorithms exist, they do not provide the IoT environment
    with higher order security. It is diffi- cult to perform complicated data encryption
    techniques in IoT devices due to the energy limited nature of IoT devices. There
    is therefore a need for lightweight security algorithms that provide IoT data
    with a higher degree of security with minimal transmission and overhead computation
    on those kind of IoT devices.


    IoT systems are a favored target for attackers because of the existence of particular
    applications, such as the storage of confidential data and con- nected to large
    number of network devices. Additional vulnerabilities are emerging with IoT [6]
    beyond the real internet security problems. Specific'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'applications can pose a serious life or business risk [15–17]. Imagine a sce-

    nario in which an intruder takes control of a car. Other threats include

    private information theft (privacy/confidentiality), information alteration

    (authenticity), and system malfunctioning (availability and resilience).

    Furthermore, an affected device can pose potential threats to entire secure

    connections, such as when a hacked device, along with web camera, that

    is connected in the secure home network. So it is needed to create a secure

    network with IoT in healthcare as shown in Figure 9.4.


    Unauthorized access to data and equipment raises concerns regard-

    ing patient safety in the healthcare system. Data confidentiality is one of

    the key aspects of protection that must be taken into consideration when

    sharing data. In addition, it is important to minimise high computation

    overhead caused by existing cryptographic security algorithms and to

    withstand different attacks such as Brute Force, Eavesdropping, Man-

    in-the-Middle, etc. This creates a need for reliable, effective and lightweight

    security algorithms to be created. It is therefore important to build light-

    weight algorithms to monitor and manage data protection across different

    layers of the IoT architecture.


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_231_0.png)


    Figure 9.4 Smart medical network.'
