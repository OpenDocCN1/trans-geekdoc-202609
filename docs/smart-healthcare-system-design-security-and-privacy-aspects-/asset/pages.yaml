- pgno: 363
  md: '# ## 14.5 Conclusions


    This study aims at forecasting the daily new cases, new deaths and also finds
    out the relationship between daily deaths and daily new cases using time series
    and regression model respectively. We developed ARIMA and LR model for COVID-19
    data. The best result is obtained by using ARIMA (2, 2, 2) and ARIMA (0, 2, 1)
    model for daily nee cases and daily new deaths respectively. The first major finding
    of the study is that new cases will increase in future if the same monitoring
    scheme is continued and the death rate will not go for danger zoom in future.
    So we can conclude that the death rate is controlled by proper treatments. Linear
    Model results revealed that if the new COVID-19 cases will not increase, daily
    new deaths cases will not increase gradually. This helps the healthcare monitoring
    department to develop new scheme to monitor the COVID- 19 problem.


    # # References


    +   1. Box, G.E.P. and Jenkins, G.M., *Time Series Analysis: Forecasting and Control*,
    San Francisco: Holden Day (revised ed. 1976), 44, 575, 1970.

    2. Cook, R.D., Detection of influential observations in linear regression. *Technometrics*,
    1, 15\u201318, 1977.

    3. Pankratz, A., *Forecasting with Univariate Box-Jenkins Models: Concepts and
    Cases*, John Wiley & Sons, New York, 1983.

    4. Cummins, J.D. and Gropenotrod, G.L., Forecasting Automobile Insurance Paid
    Claims Using Econometric and ARIMA Models. *Int. J. Forecasting*, 1, 203\u2013215,
    1985.

    5. Montgomery, D.C., Peck, E.A., Geoffrey Vining, G., *Introduction to Linear
    Regression Analysis*, Fifth Edition, John Wiley & Sons, Inc, Hoboken, New Jersey,
    2012.

    6. Volkan, S., Edigera, A., Sertac, U., Berkin, Forecasting production of fossil
    fuel sources in Turkey using a comparative regression and ARIMA model, in: *Energy
    Policy*, vol. 34, pp. 3836\u20133846, 2005.

    7. Cooray, T.M.J.A., *Applied Time Series: Analysis and Forecasting*, Narosa Publishing
    House, New Delhi, 2008.

    8. Box, G.E.P., Jenkins, G.M., Reinsel, G.C., *Time Series Analysis, Forecasting
    and Control*, 4th edition, John Wiley & Sons, Inc., New Jersey, 2008.

    9. Nall, P.E. and Momani, M., Time Series Analysis Model for Rainfall Data in
    Jordan: Case Study for Using Time Series Analysis. *Am. J. Environ. Sci.*, 5,
    5, 599\u2013604, 2009.'
