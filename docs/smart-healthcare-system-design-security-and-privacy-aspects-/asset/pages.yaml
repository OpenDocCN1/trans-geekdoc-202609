    All of the monitoring systems communicate with the RFID and vice versa. A RFID
    system has two components which are a RFID tag or label and a reader. The RFID
    tag again has two components which are a microchip and an antenna. The microchip
    is responsible for the storage and processing of information. The antenna receives
    and transmits the signals. The RFID reader or interrogator send a signal to the
    RFID tag using the antenna and receives the signal through the antenna from the
    tag about the data encoded in the tag. The reader then automatically sends the
    information to the mobile or the computer through a communication interface. The
    RFID data can be read from a distant location and even outside the direct line-of-sight
    of the reader.


    The applications of the RFID include tracking objects, monitoring supply network
    between the producers and the suppliers, developing smart agriculture, etc. In
    our proposed architecture we have used the RFID system to collect and analyze
    the data about the patients'' current health conditions, the patients'' past medical
    reports, etc. by sending the data to the remote cloud server. We have implemented
    neural models on the cloud server platform. The server can analyze the collected
    data using the models and sends the reports to the users'' mobiles. We have trained
    our model with a large amount of clinical data.


    The sensors can send the data through the internet by using a networking protocol,
    LoRaWAN (Low Power, Wide Area Networking Protocol). LoRaWAN is designed to connect
    the battery powered devices to the regional, national, or global networks. LoRaWAN
    provides an end-to-end security in the bi-directional communication. It is a star-of-stars
    topology. There is a central network server. The gateways are there to relay the
    messages between the devices and the server. The gateways convert the RF (Radio-Frequency)
    packets to the IP (Internet Protocol) packets and vice versa. On receiving the
    packets each gateway forwards these from the devices to the cloud server through
    Ethernet or Wi-Fi. We have used the platform ThingSpeak for analyzing and visualizing
    the data in the cloud. LoRaWAN consumes the battery life during the long-range
    communication. For long-range communication the capacities of the gateways to
    receive the messages should be very high. LoRaWAN provides the security'
