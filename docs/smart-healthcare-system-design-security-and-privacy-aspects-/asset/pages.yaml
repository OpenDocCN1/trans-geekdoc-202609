  md: '# ## 13.4 Challenges and Future Research Issues


    The work for studying the COVID-19 follow-up is still at an early stage and remains.
    Different image processing techniques such as segmentation, edge detection, diagnosis,
    classification, and morphological changes effectively monitor the enlargement
    of the COVID-19 AI-empowered follow-up study. Below, certain open challenges and
    future research questions have been discussed. Integrated use of medical imaging,
    AI, NLP, oncology and combination may promote from the measurement process for
    COVID-19. Natural language processing AI helps to crunch enormous amounts of data
    that would be impossible to process for humans. AI can help us track the spread,
    patterns, trends, and changing behaviour of the SARS-CoV-2 virus with statistical
    analysis and form a cluster of symptoms leading to a new treatment or drug discovery
    path [12]. AI and NLP-based chatbot systems can be built to answer patient queries
    by reading the database''s tens of thousands of scholarly articles, ranking them
    and generating response snippets and summaries. Even deep learning can help to
    search databases quickly for intellectual purposes. We could focus on distinguishing
    patients with mild symptoms that may not be accurately visualized on X-rays or
    CT images instead of focusing on patients with pneumonia symptoms alone. Machine
    learning (ML) techniques implemented to enhance data of low eminence that would
    make biased and erroneous forecast for instances of COVID-19. Using different
    ML techniques (like Regression), insufficient time series data can also be improvised
    and analyzed. Deep learning CNN based models (ResNet, DenseNet, etc.) are preferred
    to be used to manage imbalance dataset of medical image data and decrease long
    training time. A dynamic programming approach can be useful to effectively manage
    large datasets of genomic or proteomic sequences and the help of a supervised
    deep learning method. We can use deep learning models along with NLP tools to
    handle low-quality, multidimensional, and highly unstructured satellite images
    of areas and social media data.


    # ## 13.5 Conclusion


    This research explains how COVID-19 and drug development can be predicted, diagnosed
    and categorized by AI-driven methods and AI-empowered imaging explanations. The
    smart AI instruments, deep learning strategies and AI-empowered imaging appliances
    are discussed in detail. These are primarily focused on demonstrating the efficiency
    of AI-enabled medical imaging for COVID-19, i.e., X-ray and CT. It is noted'
