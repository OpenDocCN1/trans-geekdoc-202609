    the defectionalization of many temperature-enhancing elements, such as protein
    deformity and decreased temperature-increased function. The core temperature (CT)
    and the skin temperature are divided by BT into two measurements. Skin temperature
    varies as the tempera-ture regulation mechanisms of the body control core temperature
    across a broader temperature range than core temperature. Blood circulation controls
    skin temperature and is also associated with heart rate (HR) and metabolic activity.
    In the body temperature control system, environment-al factors such as air circulation,
