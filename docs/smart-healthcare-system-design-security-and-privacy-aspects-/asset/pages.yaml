  md: '# 9.8 Execution of Trusted Environment


    Since many products for a variety are placed by unauthorised personnel in outdoor
    areas with easy access, it is important to ensure that the executing software
    environment has not been maliciously modified or transformed. A root-of-trust
    (RoT) environment and, finally, a chain of trust (CoT) with authentication and
    encryption [6] can be generated using strong authentication system protocols and
    its use of dedicated hardware and cryptographic techniques.


    # 9.8.1 Root of Trust Security Services


    GlobalPlatform has identified nine services that could be provided by Roots of
    Trust, based on its experience with the devices and markets addressed by GlobalPlatform
    through its members: authentication, confidentiality, identification, integrity,
    measurement, authorization, reporting, updating, and verification.


    With one or more security services, one can create a Root of Trust. However, unless
    it reveals the interface to the service in any way, the Source of Confidence cannot
    claim to deliver the service. For instance, consider the deployment of many Protection
    Services by a Root of Trust where the Verification Service can preserve the public
    key shielded position and be able to check the legitimacy of the next item in
    the Chain of Trust without revealing the Integrity Service and Measurement Service''s
    protected capability. In this scenario, the RoT is just verification RoT and thus
    cannot pretend to be a secrecy or calculation RoT, because such facilities are
    exclusively customised to and reserved for using the verification RoT.


    To securely store and protect sensitive information, a Root of Trust can retain
    one or more protected areas used. A protected area should be assisted by an interface
