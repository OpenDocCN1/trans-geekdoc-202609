  md: '![](img/bb4a43d3cc1537c84f048d14c493ee68_331_0.png)


    Figure 14.2 Linear regression model.


    ```

    $$S_{xy} = \sum_{i=1}^n x_i y_i - \frac{\left(\sum_{i=1}^n y_i\right)\left(\sum_{i=1}^n
    x_i\right)}{n}$$ $$\hat{\beta}_1 = \frac{S_{xy}}{S_{xx}} \text{ and } \hat{\beta}_0
    = \bar{y} - \hat{\beta}_1 \bar{x}$$

    ```


    Mathematically the $i^{th}$ residual is


    ```

    $$e_i = y_i - \hat{y}_i = y_i - (\hat{\beta}_0 + \hat{\beta}_1 x_i), i = 1, 2,
    ..., n.$$

    ```


    The above Figure 14.2 represents the data points along with the lines of Regression
    based on the Independent and Dependent variables. The sum of squares and the residual
    analysis is being carried out.


    (iii) Studying Adequacy of the Model


    Residual estimated is used to analyze the adequacy of the fitted regression model.
    The normality assumption can be verified from Normal P–P plot. The assumption
    of non-correlation on residuals can be tested by applying Durbin–Watson test.
    It is also called as the test for autocorrelation. The term autocorrelation refers
    to the relationship between the successive'
