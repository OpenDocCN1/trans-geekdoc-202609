    information and discourage unwanted dissemination, usage and use (for example,
    sensitive data stored in a protected area should only be accessed by an API when
    the API verifies the right of access to this sensitive information in an implementation).
    Certification policies, or the willingness of a vendor to provide value-added
    features for their goods, can determine the level of physical and logical security
    of the shielded site.


    These resources can be used in the first boot code for safety-related operations,
