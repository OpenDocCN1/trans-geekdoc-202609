  md: '# ### 10.5 Conclusion


    Redundant data increases the unwanted/unnecessary communication and processing
    of data which consumes energy and reduces network lifetime. Here a proposed method
    for more efficient data transmission has been presented for IoT-based real-time
    monitoring and communication networks. The proposed method reduces the communication
    costs sending/receiving unnecessary data and removes redundant data transmission.


    The test system was divided into two phases: Phase 1 involves six sensors to gather
    the data from the test section and forward it to the RasPi B. The RasPi filtered
    and performed data redundancy checks before sending the data to the end-user via
    the MQTT broker. It only sends data acquired from the sensors after removing redundant
    data. Phase 2 listens to the data that comes from the RasPi via the MQTT broker
    and predicts the data which was eliminated by the RasPi. Simulation results confirmed
    that the proposed scheme outperformed the no-algorithm protocol, minimizing the
    energy consumption, database storage, and total bytes transmitted by approximately
    3.5, 80 and 76%, respectively. Our proposed system also provided the end-user
    with a remote monitoring system that can periodically track and check the performance
    of the smart objects based on published and subscribed data.


    The EE DF and PN DD protocols developed here have been successfully demonstrated
    using RasPi B device in a controlled environment. It is judged that the proposed
    technique would be valuable if implemented in a remote monitoring scenario for
    mission-critical applications with a huge number of battery-powered nodes with
    limited network connectivity.


