    # **11.5     Challenges of Existing Systems**


    Indeed, IoT is widely being implemented across a wide range of industries. However,
    there is an underlying cost that these industries have to deal with in terms of
    security, data availability, and other issues. Given the opportunities that IoT
    is creating, companies make a tough decision to choose it. This section focuses
    on the issues that are restricting it from being used to its full potential by
    the enterprises [28, 41].


    # **11.5.1     Security**


    With the increasing number of devices on the cloud, the scope of unauthorized
    devices hacking into the network is huge. The various IoT driven'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'gadgets that participate in the networks may or may not be polished enough
    not to compromise their data. The data required for systems to function is openly
    shared across the network, increasing data vulnerability.


    The RFID (Radio-frequency identification) tag has data of any sort, and if it
    gets into the hands of any unauthorized user, it is not a tough job if he gets
    hold of front-end devices to alter and pave the way to further threats. Data on
    the cloud may not only be altered but can be lost permanently or even flooded
    across the network by a hacker. Interception, also popularly called the man in
    the middle attack, is another security issue.


    Hence many companies that work on sensitive and private data are not taking a
    step towards IoT-driven technologies and are looking for safer options elsewhere.
    Research and work are still in progress, and with all the new ideas being discussed
    on the table, there could be a promising future for IoT soon.


    # 11.5.2 Integration


    When manufacturing processes incorporate IIoT, they face a challenge to merge
    the information technology components and operational technology components. To
    ensure there is no loss of data and integrate effectively is the real challenge
    that factories face. Issues in synchronization and overall connectivity arise.
    Financially and practically, IIoT seems impossible for now in being integrated
    into businesses.


    # 11.5.3 Connectivity Issues


    Ensuring that the machines are working without producing errors is vital for better
    production. Without proper visibility over the machines'' condition, defects may
    arise in the machines, which could affect the overall production cycle. Synchronization
    could become more problematic without proper visibility of the various machines.
    On a global scale, this will be a crucial challenge with IIoT.


    # 11.6 Future Advancements


    IoT has hit several milestones on its path to success. The future is bound to
    be limitless with its increasing scope of advancement [42]. Limitations are on
    the verge of being diminished with new promising technologies taking shape to
    make IoT sustainable and the most sought-after technology for enterprises. Some
    of the advancements that the future holds are discussed below.'
