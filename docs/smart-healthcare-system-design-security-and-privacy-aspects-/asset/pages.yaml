    \ of Computer Science and Engineering, Institute of Engineering and Management,\
    \ Kolkata, India\n\n# ### Abstract\n\nThe advent of the Internet of Things (IoT)\
    \ and large data analysis in the healthcare field has led to data obtained from\
    \ areas where it was either performed manually or not at all before. The ability\
    \ to detect an infectious disease and preventing it from spreading requires knowledge\
    \ and monitoring in real-time. The IoT has been used to capture sensory data in\
    \ real-time; by monitoring individuals, health systems, ecosystems, even in some\
    \ of the globe’s most remote areas. Based on a study, could recommend precautionary\
    \ measures using data from the IoT network; further assess whether the suggested\
    \ control measures are being implemented correctly. In scenarios like COVID 19\
    \ pandemic, it is important to get monitoring on the detection of the cause of\
    \ the pandemic and on the spreading of the disease, especially in the developing\
    \ countries. Our proposed framework includes a network model that uses wireless\
    \ body sensors, wearable devices, and cloud computing to handle patient data in\
    \ the form of text or pictures, or cloud voice. A mobile phone application and\
    \ a website is built to keep track of the real-time data. Our system is robust\
    \ and more efficient compared to other existing systems.\n\n**Keywords:** Smart\
    \ healthcare, wireless body sensors, cloud Server, Internet of Things (IoT), health\
