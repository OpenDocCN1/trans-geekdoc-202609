    # 5.6  Future Research Direction


    For future work, the system can be further developed to check other factors in
    real-time like electromyogram (EMG), heart rate (HR), blood glucose (BG) level,
    skin perspiration, capnography, and other health parameters. The model can be
    further developed to measure the physiological parameters like motion evaluation
    and integrate cardiac implantable devices with this model.


    Additional sensors like the light and sound level can be further incorporated
    with this model. The sensors are also prone to attacks on the lateral channel.
    This can lead to misinformation caused by skewed values, which can affect agricultural
    production. Therefore, the data which can be specifically affected need to be
    masked before evaluating. For such protection, along with login authentication,
    and access control, the confidentiality of the information may be established.


    Future research work can also include using lightweight cryptographic algorithms
    to protect personal information from across all sensors coming in. For this module,
    future research can be a middleware architecture that focuses on providing an
    end-to-end security system for the owners whose data are uploaded from sensor
    nodes [13].


    We could incorporate the technology of Fog Computing into our future model. The
    Fog Computing Layer acts as a bridge between IoT sensors and the cloud computing
    layer. It can be used in real-time to process and interpret acquired data from
    IoT-based sensors. It can send immediate real-time alert or warning to the user
    as possible infected or uninfected about a specific category of user. Besides,
    this device can be linked to the cloud layer to store, interpret results, and
    compile each user''s medical record. The analysis of the data collected can be
    performed based on this information and using machine learning algorithms. Based
    on this information and'
