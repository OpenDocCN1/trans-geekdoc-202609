    that explains his environment. A strong device that will serve as a key to the
    higher layer blockchain is a primary node in this blockchain. Notice that there
    would be a proper blockchain for each patient.


    # *9.10.4.2  Second Layer*


    “This is the central layer” or “authority” layer; it includes representative nodes
    for all medical stakeholders that are involved in patient-related data, such as
    hospitals, medical facilities, laboratories, etc. Members of this blockchain are
    also the gateways in the first layer.


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_249_0.png)


    **Figure 9.11** Blockchain based IoT smart healthcare.'
