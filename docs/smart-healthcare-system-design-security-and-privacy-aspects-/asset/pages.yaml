  md: 'In the decision making process, the following steps are carried out:


    +   Define the problem by identifying the set of alternatives,

    Identify the necessary requirements for determining the

    alternatives.

    ➤ Criteria should be able to differentiate the substitute in

    terms of its performance.

    ➤ Lesser number of criteria is preferred.

    ➤ Criteria can be either of assistance type (positive) or of

    cost type (negative).

    Choose a form of conclusion production.

    Test substitutes alongside requirements.

    ➤ Rating the choices or selecting the right alternatives.

    Validate solutions against statements of issues.

    ➤ Make sure that the explanations produced are right.

    Report the choices to stakeholders.


    # **3.3.1 Simple Multi Attribute Rating Technique (SMART)**


    The SMART performance developed by Edwards in 1971 is a simple linear additive
    model. It calculates and assigns the overall utility assessment of a given substitute
    as product of the total sum of the routine achieve of both criterion and the weight
    of that criterion. The technique is more useful due to its simplicity.


    The performance score of $i$th alternative is calculated as follows:


    ```

    $$\text{Utility}_i = \sum_{j=1}^{m} w_j * U_{ij} \tag{3.2}$$

    ```


    Where, is the weight value assigned to $j$th criteria, is the performance score
    of the $i$th alternative on $j$th criterion. ‘m’ is the number of criteria. The
    best alternative is one which has the highest utility value. Alternatives are
    ranked based on their utility value.


