  md: '# 7.1 Introduction


    There are around two billion customers around the globe who check and browse contents,
    access the multimedia resources, email and engage in social networking. But with
    time, the objective of the Internet kept changing. It started with it being a
    network serving to share data between devices. As the number of devices began
    to grow exponentially over the years it is now expected to serve as a platform
    over the world to interconnect devices. These devices do not necessarily mean
    smart devices but the traditionally dumbest objects lying around, which are made
    to be smart with some modifications to be referred to as ‘Things'' later on. This
    enabled a new way for those objects or Things to work, communicate, interact through
    the internet to operate simultaneously automating tasks and reducing manual workloads
    in different sectors. This internetworking of smart object or Things embedded
    with sensors, softwares, technologies with the intent to exchange or share data
    with other devices and collect the data is well known as the Internet of Things
    (IoT).


    The cost of the IoT Devices, sensors, mobile devices and the network connectivity
    are decreasing and will continue to drop. Also the networking has gradually been
    changed from wired network to wireless network. Communication technology has become
    faster, cheaper and changes the way people access information. Adoption of RFID-based
    technology has gradually changed the course of usage of the Internet of Things.
    The IoT uses hyperlinking technology aiming to connect the real physical world
    to the virtual internet [1].


    Healthcare is one of the top challenges that every developing and developed country
    faces in the present day. The healthcare industry invests massively in information
    technology but still the promised improvement in patient data safety and productivity
    has not been up to the standards. Even standing in the year of 2020 almost all
    organizations still rely on the conventional paper medical records and handwritten
    notes to inform and make decisions. The digital information is concealed and stored
    in between the departments and the applications, thus the effective sharing of
    the patients data is very rare and complex. The answer to this issue is the introduction
    of IoT Technology with the integration of Cloud. This enables the healthcare organizations
    to direct them towards the clinically relevant services that are needed or required
