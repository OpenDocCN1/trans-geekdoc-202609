  md: '# 14.3.2 Time Series Model


    (a) Testing the Stationarity of Time Series: Principles of stationarity is depicted
    in Figure 14.4 with respect to time dependent mean, variance and covariance.


    By using the method of second differencing non stationary is changed to stationary
    so that future predictions are carried out. The existing techniques are Auto Regressive
    (AR), Moving Average (MA) and Auto Regressive Moving Average (ARMA) [1, 7–9].


    (b) Autocorrelation Function


    The degree of similarity between given infographic data and a lagged version of
    itself over successive intervals are being depicted in Figure 14.5 which is non-stationary
    in mean.


    ```

    $$\eta_{k}=\frac{\sum_{t=k+1}^{n}\left(Y_{t}-\overline{Y}\right)\left(Y_{t-k}-\overline{Y}\right)}{\sum_{t=1}^{n}\left(Y_{t}-\overline{Y}\right)^{2}}$$

    ```


    (c) Partial Autocorrelation Function (PAF)


    The summary of the relationship between an observation in the current predicted
    values with the previous time steps by removing the intervening observations as
    displayed in Figure 14.6.


    ```

    $$Y_{t}=b_{0}+b_{1} Y_{t-1}+b_{2} Y_{t-2}+\ldots+b_{k} Y_{t-k}\ k=1,2,\ldots$$

    ```


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_333_0.png)


    **Figure 14.4** Stationarity analysis.'
