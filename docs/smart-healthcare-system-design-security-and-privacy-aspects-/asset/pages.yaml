- pgno: 330
  md: '# 14.2 Data Analysis


    Data being collected from the WHO and the same has been analyzed using Statistical
    Techniques. Data has been pre-processed and normalized by using the existing Statistical
    techniques.


    # 14.3 Methodology


    # 14.3.1 Linear Regression Model


    # (i) Identification of Model


    Firstly, scatter plot of the predictor variable and regressors are used to identify
    the relationship among them. It is visualized in two-dimensional geometry. The
    data points are plotted and the Linear Regression model is defined as


    ```

    $$Y = b_0 + b_1X + \varepsilon$$

    ```


    where Y is the response variable, b$_{0}$ is the intercept, b$_{1}$ is the regression
    coefficient, X is the predictor variable, and $\varepsilon$ is the error term
    [10, 13].

    For the realization of the response and predictor variables, the model can be
    determined by obtaining the estimates to the unknown parameters or regression
    coefficients. The regression coefficients can be estimated using the method of
    least squares subject to the following assumptions:


    +   i. The relationship between the response variable Y and the regressor X is
    approximately linear.

    ii. The error term has zero mean and constant variance

    iii. The error terms are normally distributed and

    iv. The errors are uncorrelated.


    # (ii) Estimation of parameter


    The method of least square is used to estimate $\beta_{0}$ and $\beta_{1}$. To
    estimate the model parameters first calculate, the following terms,


    ```

    $$S_{xx}=\sum_{i=1}^{n}x_{i}^{2}-\left(\frac{\sum_{i=1}^{n}x_{i}}{n}\right)^{2}$$

    ```'
  merge: -1
  img_proc: true
