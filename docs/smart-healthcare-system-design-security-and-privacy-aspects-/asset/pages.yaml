    # **3.1.1 Pre-Processing**


    Preprocessing is the initial step carried out in data analytics which transforms,
    encodes or converts into a form that a machine can easily carry out the analysis.
    The data collected from the IoT-based healthcare system are highly vulnerable
    to inconsistent, missing and noisy because of their voluminous information and
    it cannot be directly processed as it may contain noise, unwanted information
    or irrelevant information. The data preprocessing helps in converting raw data
    into a useful format that helps in reducing the processing time, avoiding errors
    and make the data ready for the next step. This unprocessed data may produce unbiased
    result which cannot be used for data analytics. Therefore, it should be processed
    before applying any algorithm. Data preprocessing methods like data cleaning,
    munging, normalization, reduction, and removing noisy data are applied. Data cleaning
    methods are used to identify the outliers in the data which help to create a model.
    The unwanted data present in the dataset can cause confusion in the mining process
    and may produce the unreliable output. It is the process of removing the inaccurate
    data and removing the incomplete information present in the dataset. It helps
    in removing the inconsistent data that is caused because of human errors during
    entry or during transmission. To handle the missing and irrelevant data, data
    cleaning methods like removing missing values and noise in the data using clustering
    is carried out. Missing values are ignored or interpolation methods are applied
    to fill in the missing values. Similar data are grouped together and unfamiliar
    data are detected as outliers and is removed. Data munging, also called as data
    wrangling is carried out to manually transform and clean the IoT data. It removed
    unwanted information and creates relevant information needed for processing. Data
    normalization scales the data with attributes of various scales. It minimizes
    and avoids duplicate data. It produces new range from the existing range which
    that allows processing data effectively.'
  merge: -1
  img_proc: true
