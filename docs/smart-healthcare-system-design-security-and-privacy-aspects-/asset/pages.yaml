  md: '+   * Optimizing the loss function

    * Weak learner is used to make predictions

    * Build an additive model to reduce loss function of weak learners.


    Loss function for a classification problem can be logarithmic loss of the predictive
    model technique. Decision trees are used as weak learner. Trees are constructed
    using the best split point with scores of Gini index or Information Gain to minimize
    the loss. The error loss can be minimized while building trees. Modifying the
    parameters to reduce the residual loss is worked out as the last feature.


    # 3.1.2.4 Random Forest


    Random forest includes many individual decision trees that combine together as
    ensemble classification. The concept of training the ensemble decision trees is
    known as bagging. It’s the idea of combining the learning models which increases
    the result. The merged prediction (as depicted in Figure 3.3) is more accurate
    and stable. Instead of identifying the best feature for splitting a node through
    parameter calculation, it can be random subset of features. The internal nodes
    in a decision tree represent the characteristics and the edges represent the prerequisite
    for rules to be formed.


    Random forest algorithm proceeds in such a way that, random samples are selected
    from the dataset and using which decision tree is constructed. The process gets
    repeated for almost all samples. Voting is performed on the predicted results
    and the on most voted will be the final prediction class.


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_82_0.png)'
