    electrodes for the transduction of ionic current from the core into electron current
    through metallic wires. Some other ECG sensor types are non-contact capacitive
    electrodes. Despite coming into direct contact with the skin, these electrodes
    can acquire ECG data, but they are far more sensitive to biomedical signals compared
