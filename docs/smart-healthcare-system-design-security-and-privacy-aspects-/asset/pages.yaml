  md: '# Efficient Data Transmission and Remote Monitoring System for IoT Applications


    Laith Farhan¹*, Firas Maan Abdulsattar², Laith Alzubaidi³, Mohammed A. Fadhel⁴,
    Banu Çalısuşlu⁵ and Muthana Al- Amidie⁶


    +   ¹College of Engineering, University of Diyala, Diyala, Iraq, Manchester Metropolitan
    University, Manchester, UK

    ²Refrigeration and Air Conditioning Engineering, Dijlah University College, Baghdad,
    Iraq

    ³School of Computer Science, Queensland University of Technology, Brisbane, Australia

    ⁴College of Computer Science and Information Technology, University of Sumer,
    Dhi-Qar, Iraq

    ⁵Department of Industrial Engineering, Marmara University, Istanbul, Turkey

    ⁶Faculty of Electrical Engineering, University of Babylon, Babylon, Iraq


    Abstract


    The Internet of Things (IoT) has a huge influence on the modern world and how
    the Internet communicates with it. In order to allow IoT networks, the wireless
    sensor network (WSN) is a promising wireless communication system. These networks,
    however, have limited energy (battery) resources and energy savings in these networks
    have become a pressing need and growing efforts have been made to reduce energy
    consumption by efficient routing, transmission methods, aggregation techniques,
    etc. Aggregation and transmission of data are considered as the main reasons for
    energy consumption by WSNs and IoT devices. These devices waste some of their
    energy in processing and transmitting redundant and unnecessary data. Therefore,
    this chapter presents means to eliminate redundant data and consequently reduce
    the number of data transmissions. Consequently, energy consumption of the IoT
    device is reduced. The chapter also includes a remote monitoring system for the
    end-user that can track and check the performance of these smart objects during
    the real-time communication.


    Keywords: Internet of Things (IoT), wireless sensor networks (WSN), remote monitoring
    system, energy efficiency, data management


    *Corresponding author: Lal-bayati@mmu.ac.uk*'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# **10.1 Introduction**


    In daily life, the Internet of Things (IoT) is becoming increasingly ubiquitous,
    linked to an ever-greater range of diverse physical objects [1]. Wireless sensor
    networks (WSNs) are at the heart of the IoT [2]. For allowing IoT apps, it is
    one of the most promising wireless communication systems. The IoT and WSNs'' main
    vision is to link a large number of smart devices together in numerous interconnected
    and automated networks, making the Internet much more useful [3]. It is a futuristic
    model where all possible devices can communicate with each other regardless of
    their scale, processing power and network connectivity, in a seamless environment
    [3]. Via sensing, data harnessing and decision-making, applications are smart,
    often without human interference.


    The uses of IoT and WSNs often require a dense deployment of sensor nodes over
    the area to be monitored [4]. Dense deployment will often produce highly related
    and redundant data which need to be processed for redundancy checks and routed
    appropriately in a single or multi-hop manner to the ultimate receiver [5]. Sensor
    nodes normally rely on limited battery power and each sensor is contained three
    main parts, sensing unit, computing unit and communication unit [6]. All three
    units require power for operation. According to an investigation by Ref. [7],
    the communication unit uses 60% of the energy available, and the sensing unit
    consumes 30%. As a result, transmitting multiple copies of the same packet consumes
    proportionally more energy and leads to reduce the network lifetime. Thus, adopting
    a suitable aggregation method that allows the connected devices to sense useful
    data and share only these data when required is highly recommended.


    In this chapter, as an example of the many industries that use real-time networks
    to promote the operation of manufacturing processes is discussed [8]. We choose
    a gas turbine engine blade as an application of the IoT to sense, forward and
    monitor data over the internet, based on the cloud infrastructure. The objective
    of this chapter is to filter and eliminate redundant data, decrease the data transmitted,
    and reduce the amount of data transmitted over the network. This should improve
    energy efficiency and performance of the entire system. It also proposes a real-time
    monitoring system that allows the end-user to interrogate the transmitted data
    and quickly check the machine''s condition in real-time.


    # **10.2 Network Configuration**


    This section provides a description of a suitable aggregation technique to reduce
    the data redundancy of a typical IoT monitoring system. A'
