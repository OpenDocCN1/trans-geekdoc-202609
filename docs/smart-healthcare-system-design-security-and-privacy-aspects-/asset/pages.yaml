    # 12.4.1 First Industrial Revolution (1765)


    From the end of the 18th century to the beginning of the 19th, the first industrial
    revolution began. The modifications arising from this revolution were in the form
    of mechanization. This mechanization leads to the industry''s replacement of agriculture
    as the backbone of our country''s economy. Later, the steam engine''s invention
    resulted in creating a new type of energy that helped speed up the manufacturing
    process.


    # 12.4.2 Second Industrial Revolution (1870)


    Second Revolution is the most important one because automobiles and planes began
    only in this period. It took almost a century for the Second revolution to start.
    It started at the end of the 19th century. Much technological advancements took
    place during this period in the industry; it led to the emergence of another new
    energy source using oil, electricity, and gas. The creation of the Combustion
    engine was asignificant result of this revolution. It also leads to the development
    of chemical synthesis and methods of communication and demand for steel.


    # 12.4.3 Third Industrial Revolution (1969)


    Again, a century after the Second revolution, Third Revolution came into existence.
    It leads to the emergence of Nuclear energy. It also resulted in the rise of telecommunications,
    computer courses, and electronics. The invention of Programmable Logic Controllers
    and Robots lead to the evolution of high-level automation.'
