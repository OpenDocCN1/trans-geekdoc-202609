    # ## Abstract


    The Internet of Things (IoT) has amalgam with many fields. One of these is the
    eHealth monitoring of patients. mHealth monitoring is the most prominent subdomain
    of eHealth. In mHealth, IoT enables the merging of various devices, including
    wearables (watch and sensors) and holding (smart mobile phone) devices. Therefore,
    the application development of mHealth is a penetrated domain in the research
    community. Different research work exists to develop mHealth applications to monitor
    different diseases either remotely or physically. Mostly the mHealth applications
    work with the context of the patient that includes the type of disease and observing
    the environment. The development of these applications faces several issues, such
    as security, smartness, decision making, size of the application, and timely actions.
    This study presents the issue with the health sector and with fuzzy logic while
    using for health enhancements. Moreover, this work highlights key factors to be
    addressed in mHealth such as mobility-awareness, location-based medication, and
    the security of eHealth''s data, distance, and measurement. These all features
    are very imperative for the health application to improve wellness.


    **Keywords**: Smart health, mobility of patient, remote monitoring, fuzzy concepts
    for health


