    # ## 11.3.2 Wearables


    Smart bands, Smartwatches, Smart glasses, etc., have become an integral part of
    every individual today [22]. Although fulfilling fashionable purposes, these wearables
    are vital for sensing body data like pulse, body heat, and other important data
    that can provide instant biofeedback to the user. The sensors or microprocessors
    which are embedded in these wearables have the ability to send and receive data
    via the internet. Wearable technology has been booming for several years now,
    improving the health and fitness of people. These systems can be worn, or tattooed
    to the body, or embedded into clothing [23]. The wearables era began with fitness
    tracking watches called Fitbits, which further evolved to smarter applications
    over the years.


    Although these wearables positively impacted the fashion industry, their focus
    has lately been on more practical uses. Pet tracking and child tracking devices,
    air quality and pollution hotspot detection wearables, heart and brain activity
    monitoring tattoos are just some of the many examples of wearable technology [24].


    # ## 11.3.3 Connected Cars


    Cars have been a revolutionary invention in the world. Today we observe two kinds
    of communication in cars. Car to infrastructure communication is one where all
    the sensors and controllers communicate data to the system to control the vehicle’s
    brakes and speed [25].


    Another interesting communication is a vehicle-to-vehicle communication, wherein
    all the sensors and other devices of a car are connected in a network to the neighboring
    car; this helps control the speed, avoid accidents and improve traffic conditions
    [26].


    # ## 11.3.4 Smart Grid


