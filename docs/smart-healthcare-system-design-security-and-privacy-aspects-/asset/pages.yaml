    # ## Abstract


    The proposed work deals with the design and development of touch and native

    voice-assisted prototype to enable the intuitive communication & interaction

    between health professionals and patients who are affected with Severe Acute

    Respiratory Infection (SARI), Ventilator-dependent and admitted in Quarantine

    care. It also ensures the development of the multilingual capability to communi-

    cate effectively in most speaking ten Indian languages, so that the patients will

    be relieved from pains etc., as their queries are being addressed by health profes-

    sionals. In this prototype, touch based gesture patterns can be effectively used
    as

    an interactive module and helps the doctors to monitor and answer to the queries

    of ICU patients regularly by updating it to the caretakers such that the patients

    are at ease to express their emotions or pains. The proposed prototype will be

