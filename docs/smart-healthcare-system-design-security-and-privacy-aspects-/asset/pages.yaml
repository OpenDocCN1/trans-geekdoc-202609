  md: '# # A Secure Framework for Protecting Clinical Data in Medical IoT Environment


    Balasamy K.*, Krishnaraj N., Ramprakash J. and Ramprakash P.


    Department of Information Technology, Dr. Mahalingam College of Engineering and
    Technology, Pollachi, India


    ## Abstract

    The Internet of Things (IoT) is a booming research area in recent world, which
    has many potential problems to solve. It grants anyone to interface anything with
    the web. Then again, secure association, correspondence and sharing of data are
    additionally under investigation in IoT condition. Communication and storage of
    information on any IoT device makes genuine security issues. As the use of the
    smart devices have steadily increased across different applications, this chapter
    concentrates on fusing IoT in medicinal domain to upgrade the patient focused
    clinical consideration. In any case, guaranteeing the security of the information
    produced and gathered by the IoT devices is the most testing issue in medicinal
    services administrations. The primary objective of this chapter is to design a
    framework for securing the IoT information produced in the medicinal services.
    Thus, security mechanisms utilized in the IoT environment must be capable of making
    communications from end to end and must be embraced in low cost IoT devices. The
    proposed framework achieves high throughput with less latency, which results in
    better efficiency.


    **Keywords:** Internet of Things, healthcare, security, encryption, medical data


    # ## 9.1 Introduction


    The digital world is rapidly moving to a model where billions of electronic devices
    will be interconnected by computer networks, especially the'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Internet. This technologies can interact with the human space, carry their
    knowledge to the electronic content and make the digital and physical realms inseparable.
    The Internet of Things (IoT) concept in which devices are uniquely identified
    and accessible via the network is represented in this scenario. An immediate result
    is the implementation of creative resources and knowledge on the Internet [1].
    There are extensive possibilities for IoT applications, such as agriculture, distribution
    of electricity, healthcare, and [2] Transportation.


    IoT systems interact directly with the cloud in the conventional method [3]. For
    certain applications, the volume of data from sensors to the cloud to connect
    is however, prohibitive. Connected cars, for instance, can produce voluminous
    data even in megabytes (MB) for every second [4]. In addition, few applications
    need rapid reaction, such as face recognition need dedicated artificial intelligence
    (AI) based hardware for processing in devices like smartphones. The fog and edge
    layer paradigm has therefore been applied to the IoT [4] architecture. Data processing
    and local decisions can be performed by fog and edge systems, eliminating additional
    cloud communication [5]. The implementation of this modern model, however, is
    trailed by important side special effects that need to be properly handled, such
    as cost and security [6], for example.


    IoT has been given a considerable concern as it has vast opening potentials for
    a huge number of cutting-edge application domains. IoT is a network of physical
    devices that interface and transfer information with computers, which includes
    mobile phone, home appliances, automobiles and some more, from a more substantial
    point of view. Most multinational businesses and start-up attempts have hooked
    up with IoT innovation in the hope of profiting from whatever business opportunities
    it can offer. IoT has a major impact on the financial sector, farming, supply
    chain management, management of business processes, remote monitoring, and so
    on. The present situation allows us to spend millions of dollars on business as
    a result of the improvements in the IoT. Since there are more opportunities available
    for IoT business, there are security problems where all devices are connected
    via the internet.


    # **9.1.1 Medical IoT Background & Perspective**


    # *9.1.1.1 Medical IoT Communication Network*


    Real-time data communication between devices in medical network took place across
    four major key communications infrastructure. They'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'are Body-Area Networks (BAN), Home-Area Networks (HAN), and Neighbor-hood Area
    Networks (NAN).


    A BAN is a communication platform which is analyzed by either a tracker or a lightweight
    sensor for the communication of patient vital signals as shown in Figure 9.1.
    In Ref. [17], biomedical signals can be used to secure contact between medical
    devices. Therefore, a low-power bio-identification mechanism was proposed in Ref.
    [12], via an Inter-Pulse Interval (IPI) to protect contact between sensors in
    the BodyArea Network. A physical sign that approves with a hidden code of the
    symmetric key crypto-system for BAN sensor communications was used in Ref. [11].


    Finally, the medical information obtained is submitted in two separate ways to
    the controller:


    +   * *Smart-Phone*: transmits the data collected from the base station (BS) via
    a mobile network that directs it before it enters the medical information centre.


    +   * *Cordless Medical Device*: transmits information through one of many protocols
    for wireless communication, such as Wi-Fi, Bluetooth or Zig-Bee.


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_223_0.png)


    Figure 9.1 Body area network [18].'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'A HAN practices a controller that manages connectivity to transfer the data
    collected from the access point (AP) located at the home of the patient.


    A NAN helps operators to associate with the internet quickly [14]. The major role
    is to create cordless communication within neighbouring regions, such as home
    communities. It can be centred on an omnidirectional antenna that enables a range
    of at least half a mile to be protected by a single access point. In addition,
    NAN depends on a directional antenna to boost the frequency of the signal as shown
    in Figure 9.2. The communication device also transmits the information to a base
    station, enabling the data to be transmitted to residential house and immediately
    collects from the source device.


    They differentiate pharmaceutical products and according to their needs. In reality,
