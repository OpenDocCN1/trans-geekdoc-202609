    # 7.7 Conclusion


    In our proposed model we have designed a system through which sensor data can
    be easily be transferred from the premises to a cloud storage securely step by
    step. We have also discussed a system in which the privacy of the patient data
    can be maintained and using a least access policy the patient data can be analyzed,
    viewed, observed by the health officials accordingly in a smooth transition. Further
    the system can also help facilitate the patient and his/her relatives to track
    her progress and view periodic reports sitting from their homes itself and also
    go to diagnostic centers or pharmacies and perform tests and buy drugs and keep
    all those in record for future references. Also through the system the pharmacist
    who is selling the drugs can verify the patient¹s identity and check if the patient
    is allowed to/has been prescribed to buy that drug by a certified doctor or not.
    The system also allows emergency response systems to track the patients basic
    info i.e. name, age which is relevant, his/her illness during patient transfers
    making it more safer for the patient to adjust as the medical staff would be prepared
    accordingly. In this due process many of the crises in the present situation can
    be overcome and met. Rising shortages in healthcare systems, delivery costs, information
    sharing between entities and the shortage of healthcare professionals for better
    treatment can be easily overcame and enhanced services can be provided. Our proposed
    system aims to be robust and more efficient compared to other existing systems
    and provides a more secure approach to utilizing IoT in healthcare systems.'
