    # 5.3.2 Blood Oxygen Saturation (SpO2)


    Blood oxygen saturation (SpO2) is an incredibly useful critical structure and
    is effortless to calculate using the concepts of pulse oximetry and photoplethysmography
    (PPG) technologies. The PPG approach allows the acquisition of waveform variance
    of the blood vessel, and it is feasible to approximate blood oxygen saturation
    when considered using two wavelengths (normally 660 nm and 905 nm). As an indicator
    associated with heart rate, sometimes, medical professionals recommend a pulse
    signal or pulse rate. Pulse signal or pulse rate can be calculated using the principles
    of pulse oximetry, a tool often used to calculate saturation of blood oxygen,
    and hence must not be regarded the same as heart rate. Pulse rate is characterized
    as the palpable harmonic development and contraction of an artery created by the
    elevation of blood volume forced into the vessel as a result of heart contraction
    and relaxation. This metric, like power, amplitude, and pulse regularity, presents
    detailed data than HR. This is related to the range of hemoglobin absorbance changes
