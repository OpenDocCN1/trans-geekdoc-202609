    # Abstract


    The term, “Healthcare 4.0” has been introduced from the Industry 4.0. The virtualization
    and automation in healthcare is included in Healthcare 4.0. The Industry 4.0 can
    provide the automation and data communication by using Cloud Computing, Internet
    of Things (IoT), Big Data, 4G and 5G technologies, cryptography, Content-Based
    Image Retrieval (CBIR), Augmented Reality (AR), etc. We can think of the Healthcare
    4.0 as the application of the Industry 4.0. The health related processes include
    home care of patients, remote health diagnosis, personalized home treatments,
    etc. Healthcare 4.0 consists of computers, communicating interfaces, bio-sensors,
    bio-actuators, etc. In Healthcare 4.0 the surgical operations on the patients
    can be monitored remotely. The mobile gadgets use the bio-sensors. Our proposed
    system uses machine learning techniques on the collected data by the sensors for
    analyses. Our system collects the patients’ medical histories for analyses. In
    the current COVID-19 pandemic situation getting a bed for the treatment is very
    much difficult, especially in the developing and highly populated countries. Our
    proposed healthcare system 4.0 is built for transfer of the treatments from the
    hospitals to the patients’ home with a high accuracy rate of detection of the
    diseases and tests.


