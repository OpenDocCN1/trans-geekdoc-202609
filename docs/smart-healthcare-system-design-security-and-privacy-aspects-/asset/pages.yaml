  md: '# # Data-Driven Decision Making in IoT

    Healthcare Systems—COVID-19:

    A Case Study


    **Saroja S.,\* Haseena S. and Blessa Binolin Pepsi M.**

    Mepco Schlenck Engineering College, Sivakasi, India


    # ## Abstract


    This research express an impression of automated decision-making techniques that
    have been suggested for scrutiny of data from IoT based healthcare systems. IoT
    data analytics plays a vital role in this modern era since data from connected
    devices reveal meaningful results with better insights for the future. The chapter
    involves the design of a decision-making system that collects data from IoT based
    healthcare systems, preprocess and analyzes data, and generates detailed information
    reports for better diagnosis. Data preprocessing methods such as data cleaning,
    munging, normalization, reduction, and removing noisy data are applied. The blend
    of IoT data with analytics technique results to be beneficial in healthcare systems.
    The collected IoT information like pulse rate, temperature, oxygen level and heart
    rate from connected devices can be used to analyze the need and severity in the
    preliminary stage itself using appropriate machine learning techniques. Multi
    Criteria Decision Making (MCDM) techniques such as SMART, WPM, and TOPSIS are
    also applied for conclusion production procedure to generate detailed informative
    diagnostic reports. Being healthcare data, the overall objective is to aid business
    organizations with better decision making processes through data analytics thereby
    deploying the right IoT strategy. The result of the next-generation expert systems
    can utilize the results for further analysis in diagnosis and treatment.


    **Keywords:** Healthcare systems, machine learning, multi criteria decision making,
    IoT, preprocessing, data analytics, expert systems'
  merge: -1
  img_proc: true
