    # ## 12.1 Introduction to Artificial Intelligence


    The world is changing, and many new technologies are emerging; one of the most
    prominent and essential technologies which made a significant transformation in
    this modern era is *Artificial Intelligence*. Artificial Intelligence is a branch
    of Computer Science that deals with machines; it is also called as Machine Intelligence.
    Artificial intelligence’s main idea is to extend and supplement machines’ capacity
    and efficiency for doing human tasks such as problem-solving, decision making,
    and others through learning [1]. Many people gave their definitions for Artificial
    Intelligence based on their study and research, but according to the leading AI
    textbooks, it is defined as a study of *Intelligent agents* [2]; the detailed
    study of these agents will be explained further. In simple terms, we can define
    AI as making a machine capable of making its own decision for particular goal
    achievement through learning from the environment without human intervention [3,
    4]. The ultimate goal of AI is to make humans and machine coexist harmoniously
    [5].


    # ### 12.1.1 History of AI


    Artificial Intelligence (AI) was coined in 1956 at the Dartmouth college campus
    by McCarthy [6]. Before 1956, there were many myths and stories on the machines
    that possess intelligence as humans. However, after the invention of the programmable
    Digital computer in 1940, a group of scientists from various fields discussed
    the possibilities of creating a digital, artificial brain. This led to AI’s evolution
    in 1940; Warren McCulloch proposed the first work on *artificial neurons*. Later,
    few updates were made by Donald Hebb using the *Hebbian Learning rule*. In 1950,
    Alan Turing proposed a *Turing test* that can check the machine’s intelligent
    behavior [7]. The first Artificial Intelligence program was created by Allen Newell
    and Herbert A. Simon in 1955 [8]. Later, algorithms were developed that solved
    mathematical problems. In 1970, the first humanoid robot named WABOT-1 was built
    [9]. The emergence of Intelligent agents in 1993 brought a major change in the
    world, where AI came into the Business field, and companies like Netflix, Twitter,
    Facebook started using AI.


    # ### 12.1.2 Views of AI


    Figure 12.1 shows four main views of Artificial Intelligence [10].'
