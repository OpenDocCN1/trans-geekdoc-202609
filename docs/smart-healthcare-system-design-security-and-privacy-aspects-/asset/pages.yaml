    # ### 11.4.3  IIoT in Agriculture


    Today agriculture is no more the traditional practice that people believe it is.
    Technologies like IoT have transformed the agricultural industry into a more precise,
    efficient, and data-driven industry. Preparing the soil to detect pests has opened
    endless opportunities for advancements with or without humans’ involvement. The
    IoT-enabled systems assist farmers through all the stages of farming like sowing,
    harvesting, and even transporting the crop [32]. Unmanned surveillance of crops
    and the state-of-the-art optimizing techniques for crop yields are a reality today
    [33].


    With the increasing population and an overall improvement of human life expectancy,
    the demand for food is bound to be higher every year, and it is now that we need
    efficient technologies the most to meet the demand [34]. Hence many countries
    have started using IoT-based techniques in crop production, foreseeing the crucial
    times ahead.


    One of the most intriguing uses of IoT in agriculture is for pest monitoring and
    disease forecasting [35]. Generally, farmers spray pesticides beforehand to prevent
    pests, but this is a huge compromise on the crop’s quality and the consumer’s
    health. Therefore IoT-based systems have been introduced that proctor the crop
    through sensors, drones, and other equipment to detect pests. Through techniques
    like image processing coupled with IoT, these pests’ images are uploaded on the
    cloud to gain a deeper knowledge about them and precisely activate the field robot
    to spray only to the specific plant [36]. This is just one of the many advantages
    these systems offer in the field of agriculture.


    # ### 11.4.4  IIoT in Aerospace


    IoT has entered the realm of aviation too. It promises faster arrival times, better
    passenger comfort, and overall efficiency. Through industrial, IoT airplanes are
    connected to detect the possible collisions in their paths beforehand and calculate
    better routes for each of them [37]. On land, IoT can ensure tracking and monitoring
    of operations that are carried out at the airport. Also, IoT is foreseen to help
    improve navigation with more accuracy in location tracking.'
