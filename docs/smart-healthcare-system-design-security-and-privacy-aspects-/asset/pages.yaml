    Further the stakeholders in the systems i.e. the medical health professionals,
    doctors, diagnostic centers, emergency health services such as ambulances and
    also authorized medical researchers can have access into the system.


    # 7.3.1 Modules


    # 7.3.1.1 Wireless Body Area Network


    The wireless body area network is being proposed where the sensors are to be implemented
    in a hop star topology in the beacon modes where the network coordinator gets
    triggered up when the sensor nodes transmit any data. The standalone sensors such
    as the body temperature measuring and the ECG and respiration signal in real time
    sense the data and transmit'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'it to the centralized network coordinator. The sensors are in a very close
    vicinity to the centralized network coordinator.


    The sensors are not standalone but in small modules. They have their own micro
    processors modules which control and transmit the data to the Centralized Network
    Coordinators.


    # 7.3.1.2 Centralized Network Coordinator


    Raspberry Pi 4 Module’s are used as Centralized Network Coordinator. Raspberry
    Pi 4 has a 2.4 Ghz and 5.0 Ghz IEEE 802.11ac wireless and Bluetooth 5.0 BLE. The
    Raspberry Pi 4 uses the UART Protocol to accept the string commands being sent
    by the Body sensor modules accepting the SPP profile requests through PDA connection
    for the remote data transmission.


    The task of the Centralized Network Coordinator is to coordinate the body sensor
    nodes sending periodic data requests for efficiency in the network operations.
    It then receives the patient’s physiological data from the sensor nodes in the
    real time. It further encrypts that data and sends it over to the Local Server.


    # 7.3.1.3 Local Server


    The local server hosted in the institution mainly acts as the data parser and
    router for the data to get securely routed to secure cloud servers. It mainly
    consists of an application instance used by the stakeholders in the institution
    i.e. the doctors, physicians, nurse and other health officials to allow and add
    their notes and observations and reports and diagnostics using registered institute
    devices and authentic credentials. The data received from the Centralized Network
    Coordinator’s or the CNC’s are decrypted based on the private keys pre-assigned
    to the CNC’s stored in the database of the server. After data decryption is done
    the data is sorted and forwarded over to the SQL based Relational Database System
    hosted over by the Public Cloud Server.


    If the reports and observations generated against the patients are object based
    like image or pdf based reports, observations, or diagnostics, the data is stored
    over to Object Based Storage Buckets in the Public Cloud Server.


    Local Servers and the Cloud Servers will be connected through secure Virtual Private
    Networking services like AWS Direct Connect to facilitate secure smooth flow of
    information through private institutional networks directly to the Cloud network.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 7.3.1.4 Cloud Server


    In the public cloud server there are four components:


    +   • An Application Instance housing the application through which every prospective
    stakeholder with authentic identities will be able to check or through the data
    of the patients they are granted the access privileges to view. The Application
    Instance here is an AWS EC2 instance running Linux Based Web Server hosting a
    web application which can lead the stakeholders to access the real time data just
    over from their devices.


    +   • A Relational Database System—This is an SQL-based relational database housing
    several tables which institutional staff, doctors, access control lists and the
    patient details. Using of a cloud based Relational Database System makes the system
    easy to be administered and integrate with the application using API to access
    capabilities without infrastructure provisioning or the need of maintenance of
    a versatile big database. It is very much scalable. Availability of the database
    is also very high due to the Multi Availability Zone deployment. It is fast, secure
    and inexpensive so that the variable cost of deployment stays low even after the
    gathering of petabytes of data.


    +   • A Quantum Ledger Database—Immutable Database Hosting the health records
    of the patients. The Quantum Ledger Database also keeps a track of who logs in
    to the system to view the records of which patients alongside the timestamps.
    The quantum ledger databases stores the records and hashes them in a chain to
    achieve immutability. The records can also be verified upon by just matching the
    hashes of the records using SHA-256 to generate a secure output file of the change
    of the data through its history to validate the integrity of the data. The availability
    of the data is quite high as the data is spin up over and deployed over Multiple
    Availability Zones.


    +   • Data Analysis Warehouse such as Redshift which facilitates arranging of
    patients data across the RDS and the Object Storage Data Lakes allowing the users
    to perform extensive queries on to analyze patient data more effectively. This
    enables the structured data over in the Relational Databases and the unstructured
    Data’s over in the S3 buckets to be queried simultaneously and be brought in to
    the operational insights of the applications and the systems that are being deployed.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   • Amazon Athena will be used for fast query facilitating searching data
    effectively over the mass of the data over in the S3 buckets. It is an Extract,
    Transform and Load the Data service which loads the S3 Data over to be queried
    using standard SQL Statements.


    +   • Amazon SageMaker is Machine Learning can be used upon the patient’s data
    to be monitored and analyzed to detect diseases by learning and tracking symptoms.
    Here the researchers in accordance with the health institutions would be able
    to build, train and deploy machine learning models quickly. This will facilitate
    datasets to be trained and configured for analysis on patient’s data.


    # 7.3.1.5    Dedicated Network Connection


    The local servers/data centers are connected to the cloud servers with Dedicated
    Network Connections i.e. private connection which would facilitate a secure smooth
    transfer of data from the local server. Many public cloud service providers come
    up with support for the service such as of AWS providing Direct Connect, Azure
    providing ExpressRoute, Google Providing with Dedicated Interconnect. This is
    also a cost effective alternative than to buy more bandwidth over the public internet.


    # 7.4    Methodology


    The sensor modules generating data takes the data and sends it over to the Centralized
    Network Coordinator through a small wireless body network spanning over from 2
    to 3 m. The Wireless Body Network is a Bluetooth [15] network in a hop star topology
    where the Centralized Network Coordinator is in the middle and coordinates the
    other Sensor Modules wirelessly and fetches the information. After the information
    is transferred to the Centralized Network Coordinator it determines if the information
    received is text-based or object-based and accordingly encrypts that information.


    The encryption methodology proposed in here follows a hybrid RSA AES algorithm.
    In this methodology the plain text is divided up into odd text and even text.
    AES is used to encrypt the odd text using a secret public key *Saes* assigned
    to each of the Centralized Network Coordinator. The even text is encrypted using
    RSA with a secret public key *Srsa*.'
