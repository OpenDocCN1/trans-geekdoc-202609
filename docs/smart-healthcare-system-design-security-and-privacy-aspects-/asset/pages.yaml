- pgno: 232
  md: '# ## 9.5 Components for Enhancing Data Security in Medical IoT


    There are five different components that are associated with enhancing data security
    in IoT domain as shown in Figure 9.5.


    # ### 9.5.1 Confidentiality


    In the IoT environment, confidentiality needs to meet two essential necessities.
    A controlling access mechanism and a device authentication method with a related
    identity management system must be specified. Another necessity related to data
    confidentiality in the IoT scenario is the specification of a query language to
    allow applications to recover information from a data stream.


    # ### 9.5.2 Integrity


    Environmental risks, such as fire, dust, and electrical surges, can also endanger
    data integrity. Practices adopted to maintain physical environment data integrity
    include: making servers available to network administrators only, holding shielded
    and secured media for the transmitting (for example, wires and connectors) to
    guarantee that power interventions, electrostatic leakage, and hardware and storage
    media magnetism cannot be tapped. Network security steps to ensure data integrity
    include: preserving current levels of authorization for all users, recording processes,
    requirements, and maintenance activities of system administration, and implementing
    disaster retrieval strategies for events include power cuts, server crashes or
    assaults by viruses.


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_232_0.png)


    **Figure 9.5** Level of data security.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 9.5.3 Authentication


    The mechanism of ensuring authenticity between computers, objects and people is
    authentication. Therefore, preparing a mechanism or architecture that can manage
    the scalability of entities in the IoT ecosystem reliably is important. In an
    IoT-based hospital environment comprise of thin/fat sensors, detecting tags or
    labeled objects, it needs adequate authentication structures for use as the key
    security technique. The authentication mechanism also offers vigorous object validation
    and protected information for IoT network services during data communication.


    # 9.5.4 Non-Repudiation


    This provides with indisputable evidence of the authenticity and source of the
    transmission of all data. Digitally signed the document and hardware security
    system transactions might provide some clear non-repudiation of the date of the
    transaction and origin.


    # 9.5.5 Privacy


    All devices transmit personal information to the user without encryption, such
    as credit card details, person name, residential address, healthcare information
    and much more. Although IoT has privacy and security issues, it adds values to
    our lives by permitting us to remotely and automatically handle our daily routine
    tasks and, more importantly, it is a game-changer for industries.


    # 9.6 Vulnerabilities in Medical IoT Environment


    # 9.6.1 Patient Privacy Protection


    Smart phones containing user''s personal healthcare details are connected to the
    IoT devices to promote users convenience of services. IoT devices based on android
    with outstanding usability and transparency are rapidly developing. However it
    has also a detrimental effect, i.e. exposure to certain vulnerabilities. By using
    reverse engineering to achieve access to the original file, hackers can retrieve
    code from an insecure health app in smart phones, thus using the program to steal
    or steal private patient data. Apples IOS has a closed official software deployment
    policy concerning the store, while Android has an open policy that requires third-party
    stores and also'
  merge: -1
  img_proc: true
- pgno: 234
