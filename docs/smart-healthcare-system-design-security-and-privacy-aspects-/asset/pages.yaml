    # ### 3.1.2 Classification Algorithms


    This section deals with the different classification algorithms and explains their
    working principle and procedure.


    # #### 3.1.2.1 Dummy Classifier


    This is a simple classifier that performs better where datasets are of class imbalance.
    The various strategies are stratified, most frequent, uniform and constant. The
    stratified classifier associates with the probability that predicts the most frequent
    label from the training set. Approximately the class labels that predict more
    than 85% is identified to be the class label of dummy classifier.


    # #### 3.1.2.2 Support Vector Machine (SVM)


    Support vector machine is a supervised knowledge technique utilized to analyze
    data in the process of categorization. This input features are plotted in n-dimensional
    space and then further a hyperplane is identified as decision boundary to split
    the classes. The decision boundary is mapped as optimal decision boundary for
    which the margin is max.


    The hyperplanes are identified with maximal margin using the support vectors.
    The support vectors are training points identified to be splitting points between
    class labels. Reduction in the choice of number of support vectors provides good
    generalisation. This process can be done in a linear data mapping. The non-linear
    data plotted in an n-dimensional space can never be divided with boundaries. So,
    the non-linear data will be further mapped to a high dimensional space using kernel
    function (as shown in Figure 3.2).


    A separating hyperplane can be given as


    ```

    W × X + b = 0 (3.1)

    ```'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/bb4a43d3cc1537c84f048d14c493ee68_81_0.png)


    **Figure 3.2** Kernel Function on non-linear SVM.


    W is a weight vector (w₁, w₂, ...wₙ), n is the number of attributes and b is a
    scalar. As the X vector which lies very close to it the maximum margin hyperplane
    is described.


    Non-linear mapping requires the kernel trick, which is a two-vector dot product.
    The kernel is associated to the transformation Φ(Xi) with the equation K(xi,xj)
    = Φ(xi) · Φ(xj). A sample non-linear transformation on 6D space for a given 3D
    vector X = {x1,x2,x3} using the Kernel mapping can be given as Φ1(X) = x1, Φ2(X)
    = x2, Φ3(x3) = x3, Φ4(X) = (x1)², Φ5(X) = (x1x2), Φ6(X) = (x1x3). Further this
    can be processed like a linear data with the decision boundary. Further the kernel
    functions are Polynomial, Gaussian, sigmoid etc.


    # 3.1.2.3 Gradient Boosting


    Gradient Boosting is a classification problem that builds a learner and predicts
    the test sample based on ensemble of weak prediction models. The algorithm is
    an additive model that performs optimization with differentiable loss functions.
    Basically decision trees are used for it and then generalize through optimization
    based on cost function. Thereby becomes a strong predictive model.


    As this improves the strength of other learning algorithms, the idea is known
    as Probability Approximately Correct (PAC) learning. The hypothesis boosting tests
    identify the weak learner that was poorly classified and examples that were successfully
    classified to build a perfect model. As a whole gradient boosting involves three
    features, they are'
