    Real-time plotting plays a significant role in the diagnostics of any remote monitoring
    system. Thus, the PNDD protocol provides the end-user with a real-time plotting
    system for further processing and diagnosing the information. The PNDD algorithm
    predicts and retrieves data when it is required. If the collected data in the
