    the public cloud infrastructure will be in connection with AWS Direct Connect
    ensuring smooth and secure flow of information.


    By this the doctors, medical health professionals and the nurses inside the local
    network of the institutions hold the capability to edit, write, and update the
    health records of the patients.


    The body sensors which will be connected to any patient for diagnostic, treatment
