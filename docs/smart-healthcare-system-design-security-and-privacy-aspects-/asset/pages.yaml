  md: '# ## 11.1 Introduction


    # ### 11.1.1 Introduction to Industry 4.0


    The evolution of technology and industrialization through industrial revolutions
    has changed how the various industries function [1]. First, the first industrial
    revolution was introduced to water and steam power, revolutionizing hydropower.
    Later in the second industrial revolution, electric energy took shape. The third
    revolution witnessed electronics and information technology. With the advent of
    the fourth industrial revolution termed Industry 4.0, cyber-physical systems are
    taking shape [2], aiming for an advanced manufacturing and production process
    through reliable and efficient communication of raw materials and machines. Taking
    automation to the next level through intelligent factories is a vision of this
    industrial revolution [3]. In an attempt to converge both real and virtual worlds
    and make manufacturing and overall functioning of the various supply chains more
    productive, a fusion of IoT with the concepts of industry 4.0 is foreseen [4,
    5].


    # ### 11.1.2 Introduction to IoT


    Today we live in a world where living beings are not the only ones to communicate
    with each other. When enabled with sensors and connected on the internet, things
    and devices communicate effortlessly to accomplish tasks together. A term coined
    to explain this technology is the internet of things. The essential part of communication
    is to have a network that enables data exchange from one device to another. IoT
    connects them in a network called the Internet.


    There are countless applications of IoT [6], be it smart homes, smart cities,
    smart cars, etc. These applications are an implementation of a series of actions
    generated through effective data transfer between the nodes. For instance, when
    the temperature gets extremely hot, our brain sends a signal, which leads to a
    voluntary action of switching on a fan. The imitation of the same actions by a
    series of computational devices results in a smart application. With IoT, all
    of our activities can now be imitated efficiently. A technology like IoT can automate
    tasks and help make smart decisions, and with its exceeding usage and popularity,
    it is bound to transform how the world runs [7].


    Numerous industries have incorporated it into their products and services. There
    have been disadvantages, as nodes connected on the internet could be vulnerable
    to cyber-attacks, compromising data security in the system [8]. However, it has
    been a constantly improving technology,'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'opening doors to endless possibilities. This chapter reflects the current trends
    of IoT in various industries and explains its issues, and prospec-目ively throws
    light on the scope of improvement that could multiply the applications of IoT
    in the future.


    # 11.1.3 Introduction to IIoT


    An interrelated automated network of machines that collaboratively func-缅tion
    efficiently and carry out the production process, thereby reducing human effort
    and a human’s involvement in the process, is called IIoT [9]. The IIoT fuses several
    concepts like big data, machine learning, etc., to col-缠lect data in the manufacturing
    process to enable communication between the machines, sensors, and products and
    hence automate the entire process [10]. The machines and computers work together
    with the IoT to give rise to tomorrow’s intelligent factories [11].


    # 11.2 How IIoT Advances Industrial Engineering in Industry 4.0 Era


    Industrial engineering has gone through 4 phases so far [12]. The first phase
    being the first industrial revolution. It happened after the 1700s. This revolution
    brought in a change where manual labor, which included humans and animals, can
    be enhanced if people used the power-driven by steam and water and other tools
    driven by the hydropower.


    In the early 20th century, the world witnessed the second industrial rev-缡olution
    wherein electricity was introduced, and so was steel. The advent of electricity
    greatly improved the mobility of the various machines, and this revolution was
    when mass production began. Assembly lines were also an invention from 2.0.


    During the end of the 1950s, the third industrial revolution began [13]. Computers
    and electronic devices were used along with the manufacturing processes, which
    changed the dependence of factories on analog machin-缥ery and gave rise to the
    digital era.


    Today, With the advent of Industry 4.0, a shift in manufacturing oper-缅ations
    is bound to take place. With the inclusion of new technologies in industrial engineering
