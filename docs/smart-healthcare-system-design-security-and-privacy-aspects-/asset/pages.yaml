  md: '# 3.1.2.5  Ada Boost


    Ada Boost is an adaptive boosting algorithm for binary classification. The algorithm
    proceeds like gradient boosting methods combining different decision trees. Weight
    is allocated for every instance in the training set. Weak classifier like decision
    trees performs classification on weighted samples. These kind of boosting algorithms
    normally combine the multiple low or weak classifier accuracy models to attain
    a strong highly accurate model. Thereby, Ada boost stands as an algorithm to boost
    the performance of weak learner in order to increase the accuracy of the decision
    stump built from training set.


    # 3.2 Experimental Analysis


    The data set for COVID-19 is obtained from Ref. [1]. Positive and negative data
    are used as two groups to predict COVID-19 disease based on the results of the
    input blood and urine test as a feature set. The results of the study were calculated
    based on the precision, accuracy, recall, and F1 score results.


    # 3.3 Multi-Criteria Decision Making (MCDM) Procedure


    This segment covers three different types of Multiple Criteria Decision Making
    (MCDM) and discusses how they are utilized in the sense of decision-making.


    MCDM methods assist pronouncement manufacturer to make this greatest judgment
    in the presence of multiple (conflicting) criteria [2-7]. All the possible alternatives
    are assessed against the multiple criteria and the best of them is picked. The
    popular MCDM techniques available are SAW (Simple Additive Weighting), WPM (Weighted
    Product Model), TOPSIS (Similarity to the Ideal Solution Order Preference Technique),
    PROMETHEE (METHod for Enrichment Assessment Preference Ranking Organization),
    AHP (Analytical Hierarchy Process), SMART (The Simple Multi Attribute Rating Technique)
    and ANP (Analytic Network Process). In many real life applications, such as supplier
    selection, product selection, design selection, producer selection, and so on,
    MCDM methods play a vital role. The methods are chosen on the basis of the problem
    domain''s demand and its applicability. Methods of MCDM help pick the most favored
    single alternative or help to classify a collection containing preferred alternatives.'
