    # 4.1 Introduction and Motivation


    To understand the patient''s emotional feelings or pain, communication between
    health professionals and patients plays a vital role in identifying, understanding
    the patients problems and providing clinical solutions. Ventilator dependent,
    Severe Acute respiratory and quarantine care ICU patients frequently face difficulties
    for their most basic human interactions, namely communication due to either respiratory
    illness, language problem or intubated. ICU patients have serious implications
    with respect to physical and psychological due to non communication problems.
    Researchers have developed different types of services like Speech language Pathologist
    so that Augmentative and alternative communication assistance can be given to
    all health professionals and caretakers. Though the vital body parameters of patients
    are being monitored well, their intuitive feelings and their respective symptoms
    could not be effectively conveyed or understood by doctors/nurses during intensive
    caring because of being multilingual. It is the most distressing and stressful
    aspect of critical illness, more than one in four ICU survivors suffer from depression,
    anxiety or post-traumatic stress disorders. Although various assistive communication
    tools exist in one premier language those were infrequently used when the patient
    and doctor haven''t found/known a common communication language. ICU patients
    express their needs by non verbal communication methods and it could be a little
    bit difficult to understand their complete requirements by the health professionals.
    In turn, a patient''s emotions result in apprehension, anger etc. Based on the
    interviews and suggestions given by the patients it reveals to the fact that both
    do not have common communication language. Frequently, health professionals did
    not understand the gestures clearly. Similarly, interviews were conducted with
    health-professionals who have rich experience in handling and treating intensive
    care patients. Finally, under patients'' interaction, comfort based questions
    were identified and those questions were considered for interaction. Based on
    the outcome of the interview with recovered patients and health professionals
    the communication lapses are identified, with an emphasis of interactive learning
    through touch gestures for effective multilingual communication.


    Due to the rapid increase of COVID-19 spread, there is a substantial increase
