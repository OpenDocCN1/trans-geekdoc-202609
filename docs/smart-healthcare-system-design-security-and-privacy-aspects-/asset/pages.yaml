    # 13.3 Optimistic Treatments and Cures


    Many laboratories and information centers have previously designate that they
    are engage AI individuals and building efficient infrastructure to search for
    COVID-19 treatments and vaccines. Scientists and doctors are collaboratively working
    to determine an innovative drug against COVID-19 by recombing the existing drugs
    [11]. AI processes and tools help them to accelerate their process of discovering.
    Beck et al. and Stebbing et al. report that the existing drugs such as atazanavir
    and Baricitinib (used against rheumatoid arthritis and myelobrosis) could be an
    impending behavior for COVID-19. Dong et al. summarize a list of possible drugs
    for the behavior of COVID-19. This paper discuses the use of IFN-α drug through
    vapor inhalation for 10 days. Then it represents the use of Lopinavir/ritonavir
    and Arbidol through oral intake for 10 days. Then it also explains the intake
    of Ribavirin drug through intravenous infusion for 10 days [20].'
