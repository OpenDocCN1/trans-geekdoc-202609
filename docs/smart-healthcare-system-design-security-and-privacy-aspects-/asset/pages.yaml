  md: '![](img/bb4a43d3cc1537c84f048d14c493ee68_338_0.png)


    Figure 14.12 Plots of PACF values for daily COVID-19 new new deaths in the world.


    After taking second order differencing, from Figures 14.13 and 14.14, it can be
    diagnosed that the second level differences series may be stationary. Figures
    14.15, 14.16, 14.17 and 14.18 are respectively represents the ACF and PACF values
    against 16 time lags. From Tables 14.1 and 14.3, it is observed that Box–Ljung
    statistic value increases when the lag number increases. From Table 14.2 and 14.4,
    it is also noted that PACF standard error is constant irrespective of the number
    of lag. The value of ACF and PACF of 16 lags are maximum falling inside to the
    confident limits and also not so far from the central value. Hence based on the
    graphical representations it can be concluded that the observations are stationary
    when the second differencing is carried out. The models AR or ARMA model can be
    able to fit only to the stationary time series. In this case, the observations
    are converted into stationary time series by using second ordered differencing
    [11]. So that ARIMA model can be built to this second ordered differencing time
    series data. Hence the appropriate ARIMA model can be determined by using this
    stationary time series and the model can be used to yield forecast.


    # 14.4.1 Model Estimation and Studying its Adequacy


    From stationarity on second differences of daily new cases and daily new deaths
    time series data an ARIMA model is fitted to the data. We considered nine different
    ARIMA models and choose the best model which has minimum Normalized BIC.'
