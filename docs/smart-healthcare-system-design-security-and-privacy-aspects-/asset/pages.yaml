    # ### 11.3 IoT and its Current Applications


    The Internet of things has touched every industry that one can think of [17].
    It has transformed the digital world''s very functioning, welcoming the most inanimate
    objects into the digital realm. IoT has been trending since the beginning of the
    21st century, and today, it is said that more than 120 new IoT gadgets are joining
    the internet per second. 2020 has seen more than 30 billion devices in use, and
    the numbers are only aimed to reach greater heights [18]. Initially, it was claimed
    to have been majory focused on reducing human effort, but it has made way to some
    extremely essential advancements that played a crucial role in the most important
    industry, which is healthcare, with a count of almost 40% of the devices solely
    dedicated for healthcare [19]. Among the countless applications of this booming
    technology, there are some applications in current times that are worth knowing.


    # #### 11.3.1 Home Automation


    Today the world is witnessing an era of smart homes with overall control over
    various appliances that work together in creating a home that runs on automation.
    IoT has several applications, but the most popular of them all is Home automation.
    Controlling the climate, entertainment devices, and maintaining an economically
    viable home is briefly what it offers. Home security can also be ensured with
    various alarm and security cameras [5, 20].


    The devices, when enabled with sensors, are connected to the internet. This network
    can be remotely controlled through a mobile phone; in other words, a user can
    now access all the applications at home even if he is away. To make the system
    smarter, these devices automatically set themselves by taking into account the
    data sensors collect [21]. For example, the room temperature is valuable data
    for automatically controlling air conditioners and fans in the room.'
