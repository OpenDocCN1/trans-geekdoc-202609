    # ## 3.3.3 Method for Order Preference by Similarity to the Ideal Solution (TOPSIS)


    TOPSIS, originally developed by Ching-Lai Hwang and Yoon in 1981, is a common
    MCDM method and has undergone further improvements. It operates on the basis of
    the assumption that the best alternative should be the shortest path to the positive
    ideal explanation and the longest detachment to the negative ideal explanation
    [8, 9]. For all of the parameters considered, the optimal positive explanation
    is the one with the greatest assessment. The negative optimal explanation is the
    one that has the worst assessment for all the parameters believed. If we have
    ''n'' alternatives and ''m'' parameters then U$_{ij}$ denotes for jth criterion
    the success value of $i$th substitute.


    The steps involved in TOPSIS method for COVID-19 disease classification are as
    follows:


    +   1. Build a normalized weighted decision matrix. This step involves multiplying
    by its associated weight each column of the matrix’s output score. The normalized
    weighted decision matrix is determined as follows:


    ```

    $$V_{ij} = \mathbf{w}_{j} * \mathbf{U}_{j} \qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad\qquad(3.4)$$

    ```


    +   2. Conclude the perfect positive and ideal negative explanations. The following
    equations can be used to conclude the positive ideal explanation and the negative
    ideal explanation. Positive ideal explanation:


    ```

    $$V^{+} = \{(\max V_{ij} \mid j = J), \forall i = 1, 2..., n \} \qquad\qquad\qquad\qquad\qquad(3.5)$$

    ```


    ```

    $$V^{+} = \{V_{1}^{+}, V_{2}^{+}, ..., V_{n}^{+}\} \qquad\qquad\qquad\qquad\qquad\qquad\qquad(3.6)$$

    ```


    Negative ideal solution:


    ```

    $$V^{-} = \{(\min V_{ij} \mid j = J), \forall i = 1, 2..., n \} \qquad\qquad\qquad\qquad\qquad(3.7)$$

    ```'
  merge: -1
  img_proc: true
- pgno: 88
  md: '```

    $$V^{-} = \{V_{1}^{-}, V_{2}^{-}, \dots, V_{n}^{-}\} \tag{3.8}$$

    ```


    +   3. For each alternative, determine the separation measure. The separation
    determines of an alternative from the positive ideal explanation and also from
    the negative ideal explanation is measured in this step.


    The computation of separation from the constructive superlative explanation is
    calculated as follows:


    ```

    $$S_{i}^{+} = \sqrt{\sum_{j=1}^{j=m} (V_{j}^{+} - V_{ij})^{2}} \ \forall I=1,\
    2,\ \dots,\ n \tag{3.9}$$

    ```


    Separation measure from negative ideal explanation is calculated as follows:


    ```

    $$S_{i}^{-} = \sqrt{\sum_{j=1}^{j=m} (V_{j}^{-} - V_{ij})^{2}} \ \forall I=1,\
    2,\ \dots,\ n \tag{3.10}$$

    ```


    +   4. Calculate each alternative''s relative coefficient of closeness. By considering
    the positive ideal resolution and the negative ideal explanation, this step measures
    with similarity for alternatives. The coefficient value of relative closeness
    is determined as follows:


    ```

    $$C_{i}^{*} = S_{i}^{-} / (S_{i}^{+} + S_{i}^{-}) \tag{3.11}$$

    ```


    Choose the High Relative Closeness Coefficient alternative $C_{i}^{*}$ value.


