  md: 'within the next 50 years [13]. Whereas the improvements to the quality of life
    and advances in medical science in the last few decades craft the aging of the
    population, a higher ratio of the aged population makes it necessary for caregivers
    to concurrently tackle with more patients suffering from a variety of chronic
    diseases. This way, the upholding of quality service by assessing the risk turns
    to be more and more challenging for caregivers.


    An empirical case study [9] was conducted with data from nine public hospitals
    in Silica, Italy, on four core quality parameters and fifteen main service items.
    He introduced a new fuzzy measurement method for assessing the quality of service
    in healthcare. To elicit accurate estimates of service quality requirements, the
    fuzzy AHP approach was used. He found that successful internal communication of
    service quality accomplishments should minimize the differences between the needs
    of customers and how workers view those needs. The authors [10] presented several
    of the shortcomings of several existing algorithms in the form of an enormous
    number of rules and the mining of non-interesting rules, along with the time of
    pre-processing and the rate of filtration. Then to address the limitations based
    on the user request and the visualization of discovered rules, they provided a
    fuzzy weighted-iterative concept.


    Again, [11] provided under an interval-assessed intutionistic fuzzy environment
    a hybrid MCDM model and thereby evaluated the probability of node failure. They
    combined the interval-valued intutionistic fuzzy ANP (for matching with the uncertainty
    of information) and the proportional assessment approach (for decision making).
    However, the subjective weight used in their method relied much on caregivers''
    opinions and thus was not flawless. Besides, due to the complexities of systems
    and service, there could arise different kinds of interrelationships between the
    failure modes. However, this was dodged in this study. Around the same time, [12]
    presented a decision-making approach that predicted heart failure risk. They integrated
    the fuzzy AHP and fuzzy ANN in the suggested approach. Also, they could establish
    that their method had 91.10% accuracy in results in comparison with other conventional
    ANN models Table 2.2.


    Recently, [14] identified several drawbacks of the highly popular gerontechnology
    and telerehabilitation systems, such as the failure of those systems to assist
    patients and experts, both, regarding the progress of rehabilitation. They proposed
    a fuzzy-semantic framework based on well-known assessment criteria to determine
    the physical state of the patient during the recovery process. They used an API,
    however, called the Kinect API, which was a closed source API and only usable
    for Kinect interface patients. This made it less valuable for the process. There
    were also ample scopes for therapists and patients, alike, to determine their
    operation. Again'
