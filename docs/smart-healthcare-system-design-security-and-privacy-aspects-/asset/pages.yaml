    and in good condition to combat the disease. Next, [17] posed an important question
    as to whether, by proper examination, hospitals could incorporate lean thought.
    First, various lean concepts and components implemented in healthcare institutions
    were defined. Next for healthcare organizations, a fuzzy-logic based lean implementation
    evaluation approach was deployed and then numerically studied. Although this study
    was validated in only one Indian hospital, it introduced some of the legislators''
    futuristic and implementable action plans. The study [44] developed a model to
    measure the leanness of hospitals and then validated the model by discussing the
    corresponding initial version with select academic experts. This way, they determined
    two criteria for organizations, namely the ability to participate in the study,
    and the commitment to implement lean principles. Finally, a multi-attributes fuzzy
    logic-based ranking method was established to present the leanness index.


    Recently, [18] performed the identification of enablers, criteria, and attributes
    of leanness to constitute the measures of assessment of hospitals under fuzzy
    environment. Their method could help to provide the measures to address the weaker
    attributes and thereby to further enable the enhancement of lean performance.


    In a rather real-life-oriented study [19], Pythagorean fuzzy data were considered,
    in which different evaluation data were provided in the form of Pythagorean fuzzy
    decision matrices regarding the feasible alternatives. The entries were taken
