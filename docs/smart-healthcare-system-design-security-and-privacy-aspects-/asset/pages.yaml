    # ### 9.8.2  Chain of Trust Security Services


    There are two kinds of confidence relationships in the Chain of Trust: Internal
    Chain of Trust and the External Chain of Trust. An Internal Chain of Trust is
    instantiated by a platform as it executes a set of code modules in an environment
    in which the effect of any inspection of code or data integrity that might take
    place is difficult to log. In the other hand, as it intentionally extends a security
    service in such a manner that you can check the links in the chain generated by
    the extensions at any time and validate their validity, a platform instantiates
    a Clear Chain of Confidence, thus verifying the legitimacy of the security service
    it extends from end to end. The External Chain of Confidence exists through a
    set of code modules in which a RoT tests the next code module for authentication
    and authorization. If it passes such tests, it can be executed and becomes an
    eRoT in an external Chain of Trust.


    Currently, an External Chain of Trust expands a service to other modules from
    a RoT (either a Main or a Secondary RoT) or module. The Chain of Trust for Authentication,
    under which the RoT requires a verification service, is a clear example of this,
    and it uses that service to validate a module providing a verification service
    close to that of the parent verification service. In a RoT, an explicit chain
    of confidence will always start. Explicit Chains of Trust, including Roots of
    Trust, must contain a minimum of one security service. The approach of expanding
    the Root of Trust service to subsequent modules is strongly dependent on implementation.


    This method is a multi-layered framework, which includes a hypervisor. Next, the
