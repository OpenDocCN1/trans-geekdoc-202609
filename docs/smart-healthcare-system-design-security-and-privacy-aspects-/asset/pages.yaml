    # ### 10.2.1 Message Queuing Telemetry Transport (MQTT) Protocol


    MQTT is one of the most commonly used protocols in IoT applications [4]. It was
    originally created and developed by the IBM company. It is an ISO standard based
    on the publish/subscribe (pub/sub) communication pattern. MQTT works on the top
    of the TCP/IP protocol which can carry a sequence of nearly 256 MB of data, usually
    adding a fixed header of 2 B to most payloads [11, 12]. The main purpose of MQTT
    is to reduce the burden of IoT constrained devices for sending/receiving messages.
    These devices usually have limited memory, power, bandwidth and processing unit.
    Figure 10.3 express an example of MQTT protocol u Q1 se-case with different topics
    and clients.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '![](img/bb4a43d3cc1537c84f048d14c493ee68_257_0.png)


    **Figure 10.3** An example of MQTT protocol use-case with different topics and
    clients.


    There are three kinds of actors in the pub/sub architecture system; publisher,
    broker and subscriber [4]. A publisher device sends the messages identified by
    a specific topic to the broker. Then, the broker forwards these messages to every
    subscriber device interested in that topic. A broker handles all messages passing
    from the publisher to subscriber devices. There are no standard topics for the
    MQTT protocol. The publisher can define any topic with one or more subscribers.


    MQTT protocol supports a hierarchical topic name-space [13]. The subscription
    topics consist of one or more topic levels. Each level is separated by a forward
    slash “/” as shown below:


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_257_1.png)


    Two wild cards characters are supported for subscriptions to hierarchical topics
    as described below [14]:


    +   - Single Level Wild-card (+): presents one topic level of the hierarchy and
    uses the character “+” between delimiters, for instance:


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_257_2.png)'
  merge: -1
  img_proc: true
- pgno: 258
  md: '+   Multi-Level Wild-card (#): covers many topic levels. The character # shows
    the multi-level wild card in the topic. It must be placed as the last character
    in the topic and is preceded by the character “/”.


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_258_0.png)


    The MQTT protocol supports three possible quality of service (QoS) values concerning
    the guarantee of delivering a packet between publisher and subscriber devices.
    The QoS level implementations for the MQTT protocol are [4, 14]:


    +   QoS (0), at most once: is the simplest, fastest mode method of transfer with
    lowest overhead. The sender simply publishes the message to the broker; there
    are no acknowledgement packets between the publisher and the broker. Therefore,
    there is no guarantee of message delivery. Figure 10.4 shows Quality of service
    (0) of MQTT.


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_258_1.png)


    Figure 10.4 Quality of service (0) of MQTT.


    +   QoS (1), at least once: delivers the messages at least once to the receiver.
    The sender forwards the message and waits for an acknowledgement (PUBACK) packet
    from the broker. This level guarantees that the data will be forwarded successfully
    to the broker. However, the message may reach the broker more than once. Figure
    10.5 represents Quality of service (1) of MQTT.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '![](img/bb4a43d3cc1537c84f048d14c493ee68_259_0.png)


    Figure 10.5 Quality of service (1) of MQTT.


    +   - QoS (2), exactly once: is the highest and safest level of MQTT services.
    This level guarantees that the message will be received once by the broker. There
    is a sequence of four messages (a four-part handshake) between the sender and
    MQTT broker. When the handshake messages have been completed, both the sender
    and receiver have confirmed that the data was sent exactly once. Figure 10.6 projects
    Quality of service (2) of MQTT.


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_259_1.png)


    Figure 10.6 Quality of service (2) of MQTT.


    Because the MQTT protocol consumes less power and is faster than the HTTP, many
    systems use the MQTT instead of the HTTP protocol as the core of data transportation
    [4]. Therefore, in this study, the MQTT protocol has been selected to control
    the IoT device (RasPi) through the internet. Furthermore, the experiment results
    in Ref. [15] revealed that the QoS (2) has less packets loss rate than QoS (0)
    and QoS (1). Therefore, the QoS (2) was selected for this study in order to receive
    the data exactly once.


    Most MQTT brokers do not have any built-in technique to store MQTT client data
    permanently into the database. If the connection between sender and broker is
    QoS (0) then the data does not need to be stored, and the messages are delivered
    to only the currently active and connected subscribers [16]. When the connection
    is QoS (1), the messages often have to be stored temporarily on the broker if
    the subscriber is online. However, the message is stored for longer if the subscriber
    is offline or the retain flag is on the message [16]. However, if QoS (2) is selected
    then the messages'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'are stored in the broker for a period of time until the transaction is fully
    committed [16]. For these reasons, a database must be installed on the monitoring
    server to store the data sent by the publisher device.


    # 10.2.2 Embedded Database SQLite


    SQLite is an open source and extremely lightweight relational database considered
    the most widely used of all database engines [17]. It was written by D. Richard
    in 2000 using C-language. SQLite is used by several web browsers in common use
    (e.g., Safari), operating systems (e.g., Windows 8, Windows 10), and in embedded
    systems (e.g., mobile phones). It is faster than other popular client/server SQL
    database engines such as MySQL, Oracle, etc. for most common operations [4]. SQLite
    is a zero-configuration which means no complex setup is needed and it supports
    terabyte-size databases. Therefore, it was selected as an embedded database for
    monitoring server storage.


