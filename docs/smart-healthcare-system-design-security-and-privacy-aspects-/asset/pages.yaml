  md: '# **11.6.1 Data Analytics in IoT**


    With more and more devices being associated with IoT, data being exchanged is
    huge. Efficient data management is most necessary to carry out the IoT operations.
    Hence researchers have been discussing incorporating data analytics to manage
    better, analyze, and retrieve valuable insights [43]. This will open doors to
    machine learning and artificial intelligence, which have the capability to make
    it more convenient and help provide better data insights.


    # **11.6.2 Edge Computing**


    Imagine that an autonomous car has come across a hazard; the time it takes to
    actually send the information detected by the sensors through the network all
    the way to the data center where a decision is made, which again travels back,
    is huge. Imagine your enterprise sharing its most important information on a cloud
    that other enterprises can so easily view? We would rather prefer a local network.


    When utilizing a cloud for data exchange, the cost that the bandwidth takes up
    is not effective, and one would rather switch to a more cost-effective way. All
    of the above factors, i.e., time, privacy, and cost, are the underlying issues
    of existing cloud computing systems driven by IoT [44].


    Hence a more advanced approach to address these issues has taken shape, which
    is edge computing. Here, the intelligence is done right at the edge of the node
    (local network), and decisions are made right at the data source. This way, the
    enterprise data is restricted to the enterprise only, the time taken is comparatively
    reduced, and the cost is under control.


    # **11.6.3 Secured IoT Through Blockchain**


    Among the numerous enterprises using IoT today, there are financial and government
    enterprises that work on exchanging transactions and other private data. These
    enterprises initially found it challenging to trust IoT based systems with security.
    However, through blockchain technologies, the infrastructure of IoT systems is
    altered so that the network is no more centralized, and a peer to peer secure
    communication is made possible to ensure security and privacy of data [45]. This
    advancement is one of the most anticipated among other trends as it will see more
    and more enterprises opting for IoT without having to compromise the security
    of data.'
  merge: -1
  img_proc: true
