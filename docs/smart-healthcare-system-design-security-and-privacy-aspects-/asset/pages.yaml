    # C. Decision Making and the Role of Operations Research


    The majority of researchers focusing on applications of fuzzy set theory in healthcare
    and medical problems used some existing decision-making processes or derived new
    ones. They found that the decisions of caregivers primarily aim to lower the health
    risk of patients while maximizing the health benefits and patients'' choice, thereby
    increasing the satisfaction of all parties. However, there involved numerous criteria,
    such as social, envi-ronmental, material, managerial, professional, and many more
    criteria, in the wider setting of medical and healthcare models [17]. Since the
    crisp decision-making methods under several qualitative and quantitative con-tradictory
    issues strived to avoid the complexities with tolerance to doubts and stakeholders''
    favoritism, the fuzzy set theory was employed to repre-sent the inherent imprecision
    of data and thus to present an efficient, rational and explicit decision process
    [21].


    Among recent studies, [16] presented a detailed survey by considering 142 articles
    published in the period 2000–2014. While they found the maximum number of publications
    focusing on applications of operations research in healthcare around the year
    2008, they noted a surge in numbers post 2014. In the same edited volume of 2017,
    they presented a com-pre-hensive survey in this area. They considered a longer
    period: 1966–2016'
  merge: -1
  img_proc: true
