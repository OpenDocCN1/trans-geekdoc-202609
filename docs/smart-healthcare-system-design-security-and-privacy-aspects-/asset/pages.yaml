  md: '# **13.2.2 AI-Empowered Image Processing to Diagnosis**


    The goal of this research is to converse the position of AI-enabled medical imaging
    in the battle against COVID-19 in detail, which will be encouraging [13]. These
    medical imaging techniques based on AI are expected to provide guidance in the
    future for researchers and radiologists [14]. For diagnosis and prognosis, the
    role of image segmentation, edge detection and enhancement. In the case of COVID-19,
    patients with chest X-ray and CT images are commonly used in high-risk patients
    for the judgment of early stage COVID-19 pneumonia. COVID-19, which can infect
    all normal patients near it, is one of the most dangerous airborne viruses. However
    this X-ray and CT image-based diagnosis offers a contactless and automatic workflow
    of detection since many modern X-ray and CT devices are fitted. Furthermore, in
    all hospitals, X-ray and CT imaging devices are available that greatly boost the
    issues of portability, scaling and affordability [15]. The separation of COVID-19
    from other pneumonias and from healthy subjects was examined. A SqueezeNet structure
    with Bayesian optimization additive is used by Ucar et al. [15] for the diagnosis
    of COVID-19. This experiment includes a complete 5,949 poster anterior chest radiography
    images for 2,839 patient cases, the COVID chest X-ray data collection, and the
    Kaggle chest X-ray pneumonia dataset are combined [16]. The experimental results
    show that the deep Bayes-SqueezeNet improves the detection accuracy to 98.3% for
    single COVID-19 recognition (among regular, pneumonia and COVID cases) and 100%
    (among other classes). Researchers strengthen the perception of deep learning
    outcomes in this paper and encourage a more AI-based decision-making process.
    A composite structure of different deep learning models on chest X-Ray datasets
    is explained by Chowdhury et al. It utilizes sgd-SqueezeNet with 98.3% precision
    for the COVID-19 classification [17].


    A Bayesian Convolutional Neural Network is being introduced by Ghoshal et al.
    to predict COVID-19. It collected lung X-Ray images from an online COVID-19 dataset
    of 70 positive patients and images of non-COVID patients from Kagles Chest X-Ray
    Images (Pneumonia). This enhances the VGG16 model''s detection precision to 92.9%.
    A ResNet-based model for perceive COVID-19 from X-ray images is proposed by Zhang
    et al. It also performs anomaly detection along with the COVID-19 classification.
    To optimize the score of COVID-19 used for classification, anomaly detection is
    used. For the purpose of the experiment, 70 COVID and 1,008 X-Ray images of non-COVID
    patients were used. It achieves 96.0%'
