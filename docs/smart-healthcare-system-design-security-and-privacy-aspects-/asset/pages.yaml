    # ## 6.5 Performance Analysis


    Our proposed model improves home care of the patients and remote healthcare up
    to 90% accuracies in detecting the common diseases. Our model is able to disrupt
    the exponential spread of the COVID-19 disease. In our model we have used biosensors.
    The accuracy levels of the biosensors are very high. We have Jelastic as a cloud
    service. The cloud server can analyze the patients’ data using machine learning
    and deep learning techniques with high accuracies. We have used LoRaWAN networking
    protocol that can provide security with AES encryption.


    # ## 6.6 Future Research Direction


    There are lots of future research scopes in the field of Healthcare 4.0. Our model
    shows low accuracies in detecting cancer. As a future research work we are currently
    working to implement a model where small bots can work to deliver medicines to
    the patients. The Sawai Man Singh (SMS) Government Hospital in Jaipur, India is
    conducting a series of trials to find the way to appoint a humanoid robot for
    delivering medicines and food to the patients in the hospitals so that the doctors
    and the staff can maintain safe distances to reduce the chances of contracting
    infections. Though LoRaWAN provides a secured long-range communication, the long-range
    communication is generally unreliable, costly and also prone to the side-channel
    attacks. So, implementing fog technology can be another future work where the
    data collected using the sensors can be first sent to the nearby servers in the'
