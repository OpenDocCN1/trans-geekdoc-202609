- pgno: 336
  md: 'From the figures it is observed that there is a variation changes over time.
    It points out that mean of the daily affected cases and deaths are not set and
    its changes over time. These details reveals that daily affected are non-stationary
    in both mean and variance.


    Figures 14.9 and 14.10 represent the ACF and PACF values against 16 time lags.
    The non stationarity in mean also be observed from Figures 14.9 and 14.10. It
    can be noted from the ACF plots, all the spikes are lying outside the confident
    limits. The time lags at 1 is very large and lying outside the confidence limits.
    Figures 14.11 and 14.12 represent the ACF and PACF values against 16 time lags.
    The non-stationarity in mean can also be noted from Figures 14.11 and 14.12. It
    can be observed from the ACF plots, all the spikes are lying outside the confident
    limits. From PACF the times lags 1, 3, 5, 6, 8 are very large and lying outside
    the confidence limits. So it is necessary that to transfer the non-stationary
    data to stationary data. Because Figures 14.9, 14.10, 14.11 and 14.12 confirm
    the non-stationary in mean. So that process of differencing is carried out in
    the data to eliminate the non-stationary. To remove the non-stationary in mean
    the technique of second differencing is applied. After two times differencing
    is carried out, it can be observed from the following results that stationarity
    is maintained with respect to mean and variance.


    Autocorrelations and Partial autocorrelations with standard error are depicted
    below.


    ![](img/bb4a43d3cc1537c84f048d14c493ee68_336_0.png)'
