    # 2.7 Conclusion


    The IoT is a great blended domain for many fields such as mHealth application''s
    development. The mHealth application''s development is very trendy topic among
    the research community due to its direct involvement with the human''s life. These
    applications mostly focus on static patients but do not focus on the remote patient''s
    monitoring. The remote patient''s monitoring is getting fame due to fewer innovations
    and work is done in this domain. In this chapter we investigated different health
    issues. Additionally, the fuzzy logics work with a focus on their major components
    of the applications to develop for health monitoring is discussed. There is a
    strong need to address these all mentioned issues sot enhance the health sector
    both in eHealth and mHealth Environments.


