    # Types of Intelligent Agents:


    The following are the various types of intelligent agents [14].


    +   i. *Simple Reflex Agents*: These agents perform actions only based on the
    current state, ignoring history. Its response is based on the event-condition-action
    (ECA rule), where a user initializes an event, and the agent tests whether the
    condition is satisfied or not. If the condition is satisfied, then the agent can
    proceed with the action, else he cannot.


    +   ii. *Model-based reflex agents*: Model-based agents deal with partial usability,
    which operates by keeping track of the current situation.


    It has two essential factors:


    +   a. Model: It refers to the knowledge of “how things happen in the world.”


    +   b. Internal State: History-based representation of the current state.


    These agents perform actions based on the model by updating its state.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '+   iii. Goal-based agents: These agents expand Model-based agent capabilities
    by providing a factor called “goal” information; they perform and choose the actions
    that help them in achieving their goal. It checks all the possible actions before
    making a decision; these are names as searching and planning. This makes the goal-based
    agents proactive.


    +   iv. Utility-based agents: Utility-based agents act on their goals and try
    to find the best possible way to achieve their goals. It measures the utility
    of a state using a utility function.


    +   v. Learning agents: These agents can learn from past experiences, analyze
    their performance, and improve their performance. In the beginning, they act with
    the necessary knowledge they possess; later, they adapt and act through learning.


    It has four main components:


    +   a) Learning element: It is responsible for making changes by learning.


    +   b) Critic: Produces feedback used by the learning element, which helps agents
    modify the performance element for better results in the future.


    +   c) Performance element: Its responsibility is to select the external actions.


    +   d) Problem generator: It suggests actions that result in new and informative
    experiences.


    # 12.2 AI and its Related Fields


    Artificial Intelligence is interdisciplinary. It combines different areas, such
    as philosophy, mathematics, economics, neuroscience, psychology, computer theory,
    linguistics, and control theory [15]. These all disciplines together make AI more
    efficient [16]. Figure 12.4 express various disciplines of AI [15, 16].


    +   a. Philosophy: The study of fundamental things of knowledge, existence, mind,
    values, and language.


    +   b. Economics: Related to the production, distribution, and consumption of
    goods and services.


    +   c. Control Theory: Control of dynamical systems in machines and processes.


    +   d. Neuroscience: Study of structure and functionality of the nervous system.'
