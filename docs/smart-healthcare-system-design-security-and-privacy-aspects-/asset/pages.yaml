  md: 'The first type of AI is **Based on its Abilities**:


    +   i.   *NARROW AI*: Narrow or Weak AI is the most common AI; currently, it can
    perform a specific intelligence task. However, it cannot perform beyond its limits
    because it is trained only for a dedicated task. Hence it is termed as a Weak
    AI. Examples: image recognition, speech recognition, playing chess.


    ii.   *GENERAL AI*: The main aim of General AI is to build a system that can perform
    any task efficiently as humans with its intelligence. Currently, no such type
    of system exists; researches are going on in this field.


    iii.   *SUPER AI*: Developing systems that can perform more efficiently than humans
    come under the category of Super AI; it is a theoretical concept of AI. It includes
    some essential characteristics such as learning, planning, thinking, ability to
    make decisions, solving problems, etc.


    The second type of AI is **Based on its Functionalities**:


    +   i.   *Reactive Machines*: Reactive machines are the basic types of AI that
    do not store any past data for future actions; they only emphasize the current
    activity and react accordingly. Example: IBM''s Deep Blue system.


    ii.   *Limited Memory*: These systems can store past data or experience only for
    a limited period. Example: Self-driving car, it can store only recent information.


    iii.   *Theory of Mind*: The idea of Theory of Mind AI is to build a system that
    can understand human emotions, beliefs and enable them to interact socially as
    humans do.


    iv.   *Self Awareness*: It is a theoretical concept and is considered the future
    of Artificial Intelligence, where machines act smarter than humans.


    # 12.1.4  Intelligent Agents


    An Intelligent is an autonomous entity that performs actions through learning
    or observing from the environment with the help of consequent actuators and sensors
    to achieve its goals [12, 13]. It is similar to a computer program and can also
    be defined as a program that can perform'
