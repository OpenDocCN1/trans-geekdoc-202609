    result in waveform design [33]. The overall system is given a multi-channel EEG
    stream in segments of 3 s every second, and a set of features are extracted at
    each time point and denoted as a sample. These samples are taken every second
    such that the subsequent window taken overlaps. As a result, the samples collected
    show a more gradual transition from one epileptic seizure state to the next [19].
    A rectangular window is applied to each 3-second segment such that there is minimal
    distortion in the frequency response (some distortion will be present due to Gibbs
    Phenomenon).


    An FIR signal filter is applied to decompose the incoming EEG stream into its
    respective brain waves. Features are extracted from the incoming data streams
    starting from the beginning to the end of the EEG such that it simulates a real-time
    scenario. If a sample is extracted that contains mathematical anomalies resulting
    in values of NaN, the sample is simply discarded and skipped over. The training
    data used is 80% of a new random permutation of the entire training set for every
    classification performed, and the testing data is the sample that was extracted
    from the current window [30, 31]. Once the classifiers have each made a prediction,
    a decision fusion algorithm uses a set of rules to come up with an initial prediction.
    This prediction is given to the state decision neurons, which use a closed-loop
    algorithm to determine if a state change is necessary. Table 1.1 shows the various
    epileptic state of transient EEG cerebrum signals received and stored cloud from
    IoT-based mindset devices [3, 32].'
