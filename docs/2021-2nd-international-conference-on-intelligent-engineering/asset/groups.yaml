    摘要—我们被昂贵的 IoT（物联网）和get型设备所包围。这些设备旨在让生活更简单、更灵活。区块链创新对于识别和承认营利性项目中的威胁尤为必要。一种共享记录是由每笔交易创建的信息历史，以及在不需要外部监督的情况下管理资源的能力。从集成网络下载设置的设备需要信任电力，并且一旦被识别和保护，就不再需要审计。设备可以直接识别来自外部的威胁。区块链在业务网络中的一个优势是建立可以维护的信任社区，这可以扩展设备维护的效率和安全性。区块链的核心组件——不可篡改性，保护所有内容免受未经授权的更改。设备配置的整个历史都被记录下来，因此经常发生有效检测。监控工作组织设备以及交互的设备网络威胁和访问任务。设备的完整性和安全性应通过对组织状况进行广泛审查来遵循。本文阐述了区块链创新，并通过通过在区块链中实施设备配置的基于创新的控制网络设备提供数据。我们解决方案的关键性是使用区块链为大型企业网络循环
    IoT 设备配置文档。这极大地改进了区块链中配置的安全性和能力方案。


    IoT 工具已完全准备支持生产组织（例如，获取产品不同阶段的深度分析，提高性能并获得价格折扣）。IoT 设备的最主要吸引力在于它们提高了安全性、耐用性和能源效率。这些设备通过数据分析和控制收集实时或连续数据。随着设备数量的增加，网络威胁也随之增加。关键基础设施上的网络威胁可以得到有效管理。


    在本文，我们提出了一种基于区块链的方案用于监控 IoT 设备的状况。该方法旨在观察 IoT 实现的软件解决方案，以识别和承认未定义的软件操作（例如，漏洞）。软件收集数据并存储在箱和数据库中。为了确保软件运行，我们使用区块链，因为分布式记录保持了供应状态。对安全可用性的评估表明，


    术语——区块链、工业物联网、安全、监控


    # II. 文献


    ## I. 引言


    如今最关注的两个问题是区块链和物联网（IoT）。区块链和物联网的关注点和前景在于在不同领域开发不同的应用。区块链技术在每个网络中维护一个分布式且一致的账本，无需第三方。


    名为《工业物联网中防御未经授权软件更新的基于区块链的状态监控系统》(2020) [3](https://example.com/3) 的论文由 Wei, Wei
    Jian, Kim-Kwang, Raymond Chao 发表：每个共识证明都需要通过节点验证区块，以确认某些工作已完成并对结果进行说明。该任务通常是复杂的操作，涉及计算以在将区块添加到区块链之前获得正确答案。这实际上由矿工执行，并对权益证明共识中的计算能力有要求，节点要求它们在区块链上持有权益，并明确批准新区块加入区块链。上述内容由区块链内部的权益持有者无意实现，在计算能力方面并不一定是资源密集型的。


    防御恶意攻击但与隐私和透明度相关的问题是，收集的数据是敏感的，只能由授权用户查看。最近，区块链高并发和低吞吐量的担忧受到各种机制的限制。为了处理所有这些问题，开发了一种基于信誉机制的
    IoT 区块链系统。该协议解决了上述三个主要问题，提出了通用、可扩展且安全的基于区块链的 PoW 机制以及适用于功率受限 IoT 设备的足够的访问控制系统。


    - 优点：账本将作为业务的记录——交易（资产转移）和合约（交易发生的条件）

    - 缺点：整个系统可能会发生故障，通信可能会中断。


    ## A. BoSMoS


    名为《异构物联网中启用区块链：一种空间结构化方法》(2020) [2](https://example.com/2) 的论文由 Yiniao Liu, Kun
    Wan, Kai Gao, Miao Du 和 Song Guo 发表


    - 优点：它通过提供数据共享、隐私保护数据聚合和机密性等优势，有助于增强 IoT 系统的完整性。


    物联网在医疗保健、工业制造等知名领域有很多用途。通常，这种技术被用于与安全、授权和认证相关的深度应用。上述中心化方法可能会受到拒绝服务攻击，导致 IoT 网络崩溃。将区块链开发为存储在点对点
    (p2p) 网络中的只添加数据库，可以确保数据隐私和可扩展性。即使在 IoT 中使用区块链，仍然有很多无法完全消除的担忧。为了解决这些问题，开发了具有空间账本架构的区块链系统
    Tornado 以启用 IoT 中的区块链。我们使用了协作算法以及名为空间结构化和贪婪权重观测子树 (S2Ghost) 的协议。该协议确保数据和设备的唯一性。


    - 缺点：单点故障、女巫攻击和数据篡改。


    当区块链继续扩展时，应该讨论多个问题。这将使区块链不仅是可扩展和高效的，而且更加强大。它们包含的特征是可以独立接受的，无论识别这些特征的人多数是谁。尽管如此，所有这些特征的结合使其非常适用于许多人人感兴趣的应用。


    # III. 目标


    ## A. 准确性


    为了确保监控模块的准确性，错误的负值和正值会对整个网络产生严重影响。


    ## B. 监控


    监控模块旨在识别目标程序当前状态的变化并向终端管理员报警。


    - 优点：增强与合作伙伴、客户、供应商的连接。

    - 缺点：不同的方法论，并行工作流


    ## C. 迈向安全物联网


    名为《迈向安全物联网：基于信誉共识机制的区块链系统》(2019) [3](https://example.com/3) 的论文由 Junjie Huang,
    Hong Long, Guihai Chen, Min-You Wu, Xue Liu, Peng Zeng 发表


    ## D. 稳健性


    为了确保与该节点交互的其他节点是真实的，其他节点确认该节点的请求并对信任区块请求意图。


