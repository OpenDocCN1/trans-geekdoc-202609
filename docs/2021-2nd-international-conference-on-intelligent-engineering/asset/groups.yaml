    # IV. EXISTING SYSTEM


    The existing security undertakings by corporations deploying IoT are:


    # A. Risk Assessment Models


    Before installing and operating IoT systems, a risk assessment model should be
    employed to identify all the digital and physical components to be protected.
    Through vulnerability and risk assessments all should be discovered and classified
    as acceptable or unacceptable. Risk assessments should continue on an annual basis
    with periodic reviews.


    # B. Segmentation


    IoT systems should be divided into sub systems that have common security requirements,
    and isolated from each other. Information flow and access is restricted and protected
    by firewalls, ACLs, etc.


    # C. Device Integrity and availability


    Using CIA models, devices and components that are classified as critical are protected
    with mechanisms that provide support to them.


    # D. Encryption


    The IoT systems must employ to use cryptography protocols and advanced forms of
    encryption. Many industrial protocols currently in use are not designed with security
    in mind and lack authorization and encryption features. Data is at risk at both
    rest and in transit.


    # E. Privacy


    Encryption of confidential data needs to be ensured through widely used security
    protocols to ensure privacy in transit and as storage.


