    # 第 16 章 – Python 中的 OOP：其结构与用法


    到目前为止，在本书中，我们一直在常规地使用“object”（对象）这一表述。极端地说，迄今为止回顾的代码一直是基于对象的——我们在内容中传递问题，在语句中使用它们，调用它们的策略等。然而，要使我们的代码真正符合面向对象（OO）的资格，我们的文章通常还需要参与所谓的继承体系。本节开始对
    Python 类的探讨——一种用于在 Python 中实现支持继承的新类型对象的编码结构和工具。类是 Python 的主要面向对象编程（OOP）工具，因此我们将在本书的这一部分一同了解
    OOP 的基础知识。OOP 提供了一种不同且通常更强大的编程方法，我们在其中对代码进行分解以限制重复，并通过修改现有代码而非就地转换来编写新程序。在 Python
    中，类是用另一种声明创建的：`class`。正如你将看到的，用类定义的对象看起来很像我们在书中前面研究的内置类型。事实上，类实际上只是应用并扩展了我们已经掌握的思想；总体而言，它们是利用和处理内置对象类型的函数包。然而，类旨在创建和管理新对象，并支持继承——这是一种代码定制和复用的机制，远超我们迄今为止所见。提前说明一点：在
    Python 中，OOP 完全是可选的，你不必使用类就能开始。你可以用更简单的结构完成大量工作，例如函数，甚至简单的顶层脚本代码。由于有效使用类需要一些前期规划，它们通常对从事战略模式工作（进行长期产品开发）的人比对从事战术模式工作（时间难以寻觅）的人更有吸引力。尽管如此，正如你将在本书这一部分发现的，类被证明是
    Python 提供的最有用的工具之一。如果使用得当，类实际上可以大幅缩短开发时间。它们还用于主流 Python 工具，如 `tkinter` GUI API，因此大多数
    Python 开发人员多多少少都会发现掌握类的基础知识很有帮助。


    ## 为什么使用类？


    简单来说，类只是定义新类型事物的一种方式，反映程序领域中的真实对象。例如，假设我们决定实现我们用作示例的那个假设的披萨制作机器人。如果我们用类来实现它，就能展现更多其真实的结构和联系。这里有两个
    OOP 方面证明是有价值的：


    ### 继承


    披萨制作机器人是机器人的一种，所以它们拥有典型的机器人属性。用 OOP 术语来说，我们说它们从一般类别中“获得”属性。这些通用属性只需为一般情况实现一次，以后我们构建的各种机器人都可以部分或完全复用它们。


    披萨制作机器人实际上是协同工作的组件集合。例如，为了让我们的机器人成功，它可能需要移动面团的手臂、移动到烤箱的电机等。用 OOP 术语来说，我们的机器人是一个组合的例子；它包含其他对象，并激活它们来完成其任务。每个组件都可以编码为一个类，定义其自身的行为和联系。


    像继承和组合这样的通用 OOP 思想适用于任何可以分解为一组对象的应用程序。例如，在常规 GUI 框架中，界面被编写为小部件的集合——按钮、标签等——当它们的容器被绘制时，它们全部被绘制（组合）。此外，我们几乎可以肯定能编写自己的自定义小部件——具有独特字体的按钮、具有新配色方案的标签等——它们是更通用界面小部件的特定版本（继承）。


    从更具体的编程角度来看，类是 Python 程序单元，非常像函数和模块：它们是另一种用于捆绑逻辑和数据的容器。事实上，类也定义新的命名空间，很像模块。但与我们已经看到的其他程序单元相比，类有三个基本区别，使它们在构建新对象方面更有价值：


    ### 多实例


    类本质上是生产一个或多个对象的工厂。每次我们调用一个类，就会生成一个具有特定命名空间的新对象。从类生成的每个对象都可以访问类的特性，并获得自己的命名空间，用于存储因对象而异的数据。这类似于闭包函数的每次调用状态保持，但在类中是显式且通用的，只是类所做的事情之一。类提供了一套完整的编程方案。


    ### 通过继承进行定制


    类还支持 OOP 的继承概念；我们可以通过在类外部的新编程部分（编写为子类）中重新定义其特性来扩展一个类。更一般地说，类可以发展命名空间层次结构，定义供层次结构中类创建的对象使用的名称。这比其他工具更直接地支持多种灵活的实践。


    ### 运算符重载


    通过提供特殊的协议方法，类可以定义对我们在内置类型上看到的操作类型做出反应的对象。例如，用类创建的对象可以被切片、连接、索引等。Python 提供钩子，类可以用它们来拦截并实现任何内置类型操作。从根本上说，Python
    中 OOP 的机制在很大程度上只是两个神奇的部分：函数中的特殊第一个参数（用于获取调用的主体）和继承属性搜索（用于支持通过定制进行编程）。除此之外，该模型主要只是最终处理内置类型的函数。虽然不是非常新颖，但
    OOP 增加了一个额外的结构层，支持比平面过程模型更好的编程。连同我们之前遇到的函数式工具，它代表了一个重要的抽象步骤，高于计算机硬件，帮助我们构建越来越复杂的程序。


    ## 30,000 英尺高空俯瞰 OOP


    在我们看看这些在代码层面意味着什么之前，我想谈谈 OOP 背后的一般思想。如果你以前从未做过任何面向对象的事情，本节中的一些术语在第一遍阅读时可能会显得有点困惑。而且，这些术语背后的动机可能很微妙，直到你有机会思考程序员在大型系统中应用它们的方式。OOP
    既是一种体验也是一种技术。总之，本章详细探讨了 Python 中的 OOP。基于其创新能力，OOP 包含大量函数。事实上，此处给出的处理方式适用于所有人，甚至包括专家。作为本书中列举的人们偏爱
    Python 而非其他编程语言的优势之一，下一章将探讨如何用 Python 进行设计。不要急于求成；慢慢走好每一步，以获得良好的生产力。


