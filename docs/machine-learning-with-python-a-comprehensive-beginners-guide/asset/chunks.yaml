    \ 语句。该模型可以使此类包内导入越来越明确和简洁，但伴随着一些可能影响你项目的权衡。最后，对于使用 Python 3.3 及更高版本的“读者”，其新的命名空间包模型——允许包跨越多个目录且无需初始化文件——也将在此介绍。这种新式包模型是可选的，可以与最初的（现在称为“常规”）包模型配合使用，但它推翻了原模型的一些基本思想和规则。因此，我们将首先为所有“读者”探讨常规包，最后将命名空间包作为一个可选主题介绍。\n\
    \n## 包导入基础\n\n从基础层面来看，包导入很清晰——在你一直在导入语句中命名简单文件的地方，你可以改为列出一个由句点分隔的名称路径：\n\n```\n\
    import dir1.dir2.mod\n```\n\n`from` 语句同理：\n\n```\nfrom dir1.dir2.mod import x\n\
    ```\n\n这些声明中的“点分隔”路径预期对应于你电脑上目录链中的一条路径，指向文件 `mod.py`（或类似文件；扩展名可能不同）。也就是说，上述说明表明你的机器上有一个目录\
    \ `dir1`，它有一个子目录 `dir2`，其中包含模块文件 `mod.py`（或类似文件）。此外，这些导入暗示 `dir1` 位于某个容器目录 `dir0`\
    \ 内，而 `dir0` 是常规 Python 模块搜索路径的一部分。换句话说，这两条导入语句暗示的目录结构看起来类似于这样（显示为 Windows 反斜杠分隔符）：\n\
    \n```\ndir0\\dir1\\dir2\\mod.py\n# 或 mod.pyc, mod.so 等。\n```\n\n除非容器目录 `dir0`\
    \ 是顶层文件的主目录，否则必须将其添加到你的模块搜索路径中，这就像 `dir1` 是一个简单的模块文件一样。更正式地说，包导入路径中最左边的部分仍然是相对于\
    \ `sys.path` 模块中包含的目录的。然而，从那时起，你脚本中的导入语句显式地给出了通向包中模块的目录路径。\n\n## 包与搜索路径设置\n\n\
    如果你使用此元素，请记住，导入语句中的目录路径只能是由句点分隔的因素。你不能在导入语句中使用任何特定于平台的路径语法，例如 `C:\\dir1`、`My Documents.dir2`\
    \ 或 `../dir1` —— 这些在语法上不起作用。相反，请在模块搜索路径设置中使用任何此类特定于平台的语法来命名容器目录。例如，在前面的示例中，`dir0`\
    \ —— 你添加到模块搜索路径中的目录名 —— 可以是一个任意长且特定于平台的目录路径，通向 `dir1`。你不能使用如下无效声明：\n\n```\nimport\
    \ C:\\mycode\\dir1\\dir2\\mod  # 错误：非法句法\n```\n\n但是，你可以将 `C:\\mycode` 添加到 `PYTHONPATH`\
    \ 变量或 `.pth` 文件中，并在脚本中声明：\n\n```\nimport dir1.dir2.mod\n```\n\n基本上，模块搜索路上的条目提供特定于平台的目录路径前缀，通向\
    \ `import` 和 `from` 声明中最左边的名称。这些导入声明本身以平台中立的方式提供目录路径的其余部分。1 就基本文件导入而言，如果容器目录 `dir0`\
    \ 已经在模块搜索路径中，则无需添加；如果它是顶层文件的主目录、你正在逻辑上工作的目录、标准库目录或 site-packages 第三方安装根目录，则它已经在其中。无论如何，你的模块搜索路径必须包含代码中包导入声明最左边部分所在的所有目录。\n\
    \n## 包的 `__init__.py` 文件\n\n如果你使用包导入，还有一条限制必须遵守：至少直到 Python 3.3 之前，包导入语句路径中命名的每个目录都必须包含一个名为\
    \ `__init__.py` 的文件，否则你的包导入将失败。也就是说，在我们一直使用的示例中，`dir1` 和 `dir2` 都必须包含一个名为 `__init__.py`\
    \ 的文件；容器目录 `dir0` 不需要此类文件，因为它未在 `import` 语句本身中列出。更正式地说，对于如下目录结构：\n\n```\ndir0\\\
    dir1\\dir2\\mod.py\n```\n\n以及如下形式的 `import` 语句：\n\n```\nimport dir1.dir2.mod\n\
    ```\n\n适用以下原则：\n\n*   `dir1` 和 `dir2` 都必须包含 `__init__.py` 文件。\n*   `dir0`，即容器，不需要\
    \ `__init__.py` 文件；如果存在，该文件基本上会被忽略。\n*   `dir0`，而不是 `dir0\\dir1`，必须列在模块搜索路径 `sys.path`\
    \ 上。\n\n为了满足前两条准则，包创建者必须创建我们将在此探讨的类型的文件。为了满足最后一条，`dir0` 必须是自动路径部分（主目录、库或 site-packages\
    \ 目录），或在 `PYTHONPATH` 或 `.pth` 文件设置或手动 `sys.path` 更改中给出。\n\n> 1. 选择点分隔路径语法部分是为了平台中立性，但也因为导入声明中的路径成为真正的嵌套对象路径。这种语法也意味着，如果你忘记在导入声明中省略\
    \ `.py`，可能会得到奇怪的错误消息。例如，`import mod.py` 被认为是一个目录路径导入 —— 它加载 `mod.py`，然后尝试加载 `mod\\\
    py.py`，最后发出一个可能令人困惑的“No module named py”错误消息。截至 Python 3.3，此错误消息已改进为“No module\
    \ named 'm.py'; m isn't a package.”\n\n其净效果是，本示例的目录结构应如下所示，缩进表示目录嵌套：\n\n```\n\
    dir0\\          # 模块搜索路上的容器\ndir1\\\n    __init__.py\ndir2\\\n    __init__.py\n\
    mod.py\n```\n\n`__init__.py` 文件可以包含 Python 代码，就像预期的模块文件一样。它们的名称之所以特殊，是因为它们的代码在\
    \ Python 程序第一次导入目录时会自动运行，因此主要作为执行包所需初始化步骤的钩子。这些文件也可以完全为空，此外，有时还有额外的作用 —— 正如下一节所述。正如我们将在本章末尾看到的，包必须拥有名为\
    \ `__init__.py` 的文件这一要求在 Python 3.3 中已被取消。在该版本及更高版本中，没有此类文件的模块目录可以作为单目录命名空间包导入，其工作方式相同，但不运行初始化时代码文件。然而在\
    \ Python 3.3 之前，以及在所有 Python 2.X 中，包仍然需要 `__init__.py` 文件。正如前面所述，在 3.3 及更高版本中，如果使用这些文件，它们还提供初始化优势。\n\
    \n### 包初始化文件的角色\n\n更详细地说，`__init__.py` 文件作为包初始化时活动的钩子，声明目录为 Python 包，为目录生成模块命名空间，并在使用目录导入时实现\
    \ `from *`（即 `from .. import *`）语句的行为：\n\n**包初始化**\nPython 程序第一次通过目录导入时，会自动运行该目录\
    \ `__init__.py` 文件中的所有代码。因此，这些文件是放置包中文件所需状态初始化代码的常用位置。例如，包可以使用其初始化文件来创建所需的数据文件、打开数据库连接等。通常，`__init__.py`\
    \ 文件不打算在直接执行时有用；它们在包首次被访问时自动运行。\n\n**模块便利语句**\n包的 `__init__.py` 文件也在某种程度上用于声明目录是一个\
    \ Python 包。在此角色中，这些文件用于防止具有通用名称的目录无意中隐藏稍后出现在模块搜索路径上的真实模块。如果没有此保护，Python 可能会选中一个与你的代码无关的目录，因为它出现在搜索路径上较早的位置。正如我们稍后将看到的，Python\
    \ 3.3 的命名空间包阻止了这方面的大部分作用，但通过在路径上向前检查以发现后续文件，以算法方式实现了类似的效果。\n\n在本章中，你已经了解了 Python\
    \ 模块的入门级知识。你使用 Python 的范围现在将得到加强。这不仅仅是模块中的唯一内容，请确保将之前关于包的讨论与之结合。话虽如此，我们现在将转向 Python\
    \ 编程中的面向对象编程（OOP）。别担心，什么是 OOP 将伴随其功能和优势一同给出。Python 变得越来越有趣了。请随我进入下一章。\n\n"
