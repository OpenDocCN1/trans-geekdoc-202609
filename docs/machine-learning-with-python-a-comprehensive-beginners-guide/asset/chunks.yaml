    \ 子句捕获并停止异常——它们是你在引发异常时处理和恢复异常的地方；当在此处引发异常时，控制返回到最近进入的 `try` 以运行其 `finally` 子句，但随后异常继续传播到所有活动\
    \ `try` 语句中的 `finally`，并最终到达默认的顶层处理器，在那里打印错误消息。`finally` 子句阻塞（但不停止）异常——它们用于在“退出途中”执行的操作。\n\
    \n### 示例：控制流嵌套\n\n让我们转向一个示例，使这种嵌套概念更加具体。以下模块文件 `nestexc.py` 定义了两个函数。`action2`\
    \ 被编码为触发异常（你不能将数字和序列相加），而 `action1` 将对 `action2` 的调用包装在一个 `try` 处理器中，以捕获该异常：\n\
    \n```\ndef action2():\n    print(1 + []) # 生成 TypeError\n\ndef action1():\n  \
    \  try:\n        action2()\n    except TypeError: # 最近的匹配 try\n        print('inner\
    \ try')\n\ntry:\n    action1()\nexcept TypeError: # 仅当 action1 重新引发时才到这里\n   \
    \ print('outer try')\n```\n\n```\n% python nestexc.py\ninner try\n```\n\n然而请注意，文件底部的顶层模块代码也将对\
    \ `action1` 的调用包装在一个 `try` 处理器中。当 `action2` 触发 `TypeError` 异常时，将有两个活动的 `try` 语句——`action1`\
    \ 中的一个，以及模块文件顶层的一个。Python 选择并仅运行最近的、带有匹配 `except` 的 `try`——在本例中是 `action1` 内部的\
    \ `try`。再次强调，异常最终去向何处取决于程序在运行时的控制流。因此，要想知道你将去向何处，你需要知道你从何而来。在这种情况下，异常的处理位置更多地取决于控制流，而不是语句语法。但我们也可以在语法上嵌套异常处理器——我们接下来将转向一个类似的例子。\n\
    \n### 示例：语法嵌套\n\n正如我之前提到的，当我们查看新的统一 `try/except/finally` 语句时，可以通过源代码中的位置在语法上嵌套\
    \ `try` 语句：\n\n```\ntry:\n    try:\n        action2()\n    except TypeError: #\
    \ 最近的匹配 try\n        print('inner try')\nexcept TypeError: # 仅当嵌套处理器重新引发时才到这里\n\
    \    print('outer try')\n```\n\n诚然，这段代码建立的处理器嵌套结构与（并且行为与）前一个示例完全相同。事实上，语法嵌套的工作方式与前面概述的情况完全一样。唯一的区别是嵌套处理器物理嵌入在\
    \ `try` 块中，而不是编码在从 `try` 块调用的其他函数中。例如，无论嵌套的 `finally` 处理器是语法上嵌套，还是通过运行时流经物理上分离的代码部分嵌套，发生异常时它们都会全部执行：\n\
    \n```\n>>> try:\n...     try:\n...         raise IndexError\n...     finally:\n\
    ...         print('spam')\n...     finally:\n...         print('SPAM')\n...\n\
    spam\nSPAM\nTraceback (most recent call last):\n  File \"<stdin>\", line 3, in\
    \ <module>\nIndexError\n```\n\n对于这段代码任务的现实描述；效果是相同的，但函数逻辑已在此处内联为嵌套语句。对于语法嵌套工作的一个更有用的例子，请考虑以下文件\
    \ `except_finally.py`：\n\n```\ndef raise1():\n    raise IndexError\n\ndef noraise():\n\
    \    return\n\ndef raise2():\n    raise SyntaxError\n\nfor func in (raise1, noraise,\
    \ raise2):\n    print('<%s>' % func.__name__)\n    try:\n        try:\n      \
    \      func()\n        except IndexError:\n            print('caught IndexError')\n\
    \        finally:\n            print('finally run')\n    print('...')\n```\n\n\
    ```\n% python except_finally.py\n<raise1>\ncaught IndexError\nfinally run\n...\n\
    <noraise>\nfinally run\n...\n<raise2>\nfinally run\nTraceback (most recent call\
    \ last):\n  File \"except_finally.py\", line 9, in <module>\n    func()\n  File\
    \ \"except_finally.py\", line 3, in raise2\n    def raise2(): raise SyntaxError\n\
    SyntaxError: None\n```\n\n已经确定语句可以与条件语句混合在同一个 `try` 语句中。这，加上对多个 `except` 子句的支持，使得本节描述的一些语法嵌套变得多余，然而，类似的运行时嵌套在更大的\
    \ Python 程序中很常见。此外，语法嵌套至今仍然有效，可能仍出现在你可能遇到的 Python 2.5 之前编写的代码中，可以使 `except` 和\
    \ `finally` 的不同角色更加明确，并且可以作为一种在整体上实现替代异常处理实践的技术。\n\n让我们从回顾开始——Python 的 OOP 实现可以用三个想法概括：\n\
    \n*   **继承**：Python 中的继承基于属性查找（在 `X.name` 表达式中）。\n*   **多态**：在 `X.method` 中，方法的含义取决于主体对象\
    \ `X` 的类型（类）。\n*   **封装**：方法和运算符实现行为，但数据隐藏默认是一种约定。\n\n到目前为止，你应该对 Python 中继承的含义有很好的感觉。我们已经讨论过\
    \ Python 的多态几次了；它源于 Python 缺乏类型声明。由于属性总是在运行时解析，实现相同接口的对象天然可互换；客户端不需要知道实现它们调用的方法的对象是什么类型。封装在\
    \ Python 中意味着打包——即在对象接口后隐藏实现细节。它不意味着强制安全，尽管那可以用代码实现。无论如何，封装在 Python 中是可用且有用的：它允许在不影响该对象用户的情况下更改对象接口的实现。\n\
    \n总之，本章成功解释了如何以及何时使用 Python 编程语言进行设计。下一章将讨论 Python 编程中的异常及其工具。在这个阶段，异常的知识并非真正必要，所以只会讨论其中的一小部分。让我们一起踏上最后一章的旅程；只会更好。\n\
    \n# 第 18 章 – Python 的异常与工具\n\n在这里，我们将深入一些——本章更正式地介绍 Python 中的异常处理语法。具体来说，我们将探讨\
    \ `try`、`raise`、`assert` 和 `with` 语句背后的细节。正如我们将看到的，尽管这些语句大多很简单，但它们为处理 Python 代码中的异常情况提供了强大的工具。我将专注于近期\
    \ Python 2.X 和 3.X 版本中异常的状态，但由于你在很长一段时间内仍极有可能在代码中看到最初的方法，我将在此过程中指出该领域的发展历程。\n\n\
    ## `try/except/else` 语句\n\n既然我们已经看过基础知识，是时候深入细节了。在接下来的讨论中，我将首先将 `try/except/else`\
    \ 和 `try/finally` 作为独立的语句呈现，因为在 2.5 之前的 Python 版本中，它们扮演不同的角色且不能合并，而且至今在逻辑上仍可能是截然不同的。根据前面的说明，在\
    \ Python 2.5 及更高版本中，`except` 和 `finally` 可以混合在单个 `try` 语句中；在我们单独探讨了这两种不同形式之后，我们将看到这种合并的含义。\n\
    \n从语法上讲，`try` 是一个复合的、多部分的语句。它以 `try` 头行开始，后面跟着一块（大多）缩进的语句；然后是一个或多个 `except` 子句，标识要捕获的异常和处理它们的块；最后是一个可选的\
    \ `else` 子句和块。你通过将 `try`、`except` 和 `else` 缩进到同一级别（即垂直对齐）来关联它们。作为参考，这是 Python\
    \ 3.X 中最通用和最完整的配置：\n\n```\ntry:\n    statements # 首先运行此主要操作\nexcept name1:\n \
    \   statements # 如果在 try 块中引发 name1 则运行\nexcept (name2, name3):\n    statement\
    \ # 如果发生这些异常中的任何一个则运行\nexcept name4 as var:\n    statements # 如果引发 name4 则运行，将引发的实例赋值给\
    \ var\nexcept:\n    statements # 为引发的所有其他异常运行\nelse:\n    statements # 如果 try\
    \ 块中未引发异常则运行\n```\n\n从语义上讲，此语句中 `try` 头下的块代表语句的主要操作——你试图运行并用错误处理逻辑包装的代码。`except`\
    \ 子句定义了在 `try` 块期间引发的异常的处理器，而 `else` 子句（如果编写）提供了一个处理器，如果没有发生异常则运行它。这里的 `var` 部分与\
    \ `raise` 语句和异常类的特性有关。\n\n### Try 语句如何工作\n\n操作上，`try` 语句的运行方式如下。当进入 `try` 语句时，Python\
    \ 标记当前程序上下文，以便在发生异常时可以返回。`try` 头下嵌套的语句首先运行。接下来发生的事情取决于 `try` 块的语句运行时是否引发异常，以及它们是否与\
    \ `try` 正在查找的异常匹配：\n\n*   如果在 `try` 块的语句运行时发生异常，并且该异常与语句命名的某个异常匹配，Python 会跳回到\
    \ `try` 并运行第一个匹配引发异常的 `except` 子句下的语句，在将引发的异常对象赋值给子句中 `as` 关键字后命名的变量之后（如果存在）。`except`\
    \ 块运行后，控制随即继续在整个 `try` 语句之下（除非 `except` 块本身引发另一个异常，在这种情况下，从代码中的这一点重新开始该过程）。\n\
    *   如果在 `try` 块的语句运行时发生异常，但该异常与语句命名的异常不匹配，则该异常向上传播到下一个最近进入的、匹配该异常的 `try` 语句；如果找不到这样的匹配\
    \ `try` 语句且搜索达到进程的顶层，Python 会终止程序并打印默认错误消息。\n*   如果在 `try` 块的语句运行时没有发生异常，Python\
    \ 运行 `else` 行下的语句（如果存在），然后控制继续在整个 `try` 语句之下。\n\n换句话说，`except` 子句捕获 `try` 块运行时发生的任何匹配异常，而\
    \ `else` 子句仅在 `try` 块运行时未发生异常时运行。引发的异常通过我们将在下一节探讨的超类关系与 `except` 子句中命名的异常匹配，空的\
    \ `except` 子句（没有异常名）匹配所有（或所有其他）异常。`except` 子句是聚焦的异常处理器——它们仅捕获发生在相关 `try` 块语句内的异常。然而，由于\
    \ `try` 块的语句可以调用程序其他地方编写的函数，异常的来源可能在 `try` 语句本身之外。事实上，`try` 块可能调用任意数量的程序代码——包括可能有自己的\
    \ `try` 语句的代码，当异常发生时将首先被搜索。也就是说，`try` 语句可以在运行时嵌套。\n\n### Try 语句子句\n\n当你编写 `try`\
    \ 语句时，各种子句可以出现在 `try` 头之后。如果你列出了所有潜在形式的大纲之一，你应该列出它。我们已经遇到了其中一些：正如你所知，`except`\
    \ 子句捕获异常，`finally` 子句在退出时运行，`else` 子句在未遇到异常时运行。正式地，可以有任意数量的 `except` 子句，但只有在有一个\
    \ `except` 的情况下才能编写 `else`，并且只能有一个 `else` 和一个 `finally`。在 Python 2.4 及之前，`finally`\
    \ 子句必须单独出现（没有 `else` 或 `except`）；`try/finally` 实际上是一个不同的语句。从 Python 2.5 开始，`finally`\
    \ 可以出现在与 `except` 和 `else` 相同的语句中（当我们遇到统一的 `try` 语句时，稍后将详述排序规则）。\n\n| 子句形式 | 解释\
    \ |\n| :--- | :--- |\n| `except:` | 捕获所有（或所有其他）异常类型。 |\n| `except name:` | 仅捕获特定的异常。\
    \ |\n| `except name as value:` | 捕获列出的异常并赋值其实例。 |\n| `except (name1, name2):`\
    \ | 捕获列出的任何异常。 |\n| `except (name1, name2) as value:` | 捕获列出的任何异常并赋值其实例。 |\n|\
    \ `else:` | 如果 `try` 块中未引发异常则运行。 |\n| `finally:` | 退出时始终执行此块。 |\n\n当我们稍后在本章中遇到\
    \ `raise` 语句时，我们将更详细地探讨带有额外 `as value` 部分的条目。它们提供对作为异常引发的对象的访问。\n\n#### 捕获所有异常\n\
    \n此处的第一和第四个条目是新的：\n\n*   不列出异常名的 `except` 子句（`except:`）捕获 `try` 语句中先前未列出的所有异常。\n\
    *   在括号中列出一组异常的 `except` 子句（`except (e1, e2, e3):`）捕获列出的任何异常。\n\n由于 Python 通过从上到下检查\
    \ `except` 子句来在给定的 `try` 中查找匹配项，括号形式的效果与在各自的 `except` 子句中列出每个异常相同，但你只需为每个异常编写一次关联的语句体。这是多个\
    \ `except` 子句工作的示例，展示了你的处理器可以有多具体：\n\n```\ntry:\n    action()\nexcept NameError:\n\
    \    ...\nexcept IndexError:\n    ...\nexcept KeyError:\n    ...\nexcept (AttributeError,\
    \ TypeError, SyntaxError):\n    ...\nelse:\n    ...\n```\n\n在该示例中，如果在 `action`\
    \ 函数调用运行时引发异常，Python 会返回到 `try` 并搜索第一个命名引发异常的 `except`。它从上到下、从左到右检查 `except` 子句，并在第一个匹配项下运行语句。如果没有匹配项，异常将传播到此\
    \ `try` 之外。请注意，`else` 仅在动作中未发生异常时运行——当引发没有匹配 `except` 的异常时，它不运行。\n\n#### 捕获所有：空的\
    \ `except`\n\n如果你确实想要一个通用的“捕获所有”子句，请使用空的 `except`：\n\n```\ntry:\n    action()\n\
    except NameError:\n    ... # 处理 NameError\nexcept IndexError:\n    ... # 处理 IndexError\n\
    except:\n    ... # 处理所有其他异常\nelse:\n    ... # 处理无异常情况\n```\n\n空的 `except` 子句是一种异常包含形式——因为它能发现一切，它允许你的处理器像你想要的那样通用或具体。在某些情况下，这种形式可能比在\
    \ `try` 中列出所有可能的异常更有用。例如，以下代码在不列出任何内容的情况下发现一切：\n\n```\ntry:\n    action()\nexcept:\n\
    \    ... # 捕获所有可能的异常\n```\n\n然而，空的 `except` 也引发了一些结构问题。虽然方便，但它们可能会捕获与你的代码无关的意外系统异常，并可能无意中捕获用于其他处理器的异常。例如，即使在\
    \ Python 中系统退出调用和 `Ctrl-C` 组合键也会触发异常，通常你希望这些能通过。更糟糕的是，空的 `except` 也可能捕获真正的编程错误，对于这些错误你很可能想看到错误消息。我们将在本书这一部分的最后作为一个陷阱回到这个问题。目前，我只想说，“谨慎使用。”\n\
    \nPython 3.X 更强烈地支持一种替代方案，解决了其中一个问题——捕获名为 `Exception` 的异常几乎具有与空 `except` 相同的效果，但忽略与系统退出相关的异常：\n\
    \n```\ntry:\n    action()\nexcept Exception:\n    ... # 捕获所有可能的异常，除了退出\n```\n\n\
    我们将在下一章正式探讨异常类时，探讨这种形式如何施展它的巫术。简而言之，它之所以有效，是因为如果异常是 `except` 子句中命名的类的子类，则它们匹配，而\
    \ `Exception` 是你通常应该捕获的所有异常的超类。这种形式具有大部分相同的...\n\n总之，本章已竭尽全力向你介绍 Python 编程中的异常及其工具。我要说，这里给出的处理更多的是初学者级别而非专家级别；整个异常体系肯定需要专业知识。\n\
    \n# 结语\n\n恭喜程序员，你已学完 Python 作为初学者所需的一切内容。我非常确信你作为程序员的未来是光明的。如果你有进一步的问题或疑虑，请再次回顾所给的步骤；尽管不期望会有疑虑。与朋友和家人分享这本书；告诉他们它对你有多有用。让他们点击“加入购物车”并享受数字生活。保持祝福！\n\
    \n"
