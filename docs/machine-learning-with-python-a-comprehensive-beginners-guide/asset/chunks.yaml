    \n总之，我们已经成功讨论了 Python 中的循环。这使你作为程序员的工作变得更轻松。接下来要讨论的是 Python 编程中的函数。下一章更多的是为你作为程序员准备的，而不是编程本身。让我们抚摸下面的知识吧。\n"
