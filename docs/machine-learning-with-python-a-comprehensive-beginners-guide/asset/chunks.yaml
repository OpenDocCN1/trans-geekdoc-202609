    ```\n\n## 局部变量的作用域和生命周期\n\n变量的作用域是指程序中能够识别该变量的部分。在函数内部定义的变量和参数具有局部作用域，从函数外部不可见。另一方面，变量的生命周期是指它在内存中存在的时间。其生命周期与函数的执行相对应，当你从函数返回时结束。一旦到达\
