    `b` 在函数首次被调用时最初引用由变量 `X` 和 `L` 引用的对象。通过变量 `b` 修改列表导致 `L` 在调用返回后看起来不同。如果你回顾一下我们关于共享可变对象的讨论，你会认出正在起作用的现象：就地修改可变对象可能会影响对该对象的其他引用。在这里，其效果是使其中一个参数既像函数的输入又像输出。


    令人惊讶的是，参数在之前的学习过程中已经被纳入了。我相当确定你可能直到现在才对其工作原理感到困惑，因为现在才得到解释。Python 包中有不同的模块用于不同的功能。这更像是你对特定模块理解得越透彻，编码效率就越高。这就是为什么模块将在下一章中处理。翻到下一章，让我们立刻学习模块吧。

    '
