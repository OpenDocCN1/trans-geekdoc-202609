    # Chapter 1 – Getting to Know Python


    Because this book is for beginners, it is important to introduce you to how to
    get started with Python Programming language, its usefulness, disadvantages, why
    it is preferred by many and lots more.


    Generally, Python is regarded as an open source language with high-level programming
    language functionality. At its inception in the 1980s, it was developed by Guido
    van Rossum but later managed by the Python Software Foundation. One motivating
    factor for Guido is because of how ABC came from a language that shaped his own
    career. As noted in the description section of this book, Python is one of the
    most powerful languages that can be used to create games, write GUIs, and develop
    web applications.


    When Python language codes are examined by their reading and writing prowess,
    it is more or less reading and writing regular English statements; they are not
    written in a machine-readable language, actually. The Python programs do not have
    to be processed before machines can run them; they will only be interpreted. Besides,
    Python is an interpreted language (it has an interpreter). This means that every
    time a program is run after coding, this interpreter will run through the code
    and translate it into machine-readable byte code.


    Python is an object-oriented language that allows users to manage and control
    data structures because it has a huge data structure types. It has objected to
    create and run programs too. Because everything is done on Python is at the programmers''
    and users'' advantage, all functions, objects, classes, data types, and methods
    take an equal position in Python. It is a high-level language. In order to serve
    its full function as satisfying the programmers need, Python works effectively
    as a tool to develop lifestyles, society at large, applications that are for human
    benefits and economy.


    There is no doubt, Python makes everything better; it enhances productivity, communication,
    and levels of efficiency at work. One of the basic characteristics of any language
    is that it can die and become extinct thereby newer languages are substituted
    for it –Python has proven otherwise over the years. It takes a language with great
    vitality to stand the test of time. Python, in itself, has stood the test of time
    and has proven to be useful in all ramifications where it has been applied since
    inception. Because of how profitable, simple and effective Python is, it is recommended
    for everyone especially those who want to take programming as their profession
    –those without prior programming knowledge will surely find this interesting.


    Having given a short introduction of Python, you must have been intimated on it.
    Then, you may ask, to what advantage is Python? The advantages of using Python
    programming language can’t be overemphasized, they include:


    ## Improved Productivity


    Even though codes used in Python programming are relatively shorter, simpler,
    and not really much compared to other high-level programming languages such as
    and C++, etc. In the same vein, Python has well-built-in features designed to
    yield higher productivity. Also, it has a standard library as well as a chance
    to third-party modules and other source libraries. These are the unique features
    that make programming in Python language more yielding and efficient.


    ## Easy Learnability


    As effective as Python is, it is considerably easy to learn. This why very Many
    people prefer and find Python to be a good first language in learning programming.
    In fact, many programmers will recommend it over and over again for beginners.
    This is because Python uses simple syntax alongside shorter codes.


    ## Easy Readability


    Python programs use exact, clear, and concise instructions that are very easy
    to read. Those who do not even have substantial programming background will ultimately
    find it very easy –this is the strength of Python. Because of the cycle of edit,
    run and debug functions, Programs written in Python are, easy to maintain, debug,
    or enhance –this is readability.


    ## Wide Support of Major Platforms


    Python programming cut across works on Windows, macOS, Linux/UNIX, and other operating
    systems, even for small form devices. Also, it can run on devices such as remote
    controls, micro-controllers used in appliances, toys, embedded devices, etc.


    ## Software Quality


    By the readability function of Python, reusability and maintenance of the codes
    made it an outstanding programming language other than just the archaic scripting.
    The quality of the software is based on the fact that the uniformity of the codes
    is beyond the traditional scripting. With this, it is very easy to read it by
    everyone even those without foreknowledge of programming. The enhancement of coherence
    function in the setting of the Python makes it of high and unique quality too.
    The mechanism of being able to use the same codes repeatedly is a unique attribute
    of Python programming as well.


    ## Less work; more productivity


    One of the reasons programmers prefer Python is because less of their coding will
    yield high productivity. Apart from this, the program runs instantaneously without
    needing to go through compilation processes like other languages such as Java
    or C++, would require. In other words, there is less thing to type, debug or maintain
    once the program runs adequately. This encourages programmers to move faster with
    the work.


    ## Program Durability


    Durability means that one could run the same codes for a given program on diverse
    platforms. With a single string of code, the same actions can be carried out on
    other platforms though with differences which could be because it is the same
    code on different platforms. Diverse options for coding good graphics, user interfaces,
    etc. are always present. Meanwhile, codes from other programs like Windows and
    Linux will strongly require script’s code which will not make it for them to be
    used on other platforms.


    ## Component Integration and Vacillation


    With different mechanisms, Python scripts can easily communicate with other parts
    of an application. Additionally, such integrations allow Python to be used as
    a product of customization and extension tool. The kind of transformation that
    have hit Python now, its code can invoke C and C++ libraries and can be called
    from C and C++ programs too. Amazingly this code can be integrated with Java and
    .NET components. It can communicate over frameworks such as COM and Silverlight.
    Because of this integration, the code can interface with devices over serial ports
    and can interact over networks with interfaces like XML-RPC, SOAP, and CORBA.


    ## Diverse in-built-libraries Permit


    One of the special thing about Python and why people prefer it is because it comes
    with a standard dictionary. This library sssupports an array of application-level
    programming tasks, from text pattern matching to network scripting. More so, Python
    can serve as an extension with both in-built libraries and a large collection
    of third-party application support software. Python’s third-party domain offers
    tools for website construction, numeric programming, serial port access, game
    development, etc.


    ## Easy to Operate


    The pleasure derived from using Python is another factor contributing to why people
    prefer it to other languages. This is because the arduous task (coding) is demystified
    to more or less like a normal house chore. As a result, Python uses built-in tools.
    While this kind of reason could be weak considering the level of its relevance,
    increment in productivity and the software quality are notable reasons alongside
    it.


    Having said lots about how Python is built, the question remains, is Python a
    “Scripting Language”? Or does Python has anything in relation to Scripting? To
    answer this question, know that Python is a general-purpose programming language
    that is often applied in scripting roles. Also, Python is generally defined as
    an object-oriented scripting language. This is a kind of definition that lends
    support for OOP with an overall orientation toward scripting roles as well. If
    pressed for a one-liner, say that Python is probably better known as a general-purpose.


    For a complete look at understanding Python, type the command `import this` at
    any Python interactive prompt (you will understand this later on in the rest of
    the book). This should invoke an “Easter egg” hidden in Python—a collection of
    design principles underlying Python that permeate both the language and its user
    community. Among them, the acronym EIBTI is now fashionable jargon for the “explicit
    is better than implicit” rule.

    '
