    \ `break`；在 `while` 循环中，如果头部的测试一开始就是假，就会发生这种情况。因此，在前面的示例中，如果 `x` 最初小于或等于 1（例如，如果\
    \ `y` 是 2），你仍然会得到 \"is prime\" 消息。\n\n此示例确定质数，但只是非正式地。根据严格的数学定义，小于 2 的数不被视为质数。为了完全精确，此代码对于负数也会失败，对于没有小数位的浮点数则会成功。另请注意，由于\
