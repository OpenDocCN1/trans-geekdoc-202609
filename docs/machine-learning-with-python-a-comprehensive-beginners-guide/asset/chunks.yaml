    # Chapter 13 – The Arguments of Python


    正如我们所了解的，名称在代码中定义的位置决定了其含义的很大一部分。本章将继续讲述函数的故事，通过探讨 Python 参数传递的概念——即对象如何作为输入发送给函数。正如我们将看到的，参数（也称为形参）被赋值给函数中的名称，但它们与对象引用的关系更大，而非变量作用域。我们还将发现
    Python 提供了额外的工具，例如关键字参数、默认值、可变参数收集器和解包器，这些工具允许在向函数传递参数时具有极大的灵活性，我们将在示例中演示它们的用法。在你内化这些概念后，你需要理解参数传递的基础知识。


    ## 参数传递基础


    在本书的这一部分之前，我提到过参数是通过赋值传递的。这有几个对新手并不总是显而易见的含义，我将在本节中详细阐述。以下是向函数传递参数的关键点概述：


    *   **参数通过自动将对象赋值给局部变量名来传递。** 函数参数——调用者发送的对象引用——只是 Python 赋值机制工作的另一个实例。由于引用是作为指针实现的，因此所有参数实际上都是按指针传递的。作为参数传递的对象永远不会被自动复制。

    *   **在函数内部给参数名赋值不会影响调用者。** 函数头部的参数名在函数运行时成为新的局部名称，其作用域限于该函数。函数参数名与调用者作用域中的变量名之间没有关联。

    *   **在函数中更改可变对象参数可能会影响调用者。** 另一方面，由于参数本质上是赋值给传入的对象，函数可以就地修改传入的可变对象，其结果可能会影响调用者。可变参数可以作为函数的输入和输出。


    有关引用的更多细节，请参见第 6 章；我们在那里学到的所有内容也适用于函数参数，只是赋值给参数名是自动且隐式的。Python 的按赋值传递方案与 C++ 的引用参数选项并不完全相同，但它在实践中基本类似于
    C 语言（及其他语言）的参数传递模型：


    *   **不可变参数实际上是“按值传递”**。诸如数字和字符串之类的对象是通过对象引用而非复制来传递的，但由于你无论如何都无法就地更改不可变对象，因此其效果很像创建了一个副本。

    *   **可变参数实际上是“按指针传递”**。诸如列表和字典之类的对象也是通过对象引用传递的，这类似于 C 语言将数组作为指针传递的方式——可变对象可以在函数中就地修改，很像
    C 数组。


    当然，如果你从未使用过 C，Python 的参数传递模式看起来会更简单——它仅涉及将对象赋值给名称，并且无论对象是否可变，其工作方式都相同。


    ## 参数与共享引用


    为了演示参数传递属性的实际效果，请考虑以下代码：


    ```

    >>> def f(a):          # a 被赋值为（引用）传入的对象

    ...     a = 33         # 仅改变局部变量 a

    ...

    >>> b = 404

    >>> f(b)               # a 和 b 最初都引用同一个对象 404

    >>> print(b)           # b 未被改变

    404

    ```


    在该模型中，当使用 `f(b)` 调用函数时，变量 `a` 被赋值为对象 `404`，但其生命周期仅存在于被调用函数内部。在函数内部更改 `a` 对函数被调用的位置没有影响；它只是将局部变量
    `a` 重置为一个完全不同的对象。这就是所谓的无名称关联——在函数内部给参数名赋值（例如 `a=33`）不会神奇地改变调用者作用域中的变量 `b`。参数名最初可能共享传入的对象（它们本质上是指向这些对象的指针），但仅在函数首次被调用时。一旦参数名被重新赋值，这种关联就结束了。


    这仅适用于对参数名本身的赋值情况。每当参数作为列表和字典等可变对象传递时，我们还必须意识到，对这些对象的就地修改可能在函数退出后依然存在，从而影响调用者。以下是一个展示此行为的示例：


    ```

    >>> def changer(a, b):  # 参数被赋值为对象的引用

    ...     a = 2           # 仅改变局部名称的值

    ...     b[0] = ''leave''  # 就地修改共享对象

    ...

    >>> X = 1

    >>> L = [1, 2]          # 调用者：

    >>> changer(X, L)       # 传入不可变和可变对象

    >>> X, L                # X 未改变，L 变了！

    (1, [''leave'', 2])

    ```


    在这段代码中，`changer` 函数给参数本身赋值，并给参数 `b` 引用的对象的一个分量赋值。这两个函数内部的赋值在语法上只有细微差别，但结果却截然不同：


    *   因为 `a` 将成为函数作用域中的局部变量名，第一个赋值对调用者没有影响——它只是将局部变量 `a` 重置为引用一个完全不同的对象，并不会改变调用者作用域中名称
    `X` 的绑定。这与前一个示例相同。

    *   参数 `b` 也是一个局部变量名，但它被传入了一个可变对象（调用者作用域中 `L` 引用的列表）。由于第二个赋值是一个就地对象修改，函数中对 `b[0]`
    的赋值结果会影响函数返回后 `L` 的值。实际上，`changer` 中的第二个赋值语句并没有改变 `b`——它改变了 `b` 当前引用的对象的一部分。这种就地修改仅因为被修改的对象比函数调用存活得更久而影响了调用者。名称
    `L` 也没有改变——它仍然引用同一个对象——但由于它引用的值在函数内部被修改了，所以看起来 `L` 在调用后发生了变化。本质上，列表名称 `L` 既作为输入也作为输出传递给了函数。


    下图展示了函数被调用后、其代码运行前存在的名称/对象绑定关系。


    如果这个示例仍然令人困惑，了解自动赋值传入参数的效果等同于运行一系列简单的赋值语句可能会有所帮助。就第一个参数而言，赋值对调用者没有影响：


    ```

    >>> X = 1

    >>> a = X           # 它们共享同一个对象

    >>> a = 2           # 仅重置 ''a''，''X'' 仍然是 1

    >>> print(X)

    1

    ```


    第二个参数的赋值影响调用者的变量，但这是因为它是一个就地对象修改：


    ```

    >>> L = [4, 2]

    >>> b = L           # 它们共享同一个对象

    >>> b[0] = ''spam''   # 就地修改：''L'' 也能看到该变化

    >>> print(L)

    [''spam'', 2]

    ```


    由于参数是通过赋值传递的，函数中的参数名可能与调用者作用域中的变量共享对象。因此，函数中对可变参数的就地修改可能会影响调用者。在这里，函数中的 `a` 和
    `b` 在函数首次被调用时最初引用由变量 `X` 和 `L` 引用的对象。通过变量 `b` 修改列表导致 `L` 在调用返回后看起来不同。如果你回顾一下我们关于共享可变对象的讨论，你会认出正在起作用的现象：就地修改可变对象可能会影响对该对象的其他引用。在这里，其效果是使其中一个参数既像函数的输入又像输出。


    令人惊讶的是，参数在之前的学习过程中已经被纳入了。我相当确定你可能直到现在才对其工作原理感到困惑，因为现在才得到解释。Python 包中有不同的模块用于不同的功能。这更像是你对特定模块理解得越透彻，编码效率就越高。这就是为什么模块将在下一章中处理。翻到下一章，让我们立刻学习模块吧。

