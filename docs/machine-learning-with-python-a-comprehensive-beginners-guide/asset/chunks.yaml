    # 第 1 章 – 认识 Python


    由于本书面向初学者，因此向您介绍如何开始使用 Python 编程语言、它的用处、缺点、为何备受青睐以及更多相关内容至关重要。


    总体而言，Python 被视为一种具有高级编程语言功能的开源语言。它诞生于 20 世纪 80 年代，由 Guido van Rossum 开发，后由 Python
    软件基金会管理。Guido 受到启发的一个因素是 ABC 语言源自一门塑造了他职业生涯的语言。正如本书简介部分所述，Python 是最强大的语言之一，可用于创建游戏、编写
    GUI 以及开发 Web 应用程序。


    就 Python 代码的阅读和编写能力而言，它或多或少就像阅读和编写普通的英语语句；实际上它们并非用机器可读语言编写。Python 程序无需在机器运行前进行处理；它们只会被解释执行。此外，Python
    是一种解释型语言（它拥有一个解释器）。这意味着每次编码后运行程序时，解释器都会遍历代码并将其翻译成机器可读的字节码。


    Python 是一种面向对象的语言，允许用户管理和控制数据结构，因为它拥有庞大的数据结构类型。它也反对创建和运行程序（注：原文 "It has objected
    to create and run programs too" 疑为笔误，译文直译原意）。因为在 Python 中所做的一切都对程序员和用户有利，所有函数、对象、类、数据类型和方法在
    Python 中地位平等。它是一种高级语言。为了充分发挥满足程序员需求的功能，Python 作为一种工具，能高效地开发生活方式、造福整个社会、造福人类的应用程序以及经济。


    毫无疑问，Python 让一切变得更好；它提高了生产力、沟通效率和工作效率。任何语言的基本特征之一是它可能消亡并灭绝，从而被更新的语言取代——多年来 Python
    证明并非如此。只有极具生命力的语言才能经受住时间的考验。Python 本身经受住了时间的考验，并证明自诞生以来在应用的各个方面都很有用。因为 Python
    非常有利可图、简单且高效，所以推荐给所有人，尤其是想以编程为职业的人——没有编程基础的人肯定会觉得这很有趣。


    简要介绍了 Python 之后，您想必已对它有所了解。那么，您可能会问，Python 有什么优势？使用 Python 编程语言的优势怎么强调都不为过，主要包括：


    ## 提高生产力


    尽管 Python 编程使用的代码相对较短、更简单，与 C++ 等其他高级编程语言相比并没有多少代码量。同样，Python 拥有旨在产出更高生产力的完善内置功能。此外，它还拥有标准库，以及使用第三方模块和其他源库的机会。这些独特功能使
    Python 语言编程更具产出和高效。


    ## 易于学习


    尽管 Python 非常有效，但学习起来相当容易。这就是为什么许多人更喜欢并认为 Python 是学习编程的良好入门语言。事实上，许多程序员会反复向初学者推荐它。这是因为
    Python 使用简单的语法以及更短的代码。


    ## 易于阅读


    Python 程序使用精确、清晰且简洁的指令，非常易于阅读。即使没有扎实编程背景的人最终也会发现它非常容易——这是 Python 的优势。由于编辑、运行和调试功能的循环，用
    Python 编写的程序易于维护、调试或增强——这就是可读性。


    ## 广泛支持主流平台


    Python 编程跨平台运行于 Windows、macOS、Linux/UNIX 和其他操作系统，甚至适用于小型设备。此外，它还可以在遥控器、家电中使用的微控制器、玩具、嵌入式设备等设备上运行。


    ## 软件质量


    凭借 Python 的可读性功能，代码的可重用性和可维护性使其成为一种杰出的编程语言，而不仅仅是古老的脚本语言。软件质量基于这样一个事实：代码的统一性超越了传统脚本。因此，即使是没有编程预备知识的人也非常容易阅读。Python
    设置中连贯性功能的增强也使其具有高质量和独特性。能够重复使用相同代码的机制也是 Python 编程的一个独特属性。


    ## 少劳多得


    程序员偏爱 Python 的原因之一是，较少的编码工作就能产出高生产力。除此之外，程序能即时运行，无需像 Java 或 C++ 等其他语言那样经历编译过程。换句话说，一旦程序正常运行，需要输入、调试或维护的东西就更少了。这鼓励程序员更快地推进工作。


    ## 程序耐用性


    耐用性意味着可以在不同平台上为给定程序运行相同的代码。凭借单一代码串，可在其他平台上执行相同操作，尽管可能存在差异，这可能是因为是在不同平台上运行相同代码。编写优秀图形、用户界面等的多样化选项始终存在。同时，来自
    Windows 和 Linux 等其他程序的代码将强烈要求脚本代码，这将导致它们无法在其他平台上使用。


    ## 组件集成与交互


    通过不同的机制，Python 脚本可以轻松与应用程序的其他部分通信。此外，这种集成允许 Python 被用作定制和扩展工具的产品。Python 经历的变革使其代码能够调用
    C 和 C++ 库，也能被 C 和 C++ 程序调用。令人惊叹的是，该代码还可以与 Java 和 .NET 组件集成。它可以通过 COM 和 Silverlight
    等框架进行通信。由于这种集成，代码可以通过串口与设备接口，并通过 XML-RPC、SOAP 和 CORBA 等接口在网络上交互。


    ## 允许使用多样化的内置库


    Python 的特别之处之一，也是人们偏爱它的原因，是因为它自带一个标准字典（注：原文 "standard dictionary" 疑指 "standard
    library"，此处直译原文）。该库支持一系列应用级编程任务，从文本模式匹配到网络脚本编写。此外，Python 既可作为内置库的扩展，也可作为大量第三方应用支持软件的扩展。Python
    的第三方领域提供用于网站构建、数值编程、串口访问、游戏开发等方面的工具。


    ## 易于操作


    使用 Python 获得的乐趣是人们更喜欢它而非其他语言的另一个因素。这是因为艰巨的任务（编码）被揭秘为或多或少像普通家务一样简单。因此，Python 使用内置工具。虽然考虑到其相关性的层面，这种理由可能显得薄弱，但生产力的提高和软件质量的改善也是与之并列的显著理由。


    说了这么多关于 Python 构建方式的内容，问题依然存在：Python 是“脚本语言”吗？还是 Python 与脚本有关？要回答这个问题，请知悉 Python
    是一种通用编程语言，常用于脚本角色。此外，Python 通常被定义为面向对象的脚本语言。这是一种支持 OOP 且整体面向脚本角色的定义。如果非要用一句话概括，可以说
    Python 更广为人知的是一种通用语言。


    要全面了解 Python，请在任意 Python 交互提示符下输入命令 `import this`（您将在本书后续内容中理解这一点）。这将调用 Python
    中隐藏的一个“彩蛋”——一组渗透于语言及其用户社区的设计原则。其中，首字母缩略词 EIBTI 现在是“显式优于隐式”这条规则的时髦行话。

