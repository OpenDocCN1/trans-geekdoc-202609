  trans: "\n# 第 12 章 – Python 中的函数与生成器\n\n简单来说，函数是一种将大量语句打包在一起的工具，使它们可以在程序中被多次运行——一个通过名称调用的捆绑方法。函数同样可以计算结果值，并允许我们指定参数，这些参数作为函数的输入，每次代码运行时可能会有所不同。将一个操作编码为函数，使其成为一种通用的有用工具，我们可以在各种场景中使用它。更本质地说，函数是“复制粘贴式编程”的替代方案——与其拥有活动代码的大量重复副本，我们可以将其提炼为单个函数。这样，我们大幅减少了未来的工作量：如果任务稍后必须更改，我们只需更新函数中的单个副本，而不是分散在整个程序中的许多副本。函数同样是\
    \ Python 提供的最基本的程序结构，用于最大化代码复用，并引导我们进入程序设计的更大概念。正如我们将看到的，函数让我们能够将复杂的系统拆分为可管理的部分。通过将每个部分作为函数执行，我们使其既可复用又更易于编码。\n\
    \n为了让事情更简单，请查看语法和代码解释的编写方式。以下是解释或语句示例：\n\n**调用语句**\n```\nmyfunc('leave', 'fish',\
    \ meat=wing, *rest)\n```\n\n**函数定义**\n```\ndef printer(your_message):\n    print('Heydays\
    \ ' + your_message)\n    return\n\ndef adder(a, b=1, *c):\n    return a + b +\
    \ c[0]\n```\n\n**Global 语句**\n```\nglobal x = 'dark'\ndef changer():\n    global\
    \ x; x = 'light'\n```\n\n**Nonlocal 语句 (3.X)**\n```\ndef external():\n    x =\
    \ 'dark'\n    def changer():\n        nonlocal x; x = 'light'\n```\n\n**Yield\
    \ / 生成器**\n```\ndef squares(x):\n    for i in range(x):\n        yield i ** 2\n\
    ```\n\n**Lambda**\n```\nfuncs = [lambda x: x**2, lambda x: x**3]\n```\n\n您已经看到了所有语句和解释是如何给出的，以便将代码链接在一起。您可能会问，这些解释对初学者来说真的重要吗？这就是为什么我们将在下文中转向函数重要性的原因。\n\
    \n在深入探讨细节之前，我们应该建立一个清晰的图景，了解函数的核心是什么。函数是一种通用的程序组织工具。您可能以前在其他语言中遇到过它们，在那里它们可能被称为子程序或过程。简要介绍一下，函数服务于两个基本的开发角色：促进代码复用和限制重复。与大多数编程语言一样，Python\
    \ 函数是将您可能希望在多个位置和多次使用的逻辑打包在一起的最简单方法。到目前为止，我们编写的所有代码都会立即运行。函数允许我们收集并参数化代码，以便稍后任意多次使用。因为它们使我们能够在一个地方编写操作并在许多地方使用它，Python\
    \ 函数是该语言中最基本的因子化工具：它们允许我们减少项目中的代码冗余，从而减少维护工作量。\n\n有特定的方法将 Python 的函数组合在一起。这些步骤对您至关重要，因为它们是将您的代码链接在一起的方法。\n\
    \n## 编写函数的过程式方法\n\n函数还提供了一种将系统拆分为具有明确角色的部分的工具。例如，要从头开始制作披萨，您会首先混合面团，擀开它，添加配料，烘烤它，等等。如果您正在定制一个制作披萨的机器人，函数将使您能够将整体的“制作披萨”任务隔离为多个部分——每个子任务一个函数，同时进行。在隔离中实现较小的任务比一次性执行整个过程更简单。通常，函数关注的是系统——如何完成一项任务，而不是您将其应用于什么对象。当我们开始使用类创建新对象时，我们将看到为什么这种区别很重要。\n\
    \n在本书的这一部分，我们将探讨在 Python 中编写函数所使用的工具：函数基础、作用域规则和参数传递，以及一些相关概念，例如生成器和函数式工具。由于其重要性在该编码层面开始变得越来越清晰，我们还将重温多态的概念，这在本书前面已经介绍过。正如您将看到的，函数并不意味着太多的新语法，但它们确实引导我们进入一些更大的编程思想。\n\
    \n## 编写函数\n\n尽管没有正式规定，但我们之前已经有效地使用了一些函数。例如，要创建文件对象，我们调用了内置的 `open()` 函数；类似地，我们使用内置的\
    \ `len()` 函数来请求集合对象中的项目数量。在本部分中，我们将探讨如何在 Python 中编写新函数。我们编写的函数表现方式与我们刚才看到的内置函数相同：它们在语句中被调用，被传递值，并返回结果。然而，编写新函数需要使用一些尚未介绍的额外概念。此外，函数在\
    \ Python 中的行为与在 C 等编译语言中截然不同。以下是驱动 Python 函数的基本概念的简短介绍，所有这些我们将在本书的这一部分中探讨：\n\n\
    ### `def` 是可执行代码\n\nPython 函数使用另一种语句 `def` 来编写。与 C 等编译语言中的函数不同，`def` 是一条可执行语句——您的函数直到\
    \ Python 到达并运行 `def` 时才存在。事实上，将 `def` 语句嵌套在 `if` 语句、`while` 循环甚至其他 `def` 中是合法的（甚至有时很有用）。在典型操作中，`def`\
    \ 语句编写在模块文件中，并且通常在模块文件首次被导入时运行以生成函数。\n\n### `def` 创建一个对象并将其赋值给一个名称\n\n当 Python\
    \ 到达并运行一条 `def` 语句时，它会创建一个新的函数对象并将其赋值给函数的名称。与所有赋值一样，函数名称变成了对函数对象的引用。函数名称没有什么神奇之处——正如您将看到的，函数对象可以被赋值给不同的名称、存储在列表中等。函数对象也可以附加任意用户定义的属性来记录信息。\n\
    \n*   **`lambda`** 创建一个对象但将其作为结果返回。函数也可以用 `lambda` 语句创建，这是一种允许我们在 `def` 语句在语法上无法工作的地方内联函数定义的特性。\n\
    *   **`return`** 将结果对象发送回调用者。当函数被调用时，调用者会停止，直到函数完成其工作并将控制权返回给调用者。计算值的函数通过 `return`\
    \ 语句将其发送回调用者；返回的值成为函数调用的结果。不带值的 `return` 只是返回给调用者（并发回 `None`，即默认结果）。\n*   **`yield`**\
    \ 将结果对象发送回调用者，但会记住最后已知的执行点。被称为生成器的函数也可以使用 `yield` 语句发回一个值并挂起其状态，以便稍后恢复，从而随时间产生一系列结果。这是本书后面将涵盖的另一个高级主题。\n\
    *   **`global`** 声明要赋值的模块级变量。默认情况下，函数中赋值的所有名称都局限于该函数，并且仅在函数运行时存在。要在外层模块中赋值一个名称，函数必须在\
    \ `global` 语句中声明它。更一般地说，名称总是在作用域中查找——变量存储的地方——而赋值将名称绑定到作用域。\n*   **`nonlocal`**\
    \ 声明要赋值的外层函数变量。同样，Python 3.X 中新增的 `nonlocal` 语句允许函数赋值一个存在于语法上外层 `def` 语句作用域中的名称。这使得外层函数可以作为保存状态的地方——在函数调用之间记住的数据——而无需使用共享的全局名称。\n\
    *   **参数通过赋值（对象引用）传递。** 在 Python 中，参数通过赋值传递给函数（正如我们所学，这意味着通过对象引用）。正如您将看到的，在 Python\
    \ 的模型中，调用者和函数通过引用共享对象，但不存在名称别名。在函数内部更改参数名称不会影响调用者中对应的名称，但更改传入的可变对象可以改变调用者共享的对象，并作为函数结果。\n\
    *   **除非另有说明，参数按位置传递。** 您在函数调用中传递的值自然地从左到右与函数定义中的参数名称匹配。为了灵活性，函数调用也可以使用 `name=value`\
    \ 关键字语法按名称传递参数，并使用 `*pargs` 和 `**kargs` 语法解包并传递任意多个参数。函数定义使用类似的两种结构来指定参数默认值和收集接收到的任意多个参数。\n\
    *   **参数、返回值和变量无需声明。** 与 Python 中的所有事物一样，函数没有类型约束。事实上，函数的任何方面都不需要提前声明：您可以传入任何类型的参数，返回任何类型的对象等。作为一个结果，单个函数通常可以应用于各种对象类型——任何拥有兼容接口（方法和表达式）的对象都可以，无论其具体类型如何。\n\
    \n如果前面的部分内容没有完全被吸收，请不要担心——我们将在本书的这一部分通过真实代码来探讨这些概念。让我们开始发展其中的一些想法并看几个示例。\n\n##\
    \ `def` 语句\n\n`def` 语句创建一个函数对象并将其赋值给一个名称。其通用格式如下：\n\n```\ndef name(arg1, arg2,\
    \ ... argN):\n    statements\n```\n\n与所有复合 Python 语句一样，`def` 由一个标题行后跟一个语句块组成，通常缩进（或冒号后的简单语句）。语句块成为函数的主体——即每次稍后调用函数时\
    \ Python 执行的代码。`def` 标题行指定一个函数名，该名称被赋值为函数对象，以及一个包含零个或多个参数（有时称为形参）的列表。\n\n总之，我们已经成功涵盖了\
    \ Python 中函数使用的原因和方法。这将增强程序执行过程的正确管理。为了给您打下良好的基础，下一章将介绍 Python 语言中的参数。这通常是在编码时如何定义词汇。它以一种有趣的方式工作，将许多具有相同语法的程序拉在一起。让我们一起揭开它的面纱。\n"
