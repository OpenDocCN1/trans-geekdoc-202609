    # Python 运算符指南


    ## 算术运算符


    在深入探讨运算符之前，您需要理解 Python 通过其内置计算引擎处理数学表达式。您可以轻松编写脚本来自动化任务，例如计算税费、小费、折扣或房租。以下是运算符、其功能和符号（注意：因为它们是数学运算，其符号与数学中的一致）：


    | 运算符 | 功能 | 符号 |

    | :--- | :--- | :--- |

    | **加法** | 将左操作数和右操作数的值相加 | `+` |

    | **减法** | 从左操作数的值中减去右操作数的值 | `-` |

    | **乘法** | 将左操作数和右操作数的值相乘 | `*` |

    | **除法** | 用右操作数除以左操作数的值 | `/` |

    | **取模** | 返回左操作数除以右操作数/分母的余数 | `%` |

    | **幂运算** | 执行指数计算 | `**` |

    | **整除** | 执行向下取整除法 | `//` |


    > **注意**：核心运算符是减法、乘法、除法和加法。它们通过配套表达式输入，并按其清理后的十进制数的相反顺序排列。


    ### 示例


    **减法**：

    ```

    >>> 50 - 5

    45

    ```


    **除法**：

    ```

    >>> 25 / 5

    5.0

    ```


    使用除法时，请注意取模运算符（`%`）给出执行除法的余数：

    ```

    >>> 27 % 5

    2

    ```


    分母将在清除小数后返回余数：

    ```

    >>> 23 / 8

    2.875

    ```


    **指数运算**：通过将基数提升到 `**` 运算符后数字指定的幂来调用：

    ```

    >>> 4 ** 3

    64

    ```


    **加法**：

    ```

    >>> 6 + 7

    13

    ```


    **乘法**：

    ```

    >>> 5 * 7

    35

    ```


    这些运算应按其在编码策略中使用的方式给出。为此，您应该了解如何安排它们的使用。我们将使用一个服装预算策略。请查看下面的变量及其成本：


    - 材料成本：`$55.55`

    - 设计费率：`5.5%`

    - 小费：餐费 + 税费的 `10%`（注意：您的小费基于表面成本和额外营业税，因此您需要获取餐饮信息和营业税的总和）。


    要使用它们，请使设计费率和小费可用。为此，您应该给出表面总成本的比例：

    ```python

    material = 55.55

    ```


    使用 `100` 作为除数，为这两个变量分配费率的小数值：

    ```python

    design_charge = 5.5 / 100

    tip = 10 / 100

    ```


    现在，您应该用供应商的成本抵消您的总额。一种方法是创建一个新变量来存储表面和费用的总成本。另一种方法是重新赋值 `dinner` 变量，使其存储这两个值：

    ```python

    cloth1 = cloth2 + cloth3 * charge

    ```


    既然您已重新赋值 `dinner` 以处理活动成本和评估，您就可以计算小费了。这一次，您可以设置另一个变量来存储小费、餐饮信息和成本的值。您可以使用变量 `total`
    来保存所有值：

    ```python

    firm = supper * tip

    ```


    这是计算压倒性账单总额的代码：

    ```python

    cloth1 = 55.55

    design_charge = 5.5 / 100

    tip = 10 / 100

    cloth2 = cloth3 + cloth1 * charge

    designates = cloth3 + cloth2 * tip

    ```


    如果您在 IDLE 中使用文档文章管理器，可以将喜欢的记录保存在文件名中，Python 会自动添加 `.py` 扩展名。正如您所见，文档文章管理器将不断提示您在处理代码前保存报告。就像命名其他数据记录和类型一样，您应该使用描述性的文件名。在这种情况下，像
    `Bill Calculator` 这样的文件名应该可行。


    要获取总计，请转到 Python Shell 并输入：

    ```

    >>> total

    44.58550000000001

