  fmt: "\n# Chapter 9 – Loops in Python\n\n## While Loops\n\nPython's `while` statement\
    \ is the broadest iteration construct in the language. In straightforward terms,\
    \ it repeatedly executes a block of (normally indented) statements as long as\
    \ a test at the top keeps evaluating to a true value. It is known as a \"loop\"\
    \ because control keeps looping back to the start of the statement until the test\
    \ becomes false. Once the test becomes false, control passes to the statement\
    \ that follows the `while` block. The net effect is that the loop's body is executed\
    \ repeatedly while the test at the top is true. If the test is false to begin\
    \ with, the body never runs and the `while` statement is skipped.\n\n### General\
    \ Format\n\nIn its most complex form, the `while` statement consists of a header\
    \ line with a test expression, a body of one or more normally indented statements,\
    \ and an optional `else` part that is executed if control leaves the loop without\
    \ a `break` statement being encountered. Python keeps evaluating the test at the\
    \ top and executing the statements nested in the body until the test returns a\
    \ false value:\n\n```\nwhile test:          # Loop test\n    statements      \
    \ # Loop body\nelse:                # Optional else\n    statements       # Run\
    \ if didn't exit loop with a break\n```\n\n### Examples\n\nTo illustrate, let's\
    \ look at a few basic `while` loops in action.\n\nThe first, which consists of\
    \ a `print` statement nested in a `while` loop, just prints a message forever.\
    \ Recall that `True` is just a custom version of the integer `1` and always stands\
    \ for a Boolean true value; since the test is always true, Python keeps executing\
    \ the body forever, or until you stop its execution. This kind of behavior is\
    \ usually called an **infinite loop**—it's not really eternal, but you may need\
    \ a `Ctrl-C` key combination to forcefully terminate one:\n\n```\n>>> while True:\n\
    ...     print('Type Ctrl-C to stop me!')\n```\n\nThe next example keeps slicing\
    \ off the first character of a string until the string is empty and hence false.\
    \ It's common to test an object directly like this instead of using the more verbose\
    \ equivalent (`while x != '':`). Later in this chapter, we'll see other ways to\
    \ step through the items in a string more directly with a `for` loop.\n\n```\n\
    >>> x = 'spam'\n>>> while x:              # While x isn't empty\n...     print(x,\
    \ end=' ')\n...\nspam pam am m\n```\n\nNote the `end=' '` keyword argument used\
    \ here to put all outputs on a single line separated by a space. This may leave\
    \ your input prompt in an odd state at the end of your output; type `Enter` to\
    \ reset. Python 2.X readers: likewise remember to use a trailing comma instead\
    \ of an `end` in the prints this way.\n\nThe following code counts from the value\
    \ of `a` up to, but not including, `b`. We'll also see an easier way to do this\
    \ with a Python `for` loop and the built-in `range` function later:\n\n```\n>>>\
    \ a=0; b=10\n>>> while a < b:          # One way to code counter loops\n...  \
    \   print(a)\n...     a += 1\n```\n\nFinally, note that Python doesn't have what\
    \ some languages call a \"do until\" loop statement. However, we can simulate\
    \ one with a test and `break` at the bottom of the loop body, so the loop's body\
    \ is always run at least once:\n\n```\nwhile True:\n    ...loop body...\n    if\
    \ exitTest(): break\n```\n\nTo fully understand how this structure works, we need\
    \ to move on to the next section and learn about the `break` statement.\n\n##\
    \ break, continue, pass, and the Loop else\n\nNow that we've seen a few Python\
    \ loops in action, it's time to investigate two simple statements that have a\
    \ purpose only when nested inside loops—the `break` and `continue` statements.\
    \ While we're looking at oddities, we will also study the loop `else` clause here\
    \ because it is intertwined with `break`, and Python's empty placeholder statement,\
    \ `pass` (which isn't tied to loops per se, but falls into the general category\
    \ of simple one-word statements).\n\nIn Python:\n\n*   `break`: Jumps out of the\
    \ closest enclosing loop (past the entire loop statement).\n*   `continue`: Jumps\
    \ to the top of the closest enclosing loop (to the loop's header line).\n*   `pass`:\
    \ Does nothing at all: it's an empty statement placeholder.\n*   Loop `else` block:\
    \ Runs if and only if the loop is exited normally (i.e., without hitting a `break`).\n\
    \n### General Loop Format\n\nFactoring in `break` and `continue` statements, the\
    \ general format of the `while` loop looks like this:\n\n```\nwhile test:\n  \
    \  statements\n    if test: break        # Exit loop now, skip else if present\n\
    \    if test: continue     # Go to top of loop now, to test\nelse:\n    statements\
    \            # Run if we didn't hit a 'break'\n```\n\n`break` and `continue` statements\
    \ can appear anywhere inside the `while` (or `for`) loop's body, but they are\
    \ usually coded further nested in an `if` test to take action in response to some\
    \ condition. Let's turn to a few simple examples to see how these statements come\
    \ together in practice.\n\n### Pass\n\nFirst things first: the `pass` statement\
    \ is a no-operation placeholder used when the syntax requires a statement, but\
    \ you have nothing useful to say. It is often used to code an empty body for a\
    \ compound statement. For instance, if you want to code an infinite loop that\
    \ does nothing each time through, do it with a `pass`:\n\n```\nwhile True: pass!\n\
    ```\n\nSince the body is just an empty statement, Python gets stuck in this loop.\
    \ `pass` is roughly to statements as `None` is to objects—an explicit nothing.\
    \ Notice that here the `while` loop's body is on the same line as the header,\
    \ after the colon; as with `if` statements, this only works if the body isn't\
    \ a compound statement. This example does nothing forever. It probably isn't the\
    \ most useful Python program ever written (unless you want to heat up your laptop\
    \ on a cold winter's day!); to be honest, though, I couldn't think of a better\
    \ `pass` example this early in the book. We'll see other places where `pass` makes\
    \ sense later—for instance, to ignore exceptions caught by `try` statements, and\
    \ to define empty class objects with attributes that act like \"structs\" and\
    \ \"records\" in other languages. A `pass` is also sometimes coded to mean \"\
    to be filled in later,\" to stub out the bodies of functions temporarily:\n\n\
    ```\ndef func1(): pass  # Add real code here later\ndef func2(): pass\n```\n\n\
    We can't leave the body empty without getting a syntax error, so we say `pass`.\n\
    \n**Version skew note:** Python 3.X (but not 2.X) allows ellipses coded as `...`\
    \ (literally, three consecutive dots) to appear wherever a statement can. Since\
    \ ellipses do nothing by themselves, this can serve as an alternative to the `pass`\
    \ statement, especially for code to be filled in later—a kind of Python \"TBD\"\
    :\n\n```\ndef func1(): ...  # Alternative to pass\ndef func2(): ...\nfunc1() \
    \          # Does nothing when called\n```\n\nEllipses can also appear on the\
    \ same line as a statement header and might be used to initialize variable names\
    \ if no specific type is required:\n\n```\ndef func1(): ...  # Works on the same\
    \ line too\ndef func2(): ...\n>>> X = ...       # Alternative to None\n>>> X\n\
    Ellipsis\n```\n\nThis feature is new in Python 3.X—and goes well beyond the original\
    \ purpose of `...` in slicing extensions—so it remains to be seen if it becomes\
    \ widespread enough to challenge `pass` and `None` in these roles.\n\n### Continue\n\
    \nThe `continue` statement causes an immediate jump to the top of a loop. It sometimes\
    \ lets you avoid statement nesting. The next example uses `continue` to skip odd\
    \ numbers. This code prints every even number less than 10 and greater than or\
    \ equal to 0. Remember, `0` means false and `%` is the remainder of division (modulus)\
    \ operator, so this loop counts down to 0, skipping numbers that aren't multiples\
    \ of 2—it prints `8 6 4 2 0`:\n\n```\nx = 10\nwhile x:\n    x = x - 1\n    if\
    \ x % 2 != 0: continue  # Odd? - skip print\n    print(x, end=' ')\n```\n\nSince\
    \ `continue` jumps to the top of the loop next, you don't have to nest the `print`\
    \ statement here inside an `if` test; the `print` is only reached if the `continue`\
    \ isn't run. If this sounds like a \"goto\" in other languages, it should. Python\
    \ has no \"goto\" statement, but since `continue` lets you jump around in a program,\
    \ many of the warnings about readability and maintainability you may have heard\
    \ about \"goto\" apply. `continue` should probably be used sparingly, especially\
    \ when you're first starting with Python. For instance, the last example might\
    \ be clearer if the `print` was nested under the `if`:\n\n```\nx = 10\nwhile x:\n\
    \    x = x - 1\n    if x % 2 == 0:        # Even? - print\n        print(x, end='\
    \ ')\n```\n\n### Break\n\nThe `break` statement causes an immediate exit from\
    \ a loop. Since the code that follows it inside the loop isn't executed if the\
    \ `break` is reached, you can also sometimes avoid nesting by using a `break`.\
    \ For example, here is a simple interactive loop that inputs data with `input`\
    \ and exits when the user enters \"stop\" for the name prompt:\n\n```\n>>> while\
    \ True:\n...     name = input('Enter name:')\n...     if name == 'stop': break\n\
    ...     age = input('Enter age: ')\n...     print('Hello', name, '=>', int(age)\
    \ ** 2)\n...\nEnter name: bob\nEnter age: 40\nHello bob => 1600\nEnter name: sue\n\
    Enter age: 30\nHello sue => 900\nEnter name: stop\n```\n\nNotice how this code\
    \ converts the age input to an integer with `int` before raising it to the second\
    \ power; as you'll recall, this is necessary because `input` returns user input\
    \ as a string. You'll notice that `input` also raises an exception at end-of-file\
    \ (e.g., if the user types `Ctrl-Z` on Windows or `Ctrl-D` on Unix); if this matters,\
    \ wrap input in `try` statements.\n\n### Loop else\n\nWhen combined with the loop\
    \ `else` clause, the `break` statement can often eliminate the need for the search\
    \ status flags used in other languages. For instance, the following piece of code\
    \ determines whether a positive integer `y` is prime by searching for factors\
    \ greater than 1:\n\n```\nx = y // 2\nwhile x > 1:\n    if y % x == 0:       \
    \ # Remainder\n        print(y, 'has factor', x)\n        break             #\
    \ Skip else\n    x -= 1\nelse:                     # Normal exit\n    print(y,\
    \ 'is prime')\n```\n\nInstead of setting a flag to be tested when the loop is\
    \ exited, it inserts a `break` where a factor is found. This way, the loop `else`\
    \ clause can assume it will be executed only if no factor is found; if you don't\
    \ hit the `break`, the number is prime. Trace through this code to see how this\
    \ works.\n\nThe loop `else` clause is also run if the body of the loop is never\
    \ executed, as you don't run a `break` in that case either; in a `while` loop,\
    \ this happens if the test in the header is false to begin with. Thus, in the\
    \ former example you still get the \"is prime\" message if `x` is initially less\
    \ than or equal to 1 (for example, if `y` is 2).\n\nThis example determines primes,\
    \ but only informally so. Numbers less than 2 are not considered prime by the\
    \ strict mathematical definition. To be perfectly precise, this code also fails\
    \ for negative numbers and succeeds for floating-point numbers with no decimal\
    \ digits. Also note that its code must use `//` rather than `/` in Python 3.X\
    \ due to the migration of `/` to \"true division\" (we need the integer division\
    \ to truncate remainders, not keep them!). If you want to experiment with this\
    \ code, be sure to see the exercise which wraps it in a function for reuse.\n\n\
    In conclusion, we have successfully discussed loops in Python. This has made your\
    \ work easier as a programmer. The next thing to discuss is functions in Python\
    \ programming. The next chapter is more for you as a programmer than the programming\
    \ itself. Let us caress the knowledge below.\n"
  trans: "\n# 第 9 章 – Python 中的循环\n\n## While 循环\n\nPython 的 `while` 语句是该语言中最通用的迭代结构。简单来说，只要顶部的测试表达式持续计算为真值，它就会反复执行一块（通常缩进的）语句。之所以称为“循环”，是因为控制流不断回到语句的开头，直到测试变为假。一旦测试变为假，控制流就会传递给\
    \ `while` 代码块后面的语句。最终效果是：只要顶部的测试为真，循环体就会反复执行。如果测试一开始就是假，循环体永远不会运行，`while` 语句会被跳过。\n\
    \n### 通用格式\n\n在其最复杂的形式中，`while` 语句由一个包含测试表达式的头部行、一个包含一条或多条通常缩进语句的循环体，以及一个可选的 `else`\
    \ 部分组成，该部分在控制流离开循环且未遇到 `break` 语句时执行。Python 会持续计算顶部的测试表达式，并执行嵌套在循环体中的语句，直到测试返回假值：\n\
    \n```\nwhile test:          # 循环测试\n    statements       # 循环体\nelse:        \
    \        # 可选的 else\n    statements       # 如果未通过 break 退出循环则运行\n```\n\n### 示例\n\
    \n为了演示，让我们看几个基本的 `while` 循环实际运行的例子。\n\n第一个例子由一个嵌套在 `while` 循环中的 `print` 语句组成，它会永远打印一条消息。回想一下，`True`\
    \ 只是整数 `1` 的一个定制版本，始终代表布尔真值；由于测试永远为真，Python 会一直执行循环体，直到你强制停止它的执行。这种行为通常被称为**无限循环**——它并非真正永恒，但你可能需要按\
    \ `Ctrl-C` 组合键来强制终止它：\n\n```\n>>> while True:\n...     print('Type Ctrl-C to stop\
    \ me!')\n```\n\n下一个示例不断切除字符串的第一个字符，直到字符串为空（因此为假）。直接这样测试对象很常见，而不是使用更冗长的等价形式（`while\
    \ x != '':`）。本章稍后，我们将看到其他使用 `for` 循环更直接地遍历字符串项目的方法。\n\n```\n>>> x = 'spam'\n>>>\
    \ while x:              # 当 x 不为空时\n...     print(x, end=' ')\n...\nspam pam am\
    \ m\n```\n\n请注意此处使用的 `end=' '` 关键字参数，它将所有输出放在一行上并用空格分隔。这可能会让你的输入提示符在输出结束时处于奇怪的状态；按\
    \ `Enter` 键可重置。Python 2.X 读者：同样请记住，要在这些打印语句中使用尾随逗号代替 `end`。\n\n以下代码从 `a` 的值计数到\
    \ `b`（不包括 `b`）。稍后我们将看到使用 Python `for` 循环和内置 `range` 函数来实现这一点的更简单方法：\n\n```\n>>>\
    \ a=0; b=10\n>>> while a < b:          # 编写计数器循环的一种方式\n...     print(a)\n... \
    \    a += 1\n```\n\n最后，请注意 Python 没有某些语言所谓的“do until”循环语句。不过，我们可以通过在循环体底部放置测试和\
    \ `break` 来模拟一个，这样循环体至少会运行一次：\n\n```\nwhile True:\n    ...循环体...\n    if exitTest():\
    \ break\n```\n\n要完全理解此结构的工作原理，我们需要进入下一节并了解 `break` 语句。\n\n## break、continue、pass\
    \ 和循环 else\n\n现在我们已经看到了一些 Python 循环的实际运行，是时候研究两个仅在嵌套在循环内时才有用途的简单语句了——`break` 和\
    \ `continue` 语句。在研究这些特性时，我们也将在这里学习循环 `else` 子句，因为它与 `break` 紧密相关，以及 Python 的空占位符语句\
    \ `pass`（它本身不专门与循环相关，但属于简单单词语句的一般范畴）。\n\n在 Python 中：\n\n*   `break`：跳出最近的外层循环（越过整个循环语句）。\n\
    *   `continue`：跳到最近的外层循环的顶部（即循环的头部行）。\n*   `pass`：什么都不做：它是一个空语句占位符。\n*   循环 `else`\
    \ 代码块：仅当循环正常退出时运行（即未遇到 `break`）。\n\n### 通用循环格式\n\n考虑到 `break` 和 `continue` 语句，`while`\
    \ 循环的通用格式如下所示：\n\n```\nwhile test:\n    statements\n    if test: break       \
    \ # 立即退出循环，跳过 else（如果存在）\n    if test: continue     # 立即跳到循环顶部，进行测试\nelse:\n \
    \   statements            # 如果我们没有遇到 'break' 则运行\n```\n\n`break` 和 `continue`\
    \ 语句可以出现在 `while`（或 `for`）循环体的任何位置，但通常嵌套在 `if` 测试中进一步编写，以响应某些条件采取行动。让我们看几个简单的例子，了解这些语句在实践中是如何结合在一起的。\n\
    \n### Pass\n\n首先：`pass` 语句是一个无操作占位符，当语法需要一条语句但你没有什么有用的可说时使用。它常用于为复合语句编写空主体。例如，如果你想编写一个每次循环什么都不做的无限循环，可以用\
    \ `pass` 来做：\n\n```\nwhile True: pass!\n```\n\n由于主体只是一条空语句，Python 会卡在这个循环中。`pass`\
    \ 对语句的作用大致相当于 `None` 对对象的作用——一个显式的“无”。请注意，这里 `while` 循环的主体与头部在同一行，位于冒号之后；与 `if`\
    \ 语句一样，这仅在主体不是复合语句时有效。这个示例什么都不做，永远持续下去。这可能不是有史以来最有用的 Python 程序（除非你想在寒冷的冬天给笔记本电脑加热！）；说实话，在本书的这个早期阶段，我想不出更好的\
    \ `pass` 例子。稍后我们将看到 `pass` 在其他地方发挥作用——例如，忽略 `try` 语句捕获的异常，以及定义带有属性的空类对象，这些属性的作用类似于其他语言中的“结构体”和“记录”。`pass`\
    \ 有时也被编写为“稍后填入”，以临时存根函数体：\n\n```\ndef func1(): pass  # 稍后在此添加真实代码\ndef func2():\
    \ pass\n```\n\n我们不能留空主体，否则会得到语法错误，所以我们写 `pass`。\n\n**版本差异说明：** Python 3.X（但不是\
    \ 2.X）允许编码为 `...`（字面上是三个连续的点）的省略号出现在语句可以出现的任何地方。由于省略号本身不执行任何操作，这可以作为 `pass` 语句的替代品，特别是对于稍后要填入的代码——一种\
    \ Python 的“TBD”（待定）：\n\n```\ndef func1(): ...  # pass 的替代方案\ndef func2(): ...\n\
    func1()           # 调用时什么都不做\n```\n\n省略号也可以出现在语句头部的同一行，如果不需要特定类型，可能用于初始化变量名：\n\
    \n```\ndef func1(): ...  # 在同一行也有效\ndef func2(): ...\n>>> X = ...       # None\
    \ 的替代方案\n>>> X\nEllipsis\n```\n\n此功能是 Python 3.X 中新增的——远远超出了 `...` 在切片扩展中的原始用途——因此仍有待观察它是否会普及到足以在这些角色中挑战\
    \ `pass` 和 `None`。\n\n### Continue\n\n`continue` 语句导致立即跳转到循环顶部。它有时可以让你避免语句嵌套。下一个示例使用\
    \ `continue` 跳过奇数。这段代码打印每一个小于 10 且大于或等于 0 的偶数。记住，`0` 代表假，`%` 是取模（求余）运算符，所以这个循环向下计数到\
    \ 0，跳过不是 2 的倍数的数字——它打印 `8 6 4 2 0`：\n\n```\nx = 10\nwhile x:\n    x = x - 1\n\
    \    if x % 2 != 0: continue  # 奇数？- 跳过打印\n    print(x, end=' ')\n```\n\n由于 `continue`\
    \ 接下来跳到循环顶部，你不必将 `print` 语句嵌套在 `if` 测试中；只有在 `continue` 未运行时才会到达 `print`。如果这听起来像其他语言中的“goto”，那应该是。Python\
    \ 没有“goto”语句，但既然 `continue` 让你能在程序中跳来跳去，你可能听过的许多关于“goto”的可读性和可维护性警告也适用于此。`continue`\
    \ 可能应该谨慎使用，尤其是当你刚开始学习 Python 时。例如，如果将 `print` 嵌套在 `if` 下，最后一个示例可能会更清晰：\n\n```\n\
    x = 10\nwhile x:\n    x = x - 1\n    if x % 2 == 0:        # 偶数？- 打印\n       \
    \ print(x, end=' ')\n```\n\n### Break\n\n`break` 语句导致立即退出循环。由于如果到达 `break`，循环内后面的代码不会执行，你有时也可以通过使用\
    \ `break` 来避免嵌套。例如，这里有一个简单的交互式循环，它使用 `input` 输入数据，并在用户在姓名提示符处输入 \"stop\" 时退出：\n\
    \n```\n>>> while True:\n...     name = input('Enter name:')\n...     if name ==\
    \ 'stop': break\n...     age = input('Enter age: ')\n...     print('Hello', name,\
    \ '=>', int(age) ** 2)\n...\nEnter name: bob\nEnter age: 40\nHello bob => 1600\n\
    Enter name: sue\nEnter age: 30\nHello sue => 900\nEnter name: stop\n```\n\n请注意，这段代码在将年龄输入平方之前，使用\
    \ `int` 将其转换为整数；正如你所记得的，这是必要的，因为 `input` 将用户输入作为字符串返回。你会注意到 `input` 在文件结束时也会引发异常（例如，如果用户在\
    \ Windows 上输入 `Ctrl-Z` 或在 Unix 上输入 `Ctrl-D`）；如果这很重要，请用 `try` 语句包装输入。\n\n### 循环\
    \ Else\n\n当与循环 `else` 子句结合使用时，`break` 语句通常可以消除其他语言中使用的搜索状态标志的需求。例如，以下代码通过搜索大于\
    \ 1 的因子来确定正整数 `y` 是否为质数：\n\n```\nx = y // 2\nwhile x > 1:\n    if y % x == 0:\
