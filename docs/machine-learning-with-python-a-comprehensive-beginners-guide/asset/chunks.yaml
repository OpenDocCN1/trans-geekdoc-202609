  trans: "\n# 第 8 章 – Python 条件语句\n\n在本章中，你将了解可用于在编码时进行修改的条件语句。由于它们的重要性无法从理论上看出，只能在使用中体会。条件语句是编程语言中的基础，它们用于根据条件判断为真或假来执行活动或计算。\n\
    \n## if-then-else 语句\n\n关于 if-then-else 语句，解释或限制性语句是编程语言的基本特征，它们使程序对用户更有帮助。Python\
    \ 中的 if else 语句具有以下基本结构：\n\n```\nIf condition1:\n    block1_statement\nelif condition2:\n\
    \    block2_statement\nelse:\n    block3_statement\n```\n\n该结构将按如下方式评估/执行：\n\n\
    - 如果 `condition1` 为 True，Python 将执行 `block1_statement`。\n- 如果 `condition1` 为 False，将评估\
    \ `condition2`。\n- 如果 `condition2` 评估为 True，将执行 `block2_statement`。\n- 如果 `condition2`\
    \ 结果为 False，Python 将执行 `block3_statement`。\n\n为了演示，这里有一个在函数 `the_hope` 内部构建的 if\
    \ else 示例：\n\n```\ndef the_hope(answer):\n    if answer > 5:\n        print(\"\
    The best world.\")\n    elif answer <= 5 and answer > 1:\n        print(\"This\
    \ is Press club!\")\n    else:\n        print(\"You are the best on earth.\")\n\
    \nprint(the_hope(6))\nprint(the_hope(3))\nprint(the_hope(1))\nprint(the_hope(0))\n\
    ```\n\n你将在 Python Shell 中得到如下输出：\n\n```\nThe best world.\nNone\nThis is Press\
    \ club!\nNone\nYou are the best on earth.\nNone\nYou are the best on earth.\n\
    None\n```\n\n请注意，条件语句可能分支出多个 `elif` 分支，但末尾只能有一个 `else` 分支。使用相似的代码块，可以插入另一个 `elif`\
    \ 语句以容纳新闻俱乐部的特殊成员：两岁儿童。\n\n```\ndef the_hope(answer):\n    if answer > 5:\n  \
    \      print(\"The best world.\")\n    elif answer <= 5 and answer > 2:\n    \
    \    print(\"This is Press club!\")\n    elif answer == 2:\n        print(\"This\
    \ is Press club!\")\n    else:\n        print(\"You are the best on earth.\")\n\
    \nprint(the_hope(6))\nprint(the_hope(3))\nprint(the_hope(1))\nprint(the_hope(0))\n\
    print(the_hope(2))\n```\n\n```\nThe best world.\nNone\nThis is Press club!\nNone\n\
    You are the best on earth.\nNone\nYou are the best on earth.\nNone\nThis is Press\
    \ club!\nNone\n```\n\n## IF 语句\n\n简单来说，Python if 语句选择要执行的活动。连同其外观搭档 `else`，它是\
    \ Python 中主要的选择工具，代表了 Python 程序逻辑的重要部分。这也是我们的第一个复合语句。像所有复合 Python 语句一样，if 声明可能包含其他语句，包括其他的不确定性（指嵌套\
    \ if）。事实上，Python 允许你在程序中连续连接声明（以便它们依次执行），并以主观嵌套设计（以便它们仅在特定条件下执行，例如选择和循环）。\n\n\
    ### IF 语句的通用格式\n\nPython if 声明是大多数过程式语言中 if 语言的典型代表。它表现为一个 if 测试，后跟至少一个可选的 `elif`\
    \ (\"else if\") 测试和一个最终可选的 else 块。测试和 else 部分各自都有一个相关的嵌套声明块，缩进在标题行之下。每当 if 声明运行时，Python\
    \ 执行与第一个评估为真的测试相关的代码块，如果所有测试都为假，则执行 else 块。if 解释的一般形式如下：\n\n```\nConditionaltest1:\
    \          # if 测试\n    statements1            # 关联块\nelif test2:            \
    \    # 可选的 elifs\n    statements2\nelse:                      # 可选的 else\n   \
    \ statements3\n```\n\n### 基本示例\n\n为了说明，我们应该看几个 if 声明工作的简单实例。除最初的 if 测试及其相关语句外，所有部分均为可选。因此，在最简单的情况下，其他部分被省略，请看：\n\
    \n```\n>>> if 1:\n...     print('true')\n...\ntrue\n```\n\n注意当你在基本交互界面中直观地编写时，提示符如何变为\
    \ `...` 以表示续行；在 IDLE 中，你只会简单地换行到缩进行（按退格键可回退）。一个空行（按两次 Enter 键可得）结束并运行整个声明。请记住\
    \ `1` 是布尔真值（稍后我们将看到，单词 `True` 是其等价物），所以该语句的测试持续成功。要处理假结果，编写 else 将是：\n\n```\n\
    >>> if not 1:\n...     print('true')\n... else:\n...     print('false')\n...\n\
    false\n```\n\n### 多路分支\n\n你必须理解一种将 if 和条件语句结合执行的方法。现在这里有一个更复杂的 if 声明示例，包含其所有可选部分：\n\
    \n```\n>>> x = 'animal kingdom'\n>>> if x == 'jack':\n...     print(\"look very\
    \ well\")\n... elif x == 'lion':\n...     print(\"How are they?\")\n... else:\n\
    ...     print('Run for your dear life!')\n...\nRun for your dear life!\n```\n\n\
    这个多行声明从 if 行延伸到 else 下嵌套的块。当它运行时，Python 执行第一个为真的测试下嵌套的声明，如果所有测试都为假，则执行 else 部分（在本例中，它们都是假）。实际上，`elif`\
    \ 和 `else` 部分都可以省略，并且每个部分中可以嵌套多条语句。请注意，单词 `if`、`elif` 和 `else` 通过垂直对齐、具有相同的缩进而相关联。如果你用过\
    \ C 或 Pascal 等语言，你可能有兴趣知道 Python 中没有 switch 或 case 语句根据变量的值选择活动。相反，你通常将多路分支编写为一系列\
    \ if/elif 测试，如前面的示例所示，有时通过字典或查找列表。由于字典和列表可以在运行时动态构建，它们有时比脚本中硬编码的 if 逻辑更灵活：\n\n\
    ```\n>>> decision = 'swing'\n>>> print({'leave': 5.75,      # 基于字典的 'switch'\n\
    ...        'swing': 2.00,      # 使用 has_key 或 get 获取默认值\n...        'fish': 1.99,\n\
    ...        'goat': 1.20}[choice])\n2.00\n```\n\n尽管第一次看到这可能需要几分钟才能领会，但这个字典就是一个多路分支——根据键\
    \ `decision` 索引到一组值中的一个，很像 C 语言中的 switch。一个功能几乎相等但更冗长的 Python if 声明可能如下所示：\n\n\
    ```\n>>> if decision == 'leave':      # 等效的 if 声明\n...     print(5.75)\n... elif\
    \ decision == 'swing':\n...     print(2.00)\n... elif decision == 'fish':\n...\
    \     print(1.20)\n... elif decision == 'goat':\n...     print(3.00)\n... else:\n\
    ...     print('unpleasant decision')\n...\n1.99\n```\n\n尽管它可能更清晰，但这种 if 的潜在缺点是，除非将其作为字符串构建并使用像\
    \ `exec` 这样的工具运行，否则你无法像字典那样轻松地在运行时构建它。在日益独特的项目中，数据结构提供了额外的灵活性。\n\n### 处理 Switch\
    \ 默认值\n\n为了处理 switch 默认值，请注意此处 if 上的 else 子句，用于在没有键匹配时处理默认情况。字典默认值可以在语句中编码，使用\
    \ get 方法调用，或使用引入的 try 语句捕获异常。所有类似的过程都可以用于在基于字典的多路分支中编码默认活动。作为对此用例的回顾，这里是 get 方案带默认值的工作示例：\n\
    \n```\n>>> branch = {'leave': 5.75,\n...           'swing': 1.99,\n...       \
    \    'eggs': 0.99}\n>>> print(branch.get('leave', 'Unforeseen decision'))\n5.75\n\
    >>> print(branch.get('goat', 'Unforeseen decision'))\nUnforeseen decision\n```\n\
    \nif 声明中的成员资格测试可以具有相同的默认效果：\n\n```\n>>> decision = 'goat'\n>>> if decision in\
    \ branch:\n...     print(branch[decision])\n... else:\n...     print('Bad decision')\n\
    ...\nUnforeseen decision\n```\n\n此外，try 语句是通过捕获并处理它们原本会引发的异常来处理默认值的通用方法：\n\n```\n\
    >>> try:\n...     print(branch[decision])\n... except KeyError:\n...     print('Bad\
    \ decision')\n...\nBad decision\n```\n\n### 处理更大的活动\n\n字典适合将值与键关联，但对于你可以在与 if\
    \ 语句关联的声明块中编码的更复杂活动呢？你会发现字典也可以包含函数来表示更复杂的分支活动并执行通用跳转表。此类函数作为字典值出现，它们可以编码为函数名或内联\
    \ lambda，并通过添加括号来触发其活动。这里有一个独特的采样器，但请继续关注，等我们熟悉了函数定义之后：\n\n```\ndef work():\n\
    \    ...\n\ndef default():\n    ...\n\nbranch = {\n    'leave': lambda: ..., \
    \     # 可调用函数对象表\n    'swing': work,\n    'fish': lambda: ...\n}\nbranch.get(choice,\
    \ default)()\n```\n\n尽管基于字典的多路分支在处理动态数据的项目中很有用，但大多数软件工程师可能会发现编写 if 语句是执行多路分支最清晰的方法。作为编码中的一条经验法则，如果拿不准，就倾向于简单性和清晰度；这是“Python\
    \ 风格”的方式。\n\n哇！越来越有趣了，希望你跟着软件实践操作了；不要只读不练，自己执行代码。本章大致探讨了 Python 中的条件语句；它们通常用于标记代码。是时候磨练自己作为程序员的技能了。是的，你现在是一名程序员了。在自我提升方面，下一章有更多内容等着你。享受吧！\n"
