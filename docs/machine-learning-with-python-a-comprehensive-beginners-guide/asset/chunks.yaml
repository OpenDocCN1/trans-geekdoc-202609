  fmt: "\n# Chapter 14 – The Modules and their Applications in Python\n\nThis part\
    \ starts our top-to-bottom look at the Python module—the highest-level program\
    \ organization unit, which packages program code and data for reuse, and provides\
    \ self-contained namespaces that limit variable name conflicts across your projects.\
    \ In concrete terms, modules typically correspond to Python program files. Each\
    \ file is a module, and modules import other modules to use the names they define.\
    \ Modules may also correspond to extensions coded in external languages, such\
    \ as C, Java, or C#, and even to directories in package imports.\n\nModules are\
    \ processed with two statements and one important function:\n\n*   `import`: Lets\
    \ a client (importer) fetch a module as a whole.\n*   `from`: Allows clients to\
    \ fetch specific names from a module.\n*   `imp.reload()` (`reload()` in 2.X):\
    \ Provides a way to reload a module's code without stopping the program.\n\nWe've\
    \ been using them since then. The goal here is to expand on the core module concepts\
    \ you're already familiar with and move on to explore more advanced module usage.\
    \ This first chapter reviews module basics and offers a general look at the role\
    \ of modules in overall program structure. In the chapters that follow, we'll\
    \ delve into the coding details behind the theory. Along the way, we'll flesh\
    \ out module details omitted until now—you'll learn about reloads, the `__name__`\
    \ and `__all__` attributes, package imports, relative import syntax, 3.3 namespace\
    \ packages, and so on. Since modules and classes are essentially just glorified\
    \ namespaces, we'll formalize namespace concepts here as well.\n\n## Why Use Modules?\n\
    \nSimply put, modules provide an easy way to organize components into a system\
    \ by serving as self-contained packages of variables known as namespaces. All\
    \ names defined at the top level of a module file become attributes of the imported\
    \ module object. As we saw in the last part of this book, imports provide access\
    \ to names in a module's global scope. That is, the module file's global scope\
    \ becomes the module object's attribute namespace when it is imported. Ultimately,\
    \ Python's modules allow us to link individual files into a larger program system.\n\
    \nMore specifically, modules serve at least three roles:\n\n### Code Reuse\n\n\
    Modules let you save code in files permanently. Unlike code you type at the Python\
    \ interactive prompt, which disappears when you exit Python, code in module files\
    \ is persistent—it can be reloaded and rerun as many times as needed. Just as\
    \ importantly, modules are a place to define names, known as attributes, which\
    \ may be referenced by multiple external clients. When used well, these support\
    \ a modular program structure that groups functionality into reusable units.\n\
    \n### System Namespace Partitioning\n\nModules are also the highest-level program\
    \ organization unit in Python. Although they are fundamentally just packages of\
    \ names, these packages are also self-contained—you can never see a name in another\
    \ file unless you import that file. Much like the local scopes of functions, this\
    \ avoids name clashes across your programs. In fact, you cannot avoid this feature—everything\
    \ \"lives\" in a module; both the code you run and the objects you create are\
    \ always implicitly enclosed in modules. Thus, modules are natural tools for grouping\
    \ system components.\n\n### Implementing Shared Services or Data\n\nFrom an operational\
    \ perspective, modules are also useful for implementing components that are shared\
    \ across a system and thus require only a single copy. For instance, if you need\
    \ to provide a global object used by more than one function or file, you can code\
    \ it in a module that can then be imported by many clients.\n\nAt any rate, that's\
    \ the theoretical story—for you to truly understand the role of modules in a Python\
    \ system, we need to digress for a moment and explore the general structure of\
    \ a Python program.\n\n## Python Program Architecture\n\nSo far in this book,\
    \ I've sugarcoated some of the complexity in my descriptions of Python programs.\
    \ In practice, programs generally involve more than just one file. For all but\
    \ the simplest scripts, your programs will take the form of multi-file systems—as\
    \ the code timing projects of the prior chapter illustrate. Even if you can get\
    \ by coding a single file yourself, you will likely find yourself using external\
    \ files that someone else has already written.\n\nThis section introduces the\
    \ general architecture of Python programs—the way you split a program into a collection\
    \ of source files (a.k.a. modules) and link the parts into a whole. As we'll see,\
    \ Python fosters a modular program structure that groups functionality into logical\
    \ and reusable units, in ways that are natural and almost automatic. Along the\
    \ way, we'll also explore the central concepts of Python modules, imports, and\
    \ object attributes.\n\n## How to Structure a Program\n\nAt a base level, a Python\
    \ program consists of text files containing Python statements, with one main top-level\
    \ file, and zero or more supplemental files known as modules. Here is how this\
    \ works:\n\n*   The **top-level** (a.k.a. script) file contains the main flow\
    \ of control of your program—this is the file you run to launch your application.\n\
    *   The **module** files are libraries of tools used to collect components used\
    \ by the top-level file, and potentially elsewhere.\n\nTop-level files use tools\
    \ defined in module files, and modules use tools defined in other modules. Although\
    \ they are code files as well, module files generally don't do anything when run\
    \ directly; rather, they define tools intended for use in other files.\n\n## Imports\
    \ and Attributes\n\nLet's make this more concrete. Take, for example, the structure\
    \ of a Python program composed of three files: `a.py`, `b.py`, and `c.py`.\n\n\
    The file `a.py` is chosen to be the top-level file; it will be a simple script\
    \ file of statements, executed from top to bottom when launched. The files `b.py`\
    \ and `c.py` are modules; they are simple script files of statements too, but\
    \ they are not usually launched directly. Rather, as explained previously, modules\
    \ are typically imported by other files that wish to use the tools the modules\
    \ define.\n\nFor instance, suppose the file `b.py` in the example defines a function\
    \ called `spam` for external use. As we learned when studying functions in Part\
    \ IV, `b.py` will contain a Python `def` statement to create the function, which\
    \ you can later run by passing zero or more arguments in parentheses after the\
    \ function's name:\n\n```python\ndef spam(text): # File b.py\n    print(text,\
    \ 'spam')\n```\n\nNow, suppose `a.py` wants to use `spam`. To this end, it might\
    \ contain Python statements such as the following:\n\n```python\nimport b # File\
    \ a.py\nb.spam('gumby') # Prints \"gumby spam\"\n```\n\nThe first of these, a\
    \ Python `import` statement, gives the file `a.py` access to everything defined\
    \ by top-level code in the file `b.py`. The code `import b` essentially means:\
    \ Load the file `b.py` (unless it's already loaded), and give me access to all\
    \ its attributes through the name `b`.\n\nTo fulfill such goals, `import` (and,\
    \ as you'll see later, `from`) statements execute and load other files on demand.\
    \ More formally, in Python, cross-file module linking isn't resolved until such\
    \ `import` statements are executed at runtime; their net effect is to assign module\
    \ names—simple variables like `b`—to loaded module objects.\n\nIn fact, the module\
    \ name used in an `import` statement serves two purposes: it identifies the external\
    \ file to be loaded, but it also becomes a variable assigned to the loaded module.\
    \ Similarly, objects defined by a module are also created at runtime, as the import\
    \ is executing: `import` actually runs statements in the target file one by one\
    \ to create its contents. Along the way, each name assigned at the top level of\
    \ the file becomes an attribute of the module, accessible to importers.\n\nFor\
    \ example, the second of the statements in `a.py` calls the function `spam` defined\
    \ in module `b`—created by running its `def` statement during the import—using\
    \ object attribute notation. The code `b.spam` means: Fetch the value of the name\
    \ `spam` that lives inside the object `b`. This happens to be a callable function\
    \ in our example, so we pass a string in parentheses (`'gumby'`).\n\nIf you actually\
    \ type these files, save them, and run `a.py`, the words \"gumby spam\" will be\
    \ printed. As we've seen, the object attribute notation shows up throughout Python\
    \ code—most objects have useful attributes that are fetched with the `.` operator.\
    \ Some reference callable objects like functions that take action (e.g., a payroll\
    \ PC). Program architecture in Python. A program is a collection of modules. It\
    \ has one top-level script file (run to start the program), and many module files\
    \ (imported libraries of tools). Scripts and modules are both text files containing\
    \ Python statements, but the statements in modules generally just create objects\
    \ to be used later. Python's standard library provides a collection of precoded\
    \ modules. Basic data values represent more static objects and attributes (e.g.,\
    \ a person's name).\n\nThe concept of importing is also completely pervasive throughout\
    \ Python. Any file can import tools from any other file. For instance, the file\
    \ `a.py` might import `b.py` to call its function, but `b.py` might also import\
    \ `c.py` to use various tools defined there. Import chains can nest as deeply\
    \ as you like: in this example, module `a` can import `b`, which can import `c`\
    \ and others as well.\n\nConclusively, you have been taken through to use and\
    \ reuse Python codes. This works great as it has been explained. The next chapter\
    \ answers your curiosity on how many packages are there in Python with their functions.\
    \ Let us move to the next chapter!\n"
  trans: "\n# 第 14 章 – Python 中的模块及其应用\n\n本部分开始自顶向下地探讨 Python 模块——最高层级的程序组织单元，它将程序代码和数据打包以供复用，并提供独立的命名空间，从而限制项目间的变量名冲突。具体而言，模块通常对应\
    \ Python 程序文件。每个文件都是一个模块，模块通过导入其他模块来使用它们定义的名称。模块也可能对应用外部语言（如 C、Java 或 C#）编写的扩展，甚至包导入中的目录。\n\
    \n模块通过两条语句和一个重要函数进行处理：\n\n*   `import`：允许客户端（导入者）整体获取一个模块。\n*   `from`：允许客户端从模块中获取特定的名称。\n\
    *   `imp.reload()`（2.X 版本中的 `reload()`）：提供了一种在不停止程序的情况下重新加载模块代码的方法。\n\n我们一直在使用它们。此处的目标是扩展你已熟悉的核心模块概念，并进一步探索更高级的模块用法。本章首先回顾模块基础，并概述模块在整体程序结构中的作用。在后续章节中，我们将深入探讨理论背后的编码细节。在此过程中，我们将充实此前省略的模块细节——你将了解重新加载、`__name__`\
    \ 和 `__all__` 属性、包导入、相对导入语法、3.3 命名空间包等内容。由于模块和类本质上只是“光荣的”命名空间，我们也将在此正式阐述命名空间概念。\n\
    \n## 为什么要使用模块？\n\n简单来说，模块通过作为称为命名空间的独立变量包，提供了一种将组件组织成系统的简便方式。模块文件顶层定义的所有名称都会成为导入模块对象的属性。正如我们在本书上一部分所见，导入提供了对模块全局作用域中名称的访问。也就是说，模块文件的全局作用域在被导入时会成为模块对象的属性命名空间。归根结底，Python\
    \ 的模块允许我们将单个文件链接成一个更大的程序系统。\n\n更具体地说，模块至少扮演三种角色：\n\n### 代码复用\n\n模块让你能永久地将代码保存在文件中。与你在\
    \ Python 交互提示符下输入的代码不同，后者在你退出 Python 时就会消失，模块文件中的代码是持久的——它可以根据需要重新加载并重复运行任意次。同样重要的是，模块是定义名称（称为属性）的地方，这些名称可被多个外部客户端引用。如果使用得当，这些特性支持模块化的程序结构，将功能分组为可复用的单元。\n\
    \n### 系统命名空间划分\n\n模块也是 Python 中最高层级的程序组织单元。虽然它们本质上只是名称的包，但这些包也是独立的——除非你导入另一个文件，否则永远无法看到其中的名称。这很像函数的局部作用域，避免了程序间的名称冲突。事实上，你无法避免这一特性——所有事物都“生活”在模块中；你运行的代码和创建的对象始终隐式地包含在模块中。因此，模块是分组系统组件的天然工具。\n\
    \n### 实现共享服务或数据\n\n从操作角度来看，模块对于实现跨系统共享、因此只需单一副本的组件也很有用。例如，如果你需要提供一个被多个函数或文件使用的全局对象，可以将其编写在一个模块中，然后由多个客户端导入。\n\
    \n无论如何，以上是理论层面的阐述——要真正理解模块在 Python 系统中的作用，我们需要暂时岔开话题，探讨 Python 程序的总体结构。\n\n##\
    \ Python 程序架构\n\n到目前为止，在本书中，我对 Python 程序的描述稍微掩盖了一些复杂性。在实践中，程序通常不止涉及一个文件。除最简单的脚本外，你的程序将采用多文件系统的形式——正如前一章的代码计时项目所示。即使你自己编写单个文件也能应付，你也很可能会发现自己在使用别人已经编写好的外部文件。\n\
    \n本节介绍 Python 程序的总体架构——即如何将程序拆分为源文件集合（即模块）并将各部分链接成一个整体。正如我们将看到的，Python 促进了一种模块化的程序结构，以自然且近乎自动的方式将功能分组为逻辑上可复用的单元。在此过程中，我们还将探讨\
    \ Python 模块、导入和对象属性的核心概念。\n\n## 如何构建程序结构\n\n从基础层面来看，Python 程序由包含 Python 语句的文本文件组成，包含一个主顶层文件，以及零个或多个称为模块的补充文件。其工作原理如下：\n\
    \n*   **顶层**文件（又称脚本）包含程序的主控制流——这是启动应用程序时运行的文件。\n*   **模块**文件是工具库，用于收集顶层文件使用的组件，并可能在其他地方使用。\n\
    \n顶层文件使用模块文件中定义的工具，模块则使用其他模块中定义的工具。虽然它们也是代码文件，但模块文件通常在直接运行时不执行任何操作；相反，它们定义供其他文件使用的工具。\n\
    \n## 导入与属性\n\n让我们具体化一下。以由三个文件组成的 Python 程序结构为例：`a.py`、`b.py` 和 `c.py`。\n\n文件 `a.py`\
    \ 被选为顶层文件；它将是一个简单的语句脚本文件，启动时从上到下执行。文件 `b.py` 和 `c.py` 是模块；它们也是简单的语句脚本文件，但通常不直接启动。正如前面所述，模块通常由希望使用模块定义工具的其他文件导入。\n\
    \n例如，假设示例中的文件 `b.py` 定义了一个名为 `spam` 的函数供外部使用。正如我们在第四部分学习函数时所知，`b.py` 将包含一个 Python\
    \ `def` 语句来创建该函数，稍后你可以通过在函数名后的括号中传递零个或多个参数来运行它：\n\n```python\ndef spam(text):\
    \ # 文件 b.py\n    print(text, 'spam')\n```\n\n现在，假设 `a.py` 想要使用 `spam`。为此，它可能包含如下\
    \ Python 语句：\n\n```python\nimport b # 文件 a.py\nb.spam('gumby') # 打印 \"gumby spam\"\
    \n```\n\n第一条语句是 Python `import` 语句，它使文件 `a.py` 能够访问文件 `b.py` 中顶层代码定义的所有内容。代码 `import\
    \ b` 实质上意味着：加载文件 `b.py`（除非已加载），并通过名称 `b` 让我访问其所有属性。\n\n为实现此类目标，`import`（以及稍后你将看到的\
    \ `from`）语句按需执行并加载其他文件。更正式地说，在 Python 中，跨文件模块链接直到此类 `import` 语句在运行时执行时才会解析；其净效果是将模块名称（如\
    \ `b` 这样的简单变量）赋值给已加载的模块对象。\n\n事实上，`import` 语句中使用的模块名称有两个用途：它标识要加载的外部文件，但也会成为赋值给已加载模块的变量。同样，模块定义的对象也是在导入执行时于运行时创建的：`import`\
    \ 实际上会逐条运行目标文件中的语句以创建其内容。在此过程中，文件顶层赋值的每个名称都会成为模块的属性，供导入者访问。\n\n例如，`a.py` 中的第二条语句使用对象属性表示法调用模块\
    \ `b` 中定义的函数 `spam`——该函数是在导入期间运行其 `def` 语句时创建的。代码 `b.spam` 意味着：获取存在于对象 `b` 内部的名称\
    \ `spam` 的值。在我们的示例中，这恰好是一个可调用函数，因此我们在括号中传递一个字符串（`'gumby'`）。\n\n如果你实际创建这些文件，保存它们，并运行\
    \ `a.py`，将打印出 \"gumby spam\"。正如我们所见，对象属性表示法贯穿于 Python 代码中——大多数对象都有有用的属性，通过 `.`\
    \ 运算符获取。有些引用可调用对象（如函数）以采取行动（例如薪资 PC）。Python 程序架构。程序是模块的集合。它有一个顶层脚本文件（运行以启动程序），和许多模块文件（导入的工具库）。脚本和模块都是包含\
    \ Python 语句的文本文件，但模块中的语句通常只是创建供稍后使用的对象。Python 标准库提供了一组预编码模块。基本数据值代表更静态的对象和属性（例如一个人的名字）。\n\
    \n导入的概念在 Python 中也完全无处不在。任何文件都可以从任何其他文件导入工具。例如，文件 `a.py` 可能导入 `b.py` 以调用其函数，但\
    \ `b.py` 也可能导入 `c.py` 以使用那里定义的各种工具。导入链可以按你喜欢的深度嵌套：在本例中，模块 `a` 可以导入 `b`，后者可以导入\
    \ `c` 及其他模块。\n\n总而言之，你已经了解了如何使用和复用 Python 代码。正如所解释的，这工作得很好。下一章将解答你关于 Python 中有多少包及其功能的好奇心。让我们进入下一章！\n"
