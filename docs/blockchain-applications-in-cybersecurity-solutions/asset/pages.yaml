  md: '# Step 6: Creating instance for Blockchain and add two blocks onto the chain
    to understand working of PoW


    ```

    bc = Blockchain()


    bc.add-new-block(21/08/2020,{amount:15},

    bc.chain[1].computeHash())


    bc.add-new-block(22/08/2020,{amount:5},

    bc.chain[2].computeHash())

