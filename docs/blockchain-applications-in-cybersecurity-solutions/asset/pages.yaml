  md: '# Blockchain Based Access Control Systems


    R. Agrawal¹,* and N. Gupta¹


    ¹ Manav Rachna International Institute of Research and Studies, Faridabad, Haryana,
    India


    Abstract: While accessing data through the Internet of Things (IoT), privacy and
    safety are the most important features. IoT developers have a challenging job
    of securing and protecting the data of the users during the development process
    due to the complicated nature of decentralisation and heterogeneity of the environment
    present in IoT. There are several access control models for the IoT available
    in the literature which rely on centralized architecture and raises security concerns
    because IoT devices can spontaneously and dynamically interact with one another.
    The need for secure and distributed access control architecture to overcome the
    single point of failure problem of a centralized entity becomes a big challenge
    when coupled with scalability and lightweight features. It is possible to achieve
    this through the use of Blockchain technology, which has recently been used to
    provide access control services. IoT device management would be used to manage
    distribution, heterogeneity, scalability, the ability to tolerate failure, security
    and privacy aspects of IoT devices at scale in the near future as it is useful.


    Keywords: Blockchain, Access control system, Policy creation transaction, Distributed
    access management, Internet of things.


    # INTRODUCTION


    There seems to be a reliance on the presence of a trusted authority in the current
    digital economy. To conduct any online transaction, we need to trust that the
    information we receive is accurate. Whether that be an email service provider
    informing us of delivery or a certification authority telling us to trust a particular
    digital certificate; on the other hand, a social network, for instance Facebook,
    might tell us our posts about life are only shared with our friends, or a bank
    might tell us we can put our trust in our dear ones in another country. We live
    in a world that is precarious, where we have to rely on a third-party institution
    to keep us safe and to keep our individual information private. Third parties,
    as always, are susceptible to hacking, manipulation, or compromise. Blockchain
    technology offers a solution to these problems. With distributed consensus enabled
    by this'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'technology, it is possible to verify any online transaction involving digital
    assets at any time, allowing the world of digital to undergo revolutionary change.
    Digital assets and party identities are protected without compromising privacy.
    Blockchain technology is distinguished by its distributed consensus as well as
    its anonymity. Regulation issues and technical challenges are outweighed by the
    benefits of Blockchain technology.


    Blockchain technology has proven to be a highly transparent and incorruptible
    method of storing data. Decentralized technology ensures encryption and security
    end-to-end, making it ideal for networks with lots of users. Blockchain''s decentralized
    nature eliminates the possibility of human error and offers protection against
    hacker attacks altogether due to its distributed nature. In the context of Access
    Control, especially Access Control as a Service, all of the above is of paramount
    importance.


    Cryptocurrencies and financial transactions were the first blockchain applications.
    There is a wide range of applications for smart contracts, such as healthcare,
    internet of things, supply chains and more. Study [1], a review of many research
    studies on blockchain and smart contracts, shows that many of the applications
    presented were aimed at providing an efficient and secure way to control access.


    An Access Control System is used to control access to data and services that are
    perceived as critical or valuable by the public. Furthermore, it is also used
    to manage computing systems, storage space, and other coprocessors. Access control
    policies are used in general to express the rights of subjects to access resources.
    These policies are evaluated based on the context of the request at the time.
    ABAC (Attribute-Based Access Control) [2] is a form of access control that consists
    of a set of conditions that describe the inherent characteristics of subject areas,
    resources, environments, etc., involved in the access request. As examples of
    subject attributes, one can find his ID, the company''s ID, his title within that
    organization, the names of the projects he is working on, the number of resources
    he is currently using, and so on.


    It may be necessary to transfer the access right between subjects for a variety
    of reasons in some cases due to certain circumstances. An individual who owns
    an access right could, for instance, sell it to someone else. The same holds true
    for an example of an employee of a company who is supposed to perform a particular
    procedure on a Virtual Machine, yet chooses rather delegate the responsibility
    of the task to another employee who also needs to access the Virtual Machine.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# # BACKGROUND


    A blockchain is a digital ledger of data that can be accessed by anyone at any
    time. Blockchains are decentralized databases that are secure, easy to use, and
    can be accessed by anyone. This system is based on trustless principles, which
    means that users accept the data and analyze the data, whether it is secure or
    not, without any third-party intervention. Initially, it was planned to provide
    secure cryptocurrencies, such as Bitcoins, but nowadays, researchers are exploring
    the possibility of applying the technology to a wide range of fields [3]. As part
    of the method, tokens are exchanged in the form of transactions on the blockchain
    in exchange for tokens. A blockchain is an example of a peer-to-peer network consisting
    of several nodes that uses a cryptographic protocol. By verifying the transactions
    and passing between these nodes, these nodes handle the communication between
    them. Blockchain has a lot of interesting features that make it easy to use [4].
    Basically, it is a distributed ledger that is only appended to. The data, once
    inserted into a database, cannot be changed once they have been added, nor can
    they be deleted after they have been added. On the blockchain, anyone can be added
    to the network, so they will be able to see all the transactions that are by nature
    public, as blockchain transactions are public by nature.


    With the help of the blockchain, bitcoin, like many other cryptocurrencies, stores
    value exchanges referred to as transactions on the public ledger [5]. Every single
    block in this ledger is a collection of non-conflicting transactions that were
    made in that block. In order to create the link between blocks, the hash of the
    header of the previous block is stored in the header of the next block of the
    chain. The root of a Merkle tree derived from the block transaction hashes is
    included in the block header of each block as a function of its block header (and
    hence it is hash). This is done to make the block headers dependent on all transactions
    contained in that block. The decision of which block to add to the ledger at each
    step is made by a distributed consensus algorithm known as the ''Nakamoto consensus'',
    which is based on the HashCash Proof-of-Work [6] system.


    A simple way to look at the Bitcoin blockchain from a data point of view is to
    see it as a list of transactions. Users exchange funds using their wallet addresses,
    which serve as the address of their wallet. A public key that derives from an
    ECDSA key pair [7] is derived as a two-way hash (first applying SHA-256 and then
    applying Ripemd-160 as the second step) to establish an address.


    In the case of Bitcoin, the address (and therefore the public key) is used by
    the users to send and receive payments, while the private key is used to provide
    proof of ownership (through digital signatures). Since creating new ECDSA key
    pairs is'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'as cheap as creating new addresses, each user can create and use multiple ECDSA
    key pairs. A user is also encouraged to use different addresses because even the
    failure to use different addresses makes Bitcoin an insecure, non-anonymous currency.


    Having the blockchain as the sole means of keeping track of all transactions in
    the system, the only way to manage funds is to keep track of those transactions.
    The only way to divide or aggregate funds is to spend them. A transaction can
    originate from more than one input address and output more than one address, meaning
    that a transaction can withdraw funds from more than one address and send funds
    to more than one address. Furthermore, each input is signed by the owner of the
    private key that corresponds to the address where the funds will be spent.


    As part of a transaction, a voluntary fee can also be specified to cover the costs
    associated with the validation process. The purpose of this fee is to act as an
    incentive for users to participate in the consensus protocol that was previously
    mentioned. It is possible to see each output as a couple (amount, recipient address)
    in the context of a transaction. Inputs instead specify where to withdraw the
    funds, i.e., the previous transaction (through its hash) where the funds were
    created and where the funds will be withdrawn. In addition to the scripting language
    used in the Bitcoin protocol to specify conditions for the redemption of funds,
    Bitcoin''s protocol uses a stack-based scripting language, which is not Turing
    complete.


    Despite the fact that blockchain technology is mostly known for applications in
    cryptocurrencies [8], such as Bitcoin, it can be used outside of the monetary
    domain as well, for example, to trace the origins and transformations of products
    in a supply chain. Huckle et al. [9] discuss how blockchain can be used to create
    decentralized, shared economy applications that will enable people to monetize
    their things in a secure manner in order to become more wealthy. A study conducted
    by [10] notably notes that having a worldwide-available, verifiable, and untamperable
    source of data will enable anyone who wishes to offer trusted third-party services
    to do so in a cost-effective and robust way.


    Most digital resources nowadays are exposed to the Internet, which necessitates
    a well-designed security framework that provides protection. Users with actual
    rights to access the information. There are systems that deal with access control
    specifically designed to deal with these types of situations, and they look after
    expressing the rights of subjects to access resources through the use of policies,
    which are then evaluated against the prevailing access context for each access
    request. Sometimes, authorization to perform access is continuously validated'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'during the access, so that previously authorized accesses are interrupted as
    soon as these rights expire.


    In the scientific literature, different types of control models have been proposed
    for defining different types of controls. One of the most popular ABAC schemes
    represents the access context through a set of attributes that describe their
    relevant characteristics in relation to the subjects, resources, and the environment,
    and the Access Control policies consist of a set of conditions over these attributes.
    It is possible for the Access Control systems to be deployed, managed and operated
    on the premises of the resource owners or by third parties trusted by the resource
    owners.


    As a resource owner, the cost of maintaining an Access Control system can be a
    notable constraint. To avoid this cost, it is possible to outsource the evaluation
    of its security policies to external systems. For instance, over the last few
    years, a number of Access Control systems have been proposed and implemented as
    independent services on top of the Cloud following the Software as a Service (SaaS)
    paradigm. It is common for these services to use an open-platform API, so that
    users are not locked into using one specific implementation, and they can use
    them to have a uniform configuration for controlling all their resources with
    the same policy. As for the other Cloud services, each user pays for the usage
    of the Access Control Services on a per use basis.


    # BLOCKCHAIN-BASED ACCESS CONTROL FOR IOT


    According to the authors [11], the Blockchain is the mechanism used to generate
    and manage access tokens representing a subject''s rights to access a resource.
    The model introduces a new type of subscription transaction. PCT (Policy Creation
    Transaction) and RTT (Right Transfer Transaction). The resource owner must first
    perform a transaction when the resource attributes comply with the individual
    access policies, in order to generate and transfer an access token. Access requests
    may be evaluated for approval by two different systems (the resource owner and
    the external authorization system). Both systems must interact for the process
    to be successful. An access token can also be passed from one subject to another
    in the second type of transaction. This process is called access delegation. Based
    on the XACML standard, an external authorization system is implemented using the
    Bitcoin platform to manage user access tokens.


    Novo [12] provides a design for offering a decentralized access control system
    that is composed of a network of sensors that are operational in multiple parts
    of the world. Smart contracts are designed to reduce the amount of communication
    overhead between nodes in order to provide real-time, decentralized access control
    for the benefit of users. Since IoT devices are not capable of connecting to IoT
    devices are not capable of connecting to'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'the Blockchain due to their limited capabilities, the architecture instead
    specifies a new component called a management hub which can request access control
    information on the Blockchain from IoT devices. There are also two types of Blockchain
    nodes defined by the system architecture, namely managers and agents. A manager
    does not participate in mining, and is considered a lightweight Blockchain node.
    A single smart contract is deployed by the agent node to manage the access control
    permission of IoT devices. This specific smart contract comprises all of the capabilities
    of an access management system in one package. As soon as an IoT device receives
    an access request, it sends the request to the hub, which is connected directly
    to a Blockchain node, for example, to a miner that works together with the smart
    contract to determine whether the requestor is authorized to access the resource.
    In a proof-of-concept implementation, Blockchain technology has been used as a
    distributed access management technology for IoT.


    Researchers identified two primary problems with IoT access control in [13]. The
    first is that of centralized architecture, and the second has to do with handling
    static policies. Using machine learning algorithms in conjunction with a blockchain
    architecture, the authors propose a framework for ensuring complete distributed
    access control while managing dynamic access policies based on machine learning
    algorithms. Utilizing a Smart Contract concept, this framework implements a resource
    owner''s (RO) access control policy to manage access to a resource that he owns.
    It is important to remember that in order for the Policy Contract to properly
    execute, the requester must meet policies regarding accessing the data in question,
    thus allowing the Policy Contract to generate and issue an authorization token
    allowing him access to the resource. Every time the Policy Contract is interacting
    with something; a transaction is generated, which is recorded in the Blockchain
    register. The resource owner will also receive feedback information about the
    system''s current state after the contract is executed by using Reinforcement
    Learning (RL) algorithms. The feedback information can be used to dynamically
    improve security parameters such as trust and integrity. A Proof of Concept is
    required to validate the proposed model.


    IoT Chain is a Blockchain-based architecture called by the authors in [14] for
    securing End to End access management to IoT resources. Resources that are stored
    on the resources servers will be encrypted and signed and will be stored on a
    proxy server that the owners of the resources will own. It is, therefore, the
    client who requests access to the protected resources on behalf of a third party.
    Upon requesting the decryption key, it checks the Blockchain to verify if the
    client has been authorized before requesting the decryption key. Authorization
    takes place in the following manner: the resource owner creates a smart contract
    for clients and publishes it to the Blockchain. Upon meeting certain conditions,
    the client calls'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'the corresponding smart contract to generate an access token. A contract will
    keep the token stored in persistent memory on the contract''s server rather than
    transmitting it to the client. Tokens are stored in the internal contract storage,
    and then clients request the key to decrypt them from the key server, which is
    a blockchain node that maintains a copy of the Blockchain ledger. The key server
    verifies a client''s access token on the blockchain and transmits the key using
    DTLS channels after checking the smart contract storage on the Blockchain. The
    client then downloads the encrypted resource from the proxy server and decrypts
    it.


    Researchers in the study [15] used smart contracts to solve the scaling problem
    associated with IoT authentication. Typically, an individual owns one or more
    IoT devices, and each device requires its own set of credentials. Therefore, it
    is necessary for the user to authenticate to every device individually from this
    point onward. As a consequence, this method causes an authentication overhead
    and is difficult to scale. Smart contracts are used primarily for authenticating
    users and providing them with a token that allows them access to the IoT devices
    which they own. Users authenticate to the smart contract using their Ethereum
    wallet address, which allows the smart contract to verify the user''s identity.
    A contract is subsequently negotiated if the user is allowed to access the resources,
    and the key is then communicated to the end user and to the IoT device. The user
    will then sign the received token using his private key, send it to the IoT device
    that will take the token and confirm its integrity by comparing it with the instance
    received earlier from the contract and then grant access. The Ethereum blockchain
    has been used to implement and test this approach. A general approach for blockchain-based
    access control for IoT has been shown in (Fig. 1).


