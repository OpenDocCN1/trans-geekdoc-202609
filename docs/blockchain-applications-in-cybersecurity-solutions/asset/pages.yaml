  md: '# # Blockchain Applications in Cybersecurity Solutions


    # ## Proof of Stake (PoS)


    PoS employs a randomized procedure to find out who has the likelihood to produce
    the subsequent block [9]. Blockchain users can hold their tokens for a certain
    duration to become a validator. The nodes are not only involved in validating
    process as a validator, but sometimes generate a new block and become a contributor.
    The nodes that act as validators are changed from time to time depending on their
    active involvement in rendering the blockchain. The probability at which the nodes
    generate new blocks depends on the number of coins or stakes they possess. The
    validator node involved in the validating process of a transaction gets a reward
    amount depending on their level of involvement in forming the block. On the other
    hand, due to inflation, validators may get a particular amount of coins. These
    rewards allow retaining the validators in the blockchain network. PoS is more
    efficient in conserving energy compared to any other consensus mechanisms.


    # ## Delegated Proof of Stake (DPoS)


    DPoS allows the users to gamble with their stakes to cast votes to different representatives
    in a transaction [10]. Each user’s vote has a different weightage in the transaction
    depending on how much stake they have used for casting the vote to a delegate.
    The vote of user ‘X’ had more weightage than the vote of user ‘Y’, when user ‘X’
    used his 100 stakes for casting the vote whereas user ‘Y’ uses only 25. The representatives
    who secured more votes are given the right to generate a new block. The representatives
    receive a reward of a certain amount of stakes as transaction fee as in other
    consensus mechanisms. DPoS is faster and deals with more number of transactions.
    This mechanism is considered provide digital democracy as it follows a voting
    system based on stake-weighted votes.


    # ## Practical Byzantine Fault Tolerance (pBFT)


    In P2P networks, undisputed concurrences among trustworthy and non-faulty nodes
    help in accomplishing consensus. The basis of BFT is observable in a situation
    where all nodes reiterate an incoming message [11]. If a node keeps repeating
    the incoming message, then it evidently signifies that it does not have any fault.
    Alternatively, if the receivers replicate the incoming message, the network could
    effortlessly rule out the prospect of Byzantine nodes. Byzantine node denotes
    the traitor nodes which lie or mislead other nodes in the network deliberately.
    The byzantine node could also lie to the nodes that are concerned with the consensus
    protocol. An absolutely functional blockchain network would make sure that Byzantine
    Fault Tolerance in blockchain assists it in dealing with'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'failures. Byzantine node or malicious node leads to pitfalls recognized as
    Byzantine failures. Users could encounter two different types of Byzantine failures,
    among which, the first one is entirely technical in nature. A slight technical
    error in the node could influence its functionality, and in certain cases, it
    might discontinue reacting or working in general. The other type of Byzantine
    failure is related to random node failure. In case of a random node failure, a
    node might exhibit the following traits:


    +   - Failure to return an end result

    +   - Replying with erroneous results

    +   - Replying with intentionally ambiguous results for queries

    +   - Replying to a single query with various results to various constituent parts
    of the system


    BFT helps to overcome all these problems efficiently by decreasing the impact
    of harmful nodes. It can guard the network from risky failures and make sure the
    network is functioning ideally. Fundamentally, the sincere nodes and malicious
    nodes can do their own work without any effect on the performance of the network.
    Extensive investigation into the Byzantine General’s Problem and optimization
    has served as the stepping stone to introduce many improvements over the traditional
    BFT.


    # Proof-of-Burn (PoB)


    PoB also expends minimum energy when compared to other consensus mechanisms [16].
    PoB is a decentralized mechanism that involves removing the stakes from exchange
    to indicate that miners already reached an agreement. This removal process is
    referred to as burning. This serves to reduce inflation. PoB-based blockchain
    is used to authenticate transactions. PoB employs virtual mining rigs to authenticate
    transactions. PoB miners begin coin burning to display their contribution in the
    network and are permitted to mine. The number of coins burnt by a miner exhibits
    his virtual mining capacity. Higher mining power enhances the speed of determining
    new blocks. As a result, the miner is rewarded more. In PoB networks, the coins
    are addressed to a randomized eater address. This address is openly verifiable
    but unreachable. PoB is analogous to PoS in terms of using stakes for network
    protection. The main issue that needs to be considered is that the burned stakes
    are removed logically and not eternally which permits users to misuse them by
    peddling them to another one as the processor can still access them. PoB results
    in a scarcity of coins. PoB is a new consensus algorithm that is not tried on
    larger networks. However, PoB is sustainable and its mining is greatly decentralized.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# ## Proof of Elapsed Time (PoET)


    In PoET, each user is assigned a random waiting time [17]. The user who waits
    for a longer time with earlier finish time will get a chance to generate the new
    block. PoET relies on the random waiting time assigned to the users and it has
    to ensure waiting time is assigned purely in a random fashion.


    # ## Proof of Identity (PoId)


    In PoId, the user’s private key is compared with a qualified identity [18]. This
    ensures that all transactions are embedded with the private key of the user involved
    in that transaction. In this way, every certified user is allowed to generate
    a new block and circulate it to all other users in the network. This helps to
    maintain the authenticity and integrity of the blocks. . PoId is widely used in
    smart cities to authenticate the citizen''s identity.


    # ## Proof of Authority (PoAu)


    PoS is customized in such a way that the identities of validators are at stake
    [19]. The validator’s identity associates credentials of individual with the organisation
    and then the combined credentials serve as the validator’s identity to authenticate
    the transactions. In this way, the reputation of validators is at stake in the
    network. PoAu allows only the validators to generate new blocks. Also, validators
    are responsible for maintaining and protecting the blockchain network. The number
    of validators is usually limited to less than 25.


    The industries using blockchain use different consensus mechanisms in its business
    transaction, as a single mechanism will not satisfy all the stipulated specifications
    of the blockchain technology. As the specification of blockchain gets changed
    frequently in today’s digital world, any particular consensus mechanism is accommodated
    for an extended time duration. Consensus mechanism which is more efficient today,
    will not help much in the future. Hence the organisations that employ blockchain
    technology in their business must upgrade their consensus mechanism from time
    to time.


