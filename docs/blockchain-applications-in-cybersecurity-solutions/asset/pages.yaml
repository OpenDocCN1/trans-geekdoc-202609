    the root file node because it depends on when the lookup algorithm finds the node.


    We also measure the download latency for different file sizes, shown in Fig. (7).
    With the cache, it only takes about 10 ms to get the root file node, and the latency
    is pretty consistent. The latency the user observes when downloading a file from
    the application will be higher due to the Internet latency to transfer the data.
    With the Internet download speed of about 90 Mbps in our experiments, the Internet'
