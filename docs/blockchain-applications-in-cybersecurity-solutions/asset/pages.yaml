    # CONCLUSION & FUTURE WORKS


    Many smart devices like smartwatches, and smart home devices are emerging in the
    present digital world. This paper presents an overview of the Fitbit devices along
    with the type of data generated from those devices. In addition to this, various
    challenges of IoT security have also been discussed. Privacy and security are
    the primary concerns regarding IoT devices as it stores sensitive data about the
    person using them. Due to the advancement of high computational units, the servers
    can be hacked if they are protected with traditional security algorithms and centralized
    architecture. The proposed model provides security and privacy of the data and
    a single point of attack using blockchain technology, and any anomaly can also
    be detected using the same. The proposed model consumes more energy which is not
    ideal. This can be solved by implementing lightweight blockchains that consume
    less energy. In future works, the proposed model can be implemented for real-time
    data.


