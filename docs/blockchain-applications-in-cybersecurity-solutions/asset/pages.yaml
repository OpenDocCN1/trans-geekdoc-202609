  md: 'IPFS. We tried setting the expiration time to 10 seconds, 30 seconds, 1 minute,
    and 5 minutes, and for each expiration time, we ran a script to continuously download
    random files from the pre-uploaded files on IPFS and measured the latency. The
    resulting latency is drawn in the chart below. As the chart illustrates, when
    the expiration time increases, the latency decreases because more entries are
    kept in the cache, and we get more cache hits in the download operation.


    # Latency (ms) vs. Expiration time (seconds)


    ![](img/1b14bb2748aa86be47fb2952ff28da51_171_0.png)


    Fig. (8). Latency vs. expiration time of the memory cache.


    However, we do not want to have a very large expiration time as the cache will
    maintain a lot of entries that are not frequently accessed. From our experiments,
    the reasonable expiration time should be at the minimum of 1 min to about 2-3
    minutes because at 1 min, we can already get a significant latency reduction from
    more than 200 ms to about 50 ms. From 1 min and above, the latency is only gradually
    decreasing.


    The memory cache is backed by a key-value map in the Go language. Since a map
    can have a dynamic size, when more data is added to the map, the map will get
    more slots internally. Therefore, the maximum amount of data in the cache will
    depend on the available heap size and the operating system where IPFS is running.
    For example, a map in a 32-bit operating system can have 2³¹ - 1 slots, and a
    map in a 64-bit operating system can have 2⁶³ - 1 slots. Because of the above
    reason, initializing a map with a different size for our memory cache will not
    result in any difference in terms of the latency to get the data. However, the
    size of the cache is limited by the heap size and the memory available in the
    operating system.'
