    # Tamper Resistant


    The blockchain protocol running on the nodes of a P2P network performs the validation
    process of a transaction as depicted in Fig. (6) without involving third-party
    agents [6]. The validation process is done by majority vote consensus. This protocol
    is responsible for administering all the nodes to participate in validating the
