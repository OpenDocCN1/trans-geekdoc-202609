  md: '# Components of Blockchain


    The blockchain functionality is based on basic core components such as node, transaction,
    block, mining, and consensus.


    **Transaction:** Transaction is the basic data that is sent to the nodes for validity
    and is added to the chain. When new data is generated, that is considered a transaction
    and broadcasted to all the nodes.


    **Block:** Group of transactions is called a block. The transactions are grouped
    based on validity and are distributed across the chain. This block contains information
    about the transactions/data. Every block that is added to the chain will contain
    the hash value of the previous block.


    **Node:** Node is a component for the validity of a new transaction or digital
    entry. Every node in the Blockchain will have a copy of all the nodes of the chain.
    When a new transaction comes, the node checks its previous history and sends it
    to the remaining nodes to check its validity. If the transaction is valid, it
    is added to the chain; otherwise, it is denied.


    **Mining:** Mining is the core functionality of the Blockchain. It is a process
    of creating a block, validating it, and adding a hash value to it. After adding
    the hash value, it is distributed across the network.


    **Consensus:** The whole process of validating, adding, and distributing a block
    in the network is called consensus. Various Consensus algorithms like proof-of-work
    and proof-of-stake are already available that define a set of rules to maintain
    the Blockchain.


    Based on all the components and their properties, the Blockchain can be either
    private, public, or hybrid. The overall working of the Blockchain, along with
    the components, are represented in Fig. (5):


    # SECURITY USING BLOCKCHAIN


    Blockchain decentralized [11] and distributed processes, when applied to IoT,
    reduce the cost and risk associated with IoT device data management and data transfer
    as there is no central repository of the data [12]. The IoT gateway for data exchange
    can be eliminated with blockchain technology, thus reducing the cost and delay
    associated with IoT networks.'
