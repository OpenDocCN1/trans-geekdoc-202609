    # Authentication of IoT device


    The IoT device that should take part in the transaction should be authenticated.
    The Authentication process can be done via Hardware Authenticator, which can be
    an offline device. The Hardware Authenticator (HA) has important functions like
    creating the initial block, assigning a digital signature to the IoT device, and
    creating new blocks with a private key.


    Each of the authenticated devices can take part in the transaction with another
    authenticated device by looking into the block database given by HA. The database
    has the identification of all authenticated devices and valid previous transaction
    records. The other already standard devices in the network validate the newly
    joined device. Once validation is confirmed by 51% of the standard users in the
    network, the new authenticated device can take part in the transaction using its
    private key.


    **Integrity:** The hash value of the block identifies the particular block of
    information, and this characteristic makes the block of data immutable. The hash
    value of each block references the previous block of information to form a chain,
    and the time is recorded. Each block thus has the hash value of the previous block
    of data, thus making it hard to alter a particular block of data. The Overall
    hash value of the block is formed by considering the previous block’s hash value,
    the hash value of the transactional data, and Metadata. If any of the blocks of
    data is altered, it breaks the chain. The initial block has no valid previous
    hash as there is no previous block. This chunk of data is called Genesis Block,
    and the previous hash is set to a string of one or more zeros. There are two methods
    employed to make the data secure.'
  merge: -1
  img_proc: true
