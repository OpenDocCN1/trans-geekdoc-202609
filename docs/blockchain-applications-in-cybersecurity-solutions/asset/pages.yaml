- pgno: 172
  md: 'It should be noted that using the memory cache can have some disadvantages.
    Data from IPFS cannot be cached when it is too large; it will result in a cache
    miss when the requested data comes in too big [27]. The performance of IPFS will
    be slowed down when many cache misses happen. If IPFS, with its integrated memory
    cache, does not seem to be a good fit for the application''s intended use cases,
    it is possible to consider other alternative distributed file systems, such as
    Ceph, GlusterFS, and HDFS. Described as a distributed file system, Hadoop is an
    open-source system that can store and process huge amounts of unstructured data.
    It facilitates high throughput access to data. Ceph is a POSIX-compliant network
    file system that offers high performance and large data storage, and is highly
    compatible with legacy applications. GlusterFS is also a fast and scalable distributed
    file system that has caching of data and metadata. GlusterFS can be integrated
    with HDFS to process large data for data analysis purposes.


    # TRADEOFF BETWEEN PERFORMANCE AND SECURITY


    There is a computing cost for each added security mechanism in the application,
    so it incurs a tradeoff between performance and security. When an additional layer
    of security is integrated, the application’s server has to do more computing work
    in the security check, so the application can run a little slower. If security
    is more important, we need to sacrifice the performance of the application, and
    vice versa. Therefore, it is important to choose the right balance between performance
    and security to meet the requirements and use cases of the application.


    We have measured the performance impact in our application for each security method.
    We upload and download files of 1 Mb in size. The encryption and decryption using
    OpenSSL each take about 50 ms. The call to the smart contract to verify the user’s
    identity takes between 20 to 70 ms. Because the identity check by the smart contract
    is simple, assuming no network failures, the time it takes is small enough to
    be acceptable and very consistent in the aforementioned range of 20 and 70 ms.
    In short, the security implementation adds an additional 50 ms to the file upload
    flow and an extra 70 ms to 120 ms when downloading a file.


    As we know from the experiments, IPFS with the memory cache only takes about 10
    ms to resolve the root file node, so the additional latency from the security
    protection is about 7 to 12 times longer on average for a file download. From
    the user experience, the added latency of about 100 ms in a download should not
    be noticeable. However, if we want to upload a very large file, we may need to
    split it into chunks and encrypt each chunk at a time because there is a size
    limit in OpenSSL encryption. This splitting and encrypting of a large file may
    add a significantly longer latency for uploading a file, which is something we
    need to consider.'
