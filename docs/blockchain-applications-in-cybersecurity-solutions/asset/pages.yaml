    # Challenges of IoT Devices


    IoT devices come in a wide range of varieties. These devices communicate with
    other devices in different ways, such as wired or wireless communication, using
    different protocols depending on the end communication device. Due to the heterogeneity
    of the devices, there is no standardization of the communication protocols. This
    raises a concern in terms of the security, integrity, and confidentiality of the
    device and its associated data. And also, these devices are more easily prone
    to security attacks because of their limited resources and computational capacity.
    Due to the wide range of devices, IoT devices face many challenges, which are
    tabulated in Table 2.


    # Table 2. Challenges of IoT Devices.


    | S.No. | Challenge | Description |

    |---|---|---|

    | 1 | Confidentiality | As the Devices maintain sensitive information about the
    user, there is a need to maintain the confidentiality of the data. |

    | 2 | Integrity | As the devices communicate with other devices or servers, it
    is transmitted through a network. Hence the integrity of the data is necessary
    |

    | 3 | Authentication | Data transmission or reception happens between various
    IoT devices to enhance functionality. Hence a proper authentication mechanism
    is needed before setting up the communication. |

    | 4 | Power Efficient | Many small-range IoT devices lack the resources to maintain
    the power for computation and working. |'
