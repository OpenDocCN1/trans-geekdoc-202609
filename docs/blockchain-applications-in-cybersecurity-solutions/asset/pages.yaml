    # Chain Validation


    Blockchain is popular because of the high security provided. The integrity of
    the data in the Blockchain is maintained high using the process of mining. Mining
    the chain includes adding a new block to the chain by recalculating the hashes
    of the existing blocks and checking for the validity of the newly calculated hash
    value with the previous existing hash values. If there is any discrepancy in the
    hash values, that can be identified easily using the process of mining. The process
    of identifying the modified/tampered block can be done in two ways. One, using
    the present block hash, by comparing the present block hash with the recently
    computed present block hash. If these two values are equal, then the data is not
    modified/tampered with. Else the data is tampered with. Two, using the previous
    block hash, by comparing the previous hash of the present block with the computed
    hash of the previous block. Similarly, if these two hash values are the same,
    then there is no modification; else, the data is tampered with. The process of
    chain validation is represented in Figs. (9 and 10) as follows.


    ![](img/1b14bb2748aa86be47fb2952ff28da51_126_0.png)


    Fig. (9). Validation using Present Block Hash.'
