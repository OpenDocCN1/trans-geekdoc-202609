  md: 'PirlGuard was created to protect against 51 percent exploitation. It works
    in a similar fashion as compared to the Penalty System and dPoW. As a result,
    attackers face a penalty. Master nodes are involved in notarization. As a centralised
    technique, the master nodes amplify it. This security method is solely dependent
    on only the Ethash algorithm. PirlGuard mitigates the 51% attack to approximately
    0.03%. As a result, the penalty mechanism and the master node feature are both
    low risks.


    ChainLocks is a Dash-specific security solution that tries to protect users from
    a 51 percent assault. Dash, with only 4100 master nodes, is an ideal target for
    a 51 percent assault because of its limited hashing power [23]. The 51 percent
    attack against low hashing currencies is highly likely to be carried out by simply
    renting the necessary hashing power [24]. As a result, ChainLocks'' security mechanisms
    are insufficient to prevent the double-spending attack. The double-spending attack
    can be carried out by attackers with less than 51 percent hashing power because
    just one confirmation is required to publish a block which makes the Dash blockchain
    more susceptible. As a result, the level of risk is considered to be high.


    Merged mining is a technology that allows several coins to be mined concurrently
    [25]. Merged mining is not a safe method of mining, but it can help to mitigate
    the 51 percent attack when used. This strategy combines the hashing power of two
    crypto-coins, increasing the cost of the attack. This method has the potential
    to greatly boost low-quality coins. The main constraint of this method is that
    the combined crypto-coins must be on the same consensus. Another problem is that
    if two crypto-coins with low hashing power collide, they can still be attacked
    if the attacker has enough hashing power. As a result, merged mining is simply
    a method of increasing the attacking cost by combining hashing power. As a result,
    it does not give a practical solution, and the risk level is judged to be significant.


    # Defense Mechanism Mining Pool Attacks


    # Countermeasures against Selfish Mining


    Researchers have carried out research beforehand and proposed numerous viable
    solutions to tackle the problem of selfish mining [26 - 29]. Solat and Potop-Butucaru
    [30] support block ''lifes,'' which prohibits greedy minors from retaining blocks.
    The network will refuse the estimated lifespan of a block (measured by honest
    miners). Heilman [27] is hindering the profitability of greedy miners by adopting
    a “Freshness Preferred” defense strategy. Heilman [27] adds unforgivable timelines
    to block, and in comparison to older blocks, it prefers more recent timestamps
    in blocks, in addition to the prior works by Eyal and Sirer [29]. The author shows
    through his research that miners who store their blocks for a long time have lower
    motivation than opportunistic miners.'
