  md: '# Types of Blockchain


    Blockchains can be classified as Public Blockchain, Consortium Blockchain, or
    Private Blockchain based on how clients participate, and they can also be classified
    as primary chains or side chains based on the relationship of chains. In addition,
    a few blockchains can shape a system. The system''s chains are linked together
    to form the Interchain.


    # Open


    Public blockchains have ledgers accessible to anyone on the internet, and the
    blockchain can be checked and modified by everyone. The pace is slower in public
    open, read/write access to the database, security is proof-of-work / proof-stake,
    identity is anonymous or pseudonymous, and assets are native assets. So, *et al.*,
    Bitcoin, Dash, Thatum, and Factom.


    # Private


    All access to an agency is kept centralized. Private blockchains only allow unique
    individuals inside the company to validate and attach transaction blocks, but
    basically, anyone on the internet is able to access them. Entry to the database
    is allowed by read and/or write. Velocity is higher. Safety participants are pre-approved.
    All properties are established identities and properties only, *et al.*, Blockstack
    Multichain.


    # Smart Contracts


    A Smart Contract is essentially a computer protocol that enforces negotiations
    between the two exchanging parties. This forms, more precisely, a contractual
    agreement between two parties. This immediately verifies the deal, which meets
    the conditions agreed. Ethereum is the largest decentralized network producing
    infinite Smart Contracts using a command line. When an application incorporates
    the following components would be called Decentralized: The program must be completely
    open-source, run autonomously and without managing any of its tokens. To prevent
    any central failure points, the application data and operating records must be
    stored cryptographically in a transparent, decentralized blockchain.


    Clearly, the program must use a proper cryptographic token to access the code.
    The application will produce tokens based on a standard cryptographic algorithm,
    which serves as evidence of the value nodes'' contribution to the application.


    Blockchain transactions are executed by smart contracts, which are computer programs.
    Solidity is used to write executable code for smart contracts. There are'
