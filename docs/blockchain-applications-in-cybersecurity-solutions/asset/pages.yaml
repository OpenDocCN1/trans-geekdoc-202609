- pgno: 162
  md: 'variables, functions, and structures in Solidity, a statically typed language.
    Codes are based on agreements between two parties involved in the transaction.
    When a transaction is completed, compiled contracts are deployed into an environment
    that is capable of running them. As an example, for the Ethereum blockchain, smart
    contracts are deployed and executed in the Ethereum virtual machine (EVM) [20].
    The code in a smart contract is publicly available on the ledger in a blockchain,
    so a new node that joins the blockchain later will receive a copy of the smart
    contract. There is no centralized authority controlling smart contracts; instead,
    they are distributed across multiple nodes on the network. It ensures the trust
    and anonymity of any smart contract-triggered operations. Before a smart contract
    executes a transaction, a transaction fee is required, and, in the Ethereum case,
    the fee is paid in ether, also known as gas. The transaction fee is higher for
    smart contracts with more complex logic.


    # Interplanetary File System


    Interplanetary file system is a distributed file system where we can store any
    computer file or data for later access. Unlike a file system on a computer, IPFS
    divides a file into multiple chunks of data and distributes the chunks across
    different nodes on IPFS. While other file systems use a location-based address
    to look up a file, IPFS uses a content-based address where a file’s address is
    based on the hash of the file’s content. A single unit of data on IPFS is a block.
    IPFS constructs a directed acyclic graph to link all the blocks in a file, which
    facilitates data retrieval. IPFS maintains a distributed hash table to know where
    to find the data or the path which leads closer to the data [21].


    Data downloaded from IPFS can be stored on the node and accessed as a new data
    provider. This way, the node can send the data to its nearby computer when it
    requests the data, like other IPFS nodes.


    # Distributed Hash Table


    Distributed hash tables allow IPFS to locate a peer node with certain data or
    to identify a path leading to that node by storing key-value mappings. IPFS nodes
    maintain their own distributed hash tables and use these when requesting a key.
    Keys are individual identifiers for data, Interplanetary Name System (IPNS) keys,
    or peer IDs.


    # RELATED WORK


    In order to protect the privacy of users’ data on the network, Rahulamathan et
    al. (2017) proposed an attribute-based encryption method. The data owner creates
    user groups and assigns an access policy that consists of certain user attributes
    to'
