    [17].


    ![](img/1b14bb2748aa86be47fb2952ff28da51_80_0.png)


    Fig. (1). Blockchain Security Issues.


    # Network Security


    An Eclipse attack, which occurs when an adversary controls parts of the network
    and logically splits the network to raise the sync delay, is a basic denial of
    service attack intended to promote selfish mining and double-spending. In an Eclipse
    attack, the attacker selects information and hides it from one or more participants,
    possibly delaying the delivery of the block to the node [18].


    # Privacy


    Data protection and secrecy are crucial components of blockchain transactions
    because each node can access the data of another node, and anyone looking at the
    blockchain can see all transactions. Various studies have offered solutions to
    this challenge; however, these solutions are only useful for a limited number
    of applications and do not solve all problems. Owing to the huge amount of data
    transmitted, attackers can target network communications, including sensitive
    data, with attacks, such as Maninthemiddle (MitM) and DoS / DDoS. Among the'
