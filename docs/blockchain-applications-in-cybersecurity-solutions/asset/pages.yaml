  md: '# e. Mining Pool Attacks


    Individual miners can no longer profit from large cryptocurrencies, such as bitcoin,
    so miners pool their processing resources to form mining pools. This allows them
    to mine more blocks and distribute the prize evenly. BTC.com, AntPool and ViaBTC
    are currently the top three Bitcoin mining pools. According to Blockchain.com,
    they account for over 52% of the total hash rate of the Bitcoin network. Mining
    pools are a tempting target. By exploiting vulnerabilities in the blockchain consensus
    system, Malicious miners attempt to gain internal and external control of mining
    pools. The following are the most frequent mining pool assaults.


    # Selfish Mining


    Malicious miners attempt to raise their part of the reward by not delivering the
    blocks to the network for a set length of time and then releasing several blocks
    at once, resulting in other miners losing their blocks. Randomly assigning miners
    to different branches of the pool, preferring a block with the latest timestamp,
    and creating blocks within the maximum time allowed are all possible countermeasures.
    Block holding is another name for this type of attack.


    Miners lost 300 BTC in 2014 due to a selfish mining assault on the Eligius pool.
    Selfish mining has a high success rate and may occur with any coin. Only trustworthy
    miners will be registered, and the existing Bitcoin protocol will be modified
    to hide the distinction between partial and complete proof of work are two possible
    preventative methods against selfish mining [39].


    # Fork After Withholding


    FAW (Fork After Hold) is a form of selfish kicking that seems more profitable
    for attackers. During a FAW attack, a hostile miner conceals the winning block
    and steals it, depending on the situation, either rejects it or publishes it later,
    creating a fork. A team of researchers led by Ugin Kwon has elucidated the concept
    of this attack in detail [39].


