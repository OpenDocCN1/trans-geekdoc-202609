    # BACKGROUND AND RELATED WORK


    # Background of Blockchain Technology


    Blockchain is a decentralized, public ledger that tracks online transactions.
    A decentralized blockchain ledger maintains a shared record of all the transactions
    distributed over a large user network. This is a completely decentralized network,
    which does not require any intermediary mechanism for exchanging services. A blockchain
    is a series of data blocks, in which a small patch of user-made transactions is
    stored in each row. Both these data blocks are clustered together electronically,
    using a top-tier level of cryptography [9]. Both of the blocks together then form
    a permanent and malicious public record of each and every transaction that occurs
    on the network. The user is connected to a blockchain in such a way that his /
    her data is made accessible without revealing their identity to any other user
    in that blockchain. Blockchain offers users complete transparency to make things
    simpler [10]. Through encrypting and validating, Blockchain guarantees the confidentiality,
    authenticity and privacy of transactions. By adding a new block to a blockchain,
    a cryptographic hash generated from the previous block’s content is used to link
    it to the preceding block. It means the chain never breaks, and each block is
    registered forever [11]. Consequently, this is deliberately difficult to alter
    past blockchain transactions, as all subsequent blocks must be modified first.
    Blockchain databases are made up of many nodes, and decentralized. Administration
    includes the node: all nodes review recent'
