  md: '# Restrictions on New Nodes:


    By increasing the cost or difficulty of construction of new nodes inside a network,
    the blockchain architect can raise the standard for malicious actors to saturate
    the network with malicious nodes. This strategy frequently entails restricting
    the number of nodes that can connect to a single IP address or device. This precautionary
    measure can be evaded by an attacker building a botnet comprised of devices with
    unique IP addresses.


    # Countermeasures against Long-Range Attacks on Proof of Stake Networks


    A Long-Range attack is one in which the adversary returns to the genesis block
    and splits the network. The new branch is filled with people with a distinct history
    from the main chain. The attack is successful when the adversary''s branch grows
    longer than the main chain and overtakes it. Longest chain rule, Moving Checkpoints,
    Key-evolving cryptography, context-aware transactions and plenitude rule are countermeasures
    against long-range attacks [10].


    # Defence Mechanism against User Wallet Attacks


    # Countermeasures against Phishing


