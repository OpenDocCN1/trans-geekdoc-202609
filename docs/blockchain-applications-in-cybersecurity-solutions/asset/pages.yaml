    measures also hold products for time-jacking attacks.


    # Countermeasures against Routing Attacks


    There are numerous strategies for defending against routing attacks [6]. Multi-homed
    bitcoin is recommended since it makes it more difficult to conduct attacks when
    there are more connections. Attackers must either know both IP addresses or abort
    all cryptographic communication, which is easily discovered, in order to interrupt
    links between nodes. In the second approach, during the attack, the round-trip
    time (RTT) to hijacked destinations increases. A node could notice abrupt changes
    in the RTT towards its peers. As a protective strategy, the node will make random
    connections as a result of the outlier identification. Using another approach,
    UDP packets between nodes can also be updated regularly to identify if traffic
    has been withdrawn in part and in case it is connected to the network.


    # Countermeasures against Sybil Attacks


    The development of anti-Sybil methods placed a greater emphasis on the environment
    for the application. Blockchain-based cyber threat intelligence (CTI)'
