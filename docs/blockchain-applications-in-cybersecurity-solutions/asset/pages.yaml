    # How Smart Contracts in Multichain Redefine Value Exchange


    Smart Contracts [14] are self-executing code on a blockchain that automatically
    implements the conditions of an agreement between parties, thereby expediting
    procedures that are presently dispersed across multiple databases and ERP systems.


    They are lines of software programmes, not contracts in the legal sense, that
    extend the utility of blockchains beyond just keeping track of financial transaction
    entries to automatically enforcing multiparty agreements. This is accomplished
    through Consensus protocols, which allow users to agree on the highlighted lines
    of action in response to an event.


    # *The following are some of the advantages of smart contracts:*


    +   - **Speed:** As smart contracts automate manual procedures, they increase
    the speed with which various business processes are completed.

    +   - **Accuracy:** They assist in the automation of manual developments as well
    as the reduction of errors.

    +   - **Lower Execution Risk:** Decentralized and immutable processes eliminate
    the possibility of manipulation, and the possibility of erroneous execution is
    too remote.

    +   - **Lower cost:** When compared to traditional business procedures, contract
    implementation costs are lower since there is less human participation and fewer
    intermediaries.

    +   - **New business models:** The development of novel business models, ranging
    from trustworthy peer-to-peer sharing to trading in a safe environment, is aided
    by new means of transactions and contract execution.

    +   - **Avoiding the use of third-party intermediaries:** Smart contracts eliminate
    or reduce the use of third-party intermediaries and provide an alternative technological
    trust factor.


    Smart contracts may be used for a variety of purposes, from determining loan eligibility
    to completing trade agreements and transfer agreements, thanks to the'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'aforementioned advantages. Due to the need to maintain separate databases,
    all of these sorts of smart contracts were previously unfeasible. All of the parties
    involved can now validate the results in real-time, without the need for a third
    party to intervene.


    **Smart contracts** make the most sense when a network of participants conducts
    frequent transactions and the counterparties undertake manual or redundant processes
    or duties for each transaction. Smart contracts, in a nutshell, automate the exchange
    of values between parties without the need for an intermediary or human intervention
    in the event of a contract.


    Agents were heavily reliant on **traditional contracts** and agreements to complete
    paperwork and other legal requirements. The primary trust criteria for transferring
    money or other valuable assets were agents and go-betweens. Smart contracts, which
    are coded into the system to automatically execute activities based on a predetermined
    set of discussions between the parties, have replaced agents with the help of
    Blockchain. The trust is built up through the use of secure blockchain technology.
    The expense of managing the flow of value is dramatically reduced, as is the time
    it takes to complete the agreement. Similarly, when ''value'' is exchanged using
    the Blockchain''s distributed ledger technology, new blockchain chains are formed
    and kept permanently without the possibility of manipulation.


    # *Some of the example that shows the value exchanges due to Smart contracts are
    given below:*


    # a). Freelance Work Exchanges


    When a customer decides to increase the scope of a project or delays payment for
    an unknown reason, many freelancers are helpless. Companies who hire freelancers,
    on the other hand, may feel misled if they realise that someone''s professional
    experience is false and that they are unable to execute the job for which they
    were engaged. Smart contracts encourage more open and honest communication between
    freelancers and clients, resulting in a better experience for both.


    The contract''s conditions include the project''s scope, deadlines, and payment
    arrangements. At the outset of an assignment, payments are kept in escrow in a
    smart contract, to be released upon successful completion of work milestones.
    This helps freelancers prevent the scope creeps, ensuring that any new job does
    not hold up payments, and enabling them to get paid pretty for additional work.'
