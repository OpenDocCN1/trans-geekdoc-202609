  md: '# Preserving the Privacy of Wearable IoT Device Data Using Blockchain


    K.K. Sowjanya¹,*, K.P.B. Madavi² and G. Thahniyath³


    ¹ CMR Institute of Technology, Bangalore, India


    ² GITAM University, Bangalore, India


    ³ Dayananda Sagar University, Bangalore, India


    Abstract: Personal healthcare has become the most important part of present human
    life due to the COVID-19 pandemic. The awareness of one’s health is made easily
    available by adopting IoT wearable devices like Fitbit, smart watches, oximeters,
    etc. All these devices store sensitive information like a heartbeat, BP, distance
    traveled, calories burnt, stress levels, location details, etc., and are stored
    in third-party data servers. These servers are vulnerable to illegitimate users
    and also have a single point of failure. The personal data of the individuals
    should be protected along with its integrity. At the same time, the data stored
    in the servers should be decentralized to overcome the problem of a single point
    of attack. The objective of this article is to provide a framework that uses SHA-56
    for generating the hash code and Blockchain technology to store the data. Thus,
    providing privacy, security, and integrity for the data.


    Keywords: Blockchain, Fitbit, Fitbit data, Encryption, Hashing, IoT, Mining, Privacy,
    Security, Wearable devices.


    # INTRODUCTION


    Smart homes, smart cities, and smart devices are driving the future generation
    with the help of IoT. IoT has gained so much popularity because of its heterogeneous
    forms and heterogeneous applications. It is changing our normal world into a digital
    world where interconnected devices communicate with each other through a network
    without human interaction [1]. Adopting this Internet of Things has introduced
    many technological advancements such as smart security home systems, which provide
    security alerts for the houses; smart agriculture systems, which provide information
    about the land, soil, etc.; and smart health care systems, which provide the health
    status of individuals [2]. Since it can be'
  merge: -1
  img_proc: true
