  md: '![](img/1b14bb2748aa86be47fb2952ff28da51_181_0.png)


    # R. Agrawal


    Dr Rashmi Agrawal is PhD and UGC-NET qualified with 22 years of experience in
    teaching and research, working as Professor in Department of Computer Applications,
    Manav Rachna International Institute of Research and Studies, Faridabad, India.
    She is life member of Computer Society of India and senior member of IEEE, She
    is book series editor of many series with reputed publishers like Wiley and CRC
    press. She has authored/ co-authored 80+ research papers in peer reviewed national/international
    journals and conferences which are SCI/SCIE/ESCI/SCOPUS indexed. She has also
    edited/authored books with national/international publishers (Springer, Elsevier,
    IGI Global, Apple Academic Press, and CRC Press) and contributed chapters in books.


    ![](img/1b14bb2748aa86be47fb2952ff28da51_181_1.png)


    # N. Gupta


    Dr. Neha Gupta has done her PhD from Manav Rachna International University and
    has total of 17+ year of experience in teaching and research. She is a Life Member
    of ACM CSTA, Tech Republic and Professional Member of IEEE. She has authored and
    coauthored 80 research papers in SCI/SCOPUS/Peer Reviewed Journals (Scopus indexed)
    and IEEE/IET Conference proceedings in areas of Web Content Mining, Mobile Computing,
    and Cloud Computing. She has published books with publishers like Springer, Taylor
    & Francis, IGI Global & Pacific Book International and has also authored book
    chapters with Elsevier, Springer, CRC Press and IGI global USA. She is a technical
    programme committee (TPC) member in various conferences across globe.'
