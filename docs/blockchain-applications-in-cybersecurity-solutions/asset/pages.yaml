- pgno: 23
  md: '![](img/1b14bb2748aa86be47fb2952ff28da51_23_0.png)


    The pre-defined governance rules of the network oversee how the nodes in the P2P
    network cooperate with one another to validate the transaction. These rules elucidate


    +   • The criteria based on which the transaction is said to be valid.

    +   • The cost incurred during the transaction.

    +   • Validating the transaction using game theory and cryptographic techniques.

    +   • Procedures to update the predefined rules as and when necessary.


    Consider a bitcoin scenario; the financial transactions are validated through
    a majority vote with the help of bitcoin protocols instead of validating manually
    through ledgers stored in servers in a traditional banking application.


    # CONSENSUS PROTOCOL


    A consensus mechanism in a blockchain is a robust mechanism to achieve common
    agreement on a specific state among the nodes in a P2P network. This mechanism
    involves a set of predefined rules for synchronizing the nodes during transactions
    that are trusted and recorded in the blockchain. The purpose of these rules is
    to assure the validity and legitimacy of the transactions. Some of the widely
    used consensus mechanisms [7] viz., PoW, PoS, DPoS, pBFT, PoC, PoA, PoR, PoI,
    PoB, PoET, PoId and PoAu are described in this section.'
