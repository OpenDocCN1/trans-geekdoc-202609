    \n```\n```python\ndef add_new_block(self, block, block_proof):\n    prev_hash\
    \ = self.recent_block.hash\n    if prev_hash!= block.prev_hash:\n        return\
    \ False\n    if not self.is_valid_proof(block, block_proof):\n        return False\n\
    \    block.hash = block_proof\n    self.chain.append(block)\n    return True\n\
