    For example, due to the popularity and capital tied to its system, blockchain-based
    cryptocurrencies are exposed to multiple activities that are fraudulent. Mt. Gox,
    a Tokyo-based Bitcoin exchange in Japan, was hacked by two malicious attackers
    who stole $ 460 million in bitcoins [13]. The hackers collected data from the
    Bitcoin blockchain and manipulated counterfeiting transactions that led to a surge
    in the market price. As a result of such activities, Mt. Gox suffered severe losses
    and, in the end, went ruined. Furthermore, the Bitcoin blockchain is overloaded
    with fraudulent or spam transactions, which causes legitimate transactions to
    be delayed. In 2017, Bitcoin storage pools were swamped by unethical transactions,
    which leads locks and delays in transaction verification, increasing the Bitcoin
    mining fee [14]. Furthermore, in June 2016, an unknown attacker managed to withdraw
    US $ 50 million from “The DAO”, a decentralized autonomous organization that works
    on smart contracts based on blockchain or pre-programmed rules that govern the
    organization [15]. Bitfinex was temporarily blocked in June 2017 due to a distributed
    denial of service (DDoS) attack. Several Bitcoin and Ethereum (a Blockchain-based
    distributed computing platform) exchanges have been subjected to DDoS and DNS
    attacks on a regular basis, causing service outages for consumers.


    A potential vulnerability in the Blockchain system could be launched in unanticipated
    attacks, jeopardising the system''s overall security and privacy. As a result,
    the first step is to investigate the weaknesses in the technology that led to
    unethical activities. Furthermore, this research examines counterfeit solutions
    from a systemic perspective.


    # BLOCKCHAIN SECURITY ISSUES


    The following are five of the most serious security concerns surrounding blockchain
    technology, as shown in Fig. (1).


    # Transaction Malleability


    Due to the popularity and wealth invested in its system, blockchain-based cryptocurrencies
    are vulnerable to a variety of fraudulent operations. Mt. Gox, a Tokyo-based Bitcoin
    exchange, has been hacked by two people [16]. Transaction malleability is a form
    of attack that allows a user to alter the identification of a Bitcoin transaction
    prior to it being confirmed on the cryptocurrency network. This modification allows
    the individual to pretend that no transaction occurred. It'
  merge: -1
