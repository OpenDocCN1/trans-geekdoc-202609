  md: 'each group. A user must possess all the specified attributes that satisfy the
    policy to access the data [22]. This encryption technology does not look at users’
    identities and does not work in a decentralized network as it requires a centralized
    access policy server. With smart contracts, this problem can be solved by using
    a decentralized network and customizing their implementation logic for user verification
    with every transaction.


    The usage of smart contracts has been previously proposed for access control between
    smart devices in the Internet of Things (IoT). Song et al. (2019) developed an
    attribute-based access control scheme that checks device attribute information
    and decides whether to allow a device to join an IoT network. This scheme uses
    blockchain and smart contracts to store and manage access control policies [23].
    In addition, Nakamura et al. (2020) [24] proposed a capability-based access control
    using smart contracts in the IoT. In this scheme, the author suggests having smart
    contracts manage capability tokens. Every capability or action has a token, and
    smart contracts that grant or deny the access requestor based on the token ownership
    and validation.


    The paper by Shen et al. (2019) [25] analyzes the I/O performance of IPFS and
    notices a bottleneck in IPFS data retrieval because of the resolving and downloading
    operations. When a node in IPFS receives a data retrieval request, if the data
    is not local on the node, it needs to perform a lookup to find the storage node
    of the data. If the data size to download is larger than 256KB, IPFS will break
    it into multiple blocks of 256KB each. When all the blocks arrive at the requesting
    node, they will be re-aggregated to a file of the original size, so the block
    size also affects the I/O performance of IPFS [26].


