  md: '# INTRODUCTION


    Blockchain technology is an open-source, decentralized ledger, based on a peer-to-peer
    distributed network that records immutable and encrypted transactions which are
    verified between two entities without the involvement of a third party. Blockchain
    technology is secured as it is based on the concept of cryptography and peer-to-peer
    networks or distributed networks. The use of cryptography in blockchain technology
    enables to establish trust between entities of a network via digital signatures,
    enables integrity and immutability via hash functions and helps in transactions
    that are publicly verified and un-altered. On the other hand, the peer-to-peer
    network in blockchain eliminates the issue of single-point-of-failure and single
    point-of-trust, and allows for transaction ledger verification without the need
    for a centralized authority [1].


    Apart from this, blockchain also supports other significant features like distributed
    ledger, consensus, availability and smart contracts etc., as shown in Table 1.
    Now, Blockchain technology is accustomed by the world and is being investigated
    in new and forthcoming novel applications [2]. Due to its vast application possibilities,
    blockchain has sparked a lot of curiosity among academics and industry. Blockchain
    technology is being employed in different domains like cryptocurrencies [5], Ethereum-based
    smart contract platforms and ‘Decentralized Autonomous Organizations (DAOs)’ like
    Dash and Bitshares [3, 4, 6], health care [7], Internet of Things [8, 9], financial
    systems [10], Vehicular Ad-hoc Networks (VANET), and edge computing [11, 12] and
    many more, etc..


    Table 1. Features of Blockchain.


    | Key Features | Description |

    |---|---|

    | Immutability | Allows to store transactions permanently and nobody can modify
    transactions once entered into the system. |

    | Transparency | All Blockchain users have access to each public address''s transactions,
    which are safe and secure. |

    | Peer-to-peer network | Allows the execution and verification of transactions
    without the use of central authority or third party |

    | Consensus | A fault-tolerant methodology and method of establishing consensus
    across all Blockchain participants |

    | Smart contract | Self – executing contract allow the transaction without third
    parties |

    | Distributed ledger | A decentralized database that is accessible to multiple
    users to create and update single, trusted transactions across multiple locations
    |

    | Anonymity | The ability of node in the network to perform transaction or exchange
    data without revealing its identity. |'
  merge: -1
  img_proc: true
