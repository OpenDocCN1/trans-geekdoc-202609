    # INTRODUCTION TO BLOCKCHAIN


    Blockchain is a P2P (peer-to-peer) secure distributed network that maintains the
    transaction records of the network and exchange of digital information without
    a third-party intervention or a central server, or a trusted agent. It is a database
    structure that holds the information in chunks. The block of data is chained to
    the previous block of data with a given time stamp. A block is a set of transactions
    that are put on the chain at the same time after it has been verified by the standard
    users in the network. A block mainly consists of the following:


    +   - The reference to the previous block

    +   - The Proof of Work: nonce value (a random value generated only once at a
    particular time)

    +   - The time-stamp

    +   - The Merkle tree root for the transactions: Each of the transactions is a
    leaf node in the tree. The transaction is each hashed, combined, and rehashed
    till all the transactions are combined in one root.


    Each of the nodes has a duplicated copy of the block. Hence Blockchain is a duplicated
    ledger of transactions that have been agreed upon by the standard nodes and distributed
    across nodes.


    There are two types of Blockchain [6] user’s public key is permissionless e.g.
    (Bitcoin or Ethereum), which is public, and only one can join the network, and
    Permissioned Blockchain (Hyperledger Project by The Linux Foundation) [7]. Permissioned
    Blockchain, where the consensus of valid peers about the transaction is required
    and is gaining a lot of interest in applications other than financial use cases.


    # Characteristics of the Blockchain


    *Immutability of data:* Once the Blockchain is formed, it is difficult to tamper
    with the block.


    *Transparency:* All transactions in the Blockchain can be viewed by any participant.'
  merge: -1
  img_proc: true
