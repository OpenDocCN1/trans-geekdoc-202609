  md: '# Countermeasures against fork after withholding (FAW) Attack-


    To solve the FAW attack problem, Kwon et al. [31] time-controlled beacons are
    introduced by the pool operators assigned to miners. In response to each assignment,
    the miners find and determine how much POW they have and send the answer, together
    with the beacon value, to the pool operator. After a few seconds, the beacon value
    is updated to find a rogue miner if the valid solution is retained and later propagated
    across the web. However, the authors also observed that this technique might not
    be practicable in some scenarios, concluding that research and academic communities
    are still grappling with the issue of FAW attacks.


    Chang and Park [32] proposed Silent Timestamping as a defense mechanism against
    the FAW attack that ensures share ordering and essentially negates the FAW''s
    incentive effects. The behaviour of the ideal attacker against silent timestamping
    was studied, and it was discovered that the best FAW attacker approach is forced
    to decrease to ethical mining. Silent Timestamping removes the requirement for
    networking and does not require any modifications to the miner''s code. As a result,
    silent timestamping provides a feasible, backward-compatible, and effective protection
    option. Table 1 summarizes various blockchain attack surfaces and their countermeasures.


