  md: '**Table 1. Characteristics of the blockchain with associated consequences.**


    | Properties | Positive | Negative |

    |---|---|---|

    | Immutable | Internet of Value, Traceable | Inflexible |

    | Transparent | Efficiency of data retrieval | Privacy, Information Leakage |

    | Programmable | Execution in a deterministic manner | Unchangeable source code
    |

    | Decentralized | Disintermediate | Disintermediate |

    | Consensus | Minimize necessary trust | Energy Consumption, Centralized power
    |

    | Distributed Trust | Establish | No personal relationship |


    Actual implementation of blockchain needs to be integrated with complicated social,
    economic, legislative, organizational and physical systems [25]. This integration
    poses plethora of problems, few of which are tabulated in Table 2.


    **Table 2. Problems faced while implementing blockchain.**


    | Challenge | Description |

    |---|---|

    | Throughput | Number of transactions being processed within a specific period
    of time. |

    | Latency | Amount of time before a transaction is processed. |

    | Size and bandwidth | The blockchain grows over time as new blocks are constantly
    added. This also consumes considerable bandwidth for downloading data. |

    | Wasted resources | Blockchain-intrinsic inefficiencies such as redundant data
    transmission, storage and energy-consuming consensus protocols. |

    | Usability | Users interactions with Blockchain applications. |

    | Versioning, hard forks, multiple chains | A multitude of Blockchain versions
    and forks facilitate attacks and hamper cross-transactions. |

    | Privacy | The right to control access to (personal) information as well as to
    delete it. |

    | Evidentiary quality, Trustworthiness of records | Questions pertaining to the
    truthfulness of content on the Blockchain. |

    | Lack of Standards | No standards have emerged yet for access rights, data structures
    and allowable transactions. |

    | Regulations | Legislation is lagging behind technological development. |

    | Shared governance | Blockchain solution call for new structures that might disrupt
    existing governance. |

    | Viable ecosystem | The attraction of a critical mass of adopters. |

    | Attack Surface | The Blockchain is a target of potential attacks. |'
