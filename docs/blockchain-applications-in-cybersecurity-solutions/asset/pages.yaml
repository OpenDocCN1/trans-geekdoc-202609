  md: 'used in day-to-day activities, the usage of these IoT devices is enormous in
    various fields like health care, industries, agriculture, cities, etc. The usage
    statistics of IoT devices in various fields in 2020 are represented in Fig. (1)
    as follows:


    ![](img/1b14bb2748aa86be47fb2952ff28da51_113_0.png)


    Fig. (1). Usage of IoT Devices in Various Sectors [3].


    # IOT ARCHITECTURE


    Fig. (2) depicts the IoT''s core three-layer architectural structure in terms
    of the devices and technology that each layer encompasses. Each layer in the IoT
    is characterized by the functions it performs and the devices it employs. Many
