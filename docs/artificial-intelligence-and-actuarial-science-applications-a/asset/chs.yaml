  \ 基于用量的汽车保险中的车载信息系统\n\nVinita Choudhary, Neha Kamboj, and Sonal Trivedi\n\nDOI:\
  \ [10.1201/9781003472551-16](https://doi.org/10.1201/9781003472551-16)\n\n## 13.1\
  \ 引言\n\n### 13.1.1 远程信息在车险中的重要性\n\n保险行业已进入成熟生命周期阶段，至少在车险领域是如此。由于激烈的竞争和产品独特性的缺乏，市场上大多数老牌和现有的保险业务正面临收入的大幅下降\
  \ (Pierce 2009)）。这对企业的生存构成了重大风险，特别是在车险是其产品线中最核心组成部分的欠发达地区 (Pandiangan et al. 2022)）。\n\
  \n保险业务收入下降主要有两个原因。首先，这些交易市场上的价格很可能会下降 (Nuti 2023)）。其次，价格没有反映个人风险。例如，每年行驶 45,000\
  \ 公里的人与每年行驶里程少于 15,000 公里的人支付金额是相同的 (Hassan et al. 2023)）。通过提供新的基于用量的保险（UBI）保单，这使得旧式保险保单发生了根本性的变化。\n\
  \nUBI 基于来自远程信息设备的广泛信息，包括里程、速度、位置、时间、总行程持续时间和 G 重力。企业可以通过监控驾驶员的行为来获得竞争优势，因为这些数据具有预测潜力\
  \ (Chaba 2021；McDonnell et al. 2021)。由于 UBI 产品在某些地区仍然相对新颖，保险公司需要努力提高此类市场对 UBI 的接受度。与发达市场相比，东欧和东南欧等新兴市场的\
  \ UBI 活动仍局限在适度范围内，但兴趣正在增长 (Che et al. 2022; Soleymanian et al. 2019)。\n\n2022 年，全球汽车远程信息市场价值为\
  \ 728. 亿美元。预计该市场将从 2023 年的 853. 亿美元以 18.5% 的复合年增长率（CAGR）增长到 2030 年的 2807 亿美元（Astute\
  \ Analytica 报告，2023 年 5 月 26 日）。车辆远程信息技术的目标是通过收集、存储和分析数据来增强驾驶乐趣和驾驶安全。该系统集成了无线远程信息设备、GPS\
  \ 系统、车载车辆诊断和其他设备，用于捕捉和发送车辆信息，包括位置、速度和车辆维护 (Che et al. 2022; Ziakopoulos et al. 2022)。这些车载远程信息的优势正在促进市场扩张。这些数据来自\
  \ Fortune Business Insights 一项名为“车辆远程信息市场，2023–2030”的研究。根据这些数据，保险公司将从这些发展市场中获益。\n\
  \n因此，除了发达市场外，亚太等新兴市场也需要纳入当前的讨论和观点中。\n\n### 13.1.2 海量远程信息的重要性\n\n保单持有人的保险费是根据远程信息确定的。保险公司需要更有价值的数据来更好地理解驾驶行为并评估风险\
  \ (Monkiewicz & Śliwiński 2023)。保险公司必须区分这些信息，并确保其 UBI 框架收集了合适的参数。此外，这可能使保险公司能够合理关联定价与风险，从而改进其收费策略\
  \ (Umut 2020)。\n\n保险信息的驱动取决于 GPS 数据的准确性。然而，大量的环境因素（包括空气影响和天空遮挡，为 GPS 数据引入噪声）会导致\
  \ GPS 数据不准确或可靠性降低 (Li et al. 2023)。这可能会使保险公司面临收入损失风险。\n\n此外，对接收到的远程信息进行上下文化是确保数据准确且可靠的重要步骤。“上下文”描述了周围环境，包括事件发生的地点、道路状况、天气以及它们提供的整体风险程度\
  \ (Pandya et al. 2023)。\n\n为了区分这些情况并为保险公司提供更准确的计费信息，必须建立通用的利益指数（UBI）系统 (Verma et\
  \ al. 2021)。\n\n\n\n\n因此，为保险公司提供广泛的数据以扩大其对驾驶行为的理解至关重要。因此，保险公司可以使用上下文数据来更精确地分析驾驶行为，而不仅仅是测量遥测特征（里程、速度、加速度、刹车事件等）。通过利用更精确的数据，可以实现改进的保险成本估计方法，减少因将驾驶员分类为广泛精算类别而导致的费率错误（Quintero\
  \ et al. 2020）。\n\n## 13.1.3 基于遥测的保险下一代解决方案\n\n全球已有许多 UBI 解决方案实施，包括 `AIOI`、`AVIVA`、`Winterthur`、`AXA`、`MAPFRE`\
  \ 和 `RSA Insurance Group`，比较了 24 种主要的 UBI 替代方案。\n\n这些系统的主要缺点倾向于仅根据标准的遥测信息评估驾驶行为。不同\
  \ UBI 方案及其显著特征的摘要请见表 13.1。\n\n表 13.1 全球实施的一些遥测 UBI 解决方案汇总\n\n| 保险公司 | 国家 | UBI 计划名称\
  \ | 保险概念 | 技术平台 | 数据传输 |\n| --- | --- | --- | --- | --- | --- |\n| `AIOI` | 日本 |\
  \ 按行驶距离付费 | 基于里程的车辆保险 | `G-book`（由丰田汽车公司提供的遥测订阅服务） | 移动数据服务 |\n| `Aviva` | 加拿大 |\
  \ Autograph | 保险基于遥测参数，24 小时内有多个风险等级 | 连接到车辆诊断端口的设备 | 通用总线 |\n| `AXA Winterthur`\
  \ | 瑞士 | Crash Recorder | 记录事件 | 事件数据记录器 | 从事件数据记录器检索数据 |\n| `AXA` | 意大利 | Autometrica\
  \ | 基于里程的车辆保险 | 基于 GPS | 移动数据服务 |\n| `Generali` | 意大利 | Protezione Satellitare |\
  \ 保险基于传统的遥测参数 | 基于 GPS | 移动数据服务 |\n| `MAPFRE` | 西班牙 | YCAR | 保险基于遥测参数，24 小时内有多个风险等级\
  \ | 基于 GPS | 移动数据服务 |\n| `RSA Insurance Group` | 英国 | More than Green Wheels Insurance\
  \ | 保险基于遥测参数，24 小时内有多个风险等级 | 连接到车辆诊断端口的设备 | 移动数据服务 |\n\n基于使用的保险行业共有 648 家公司，包括 `Zego`、`Root`、`BitSight`、`Security\
  \ Scorecard` 和 `Getsafe`（[www.tracxn.com](http://www.tracxn.com) 访问于 2023 年 12 月\
  \ 21 日）。此外，印度等地的 UBI 解决方案（Verma et al. 2021）正在考虑多个风险等级。这种策略可能会出现一些问题，导致每个个人价格与风险匹配方式出现偏差。因此，检查某些特定发生的其他情况至关重要。\n\
  \n目前提供的许多 UBI 选项可能导致定价不一致。此外，这些系统大部分无法对数据上下文化，导致缺乏定制。因此，本章旨在调查 `telematics`（遥测）的使用，并讨论\
  \ `telematics` 的优缺点。\n\n## 13.2 研究目标\n\n* 研究 `telematics` 在保险中的作用。\n* 研究 `telematics`\
  \ 的益处。\n* 研究实施 `telematics` 时面临的挑战。\n\n## 13.3 文献综述\n\n`Navneet (2020)`](#ch13.xhtml#r13_18)\
  \ 在《经济时报》发表的一篇文章中解释道，遥技术的实施可以根据驾驶习惯准确制定保费。这意味着更安全的驾驶员可能获得较低的保费。\n\n`Husnjak et al.\
  \ (2014)`](#ch13.xhtml#r13_12) 在其研究《汽车保险中的遥测系统》中强调，目前的计费模型往往忽略里程和道路类型等关键因素。\n\n\
  `Friedman and Canaan (2014)`](#ch13.xhtml#r13_6) 在其报告《克服遥测中的减速带》中讨论了保险公司随着遥测计划的成熟，将如何利用收集的数据准确定价风险。这可能导致更安全的驾驶员从更低的费率中受益。\n\
  \n`Yao (2018)`](#ch13.xhtml#r13_28) 在其研究《保险演变：基于遥测的个人保险》中建议，尽管有微小缺点，遥测提供了一种更公平的保费方法。\n\
  \n`Boucher, Côté, and Guillen (2017)`](#ch13.xhtml#r13_1) 在其研究论文《遥测汽车保险中作为时间和距离的暴露广义加性模型》中提出了一种考虑暴露时间和距离的费率系统。\n\
  \n`Guillen et al. (2019)`](#ch13.xhtml#r13_7) 在其研究《利用遥测改进汽车保险费率制定》中证明了 GPS 收集的数据如何为保险费率制定提供信息，考虑到行驶距离和驾驶习惯等因素。\n\
  \n`Eling and Mirko Kraft (2020)`](#ch13.xhtml#r13_5) 在其研究《遥测对风险可保性的影响》中分析了遥测对保险的影响，包括损失频率和严重性的变化、法律限制以及伦理影响。\n\
  \n`Constantinescu, Stancu, and Panait (2018)`](#ch13.xhtml#r13_4) 在其关于遥测汽车保险的影响的研究中发现，基于遥测的汽车保险合同可能为谨慎驾驶员节省高达\
  \ 25% 的费用。\n\n`Narwani et al. (2020)`](#ch13.xhtml#r13_17) 在其研究《基于监督和无监督学习的遥测数据驾驶模式分类》中提出了一种利用遥测数据和保险索赔历史分类驾驶模式的方法，确保公平评估并奖励驾驶质量。\n\
  \n`Pareek, Pandey, and Priyadarshi (2020)`](#ch13.xhtml#r13_22) 在其研究《推动印度汽车保险数字化转型的新兴技术》中强调了数据驱动决策在保险中的重要性，遥测、机器学习和人工智能等技术实现了更快速高效的决策过程。\n\
  \n`Kumar (2019)`](#ch13.xhtml#r13_13) 在其研究《保险遥测：联网车辆的风险评估》中开发了一个用于费率变量的评分系统，以协助精算师准确计算每辆车辆的风险暴露。\n\
  \n### 13.3.1 印度的基于使用的汽车保险\n\n\n\n\n2024 年，印度的人口已超过 14 亿，成为地球上首个人口最多的国家。世界银行报告，印度道路每年发生超过\
  \ 45 万起事故，导致 15 万人死亡。这表明，尽管印度的汽车保有量仅占全球总数的 1%，但印度道路上的死亡人数却占了全球死亡总人数的 11%。此外，印度汽车保险市场的未投保率非常高；根据我们的计算，该比例在\
  \ 2020 年将接近 60%（《UBI 全球研究第 4 版：连接的汽车保险》(2023)，PTOLEMUS Consulting Group。可用：[https://www.ptolemus.com/]（访问日期：2024\
  \ 年 1 月 6 日））。\n\n因此，为了减少印度道路上的死亡人数，印度当局正在寻找促进保险业创新和提高保险渗透率的方法。他们还在努力提高人们对安全驾驶习惯的意识。\n\
  \n在印度，基于使用的汽车保险（usage-based auto insurance）一直是许多新闻报道的主题，这暗示印度保险监管和发展局（IRDAI）支持基于使用的汽车保险。随着该国顶级保险机构鼓励保险公司，主要的汽车保险提供商可能会在未来开始提供此类计划。尽管一些保险公司已经开始实施此类政策，但重重障碍——例如汽车中广泛使用的追踪/遥测设备——意味着汽车保险领域的所有参与方要完全接受这一理念还需要一段时间时间。\n\
  \nIRDAI 于 2022 年 7 月 5 日发布了一份通告，正式在印度推行基于使用的保险产品。具体而言，印度机险公司现在可以提供 UBI 产品作为基础车险保障的补充，例如“按里程付费”（Pay-As-You-Drive）和“按驾驶习惯付费”（Pay-How-You-Drive）计划。得益于这一通告，客户现在可以通过单一保单拥有多辆汽车。\n\
  \n7 月 21 日，Bajaj Allianz General Insurance 推出了“按需付费”（Pay As You Consume）方案。Edelweiss\
  \ General Insurance 基于手机的 Switch PHYD 计划的第二个版本也刚刚推出。驾驶员会获得一个驾驶评分，根据超速、刹车和分心驾驶等许多因素决定其每月保险费用。人表现得越好，保费就越低。\n\
  \n2022 年 7 月，ICICI Lombard 推了创新的机险保单，旨在彻底变革行业。这些保单利用尖端遥测技术跟踪驾驶行为和行驶里程，为个性化保费铺平了道路。这些产品被称为“按使用付费”和“按方式付费”计划，通过根据个人驾驶习惯定制成本，打破了传统模式。此外，“里程计划”的引入标志着一个重大转变，客户将根据实际使用情况收费，承诺提供更公平、更灵活的保险选择。\n\
  \n### 13.3.2 理解“按里程付费”（PAYD）保险\n\n按里程付费（PAYD）代表了一种现代且具有成本效益的汽车保险方法，其保费由被保险人行驶的公里数决定。由于这种模式的保费反映了车辆的真实使用情况，因此保费随之降低。在强制购买汽车险的印度，对于很少或不开车的人来说，PAYD\
  \ 成为一个理想的选择。通过 PAYD，可以获得更具负担能力且定制化的保险解决方案，而不是为不使用的车辆支付全额费率。\n\n例如，如果驾驶员每年行驶里程不超过\
  \ 3500 公里，他们可以在保费上节省高达 25%。年度里程区间和里程表读数被用于计算这一折扣。\n\nPAYD 保单涵盖了自险（OD）和第三方责任险部分，类似于综合性车险。但真正的区别在于如何利用智能技术跟踪驾驶模式，这使得保险公司能够根据实际行驶的里程提供更低得的费率。\n\
  \n简单来说，PAYD 保险通过为标准综合保单提供灵活且公平的替代方案，让不同驾驶习惯的人更容易获得保险且价格更低廉。\n\n### 13.3.3 解码保险中的遥测技术\n\
  \n“遥测”（telematics）一词源于“电信”（telecommunications）和“信息学”（informatics）的融合，体现了通信与信息技术的整合。在保险行业，遥测的应用产生了“遥测保险”（Telematics\
  \ Insurance），它也有许多其他名称，包括黑盒保险、GPS 汽车险、智能盒保险、按里程付费保险和基于使用的保险（UBI）。遥测保险主要盛于机险领域，它利用电信和信息技术来增强为车辆量身定制的服务。这些服务包括实时导航、道路救援和车辆追踪等。在保险背景下，遥测在汽车领域起着至关重要的作用，有助于保险公司实现精细的客户细分，并采用准确反映个人客户及其车辆风险暴露程度的定价方法。因此，保险遥测代表了风险评估和定价的灵活方法，使保险公司能够为客户提供更个性化且更公平的保险选择。\n\
  \n### 13.3.4 利用遥测技术进行风险评估和定价\n\n通过使用黑盒等工具，遥测技术在现代保险流程中发挥着重要作用，为保险公司提供了大量用于风险评估和报价的数据支持。这些发送给保险提供商的信息包含了广泛的驾驶习惯和趋势。许多元素被仔细记录和检查，包括行驶距离、速度、刹车和加速模式、行程持续时间、停车频率、遵循的路线类型以及综合驾驶能力。丰富的数据使保险公司能够精确地评估与特定驾驶员和车辆相关的风险。在成本方面，保险公司通常在收取设备初始费用后会收取收年度保费。这种保费是变动的；它会根据驾驶员的能力以及从遥测数据中提取的其他相关信息定期调整。至关重要的是，监控系统在整个计划期间都是激活状态的，允许对驾驶行为进行持续评估并根据需要调整费率。通过确保保险定价考虑到实际驾驶行为，这种动态方法帮助客户获得更公平、更个性化的保险解决方案。\n\
  \n## 13.4 遥测技术的优势\n\n参考图 13.1。\n\n![图 13.1 遥测技术的优势。（作者编译。）](img/Fig13_01.jpg)\n\n\
  图 13.1 遥测技术的优势。（作者编译。）\n\n### 13.4.1 对于客户\n\n*   **定制化收费**：对于驾驶安全、遵守所有安全规则、里程低且具有错峰驾驶模式的驾驶员，可能获得较低费率，以促进定价公平性。\n\
  *   **费率透明化**：通过使用`telematics`，保险公司可以为客户保证公平和透明收益，因为保费与车辆的性能和使用情况直接相关。\n*   **更好的车辆安全性**：`black\
  \ box`作为追踪设备使用，在事故或紧急情况下使救援服务找到车辆，并有助于快速追回被盗车辆。\n*   **简化的车队管理**：随着车队减少人力、燃料和维修成本，`telematics`\
  \ 可以成为选择高效路线的有用工具。\n\n\n\n\n- **地理围栏的使用：** 这提升了车辆的安全性，特别是在向所有者传输数据时，如果车辆偏离预设边界，会向所有者更新信息。\n\
  - **更好的车辆安全与服务：** 远程信息设备的使用对于监控车辆维护时间和安全非常有帮助，因为这些设备带有许多额外功能，如速度表信息、发动机状态跟踪和故障可能性；它们还提供了与车辆之间更好的连接性，并能够监控结果，以提高车辆的安全性和使用寿命。\n\
  - **有效的通知和警报：** 远程信息设备提供一系列警报和通知服务，例如碰撞报警、紧急电话和故障救援，这些服务提升了车辆的整体安全性。\n- **基于 GPS\
  \ 的支持：** 驾驶员在旅行期间可以获得保险公司的持续支持，保险公司可以通过主动提醒驾驶员盗窃或事故高风险地区并提供当地修理厂的信息来提供帮助。这都归功于这些设备中安装的云能力。\n\
  \n使用远程信息技术的车队运营商以及驾驶员可以从保险公司提供的便利中获得更多定制化且更安全的保险选择。\n\n### 13.4.2 对于保险公司\n\n- **改进客户细分：**\
  \ 通过帮助保险公司根据风险状况对客户进行精确分类，远程信息技术使他们能够提供更专业的保险产品。\n- **更好的理赔评估与欺诈检测：** 保险公司通过检测欺诈理赔并在评估碰撞期间驾驶数据（如速度和刹车模式）更准确地估计损失，可以更准确地处理理赔。\n\
  - **下一代分析：** 通过使用预测性分析分析收集的数据，保险公司可以利用下一代分析洞察，促进激进的风险缓解和战略决策。\n- **改善客户关系和盈利能力：**\
  \ 远程信息技术驱动的风险细分提高了客户的留存率，促进了更好的关系管理，并为保险公司提供了更深层次的消费者洞察。\n- **简化事故响应：** 远程信息技术使得事故后数据可以自动传输给保险公司。这通过对事故严重程度进行及时评估并启动必要的步骤（如拨打救援电话或租车），加速了理赔流程。\n\
  - **有效的理赔处理：** 通过简化理赔程序，生成的远程信息数据减少了理赔成本，并增强了理赔管理的整体有效性。\n\n### 13.4.3 对于社会\n\n\
  - **专注且专业的驾驶员：** 通过对驾驶方法提供反馈，远程信息技术鼓励并增强了驾驶员的意识，从而培养出更安全的驾驶习惯和能力的全面提升。\n- **促进道路安全：**\
  \ 远程信息技术鼓励了无害且更体贴的驾驶行为，这最终有助于让所有人的道路变得更安全。社区将受益于污染减少和交通拥堵缓解。\n\n## 13.5 远程信息技术带来的挑战\n\
  \n远程信息技术还面临一些挑战，如下：\n\n- **对经验安装的要求：** 在车上安装远程信息设备需要具有经验安装人员的知识和技能，这带来了第一个物流挑战。\n\
  - **里程对保费的影响：** 即使驾驶良好，行驶里程多的人可能仍需支付更高的保险，这可能令人苦恼。\n- **数据可移植性问题：** 当保险商更换时，远程信息数据的传输性可能会出现问题，因为新公司可能不接受旧数据，导致传输程序变得更加困难。\n\
  - **隐私考量：** 远程信息数据交换和使用的隐私担忧引发了关于数据保护和信息共享参数的问题。\n- **成本整合：** 整合远程信息技术需要预付款，在确定保险单价格时必须考虑这些费用，从而影响了可负担性。\n\
  \n## 13.6 未来前景\n\n基于使用的保险（UBI）和远程信息技术在印度拥有极其广阔的未来，近期数据表明保险行业有巨大的增长和技术进步空间。随着全国范围内连接和技术使用的增加，基于远程信息的保险领域预计将快速增长。保险公司现在可以访问来自与车辆连接的日益\
  \ IoT 设备的海量数据，并利用这些数据创建更具动态且个性化的保险产品。得益于远程信息和 UBI，保险公司能够根据独特的驾驶习惯和风险状况提供高度定制的解决方案，从而获得更高的客户满意度。此外，通过使用这些技术，保险公司可以更好地理解和控制风险，从而增强减轻损失的策略。为了促进远程信息和\
  \ UBI 的创新，IRDAI 实施的沙箱法等监管措施允许保险公司在保持合性的同时测试创新的产品和服务。得益于远程信息与区块链、人工智能和机器学习等尖端技术的整合，未来的远程系统将能够执行更复杂的风险评估、欺诈检测和理赔处理。为了刺激创新并扩大市场范围，预计保险公司将与数字公司、汽车制造商和其他参与者合作。总而言之，远程信息技术和\
  \ UBI 通过提供更个性化、数据驱动且有效的满足客户不断变化需求的保险选择，可能会彻底改变印度保险市场。\n\n## 13.7 结论\n\n总结来说，通过向客户介绍\
  \ UBI 的优势并强调其如何帮助他们省钱，经纪人、代理和中间人可以支持并增强市场对该计划的采用。随着远程信息技术加入基于使用的保险，印度在迈向个性化和数据驱动的保险解决方案方面迈出一步。由于于数据获取能力的提高，保险公司现在能够更准确地分析和风险风险。然而，明智地使用这些数据有有利也有弊。数据驱动的决策可以提高盈利能力和客户满意，但必须解决数据隐私和监管合规问题。为了在数字市场创新并保持竞争力，保险公司需要在利用尖端技术的同时应对这些挑战。采用沙箱立法和与保险科技公司合作可以促进保险行业产品的创新和进步。最终，一种以客户为中心的方法——即保险公司调整其组织结构和业务模式以适应新技术并满足不断变化的客户需求——将决定他们在数字时代的表现。为了在市场上脱颖而出并取得长期成功，保险公司必须拥抱数字化转型并智能地利用新兴技术。\n\
