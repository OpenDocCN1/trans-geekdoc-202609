  \ AI 的大量工作来自这些国家。右侧区域（`AU_UN`）列出了对该研究做出贡献的大学。伊斯兰阿扎德大学（Islamic Azad University）和哈根大学（University\
  \ of Hagen）似乎与主题术语有很强的关联，表明这些机构在 във领域有活跃的研究或出版。\n\n![图 6.2 三元图。（作者开发）](img/Fig06_02.jpg)\n\
  \n图 6.2 三元图。（作者开发）\n\n## 6.3 树状图分析\n\n在图 6.3 中，文献计量分析的树状图显示了研究文章在保险 AI 应用相关的各个主题领域的分布。树状图的关键观察结果如下：\n\
  \n![图 6.3 树状图。（作者开发）](img/Fig06_03.jpg)\n\n图 6.3 树状图。（作者开发）\n\n**研究分布：** 树状图显示，在保险\
  \ AI 应用领域，很大一部分的研究集中在“机器学习”（34%）。此外，其次是决策（29%）和健康保险（12%）。在调查保险 AI 应用时，ML 技术似乎要常见得多，特别是在决策过程和健康保险中。\n\
