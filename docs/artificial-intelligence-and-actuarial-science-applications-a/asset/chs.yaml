  \ 卷 (2016): 126。\n\n# 16 规划未来：人工智能在变革保险业精算工作中的作用\n\nMufaro Dzingirai 和 Rukudzo Dzapasi\n\
  \n## 16.1 引言\n\n在数字化和全球化的经济中，各部门采用人工智能技术的潜在收益在现代社会和经济中随处可见。尽管制造业、医疗保健、软件开发、农业和银行业等部门因高采用人工智能技术而受到赞誉，但遗憾的是，保险业在人工智能运动和论中在很大程度上被忽视了。\n\
  \n\n\n\n\n在保险领域，人们见证了人工智能在第五次工业革命中彻底改变业务运营的方式。随着当代商业世界技术的颠覆性变革，发达国家和发展中国家的保险公司都开始采用人工智能技术（Gürsev\
  \ 2023; Khalisa 2024; Mangla et al. 2022; Prince & Taylor 2023）。人工智能通过革新行业的各个方面（如客户体验、核承保、理赔处理、欺诈检测和风险评估），在转型全球保险业方面发挥着重要作用。尽管发达国家的保险公司在实施人工智能方面已处于领先阶段，但发展中国家的保险公司也试图加速人工智能的采用。人们广泛认为，发展中国家的许多组织正在缓慢进行数字化转型，主要是因为它们的财务健康状况较弱。\n\
  \n必须提到，各保险公司的可持续性取决于组织采用先进技术的程度（Malifete et al. 2022; Shamsuddin et al. 2023）。因此，积极的管理者的责任是提供资源以提高效率和效能。鉴于我们现在处于全球经济中，利用人工智能的优势来智胜竞争对手是有合逻辑的。对人工智能的投资可以产生实时数据，协助风险管理。通过确保有效的风险管理，组织可以获得市场领导地位，这对于确保竞争优势大有意义。\n\
  \n展望未来，保险领域的精算工作正变得更加数据化，这证明了对生成式人工智能的需求。鉴于人工智能在精算工作中的重要性，积极的保险公司正在实施自然语言处理、机器学习、深度学习、机器人流程自动化以及视频和音频分析等人工智能技术，旨在提供卓越的产品和服务。值得注意的是，人工智能形式的数字化转型提升了保险公司各分机构的速度、准确性和效率（Gürsev\
  \ 2023; Prince & Taylor 2023; Shamsuddin et al. 2023）。因此，在迈向数据整合的过程中，对信息技术基础设施和机制的需求不容忽视。有趣的是，人工智能帮助保险公司收集和分析细粒、及时且准确的精算数据。\n\
  \n事实是，人工智能被誉为加速各行业数字化转型发挥了工具性作用。随着对精算卓越的需求，数据文化战略可以支持数据驱动的战略决策。近期，这种趋势在保险领域逐渐获得势头（Mangla\
  \ et al. 2022）。值得注意的是，发展中国家保险领域的人工智能采用处于早期阶段。尽管生成式人工智能正纳入保险领域，但其潜力尚未完全释放（Holland\
  \ 2022）。因此，本章旨在批判性地审查人工智能在革新保险业精算工作中的作用。\n\n## 16.2 人工智能与保险业：全球视角\n\n全球范围内人工智能采用的指数级增长为保险业带来了多项优势。《牛津英语字典》将人工智能定义为“能够执行通常需要人类智能的任务的计算机系统的理论和开发，例如视觉感知、语音识别、决策制定和语言之间的翻译”。考虑到这一点，全球保险公司将其有限的资源大部分分配给人工智能技术。例如，香港的一家大型保险公司投入了\
  \ 2000 万美元用于人工智能技术，以缩短理赔处理时间（KPMG 2023）。人工智能驱动的聊天机器人和虚拟助手被用于提供个性化客户服务、解答查询并协助咨询，从而增强体验。这些虚拟代理可以同时处理多个请求，带来更快的响应时间和更高的客户满意度。这支持了这样观点：生成式人工智能现在是公司董事会的热点。\n\
  \n毫无疑问，人工智能在人工智能营销、技术能力优化、通过聊天机器人改进体验、常规任务自动化、反欺诈、理赔建模和强大的风险管理方面改进了精算工作。在这方面，人工智能算法在分析海量数据以支持定价模型方面发挥着重要作用（KPMG\
  \ 2023）。因此，保险公司提供定制产品和服务、评估客户画像并降低风险将变得非常容易。更有趣的是，通过人工智能，数据分析师可以从客户收集的海量结构化和结构化数据中提取有意义和有价值的见解。相应的，人工智能驱动的营销策略可以在数字化商业世界中有效实施。根据\
  \ Lior (2021), p. 467”，“人工智能（AI）行业预计在未来十年内将指数级增长，到 2030 年对北美国内生产总值的贡献率将达到 14.5%”。这显示了人工智能在社会经济转型中的重要性。\n\
  \n在 OECD 的背景下，《人工智能建议》于 2019 年 5 月通过，《可信人工智能伦理指南》也于 2019 年 4 月通过（OECD 2020）。OECD\
  \ 保险和私人养老委员会参与了与保险业相关的技术的讨论。结果显示，人工智能被认为是自动化理赔流程的强大工具，其中 `OCR` 技术协助保险公司从文件中提取相关且准确的数据，从而减少手动录入带来的错误。此外，保险公司在应用预测性数据分析进行风险评估和风险消除策略开发时，人工智能提供了帮助。显然，人工智能算法可预测潜在风险并协助数据分析师制定预防措施。因此，人工智能是保险业的规则改变者。这需要全面理解保险领域的人工智能项目如何为保险公司及其客户带来长期利益（Holland\
  \ 2022）。\n\n## 16.3 保险业采用人工智能的驱动因素\n\n\n\n\n\n随着先进技术在企业界产生广泛影响，捕捉保险领域采用人工智能的关键驱动因素值得关注。\n\
  \n首先，海量数据源的可用性被认为是精算工作中采用人工智能的驱动因素之一。这意味着大型数据库在保险业风险管理和理赔处理等领域应用人工智能时发挥着至关重要的作用（Leech\
  \ et al. 2024）。其次，`machine learning`的指数级增长也是保险业采纳人工智能的另一个主要驱动力。正在此背景下，`machine learning`通过训练算法从数据中学习，这被广泛认为是人工智能的一个子集（Baruah\
  \ & Singh 2023; Poufinas et al. 2023）。有趣的是，研究人员可以教并培训机器来做出预测和识别模式。`machine learning`还涵盖了大量识别语音和图像的应用利用。为此，`deep\
  \ learning`和`neural networks`可以识别与声音、文本和图片相关的问题模式。\n\n第三，感知有用性是保险业采用人工智能的另一个关键驱动因素。正在此背景下，保险公司将人工智能视为检测和监控欺诈的强大工具。更有趣，人工智能被广泛认为是精算工作中降低和减轻风险的战略方法。稳健的风险和网络模型的应用有助于提高当前数字化世界中的效率和效能（Bao\
  \ et al. 2022; Gupta et al. 2021; Nabrawi & Alanazi 2023; Owolabi et al. 2023）。第四，对研发的大量投入被誉为精算工作中人工智能的关键驱动因素之一。有趣的是，政府和私营部门都在投资与人工智能应用于不同经济部门相关的研究，尽管发展中国家在支持人工智能研发方面落后于人（Leal-Filho\
  \ et al. 2023; Marino et al. 2023）。这就是为什么大多数保险公司仍处于人工智能采用的婴儿阶段的原因。研发投入促成了`robotics`、`computer\
  \ vision`和`natural language processing`的诞生。\n\n第五，对定制化产品和服务的需求使得精算工作必须采用人工智能。人工智能支持的预测模型允许保险公司提供个性化的保险产品和服务（Khalisa\
  \ 2024; Singh et al. 2022; St-Onge et al. 2022）。人工智能技术允许精算师从关于客户画像的大数据中学习。第六，`cloud\
  \ computing`的兴起也起到了驱动作用。为此，`deep learning`和`neural networks`可以识别与声音、文本和图片相关的问题模式。第七，`Society\
  \ 5.0`是另一个关键驱动因素。第八，`innovative culture`要求保险公司接受人工智能。最后，`competitive pressure`是另一个因素。\n\
  \n## 16.4 保险业精算工作中培养人工智能面临的挑战\n\n尽管人工智能与保险业密切相关，但保险公司在采用人工智能时仍面临许多挑战。为了享受人工智能带来的好处，保险管理人员必须解决人工智能的阻碍。高质量人工智能数据的可用性有限是挑战之一。\n\
  \n## 16.5 方法论\n\n\n\n\n本研究采用了全面的文献综述方法，以确立人工智能在变革保险业精算工作中的作用。鉴于目前与精算工作中人工智能相关的现有文献是分散且碎片化的，该方法被认为是恰当的。这种研究方法允许研究人员从次级来源收集数据。这些来源包括\
  \ Web of Science、Google Scholar、组织来源以及 Scopus 数据库。收集到的数据根据呈现的模式进行分析，这与主题分析相一致。结果和讨论报告如下。\n\
  \n## 16.6 人工智能在保险业精算工作中的作用\n\n结果表明，人工智能在当前的数字化经济中对支持精算工作发挥着工具作用。随着人工智能在保险业的成功实施，公司对提高生产力产生了浓厚兴趣。这可以通过机器学习对从客户画像中提取的大数据进行有效且高效的合成来实现。利用人工智能的保险公司有潜力实现重复性任务的自动化，包括数据处理、数据输入和验证以及核保流程。在此背景下，Gupta\
  \ 等人 (2021) 认为，对人工智能具有高亲和度的保险公司可以胜过竞争对手，因为它们能够简化工作流并增强决策流程，从而促进先进的风险评估。\n\n占据市场领导地位的保险公司是关注个性化服务的公司。因此，人工智能在增强客户体验方面提供了优势。这可以通过混合现实和增强现实的形式来实现。事实上，人工智能的应用允许保险公司通过采用机器人和虚拟助手与客户进行个性化互动。事实证明，个性化客户服务是从高效利用人工智能中获得的一个积极业务成果。客户可以\
  \ 24/7 全天提出各种查询，这意味着必须借助在线聊天机器人的帮助利用人工智能来处理此类查询。\n\n众所周知的是，稳健的风险评估是保险行业商业成功的核心。无疑，人工智能等先进技术可以成为应对保险领域风险评估不当导致的负面影响的有力工具。同样，欺诈是保险人可能遇到的风险之一，这要求利用机器学习和神经网络。这类技术可以协助实时风险评估、欺诈性理赔活动的预测以及准确的风险计算\
  \ (Brown 2018)）。必须注意的是，当保险公司处理理赔管理时，人工智能提供了许多益处。在理赔管理中，人工智能发挥着催化作用，为对可疑账户提供更密切的交叉检查。这表明红旗标记在理赔管理中至关重要，这需要使用神经网络和深度学习。\n\
  \n鉴上述，嵌入人工智能的成本控制方法可以为保险增加价值，特别是管理客户理赔时 (Kewal & Saxena 2023; Khalisa 2024; Sinha\
  \ 等人 2021)。与按需保险、基于使用的保险和微型保险相关的理赔可以通过人工智能的应用轻松实现自动化。自动化理赔管理流程的主要动力是利用经过训练的人工智能模型从传感器和生物识别设备等各种数据源收集实时数据。这对于帮助保险人加速理赔流程并引入独特创新的产品和服务非常有帮助。通过利用人工智能模型，保险公司可以释放实时数据的潜在价值，并高效地提供卓越的保险产品和服务。\n\
  \n人工智能可以加快新产品的开发流程。显而易见，新的保险产品和服务得到了保险流程数字化的支持。在微型保险、按需保险和基于使用的保险的背景下，投资组合创新是保险领域提供卓越服务的中心\
  \ (Khalisa 2024; Kumari 等人 2024; McDonald 等人 2024)。因此，提到人工智能有助于保险公司加速支持新投资组合开发的内部流程并不意外。人工智能模型可以得出价值的见解，并将其有效应用于开发过程中。\n\
  \n人工智能还可以帮助开发保险领域稳健的风险预测模型。这意味着先进技术可以协助精算科学家计算与不同和服务相关的风险水平。具体来说，机器学习在精算工作的保单定价系统中发挥着基础作用\
  \ (Khalisa 2024; Sadowski 2023; Xin & Huang 2023)。这表明价格优化需要人工智能的应用。保险领域定价模型的完善可以通过使用车载设备的数据来推动。这类模型可以应用于考虑不同变量的情况下合成大量数据，并在此基础上构建出适用于非技术人员（如核保员）的友好工具。更有趣的是，预测性和规范性分析模型对于深入理解运营韧性、风险计算、预测客户行为以及增强保险领域的客户互动有用。为此，人工智能在核保和定价视角下的力量不容低估。\n\
  \n更有趣的是，人工智能的应用可以提供实时和准确的数据，这对于保险公司的战略经理具有重要意义。人们公认的是，保险领域的证据管理需要结构化数据的实时提供。因此，谨慎的保险公司经理正以惊人的速度采用人工智能，特别是在发达国家。保单数据、市场趋势和理赔历史的可用迫经理寻找分析保险市场大数据的先进模型。\n\
  \n\n\n未来，人工智能的应用在提升保险业核保流程方面提供了便利。如果不拥抱能够协助核保流程的高级人工智能技术，很难跟上进步 (Khalisa 2024; Wilkinson\
  \ et al. 2024)）。人工智能模型的应用通过利用预测分析改变了保险核保流程。在人工智能的帮助下，可以实现按需报价和保单定制。在涉及财产、人寿和意外险时，人工核保已不再受到推崇。人工智能技术使得保险核保过程变得如此快速且具有成本效益。在此，需要注意的是，人工智能在确保稳健的监控和评估方面发挥着重要作用。随着人工智能的应用，监控和评估精算工作的进展变得容易得多。人工智能帮助保险公司确保获取与理赔管理和核保进度指标相关的实时结构化和非结构化数据。\n\
  \n## 16.7 建议\n\n鉴于人工智能在促进保险业效率方面的关键作用，以下是拟议建议：\n\n*   **建立监管框架：** 建议不同经济体的监管机构制定与保险业人工智能相关的监管框架。这可以确保在应用人工智能模型时尊重客户的权利和隐私。\n\
  *   **人工智能技术税收减免：** 建议政府对进口的人智能技术实施税收减免。这有助于保险公司降低人工智能工具和技术的采购成本。这对于大多数依赖进口先进技术的发展中国家更为适用。\n\
  *   **人工智能知识枢纽：** 高等机构（特别是非洲国家）应建立人工智能中心。这些中心可以成为人工智能技术和工具开发与应用方面的培训和发展中心。\n*  \
  \ **公私合作伙伴关系：** 在这个数字化经济中，建议公共部门和私营部门共同努力，加强保险业中人工智能的应用。这有助于知识和专业知识的共享。\n*   **非政府组织资助：**\
  \ 建议非政府组织向财务资源有限的保险公司提供资助。这些资助可以用于利用人工智能带来的益处。\n*   **人工智能意识宣传活动：** 建议保险业的监管机构设计并实施大量的人工智能意识宣传活动，提高提高数字化企业世界对人工智能技术需求的关注。\n\
  \n## 16.8 结论\n\n本章批判性地审视了人工智能在变革保险业精算工作中的作用。尽管制造业、医疗保健、软件开发、农业和银行业等经济部门因高度采用人工智能技术和对人工智能平台进行大规模投资而受到赞誉，保险业在这场人工智能运动和话语中很大程度上被忽视了。在当前的第五次工业革命中，通过采用支持保险业转的先进数字技术（特别是借助人工智能技术的帮助），精算工作可以变得更加简单。因此，观察到人工智能技术对于保险业至关重要，因为它们能够提高生产力、通过个性化服务增强客户体验、促进理赔管理的自动化、减少欺诈、支持客户预测模型的发展、提供实时准确的数据、改进核保流程、加速新开发，并确保稳健的监控和评估。研究得出，人工智能是保险公司获得竞争优势的强大策略。\n\
  \n## 参考文献\n\n*   Bao, Yang, Gilles Hilary. “人工智能与欺诈。”在《金融与运营交叉接口的创新技术：第一卷》，第 223–247\
  \ 页。Cham: Springer.\n*   Baruah, Prasanta, and Pankaj Singh. “使用机器学习技术在人寿行业进行风险预测。”在《人工智能国际会议》，2023。\n\
  *   Brown, A. “保险业中的人工智能：保险科技的兴起。《网络政策杂志》，3(2)，165–187。\n*   Chikhaoui, Emna, and\
