  \n# 14 使用客户支持机器人自动处理健康保险理赔的安全且扩展的区块链解决方案\n\nVijayakumar T, Revathi A, Janarthanan\
  \ S, and Vanitha A\n\nDOI: [10.1201/9781003472551-17](https://doi.org/10.1201/9781003472551-17)\n\
  \n## 14.1 引言：背景与驱动力\n\n\n\n\n\n鉴于 COVID-19 疫情，包括保险业在内的所有企业使用数字技术已变得至关重要。其结果是数字化得到了演进，特别是在医疗领域。包括医疗保健保险设施在内的医疗保健行业必须迅速转向网络化和远程操作的流程。他们必须提高自身的数字化能力，以应对整个医疗机构内部业务的业务增长。此外，他们还需要与医院、诊断中心、病理实验室、医疗设备制造公司和其他组织合作，以确保客户理赔索赔的及时赔付。Aleksieva\
  \ et al. (2020) 解释说，`AI` 和 `blockchain` 等先进技术的出现导致医疗保健行业发生了巨大剧变，彻底改变了健康保险公司的运营方式。`RPA`（即机器人流程自动化）是一项技术，通过自动化处理重复、一致且定义明确的数据和程序，可以显著降低多个领域的成本。在电子健康时代，这些系统连同电子健康记录\
  \ (`EMR`)、电子文档交换 (`EDI`)、患者管理 (`PM`)、订单通信系统 (`OCS`)、医院信息系统 (`HIS`) 等，已应用于不断演变的医疗业务中。Asquarepartners\
  \ (2019) 研究了一个拥有医院行政部门 (`PM`, `EDI`) 和临床信息部门 (`EMR`, `OCS`) 的医院信息系统。\n\n`Chatbot`\
  \ 是一种基于人工智能 (`AI`) 的软件，它提供与用户进行文本交互，帮助用户获取信息和服务，用户可以在无需人工交互的情况下与软件服务进行通信。Brill (1995)\
  \ 解释说，也有许多行业已经开始使用聊天机器人代替人工客服，主要针对那些漏斗底端的问题。Buterin (2014) 建议大多数客户 (74%) 希望通过自动化来为其问题提供快速解答，他们通常于将聊天机器人作为实现这一点的工具。Zaboj\
  \ (2020) 解释说，聊天机器人市场预计在 2020 年达到 26 亿美元，并在 2024 年达到 94 亿美元。这种扩张最可能是由于聊天机器人使用量的增加。Abdul-Kader\
  \ and Woods (2015) 解释说，为了应对这一现象，服务业正在关注金融机器人，它们可能作为更快速、无缝金融交易的工具。Chowdhury et al.\
  \ (2019) 建议，在过去的十年里，技术领域中一个引起关注的新术语是“区块链”或区块链技术。在传统的保险系统中，居民必须手动通过不同部门经过许多不同的交易步骤，通过系统进行支付结算的时间较长。此外，Ferdous\
  \ et al. (2019) 解释说，保险业每年在理赔处理上花费数千万美元，并因为虚假理赔每年损失数百万美元。Gatteschi et al. (2018)\
  \ 描述道，许多研究人员已经研究了如何在保险业中使用区块链技术来解决这些问题。保险计划可以转换为 `smart contracts`（智能合约），可用于处理处理理赔所需的步骤，确保其有效性并进行赔付。结果将产生许多益处，例如节省成本和资金，甚至可能阻止欺骗。无疑，可以建立\
  \ `smart contract` 来跟踪对从公司购买保险保单表示兴趣的个人细节，让他们更方便地监控理赔进度，并自动向他们还款。`smart contracts`\
  \ 被用于目前基于区块链的方法，以改进资产交换、停止欺骗并降低运营成本。然而，这些方法并没有将联合保险放在其优先考虑事项的顶位。Jiang et al. (2020)\
  \ 描述道，这种类型的保险让具有相似特征的人形成小组，并以一种更更有帮助、公平且开放的方式来保障自己。\n\n协作对保险公司和被保险人都有许多益处。其中一些包括降低健康保险费率、改善客户体验，以及让标准保险公司投资于新想法以在保险业务中保持竞争力。现有的联合保险系统旨在提供一个客户可以相互直接通信的平台，但没有哪一个使用区块链技术来构建不可篡改、开放且安全的网络。据我们所知，集体健康保险、`AI`\
  \ 和区块链技术尚未被共同研究过。\n\n所建议的策略不仅使保险系统内的许多组织能够相互进行手动接触，还减少了运营和行政开支并节省了时间。个人、金融机构和保险公司可能都会从\
  \ `smart contracts` 的潜力中受益，从而鼓励保险业的合作、资源整合和相互保护。这里讨论的 `smart contract` 包含一组保险保单，作为保险公司与这些业务的保单持之间的合同。编码保险保单的\
  \ `smart contract` 与外部 `oracles` 连接，以启动新的理赔并将索赔金额转移给被保险人，而该被保险人恰好也是 `smart contract`\
  \ 的所有者。在保险业中使用 `blockchain` 的优势包括：确保所有参与者遵守协作保险模型；提高保险交易的透明度；自动化并加速从投保到理赔处理的操作；通过消除人工交互减少行政和运营费用；并确保多个安全协作实体之间的不可否认原则。\n\
  \n1. 概述将 `smart contracts` 和区块链技术引入新的公有侧链（PPS）协作保险计划的益处。据我们知，在这种范式下不再需要管理机构，因为患者相互依赖来满足医疗需求。\n\
  \n2. 介绍所提出的基于区块链的保险系统的核心概念，通过 AI 和外部 `oracles` 进行自动化执行，包括机器读取的保险保单和理赔。\n\n3. 当保险理赔和保险公司的数量增加时，评估\
  \ `PSC` 的扩展性和性能至关重要。可以通过测量其执行时间、扩展性开销和 Gas 消耗来衡量建议系统的有效性。\n\n\n\n\n区块链创新彻底改变了多个领域，包括金融、治理、商业和控制在内的许多领域。降低成本、提高透明度以及简化代币化都是区块链技术可能实现的结果。Fallucchi\
  \ 等人进行了一项调查，旨在不依赖中心化机构的情况下证实数据的准确性。区块链技术被用于记录交易中的数据哈希值，以确保数据的可追踪能力。然而，网际协议文件系统（`IPFS`）被用于提供数据的持续可访问性。Jiang\
  \ 等人 (2018) 建议，许多国家目前正处于启动试点阶段，以评估区块链技术并熟悉新兴技术。根据作者的说法，他们的架构特别适用于 Valls 市议会正在实施的开放数据门户计划。Joshua\
  \ (2018) 建议，该计划利用区块链和 `IPFS` 技术在市政政府管理部门的网站上发布数据集。此外，Khan 等人 (2021) 描述道，该技术有潜力用于以数字身份管理保护为中心的区块链项目，并已获得国土安全部（`DHS`）的资助。\n\
  \nKunde 等人 (2017) 描述道，保险行业已使用区块链技术，这种技术具有改变理赔处理、自动支付、资产转移以及防欺诈的方式。根据这种范式，我们可以将保险分为三类：具有自动理赔处理的保险、按需付费保险以及点对点保险。\n\
  \nLamberti 等人 (2018) 描述道，预言机（Oracles）具有从现实世界获取数据并立即激活相应智能合同的能力。以旅游保险为例，专家可能会定期检查航班状况。Lepoint\
  \ 等人 (2018) 描述道，之后，智能合同可以访问这些外部数据，并在航班延误时启动支付以赔偿受影响的游客。Moon 和 Kim (2020) 的 insure\
  \ chain 是一个强大的想法，它取决于智能合同，该合同包含了设置费用和确保支付真实的规则。还款条件通过预言机服务进行检查，预言机会验证天气数据并确保其正确。使用预言机可以加速理赔处理过程并减少行政工作引起的人为错误。然而，需要注意的是，依赖外部预言机仅在少数情况下是实行的。大多数情况由保险公司处理，它们在结算之前需要经过专业人员的审查。\n\
  \n智能合约实现的支付使得新的盈利方式更容易出现，例如按需付费保险计划。Lamberti 等人提供了一种在需要时运行的汽车保险系统，利用智能合同和物联网（`IoT`）技术来降低保单变更的成本并减少保险欺诈案件的发生。该系统由\
  \ Vo 等人 (2017) 创建，是一个运行在区块链上的按需付费汽车保险应用。不经常开车但仍希望为某些行程获得保险覆盖的人可以使用该程序的“按次付费”选项。如果按需付费保险使用区块链技术，客户可能比标准保险节省费用。这种策略还可以通过与年轻人和精通技术的人交流，让保险公司在竞争中占据优势。然而，为了防止保险欺诈，这些按需付费系统需要被保险者的最新信息。因此，这些方法需要将被保险者的隐私保护放在首位，尽管这对于应用程序运行并非必须。\n\
  \n点对点保险计划允许无需通过经纪人发送对象。Friendsurance 是一种数字担保工具，可以根据需要进行扩展和更改。它是为银行、保险公司以及希望留住客户并通过提供有用服务盈利的伙伴设计的。Okuda\
  \ 和 Shoda (2018) 描述道，dynamics 是一个基于区块链的系统，帮助自助群体获得失业保险。它的主要工作是承保这种保险并处理案件。然而，正如\
  \ Pang 和 Lee (2008) 研究所示，现代点对点保险系统并非真正的点对点模型，因为大多数保险工作是由传统的保险模式或风险提供者完成的。\n\n“无许可区块链”术指的是任何人都可以积极参与的去中心化系统。比特币和以太坊区块链就是无许可的示例。Hyperledger\
  \ Fabric 和其他许可链限制了哪些用户可以在网络上执行特定任务。最近，McGrath (2018)](ch14.xhtml#r14_19) 描述道，保险业开始采用以太坊、Hyperledger\
  \ Fabric 和 IOTA 等分布式账本技术。创建 BlockCIS（一种网络保险系统）的目标是在所有方之间创建一个自动、实时且不可篡改的反馈环路，以便评估网络风险。为了保持业务交易的隐私，该系统使用许可的\
  \ Hyperledger Fabric 技术构建。\n\n\n\n区块链是一种按时间组织的、不受单一控制的事件记录。交易被存储在区块（blocks）中。区块链极难篡改，使其成为一种可靠的方法。由于区块链通过独立的共识程序建立信任，因此不需要单一的权威机构。任何物理或数字资产都可以存储在分布式账本上，然后通过全球网络进行共享。该网络中的所有参与者拥有账本的精确副本，这是至关重要的。Singh\
  \ 和 Urolagin (2017) 描述了 2019 年。尽管区块链技术最初是为金融领域开发的，但随后它找到了许多其他应用，包括医疗保健信息交换、工业物联网数据的智能包装、食品追踪的供应链管理以及基于区块链的保险解决方案。在区块链网络上，安装并运行着被称为“智能合约”的程序。\n\
  \n这些预定任务的执行取决于某些特定要求的满足。Suciu 等人 (2018) 定义道，智能合约在部署后没有被过滤或更改的能力，且其功能在被调用时始终是有响应的。智能合约实现了网络的自动化以及从物理合同向电子合同的转变。Vo\
  \ 等人 (2017) 认为，智能合约允许用户通过自动化自动化交易，在不需要中央权威的情况下将他们的协议和信任关系正式化。\n\n智能合约还允许用户保持彼此之间的信任。Wu\
  \ 等人 (2019) 描述道，智能合约无法与其他系统建立直接连接是一个必须记住的关键点。预言机（Oracles）是这种通信可能的手段。预言机是外部信息源，通过应用程序接口（API）为区块链上的智能合约提供数据。预言机也被称为云数据库。\n\
  \nProvable Ethereum API 是 Polygon 区块链上开发区块链应用和智能合约常用的服务（图 14.1）。\n\n![图 14.1 区块链在加速理赔生命周期中的功能。（作者开发。）](img/Fig14_01.jpg)\n\
  \n图 14.1 区块链在加速理赔生命周期中的功能。（作者开发。）\n\n## 14.4 客户支持聊天机器人的理自动化流程\n\n能够与用户进行实时音频或书面交互的应用程序被称为聊天机器人（chatbot）。Aleksieva\
  \ 等人 (2020)](#ch14.xhtml#r14_2) 描述道，这种 AI 技术通过以用户友好的方式跨渠道进行对话，提供了复杂的的用户体验。它是新兴的前沿技术，在提高销售、增强客户服务和改进营销策略方面潜力巨大。在下一部分，我们将研究聊天机器人的许多方面。\n\
  \n### 用例\n将聊天机器人作为个人助手变得越来越普遍。这允许用户与聊天机器人对话、提问并执行诸如打电话、支付账单、组织会议以及传统上由个人助理完成的各种杂务。Siri\
  \ 是苹果公司的人工智能聊天机器人。2017 年 3 月 24 日，一个当时四岁的名叫 Roman 的小男孩利用 Siri 成功救了他的母亲。此外，根据 Zaboj\
  \ (2020)，常用的聊天机器人包括 Google Assistant 和亚马逊提供的 Alexa。聊天机器人通常用于呼叫中心，让客户能够在全天任何时候询问其产品并获得即时回复。\n\
  \n### 类别\n机器人大部分分为两类：\n\n* **基于文本的**：基于文本的聊天机器人专门使用文本与用户通信。用户输入文本查询并获得文本回复。这是两种机器人，它们通过提供预设选项来运行。\n\
  * **语音激活的**：采用语音交互的机器人是最先进的种类。\n\n### 机制\n聊天机器人的基本操作在此处介绍。机器人有许多组件。用户界面（UI）是聊天机器人的前端组件，允许用户进行交互并提交查询。语音激活的机器人使用麦克风接收指令或输入。基于文本的聊天机器人最容易创建，因为它只需要处理一组限制的选择。动态机器人需要集成辅助元素和复杂的算法，例如语音翻译和语音转文本（STTR），以便良好运行。\n\
  \n此外，Abdul-Kader 和 Woods (2015)](#ch14.xhtml#r14_1) 描述道，这些机器人必须使用额外的自然语言处理技术，如词性标注和情感分析，以便理解查询并提供相应的回复。\n\
  \n根据 Ferdous 等人 (2019)，比特币被认为是第一种广泛使用的去中心化货币，因为它不受银行或其他机构控制。该系统的一个重要技术发展是其核心理念，被称为区块链。区块链是一种在点对点（P2P）节点之间共享的分布式记录。账本是通过复杂的数学连接的区块列表。每个区块包含多个交易。每个交易允许用户向一个或多个用户发送数量特定的比特币。\n\
  \n有了 AI 和区块链，保险理赔流程将发生改变。AI 可以帮助您填写表格并预审理赔以加快审批。它通过检测欺诈理赔为保险公司节省费用。区块链安全地存储保险数据、理赔历史和保险公司之间的通信。智能合约（根据定义的标准触发奖励的自动执行协议）是不可篡改的（图\
  \ 14.2）。AI 用于效率，区块链用于安全，这将保险理赔变得更快、更透明，并对投保人和保险公司都有利。\n\n\n\n由于比特币区块链的出现，一种全新的区块链系统应运而生，它允许被称为“智能合约”的计算机软件在相关的账本上启动并独立运行，正如\
  \ Gatteschi 等人 (2018) 所描述的那样。通过参与该本的维护，你可以确保智能合约及其操作无法被更改或撤销。这是一个非常有用的特性，在许多领域中都有许多用途。允许智能合约的区块链系统还具有许多其他优势，例如自主数据控制、数据持久性、数据源头追溯、可问责性和开放性。Jiang\
  \ 等人 (2018) 描述了区块链系统主要分为两种类型，基于每个人对记录的访问权限程度。任何人都可以访问公共区块链，这是一种开放的数字日志，可用于记录和检查活动。如果某人在公共区块链（有时也称为无许可区块链）中，任何人都可以随时加入并与网络交互，以管理区块链和进行交易。例如，可以使用比特币、以太坊、莱线币、门罗币等公共区块链。私有区块链（有时也称为许可区块链）仅允许受信任的机构加入，并为用户提供不同级别的隐私和访问权限。私有区块链平台由\
  \ Hyperledger 平台展示。\n\n## 14.5 基于技术实现的以太坊主链数据传输\n\n以太坊主链位于图 14.3 的最顶部。由于它是一个开放的区块链，每个人都可以加入并参与。与以太坊主链共存的是一种名为\
  \ Polygon 侧链的二级区块链。侧链是与主链相互连接的独立区块链。通过处理未在主链上发生的交易，它们让主链能够处理更多的交易。\n\n![图 14.3 PSC\
  \ 的整体结构。（作者开发）](img/Fig14_03.jpg)\n\n图 14.3 PSC 的整体结构。（作者开发。）\n\n该图示的正文强调了使用侧链的优势：\n\
  \n通过联盟智能合约实现的许可侧链，将参与范围限制在仅被许可的参与者。。对于重视数据隐私的业务来说，这可能是一件好事。不同制造商之间的协作：侧链使得不同区块链之间的互操作成为可能。与非同质化代币（NFT）相关的资产可以通过策略传输在主链和侧链之间转移。\n\
  \n选择合适的区块链平台和共识机制。以太坊主链处理联盟智能合约的时间为 15 分钟，使用 Polygon 侧链进行互操作的时间为 15 分钟。数据传输基于去中心化存储，并在两个供应商之间传输。目前的保险市场正面临着包括保单传输便利和提供者互操作性在内的问题。传统系统受到保险公司之间缺乏通信的困扰，这使得在更换供应商或转移承保范围时维持无缝衔接变得更加困难。此外，理赔过程也受到过多的行政手续和缺乏透明度的阻碍。\n\
  \n利用区块链技术，可以通过智能合约和 Polygon 侧链相结合来实现解决方案。Polygon 作为以太坊的二层网络解决方案，为保险和金融应用提供了一个既可靠又灵活的框架。它特别适用于涉及大量交易的保险任务，因为这些任务在以太坊主网上面临着高成本和交易速度慢的问题。智能合约（即包含条款自动执行并简化保单传输关键元素的合约）已通过区块链技术变得可行。在保单传输期间，相应的供应商（如医疗保健提供者）可以接收立即更新。保单数据安全地存储在区块链上。此外，与保单条款对应的条件还款可以被编写到智能合约中，从而简化理赔提交过程。\n\
  \n这种方法具有极大的报销合约。\n\n\n\n\n已找到处理和确认月度支付活动所需的时间。`PayPremium` 函数是此交易的一部分，还包括调用 `updateClaimDetectionURL`\
  \ 函数的 API 链接更新交易、调用 `claimCreation` 函数的理赔创建交易，以及调用 `cancelPolicy` 函数的保单取消交易。因此，计算完成\
  \ `Insurance Policy`（保险单）智能合约作业所需的时间。图 14.3 显示了一个被覆盖组织所调用作业的成本。被覆盖人员可以在 222 ms 内启动一个新的\
  \ `Claim`（理赔）智能合约实例，而传统的保险保单则需要几分钟或几小时。其他被调用的过程在 100–160 ms 内执行（图 14.4）。我们的方案实现了所有目标：加速保险业务流程、通过消除人为交互来减少运营和管理费用，并安全地存储保险交易数据。\n\
  \n![图 14.4 过程控制分析。（作者开发）](img/Fig14_04.jpg)\n\n[图 14.4 过程控制。（作者开发）。]\n\n### 14.6.3\
  \ 扩展成本\n\n`Insurance Policy` 智能合约已部署到 1,000 个受保账户。它显示了 `Insurance Policy` 智能合约的调用时间。处理时间随覆盖账户数量成比例增加，从\
  \ 0 秒到 240 秒不等。图 14.5 显示受保账户的数量与智能合约的交互长度密切相关。\n\n![图 14.5 每笔理赔的处理时间。（作者开发）](img/Fig14_05.jpg)\n\
  \n[图 14.5 每笔理赔的处理时间。（作者开发）。]\n\n### 14.6.4 额外销成本\n\n区块链实施后 `Insurance Policies`\
  \ 智能合约中的 Gas 使用情况。理赔创建、保费支付、理赔检测的 URL 更改以及保险取消是这些职责。图 14.5 说明了“被调用” `Insurance Policy`\
  \ 智能合约函数的燃料价格。Gas 使用量可以通过修改调用的代码进行调整。这可能是因为使用更多计算机资源的函数会消耗更多 Gas。部署新的 `Insurance\
  \ Policy` 智能合约并使用 `claimCreation` 函数（其即时安装新的 `Claim` 智能合约）预计比执行其他操作需要更多 Gas（表 14.1）。\n\
  \n[表 14.1 不同保险公司的分析]\n\n| 保险公司名称 | 保费 | 卖出 | Polygon 使用成本 |\n| --- | --- | --- |\
  \ --- |\n| A | 0.1868 | 0.0698 | 0.050 |\n| B | 0.1660 | 0.1396 | 0.043 |\n| C |\
  \ 0.2075 | 0.1326 | 0.031 |\n| D | 0.1868 | 0.1047 | 0.030 |\n\n`每笔交易成本 = Gas Cost\
  \ + 交易费用`\n\n**示例：** 如果交易的 Gas 成本为 `0.01 ETH`，交易费用为 `0.001 ETH`，则每笔交易的总成本为：`0.01\
  \ ETH + 0.001 ETH = 0.011 ETH`（表 14.2）。\n\n[表 14.2 Gas 成本概览]\n\n| 实体 | 执行成本 (Gas)\
  \ | 使用 Polygon 的成本 ($) |\n| --- | --- | --- |\n| 用户 | 50000 | 0.30 |\n| 保险公司 | 60000\
  \ | 1.00 |\n\n## 14.7 安全措施\n\n所提出的方案中包含两级保护。负责 ChainSure 的人被称为“经理”。老板负责维护系统的隐私安全。外部人员不应该在那里被监视，且没有许可无法进入。系统中存在试图破坏数据安全性的恶意节点。良好的共识程序可以防御威胁并维护用户的利益。简而言之，表\
  \ 14.1 显示了 ChainSure 的安全功能。它仔细审视了所建议的基于区块链的解决方案的安全性，专注于它如何如何处理一致性、隐私、身份识别和访问控制等重要的安全问题。\n\
  \n理赔验证效率：\n```\n每笔理赔验证时间 = 获取时间 + 验证时间(14.5)\n```\n**示例：** 如果从区块链中获取理赔需要 `0.5 秒`，验证理赔需要\
  \ `0.3 秒`，那么每笔理赔的验证时间为：`0.5 秒 + 0.3 秒 = 0.8 秒`\n\n### 14.7.1 数据完整性\n\n传统上，第三方负责管理遗留健康系统（图\
  \ 14.6）。\n\n![图 14.6 每秒授权人员分析。（作者开发）](img/Fig14_06.jpg)\n\n[图 14.6 每秒授权人员分析。（作者开发）。]\n\
  \n这种方法不仅增加了处理交易的费用，还为数据的篡改提供了可能。使用区块链平台自动化保险流程并保护数据是有益的。\n\n### 14.7.2 隐私\n\n在保险申请过程中，用户通常希望保持信息隐藏。这意味着基于区块链的方案是最佳选择，因为它在发生黑客攻击或系统崩溃时仍让人们访问数据。\n\
  \n### 14.7.3 数据篡改\n\n所有网络节点都接收存储在区块链中的交易副本。这使得篡改数据变得困难，因为每个节点都有准确的副本。此外，区块链技术保护了隐私，创建了不可篡改的记录，并防止用户在多个社交平台上共享数据（图\
  \ 14.7）。\n\n![图 14.7 每秒交易分析。（作者开发）](img/Fig14_07.jpg)\n\n[图 14.7 每秒交易分析。（作者开发）。]\n\
  \n### 14.7.4 访问控制\n\n`Ethereum` 允许你验证数据并控制谁可以看到它，因此不需要第三方。保险公司可以设置带有预定义规则的智能合约，可能只允许医院处理合约。这还包括让经过保险公司批准的医院参与运营（图\
  \ 14.8）。\n\n![图 14.8 点对点登录分析。（作者开发）](img/Fig14_08.jpg)\n\n[图 14.8 点对点登录。（作者开发）。]\n\
  \n### 14.7.5 DDoS 攻击\n\n分布式拒绝服务（DDoS）攻击是恶意黑客进入网站的一种流行方式。黑客向固定系统大量虚假数据进行攻击是一个大问题。目前，区块链的分布式结构使其能够留出资源来处理\
  \ DDoS 攻击，从根本上阻止此类攻击。这降低了人们无法获得保险服务的可能性。\n\n### 14.7.6 结论\n\n\n\n\n\n用于解决区块链系统中隐私泄露的健康保险理赔框架。目前的区块链健康保险系统为所有节点提供了对保险、所有权和传输数据的完整访问权限。健康保险公司在理赔期间将其信息输入智能合约进行身份验证时，面临着隐私信息泄露的风险。区块链技术提供了多项优势，包括数据篡改、访问控制和\
  \ DDoS 攻击。存储在区块链中的交易经过签名并传输到所有网络节点，难以修改数据。这确保了数据安全，生成了不可篡改的记录，并防止用户数据在社交网站上共享。\n\
