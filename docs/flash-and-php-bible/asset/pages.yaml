  md: "# Building the PHP login manager class\n\nThe next step in building the login\
    \ system is to connect it to the database of users, because a hard-coded login\
    \ and password is not very practical and certainly not secure.\n\n# Creating the\
    \ user's MySQL table\n\nThe first step is to create the user's table in the existing\
    \ database:\n\n```\nCREATE TABLE `users` (\n `id` int(11) NOT NULL auto_increment,\n\
    \ `username` varchar(25) default NULL,\n `password` varchar(40) default NULL,\n\
    \ `active` varchar(1) default '1',\n PRIMARY KEY (`id`)\n) ENGINE=MyISAM;\n```\n\
    \nThen you can prefill the table with some sample logins for testing purposes:\n\
    \n```\nINSERT INTO users (username, password) VALUES ('guest',\nMD5('pass'));\n\
    INSERT INTO users (username, password) VALUES ('timmy',\nMD5('bird'));\n\n```\n\
    \nA distinct difference from the predefined logins in Flash is that these logins\
    \ have encrypted passwords as an added level of security.\n\nBefore you can add\
    \ the logic for connecting to the service, you need to create the PHP class. This\
    \ class will check for valid users, and if one is found, it will return a true,\
    \ which means the user is valid and the Login box can be removed.\n\n# Building\
    \ the user class\n\nThe User.php class is just like the other service classes\
    \ in that it extends the DatabaseConnector class for all database communication.\
    \ Here is the skeleton of user class:\n\n```\n<?php\n\nrequire_once 'DatabaseConnector.php';\n\
    \nclass User extends DatabaseConnector\n{\n function User()\n {\n ...\n }\n}\n\
    \n?>\n```"
  merge: -1
  img_proc: true
- pgno: 498
  md: "# login method\n\nThe first and only method in this class is login. This method\
    \ accepts two arguments: the username and password to validate. The first part\
    \ of this method is to create a new connection to the database:\n\n```\n/**\n\
    \ * Check user auth\n * @access remote\n * @returns status of user login attempt\n\
    \ */\nfunction login($user, $pass)\n{\n\t$link = $this->getConnection();\n}\n\
    ```\n\nWhen the database connection is established, you can mark the user as not\
    \ logged in. This prevents any possible hacking attempts that could accidentally\
    \ make a user log in.\n\n```\n$loggedIn = false;\n```\n\nNext is the SQL query\
    \ that attempts to validate the username and password combo. The password is passed\
    \ into the md5 function because Flash sends the password in clear text, but the\
    \ database stores the md5 result.\n\n```\n$query = sprintf(\"SELECT * FROM users\
    \ WHERE username='%s' AND password=MD5('%s')\", $user, ($pass));\n```\n\nThe next\
    \ step is to make the database call and store the response in the $result variable,\
    \ as shown in the following code:\n\n```\n$result = mysql_query($query, $link);\n\
    ```\n\nOnce the response is stored, a conditional statement is used to determine\
    \ if any rows were returned. If a row is returned, it means the data is valid\
    \ and the user has been authenticated based on the credentials he or she passed\
    \ along.\n\nWhen a valid response is found, the $loggedIn variable is set as true\
    \ to inform Flash that the user is, in fact, valid and has now successfully logged\
    \ in.\n\n```\nif(mysql_num_rows($result) > 0)\n{\n\t$loggedIn = true;\n}\n```\n\
    \nThe last step is to return the result so Flash can act accordingly.\n\n```\n\
    return array('response' => $loggedIn);\n```"
  merge: -1
  img_proc: true
- pgno: 499
  md: 'Now that you have completed the PHP class, the next step is to test it. For
    this test you can use the service browser that is included with AMFPHP. You will
    find that browser at a URL similar to the following, depending on where you installed
    the source:


    ```

    http://localhost/flashphp/amfphp/browser/

    ```


    Last, here is the complete User class, which should be saved as User.php in the
    services directory of your AMFPHP installation if you haven''t already done so:


    ```

    <?php

    require_once ''DatabaseConnector.php'';

    class User extends DatabaseConnector

    {

    /**

    * Check user auth

    * @access remote

    * @returns status of user login attempt

    */

    function login($user, $pass)

    {

    $link = $this->getConnection();

    $loggedIn = false;

    $query = sprintf("SELECT * FROM users WHERE username=''%s'' AND password=MD5(''%s'')",
    $user, ($pass));

    $result = mysql_query($query, $link);

    if(mysql_num_rows($result) > 0)

    {

    $loggedIn = true;

    }

    return array(''response'' => $loggedIn);

    }

    }

    ?>

    ```


    # Adding remoting to the login component


    Now that you have completed the PHP User class, the next step is to modify the
    existing login component to use this new service class.


    The first step is to add the gateway variable and URL where the gateway.php file
    can be found on your development server.'
