    # Using PHP to Develop an RSS Reader


    RSS readers are a very popular item, and applications can be found for nearly
    every device that is Web enabled. They can be found on everything from a browser
    on your desk to the phone in your pocket.


    RSS is a group of Web feeds used to publish frequently updated content such as
    entries, news headlines, podcasts, or entertainment. Another way to think of RSS
    is someone delivering the daily news directly to you; the only difference is there
    is no limit to the amount of feeds you can subscribe to.


    Following is a look at the RSS application you will develop and how it will function,
    as shown in Figure 11.5.


    # FIGURE 11.5


    The RSS reader with a PHP delivery system


