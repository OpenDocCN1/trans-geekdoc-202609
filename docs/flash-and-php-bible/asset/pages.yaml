  md: '```

    var bmp:BitmapData = new BitmapData(width, height, true,

    0xFFFFFF);

    bmp.draw(penMC);

    ```


    After the new bitmap is created, you can build a loop that will scan the bitmap
    and grab the color

    of each pixel.


    ```

    var xml:String = "<points>";

    for(var i:uint=0; i < width; i++)

    {

    for(var j:uint=0; j < height; j++)

    {

    var color:String = bmp.getPixel(i, j).toString(16);

    if(color == "0")

    {

    color = "FFFFFF";

    }

    xml += "<point>";

    xml += "\t<x>" + i + "</x>";

    xml += "\t<y>" + j + "</y>";

    xml += "\t<c>" + color + "</c>";

    xml += "</point>";

    }

    }

    xml += "</points>";

    ```


    The color data is stored in a custom XML document that is sent off to PHP once
    the entire image is

    scanned. The variables are stored in a new instance of the URLVariables object
    and are passed

    to PHP in POST data format.


    ```

    var urlVariables:URLVariables = new URLVariables();

    urlVariables.width = width;

    urlVariables.height = height;

    urlVariables.pointData = xml;

    var urlRequest:URLRequest = new URLRequest(phpFile);

    urlRequest.method = URLRequestMethod.POST;

    urlRequest.data = urlVariables;

    sendToURL(urlRequest);

    ```


    The response is sent to PHP using the sendToURL method. This silently calls the
    Web server and

    does not expect any response. The reason for using this method is because the
    request will be fairly

    large if the rendered image has a lot of pixel data.'
