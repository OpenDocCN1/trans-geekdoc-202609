  md: 'Here is a continuation of the previous example, but this time it saves the
    JPG file to the Web server. By adding a second argument to the `imagejpeg()` function,
    which is a filename, the image is saved with the filename sample.jpg instead of
    being output to the browser.


    ```

    $image = imagecreate(250, 80);

    $bgColor = imagecolorallocate($image, 255, 0, 120);

    header("Content-Type: image/jpeg");

    imagejpeg($image, ''./sample.jpg'');

    ```


    While these examples are fairly simple they should give you an idea of how to
    work with the GD library. If you have the other libraries installed, you can render
    text on those images among many other very interesting results. The GD library
    is a great feature of PHP and really has come in handy for many tasks, no matter
    how large.


