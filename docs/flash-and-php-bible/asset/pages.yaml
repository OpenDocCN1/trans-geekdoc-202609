- pgno: 212
  md: '# Chapter 9


    # Working with Third-Party Libraries


    +   - Going over third-party libraries

    +   - Installing third-party libraries

    +   - Using third-party libraries

    +   - Glancing at AMFPHP


    The use of third-party libraries continues to grow as more demanding applications
    are being developed. Third-party libraries often solve a problem or make a common
    task easier to handle, which lets the developer focus on the more important aspects
    of the application.


    The first part of this chapter is devoted to explaining what third-party libraries
    are, how to use them, and what is needed to install a library.


    The second part of this chapter focuses on the use of AMFPHP in Flash. AMFPHP
    is basically a PHP library that offers a common link between Flash and a database,
    as well as other data types.


    # Going over Third-Party Libraries


    A third-party library is a custom package or piece of code that is developed by
    a company or organization to work with another company’s product. For example,
    if you look at the Firefox Web browser, there is a series of plug-ins and enhancements
    that are released by developers not working for Mozilla.


    Developers have different views on third-party libraries; one of the most important
    concerns about these libraries is security. You have to be careful working with
    other portions of code, especially if you don’t have the time or expertise to
    thoroughly investigate how that code functions.


    Security concerns are even more important when you don’t know the party that developed
    the library or if the library itself is connected to some secure aspect of your
    application.


    For example, it’s not a good idea to use a cookie or session library from an unknown
    developer. Doing so can introduce security holes in your application.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'There are some notable exceptions to working with third-party libraries and
    secure applications. For example, if you are building a store application, it
    is a reasonable guess that you will be interacting with some form of a merchant
    system, such as Authorize.net, Miva, or PayPal.


    These systems offer third-party libraries that you can easily connect to your
    application and are known to be secure because they have been thoroughly tested
    in various environments.


    # Other types of third-party libraries


    These external libraries are not limited to security or data handling. This is
    due to the fact that Flash is a design program as well. There are many excellent
    third-party libraries available to speed up the development and design process.


    In some cases, these external libraries provide functionality that isn''t possible
    directly in Flash/ActionScript.


    # Commercial Flash libraries


    There are some libraries being built that have commercial licenses, which means
    you get more extensively developed code. You won''t have a problem getting support
    for these libraries.


    For example, gskinner com has a robust spell-check library and component set that
    is available for purchase. This library allows you to build a real-time spell-check
    engine into your application with only a few lines of code. You can find more
    information about the gskinner Spell Check library at the company''s Web site
    At www.gskinner.com/products/sp1/.


    # Open source Flash libraries


    You will also find a large selection of free open source libraries for all aspects
    of application development and deployment. One example of an open source library
    is AMFPHP, which is examined in detail in the section “Glancing at AMFPHP”


    There are many other open source libraries available, such as MCtweener, which
    is similar to the included Tween library with more functionality. Also, the project
    documentation contains a lot of example code.


    A few other open source libraries available to assist in your development process
    are shown in Table 9.1.


    | Red5 | Open Source Flash Server | http://osflash.org/red5 |

    | --- | --- | --- |

    | Papervision3D | Open Source 3D engine | http://code.google.com/p/papervision3d/
    |

    | as3corelib | AS3 library for several basic utilities | http://code.google.com/p/as3corelib/
    |'
