- pgno: 433
  md: '# # FIGURE 16.3

    Code editor found in the Zend Studio IDE


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_433_0.png)


    # # Optimizing Apache


    The process of optimizing Apache is broken up into four pieces. This allows the
    developer to focus on each specific step rather than forcing them to modify every
    aspect of the server. In rare cases you will only see minimal performance updates,
    but will notice it more as the application and demand continue to grow.


    # # Hardware


    The first place to look when attempting to optimize Apache is the hardware it
    runs on. For example, Apache consumes a lot of memory over time. More memory can
    be a benefit here because it will be able to properly maintain itself.


    # # Dedicated server


    Make sure Apache is running on a dedicated server. This technically includes the
    development install that you learned about in the previous section. It is important
    to understand the development install version of Apache doesn''t consume that
    many resources, being a single-user product. It is best to let Apache have the
    entire server to run more efficiently. Enterprise (large) applications will oftentimes
    run a stand-alone server to handle the Web traffic.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# Configuration files


    Modifying the configuration files (*.conf) can produce a performance increase
    if you remove directives that are not being used. As you learn the configuration
    layout, you can remove the comments, which will make it easier to look at it in
    the long run.


    Apache provides a series of configuration starter files, but try to avoid the
    high-performance version because it actually becomes less efficient in the long
    run. The reason is because this version overly optimizes Apache, which forces
    it to run less efficiently unless you are experiencing very high traffic.


    # Logging and errors


    Whenever possible try to limit the amount of log usage. You can either disable
    logging altogether or limit the amount of information that is written to the logs.
    Errors are harder to trace because Apache does not inform you of these issues.
    In most cases, however, when a server is functioning properly this is not a problem.


    If you choose to enable logging, make sure you edit those files on a different
    machine because the process of opening and parsing these sometimes large files
    can have a performance impact.


    # MaxClients


    You can modify the MaxClients directive in the httpd.conf configuration file to
    increase performance, but be aware that any client attempting to connect after
    the limit is hit will be unable to view your site. In rare cases, this may not
    be a bad thing because it will preserve the performance for the existing users.


    ```

    <IfModule prefork.c>

    StartServers 8

    MinSpareServers 5

    MaxSpareServers 20

    MaxClients 150

    MaxRequestsPerChild 1000

    </IfModule>

    ```


    > **NOTE** The MaxClients directive only applies when the prefork module is configured
    and enabled.


    There are other ways to optimize Apache, but short of adding additional hardware
    and cost to your organization, this list will have your server running much more
    efficiently.


    # Optimizing MySQL


    Now that you have optimized PHP and the Apache Web server, the next logical place
    to optimize is MySQL. You can optimize MySQL after it is installed, but there
    are some good practices to keep in mind prior to installing it, when possible.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# ## Better performance from installation


    Choosing the best compiler for your system when you build MySQL can usually get
    you 10 to 30 percent better performance. Compile MySQL with only the character
    sets and options you intend to use. Oftentimes a quick evaluation of your intended
    use can result in better performance, because at a glance you can determine which
    features you will and will not use.


    The MySQL documentation has various tips on better performance, and as you continue
    to implement more of them you will want to run the compiled binary using the MySQL
    benchmark test to truly determine if the modifications will result in better performance.


    MySQL is a long road application. This means you want better performance overall
    and not just for very quick actions. For example, assume you have a table with
    100,000 rows, which is not that uncommon in large applications. Performing a search
    on this table will take some time, so a tuned MySQL with fast access in mind will
    actually be the bottleneck. It is better to have MySQL tuned with long-term processes
    in mind to work with data in these volumes.


    # ## Logging slow queries


    One of the best ways to locate bottlenecks in your MySQL database is to enable
    logging when needed. It is important to understand that logging in itself is a
    performance killer, but sometimes is necessary to fix other issues.


    MySQL logs slow queries to a log file. If you tail this file, which is used to
    actively watch the flow, you will be informed of slow queries. You can also let
    this log fill and then test it later, depending on how active your system is.


    ```

    tail -f /var/lib/mysql/192-168-1-107-slow.log

    ```


    The path of this slow query log file will be different depending on your environment.


    > > NOTE Windows does not offer a “tail” command by default, but you can install
    the Server Tools available from Microsoft.


    > > NOTE You may need to enable “slow query logging” in the configuration files
    of MySQL.


    # ## Checking tables


    Another way to ensure a database is running properly is to check the table health,
    by issuing the following command in the prompt. Replace `table_name` with the
    actual name of the table that you want to check.


    ```

    CHECK TABLE table_name

    ```


    For example:


    ```

    mysql> check table pol11;

    +--------+---------+-----------+----------+

    | Table  | Op      | Msg_type  | Msg_text |

    +--------+---------+-----------+----------+

    ```'
  merge: -1
  img_proc: true
- pgno: 436
  md: '```

    +-------+-------+---------+-------+

    | book.poll | check | status | OK |

    +-------+-------+---------+-------+

    1 row in set (0.00 sec)

    ```


    # Limit startup options


    Another way to get better performance out of MySQL is to limit the options that
    load when started. MySQL ships with various options for each and every use case,
    but it is safe to say you will not use all of them. Similar to Apache, if you
    modify the configuration files in MySQL, you will notice better performance.


    # Additional tools


    The MySQL development group provides many free profiling and administration tools.
    These tools can be downloaded from the main MySQL Web site and will help you optimize
    and monitor your databases remotely. The advantage of using these tools is not
    having to monitor your server using basic command-line tools. These GUI-enabled
    tools allow you to understand what your Web server is doing from a visual perspective,
    as shown in Figure 16.4.


    # FIGURE 16.4 The MySQL Query Browser


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_436_0.png)'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# Caching


    The topic of caching is normally looked at once you experience bottlenecks in
    an application, but you can install caching solutions before a problem occurs.


    # Working with memcached


    One of the bottlenecks in server-side scripts is the database. You have the ability
    to tweak the configuration, which you did in the previous section. Sometimes this
    can only go so far as a system continues to grow.


    The answer to this problem is to install software to help deal with database slowdowns,
    such as memcached, which is a high-performance memory object caching system. This
    system is built with the intent to speed up dynamic Web applications by removing
    database load, which is encountered more often as the system continues to grow.
    You can download the latest version of memcached from danga.com at www.danga.com/memcached/.


    # Installing memcached on Linux


    The following section will cover the installation process of memcached on a Linux
    Web server. This version requires another library to be installed, which will
    also be covered.


    # Installing libevent


    Before you install memcached, you need to install a dependency library. This is
    libevent, which can be downloaded at www.monkey.org/~provos/libevent/.


    Unpack the archive and perform the same installation steps you have seen in the
    previous examples when installing applications.


    ```

    $ tar -xvf libevent-1.3b.tar.gz

    ```


    Change the current directory to the newly created libevent to continue the installation
    process.


    ```

    $ cd libevent-1.3b

    ```


    The last step to setting up the dependency is to configure and build the necessary
    install files and install the libevent library.


    ```

    $ ./configure

    $ make

    $ make install

    ```


    # Installing memcached


    Once libevent is installed, you can continue with the installation of memcached.


    ```

    $ gunzip memcached-x.x.x.tar.gz

    ```'
  merge: -1
  img_proc: true
