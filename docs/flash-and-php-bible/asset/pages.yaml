    > CROSS-REF Some of the code in the previous section is explained in greater detail
    in Chapter 4.


    # Calling the PHP


    The call to the PHP is broken up into three classes: the URLVariables, URLRequest,
    and URLLoader classes, the jobs of which are to set up a container for the contact
    form data, make a request object, and finally call the PHP file.


    The URLVariables class stores the contact form data in an object format name.value,
    which is then attached to the data property of the URLRequest.


    The URLRequest sets up a request method using the static POST property of the
    URLRequestMethod class, which tells Flash whether to send the data in GET or POST
    format. GET sends the data out attached to the end of the URL:


    ```

    file.php?var1=value1&var2=value2

    ```


    POST sends the data in the request, which in most cases is more secure.


    The last class used in this contact form is URLLoader. This class adds the event
    listener that is called when the PHP is fully loaded and any expected response
    has been returned. This class also makes a call to the load() method, passing
    along a reference to the URLRequest. This ultimately makes the call to the PHP
    and passes along the contact form variables you have assigned. That is all that''s
    required to set up and make the call to the PHP.


    # Contact form event handlers


    The next step in the process is to set up the event handler that is called when
    the PHP sends a response.


    ```

    function sendHandler(e:Event):void

    {

    var loader:URLLoader = URLLoader(e.target);

    var variables:URLVariables = new URLVariables(loader.data);


    if(variables.resultCode == "SENT")

    {

    form.statusTxt.htmlText = "<font color=\"#009933\">Email" +

    " sent, thank you.</font>";

    }

    ```'
