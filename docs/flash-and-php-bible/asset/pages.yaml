- pgno: 58
  md: '# # Chapter 2


    # # Exploring Flash and PHP


    +   **IN THIS CHAPTER**

    +   - Introducing the Web server

    +   - Exploring PHP

    +   - Exploring the basics of MySQL

    +   - Exploring Flash


    If you have installed all of the components on the server, you can configure the
