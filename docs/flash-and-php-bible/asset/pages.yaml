    # Building the database and MySQL tables


    Start by opening your favorite database editor and create a new database for this
    project. You can name this database anything you prefer. I used `book_videoplayer`,
    but that is only a suggestion.


    After the database is created, you can start adding the table schema structure
    for the videos and categories data. For this application the tables have already
    been defined, but feel free to look them over to gain a better understanding of
    what they are responsible for.


    The tables in this application are split up to ensure they are optimized and to
    easily understand which table is responsible for each task. It is best to split
    functionality in multiple tables, also referred to as normalizing. Doing so ensures
    your database will be the most efficient and allows it to expand.


    The table structure in this application is straightforward. For example, the video
    name, description, and source references are found in the videos table, which
    is constructed similar to the following:'
