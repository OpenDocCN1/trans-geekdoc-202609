  img_proc: true
- pgno: 95
  md: '# FIGURE 3.3


    Here is the portion of the phpinfo file that explains the MySQL installation available.


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_95_0.png)


    NOTE The MySQL section in the phpinfo file will not be visible at all if not installed.


    Assuming that MySQL is properly installed and running, you can move on to the
    next section, which explains how to connect PHP to a MySQL database.


    # Connecting to MySQL


    The process of connecting to MySQL from PHP is fairly simple. The first step is
    to obtain the connection information from your server admin or, if you just installed,
    the login details would be the defaults.


    Here is the very basic, no frills code to connect to a MySQL database.


    ```

    <?php

    $host = "localhost";

    $user = "";

    $pass = "";

    ```'
