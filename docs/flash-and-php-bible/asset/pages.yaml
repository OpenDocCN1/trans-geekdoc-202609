  md: "# # Developing the LoginWindow class\n\nNow that the file is created you can\
    \ begin to build the login code. The first step is to construct the class skeleton\
    \ and extend the `MovieClip`, which is the same process you have been following\
    \ in the previous sections.\n\nThis class not only needs to import the standard\
    \ `MovieClip` class, but also is going to require some new ones. These new classes\
    \ will be used to create the actions for disabling the interface and handling\
    \ the mouse interaction.\n\n```\npackage\n{\n    import flash.display.MovieClip;\n\
    \    import flash.geom.Rectangle;\n    import flash.events.Event;\n    import\
    \ flash.events.MouseEvent;\n    import flash.net.*;\n\n    public class LoginWindow\
    \ extends MovieClip\n    {\n        function LoginWindow()\n        {\n      \
    \      ...\n        }\n    }\n}\n```\n\nThe properties for this class are responsible\
    \ for event handling and creating references to the MovieClips created at runtime.\n\
    \n```\npublic var data:Object;\n\nprivate var _visible:Boolean = false;\nprivate\
    \ var container:MovieClip;\nprivate var blocker:MovieClip = null;\n\npublic static\
    \ var LOGIN_ATTEMPT:String = \"onLoginAttempt\";\n```\n\n# ## LoginWindow constructor\n\
    \nThe constructor of the LoginWindow class is where the container property is\
    \ set. This is also where the event handlers for the buttons are placed. This\
    \ is done to ensure the buttons are assigned once visible to ensure the code is\
    \ stable.\n\n```\nfunction LoginWindow()\n{\n    container = this;\n\n    loginMC.resetBtn.addEventListener(MouseEvent.CLICK,\n\
    \        resetHandler);\n}\n```"
