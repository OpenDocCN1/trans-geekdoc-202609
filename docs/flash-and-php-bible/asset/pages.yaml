- pgno: 112
  md: "After the XML file is completely loaded the xmlHandler function is called.\
    \ This function is where the XML file is read and the point where E4X is used.\n\
    \nThis function is a little more advanced than we have seen in previous code examples,\
    \ so the function will be broken down into more manageable pieces.\n\n```\nfunction\
    \ xmlHandler(e:Event):void\n{\n   var urlLoader:URLLoader = URLLoader(e.target);\n\
    \   var xml:XML = new XML(urlLoader.data);\n\n   // Loop through all items, ONLY\
    \ show items in stock\n   for each(var item in xml..item)\n   {\n      if(String(item..inStock)\
    \ == 'yes')\n      {\n         trace(\"Product: \" + item.name);\n         trace(\"\
    \\tSection: \" + item.section);\n         trace(\"\\tPrice: \" + item.price);\n\
    \      }\n   }\n}\n```\n\nThe first step in this function is to grab the loaded\
    \ data and pass it to the XML class, which ensures that you will be working with\
    \ valid XML objects in the next sections.\n\n```\nvar urlLoader:URLLoader = URLLoader(e.target);\n\
    var xml:XML = new XML(urlLoader.data);\n```\n\nA `for ..each` loop is used to\
    \ walk through the XML file and look for items that are in stock. This loop also\
    \ has a special operator .. “descendant accessor” which is looking for each item\
    \ in the XML object. The “descendant accessor” was introduced in ActionScript\
    \ 3 for accessing descendants or children and children within children. This is\
    \ done using two dot operators in succession (..) followed by the name of the\
    \ descendent element.\n\n```\nfor each(var item in xml..item) { ... }\n```\n\n\
    This is a huge advancement from ActionScript 2 where you would set up nested loops\
    \ and traverse the entire XML document. However one thing to note is that the\
    \ descendant accessor is case sensitive so it is best to use a consistent naming\
    \ convention.\n\n```\n<items>\n<item>\n<objectName>Example</objectName>\n</item>\n\
    </items>\n```\n\nThe most common naming convention for the node names when working\
    \ with XML is camel-case. Camel-case is starting the first word with a lowercase\
    \ character and then the first letter of every word after that is uppercase."
