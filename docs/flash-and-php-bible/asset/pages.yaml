    \ efficient.\n\nFunctions allow you to place repetitive tasks in a nice little\
    \ container that you can call at any time as long as the function is accessible.\n\
    \nHere is an example function that adds two numbers and returns the sum:\n\n```\n\
    function addNumbers($num1, $num2)\n{\n    // return the sum of the two numbers\n\
    \    return ($num1 + $num2);\n}\n```\n\nYou call a function by referencing the\
    \ function name and passing any arguments the function requires. This example\
    \ returns 10 as the sum."
