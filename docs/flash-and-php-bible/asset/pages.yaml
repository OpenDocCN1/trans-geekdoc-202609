    # Using custom error documents


    When you view a URL on a Web site, Apache serves a page to you based on your request.
    By default, if Apache is asked to serve a file it can''t find, it returns an ugly
    404 page that is not very informative and actually causes a potential security
    concern.


    As you can see in Figure 2.2, Apache has printed the server information for the
    world to see. Now this isn''t a huge security concern, but every piece of information
    can add up to a major problem.


    # FIGURE 2.2

    Default error page from Apache


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_63_0.png)


    A more important issue with using the standard error pages is the fact the user
    is presented with a useless page. For example, the user now knows the file doesn''t
    exist, but has nowhere to go and no idea what could be the problem. Oddly enough,
    if a user is shown a 404 page he or she will usually not stick around, and that
    means an abandoned user for your site.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# # Modifying Apache


    Luckily, Apache allows you to modify this default error page. Some hosts allow
    you to modify the file using the included control panel that they installed when
    you purchased the server. In this case, however, the development server requires
    you to manually configure the majority of it.


    Using custom error documents is as simple as adding the modification to a .htaccess
    file. This file is usually stored in the Document Root to ensure all files will
    see the file.


    The following code is the syntax required to modify the error document.


    ```

    # Customized Error Handler

    ErrorDocument 204 /error.html

    ErrorDocument 301 /error.html

    ErrorDocument 302 /error.html

    ErrorDocument 400 /error.html

    ErrorDocument 401 /error.html

    ErrorDocument 403 /error.html

    ErrorDocument 404 /error.html

    ErrorDocument 500 /error.html

    ErrorDocument 501 /error.html

    ErrorDocument 502 /error.html

    ErrorDocument 503 /error.html

    ```


    As you can see, the error documents will be replaced by one file. You can, of
    course, point to a separate file for each error encountered. If you do not assign
    a specific error page, Apache reverts to its default. The previous list is a robust
    record of possible error codes, but it is not a complete one.


    # ## Dynamic error documents


    Using PHP, you can create a dynamic error handling system. The idea is to call
    one page like you did in the previous example, with the exception that a variable
    will be passed along to notify that page of which error was encountered.


    You start by modifying the error handler in the .htaccess file, such as:


    ```

    # Error Handler, request is sent to a php file

    ErrorDocument 204 /errorHandler.php?e=204

    ErrorDocument 301 /errorHandler.php?e=301

    ErrorDocument 302 /errorHandler.php?e=302

    ErrorDocument 400 /errorHandler.php?e=400

    ErrorDocument 401 /errorHandler.php?e=401

    ErrorDocument 403 /errorHandler.php?e=403

    ErrorDocument 404 /errorHandler.php?e=404

    ErrorDocument 500 /errorHandler.php?e=500

    ErrorDocument 501 /errorHandler.php?e=501

    ErrorDocument 502 /errorHandler.php?e=502

    ErrorDocument 503 /errorHandler.php?e=503

    ```'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'That code tells Apache to redirect those errors to the errorHandler.php file,
