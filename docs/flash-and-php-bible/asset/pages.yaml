    \ text/plain;q=0.8, image/png\nPragma: no-cache\nContent-Length: 327\nConnection:\
    \ keep-alive\nHost: www.example.org\n```\n\n# Two-way communication\n\nIn some\
    \ cases, you will want to receive a response when you send data. One would be\
    \ when attempting to load a specific user's data from a database. You would pass\
    \ a user id and expect to receive some data type containing that user's information.\n\
    \nThe response of a two-way communication is handled by assigning an event listener\
    \ and attaching a handler function.\n\n```\nvar serverFile:String = \"http://localhost/callLink.php\"\
    ;\nvar variables:URLVariables = new URLVariables();\nvariables.id = 1004;\nvariables.user\
