- pgno: 500
  md: "```\nvar gateway:NetConnection;\nvar gatewayURL:String = \"http://localhost/amfphp/gateway.php\"\
    ;\n```\n\nThe original example did the username validation directly within the\
    \ Flash file. While this was functional, it wasn't very practical because only\
    \ one login or password can be used.\n\n# loginHandler method\n\nThis new system\
    \ modifies the existing loginHandler function by adding a remoting service call,\
    \ sending the username and password that was captured by the login window component.\n\
    \n```\nfunction loginHandler(e:Event):void\n{\n    trace(\"Do Login\");\n    trace(\"\
    Username: \" + login.data.username);\n    trace(\"Password: \" + login.data.password);\n\
    \n    var responder:Responder = new Responder(loginRespHandler,\n    onFault);\n\
    \    gateway = new NetConnection();\n    gateway.connect(gatewayURL);\n    gateway.call(\"\
    User.login\", responder,\n    login.data.username,\n    login.data.password\n\
    \    );\n}\n```\n\nThe Responder class needs a response handler defined, so the\
    \ next function handles this service response. For this example, the service will\
    \ either return a Boolean for whether the user is logged in or not, or an error\
    \ if something goes wrong.\n\n```\nfunction loginRespHandler(o:Object):void\n\
    {\n    ...\n}\n```\n\nA simple conditional statement is used to determine if the\
    \ user is logged in based on the response from the remoting service.\n\n# Handling\
    \ the login response\n\nIf the user is logged in, a call to the close method of\
    \ the login component is made to hide the login window and enable the application\
    \ interface.\n\n```\nfunction loginRespHandler(o:Object):void\n{\n    if(o.response\
    \ == true)\n    {\n    login.close();\n    }\n}\n```"
