- pgno: 310
  md: '# # Chapter 12


    # Developing Real-World Applications


    +   - Using PayPal in Flash

    +   - Developing a shopping cart

    +   - Searching Amazon

    +   - Developing a photo gallery


    In this chapter, you learn about developing complete applications from the ground
    up. The focus is on class-based designs that you can easily update later on. The
    main aspect of this chapter will be how to use Flash and PHP to develop these
    applications.


    This chapter is broken up into four applications: a PayPal cart, custom shopping
    cart, Amazon searcher, and a flickr photo gallery searcher. Each application section
    starts with the PHP code and continues with the ActionScript. Building an application
    like this makes it easier to test as you build and reduces the amount time in
    the development process.


    The examples in this chapter are built using custom classes, which are covered
    in Chapter 9. If you haven''t read that chapter yet, I strongly recommend you
    do so before continuing on in this chapter. Of course, if you have used classes
    in the past, then by all means continue on.


    # # Understanding Real-World Applications


    A real-world application is one that has been designed, tested, and deployed with
    the intention that other users will be using it.


    Just like in a real application there will be some sections that use a third-party
    Application Programming Interface (API) to load in and search data. When working
    with an API it is common to find a list of the methods and calls allowed as shown
    in Figure 12.1.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/d9d48cd53eee0fbc1ebc363c322fac2c_311_0.png)


    An open API doesn''t always mean anyone can gain access. For example, with flickr
    you are required to pass along a key that authorizes a request. This is not only
    to lock down certain aspects of an API, but also stops spamming and automated
    responses that could result in the API being disabled.


    The Amazon and flickr examples in this chapter use those APIs, but the first thing
    to look at are the rules and requirements for the API that you are using.


    # Using PayPal in Flash


    Working with PayPal in Flash is similar to HTML because PayPal offers a common
    set of connection and access abilities. However, one advantage to developing the
    solution in Flash is the ability to enhance the user experience as Flash offers
    more fluid communications with other services because it does not need to reload
    the entire page or open any additional windows.'
