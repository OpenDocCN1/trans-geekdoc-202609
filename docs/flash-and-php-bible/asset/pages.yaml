- pgno: 229
  md: "The appendText method is the AS3 replacement to the \"+=\" way of concatenating\
    \ strings in older versions of ActionScript. This method is much faster, which\
    \ means quicker execution of code.\n\n```\nfunction onFault(responds:Object):void\n\
