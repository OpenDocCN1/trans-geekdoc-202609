- pgno: 127
  md: 'That is all the code that is needed to develop a fully functional contact form
    using Flash and PHP. You can expand on this example and give the contact form
    a lot more functionality. A few things to think about adding would be a more robust
    validation process, more form fields, and possibly more informative responses
    to the user.


    # Keep security in mind


    One very important element to note about this contact form example is the code
    does not honor security procedures and actually lets the user pass any data to
    PHP. A more robust and live example would require a much stronger level of security;
    however, for demonstration purposes overall security has been left out.


    # Login Module in Flash


    More often than not you will want to have a secure portion to a Web site. A very
    popular example of this would be a review section for a photographer where a client
    can log in and look at the photos.


    The form portion of this application is almost identical to the contact form.
    You need a Username and Password box and a Submit button to fire off the login
    handler routine.


    Here is a sample layout that can be found in the starting file, or you can create
    it from scratch.


    The instance names for this example are displayed in Table 5.1.


    | Form Component | Description |

    | :--- | :--- |

    | usernameTxt | Username to be logged in |

    | passwordTxt | Password to be attempted |

    | resetBtn | Reset button, clears the fields |

    | loginBtn | Login button, fire the loginHandler |


    Now that you have the form visually complete you can move on to the ActionScript,
    which makes the form functional.


    # Code skeleton


    In previous examples, you looked at all of the code in one long section, but sometimes
    that can be overwhelming. Looking at the skeleton of code offers a quick way to
    evaluate the program variables, functions, and other elements.'
  merge: -1
  img_proc: true
