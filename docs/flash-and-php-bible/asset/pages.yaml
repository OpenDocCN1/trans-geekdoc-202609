- pgno: 185
  md: '# Security trust


    A trust uses the crossdomain.xml file with the ports that are allowed, such as:


    ```

    <?xml version="1.0"?>

    <!DOCTYPE cross-domain-policy SYSTEM

    "http://www.macromedia.com/xml/dtds/cross-domain-policy.dtd">

    <cross-domain-policy>

    <allow-access-from domain="*" to-ports="8888" />

    </cross-domain-policy>

    ```


    This access file is allowing any client to connect on port 8888 and no other.
    You can also define a domain if this socket application will be accessible only
    from another Web site, such as.


    ```

    <?xml version="1.0"?>

    <!DOCTYPE cross-domain-policy SYSTEM

    "http://www.macromedia.com/xml/dtds/cross-domain-policy.dtd">

    <cross-domain-policy>

    <allow-access-from domain="anothersite.com" to-ports="8888" />

    </cross-domain-policy>

    ```


    The second part of the security trust is a call to allowDomain in the Flash file.
    This method of the Security class is responsible for defining a domain that is
    allowed to connect to this client. This connection will only occur if the remote
    site has a proper crossdomain file.


    ```

    Security.allowDomain("example.com");

    ```


    # Loading the policy file


    In rare cases, the cross-domain policy file is not in the default location, so
    a call to loadPolicyFile can be made to inform Flash where to find the crossdomain.xml
    file.


    ```

    Security.loadPolicyFile("http://example.com/newloc/crossdomain

    .xml");

    ```


    You should now know how to set up a client-based socket connection in Flash. As
    you can see, the majority of the code used in a socket connection is handled by
    Flash.


    As stated in the beginning of this section, the code used to build a socket connection
    can be reused throughout your projects.


    # Using a class for socket connections


    To better understand socket connections in Flash, let''s start off by building
    a basic socket example. Then once the basics are in place, the next section will
    cover building a complete socket-based chat application using Flash and PHP.'
