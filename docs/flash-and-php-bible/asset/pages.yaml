    Now you want to load this file and display only the items that are in stock. Using
    E4X this will be a very simple task.


    You can start off with the standard loading sequence that has been seen in previous
    examples. The path to the XML file we want to load in this example is “storeItems.xml”.


    ```

    var xmlFile:String = "storeItems.xml";

    loadXML();


    function loadXML():void

    {

    var urlRequest:URLRequest = new URLRequest(xmlFile);

