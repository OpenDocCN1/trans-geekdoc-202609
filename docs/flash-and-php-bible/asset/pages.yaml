- pgno: 143
  md: "That is all there is to working with shared objects in Flash. You now know\
    \ how to load, save, and delete shared objects and cookies in Flash.\n\n**NOTE:**\
    \ Shared objects can also be used in a remote setting, but require a more advanced\
    \ system.\n\n# # Discovering the benefits of using PHP cookies\n\nNow that you\
    \ have looked at using cookies in both PHP and Flash, look at some reasons why\
    \ using cookies in PHP is a better option. When working in Flash it would seem\
    \ that shared objects are the best option, but they aren't always.\n\nCookies\
    \ in PHP offer the ability to share them between both HTML and Flash sites. Shared\
    \ objects only are accessible from within Flash, which can be both good and bad.\
    \ The good side is that no other application can change the cookies. On the bad\
    \ side, it also means you can't share them and add a level of consistency between\
    \ your applications.\n\nThere is a pretty common workaround to this problem, however,\
    \ and that is to use regular cookies in Flash by passing them through a PHP middleman.\n\
    \nFirst, look at the PHP code that will pass the cookie data back to Flash.\n\n\
    ```\n```php\n<?php\nif(isset($_POST['act']) && $_POST['act'] == 'getcookie')\n\
    {\n    if(isset($_COOKIE[$_POST['cookieName']]))\n    {\n        print \"resp=\"\
    \ . $_COOKIE[$_POST['cookieName']];\n    }\n    else\n    {\n        print \"\
    resp=\" . \"cookie_not_found\";\n    }\n}\n?>\n```\n```\n\nThis code ensures the\
    \ proper POST data is sent before it continues. Assuming valid data is passed,\
    \ the next step is to determine if the cookie does, in fact, exist. Use a conditional\
    \ test to determine if cookie data or an error message will be sent to Flash.\n\
    \n```\n```\nif (isset($_COOKIE[$_POST['cookieName']]))\n{\n    print \"resp=\"\
    \ . $_COOKIE[$_POST['cookieName']];\n}\nelse\n{\n    print \"resp=\" . \"cookie_not_found\"\
    ;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 144
  md: "Either way, the variable passed in to Flash is “resp”. This way you can easily\
    \ program the ActionScript to handle the response accordingly.\n\nThe reason that\
    \ you use isset( ) in the first if statement is so PHP can’t accidentally send\
    \ a notice to Flash alerting the variable is not sent. This sort of application\
    \ is a very good candidate for XML, which is explained in depth in Chapter 3.\
    \ XML would make it so only the value you are interested in would be returned.\
    \ For this simple example, you will continue with a standard print-based return.\n\
    \nNow that you have the PHP in place you can move on to the ActionScript. The\
    \ ActionScript makes a call to the PHP and expects a cookie or error to be returned.\n\
    \n```\n```actionscript\nvar phpFile:String =\n\t\"http://localhost/ch05/cookies/loadCookie.php\"\
    ;\n\nvar variables:URLVariables = new URLVariables();\nvariables.act = 'getcookie';\n\
    variables.cookieName = 'sample';\n\nvar urlRequest:URLRequest = new URLRequest(phpFile);\n\
    urlRequest.method = URLRequestMethod.POST;\nurlRequest.data = variables;\n\nvar\
    \ loader:URLLoader = new URLLoader();\nloader.addEventListener(Event.COMPLETE,\
    \ serverHandler);\nloader.load(urlRequest);\n\nfunction serverHandler(e:Event):void\n\
    {\n\tvar loader:URLLoader = URLLoader(e.target);\n\tvar variables:URLVariables\
    \ = new URLVariables(loader.data);\n\n\tif(variables.resp == 'cookie_not_found')\n\
    \t{\n\t\ttrace(\"Requested Cookie Not Found\");\n\t}\n\telse\n\t{\n\t\ttrace(\"\
    Cookie Data: \" + variables.resp);\n\t}\n}\n```\n```\n\nThe overall call to the\
    \ server is similar to other calls in this book. The focus on this call is the\
    \ variables passed to the PHP and the response. You use the URLVariables class\
    \ to assign the act and cookieName variables. The act variable tells PHP that\
    \ your request is valid, and the cookieName variable contains the name of the\
    \ cookie you are looking for.\n\n```\n```actionscript\nvar variables:URLVariables\
    \ = new URLVariables();\nvariables.act = 'getcookie';\nvariables.cookieName =\
    \ 'sample';\n```\n```"
  merge: -1
  img_proc: true
- pgno: 145
  md: "Just like the other loader examples, you need to assign a function to handle\
    \ the server response. This is the function that is called after the PHP passes\
    \ back either your cookie or an error message. Start by using the URLLoader class\
    \ to get the data contained in the response. You then make a call to the URLVariables\
    \ class, which returns an object of the response variables. In this case, you\
    \ are looking for the “resp” property. First, check to see if the response is\
    \ “cookie_not_found”, which is self-explanatory. More than likely, the cookie\
    \ will be set and the second trace statement would get called, but it is never\
    \ good programming to assume this. That is why that conditional statement is added.\n\
    \n```\nfunction serverHandler(e:Event):void\n{\n    var loader:URLLoader = URLLoader(e.target);\n\
    \    var variables:URLVariables = new URLVariables(loader.data);\n\n    if(variables.resp\
    \ == 'cookie_not_found')\n    {\n        trace(\"Requested Cookie Not Found\"\
    );\n    }\n    else\n    {\n        trace(\"Cookie Data: \" + variables.resp);\n\
    \    }\n}\n```\n\nYou can take this example to the next step by setting the cookie\
    \ if one is not found, or even pass along an array or object of cookie names to\
    \ quickly load all the cookies for a site. AMFPHP, which you will look at in Chapter\
    \ 8, would be a great way to load in multiple cookies.\n\nAs you can now see,\
    \ there are multiple ways to work with cookies in both PHP and Flash. You even\
    \ developed a common way in which both PHP and Flash can share the same cookie\
    \ data.\n\nNOTE Sharing cookie data still has the limitation that the PHP needs\
    \ to be on the domain you are loading the cookies from. One thing to be aware\
    \ of with this script is the fact that this simple example is not checking the\
    \ input passed to the PHP. You would certainly want to add that to a real-world\
    \ application.\n\n# Summary\n\nIn this chapter you learned how to load and work\
    \ with cookies in Flash and PHP. To start you learned how to load an existing\
    \ cookie from the user’s machine and then learned how to modify and update that\
    \ cookie.\n\nYou should now understand how to work with cookies in Flash and PHP\
    \ and understand why they are important when you develop an application."
  merge: -1
  img_proc: true
