  md: 'The actual SQL statement is fairly similar to others used in previous examples.
    There is a flashChat table within the database that happens to have four columns,
    but one of those is an auto_increment and doesn''t need to be defined in an INSERT
    statement.


    > **NOTE** In a more robust application, you would want to add a layer of security
    on data passed in from another source. It doesn''t matter if this is Flash, the
    browser, or a third-party service; it is always important.


    ```

    mysql_query ("INSERT INTO flashChat (username, message, dateAdded)

    VALUES (

    " . $username . "'',

    " . $message . "'',

    " . $date . ""

    ) ");

    ```


    > **CAUTION** The name dateAdded was used because data is a reserved word in MySQL
    and will cause an error in most cases. It is never a good idea to use reserved
    words for another use in any development language.


    The last step in this file is to return a response to Flash notifying that the
    message has been added and another message can now be added from that user. Overall,
    the messages.php file is pretty simple but it gets the job done.


    Here is the completed messages.php file for reference.


    ```

