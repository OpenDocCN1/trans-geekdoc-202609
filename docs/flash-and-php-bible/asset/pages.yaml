- pgno: 148
  md: '# Maintaining Security while

    Working with User Input


    # IN THIS CHAPTER


    +   - Using caution with user input

    +   - Cleaning user data

    +   - Storing data

    +   - Returning data

    +   - Understanding the Flash security sandbox


    Working with user input focuses on the best practices of

    storing and returning data while maintaining a high level of

    security.


    This chapter is broken into sections that focus on a specific aspect of hand-

    ling user data. This is not a step-based guide on working with user data,

    which can be found in Chapter 4. Instead, this chapter focuses on the

    specifics of security when handling that data.


    The subtopic covered in this chapter is working with and understanding the

    sandbox in Flash. Basically, the sandbox is a container that each application

    runs in, but the section goes into greater detail and provides visual examples

    to better explain the sandbox and how it affects your applications.


    The practices provided in this chapter can be adapted to future applications

    you develop. Maintaining a secure application is about as important as lock-

    ing your home before you leave. An application will technically still work if

    it is not secure. However, the lifespan of that application is not certain. There

    are many aspects to security in an application: sanitized data, secure logins,

    file storage, and exploitability, to name a few. In this chapter, the focus is

    the security of user input. User input is any piece of data the user can modify.

    This list of data includes cookies, logins, sessions, and file uploads.


    # Using Caution with User Input


    User data expands far beyond a simple text box on a contact form. Now that

    you know what data is considered user input, you’re probably wondering

    how something as harmless as a file upload system poses a security risk.


    As with most security, it isn’t the technology or feature that is flawed, but

    how it is implemented.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "# # Safely handling file uploads\n\nFor example, assume there is a basic PHP\
    \ file that accepts file uploads and stores the uploaded file information in a\
    \ database.\n\nThe first question to ask is what parts of this simple application\
    \ are potential security concerns?\n\n+   - The form itself?\n+   - The database\
    \ component?\n+   - The file being uploaded?\n\n# ## Checking for valid file extensions\n\
    \nThe uploaded file would be the least obvious point of a security breach, but\
    \ look at some sample code that explains how it can very easily become an issue.\
    \ A very common, but misleading attempt to secure the file uploading process is\
    \ to check for a valid extension, such as:\n\n```\n<?php\n$file = $_FILES[0];\n\
    \nif(strpos($file['name'], '.jpg') !== false)\n{\n    if(!move_uploaded_file($file['tmp_name'],\
    \ 'storage/'))\n    {\n        print \"File uploaded\";\n    }\n}\n\n?>\n```\n\
    \nAs you can see, the code is set up to look for the .jpg file extension. The\
    \ strpos function is used to return the index or placement of the checked value,\
    \ which in this example is .jpg. At first glance this seems pretty secure and\
    \ should stop malicious uploading, but it doesn't. This code doesn't care where\
    \ the file extension is, so you could have imagename.jpg.php as the filename and\
    \ it will pass. Even worse, if this is for a publicly accessible photo gallery,\
    \ that file can execute PHP freely because it is already on the server. The ability\
    \ to execute arbitrary code becomes a great concern when the malicious user is\
    \ able to place code directly on an unsuspecting server.\n\nImagine an image being\
    \ uploaded that is actually a PHP file with code such as the following:\n\n```\n\
    <?php\nerror_reporting(E_ALL);\n\nphpinfo();\n\nmysql_connect('localhost', 'anyuser',\
    \ 'anypass');\n?>\n```"
  merge: -1
