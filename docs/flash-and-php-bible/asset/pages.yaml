    # PHP for the photo gallery


    The PHP portion of this photo gallery application is built of three files. The
    first file is categories.php, which is a static representation of categories being
    sent to ActionScript.


    The first part of the code is the category in a multidimensional array format.
    The category items hold the name, id, and copyright information for each category.


    ```

    $categories = array(

    array("Boston", 1, "M. Keefe"),

    array("Landscapes", 2, "Other"),

    array("Las Vegas", 3, "M. Keefe"),

    array("Weddings", 4, "Other"),

    );

    ```


    The getCategories() function first sets a global reference to the $categories
    variable. The next step is to define a loop that is responsible for building the
    XML data passed back to ActionScript.


    ```

    function getCategories()

    {

    global $categories;


    $xml = "<categories>\n";


    for($i=0; $i < count($categories); $i++)

    {

    $xml .= " <category id=\"" .

    $categories[$i][1] . "\" name=\"" .

    $categories[$i][0] . "\" copyright=\"" .

    $categories[$i][2] . "\" />\n";

    }


    $xml .= "</categories>";


    return $xml;

    }

    ```'
