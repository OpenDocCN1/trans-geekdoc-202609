  md: "# FIGURE 7.3 A sample value from the magic_quotes_gpc property as seen in the\
    \ phpinfo() listing\n\n![](img/d9d48cd53eee0fbc1ebc363c322fac2c_160_0.png)\n\n\
    # Disabling magic_quotes\n\nIn less common server configurations this feature\
    \ cannot be turned off. A quick test to determine if that setting is enabled ensures\
