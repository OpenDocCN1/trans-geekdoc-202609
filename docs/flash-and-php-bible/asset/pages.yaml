    Now that you have an understanding of how to load static data from PHP into Flash,
    the next section expands on this static data format and introduces a MySQL database.


    # Connecting PHP to MySQL


    Loading data in Flash from a static PHP file is a great way to learn the process.
    However, a real-world application is probably not going to use that format. Data
    is always changing and no one wants to update PHP files by hand.


    # Determining the status of MySQL


    Before the connection to MySQL is established, ensure that MySQL is installed
    and properly running.


    > The default installation of MySQL leaves the password blank. This is okay for
    a testing site, but the password should never be left blank on a live server.


    The most common installation of MySQL for use in PHP is by including the MySQL
    library during the PHP installation process. This means the MySQL information
    will be displayed on the phpinfo, which was explained in the previous section.


    Checking for MySQL is done simply by creating a phpinfo test file and running
    it in your browser, as shown in Figure 3.3.


    ```

    <?php

    phpinfo();

    ?>

    ```


    This result is a massive HTML page that displays all of the information regarding
    the current installation of PHP. To determine the status of MySQL, search for
    "MySQL". Keep in mind there could be more than one.'
