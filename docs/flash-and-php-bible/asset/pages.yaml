    up the proper error handlers and look at ways to create a more usable setup for
    the end user.


    After security and configuration of the Web server are complete, you will look
    at an overview of PHP to better understand how everything works. MySQL usage and
    basic integration with PHP are explained using various examples with descriptions
    and explanations.


    The last section explores Flash, including class setup and overall IDE explanation.


    # ## Introduction to the Web Server


    In the Chapter 1, you learned how to set up a development server, which included
    the installation of PHP, MySQL, and Apache. This section is an overview of how
    the Web server is set up, as well as how to make the system more secure.


    # ## Working with .htaccess files


    The .htaccess file is used to modify how Apache functions for a specific directory.
    This file is similar to the httpd.conf file found in the global configuration
    of Apache, with the exception that it is not required and can be globally disabled,
    provided the admin modifies the settings of the Web server.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The syntax of this file is not very advanced. It is basically a text file that
    informs the Web server of specific modifications.


    For example, have you noticed a Web site that has specialized file extensions,
    such as the MediaTemple Web host, which has the following format?


    ```

    http://www.mediatemple.net/contact.mt

    ```


    Notice how the url has a .mt extension. This extension is not a standard file
    extension. This modification can be achieved using the .htaccess file:


    ```

    # use custom file extensions

    AddType application/x-httpd-php .me

    ```


    This modification can also be done using the httpd.conf file if you prefer to
    have the entire Web server be able to use this custom file extension.


    Apache handles many requests by default and can offer even more with additional
    modules installed. One module in particular allows you to have custom URLs, also
    commonly referred to as clean URLs.


    The possibilities with .htaccess are varied and totally depend on your application.
    One more common usage of .htaccess is to redirect www and non-www requests to
    the same location. This not only limits redundant links but also provides better
    search engine optimization.


    An example of this conversion, using the domain example.org, would look something
    similar to the following:


    ```

    # Force www.domain.com to domain.com

    RewriteCond %{HTTP_HOST} ^www.example.org [NC]

    RewriteRule ^(.*)$ http://example.org/$1 [R=301,L]

    ```


    # Protecting your content


    You can protect your content in a number of ways. You can build a custom authentication
    system or use the basic authentication that is packaged with Apache.


    The basic authentication is set up in two steps. The first step is to create the
    password and user.


    You use the htpasswd file to create the password file. This password-creation
    command is located in the bin/ directory where you installed Apache. For example,
    you will most likely find the file at the following location, assuming you used
    the suggested installation path in Chapter 1.


    ```

    $ /usr/local/apache/bin/htpasswd

    ```


    The first time you create a user, you need to inform the password-creation application
    to create a new password file. From that point on you omit the -c flag.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Failure to remove the -c flag after the first user setup will result in a new
    password file and remove any existing users.


    While not required, it is a good practice to periodically back up this and any
    other important files in case your system encounters an unexpected crash or data
    corruption.


    The command to create a password is simply a call to the password application
    with the username appended to the end.


    ```

    $ cd /usr/local/apache/bin/

    $ htpasswd -c /usr/local/apache/passwd/passwords USERNAME

    ```


    Be sure to replace USERNAME with the actual username you want to add.


    The htpasswd application will ask you for the password you want to assign, and
    then ask you to type the same password again to confirm it.


    The generated password file is encrypted. However, you should still store it in
    a secure location.

    Under no circumstances should this file be stored in the public directory because
    it could compromise

    the integrity of your system.


    This isn''t as important in a development system, but it is a good practice to
    follow all proper security

    steps, even in a development setup, to become familiar with them. As you continue
    to work on

    servers, security will become second nature. You should never put it off to save
    time.


    After you create the password file, add the security check in a .htaccess in whatever
    location

    you want to password protect. For example, let''s add the authentication to the
    entire server

    because this a development server and you wouldn''t want anyone viewing it.


    Add the following to a new .htaccess file in the root of the Web directory.


    ```

    AuthType Basic

    AuthName "Authorization Required"

    AuthUserFile /usr/local/apache/passwd/passwords

    Require valid-user

    ```


    This informs Apache that any request to this directory and below requires authorization.
    The last

    line allows any user in the password file to be able to log in.


    **Require valid-user**


    You can also add a specific username, but this is more difficult to maintain.


    This is basic authentication so it does have various limitations. For example,
    you cannot modify

    the dialog box that displays in the user''s browser. You can''t modify the label
    values next to the

    input boxes and, most importantly, you cannot allow the user to log out.


    If your application requires a more customized and integrated login system, it
    may be better to

    build a custom PHP/MySQL setup, depending on your requirements.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# # Gathering information about Apache


    As you continue to work with Apache, there are some commands and tools that can
    result in more time to develop an application instead of micromanaging the server.


    # ## Starting and stopping Apache


    Sometimes Apache can act up just like any other piece of software or hardware
    on your system. Oftentimes when this occurs, a simple restart will fix the issue.
    For instance, as more users request files from Apache, it can start to fill up
    internal memory and temporary files.


    To restart Apache you can simply call the following command in UNIX from the command
    line or restart the service on Windows:


    ```

    ```

    $ /usr/local/apache/bin/apachectl restart

    ```

    ```


    > > NOTE The path to the apachectl application can vary depending on the installation
    of Apache.


    If you want to stop Apache and not have it restart, use the following command.
    This would most likely be done when installing new modules or updating Apache
    itself.


    ```

    ```

    $ /usr/local/apache/bin/apachectl stop

    ```

    ```


    To start the server again after you complete the update, simply use the start
    option:


    ```

    ```

    $ /usr/local/apache/bin/apachectl start

    ```

    ```


    # ## Determining the version of Apache


    Occasionally, when installing new software, you need to know which version of
    Apache you are currently running. For example, when installing PHP you need to
    know which version of Apache you are using. This is found by running a simple
    command switch.


    ```

    ```

    $ /usr/local/apache/bin/httpd -V

    ```

    ```


    The result of that command would be something similar to Figure 2.1.


    # ## Determining which modules are installed in Apache


    You can very easily determine which modules are currently installed in Apache
    by using the following command-line flags in UNIX.


    ```

    ```

    $ /usr/local/apache/bin/apachectl -t -D DUMP_MODULES

    ```

    ```


    To determine the modules in Windows, you would run the following command:


    ```

    ```

    httpd -t -D DUMP_MODULES

    ```

    ```'
  merge: -1
  img_proc: true
