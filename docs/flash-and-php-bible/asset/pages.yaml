- pgno: 402
  md: '# # Chapter 14

    # Debugging Applications


    +   IN THIS CHAPTER

    +   - Using error reporting in PHP

    +   - Using trace in Flash

    +   - Alternative debugging apps


    When building an application, it is almost certain that some element will stop
    working or maybe never work from the beginning. This can be a point when any bonus
    time a development cycle may have disappears. The idea is to create your application
    with debugging in mind. Adding comments actually can speed up debugging down the
    line.


    Of course, adding debugging as you go is similar to writing an outline. You think
    about it just as you realize it''s too late. The key is not to let a project get
    to this point. This chapter focuses on the best way to debug applications. You
    start with the built-in tools and then progress to some external applications
    and practices that make it less painful.


    # ## Using Error Reporting in PHP


    Let''s start with looking at debugging a PHP application. By default, PHP ships
    with a certain level of debugging enabled. It is set up to report fatal errors
    (program crashes) and warnings (missing files and arguments). This level of error
    reporting is okay for a development server, but a major issue with the default
    install is that the errors are printed to the screen and every user can see them.


    The alternative and safer option is to enable error logging to an error log file
    similar to how Apache is set up. Enabling error logging is done by editing the
    php.ini file. If you do not have administrator access available on your server,
    you need to contact someone that has this access. The php.ini file is usually
    located in the /etc/ directory on UNIX and C:\WINDOWS\, which is generally only
    accessible by the server administrator.'
  merge: -1
  img_proc: true
- pgno: 403
  md: 'The php.ini file is stored in various locations depending on the server configuration.
    However, the nice thing is, PHP can tell you where it is stored. Simply create
    a new file, name it info.php, and add the following code:


    ```

    <?php

    phpinfo();

    ?>

    ```


    When you run this file in a browser you are presented with a wealth of information
    specific to your current version of PHP. One of the first blocks of information
    is the ini path, which looks something like this:


    ```

    Configuration File (php.ini) Path /usr/local/php5/lib/php.ini

    ```


    > **CAUTION** Incorrectly altering the php.ini file can result in your server
    not functioning. Use caution when editing this file.


    After you successfully find the php.ini file, open it in your favorite text editor
    or use vi if you''re using command line. Using vi, a command to open a file, looks
    like this:


    ```

    vi /usr/local/php5/lib/php.ini

    ```


    With the file open, scroll through until you reach a section that looks like this:


    ```

    ; Log errors to specified file.

    ;error_log = filename

    ```


    The lines that start with ; (semicolon) are comments in the ini files. As you
    can see, the error_log is not defined and thus is not saving to any file. The
    method to enable this option is to remove the semicolon (;) and replace filename
    with an actual file path and name, such as


    ```

    error_log = /usr/local/debug/php_errors

    ```


    After you make the changes and save the php.ini file, you need to restart your
    Web server in order to allow PHP to read the ini file. This is necessary because
    the PHP only reads the ini file(s) at startup to maximize performance.


    After you start to generate errors the log file begins to fill. If you read the
    log file you should see strings such as the following. Most likely, the errors
    you receive will actually tell you what is wrong, because an error that provides
    incorrect information is really not that useful.


    ```

    [18-Jul-2007 20:51:17] PHP Fatal error: file.php on line 30

    [09-Aug-2007 21:23:37] PHP Fatal error: file.php on line 13

    [03-Nov-2007 23:10:21] PHP Fatal error: file.php on line 56

    ...

    ```


    A production server should only log errors, which means outputting errors should
    also be disabled in the php.ini file. Open the ini file and change the output_errors
    value to Off and restart Apache again.


    ```

    display_errors = Off

    ```'
  merge: -1
  img_proc: true
- pgno: 404
  md: "# ## Displaying errors for debugging\n\nWith the server securely logging errors\
    \ without displaying them to general users, you can look at what error reporting\
    \ in PHP can offer the developer. From the standpoint of debugging, error reporting\
    \ in PHP is very robust. There are the standard errors such as fatal errors, missing\
    \ files, warnings, and so on. Even more important is the ability to create your\
    \ own error.\n\nIn order to create a custom error you simply call trigger_error(),\
    \ which takes two arguments. The first argument is the error string to display\
    \ and the second (optional) argument is what error level the error should be reported\
    \ as. Here is a simple trigger_error call:\n\n```\ntrigger_error(\"Cannot load\
    \ non-existent user data\",\nE_USER_WARNING);\n```\n\n# ## Debugging variables\n\
    \nDebugging code isn't always about syntax errors; in fact, most times it isn't.\
    \ Oftentimes you find a variable out of scope or not initialized, which will not\
    \ cause an error. Of course, PHP does have many functions and methods that are\
    \ tailored to debugging.\n\nYou have probably used print or echo before, but believe\
    \ it or not those functions are actually very useful for debugging an application.\
    \ Basically, you can trace out variables and get a better idea of how a program\
    \ is functioning.\n\n# ## Debugging arrays\n\nWorking with an array is a little\
    \ different because a simple print will display Array. However, you can use the\
    \ print_r() function to view an array. It will even display an array within an\
    \ array and so on, also known as a multidimensional array. Here is a sample result\
    \ displayed from the print_r call:\n\n```\nArray\n(\n    [0] => Array\n      \
    \  (\n            [one] => 1\n        )\n\n    [1] => Array\n        (\n     \
    \       [two] => 2\n        )\n)\n```\n\n# ## Understanding the error levels\n\
    \nWhile using trigger_error you may notice that the second parameter is a constant.\
    \ This constant defines a certain error level. PHP offers a wide range of error\
    \ levels and even allows the developer to change the level as the code progresses."
  merge: -1
  img_proc: true
- pgno: 405
  md: 'Here is how to pragmatically change the error level, in this case making even
    NOTICES get reported:


    ```

    error_reporting(E_ALL);

    ```


    Table 14.1 shows the error levels and a description of what the error level covers.


    | Error | Description |

    |---|---|

    | E_ERROR | Fatal runtime errors. These indicate errors that cannot be recovered
    from, such as a memory allocation problem. Execution of the script is halted.
    |

    | E_WARNING | Runtime warnings (nonfatal errors). Execution of the script is not
    halted. |

    | E_PARSE | Compile-time parse errors. Parse errors should only be generated by
    the parser. |

    | E_NOTICE | Runtime notices. Indicates that the script encountered something
    that could indicate an error, but could also happen in the normal course of running
    a script. |

    | E_CORE_ERROR | Fatal errors that occur during PHP''s initial startup. This is
    like an E_ERROR, except it is generated by the core of PHP. |

    | E_CORE_WARNING | Warnings or nonfatal errors that occur during PHP''s initial
    startup. This is like an E_WARNING, except it is generated by the core of PHP.
    |

    | E_COMPILE_ERROR | Fatal compile-time errors. This is like an E_ERROR, except
    it is generated by the Zend Scripting Engine. |

    | E_COMPILE_WARNING | Compile-time warnings or nonfatal errors. This is like an
    E_WARNING, except it is generated by the Zend Scripting Engine. |

    | E_USER_ERROR | User-generated error message. This is like an E_ERROR, except
    it is generated in PHP code by using the PHP function trigger_error(). |

    | E_USER_WARNING | User-generated warning message. This is like an E_WARNING,
    except it is generated in PHP code by using the PHP function trigger_error().
    |

    | E_USER_NOTICE | User-generated notice message. This is like an E_NOTICE, except
    it is generated in PHP code by using the PHP function trigger_error(). |

    | E_STRICT | Runtime notices. Enable to have PHP suggest changes to your code
    that will ensure the best interoperability and forward compatibility of your code.
    |

    | E_ALL | All errors and warnings, as supported, except of level E_STRICT in PHP
    < 6. |


    As you can see, PHP offers a lot of debugging options beyond the basic outputting
    and logging. In fact, you can customize a lot of the error handling found in the
    php.ini file to further debug your various applications.'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'If you want to get a serious level of debugging and code watching tools, then
    you might want to take a look at the Zend Studio IDE (see Figure 14.1) built on
    top of the Eclipse framework. This application is not freeware; however, it is
    the most robust PHP editor and debugger/profiler on the market at the time of
    this writing. A license for Zend studio ranges from $150 to $300 depending on
    the version you purchase.


    > Zend Studio is not the only PHP editor; however it has the most robust debugger.
    Additionally you can use PHPEclipse which has similar features to Zend. However
    the setup process is a little more involved.


    # FIGURE 14.1


    The Zend Studio IDE with the debugging panels visible


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_406_0.png)


    # Debugging in Flash


    Similar to PHP, Flash offers a pretty useful set of tools for debugging. In fact,
    the Flash IDE has a complete debugging system built right in where you can quickly
    inspect your code (see Figure 14.2), apply breakpoints, and step around a block
    of code to drill down and find a bug.'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# FIGURE 14.2


    Here is the panel that is used to inspect an application.


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_407_0.png)


    Flash also has an Output panel (see Figure 14.3) that is used to view trace()
    statements called from the code. A trace statement is a basic function that accepts
    a string as an argument. This is then sent to the output panel and offers the
    ability to display elements of an application as it is running.


    ```

    trace("Here is a very basic debug message");

    ```


    A common question with using trace statements is will they continue to output
    in a compiled movie? They will, but you can select the “Omit trace actions” option
    in the Publish Settings dialog box to disable it.


    The simple trace method can be useful when debugging basic code examples. However,
    for more complete applications, you will most likely want to build your own debug
    manager. This can be done fairly simply.'
  merge: -1
  img_proc: true
- pgno: 408
  md: "# FIGURE 14.3\n\nThis is an example of the Output panel as seen in Flash.\n\
    \n![](img/d9d48cd53eee0fbc1ebc363c322fac2c_408_0.png)\n\nFirst, create a TextArea\
    \ component on the stage with an instance name of debugTxt. Then create a custom\
    \ trace function that will populate that TextArea. Using the appendText method\
    \ will add to the existing text, rather than deleting it.\n\n```\nfunction tracer(debug:String):void\n\
    {\n    debugTxt.text.appendText(debug);\n}\n```\n\nYou could also create a custom\
    \ class that any portion of your code is able to call. However, you will quickly\
    \ find that the standard trace isn't perfect. For example, you can't pragmatically\
    \ clear the display or place priority on certain events.\n\nIn fact, debugging\
    \ in Flash isn't as advanced as the possibilities in PHP, but it still gets the\
    \ job done."
  merge: -1
  img_proc: true
- pgno: 409
  md: 'At this point, you have seen how Flash can be used to debug an application
    and how PHP can be used for the same task. Now look at a few third-party options
    and libraries to make this process even easier.


    The majority of data passed back and forth in Flash is done so using remote calls,
    also known as remoting or Flash remoting. This method of sharing data has become
    fairly popular but doesn''t lend itself to being debugged or watched. Part of
    this is due to the fact an object is self-contained and also the way Flash interacts
    with a remoting source.


    Using a third-party tool named Charles or Charles Web Debugging Proxy, which can
    be downloaded from http://xk72.com/charles/, makes it very simple to look at this
    data as it is passed around. Charles is freeware, but does offer a full demo.
    At the time of this writing, a license was $50. To me, it''s not worth it.


    Figures 14.4 and 14.5 show remoting data and how it looks to Charles.


    # FIGURE 14.4


    Here is the Request that is sent out to the remoting service.


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_409_0.png)'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# FIGURE 14.5


    Here is the standard Charles interface showing an XML response from a remoting
    system.


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_410_0.png)


    Another great tool is a plug-in for the Firefox Web browser called LiveHTTPHeaders
    that watches the network traffic. The partial downside to this application is
    it only watches browser traffic. If you''re testing or debugging the application
    locally it will not see those calls.


    More info about LiveHTTPHeaders can be found at http://livehttpheaders.mozdev.org/.


    # Using an Alternative Trace


    The last topic in this chapter will be building a new trace that allows colors
    as well as other features. This trace alternative is built as a stand-alone SWF
    and can be called by any other SWF in the same domain (local is your machine).
    The code behind this trace alternative is based upon the LocalConnection class,
    which is a prebuilt class that allows multiple movies to share communications
    as long as they are in the same domain. The first part of the code is responsible
    for building the local connection object and registering the callback function.'
  merge: -1
  img_proc: true
