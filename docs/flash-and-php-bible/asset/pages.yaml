    # Creating a persistent socket server


    The persistent socket server would be very similar to the previous example, with
    the exception of a looping check for new messages.


    # Recursive loops


    PHP does not offer an asynchronous system (event based) like you would find in
    ActionScript, but you can create a loop to achieve the same result.


    For example, here is a very simple while loop similar to the one that will be
    used in the persistent connection example:


    ```

    x = 0;

    while(x < 50)

    {

    x++;

    }

    ```


    # Managing multiple communications


    The key to allowing a user to send more than one message per connection is to
    wrap the socket_read calls that are responsible for checking for new messages
    in a loop.


    ```

    do

    {

    // // look for new messages


    $incomingData = socket_read($childSocket, 2048);


    if(trim($incomingData) == "are you hungry?")

    {

    $response = "Server Response > I could eat!\n";

    socket_write($childSocket, $response, strlen($response));

    }

    else if(trim($incomingData) == "exit")

    {

    $response = "Goodbye!\n";

    socket_write($childSocket, $response, strlen($response));

    }

    ```'
