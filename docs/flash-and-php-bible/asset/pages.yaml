    The first method, callServer, sets up the variable _action that is passed to PHP
    using the value that was set in the Document class in the previous section. You
    may have noticed the _ before the variable name, which is used to clearly define
    a private variable. It is not required, but it makes your code easier to read.


    The last two methods in this class are responsible for setting the container of
    the TextField and the action. These two setters are called from the document class.


    As you can see, building this application as a custom class offers the ability
    to quickly update it or extend it to another application and best of all keeps
    it all secure. This basic application is just a sampling of what classes can offer,
    but should give you a better understanding of how the Document class is set up.


    The following, Table 10.1, is a table quickly and graphically explaining the differences
    of classes in PHP and Flash. You can always refer back to this page if you have
    a question of whether a feature exists in the language you are working in.'
