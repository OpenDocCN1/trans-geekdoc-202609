- pgno: 439
  md: 'When the installation is complete, you need to modify the php.ini file and
    add the new extension.


    ```

    extension=memcache.so

    ```


    # Installing memcached on Windows


    The first step to installing memcached is to download the binary version directly
    from http://jehiah.cz/projects/memcached-win32/


    +   1. Unzip the binaries in your desired directory (e.g., c:\memcached).

    +   2. Install the service: ''c:\memcached\memcached.exe -d install'' from the
    command prompt.

    +   3. Start the server from the Microsoft Management Console.

    +   4. Use the server, by default listening to port 11211.


    Now that you have memcached installed and started, the next step is to configure
    PHP. Start by checking the PHP extensions directory (C:\php\ext) for the memcached
    extension (php_memcache.dll).


    If you do not see the extension in that directory you can visit the PECL repository
    and download it from there: http://pecl4win.php.net/ext.php/php_memcache.dll


    The next step is to open the php.ini file and add the memcached extension to the
    existing list of extensions.


    ```

    extension=php_memcache.dll

    ```


    The last step is to restart Apache.


    # Wrapping up installation for Linux and Windows


    The last step is to restart PHP by restarting Apache and running the phpinfo function
    to see if memcached has been successfully added.


    # Saving data to the cache


    The power of memcached cannot be explained in a little section, but the following
    is a good overview of how to load and save data into the caching system.


    The first step is to create a new instance of the Memcache library object.


    ```

    $cache = new Memcache;

    ```


    After you create the object, create a new connection. For this example, everything
    is running on the same server, but memcached really shines when installed on multiple
    servers. The second argument in the connect method is the port number on which
    memcached is running.


    ```

    $cache->connect("localhost", 11211);

    ```'
  merge: -1
  img_proc: true
- pgno: 440
  md: 'After you make the new connection, you can create some sample data, which would
    probably be a more advanced block of data in a real-world application.


    ```

    $sampleData = array("apples", "oranges" "bananas", "waffles");

    ```


    After you create the sample data, which in this example is a basic array, you
    need to send the data to the caching system. This is done by making a call to
    the set method of the Memcached class.


    The first argument is the name of the key, which should be unique because this
    is the way you will retrieve this information.


    ```

    $cache->set("uniquekey", $sampleData, false, 86400);

    ```


    The second argument is the sample data to store in the cache.


    ```

    $cache->set("uniquekey", $sampleData, false, 86400);

    ```


    Memcached has the ability to store the data in a compressed form, which is set
    by the third argument. This option is a true or false flag.


    ```

    $cache->set("uniquekey", $sampleData, false, 86400);

    ```


    The fourth and final argument determines how long the cached data should stay
    alive in seconds. In this example, the data would stay alive for 24 hours.


    ```

    $cache->set("uniquekey", $sampleData, false, 86400);

    ```


    > NOTE The expire option of memcached data cannot exceed 2592000 (30 days).


    ```

    $cache->set("uniquekey", $sampleData, false, 86400);

    ```


    As you can see, the code required to save data to the cache is fairly simple and
    makes it very easy to adapt into existing applications.


    Here is the complete example script for saving data to the cache.


    ```

    <?php

    $cache = new Memcache;

    $cache->connect(''localhost'', 11211);

    $sampleData = array("apples", "oranges" "bananas", "waffles");

    $cache->set("uniquekey", $sampleData, false, 86400);

    ?>

    ```'
  merge: -1
  img_proc: true
- pgno: 441
  md: '# Loading cached data


    Once you store information in the cache, the process for retrieving that information
    is a matter of calling one method of the Memcache class. This method accepts one
    argument, which is the key that you used to save the data in the cache.


    ```

    $result = $memcache->get("uniquekey");

    ```


    That is all there is to loading the cached information. As you can see, loading
    data from the cache is very similar to the overall process of working with the
    database. This means it is not hard to seamlessly integrate into your existing
    code.


    # Managing servers


    The memcached caching system can be installed on the same machine your Web server
    runs on. However, it performs better if it is added to an array of other machines.
    These additional machines do not have to be on the same domain, location, or even
    be all that powerful from a hardware perspective.


    # Adding new servers


    You can use connect() to add new servers but there is a better function, addServer(),
    which does not use as many resources and only establishes a network connection
    when required. You can add as many servers as you want, but they will only be
    used when required by the system.


    # Closing a connection


    The process of closing a cached server connection is done by making a call to
    the close() method. This method will not close persistent connections. These connections
    are closed only when the Web server is shut down or restarted.


    ```

    $cache = new Memcache;

    $cache->close();

    ```


    # Deleting an item in the cache


    Items will automatically be deleted from the cache when they expire, but it is
    not uncommon that you may want to remove data immediately. The delete() method
    accepts two arguments. The first argument is the key to match and delete. The
    second argument is a timeout delay where the caching service will wait this amount
    of time before removing the value.


    You can use this method to speed up the deletion process of certain elements by
    setting the time-out to a few minutes or hours in the future.


    # Moving forward with memcached


    Now that you have an understanding of how to install, modify, and use memcached
    you should see a substantial performance increase. The advantage to working with
    memcached is you can add more servers as the load becomes more demanding. This
    continues to remove the stress from the database and makes your applications more
    responsive.'
  merge: -1
  img_proc: true
- pgno: 442
  md: 'The Memcached class offers a few other methods that you may find useful, depending
    on your intended use. You can also use this memcached caching system with multiple
    programming languages, but the focus in this section has been PHP 5.


    # # Handling Backups


    Backing up your data is not only a best practice to ensure your data is stored
    securely, backups can also be used to periodically clean your system and limit
    the files that are available on the system. Oftentimes you will have many `Oldfilename.php`
    or `test.php` files throughout your server as you test more code concepts. The
    problem with these extra files is it slows down directory scans and makes it harder
    to manage the files that matter.


    # ## File management


    Running a more efficient server can include minimizing what is installed on your
    server. In the next section you will learn how to exclude non-used files to limit
    overhead.


    # ### Managing necessary files


    If you limit your server to only have active code and leave the experimentation
    for a development server or section, you will notice a directory scanning and
    searching performance increase.


    This doesn''t mean those unneeded files should be deleted. In fact, that is the
    exact opposite of what you should do. The best practice is to set up timed backups
    that look for these files or simply have a backup system that backs up the entire
    server and moves it to a remote location.


    # ### Limit larger files


    Try to limit the use of larger files whenever possible. These files take longer
    to open and require more memory when opened. If not excluded, they also slow down
    the backup process, which gets a more in-depth look in the following section.


    NOTE Don''t store backup data on the same drive because you will have an even
    larger resource issue.


    # ## Backup management


    Running backups on your system will ensure you don''t lose necessary files. This
    can include user uploaded files or core server configurations.


    # ### Timed backups


    UNIX Web servers offer a service called cron, which can be set up to run at a
    predetermined time based on the setup information. You can find more information
    about the cron service by looking up the manual page for it.


    ```

    man cron

    ```'
  merge: -1
  img_proc: true
- pgno: 443
  md: 'Here is the format of a crontab file, where you repeat the last line for each
    new command.


    ```

    ```

    # +------------- minute (0 - 59)

    # | +----------- hour (0 - 23)

    # | | +--------- day of month (1 - 31)

    # | | | +------ month (1 - 12)

    # | | | | +---- day of week (0 - 6) (Sunday=0 or 7)

    # | | | | |

    # * * * * * command to run

    ```

    ```


    All cron jobs are located in the same file, which is normally loaded by typing
    the following command:


    ```

    ```

    crontab -e

    ```

    ```


    In Windows, you can use the Task Scheduler, which can provide the same basic functionality.


    # # Backup directories using PHP


    With the cron system, which can run a command at a given time, at your disposal
    you can build an automated backup system that is called by the cron. These backups
    can be run at any time, but unless you have a special requirement, it is best
    to run them when your server encounters the least amount of stress.


    The first part to the backup script is defining the directory to backup. This
    portion is built as an array, which is used to allow more than one directory to
    be backed up.


    ```

    ```

    $dirs = array("/var/www/vhosts/example.org/myfiles");

    ```

    ```


    The backupDir defines where the archive file is saved after it is created.


    ```

    ```

    $backupDir = "/var/www/vhosts/example.org/backups";

    ```

    ```


    A date is stored that is used as the archive filename. You can modify the archive
    name to include the hours and minutes if you decide to create more than one backup
    per day.


    ```

    ```

    $date = date(''m-d-y'');

    ```

    ```


    The core of the backup script is within a foreach loop. This loop is responsible
    for backing up each directory defined in the array. For this example, there is
    only one directory defined, so this loop will only run once.


    ```

    ```

    foreach($dirs as $dir)

    {

    ...

    }

    ```

    ```


    Continuing with the script, the next section is located all within the foreach
    loop. The first part is to use preg_replace to remove all but the directory name
    from the $dir variable. This is passed through another preg_replace to define
    the archive name.'
