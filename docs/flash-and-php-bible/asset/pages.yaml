- pgno: 297
  md: "The list items load the body text when clicked, so create the function that\
    \ handles this event. The ListEvent is passed from the ITEM_CLICK event, which\
    \ contains the item property. The item property is where the data property is\
    \ stored. In this example, that data is the RSS body, so you can simply pass that\
    \ data directly to the feedBody TextArea.\n\n```\n```actionscript\nfunction listClickhandler(e:ListEvent):void\n\
    {\n    feedBody.htmlText = e.item.data;\n}\n```\n```\n\nThe last function in the\
    \ RSS application is the button handler, which is called any time the Button component\
    \ is clicked. This function simply makes a call to the loadFeeds function.\n\n\
    ```\n```actionscript\nfunction submitHandler(e:Event):void\n{\n    loadFeeds();\n\
    }\n```\n```\n\nAs you can see, the ActionScript is fairly simple for this example.\
