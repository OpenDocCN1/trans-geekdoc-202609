- pgno: 150
  md: "Error reporting can be forced off by disabling the `display_errors` directive\
    \ in the `php.ini` file. This ensures error reporting can't accidentally be turned\
    \ back on.\n\nWhen accessed through the browser, this code would allow all errors\
    \ to be visible, display vital server information, force a failed attempt to the\
    \ database exposing the true path of file, as you can see in Figure 7.1, and determine\
    \ if a database exists.\n\n# Using a better way to check for file extensions\n\
    \nGoing back to the simple upload example, let's add more robust security measures.\
    \ The major change to the code is the if statement that checks for a valid file\
    \ extension. Instead of looking for the existence of a file type, it looks at\
    \ the end of the filename and retrieves the actual correct extension.\n\n```\n\
    if(strrpos( $file['name'], '.jpg') != false)\n{\n    ...\n}\n```\n\n# FIGURE 7.1\n\
    \nError message returned when database is intentionally set to fail on connection\n\
    \n![](img/d9d48cd53eee0fbc1ebc363c322fac2c_150_0.png)"
  merge: -1
  img_proc: true
- pgno: 151
  md: "At first glance it seems nothing has changed, but in fact it has. The `strpos`\
    \ function has been replaced with the less common `strrpos`, which looks for the\
    \ file type starting at the end of the string and moving toward the front. This\
    \ ensures the final file extension is found and not one buried within the name.\n\
    \nAs with code in general, security can be expanded, and this example allows a\
    \ great deal of expansion. Here is a more dynamic method of looking for valid\
    \ file types that can easily be placed in an existing project or a brand-new project.\n\
    \n```\n```php\n<?php\n\nfunction checkForFileType($file, $type)\n{\n\n    $fileTypePos\
    \ = strrpos($file, '.');\n\n    if($fileTypePos == false)\n    {\n        return\
    \ \"File not valid.\";\n    }\n\n    if(substr($file, ($fileTypePos+1), strlen($file))\
    \ == $type)\n    {\n        return \"Valid file type\";\n    }\n    else\n   \
    \ {\n        return \"Invalid or malicious file type detected.\";\n    }\n}\n\n\
    checkForFileType(\"sample.jpg\", \"jpg\");\n?>\n```\n```\n\nThe above code is\
    \ a custom function that accepts two arguments. The first argument addresses the\
    \ file to validate, and the second is the extension to recognize. This expandable\
    \ solution returns a string determining whether the file type is found or not.\
    \ Less common is the third possibility, an invalid match. An invalid match means\
    \ the passed-in file does not have a valid filename at all.\n\nNow that the upload\
    \ portion of the code is secure, the next point of security is the actual form\
    \ itself. This part would most likely consist of the file upload box and input\
    \ boxes for extra data. Generally, an automated attack (computer set up to exploit\
    \ Web sites) is the security issue developers are most concerned with, but an\
    \ input form in Flash can also pose a security risk."
  merge: -1
  img_proc: true
- pgno: 152
  md: "# Checking for valid input\n\nChecking the validity of the input boxes is a\
    \ good start. An example of an input check in ActionScript is something such as\
    \ the following:\n\n```\nif(length(fileNameTxt.text) > 0)\n{\n    // file name\
    \ is valid\n}\n```\n\nThis is simply checking the fileNameTxt variable for a length\
    \ that is greater than 0, meaning the input box has some amount of text in it.\
    \ Now that the input box is known to be valid, a call to the server is made and\
    \ this results in the PHP being called. The PHP for a simple unsecure example\
    \ could look something like this.\n\n```\n<?php\n\n$name = $_POST['fileName'];\n\
    \n// database info goes here...\n\nmysql_query(\"INSERT INTO uploads (name) VALUES\
    \ (\" . $name . \")\");\n\n?>\n```\n\nThis is basically taking the filename and\
    \ directly inserting it into the database. You might be wondering at this point\
    \ how if the filename is validated in Flash this could be a security concern.\
    \ The problem isn't in the data passed in from Flash, but more importantly, the\
    \ fact that the PHP could potentially be called by another method. This is one\
    \ of the most important reasons to properly secure all points of an application.\n\
    \nA more secure alternative to the previous code would be\n\n```\n<?php\n\n$name\
    \ = $_POST['fileName'];\n\n// database info goes here ...\n\nif(!empty($name)\
    \ & strlen($name) > 0)\n{\n    mysql_query(\"INSERT INTO uploads (name) VALUES\
    \ (\" . $name . \")\");\n}\n\n?>\n```"
  merge: -1
  img_proc: true
- pgno: 153
  md: 'This code is not only checking for a valid value but also ensuring that value
    is of a valid length.


    ```

    if (!empty($name) && strlen($name) > 0)

    ```


    In a real-world application you would probably check for a value of at least two
    to three characters, but that all depends on the intended use. This small update
    to the code ensures that a call from Flash or any other method will be secured.


    # Validating ZIP codes


    Of course, securing data is not limited to basic form fields. Assume there is
    a portion to the application that accepts a five-digit ZIP code when the user
    submits an image. The way to ensure a valid ZIP code is by testing for a numeric
    value and a valid length.


    ```

    <?php


    $zipCode = $_POST[''zip''];


    if(is_numeric($zipCode) && strlen($zipCode) == 5)

    {

    // valid zip code found

    }


    ?>

    ```


    The is_numeric() function accepts a variable as an argument that is tested to
    determine whether or not that value is a number. This function will return a true/false
    response so it can easily be used within an if statement or you could assign the
    result to a variable.


    # Looking for valid types


    If you want to perform this same basic validation within Flash, you would use
    the typeof and length functions. The typeof function returns a string value defining
    what the type is for the passed-in item. This function can be used for more than
    just number validation, but it works perfectly for this example:


    ```

    if (typeof(zipCode) == "number" && zipCode.toString().length == 5)

    {

    // valid zip code found

    }

    ```


    # Cleaning User Data


    Now that you have a better understanding of security in your application, the
    next step is to sanitize or clean more advanced data before it is stored.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'The process of storing data covers both database usage and a more simple approach
    of using standard text files. The advantage to standard text files is the fact
    you don’t need database access. The disadvantage to this approach is it is a less
    robust solution that results in much slower searching possibilities. Most often
    you would use a database, unless it was a fairly small application that didn’t
    need the potential to scale in to a larger application.


    # Sanitizing the data


    The first step to sanitizing data is covered in the previous section, which is
    to ensure that at least the data is valid. This process is necessary as various
    functions that interact with a database or file system will create pretty substantial
    errors if empty data sets are used.


    The process of sanitizing data should be done in the PHP because it is always
    a good practice to assume any passed-in data is dirty. This means that even though
    the data was sent from your Flash app it could have been tampered with in the
    submission process.


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_154_0.png)


    There are a couple of very useful functions in PHP that can assist in the process
    of sanitizing data before it is stored. The first function is addslashes(), which
    will escape characters such as quotes and slashes in the data passed to it. The
    following snippet of code shows how addslashes properly sanitizes the data.


    ```

    <?php

    $quote = "I hope to finish the "coolest" Flash application ever.

    Which will use Flash and PHP";

    ?>

    ```


    # Creating safe SQL queries


    If you ran the preceding code, it would generate an error because the PHP processor
    does not allow quotes within quotes. With multiple quotes, it would not be able
    to determine where one string starts and another ends. Assume the $quote variable
    is filled dynamically by a call from Flash. The variable will properly be filled
    at runtime because the compiler does not validate content on the fly; however,
    entering that data in SQL will cause an error. Even worse, in some cases the string
    could be partially entered. Here is a real-world SQL query where you can easily
    see the issue with unescaped quotes.


    ```

    $sql = ''UPDATE users SET business=Tom''s Diner WHERE id='' . $ID;

    ```


    Once again, running the code with it previously entered into the PHP causes an
    error, but assume this string is built from a $_GET request. At first, the request
    seems safe, but notice the SQL query begins with a single quote ('') and there
    is an apostrophe in Tom''s Diner. The actual SQL call will become:


    ```

    $sql = ''UPDATE users SET business=Tom

    ```'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'This basically sets every business name in the application to Tom, which is
    probably not the intended result. It would also be very hard to revert unless
    the application took proper backups. That example is fairly extreme, because a
    double quote is more common for an SQL call, but you can definitely see how unsanitized
    data could cause a very bad day for the system administrator.


    Now that you know how bad unsanitized data can be, go back to that addslashes()
    function and see what the SQL call turns into:


    ```

    ```

    $business = addslashes($_GET[''name'']);

    $sql = ''UPDATE users SET business='' . $business . '' WHERE id='' . $ID;

    ```

    ```


    The properly sanitized SQL call looks something like this:


    ```

    ```

    $sql = ''UPDATE users SET business=Tom\''s Diner WHERE id='' . $ID;

    ```

    ```


    Look at another malformed SQL call that has drastic results. This one deals with
    logging into a secure portion of a Web page. An SQL call for authorization would
    look something like this:


    ```

    ```php

    <?php

    $user = "admin";

    $pass = "password here";

    $query = "SELECT * FROM staff WHERE user=''" . $user . "'' AND pass=''" . $pass
    . "''";

    ?>

    ```

    ```


    Notice how once again the SQL blindly accepts the values. This really becomes
    a problem when a user enters a password such as


    ```

    ```

    $pass = "'' OR ''''=''";

    ```

    ```


    The resulting SQL call is an empty password because the quotes force the SQL to
    end and the OR allows it to equal itself. It creates an empty password, which
    means only the username is stopping someone from logging in, but nine times out
    of ten, admin is a valid username.


    ```

    ```

    SELECT * FROM staff WHERE user=''admin'' AND pass='''' OR ''''=''''

    ```

    ```


    That simple \ means the difference between an effective SQL call and a very dangerous
    one. This function is only one possible way to sanitize data.


    The next function, when working with a database, is mysql_real_escape_string,
    which sanitizes data before entering it into the database. When using this function
    you must first make a proper connection to the database; otherwise you will receive
    an error.


    The syntax for mysql_real_escape_string is pretty much the same as addslashes().
    You pass in the value you want cleaned and an optional mysql link. If a link is
    not passed, the last SQL link is used.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '```

    <?php


    // connect to database, generate $link


    $business = mysql_real_escape_string($_GET[''name''], $link);

    $sql = ''UPDATE users SET business='' . $business . '' WHERE id='' . $ID;


    ?>

    ```


    The advantage to using this function is that it takes care of all the various
    escaping, which goes beyond single and double quotes. The obvious problem is it
    requires a MySQL link, so it cannot be used unless the data will be stored in
    a database. Or, at the very least, you need to have access to a database. An incorrect
    usage of this function will result in an error, as seen in Figure 7.2.


    # FIGURE 7.2


    Error message displayed when a MySQL database link is not available


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_156_0.png)'
