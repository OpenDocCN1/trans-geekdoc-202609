- pgno: 84
  md: '# # Chapter 3

    # Getting Connected


    +   - Understanding communications in Flash

    +   - Connecting Flash to PHP

    +   - Connecting PHP to MySQL


    Getting connected is a phrase used to describe the process of connecting to various
    data sources. In this chapter, it is the process of connecting ActionScript (Flash),
    PHP, and MySQL in various ways. This data can be a simple Web site or a database-driven
    content management system for which Flash becomes the front-end display.


    If these three components are not already installed, refer to Chapter 1 before
    continuing with this chapter.


    The first part of each section focuses on what each connection type has to offer
    and moves on to examples to provide a complete picture of the end result.


    # ## Understanding Communications in Flash


    Developing self-standing applications lacks certain functionality, primarily the
    ability to work with dynamic data. In smaller applications you can use flat files,
    such as XML files, but those would pose a problem as a project continues to grow.


    Simple text file-based applications also suffer from file locking, which can occur
    if too many people are accessing the file. When this occurs, Apache and/or PHP
    can throw an error that results in users not being able to use the site.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# # Determining the status of PHP


    The first step to setting up a connection to PHP in Flash is to determine if PHP
    is properly installed and running. This is done by creating a simple PHP file
    that outputs the current configuration settings for the version of PHP installed.


    The PHP function phpinfo() outputs the configuration information by building a
    custom HTML page, as shown in Figure 3.1.


    > **WARNING** Leaving the phpinfo file on your server can be a security risk.
    It is best to only upload it when you need to look at it, and then delete it.


    The following is a sample info file that makes a call to the phpinfo() function.


    ```

    <?php

    // output php configuration settings

    phpinfo();

    ?>

    ```


    # ## FIGURE 3.1


    Here is the output of the phpinfo function, which shows the current PHP configuration
    settings.


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_85_0.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'If you are presented with the phpinfo file, which generally is in purple and
    starts with the version of PHP installed, then everything is installed properly.


    However, if you see a dialog box to download your PHP file, it means Apache is
    improperly configured or has not been enabled for PHP support. This level of setup
    is covered in Chapter 1 and in the help files that ship with Apache. In rare cases
    you may be presented with a Server not found page, which could mean Apache is
    not installed or running.


    Assuming that PHP and Apache are both properly running, you can move on with the
    process of connecting Flash to PHP.


    # Working with various connection types


    Flash offers many different types of communication options. Determining which
    communication to use in your project is accomplished by the intended feature set
    of that specific application.


    # One-way communication


    One-way communication in Flash is the process of sending data to a Web server
    and not looking or caring if a response comes back. This is mostly used to open
    a URL, but could also be used to update a file with no intention of handling the
    result. This type of communication is often used for simply firing off an event
    or running some sort of cleaning system.


    For example, if your site needs periodic file cleaning (deleting, renaming, moving),
    it is a good idea to attach this to the front-end system because your server resources
    will only be in use when they are already providing content for that user. This
    would be started by a one-way communication behind the scenes.


    > NOTE The update by viewing concept should not be used for backup solutions because
    a slow viewing could result in missing backups.


    Here is an example of one-way communication in Flash:


    ```

    var serverFile:String = "http://localhost/callLink.php";

    var urlRequest:URLRequest = new URLRequest(serverFile);

    navigateToURL(urlRequest);

    ```


    The navigateToURL function accepts two parameters. The first parameter is the
    URLRequest instance, and the second parameter is the window or target. By default,
    the window is _self, which means the new page will load into the current browser
    if one exists.


    However, in some cases, you may want to open a new browser window, which you can
    do by adding the second parameter.


    ```

    var serverFile:String = "http://localhost/callLink.php";

    ```'
  merge: -1
  img_proc: true
