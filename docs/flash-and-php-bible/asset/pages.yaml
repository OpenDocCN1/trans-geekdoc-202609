  md: 'This VideoPlayer class will need to have a few properties defined, which will
    be stored as private to ensure they are protected and cannot accidentally be modified
    by external classes. The second property will store the active NetConnection,
    which is used to interact with the remoting service. You will work with this in
    the next section of code.


    ```

    private var gatewayURL:String;

    private var gateway:NetConnection;

    private var selectedCatID:Number;

    ```


    # ## VideoPlayer constructor


    The constructor function is responsible for initializing a few properties, modifying
    the visual portion of the video player display, and calling the category method.


    ```

    function VideoPlayer()

    {

    gatewayURL = "http://localhost/amfphp/gateway.php";

    getCategories();


    videoPlayer.visible = false;

    videoListCombo.enabled = false;

    }

    ```


    # ## getCategories method


    The next method in the VideoPlayer class is getCategories(), which is called from
    the constructor when the application initializes. This method starts by creating
    a new instance of the Responder, which handles the response from the remoting
    service.


    ```

    public function getCategories():void

    {

    var responder:Responder = new Responder(

    categoryResponseHandler,

    onFault

    );

    }

    ```


    Once the responder is defined, the next step is to assign the gateway to a new
    instance of the NetConnection class. This is where the actual call to remoting
    service begins.


    ```

    public function getCategories():void

    {

    var responder:Responder = new Responder(

    categoryResponseHandler,

    onFault

    );


    gateway = new NetConnection();

    }

