- pgno: 471
  md: "Once the ComboBox is enabled, the next step is to add the first item, which\
    \ informs the user to select an option. This default option will have a value\
    \ of –1 to alert that it is not a valid id. You could use 0, aside from the fact\
    \ that is a valid ID in the database.\n\n```\nvideoListCombo.addItem({label:'Choose\
    \ a Category...', data:-1});\n```\n\nA for each loop is constructed to handle\
    \ all of the response items. This will handle any number of video items, which\
    \ is essential because the remoting service does not return the same number each\
    \ time, as not every category has the same amount of videos.\n\n```\nfor each(var\
    \ item in response)\n{\n    videoListCombo.addItem({label:item.name, data:item.id});\n\
    }\n```\n\nThis loop takes each item in the response object and assigns the name\
    \ and id to the ComboBox values. This populates the ComboBox and allows the user\
    \ to select a video category.\n\nThe last step of the categoryResponseHandler\
    \ method is to assign the event listener to the ComboBox. This event fires whenever\
    \ the selected item of the ComboBox component changes.\n\n```\nvideoListCombo.addEventListener(Event.CHANGE,\
    \ categoryHandler);\n```\n\n# categoryHandler method\n\nThe categoryHandler method\
    \ is called whenever the user selects a different item in the ComboBox component\
    \ instance.\n\n```\nprivate function categoryHandler(e:Event):void { ... }\n```\n\
    \nThis method handles the process of validating the selected category id. The\
    \ actual category id is found in the selectedItem property of the passed-in event.\n\
