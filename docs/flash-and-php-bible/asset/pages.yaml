- pgno: 134
  md: '# Chapter 6


    # Working with Cookies


    +   * Using cookies in PHP

    +   * Using cookies in Flash

    +   * Understanding shared objects


    Cookies are very common in Web browsing. In fact, you would find it very hard
    to navigate the Internet in the way we are accustomed to if cookies stopped working.
    This chapter is how to work with cookies in both Flash and PHP. It covers loading
    and sending of cookies and investigates how a cookie is deleted.


    The second half of the chapter is about shared objects, which are cookies in Flash.
    They act almost the same as standard browser cookies with some differences, which
    you will investigate.


    Once you have completed this chapter you will fully understand how to work with
    cookies and why they are important for a successful application and user experience.


    # Loading Cookies


    A cookie is a small file placed on the user’s computer by a Web server. This file
    is then sent back to the server unchanged each time the user accesses the server.
    Most often a cookie will contain the username for a Web site. A cookie can also
    be used to save user settings and any other small pieces of information.


    The process of loading cookies is explained in multiple pieces to better understand
    how they work. You will notice that the process of loading cookies is very similar
    to loading other forms of data.'
  merge: -1
  img_proc: true
- pgno: 135
  md: "# # Using cookies with PHP\n\nUsing cookies with PHP is necessary in order\
    \ to develop a usable Web application. You will find many opportunities to implement\
    \ cookie support from user login to styles and many other uses.\n\nAs you begin\
    \ to work with dynamic data more often you will want to save portions to the user's\
    \ machine. Doing this allows the program to log a user in automatically or modify\
    \ a style based on the user's settings.\n\nCookies are saved per domain and directory:\
    \ This means that any page within the same domain or path can read that cookie.\
    \ This is very useful when building multiple examples and also means another Web\
    \ site cannot read cookies from a different site.\n\n> > NOTE\n> The common workaround\
    \ for sharing cookies across a domain is to create a subdomain. A cookie is only\
    \ specific to the overall domain and simply ignores paths, parameters, and subdomains.\n\
    \n# ## Loading a cookie\n\nNow that you have an understanding of what a cookie\
    \ is, take a look at how to load and work with one in PHP: The following code\
    \ attempts to load a cookie and display the response as shown in Figure 6.1.\n\
    \n```\n```php\n<?php\n$username = \"Jimmy\";\n\nif ( !isset( $_COOKIE['user']\
    \ )) {\n    setcookie( \"user\", $username );\n    print \"Welcome \" . $username;\n\
    }\nelse\n{\n    Print \"Welcome back, \" . $_COOKIE[ 'user ' ];\n}\n\n?>\n```\n\
    ```\n\nThe previous code checks for the existence of the cookie \"user\" in the\
    \ global array of cookies. If the cookie is found, the user is welcomed back.\
    \ If the cookie is not found, the cookie is set and the user is welcomed for the\
    \ first time.\n\nThe $_COOKIE variable is a multidimensional array that can contain\
    \ many different cookies. This variable is automatically filled by PHP and doesn't\
    \ require you to add to it."
  merge: -1
  img_proc: true
- pgno: 136
  md: '# FIGURE 6.1 The print statement as displayed in the browser window


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_136_0.png)


    # Saving a cookie


    Setting or saving a cookie in PHP is very simple: you make a call to the setcookie
    function. The first argument is the cookie name; the second argument is the cookie
    value. For example, say you want to set a time_logged_in cookie.


    ```

    setcookie("time_logged_in", time());

    ```


    Anytime you want to save a cookie you can call the setcookie function. If the
    cookie exists, it is updated, and if it doesn''t exist it is created.


    > **NOTE** A cookie''s ability to be saved depends on whether or not a user allows
    cookies.


    The setcookie function accepts more than two arguments, but actually only requires
    the first argument, which is the name.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# ## Cookie expiration


    By default, a cookie expires when the session ends or the user closes the browser.
    The way a session ends is by a predefined amount of time on the server. By default,
    this amount is 0 seconds because the session ends when the browser closes. Normally,
    you as the developer do not need to know how long a session lasts. You would,
    of course, be more interested in whether or not the cookie exists.


    Occasionally, you will want to ensure a cookie is deleted after a certain amount
    of time. This is the case when working with secure data or a content management
    system. Assume you want the cookie to expire soon after the cookie is created.


    ```

    ```php

    setcookie("username", "adminDave", (time() + 7200));

    ```

    ```


    This tells the user''s browser to delete the cookie 2 hours after the cookie is
    created. The expiration time of a cookie is in seconds, so for this example 7200
    is 2 hours. Another way to look at it is (60 * 60 * 2).


    Have you ever opened your browser, visited a site, and were introduced to custom
    content that you had applied in a previous session? This data was determined by
    a cookie saved on your machine that was not deleted when the session ended.


    Look at an example of a cookie that doesn''t expire for three months.


    ```

    ```php

    <?php

    $secondsInDay = 86400;

    $daysBeforeExpiration = 90;

    setcookie("userStylePref", "blueTheme", (time() + ($secondsInDay * $daysBeforeExpiration));

    ?>

    ```

    ```


    You start by setting the number of seconds in a day—86400. Then you set our $daysBeforeExpiration
    variable that is holding how many days you want the cookie to live. The last step
    is to set the cookie. Multiply the seconds by the days, add to the time() function,
    and this becomes your expiration date.


    Three months is only an example; you can set a cookie to expire years later. However,
    users have a tendency to clean up their browser storage. So, you should never
    allow an application to rely on the existence of a cookie.


    # ## Deleting a cookie


    At some point in your application you will probably want to delete a cookie. However,
    the local Web browser that your user is on does not allow a Web server to directly
    delete a cookie. Instead, set the expiration date behind the current date and
    basically make the cookie expire. This tells the Web browser to delete the cookie
    because it is no longer in use.


    ```

    ```php

    setcookie("time_logged_in", "", (time() - 300));

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 138
  md: "# Assigning multiple cookies\n\nThe process of assigning multiple cookies is\
    \ fairly straightforward. You basically make multiple calls to the setcookie function\
    \ ensuring that each cookie has a unique name.\n\n```\n<?php\n\n$username = \"\
    jimmy\";\n$userID = 5;\n$loggedInTime = time();\n\nsetcookie(\"username\", $username);\n\
    setcookie(\"userid\", $userID);\nsetcookie(\"logged_in_since\", $loggedInTime);\n\
    \n?>\n```\n\nThe previous code sets three cookies by making three unique calls\
    \ to the setcookie function.\nYou could also place the setcookie call into a custom\
    \ function if the passed-in code requires\nmore security. For example, you can\
    \ create a saveCookie function that ensures the data is clean.\n\n```\n<?php\n\
    \nfunction saveCookie($name, $value, $expires=0)\n{\n    if($name == \"\")\n \
    \   {\n        print \"Name not provided, cookie not saved\";\n    }\n    if($value\
    \ == \"\")\n    {\n        print \"Value not provided, cookie not saved\";\n \
    \   }\n\n    setcookie($name , $value, $expires);\n}\n\n$username = \"jimmy\"\
    ;\n$userID = 5;\n$loggedInTime = time();\n\nsaveCookie(\"username\", $username);\n\
    saveCookie(\"userid\", $userID);\nsaveCookie(\"logged_in_since\", $loggedInTime);\n\
    \n?>\n```\n\nYour saveCookie function is used as a proxy to the prebuilt setcookie\
    \ function. This allows\nyou to check the passed in data and ensure that it is\
    \ filled in properly. In the previous example,\nyou print an error if either the\
    \ name or value is empty. You could take this simple security check a\nstep further\
    \ by ensuring the data is, in fact, a string and doesn't contain any potentially\
    \ malicious"
  merge: -1
  img_proc: true
- pgno: 139
  md: 'code. As you begin to develop Web applications you will learn to follow rigid
    guidelines as far as

    security is concerned.


    Now that you have looked at how to use cookies in PHP, you can look at using cookies
    in Flash. The

    process of using cookies in Flash is very similar, but offers some advantages
    that you will look at.


    # Using cookies in Flash


    Cookies in Flash are actually called shared objects and share similar attributes
    to cookies in PHP.

    Some of these attributes include the ability to store small amounts of data locally
    and retrieve them

    by any file in the same basic domain. Just like cookies in PHP, the user is able
    to disable them per

    site or globally. However, they have some distinct differences. One major advantage
    to shared

    objects is the ability to bind to them. This means multiple movies have the ability
    to watch the file

    and be alerted when it is updated. For example, say you have a multiplayer game
    and want each

    client to track the score in sync. With shared objects you can allow each of the
    clients to have

    read/write access and the others will update the score as it changes.


    # Loading shared objects


    The following code attempts to load a shared object and creates one if it doesn''t
    exist. As you can

    see, loading a shared object is fairly simple and only requires one line of code.
    Cookies in PHP

    don''t offer the ability to natively create one if it doesn''t exist; you have
    to check for the cookie and

    manually create it.


    ```

    var so:SharedObject = SharedObject.getLocal("sample");

    trace("Object is " + so.size + " bytes in size");

    ```


    # Saving shared objects


    The process of saving a shared object is also straightforward. Start by creating
    a new instance of the

    SharedObject class.


    ```

    var so:SharedObject = SharedObject.getLocal("sample");

    ```


    After the object is created, you can attach data to the shared object by adding
    elements to the data

    object, such as:


    ```

    var so:SharedObject = SharedObject.getLocal("sample");

    so.data.user = "guest";

    ```


    You can call and recall that above block of code and the value won''t be saved
    just yet. The reason is

    because you need to alert the object to write it to the local filesystem by calling
    the flush method.


    ```

    var so:SharedObject = SharedObject.getLocal("sample");

    so.data.user = "guest";

    so.flush();

    ```'
  merge: -1
  img_proc: true
- pgno: 140
  md: "> When using flush(), check whether the user has disabled local storage using\
    \ the Settings Manager (www.macromedia.com/support/documentation/en/flashplayer/help/settings_manager07.html).\n\
    \nIf the object doesn't exist, one is created. In some cases, you will want to\
    \ know if the shared object exists. The way to achieve that is by checking the\
    \ size property.\n\n```\nvar so:SharedObject = SharedObject.getLocal(\"sample\"\
    );\nif(so.size == 0)\n{\n    // Shared object doesn't exist.\n    trace(\"Shared\
    \ Object doesn't exist.\");\n}\n```\n\nAssuming the size test came back equal\
    \ to zero, you would know the shared object doesn't exist. You can then take this\
    \ result and replace the simple trace with the code to create the object.\n\n\
    ```\nvar so:SharedObject = SharedObject.getLocal(\"sample\");\nif(so.size == 0)\n\
    {\n    // Shared object doesn't exist.\n    so.data.user = \"guest\";\n}\n```\n\
    \n# Deleting a shared object\n\nUnlike PHP, shared objects can explicitly be deleted\
    \ from the local storage system. Making a call to the clear() method removes the\
    \ shared object and its data, but the reference to the object will remain.\n\n\
    ```\nvar so:SharedObject = SharedObject.getLocal(\"sample\");\nso.data.user =\
    \ \"guest\";\ntrace(\"Username is: \" + so.data.user); // guest\nso.clear();\n\
    trace(\"Username is: \" + so.data.user); // undefined\n```\n\nThe second trace\
    \ returns undefined because the previous call to clear() has removed the value.\
    \ You can now reassign the value. However, you do not need to delete an object\
    \ to reassign it. You can simply rewrite to it.\n\n# Bringing it all together\n\
    \nNow that you have looked at each individual concept, bring it all into one final\
    \ example. This example will create, save, edit, and delete a shared object.\n\
    \nStart by opening the starting file which can be found on the book's Web site,\
    \ which has been pre-built for this example."
  merge: -1
  img_proc: true
- pgno: 141
  md: "After opening the file in Flash, open the Action pane (press F9 or Alt+F9)\
    \ and add the ActionScript.\n\n```\nvar soDomain:String = \"sample\";\nvar so:SharedObject\
    \ = null;\nfunction loadObject():void\n{\n    so = SharedObject.getLocal(soDomain);\n\
    \    trace(\"Shared Object Loaded\");\n}\n```\n\n```\nfunction addDataToObject(name:String,\
    \ value:String):void\n{\n    if(so == null)\n    {\n        trace(\"You must first\
    \ load the Shared Object\");\n    }\n\n    so.data[name] = value;\n    so.flush();\n\
    \n    trace(\"Value added: \" + so.data[name]);\n}\n```\n\n```\nfunction deleteObject():void\n\
    {\n    if(so == null)\n    {\n        trace(\"You must first load the Shared Object\"\
    );\n    }\n\n    so.clear();\n\n    trace(\"Shared Object deleted\");\n}\n```\n\
    \n```\nfunction readObject(name:String):void\n{\n    if(so == null)\n    {\n \
    \       trace(\"You must first load the Shared Object\");\n    }\n    else\n \
    \   {\n        trace(\"Shared Object Value : \" + so.data[name]);\n    }\n}\n\
    ```\n\n```\nfunction loadHandler(e:MouseEvent):void\n```"
