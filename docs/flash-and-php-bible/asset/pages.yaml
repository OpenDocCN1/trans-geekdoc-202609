    {\n    var id:uint = e.target.parent.getID();\n    ...\n}\n```\n\nAfter the id\
    \ is known it can be used to remove the item from the array of cart items and\
    \ from the display list. The splice method is used to delete the cart item using\
    \ the id, which is actually the position the item can be found in the array. The\
