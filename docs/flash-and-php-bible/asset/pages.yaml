- pgno: 314
  md: "Even though you can clearly see numbers in the block of variables, all of the\
    \ parameters are set as strings to be compatible with the HTML equivalent. The\
    \ next piece is to establish the URL, which will be used to interface with PayPal.\
    \ This is essentially the same variable as action, which is found in the original\
    \ HTML.\n\n```\nvar paypalURL:String = \"https://www.paypal.com/cgi-bin/webscr\"\
    ;\n```\n\nWhen the PayPal variables and data are established, you can create the\
    \ code that is called when the Buy Now button is clicked.\n\nHere is the function\
    \ that is used to call PayPal. This method doesn't require the custom variables\
    \ to be passed in because they are defined outside of the function. Defining a\
    \ variable outside a function is scoped so any function has access to them. If\
    \ this variable is defined within the function it would only be visible to the\
    \ function in which it is defined. The exception is, of course, if the function\
    \ is global or the variable is returned from the created function.\n\n```\nfunction\
    \ callPayPal(e:MouseEvent):void\n{\n    var urlVariables:URLVariables = new URLVariables();\n\
    \    urlVariables.cmd = pp_cmd;\n    urlVariables.business = pp_business;\n  \
    \  urlVariables.item_name = pp_item_name;\n    urlVariables.item_number = pp_item_number;\n\
    \    urlVariables.amount = pp_amount;\n    urlVariables.currency_code = pp_currency;\n\
    \    urlVariables.weight = pp_weight;\n    urlVariables.weight_unit = pp_weight_unit;\n\
    \    urlVariables.lc = pp_location;\n\n    var urlRequest:URLRequest = new URLRequest(paypalURL);\n\
    \    urlRequest.method = URLRequestMethod.POST;\n    urlRequest.data = urlVariables;\n\
    \    sendToURL(urlRequest);\n}\n```\n\n# Using POST data\n\nThe method of the\
    \ data sent to PayPal is in POST format. This means the variables are included\
    \ in the call, but not on the URL as seen with GET. Using the POST format holds\
    \ a few advantages, the first being the URL is clean and can't really be tampered\
    \ with. The second is the added level of security when passing moderately sensitive\
    \ data to the server.\n\nIf you need to send highly sensitive data, such as billing\
    \ or credit card information, it is important that you use an HTTPS call. The\
    \ reason for that is POST really only becomes a Security by Obscurity and isn't\
    \ the safest result."
