- pgno: 228
  md: "The service located in the AMFPHP setup is responsible for running the `searchAndReplace`\
    \ method, but also makes a call to the `uppercase` method before returning the\
    \ string.\n\n```\n```actionscript\nfunction searchAndReplace(e:MouseEvent):void\n\
    {\n    var responder:Responder = new Responder(onResult, onFault);\n    \n   \
    \ gateway = new NetConnection();\n    gateway.connect(gatewayURL);\n    gateway.call(\"\
    Example.searchAndReplace\", responder,\n        \"hello world\",\n        \"world\"\
    ,\n        \"earth\"\n    );\n}\n```\n```\n\nThe final function is `upperCaseWords`,\
    \ which takes one argument and returns a new string with the first letter of each\
    \ word converted to uppercase. The rest of the function is the same as the previous\
    \ two. This is a good example of AMFPHP being able to accomplish something that\
    \ is not native to ActionScript, which, of course, is the uppercase portion.\n\
    \n```\n```actionscript\nfunction upperCaseWords(e:MouseEvent):void\n{\n    var\
    \ responder:Responder = new Responder(onResult, onFault);\n    \n    gateway =\
    \ new NetConnection();\n    gateway.connect(gatewayURL);\n    gateway.call(\"\
    Example.upperCaseWords\", responder, \"hello\n    world\");\n}\n```\n```\n\nOnce\
    \ the three functions responsible for calling the services are defined, the next\
    \ part is the debugging and result functions that are called when the service\
    \ returns a valid response.\n\nThe `onResult` function is called when a successful\
    \ message is received. In this simple example, the raw contents of the output\
    \ are sent to the `TextArea` component located on the Stage. You can also replace\
    \ the `TextArea` portion of the code with simple `trace()` statements for quicker\
    \ testing.\n\n```\n```actionscript\nfunction onResult(responds:Object):void\n\
    {\n    debugTxt.text = \"Response: \" + responds;\n}\n```\n```\n\nIf an error\
    \ occurs, the `onFault` function is called, which contains the specific error.\
    \ To better view the error, the contents of the object are run through a `for..in`\
    \ loop, which displays each item. This function also clears the `TextArea` to\
    \ ensure the old data is not mixed in, which could cause confusion while trying\
    \ to debug an application."
