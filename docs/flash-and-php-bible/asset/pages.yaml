    # Creating and storing a safe password using PHP


    The process of modifying a password that can be stored is fairly simple. You first
    create a connection to the PHP file passing along the clear text password. However,
    this process is not the most secure and it would be better to return an md5 response
    of the password when a login attempt is made.


    To explain the process, here is an example of the simple (less secure) option:


    ```

    ```actionscript

