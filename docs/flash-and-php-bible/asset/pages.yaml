    # Drawing API in Flash


    The drawing API that is included with Flash offers a wide range of tools, such
    as lines, circles, squares, and gradients. This example focuses on the line to
    create a Flash-based drawing tool.


    Once the starting file is opened {START_FILE}, you can begin to set up the initialization
    variables that hold the default pen color and size, as well as the container reference.


    ```

    var penMC:MovieClip;

    var isDrawing:Boolean = false;


    var penTipSize:uint = 1;

    var penColor:Number = 0x000000;

    ```


    The drawing application will be set up to draw the line when the mouse button
    is held down and stop when the mouse button is released. During the time the mouse
    button is down a persistent call to a mouse move function occurs to place the
    pen point at a different location. The pen is programmed to draw the line wherever
    the mouse pointer is located.'
