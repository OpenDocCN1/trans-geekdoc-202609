- pgno: 273
  md: '# PHP for chat application


    At this point, you have completed the ActionScript portion of the chat application.
    The second step is to develop the PHP code, which is called from the ActionScript.


    The PHP code is broken up into three files, which are illustrated in Table 11.4.


    | PHP Code File | Action |

    |---|---|

    | getMessages.php | Grabs all of the messages in the past 15 minutes |

    | messages.php | Handles the writing of a new message to the database |

    | dbConn.php | The database connection shared with the other files |


    The first file you work with is getMessages.php. The first part of the code loads
    or includes the database connection file, which you will look at in just a moment.
    The next part is the SQL call, which queries the MySQL database and grabs all
    the latest messages posted in the last 15 minutes.


    ```

    $sql = "SELECT * FROM flashChat WHERE dateAdded > " .

    (time() - (60 * 15));

    $result = mysql_query($sql);

    ```


    The condition of the last 15 minutes is determined by the following code. The
    time() returns a UNIX timestamp that is subtracted by 60 and multiplied by 15.
    The 60 is for seconds in a minute and the 15 is how many minutes you are referring
    to. You could also write this basic math equation by removing the multiplication
    step. Doing so makes it harder to read the code, but it also increases the speed
    of the application.


    ```

    time() - 900

    ```


    This SQL string is passed into the actual function that makes the call to the
    server mysql_query(), which is assigned to the $result variable. Now that you
    have successfully made the call to the MySQL database, the next step is to generate
    a loop that builds the messages. Figure 11.3 shows the query display in MySQL
    Query Browser, which is available for free from www.mysql.com.


    This loop is done using a while, which is set to run until a valid row is not
    returned from the database. You could also place this in a for loop and use mysql_num_rows()
    to determine how many rows are being returned.'
