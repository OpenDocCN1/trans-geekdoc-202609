    In this chapter you learned how to connect Flash to the PayPal Web services to
    develop a custom shopping cart. Once you completed the PayPal development portion
    you learned how to develop a custom shopping cart in Flash using Classes to simplify
    the development process.


    You then learned how to develop a searching system that utilized the Amazon.com
    searching API and gained an understanding of how third-party services return data.


    In the last part of the chapter you developed an image application using the flickr
    API. In the process, you learned some of the more robust features of PHP to drill
    down the data and build the requests using `sprintf`.


    The next step is to expand on this example and possibly build a photo gallery
    script with categories and the ability to add/edit photos. You could even integrate
    this little portion into a bigger application while using flickr as the graphical
    frontend or photo storage point.'
