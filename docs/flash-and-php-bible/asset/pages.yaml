    \ Under Premier Account, click Start Now. In the Create a PayPal Account form\
    \ that appears (see Figure 12.2), type the requested information.\n+   \n+   4.\
    \ After you submit your form, you will received a confirmation e-mail. You must\
    \ respond to the e-mail to activate your account.\n+   \n+   5. Log in and test\
