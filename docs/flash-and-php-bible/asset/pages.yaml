    # Exploring the Basics of MySQL


    MySQL is the storage application used with PHP to create a dynamic application.
    You can store

    pretty much any type of data in a MySQL database and have the ability to share
    that information

    with other applications and systems. Oftentimes a database is used when searching
    needs to be

    done or if data is changing frequently and many people will be requesting this
    updated data.


    The alternative to a database is a flat file (text file) that has many limitations,
    the most devastating

    being the fact that only so many instances of the file can be used at once. Another
    limitation is the

    ability to quickly index and search a text file.


    # Using statements


    The contents in a MySQL database are stored in tables. These tables are stored
    in databases that

    make up the MySQL system. The data stored in those tables is accessed using various
    statements

    and conditions, which are called queries.


    There are many statements that can be used in SQL queries.


    # SELECT


    The SELECT statement is the most common statement, which tells MySQL what contents

    (columns) you want returned from a table.


    ```

    ```

    SELECT id,name,ip, bio FROM users WHERE id=3

    ```

    ```


    You can select data from multiple tables using commas (,) to separate the column
    and table

    names.


    ```

    ```

    SELECT users.id, users.name, members.posts, members.subs FROM

    users, members WHERE members.userID=users.id AND users.id=3

    ```

    ```


    # INSERT


    The INSERT statement is used to add new rows to an existing table. There are multiple
    ways to

    define an INSERT.


    If you only want to update some columns you need to define those columns.


    ```

    ```

    INSERT INTO members (name, bio, ip) VALUES ($name, $bio, $ip);

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 79
  md: "A shortcut is used to exclude the column definitions. However, this is only\
    \ possible when all values are being updated or you have assigned default values\
    \ when you create the table.\n\n```\nINSERT INTO members ($name, $bio, $ip);\n\
    ```\n\nAfter an INSERT has completed, you can make a call to mysql_insert_id(),\
    \ which will return the ID of the last successful insert.\n\n```\n$result = mysql_query(\"\
    INSERT INTO members ( \" .\n  $name . \", \" .\n  $bio . \", \" .\n  $ip . \"\
    )\");\n```\n\n```\n$rowID = mysql_insert_id($result);\n```\n\n# DELETE\n\nThe\
    \ DELETE statement is used to remove one or more rows from a table. Like the other\
    \ statements, you can create a condition using WHERE, AND, OR, and so on.\n\n\
    ```\nDELETE FROM users WHERE id=3\n```\n\nYou can also remove all rows in a database\
    \ by omitting the condition:\n\n```\nDELETE FROM users\n```\n\nCAUTION The DELETE\
    \ statement is a very powerful one that should be used with extreme caution.\n\
    \n# Conditions\n\nConditions in MySQL are used to limit the amount of data that\
    \ is returned. For example, an SQL query such as the following would return all\
    \ users in the database:\n\n```\nSELECT * FROM users\n```\n\n# WHERE\n\nThis would\
    \ be okay if that’s what you want to occur. You probably only would want to return\
    \ certain users or even one specific user. This would be done using the WHERE\
    \ condition.\n\n```\nSELECT * FROM users WHERE id=3\n```\n\n# AND\n\nThe AND condition\
    \ is used when you need to match more than one condition. An example would be\
    \ you want to return a database of members that have been registered and have\
    \ a valid account.\n\n```\nSELECT * FROM users WHERE active=1 AND registered=\"\
    yes\"\n```\n\nYou can use any combination of the conditional statements, with\
    \ the exception that there should only be one WHERE statement."
