    no updates. This may not be a very desirable result because nothing is letting
    you know the server is currently running. You can add a very simple print statement
    to the top of the file, such as:


    ```

    <?php


    $host = "127.0.0.1";

    $port = "8888";


    set_time_limit(0);


    print "Starting Socket Server...\n";

    ...

