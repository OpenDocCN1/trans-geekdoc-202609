- pgno: 174
  md: '# # Chapter 8

    # Using Sockets


    +   IN THIS CHAPTER

    +   - Understanding sockets

    +   - Working with sockets in PHP

    +   - Working with sockets in Flash

    +   - Building a chat client with sockets using Flash and PHP


    When working with multiuser applications, there are different ways to send and
    receive data. You can use an XML-based delivery method. Another alternative to
    the standard delivery is to build a “pull” application that checks for updates
    using a timer.


    Sockets allow a “push” method that leaves out the timers and only updates when
    new data is sent across. The use of sockets is not limited to simple data; you
    could actually build a multiuser drawing application that would pass the coordinates
    across the various logged-in clients.


    This chapter is broken into two parts. The first part explains sockets. The second
    part is a simple Flash-based chat application using sockets as the delivery of
    the messages.


    # ## Understanding Sockets


    A socket is a communication endpoint or computer part of a network connected to
    another computer on the same protocol. The difference between a traditional connection
    (Internet) and a socket is the ability to make a distinction between which machines
    you are talking to.


    When you request a Web site from the Internet, you get the page you requested,
    but the Internet cannot push new data directly to you (the client) without requesting
    it once again.


    A socket provides this direct communication by allowing the master connection
    to send new data to you (the client). This is most commonly used in direct connection
    applications, such as instant messengers, video applications, and team collaboration
    environments.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Security in sockets


    The use of sockets does require a more direct connection, which means security
    is a larger concern. Generally, whatever tool you are using to implement the socket
    client or server allows a level of security directly within its own library. For
    example, Flash requires a trust to be set up in a different domain that allows
    both parties to authorize the connection. In contrast, a simple connection made
    by the command line does not have any implied security beyond standard protocol
    limits.


    **NOTE** Sockets can be a poor choice when implemented into certain systems or
    setups due to their direct connection nature.


    # Implementing a socket server


    The socket server master can be implemented using many common programming languages.


    For a persistent or production-level socket, you would most likely run it from
    a live server to ensure other users can connect to it and limit the risk of an
    open connection on your local system.


    # Understanding the socket connection


    The socket connection in the following example will be responsible for communicating
    with the user. The following sections explain that process.


    # Parts of a socket


    A socket connection is made of two pieces. The first part is the master connection
    or server, and the second part is the clients that connect to the master. The
    clients can talk directly to the master but cannot generally talk to other clients.
    If you want the clients to talk with each other you would implement a talkback
    system within the master.


    # Binding


    The master socket is bound to a specific IP address and port. This means the master
    connection is made to this specific point to ensure the connection is unique.
    Clients that want to communicate with that socket server must connect to the same
    IP address and port as the master.


    # Listening


    This is similar to the standard Web server. Once the socket server starts, it
    listens for active clients and new ones that want to connect. These clients are
    then added to the queue and begin to receive communications from the group.


    # Working with Sockets in PHP


    Building a socket server in PHP requires some prior configuration. A socket server
    within PHP cannot be run from the standard graphic version due to its persistent
    connection. A standard Web browser-based connection would timeout or possibly
    crash the host machine.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'A socket connection would be run using the nongraphic command-line version
    of PHP (CLI). The first step to working with sockets in PHP is to determine if
    you have this CLI version of PHP installed, as it is not normally included in
    a Web server package.


    # Looking for command-line version of PHP


    The command-line version (CLI), if installed, is usually accessible directly from
    the Terminal on a Mac or the command prompt on a PC (see Figure 8.1).


    To determine if you have this version, simply open the command line. In Windows,
    click Start and then Run. Type cmd in the Run dialog box and click OK. If you''re
    using a Mac, open the Finder, navigate to Applications/Utilities, and open the
    Terminal.


    # FIGURE 8.1

    Example of a command prompt in Windows XP


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_176_0.png)


    With the command line open, type the following:


    ```

    $ php -v

    ```


    That command tells PHP to report the version information and exit. The results
    should look something similar to the following:


    ```

    PHP 5.2.5 (cli) (built: Dec 20 2007 02:55:52)

    Copyright (c) 1997-2007 The PHP Group

    Zend Engine v2.2.0, Copyright (c) 1998-2007 Zend Technologies

    ```


    If you get a response similar to the following, it means the PHP version may be
    installed but not globally accessible from any command line and will require configuration.


    ```

    -bash: php: command not found

    ```


    You will need to locate the command-line version or install it to continue with
    this chapter.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '> See Chapter 1 for information on how to install the command-line version
    of PHP.


    # Building a socket server


    To build a simple socket server using PHP, start by creating a file and saving
    it to a commonly accessible location. This file does not need to be in your Web
    directory and will probably only be harder to work with if it is.


    > You want to ensure the socket file is not visible to the Web because it could
    cause your PHP to not work properly if a malicious user attempted to run the file.


    To better understand how sockets work, start with a very simple socket server
    example.


    # Simple PHP-based socket server


    The first part of the socket server is to determine the server IP address and
    port number. If you are running the server locally you don''t need to determine
    your physical IP address. Instead, you can use the local address.


    ```

    <?php


    $host = "127.0.0.1";

    $port = "8888";

    ```


    The port number is not specific, but it needs to be unique on the same machine
    to ensure it won''t collide with any other application on your system or network
    (if used remotely).


    This script will need to inform PHP to continue running because it needs to check
    for and manage connections indefinitely. This is achieved by passing the set_time_limit
    function a value of 0, meaning this script should never stop until properly exited.


    ```

    set_time_limit(0);

    ```


    With the configuration out of the way, you can create the master socket connection.


    ```

    $sock = socket_create(AF_INET, SOCK_STREAM, SOL_TCP);

    ```


    The three arguments passed into the socket_create function define which type of
    connection it is and are PHP constants. For this example they are not important,
    but they will be explained later in the chapter.


    The $sock variable now contains an active socket resource id. The next step is
    to bind the socket to the port defined in the first part of the code.


    ```

    socket_bind($sock, $host, $port);

    ```


    After the socket is bound to the port, you can start listening for connections.
    The first argument is the $socket variable, which holds the socket resource id.
    The second argument is a backlog variable that tells PHP how many messages to
    queue up before an error is passed to the client. This'
  merge: -1
  img_proc: true
- pgno: 178
  md: "variable is a suggestion because some systems will define or override this\
    \ value. For example, Windows sets this based on the underlying service provider\
    \ and basically ignores any user-submitted value.\n\n```\nsocket_listen($sock,\
    \ 4);\n```\n\nAt this point, you have built a socket server that doesn't do anything.\
    \ This basically means the server starts and waits for incoming connections but\
    \ does not handle them in any way. The next step is to set up the portion of the\
    \ socket server that handles the incoming connections.\n\nYou need to create another\
    \ socket that handles the incoming connections by making a call to socket_accept\
    \ passing in the $socket resource id.\n\n```\n$childSocket = socket_accept($sock);\n\
    ```\n\nFrom this point the $childSocket variable is used to handle all client\
    \ communications. The data sent from a connection is read using the socket_read\
    \ function.\n\n```\n$incomingData = socket_read($childSocket, 2048);\n```\n\n\
    This function takes two arguments. The first argument is the client socket handler,\
    \ and the second argument is the number of bytes to read from the client. This\
    \ can be useful when trying to run a more efficient socket server. It is also\
    \ a good idea to limit the output on the client side (if possible).\n\nThe socket_read\
    \ function continues to load information into the $incomingData variable until\
    \ the data limit is hit or one of the following characters is found: carriage\
    \ return (\\n), tab (\\t), or \\0. PHP treats those as end-of-input characters\
    \ and moves to the next line in the script when one is found.\n\n# Responding\
    \ to the client connection\n\nAfter the data is loaded, the next step is to act\
    \ on that data and in most cases respond to the client. For example, the following\
    \ is a simple question/answer demo that has PHP responding to one question:\n\n\
    ```\nif(substr($incomingData, 0, -2) == \"are you hungry?\")\n{\n    $response\
    \ = \"Server Response > I could eat!\\n\";\n    socket_write($childSocket, $response,\
    \ strlen($response));\n}\n```\n\nThe socket_write function takes three arguments.\
    \ The first is the child socket resource id; the second argument is the response\
    \ being sent to the client. The third argument, which is optional, is the length\
    \ of the $response. This example only sends a response back to the client when\
    \ you ask PHP if it is hungry. As you can see, this is not a very practical application,\
    \ but does clearly explain how sockets are set up and how to interact with them.\n\
    \nThe last step to the sample application, before testing it, is closing the two\
    \ socket connections to free up the resources and allow new connections to be\
    \ made."
  merge: -1
  img_proc: true
- pgno: 179
  md: 'If you want to still receive connections you would only want to remove the
