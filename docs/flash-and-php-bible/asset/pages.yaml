  md: "```\n{\n    print \"Video Name: \" . \"<strong>\" . $row['name'] . \"</strong>\"\
    ;\n}\n?>\n```\n\nWhen you run this code, you should be presented a list of videos\
    \ for that specific category. This code searches the category and video tables\
    \ and returns all videos that share the same ids. This is the most basic join\
    \ of MySQL tables, but it works perfectly for this application.\n\n# Remoting\
    \ integration\n\nThe next step is to build the actual PHP that will be called\
    \ by Flash using remoting. In fact, this section is similar in the fact you will\
    \ be using AMFPHP. But the actual development portion beyond this is different.\n\
    \n> CROSS-REF More information on remoting can be found in Chapter 8.\n\nThe advantage\
    \ to building this application using remoting is it gives you the ability to test\
    \ it more easily. This is because you can build the AMFPHP classes and then test\
    \ them using standard PHP code or the included browser viewer that ships with\
    \ AMFPHP.\n\nYou also have the ability to reuse these classes in other projects\
    \ or with HTML portions of the same project. For example, assume you want to build\
    \ a user panel that can display the latest movies from a specific category. You\
    \ can do this by building a very basic HTML page and calling the remoting class\
    \ to return the necessary data, just like you would in Flash.\n\n# Database connector\
    \ class\n\nThe classes in this application are dependent on the database. Rather\
    \ than define the connection details in every class, it is better to build a database\
    \ connector class that is responsible for making the initial connection and storing\
    \ the connection credentials.\n\nThe connector class has five private variables.\
    \ The first four define the connection information.\n\n```\n<?php\n\nclass DatabaseConnector\n\
    {\n\n    private $host   = \"localhost\";\n    private $user   = \"root\";\n \
    \   private $pass   = \"password\";\n    private $dbName = \"book_videoplayer\"\
    ;\n\n}\n\n?>\n```"
