  md: "The ActionScript for the completed application will automatically populate\
    \ a category list. Dynamically load in the images and allow previous and next\
    \ navigation through each category of images.\n\n# Developing the ActionScript\n\
    \nNow that you know what the application will do, you can start to place the variables.\n\
    \n```\nvar phpPath:String = \"http://localhost/ch10/photoGallery/\";\nvar phpFile:String\
    \ = phpPath + \"gallery.php\";\n\nvar images:Array = new Array();\n\nvar imageHolder:MovieClip;\n\
    var categoryHolder:MovieClip;\n```\n\nThe first two variables are referencing\
    \ the PHP file that generates the category and image data. The images variable\
    \ is used to store the image data sent back from the PHP, which is used for loading\
    \ the images. The last two variables in this section are holder MovieClips for\
    \ the main image and navigation. Both of these variables are populated at runtime\
    \ once the image and category data are loaded.\n\nThe next set of variables needed\
    \ is specifically for navigating around the images and categories.\n\n```\nvar\
    \ currentID:uint;\nvar currentImage:Number = 0;\nvar imageDir:String = \"photos/\"\
