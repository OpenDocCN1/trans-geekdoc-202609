  md: "The application is constructed of prebuilt components that have already been\
    \ placed in the starting file. The three main elements you are interested in are\
    \ the List, TextArea, and Submit components. Each of these components has been\
    \ assigned an instance name that is referenced in the ActionScript.\n\n# Importing\
    \ classes\n\nMost of the classes that ship with Flash do not require you to import\
    \ them. However, there are some exceptions, one of which is the ListEvent class.\n\
    \n```\nimport fl.events.ListEvent;\n```\n\nWhen the event is imported you can\
    \ assign the variables for your RSS application. The only global variable needed\
    \ for this application is the php reference.\n\n```\nvar phpPath:String = \"http://localhost/ch10/rssReader/\"\
    ;\nvar phpFile:String = phpPath + \"rss.php\";\n```\n\n# Loading the PHP\n\nThe\
    \ function used to load the PHP, which returns XML is very similar to previous\
    \ examples. Set up a URLRequest, a URLLoader, and attach a handler to the COMPLETE\
    \ event.\n\n```\nfunction loadFeeds():void\n{\n    var urlRequest:URLRequest =\
    \ new URLRequest(phpFile);\n    var urlLoader:URLLoader = new URLLoader();\n \
    \   urlLoader.addEventListener(Event.COMPLETE, feedHandler);\n    urlLoader.load(urlRequest);\n\
    }\n```\n\nThe feedHandler() function is responsible for working with the response\
    \ from the PHP call. In this application, the PHP sends back XML, which is used\
    \ to populate the List component. The RSS entries are placed into the List component\
    \ using the addItem() function.\n\nThis feedHandler function accepts an object\
    \ as an argument. The object needs at least a label property in order to add the\
    \ item, but you would generally add the data property as well.\n\n```\nfunction\
    \ feedHandler(e:Event):void\n{\n    ...\n    for each(var item in xml..entry)\n\
    \    {\n        topicsList.addItem({label:item..name, data:item..desc});\n   \
    \     topicsList.addEventListener(ListEvent.ITEM_CLICK,\n            listClickhandler);\n\
    \    }\n}\n```"
