- pgno: 247
  md: "# # Importing classes in PHP\n\nImporting a class in PHP is done by loading\
    \ the file using include or require. Using include will attempt to load the file,\
    \ but will continue if the file isn't found. Require, on the other hand, also\
    \ looks for the file, but exits the script with a fatal error if the file is not\
    \ found, as shown in Figure 10.1. Using require offers the ability to halt a script\
    \ if the proper files aren't found. Here is an example of loading a class by requiring\
    \ it:\n\n```\n<?php\n\nif(!file_exists('Interface.php'))\n{\n    print \"Class\
    \ 'Interface' not loaded, exiting script!\";\n}\n@require('Interface.php');\n\n\
    class Example\n{\n    function Example()\n    {\n        $i = new iExample();\n\
    \n        print \"My i: \" . $i->samplr();\n    }\n}\n\n$example = new Example();\n\
    \n?>\n```\n\nAn if statement is used to first check for the existence of the file,\
    \ because require will create a fatal error, which means the script will be unable\
    \ to report any proper error messages. If for some reason the file is not found,\
    \ the message is sent to the browser and the script ends silently when it reaches\
    \ the require line. The @ is used to silence the internal errors that more often\
    \ than not cause a security concern because they display crucial file paths. An\
    \ alternative way to hide errors is to disable error reporting, which is explained\
    \ in Chapter 13.\n\n# # Instantiation\n\nClass instantiation is the act of making\
    \ a class instance. The action is the same in any OOP language, but each language\
    \ has a different way of setting it up. In PHP, you first create a variable and\
    \ then assign the class to that variable. Once the new instance is created, you\
    \ can access the public methods and properties of that class.\n\n```\n$myNewInstance\
    \ = new Example();\n```"
  merge: -1
