- pgno: 358
  md: "The next step is to build the event handlers that will be used to determine\
    \ the pen state and enable or disable the drawing ability. The isDrawing variable\
    \ is toggled to define the current state of the application. This startDrawing()\
    \ method is only called when the mouse is clicked. It is important that a new\
    \ line is created in case the color or size variables have changed.\n\n```\nfunction\
    \ startDrawing(e:MouseEvent):void\n{\n  trace(\"Start Drawing\");\n  isDrawing\
