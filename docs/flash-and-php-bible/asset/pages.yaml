  img_proc: true
- pgno: 199
  md: '# FIGURE 8.4

    The completed application (socketChat.fla), which can be found on the book’s Web
    site


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_199_0.png)


    After the connection is made, assign the event listeners, which will be called
    when new data is sent or loaded.


    ```

    socket.addEventListener (Event.CLOSE, closeHandler);

    socket.addEventListener (Event.CONNECT, connectHandler);

    socket.addEventListener (IOErrorEvent.IO_ERROR, ioErrorHandler);

    socket.addEventListener (SecurityErrorEvent.SECURITY_ERROR,

    securityErrorHandler);

    socket.addEventListener (ProgressEvent.SOCKET_DATA, sockHandler);

    ```


    The chat client also needs event handlers that will be assigned to the message
    box and text input submission buttons, such as:


    ```

    msgTxt.addEventListener (Event.CHANGE, inputHandler);


    clearBtn.addEventListener (MouseEvent.CLICK, clearButtonHandler);

    sendBtn.addEventListener (MouseEvent.CLICK, sendButtonHandler);

    ```'
