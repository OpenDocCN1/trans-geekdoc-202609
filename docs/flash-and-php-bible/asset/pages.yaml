- pgno: 20
  md: '# Introduction


    This book is a multipart exploration into Flash and PHP. Flash has been used for
    everything from basic banner ads to fully functional applications across the web
    and desktop.


    Oftentimes you can find information required to write amazing Flash applications
    or the server-side counterpart but rarely both. This book builds both aspects
    and explains the process of working with PHP in your Flash projects.


    The first part of the book is a step-by-step walkthrough of the installation and
    configuration process for PHP and all the necessary components. Once the components
    are installed, the next step is an overview of PHP and a guide to what features
    and techniques you will find in the book as you continue through the chapters.


    Each chapter starts off with a basic overview and then moves quickly into the
    relevant information, leaving out any fluff to ensure you are getting all of the
    important information right away.


    Part II focuses on the importance and best practices of making your applications
    more secure while maintaining functionality. The topic of security is repeated
    throughout the various examples in this book, but this part in particular is where
    you will find the majority of the security information.


    Part III is extending Flash and PHP by working with various third-party applications
    and libraries. This chapter finishes with an overview of AMFPHP to build more-advanced
    and easier-to-maintain applications.


    Part IV takes all the previous information and walks you through the process of
    building complete real-world applications in Flash and PHP. These real-world applications
    will help you build your own custom versions and ultimately allow you to create
    more-advanced and dynamic applications.


    # Examples and Source Files


    You can find all the source code and starter files for the examples in this book
    on the following web site.


    ```

    www.wiley.com/go/flashandphpbible

    ```'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# What You''ll Need


    The ActionScript used in this book is not advanced, but a basic understanding
    of the fundamentals would allow you to better understand the examples. The Flash
    Bible is a perfect complement to this book and I highly recommend it.


    A basic understanding of OOP practices would help you in the second portion of
    the book but is not required to understand the examples overall. You may want
    to pick up a book on advanced OOP practices to gain a more thorough understanding
    of the topic.


    The PHP used in this book is assuming a very basic understanding of the subject.
    This means you will not only learn the advanced topics but how to get there by
    starting at the beginning. PHP also allows you to develop in a class-based format,
    so that will be utilized in the full-application chapters to ensure you are building
    a more complete and updatable application.


    The last thing you will need is an Internet connection to download the code for
    the book and work with some of the third-party services. This is not used in the
    entire book, but to get the full experience the Internet connection will be needed.


    That is everything you will need. Now is the time to jump in. Chapter 1 is only
    a few pages away.'
  merge: -1
  img_proc: true
