  md: '# # Chapter 17


    # ## Building Complete Advanced Applications


    Rather than have the book end with a basic overview, I thought a fully developed
    video player application would allow you to fully understand the process of building
    an application.


    This chapter utilizes various concepts and technologies learned in the previous
    chapters. I recommend reading those first unless you are just curious about the
    types of applications you can develop using Flash and PHP or already have some
    familiarity with Flash and PHP.


    This chapter is divided into five parts, each building on the previous section
    and resulting in a complete, PHP-driven video player. You can also take the concepts
    and components developed in this chapter and use them in your own projects. For
    example, the login component will be developed as a stand-alone module, which
    allows you to drop it into another application with very little modification.


    +   **IN THIS CHAPTER**

    +   - Using a basic video player

    +   - Building a video player in Flash and PHP

    +   - Working with video tracking

    +   - Building a user login component in Flash

    +   - Finalizing the video player


    # ## Building a Basic Video Player


    Flash offers a large array of functionality. The possibilities of what you can
    develop using Flash are only limited by your time and imagination.


    Video is a very valuable asset on the Internet with the advancement of high-speed
    broadband connections. Flash is the best way to deliver video because of the wide
    availability of the Flash Player for all of the most popular Web browsers.


    Flash allows developers to build a video player and be assured that the widest
    audience possible will be able to view it. It also doesn''t hurt that'
