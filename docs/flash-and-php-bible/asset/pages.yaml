    \ just needs to be stored.\n\n```\nprivate var albumName:String;\nprivate var\
    \ albumDesc:String;\nprivate var albumThumb:String;\nprivate var albumPrice:String;\n\
    private var storeItemID:uint;\n```\n\nThe StoreItem method is left empty and actually\
    \ isn’t required because the ActionScript compiler will place it automatically,\
