    \ be a fairly simple example for creating an md5 hash. In real-world usage you\
    \ would want to seed the md5 encryption to make the response more unique and harder\
    \ to break open.\n\nA seed is a known value that is used in the md5 process. If\
    \ you want to create a truly random seed, using the time( ) is a good idea because\
    \ nearly every call produces a different result.\n\nThe hash for this example\
    \ needs to be verifiable when the user attempts to log in. For this example, the\
    \ name of the application used will be \"securepass\".\n\n```\ncfcd208495d565ef66e7dff9f98764da\n\
    ```\n\nThe seed is appended to the existing string that will be encrypted, either\
    \ at the beginning or the end.\n\n```\n$md5 = md5($string + \"securepass\");\n\
    ```\n\nThe position of the seed needs to be consistent because it will be re-created\
    \ when the user attempts to log in the next time.\n\nThe PHP code with the unique\
    \ seed applied would look something like this:\n\n```\n<?php\n$string = $_GET['string'];\n\
    \nif(strlen($string) == 0)\n{\n print \"response=\" . \"String not provided.\"\
    ;\n}\nelse\n{\n $md5 = md5($string + \"securepass\");\n print \"response=\" .\
    \ $md5;\n}\n\n?>\n\n```\n\nAt this point in the application the seed is created,\
    \ and you can continue on with the process of storing that value into a shared\
