    # Using Flash to Develop a Video Player


    Video players, such as the one illustrated in Figure 13.5, are becoming more and
    more popular as the Internet continues to get faster. The idea behind this section
    is to develop a video player that is interfaced with PHP to load in the video
    list, as well as keep track of the play count.


    Flash already ships with a pretty versatile video player component, but you can
    still expand upon it, which is exactly what this section will help you achieve.


    The application is constructed of a `VideoPlayer` and `ComboBox` component that
    has already been placed on the Stage. The start file ({START_FILE}) is provided
    so you can focus on the development and can quickly test as you go.


    # FIGURE 13.5

    A video player with a video loaded and playing


