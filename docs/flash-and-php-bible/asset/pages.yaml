    ''--with-png-dir=/usr/local/php5'' ''--enable-gd-native-ttf'' ''---

    with-freetype-dir=/usr/local/php5'' ''--with-

    gettext=shared,/usr/local/php5''

    ```


    When the configuration process is complete (which can take a while depending on
    the system), create and run the installer:


    ```

    make

    make install

    ```


    After the make install command is completed, PHP should be installed.


    # Configuration


    A few portions of PHP need to be configured to make sure it works seamlessly with
    Apache and your overall development system. This process is fairly easy to complete,
    but incorrect modification can result in a broken system. Also, when modifying
    configuration files, it is best to make a backup first.


    The first step is to move the php.ini file to a central location that PHP will
    use when it starts up.


    ```

    cp php.ini.recommended /usr/local/lib/php.ini

    ```


    In order for Apache to load PHP files, add the necessary module references:


    ```

    LoadModule php5_module modules/libphp5.so

    AddType application/x-httpd-php .php .phtml

    AddType application/x-httpd-php-source .phps

