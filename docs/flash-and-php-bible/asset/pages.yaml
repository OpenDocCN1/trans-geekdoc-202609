    {\n\t$s = addslashes($s);\n}\n```\n\nThe other two functions in the sanitization\
    \ class simply clean the passed-in data and return it.\n\n# Using shared objects\n\
    \nAs you begin to build more complete applications you will come to a point where\
    \ storing some small amounts of data on the user's machine becomes necessary.\
    \ These small pieces of information generally hold a user id or session that maps\
    \ to a database entry on the live server. A Shared Object Flash cookie is used\
