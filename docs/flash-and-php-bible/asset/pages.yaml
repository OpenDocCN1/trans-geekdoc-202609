    example will either contain an md5 string or an error.


    The PHP simply checks for a valid string and returns an md5 hash (encrypted string).
    If an incomplete or empty string is sent from the Flash, the PHP returns an error
    message.


    ```

    ```php

    <?php

    $string = $_GET[''string''];

    if(strlen($string) == 0)

