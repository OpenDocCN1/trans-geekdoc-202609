  md: "```\nvar urlRequest:URLRequest = new URLRequest(serverFile);\nnavigateToURL(urlRequest,\
    \ \"_blank\");\n```\n\nThe window parameter can accept one of the following strings,\
    \ as shown in Table 3.1.\n\n| Window Targets for Links |\n|---|---|\n| \"_self\"\
    \ | Current frame in the current window |\n| \"_blank\" | New window |\n| \"_parent\"\
    \ | Parent of the current frame |\n| \"_top\" | Top-level frame in the current\
    \ window |\n\nThe window parameter can also accept a custom name, such as the\
    \ name of a frame or specific window. For example, assuming you want to send a\
    \ link to the window named \"childWindowBox\", the code would look like the following\
    \ block:\n\n```\nvar serverFile:String = \"http://localhost/callLink.php\";\n\
    var urlRequest:URLRequest = new URLRequest(serverFile);\nnavigateToURL(urlRequest,\
    \ \"_childWindowBox\");\n```\n\nYou substitute the prebuilt window names and add\
    \ your custom name. Although this is a small change, it offers some great added\
    \ functionality.\n\nOpening a new or existing window is just one of the possibilities\
    \ for connecting with other data.\n\nAnother type of one-way communication in\
    \ Flash can be performed by using sendToURL().\n\nThe sendToURL() is used to silently\
    \ communicate with a script. Silent communication is a form of one-way communication\
    \ which does not load a separate Web page. This form of communication offers the\
    \ ability to send data to a server without interfering with the user's browsing\
    \ experience.\n\nHere is the previous example, with the new function added, along\
    \ with some basic error handling to manage invalid and unavailable requests.\n\
    \n```\nvar serverFile:String = \"http://localhost/callLink.php\";\nvar urlRequest:URLRequest\
    \ = new URLRequest(serverFile);\ntry\n{\n    sendToURL(urlRequest);\n}\n```"
