    master last in case you have to loop through multiple client connections first.


    # Testing the socket server


    Testing of the socket server can be done using a simple prompt or terminal, as
    shown in Figure 8.2. With the command line open, start the command-line version
    of PHP, passing in the sample file using the -f option.


    ```

    $ /path/to/php -f /path/to/socket/sample/simpleSocket.php

    ```


