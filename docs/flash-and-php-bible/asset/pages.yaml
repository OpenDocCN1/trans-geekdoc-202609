  md: '# # Testing the login component


    The next step is to test the login component to make sure everything is working
    properly. The first step is to create a new instance of the LoginWindow component
    in a stand-alone FLA, or you can use the sample file found with the book''s source
    code.


    ```

    var login:LoginWindow = new LoginWindow();

    ```


    Once the instance is created, the next step is to assign an event handler for
    the custom LOGIN_ATTEMPT event that is called when the user types data into both
    the username and password fields and then clicks the Login button.


    ```

    login.addEventListener(LoginWindow.LOGIN_ATTEMPT, loginHandler);

    ```


    After the Login window component loads and the proper event handler is assigned,
    the next step is to add it to the display list, which makes it visible.


    ```

    addChild(login);

    ```


    # # Assigning a stage event handler


    You want to make sure any modification to the stage redraws the login component,
    or items that are being blocked can accidentally reposition themselves beyond
    the blocking MovieClip.


    ```

    stage.align = StageAlign.TOP_LEFT;

    stage.scaleMode = StageScaleMode.NO_SCALE;

    stage.addEventListener(Event.RESIZE, stageResizeHandler);

    ```


    After the event is assigned to the stage object, you need to create the function
    that is being referenced in the event listener. For this application, the handler
    simply makes a call to the redraw method of the login component. In a real-world
    application you may have more functionality in this event, but for now this is
    fine for testing.


    ```

    function stageResizeHandler(e:Event):void

    {

    login.redraw();

    }

    ```


    # # Handling the login attempt


    The next function is used to handle login attempts. For simplicity, this function
    has a predefined username and password that is later replaced with a remoting
    service in the next section.


    If a valid login is reached, the close method of the login component is called.
    This removes the Login box and enables the application for that session.


    ```

    function loginHandler(e:Event):void

    {

    if(login.data.username == "guest" && login.data.password ==

    "pass")

    ```'
