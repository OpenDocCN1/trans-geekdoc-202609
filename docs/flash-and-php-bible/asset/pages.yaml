    At this point you have completed the Flash and PHP video player. You can now test
    the application, and you will see the same interface you started with. The difference
    is, if you select a category, the ScrollPane will be populated with the videos
    from that category.


    You can then click on a video item and that video will begin to play. As it stands,
    the video player is a pretty robust application that can be expanded.


    In the next section you will do just that by adding some basic tracking. Then,
    in a later section, you add a user login component that results in a truly real-world
    application while maintaining the original functionality the player has now.


    # Working with Video Tracking


    In the previous section, you built a complete Flash-based video player that has
    PHP allowing for a dynamic result. This application allows the owner to simply
    update the database, and the Flash application reflects those updates the next
    time it loads.


    A problem comes in when the owner wants to know which videos are popular. You
    want the project to help him determine which video content is popular so he can
    add more of that similar content.


    The solution is to develop video tracking that logs how many times a video has
    been viewed. This is done by having a column in the database that holds the active
    count. You then add the necessary support to the PHP classes and finally update
    the Flash to display the count.'
