- pgno: 161
  md: "When the application that makes use of the Shared Object reopens, it would\
    \ be configured to look for this small piece of data and make a call to a server\
    \ based on the result. However, just like normal cookies that your browser uses,\
    \ a Shared Object can be edited by the end user, which can have harmful results.\n\
    \nAs stated in the previous section, it is best to not trust data that a user\
    \ submitted. This common guideline ensures a more secure application and overall\
    \ makes it easier to work with.\n\n**NOTE** The majority of holes in an application\
    \ are exploited by user-submitted data.\n\nImagine an example application, which\
    \ would be used to work with a shared object. This application could be set up\
    \ to open a shared object and pass that data to a remote server.\n\nOnce the shared\
    \ object has been loaded, a call to the remote server could be made passing along\
    \ the small piece of information from the shared object. In this example, the\
    \ small piece of information could be a user ID that would have been saved in\
    \ a previous usage.\n\n# ## Using PHP to handle data from shared objects\n\nThe\
    \ PHP code is responsible for loading this piece of information and querying the\
    \ database. However, before a call to the database is made, the user id is validated\
    \ ensuring it is a valid number and within range.\n\n```\n<?php\n\n$userID = $_GET['user_id'];\n\
    $idRange = 500;\nif(is_numeric($userID) && $userID > 0 && $userID < $idRange)\n\
    {\n    // connect to database at this point\n    mysql_connect(\"localhost\",\
