  md: "# # Building a Simple File Editor\n\nAt this point you have seen a wide selection\
    \ of real-world applications, but there is still one that hasn't been talked about.\
    \ That of course would be a content management system. A complete content management\
    \ system would be a massive project, but this section focuses on one aspect of\
    \ the application.\n\nThe file editor, which is used to add and edit files, is\
    \ a crucial piece to any content management system. It is likely that at some\
    \ point the admin is going to need updates made. Rather than download the source\
    \ material, it is much more efficient to use a dynamic file editor.\n\nThe application\
    \ for this section is just that—a dynamic file editor that is connected to PHP\
    \ to actually save and load the files. Normally you can use Flash to load the\
    \ files, but PHP offers the ability to load files that are not stored in the Web\
    \ root. This is a good idea for template files, because they never need to be\
    \ directly accessed by a guest.\n\nThe design of the file editor is a basic TextArea,\
    \ Submit button, TextField, and ComboBox. Nothing that exciting for designing\
    \ the file editor; instead, the real meat of the application is within the ActionScript\
    \ and PHP code.\n\nStarting with the PHP code allows you to test the Flash portion\
    \ as you begin to develop it. The PHP is actually very simple for this example.\
    \ First, check for a valid file because whether you are saving or loading, you\
    \ need a valid file.\n\n```\nif(!empty($_GET['file']))\n{\n    $file = './files/'\
    \ . $_GET['file'];\n    ...\n}\n```\n\nAfter you determine there is a valid file,\
    \ the next step is to check whether the action is blank. If the action is blank,\
    \ the code will automatically load the action; if the action contains a value\
    \ it gets compared using an inner if statement.\n\n```\nif($_GET['action'] ==\
    \ 'save')\n{\n    ...\n}\nelse\n{\n    ...\n}\n```\n\nThis example only allows\
    \ loading and saving the files. In a more robust application you would most likely\
    \ want to have a delete or move action as well."
  merge: -1
  img_proc: true
- pgno: 395
  md: "The save action is responsible for loading the requested file, replacing the\
    \ existing text, and finally resaving the file. It is important to note that the\
    \ example is overlooking a crucial piece to any real-world application, which\
    \ is escaping the data that is sent from Flash. You may also want to add an access\
    \ key so arbitrary code can't be run on from the browser via a GET request.\n\n\
    The variable $fileContents is retrieved from the GET data sent by Flash.\n\n```\n\
    $fileContents = $_GET['fileContents'];\n```\n\nThe file is loaded using fopen\
    \ with write access set to overwrite. This means the original content is removed\
    \ and only the new version is saved.\n\n```\n$handle = fopen($file, 'w+');\n```\n\
    \nOnce the file is loaded, a call to fwrite() is made, which actually writes the\
    \ contents to the file and saves the file. The last step of the save action is\
    \ to close the file resource and free up the memory.\n\n```\nfwrite($handle, $fileContents);\n\
    fclose($handle);\n```\n\nThe loading of a file is much easier. Basically, you\
    \ reference the file and load the contents using file_get_contents(), which returns\
    \ the entire file as a string, as shown in Figure 13.7.\n\n```\n$loadedFile =\
    \ file_get_contents($file);\nprint \"fileContents=\" . $loadedFile;\n```\n\nHere\
    \ is the completed php file, which should be saved with the name fileManager.php:\n\
    \n```\n<?php\nerror_reporting(0);\n\nif(!empty($_GET['file']))\n{\n\t$file = './files/'\
    \ . $_GET['file'];\n\n\tif($_GET['action'] == 'save')\n\t{\n\t\t$fileContents\
    \ = $_GET['fileContents'];\n\n\t\t$handle = fopen($file, 'w+');\n\t\tfwrite($handle,\
    \ $fileContents);\n\t\tfclose($handle);\n\t}\n\n\telse\n\t{\n\t\t$loadedFile =\
    \ file_get_contents($file);\n\t\tprint \"fileContents=\" . $loadedFile;\n\t}\n\
    }\n```"
