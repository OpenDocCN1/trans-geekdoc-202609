- pgno: 488
  md: "```\nloginMC.loginBtn.addEventListener(MouseEvent.CLICK,\n loginHandler);\n\
    }\n```\n\n# redraw method\n\nThe redraw method is called whenever the interface\
    \ changes. This is mostly a concern when the user has the ability to resize the\
    \ Stage, although most Web site applications have a fixed size. This method needs\
    \ to have some logic regarding the blocking clip to ensure it isn’t drawn more\
    \ than once. The blocking clip is a movieclip that removes interaction from the\
    \ application which forces the user to log in by “blocking” the mouse clicks.\n\
    \n```\npublic function redraw():void\n{\n if(blocker == null)\n {\n ...\n }\n\
    \ else\n {\n ...\n }\n ...\n}\n```\n\nThe contents of the conditional for when\
    \ the blocker clip is null draws the actual blocking MovieClip using the built-in\
    \ drawing API.\n\n```\nblocker = new MovieClip();\n blocker.alpha = 0.5;\n blocker.graphics.beginFill(0x000000);\n\
    \ blocker.graphics.drawRect(0, 0, stage.stageWidth,\n stage.stageHeight);\n```\n\
    \nOnce the clip has been drawn, the next step is to assign fake event handlers\
    \ to the blocking clip. Flash doesn’t have a native interface that you can disable\
    \ because the code could be customized. The way around this is to build a pseudo-disabler.\
    \ This is nothing more than a MovieClip placed on the stage that traps all the\
    \ mouse interaction and cancels it. This prevents the underlying interface and\
    \ application from being used until this blocking clip is removed.\n\n```\nblocker.addEventListener(MouseEvent.ROLL_OVER,\
    \ dummyHandler);\n blocker.addEventListener(MouseEvent.ROLL_OUT, dummyHandler);\n\
    \ blocker.addEventListener(MouseEvent.CLICK, dummyHandler);\n```\n\nAfter the\
    \ first time the display is redrawn, the blocker will have already been created.\
    \ A simple width and height adjustment is the only necessary update. In fact,\
    \ if you call the standard redraw method without the conditional, each time you\
    \ would see another blocking clip as they begin to stack up.\n\n```\nblocker.width\
    \ = stage.stageWidth;\n blocker.height = stage.stageHeight;\n```"
  merge: -1
  img_proc: true
- pgno: 489
  md: "Regardless of whether this is the first pass of the redraw method or not, the\
    \ blocking clip needs to be repositioned. The login window is placed dead center,\
    \ which means you can calculate the padding around it, multiply this to create\
    \ a negative number, and place the blocking clip using that calculation.\n\n```\n\
    // reverse the offset to position blocker\nblocker.y = y * -1;\nblocker.x = x\
    \ * -1;\n```\n\nWhen all the calculations are complete, you can add the blocker\
    \ MovieClip to the DisplayList, which makes it visible in the application.\n\n\
    ```\naddChild(blocker);\n```\n\n> NOTE Making all the position-based calculations\
    \ before the clip is added to the display list minimizes flickering and jumping\
    \ objects in your application.\n\n# Swapping placement of two MovieClips\n\nActionScript\
    \ 3 does not have any depth management like what is found in ActionScript 2 and\
    \ its predecessors. The equivalent is taking the id of a clip and swapping it\
    \ with another clip. This appears to be depth management, except for the very\
    \ important fact that ActionScript takes care of the reordering when the children\
    \ are swapped.\n\nIn this example, you want to make sure the login box is above\
    \ the blocking clip because if it is placed below it, the user is not able to\
    \ interact or log in to the application:\n\n```\ncontainer.swapChildren(loginMC,\
    \ blocker);\n```\n\n# Centering a MovieClip\n\nThe last step of the redraw method\
    \ is to center the login box on the Stage to ensure it is always in the middle.\
    \ This is constantly updated when the redraw method is called because resizing\
    \ the stage would make the login box sit at a noncentered position.\n\n```\nloginMC.x\
    \ = (stage.stageWidth / 2) - (loginMC.width / 2);\nloginMC.y = (stage.stageHeight\
    \ / 2) - (loginMC.height / 2);\n```\n\nThe calculation uses the stage dimensions\
    \ and login box dimensions to determine the middle point. This is where the loginMC\
    \ MovieClip is placed when the calculation is completed.\n\n# close method\n\n\
    The close method has one task: to remove the current login box and allow the application\
    \ to be used once again. The removal process is achieved by removing the container\
    \ child, which contains the login box and blocking MovieClip.\n\n```\npublic function\
    \ close():void\n{\n\tcontainer.parent.removeChild(container);\n}\n```"
  merge: -1
  img_proc: true
