- pgno: 77
  md: "# # include_once\n\nThe include_once() statement is similar to the require_once\
    \ with the exception that if the file is not found, it only displays a simple\
    \ error.\n\n# ## Using type checking in PHP\n\nUnlike most programming languages,\
    \ PHP doesn't require strict typing of variables. This means you don't have to\
    \ define what type of data a variable will hold.\n\nThis may seem like a good\
    \ thing because variables can be shared. However the potential downside to this\
    \ approach is that a variable that you expect to be a string could potentially\
    \ show up as an array. This would most likely break your code or cause an exploitable\
    \ portion of code. Imagine code similar to the following:\n\n```\n```php\n$id\
    \ = -1;\n\nif(isset($id))\n{\n    // sql call here, set id to a string, for some\
    \ reason\n    $id = \"user id\";\n}\n\n// more logic here\nif($id == -1)\n{\n\
    \    // user not logged in\n}\nelse\n{\n    // user logged in\n}\n```\n```\n\n\
    This is an overly dramatic example because it is full of worst-case scenarios,\
    \ but you can see how untyped variables can cause headaches.\n\n# ## Type checking\
    \ functions\n\nPHP does offer some special functions that allow you to check the\
    \ type of a variable, but this does not stop other code from overwriting the variables.\n\
    \nAn example of one of these functions would be is_string, which checks to see\
    \ if the passed-in variables contents are string.\n\n```\n```php\n$saying = \"\
    Hello, World!\";\n\nif(is_string($saying))\n{\n    print \"$saying is a string\"\
    ;\n}\n```\n```"
