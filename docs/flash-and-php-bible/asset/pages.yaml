    \ data:files[i]});\n}\n```\n\nThe method loadFile is called when the loadBtn is\
    \ clicked. This handler sets up a file request with a file variable that PHP uses\
    \ to load the actual file.\n\n```\nfunction loadFile(e:MouseEvent):void\n{\nvar\
    \ variables:URLVariables = new URLVariables();\nvariables.file = fileListCombo.selectedItem.data;\n\
    \nvar urlRequest:URLRequest = new URLRequest(phpFile);\nurlRequest.data = variables;\n\
    \nvar urlLoader:URLLoader = new URLLoader();\nurlLoader.addEventListener(Event.COMPLETE,\
    \ fileLoaded);\nurlLoader.load(urlRequest);\n}\n```\n\nAfter the requested file\
    \ is loaded and PHP returns the contents, it is sent into the bodyTxt TextArea\
    \ and also to the storedFileData variable. This variable is used to cache the\
    \ unmodified results. You can revert to these results later by clicking the Reset\
