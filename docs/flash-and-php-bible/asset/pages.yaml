- pgno: 250
  md: '# Using Classes in Flash


    As stated previously, classes in Flash and PHP are similar in most aspects. Let’s
    look at how you use and modify classes in ActionScript Flash.


    # Importing


    Importing a class in ActionScript is a little less forgiving if the class is not
    found. In fact, the compiler that runs when you export a movie stops if a class
    is not found. This basically means you don’t need error messages if a class is
    not loaded, because the movie is never able to be seen by the general public.


    The exception to this compiler check is if the class is dynamic, which means its
    overall structure can change, but that is beyond the scope of this book. Now back
    to importing classes, which would be set up like this:


    ```

    import com.organization.project.Example;

    var example:Example = new Example();

    trace("Call a method: " + example.methodName());

    ```


    You may have noticed the use of import instead of require or include. The other
    obvious difference in the preceding example is the :Example type definition. This
    actually isn’t required, but it allows better error checking when the movie is
    being compiled or is running.


    # Document class


    The Document class is used as the main class for an application. Think of it as
    the Timeline class, similar to the days of adding basic code on frame 1 of a movie.
    Those days are over and it is a good thing, too. However, there are some things
    to know about when using a Document class, as shown in Figure 10.2. First, look
    at what a Document class looks like:


    ```

    package

    {

    import flash.display.MovieClip;

    public class DocRoot extends MovieClip

    {

    function DocRoot

    {

    trace("I am the Document Class");

    }

    }

    }

    ```'
  merge: -1
  img_proc: true
