    ```\n\n# ## Using sendToURL\n\nIn previous examples, you may have noticed the\
    \ use of navigateToURL, which calls a URL and offers the ability to send GET data\
    \ across the URL. This example calls for POST data, so the use of sendToURL is\
    \ a better option. It is important to understand that the sendToURL method sends\
    \ the request to the server, but ignores any response that is returned.\n\n```\n\
