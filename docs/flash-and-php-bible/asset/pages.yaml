- pgno: 413
  md: '# Summary


    You should now have a pretty solid knowledge of the tools and practices available
    to successfully debug your applications in Flash and PHP. These are not the only
    tools and practices available to debug an application. Developers are coming up
    with better ways all the time, partially because it is an important task and also
    because it is the most dreaded in the development cycle.


    In this chapter you learned how to create your own custom errors and how to work
    with the standard error types found in PHP. You also learned how to debug code
    within Flash using the Output panel and trace statements.


    The last section of the chapter focused on the development of a custom debug handler
    in ActionScript, which displays the messages in a color-coded scrollbox to better
    identify your debug messages.'
  merge: -1
  img_proc: true
