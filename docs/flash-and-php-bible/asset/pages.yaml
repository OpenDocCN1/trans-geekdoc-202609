- pgno: 120
  md: '# Chapter 5


    # Interacting with the User


    +   IN THIS CHAPTER

    +   - Form development

    +   - Developing a contact form

    +   - Creating a login module


    An application will often times have some level of interaction with the end user
    to enrich the overall application experience. This is most commonly a contact
    or some other type of form, which allows the site owner to allow communication
    without providing an e-mail address or requiring the user to have an e-mail client.
    Another form that you would find in an application is a login form, which allows
    you to limit access to certain aspects or sections of your application.


    This chapter will explain the process of building forms in Flash and how to make
    them interactive using PHP. You will also obtain an overview of sending data using
    Flash; however, I recommend you look at Chapter 4 to completely understand the
    process of sending and loading data.


    # Form Development Using Flash


    Forms generally consist of input boxes, buttons, list boxes, and radio buttons,
    as shown in Figure 5.1. Each of these elements is available as a component within
    Flash. You can access the Components pane by choosing Window > Components. Using
    one of these prebuilt components is as simple as clicking and dragging it to a
    layer in your Flash document.'
  merge: -1
  img_proc: true
- pgno: 121
  md: "# FIGURE 5.1 Sample form built using the default components that ship with\
    \ Flash\n\n![](img/d9d48cd53eee0fbc1ebc363c322fac2c_121_0.png)\n\n> NOTE If the\
    \ component doesn’t appear on the Stage, ensure the layer is not displaying a\
    \ locked icon in the Layer list.\n\nIf you run this Flash movie, you would see\
    \ some cool components on the Stage but they would be nonfunctional. The process\
    \ of using them is very straightforward. You assign an instance name to the component\
    \ and reference the name in your ActionScript.\n\nFor example, if you had a TextInput\
    \ and wanted to prefill it, you would add the following code:\n\n```\ntextInstance.text\
