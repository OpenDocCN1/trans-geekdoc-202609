    \ then increased by 50 pixels to allow spacing for the thumbnail.\n\n```\nphotoItem.y\
    \ = (photos.length * (photoItem.height + 50));\n```\n\nAnother more elegant solution\
    \ is to create an event handler that would align the photos once it is loaded.\
