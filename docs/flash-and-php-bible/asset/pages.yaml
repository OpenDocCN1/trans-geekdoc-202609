  md: "The next file to develop is getPhotos.php, which opens the photo directory\
    \ and returns the XML file populated with source information for each of the photos.\n\
    \nThe meat of this file is the getPhotosFromID() function, which accepts one argument,\
    \ an id. You want to make sure a valid ID is passed before continuing so a simple\
    \ conditional statement will work in this case. If a valid ID has been found,\
    \ then you can continue with the opening of the directory and the while loop.\n\
    \n```\n<?php\n\n$photo_dir = \"photos/\";\n\nfunction getPhotosFromID($id=null)\n\
    {\n    global $photo_dir;\n\n    if($id == null)\n    {\n        print \"ID Not\
    \ Provided\";\n        return false;\n    }\n\n    $xml = \"<photos id=\\\"\"\
    \ . $id . \"\\\">\";\n\n    $dir = opendir($photo_dir . $id);\n    while(false\
    \ != ($file = readdir($dir)))\n    {\n        if($file != \".\" && $file != \"\
    ..\")\n        {\n            $xml .= \"<photo name=\\\"\" . \"\" . \"\" src=\\\
    \"\" . $file . \"\\\"\"/>\n\";\n        }\n    }\n\n    closedir($dir);\n\n  \
    \  $xml .= \"</photos>\";\n\n    return $xml;\n}\n\n?>\n```\n\nThe while loop\
    \ is set up to loop through each file in the directory until the file pointer\
    \ is false, which means no valid file was found.\n\n```\nwhile(false != ($file\
    \ = readdir($dir)))\n{\n    ...\n}\n```"
