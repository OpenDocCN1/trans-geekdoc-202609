- pgno: 106
  md: '# Chapter 4


    # Working with Data


    Working with data is the process of sending and loading information for ActionScript
    to interpret. There are two types of data that can be used in ActionScript. These
    would be static and dynamic.


    In most common cases, the dynamic process is preferred over static. Mainly because
    dynamic data oftentimes includes a database component.


    This chapter is about working with dynamic data in both Flash and PHP. You start
    by loading simple text files, then move on to XML and more advanced loading. The
    chapter concludes with a complete demo application that loads image data to display
    a thumbnail and normal size image.


    +   - How to load data

    +   - Sending data

    +   - Loading XML

    +   - Loading images using PHP


    # Loading Data in Flash


    Loading data in Flash is a very common practice. In almost every project, you
    want to have some dynamic (updatable) portion. The purpose of dynamic data is
    to limit the amount of updating necessary. For instance, if you look at a news
    site, you will see that most of the outer content doesn''t change (logos, navigation,
    etc.). This is also true for a Flash application where you will most likely only
    have a certain portion that actually needs to be updated. This section walks you
    through the process of loading data from XML all the way to images and sound.


    The process of loading data in Flash becomes familiar fairly quickly as most types
    of data you will be loading have similar requirements.


    Start by looking at a simple example that would load a text file. This example
    will look for the text file in a couple of different locations depending on where
    the application is being run. If you execute this code within the Flash'
  merge: -1
  img_proc: true
- pgno: 107
  md: "IDE it will look in the same place the FLA is saved or in the user's temp directory\
    \ if the file has not been saved. If the code is in a compiled SWF, the text file\
    \ will be loaded from the same directory the SWF is stored in.\n\n```\nvar txtFile:String\
    \ = \"sample.txt\";\nvar urlRequest:URLRequest = new URLRequest(txtFile);\nvar\
    \ loader:URLLoader = new URLLoader();\nloader.addEventListener(Event.COMPLETE,\
    \ loadHandler);\nloader.load(urlRequest);\n\nfunction loadHandler(e:Event):void\n\
    {\n    var loader:URLLoader = URLLoader(e.target);\n    trace(\"Loaded Data: \"\
    \ + loader.data);\n}\n```\n\nThe previous example loads a \"sample.txt\" file\
    \ and traces all of its contents to the Flash Output panel, which opens automatically.\
    \ Another way to open or close the Output panel is by choosing Window➤Output.\n\
    \n# Understanding the classes used to load data\n\nActionScript in Flash has a\
    \ series of prebuilt classes that are used to load data. The following section\
    \ will explain the function of each of those classes.\n\n# URLRequest\n\nThis\
    \ class is used to set up the file that is loaded. You can either assign this\
    \ directly to a variable, or to keep your overall code more compact, assign it\
    \ directly within the load() of the URLLoader. In fact, you can apply this process\
    \ to many of the classes. This has no impact on the functionality of the class\
    \ and is not a required step.\n\n```\n...\n    loader.load(new URLRequest(txtFile));\n\
    ```\n\n# URLLoader\n\nAs stated in the Adobe Live Docs, “The URLLoader class downloads\
    \ data from a URL as text, binary data, or URL-encoded variables. It is useful\
    \ for downloading text files, XML, or other information to be used in a dynamic,\
    \ data-driven application.”\n\nThe URLLoader serves two purposes when sending\
    \ and loading data in ActionScript. The first purpose of the URLLoader is to set\
    \ up the complete handler. The other purpose is to capture the loaded data within\
    \ the complete handler. One noticeable difference of the second purpose is the\
    \ fact the URLLoader does not have a new keyword before it."
