- pgno: 71
  md: 'An argument is a value that is passed into the function and later used within
    the function as a local variable.


    ```

    addNumbers(4, 6); // outputs 10

    ```


    Functions in PHP can have a default argument assigned, which means they won''t
    require that argument to be passed in, such as:


    ```

    function addNumbers($num1, $num2, $print=true)

    {

    if($print)

    {

    print "Sum is: ".($num1 + $num2);

    }

    else

    {

    return ($num1 + $num2);

    }

    }

    ```


    This function will print the result directly to the screen or return the value
    if the $print variable is false, which it is by default. You cannot exclude an
    argument in the middle of defining other arguments. For example, the following
    function call would be invalid:


    ```

    function say($upperCase=false, $string)

    {

    if($upperCase)

    {

    return strtoupper($string);

    }

    else

    {

    return $string;

    }

    }

    ```


    ```

    say("Hello, World!");

    ```


    This would assign the passed-in string to the $upperCase value and ignore the
    $string variable. Because PHP does not worry about what type of value is passed
    in, this results in an error at the line where it returns the string.


    Classes also have functions, called methods. Methods can retain special features
    that standard functions cannot.'
  merge: -1
  img_proc: true
- pgno: 72
  md: "# Understanding control structures\n\nMost programming languages have control\
    \ structures that offer code fragments and overall provide a more dynamic path\
    \ for an application. The following is some of the more common control structures,\
    \ including the ones used in the majority of this book.\n\n# if\n\nThe if construct\
    \ is found in any popular programming language, PHP included. It allows for conditional\
    \ execution of code fragments. An example of an if statement would be:\n\n```\n\
    $admin = getAdminStatus();\nif($admin == true)\n{\n  print \"Admin logged in,\
    \ show admin controls\";\n}\n```\n\nYou can nest if statements with other if statements\
    \ an unlimited amount of times. A more realistic use of nesting if statements\
    \ is a login application that has varied levels of authentication.\n\n```\n$loggedIn\
    \ = true;\n$admin = true;\n$editable = true;\n\nif($loggedIn)\n{\n  if($admin)\n\
    \  {\n    if($editable)\n    {\n      // allow the page to be\n      // edited\
    \ because a valid\n      // administrator is logged in\n    }\n  }\n}\n```\n\n\
    # else\n\nAssume you want to display an error message to users not logged in and\
    \ the proper control panel if the user is logged in. This is done using an else\
    \ statement, which is executed if the condition in the if is not met.\n\n```\n\
    $loggedIn = false;\nif($loggedIn)\n{\n  // display control panel\n}\nelse\n{\n\
    \  // display login form and error message\n}\n```"
  merge: -1
  img_proc: true
- pgno: 73
  md: "An else is not required and is placed after all other conditional checks, such\
    \ as elseif, which is in the next section.\n\n# elseif\n\nThe elseif is the combination\
    \ of an if and an else. This statement is placed after an if and allows the code\
    \ to match another condition, which can be completely different than the if run\
    \ before.\n\n> An else or else..if will only be evaluated if the preceding conditional\
    \ is not met.\n\n```\n$loggedIn = false;\n$colorOfSky = \"blue\";\n\nif($loggedIn)\n\
    {\n   // user logged in\n}\nelseif($ColorOfSky == \"blue\")\n{\n   // color of\
    \ sky is blue, log user in??\n}\n```\n\n# while\n\nThe while is a type of loop.\
    \ The code within the curly braces {} runs “while” the condition is met. Once\
    \ the condition is no longer valid, the loop stops.\n\n> Loops in PHP can run\
    \ forever if not programmed correctly. Use caution when working with loops and\
    \ always check for valid data first.\n\n```\nwhile($x < 50)\n{\n   print \"x=\"\
    \ . $x . \"<br />\";\n   $x++;\n}\n```\n\n# for\n\nA for loop is the most complex\
    \ loop in PHP. Here is an example:\n\n```\nfor ($x=0; $x < 10; $x++)\n{\n   print\
    \ \"x=\" . $x . \"<br />\";\n}\n```\n\nThe first expression ($x=0) is executed\
    \ unconditionally once at the start of the loop. The second expression ($x < 10;)\
    \ is evaluated on each pass and the loop will continue until this condition is\
    \ met or the loop is stopped using a break. On each pass, the third expression\
    \ ($x++) is executed. In this example, it increments $x on each pass."
  merge: -1
  img_proc: true
- pgno: 74
  md: "You can nest `for` loops and even define multiple variables in the first expression.\
    \ This can make your code faster, but harder to read.\n\n# foreach\n\nThe `foreach`\
    \ loop is used to iterate over an array. You assign the loop variable to the desired\
    \ array, and on each pass the value is stored in that loop variable.\n\n```\n\
    ```php\n$fruits = array(\"Orange\", \"Apple\", \"Banana\", \"Grapefruit\");\n\
    foreach($fruits as $fruit)\n{\n    print \"Fruit: \" . $fruit;\n}\n```\n```\n\n\
    > The variable `$fruit` will still exist once a `foreach` loop has been completed,\
    \ so it is a good idea to destroy the variable using `unset()`, such as `unset($fruit)`.\n\
    \n# break\n\nThe `break` control ends the execution of a loop, regardless if the\
    \ condition is met or not. You can place an optional numeric value informing PHP\
    \ of how many levels it should break out. This is useful when you have a nested\
    \ loop that needs to tell the parent to exit if an error occurs.\n\n```\n```php\n\
    for($i=0; $i < count($users); $i++)\n{\n    for($j=0; $j < 5; $j++)\n    {\n \
    \       if($users[$i][$j]['valid'] == false)\n        {\n            // found\
    \ invalid user, group is compromised\n            // exit both loops\n       \
    \     break 2;\n        }\n    }\n}\n```\n```\n\n# continue\n\nUnlike `break`,\
    \ `continue` will exit the current iteration of a loop, but allow the remaining\
    \ iterations to continue on.\n\nThis is useful when you are looping through a\
    \ bunch of data and only want to act on valid data.\n\n```\n```php\nfor($i=0;\
    \ $i < count($users); $i++)\n{\n    if($users[$i]['valid'] == false)\n    {\n\
    \        // invalid user, continue with remaining list\n        continue;\n  \
    \  }\n    // more code logic here\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 75
  md: "Just like the `break`, `continue` will also accept a numeric argument telling\
    \ it how many levels of enclosing loops to skip over.\n\n# switch\n\nA switch\
    \ is similar to a series of if statements using the same expression (variable).\
    \ You would generally use a switch when you want to test a variable against a\
    \ lot of conditions.\n\n```\nswitch($userLevel)\n{\n    case 'ADMIN':\n      \
    \  print \"User is an admin\";\n        break;\n    case 'MODERATOR':\n      \
    \  print \"User is a mod\";\n        break;\n    case 'MEMBER':\n        print\
    \ \"User is an member\";\n        break;\n\n    case 'GUEST':\n        print \"\
    User is an guest\";\n        break;\n}\n```\n\nA break is used to ensure the remaining\
    \ checks will not run; in fact, if you remove the breaks, every condition will\
    \ be checked, which can cause problems if you intend to do a multilevel validation.\n\
    \n# require\n\nThe require() statement attempts to load a file and will exit the\
    \ script with a Fatal Error if that file is not found. This function checks for\
    \ the file against the current included_path as well as the directory the file\
    \ is running in.\n\n```\nrequire(\"importantFile.php\");\n```\n\nThe error that\
    \ is displayed (see Figure 2.3) can sometimes cause a potential security concern\
    \ in that it will display the path the file exited on. A better way to handle\
    \ this is to create a check for the file first and display a cleaner, less crucial\
    \ message to the user.\n\n```\nif(!file_exists(\"importantFile.php\"))\n{\n  \
    \  $error = \"Sorry, one of the core components could not be loaded\";\n    exit($error);\
    \ // display clean error and exit remaining script\n}\nrequire(\"importantFile.php\"\
    ); // never runs, if file doesn't exist\n```"
  merge: -1
  img_proc: true
- pgno: 76
  md: '# FIGURE 2.3


    PHP require() error as seen in the browser


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_76_0.png)


    # include


    The include() statement is similar to the require with the exception it will display
    an error but not stop the execution of the script.


    ```

    include("optionalFile.php");

    ```


    # require_once


    The require_once statement behaves similarly to require, with the exception that
    if the current file is already loaded it will not attempt to load it again. This
    is more useful as you continue to build large applications that sometimes share
    many files. This ensures that no redundant code is loaded.


    ```

    require_once("requiredFile.php");

    // ... other code here

    require_once("requiredFile.php");

    ```


    The second require_once will not run because the file has already been loaded
    in the previous portion of the code.'
