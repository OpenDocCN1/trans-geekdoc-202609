- pgno: 260
  md: '# # Chapter 11

    # Developing Basic Applications


    In this chapter, you develop a series of full applications. The objective of this
    chapter is to end up with complete applications while explaining common pitfalls
    and how to overcome them. You will investigate some new concepts as well, such
    as multiple event handlers, custom classes, and remote services.


    This chapter also focuses on the best way to work with MySQL in an efficient and
    safe way. The chapter concludes by evaluating best practices for maintaining the
    applications and allowing the ability to add new functionality.


    +   - Understanding elements of an application

    +   - Developing a chat client

    +   - Building a Gallery using PHP

    +   - Using MySQL to create a series of other dynamic applications


    # # Understanding Elements of an Application


    Building applications isn’t only about jumping into Flash or your favorite editor
    and writing line after line of code. The best place to start in application development
    is the evaluation stage. This is the point where you look at the list of what
    your application should do, who the audience is, and how you plan to develop the
    application. Table 11.1 illustrates the three points of the evaluation stage.'
  merge: -1
  img_proc: true
- pgno: 261
  md: "| What | Defines what the application will do |\n| --- | --- |\n| Who | The\
    \ target audience of your application |\n| How | Techniques you use to develop\
    \ your application |\n\nThe following examples skip over the “how” step because\
    \ this is a Flash and PHP book. Once the “how” is defined you can think about\
    \ the “who.” This is, of course, your target audience. An application will not\
    \ always have a rigidly defined who, especially if it is a service Web site, but\
    \ it is best to define one. The best way to determine your target audience is\
    \ to think about the type of application. For example, will it be an e-commerce\
    \ application or maybe video player. Knowing who will be using the application\
    \ is crucial to its success.\n\nNow that the “how” and “who” are defined, you\
    \ can think about what exactly your application will do. You would never go to\
    \ the hardware store, buy all the materials, and then decide what to build. The\
    \ same is true for developing applications. As you begin to follow these practices\
    \ they become second nature.\n\n# Understanding application design\n\nWith the\
    \ evaluation stage completed you would naturally move into the design stage. But,\
    \ just like the evaluation stage, it is always a good idea to plan first. This\
    \ would be a sketch with paper and pencil or using Flash with primitive shapes.\
    \ For example, Figure 11.1 shows an example sketch.\n\n# Working with pseudo-code\n\
    \nAfter you have the overall layout of the application developed, you can move\
    \ on to functionality. This would be the point where you start to write pseudo-code,\
    \ such as functions, variables, events, and any other concepts you will use in\
    \ your application. The following is an example of pseudo-code for a user management\
    \ program.\n\n```\n// Pseudo-code\n\nfunction loadUser(id:uint):void\n{\n  //\
    \ make call to server passing\n  // along the id as the user id\n}\nfunction handleServerResponse(e:Event):void\n\
    {\n  // capture server response\n  // make necessary calls to application\n}\n\
    \nfunction drawInterface():void\n```"
