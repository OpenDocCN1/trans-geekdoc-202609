- pgno: 294
  md: "You use a conditional if statement to exclude .and .. which is directory pointers\
    \ for current directory and parent directory. If you exclude this check there\
    \ will be at least two bogus entries in the XML file; or worse, the file can error\
    \ out all together because it could put the while loop into an infinite recursive\
    \ state.\n\nAfter all of the images in the directory are gathered, you will want\
    \ to close the directory to free up valuable resources. This is especially important\
    \ if the file could be used by someone else at the same time.\n\n```\nclosedir($dir);\n\
    ```\n\nThe last step in this file is to return the XML for Flash to process.\n\
    \nAfter have created the category and photo files, you can create the gallery.php\
    \ file, which handles the calls from PHP and returns the proper XML based on what\
    \ is requested.\n\n```\n<?php\ninclude 'categories.php';\ninclude 'getPhotos.php';\n\
    \nheader('Content-type: text/xml');\n\nif($_GET['action'] == 'cat')\n{\n    print\
    \ getCategories();\n}\nelse if($_GET['action'] == 'photos')\n{\n    print getPhotosFromID($_GET['id']);\n\
    }\n?>\n```\n\nThis file starts by including the two previous files you created.\
    \ Then a header() call is made to force the output of all content as proper XML.\
    \ This header function can be used for pretty much any content type. You basically\
    \ set it, and from that point the output follows that format. For example, assume\
    \ you want to export content as a PNG.\n\n```\nheader(\"Content-type: image/png\"\
    );\n```\n\n> Make sure you use the correct content type in your application. Using\
    \ the wrong one can cause errors and in rare cases cause an application to crash.\n\
    \nThe final block of code is used to determine which content you are requesting.\
    \ The two types of content available in this example are category and photo list.\
    \ The $_GET['action'] variable is passed from Flash on the url as a query string.\n\
    \n```\nhttp://localhost/photoGallery/gallery.php?cb=1192408716823&action\n=cat\n\
    ```"
