- pgno: 96
  md: '```

    $link = mysql_connect($host, $user, $pass);

    ```


    ```

    ?>

    ```


    The mysql_connect function accepts three arguments. The hostname is the first
    argument,

    which is almost always set to "localhost". The second is the username that was
    chosen when

    you installed MySQL, and finally, the password of your MySQL database, which is
    blank for a

    default setup.


    The mysql_connect function returns a resource id, which is a reference to the
    current MySQL

    connection. This id can be used in future SQL calls, such as mysql_query, and
    many other

    functions. If you happen to print this $link variable you will see a resource
    code. The following

    code sample returns that resource ID:


    ```

    <?php


    $link = mysql_connect("localhost", "root", "");

    print "Response: " . $link;


    ?>

    ```


    The previous block of code produces a response, such as:


    ```

    Response: Resource id #32

    ```


    # ## Persistent connection


    The standard mysql_connect function will close the connection once the script
    finishes execut-

    ing. However, there are some cases where you will want to maintain a connection
    that doesn''t close

    once the script is finished.


    The function mysql_pconnect is exactly what accomplishes this. This function maintains
    a con-

    nection after the script executes. The advantage to mysql_pconnect is it removes
    the necessity

    for a new connection. However, the disadvantage is that the persistent connections
    are stored in a

    pool and you aren''t guaranteed the same connection each time, which can produce
    unexpected

    results.


    Here is an example of a persistent connection, where the only change is a p in
    front of the word

    "connect" on the connection function.


    ```

    <?php


    $link = mysql_pconnect("localhost", "root", "");

    print "Persistent Resource ID: " . $link;


    ?>

    ```


    # ## Closing the connection


    After the SQL finishes executing, a best practice is to remove the connection
    to free up resources and

    memory. This is done by simply making a call to mysql_close(), which closes the
    connection.'
  merge: -1
