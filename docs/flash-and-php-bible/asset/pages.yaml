- pgno: 368
  md: "# Using Flash to Develop a Site Monitor\n\nWhen you own or operate a Web site\
    \ it can sometimes go offline, but most likely you will never know if it is down\
    \ for just a brief moment unless you happen to be checking the site. What happens\
    \ if you operate many Web sites and are busy working while your site goes down?\
    \ Most likely your site goes offline and you are not aware of it.\n\nThis section\
    \ contains the explanation and development of a Flash-based site monitor that\
    \ logs failed attempts to reach the server. It can even be set up to e-mail the\
    \ administrator if the system encounters a site that has not responded after a\
    \ certain point (configurable by the operator).\n\nThe MySQL table schema (outline)\
    \ is as follows:\n\n```\nCREATE TABLE siteMonitor (\n id INT NOT NULL AUTO_INCREMENT,\n\
    \ name VARCHAR(100) DEFAULT \"\" NOT NULL,\n uri TEXT NOT NULL,\n active VARCHAR(1)\
    \ DEFAULT 1 NOT NULL,\n PRIMARY KEY (id)\n );\n```\n\n> **CROSS-REF** There are\
    \ many ways that you can load the MySQL schema into your database. For an explanation,\
    \ see Chapter 2.\n\n# Developing the PHP for the site monitor\n\nThe first part\
    \ of the PHP is loading in the connection information for the database. This is\
    \ placed in an external file, so it can be shared across projects. In fact, if\
    \ you are using the same database as previous examples in this book, you can reuse\
    \ the old dbconn.php because it will not be changed for this application.\n\n\
    If you haven't already created the dbconn.php, here are the contents. You fill\
    \ in the real information for your server, which can be obtained from the Web\
    \ server administrator if you are not the owner, or your hosting provider if you\
    \ do own your server.\n\n```\n<?php\n\n$host = \"localhost\";\n$user = \"USERNAME\"\
    ;\n$pass = \"PASSWORD\";\n$database = \"DATABASE_NAME\";\n\n$link = mysql_connect($host,\
    \ $user, $pass);\nmysql_select_db($database, $link);\n\nunset($host);\nunset($user);\n\
    ```"
