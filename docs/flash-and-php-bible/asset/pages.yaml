    The assignment of the Document class is fairly unique. You can add or edit the
    class file using the following steps:


    +   1. Click on the Stage, to ensure nothing is selected.

    +   2. Open the Properties inspector if it isn''t already open.

    +   3. Click in the Document Class TextBox and add the name of the class.


    You may have noticed the Document class extends the MovieClip Class, but it can
    also extend the Sprite class. In fact, this extension is required because the
    Document class is in fact a MovieClip.


    # Library classes


    A library class is the new way to attach ActionScript to a MovieClip in the Timeline.
    In previous versions of Flash you would assign a Linkage Identifier to your MovieClip.
    In ActionScript 3, you take the same basic steps of opening the Properties inspector,
    select the Export for ActionScript option, and add the class name, as shown in
    Figure 10.3.'
