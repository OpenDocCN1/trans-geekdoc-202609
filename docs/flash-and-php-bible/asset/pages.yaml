- pgno: 416
  md: '# Chapter 15


    # Maintaining an Application


    +   IN THIS CHAPTER

    +   * Commenting code

    +   * Managing a ChangeLog

    +   * Managing multiple versions

    +   * Using custom libraries


    The process of maintaining an application is accomplished by simply following
    some rules. These rules have been established over time as applications continue
    to be developed daily.


    This chapter focuses on these individual rules. By the end of the chapter, you
    will understand not only how to follow them, but also how they can make your job
    easier.


    The last section focuses on working in a team environment, using common note taking,
    commenting, and version control from the perspective of a single developer. Even
    after an application is written, it isn''t uncommon to come back and make changes.
    If you plan this during the original writing process and follow some simple steps,
    it makes the updates a lot easier to manage and implement moving forward.


    Often, an attempted rewrite is made rather than correcting a few small issues.
    This usually is due to poor planning in the beginning and results in additional
    development time that can''t always be accounted for.


    # Commenting Code


    Code commenting is more important as a project continues to grow, or as additional
    developers are brought on to a project. The process of commenting code is not
    a required part of writing an application, but it is helpful when looking at a
    project that has been in development for some time.


    Oftentimes the commenting style is either defined in a project outline or set
    by the project lead.'
  merge: -1
  img_proc: true
- pgno: 417
  md: "Commenting can even be beneficial when you write you own code because you can\
    \ leave notes to return to a piece of code at a later date. This is especially\
    \ important if you ever intend to distribute the code as an open source project\
    \ or sell the application.\n\nCommenting code also makes it easier to write or\
    \ generate documentation with little or no additional modification needed by the\
    \ developer.\n\n# ## Understanding styles for commenting code\n\nEach language\
    \ has its own style of code commenting. For example, a very common form of commenting\
    \ is seen in HTML documents, which looks like this:\n\n```\n<!- This is an HTML\
    \ comment -->\n```\n\nHTML only offers one style of commenting, where other complete\
    \ scripting languages have various commenting styles. Here are some examples of\
    \ the more common commenting styles found in Flash, PHP, and MySQL.\n\n# ### Block\
    \ comments\n\nPHP, ActionScript (Flash), and MySQL allow block comments.\n\n```\n\
    /**\n * This is a block style comment,\n * which can have any number of lines.\n\
    \ */\n```\n\n# ### Line comments in MySQL\n\nMySQL allows line comments using\
    \ a -- at the start of a line.\n\n```\n-- This is a MySQL comment; the database\
    \ will not read this.\n```\n\n# ### Inline comments\n\nYou can also use an inline\
    \ comment to remove a certain section of code. This allows you to quickly test\
    \ a section of code and locate bugs more quickly. Here is an inline comment that\
    \ removes the WHERE clause section of an SQL query.\n\n```\nSELECT name, status\
    \ FROM users/* WHERE id=1004 AND\nstatus='active'*/;\n```\n\nThe previous comment\
    \ results in the query returning all of the users in the database because the\
    \ conditional portion has been commented out.\n\n> > **NOTE** Malformed line and\
    \ inline comments can sometimes create hard-to-trace bugs unless your code editor\
    \ uses colored syntax highlighting."
  merge: -1
  img_proc: true
- pgno: 418
  md: "# Compiler comments\n\nSome development languages and applications use compiler\
    \ comments. These specialized comments tell an application compiler how to handle\
    \ certain types of data. These comments should not be removed by hand unless you\
    \ intend to remove that functionality.\n\n# Comments in XML\n\nSome of the various\
    \ applications that have been developed in previous chapters deal with XML. It\
    \ is important to realize that XML can act in an unknown way when comments are\
    \ used improperly.\n\nThis only becomes an issue when a -- is used within a comment\
    \ such as the following:\n\n```\n<!--- Person, contains all info -- globally used\
    \ -->\n<person>\n<name>Alex</name>\n<age>27</age>\n<gender>Male</gender>\n</person>\n\
    ```\n\nAs you can see, the -- mimics the ending tag and will confuse the XML parser\
    \ to the point where it thinks the XML is malformed and in some rare cases won't\
    \ load it.\n\n# Comments in Apache\n\nUsing comments in Apache is generally limited\
    \ to the .htaccess files to determine site settings. It is important to note that\
    \ comments in Apache's files can cause rendering issues. If for some reason a\
    \ directive is not working properly, look for comments as the first culprit of\
    \ the issue.\n\nHere is an example of a comment in an Apache .htaccess file.\n\
    \n```\n# Force PHP to render .html files\nAddType application/x-httpd-php .html\
    \ .htm\n```\n\n# Mixing comments\n\nYou can mix various styles of comments as\
    \ necessary. This is common when explaining a section of code, such as a function\
    \ or method definition. As you can see, a block comment is used to describe the\
    \ function and a line comment explains the code in the function.\n\n```\n/*\n\n\
    @num1: first number\n    @num2: second number\n    @return: sum of two arguments\n\
    \n@author: developer's name\n@description: static function that multiplies two\
    \ numbers\n\n*/\n```"
  merge: -1
  img_proc: true
- pgno: 419
  md: "```\nstatic function multiplyBy(num1:Number, num2:Number):Number\n{\n  // return\
    \ the sum of num1 & num2\n  return (num1 * num2);\n}\n```\n\nProperly commenting\
    \ your code can have obvious advantages. More popular code editors offer features\
    \ that can hide or collapse comments so they only are in the way when you want\
    \ them to be.\n\nYou will even find some editors that syntax highlighted comments.\
    \ Some professional editors use your comments to create inline help files called\
    \ _code hints_ (see Figure 15.1).\n\nThese code hints are inline boxes that pop\
    \ up as you begin to type. They provide the possible items available based on\
    \ the code entered so far.\n\nA more advanced ActionScript editor, such as FDT\
    \ by PowerFlasher, has the ability to learn your code and displays your custom\
    \ comments within its version of code hints.\n\n# FIGURE 15.1\n\nExample of a\
    \ code hint displayed in Flash CS3 for the MovieClip properties\n\n![](img/d9d48cd53eee0fbc1ebc363c322fac2c_419_0.png)"
  merge: -1
  img_proc: true
- pgno: 420
  md: '# # Removing comments and debug helpers


    Comments are often removed due to file size, which can be a valid concern on a
    large program. However, most of the time, comments are automatically removed when
    an application is compiled or built.


    Depending on the application you use, debug statements should also be removed.
    For example, the native Flash IDE that ships with CS3 has a configuration option
    in the Publish Settings dialog box. If you select Omit Trace Actions, which is
    located on the Flash tab of the Publish Settings, trace calls are removed from
    the application.


    > NOTE If Omit Trace Actions is enabled during debugging you will not see any
    trace calls displayed in the Output window.


    If you decide to use a custom Class or package for debugging, then you could use
    Find and Replace to remove those instances. However, be careful to not accidentally
    remove application-specific code.


    As you can see, comments can be beneficial from the standpoint of code readability.
    You also now know that properly commenting your code has additional advantages
    when using some of the more robust code editors available today.


    # # Managing a ChangeLog


    A ChangeLog is a formatted block of records or log entries placed in a custom
    file. These files generally have the name CHANGES or UPDATES. This section is
    used to take notes on the features of an application or to communicate progress
    with the rest of a development team.


    An advantage to using a ChangeLog is that some applications can read this formatted
    log and automatically display it, as shown in Figure 15.2. This, of course, depends
    on the application you are using but can be very beneficial as an application
    begins to grow.


    # # Bug tracking


    Many developers use this dynamic ChangeLog format to track bugs. This is a process
    that many commercial and freeware applications, such as Jira and Bugzilla, use
    to create a more graphical alternative to the basic text file.


    # # Using bug tracking with teams


    Bug tracking becomes especially important when teams are involved. For instance,
    many open source technologies consist of developers around the world. Imagine
    how tedious it would be to track bugs in e-mails or phone calls across all these
    developers. This is where bug tracking becomes especially important. That doesn''t
    mean a single developer can''t benefit from the same system.'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# FIGURE 15.2


    Here is a Web page displaying a ChangeLog that was dynamically generated.


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_421_0.png)


    # Additional uses


    A ChangeLog isn''t limited to a few lines of text. Realistically, as you can see,
    it can contain bug fixes, notes to other developers, and information regarding
    a specific element. For example, if you decide to use a bug tracking application,
    it is a good idea to include the bug ID within the ChangeLog entry or let the
    application for tracking handle this.


    Properly documenting bug IDs makes it easier to follow up on a bug later during
    application development, or if you return to a project once it is completed.


    # Dynamic creation of changes


    Version control applications, which are discussed in the following section, even
    have the ability to automatically generate a ChangeLog. The advantage to this
    approach is the developer doesn''t have to spend project time editing or updating
    the log. However, a disadvantage to this is the file becomes less personalized
    and sometimes makes it harder to fully understand.'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# # Managing Multiple Versions


    Version control is the management of multiple versions of code or files for an
    application. These applications often are used in development teams, but can easily
    be used by a single developer.


    The advantage to using version control is the tracking and backup code that is
    stored as you develop or maintain an application. This added level of security
    on a project can allow the developer to experiment with an idea and still have
    the ability to revert to a stable version.


    It also allows a developer to keep code consistent across development platforms.
    This feature is a very common use for solo developers who travel and code on a
    mobile system. They simply connect to the development server, download the latest
    version, and are ready to go. When they return, a simple update is made to the
    same server and the application is back in sync.


    # ## Version control applications


    There are various version control applications available for your development
    environments today. Selecting which version control application to use is determined
    by looking at the features and requirements of your development process.


    The more common version control application is SVN (SubVersion). Another popular
    application is CVS (Concurrent Versions System). Support for version control is
    often built directly into a code editor, such as the open source Eclipse editor.


    # ## Version control support in CS3


    New to Adobe Flash CS3 is the ability to use Version Cue directly within Flash.
    Version Cue (see Figure 15.3) is Adobe''s version control application that was
    found within its other applications.


    # ### Using Version Cue in Flash CS3


    You will find a menu item “Check In...” under the File menu. This item is used
    to bring up the Version Cue management dialog and is where you are able to save
    versions of your application.


    You will find an entry of Check In... located in the File menu.


    The advantage to using Version Cue is it ships with CS3 and is integrated into
    the suite of applications. This is especially important if you are developing
    assets in one application, code in another, and managing the site in a third.


    You can even allow your team to log in to the Version Cue server remotely and
    make changes. This means, for instance, your developer can be virtually in the
    same office as the rest of your team.'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# **FIGURE 15.3**

    Screenshot of Version Cue, which ships with the Creative Suite 3 programs


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_423_0.png)


    # # Setting up version control


    The process of setting up version control depends on the system your development
    environment runs. A more complete installation guide would be included with the
    application that you decide to use. Basic installation would include unpacking
    the contents of the version control application, modifying the configuration file,
    and alerting Apache to the existence of that application.


    # ## Using version control


    Normally, the process of using version control is integrated into your code editor.
    However, there are applications available to use version control directly within
    your operating system.


    Two version control managers for Windows and Mac OS X are shown in Table 15.1.


    # **TABLE 15.1**

    Version Control Managers for Windows and Mac OS X


    | Name | URL | OS |

    | :--- | :--- | :--- |

    | TortoiseSVN | http://tortoisesvn.tigris.org/ | Windows |

    | SCPlugin | http://scplugin.tigris.org/ | Mac OS X |'
  merge: -1
  img_proc: true
- pgno: 424
  md: '**NOTE** For a more secure and final development setup, it is best to install
    your version control application on a separate machine.


    # Backing up version control


    The more popular version control systems offer integrated backup solutions, but
    oftentimes you will find that backing up the application you are writing will
    include the version control data. Normally, these files are set as hidden and
    should never be edited manually if for some reason they do become accessible.


    **CAUTION** Editing a version control file manually can result in corrupt backups
    and even harm the integrity of the code of your application.


    # Additional use of version control


    Additional use of version control is the ability to publish the file structure
    to the Web for sharing. This isn''t always the intended result, but you will find
    companies such as Adobe, Google, and Microsoft that take this approach.


    Using version control cuts down on the amount of extra work necessary to publish
    your application''s source code and allows others to keep code updated just by
    connecting to your version control system remotely.


    # Using Custom Libraries


    Custom libraries can make your code easy to maintain. In older versions of ActionScript
    (before AS3), packages didn''t really exist, so it was hard to properly maintain
    and share an application''s source code.


    ActionScript 3 introduced a more common coding practice called packages. This
    offers the ability to create one instance of your class and share it across projects
    all contained within a single folder or file.


    **CROSS-REF** A more thorough look into custom libraries can be found in Chapter
    9.


    # Using custom libraries with version control


    If you create a separate install for your version control system you can use this
    same machine to store your custom libraries and then include them remotely in
    your Flash file(s).


    The advantage to this approach is the ability to update a package and have all
    applications that use that package update as well.'
  merge: -1
  img_proc: true
- pgno: 425
  md: '# Publishing an SWC


    You can create an SWC in Flash, which allows you to distribute components and
    ActionScript classes. To publish an SWC, select the Export SWC option in the Publish
    Settings dialog box.


    The SWC file contains a compiled clip and the ActionScript class files that support
    it.


    > It is a good idea to document class and package changes because existing applications
    could stop working.


    The process of using custom libraries may not seem like a very important aspect
    of application development. However, once you begin to develop larger-scale applications
    that share common attributes you will notice how much time is saved by not having
    to rewrite code.


    # Summary


    In this chapter you learned how to comment your code and why it makes for a better
    application overall. You also learned how this becomes especially important when
    developing an application with others.


    You got an introduction on how to incorporate a ChangeLog into your development
    and how some third-party applications can use this information to display more
    detailed bug tracking.


    In the last section you learned how to use version control and were introduced
    to Version Cue, which is a new addition to Flash CS3.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# # Chapter 16

    # Maintaining a Scalable and

    # More Efficient Server


    +   - Keeping the server updated

    +   - Caching and optimizing

    +   - Handling backups


    This chapter focuses on the best practices for maintaining your server while also
    introducing more advanced application improvement techniques such as caching,
    efficient databases, backups, and scalable code.


    After you learn and apply this information to your applications, you will quickly
    notice that they run more efficiently. If you keep these steps in mind at the
    beginning of the application development process, you will not have to rework
    the application later.


    # ## Running an Updated Server


    One of the simplest but most ignored methods for maintaining a more efficient
    server is keeping your libraries and core server-side code updated. Oftentimes
    these programs that are responsible for running your applications are updated
    as the developers continue to find ways to speed them up or make them more efficient.
    This updating process is not referring to your personal code, but the libraries
    and services your code depends on.


    Updating your server not only provides performance enhancements, but also can
    ensure your Web server is more secure. PHP, for example, is updated frequently
    as more enhancements and coding changes are introduced. This is due to new security
    concerns being discovered, which results in a stronger application overall.


    Before updating your system, ensure your applications will be compatible. For
    example, applications developed in PHP 4 are not always compatible with PHP 5.
    You will find some instances where another piece of software on your server may
    require a specific version. A good example of this is mail'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'clients, such as a specific version of Horde (a popular e-mail application)
    requires PHP 4 and will simply fail on a newer version.


    This doesn''t mean you should never update; quite the opposite actually. It just
    takes a little home-work and research prior to installing new versions.


    # ## Using automatic updates


    As you know, installing new versions of applications on your server is not always
    the best option. You need to be more aware of this with automatic updaters. For
    example, you will find automatic updates are more likely to provide brand-new
    functionality but at the same time they also provide code that hasn''t been tested
    as thoroughly.


    You will find that not all of your server-side applications offer automatic updates,
    but it is best to check beforehand and ensure that those options are disabled.


    Some hosting providers perform periodic security updates, sometimes without your
    permission or even informing you of the update. This is one of the many reasons
    I prefer to run a self-managed, dedicated server as opposed to paying a little
    less and letting the hosting provider handle security and version updates.


    # ## Zend Platform


    The exception to not installing automatic updates is when you use the Zend Platform.
    This toolkit ensures your system is properly up to date with all the latest security
    enhancements, while making sure your existing script will still work properly.


    The cost of Zend Platform can cause a dilemma for smaller organizations and single
    developers, but the overall time saved in the long term is a valid reason to purchase
    it.


    # ## Working with Development Installs


    Installing new applications or libraries is not good practice when working with
    a live server. However, this doesn''t mean you can''t experiment with new code
    by installing a development system.


    You can build or purchase hosting on a new server to get a development system
    setup, but this may not be the most cost-effective solution, especially if you
    are a one-man shop.


    # ## Building another version of Apache on the same system


    The alternative is to install a separate version of Apache on your live server.
    By default, Apache can only have one version running because every version tries
    to share the same server port.'
  merge: -1
  img_proc: true
