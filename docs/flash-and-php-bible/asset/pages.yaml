    SELECT * FROM user WHERE userID=\" . $userID);\n\n    while($row = mysql_fetch_array($r))\n\
    \    {\n        print \"resp=success&username=\" . $row['username']\n        .\
    \ \"&userlevel=\" . $row['user_level']\n        . \"&userstyle=\" . $row['user_style'];\n\
    \    }\n}\nelse\n{\n    print \"resp=\" . \"User ID not found or is invalid\"\
    ;\n}\n?>\n```"
