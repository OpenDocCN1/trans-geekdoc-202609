    if (strlen($_POST[''msg'']) > 0)

    {

    $username = $_POST[''user''];

    $message = $_POST[''msg''];

    $date = time();


    mysql_query("INSERT INTO flashChat (username, message,

    dateAdded)

    VALUES (

    " . $username . "'',

    " . $message . "'',

    " . $date . ""

    ) ");


    print "resp=MESSAGE_ADDED";

    }

    ?>

    ```'
