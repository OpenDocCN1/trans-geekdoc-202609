- pgno: 52
  md: 'The entire configuration is set up at this point, and you can click Install
    to begin the process of installing PHP. When the installation is finished a Completed
    page appears.


    You can open the directory in which PHP is installed and look at the various files.
    You can also edit the php.ini file to meet your specific needs.


    ```

    C:\php5\php.ini

    ```


    The default configuration of the php.ini should work for a development setup with
    the exception that you should enable display_errors. Enabling the display of errors
    tells PHP to print any errors to the screen. In a production setup this could
    be considered a security concern. A development server is generally only seen
    by authorized viewers, which means enabling this option is not a problem.


    Open the php.ini file and search for the section referring to error_reporting.


    ```

    display_errors = Off

    ```


    Change the value to On.


    ```

    display_errors = On

    ```


    > **NOTE** Changes to the **php.ini** file are not visible until you restart the
    server.


    Make sure you restart the Apache web server before continuing because you made
    some modifications to the Apache configuration.


    # Testing


    After you install PHP you can create a sample PHP file to test it out. A common
    sample file is the phpinfo file, which allows you to see the configuration variables
    for the PHP installation on the server.


    You can use Notepad or any other text editor to create this sample file. If you
    install the full Web Suite from Adobe, you can use Dreamweaver to write PHP files
    (see Figure 1.24).


    Here is the syntax for the phpinfo file.


    ```

    <?php

    phpinfo();

    ?>

    ```


    Save this file as info.php in the Document Root of the Apache installation. For
    example, if you install Apache to the default location, the PHP file is saved
    to:


    ```

    C:\Program Files\Apache Group\Apache2\htdocs\info.php

    ```'
