- pgno: 455
  md: '```

    CREATE TABLE `videos` (

    `id` int(11) NOT NULL auto_increment,

    `catId` int(11) default NULL,

    `name` varchar(200) default NULL,

    `src` varchar(200) default NULL,

    `description` text,

    `count` int(11) default 0,

    `active` varchar(1) default ''1'',

    PRIMARY KEY (`id`)

    ) ENGINE=MyISAM;

    ```


    As you can see, this table is nothing special, but it handles the core of the
    application management. You can add more columns if you decide you want to expand
    on the original application.


    A database is not the only storage option. You can use an XML file or even hardcode
    the video paths in Flash, but the idea is to develop an expandable application.
    This means that the database is the most logical option to store the video and
    category data. The database also offers the ability to expand and grow as you
    add more features to your application.


    The second table you need to add is the categories table, which stores an id used
    in the PHP in the next section and the name of the category that is displayed
    in the Flash application.


    ```

    CREATE TABLE `categories` (

    `id` int(11) NOT NULL auto_increment,

    `name` varchar(100) default NULL,

    `active` varchar(1) default ''1'',

    PRIMARY KEY (`id`)

    ) ENGINE=MyISAM;

    ```


    # Adding sample data to the tables


    You can now prefill the tables to test it all, as shown in Figure 17.3. You can
    use your favorite database editor and add the sample data by hand, or use the
    following sample INSERT statements that add a few categories and videos:


    ```

