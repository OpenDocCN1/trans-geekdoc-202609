  md: '# FIGURE 8.6

    Chat application running in the browser


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_209_0.png)


    # Summary


    In this chapter, you have learned what a socket server is and how they are built.
    You then learned how to build a simple socket server and connect to it using Flash.
    Once you had an understanding of the Flash and PHP portions of the process, the
    final step was to build a complete multiuser chat application with a socket server
    in PHP running behind the scenes.


    You can take the information learned in this chapter and expand it to create a
    fully functional chat application. You can add features such as moderation, members,
    timers, chat rooms, and so on. It is important to realize that socket server systems
    are not limited to chat applications. You can use this same technology to build
    a multiuser drawing application or even build a multipoint server monitoring architecture.


    As you can see, sockets can be used in a variety of ways. Once you learn the basics,
    your imagination is the only limit to your development.'
