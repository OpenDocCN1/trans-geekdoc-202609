- pgno: 195
  md: "```\n{\n    socket_write($client, $buffer . $this->LINE_ENDING);\n}\n}\n}\n\
    ```\n\n# Notifying all clients\n\nThe global notification is similar to the single-user\
    \ method, with the exception that it checks to see if the message being sent is\
    \ to be marked as an admin message. The admin flag can be set when a call to notifyClients\
    \ is made. The default value is false, ensuring that client messages can't be\
    \ marked as coming from the admin.\n\n```\nprivate function notifyClients($clients,\
    \ $sock, $buffer, $admin)\n{\n    foreach($clients as $client)\n    {\n      \
    \  if($admin == true)\n        {\n            socket_write($client, \"ADMIN NOTICE:\
    \ \" . $buffer);\n        }\n        else\n        {\n            socket_write($client,\
    \ $sock . \" wrote: \" . $buffer);\n        }\n    }\n}\n```\n\n# Handling errors\n\
    \nAs the application continues to run, it is bound to have an error or two. Rather\
    \ than throw these errors away, it is a good idea to capture them and at least\
    \ display them to the server. An example of a basic error handler can be seen\
    \ here:\n\n```\nprivate function handleError($str, $err)\n{\n    if(ChatServer::SHOW_ERRORS)\n\
    \    {\n        $this->serverMessage(($str . \": reason: \"\n            . $err)\
    \ . $this->LINE_ENDING);\n    }\n}\n```\n\nThe handleError method first checks\
    \ that errors should be displayed by checking the static SHOW_ERRORS property,\
    \ defined at the top of the class file. The passed-in error message is relayed\
    \ to the serverMessage method, which prints it."
