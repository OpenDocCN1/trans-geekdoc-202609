- pgno: 6
  md: '# # About the Author


    **Matthew Keefe** is a new-media designer and developer, with a strong background
    in application development for the Web and offline. Originally a full-time graphic
    artist, he found that much of the programming associated with his design work
    was being outsourced. Matt quickly learned programming for the web and uncovered
    a valuable but little-known skill set in this industry, that skill being the ability
    to build a site and also the ability to powerfully design it. This was preferred
    by clients because they could do the entire project with one studio.


    Matt has worked with companies such as Delphi, PhotoShopCafe, Kineticz Interactive,
    and Organi Studios to name a few. His work has been published in *How To Wow with
    Flash* (Peachpit Press) for which he was a contributing author and technical editor.
    Matt has also recently finished up work as the technical editor for *Essential
    ActionScript 3* (Adobe Dev Library).


    Examples of his work can be found in his personal portfolio at mkeefe.com.'
  merge: -1
  img_proc: true
