  md: "```\nvar loader:URLLoader = new URLLoader();\nassignHandlers(loader);\nloader.load(urlRequest);\n\
    \nfunction assignHandlers(target:*):void\n{\n  target[\"addEventListener\"](Event.COMPLETE,\
    \ completeHandler);\n  target[\"addEventListener\"](IOErrorEvent.IO_ERROR,\n \
    \ ioErrorHandler);\n}\n\nfunction completeHandler(e:Event):void\n{\n  ...\n}\n\
    \nfunction ioErrorHandler(e:Event):void\n{\n  ...\n}\n```\n\nA new concept introduced\
    \ in this function is the dynamic way of assigning event listeners. The [ ] are\
    \ used to define a string within them as a variable. In this case, the string\
    \ \"addEventListener\" is actually the method to invoke and the values with the\
    \ () are the arguments to pass to the method. Using this example for just one\
    \ event listener is kind of overkill, but if you are working with multiple events\
    \ it quickly becomes beneficial.\n\n# # Handling Loaded Data\n\nAfter using the\
    \ previous steps to load the data, you will want to use this data in some way.\
    \ However, before you dive into working with loaded data you need an understanding\
    \ of what is passed back and how to work with it. In the next sections you will\
    \ learn how to handle the data that has been loaded. Once you have completed this\
    \ section you will fully understand how to load data and how to work with that\
    \ loaded data.\n\n# # One-way loading\n\nLoading a text file or image is considered\
    \ one-way loading, mostly because you don't pass along any rules or steps to the\
    \ loaded file. A call to load an image would expect an image to be returned and\
    \ nothing more. This type of loading process is most commonly understood if you\
    \ look at a Web site. The logo on that site is requested and is loaded; no extra\
    \ data is managed to accomplish this.\n\n# # Two-way loading\n\nTwo-way loading\
    \ is the process of loading data by passing along arguments that the requested\
    \ process will handle. For instance, a call to an ad server would pass along the\
    \ account id and most likely some other information to determine which ad should\
    \ be displayed."
