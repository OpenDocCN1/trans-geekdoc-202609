- pgno: 196
  md: "You could call the serverMessage method directly, but using this relay system\
    \ allows you to\ntrap errors and keep your code clean. It wouldn’t make sense\
    \ to have the SHOW_ERRORS condition\nin the serverMessage because a message isn’t\
    \ always an error.\n\n# Ending a connection\n\nThe connection ends if the client\
    \ closes the browser or application. However, the user can also\nclose the connection\
    \ by sending the special \"exit\" parameter. A socket termination method is\n\
    used to ensure the array of active connections is properly handled. This method\
    \ will also remove\nthe master if no active clients exist, ultimately ending the\
    \ socket server connection itself.\n\nThe array_search function is used to find\
    \ the socket id to close. This function returns the id\nfrom the array. This is\
    \ used to remove the connection from the list and terminate the specific\nsocket\
    \ connection.\n\n```\nprivate function endSocket($sockID=null)\n{\n    // close\
    \ master if no socket is defined\n    if($sockID == null)\n    {\n        $sockID\
    \ = $this->masterClient;\n    }\n\n    $index = array_search($sockID, $this->clients);\n\
    \    unset($this->clients[$index]);\n    socket_close($sockID);\n}\n```\n\n# Server\
    \ monitoring\n\nThe last method of the chat class is used to print messages about\
    \ the socket server directly to the\nactive prompt, generally running on the Web\
    \ server to which the clients are connecting.\n\n```\nprivate function serverMessage($str)\n\
    {\n    print $str . $this->LINE_ENDING;\n}\n```\n\n# Connecting to the socket\
    \ server\n\nThe connection to the chat class built in the previous section is\
    \ handled by the second PHP file.\nThis file will be the one you would call when\
    \ you want to start the chat server. Building the system\nin this manner allows\
    \ you to leave the chat class on its own and duplicate the connection without\n\
    modifying the code."
  merge: -1
  img_proc: true
- pgno: 197
  md: '# # Building the connection file


    Here is an example connection on the localhost domain, also commonly referred
    to as the loopback address of your machine or server.


    ```

    ```

    #!/usr/bin/php -q

    <?php

    include ''ChatServer.php'';

    ```

    ```


    The first line is used to define the command to the terminal. It is not required,
    but does mean you can exclude the switches, in this case the -q which is used
    to suppress HTTP header output, when you call the php file. The next line includes
    the ChatServer class, allowing it to be called from that point.


    Once the file is properly included you can make a new chat instance, passing in
    the host and port that you would like to begin listening on. In this example,
    the local host is used and is bound to port 8888. The port number does not need
    to be the same; it only needs to be open. It is a good idea to choose a port number
    that won''t be used by other applications on your system.


    ```

    $chatServer = new ChatServer("127.0.0.1", 8888);

    ```


    The last step is to start the server and allow others to connect to it. To stop
    the server you can close the terminal or press Ctrl+C, which in most terminals
    will end the active process.


    ```

    $chatServer->startServer();

    ```


    Here is the complete code for this simple test:


    ```

    ```

    #!/usr/bin/php -q

    <?php


    include ''ChatServer.php'';


    $chatServer = new ChatServer("127.0.0.1", 8888);

    $chatServer->startServer();


    ?>

    ```

    ```


    # # Testing the connection


    For simple testing, you can attach to the chat server using the telnet method,
    as shown in Figure 8.3, which was explained at the beginning of the chapter. This
    method poses a graphical and usability limitation, so the next section is the
    process of developing the Flash application that will connect to this PHP socket
    server.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# FIGURE 8.3

    Example of the chat server running in the command prompt


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_198_0.png)


    # Building the Flash client


    The Flash chat client is used to interact with the socket server. This client
    application can be used locally or on a Web site, depending on how the socket
    server is configured. For this example, the code assumes the socket server is
    running locally.


    The design portion of the Flash client has been completed for you, as shown in
    Figure 8.4. This starting file can be found on the Web site for this book, along
    with the code for all the other sections.


    The first part of the Flash code initializes the host and port information, which
    is passed into a new instance of the Socket class.


    ```

    var host:String = "127.0.0.1";

    var port:uint = 8888;


    var socket:Socket = new Socket(host, port);

    ```'
