- pgno: 451
  md: 'Adobe has developed a fully functional single video player that allows developers
    to easily incorporate it in an existing project.


    In fact, building a basic video player in Flash, as shown in Figure 17.1. requires
    very few lines of code.


    Start by dragging a FLVPlayback component from the Components pane to the Stage.
    Give this new player an instance name of myPlayer and open the Actions pane.


    For simplicity, use one of the sample video files that Adobe provides for testing:


    ```

    www.helpexamples.com/flash/video/water.flv

    ```


    # FIGURE 17.1


    FLVPlayback video component displayed on the Stage


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_451_0.png)


    The next step is to set the source property of the video player by pointing it
    to the sample FLV file:


    ```

    myPlayer.source = "http://helpexamples.com/flash/video/

    water.flv";

    ```


    Test the movie and you should see the sample video load, then automatically start
    playing. Congratulations, you have played an FLV in Flash, using the prebuilt
    video player component.


    The video player has a fairly large collection of methods and properties, but
    some of the more common are related to playback control. For example, remember
    how the video played once it was loaded? This may not be the desired result all
    the time, so the video player allows you to modify this behavior by setting the
    autoPlay property to false.'
