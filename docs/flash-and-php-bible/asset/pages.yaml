  md: 'For simplicity, the video player component has the ability to be skinned, which
    means you don''t have to design a custom interface. This custom skin loads in
    a default set of playback controls.


    In fact, Adobe offers a large list of skins, each in different colors or with
    various selections of buttons and functionality. For example, here is the most
    common example used. This skin is a full set of controls that is placed underneath
    the video player component. Seeing as this skin has basic playback controls, you
    can replace the existing mouse handler and use the internal version:


    ```

    myPlayer.source = "http://helpexamples.com/flash/video/

    water.flv";

    myPlayer.autoPlay = false;

    myPlayer.skin = "SkinUnderPlayStopSeekMuteVol.swf";

    ```


    NOTE The video player skin must be in the same directory as your SWF. You can
    also set the skin using the Component Inspector.


    The skin can be found in the same directory as your Flash movie once you select
    at least one skin from the Property inspector.


    As you can see, the functionality of the video player component allows you to
    build a basic player fairly quickly. The problem with this component is encountered
    when you want to play more than one video or even add categories of videos.


    Fortunately, Adobe developed a wonderful component and even made it easy to use
    on you own custom development projects, which you learn to do later in this chapter.
    You will create and add the additional functionality you want.


