- pgno: 97
  md: 'Closing the connection isn''t always required because it will automatically
    close when the script stops executing. That being said, in a larger application
    it is best to free up resources as soon as possible to maintain a responsible
    usage.


    Here is the previous mysql_connect() example with the close addition.


    ```

    ```php

    <?php


    $link = mysql_connect("localhost", "root", "");

    print "Response: " . $link;


    // close connection

    mysql_close($link);


    ?>

    ```

    ```


    The mysql_close function can accept a resource id reference, which comes in handy
    when you have multiple connections. This argument is not required; by default
    the last connection will be closed.


    A persistent connection created by mysql_pconnect() cannot be closed using mysql_close().


    # Selecting the database


    After you establish the MySQL connection you can select a database. You will not
    be able to query the database until a proper connection and database are chosen.
    The mysql_select_db function allows you to select the database to query. You can
    also use this function to switch databases.


    An active connection can only have one database connected at a time.


    The mysql_select_db function accepts two parameters. The first parameter is the
    database name. The second (optional) parameter is a link to the active connection
    resource. This is important to use when you have a few different connections or
    you want to properly track the active connection.


    Here is an example using the previous code for connecting and selecting a database:


    ```

    ```php

    <?php


    $link = mysql_connect("localhost", "root", "");


    mysql_select_db("db_name", $link);


    // close connection

    mysql_close($link);


    ?>

    ```

    ```'
