- pgno: 240
  md: '# # Chapter 10


    # # Using Object-Oriented Programming


    This chapter focuses on classes and object-oriented programming. Understanding
    how classes work and where they should be used will help you write more efficient
    code. The key to successfully writing in an object-oriented programming format
    (OOP) is to properly evaluate the application you will be writing.


    This chapter starts by explaining the individual aspects of OOP in both Flash
    and PHP. The last section of this chapter is the construction of an example class
    to strengthen your understanding of the practices learned in the previous sections.


    It is important to note that this is not an in-depth guide to OOP, which actually
    would require its own book, but is more an overview to support the usages in this
    book.


    +   IN THIS CHAPTER

    +   - Understanding classes in PHP

    +   - Understanding classes in Flash

    +   - Using methods

    +   - Using properties

    +   - Writing a custom class


    # ## Understanding OOP


    The key to understanding object-oriented programming (OOP) is to think of each
    element as a separate piece. In traditional programming, the code flows from line
    1 until it reaches the end of the document, with the occasional function to accomplish
    repetitive tasks. The problem with this approach is scalability, or the ability
    to let a program grow as it evolves in the future.


    I am sure you''re wondering why you should care if an application is scalable
    or not. It actually is a very important concern that is often overlooked in applications.
    Making a program scalable from the beginning means less code reworking and editing
    in the future. In a way, OOP and scalable code actually go together quite nicely
    when used properly.'
  merge: -1
  img_proc: true
- pgno: 241
  md: "# Overview of OOP practices\n\nNow that you have an understanding of what OOP\
    \ is and how it can benefit your code, you can look at what is involved in writing\
    \ it. The first O in OOP is for “object” or a collection of information contained\
    \ in one easy-to-manage piece.\n\nAs you begin to work with OOP practices you\
    \ will quickly understand how easy it is implement and will be using OOP all of\
    \ the time.\n\n# Classes\n\nA class is a definition of all objects of a specified\
    \ type. The class defines the objects structure and behavior. This approach not\
    \ only allows the code to be distributed, but also allows you to maintain a certain\
    \ level of security.\n\nTo better understand classes, here is a very basic example:\n\
    \n```\npublic class Hello\n{\n    function Hello()\n    {\n    }\n\n    public\
    \ function getSaying() :String\n    {\n        return \"Hello World!\";\n    }\n\
    }\n```\n\nThe previous code is a simple example of a class and is merely meant\
    \ to visually demonstrate how a class is constructed. The public before the class\
    \ defines the entire class as globally accessible. In certain instances, this\
    \ is not the desired result. You can also assign each method and property as public,\
    \ private, or other types depending on the requirements.\n\nHere is a common example\
    \ of applying protections to a class to ensure security:\n\n```\npublic class\
    \ UserLogin\n{\n    function UserLogin()\n    {\n    }\n\n    public function\
    \ login():void\n    {\n        callDatabase();\n    }\n\n    private function\
    \ callDatabase():void\n    {\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: 'It is safe to assume that you would not want the callDatabase method to be
    called directly because a malicious call could actually harm your database and
    weaken the overall integrity of the application. Forcing the method as private
    ensures the method cannot be called. The user must call the login method where
    you can validate the request before the database is called. This is, of course,
    a very simple usage of public and private types, but it should help you understand
    why they are important.


    # Constructor


    The first method in a class is generally the constructor. The constructor is automatically
    called by the system and cannot return data. It is usually where initialization
    tasks would take place, such as drawing an object on the stage or calling a database.


    # Packages


    Packages are containers for multiple classes that offer the ability to share the
    information within the global container. This is similar to the employees in an
    office who share information within their own department, but at the same time
    can pass information along to upper management without it ever leaving the organization.
    In a way, a package is an organization of classes.


    There are two ways to define a package. The first is the current directory, which
    just becomes:


    ```

    package {

    class Example

    {

    function Example()

    {

    }

    }

    }

    ```


    The other option is to define a package structure, usually defined by the developer
    or company’s domain name in reverse order, such as:


    com.companywebsite.projectname


    The structure is placed after the package keyword.


    ```

    package com.companywebsite.projectname {

    class Example

    {

    function Example()

    {

    }

    }

    }

    ```


    A reverse domain package path is used to make sure the package is unique. It is
    also used to properly define the application or library. Another advantage to
    using this approach is it stops class'
  merge: -1
  img_proc: true
- pgno: 243
  md: "collisions, which is when two different classes have the same name. This happens\
    \ more often when third-party libraries are used in an application because you\
    \ have no control over the names used in those classes. If the library is properly\
    \ built, it will have a unique package structure to avoid collisions.\n\n# Importing\n\
    \nImporting when working with classes is referring to loading in, or connecting\
    \ classes together. For example, in Flash the stage is an instance of the `DisplayObject`\
    \ class. However, when you create a `movieClip`, which is an instance of the `MovieClip`\
    \ class, it is also loading in an instance of the `DisplayObject`, along with\
    \ a lot of other classes and packages.\n\nYou can place imports within the class\
    \ so they are only visible to that class, or you can load them into the package\
    \ allowing them to be shared across the entire package. For example, if you had\
    \ a `Member` class it is safe to assume that you would always want that member\
    \ credentials visible to validate them in various portions of the application.\
    \ You would start off by defining the `Member` class and then import the `UserCredentials`\
    \ class for validation, such as:\n\n```\nimport UserCredentials;\n\npublic class\
    \ Member\n{\n\tfunction Member()\n\t{\n\t}\n}\n```\n\nThis would allow the `UserCredentials`\
    \ to be viewed by any method or property in the `Member` class. However, there\
    \ are some cases where you would want all classes to share another class.\n\n\
    ```\npackage\n{\n\timport UserCredentials;\n\tpublic class Member\n\t{\n\t\tfunction\
    \ Member()\n\t\t{\n\t\t}\n\t}\n}\n```\n\nIn ActionScript 3 you don't have to worry\
    \ about importing a class more than once because the AS compiler is intelligent\
    \ enough to only import it one time. PHP, on the other hand, throws an error if\
    \ you attempt to load a class more than once. This actually isn't a bad thing\
    \ and can easily be avoided by loading all classes in one file. Just think of\
    \ this master class as the parent of all others. The next section will focus on\
    \ the differences and similarities of class in PHP and Flash."
  merge: -1
  img_proc: true
- pgno: 244
  md: "# Static methods and properties\n\nA static method is one that doesn't require\
    \ a class instance to be called. It also allows the code to have a certain level\
    \ of consistency. For example, there is a `Date` class, and in that a method that\
    \ returns the days of the week. It is safe to assume the days of the week aren't\
    \ going to change, so you can access that method by simply calling it directly.\n\
    \n```\nDate.getDaysOfWeek();\n```\n\nA static method is called in the following\
    \ way: `Class.method`. There is no need for an instance name or constructor; in\
    \ fact, a constructor isn't even needed in this type of class. However, it is\
    \ good practice to have a constructor for complete compatibility.\n\nA static\
    \ property is similar to a static method in that it can be accessed without an\
    \ instance. However, it does have one special attribute: its type and data can't\
    \ be changed, with the obvious exception of an Array or Object, which can have\
    \ no elements added to it.\n\n```\ntrace(\"Days in Week: \" + Date.daysInWeek);\n\
    ```\n\nThe preceding code would access the static property `daysInWeek`, which\
    \ would return a numeric value representing the total days in a week. A static\
    \ property is useful when you have a value that never changes, such as a URL or\
    \ company information to be used in an application.\n\n# Singletons\n\nA singleton\
    \ is a design pattern. The subject of design patterns requires its own book, but\
    \ basically they are rules and practices formed between various developers. You\
    \ are not required to follow any design pattern, but doing so offers cleaner and\
    \ more scalable code. The singleton is likely the most common design pattern.\
    \ It is commonly used to pass around a piece of information that never changes\
    \ and will be needed quite a bit during an application.\n\n> In most programming\
    \ languages it is common to declare the constructor of a singleton `private`.\
    \ This keeps developers from accidentally creating more than one instance of a\
    \ singleton. However, ActionScript does not support private constructors.\n\n\
    As you learned previously, an instance of a class is made by using the `new` keyword.\
    \ That is one way you can access a class; another is to reuse the existing instance,\
    \ such as:\n\n```\npublic class User\n{\n   private static instance:User;\n  \
    \ function User(){}\n   public static function getInstance():User\n   {\n    \
    \  if(instance == null)\n      {\n         instance = new User();\n      }\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 245
  md: "```\nreturn instance;\n}\n\npublic function exampleName():String\n{\n    return\
    \ \"Joey\";\n}\n}\n```\n\nThe majority of this class is the same as previous examples,\
    \ with the exception of the addition of the getInstance method. This method is\
    \ used to ensure that a unique instance of the class is always used. Any call\
    \ to this class is done through the getInstance method, such as:\n\n```\nimport\
    \ User;\n\ntrace(\"Example Call: \" + User.getInstance().exampleName);\n```\n\n\
    The first time the class is referenced the unique instance is generated. Any call\
    \ from that point simply returns the existing instance. This ensures any changes\
    \ to this class will be seen by all callers. The magic behind this class is the\
    \ static method and properties, which are used to essentially put a gate between\
    \ the methods and the caller. All calls going through getInstance also allow you\
    \ to place an authorization check on all calls.\n\n> **NOTE** A singleton should\
    \ only be used when needed. Turning every class you create into a singleton is\
    \ not a good practice; in fact, most programs have one singleton that stores all\
    \ of the necessary information.\n\n# # Getters and setters\n\nYou may have noticed\
    \ that a lot of class usage is focused on passing data back and forth. In fact,\
    \ that is pretty much what all programming is, in a way. The idea behind a getter\
    \ and setter is to gain access to private properties. In fact, it is a pretty\
    \ safe bet that most of your properties will be private, because that is sort\
    \ of the idea of a class. Here is an example of a getter and setter, using a class\
    \ skeleton as an example:\n\n```\nclass People\n{\n    private var _person:String;\n\
    \    public function get person():String\n    {\n        return _person;\n   \
    \ }\n    public function set person(u:String):void\n    {\n        if(u.length\
    \ > 0 && u.length < 25)\n        {\n            _person = u;\n        }\n    }\n\
    }\n```"
