- pgno: 459
  md: "The fifth variable is used to store the database link resource id.\n\n```\n\
    ```php\nprivate $link = null;\n```\n```\n\nThe constructor for this class is empty\
    \ because the private variables are defined previously.\n\n```\n```php\nfunction\
    \ DatabaseConnector() { }\n```\n```\n\nThe private connect method is only called\
    \ when an existing connection is not found. This method passes in the private\
    \ connection details and stores the resource id in the $this->link property, which\
    \ is only visible to this class.\n\n```\n```php\nprivate function connect()\n\
    {\n    $this->link = mysql_connect($this->host, $this->user, $this-\n    >pass);\n\
    \    mysql_select_db($this->dbName, $this->link);\n}\n```\n```\n\nThe second method,\
    \ getConnection, is set as public so other classes have access to it. However,\
    \ the comments define it as private to ensure remoting classes cannot access it.\
    \ This method first checks for an existing connection resource and if one isn't\
    \ found, a call to the connect method is made.\n\nThe last step of this function\
    \ is to return the active connection resource, which is used in other classes.\n\
    \n```\n```php\n/**\n * Get database connection\n * @access private\n * @returns\
    \ database link, to be used in other sql calls\n */\npublic function getConnection()\n\
    {\n    if($this->link == null)\n    {\n        $this->connect();\n    }\n\n  \
    \  return $this->link;\n}\n```\n```\n\nAs you can see, this class is very handy\
    \ because it takes care of storing the database connection. Additionally, if one\
    \ isn't found, it creates one.\n\nHere is the completed class, which should be\
    \ saved as DatabaseConnector.php in your project directory so it can be accessed\
    \ by the other classes."
