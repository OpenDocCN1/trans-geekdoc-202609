- pgno: 224
  md: "```\n<?php\nclass Example\n{\n    function Example()\n    {\n        $this->methodTable\
    \ = array\n        (\n            \"getDate\" => array\n            (\n      \
    \          \"access\" => \"remote\",\n                \"description\" => \"Returns\
    \ the current date.\"\n            ),\n\n            \"upperCaseWords\" => array\n\
    \            (\n                \"access\" => \"remote\",\n                \"\
    description\" => \"Converts arg to uppercase\"\n            )\n        );\n  \
    \  }\n/**\n * Returns Current Date\n */\nfunction getDate()\n{\n    // return\
    \ current date\n    return \"Current Date: \" . date(\"F j, Y\", time()));\n}\n\
    \nfunction upperCaseWords($str)\n{\n    return uwords($str);\n}\n}\n?>\n```\n\n\
    After the new method is added it is visible in the service browser (after a refresh).\
    \ After looking at the service browser, you will notice an advantage of the method\
    \ table is that AMFPHP automatically adds textboxes with the name of the variable\
    \ for each argument found.\n\nThe new method accepts one argument as defined in\
    \ the service code. If you type some text in the TextBox and execute the method,\
    \ your string is capitalized."
  merge: -1
  img_proc: true
- pgno: 225
  md: "For example, if you use the string \"hello world\", you see the following output:\n\
    \n```\n\"Hello World\"\n```\n\nAMFPHP services can, of course, have more than\
    \ one argument in a method. Create another new method that has three arguments.\
    \ The first argument is a string, the second a word to search for, and the third\
    \ is the replacement word. Basically, you are creating a PHP-based search-and-replace\
    \ method.\n\nStart off by updating the method table.\n\n```\n$this->methodTable\
    \ = array\n(\n    \"getDate\" => array\n    (\n        \"access\" => \"remote\"\
    ,\n        \"description\" => \"Returns the current date.\"\n    ),\n    \"upperCaseWords\"\
    \ => array\n    (\n        \"access\" => \"remote\",\n        \"description\"\
    \ => \"Converts arg to uppercase\"\n    ),\n    \"searchAndReplace\" => array\n\
    \    (\n        \"access\" => \"remote\",\n        \"description\" => \"Searches\
    \ and replaces text\"\n    )\n);\n```\n\nWhen the method table is updated, the\
    \ new method is added. You are not limited to the code within the method. AMFPHP\
    \ allows you to call other methods and properties within the same class or even\
    \ include other PHP files for added functionality.\n\n```\n/**\n * Searches and\
    \ replaces text\n */\nfunction searchAndReplace($haystack, $needle, $replacement)\n\
    {\n    $string = str_replace($needle, $replacement, $haystack);\n    return $this->upperCaseWords($string);\n\
    }\n```\n\n**NOTE** If you create a new method and do not add it the method table,\
    \ it will not be exported for remoting. This is useful when you want to have private\
    \ methods, such as database connectivity, or overall security layers.\n\nAfter\
    \ the new method is added, you can test it by refreshing the service browser.\
    \ Notice the methods are listed in alphabetical order. The new method should be\
    \ found in the middle of the horizontal list."
  merge: -1
  img_proc: true
