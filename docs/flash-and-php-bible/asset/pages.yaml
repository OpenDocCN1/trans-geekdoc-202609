- pgno: 157
  md: '# Properly cleaning HTML data


    The final function to look at is htmlentities(). Basically, this function takes
    HTML characters and converts them to numeric values. These are better because
    things like " " become &quot; and this pretty much eliminates the need for advanced
    sanitizing of data.


    ```

    <?php


    $str = "The ''red'' fox <b>jumped</b>";


    // The &#039;red&#039; fox &lt;b&gt;jumped&lt;/b&gt;

    echo htmlentities($str, ENT_QUOTES);


    ?>

    ```


    The second argument in the htmlentities() function determines if both single and
    double quotes should be converted, The possible values for this second argument
    are shown in Table 7.1.


    | Constant Name | Description |

    |---|---|

    | ENT_COMPAT | Converts double quotes; leaves single quotes alone |

    | ENT_QUOTES | Converts both double and single quotes |

    | ENT_NOQUOTES | Leaves both double and single quotes unconverted |


    It is a good idea to run all three of these functions to ensure your data is as
    clean as possible. It only takes a little bit more processing power, but can make
    the difference between a secure and an insecure application.


    More importantly, as you continue to practice these good security concepts you
    will spend less time patching and debugging in the future.


    # Storing Data


    The database is not the only storage method, as explained in the beginning of
    this section. You can also use simple text files to store information, and the
    majority of the sanitizing steps would work here as well. The one exception is
    mysql_real_escape_string, which, as stated earlier, requires an SQL link.'
  merge: -1
  img_proc: true
- pgno: 158
  md: "# # Securely writing to a file\n\nA simple example of securely writing to a\
    \ file would go something like this. First, validate the data before opening the\
    \ file. Doing this ensures the file can’t accidentally be written to.\n\n```\n\
    ```php\n<?php\nif($fileContents != \"\")\n{\n    $handle = fopen(\"sample.txt\"\
    \ , \"w+\");\n    fwrite($handle, $fileContents);\n}\nelse\n{\n    print \"File\
    \ content not written, invalid data\";\n}\n?>\n```\n```\n\n# ## Working with data\
    \ in a logical order\n\nIt is important to keep a logical order when working with\
    \ data. For example, if the addslashes() was run before the if statement, the\
    \ length of the content could be thrown off and produce a false result. At the\
    \ same time, if the file is opened prior to the data being validated, a malicious\
    \ exploit could potentially inject content into the opened file. Think of it as\
    \ the same precautions you take when logging on to a secure Web site in a public\
    \ location.\n\n# ## Creating a class to handle sanitization\n\nAt this point you\
    \ should fully understand how to sanitize data that can be saved in a database\
    \ or a simple text file. You can expand on these best practices to create a more\
    \ resusable set of tools. For example, you could create a sanitization class that\
    \ automatically takes care of the process. A basic class would be something similar\
    \ to the following:\n\n```\n```php\n<?php\nclass Sanitization\n{\n    function\
    \ cleanSQL($str)\n    {\n        return mysql_real_escape_string($str);\n    }\n\
    \n    function cleanHTML($str)\n    {\n        return htmlentities($str, ENT_QUOTES);\n\
    \    }\n}\n```\n```"
  merge: -1
  img_proc: true
