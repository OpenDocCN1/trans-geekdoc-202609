  md: "The Flash file has a note automatically added that is displayed to inform the\
    \ user that no items exist in the cart. However, this is removed when an item\
    \ is added. The problem is, if the user removes all of the items from the cart\
    \ it needs to be displayed again, so a simple if statement is added to the end\
    \ of the remove method to handle this.\n\n```\nif(cartItemCount == 0)\n{\n   \
    \ noItemsTxt.visible = true;\n}\n```\n\nFinally, a call to the updateTotal and\
    \ updateList methods is made to ensure the data stays consistent and the price\
    \ is updated.\n\n```\nupdateList();\nupdateTotal();\n```\n\nThe cart items are\
    \ added to the array as the user clicks the Add to Cart button; however, you may\
    \ remember in the previous section that the cart item can be found in the array\
    \ using the cart id. The problem is if an item is removed the list is now mixed\
    \ and an incorrect item can be added or removed. The solution is to provide new\
    \ ids as an item is removed. This is accomplished by looping through all the remaining\
    \ cart items and making a call to set a new id.\n\n```\npublic function updateList():void\n\
    {\n    for(var i:uint=0; i < cartItemCount; i++)\n    {\n        cartContents[i].cartItem.setID(i);\n\
    \    }\n}\n```\n\nThe other side effect to removing an item freely is it can create\
    \ a gap in the list. This doesn't change how the application functions, but visually\
    \ it isn't the cleanest. The way around this little issue is to realign the list\
    \ as an item is removed.\n\n```\npublic function updateList():void\n{\n    for(var\
    \ i:uint=0; i < cartItemCount; i++)\n    {\n        cartContents[i].cartItem.setID(i);\n\
    \        cartContents[i].cartItem.y = (i * cartItemHeight) +\n            lineSpacing;\n\
    \    }\n}\n```\n\nIn the previous methods there has been a call to updateTotal.\
    \ This method is responsible for keeping the price total updated as items are\
    \ added and edited. The process is to loop through the cart items, multiply the\
    \ price by the quantity, and display the final result. The result is then tested\
    \ for valid numbers and a decimal (.) is provided if needed."
