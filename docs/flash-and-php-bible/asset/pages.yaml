  md: '# Basic socket class


    Here is a basic socket class that easily defines the customizable elements. Simply
    save this code in an ActionScript file with the name SimpleSocket in the same
    directory as your sample Flash document.


    ```

    package

    {


    import flash.errors.*;

    import flash.events.*;

    import flash.net.Socket;


    public class SimpleSocket extends Socket

    {


    public var host:String;

    public var port:uint;

    private var socket:Socket;


    public static var SOCK_CONNECTED:String = "onSockConnect";

    public static var SOCK_IOERROR:String = "onSockIOError";


    function SimpleSocket(h:String, p:uint)

    {

    host = h;

    port = p;

    socket = this;

    super(host, port);

    initListeners();

    }


    public function sendMessage(str:String):void

    {

    if(connected)

    {

    socket.writeUTFBytes(str + "\\n");

    }

    else

    {

    trace("Not connected, message not sent!");

    }

    }


    public function readMessage():void

    {

    if(connected)

    {

    var str:String =

    socket.readUTFBytes(socket.bytesAvailable);

    trace("Socket Server Response: " + str);

    }

    }

    ```'
