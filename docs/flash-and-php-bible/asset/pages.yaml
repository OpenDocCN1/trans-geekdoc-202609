    The constructor is responsible for calling the makeCall() method. This method
    creates a new TextField, attaches it to the Stage using addChild, and finally
    sets up the call to the custom communicator class.


    As the call to the communicator class is being set up, it is also responsible
    for assigning the TextField instance and the action. The action in this example
    is used to tell PHP which code to run. Of course, in this example there is only
    one action assigned. However, it is easy to quickly have ten or more actions in
    a real-world application.


    The TextField class is similar to the createNewTextField method that would have
    been used in ActionScript 2. The change in code for ActionScript 3 was done to
    be consistent with custom library items, such as the ones in the previous section.


    The next step is to build the custom class, which will be used to communicate
    with PHP on the Web server.


    ```

    package{

