    \ submitHandler);\nfunction submitHandler(e:MouseEvent):void\n{\n    trace(\"\
    User input: \" + userName.text);\n}\n```\n\nYou can expand this example to add\
    \ error checking and enforcing required fields:\n\n```\nfunction submitHandler(e:MouseEvent):void\n\
    {\n    if(userName.text.length == 0)\n    {\n        trace(\"Please enter a name!\"\
    );\n    }\n}\n```\n\nVery often you will want to get feedback from a viewer of\
    \ your site. This is accomplished by adding a contact form, which generally consists\
    \ of a Flash form that talks to a PHP file."
