  md: "> > Define the backup directory outside of the public path whenever possible\
    \ to ensure the Web browser cannot access the backups.\n\nThe filename of the\
    \ archive needs to be unique to ensure the archives do not overwrite each other.\
    \ You can create a random hash using the time, which would be unique, but it would\
    \ make it impossible to determine which archive you created.\n\nA much more elegant\
    \ solution is to append pieces of the date to the archive name, which creates\
    \ a readable and unique filename. Rather than make multiple calls to date you\
    \ can use the getdate() function, which returns an array of date information that\
    \ you can then reference by the key names.\n\n```\n$today = getdate();\n```\n\n\
    To ensure the date is readable in the best way possible, a series of if statements\
    \ is used to ensure the date values are always two digits. This is not a programming\
    \ requirement, but more importantly a consistency that makes it easier to read\
    \ the date in the filename.\n\n```\n$month = $today['mon'];\n\nif($month < 10)\n\
    {\n    $month = \"0\" . $month;\n}\n\n$day = $today['mday'];\n\nif($day < 10)\n\
    {\n    $day = \"0\" . $day;\n}\n\n$year = $today['year'];\n```\n\nThe actual archive\
    \ creation is broken into three parts, but all in the same command. The first\
    \ part makes a call to the database by passing in the necessary login information.\n\
    \n```\n$mysqlCommand = \"mysqldump --opt -h %s -u %s -p%s %s\";\n```\n\nThe second\
    \ part of the command accepts the MySQL data and pushes it into the gzip function,\
    \ which is where the actual archive is created.\n\n```\n$gzipCommand =\"gzip >\
    \ %s/%s-%s-%s-%s.gz\";\n```\n\nThe third and final part of the command takes the\
    \ variables defined in the previous sections and creates the command string using\
    \ sprintf to cleanly create the command. The sprintf function uses placeholders\
    \ and accepts additional arguments to fill those placeholders. This is the same\
    \ as creating an inline string, but it creates a cleaner and easier string."
