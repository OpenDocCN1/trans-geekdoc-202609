- pgno: 68
  md: '# # Exploring the Basics of PHP


    PHP (Hypertext Pre-Processor) is a server-side scripting language that runs on
    Apache or other similar Web server applications. PHP is one of the most popular
    server-side scripting languages because it is fairly simple to get started in
    and can handle robust applications.


    The coding structure is based on C and can be written in a procedural (step-by-step)
    or Class-based structure (objects, properties, methods, and so on). Once you understand
    the basics of PHP, you can really start to see the true power it has.


    This book is based around PHP 5, but a lot of the following tips, techniques,
    and styles explained in this section can be used for PHP 4 and PHP 5, as the versions
    are fairly similar.


    # ## Understanding variables


    Variables, also commonly referred to as vars or properties (when working with
    classes), are probably the most-used item in programming. They are used to assign
    a value to a place that can be called in another part of the code. The usage of
    variables is not only a timesaver, but also makes the program more structured
    and easy to maintain.


    Here is a very simple example of a variable definition in PHP:


    ```

    ```php

    $myVar = "hello world";

    ```

    ```


    The previous example assigned the string "hello world" to the variable $myVar.


    There are a few things to keep in mind when working with variables.


    +   - They must be preceded by a dollar ($) sign (unless in a Class).


    +   - They must end with semicolon (;).


    Variables can accept many types of data, including, but not limited to String,
    Boolean, and Array, each of which is discussed in the following sections.


    # ### Strings


    String variables contain text, such as:


    ```

    ```

    "Hello, World!"

    ```

    ```


    You can also build strings using concatenation techniques, such as:


    ```

    ```php

    $var = "Hello";

    $var .= ", World!";

    print $var; // Outputs: Hello, World!

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 69
  md: "# Booleans\n\nBooleans are special variables that can be one of two possible\
    \ values: `true` or `false`. They are used mostly in if statements and other forms\
    \ of conditional checks, such as:\n\n```\n```php\n$loggedIn = false;\nif($loggedIn\
    \ == false)\n{\n    print \"Sorry, you are not logged in!\";\n}\n```\n```\n\n\
    # Arrays\n\nArrays are complex data structures consisting of a group of elements\
    \ that are accessed by indexing. In PHP, this index can either be a numeric value\
    \ or a string.\n\nHere is an example of an array and the two ways to access the\
    \ data:\n\n```\n```php\n<?php\n\n$fruit = array(\n    \"Orange\",\n    \"Apple\"\
    ,\n    \"Strawberry\",\n    \"Grape\"\n);\n\nprint $fruit[1]; // Apple\n\n$fruit\
    \ = array(\n    \"orange\" => \"Orange\",\n    \"apple\" => \"Apple\",\n    \"\
    strawberry\" => \"Strawberry\",\n    \"grape\" => \"Grape\"\n);\n\nprint $fruit['orange'];\
    \ // Orange\n\n?>\n```\n```\n\n# Objects\n\nClasses in PHP describe an object\
    \ or are the definition of an object. They consist of self-defined methods and\
    \ properties, which allows you to create custom functionality."
  merge: -1
  img_proc: true
