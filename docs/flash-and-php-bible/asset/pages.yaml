  md: "# # Multiple classes\n\nPHP allows a class script to hold multiple classes.\
    \ This is both a good and bad idea, because too many classes in one file result\
    \ in bloated code that is hard to manage. On the other hand, having the classes\
    \ all in one file makes it easier to distribute. I am sure you are asking yourself\
    \ how exactly are multiple classes defined in one file; here is an example of\
    \ a pseudo-class package.\n\n```\n<?php\n\nclass Animals\n{\n    function Animal\
    \ ()\n    {\n    }\n    public function speak($word)\n    {\n        print $word;\n\
    \    }\n}\n\nclass Dog extends Animals\n{\n    function Dog($word)\n    {\n  \
    \      $this->speak($word);\n    }\n}\n\n// Create a new Dog\n$dog = new Dog(\"\
    Hello... Woof!\" );\n\n?>\n```\n\nIn fact, PHP really doesn't follow all of the\
    \ standard OOP practices, which I think will change as newer versions are developed.\
    \ For now, you can create your own version of a package and get the same basic\
    \ functionality. It is important to note that a pseudo-package does not offer\
    \ the same level of separation and security that a real package does, but with\
    \ some creative programming and proper creation of your classes, you can keep\
    \ the code secure.\n\n> See Chapter 6 for more in-depth information on code security.\n\
    \nThat is all there is to using and understanding classes in PHP, up to the point\
    \ needed for this book. You can, of course, extend this newfound knowledge and\
    \ start exploring the more advanced aspects of classes in PHP.\n\n> PHP offers\
    \ a lot of “magic” methods and properties that make classes more fun and less\
    \ painful to work with."
