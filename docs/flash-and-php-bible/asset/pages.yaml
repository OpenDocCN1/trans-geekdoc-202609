    If you choose to combine the two scripts you may want to limit the backup directories.
    Otherwise,

    the backups could result in slower performance.


    # Using PHP to back up databases


    As you learned in the previous section, you can assign automated backup scripts
    to the crontab

    file. Another common backup script is one that handles your databases. Just like
    the file backup,

    you should then move them to a remote directory to ensure the added file size
    doesn''t affect your

    live server.


    You will find that as your system begins to grow you may want to invest in a backup
    server that

    doesn''t need many resources because it would be used purely for storage. This
    isn''t a required ele-

    ment, but it gives you an added level of protection with your data, as well as
    makes your live server

    more efficient.


    The first part of the database backup script is to define the MySQL connection
    details.


