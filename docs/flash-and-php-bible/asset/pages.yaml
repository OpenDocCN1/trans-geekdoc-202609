- pgno: 88
  md: "```\ncatch (e:Error)\n{\n // handle error here\n}\n```\n\n# Sending data to\
    \ the server\n\nThere may be times when you want to not only silently request\
    \ a URL, but also send data along with it. This is done using the URLVariables\
    \ class, which allows you to create an object of name/value pairs. These would\
    \ be the same as those found in a standard HTML request.\n\n```\nvar serverFile:String\
    \ = \"http://localhost/callLink.php\";\n\nvar variables:URLVariables = new URLVariables();\n\
    variables.id = 1004;\nvariables.user = \"James\";\n\nvar urlRequest:URLRequest\
    \ = new URLRequest(serverFile);\nurlRequest.data = variables;\n\ntry\n{\n sendToURL(urlRequest);\n\
    }\ncatch (e:Error)\n{\n // handle error here\n}\n```\n\nAnother example of one-way\
