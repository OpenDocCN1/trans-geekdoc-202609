    \    trace(\"\\tLevel: \" + param. userlevel);\n    trace(\"\\tStyle: \" + param.userstyle);\n\
    }\n}\n```\n\nBasically, this code first initializes variables to store the user\
    \ data and then checks each passed-in value for a valid entry. The validation\
    \ variable is assigned to true from the start because if any of the if statements\
    \ fail it will be changed to false. This process is considered reverse logic,\
    \ but works quite well for validation routines.\n\n# Using a more secure approach\
    \ for returning data\n\nIn the previous example you learned how to securely work\
    \ with returned data. The problem with this simplified approach is that other\
    \ ways exist to intercept information passed between Flash and the server.\n\n\
    # Using unique responses\n\nThere are a few options to creating an even more secure\
    \ application, which all depend on development time and cost. It is a common thought\
    \ to ignore cost for the ultimate security, but this is simply not possible all\
    \ of the time. Oftentimes you will work on a project that gets to a “good enough”\
    \ point and the app will ship with issues; this is a downside to application development,\
    \ but very common.\n\nThe best way to keep cost realistic is to look at all your\
    \ options. One option is to use md5 to create unique response codes and ensure\
    \ the data is valid, which will work, but nothing stops the “hacker” from decompiling\
    \ your SWF and looking directly at the code.\n\n# Securing your files\n\nIn previous\
    \ versions of ActionScript you were able to create obfuscated SWFs, which meant\
    \ that most applications couldn't decompile them. However, at the time of this\
    \ writing no tool exists for AS3 applications."
  merge: -1
  img_proc: true
- pgno: 166
  md: '# # Understanding the Flash Security Sandbox


    The sandbox in Flash determines which files can be accessed depending on where
    the SWF file is located. An SWF file functions differently when it runs locally
    on the user''s machine than it does on a server.


    For example, an SWF in the local sandbox cannot access both local and remote objects.
    This enforces a level of security on the application to ensure sources can''t
    cross each other.


    Local files can be placed in one of three sandboxes:


    +   - local-with-filesystem: This ensures the user that local content cannot accidentally
    be sent to a network or shared.

    +   - local-with-networking-sandbox: Allows local SWFs to access remote objects,
    if a valid policy file is found.

    +   - local-trusted: An SWF in this sandbox can access data from anywhere, both
    local and remote. Only users and administrators can move an SWF to this sandbox.


    The local-trusted sandbox cannot accidentally be set by a stand-alone SWF. This
    is done to ensure the level of security a user would expect.


    In order to allow access to a remote domain you must first add it to the Security
    class by making a call to allowDomain().


    ```

    Security.allowDomain("www.example.org");

    ```


    You can also use a cross-domain policy file that allows access from specific domains
    or all domains using a wildcard ("*").


    ```

    <allow-access-from-domain="*" />

    ```


    # ## Setting the sandbox type


    When publishing an SWF, you can choose the specified sandbox type depending on
    the resources required in that use. To set the sandbox type, follow these steps:


    +   1. Choose File > Publish Settings.

    +   2. Click the Flash tab.

    +   3. In the drop-down list, click Playback Security.

    +   4. Click OK.


    # ## Using the sandboxType property


    An SWF file can use the read-only static Security.sandboxType property to determine
    which sandbox the Flash player has assigned the current SWF.'
  merge: -1
  img_proc: true
