- pgno: 277
  md: '# # Using PHP to connect to MySQL


    The last PHP file in your Flash chat application is the dbconn.php file. This
    file is responsible for connecting to MySQL and providing a link to your tables
    contained in the database.


    > There can only be one connection to a single database at a time. Best practice
    is to plan your SQL connects to be more efficient. This prevents you from having
    to jump back and forth.


    This file is fairly small but has a very important requirement, which is to honor
    security measures to the highest extent. A good portion of these sections have
    noted that security is important. You looked at many examples earlier; in this
    example security is not excluded for simplicity.


    The first part to the file is assigning the database variables that will be passed
    along for the connection. Oftentimes more advanced applications will have a separate
    file for configuration variables. That configuration file would be loaded only
    when the application begins and referenced throughout.


    However, because this application is fairly small you will just assign the database
    connection variables inside the dbconn.php connection file.


    ```

    $host = "HOST_NAME";

    $user = "SQL_USERNAME";

    $pass = "SQL_PASSWORD";

    $database = "SQL_DATABASE_NAME";

    ```


    The first variable is often localhost or the IP address of the server where MySQL
    is running if it happens to be running remote from the server where PHP is running.
    You wouldn''t expect to see a remote installation of MySQL in smaller systems,
    but it is very common in larger applications.


    The other three variables are username, password, and the name of the database
    to which you want to connect. This connection information is provided by your
    system administrator or host if you don''t already know it.


    > MySQL creates a default installation with a username of “root” and no password,
    but it is very insecure this way and should be changed immediately.


    Now that the variables are properly defined, you can make the actual connection
    to MySQL. This is accomplished by the mysql_connect() function within PHP. This
    function accepts three arguments: host, username, and password defined just a
    moment ago.


    ```

    $link = mysql_connect($host, $user, $pass);

    ```


    The mysql_connect() function returns a resource id that you store in the $link
    variable. This is referenced when you go to select your database.


    Selecting the database is simply a matter of referencing the name of the database
    to which you want to connect and passing along the link received in the connection
    step.


    ```

    mysql_select_db($database, $link);

    ```'
