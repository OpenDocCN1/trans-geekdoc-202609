- pgno: 263
  md: '# Finalizing the planning stage


    The last step to planning an application is not definitive because you can either
    wrap up the planning stages or begin the development process. This choice can
    sometimes be determined by your client or creative director if one has been assigned.


    At this point in the planning process, you have determined what the application
    will do, who will be using it, and how it will be built. You have also designed
    a layout and begun the programming process. The next step is up to you as the
    developer. You can either continue and finalize the design process or begin developing
    the code the application will use.


    Normally, you would design the application enough to get started in the programming
    because things are more than likely going to change as you continue to develop.
    However, with the proper amount of planning you can minimize these revision phases.


    # Developing a Chat Client


    Now that you have looked at the best practices for application development you
    can begin developing your first complete application. This application will be
    a Flash chat client using PHP to interface with a MySQL database. After developing
    the basic application you will continue to add features and look at the best way
    to build a scalable application.


    A scalable application is developed keeping in mind that two users may use the
    application at first, but it could easily be used by millions over time. The idea
    is to account for this and develop the application in a manner that allows for
    expansion.


    # The Flash portion


    You begin this project by designing the application. For this application, the
    design is provided, but feel free to modify it. In fact, you are encouraged to
    expand upon all the examples, which is how you become familiar with new concepts
    and also how you grow as a developer. Figure 11.2 shows the interface for the
    chat application.


    Basically the interface consists of a TextArea component, which is used for displaying
    the chat messages, two TextInput components for the message and username items,
    and a Button instance for the submit button.'
  merge: -1
  img_proc: true
