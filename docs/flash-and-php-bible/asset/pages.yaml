- pgno: 503
  md: "# Using an external library\n\nThe advantage to using an external library is\
    \ you only have to update one location and all instances of that library usage\
    \ are also updated.\n\nFor example, imagine you have a logo with a specific color\
    \ on it and suddenly the company decides that it wants to recolor the logo. Rather\
    \ than opening every instance of that logo and editing it, you can open the master\
    \ FLA, edit that, and then update the instances, which automatically reflect the\
    \ changes.\n\nYou can use this concept for much more than a simple logo, because\
    \ you will be loading the login component from the example file you built in the\
    \ previous section.\n\n# Adding the login component\n\nStart by opening the VideoPlayer.fla\
    \ file if it isn't already opened. Then choose File Import Open External Library.\n\
    \nIn this dialog box, you can navigate to the directory where the login component\
    \ is stored and select that file. With the file selected, click Open.\n\nDrag\
    \ the LoginWindowMC from this library into the library of the VideoPlayer FLA.\
    \ You should now see two new MovieClips in the library of your VideoPlayer file.\
    \ This is because the LoginWindowMC has a supporting file that contains all of\
    \ the design, which is automatically copied when you drag the parent.\n\nNow that\
    \ the login component is added, you can modify the existing VideoPlayer class\
    \ file to add this new functionality. To start, add the component creation, but\
    \ forget about the login logic.\n\nThe new code should be added to the constructor\
    \ function, similar to the following:\n\n```\nfunction VideoPlayer()\n{\n    gatewayURL\
    \ = \"http://localhost/amfphp/gateway.php\";\n    getCategories();\n\n    videoPlayer.visible\
    \ = false;\n    videoListCombo.enabled = false;\n\n    var login:LoginWindow =\
    \ new LoginWindow();\n    login.addEventListener(LoginWindow.LOGIN_ATTEMPT,\n\
    \    loginHandler);\n\n    addChild(login);\n    login.redraw();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 504
  md: "Before you test the code, add the loginHandler method to avoid any runtime\
    \ errors. You can add this method at any point in the code. I recommend somewhere\
    \ toward the bottom of the class to maintain the overall flow of the file.\n\n\
    ```\nprivate function updateTrackingHandler(response:Object):void\n{\n    ...\n\
    }\n```\n\n```\nprivate function loginHandler(response:Object):void\n{\n    ...\n\
    }\n```\n\nThe last step is to import the LoginWindow class so the static property\
    \ can be loaded for the event handler.\n\n```\npackage\n{\n    import flash.display.MovieClip;\n\
    \    import flash.events.Event;\n    import flash.net.*;\n    import LoginWindow;\n\
    \n    public class VideoPlayer extends MovieClip\n    {\n        ...\n    }\n\
    }\n```\n\nWhen you test the application you should immediately see the login window.\
    \ Because you didn't add any logic at this point, there is no way to close the\
    \ login window, but you can see it is working, so you can continue.\n\nThe logic,\
    \ which is responsible for calling the remoting service, needs to be added to\
    \ the existing loginHandler method.\n\n```\nfunction loginHandler(e:Event):void\n\
    {\n    var responder:Responder = new Responder(loginRespHandler,\n    onFault);\n\
    \    gateway = new NetConnection();\n    gateway.connect(gatewayURL);\n    gateway.call(\"\
    User.login\", responder,\n    login.data.username,\n    login.data.password\n\
    \    );\n}\n```"
  merge: -1
  img_proc: true
- pgno: 505
  md: "The next step is to copy the loginRespHandler and add it below the loginHandler\
    \ in the VideoPlayer class.\n\n```\nfunction LoginRespHandler(o:Object):void\n\
    {\n    trace(\"Response: \" + o.response);\n\n    if(o.response == true)\n   \
    \ {\n        trace(\"user logged in\");\n        login.close();\n    }\n    else\n\
    \    {\n        login.responseString = \"username and password incorrect\";\n\
    \    }\n}\n```\n\nThe proper code has now been added to the VideoPlayer class;\
    \ however, there is one final modification needed before the login component will\
    \ function properly.\n\nThe login variable that is defined in the constructor\
    \ needs to be a global property, because as it stands right now, no other method\
    \ in this class has access to it.\n\n```\npackage\n{\n    ...\n\n    public class\
    \ VideoPlayer extends MovieClip\n    {\n        ...\n\n        private var selectedCatID:Number;\n\
    \        private var login:LoginWindow;\n\n        function VideoPlayer()\n  \
    \      {\n            ...\n\n            login = new LoginWindow();\n        }\n\
    \    }\n}\n```\n\nNow that the login variable is properly defined, you can test\
    \ the application, as shown in Figure 17.7. You should be able to type a valid\
    \ username and password, and the login component should disappear when you do\
    \ so."
  merge: -1
  img_proc: true
- pgno: 506
  md: '# FIGURE 17.7 Final video player with login box visible


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_506_0.png)


    As you can see, the login component being built this way really makes it possible
    to add it to any existing project. To extend on this example, you could add a
    shared object that would preserve the session and make it so the user doesn''t
    need to log in each time.


    You should now have a great understanding of building and working with advanced,
    real-world applications. I am sure you are thinking of many various applications
    to build after seeing how they function in depth.


    The following is a table outlining the names of files and where they should be
    stored for this complete application. The path is based on the project directory
    which should be in your Apache home directory in order for the application to
    run properly.


