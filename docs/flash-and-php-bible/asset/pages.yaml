    \    urlLoader.addEventListener(Event.COMPLETE,\n    siteRespondedHandler);\n\
    \    urlLoader.addEventListener(IOErrorEvent.IO_ERROR, noResponse);\n    urlLoader.load(urlRequest);\n\
    }\n```\n\nThe majority of that method is the same as previous examples, with the\
    \ exception of the second event listener. This event listener is assigned to the\
    \ IO_ERROR, which occurs when a file is not properly loaded or called. The noResponse()\
    \ method will be called when the site cannot be loaded, as shown here:\n\n```\n\
    urlLoader.addEventListener(IOErrorEvent.IO_ERROR, noResponse);\n```\n\nThe noResponse()\
    \ method is responsible for incrementing the failedAttempts variable, but using\
    \ a setter method instead of accessing the variable directly.\n\n```\nprivate\
    \ function noResponse(event:IOErrorEvent):void\n{\n    attempts = attempts + 1;\n\
    }\n```\n\nIf the site is loaded, a call to siteRespondedHandler() is made to clear\
    \ the previous failed attempts and basically reset the error count.\n\n```\nprivate\
    \ function siteRespondedHandler(e:Event):void\n{\n    failedAttempts = 0;\n}\n\
    ```\n\nA call to stopChecking() occurs when a site fails to respond after a predetermined\
    \ number of times, set by the MAX_ATTEMPTS constant.\n\n```\nprivate function\
    \ stopChecking():void\n{\n    stopCheck = true;\n}\n```\n\nThe last two methods\
    \ in this class are the getter and setters for the failedAttempts variable. The\
    \ getter simply returns the current value of the failedAttempts value. The setter\
    \ not only"
