- pgno: 164
  md: "# # Returning Data\n\nIt is safe to assume that you will want to be returning\
    \ data back to Flash at some point in your application. The overall security concern\
    \ in this process is similar to sending data, with the exception that more exploits\
    \ would be attempted on the returning of data.\n\n# ## Securely returning data\n\
    \nThe idea of securely passing data back to Flash is a much less talked about\
    \ topic. This is mostly due to the fact that Flash doesn't need to be secure;\
    \ however, it is still a good practice to ensure it is.\n\nIf you fail to validate\
    \ data coming back into Flash you can open a security hole that could, for example,\
    \ allow a user to access a private section of an application. Even worse, it can\
    \ have negative effects on the user experience, and your users can lose faith\
    \ in your application.\n\nThe data coming back into Flash can be altered in the\
    \ same way the data going out can. For the previous example, a string of data\
    \ is returned, but is never checked to make sure the data is valid. Let's expand\
    \ upon the previous example to add this extra security. The response function\
    \ is the only section of code that needs to be modified because the request will\
    \ be the same.\n\n```\n```actionscript\nfunction response(e:Event):void\n{\n \
    \   var loader:URLLoader = URLLoader(e.target);\n    var param:URLVariables =\
    \ URLVariables(loader.data);\n\n    var username:String;\n    var userLevel:uint;\n\
    \    var userStyle:String;\n    var validData:Boolean = true;\n\n    if(param.username\
    \ != \"\")\n    {\n        username = param.username;\n    }\n    else\n    {\n\
    \        validData = false;\n    }\n\n    if(param.userlevel!= \"\")\n    {\n\
    \        userLevel = param.userlevel;\n    }\n    else\n    {\n        validData\
    \ = false;\n    }\n\n    if(param.userstyle != \"\")\n```\n```"
