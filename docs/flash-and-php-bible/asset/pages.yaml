  md: "# resetHandler method\n\nThe resetHandler method is called whenever the Reset\
    \ button is clicked. This method clears all\nof the status messages and empties\
    \ the login and password fields.\n\n```\nprivate function resetHandler(e:MouseEvent):void\n\
    {\n    loginMC.username.text = \"\";\n    loginMC.password.text = \"\";\n    loginMC.responseTxt.text\
    \ = \"\";\n}\n```\n\n# loginHandler method\n\nThe loginHandler method is attached\
    \ to the CLICK event of the loginBtn. This method is\ncalled whenever the loginBtn\
    \ is clicked by the mouse.\n\n```\nprivate function loginHandler(e:MouseEvent):void\n\
    {\n    ...\n}\n```\n\nThis method is responsible for checking the username and\
    \ password fields for valid data. If one of\nthese fields is empty, the function\
    \ is exited and a response message is displayed below the pass-\nword field.\n\
    \n```\nloginMC.responseTxt.text = \"\";\n\nif(loginMC.username.text == \"\" ||\
    \ loginMC.password.text == \"\")\n{\n    loginMC.responseTxt.text = \"username\
    \ & password required\";\n    return;\n}\n```\n\nIf the username and password\
    \ fields are found to have acceptable values, those values are stored in\nthe\
    \ data property, which will be read by the calling script in a custom event handler.\n\
    \n```\ndata = {\n    username:loginMC.username.text,\n    password:loginMC.password.text\n\
    };\n```\n\nThe last part of this method is to fire off a custom event, alerting\
    \ the calling script that a username\nand password have been captured and need\
    \ to be validated.\n\n```\ndispatchEvent(new Event(LOGIN_ATTEMPT));\n```\n\nThis\
    \ component has been developed to separate the display and security logic, which\
    \ means the\ncomponent can be reused because nothing is hardcoded into the actual\
    \ login logic."
