    The above method has a special type of return defined. This return value is an
    inline Object which is used to simplify code by excluding unnecessary variable
    names.


    Each of the types: Array, Object, and String have a shorthand way to define them.
    For example, the Object type can be defined simply with:


    ```

    var sampleObj:Object = {name:value};

    ```


    Table 12.1 shows the type and the shorthand equivalent for it. Using the shorthand
    values can save development time because you have to type less.


    **WARNING** The shorthand can create problems because you create a “weakly” typed
    object. Therefore you cannot benefit from compile time type checking. You may
    access the dynamic object improperly and you will not know until runtime. This
    means that you should use caution when creating your properties and variables
    in shorthand.'
