- pgno: 110
  md: "When working with PHP applications or other dynamic scripting you will most\
    \ likely pass along parameters to work with. Even more important is the fact you\
    \ may get different data types back. For example, you may expect an Object but\
    \ get an error code instead. The purpose of this section is to develop a way in\
    \ which to handle this case.\n\n```\nvar phpFile:String = \"sample.php\";\nvar\
    \ urlRequest:URLRequest = new URLRequest(phpFile);\nvar loader:URLLoader = new\
    \ URLLoader();\nloader.addEventListener(Event.COMPLETE, serverHandler);\nloader.load(urlRequest);\n\
    \nfunction serverHandler(e:Event):void\n{\n    var loader:URLLoader = URLLoader(e.target);\n\
    \    var vars:URLVariables = new URLVariables(loader.data);\n\n    if(vars.response\
    \ == 'ERROR')\n    {\n        trace(\"An Error occurred, response not loaded\"\
    );\n    }\n    else\n    {\n        trace(\"Server Response: \" + vars.response);\n\
    \    }\n}\n```\n\nThis handler is very similar to previous examples, with the\
    \ exception that the response variable has been given an untyped definition. This\
    \ allows various data types to be stored in it, such as a string for an error\
    \ and an object for the expected response.\n\n> **NOTE** Be careful when setting\
    \ a variable as untyped. This removes error checking and makes it hard to know\
    \ what a variable contains.\n\n# # Loading XML in Flash\n\nMore than likely you\
    \ will find yourself working with lots of data. Ideally this data will be passed\
    \ back in XML format. XML is an industry standard; after you start working with\
    \ it you quickly understand why. It is based on tags to define the data objects,\
    \ similar to a multidimensional array. The developer is allowed to define custom\
    \ tags, so easily building a usable XML style is very painless.\n\n# ## Using\
    \ E4X with XML\n\nA major update to ActionScript 3 is the ability to parse XML\
    \ using E4X. This allows us to quickly get data hidden deep within an XML file\
    \ and with a lot less code than needed in previous versions."
