    \n$points = simplexml_load_string($_POST['pointData']);\n\n$img = imagecreatetruecolor($width,\
    \ $height);\n\n$limit = count($points->point);\n\nfor($j=0; $j < $limit; $j++)\n\
    {\n\t$x = $points->point[$j]->x;\n\t$y = $points->point[$j]->y;\n\n\t$color =\
    \ $points->point[$j]->c;\n\t$color = hexdec($color);\n\n\timagesetpixel($img,\
    \ $x, $y, $color);\n}\n\nheader('Content-Type: image/png');\nimagepng($img, 'render_'\
    \ . time() . '.png');\n?>\n```\n\n# Gathering the pixel data in Flash\n\nThere\
    \ are only a few updates necessary to the Flash code from the previous section,\
    \ but for now focus on gathering the image data using the BitmapData class.\n\n\
    The first step in this function is to determine the dimensions of the image.\n\
