    At this point, you have a working example of a Buy Now button for PayPal. It is
    just a matter of adding the specific item information. You can also create a class
    to make this creation process easier, as mentioned earlier.


    PayPal also offers a shopping cart-based system where you can allow the user to
    choose multiple items and quantities. This item info is stored in the same basic
    format POST data, but keeps track of each individual item. Whether you use the
    cart option or a one-item Buy Now solution you only need to send one request.


    This example didn''t actually require the use of any PHP. You can easily extend
    the example by first sending the order information to PHP and storing the purchases
    for your own order tracking system. PayPal even offers solutions for developers
    to directly connect to their payment system and get confirmation if an order goes
    through. This service is beyond the scope of the book, but PayPal provides adequate
    documentation to get started.


    # Using Flash and PHP to Build a Cart


    The previous section focused on building a Buy Now button in Flash using PayPal
    as the payment system. That system works pretty well, but it doesn''t really offer
    the developer complete control of the cart, payment, and storage components. Most
    of the time when you choose to build a custom solution you will end up with better
    results. This is not to say everyone can develop the next PayPal interface, but
    how much of that site do you use? Building a custom solution is where you get
    to focus on the features you will use and exclude the ones you won''t.


    This shopping cart is broken into four parts: design, MySQL, PHP, and the ActionScript
    that brings it all together.'
