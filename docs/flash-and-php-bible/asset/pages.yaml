    \ as shown in Figure 16.1 is newly released versions that have not been tested\
    \ as much as stable releases would be. This allows you to work with more advanced\
    \ and newer features, but also means you could run into bugs and development issues\
    \ when using these versions. As you continue to test this new technology you can\
    \ determine whether it should be used in a live environment and move it over when\
    \ it is ready.\n\n# Dependencies\n\nMany libraries and tools that you will use\
    \ on your Web server depend on other libraries. For example, PHP's GD library\
    \ for image manipulation requires the libjpeg library in order to properly edit\
    \ images.\n\nWhen you update your server, you need to be aware of these dependencies\
    \ because updating one portion can result in broken or incomplete installations.\
    \ Oftentimes you will find information on the developer's site regarding specific\
    \ update information or you can consult `php.net` in the comments section. There\
    \ you will find other developers reporting their results in various development\
    \ situations."
