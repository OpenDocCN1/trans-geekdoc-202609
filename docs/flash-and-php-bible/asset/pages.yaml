- pgno: 306
  md: '# Using PHP to Develop a Hit Counter


    A hit counter is used to determine how many visitors are going to a site. Generally,
    the hit counter is visible to visitors in the form of text or a graphic. Some
    sites use other forms of monitoring that are not publicly available, for stats
    tracking purposes. The major draw and feature of a hit counter is some graphical
    representation.


    You can either use a flat file text or SQL database to store the data for the
    hit counter. This example uses an SQL database for a couple of reasons: speed
    (the database can process information much faster) and file permission concerns.
    In rare cases a server can place a lock on a file, which means that file cannot
    be opened. This would force the hit counter to fail and is not the ideal result
    you would be looking for.


    # Hit counter logic


    The logic behind the hit counter is fairly simple. You first make a call to the
    database to capture the current hit count and increment it by 1.


    ```

    $oldCount = $row[''amount''];

    $newCount = $oldCount + 1;

    ```


    When you have the new value, send it back into the SQL table. Do this by updating
    the existing row and setting the amount column to the value of $newCount variable.


    ```

    mysql_query("UPDATE counter SET amount=" . $newCount);

    ```


    The last step in the PHP code is to return the new value to Flash for it to display.


    ```

    return "resp=" . $newCount;

    ```


    That is all the PHP needs for the hit counter logic. Following is the completed
    file.


    ```

    <?php


    include ''dbConn.php'';


    $query = "SELECT amount from counter";

    $result = mysql_query($query);

    $row = mysql_fetch_array($result);

    $oldCount = $row[''amount''];

    $newCount = $oldCount + 1;


    mysql_query("UPDATE counter SET amount=" . $newCount);


    return "resp=" . $newCount;

    ?>

    ```'
  merge: -1
  img_proc: true
- pgno: 307
  md: "# Developing the Flash hit counter\n\nWith the PHP done, you can move onto\
    \ the Flash development, which consists of an all ActionScript application.\n\n\
    The hit counter needs to first call the PHP file, which serves two purposes. The\
    \ first is calling the PHP file to load and increment the count. The second purpose\
    \ is to return the new value, which is passed in to a dynamic text field.\n\n\
    The first part is to assign the phpFile variable, which is a reference to the\
    \ hit counter file located on the server.\n\n```\nvar phpFile:String = \" http://localhost/ch10/hitCounter/\"\
    ;\n```\n\nThe first function to build is the loadHitCounter(), which is responsible\
    \ for calling the server and assigning the response handler.\n\n```\nfunction\
    \ loadHitCounter():void\n{\n    var urlRequest:URLRequest = new URLRequest(phpFile);\n\
    \    var urlLoader:URLLoader = new URLLoader();\n    urlLoader.addEventListener(Event.COMPLETE,\
    \ handleServerResp);\n    urlLoader.load(urlRequest);\n}\n```\n\nAfter the response\
    \ is loaded, the handleServerResp() is called passing along the loaded data. This\
    \ data is then sent to the URLVariables class to pull out the resp property. This\
    \ property is where the current count is located.\n\n```\nfunction handleServerResp(e:Event):void\n\
    {\n    var loader:URLLoader = URLLoader(e.target);\n    var variables:URLVariables\
    \ = new URLVariables(loader.data);\n    var count:uint = variables.resp;\n   \
    \ ...\n}\n```\n\nThe count is finally placed in the dynamic text field, which\
    \ is not formatted in this example, but you can easily add this on your own.\n\
    \n```\nvar txt:TextField = new TextField();\ntxt.selectable = false;\ntxt.width\
    \ = 200;\ntxt.text = count + \" visitors\";\n}\n```\n\nThe absolute last line\
    \ of code in the ActionScript is the call to the loadHitCounter function, which\
    \ kicks it all off.\n\n```\nloadHitCounter();\n```"
