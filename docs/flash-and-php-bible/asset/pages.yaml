    # Working with Sockets in Flash


    Flash is considered the client side of a socket connection. This means you can’t
    deploy a socket server directly from Flash, because Flash is a client-side application.
    Being able to use Flash as a socket server, if it was possible, wouldn’t be very
    beneficial due to the fact that Flash is a graphical application. It would essentially
    be a waste of resources to use Flash in a command-line environment.


    That being said, Flash makes an excellent socket server client. Telnet was used
    in the previous section, which is one way to initialize a client connection to
    a socket server. Flash allows the TCP connections, which require more code and
    more setup in the beginning.


    The majority of the connection code in the next section could be built into a
    common class or library to minimize the amount of code required to create a socket
    connection.


    # Initializing a socket connection


    The first part to initializing a socket connection is to define the host and port
    to connect on.


    ```

    var host:String = "127.0.0.1";

    var port:uint = 8888;

