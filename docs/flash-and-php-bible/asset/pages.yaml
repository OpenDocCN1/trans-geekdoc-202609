    \  pollVotes INT(11) NOT NULL,\n  active VARCHAR(1) DEFAULT 1 NOT NULL\n );\n\
    ```\n\nThis schema is placing the questions and answers in one table for simplicity.\
    \ However, in a more robust application you would want to place the question and\
    \ answers in two separate tables for better scalability. This is how you make\
    \ a database more efficient.\n\nAfter the SQL is written, you can move on to developing\
