- pgno: 265
  md: "You will be referencing the instance names during the development of the ActionScript\
    \ for your chat application.\n\nWith the user interface “design” portion completed\
    \ or in this case loaded, you can begin development of the code.\n\nThe first\
    \ part of the chat application code is a block of variables that are used throughout.\
    \ The first variable is the absolute path to the PHP files. Then next two variables\
    \ are the PHP files responsible for sending and loading the chat messages from\
    \ the database. After that are two Boolean variables to ensure multiple message\
    \ calls can’t be made. The last set of variables is a reference to the Timer object\
    \ and the cache buster.\n\n```\nvar phpPath:String = \"http://localhost/ch10/chatClient/\"\
    ;\nvar phpSendMessage:String = phpPath + \"message.php\";\nvar phpLoadMessages:String\
    \ = phpPath + \"getMessages.php\";\n\nvar loadingMessages:Boolean = false;\nvar\
    \ sendingMessage:Boolean = false;\n\nvar timer:Timer;\nvar cacheBuster:String\
    \ = \"?cb=1\";\n```\n\nThe first function you will build is the init() or initialization\
    \ function. This is called only once, when the application starts. It is responsible\
    \ for setting up a timer handler for loading the messages from the server and\
    \ making the first call to a cache buster, which is explained in the next section.\
    \ The last action of the init() function is to call the loadMessages function\
    \ and populate the message list.\n\n```\nfunction init():void\n{\n    // start\
    \ timer for loading of messages\n    timer = new Timer(5000, 0);\n    timer.addEventListener(TimerEvent.TIMER,\
    \ timerHandler);\n    timer.start();\n\n    cacheBuster = getCacheBuster();\n\
    \    loadMessages(); // first time\n}\n```\n\nThe Timer class ships with Flash\
    \ and has a lot of great uses. This example takes advantage of the TIMER event,\
    \ which is called every time the countdown is reached. The countdown time and\
    \ number of repeats are passed into the constructor. Set countdown to 5000 or\
    \ 5 seconds and the repeats to 0, which actually tells ActionScript to repeat\
    \ continuously. After a new Timer instance is created you assign the event handler\
    \ and start the timer immediately. The timer handler simply makes a call to the\
    \ loadMessages function."
  merge: -1
  img_proc: true
- pgno: 266
  md: "This portion of the code could be condensed by placing the `loadMessages` function\
    \ in place of the `timerHandler`, but doing it this way allows us to add more\
    \ functionality down the road. It is all good development practice to create proper\
    \ handlers for events so the code can be updated, and it makes it overall a lot\
    \ easier to read.\n\n```\n```actionscript\nfunction timerHandler(e:TimerEvent):void\n\
    {\n    loadMessages();\n}\n```\n```\n\nThe `loadMessages` function is responsible\
    \ for calling and handling the response from the server. The call to the server\
    \ is very similar to other examples with a few new elements. One new element is\
    \ the `cacheBuster` variable, which is used to ensure we don’t receive a cached\
    \ result.\n\n# ## Stop caching with dynamic data\n\nYou just created a variable\
    \ to stop caching, but what exactly is that? Caching on the server is when dynamic\
    \ data is stored for quicker loading on all future calls. At first glance this\
    \ would seem like a good idea, and in most cases it is. However, in the example\
    \ of loading chat data that is constantly changing it is probably safe to say\
    \ you want this data to be fresh. This is accomplished by adding a variable referred\
    \ to as a “cache buster,” which fools the browser into thinking each call to the\
    \ same file is different.\n\nHere is a very simple example of a cache buster and\
    \ the actual string that is sent to the server:\n\n```\n```actionscript\nfunction\
    \ getRandom(length:uint):void\n{\n    return Math.round(Math.random() * (length\
    \ - 1)) + 1;\n}\n\nvar rand:String = \"?cb=\" + getRandom(8);\nvar php:String\
    \ = \"http://localhost/ch04/getMessages.php\" + rand;\n\ntrace(\"URL: \" + phpFile);\
    \ // getMessages.php?cb=65378426\n```\n```\n\n**CAUTION** Cache busters add to\
    \ download time and force any file with a cache buster to be downloaded every\
    \ time it is requested.\n\nEverything after the `?` in the URL is telling the\
    \ browser and server that the call is dynamic and results in the file not being\
    \ cached.\n\nThe next part to the process of sending the message is ensuring the\
    \ message is at least three characters long. If the message is not at least three\
    \ characters, an error message is displayed. There are two ways you can write\
    \ this conditional check."
  merge: -1
  img_proc: true
- pgno: 267
  md: "The first option is:\n\n```\nif(newMsgTxt.text.length > 2)\n{\n}\n```\n\nThe\
    \ second option, which is easier to quickly understand:\n\n```\nif (newMsgTxt.text.length\
    \ >= 3)\n{\n}\n```\n\nBoth options achieve the same result, but the second option\
    \ is much easier to read from a logical point of view.\n\nNow, assuming you have\
    \ a message of the correct length you can continue with the process of sending\
    \ the message to the server. The next part is constructing the call to the server.\n\
    \n```\nvar variables:URLVariables = new URLVariables();\nvariables.user = usernameTxt.text;\n\
    variables.msg = newMsgTxt.text;\nvar urlRequest:URLRequest = new URLRequest(phpSendMessage\
    \ +\ngetCacheBuster());\nurlRequest.method = URLRequestMethod.POST;\nurlRequest.data\
    \ = variables;\nvar urlLoader:URLLoader = new URLLoader();\nurlLoader.addEventListener(Event.COMPLETE,\
    \ sendMessageHandler);\nurlLoader.load(urlRequest);\n```\n\nWhen calling the server,\
    \ you must set up a URLVariables object in order to pass along the user-name and\
    \ message that was entered. A call is also made to the custom cache buster function\
    \ to ensure the data is always fresh.\n\nThe last step in the sending function\
    \ is to immediately add the user's message instead of waiting for the message\
    \ list to update from the server. This gives the application a more responsive\
    \ feel and makes it so the message doesn't appear to have been ignored.\n\n```\n\
    addMessage(usernameTxt.text, newMsgTxt.text);\n```\n\nThis function accepts two\
