- pgno: 8
  md: '# Foreword


    Macromedia . . . errr Adobe Flash is hands down one of the most impressive and
    powerful tools for any designer when it comes to bringing an experience to a user.
    And as Flash continues to evolve not just web, for which it got popular, but also
    offline users with platform developments such as Adobe AIR and the wide range
    of third-party tools that can be used.


    But to a hardcore developer Flash has had a bad rap. Mainly due to the fact that
    AS 1.0 was an awkward, gawky, and immature language. Compared to other languages
    popular when AS 1.0 was introduced, it wasn''t something to be taken seriously
    in a developer''s eye and rightfully so. But then if Flash is so hindering, why
    am I even reading a foreword for a book on the subject?


    Things have changed, drastically changed. AS 3.0 is here and it is one of the
    best languages around when understood. AS 2.0 was a step in the right direction,
    but AS 3.0 has surpassed every Flash developer''s dreams. Small file sizes, very
    solid performance, and even some data handling that rivals Java, so really there
    isn''t a developer who can say it is no longer a concrete language.


    And with AS 3.0 a new era of data handling is introduced into Flash. And not only
    with Flash, but when you start mixing in PHP5, MySQL 5, ASP, AMFPHP, and other
    methods of handling data, the possibilities open up into a new realm. Data is
    up for grabs in AS 3.0, and it''s only a matter of reading a book like this to
    apply it. Sockets, xml, web services, and other external data sources allow a
    Flash developer to get really dirty in a data source and update the content without
    touching the Flash files again. The benefit is allowing more time to develop an
    engaging user experience without worrying about repeat edits, a client''s future
    budget, etc. It actually allows a serious Flash developer to continue to work
    with data sources as they are developed and concentrate on the benefits of finessing
    the content itself, rather than what the content is at the time of development
    that can change on a client''s whim later on.


    Gone are the days that you would build a client''s website, have a ton of large
    swfs, only for them to constantly need updates for photos, copy, catalog items,
    etc. In this book you will read how to utilize the methods mentioned to broaden
    your understanding of taking out the last restriction to knowing powerful Flash,
    updating without ever republishing, opening up an FLA, or worrying if the client
    sent you the right copy, image, or other asset.


    Get rid of the idea that a Flash project is now plagued with an ever-so-changing
    fla file and embrace the idea of run-time content generation.


    Michael Minor

    Director of Interactive Media

    invertedCreative.com'
