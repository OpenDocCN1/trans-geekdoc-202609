  img_proc: true
- pgno: 278
  md: 'The final and most important step is to destroy the variables that contain
    the MySQL connection information. Destroying or deleting a variable is done by
    passing the variable reference to the unset() function, which removes the existence
    of that variable.


    ```

    unset($host);

    unset($user);

    unset($pass);

    unset($database);

    unset($link);

    ```


    It is important to have this step to ensure that future aspects of an application
    can''t gain access to these variables. This is especially important when introducing
    third-party applications into your custom application.


    A safer alternative to the previous method is to wrap all of this in a class.
    This is similar to working with a closed component in Flash. Access is allowed
    only to what you want others to see; the rest is hidden.


    Here is an example of a database connection using a class:


    ```

    <?php


    // simple mysql connection class


    class MysqlConnection

    {


    public $link;


    private $host = "localhost";

    private $user = "SQL_USERNAME";

    private $pass = "SQL_PASSWORD";

    private $database = "SQL_DB_NAME";


    function MysqlConnection() {}


    public function connect()

    {

    $this->link = mysql_connect(

    $this->host,

    $this->user,

    $this->pass

    );

    mysql_select_db($this->database, $this->link);

    }


    public function setConnectionDetails($h='''', $u='''', $p='''',

    $d='''')

    {

    ```'
