    \";\n        $xml .= \" value=\\\"\" . $row['pollValue'] . \"\\\"\";\n       \
    \ if($row['pollType'] == \"answer\")\n        {\n            $xml .= \" votes=\\\
    \"\" . $row['pollVotes'] . \"\\\"\";\n        }\n        $xml .= \" />\\n\";\n\
    \    }\n    $xml .= \"</poll>\";\n    header(\"Content-type: text/xml\");\n  \
    \  print $xml;\n}\nelse if($action == \"vote\")\n{\n    $votes = (isset($_GET['v']))\
    \ ? $_GET['v'] : \"\";\n    $question = (isset($_GET['q'])) ? $_GET['q'] : \"\"\
    ;\n    $votes = $votes + 1;\n    $sql = \"UPDATE poll SET pollValue=\" . $votes\
