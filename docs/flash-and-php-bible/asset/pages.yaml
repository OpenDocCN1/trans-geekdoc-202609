- pgno: 246
  md: 'The preceding code simply returns the current value of the private `_person`
    property. Or, a call to `person` will modify that private property if the new
    value is at least 1 and no more than 25 characters in length. You can add any
    level of security or data modification to these setters. The advantage to using
    a setter is the ability to lock access to the private properties, also called
    encapsulation. This ensures the code can’t be broken by passing in the incorrect
    data, or worse, compromising a system due to an open class.


    Now that you understand what a getter and setter are, it is probably a safe bet
    to say you probably also want to know how to call them. That is done by accessing
    the public variable, such as:


    ```

    var people:People = new People();

    people.person = "Timmy";

    trace("The new person is: " + people.person);

    ```


    Like most aspects of programming, it is the developer''s responsibility to determine
    where and when the use of a getter/setter is a good idea. The easiest way to determine
    this is by first creating a proper application outline.


    # # Using Classes in PHP


    Now that you have an understanding of what OOP is and how it works, the next step
    is looking at the class differences in Flash and PHP


    To start, here is a quick example of a class in PHP:


    ```

    <?php

    class Example

    {

    public $sample = "Hello, World!";

    function Example()

    {

    return $sample;

    }

    }

    ?>

    ```


    That is the basic way to set up a class in PHP. The main aspects are property
    definitions that start with public, private, or protected. A property will still
    require the $, just like in standard PHP code. The only other real difference
    is the fact PHP does not declare the return type. In fact, PHP really doesn’t
    strictly care what type a variable holds, which is actually not a good thing.
    The developer can lose the ability to know what type of data a variable holds.'
