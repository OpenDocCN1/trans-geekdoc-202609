- pgno: 214
  md: 'This is only a small portion of the full line of open source libraries available
    for ActionScript 3. It should give you a good idea of not only how expandable
    ActionScript 3 is, but also how many developers have spent long hours developing
    these awesome tools. Even more amazing is the fact these libraries are free, which
    means more developers, including you, can create more interesting and engaging
    content at no additional costs.


    # Libraries in PHP


    There are also many libraries available for PHP, which include session management,
    image handling, database connectivity, and overall server management to name a
    few. Basically, PHP is built using third-party libraries because PHP in itself
    is an open source project. This means many different developers contribute code
    to the project.


    Some of the more common PHP libraries include the GD library, which is discussed
    Chapter 12. Table 9.2 lists other common PHP libraries that you will use in your
    development process.


    | Library | Description | Source |

    |---|---|---|

    | Pear | A structured library of opensource code | http://pear.php.net/ |

    | ImageMagick | Software suite to create, edit, and compose bitmap images | www.imagemagick.org/
    |

    | PDF Library | PDF creation library for PHP | www.php.net/pdf |


    # Installing Third-Party Libraries


    You should now have an understanding of what third-party libraries are available
    for you to use in your ActionScript 3 development.


    The process of installing these third-party libraries is very similar no matter
    which library it is.


    > NOTE Check the version requirements on libraries to make sure they will work
    with ActionScript 3 or the version of PHP you happen to be using.


    # Installing libraries in Flash CS3


    After you select the third-party libraries that you want to use, the next step
    is to install them. The process of installing a code library in CS3 depends on
    the specific class.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# ## Installing as an MXP file


    One way a library or component set can be distributed for portability is in the
    MXP format. These files are loaded into the Extension Manager that ships with
    Flash CS3 and many other Adobe applications (see Figure 9.1).


    The advantage to using this included application to manage your libraries is that
    you can enable, disable, or update the individual libraries in a nice, manageable
    GUI. This application also contains direct links to the developers’ Web site for
    support or online documentation.


    # FIGURE 9.1


    Extension Manager ships with Flash CS3 and other Adobe applications.


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_215_0.png)


    # ## Installing as a standard class package


    The other more common installation method is to manually add the classes to the
    classpath of Flash CS3. You also need to copy the class files to the sharing directories
    that Flash knows to look in for third-party libraries.


    It is a good idea to create a new folder on a separate part of your computer so
    you don’t accidentally modify the default classes that ship with Flash CS3.


    # ## Creating a custom classpath


    In order to add a custom classpath, you must first create a directory on your
    computer to store your classes. After you determine which directory you will use,
    add this new path to the existing classpath listing.


    To add a new classpath to the existing list, follow these steps:


    +   1. Choose Edit > Preferences (Windows). On a Mac, choose Flash > Preferences
    to open the Preferences dialog box.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '+   2. Click ActionScript in the Category list, and then click ActionScript
    3.0 Settings.

    +   3. Click Browse To Path, and browse to the directory you want to add. Click
    OK.


    You can also add a classpath to the specific Flash project by modifying the ActionScript
    settings in the Publish Settings dialog box. Adding the classpath to a project
    has the benefit that it will move with the FLA, which means this file can be shared
    and the global classpaths won’t need to be modified.


    # Default classpaths


    The default classpath of all Flash documents can be modified so you don’t have
    to update each individual Flash file. The following are the locations where Flash
    expects to find the class files, based on a default installation.


    Windows: Hard Disk\Documents and Settings\user\Local Settings\Application Data\Adobe\Adobe
    Flash CS3\language\Configuration\Classes.


    Macintosh: Hard Disk/Users/user/Library/Application Support/Adobe/Adobe Flash
    CS3/language/Configuration/Classes.


    > **NOTE** Do not delete the absolute global classpath. Flash uses this classpath
    to access built-in classes. If you accidentally delete this classpath you can
    re-add it by using the following piece of code as a new class path: $(LocalData)/Classes.


    # Installing libraries in PHP


    PHP libraries are often compiled directly into the PHP installation process. However,
    with the use of PEAR and other common structured library systems, you can install
    new libraries after the initial installation has been completed.


    An example of an external library that is commonly used and can be added after
    you install PHP is the MySQL library. This library is used to communicate with
    a database directly in PHP.


    The first step is to open the php.ini file, uncomment the mysql library file,
    and modify the location of the MySQL socket path and the port if you choose a
    different one when installing MySQL.


    > **NOTE** You must restart the Apache server after you modify the php.ini file.


    If once you restart Apache, and MySQL still isn’t functioning properly, then you
    may have an outdated version installed. This means you may have to recompile PHP.


    > **CROSS-REF** To learn about recompiling PHP, see Chapter 1.'
  merge: -1
  img_proc: true
- pgno: 217
  md: "# # Using Third-Party Libraries\n\nThe first step to working with third-party\
    \ libraries is to download the library files from the developer's Web site. Once\
    \ you have successfully downloaded the class library files, the next step is to\
    \ install and configure the third-party libraries.\n\nNormally the library will\
    \ come with a testing kit to ensure everything is working properly. This step\
    \ is not required, but does minimize debugging needed in your final application.\n\
    \nIf the library does not come with a test kit, you can quickly create one, which\
    \ is explained in the following section.\n\n# ## Working with libraries in Flash\
    \ CS3\n\nTo determine if the classes are properly loaded, you can build an application\
    \ to test a specific portion of a class contained in the library.\n\nFor this\
    \ example, the as3CoreLib library from Adobe is used. This class contains a series\
    \ of utility classes for everything including image manipulation all the way to\
    \ security such as MD5 hash creation tools.\n\nHere is an example application\
    \ using the MD5 functionality:\n\n```\nimport com.adobe.crypto.MD5;\n\nfunction\
    \ createHash(e:MouseEvent):void\n{\n    responseTxt.text = MD5.hash(origStrTxt.text);\n\
    }\n\ncreateBtn.addEventListener(MouseEvent.CLICK,  createHash);\n```\n\nThe first\
    \ part of this application imports the necessary classes. In this example, that\
    \ would be the MD5 class found in the crypto package.\n\nThe function is called\
    \ when the button is clicked. Once the function is called, the next step is to\
    \ create a new hash by calling the static hash method of the MD5 class. Finally,\
    \ the newly created string is returned to the responseTxt TextInput component\
    \ located on the Stage.\n\nThat is the complete application. It is a very simple\
    \ usage but informs you when the proper classes are installed and are functioning\
    \ properly.\n\nWorking in this unit style is very common in development because\
    \ if an application gets too big it is much harder to debug and manage."
  merge: -1
  img_proc: true
- pgno: 218
  md: '# # Working with Libraries in PHP


    Libraries in PHP are very similar to compiled portions of PHP, but you still should
    test them after you install a new library. You normally will also have to restart
    Apache in order for new changes to PHP to take effect. Oftentimes the installation
    instructions for a library will mention this, but either way it needs to be done.


    # ## Testing the MySQL library


    For testing the MySQL support you don’t have to create an elaborate example; in
    fact, you can create a script that is guaranteed to not run properly, but will
    inform you whether MySQL is properly installed or not.


    This is not a very common practice, but in the interest of rapid testing it works
    very well.


    > NOTE: After you run code that you know is going to fail it is a good idea to
    clear the error logs so they don’t confuse you later on down the road.


    Here is the code for the simple test.


    ```

    <?php

    // no password is sure to fail,

    // unless it is a default installation

    mysql_connect("localhost", "root", "");

    ?>

    ```


    The simple application attempts to connect to the database, and if you are shown
    invalid user or no database selected then you know MySQL is properly installed.


    However, if you see a Fatal Error: function not found... it means MySQL has not
    been properly configured or installed to work with PHP.


    You can create a quick phpinfo file to determine whether or not MySQL has been
    installed and to track down the specific error.


    # ## Installing the MySQL library


    The MySQL library is normally included with PHP, but doesn’t come enabled, by
    default. The first step is to open the php.ini file for the version of PHP that
    you have installed.


    You will find a section in the php.ini file with the heading “[mysql]”. This is
    where you would configure the installation of MySQL.


    Once the configuration is finalized, the next step is to uncomment the line in
    the library list that has the name “mysql” within it.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'At this point the configuration is complete; the last step is to restart Apache
    and test the previous script once again, which should display a connection error
    and not the PHP Fatal Error.


    # # Glancing at AMFPHP


    AMFPHP is an open source implementation of the Action Message Format (AMF). AMF
    allows for binary serialization of ActionScript objects to be sent to server-side
    scripts.


    # ## AMFPHP for AS3 and PHP Developers


    PHP developers can leverage their PHP experience by connecting to data such as
    Web services and databases. AMF allows for native data types and complex object
    mapping between the client and the server. AMFPHP is one of the most popular and
    fastest client server communication protocols available to Flash Player developers.
    Communication is arranged into binary format, which is generally more compact
    than other representations.


    # ## AMFPHP and ActionScript 3


    ActionScript 3 allows for the compression of communications, which means faster
    output of calls and overall better performance. In addition, AMF3, which is available
    in ActionScript 3, also compresses the binary communication for increased performance.


    # ## Installing AMFPHP


    Installing AMFPHP is simple. The scripts require a PHP server and do not need
    any additional services or libraries installed. This offers the advantage of near
    instant setup, which allows the developer to focus on the actual application instead
    of worrying about what is going on behind the scenes.


    To install AMFPHP, first download the latest version, which is available free
    from the SourceForge Web site at http://sourceforge.net/project/showfiles.php?group_id=72483#files.
    SourceForge is the largest open source Web development Web site that hosts a number
    of different projects like AMFPHP.


    The contents of the downloaded archive are placed in the root of your Web server
    in a new directory such as flashservices or any name you choose.


    AMFPHP is almost ready to go right out of the box. The only file you need to modify
    is gateway.php, which is located in the root of the installation directory. In
    this case, the path would be flashservices/gateway.php. In some cases, you can
    leave all of the settings on the default, which is what is used for this example.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Testing the installation


    When everything is properly installed you can test the installation of AMFPHP
    by opening the gateway.php in your Web browser. For example, assuming the installation
    is done locally, the URL would be http://localhost/flashservices/gateway.php.


    A screen, as shown in Figure 9.2, should appear that informs you that the installation
    was successful. If an error occurs, a PHP error or a series of errors appears
    that will help you determine what possibly went wrong.


    # AMFPHP debugging tools


    Before beginning any development, look at some of the debugging and viewing tools
    that ship with AMFPHP. These various tools can be used to debug your services.


    > **CAUTION** Be sure to remove these debugging tools on a live server to minimize
    security concerns.


    # FIGURE 9.2


    Example of the AMFPHP welcome message seen from calling gateway.php from your
    Web browser


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_220_0.png)'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# AMFPHP service browser


    The AMFPHP service browser, as shown in Figure 9.3, is a Flash-based application
    that lets you view individual services and closely examine their methods and properties.
    You can also use the service browser to test new code before you write the ActionScript
    in Flash.


    Using these added debugging tools allows you to more rapidly develop applications
    and test new concepts with less overhead. They also assist in the debugging of
    your code.


    # AMFPHP debug gateway


    The Debug Gateway script that sits in between Flash and the gateway.php file to
    wrap up errors. It is a best practice to use this script when debugging or developing
    locally. The only change in your code is to point to the debuggateway.php file
    instead of the standard gateway.php file.


    ![](img/d9d48cd53eee0fbc1ebc363c322fac2c_221_0.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: "The following are a few important points to keep in mind with using this specialized\
    \ gateway:\n\n+   - Sessions won't work properly.\n+   - cURL must be enabled\
    \ in PHP\n+   - The server will experience a drop in performance.\n+   - It should\
    \ only be used on a development system.\n\n# ## Testing AMFPHP with a custom service\n\
    \nWith AMFPHP properly installed, you can test a very simple service using the\
    \ service browser. Later, you build a small search application in Flash and PHP.\n\
    \nAn AMFPHP service is a standard PHP file that is built in a known order. For\
    \ example, the first part of a service file is the method table, which is used\
    \ to expose the available methods and define the access restrictions of that service.\n\
    \nA method table is a multidimensional array containing each of the methods. This\
    \ sample method table defines the method getDate, which returns the current UNIX\
    \ timestamp from PHP. The method table is located within the constructor of the\
    \ class seen in the next portion of code.\n\n```\n```php\n$this->methodTable =\
    \ array\n(\n    \"getDate\" => array\n    (\n        \"access\" => \"remote\"\
    ,\n        \"description\" => \"Example, returns Unix timestamp\"\n    )\n);\n\
    ```\n```\n\nContinuing with this example, you would create the sample PHP class,\
    \ which will become the AMFPHP service. Here is the sample class, which contains\
    \ one method and the constructor.\n\n```\n```php\n<?php\n\nclass Example\n{\n\n\
    function Example()\n{\n\n$this->methodTable = array\n(\n    \"getDate\" => array\n\
    \    (\n        \"access\" => \"remote\",\n        \"description\" => \"Returns\
    \ the current date.\"\n    )\n```\n```"
  merge: -1
  img_proc: true
- pgno: 223
  md: "```\n);\n}\n\n/**\n * Returns Current Date\n */\nfunction getDate()\n{\n  \
    \  // return current date\n    return \"Current Date: \" . date(\"F j, Y\", time());\n\
    }\n\n?>\n```\n\n**NOTE** The comment above the `getDate` function will be seen\
    \ by the service browser and display it below the method. This is not required,\
    \ but it helps you understand what a service does at a glance.\n\nSave this file\
    \ as `Example.php` in the `/services` directory found in the root of the AMFPHP\
    \ directory.\n\nHere is the location of this file if you install AMFPHP on the\
    \ root of your Web server: `http://localhost/flashservices/services/Example.php`.\n\
    \nNow that this simple service is created you can test it by going to the service\
    \ browser. You will see your new service located in the left-side list along with\
    \ any other services already installed. If you don't see the service, click Refresh\
    \ or reload the page by refreshing your browser.\n\nTo test the service, click\
    \ the name in the left-side list, which loads the service in the Exploring pane\
    \ to the right. The name of the method is located on the Test tab, which in this\
    \ example is named `getDate`.\n\nClick the Call button to run the service. You\
    \ will see the services output in the Results tab located on the bottom of the\
    \ Exploring pane.\n\nThe output of the sample service should be the current date\
    \ in string format, such as.\n\n> \"Current Date: October 5, 2007\"\n\nThe other\
    \ tabs are for viewing the service data, which would be used for debugging and\
    \ overall tracking of your services.\n\nThis example is fairly simple. It has\
    \ no parameters and doesn't create any real code. You can expand on the previous\
    \ service by adding another method, which capitalizes the first letter of each\
    \ word found in the string. The capitalization portion of the code is done using\
    \ a built-in function of PHP called `ucwords`. This function accepts one parameter\
    \ and returns the capitalized string."
  merge: -1
