- pgno: 280
  md: "> **NOTE** When connecting to a database on a live server it is a good idea\
    \ to disable error reporting or at least suppress any connection errors.\n\nHere\
    \ is the original connection file in its entirety:\n\n```\n<?php\n$host = \"localhost\"\
    ;\n$user = \"SQL_USERNAME\";\n$pass = \"SQL_PASSWORD\";\n$database = \"SQL_DB_NAME\"\
    ;\n\n$link = mysql_connect($host, $user, $pass);\nmysql_select_db($database, $link);\n\
    \nunset($host);\nunset($user);\nunset($pass);\nunset($database);\nunset($link);\n\
    \n?>\n\n```\n\n# Creating a database table\n\nAt this point, all of the ActionScript\
    \ and PHP is written. However, if you attempt to test the application it won’t\
    \ run because you haven’t defined the SQL table that will interact with the PHP\
    \ for sending and loading messages.\n\nThe SQL syntax is very easy to follow but\
    \ is important to construct carefully. A poorly built table’s performance will\
    \ suffer more and more as it begins to grow. This SQL creates a flashChat table\
    \ and adds the rows that you use in the PHP. Notice the id row, which is not used\
    \ in the PHP but instead is used internally for indexing and key assignment. Another\
    \ way to think about the ID is the key that unlocks the mystery to where your\
    \ data is located within this big table.\n\nThe rows that you do use in the PHP\
    \ are username, message, and dateAdded. The message row is most important because\
    \ it is set as TEXT, which gives an open-ended length ability. This basically\
    \ means a message can be any length. That row also could have been assigned a\
    \ varchar(), which would force the length to a certain predetermined limit, such\
    \ as:\n\n```\nmessage varchar(150) NOT NULL default ''\n```\n\nThis new definition\
    \ for the message row would force any chat message longer than 150 characters\
    \ to be truncated or ended. Setting it as TEXT is more convenient but has potential\
    \ performance concerns as the database and table grow.\n\n```\nCREATE TABLE flashChat\
    \ (\n    id int(11) not null auto_increment,\n    username varchar(20) NOT NULL\
    \ default '',\n    message text NOT NULL,\n    dateAdded int(11) NOT NULL default\
    \ 0,\n    PRIMARY KEY (id)\n) ENGINE=MyISAM;\n\n```"
