  md: "```\nunset($pass);\nunset($database);\n?>\n```\n\nAfter the database connection\
    \ is set you can continue the development of the monitor.php file.\nThe $action\
    \ is passed along the URL, but needs to be valid in order for the script to know\
    \ which\nstate it should be running in.\n\n```\n$action = (isset($_GET['action']))\
    \ ? $_GET['action'] : \"\";\n```\n\nAssuming the action is valid and the value\
    \ is getsites, which is set up to return a listing of the\nsites that are being\
    \ monitored. The process of retrieving the site list is accomplished using a loop\n\
    that loads the information from the MySQL database. The site list is returned\
    \ to Flash as an XML\nobject defining each of the sites and where they are located.\n\
    \nThe SQL to retrieve the list is set up to load all entries where the active\
    \ value is equal to 1.\n\n```\nSELECT * FROM siteMonitor WHERE active=1\n```\n\
    \nAfter the SQL data is retrieved, it is passed to a while loop, which is responsible\
    \ for grabbing\neach row and building a line of XML defining the site information.\n\
    \n```\n$result = mysql_query(\"SELECT * FROM siteMonitor WHERE\nactive=1\");\n\
    $xml = \"<?xml version=\\\"1.0\\\" ?>\\n\";\n$xml .= \"<sites>\\n\";\nwhile($row\
    \ = mysql_fetch_array($result))\n{\n  ...\n}\n$xml .= \"</sites>\";\n```\n\nThe\
    \ line of XML is built using the $row data, which is passed into the sprint()\
    \ function. The\nsprintf is used to automatically fill in the necessary XML attributes\
    \ using the SQL row data.\n\n```\n$xml .= sprintf(\"\\t<site name=\\\"%s\\\" uri=\\\
    \"%s\\\" />\\n\",\n$row['name'],\n$row['uri']);\n```\n\nNow that the XML data\
    \ is built, it is sent out to the browser and returned to Flash. This is done\
    \ by\nsetting the content-type of the response to text/xml, which is the MIME\
    \ type of XML. Then\nthe last step is to use a print statement to actually output\
    \ the data.\n\n```\nheader(\"Content-type: text/xml\");\nprint $xml;\n```"
