- pgno: 501
  md: "An else option is added to handle the incorrect login attempts by updating\
    \ the response message of the login component.\n\n```\nfunction loginRespHandler(o:Object):void\n\
    {\n\tif(o.response == true)\n\t{\n\t\tlogin.close();\n\t}\n\telse\n\t{\n\t\tlogin.responseString\
    \ = \"username and password incorrect\";\n\t}\n}\n```\n\n# Handling response errors\n\
    \nThe last function required for the login system is the onFault, which handles\
    \ errors in the service calls. For example, if the script managed to attempt a\
    \ login check with no username or password, the SQL would fail. This error will\
    \ be raised by the PHP class and sent back to Flash, assuming it is properly handled.\n\
    \n```\nfunction onFault(responds:Object):void\n{\n\ttrace(\"Debug::Error\");\n\
    \tfor(var i in responds)\n\t{\n\t\ttrace(\" \" + responds[i]);\n\t}\n}\n```\n\n\
    Now that the remoting code has been added to the previous example login component,\
    \ you can test it, and you really shouldn't notice any difference. The only change\
    \ would be the ability to use more than one username, as long as it is found in\
    \ the users table that you created at the beginning of this section.\n\nHere is\
    \ the login component example with the proper remoting code included:\n\n```\n\
    var gateway:NetConnection;\nvar gatewayURL:String = \"http://localhost/amfphp/gateway.php\"\
    ;\n\nvar login:LoginWindow = new LoginWindow();\nlogin.addEventListener(LoginWindow.LOGIN_ATTEMPT,\
