  md: 'At this point, you should have a working PayPal login. Using the account you
    just registered for you can login to PayPal and begin setting up the account specifics.


    > NOTE The system requires a login and password to generate content. However,
    in order to submit a data request you only need to provide your e-mail address.
    This is used to ensure the request is correct. At no time should you place your
    PayPal password in this form.


