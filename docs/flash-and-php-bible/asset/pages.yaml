    upperCaseWordsBtn.addEventListener(MouseEvent.CLICK, upperCaseWords);

    debugTxt.wordWrap = false;

    ```


    Here is the skeleton for the button handlers that will be created in the next
    portion. Each of these functions makes a call to the AMFPHP service.


    ```

    function getDate(e:MouseEvent):void

    {

    ```'
