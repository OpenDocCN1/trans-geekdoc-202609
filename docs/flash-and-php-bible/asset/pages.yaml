- pgno: 352
  md: "# Interfacing with the Web service\n\nThe next step in the photo gallery is\
    \ to build the PHP code that will be responsible for connecting to flickr and\
    \ parsing the XML response.\n\nThe first step is to define the flickr API key\
    \ that is provided from flickr.\n\n```\n```php\n<?php\ndefine(\"FLICKR_ACCESS_KEY\"\
    , \"{FLICKR_API_KEY}\");\n```\n```\n\nFlickr has a partially unique way of building\
    \ image URLs. The easiest way to work with this format is by using the sprintf\
    \ function. This function accepts a string with placeholder variables that are\
    \ then filled in with real values using values provided in the other arguments.\n\
    \n```\n```php\n$flickrURLTemplate= \"http://farm%s.static.flickr.com/\n%s/%s_%s_s.jpg\"\
    ;\n```\n```\n\nTo avoid erroneous requests, a simple if statement is used to make\
    \ sure the tags variable that comes from Flash in fact has a search term. If for\
    \ some reason the variable is empty, the script exits and no more code is run\
    \ from that point.\n\n```\n```php\nif(empty($_GET['tags']))\n{\n\texit();\n}\n\
    ```\n```\n\nIf a valid tag value is found, the next step is to pull in the tag\
    \ data and make the call to flickr to start the search process.\n\n```\n```php\n\
    $apiMethod = \"flickr.photos.search\";\n$request = \"http://api.flickr.com/services/rest/\"\
    \ .\n        \"?method=\" . $apiMethod .\n        \"&tags=\" . $searchTags .\n\
    \        \"&api_key=\" . FLICKR_ACCESS_KEY.\n        \"&per_page=5\";\n\n$rawXml\
    \ = file_get_contents($request);\n```\n```\n\nThe photo service returns an XML\
    \ document that is stored in the $rawXml variable. After the XML is loaded, it\
    \ is passed along to the simplexml_load_string() method, which creates a proper\
    \ object that PHP can then parse.\n\n```\n```php\n$xmlResponse = simplexml_load_string($rawXml);\n\
    ```\n```\n\nHow many images to display are determined by loading the value that\
    \ is located in the XML document.\n\n```\n```php\n$nodeCount = getAttribute($xmlResponse->photos,\
    \ \"perpage\");\n```\n```"
  merge: -1
  img_proc: true
- pgno: 353
  md: "# Building the custom XML document\n\nThe process of building the custom XML\
    \ document is done using a for loop that grabs each photo node and pulls in the\
    \ required information.\n\n```\n$xml = \"<?xml version=\\\"1.0\\\" ?>\\n<photos>\"\
    ;\n\nfor ($i=0; $i < $nodeCount; $i++)\n{\n    $farmID = getAttribute($xmlResponse->photos->photo[$i],\
    \ \"farm\");\n    $serverID=  getAttribute($xmlResponse->photos->photo[$i],\n\
    \    \"server\");\n    $photoID= getAttribute($xmlResponse->photos->photo[$i],\
    \ \"id\");\n    $secret = getAttribute($xmlResponse->photos->photo[$i],\n    \"\
    secret\");\n\n    $xml .= \"\\t<photo>\";\n    $xml .= \"\\t\\t<title><![CDATA[\
    \ \" . getAttribute($xmlResponse-\n>photos->photo[$i], \"title\") . \"]]></title>\"\
    ;\n    $xml .= \"\\t\\t<thumb>\" .\n    sprintf($flickrURLTemplate,\n    $farmID,\n\
    \    $serverID,\n    $photoID,\n    $secret .\n    \"</thumb>\";\n    $xml .=\
    \ \" </photo>\";\n}\n```\n\nThe first part of the loop is for building the image\
    \ path, which is passed into the sprintf function. After the overall XML document\
    \ is created, the last step is to output to the caller, which in this case would\
    \ be Flash.\n\n```\nheader (\"content-type: text/xml\");\nprint $xml;\n```\n\n\
    Now that the PHP is completed and the overall application has been developed,\
    \ you can test it, as shown in Figure 12.5."
