  md: "# Listing 4.26\n\n```\ntype reader interface {\n  read(b []byte) (int, error)\n\
    }\ntype file struct {\n  name string\n}\nfunc (file) read(b []byte) (int, error)\
    \ {\n  s := \"crss<channel><title>Going Go</title></channel></rss\"\n  copy(b,\
    \ s)\n  return len(s), nil\n}\n```\n\nThe code declares a type named file and\
    \ then declares a method named read. Because of these two declarations, I can\
    \ say:\n\n> \"The concrete type file now implements the reader interface using\
    \ value semantics\"\n\nEvery word I just said is important. In Go, all I have\
    \ to declare the full method-set of behavior defined by an interface to implement\
    \ that interface. In this case, that is what I've done since the reader interface\
    \ only declares a single act of behavior named read.\n\n# Listing 4.27\n\n```\n\
    type reader interface {\n  read(b []byte) (int, error)\n}\ntype pipe struct {\n\
    \  name string\n}\nfunc (pipe) read(b []byte) (int, error) {\n  s := `name: \"\
    Bill\", title: \"developer\"\n  copy(b, s)\n  return len(s), nil\n}\n```\n\nThis\
    \ code declares a type named pipe and then declares a method named read. Because\
    \ of these two declarations, I can say the:\n\n> \"The concrete type pipe now\
    \ implements the reader interface using value semantics\"\n\nNow I have two concrete\
    \ types implementing the reader interface. Two concrete types each with their\
    \ unique implementation. One type is reading file systems and the other networks."
