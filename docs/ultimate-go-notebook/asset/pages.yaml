  md: 'impossible. This requires some tradeoffs in the design of the scheduler. Before
    I go any further, it''s important to define some words.


    **Work:** A set of instructions to be executed for a running application. This
    is accomplished by threads and an application can have 1 to many threads.


    **Thread:** A path of execution that is scheduled and performed. Threads are responsible
    for the execution of instructions on the hardware.


    **Thread States:** A thread can be in one of three states: Running, Runnable,
    or Waiting. Running means the thread is executing its assigned instructions on
    the hardware by having a G placed on the M. Runnable means the threads want time
    on the hardware to execute its assigned instructions and is sitting in a queue.
    Waiting means the thread is waiting for something before it can resume its work.
    Waiting threads are not a concern of the scheduler.


    **Concurrency:** This means undefined of order execution. In other words, a set
    of instructions that would be executed in the order provided, they are executed
    in a different order, but all executed. The result of executing the full set of
    instructions in any order produces the result. I will say my work be done concurrently
    when the order work is executed doesn''t matter, as long as all the work is completed.


    **Parallelism:** This means doing a lot of things at once. For this to be an option,
    I need the ability to physically execute two or more operating system threads
    at the same time on the hardware.


    **CPU Bound Work:** This is work that does not cause the thread to naturally move
    into a waiting state. Calculating fibonacci numbers would be considered CPU-Bound
    work.


    **I/O Bound Work:** This is work that does cause the thread to naturally move
    into a waiting state. Fetching data from different URLs would be considered I/O-Bound
    work.


    **Synchronization:** When two or more Goroutines will need to access the same
    memory location at the same time, they need to be synchronized and take turns.
    If this synchronization doesn''t take place, and at least one Goroutine is performing
    a work, I can end up with a data race. Data races are a cause of data corruption
    bugs that can be difficult to find.


    **Orchestration:** When two or more Goroutines need to signal each other, with
    without data, orchestration is the mechanic required. If orchestration does not
    take place, guarantees concurrent work being performed and completed will be'
