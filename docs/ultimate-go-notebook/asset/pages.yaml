- pgno: 318
  md: '![](img/8be06d78925d0d5a2d2ade851e9bad63_318_0.png)


    In figure 19, things context switch once again as the message sent by G2 is received
    by G1. Now G2 context switches from the executing state to the waiting state and
    G1 context switches from the waiting state to the runnable state and finally back
    to the executing state, which allows it to process and send a new message back.


    Things on the surface don''t appear to be any different. All the same context
    switches and state changes are occurring whether you use Threads or Goroutines.
    However, there is a major difference between using Threads and Goroutines that
    might not be obvious at first glance.


    In the case of using Goroutines, the same OS Thread and Core is being used for
    all the processing. This means that, from the OS''s perspective, the OS Thread
    never moves into a waiting state; not once. As a result all those instructions
    were lost to context switches when using Threads are not lost when using Goroutines.


    Essentially, Go has turned I/O-Bound work into CPU-Bound work at the OS level.'
