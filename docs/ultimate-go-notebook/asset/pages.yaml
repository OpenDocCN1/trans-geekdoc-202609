  img_proc: true
- pgno: 164
  md: "```\npackage basic\n\nimport (\n\t\"fmt\"\n\t\"testing\"\n)\n\nvar gs string\n\
    \nfunc BenchmarkSprint(b *testing.B) {\n\tvar s string\n\tfor i := 0; i < b.N;\
    \ i++ {\n\t\ts = fmt.Sprintf(\"hello\")\n\t}\ngs = s\n}\n\nfunc BenchmarkSprintf(b\
    \ *testing.B) {\n\tvar s string\n\tfor i := 0; i < b.N; i++ {\n\t\ts = fmt.Sprintf(\"\
    hello\")\n\t}\ngs = s\n}\n```\n\nThe premise of this benchmark is to know which\
    \ version of Sprint is faster, regular or format version. When people are asked\
    \ to guess, they tend to say the regular version since there is no formatting\
    \ necessary. These people are always wrong.\n\n$ go test -bench -benchtime 3s\
    \ -benchmem\ngoos: darwin\narch: amd64\npkg: github.com/ardanlabs/gotraining/topics/go/testing/benchmarks/basic\n\
    cpu: Intel(R) (TM) i9-9880HK CPU @ 2.40GHz\n\n| | ns/op | B/op | allocs/op |\n\
    |---|---|---|--|\n| BenchmarkSprint-16 | 56965252 | 55.48 ns/op | 5 B/op | 1 allocs/op\
    \ |\n| BenchmarkSprintf-16 | 80984947 | 42.46 ns/op | 5 B/op | 1 allocs/op |\n\
    \nI can see from the results that the format version is faster by 13 nanoseconds\
    \ per operation. The difference is insignificant, but nonetheless, there is a\
    \ difference.\n\nI want to break down both the writing and running of these benchmarks."
