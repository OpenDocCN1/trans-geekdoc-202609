  md: "Listing 4.34\n\n```\ntype user struct {\n    name string\n    email string\n\
    }\n\ntype admin struct {\n    person user // NOT Embedding\n    level string\n\
    }\n```\n\nThis is embedding.\n\nListing 4.35\n\n```\ntype user struct {\n    name\
    \ string\n    email string\n}\n\ntype admin struct {\n    user // Value Semantic\
    \ Embedding\n    level string\n}\n```\n\nThe person field is removed and just\
    \ the type name is left. I can also embed a type using pointer semantics.\n\n\
    Listing 4.36\n\n```\ntype user struct {\n    name string\n    email string\n}\n\
    \ntype admin struct {\n    *user // Pointer Semantic Embedding\n    level string\n\
    }\n```\n\nIn this case, a pointer of the type is embedded. In either case, accessing\
    \ the embedded value is done through the use of the type's name.\n\nThe best way\
    \ to think about embedding is to view the user type as an inner type and admin\
    \ as an outer type. It's this inner/outer type relationship that is magical because\
    \ with embedding, everything related to the inner type (both fields and methods)\
    \ can be promoted up to the outer type."
