    func (c *T) Skipped(bool)

    func (c *T) TempDir() string

    ```


    The.T value provides the API to share with the testing tool if the test passed
    or failed. Two functions exist, t.Fatal and t.Error, which are the most common
    API''s I will use and both indicate if a test failed. The big difference is calling
    t.Fatal will cause the test function to return and calling t.Error will allow
    the test function to continue and report potentially more failures within the
    test function. The t.Log function provides the option for verbose output for those
    who want to share more when a test fails or when the -v option is used when running
    a test.'
