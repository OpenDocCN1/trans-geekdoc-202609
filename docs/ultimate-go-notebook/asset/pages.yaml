    Figure 14


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_313_0.png)


    In figure 14, there are 2 Threads that are passing a message back and forth. Thread
    1 gets context switched on Core 1 and is now executing, which allows Thread 1
    to send its message to Thread 2.


    Note: How the message is being passed is unimportant. What’s important is the
    state of the Threads as this orchestration proceeds.'
