    # 14.1 Stacks And Pointer Mechanics


    # Prelude


    As of version 1.17, Go changed the ABI (application binary interface) to implement
    a new way of passing function input and output arguments using registers instead
    of memory on the stack. This is enabled for Linux, MacOS, and Windows on the 64-bit
    x86 architectures. This means that some function arguments won''t be copied on
    the stack, but some may depending on the viability of using registers. This doesn''t
    change any of the semantics described in this post.


    # Introduction


    I''m not going to sugar coat it, pointers are difficult to comprehend. When used
    incorrectly, pointers can produce nasty bugs and even performance issues. This
    is especially true when writing concurrent or multi-threaded software. It''s no
    wonder so many languages attempt to hide pointers from programmers. However, if
    you''re writing software in Go, there is no way for you to avoid. Without a strong
    understanding of pointers, you will struggle to write clean, simple and efficient
    code.


    # Frame Boundaries


    Functions execute within the scope of frame boundaries that provide an individual
    memory space for each respective function. Each frame allows a function to operate
    within their context. A function has direct access to the memory inside its frame,
    through the frame pointer, but access to memory outside of its frame requires
    indirect access. For a function to access memory outside of its frame, that memory
    must be shared with the function. The mechanics and restrictions established by
    these frame boundaries need to be understood and learned first.


    When a function is called, there is a transition that takes place between two
    frames. The code transitions out of the calling function''s frame and into the
    called function''s frame. If data is required to make the function call, then
    that data must be transferred from one frame to the other. The passing of data
    between two frames is done "by value" in Go.


    The benefit of passing data "by value" is readability. The value you see in the
    function call is what is copied and received on the other side. It''s why I relate
    "pass'
