  md: '# Figure 8


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_309_0.png)


    In figure 8, the blocking system call that was made by Goroutine-1 finishes. At
    this point, Goroutine-1 can now move back into the LRQ and be serviced by the
    P again. M1 is then placed on the side for future use if this scenario needs to
