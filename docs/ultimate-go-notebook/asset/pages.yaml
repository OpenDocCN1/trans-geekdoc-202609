    rl := utf8.RuneLen(r)

    ```


    The RuneLen function returns the number of bytes required to store the rune value.
    For the first two iterations, rl will equal 3.


    # Listing 3.35


    ```

    si := i + rl

    copy(buf[:], s[i:si])

    ```


    The si represents the index position for the slice operation to slice the bytes
    associated with the rune. Then the built-in function copy is used to copy the
    bytes for the rune into the array. Notice how an array can be sliced. This proves
    that every array in Go is just a slice waiting to happen.


    # Listing 3.36


    ```

    fmt.Printf("%2d: %q; codepoint: %#6x; encoded bytes: %%#v\n",

