  md: '![](img/8be06d78925d0d5a2d2ade851e9bad63_348_0.png)


    Figure 16 shows how the application is only using 75% of its CPU capacity application
    work. This is because the collector has dedicated P1 for itself. This is true
    for the majority of the collection.


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_348_1.png)


    Figure 17 shows how the application in this moment of time (typically for just
    a few microseconds) is now only using half of its CPU capacity for application
    work. This is because the Goroutine on P3 is performing a Mark Assist and the
    collector has dedicated P1 for itself.


    Note: Marking usually takes 4 CPU-milliseconds per MB of live heap (e.g., to estimate
    how many milliseconds the Marking phase will run for, take the live heap size
    in MB and divide by 0.25 * the number of CPUs). Marking actually runs at about
    1 MB/ms, but only has a quarter of the CPUs.


    The second latency that is inflicted is the amount of STW latency that occurs
    during the collection. The STW time is when no application Goroutines are performing
    any of their application work. The application is essentially stopped.'
