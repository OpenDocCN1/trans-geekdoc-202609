    the program to, which is 5 meg. Since there are only 16 Goroutines during the
    work, the GC was able to keep the memory small, but at the cost of performance.


    Would the performance change if I told the GC it''s ok for the program to use
    50 meg of memory? This is the amount of memory the fan-out algorithm uses.


    # 12.9 GC Percentage


    There is a knob I can use to ask the GC to use more memory. This is the GC percentage
    knob. I can access this knob in two ways, first with the GOGC environment variable
    and second with the debug package in the standard library.


    The default value for this knob is 100, which represents two important things.
    First, that the GC should start when 4 meg of memory is in-use on the heap. Second,
    that the next GC should start when 100% more memory is allocated on the heap,
    based on the result of the marked live value from the previous GC.


    Since the GC is keeping the memory at roughly 4 meg, I need to get the GC to not
    start the first collection until the memory in-use reaches 40 meg. To do this,
    I need to change the GOGC value by an order of magnitude, which is 1000.'
