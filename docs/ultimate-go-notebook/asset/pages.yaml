  md: 'see the majority of the running Goroutines perform small amounts of Mark Assist
    during collections.


    One goal of the collector is to eliminate the need for Mark Assists. If any given
    collection ends up requiring a lot of Mark Assist, the collector can start the
    next garbage collection earlier. This is done in an attempt to reduce the amount
    of Mark Assist that will be necessary on the next collection.


    # Mark Termination - STW


    Once the Marking work is done, the next phase is Mark Termination. This is when
    the Write Barrier is turned off, very clean up tasks are performed, and the next
    collection goal is calculated. Goroutines (in versions of Go prior to 1.14) that
    find themselves in a tight loop during the Marking phase can also cause Mark Termination
    STW latencies to be extended.


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_338_0.png)


    Figure 5 shows how all the Goroutines are stopped while the Mark Termination phase
    completes. This phase could be done without a STW, but by using a STW, the code
    is simpler and the added complexity is not worth the small gain.


    Once the collection is finished, every P can be used by the application Goroutines
    again and the application is back to full throttle.


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_338_1.png)


    Figure 6 shows how all of the available P’s are now processing application work'
