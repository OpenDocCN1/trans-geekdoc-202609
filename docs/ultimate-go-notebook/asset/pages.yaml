  md: '# Chapter 6: Concurrency


    In this chapter, I will learn about the mechanics and semantics behind writing
    multithreaded code in Go. I will learn what concurrency is and how to apply it
    safely by understanding the concepts of synchronization and orchestration.


    # 6.1 Scheduler Semantics


    When a Go program starts up, the Go runtime asks the machine (virtual or physical)
    how many operating system threads can run in parallel. This is based on the number
    of cores that are available to the program. For each thread that can be run in
    parallel, the runtime creates an operating system thread (M) and attaches to a
    data structure that represents a logical processor (P) inside the program. This
    P and M represent the compute power or execution context for running the Go program.


    Also, an initial Goroutine (G) is created to manage the execution of instructions
    on a selected M/P. Just like an M manages the execution of instructions on the
    hardware, a G manages the execution of instructions on the M. This creates a new
    layer of abstraction above the operating system, but it moves execution control
    to the application level.


    Figure 6.1


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_119_0.png)


    Since the Go scheduler sits on top of the operating system scheduler, it''s important
    to have some semantic understanding of the operating system scheduler and the
    constraints it applies to the Go scheduler and applications.


    The operating system scheduler has the job of creating the illusions that multiple
    pieces of work are being executed at the same time. Even when this is physically'
