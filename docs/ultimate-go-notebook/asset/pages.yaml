- pgno: 347
  md: 'important when running in cloud environments.


    Figure 15


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_347_0.png)


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_347_1.png)


    15 shows some statistics of a running Go application. The version in blue shows
    stats for the application without any optimizations when 10k requests are processed
    through the application. The version in green shows stats after 4.48GB of non-productive
    memory allocations were found and removed from the application for the same 10k
    requests.


    Look at the average pace of collection for both versions (2.08ms vs 1.96ms). They
    are virtually the same, at around ~2.0ms. What fundamentally changed between these
    two versions is the amount of work that is getting done between each collection.
    The application went from processing 3.98 to 7.13 requests per collection. That
    is a 79.1% increase in the amount of work getting done at the same pace. As you
    can see, the collection did not slow down with the reduction of those allocations,
    but remained the same. The win came from getting more work done between collection.


    Adjusting the pace of collection to delay the latency cost is not how you improve
    the performance of your application. It''s about reducing the amount of time the
    collector needs to run, which in turn will reduce the amount of latency cost being
    inflicted. The latency costs inflicted by the collector have been explained, but
    let me summarize it again for clarity.


    # Collector Latency Costs


    There are two types of latencies every collection inflicts on your running application.
    The first is the stealing of CPU capacity. The effect of this stolen CPU capacity
    means your application is not running at full throttle during the collection.
    The application Goroutines are now sharing P''s with the collector''s Goroutines
    or helping with the collection (Mark Assist).'
