    # Listing 2.1


    | Type | Zero Value |

    |---|---|

    | Boolean | false |

    | Integer | 0 |

    | Float | 0 |

    | Complex | 0 |

    | String | "" (empty) |

    | Pointer | nil |


    # 2.4 Declare and Initialize


    The keyword var can be used to construct values to their zero value state for
    all types.


    # Listing 2.2


    ```

    var a int

    var b string

    var c float64

    var d bool


    fmt.Printf("var int %t %%[v]\n\n", a, a)

    fmt.Printf("var string %t %%[v]\n\n", b, b)

    fmt.Printf("var float64 %t %%[v]\n\n", c, c)

    fmt.Printf("var bool %t %%[v]\n\n", d, d)


    Output:

    var a int     int [0]

    var b string string[]

    var c float64 float64 [0]

    var d bool    bool [false]

    ```


    Strings use the UTF8 character set, but are really just a collection of bytes.


    A string is a two-word internal data structure in:


    +   - The first word represents a pointer to a backing array of bytes

    - The second word represents the length or the number of bytes in the backing
    array

    - If the string is set to its zero value state, the first word is nil and the
    second word is 0.


    Using the short variable declaration operator, I can declare, construct, and initialize
    a value all at the same time.'
