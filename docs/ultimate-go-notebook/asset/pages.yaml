  md: 'examples both good and bad to facilitate learning. But how many programmers
    learn to write programs by reading programs?" - Gerald M. Weinberg"


    +   - Skill develops when we produce


    # 1.2 Legacy Software


    Do I care about the legacy I''m leaving behind


    # Quotes


    +   - "There are two kinds of software projects: those that fail, and those that
    turn into legacy horrors." - Peter Weinberger (inventor of AWK)


    +   - "Legacy software is an unappreciated but serious problem. Legacy code may
    be the downfall of our civilization." - Chuck Moore (inventor of Forth)


    +   - "Few programmers of any experience would contradict the assertion that most
    programs are modified in their lifetime. Why do we rarely find a program that
    contains any evidence of having been written with an eye to subsequent modification."
    - Gerald M. Weinberg


    +   - "We think awful code is written by awful devs. But in reality, it''s written
    by reasonable devs in awful circumstances." - Sarah Mei


    +   - "There are many reasons why programs are built the way they are, although
    we may fail to recognize the multiplicity of reasons because we usually look at
    code from the outside rather than by reading it. When we read code, we find that
    some of it gets written because of machine limitations, some because of language
    limitations, some because of programmer limitations, some because of historical
    accidents, and some because of specifications—both essential and inessential."
    - Gerald M. Weinberg


    # 1.3 Mental Models


    I constantly make sure my mental model of the code I''m writing and maintaining
    is clear. When I can''t remember where a piece of logic is or I can''t remember
    how something works, I losing my mental model of the code. This is a clear indication
    that I need to refactor the code. Focus structuring code that provides the best
    mental model possible and during code reviews validate my mental models are still
    intact.


    How much code do I think I can maintain in my head? Being asking a developer to
    maintain a mental model of more than one ream of code paper (~10k lines of code)
    is asking a lot. If I do the math, it takes 100 people to work on a code base
    that hits a million lines of code. That''s 100 people that need to be coordinated,
    grouped, tracked and in a constant feedback loop of communication.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Quotes


    +   - "Let''s imagine a project that''s going to end up with a million lines of
    code or more. The probability of those projects being successful in the United
    States these days is very low, well under 50%. That''s debatable." - Tom Love
    (inventor of Objective C)


    +   - "100k lines of code fit inside a box of paper." - Tom Love (inventor of
    Objective C)


    +   - "One of our problems with thinking is "cognitive load": the number of things
    we can pay attention to once. The cliche is 7±2, but for many things it is even
    less. We make progress by making those few things more powerful." - Alan Kay


    +   - "The hardest bugs are where your mental model of the situation is just wrong,
    so you can''t see the problem at all." - Brian Kernighan


    +   - "Everyone knows that debugging is twice as hard as writing a program in
    the first place. So if you''re as clever as you can be when you write it, how
    will you debug debug" - Brian Kernighan


    +   - "Debuggers don''t remove bugs. They only show them in slow motion." - Unknown


    +   - "Fixing bugs is just a side effect. Debuggers are for exploration." - @Deech
    (Twitter)


    # Reading


    +   - The Magical Number Seven, Plus or Minus Two - Wikipedia


    +   - Psychology of Code Readability - Egon Elbre


    # 1.4 Productivity vs Performance


    Productivity and performance both matter, but in the past I couldn''t have both.
    I needed to choose over the other. We naturally gravitated to productivity, with
    the idea or hope that hardware would resolve our problems for free. This movement
    towards productivity has resulted in the design of programming languages that
    is outacing the hardware’s ability to make them faster.


    By Following Go idioms and a few guidelines, I can write code that be reasoned
    about by average developers. I can write software that simplifies, minimizes and
    reduces the amount of code we need to solve the problems we are working on. I
    don''t have to choose productivity over performance or performance anymore. I
    can have both.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Quotes


    +   - "The hope is that the progress in hardware will cure all software ills.
    However, a critical observer may observe that software manages to outgrow hardware
    in size and sluggishness. Other observers had noted this for some time before,
    indeed the trend became as obvious as in 1987." - Niklas Wirth


    +   - "The most amazing achievement of the computer software industry is its continuing
    cancellation of the steady and staggering gains made by the computer hardware
    industry." - Henry Petroski (2015)


    +   - "The hardware forks will not put more cores into hardware if the software
    is not going to use them, so is this balancing act of each other staring at each
    other, and we are hoping that Go is going to break through the software side."
    - Rick Hudson (2015)


    +   - "C is the best balance I''ve ever seen between power and expressiveness.
    You can do anything you want to do by programming straightforward and you will
    have a very good mental model of what''s happening on the machine; you can predict
    reasonably well how quickly it''s going to run, you understand what''s going on."
    - Brian Kernighan (2000)


    +   - "The trend in programming language design has been to create languages that
    enhance software reliability and programmer productivity. What we should is develop
    languages alongside sound software engineering practices so the task of developing
    reliable programs is distributed throughout the software lifecycle, especially
    in the early phases of system design." - Al Aho (2009)


    # 1.5 Correctness vs Performance


    I want to write code that is optimized for correctness. Don''t make coding decisions
    based on what I think perform better. I must benchmark or profile to know if code
    is not fast enough. Then and only then should I optimize for performance. This
    can''t be until I have something working.


    Improvement comes from writing code and thinking about the code I. Then refactoring
    the code to make it better requires the help of other people to read the code
    I''m writing. Prototype ideas first to validate them. Try different approaches
    or ask others to attempt a solution. Then compare what I have learned.


    Too many developers are not prototyping their ideas before writing code. Is through
    prototyping I can validate my thoughts, ideas and designs. This is the time when
    I can break down walls and figure out how things works. Prototype in the concrete
    and consider contracts after I have a working prototype.


    Refactoring must become part of the development cycle. Refactoring is the process'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'of improving the code from the things I learn on a daily basis. Without time
    to refactor, code will become impossible to manage and maintain over time. This
    creates the legacy issues we are seeing today.


    # Quotes


    +   - "Make it correct, make it clear, make it concise, make it fast. In that
    order." - Wes Dyer

    - "Make it work, then make it beautiful, then if you really, really have to, make
    it fast. 90 percent of the time, if you make it beautiful, it will already be
    fast. So really just make it beautiful! - Joe Armstrong

    - "Good engineering is less about finding the "perfect" solution and more about
    understanding the tradeoffs and being able to explain them." - JBD

    - "Choosing the right limitations for a certain problem domain is often much more
    powerful than allowing anything." - Jason Moiron

    - "The correctness of the implementation is the most important concern, but there
    is no royal road to correctness. It involves diverse tasks such as thinking of
    invariants, testing and code reviews. Optimization should be done, but not prematurely."
    - Al Acho (inventor of AWK)

    - "The basic ideas of good style, which are fundamental to write clearly and simply,
    are just as important now as they were 35 years ago. Simple, straightforward code
    is plain easier to work with and less likely to have problems. As programs get
    bigger and more complicated, it''s even more important to clean, simple code."
    - Brian Kernigh

    - "Problems can usually be solved with simple, mundane solutions. That means there''s
    no glamorous work. You don''t have to show off your amazing skills. You just build
    something that gets the job done and then move on. This approach may not earn
    you ohs and aahs, but it lets you get on with it." - Jason Fried


    # Reading


    +   - Prototype your design! - Robert Griesmerer


    # 1.6 Understanding Rules


    What should I understand about rules?


    +   - Rules have costs.

    - Rules must pull their weight - Don''t be clever (high level).

    - Value the standard, don''t idolize it.

    - Be consistent!

    - Semantics convey ownership.'
