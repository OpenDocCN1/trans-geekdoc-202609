  md: '![](img/8be06d78925d0d5a2d2ade851e9bad63_314_0.png)


    In figure 15, once Thread 1 finishes sending the message, it now needs to wait
    for the response. This will cause Thread 1 to be context switched off Core 1 and
    moved into a waiting state. Once Thread 2 is notified about the message, it moves
    into a runnable state. Now the OS can perform a context switch and get Thread
    2 executing on a Core, which happens to be Core 2. Next, Thread 2 processes the
    message and sends a new message back to Thread 1.'
  merge: -1
