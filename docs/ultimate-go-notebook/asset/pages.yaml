    Figure 2


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_336_0.png)


    Figure 2 shows a real problem. The collection can''t start until the Goroutine
    running on P4 is stopped and that can''t happen because it''s in a tight loop
