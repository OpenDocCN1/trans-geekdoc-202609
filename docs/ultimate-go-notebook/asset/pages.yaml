  md: "# Listing 4.45\n\n```\npackage main\n\nimport (\n    \"fmt\"\n\n    \"github.com/ardanlabs/.../exporting/example3/counters\"\
    \n)\n\nfunc main() {\n    counter := counters.New(10)\n    fmt.Printf(\"Counter:\
    \ %d\\n\", counter)\n}\n```\n\nIn this case, the main function in package main\
