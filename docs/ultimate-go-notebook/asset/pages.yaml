- pgno: 3
  md: '# Welcome


    Back in August 2019, Hoanh started a project in Github called the Ultimate Go
    Study Guide. It was a collection of notes he took after taking the Ultimate Go
    class. Surprisingly, it got a lot of attention and eventually had more stars and
    activity than the actual repo for the class. This shows the power of open sourcing
    material.


    Then Hoanh decided to publish a book from his notes and repo. When I saw what
    Hoanh had written and the excitement his followers had, I reached out to him.
    We decided I would review and refactor his original work and we would publish
    a book together. This is the book and it represents the notes I would like any
    student to make while taking the class.


    I want to thank everyone in the Go community for their support and help over the
    years in creating this material. When I started learning Go in March 2013, I didn''t
    have any idea I would be able to accumulate all this knowledge and share it with
    all of you. Learning is a journey that takes time and effort. If this material
    can help jump start your learning about Go, then the time and effort was worth
    every minute.


    Thanks,

    -- Bill Kennedy'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# Intended Audience


    This notebook has been written and designed to provide a reference to everything
    that I say in the Ultimate Go class. It''s not necessarily a beginner’s Go book
    since it doesn''t focus on the specifics of Go’s syntax. I would recommend the
    Go In Action book I wrote back in 2015 for that type of content. It''s still accurate
    and relevant.


    Many of the things I say in the classroom over the 20 plus hours of instruction
    have been incorporated. I''ve tried to capture all the guidelines, design philosophy,
    white-boarding, and notes I share at the same moments I share them. If you have
    taken the class before, I believe this notebook will be invaluable for reminders
    on the content.


    If you have never taken the class, I still believe there is value in this book.
    It covers more advanced topics not found in other books today. I''ve tried to
    provide a well rounded curriculum of topics from types to profiling. I have also
    been able to provide examples for writing generic function and types in Go, which
    will be available in version 1.18 of Go.


    The book is written in the first person to drive home the idea that this is my
    book of notes from the Ultimate Go class. The first chapter provides a set of
    design philosophies, quotes, and extra reading to help prepare your mind for the
    material. Chapters 2-13 provide the core content from the class. Chapter 14 provides
    a reediting of important blog posts I''ve written in the past. These posts are
    presented here to enhance some of the more technical chapters like garbage collection
    and concurrency.


    If you are struggling with this book, please provide me any feedback over email
    at bill@ardanlabs.com. I will always do my best to correct and teach anything
    that is not obvious or clear.


    Thanks,

    -- Bill Kennedy'
  merge: -1
  img_proc: true
