    \ on what we do and not who we are.\n* Interfaces help me decouple itself from\
    \ change.\n    * I must do my best to understand what could change and use interfaces\
    \ to decouple.\n    * Interfaces with more than one method have more than one\
    \ reason to change.\n    * Uncertainty about change is not a license to guess\
    \ but a directive to STOP and learn more.\n* I must distinguish between code that:\n\
