- pgno: 222
  md: 'some stats about how much work the garbage collector is performing.


    # 11.2 Generating a GC Trace


    Before I run load through the program, I want to look at an initial GC trace that
    is produced from the first search. This is when the feeds are downloaded for the
    first time. To see a GC trace, I need to use the GODEBUG environment variable
    when running the project.


    Listing 11.3


    ```

    $ GODEBUG=gtrace=1 ./project > /dev/null

    ```


    The GODEBUG variable has several different options, but this is how I can ask
    the Go to write a trace to steer the GC runs. Since I don''t want my logs to compete
    with the trace output, I''m writing anything being sent to stdout to the /dev/null
    device.


    If I restart the program using these options and the search button again, I will
    see 4 GC''s take place.


    Listing 11.4


    ```

    gc 1 95.456s 0%: 0.042+0.54+0.026 ms clock, 0.67+0.32/0.73/0.29+0.43 ms cpu, 4->4->0
    MB, 5 MB goal, 16 P

    gc 2 95.635s 0%: 0.031+0.39+0.029 ms clock, 0.51+0.24/0.80/0.68+0.47 ms cpu, 4->4->1
    MB, 5 MB goal, 16 P

    gc 3 95.707s 0%: 0.047+0.40+0.012 ms clock, 0.76+0.072/0.92/1.0+0.20 ms cpu, 4->4->1
    MB, 5 MB goal, 16 P

    gc 4 95.976s 0%: 0.048+0.47+0.016 ms clock, 0.78+0.13/1.0/1.3+0.25 ms cpu, 4->4->2
    MB, 5 MB goal, 16 P

    ```


    Seeing 4 GC''s makes sense since the GC will initially run when the first 4 meg
    of memory is allocated on the heap. Since the program is downloading and caching
    the feeds, the other 3 GC''s happen quickly as the GC tries to keep the heap at
    4 meg.


    Here is a breakdown of the 4th GC that took place.'
