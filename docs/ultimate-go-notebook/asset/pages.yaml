- pgno: 322
  md: 'Goroutines are not moving in and out of waiting states as part of their workload.
    Having more Goroutines than there are OS/hardware threads can slow down workload
    execution because of the latency cost (the time it takes) of moving Goroutines
    on and off the OS thread. The context switch is creating a “Stop The World” event
    for your workload none of your workload is being executed during the switch when
    it otherwise could be.


    With I/O-Bound workloads you don''t need parallelism to use concurrency. A single
    OS/hardware thread can handle multiple Goroutines with efficiency the Goroutines
    are naturally moving in and out of waiting states as part of their workload. Having
    more Goroutines than there are OS/hardware threads can speed up workload execution
    because the latency cost of moving Goroutines on and off the OS thread is not
    creating a “Stop The World” event. Your workload is naturally stopped and this
    allows a different Goroutine to leverage the same OS/hardware thread efficiently
    instead of letting the OS/hardware thread sit idle.


    How do you know many Goroutines per hardware provides the best throughput? Too
    few Goroutines and you have more idle time. Too many Goroutines and you have more
    context latency time. This is something for you to think about but beyond the
    scope of this particular post.


    For now it''s important to review some code to solidify your ability to identify
    when a workload can leverage concurrency, when it can''t,and parallelism is needed
    or not.


