  md: "# Chapter 12: Tracing\n\nIn this chapter, I will be learning how to capture\
    \ a trace of a running program and view it with the trace tool. In this exercise,\
    \ I will be generating a trace using the standard library. However a trace also\
    \ can be generated when running a benchmark or by using the debug/pprof endpoint.\n\
    \n# 12.1 Example Code\n\nI have a program that counts the frequency topic is found\
    \ in a collection of RSS news feed documents. This program uses a single threaded\
    \ algorithm that iterates over the collection, processing each document one at\
    \ a time, and returns the number of times the topic is found.\n\n```\nfunc freq(topic\
    \ string, docs []string) int {\ntvar found int\n\n\tfor, doc := range docs {\n\
    \tfile := fmt.Sprintf(\"%s.xml\", doc[:8])\n\tf, err := os.Open(file, os.O_RDONLY,\
    \ 0)\n\tif err != nil {\n\t\tlog.Printf(\"Opening Document [%s] : ERROR : %v\"\
    , doc, err)\n\t\treturn 0\n\t}\n\n\n\tdata, err := io.ReadAll(f)\n\tf.Close()\n\
    \tif err != nil {\n\t\tlog.Printf(\"Reading Document [%s] : ERROR : %v\", doc,\
    \ err)\n\t\treturn 0\n\t}\n\n\tvar d document\n\tif err := xml.Unmarshal(data,\
    \ &d); err != nil {\n\t\tlog.Printf(\"Decoding Document [%s] : ERROR : %v\", doc,\
    \ err)\n\t\treturn 0\n\t}\n\n\tfor _, item := range d.Channel.Items {\n\t\tif\
    \ strings.Contains(item.Title, topic) {\n\t\t\tfound++\n\t\t\tcontinue\n\t\t}\n\
    \t\tif strings.Contains(item.Description, topic) {\n\t\t\tfound++\n\t\t}\n\t}\n\
    \n\return found\n```\n\nThe freq function breaks the work down into four stages:\
    \ opening, reading, unmarshaling, and search. To test the freq function, the main\
    \ function constructs"
