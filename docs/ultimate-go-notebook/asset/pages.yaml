- pgno: 299
  md: "# False Sharing\n\nSuppose Core 0 accesses A and Core 1 accesses A+1.\n\n+\
    \   - Independent pieces of memory; concurrent access is safe.\n- But A and A+1\
    \ probably map to the same cache line.\n- If so, Core 0's writes to A invalidates\
    \ A+1's cache line in Core 1.\n  - And vice versa.\n  - This is false sharing.\n\
    \n![](img/8be06d78925d0d5a2d2ade851e9bad63_299_0.png)\n\nIf one Thread on a given\
    \ core makes a change to its copy of the cache line, then through the magic of\
    \ Thread all other copies of the same cache line have to be marked dirty. When\
    \ a Thread attempts to read or write access to a dirty cache line, main memory\
    \ access (~100 to ~300 clock cycles) is required to get a new copy of the cache\
    \ line.\n\nMaybe on a 2-core processor this isn't a big deal, but what about a\
    \ 32-core processor running 32 threads in parallel all accessing and mutating\
    \ data on the same cache line? What about a system with two physical processors\
    \ with 16 cores each? This is going to be worse because of the added latency for\
    \ processor-to-processor communication. The application is going to be thrashing\
    \ through memory and the performance is going to be horrible, and most likely,\
    \ you will have no understanding why.\n\nThis is called the cache-coherency problem\
    \ and also introduces problems like false sharing. When writing multithreaded\
    \ applications that will be mutating shared state, the caching systems have to\
    \ be taken into account."
