- pgno: 162
  md: "table test example. Look for the LOOK HERE comments. The very first line of\
    \ code inside the loop is creating a new variable test that has local scope to\
    \ the loop. This is being done to prevent closure bungs since the next line of\
    \ code creates a literal test function. I must make sure each literal test function\
    \ has its own copy of the test data it will operate on.\n\nThen a literal function\
    \ is declared and assigned to the tf variable. This function is passed to the\
    \ call to t.Run at the bottom of the loop. The call to t.Run is how the sub-test\
    \ is registered by name. Once all the test functions are registered, they can\
    \ be executed all together or specified individually on the command line.\n\n\
    # Listing 7.14\n\n```\n$ go test -v\n$ go test -run TestDownload/ok -v\n$ go test\
    \ -run TestDownload/notfound -v\n```\n\nThis is how I can run all sub-tests or\
    \ specify any individual sub-test. There is one other cool feature with sub-tests.\
    \ I can run all the tests in parallel using the t.Parallel method.\n\n# Listing\
    \ 7.15\n\n```\nfor _, tt := range tt {\n  test := tt\n  tf := func(t *testing.T)\
    \ {\n    t.Parallel()        <- LOOK HERE\n    .\\.\n  }\n  t.Run(test.name, tf)\n\
    }\n```\n\nBy adding the call to t.Parallel() as the first line of code in the\
    \ literal test function, the testing tool will run all the registered test functions\
    \ in parallel, speeding up test execution time."
