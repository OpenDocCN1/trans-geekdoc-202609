  md: '![](img/8be06d78925d0d5a2d2ade851e9bad63_303_0.png)


    # Cooperating Scheduler


    As we discussed in the first post, the OS scheduler is a preemptive scheduler.
    Essentially this means you can''t predict what the scheduler is going to do at
    any given time. The kernel is making decisions and everything is non-deterministic.
    Applications that run on top of the OS have no control over what is happening
    inside the kernel with scheduling unless they leverage synchronization primitives
    like atomic instructions and mutex cells.


    https://en.wikipedia.org/wiki/Linearizability

    https://en.wikipedia.org/wiki/Lock_(computer_science)


    The Go scheduler is part of the Go runtime, and the Go runtime is built into your
    application. This means the Go scheduler runs in user space, above the kernel.


    https://en.wikipedia.org/wiki/User_space


    The current implementation of the Go scheduler is a preemptive scheduler.


    https://en.wikipedia.org/wiki/Preemption_(computing)


    You can''t predict what the Go scheduler is going to do. This is because decision
    making for this scheduler does not rest in the hands of developers, and in the
    Go runtime. It''s important to understand the scheduler is non-deterministic.


    # Goroutine States


    Just like Threads, Goroutines have the same three high-level states. These dictate
    the role the Go scheduler takes with any given Goroutine. A Goroutine can be in
    one'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'of three states: Waiting, Runable or Running.


    **Waiting**: This means the Goroutine is stopped and waiting for something in
    order to continue. This could be for reasons like waiting for the operating system
    (system calls) or synchronization calls (atomic and mutex operations). These types
    of latencies are a root cause for bad performance.


    **Runable**: This means the Goroutine wants time on an M so it can execute its
    assigned instructions. If you have a lot of Goroutines that want time, then Goroutines
    have to wait longer to get time. Also, the individual amount of time any given
    Goroutine gets shortened as more Goroutines compete for time. This type of scheduling
    latency can also be a cause of bad performance.


    **Running**: This means the Goroutine has been placed on an M and is executing
    its instructions. The work related to the application is getting done. This is
    what everyone waits.


    # Context Switching


    The Go scheduler requires well-defined user-space events that occur at safe points
    in the code to context switch. These events and safe points manifest themselves
    within function calls or in between instructions.


    There are several classes of events that occur in your Go programs that allow
    the scheduler to make scheduling decisions. This doesn''t mean it will always
    happen on one of these events. It means the scheduler gets the opportunity.


    These events are:


    +   * The use of the keyword go

    * Garbage collection

    * System calls

    * Synchronization and Orchestration


    # The use of the keyword go


    The keyword go is how you create Goroutines. Once a new Goroutine is created,
    gives the scheduler an opportunity to make a scheduling decision.


    # Garbage collection


    Since the GC runs using its own set of Goroutines, those Goroutines need time
    on an M to run. This causes the GC to create a lot of scheduling chaos. However,
    the scheduler is very smart about what a Goroutine is doing and will leverage
    that'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'intelligence to make smart decisions. One smart decision is context switching
    a Goroutine that wants to touch the heap with those that don''t touch the heap.
    When GC is running, a lot of scheduling decisions are being made.


    # System calls


    If a Goroutine makes a system call that will cause the Goroutine to block the
    M, sometimes the scheduler is capable of context switching the Goroutine off the
    M and context-switch a new Goroutine onto that same M. However, sometimes a new
    M is required to keep executing Goroutines that are queued up in the P. How this
    works will be explained in more detail in the next section.


    # Synchronization and Orchestration


    If an atomic, mutex, or channel operation will cause the Goroutine to block, the
    scheduler can context-switch a new Goroutine to run. Once the Goroutine run again,
    it can be re-queued and eventually context-switched back on an M.


    # Asynchronous System Calls


    When the OS you are running on has the ability to handle a system call asynchronously,
    something called the network poller can be used to process the system call more
    efficiently. This is accomplished by using kqueue (MacOS), epoll (Linux) or iocp
    (Windows) within these respective OS’s.


    https://golang.org/src/runtime/netpollo


    Networking-based system calls can be processed asynchronously by many of the OSs
    we use today. This is where the network poller gets its name, since its primary
    use is handling networking operations. By using the network poller for networking
    system calls, the scheduler can prevent Goroutines from blocking the M when those
    system calls are made. This helps to keep the M available to execute other Goroutines
    in the P’s LRQ without the need to create new Ms. This helps to reduce scheduling
    load on the OS.


    The best way to see how this works is to run through an example.'
  merge: -1
  img_proc: true
