  md: "# Listing 9.10\n\n```\ntype list[T any] struct {\n    first *node[T]\n    last\
    \  *node[T]\n}\n```\n\nThe second struct type is named list and represents a collection\
    \ of nodes by pointing to T and first and last node in a list. These fields need\
    \ to point to a node of some type T, just like the next and prev fields from the\
    \ node type.\n\nOnce again, the identifier T is defined as a generic type (to\
    \ be determined later) that can be substituted for \"any\" concrete type. Then\
    \ the first and last fields are declared as pointers to a node of some type T\
    \ using the square bracket syntax.\n\n# Listing 9.11\n\n```\nfunc (l *list[T])\
    \ add(data T) *node[T] {\n    n := &node[T]{\n        data: data,\n        prev:\
    \ l.last,\n    }\n    if l.first == nil {\n        l.first = &n\n        l.last\
    \ = &n\n        return &n\n    }\n    l.last.next = &n\n    l.last = &n\n    return\
    \ &n\n}\n```\n\nThis is an implementation of a method added for the list type.\
    \ No formal generic list declaration is required (as with functions) since the\
    \ method is bound to the list through the receiver. The add method's receiver\
    \ is declared as a pointer to a list of some type T and the return is declared\
    \ as a pointer to a node of the same type T.\n\nThe code after the construction\
    \ of a node will always be the same, regardless of what type of data is being\
    \ stored in the list since that is just pointer manipulation. It's only the construction\
    \ of a new node that is affected by the type of data that will be managed. Thanks\
    \ to generics, the construction of a node can be bound to type T which gets substituted\
    \ later at compile time.\n\nWithout generics, this entire method would need to\
    \ be duplicated since the construction of a node would be hardcoded to a known,\
    \ declared type prior to compilation. Since the amount of code (for the entire\
    \ list implementation) that needs to change for different data types is very small,\
    \ being able to declare a node and list to manage data of some type T reduces\
    \ the cost of code duplication and maintenance."
