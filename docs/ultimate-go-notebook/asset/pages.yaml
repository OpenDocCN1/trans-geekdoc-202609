  md: '# Chapter 9: Generics


    In this chapter I will learn about the new syntax coming to Go 1.18 for writing
    generic functions and types. Generics in this first release is about providing
    the ability to write concrete polymorphic functions with the support of type parameter
    lists.


    This functionality (defined by the generics spec) will be represented in the first
    release of generics.


    +   - Functions can have an additional type parameter list that uses square brackets
    but otherwise looks like an ordinary parameter list: func F[T any](p T) { ...
    }

    - Type parameters can be used by the regular parameters and in the function body.

    - Types can also have a type parameter list: M[T any] []

    - Each type parameter has a type constraint, just as each ordinary parameter has:
    func F[T Constraint](p T) { ... }

    - Type constraints are interface types.

    - The new declared name any is a type constraint that permits any.

    - Interface types used as type constraints can have a list of declared types;
    only type arguments that match one of those types satisfy the constraint.

    - Generic functions may only use operations permitted by the type constraint.

    - Using a generic function or type requires passing type arguments.

    - Type inference permits omitting the arguments of a function call in common cases.


    Generics will be great for replacing existing Go code that uses the empty interface
    where having a concrete type would have been better. An example of this is with
    container types (lists, stacks, queues) which can''t be written effectively with
    the empty interface. I also expect to see new packages like a concurrency package
    that can provide support for pooling, fan out/in, and drop patterns.


    # 9.1 Basic Syntax


    If I want to write a single print function that can output a slice of any given
    type and not use reflection, I can use the new generics syntax.'
