  md: "generic functions are bound to the packages types and nothing more.\n\nInterfaces\
    \ declared with a set of types can't be used in a traditional polymorphic function.\
    \ This wouldn't make sense anyway, but it's something that doesn't feel like Go\
    \ in the sense that this change to the interface is not orthogonal.\n\nOne idea\
    \ is to have pre-declared identifiers for common operation constraints.\n\n# Listing\
    \ 9.18\n\n```\nfunc index[T comparable](list []T, find T) int {\n    for i, v\
    \ := range list {\n        if v == find {\n            return i\n        }\n \
    \   n    return -1\n}\n```\n\nThe comparable constraint is declared by the language\
    \ and applies a constraint that types must be capable of being used in a comparison\
    \ statement. In this example, both v and find are variables of type T and are\
    \ being compared. This is an idea that a package in the standard library could\
    \ provide a common set of constraints as well.\n\nThere is no restriction on an\
    \ interface being declared with both a set of types and a method set of behavior.\n\
    \n# Listing 9.19\n\n```\ntype matcher[T any] interface {\n    person, food\n \
    \   match(v T) bool\n}\n\nfunc match[T matcher[T]](list []T, find T) int {\n \
    \   for i, v := range list {\n        if v.match(find) {\n            return i\n\
    \        }\n    }\n    return -1\n}\n```\n\nA generic interface is declared where\
    \ T is the type of value to be passed into a method named match. The interface\
    \ constrains its use to only values of user-defined type person and food.\n\n\
    When I look at the match function, there isn't an obvious need to restrict the\
    \ function to just the person and food types. If this is the case, the match function\
    \ should be a traditional polymorphic function, not a generic function. If there\
    \ was a good reason, a generic function can be used to apply this type of constraint."
