    # Collector Behavior


    When a collection starts, the collector runs through three phases of work. Two
    of these phases create Stop The World (STW) latencies and the other phase creates
    latencies that slow down the throughput of the application. The collector does
    its best to keep the STW latencies under 100 microseconds for every GC.


    I label these three phases as:


    +   - Mark Setup - STW

    - Marking - Concurrent

    - Mark Termination - STW


    Here is a break-down of each phase.


    # Mark Setup - STW


    When a collection starts, the first activity that must be performed is turning
    on the Write Barrier. The purpose of the Write Barrier is to allow the collector
    to maintain data integrity on the heap during a collection since both the collector
    and application Goroutines will be running concurrently.


    In order to turn the Write Barrier on, every application Goroutine running must
    be stopped. That is, as long as the application Goroutines are behaving properly.


    Figure 1


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_335_0.png)


    Figure 1 shows 4 application Goroutines running before the start of a collection.
    Each of those 4 Goroutine must be stopped. The only way to do that is for the
    collector to watch and wait for each Goroutine to enter a safe point. A safe point
    is where the Goroutine is not in the middle of a read or write of memory.


    Prior to the Goroutine being a preemptive scheduler, function calls were the only
    guarantee that a Goroutine was at a safe point to be stopped. Prior to the scheduler
    change in 1.14, what would happen if one of those four Goroutines didn’t make
    a'
