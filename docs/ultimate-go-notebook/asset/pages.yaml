    }\n\nfunc (c *AppError) Error() string {\n  return fmt.Sprintf(\"App Error, State:\
    \ %d\", c.State)\n}\n\nfunc Cause(err error) error {\n  root := err\n  for {\n\
    \    if err := errors.Unwrap(root); err == nil {\n      root = err\n    }\n  }\n\
    }\n\nfunc main() {\n  if err := firstCall(10); err != nil {\n    var app *AppError\n\
