- pgno: 294
  md: 'Waiting: This means the Thread is stopped and waiting for something in order
    to continue. This could be for reasons like waiting for the hardware (disk, network),
    the operating system (system calls) or synchronization calls (atomic, mutexes).
    These types of latencies are a root cause for bad performance.


    Runnable: This means the Thread wants time on a core so it can execute its assigned
    machine instructions. If you have a lot of Threads that want time, then Threads
    have to wait longer to get time. Also, the individual amount of time any given
    Thread gets shortened, as more Threads compete for time. This type of scheduling
    latency can also be a cause of bad performance.


    Executing: This means the Thread has been placed on a core and is executing its
    machine instructions. The work related to the application is getting done. This
    is what everyone wants.


    # Types Of Work


    There are two types of work a Thread can do. The first is called CPU-Bound and
    the second is called I/O-Bound.


    CPU-Bound: This is work that never creates a situation where the Thread may be
    placed in Waiting states. This is work that is constantly making calculations.
    A Thread calculating Pi to the Nth digit could be CPU-Bound.


    I/O-Bound: This is work that causes Threads to enter into Waiting states. This
    work consists of requesting access to a resource over the network or making system
    calls into the operating system. A Thread that needs to access a database would
    be I/O-Bound. I would include synchronization events (mutexes, atomic), that cause
    the Thread to wait for part of this category.


    # Context Switching


    If you are running on Linux, Mac or Windows, you are running on an OS that has
    a preemptive scheduler. This means a few important things. First, it means the
    scheduler is unpredictable when it comes to what Threads will be chosen to run
    at any given time. Thread priorities together with events, (like receiving data
    on the network) make it impossible to determine what the scheduler will choose
    to do and when.


    Second, it means you must never write code based on some perceived behavior that
    you have been lucky to experience but is not guaranteed to take place every time.
    It is easy to allow yourself to think, because Ive seen this same happen thousands
    of times, this is guaranteed behavior. You must control the synchronization and
    orchestration of Threads if you need determinism in your'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'application.


    The physical act of swapping Threads on a core is called context switching. A
    context switch happens when the scheduler pulls an Executing thread off a core
    and replaces it with a Runnable Thread. The Thread that was selected from the
    run queue moves back into the Runnable state (if it still has the ability to run),
    or into the Waiting state (if it was replaced because of an I/O-Bound type of
    request).


    Context switches are considered to be expensive because it takes time to swap
    Threads on and off a core. The amount of latency incurred during a context switch
    depends on different factors, but it''s not unreasonable for it to take between
    ~1000 and ~1500 nanoseconds.


    https://eli.thegreenplace.net/2018/measuring-context-switching-and-memory-overheads-for-linux-threads


    Considering the hardware should be able to execute (on average) 12 instructions
    per nanosecond per core, a context switch could cost you ~12k to ~18k instructions
    of latency.


    https://www.youtube.com/watch?v=jEG4Qyo_4Bc&feature=youtube.be&266


    In essence, your program is losing the ability to execute a large number of instructions
    during a context switch.


    If you have a program focused on I/O-Bound work, then context switches are going
    to be an advantage. When a Thread moves into a Waiting state, another Thread in
    a Runnable state is to take its place. This allows the core to always be doing
    work. This is one of the most important aspects of scheduling. Don''t allow a
    core to go idle if work is worth (Threads in a Runnable state) to be done.


    If your program is focused on CPU-Bound work, then context switches are going
    to be a performance nightmare. Since the Thread always has to work to do, the
    context switch is stopping that work from progressing. This situation is in stark
    contrast with what happens with an I/O-Bound workload


    # Less Is More


    Improving scheduler latency: https://lwn.net/Articles/404993/


    In the early days when processors had only one core, scheduling wasn''t overly
    complicated. Because you had a single processor with a single core, only one Thread
    could execute at any time. The idea was to define a scheduler period'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'and attempt to execute all the Runnable Threads within that period of time.
    No problem: take the scheduling period and divide it by the number of Threads
    that need to execute.


    As an example, if you define your scheduler period to 1000ms (1 second) and you
    have 10 Threads, then each thread gets 100ms. If you have 100 Threads, each Thread
    gets 10ms. However, what happens when you have 1000 Threads? Giving each Thread
    a slice of 1ms doesn''t work because the percentage of time you''re spending in
    context switches will be significantly related to the amount of time you''re spending
    on application work.


    What you need is to set a limit on how small a given time slice can be. In the
    last scenario, if the minimum time slice was 10ms and you have 1000 Threads, the
    scheduler period needs to increase to 10000ms (10 seconds). What if there were
    10,000 Threads, now you are looking at a scheduler period of 100000ms (100 seconds).
    At 10,000 threads, with a minimal time slice of 10ms, it takes 100 seconds for
    all the Threads to run once in this simple example if Thread uses its full slice.


    Be aware this is a very simple view of the world. There are more things that need
    to be considered and handled by the scheduler when making scheduling decisions
    discussed in this post.


    https://blog.acolyer.org/2016/04/26/the-linux-scheduler-a-decade-of-wasted-cores/


    You control the number of Threads you use in your application. When there are
    more Threads to consider, and I/O-Bound work happening, there is more chaos and
    nondeterministic behavior. Threads take longer to schedule and execute.


    This is why the rule of the game is "Less is More". Less Threads in a Runnable
    state means less overhead and more time each Thread gets over time. More Threads
    in a Runnable state mean less time each Thread gets over time. More means less
    of your work is getting done over time as well.


    # Find The Balance


    There is a balance you need to find between the number of cores you have and the
    number of Threads you need to get the best throughput for your application. When
    it comes to managing this balance, Thread pools are a great answer. I will show
    you in the next post that this is no longer necessary with Go. I think this is
    one of the nice things Go did to make multithreaded application development easier.


    Prior to coding in Go, I wrote code in C++ and C# on NT. On that operating system,'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'the use of IOCP (IO Completion Ports) thread pools were critical to writing
    multithreaded software. As an engineer, you needed to figure out how many Thread
    pools needed and the max number of Threads for any given pool to maximize throughput
    for the number of cores that you were given.


    When writing web services that talked to a database, the magic number of 3 Threads
    per core seemed to always give the best throughput on NT. In other words, 3 Threads
    per core minimized the latency costs of context switching maximizing execution
    time on the cores. When creating an IOCP Thread pool, I knew to start with a minimum
    of 1 Thread and a maximum of 3 Threads for every core I identified on the host
    machine.


    If I used 2 Threads per core, it took longer to get all the work done, because
    I had idle time when I could have been working code. If I used 4 Threads per core,
    it also took longer, because I had more latency in context switches. The balance
    of 3 Threads per core, for whatever reason, always seemed to be the magic number
    on NT.


    What if your service is doing a lot of different types of work? That could create
    different and inconsistent latencies. Maybe it also creates a lot of system-level
    events that need to be handled. It might not be possible to find a magic number
    that works all the time for all the different work loads. When it comes to using
    Thread pools to tune the performance of a service, it can get very complicated
    to find the right consistent configuration.


    # Cache Lines


    Accessing data from main memory has such a high latency cost (~100ns or ~1200
    instructions) that processors and cores have local caches to keep data close to
    the hardware threads that need it. Accessing data from caches has a much lower
    cost (~1.3ns to ~12.3ns or ~16 to ~160 instructions) depending on the cache accessed.
    Today, one aspect of performance is about how efficiently you can get data into
    the processor to reduce these data-access latencies. Writing multithreaded applications
    that mutate state need to consider the mechanics of the caching system.'
  merge: -1
  img_proc: true
