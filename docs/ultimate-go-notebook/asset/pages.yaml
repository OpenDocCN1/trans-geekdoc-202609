    \ the strings variable is an array of 5 strings. The loop iterates over each string\
    \ in the collection and displays the index position and the string value. Since\
    \ this is pointer semantic iteration, the for range iterating over the strings\
    \ array directly and on each iteration, the string value for each index position\
    \ is accessed directly for the print call.\n\n# 3.8 Data Semantic Guideline For\
    \ Built-In Types\n\nAs a guideline, if the data I'm working with is a numeric,\
    \ string, or bool, then use value semantics to move the data around my program.\
    \ This includes declaring fields on a struct type.\n\n+   Listing 3.11\n\n```\n\
    func Foo(x int, y string, z bool) (int, string, bool) {\n\ntype Foo struct {\n\
    \    X int\n    Y string\n    Z bool\n}\n```\n\nOne reason I might take an exception\
    \ and use pointer semantics is if I need the semantics of NULL (absence of value).\
    \ Then using pointers of these types is an option, but document this if it's not\
    \ obvious.\n\nThe nice thing about value semantics for these types is that I'm\
    \ guaranteed that each function is operating on its own copy. This means and writes\
    \ to this data are isolated to that function. This helps with integrity and identifying\
