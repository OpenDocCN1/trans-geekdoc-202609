- pgno: 321
  md: '![](img/8be06d78925d0d5a2d2ade851e9bad63_321_0.png)


    In figure 1, you see a diagram of two logical processors (P) with their independent
    OS thread (M) attached to an independent hardware thread (Core) on the machine.
    You can see two Goroutines (G1 and G2) are executing in parallel, executing their
    instructions on their respective OS/hardware thread at the same time. Within each
    logical processor, three Goroutines are taking turns sharing their respective
    OS thread. All these Goroutines are running concurrently, executing their instructions
    in no particular order and sharing time on the OS thread.


    Here''s the rub, sometimes leveraging concurrency without parallelism can actually
    slow down your throughput. What''s also interesting, sometimes leveraging concurrency
    with parallelism doesn''t give you a bigger performance gain than you might think
    you can achieve.


    # Workloads


    How do you know when out of order execution may be possible or make sense? Understanding
    the type of workload your problem is handling is a great place to start. There
    are two types of workloads that are important to understand when thinking about
    concurrency.


    **CPU-Bound:** This is a workload that never creates a situation where Goroutines
    naturally move in and out of waiting states. A Thread calculating Pi to the Nth
    digit is that work that is constantly making calculations.


    **I/O-Bound:** This is a workload that causes Goroutines to naturally enter into
    waiting states. This is a work that consists of requesting access to a resource
    over the network, or making system calls into the operating system, or waiting
    for an event to occur. A Goroutine that needs to read a file would be I/O-Bound.
    I would include synchronization events (mutexes, atomic), that cause the Goroutine
    to wait as part of this category.


    With CPU-Bound workloads you need parallelism to leverage concurrency. A single
    OS/hardware thread handling multiple Goroutines is not efficient since the'
