  md: 'Figure 2


    # # Core i7-9xx Cache Hierarchy


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_298_0.png)


    Scott Meyers


    Data is exchanged between the processor and main memory using cache lines.


    Note: This talk by Scott Meyers has these details and more:

    https://www.youtube.com/watch?v=WDIkqP4Jbke


    A cache line is a 64-byte chunk of memory that is exchanged between main memory
    and the caching system. Each core is given its own copy of any cache line it needs,
    which means the hardware uses value semantics. This is why mutations to memory
    in multithreaded applications create performance nightmares.


    When multiple Threads running in parallel are accessing the same data value or
    even data values near one another, they will be accessing data on the same cache
    line. Any Thread running on any core will get its own copy of that cache line.


