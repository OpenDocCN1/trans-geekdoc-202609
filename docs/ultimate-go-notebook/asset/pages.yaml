    # 3.11 Constructing Slices


    The slice is Go’s most important data structure and it’s represented as a three
    word data structure.


    Figure 3.5


    | ADDR | | 10 | 99 | 405 | 15 | 33 | |

    |---|---|---|---|---|---||}{

    | Len 5 | Length of the slice which represents the number of elements that can
    be accessed from the backing array. | |

    | Cap 6 | Capacity of the slice which represents the total number of elements
    that exist in the backing array. | |


    Constructing a slice can be done in several ways.


    Listing 3.14 Slice of string set to its zero value state.


    ```

    // Slice of string set to its zero value state.

    var slice []string


    // Slice of string set to its empty state.

    slice := []string{}


    // Slice of string set with a length and capacity of 5.

    slice := make([]string, 5)


    // Slice of string set with a length of 5 and capacity of 8.

    slice := make([]string, 5, 8)


    // Slice of string set with values with a length and capacity of 5.

    slice := []string("A", "B", "C", "D", "E")

    ```


    I can see the built-in function make to pre-allocate both length and capacity
    for the backing array. If the compiler knows the size at compile time, the backing
    array could be constructed on the stack.


    # 3.12 Slice Length vs Capacity


    The length of a slice represents the number of elements that can be read and written
    to. The capacity represents the total number of elements that exist in the backing
    array from that pointer position.'
