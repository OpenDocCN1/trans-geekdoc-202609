  md: '# Chapter 3: Data Structures


    In this chapter, I will learn about Go''s data structures and the mechanical sympathy
    behind them.


    # 3.1 CPU Caches


    There are lots of mechanical differences between processors and their design.
    In this section, I will talk at a high level about processors and the semantics
    that are relatively the same between them all. This semantic understanding will
    provide me a good mental model for how the processor works and the sympathy I
    can provide.


    Each core inside the processor has its own cache of memory (L1 and L2) and a common
    cache of memory (L3) used to store/access data and instructions. The hardware
    threads in each core can access their local L1 and L2 caches. Data from L3 or
    main memory needs to be copied into the L1 or L2 cache for access.


    Figure 3.1


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_41_0.png)


    The latency cost of accessing data that exists in the different caches changes
    from least to: L1 -> L2 -> L3 -> main memory. As Scott Meyers said, "If performance
    matters then the total amount of memory I have is the total amount of cache. Main
    memory is so slow to access, practically speaking, it might as well'
