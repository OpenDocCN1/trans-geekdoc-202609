  md: "# Listing 10.4\n\n```\nfunc algTwo(data [byte], find [byte], repl []byte, output\
    \ *bytes.Buffer) {\n\tinput := bytes.NewReader(data)\n\tsize := len(find)\n\t\
    idx := 0\n\n\tfor {\n\tb, err := input.ReadByte()\n\tif err != nil {\n\t\tbreak\n\
    \t}\n\n\tif b == find[idx] {\n\t\tidx++\n\t\tif idx == size {\n\t\t\toutput.Write(repl)\n\
    \t\t\tidx = 0\n\t\t}\n\t\t\tcontinue\n\t}\n\n\t\tif idx != 0 {\n\t\toutput.Write(find[:idx])\n\
    \t\tinput.UnreadByte()\n\t\tidx = 0\n\t\tcontinue\n\t}\n\n\toutput.WriteByte(b)\n\
    \tidx = 0\n}\n}\n```\n\nTyler's algorithm is based on the idea of reading one\
    \ byte at a time out of the input stream and comparing that byte with the lowercase\
    \ version of elvis based on a moving index. The algorithm starts with the index\
    \ at zero, which means the first byte out of the input stream is compared with\
    \ the lowercase e in elvis. If there is a match, the index is incremented so the\
    \ next byte pulled from the input stream can be compared to the letter l, and\
    \ so on, and so on.\n\nIf there are five matches in a row, the lowercase version\
    \ of elvis is found and the uppercase version of Elvis is sent through the output\
    \ stream. If there is no match, the index is reset to zero, the last byte is unread,\
    \ the process starts over again. I found this solution by Tyler really cool.\n\
    \n# 10.3 Benchmarking\n\nWith the two algorithms in place that solve the same\
    \ exact problem in two different ways, the next step is to write benchmark functions\
    \ to compare the two algorithms."
