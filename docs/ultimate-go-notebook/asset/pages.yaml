    \n    password string\n}\n```\n\nWhen it comes to fields in a struct, the first\
    \ letter declares if the field is accessible to code outside of the package it's\
    \ declared in. In this case, Name and ID are accessible, but password is not.\
    \ It's an idiom to separate exported and unexported fields in this manner if this\
    \ is reasonable or practical to do. Normally all fields would be one or the other.\n\
