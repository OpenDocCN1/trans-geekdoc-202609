    (keep your view inside the blue GC line at the top), three of the twelve P''s
    are dedicated to GC. You can see Goroutine 2450, 1978, and 2696 during this time
    are performing moments of Mark Assist work and not its application. At the very
    end of the collection, only one P is dedicated to GC and eventually performs the
    STW (Mark Termination) work.


    After the collection is finished, the application is back to running at full throttle.
    Except you see a lot of colored lines underneath those Goroutines.'
