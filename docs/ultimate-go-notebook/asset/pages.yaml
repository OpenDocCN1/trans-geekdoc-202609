  md: "# Chapter 4: Decoupling\n\nIn this chapter, I will learn about the mechanics\
    \ and semantics for decoupling code from change. I will learn how to extend behavior\
    \ to data, what polymorphism really is about, and how it is applied in the language.\n\
    \n# 4.1 Methods\n\nA method provides data the ability to exhibit behavior.\n\n\
    A function is called a method when that function has a receiver declared. The\
    \ receiver is the parameter that is declared between the keyword func and the\
    \ function name. There two types of receivers, value receivers for implementing\
    \ value semantics and pointer receivers for implementing pointer semantics.\n\n\
    Listing 4.1\n\n```\ntype user struct {\n    name string\n    email string\n}\n\
    \nfunc (u user) notify() {\n    fmt.Printf(\"Sending User Email To %s\\n\", u.name,\
    \ u.email)\n}\n\nfunc (u *user) changeEmail(email string) {\n    u.email = email\n\
    \    fmt.Printf(\"Changed User Email To %s\\n\", email)\n}\n```\n\nThe notify\
    \ function is implemented with a value receiver. This means the method operates\
    \ under value semantics and will operate on its own copy of the value used to\
    \ make the call.\n\nThe changeEmail function is implemented with a pointer receiver.\
    \ This means the method operates under pointer semantics and will operate on shared\
    \ access to the value used to make the call.\n\nOutside of a few exceptions, a\
    \ method set for a type should not contain a mix of value and pointer receivers.\
    \ Data semantic consistency is critically important and this includes declaring\
    \ methods.\n\n# 4.2 Method Calls\n\nWhen making a method call, the compiler doesn't\
    \ care if the value used to make the call matches the receiver's data semantics\
    \ exactly. The compiler just wants a value or pointer of the same type."
