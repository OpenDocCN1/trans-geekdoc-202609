  md: "# Listing 9.35\n\n```\nfunc poolWork[Input any, Result any](\n    size int,\n\
    \    work poolWorkFn[Input, Result],\n) chan Input, func() {\n\n    var wg sync.WaitGroup\n\
    \    wg.Add(size)\n\n    ch := make(chan Input)\n\n    for i := 0; i < size; i++\
    \ {\n        go func() {\n            defer wg.Done()\n            for input :=\
    \ range ch {\n                result := work(input)\n                fmt.Println(\"\
    pollWork: %v\", result)\n            }\n        }()\n    }\n\n    cancel := func()\
    \ {\n        close(ch)\n        wg.Wait()\n    }\n\n    return ch, cancel\n}\n\
    ```\n\nIn the poolWork function, the same generic types are declared to represent\
    \ the input and return type for the work function. A WaitGroup is constructed\
    \ to manage the lifecycle of the Goroutines in the pool. Then a channel is constructed\
    \ of the generic Input type. This channel is used by the Goroutines in the pool\
    \ to receive the input data for the work function.\n\nThe pool of Goroutines are\
    \ created with each Goroutine waiting in a receive operation using a for-range\
    \ loop against the channel. Finally, a cancel function is constructed to allow\
    \ the caller to shut down the pool and wait for all the Goroutines to signal they\
    \ have terminated.\n\nTo test the use of the poolWork function, I built a second\
    \ small program."
