- pgno: 109
  md: "integrity is error handling. When it comes to Go, error handling is not an\
    \ exception to be handled later or somewhere else in the code. It's a part of\
    \ the main path and needs to be a main focus.\n\nDevelopers have the responsibility\
    \ to return enough context about any error so a user can make an informed decision\
    \ about how to proceed. Handling an error is about three things: logging the error,\
    \ not propagating the error further, and determining if the Goroutine/program\
    \ needs to be terminated.\n\nIn Go, errors are just values so they can be anything\
    \ I need them to be. They can maintain any state or behavior.\n\n# Listing 5.39\n\
    \n```\n```\n// http://golang.org/pkg/builtin/#error\ntype error interface {\n\
    \  Error() string\n}\n```\n```\n\nThe error interface and it's an interface that\
    \ is built into the language. This is why it appears to be an unexported identifier.\
