- pgno: 204
  md: "# Listing 10.3\n\n```\nfunc algOne(data []byte, find []byte, repl []byte, output\
    \ *bytes.Buffer) {\n\tinput := bytes.NewBuffer(data)\n\tsize := len(data)\n\t\
    buf := make([]byte, size)\n\tend := size - 1\n\ntif n, err := io.ReadFull(input,\
    \ buf[end:]); err != nil {\n\toutput.Write(buf[:n])\n\treturn\n}\n\nfor {\n\t\
    if n, err := io.ReadFull(input, buf[end:]); err != nil {\n\t\toutput.Write(buf[:end])\n\
    \t\treturn\n\t}\n\n\tif bytes.Equal(buf, find) {\n\t\toutput.Write(repl)\n\t\t\
    if n, err := io.ReadFull(input, buf[end:]); err != nil {\n\t\t\t\toutput.Write(buf[:n])\n\
    \t\t\t\treturn\n\t\t\tcontinue\n\t}\n\t}\n\toutput.WriteByte(buf[0])\n\tcopy(buf,\
    \ buf[1:])\n}\n}\n```\n\nMy algorithm is based on the idea of creating a buffer\
    \ of 5 bytes and comparing those 5 bytes with the lowercase version of elvis.\
    \ If there is a match, then the uppercase version of Elvis is sent through the\
    \ output stream. If there is no match, the first byte of the buffer is sliced\
    \ off and a new byte from the input stream is added to the end of the buffer.\
    \ Then those 5 bytes are compared again.\n\nLuckily, my friend Tyler took the\
    \ time to provide a different implementation that solves the same problem."
  merge: -1
  img_proc: true
