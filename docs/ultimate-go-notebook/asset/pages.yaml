  md: "If lots of time is spent syscall.Read/Write, the program potentially makes\
    \ an excessive amount of small reads and writes. Bufio wrappers around Os.File\
    \ and net.Conn can help in this case.\n\nIf lots of time is spent in the GC component,\
    \ the program either allocates too many transient objects or the heap size is\
    \ very small so garbage collections happen too frequently.\n\n+   - Large objects\
    \ affect memory consumption and GC pacing, while large numbers of tiny allocations\
    \ affect marking speed.\n- Combine values into larger values. This will reduce\
    \ the number of memory allocations (faster) and also reduce pressure on the garbage\
    \ collector (faster garbage collections).\n- Values that do not contain any pointers\
    \ are not scanned by the garbage collector. Removing pointers from actively used\
    \ values can positively impact garbage collection time.\n\n# 10.1.4 Rules of Performance\n\
    \nBasic rules around performance.\n\n+   1. Never guess about performance.\n2.\
