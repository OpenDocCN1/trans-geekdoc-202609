- pgno: 200
  md: '# Chapter 10: Profiling


    In this chapter, I will learn how to profile code using benchmarks. Even though
    I will be generating profiles from a benchmark, a lot of what is shared can be
    used regardless of how the profile is generated.


    # 10.1 Introduction


    I can use the go tooling to inspect and profile my programs. Profiling is both
    a journey and detective work. It requires some understanding about the application
    and expectations. The profiling data in and of itself is just raw numbers. I have
    to give it meaning and understanding.


    # 10.1.1 The Basics of Profiling


    > "Those who make you believe absurdities can make you commit" - Voltaire


    # How does a profiler work?


    A profiler runs my program and configures the operating system to interrupt it
    at regular intervals. This is done by sending SIGPROF to the program profiled,
    which suspends and transfers execution to the profiler. The profiler then grabs
    the program counter for each executing thread and then continues running the program.


    # Profiling do''s and don''ts


    Before I, I must have a stable environment to get repeatable results.


    +   - The machine must be idle—don''t profile on shared hardware, don''t browse
    the web while waiting for a long benchmark to run.

    - Watch out for power saving and thermal scaling.

    - Avoid virtual machines and shared cloud hosting; they are too noisy for consistent
    measurements.


    If I can afford it, buy dedicated performance hardware. Rack them, disable all
    the power management and thermal scaling and never update the software on those
    machines. If I can, have a before and after sample and run them multiple times
    to get consistent results.


    # 10.1.2 Types of Profiling


    There are several types of profiling I can perform in Go.


    # CPU profiling


    CPU profiling is the most common type of profile. When CPU profiling is enabled,
    the runtime will interrupt itself ~10ms and record the stack trace of the currently
    running Goroutines. Once the profile is saved to disk, we can analyze it to'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'determine the hottest paths. The more times a function appears in the profile,
    the more time that code path is taking as a percentage of the runtime.


    # Memory profiling


    Memory profiling records the stack trace when a heap allocation is made. Memory
    profiling, like CPU profiling, is sample based. By default, samples are profiled
    at 1 alloc for 512kb. This rate can be changed. Stack allocations are assumed
    to be free and are not tracked in the memory profile. Because memory profiling
    is sample based and it tracks allocations not used, using memory profiling to
    determine my application''s overall memory usage is difficult.


    # Blocking profiling


    Blocking profiling is quite unique. A block profile is similar to a CPU profile,
    but it records the amount of time a Goroutine spent waiting for a shared resource.
    This can be useful for determining concurrency bottlenecks in my application.
    Blocking profiling can show me when a large number of Goroutines could make progress,
    but were blocked.


    Blocking includes:


    +   - Sending or receiving on an unbuffered channel.

    - Sending to a full channel, receiving from an empty one.

    - Trying to lock a sync.Mutex that is locked by another Goroutine.

    - Blocking profiling is a very specialized tool, it should not be used until I
    believe I’ve eliminated all my CPU and memory usage bottlenecks.


    # One profile at a time


    Profiling is not free. Profiling has a moderate, but measurable impact on program
    performance—especially if I increase the memory profile sample rate. Most tools
    will not stop me from enabling multiple profiles at once. If I enable multiple
    profiles at the same time, they will observe their own interactions and skew my
    results.


    Do not enable more than one kind of profile at a time.


    # 10.1.3 Hints to interpret what I see in the profile


    If I see lots of time spent in runtime.mallococ func, the program potentially
    makes an excessive amount of small memory allocations. The profile will tell me
    where the allocations are coming. See the memory profiler section for suggestions
    on how to optimize this case.


    If lots of time is spent in channel operations, sync.Mutex code and other synchronization
    primitives or system components, the program probably suffers from contention.
    Consider restructuring the program to eliminate frequently accessed shared resources.
    Common techniques for this include sharding/partitioning, local buffering/batching
    and copy-on-write technique.'
