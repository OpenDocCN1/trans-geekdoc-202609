  md: "is function requires an int32 not an int, so I need to make two more changes.\n\
    \nListing 12.13\n\n```\nfunc freq(topic string, docs []string) int {\n    var\
    \ found int32      <-- CHANGED\n\n    .\n    wg.Wait()\n    return int(found)\
    \    <-- CHANGED\n}\n```\n\nThese changes are necessary to use the atomic.AddInt32\
    \ function and still return an integer. With these changes, the data race will\
    \ be gone. However, there is still another problem with the code. It's not cache\
    \ friendly as it otherwise be.\n\n# 12.5 Cache Friendly\n\nThe problem is with\
    \ the found variable. It's technically a global variable to the 4k Goroutines\
    \ that will be accessing memory. Though using the atomic package helps to serialize\
    \ access, each core on my machine that is executing Goroutines will receive and\
    \ operate on its own copy of the found variable. The moment any copy inside of\
    \ any core is incremented, it will mark all the other copies in all the other\
    \ cores dirty.\n\nWhen the next Goroutine goes to increment their copy, and that\
    \ copy is marked dirty, a fresh copy needs to be pulled from main memory. This\
    \ will result in the thrashing of memory, slowing everything down. Over 8 cores\
    \ and 4k files, this thrashing may not result in much of a performance hit. When\
    \ I run this on 128 cores over 1MM files, this thrashing will take its toll.\n\
    \nTo alleviate the thrashing I need each Goroutine to use a local variable for\
    \ counting the number of times the term is found. However, before the Goroutine\
    \ terminates it must add the result of it's local variable to the global variable.\
    \ For the current algorithm, that means we reduce the thrashing from 28k times\
    \ to 4k times. Not perfect, but much better."
