    # 2.12 Stack Growth


    The size of each frame for every function is calculated at compile time. This
    means, if the compiler doesn''t know the size of a value at compile time, the
    value must be constructed on the heap. An example of this is the built-in function
    make to construct a slice whose size is based on a variable.


    # Listing 2.20


    ```

    b = make([]{}, size) // Backing array allocates on the heap.

    ```


    Go uses a contiguous stack implementation to determine how stacks grow and shrink.
    One alternative Go could have used a segmented stack implementation, which is
    used by some operating systems.


    Every function comes with a little preamble that asks, "Is there enough stack
    space for this new frame?". If yes, then no problem and the frame is taken and
    initialized. If not, then a larger stack must be constructed and the memory on
    the existing stack must be copied over to the new one. This requires changes to
    pointers that reference memory on the stack. The benefits of contiguous memory
    and linear traversals with modern hardware is the tradeoff for the cost of.


    Because of use of contiguous stacks, Goroutine cannot have a pointer to every
    Goroutine''s stack. There would be too much overhead for the runtime to keep track
    of every pointer to and readjust these pointers to the new location.


    # 2.13 Garbage Collection


    Once a value is constructed on the heap, the Garbage Collector (GC) has to get
    involved. The most important part of the GC is the paging algorithm. It determines
    the frequency/pace that the GC has run in order to maintain the smallest heap
    possible in conjunction with the best application throughput.


    There are lots of little details related to the GC, so to learn more read the
    post in chapter 14 titled, Garbage Collection Semantics.


