  md: "# Listing 4.10\n\n```\nfunc (t Time) Add(d Duration) Time {\n    t.sec += int64(d\
    \ / le9)\n    nsec := int32(t.nsec) + int32(d%le9)\n    if nsec >= le9 {\n   \
    \     t.sec++\n        nsec -= le9\n    } else if nsec < 0 {\n        t.sec--\n\
    \        nsec += le9\n    }\n    t.nsec = nsec\n    return t\n}\n```\n\nAdd is\
    \ a method that needs to perform a mutation operation. If I look closely, I will\
    \ see the function using value semantic mutation. The Add method gets its own\
    \ copy of the Time value used to make the call, it mutates its own copy, then\
    \ it returns a copy back to the caller. Again, this is the safest way to perform\
    \ a mutation operation.\n\n# Listing 4.11\n\n```\nfunc div(t Time, d Duration)\
    \ (qmod2 int, r Duration) ()\n```\n\nHere is another example where the div function\
    \ accepts a value of type Time and Duration (int64), then returns values of type\
    \ int and Duration. Value semantics for the Time type and for all the built-in\
    \ types. Duration has an underlying type of int64.\n\n# Listing 4.12\n\nThese\
    \ four forms from the Time package seem to break the rules for data semantic consistency.\
    \ They are using pointer semantics, why? Because they are implementing an interface\
    \ where the method signature is locked in. Since the implementation requires a\
    \ mutation, pointer semantics are the only choice.\n\nHere is a guideline: if\
    \ value semantics are at play, I can switch to pointer semantics for some functions\
    \ as long as I don't leave the data in the remaining chain switch back to value\
    \ semantics. Once I switch to pointer semantics, all future calls from that point\
    \ need to stick to pointer semantics. I can never, ever, never, go from pointer\
    \ to value. It's never safe to make a copy of a value that a pointer points to."
