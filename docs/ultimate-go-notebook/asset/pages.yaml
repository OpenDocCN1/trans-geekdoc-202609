  md: 'Guidelines around declaring types:


    +   - Declare types that represent something new or unique.

    - Don''t create aliases just for readability.

    - Validate that a value of any type is created or used on its own.

    - Embed types because I need the state, but because we need the behavior.

    - If I am not thinking about behavior, I''m locking myself into the design that
    I can''t grow in the future without cascading changes.

    - Question types that are aliases or abstractions for an existing type.

    - Question types whose sole purpose is to share a common set of states.


    # 5.2 Don''t Design With Interfaces


    Unfortunately, too many developers attempt to solve problems in the abstract first.
    They focus on interfaces right away and this leads to interface pollution. As
    a developer, I exist in one of modes: a programmer and then an engineer.


    When I am programming, I am focused on getting a piece of code to work. Trying
    to solve the problem and break down walls. Prove that my initial ideas work. That
    is all I care about. This programming should be done in the concrete and is never
    production ready.


    Once I have a prototype of the code that solves the problem, I need to switch
    to engineering mode. I need to focus on how to write the code at a micro-level
    for data semantics and readability, then at a macro-level for mental models and
    maintainability. I also need to focus on errors and failure states.


    This work is done in a cycle of refactoring. Refactoring for readability, abstraction,
    and for testability. Abstracting is only one of a few refactors that need to be
    performed. This works best when I start with a piece of concrete code and then
    DISCOVER the interfaces that are needed. Don''t apply abstractions unless are
    absolutely necessary.


    Every problem I solve with code is a data problem requiring me to write data transformations.
    If I don''t understand the data, I don''t understand the problem. If I don''t
    understand the problem, I can''t write any code. Starting with a concrete solution
    that is based on the concrete data structures is critical. Rob Pike said,


    > "Data dominates. If you''ve chosen the right data structures and organized things
    well, the algorithms will almost always be self-evident." - Rob Pike


    When is abstraction necessary? When I see a place in the code where the data could
    change and I want to minimize the cascading effects that would result. I might
    use abstraction to help make code testable, but I should try to avoid this if'
