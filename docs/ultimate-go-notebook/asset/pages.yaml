- pgno: 225
  md: "# Listing 11.9\n\n```\npackage main\n\nimport (\n    \"net/http/pprof\" //\
    \ call init function\n)\n```\n\nThe first thing to do is add this import to the\
    \ main function. This import allows the compiler to find an init function in the\
    \ pprof package that debug routes in the default server mux.\n\n# Listing 11.10\n\
    \n```\nsrc/net/http/pprof/pprof.go\n\nfunc init() {\n    http.HandleFunc(\"/debug/pprof\"\
    , Index)\n    http.HandleFunc(\"/debug/cmdline\", Cmdline)\n    http.HandleFunc(\"\
    /debug/pprof/profile\", Profile)\n    http.HandleFunc(\"/debug/pprof/symbol\"\
    , Symbol)\n    http.HandleFunc(\"/debug/pprof/trace\", Trace)\n}\n```\n\nNext,\
    \ I need to bind the debug server to an ip address and port. I want this to be\
    \ separate from the application traffic so these endpoints can be protected behind\
    \ a firewall.\n\n# Listing 11.11\n\n```\npackage main\n\nimport (\n    \"net/http/pprof\"\
    \ // call init function\n)\n\nfunc main() {\n    debugHost := \":5000\"\n\n  \
    \  go func() {\n        log.Printf(\"main: Debug Listening %s\", debugHost)\n\
    \        err := http.ListenAndServe(debugHost, http.DefaultServeMux)\n       \
    \ if err != nil {\n            log.Printf(\"main: Debug Listener closed: %v\"\
    , err)\n        }\n    }()n\n}\n```\n\nA Goroutine is created to block on the\
    \ http.ListenAndServe call to handle the debug routes. Since I already set this\
    \ up before I ran load through the program, I can use the debug/pprof endpoint\
    \ now to get a memory profile."
