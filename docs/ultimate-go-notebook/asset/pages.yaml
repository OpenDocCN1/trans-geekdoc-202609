  md: "# Chapter 5: Software Design\n\nIn this chapter, I will learn about the mechanics\
    \ and semantics behind error handling and an important design pattern in Go called\
    \ composition. Along the way, I will learn how to group data of different types\
    \ and learn about precision based semantics.\n\n# 5.1 Grouping Different Types\
    \ of Data\n\nIt's important to remember that in Go the concepts of sub-typing\
    \ or sub-classing really don't exist and these design patterns should be avoided.\n\
    \nThe following is an anti-pattern I shouldn't follow or implement.\n\nListing\
    \ 5.1\n\n```\ntype Animal struct {\n    Name string\n    IsMammal bool\n}\n```\n\
    \nThe Animal type is being declared as a base type that tries to define data that\
    \ is common to all animals. I also attempt to provide some common behavior to\
    \ an animal as well.\n\nListing 5.2\n\n```\nfunc (a *Animal) Speak() {\n    fmt.Println(\"\
    UGH!\")\n    \"My name is,\", a.Name, \", it is,\", a.IsMammal, \"I am a mammal\"\
    \n}\n```\n\nMost animals have the ability to speak in one way or the other. However,\
    \ trying to apply this common behavior to just an animal doesn't make any sense.\
    \ At this point, I have no idea what sound makes, so I wrote UGH.\n\nListing 5.3\n\
    \n```\ntype Dog struct {\n    Animal\n    PackFactor int\n}\n```\n\nThe real problems\
    \ begin. I'm attempting to use embedding to make a Dog everything an Animal is\
    \ plus more. On the surface this will seem to work, but there will be problems.\
    \ With that being said, a Dog does have a specific way they speak."
  merge: -1
