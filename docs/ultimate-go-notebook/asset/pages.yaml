- pgno: 77
  md: "Uncertainty about change is not a license to guess but a directive to STOP\
    \ and learn more. I must年纪 between code that defends against fraud vs protects\
    \ against accidents.\n\nUse an interface when:\n\n+   - Users of the API need\
    \ to provide an implementation detail.\n- API's have multiple implementations\
    \ they need to maintain internally.\n- Parts of the API that can change have been\
    \ identified and require decoupling.\n\nDon't use an interface as:\n\n+   - For\
    \ the sake of using an interface.\n- To generalize an algorithm.\n- When users\
    \ declare their own interfaces.\n- If it is not clear how the interface makes\
    \ the code better.\n\n# 4.8 Interfaces Are Valueless\n\nThe first important thing\
    \ to understand is that an interface type declares a valueless type.\n\nListing\
    \ 4.24\n\n```\ntype reader interface {\n  read(b []byte) (int, error)\n}\n```\n\
    \nType reader is not a struct, but an interface type. Its declaration is not based\
    \ on state, but behavior. Interface types declare a method-set of behavior that\
    \ concrete data must exhibit in order to satisfy the interface. There is nothing\
    \ concrete about interface types, therefore they are valueless.\n\nListing 4.25\n\
    \n```\nvar r reader\n```\n\nBecause they are valueless, the construction of a\
    \ variable (like r) is odd in our programming model, r does not exist, it's valueless.\
    \ There is nothing about r itself that I can manipulate or transform. This is\
    \ a critical concept to understand. I'm never working with interface values, only\
    \ concrete values. An interface has a compiler representation (internal type),\
    \ but from our programming model, interfaces are valueless.\n\n# 4.9 Implementing\
    \ Interfaces\n\nGo is a language that is convention over configuration. When it\
    \ comes to a concrete type implementing an interface, there is no exception."
  merge: -1
  img_proc: true
