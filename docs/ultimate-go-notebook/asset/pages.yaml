    # Pointer Variables Are Not Special


    Pointer variables are not special because they are variables like any other variable.
    They have a memory allocation and they hold a value. It just so happens that all
    pointer variables, regardless of the type of value they can point to, are always
    the same size and representation. What can be confusing is that the * character
    is acting as an operator inside the code and is used to declare the pointer type.
    If you can distinguish the type declaration from the pointer operation, this can
    help alleviate some confusion.


    # Conclusion


    This post has described the purpose behind pointers and how stack mechanics work
    in Go. This is the first step in understanding the mechanics, design philosophies,
    and guidelines for writing consistent and readable code.


    In summary this is what you learned:


    +   - Functions execute within the scope of frame boundaries that provide an individual
    memory space for each respective function.

    - When a function is called, there is a transition that takes place between two
    frames.

    - The benefit of passing data "by value" is readability.

    - The stack is important because it provides the physical memory space for the
    frame boundaries that are given to each individual function.

    - All stack memory below the active frame is invalid by memory from the active
    frame and is valid.

    - Making a function call the Goroutine needs to frame a new section of memory
    on the stack.

    - It''s during each function call, when the frame is taken, that the stack memory
    for that frame is wiped clean.

    - Pointers serve one purpose, to share a value with a function so the function
    can read and write to that value though the value does not exist directly inside
    its own frame.

    - For every type that is declared, either by you or the language itself, for free
    compliment pointer type you can use for sharing.

    - The pointer variable allows indirect memory access outside of the function''s
    frame that it is using.

    - Pointer variables are not special because they are variables like any other
    variable. They have a memory allocation and they hold a value.'
