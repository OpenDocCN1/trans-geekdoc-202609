- pgno: 339
  md: 'again once the collection finished. The application is back to full throttle
    as it was before the collection started.


    # Sweeping - Concurrent


    There is another activity that happens after a collection is finished called Sweeping.
    Sweeping is when the memory associated with values in heap memory that were not
    marked as in-use are reclaimed. This activity occurs when application Goroutines
    attempt to allocate new values in heap memory. The latency of Sweeping is added
    to the cost of performing an allocation in heap memory and is not tied to any
    latencies associated with garbage collection.


    The following is a sample of a trace on my machine where I have 12 hardware threads
    available for executing Goroutines.


    Figure 7


