  md: "# Listing 8.4\n\n```\nvar gs string\n\nfunc BenchmarkSprint(b *testing.B) {\n\
    \    var gs string\n\n    for i := 0; i < b.N; i++ {\n        s = fmt.Sprint(\"\
    hello\")\n    }\n\n    gs = s\n}\n```\n\nAt the core of every benchmark is the\
    \ loop from i to b. Inside this loop is where the code to be benchmarked is placed.\
    \ To understand the loop, I need to understand a setting called -benchtime.\n\n\
    The -benchtime represents the total amount of time to spin the loop before providing\
    \ a result. This is where things gets interesting because I can't spin a loop\
    \ based on time, only on a number of iterations. The number of iterations required\
    \ to match the -benchtime needs to be identified.\n\n the correct b.N to match\
    \ the -benchtime is accomplished through some trial and error. At the very beginning\
    \ of running the benchmark, the tooling will set the value of b.N to 1 and run\
    \ the loop. Then it will multiply the value of b.N by 100 until it gets close\
    \ to the -benchtime. Then the algorithm can fix on a working b.N.\n\n# Listing\
    \ 8.5\n\n```\nvar gs string\nvar a []int\n\nfunc BenchmarkSprint(b *testing.B)\
    \ {\n    var gs string\n\n    a = append(a, b.N)\n    for i := 0; i < b.N; i++\
    \ {\n        s = fmt.Sprint(\"hello\")\n    }\n\n    if len(a) > 4 {\n       \
    \ fmt.Println(a)\n    }\n\n    gs = s\n}\n```\n\nI added the ability to capture\
    \ the value of b.N on every call to the benchmark function. Knowing that in case\
    \ it will take 5 calls to find the right b.N, that is when I output the the contents\
    \ of the slice."
  merge: -1
  img_proc: true
- pgno: 166
  md: "# Listing 8.6\nBenchmarkSprint-16 [1 100 10000 1000000 54495168]\n\nI can see\
    \ the tooling identifying a value of b.N after 5 tries, finding the right number\
    \ after trying a million iterations.\n\nAnother important aspect of benchmarking\
    \ the compiler. The compiler will build this code into a binary to run the benchmark.\
    \ It's important that the code inside the loop is accurate to how it runs in production.\
    \ Any slight variation could change the compiler's behavior on how the code is\
    \ built, or how the code behaves at runtime.\n\nBack to the original code for\
    \ the Sprint benchmark.\n\n# Listing 8.7\n\n```\nvar gs string\nfunc BenchmarkSprint(b\
    \ *testing.B) {\n  var s string\n\\  for i := 0; i < b.N; i++ {\n    s = fmt.Sprint(\"\
    hello\")\n  }\n\n  gs = s\n}\n```\n\nThis benchmark is measuring the performance\
    \ of calling Sprint. Notice how the Sprint function returns a new string after\
    \ the call. It's important to capture that return value as part of running the\
    \ benchmark because doing so represents the real behavior of using this function\
    \ in production code.\n\nIf I don't capture the return value from the call to\
    \ Sprint, it's possible that the compiler could throw the function call out of\
