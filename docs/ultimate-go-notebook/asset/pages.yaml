  md: "# Listing 4.33\n\n```\ntype printer interface {\n    print()\n}\ntype canon\
    \ struct {\n    name string\n}\nfunc (c canon) print() {\n    fmt.Printf(\"Printer\
    \ Name: %s\\n\", c.name)\n}\ntype epson struct {\n    name string\n}\nfunc (e\
    \ epson) print() {\n    fmt.Printf(\"Printer Name: %s\\n\", e.name)\n}\nfunc main()\
    \ {\n    c := canon(\"PIXMA TR4520\")\n    e := epson(\"WorkForce WF-3720\")\n\
    \n    printers := []printer{\n        c,\n        &e,\n    }\n    c.name = \"\
    PROGRAF PRO-1000\"\n    e.name = \"Home XP-4100\"\n\n    for _, p := range printers\
    \ {\n        p.print()\n    }\n}\n```\n\nOutput:\nPrinter Name: PIXMA TR4520\n\
    Printer Name: Home XP-4100\n\nThe code shows how a choice of semantics of the\
    \ interface printer allows me to create a collection of different concrete printer\
    \ types. Iterating over the collection and leveraging polymorphism since the call\
    \ to p.print changes its behavior depending on the concrete value the code is\
    \ operating on.\n\nThe example also shows how the choice of data semantics changes\
    \ the behavior of the program. When storing the data using value semantics, the\
    \ change to the original value is not seen. This is because a copy is stored inside\
    \ the interface. When pointer semantics are used, any changes to the original\
    \ value are seen.\n\n# 4.13 Embedding\n\nThis example does not show embedding,\
    \ just the declaration of two types working together as a field from one type\
    \ to the other."
