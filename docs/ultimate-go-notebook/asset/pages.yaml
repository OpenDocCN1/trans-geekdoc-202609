- pgno: 15
  md: '# Quotes


    +   - "An architecture isn''t a set of pieces, it''s a set of rules what you can
    expect of them." - Michael Feathers


    # Reading


    +   - The Philosophy of Google''s C++ Code - Titus Winters


    # 1.7 Differences Between Senior vs Junior Developers


    What is the difference between a Senior and Junior developer?


    # Quotes


    +   - "You are personally responsible for the software you write." - Stephen Bourne
    (Bourne shell)


    +   - "And the difference between juniors+seniors to those who are in-between,
    is the confidence to ask "dumb" questions." - Natalie Pistovich


    +   - Mistakes are an inevitable consequence of doing something new, and as such,
    should be seen as valuable; without them, we''d have no originality." - Ed Catmull
    (President of Pixar)


    +   - "It takes considerable knowledge just to realize the extent of your own
    ignorance." - Thomas Sowell


    +   - "If you do not make mistakes, you''re not working on hard enough problems."
    - Frank Wilczek


    +   - "Don''t cling to a mistake because you spent so much time making it." -
    Aubrey de Grey


    # 1.8 Design Philosophy


    I can''t look at a piece of code and determine if it smells good or bad without
    a design philosophy. These four major categories are the basis for code reviews
    and should be prioritized in this order: Readability, Simplicity and then Performance.
    I must consciously and with great reason be able to explain the category I''m
    choosing.


    # 1.8.1 Integrity


    I need to become very serious about reliability.


    There are two driving forces behind integrity:


    +   - Integrity is about every allocation, read and write of memory being accurate,
    consistent and efficient. The type system is critical to making sure we have this
    micro level of integrity.


