  md: "# Language Mechanics\n\n+   Use channels to orchestrate and coordinate Goroutines.\n\
    \  - Focus on the signaling semantics and not the sharing of data.\n  - Signaling\
    \ with data or without data.\n  - Question their use for synchronizing access\
    \ to shared state.\n    - There are cases where channels can be simpler for this\
    \ but initially question.\n\n+   Unbuffered channels:\n  - Receive happens before\
    \ the Send.\n  - Benefit: 100% guarantee the signal being sent has been received.\n\
    \  - Cost: Unknown latency on when the signal will be received.\n\n+   Buffered\
    \ channels:\n  - Send happens before the Receive.\n  - Benefit: Reduce blocking\
    \ latency between signaling.\n  - Cost: No guarantee when the signal has has been\
    \ received.\n    - The larger buffer, the less guarantee.\n\n+   Closing channels:\n\
    \  - Close happens before the Receive. (like Buffered)\n  - Signaling without\
    \ data.\n  - Perfect for signaling cancellations and deadlines.\n\n+   NIL channels:\n\
    \  - Send and Receive block.\n  - Turn off signaling\n  - Perfect for rate limiting\
    \ or short-term stoppages.\n\n# Design Philosophy\n\n+   If any given Send on\
    \ a channel CAN cause the sending Goroutine to block:\\n  - Be careful with Buffered\
    \ channels larger than 1.\n    - Buffers larger than 1 must have reason/measurements.\n\
    \  - Must know what happens when the sending Goroutine blocks.\n\n+   If any given\
    \ Send on a channel WON'T cause the sending Goroutine to block:\n  - I have the\
    \ exact number of buffers for each send.\n    - Fan Out pattern\n  - I have the\
    \ measured buffer for max capacity.\n    - Drop pattern\n\n+   Less is more with\
    \ buffers.\n  - Don't think about performance when thinking about buffers.\n \
    \ - Buffers can help to reduce blocking latency between signaling.\n    - Reducing\
    \ blocking latency towards zero does not necessarily mean throughput.\n    - If\
    \ a buffer of one is giving me good enough throughput then keep it.\n    - Question\
    \ buffers that are larger than one and measure for size.\n    - Find the smallest\
    \ buffer that provides good enough throughput."
