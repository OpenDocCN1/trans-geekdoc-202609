  md: '# 14.4 Scheduling In Go: Go Scheduler


    # Introduction


    When your Go program starts up, it''s given a Logical Processor (P) for every
    virtual core that is identified on the host machine. If you have a processor with
    multiple hardware threads per physical core Hyper-Threading, each hardware thread
    will be presented to your Go program as a virtual core. To better understand this,
    look at the system report for my MacBook Pro.


    https://en.wikipedia.org/wiki/Hyper-threading


    Figure 1


