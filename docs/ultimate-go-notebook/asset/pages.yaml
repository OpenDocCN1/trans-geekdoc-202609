  md: "# 6.11.6 Cancellation\n\nThe cancellation pattern is used to tell a function\
    \ performing some I/O how long I am willing to wait for the operation to complete.\
    \ Sometimes I can cancel the operation, and sometimes all I can do just walk away.\n\
    \nListing 6.40\n\n```\nfunc cancellation() {\n    duration := 150 * time.Millisecond\n\
    \    ctx, cancel := context.WithTimeout(context.Background(), duration)\n    defer\
    \ cancel()\n\n    ch := make(chan string, 1)\n\n    go func() {\n        time.Sleep(time.Duration(rand.Intn(200))\
    \ * time.Millisecond)\n        ch <- \"data\"\n    }()\n\n    select {\n    case\
    \ d := <-ch:\n        fmt.Println(\"work complete\", d)\n\n    case <-ctx.Done():\n\
    \        fmt.Println(\"work cancelled\")\n    }\n\n    time.Sleep(time.Second)\n\
    \    fmt.Println(\"-----------------------\")\n}\n```\n\nThe code starts with\
    \ defining a time.Duration variable named duration set to 150 milliseconds. Then\
    \ a Context value is created to support a timeout of the 150 seconds using the\
    \ WithTimeout function. That function takes a Context value in and returns a new\
    \ one with the changes. In this case, I use the Background function which returns\
    \ an empty parent Context.\n\nIt’s important to call the cancel function that\
    \ is returned as the second argument from WithTimeout a defer. If that cancel\
    \ function is not called at least once, there will be a memory leak.\n\nAfter\
    \ a buffered channel of 1 is created, a child Goroutine is created to perform\
    \ some I/O bound work. In this case, a random Sleep call is made to simulate blocking\
    \ work that can’t be directly cancelled. That work can take up to 200 milliseconds\
    \ to finish. There is a 50 millisecond difference between the timeout and the\
    \ amount of time the work could.\n\nWith the child Goroutine created and performing\
    \ the work, the parent Goroutine blocks in a select statement waiting on two signals.\
    \ The first case represents the child Goroutine finishing the work on time and\
    \ the result being received. That is what I want. The second case represents a\
    \ timeout from the Context. This means the work didn’t finish within the 150 millisecond\
    \ time limit."
