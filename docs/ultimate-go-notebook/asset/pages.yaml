  md: '# 14.6 Garbage Collection Semantics


    # Introduction


    Garbage collectors have the responsibility of tracking heap memory allocations,
    freeing up allocations that are no longer needed, and keeping allocations that
    are still in-use. How a language decides to implement this behavior is complex
    but it shouldn''t be a requirement for application developers to understand the
    details in order to build software. Plus, with different releases of a language''s
    VM or runtime, the implementation of these systems is always changing and evolving.
    What''s important for application developers is to maintain a good working model
    of how the garbage collector for their languages and how they can be sympathetic
    with that behavior without being concerned with the implementation.


    As of version 1.16, the Go programming language uses a non-generational, noncompacting,
    concurrent tri-color mark and sweep collector. If you want to see how a mark and
    sweep collector works, Ken Fox wrote this great article and provides an animation.


    ```

    https://spin.atomicobject.com/2014/09/03/visualizing-garbage-collection-algorithms

    ```


    The implementation of Go''s collector has changed and evolved with every release
    of Go. So any post that talks about the implementation details will no longer
    be accurate once the next version of the language is released.


    With all that said, the modeling I will do in this post will not focus on the
    actual implementation details. The modeling will focus on the behavior you will
    experience and the behavior you should expect to see for years to come. In this
    post, I will share with you the behavior of the collector and explain how to be
    sympathetic with that behavior, regardless of the current implementation or how
    it changes in the future. This will make you a better Go developer.


    Here is more reading you can do about garbage collectors and Go''s actual collector
    as well.


    ```

    https://github.com/ardanlabs/gotraining/tree/master/reading/garbage-collection

    ```


    I will never refer to the heap as a container that you can store or release values
    from. It''s important to understand that there is no linear connection of memory
    that defines the "Heap". Think that any memory reserved for application use in
    the process space is available for heap memory allocation. Where any given heap
    memory allocation is virtually or physically stored is not relevant to our model.
    This'
