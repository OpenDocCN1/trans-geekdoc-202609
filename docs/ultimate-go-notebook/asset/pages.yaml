  md: "# 4.10 Polymorphism\n\nPolymorphism means that a piece of code changes its\
    \ behavior depending on the concrete data it's operating on. This was said by\
    \ Tom Kurtz, who is the inventor of BASIC. This is the definition we will use\
    \ moving forward.\n\nListing 4.28\n\n```\n// retrieve can read any device and\
    \ process the data.\nfunc retrieve(r reader) error {\n\tdata := make([]byte, 100)\n\
    \n\tlen, err := r.read(data)\n\tif err != nil {\n\t\treturn err\n\t}\n\n\tfmt.Println(string(data[:len]))\n\
    \treturn nil\n}\n```\n\nTake a look at the type of data this function accepts.\
    \ It wants a value of type that's impossible since reader is an interface and\
    \ interfaces are valueless types. It can't be asking for a reader value, they\
    \ don't exist.\n\nIf the function is not asking for a reader value then what is\
    \ the function asking for? It is asking for the only thing it can ask for, concrete\
    \ data.\n\nThe function retrieve is a polymorphic function because it's asking\
    \ for concrete data not based on what the data is (concrete type), but based on\
    \ what the data can do (interface type).\n\nListing 4.29\n\n```\nf := file(\"\
    data.json\")\np := pipe(\"cfg_service\")\n\nretrieve(f)\nretrieve(p)\n```\n\n\
    I can construct two concrete values, one of type file and one of type pipe. This\
    \ function is because each of these values can pass a copy of each value to the\
    \ polymorphic method set of behavior defined by the reader implement the interface.\n\
    \nWhen the concrete file value is passed into retrieve, the value is stored inside\
    \ a two word internal type representing the interface value."
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/8be06d78925d0d5a2d2ade851e9bad63_80_0.png)


    The second word of the interface value points to the value being stored. In this
    case, it''s a copy of the file value since semantics are at play. The first word
    points to a special data structure that is called the iTable.


    The iTable serves two purposes:


    +   - It describes the type of value being stored. In my case, it''s a file value.

    - It provides function pointers to the concrete implementations of the method
    set for the type of value being stored.


    When the read call is made against the interface value, an iTable lookup is performed
    to find the concrete implementation of the read method associated with the type.
    Then the method call is made against the value being stored in the second word.


    I can say retrieve is a polymorphic function because the concrete value pipe can
    be passed into retrieve and now the call to read against the interface value changes
    its behavior. This time that call to read is reading a network instead of reading
    a file.


    #  4.11 Method Set Rules


    Implementing an interface using pointer semantics applies some constraints on
    interface compliance.'
