- pgno: 10
  md: '# Chapter 1: Introduction


    Prototype Driven Development with Data Oriented Design!


    It''s important that I prepare my mind for the material I''m about to review.
    This introduction provides thoughts and ideas to stimulate my initial understanding
    of the language, its roots, and general design philosophy. It''s written as a
    set of notes and not fluid content like I will find in the remaining chapters.


    Somewhere Along The Line


    +   - We became impressed with programs that contain large amounts of code.

    - We strove to create large abstractions in our code base.

    - We forgot that the hardware is the platform.

    - We lost the understanding that every decision comes with a cost.


    These Days Are Gone


    +   - We can throw more hardware at the problem.

    - We can throw more developers at the problem.


    Open My Mind


    +   - Technology changes quickly but people''s minds change slowly.

    - Easy to adopt new technology but hard to adopt new ways of thinking.


    Interesting Questions – What do they mean to me?


    +   - Is it a good program?

    - Is it an efficient program?

    - Is it correct?

    - Was it done on time?

    - What did it cost?


    Aspire To


    +   - Be a champion for quality, efficiency and simplicity.

    - Have a point of view.

    - Value introspection and self-review.


    # 1.1 Reading Code


    Go is a language that focuses on code being readable as a first principle.


    # Quotes


    +   - "If most computer people lack understanding and knowledge, then what they
    will select will be lacking." - Alan Kay

    - "The software business is one of the few we teach people to write before we
    teach them to read." - Tom Love (inventor of Objective C)

    - "Code is read more times than it is written." - Dave Cheney

    - "Programming is, among other things, a kind of writing. One way to learn is
    to write, but in all other forms of writing, one also reads. We read"'
  merge: -1
  img_proc: true
