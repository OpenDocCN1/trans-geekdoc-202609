  md: "# Listing 7.3\n\n```\npackage sample_test\n\nimport (\n    \"testing\"\n  \
    \  \"http\"\n)\n\nfunc TestDownload(t *testing.T) {\n    url := \"https://www.ardanlabs.com/blog/index.xml\"\
    \n    statusCode := 200\n\n    resp, err := http.Get(url)\n    if err != nil {\n\
    \        t.Fatalf(\"unable to issue GET on: %s: %s\", url, err)\n    }\n    defer\
    \ resp.Body.Close()\n\n    if resp.StatusCode != statusCode {\n        t.Log(\"\
    exp:\", statusCode)\n        t.Log(\"got:\", resp.StatusCode)\n        t.Fatal(\"\
    status codes don't match\")\n    }\n}\n```\n\nIn this test, I plan to test the\
    \ ability to download the RSS feed for Ardan Labs blog. First, I declare some\
    \ variables with the URL to download and the expected status code. I then perform\
    \ the httpGet call for the URL and check the error. It is critical that any function\
    \ that returns an error has the error value checked. If there is an error, I call\
    \ t.Fatal to report the problem and the test fails. If there is no error, I proceed\
    \ to the next step which is checking the status code.\n\nBefore checking the status\
    \ code, I prepare the close call for the response body. Always write tests like\
    \ production code. If I don't get back the status code I expect, I provide verbose\
    \ information about what I expected and what I got. This really helps with debugging\
    \ failed tests. Then I call t.Fatal to report the test has failed. This is a test\
    \ that only outputs information if the test fails.\n\n# 7.2 Table Unit Test\n\n\
    Table tests can be powerful when I have code that can be run through a series\
    \ of different inputs and expected outputs. They are perfect for negative path\
    \ testing."
