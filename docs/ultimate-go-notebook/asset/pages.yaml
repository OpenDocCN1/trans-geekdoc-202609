    a collection from starting. What''s worse is the other P''s can''t service any
    other Goroutines while the collector waits.


    It''s critically important if you are using a version of Go prior to 1.14, that
    Goroutines make function calls in reasonable timeframes.


    # Marking - Concurrent


    Once the Write Barrier is turned on, the collector commences with the Marking
    phase. The first collector does take 25% of the all CPU capacity for itself. The
    collector uses Goroutines to do the collection work and needs the same P''s and
    M''s the application Goroutines use. This means for our 4 threaded Go program,
    one entire P will be dedicated to collection work.


