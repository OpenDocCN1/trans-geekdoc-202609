- pgno: 349
  md: '![](img/8be06d78925d0d5a2d2ade851e9bad63_349_0.png)


    Figure 18 is showing STW latency where all the Goroutines are stopped. This happens
    twice every collection. If your application is healthy, the collector should be
    able to keep the total STW time at or below 100 microsecond for the majority of
    collections.


    You now know the different phases of the collector, how memory is sized, how pacing
    works, and the different latencies the collector inflicts on your running application.
    With all that knowledge, the question of how you can be sympathetic with the collector
    can finally be answered.


    # Being Sympathetic


    Being sympathetic with the collector is about reducing stress on heap memory.
    Remember, stress can be defined as how fast the application is allocating heap
    memory within a given amount of time. When stress is reduced, the latencies inflicted
    by the collector will be reduced. It''s the GC latencies that are slowing down
    your application.


    The way to reduce GC latencies is by identifying and removing unnecessary allocations
    from your application. Doing this will help the collector to:


    +   * Maintain the smallest heap possible.

    * Find an optimal consistent pace.

    * Stay within the goal for every collection.

    * Minimize the duration of every collection, STW and Mark Assist.


    All these help reduce the amount of latency the collector will inflict on your
    running application. That will increase the performance and throughput of your
    application. The pace of the collection has nothing to do with it.


    # Conclusion


    If you take the time to focus on reducing allocations, you are doing what you
    can as a Go developer to be sympathetic with the garbage collector. You are not
    going to'
