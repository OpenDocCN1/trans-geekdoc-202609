  md: "# Listing 4.30\n\n```\ntype notifier interface {\n  notify()\n}\n\type user\
    \ struct {\n  name string\n  email string\n}\n\nfunc (u *user) notify() {\n  fmt.Printf(\"\
    Sending User Email To %s\\n\", u.name, u.email)\n}\n\nfunc sendNotification(n\
    \ notifier) {\n  n.notify()\n}\n\nfunc main() {\n  u := user(\"Bill\", \"bill@email.com\"\
    )\n  sendNotification(u)\n}\n```\n\nThe notifier interface is implemented by the\
    \ user type using pointer semantics. When value semantics are used to make the\
    \ polymorphic call, the following compiler message is produced.\n\n> \"cannot\
    \ use u (type user) as type notifier in argument to sendNotification: user does\
    \ not implement notifier (notify method has pointer receiver)\"\n\nThis is because\
    \ there is a special set of rules in the specification about method sets. These\
    \ rules define what methods are attached to values and pointers of a type. They\
    \ are in place to maintain the highest level of integrity in my program.\n\nThese\
    \ are the rules defined in the specification:\n\n+   - For any value of T, only\
    \ those methods implemented with a value receiver for that type belong to the\
    \ method set of value.\n- For any address of T, all methods implemented for that\
    \ type belong to the method set of that value.\n\nIn other words, when working\
    \ with an address (pointer), all methods implemented are attached and available\
    \ to be called. When working with a value, only those methods implemented with\
    \ value receivers are attached and available to be called.\n\nIn the previous\
    \ lesson about methods, I was able to call a method against a concrete piece of\
    \ data regardless of the data semantics declared by the receiver. In this case,\
    \ a value is being stored inside an interface and the methods must exist. No adjustments\
    \ can be made."
  merge: -1
  img_proc: true
- pgno: 82
  md: "The question now becomes: Why can't methods implemented with pointer receivers\
    \ be attached to values of type T? What is the integrity issue?\n\nOne reason\
    \ is because I can't guarantee that every value of type T is addressable. If a\
    \ value doesn't have an address, it can't be shared.\n\n# Listing 4.31\n\n```\n\
    type duration int\n\nfunc (d *duration) notify() {\n    fmt.Println(\"Sending\
    \ Notification in\", *d)\n}\n\nfunc main() {\n    duration(42).notify()\n}\n\n\
    Compiler Error:\ncannot call pointer method on duration(42)\ncannot take the address\
    \ of duration(42)\n```\n\nIn this example, the value of 42 is a constant of kind\
    \ int. Even though the value is converted into a value of type duration, it's\
    \ not stored inside a variable. This means the value is never on the stack or\
    \ heap. There isn't an address. Constants only live at compile time.\n\nThe second\
    \ reason is the bigger reason. The compiler is telling me that I am not allowed\
    \ to use value semantics. In other words, I am forced to share the value with\
    \ the interface since it's not safe to make a copy of a value that a pointer points\
    \ to. If I chose to implement the method with pointer semantics, I am stating\
    \ that a value of this type isn't safe to be copied.\n\n# Listing 4.32\n\n```\n\
    func main() {\n    u := user(\"Bill\", \"bill@email.com\")\n    sendNotification(&u)\n\
    }\n```\n\nTo fix the compiler message, I must use pointer semantics on the call\
    \ to the polymorphic function and share u. The answer is not to change the method\
    \ to use value semantics.\n\n# 4.12 Slice of Interface\n\nWhen I declare a slice\
    \ of an interface type, I'm capable of grouping different concrete values together\
    \ based on what they can do. This is why Go doesn't need the concept of sub-typing.\
    \ It's not about a common DNA, it's about a common behavior."
  merge: -1
  img_proc: true
