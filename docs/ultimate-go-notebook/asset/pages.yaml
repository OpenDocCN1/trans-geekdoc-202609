- pgno: 106
  md: "These things I've heard from other developers.\n\n\"I'm using interfaces because\
    \ we have to use interfaces\"\n\nNo. We don't have to use interfaces. We use interfaces\
    \ when it's practical and reasonable to do so. There is a cost of using interfaces:\
    \ a level of indirection and allocation when we store concrete values inside of\
    \ them. Unless the cost of the allocation is worth what I'm gaining by decoupling,\
    \ I shouldn't use interfaces.\n\n\"I need to be able to test my code so I need\
    \ to use interfaces\"\n\nNo. I must design my API for the first user, not my test.\
    \ If the API is not testable, I should consider if it's usable. There are different\
    \ layers of API's as well. The lower level unexported API's can and should focus\
    \ on testability. The higher level exported API's need to focus on usability.\n\
    \nFunctions that accept raw data in and return raw data out are most testable.\
    \ Separate the data transformation from where the data comes from and where it\
    \ is going. This is a refactoring exercise I need to perform during the engineering\
    \ coding cycle.\n\nBelow is an example that creates interface pollution by improperly\
    \ using an interface when one is not needed.\n\n# Listing 5.35\n\n```\ntype Server\
    \ interface {\n    Start() error\n    Stop() error\n    Wait() error\n}\n```\n\
    \nThe Server interface defines a contract for TCP servers. The problem here is\
    \ I don't need a contract, I need an implementation. There will be only one implementation\
    \ as well, especially since I am the one implementing it. I do not need someone\
    \ else to implement this for me.\n\nPlus, this interface is based on a noun and\
    \ not a verb. Concrete types are nouns they represent the concrete problem. Interfaces\
    \ describe the behavior and Server is not behavior.\nHere are some ways to identify\
    \ interface pollution:\n\n+   - A package declares an interface that matches the\
    \ entire API of its own concrete type.\n- The interfaces are exported but the\
    \ concrete types implementing the interface are unexported."
