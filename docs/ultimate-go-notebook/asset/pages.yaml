- pgno: 320
  md: '# 14.5 Scheduling In Go: Concurrency


    # Introduction


    When I''m solving a problem, especially if it''s a new problem, I don''t initially
    think about whether concurrency is a good fit or not. I look for a sequential
    solution first and make sure that it''s working. Then, after readability and technical
    reviews, I will begin to ask the question if concurrency is reasonable and practical.
    Sometimes it''s obvious that concurrency is a good fit and other times it''s not
    clear.


    In this post, I will begin to bring the mechanics and semantics of the OS and
    Go schedulers together to provide a deeper understanding on what concurrency is
    and isn''t.


    The goals of this post are:


    +   - Provide guidance on the semantics you must consider to determine if a workload
    is suitable for using concurrency.

    - Show how different types of workloads change the semantics and therefore the
    engineering decisions you will want to make.


    # What is Concurrency


    Concurrency means undefined out of order execution. Taking a set of instructions
    that would otherwise be executed in sequence and finding a way to execute them
    out of order and still produce the same result. For the problem in front of you,
    it has to be obvious that out of order execution would add value. When I say value,
    I mean enough of a performance gain for the complexity cost. Depending on your
    problem, out of order execution may not be possible or even make sense.


    It''s important to understand that concurrency is not the same as parallelism.


    https://blog.golang.org/concurrency-is-not-parallelism


    Parallelism executing two or more instructions at the same time. This is a different
    concept from concurrency. Parallelism is only possible when you have at least
    two operating system (OS) and hardware threads available to you, and you have
    at least two Goroutines, each executing instructions independently on separate
    OS/hardware threads.'
