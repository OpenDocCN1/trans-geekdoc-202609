    # 2.9 Pointers


    Pointers serve the purpose of sharing values across program boundaries. There
    are several types of program boundaries. The most common one is between function
    calls. There is also a boundary between Goroutines which I have notes for later.


    When a Go program starts up, the Go runtime creates a Goroutine. Goroutines are
    lightweight application threads with many of the same semantics as operating system
    threads. Their job is to manage the physical execution of a distinct set of instructions.
    Every Go program has at least1 Goroutine that I call the main Goroutine.


    Each Goroutine is given its own block of memory called a stack. Each stack starts
    out as a 2048 byte (2k) allocation. It''s very small, but stacks can grow in size
    over time.


    Figure 2.4


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_32_0.png)


    Every time a function is called, a block of stack space is taken to help the Goroutine
    execute the instructions associated with that function. Each individual block
    of memory is called a frame.


    The size of a frame for a given function is calculated at compile time. No value
    be constructed on the stack unless the compiler knows the size of that value at
    compile time. If the compiler doesn''t know the size of a value at compile time,
    the value has to be constructed on the heap.


    Stacks are self cleaning and zero value helps with the initialization of the stack.
    Every time I make a function call, and a frame of memory is blocked out, the memory
    for that frame is initialized, which is how the stack is self cleaning. On a'
