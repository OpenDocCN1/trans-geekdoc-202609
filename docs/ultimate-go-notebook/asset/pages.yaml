  md: "# Listing 7.10\n\n```\npackage handlers_test\n\nimport (\n    \"encoding/json\"\
    \n    \"net/http\"\n    \"net/http/httptest\"\n    \"testing\"\n\n    \"github.com/ardanlabs/gotraining/app/handlers\"\
    \n)\n\nfunc init() {\n    handlers.Routes()\n}\n\nfunc TestSendJSON(t *testing.T)\
    \ {\n    url := \"/sendjson\"\n    statusCode := 200\n\n    r := httptest.NewRequest(\"\
    GET\", url, nil)\n    w := httptest.NewRecorder()\n    http.DefaultServeMux.ServeHTTP(w,\
    \ r)\n}\n```\n\nThe first thing the test does is use the init function to make\
    \ sure all the routes are loaded in the mux. This is done by calling the handlers.Routes\
    \ function. A big mistake that is made with these types of tests is forgetting\
    \ to load the routes.\n\nWith the routes loaded, the next step is to construct\
    \ a request and construct a value that implements the http.ResponseWriter interfaces.\
    \ The httptest package provides support for both. The Hptest.NewRequest constructs\
    \ the request as a GET for the /sendjson route. The httptest.NewRecorder constructs\
    \ the concrete value that implements the http.ResponseWriter interfaces and can\
    \ be directly checked to validate if the web call passed or failed.\n\nThe key\
    \ to running the test is calling the ServeHTTP function from the mux. Since I\
    \ am using the http.DefaultServer mux in this code, that is where I am making\
    \ the call to ServeHTTP. Any mux I may choose to use will implement this method.\
    \ Once I call this method, I am asking the mux to process the request through\
    \ the route and apply the response in the concrete recorder value."
