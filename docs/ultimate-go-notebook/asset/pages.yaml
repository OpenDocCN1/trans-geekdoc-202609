- pgno: 249
  md: "Listing 12.16\n\n```\nfunc freq(top string, docs []string) int {\n    var found\
    \ int32\n\n    g := runtime.GOMAXPROCS(0)    <-- CHANGED\n    var wg sync.WaitGroup\n\
    \    wg.Add(g)\n\n    ch := make(chan string, g)      <-- ADDED\n\n    for i :=\
    \ 0; i < g; i++ {         <-- CHANGED\n        go func() {                 <--\
    \ CHANGED\n            var lFound int32\n            defer func() {\n        \
    \        atomic.AddInt32(&found, lFound)\n                wg.Done()\n        \
    \    }()\n\n            for doc := range ch {       <-- ADDED\n              \
    \  ...                     <-- CHANGED\n            }\n        }()\n    }\n}\n\
    ```\n\nThe first change is to set the number of Goroutines to match the number\
    \ of Goroutines that can be run in parallel. The runtime.GOMAXPROCS function when\
    \ passing zero is the best way to get that number. Using more Goroutines in a\
    \ situation like this rarely improves the performance in any significant way.\n\
    \nNext, a channel is added to have the ability to signal work into the pool. The\
    \ size of the buffer matches the number of Goroutines since staging more work\
    \ than their Goroutines doesn't add value.\n\nThe loop is changed to reflect only\
    \ creating g Goroutines. I don't need to pass a document into the Goroutine anymore\
    \ since that's coming from the channel. The defer function requires no changes.\n\
    \nInside the Goroutine, a-range loop is added for receiving documents through\
    \ the channel. The existing code to process a document is placed inside the channel\
    \ loop and doesn't need to change.\n\nOutside the for loop that creates the pool\
    \ of Goroutines is a second loop to feed the documents into the pool."
  merge: -1
  img_proc: true
- pgno: 250
  md: "# Listing 12.17\n\n```\nfunc freq(topic string, docs []string) int {\n  ..\n\
    \  for i := 0; i < g; i++ {\n    ..\n  }\n  for _, doc := range docs {\n    ch\
    \ <- doc <-- ADDED\n  } <-- ADDED\n  close(ch) <-- ADDED\n  wg.Wait()\n  return\
    \ int(found)\n}\n```\n\nWhile the pool of Goroutines is waiting for work, this\
    \ second loop begins to signal work into the pool. Once the last signal is sent,\
    \ the channel is closed and then freq waits for the Goroutines to process the\
    \ remaining work and report they are done.\n\nOne big benefit to this version\
    \ of freq is it's more sympathetic with the caching system.\n\n# Listing 12.18\n\
    \n```\nfunc freq(topic string, docs []string) int {\n  ..\\n  for i := 0; i <\
    \ g; i++ {\n    go func() {\n      var l1Found int32\n      defer func() {\n \
    \       atomic.AddInt32(&found, l1Found)\n      wg.Done()\n    }()()\n  }\n  }\n\
    ```\n\nRegardless of the number of documents to process, the defer function only\
    \ needs to execute g number of times. On my machine that is 16 times. All of the\
    \ counting happens on the local lFound variable, eliminating atomic synchronization\
    \ and cache thrashing.\n\n# 12.8 Pooling Results\n\nWith the more efficient pooling\
    \ algorithm in place, I should see better performance."
