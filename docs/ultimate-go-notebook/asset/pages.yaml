  md: "# Chapter 8: Benchmarking\n\nIn this chapter, I will learn how to write benchmarks\
    \ in Go and use the integrated support provided by the language. I will also learn\
    \ how to realize that benchmarks lie and I need to be careful when interpreting\
    \ the results.\n\n# 8.1 Basic Benchmark\n\nBenchmarks lie! At the same time, until\
    \ I run a benchmark I’m only guessing. There's one thing about Go, it's that I\
    \ never have to guess. That's how good the tooling is.\n\nThe standard library\
    \ and the Go frontend tooling has everything I need to write a benchmark. It all\
    \ starts with creating a file with the _test.go naming convention inside the package\
    \ I want to benchmark, and then adding benchmark functions by using the word Benchmark\
    \ with a capital B for each function.\n\nListing 8.1\n\n```\nsample_test.go\n\
    package sample\n\nimport (\n\t\"testing\"\n)\n\nfunc BenchmarkDownload(b *testing.B)\
    \ {}\nfunc BenchmarkUpload(b *testing.B) {}\nn\n```\n\nThese are examples of benchmark\
    \ functions I could declare in the sample_test.go testing file. It's important\
    \ that the first letter following the word Benchmark in the function starts with\
    \ a capital letter. If I don’t, the testing tool won’t see the function as a benchmark\
    \ function. The other important piece is that the benchmark function takes a testing.B\
    \ pointer as the only argument.\n\nHere is a super interesting benchmark to run."
