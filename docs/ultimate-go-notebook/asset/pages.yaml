    # 3.2 Translation Lookaside Buffer (TLB)


    Each running program is a full memory map of virtual memory by the OS and that
    running program have they all of the physical memory on the machine. However,
    physical memory needs to be shared with all the running programs. The operating
    system shares physical memory by breaking the physical memory into pages and mapping
    pages to virtual memory for any given running program. Each OS can decide the
    size of a page, but 4k, 8k, 16k are reasonable and common sizes.


    The TLB is a small cache that the processor handles to reduce latency on translating
    a virtual address to a physical address within the scope of an OS page and offset
    miss the TLB cache can cause large latencies because the the has to wait for the
    OS to scan its page table to locate the right page for the virtual address in
