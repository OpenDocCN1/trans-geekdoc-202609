  md: '# GC Percentage


    There is a configuration option in the runtime called GC Percentage, which is
    set to 100 by default. This value represents a ratio of how much new heap memory
    can be allocated before the next collection has to start. Setting the GC Percentage
    to 100 means, based on the amount of heap memory marked as live after a collection
    finishes, the next collection has to start at or before 100% more allocations
    are added to heap memory.


    As an example, imagine a collection finishes with 2MB of heap memory in-use.


    Note: The diagrams of the heap memory in this post do not represent a true profile
    when using Go. The heap memory in Go will often be fragmented and messy, and you
    don''t have the clean separation as the images are representing. These diagrams
    provide a way to visualize heap memory in an easier to understand way that is
    accurate towards the behavior you will experience.


    Figure 10


    | 2MB In-Use |

    |---||

    | | | | | | | | | | | | | | | | |


    Figure 10 shows the 2MB of heap memory in-use after the last collection finished.
    Since the GC Percentage is set to 100%, the next collection needs to start at
    or before 2 more MB of heap memory is added.


    Figure 11


    | 2MB In-Use | 2MB Newly Allocated |

    |---|---|

    | | | | | | | | | | | | | | | | | | |


    Figure 11 shows that 2 more MB of heap memory is now in-use. This will trigger
    a collection. A way to view all of this in action, is to generate a GC trace for
    every collection that takes place.


    # GC Trace


    A GC trace can be generated by including the environment variable GODEBUG with
    the gctrace=1 option when running any Go application. Every time a collection
    happens, the runtime will write the GC trace information to stderr.'
  merge: -1
  img_proc: true
