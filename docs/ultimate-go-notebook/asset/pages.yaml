    #  3.5 Iterating Over Collections\n\nGo provides two different semantics for iterating\
    \ over a collection. I can iterate using value semantics or pointer semantics.\n\
    \nListing 3.8\n\n```\n// Value Semantic Iteration\nfor i, fruit := range strings\
    \ {\n    println(i, fruit)\n}\n\n// Pointer Semantic Iteration\nfor i := range\
    \ strings {\n    println(i, strings[i])\n}\n```\n\nWhen using value semantic iteration,\
    \ two things happen. First, the collection I'm iterating over is copied and I\
    \ iterate over the copy. In the case of an array, the copy could be expensive\
    \ since the entire array is copied. In the case of a slice, there is no real cost\
    \ since only the internal slice value is copied and not the backing array. Second,\
    \ I get a copy of each element iterated on.\n\nWhen using pointer semantic iteration,\
    \ I iterate over the original collection and I access each element associated\
    \ with the collection directly.\n\n#  3.6 Value Semantic Iteration\n\nGiven the\
