- pgno: 319
  md: 'Since all ~context switching is happening at the application level, we don''t
    lose the same ~12k instructions per context switch that we were losing when using
    Threads. In Go, those context switches are costing you ~200ns or ~2.4k instructions.
    The scheduler is also helping with gains on cache-line efficiencies and NUMA.
    This is why we don''t need Threads than we have virtual cores. In Go, it''s possible
    to get more work done, over time, because the Go scheduler attempts to use less
    Threads and do more on each Thread, which helps to reduce load on the OS and the
    hardware.


    # Conclusion


    The Go scheduler is really amazing in how the design takes into account the intricacies
    of how the OS and the hardware work. The ability to turn I/O-Bound work into CPU-Bound
    work at the OS level is where we get a big win in leveraging more CPU capacity
    over time. This is why you don''t need more OS Threads than you have virtual cores.
    You can reasonably expect to get all of your work done (CPU and I/O Bound) with
    just one Thread per virtual core. Doing so is possible for networking apps and
    other apps that don''t need system calls that block OS Threads.


    As a developer, you still need to understand what your app is doing in terms of
    the kinds of work you are processing. You can''t create an unlimited number of
    Goroutines and expect amazing performance. Less is always more, but with the understanding
    of these Go-scheduler semantics, you can make better engineering decisions.'
  merge: -1
