  md: '# 14.3 Scheduling In Go: OS Scheduler


    # Introduction


    The design and behavior of the Go scheduler allows your multithreaded Go programs
    to be more efficient and performant. This is thanks to the mechanical sympathies
    of the Go scheduler has for the operating system (OS) scheduler. However, if the
    design and behavior of your multithreaded Go software is not mechanically sympathetic
    with how the scheduler work, none of this will matter. It''s important to have
    a general and representative understanding of how both the OS and Go schedulers
    work to design your multithreaded software correctly.


    This multi-part article will focus on the higher-level mechanics and semantics
    of the scheduler. I will provide enough details to allow you to visualize how
    things work so you can make better engineering decisions. Even though there is
    a lot that goes into the engineering decisions you need to make for multithreaded
    applications, the mechanics and semantics form a critical part of the foundational
    knowledge you need.


    # OS Scheduler


    Operating system schedulers are complex pieces of software. They have to take
    into account the layout and setup of the hardware they run. This includes is not
    limited to the existence of multiple processors and cores, CPU caches and NUMA.


    http://frankdenemann.nl/2016/07/06/introduction-2016-numa-deep-dive-series


    Without this knowledge, the scheduler can''t be as efficient as possible. What''s
    great is you can still develop a good mental model of how the OS scheduler works
    without going deep into these topics.


    Your program is just a series of machine instructions that need to be executed
    one after the other sequentially. To make that happen, the operating system uses
    the concept of a Thread. It''s the job of the Thread to account for and sequentially
    execute the set of instructions it assigned. Execution continues until there are
    no more instructions for the Thread to execute. This is why I call a Thread path
    of execution.


    Every program you creates a Process and each Process is an initial Thread. Threads
    have the ability to create more Threads. All these different Threads independently
    of each other and scheduling decisions are made at the Thread level, not at the
    Process level. Threads can run concurrently (each taking a turn on an individual
    core), or in parallel (each running at the same time on different'
  merge: -1
