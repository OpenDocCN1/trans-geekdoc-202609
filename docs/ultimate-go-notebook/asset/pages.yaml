    # Listing 3.33


    ```

    for i, r := range s {

    ```


    When iterating over a string, the iteration moves code point by code point. Go
    has an alias type named rune (alias of int32) that represents a code point. Hence
    the use of the variable r as the value being copied.


    On the first iteration, i will equal 0. On the next iteration, i will equal 3.
    Then in the next iteration, i will equal 6. All subsequent iterations will increment
    i by 1.


    # Listing 3.34


