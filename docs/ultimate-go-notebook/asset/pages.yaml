  md: "# 4.14 Exporting\n\nExporting provides the ability to declare an identifier\
    \ is accessible to code outside of the package it's declared in. A package is\
    \ the basic unit of compiled code in Go. It represents a physical compiled unit\
    \ of code, usually as a compiled library on the host operating system. Exporting\
    \ determines access to identifiers across package boundaries.\n\nListing 4.42\n\
    \n```\npackage counters\ntype AlertCounter int\n```\n\nIn this case, since a capital\
    \ letter is being used to name the type AlterCounter, the type is exported and\
    \ can be referenced directly by code outside of the counters package.\n\nListing\
    \ 4.43\n\n```\npackage counters\ntype alertCounter int\n```\n\nNow that I changed\
    \ the type's name to start with a lowercase letter, the type is unexported. This\
    \ means only code inside the counters package can reference this type directly.\n\
    \nListing 4.44\n\n```\npackage counters\ntype alertCounter int\nfunc New(value\
    \ int) alertCounter {\n  return alertCounter(value)\n}\n```\n\nEven though the\
    \ code above is legal syntax and will compile, there is no value in it. Returning\
    \ a value of an unexported type is confusing since the caller (who will probably\
    \ exist in a different package) can't reference the type name directly."
  merge: -1
  img_proc: true
