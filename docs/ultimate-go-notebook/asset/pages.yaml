- pgno: 53
  md: 'perform mutation since the mutation is being performed on the function''s own
    copy of the data isolation.


    Append always maintains a contiguous block of memory for the slice''s backing
    array, even after growth. This is important for the hardware.


    Figure 3.6


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_53_0.png)


    After the call to append to add the number 75, a new backing array is constructed
    and linked into the slice.


    Every time the append function is called, the function checks if the length and
    capacity of the slice is the same or not. If it''s the same, it means there is
    no more room in the backing array for the new value. In this case, append creates
    a backing array (doubling or growing by 25%) and then copies the values from the
    old array into the new one. Then the new value can be appended.


    Figure 3.7


    ![](img/8be06d78925d0d5a2d2ade851e9bad63_53_1.png)


    After the call to append to add the number 32, the existing backing array has
    capacity so it is brought into the length.


    If it''s not the same, it means that there is an extra element of capacity existing
    for the append. An element is taken from capacity and added to the length of the
    slice. This makes an append operation very efficient.


    When the backing array has 1024 elements of capacity or less, new backing arrays
    are constructed by doubling the size of the existing array. Once the backing array
    grows past 1024 elements, growth happens at 25%.'
