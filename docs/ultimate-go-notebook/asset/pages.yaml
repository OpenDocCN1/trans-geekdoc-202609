  md: "# Listing 9.33\n\n```\nfunc main() {\n  duration := 100 * time.Millisecond\n\
    \  ctx, cancel := context.WithTimeout(context.Background(), duration)\n  defer\
    \ cancel()\n\n  dwf := func(ctx context.Context) string {\n    time.Sleep(time.Duration(rand.Intn(200))\
    \ * time.Millisecond)\n    return \"work complete\"\n  }\n  result := doWork(ctx,\
    \ dwf)\n\n  select {\n  case v := <-result:\n    fmt.Println(\"main: \", v)\n\
    \  case <-ctx.Done():\n    fmt.Println(\"main: timeout\")\n  }\n}\n```\n\nOutput:\n\
    doWork : work complete\nmain: work complete\n\nThe program starts by declaring\
    \ a context that will timeout waits up to 100 milliseconds. Then a function is\
    \ declared that waits up to 200 milliseconds before returning the string, \"work\
    \ complete\". With the context and the work function in place, a call to doWork\
    \ is made and a channel of type string is returned and assigned to the variable\
    \ result.\n\nThe compiler is able to determine the concrete type to use for the\
    \ generic type Result by inspecting the return type of the literal work function\
    \ that is passed into the doWork function. This is brilliant because it means\
    \ I didn't have to pass the type in the call to doWork.\n\nWith the channel of\
    \ type string assigned to the variable, a select case is used to wait for the\
    \ result to be returned on time, or for the timeout to occur. The doWork function\
    \ can be used to perform this concurrent work for any concrete type required.\n\
    \nThis same idea could be applied to a pool of goroutines that could execute work\
    \ on a generic input and return a generic result.\n\n# Listing 9.34\n\n```\ntype\
    \ workFn[Input any, Result any] func(input Input) Result\n```\n\nIn this example,\
    \ I changed the function type to accept a generic input and return a generic result."
