    # Work Stealing


    Another aspect of the scheduler is that it''s a work-stealing scheduler. This
    helps in a few areas to keep scheduling efficient. For one, the last thing you
    want is an M to move into a waiting state because, once that happens, the OS will
    context-switch the M off the Core. This means the P can''t get any work done,
    even if there is a Goroutine in a runnable state, until an M is context-switched
    back on a Core. The work stealing also helps to balance the Goroutines across
    all the P''s so the work is better distributed and getting done more efficiently.


    Let''s run through an example.'
