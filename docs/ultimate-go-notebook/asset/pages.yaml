    \    []byte(\"abc\"), []byte(\"abc\"),\n    []byte(\"elvis\"), []byte(\"Elvis\"\
    ),\n    []byte(\"Elvis\"), []byte(\"AElvis\"),\n    []byte(\"abc\"), []byte(\"\
    Aabc\"),\n    []byte(\"eelvis\"), []byte(\"eeElvis\"),\n    []byte(\"aelis\"),\
    \ []byte(\"aaelis\"),\n    []byte(\"aabaeeelvis\"), []byte(\"aabaeeElvis\"),\n\
    \    []byte(\"e l v i s\"), []byte(\"e l v i s\"),\n    []byte(\"aa bb e l v i\
    \ saa\"), []byte(\"Aa bb l v i saa\"),\n    []byte(\"elvi s\"), []byte(\"elvi\
    \ s\"),\n    []byte(\"elvielis\"), []byte(\"elvielis\"),\n    []byte(\"elvielvieleiselvil\"\
    ), []byte(\"elvielviElviselvil\"),\n    []byte(\"elvielelmis\"), []byte(\"elviElvis\"\
    ),\n)\n```\n\nThis is a data table that represents the potential data from the\
    \ stream. It lays out the input stream and expected output stream.\n\n# Listing\
    \ 10.2\n\n```\nfunc assembleInputStream() []byte {\n    var in []byte\n    for\
    \ _, d := range data {\n        in = append(in, d.input...)\n    }\n    return\
    \ in\n}\n\nfunc assembleOutputStream() []byte {\n    var out []byte\n    for _,\
    \ d := range data {\n        out = append(out, d.output...)\n    }\n    return\
    \ out\n}\n```\n\nThese functions assemble the input and output into a single stream\
    \ for processing. With this in the place, here is an algorithm I wrote to solve\
    \ the problem."
