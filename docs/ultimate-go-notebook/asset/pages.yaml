    \ allow me to group concrete data together by what the data can do. It's about\
    \ focusing on what data can do and not what the data is. Interfaces also help\
    \ my code decouple itself from change by asking for concrete data based on what\
    \ it can do. It's not limited to one type of data.\n\nI must do my best to understand\
    \ what data changes are coming and use interfaces to decouple my program from\
    \ that change. Interfaces should describe behavior and not state. They should\
    \ be verbs and not nouns.\n\nGeneralized interfaces that focus on behavior are\
    \ best. Interfaces with more than one method have more than reason to change.\
    \ Interfaces that are based on nouns, tend to be less reusable, are more susceptible\
    \ to change, and defeat the purpose of the interface.\n\n76"
