    \n**Output:**\n![](Image00335.jpg)\n\nFrom the above output, you can see that\
    \ the customers are divided into five segments. The customers in the middle of\
    \ the plot (in purple) are the customers with average income and average spending.\
    \ The customers belonging to the red cluster are the ones with low income and\
    \ low spending. You need to target the customers who belong to the top right cluster\
    \ (sky blue). These are the customers with high incomes and high spending in the\
    \ past, and they are more likely to spend in the future, as well. So any new marketing\
    \ campaigns or advertisements should be directed to these customers.\n\n### Finding\
    \ Customers to Target for Marketing\n\nThe last step is to find the customers\
    \ who belong to the sky-blue cluster. To do so, we will first plot the centers\
    \ of the clusters.\n\n**Script 24:**\n![](Image00336.jpg)\n\nHere is the output.\
    \ From the output, it seems that the coordinates of the centroid for the top right\
    \ cluster are 86.53 and 82.12. The centroid values are located at index 1, which\
    \ is also the id of the cluster.\n\n**Output:**\n```\n[[26.30434783 20.91304348]\n\
    \ [86.53846154 82.12820513]\n [55.2962963  49.51851852]\n [88.2        17.11428571]\n\
    \ [25.72727273 79.36363636]]\n```\n\nTo fetch all the records from the cluster\
    \ with id 1, we will first create a dataframe containing index values of all the\
    \ records in the dataset and their corresponding cluster labels, as shown below.\n\
    \n**Script 25:**\n![](Image00337.jpg)\n\n**Output:**\n![](Image00338.jpg)\n\n\
    Next, we can simply filter all the records from the `cluster_map` dataframe, where\
    \ the value of the `cluster` column is 1. Execute the following script to do so.\n\
    \n**Script 26:**\n![](Image00339.jpg)\n\nHere are the first five records that\
    \ belong to cluster 1. These are the customers who have high incomes and high\
    \ spending, and these customers should be targeted during marketing campaigns.\n\
    \n**Output:**\n![](Image00340.jpg)\n\n# 7.2 Hierarchical Clustering\n\nLike K-Means\
    \ clustering, hierarchical clustering is another commonly used unsupervised machine\
    \ learning technique for data clustering. Hierarchical clustering can be divided\
    \ into two types: agglomerative clustering and divisive clustering. Agglomerative\
    \ clustering follows a bottom-up approach where individual data points are clustered\
    \ together to form multiple small clusters leading to a big cluster, which can\
    \ then be divided into small clusters using dendrograms. On the other hand, in\
    \ the case of divisive clustering, you have one big cluster, which you divide\
    \ into N number of small clusters. In this section, you will perform agglomerative\
    \ clustering using the Sklearn library.\n\n## Steps for Hierarchical Agglomerative\
    \ Clustering\n\nThe steps required to perform agglomerative clustering are as\
    \ follows:\n"
