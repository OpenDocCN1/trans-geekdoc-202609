    `10 is greater than 5`


    ### If-Elif Statement

    The `if-elif` statement comes handy when you have to evaluate multiple conditions.
    For instance, in the following example, we first check if `5 > 10`, which evaluates
    to false. Next, an `elif` statement evaluates the condition `8 < 4`, which also
    returns false. Hence, the code block that follows the last `else` statement executes.


