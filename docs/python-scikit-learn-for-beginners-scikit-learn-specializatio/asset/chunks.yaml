    # Data Preprocessing with Scikit-Learn


    With the huge amount of data at disposal, more and more researchers and industry
    professionals are finding ways to use this data for research and commercial benefits.
    However, most of the data available by default is too raw. It is important to
    preprocess it before it can be used to identify important patterns or can be used
    to train statistical models that can be used to make predictions. Data preprocessing
    involves cleaning and engineering data in a way that it can be used as input to
    several important data science tasks, such as data visualization, machine learning,
    deep learning, and data analytics. Some of the most common data preparation tasks
    include feature scaling, handling missing values, categorical variable encoding,
    data discretization, etc. Scikit-learn library contains various modules and libraries
    that you can employ to perform different types of data processing tasks, as you
    will in this chapter. So, let’s begin without much ado.


    ## 3.1 Feature Scaling


    A dataset can have different attributes. The attributes can have different magnitudes,
    variances, standard deviations, mean values, etc. For instance, salary can be
    in thousands, whereas age is normally a two-digit number. The difference in the
    scale or magnitude of attributes can actually affect statistical models. For instance,
    variables with bigger ranges dominate those with smaller ranges for linear models.
    In this section, you will see different feature scaling techniques.


    ### 3.1.1 Standardization


    Standardization is the process of centering a variable at zero and standardizing
    the data variance to 1. To standardize a dataset, you simply have to subtract
    each data point from the mean of all the data points and divide the result by
    the standard deviation of the data. Feature scaling is applied on numeric columns
    only. The following script imports the Titanic dataset and then filters the age,
    fare, and places columns. We will be applying feature scaling techniques on these
    three columns only.


    **Script 1:**

    ![](Image00062.jpg)


    **Output:**

    ![](Image00063.jpg)


    Let’s see the mean, std, min and max values for the `age`, `fare`, and `pclass`
    columns.


    **Script 2:**

    ![](Image00064.jpg)


    **Output:**

    ![](Image00065.jpg)


    You can see that the mean, min and max values for the three columns are very different.
    To standardize the data, you can use the `StandardScaler` class from the `sklearn.preprocessing`
    module. You have to pass the Pandas dataframe containing the dataset to the `fit()`
    method of the class and then to the `transform()` method of the class. The following
    script applies standard scaling on the `age`, `fare`, and `pclass` columns of
    the Titanic dataset.


    **Script 3:**

    ![](Image00066.jpg)


    The following script creates a dataframe of the scaled columns and displays the
    first five rows of the scaled dataset.


    **Script 4:**

    ![](Image00067.jpg)


    You can see from the output that values have been scaled.


    **Output:**

    ![](Image00068.jpg)


    The following script plots a kernel density plot for the unscaled columns.


    **Script 5:**

    ![](Image00069.jpg)


    **Output:**

    ![](Image00070.jpg)


    The following script plots a kernel density plot for the scaled columns.


    **Script 6:**

    ![](Image00071.jpg)


    **Output:**

    ![](Image00072.jpg)


    The output from scripts 5 and 6 shows that the standard scaling doesn’t actually
    affect the default data distribution.


    ### 3.1.2 Min/Max Scaling


    In min/max scaling, you subtract each value by the minimum value and then divide
    the result by the difference of minimum and maximum value in the dataset. To implement
    the min/max scaling, you can use the `MinMaxScaler` class from the `sklearn.preprocessing`
    module. You have to pass the Pandas dataframe containing the dataset to the `fit()`
    method of the class and then to the `transform()` method of the `MinMaxScaler`
    class. The following script implements min/max scaling on the `age`, `fare`, and
