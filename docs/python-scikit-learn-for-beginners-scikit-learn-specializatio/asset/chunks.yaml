    ## 3.2 Handling Missing Values


    Missing values, as the name suggests, are those observations in the dataset that
    do not contain any value. Missing values can totally change data patterns, and,
    therefore, it is extremely important to understand why missing values occur in
    the dataset and how to handle them. In this section, you will see examples of
    how you can use the Scikit-learn library to handle missing values. Data can be
    missed cause of two reasons:


    1.  **Missing Data Randomly**: When the missing observations do not relate to
    any other column in the dataset, we can say that data has been missed randomly.
    For instance, if you cannot find a person’s city in a dataset, it is missed randomly,
    and you cannot logically find the reason behind the missing value.


    2.  **Missing data not Randomly**: In this case, you can attribute the missing
    data to a logical reason. For instance, the research shows that depressed patients
    are more likely to leave empty fields in forms compared to the patients that are
    not depressed. Therefore, the missing data is not random; there has been an established
    reason for missing data.

