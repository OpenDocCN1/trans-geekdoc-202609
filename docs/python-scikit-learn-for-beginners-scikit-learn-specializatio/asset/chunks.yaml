    ## 3.3. Categorical Data Encoding


    Models based on statistical algorithms, such as machine learning and deep learning,
    work with numbers. However, datasets can contain numerical, categorical, date
    time, and mixed variables. A mechanism is needed to convert categorical data to
    its numeric counterpart so that the data can be used to build statistical models.
    The techniques used to convert numeric data into categorical data are called categorical
    data encoding schemes. In this section, you will see some of the most commonly
    used categorical data encoding schemes.


    ### 3.3.1 One Hot Encoding


    One hot encoding is one of the most commonly used categorical encoding schemes.
    In one hot encoding, for each unique value in the categorical column, a new column
    is added. Integer 1 is added to the column that corresponds to original label,
    and all the remaining columns are filled with zeros.


    Let’s take a look at a very simple example of one hot encoding. In the following
    table, we have a categorical column, Country. The column contains three unique
    values: USA, UK, and France.


    ![](Image00117.jpg)


    The following table contains the one hot encoded version of the above table. In
    the following table, you can see that three columns have been added, i.e., USA,
    UK, and FRANCE. In the original column, we had USA as the label in the first row
    of the Country column. In the newly added one hot encoded table, we have 1 in
    the USA column. Similarly, the original table contained UK as the label in the
    second row. In the one hot encoded table, we have 1 in the second row for UK column.


    ![](Image00118.jpg)


    As a matter of fact, you only need N-1 columns in the one hot encoded dataset
    for a column that originally contained N unique labels. Look at the following
    table:


    ![](Image00119.jpg)


