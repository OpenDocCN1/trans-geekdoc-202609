    ## 6.1.4 数据缩放/归一化


    在将数据传递给机器学习算法之前的最后一步（可选）是缩放数据。你可以看到，数据集的某些列包含较小的值，而其他列包含非常大的值。最好将所有值转换为统一的尺度。为此，你可以使用
    `sklearn.preprocessing` 模块中的 `StandardScaler()` 函数，如下所示：


