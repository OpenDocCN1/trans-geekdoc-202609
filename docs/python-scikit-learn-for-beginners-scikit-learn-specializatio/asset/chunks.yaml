    # 简介


    在本章中，你将学习什么是机器学习和数据科学，它们有何不同，以及成为机器学习数据科学专家需要采取哪些步骤。由于本书讲述的是 Scikit-learn 库在机器学习中的应用，本章还将简要回顾什么是
    Scikit-learn 以及你可以用它做什么。最后，还介绍了一些其他最常用的机器学习库。


    ## 1.1 什么是机器学习和数据科学？


    机器学习和数据科学应用正席卷全球。自动驾驶汽车、交互式机器人、像 Alexa 和 Siri 这样的个人助理，都是数据科学和机器学习的应用。数据科学和机器学习这两个术语经常被交替使用。然而，这两个术语是不同的。数据科学是一个研究领域，它利用科学方法和数学技术（如统计学）从数据中提取意义和洞见。正如西北大学的
    Thomas Miller 博士所言，数据科学是“信息技术、建模和业务管理的结合体”。另一方面，机器学习是一种由数学算法组成的方法，它使计算机能够在没有明确编程的情况下做出决策。相反，机器学习算法从数据中学习，然后基于从数据集中获得的洞见，在无需人工输入的情况下做出决策。在本书中，你将借助
    Python 的 Scikit-learn 库完成不同类型的机器学习项目。


    ## 1.2 Scikit-Learn 处于什么位置？


    大多数机器学习和数据科学模型都基于统计算法。你可以使用自己选择的编程语言来实现机器学习模型。然而，机器学习是一个经验性过程，你需要尝试并测试多种模型，以及各种参数和数据集的组合。此外，机器学习模型、预处理方法、模型评估和选择标准的数量之多，使得普通用户几乎不可能实现并测试所有内容。这就是
    Scikit-learn 发挥作用的地方。有了 Scikit-learn，你几乎拥有实现、测试和评估机器学习模型所需的一切。Scikit-Learn（[`scikit-learn.org/stable/`](https://scikit-learn.org/stable/)），也称为
    Sklearn，是最广泛使用的机器学习和数据科学库之一。Scikit-learn 为不同类型的机器学习问题提供了全面的解决方案。使用 Scikit-learn，你可以实现用于分类和回归任务的监督机器学习算法。Scikit-learn
    库还为无监督机器学习问题（如聚类）提供了解决方案。使用 Scikit-learn，你还可以执行数据预处理任务，如数据归一化、特征缩放、各种数据类型之间的转换、独热编码等。Scikit-learn
    库不仅为各种机器学习算法提供开箱即用的解决方案，还提供了评估各种算法的方法。它还允许你为算法选择最佳参数，并应用各种方法来评估模型的鲁棒性。


    ## 1.3 其他机器学习库


    虽然你将主要在本书中使用 Scikit-learn 库来执行不同类型的机器学习任务，但本节将介绍其他一些最常用的机器学习和数据科学库：


    ### 1.3.1 NumPy


    NumPy 是最常用的数值和科学计算库之一。NumPy 速度极快，并支持多个数学领域，如线性代数、几何等。如果你打算在数据科学和数据准备领域发展职业生涯，学习
    NumPy 至关重要。要了解更多关于 NumPy 的信息，请查看此链接：[`numpy.org/`](https://numpy.org/)


    ### 1.3.2 Matplotlib


    Matplotlib 是 Python 中静态数据可视化的事实标准，这是数据科学和机器学习的第一步。作为 Python 中最古老的数据可视化库，Matplotlib
    是使用最广泛的数据可视化库。Matplotlib 的开发旨在类似于 MATLAB，后者是学术界最广泛使用的编程语言之一。虽然 Matplotlib 图表易于绘制，但
    Matplotlib 图表的外观和风格具有鲜明的 1990 年代风格。许多封装库（如 Pandas 和 Seaborn）都是在 Matplotlib 基础上开发的。这些库允许用户绘制更整洁、更复杂的图表。要了解更多关于
    Matplotlib 的信息，请查看此链接：[`matplotlib.org/`](https://matplotlib.org/)


    ### 1.3.3 Seaborn


    Seaborn 库构建在 Matplotlib 库之上，包含 Matplotlib 的所有绘图功能。然而，借助 Seaborn 的默认样式和调色板，你可以绘制更加美观悦目的图表。要了解更多关于
    Seaborn 的信息，请查看此链接：[`seaborn.pydata.org/`](https://seaborn.pydata.org/)


    ### 1.3.4 Pandas


    Pandas 库与 Seaborn 一样，基于 Matplotlib 库，并提供可用于在单行代码中绘制不同类型静态图表的工具。使用 Pandas，你可以导入各种格式的数据，如
    CSV（逗号分隔值）和 TSV（制表符分隔值），并可通过这些数据源绘制各种数据可视化图表。要了解更多关于 Pandas 的信息，请查看此链接：[`pandas.pydata.org/`](https://pandas.pydata.org/)


    ### 1.3.5 TensorFlow


    TensorFlow 是最常用的深度学习库之一。TensorFlow 由 Google 开发，为各种深度学习模型的开发提供了易于使用的 API。TensorFlow
    持续更新，在本书撰写时，TensorFlow 2 是 TensorFlow 的最新主要版本。使用 TensorFlow，你不仅可以轻松开发深度学习应用，还能凭借
    TensorFlow 的部署功能轻松部署它们。要了解更多关于 TensorFlow 的信息，请查看此链接：[`www.tensorflow.org/`](https://www.tensorflow.org/)


    ### 1.3.6 Keras


    Keras 是一个高级 TensorFlow 库，它在底层实现了复杂的 TensorFlow 功能。如果你是深度学习新手，Keras 是你应该开始用来开发深度学习模型的一个深度学习库。事实上，Keras
    已被采纳为 TensorFlow 2.0 的官方深度学习库，现在所有 TensorFlow 应用都使用 Keras 抽象来训练深度学习模型。要了解更多关于
    Keras 的信息，请查看此链接：[`keras.io/`](https://keras.io/)


    ## 1.4 接下来的内容？


    在本章中，你简要了解了机器学习和 Scikit-learn 的介绍。在接下来的章节中，你将看到如何使用 Python 的 Scikit-learn 库来解决不同类型的机器学习问题。然而，在此之前，第
    2 章为 Python 初学者提供了一门速成课程，如果你已经熟悉基本的 Python 概念，可以跳过该章。第 3 章简要介绍了使用 Scikit-learn
    进行特征选择的内容，而第 4 章包含关于如何使用 Python Scikit-learn 库预处理数据的信息。第 5 章和第 6 章分别展示了如何使用 Scikit-learn
    库解决监督分类和回归问题。第 7 章和第 8 章分别解释了聚类和降维等无监督学习技术。第 9 章解释了使用 Scikit-learn 的模型选择方法。第 10
    章和第 11 章分别解释了 Scikit-learn 库在自然语言处理和图像分类中的应用。


