- raw: "Preface Thank you for your decision to purchase this book. I can assure you\
    \ that you will not regret your decision. Python’s Scikit-learn library is one\
    \ of the most widely used libraries for data science and machine learning. With\
    \ Python’s Scikit-learn library, you can perform almost all the data science and\
    \ machine learning related tasks such as data visualization, feature engineering,\
    \ classification and regression, text and image processing, and so on. This book\
    \ is a beginner’s gateway to Python’s Scikit-learn library. After reading this\
    \ book, you will be able to perform common data science and machine learning tasks,\
    \ such as predicting the price of a certain item, predicting whether or not a\
    \ banknote is fake, recognizing an image, classifying public sentiments, and much\
    \ more. You will also learn how to perform data preprocessing and feature engineering\
    \ tasks, such as handling missing values, converting categorical data into numerical\
    \ and vice versa, etc. While this book is aimed at beginners, it can also be used\
    \ by expert programmers as a reference to perform various machine learning and\
    \ data science tasks. § Book Approach The book follows a very simple approach.\
    \ It is divided into 11 chapters. Chapter 1 provides a very brief introduction\
    \ to data science and machine learning and the use of Python’s Scikit-learn library\
    \ for machine learning. The process for environment setup, including the software\
    \ needed to run the scripts in this book, is explained in Chapter 2. Chapter 2\
    \ also contains a crash course on Python for beginners. If you are already familiar\
    \ with Python, you can skip chapter 2. Chapter 3 explains various data preprocessing\
    \ techniques, while chapter 4 details how to perform feature selection with the\
    \ Scikit-learn library. Chapters 5 and 6 contain introductions to supervised \
    \ machine learning approaches like regression and classification with the help\
    \ of the Scikit-learn library. Chapter 7 explains unsupervised machine learning,\
    \ where you study different clustering approaches using the Python Scikit-learn\
    \ library. Dimensionality reduction approaches in Scikit-learn have been discussed\
    \ in the 8th chapter of this book. Chapter 9 explains various model selection\
