    # 8.3 奇异值分解


    机器学习算法的数据可以用矩阵的形式表示。因此，任何用于将矩阵分解为其组成部分的技术都可用于降维，因为如果以列的形式表示数据特征，维度基本上就是矩阵中的一列。使用矩阵的组成部分来减少或描述矩阵的过程称为矩阵分解。用于矩阵分解的最常用技术之一是奇异值分解（SVD）。奇异值分解常用于机器学习中的降维。在本节中，你将了解
    SVD 用于降维的优缺点，以及如何使用 Sklearn 实现它。


    ## 为什么使用 SVD？


    以下是 SVD 的一些主要优势：


    *   更适合处理稀疏数据集，例如文本数据的词袋表示。

    *   按相关性对特征进行排序。

    *   对于较大的数据集极其高效。


    ## SVD 的缺点


    以下是 SVD 的主要缺点：


    *   SVD 相对较慢且计算成本高昂。

    *   结果不利于可视化；因此难以解释。

    *   可能不适用于高度非线性数据。


