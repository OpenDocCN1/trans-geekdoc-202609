    # 使用 Scikit-Learn 进行数据预处理


    随着海量数据触手可及，越来越多的研究人员和行业专业人士正在寻找方法，利用这些数据获取研究和商业收益。然而，默认可用的大多数数据过于原始。在用于识别重要模式或训练用于预测的统计模型之前，对其进行预处理非常重要。数据预处理涉及以一种可用于多项重要数据科学任务（如数据可视化、机器学习、深度学习和数据分析）作为输入的方式来清洗和构建数据。一些最常见的数据准备任务包括特征缩放、处理缺失值、分类变量编码、数据离散化等。Scikit-learn
    库包含各种模块和工具，您可以在本章中使用它们来执行不同类型的数据处理任务。那么，让我们废话不多说，开始吧。


    ## 3.1 特征缩放


    数据集可以具有不同的属性。这些属性可以具有不同的量级、方差、标准差、均值等。例如，薪资可能以千为单位，而年龄通常是两位数。属性尺度或量级的差异实际上会影响统计模型。例如，对于线性模型，范围较大的变量会主导范围较小的变量。在本节中，您将看到不同的特征缩放技术。


    ### 3.1.1 标准化


    标准化是将变量以零为中心并将数据方差标准化为 1 的过程。要标准化数据集，只需从所有数据点的均值中减去每个数据点，然后将结果除以数据的标准差。特征缩放仅应用于数值列。以下脚本导入泰坦尼克号数据集，然后筛选
    `age`、`fare` 和 `pclass` 列。我们将仅在这三列上应用特征缩放技术。


