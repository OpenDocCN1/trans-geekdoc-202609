    # Introduction


    In this chapter, you will study what machine learning and data science are, how
    they differ, and what are the steps that you need to take to become a machine
    learning data science expert. Since this book is about the use of the Scikit-learn
    library for machine learning, this chapter also briefly reviews what Scikit-learn
    is and what you can do with it. Finally, some of the other most commonly used
    machine learning libraries have also been introduced.


    ## 1.1 What Is Machine Learning and Data Science?


    Machine learning and data science applications are taking the world by storm.
    Autonomous cars, interactive robots, personal assistants like Alexa and Siri are
    all applications of data science and machine learning. The terms data science
    and machine learning are often interchangeably used. However, the two terms are
    different. Data science is a field of study that uses scientific approaches and
    mathematical techniques such as statistics to extract meaning and insights from
    data. As per Dr. Thomas Miller from Northwestern University, data science is “a
    combination of information technology, modeling and business management.” Machine
    learning, on the other hand, is an approach consisting of mathematical algorithms
    that enable computers to make decisions without being explicitly performed. Rather
    machine learning algorithms learn from data and then, based on the insights from
    the dataset, make decisions without human input. In this book, you will complete
    different types of machine learning projects with the help of Python’s Scikit-learn
    library.


    ## 1.2 Where Does Scikit-Learn Fit In?


    Most of the machine learning and data science models are based on statistical
    algorithms. You can implement machine learning models in a programming language
    of your choice. However, machine learning is an empirical process where you need
    to try and test multiple models with various combinations of parameters and datasets.
    Furthermore, the sheer number of machine learning models, preprocessing approaches,
    and model evaluation and selection criteria make it virtually impossible for an
    average user to implement and test everything. This is where Scikit-learn comes
    into play. With Scikit-learn, you have almost everything you need to implement,
    test, and evaluate your machine learning model. Scikit-Learn ([https://scikit-learn.org/stable/](https://scikit-learn.org/stable/)),
    also known as Sklearn, is one of the most widely used libraries for machine learning
    and data science. Scikit-learn offers comprehensive solutions for different types
    of machine learning problems. With Scikit-learn, you can implement supervised
    machine learning algorithms for classification and regression tasks. The Scikit-learn
    library also offers solutions for unsupervised machine learning problems, such
    as clustering. With Scikit-learn, you can also perform data preprocessing tasks,
    such as data normalization, feature scaling, conversion between various data types,
    one-hot encoding, etc. Scikit-learn library doesn’t only offers off-the-shelf
    solutions for various machine learning algorithms but also provides methods for
    the evaluation of various algorithms. It also allows you to select the best parameters
    for your algorithm and apply various methods to evaluate the robustness of a model.


    ## 1.3 Other Machine Learning Libraries


    Though you will primarily be using the Scikit-learn library in this book to perform
    different types of machine learning tasks, in this section, you will see some
    of the other most commonly used machine learning and data science libraries:


    ### 1.3.1 NumPy


    NumPy is one of the most commonly used libraries for numeric and scientific computing.
    NumPy is extremely fast and contains support for multiple mathematical domains,
    such as linear algebra, geometry, etc. It is extremely important to learn NumPy
    in case you plan to make a career in data science and data preparation. To know
    more about NumPy, check this link: [https://numpy.org/](https://numpy.org/)


    ### 1.3.2 Matplotlib


    Matplotlib is the de facto standard for static data visualization in Python, which
    is the first step in data science and machine learning. Being the oldest data
    visualization library in Python, Matplotlib is the most widely used data visualization
    library. Matplotlib was developed to resemble MATLAB, which is one of the most
    widely used programming languages in academia. While Matplotlib graphs are easy
    to plot, the look and feel of the Matplotlib plots have a distinct feel of the
    1990s. Many wrapper libraries like Pandas and Seaborn have been developed on top
    of Matplotlib. These libraries allow users to plot much cleaner and sophisticated
    graphs. To study more about Matplotlib, check this link: [https://matplotlib.org/](https://matplotlib.org/)


    ### 1.3.3 Seaborn


    Seaborn library is built on top of the Matplotlib library and contains all the
    plotting capabilities of Matplotlib. However, with Seaborn, you can plot much
    more pleasing and aesthetic graphs with the help of Seaborn default styles and
    color palettes. To study more about Seaborn, check this link: [https://seaborn.pydata.org/](https://seaborn.pydata.org/)


    ### 1.3.4 Pandas


    Pandas library, like Seaborn, is based on the Matplotlib library and offers utilities
    that can be used to plot different types of static plots in a single line of codes.
    With Pandas, you can import data in various formats such as CSV (Comma Separated
    View) and TSV (Tab Separated View), and you can plot a variety of data visualizations
    via these data sources. To know more about Pandas, check this link: [https://pandas.pydata.org/](https://pandas.pydata.org/)


    ### 1.3.5 TensorFlow


    TensorFlow is one of the most commonly used libraries for deep learning. TensorFlow
    has been developed by Google and offers an easy-to-use API for the development
    of various deep learning models. TensorFlow is consistently being updated, and
    at the time of writing of this book, TensorFlow 2 is the latest major release
    of TensorFlow. With TensorFlow, you can not only easily develop deep learning
    applications but also deploy them as well with ease, owing to the deployment functionalities
    of TensorFlow. To study more about TensorFlow, check this link: [https://www.tensorflow.org/](https://www.tensorflow.org/)


    ### 1.3.6 Keras


    Keras is a high-level TensorFlow library that implements complex TensorFlow functionalities
    under the hood. If you are new to deep learning, Keras is the one deep learning
    library that you should start with for developing a deep learning library. As
    a matter of fact, Keras has been adopted as the official deep learning library
    for TensorFlow 2.0, and now all the TensorFlow applications use Keras abstractions
    for training deep learning models. To study more about Keras, check this link:
    [https://keras.io/](https://keras.io/)


    ## 1.4 What’s Ahead?


    In this chapter, you covered a very brief introduction to machine learning and
    Scikit-learn. In the upcoming chapters, you will see how you can use Python’s
    Scikit-learn library to solve different types of machine learning problems. However,
    before that, chapter 2 provides a crash course for Python beginners, which you
    can skip if you are already familiar with the basic Python concepts. Chapter 3
    provides a brief introduction to feature selection with Scikit-learn, while the
    fourth chapter contains information about how you can preprocess your data using
    the Python Scikit-learn library. Chapters 5 and 6 show how you can solve supervised
    classification and regression problems, respectively, with the Scikit-learn library.
    Chapters 7 and 8 explain unsupervised learning techniques like clustering and
    dimensionality reduction, respectively. Model selection approaches with Scikit-learn
    are explained in chapter 9. The applications of the Scikit-learn library for natural
    language processing and image classification are explained in chapters 10 and
    11, respectively.

