    ### 2.2.2 Python Variables and Data Types


    Data types in a programming language refer to the type of data that the language
    is capable of processing. The following are the major data types supported by
    Python:


    1.  Strings

    2.  Integers

    3.  Floats

    4.  Booleans

    5.  Lists

    6.  Tuples

    7.  Dictionaries


    A variable is an alias for the memory address where actual data is stored. The
    data or the values stored at a memory address can be accessed and updated via
    the variable name. Unlike other programming languages like C++, Java, and C#,
    Python is loosely typed, which means that you don''t have to specify the data
    type while creating a variable. Rather, the type of data is evaluated at runtime.


