    # Feature Selection with Python Scikit-Learn Library


    Machine learning algorithms learn from datasets. A dataset consists of features.
    A feature refers to a single characteristic or dimension of data. Features are
    also known as attributes. For instance, a dataset of cars has features like car
    models, car color, seating capacity, etc. Selecting the right set of features
    can not only improve the performance of your machine learning model but also speed
    up the training time of your algorithm. In this chapter, you will study some of
    the most common feature selection approaches. You will use Python’s Scikit-learn
    library to see various feature selection approaches in action.


    ## 4.1 Feature Selection Based on Variance


    Features having constant or very similar values do not really play any significant
    role in machine learning tasks, such as classification and regression. Therefore,
    features that are very similar should be removed from the dataset. There are various
    ways to remove very similar features from the dataset. One of the ways is to find
    the variance for a particular feature and remove features having variance less
    than a certain threshold. A feature with low variance has a higher degree of similarity
    among its data points and vice versa.


    Let’s see an example of feature selection based on variance. The following script
    reads the `winequalit-red.csv` dataset from the data repository and prints the
    header of the dataset.


    **Script 1:**

    ```

    [Code for Script 1 - Image00180.jpg]

    ```


    **Output:**

    ```

    [Output for Script 1 - Image00181.jpg]

    ```


    The output shows that the dataset has 12 columns. Next, we divide the data into
    the feature and label set.


    **Script 2:**

    ```

    [Code for Script 2 - Image00182.jpg]

    ```


    Feature selection based on variance doesn’t depend upon the output label. Variance
    shows how far a set of data is spread out. You can find the variance of all the
    features in a Pandas dataframe using the `var()` function, as shown below.


    **Script 3:**

    ```

    [Code for Script 3 - Image00183.jpg]

    ```


    **Output:**


    | Feature | Variance |

    | :--- | :--- |

    | fixed acidity | 3.031416 |

    | volatile acidity | 0.032062 |

    | citric acid | 0.037947 |

    | residual sugar | 1.987897 |

    | chlorides | 0.002215 |

    | free sulfur dioxide | 109.414884 |

    | total sulfur dioxide | 1082.102373 |

    | density | 0.000004 |

    | pH | 0.023835 |

    | sulphates | 0.028733 |

    | alcohol | 1.135647 |


    Scikit-learn library contains `VarianceThreshold` class, which you can use to
    filter features based on variance. The threshold value is passed to the `threshold`
    parameter of the constructor. The feature set is passed to the `fit()` method
    of the `VarianceThreshold` class object, as shown in the script below. The following
    script will filter all the features with a variance value of 0.1.


    **Script 4:**

