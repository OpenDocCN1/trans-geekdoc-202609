    ## 3.5 Handling Outliers


    Outliers are the values that are too far from the rest of the observations in
    the columns. For instance, if the weight of most of the people in the sample varies
    between 50–100 kgs, an observation of 500kg will be considered as an outlier since
    such an observation occurs rarely. Outliers can occur due to various reasons.
    For instance, if you access your online bank account from a particular city 95
    percent of the time, an online check-in to your account from another city will
    be considered as an outlier. Such an outlier can be helpful as it can identify
    online frauds. However, outliers can also occur due to technical faults, human
    errors, machine readability, etc. In such cases, the outliers should be removed
    from the dataset.


    There are four main techniques to handle outliers:


    1.  You can either totally remove the outliers from the dataset.

    2.  You can treat outliers as missing values and then apply any data imputation
    technique that you studied in chapter 3.

    3.  You can apply discretization techniques to a dataset that will include outliers
    along with other data points at the tail.

    4.  You can cap or censor the outliers and replace them with maximum and minimum
    values that can be found via several techniques.


    You have already studied discretization and missing value imputation in the previous
    sections. In this section, you will study trimming and capping.


    ### 3.5.1 Outlier Trimming


    Outlier trimming, as the name suggests, refers to simply removing the outliers
    beyond a certain threshold value. One of the main advantages of outlier trimming
    is that it is extremely quick and doesn''t distort the data. A downside to outlier
    trimming is that it can reduce the data size. There are several ways to find the
    thresholds for outlier trimming. Let''s remove the outliers from the `age` column
    of the Titanic dataset. The Titanic dataset contains records of the passengers
