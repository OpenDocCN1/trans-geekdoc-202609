    ## 3.4. Data Discretization


    In the previous section, you studied how to perform numerical encoding of the
    categorical values. In this section, you will see how to convert continuous numeric
    values into discrete intervals. The process of converting continuous numeric values,
    such as price, age, and weight, into discrete intervals is called discretization
    or binning. Discretization is particularly helpful in cases where you have a skewed
    distribution of data. There are various ways to perform discretization. In this
    section, you will study equal width discretization and equal frequency discretization.


    ### 3.4.1 Equal Width Discretization


    The most common type of discretization approach used is fixed width discretization.
    In fixed width discretization, the width or the size of all the intervals remain
    the same. An interval is also called a bin. Equal width discretization is a type
    of unsupervised discretization technique.


