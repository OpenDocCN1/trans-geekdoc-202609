    Functions in any programming language are used to implement the piece of code
    that is required to be executed multiple times at different locations in the code.
    In such cases, instead of writing long pieces of code again and again, you can
    simply define a function that contains the piece of code, and then you can call
    the function wherever you want in the code.


    To create a function in Python, the `def` keyword is used, followed by the name
    of the function and opening and closing parenthesis. Once a function is defined,
    you have to call it in order to execute the code inside a function body. To call
    a function, you simply have to specify the name of the function followed by the
