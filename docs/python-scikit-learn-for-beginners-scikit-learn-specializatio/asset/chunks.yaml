    # 使用 Scikit-Learn 进行图像分类


    图像分类是为图像分配类别或标签的任务。例如，如果给你一组动物图像，你需要识别图像中动物的名称。同样，识别图像中的数字是图像分类的另一个例子。神经网络，特别是卷积神经网络，常用于图像分类任务。然而，将神经网络用于简单的图像分类任务有点大材小用。你也可以使用
    Python 的 Scikit-learn 库进行简单的图像分类任务，本章将演示这一点。你将看到如何使用 Scikit-learn 中的随机森林分类器对 0-9
    的手写数字图像进行分类。那么，让我们废话不多说，开始吧。


    ## 11.1 导入数据集


    你将用于训练图像分类器的数据集是 MNIST 数据集。MNIST 数据集由 70,000 张 28 x 28 像素的灰度图像组成。灰度图像有两个维度，而彩色图像有三个维度（宽度-高度-颜色通道）。Scikit-learn
    算法要求数据记录采用一维行向量的形式，其中向量中的每一项对应一个特征值。由于灰度图像有两个维度，因此需要将其转换为一维数组。为此，你可以使用 numpy 数组的
    `reshape()` 函数。不过，幸运的是，使用 `sklearn.datasets` 中的 `fetch_openml()` 方法，你可以导入 MNIST
    数据集，其中每条记录默认已转换为大小为 784 (28 x 28) 的行向量。因此，在本节中，你不需要重塑 MNIST 数据集中的图像。


