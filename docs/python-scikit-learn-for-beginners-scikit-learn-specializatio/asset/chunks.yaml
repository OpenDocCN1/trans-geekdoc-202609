    # Selecting Best Models with Scikit-Learn


    The performance of a machine learning model depends upon several factors, such
    as the training and test sets used to train and test an algorithm, values of the
    hyperparameters of an algorithm, metrics used to evaluate the performance of an
    algorithm, etc. In this chapter, you will see different techniques for model selection
    in Scikit-learn.


    ## 9.1 K-Fold Cross-validation


    K-Fold cross-validation is a data splitting technique that lets you train and
    test the model on all subsets of the data. In this book till now, normally, you
    divide the data into 80 percent training and 20 percent test set. However, it
    means that only 20 percent of the data is used for testing and that 20 percent
    of data is never used for training. For more stable results, it is recommended
    that all the parts of the dataset are at least used once for training and once
    for testing. To do so, the K-Fold cross-validation technique can be used.


    With K-fold cross-validation, the data is divided into K parts. The experiments
    are also performed for K parts. In each experiment, K-1 parts are used for training,
    and the Kth part is used for testing. For example, in 5-fold cross-validation,
    the data is divided into five equal parts, e.g., K1, K2, K3, K4, and K5. In the
    first iteration, K1-K4 are used for training, while K5 is used for testing. In
    the second test, K1, K2, K3, and K5 are used for training, and K4 is used for
    testing. In this way, each part is used at least once for testing and once for
    training.


    Scikit-learn library contains built-in `cross_val_score()` function from the `sklearn.model_selection`
    module, which you can use to perform cross-validation. In this section, you will
    see two scripts. In the first script, you will see model training without cross-validation.
    In the second section, the same dataset will be used for the model training with
    cross-validation.


