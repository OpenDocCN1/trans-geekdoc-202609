    我们已将数据转换为可用于训练 Sklearn 库中分类机器学习算法的格式。包括所有机器学习算法的功能和用法在内的详细信息，请参见[此链接](https://bit.ly/3mjFV76)。你可以通过访问该链接查看所有分类算法。在下一节中，我们将回顾一些用于二元、多类和多标签分类的最常用分类算法。


    ## 6.2 解决二元分类问题


    二元分类问题是指输出标签只有两个可能值的分类问题。例如，预测肿瘤是良性还是恶性、学生是通过还是不及格、客户在一段时间后是否会离开银行。在本节中，你将看到一些用于二元分类的最常用算法。


    ### 6.2.1 逻辑回归


    逻辑回归是一种线性模型，它通过将线性回归的输出传递给 Sigmoid 函数来进行分类。逻辑回归算法的优缺点与第 5 章第 5.2.1 节中已解释的线性回归算法相同。要使用
    Sklearn 实现逻辑回归，可以使用 `sklearn.linear_model` 模块中的 `LogisticRegression` 类。要训练算法，将训练集和测试集（在本例中即
    `X_train` 和 `X_test`）传递给 `LogisticRegression` 类对象的 `fit()` 方法。要进行预测，将测试集传递给该类的
    `predict()` 方法。使用线性回归算法进行训练和预测的过程如下：


    **脚本 14：**

    ![](img/Image00268.jpg)


    一旦你训练了模型并在测试集上进行了预测，下一步就是了解模型在未知测试集上预测的效果如何。有多种指标可用于评估分类方法。一些最常用的分类指标包括 F1 值、召回率、精确率、准确率和混淆矩阵。在了解这些术语的公式之前，你需要理解真阳性、真阴性、假阳性和假阴性输出的概念：


    *   **真阴性：** 真阴性是指实际标签为假，且模型也预测为假的输出标签。

    *   **真阳性：** 真阳性是指实际标签为真，且模型也预测为真的标签。

    *   **假阴性：** 假阴性是指实际标签为真，但被机器学习模型预测为假的标签。

    *   **假阳性：** 实际标签为假，但被模型预测为真的标签称为假阳性。


    分析分类算法结果的一种方法是绘制混淆矩阵，如下所示：


    **§ 混淆矩阵**

    ![](img/Image00269.jpg)


    **§ 精确率**

    分析分类算法的另一种方法是计算精确率，其基本计算方法是将真阳性除以真阳性与假阳性之和，如下所示：

    ![](img/Image00270.jpg)


    **§ 召回率**

    召回率的计算方法是将真阳性除以真阳性与假阴性之和，如下所示：

    ![](img/Image00271.jpg)


    **§ F1 值**

    F1 值就是精确率和召回率的调和平均数，计算方法如下：

    ![](img/Image00272.jpg)


    **§ 准确率**

    准确率是指正确预测的标签数量除以数据集中观测值的总数。

    ![](img/Image00273.jpg)


    分类问题中评估指标的选择完全取决于你。然而，根据经验法则，对于平衡数据集（即每个类别的标签数量平衡），可以使用准确率作为评估指标。对于不平衡数据集，可以使用
    F1 值作为分类指标。用于计算这些指标值的方法位于 `sklearn.metrics` 类中。必须将预测值和实际值传递给这些方法，如输出所示。


