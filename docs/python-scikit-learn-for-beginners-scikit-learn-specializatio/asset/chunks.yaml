    0.8666666666666667

    ```


    The output shows that even with two features, the accuracy for correctly predicting
    the label for the iris plant is 86.66. Finally, with two features, you can easily
    visualize the dataset using the following script.


    **Script 10:**

    ```

    [Image00378.jpg]

    ```


    **Output:**

    ```

    [Image00379.jpg]

    ```


    ## 8.2 Linear Discriminant Analysis


    Linear Discriminant Analysis (LDA) is a supervised dimensionality reduction technique
    where a decision boundary is formed around the data points belonging to each cluster
    of a class. The data points are projected to new dimensions in a way that the
    distance between the data points within a cluster is minimized while the distance
    between the clusters is maximized. The new dimensions are ranked w.r.t their ability
    to (i) minimize the distance between the data points within a cluster and (ii)
    maximize the distance between individual clusters.


    ### Why Use LDA?


    Following are the advantages of LDA:


    1.  Reduces overfitting because of a reduction in the number of features.

    2.  Model training can be expedited.


    ### Disadvantages of LDA


    There are three major disadvantages of LDA:


    1.  Not able to detect correlated features.

    2.  Cannot be used with unsupervised or unlabeled data.

    3.  Some amount of information is lost when you reduce features.

