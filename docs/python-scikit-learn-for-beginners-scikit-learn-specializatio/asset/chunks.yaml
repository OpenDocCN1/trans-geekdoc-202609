    `5 is not greater than 10 and 8 is not smaller than 4`


    ## Iteration Statements

    Iteration statements, also known as loops, are used to iteratively execute a certain
    piece of code. There are two main types of iteration statements in Python:


    1.  **For loop**

    2.  **While Loop**

