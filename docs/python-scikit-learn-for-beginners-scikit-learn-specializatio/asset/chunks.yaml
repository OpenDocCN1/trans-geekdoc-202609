- raw: "Name: tip, dtype: float64 5.1.2 Converting Categorical Data to Numbers Machine\
    \ learning algorithms can only work with numbers. Therefore, it is important to\
    \ convert categorical data into a numeric format. In this regard, the first step\
    \ is to create a dataset of all numeric  values. To do so, drop the categorical\
    \ columns from the dataset, as shown below. Script 7: ![](Image00218.jpg)The output\
    \ below shows that the dataframe numerical contains numeric columns only. Script\
    \ 8: ![](Image00219.jpg)Output: ![](Image00220.jpg)Next, you need to create a\
    \ dataframe that contains only categorical columns. Script 9: ![](Image00221.jpg)Output:\
    \ ![](Image00222.jpg)One of the most common approaches to convert a categorical\
    \ column to a numeric one is via one-hot encoding. In one-hot encoding, for every\
    \ unique value in the original columns, a new column is created. For instance,\
    \ for sex, two columns: Female and Male, are created. If the original sex column\
    \ contained male, a 1 is added in the newly created Male column, while 0 is added\
    \ in the Female column. However, it can be noted that we do not really need two\
    \ columns. A single column, i.e., Female is enough since when a customer is female,\
    \ we can add 1 in the Female column, else 1 can be added in that column. Hence,\
    \ we need N-1 one-hot encoded columns for all the N values in the original column.\
    \ The following script converts categorical columns into one-hot encoded columns\
    \ using the pd.get\\_dummies() method. Script 10: ![](Image00223.jpg)The output\
    \ shows the newly created one-hot encoded columns. Output: ![](Image00224.jpg)The\
    \ final step is to join the numerical columns with the one-hot encoded columns.\
    \ To do so, you can use the concat() function from the Pandas library, as shown\
    \ below: Script 11: ![](Image00225.jpg)The final dataset looks like this. You\
    \ can see that it doesn’t contain any categorical value. Output: ![](Image00226.jpg)5.1.3\
    \ Divide Data into Training and Test Sets After a machine learning algorithm has\
    \ been trained, it needs to be evaluated to see how well it performs on unseen\
    \ data. Therefore, we divide the dataset into two sets, i.e., train set and test\
    \ set. The dataset is trained via the train set and evaluated on the test set.\
    \ To split the data into training and test sets, you can use the train\\_test\\\
    _split() function from the Sklearn library, as shown  below. The following script\
    \ divides the data into 80 percent train set and 20 percent test set. Script 12:\
    \ ![](Image00227.jpg)5.1.4 Data Scaling/Normalization The final step (optional)\
    \ before data is passed to machine learning algorithms is to scale the data. You\
    \ can see that some columns of the dataset contain small values, while the others\
    \ contain very large values. It is better to convert all values to a uniform scale.\
    \ To do so, you can use the StandardScaler() function from the sklearn.preprocessing\
    \ module, as shown below: Script 13: ![](Image00228.jpg)We have converted data\
    \ into a format that can be used to train machine learning algorithms for regression\
    \ from the Sklearn library. Details, including functionalities and usage of all\
    \ the machine learning algorithms, are available at this link . You can check\
    \ all the regression algorithms by going to that link. In the following section,\
    \ we will review some of the most commonly used regression algorithms. 5.2 Single\
    \ Output Regression Problems In this section, you will solve regression problems\
    \ with one possible output. In a regression problem with a single output, you\
    \ have to predict a single continuous value, such as the price of a house, the\
    \ blood pressure of a patient, or the marks of a student. In multi-output regression\
    \ problems, there is more than one continuous value in the output. For instance,\
    \ if you have to predict the x and y coordinates for the four vertices of a square,\
    \ you have to predict eight values. Let’s first see examples of solving regression\
    \ problems containing one output. To do so, you will be using the Scikit-learn\
    \ library. A complete list of regression algorithms provided by the Scikit-learn\
    \ library can be found at this link ([http://bit.ly/38gXKOb](http://bit.ly/38gXKOb)\
    \ ). In this section, you will only be using three of the most commonly used regression\
    \ algorithms: linear regression, KNN regression, and random forest regression.\
    \ In the next section, you will see how we can perform multi-output regression.\
    \ 5.2.1 Linear Regression Linear regression is a linear model that assumes a linear\
    \ relationship between inputs and outputs and minimizes the cost of error between\
    \ the predicted and actual output using functions like mean absolute error. Why\
    \ Use Linear Regression Algorithm? Linear regression algorithm is particularly\
    \ useful because: \n\n1.  Linear regression is a simple to implement and easily\
    \ interpretable algorithm. \n\n2.  Takes less training time to train, even for\
    \ huge datasets. \n\n3.  Linear regression coefficients are easy to interpret.\
    \ \n\nDisadvantages of Linear Regression Algorithm Following are the disadvantages\
    \ of the linear regression algorithm: \n\n1.  Performance is easily affected by\
    \ outlier presence. \n\n2.  Assumes a linear relationship between dependent and\
    \ independent variables, which can result in an increased error. \n\nImplementing\
    \ Linear Regression with Sklearn To implement linear regression with Sklearn,\
    \ you can use the LinearRegression class from the sklearn.linearjnodel module.\
    \ To train the algorithm, the training and test sets, i.e., X\\_train and X\\\
    _test in our case, are passed to the fit() method of the object of the LinearRegression\
    \ class. To make predictions, the test set is passed to the predict() method of\
    \ the class. The process of training and making predictions with the linear regression\
    \ algorithm is as follows: Script 14: ![](Image00229.jpg)Once you have trained\
    \ a model and have made predictions on the test set, the next step is to know\
    \ how well your model has performed for making predictions on the unknown test\
    \ set. There are various metrics to check that. However, mean absolute error,\
    \ mean squared error, and root mean squared error are three of the most common\
    \ metrics. § Mean Absolute Error Mean absolute error (MAE) is calculated by taking\
    \ the average of absolute error obtained by subtracting real values from predicted\
    \ values. The equation for calculating MAE is given below: ![](Image00230.jpg)§\
    \ Mean Squared Error Mean squared error (MSE) is similar to MAE. However, the\
