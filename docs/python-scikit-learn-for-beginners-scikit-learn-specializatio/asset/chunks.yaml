    \ press Enter to continue \\>>> … Do you approve the license terms? \\[yes|No\\\
    ] Type Yes when you get to the bottom of the License Agreement. \n\n5.  The installer\
    \ will ask you to choose the installation location after you agree to the license\
    \ agreement. \n\nSimply press Enter to choose the default location. You can also\
    \ specify a different location if you want. Output Anaconda3 will now be installed\
    \ on this location: /home/tola/anaconda3 \\- Press ENTER to confirm the location\
    \ \\- Press CTRL-C to abort the installation \\- Or specify a different location\
    \ below \\[/home/tola/anaconda3\\] >>> The installation will proceed once you\
    \ press Enter.  Once again, you have to be patient as the installation process\
    \ takes some time to complete. \n\n6.  You will receive the following result when\
    \ the installation is complete. If you wish to use the conda command, type Yes. "
