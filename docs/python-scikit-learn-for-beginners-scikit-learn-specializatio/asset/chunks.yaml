    # Natural Language Processing with Scikit-Learn


    ## 10.1 What Is Natural Language Processing?


    Humans interact in natural language. Natural languages contain a lot of information.
    For example, the choice of words, the tone, and the context of a sentence can
    be used to exploit mood, intention, and emotion of a human. Furthermore, text
    documents, such as books, newspapers, and blogs, are full of information that
    can be exploited to perform various tasks. For humans, it can take a huge amount
    of time to understand and extract useful information from text and make decisions
    based on the information provided in the text. This is where natural language
    processing (NLP) comes into play. Natural language processing is defined as “a
    field of artificial intelligence that enables computers to read, understand, and
    extract meaning from natural languages spoken by humans.” Like other machine learning
    tasks, the Scikit-learn library contains functions that can be used for a variety
    of natural language processing tasks. In this chapter, you will see two applications
    of natural language processing with Scikit-learn. First, you will see how you
    can automatically classify spam emails. In the second application, you will see
    how to find public sentiment from text reviews about different movies.


    ## 10.2 Spam Email Detection with Scikit-Learn


    If you have used Gmail, Yahoo, or any other email service, you would have noticed
    that some emails are automatically marked as spam by email engines. These spam
    email detectors are based on certain rules and statistical machine learning approaches.
    Spam email filtering is a natural language processing task where based on the
    text of the email, we have to classify whether or not an email is a spam email.
    Supervised machine learning algorithms are commonly used for classification, particularly
    if the true outputs are available in the dataset. The `Naïve Bayes` Algorithm
    is one of the supervised machine learning algorithms that have been proven to
    be effective for spam email detection. In this project, you will see how to detect
    spam emails using the `Naïve Bayes` algorithm implemented via Python’s Sklearn
    library.


    ### Why Use Naïve Bayes Algorithm?


    `Naïve Bayes` algorithm is particularly useful because it:


    1.  Performs brilliantly when there is no relationship between attributes in a
    feature vector.

    2.  Requires a very small amount of data for training.

    3.  Very easy to implement and understand.


    ### Disadvantages of Naïve Bayes Algorithm


    Following are the disadvantages of the `Naïve Bayes` algorithm.


    1.  Unable to capture the relationships between various features in a dataset.

    2.  If a category exists in the test set but not in the training set, the probability
    of prediction for that category in the test set will be set to 0.

    '
