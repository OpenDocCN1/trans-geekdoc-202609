    ## 6.1.4 Data Scaling/Normalization


    The last step (optional) before the data is passed to the machine learning algorithms
    is to scale the data. You can see that some columns of the dataset contain small
    values while the others contain very large values. It is better to convert all
    values to a uniform scale. To do so, you can use the `StandardScaler()` function
    from the `sklearn.preprocessing` module, as shown below:


    **Script 13:**

    ![](Image00267.jpg)


    We have converted data into a format that can be used to train machine learning
    algorithms for classification from the Sklearn library. Details, including functionalities
    and usage of all the machine learning algorithms, are available at [this link](https://bit.ly/3mjFV76).
    You can check all the classification algorithms by going to that link. In the
    following section, we will review some of the most commonly used classification
    algorithms for binary, multiclass, and multilabel classification.


    ## 6.2 Solving Binary Classification Problems


    Binary classification problems are those classification problems where there are
    only two possible values for the output label. For example, predicting whether
    a tumor is benign or malignant, whether a student will pass or fail, whether a
    customer will leave the bank after a certain period or not. In this section, you
    will see some of the most commonly used algorithms for binary classification.


    ### 6.2.1 Logistic Regression


    Logistic regression is a linear model, which makes classification by passing the
    output of linear regression through a sigmoid function. The pros and cons of logistic
    regression algorithms are the same as linear regression algorithms explained already
    in chapter 5, section 5.2.1. To implement the logistic regression with Sklearn,
    you can use the `LogisticRegression` class from the `sklearn.linear_model` module.
    To train the algorithm, the training and test sets, i.e., `X_train` and `X_test`
    in our case, are passed to the `fit()` method of the object of the `LogisticRegression`
    class. To make predictions, the test set is passed to the `predict()` method of
    the class. The process of training and making predictions with the linear regression
    algorithm is as follows:


    **Script 14:**

    ![](Image00268.jpg)


    Once you have trained a model and have made predictions on the test set, the next
    step is to know how well your model has performed for making predictions on the
    unknown test set. There are various metrics to evaluate a classification method.
    Some of the most commonly used classification metrics are F1, recall, precision,
    accuracy, and confusion matrix. Before you see the equations for these terms,
    you need to understand the concept of true positive, true negative, and false
    positive, and false negative outputs:


    *   **True Negatives (TN/tn):** True negatives are those output labels that are
    actually false, and the model also predicted them as false.

    *   **True Positive:** True positives are those labels that are actually true
    and also predicted as true by the model.

    *   **False Negative:** False negatives are labels that are actually true but
    predicted as false by machine learning models.

    *   **False Positive:** Labels that are actually false but predicted as true by
    the model are called false positive.


    One way to analyze the results of a classification algorithm is by plotting a
    confusion matrix, such as the one shown below:


    **§ Confusion Matrix**

    ![](Image00269.jpg)


    **§ Precision**

    Another way to analyze a classification algorithm is by calculating precision,
    which is basically obtained by dividing true positives by the sum of true positive
    and false positive, as shown below:

    ![](Image00270.jpg)


    **§ Recall**

    Recall is calculated by dividing true positives by the sum of true positive and
    false negative, as shown below:

    ![](Image00271.jpg)


    **§ F1 Measure**

    F1 measure is simply the harmonic mean of precision and recall and is calculated
    as follows:

    ![](Image00272.jpg)


    **§ Accuracy**

    Accuracy refers to the number of correctly predicted labels divided by the total
    number of observations in a dataset.

    ![](Image00273.jpg)


    The choice of using a metric for classification problems depends totally upon
    you. However, as a rule of thumb, in the case of balanced datasets, i.e., where
    the number of labels for each class is balanced, accuracy can be used as an evaluation
    metric. For imbalanced datasets, you can use the F1 measure as the classification
    metric. The methods used to find the value for these metrics are available in
    `sklearn.metrics` class. The predicted and actual values have to be passed to
    these methods, as shown in the output.


    **Script 15:**

    ![](Image00274.jpg)


    **Output:**

    ![](Image00275.jpg)


    The output shows that for 81 percent of the records in the test set, logistic
    regression correctly predicted whether or not a customer will leave the bank.


    ### Further Readings – Logistic Regression


    To study more about logistic regression, please check these links:


    1.  <https://bit.ly/3mjFV76>

    2.  <https://bit.ly/2FvcU7B>

