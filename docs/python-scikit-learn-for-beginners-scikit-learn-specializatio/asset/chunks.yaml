    digits from 0-9 using the random forest classifier in Scikit-learn. So, let’s
    begin without much ado.


    ## 11.1 Importing the Dataset


    The dataset that you will be using to train your image classifier is the MNIST
    dataset. The MNIST dataset consists of 70,000 greyscale images of 28 x 28 pixels.
