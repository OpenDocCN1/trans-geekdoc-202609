    ```


    **Output:**

    ```

    [Output for Script 7 - Image00188.jpg]

    ```


    One of the main issues with variance-based feature selection is that it doesn’t
    take the relationship between mutual features into account while feature selection.
    Hence, with variance-based feature selection, redundant features may be selected.
    To avoid selecting redundant features, you can use the feature selection method
    based on correlation.


    ## 4.2 Feature Selection Based on Correlation


    In feature selection based on correlation, the features are selected using the
    following steps:


    1.  Mutual correlation between all the features is calculated.

    2.  The correlation threshold is set.

    3.  Features having mutual correlation greater than the correlation threshold
    with any other feature are removed from the dataset.

