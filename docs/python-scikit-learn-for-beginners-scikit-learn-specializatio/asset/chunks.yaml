    # Solving Regression Problems in Machine Learning Using Sklearn Library


    Machine learning is a branch of artificial intelligence that enables computer
    programs to automatically learn and improve from experience. Machine learning
    algorithms learn from datasets and then, based on the patterns identified from
    the datasets, make predictions on unseen data.


    Machine learning algorithms can be broadly categorized into two types: Supervised
    learning and unsupervised learning algorithms. Supervised machine learning algorithms
    are those algorithms where the input dataset and the corresponding output or true
    prediction is available, and the algorithms try to find the relationship between
    inputs and outputs. On the other hand, in unsupervised machine learning algorithms,
    the true labels for the outputs are not known. Rather, the algorithms try to find
    similar patterns in the data. Clustering algorithms are a typical example of unsupervised
    learning.


    Supervised learning algorithms are further divided into two types: regression
    algorithms and classification algorithms. Regression algorithms predict a continuous
    value, for example, the price of a house, the blood pressure of a person, and
    a student’s score in a particular exam. Classification algorithms, on the flip
    side, predict a discrete value, such as whether or not a tumor is malignant, whether
    a student is going to pass or fail an exam, etc.


    In this chapter, you will study how machine learning algorithms can be used to
    solve regression problems, i.e., predict a continuous value using the Sklearn
    library ([https://bit.ly/2Zvy2Sm](https://bit.ly/2Zvy2Sm)). In chapter 6, you
    will see how to solve classification problems via Sklearn.


    ## 5.1 Preparing Data for Regression Problems


    Machine learning algorithms require data to be in a certain format before the
    algorithms can be trained on the data. In this section, you will see various data
    preprocessing steps that you need to perform before you can train machine learning
    algorithms using the Sklearn library.


    You can read data from CSV files. However, the datasets we are going to use in
    this section are available by default in the Seaborn library. To view all the
    datasets, you can use the `get_dataset_names()` function, as shown in the following
    script:


