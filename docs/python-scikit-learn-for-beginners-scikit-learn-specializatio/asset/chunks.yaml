    # Exercise 7.2


    Apply K-Means clustering on the `banknote.csv` dataset available in the `Datasets`
    folder in the shared repository. Find the optimal number of clusters and then
    print the clustered dataset. The following script imports the dataset and prints
    the first five rows of the dataset.


    # Dimensionality Reduction with PCA and LDA using Sklearn


    Dimensionality reduction refers to reducing the number of features in a dataset
    in such a way that the overall performance of the algorithms trained on the dataset
    is minimally affected. With dimensionality reduction, the training time of the
    statistical algorithm can significantly be reduced, and data can be visualized
    more easily since it is not easy to visualize datasets in higher dimensions. There
    are three main approaches used for dimensionality reduction: Principal Component
    Analysis (PCA), Linear Discriminant Analysis (LDA), and Singular Value Decomposition
    (SVD). In this chapter, you will study these approaches and see how to implement
    them using Python’s Sklearn library with the help of examples.


    ## 8.1 Principal Component Analysis


    Principal component analysis is an unsupervised dimensionality reduction technique
    that doesn’t depend on the labels of a dataset. Principal component analysis prioritizes
    features on the basis of their ability to cause maximum variance in the output.
    The idea behind PCA is to capture those features that contain maximum features
    about the dataset. The feature that causes maximum variance in the output is called
    the first principal component, the feature that causes the second highest variance
    is called the second principal component, and so on.


    ### Why Use PCA?


    Following are the advantages of PCA:


    1.  Correlated features can be detected and removed using PCA.

    2.  Reduces overfitting because of a reduction in the number of features.

    3.  Model training can be expedited.


    ### Disadvantages of PCA


    There are two major disadvantages of PCA:


    1.  You need to standardize the data before you apply PCA.

    2.  Independent variable becomes less integrable.

    3.  Some amount of information is lost when you reduce features.


    ### Implementing PCA with Python’s Sklearn Library


    In this section, you will see how to use PCA to select the two most important
    features in the Iris dataset using the Sklearn library. The following script imports
    the required libraries:


    **Script 1:**

    ```

    [Image00368.jpg]

    ```


    The following script imports the Iris dataset using the Seaborn library and prints
    the first five rows of the dataset.


    **Script 2:**

    ```

    [Image00369.jpg]

    ```


    **Output:**

    ```

    [Image00370.jpg]

    ```


    The above output shows that the dataset contains four features: `sepal_length`,
    `sepal_width`, `petal_length`, `petal_width`, and one output label, i.e., `species`.
    For PCA, we will only use the features set. The following script divides the data
    into the features and labels sets.


    **Script 3:**

    ```

    [Image00371.jpg]

    ```


    Before we apply PCA on a dataset, we will divide it into the training and test
    sets, as shown in the following script.


    **Script 4:**

    ```

    [Image00372.jpg]

    ```


    Finally, both the training and test sets should be scaled before PCA could be
    applied to them.


    **Script 5:**

    ```

    [Image00373.jpg]

    ```


    To apply PCA via Sklearn, all you have to do is import the `PCA` class from the
    `Sklearn.decomposition` module. Next, to apply PCA to the training set, pass the
    training set to the `fit_transform()` method of the `PCA` class object. To apply
    PCA on the test set, pass the test set to the `transform()` method of the `PCA`
    class object. This is shown in the following script.


    **Script 6:**

    ```

    [Image00374.jpg]

    ```


    Once you have applied PCA on a dataset, you can use the `explained_variance_ratio_`
    feature to print the variance caused by all the features in the dataset. This
    is shown in the following script:


    **Script 7:**

    ```

    [Image00375.jpg]

    ```


    **Output:**

    ```

    [0.72229951 0.2397406 0.03335483 0.00460506]

    ```


    The output above shows that 72.22 percent of the variance in the dataset is caused
    by the first principal component, while 23.97 percent of the variance is caused
    by the second principal component. Let’s now select the two principal components
    that collectively caused variance of 72.22% + 23.97% = 96.19%. To select the two
    principal components, all you have to do is pass `2` as a value to the `n_components`
