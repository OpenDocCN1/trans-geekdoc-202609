    ## Conditional Statements

    Conditional statements in Python are used to implement conditional logic in Python.
    Conditional statements help you decide whether to execute a certain code block
    or not. There are three main types of conditional statements in Python:


    1.  **If statement**

    2.  **If-else statement**

    3.  **If-elif statement**


    ### If Statement

    If you have to check for a single condition and you are not concerned about the
    alternate condition, you can use the `if` statement. For instance, if you want
    to check if `10` is greater than `5`, and based on that, you want to print a statement,
    you can use the `if` statement. The condition evaluated by the `if` statement
    returns a Boolean value. If the condition evaluated by the `if` statement is true,
    the code block that follows the `if` statement executes. It is important to mention
    that in Python, a new code block starts at a new line with an indentation (typically
    one tab or four spaces) from the left when compared with the outer block. Here,
