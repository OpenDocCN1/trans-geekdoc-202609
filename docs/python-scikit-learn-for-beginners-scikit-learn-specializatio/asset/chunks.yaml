    # 使用 Scikit-Learn 选择最佳模型


    机器学习模型的性能取决于多个因素，例如用于训练和测试算法的训练集和测试集、算法的超参数值、用于评估算法性能的指标等。在本章中，您将了解 Scikit-learn
    中用于模型选择的不同技术。


    ## 9.1 K 折交叉验证


    K 折交叉验证是一种数据分割技术，它允许您在数据的所有子集上训练和测试模型。在本书迄今为止的内容中，通常您将数据分为 80% 的训练集和 20% 的测试集。然而，这意味着只有
    20% 的数据用于测试，且这 20% 的数据从未用于训练。为了获得更稳定的结果，建议数据集的所有部分至少用于训练一次和测试一次。为此，可以使用 K 折交叉验证技术。


    使用 K 折交叉验证时，数据被分成 K 份。实验也针对这 K 份分别进行。在每次实验中，K-1 份用于训练，第 K 份用于测试。例如，在 5 折交叉验证中，数据被分成五等份，例如
    K1、K2、K3、K4 和 K5。在第一次迭代中，K1-K4 用于训练，而 K5 用于测试。在第二次测试中，K1、K2、K3 和 K5 用于训练，K4 用于测试。以此类推，每一份数据至少被用于测试一次和训练一次。


    Scikit-learn 库包含来自 `sklearn.model_selection` 模块的内置 `cross_val_score()` 函数，您可以使用它来执行交叉验证。在本节中，您将看到两个脚本。在第一个脚本中，您将看到不使用交叉验证的模型训练。在第二部分中，将使用相同的数据集进行带交叉验证的模型训练。


