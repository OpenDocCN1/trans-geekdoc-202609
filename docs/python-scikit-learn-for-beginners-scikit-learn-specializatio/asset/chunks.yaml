    ## 3.5 处理异常值


    异常值是指与列中其余观测值相距太远的值。例如，如果样本中大多数人的体重在 50-100 公斤之间变化，则 500 公斤的观测值将被视为异常值，因为这种观测值极少发生。异常值可能由于各种原因发生。例如，如果你
    95% 的时间从某个特定城市访问你的网上银行账户，那么从另一个城市登录你的账户将被视为异常值。这种异常值可能会有所帮助，因为它可以识别网上欺诈。然而，异常值也可能由于技术故障、人为错误、机器可读性等原因发生。在这种情况下，应从数据集中移除异常值。


    处理异常值主要有四种技术：


    1.  你可以完全从数据集中移除异常值。

    2.  你可以将异常值视为缺失值，然后应用你在第 3 章学到的任何数据填补技术。

    3.  你可以对数据集应用离散化技术，这将把异常值与尾部的其他数据点一起包含在内。

    4.  你可以对异常值进行封顶或审查，并用通过多种技术找到的最大值和最小值替换它们。


    你已经在前面的章节学习了离散化和缺失值填补。在本节中，你将学习修剪和封顶。


