    # 5.2 Single Output Regression Problems


    In this section, you will solve regression problems with one possible output.
    In a regression problem with a single output, you have to predict a single continuous
    value, such as the price of a house, the blood pressure of a patient, or the marks
    of a student. In multi-output regression problems, there is more than one continuous
    value in the output. For instance, if you have to predict the x and y coordinates
    for the four vertices of a square, you have to predict eight values.


    Let’s first see examples of solving regression problems containing one output.
    To do so, you will be using the Scikit-learn library. A complete list of regression
    algorithms provided by the Scikit-learn library can be found at this link ([http://bit.ly/38gXKOb](http://bit.ly/38gXKOb)).
    In this section, you will only be using three of the most commonly used regression
    algorithms: linear regression, KNN regression, and random forest regression. In
    the next section, you will see how we can perform multi-output regression.


    ## 5.2.1 Linear Regression


    Linear regression is a linear model that assumes a linear relationship between
    inputs and outputs and minimizes the cost of error between the predicted and actual
    output using functions like mean absolute error.


    ### Why Use Linear Regression Algorithm?


    Linear regression algorithm is particularly useful because:


    1.  Linear regression is a simple to implement and easily interpretable algorithm.

    2.  Takes less training time to train, even for huge datasets.

    3.  Linear regression coefficients are easy to interpret.


    ### Disadvantages of Linear Regression Algorithm


    Following are the disadvantages of the linear regression algorithm:


    1.  Performance is easily affected by outlier presence.

    2.  Assumes a linear relationship between dependent and independent variables,
    which can result in an increased error.


    ### Implementing Linear Regression with Sklearn


    To implement linear regression with Sklearn, you can use the `LinearRegression`
    class from the `sklearn.linear_model` module. To train the algorithm, the training
    and test sets, i.e., `X_train` and `X_test` in our case, are passed to the `fit()`
    method of the object of the `LinearRegression` class. To make predictions, the
    test set is passed to the `predict()` method of the class. The process of training
    and making predictions with the linear regression algorithm is as follows:


    **Script 14:**

    ![](Image00229.jpg)


    Once you have trained a model and have made predictions on the test set, the next
    step is to know how well your model has performed for making predictions on the
    unknown test set. There are various metrics to check that. However, mean absolute
    error, mean squared error, and root mean squared error are three of the most common
    metrics.


    #### Mean Absolute Error


    Mean absolute error (MAE) is calculated by taking the average of absolute error
    obtained by subtracting real values from predicted values. The equation for calculating
    MAE is given below:


    ![](Image00230.jpg)


    #### Mean Squared Error


    Mean squared error (MSE) is similar to MAE. However, the error for each record
    is squared in the case of MSE in order to punish data records with a huge difference
    between predicted and actual values. The equation to calculate mean squared error
    is as follows:


    ![](Image00231.jpg)


    #### Root Mean Squared Error


    Root Mean Squared Error is simply the under the root of mean squared error and
    can be calculated as follows:


    ![](Image00232.jpg)


    The methods used to find the value for these metrics are available in `sklearn.metrics`
    class. The predicted and actual values have to be passed to these methods, as
    shown in the output.


    **Script 15:**

    ![](Image00233.jpg)


