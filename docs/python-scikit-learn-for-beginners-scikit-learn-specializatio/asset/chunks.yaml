    VarianceThreshold(threshold=0.1)

    ```


    To get the selected features, you need to call the `get_support()` method of the
    `VarianceThreshold` class. The value returned by the method is passed to the columns
    list of the feature set, which returns the columns with variance greater than
    the threshold. Look at the following script for reference.


    **Script 5:**

