    # 使用 Python Scikit-Learn 库进行特征选择


    机器学习算法从数据集中学习。数据集由特征组成。特征是指数据的单个特征或维度。特征也称为属性。例如，汽车数据集具有汽车型号、汽车颜色、座位容量等特征。选择合适的特征集不仅可以提高机器学习模型的性能，还可以加快算法的训练时间。在本章中，您将学习一些最常见的特征选择方法。您将使用
    Python 的 Scikit-learn 库来演示各种特征选择方法。


    ## 4.1 基于方差的特征选择


    具有常数值或非常相似值的特征在分类和回归等机器学习任务中并不起重要作用。因此，应从数据集中移除非常相似的特征。从数据集中移除非常相似的特征有多种方法。其中一种方法是计算特定特征的方差，并移除方差小于特定阈值的特征。方差低的特征其数据点之间具有较高的相似度，反之亦然。


