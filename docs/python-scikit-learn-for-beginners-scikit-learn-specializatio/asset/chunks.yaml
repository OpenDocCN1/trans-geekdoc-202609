    ## 6.1.3 将数据划分为训练集和测试集


    机器学习算法训练完成后，需要对其进行评估，以查看其在未见数据上的表现如何。与回归问题一样，在分类问题中，我们也将数据集划分为两个集合，即训练集和测试集。数据集通过训练集进行训练，并在测试集上进行评估。要将数据划分为训练集和测试集，可以使用
    Sklearn 库中的 `train_test_split()` 函数，如下所示。以下脚本将数据划分为 80% 的训练集和 20% 的测试集。


