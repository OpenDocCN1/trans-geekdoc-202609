    One of the most common approaches to convert a categorical column to a numeric
    one is via one-hot encoding. In one-hot encoding, for every unique value in the
    original columns, a new column is created. For instance, for `sex`, two columns:
    `Female` and `Male`, are created. If the original `sex` column contained `male`,
    a `1` is added in the newly created `Male` column, while `0` is added in the `Female`
    column. However, it can be noted that we do not really need two columns. A single
    column, i.e., `Female` is enough since when a customer is female, we can add `1`
    in the `Female` column, else `1` can be added in that column. Hence, we need `N-1`
    one-hot encoded columns for all the `N` values in the original column.


    The following script converts categorical columns into one-hot encoded columns
    using the `pd.get_dummies()` method.


