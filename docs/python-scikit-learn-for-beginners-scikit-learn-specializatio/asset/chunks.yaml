    ## 5.2.1 线性回归


    线性回归是一种线性模型，它假设输入和输出之间存在线性关系，并使用平均绝对误差等函数最小化预测输出与实际输出之间的误差成本。


    ### 为什么使用线性回归算法？


    线性回归算法特别有用，因为：


    1.  线性回归是一种易于实现且易于解释的算法。

    2.  即使对于海量数据集，训练时间也较短。

    3.  线性回归系数易于解释。


    ### 线性回归算法的缺点


    线性回归算法的缺点如下：


    1.  性能容易受异常值存在的影响。

    2.  假设因变量和自变量之间存在线性关系，这可能导致误差增加。


    ### 使用 Sklearn 实现线性回归


    要使用 Sklearn 实现线性回归，可以使用 `sklearn.linear_model` 模块中的 `LinearRegression` 类。要训练算法，将训练集和测试集（在本例中为
    `X_train` 和 `X_test`）传递给 `LinearRegression` 类对象的 `fit()` 方法。要进行预测，将测试集传递给该类的 `predict()`
    方法。使用线性回归算法进行训练和预测的过程如下：


