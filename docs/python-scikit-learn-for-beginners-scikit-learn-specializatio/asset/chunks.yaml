    \ button. \n\n![](Image00007.jpg)\n\n4.  Now click I Agree on the License Agreement\
    \ dialog, as shown in  the following screenshot. \n\n![](Image00008.jpg)\n\n5.\
    \  Check the Just Me radio button from the Select Installation Type dialogue box.\
    \ Click the Next button to continue. \n\n![](Image00009.jpg)\n\n6.  Now, the Choose\
    \ Install Location dialog will be displayed. Change the directory if you want,\
