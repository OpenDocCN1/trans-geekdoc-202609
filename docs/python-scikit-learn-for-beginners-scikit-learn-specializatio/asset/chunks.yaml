    # Preface


    Thank you for your decision to purchase this book. I can assure you that you will
    not regret your decision. Python’s Scikit-learn library is one of the most widely
    used libraries for data science and machine learning. With Python’s Scikit-learn
    library, you can perform almost all the data science and machine learning related
    tasks such as data visualization, feature engineering, classification and regression,
    text and image processing, and so on.


    This book is a beginner’s gateway to Python’s Scikit-learn library. After reading
    this book, you will be able to perform common data science and machine learning
    tasks, such as predicting the price of a certain item, predicting whether or not
    a banknote is fake, recognizing an image, classifying public sentiments, and much
    more. You will also learn how to perform data preprocessing and feature engineering
    tasks, such as handling missing values, converting categorical data into numerical
    and vice versa, etc.


    While this book is aimed at beginners, it can also be used by expert programmers
    as a reference to perform various machine learning and data science tasks.


    ## Book Approach


    The book follows a very simple approach. It is divided into 11 chapters.


    - **Chapter 1** provides a very brief introduction to data science and machine
    learning and the use of Python’s Scikit-learn library for machine learning.

    - **Chapter 2** explains the process for environment setup, including the software
    needed to run the scripts in this book. Chapter 2 also contains a crash course
    on Python for beginners. If you are already familiar with Python, you can skip
    chapter 2.

    - **Chapter 3** explains various data preprocessing techniques.

    - **Chapter 4** details how to perform feature selection with the Scikit-learn
    library.

    - **Chapters 5 and 6** contain introductions to supervised machine learning approaches
    like regression and classification with the help of the Scikit-learn library.

    - **Chapter 7** explains unsupervised machine learning, where you study different
    clustering approaches using the Python Scikit-learn library.

    - **Chapter 8** discusses dimensionality reduction approaches in Scikit-learn.

    - **Chapter 9** explains various model selection techniques in Scikit-learn.

    - **Chapters 10 and 11** show how to process text and images with Scikit-learn.


    Each chapter explains a concept theoretically followed by practical examples.
    Each chapter also contains exercises that students can use to evaluate their understanding
    of the concepts explained in the chapter.


    The Python notebook for each chapter is provided in the SharePoint repository.
    It is advised that instead of copying the code, you write the code yourself, and
    in case of an error, you match your code with the corresponding Python notebook,
    find and then correct the error.


    The datasets used in this book are either downloaded at runtime or are available
    in the `Datasets` folder in the SharePoint repository.


    ## Who Is This Book For?


    This book explains how to use Python’s Scikit-learn library to perform different
    types of data science and machine learning tasks. The book is aimed ideally at
    absolute beginners to data science and machine learning. Though a background in
    the Python programming language and feature engineering can help speed up learning,
    the book contains a crash course on Python programming language in the second
    chapter. Therefore, the only prerequisites to efficiently using this book are
    access to a computer with the internet and basic knowledge of linear algebra and
    calculus. All the codes and datasets have been provided. However, to download
    the data preparation libraries, you will need the internet.


    ## How to Use This Book?


    To get the best out of this book, I would suggest that you first get your feet
    wet with the Python programming language, especially the object-oriented programming
    concepts. To do so, you can take the crash course on Python in chapter 2 of this
    book.


    Also, try to read the chapters of this book in order since the concepts taught
    in the subsequent chapters are based on previous chapters. In each chapter, try
    to first understand the theoretical concepts behind the different types of data
    science and machine learning techniques and then try to execute the example code.


    I would again stress that rather than copying and pasting code, try to write the
    codes yourself, and in case of any error, you can match your code with the source
    code provided in the book as well as in the SharePoint repository.


    Finally, try to answer the questions asked in the exercises at the end of each
    chapter. The solutions to the exercises have been given at the end of the Book.


    # About the Author


    ![](Image00003.jpg)


    M. Usman Malik holds a Ph.D. in Computer Science from Normandy University, France,
    with Artificial Intelligence and Machine Learning being his main areas of research.
    Muhammad Usman Malik has over five years of industry experience in Data Science
    and has worked with both private and public sector organizations. In his free
    time, he likes to listen to music and play snooker.

