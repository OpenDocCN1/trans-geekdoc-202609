    The `if-else` statement comes in handy when you want to execute an alternate piece
    of code in case the condition for the `if` statement returns false. For instance,
    in the following example, the condition `5 > 10` will return false. Hence, the
    code block that follows the `else` statement will execute.


    **Script 10:**

