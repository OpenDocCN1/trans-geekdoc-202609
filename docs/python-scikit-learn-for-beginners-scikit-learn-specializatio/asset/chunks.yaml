    ![](img/Image00340.jpg)\n\n# 7.2 层次聚类\n\n与 K-Means 聚类一样，层次聚类是另一种常用的无监督机器学习技术，用于数据聚类。层次聚类可分为两类：凝聚层次聚类和分裂层次聚类。凝聚层次聚类遵循自底向上的方法，将单个数据点聚类在一起形成多个小簇，进而形成一个大簇，然后可以使用树状图将其分成小簇。另一方面，在分裂层次聚类中，你有一个大簇，将其分成\
