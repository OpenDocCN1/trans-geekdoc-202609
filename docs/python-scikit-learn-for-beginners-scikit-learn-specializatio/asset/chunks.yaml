    # 练习 7.2


    对共享仓库中 `Datasets` 文件夹下的 `banknote.csv` 数据集应用 K-Means 聚类。找出最佳聚类数，然后打印聚类后的数据集。以下脚本导入数据集并打印数据集的前五行。


    # 使用 Sklearn 进行 PCA 和 LDA 降维


    降维是指以一种方式减少数据集中的特征数量，使得在该数据集上训练的算法的整体性能受到的影响最小。通过降维，统计算法的训练时间可以显著缩短，并且数据可以更容易地可视化，因为高维数据集不易可视化。降维主要有三种方法：主成分分析（PCA）、线性判别分析（LDA）和奇异值分解（SVD）。在本章中，您将学习这些方法，并通过示例了解如何使用
    Python 的 Sklearn 库实现它们。


    ## 8.1 主成分分析


    主成分分析是一种无监督降维技术，不依赖于数据集的标签。主成分分析根据特征在输出中引起最大方差的能力对特征进行优先排序。PCA 的核心思想是捕捉那些包含关于数据集最大信息量的特征。在输出中引起最大方差的特征称为第一主成分，引起第二大方差的特征称为第二主成分，以此类推。


    ### 为什么使用 PCA？


    以下是 PCA 的优势：


    1.  可以使用 PCA 检测并移除相关特征。

    2.  由于特征数量减少，降低了过拟合风险。

    3.  可以加快模型训练速度。


    ### PCA 的缺点


    PCA 有两个主要缺点：


    1.  应用 PCA 之前需要对数据进行标准化。

    2.  自变量变得不那么易于解释（integrable 原文如此，通常指可解释性/可积性）。

    3.  减少特征时会丢失一定量的信息。


