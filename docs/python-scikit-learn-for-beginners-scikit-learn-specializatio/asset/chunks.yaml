    Index([''fixed acidity'', ''residual sugar'', ''free sulfur dioxide'', ''total
    sulfur dioxide'', ''alcohol''], dtype=''object'')

    ```


    You can also get the attribute names that are not selected using the following
    script.


    **Script 6:**

    ```

    [Code for Script 6 - Image00186.jpg]

