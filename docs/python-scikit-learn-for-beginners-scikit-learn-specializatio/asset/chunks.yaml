    ![](Image00077.jpg)


    The output shows that the min/max scaling doesn’t change the data distribution
    of the dataset.


    ### 3.1.3 Mean Normalization


    Mean normalization is very similar to min/max scaling, except in mean normalization
    the mean of the dataset is subtracted from each value and the result is divided
    by the range, i.e., the difference between the minimum and maximum values. The
    following script calculates the mean values for all the columns.


    **Script 10:**

