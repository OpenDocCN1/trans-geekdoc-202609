    # 8.3 Singular Value Decomposition


    Data for machine learning algorithms can be represented in the form of a matrix.
    Therefore, any technique that is used to reduce a matrix into its constituent
    components can be applied for dimensionality reduction since a dimension is basically
    a column in a matrix if you represent data features in the form of columns. The
    process of reducing or describing a matrix using its constituent components is
    called matrix decomposition. One of the most commonly used techniques for matrix
    decomposition is singular value decomposition (SVD). Singular value decomposition
    is commonly used for dimensionality reduction in machine learning. In this section,
    you will see the advantages and disadvantages of SVD for dimensionality reduction
    and how you can implement it with Sklearn.


    ## Why Use SVD?


    The following are some of the main advantages of SVD:


    *   Works better with sparse datasets, such as a bag of words representation of
    textual data.

    *   Orders the features by relevance.

    *   Extremely efficient for larger datasets.


    ## Disadvantages of SVD


    The following are the main disadvantages of SVD:


    *   SVD is relatively slower and computationally expensive.

    *   Results are not best for visualization; hence, difficult to interpret.

    *   May not work well with highly non-linear data.


    ## Implementing SVD with Sklearn Library


    Let''s now see how you can implement SVD via Python''s Sklearn Library. You will
    be applying SVD for dimensionality reduction of the Wine dataset. The Wine dataset
    can be found in the Datasets folder. The following script imports the `winequality-red.csv`
