  \ |\n| ![](img/#index.htm) ![上一节](img/#ch01lev1sec13.htm) ![下一节](img/#ch01lev1sec15.htm)\
  \ |\n| --- |\n\n* * *\n\n### phpinfo( )\n\n`phpinfo()` 是一个非常有用的函数，它允许你查看你的 Web 服务器上运行的是哪个版本的\
  \ PHP，以及该版本中启用的所有特定设置。\n\n在本书中，会有一些章节要求你验证自己的设置。实现这一点的一种方法是创建一个仅包含以下内容的脚本：\n\n```php\n\
  <? \n    phpinfo();\n?>\n```\n\n执行该脚本后，浏览器将显示当前的 PHP 设置。如果你正在他人的服务器上工作，并且不确定它的功能，那么这个函数将特别有用。\n\
  \n* * *\n\n| ![](img/pixel.gif) |\n| --- |\n| ![](img/#index.htm) ![上一节](img/#ch01lev1sec13.htm)\
  \ ![下一节](img/#ch01lev1sec15.htm) |\n| 回到顶部 |\n| --- |\n| ![](img/#index.htm) ![上一节](img/#ch01lev1sec13.htm)\
  \ ![下一节](img/#ch01lev1sec15.htm) |\n| --- |\n\n## 第 2 章 Session 管理\n\n### 2.1 Session\
  \ 简介\n本章向你介绍如何使用 PHP 管理 Session。Session 允许你在页面之间存储信息。\n\nSession 是通过一个唯一的 ID 来标识的。这个\
  \ ID 通常存储在浏览器的 Cookie 中，但如果禁用了 Cookie，Session ID 可以在 URL 中传递。在本章，你将学习如何启动、使用和销毁\
  \ Session。\n\n### 2.2 启动 Session\n要启动 Session，必须调用 `session_start()` 函数。这应该在脚本的最开始部分，在任何输出到浏览器之前完成。\n\
  \n```php\n<?php\nsession_start();\n```\n\n### 2.3 Session 内容\n一旦启动了 Session，你就可以使用\
  \ `$_SESSION` 全局变量存储数据。\n\n```php\n<?php\nsession_start();\n$_SESSION[\"username\"\
  ] = \"John\";\n$_SESSION[\"role\"] = \"admin\";\n?>\n```\n\n### 2.4 销毁 Session\n\
  要销毁 Session，可以使用 `session_destroy()` 函数。\n\n```php\n<?php\nsession_start();\nsession_destroy();\n\
  ?>\n```\n\n### 2.5 配置\n在本章开始之前，你可能需要对 php.ini 文件进行一些微调，以便 Session 正常工作。\n\n####\
  \ Windows\n如果你使用的是 Windows 版本的 PHP，第一件事是编辑 php.ini 文件。php.ini 中的默认 Session 设置在 Windows\
  \ 下无法正常工作。\n\n用文本编辑器打开 php.ini 文件（位于 `c:\\windows` 或 `c:\\winnt`），并搜索以下行：\n\n```ini\n\
  session.save_path = /tmp\n```\n\n将其更改为你存放临时文件的目录，例如：\n\n```ini\nsession.save_path\
  \ = C:/temp\n```\n\n你也可以保留该值为 /tmp，并在你的 Web 服务器所在的磁盘根目录下创建一个 \"tmp\" 的目录。例如，如果你的\
  \ Web 服务器位于 D:/apache/bin，那么你可以创建 d:/tmp，而无需更改 php.ini 中的 session.save\\_path 设置。\n\
  \n在 Windows 上，session.save\\_path 设置错误的良好迹是：当你尝试加载启用 Session 的页面时，Apache 会崩溃。\n\n\
  #### Linux\n如果你使用的是 Linux，你需要确保 /tmp 目录可以由运行 Web 服务的用户写入。这通常是 nobody 用户，大多数系统默认都允许\
  \ nobody 用户写入 /tmp 目录。\n\n其余的默认 Session 设置在本章的示例中应该都能正常工作。\n\n### 更多资源\n如果你还需要更多关于\
  \ Session 的信息，可以参考以下书籍：\n\n*   PHP Programming to Build Dynamic Websites (2nd Edition)\
  \ by Atkinson\n*   Essential PHP for Web by Cosentino\n*   Core PHP: Using PHP by\
  \ Prentice Hall\n\n\n\n\n\n你不应该将会话文件（session files）存储在任何从 Web 服务器可见的目录中。如果你使用的是\
  \ `Apache`，那么任何 `htdocs` 目录下的目录都是如此。你不希望将会话文件放置在 Web 服务器可见的目录中的，是因为恶意用户可能会打开这些文件并查看单个会话数据，甚至通过这种方式劫持用户会话。\n\
  \n## 启动会话\n\n除非你在每个想要使用或更改变量的页面上启动会话，否则你无法跨用户会话跟踪变量。启动会话使用 `session_start()` 函数：\n\
  \n```\nsession_start(); \n```\n\n`session_start()` 不接受任何参数。如果你正在启动一个新的会话，该函数将初始化会话并创建必要的临时文件来跟踪会话。如果函数通过\
  \ cookie 或 `GET` 变量发现了 `$PHPSESSID`，则函数将恢复当前会话，页面将可以任何已注册到会话的变量。\n\n一旦你启动了会话，你就需要向会话注册一些变量。在通过\
  \ `session_register()` 函数注册变量之前，会话不会跟踪这些变量：\n\n```\nsession_register(STRING); \n\
  ```\n\n`session_register()` 的 `STRING` 参数应该是你想注册到会话的变量名称，以便可以在任何启用会话的页面上访问它。\n\n\
  一旦你启动了会话并注册了一个或多个变量，你就可以在网站的任何启用会话的页面使用这些变量。脚本 2-1 `session.php` 提供了一个启动会话和注册变量的简单示例。\n\
  \n### 脚本 2-1 session.php\n\n```\n1.  <?\n 2.  session_start();\n 3.  if(!isset($count))\
  \ {\n 4.    session_register(\"count\");\n 5.    $count = 1;\n 6.  }\n 7.  ?>\n\
  \ 8.  You have been to this page <?=$count?> times.\n 9.  <?\n10.  $count++;\n11.\
  \  ?>\n```\n\n### 脚本 2-1 session.php 逐行解释\n\n| 行 | 描述 |\n| --- | --- |\n| 2 | 启动会话或继续已有的会话。\
  \ |\n| 3 | `if` 语句检查 `$count` 变量是否已设置。如果 `$count` 变量已设置，则脚本假设这是会话的延续，不采取任何操作，并继续到第\
  \ 7 行。 |\n| 4 | 如果 `$count` 变量未设置，则脚本假设这是一个新会话的开始，并注册变量 `$count`。 |\n| 5 | 由于脚本在上一行刚刚注册了变量\
  \ `$count`，因此它使用此行为 `$count` 分配一个默认值 1。 |\n| 8 | 显示一行文本，说明页面被访问的次数。 |\n| 10 | 将\
  \ `$count` 变量加 1。 |\n\n运行此脚本并多次点击刷新按钮。注意，每次你刷新页面时，页面访问次数都会增加 1。图 2-1 显示了这种示例。关闭浏览器然后在新浏览器中重新加载页面会将\
  \ `$count` 重置为 '1'，因为关闭浏览器实际上结束了会话。\n\n### 图 2-1 session.php\n\n![graphics/02fig01.jpg)\n\
  \n## 会话文件的内容\n\n你可以通过查看 `php.ini` 文件中 `session.save_path` 设置指定的目录来查看会话变量的实际内容。在该目录下，你应该能看到一个类似于\
  \ \"sess_c4a972c1745304544dc5cc1\" 的文件。重要部分是文件名是以 `sess_` 开头的。之后的随机字符串是 PHP 分配给每个会话的唯一标识符。如果你在一个共享站点上或过去运行过任何会话，可能会有几个看起来像\
  \ PHP true 的文件。尝试找到时间戳与你访问示例时最接近的一个，但打开任何一个文件都会让你对会话变量是如何存储的。。在文本编辑器中打开文件将显示以下内容：\n\
  \n```\ncount|i:6;\n```\n\n文件中显示的实际数字将有所不同，取决于你重新加载页面的次数。文件内容显示变量名，后面是一个管道符号 `|`，然后是变量类型标识符——在这种情况下\
  \ \"i\" 代表整数——最后是变量的值，后跟分号。如果你在会话中注册了多个变量，它们将按照注册的顺序列出，大多数情况下用分号分隔。例如，如果你在会话中注册了两个整数变量\
  \ `$count` 和 `$day`，它们将如下所示：\n\n```\ncount|i:6;day|i:7;\n```\n\n表 2-1 详细列出了你在典型会话文件中可能会看到的常见变量类型。\n\
  \n### 表 2-1 会话文件中的变量类型标识符\n\n| 符号 | 变量类型 |\n| --- | --- |\n| i | 整数 (Integer) |\n\
  | s | 字符串 (String) |\n| b | 布尔 (Boolean) |\n| d | 浮点数 (Float) |\n| a | 数组 (Array)\
  \ |\n| O | 对象 (Object) |\n| N | NULL |\n\n## 会话期间跨页面跟踪变量\n\n现在你已经如何启动会话并跟踪某些变量，如何利用这些呢？会话有无数用途，但会话真正的益处是减少你和\
  \ Web 服务器的工作量。考虑一个拥有注册用户的典型站点。该站点可能有论坛、用户可以回应的故事，以及用户可以选择启用或禁用的各种功能。\n\n通常，你会将这些偏好存储在某些数据库中，并在用户登录站点时加载。你需要一种方法在用户查看的每个页面上记住这些值。如果用户不想在某个页面上看到投票功能，那么可以假设他们也不想在其他页面上看到它。你可以在用户每次加载页面时查询数据库以查看应该启用哪些功能，或者可以将这些信息存储在\
  \ cookie 中，但每种方法都有缺点。对于大型站点，每次加载页面都查询数据库会导致严重的服务器资源问题。\n\n\n\n\n\n这正是会话（sessions）大显用场。你可以存储可以在多个页面访问的值。通过在会话开始时加载用户偏好，你可以将数据库查询减少到最低，并且只需要担心在用户的浏览器上存储一个\
  \ cookie，从而消除了对任何网站在浏览器上存储的 cookie 数量有限的顾虑。如果你使用 `PHP` 的会话链接重写功能，你甚至不需要担心这一个 cookie！\n\
  \n在接下来的示例中，你将把一些默认变量加载到会话中，就像它们来自数据库查询一样，然后将在脚本 2-3 `track_prefs2.php` 中验证会话变量是否有效。结果将显示在图\
  \ 2-2 中。\n\n#### 脚本 2-2 track_prefs1.php\n\n```\n1.  <?\n 2.  session_start();\n\
  \ 3.  session_register(\"first\");\n 4.  session_register(\"last\");\n 5.  session_register(\"\
  email\");\n 6.  session_register(\"news_prefs\");\n 7.  ?>\n 8.  <html>\n 9.  <head>\n\
  10.  <title>Welcome</title>\n11.  <style type=\"text/css\">\n12.    p, ul, h3 {font-family:\
  \ verdana, helvetica, sans-serif;}\n13.    .enabled {font-weight: bold; color: green;}\n\
  14.    .disabled {font-weight: bold; color: red;}\n15.  </style>\n16.  </head>\n\
  17.  <<body>\n18.  <?\n19.  function load_user_data(){\n20.    global $first, $last,\
  \ $email, $news_prefs;\n21.    $first = \"Faye\";\n22.    $last = \"Valentine\"\
  ;\n23.    $email = \"faye@bebop.com\";\n24.    $news_prefs = array(\n25.      \"\
  Local\" => 0,\n26.      \"Nation\" => 1,\n27.      \"World\" => 1,\n28.      \"\
  Comics\" => 0,\n29.      );\n30.  }\n31.  load_user_data();\n32.  ?>\n33.  <h3>Welcome</h3>\n\
  34.  <p>Welcome back <b><?=$first?></b>\n35.  <p>Your settings have been loaded.\n\
  36.  <p><a href=track_prefs2.php>View Your Settings</a>.\n37.  </</body>>\n38. \
  \ </html>\n```\n\n#### 图 2-2. track_prefs2.php\n\n![graphics/02fig02.jpg](img/02fig02.jpg)\n\
