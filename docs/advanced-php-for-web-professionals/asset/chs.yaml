  \n* * *\n\n## 第 1 章.PHP 复习\n\n*   概述\n*   PHP 语法\n*   变量\n*   运算符\n*   数组\n*   If/Then\
  \ 语句\n*   Switch 语句\n*   For 循环\n*   Foreach 循环\n*   While 循环\n*   Do While 循环\n\
  *   自定义函数\n*   使用 PHP 进行对象编程\n*   phpinfo\n*   其他资源\n\n### 概述\n\nPHP 是一种设计为易于嵌入\
  \ HTML 页面的语言（尽管你不必这样做）。大多数 PHP 页面都是 PHP 代码和 HTML 混合的。当 Web 服务器读取 PHP 页面时，它会寻找两个标记来告知它应该以\
  \ PHP 而不是 HTML 启动页面，即 PHP 的起始和结束标记：`<?php` 和 `?>`。\n\n如果你配置了 `php.ini` 文件以接受“短标签”（默认启用），那么你可以使用\
  \ `<?` 和 `?>` 代替。此外，你还可以配置 `php.ini` 文件使其接受 ASP 风格标签 `<%` 和 `%>`。此功能默认关闭，其唯一的真实目的似乎允许某些\
  \ HTML 编辑器将中间的代码识别为 HTML 之外的内容，这样编辑器就不会通过强加自身的一套 HTML 语法规则来破坏代码。\n\n嵌入 HTML 的 PHP\
  \ 简短示例：\n\n```\n<h1>Welcome To The Web Site Of <? echo $company; ?>!</h1\n```\n\n\
  上述代码通过 Web 服务器查看时，简单地在 PHP 代码位置打印出公司名称。\n\n通常，单行 PHP 代码应该以分号结束，但如果使用了起始或结束括号，则没有需要使用分号（这在看\
  \ if/then 语句时就能理解了）。\n\n例如：\n\n```php\n<? \necho \"<p>a line of code\";\necho \"\
  <p>another line of code;\n?>\n```\n\n### PHP 语法\n\n本书假设你已经有一定的 PHP 经验。这本书并不是一本入门读物，而是一本为那些可能需要快速复习或已经熟悉类似语言（如\
  \ PERL）的人提供的更高级用法的书籍。\n\n尽管如此，我仍然提供了关于 PHP 的简短介绍。例如：\n\n```php\n<? \necho \"<p>a\
  \ line of code\";\necho \"<p>another line of code;\n?>\n```\n\n\n\n\n\n| ![](img/#index.htm)\
  \   ![Previous section](img/#ch01lev1sec1.htm)   ![Next section](img/#ch01lev1sec3.htm)\
  \ |\n| Top |\n| --- |\n| ![](img/#index.htm)   ![Previous section](img/#ch01lev1sec2.htm)\
  \   ![Next section](img/#ch01lev1sec4.htm) |\n| --- |\n\n* * *\n\n### 变量\n\n你也可以轻松地将小的\
  \ PHP 代码嵌入到 HTML 中，例如打印变量的值时：\n\n```php\n<h1>Today's Date is <?= $date ?>.</h1>\
  \ \n```\n\nPHP 中的 `<?=` 语法在后跟变量时，用作 `echo()` 函数的简写。\n\n你可以在 PHP 脚本中包含注释。Web 服务器会忽略注释，PHP\
  \ 代码中的任何注释都不会发送到浏览器。注释有三种形式：\n\n*   `#`—用法与在 PERL 中相同；注释 `#` 符号之后行的剩余部分。\n*   `//`—用法与在\
  \ JavaScript 中相同；注释 `//` 符号之后行的剩余部分。\n*   `/*` 和 `*/`—注释掉两组符号之间的任何内容。这与 C 语言中注释代码的语法相同。\n\
  \nPHP 代码中的注释示例：\n\n```php\n<? \necho \"Hello\"; #打印出 \"Hello\"\necho \"Hello\";\
  \ //打印出 \"Hello\"\n/* The following\nprints out \"Hello\" */\necho \"Hello\";\n\
  ?>\n```\n\n你经常看到使用 `//` 字符或 `/*` 和 `*/` 字符表示的注释。`#` 字符很少见，尽管它仍然有效。\n\nPHP 变量由 `$`\
  \ 表示。要给变量 `$a` 赋值 \"Hello World\"，你只需在代码中调用它：\n\n```php\n$a = \"Hello World\"; \n\
  ```\n\n字符串必须用引号包含，但它们本身可以包含变量：\n\n```php\n$a = 4; \n$string = \"The value of a is\
  \ $a\";\n// $string = \"The Value of a is 4\";\n```\n\nPHP 变量不需要预先声明，也不需要定义类型。注意，如果你尝试在给变量赋值之前使用，可能会收到关于使用未声明变量的警告（取决于你在\
  \ `php.ini` 中如何设置错误报告，请参阅[第 8 章]）。例如：\n\n```php\n$a = 4; \n$c = $a + $b;\n// $c\
  \ = 4, 但会出现警告 \"Warning: Undefined variable..\"\n```\n\n警告不会阻止脚本继续。如果你忘记在某行的末尾添加分号，你将得到解析错误（Parser\
  \ error），这将阻止脚本运行。\n\n由于 PHP 变量不是强类型的，你不需要担心像在 C 语言中那样在错误的类型上进行数学运算。例如：\n\n```php\n\
  $a = 4; \n$b = \"5\";\n$c = $a + $b;\n// $c = 9;\n```\n\nPHP 还支持布尔变量，可以赋值 1 或 0，或者\
  \ true 或 false 单词：\n\n```php\n$a = true; \n$b = 1;\n//$a = $b\n$c = false;\n$d =\
  \ 0;\n//$c = $d\n```\n\n* * *\n\n| ![](img/pixel.gif) |\n| --- |\n| ![](img/#index.htm)\
  \   ![Previous section](img/#ch01lev1sec2.htm)   ![Next section](img/#ch01lev1sec4.htm)\
  \ |\n| Top |\n| --- |\n| ![](img/#index.htm)   ![Previous section](img/#ch01lev1sec3.htm)\
  \   ![Next section](img/#ch01lev1sec5.htm) |\n| --- |\n\n* * *\n\n### 运算符\n\nPHP\
  \ 对运算符的支持包括以下内容：\n\n#### 算术运算符\n\nPHP 支持标准的数学运算符：\n\n```php\n$a = 4; \n$b = 2;\n\
  //加法: $a + b = 6\n//减法: $a - $b = 2\n//乘法: $a * $b = 8\n//除法 :$a / $b = 2\n//取模\
  \ ($a / $b 的余数): $a % $b = 0\n//自增: $a++ (由于 $a = 4，将等于 5)\n```\n\n#### 赋值运算符\n\n\
  PHP 中两个主要的赋值运算符是 `=` 和 `.`。等号显而易见，它为变量赋值：\n\n```php\n$a = 4; \n$b = $a;\n// $b =\
  \ 4\n```\n\n#### 比较运算符\n\nPHP 支持标准的比较运算符，如[表 1-1]所示：\n\n| 运算符 | 描述 |\n| --- | ---\
  \ |\n| `$a == $b` | 测试两个值是否相等 |\n| `$a != $b` | 测试两个值是否不相等 |\n| `$a < $b` | 测试第一个值是否小于第二个值\
  \ |\n| `$a > $b` | 测试第一个值是否大于第二个值 |\n| `$a <= $b` | 测试第一个值是否小于或等于第二个值 |\n| `$a >=\
  \ $b` | 测试第一个值是否大于或等于第二个值 |\n\nPHP 还支持自增和自减运算符：\n\n```php\n$a = 4; \n$a++; // $a\
  \ = 5\n$b = 5;\n$b--; // $b = 4\n```\n\n#### 字符串拼接\n\n`.` 运算符连接两个值：\n\n```php\n\
  $a = \"The \";\n$b = \"fox\";\n$c = $a . $b;\n// $c = \"The fox\"\n```\n\n* * *\n\
  \n### 数组\n\nPHP 支持数值数组（按顺序索引）以及关联数组（按键索引）。\n\n```php\n$fruits = array(\"apple\"\
  , \"banana\", \"cherry\");\n$age = array(\"Ben\"=>\"35\", \"Peter\"=>\"37\", \"\
  Joe\"=>\"43\");\n```\n\n* * *\n\n### if/then 语句\n\n你常见的语言结构之一是 if/then 语句。if/then\
  \ 语句允许你评估一个表达式并根据其真假采取行动。例如：\n\n```php\n$a = 1;\nif($a) {\n  echo \"True!\";\n}\n\
  ```\n\n由于 `$a = 1`，PHP 在 if 语句上下文中将其解释为布尔类型。由于 1 为真，if 语句输出了消息。另一个例子，这次带有 \"else\"\
  \ 子句：\n\n```php\n$a = 5;\n$b = \"10\";\nif($a > $b) {\n    echo \"$a is greater\
  \ than $b\";\n} else {\n    echo \"$a is not greater than $b\";\n}\n```\n\nPHP 不关心\
  \ `$a` 是整数而 `$b` 是字符串。它意识到 $b 也是一个很好的整数。它然后评估表达式：“如果 $a 大于 $b$，则打印 $a$ 大于 $b$；如果不是（else），则打印\
  \ $a$ 不大于 $b$。”同样重要的是，你没有说 \"$a 小于 $b$”，因为 $a$ 可能等于 $b$。如果是这种情况，那么表达式的后半部分即 else\
  \ 语句就是执行的部分。\n\n注意使用括号来包裹操作。同样注意在括号使用的地方没有分号。\n\n最后一个例子是 if/elseif/else 语句：\n\n\
  ```php\nif($a == $b) { \n    // 执行某些操作\n} elseif ($a > $b) {\n    // 执行其他操作\n} elseif($a\
  \ < $b) {\n    // 执行再次其他操作\n} else  {\n    // 如果其他都不符合，我们执行这个...\n}\n```\n\n\n\n\
  \n\n在 C 语言中，`switch` 语句的出现是为了在进行 `if/then` 类型的计算时需要一些额外的支持。使用 `if/then` 语句时，你被限制在单一条件下。`switch`\
  \ 语句允许对数据进行额外的评估，即使其中一个 `case` 已经满足。`switch` 语句还可以避免你编写大量的 `if/elseif/elseif/…`\
  \ 语句。PHP 遵循了 C 对 `switch` 语句的使用。\n\n```php\n$a = \"100\"; \nswitch($a) {\n    case(10):\n\
  \      echo \"The value is 10\";\n      break;\n    case (100):\n      echo \"The\
  \ value is 100<br>\";\n    case (1000):\n      echo \"The value is 1000\";\n   \
  \   break;\n    default:\n      echo \"<p>Are you sure you entered a number?\";\n\
  }\n```\n\n如你所示，`switch` 语句包含四个基本部分：\n\n- **switch**: `switch` 识别在每个 `case` 中将要评估的值或表达式。在上面的示例中，你告诉\
  \ `switch` 语句你将在后续的情况下中评估变量 `$a`。\n- **case**: `case` 语句评估你从 `switch` 命令传递的变量。你可以像使用\
  \ `if` 语句一样使用 `case()`。如果 `case` 为真，则执行 `case` 语句之后的所有内容，直到解析器遇到 `break` 命令，此时执行停止并退出\
  \ `switch`。\n- **Breakpoints（断点/跳出）**: 由 `break` 命令定义，使解析器退出 `switch`。断点通常放在满足 `case()`\
  \ 时执行的语句之后。\n- **Default（默认值）**: `default` 是一种特殊的 `case`。如果 `switch` 中没有其他 `case`\
  \ 语句被执行，则会执行它。\n\n### For 循环 (For Loops)\n\nFor 循环是遍历有限数据集合的有用结构，例如数组中的数据：\n\n```php\n\
  for($i = 0; $i < sizeof($array); $i++) { \n    //对 array[$i] 进行某些操作\n}\n```\n\n\
  For 循环在定义时需要三个要素：\n\n- **Counter（计数器）**: 在上面的示例中为 `$i = 0`。你可以传递一个已经赋值的变量，或者在 `for`\
  \ 语句中为变量赋值。\n- **condition（条件）**: 继续 `for` 循环所需的条件：在上面的示例中，只要 `$i` 小于 `$array` 的大小，`for`\
  \ 循环就会继续执行。\n- **statement（语句）**: 在每次循环中修改计数器的语句：在上面的示例中，`$i++` 在每次循环后增加计数器。\n\n\
  ### Foreach 循环 (Foreach Loops)\n\nForeach 循环允许你快速遍历数组。\n\n```php\n$array = array(\"\
  name\" => \"Jet\", \"occupation\" => \"Bounty Hunter\" ); \nforeach ($array as $val)\
  \ {\n    echo \"<P>$val\";\n}\n```\n输出：\n<P>Jet\n<P>Bounty Hunter\n\n你也可以使用 `foreach`\
  \ 循环获取数组中值的键（key）：\n\n```php\nforeach ($array as $key => $val) { \n    echo \"<P>$key\
  \ : $val\";\n}\n```\n输出：\n<P>name : Jet\n<P>occupation : Bounty Hunter\n\n### While\
  \ 循环 (While Loops)\n\n`while` 循环是另一种有用的结构。`while` 循环持续持续直到循环中的表达式为假。`while` 循环的一个常见用途是从结果集中返回行：\n\
  \n```php\nwhile($row = fetch_array(result)) {\n    // 某些操作\n}\n```\n\n你还可以使用 `continue`\
  \ 来跳过当前迭代，例如：\n\n```php\nwhile($row = fetch_array(result)) {\n    if($row['name']\
  \ != \"Jet\") {\n        continue;\n    }\n    // 执行某些操作\n}\n```\n\n### Do While\
  \ 循环 (Do While Loops)\n\n`do while` 循环的工作原理与 `while` 循环完全相同，但 `do while` 循环在循环完成后评估表达式，而不是像\
  \ `while` 循环那样在循环之前。`do while` 循环至少执行一次：\n\n```php\n$i = 0;\ndo {\n   print $i;\n\
  } while ($i>0);\n```\n\n而以下代码可能完全不会执行：\n\n```php\n$i = 0;\nwhile($i > 0) {\n   print\
  \ $i;\n}\n```\n\n### 自定义函数 (User-Defined Functions)\n\n除了 PHP 的内置函数外，你还可以创建自己的函数。记住，如果你想使用函数外部存在的变量，必须将它们声明为全局变量，或者将它们作为参数传递给函数。\n\
  \n```php\nfunction check_age($age) { \n    if ($age > 21) {\n        return 1;\n\
  \    } else {\n        return 0;\n    }\n}\n// 使用：\nif(check_age($age)) {\n    echo\
  \ \"You may enter!\";\n} else {\n    echo \"Access Not Allowed!\";\n    exit;\n\
  }\n```\n\n函数将在你的脚本内部适当时间通过以下语法被调用：\n\n```php\n$age = 10; \ncheck_age($age);\n//\
  \ 在屏幕上打印 \"Access Not Allowed!\"\n```\n\n### PHP 面向对象编程 (Object Oriented Programming\
  \ with PHP)\n\nPHP 以类的形式支持面向对象编程 (OOP)。就像在其他 OOP 语言中一样，可以扩展类以实现代码的更高重用。\n\n创建一个包含人的姓、名和电话号码的地址条目类：\n\
  \n\n\n\n\n```php\nclass address_book_entry { \n    var $first;\n    var $last;\n\
  \    var $number;\n    function set_name($first, $last) {\n      $this->first =\
  \ $first;\n      $this->last = $last;\n    }\n    function set_number($number) {\n\
  \      $this->number = $number;\n    }\n    function display_entry() {\n      echo\
  \ \"<p>Name: \" . $this->first . \" \" . $this->last;\n      echo \"<br>Number:\
  \ \" . $this->number;\n    }\n}\n// Usage:\n$entry = &new address_book_entry;\n\
  $entry->set_name(\"Jane\",\"Smith\");\n$entry->set_number(\"555-555-5555\");\n$entry->display_entry();\n\
  // 显示:\nName: Jane Smith\nNumber: 555-555-5555\n```\n\n此外，你可以扩展现有类来创建一个新类，该类将具有旧类相同的功能，加上你添加的任何新功能：\n\
  \n```php\nclass address_book_entry2 extends address_book_entry { \nvar $email;\n\
  function set_email($email) {\n       $this->email = $email;\n    }\n    function\
  \ display_entry2() {\n      echo \"<p>Name: \" . $this->first . \" \" . $this->last;\n\
  \      echo \"<br>Number: \" . $this->number;\n      echo \"<br>Email: \" . $this->email;\n\
  \    }\n}\n// Usage:\n$entry = &new address_book_entry2;\n$entry->set_name(\"Jane\"\
  ,\"Smith\");\n$entry->set_number(\"555-555-5555\");\n$entry->set_email(\"jsmith@com.com\"\
  );\n$entry->display_entry();\n// 显示:\nName: Jane Smith\nNumber: 555-555-5555\nEmail:\
  \ smith@com.com\n```\n\n* * *\n\n| ![](img/pixel.gif) |\n| --- |\n| ![](img/#index.htm)\
