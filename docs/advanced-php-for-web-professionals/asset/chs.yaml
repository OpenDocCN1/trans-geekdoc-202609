  \ | 创建用于电话或 Web 进行的“虚拟”会议的默认房间。 |\n| 18–28 | 创建存储会议数据的表。“room”和“originator”是连接回用户和房间表的伪外键。\
  \ |\n| 30–32 | 创建存储每个会议用户的表。表中的每行都对应一个用户和一个会议的键。一个会议可以在此表中有多条记录。 |\n\n#### meeting.php\n\
