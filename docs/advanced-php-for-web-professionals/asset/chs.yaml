  \ 语句。 |\n\n***\n\n## 第 3 章 多数据库交互\n\n### 本章内容\n\n*   PHP4 中的高级数据库交互\n*   PHP 中的特定数据库函数\n\
  *   DBX—PHP 对多数据库的支持\n*   创建你自己的多数据库支持\n*   使用 `PEAR::DB`\n\n### PHP4 中的高级数据库交互\n\
  \n如果你已经接触了 PHP 一段时间，你很可能已经注意到它对连接 MySQL 数据库的卓越支持。市面上大多数 PHP 书籍只描述了 PHP 对 MySQL 的数据库支持。但\
  \ PHP 支持更多的数据库，且提供的支持程度几乎与 MySQL 相同。从 4.1 版本开始，PHP 以后各种形式支持以下数据库：\n\n*   MySQL—\
  \ [www.mysql.com](http://www.mysql.com)\n*   mSQL— [www.hughes.com.au](http://www.hughes.com.au)\n\
  *   MS SQL (Microsoft SQL server；仅限 Win32 系统)\n*   filePro (只读)— [www.fptech.com](http://www.fptech.com)\n\
  *   Informix—（来自 IBM） [www.informix.com](http://www.informix.com)\n*   InterBase—\
  \ [www.interbase.com](http://www.interbase.com)\n*   Oracle— [www.oracle.com](http://www.oracle.com)\n\
  *   Ovrimos— [www.ovrimos.com](http://www.ovrimos.com)\n*   Sybase— [www.sybase.com](http://www.sybase.com)\n\
  *   DB++—实验性— [www.concept-asa.de](http://www.concept-asa.de)\n*   DBM—适用于多种版本 *nix*\
  \ 的扁平文件数据库\n*   PostgreSQL— [www.pgsql.com](http://www.pgsql.com)\n*   Frontbase—\
  \ [www.frontbase.com](http://www.frontbase.com)\n\n基本上，PHP 已经拥有足够的内置支持来满足你的大多数数据库需求，特别是因为它包含了对\
  \ Oracle、Sybase、Informix 和微软等商业巨头的支持。\n\n遗憾的是，每个被支持的数据库都有不同的函数来完成相同的操作。例如，连接到 MySQL\
  \ 数据库使用 `mysql_connect` 函数，而连接到 MS SQL 服务器则使用 `mssql_connect`。这两个函数几乎完全相同，但名称不同。\n\
  \n\n\n\n\n使用上述所有信息并无妨，但如果主机是 `localhost`，端口是默认端口 `5432`，且该用户没有关联密码，那么你可以直接使用：\n\n\
  ```\npg_connect(\"dbname=test user=username\"); \n```\n\n请参阅特定的 PostgreSQL 实现文档以获取相关信息。本章中的示例假设你正在默认端口\
  \ `5432` 上运行 PostgreSQL 服务器，因此 `pg_connect` 示例中未包含端口号。\n\n## 选择合适的数据库\n\n一旦你成功连接到数据库服务器，接你就需要选择要在哪个数据库上执行查询。\n\
  \n在 PostgreSQL 的情况下，你已经在 `pg_connect()` 函数中选择了数据库，因此没有选择数据库的函数。\n\n然而，在使用 MS SQL\
  \ 或 MySQL 时，你仍然需要使用相应的函数来选择数据库：\n\n```\nmysql_select_db(STRING) \n```\n\n或者\n\n\
  ```\nmssql_select_db(STRING) \n```\n\n在每情况下，`STRING` 指向你正在连接的数据库名称。\n\n## 查询数据库以插入、读取或删除数据\n\
  \n一旦连接到数据库服务器并选择了数据库，接下来的逻辑步骤是以查询的形式对数据进行某些操作。大多数数据库接受查询中的任何标准 SQL 命令，也接受它们自己的特定数据库命令。\n\
  \n示例中使用的三个数据库都使用相同的语法：\n\n*   `mysql_query(STRING);`\n*   `mssql_query(STRING);`\n\
  *   `pg_query(STRING);`\n\n其中 `STRING` 是一个 SQL 语句，例如 `\"SELECT name FROM phonebook\
  \ WHERE name = 'Sarah'.\"`。\n\n## 获取查询结果并展示给用户\n\n一旦你完成了查询，你需要获取结果并将其显示给用户，或者对其进行某些其他处理。实现这一点的简单方法之一是使用大多数支持\
  \ PHP 的数据库包含的 `fetch_array` 函数。\n\n*   `mysql_fetch_array(RESULT);`\n*   `mssql_fetch_array(RESULT);`\n\
  *   `pg_fetch_array(RESULT);`\n\n结果中的数据被加载到数组的字段中（既是关联又是索引）。结果中的每一列都被加载到数组的字段中。数组的键与返回数据的列名对应。\n\
  \n***\n\n## DBX—PHP 对多数据库的支持\n\n对于不需要复杂的特定数据库查询应用程序，可以使用 PHP 内置的 DBX 函数。\n\n在使用\
  \ DBX 函数之前，如果你使用的是 Linux，则必须在编译时启用支持；如果你使用的是 Windows，则需要启用 DBX 模块。\n\n### 在 Linux\
  \ 中启用 DBX\n\n如果你使用 Apache 的 APXS 功能编译 PHP（`compile --with-apxs=/path/to/apache/bin/apxs`），那么为\
  \ PHP 模块添加功能将轻而易举。\n\n在重新编译 PHP 之前，我建议你先删除 `config.cache` 文件并清理上次编译留下的文件。可以这样操作：\n\
  \n```\ncd /path/to/php/source \nrm config.cache\nmake clean\n```\n\n在执行 `make clean`\
  \ 命令后，你会注意到有很多文件被删除了。不用担心，`make` 程序只是在清理它在重新编译时不需要的文件。如果不运行 `make clean` 命令，你可能会遇到一些问题。如果你一直没有问题地编译\
  \ PHP，但突然它无法正确编译了，即使你没有更改任何内容，那么 `make clean` 命令很可能解决你的问题。\n\n一旦你清理了上次编译留下的混乱，就可以开始新的编译了。\n\
  \n要编译编译启用了 DBX 支持的 PHP，请从 shell 提示符执行以下命令（根据需要替换特定安装的路径）：\n\n```\n./compile --with-apxs=/usr/local/apache/bin/apxs\
  \ \\ \n--enable-dbx \\\n```\n\n你还应该启用你任何想要使用的数据库的支持——例如：\n\n```\n--with-mssql \n\
  ```\n\n在运行 `configure` 之后，执行命令：\n\n```\nmake \n```\n\n假设没有发生错误，你就可以执行命令：\n\n```\n\
  make install \n```\n\n最后一条命令将 `libphp4.so` 库文件复制到 `/path/to/apache/libexec/`。\n\n\
  重启 Apache 以加载新库：\n\n```\n/path/to/apache/bin/apachectl restart \n```\n\n你可以通过使用\
  \ `phpinfo()` 函数并验证 DBX 是否列在配置部分下，来确认 DBX 已正确安装。\n\n### 在 Windows 中启用 DBX\n\n在 Windows\
  \ 上启用 DBX 支持非常简单，因为 DLL 文件已经预编译并包含在基础 PHP 安装中。打开你的 `php.ini` 文件并搜索如下行：\n\n```\n\
  extension_dir = \n```\n\n此行应指向扩展所在的位置。如果你没有将扩展移动到与 `php.ini` 文件相同的目录，你需要编辑该行，例如：\n\
  \n```\nextension_dir = C:\\Apache\\php\\\n```\n\n接下来，在 `php.ini` 中找到以下部分，取消（删除行开头的分号）包含\
  \ DBX 库的行：\n\n```\n\n```\n\n取消该行的注释后，保存文件并重启 Apache 服务器。你可以通过使用 `phpinfo()` 函数并验证\
  \ DBX 是否列在配置部分下，来确认 DBX 已正确安装。\n\n### DBX 函数\n\nDBX 函数是一组单一函数，允许你访问多个数据库而无需编写自己的封装函数。\n\
  \n从 4.1 版本开始，PHP DBX 支持以下数据库：\n\n*   mysql\n*   odbc\n*   pgsql\n*   mssql\n*  \
  \ fbs\n\nDBX 可用函数如下：\n\n#### dbx_close(CONNECTION)\n\n`dbx_close()` 函数接受一个参数 `CONNECTION`。`CONNECTION`\
  \ 是在你调用 `dbx_connect()` 时创建的标识符。\n\n#### dbx_connect(MODULE, HOST, DATABASE, USER,\
  \ PASSWORD, PERSISTENT)\n\n`dbx_connect()` 函数用于与数据库服务器建立连接，并指定使用的数据库。`dbx_connect`\
  \ 返回一个包含连接句柄以及其所连接数据库名称的对象。详情见示例。`dbx_connect` 函数接受六个参数：\n\n*   `MODULE`——你想要为此连接使用的数据库模块。该模块本质上是你尝试连接的数据库类型。值可以是：\n\
  \    *   `DBX_MYSQL`——用于 MySQL 数据库。\n    *   `DBX_ODBC`——用于支持 ODBC 连接的任何数据库。\n \
  \   *   `DBX_PGSQL`——用于 PostgreSQL 数据库。\n    *   `DBX_MSSQL`——用于 MS SQL 数据库。\n \
  \   *   `DBX_FBSQL`——用于 Frontbase 数据库。\n*   `HOST`——数据库服务器的主机或 IP 地址。\n*   `DATABASE`——数据库服务器上的数据库名称。\n\
  *   `USER`——用户名。\n*   `PASSWORD`——用户密码。\n*   `PERSISTENT`——是否建立持久连接。如果你希望连接持久，请在此处放置\
  \ `DBX_PERSISTENT`。否则，此参数不是必需的。\n\n示例：[/\n\n\n\n```\n$module = DBX_MYSQL; //注意这里没有引号！\
  \ \n$dbconn = dbx_connect($module, \"192.168.0.5\", \"php\", \"mysqluser\", \"password\"\
  ) or DIE (\n\"无法连接\");\n//$dbconn->database = \"php\"\n//$dbconn->handle 是一个资源标识符\n\
  ```\n\n### `dbx_error(CONNECTION)`\n\n`dbx_error` 函数返回对模块上一次函数调用的错误信息。参数 `CONNECTION`\
  \ 是你在调用 `dbx_connect()` 时定义的连接标识符。\n\n示例：\n\n```\n$result = dbx_query($dbconn, \"\
  select something from non_existing_table\"); \nif ($result == 0) {echo dbx_error($dbconn);\
  \ }\n//响应：Table 'php.non_existing_table' 不存在\n```\n\n### `dbx_query(CONNECTION,\
  \ SQL STATEMENT, FLAGS)`\n\n`dbx_query` 函数允许你向数据库发送 SQL 查询。如果查询没有失败且返回了一行或多行，则它返回一个对象。返回零行的查询不会返回对象。相反，它返回\
  \ 1，表示查询成功但没有返回数据，例如从一个没有数据的表中进行 **select *** 操作。其参数为：\n\n*   `CONNECTION`—当调用 `dbx_connect()`\
  \ 函数时创建的连接标识符。\n*   `SQL STATEMENT`—一个标准的 SQL 语句。\n*   `FLAGS`—你可以通过指定以下一个或多个标志来规定查询返回的信息量。默认情况下，所有标志都是开启的。在指定标志时，必须使用\
  \ `|` 符号分隔它们——例如 \"DBX_RESULT_INDEX | DBX_RESULT_INFO\"。这些标志包括：\n    *   `DBX_RESULT_INDEX`—始终返回。结果数组中的所有结果都通过数字索引，例如\
  \ `$result[0]`、`$result[1]` 等。\n    *   `DBX_RESULT_INFO`—返回关于所返回列的信息，例如字段名和字段类型。\n\
  \    *   `DBX_RESULT_ASSOC`—将返回的数组的键设置为为列名。\n\n`dbx_query` 返回的对象包含以下属性：\n\n*   `handle`—与\
  \ `$dbconn->handle` 相同的句柄。通过 `$result->handle` 访问。\n*   `cols`—结果集中的列数。通过 `$result->col`\
  \ 访问。\n*   `rows`—结果集中的行数。通过 `$result->rows` 访问。\n*   `info`—仅在标志位参数中指定了 `DBX_RESULT_INFO`\
  \ 或 `DBX_RESULT_ASSOC` 时才会返回。提供一个包含列名及其类型的二维数组。通过 `$result['info'][$x]` 和 `$result['name'][$x]`\
  \ 访问，其中 `$x` 是特定行的索引。\n*   `data`—包含来自结果的实际数据。通过 `$result->data[$x]['field name']`\
  \ 访问，其中 `$x` 是特定行的索引。\n\n示例：\n\n```\n$result = dbx_query($dbconn, \"select something\
  \ from \nsome_table\", DBX_RESULT_INFO);\n```\n\n### `dbx_sort(RESULT, SORT FUNCTION)`\n\
  \n`dbx_sort` 函数允许你使用自定义的排序函数对查询结果进行排序。然而，在 SQL 语句中使用 \"ORDER BY\" 子句会更高效。`dbx_sort`\
  \ 接受的参数为：\n\n*   `RESULT`—上一个 `dbx_query` 语句的结果。\n*   `SORT FUNCTION`—你的自定义排序函数。\n\
  \n示例：\n\n```\nfunction my_sort { \n       //你的自定义排序定义\n}\ndbx_sort($result, \"my_sort\"\
  );\n//$result 现在已根据 my_sort() 完成了排序\n```\n\n### `dbx_compare(ROW1, ROW2, COLUMN\
  \ KEY, FLAGS)`\n\n`dbx_compare` 函数允许你比较两个结果集，`ROW1` 和 `ROW2`。如果 `ROW1 = ROW2`，则\
  \ `dbx_compare` 返回 0。如果 `ROW1 > ROW2`，则 `dbx_compare` 返回 1。如果 `ROW1 < ROW2`，则 `dbx_compare`\
  \ 返回 -1。`dbx_compare` 接受的参数为：\n\n*   `ROW1`—来自 `dbx_query` 函数调用的结果。\n*   `ROW2`—来自\
  \ `dbx_query` 函数调用的结果。\n*   `COLUMN KEY`—应进行比较的列名。\n*   `FLAGS`—你可以指定多个标志来按升序或降序比较行，并规定进行何种类型的比较。用管道符分隔任何类型的顺序。\n\
  \    *   `DBX_CMP_ASC`—（默认）按升序比较。\n    *   `DBX_CMP_DESC`—按降序比较。\n    *   `DBX_CMP_NATIVE`—（默认）“原样”比较项目。\n\
  \    *   `DBX_CMP_TEXT`—作为字符串比较项目。\n    *   `DBX_CMP_NUMBER`—作为数字比较项目。\n\n示例：\n\n\
  ```\n$comp = dbx_compare ($r1, $r2, \"income\"); \n//$如果 $r1 = $r2 则 $comp = 0\n\
  ```\n\n\n\n\n\n- 19: 定义数据库服务器的主机名或 IP。\n- 20: 定义数据库用户的用户名。\n- 21: 定义数据库用户的密码。\n\
  - 22: 在数据库服务器上定义数据库名称。\n- 24: 定义一个函数来查询数据库并返回数据库中的 URL。\n- 25: 执行查询。注意调用 `dbx_query()`\
  \ 函数之前有一个 `\"@\"` 符号。`\"@\"` 符号会抑制函数在出现问题（例如数据库宕机）时可能发出的任何警告。有关处理这些错误的更多信息，请参阅第\
  \ 8 章。\n- 26: 如果 `$result == 0`，则发生了错误，因为在成功时，`dbx_query` 应该返回一个对象。\n- 27: 如果第 26\
  \ 行为真，则打印错误。\n- 28–30: 如果没有错误，则返回结果对象。\n- 30: 结束函数声明。\n- 32: 定义一个名为 `url()` 的函数，用于从数据库中添加或删除\
