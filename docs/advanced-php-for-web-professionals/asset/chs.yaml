  \ | 结束页面的 HTML 代码。 |\n\n## 第 10 章：PHP 与 XML\n\n### 本章内容\n* 概述\n* 创建 XML 解析器\n* 解析并转换\
  \ XML 文档\n* 将数据库内容导出 XML 文件\n\n### 概述\nXML（可扩展标记语言）已正式进入主流，并展现了追随者自 XML 诞生以来一直推崇的优势。快速查看\
  \ Apache 和 Java 语言对 XML 的支持，就足以确认 XML 将长久存在。\n\nPHP 以扩展的形式内置了对 XML 的支持。与其他扩展不同，XML\
  \ 默认是编译在内部的，因此你不需要任何额外配置即可让 XML 正常工作。PHP XML 扩展使用了 James Clark 的 `expat` 库，其完整细节可以在\
  \ [www.jclark.com/xml/](http://www.jclark.com/xml/) 处找到。\n\n快速查看 图 10-1 中包含 `phpinfo()`\
  \ 函数的 PHP 页面，就可以确认你的 PHP 版本是否已启用 XML。\n\n#### 图 10-1. 使用 phpinfo() 确认 XML 已启用\n\
  ![graphics/10fig01.jpg](img/10fig01.jpg)\n\nPHP 的 XML 扩展允许你解析 XML 文件。你可以遵循 XML 的节点和分支读取\
  \ XML 文件，并对其中包含的数据进行操作。\n\nPHP 的 XML 扩展并不校验 XML 文件。也就是说，它无法将 XML 文件与 DTD（文档类型定义）对比，并根据\
  \ DTD 验证文件是否有效。尽管如此，你必须确保发送给 PHP 的 XML 或是有效的（valid）或格式良好的（well-formed）。\n\n### 创建\
  \ XML 解析器\n在用 PHP 的 XML 扩展读取 XML 文件之前，你必须创建一个解析器。由于 XML 文档是可扩展的，PHP 无法知道你正在 XML\
  \ 中搜索哪些元素。因此，你必须告诉 PHP 如何解析文档。你通过定义一个新的 XML 解析器实例，然后定义元素数据处理器（element handlers）和字符处理器（character\
  \ handlers）来告诉 PHP 如何解析文档。元素处理器简单来说就是在遇到一个元素时运行的函数。\n\n#### 定义 XML 解析器\n你通过 `xml_parser_create()`\
  \ 函数来定义一个新的解析器：\n\n```php\n$parser = xml_parser_create($ENCODING);\n```\n\n你可以可选地指定解析器应使用的编码类型。你可以从三种编码中选择一种：\n\
  * ISO-8859-1（默认）\n* US-ASCII\n* UTF-8\n\n一旦定义了解析器，你就可以创建处理器来执行读取 XML 的实际工作。\n\n\
  #### 定义元素处理器\n使用 `xml_set_element_handler()` 函数定义元素处理器：\n\n```php\nxml_set_element_handler($parser,\
  \ $START_FUNCTION, $END_FUNCTION);\n```\n\n`xml_set_element_handler()` 接受三个参数：\n\
  * `$parser`：你在调用 `xml_parser_create()` 时创建的变量。\n* `$START_FUNCTION`:当解析器遇到起始元素时调用的函数名。\n\
  * `$END_FUNCTION`:当解析器遇到结束元素时调用的函数名。\n\n#### 定义字符处理器\n使用 `xml_set_character_handler()`\
  \ 函数定义字符处理器：\n\n```php\nxml_set_character_handler($parser, $CHARACTER_FUNCTION);\n\
  ```\n\n`xml_set_character_handler()` 接受两个参数：\n* `$parser`:你在调用 `xml_parser_create()`\
  \ 时创建的变量。\n* `$CHARACTER_FUNCTION`:当遇到字符数据时调用的函数名。\n\n#### 启动解析器\n拼图的最后一块是启动整个过程的函数\
  \ `xml_parse()`：\n\n```php\nxml_parse($parser, $XML);\n```\n\n`xml_parse()` 接受两个参数：\n\
  * `$parser`:你在调用 `xml_parser_create()` 时创建的变量。\n* `$XML`:要解析的 XML。\n\n#### 清理\n\
  在完成文档解析后，你应该调用 `xml_parser_free()` 函数来释放持有解析器的内存：\n\n```php\nxml_parser_free($parser);\n\
  ```\n\n`xml_parser_free()` 接受一个参数 `$parser`，即你在调用 `xml_parser_create()` 时创建的变量。\n\
  \n让我们通过一个示例来巩固刚刚讨论的原理。以下示例使用了刚刚讨论的所有函数。它打开一个命名为 `simple.xml` 的简单 XML 文件，并解析其中的 XML。图\
  \ 10-2 显示了输出。这里是 `simple.xml`，你需要创建并将其与 `xml1.php` 示例放在同一目录下：\n\n##### 脚本 10-1 simple.xml\n\
  \n\n\n\n\n```xml\n<?xml version=\"1.0\"?>\n<document>\n<title>XML 详解</title>\n<body>揭秘\
  \ XML。在此处阅读相关内容。</body>\n</document>\n```\n\n### 脚本 10-2 xml1.php\n\n```php\n<?\n\
  function startElement($xml_parser, $name, $attributes) {\n  print(\"<p><i>遇到起始元素为:</i>$name\\\
  n\");\n}\n\nfunction endElement($xml_parser, $name) {\n  print(\"<p><i>遇到结束元素为:</i>$name\\\
  n\");\n}\n\nfunction characterData($xml_parser, $data) {\n  if($data != \"\\n\"\
  ) { \n    print(\"<p><i>遇到字符数据:</i>$data\\n\");\n  }\n}\n\nfunction load_data($file)\
  \ {\n  $fh = fopen($file, \"r\") or die (\"<P>无法打开文件!\");\n  $data = fread($fh,\
  \ filesize($file));\n  return $data;\n}\n/***** 主程序 *****/\n$file = \"simple.xml\"\
  ;\n$xml_parser = xml_parser_create();\nxml_set_element_handler($xml_parser, \"startElement\"\
  , \"endElement\");\nxml_set_character_data_handler($xml_parser, \"characterData\"\
  );\nxml_parse($xml_parser, load_data($file)) or die (\"<P>XML 解析错误!\");\nxml_parser_free($xml_parser);\n\
  ?>\n```\n\n### 图 10-2. xml1.php\n\n![graphics/10fig02.jpg](img/10fig02.jpg)\n\n\
