  \ 18.  }\n 19.\n20.  function print_form($fields) {\n 21.    global $page\n 22.\
  \    ?>\n 23.    <form action=<?=$page; ?> method=post enctype=\"multipart/form-data\"\
  >\n 24.    <table border=1>\n 25.    <?\n 26.    for($i = 0; $i < $fields; $i++)\
