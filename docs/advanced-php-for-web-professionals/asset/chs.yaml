  \ Files</title>\n 7.  </head>\n 8.  <body>\n 9.  <?\n10.\n11.  function specify_number()\
  \ {\n12.    global $page;\n 13.    ?>\n 14.    <form action=<?=$page?> method=post>\n\
  \ 15.    Enter number of fields to display for upload and press Enter: <input type=\"\
