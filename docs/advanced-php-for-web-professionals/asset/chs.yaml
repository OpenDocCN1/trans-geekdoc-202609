  ```\n`nextID` 接受两个参数：<br>* `$table`: 要生成 ID 的表。<br>* `$create`: 一个布尔值，如果不存在 ID 序列，则将其设置为\
  \ true 以启动该序列。|`nextID()` 函数解决了我们这些人的问题：我们喜欢在 MySQL 中使用 `auto_increment` 功能来创建 ID，但与此我们也希望应用程序能够运行在不同的数据库上（其中某些数据库并不使用\
  \ `auto_increment` 功能来处理 ID）。 |\n| 27-62 | 定义函数 `display()`，用于显示库存中的项目。 |\n| 64-107\
