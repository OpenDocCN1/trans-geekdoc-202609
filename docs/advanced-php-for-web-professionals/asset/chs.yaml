  \ 函数。 |\n| 24 | 创建名为 `$box` 的水平布局框（HBox）。 |\n| 25 | 使用 `add()` 方法将 `$box` 添加到窗口。\
  \ |\n| 26 | 将 `$label1` 对象打包到 `$box` 中。 |\n| 27 | 将 `$text1` 对象打包到 `$box` 中。 |\n\
  | 28 | 将 `$button1` 对象打包到 `$box` 中。 |\n| 29 | 对 `$window` 对象调用 `show_all()` 以显示所有内容。\
  \ |\n| 30 | 调用 `Gtk::main()` 运行脚本。 |\n\n### 对话框 (Dialog Boxes)\n\n大多数 GUI 程序都能显示小窗口来通知用户错误或确认用户想要执行的操作。例如，当你尝试在不保存文档的情况下关闭应用程序时，大多数文字处理程序都会弹出“确定……”的对话框。PHPGTK\
  \ 提供了 `GtkDialog` 类创建简单对话框的方法。\n\n`GtkDialog` 类包含一个 `vbox`、一个分割和一个“操作区域”。你可以将文本放在\
  \ `vbox` 中，将按钮放在“操作区域”中。\n\n下一个脚本演示了如何使用 `GtkDialog` 来确认用户是否想要退出应用程序。当用户点击“Quit”按钮或窗口右上角的“X”时，会显示一个对话框询问用户是否确定退出。如果用户点击对话框中的“OK”，应用程序将退出。如果用户点击“Cancel”或对话框右上角的“X”，对话框将关闭但应用程序仍保持打开。请参见图\
  \ 12-7](#12fig07) 的示例输出。\n\n### 脚本 12-5. dialog.php\n\n```php\n1.  <?php\n2.  if\
  \ (!class_exists('gtk')) {\n3.    if (strtoupper(substr(PHP_OS, 0, 3)) == 'WIN')\n\
  4.      dl('php_gtk.dll');\n5.    else\n6.      dl('php_gtk.so');\n7.  }\n8.  function\
  \ destroy() {\n9.    Gtk::main_quit();\n10.  }\n11.  function close_dialog($button,\
  \ $dialog){\n12.    $dialog->destroy();\n13.  }\n14.  function delete_event(){\n\
  15.    confirm();\n16.    return true;\n17.  }\n18.  function confirm(){\n19.  \
  \  global $window;\n20.    $dialog = &new GtkDialog;\n21.    $dialog->set_title(\"\
  Are You Sure?\");\n22.    $dialog->set_default_size('100','100');\n23.    $dialog->set_modal(TRUE);\n\
  24.    $dialog->set_transient_for($window);\n25.    $dialog->set_policy(0,0,0);\n\
  26.    $label = &new GtkLabel(\"Are You Sure You To Quit?\");\n27.    $button_yes\
  \ = &new GtkButton('OK');\n28.    $button_yes->connect('clicked', 'destroy');\n\
  29.    $button_no = &new GtkButton('Cancel');\n30.    $button_no->connect('clicked',\
  \ 'close_dialog', $dialog);\n31.    $vbox1 = $dialog->vbox;\n32.    $vbox2 = $dialog->action_area;\n\
  33.    $vbox1->pack_start($label);\n34.    $vbox2->pack_start($button_yes);\n35.\
  \    $vbox2->pack_start($button_no);\n36.    $dialog->show_all();\n37.  }\n38. \
  \ $window = &new GtkWindow();\n39.  $window->connect('delete_event', 'delete_event');\n\
  40.  $button = &new GtkButton('Quit');\n41.  $button->connect('clicked', 'confirm');\n\
  42.  $window->add($button);\n43.  $window->show_all();\n44.  Gtk::main();\n45. \
  \ ?>\n```\n\n### 图 12-7. dialog.php—初始窗口和确认对话框\n\n![graphics/12fig07.jpg](img/12fig07.jpg)\n\
  \n### 脚本 12-5. dialog.php 逐行解释\n\n| 行号 | 描述 |\n| --- | --- |\n| 2 | 如果 GTK 类尚未定义，则执行第\
  \ 3–7 行。如果 GTK 类已经定义，则脚本无需执行任何操作。 |\n| 3 | 检查 `PHP_OS` 环境变量的前三个字符。 |\n| 4 | 如果是\
  \ WIN，说明系统运行在 Windows 上。加载 Windows 版本的 PHPGTK 库。 |\n| 5–7 | 如果 `PHP_OS` 环境变量不是 WIN，则假设\
  \ PHP 运行在 Linux 系统上并加载 Linux 版本的 PHPGTK 库。 |\n| 8–10 | 定义一个函数 `destroy()`，在被调用时停止脚本。\
  \ |\n| 9 | 执行 `Gtk::main_quit()` 方法以停止脚本并关闭 GTK 窗口。 |\n| 10 | 结束函数声明。 |\n| 11–13\
  \ | 定义一个函数 `close_dialog()` 用于关闭对话框。该函数接收两个参数：`$button` 和 `$dialog`。参数的描述请参见第 30\
  \ 行。 |\n| 12 | 调用 `$dialog` 对象的 `destroy()` 方法以关闭对话框。 |\n| 13 | 结束函数声明。 |\n| 14–17\
  \ | 定义一个函数 `delete_event()`，捕获用户点击主应用程序窗口右上角“X”的操作并运行 `confirm()` 函数。`delete_event()`\
  \ 是一个特殊方法，每当用户点击窗口右上角的“X”时都会运行。如果不使用 `delete_event` 连接点，则窗口将自动销毁。 |\n| 15 | 执行 `confirm()`\
  \ 函数以确保用户确实想要退出应用程序。 |\n\n\n\n\n\n| 16 | 返回 true。如果你返回 false（当你没有为 `delete_event`\
  \ 分配连接时，这是该事件的默认行为），则窗口将执行销毁。 |\n| 17 | 结束函数声明。 |\n| 18–37 | 定义一个函数 `confirm()`，用于确认用户想要退出应用程序。\
  \ |\n| 19 | 允许此函数使用 `$window` 对象。 |\n| 20 | 创建名为 `$dialog` 的新对话框对象。 |\n| 21 | 设置对话框对象的标题。\
  \ |\n| 22 | 将对话窗口的默认大小设置为 100 x 100 像素。 |\n| 23 | 将对话窗口设置为模态。这意味着当此窗口存在时，无法访问主应用程序窗口。\
  \ |\n| 24 | 将对话窗口设置为主窗口的瞬态（transient）。瞬态窗口不会在操作系统中为窗口创建额外的任务栏项。这在 Windows 上目前是的，但在\
  \ Linux 下工作正常。 |\n| 25 | 设置窗口的缩放策略。`resize()` 方法接受三个布尔（true 或 false/0 或 1）参数：\n\
  \    - `allow_shrink`—允许窗口比其子元素小（这应该始终设置为 false）。\n    - `allow_grow`—允许窗口大于其原始大小。\n\
  \    - `auto_shrink`—允许窗口覆盖其默认大小设置，收缩到任何子窗口的大小。 |\n| 26 | 创建名为 `$label` 的新标签对象。\
  \ |\n| 27 | 创建名为 `$button_yes` 的新按钮对象。它作为对话框中的“确定”按钮。 |\n| 28 | 使用 `connect()` 方法，在点击此按钮时调用\
  \ `destroy()` 函数。 |\n| 29 | 创建名为 `$button_no` 的新按钮。它作为对话框中的“取消”按钮。 |\n| 30 | 使用\
  \ `connect()` 方法调用 `close_dialog()` 函数。注意，`connect` 方法在末尾带有一个额外的参数。通常，`connect()`\
  \ 方法有两个参数：动作（例如 `clicked`）和被调用的函数（例如 `close_dialog`）。你可以添加第三个参数，即发送到函数的额外变量。在这种情况下，我们发送了对话框窗口对象\
  \ `$dialog`。由于我们发送了两个参数，而连接的函数默认通常只接收一个（即创建连接的对象），你必须在你创建连接的函数（在本例中 `close_dialog()`）中定义默认对象（`$button`）和额外对象（`$dialog`）。\
  \ |\n| 31 | 由于 `GtkDialog` 对象内置了用于内容的“框”（boxes），你需要为该对象分配一个变量名。在这里，为 `GtkDialog`\
  \ 的 `vbox` 分配一个变量名。 |\n| 32 | 为 `GtkDialog` 的 `action_area` 分配一个变量名。 |\n| 33 | 将标签对象打包到\
