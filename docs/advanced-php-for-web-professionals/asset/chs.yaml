  \ |\n| 36–37 | 查询数据库。如果查询出错，则终止脚本并显示任何错误消息。 |\n| 38–41 | 使用 `DB_FETCHMODE_ORDERED`模式显示结果。注意结果在第\
  \ 40 行显示。 |\n| 42 | 查询数据库。 |\n| 43 | 设置抓取模式。 |\n| 44–47 | 使用 `DB_FETCHMODE_ASSOC`模式显示结果。注意结果在第\
  \ 46 行显示。 |\n| 48 | 查询数据库。 |\n| 49 | 设置抓取模式。 |\n| 50–52 | 使用 `DB_FETCHMODE_OBJECT`模式显示结果。注意结果在第\
  \ 52 行显示。 |\n| 54 | 结束第 28 行开始的 if 语句。 |\n| 55 | 释放结果。 |\n| 56 | 关闭数据库连接。 |\n\n\n\
  \n\n\n# 优化脚本\n- 表单字段检查\n- 使用 `$HTTP_GET_VARS` 和 `$HTTP_POST_VARS`\n- 整合一切\n- 变量变量\n\
  \n### 更好的表单简介\n\n本章介绍了表单。表单是用户交互的最基本的方法。用户必须通过表单向网站输入信息。想一下，每一个公告板、购物车、反馈表单和投票都是表单的一种类型。如果没有表单，Web\
  \ 仅仅是那些能够将 Web 页面 `FTP` 到服务器的人的发布媒介。\n\n由于表单是你网站上大部分用户交互的基础，因此你有必要让用户输入信息变得更加容易。你曾多少次填写了一个长表单，结果却被你某项填写错误并要求你点击“返回”来修复？当你点击“返回”按钮后，你会发现整个表单变空了，迫使你重新填写所有信息！或者，有些表单提示你填写有误，但仔细检查后你发现不出哪里错了，而且脚本没有提供任何额外的线索。如果不需要重新输入所有信息，并且你填写错误的字段能以某种方式突出显示，以便你轻松进行修正，难道不是更好吗？\n\
  \n你可以使用 `JavaScript` 在表单提交之前检查数据，但并非所有浏览器对 JavaScript 的处理方式相同，因此你可能会遇到某些浏览器的兼容性问题。使用\
  \ `PHP`，你可以确保只向浏览器发送纯 HTML，从而减少跨浏览器兼容性错误。取决于代码的复杂程度，使用 `PHP` 而非 `JavaScript` 来检查错误会略微增加服务器的负载。\n\
  \n### Post 和 Get\n\n在 HTML 中创建表单时，可以使用两种方法。它们是 `post` 和 `get`，例如：\n\n```html\n<form\
  \ action=submit.php method=post>\n```\n\n或者：\n\n```html\n<form action=submit.php\
  \ method=get>\n```\n\n如果你不指定方法，Web 服务器将假设你使用的是 `get` 方法。那么这到底回事？它们的作用是一样的对吧？嗯，几乎如此。你可能已经注意到，在提交使用\
  \ `get` 方法的表单后，URL 看起来长了很多。例如，你可能会看到：\n\n```text\nhttp://web.com/form.php?name=fred&age=20&comments=This+site+rocks\n\
  ```\n\n这是因为 `get` 方法将表单内容直接放在 URL 中。这有几个缺点。首先，取决于你的 Web 服务器操作系统和软件，通过 `get` 方法通过表单发送的数据量是有限制的。在许多系统中，这个限制是\
  \ 256 个字符。此外，单个 `get` 查询可能会存储在你的 Web 服务器日志中。如果你在共享服务器上使用空间，其他人可能会解析它。\n\n`post`\
  \ 方法的数据不会出现在 URL 中，这使得它更安全，并允许传输大量数据。\n\n## 让表单更加友好\n\n第一个脚本 `form1.php` 展示了如何通过突出显示用户填写错误的字段来让表单更加用户友好。\n\
  \n```php\n<?php\n$page = \"form1.php\";\n?>\n<<html>\n<head>\n<style type=\"text/css\"\
  >\n.error { color:red; }\n</style>\n</head>\n<body>\n<form action=\"<?php echo $page;\
  \ ?>\" method=\"post\">\n<table border=\"0\">\n<?php error_flag($error, \"first\"\
  ); ?>First Name: <input type=\"text\" name=\"first\" value=\"<?php echo $first;\
  \ ?>\"></td>\n<?php error_flag($error, \"last\"); ?>Last Name: <input type=\"text\"\
  \ name=\"last\" value=\"<?php echo $last; ?>\"></td>\n<td colspan=\"2\" align=\"\
  center\"><input type=\"submit\" name=\"submit\" value=\"Submit\"></td>\n</table>\n\
  </form>\n<?php\nfunction error_flag($error, $field) {\n  if ($error[$field]) {\n\
  \    echo \"<td class='error'>\";\n  } else {\n    echo \"td>\";\n  }\n}\n\nfunction\
  \ check_form() {\n  global $error, $print_again, $first, $last;\n  $error['first']\
  \ = false;\n  $error['last'] = false;\n  $print_again = false;\n  if ($first ==\
  \ \"\") {\n    $error['first'] = true;\n    $print_again = true;\n  }\n  if ($last\
  \ == \"\") {\n    $error['last'] = true;\n    $print_again = true;\n  }\n  if ($print_again)\
  \ {\n    print_form();\n  } else {\n    echo \"<h3>Thank you for completing the\
  \ form!</h3>\";\n  }\n} // end function check_form\n\nfunction print_form() {\n\
  \  // ... 打印表单的逻辑\n}\n\n***** MAIN *****/\nif(isset($submit)) {\n  check_form();\n\
  } else {\n  print_form();\n}\n?>\n</body>\n</html>\n```\n\n注：由于原始文本在结尾处大量重复且损坏，我已根据提供的代码片段重构了逻辑流，并提供了清理后的版本。\n\
  \n\n\n\n\n* `$error`— 一个从 `check_form()` 函数返回的错误数组（如果有）。\n* `$print_again`— 从 `check_from()`\
  \ 函数返回的布尔值变量。\n* `$first` 和 `$last`— 从此字段中的表单返回的变量。\n* `$page`—我们在表单的 `action=…`\
  \ 行中使用了这个变量。这样做的好处是我们可以轻松更改页面名称，而不必担心破坏脚本。\n\n如果这是第一次运行此脚本，所有这些变量都为空。 |\n\n| | |\n\
  | :--- | :--- |\n| 22–24 | 打印表单标签。注意我们包含了 `$page` 变量。还要注意 post 方法。 |\n| 25–30 |\
  \ `if/then/else` 语句检查 `$print_again` 变量是否被设置为 `true`。如果是的话，我们就打印一条消息，说明之前遗漏了一些字段。如果\
  \ `$print_again` 变量没有被设置，那么我们只打印一条消息让用户填写表单。 |\n| 31–40 | 打印表单字段。这是一个非常标准的表单，但有两个不同点：1.\
  \ 每个字段标签之前跟的是函数 `error_flag` 而不是普通的 `<td>` 标签。这是因为我们想检查用户之前在向此字段输入信息时是否出错。如果他们出错了（而且他们总会在某个时候出错），那么\
  \ `error_flag()` 函数将打印 `<td class=error>` 而不是 `<td>`。错误级样式表 (CSS) 类只需将该单元格中的文本变为红色。每个文本输入都有一个关联的值——例如，`value=\"\
  <?=$first ?>`。如果用户是第一次填写表单，那么这些值是空的。但是，如果用户之前犯了错误，并且这是他们第二次或后续填写表单，那么之前输入的值将显示在表单中。这样，用户就不需要重新向表单输入信息了。\
  \ |\n| 41 | 结束 `print_form()` 函数。 |\n| 43 | 定义 `check_form()` 函数。 |\n| 44 | 允许函数使用列出的全局变量。注意这些与\
  \ `print_form()` 函数使用的变量相同。 |\n| 47 | 将 `$print_again` 变量初始化为 `false`。假设用户输入的数据无误，那么它应该保持为\
  \ `false`。 |\n| 48–51 | 检查 `$first` 变量（代表用户的名字）以查看用户是否输入了值。如果他们没有在该字段中输入任何内容，我们通过将\
  \ `$error` 数组的第一个元素设置为 `true` 并同时将 `$print_again` 变量设置为 `true` 来生成一个错误。 |\n| 52–55\
  \ | 这三行的作用与 48–51 行相同，不同的是这次我们正在检查 `$last` 变量（代表用户的姓）。 |\n| 56–60 | 如果遇到错误且 `$print_again`\
  \ 变量被设置为 1 (true)，则再次打印表单，否则向用户打印一条消息。 |\n| 61 | 结束 `check_form()` 函数。 |\n| 64–65\
  \ | 如果点击了提交（Submit）按钮，则执行 `check_form()` 函数。 |\n| 66–68 | 如果没有点击提交按钮，则执行 `print_form()`\
  \ 函数。 |\n| 70–71 | 关闭 HTML 页面。 |\n\n***\n\n| ![](img/pixel.gif) |\n| --- |\n| ![](img/#index.htm)\
  \ ![上一节](img/#ch04lev1sec1.htm) ![下一节](img/#ch04lev1sec3.htm) |\n| 回到顶部 |\n| ---\
  \ |\n| ![](img/#index.htm) ![上一节](img/#ch04lev1sec2.htm) ![下一节](img/#ch04lev1sec4.htm)\
  \ |\n\n***\n\n### 增强脚本\n\n你可以增强此脚本使其变得更智能：\n\n#### 检查空格\n\n该脚本目前的这种写法，如果用户只是在每个字段中都输入空格，它就很容易被欺骗。在第\
  \ 46 行和第 50 行的 `check_form` 脚本中，我们检查用户是否输入了内容。这包括空格。如果我们想确保用户输入的是字符（而不只是空格），我们可以这样检查：\n\
  \n```\nif(ereg(\"^ +\", $last)) { \n    $error[last] = true;\n    $print_again =\
  \ true;\n}\n```\n\n基本上，`ereg()` 函数正在检查 `$last` 变量查看是否以一个或多个空格开头。我们将在本章的稍后部分详细查看\
  \ `ereg()` 函数。\n\n#### 检查最小字符数\n\n有时你可能想确保用户输入了最小数量的字符。通过使用 HTML 输入标签上的 `maxlength`\
  \ 属性，强制限制用户输入的最大字符数是很容易的——例如 `<input type=\"text\" maxlength=\"24\">`。\n\n```\n\
  if(strlen($first) < 3) { \n      $error[first] = true;\n      $print_again = true;\n\
  \  }\n```\n\n在这里我们使用 `strlen()` 函数（字符串长度）来查看 `$first` 变量是否包含至少三个字符。如果它有零、一个或两个字符，那么我们就抛出一个错误。\n\
  \n#### 添加更多错误信息\n\n添加一些额外的错误信息也是很有用的。我们可以稍微修改上面的示例：\n\n```\n  if(strlen($first)\
  \ < 3) { \n      $error['first'] = \"请在此字段中输入两个以上的字符。 \";\n      $print_again =\
  \ true;\n  }\n  if(ereg(\"^ +\", $last)) {\n      $error['last'] = \"请在此字段中输入字符，而不是空格。\
  \ \";\n      $print_again = true;\n  }\n```\n\n在这里，我们不再给 `$error` 变量赋值 `true` 值，而是可以添加错误的简短描述。然后如果我们按照如下方式修改我们的\
  \ `error_flag` 函数，就可以在再次向用户显示表单时，向他们打印这条消息：\n\n```\nfunction error_flag($error,\
  \ $field) { \n      if($error[$field]) {\n        print(\"<td class=error>\");\n\
  \      } else {\n         print(\"<td>\");\n      }\n} //end error_flag\n```\n\n\
  ***\n\n| ![](img/pixel.gif) |\n| --- |\n| ![](img/#index.htm) ![上一节](img/#ch04lev1sec1.htm)\
  \ ![下一节](img/#ch04lev1sec3.htm) |\n\n***\n\n### 字段检查\n\n如你所见，要让表单对用户更友好并不难。但为了你自己自己，你应该检查输入表单的数据是否真的有用。仅仅检查他们是否填写了字段并不总是够的。\n\
  \n这就是 `ereg()` 的用处。`ereg()` 是一个内置 PHP 函数，意思是评估正则表达式。还有一个与 `ereg()` 工作相同（可能更快）的 Perl\
  \ 兼容叫做 `preg_match()`。这两个函数的语法非常相似，在大多数情况下完全相同。语法如下：\n\n```\nereg(search, string)\n\
  ```\n\n其中 `search` 是正则表达式搜索标准，`string` 是你要搜索的字符串。`ereg` 函数返回布尔值（真或假）。如果搜索标准匹配字符串，则\
  \ `ereg()` 返回 `true`；否则返回 `false`。\n\n现在，正则表达式是所有经常处理文本的程序员都应该真正了解的东西之一。正则表达式中使用的不同搜索标准可能很晦涩，但它们确实非常有效。\n\
  \n看看我们之前使用的示例：\n\n```\n  if(ereg(\"^ +\", $last)) { \n      $error['last'] = true;\n\
  \      $print_again = true;\n  }\n```\n\n搜索标准 `\"^ +\"` 字面上意思是“以空格开头并在后面跟着零或多个空格的字符串”。我们搜索这个是因为我们不希望用户通过为姓输入空格而不是字符来欺骗表单被接受。\n\
  \n然而，我们可以使用其他的正则表达式运算符更详细地分析输入到表单的数据。常见的正则表达式运算符列表可以在 表 4-1 中找到。\n\n##### 表 4-1.\
  \ 常见的正则表达式运算符\n\n\n\n\n\n| 符号 | 描述 | 示例 |\n| --- | --- | --- |\n| `*` | 匹配 0 次或多次出现。\
  \ | 就像 UNIX 通配符符号一样，`*` 匹配所有内容。用此匹配符号组。 |\n| `+` | 匹配 1 次或多次出现。 | `\"e+\"` 匹配一个包含一个或多个字符\
  \ `\"e\"` 的字符串。 |\n| `^` | 位于字符串开头，匹配该字符串的起始位置。 | `\"^Hello\"` 匹配任何以单词 `\"Hello\"\
  ` 开头的字符串。 |\n| `$` | 位于字符串末尾，匹配该字符串的结尾。 | `\"$goodbye!\"` 匹配任何以 `\"goodbye!\"` 结尾的字符串。\
  \ |\n| `|` | 用于分隔搜索项。 | `\"a|b\"` 匹配包含字符 `\"a\"` 或字符 `\"b\"` 的字符串。 |\n| `[]` | 匹配字符范围。\
  \ | `\"\\[a-z\\]\"` 匹配包含从 a 到 z 小写字母的字符串。`\"\\[A-D\\]\"` 匹配包含从 A 到 D 大写字母的字符串。`\"\
  \\[0-9\\]\"` 匹配包含 0 到 9 数字的字符串。`\"\\[1-5\\]\"` 匹配包含 1 到 5 数字的字符串。 |\n| `()` | 序列中的分组操作符。\
  \ | 括号的作用与大多数编程操作中的类似。你可以将项组合在一起。例如，`(5\\[0-9\\]+)` 匹配一个包含数字 5 后跟一个或多个数字的字符串。`\"\
  5\"` 不匹配，而 `\"55\"` 匹配。 |\n| `.` | 匹配任意单个字符。 | `\"\\[0-9\\].\\[0-9\\]\"` 匹配一个包含数字、后跟任意其他字符、再跟数字的字符串。\
  \ |\n| `\\\\` | 转义操作符使其按字面意思处理。 | 如果你想字面搜索特定的操作符，必须转义以下操作符：`[*\\+?{}.]` |\n\n####\
  \ 检查有效的邮箱地址\n\n用户在表单中输入的最常见内容之一是邮箱地址。拥有用户的邮箱地址可以让你执行诸如在他们忘记密码时发送密码等操作。这不仅节省了用户在你的网站上创建新账户的麻烦，也节省了你的数据库空间。\n\
  \n但有时用户会填写表单但没有输入有效的邮箱地址。你是否收到过邮箱字段中为类似 \"qwert\" 内容的表单提交？使用正则表达式匹配，你至少可以检查用户输入的邮箱地址以判断其在技术上是否有效。\n\
  \n一个技术上有效的邮箱地址由用户名、@` 符号和服务器名称组成。有效的用户名可以包含字母、数字、下划线 (`_`)、减号 (`-`) 和点 (`.`)。有效的服务器名称几乎相同，但服务器名称不能包含下划线。最后，域名结尾必须包含一个\
  \ `.`，后面跟两个或更多字母，例如 `.com`、`.it` 或 `.info`。使用我们在表 4-1 中的正则表达式操作符，我们可以构建一个匹配有效邮箱地址的正则表达式。\n\
  \n假设一个有效的用户名必须以至少一个字母或数字开头：\n\n```\n^[a-z0-9]+ \n```\n\n后面跟着零个或多个字母、数字、下划线 `_` 或减号\
  \ `-`：\n\n```\n[a-z0-9_-]* \n```\n\n然后可以是零个或一个 `.`，后面跟任意数量的字母、数字、下划线 `_` 或减号 `-`：\n\
  \n```\n(\\.[a-z0-9_-]+)* \n```\n\n紧接着是 `@` 符号：\n\n```\n@ \n```\n\n之后至少跟跟一个字母或数字：\n\
  \n```\n[a-z0-9]+ \n```\n\n然后可以是零个或一个 `.`，后面跟任意数量的字母、数字、下划线 `_` 或减号 `-`：\n\n```\n\
  (\\.[a-z0-9_-]+)* \n```\n\n最后，可以再跟另一个 `.`，然后是两个或更多字母（域名的结尾），最后邮箱字符串必须结束：\n\n```\n\
  \\.([a-z]+){2,}$ \n```\n\n将它们整合在一起，你得到：\n\n```\n^[a-z0-9]+(\\.[a-z0-9_-]+)*@[a-z0-9_-]+(\\\
  .[a-z0-9-]+)*\\.([a-z]+){2,}$ \n```\n\n但我们还没有考虑到字母的大小！上面的表达式只允许邮箱地址中出现小写字母，但大写字母也是有效的。为了节省时间，我们没有在表达式中包含\
  \ \"A–Z\" 范围，因为我们可以使用略有不同的 `ereg()` 形式，它被称为 `eregi()`。`eregi()` 的工作方式与 `ereg()`\
  \ 完全相同，不同之处在于它不区分大小写。这样你就不需要在表达式中使用 `[a-zA-Z]` 语法同时搜索大写和小写字符了。你只需要使用 `[a-z]`。\n\n\
  我们的 `eregi()` 函数现在看起来像这样：\n\n```\neregi(\"^[a-z0-9]+[a-z0-9_-]*(\\.[a-z0-9_-]+)*@[a-z0-\
  \ \n9_-]+(\\.[a-z0-9_-]+)*\\.([a-z]+){2,}$\", $email);\n```\n\n这是一个演示如何检查有效邮箱的短脚本（Script\
  \ 4-2）：\n\n```php\n<?php\n$emails = array(\"test@example.com\", \"invalid\", \"\
  user@domain.uk\");\nforeach ($emails as $email) {\n    if (eregi(\"^[a-z0-9]+[a-z0-9_-]*(\\\
  .[a-z0-9_-]+)*@[a-z0- \n9_-]+(\\.[a-z0-9_-]+)*\\.([a-z]+){2,}$\", $email)) {\n \
  \       echo \"$email is valid.\\n\";\n    } else {\n        echo \"$email is not\
  \ valid.\\n\";\n    }\n}\n?>\n```\n\n虽然这种写法很丑，但它在检查邮箱方面非常好。这里还有你可以在 `ereg()` 和 `eregi()`\
  \ 中使用的语法：\n\n##### 表 4-2 可移植式正则表达式\n\n| 符号 | 描述 |\n| --- | --- |\n| `[:alpha:]`\
  \ | 等于 `[a-zA-Z]` |\n| `[:alnum:]` | 等于 `[a-zA-Z0-9]` |\n| `[:digit:]` | 等于 `[0-9]`\
  \ |\n| `[:lower:]` | 等于 `[a-z]` |\n| `[:upper:]` | 等于 `[A-Z]` |\n| `[:space:]` |\
  \ 等于空白空格 (\" \") |\n| `[:print:]` | 匹配任意打印字符，但 `/n`（换行）和 `/t`（制表符）不匹配 |\n| `[:graph:]`\
  \ | 匹配除空格外的任何图形字符 |\n| `[:xdigit:]` | 十进制，等于 `[a-f-F0-9]` |\n| `[:punct:]` | 匹配包含任何标点符号的字符串\
  \ |\n\n\n\n\n\nPHP 会自动将从表单传递的任何变量注册到 `$HTTP_GET_VARS` 或 `$HTTP_POST_VARS` 数组中。如果使用\
  \ post 方法提交表单，则表单中的任何值将被赋值给 `$HTTP_POST_VARS` 数组。如果使用 get 方法提交表单（在未指定方法时的默认方法），则表单的值将被赋值给\
  \ `$HTTP_GET_VARS` 数组。\n\n> [1] 如果你正在使用 PHP 4.0.3 或更高版本，你的 `php.ini` 文件将自动启用此功能。如果没有开启，则你必须编辑\
  \ `php.ini` 中的 `track_vars` 行并将其设置为 `true`。\n\n例如，当将以下表单提交到 PHP 脚本时：\n\n```\n<form\
  \ action=script.php method=post> \n<input type=hidden name=firstname value=\"Edward\"\
  >\n<input type=hidden name=occupation value=\"Computer Specialist\">\n</form>\n\
  ```\n\nPHP 自动创建一个可以通过关联方式访问的数组：\n\n```\n$PHP_POST_VARS['name'] = \"Edward\"; \n\
  $PHP_POST_VARS['occupation'] = \"Computer Specialist\";\n```\n\n此功能使得创建和管理表单函数变得更容易，因为你不需要将每个变量变为全局变量，也不需要在调用表单处理函数时列出每个变量。\n\
  \n如果你有一个需要输入 15 个独立字段的表单且未使用 `$HTTP_POST_VARS` 或 `$HTTP_GET_VARS`，那么你的函数定义可能像这样：\n\
  \n```\nfunction my_form_handler($var1, $var2, $var3, $var4, \n..., $var19, $var\
  \ 20){\n```\n\n或者：\n\n```\nfunction my_form_handler(){ \n  global $var1, $var2,\
  \ $var3, $var4, ..., $var19, $var 20;\n```\n\n使用 `$HTTP_POST_VARS` 或 `$HTTP_GET_VARS`，你的代码将更易维护：\n\
  \n```\nfunction my_form_handler($HTTP_POST_VARS) { \n```\n\n或者：\n\n```\nfunction\
  \ my_form_hander() { \nglobal $HTTP_POST_VARS;\n```\n\n这使得更容易向表单中添加（或删减）额外的字段，而无需在代码中搜索处理表单的函数调用以及向函数调用行添加额外的变量。\n\
  \n### 脚本 4-3 form2.php\n\n```\n1.  <?\n 2.  function print_form() {\n 3.    ?>\n\
  \ 4.    <form action=\"form2.php\" method=post>\n 5.    <p>First Name: <input type=\"\
  text\" name=\"first\">\n 6.    <br>Last Name: <input type=\"text\" name=\"last\"\
  >\n 7.    <br>Number: <input type=\"text\" name=\"number\">\n 8.    <br><input type=\"\
  submit\" name=\"submit\" value=\"Submit\">\n 9.    </form>\n10.    <?\n11.  }\n\
  12.\n13.  function form_handler($first, $last, $number) {\n14.    $sql = \"insert\
  \ into phonelist values ('$first', '$last', '$number')\";\n15.    echo \"<P>$sql\"\
  ;\n16.  }\n17.\n18.  function form_handler2($HTTP_POST_VARS) {\n19.    $sql = \"\
  insert into phonelist values('\" . $HTTP_POST_VARS['first'] .\n20.             \
  \           \"','\" . $HTTP_POST_VARS['last'] .\n21.                        \"','\"\
  \ . $HTTP_POST_VARS['number'] . \"')\";\n22.    echo \"<P>$sql\";\n23.  }\n24.\n\
  25.  if(isset($submit)) {\n26.    form_handler($first, $last, $number);\n27.   \
  \ form_handler2($HTTP_POST_VARS);\n28.  } else {\n29.    print_form();\n30.  }\n\
  31.  ?>\n```\n\n### 脚本 4-3. form2.php 逐行解释\n\n| 行号 | 描述 |\n| --- | --- |\n| 2–11\
  \ | 声明一个函数 `print_form()`。该函数仅打印一个表单，使用户可以输入名、姓和电话号码。 |\n| 13 | 声明一个函数 `form_hander()`，它需要三个参数，即用户从\
  \ `print_form()` 函数提交表单时返回的项目。 |\n| 14 | 使用用户提供的值生成 SQL。 |\n| 15 | 打印生成的 SQL。 |\n\
  | 16 | 结束函数。 |\n| 18 | 声明一个函数 `form_handler2()`，它只需要一个参数 `$HTTP_POST_VARS`。 |\n\
  | 19–21 | 使用用户提供的值生成 SQL。 |\n| 22 | 打印生成的 SQL。 |\n| 23 | 结束函数。 |\n| 25 | 如果用户点击了“提交”按钮，则执行脚本到第\
  \ 27 行。 |\n| 26 | 使用三个必需变量调用 `form_handler()` 函数。 |\n| 27 | 使用 `$HTTP_POST_VARS`\
  \ 调用 `form_handler2()` 函数。 |\n| 28–30 | 如果没有按下“提交”按钮，则执行 `print_form()` 函数。 |\n\n\
  ### 整合一切\n\n现在我们已经有了构建智能、友好且易于处理表单的组件，让我们来看一个真实的示例。该示例所示图 4-1，提供了用户为典型的社区网站注册的方法。\n\
