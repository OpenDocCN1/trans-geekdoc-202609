  \n\n\n这些身份验证方法适用于临时网站。它们不应被用于保护敏感信息，例如社会安全号码、信用卡号，或任何你不会随手丢在街角的物品。有很多方法可以绕过这些手段，无论是通过黑客攻击、IP\
  \ 伪装还是传统的暴力破解。然而，对于需要基本身份验证且耗费数小时尝试破解所能获得的益处也微乎其微的社区网站来说，这些方法是行有效的。当涉及到信用卡时，恶意黑客有许多可为之图，但当奖励仅仅是一份用户的收藏链接列表时，他们没有动力去花费破解系统所需的精力。简单来说，不要认为仅仅将你的信息放置在\
  \ `PHP` 身份验证方案之后，你的信息就是安全的无的。\n\n本章将深入探讨上述某些场景，以及一些额外的场景，例如将登录限制在一个域名内甚至一个 IP 地址范围内。\n\
