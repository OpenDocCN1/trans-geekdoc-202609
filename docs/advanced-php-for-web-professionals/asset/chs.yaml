  \ 标签。 |\n\n\n\n\n如果你一直在查看 `session.save_path` 目录下的会话文件内容，你可能会注意到那里堆积了一些文件，这取决于你打开了多少个会话示例。这些文件在用户关闭浏览器结束会话时仍然存在未被删除，是因为我们没有去销毁会话。你必须显式地销毁会话，会话文件才会被删除。之所以这样做，是因为你无法判断用户会在会话中持续多久。用户启动会话后，回家过完晚上（甚至过一个漫长的周末！），第二天回来时浏览器仍然打开在桌面上，这是完全可能的。如果用户一直在购物，由于上述原因，你肯定不想在一段固定的有限时间后删除他们的会话。\n\
  \n有两种方法可以应对临时目录中文件的堆积，且在大多数情况下不会对用户的会话产生不利影响。\n\n第一种是使用 `session_destroy()` 函数：\n\
  \n```\nsession_destroy(); \n```\n\n`session_destroy()` 不接受参数。`session_destroy()`\
  \ 会注销与用户会话关联的所有会话变量，并删除会话创建的任何会话文件。请记住，即使变量从会话中被注销，该变量仍然存在于当前页面且其值保持不变。\n\n接下来的脚本演示了\
  \ `session_destroy()` 函数的使用。\n\n### 脚本 2-4 session2.php\n\n```\n1.  <?\n 2.  session_start();\n\
  \ 3.  if(isset($destroy)) {\n 4.    session_destroy();\n 5.    unset($name);\n 6.\
  \  } else {\n 7.    if(!session_is_registered(\"name\")) {\n 8.      session_register(\"\
  name\");\n 9.      $name = \"Spike\";\n10.      }\n11.  }\n12.  ?>\n13.  <p>SESSID:\
  \ <?=$PHPSESSID?>\n14.  <p>Name: <?=$name?>\n15.  <form action=session2.php method=post>\n\
  16.  <input type=\"submit\" name=\"reload\" value=\"Reload Session\"><br>\n17. \
  \ <input type=\"submit\" name=\"destroy\" value=\"Destroy Session\">\n18.  </form>\n\
  ```\n\n### 脚本 2-4. session2.php 逐行解释\n\n| 行 |  |\n| --- | --- |\n| 2 | 启动会话或继续现有会话。\
  \ |\n| 3–5 | 检查 `$destroy` 变量是否设置。如果设置了，说明用户点击了“Destroy”（销毁）按钮。 |\n| 6–10 | 如果未设置\
  \ `$destroy`，则注册名为 `$name` 的会话变量并将该变量赋值为 \"Spike\"。 |\n| 13–14 | 打印当前会话 ID 和 `$name`\
  \ 变量的值。 |\n| 15–18 | 向用户显示表单，允许其刷新当前页面或销毁与当前会话关联的会话变量。如果用户刷新页面（通过点击“Reload”或使用浏览器的刷新按钮），会话变量将重置并显示会话\
  \ ID 值。如果用户点击“Destroy”按钮，则与页面相关的会话文件将被删除，从而删除会话变量的值。 |\n\n在点击“Reload Session”和“Destroy\
  \ Session”按钮时，注意你临时目录中的文件。每次你点击“Destroy Session”，注意具有相应会话 ID 的会话文件会从你的 `session.save_path`\
  \ 目录中删除。每次点击“Reload Session”都会在该目录中重新创建文件。\n\n管理孤立会话文件的另一种方法是利用 PHP 对这些会话文件的自动“垃圾”清理。用文本编辑器打开你的\
  \ `php.ini` 文件并滚动到 `[session]` 设置。查找以下两个设置：\n\n```\n; 每次会话初始化时启动“垃圾回收”过程的百分比概率。\n\
  session.gc_probability = 1\n; 在此秒数之后，存储的数据将被视为“垃圾”，并由垃圾回收过程\n; 进行清理。\nsession.gc_maxlifetime\
  \ = 1440\n```\n\n第一个设置 `session.gc_probability` 设置了被识别为垃圾文件的删除百分比概率。默认值“1”意味着每次启动会话时有\
  \ 1% 的概率。\n\n第二个设置 `session.gc_maxlifetime` 设置了会话在标记为垃圾之前可以存在的寿命（秒为单位）。默认值“1440”意味着超过\
  \ 24 分钟的每个会话都被视为垃圾。\n\n\n\n\n```php\n1.  <?\n 2.  session_start();\n 3.  $inventory\
  \ = array(\n 4.      \"001\" => \"Tooth Paste\",\n 5.      \"002\" => \"Facial Tissue\"\
