  \   ![Next section](img/#ch07lev1sec3.htm) |\n\n| --- |\n\n***\n\n### 生成密码\n\n`md5()`\
  \ 和 `crypt()` 函数对密码进行加密，但它们无法被解密。这些是单向算法。你可以通过比较用户进入网站时使用的密码的 `md5()` 或 `crypt()`\
  \ 输出，来验证用户的密码是否与其最初提供的密码匹配。相同字符串的两个加密版本是匹配的（假设使用 `crypt()` 函数创建密码时使用了相同的“盐”（salt））。\n\
  \n这是好事，因为你永远不会存储用户的实际密码。如果你的密码文件落入别有用之手，他们对此也做不了什么。解密由 `md5()` 或 `crypt()` 加密的密码是非常困难的。由于你不存储用户的实际密码，即使获取你密码文件的恶意黑客也无法获取该密码并轻易用它尝试破解你的用户可能访问的其他网站，因为遗憾的是，大多数人不会为访问的每个网站使用不同的密码。\n\
  \n本章后面的脚本假设你已经创建了某种包含用户名和密码的文件。在文本文件中存储密码的通用惯例是每行放置一个用户名/密码组合，并用冒号分隔用户和密码。例如：\n\n\
  ```\nuser1:sih2hDu1acVcA \nuser2:aSP2C8UUWnxjA\n```\n\n本章的第一个脚本会针对你输入的任何字符串创建一个\
  \ `md5()` 加密密码和一个 `crypt()` 加密密码。如图 7-1 所示，你可以使用此脚本轻松地生成加密密码并显示它们。\n\n#### 脚本 7-1\
  \ generate_passwords.php\n\n```php\n<<html>\n<head>\n<title>密码生成器</title>\n</head>\n\
  <body>\n<form action=\"generate_passwords.php\" method=\"post\">\n<h3>输入密码以创建 MD5\
  \ 和 Crypt 密码。</h3>\n<input type=\"text\" name=\"password\">\n<input type=\"submit\"\
  \ name=\"create\" value=\"创建!\">\n</form>\n<?\nif(isset($_POST[\"password\"])) {\n\
  ?>\n<h3>\"<?=$password?>\" 的密码为：</h3>\n<ul>\n<li>MD5: <?=md5($password)?></li>\n\
  <li>Crypt: <?=crypt($password)?></li>\n</ul>\n<?\n}\n?>\n</body>\n</html>\n```\n\
  \n![图 7-1.密码]\n\n#### 脚本 7-1 generate_passwords.php 逐行说明\n\n| 行 | 说明 |\n| --- |\
  \ --- |\n| 1–10 | 创建一个名为“password”的 HTML 输入字段和一个提交按钮。 |\n| 11 | 开始 PHP。 |\n| 12\
  \ | 检查变量 `$password` 是否已设置。如果是，跳转到第 13 行；否则跳转到第 20 行。 |\n| 13–19 | 结束 PHP。输出经过 MD5\
  \ 和 Crypt 函数加密后的密码。重新开始 PHP。 |\n| 20 | 结束第 12 行的 if 语句。 |\n| 21 | 结束 PHP。 |\n| 23\
  \ | 输出页面的结束 HTML。 |\n\n### 针对文本文件进行身份验证\n\n并不是所有网站都包含存储数据的后端，某些网站可能永远不需要它们。尽管如此，你可能想限制对网站部分甚至整个网站的访问。一种方法是针对服务器某处的文本文件进行身份验证，最好放在\
  \ Web 服务器目录之外，这样别人无法访问它。\n\n这种方法只需要标准文件函数以及 MD5 加密函数。\n\n此脚本具有双重目的。它既允许你向密码文件添加用户，也可以测试身份验证。这样，你可以创建一个空白文本文件并填充一些用户名/密码组合，以便测试脚本的功能。\n\
  \n此脚本并不旨在完整地用于网站密码检查。在将脚本放置于自己的网站之前，你必须移除允许添加用户的功能。\n\n\n\n\n\n```php\n1.  <?\n\
  \ 2.  $password_file = \"C:/apache/passwords/pass.txt\";\n 3.\n4.  function check_pass($login,\
  \ $password) {\n 5.    global $password_file;\n 6.    if(!$fh = fopen($password_file,\
  \ \"r\")) {die(\"<P>Could Not Open Password File\");}\n 7.    $match = 0;\n 8. \
  \   $password = md5($password);\n 9.    while(!feof($fh)) {\n10.      $line = fgets($fh,\
  \ 4096);\n11.      $user_pass = explode(\":\", $line);\n12.      if($user_pass[0]\
  \ == $login) {\n13.        if(rtrim($user_pass[1]) == $password) {\n14.        \
  \  $match = 1;\n15.          break;\n16.        }\n17.      }\n18.    }\n19.   \
  \ if($match) {\n20.      return 1;\n21.    } else {\n22.      return 0;\n23.   \
  \ }\n24.    fclose($fh);\n25.  }\n26.\n27.  function print_login_form($login) {\n\
  \ 28.    ?>\n29.    <p>Please Log In:\n30.    <form action=file_authentication.php\
  \ method=post>\n31.    <p>Login: <input type=\"text\" name=\"login\" value=\"<?=$login?>\"\
  >\n32.    <br>Password: <input type=\"password\" name=\"password\">\n33.    <br><input\
