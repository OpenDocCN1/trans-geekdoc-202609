  ```\n\n## 第 6 章 处理文件\n\n本章内容\n* 概述\n* 打开和关闭文件\n* 使用方法\n* 数据挖掘\n* 解析大文件\n\n### 概述\n\
  \nPHP 是处理文件的非常有用的语言。虽然在解析文件方面可能不如 `PERL` 那样健壮，但在处理文本文件时，它仍然提供了强大的灵活性。\n\n本章涵盖了读取、操作和写入文本文件。你可以使用本章的功能，从文件（本地或通过\
  \ HTTP、FTP）读取数据，并根据你的需求处理这些数据。\n\n### 打开和关闭文件\n\n#### 打开文件\n\n在用 PHP 读取文件之前，必须先将其打开。要打开文件，你需要使用\
  \ `fopen()` 函数。\n\n```php\n$file_handler = fopen($file, $mode)\n```\n\n你必须将函数结果赋值给变量，如上所示。这被称为文件指针。你在整个脚本中使用该指针来引用打开的文件。\n\
  \n`fopen()` 函数有两个参数：\n\n* `$file` 是文件名（如果需要，包含路径）。\n* `$mode` 是可用模式之一：\n    * `r`——\
  \ 只读模式打开文件。你不能向文件中写入任何内容。读取从文件开头开始。\n    * `r+` —— 以读写模式打开文件。读写都从文件开头开始。如果你在将内部指针移动到文件末尾之前进行写入，将删除现有内容。\n\
  \    * `w`—— 只写模式打开文件。你不能从文件中读取数据。写入从文件开头开始。如果指定的 `$file` 参数的文件不存在，则 PHP 会尝试创建该文件。请确保你的权限设置正确！\n\
  \n\n\n\n\n* `w+` — 与上述相同，但也可以读取文件。\n* `a`— 这种模式与 'w' 模式相同，区别在于内部指针被置于文件末尾。除非你将内部指针重置到文件开头，否则现有内容不会被覆盖。\n\
  * `a+` — 与上述相同，但也可以读取文件。\n\n此外，如果文件是二进制文件，且你的操作系统是 Windows，则必须在模式中包含一个 `\"b\"`。本章仅处理\
  \ ASCII 文本文件，因此在接下来的示例中不需要 `\"b\"` 模式。如果你确实需要打开二进制文件，例如所示：\n\n```\n$file_handle\
  \ = fopen($filename, \"rb+\") \n```\n\n请注意 `\"w\"` 和 `\"a\"` 模式之间的区别。使用 `\"w\"`\
  \ 打开文件会有效删除文件内容，而使用 `\"a\"` 模式则保留文件内容并允许你向文件末尾追加额外数据。\n\n一旦打开了文件，你就可以从中读取或写入文件。\n\
  \n### 读取文件\n\n有多个函数可以从文件中读取内容。\n\n你可以使用 `fread()` 函数从文件中读取数据：\n\n```\n$file_contents\
  \ = fread($file_pointer, $length_to_read); \n```\n\n你必须将 `fread()` 的赋值赋值一个变量，该变量将包含读取到的数据。`fread()`\
  \ 函数接受两个参数：\n\n* `$file_pointer` 是你从 `fopen()` 函数中赋值的值的文件指针。\n* `$length` 是你想要读取的字节数。\n\
  \n在使用 `fread()` 读取文件时，你可以读取整个文件。要做到这一点，你需要知道文件的字节大小。你可以使用 `filesize()` 函数轻松找到文件的总字节大小：\n\
  \n```\n$bytes = filesize($filename); \n```\n\n以下脚本演示了如何打开一个短文本文件并显示其内容：\n\n```\n\
  $file = \"/path/to/text.txt\"; \n$filepointer = fopen($file, \"r\");\n$contents\
  \ = fread($filepointer, filesize($file));\necho \"<pre>\" . htmlentities($contents)\
  \ . \"</pre>\";\n```\n\n在从互联网读取文件时，存在一个轻微的问题：你无法轻易确定文件的大小，因为文件不在本地服务器上。一个简单的解决办法是尝试读取比你认为文件中存在的字节得多的字节。由于\
  \ `fread()` 在到达文件末尾 (EOF) 时会停止，因此无需担心 PHP 为你在 `fread()` 的 `$length` 参数中指定的额外字节浪费处理资源。例如：\n\
  \n```\n$file = \"http://www.example.com/text.txt\"; \n$filepointer = fopen($file,\
  \ \"r\");\n$contents = fread($filepointer, 9999999);\n```\n\n### 关闭文件\n\n当你完成对使用\
  \ `fopen()` 函数打开的文件的读取或写入后，应该始终使用 `fclose()` 函数将其关闭：\n\n```\nfclose($filepointer);\
  \ \n```\n\n关闭文件允许你清理打开该文件时使用的任何内存，并防止文件在保持打开状态时有时（极少情况下）可能的文件损坏。\n\n * *\n\n| ![](img/pixel.gif)\
