  \ 创建一个用于在数据库中创建条目的 SQL 语句数组。 |\n| 26 | 查询数据库检查表中是否存在内容。 |\n| 27 | 检查第 26 行的查询是否出错。如果是，终止脚本并向用户显示错误消息。\
  \ |\n| 28 | 如果结果集返回的行数为 0，则执行第 29–34 行。 |\n| 29 | 通知用户脚本正在填充数据库。 |\n| 30 | 启动 for\
