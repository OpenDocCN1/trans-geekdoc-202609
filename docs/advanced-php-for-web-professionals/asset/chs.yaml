  \n\n\nPEAR 是一个“用于可复 PHP 组件的框架和发行系统”。PEAR 提供了类似于 PERL CPAN 模块集的“模块”。可以将这些模块想象成预构建组件的库，通过它们你可以让你的\
  \ PHP 编码变得更容易。PEAR 目前处于测试阶段并正在热热开发中，但它已经包含了许多你可以在自己的项目使用的有用模块。PEAR 提供了开源模块、这些模块的发行和维护，并为这些模块制定了编码标准。\n\
  \n> [1] 取自 PEAR 网站：[pear.php.net](http://pear.php.net)。\n\nPEAR 随 PHP 一起发行。如果你最近安装了\
  \ PHP，可能会注意到 `pear` 目录及其包含的许多文件。由于 PEAR 仍处于测试阶段，它尚未被广泛宣传，但它已经开始受到 PHP 者的者的关注，特别是那些一直使用诸如\
  \ PHPLIB 和 ADOdb 等第三方库的开发者。虽然已经有很多良好的第三方库可用，但在编码指南、发行和维护方面还没有统一的标准。PEAR 看起来是解决这个问题的方案。\n\
  \n开始变得非常的模块之一是 PEAR DB，它是“访问 SQL 数据库的统一 API”。PEAR DB 的功能大大超过了 DBX 库，并且几乎是纯面向对象的。PEAR\
  \ DB 支持 PHP 核心支持的数据库的子集，并正在扩展以支持更多数据库。PEAR DB 是编写与数据库无关的 PHP 应用程序的工具。\n\n### 下载\
  \ PEAR\n\n你可以从 PEAR 网站 [pear.php.net](http://pear.php.net) 下载 PEAR 的最新版本。在网站右上角的“搜索”框中输入“DB”。\n\
  \n点击出现的第一个搜索结果“DB”，然后从发布列表中下载最新的稳定版本。\n\n### 从并发版本系统 (CVS) 下载 PEAR\n\n尽管 PEAR 包含在所有最新版本的\
  \ PHP 中，并且你可以从 PEAR 网站下载较晚的稳定版本，但包含最新功能的、最先进且最强大的 PEAR 版本可能仍然停留在 CVS 仓库中。请注意，你不应该在生产网站上使用\
  \ CVS 版本！如果你有权访问 CVS ([www.cvshome.org](http://www.cvshome.org))，那么你应该利用这一机会，从 PHP\
  \ CVS 仓库下载最新的 PEAR 源码。你可以在 [`cvs.php.net/`](http://cvs.php.net/) 找到 PHP CVS 仓库的所有详细信息。\n\
  \n下载最新的 PEAR 源码：\n\n1. 切换到你想要放置源码的位置（或一个方便拷贝文件的地方）。\n2. 执行命令：\n   ```bash\n   cvs\
  \ -d :pserver:cvsread@cvs .php.net:/repository login\n   ```\n   系统会提示输入密码。输入 \"\
  phpfi\"。\n3. 执行命令：\n   ```bash\n   cvs -d :pserver:cvsread@cvs .php.net:/repository\
  \ export -D \"last week\" php4/pear\n   ```\n   PEAR DB 文档的主要贡献者之一 Thomas V. V.\
  \ Cox 建议使用 \"last week\" 标记。有时候最新版本会有小 bug，但大多数时候没有。\n\n### 安装 PEAR\n\n将 PEAR 文件夹复制到你的\
  \ Web 目录。完成后，你需要在你的脚本中包含 `pear.php` 文件。\n\n```php\nrequire_once('pear.php');\n$dsn\
  \ = \"mysql://user:password@host/database\";\n$dbconn = DB::connect($dsn);\n\nif\
  \ (DB::isError($dbconn)) {\n    die($dbconn->getMessage());\n}\n```\n\n### 回归基础\n\
  \n现在你已经建立好了连接，并有了在连接失败时捕获错误的方法，接下来你需要学会的是向数据库发送查询。这是通过 `query()` 方法实现的。\n\n```php\n\
  $result = $dbconn->query(QUERY);\n```\n\n`query()` 接受一个参数 QUERY，它是一个 SQL 语句。你将查询结果赋值给一个变量（例如\
  \ `$result`），这是一个结果对象。\n\n一旦你获得了一个有效的结果对象，就可以使用“fetch”方法之一来从结果中获取数据，然后将其格式化并显示给用户，或者对其进行一些其他处理。你可以使用两种\
  \ fetch 方法：`fetchRow()` 和 `fetchInto()`。\n\n```php\n$row = $result->fetchRow();\n\
  ```\n\n以及\n\n```php\n$result->fetchInto($row);\n```\n\n这两种方法产生的结果完全相同：一个名为 `$row`\
  \ 的变量，其中包含了结果中的当前行数据。\n\n\n\n\n* `DB_FETCHMODE_ASSOC`— 数据被格式化为关联数组。\n* `DB_FETCHMODE_OBJECT`—\
  \ 数据被格式化为对象，其中列名为属性。\n\n例如，假设你有一个名为“crew”的表格（表 3-2），其中包含以下信息：\n\n### 表 3-2. 示例数据\n\
  \n| ID | NAME | ORIGIN |\n| --- | --- | --- |\n| 0 | Spike | MA |\n| 1 | Jett |\
  \ AZ |\n| 2 | Faye | FL |\n| 3 | Ed | NM |\n| 4 | Ein | CO |\n\n你查询数据库并获得结果：\n\n\
  ```php\n$sql = \"select name, origin from crew\"; \n$result = $dbconn->query($slq);\n\
  ```\n\n这三种格式将是：\n\n```php\n// 使用默认的 DB_FETCHMODE_ORDERED 格式 \n$row = $result->fetchRow();\n\
  $name = $row[0]; // $name = \"Spike\";\n$origin = $row[1]; //$origin = \"MA\";\n\
  \n// 使用关联数组作为格式\n$row = $result->fetchRow(DB_FETCHMODE_ASSOC);\n$name = $row['name'];\
  \ // $name = \"Spike\";\n$origin = $row['origin']; //origin = \"MA\";\n\n// 使用对象作为格式\n\
  $result->fetchInto($row, DB_FETCHMODE_OBJECT);\n$name = $row->name; // $name = \"\
  Spike\";\n$origin = $row->origin; //origin = \"MA\";\n```\n\n这些格式提供了极大的灵活性。另外注意，不同的\
  \ fetch 方法会产生相同的预期结果。\n\n由于在脚本的为每个 fetch 方法都手动输入 `DB_FETCHMODE_ASSOC` 或 `DB_FETCHMODE_OBJECT`\
  \ 作为参数可能会非常麻烦（如果你选择使用这些格式），PEAR DB 提供了一个名为 `setFetchMode()` 的巧妙方法。\n\n```php\n$dbconn->setFetchMode(MODE);\
  \ \n```\n\n`setFetchMode` 是连接对象的一个方法，用于设置所有 fetch 函数的默认抓取模式。参数 `MODE` 可以是之前指定的三个抓取模式中的任何一个。注意，如果你还没有将抓取模式设置为其他值之一，那么将抓取模式设置为\
  \ `DB_FETCHMODE_ORDERED` 是没有意义的，因为已经是默认值。一旦你使用此方法，你调用的所有 fetch 方法都会使用 `setFetchMode()`指定的模式，除非你在\
  \ fetch 方法本身中指定了不同的抓取模式。\n\n你还应该使用检查连接错误的相同方法来检查结果是否存在错误。如果 `query()` 产生错误，它将返回一个错误对象：\n\
  \n```php\n$result = $dbconn->query($sql); \nif (DB::isError($result)) { die ($result->getMessage());}\n\
  ```\n\n在你完成结果集后，应该使用 `free()` 方法释放结果对象。这将“释放”与结果集相关的内存并减少对 Web 服务器的负载：\n\n```php\n\
  $result->free(); \n```\n\n最后，当你完成脚本后，应该关闭与服务器的连接。这是通过连接对象的 `disconnect` 方法实现的：\n\
  \n```php\n$dbconn->disconnect(); \n```\n\n你现在拥有了创建简单脚本的构建模块。接下来的脚本将说明不同的 fetch 方法和错误处理。\n\
  \n### 脚本 3–5 peardb1.php\n\n```php\n1.  <?\n 2.  ini_set(\"include_path\", \"/path/to/php/pear\"\
  );\n 3.  require_once('DB.php');\n 4.  $type = \"mssql\";\n 5.  $user = \"mssqluser\"\
  ;\n 6.  $pass = \"password\";\n 7.  $host = \"192.168.0.1\";\n 8.  $database = \"\
  php\";\n 9.  $dsn = \"$type://$user:$pass@$database\";\n10.  $dbconn = DB::connect($dsn);\n\
  11.  if (DB::isError($dbconn)) { die ($dbconn->getMessage()); }\n12.  /*\n13.  create\
  \ table bebop (\n14.      id INT,\n15.      name VARCHAR(8),\n16.      origin CHAR(2);\n\
  17.  */\n18.  $values = array (\n19.      \"insert into bebop values ('0','Spike','MA')\"\
  ,\n20.      \"insert into bebop values ('1','Jett','AZ')\",\n21.      \"insert into\
  \ bebop values ('2','Faye','FL')\",\n22.      \"insert into bebop values ('3','Ed','NM')\"\
  ,\n23.      \"insert into bebop values ('4','Ein','CO')\"\n24.  );\n25.\n26.  $result\
  \ = $dbconn->query(\"select * from bebop\");\n27.  if(DB::isError($result)) { die\
  \ ($result->getMessage());}\n28.  if($result->numRows() == 0) {\n29.      echo \"\
  <P>Populating the DB!<p>\";\n30.      for($i = 0; $i < sizeof($values); $i++) {\n\
  31.        $result2 = $dbconn->query($values[$i]);\n32.        if (DB::isError($result2))\
  \ { die ($result2->getMessage());}\n33.      }\n34.      echo \"<P>Done the DB!\
  \ Reload Page<p>\";\n35.  } else {\n36.      $result = $dbconn->query(\"select name,\
  \ origin from bebop\");\n37.      if (DB::isError($result)) { die ($result->getMessage());}\n\
  38.      echo \"<P>Default Fetch Mode (DB_FETCHMODE_ORDERED):\";\n39.      while($result->fetchinto($row)){\n\
  40.        echo \"<br>\" . $row[0] . \" \" . $row[1];\n41.      }\n42.      $result\
  \ = $dbconn->query(\"select name, origin from bebop\");\n43.      $dbconn->setFetchMode(DB_FETCHMODE_ASSOC);\n\
  44.      echo \"<HR>DB_FETCHMODE_ASSOC Fetch Mode:\";\n45.      while($row = $result->fetchRow()){\n\
  46.        echo \"<br>\" . $row['name'] . \" \" . $row['origin'];\n47.      }\n\
  48.      $result = $dbconn->query(\"select name, origin from bebop\");\n49.    \
  \  $dbconn->setFetchMode(DB_FETCHMODE_OBJECT);\n50.      echo \"<HR>DB_FETCHMODE_OBJECT\
  \ Fetch Mode:\";\n51.      while($row = $result->fetchinto($row)){\n52.        echo\
  \ \"<br>\" . $row->name . \" \" . $row->origin;\n53.      }\n54.  }\n55.  $result->free();\n\
  56.  $dbconn->disconnect();\n57.  ?>\n```\n\n### 脚本 3-5. peardb1.php 逐行说明\n\n| 行\
  \ | 描述 |\n| --- | --- |\n| 2 | 设置包含路径，以便脚本可以使用 PEAR 库。 |\n| 3 | 引入发行的 `DB.php` 库。\
  \ |\n| 4–8 | 定义连接属性，以便脚本连接数据库。 |\n| 9 | 使用上述属性构建 DSN。 |\n| 10 | 建立到数据库服务器的连接。 |\n\
