  \ post，编码为 multipart/form-data。 |\n| 24 | 创建一个边框为 1 的表格。 |\n| 26 | 循环从 0 到 $fields-1。\
  \ |\n| 28 | 创建表格行，单元格显示 \"File:\"。 |\n| 30 | 创建一个隐藏输入框，MAX_SIZE 值为 102400。 |\n|\
  \ 31 | 创建文件输入框，名称为 file 加上索引。 |\n| 36 | 创建一个隐藏输入框，fields 值为 ?fields。 |\n| 37 | 创建提交按钮，显示为\
  \ \"Upload!\"。 |\n| 42 | 设置上传目录 $uploaddr（确保包含末尾斜杠）。 |\n| 43 | 如果设置了 $submit。 |\n\
  | 44 | 循环从 0 到 $fields-1。 |\n| 45 | 检查该变量是否为已上传的文件。 |\n| 46 | 构造新文件的路径，拼接目录和原始文件名。\
  \ |\n| 47 | 尝试将上传的文件复制到新路径。 |\n| 48 | 如果复制失败，打印错误信息。 |\n| 50 | 如果复制成功，打印成功信息。 |\n\
  | 54 | 如果如果设置了 $fields。 |\n| 55 | 调用 print_form($fields)。 |\n| 57 | 否则，调用 specify_number()。\
  \ |\n| 61 | 结束 HTML 标签。 |\n\n\n\n\n\n此购物车为用户提供了一个简单的界面，如图 5-1 所示。用户只需点击鼠标，即可浏览不同类别的商品。所有类别都可以页面顶部的下拉菜单访问。\n\
  \n### 图 5-1. 购物界面\n\n![graphics/05fig01.jpg](img/05fig01.jpg)\n\n当用户选择一个类别时，该类别下的所有商品都会显示在页面上。如果他们知道自己想要，只需点击\
  \ `Add` 按钮即可将商品添加到购物车。每点击一次 `Add` 按钮就会添加一个商品；多次点击意味着添加了多个商品。\n\n如果用户想了解某个特定商品的更多信息，可以点击商品名称。这将向用户展示该商品的更详细的视图，如果提供了商品图片，还会显示图片供用户查看。\n\
  \n同样，他们可以点击 `Add` 按钮将一个或多个商品添加到购物车；多次点击意味着添加多个商品。\n\n用户还会看到一个链接，可以返回他们刚才浏览的类别，也可以从页面顶部的下拉列表中选择新类别。\n\
  \n另一个让购物车变得简单的特性是购物车界面。用户在购物的每个页面上都能看到自己的购物车以及其中包含的商品。页面还会显示购买费用的累计总额。\n\n用户可以选择点击商品旁边的\
  \ `Remove` 按钮从购物车中移除商品。每次点击会移除一个商品单位，直到没有商品为止。\n\n用户还可以选择通过点击购物车中的批量修改链接来修改购物车中商品的\
  \ `bulk` 数量。这会在每个商品旁边显示出文本输入字段，用户可以使用这些字段来指定购物车中某件商品的精确数量。这样，当用户想要 50 件特定商品时，就不需要点击\
  \ 50 次 `Add` 按钮了。\n\n最后，当用户的购物车中有商品时，就会出现一个 `Check Out` 链接。点击 `Check Out` 将用户引导到标准的结账表单，在那里输入\
  \ `Name`、`Address`、`Credit Card Information` 等。\n\n### 简单的管理和维护界面\n\n购物车还带有简单的管理和维护界面。一个接口用于管理商店的类别和库存（参见图\
  \ 5-2），另一个用于管理订单（参见图 5-3）。\n\n### 图 5-2. 类别和库存管理界面\n\n![graphics/05fig02.jpg](img/05fig02.jpg)\n\
  \n### 图 5-3. 订单管理界面\n\n![graphics/05fig03.jpg](img/05fig03.jpg)\n\n要管理商店的类别和库存，你需要使用\
  \ `dbmanage.php` 脚本。该脚本包含了管理这些实体的逻辑。\n\n\n\n\n\n```sql\n1.  create table customers\
  \ (\n 2.  id INT NOT NULL,\n 3.  first VARCHAR(32),\n 4.  mi CHAR(2),\n 5.  last\
  \ VARCHAR(32),\n 6.  address1 VARCHAR(64),\n 7.  address2 VARCHAR(64),\n 8.  city\
  \ VARCHAR(32),\n 9.  state CHAR(2),\n10.  zip VARCHAR(10),\n11.  country VARCHAR(32),\n\
  12.  shiptobilling VARCHAR(5),\n13.  ship_address1 VARCHAR(64),\n14.  ship_address2\
  \ VARCHAR(64),\n15.  ship_city VARCHAR(32),\n16.  ship_state CHAR(2),\n17.  ship_zip\
  \ VARCHAR(10),\n18.  ship_country VARCHAR(32),\n19.  ship_phone VARCHAR(32),\n20.\
  \  email VARCHAR(128),\n21.  PRIMARY KEY(id));\n22.\n23.  create table order_details\
  \ (\n 24.  id int not null,\n 25.  orderid INT,\n 26.  code VARCHAR(32),\n 27. \
  \ qty INT,\n 28.  PRIMARY KEY(id));\n29.\n30.  create table orders (\n 31.  id INT\
  \ not null,\n 32.  customer INT,\n 33.  status VARCHAR(16),\n 34.  tracking_number\
  \ VARCHAR(128),\n 35.  PRIMARY KEY(id));\n36.\n37.  create table inventory (\n 38.\
  \  id INT not null,\n 39.  name VARCHAR(32),\n 40.  category INT,\n 41.  code VARCHAR(32),\n\
  \ 42.  description TEXT,\n 43.  price VARCHAR(8),\n 44.  picture VARCHAR(128),\n\
  \ 45.  qty INT,\n 46.  PRIMARY KEY(id));\n47.\n48.  create table category (\n 49.\
  \  id INT not null,\n 50.  name VARCHAR(128),\n 51.  description TEXT,\n 52.  PRIMARY\
  \ KEY(id));\n```\n\n##### 脚本 5-1. cart.sql 逐行解释\n\n| 行 | 描述 |\n| --- | --- |\n|\
