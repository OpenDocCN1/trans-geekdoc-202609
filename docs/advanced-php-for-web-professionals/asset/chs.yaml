  \ 应该返回一个对象。\n- 41: 向用户显示错误，包括特定的 DBX 错误消息。\n- 42–44: 如果查询数据库时没有错误，则向用户显示成功消息。\n\
  - 45: 结束函数。\n- 46: 开始主程序。\n- 47: 使用脚本开头定义的变量生成数据库连接字符串。\n- 49–53: 打印显示标题的页面 HTML\
  \ 以及添加 URL 的表单。\n- 55–57: 如果点击了 \"Add URL!\" 按钮，则运行 `url()` 函数。\n- 58–60: 如果点击了任何\
  \ URL 旁边的 \"Delete\"链接，则运行 `url()` 函数。\n- 61: 生成获取 URL 的 SQL 语句。\n- 62: 使用上述生成的\
  \ SQL 运行 `get_url()` 函数从数据库中获取 URL。\n- 63: 检查 `get_urls()` 函数返回的结果集中是否有数据。如果没有数据，则说明数据库为空。\n\
  - 65: 向用户显示数据库为空的消息。\n- 67: 如果数据库不为空，则执行脚本的剩余部分。\n- 70–71: 创建一个显示 URL 的表格。\n- 73:\
  \ 启动 for 循环，遍历从 `get_url()` 函数返回的数据。\n- 75: 将 URL 打印到表格中，并包含该 URL 的超链接。\n- 76: 在表格中打印\
  \ URL 的描述。\n- 77: 为该 URL 打印删除链接。\n- 79: 结束 for 循环。\n- 81: 结束第 63 行开始的 if/else 语句。\n\
  - 83–84: 关闭页面的 HTML。\n\n### 为多个数据库创建你自己的支持支持\n\n如果你有一个不需要复杂的数据库交互的简单应用程序，但你仍然希望它支持多个数据库，那么你可以创建自己的一套数据库包装函数。\n\
  \n你必须考虑到可能出现的不同特定特定限制，并针对最低共同标准进行编码。也就是说，如果你还想支持 MS SQL 或 PostgreSQL 数据库，就不能使用 MySQL\
  \ 支持的有用 `\"AUTO_INCREMENT\"` 列功能，因为它们没有实现该功能。同样，MySQL 不支持辅助键，因此你不能使用该约定。下一个示例提供了一个支持\
  \ MySQL、MS SQL 和 PostgreSQL 的示例数据库包装器。它被称为 `DBlib`，包含了表 3-1 中列出的函数：\n\n##### 表 3-1.\
  \ DBlib.php 函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `connectDB(DB_ID)` | 连接到数据库服务器并返回\
  \ `DB_CONNECTION`。 |\n| `selectDB(DB_ID)` | 选择在服务器上哪个数据库。 |\n| `queryDB(DB_ID, QUERY)`\
  \ | 向数据库发送 SQL 查询。返回 `RESULT` 集合。 |\n| `returnDBarray(DB_ID, RESULT)` | 返回 `RESULT`\
  \ 集中行的数组。 |\n| `numrowsDB(DB_ID, RESULT)` | 返回上次查询受影响的行数。 |\n| `closeDB(DB_ID, DB_CONNECTION)`\
  \ | 关闭与数据库的连接。 |\n\n示例的第一部分是 `DBlib.php` 文件，将其包含在你自己的应用程序中。\n\n##### 脚本 3–2 DBlib.php\n\
  \n\n\n\n\n```php\n<?\n  function connectDB($db) {\n  global $host, $database, $username,\
  \ $password;\n  switch($db) {\n    case (\"psql\"):\n      $conn_string = \"host=\"\
  \ . $host . \" dbname=\" . $database . \" user=\" . $username . \" password=\" .\
  \ $password;\n      $dbconn = pg_connect($conn_string) or die (\"Error Connecting\
  \ to PostgreSQL DB\");\n      return $dbconn;\n      break;\n    case (\"mysql\"\
  ):\n      $dbconn = mysql_connect($host, $username, $password) or die (\"Error Connecting\
  \ to MySQL DB\");\n      return $dbconn;\n      break;\n    case(\"mssql\"):\n \
  \     $dbconn = mssql_connect($host, $username, $password) or die (\"Error Connecting\
  \ to MS SQL DB\");\n      return $dbconn;\n      break;\n    default;\n      echo\
  \ \"<P>Invalid Database: $db\";\n      return 0;\n    }\n  }\n\n  function selectDB($db)\
  \ {\n  global $database;\n    switch($db) {\n    case (\"psql\"):\n      return\
  \ 1;\n      break;\n    case (\"mysql\"):\n      mysql_select_db($database) or die\
  \ (\"Error Connecting to MySQL DB\");\n      return 1;\n      break;\n    case(\"\
  mssql\"):\n      mssql_select_db($database) or die (\"Error Connecting to MS SQL\
  \ DB\");\n      return 1;\n      break;\n    default;\n      echo \"<P>Invalid Database:\
  \ $db\";\n      return 0;\n    }\n  }\n\n  function queryDB($db, $query) {\n   \
  \ switch($db) {\n    case (\"psql\"):\n      if(!$result = @pg_exec($query)){\n\
  \        $result = 0;\n      }\n      break;\n    case (\"mysql\"):\n      if(!$result\
  \ = @mysql_query($query)){\n        $result = 0;\n      }\n      break;\n    case(\"\
  mssql\"):\n      if(!$result = @mssql_query($query)){\n        $result = 0;\n  \
  \    }\n      break;\n    default;\n      echo \"<P>Invalid Database: $db\";\n \
  \     $result = 0;\n    }\n    return $result;\n  }\n\n  function returnDBarray($db,\
  \ $result) {\n  if($result != \"error\") {\n    switch($db) {\n      case (\"psql\"\
  ):\n        if(!$array = @pg_fetch_array($result)){\n          $array = 0;\n   \
  \     }\n        break;\n      case (\"mysql\"):\n        if(!$array = @mysql_fetch_array($result)){\n\
  \          $array = 0;\n        }\n        break;\n      case(\"mssql\"):\n    \
  \    if(!$array = @mssql_fetch_array($result)){\n          $array = 0;\n       \
  \ }\n        break;\n      default;\n        echo \"<P>Invalid Database: $db\";\n\
  \        $array = 0;\n    }\n    return $array;\n  }\n  }\n\n  function closeDB($db,$dbconn)\
  \ {\n    switch($db) {\n    case (\"psql\"):\n      if(!@pg_close($dbconn)){\n \
  \       return 0;\n      } else {\n        return 1;\n      }\n      break;\n  \
  \  case (\"mysql\"):\n      if(!@mysql_close($dbconn)){\n        return 0;\n   \
  \   } else {\n        return 1;\n      }\n      break;\n    case(\"mssql\"):\n \
  \     if(!@mssql_close($dbconn)){\n        return 0;\n      } else {\n        return\
  \ 1;\n      }\n      break;\n    default;\n      echo \"<P>Invalid Database: $db\"\
  ;\n      return 0;\n    }\n  }\n\n  function numrowsDB($db, $result) {\n    switch($db)\
  \ {\n    case (\"psql\"):\n      if(!$rows = @pg_numrows($result)){\n        return\
  \ 0;\n      } else {\n        return $rows;\n      }\n      break;\n    case (\"\
  mysql\"):\n      if(!$rows = @mysql_numrows($result)){\n        return 0;\n    \
  \  } else {\n        return $rows;\n      }\n      break;\n    case(\"mssql\"):\n\
  \      if(!$rows = @mssql_numrows($result)){\n        return 0;\n      } else {\n\
  \        return $rows;\n      }\n      break;\n    default:\n      echo \"<P>Invalid\
  \ Database: $db\";\n      return 0;\n    }\n  }\n?>\n```\n\n### 脚本 dbib.php 逐行解释\n\
  \n#### 1. connectDB 函数\n`connectDB($db)` 函数初始化数据库连接。\n- **第 2-3 行**: 定义全局变量 `$host`、`$database`、`$username`\
  \ 和 `$password`。\n- **第 4 行**: 根据 `$db` 类型开始一个 switch 语句。\n- **第 5-9 行 (psql)**:\
  \ 构建 `$conn_string`，使用 `pg_connect()` 连接到 PostgreSQL 并返回 `$dbconn`。\n- **第 10-13\
  \ 行 (mysql)**: 使用 `mysql_connect()` 连接到 MySQL 并返回 `$dbconn`。\n- **第 14-17 行 (mssql)**:\
  \ 使用 `mssql_connect()` 连接到 MS SQL 并返回 `$dbconn`。\n- **第 18-21 行 (default)**: 如果无效，则输出错误并返回\
  \ 0。\n\n#### 2. selectDB 函数\n`selectDB($db)` 函数选择数据库。\n- **第 24-25 行**: 访问全局变量 `$database`。\n\
  - **第 26-29 行 (psql)**: 返回 1。\n- **第 30-33 行 (mysql)**: 执行 `mysql_select_db($database)`\
  \ 并返回 1。\n- **第 34-37 行 (mssql)**: 执行 `mssql_select_db($database)` 并返回 1。\n- **第\
  \ 38-41 行 (default)**: 如果无效，则输出错误并返回 0。\n\n#### 3. queryDB 函数\n`queryDB($db, $query)`\
  \ 函数执行查询。\n- **第 44-50 行 (psql)**: 使用 `@pg_exec($query)`，如果失败则将 `$result` 设置为 0。\n\
  - **第 51-55 行 (mysql)**: 使用 `@mysql_query($query)`，如果失败则将 `$result` 设置为 0。\n- **第\
