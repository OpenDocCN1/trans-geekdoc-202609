  \ 方法连接到你之前定义的 `delete_event()` 函数。当用户点击应用程序右上角的“X”按钮时，会调用 `delete_event` 方法。在之前的示例中，我们省略了此方法，因为我们想直接销毁窗口。\
  \ |\n| 40 | 创建名为 `$button` 的新按钮。 |\n| 41 | 将按钮的 `clicked` 方法连接到 `confirm` 函数。 |\n\
