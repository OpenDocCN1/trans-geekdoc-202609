  \ |\n\n## 跟踪用户登录\n\n接下来的脚本基于之前的示例，创建一个跟踪以下内容的小型应用程序：\n\n* 有效登录— 脚本记录每次成功登录的日期、时间、用户名、IP\
  \ 地址和浏览器。\n*   无效登录— 脚本记录用户名以及用户尝试（未成功）访问网站的日期和时间。\n*   数据库连接失败— 当数据库连接失败时，脚本向网站管理员的邮箱地址发送电子邮件。\n\
  \n## 备注\n\n如果将此代码放在繁忙的网站上，可能会产生大量的垃圾邮件。每当数据库连接尝试失败时，都会向脚本指定的邮箱地址发送封邮件。如果你每天有 1000\
  \ 次访问且数据库连接中断，请预计收件箱里至少会有 1000 封邮件（取决于每个页面发生多少连接尝试）。\n\n### 脚本 8-6 login_track.php\n\
  \n查看全屏\n\n\n\n\n\n```php\n<?\n  /* 此脚本所需的 SQL *****\n  create table users (\n  \
  \  id INT NOT NULL,\n    username VARCHAR(16),\n    password VARCHAR(8),\n    primary\
  \ key(id));\n  *****\n\nfunction connect() {\n  global $dbuser, $dbpw, $dbhost;\n\
  \  if(!$db = @mysql_pconnect($dbhost,$dbuser,$dbpw)) {\n    global $mysqlerr;\n\
  \    $mysqlerr = mysql_error();\n    trigger_error(\"DATABASE CONNECT ERROR\",E_USER_NOTICE);\n\
  \    failure();\n  } else {\n    mysql_select_db(\"php\", $db);\n    return 1;\n\
  \  }\n} //end connect()\n\nfunction check_user($user, $password) {\n  if(connect())\
  \ {\n    $password = substr($password, 0, 8);\n    $sql = \"select * from users\
  \ where username = '$user' and password = '$password'\";\n    if(!$result = mysql_query($sql))\
  \ {\n      failure();\n    }\n    if (mysql_num_rows($result) == 1) {\n      setcookie(\"\
  user\",$user);\n      setcookie(\"password\",$password);\n      trigger_error(\"\
  VALID LOGIN\",E_USER_NOTICE);\n      return 1;\n    } else {\n      trigger_error(\"\
  INVALID LOGIN\",E_USER_NOTICE);\n      return 0;\n    }\n  }\n} //end check_user\n\
  \nfunction error_handler($number, $string, $file, $line) {\n  global $admin_email;\n\
  \  $timestamp = date(\"m-d-Y H:i:s (T)\");\n  switch($string) {\n    case(\"INVALID\
  \ LOGIN\"):\n      global $user;\n      error_log(\"Failed login attempt by $user\
  \ on $timestamp\\n\",3,\"failed_logins.txt\");\n      echo \"<<h3>>Login Failed.\
  \ Try Again!</</h3>>\";\n      break;\n    case(\"VALID LOGIN\");\n      global\
  \ $user, $REMOTE_ADDR, $HTTP_USER_AGENT;\n      error_log(\"LOGIN: $user on $timestamp\
  \ from $REMOTE_ADDR using $HTTP_USER_AGENT\\n\",\n3,\"valid_logins.txt\");\n   \
  \   break;\n    case(\"DATABASE CONNECT ERROR\"):\n      global $mysqlerr;\n   \
  \   $message = \"Database Error!\\n\";\n      $message .= \"Unable to connect to\
  \ database at $timestamp\\n\\n\";\n      $message .= \"ERROR INFORMATION:\\n\";\n\
  \      $message .= \"FILE:\\t$file\\n\";\n      $message .= \"LINE:\\t$line\\n\"\
  ;\n      $message .=\"MYSQL:\\t$mysqlerr\\n\";\n      error_log($message,1,$admin_email,\
  \ \"FROM: PHP MONITOR <noreply@example.com>\");\n      failure();\n      break;\n\
  \    default:\n      if($number != 0) {\n        error_log(\"Error ($number) on\
  \ line $line in file $file. The error was \\\"\" . trim(\n$string) . \"\\\"\\n\"\
  , 3, \"error_log.txt\");\n      }\n      break;\n  }\n} //end error_handler\n\n\
  function failure() {\n  ?>\n  <h3>Sorry,</h3>\n  <p>A problem has occured. The site\
  \ administators have been notified and the problem \n  should be resolved shortly.\n\
  \  <p>Please try again later.\n  <?\n  die();\n} // end failure\n\nfunction head()\
  \ {\n  ?>\n  <html>\n  <head>\n  <title>Login Tracker</title>\n  </head>\n  <body\
  \ bgcolor=\"#FFFFFF\">\n  <h1>Login Tracker</h1>\n  <?\n} //end head\n\n/***** 主程序部分\
  \ *****/\n$admin_email = \"email@example.com\";\n$dbuser = \"mysqluser\";\n$dbpw\
  \ = \"password\";\n$dbhost = \"192.168.0.5\";\n$page = \"login_track.php\";\nerror_reporting(0);\n\
  set_error_handler(\"error_handler\");\nif(!isset($user) or !check_user($user, $password))\
  \ {\n  head();\n  ?>\n  <h1>You must log in to view this page</h1>\n  <form action=\"\
  <?page?>\" method=\"post\">\n  <p>Username: <input type=\"text\" name=\"user\"><br>\n\
  \  Password: <input type=\"password\" name=\"password\" maxlength=\"8\" size=\"\
  8\"><br>\n  <input type=\"submit\" name=\"submit\" value=\"Submit\">\n  </form>\n\
  \  <?\n} else {\n  head();\n  ?>\n  <h1>Authorized!</h1>\n  <p>Your content here...\n\
  \  <?\n}\n</body>\n</html>\n\n### 脚本 login_track.php 逐行解释\n\n| 行号 | 描述 |\n| :---\
  \ | :--- |\n| 2–8 | 此脚本所需的 SQL。 |\n| 10–21 | 定义函数 `connect()`，用于连接数据库。 |\n| 11 |\
  \ 允许在函数这些变量。 |\n| 12 | 尝试连接数据库。如果发生错误，执行 13–16 行。如果没有发生错误，执行 17–20 行。 |\n| 13 |\
  \ 将变量 `$mysqlerr` 赋值给全局作用域。 |\n| 14 | 将 `mysql_error()` 提供的错误信息赋值给变量 `$mysqlerr`。\
  \ |\n| 15 | 触发自定义错误并发送到 `error_handler()` 函数。 |\n| 16 | 执行 `failure()` 函数。 |\n|\
  \ 17–20 | 因为没有发生错误，在 MySQL 服务器上选择正确的数据库并返回 `1`。 |\n| 21 | 函数定义结束。 |\n| 23–40 | 定义函数\
  \ `check_user()`，用于将输入的用户名/密码与数据库中存储的值进行对比。 |\n| 24 | 尝试连接数据库。如果连接失败，`connect` 函数会自动记录错误并终止脚本。\
  \ |\n| 25 | 截断输入的密码，使其仅为 8 个字符。 |\n| 26 | 定义 SQL 语句，从 `users'` 表中选择用户名和密码与输入值匹配的所有信息。\
  \ |\n| 27–29 | 将查询发送到服务器并确保查询实际通过。如果没有通过，调用 `failure()` 函数向用户显示失败通知。 |\n| 30 | 如果结果集中有一行，我们知道用户输入的值正确的。如果数据库没有返回任何行，我们知道用户的值与数据库中的值不匹配。（不应该有很多，因为你向数据库输入信息应该使用唯一的电子邮件地址。）\
  \ |\n| 31–32 | 在用户浏览器中设置 cookie，这样他们就不需要再次输入用户名和密码了，因为我们知道值是正确的。 |\n| 33 | 触发错误以便将登录尝试存储在日志文件中。\
  \ |\n| 34 | 向调用函数返回 `1`，使其知道尝试是成功的。 |\n| 35–38 | 如果输入的值与数据库中的值不匹配，则记录该尝试并向调用函数返回\
