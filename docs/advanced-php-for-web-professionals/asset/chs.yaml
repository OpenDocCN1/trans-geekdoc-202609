  \ |\n| 44 | 调用 `Gtk::main()` 方法运行脚本。 |\n\n### PHP GTK Application\n\n此应用程序使用 GTK\
  \ 控件创建一个加密密码的小程序。您在相应的字段中输入用户名和密码，然后点击“生成”按钮创建一个加密的用户名和密码组合。用户名和密码显示在应用程序中间的文本框中。当你创建了所需的密码，可以点击“写入文件”将数据写入文件。见图\
  \ 12-8 的输出。\n\n##### 脚本 12-6 password_gen.php\n\n```php\n<?php\nif (!class_exists('gtk'))\
  \ {\n    if (strtoupper(substr(PHP_OS, 0, 3)) == 'WIN')\n      dl('php_gtk.dll');\n\
  \    else\n      dl('php_gtk.so');\n}\nfunction destroy(){\n    Gtk::main_quit();\n\
  }\nfunction generate(){\n    global $user_in, $pass_in, $output;\n    $text = $user_in->get_text()\
  \ . \":\" . $pass_in->get_text() . \"\\n\";\n    $output->insert(null, null, $text);\n\
  \    $user_in->set_text('');\n    $pass_in->set_text('');\n}\nfunction encoded($text)\
  \ {\n    return md5($text);\n}\nfunction write(){\n    global $output;\n    $text\
  \ = $output->get_chars(-1);\n    $file = fopen(\"pass.txt\", \"w\") or die(\"CANNOT\
  \ OPEN FILE\");\n    fwrite($file, $text);\n    fclose($file);\n    $output->delete_text(-1);\n\
  \    $complete = \"Passwords written to file!\\n\";\n    $output->insert(null, null,\
  \ $complete);\n}\n$window = new GtkWindow();\n$window->set_default_size(300, 300);\n\
  $window->connect('destroy', 'destroy');\n$user_label = new GtkLabel(\"Username:\
  \ \");\n$user_in = new GtkEntry();\n$user_box = new GtkHBox();\n$user_box->pack_start($user_label,\
  \ false, false, 0);\n$user_box->pack_start($user_in, false, false, 0);\n$pass_label\
  \ = new GtkLabel(\"Password: \");\n$pass_in = new GtkEntry();\n$pass_box = new GtkHBox();\n\
  $pass_box->pack_start($pass_label, false, false, 0);\n$pass_box->pack_start($pass_in,\
  \ false, false, 0);\n$button1 = new GtkButton('Generate Username:Password!');\n\
  $button1->connect('clicked', 'generate');\n$output = new GtkText();\n$button2 =\
  \ new GtkButton('Write To File');\n$button2->connect('clicked', 'write');\n$vbox\
  \ = new GtkVBox();\n$vbox->pack_start($user_box, false, false, 0);\n$vbox->pack_start($pass_box,\
  \ false, false, 0);\n$vbox->pack_start($button1, false, false, 0);\n$vbox->pack_start($output,\
  \ false, false, 0);\n$vbox->pack_start($button2, false, false, 0);\n$window->add($vbox);\n\
  $window->show_all();\nGtk::main();\n?>\n```\n\n##### 图 12-8. 输出\n\n![graphics/12fig08.jpg](img/12fig08.jpg)\n\
