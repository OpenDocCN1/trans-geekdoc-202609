  \ 函数返回 true，则用户有效并可以查看受保护的内容。\n- **122–124**: 打印页面的结束 HTML 代码。\n\n# 第 9 章 运用所学知识——会议跟踪应用程序\n\
  \n- 引言\n- 设置\n- 代码\n\n## 引言\n此会议管理器应用程序旨在作为一种协调会议的简单方法。您可以指定实际的会议地点，也可以使用内置的虚拟房间通过电话会议或\
  \ Web 服务进行会议。您可以直接在会议中指定电话号码和 Web 地址。\n\n管理员通过管理界面设置用户和房间。完成设置后，用户就可以登录并开始安排会议。会议通过分步向导创建。向导会检查房间的可用性，仅允许使用当前会议时间未被安排的房间。已经安排了会议的用户被列为“忙碌”，但仍可以邀请参加会议。\n\
  \n一旦选定了会议时间、房间和用户，您就可以提供议程、会议电话和 Web 地址。会议确定后，将向所有参与者发送电子邮件通知。\n\n当用户登录时，可以安排新会议或查看他们当前的会议。点击列表中的会议名称将显示该会议的完整详情。如果用户安排了会议，可以取消该会议。一旦会议取消，指定的房间将释放，所有用户都会收到取消通知。此外，会议将从日程中移除。\n\
  \n### 简单界面\n会议管理器提供了一个简单的管理界面（如图 9-1 所示），允许管理员添加新用户或房间。一旦添加了用户或房间，即可用于安排会议。\n\n\
  ##### 图 9-1 管理界面\n![graphics/09fig01.jpg]\n\n## 设置\n设置会议管理器应用程序非常简单。只需安装下表指定的文件并使用提供的\
  \ SQL 设置您的数据库。记得更改代码中任何数据库和路径的参数以匹配您的系统。安装的总体布局如表 9-1 所示：\n\n### 9-1 购物车的目录结构\n\
  | 文件夹 | 包含 |\n| --- | --- |\n| 顶层 | `meeting.php`, `meeting_inc.php` |\n| admin\
  \ 目录 | `admin.php` |\n\n> a) 该目录必须经过保护！\n\n## 代码\n本节详细介绍了脚本涉及的代码。大部分主题已经涵盖，在介绍新主题时将提供额外的说明。\n\
  \n### meeting.sql\n`meeting.sql` 是用于创建应用程序数据库的 SQL 代码。\n\n####  9-1 meeting.sql\n\
  ```sql\n1.  CREATE TABLE users (\n2.    id INT NOT NULL,\n3.    first VARCHAR(32),\n\
  4.    last VARCHAR(32),\n5.    phone VARCHAR(16),\n6.    email VARCHAR(64),\n7.\
  \    pass VARCHAR(8),\n8.    PRIMARY KEY(id));\n9.\n10.  CREATE TABLE rooms (\n\
  11.    id INT NOT NULL,\n12.    name VARCHAR(32),\n13.    location VARCHAR(128),\n\
  14.    PRIMARY KEY(id));\n15.\n16.  INSERT INTO rooms VALUES(0,'Virtual Room','Virtual\
  \ Location');\n17.\n18.  CREATE TABLE meetings (\n19.    id INT NOT NULL,\n20. \
  \   name VARCHAR(64),\n21.    startdate DATETIME,\n22.    enddate DATETIME,\n23.\
  \    room INT,\n24.    agenda TEXT,\n25.    phone VARCHAR(16),\n26.    web VARCHAR(128),\n\
  27.    originator INT,\n28.    PRIMARY KEY(id));\n29.\n30.  CREATE TABLE meetingusers\
  \ (\n31.    meeting INT,\n32.    userid INT);\n```\n\n##### 9-1 meeting.sql 逐行解释\n\
