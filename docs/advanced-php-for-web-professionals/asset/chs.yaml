  \   ![上一节](img/#ch12lev1sec2.htm)   ![下一节](img/#ch12lev1sec4.htm) |\n\n***\n\n###\
  \ 创建基础 GTK 对象\n\nGTK+ 扩展是 PHP 的面向对象编程 (OOP) 扩展。你需要使用 OOP 语法和结构来使用 GTK+ 库。如果你还没有这样做，你可能想回到第\
  \ 1 章 复习关于 PHP 中 OOP 的材料。\n\n#### 创建你的第一个 PHPGTK 窗口\n\n\n\n\n\n在创建任何 PHPGTK 应用程序之前，你必须告诉\
  \ PHP 你想要使用哪种 GTK 库。由于 GTK 可以在 Windows 和多种版本的 UNIX 上运行，这留下了两种类型的库。Windows 使用动态链接库，也称为\
  \ DLLs。大多数基于 *nix 的操作系统使用 `.so` 库。由于你希望你的应用程序可以在不修改的情况下在两类操作系统上运行，你必须提供一种动态加载库的方法。这种方法的标准方法是：\n\
  \n```\nif (!class_exists('gtk')) { \nif (strtoupper(substr(PHP_OS, 0, 3)) == 'WIN')\n\
  \      dl('php_gtk.dll');\nelse\n      dl('php_gtk.so');\n}\n```\n\n## 注意\n如果你打算让脚本运行在\
  \ Linux 或 Windows 以外的平台（如果 PHPGTK 的后续版本增加了对这些其他平台的支持），那么你必须确保以上述相同的方式加载正确的 PHPGTK\
  \ 库。\n\n## 主窗口\n任何 PHPGTK 应用程序的核心部分都是主窗口。你创建的每个应用程序都应该有一个主窗口作为容器，你可以在其中放置其他组件（widgets）。\n\
  \nPHPGTK 中的基本窗口类是 `GtkWindow()`。你像这样创建一个新窗口对象：\n\n```\n$window = &new GtkWindow();\
  \ \n```\n\n现在你有了一个窗口，你必须提供一种销毁该窗口的方法。在大多数操作系统中，用户可以通过点击窗口右上角的“X”来销毁窗口（某些 Linux 桌面提供了不同的控制控件）。\n\
  \n当你点击 PHPGTK 应用程序中的“X”时，会有两个信号被发送到应用程序。这些信号是 `delete_event` 和 `destroy`。现在我们只关注\
  \ `destroy` 信号。\n\n信号通常是用户输入，而回调函数（callbacks）是你创建的用于响应用户输入并执行某些操作的函数。然而，你需要将信号连接到回调函数。要做到这一点，你使用\
  \ `connect()` 方法。为了将 destroy 信号连接到我们的 destroy 回调函数：\n\n```\n$window->connect('destroy','destroy');\
  \ \n```\n\n第一个参数是 PHPGTK 发送的信号名称。第二个参数是你想要在响应信号时调用的函数（回调）名称。为了简单起见，我们将该函数（回调）命名为\
  \ 'destroy'。\n\n```\nfunction destroy() { \nGtk::main_quit();\n}\n```\n\n`Gtk::main_quit()`\
  \ 是杀死应用程序的 PHPGTK 函数。\n\n现在我们创建了一个窗口，并为用户提供了移除窗口的方法。但我们仍然无法运行应用程序。PHPGTK 还需要完成另外两件事。首先，我们需要显示窗口。你通过调用\
  \ `show_all()` 方法来显示窗口：\n\n```\n$window->show_all(); \n```\n\n最后，你需要通过调用特殊的 PHPGTK\
  \ 函数 `main()` 来启动事件序列（轮询事件？）：\n\n```\nGtk::main(); \n```\n\n## 注意\n使用 PHPGTK 时，必须使用完整的\
  \ `<?php` 标签开始你的脚本。使用简写形式 `<?` 可能会导致 PHPGTK 仅仅将整个脚本输出到屏幕上，而不是创建一个 GTK 窗口。\n\n##\
  \ 完整脚本示例\n当我们将所有内容整合在一起时，你就会得到 `basic_window.php`。\n\n### 脚本 12-1 basic_window.php\n\
  ```\n1.  <?php\n 2.    if (!class_exists('gtk')) {\n 3.    if (strtoupper(substr(PHP_OS,\
  \ 0, 3)) == 'WIN')\n 4.      dl('php_gtk.dll');\n 5.    else\n 6.      dl('php_gtk.so');\n\
  \ 7.  }\n 8.  function destroy(){\n 9.    Gtk::main_quit();\n10. }\n11.   $window\
  \ = &new GtkWindow();\n12.   $window->connect('destroy','destroy');\n13.   $window->show_all();\n\
  14.  Gtk::main();\n```\n\n### 12-1. basic_window.php 逐行解释\n\n| 行 | 描述 |\n| --- |\
  \ --- |\n| 1 | 如果 'gtk' 类尚未定义， |\n| 2 | 如果。 |\n| 3 | 检查 PHP_OS 的前三个字符。 |\n| 4 |\
  \ 如果是 WIN，则加载 php_gtk.dll。 |\n| 5 | 否则， |\n| 6 | 加载 php_gtk.so。 |\n| 7 | 结束 if。\
  \ |\n| 8 | 定义 destroy() 函数： |\n| 9 | 调用 Gtk::main_quit()。 |\n| 10 | 结束函数。 |\n| 11\
  \ | 创建一个新的 GtkWindow 对象。 |\n| 12 | 将 destroy 信号连接到 destroy 回调。 |\n| 13 | 显示所有窗口。\
  \ |\n| 14 | 启动 Gtk 主循环。 |\n\n## 添加 GTK 按钮\n为了增强我们的 Hello World 程序，让我们添加一个按钮。\n\n\
  ### 脚本 12-2 hello.php\n```\n1.  <?php\n 2.    if (!class_exists('gtk')) {\n 3. \
  \   if (strtoupper(substr(PHP_OS, 0, 3)) == 'WIN')\n 4.      dl('php_gtk.dll');\n\
  \ 5.    else\n 6.      dl('php_gtk.so');\n 7.  }\n 8.  function destroy(){\n 9.\
  \    Gtk::main_quit();\n10. }\n11.  function hello(){\n12.    global $window;\n\
  13.    print \"Hello World!\\n\";\n14.    $destroy();\n15.  }\n16.  $window = &new\
  \ GtkWindow();\n17.  $window->connect('destroy','destroy');\n18.  $button = &new\
  \ GtkButton('Hello World!');\n19.  $button->connect('clicked', 'hello');\n20.  $window->add($button);\n\
  21.  $window->show_all();\n22.  Gtk::main();\n23.  ?>\n```\n\n### 图 12-3. hello.php\
  \ 在 Linux (Gnome)\n![graphics/12fig03.jpg](img/12fig03.jpg)\n\n### 脚本 12-2. hello.php\
  \ 逐行解释\n\n| 行 | 描述 |\n| --- | --- |\n| 2–7 | 与 basic_window.php 相同。 |\n| 8–10 |\
  \ 与 basic_window.php 相同。 |\n| 11–15 | 定义 hello()，它打印 \"Hello World!\" 并调用 destroy()。\
  \ |\n| 16–17 | 与 basic_window.php 相同。 |\n| 18 | 创建一个带有 \"Hello World!\" 标签的新 GtkButton。\
  \ |\n| 19 | 将按钮的 clicked 信号连接到 hello 函数。 |\n| 20 | 将按钮添加到窗口。 |\n| 21 | 显示所有窗口。 |\n\
  | 22 | 启动 Gtk 主循环。 |\n\n\n\n\n\n| 19 | 将按钮的 'clicked' 方法连接到 `hello()` 函数。 |\n| 20\
  \ | 使用 `add()` 方法将按钮添加到窗口中。 |\n| 21 | 对 `$window` 对象调用 `show_all()` 函数，以便显示对象内的所有内容。\
  \ |\n| 22 | 调用 `Gtk::main()` 方法运行脚本。 |\n\n#### 修改基础小部件的外观\n\n创建按钮和窗口的语法看起来非常相似。这是因为它们都是\
  \ GTK 小部件（widget）类。每个对象（按钮、窗口等）都有某些可用的方法——例如，`connect()` 方法。\n\n如果你运行 `hello.php`\
  \ 脚本，你会发现窗口尺寸非常小——事实上，它的 own 只和内部的按钮一样大。这是因为 PHP 在创建窗口时将其缩小到最小尺寸。我们可以通过一些方法来修改 `GtkWindow`\
  \ 小部件的默认外观。例如，如果你想为窗口设置默认大小，可以使用 `set_default_size($width, $height)` 方法：\n\n```\n\
  $window->set_default_size(200,200); \n```\n\n这将创建一个 200 像素乘 200 像素的窗口。你还可以设置窗口标题：\n\
  \n```\n$window->set_title(\"My PHPGTK APP\"); \n```\n\n图 12-4 显示了通过 `set_default_size()`\
  \ 和 `set_title()` 方法修改的窗口。\n\n##### 图 12-4. 使用属性方法修改的窗口（Linux 和 Windows）\n\n![graphics/12fig04.jpg](img/12fig04.jpg)\n\
  \n有很多可用方法可以影响 GTK 小部件的外观和行为。详情请参阅 [http://gtk.php.net] 上的这些方法的文档说明。\n\n#### 文本输入\n\
  \n如果不能向桌面应用程序插入数据，它将非常不利。GTK 提供了一个文本输入小部件，允许你向应用程序输入一行文本。创建一个文本输入字段：\n\n```\n$text1\
  \ = &new GtkEntry(); \n```\n\n如果没有某种方法为其标记，否则文本输入字段并没有真正的用处。这时 `GtkLabel` 就派上用场了：\n\
  \n```\n$label1 = &new GtkLabel(\"A Text Entry Field:\"); \n```\n\n现在我们已经有了新的文本输入字段和标签，我们需要将其放入窗口中。但这里有一个小问题。你不能直接向顶层窗口\
  \ `add()` 多个小部件。相反，你需要在窗口中放置一个框（box），然后将你的子对象添加到该框中。\n\n#### hbox 和 vbox\n\n有两种类型的框可以用于将你的小部件固定在主窗口的相应位置。它们是\
  \ `hbox`（水平）和 `vbox`（垂直）。正如名称所示，`hbox` 允许你将对象放入其中并使其对象水平对齐，而 `vbox` 允许你将对象放入其中并使其对象垂直对齐。由于我们想让文本输入字段和标签水平对齐（像普通应用程序那样），我们将创建一个\
  \ `hbox` 并将其添加到窗口中：\n\n```\n$box = &new GtkHBox();\n$window->add($box);\n```\n\n\
  `hbox` 和 `vbox` 小部件是特殊的容器，可以向其中添加多个小部件。要添加它们，你需要将小部件“打包”（pack）到框中：\n\n```\n$box->pack_start($label1,\
  \ false, 0);\n$box->pack_start($text1, false, 0);\n```\n\n#### pack_start\n\n`pack_start`\
  \ 方法允许你将小部件添加到框中。如果你将小部件打包到 `vbox`，`pack_start` 会从框的顶部添加小部件。每当你向框中打包另一个小部件时，前一个部件向下移动，新添加的小部件位于\
  \ `vbox` 的顶部。如果你将小部件打包到 `hbox`，`pack_start` 会从左侧添加小部件。每当你向框中打包一个新的小部件时，它会被放置在上一个对象的右侧。\n\
  \n`pack_start()` 方法接受四个参数：\n\n- 你正在打包的对象。\n- 如果调整框 尺寸，是否扩展该对象（true 或 false）。\n-\
  \ 对象是否应该填充其可用空间（true 或 false）。\n- 对象周围使用的内边距（padding）量（整数）。\n\n如果没有指定，使用的默认参数为 `true`、`true`,\
  \ `0`。这意味着扩展、填充且不使用内边距。让我们来看使用标签和文本输入的脚本。参见下方的 脚本 12-3，`text_entry.php`。示例请参见 图\
  \ 12-5。\n\n##### 脚本 12-3 text_entry.php\n\n```\n<?php\nif (!class_exists('gtk'))\
  \ {\n  if (strtoupper(substr(PHP_OS, 0, 3)) == 'WIN')\n    dl('php_gtk.dll');\n\
  \  else\n    dl('php_gtk.so');\n}\nfunction destroy(){\n  Gtk::main_quit();\n}\n\
  $window = &new GtkWindow();\n$window->connect('destroy', 'destroy');\n$text1 = &new\
  \ GtkEntry();\n$label1 = &new GtkLabel(\"A Text Entry Field:\");\n$box = &new GtkHBox();\n\
  $window->add($box);\n$box->pack_start($label1, false, 0);\n$box->pack_start($text1,\
  \ false, 0);\n$window->show_all();\nGtk::main();\n?>\n```\n\n\n\n\n\n```php\n1.\
  \  <?php\n 2.    if (!class_exists('gtk')) {\n 3.    if (strtoupper(substr(PHP_OS,\
  \ 0, 3)) == 'WIN')\n 4.      dl('php_gtk.dll');\n 5.    else\n 6.      dl('php_gtk.so');\n\
  \ 7.  }\n 8.  function destroy(){\n 9.    Gtk::main_quit();\n10.  }\n 11.  function\
  \ submit(){\n 12.    global $text1;\n 13.    $input = $text1->get_text();\n 14.\
  \    echo $input . \"\\n\";\n 15.    $text1->set_text('');\n 16.  }\n 17.  $window\
  \ = &new GtkWindow();\n 18.  $window->connect('destroy', 'destroy');\n 19.  $window->set_border_width(5);\n\
  \ 20.  $text1 = &new GtkEntry();\n 21.  $label1 = &new GtkLabel(\"A Text Entry Field\"\
  );\n 22.  $button1 = &new GtkButton('Submit Text!');\n 23.  $button1->connect('clicked',\
  \ 'submit');\n 24.  $box = &new GtkHBox();\n 25.  $window->add($box);\n 26.  $box->pack_start($label1,\
  \ false, false, 0);\n 27.  $box->pack_start($text1, false, false, 0);\n 28.  $box->pack_start($button1,\
  \ false, false, 0);\n 29.  $window->show_all();\n 30.  Gtk::main();\n 31.  ?>\n\
  ```\n\n### 图 12-6. text_submit.php\n\n![graphics/12fig06.jpg](img/12fig06.jpg)\n\
