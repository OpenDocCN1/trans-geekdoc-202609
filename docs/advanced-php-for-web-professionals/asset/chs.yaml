  \n### 触发错误\n\n有时，根据发生的情况触发自己的错误是非常用的。`trigger_error()` 函数的调用方式如下：\n\n```\ntrigger_error(message,\
  \ type);\n```\n\n`trigger_error()` 接受两个参数：\n\n*   $message— 描述错误的字符串。\n*   $type—\
  \ 错误类型，可以是以下之一：\n    *   E_USER\n    *   E_WARNING\n    *   E_NOTICE\n\n### 脚本 8-5\
  \ error\\_handler.php\n\n```\n1.  <?\n2.  error_reporting(E_ALL);\n3.  function\
  \ error_handler($number, $string, $file, $line) {\n4.    error_log(\"Error ($number)\
  \ on line $line in file $file. The error was \\\"$string\\\"\\n\", \n3, \"errors.txt\"\
  );\n5.  }\n6.  ini_set('display_errors',0);\n7.  set_error_handler(\"error_handler\"\
  );\n8.  $row = mysql_fetch_array($result);\n9.  ?>\n```\n\n### 脚本 8-5 error\\_handler.php\
