  \ | 结束页面的 PHP 和 HTML |\n\n***\n\n### 解析大文件\n\n上面的方法对于相对简单的文件效果良好，但如果你需要解析一个结构基本但有细细微差异的大文件呢？一种方法是使用\
  \ `ereg()` 函数^([\\[1\\]](#ch06lev1sec5.htm#ch06fn01)) 来寻找数据模式。\n\n> ^(\\[1\\]) 有关\
  \ `ereg()` 函数的细节请参阅 第 4 章。\n\n\n\n\n接下来的脚本将解析大型文本文件并将其内容存入数据库。该文件包含 789 道多选题，见于美国联邦航空管理局（FAA）私人飞行员笔试。\n\
  \n> [2] 这些问题不受版权保护，可以免费获取。\n\n该文档遵循基本结构，即带有编号的问题，后跟着三个可能的答案。某些问题引用了图表，而另一些问题引用了多个图表。脚本的目标是解析文本文件并将每个问题放入\
  \ `MySQL` 数据库，同时包含相应的答案选项。如果问题引用了某个或多张图表，脚本也会将其放入数据库。\n\n该文档可以在互联网上找到 [av-info.faa.gov/data/airmanknowledge/par.txt](http://av-info.faa.gov/data/airmanknowledge/par.txt)。该文档非常大，且某些问题的结构略有不同，特别是当提到引用的图表时。\n\
  \n该脚本获取问题并将所有信息放入数据库，以便更于管理数据并将其转换为其他应用程序可格式。\n\n此脚本使用了另一个名为 `preg_split()` 的正则表达式函数。`preg_split()`\
  \ 能够将字符串拆分为数组，类似于常用的 `explode()` 函数。它不是根据某个字符拆分字符串，而是根据正则表达式匹配来拆分字符串。\n\n在阅读脚本描述之前，请查看\
  \ [av-info.faa.gov/data/airmanknowledge/par.txt](http://av-info.faa.gov/data/airmanknowledge/par.txt)\
  \ 中的文件，以熟悉数据的通用结构。这样一切都会变得清晰得多。\n\n脚本由三个文件组成：\n\n*   `parsefile.sql`—— 创建和设置数据库所需的\
  \ SQL 语句。\n*   `parsefile.php`—— 解析文本文件并将数据放入数据库的 PHP 脚本。\n*   `displaydata.php`——\
  \ 从数据库读取数据并向用户显示数据的 PHP 脚本。此脚本仅是关于数据放入数据库后你可以进行操作的一个示例。\n\n### 脚本 6–3 parsefile.sql\n\
