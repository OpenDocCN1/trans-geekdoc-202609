  \ 函数向 `$image` 添加文本。 |\n| 10 | 将图像头信息发送到用户的浏览器。 |\n| 11 | 显示你创建的图像 `$image`。 |\n\
  | 12 | 从服务器内存中销毁图像，因为它已经发送到了浏览器。 |\n\n#### 在基础图像上添加文本\n\nGD 的另一个用处在于，你可以导入一张现有图像并作为新图像的基础进行处理。例如，你可以取一个空白的按钮图像，然后在其上叠加文本。通过这种方式，你只需要一个基础图像文件就可以创建出多个按钮。\n\
  \n要创建一个按钮，你需要使用两个新的 GD 函数。这些函数是 `ImageCreateFromPNG()` 和 `ImageTTFBbox()`。\n\n`ImageCreateFromPNG()`\
  \ 是一个非常简单的函数，它只需从现有的 PNG 文件创建一个新图像：\n\n```php\n$image = ImageCreateFromPNG(\"blank_blue_bttn.png\"\
  ); \n```\n\n然后，你可以像使用 `ImageCreate` 创建图像一样一样操作 `$image`。\n\n你可以通过分别使用 `ImageSX($image)`\
  \ 和 `ImageSY($image)` 函数，通过 `ImageCreateFromPNG()` 函数获取你创建的 `$image` 的长度和宽度；`SX`\
  \ 和 `SY` 分别代表图像 X 轴的大小（宽度）和 Y 轴的大小（高度）。\n\n`ImageTTFBbox()` 函数是一个相当复杂的函数，它返回文本周围边界框（bounding\
  \ box）的角点坐标。你提供文本的大小、角度、字体和文本字符串，该函数以数组的形式返回角点坐标。该数组允许你计算文本占用了多少空间。脚本的用法如下：\n\n\
  ```php\n$textbox = ImageTTFBbox($size, $angle, $font, $text); \n```\n\n[表 11-2]\
  \ 列出了 `ImageTTFBbox()` 函数返回的数组中每个元素的坐标。此外，[图 11-4] 提供了边界框中数组元素的图形化表示。\n\n##### 图\
  \ 11-4. 边界框坐标的数组元素\n\n![graphics/11fig04.gif](img/11fig04.gif)\n\n##### 表 11-2.\
  \ ImageTTFbox() 返回的坐标\n\n| 数组位置 | 边界框坐标 |\n| :--- | :--- |\n| 0 | 左下角的 X 坐标 |\n\
  | 1 | 左下角的 Y 坐标 |\n| 2 | 右下角的 X 坐标 |\n| 3 | 右下角的 Y 坐标 |\n| 4 | 右上角的 X 坐标 |\n| 5\
  \ | 右上角的 Y 坐标 |\n| 6 | 左上角的 X 坐标 |\n| 7 | 左上角的 Y 坐标 |\n\n接下来的脚本演示了如何获取空白按钮并在许多不同的按钮上添加文本。输出示例请参见\
  \ [图 11-5]。\n\n##### 脚本 11-3 gd_button.php\n\n```php\n<?\n$image = ImageCreateFromPNG(\"\
  blank_blue_bttn.png\"); \n$white = ImageColorallocate($image, 255, 255, 255);\n\
  $font = \"arial.ttf\";\n$size = 20;\n$angle = 0;\n$text = \"BUTTON\";\n$textbox\
  \ = ImageTTFBbox($size, $angle, $font, $text);\n$textbox_width = $textbox[2] - $textbox[0];\n\
  $textbox_height = $textbox[7] - $textbox[3];\n$x = (imagesx($image) - $textbox_width)\
  \ / 2;\n$y = (imagesy($image) - $textbox_height) / 2 + $textbox_height;\nheader(\"\
  Content-type: image/png\");\nimageTTFText($image, $size, $angle, $x, $y, $white,\
  \ $font, $text);\nimagepng($image);\nimagedestroy($image);\n?>\n```\n\n\n\n\n\n\
  你也可以使用 HTML `<<img>>` 标签在页面上调用多个按钮，并通过对 \"text\" 使用不同的值来引用同一个脚本，如下面的短脚本所示。示例输出请参见图\
  \ 11-7。\n\n### 脚本 11–4 buttons.html\n\n```\n1.  <html>\n 2.  <head>\n 3.    <title>Buttons!</title>\n\
  \ 4.  </head>\n 5.  <body><body>\n 6.  <img src=\"gd_button.php?text=HOME\"><br>\n\
  \ 7.  <img src=\"gd_button.php?text=GAMES\"><br>\n 8.  <img src=\"gd_button.php?text=NEWS\"\
  ><br>\n 9.  <img src=\"gd_button.php?text=LINKS\">\n10.  </body>\n11.  </html>\n\
  ```\n\n### 图 11-7. buttons.html\n\n![graphics/11fig07.jpg](img/11fig07.jpg)\n\n\
  ### 使用 GD 创建矩形\n\n除了文本和线条外，你还可以轻松使用 GD 创建矩形，可以是填充颜色的，也可以是不填充的（使用相同的参数调用 `ImageRectangle()`\
  \ 来创建不填充矩形）：\n\n```\nImageFilledRectangle($image, $x1coord, $y1coord, $x2coord,\
  \ $y2coord, $color); \n```\n\n`ImageRectangle()` 和 `ImageFilledRectangle()` 的参数如下：\n\
  \n* `$image`— 正在放置此矩形的图像的句柄。\n* `$x1coord`— 矩形左上角的 x 坐标。\n* `$y1coord`— 矩形左上角的 y\
  \ 坐标。\n* `$x2coord`— 矩形右下角的 x 坐标。\n* `$y2coord`— 矩形右下角的 y 坐标。\n* `$color`— 矩形的颜色。必须是之前分配给\
  \ `$image` 的颜色。\n\n矩形从左上角到右下角绘制。请记住，坐标 `0,0` 起于图像的左上角，而不是像数学绘图中那样从右下角开始。\n\n下一个脚本使用线条、文本和矩形来创建一个动态条形图。你可以将各种数值输入图表，并为图像指定尺寸和标签。图表会根据你输入的数值自动调整比例。图\
  \ 11-8 展示了该图表输入界面。\n\n### 脚本 11–5 gd_graph.php\n\n[[查看全宽视图]](&r=noccc&xmlid=0-13-008539-1/ch11lev1sec4#PLID13)\
  \ \n\n```\n1.  <?\n 2.  if(!isset($render)) {\n 3.          ?>\n 4.          <form\
  \ action=gd_chart.php method=post>\n 5.          <br>数值（用逗号分隔的数字）：\n 6.        \
  \  <br><textarea cols=\"40\" rows=\"4\" name=\"values_in\">50,100,150,75,23,55,200,135,63,103</textarea>\n\
  \ 7.          <br>标签（用逗号分隔的标签）：\n 8.          <br><textarea cols=\"40\" rows=\"\
  4\" name=\"labels_in\">Jan,Feb,Mar,Apr,May,Jun,Aug,Sep,Nov,Dec</textarea>\n 9. \
  \        <br>图像高度：<input type=\"text\" name=\"height\" value=\"500\">\n 10.    \
  \      <br>图像宽度：<input type=\"text\" name=\"width\" value=\"500\">\n 11.       \
  \   <br>纵轴标签：<input type=\"text\" name=\"vlabel\" value=\"产量\">\n 12.          <br>横轴标签：<input\
  \ type=\"text\" name=\"hlabel\" value=\"月份\">\n 13.          <br><input type=\"\
  submit\" name=\"render\" value=\"渲染图表\">\n 14.          </form>\n 15.          <?\n\
  \ 16.  else {\n 17.  $values = explode(\",\", $values_in);\n 18.  $labels = explode(\"\
  ,\", $labels_in);\n 19.  $xoffset = $width / 10;\n 20.  $yoffset = $height / 10;\n\
  \ 21.  /* 确定字体大小 */\n 22.  if (($width > 400) and ($height > 400)) {\n 23.     \
  \     $sm_font = 2;\n 24.          $md_font = 3;\n 25.          $lg_font = 4;\n\
  \ 26.  } else {\n 27.          $sm_font = 1;\n 28.          $md_font = 2;\n 29.\
  \          $lg_font = 2;\n 30.  }\n 31.  /* 创建基础图像 */\n 32.  $image = ImageCreate($width,\
  \ $height);\n 33.  /* 分配颜色 */\n 34.  $white = ImageColorAllocate($image, 235, 235,\
  \ 235);\n 35.  $blue = ImageColorAllocate($image, 0, 0, 255);\n 36.  $red = ImageColorAllocate($image,\
  \ 255, 0, 0);\n 37.  /* 查找数值中的最大值 */\n 38.  $greatest = 0;\n 39.  for($i = 0; $i\
  \ < count($values); $i++) {\n 40.          $values[$i] = trim($values[$i]);\n 41.\
  \          if($values[$i] > $greatest)\n 42.                  $greatest = $values[$i];\n\
  \ 43.  }\n 44.  /* 确定比例和间距 */\n 45.  $scale = ($height / $greatest) * .8;\n 46.\
  \  $h_spacing = floor(($width - $xoffset) / count($values)) / 2;\n 47.  $barwidth\
  \ = $h_spacing;\n 48.  /* 绘制条形、标签和数值 */\n 49.  $x = $xoffset + 5;\n 50.  for($i\
  \ = 0; $i < count($values); $i++) {\n 51.          $y = $height - ($values[$i] *\
  \ $scale);\n 52.          ImageFilledRectangle($image, $x, $y - $yoffset, $x + $barwidth,\
  \ $height - $yoffset, $red);\n 53.          ImageString ($image, $sm_font, $x, $y-$yoffset-12,\
  \ $values[$i], $blue);\n 54.          $labels[$i] = trim($labels[$i]);\n 55.   \
  \       ImageString ($image, $md_font, $x, $height - $yoffset + 2, $labels[$i],\
  \ $blue);\n 56.          $x+=($h_spacing * 2);\n 57.  }\n 58.  /* 确定刻度 */\n 59.\
  \  $ticks_every = \"1\";\n 60.  for($i = 1; $i < round(log10($greatest)); $i++)\
  \ {\n 61.          $ticks_every .= \"0\";\n 62.  }\n 63.  /* 绘制刻度和数字 */\n 64.  for($i\
  \ = 0; $i < $height - $yoffset; $i+= $ticks_every * $scale) {\n 65.          $y\
  \ = ($height - $yoffset) - $i;\n 66.          ImageLine($image, $xoffset / 2, $y,\
  \ $xoffset, $y, $blue);\n 67.          ImageLine($image, $xoffset + 5, $y, $width\
  \ + $xoffset, $y, $white);\n 68.          ImageString ($image, $sm_font, $xoffset\
  \ / 2, $y, $i / $scale , $blue);\n 69.  }\n 70.  /* 绘制图图的左侧和底部边缘 */\n 71.  ImageLine($image,\
  \ 0 + $xoffset, 0, $xoffset, $height - $yoffset, $blue);\n 72.  ImageLine($image,\
  \ 0 + $xoffset, $height - $yoffset, $width, $height - $yoffset, $blue);\n 73.  }\n\
  \ 74.  header (\"Content-type: image/png\");\n 75.  ImagePNG($image);\n 76.  ImageDestroy($image);\n\
  \ 77.  ?>\n```\n\n### 图 11-8. graph.php 提交值之前\n\n![graphics/11fig07.jpg](img/11fig07.jpg)\n\
  \n### 脚本 11-5 gd_graph.php 逐行解释\n\n| 行 | 描述 |\n| --- | --- |\n| 2 | 检查 `$render`\
  \ 变量是否设置。如果没有，执行 3–15 行，否则从 16 行到结束。 |\n| 3–15 | 输出一个标准的 HTML 表单以请求某些值。你可以指定：br>*\
  \ 条形图的数值，用逗号分隔。你应该为表单中的每个值准备一个标签。<br>* 图表的宽度和高度。<br>* 比例标签。<br>脚本输入了一些默认值进行测试。 |\n\
  | 17 | 将表单中输入的数值转换为数组，使用 `explode()` 函数并将数组赋值给 `$values` 变量。 |\n| 18 | 将表单中输入的标签转换为数组，使用\
  \ `explode()` 函数并将数组赋值给 `$labels` 变量。 |\n| 19 | 确定 x 轴偏移，它是图表总宽度的 1/10。该偏移为图表左侧留出了文本空间。1/10\
  \ 是一个适用于宽度大于 300 像素图表的任意数字。 |\n| 20 | 确定 y 轴偏移，它是图表总高度的 1/10。该偏移为图表底部留出了文本空间。 |\n\
  | 22–30 | 确定图表合适的字体大小。图表使用三种尺寸：小、中、大。如果图表小于 400x400，则使用较小的字体。否则使用较大的字体。 |\n| 32\
  \ | 使用从表单获取的宽度和高度创建基础图像。 |\n| 34–36 | 为图像分配三种颜色：白色、蓝色和红色。这里的白色（RGB: 235,235,235）实际上是浅灰色，以便图表从页面中脱颖而出。\
  \ |\n| 38 | 将变量 `$greatest` 初始化为 0。 |\n\n\n\n\n\n- **39–43**: 使用 `for` 循环遍历 `$values`\
  \ 数组并找到最大值。一旦确定了需要绘制的最大数值，我们就可以确定图表的比例。请注意，在第 40 行，脚本会修剪数值值中的任何空格。这是为了避免用户在表单中输入数值时，除了逗号外还使用了空格分隔数值而导致错误。\n\
  - **45**: 通过将最大值除以高度并乘以 80% 来确定图表的比例。这创建了一个比例，使得图上最大的条形能够占据高度的 80%。\n- **46**: 确定图表中每个条形的水平间距。计算方法是将宽度减去宽度偏移量（得到条形可用的总空间），四舍五入，然后除以需要绘制的数值个数，最后将该数字除以\
  \ 2，因为我们想要创建一个等距的空间与条形比例。\n- **47**: 确定条形的宽度。在这里将其设置为与间距相同，但你可能会发现需要根据特定的图表对其进行微调。如果你对其了修改，请考虑到上面的一行分配了一半的空间给间距。你可能也需要修改那一行。\n\
  - **49**: 初始化变量 `$x` 为偏移量加 5 像素。这允许第一个条形距离你分配给文本的边缘边缘 5 像素。\n- **50–57**: 创建一个 `for`\
  \ 循环遍历 `$values` 数组并在条形图上绘制条形。\n- **51**: 确定条形的基 y 坐标。这有点复杂，因为脚本会根据最大值的大小自动调整条形的显示比例。要确定基础\
  \ y 坐标，你需要用数值乘以比例的结果减去高度。如果数值为 10，那么它会被缩缩小为 8。然后你减去 `y offset`（用于底部文本留出的额外空间）和图像的总高度（因为\
  \ `GD` 库使用图像的左上角作为 `0,0` 点，而不是左下角）。脚本计算的是条形应该从图像**顶部**多远开始，而不是条形实际有多长（当然，那样会更简单，但\
  \ `GD` 库似乎不让你那样做）。\n- **52**: 使用 `ImageFilledRectangle()` 函数创建条形。前两个坐标参数（`$x` 和\
  \ `$y`）绘制矩形的左上角。后两个坐标参数（`$x + $barwidth` 和 `$height – $yoffset`）绘制矩形的右下角。\n- **53**:\
  \ 使用 `ImageString()` 函数在条形上方写入条形的数值。y 坐标列为 `$y – 12`，以便将数值写在条形本身上方 12 像素处。记住，脚本计算的是文本应该距离图像顶部多远，而不是距离条形顶部多远。\n\
  - **54**: 使用 `trim()` 函数修剪标签周围的任何空格。\n- **55**: 在条形底部写入当前条形的标签。注意 y 坐标是 `$height\
  \ – $yoffset + 2`。这会将标签放置在图像底部空白区域上方第 2 像素处。\n- **56**: 增加下一个 x 坐标的值，以便为条形之间留足够的空间。如果你想调整间距，除了第\
  \ 46 行和 47 行外，还需要修改此行。请注意，在大多数情况下，这里的编码方式应该正常工作。\n- **57**: 关闭 `for` 循环。\n- **59**:\
  \ 初始化变量 `$ticks_every`。\n- **60–62**: 创建一个 `for` 循环来确定条形上刻度线的比例。刻度线实际上是与图像背景颜色相同的线。它们绘制在条形上，使条形看起来像是等分的线段。由于你可能拥有几十或几千的数值，你可能不会自动希望每隔\
  \ 10 个单位就有一个刻度线。此处的 `for` 循环是确定刻度线之间间隔多少个“刻度”的一种简单方法。它获取最大值并计算该值的 `log10`。每当执行且值小于\
  \ `$i` 时，就会向 `$ticks_every` 函数中添加一个“0”。基本上，如果最大值在 1 到 316 之间，则每 10 个刻度有一条线（不一定是像素，因为你需要考虑缩放）。从\
  \ 316 到 3162，每 100 个刻度使用一个刻度线，以此此类推。这并不是精确的科学，但它能提供相当好的结果。\n- **64–69**: 创建一个 `for`\
  \ 循环在条形上绘制“刻度”标记，并在图表的 y 轴上根据 `$ticks_every` 定义的间隔间距绘制数字。\n- **65**: 计算刻度线的 y 坐标。\n\
  - **66**: 在偏移量左侧绘制一条短线。这条蓝色短线用作图表 y 轴显示的数值比例之间的分隔符。\n- **67**: 绘制一条横跨图像的长线，将条形分为等距易读的段。\n\
  - **68**: 在图表的 y 轴左侧显示“刻度”数字。\n- **69**: 关闭 `for` 循环。\n- **71**: 在图像底部绘制蓝色 x 轴线（条形与其标签之间）。\n\
  - **72**: 在图像右侧绘制蓝色 y 轴线（数字与条形之间）。\n- **74**: 显示 x 轴标签。默认情况下，它是“月份”。\n- **75**:\
  \ 显示 y 轴标签。默认情况下，它是“产量（千件）”。\n- **77**: 向用户的浏览器发送图像头信息。\n- **78**: 显示你创建的图像 `$image`。\n\
  - **79**: 从服务器内存中销毁图像，因为它已经发送到了浏览器。\n- **80**: 关闭在第 2 行开始的 `if` 语句。\n\n图 11-9 显示了脚本的示例输出。\n\
  \n\n\n\n\nPHPGTK 使用 `GTK+` 来绘制任何 GUI 应用程序所需的“小部件”（widgets）。组件包括滚动条、文本输入框和按钮等。当你启动几乎任何\
  \ Windows 应用程序（如 Web 浏览器）时，你看到的就是一组组件。\n\n组件需要被包含在某种框架中才能变得有用且符合逻辑。你不能简单地将许多按钮和文本框随机散布在屏幕上。为了解决这个问题，我们使用一种称为\
  \ `container`（容器）的特殊组件。容器是另一种结构，可以按照你认为最适合应用程序的方式来组织组件。例如，大多数应用程序顶部的菜单栏就是一个容器。\n\
  \n组件具有许多不同的属性，控制它们的外观和行为。每种类型的组件都有其独特的属性集，此外还包含与其他组件共有的属性。\n\n当组件被激活时，它们会向你的程序发送信号。组件激活的一个示例是用户点击按钮。一旦组件发送了信号，你通常用回调（callback）来响应该信号。回调基本上只是一个函数。某些信号最终会被\
  \ GTK 自动处理的回调处理（默认处理程序）。其他信号则执行你的函数之一（用户定义处理程序）。用户定义的函数是用 PHP 编写的。\n\n在编写本文文档时，PHPGTK\
  \ 的当前版本是 `0.5.1`，于 2002 年 4 月 26 日发布。尽管处于早期阶段，但 PHPGTK `0.5.1` 比原始的 `0.1` 版本有了巨大的改进。\n\
  \nPHPGTK 非常复杂。它基本上是将两种完整的语言结合在一起。这一章无法希望详细解释可用的许多方法和类，但我希望在空间允许范围内提供 PHPGTK 的总体概览。请访问\
  \ PHPGTK 网站 [`gtk.php.net`](http://gtk.php.net) 获取丰富信息！\n\n***\n\n| ![](img/pixel.gif)\
