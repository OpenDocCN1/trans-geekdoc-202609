  \ `add_form` 函数并让你向密码文件中添加用户名/密码组合。第二个链接用于在你添加用户后显示登录表单。 |\n\n*** *\n\n### 通过 IP\
  \ 地址进行用户身份验证\n\n在某些少数情况下，你可能希望限制某些 IP 地址访问某个页面或多个页面。这可能是因为你拥有一个具有公开可见网站的内部网络。你可能希望某些页面仅供内部网络中的某些机器查看。\n\
  \n或者你可能拥有自己的远程网站，并希望限制对某个页面或多个页面的访问，使得只有你通过静态 IP 地址访问这些页面。\n\n这些方法通过确定尝试查看页面的用户的\
  \ IP 地址并将其与一组值进行比对来工作。如果 IP 地址匹配，则可以查看页面。\n\n注意，这种方法可能会被 IP 欺骗或其他攻击手段欺骗，不应将其用于保护敏感信息，例如信用卡号、专有信息等。这是一种简单的方法，可以保护页面免受大多数上网用户的访问。\n\
  \n在使用此脚本时，你应该意识到你的计算机可能有多个 IP 地址，并且你的浏览器向脚本报告的那个 IP 可能与你尝试进行验证的 IP 不相同。当浏览器和 Web\
  \ 服务器位于同一台机器时，情况尤为如此，你在测试脚本时可能会遇到这种情况。\n\n例如，计算机有一个默认的本地 IP 地址 `127.0.0.1`，也称为 \"\
  localhost\"。当我启动 Web 服务器并输入 `http://localhost` 时，我的浏览器会告诉脚本我位于 IP 地址 `127.0.0.1`。然而，我电脑上的\
  \ Web 浏览器也运行在 IP 地址 `192.168.0.1`（一个用于内部网络的 IP 地址）。如果我输入 IP 地址 `192.168.0.1`，我的\
  \ Web 浏览器报告我位于 `192.168.0.1`，但脚本只接受 `127.0.0.1` 的 IP 地址。\n\n#### 脚本 7-3 IP_authentication.php\n\
  \n```php\nphp\n$accept = array(\"127\", \"0\", \"1\");\n$remote = explode(\".\"\
  , $_REMOTE_ADDR);\n$match = 1;\nfor($i = 0; $i < sizeof($accept); $i++) {\n  if($remote[$i]\
  \ != $accept[$i]) {\n    $match = 0;\n  }\n}\nif($match) {\n  echo \"<h2>Access\
  \ Granted</h2>\";\n} else {\n  echo \"<h2>Access Forbidden</h2>\";\n}\n?>\n```\n\
  \n##### 脚本 7-3 IP_authentication.php 逐行说明\n\n| 行 | 描述 |\n| --- | --- |\n| 1 | 定义允许查看页面的\
  \ IP 地址数组。数组必须至少一项。 |\n| 2 | 通过分解 `$_REMOTE_ADDR` 变量根据用户的 IP 地址创建一个数字数组。 |\n| 3\
  \ | 定义变量 `$match` 并将其设置为 true (1)。 |\n| 4–9 | 遍历接受 IP 地址数组。 |\n| 5 | 比较接受的 IP 段与用户的\
  \ IP 段。 |\n| 6 | 如果 IP 段不匹配，则将 `$match` 变量设置为 false (0)。 |\n| 7 | 关闭 if 语句。 |\n\
  | 9 | 关闭 for 循环。 |\n| 10–11 | 如果 `$match` 为 true，则允许访问并向用户打印消息。这就是你展示受保护内容的地方。 |\n\
  | 12–14 | 如果 `$match` 为 false (0)，则打印消息告诉用户他们无法访问该页面并退出脚本。 |\n| 15 | 关闭第 10 行开始的\
  \ if 语句。 |\n\n你可以通过向数组添加更多或更少的项目来限制子网。例如：`array(\"192\",\"168\",\"0\",\"1\")` 将访问页面的用户限制在\
  \ IP 地址 `192.168.0.1`。`array(\"192\",\"168\",\"0\")` 将访问页面的用户限制在 IP 范围 `192.168.0.1`\
  \ 到 `.255`。`array(\"192\")` 允许任何以 `192` 开头的 IP 用户查看页面。这并不实用，但它是可以运行的！\n\n\n\n\n\
  PHP 对基本的“HTTP 身份验证”提供了一些内置支持。HTTP 身份验证是这类身份验证：浏览器会弹出一个小窗口提示你输入用户名和密码。图 7-2 和 图 7-3\
  \ 分别显示了 Internet Explorer 和 Linux 版 Mozilla 中的 HTTP 身份验证窗口。HTTP 身份验证取决于服务器，最常见的例子是\
  \ Apache 的 HTTP 身份验证方法。这里描述的方法假设你使用的是 Apache 服务器。\n\n### 图 7-2. Internet Explorer\
  \ 中的 HTTP 身份验证登录窗口\n\n![graphics/07fig02.jpg](img/07fig02.jpg)\n\n### 图 7-3. Linux\
  \ 上 Mozilla 中的 HTTP 身份验证窗口\n\n![graphics/07fig03.jpg](img/07fig03.jpg)\n\n通常，Apache\
  \ 下的 HTTP 身份验证方法定义在 `.htaccess` 文件中`.htaccess` 文件通常限制整个目录。然而，PHP 提供了一种使用基于 Apache\
  \ 的 HTTP 身份验证的方法，而无需为同类型的身份验证定义 `.htaccess` 文件。此外，你还可以轻松地按页面使用 PHP 的 HTTP 身份验证方法。\n\
  \n> ^(\\[1\\]) 详细信息请访问 [`httpd.apache.org/docs/howto/auth.html`](http://httpd.apache.org/docs/howto/auth.html)。\n\
  \n使用 PHP 方法，你还可以使用自己的密码方案。在 Apache 下，你通常将加密后的密码放在密码文件中（通常称为 `.htpasswd`）。使用 PHP\
  \ 方法，你可以将密码放在文件、数据库或任何其他方法中。你还可以使用任何你想要的加密方案，而 Apache 仅限于 UNIX 加密密码、其自格式的 MD5 密码或明文。\n\
  \n然而，如果用户忘记了密码，你无法将密码发送给他们，因为你只知道加密后的版本。你必须重置密码，或者提供一个密码提示，帮助用户记住他们用的是什么密码。关于这一点，将在本章稍后部分进行详细介绍。\n\
  \n本章中的下一个脚本详细介绍了如何配合 Apache 服务器使用 PHP 的 HTTP 身份验证方法。该脚本还允许你使用通过 `crypt()` 函数加密的密码（这些密码是可的，可以与\
  \ Apache 默认的 HTTP 身份验证方法配合使用），或使用基础 PHP `md5()` 函数加密密码。如果你已经有多个使用 MD5 加密密码的应用程序，后者选项非常有用。\n\
  \n### 脚本 7-4 http_authentication.php\n\n[[查看全屏]]&r=noccc&xmlid=0-13-008539-1/ch07lev1sec5#PLID0)\
  \ \n\n```\n1.  <?\n 2.  function check_pass($login, $password, $mode) {\n 3.   \
  \ global $password_file;\n 4.    if(!$fh = fopen($password_file, \"r\")) { die(\"\
  <P>Could Not Open Password File\"); }\n 5.    $match = 0;\n 6.    while(!feof($fh))\
  \ {\n 7.      $line = fgets($fh, 4096);\n 8.      $from_file = explode(\":\", $line);\n\
  \ 9.      if($from_file[0] == $login) {\n10.        if($mode == \"crypt\"){\n11.\
  \          $salt = substr($from_file[1],0,2);\n12.          $user_pass = crypt($password,$salt);\n\
  13.        } elseif ($mode == \"md5\") {\n14.          $user_pass = md5($password);\n\
  15.        }\n 16.        if(rtrim($from_file[1]) == $user_pass) {\n17.        \
  \  $match = 1;\n18.          break;\n 19.       }\n 20.     }\n 21.   }\n 22.  \
  \ if($match) {\n 23.     return 1;\n 24.   } else {\n 25.     return 0;\n 26.  \
  \ }\n 27.   fclose($fh);\n 28.  }\n 29.  function authenticate() {\n 30.    Header(\"\
  WWW-Authenticate: Basic realm=\\\"RESTRICTED ACCESS\\\"\");\n 31.    Header(\"HTTP/1.0\
  \ 401 Unauthorized\");\n 32.    echo (\"<h1>INVALID USERNAME OR PASSWORD. ACCESS\
  \ DENIED<h1>\");\n 33.    exit;\n 34.  }\n 35.  /*** MAIN ***/\n 36.  //select md5\
  \ or crypt for $mode. md5 is for md5 encoded passwords, crypt is for \npasswords\
  \ encoded using apache's httpasswd\n 37.  $mode = \"md5\";\n 38.  $password_file\
  \ = \"C:/apache/passwords/pass.txt\";\n 39.  if (!isset($PHP_AUTH_USER)) {\n 40.\
  \    authenticate();\n 41.  } else {\n 42.    if(check_pass($PHP_AUTH_USER, $PHP_AUTH_PW,\
  \ $mode)) {\n 43.      ?>\n 44.      <h1>ACCEPTED</h1>\n 45.      <?\n 46.    }\
  \ else {\n 47.    authenticate();\n 48.    }\n```\n\n\n\n\n| 36 | 在脚本中添加一条注释，说明\
  \ `$mode` 变量的性质。 |\n| 37 | 为 `$mode` 变量赋值 `\"md5\"`（如果你的密码使用 `crypt()` 函数进行加密，则赋值为\
  \ `\"crypt\"`）。 |\n| 38 | 将密码文件的位置赋值给 `$password_file` 变量。 |\n| 39 | 检查全局变量 `$PHP_AUTH_USER`\
  \ 是否已设置。`$PHP_AUTH_USER` 是用于 HTTP 身份验证的特殊 PHP 变量。当用户使用 HTTP 身份验证窗口登录时，就会获取该变量。 |\n\
  | 40 | 如果 `$PHP_AUTH_USER` 变量未设置，则执行 `authenticate()` 函数。 |\n| 41–42 | 如果设置了 `$PHP_AUTH_USER`\
  \ ，则使用 `$PHP_AUTH_USER`、`$PHP_AUTH_PW` 和 `$mode` 变量作为参数执行 `check_pass()` 函数。`$PHP_AUTH_PW`\
  \ 变量是从 HTTP 身份验证登录窗口获取的特殊 PHP 全局变量。 |\n| 43–45 | 如果 `check_pass()` 函数返回真 (1)，则在屏幕上打印\
  \ `\"ACCEPTED\"`。你通常会在此处提供受保护的内容。 |\n| 46–48 | 如果 `check_pass()` 函数返回假，则再次执行 `authenticate()`\
  \ 函数。用户有三次机会正确输入用户名和密码。第三次失败后，脚本将返回第 31 和第 32 行。 |\n| 49 | 关闭第 39 行开始的 if 语句。 |\n\
  | 50 | 结束脚本。 |\n\n### 通过数据库查询验证用户\n\n对于基于数据库的网站，最常用的身份验证方法是使用数据库。既然你可以随时利用 SQL 数据库的快速和方便，为什么还要费精力使用笨拙的文本文件呢？\n\
  \n基于数据库的身份验证可以使用与基于文件的验证相同的功能，例如 `md5()` 或 `crypt()` 加密。用户名和密码存储在数据库的表中。你还可以在此表中存储其他信息，例如电子邮件地址或姓名的，正如你在第\
  \ 5 章的示例程序看到的那样。\n\n接下来的脚本提供了一种使用数据库验证用户身份的基础方法。它使用明文密码，但你可以很容易利用本章之前脚本中的技术来包含加密密码。\n\
  \n#### 脚本 7-5 DB_authenticate.php\n\n```\n1.  <?\n 2.\n3.  /* SQL REQUIRED FOR THIS\
  \ SCRIPT *****\n 4.   create table users (\n 5.    id INT NOT NULL,\n 6.    username\
  \ VARCHAR(16),\n 7.    password VARCHAR(8),\n 8.    primary key(id));\n 9.  *****/\n\
  10.\n11.  function connect() {\n12.    if(!$db = @mssql_pconnect(\"localhost\",\"\
  mssqluser\",\"password\")){\n13.      print(\"<h1>Cannot Connect to the DB!</h1>\\\
  n\");\n14.      return 0;\n15.    } else {\n16.      mssql_select_db(\"php\", $db);\n\
  17.      return 1;\n18.    }\n19.  }\n20.\n21.  function check_user($user, $password)\
  \ {\n22.    if(connect()) {\n23.      $password = substr($password, 0, 8);\n24.\
  \      $sql = \"select * from users where username = '$user' and password = '$password'\"\
  ;\n25.      $result = mssql_query($sql);\n26.      if (mssql_num_rows($result) ==\
  \ 1) {\n27.        setcookie(\"user\",$user);\n28.        setcookie(\"password\"\
  ,$password);\n29.        return 1;\n30.      } else {\n31.        ?>\n32.      \
  \  <h3>Sorry, you are not authorized!</h3>\n33.        <?\n34.        return 0;\n\
  35.      }\n36.    }\n37.  }\n38.\n39.  /***** MAIN *****/\n40.  if(!isset($user)\
  \ or !check_user($user, $password)) {\n41.    ?>\n42.    <h1>You must log in to\
  \ view this page</h1>\n43.    <form action = \"DB_authenticate.php\" method=\"post\"\
  >\n44.    <P>Username: <input type=\"text\" name=\"user\"><br>\n45.    Password:\
  \ <input type=\"password\" name=\"password\"><br>\n46.    <input type=\"submit\"\
  \ name=\"submit\">\n47.    </form>\n48.    ?>\n49.  } else {\n50.    ?>\n51.   \
  \ <h1>Authorized!</h1>\n52.    <?\n53.  }\n```\n\n#### 脚本 7-5 DB_authenticate.php\
  \ 逐行解释\n\n| 行号 | 说明 |\n| :--- | :--- |\n| 3–9 | 此脚本所需的 SQL ***** |\n| 11–19 | 创建函数\
  \ `connect()`。该函数尝试连接到数据库。如果连接成功，则继续到第 22 行。否则，跳转到第 36 行（即函数的结束）。 |\n| 21–37 | 创建函数\
  \ `check_user($user, $password)`，该函数根据数据库检查输入的用户名和密码。该函数接收参数 `$user` 和 `$password`，均由用户输入。\
  \ |\n| 22 | 使用 `connect()` 函数尝试连接数据库。如果连接成功，则继续到第 23 行。 |\n| 23 | 修改输入的密码以匹配数据库使用的格式。在此例中，脚本将密码截断为\
  \ 8 位。如果你在数据库中存储了加密密码，此处可以使用 `md5()` 或 `crypt()` 函数之一。 |\n| 24 | 生成一条 SQL 语句，从 \"\
  users\" 表中与用户名和密码匹配的行。 |\n| 25 | 执行 SQL 查询并将结果赋值给变量 `$result`。 |\n| 26 | 检查查询结果是否恰好一行，因为用户名应该是唯一的（你没有在数据库中放入重复的用户名吧？）\
  \ |\n| 27–28 | 如果结果恰好有一行，意味着输入的用户名和密码与数据库中的匹配，则在用户的浏览器中设置会话 Cookie，以便他们在访问受保护页面期间保持“登录”状态。\
  \ |\n| 29 | 返回 1，因为验证成功。 |\n| 30–35 | 如果结果不是恰好一行，则输入的用户名和密码与数据库中的任何项都不匹配。打印错误信息并向调用程序返回假。\
  \ |\n| 36 | 关闭第 22 行开始的 if 语句。 |\n| 37 | 结束函数定义。 |\n| 39 | 开始主程序。 |\n| 40–48 | 检查\
  \ `$user` 变量是否设置，或者通过 `check_user()` 函数检查输入的用户名和密码是否与数据库中的项匹配。如果 `$user` 变量未设置，说明当前用户尚未尝试登录。如果\
  \ `$user` 变量已设置但 `check_user()` 函数返回假，则说明用户输入了错误的密码。在任何情况下，都打印登录表单以便用户输入正确的用户名和密码。\
  \ |\n\n\n\n\n\n| 49–53 || 如果脚本执行到此处，说明 `$user` 变量已经设置，且 `check_user()` 返回了真值。这必须是一个有效用户！显示一条注释告诉用户他们已授权。在此处，你将显示你的受保护内容。\
  \ |\n\n## 第 8 章 错误管理\n\n### 本章内容\n\n*   概述\n*   错误报告\n\n### 概述\n\nBug 是程序员日常生活中不可或缺的一部分。我们都会在某个时候漏掉一个分号或右括号。有时，我们会拼错变量名，并纳闷为什么本该显示在屏幕上的值值一直是空白的。其他时候，你可能会怀疑数据库服务器上潜伏着什么“小鬼”，因为数据没有按照你预期的方式存入（或取出）。你曾多少次反复查看某段代码，并纳闷你的程序到底为什么运行不通？\n\
  \n有些 Bug——那些好对付的、不介意被消灭的 Bug——会通过 PHP 解析器立即告诉你它们的存在。例如，诸如无处不在的“Parse error”（解析错误）或偶尔出现的“Warning:\
  \ Division by zero”（警告：除以零）让你知道它们发生在哪一行。修复它们对你来说很容易：只需打开脚本，在这里添加一个分号，在那个处修改变量的拼写，就可以继续工作了。\n\
  \n遗憾的是，用户并没有这种待遇。你是否曾在某个在线购物网站上花费了一个小时左右，仔细为自己挑选了一些精美的装备，并经过漫长而艰巨的多页表单来提供地址和信用卡信息，最后点击了那个闪亮的提交按钮，结果页面只用普通字体显示了一句“Script\
  \ Error—Database Connection Failed On Line 193”（脚本错误——第 193 行数据库连接失败），别无他物？你刚刚给这些人提供了信用卡号，而当他们的脚本崩溃时，你看到的只有“Script\
  \ Error……”。\n\n更好的网站、更智能的网站——也就是说，你的网站——不应该这样做。如果发生了错误，至少应该告知用户出现了一点问题并且已经通知了管理员。也许甚至可以有一条注释说明订单已处理（或未处理）。你想让你网站的用户遭受那些无法提供他们任何信息的丑陋错误信息吗？当然不想。\n\
  \n此外，错误可能会显示出对试图破解你网站的恶意用户有用的信息。错误通常会显示文件路径、数据库服务器信息以及可能危及你网站安全的信息。\n\n本章解释了 PHP\
  \ 的错误处理和日志函数。\n\n### 错误报告\n\n#### PHP 中的错误类型\n\n在我们处理你网站上的丑陋错误信息之前，你需要了解不同类型的错误。PHP4\
  \ 可以产生 11 种不同的错误，如下所示表 8-1 所示（注意致命错误会停止脚本执行）：\n\n##### 表 8-1. PHP 错误类型\n\n| 名称 (NAME)\
  \ | 值 (VALUE) | 描述 (DESCRIPTION) |\n| --- | --- | --- |\n| `E_ERROR` | 1 | 运行时发生的致命错误。\
  \ |\n| `E_WARNING` | 2 | 运行时发生的非致命错误（例如，脚本无法连接到 MySQL）。 |\n| `E_PARSE` | 4 | 编译时因语法无效引起的错误。\
  \ |\n| `E_NOTICE` | 8 | 非致命的“通知”。不完全是错误，但提示你可能正在做某些不想做的事，例如将数字除以零。 |\n| `E_CORE_ERROR`\
  \ | 16 | PHP 引擎启动时发生的致命错误。发生此错误时你无法运行任何 PHP 脚本。 |\n| `E_CORE_WARNING` | 32 | PHP\
  \ 引擎启动时发生的非致命错误。 |\n| `E_COMPILE_ERROR` | 64 | 脚本编译时发生的致命错误。 |\n| `E_COMPILE_WARNING`\
  \ | 128 | 脚本编译时发生的非致命错误。 |\n| `E_USER_ERROR` | 256 | 用户生成的致命错误。与 `E_ERROR` 相同，但由\
  \ PHP 抛出。 |\n| `E_USER_WARNING` | 512 | 用户生成的非致命错误。与 `E_WARNING` 相同，但由 PHP 抛出。 |\n\
  | `E_USER_NOTICE` | 1024 | 用户生成的通知。与 `E_NOTICE` 相同，但由 PHP 抛出。 |\n| `E_ALL` | 2047\
  \ | 所有错误的汇总。 |\n\n在所有这些错误中，涉及到报告和日志时，你应该主要关注的是这些：\n\n*   `E_WARNING`\n*   `E_NOTICE`\n\
  *   `E_USER_ERROR`\n*   `E_USER_WARNING`\n*   `E_USER_NOTICE`\n\n其他发生的错误通常会导致脚本停止执行。\n\
  \n#### php.ini 中的错误报告设置\n\n| 旁注 |\n| --- |\n| 此信息适用于 PHP 4 及更高版本。这些设置对 PHP 3 版本不起作用。\
  \ |\n\n你在编写代码时看到那些“丑陋”错误的原因是 PHP 默认设置为显示所有错误（E\\_ALL），但除了 PHP 生成的通知（E\\_NOTICE）。打开你的\
  \ php.ini 文件并滚动到“Error handling and logging”（错误处理和日志）部分。在所有注释的末尾，你应该看到类似下面的一行：\n\
  \n```\nerror_reporting = E_ALL & ~E_NOTICE\n```\n\n这是默认的错误报告设置。它使用位运算符编写，简单翻译为“错误报告使用所有且非\
  \ E\\_NOTICE”。你也可以写成如下形式（注意我们去掉了 E\\_NOTICE）：\n\n```\nerror_reporting = E_ERROR\
  \ | E_WARNING | E_PARSE | E_CORE_ERROR | E_CORE_WARNING | \nE_COMPILE_ERROR | E_COMPILE_WARNING\
  \ | E_USER_ERROR | E_USER_WARNING | E_USER_NOTICE \n```\n\n然而，由于你是一个 PHP 开发者，在开发应用程序时你真的应该将此行设置为如下：\n\
  \n```\nerror_reporting = E_ALL \n```\n\n你想看到脚本产生的所有错误。你会惊讶于自己可能使用了多少未初始化的变量。\n\n\
  #### error\\_reporting()\n\n`error_reporting()` 函数允许你覆盖 php.ini 中使用的默认错误报告设置：\n\n\
  ```\nerror_reporting(settings); \n```\n\n\n\n\n\n`error_reporting` 函数接收一个参数，该参数可以是一个列出你想要使用的错误报告设置名称的字符串（通过位运算符分隔），也可以是一个你想要使用的值之和的整数。例如：\n\
  \n```php\nerror_reporting(10); \n```\n\n它等同于：\n\n```php\nerror_reporting(\"E_WARNING\
  \ | E_NOTICE\"); \n```\n\n第一种版本更容易输入，但第二种版本更详尽。此外，你可以从 `E_ALL` 值（2047）中减去某些值来使用“除……之外的所有项”报告。下面的示例允许你显示除\
  \ `E_NOTICE` (2047 - 8) 之外的所有错误 (`E_ALL`)：\n\n```php\nerror_reporting(2039); \n\
  ```\n\n如果你不想报告任何错误，可以简单地使用：\n\n```php\nerror_reporting(0); \n```\n\n这会停止 PHP 在屏幕上显示由\
  \ `E_WARNING`、`E_NOTICE` 或任何用户抛出的警告引起的错误消息。请记住，任何其他警告都是由 PHP 自动抛出的，因为这意味着脚本本身真的出了问题（解析错误），或者服务器本身真的出了问题。\n\
  \n如果错误导致脚本无法编译（例如解析错误），你仍然可能会遇到问题。在这种情况下，你的脚本没有任何部分会被执行，且 `error_reporting()` 变量也不会运行。当发生这种情况时，PHP\
  \ 将使用其 `php.ini` 中的错误报告设置。\n\n### php.ini 设置：display_errors\n\n此外，还有另一个设置可以防止错误消息显示在用户的浏览器上。此设置——`display_errors`\
  \ 可以在 `php.ini` 中找到。如果你想确保错误绝不会显示在屏幕上，可以在你的 `php.ini` 文件中将此设置改为 \"0\"。在开发应用程序时，你应该将此设置保留为\
  \ \"1\" 或 \"On\"。你也可以使用 `ini_set()` 函数按文件更改 `display_errors` 设置。`ini_set()` 函数允许你更改当前脚本的\
  \ `php.ini` 文件设置。例如，如果你已经在 `php.ini` 文件中关闭了 `display_errors`，你可以使用以下代码开启它来调试你的脚本，这等同于\
  \ `php.ini` 中的 `display_errors = On`：\n\n```php\nini_set(\"display_errors\",1);\
  \ \n```\n\n记住，如果你的脚本遇到导致无法执行的错误，那么 PHP 将使用它在 `php.ini` 中找到的设置，无论你在脚本中指定了什么。\n\n\
  ### 开发和测试的 php.ini 设置\n\n在开发和测试脚本时，你应该在 `php.ini` 文件中使用以下设置：\n\n```ini\nerror_reporting\
  \ = E_ALL \ndisplay_errors = 1\n```\n\n这允许你显示所有错误并获取 PHP 关于你脚本的所有信息。对于生产环境网站，你可能希望将\
  \ `php.ini` 文件设置为完全关闭任何错误显示：\n\n```ini\ndisplay_errors = 0 \n```\n\n接下来的脚本演示了如何使用不同的错误报告设置报告警告和通知。\n\
  \n#### 脚本 8-1 error_reporting.php\n\n```\n1.  <?\n 2.  define(\"EVERYTHING\",E_ALL);\n\
  \ 3.  define(\"NO_NOTICE\",(E_ALL &~E_NOTICE));\n 4.  define(\"NO_NOTICE_OR_WARN\"\
  ,(E_ALL &~(E_NOTICE | E_WARNING)));\n 5.  $error_level = array(EVERYTHING,NO_NOTICE,NO_NOTICE_OR_WARN);\n\
  \ 6.  for($i = 0; $i < sizeof($error_level); $i++) {\n 7.    error_reporting($error_level[$i]);\n\
  \ 8.    echo \"<h3>Error Reporting Set To \" . $error_level[$i] . \"</h3>\";\n 9.\
  \    echo $uninitialized;\n10.    $connect = mysql_connect();\n 11.    echo \"<hr>\"\
  ;\n12.  }\n13.  ?>\n14.  <?\n15.  define(\"EVERYTHING\",E_ALL);\n```\n\n#### 脚本\
  \ 8-1 error_reporting.php 逐行解释\n\n| 行号 | 描述 |\n| --- | --- |\n| 2–4 | 在脚本中定义一些命名常量。我们定义这些常量是因为我们想使用一些自定义的错误报告选项，如第\
  \ 3 和第 4 行所示。 |\n| 5 | 创建之前几行定义的错误报告值的数组。 |\n| 6–12 | 创建一个 for 循环来遍历数组中的值。 |\n|\
  \ 7 | 将错误报告值更改为数组中的当前值。`error_reporting` 函数不能接受位运算语句作为参数，因此我们使用在第 3 和第 4 行创建的值。\
  \ |\n| 8 | 显示一个简短通知，说明正在使用哪个错误报告值。我们在第 2–4 行中定义的常量实际上是现有常量的重新定义，这些常量随后由 PHP 定义为错误报告级别的相应值。因此，屏幕上显示的值是数值。\
  \ |\n| 9 | 打印未初始化变量的值。如果错误报告设置为显示 `E_USER_NOTICE`，则此处应该显示一个警告 (`E_USER_NOTICE`)。\
  \ |\n| 10 | 尝试连接 MySQL 数据库。如果错误报告设置为显示 `E_USER_NOTICE`，这将产生一个警告消息。 |\n| 12 | 关闭\
  \ for 循环。 |\n\n*(注：原文中第 9-12 行的描述存在碎片化，已根据脚本上下文进行了整理。）*\n\n### PHP 中的日志类型\n\n`error_reporting`\
  \ 函数接收一个参数，该参数可以是一个列出你想要使用的错误报告设置名称的字符串（通过位运算符分隔），也可以是一个你想要使用的值之和。\n\n| 类型 | 描述\
  \ |\n| --- | --- |\n| 0 | 根据 `php.ini` 中的 `error_log` 设置，消息将发送到系统特定的文件。如果没有设置，它将出现在错误日志。\
  \ |\n| 1 | 消息发送到 `php.ini` 中指定的电子邮件地址。这是唯一使用 `headers` 参数的类型。 |\n| 2 | 消息发送到调试服务器。必须使用\
  \ `destination` 参数来指定调试服务器的主名或 IP 地址。 |\n| 3 | 消息写入 `destination` 指定的文件末尾。如果 `destination`\
  \ 文件不存在，PHP 会尝试创建它。你必须正确设置权限，以便 PHP 可以写入指定的目录。 |\n\n#### 脚本 8-2 error_logging.php\n\
  \n```php\n1.  <?\n2.  echo \"<p>Sending Error To Apache Error Log.\";\n3.  error_log(\"\
  Test Error Message!\",0);\n4.  echo \"<p>Sending Error To Email.\";\n5.  error_log(\"\
  Test Error Message!\",1,\"admin@example.com\",\"FROM: WEB ERROR LOG \n<error@example.com>\"\
  );\n6.  echo \"<p>Sending Error to File.\";\n7.  error_log(\"Test Error Message!\\\
  r\\n\",3,\"errors.txt\");\n8.  ?>\n```\n\n\n\n\n\n| 2 || 在屏幕上显示消息，说明错误正在发送到 Apache\
  \ 错误日志。 |\n\n| 3 || 将错误发送到 Apache 错误日志。 |\n\n| 4 || 在屏幕上显示消息，说明错误正在发送到一个电子邮件地址。\
  \ |\n\n| 5 || 将错误发送到电子邮件地址。将 `admin@example.com` 替换为您的电子邮件地址。 |\n\n| 6 || 在屏幕上显示消息，说明错误正在发送到文件。\
  \ |\n\n| 7 || 将错误发送到该文件。如果文件不存在，PHP 将尝试在当前目录中创建它。 |\n\n## 自定义错误处理器\n\nPHP 的默认错误处理器很有用，但它们的作用仅仅是通知你发生了错误。幸运的是，PHP\
  \ 允许你使用自己自定义的错误处理器，这样你就可以根据发生的错误类型来采取特定操作。允许你使用自定义错误处理器的函数是 `set_error_handler()`：\n\
  \n```\nset_error_handler($error_handler); \n```\n\n`set_error_handler()` 接受一个参数\
  \ `$error_handler`，它是你创建的错误处理函数的名称。\n\n如果你调用 `set_error_handler(0)`，则错误处理器将恢复为 PHP\
  \ 的默认错误处理器。\n\n```\nset_error_handler(0); \n//错误处理器现为 PHP 的默认错误处理器\n```\n\n`set_error_handler()`\
  \ 在调用时会返回旧的错误处理器的值。这允许你轻松恢复到旧的错误处理器。例如：\n\n```\nset_error_handler(\"foo\"); \n$old_error_handler\
  \ = set_error_handler(\"bar\");\n//$old_error_handler = \"foo\";\nset_error_handler($old_error_handler);\n\
  //错误处理器现在是 \"foo\"\n```\n\n你也可以通过调用不接受参数的 `restore_error_handler()` 函数来轻松恢复到之前的错误处理器：\n\
  \n```\nset_error_handler(\"foo\"); \nset_error_handler(\"bar\");\nrestor_error_handler();\n\
  //error_handler = \"foo\"\n```\n\n当触发错误时，PHP 会调用 `set_error_handler()` 中指定的函数，并向其传递以下参数（按以下顺序）：\n\
  \n*   错误编号——这是来自 表 8-1 的错误值。\n*   错误文本。\n*   发生错误的文件名和路径。\n*   发生错误的代码行号。\n*   错误发生时的上下文——基本上是一个大型数组，包含了错误发生时脚本可用的所有变量的状态。\n\
  \n你可以根据需要使用这些参数中的任意一个、多个或全部，但参数必须按照上述顺序出现。\n\n|| \n\n## 旁注\n\n如果 PHP 在你的 `error_handling`\
  \ 函数中遇到错误，它将使用默认或之前的错误处理方法来处理该错误。 |\n\n| --- |\n\n下一个脚本提供了自定义错误处理器的示例。\n\n### 脚本\
  \ 8-3 error\\_handler.php\n\n[\\[全屏查看\\]](&r=noccc&xmlid=0-13-008539-1/ch08lev1sec2#PLID22)\
