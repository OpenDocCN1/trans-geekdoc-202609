  \      next($inventory);\n41.      $total = $total + $items[$i];\n42.    }\n43.\
  \    ?>\n44.    <p>您的购物车中有 <?=$total?> 件商品。\n45.    <p><input type=\"submit\" name=\"\
  additems\">\n46.    </form>\n47.    ?>\n48.    if($total > 0) {\n49.      ?>\n50.\
  \      <form action=session_cart_checkout.php>\n51.      <input type=\"submit\"\
  \ name=\"checkout\" value=\"结算!\">\n52.    </form>\n53.      ?>\n54.    }\n55. \
