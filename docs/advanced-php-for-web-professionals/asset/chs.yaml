  \n\n\n\n| ![](img/#index.htm)   ![上一节](img/#ch04lev1sec6.htm)   ![下一节](img/#ch05_split_000.htm)\
  \ |\n\n| --- |\n\n* * *\n\n### 变量变量\n\n我在某些基于表单的应用程序中发现了一个非常有用的技巧，那就是“变量变量”（variable\
  \ variables）。变量变量允许你为变量使用变量名。通过这种方式，你可以根据脚本所需的任何目的动态生成变量名。\n\n示例：\n\n```\n$name\
  \ =  \"integer\"; \n$$name = 10;\n//结果为 $integer = 10;\n```\n\n注意，当你将这些值 `echo`\
  \ 到屏幕上时，得到的结果与你可能预期的不同。在上面的示例中，如果你想将该值打印到屏幕上，你不能像通常那样的那样将变量变量名括在引号中：\n\n```\necho\
  \ \"<p>$$name\"; \n// 结果是在屏幕上打印 \"$integer\"\necho \"<p>\" . $$name;\n// 结果是在屏幕上打印\
  \ \"10\"\n```\n\n变量名也可以通过如下表达式来创建：\n\n```\n$name = \"integer\"; \n${$name . \"_1\"\
  } = 10;\n// 结果为 $integer_1 = 10;\n```\n\n与 `for` 循环结合使用，这有助于创建动态表单，可以轻松更改以包含更多或更少的字段。\n\
  \n下面的示例（图 4-2 所示）允许你将文件上传到服务器。你只需要指定想要上传的文件数量，脚本会自动创建必要的变量。\n\n#### 脚本 4-5 upload.php\n\
  \n[\\[查看全宽\\]](&r=noccc&xmlid=0-13-008539-1/ch04lev1sec7#PLID3) \n\n```\n1.  <?\n\
