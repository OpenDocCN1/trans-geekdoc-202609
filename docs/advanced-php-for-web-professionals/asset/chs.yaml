  60.    echo(\"<h3>购物车已更新！</h3>\");\n61.    shop();\n62.  }elseif(!isset($name))\
  \ {\n63.    get_user_info();\n64.  } elseif(isset($infosubmit)) {\n65.    populate_cart();\n\
  66.    shop();\n67.  } else {\n68.    shop();\n69.  }\n70.  ?>\n```\n\n### Script\
