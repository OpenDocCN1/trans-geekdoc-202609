  \ 64. for($i = 0; $i < $size; $i++) {\n 65.   if(trim($contents[$i]) != \"\"){\n\
  \ 66.     $data = $contents[$i];\n 67.     if(ereg(\"^Version\", $data)) {\n 68.\
  \       $versioninfo = explode(\":\", $data);\n 69.       $version = trim($versioninfo[1]);\n\
  \ 70.       sql_query(\"update info set version = '$version' where id = '1'\");\n\
  \ 71.     } elseif(ereg(\"[0-9]+/[0-9]+/[0-9]+\", $data)) {\n 72.       $date =\
  \ trim($data);\n 73.       sql_query(\"update info set date = '$date' where id =\
  \ '1'\");\n 74.     } elseif(ereg(\"^Bank\", $data)) {\n 75.       $bankinfo = explode(\"\
  :\", $data);\n 76.       $bank = trim($bankinfo[1]);\n 77.       sql_query(\"update\
  \ info set bank = '$bank' where id = '1'\");\n 78.     } elseif(ereg(\"[0-9]+/[0-9]+/[0-9]+\"\
  , $data)) {\n... (根据格式规则截断)\n```\n\n##### 脚本 4. parse.php 逐行解析\n\n| 行号 | 说明 |\n\
