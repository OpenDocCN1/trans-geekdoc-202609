  \ ![下一节](img/#ch12lev1sec3_split_000.htm) |\n\n***\n\n### 安装 PHPGTK\n\n在开始使用 PHPGTK\
  \ 之前，你需要下载适当的文件。PHPGTK 团队在 [`gtk.php.net`](http://gtk.php.net) 建立了一个非常好的网站。PHPGTK\
  \ 网站提供了 GTK 扩展的下载内容和文档。\n\n#### 在安装之前\n\nPHPGTK 尚未达到 `1.0` 版本，因此我不建议你在生产环境 Web 服务器上使用此版本的\
  \ PHP。事实上，你并没有理由想在生产环境 Web 服务器上安装 PHPGTK。它是一个客户端应用程序！\n\nPHPGTK 目前只是是开发者的玩具，任何内容都可能发生变化，至少在\
  \ PHPGTK 达到 `1.0` 版本之前如此。尽情玩它，尝试一下，但不要将公司的下一个大产品建立在 PHPGTK `0.5.0` 上。\n\n#### 在\
  \ Windows 上安装\n\n在 Windows 机器上安装 PHPGTK 非常简单，类似于安装普通版本的 PHP。从 PHPGTK 网站 [`gtk.php.net`](http://gtk.php.net)\
  \ 下载 Windows 二进制文件。\n\n使用压缩工具解压文件。将文件解压到你的 `C:` 盘。\n\n解压文件后会创建以下文件夹：\n* `php4`——包含\
  \ PHP 可执行文件以及一些 GTK 库文件。\n* `test`——包含一些使用组件的示例 *.php 文件。\n\n如果你使用的是 Windows 98\
  \ 或 Windows ME，你会发现了名为 `winnt` 和 `winnt/system32` 的文件夹。你应该将这些文件夹的内容拷贝到 `C:\\windows`\
  \ 目录。注意，你可能需要将系统文件设置为可见，以便将它们复制到 `C:\\windows`。\n\n此外，你应该看到一个新的 `php.ini` 文件。将其拷贝到\
  \ `C:\\Windows` 或 `C:\\WINNT` 目录。务必先备份现有的 `php.ini` 文件。\n\n在命令提示符中输入以下内容来测试安装：\n\
  \n```\nc:\\php4\\php.exe -q c:\\test\\gtk.php\n```\n\n查看图 12-1 中 `gtk.php` 运行的。\n\
  \n##### 图 12-1 Linux (Gnome) 和 Windows 2000 中的 gtk.php\n\n![graphics/12fig01.jpg](img/12fig01.jpg)\n\
  \n#### 在 Linux 上安装\n\n在 Linux 上安装 PHPGTK 比安装普通 PHP 更简单；你不需要担心 Apache。你可以将 GTK 功能编译到独立的\
  \ PHP 版本中，但为了我们，我们将从零开始创建一个内置 GTK 功能的新 PHP 可执行文件。在开始之前：\n1. 从 [www.php.net](http://www.php.net)\
  \ 下载 PHP 源码。\n2. 从 [`gtk.php.net`](http://gtk.php.net) 下载 PHPGTK 源码。\n\n一旦获得需要的文件，解压普通的\
  \ PHP 源码：\n\n```bash\ntar -zxvf php-4.x.tar.gz\n```\n\n这创建了一个名为 `php-4.x` 的新目录，“x”表示你下载的\
  \ PHP 具体版本号。\n\n使用最小选项编译 PHP。我们只是想创建一个独立的可执行文件。如果你想添加额外功能，以后可以重新编译。进入新创建 PHP 源码目录。输入：\n\
  \n```bash\n./configure\n```\n\n就这些。这会自动创建一个内置 MySQL 支持的可执行文件。\n\n一旦你获得 `php` 二进制文件，必须将其拷贝到\
  \ `/usr/local/bin`。PHPGTK 安装将在该位置查找它。你需要 root 权限执行此操作。\n\n```bash\ncp php /usr/local/bin\n\
  ```\n\n现在该将 GTK 扩展构建到你的 PHP 了。回到下载 PHPGTK 源码的地方并提取它：\n\n```bash\ntar -zxvf php-gtk-0.5.0.tar.gz\n\
  ```\n\n这创建了一个名为 `php-gtk-0.5.0` 的目录。进入该目录。你需要 root 权限执行最后一步 `make install`。编译 PHPGTK\
  \ 输入以下内容（输入每个命令后屏幕上将打印大量文本）：\n1. `./configure`\n2. `make`\n3. `make install`\n\n\
  你可以通过进入 test 目录并运行几个脚本来测试安装。需要运行 X-Windows！\n\n```bash\ncd test\nphp -q gtk.php\n\
  ```\n\n应该弹出一个显示各种组件按钮的窗口。点击不同的组件来简单了解它们的功能。\n\n图 12-1 显示了 gtk.php 文件在 Linux（使用 Gnome\
  \ 桌面）和 Windows 2000 中的外观。\n\n你也可以尝试运行 test 目录中的其他 *.php 文件。使用 `-q` 标志来抑制在屏幕上打印头部信息。\n\
