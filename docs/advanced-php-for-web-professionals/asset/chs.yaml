  \ $string, $file, $line) {\n4.    error_log(\"Error ($number) on line $line in file\
  \ $file. The error was \\\"$string\\\"\\n\", \n3, \"errors.txt\");\n5.  }\n6.  ini_set('display_errors',0);\n\
  7.  set_error_handler(\"error_handler\");\n8.  $row = mysql_fetch_array($result);\n\
  9.  ?>\n```\n\n### 脚本 8-3 error\\_handler.php 逐行解释\n\n| 行 | 描述 |\n\n| --- | ---\
