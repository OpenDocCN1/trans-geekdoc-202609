  \n\n\n\n\n\n\n### 本书目标\n\n本书的目标是帮助你更好地掌握 PHP，学习一些不常使用的特性，并帮助你构建一些在你的工作或爱好中有帮助的应用程序。我希望它能为你提供一些思路，让你自己开发的应用程序更易于编码、更易使用。\n\
  \n### 本书目标读者\n\n本书适用于那些已经进行过基础 PHP 编程，并希望学习一些更高级的技术以使应用程序更易用、更易编程的人。。\n\n我收到了许多来自各地读者的邮件，他们是我的第一本书——`Essential\
  \ PHP for Web Professionals`（同样由 Prentice Hall 出版）的读者，他们非常喜欢我提供的简洁风格和丰富的示例。我甚至收到了几十封邮件，发件人说他们虽然读过其他的\
  \ PHP 编程书籍，但在读我的书之前，并没有真正理解 PHP 的工作原理。我无法言形容这让我感到多么高兴。我希望这本书也能达到同样的效果。\n\n这本书写给那些准备好更进一步、学习更多\
  \ PHP 知识的你。这本书并不是参考书，也没有涵盖 PHP 的每一个高级方面。然而，它确实超出了基础范围，介绍了一些有助于你进行 PHP 编程的概念。\n\n\
  ### 获取代码\n\n本书所有的代码都可以在 `www.phptr.com/advancedweb/php` 的高级 Web 页面获取。你可以从该页面下载每个章节的所有示例。该网页还将包含任何更新或勘误说明，以及常见问题的解答。如果你在阅读本书时遇到任何真正的困难，请随时发送邮件到\
  \ `cosentino@digital-salage.net` 与我联系。我在书中之所以提到这一点，是因为我收到了大量寻求 PHP 帮助的邮件。如果是简单的问题，我通常可以回答任何问题，但最近邮件邮件让我有些应接不来，可能无法回答所有问题。请注意，我不能总是立即回答你的问题。我会尽快回答，但有时可能需要几天时间。\n\
