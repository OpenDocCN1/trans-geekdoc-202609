  trans: "\n\n2. PHP 中 `fwrite()` 函数的作用是什么？ \n\n3. 在 PHP 中如何识别文件的长度？ \n\n4. 什么是 `index.php`\
    \ 文件？ \n\n5. 打开文件失败时会发生什么？ \n\n6. 文件系统函数的目的是什么？ \n\n7. 脚本中 `file_exist` 函数的作用是什么？\
    \ \n\n8. 打开 PHP 文件使用哪个函数？ \n\n9. `fclose()` 函数的参数是什么？ \n\n10. 什么是文件？\n\n# 第十三章\
    \ PHP 中的 Web 概念\n\nWeb 概念仅仅演示了 PHP 如何根据浏览器类型、用户输入和随机生成的数字提供动态内容。\n\n识别平台和浏览器：PHP\
    \ 会创建一些重要的环境变量，可以在 `phpinfo.php` 页面中找到，该页面用于设置 PHP 环境。`HTTP_USER_AGENT` 是 PHP\
    \ 设置的许多环境变量之一，用于识别用户的操作系统和浏览器。此外，PHP 提供了 `getenv()` 函数来获取每个环境变量的值。`HTTP_USER_AGENT`\
    \ 环境变量所持有的数据可以用于创建适用于浏览器的动态内容。下文所示示例演示了如何识别客户端的操作系统和浏览器。\n\n```html\n<html>\n\
    <body>\n<?php \nfunction getBrowser() {\n  $u_agent = $_SERVER['HTTP_USER_AGENT'];\n\
    \  $bname = 'Unknown';\n  $platform = 'Unknown';\n  $version = \"\"; //首先获取平台？\n\
    \  if (preg_match('/linux/i', $u_agent)) {\n    $platform = 'linux';\n  }elseif\
    \ (preg_match('/macintosh|macos x/i', $u_agent)) {\n    $platform = 'mac';\n \
    \ }elseif (preg_match('/windows|win32/i', $u_agent)) {\n    $platform = 'windows';\n\
    \  }\n  // 然后获取用户代理的名称，分开获取是有原因的\n  if(preg_match('/MSIE/i',$u_agent) && !preg_match('/Opera/i',$u_agent))\
    \ {\n    $bname = 'Internet Explorer';\n    $ub = \"MSIE\";\n  } elseif(preg_match('/Firefox/i',$u_agent))\
    \ {\n    $bname = 'Mozilla Firefox';\n    $ub = \"Firefox\";\n  } elseif(preg_match('/Chrome/i',$u_agent))\
    \ {\n    $bname = 'Google Chrome';\n    $ub = \"Chrome\";\n  }elseif(preg_match('/Safari/i',$u_agent))\
    \ {\n    $bname = 'Apple Safari';\n    $ub = \"Safari\";\n  }elseif(preg_match('/Opera/i',$u_agent))\
    \  {\n    $bname = 'Opera';\n    $ub = \"Opera\";\n  }elseif(preg_match('/Netscape/i',$u_agent))\
    \ {\n    $bname = 'Netscape';\n    $ub = \"Netscape\";\n  }\n  // 最后获取正确的版本号\n\
    \  $known = array('Version', $ub, 'other');\n  $pattern = '#(?<browser>' . join('|',\
    \ $known) . ')\\[/ \\]+(?<version>\\[0-9.|a-zA-Z.\\]\\*)#';\n  if (!preg_match_all($pattern,\
    \ $u_agent, $matches)) {\n    // 我们没有匹配的数字，继续即可\n  }\n  // 查看我们有多少个\n  $i = count($matches['browser']);\n\
    \  if ($i != 1) {\n    // 我们有两个，因为我们还没有使用 'other' 参数\n    // 查看版本号是在名称之前还是之后\n\
    \    if (strripos($u_agent,\"Version\") <strripos($u_agent,$ub)){\n      $version=\
    \ $matches['version'][0];\n    }else {\n      $version= $matches['version'][1];\n\
    \    }\n  }else {\n    $version= $matches['version'][0];\n  }\n  // 检查我们是否有数字\n\
    \  if ($version == null || $version == \"\") {\n    $version = \"?\";\n  }\n \
    \ return array(\n    'userAgent' => $u_agent,\n    'name'      => $bname, \n \
    \   'version'  => $version, \n    'platform' => $platform, \n    'pattern'  =>\
    \ $pattern\n  );\n}\n// 现在尝试一下\n$ua = getBrowser();\n$yourbrowser = \"Your browser:\
    \ \" . $ua['name'] . \" \" . $ua['version']  . \" on .\" .$ua['platform'] . \"\
    \ reports: <br>\" . $ua['userAgent'];\nprint_r($yourbrowser); \n?> \n</body>\n\
    </html>\n```\n\n当执行示例代码时，可能会产生许多结果，取决于你的电脑、操作系统、浏览器等。产出的结果如下：Your browser: Google\
    \ Chrome 54.0.2840.99 on windows reports: Mozilla/5.0 (Windows NT 6.3; Win64;\
    \ x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/54.0.2840.99 Safari/537.3\
    \ 6\n\n### 随机显示图片：PHP 中的 `rand()` 函数用于生成随机数。该函数能够生成指定范围内的数字。随机数生成器应该被种子，以抑制一系列规律性数字的生成。为了做到这一点：使用\
    \ `srand()` 函数代替 `rand()` 函数，为参数指定一个种子数。下文所示示例演示了如何显示四张图片中的任意一张随机图片：\n\n```html\n\
    <html>\n<body>\n<?php \nsrand( microtime() * 1000000 );\n$num = rand( 1, 4 );\n\
    switch( $num ) {\n  case 1:\n    $image_file = \"/php/images/logo.png\";\n   \
    \ break;\n  case 2:\n    $image_file = \"/php/images/php.jpg\";\n    break;\n\
    \  case 3:\n    $image_file = \"/php/images/logo.png\";\n    break;\n  case 4:\n\
    \    $image_file = \"/php/images/php.jpg\";\n    break;\n}\necho \"Random Image\
    \ : <imgsrc=$image_file />\"; \n?> \n</body>\n</html>\n```\n\n当执行示例代码时，结果应该是四张图片中的任意一张。\n\
    \n### 在 PHP 中使用 HTML 表单：在使用 HTML 表单和 PHP 代码时，必须记住一点：HTML 页面内的任何表单元素都可以自动供 PHP\
    \ 脚本使用。将源代码放入 `test.php` 脚本来考虑下面的代码：\n\n```php\n<?php \nif($_POST[\"name\"] ||\
    \ $_POST[\"age\"]) ) {\n  if (preg_match(\"/\\[^A-Za-z'-\\]/\",$_POST['name']\
    \ )) {\n    die (\"名称无效，名称应为字母\");\n  }\n  echo \"Welcome \".$POST['name'].\"\
    <br />\";\n  echo \"You are \".$POST['age']. years old.\";\n  exit();\n} \n?>\
    \ \n<html>\n<body>\n<form action=\"<?php $_SERVER['PHP_SELF']; ?>\" method=\"\
    POST\">\n  Name: <input type=\"text\" name=\"name\" />\n  Age: <input type=\"\
    text\" name=\"age\" />\n  <input type=\"submit\" />\n</form>\n</body>\n</html>\n\
    ```\n\n输出结果将如下：Name: Age: Submit 默认变量 `$_PHP_SELF` 可以用作 PHP 脚本的名称。点击提交按钮后，将调用同一个脚本产生类似的结果。`POST`\
    \ 方法可用于数据提交到服务器。\n\n## 练习 13\n\n1. PHP 中如何实现浏览器重定向？ \n2. PHP 中 `rand()` 函数的作用是什么？\
    \ \n3. 描述环境变量 `HTTP_USER_AGENT` 的用途。 \n4. 定义“Web 概念”一词。 \n5. 采取了什么措施来限制加载页面的其他部分？\
    \ \n\n"
- fmt: "\n# Chapter Fourteen: Get and Post Methods in PHP\n\nHTTP (Hypertext Transfer\
    \ Protocol) is created to devise a connection between servers and clients. HTTP\
    \ functions as a protocol of request and response between the server and clients.\
    \ A client's browser submits an HTTP request, and the client expects some form\
    \ of response from the server. The response holds the status data regarding the\
    \ request made, and may sometimes include the content requested by the client.\n\
    \nThere are two types of HTTP request methods. They are: GET methods; and POST\
    \ method.\n\nBefore a browser begins sending out information, it encoded the information\
    \ in a scheme known as the URL encoding. With this scheme, value or name pairs\
    \ are usually joined using equal signs, and different pairs were kept apart with\
    \ the use of ampersands. `name1=value1&name2=value2&name3=value3`. Spaces are\
    \ usually eliminated and replaced using the `+` character, and all other non-alphanumeric\
    \ characters are swapped out for hexadecimal values. And once the information\
    \ has been successfully encoded, it is transmitted directly into the server.\n\
    \n## The GET Method\n\nThis method is used for requesting data from a given resource.\
    \ For the GET method, the data is forwarded in URL parameters which are typically\
    \ strings of value and name pairs separated using ampersands (`&`). On a general\
    \ note, a URL containing GET data tends to take after this fashion:\n\nSample:\
    \ `http://www.example.com/action.php?name=Jerry&height=5`\n\nRationale: In the\
    \ URL, the bold part represents the GET parameters, while the italic parts represent\
    \ the values assigned to those parameters. More than a single parameter can be\
    \ embedded in an URL through concatenation using ampersands (`&`). In the GET\
    \ method, one is only capable of sending simple text data.\n\nInput:\n```php\n\
    <?php\nif($_GET[\"name\"] || $_GET[\"weight\"]) {\n    echo \"Welcome \". . $_GET['height'].\
    \ \"<br />\";\n    echo \"You are \". . $_GET['height'] . \" cms in height.\"\
    ;\n    exit();\n}\n?>\n<html>\n<body>\n    <form action=\"<?php $_PHP_SELF; ?>\"\
    \ method=\"GET\">\n        Name: <input type=\"text\" name=\"name\" />\n     \
    \   Weight: <input type=\"text\" name=\"height\" />\n        <input type=\"submit\"\
    \ />\n    </form>\n</body>\n</html>\n```\n\nWhen executed, the output is as follows:\
    \ Name: Height: Submit\n\n*   The GET method creates a long string which can be\
    \ found in the server logs of the `Location:` box of the browser.\n*   The GET\
    \ method has a character limit which allows it up to 1024 characters at a time.\n\
    *   Keep in mind to not make use of a GET method anytime you have a password or\
    \ other high precedence data to be sent into a server.\n*   It is impossible to\
    \ send binary data, such as word documents or images into a server using the GET\
    \ method.\n*   The environment variable `QUERY_STRING` can be used in accessing\
    \ the data sent by the GET method.\n*   PHP uses the GET method in providing a\
    \ `$_GET` associative array for accessing every information that is sent.\n\n\
    ### The upsides of using the GET method\n1. Given as the data sent through the\
    \ GET method is displayed in the URL, bookmarking the page using a specified query\
    \ string values is entirely possible.\n2. It is also possible to cache GET requests\
    \ and GET requests tend to stay in the browser's history.\n3. It is also possible\
    \ to bookmark GET requests.\n\n### The downsides of using the GET method\n1. The\
    \ GET method is highly unsuitable for the transfer of sensitive data like the\
    \ passwords and usernames of users, as they tend to be on full display in the\
    \ URL query string, coupled to the fact that they are stored potentially in the\
    \ memory of the client's browser as a recent page.\n2. Since the GET method tends\
    \ to assign data to an environment variable in the server, there is a limit to\
    \ which the length of the URL can be. As a result, there is an inhibition on the\
    \ total volume of data that can be transferred.\n\n## The POST Method\n\nThe post\
    \ method is used in submitting the data to be parsed into a given resource. For\
    \ the POST method, information is transferred through HTTP headers. The information\
    \ is encoded in a similar way to the encoding process for the GET method, and\
    \ then it is placed into a header known as `QUERY_STRING`. For POST method, the\
    \ data is forwarded to the server in the form of a package contained in clear\
    \ communication with a processing script. The data forwarded through the POST\
    \ method tends to be invisible in the URL.\n\nSample: `POST /test/demo_`\n\nRationale:\
    \ The data forwarded through the POST method tends to be invisible in the URL.\n\
    \nSample: `POST /test/demo_`\n\nInput:\n```php\n<?php\nif($_POST[\"name\"] ||\
    \ $_POST[\"weight\"]) {\n    if (preg_match(\"/[a-z]/\", $_POST['name'])) {\n\
    \        echo \"Welcome \". . $_GET['height']. \"<br />\";\n        echo \"You\
    \ are \". . $_GET['height'] . \" cms in height.\";\n        exit();\n    }\n}\n\
    ?>\n<html>\n<body>\n    <form action=\"<?php $_PHP_SELF; ?>\" method=\"POST\"\
    >\n        Name: <input type=\"text\" name=\"name\" />\n        Weight: <input\
    \ type=\"text\" name=\"height\" />\n        <input type=\"submit\" />\n    </form>\n\
    </body>\n</html>\n```\n\nWhen executed, the output is as follows: Name: Height:\
    \ Submit\n\n*   The GET method creates a long string which can be found in the\
    \ server logs of the `Location:` box of the browser.\n*   The GET method has a\
    \ character limit which allows it up to 1024 characters at a time.\n*   Keep in\
    \ mind to not make use of a GET method anytime you have a password or other high\
    \ precedence data to be sent into a server.\n*   It is impossible to send binary\
    \ data, such as word documents or images into a server using the GET method.\n\
    *   The environment variable `QUERY_STRING` can be used in accessing the data\
    \ sent by the GET method.\n*   PHP uses the GET method in providing a `$_GET`\
    \ associative array for accessing every information that is sent.\n\n*(Wait, let\
    \ me re-process the provided text carefully as the input had some garbled/repeated\
    \ sections in the POST part. I will clean the logic while keeping the core content).*\n\
    \n**Revised POST Section:**\n\nThe post method is used in submitting the data\
    \ to be parsed into a given resource. For the POST method, information is transferred\
    \ through HTTP headers. The information is encoded in a similar way to the encoding\
    \ process for the GET method, and then it is placed into a header known as `QUERY_STRING`.\
    \ For POST method, the data is forwarded to the server in the form of a package\
    \ contained in clear communication with a processing script. The data forwarded\
    \ through the POST method tends to be invisible in the URL.\n\nSample: `POST /test/demo_`\n\
    \nRationale: The data forwarded through the POST method tends to be invisible\
    \ in the URL.\n\nInput:\n```php\n<?php\nif($_POST[\"name\"] || $_POST[\"weight\"\
    ]) {\n    if (preg_match(\"/[a-z]/\", $_POST['name'])) {\n        echo \"Welcome\
    \ \". . $_GET['height']. \"<br />\";\n        echo \"You are \". . $_GET['height']\
    \ . \" cms in height.\";\n        exit();\n    }\n}\n?>\n<html>\n<body>\n    <form\
    \ action=\"<?php $_PHP_SELF; ?>\" method=\"POST\">\n        Name: <input type=\"\
    text\" name=\"name\" />\n        Weight: <input type=\"text\" name=\"height\"\
    \ />\n        <input type=\"submit\" />\n    </form>\n</body>\n</html>\n```\n\n\
    ### The upsides of using the POST method\n1. The POST method has a higher level\
    \ of security than the GET method as information is never shown in the query string\
    \ or the logs.\n2. POST method has a much larger boundary for the amount of data\
    \ which can be passed at a time, and a user can easily forward binary data (uploading\
    \ a file or image) and text data.\n\n### The downsides of using the POST method\n\
    1. Since the data forwarded through the POST method is not displayed in the URL,\
    \ it is impossible to bookmark the page under any given query.\n2. Also, the requests\
    \ of POST methods do not get cached.\n3. The requests of POST methods are not\
    \ saved in the browser's history, so it has no logs.\n\n## The $_REQUEST Variable\n\
    \nThe `$_REQUEST` variable in PHP constitutes the contents of three variables:\
    \ `$_COOKIE`, `$_POST`, and `$_GET`. The `$_REQUEST` variable can be used in obtaining\
    \ a result from the form forwarded using both the POST and GET methods.\n\nInput:\n\
    ```php\n<?php\nif($_REQUEST[\"name\"] || $_REQUEST[\"height\"]) {\n    echo \"\
    Welcome \". . $_REQUEST['name']. \"<br />\";\n    echo \"You are in\". . $_REQUEST['height']\
    \ . \" meters tall.\";\n    exit();\n}\n?>\n<html>\n<body>\n    <form action=\"\
    <?php $_PHP_SELF; ?>\" method=\"POST\">\n        Name: <input type=\"text\" name=\"\
    name\" />\n        Height: <input type=\"text\" name=\"height\" />\n        <input\
    \ type=\"submit\" />\n    </form>\n</body>\n</html>\n```\n\n## Exercise 14\n1.\
    \ In terms of security, how is the POST method better than the GET method?\n"
