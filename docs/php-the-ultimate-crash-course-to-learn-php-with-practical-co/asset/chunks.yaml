    # 第十二章：PHP 中的文件


    在 PHP 中，文件指的是包含超文本文本处理器（PHP）代码的网页。这些文件可以包含 PHP 函数，能够处理在线表单、访问数据库中的数据或获取时间和日期。位于
    Web 服务器上的 PHP 引擎负责解析或处理网页中找到的 PHP 代码，从而动态生成 HTML。请记住，网页的内容包含在 HTML 中，是这些 HTML
    被转发到用户的浏览器中。因此，用户即使在查看源代码时，也很少意识到网页所包含的真实 PHP 代码。当用户的浏览器从支持 PHP 的 Web 服务器请求目录时，默认加载的文件通常是
    `index.php` 文件。例如，当请求示例页面 `http://myexample.org/` 时，加载的页面通常是 `http://myexample.org/index.php`。


    ## PHP 文件操作


    ### 在 PHP 中打开文件


    对于支持 Windows 的系统，可以使用应用程序 `Notepad` 打开 PHP 文件。但在学习 PHP 代码时，建议使用语法高亮，更专业的 PHP 程序员也更倾向于此。因此，在寻找具有语法高亮功能的文本编辑器时，可以选择以下任一：`Programmer''s
    Notepad`、`Visual Studio Code`、`Sublime Text`、`Vim`、`Atom` 和 `CodeLobster IDE`。尽管上述程序可以用于编辑和更改
    PHP 文件，但它们没有操作 PHP 服务器的功能。要实现这一点，你需要复杂的程序，例如 `Apache Web Server`。


    ### 让 PHP 与 HTML 工作


    当 PHP 代码包含在 HTML 文件中时，如果它包含在标签而不是传统的 HTML 标签中，被认为是 PHP 相关的而非 HTML：


    ```php

    <?php [此处填写 PHP 代码] ?>

    ```


    ### 在 PHP 中关闭和打开文件


    在 PHP 中，函数 `fopen()` 用于打开文件。它需要两个参数：首先指定文件名，然后是指定其应操作的模式。文件模式大约有六种可选。它们包括：


    1.  `r`: 此模式用于以只读方式打开文件。在该模式下，文件指针被放在文件的开头。

    2.  `r+`: 此模式用于以读写方式打开文件。在该模式下，文件指针也被放置在文件的开头。

    3.  `w`: 此模式仅以只写模式打开文件。文件指针被放在文件的开头。此外，如果文件不存在，则将文件长度截断为零。

    4.  `w+`: 此模式仅以只写模式打开文件。文件指针被放在文件的开头。

    5.  `a`: 此模式以追加模式打开文件。文件指针被放在文件的末尾。

    6.  `a+`: 此模式以读写模式打开文件。文件指针被放在文件的末尾。


