    # 引言

    互联网是一项在全球范围内以各种方式使用的奇迹。互联网的很大一部分由连接到某项服务的网页组成。反之，这些服务在我们的日常生活中非常有用。网页主要是使用 `PHP`
    程序构建的。因此，总而言之，即使在我们不知情的情况下，`PHP` 也构成了我们生活中不可或缺的一部分。就此，无论 `PHP` 如何或在何处被应用，它对学习者来说有多重要，怎么强调都不为过。这正是写这本书的原因。它旨在让初学者了解该语言的基础知识，并向他们介绍巨大的潜力。书中包含了详细的内容、简洁风格以及无与伦比的实用性。开启
    `PHP` 世界之旅，在了解互联网运行机制的知识中成长。你会为自己的选择感到高兴的。


    # 第一章：PHP 简介

    `PHP` 是 Hypertext Pre-processor（超文本预处理器）的递归缩写。它是一种开源编程语言，可以用于各种用途，这使得它广受欢迎并应用广泛。然而，正如其名称所示，由于它是
    1994 年由 `Rasmus Lerdorf` 创建的原始脚本，`PHP` 特别适用于超文本标记语言 (`HTML`) 和 Web 开发。在当代编程语言中，`PHP`
    表现出色，使其赢得了作为当今世界上最常用且最强大的语言之一的高高地位。它的多功能性解释了为什么 `Facebook` 和 `WordPress`（这些是目前各自领域中最重要的机构之一）使用它们进行编程。该语言的灵活性、速度和实用性使其对那些认为这些品质至关重要的程序员来说更具青睐。


    编码风格：

    ```html

    <!DOCTYPE html> <<html> <head> <title>Samplecode</title> </head > <<body> <?php
    echo "Hello, this is a PHP script!";  </body></</html>

    ```


    `PHP` 页面并不像 `Perl` 和 `C` 等其他编程语言那样在输出 HTML 时使用大量命令，而是由一个包含用于执行功能的嵌入式编程的 HTML 组成。在上面的代码示例中，该功能是输出“Hello,
    this is a PHP script.”这一行。此外，`PHP` 代码封装在开头和结尾的特殊指令中，允许用户进出 `PHP` 模式。`PHP` 与另一种编程语言（如客户端
    `JavaScript`）之间的一个关键区别在于，代码在服务器上运行，并生成发送给客户端的 HTML。客户端将收到脚本执行过程的结果，而无需对脚本的底层代码一无所知。也可以配置
    Web 服务器使其处理每一个 `PHP` 中的 HTML 文件。这使得用户无法获知你的代码或脚本。学习 `PHP` 的优点之一是，它对初学者来说学习并不困难，同时又提供了资深程序员会认为有用的多个高级功能。尽管
    `PHP` 有许多长长的功能列表，但人们可以在短时间内加入，并以创纪录的速度创建简单的 `PHP` 程序。像任何其他编程语言一样，`PHP` 代码可以使用包含在
    HTML 代码中的 `CLI`（命令行界面）运行，或者与许多 Web 系统、内容管理框架和 Web 模板系统一起使用。`PHP` 解释器可以看到 `PHP`
    代码的处理，并通常作为实现模块位于 `CGI`（通用网关接口）或 Web 服务器上。Web 服务器输出已运行并解释的 `PHP` 代码的结果。输出的代码可以采取任何形式，从二进制图像数据到生成的
    HTML 代码，应有有。在 Web 开发和应用之外，还可以将 `PHP` 用于其他形式的编程，如机器人无人机控制或独立图形应用程序。


    ## PHP 历史

    `PHP` 的发展可以追溯到 1994 年的 `Rasmus Lerdorf`。据信，`Lerdorf` 用 `C` 编程语言编写了几个 `CGI`（通用网关接口）程序。据说他使用这些程序来管理他的主页。`Lerdorf`
    实验了 Web 表单并获得了成功，因此扩展到了 Web 开发和数据库的通信。他将自己的实现命名为 `PHP/FI`，这是“Personal Home Page/Forms
    Interpreter”的缩写。`Lerdorf` 的这一创作可以用于创建简单结构的动态 Web 应用。为了加快错误报告速度以改进代码，`Lerdorf`
    于 1995 年 6 月 8 日在 `Usenet` 的讨论组上宣布将 `PHP/FI` 重新发明为 `PHP Tools`（个人主页工具）。新版本已经包含了
    `PHP` 直至今能够具备的一些主要功能，包括 HTML 的嵌入、类似 `Perl` 的变量和表单处理。其语法与 `Perl` 使用的某些相似之处；然而，其简洁的设计证明比其一致性更具抑制性。以下是该语言早期语法之一的代码示例：


    ```text

    <!--include /selectedtext/header.html-->

    <!--getenv HTTP\_USER\_AGENT-->

    <!--ifsubstr $exec\_resultChrome--> Hello, you are using Netscape!<p > <!--endif-->

    <!--sql database select \* from group where user=''$username''-->

    <!--ifless $numentries2--> Sorry, such record does not exist<p> <!--endif exit-->
    Welcome <!--$user-->!<p> You have <!--index:4--> credits remaining in your account.<p>

    <!--include /selectedtext/footer.html-->

    ```


    `PHP` 的早期形式并非为了成为编程语言，因此其增长和传播是自然的。即使是 `Lerdorf` 也承认这一点，他承认自己完全没有打算阻止其广泛使用。成立了一个开发团队来研究该语言，在长时间的工作和测试测试后，`PHP/FI`
    2 于 1997 年亮相。由于 PHP 并非专门设计为编程语言，而是有机开发的，导致了在函数命名和参数顺序等领域的一些不一致。其他不一致的案例可以在补充 PHP
    的函数中看到。


    ## PHP 3&4

    1997 年，`Andi Gutmans` 和 `Zeey Suraski` 共同编写了解析器，并被认为是 `PHP 3` 的基础部分以及该语言名称更变为现在这种递归缩写的作者。随后开始了
    `PHP 4` 的公开测试，但直到 1998 年 6 月才正式发布。此时，`Gutmans` 和 `Suraski` 开始重写语言的核心，导致 1999 年
    `Zend Engine` 的诞生。两位程序员还被认为在以色列（拉马特甘地区）创立了 `Zend Technologies`。2000 年 5 月发布了 `PHP
    4`。它运行在新的 `Zend Engine 1.0` 上。到 2008 年 8 月，`PHP 4` 达到了 `4.4.9` 版本并停止支持；因此不再对其进行进一步的发布或更新。


    ## 练习 1

    1. `PHP` 最适合执行什么功能？

    2. `PHP` 解释器位于？

    3. `Lerdorf` 将他管理的个人主页实现命名为什么？

    4. 哪个团体被认为是 `PHP 3` 的基础部分以及该程序现在所使用的名称的作者？


