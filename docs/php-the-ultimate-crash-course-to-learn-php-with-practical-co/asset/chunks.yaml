    # Chapter Ten Strings in PHP


    In PHP, a string refers to a set of arithmetic values, special characters, numbers,
    and letters or sometimes, a combination of every one of them. The simplest method
    used in creating strings involves enclosing a string literal, which refers to
    the characters in a string, between two single quotation marks (''''). Consider
    the syntax below:


    ```php

    $my_string = ''Hello World'';

    ```


    It is also possible to use double quotation marks ("). Albeit how double and single
    quotation marks are used differ. Strings encased in single quotes are used in
    an almost literal way, while the strings encased in double-quotes are used to
    replace the variables with a string representation of their values and specially
    translating a variety of escape sequences. The escape-sequence replacements used
    usually include the following:


    - `\\` is replaced using a single backlash (`\`)

    - `\n` is replaced using the newline character

    - `\"` is replaced using the single, double quote (`"`)

    - `\r` is replaced using the carriage-return character

    - `\$` is replaced using the dollar sign alone (`$`)

    - `\t` is replaced using the tab character


    Consider the sample shown below of a valid string:


    ```php

    $string_4 = "This is a string with double quotes";

    $string_3 = ''This is a slightly longer, singly-quoted string'';

    $string_26 = "This string contains twenty-six characters";

    $string_0 = ""; // a string with no characters

    ```


    ## Quoted String Types


    As was earlier discussed, strings with single quotes are treated in a literal
    way while strings with double quotes are used in replacing variables and their
    values, even to the point of being able to interpret some character sequences.
    Consider the sample shown below which points out the distinction between double
    and single quotes strings:


    ```php

    <?php

    $my_str = ''World'';

    echo "Hello, $my_str!<br>"; // Displays: Hello World!

    echo ''Hello, $my_str!<br>''; // Displays: Hello, $my_str!

    echo ''<pre>Hello\tWorld!</pre>''; // Displays: Hello\tWorld!

    echo "<pre>Hello\tWorld!</pre>"; // Displays: Hello World!

    echo ''I\''ll be back''; // Displays: I''ll be back

    ?>

    ```


    Consider the second sample shown below:


    ```php

    <?php

    $output = "song";

    $lyrics = ''My $output will not print!\\n'';

    print($lyrics);

    print "<br />";

    $lyrics = "My $output will print!\\n";

    print($lyrics);

    ?>

    ```


    When executed, the result of the codes takes after this fashion:

    My $output will not print!\n My song will print!\n


    ## Manipulating Strings in PHP


    There are lots of built-in functions in PHP that are used in string manipulation
    activities, such as finding characters or substrings, taking a string apart, calculating
    a string length, replacing a certain fraction of a string using various characters,
    among others. Below are some of the functions manipulation of strings in PHP:


    ### Length of Strings


    There are no defined limits to which the length of a string can be, as such, you
    have to be able to create arbitrarily long strings that fit the bounds of the
    memory available to you. Strings with double quotes (such as "this") undergo preprocessing
    in the following ways:


    1. Some character sequences that start with a backslash (`\`) are swapped out
    and replaced using special characters.

    2. Variable names (like those beginning with `$`) are replaced using the string
    representations of their values.


    ### Calculating the Length of a String


    In PHP, the `strlen()` function is applied for calculating the amount of characters
    that are contained in a string, even up to the blank spaces used within the string.


    ```php

    <?php

    $a_str = ''Welcome to PHP programming''; // Outputs: 24

    echo strlen($a_str);

    ?>

    ```


    Consider another sample below of how the `strlen()` function applies in a different
    string containing "Hello world!":


    ```php

    <?php echo strlen("Hello world!"); ?>

    ```


    The result of executing this string is: 12. The length of a string often factors
    in other functions, as well as loops, as such, knowing when a string terminates
    important in PHP programming. The reason is that when using a loop, knowing to
    terminate the process when the final character in a string has been evaluated
    is vital.


    ### Counting Number of Words in a String


    To count the amount of words held by a string, the function `str_word_count` is
    used.


    ```php

    <?php

    $my_str = ''The quick brown fox jumps over the lazy dog.''; // Outputs: 9

    echo str_word_count($my_str);

    ?>

    ```


    ### String Concatenation Operations


    In the concatenation of two string variables, the dot (`.`) operator is used:


    ```php

    <?php

    $string4="Hey there!";

    $string5="abcd";

    echo $string4 . " " . $string5;

    ?>

    ```


    When this script is executed, the result is as follows: Hello there! Abcd. When
    we take an in-depth look at how the sample shown above works, it can be seen that
    the concatenation operator is used multiple times (two precisely). The reason
    being that a third-string was added into the fray. An empty space was used to
    separate the two variables, and a string containing a single character was introduced
    between the two string variables.


    ### Replacing Text in Strings


    The `str_replace()` function is used in replacing every occurrence of a searched
    query found in a target string.


    ```php

    <?php

    $a_str = ''When the moving gets tough, the tough get moving.''; // Display replaced
    string

    echo str_replace("moving", "going", $my_str);

    ?>

    ```


    When the code above is executed, the output is as follows: When the going gets
    tough, the tough get going. Optionally, it is possible to pass the fourth argument
    into the function `str_replace()` as a way of figuring out the number of times
    a string replacement has been performed.


    ```php

    <?php

    $a_str = ''When the moving gets tough, the tough get moving.''; // Perform string
    replacement

    str_replace("moving", "going", $a_str, $count); // Display number of replacements

    echo "The text was replaced $count times.";

    ?>

    ```


    When the code is executed, the output is: The text was replaced 2 times.


    ### How to reverse a String


    In PHP, the `strrev()` function is used in reversing a string. The process flips
    the string. Consider the sample shown below:


    ```php

    <?php

    $a_str = ''When the going gets tough, the tough get going.''; // Display reversed
    string

    echo strrev($a_str);

    ?>

    ```


    When the code is executed, the outputted result will be as follows: .gniongsteguoteht
    ,huotsteggnionneh W.


    ### How to Use the strpos() Function


    In PHP, the function `strpos()` is used in searching for a character in a string
    or an entire string too. When a match is located within a string, the `strpos()`
    function is the location of the first match. If there are no matches found, the
    result outputted would be FALSE. Consider the same below in which we try to locate
    the string "How are you today?" in a string:


    ```php

    <?php echo strpos("How are you today?", "today"); ?>

    ```


    When the string is executed, the result is 9. On closer observation, you shall
    notice the location of "today" in the string lies in position 9. The reason why
    the position is numbered 9 rather than 8 is that the first position of every string
    in PHP begins with 0.


    ## String Functions in PHP


    Below is an outline of the string functions in PHP. These functions serve as an
    integral piece of PHP''s core, so it is possible to apply any of them in your
    string without needing to make installations of any sort.


    1. `addcslashes()`: This function is used to return a string using backslashes
    to precede any specific character.

    2. `addcslashes()`: This function is used in returning a string using backslashes
    to precede any character(s) that has to be escaped. Characters in this function
    include NULL, backslash (`\`), double quote ("), as well as single quotes ('').

    3. `bin2hex()`: This function is used in the conversion of data in binary into
    hexadecimal forms.

    4. `chop()`: This function is used in stripping whitespaces, other characters
    as well from one end of a string. It is an alias to the function `rtrim()`.

    5. `chr()`: This function is used in returning a string with one character comprising
    of the character specified by ASCII.

