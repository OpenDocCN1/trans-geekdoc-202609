  trans: "\n\n# 第十四章：PHP 中的 Get 和 Post 方法\n\nHTTP（超文本传输协议）被用于在服务器和客户端之间建立连接。HTTP 作为服务器与客户端之间请求与响应的协议运行。客户端浏览器提交一个\
    \ HTTP 请求，客户端期望服务器返回某种形式的响应。响应包含有关所提请求的状态数据，有时可能包含客户端请求的内容。\n\nHTTP 有两种类型的请求方法。它们是：GET\
    \ 方法和 POST 方法。\n\n在浏览器开始发送信息之前，它使用一种名为 URL 编码的方案对信息进行编码。通过这种方案，值或键值对通常使用等号连接，不同的键值对使用使用&\
    \ 符号隔开。`name1=value1&name2=value2&name3=value3`。空格通常会被消除并用字符 `+` 替换，所有非字母数字字符都会替换为十六进制值。一旦信息成功编码，它就会直接传输到服务器。\n\
    \n## GET 方法\n\n此方法用于从给定的资源请求数据。对于 GET 方法，数据通过 URL 参数转发，这些参数通常是使用连接符 (`&`) 分隔的值和键值对字符串。通常情况下，包含\
    \ GET 数据的 URL 往往采用如下格式：\n\n示例：`http://www.example.com/action.php?name=Jerry&height=5`\n\
    \n原理：在 URL 中，**粗体部分**代表 GET 参数，而*斜体部分*代表分配给这些参数的值。通过使用连接符 (`&`) 拼接，可以在 URL 中嵌入多个参数。在\
    \ GET 方法中，用户只能发送简单的文本数据。\n\n输入：\n```php\n<?php\nif($_GET[\"name\"] || $_GET[\"\
    weight\"]) {\n    echo \"Welcome \". . $_GET['height']. \"<br />\";\n    echo\
    \ \"You are \". . $_GET['height'] . \" cms in height.\";\n    exit();\n}\n?>\n\
    <html>\n<body>\n    <form action=\"<?php $_PHP_SELF; ?>\" method=\"GET\">\n  \
    \      Name: <input type=\"text\" name=\"name\" />\n        Weight: <input type=\"\
    text\" name=\"height\" />\n        <input type=\"submit\" />\n    </form>\n</body>\n\
    </html>\n```\n\n执行时，输出如下：Name: Height: Submit\n\n*   GET 方法会创建一个长字符串，该字符串可以在服务器日志或浏览器的\
    \ `Location:` 框中找到。\n*   GET 方法有字符限制，一次最多允许 1024 个字符。\n*   请记住，当您需要向服务器发送密码或其他高优先级数据时，切勿使用\
    \ GET 方法。\n*   使用 GET 方法无法向服务器发送二进制数据（如 Word 文档或图像）。\n*   可以使用环境变量 `QUERY_STRING`\
    \ 来访问通过 GET 方法发送的数据。\n*   PHP 使用 GET 方法并提供了一个 `$_GET` 关联数组，用于访问每个被发送的信息。\n\n###\
    \ 使用 GET 方法的优点\n1. 由于通过 GET 方法 发送的数据显示在 URL 中，因此完全可以使用指定的查询字符串值对页面进行书签标记。\n2.\
    \ GET 请求可以缓存，并且 GET 请求倾向于保留在浏览历史记录中。\n3. GET 请求也可以被书签。\n\n### 使用 GET 方法的缺点\n1.\
    \ GET 方法非常不适合传输用户密码和用户名等敏感数据，因为这些数据倾向于在 URL 查询字符串中完全显示，而且它们可能被存储在客户端浏览器的内存中作为最近访问页面。\n\
    2. 由于 GET 方法倾向于将数据分配给服务器的环境变量，因此 URL 的长度存在限制。结果是，可以传输的数据总量受到抑制。\n\n## POST 方法\n\
    \nPOST 方法用于提交数据以将其解析到给定的资源。对于 POST 方法，信息通过 HTTP 头部传输。信息的编码方式与 GET 方法的编码过程类似，然后被放置在名为\
    \ `QUERY_STRING` 的标头中。对于 POST 方法，数据以包含在与处理脚本的清晰通信中的“包”的形式转发到服务器。通过 POST 方法转发的数据倾向于在\
    \ URL 中是不可见的。\n\n示例：`POST /test/demo_`\n\n原理：通过 POST 方法转发的数据倾向于在 URL 中是不可见的。\n\
    \n示例：`POST /test/demo_`\n\n输入：\n```php\n<?php\nif($_POST[\"name\"] || $_POST[\"\
    weight\"]) {\n    if (preg_match(\"/[a-z]/\", $_POST['name'])) {\n        echo\
    \ \"Welcome \". . $_GET['height']. \"<br />\";\n        echo \"You are \". . $_GET['height']\
    \ . \" cms in height.\";\n        exit();\n    }\n}\n?>\n<html>\n<body>\n    <form\
    \ action=\"<?php $_PHP_SELF; ?>\" method=\"POST\">\n        Name: <input type=\"\
    text\" name=\"name\" />\n        Weight: <input type=\"text\" name=\"height\"\
    \ />\n        <input type=\"submit\" />\n    </form>\n</body>\n</html>\n```\n\n\
    执行时，输出如下：Name: Height: Submit\n\n*   GET 方法会创建一个长字符串，该字符串可以在服务器日志或浏览器的 `Location:`\
    \ 框中找到。\n*   GET 方法有字符限制，一次最多允许 1024 个字符。\n*   请记住，当您需要向服务器发送密码或其他高优先级数据时，切勿使用\
    \ GET 方法。\n*   使用 GET 方法无法向服务器发送二进制数据（如 Word 文档或图像）。\n*   可以使用环境变量 `QUERY_STRING`\
    \ 来访问通过 GET 方法发送的数据。\n*   PHP 使用 GET 方法并提供了一个 `$_GET` 关联数组，用于访问每个被发送的信息。\n\n（等一下，让我仔细处理提供的文本，因为\
    \ POST 部分在某些地方混乱/重复了 GET 方法逻辑)。\n\n**修改后的 POST 部分：**\n\npost 方法用于提交数据以将其解析到给定的资源。对于\
    \ POST 方法，信息通过 HTTP 头部传输。信息的编码方式与 GET 方法的编码过程类似，然后被放置在名为 `QUERY_STRING` 的标头中。对于\
    \ POST 方法，数据以包含在与处理脚本的清晰通信中的“包”的形式转发到服务器。通过 POST 方法转发的数据倾向于在 URL 中是不可见的。\n\n示例：`POST\
    \ /test/demo_`\n\n原理：通过 POST 方法转发的数据倾向于在 URL 中是不可见的。\n\n输入：\n```php\n<?php\nif($_POST[\"\
    name\"] || $_POST[\"weight\"]) {\n    if (preg_match(\"/[a-z]/\", $_POST['name']))\
    \ {\n        echo \"Welcome \". . $_GET['height']. \"<br />\";\n        echo \"\
    You are \". . $_GET['height'] . \" cms in height.\";\n        exit();\n    }\n\
    }\n?>\n<html>\n<body>\n    <form action=\"<?php $_PHP_SELF; ?>\" method=\"POST\"\
    >\n        Name: <input type=\"text\" name=\"name\" />\n        Weight: <input\
    \ type=\"text\" name=\"height\" />\n        <input type=\"submit\" />\n    </form>\n\
    </body>\n</html>\n```\n\n### 使用 POST 方法的优点\n1. POST 方法在安全性上高于 GET 方法，因为信息永远不会显示在查询字符串或日志中。\n\
    2. POST 方法对于传递的数据边界大得多，用户可以轻松地转发二进制数据（上传文件或图像）和文本数据。\n\n### 使用 POST 方法的缺点\n1.\
    \ 由于通过 POST 方法转发的数据未显示在 URL 中，无法对任何给查询进行书签。\n2. 此外，POST 请求不会被缓存。\n3. POST 请求不会保存在浏览器历史记录中，因此它没有日志。\n\
    \n## $_REQUEST 变量\n\nPHP 中的 `$_REQUEST` 变量由三个变量组成：`$_COOKIE`、`$_POST` 和 `$_GET`。`$_REQUEST`\
    \ 变量可用于获取通过 POST 和 GET 方法转发表单的结果。\n\n输入：\n```php\n<?php\nif($_REQUEST[\"name\"\
    ] || $_REQUEST[\"height\"]) {\n    echo \"Welcome \". . $_REQUEST['name']. \"\
    <br />\";\n    echo \"You are in\". . $_REQUEST['height'] . \" meters tall.\"\
    ;\n    exit();\n}\n?>\n<html>\n<body>\n    <form action=\"<?php $_PHP_SELF; ?>\"\
    \ method=\"POST\">\n        Name: <input type=\"text\" name=\"name\" />\n    \
    \    Height: <input type=\"text\" name=\"height\" />\n        <input type=\"submit\"\
    \ />\n    </form>\n</body>\n</html>\n```\n\n## 练习 14\n1. 在安全性方面，POST 方法为什么比 GET\
    \ 方法更好？\n\n"
- fmt: "\n## 2. What method can have its request bookmarked?\n\n## 3. How does HTTP\
    \ work?\n\n## Chapter Fifteen: File Inclusion in PHP\n\nIt is possible to add\
    \ the content of a PHP file into another file before processing it with a server.\
    \ In general, two types of PHP functions can be applied in adding a PHP file into\
    \ a second PHP file. They are: The `require()` function; and the `include()` function.\
    \ In PHP, this is an activity of high import, because it aids the creation of\
    \ headers, elements, footers, and functions which can be reintroduced in several\
    \ different pages. It aids developers in devising straightforward ways of modifying\
    \ the layout of an entire website while applying only minimal effort. If then,\
    \ any form of alterations is necessary rather than modifying tons of files, the\
    \ added file can just be changed instead.\n\n### The `include()` Function\n\n\
    This function is used in taking every text contained within a particular file\
    \ and copying it into a file that the `include` function is applied in. When processing\
    \ a file, should any issue whatsoever be encountered, the `include()` function\
    \ throws a warning, although execution continues on the file regardless. Take,\
    \ for instance, you wish to create a common menu for your webpage. Proceed to\
    \ create a file `menu.php` using the commands shown below:\n\n```html\n<a href=\"\
    http://www.sampledomain.com/index.htm\">Home</a> - <a href=\"http://www.sampledomain.com/ebxml\"\
    >ebXML</a> - <a href=\"http://www.sampledomain.com/ajax\">AJAX</a> - <a href=\"\
    http://www.sampledomain.com/perl\">PERL</a>\n```\n\nOnce you have succeeded with\
    \ that, go ahead and create as much pages as you would like. Proceed go add the\
    \ file shown below to develop a header. Take, for instance, your `test.php` file\
    \ could contain the codes shown below:\n\n```php\n<html>\n<body>\n  <?php include(\"\
    menu.php\"); ?>\n  <p>This is an example to show how to include PHP file!</p>\n\
    </body>\n</html>\n```\n\nWhen the script is parsed, the result is as follows:\
    \ Home - ebXML AJAX – PERL. This is a sample to demonstrate how to include a PHP\
    \ file.\n\n### The `require()` Function\n\nThis function is used in taking text\
    \ found in a given file and copying them into a file in which the `include` function\
    \ is used on. Should any problems arise during the process of executing a file,\
    \ the `require()` function is responsible for throwing a fatal error badly pausing\
    \ the running of the said file. In this vein, it can be seen that the disparity\
    \ between both the `require()` and `include()` functions non-existent, except\
    \ in the case of handling error situations. In this sense, the `require()` function\
    \ is a better, more recommended alternative for use instead of the `include()`\
    \ function. The reason is that the processing of scripts ought not to continue\
    \ when errors, such as misnaming or missing files are discovered.\n\nYou can attempt\
    \ to make use of the `require()` function for the sample above, and the result\
    \ generated is no different. However, if you want to follow a second sample in\
    \ which the file is non-existent, then the result obtained is different for both\
    \ `include()` and `require()` functions.\n\n```php\n<html>\n<body>\n  <?php include(\"\
    xxmenu.php\"); ?>\n  <p>This is a sample to demonstrate how an incorrect PHP file\
    \ can be included!</p>\n</body>\n</html>\n```\n\nWhen the script is processed,\
    \ the result obtained is as follows: This is a sample to demonstrate how an incorrect\
    \ PHP file can be included! Having done that, let’s try out the same sample using\
    \ the `require()` function this time:\n\n```php\n<html>\n<body>\n  <?php require(\"\
    xxmenu.php\"); ?>\n  <p> This is a sample to demonstrate how an incorrect PHP\
    \ file can be included!</p>\n</body>\n</html>\n```\n\nWhen the file is processed\
    \ in this case, it draws to a halt, and nothing is outputted. Keep in mind that\
    \ there is a tendency of fatal error or plain warning messages to be reported.\
    \ In some cases, nothing even. Everything all boils down to the set-up of your\
    \ PHP server.\n\n### Exercise 15:\n\n1. What function takes all texts contained\
    \ in a file and copies them to a file with an `include()` function?\n2. What is\
    \ the purpose of the `include()` function?\n\n## Chapter Sixteen: Coding Standards\
    \ and Conventions in PHP\n\nFor every organization, there is a specific standard\
    \ of coding that is in line with what they consider to be their best practices.\
    \ Coding standards and conventions are necessary since many developers may sometimes\
    \ be working on diverse modules. And should they begin developing standards of\
    \ their own, the source becomes quite difficult to manage indeed, and managing\
    \ source codes in coming times becomes difficult, if not impossible altogether.\
    \ Below are many different rationales behind the use of coding standards and conventions:\n\
    \n- For programmers and their peers to comprehend the code that is produced. A\
    \ coding standard serves in the role of a blueprint in intimating the team with\
    \ the details of the code.\n- Clarity and simplicity attained through consistent\
    \ coding could save a user from traditional errors.\n- For better comprehension\
    \ of code, especially after it is revised over a given timeframe.\n- It is the\
    \ standard of companies to go with a specific standard in bringing more quality\
    \ into software.\n\nIn PHP, there are specific standards that ought to be followed\
    \ when coding. They are including but not limited to the following:\n\n**Line\
    \ Length and Indentation**: Make use of an indent of no more than 4 spaces and\
    \ don't apply any tab as different computers make use of varying settings for\
    \ their tab function. It is advisable to maintain the lines between 75 and 85\
    \ characters in length to improve the readability of code.\n\n**Control Structures**:\
    \ Control structures are made up of `while`, `if`, `switch`, `for`, among others.\
    \ When coding, control statements should be written with a space between the opening\
    \ parenthesis and the control keyword. The reason for this is to differentiate\
    \ control keywords from function calls. It is strongly advised to use curly braces\
    \ at all times, even in conditions where they technically optional. Samples:\n\
    \n```php\nif ((condition1) || (condition2)) {\n    action1;\n} elseif ((condition3)\
    \ && (condition4)) {\n    action2;\n} else {\n    default action;\n}\n```\n\n\
    It is possible to write switch statements in the manner below:\n\n```php\nswitch\
    \ (condition) {\n  case 1:\n    action1;\n    break;\n  case 2:\n    action2;\n\
    \    break;\n  default:\n    defaultaction;\n    break;\n}\n```\n\n**Function\
    \ Calls**: Functions ought to be called without any space between the name of\
    \ the function, the first parameter, and the opening parenthesis. Also, there\
    \ ought to be spaces between each parameter and ensuing commas, and no space used\
    \ between the final parameter, a semicolon, and the closing parenthesis. Consider\
    \ the sample shown below:\n\n```php\n$var = foo($open, $close, $value);\n```\n\
    \n**Function Definitions**: Function declarations are usually tailored according\
    \ to the BSD/Allman style.\n\n```php\nfunction fooFunction($arg1, $arg2 = '')\
    \ {\n    if (condition) {\n        statement;\n    }\n    return $val;\n}\n```\n\
    \n**Comments**: Standard C++ comments (`//`) and C-styled comments (`/* */`) are\
    \ not a problem. However, making use of shell-styled or Perl comments (`#`) is\
    \ drowned upon.\n\n**PHP code tags**: Ensure to use `<?php ?>` in delimiting pho\
    \ codes rather than the shorthand version `<? ?>`. The reason is that the former\
    \ method is in compliance with PHP standards, and serves as the most portable\
    \ method of introducing PHP codes into different setups and operating systems.\n\
    \n**Variable names**:\n\n- Make use of lower case letters only.\n- Make use of\
    \ underscore (`_`) in separating words.\n- `g` should be used in prepending global\
    \ variables in a code.\n- Global constants should be written in capital letters\
    \ with underscores (`_`) used as separators.\n- `s` should be used in prepending\
    \ static variables.\n"
