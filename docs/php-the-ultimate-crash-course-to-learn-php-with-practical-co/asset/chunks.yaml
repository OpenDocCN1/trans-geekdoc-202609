    ### PHP 函数概念


    3. 这样当调用函数的程序无法执行时，参数仍有值可以运行。

    4. 通过在函数调用或函数定义中的变量名中加入取地址符号 `&` 来。

    5. 函数可以被看作一段接收输入（通常是参数的形式）、进行处理并返回值的代码。

    6. 所有函数名都必须以下划线或字母开头。

    7. 参数与变量非常相似；然而，它通常指定在附加在函数名括号内。它用于在代码中向函数传递信息。

    8. 类型声明是在 PHP 7 中引入的。它允许用户在声明函数时指定任何预期的数据类型，并且通过引入“strict”（严格）声明，在发生数据类型不匹配时会抛出
    `Fatal Error`。

    9. 在 PHP 中，多个参数之间使用逗号分隔。

    10. 左大括号 `{` 表示函数代码的开始，右大括号 `}` 则用于指示函数的终点。


    ### 练习 12


    1. 位于 Web 服务器中的 PHP 引擎会解析或处理网页中的 PHP 代码，从而动态生成 HTML。

    2. `fwrite()` 函数使得在 PHP 中编写新文件以及向现有文件追加文本成为可能。

    3. 可以使用 `filesize()` 函数发现文件长度，该函数使用文件名作为参数，并以字节为单位返回文件大小的表达式。

    4. `index.php` 文件是当用户的浏览器向启用了 PHP 的 Web 服务器请求目录时，默认加载的文件。

    5. `fopen` 函数返回值 `FALSE`。

    6. 文件系统函数用于访问和操作提供的文件系统，为用户提供进行文件操作所需的各种可能的功能。

    7. `file_exist()` 函数用于确认文件是否存在，并以文件名作为参数。

    8. `fopen()` 函数。

    9. 文件指针。

    10. 文件是包含超文本预处理器（PHP）代码的网页。


    ### 练习 13


    1. PHP 中的 `header()` 函数用于将浏览器重定向到其他位置。

    2. `rand()` 函数用于在特定范围内生成随机数。

    3. `HTTP_USER_AGENT` 用于识别用户的操作系统和浏览器。

    4. 这里的 Web 概念演示了 PHP 如何能够根据浏览器类型、用户输入和随机生成的数字提供动态内容。

