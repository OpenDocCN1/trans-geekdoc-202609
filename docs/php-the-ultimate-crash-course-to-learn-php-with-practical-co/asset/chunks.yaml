    \ a sample of a multi-line comment for better understanding: <? /\\* This is a\
    \ comment with multi-line Author: Jane Do e Purpose: Multiline Comments Demo Subject:\
    \ PHP \\*/ print \"A sample with multi-line comments\"; ?> Whitespace Insensitivity:\
    \ Whitespaces refer to the parts of codes that are invisible to the eyes when\
    \ typed. They include tabs, spaces, and carriage returns (that is, end-of-line\
    \ characters). The Insensitivity of PHP to whitespaces implies that the number\
    \ of whitespace characters in a row is inconsequential because a single whitespace\
    \ character is seen the same way as many whitespace characters. Take for instance,\
    \ in each of the PHP statements shown below, the statements that assign the 5\
    \ + 1 operating to the outputted variable $six are equal: $six = 5 + 1; // single\
    \ spaces $six <tab>=<tab2<tab>+<tab>2 ; // spaces and tab s $six = 5+ 1; // multiple\
    \ lines Case Sensitivity: PHP is a very case sensitive programming language; meaning,\
    \ it interprets variables in different cases distinctly. For example, the entries\
    \ PHP, php, and pHp will be interpreted differently instead of as the same thing.\
    \ Consider the code example below: <html> <body> <?php $profit = 34; print(\"\
    Variable profit is $profit<br>\"); print(\"Variable PrOfiT is $PrOfiT<br>\");\
    \ ? > </body> </html> When executed, the results of this code will be: Variable\
    \ profit is 34 Variable PrOfiT is… Statements are Expressions Ended using Semicolons:\
    \ In PHP, a statement refers to by form of expression that is terminated using\
    \ a semicolon (;). A series of valid statements in PHP represents a valid PHP\
    \ program, especially if it is encased in PHP tags. Take an example of a common\
    \ PHP statement shown below that is used in assigning a set of characters to the\
    \ variable $greeting: $greeting = \"Welcome to PHP!\" Expressions are a combination\
    \ of tokens: Tokens are the smallest, indivisible building blocks that make up\
    \ a PHP program. They could get constants (e.g. FALSE),  variables (e.g. $greeting),\
    \ numbers (e.g. (π) 3.14159), and strings (e.g. .two.). Tokens could also include\
    \ the special characters that contribute to PHP syntax, such as for, else, if,\
    \ while, among others. Braces Form Blocks: Even though it is impossible to combine\
    \ statements similarly to expressions, it is possible to place a set of statements\
    \ in all the places a statement can be in by encasing them within a pair of curly\
    \ braces. Consider the sample below containing two statements of which both are\
    \ equal: if (7 == 4 + 3) print(\"Great - I haven't completely lost my mind.<br>\"\
    ); if (7 == 4 + 3) { print(\"Great - I haven't completely\"); print(\"lost my\
    \ mind.<br>\"); } How to Execute PHP Scripts from the Command Prompt: It is possible\
    \ to execute PHP scripts from the command prompt of your computer. Let's say you\
    \ have the content shown below in a test.php file. <?php echo \"Hello PHP!!!\"\
    ; ?> Proceed to execute this script shown above using your command prompt in the\
    \ following ways: $ phptest.php The result outputted will take after this fashion\
    \ : Hello PHP!!! Exercise 3: \n\n1.  What is the use of a semicolon in PHP? \n\
    \n2.  What are tokens? \n\n3.  Define the term 'comments.' \n\n4.  Explain the\
    \ case-sensitive nature of PHP. \n\n5.  What constitutes a valid program in PHP?\
    \ \n\n6.  Explain the insensitivity of PHP to whitespaces. \n\n7.  What are multi-line\
    \ comments used for? \n\n8.  State the conditions necessary for processing short\
    \ tags in PHP. \n\n9.  What is the function of the Escaping to PHP mechanism?\
    \ \n\n10.  What type of tag in PHP assures a user of correct interpretations of\
    \ tags regardless of the condition? \n\nChapter Four Variables in PHP There is\
    \ one primary process of storing information within the body of a PHP program.\
    \ This process is done with the help of a variable. To better understand the concept\
    \ of variables in PHP, below are some crucial points to take into consideration:\
    \ \n\n1.  Every variable used in PHP is represented with a preceding $ (dollar\
    \ sign). \n\n2.  Any value outputted by a variable is an indication of the most\
    \ recent value assigned to it. \n\n3.  To assign a variable, the equal to (=)\
    \ operator is used, with the variable placed on the left-hand area while the evaluated\
    \ expression takes the spot to the right of the operator. \n\n4.  Although it\
    \ is possible to declare variables before assigning them, it is not compulsory\
    \ to do so. "
