    in the data type. In the sample outlined below, we attempt to forward both a string
    and a number into a function without introducing "strict." Sample : <?php function
    addNumbers(int $x, int $y) { return $x + $y; } echo addNumbers(2, "2 days"); //
    since strict is NOT enabled "2 days" is changed to int(2), and it returns 4 ?>
    To introduce strict into the fray, we have to set declare(strict\_types=1); and
