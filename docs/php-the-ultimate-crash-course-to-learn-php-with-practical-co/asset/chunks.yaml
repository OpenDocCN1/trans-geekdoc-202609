    ### PHP Function Concepts


    3. So that when the program that calls the function is unable to execute, parameters
    have a value to run with.

    4. By the inclusion of an ampersand into the name of the variable in either the
    function call or function definition.

    5. A function can be seen as a piece of code which takes in inputs, usually in
    the form of parameters, processes and returns values.

    6. All function names have to begin with an underscore or letter.

    7. An argument is quite similar to a variable; however, it is usually specified
    inside the parenthesis attached to the name of a function. It is used in the transfer
    of information to functions in a code.

    8. Type declarations were introduced in PHP 7. It grants users the ability to
    specify any expected data type while declaring a function, and by introducing
    the “strict” declaration, a `Fatal Error` is thrown in the occurrence of a mismatch
    in the data type.

    9. Multiple arguments are separated using commas in PHP.

    10. The opening curly braces is an indication of the starting of the function
    code, while the closing curly brace is used to indicate the terminal point of
    the function.


    ### Exercise 12


    1. The PHP engine located in web servers parses or processes PHP codes in webpages,
    resulting in the dynamic generation of HTML.

    2. The `fwrite()` function makes it possible to write a new file in PHP, as well
    as append a text into an already existing one.

    3. The length of the files can be discovered by use of the function `filesize()`
    which uses the name of the file as an argument and returns the size of the file
    as an expression in bytes.

    4. An `index.php` file is a file loaded by default any time the web browsers of
    a user request for directories from PHP-enabled web servers.

    5. The `fopen` function returns the value `FALSE`.

    6. File system functions are used in accessing and manipulating the file systems
    provided to equip users with every possible function necessary for file manipulation.

    7. The `file_exist()` function is used to confirm the existence of a file and
    take the file name as an argument.

    8. The `fopen()` function.

    9. A file pointer.

    10. Files are webpages that contain Hypertext Pre-processor (PHP) codes.


    ### Exercise 13


    1. The function `header()` in PHP is used in redirecting a browser to other locations.

    2. The function `rand()` is used in the generation of random numbers within a
    specific range.

    3. `HTTP_USER_AGENT` is used to identify the operating system and browser of users.

    4. Web concepts are the demonstration of how PHP is capable of providing dynamic
    content based on browser type, user input, and randomly created numbers.

    5. To avoid the loading of other parts of a page the redirection script must be
    placed at the top area of the page.


    ### Exercise 14


    1. The `POST` method has a higher level of security than the `GET` method because
    the information entered by the user is never shown in the query string of the
    URL or the logs of the server.

    2. The `GET` method.

    3. HTTP serves as a protocol of request and response between the server and clients.


    ### Exercise 15


    1. The `require()` function.

    2. It is used in taking all the texts contained in a selected file and copying
    it into a file that the `include` function is applied in.


    ### Exercise 16


    1. `g` is used to prepend the global variables within a code.

    2. Functions ought to be called without spaces between the name of the function,
    the first parameter, and the opening parenthesis.

    3. The reason is so that control keywords can be differentiated from function
    calls.

    4. For easier management of source codes.

    5. 75 to 85.


    ### Exercise 17


    1. The generally accepted method of deleting cookies involves calling the `setcookie()`
    function using just the name argument.

    2. Gaining access to cookies with PHP.

    3. The `path` variable.

    4. In the `expires` field.

    5. Tracking client usage.

