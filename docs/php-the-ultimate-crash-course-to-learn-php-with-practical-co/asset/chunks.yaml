    3.  w: This opens the file in writing mode only. The file pointer is placed at\
    \ the starting of the file. Also, the file length is truncated to zero, and should\
    \ the file not already exist; it tries to create a file. \n\n4.  w+: This opens\
    \ the file in a reading and writing mode alone. The file pointer is placed at\
    \ the starting of the file. Also, the file length is truncated to zero, and should\
    \ the file not already exist; it tries to create a file. \n\n5.  a: This opens\
    \ the file in writing mode only. The file pointer is placed at the end of the\
    \ file. Also, should the file not already exist, it tries to create a file. \n\
    \n6.  a+: This opens the file in a reading and writing mode alone. The file pointer\
    \ is placed at the end of the file. Also, should the file not already exist, it\
    \ tries to create a file. \n\nShould any attempt to open a file fail, then the\
    \ fopen() function returns the value false; otherwise, a file pointer is returned\
    \ to be used for writing or reading the said file even further. Once changes have\
    \ been made to an opened file, the fclose() function must be applied to close\
    \ it. A file pointer is required to serve as an argument for the fclose() function.\
    \ In turn, it returns as true once the closure is successful, and false when it\
    \ doesn't. How to read a file in PHP: Once the fopen() function is applied to\
    \ open a file, the fread() function can be applied to read the file. In both cases,\
    \ it has to be both the length of the file shown in bytes, and the file pointer\
