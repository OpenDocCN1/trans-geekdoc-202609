    3. `/`: 此运算符用于将被除数除以除数。例如 `Y / X` 结果为 3。


    4. `%`: 此运算符称为模运算符，用于计算整数除法后的余数。例如 `Y % X` 结果为 0。


    5. `++`: 此运算符称为递增运算符，用于将整数的值加一。例如 `Y++` 结果为 16。


    6. `--`: 此运算符称为递减运算符，用于将整数的值减一。例如 `X--` 结果为 4。


    ## 比较运算符

    下文将讨论 PHP 支持的比较运算符：为了更好地理解，将包含示例以说明其功能。在示例中，变量 `X` 的值为 5，变量 `Y` 的值为 15。


    1. `==`: 此运算符用于判断两个操作数的值是否相等。例如 `(X == Y)` 为假。


    2. `!=`: 此运算符用于检查两个操作数的值是否相等。如果值不相等，则条件返回真。例如 `(X != Y)` 为真。


    3. `>`: 此运算符用于检查左操作数的值是否大于右操作数的值。如果答案为是，则条件返回真。例如 `(X > Y)` 为假。


    4. `<`: 此运算符用于检查左操作数的值是否小于右操作数的值。如果答案为是，则条件返回真。例如 `(X < Y)` 为真。


    5. `>=`: 此运算符用于检查左操作数的值是否大于或等于右操作数的值。如果答案为是，则条件返回真。例如 `(X >= Y)` 为假。


    6. `<=`: 此运算符用于检查左操作数的值是否小于或等于右操作数的值。如果答案为是，则条件返回真。例如 `(X <= Y)` 为真。


    ## 逻辑运算符

    下文将讨论 PHP 支持的逻辑运算符：为了更好地理解，将包含示例以说明其功能。在示例中，变量 `X` 的值为 5，变量 `Y` 的值为 15。


    1. `and`: 此运算符称为逻辑与运算符。当两个操作数都为真时，条件返回真。例如 `(X and Y)` 为真。


    2. `or`: 此运算符称为逻辑或运算符。当两个操作数都非零时，条件返回真。例如 `(X or Y)` 为真。


    3. `&&`: 此运算符称为逻辑与运算符。当两个操作数都非零时，条件返回真。例如 `(X && Y)` 为真。


    4. `||`: 此运算符称为逻辑或运算符。当两个操作数都非零时，条件返回真。例如 `(X || Y)` 为真。


    5. `!`: 此运算符称为逻辑非运算符。它用于反转操作数的逻辑状态。当条件为真时，逻辑非运算符将其转为假。例如 `!(X && Y)` 为假。


    ## 赋值运算符

    下文将讨论 PHP 支持的赋值运算符：


    1. `=`: 这是一个简单的赋值运算符，将右侧操作数的值赋值给左侧操作数。例如 `Z = X + Y` 将将运算 `(X + Y)` 的结果赋值给 `Z`。


    2. `+=`: 这是一个加赋值运算符。它将右侧操作数加到左侧操作数上，并将返回的值赋值给左操作数。例如 `Z += X` 等同于 `Z = Z + X`。


    3. `-=`: 这是一个减赋值运算符。它将右侧操作数从左侧操作数中减去，并将返回的值赋值给左操作数。例如 `Z -= X` 等同于 `Z = Z - X`。


    4. `*=`: 这是一个乘赋值运算符。它将左侧操作数乘以右侧操作数，并将返回的值赋值给左操作数。例如 `Z *= X` 等同于 `Z = Z * X`。


    5. `/=`: 这是一个除赋值运算符。它将左侧操作数除以右侧操作数，并将返回的值赋值给左操作数。例如 `Z /= X` 等同于 `Z = Z / X`。


    6. `%=`: 这是一个模赋值运算符。它将左侧操作数对右侧操作数取模，并将返回的值赋值给左操作数。例如 `Z %= X` 等同于 `Z = Z % X`。


    ## 条件运算符

    条件运算符用于评估表达式的真值或假值，然后根据评估过程的结果执行两个输出语句之一。PHP 支持的条件运算符语法下所示：


    1. `?:`: 在 PHP 中，此运算符表示条件表达式。例如：当条件为真时 `?` 取值 A `:` 否则取值 B。


    ## 运算符分类

    除了运算符类型外，还有四种运算符所属的分类：


    ### 一元运算符

    一元运算符有 `!`、`++` 和 `--`。


    ### 二元运算符

    二元运算符需要两个操作数。


    ### 乘法运算符

    乘法运算符有 `*`、`%` 和 `/`。


    ### 加法运算符

    加运算符有 `+` 和 `-`。


    ### 关系运算符

    关系运算符有 `<`、`<=`、`>` 和 `>=`。


    ### 等价运算符

    等价运算符包括 `==` 和 `!=`。


    ### 逻辑运算符

    逻辑与运算符为 `&&`。逻辑或运算符为 `||`。


    ### 条件运算符

    条件运算符为 `?:`。它们需要三个操作数。


    ### 赋值运算符

    赋值运算符包括：`=`、`+=`、`-=`、`*=`、`/=` 和 `%=`。


    运算符优先级决定了项的组合方式。某些运算符在优先级上高于其他运算符，因此它们倾向于先被评估。考虑示例 `j = 2 - 4 * 3`；结果为 -10 而不是
    -6。乘法运算符的优先级高于减法运算符。在数学术语中，该表达式可以解释为 `2 - (4 * 3)`。


