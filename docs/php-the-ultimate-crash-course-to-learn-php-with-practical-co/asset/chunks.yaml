    When the code is executed, the returned value will be as follows: This is a tes
    t Dynamic Function Calls: Assigning function names to variables and strings is
    a fairly common and possible activity in function operations. In this case, though,
    the variables are regarded in the same manner as the function name would itself.
    The sample shown below clearly depicts how this occurs: <html> <head> <title>Dynamic
