  trans: "\n\n## 编码规范\n\n**使函数可重入**：函数不应保持会阻止函数可重入的静态变量。\n**对齐声明块**：声明块应当处于可对齐的状态。\n\
    **每行一个语句**：每行不应多于一个语句，除非该行中的语句之间有非常紧密的关系。\n**短函数或方法**：方法应限制在单页代码内。\n\n在编写 PHP\
    \ 程序时，还有许多其他约定和标准。但通常情况下，代码的意图在长度上必须保持某种程度的一致性；只有在充分遵守编码规范和约定时，这才是可能的。此外，如果你有不同的偏好，可以快速制定你自己的编码规范。\n\
    \n### 练习 16\n\n1. 代码中 \"g\" 的作用是什么？\n2. 编写函数调用的编码规范和约定是什么？\n3. 控制结构编码规范概念背后的思想是什么？\n\
    4. 开发编码规范和约的原因是什么？\n5. 为了良好的可读性，推荐的每行字符长度是多少？\n\n## 第十七章：PHP 中的 Cookies\n\nCookies\
    \ 是存储在客户端计算机上的文本文件，用于跟踪使用情况。PHP 能够支持 HTTP cookies。在识别返回用户时，涉及三种方法。它们包括：\n\n* 服务器脚本向浏览器发送一系列\
    \ cookies。例如标识、有效期、名称等。\n* 浏览器在本地机器上存储数据供以后使用。\n* 下次浏览器向 Web 服务器发送请求时，后者会将存储在\
    \ cookies 中的信息发送回来。\n\n在本节中，你将学习设置 cookies 的基础知识、访问它们以及删除它们。\n\n### Cookie 基础\n\
    \nCookies 通常构建在 HTTP 头中，尽管可以在 `JavaScript` 中直接在浏览器设置 cookie。PHP 脚本生成的 cookie 头如下：\n\
    \n```http\nHTTP/1.1 200 OK\nDate: Fri, 04 Feb 2000 21:03:38 GMT\nServer: Apache/1.3\
    \ (UNIX) PHP/4.0\nSet-Cookie: name=xyz; expires=Friday, 04-Feb-07 22:03:38 GMT;\
    \ path=/; domain=tutorial.com\nConnection: close\n```\n```\n从示例可以看出，`Set-Cookie`\
    \ 头包含域名、路径、GMT 日期和键值对。\n\n值和名称通常编码在 URL 中。`expires` 字段代表给浏览器的过期信息。如果浏览器配置了存储 cookies，则\
    \ cookie 在过期之前保留。当用户进入 cookie 路径的任何页面时，cookie 会发送到服务器。\n\n浏览器头通常如下：\n\n```http\n\
    GET / HTTP/1.0\nConnection: Keep-Alive\nUser-Agent: Mozilla/4.6 (Linux; 2.2.6)\n\
    Host: zink.co.uk\nAccept: image/gif,*\nAccept-Encoding: gzip\nAccept-Language:\
    \ en\nAccept-Charset: iso-8859-1,utf-8\nCookie: name=xyz\n```\n\n然后可以通过环境变量 `$_COOKIE`\
    \ 和 `$_HTTP_COOKIE_VARS` 让 PHP 脚本访问 cookie。上述，可以使用 `$_HTTP_COOKIE_VARS[\"name\"\
    ]` 访问 cookies。\n\n### 在 PHP 中设置 Cookies\n\nPHP 提供了 `setcookie()` 函数用于设置 cookie。该函数需要多个参数，并且必须在\
    \ `<html>` 标签之前调用。每个 cookie 必须单独调用该函数。\n\n```php\nsetcookie(name, value, expire,\
    \ path, domain, security);\n```\n\n以下是 cookies 中使用的参数详细列出：\n\n* **Name (名称)**：用于设置\
    \ cookie 的名称，可以在环境变量 `HTTP_COOKIE_VARS` 中找到。在尝试访问 cookies 时使用 `name` 变量。\n* **Value\
    \ (值)**：`value` 变量用于设置变量的值，代表存储的内容。\n* **Expiry (过期)**：`expiry` 变量用于指定未来的时期，如\
    \ 1963 年 1 月 1 日 00:00:00 GMT+1。在此之后，cookie 将变为不可访问。如果此时未设置 `expiry` 参数，cookie\
    \ 在浏览器关闭时会自动过期。\n* **Path (路径)**：`path` 变量用于指定 cookie 有效的目录。斜杠 `/` 允许 cookie 在所有目录中有效。\n\
    * **Domain (域名)**：`domain` 变量用于指定域名，必须至少有两个点才能视为有效。每个 cookie 仅对其创建的域名和主机有效。\n\
    * **Security (安全性)**：可以将 `security` 变量设置为 `1`，并指定 cookie 必须通过 `HTTPS` 安全传输。否则，将其设置为\
    \ `0`，这意味着 cookie 可以通过普通的 `HTTP` 传输。\n\n按照下面的示例将形成两个 cookie：`name` 和 `department`。两个\
    \ cookie 的有效期均为一小时（3600 秒）。\n\n```php\nsetcookie(\"name\", \"Jane Doe\", time()\
    \ + 3600, \"/\");\nsetcookie(\"department\", \"English\", time() + 3600, \"/\"\
    );\n```\n\n### 访问 Cookies\n\n在 PHP 中，有许多访问 cookies 的方法。简单的方法通常是使用 `$_HTTP_COOKIE_VARS`\
    \ 或 `$_COOKIE`。按照上述示例：\n\n```php\necho $_HTTP_COOKIE_VARS[\"name\"];\necho $_COOKIE[\"\
    department\"];\n```\n\n要检查 cookie 的状态（是否设置），可以使用 `isset()` 函数：\n\n```php\nif(isset($_COOKIE[\"\
    name\"])) {\n    echo \"欢迎, \" . $_COOKIE[\"name\"];\n} else {\n    echo \"对不起...\
    \ 用户无效\";\n}\n```\n\n### 在 PHP 中删除 Cookies\n\n在 PHP 中删除 cookies 的通用接受方法围绕着仅使用\
    \ `name` 参数调用 `setcookie()` 函数。由于这并不总是有效，因此不应完全依赖它。最好的替代方案是使用已经过期的日期设置 cookie，如下所示：\n\
    \n```php\nsetcookie(\"name\", \"\", time()-60, \"/\");\nsetcookie(\"department\"\
    , \"\", time()-60, \"/\");\n```\n\n### 练习 17\n\n1. 在 PHP 中如何删除 cookies？\n2. 变量\
    \ `$_HTTP_COOKIE_VARS` 和 `$_COOKIE` 用于什么？\n3. 什么变量用于指定 cookie 有效的目录？\n4. 哪里发送信息以忘记找到的\
    \ cookies？\n5. Cookies 是做什么用的？\n\n### 练习 1 答案\n\n1. PHP 特别适用于超文本标记语言 (HTML) 和\
    \ Web 开发。\n2. PHP 解释器通常位于 CGI（通用网关接口）或 Web 服务器中作为实现模块。\n3. PHP/Fi，意味着个人主页/表单解释器。\n\
    4. Andi Gutmans 和 ZeeySurask。\n5. PHP 4 于 2000 年 5 月发布。\n\n"
