    # 在你的系统上设置 PHP 环境


    为了在 PHP 中构建和执行网页页面，需要在计算机系统中安装三个至关重要的组件。它们包括：


    - **PHP 解析器**：为了处理 PHP 脚本的指令，你必须安装一个解析器来生成可以转发到网络浏览器的 HTML 输出。在接下来的段落中，将有一份教程引导你了解如何在你的系统中安装
    PHP 解析器。

    - **Web 服务器**：PHP 几乎可以应用于每种形式的 Web 服务器软件，包括但不限于微软 Internet 信息服务器 (`IIS`)。然而，它最经常与免费提供的
    `Apache` 服务器配合使用。要获取 `Apache` 服务器，你可以通过此链接下载：`https://httpd.apache.org/download.cgi`。

    - **数据库**：PHP 几乎可以应用于所有形式的数据库软件，包括但不限于 Sybase 和 Oracle；但是，它通常与免费提供的 `MySQL` 数据库配合使用。要获取
    `MySQL` 服务器，你可以通过此链接下载：`https://www.mysql.com/downloads/`。


    ## 如何安装 PHP 解析器


    在继续安装之前，确保你已经在系统中设置好了 PHP 环境，以便使用 PHP 开发 Web 程序。首先，在浏览器的查询框中输入下方地址：`http://127.0.0.1/info.php`。当执行该地址时，将显示一个包含
    PHP 安装相关信息的页面。这意味着你的 Web 服务器和 PHP 已经正确安装。如果没有，你必须使用下方所示的程序在你的系统中安装 `PHP`。


    ## 设置开发环境


    ### 在 Windows 系统上

    安装 Windows 服务器相当昂贵，因此你可能需要转向第三方应用中更便宜的替代方案，这些应用可以安装并设置以提供适用于编码的服务器环境。可以使用的一些应用包括
    `WAMP` 和 `XAMPP`。这些应用都执行在程序内安装 `PHP`、`MySQL` 和 `Apache` 的相同功能。在两个应用中，`XAMPP` 最受用户青睐。你可以从链接
    `www.apachefriends.org` 获取最新的 `XAMPP`，因为它是跨平台的。`XAMPP` 是一个缩写，代表跨平台 (`X`)、`Apache`
    (`A`)、`MariaDB` (`M`)、`PHP` (`P`) 和 `Perl` (`P`)。


    `XAMPP` 的安装过程非常容易执行，所以不应该是问题。另外，请记住可以使用 `XAMPP` 安装 `Laravel`。当安装向导弹出时，点击“下一步”，并在需要时点击“同意”。尽管如此，在开发环境方面，你必须安装所需的开发环境来转换
    `php.ini` 文件并启用显示错误消息。如果未显示错误消息，请访问路径 `c:xampp/php/` 并点击 `php.ini` 文件。确保第 `463`
    行中放置在日志和错误处理下方的所有内容都已开启，然后重新启动你的 `Apache` 服务器。


    当 `XAMPP` 完全安装完成后，应该打开一个仪表板，可用于初始化、结束和设置服务。当你完成 `XAMPP` 的安装并最终将其设置好运行后，访问位于 `c:xampp/htdocs/`
    的 Webroot，这是创建网站和应用程序的工作环境。要检查你的工作，请继续在浏览器的地址栏中访问 `localhost`。这样做应该启动 `htdocs`
    内 index 文件的运行。


    ### 在 Mac 系统上

    Mac 上的安装与 Windows 系统非常相似。设置开发环境最便宜且最直接的方法是通过安装第三方应用。在这种情况下，你甚至可以使用 `MAMP` 和 `XAMPP`。尽管如此，你选择哪种安装并不重要，因为它们执行的功能相似。此外，你必须安装所有的开发文件。在
    Mac 上，Webroot 与 Windows 的不同，因为它位于 `applications/xampp/htdocs` 路径，除此之外，没有其他明显的区别。


    ### 在 Linux（基于 Debian 的）系统上

    与 Mac 和 Windows 系统不同，在 Linux 系统上，不使用第三方应用是一个更明智的方法。与其将此软件安装到系统中，不如直接使用该软件。不过，如果你倾向于使用它，仍然可以安装
    `XAMPP` 应用。但是，请记住这是一个开发环境，在执行诸如实时服务器等任务时，你不能使用或配置那些第三方应用。


    现在，在你开始向系统安装任何内容之前，请确保操作系统是最新的。这可以通过在你的系统终端中执行下方所示的命令来实现：


    ```bash

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get dist-upgrade

    ```


    执行这些命令可以确保系统是最新的，并与当前的软件版本保持同步。如果你的系统是最新的，你应该会发现大多数 Linux 系统已经安装了 `Apache 2`，不过，如果你还不确定它的可用性，可以尝试运行命令
    `sudo apt-get install apache2`。请记住，尝试对系统中已应用程序执行安装命令将变为检查该应用程序的更新。


    到此时，你必须安装数据库。请自由探索并使用你选择的任何数据库。不过，通常使用的数据库是 `MySQL`。要在你的系统中安装 `MySQL`，请执行以下命令：


    ```bash

    sudo apt-get install mysql-server

    sudo mysql_secure_installation

    ```


