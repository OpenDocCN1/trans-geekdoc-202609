  trans: "\n[content]\n\n1. 为什么在 Windows 系统上设置开发环境时需要第三方应用程序？\n2. 在 Linux 系统上设置开发环境之前需要什么前提条件？\n\
    3. `phpmyadmin` 的作用是什么？\n4. 哪种第三方应用程序可以同时用于 Windows 和 Mac 系统？\n5. `PHP` 嵌入 HTML\
    \ 对于该语言本身意味着什么？\n6. `PHP` 支持哪些重要的协议？\n7. 解析器（parser）的功能是什么？\n8. `PHP` 集成在哪些类型的数据库中？\n\
    9. 在计算机系统中创建和运行 `PHP` 脚本，需要安装的三个关键组件是什么？\n10. 在表单处理中，PHP 是如何应用的？\n\n# 第三章 基础语法\n\
    \n在本节中，我们将查看 PHP 语法的主要形式，因为它们是建立良好的 PHP 编程基础的基础知识。\n\n## 转义 PHP (Escaping to PHP)\n\
    有时，需要 PHP 解析引擎来区分页面上的其他元素与 PHP 代码。使用一种被称为“转义 PHP”的特殊机制来执行此类功能。在任何情况下，都有四种实现此功能的方法。它们是：\n\
    \n### 使用标准 PHP 标签\n这种方法是最通用有效的 PHP 标签样式之一，写为：`<?php…?>`。使用这种样式时，请确保无论在什么情况下，你的标签总会有一个正确的解释。\n\
    \n### 使用 SGML 风格（短开启型）标签\n短标签，又称为短开启标签，通常写为：`<?...?>`。正如名称所示，短标签提供了最短的方案。为了让 PHP\
    \ 识别你的短标签，你必须完成两个任务：\n1. 创建 PHP 脚本时，选择启用短标签的配置选项。\n2. 接下来，进入 `php.ini` 文件的设置部分并开启\
    \ `short_open_tag`。\n在同时处理 XML 和 PHP 时，必须禁用此选项，因为 XML 标签使用了与其类似的语法。\n\n### 使用\
    \ ASP 风格标签\nASP 风格标签与用于 Active Server Pages 上界定代码块的标签具有类似的结构和功能。ASP 风格标签通常以这种格式出现：`<%...%>`。使用\
    \ ASP 风格标签时，你必须在 `php.ini` 文件设置配置选项。\n\n### HTML 脚本标签\nHTML 脚本标签通常写为：`<script\
    \ language = “PHP”...</script>`。\n\n## 如何 PHP 代码中编写注释\n注释是指为人类用户编写程序部分，并在程序输出结果之前会被剔除。在\
    \ PHP 中，注释有两种形式。它们是：\n\n### 单行注释\n这些注释通常作为与编写的代码相关的简短备注或解释。考虑下面关于单行注释使用的示例：\n\
    ```php\n<?php \n# 这是一个单行注释，且\n# 这是单行注释的另一行\n// 这也是另一个注释。 \n每个风格的注释只会打印 \"A sample\
    \ of a single line comment\"; \n?>\n```\n\n### 多行打印\n下面显示在一个打印语句中输出多行的示例：\n```php\n\
    <?php \n# 第一个示例\nprint <<<END 这使用“此处文档”（here document）语法输出带有变量插值的多行内容。 \n注意，此处文档的终止符必须出现在仅包含分号的一行，不能有额外的空格！\
    \ \nEND ;\n# 第二个示例\nprint \"这跨越了多行。换行符也将输出\"; \n?>\n```\n\n### 多行注释\n这种注释通常用作编码时引入简要说明或伪代码算法的手段。PHP\
    \ 中使用的多行样式与 C 语言相似。下面提供了一个多行注释的示例以便更好地理解：\n```php\n<?php \n/* \n这是一个多行注释\n作者：Jane\
    \ Doe\n目的：多行注释演示\n主题：PHP \n*/ \nprint \"A sample with multi-line comments\"; \n\
    ?>\n```\n\n## 空格字符不敏感性\n空白字符是指代码中在输入时肉眼不可见的区域。它们包括制表符、空格和回车（即换行符）。PHP 对空白字符的不敏感性意味着一行中空白字符的数量是无关紧要的，因为单个空白字符的看待方式与多个空白字符相同。例如，在下面所示的每个\
    \ PHP 语句中，将 `5 + 1` 操作赋值给输出变量 `$six` 的语句是等的：\n```php\n$six = 5 + 1; // 单个空格\n\
    $six <tab>=<tab>2<tab>+<tab>2 ; // 空格和制表符\n$six = 5+ 1; // 多行\n```\n\n## 大写敏感性\n\
    PHP 是一种对大小写非常敏感的编程语言；意味着它会区分不同大小写的变量。例如，`PHP`、`php` 和 `pHp` 条目将被不同的解释，而不是视为同一个东西。考虑下面的代码示例：\n\
    ```html\n<html>\n<body>\n<?php\n$profit = 34;\nprint(\"Variable profit is $profit<br>\"\
    );\nprint(\"Variable PrOfiT is $PrOfiT<br>\");\n?>\n</body>\n</html>\n```\n当执行时，这段代码的结果将是：`Variable\
    \ profit is 34`，`Variable PrOfiT is…`\n\n## 语句与表达式\n### 使用分号结束\n在 PHP 中，语句是指使用分号（`;`）结束的表达式形式。PHP\
    \ 中的一系列有效语句代表一个有效的 PHP 程序，特别是当它被封装在标签中时。考虑下面一个将字符赋值给变量 `$greeting` 的常用 PHP 语句：\n\
    ```php\n$greeting = \"Welcome to PHP!\";\n```\n\n### 表达式是令牌的组合\n令牌是组成程序的最小不可分构建块。它们可以是常量（例如\
    \ `FALSE`）、变量（例如 `$greeting`）、数字（例如 `π`）以及字符串。\n\n### 大括号形式\n尽管无法以相同的方式组合语句，但可以通过封装在大括号内将一组语句放在所有位置。考虑下面两个相等语句的示例：\n\
    ```php\nif (7 == 4) { print(\"Great - haven't completely\"); }\nif (7 == 4) {\
    \ print(\"my mind.<br>\"); }\n```\n\n## 如何从命令行执行 PHP 脚本\n可以从计算机的命令行执行 PHP 脚本。假设你在\
    \ `test.php` 文件中有上面的内容：\n```php\n<?php echo \"Hello PHP!\"; ?>\n```\n按照以下方式通过你的命令行执行上述脚本：\n\
    `php test.php`\n输出结果将采取如下格式：`Hello PHP!`\n\n[/content]\n"
- fmt: "\n## 5. The variables used in PHP have no intrinsic types, meaning a variable\
    \ has no prior or future knowledge of what it would be used to store, be it a\
    \ set of characters or a distinct number.\n\n## 6. Any variable that is introduced\
    \ before any value is assigned to it adopts a default value.\n\n## 7. In PHP,\
    \ the process of converting from types from one state to another is automatically\
    \ performed when needed.\n\n## 8. The variables in PHP are similar to those in\
    \ Perl.\n\n## Variables and data types\nIn PHP, there are up to eight distinct\
    \ data types that can be used in the construction of variables. They include the\
    \ following:\n\n- **Integers**: Integers refer to whole numbers that lack decimal\
    \ points. Examples: `12`, `1234`, etcetera.\n- **Doubles**: Doubles refer to floating-point\
    \ numbers, such as `12.3`, `1.234`, etc.\n- **Booleans**: Booleans refer to values\
    \ with two definite number of outcomes: both being either `True` or `False`.\n\
    - **NULL**: `NULL` can be seen as a special data type which has only one possible\
    \ value—`NULL`.\n- **Strings**: Strings can be regarded as a set of characters.\
    \ For example, `\"String operations are supported in PHP\"` is a string.\n- **Arrays**:\
    \ Arrays refer to various sets of other values that have been indexed and named.\n\
    - **Objects**: Objects refer to instances of programmer-defined classes that are\
    \ capable of packaging up the other types of functions and values considered to\
    \ be class-specific.\n- **Resources**: Resources refer to special types of variables\
    \ which contains references to resources obtained outside of PHP, like database\
    \ connections, for instance.\n\nThe first five variable types are classified as\
    \ simple types, while the succeeding two types (I.e. `objects` and `arrays`) are\
    \ known as compound variable types. Compound variables are capable of packing\
    \ up various other arbitrary data types of arbitrary values, while the latter\
    \ is incapable of performing such a function. For a better understanding of the\
    \ classifications, we will consider each class separately and discuss its members\
    \ briefly.\n\n### Simple type\n#### Integers\nIntegers are the most basic forms\
    \ of variables in PHP, and they are similar to basic mathematical whole numbers\
    \ in that they can be either negative or positive. It is possible to assign an\
    \ integer to a variable; however, it is also possible to use them in expressions\
    \ in like fashion:\n\n```\n$int_var = 678910; $another_int = -678910 + 678910;\n\
    ```\n\nIntegers can take on any form, including but not limited to base 8 (octal),\
    \ base 10 (decimal), and base 16 (hexadecimal). By default, base 10 (decimal)\
    \ is used while base 8 or octal integers are indicated using a preceding zero\
    \ (`0`), and base 16 or hexadecimal proceed with `0x`. On the majority of common\
    \ platforms, the smallest known integer is `(-2,147,483,648)` or `(-2**31)`, while\
    \ the largest is `(2,147,483,647)` or `(2**31 - 1)`.\n\n#### Doubles\nIn a default\
    \ state, doubles are printed with the required number of decimal places. Take\
    \ a look at the sample below for better understanding:\n\n```php\n<?php \n$many_a\
    \ = 1.3422220; \n$many_b = 2.1111345; \n$few = $many_a + $many_b; \nprint(\"$many_a\"\
    ); \nprint(\"$many_b\"); \nprint(\"$few\"); \n?>\n```\n\n#### Boolean\nIn a default\
    \ state, doubles are printed with the required number of decimal places. Take\
    \ a look at the sample below for better understanding:\n\n```php\n<?php \n$many_a\
    \ = 1.3422220; \n$many_b = 2.1111345; \n$few = $many_a + $many_b; \nprint(\"$many_a\"\
    ); \nprint(\"$many_b\"); \nprint(\"$few\"); \n?>\n\n#### NULL\nIn a default state,\
    \ doubles are printed with the required number of decimal places. Take a look\
    \ at the sample below for better understanding:\n\n```php\n<?php \n$many_a = 1.3422220;\
    \ \n$many_b = 2.1111345; \n$few = $many_a + $many_b; \nprint(\"$many_a\"); \n\
    print(\"$many_b\"); \nprint(\"$few\"); \n?>\n\n#### Strings\nIn a default state,\
    \ doubles are printed with the required number of decimal places. Take a look\
    \ at the sample below for better understanding:\n\n```php\n<?php \n$many_a = 1.3422220;\
    \ \n$many_b = 2.1111345; \n$few = $many_a + $many_b; \nprint(\"$many_a\"); \n\
    print(\"$many_b\"); \nprint(\"$few\"); \n?>\n\n#### Arrays and Objects\nIn a default\
    \ state, doubles are printed with the required number of decimal places. Take\
    \ a look at the sample below for better understanding:\n\n```php\n<?php \n$many_a\
    \ = 1.3422220; \n$many_b = 2.1111345; \n$few = $many_a + $many_b; \nprint(\"$many_a\"\
    ); \nprint(\"$many_b\"); \nprint(\"$few\"); \n?>\n```\n*(Note: The source text\
    \ provided contained repetitive placeholders for Boolean, NULL, Strings, etc.,\
    \ with artifacts. I have cleaned the structure based on the formatting rules while\
    \ maintaining the core content provided.)*\n"
  raw: "5.  The variables used in PHP have no intrinsic types, meaning a variable\
    \ has no prior or future knowledge of what it would be used to store, be it a\
    \ set of characters or a distinct number. \n\n6.  Any variable that is introduced\
    \ before any value is assigned to it adopts a default value. \n\n7.  In PHP, the\
    \ process of converting from types from one state to another is automatically\
    \ performed when needed. \n\n8.  The variables in PHP are similar to those in\
    \ Perl. \n\nVariables and data types: In PHP, there are up to eight distinct data\
    \ types that can be used in the construction of variables. They include the following:\
    \ Integers: Integers refer to whole numbers that lack decimal points. Examples:\
    \ 12, 1234, etcetera. Doubles: Doubles refer to floating-point numbers, such as\
    \ 12.3, 1.234, etc. Booleans: Booleans refer to values with two definite number\
    \ of outcomes: both being either True or False. NULL: NULL can be seen as a special\
    \ data type which has only one possible value—NULL . Strings: Strings can be regarded\
    \ as a set of characters. For example, \"String operations are supported in PHP\"\
    \ is a string. Arrays: Arrays refer to various sets of other values that have\
    \ been indexed and named. Objects: Objects refer to instances of programmer-defined\
    \ classes that are capable of packaging up the other types of functions and values\
    \ considered to be class-specific. Resources: Resources refer to special types\
    \ of variables which contains references to resources obtained outside of PHP,\
    \ like database connections, for instance. The first five variable types are classified\
    \ as simple types, while the succeeding two types (I.e. objects and arrays) are\
    \ known as compound variable types. Compound variables are capable of  packing\
    \ up various other arbitrary data types of arbitrary values, while the latter\
    \ is incapable of performing such a function. For a better understanding of the\
    \ classifications, we will consider each class separately and discuss its members\
    \ briefly. Simple type: Integers: Integers are the most basic forms of variables\
    \ in PHP, and they are similar to basic mathematical whole numbers in that they\
    \ can be either negative or positive. It is possible to assign an integer to a\
    \ variable; however, it is also possible to use them in expressions in like fashion:\
    \ $int\\_var = 678910; $another\\_int = -678910 + 678910; Integers can take on\
    \ any form, including but not limited to base 8 (octal), base 10 (decimal), and\
    \ base 16 (hexadecimal). By default, base 10 (decimal) is used while base 8 or\
    \ octal integers are indicated using a preceding zero (0), and base 16 or hexadecimal\
    \ proceed with 0x. On the majority of common  platforms, the smallest known integer\
    \ is (.2,147,483,647) or (2\\*\\*31 . 1), while the largest is (2,147,483,647)\
    \ or (2\\*\\*31 . 1). Doubles: In a default state, doubles are printed with the\
    \ required number of decimal places. Take a look at the sample below for better\
    \ understanding: <?php $many\\_a = 1.3422220; $many\\_b = 2.1111345; $few = $many\\\
    _a + $many\\_b; print(\"$many + $many\\_2 = $few <br>\"); ?> When executed, it\
    \ outputs the following: 1.3422220 + 2.1111345 = 3. 4 Boolean: In PHP, only a\
    \ couple of constants are provided to be used as Booleans, and they are FALSE\
    \ or TRUE. They can be used in the following manner: if (TRUE) print(\"This will\
    \ always print<br>\"); else print(\"This will never print<br>\"); Interpreting\
    \ Other Variable Types as Booleans: Shown below are the rules and conventions\
    \ used to find out the \"truth\" of any value that isn't already a part of the\
    \ Boolean variable type: \n\n1.  When the value is an actual number, it is true\
    \ if the number is greater than or less than zero and false if it is precisely\
    \ equal to zero. \n\n2.  When the value represents a string, it is true when the\
    \ string isn't 0 and has characters greater than zero, and false when the string\
    \ is 0 or has zero number of characters (i.e. is empty). \n\n3.  The values of\
    \ the variable type NULL are false at all times. \n\n4.  When the values appear\
    \ as an array, it is true if it comprises of other values and false otherwise.\
    \ In the case of an object, holding a value implies containing a member variable\
    \ that has already been assigned value. \n\n5.  Never use doubles as Booleans.\
    \ \n\n6.  Valid resources are always true, although certain functions which successfully\
    \ return resources tend to be true, and when unsuccessful return false. \n\nAll\
    \ of the variables shown below have an embedded true value to their names when\
    \ applied and executed in a Boolean context: $true\\_num = 3 + 0.14200; $true\\\
    _str = \"Tried and true\" $true\\_array\\[23\\] = \"An array element\" ; $false\\\
    _array = array(); $false\\_null = NULL; $false\\_num = 777 - 777; $false\\_str\
    \ = \"\"; NULL: To provide a variable with the NULL value, proceed with the assigning\
    \ process in like manner: $my\\_var = NULL; NULL is a special constant that is\
    \ capitalized as a result of convention; however, it isn't necessarily insensitive\
    \ to case. So, you could type it as follows: $my\\_var = null; Any variable which\
    \ has been assigned the value NULL exhibits the following qualities: \n\n1.  FALSE\
    \ is returned when tested with an IsSet() function. \n\n2.  In a Boolean context,\
    \ it evaluates to FALSE. \n\nStrings: Below is a valid sample of a string: $string\\\
    _1 = \"It is a string encased in double quotes\"; $string\\_2 = 'It is a slightly\
    \ longer, singly quoted string'; $string\\_56 = \"This string has fifty-six characters\"\
    ; $string\\_0 = \"\"; // a string with zero characters Singly quoted strings are\
    \ used in a literal manner; however, doubly quoted strings take the place of variables\
    \ and their values, even to the point of specially interpreting some character\
    \ sets. <?php $variable = \"class\"; $literally = 'The $variable will not print!';\
    \ print($literally); print \"<br>\" ; $literally = \"The $variable will print!\"\
    ; print($literally); ?> Running the script will return the following result: The\
    \ $variable will not print! The class will print For string length, there are\
    \ no artificial limits, meaning that with the value of memory available, you should\
    \ be able to create as many arbitrarily long strings as possible. Strings which\
    \ have been delimited using double quotes (for example, \"this\") are processed\
    \ beforehand in PHP in the following ways: Variable names (those beginning with\
    \ the dollar sign ($)) are replaced using the string representations of their\
    \ respective values. Some character sets starting with a backslash (\\\\) are\
    \ replaced using special characters. The escape-sequence replacements include\
    \ the following: \n\n1.  \\\\\\\\ is replaced using a single backlash (\\\\) \n\
    \n2.  \\\\n is replaced using the newline character \n\n3.  \\\\\" is replaced\
    \ using the single, double quote (\") \n\n4.  \\\\r is replaced using the carriage-return\
    \ character \n\n5.  \\\\$ is replaced using the dollar sign alone ($) \n\n6. \
    \ \\\\t is replaced using the tab character "
