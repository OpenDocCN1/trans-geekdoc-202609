  trans: "\n在本节中，我们将深入探讨循环的概念、它们的工作原理，以及如何遍历数组中的一组值；特别是直接针对数组的循环，如 `foreach` 循环。\n\
    \n### While 循环\n只要 `while` 循环指定的条件评估为 `true`，`while` 语句就会持续循环一系列代码。因此，当评估的表达式输出为\
    \ `true` 时，它会启动代码块的执行。一旦代码完全执行了测试表达式，过程将重新从评估开始，循环将持续直到测试表达式或语句达到 `false` 状态。\n\
    \n**语法：**\n```php\nwhile(expression){ // 要执行的代码 }\n```\n\n考虑下面所示的示例，循环从 `$x =\
    \ 2` 开始。只要 `$x` 的值等于或小于 4，循环就会继续执行。每次执行循环时，`$x` 都会加 1。\n\n```php\n<?php\n$i =\
    \ 1;\nwhile($i<= 3){\n    $i++;\n    echo \"The number is \" . $i .\"<br>\";\n\
    }\n?>\n```\n\n考虑另一个例子。在这种情况下，变量的值在每次循环迭代时都会减少，而计数器不断增加，直到评估结果为 `false` 时循环终止。\n\
    \n```html\n<html>\n<body>\n<?php\n$a = 0;\n$num = 30;\nwhile( $a < 15) {\n   \
    \ $num--;\n    $a++;\n}\necho (\"Loop stopped at a = $a and num = $num\" );\n\
    ?>\n</body>\n</html>\n```\n执行此脚本的结果如如下方的结果所示：循环在 Loop stopped at a = 15 and num\
    \ = 30\n\n### for 循环\n`for` 循环用于在达到特定条件的期间重复执行一组特定的代码。它通常用于需要执行一定次数代码块的场景。在 `for`\
    \ 循环中，初始化部分用作设置循环迭代次数计数器起始值的手段。由于这个原因，可以在此点声明变量，并且将其命名为 `$i` 是很常见的。\n\n**语法：**\n\
    ```php\nfor(initialization; condition; increment){ // 要执行的代码 }\n```\n\n在 `for`\
    \ 循环中，有多种参数。它们包括：\n- **初始化 (Initialization)**：顾名思，它用于初始化所有计数器变量，并在整个循环体首次运行之前无条件地评估。\n\
    - **条件 (Condition)**：在每次迭代过程的开始时，都会处理该条件。如果评估为 `true`，则循环继续，所有的嵌套语句都将被执行。然而，如果评估为\
    \ `false`，则循环执行将停止。\n- **增量 (Increment)**：增量用于在每次迭代后用新值更新循环计数器。增量在每次迭代过程的结束时处理。\n\
    \n**示例：**\n下面所示的示例输出五次迭代，并在每个循环后更改两个变量的给定值。\n\n```html\n<html>\n<body>\n<?php\n\
    $x = 0;\n$y = 0;\nfor( $i = 0; $i<6; $i++ ) {\n    $x += 12;\n    $y += 6;\n}\n\
    echo (\"At the end of the loop x = $x and y = $y\" );\n?>\n</body>\n</html>\n\
    ```\n这产生了结果 − At the end of the loop a = 72 and b = 36\n\n考虑下面的另一个示例，它定义了一个从 `$i\
    \ = 2` 开始的循环。循环一直持续到 `$i` 达到小于或等于 5 的值。每执行一次循环，变量 `$i` 就会继续增加 1：\n\n```php\n<?php\n\
    for($i=1; $i<=3; $i++){\n    echo \"The number is \" . $i .\"<br>\";\n}\n?>\n\
    ```\n\n### PHP do…while 循环\n`do…while` 循环是 `while` 循环的另一种形式，它在每次循环迭代的终点评估条件。在\
    \ `do…while` 循环中，代码块会立即执行，然后评估条件。当条件通过为 `true` 时，只要给定的评估条件仍通过为 `true`，表达式就会重复处理。\n\
    \n**语法：**\n```php\ndo{ // 要执行的代码 }\nwhile(condition);\n```\n\n**示例：**\n考虑下面所示的示例，它将在每次迭代中增加\
    \ `$x` 的值。只要 `$x` 的赋值小于 15，变量 `$x` 的值就会继续增加。\n\n```html\n<html>\n<body>\n<?php\n\
    $x = 0 ;\n$num = 0;\ndo {\n    $x++;\n} while( $x < 15 );\necho (\"Loop stopped\
    \ at x = $x\" );\n?>\n</body>\n</html>\n```\n执行此脚本产生的结果如下：Loop terminated at x\
    \ = 15\n\n### do…while 和 while 循环的区别\n对于 `while` 循环，与 `do…while` 循环的主要区别在于执行执行的方式。在\
    \ `while` 循环中，被评估的表达式在每次循环迭代的开始时处理。结果是，当表达式评估为 `false` 时，循环 own 执行。而 `do…while`\
    \ 循环另一方面，它会在循环迭代的终点进行评估。\n\n### Foreach 循环\n`foreach` 循环用于需要遍历数组时。\n\n**语法：**\n\
    ```php\nforeach(array as value){ // 要执行的代码 }\n```\n\n**示例：**\n考虑下面所示的示例，它定义了遍历数组的值：\n\
    \n```html\n<html>\n<body>\n<?php\n$array = 5, 6, 7, 8, 9;\nforeach( $array as\
    \ $output ) {\n    echo \"Answer is $output <br />\";\n}\n?>\n</body>\n</html>\n\
    ```\n执行此脚本的结果如下：Answer is 5 Answer is 6 Answer is 7 Answer is 8 Answer is 9\n\n\
    ### PHP 中的其他语句。它们是：\n\n#### Break 语句\n在 PHP 中，`break` 语句用于提前终止循环的执行。为了更好的功能，`break`\
    \ 语句位于代码块内。当你认为需要离开循环时，这样做赋予了你绝对控制权。\n\n**示例：**\n在下面所示条件下，当计数器达到 5 时，循环被取消：\n\n\
    ```html\n<html>\n<body>\n<?php\n$x = 0;\nwhile( $x < 10) {\n    $x++;\n    if(\
    \ $x == 5 )break;\n}\necho (\"Loop stopped at x = $x\" );\n?>\n</body>\n</html>\n\
    ```\n执行脚本的结果如下：Loop stopped at x = 5\n\n#### Continue 语句\nPHP 中的 `continue` 语句用于暂停循环的当前迭代过程，尽管它并不一定结束循环过程。与\
    \ `break` 语句的使用一样，`continue` 语句位于循环执行的代码块内，并由一个条件测试引导。\n\n**示例：**\n在下面所示的示例中，循环输出数组的值，然而对于通过为\
    \ `true` 的条件，代码将被完全跳过，并输出下一个值。\n\n```html\n<html>\n<body>\n<?php\n$array =( 5,\
    \ 6, 7, 8, 9);\nforeach( $array as $ouptut ) {\n    if( $output == 5 )continue;\n\
    \    echo \"Answer is $output <br />\";\n}\n?>\n</body>\n</html>\n```\n执行此脚本产生的结果遵循如下方式：这产生了结果\
    \ − Answer is 5 Answer is 6 Answer is 7 Answer is 8 Answer is 9\n\n**练习 8：**\n\
    1. 什么是循环？\n2. 什么语句被引入用于遍历数组？\n3. `for` 循环的作用是什么？\n4. 为什么要使用循环？\n"
- fmt: "\n# Chapter Nine: Arrays in PHP\n\nIn PHP, arrays refer to a system of ordered\
    \ maps. A map can be seen as a data type which links values to keys and can be\
    \ optimized for many different reasons. Maps can also be regarded as arrays, dictionaries,\
    \ queues, list (vector), collection, hash tables (the implementation of maps),\
    \ stacks, and even more. In the same way, the values in an array can be other\
    \ arrays; it is also possible for it to be multi-dimensional arrays and trees.\n\
    \n## How Arrays are Created\n\nArrays can be developed with the `array()` language\
    \ construct. It uses any amount of keys separated by commas, that is, value pairs\
    \ as arguments.\n\n```php\narray( key => value, key2 => value2, key3 => value3,\
    \ ... )\n```\n\nThe comma used after the final element in an array is an optional\
    \ construct and may or may not be included. It is especially used in single-line\
    \ arrays. That is, `array (x, y)` is preferred to `array (x, y, )`. On the other\
    \ hand, for multi-line arrays, the comma that follows is usually applied because\
    \ it allows for better inclusion of new elements into the end.\n\nIn version 5.4,\
    \ the short array syntax can be used in replacing the `array()` function with\
    \ parentheses `[]`. Consider the sample below:\n\n### Sample #1: A simple array\n\
    \n```php\n<?php\n$array = array( \"foo\" => \"bar\", \"bar\" => \"foo\", ) ; //\
    \ as of PHP 5.4\n$array = [ \"foo\" => \"bar\", \"bar\" => \"foo\", ];\n?>\n```\n\
    \nIn this case, the key could either be a string of integer while the value could\
    \ attain any form. In addition, the following vital casts tend to happen:\n\n\
    1. Strings that hold valid decimal integers, except in cases where a `+` sign\
    \ precedes the number, are cast to the integer type. Take, for instance, the key\
    \ `\"5\"` can be started in `5`. On the other hand, it is impossible to cast `\"\
    08\"` because it doesn't exist in a valid decimal state.\n2. Floats can also be\
    \ cast to integers, meaning that it is possible for even a fractional part to\
    \ undergo truncation. For example, the key `5.7` can be stored under `5`.\n3.\
    \ Booleans can also be cast to integers, as well. That is, the key `true` can\
    \ be stored under `1`, even when it is false under `0`.\n4. Null can be cast to\
    \ an empty string. That is, the main `null` can be stored as `\"\"`.\n5. Objects\
    \ and arrays cannot be applied as keys because doing so only triggers a warning\
    \ of some illegal offset type.\n6. Many different elements in a single array declaration\
    \ tend to make use of a similar key, and only the last would survive typically\
    \ because others get overwritten in the process.\n\n## Types of Arrays\n\nIn PHP,\
    \ there are three varying types of arrays, and for each array, a value is accessed\
    \ with an ID that is known as an array index. The types of arrays are discussed\
    \ below:\n\n### Numeric array\nA numeric array is one that has a numeric index.\
    \ The values can be stored and accessed in a linear manner. Numeric arrays are\
    \ capable of storing strings, numbers, and objects, however, their indexes are\
    \ always represented with numbers. And by default, every numerical array index\
    \ begins from the number zero.\n\n**Sample:**\nThe sample being considered here\
    \ shows how to create a numeric array and access it. Here, the `array()` function\
    \ is used in the creation process.\n\n```html\n<html>\n<body>\n<?php\n/* First\
    \ method of creating an array. */\n$digits = array( 5, 6, 7, 8, 9);\nforeach(\
    \ $digits as $value ) {\n    echo \"Answer is $value <br />\";\n}\n/* Second method\
    \ to create array. */\n$digits[5] = \"five\" ;\n$digits[6] = \"six\";\n$digits[7]\
    \ = \"seven\";\n$digits[8] = \"eight\";\n$digits[9] = \"nine\";\nforeach( $digits\
    \ as $value ) {\n    echo \"Answer is $value <br />\";\n}\n?>\n</body>\n</html>\n\
    ```\n\nWhen executed, the result of the numeric array is as follows:\nAnswer is\
    \ 5\nAnswer is 6\nAnswer is 7\nAnswer is 8\nAnswer is 9\nAnswer is five\nAnswer\
    \ is six\nAnswer is seven\nAnswer is eight\nAnswer is nine\n\n### Associative\
    \ Arrays\nAssociative arrays are arrays that have strings as their indexes. They\
    \ are capable of storing the values of elements in conjunction with critical values\
    \ instead of in a direct linear index fashion. An associative array is quite synonymous\
    \ to a numerical array in that that their functionalities are similar, although\
    \ disparities do exist in the way their indexes are represented. For associative\
    \ arrays, their indexes are typically represented as a string so that it is possible\
    \ to establish a strong sense of connection between the keys and values. Take,\
    \ for instance, when storing the wages of workers in an array, an array with a\
    \ numerical index wouldn't appear to be the finest choice in this instance. Instead,\
    \ it is more plausible to make use of the names of the workers as the keys in\
    \ an associative array, and the resulting value turns out as the respective wages\
    \ of the workers. Keep in mind to not keep an associative array within a double\
    \ quote during printing; otherwise, no value whatsoever would be returned.\n\n\
    **Sample:**\n```html\n<html>\n<body>\n<?php\n/* First method to associate create\
    \ array. */\n$wages = array(\"kaleb\" => 3000, \"karen\" => 1500, \"tara\" =>\
    \ 700);\necho \"Wages of kaleb is \". $wages['kaleb'] . \"<br />\" ;\necho \"\
    Wages of karen is \". $wages['karen'].\"<br />\";\necho \"Wages of tara is \"\
    . $wages[tara].\"<br />\";\n/* Second method to create array. */\n$wages['kaleb']\
    \ = \"high\";\n$wages['karen'] = \"medium\";\n$wages['tara'] = \"low\";\necho\
    \ \"Wages of kaleb is \". $wages['kaleb'] . \"<br />\";\necho \"Wages of karen\
    \ is \". $wages['karen'].\"<br />\";\necho \"Wages of tara is \". $wages[tara].\"\
    <br />\";\n?>\n</body>\n</html>\n```\nWhen the script is executed, the result\
    \ produced as follows:\nWages of kaleb is 3000\nWages of karen is 1500\nWages\
    \ of tara is 700\nWages of kaleb is high\nWages of karen is medium\nWages of tara\
    \ is low\n\n### Multi-dimensional Arrays\nA multi-dimensional array is an array\
    \ that comprises of one or more arrays which can be accessed with multiple indexes.\
    \ In a multi-dimensional array, every element contained by the main array can\
    \ also be an array. Also, every element contained by the sub-array can be.\n\n\
    Sample:\nIn the sample shown below, a two-dimensional array is created to store\
    \ the marks obtained by three students in three subjects.\n\n```html\n<html>\n\
    <body>\n<?php\n$scores = array(\n    \"kaleb\" => array ( \"english\" => 40, \"\
    biology\" => 45, \"agric\" => 31 ) ,\n    \"karen\" => array ( \"english\" =>\
    \ 35, \"biology\" => 42, \"agric\" => 33 ),\n    \"tara\" => array ( \"english\"\
    \ => 41, \"biology\" => 29, \"agric\" => 37 )\n);\n/* Accessing multi-dimensional\
    \ array */\necho \"Scores for kaleb in english : \"  ; echo $scores['kaleb']['english']\
    \ . \"<br />\";\necho \"Scores for karen in biology : \"; echo $scores['karen']['biology']\
    \ . \"<br />\";\necho \"Scores for tara in agric : \" ; echo $scores['tara']['agric']\
    \ . \"<br />\";\n?>\n</body>\n</html>\n```\nWhen this script is executed, the\
    \ result takes after this fashion:\nScores for kaleb in english : 40\nScores for\
    \ karen in biology : 42\nScores for tara in agric : 37\n\n## Exercise 9\n\n1.\
    \ How can the values of a multi-dimensional array be accessed?\n2. What are the\
    \ three types of arrays in PHP?\n3. What is the key distinction between numeric\
    \ and associative arrays?\n4. What form of arrays can be accessed with many different\
    \ indexes?\n5. How are the values of a numeric array stored and accessed?\n6.\
    \ Strings are associated with which form of arrays?\n7. What is the default number\
    \ that begins the index of a numerical array?\n8. Why is it essential to not enclose\
    \ associative arrays between double quotes when printing?\n9. How can the values\
    \ of a multi-dimensional array be accessed?\n10. What is a map?\n"
  raw: "Chapter Nine Arrays in PHP In PHP, arrays refer to a system of ordered maps.\
    \ A map can be seen as a data type which links values to keys and can be optimized\
    \ for many different reasons. Maps can also be regarded as arrays, dictionaries,\
    \ queues, list (vector), collection, hash tables (the implementation of maps),\
    \ stacks, and even more. In the same way, the values in an array can be other\
    \ arrays; it is also possible for it to be multi-dimensional arrays and trees.\
    \ How Arrays are Created: Arrays can be developed with the array() language construct.\
    \ It uses any amount of keys separated by commas, that is, value pairs as arguments.\
    \ array( key => value, key2 => value2, key3 => value3, ... ) The comma used after\
    \ the final element in an array is an optional construct and may or may not be\
    \ included. It is especially used in single-line arrays. That is, array (x, y)\
    \ is preferred to array (x, y, ). On the other hand, for multi-line arrays, the\
    \ comma that follows is usually applied because it allows for better inclusion\
    \ of new elements into the end. In version 5.4, the short array syntax can be\
    \ used in replacing the array() function with parentheses \\[\\]. Consider the\
    \ sample below: Sample #1 A simple array <?php $array = array( \"foo\" => \"bar\"\
    , \"bar\" => \"foo\", ) ; // as of PHP 5.4 $array = \\[ \"foo\" => \"bar\", \"\
    bar\" => \"foo\", \\]; ?> In this case, the key could either be a string of integer\
    \ while the value could attain any form. In addition, the following vital casts\
    \ tend to happen: \n\n1.  Strings that hold valid decimal integers, except in\
    \ cases where a + sign precedes the number, are cast to the integer type. Take,\
    \ for instance, the key \"5\" can be started in 5. On the other hand, it is impossible\
    \ to cast \"08\" because it doesn't exist in a valid decimal state. \n\n2.  Floats\
    \ can also be cast to integers, meaning that it is possible for even a fractional\
    \ part to undergo truncation. For example, the key 5.7 can be stored under 5.\
    \ \n\n3.  Booleans can also be cast to integers, as well. That is, the key true\
    \ can be stored under 1, even when it is false under 0. \n\n4.  Null can be cast\
    \ to an empty string. That is, the main null can be stored as \"\". \n\n5.  Objects\
    \ and arrays cannot be applied as keys because doing so only triggers a warning\
    \ of some illegal offset type. \n\n6.  Many different elements in a single array\
    \ declaration tend to make use of a similar key, and only the last would survive\
    \ typically because others get overwritten in the process. \n\nTypes of Arrays:\
    \ In PHP, there are three varying types of arrays, and for each array, a value\
    \ is accessed with an ID that is known as an array index. The types of arrays\
    \ are discussed below: Numeric array: A numeric array is one that has a numeric\
    \ index. The values can be stored and accessed in a linear manner. Numeric arrays\
    \ are capable of storing strings, numbers, and objects, however, their indexes\
    \ are always represented with numbers. And by default, every numerical array index\
    \ begins from the number zero. Sample : The sample being considered here shows\
    \ how to create a numeric array and access it. Here, the array() function is used\
    \ in the creation process. <html> <body> <?php /\\* First method of creating an\
    \ array. \\*/ $digits = array( 5, 6, 7, 8, 9); foreach( $digits as $value ) {\
    \ echo \"Answer is $value <br />\"; } /\\* Second method to create array. \\*/\
    \ $digits\\[5\\] = \"five\" ; $digits\\[6\\] = \"six\"; $digits\\[7\\] = \"seven\"\
    ; $digits\\[8\\] = \"eight\"; $digits\\[9\\] = \"nine\"; foreach( $digits as $value\
    \ ) { echo \"Answer is $value <br />\"; } ?> </body> </html> When executed, the\
    \ result of the numeric array is as follows: Answer is 5 Answer is 6 Answer is\
    \  7 Answer is 8 Answer is 9 Answer is five Answer is six Answer is seven Answer\
    \ is eight Answer is nine Associative Arrays: Associative arrays are arrays that\
    \ have strings as their indexes. They are capable of storing the values of elements\
    \ in conjunction with critical values instead of in a direct linear index fashion.\
    \ An associative array is quite synonymous to a numerical array in that that their\
    \ functionalities are similar, although disparities do exist in the way their\
    \ indexes are represented. For associative arrays, their indexes are typically\
    \ represented as a string so that it is possible to establish a strong sense of\
    \ connection between the keys and values. Take, for instance, when storing the\
    \ wages of workers in an array, an array with a  numerical index wouldn't appear\
    \ to be the finest choice in this instance. Instead, it is more plausible to make\
    \ use of the names of the workers as the keys in an associative array, and the\
    \ resulting value turns out as the respective wages of the workers. Keep in mind\
    \ to not keep an associative array within a double quote during printing; otherwise,\
    \ no value whatsoever would be returned. Sample: <html> <body> <?php /\\* First\
    \ method to associate create array. \\*/ $wages = array(\"kaleb\" => 3000, \"\
    karen\" => 1500, \"tara\" => 700); echo \"Wages of kaleb is \". $wages\\['kaleb'\\\
    ] . \"<br />\" ; echo \"Wages of karen is \". $wages\\['karen'\\]. \"<br />\"\
    ; echo \"Wages of tara is \". $wages\\[tara\\]. \"<br />\"; /\\* Second method\
    \ to create array. \\*/ $wages\\[‘kaleb’\\] = \"high\"; $wages\\[‘karen’\\] =\
    \ \"medium\"; $wages\\['tara'\\] = \"low\"; echo \"Wages of kaleb is \". $wages\\\
    ['kaleb'\\] . \"<br />\"; echo \"Wages of karen is \". $wages\\[‘karen’\\]. \"\
    <br />\"; echo \"Wages of tara is \". $wages\\['tara'\\]. \"<br />\"; ?> </body>\
    \ </html > When the script is executed, the result that  produced is as follows:\
    \ Wages of kaleb is 2000 Wages of karen is 1000 Wages of tara is 500 Wages of\
    \ kaleb is high Wages of karen is medium Wages of tara is low Multi-dimensional\
    \ Arrays: A multi-dimensional array is an array that comprises of one or more\
    \ values and arrays which can be accessed with a variety of indexes. In a multi-dimensional\
    \ array, every element contained by the main array can also be an array of its\
    \ own. Also, every element contained by the sub-array can be arrays in themselves,\
    \ among other things. The values evaluated by a multi-dimensional array can be\
    \ accessed via multiple indexes. Sample : In the sample shown below, a two-dimensional\
    \ array is created to store the marks obtained by three students in a test comprising\
    \ of three subjects. The sample follows the outline of an associative array and\
    \ a numeric array can be created similarly. <html> <body> <?php $scores = array(\
    \ \"kaleb\" => array ( \"english\" => 40, \"biology\" => 45, \"agric\" => 31 )\
    \ , \"karen\" => array ( \"english\" => 35, \"biology\" => 42, \"agric\" => 33\
    \ ), \"tara\" => array ( \"english\" => 41, \"biology\" => 29, \"agric\" => 37\
    \ ) ); /\\* Accessing multi-dimensional array values \\*/ echo \"Scores for kaleb\
    \ in english : \"  ; echo $scores\\[‘kaleb'\\]\\[‘english’\\] . \"<br />\"; echo\
    \ \"Scores for karen in biology : \"; echo $scores\\[‘karen’\\]\\[‘biology’\\\
    ] . \"<br />\"; echo \"Scores for tara in agric : \" ; echo $scores\\['tara'\\\
    ]\\[‘agric’\\] . \"<br />\"; ?> </body> </html> When this script is executed,\
    \ the result produced takes after this fashion: Scores for kaleb in english :\
    \ 40 Scores for karen in biology : 4 2 Scores for tara in agric : 37 Exercise\
    \ 9: \n\n1.  How can the values of a multi-dimensional array be accessed? \n\n\
    2.  What are the three types of arrays in PHP? \n\n3.  What is the key distinction\
    \ between numeric and associative arrays? \n\n4.  What form of arrays can be accessed\
    \ with many different indexes? \n\n5.  How are the values of a numeric array stored\
    \ and accessed? \n\n6.  Strings are associated with which form of arrays? \n\n\
    7.  What is the default number that begins the index of a numerical array? \n\n\
    8.  Why is it essential to not enclose associative arrays between double quotes\
    \ when printing? \n\n9.  How can the values of a multi-dimensional array be accessed?\
    \ \n\n10.  What is a map? "
