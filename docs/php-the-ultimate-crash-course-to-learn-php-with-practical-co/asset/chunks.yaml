    *   It is impossible to send binary data, such as word documents or images into\
    \ a server using the GET method. \n\n*   The environment variable QUERY\\_STRING\
    \ can be used in accessing the data sent by the GET method. \n\n*   PHP uses the\
    \ GET method in providing a $\\_GET associative array for accessing every information\
    \ that is sent. \n\nThe upsides of using the GET method: \n\n1.  Given as the\
    \ data sent through the GET method is displayed in the URL, bookmarking the page\
    \ using a specified query string values is entirely possible. \n\n2.  It is also\
    \ possible to cache GET requests and GET requests tend to stay in the browser's\
    \ history. \n\n3.  It is also possible to bookmark GET requests. \n\nThe downsides\
    \ of using the GET method: \n\n1.  The GET method is highly unsuitable for the\
    \ transfer of sensitive data like the passwords and usernames of users, as they\
    \ tend to be on full display in the URL query string, coupled to the fact that\
    \ they are stored potentially in the memory of the client's browser as a recent\
    \ page. \n\n2.  Since the GET method tends to assign data to an environment variable\
    \ in the server, there is a limit to which the length of the URL can be. As a\
    \ result, there is an inhibition on the total volume of data that can be transferred.\
    \ \n\nThe POST Method: The post method is used in submitting the data to be parsed\
    \ into a given resource. For the POST method, information is transferred through\
    \ HTTP headers. The information is encoded in a similar way to the encoding process\
    \ for the GET method, and then it is placed into a header known as QUERY\\_STRING.\
    \ For POST method, the data is forwarded to the server in the form of a package\
    \ contained in clear communication with a  processing script. The data forwarded\
    \ through the POST method tends to be invisible in the URL. Sample : POST /test/demo\\\
    _form.php HTTP/1.1 Host: gfs.com JIM=350&DEC=43 Rationale: The query string (me/height)\
    \ is forwarded into the body of the HTTP message of a POST request. Input : <?php\
    \ if( $\\_POST\\[\"name\"\\] || $\\_POST\\[\"weight\"\\] ) { if (preg\\_match(\"\
    /\\[^A-Za-z'-\\]/\",$\\_POST\\['name'\\] )) { die (\"invalid name and name should\
    \ be alpha\"); } echo \"Welcome \". $\\_POST\\['name'\\]. \"<br />\"; echo \"\
    You are \". $\\_POST\\['weight'\\]. \"kgs in weight.\"; exit(); } ?> <html> <body>  \
    \   <form action = \"<?php $\\_PHP\\_SELF ?>\" method = \"POST\"> Name: <input\
    \ type = \"text\" name = \"name\" /> Weight: <input type = \"text\" name = \"\
    weight\" /> <input type = \"submit\" /> </form> </body> </html> Output : The POST\
    \ method has no restrictions whatsoever regarding the size of the data to be sent.\
    \ It is possible to use the POST method in sending binary data, as well as ASCII.\
    \ The data forwarded using the POST method tends to go through the HTTP header.\
    \ As a result, security is dependent on the HTTP protocol. By making use of Secure\
    \ HTTP, you can ensure the safety and security of your information. PHP uses the\
    \ POST method in providing $\\_POST associative array in accessing every information\
    \ sent. Consider the sample shown below and try to place the source code into\
    \ a test.php script. <?php if( $\\_POST\\[\"name\"\\] || $\\_POST\\[\"age\"\\\
    ] )  { if (preg\\_match(\"/\\[^A-Za-z'-\\]/\",$\\_POST\\['name'\\] )) { die (\"\
    invalid name and name should be alpha\"); } echo \"Welcome \". $\\_POST\\['name'\\\
    ]. \"<br />\"; echo \"Your \". $\\_POST\\[‘mobile number'\\]. \" is.\"; exit();\
    \ } ?> <html> <body> <form action = \"<?php $\\_PHP\\_SELF ?>\" method = \"POST\"\
    > Name: <input type = \"text\" name = \"name\" /> Mobile number: <input type =\
    \ \"text\" name = \"mobile number\" /> <input type = \"submit\" /> </form> </body>\
    \ </html> The result that produced is as follows: Name: Mobile Number: Submi t\
    \ The upsides of using the POST method: \n\n1.  The POST method has a higher level\
    \ of security than the GET method as the information entered by the user is never\
    \ shown in the query string of the URL or the logs of the server. \n\n2.  POST\
    \ method has a much larger boundary for the amount of data which can be passed\
    \ at a time, and a user can easily forward binary data (uploading a file or image)\
    \ and text data. \n\nThe downsides of using the POST method: \n\n1.  Since the\
    \ data forwarded through the POST method is not displayed in the URL, it is impossible\
    \ to bookmark the page under any given query. \n\n2.  Also, the requests of POST\
    \ methods do not get cached. \n\n3.  The requests of POST methods are not saved\
    \ in the browser's history, so it has no logs. \n\nThe $\\_REQUEST variable: The\
    \ $\\_REQUEST variable in PHP constitutes the contents of the three variables;\
    \ $\\_COOKIE, $\\_POST, and $\\_GET. The $\\_REQUEST variable can be used in obtaining\
    \ a result from the form data forwarded using both the POST and GET methods. Consider\
    \ the sample shown below and try to place the source code into a test.php script\
    \ . <?php if( $\\_REQUEST\\[\"name\"\\] || $\\_REQUEST\\[\"height\"\\] ) { echo\
    \ \"Welcome \". $\\_REQUEST\\['name'\\]. \"<br />\"; echo \"You are in\". $\\\
    _REQUEST\\['height'\\]. \" meters tall.\"; exit(); } ?> <html> <body> <form action\
    \ = \"<?php $\\_PHP\\_SELF ?>\" method = \"POST\"> Name: <input type = \"text\"\
    \ name = \"name\" /> Height: <input type = \"text\" name = \"height\" /> <input\
    \ type = \"submit\" /> </form> </body> </html> In the sample shown above, the\
    \ variable $\\_PHP\\_SELF holds the name of the self script within which it is\
    \ called. As a result, the result produced is as follows: Name: Height: Submi\
    \ t Exercise 14: \n\n1.  In terms of security, how is the POST method better than\
    \ the GET method? "
