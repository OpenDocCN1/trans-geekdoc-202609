- fmt: "\n# Creating User-defined Functions\n\nThe process of creating a function\
    \ of your own in PHP is quite simple. In declaring a user-defined function, the\
    \ declaration is started off using a word `function`. Syntax\n\n```\nfunction\
    \ functionName() { code to be executed; }\n```\n\nKeep in mind that every function\
    \ name has to begin with an underscore or letter. Usually, function names are\
    \ quite case-sensitive.\n\n### Example\nTake for instance, you wish to create\
    \ a function in PHP to write any note of your choosing on your browser whenever\
    \ the function is called within a program. The samples showing in ensuing parts\
    \ show how to create a function named `noteWriter()` and how it is called immediately\
    \ after it is created. Keep in mind that when creating a function, the name assigned\
    \ to it has to begin with a keyword `function`; meaning the name ought to reflect\
    \ the purpose of the function. When this is done, every PHP code should now be\
    \ included in curly braces `{}` as seen in the sample shown below:\n\n```html\n\
    <html>\n<head>\n<title>Coding in PHP</title>\n</head>\n<body>\n<?php\n/* Defining\
    \ the PHP Function */\nfunction noteWriter() {\n    echo \"It is a fine day today.\
    \ Have a great day ahead!\";\n}\n/* Calling the PHP Function */\nnoteWriter();\n\
    ?>\n</body>\n</html>\n```\n\nWhen the code is executed, the result outputted is\
    \ as follows: `It is a fine day today. Have a great day ahead!`. The opening curly\
    \ brace is an indication of the starting of the function code, while the closing\
    \ curly brace is used to indicate the terminal point of the function. The function\
    \ prints \"Welcome to PHP.\" To access the function, all we need do is write it\
    \ out (or call it) and attach brackets `()` to it:\n\n```php\n<?php\nfunction\
    \ noteWriter() {\n    echo \"Welcome to PHP!\";\n}\nnoteWriter(); // call the\
    \ function\n?>\n```\n\n## Function Arguments in PHP\n\nAny information can be\
    \ transferred to functions using arguments. An argument is quite similar to a\
    \ variable; however, they are usually specified inside the parentheses attached\
    \ to the function name. In PHP, many different arguments can be added at the same\
    \ time. However, keep in mind to separate each argument using a comma for better\
    \ readability and smoother executions.\n\nConsider the sample shown below of a\
    \ function having a single argument alone — `($mnum)`. Whenever the `matricNumber()`\
    \ function is called, take note to pass along a number as it goes (e.g. `131`),\
    \ and the number is applied within the function that outputs many different matriculation\
    \ numbers, but to the same base code `(U1963/5203)`:\n\n```php\n<?php\nfunction\
    \ matricNumber($mnum) {\n    echo \"$mnumRefsnes.<br>\";\n}\nmatricNumber(\"131\"\
    );\nmatricNumber (\"132\");\nmatricNumber (\"133\");\nmatricNumber (\"134\");\n\
    matricNumber (\"135\");\n?>\n```\n\n### Passing Arguments Through Reference\n\n\
    Passing arguments to functions through reference is a possible operation. In the\
    \ process, a function manipulates the reference of a variable instead of a copy\
    \ of the value assigned to the variable. As a result, alterations made to the\
    \ argument in such a case modifies the value of the first variable. An argument\
    \ can be passed by reference through the inclusion of an ampersand `&` into a\
    \ variable name in either the function definition or function call. Take a look\
    \ at the sample shown below for a better understanding of both cases:\n\n```html\n\
    <html>\n<head>\n<title>Passing Argument through Reference</title>\n</head>\n<body>\n\
    <?php\nfunction addTen($num) {\n    $num += 10;\n}\nfunction addFifteen(&$num)\
    \ {\n    $num += 15;\n}\n$initnum = 20;\nadd10( $initnum );\necho \"Initial Value\
    \ is $initnum<br />\";\naddFifteen( $initnum );\necho \"Initial Value is $initnum<br\
    \ />\";\n?>\n</body>\n</html>\n```\n\nWhen the code is executed, the result outputted\
    \ is as follows: `Initial Value is 30`, `Initial Value is 35`.\n\n## Default Argument\
    \ Values in PHP\n\nThe sample shown below depicts how default parameters are used\
    \ in PHP. When the function `setLength()` is called without any arguments, it\
    \ assumes a default value as an argument: Sample\n\n```php\n<?php\ndeclare(strict_types=5);\
    \ // strict requirement\nfunction setLength(int $minlength = 25) {\n    echo \"\
    The length is : $minlength<br>\";\n}\nsetLength (100);\nsetLength (); // will\
    \ use the default value of 25\nsetLength (150);\nsetLength (75);\n?>\n```\n\n\
    ## Functions with Parameters in PHP\n\nIn PHP, you are given the option to pass\
    \ parameters within a function. Like arguments, many different parameters can\
    \ be passed at the same time. The parameters function similarly as variables within\
    \ the function. Take a look at the sample below between two integer parameters\
    \ that are added and then printed out:\n\n```html\n<html>\n<head>\n<title>Functions\
    \ with Parameters in PHP</title>\n</head>\n<body>\n<?php\nfunction addFunction($num5,\
    \ $num10) {\n    $sum = $num5 + $num10;\n    echo \"Sum of the both numbers is\
    \ : $ans\";\n}\naddFunction(30, 50);\n?>\n</body>\n</html>\n```\n\nWhen executed,\
    \ the result of the sample code above is as follows: `Sum of both numbers is:\
    \ 80`.\n\n### The characteristics of PHP\n\nNotice the sample directly above,\
    \ that no mention was made to PHP regarding which of the data type represented\
    \ the variables. The program was able to automatically assign a specific data\
    \ type to a variable based on its value. And since the data types are not arranged\
    \ in any strict order, it is possible to perform activities such as adding an\
    \ integer to a string without triggering an error.\n\nType declarations were introduced\
    \ in PHP 7. This accords users the ability to specify an expected data type during\
    \ the declaration of a function, and by including the `\"strict\"` declaration,\
    \ a `\"Fatal Error\"` is triggered should there be by a form of mismatch in the\
    \ data type.\n\nIn the sample outlined:\n\n```php\n<?php\nfunction addFunction($num5,\
    \ $num10) {\n    $sum = $num5 + $num10;\n    echo \"Sum of the both numbers is\
    \ : $ans\";\n}\n?>\n```\n(Note: The provided text contains repetitive and fragmented\
    \ sections in the latter half; the core logic regarding type declarations is preserved\
    \ below).\n\nType declarations allow users to specify an expected data type. By\
    \ including `declare(strict_types=1)`, a `Fatal Error` is triggered on mismatch.\n\
    \n```php\n<?php\ndeclare(strict_types=1);\nfunction addNumbers(int $x, int $y):\
    \ int {\n    return $x + $y;\n}\necho addNumbers(10, 20);\n?>\n```\n\n## Returning\
    \ Values in PHP\n\nTo return a value from a function, we use the `return` keyword.\
    \ This allows the function to send a result back to the caller. The function terminates\
    \ once the `return` is encountered.\n\n### Example of Returning Values\n```php\n\
    <?php\nfunction addFunction($num5, $num10) {\n    $sum = $num5 + $num10;\n   \
    \ return $sum;\n}\n$result = addFunction(30, 50);\necho $result;\n?>\n```\n\n\
    ## Exercise 11:\n"
