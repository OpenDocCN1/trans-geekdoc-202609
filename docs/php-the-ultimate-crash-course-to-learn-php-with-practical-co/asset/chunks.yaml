    return is declared, and the type follows directly after, but just before the opening
    curly braces ({) when a function is declared.  In the sample shown below, the
    return type specified for the function is specified. Sample: <?php declare(strict\_types=1);
    // strict requirement function addNumbers(float $i, float $j) : float { return
    $i + $j; } echo addNumbers(1.5, 7.2); ?> It is possible for a different return
    type to be specified instead of the argument types. However, ensure that the return
    is right type: Sample: <?php declare(strict\_types=1); // strict requirement function
    addNumbers(float $i, float $j) : int { return (int)($i + $j); } echo addNumbers(1.5,
    7.2); ?> Exercise 11: '
