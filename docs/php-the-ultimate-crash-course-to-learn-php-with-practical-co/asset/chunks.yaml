    ## PHP 概述


    6. `PHP` 解释器负责处理 `PHP` 代码。


    7. 该语言具有灵活性、速度快和实用性。


    8. PHP 页面并不是在输出 HTML 时使用大量命令，而是包含一个嵌入了编程代码的 HTML，用于执行特定功能。


    9. `PHP` 与其他编程语言的一个关键区别在于，代码是在服务器上执行的，并生成转发到客户端的 HTML。


    10. 对于初学者来说，`PHP` 学习并不困难，而且它还提供了许多资深程序员会认为有用的高级特性。


    ## 练习 2


    1. Windows 服务器的搭建非常昂贵。

    2. 系统已经是最新版本。

    3. `phpmyadmin` 让设置和更改数据库变得更加简单、快速。

    4. `XAMPP`。

    5. 这意味着该语言可以用于数据库、动态内容和会话跟踪，还可以用于电子商务网站的构建和设计。

    6. `PHP` 支持编程中主要协议，如 `LDAP`、`IMAP` 和 `POP3`。

    7. 使用解析器生成可以发送到网络浏览器的 HTML 输出。

    8. `PHP` 与多种流行数据库有大量集成，如 `Microsoft SQL Server`、`MySQL`、`Oracle`、`Informix`、`PostgreSQL`
    和 `Sybase`。

    9. `PHP` 解析器、Web 服务器和数据库。

    10. 从文件中收集数据、将数据保存到文件中、通过电子邮件转发数据以及向用户返回数据。


    ## 练习 3


    1. `PHP` 中用分号来结束语句。

    2. 标记（Tokens）是指组成 `PHP` 程序的最小、最不可分割的构建块。

    3. 注释是程序中为人类用户编写的部分，在程序结果输出之前会被剪掉。

    4. `PHP` 对不同大小写的变量处理方式不同。

    5. `PHP` 中的一系列有效语句代表一个一个的 `PHP` 程序，特别是当它被包含在 `PHP` 标签中时。

    6. 一行中空白字符的数量无关紧要，因为在 `PHP` 中，单个空白字符与多个空白字符的看待方式相同。

    7. 多行注释用于在编码时引入简洁的解释或伪代码算法。

    8. 首先，选择启用短标签的配置选项。其次，进入 `php.ini` 文件的设置部分并点击开启 `short_open_tag`。

    9. 当需要 `PHP` 解析引擎区分页面上的其他元素和 `PHP` 代码时使用它。

    10. 标准 `PHP` 标签。


    ## 练习 4


    1. 变量作用域是一个术语，用于描述变量在赋值它的程序中的可用范围。

    2. 加法符号 (`+`)、减法符号 (`-`）、取地址符 (`&`）、取模符号 (`%`）和左括号 (`(`)。

    3. 这意味着根据可用内存值，用户应该能够创建尽可能多的任意长度的字符串。

    4. 单引号字符串以字面方式使用；然而，双引号字符串会替换变量及其值，甚至会对比某些字符集进行特殊解释。

    5. 在布尔上下文中，它的评估值为 `FALSE`。

    6. `FALSE` 和 `TRUE`。

    7. 8 进制或八进制整数使用前零 (`0`）表示。

    8. 变量用于存储 `PHP` 程序体内部的信息。

    9. 在单个字符串变量中，这里文档（here document）用于分配多行。

    10. 整数是 `PHP` 中最基本的变量形式，它们与基础数学整数相似，因为它们可以是正的也可以是负的。


    ## 练习 5


    1. 只有标量数据（如字符串、浮点数、整数和 `Boolean`）才能存储在常量中。

    2. 在包含的文件中使用时，它返回被包含的文件名。

    3. 常量的名称应当以下划线或字母开头，随后紧跟任意数量的下划线、数字或字母。

    4. `constant()` 函数输出分配给常量的值。

    5. 当定义常量时，在整个执行过程中不能被取消定义或更改。

    6. `__LINE__`、`__CLASS__`、`__FUNCTION__`、`__FILE__` 和 `__METHOD__`。

    7. 常量不能通过赋值定义，因为它们只能通过 `define()` 函数定义。

    8. 常量是指标识简单值的术语。

    9. 在读取常量值时使用 `constant()` 函数，特别是当你需要动态收集常量名称时。

    10. `__LINE__` 的值取决于它在脚本中应用的行数。


    ## 练习 6


    1. 取模符号 (`%`)。

    2. 关系运算符。

    3. 运算符是用于在多个变量之间执行操作结构。

    4. 运算符的优先级决定了操作中项的分组方式。

    5. 二元运算符需要两个操作数来执行一系列逻辑和算术操作的运算符。

    6. 递减运算符用于将整数的值减一。

    7. 在任何表达式中，高优先级运算符应该在低优先级运算符先求值。

    8. 三元运算符需要使用三个操作数，并评估第一个的结果。

    9. 赋值运算符。

    10. 加法 (`+`) 和减法 (`-`)。


    ## 练习 7


    1. 大括号或括号。

    2. `elseif` 语句。

    3. `else` 语句。

    4. 备用表达式。

    5. 使用默认代码执行语句。

    6. `if` 语句。

    7. 空语句。

    8. 语句组是语句的组。

    9. 当表达式的值被 `if` 语句认为为假时。

    10. 为了避免重复使用 `if`。


    ## 练习 8


    1. 循环是在满足特定条件时重复执行单块代码的工具。

    2. `foreach` 循环。

    3. `for` 循环用于在达到特定条件的持续时间内重复特定的代码集。

    4. 循环用于为重复性操作引入自动化，以节省精力和时间。


    ## 练习 9


    1. 通过多维数组评估的值可以通过多个索引访问。

    2. 数值数组、多维数组和关联数组。

    3. 主要区别在于它们索引的表示方式。

    4. 多维数组。

    5. 数值数组的值以线性方式存储和访问。

    6. 关联数组。

    7. 默认情况下，每个数值索引从零开始。

    8. 在打印时使用双引号将导致没有返回值。

    9. 通过多维数组评估的值可以通过多个索引访问。

    10. 映射（map）是一种键值对值的数据类型，并可以出于许多原因进行优化。


    ## 练习 10


    1. `strcmp()` 函数。

    2. 它用于在另一个字符串中查找字符串的首次出现。它是区分大小写的。

    3. 点 (`.`) 运算符

    4. 它用于计算字符串中找到字符的数量，包括字符串内部使用的空格。

    5. 单引号字符串以字面方式处理。

    6. 字符串是一组算术值、特殊字符、数字和字母，或者有时是每一项的组合。

    7. 单引号字符串和双引号字符串

    8. `str_repeat()` 函数。

    9. `printf()` 函数用于输出格式化字符串，而 `print()` 函数仅输出字符串。

    10. `strip_tags()` 函数。


    ## 练习 11


    1. 它停止函数的执行并将值发送给调用函数的代码。

    2. 严格要求声明会抛出“致命错误（Fatal Error）”。


