  trans: "\n\n# Here Document（在此在此文档）\n\n对于单个字符串变量，可以使用在此在此文档（here document）为其赋值多个行。请考虑下方的示例：\n\
    \n```php\n<?php \n$channel =<<\\_XML\\_ <channel> <title>How Are You</title> <link>http://menu.sample.org/\
    \ </link> <description>It’s been a rather long while.</description> </channel>\
    \ \\_XML\\_ ; \necho <<<END 这一行使用了“here document”语法来返回带有变量插值的多行。请记住，here document\
    \ 的结束符必须出现在仅包含分号的行上，且不能有额外的空格！ END; \nprint $channel; \n?>\n```\n\n运行此脚本将输出以下结果：这利用了“here\
    \ document”语法使用变量插值输出多行。请记住，here document 的结束符必须出现在仅包含分号的行上，且不能有额外的空格！\n\n`<channel>\
    \ <title>How Are You<title > <link>http://menu.sample.org/<link> <description>\
    \ It’s been a rather long while.</description>`\n\n# 变量作用域\n\nVariable scope（变量作用域）是一个术语，用于描述变量在赋值赋值的程序中的可用范围。PHP\
    \ 中的变量倾向于采用四种作用域类型之一。这些类型包括：\n\n1. 静态变量\n2. 函数参数\n3. 局部变量\n4. 全局变量\n\n# 在 PHP\
    \ 中命名变量\n\n在 PHP 中创建变量的规则和约定如下：变量名由下划线、字母和数字组成，但不能使用如 `+`、`-`、`%`、`(`、`)`、`&`\
    \ 等字符。变量名必须以下划线或字母开头。记住，变量的大小没有限制。\n\n# 练习 4：\n\n1. 什么是变量作用域？\n2. 列出五个禁止在变量名中使用的字符。\n\
    3. “没有人为限制”这句话对于字符串长度意味着什么？\n4. 单引号字符串和双引号字符串之间的区别是什么？\n5. 在布尔上下文中 `NULL` 的求值结果？\n\
    6. PHP 中哪两个常量用作布尔值？\n7. 如何表示八进制整数？\n8. 什么是变量？\n9. 如何使用 here document？\n10. 解释“整数”一词。\n\
    \n# 第五章：PHP 中的常量\n\nConstant（常量）是一个用于标识简单值值的术语。在脚本执行期间，常量的值不能更改。默认情况下，常量对大小写敏感，尽管根据惯例，常量标识符总是以大写字母开头。常量的名称通常以下划线或字母开头，紧接着任意数量的下划线、数字或字母。一旦定义了常量，它在整个执行过程中就不能被取消定义或更改。\n\
    \n`define()` 函数用于定义常量，在检索赋值给常量的值时，你必须指定它的名称。与其他变量不同，常量不需要是以美元符号（`$`）开头的。在读取常量值时，也可以使用\
    \ `constant()` 函数，特别是当你需要动态地收集常量的名称时。\n\n`constant()` 函数：正如其名所示，该函数输出赋值给常量的值。当你需要输出常量的值但不知道它的名称是什么时，这个函数特别有用。也就是说，它是通过函数输出的，或者存储在变量中。\n\
    \n考虑下方的示例：\n\n```php\n<?php \ndefine(\"MINSIZE\", 50); \necho MINSIZE; \necho\
    \ constant(\"MINSIZE\"); // 与上一行相同 \n?>\n```\n\n只有标量数据，如字符串、浮点数、整数和布尔值可以存储在常量中。\n\
    \n## 变量与常量的区别\n\n1. 在引入任何常量之前没有必要使用美元符号（`$`），而在变量的情况下，使用美元符号是必不可少的。\n2. 常量不能通过简单的赋值来定义，因为它们只能通过\
    \ `define()` 函数定义。\n3. 可以从任何地方访问和定义常量，而不考虑变量作用域的规则。\n4. 当常量被设置后，可能会被取消定义或重新定义。\n\
    \n## 有效和无效的常量名：\n\n```php\n// 有效的常量名\ndefine(\"ONE\", \"first thing\");\ndefine(\"\
    TWO2\", \"second thing\");\ndefine(\"THREE\\_3\", \"third thing\");\n\n// 无效的常量名\n\
    define(\"2TWO\", \"second thing\");\ndefine(\"\\_\\__THREE\\_\\_\", \"third value\"\
    );\n```\n\n# PHP 中的魔法常量\n\nPHP 为执行的脚本提供了大量的预定义常量。魔法常量（magical constants）共有五个，并且取决于取决于应用的部分而变化。例如，`__LINE__`\
    \ 的值取决于它在脚本中应用的行。这类特殊常量通常对大小写敏感，并按以下方式构造：\n\n为了更好地理解，下面显示了 PHP 中的某些魔法常量：\n\n1.\
    \ `__LINE__`：此常量表示文件的当前行号。\n2. `__FILE__`：此常量表示文件的完整文件名和路径。当应用于包含的文件时，它返回被包含文件的名称。从\
    \ PHP 4.0.2 版本开始，`__FILE__` 常量始终包含绝对路径，尽管在早期版本中它在某些情况下会包含相对路径。\n3. `__FUNCTION__`：此常量表示函数的名称。\n\
    4. `__CLASS__`：此常量表示类的名称。\n5. `__METHOD__`：此常量表示方法的名称。\n\n# 练习 5：\n\n1. 什么数据可以存储在常量中？\n\
    2. `__FILE__` 是如何工作的？\n3. 常量的命名条件是什么？\n4. `constant()` 用于什么？\n5. 常量在执行期间具有什么特性？\n\
    6. 哪五个魔法常量？\n7. 从赋值的角度来看，常量与变量有什么区别？\n8. 什么是常量？\n9. `constant()` 是如何使用的？\n10.\
    \ `__LINE__` 的值取决于什么？\n\n"
- fmt: "\n3. `/`: This operator is used for dividing the numerator by the denominator.\
    \ E.g. `Y / X` gives 3.\n\n4. `%`: This operator, name of modulus, is used to\
    \ calculate the remainder of an operation after an integer division. E.g. `Y %\
    \ X` gives 0.\n\n5. `++`: This operator is called the increment operator, and\
    \ is used to increase the value of an integer by one. E.g. `Y++` gives 16.\n\n\
    6. `--`: This operator is called the decrement operator, and is used to decrease\
    \ the value of an integer by one. E.g. `X--` gives 4.\n\n## Comparison Operators\n\
    The comparison operators supported in PHP are discussed below: For better understanding,\
    \ examples will be included to indicate their functions. In the samples, variable\
    \ `X` holds a value of 5 and variable `Y` holds a value of 15.\n\n1. `==`: This\
    \ operator is used to find out whether or not the value of two operands is equal.\
    \ E.g. `(X == Y)` is not true.\n\n2. `!=`: This operator is used to check whether\
    \ or not the values of two operands are equal. If the values are unequal, then\
    \ the condition is returned as true. E.g. `(X != Y)` is true.\n\n3. `>`: This\
    \ operator is used in checking whether the value of the left operand is greater\
    \ than that of the right operand. The condition is returned as true if the answer\
    \ is yes. E.g. `(X > Y)` is not true.\n\n4. `<`: This operator is used in checking\
    \ whether the value of the left operand is lesser than that of the right operand.\
    \ The condition is returned as true if the answer is yes. E.g. `(X < Y)` is true.\n\
    \n5. `>=`: This operator is used in checking whether the value of the left operand\
    \ is greater than or equal to that of the right operand. The condition is returned\
    \ as true if the answer is yes. E.g. `(X >= Y)` is not true.\n\n6. `<=`: This\
    \ operator is used in checking whether the value of the left operand is lesser\
    \ than or equal to that of the right operand. The condition is returned as true\
    \ if the answer is yes. E.g. `(X <= Y)` is true.\n\n## Logical Operators\nThe\
    \ logical operators supported in PHP are discussed below: For better understanding,\
    \ examples will be included to indicate their functions. In the samples, variable\
    \ `X` holds a value of 5 and variable `Y` holds a value of 15.\n\n1. `and`: This\
    \ operator is known as the Logical AND operator. When both operands are true,\
    \ the condition is returned as true. E.g. `(X and Y)` is true.\n\n2. `or`: This\
    \ operator is known as the Logical OR Operator. When both of the two operands\
    \ are non-zero, then the condition is returned as true. E.g. `(X or Y)` is true.\n\
    \n3. `&&`: This operator is known as the Logical AND Operator. When both of the\
    \ operands are nonzero, the condition is returned as true. E.g. `(X && Y)` is\
    \ true.\n\n4. `||`: This operator is called the Logical OR Operator. When both\
    \ of the two operands are non-zero, then the condition is returned as true. E.g.\
    \ `(X || Y)` is true.\n\n5. `!`: This operator is known as the Logical NOT Operator.\
    \ It is used to reverse the logical state of operands. When a condition is true,\
    \ the Logical NOT Operator turns it to false. E.g. `!(X && Y)` is false.\n\n##\
    \ Assignment Operators\nThe assignment operators supported in PHP are discussed\
    \ below:\n\n1. `=`: This is a simple assignment operator which assigns a value\
    \ from the right side operand(s) to that of the left side operand. E.g. `Z = X\
    \ + Y` will assign the value of the operation `(X + Y)` to `Z`.\n\n2. `+=`: This\
    \ is the Add AND assignment operator. It is used to add the right operands to\
    \ the operands on the left and assign the returned value to the left operand.\
    \ E.g. `Z += X` is the same thing as `Z = Z + X`.\n\n3. `-=`: This is the Subtract\
    \ AND assignment operator. It is used to subtract the right operand from the operand\
    \ on the left and assign the returned value to the left operand. E.g. `Z -= X`\
    \ is the same thing as `Z = Z - X`.\n\n4. `*=`: This is the Multiply AND assignment\
    \ operator. It is used to multiply the right operand from the operand on the left\
    \ and assign the returned value to the left operand. E.g. `Z *= X` is the same\
    \ thing as `Z = Z * X`.\n\n5. `/=`: This is the Divide AND assignment operator.\
    \ It is used to divide the right operand from the operand on the left and assign\
    \ the returned value to the left operand. E.g. `Z /= X` is the same thing as `Z\
    \ = Z - X`.\n\n6. `%=`: This is the Modulus AND assignment operator. It is used\
    \ to subtract the right operand from the operand on the left and assign the returned\
    \ value to the left operand. E.g. `Z %= X` is the same thing as `Z = Z % X`.\n\
    \n## Conditional Operators\nConditional Operators are used in evaluating expressions\
    \ for a true or false value before one of the two outputted statements is then\
    \ executed depending on the outcome of the evaluation process. The conditional\
    \ operators supported in PHP have the syntax shown below:\n\n1. `?:`: in PHP,\
    \ this operator represents a conditional expression. E.g. When the condition is\
    \ true `?` Then value A `:` Otherwise value B.\n\n## Categories of Operators\n\
    Asides the types of operators, there are four other categories under which the\
    \ operators are classified:\n\n### Unary Operators\nUnary operators are `!`, `++`,\
    \ and `--`.\n\n### Binary Operators\nBinary operators require two operands.\n\n\
    ### Multiplicative Operators\nMultiplicative operators are `*`, `%`, and `/`.\
    \ \n\n### Additive Operators\nAdditive operators are `+` and `-`.\n\n### Relational\
    \ Operators\nRelational operators are `<`, `<=`, `>`, and `>=`.\n\n### Equality\
    \ Operators\nEquality operators include `==` and `!=`.\n\n### Logical Operators\n\
    The Logical AND operator is `&&`. The Logical OR operator is `||`.\n\n### Conditional\
    \ Operators\nThe conditional operator is `?:`. They require three operands.\n\n\
    ### Assignment Operators\nAssignment operators include the following: `=`, `+=`,\
    \ `-=`, `*=`, `/=`, and `%=`.\n\n## Operator Precedence in PHP\nThe precedence\
    \ of operators dictates how terms are grouped. Some operators are higher placed\
    \ in the scale than others, so they tend to be evaluated first. Consider the sample\
    \ `j = 2 - 4 * 3`; the answer will be -10 rather than -6. The multiplication operator\
    \ has precedence over the subtraction operator. In basic mathematical terms, this\
    \ expression can be interpreted as `2 - (4 * 3)`. The operators are ranked in\
    \ descending order down to the last operator. Keep in mind that higher precedence\
    \ operators ought to be evaluated before lower precedence operators.\n"
