  trans: "\n\n### 5. PHP 代码处理使用了什么工具？\n\n### 6. 哪些特质让程序员喜爱 PHP？\n\n### 7. PHP 页面是如何输出\
    \ HTML 的？\n\n### 8. PHP 与其他编程语言之间的关键区别因素是什么？\n\n### 9. 学习 PHP 的显著优势是什么？\n\n##\
    \ 第二章：为什么要学习 PHP？\n\n根据历史，`PHP` 起是一个静静的开源项目，随着它在认为它非常有用的群体中获得认可，它不断成长和演变。自 1994\
    \ 年发布以来，它越来越受到寻求提升软件工程水平的学习者和专业人士的追捧，特别是在 Web 开发领域。\n\n以下列出了学习 `PHP` 的一些优势：\n\n\
    * `PHP` 是一种用于服务器和浏览器的脚本语言，并嵌入 `HTML` 中。因此，它被应用于数据库管理、动态内容和会话跟踪。它还用于电子商务网站的构建和设计。\n\
    * `PHP` 与多种流行数据库有大量集成，如 `Microsoft SQL Server`、`MySQL`、`Oracle`、`Informix`、`PostgreSQL`\
    \ 和 `Sybase`。\n* 在执行速度方面，`PHP` 很容易成为快速语言，特别是当它在支持 Unix 的平台上以 `Apache modules`\
    \ 形式编译时。一旦开始，`MySQL` 服务器甚至可以运行最复杂的查询，并以破纪录的速度产生大量结果。\n* `PHP` 支持编程中使用的许多重要协议，如\
    \ `LDAP`、`IMAP` 和 `POP3`。在 `PHP 4` 中，引入了对 `Java` 的支持，以及如 `COBRA` 和 `COM` 等分布式对象架构的支持。多层级开发首次成为可能。\n\
    * `PHP` 是一种宽容的语言。`PHP` 语言在许多方面都尝试保持宽容。`PHP` 的语法与 `C` 相似。\n\n### `PHP` 的特性：\n五个重要特性贡献了\
    \ `PHP` 的实用性并使其成为可能：\n\n* 熟悉感\n* 效率\n* 灵活性\n* 简单性\n* 安全性\n\n### 在 PHP 中创建一个简单的程序：Hello\
    \ World 程序\n\n为了帮助你开始 `PHP` 编程，我们尝试创建一个传统的 Hello World 程序。这是一个简单的程序，执行时会产生 \"\
    Hello World!\"。\n\n```html\n<html>\n<head>\n  <title>Hello World Program</title>\n\
    </head>\n<body>\n  <?php echo \"Hello, World!\";?>\n</body>\n</</html>\n```\n\n\
    ### PHP 的应用场景：\n\n请记住，`PHP` 是当今世界上广为人知且流行的编程语言之一。在本节中，我们考虑了目前看到的一些 `PHP` 应用：\n\
    \n1. `PHP` 可用于限制用户对网站上单个页面的访问。\n2. `PHP` 可用于系统功能。也就是说，它可以对系统包含的文件进行关闭、打开、创建、写入和读取操作。\n\
    3. `PHP` 可用于数据加密。\n4. `PHP` 用于处理表单。也就是说，从文件中收集数据、将数据保存到文件中、通过电子邮件转发数据以及向用户返回数据。\n\
    5. `PHP` 用于设置 cookie 和访问 cookie 变量。\n6. `PHP` 可用于添加、删除和修改数据库中包含的元素。\n\n"
- fmt: "\n# Setting up a PHP Environment on Your System\n\nTo build and execute web\
    \ pages in PHP, three vital components are required to be installed in a computer\
    \ system. They include:\n\n- **PHP parser**: To process the instructions of PHP\
    \ scripts, you have to install a parser to generate HTML outputs which can be\
    \ forwarded to a web browser. A tutorial will guide you on how to go about the\
    \ installation of PHP parsers on your system in the ensuing paragraphs.\n- **Web\
    \ Server**: PHP can be applied with apparently every form of web server software,\
    \ including but not limited to the Internet Information Server (`IIS`) Microsoft.\
    \ However, it is most often used with the `Apache` Server that is freely available.\
    \ To get the `Apache` Server, you can download it via the link: `https://httpd.apache.org/download.cgi`.\n\
    - **Database**: PHP is applied with apparently all forms of database software,\
    \ including but not limited to Sybase and Oracle; however, it is typically used\
    \ with the `MySQL` database which is available for free. To get the `MySQL` Server,\
    \ you can download it via the link: `https://www.mysql.com/downloads/`.\n\n##\
    \ How to Install the PHP Parser\n\nBefore going ahead with the installation process,\
    \ it is imperative to ensure that you have already set up the PHP environment\
    \ on your system for developing web programs with PHP. To begin, enter the address\
    \ shown below into the query box of your browser: `http://127.0.0.1/info.php`.\
    \ When the address is executed, a page containing the information related to PHP\
    \ installation is displayed. This implies that your Webserver and PHP are correctly\
    \ installed. If not, you have to make use of the procedure shown below in installing\
    \ `PHP` on your system.\n\n## Setting up the Development Environment\n\n### On\
    \ Windows systems\nInstalling a Windows server is rather expensive, so you might\
    \ have to turn to cheaper alternatives in third-party apps which can be installed\
    \ and set up to provide a server environment suitable for coding. Some of such\
    \ apps that can be used include `WAMP` and `XAMPP`. Every one of these apps performs\
    \ the same function of installing `PHP`, `MySQL`, and `Apache` within the program.\
    \ Of both mentioned apps, `XAMPP` is most preferred by users. You can get the\
    \ latest `XAMPP` from the link `www.apachefriends.org` because it is cross-platform.\
    \ `XAMPP` I an acronym that stands for cross-platform (`X`), `Apache` (`A`), `MariaDB`\
    \ (`M`), `PHP` (`P`), and `Perl` (`P`).\n\nThe installation process for `XAMPP`\
    \ is pretty easy to carry out, so it shouldn't be a problem. Also, keep in mind\
    \ that it is possible to install `Laravel` with `XAMPP`. When the installation\
    \ wizard pops up, click next, and I agree when necessary. Albeit, in terms of\
    \ the development environment, you have to install the development environment\
    \ that is required to convert the `php.ini` file and enable error messages to\
    \ be shown. Should error messages not be displayed, visit the path `c:xampp/php/`\
    \ and click on the `php.ini` file. Ensure that everything placed under the logging\
    \ and error handling in line `463`, has been switched on, then start your `Apache`\
    \ server again.\n\nWhen the `XAMPP` has been completely installed, a dashboard\
    \ should open that can be used to initialize, end, and set up the services. When\
    \ you have completed the installation of `XAMPP` and have it ultimately set up\
    \ and running. Visit the Webroot that can be found in `c:xampp/htdocs/`, which\
    \ is the work environment for creating sites and applications. To check out your\
    \ work, proceed to visit the `localhost` into the address bar of your browser.\
    \ Doing this should start the launch of the index file within `htdocs`.\n\n###\
    \ On Mac systems\nThe installation on Mac systems is quite similar to that of\
    \ the Windows system. The least expensive and most straight forward to set up\
    \ the development environment is by installing third-party applications. In this\
    \ case, you can use `MAMP` and `XAMPP` even. Albeit, your choice of installation\
    \ doesn't matter because they all perform similar functions. Also, you must install\
    \ all the development files. On Mac, the Webroot is somewhat different from that\
    \ of Windows because it is located in the path `applications/xampp/htdocs`, aside\
    \ from this, there is no other noticeable difference. \n\n### On Linux (Debian\
    \ based) systems\nUnlike in Mac and Windows systems, it is a more sensible approach\
    \ not to use third-party apps on Linux systems. Instead of installing this software\
    \ into the system, make use of the software directly. It is still possible to\
    \ install the `XAMPP` application, though, should you prefer to use it. However,\
    \ keep in mind that it is a development environment, and you mustn't make use\
    \ of or configure those third-party applications in executing things like a live\
    \ server.\n\nNow, before you begin the installation of anything into your system,\
    \ ensure that the operating system is up-to-date. This can be done by executing\
    \ the commands shown below into the terminal of your system:\n\n```bash\nsudo\
    \ apt-get update\nsudo apt-get upgrade\nsudo apt-get dist-upgrade\n```\n\nExecuting\
    \ these commands makes sure that the system is current and up to date with the\
    \ present version of the software. If your system is up to date, you should find\
    \ out that `Apache 2` is already installed in most Linux systems, albeit, if you\
    \ are not already sure of its availability to try running the command `sudo apt-get\
    \ install apache2`. Keep in mind that attempting to execute an install command\
    \ for an application already in your system will change to checking for updates\
    \ for the said application.\n\nBy now, you must install a database. Be free to\
    \ explore and make use of any of your choosing. However, the most common database\
    \ used is `MySQL`. To install `MySQL` into your system, execute the commands shown\
    \ below:\n\n```bash\nsudo apt-get install mysql-server\nsudo mysql_secure_installation\n\
    ```\n\nOnce it is certain that `Apache 2` has been installed into your system,\
    \ `MySQL`, too, then you can proceed with the installation of `PHP`. To install\
    \ `PHP`, execute the command shown below:\n\n```bash\nsudo apt-get install php\n\
    ```\n\nAt this point, you must install `phpmyadmin` as it makes setting up easier\
    \ and faster to perform your chosen database. The installation process of `phpmyadmin`\
    \ is quite straightforward and can be done in a few steps. Begin by opening your\
    \ terminal and entering the block of code:\n\n```bash\nsudo apt-get install phpmyadmin\n\
    ```\n\nHaving successfully concluded the process, it is time to begin the configuration\
    \ of the Apache file such that it contains `phpmyadmin`. To do this, enter the\
    \ command below:\n\n```bash\nsudo echo -e \"\\nInclude /etc/phpmyadmin/apache.conf\"\
    \ >> /etc/apache2/apache2.conf\n```\n\nAt this point, the needful is to initialize\
    \ your database (`MySQL`), and third-party web server (`Apache`) and everything\
