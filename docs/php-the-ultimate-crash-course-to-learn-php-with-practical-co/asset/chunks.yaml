- fmt: "\n2. What is the function of the `fwrite()` function in PHP? \n\n3. How is\
    \ the length of a file identified in PHP? \n\n4. What is an `index.php` file?\
    \ \n\n5. What happens when opening a file is unsuccessful? \n\n6. What is the\
    \ purpose of file system functions? \n\n7. What is the function of a `file_exist`\
    \ function in a script? \n\n8. What function is used in opening a PHP file? \n\
    \n9. What serves as an argument of the `fclose()` function? \n\n10. What are files?\n\
    \n# Chapter Thirteen Web Concepts in PHP\n\nWeb concepts are merely the demonstration\
    \ of how PHP is capable of providing dynamic content based on browser type, user\
    \ input, and randomly created numbers.\n\nIdentifying platforms and browsers:\
    \ Important environment variables are created by PHP and can be found on the page\
    \ `phpinfo.php`, which is used in the setting up of PHP environments. `HTTP_USER_AGENT`\
    \ is one of the many environment variables set by PHP to identify the operating\
    \ system and browser of a user. Furthermore, the `getenv()` function is provided\
    \ by PHP for gaining access to the values of every environment variable. The data\
    \ held by the `HTTP_USER_AGENT` environment variable can be applied in the creation\
    \ of dynamic content suitable to the browser. The sample shown below is a demonstration\
    \ of how both the operating system and browser of a client can be identified.\n\
    \n```html\n<html>\n<body>\n<?php \nfunction getBrowser() {\n  $u_agent = $_SERVER['HTTP_USER_AGENT'];\n\
    \  $bname = 'Unknown';\n  $platform = 'Unknown';\n  $version = \"\"; //First get\
    \ the platform?\n  if (preg_match('/linux/i', $u_agent)) {\n    $platform = 'linux';\n\
    \  }elseif (preg_match('/macintosh|macos x/i', $u_agent)) {\n    $platform = 'mac';\n\
    \  }elseif (preg_match('/windows|win32/i', $u_agent)) {\n    $platform = 'windows';\n\
    \  }\n  // Next get the name of the user agent yes separately and for good reason\n\
    \  if(preg_match('/MSIE/i',$u_agent) && !preg_match('/Opera/i',$u_agent)) {\n\
    \    $bname = 'Internet Explorer';\n    $ub = \"MSIE\";\n  } elseif(preg_match('/Firefox/i',$u_agent))\
    \ {\n    $bname = 'Mozilla Firefox';\n    $ub = \"Firefox\";\n  } elseif(preg_match('/Chrome/i',$u_agent))\
    \ {\n    $bname = 'Google Chrome';\n    $ub = \"Chrome\";\n  }elseif(preg_match('/Safari/i',$u_agent))\
    \ {\n    $bname = 'Apple Safari';\n    $ub = \"Safari\";\n  }elseif(preg_match('/Opera/i',$u_agent))\
    \  {\n    $bname = 'Opera';\n    $ub = \"Opera\";\n  }elseif(preg_match('/Netscape/i',$u_agent))\
    \ {\n    $bname = 'Netscape';\n    $ub = \"Netscape\";\n  }\n  // finally get\
    \ the correct version number\n  $known = array('Version', $ub, 'other');\n  $pattern\
    \ = '#(?<browser>' . join('|', $known) . ')\\[/ \\]+(?<version>\\[0-9.|a-zA-Z.\\\
    ]\\*)#';\n  if (!preg_match_all($pattern, $u_agent, $matches)) {\n    // we have\
    \ no matching number just continue\n  }\n  // see how many we have\n  $i = count($matches['browser']);\n\
    \  if ($i != 1) {\n    //we have two since we are not using 'other' argument yet\n\
    \    //see if version is before or after the name\n    if (strripos($u_agent,\"\
    Version\") <strripos($u_agent,$ub)){\n      $version= $matches['version'][0];\n\
    \    }else {\n      $version= $matches['version'][1];\n    }\n  }else {\n    $version=\
    \ $matches['version'][0];\n  }\n  // check if we have a number\n  if ($version\
    \ == null || $version == \"\") {\n    $version = \"?\";\n  }\n  return array(\n\
    \    'userAgent' => $u_agent,\n    'name'      => $bname, \n    'version'  =>\
    \ $version, \n    'platform' => $platform, \n    'pattern'  => $pattern\n  );\n\
    }\n// now try it\n$ua = getBrowser();\n$yourbrowser = \"Your browser: \" . $ua['name']\
    \ . \" \" . $ua['version']  . \" on .\" .$ua['platform'] . \" reports: <br>\"\
    \ . $ua['userAgent'];\nprint_r($yourbrowser); \n?> \n</body>\n</html>\n```\n\n\
    When the sample code is executed, many results may be produced depending on your\
    \ computer, operating system, browser, among others. The result that produced\
    \ is as follows: Your browser: Google Chrome 54.0.2840.99 on windows reports:\
    \ Mozilla/5.0 (Windows NT 6.3; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)\
    \ Chrome/54.0.2840.99 Safari/537.3 6\n\n### Randomly Displaying Images: The function\
    \ `rand()` in PHP is used in the generation of random numbers. The function is\
    \ capable of generating numbers within a specified range. The random number generator\
    \ ought to be seeded to curb the generation of a series of regular patterned numbers.\
    \ To do this: the `rand()` function is dropped for the `srand()` function which\
    \ specifies a seed number for an argument. The sample shown below is a demonstration\
    \ of how any random image of four pictures can be displayed:\n\n```html\n<html>\n\
    <body>\n<?php \nsrand( microtime() * 1000000 );\n$num = rand( 1, 4 );\nswitch(\
    \ $num ) {\n  case 1:\n    $image_file = \"/php/images/logo.png\";\n    break;\n\
    \  case 2:\n    $image_file = \"/php/images/php.jpg\";\n    break;\n  case 3:\n\
    \    $image_file = \"/php/images/logo.png\";\n    break;\n  case 4:\n    $image_file\
    \ = \"/php/images/php.jpg\";\n    break;\n}\necho \"Random Image : <imgsrc=$image_file\
    \ />\"; \n?> \n</body>\n</html>\n```\n\nWhen the sample code is executed, the\
    \ result produced should be any one of four random images.\n\n### How to Use HTML\
    \ Forms in PHP: It is imperative to keep one thing in mind when using HTML forms\
    \ and PHP codes together: any form element located within an HTML page can be\
    \ automatically made available to a PHP script. Consider the code sample shown\
    \ below by placing the source code into a `test.php` script.\n\n```php\n<?php\
    \ \nif($_POST[\"name\"] || $_POST[\"age\"]) ) {\n  if (preg_match(\"/\\[^A-Za-z'-\\\
    ]/\",$_POST['name'] )) {\n    die (\"invalid name and name should be alpha\");\n\
    \  }\n  echo \"Welcome \".$POST['name'].\"<br />\";\n  echo \"You are \".$POST['age'].\
    \ years old.\";\n  exit();\n} \n?> \n<html>\n<body>\n<form action=\"<?php $_SERVER['PHP_SELF'];\
    \ ?>\" method=\"POST\">\n  Name: <input type=\"text\" name=\"name\" />\n  Age:\
    \ <input type=\"text\" name=\"age\" />\n  <input type=\"submit\" />\n</form>\n\
    </body>\n</html>\n```\n\nThe result outputted will be as follows : Name: Age:\
    \ Submit The default variable `$_PHP_SELF` can be used as the name of a PHP script.\
    \ And on clicking the submit button, the same script is called to produce a similar\
    \ result. The method `POST` can be used in posting data onto the server.\n\n##\
    \ Exercise 13\n\n1. How is browser redirection done in PHP? \n2. What is the use\
    \ of the `rand()` function in PHP? \n3. Describe the use of the environment variable\
    \ `HTTP_USER_AGENT`. \n4. Define the term \"web concepts.\" \n5. What measure\
    \ is taken to restrict loading other parts of a page?\n"
