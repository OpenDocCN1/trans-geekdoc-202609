    \ a future period in seconds as 00:00:00 GMT+1 on 1st Jan 1963. After this period,\
    \ the cookie attains a state of inaccessibility. If expiry parameter isn't already\
    \ set by the time, then the cookie expires automatically anytime the web browser\
    \ is terminated. Path: The path variable is used in specifying the directories\
    \ in which a cookie has validity. A solo forward-slash (/) character enables the\
    \ cookie to maintain validity across every directory. Domain: The domain variable\
    \ is used in specifying the domain name of large domains and has to have a minimum\
    \ of two periods to be considered valid. Every cookie only exhibits validity towards\
    \ the domain and host in which they were created. Security: It's possible to set\
    \ the security variable to 1 and specify that a cookie ought to be forwarded only\
    \ through secure transmission by HTTPS. Otherwise, it is set to 0, which implies\
    \ that the cookie could be transferred through regular HTTP . Going with the sample\
    \ shown below will lead to the formation of two cookies; name and department.\
    \ Both cookies have a validity period of an hour (3600 seconds) after which they\
    \ are expired. <?php setcookie(\"name\", \"Jane Doe\", time()+3600, \"/\",\"\"\
    , 0); setcookie(\"department\", \"English\", time()+3600, \"/\", \"\", 0); ?>\
    \ <html> <head> <title>Setting Cookies with PHP</title> </head> <body> <?php echo\
    \ \"Set Cookies\"?> </body> </html> Gaining access to Cookies using PHP: In PHP,\
    \ there are many different ways in which cookies can be accessed. The simplest\
    \ method is usually done through the use of either $HTTP\\_COOKIE\\_VARS or $\\\
    _COOKIE variables. Proceeding with the sample shown below grants access to every\
    \ cookie that is set in the sample shown above: <html > <head> <title>Gaining\
    \ Access to Cookies using PHP</title> </head> <body> <?php echo $\\_COOKIE\\[\"\
    name\"\\]. \"<br />\"; /\\* is equivalent to \\*/ echo $HTTP\\_COOKIE\\_VARS\\\
    [\"name\"\\]. \"<br />\"; echo $\\_COOKIE\\[\"department\"\\] . \"<br />\"; /\\\
    * is equivalent to \\*/ echo $HTTP\\_COOKIE\\_VARS\\[\"department\"\\] . \"<br\
    \ />\"; ?> </body> </html> To check the status of the cookie; whether or not it\
    \ is set, the isset() function is applied: <html> <head > <title>Gaining Access\
    \ to Cookies using PHP</title> </head> <body> <?php if( isset($\\_COOKIE\\[\"\
    name\"\\])) echo \"Welcome, \" . $\\_COOKIE\\[\"name\"\\] . \"<br />\"; else echo\
    \ \"Sorry... Name not recognized\" . \"<br />\"; ?> </body> </html> Deleting Cookies\
    \ in PHP: The generally accepted method of deleting cookies in PHP revolves around\
    \ calling the setcookie() function using the name argument alone. And since it\
    \ doesn't always pan out well, it shouldn't be entirely relied on. The best alternative\
    \ is to set the cookie using a date that is already expired, as in the sample\
    \ shown below: <?php setcookie( \"name\", \"\", time()- 60, \"/\",\"\", 0) ; setcookie(\
    \ \"department\", \"\", time()- 60, \"/\",\"\", 0); ?> <html> <head> <title>Deleting\
    \ Cookies in PHP</title> </head> <body> <?php echo \"Cookies Deleted\" ?> </body>\
    \ </html> Exercise 17: \n\n1.  How are cookies deleted in PHP? \n\n2.  What are\
    \ the variables $HTTP\\_COOKIE\\_VARS and $\\_COOKIE used fro? \n\n3.  What variable\
    \ is used in specifying the directories in which a cookie has validity? \n\n4.\
    \  Where is the information passed to the browser to forget all cookies found?\
    \ \n\n5.  What are cookies for? \n\nAnswers Exercise 1: \n\n1.  PHP is particularly\
    \ well suited for application in Hypertext Markup Language (HTML) and web development.\
    \ \n\n2.  The PHP interpreter is usually located on a CGI (Common Gateway Interface)\
    \ or web server as an implemented module. \n\n3.  PHP/Fi, meaning Personal Home\
    \ Page/Forms Interpreter. \n\n4.  Andi Gutmans and ZeeySurask. \n\n5.  PHP 4 was\
    \ published in May of 2000, "
