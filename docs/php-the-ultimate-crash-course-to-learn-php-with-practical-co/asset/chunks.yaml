  trans: "\n\n# 创建自定义函数\n\n在 PHP 中创建自己的函数的过程非常简单。在声明自定义函数时，使用 `function` 关键字开始声明。语法如下：\n\
    \n```\nfunction functionName() { code to be executed; }\n```\n\n请记住，每个函数名必须以下划线或字母开头。通常，函数名是区分大小大小的。\n\
    \n### 示例\n例如，你希望在 PHP 中创建一个函数，每当在程序中调用该函数时，都能在浏览器上写入你指定的任何笔记。后续部分显示的示例展示了如何创建一个名为\
    \ `noteWriter()` 的函数，以及如何在创建后立即调用它。请记住，在创建函数时，分配给它的名称必须以关键字 `function` 开头；这意味着该名称应当反映函数的用途。完成后，所有的\
    \ PHP 代码都应该包含在花括号 `{}` 中，如下例所示：\n\n```html\n<<html>\n<head>\n<title>Coding in\
    \ PHP</title>\n</head>\n<body>\n<?php\n/* 定义 PHP 函数 */\nfunction noteWriter()\
    \ {\n    echo \"It is a fine day today. Have a great day ahead!\";\n}\n/* 调用 PHP\
    \ 函数 */\nnoteWriter();\n?>\n</body>\n</html>\n```\n\n当代码执行时，输出结果如下：`It is a fine\
    \ day today. Have a great day ahead!`。左大括号表示函数代码的开始，而右大括号用于指示函数的终点。该函数打印“Welcome\
    \ to PHP.”。要访问该函数，我们只需要写出它（或调用它）并为其附上括号 `()` 即可：\n\n```php\n<?php\nfunction noteWriter()\
    \ {\n    echo \"Welcome to PHP!\";\n}\nnoteWriter(); // 调用函数\n?>\n```\n\n## PHP\
    \ 中的函数参数\n\n可以使用参数将任何信息传递给函数。参数与变量非常相似；但它们通常被指定在函数名后的括号内。在 PHP 中，可以同时添加许多不同的参数。不过，请记住使用逗号分隔每个参数，以获得更好的可读性和更顺畅的执行。\n\
    \n考虑下面的示例，该函数只有一个参数——`($mnum)`。每当调用 `matricNumber()` 函数时，请注意传递一个数字（例如 `131`），该数字将应用于函数内部，输出许多不同的学号，但使用的是相同的基础代码\
    \ `(U1963/5203)`：\n\n```php\n<?php\nfunction matricNumber($mnum) {\n    echo \"\
    $mnumRefsnes.<br>\";\n}\nmatricNumber(\"131\");\nmatricNumber (\"132\");\nmatricNumber\
    \ (\"133\");\nmatricNumber (\"134\");\nmatricNumber (\"135\");\n?>\n```\n\n###\
    \ 通过引用传递参数\n\n通过引用向函数传递参数是一种可行的操作。在此过程中，函数操作的是变量的引用而不是赋值值的副本。因此，在这种情况下对参数的修改会修改第一个变量的值。通过在函数定义或函数调用中的变量名中包含符号符号\
    \ `&`，可以按引用传递参数。查看下面的示例以更好地理解这两种情况：\n\n```html\n<html>\n<head>\n<title>Passing\
    \ Argument through Reference</title>\n</head>\n<body>\n<?php\nfunction addTen($num)\
    \ {\n    $num += 10;\n}\nfunction addFifteen(&$num) {\n    $num += 15;\n}\n$initnum\
    \ = 20;\nadd10( $initnum );\necho \"Initial Value is $initnum<br />\";\naddFifteen(\
    \ $initnum );\necho \"Initial Value is $initnum<br />\";\n?>\n</body>\n</html>\n\
    ```\n\n当代码执行时，输出结果如下：`Initial Value is 30`, `Initial Value is 35`。\n\n## PHP 中的默认参数值\n\
    \n下面的示例描述了如何在 PHP 中使用默认参数。当不带任何参数调用 `setLength()` 函数时，它将假设一个默认值作为参数：\n\n```php\n\
    <?php\ndeclare(strict_types=5); // 严格要求\nfunction setLength(int $minlength = 25)\
    \ {\n    echo \"The length is : $minlength<br>\";\n}\nsetLength (100);\nsetLength\
    \ (); // 将使用默认值 25\nsetLength (150);\nsetLength (75);\n?>\n```\n\n## PHP 中的带参数函数\n\
    \n在 PHP 中，你可以在函数内部传递参数。与参数一样，可以同时传递许多不同的参数。参数在函数内部的作用类似于变量。查看下面的示例，其中两个整数参数被相加并打印出来：\n\
    \n```html\n<html>\n<head>\n<title>Functions with Parameters in PHP</title>\n</head>\n\
    <body>\n<?php\nfunction addFunction($num5, $num10) {\n    $sum = $num5 + $num10;\n\
    \    echo \"Sum of the both numbers is : $ans\";\n}\naddFunction(30, 50);\n?>\n\
    </body>\n</html>\n```\n\n执行时，上述示例代码的结果如下：`Sum of both numbers is: 80`。\n\n###\
    \ PHP 的特性\n\n注意正上面的示例，关于 PHP 并没有提及由哪种数据类型表示变量。程序能够根据其值自动为变量分配特定的数据类型。由于数据类型没有按照任何严格顺序排列，因此执行诸如向字符串添加整数等操作而不会触发错误。\n\
    \n类型声明在 PHP 7 中引入。这允许用户在声明函数时指定预期的数据类型，通过包含 `\"strict\"` 声明，如果数据类型不匹配，将触发“致命错误（Fatal\
    \ Error）”。\n\n在概述的示例中：\n\n```php\n<?php\nfunction addFunction($num5, $num10) {\n\
    \    $sum = $num5 + $num10;\n    echo \"Sum of the both numbers is : $ans\";\n\
    }\n?>\n```\n（注：提供的文本后半部分包含重复和碎片化的内容；类型声明的核心逻辑保留在下方）。\n\n类型声明允许用户指定预期的数据类型。通过包含\
    \ `declare(strict_types=1)`，在不匹配时会触发 `Fatal Error`。\n\n```php\n<?php\ndeclare(strict_types=1);\n\
    function addNumbers(int $x, int $y): int {\n    return $x + $y;\n}\necho addNumbers(10,\
    \ 20);\n?>\n```\n\n## PHP 中的返回值\n\n要从函数返回值，我们使用 `return` 关键字。这允许函数将结果返回给调用者。一旦遇到\
    \ `return`，函数就会终止。\n\n### 返回值的示例\n```php\n<?php\nfunction addFunction($num5, $num10)\
    \ {\n    $sum = $num5 + $num10;\n    return $sum;\n}\n$result = addFunction(30,\
    \ 50);\necho $result;\n?>\n```\n\n## 练习 11:\n\n"
- fmt: "\n1.  How does a `return` keyword work? \n\n2.  When a type mismatch occurs\
    \ in a block of code with a strict requirement declaration, what happens? \n\n\
    3.  Why are default values assigned to parameters? \n\n4.  How can an argument\
    \ be passed by reference? \n\n5.  What is a function? \n\n6.  What is the naming\
    \ rule and convention for function names in PHP? \n\n7.  What is an argument,\
    \ and what does it do? \n\n8.  When was type declarations introduced, and what\
    \ do they do? \n\n9.  For smoother execution and better readability, how are multiple\
    \ arguments separated in PHP? \n\n10. What is the meaning of an opening and closing\
    \ curly braces in function operations?\n\n# Chapter Twelve: Files in PHP\n\nIn\
    \ PHP, files refer to webpages which hold Hypertext Pre-processor (PHP) codes.\
    \ These files could contain PHP functions which are capable of processing online\
    \ forms, accessing data from a database, or obtaining time and date. The PHP engine\
    \ located in web servers is responsible for parsing or processing the PHP code\
    \ found in the webpage, thus resulting in the dynamic generation of HTML. Keep\
    \ in mind that content of the webpage is contained in the HTML, and it is it (the\
    \ HTML) that is forwarded to the web browsers of users. As a result, users are\
    \ seldom ever aware of the real PHP codes that webpages hold, even when the page\
