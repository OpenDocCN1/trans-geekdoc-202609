    \ if version is before or after the name if (strripos($u\\_agent,\"Version\")\
    \ <strripos($u\\_agent,$ub)){ $version= $matches\\['version'\\]\\[0\\]; }else\
    \ { $version= $matches\\['version'\\]\\[1\\]; } }else { $version= $matches\\['version'\\\
    ]\\[0\\]; } // check if we have a number if ($version == null || $version == \"\
    \") {$version = \"?\";} return array( 'userAgent' => $u\\_agent, 'name'     =>\
    \ $bname, 'version'  => $version, 'platform' => $platform, 'pattern'  => $pattern\
    \ ); } // now try it $ua = getBrowser(); $yourbrowser = \"Your browser: \" . $ua\\\
    ['name'\\] . \" \" . $ua\\['version'\\]  . \" on \" .$ua\\['platform'\\] . \"\
    \ reports: <br>\" . $ua\\['userAgent'\\]; print\\_r($yourbrowser); ?> </body>\
    \ </html> When the sample code is executed, many results may be produced depending\
    \ on your computer, operating system, browser, among others. The result that produced\
    \ is as follows: Your browser: Google Chrome 54.0.2840.99 on windows reports:\
    \ Mozilla/5.0 (Windows NT 6.3; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)\
    \ Chrome/54.0.2840.99 Safari/537.3 6 Randomly Displaying Images: The function\
    \ rand() in PHP is used in the generation of random numbers. The function is capable\
    \ of generating numbers within a specified range. The random number generator\
    \ ought to be seeded to curb the generation of a series of regular patterned numbers.\
    \ To do this: the rand() function is dropped for the srand() function which specifies\
    \ a seed number for an argument. The sample shown below is a demonstration of\
    \ how any random image of four pictures can be displayed: <html> <body> <?php\
    \ srand( microtime() \\* 1000000 ); $num = rand( 1, 4 ); switch( $num ) { case\
    \ 1: $image\\_file = \"/php/images/logo.png\"; break  ; case 2: $image\\_file\
    \ = \"/php/images/php.jpg\"; break; case 3: $image\\_file = \"/php/images/logo.png\"\
    ; break; case 4: $image\\_file = \"/php/images/php.jpg\"; break; } echo \"Random\
    \ Image : <imgsrc=$image\\_file />\"; ?> </body> </html > When the sample code\
    \ is executed, the result produced should be any one of four random images. How\
    \ to Use HTML Forms in PHP: It is imperative to keep one thing in mind when using\
    \ HTML forms and PHP codes together: any form element located within an HTML page\
    \ can be automatically made available to a PHP script. Consider the code sample\
    \ shown below by placing the source code into a test.php script. <?php if( $\\\
    _POST\\[\"name\"\\] || $\\_POST\\[\"age\"\\] ) { if (preg\\_match(\"/\\[^A-Za-z'-\\\
    ]/\",$\\_POST\\['name'\\] )) { die (\"invalid name and name should be alpha\"\
    ); } echo \"Welcome \". $\\_POST\\['name'\\]. \"<br />\"; echo \"You are \". $\\\
    _POST\\['age'\\]. \" years old.\"; exit(); } ? > <html> <body> <form action =\
    \ \"<?php $\\_PHP\\_SELF ?>\" method = \"POST\"> Name: <input type = \"text\"\
    \ name = \"name\" /> Age: <input type = \"text\" name = \"age\" /> <input type\
    \ = \"submit\" /> </form> </body> </html> The result outputted will be as follows\
    \ : Name: Age: Submit The default variable $\\_PHP\\_SELF in PHP can be used as\
    \ the name of a PHP script. And on clicking on the submit button, the same script\
    \ in PHP is called to produce a similar result. The method \"POST\" can be used\
    \ in posting the data of users onto the server scripts. In posting data onto a\
    \ server script, there are two main methods used. Browser Redirection: The function\
    \ header() in PHP works to supply a browser with raw HTTP headers, and can also\
    \ be applied in redirecting it to other locations. To avoid the loading of other\
    \ parts of a page; the redirection script must be placed at the topmost area of\
    \ the page. \"Location\" is used to specify the target, while header serves as\
    \ the argument assigned to the function header(). After once the function has\
    \ been called, the exit() function is applied  in pausing the processing of the\
    \ remainder of the code. The sample shown below contains a demonstration of how\
    \ a browser request can be redirected to other web pages. Try your hands at this\
    \ test sample by placing the source code into a test.php script. <?php if( $\\\
    _POST\\[\"location\"\\] ) { $location = $\\_POST\\[\"location\"\\]; header( \"\
    Location:$location\" ); exit(); } ?> <html> <body> <p>Choose a site to visit :</p>\
    \ <form action = \"<?php $\\_SERVER\\['PHP\\_SELF'\\] ?>\" method =\"POST\"> <select\
    \ name = \"location\">. <option value = \"http://www.tutorialspoint.com\"> Tutorialspoint.com\
    \ </option > <option value = \"http://www.google.com\"> Google Search Page </option>\
    \ </select> <input type = \"submit\" /> </form> </body> </html> Exercise 13: \n\
    \n1.  How is browser redirection done in PHP? \n\n2.  What is the use of the rand()\
    \ function in PHP? \n\n3.  Describe the use of the environment variable HTTP\\\
    _USER\\_AGENT. \n\n4.  Define the term \"web concepts.\" \n\n5.  What measure\
    \ is taken to restrict loading other parts of a page? "
