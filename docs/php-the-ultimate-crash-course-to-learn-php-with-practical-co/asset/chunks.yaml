    \ file. Take for instance, when a sample page `http://myexample.org/` is requested,\
    \ the page that is loaded is usually `http://myexample.org/index.php`.\n\n## File\
    \ Operations in PHP\n\n### Opening files in PHP\n\nFor Windows-supported systems,\
    \ the application `Notepad` can be used to open PHP files. However, syntax highlighting\
    \ is recommended when learning to code in PHP that even more, professional PHP\
    \ programmers prefer it. As a result, go for any of these when searching for text\
    \ editors with syntax highlighting features: `Programmer's Notepad`, `Visual Studio\
    \ Code`, `Sublime Text`, `Vim`, `Atom`, and `CodeLobster IDE`. Albeit, while the\
    \ programs mentioned above can be used for editing and changing files in PHP,\
    \ they don't have the facilities to allow you to operate a PHP server. To do this,\
    \ you would require complex programs, such as the `Apache Web Server`.\n\n###\
    \ Making PHP work with HTML\n\nWhen PHP code is contained in an HTML file, it\
    \ is considered to be PHP-related rather than an HTML one when it is contained\
    \ in tags rather than the traditional HTML tags:\n\n```php\n<?php [PHP code goes\
    \ here] ?>\n```\n\n### Closing and opening files in PHP\n\nIn PHP, the function\
    \ `fopen()` is used for opening a file. Two arguments are required; first stating\
