- fmt: "\n### 5. What is used in the processing of PHP codes?\n\n### 6. What qualities\
    \ endear PHP to programmers?\n\n### 7. How do PHP pages output HTML?\n\n### 8.\
    \ What is the key distinguishing factor between PHP and other programming languages?\n\
    \n### 9. What is a considerable upside of learning PHP?\n\n## Chapter Two: Why\
    \ Learn PHP?\n\nAccording to its history, `PHP` was started as a quiet open source\
    \ project which grew and evolved as it gained recognition across a population\
    \ that found it very useful. And since its release in 1994, it has become increasingly\
    \ sought after by learners and professionals alike who seek to become better at\
    \ software engineering, mainly when it involves the area of Web Development Domain.\n\
    \nSome of the upsides of learning `PHP` are outlined below:\n\n* `PHP` is a scripting\
    \ language for servers and browsers and is embedded in `HTML`. As a result, it\
    \ is applied in managing databases, dynamic content, and session tracking. It\
    \ is also used in the building and designing of e-commerce sites. \n* `PHP` has\
    \ lots of integration with a variety of popular databases, such as `Microsoft\
    \ SQL Server`, `MySQL`, `Oracle`, `Informix`, `PostgreSQL`, and `Sybase`. \n*\
    \ `PHP` is easily a fast language in terms of execution, mainly when it is compiled\
    \ in the form of `Apache modules` on Unix-enabled platforms. Once it begins, the\
    \ `MySQL` server runs even the most sophisticated of queries and produces a vast\
    \ array of results at a record-breaking rate. \n* `PHP` supports a lot of significant\
    \ protocols used in programming, like the `LDAP`, `IMAP`, AND `POP3`. In `PHP\
    \ 4`, support was introduced for `Java`, as well as distributed objects architecture\
    \ like `COBRA` and `COM`. And for the first time, n-tier development was made\
    \ possible.\n* `PHP` is a forgiving language. The `PHP` language attempts to be\
    \ forgiving in many ways. `PHP` syntax is somewhat similar to that of `C`.\n\n\
    ### Features of `PHP`:\nFive important features contribute to the practical nature\
    \ of `PHP` and make it possible:\n\n* Familiarity\n* Efficiency\n* Flexibility\n\
    * Simplicity\n* Security\n\n### Creating A Simple Program in PHP: The Hello World\
    \ Program\n\nTo help you get started on `PHP` programming, we attempt to create\
    \ the traditional Hello World program. It is a simple program, which, when executed,\
    \ produces \"Hello World!\"\n\n```html\n<html>\n<head>\n  <title>Hello World Program</title>\n\
    </head>\n<body>\n  <?php echo \"Hello, World!\";?>\n</body>\n</html>\n```\n\n\
    ### How PHP is Applied:\n\nKeep in mind that `PHP` is one of the widely known\
    \ and popularly used programming language across the world today. In this section,\
    \ we consider some of the few applications of `PHP` as seen today:\n\n1. `PHP`\
    \ can be used in restricting the access of users to individual pages found on\
    \ a website. \n2. `PHP` can be used in carrying out system functions. That is,\
    \ from the files contained in a system, it can be used to close, open, create,\
    \ write and read these files.\n3. `PHP` can be used in the encryption of data.\n\
    4. `PHP` is used in handling forms. That is, gathering the data from files, saving\
    \ the data to files, forwarding data through emails, and returning data to a user.\n\
    5. `PHP` is used in setting cookies and accessing cookies variables.\n6. `PHP`\
    \ can be used to add, delete, and modify the elements contained in a database.\n"
