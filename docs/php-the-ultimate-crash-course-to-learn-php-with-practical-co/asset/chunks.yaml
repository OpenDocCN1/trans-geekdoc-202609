    # Introduction

    The internet is a miracle that is used across the world in a variety of ways.
    A good part of the internet is made up of webpages connected to one service or
    another. In turn, these services are useful in our everyday lives. Webpages are
    primarily built using `PHP` programs. So, in all, it goes to say that `PHP` forms
    an integral part of our lives even without our knowledge. In this vein, it cannot
    now be overstated how vital `PHP` can be to a learner regardless of how or where
    it is applied. It is for this reason this book was written. That it might intimate
    beginners on the basics of the language and introduce them to the vast potentials,
    it holds. Contained in this book is a well-detailed content with a simplistic
    style and unmatched practicality. Journey into the world of `PHP`, and grow in
    the knowledge of knowing what makes the internet go round. You''ll be glad you
    did.


    # Chapter One: Introduction to PHP

    `PHP` is a recursive acronym for Hypertext Pre-processor. It is an open-source
    programing language that can be put to a variety of uses, accounting for its popularity
    and broad applications. However, as its name must have spelt out, `PHP` is particularly
    well suited for application in hypertext Markup Language (`HTML`) and web development,
    as a result of its original scripting as created in 1994 by `Rasmus Lerdorf`.
    Among contemporary programming languages, `PHP` does well for itself, earning
    it a high place as one of the most used and powerful languages there is in the
    world today. Its versatility points at why `Facebook` and `WordPress`, some of
    the most significant outfits in their respective niches in present times, use
    them for their programming. The flexibility, speed, and pragmatism of the language
    make it even more endearing to programmers to whom such qualities are of the highest
    import.


    Coding style:

    ```html

    <!DOCTYPE html> <html> <head> <title>Samplecode</title> </head > <body> <?php
    echo "Hello, this is a PHP script!";  </body></</html>

    ```


    Rather than make use of tons of commands in outputting HTML, as done by other
    programming languages, such as `Perl` and `C`, `PHP` pages comprise of an HTML
    containing embedded programming designed to perform a function. In the case of
    the code example above, the function is to output the line "Hello, this is a PHP
    script." Also, the `PHP` code is encased in special instructions at the start
    and end, allowing a user the ability to move in and out of the `PHP` mode. A key
    distinguishing factor between `PHP` and another programming language, such as
    the client-side `JavaScript` is the fact that code is run on a server and the
    HTML to be forwarded to the client is generated. The client would be notified
    of the results of the script execution process without a shred of knowledge about
    the underlying code of the script. It is also possible to configure one''s web
    server in such a way that it processes every HTML file in `PHP`. This makes users
    incapable of knowing about your codes or scripts. One of the better upsides of
    learning `PHP` is that it isn''t as arduous to learn for a beginner, while at
    the same time offering multiple advanced features veteran programmers would find
    useful. And although there is a long list of features in `PHP`, one can join in
    within a short period and be able to create simple `PHP` programs in record time.
    Like any other programming language, `PHP` codes can be run using a `CLI` (command-line
    interface) contained within an HTML code or utilized together with a host of web
    systems, content management frameworks, and web template systems. A `PHP` interpreter
    sees the processing of `PHP` codes and is usually located on a `CGI` (Common Gateway
    Interface) or web server as an implemented module. The webserver outputs the results
    containing the `PHP` codes that have been run and interpreted. The outputted code
    could take on any form, ranging from a binary image data to a generated HTML code.
    Outside of web development and application, it is possible to use `PHP` for other
    forms of programming, like in robotic drone control or stand-alone graphical applications.


    ## History of PHP

    The development of `PHP` can be traced back to `Rasmus Lerdorf` in 1994. `Lerdorf`
    is credited to have written a couple of `CGI` (common gateway interface) programs
    in the programming language—`C`. It was said that he regulated his homepage using
    those programs. `Lerdorf` experimented with web forms and succeeded, hence the
    extension to web development and communication with databases. He termed his implementation
    `PHP/FI`, an acronym for Personal Home Page/Forms Interpreter. This creation of
    `Lerdorf`''s could be applied in the creation of dynamic web applications with
    simple structures. To speed up the rate of reporting bugs for code improvement
    a reinvention of `PHP/FI` into `PHP Tools` (Personal Home Page Tools) was announced
    by `Lerdorf` on a discussion group in `Usenet` in 1995, June 8th. The new release
    already contained some of the primary functions `PHP` is capable of till date,
    including the embedment of HTML, `Perl`-like variables, and form handling. The
    syntax has some similarities to the one used by `Perl`; however, its simplistic
    design proved to be more inhibitive than it was consistent. Below is a code sample
    of one of the earliest syntaxes of the language:


    ```text

    <!--include /selectedtext/header.html-->

    <!--getenv HTTP\_USER\_AGENT-->

    <!--ifsubstr $exec\_resultChrome--> Hello, you are using Netscape!<p > <!--endif-->

    <!--sql database select \* from group where user=''$username''-->

    <!--ifless $numentries2--> Sorry, such record does not exist<p> <!--endif exit-->
    Welcome <!--$user-->!<p> You have <!--$index:4--> credits remaining in your account.<p>

    <!--include /selectedtext/footer.html-->

    ```


    The earliest forms of `PHP` weren''t created with the intent of becoming a programming
    language; hence, its growth and spread were organic. Even `Lerdorf` acknowledged
    this when he confessed to having no idea how to stop the widespread use, as he
    had no intention whatsoever of coming up with a programming language. A development
    team was assembled to work on the language, and after an extended period of working
    and beta tests, `PHP/FI` 2 made its public debut in 1997. The sheer knowledge
    of PHP not expressly designed as a programming language, but instead was organically
    developed has resulted in a bit of inconsistency in areas such as the naming of
    functions, and the ordering of their parameters. Other cases for inconsistency
    can be seen in how function names were picked to complement from PHP.


    ## PHP 3&4

    In 1997, `Andi Gutmans` and `Zeey Suraski` jointly wrote the parser, and are both
    credited with the fundamental parts of `PHP 3`, as well as the change of the languages
    name into the recursive acronym it now means. Public testing began on `PHP 4`
    afterwards, but the official launch wasn''t until 1998 in June. At this point,
    `Gutmans` and `Suraski` had begun to rewrite the core of the language, leading
    to the production of the `Zend Engine` in 1999. Both programmers are also credited
    with the creation of `Zend Technologies` in Israel (Ramat Gan region). In May
    of the year 2000, `PHP 4` was published. It ran on the new `Zend Engine 1.0`.
    By the August of 2008, `PHP 4` reached version `4.4.9` and was discontinued; so
    no further releases or updates would be done on it.


    ## Exercise 1

    1. What purpose is `PHP` most suited to perform?

    2. Where is a `PHP` interpreter found?

    3. What title did `RasmusLerdorf` term his implementation of regulated personal
    homepages?

    4. What group is credited with the creation of the fundamental parts of `PHP 3`,
    as well as the name the program now bears?

    '
