  trans: "\n\n## 2. 哪种方法可以书签请求？\n\n## 3. HTTP 是如何工作的？\n\n## 第十五章：PHP 中的文件包含\n\n在通过服务器处理之前，可以将一个\
    \ PHP 文件的内容添加到另一个文件中。通常情况下，可以使用两种类型的 PHP 函数来将一个 PHP 文件包含到第二个 PHP 文件中。它们是：`require()`\
    \ 函数和 `include()` 函数。在 PHP 中，这是一项非常重要的操作，因为它有助于创建页眉（headers）、元素、页脚和函数，这些内容可以在多个不同的页面中重复引入。它可以帮助开发者以最少的精力设计出修改整个网站布局的方法。如果需要进行任何形式的更改，而不是修改数以千计的文件，只需更改被添加的文件即可。\n\
    \n### `include()` 函数\n\n此函数用于获取特定文件中包含的所有文本，并将其复制到应用 `include` 函数的文件中。在处理文件时，如果遇到任何问题，`include()`\
    \ 函数会抛出一个警告，但无论如何，脚本都会继续执行。例如，你想为网页创建一个公共菜单。使用下面所示的命令创建一个文件 `menu.php`：\n\n```html\n\
    <a href=\"http://www.sampledomain.com/index.htm\">首页</a> - <a href=\"http://www.sampledomain.com/ebxml\"\
    >ebXML</a> - <a href=\"http://www.sampledomain.com/ajax\">AJAX</a> - <a href=\"\
    http://www.sampledomain.com/perl\">PERL</a>\n```\n\n一旦成功完成该操作，继续创建你需要的任意页面。继续添加下面所示的文件来开发页眉。例如，你的\
    \ `test.php` 文件可以包含下面所示的代码：\n\n```php\n<html>\n<body>\n  <?php include(\"menu.php\"\
    ); ?>\n  <p>这是一个显示如何包含 PHP 文件的示例！</p>\n</body>\n</html>\n```\n\n注（更正）\n\n当脚本被解析时，结果如下：首页\
    \ - ebXML AJAX – PERL。这是一个演示如何包含 PHP 文件的示例。\n\n### `require()` 函数\n\n此函数用于获取给定文件中找到的文本并将其复制到使用\
    \ `include` 函数的文件中。如果在执行文件的过程中出现任何问题，`require()` 函数负责抛出一个致命错误（fatal error），从而严重中断该文件的运行。从这个来看，可以看出\
    \ `require()` 和 `include()` 函数之间的区别不存在，除非是在处理错误情况的情况下。从这个意义上说，`require()` 函数是替代\
    \ `include()` 函数的更好、更推荐的方案。原因是，当发现错误（如命名错误或文件缺失）时，不应继续处理脚本。\n\n你可以尝试对上面的示例使用 `require()`\
    \ 函数，生成的结果没有区别。但是，如果你遵循第二个文件不存在的示例，那么 `include()` 和 `require()` 函数得到的结果是不同的。\n\
    \n```php\n<html>\n<body>\n  <?php include(\"xxmenu.php\"); ?>\n  <p>这是一个演示如何包含错误的\
    \ PHP 文件的示例！</p>\n</body>\n</html>\n```\n\n当脚本被处理时，得到的结果如下：这是一个演示如何包含错误的 PHP 文件的示例！在完成此操作后，让我们这次尝试使用\
    \ `require()` 函数运行相同的示例：\n\n```php\n<html>\n<body>\n  <?php require(\"xxmenu.php\"\
    ); ?>\n  <p> 这是一个演示如何包含错误的 PHP 文件的示例！</p>\n</body>\n</html>\n```\n\n在这种情况下，当处理该文件时，它会停止，没有任何输出。请记住，倾向于报告致命错误或普通的警告消息。在某些情况下，甚至什么都没有。这一切都取决于你的\
    \ PHP 服务器的设置。\n\n### 练习 15：\n\n1. 哪个函数获取文件中包含的所有文本并将其复制到带有 `include()` 函数的文件中？\n\
    2. `include()` 函数的目的是什么？\n\n## 第十六章：PHP 编码标准与规范\n\n对于每个组织，都有特定的编码标准，以符合他们认为的最佳实践。编码标准和规范是必要的，因为许多开发者有时可能在不同的模块上工作。如果他们开始制定自己的标准，源代码将变得非常难以管理，以后对源代码的管理将变得困难，甚至完全无法实现。以下是使用编码标准和规范的许多不同理由：\n\
    \n- 为了让程序员及其同行能够理解生成的代码。编码标准起着蓝图的作用，向团队传达代码细节。\n- 通过一致的编码实现的清晰性和简单性可以节省时间。\n-\
    \ 为了更好地理解代码，特别是在修订后。\n- 全局常量应使用大写字母并用划线分隔。\n\n在 PHP 中，有特定的标准需要遵守，包括但不限于以下：\n\n\
    **行长度与缩进**：使用 4 个空格作为缩进，不要使用 Tab 键。建议行长度保持在 75 到 85 个字符之间。\n\n**控制结构**：控制结构由 `while`、`if`、`switch`、`for`\
    \ 等组成。编写代码时，控制关键字与左括号之间应留空格。这样做是为了区分控制关键字和函数调用。示例如下：\n\n```php\nif ((condition1)\
    \ || (condition2)) {\n    action1;\n} elseif ((condition3) && (condition4)) {\n\
    \    action2;\n} else {\n    default action;\n}\n```\n\n可以使用以下方式编写 switch 语句：\n\
    \n```php\nswitch (condition) {\n  case 1:\n    action1;\n    break;\n  case 2:\n\
    \    action2;\n    break;\n  default:\n    defaultaction;\n    break;\n}\n```\n\
    \n**函数调用**：函数名、第一个参数和左括号之间不留任何空格。同样，在每个参数和随后的逗号之间应该有空格，而在最后一个参数、分号和右括号之间不留空格。考虑下面的示例：\n\
    \n```php\n$var = foo($open, $close, $value);\n```\n\n**函数定义**：函数声明通常根据 BSD/Allman\
    \ 风格定制。\n\n```php\nfunction fooFunction($arg1, $arg2 = '') {\n    if (condition)\
    \ {\n        statement;\n    }\n    return $val;\n}\n```\n\n**注释**：标准的 C++ 注释\
    \ (`//`) 和 C 风格注释 (`/* */`) 没有问题。然而，使用 shell 风格或 Perl 风格的注释 (`#`) 是禁止的。\n\n**PHP\
    \ 代码标签**：确保使用 `<?php ?>` 来界定 PHP 代码，而不是简写版本 `<? ?>`。这是因为前者符合 PHP 标准，是在不同设置和操作系统中引入\
    \ PHP 代码的最具移植性的方法。\n\n"
- fmt: "\n## Coding Standards\n\n**Making functions reentrant**: Functions ought not\
    \ to keep static variables which inhibit the function from being reentrant.\n\
    **Aligning declaration blocks**: Blocks of declarations ought to be in a state\
    \ for alignment.\n**One statement in a line**: There ought to be no more than\
    \ one statement in a line, except the line statements share very close relations.\n\
    **Short functions or methods**: Methods ought to be limited to a single page of\
    \ code.\n\nThere are lots of other conventions and standards that apply to write\
    \ programs in PHP. But generally, the intention of code has to maintain a certain\
    \ level of consistency for the length of the code; and this is only possible when\
    \ coding standards and conventions are followed duly. Also, should you prefer\
    \ something different, you can quickly devise coding standards of your own.\n\n\
    ### Exercise 16\n\n1. What is the function of \"g\" in a code?\n2. What is the\
    \ coding standard and convention for writing function calls?\n3. What is the ideology\
    \ behind the concept of coding standard for control structures?\n4. What is the\
    \ reason behind the development of coding standards and conventions?\n5. What\
    \ is the recommended character length per line for good readability?\n\n## Chapter\
    \ Seventeen: Cookies in PHP\n\nCookies refer to text files that are stored on\
    \ the computer of a client and are kept to track use. PHP readily supports HTTP\
    \ cookies. In identifying returning users, there are three methods involved. They\
    \ include the following:\n\n* The server script forwards a series of cookies to\
    \ the browser. Take for instance, identification number, age, name, among others.\n\
    * The browser proceeds to store the data on the local machine for use in the future.\n\
    * The next time the browser turns in a request to the webserver, the latter proceeds\
    \ to send the information stored in the cookies to the server which utilized the\
    \ information in identifying the user.\n\nIn this section, you learn the basics\
    \ of setting cookies, gaining access to them, and the how's of deleting them.\n\
    \n### The Basics of a Cookie\n\nCookies are typically built in an HTTP header,\
    \ even though it is possible to set up a cookie on a browser directly in `JavaScript`.\
    \ A PHP script that develops a cookie forward headers which look something of\
    \ the following:\n\n```http\nHTTP/1.1 200 OK\nDate: Fri, 04 Feb 2000 21:03:38\
    \ GMT\nServer: Apache/1.3.9 (UNIX) PHP/4.0b3\nSet-Cookie: name=xyz; expires=Friday,\
    \ 04-Feb-07 22:03:38 GMT; path=/; domain=tutorialspoint.com\nConnection: close\n\
    Content-Type: text/html\n```\n\nAs is apparent from the sample, the header `Set-Cookie`\
    \ comprises of a domain, a path, a GMT date, and a name-value pair. The value\
    \ and name are typically encoded in URL. The `expires` field represents the information\
    \ passed to the browser to forget all cookies given to them. Should the browser\
    \ have a configuration in which it stores cookies, the information is kept until\
    \ the date of expiration is. When a user directs the browser to any page which\
    \ is similar to the domain and path of the cookie, the cookie is resent into the\
    \ server.\n\nThe header of the browsers tends to look as follows:\n\n```http\n\
    GET / HTTP/1.0\nConnection: Keep-Alive\nUser-Agent: Mozilla/4.6 (X11; I; Linux\
    \ 2.2.6-15apmac ppc)\nHost: zink.demon.co.uk:1126\nAccept: image/gif, */*\nAccept-Encoding:\
    \ gzi p\nAccept-Language: en\nAccept-Charset: iso-8859-1,*,utf-8\nCookie: name=xyz\n\
    ```\n\nAccess to the cookie can then be made possible to a PHP script through\
    \ the environmental variable `$_COOKIE`, and `$_HTTP_COOKIE_VARS` that contains\
    \ all the values and names of cookies. Above, it is possible to reach cookies\
    \ with the use of `$_HTTP_COOKIE_VARS[\"name\"]`.\n\n### Setting up Cookies in\
    \ PHP\n\nThe function `setcookie()` is provided in PHP for setting up a cookie.\
    \ The function needs up to six arguments and has to be called precisely before\
    \ the `<html>` tag to work. For every cookie, the function has to be called individually.\n\
    \n```php\nsetcookie(name, value, expire, path, domain, security);\n```\n\nBelow\
    \ is a detailed outline of the arguments used in cookies:\n\n* **Name**: This\
    \ is used in setting up the name of the cookie, and it can be found in the environment\
    \ variable known as `HTTP_COOKIE_VARS`. The `name` variable is utilized when trying\
    \ to gain access to cookies.\n* **Value**: The `value` variable is used in setting\
    \ up the value of a named variable and represents the content that is being stored.\n\
    * **Expiry**: The `expiry` variable is used in specifying a future period in seconds\
    \ as 00:00:00 GMT+1 on 1st Jan 1963. After this period, the cookie attains a state\
    \ of inaccessibility. If `expiry` parameter isn't already set by the time, then\
    \ the cookie expires automatically anytime the web browser is terminated.\n* **Path**:\
    \ The `path` variable is used in specifying the directories in which a cookie\
    \ has validity. A solo forward-slash (`/`) character enables the cookie to maintain\
    \ validity across every directory.\n* **Domain**: The `domain` variable is used\
    \ in specifying the domain name of large domains and has to have a minimum of\
    \ two periods to be considered valid. Every cookie only exhibits validity towards\
    \ the domain and host in which they were created.\n* **Security**: It's possible\
    \ to set the `security` variable to `1` and specify that a cookie ought to be\
    \ forwarded only through secure transmission by `HTTPS`. Otherwise, it is set\
    \ to `0`, which implies that the cookie could be transferred through regular `HTTP`.\n\
    \nGoing with the sample shown below will lead to the formation of two cookies;\
    \ `name` and `department`. Both cookies have a validity period of an hour (3600\
    \ seconds).\n\n```php\nsetcookie(\"name\", \"Jane Doe\", time() + 3600, \"/\"\
    );\nsetcookie(\"department\", \"English\", time() + 3600, \"/\");\n```\n\n###\
    \ Gaining access to Cookies\n\nIn PHP, there are many different ways in which\
    \ cookies can be accessed. The simplest method is usually done through the use\
    \ of `$_HTTP_COOKIE_VARS` or `$_COOKIE`. Proceeding with the sample shown above:\n\
    \n```php\necho $_HTTP_COOKIE_VARS[\"name\"];\necho $_COOKIE[\"department\"];\n\
    ```\n\nTo check the status of the cookie, whether or not it is set, the `isset()`\
    \ function is applied:\n\n```php\nif(isset($_COOKIE[\"name\"])) {\n    echo \"\
    Welcome, \" . $_COOKIE[\"name\"];\n} else {\n    echo \"Sorry... Name not recognized\"\
    ;\n}\n```\n\n### Deleting Cookies in PHP\n\nThe generally accepted method of deleting\
    \ cookies in PHP revolves around calling the `setcookie()` function using the\
    \ `name` argument alone. And since it doesn't always pan out well, it shouldn't\
    \ be entirely relied on. The best alternative is to set the cookie using a date\
    \ that is already expired, as in the sample shown below:\n\n```php\nsetcookie(\"\
    name\", \"\", time()-60, \"/\");\nsetcookie(\"department\", \"\", time()-60, \"\
    /\");\n```\n\n### Exercise 17\n\n1. How are cookies deleted in PHP?\n2. What are\
    \ the variables `$_HTTP_COOKIE_VARS` and `$_COOKIE` used for?\n3. What variable\
    \ is used in specifying the directories in which a cookie has validity?\n4. Where\
    \ is the information passed to the browser to forget all cookies found?\n5. What\
    \ are cookies for?\n\n### Answers Exercise 1\n\n1. PHP is particularly well suited\
    \ for application in Hypertext Markup Language (HTML) and web development.\n2.\
    \ The PHP interpreter is usually located on a CGI (Common Gateway Interface) or\
    \ web server as an implemented module.\n3. PHP/Fi, meaning Personal Home Page/Forms\
    \ Interpreter.\n4. Andi Gutmans and ZeeySurask.\n5. PHP 4 was published in May\
    \ of 2000.\n"
