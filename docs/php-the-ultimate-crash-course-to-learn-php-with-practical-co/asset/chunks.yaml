  trans: "\n\n## 5. PHP 中使用的变量没有内在类型，这意味着变量对于它将用于存储什么没有先验或未来的知识，无论是字符集还是一个特定的数字。\n\
    \n## 6. 任何在赋值任何值之前引入的变量都会采用默认值。\n\n## 7. 在 PHP 中，从一种类型状态转换为另一种类型状态的转换会在需要时自动执行。\n\
    \n## 8. PHP 中的变量与 Perl 中的变量相似。\n\n## 变量与数据类型\n在 PHP 中，多达八种不同的数据类型可以用于变量的构建。它们包括：\n\
    \n- **整数 (Integers)**：整数指不带小数点的全整数。例如：`12`、`1234` 等。\n- **双精度浮点数 (Doubles)**：双精度数指浮点数，例如\
    \ `12.3`、`1.234` 等。\n- **布尔值 (Booleans)**：布尔值指只有两种确定结果的值：均为 `True` 或 `False`。\n\
    - **NULL**：`NULL` 可以被视为一种特殊的数据类型，它只有一个可能的值——`NULL`。\n- **字符串 (Strings)**：字符串可以被视为一组字符。例如，`\"\
    String operations are supported in PHP\"` 是一个字符串。\n- **数组 (Arrays)**：数组指各种经过索引和命名的其他值的集合。\n\
    - **对象 (Objects)**：对象指程序员定义的类的实例，它们能够封装被认为是类特有的其他类型的函数和值。\n- **资源 (Resources)**：资源指特殊的变量类型，包含对\
    \ PHP 外部获取资源的引用，例如数据库连接。\n\n前五种变量类型被归类简单类型，而随后的两种类型（即 `objects` 和 `arrays`）被称为复合变量类型。复合变量能够封装各种其他具有任意值的任意数据类型，而后者无法执行此类功能。为了更好地理解这些分类，我们将分别考虑每个类并简要讨论它的成员。\n\
    \n### 简单类型\n#### 整数 (Integers)\n整数是 PHP 中最基本的变量形式，它们与基础数学整数相似，因为它们可以是正的或负的。可以将整数赋值给变量；然而，也可以以类似的方式用于表达式：\n\
    \n```\n$int_var = 678910; $another_int = -678910 + 678910;\n```\n\n整数可以以任何形式存在，包括但不限于\
    \ 8 进制（八进制）、10 进制（十进制）和 16 进制（十六进制）。默认情况下，使用 10 进制（十进制），而 8 进制或八进制整数使用前导零（`0`）表示，16\
    \ 进制或十六进制以 `0x` 开始。在大多数常用平台上，知的最小整数是 `(-2,147,483,648)` 或 `(-2**31)`，而最大的是 `(2,147,483,647)`\
    \ 或 `(2**31 - 1)`。\n\n#### 双精度浮点数 (Doubles)\n在默认状态下，双精度数以所需的位数打印。请查看下面的示例以更好地理解：\n\
    \n```php\n<?php \n$many_a = 1.3422220; \n$many_b = 2.1111345; \n$few = $many_a\
    \ + $many_b; \nprint(\"$many_a\"); \nprint(\"$many_b\"); \nprint(\"$few\"); \n\
    ?>\n```\n\n#### 布尔值 (Boolean)\n在默认状态下，双精度数以所需的位数打印。请查看下面的示例以更好地理解：\n\n```php\n\
    <?php \n$many_a = 1.3422220; \n$many_b = 2.1111345; \n$few = $many_a + $many_b;\
    \ \nprint(\"$many_a\"); \nprint(\"$many_b\"); \nprint(\"$few\"); \n?>\n```\n\n\
    #### NULL\n在默认状态下，双精度数以所需的位数打印。请查看下面的示例以更好地理解：\n\n```php\n<?php \n$many_a = 1.3422220;\
    \ \n$many_b = 2.1111345; \n$few = $many_a + $many_b; \nprint(\"$many_a\"); \n\
    print(\"$many_b\"); \nprint(\"$few\"); \n?>\n```\n\n#### 字符串 (Strings)\n在默认状态下，双精度数以所需的位数打印。请查看下面的示例以更好地理解：\n\
    \n```php\n<?php \n$many_a = 1.3422220; \n$many_b = 2.1111345; \n$few = $many_a\
    \ + $many_b; \nprint(\"$many_a\"); \nprint(\"$many_b\"); \nprint(\"$few\"); \n\
    ?>\n```\n\n#### 数组与对象 (Arrays and Objects)\n在默认状态下，双精度数以所需的位数打印。请查看下面的示例以更好地理解：\n\
    \n```php\n<?php \n$many_a = 1.3422220; \n$many_b = 2.1111345; \n$few = $many_a\
    \ + $many_b; \nprint(\"$many_a\"); \nprint(\"$many_b\"); \nprint(\"$few\"); \n\
    ?>\n```\n\n"
- fmt: "\n# The Here Document\n\nFor a single string variable, it is possible to assign\
    \ multiple lines to it with a here document. Consider the sample shown below:\n\
    \n```php\n<?php \n$channel =<<\\_XML\\_ <channel> <title>How Are You</title> <link>http://menu.sample.org/\
    \ </link> <description>It’s been a rather long while.</description> </channel>\
    \ \\_XML\\_ ; \necho <<<END This line makes use of the \"here document\" syntax\
    \ to return multiple lines with variable interpolation. Keep in mind that the\
    \ here document terminator has to appear on a line having just a semicolon with\
    \ no extra whitespace! END; \nprint $channel; \n?>\n```\n\nRunning this script\
    \ will output the following results: This makes use of the \"here document\" syntax\
    \ to output multiple lines using a variable interpolation. Keep in mind that the\
    \ here document terminator has to appear on a line having just a semicolon with\
    \ no extra whitespace!\n\n`<channel> <title>How Are You<title > <link>http://menu.sample.org/<link>\
    \ <description> It’s been a rather long while.</description>`\n\n# The Variable\
    \ Scope\n\nA variable scope is a term used to describe the range of availability\
    \ that a variable has in the program in which it is assigned. Variables in PHP\
    \ tend to adopt one of four types of scopes. These types include:\n\n1. Static\
    \ variables\n2. Function Parameters\n3. Local variables\n4. Global variables\n\
    \n# Naming Variables in PHP\n\nThe rules and conventions for making variables\
    \ in PHP are as follows: A variable name can be made up of underscores, letters,\
    \ and numbers, however, characters such as `+`, `-`, `%`, `(`, `)`, `&`, among\
    \ others, cannot be used. A variable name has to start with an underscore character\
    \ or a letter. Keep in mind that no limit applies to variables in terms of size.\n\
    \n# Exercise 4:\n\n1. What is a variable scope?\n2. List five characters prohibited\
    \ from use in variable names.\n3. What does the statement \"there add no artificial\
    \ limits\" mean for the length of a string?\n4. What is the difference between\
    \ singly and doubly quoted strings?\n5. What is the evaluation of `NULL` in a\
    \ Boolean context?\n6. What two constants are used as Booleans in PHP?\n7. How\
    \ are octal integers indicated?\n8. What are variables?\n9. How is the here document\
    \ used?\n10. Explain the term \"integers.\"\n\n# Chapter Five: Constants in PHP\n\
    \nA constant is a term used to identify a simple value. The value of a constant\
    \ can't be altered while a script is being executed. Constants are sensitive to\
    \ case by default, although constant identifiers always begin with uppercases,\
    \ usually by convention. The name of a constant usually begins with an underscore\
    \ or a letter quickly succeeded by any amount of underscores, numbers, or letters.\
    \ When a constant is defined, it cannot be undefined or changed throughout the\
    \ execution.\n\nThe function `define()` is used in defining a constant, and in\
    \ retrieving the value assigned to a constant, you have to specify its name. Unlike\
    \ with other variables, you need not a constant beginning with a dollar sign (`$`).\
    \ It is also possible to make use of the `constant()` function when reading the\
    \ value of a constant, especially when you need to collect the name of the constant\
    \ dynamically.\n\nThe `constant()` function: As the name connotes, the function\
    \ outputs the value assigned to the constant. This function is especially helpful\
    \ when you need to output the value of a constant, but have no idea what its name\
    \ is. That is, it is outputted using a function or is stored in a variable.\n\n\
    Consider the example shown below:\n\n```php\n<?php \ndefine(\"MINSIZE\", 50);\
    \ \necho MINSIZE; \necho constant(\"MINSIZE\"); // same thing as the previous\
    \ line \n?>\n```\n\nOnly scalar data, such as strings, floats, integers, and Boolean,\
    \ can only be stored in constants.\n\n## The distinction between variables and\
    \ constants\n\n1. There is no point of using a dollar sign (`$`) before introducing\
    \ any constant, whereas, in the case of variables, it is essential to use the\
    \ dollar sign.\n2. Constants can't be defined using mere assignment as they can\
    \ only be defined with the function `define()`.\n3. Constants could be accessed\
    \ and defined from any place with no regards given to the rules regarding variable\
    \ scoping.\n4. When the constants have been set and may be undefined or redefined.\n\
    \n## Valid and Invalid Constant names:\n\n```php\n// Valid constant names\ndefine(\"\
    ONE\", \"first thing\");\ndefine(\"TWO2\", \"second thing\");\ndefine(\"THREE\\\
    _3\", \"third thing\");\n\n// Invalid constant names\ndefine(\"2TWO\", \"second\
    \ thing\");\ndefine(\"\\_\\__THREE\\_\\_\", \"third value\");\n```\n\n# Magic\
    \ Constants in PHP\n\nPHP offers a vast array of predefined constants to whatever\
    \ script that is executed on it. The magical constants are five in number and\
    \ would tend to alternate depending on the part that it is applied to. Take, for\
    \ instance, the value of `__LINE__` is depended on the line where it is applied\
    \ in on the script. Special constants of these sorts are usually insensitive to\
    \ case, and take after this fashion:\n\nSome magical constants on PHP are shown\
    \ below for better understanding:\n\n1. `__LINE__`: This constant is used to represent\
    \ the present line number of a file.\n2. `__FILE__`: This constant represents\
    \ the complete filename and path of a file. When applied within an included file,\
    \ it returns the name of the included file. Since as early as version 4.0.2 of\
    \ PHP, the `__FILE__` constant has always contained the absolute path, although\
    \ in earlier versions it used to contain a relative path in some cases.\n3. `__FUNCTION__`:\
    \ This constant is used to represent the name of the current function.\n4. `__CLASS__`:\
    \ This constant represents the name of the current class.\n5. `__METHOD__`: This\
    \ constant represents the name of the current method.\n\n# Exercise 5:\n\n1. What\
    \ kind of data can be stored in constants?\n2. How does `__FILE__` work in PHP?\n\
    3. What is the naming condition for constants?\n4. What is `constant()` used for?\n\
    5. What property do constants exhibit during the execution of scripts?\n6. What\
    \ are the five magic constants?\n7. In terms of assigning values, how do constants\
    \ differ from variables?\n8. What are constants?\n9. How is `constant()` used?\n\
    10. What factor is the value of `__LINE__` dependent on?\n\n# Chapter Six: Operators\
    \ in PHP\n\nThe definition of an operator can be better explained with the aid\
    \ of an example, so, let's consider the expression `3 + 7`, which is equal to\
    \ `10`. In this example, the numbers `3` and `7` are known as the operands, and\
    \ the sign of addition (`+`) is regarded as the operator. In this sense, an operator\
    \ is a construct used in performing operations between several variables.\n\n\
    In PHP, there are five categories of supported operator types. They are:\n\n1.\
    \ Logical or Relational Operators\n2. Arithmetic Operators\n3. Assignment Operators\n\
    4. Comparison Operators\n5. Conditional or Ternary Operators\n\nLet's take an\
    \ in-depth look at these operator types individually:\n\n## Arithmetic Operators\n\
    \nBelow is an outline of all the arithmetic operators supported in PHP: For better\
    \ understanding, examples will be included to indicate their functions. In the\
    \ samples, variable `X` holds a value of `5` and variable `Y` holds a value of\
    \ `15`.\n\n1. `+`: This operator is used in summing two or more operands. E.g.\
    \ `X + Y` gives `20`.\n2. `-`: This operator is used in finding the difference\
    \ between two operands. E.g. `Y - X` gives `10`.\n3. `*`: This operator is used\
    \ in multiplying operands together. E.g. `X * Y` gives `75`.\n"
