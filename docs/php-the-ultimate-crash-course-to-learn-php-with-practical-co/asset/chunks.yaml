    \ \n\n2.  The foreach loop. \n\n3.  The for loop is used in repeating a particular\
    \ set of code for the duration a specific condition is reached. \n\n4.  Loops\
    \ are used to introduce automation to repetitive actions in a program as a way\
    \ of saving energy and time. \n\nExercise 9: \n\n1.  The values evaluated by a\
    \ multi-dimensional array can be accessed via multiple indexes. \n\n2.  Numerical,\
    \ multidimensional, and associative arrays. \n\n3.  The main difference is in\
    \ the way their indexes are represented. \n\n4.  The multi-dimensional array.\
    \ \n\n5.  The values of a numeric array are stored and accessed in a linear manner.\
    \ \n\n6.  The associative array. \n\n7.  By default, every numerical array index\
    \ begins from the number zero. \n\n8.  Using a double quote during printing would\
    \ result in no value being returned. \n\n9.  The values evaluated by a multi-dimensional\
    \ array can be accessed via multiple indexes. \n\n10.  A map is a data type that\
    \ links values to keys and can be optimized for many different reasons. \n\nExercise\
