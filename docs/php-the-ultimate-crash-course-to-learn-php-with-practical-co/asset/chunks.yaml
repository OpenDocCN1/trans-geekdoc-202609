  trans: "\n\n# 第章：PHP 中的数组\n\n在 PHP 中，数组是指有序映射（ordered maps）系统。映射可以被视为一种将值（values）与键（keys）链接的数据类型，并根据许多不同的原因进行优化。映射也可以视为数组、字典、队列、列表（向量）、集合、哈希表（映射的实现）、栈等。同样，数组中的值可以是其他数组；它也可以是多维数组和树。\n\
    \n## 如何创建数组\n\n可以使用 `array()` 语言结构来创建数组。它使用任意数量的由逗号分隔的键值对（arguments）作为参数。\n\n\
    ```php\narray( key => value, key2 => value2, key3 => value3, ... )\n```\n\n数组中最后一个元素后的逗号是一个可选的结构，可以包含也可以不包含。它特别常用于单行数组。也就是说，`array\
    \ (x, y)` 优于 `array (x, y, )`。另一方面，对于多行数组，通常会加上随后的逗号，因为它允许方便地在末尾添加新元素。\n\n在 5.4\
    \ 版本中，可以使用短数组语法 `[]` 代替 `array()` 函数。考虑下面的示例：\n\n### 示例 #1：简单数组\n\n```php\n<?php\n\
    $array = array( \"foo\" => \"bar\", \"bar\" => \"foo\", ) ; 正 从 PHP 5.4 开始\n$array\
    \ = [ \"foo\" => \"bar\", \"bar\" => \"foo\", ];\n?>\n```\n\n在这种情况下，键可以是整数字符串，而值可以是任何形式。此外，通常会发生以下重要的类型转换（vital\
    \ casts）：\n\n1. 包含有效十进制整数的字符串（数字前有 `+` 号的情况除外）会被转换为整数类型。例如，键 `\"5\"` 可以被起始为 `5`。另一方面，无法转换\
    \ `\"08\"`，因为在有效的十进制状态下它并不存在。\n2. 浮点数也可以转换为整数，这意味着即使是小数也可以被截断。例如，键 `5.7` 可以存储在\
    \ `5` 下。\n3. 布尔值也可以转换为整数。也就是说，键 `true` 可以存储在 `1` 下，即使它在 `0` 下为假。\n4. `Null` 可以转换为空字符串。也就是说，主\
    \ `null` 可以存储为 `\"\"`。\n5. 对象和数组不能作为键，因为这样做只会触发关于某些非法偏移量类型（illegal offset type）的警告。\n\
    6. 单个数组声明中的许多不同元素倾向于使用相似的键，通常最后一个会留存，因为其他键在过程中会被覆盖。\n\n## 数组的类型\n\n在 PHP 中有三种不同类型的数组，对于每个数组，通过称为数组索引（array\
    \ index）的 ID 来访问值。数组的类型讨论如下：\n\n### 数值数组\n数值数组是指具有数字索引的数组。值可以以线性方式存储和访问。数值数组能够存储字符串、数字和对象，但它们的索引始终用数字表示。默认情况下，每个数值数组索引都从零开始。\n\
    \n**示例：**\n这里考虑的示例展示了如何创建一个数值数组并访问它。在创建过程中使用了 `array()` 函数。\n\n```html\n<html>\n\
    <body>\n<?php\n/* 创建数组的第一种方法。 */\n$digits = array( 5, 6, 7, 8, 9);\nforeach( $digits\
    \ as $value ) {\n    echo \"Answer is $value <br />\";\n}\n/* 创建数组的第二方法。 */\n\
    $digits[5] = \"five\" ;\n$digits[6] = \"six\";\n$digits[7] = \"seven\";\n$digits[8]\
    \ = \"eight\";\n$digits[9] = \"nine\";\nforeach( $digits as $value ) {\n    echo\
    \ \"Answer is $value <br />\";\n}\n?>\n</body>\n</html>\n```\n\n执行执行时，数值数组的结果如下：\n\
    Answer is 5\nAnswer is 6\nAnswer is 7\nAnswer is 8\nAnswer is 9\nAnswer is five\n\
    Answer is six\nAnswer is seven\nAnswer is eight\nAnswer is nine\n\n### 关联数组\n\
    关联数组是以字符串作为索引的数组。它们能够结合关键值（critical values）来存储元素的值，而不是以直接的线性索引方式。关联数组与数值数组是非常同义的，因为它们的功能相似，尽管在索引表示方式上存在差异。对于关联数组，它们的索引通常表示为字符串，以便在键和值之间建立强有的联系。例如，在数组中存储工人的工资时，带有数值索引的数组在这种情况下似乎不是最佳选择。相反，使用工人的姓名作为关联数组中的键更为合理，结果的值即为工人的相应工资。记住在打印时不要将关联数组放在双引号内；否则，将不会返回任何值。\n\
    \n**示例：**\n```html\n<html>\n<body>\n<?php\n/* 创建关联数组的第一种方法。 */\n$wages = array(\
    \ \"John\" => 5000, \"Mary\" => 6000, \"Joe\" => 7000);\nforeach( $wages as $name\
    \ => $wage ) {\n    echo \"$name earns $wage <br />\";\n}\n/* 创建关联数组的第二种方法。 */\n\
    $wages[\"John\"] = 5500;\n$wages[\"Mary\"] = 6500;\n$wages[\"Joe\"] = 7500;\n\
    foreach( $wages as $name => $wage ) {\n    echo \"$name earns $wage <br />\";\n\
    }\n?>\n</body>\n</html>\n```\n*(注：原文示例代码中的逻辑与描述略有出入，此处已根据原文保留代码并翻译)*\n\n### 多维数组\n\
    多维数组是包含一个或多个数组的数组，可以通过多个索引进行访问。在多维数组中，主数组的每个元素也可以是数组。\n\n示例：\n在下面的示例中，创建了一个二维数组来存储三个学生三门科目的成绩。\n\
    \n```html\n<html>\n<body>\n<?php\n$scores = array(\n    \"kaleb\" => array( \"\
    english\" => 40, \"biology\" => 45, \"agric\" => 31 ),\n    \"karen\" => array(\
    \ \"english\" => 35, \"biology\" => 42, \"agric\" => 33 ),\n    \"tara\" => array(\
    \ \"english\" => 41, \"biology\" => 29, \"agric\" => 37 )\n);\n/* 访问多维数组 */\n\
    echo \"Scores for kaleb in english : \"  echo $scores['kaleb']['english'] . \"\
    <br />\";\necho \"Scores for karen in biology : \"; echo $scores['karen']['biology']\
    \ . \"<br />\";\necho \"Scores for tara in agric : \" ; echo $scores['tara']['agric']\
    \ . \"<br />\";\n?>\n</body>\n</html>\n```\n当此脚本执行时，结果如下：\nScores for kaleb in\
    \ english : 40\nScores for karen in biology : 42\nScores for tara in agric : 37\n\
    \n## 第 9 章练习\n\n1. 如何访问多维数组的值？\n2. PHP 中有三种数组类型？\n3. 数值数组和关联数组之间的关键区别是什么？\n4.\
    \ 哪种形式的数组可以使用许多不同的索引访问？\n5. 数值数组的值是如何存储和访问的？\n6. 字符串与哪种形式的数组相关？\n7. 数值索引默认从哪个数字开始？\n\
    8. 为什么在打印时不要将关联数组放在双引号内？\n9. 如何访问多维数组的值？\n10. 什么是映射（map）？\n\n"
