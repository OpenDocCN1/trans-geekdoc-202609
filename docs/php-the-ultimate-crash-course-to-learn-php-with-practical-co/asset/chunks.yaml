- fmt: "\n1. Why are third party applications used in setting up a development environment\
    \ on Windows systems?\n2. What prerequisite is demanded before setting up a development\
    \ environment on Linux systems?\n3. What does `phpmyadmin` do?\n4. What third-party\
    \ application can be used on both Windows and Mac systems?\n5. What does `PHP`'s\
    \ embedment in HTML mean for the language?\n6. What significant protocols are\
    \ supported by `PHP`?\n7. What is the function of a parser?\n8. `PHP` is integrated\
    \ into what kinds of a database?\n9. What are the three vital components required\
    \ to be installed in a computer system to create and run scripts in `PHP`?\n10.\
    \ In form handling, how does PHP apply?\n\n# Chapter Three Basic Syntax\n\nIn\
    \ this section, we will take a look at the primary forms of PHP syntax, as they\
    \ are part of the knowledge necessary for a good foundation in PHP programming.\n\
    \n## Escaping to PHP\nSometimes, a PHP parsing engine would be required to distinguish\
    \ between other elements on a page and PHP codes. A special mechanism known as\
    \ \"escaping to PHP\" is used to perform such a function. There are four possible\
    \ means of carrying out this function, in any case. They are:\n\n### Using Canonical\
    \ PHP Tags\nThis method has one of the most generally effective PHP tag styles,\
    \ written as: `<?php…?>`. When making use of this style, rest assured that, no\
    \ matter the conditions, there will always be a correct interpretation of your\
    \ tags.\n\n### Using SGML-style (short-open) Tags\nShort tags, otherwise known\
    \ as short-open tags, are usually written as: `<?...?>`. As the name connotes,\
    \ short tags offer the shortest alternative. For PHP to recognize your short tags,\
    \ you must perform two tasks:\n1. When creating a PHP script, pick the configuration\
    \ option to enable short tags.\n2. Next, go to the settings part of your `php.ini`\
    \ file and click to turn on `short_open_tag`.\nYou must disable this option when\
    \ processing XML and PHP together because XML tags use a similar syntax to it.\n\
    \n### Using ASP-style Tags\nASP-style tags share a similar structure and functionality\
    \ to the tags used to delineate code blocks on Active Server Pages. ASP-style\
    \ tags typically appear in this format: `<%...%>`. When using ASP-style tags,\
    \ you have to set up the configuration option within a `php.ini` file.\n\n###\
    \ HTML Script Tags\nHTML script tags are usually written as: `<script language\
    \ = “PHP”...</script>`.\n\n## How to Comment in PHP Codes\nComments refer to the\
    \ parts of a program written for human users and are cut out before the results\
    \ of a program are outputted. In PHP, there are two forms of comments. They are:\n\
    \n### Single-line Comments\nThese comments usually serve as brief notes or explanations\
    \ that are related to the written code. Consider the samples below on how single-line\
    \ comments are used:\n```php\n<?php \n# This is a single comment, and \n# This\
    \ is another line of the single comment\n// This is another comment too. \nEach\
    \ style comments only print \"A sample of a single line comment\"; \n?>\n```\n\
    \n### Multi-lines Printing\nShown below is a sample on how to output multiple\
    \ lines in one print statement:\n```php\n<?php \n# First Example\nprint <<<END\
    \ This uses the \"here document\" syntax to output multiple lines with $variable\
    \ interpolation. \nNote that the here document terminator must appear on a line\
    \ with just a semicolon no extra whitespace! \nEND ;\n# Second Example\nprint\
    \ \"This spans multiple lines. The newlines will be output as well\"; \n?>\n```\n\
    \n### Multi-lines Comments\nThis type of comment usually serves as a means of\
    \ introducing concise explanations or pseudocode algorithms when coding. The multi-line\
    \ style used in PHP is similar to that of the C programming language. Shown below\
    \ is a sample of a multi-line comment for better understanding:\n```php\n<?php\
    \ \n/* \nThis is a comment with multi-line \nAuthor: Jane Doe\nPurpose: Multiline\
    \ Comments Demo\nSubject: PHP \n*/ \nprint \"A sample with multi-line comments\"\
    ; \n?>\n```\n\n## Whitespace Insensitivity\nWhitespaces refer to the parts of\
    \ codes that are invisible to the eyes when typed. They include tabs, spaces,\
    \ and carriage returns (that is, end-of-line characters). The Insensitivity of\
    \ PHP to whitespaces implies that the number of whitespace characters in a row\
    \ is inconsequential because a single whitespace character is seen the same way\
    \ as many whitespace characters. Take for instance, in each of the PHP statements\
    \ shown below, the statements that assign the `5 + 1` operating to the outputted\
    \ variable `$six` are equal:\n```php\n$six = 5 + 1; // single spaces\n$six <tab>=<tab>2<tab>+<tab>2\
    \ ; // spaces and tabs\n$six = 5+ 1; // multiple lines\n```\n\n## Case Sensitivity\n\
    PHP is a very case sensitive programming language; meaning, it interprets variables\
    \ in different cases distinctly. For example, the entries `PHP`, `php`, and `pHp`\
    \ will be interpreted differently instead of as the same thing. Consider the code\
    \ example below:\n```html\n<html>\n<body>\n<?php\n$profit = 34;\nprint(\"Variable\
    \ profit is $profit<br>\");\nprint(\"Variable PrOfiT is $PrOfiT<br>\");\n?>\n\
    </body>\n</html>\n```\nWhen executed, the results of this code will be: `Variable\
    \ profit is 34`, `Variable PrOfiT is…`\n\n## Statements and Expressions\n### Ended\
    \ using Semicolons\nIn PHP, a statement refers to by form of expression that is\
    \ terminated using a semicolon (`;`). A series of valid statements in PHP represents\
    \ a valid PHP program, especially if it is encased in PHP tags. Take an example\
    \ of a common PHP statement shown below that is used in assigning a set of characters\
    \ to the variable `$greeting`:\n```php\n$greeting = \"Welcome to PHP!\";\n```\n\
    \n### Expressions are a combination of tokens\nTokens are the smallest, indivisible\
    \ building blocks that make up a PHP program. They could get constants (e.g. `FALSE`),\
    \ variables (e.g. `$greeting`), numbers (e.g. `(π)`), and strings.\n\n### Braces\
    \ Form\nEven though it is impossible to combine statements similarly, it is possible\
    \ to place a set of statements in all the places by encasing them within curly\
    \ braces. Consider the sample containing two statements of which are equal:\n\
    ```php\nif (7 == 4) { print(\"Great - haven't completely\"); }\nif (7 == 4) {\
    \ print(\"my mind.<br>\"); }\n```\n\n## How to Execute PHP Scripts from the Command\
    \ Prompt\nIt is possible to execute PHP scripts from the command prompt of your\
    \ computer. Let's say you have the content shown above in `test.php` file:\n```php\n\
    <?php echo \"Hello PHP!\"; ?>\n```\nProceed to execute this script shown above\
    \ using your command prompt in the following ways:\n`php test.php`\nThe result\
    \ outputted will take after fashion: `Hello PHP!`\n\n# Chapter Four Variables\
    \ in PHP\n\nThere is one primary process of storing information within the body\
    \ of a PHP program. This process is done with the help of a variable. To better\
    \ understand the concept of variables in PHP, below are some crucial points to\
    \ take into consideration:\n\n1. Every variable used in PHP is represented with\
    \ a preceding `$`.\n2. Any value outputted by a variable is an indication of the\
    \ most recent value assigned to it.\n3. To assign a variable, the equal to (=)\
    \ operator is used, with the variable placed on the left-hand area while the evaluated\
    \ expression takes the spot to the right of the operator.\n4. Although it is possible\
    \ to declare variables before assigning them, it is not compulsory to do so.\n"
