    ## 字符串函数


    81. `strstr()`：此函数用于在另一个字符串中定位字符串首次出现的位置。它是区分大小写的。


    82. `strtok()`：此函数用于将字符串拆分为更小的字符串。


    83. `strtolower()`：此函数用于将字符串转换为小写。


    84. `strtloupper()`：此函数用于将字符串转换为大写。


    85. `strtr()`：此函数用于替换子字符串或翻译字符。


    86. `substr()`：此函数用于返回字符串的一部分。


    87. `substr_compare()`：此函数用于比较两个字符串，从特定的起始点开始，直到达到指定的长度。比较过程可以选择性是否区分大小写；然而，它是完全二进制安全的（binary-safe）。


    88. `substr_count()`：此函数用于统计子字符串在字符串中出现的次数。


    89. `substr_replace()`：此函数用于使用另一个字符串替换字符串的一部分。


    90. `trim()`：此函数用于消除字符串开头和结尾的空格以及其他字符。


    91. `ucfirst()`：此函数用于将字符串中的第一个字符转换为大写。


    92. `ucfirst()`：此函数用于将字符串中每个单词的起始字符转换为大写。


    93. `vfprintf()`：此函数用于将格式化字符串写入指定的输出流。


    94. `vprintf()`：此函数用于输出格式化字符串。


    95. `vsprintf()`：此函数用于返回格式化字符串。


    96. `wordwrap()`：此函数用于将字符串包装到指定的字符长度内。


    ## 练习 10


