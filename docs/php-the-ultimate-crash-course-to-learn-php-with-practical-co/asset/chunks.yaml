  trans: "\n\n## 复习题\n\n9. 什么是三元运算符？\n\n10. 除法赋值运算符 (`/=`) 属于哪种类型的运算符？\n\n11. 写出两种加法运算符的名称。\n\
    \n## 第七章 PHP 中的决策\n\nPHP 中的每个脚本都是由一组语句创建的。这些语句可以是循环、函数调用、赋值，甚至是完全不执行任何操作的条件语句（即空语句）。此外，通过将一组语句放入大括号中的过程，可以将语句分类为名为\
    \ `statement-group`（语句组）的组。语句组本身也代表一条语句。在 PHP 中，下面所示语句用于根据一定数量的条件做出决策：\n\n1. `Else`\
    \ 语句\n2. `If` 语句\n3. `Elseif` 语句\n4. `Switch` 语句\n\n### If…else 语句\n\n该语句用于在当其中一个条件为真而另一个条件为假时，运行一系列代码。\n\
    \n**语法：** `if (condition) 如果条件为真要运行的代码; else 如果条件为假要运行的代码;`\n\n**示例：** 下面示例如果一天的时间段是早晨（Morning），则生成“Have\
    \ a great day!”；否则，生成“Good night! Sleep well.”。\n\n```html\n<html>\n<body>\n<?php\n\
    $t = time(\"H\");\nif ($t == \"Morn\") echo \"Have a great day!\";\nelse echo\
    \ \"Good night! Sleep well.\";\n?>\n</body>\n</html>\n```\n生成的输出如下：Have a great\
    \ day!\n\n### If 语句\n\n`if` 语句作为一种手段，用于控制其后继语句如何执行——在这种情况下，是包含在大括号中的代码块或单一语句。`if`\
    \ 语句评估括号内的表达式。如果表达式的结果被认为真（true），则启动执行过程。否则，整个语句将跳过。这使得你的 PHP 脚本能够根据选择的一系列因素自行做出决策。\n\
    \n**语法：**\n```php\nif ( expression ) {\n    // 如果表达式输出为真，则运行的代码\n}\n```\n\n**示例：**\
    \ 如果 `$x` 大于 `$y`，以下代码将显示 x is greater than y：\n\n```php\n<?php\n$x=5;\n$y=2;\n\
    if ($x > $y) echo \"x is bigger than y\";\n?>\n```\n\n### Elseif 语句\n\n该语句在执行系列代码时与\
    \ `if…else` 语句配合使用，当多种条件中的一个为真时。正如名称所示，`elseif` 语句是 `if` 语句和 `else` 语句的混合。与 `else`\
    \ 语句一样，`elseif` 语句扩展了 `if` 语句，在主 `if` 表达式评估为假的情况下运行另一个语句。尽管与 `else` 语句相反，`elseif`\
    \ 语句仅在赋值的条件表达式评估为真时才运行替代表达式。简单来说，当你想在多个不同条件中的一个评估为真时运行一组代码，就应该使用 `elseif` 语句。\n\
    \n**语法：**\n`if (condition) 如果条件评估为真要运行的代码;`\n`elseif (condition) 如果条件评估为真要运行的代码;`\n\
    `else 如果条件评估为假要运行的代码;`\n\n**示例：** 下面示例如果一天的时间段是早晨，则生成“Good morning. Rise and shine!”，在晚上则生成“Good\
    \ night! Sleep well.”。否则，生成“Have a great day!”。\n\n```html\n<html>\n<body>\n<?php\n\
    $t = time(\"H\");\nif ($t == \"Morn\") echo \"Good morning. Rise and shine!\"\
    ;\nelseif ($t == \"Nigt\") echo \"Good night! Sleep well.\";\nelse echo \"Have\
    \ a great day!\";\n?>\n</body>\n</html>\n```\n\n### Else 语句\n\n当 `if` 语句评估为假时使用\
    \ `else` 语句。它在条件不满足时提供一个回备块。\n\n**语法：**\n```php\nif ( expression ) {\n    // 如果表达式输出为真，则运行的代码\n\
    } else {\n    // 如果表达式为假，则运行的代码\n}\n```\n**示例：** 如果 `$x` 大于 `$y`，以下代码将显示 x is\
    \ greater than y：\n\n```php\n<?php\n$x=5;\n$y=2;\nif ($x > $y) echo \"x is bigger\
    \ than y\";\n?>\n```\n\n### Switch 语句\n\n`switch` 语句允许将变量与多个值进行比较。在检查单个变量时，它通常是多个\
    \ `if…elseif…else` 语句更简洁的替代方案。\n\n**语法：**\n```php\nswitch (expression) {\n   \
    \ case value1:\n        // 如果表达式 == value1，则运行的代码\n        break;\n    case value2:\n\
    \        // 如果表达式 == value2，则运行的代码\n        break;\n    default:\n        // 如果没有值匹配，则运行的代码\n\
    }\n```\n**示例：** 下面示例使用 `switch` 来评估时间：\n\n```php\n<?php\n$t = time(\"H\");\nswitch\
    \ ($t) {\n    case \"Morn\":\n        echo \"Good morning. Rise and shine!\";\n\
    \        break;\n    case \"Nigt\":\n        echo \"Good night! Sleep well.\"\
    ;\n        break;\n    default:\n        echo \"Have a great day!\";\n}\n?>\n\
    ```\n\n## 练习 7\n\n1. `if` 语句评估的表达式包含在什么？\n2. 哪种语句是 `else` 和 `if` 语句的结合？\n3. 当\
    \ `if` 语句评估为假时，使用哪种语句？\n4. `elseif` 语句负责运行哪个表达式？\n5. 在 `switch` 语句中，如果没有值匹配，语句如何评估？\n\
    6. 当多个不同条件中的一个为真时，使用哪种语句？\n7. 没有用途的语句被称为？\n8. 什么是 `statement-group`？\n9. 在 `if`\
    \ 语句中，什么情况下表达式会被跳过？\n10. `switch` 语句的作用是什么？\n\n## 第八章 PHP 中的循环\n\n在 PHP 中，循环是用于在满足特定条件时重复执行单个代码块的工具。循环概念的核心思想是对重复操作引入自动化，以节省精力和时间。在\
    \ PHP 编程中，支持四种类型的循环。它们是：\n\n1. `while` 循环\n2. `for` 循环\n3. `do…while` 循环\n4. `foreach`\
    \ 循环\n\n"
- fmt: "\nIn this section, we delve deep into the concept of loops, how they work,\
    \ and how to loop through a set of values in an array; especially for loops directly\
    \ targeted at arrays like the foreach loop.\n\n### The While Loop\nAs long as\
    \ the specified condition to a while loop evaluates as true, a `while` statement\
    \ continuously loops through a series of codes.. As such, when the evaluated expression\
    \ outputs as true, it kick-starts the execution of the block of code. Once the\
    \ code has entirely executed the test expression, the process begins again with\
    \ evaluation, and the loop goes on until the test expression or statement reaches\
    \ a point of being false.\n\n**Syntax:**\n```php\nwhile(expression){ // Code to\
    \ be run }\n```\n\nConsider the sample shown below of a loop that begins with\
    \ `$x = 2`. The loop will continue being executed as long as the value for `$x`\
    \ equals or is less than 4. An increment of 1 will be added to `$x` for each time\
    \ the loop is executed.\n\n```php\n<?php\n$i = 1;\nwhile($i<= 3){\n    $i++;\n\
    \    echo \"The number is \" . $i .\"<br>\";\n}\n?>\n```\n\nConsider another example.\
    \ In this case, a variable value is decreased with each iteration of a loop while\
    \ the counter is increased until it gets to 15 when the evaluation is given to\
    \ be false and the loop terminates.\n\n```html\n<html>\n<body>\n<?php\n$a = 0;\n\
    $num = 30;\nwhile( $a < 15) {\n    $num--;\n    $a++;\n}\necho (\"Loop stopped\
    \ at a = $a and num = $num\" );\n?>\n</body>\n</html>\n```\nThe outcome of executing\
    \ this script is shown in the result below: Loop stopped at a = 15 and num = 30\n\
    \n### The for Loop\nThe `for` Loop is used in repeating a particular set of code\
    \ for the duration in which a specific condition is reached. It is usually used\
    \ when there is a need to run a block of code over a certain amount of times.\
    \ In the `for` loop, the initializer is applied as a means of setting up the start\
    \ value for the counter of the number of loop iterations. For this reason, a variable\
    \ can be declared at this point, and it is only normal to term it `$i`.\n\n**Syntax:**\n\
    ```php\nfor(initialization; condition; increment){ // Code to be run }\n```\n\n\
    In `for` loops, there are a variety of parameters. They include:\n- **Initialization**:\
    \ As the name implies, it is used in initializing all counter variables and is\
    \ unconditionally evaluated before the initial running of the entire body of the\
    \ loop.\n- **Condition**: At the start of every iteration process, the condition\
    \ is processed. If it is evaluated as true, then the loop goes on, and all the\
    \ nested statements will be executed. However, should it evaluate as false, the\
    \ loop execution is stopped.\n- **Increment**: The increment is used in updating\
    \ the loop counter with a new value after each iteration. The increment is processed\
    \ at the end of every iteration process.\n\n**Sample:**\nThe example shown below\
    \ outputs up to five iterations and alters the given value of two variables after\
    \ each cycle of the loop.\n\n```html\n<html>\n<body>\n<?php\n$x = 0;\n$y = 0;\n\
    for( $i = 0; $i<6; $i++ ) {\n    $x += 12;\n    $y += 6;\n}\necho (\"At the end\
    \ of the loop x = $x and y = $y\" );\n?>\n</body>\n</html>\n```\nThis produces\
    \ the following result − At the end of the loop a = 72 and b = 36\n\nConsider\
    \ another sample below that defines a loop which begins with `$i = 2`. The loop\
    \ goes on until `$i` has reached a value that is less than or equal to 5. The\
    \ variable `$i` continues to increase by 1 every other time the loop is executed:\n\
    \n```php\n<?php\nfor($i=1; $i<=3; $i++){\n    echo \"The number is \" . $i .\"\
    <br>\";\n}\n?>\n```\n\n### PHP do…while loop\nThe `do…while` loop is another form\
    \ of the `while` loop that evaluates the condition at the terminal point of every\
    \ loop iteration. In a `do…while` loop, a block of code is executed at once, and\
    \ the condition is then evaluated. When the condition passes as true, the expression\
    \ is processed repetitively for as long as the given condition of evaluation still\
    \ passes as true.\n\n**Syntax:**\n```php\ndo{ // Code to be executed }\nwhile(condition);\n\
    ```\n\n**Sample:**\nConsider the sample shown below, which will increase the value\
    \ of `$x` for every iteration. The variable `$x` will continue to increase in\
    \ value for as long as its assigned value is less than 15.\n\n```html\n<html>\n\
    <body>\n<?php\n$x = 0 ;\n$num = 0;\ndo {\n    $x++;\n} while( $x < 15 );\necho\
    \ (\"Loop stopped at x = $x\" );\n?>\n</body>\n</html>\n```\nThe result that will\
    \ be produced from the execution of this script is as follows: Loop terminated\
    \ at x = 15\n\n### The Distinction Between do…while and do loops\nFor the `while`\
    \ loop, the main distinction from the `do…while` loop exists in how execution\
    \ is carried out. In the `while` loop, the expression being evaluated is processed\
    \ at the start of every loop iteration. As a result, when an expression is evaluated\
    \ as false, no execution whatsoever will be made. For the `do…while` loop, on\
    \ the other hand, execution will be made right away on the loop even when the\
    \ conditional expression evaluates as false. And since the condition is being\
    \ evaluated at the terminal point of the loop iteration instead of the starting.\n\
    \n### The Foreach Loop\nThe `foreach` loop is applied when you need to iterate\
    \ over arrays.\n\n**Syntax:**\n```php\nforeach($array as $value){ // Code to be\
    \ run }\n```\n\n**The foreach loop statement:** \nThe `foreach` statement is applied\
    \ in a loop via arrays. For every cycle, the value of a current array element\
    \ is given to the variable `$output`. Then the array pointer is shifted by one,\
    \ and the succeeding element will be evaluated when the next cycle arrives.\n\n\
    **Syntax:**\n```php\nforeach (array as value) { code to be run }\n```\n\n**Sample:**\n\
    Consider the sample shown below to outline the values held by an array:\n\n```html\n\
    <html>\n<body>\n<?php\n$array = array( 5, 6, 7, 8, 9);\nforeach( $array as $output\
    \ ) {\n    echo \"Answer is $output <br />\";\n}\n?>\n</body>\n</html>\n```\n\
    The result of executing this script is as follows: Answer is 5 Answer is 6 Answer\
    \ is 7 Answer is 8 Answer is 9\n\n### There are other statements in PHP. They\
    \ are:\n\n#### The Break Statement\nIn PHP, the `break` statement is applied in\
    \ prematurely terminating the execution of loops. For better functionality, the\
    \ `break` statement is added within a statement block. Doing this accords you\
    \ absolute control for whenever you deem necessary to leave the loop. Once you\
    \ have successfully left the loop, the statement directly to it begins to run.\n\
    \n**Sample:**\nIn the sample condition below, the test evaluates as true whenever\
    \ the counter values attain a value of 5, and the loop is cancelled .\n\n```html\n\
    <html>\n<body>\n<?php\n$x = 0;\nwhile( $x < 10) {\n    $x++;\n    if( $x == 5\
    \ )break;\n}\necho (\"Loop stopped at x = $x\" );\n?>\n</body>\n</html>\n```\n\
    When the script is executed, the result outputted will be as follows: Loop stopped\
    \ at x = 5\n\n#### The Continue Statement\nThe `continue` statement in PHP is\
    \ applied in pausing the present iteration process of any loop, although it doesn’t\
    \ necessarily end the looping process. As in the use of the `break` statement,\
    \ the `continue` statement is located within the statement block holding the code\
    \ that is executed by the loop and is preceded by a conditional test.\n\n**Sample:**\n\
    In the sample shown below, the loop outputs a value of the array, however, for\
    \ the condition that passes as true, the code is skipped altogether, and the next\
    \ value is outputted.\n\n```html\n<html>\n<body>\n<?php\n$array = array( 5, 6,\
    \ 7, 8, 9);\nforeach( $array as $ouptut ) {\n    if( $output == 5 )continue;\n\
    \    echo \"Answer is $output <br />\";\n}\n?>\n</body>\n</html>\n```\nWhen the\
    \ script is executed, the result produced takes after the fashion showed below:\
    \ This produces the following result − Answer is 5 Answer is 6 Answer is 7 Answer\
    \ is 8 Answer is 9\n\n**Exercise 8:**\n1. What are loops?\n2. What statement is\
    \ introduced into a loop through arrays?\n3. What is the function of the for loop?\n\
    4. Why are loops used?\n"
