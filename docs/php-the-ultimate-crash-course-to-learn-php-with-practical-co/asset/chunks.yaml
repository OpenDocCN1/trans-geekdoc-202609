    ## String Functions


    81. `strstr()`: This function is used to locate the first appearance of a string
    within another string. It is case-sensitive.


    82. `strtok()`: This function is used in splitting strings into much smaller strings.


    83. `strtolower()`: This function is used in converting a string into lowercase.


    84. `strtloupper()`: This function is used in converting a string into uppercase.


    85. `strtr()`: This function is used in replacing substrings or translating characters.


    86. `substr()`: This function is used in returning an aspect of a string.


    87. `substr_compare()`: This function is used in the comparison of two strings
    from a particular start point until the length of the comparison is reached. The
    comparison process is case-sensitive optionally; however, it is fully binary-safe.


    88. `substr_count()`: This function is used in numbering the number of times a
    substring appears within a string.


    89. `substr_replace()`: This function is used in replacing an aspect of a string
    using another string.


    90. `trim()`: This function is used in eliminating whitespaces, as well as other
    characters from the starting and endpoint of a string.


    91. `ucfirst()`: This function is used in converting the first character within
    a string into uppercase.


    92. `ucfirst()`: This function is used in converting the beginning character of
    every word contained in a string into uppercase.


    93. `vfprintf()`: This function is used in writing a formatted string into a given
    output stream.


    94. `vprintf()`: This function is used in outputting formatted strings.


    95. `vsprintf()`: This function is used in returning formatted strings.


    96. `wordwrap()`: This function is used in wrapping a string into a specified
    amount of characters.


    ## Exercise 10


    1. What case-sensitive function is used for binary-safe comparisons between two
    strings?


    2. What is the `strstr()` function used for?


    3. What operator is used in the concatenation of two strings variables?


    4. What is the use of the `strlen()` function in PHP?


    5. How are strings with single quotes treated in PHP?


    6. What are strings?


    7. What are the two types of quoted strings?


    8. What function is used in repeating a string for a given amount of times?


    9. How does the function `printf()` differ from the `print()` function?


    10. To remove PHP and HTML tags from a string, what function is used?


    ## Chapter Eleven: Functions in PHP


    Functions in PHP are almost no different from those in other programming languages.
    Functions refer to the pieces of code which takes in inputs, usually in the form
    of parameters, processes and returns values. By now, you are quite familiar with
    many different functions in PHP like those used in string operations. Those functions
    are the built-in functions of the PHP programming language; however, you can make
    a function of your own, too. Although it is somewhat unnecessary to bother creating
    functions of your own, especially as PHP doesn''t exactly lack in functions of
    its own, there are lots of built-in library functions with various applications
    suitable for use at your beck and call.


    ### How Functions Work


    1. Functions are blocks of code which can be applied at any point in a program,
    and repeatedly too.


    2. Functions will not automatically run when a program is initiated.


    3. Functions are only executed when they are called in a program.

