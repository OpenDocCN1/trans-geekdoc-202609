- fmt: "\n## Review Questions\n\n9. What are ternary operators?\n\n10. The Divide\
    \ AND (`/=`) operator falls under what type of operators?\n\n11. Name the two\
    \ types of additive operators.\n\n## Chapter Seven Decision Making In PHP\n\n\
    Every script in PHP is created from a set of statements. These statements could\
    \ be loops, function calls, assignment, or even conditional statements of statements\
    \ that absolutely do nothing (i.e an empty statement). Additionally, it is possible\
    \ to classify statements into groups called `statement-group` through the sheer\
    \ process of putting a group of statements into curly braces. In itself, a statement-group\
    \ represents a statement, as well. In PHP, the statements shown below are used\
    \ in making decisions based on a certain number of conditions:\n\n1. `Else` statement\n\
    2. `If` statement\n3. `Elseif` statement\n4. `Switch` statement\n\n### The If…else\
    \ Statement\n\nThis statement is used when you want to run a series of codes when\
    \ one of the conditions is true, and another of the condition isn’t true.\n\n\
    **Syntax:** `if (condition) code to be run if the condition is true; else code\
    \ to be run if the condition is false;`\n\n**Sample:** The sample shown below\
    \ produces “Have a great day!” if the period of the day is Morning; otherwise,\
    \ it produces “Good night! Sleep well.”\n\n```html\n<html>\n<body>\n<?php\n$t\
    \ = time(\"H\");\nif ($t == \"Morn\") echo \"Have a great day!\";\nelse echo \"\
    Good night! Sleep well.\";\n?>\n</body>\n</html>\n```\nThe result that is produced\
    \ reads as follows: Have a great day!\n\n### The If Statement\n\nThe `if` statement\
    \ serves as a means of taking control of how a statement that follows it is executed\
    \ — in this case, a block of code or single statement contained in braces. The\
    \ `if` statement evaluates the expression contained in parentheses. Should the\
    \ expression result in a value considered to be true, the execution process is\
    \ initiated. If not, the whole statement is abandoned. Doing this allows your\
    \ PHP script to make decisions on its own based on a range of factors selected.\n\
    \n**Syntax:**\n```php\nif ( expression ) {\n    // code to run if the expression\
    \ outputs as true\n}\n```\n\n**Sample:** The following code would display x is\
    \ greater than y if `$x` is greater than `$y`:\n\n```php\n<?php\n$x=5;\n$y=2;\n\
    if ($x > $y) echo \"x is bigger than y\";\n?>\n```\n\n### The Elseif Statement\n\
    \nThis statement is used alongside the `if…else` statement during the execution\
    \ of a series of codes, should one of a variety of conditions be true. As the\
    \ name connotes, the `elseif` statement is a mixture of both `if` and `else` statements.\
    \ As with the `else` statement, the `elseif` statement extends the `if` statement\
    \ to run another statement in the event that the main `if` expression is evaluated\
    \ as FALSE. Albeit, contrary to the `else` statement, the `elseif` statement runs\
    \ the alternative expression only when the assigned conditional expression is\
    \ evaluated to be TRUE. So, put simply, whenever you wish to run a set of code\
    \ when one of many different conditions evaluate to true, the `elseif` statement\
    \ should be used.\n\n**Syntax:**\n`if (condition) code to be run if the condition\
    \ evaluates to true;`\n`elseif (condition) code to be run if the condition evaluates\
    \ to true;`\n`else code to be run if the condition evaluates to false;`\n\n**Sample:**\
    \ The sample shown below produces “Good morning. Rise and shine!” if the period\
    \ of the day is Morning, and “Good night! Sleep well.” when it is night. Otherwise,\
    \ it produces “Have a great day!”\n\n```html\n<html>\n<body>\n<?php\n$t = time(\"\
    H\");\nif ($t == \"Morn\") echo \"Good morning. Rise and shine!\";\nelseif ($t\
    \ == \"Nigt\") echo \"Good night! Sleep well.\";\nelse echo \"Have a great day!\"\
    ;\n?>\n</body>\n</html>\n```\n\n### The Else Statement\n\nThe `else` statement\
    \ is used when the `if` statement evaluates to false. It provides a fallback block\
    \ when the condition is not met.\n\n**Syntax:**\n```php\nif ( expression ) {\n\
    \    // code to run if the expression outputs as true\n} else {\n    // code to\
    \ run if the expression is false\n}\n```\n**Sample:** The following code would\
    \ display x is greater than y if `$x` is greater than `$y`:\n\n```php\n<?php\n\
    $x=5;\n$y=2;\nif ($x > $y) echo \"x is bigger than y\";\n?>\n```\n\n### The Switch\
    \ Statement\n\nThe `switch` statement allows you to compare a variable against\
    \ multiple values. It is often a cleaner alternative to multiple `if…elseif…else`\
    \ statements when checking a single variable.\n\n**Syntax:**\n```php\nswitch (expression)\
    \ {\n    case value1:\n        // code to run if expression == value1\n      \
    \  break;\n    case value2:\n        // code to run if expression == value2\n\
    \        break;\n    default:\n        // code to run if no values match\n}\n\
    ```\n**Sample:** The example below uses `switch` to evaluate the day:\n\n```php\n\
    <?php\n$t = time(\"H\");\nswitch ($t) {\n    case \"Morn\":\n        echo \"Good\
    \ morning. Rise and shine!\";\n        break;\n    case \"Nigt\":\n        echo\
    \ \"Good night! Sleep well.\";\n        break;\n    default:\n        echo \"\
    Have a great day!\";\n}\n?>\n```\n\n## Exercise 7\n\n1. The statement evaluated\
    \ by the `if` statement is enclosed in what?\n2. What statement is a combination\
    \ of both `else` and `if` statements?\n3. What statement is used with an `if`\
    \ statement when the evaluated statement turns out as false?\n4. What expression\
    \ is the `elseif` statement responsible for running?\n5. In `switch` statements,\
    \ when no label matches a value, how is the statement evaluated?\n6. When one\
    \ condition is true, and another isn’t, what statement is used?\n7. Statements\
    \ that have no purpose are called?\n8. What is a `statement-group`?\n9. In what\
    \ case would an expression be abandoned in an `if` statement?\n10. Why is the\
    \ `switch` statement used?\n\n## Chapter Eight Loops in PHP\n\nIn PHP, loops are\
    \ tools used in executing a single block of code over and over, given that a particular\
    \ condition is reached. The fundamental idea behind the concept of looping is\
    \ to introduce automation to repetitive actions in a program as a way of conserving\
    \ effort and time. In PHP programming, there are four supported types of loops.\
    \ They are:\n\n1. `while` loops\n2. `for` loops\n3. `do…while` loops\n4. `foreach`\
    \ loops\n"
