    2. `strstr()` 函数是做什么用的？


    3. 在两个字符串变量的拼接中使用了什么运算符？


    4. `strlen()` 函数在 PHP 中的作用是什么？


    5. PHP 是如何处理带有单引号的字符串的？


    6. 什么是字符串？


    7. 引号字符串有哪两种类型？


    8. 哪个函数用于按指定的次数重复字符串？


    9. `printf()` 函数与 `print()` 函数有何区别？


    10. 从字符串中移除 PHP 和 HTML 标签使用哪个函数？


    ## 第十一章：PHP 中的函数


    PHP 中的函数与其他编程语言中的函数几乎没有区别。函数是指接收输入（通常以参数的形式）、处理并返回值的代码段。到目前，你已经非常熟悉 PHP 中的许多不同函数，例如用于字符串操作的函数。这些函数是
    PHP 编程语言的内置函数；然而，你也可以创建自己的函数。虽然费力创建自己的函数有些没必要，特别是因为 PHP 本身并不缺少自己的函数，但有许多适用于各种场景的内置库函数供你随取随用。


    ### 函数如何工作


    1. 函数是代码块，可以应用于程序的任何位点，并且可以重复使用。


    2. 当程序启动时，函数不会自动运行的。


    3. 只有在程序中被调用时，函数才会执行。


