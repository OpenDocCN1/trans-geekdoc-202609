    \ <html> <body> <?php include(\"menu.php\"); ?> <p>This is an example to show\
    \ how to include PHP file!</p> </body> </html> When the script is parsed, the\
    \ result is as follows: Home  - ebXML AJAX – PERL This is a sample to demonstrate\
    \ how to include a PHP file. The require() Function: This function is used in\
    \ taking text found in a given file and copying them into a file in which the\
    \ include function is used on. Should any problems arise during the process of\
    \ executing a file, the require() function is responsible for throwing a fatal\
    \ error badly pausing the running of the said file. In this vein, it can be seen\
    \ that the disparity between both the require() and include() functions AMI's\
    \ non-existent, except in the case of handling error situations. In this sense,\
    \ the require() function is a better, more recommended alternative for use instead\
    \ of the include() function. The reason is that the processing of scripts ought\
    \ not to continue when errors, such as misnaming or missing files are discovered.\
    \ You can attempt to make use of the require() function for the sample above,\
    \ and the result generated is no different. However, if you want to follow a second\
    \ sample in which the file is non-existent, then the result obtained is different\
    \ for both include() and require() functions. <html> <body > <?php include(\"\
    xxmenu.php\"); ?> <p>This is a sample to demonstrate how an incorrect PHP file\
    \ can be included!</p> </body> </html> When the script is processed, the result\
    \ obtained is as follows: This is a sample to demonstrate how an incorrect PHP\
    \ file can be included! Having done that, let’s try out the same sample using\
    \ the require() function this time: <html> <body> <?php require(\"xxmenu.php\"\
    ); ?> <p> This is a sample to demonstrate how an incorrect PHP file can be included!</p>\
    \ </body> </html> When the file is processed in this case, it draws to a halt,\
    \ and nothing is outputted . Keep in mind that there is a tendency of fatal error\
    \ or plain warning messages to be reported. In some cases, nothing even. Everything\
    \ all boils down to the set-up of your PHP server. Exercise 15: \n\n1.  What function\
    \ takes all texts contained in a file and copies them to a file with an include()\
    \ function? \n\n2.  What is the purpose of the include() function? \n\nChapter\
    \ Sixteen Coding Standards and Conventions in PHP For every organization, there\
    \ is a specific standard of coding that is in line with what they consider to\
    \ be their best practices. Coding standards and conventions are necessary since\
    \ many developers may sometimes be working on diverse modules. And should they\
    \ begin developing standards of their own, the source becomes quite difficult\
    \ to manage indeed, and managing source codes in coming times becomes difficult,\
    \ if not impossible altogether. Below are many different rationales behind the\
    \ use of coding standards and conventions: \n\n*   For programmers and their peers\
    \ to comprehend the code that is produced. A coding standard serves in the role\
    \ of a blueprint in intimating the team with the details of the code. \n\n*  \
    \ Clarity and simplicity attained through consistent coding could save a user\
    \ from traditional errors. \n\n*   For better comprehension of code, especially\
    \ after it is revised over a given timeframe. \n\n*   It is the standard of companies\
    \ to go with a specific standard in bringing more quality into software. \n\n\
    In PHP, there are specific standards that ought to be followed when coding. They\
    \ are including but not limited to the following: Line Length and Indentation:\
    \ Make use of an indent of no more than 4 spaces and don't apply any tab as different\
    \ computers make use of varying settings for their tab function. It is advisable\
    \ to maintain the lines between 75 and 85 characters in length to improve the\
    \ readability of code. Control Structures: Control structures are made up of while,\
    \ if, switch, for, among others. When coding, control statements should be written\
    \ with a space between the opening parenthesis and the control keyword. The reason\
    \ for this is to differentiate control keywords from function calls. It is strongly\
    \ advised to use curly braces at all times, even in conditions where they see\
    \ technically optional. Samples: if ((condition1) || (condition2)) { action1;\
    \ }elseif ((condition3) && (condition4)) { action2; }else { default action; }\
    \ It is possible to write switch statements in the manner shown below: switch\
    \ (condition) { case 1: action1; break; case 2: action2; break; default: defaultaction;\
    \ break; } Function Calls: Functions ought to be called without any space placed\
    \ between the name of the function, the first parameter, and the opening parenthesis.\
    \ Also, there ought to be spaces between each parameter and ensuing commas, and\
    \ no space used between the final parameter, a semicolon, and the closing parenthesis.\
    \ Consider the sample shown below: $var = foo($open, $close, $value) ; Function\
    \ Definitions: Function declarations are usually tailored according to the BSD/Allman\
    \ style. function fooFunction($arg1, $arg2 = '') { if (condition) { statement;\
    \ } return $val; } Comments: Standard C++ comments (//) and C-styled comments\
    \ (/\\* \\*/) are not a problem. However, making use of shell-styled or Perl comments\
    \ (#) is drowned upon. PHP code tags: Ensure to use <?php ?> in delimiting pho\
    \ codes rather than the shorthand version <? ?>. The reason is that the former\
    \ method is in compliance with PHP standards, and serves as the most portable\
    \ method of introducing PHP codes into different setups and operating systems.\
    \ Variable names: \n\n*   Make use of lower case letters only. \n\n*   Make use\
    \ of underscore (\\_) in separating words. \n\n*   \"g\" should be used in prepending\
    \ global variables in a code. \n\n*   Global constants should be written in capital\
    \ letters with underscores (\\_) used as separators. \n\n*   \"s\" should be used\
    \ in prepending static variables. "
