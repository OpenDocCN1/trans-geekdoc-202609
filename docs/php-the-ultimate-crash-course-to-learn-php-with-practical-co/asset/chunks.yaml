    \ function that uses the name of the file for an argument, returning the size\
    \ of the file as an expression in bytes. Outlined below are some step necessary\
    \ for reading a file in PHP: \n\n*   Use the fopen() function to open the file.\
    \ \n\n*   Obtain the length of the file with the filesize() function. \n\n*  \
    \ Use the fread() to read the content of the file. \n\n*   Finally, use the fclose()\
    \ function to close the file. \n\nThe sample shown below is of a variable assigned\
    \ to the content of a text file which then portrays the contents on the web page.\
    \ <html> <head> <title>Reading a file using PHP</title> </head> <body> <?php $filename\
    \ = \"tmp.txt\"; $file = fopen( $filename, \"r\" ) ; if( $file == false ) { echo\
    \ ( \"Error in opening file\" ); exit(); } $filesize = filesize( $filename );\
    \ $filetext = fread( $file, $filesize ); fclose( $file ); echo ( \"File size :\
    \ $filesize bytes\" ); echo ( \"<pre>$filetext</pre>\" ); ?> </body> </html >\
    \ When the code is executed, the result that will be outputted will be as follows:\
