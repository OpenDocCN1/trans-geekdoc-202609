  md: 'to 11 million by the year 2030 (nearly double in the next ten years) and 14.5
    million by 2050. In India, the severity of diabetic retinopathy is so much that
    around 18% of the Indian citizen are currently suffering from diabetic retinopathy.[4]
    There are important differences over the past few decades in diagnosis, medical
    care, socioeconomic factors and other risk factors that influence the prevalence
    and geographic distribution of diabetes and retinopathy as well.


    In statistics of the year 2002 it was witnessed that nearly 5 million people suffered
    from eye diseases, reason being Diabetic retinopathy which rounds up to almost
    5% of world blindness. The cases of Diabetic retinopathy are gradually increasing,
    and hence there is a chance that probably more individual will suffer from complications
    in the eye, and if these complications are not properly managed, they may lead
    to permanent loss of vision.


    The project aims to automate the process of identifying diabetic retinopathy so
    that preventive measures can be taken in time, and the effect of diabetic retinopathy
    can be minimized. Because of the automation of the process, identifying diabetic
    retinopathy in the early stages becomes easier and as a result, proper treatment
    can be provided at the proper time by the doctors.


    # C. Scope of the project


    There are many approaches being pursued to learn more about the development and
    progression of diabetes-related sight loss and to identify improvements in diagnostics
    and treatments. Across the world, clinical trials are actively testing new options
    and evaluating new practices to improve the way by which diabetes-related sight
    loss is detected and treated. Some examples of these studies are included below.


    Researchers are aware of the importance of early detection of the complications
    of diabetes to limit significant damage to the eye and loss of sight. As such,
    research teams are actively seeking improvements in the ways by which diabetes-related
    sight loss is identified and when it is detected. One such clinical trial is aiming
    to develop and test a new predictive technology that could improve the way in
    which Diabetic Retinopathy is identified. Researchers aim to analyze details about
    the individual''s background, medical history and laboratory test results to develop
    an improved means of identifying and managing the condition.


    Another study also seeks to test artificial intelligence to detect diabetic retinopathy.
    Research also underway seeks to find new molecules circulating in the blood stream
    which could highlight the prognosis of people living with diabetic retinopathy;
    namely identifying those people for whom the condition may be mild, moderate or
    more severe overtime.


    The aim of the project is to identify the severity based on automated way for
    extraction of different features (including


    Blood Vessels and Exudates) of the retinal images of a diabetic retinopathy patient
    so that preventive measures can be taken in the earlier stage of the diabetic
    retinopathy.


    # D.Objective and Aim


    +   - To automate the process of diagnosis of Diabetic Retinopathy

    +   - To diagnose if the person suffers from diabetic retinopathy or not.

    +   - To increase the efficiency of the system.


    The main motive of the proposed system is to automate the whole process of detecting
    diabetic retinopathy .The input to the system will be the retinal images. The
    system will apply filtering techniques to those images. Image pre-processing steps
    are applied to get accurate result. Customized algorithms for the extraction of
    blood vessel and exudates are applied on the images. Finally the system will detect
    diabetic retinopathy i.e. whether the patient is suffering from diabetic retinopathy
    or not.


    # II. LITERATURE SURVEY


    The diabetic retinopathy concerns not only the technical aspects such as image
    processing and machine learning algorithms, but also the non-technical aspects
    such as what features to extract, and so on.


    Hemanth D. et.al. [6], have proposed a hybrid method which combines image processing
    and deep learning on DR fundus images for improved detection. The authors have
    performed Histogram equalization and CLAHE on the DR images and passed it to CNN
    for classification. CNN provides higher accuracy but involves computation time
    so the authors suggest to use some pre-processing methods in image processing
    to reduce the same.


    R. Ravindraiiah et al [8] used fuzzy based clustering method, which are less complex
    and more robust in their system, it groups pixels with common features and accumulates
    data into distinct datasets. The processing steps involved in their paper included
    fixing the number of clusters ''C'' and randomly initializing the cluster centers
    Ci, updating the membership matrix Mij, updating the cluster centers Ci, updating
    the membership matrix Mij, updating the Objective Function JMKSFCM, If the absolute
    value of (J, t-J, t-1) is less than epsilon then stop the iteration process otherwise
    repeating the steps 2 to 4 Where e = 0.0001.


    Another paper by Shailesh Kumar et al [7] proposed a system that extracts the
    micro aneurysm i.e. the tiny red spots on the retina for the early detection of
    diabetic retinopathy. The process included basic steps such as the green channel
    technique, adaptive histogram equalization, segmentation and SVM for classification.


    The system proposed by Karkhanis Apurva Anant, Tushar Ghorpade, Vimla Jethani
    [9] used the methods to classify DR'
