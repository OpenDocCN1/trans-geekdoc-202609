    # VI. CONCLUSION AND FUTURE SCOPE


    Diabetic Retinopathy being the primary causes of blindness requires reliable and
    accurate detection which also saves time and money of the patients. The research
    done in detection of DR has mainly focused on texture and statistical feature
    extraction as can be seen from the survey. The techniques proposed so far have
    focused on emphasizing the pre-processing stage more to get good quality region
    of interest for the next steps. Some of the methods applied include filtering,
    Thresholding, binarization and morphological operations. The system proposed in
    this paper also focuses on designing different system for blood vessel extraction
    and exudates extraction with more emphasis on improved pre-processing and feature
    extraction methods. The standard publicly available dataset of DIARETDB1 and DIARETDB0
    are used for testing the proposed system design. The accuracy obtained using different
    algorithms is quite satisfactory, the best accuracy of 88.6% is obtained using
    the simple tree algorithm which was better than the other classification algorithms
    used for detection. The other algorithms includes Support Vector Machine (SVM)
    and k-Nearest Neighbor (KNN) giving an accuracy of 87.2% and 85.8%. The sensitivity
    and specificity for the combined features are also calculated and shown in the
    results, these values also support the proposed system. As a future scope researchers
    can apply pre-trained deep learning models for achieving higher


    performance in detection with replication into real time AI based models.


