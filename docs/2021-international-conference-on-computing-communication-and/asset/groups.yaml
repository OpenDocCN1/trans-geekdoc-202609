    ## VI. 结论与未来展望


    糖尿病视网膜病变是导致失明的主要原因，需要可靠且准确的检测，这也能节省患者的时间和金钱。从综述可以看出，现有的 DR 检测研究主要集中在纹理和统计特征提取上。迄今为止提出的技术更侧重于强调预处理阶段，以便为后续步骤获得高质量的感兴趣区域。所应用的一些方法包括滤波、阈值处理、二值化和形态学操作。本文提出的系统也侧重于设计用于血管提取和渗出物提取的不同系统，并更加强调改进的预处理和特征提取方法。使用标准公开可用的数据集
    DIARETDB1 和 DIARETDB0 来测试拟议的系统设计。使用不同算法获得的准确性相当令人满意，使用简单树算法获得的最佳准确性为 88.6%，优于用于检测的其他分类算法。其他算法包括支持向量机（SVM）和
    k-近邻（KNN），其准确性分别为 87.2% 和 85.8%。还计算并显示了组合特征的灵敏度和特异度，这些值也支持拟议系统。作为未来的研究方向，研究人员可以应用预训练的深度学习模型来实现更高的检测性能，并将其复制到基于实时
    AI 的模型中。


