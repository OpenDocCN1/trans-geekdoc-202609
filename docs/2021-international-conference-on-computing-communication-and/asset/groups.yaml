    \ SVM 分类器被用作所提系统的步骤。研究现有系统后发现，大多数系统只关注解决问题的图像处理或机器学习方面中的某一个。所提系统试图同时关注图像处理和可用于高精度检测糖尿病视网膜病变的机器学习算法。此外，与现有系统相比，不同的预处理步骤组合被用于每个特征、血管和渗出物，以更好地提取特征。\n\
    \n## III. 所提系统\n\n图 2(A) 以一般方式显示了所提系统图，包含各个步骤，而图 2(B) 指示了所使用的技术。\n\n- **图像调整大小或缩放：**\
    \ 图像调整大小是必要的，因为数据集可能来自不同的来源，例如在线或直接来自医院，因此有必要使图像保持一致性，以便处理技术和特征提取技术不会产生任何异常。\n\
    \n![](img/dbca737b9377865a14c4b5d64041ef89_2_0.png)\n\n![](img/dbca737b9377865a14c4b5d64041ef89_2_1.png)\n\
    \nFig. 2. DR 检测的拟议框图与方法论\n\n- **尺度转换：** 本步骤将 RGB 图像转换为灰度图像。这样做不仅是为了在应用处理、特征提取及其他数学技术（如需要）时降低复杂性，也是因为与灰度图像相比，灰度图像的结果更好且略微更优化。\n\
    \n- **图像预处理：** 使用自适应直方图均衡化，改变图像的对比度，以便更容易提取特征。\n\n- **自适应直方图均衡化：** 在这种技术中，为了改善结果，提高了图像的对比度。AHE\
    \ 也会过度放大图像某些部分的噪声。这就是为什么使用高级算法——对比度受限自适应直方图均衡化（CLAHE），它减少了噪声的放大。\n\n- **特征提取：**\
    \ 从上述方法中提取对比度增强后的视网膜图像的特征，这将进一步帮助分类过程。\n\n- **分类：加权 k-最近邻（KNN）：** 该算法是 k-最近邻的定制形式。在此算法中，使用核函数为最近的\
    \ k 个点赋予权重 [12]。其原理是给近距离点更高的权重，给远距离点更低的权重。\n\n- **支持向量机（SVM）：** 该算法使用超平面划分训练数据，然后使用这些超平面对测试数据进行分类。\n\
    \n- **简单树：** 简单树也称为决策树，其中节点如流程图般连接。内部节点代表一个属性，结果表示为分支。\n\n所提系统针对血管和渗出物检测的算法步骤如下：\n\
    \n- 步骤 1. 从用户处输入图像\n- 步骤 2. 对图像应用预处理步骤以提取血管。\n  - 步骤 2.1. 将图像转换为绿色通道。\n  - 步骤\
    \ 2.2. 对结果图像进行补色处理。\n  - 步骤 2.3. 通过直方图均衡化调整图像的对比度。\n  - 步骤 2.4. 开运算图像。\n  - 步骤\
    \ 2.5. 移除视盘。\n  - 步骤 2.6. 对图像执行阈值处理和二值化。\n  - 步骤 2.7. 对图像执行开运算。\n\n- 步骤 3. 计算并存储提取的血管的面积和周长。\n\
    - 步骤 4. 对图像应用预处理步骤以提取渗出物。\n  - 步骤 4.1. 将图像转换为绿色通道。\n  - 步骤 4.2. 对图像执行形态学闭运算。\n\
    \  - 步骤 4.3. 对图像进行列滤波。\n  - 步骤 4.4. 对图像先执行膨胀再执行腐蚀。\n  - 步骤 4.5. 移除视盘。\n\n- 步骤\
    \ 5. 计算提取的渗出物的面积和周长，并将值追加到上述存储的结果中。\n- 步骤 6. 将结果数据作为测试数据输入到预训练算法（立方 SVM、加权 KNN\
    \ 或简单树，由用户选择）中。\n- 步骤 7. 将机器学习算法检索的数据输出给用户。\n\n## IV. 实现输出\n\n所提系统使用 MATLAB 进行图像处理，用于输入图像并从图像中提取各种特征。\n\
    \n### A. 数据库\n\n用于系统训练和测试的数据库是 DIARETDB0 和 DIARETDB1。这些图像在 Kuopio 大学医院拍摄。数据库分别包含来自\
    \ DIARETDB0 和 DIARETDB1 的 130 张和 89 张眼底图像，其中一些图像来自未显示任何糖尿病视网膜病变症状的正常患者，其余则来自被诊断患有糖尿病视网膜病变的患者。这些图像使用\
    \ MATLAB R2019a 进行训练和测试。\n\n### B. 血管提取\n\n血管在判断患者是否患有糖尿病视网膜病变方面起着重要作用。糖尿病视网膜病变会导致血管收缩，但仅凭血管收缩不足以判断患者是否受影响。这就是为什么渗出物、微血管瘤等其他特征也被用于检测糖尿病视网膜病变。\n\
    \n为判断血管是否收缩，第一步是从给定图像中提取血管。对于血管提取，所使用的步骤在以下图中描述，请参阅图 3(A)。\n\n### 1) 血管提取过程：\n\
    \n![](img/dbca737b9377865a14c4b5d64041ef89_3_0.png)\n\nFig. 3. 血管提取。\n\n从视网膜图像中提取血管用于特征提取。结果请参阅图\
    \ 3(B)。计算面积和周长特征后获得的值被写入 CSV 文件。\n\n### C. 渗出物提取\n\n下图 4 显示了渗出物提取的步骤。每个步骤的详细说明如下，其输出显示在图\
    \ 5 中。\n\n![](img/dbca737b9377865a14c4b5d64041ef89_3_1.png)\n\nFig. 4. 渗出物提取 -\
    \ 步骤。\n\n- **调整大小：** RGB 平面中的原始图像被调整为 376 X 520 像素的矩阵，以便所有图像都具有标准通用尺寸。\n- **绿色分量提取：**\
    \ 从 RGB 图像中提取绿色分量以获得更好的结果。\n- **形态学闭运算：** 使用半径为 5 像素的结构元素对图像执行膨胀和腐蚀。请参阅图 5(3)。\n\
    - **列滤波：** 通过将图像中每个 5 X 5 块重新排列为临时矩阵，然后对这些块应用方差（@var）函数来处理图像，使用此方法，背景降低变得更容易。请参阅图\
    \ 5(4)。\n- **图像膨胀和腐蚀：** 先对图像执行膨胀，再执行腐蚀，以将两个相邻的渗出物合并为一个更大的渗出物。请参阅图 5(5)。\n- **光盘掩模和减法：**\
    \ 定位光盘并从图像中减去它。请参阅图 5(6)。\n\n![](img/dbca737b9377865a14c4b5d64041ef89_4_0.png)\n\
    \nFig. 5. 渗出物提取 – 输出。\n\n## V. 实验结果\n\n通过将特征提取步骤获得的 CSV 文件传递到 MATLAB R2015 中内置的分类学习者应用中获得结果。MATLAB\
    \ 中的分类学习者应用将表中列以预测器和响应形式的变量作为输入，根据所选分类器训练模型，并给出分类算法的准确率。为此程序，使用了加权 KNN、立方支持向量机（SVM）和简单树来检查特征提取方法的准确率。使用加权\
    \ KNN 算法，渗出物和血管特征组合的总体准确率为 85.8%。总体正确分类的图像总数为 219 张中的 188 张。表 1 表示 DR 和正常类别中分类图像的百分比：。此类依赖于以下包以正常运行。\n\
    \n| 特征 | 正确分类图像 (%) | 错误分类图像 (%) |\n| :--- | :--- | :--- |\n| 渗出物 | 89.04 | 10.95\
    \ |\n| 血管 | 85.39 | 14.6 |\n| 渗出物和血管 | 85.84 | 14.16 |\n\n使用立方 SVM 算法，总体准确率为 87.2%。总体正确分类的图像总数为\
    \ 219 张中的 191 张。\n\n当两个特征都用于分类时，SVM 能给出更好的结果。\n\n| 特征 | 正确分类图像 (%) | 错误分类图像 (%)\
    \ |\n| :--- | :--- | :--- |\n| 渗出物 | 77.17 | 25.11 |\n| 血管 | 83.56 | 16.44 |\n\
    | 渗出物和血管 | 87.21 | 12.79 |\n\n使用简单树算法，总体准确率为 88.6%。总体正确分类的图像总数为 219 张中的 194 张。简单树在用血管和渗出物这两个特征对图像进行分类时也能给出更好的结果，尽管差异微乎其微。\n\
    \n| 特征 | 正确分类图像 (%) | 错误分类图像 (%) |\n| :--- | :--- | :--- |\n| 渗出物 | 88.13 | 11.87\
    \ |\n| 血管 | 88.13 | 11.87 |\n| 渗出物和血管 | 88.58 | 11.42 |\n\n以下表 4 显示了使用 SVM、KNN\
    \ 和简单树分类算法为所提系统获得的准确率结果。\n\n| 分类器 | 渗出物 | 血管 | 渗出物和血管 |\n| :--- | :--- | :---\
    \ | :--- |\n| 立方 SVM | 77.2% | 83.6% | 87.2% |\n| 加权 KNN | 89.0% | 85.4% | 85.8%\
    \ |\n| 简单树 | 88.1% | 88.1% | 88.6% |\n\n基于所有三种算法的混淆矩阵值，表 5 中计算了渗出物和血管组合特征集的灵敏度和特异度。灵敏度和特异度的公式如下。\n\
    \n```\nSensitivity = TP / TP+FN\nSpecificity = TN / TN+FP\n```\n\n灵敏度和特异度值显示了所提系统的有效性。简单树产生\
    \ 98% 的灵敏度值。\n\n"
