    **_Abstract_-- Diabetic Retinopathy has been one of the common reason why diabetic
    patients lose sight. It is caused by the damaging of the blood vessel of the light
    sensitive tissue at the back of the eye or the retina. The traditional methods
    for the detection of the disease requires lots of time and efforts hence the proposed
    system aims to detect diabetic retinopathy using Image Processing and Machine
    Learning. The input provided to the proposed system are the retinal images from
    the standard databases DIARETDB0 and DIARETDB1. The system aims to automate the
    process of detection using a combination of basic image processing steps with
    more focus on pre-processing to obtain clear image for feature extraction, further
    Machine Learning algorithms are applied for classification. The statistical features
    such as area and perimeter are obtained from blood vessels and exudates after
    pre-processing stage, different pre-processing techniques such as grayscale conversion,
    binarization, canny edge detection and some morphological operations including
    image dilation and erosion are applied to obtain clear image. The Machine Learning
    algorithms are used for result analysis are Weighted KNN, Cubic SVM and Simple
    Tree which provides an accuracy of 85.8%, 87.2% and 88.6% respectively. The sensitivity
    and specificity parameters are also obtained, Simple tree yields better results
    for all the three result parameters.**


    **_Keywords_-- Blood Vessels; Diabetic Retinopathy; Exudates; Machine Learning;
    Weighted KNN**


    # I. INTRODUCTION


    # _A. Diabetic Retinopathy_


    Diabetic Retinopathy (DR) is a medical condition in which a patient suffering
    from diabetes have some complexities in the retina, and due to these complexities,
    the patient’s eyes are affected. Diabetic Retinopathy is caused by the damage
    to the blood vessels present in the retina due to diabetes. The blood vessels
    in the retina either swell up or contract which leads to formation of lumps of
    fluid or blood which are called as


    exudates, hemorrhage and micro aneurysm. These are the early symptoms that can
    be seen in the retinal images of a diabetic patient. It can also result in permanent
    loss of vision [2]. It is predicted that the number of diabetic retinopathy patients
    would increase from 7.7 million to 11 million by 2030 and to 14.5 million by 2050.
    A survey conducted by Rajendra Prasad Centre for Ophthalmic Sciences and AIIMS,
    New Delhi in 2019 shows that one out of 46 diabetic patients suffers from diabetic
    retinopathy. The retinal image of normal eye and DR affected eye is shown in Fig.
    1.


    ![](img/dbca737b9377865a14c4b5d64041ef89_0_0.png)


    **Fig. 1. Normal V/s DR affected Retina [2]**


    The treatment for mild cases could be done by managing sugar level of the blood
    and in advance cases the help of surgery or laser treatment is taken [3]. The
    techniques used in existing system includes Binarization, Thresholding, Opening,
    Adaptive Histogram Equalization, and Median Filter.


    # _B. Problem Definition_


    Diabetic Retinopathy is a growing issue and the leading cause of blindness in
    the working age adults that is people whose age ranges between 20 and 74. Currently
    that statistics show that nearly 7.7 million people have suffered from diabetic
    retinopathy and it is predicted that the number would increase'
