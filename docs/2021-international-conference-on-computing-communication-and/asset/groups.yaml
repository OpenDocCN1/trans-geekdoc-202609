    ## 基于改进预处理的糖尿病视网膜病变检测机器学习方法


    阿尤希·夏马*

    信息技术系，

    Ramrao Adik Institute of Technology, Nerul

    sharma.ayushinks@gmail.com


    斯瓦普尼尔·辛德

    信息技术系，

    Ramrao Adik Institute of Technology, Nerul

    swapnil.shinde@rait.ac.in


    伊姆兰·伊斯兰·谢赫

    信息技术系，

    Ramrao Adik Institute of Technology, Nerul

    ishaikh422.is@gmail.com


    马达夫·维亚斯

    信息技术系，

    Ramrao Adik Institute of Technology, Nerul

    madhav.vyas@rait.ac.in


    索米娅·拉尼

    信息技术系，

    Ramrao Adik Institute of Technology, Nerul

    soumyarani4021998@gmail.com


    ### 摘要


    糖尿病视网膜病变是糖尿病患者失明的常见原因之一。它是由眼睛后部或视网膜的对光敏感组织的血管受损引起的。该疾病的传统检测方法需要大量时间和精力，因此所提系统旨在使用图像处理和机器学习来检测糖尿病视网膜病变。所提系统的输入来自标准数据库
    DIARETDB0 和 DIARETDB1 的视网膜图像。该系统旨在通过结合基本图像处理步骤并更侧重于预处理以获取用于特征提取的清晰图像来自动化检测过程，随后应用机器学习算法进行分类。预处理阶段后，从血管和渗出物中获得面积和周长等统计特征，应用灰度转换、二值化、Canny
    边缘检测以及包括图像膨胀和腐蚀在内的一些形态学操作等不同预处理技术来获取清晰图像。用于结果分析的机器学习算法包括加权 KNN、Cubic SVM 和 Simple
    Tree，其准确率分别为 85.8%、87.2% 和 88.6%。还获得了灵敏度和特异度参数，Simple Tree 在所有三个结果参数上均表现更好。


    ### 关键词


    血管；糖尿病视网膜病变；渗出物；机器学习；加权 KNN


    ## I. 引言


    ### A. 糖尿病视网膜病变


    糖尿病视网膜病变（DR）是一种医学状况，糖尿病患者的视网膜出现一些并发症，由于这些并发症，患者的眼睛受到影响。糖尿病视网膜病变是由于糖尿病导致视网膜中血管受损引起的。视网膜中的血管要么肿胀要么收缩，导致形成液体或血块，称为渗出物、出血和微动脉瘤。这些是糖尿病患者视网膜图像中可见的早期症状。它也可能导致永久性视力丧失
    [2]。预计糖尿病视网膜病变患者人数将从 770 万增加到 2030 年的 1100 万，到 2050 年达到 1450 万。新德里拉贾弗拉萨德眼科学中心和
    AIIMS 于 2019 年进行的一项调查显示，每 46 名糖尿病患者中就有 1 人患有糖尿病视网膜病变。图 1 显示了正常眼和 DR 受影响眼的视网膜图像。


    ![](img/dbca737b9377865a14c4b5d64041ef89_0_0.png)


    **图 1. 正常视网膜与 DR 受影响视网膜对比 [2]**


    轻度病例可通过控制血糖水平进行治疗，而重症病例则采用手术或激光治疗 [3]。现有系统使用的技术包括二值化、阈值处理、开运算、自适应直方图均衡化和中值滤波。


    ### B. 问题定义


    糖尿病视网膜病变是一个日益严重的问题，是工作年龄成年人（即年龄在 20 至 74 岁之间的人）失明的主要原因。目前统计数据显示，近 770 万人患有糖尿病视网膜病变，预计到
    2030 年该数字将增加到 1100 万（未来十年近乎翻倍），到 2050 年达到 1450 万。在印度，糖尿病视网膜病变的严重程度如此之高，以至于目前约有
    18% 的印度公民正在遭受糖尿病视网膜病变的困扰。[4] 在过去几十年中，诊断、医疗保健、社会经济因素和其他影响糖尿病及视网膜病变患病率和地理分布的风险因素方面存在重要差异。


    2002 年的统计显示，近 500 万人患有眼疾，原因是糖尿病视网膜病变，占全球失明的近 5%。糖尿病视网膜病变病例逐渐增加，因此更多个人可能会遭受眼部并发症，如果这些并发症得不到妥善管理，可能导致永久性视力丧失。


    该项目旨在自动化糖尿病视网膜病变的识别过程，以便及时采取预防措施，并将糖尿病视网膜病变的影响降至最低。由于流程自动化，早期识别糖尿病视网膜病变变得更加容易，因此医生可以在适当时间提供适当治疗。


    ### C. 项目范围


    正在采用许多方法来更多地了解与糖尿病相关的视力丧失的发展和进展，并识别诊断和治疗方面的改进。在全球范围内，临床试验正在积极测试新选项并评估新实践，以改善与糖尿病相关的视力丧失的检测和治疗方式。这些研究的一些示例如下。


    研究人员意识到早期检测糖尿病并发症的重要性，以限制对眼睛的重大损害和视力丧失。因此，研究团队正在积极寻求改善识别与糖尿病相关的视力丧失及其检测时间的方法。这样的临床试验之一旨在开发和测试一种新的预测技术，以改善糖尿病视网膜病变的识别方式。研究人员旨在分析个人背景、病史和实验室检测结果的详细信息，以开发一种改进的识别和管理该状况的手段。


    另一项研究也寻求测试人工智能来检测糖尿病视网膜病变。还在进行中的研究寻求在血液中循环的新分子，这些分子可以突显糖尿病视网膜病变患者的预后；即识别那些病情随时间可能为轻度、中度或更严重的人。


    该项目的目的是基于自动化方式提取不同特征（包括血管和渗出物）的糖尿病视网膜病变患者视网膜图像，以便在糖尿病视网膜病变的早期采取预防措施。


    ### D. 目标与宗旨


    - 自动化糖尿病视网膜病变的诊断过程

    - 诊断该人是否患有糖尿病视网膜病变。

    - 提高系统的效率。


    所提系统的主要目的是自动化糖尿病视网膜病变的整个检测过程。系统的输入将是视网膜图像。系统将对这些图像应用滤波技术。应用图像预处理步骤以获得准确结果。在图像上应用用于血管和渗出物提取的定制算法。最后，系统将检测糖尿病视网膜病变，即患者是否患有糖尿病视网膜病变。


    ## II. 文献综述


    糖尿病视网膜病变不仅涉及图像处理和机器学习算法等技术方面，还涉及提取哪些特征等非技术方面。


    Hemanth D. 等人 [6] 提出了一种混合方法，将图像处理与深度学习应用于 DR 眼底图像，以改进检测效果。作者对 DR 图像进行了直方图均衡化和
    CLAHE，并将其传递给 CNN 进行分类。CNN 提供更高的准确性但涉及计算时间，因此作者建议在图像处理中使用一些预处理方法来减少相同。


    R. Ravindraiiah 等人 [8] 使用了基于模糊的聚类方法，该方法在其系统中复杂度较低且更加稳健，它将具有共同特征的像素分组并将数据累积到不同的数据集中。其论文中涉及的处理步骤包括固定聚类数
    ''C'' 并随机初始化聚类中心 Ci，更新隶属度矩阵 Mij，更新聚类中心 Ci，更新隶属度矩阵 Mij，更新目标函数 JMKSFCM，如果 (J, t-J,
    t-1) 的绝对值小于 epsilon 则停止迭代过程，否则重复步骤 2 至 4，其中 e = 0.0001。


    Shailesh Kumar 等人 [7] 的另一篇论文提出了一种系统，用于提取微动脉瘤（即视网膜上的微小红点）以早期检测糖尿病视网膜病变。该过程包括绿色通道技术、自适应直方图均衡化、分割和用于分类的
    SVM 等基本步骤。


    Karkhanis Apurva Anant, Tushar Ghorpade, Vimla Jethani [9] 提出的系统使用了分类 DR 的方法


