  - '[PAGE 2]


    images using image processing, data mining approach, Algorithms such as Laplace
    Edge Detection, DWT and GLCM were used for the further process of feature extraction.
    KNN was used as the classifier which gave an accuracy of 96.62%.


    Neelam D. Panse, Tushar Ghorpade and Vimla Jethani[10] proposed a system for classifying
    the images into three categories normal, diabetic retinopathy and glaucoma using
    Discrete Wavelet Transform, Canny edge detection, Binarization, DCT (discrete
    cosine transformation) and KNN. The Authors [10] proposed a new method over the
    previously developed matched filter. The proposed system classifies the images
    into normal, moderate Non-Proliferative Diabetic Retinopathy (NRDR) and severe
    NPDR using perception based binarization, and density analysis apart from the
    basic image processing steps. A non-parametric Tree-type classifier- Random Forest
    (RF) was used as a classifier.


    The system proposed by M.C. Shanker et.al. [11] discusses the detection of Diabetic
    Retinopathy by using SVM classifier algorithm. Pre-processing steps used in the
    presented system are resizing. Then the immaterial part of the images are cropped
    on the regions where some spots or the layer is visible. Next step was Contrast
    Enhancement for improving quality of the images which is necessary for human interpretation.
    Image Segmentation, Feature Extraction and SVM classifier were used as the steps
    in proposed system. After studying existing systems it is noted that most of the
    systems have focused on any one of the Image processing or Machine Learning aspect
    of solving the problem. The proposed system tries to focus on both the processing
    of the image and the machine learning algorithm that can be used to detect diabetic
    retinopathy with much accuracy. Also, as compared to existing systems different
    combinations of preprocessing steps were used for each feature, blood vessel and
    exudates, for better extraction of the feature.


    # III. PROPOSED SYSTEM


    The Figure 2(A) shows the proposed system diagram consisting of steps in general
    manner whereas Figure 2(B) indicates techniques used.


    +   **Image Resizing or Scaling:** Image resizing is necessary since the data
    set might be from different sources such as from online or directly from the hospital
    therefore it is necessary to bring uniformity to the images so that the processing
    techniques and the feature extraction technique does not result in any anomalies.


    ![](img/dbca737b9377865a14c4b5d64041ef89_2_0.png)


    ![](img/dbca737b9377865a14c4b5d64041ef89_2_1.png)


    Fig. 2. DR Detection proposed Block Diagram & Methodology


    +   **Conversion of the Scale:** The RGB image in this step is converted to grey
    scale image. This is done to not only reduce the complexity while applying processing
    and feature extraction and other mathematical techniques if needed but also because
    images in grey scale the results are yielded better and a little more optimized
    than the former.


    +   **Image Pre-processing:** Using Adaptive histogram equalization, the contrast
    of the images is changed so that it will be easier to extract features.


    +   **Adaptive Histogram Equalisation:** In this technique for the betterment
    of the results the contrast of the image is increased. AHE also over amplifies
    noise in certain parts of an image. That is why an advanced algorithm is used
    contrast limited adaptive histogram equalization (CLAHE) which reduces the amplification
    of noise.


    +   **Feature Extraction:** The features of the contrasted retinal images are
    extracted from the above methods which would further help in classification process.


    +   **Classification: Weighted k-Nearest Neighbor (KNN):** The algorithm is customized
    form of k-nearest neighbor. In this algorithm a kernel function is used to give
    weight [12] to the nearest k points. The principle is to assign the nearby points
    more weight and farther points less weight.


    +   **Support Vector Machine (SVM):** The algorithm divides the training data
    using hyper planes and then classifies the test data using these hyper planes.


    +   **Simple Tree:** A simple tree also known as decision tree in which nodes
    are connected like a flowchart. The internal nodes represent an attribute and
    the outcomes are represented as branches.'
  - '[PAGE 3]


    The Algorithm steps for the proposed system for Blood vessel and Exudates detection
    is stated below:


    +   Step 1. Input image from the user

    +   Step 2. Apply preprocessing steps on the image for the extraction of blood
    vessel.

    +     Step 2.1. Convert the image to green channel.

    +     Step 2.2. Compliment the resultant image.

    +     Step 2.3. Adjust the contrast of the image by histogram equalization.

    +     Step 2.4. Open the image.

    +     Step 2.5. Remove the optic disc.

    +     Step 2.6. Perform Thresholding and Binarization on the image.

    +     Step 2.7. Perform opening on the image.


    +   Step 3. Calculate and store the area and the perimeter of the blood vessel
    extracted.

    +   Step 4. Apply preprocessing steps on the image for the extraction of exudates.

    +     Step 4.1. Convert the image to green channel.

    +     Step 4.2. Perform Morphological closing on the image.

    +     Step 4.3. Column Filter the image.

    +     Step 4.4. Perform dilation then erosion on the image.

    +     Step 4.5. Remove the optic disc.


    +   Step 5. Calculate the area and perimeter of the exudates extracted and append
    the values to the above stored result.

    +   Step 6. Input the resultant data to the pre-trained algorithm cubic SVM, weighted
    KNN or Simple Tree (as chosen by the user) as a test data.

    +   Step 7. Output the data retrieved from the machine learning algorithm to the
    user.


    # IV. IMPLEMENTATION OUTPUT


    The proposed system uses MATLAB for image processing which will be used to feed
    images and extract various features from the images.


    # A. Database


    The database that is used for the system to train and test it, is DIARETDB0 and
    DIARETDB1. These images were captured in the Kuopio University Hospital. The database
    consists of 130 and 89 fundus images from DIARETDB0 and DIARETDB1 respectively
    out of which some images are of normal patients that does not show any symptoms
    of diabetic retinopathy and the rest are of the patients diagnosed with diabetic
    retinopathy. These images are trained and tested using MATLABR2019a.


    # B. Blood Vessel Extraction


    Blood vessel plays an important role in determining whether the patient is suffering
    from diabetic retinopathy or not. Diabetic Retinopathy cause the contraction of
    blood vessel, but just vessel contraction is not alone capable of determining
    whether the patient is affected or not. This is why other features like exudate,
    microaneurysms are also used to detect diabetic retinopathy.


    For determining whether the blood vessel has contracted or not the first step
    would be to extract the blood vessel from


    the given images. For blood vessel extraction, the steps which are used are described
    in the following figure, refer figure 3(A).


    # 1) Blood Vessel extraction Process:


    ![](img/dbca737b9377865a14c4b5d64041ef89_3_0.png)


    Fig. 3. Blood Vessels Extraction.


    The blood vessels are extracted from the retinal image for feature extraction.
    Refer figure 3(B) for the results. The values obtained after calculating the area
    and the perimeter features are written to a CSV file.


    # C. Exudates Extraction


    Figure 4 below shows the steps for exudates extraction. The detail explanation
    of each step is described below with their output shown in figure 5.


    ![](img/dbca737b9377865a14c4b5d64041ef89_3_1.png)


    Fig. 4. Exudates Extraction- Steps.'
  - '[PAGE 4]


    **Resize**: The original Image in the RGB plane is resized to a matrix of 376
    X 520 pixels, so that all the images are of a standard common size.

    **Green component extraction**: Green Component is extracted from the RGB image
    for better results.

    **Morphological Closing**: Dilation and erosion is performed on the image using
    a structuring element of radius 5 pixels. Refer figure 5(3).

    **Column filtering**: The image is processed by rearranging each 5 X 5 block of
    the image into a temporary matrix and then applying variance (@var) function on
    these blocks, using this, the background reduction becomes easier. Refer figure
    5(4).

    **Image dilation and erosion**: First dilation then erosion is performed on the
    image to join two nearby exudates into a single bigger exudate. Refer Figure 5(5).

    **Optical disk masking and subtraction**: Optical Disk is located and subtracted
    from the image. Refer figure 5(6).


    ![](img/dbca737b9377865a14c4b5d64041ef89_4_0.png)


    Fig. 5. Exudates Extraction – Output.


    # V. EXPERIMENTAL RESULTS


    The results that are obtained by passing the csv file obtained from the feature
    extraction step to the Classification Learner App that is inbuilt in MATLABR2015.
    The classification learner app in MATLAB takes a variable as an input in the form
    of predictor and response for the columns present in the table and trains the
    model according to the classifier selected and gives the accuracy of the classification
    algorithm. For this program Weighted KNN, Cubic Support Vector Machine (SVM) and
    Simple Tree were used to check the accuracy of the feature extraction methods.
    Using Weighted KNN algorithm, the overall accuracy obtained is 85.8% for exudates
    and blood vessel feature combination. The total number of images correctly classified
    overall is 188 out of 219. Table 1 represent percentage of classified images in
    DR and Normal categories:. This class depends on the following packages for its
    proper functioning.


    | Features | Correctly Classified Image (%) | Misclassified Image (%) |

    | :--- | :--- | :--- |

    | Exudates | 89.04 | 10.95 |

    | Blood Vessels | 85.39 | 14.6 |

    | Exudates and Blood Vessels | 85.84 | 14.16 |


    Using Cubic SVM algorithm, the overall accuracy obtained is 87.2%. The total number
    of images correctly classified overall are 191 out of 219.


    SVM give better results when both the features are used for classifying.


    | Features | Correctly Classified Image (%) | Misclassified Image (%) |

    | :--- | :--- | :--- |

    | Exudates | 77.17 | 25.11 |

    | Blood Vessels | 83.56 | 16.44 |

    | Exudates and Blood Vessels | 87.21 | 12.79 |


    Using Simple Tree algorithm, the overall accuracy obtained is 88.6%. The total
    number of images correctly classified overall are 194 out of 219. Simple Tree
    too, yields better results when both the features that is blood vessel and exudates
    are used to classify the images, although the difference is minimal.


    | Features | Correctly Classified Image (%) | Misclassified Image (%) |

    | :--- | :--- | :--- |

    | Exudates | 88.13 | 11.87 |

    | Blood Vessels | 88.13 | 11.87 |

    | Exudates and Blood Vessels | 88.58 | 11.42 |


    The following table 4 shows the accuracy results obtained using SVM, KNN and Simple
    Tree classification Algorithms for the proposed system.


    | Accuracy | Classification results for feature extracted |

    | :--- | :--- | :--- | :--- |

    | Classifiers | Exudates | Blood Vessels | Exudates and Blood Vessels |

    | Cubic SVM | 77.2% | 83.6% | 87.2% |

    | Weighted KNN | 89.0% | 85.4% | 85.8% |

    | Simple Tree | 88.1% | 88.1% | 88.6% |


    Based on the confusion matrix values for the all the three algorithms the sensitivity
    and specificity is calculated for combined feature set of exudates and blood vessel
    in table 5. The formula for sensitivity and specificity is given below.


    ```

    Sensitivity = TP / TP+FN

    Specificity = TN / TN+FP

    ```


    The sensitivity and specificity values show the effectiveness of proposed system.
    Simple tree yields sensitivity value of 98%.'
