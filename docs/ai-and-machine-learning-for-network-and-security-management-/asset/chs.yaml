  \nTP 代表检测到的异常日志数量。FP 代表被误分类为异常的正常日志数量。FN 表示被误分类为正常的异常日志数量。对于多类异常检测，我们计算了准确率、宏平均精确率（即所有类别的精确率平均值）、宏平均召回率（即所有类别的召回率平均值）以及宏平均\
  \ F1 分（即所有类别的 F1 分平均值）来评估我们的模型。\n\n### 7.4.3 基于深度学习的监督日志异常检测\n\n### 7.4.3.1 数据预处理\n\
  \n相同的异常可能发生在多个节点上，或者在同一个节点上发生多次。因此，BGL 和 Thunderbird 数据集中存在大量的重复日志。为了过滤重复日志，我们使用了\
  \ Oliner 和 Stearley (2007) 提出的过滤算法，该算法对数据分布的影响很小。过滤算法见算法 7.1。\n\n### 7.4.3.2 参数与设置\n\
  \n基于日志的序列是 HDFS 数据集的样本。单个日志是 BGL 和 Thunderbird 数据集的样本。我们使用随机梯度下降来优化模型，并将衰减设置为 0.0001，动量设置为\
  \ 0.9，学习率为 0.01。我们使用交叉熵损失函数。训练过程在 10 个 epoch 后停止。在日志向量化阶段，词嵌入将每个单词转换为 300 维向量。我们将区域大小设置为\
  \ 3，过滤器大小和过滤器数量设置为 900。我们将 batch size 设置为 10。实验基于 Keras 并运行在 NVIDIA GeForce GTX1060\
  \ 上。实验的硬件和软件环境见表 7.3 监督学习实验。\n\n| 名称 | 环境 | 版本 |\n| --- | --- | --- |\n| 操作系统 |\
  \ Ubuntu | 18.04.2 |\n| CPU 型 | Intel(R) Xeon(R) E5-2609 | v3 |\n| CPU 数量 | 2 |\
  \ |\n| 逻辑 CPU 数量 | 12 | |\n| GPU 型 | NVIDIA GeForce GTX1060 | |\n| GPU 内存 | 6GB\
  \ | |\n| 编程语言 | Python | 3.7 |\n| 深度学习 | Tensorflow | 2.3 |\n\n### 7.4.3.3 训练\n\n\
  过滤后，BGL 数据集中每个类别的日志数量见表 7.4。有 82 个“硬件”样本和 705 个“不确定”样本。B 数据集中不同类别的样本分布不均匀，因此 BGL\
  \ 数据集属于多类平衡日志数据。代价敏感学习适用于解决不平衡日志数据问题。它增加了少数类样本的误分类代价。我们将其应用于 LogRobust，改进的方法称为 Cosen–LogRobust。我们评估了\
  \ LogRobust、Cosen–LogRobust 和 AllRobust，实验结果见图 7.15。LogRobust 的准确率为 0.39，而 AllContext\
  \ 的准确率为 1.00。AllContext 可以显著减少多类平衡日志数据带来的负面影响，因为所提日志向量化阶段的 ![p Subscript i](img/c07-i0086.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msub><mrow>p</mi></mrow><mrow>i</mi></mrow></math>\
  \ 包含了足够的信息。Cosen–LogRobust 获得的准确率、精确率、召回率和 F1 分都在 0.80 以上。这表明代价敏感学习有效减少了不平衡日志带来的负面影响。然而，AllContext\
  \ 获得的准确率仍比 Cosen–LogRobust 高 20%![percent-sign](img/c07-i0087.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mi</mi></mrow></math>。此外，AllContext 获得的 F1 分比\
  \ Cosen–LogRobust 高 15%![percent-sign](img/c07-i0088.png)<math display=\"inline\"\
  \ overflow=\"scroll\"><mrow><mi</mi></mrow></math>。结果表明，对于从多类平衡日志数据学习，AllContext\
  \ 比现有的典型方法更有效。\n\n**表 7.4**](#c07.xhtml#R_c07-tbl-0004) 过滤后 BGL 数据集中每个类别的日志数量。\n\
