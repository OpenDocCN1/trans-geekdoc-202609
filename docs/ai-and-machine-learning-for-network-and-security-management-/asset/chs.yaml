  \n### 7.3.4 异常检测\n\n由日志向量化生成的向量表示作为分类器的输入。异常检测有两种典型情况：一种是基于单条日志的，另一种是基于日志序列的。对于前者，日志事件的向量表示可以直接作为分类器的输入。对于后者，序列中日志事件的向量表示需要先通过基于注意力机制的\
  \ `Bi‐LSTM` 进行处理。对于这两种情况，都采用 `softmax` 层来输出分类结果，包括二分类（即正常类和异常类）和多分类（即正常类和多个异常类）。训练过程中利用随机梯度下降法。经过训练的\
  \ `AllRobust` 能够检测单条日志或基于日志的序列中不平衡日志数据的异常。\n\n`LSTM` 神经网络主要用于解决长序列训练过程中的梯度消失和梯度爆炸问题。它能够捕捉序列的上下文信息，因为它属于人工神经网络的一类，其中节点之间的连接沿时间序列形成有向图（Zhang\
  \ 等，2019）。`LSTM` 包含输入层、隐藏神经元层和输出层。`Bi‐LSTM` 将隐藏神经元层分为两个方向：正向传播和反向传播，以捕捉输入日志序列充分的信息。基于注意力机制的\
  \ `Bi‐LSTM` 结构如图图 7.11。注意力机制（Brown 等，2018）能够为同一日志序列中的不同日志事件分配不同的权重。通过注意力机制，`Bi‐LSTM`\
  \ 可以更加关注重要的日志事件。![a](img/c07-i0045.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mrow><mi>a</mi></mrow></math> 的计算见式 7.5，其中 ![upper W Subscript i Superscript a](img/c07-i0046.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msubsup><mrow><mi>W</mi></mrow><mrow><mi>i</mi></mrow><mrow><mi>a</mi></mrow></msubsup></math>\
  \ 为时间步 ![i](img/c07-i0047.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>i</mi></mrow></math>\
  \ 处的注意力层权重。\n\n(7.5)![a Subscript i Baseline equals t a n h left-parenthesis upper\
  \ W Subscript i Superscript a ModifyingAbove h](img/c07-math-0005.png)<math display=\"\
  block\" overflow=\"scroll\"><mi>a</mi><msub><mrow><mi>i</mi></mrow></msub>=</mi>t</mi><mi>a</mi><mi>n</mi>\\\
