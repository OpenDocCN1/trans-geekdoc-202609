  \n\n\n\n\n由于四个数据集都是 HPC 日志数据，它们具有共同特征，因此可以相互作为辅助数据集。我们采用以下策略来组织实验数据。`BGL` 数据集包含丰富的异常类（41\
  \ 类），适合在元训练（meta-training）中将其组织成不同的元任务（meta-tasks）；因此，我们将 `BGL` 作为基础辅助数据集。然后，我们将\
  \ `Thunderbird`、`Liberty` 和 `Spirit` 数据集作为对比实验的目标数据集。例如，当使用 `Thunderbird` 数据集作为目标数据集时，我们将\
  \ `BGL`、`Liberty` 和 `Spirit` 数据集合并为一个包含 61 类异常类型的大型训练数据集，并随机选择 ![60 percent-sign](img/c08-i0126.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mn>60</mn><mi>%</mi></math> 的训练数据作为编码器训练集，其余的训练数据以及不同比例的目标数据集（`Thunderbird`）作为关系训练集。针对不同的实验，我们有不同的数据处理方法并构建不同的训练/测试数据集。我们还过滤了重复日志，因为数据集包含许多冗余日志模板。表\
  \ 8.1 总结了过滤后数据集的信息。\n\n**表 8.1**](#c08.xhtml#R_c08-tbl-0001) 数据集的详情。\n\n| 数据集 |\
  \ 总数 | 异常类大小 | 异常数量 | 过滤后的数据 |\n| --- | --- | --- | --- | --- |\n| BGL | 4 713 493\
  \ | 41 | 348 460 | 93 |\n| --- | --- | --- | --- | --- |\n| Thunderbird | 211 212 192\
  \ | 10 | 3 248 239 | 360 |\n| Liberty | 265 569 231 | 18 | 2452 | 746 |\n| Spirit\
  \ | 272 298 969 | 8 | 172 816 564 | 250 |\n\n在使用未知类数据的异常分类实验中，我们使用第 8.3.1.2 节描述的\
  \ `EDA` 方法来增强数据集，使数据集中的每个类包含 2000 个样本。然后，我们分别使用目标数据集中类大小的 ![25 percent-sign](img/c08-i0127.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mn>25</mn><mi>%</mi></math、![50 percent-sign](img/c08-i0128.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mn>50</mn><mi>%</mi></math、![75 percent-sign](img/c08-i0129.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mn>75</mn><mi>%</mi></math> 以及 ![100 percent-sign](img/c08-i0130.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mn>100</mn><mi>%</mi></math> 作为训练类，并使用训练类数据集的\
  \ ![80 percent-sign](img/c08-i0131.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mn>80</mn><mi>%</mi></math> 样本作为训练数据集，使用目标数据集中 ![20 percent-sign](img/c08-i0132.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mn>20</mn><mi>%</mi></math> 的样本作为测试数据，该测试数据包含模型未见过的（model-unseen）的异常样本。在这种实验设置下，我们评估了在存在未知类数据时不同方法的性能。在使用不平衡数据的异常分类实验中，我们使用如图\
  \ 8.13 所示的不平衡数据，并使用目标集中类大小的 ![100 percent-sign](img/c08-i0133.png)<math display=\"\
  inline\" overflow=\"scroll\"><mn>100</mn><mi>%</mi></math>。我们可以发现，某些数据类别占所有数据的 30%\
  \ 以上，而某些数据类别仅占总数据的 0.1% 以下。在某些类别中，例如图 8.13(c) 中 Spirit 数据集的 `R_EXT_CCISS`，样本数甚至少于\
  \ 10。在这种实验设置下，我们评估了在存在不平衡数据时不同方法的性能。在使用少样本（few-shot）数据的异常分类实验中，我们基于少样本学习的设置构建了一个实验数据集。每个类只有极少量的训练数据（5,\
  \ 10, 15, 20 个样本）。在这种实验设置下，我们评估了在存在少样本数据时不同方法的性能。\n\n![图 8.13 Thunderbird、Liberty\
  \ 和 Spirit 中原始不平衡日志的样本比例。(a) BGL, (b) Liberty, (c) Spirit.](img/c08f013.png)\n**图\
  \ 8.13**](#c08.xhtml#R_c08-fig-0013)\n\n![图 8.14 在 Thunderbird、Liberty 和 Spirit\
  \ 上相对于基线的评估评分对比。](img/c08f014.png)\n**图 8.14**](#c08.xhtml#R_c08-fig-0014)\n\n###\
  \ 8.4.3 针对未知数据的实验\n\n为了打破数据类别的闭环世界假设，并评估在“开放”环境下的异常分类方法的性能，新的异常类将持续出现。我们将训练数据和测试数据进行划分，并将目标数据集中\
  \ ![5 percent-sign](img/c08-i0134.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mn>5</mn><mi>%</mi></math、![25 percent-sign](img/c08-i0135.png)<math display=\"\
  inline\" overflow=\"scroll\"><mn>25</mn><mi>%</mi></math、![75 percent-sign](img/c08-i0136.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mn>75</mn><mi>%</mi></math> 以及 ![100 percent-sign](img/c08-i0137.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mn>100</mn><mi>%</mi></math> 的所有类设置为未见类（unseen\
  \ classes）。实验结果如图 8.14 所示。`LogClass` 的特征提取基于词袋模型（bag-of-words）和 TF-IDF 加权。`LogClass`\
  \ 需要构建一个全局索引词汇字典，并统计字典中每个词的频率。然而，新类可能会带来包含新词汇的新日志事件。许多关键词可能被置于相同的未知索引。实验结果表明，通过\
  \ `LogClass` 的特征提取方法丢失了许多对异常分类有用的特征。当训练数据的类大小比例低于 ![100 percent-sign](img/c08-i0138.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mn>100</mn><mi>%</mi></math> 时，`LogClass`\
  \ 在三个数据集上的性能得分较低。`LogRobust` 的特征提取基于词嵌入（word embedding），因此不容易受到日志变化的影响。但 `LogRobust`\
  \ 和 `LogClass` 都不具备检测未知类异常样本的能力，它们会将未知类样本误分类为错误的已见类。`OpenLog` 关注从辅助数据集学习的日志表示之间的比较，而不是基于大量数据的参数模型映射。因此，`OpenLog`\
  \ 获得了更好的得分，且几乎不受未见类的影响。\n\n\n\n\n\n[content]\n\n为了打破数据平衡的封闭世界假设，并在每类样本极度不平衡的开放环境中评估异常分类方法的性能，我们使用了三个数据集的原始数据比例。实验结果所示图\
  \ 8.15。基于深度学习的 `LogRobust` 对不平衡数据非常敏感。实验结果显示，`LogRobust` 获得的召回率（recall）、精确率（precision）和宏-F1\
  \ 分数远低于准确率（accuracy）。这是因为 `LogRobust` 对于包含足够训练数据的类别具有良好的分类能力，但对于样本较少的其他类别则表现不从心。基于\
  \ `SVM` 的 `logClass` 不易受到训练数据不平衡的影响，因为 `SVM` 的决策平面仅与少数关键支持向量有关。由于其特殊的数据采样策略，`OpenLog`\
  \ 完全不受数据不平衡的影响，并能保持稳定的性能。\n\n![图 8.15 在不平衡数据的异常分类中，Thunderbird、Liberty 和 Spirit\
  \ 与基准方法的评估评分对比。](img/c08f015.png)\n\n图 8.15 在不平衡数据的异常分类中，Thunderbird、Liberty 和 Spirit\
  \ 与基准方法的评估评分对比。\n\n### 8.4.5 少量样本数据实验\n\n为了打破数据规模的封闭世界假设，并在目标系统包含少量训练样本的“开放”环境中评估异常分类方法的性能。在我们的实验设置中，每类只有\
  \ 5、10、15、20 个样本。实验结果所示图 8.16。基于 `SVM` 的 `logClass` 是一种机器学习方法，其决策平面和预测结果仅与少数支持向量有关。这适用于在少量数据上进行训练。但每类中少量的训练数据无法为\
  \ `SVM` 获得更高性能提供足够的信息。可以通过将每类的训练数据从 5 个样本增加到 20 个样本来此改进。然而，基于深度学习的方法 `LogRobust`\
  \ 具有大量参数，需要根据对大量标记数据的训练进行优化。`LogRobust` 很难在少样本数据上工作，只能获得非常低的性能分数。基于充足的辅助数据集，`OpenLog`\
  \ 可以在少样本数据上保持稳定的性能。`OpenLog` 在从辅助数据采样的大量不同但相似的元任务（meta-tasks）上进行了充分训练，不受目标数据集中缺乏训练数据的限制。即使每类仅包含五个样本，`OpenLog`\
  \ 也能达到平均准确率和宏-F1 分数高于 90%。\n\n![图 8.16 在少样本数据的异常分类中，Thunderbird、Liberty 和 Spirit\
  \ 与基准方法的评估评分对比。](img/c08f016.png)\n\n图 8.16 在少样本数据的异常分类中，Thunderbird、Liberty 和 Spirit\
  \ 与基准方法的评估评分对比。\n\n## 8.5 讨论\n\n在本章中，我们提出了一种基于元学习（meta-learning）和少样本学习（few-shot\
  \ learning）的异常分类方法，并证明了所提方法的优势和有效性。然而，未来某些方面仍需改进。\n\n1. 元学习和少样本学习的思想可以为现有日志分析方法的某些瓶颈提供探索和发展方向。然而，由于元学习和少样本学习的特性，大多数方法属于监督学习，可以解决异常分类、故障诊断等问题，但对于其他无监督日志分析任务（例如相关性分析和故障预测）则更具困难。\n\
  \n2. 所提方法的原型模块基于度量学习（metric learning），即通过比较样本之间的关系，来实现对未知类别样本的分类和检测目的。这种策略方便、有效且灵活，但时间和计算成本会随数据规模的增加而增加。\n\
  \n3. 本章的实验基于有限的公共数据集，受限于数据集的格式和复杂性。如果在真实的工业数据集上进行更多实验，算法可以进一步扩展和改进。\n\n所提 `OpenLog`\
  \ 架构的组件可以用任何神经网络结构替换。例如，可以根据日志的结构选择编码器（encoder）。我们可以使用独立的 `CNN` 或循环神经网络（`RNN`），或者\
  \ NLP 中其他复杂的成熟模型，如 `TextCNN` (Kim, 2014) 和 `Transformer` (Vaswani et al., 2017b)。\n\
  \n## 8.6 结论\n\n大规模系统每天产生大量的日志数据。基于机器学习的智能日志分析不断被提出以确保大规模系统的稳定和可靠。在本章中，我们解决了大多数方法面临的三个问题和限制：(1)\
  \ 特征提取问题；(2) 少样本问题；(3) 封闭世界假设。在本章中，我们简要介绍了日志分析中的特征提取和少样本问题。然后，我们提出了一种基于元学习和少样本学习的通用异常分类方法来解决这些问题。对于特征提取问题，所提方法在编码器使用了两层深度学习来简化复杂的特征工程。对于少样本问题，该方法在充足的辅助数据集上训练模型。对于封闭世界假设，该方法将多分类任务转换为无需重新训练的二分类任务。大量的实验结果表明，`OpenLog`\
  \ 在未知类别数据、不平衡数据和少样本数据方面优于现有方法。\n\n## 参考文献\n\n1. Hanlin Cao, Haina Tang, Yulei Wu,\
