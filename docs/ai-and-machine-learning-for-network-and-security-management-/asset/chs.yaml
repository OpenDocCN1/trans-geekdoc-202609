  \ LightNet。](img/c06f003.png)\n\n图 6.3 数据集 A：LightNet 与三项基准模型在准确率、精确率、召回率和 F1 分数上的对比。(a)\
  \ 采用我们在第 6.4.2.1 节中说明的嵌入方法的 LightNet。(b) 像三个基准工作一样仅将数据包字节作为原始特征嵌入的 LightNet。\n\n\
  采用 `1D-CNN` 对流分类的模型由于结构过于简单而表现最差，因为它专注于提取数据包级特征。然而，这项工作启发了我们去探索一种端到端的流量分类方法。第二个基准模型\
  \ `CNN with LSTM` 利用了与我们模型中考虑的的数据包特征和流特征，其中 `CNN` 提取数据包级特征，`LSTM` 用于获取流级特征。实验结果显示，`LSTM`\
  \ 在提取流特征方面的效果不如多头注意力（multihead attention）。这是因为多头注意力归功于所有数据包的一次步交互以及所有子空间的并行计算。得益于多头注意力的使用，我们模型的一个关键优势是参数数量和运行时间显著减少。此外，我们的模型还可以受益于\
  \ `ResNet`、层归一化（layer normalization）和学习率上升的应用。`Bi-GRU` 模型优于其他两个基准，它利用注意力机制对重要特征分配更大的关注。与\
  \ `LSTM` 类似，`Bi-GRU` 模型只能处理两个数据包之间的交互。因此，由于额外的时间，等待 `RNN` 模型的输出耗时且效率低下。\n\n为了提高运行效率，我们采用了一些原则，可以总结为\
  \ (i) 轻量模块的重用，(ii) 多头并行计算（即子空间），以及 (iii) 多训练技术，如 `ResNet`、层归一化和学习率上升。`LightNet`\
  \ 受益于上述原则。`LightNet` 的参数数量是 `1D-CNN` 的 1.8%、`CNN with LSTM` 的 2.7% 以及 `Bi-GRU` 的\
  \ 19.8%。在时间效率方面，每 100 个批次的训练和测试时间作为指标。`LightNet` 的训练时间是 `1D-CNN` 的 44.0%、`CNN with\
  \ LSTM` 的 5.7% 以及 `Bi-GRU` 的 33.7%。需要注意的是，`LSTM` 和 `Bi-GRU` 也可以用于提取流级特征，但 `LSTM`\
  \ 只有两个相邻数据包可以进行交互，这导致了高时间消耗。\n\n#### 6.5.4.2 在数据集 B 上评估\n\n为了使结果更有说力，我们像对数据集 A 那样，在数据集\
  \ B 上进行了准确率、精确率、召回率和 F1 分数的实验。如图 6.4 所示，`LightNet` 的准确率、精确率、召回率和 F1 分数分别达到 96.84%、95.98%、95.53%\
  \ 和 95.75%。与 `1D-CNN`、`CNN with LSTM` 和 `Bi-GRU` 模型相比，F1 分数提升了 10.22%、3.85% 和 1.49%，进一步证明了我们的模型对于加密流量表现良好。\n\
