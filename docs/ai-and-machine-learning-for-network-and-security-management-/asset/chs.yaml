  \ 10.1109/TCCN.2020.296615.\n\n## Notes\n\n1. [`github.com/IQTLabs/poseidon`](https://github.com/IQTLabs/poseidon)\n\
  2. [`github.com/IQTLabs/NetworkML`](https://github.com/IQTLabs/NetworkML)\n3. [`github.com/SAP/credential-digger`](https://github.com/SAP/credential-digger)\n\
  4. [`github.com/Trusted-AI/adversarial-robustness-toolbox`](https://github.com/Trusted-AI/adversarial-robustness-toolbox)\n\
  5. [`github.com/MISP/MISP`](https://github.com/MISP/MISP)\n6. [`github.com/OpenCTI-Platform/opencti`](https://github.com/OpenCTI-Platform/opencti)\n\
  7. [`www.com/phishtank.com/`](https://www.phishtank.com/)\n\n\n\n\n如今，网络承载了大量与重要领域相关的应用程序，如政府服务、在线支付、直播、虚拟现实、增强现实等。由于对性能的要求极高，网络和服务供应商向网络提出意图（intents），希望网络通过部署网络策略来满足其需求（Ujcich\
  \ et al., 2020, Szyrkowiec et al., 2018）。从网络的角度来看，它根据不同的服务级别优先考虑应用的意图，并尽可能实现低服务级别应用的意图。从应用的角度来看，它希望其网络意图能够及时准确地实现。为了协调网络与应用之间的矛盾，互联网服务供应商和云供应商增加了设备投资，聘用了更多的服务维护人员，或设计了复杂的调度算法。然而，这导致了更复杂的网络架构和应用程序不可预测的行为。\n\
  \n网络应用程序可以是简单的路径选择任务（Hassani et al., 2020），也可以是复杂的计算卸载任务（Xia et al., 2014）。网络环境可以是静态局域网，也可以是动态边缘网络。当简单的网络任务运行在静态网络环境中时，任务的行为符合意图，且通常是可预测的。当复杂的网络任务在动态且变化的网络环境中运行时，网络任务的行为往往是不可预测的，因此我们需要做额外的工作来确定网络任务的行为是否与操作者的意图一致。例如，当移动设备将任务卸载到边缘网络时，期望这些任务能够实现最低延迟和最高完成率。然而，网络环境往往由于设备的移动而变化，导致网络无法继续提供足够的资源。不可避免的是，必须牺牲任务完成率以确保低延迟。这导致任务状态与操作者的意图不一致。当任务更加复杂且网络环境随时间变化时，矛盾变得更加突出，例如在\
  \ 5G 网络中（Saha et al., 2016）。\n\n为了应对一系列新挑战，例如应用的意图可能无法准确实现，且网络任务的行为不可预测，有必要提出能够自动推断网络行为意图的自动化解决方案。这有利于判断意图是否与操作者的意图一致。网络应用程序的行为意图是抽象的，它们独立于特定的网络环境，例如寻找最短路径。它们在不同的网络环境之间是可以迁移的。\n\
  \n自动化解决方案的第一步是从网络测量数据中推断网络行为的意图。例如，对于车联网的任务卸载（Sonmez et al., 2021），有多种卸载策略来实现不同类型不同的优化目标。推断其意图并非易事。即使是一个简单的网络应用程序，例如在两点之间寻找连通且无环的路径，也隐含两个意图：一个是连通性，另一个是无环性。网络行为包含多个意图是非常常见的。为了充分揭示网络行为的意图，意图的表示方法应该是由多个原子意图组成的结构化模型。\n\
  \n这个问题可以从符号主义（symbolism）中获得很大启发。有意义符号符号具有特定实际意义的抽象概念。某些概念可以视为意图，并广泛应用于不同的任务和环境中以形成新概念。例如，对于“连通性”和“最短”概念，它们可以组合成“寻找最短路径”的概念。如果我们能从测量数据中学习表示意图的基本符号，通过这些符号的组合，我们就可以得到表示有意义网络行为意图的结构化表达式。\n\
  \n弄清楚什么是符号以及它如何表达概念是非常重要的。英国学者 Charles Kay Ogden 和 Ivor Armstrong Richards 在 1923\
  \ 年的重要语义学著作《意义的意义》（The Meaning of Meaning）中提出了语义三角形（Odgen and Richards, 1923）。该理论涉及符号、概念和客观实体之间的相互限制和相互。如图\
  \ 3.1 所示，语义三角形包含以下含义：(i) 概念/指称与实体/指物之间存在实线连接。概念是在客观实体的基础上泛化的，这意味着一个概念指的是一个实体。(ii)\
  \ 概念/指称与符号之间也有实线连接。概念通过符号表达，这意味着符号象征着一个概念。(iii) 符号与实体/指物之间是虚线连接。符号代表实体/指物，两者之间没有内在的必然联系。例如，我们可以使用符号\
  \ ![upper L](img/c03-i0001.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>L</mi></mrow></math>或其他符号来表示链路。链路的概念及其作用会在网络和服务操作者的脑海中出现，这就是语义三角形中的概念/指称。语义三角形中的实体/指物是现实中特定网络的链路。\n\
  \n![图 3.1 语义三角形](img/c03f001.png)\n\n**图 3.1** 语义三角形。\n\n\n\n\n如图 3.3 的左侧所示，符号 ![upper\
  \ A](img/c03-i0002.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>A</mi></mrow></math>\
  \ 用于表示连通性概念，它由包含三个随机变量的随机向量描述：![mu](img/c03-i0003.png)<math display=\"inline\" overflow=\"\
  scroll\"><mrow><mi>&#956;</mi></mrow></math>, ![upsilon](img/c03-i0004.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>&#965;</mi></mrow></math>, 以及\
  \ ![eta](img/c03-i0005.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>&#951;</mi></mrow></math>。第一个变量代表上一次选择链路，第二个变量表示下一个要选择的链路，第三个变量表示两个变量之间\
  \ ![mu](img/c03-i0006.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>&#956;</mi></mrow></math>\
  \ 与 ![upsilon](img/c03-i0007.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>&#965;</mi></mrow></math>\
  \ 的关系。如图 3.3 的右侧所示，![normal upper Phi 0](img/c03-i0008.png)<math display=\"inline\"\
  \ overflow=\"scroll\"><msub><mi mathvariant=\"normal\">&#934;</mi><mn>0</mn></msub></math>\
  \ 和 ![normal upper Phi 1](img/c03-i0009.png)<math display=\"inline\" overflow=\"\
  scroll\"><msub><mi mathvariant=\"normal\">&#934;</mi><mn>1</mn></msub></math> 代表链路的两个节点。直观上，我们知道为了确保下一个选择的链路与当前路径连接，上一次选择链路的\
  \ ![normal upper Phi 1](img/c03-i0010.png)<math display=\"inline\" overflow=\"scroll\"\
  ><msub><mi mathvariant=\"normal\">&#934;</mi><mn>1</mn></msub></math> 和下一个链路的 ![normal\
  \ upper Phi 0](img/c03-i0011.png)<math display=\"inline\" overflow=\"scroll\"><msub><mi\
  \ mathvariant=\"normal\">&#934;</mi><mn>0</mn></msub></math> 必须相等，这意味着它们连接到同一个交换机。因此，在图\
  \ 3.3 的左侧，根据它们的概率分布，连通性概念的三个随机变量最有可能采样为“![normal upper Phi 1](img/c03-i0012.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msub><mi mathvariant=\"normal\">&#934;</mi><mn>1</mn></msub></math>”、“![normal\
  \ upper Phi 0](img/c03-i0013.png)<math display=\"inline\" overflow=\"scroll\"><msub><mi\
  \ mathvariant=\"normal\">&#934;</mi><mn>0</mn></msub></math>”和“![equals](img/c03-i0014.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mo>=</mo></mrow></math>”。以上是关于利用意图符号语义三角形理论从随机向量的角度描述连通性意图概念。\n\
  \n![图 3.3 意图符号语义示例。](img/c03f003.png)\n\n**图 3.3**](#c03.xhtml#R_c03-fig-0003) 意图符号语义示例。\n\
  \n意图符号语义理论定义了符号、概念与实例化实体之间的关系。在本章的剩余部分中，我们将关注从统计学习的角度推断意图符号，以及这些符号构成了什么样的结构来完整描述网络行为的意图。最后，我们将介绍符号结构是如何具有迁移性的。\n\
  \n## 3.2 动机\n\n在实现自动化网络管理的道路上，人工为工具配备各种网络管理意图是低效且不可行的。人工意图要么过于抽象而不具备直接执行的能力，要么要求用户具备全面的网络知识来表达正确的意图。本章利用网络应用的行为数据来探索从数据中挖掘意图并使用符号表达意图的方法。这是一个值得探索的方向。这些符号可以形成一个结构来表达完整的意图。它们可以取代人工管理意图。意图符号语义理论指导网络意图的推断。网络意图的推断转化为拟合符号表示的概率分布的问题。其动机在于解决两个重要问题：一是网络意图的推断。它不仅能让网络运营商判断当前网络行为是否满足要求，还能学习网络基础知识，为自动表达网络意图提供基础。二是解决使用符号表达意图的计算问题。将意图表达为概率分布。\n\
  \n## 3.3 意图符号推断的分层表示与学习框架\n\n本节将以路径选择任务为例，解释如何使用我们设计的框架通过数据推断网络应用的意图并将其表示为符号结构。提出的框架包含两个部分：符号学习（SSL）和符号结构推断（SSI）。SSL\
  \ 是关于学习，SSI 是关于推断意图的结构。SSL 和 SSI 将详细介绍。\n\n### 3.3.1 符号学习 (SSL)\n\n推断意图符号的前提是根据先验知识判断符号的存在。以路径选择为例，根据网络管理的先验知识，我们可以直观地判断任务具有三个位置。我们分别使用符号\
  \ ![A](img/c03-i0015.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>A</mi></mrow></math>,\
  \ ![B](img/c03-i0016.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>B</mi></mrow></math>\
  \ 和 ![C](img/c03-i0017.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>C</mi></mrow></math>。路径必须满足连通性，如图\
  \ 3.4 所示，表示连通性意图的 ![A](img/c03-i0018.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mrow><mi>A</mi></mrow></math> 出现在灰色框中。这意味着只有当两个链路连接到同一个交换机时，才能满足连通性。此外，路径还需要满足死锁免费意图，如图\
  \ 3.5 所示，表示死锁免费意图的 ![B](img/c03-i0019.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mrow><mi>B</mi></mrow></math> 出现在灰色框中。这意味着路径需要避免环路。最后，有一个关于性能的意图。例如，路径需要最短或由确定性延迟保证。如图\
  \ 3.6 所示，表示路径性能意图的 ![C](img/c03-i0020.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mrow><mi>C</mi></mrow></math> 出现在灰色部分。\n\n![图 3.4 连通性意图符号。](img/c03f004.png)\n\
  \n**图 3.4**](#c03.xhtml#R_c03-fig-0004) 连通性意图符号。\n\n![图 3.5 死锁免费意图符号。](img/c03f005.png)\n\
  \n**图 3.5**](#c03.xhtml#R_c03-fig-0005) 死锁免费意图符号。\n\n![图 3.6 完整路径意图符号。](img/c03f006.png)\n\
  \n**图 3.6**](#c03.xhtml#R_c03-fig-0006) 完整路径意图符号。\n\n以上是符号推断的第一步，即利用先验知识判断网络任务可能的意图。这是通过操作者的先验知识对可能的意图符号的一种初步判断。它也可以由人工智能（AI）来确定，这是一个未解决的问题。\n\
  \n\n\n\n\n### 3.3.1.1 连通意图\n\n第 3.1 节中提到的意图符号三角形理论提出，每个意图符号都需要被赋予一个随机向量来表示其含义。随机向量的每个元素都是一个随机变量。符号\
  \ ![upper A](img/c03-i0021.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>A</mi></mrow></math>\
  \ 表示连通性发生在两条链路之间，因此它被赋予了一个长度为三的随机向量。第一个和第二个随机变量分别代表两条链路，第三个随机变量表示这两条链路之间的关系。我们将它们分别标记为\
  \ ![mu Subscript a](img/c03-i0022.png)<math display=\"inline\" overflow=\"scroll\"\
  ><msub><mi>&#956;</mi><mi>a</mi></msub></math>`, ![upsilon Subscript a](img/c03-i0023.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msub><mi>&#965;</mi><mi>a</mi></msub></math>`,\
  \ ![eta Subscript a](img/c03-i0024.png)<math display=\"inline\" overflow=\"scroll\"\
  ><msub><mi>&#951;</mi><mi>a</mi></msub></math>`。\n\n在大多数情况下，意图是对一个或多个属性状态的描述。例如，最短路径是对路径长度属性的描述；确定性延迟保证是对延迟的描述；无死锁路径是对路径所经过节点的描述。因此，带有意图符号的随机变量的采样范围是属性是一个自然且合理的想法。路径选择涉及的网络属性包括节点索引。一条链路由两端的节点索引来描述，分别标记为\
  \ ![phi 0](img/c03-i0025.png)<math display=\"inline\" overflow=\"scroll\"><msub><mi>&#966;</mi><mn>0</mn></msub></math>\
  \ 和 ![phi 1](img/c03-i0026.png)<math display=\"inline\" overflow=\"scroll\"><msub><mi>&#966;</mi><mn>1</mn></msub></math>。这两个符号的幂集可以视为随机变量\
  \ ![mu Subscript a](img/c03-i0027.png)<math display=\"inline\" overflow=\"scroll\"\
  ><msub><mi>&#956;</mi><mi>a</mi></msub></math> 和 ![upsilon Subscript a](img/c03-i0028.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msub><mi>&#965;</mi><mi>a</mi></msub></math>`\
  \ 的采样范围。换句话说，![mu Subscript a](img/c03-i0029.png)<math display=\"inline\" overflow=\"\
  scroll\"><msub><mi>&#956;</mi><mi>a</mi></msub></math> 和 ![upsilon Subscript a](img/c03-i0030.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msub><mi>&#965;</mi><mi>a</mi></msub></math>`\
  \ 的可能值是符号集合作为元素的集合：![left-parenthesis phi 0 right-parenthesis](img/c03-i0031.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mfenced open=\"(\" close=\")\" separators=\"\
  \"><mrow><msub><mi>&#966;</mi><mn>0</mn></msub></mrow></mfenced></math>`, ![left-parenthesis\
  \ phi 1 right-parenthesis](img/c03-i0032.png)<math display=\"inline\" overflow=\"\
  scroll\"><mfenced open=\"(\" close=\")\" separators=\"\"><mrow><msub><mi>&#966;</mi><mn>1</mn></msub></mrow></mfenced></math>`,\
  \ ![left-parenthesis phi 0 comma phi1 right-parenthesis](img/c03-i0033.png)<math\
