  \ 数据安全\n\n信息安全或数据安全具有两个相互相反的含义：一个是数据本身的安全，主要指采用现代加密算法对数据进行主动保护，例如数据机密性、数据完整性和强双向认证。其次是数据保护的安全，主要指使用现代信息存储手段对数据进行主动保护，例如通过磁盘阵列、数据备份和灾备等手段确保数据安全。数据安全是一项主动措施。数据本身的安全必须基于可靠的加密算法和安全系统，主要包括对称算法和公钥加密。通常情况下，运维安全涵盖了访问控制、认证与授权、备份、加密、传输和存储。表\
  \ 10.8 介绍了几个开源数据安全相关工具。\n\n表 10.8 数据安全相关工具。\n\n| 名称 | 语言 | 链接 | 描述 |\n| --- | ---\
  \ | --- | --- |\n| tor | C | [`github.com/torproject/tor`](https://github.com/torproject/tor)\
  \ | Tor 通过隐藏互联网地址与用户使用的服务之间的连接来保护互联网隐私。 |\n| TrueCrypt | C,C++ | [`github.com/FreeApophis/TrueCrypt`](https://github.com/FreeApophis/TrueCrypt)\
  \ | 磁盘加密系统 TrueCrypt 允许使用两层访问控制进行分层内容加密。 |\n| Gitrob | Go | [`github.com/michenriksen/gitrob`](https://github.com/michenriksen/gitrob)\
  \ | Gitrob 是一个帮助发现推送到 Github 公共仓库的潜在敏感文件的工具。 |\n| DeepViolet | java | [`github.com/spoofzu/DeepViolet`](https://github.com/spoofzu/DeepViolet)\
  \ | DeepViolet 是用 Java 编写的 TLS/SSL 扫描 API。 |\n\n### 10.3.3 总结\n\n本节调查并介绍了各种开源安全相关工具，并根据不同的功能对其进行了分类。然而，安全工具并不限于少数几个类别，随着新攻击的出现，新的防御手段会不断产生。在信息层面，应当保证信息的机密性、完整性和可用性。在应用层面，运维人员需要确保系统、信息和人员的安全。运维安全操作通常分为四个步骤：保护、检测、响应和恢复。通常来说，防御者始终处于被动防御位置。在同等级别的攻防双方之间，防御方可以建立防御面，但攻击者只需要突破一个攻击点。要防御同等级别的攻击，防御成本是巨大的；而在不同层级的攻防双方之间，它们是相互独立的。\n\
  \n此外，随着安全防御系统的不断完善，安全设备和系统工具持续增加，企业安全管理逐渐显现一些问题。例如，不同设备之间缺乏互操作性，无法有效协作；不同的安全系统之间是相互独立的。它们主要防御某一类或某种类型的安全攻击。管理者缺乏整个系统的防御视图。安全运营中心（SOC,\
  \ (SOC, 2022)）将单防系统集成到一个系统中，使运维人员能够通过 `SOC` 监控企业网络的整体安全状态。未来，工作应转向安全工具的管理与协调、实时防御、潜在攻击检测以及漏洞的实时更新。同时，安全运维也应顺应业务的发展。服务正变得容器化、云端化和分布式。随着新技术的引入，安全问题也随之产生。安全系统是一个逐渐积累和修复的过程，随着新技术和新框架的出现，往往需要新的安全相关工具。\n\
  \n## 10.4 AIOps\n\n### 10.4.1 引言\n\nAIOps 指智能运维。其目标是通过先进的机器学习技术，进一步解决第 10.2 节）。\n\
  \nAIOps 不依赖于人工指定的规则，而是提倡机器学习算法应该能够从海量的运维数据（包括日志、监控信息、应用信息等）中自动学习，并不断完善和总结规则。在自动运维的基础上，AIOps\
  \ 增加了一个基于机器学习的“大脑”。命令和监控系统收集大脑决策所需的数据，进行分析和决策，并指导自动脚本执行大脑决策，从而实现运维系统的整体目标。\n\n如今，许多组织正在从传统的独立静态物理系统基础设施转向内部的托管云、私有云和公有云的动态组合，这些环境运行在不断扩展和重构的虚拟化或软件定义资源上。这些环境中产生的数据持续增长。事实上，Gartner\
  \ 估计企业 IT 基础设施每年生成的 IT 运维数据增加了两到三倍。传统的 IT 管理解决方案无法满足这种激增的数据需求。它们无法利用可用数据智能地分类重要事件；无法关联不同相互依赖环境的数据。此外，它们无法提供\
  \ IT 运维团队快速响应以满足用户和服务水平预期所需的实时洞察和预测分析。AIOps 的引入提供了跨环境性能数据和依赖的可视化，分析数据以提取与延迟或宕机相关的事件，并自动向\
  \ IT 员工告警问题、根因和建议方案。简单来说，AIOps 希望通过先进的机器学习技术进一步解决以往运维工具无法解决的问题。\n\n### 10.4.2 开源\
  \ AIOps 与算法\n\n在《AIOps 白皮书》（DCA, 2018）中，AI 有三种常见的应用场景：\n\n-   质量保障方面，确保生产网络稳定运行分为异常检测、故障诊断、故障预测和故障自愈等基础场景。\n\
  -   成本管理方面，分为指标监控、异常检测、资源优化、容量规划、性能优化等基础场景。\n-   效率提升方面，分为智能预测、智能变更、智能问答、智能决策等基础场景。\n\
