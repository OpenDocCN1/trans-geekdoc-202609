  \ Liu 等（2018）提出的先进方法。该过程可以总结为：i) 获取服务器名称指示（SNI）值，它是应用程序的域名字符串；(ii) 将 IP 解析与 SNI\
  \ 字段进行比较以增强可靠性；(iii) 如果 SNI 字段为空或无法 解析为域名，则丢弃该流。\n\n\n\n\n\n如上所述，本文探索了一种新的数据包表示嵌入方法，该方法可以增强高阶特征提取的效率。统计特征（例如数据包长度数据包位置）和数据包字节特征被均匀地嵌入向量中以表示数据包。在三项对比基准工作中，数据包字节是作为模型输入的唯一原始特征。如图\
  \ 6.3 所示，我们在数据集 A 上对两种嵌入方法进行了对比实验。实验结果通过 10 折交叉验证生成。如图 6.3a 所示，当采用我们在第 6.4.2.1 节中说明的嵌入方法时，显然我们的模型在所有指标上都优于基准模型。准确率、精确率、召回率和\
  \ F1 分数分别达到 99.76%、98.84%、98.74% 和 98.79%。与 1D-CNN、CNN with LSTM 和 Bi-GRU 模型相比，F1\
  \ 分数提升了 15.01%、2.89% 和 1.38%，证明了我们模型的卓越性能。如图 6.3b 所示，当像三个基准工作那样仅将数据包字节作为原始特征嵌入时，由于可用信息减少，所有模型的性能都会下降。实验结果表明，我们的嵌入方法将\
  \ `LightNet` 的精确率提高了 1.7%。总而言之，当应用我们提出的嵌入方法时，模型表现更好。\n\n![图 6.3 数据集 A：LightNet 与三项基准模型在准确率、精确率、召回率和\
