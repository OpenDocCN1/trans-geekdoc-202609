  \ AIOps 的应用，本节主要梳理了与异常检测相关的系统和算法。开源 AIOps 系统见表 10.9。同时，为了实现成本管理、效率提升和质量保证场景，AIOps\
  \ 产品或平台应包含以下元素：\n\n- 数据源：它们是大型且多样化的 IT 基础设施。\n- 大数据平台：用于处理历史和实时数据。\n- 计算与分析：从现有的\
  \ IT 数据中生成新数据，例如数据清洗。\n- 算法：用于计算和分析以产生所需的结果。这通常指无监督学习，它可以生成新的算法。\n\n### 10.4.2.2\
  \ Metis\n\nMetis (2022) 以希腊智慧女神命名，是 AIOps 领域应用实践的集合。它主要解决质量、效率和成本方面的智能运维问题。当前版本的开源时间序列异常检测软件从机器学习的角度解决了时间序列数据的异常检测问题。时间序列异常检测软件的思想是基于统计决策、无监督和监督学习对时间序列进行联合检测。统计决策和无监督算法用于初级决策以输出疑似异常，随后通过监督模型决策获取最终检测结果。检测模型通过大量样本训练生成，并可以通过持续训练进行更新。时间序列异常检测工具包的架构如图\
  \ 10.4](#c10.xhtml#c10-fig-0004）所示，可分为五层：\n\n- 数据层 (`DB`)：存储检测异常信息、样本以及任务任务。\n-\
  \ SERVICE 层：分为两个模块。数据驱动模块 DAO 封装了与 DB 层的常用数据操作接口。业务模块服务实现了接口层的特定业务逻辑。\n- LEARNWARE\
  \ 层：分为三个模块。\n    - `Detect`：提供时间序列异常检测接口。\n    - `Features`：提供三种时间序列（统计特征、拟合特征、分类特征）用于时间序列数据的特征提取。\n\
  \    - `Algorithm`：提供若干常用的机器学习算法包（统计判定算法、指数移动平均算法、多项式算法、GBDT 和 XGBoost 算法等），用于序列数据的联合裁定检测。\n\
  \n\n\n\n\n- 接口层 (API)。它提供 API 能力、时间序异常检测接口以及 WEB 管理操作接口。\n- WEB 层 (WEB)。系统提供 WEB\
  \ 服务。通过服务接口，用户可以执行异常查询、标记、样本数据库管理和模型训练等操作。\n\n![图 10.4 metis 代码结构。](img/c10f004.png)\n\
  \n`图 10.4` metis 代码结构。\n\n在 metis 中，学习器的应用位置如图图 10.5 所示。学习组件可以连接到异常检测 API。它提供了率值检测和量值检测\
  \ API 接口来检测时间序，也可以连接到支持学习组件进行时间序异常检测的学习组件系统。\n\n- 特征提取。它提供了三类型特征（统计特征、拟合特征和分类特征）的提取函数，特征维度超过\
  \ 90。它支持添加自定义特征。\n- 异常查询。由 API 检测的时间序（仅异常）存储在库中，提供管理功能、分页查询、检索、缩放等。\n- 标记。它提供标记功能，支持正正负样本的标记/取消标记，标记后的样本将自动转移到样本库。\n\
  - 样本管理。它提供样本管理功能，如检索、图形化表示、编辑、删除、导入等。\n- 模型管理。它提供模型管理功能并支持自定义模型训练。\n\n![图 10.5 metis\
  \ 时间序检测器。](img/c10f005.png)\n\n`图 10.5` metis 时间序检测器。\n\n#### 10.4.2.3 UAVStack\n\
  \nUAVStack (`UAVStack`, 2022) 是一种智能服务栈，是一种运维一体化的解决方案。它包含了任务机器人 (`CODE HIT`)、全维度监控\
  \ (`UAV.monitor`)、应用性能管理 (`UAV.APM`)、服务治理 (`UAV.ServiceGovern`)、微服务计算 (`UAV.MSCP`)、用户体验管理\
  \ (`UAV.UEM`) 等。UAVStack 的核心内容由以下部分组成。\n\n- 健康管理服务 (`HealthManager`, 简称为 `HM`)。HM\
  \ 是一个集成了实时数据处理、画像数据处理、实时告警数据处理、日志数据处理等服务的的服务中心。它负责 UAVStack 中各种数据的计算和处理并支持相关服务。`HM`\
  \ 的结构如图图 10.6 所示。\n- MonitorAgent (简称为 `MA`)。MA 是一个用于解耦并在应用程序外部独立运行的代理。MA 用于定期捕获\
  \ `MOF` 中的信息，自动发现 Tomcat、`MSCP` 和 `JavaEE` 中的信息，并获取更多派生的监控信息。`MA` 中的数据随后通过 `Rocketmq`\
  \ 到达 `HealthManager`。`MA` 从两个部分获取值：一个是 `MonitorFramework` 埋在 `J2EE` 项目中的点；另一个是系统。\n\
  - 中间件增强 MonitorFramework (`MOF` 探针)。它与 `JEE` 和其他中间件框架集成，实现非侵入式应用监控。它使用 `Java agent`\
  \ 机制提供应用映射和性能数据采集。\n\n![图 10.6 UAVStack HM 结构。](img/c10f006.png)\n\n`图 10.6` UAVStack\
  \ HM 结构。\n\n#### 10.4.2.4 Skyline\n\nSkyline (`AnOmalY`, 2022) 是一种近实时异常检测系统，旨在被动监控数十万个指标，而无需像\
  \ Nagios 那样为每个指标配置模型/阈值。Skyline 主要用于用于持续监控的大型高分辨率时间序。一旦设置了指标流（来自 `StatsD` 或 `Graphite`\
  \ 或其他源），其他指标会自动添加到 Skyline 进行分析。Skyline 简单且可扩展的算法可用于自动检测。一旦检测到指标异常，整个时间序将扩展到 `WebApp`\
  \ 以检查异常位置并采取行动。Skyline 内部由三个组件组成：Horizon、Analyzer 和 Webapp。Horizon 接收外部数据点，将它们转发到\
  \ `Redis`，并从 `Redis` 中移除过时数据点（数据点指的是特定时刻的数据，包括时间戳和值）。Analyzer 从 `Redis` 获取指标数据并使用算法判断其是否异常。最后，WebApp\
  \ 为异常绘制指标图表。Skyline 的简单工作流如图图 10.7 所示。\n\n- Horizon 是 Skyline 的数据采集器，由 Listener、Worker\
  \ 和 Roomba 组成。Listener 接收外部数据，启动了两种类型的 Listener：`TCP` 和 `UDP`。它们使用不同的应用层协议。Worker\
  \ 负责处理 `Queue` 中的 `Chunk`。Horizon 启动时会创建 `WORKER_PROCESSES` 进程，持续从 `Queue` 中取出 `Chunk`\
  \ 并通过 `MSgPack` 序列化 `Chunk`，添加到对应的 `Redis` 队列。Roomba 负责清理 `Redis` 中每个时间序的旧数据点，仅保留最新数据以确保\
  \ `Redis` 不溢。\n- Horizon 处理后，多个时间序已保存在 `Redis` 中，Analyzer 负责分析它们并使用算法判断是否异常。Analyzer\
  \ 也是一个与 Roomba 工作方式类似的线程。一旦启动，`ANALYZER_PROCESSES` 进程将被创建并平均分配 `FULL_NAMESPACE`\
  \ 下的所有时间序。每个时间序被输入 `Algorithms` 模块判断是否异常，并返回异常 `Datapoint` 报告算法。算法是判断的核心。Skyline\
  \ 有九种内置算法用于判断点序列是否异常。用户可以根据应用的特性（`ALGORITHMS` 配置项）配置使用的算法，或自定义判断算法。\n- Webapp 基于\
  \ `Flask` 框架提供异常指标图，这是一个相对简单的模块。基本原理是轮询后台的 `json`，获取异常指标名称和对应的异常数据点，然后根据指标名称从后台请求时间序序列（包括\
  \ `FULL/name MINIspace`），并在图中显示。\n\n![图 10.7 Skyline 简单工作流。 ¶ Source: https://earthgecko-skyline.readthedocs.io/en/latest/_images/skyline.simplified.workflow.annotated.gif.](img/c10f007.png)\n\
  \n`图 10.7` Skyline 简单工作流。 ¶ Source: 基于 [`earthgecko-skyline.readthedocs.io/en/latest/_images/skyline.simplified.workflow.annotated.gif`](https://earthgecko-skyline.readthedocs.io/en/latest/_images/skyline.simplified.workflow.annotated.gif)。\n\
  \n### 10.4.3 总结\n\n\n\n\n\n本节介绍了 AIOps 现有的开源系统和前沿算法。随着支持数字世界的硬件和软件系统变得日益庞大复杂，智能运维的要求将越来越高。AIOps\
  \ 是运维技术发展的必然趋势。随着行业的发展，AIOps 最终将扩展到使用互联网技术的公司。“产、学、研、用”各方也都在积极跟进，并最终将形成一个完整的 AIOps\
  \ 生态系统，通过不同的专业分工和协作来促进 AIOps 的快速落地。\n\n与此同时，算法的核心是数据。为了提供更全面的运维系统并让 AI 在运维中发挥更大的作用，全面且多样化的数据采集至关重要。需要从系统中提取对运维最有用的信息，帮助运维人员理解数据中心最新、最完整的运行状态，并为\
  \ AIOps 场景提供服务。算法分析不同场景下不同维度的数据，算法的应用也更加精细化。因此，有必要针对特定的精细化场景适当调整 AIOps 异常检测算法。因此，AIOps\
  \ 算法正朝着数据多样化、精细化和算法场景多样化的方向发展。AIOps 的最终目标是实现全自动化和智能化的系统运维，即智能运维系统完全接管人类工作，并独立实现可用性、成本和效率的优化。目前，AIOps\
  \ 覆盖运维系统的整个领域，距离完全智能化还有很长的路要走。\n\n## 10.5 基于机器学习的网络安全监控与管理系统\n\n各种开源系统提供了系列工具来完成特定的数据采集、监控、告警和数据处理功能，但这些工具仅关注自身的数据采集和监控。很难形成一个整体的监控运维系统，导致了数据碎片化和缺乏统一的资源视图。因此，难以进行统一的全局计算和统计分析。\n\
  \n基于本书前几章节的机器学习方法以及各种开源安全运维管理软件，本节提出了一种基于机器学习的网络安全监控管理系统的整体架构，形成了数据采集、统计分析和安全控制的完整闭环，实现了网络的统一管理和调度。\n\
  \n### 10.5.1 架构\n\n基于机器学习的网络安全监控管理系统的整体架构如图图 10.8 所示。整体架构由以下部分组成：物理设施层、虚拟资源层、编排层、策略层、语义描述层和应用层。通过大数据智能分析中心完成整体状态感知和策略调度，并通过可编程测量和审计完成数据审计功能。\n\
  \n![图 10.8 基于机器学习的网络安全监控与管理系统。](img/c10f008.png)\n\n图 10.8 基于机器学习的网络安全监控与管理系统。\n\
  \n### 10.5.2 物理设施层\n\n物理设施层是指各种网络设备和安全设备的基础，包括路由器、交换机、安全设备、计算、存储以及各种审计设备。它构成了 IT\
  \ 架构的基础，利用机器学习技术对网络对象和数据源进行网络安全监控和管理。物理设施层提供了丰富的测量数据，包括设备和链路性能数据（例如 `SNMP`、`ICMP`）、底层日志类型数据（例如各种设备的日志）、高级日志类型数据（例如防火墙日志、IDS、IPS\
  \ 系统日志）以及如 `DPI` 等测量设计设备数据。\n\n### 10.5.3 虚拟资源层\n\n随着虚拟化和容器技术的发展，`VMs` 和容器已成为基础设施的重要组成部分。虚拟资源池作为融合基础设施架构的关键要素，是共享服务器、存储和网络的集合，可以更快地重新配置以满足应用需求，使管理员能够比以往任何时候都更容易、更快地支持业务需求。在云计算环境中，资源不再是分散的硬件，而是物理服务器整合形成一个或多个虚拟资源逻辑池，包括计算、存储和网络资源。资源池可以委托主机（或集群）资源，当使用资源池划分集群内部资源时，优势显而易见。用户可以在主机或集群的直接子节点创建多个资源池并进行配置，然后可以将资源池的控制权委托给其他个人或组织。\n\
  \n### 10.5.4 编排层\n\n随着业务和功能的种类和数量增加，部署环境变得更加复杂，需要对不同的业务和功能进行编排，以简化跨环境、跨企业的集成业务流程。编排实现了网络服务的自动化部署，具有快速部署、动态调整和复用的能力。常见的网络功能包括安全服务链、流量调度、资源映射、业务拓扑等。\n\
  \n### 10.5.5 策略层\n\n\n\n\n\n策略层负责将网络意图的语义描述与资源状态的语义描述相结合，并通过智能方法为当前网络提供策略。网络策略描述了网络为了实现目标而执行的操作以及它们的执行顺序。为了方便执行，一个网络策略可以分为多个策略，或者可以将多个策略组合成单一策略组合，以实现网络策略的模块化执行。OSDF\
  \ (Comer and Rastegarnia, 2018) 提出了一种基于模板的策略生成方法。系统预定义了网络策略库，并将不同类型的网络策略存储在库中。当用户输入时，可以通过自然语言处理方法获取关键信息，并根据策略库映射到相应的网络策略。Han\
  \ 等人 (2016) 在 SDN 环境中设计了一 set 接口，将输入的意图转换为 OpenFlow 流表规则并交付到物理网络。在实施网络策略之前，应对对策略进行验证，以确保网络的顺畅运行。在企业环境中，策略管理访问数据的各种权限。这些策略可以用不同的形式表示，例如自然语言、基于\
  \ XML 的格式（如 XACML (XACML, 2022)) 或防火墙代码。由于其复杂性、分布性和规模，这些策略可能包含导致安全漏洞的异常或错误。不一致性是指在一组规则或策略中可能发现的导致相反决定的规则，例如在特定情况下同时拒绝和允许访问请求\
  \ (Shaikh et al., 2017)。此外，如果发现待处理策略与当前网络策略冲突，则需要消除冲突。目前，主要的策略是根据优先级解决冲突，并通过设置优先级消除低优先级策略。\n\
  \n### 10.5.6 语义描述层\n\n网络需要满足应用层的意图，但并没有给出如何实现。在实践中，转发决策和资源分配仍然基于网络策略。因此，需要理解意图。Nagios\
  \ 可作为资源状态的实现。Nagios、Zabbix 和 Prometheus 可用于监控资源状态。语义描述层对应用层提供的输入进行语义理解，通过自然语言处理方法，利用关键词、词法分析、语义挖掘等手段提取应用层提供的输入。然而，目前自然语言处理技术的能力有限，需要进一步发展自然语言处理技术。此外，我们需要获取当前网络资源状态，并对资源状态进行语义描述，告知策略层当前的网络资源状态。\n\
  \n### 10.5.7 应用层\n\n应用层负责获取用户对网络的意图，通过用户界面、网络应用和安全应用获取到网络的输入，并将输入统一为标准形式。应用层获取的输入不需要实现。获取输入的最常见方式是自然语言，大部分使用语义\
  \ ![left pointing angle](img/c10-i0041.png)<math display=\"inline\" overflow=\"\
  scroll\"><mrow><mo>&#9001;</mo></mrow></math>主语、谓语、宾语、修饰语![right pointing angle](img/c10-i0042.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mo>&#9002;</mo></mrow></math>形成表示。例如，如果用户想要实现“我想从\
  \ B 中断开 A”，我们可以输入它，然后输出 ![left pointing angle](img/c10-i0043.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mo>&#9001;</mo></mrow></math>A、断开、B![right pointing\
  \ angle](img/c10-i0044.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mo>&#9002;</mo></mrow></math>。应该有一个接口来实现它。Foster\
  \ 等人 (2011) 使用高层抽象来描述数据包转发规则。Anderson 等人 (2014) 提供了简单的原语来描述底层交换器的转发行为和网络结构。两者都基于\
  \ DSL 设计，能够完全描述用户意图。\n\n### 10.5.8 大数据智能分析中心\n\n策略发布到实际网络后，由于网络状态不断变化，需要根据期望状态和当前网络状态自动优化和调整策略，以确保网络始终满足意图需求。使用机器学习方法分类和预测网络状态信息，并根据网络状态的变化进行调整。通过全局视角识别、分析并处理安全威胁，为下一步的决策和行动做准备。对于网络状态信息的集中管理，可以使用如\
  \ `Kafka` (Kafka, 2022) `RocketMQ` (RocketMQ, 2022) 等数据交换组件。`Kafka` 是一个基于发布/订阅的分布式消息系统，能够以\
  \ ![upper O left-parenthesis 1 right-parenthesis](img/c10-i0045.png)<math display=\"\
  inline\" overflow=\"scroll\"><mi>O</mi><mo stretchy=\"false\">(</mo><mn>1</mn><mo\
  \ stretchy=\"false\">)</mo></math> 时间复杂度提供消息持久化，高吞吐量，并支持离线和实时数据处理以及在线水平扩展。`RocketMQ`\
  \ 是一个纯 Java 编写、分布式队列模型的开源消息中间件，具有高性能、高可靠、高实时和分布式特点。异常检测可以基于 `Flink` (Apache Flink,\
  \ 2022; Carbone et al., 2015)/`Spark` (Spark, 2022; Zaharia et al., 2010) 机器学习库。`FlinkML`\
  \ (FlinkML, 2022) 是 `Flink` 内部机器学习工具库。`FlinkML` 的目标是提供可扩展的机器学习算法、良好的 API 和工具，以减少构建端到端机器学习系统的努力。`MLlib`\
  \ (MLlib, 2022) 是 `Spark` 中的机器学习库。其目标是使实用的机器学习算法可扩展且易用。\n\n### 10.5.9 可编程测量与审计\n\
  \n\n\n\n当策略发布到实际网络后，需要实时监控网络状态信息，以确保网络的转发行为符合用户的意图。此外，由于网络状态处于不断变化之中，执行初的网络状态与运行过程中的网络状态可能并不一致。因此，此时我们还需要监控网络信息的状态。可以使用如`Suricata`\
  \ (Sur, 2022)、`Nmap` (NMAP, 2022)和`Snort3` (Snort, 2022)等工具对策略进行监控和审计。带内网络遥测（In-band\
  \ network telemetry）为网络状态的实时监控提供了解决方案。带内网络遥测是一种网络监控框架，可以直接在数据面上收集并报告网络设备的状态和当前的网络状态，从而实现实时、细粒度和端到端的网络监控。通过向数据面注入探针，判断数据面是否根据相应的策略进行转发，并确认用户意图是否正确实现（Zheng\
  \ and Cao, 2013）。\n\n### 10.5.10 总体流程\n\n可以从用户处获取意图并从应用程序收集需求；将它们汇总为统一格式并交给语义描述层。语义描述层将意图转换为语义描述并提供给策略层。语义描述层还提供资源状态的语义描述。策略层通过分析语义描述自动生成安全策略，解决一致性问题和冲突，并优化和部署全局安全策略。编排层编排各种业务模板和网络功能以简化流程。虚拟资源层根据策略配置安全特性，包括资源管理、组件管理、拓扑管理以及安全组件库中防火墙和入侵检测等组件的管理。态势感知和审计可以在策略实施后获取网络状态。机器学习自动处理消息队列中的数据处理，网络可以根据机器学习给出的判断结果来调整策略。\n\
  \n### 10.5.11 总结\n\n本节介绍了一种基于机器学习的网络安全监控与管理系统。由于各种开源工具提供的数据格式不同，如果仅关注自身领域的数据监控和运维，很难形成一个统一的整体架构，这不利于统一管理。这往往会导致缺乏统一的资源视图，并且难以进行统一的全局计算和统计分析。\n\
  \n本节旨在构建基于机器学习的网络安全监控管理系统的整体架构，结合数据采集、统计分析和安全控制，形成一个完整、方便且可控的系统。该架构大量应用机器学习，包括用于网络资源和意图语义描述的自然语言处理、用于策略自动生成、一致性检测和冲突解决的机器学习，以及用于感知和预测网络状况的态势感知机器学习。运维系统的统一管理是必要的，利用机器学习赋予其智能化也是一种发展趋势。\n\
  \n## 10.6 结论\n\n本章对网络管理和运维工具及系统进行了全面概述，从传统方法到当前的智能化方式。我们比较并讨论了网络管理运维不同不同阶段的代表性工具。此外，我们还提出了一种基于机器学习的网络安全监控管理系统，结合了数据采集、统计分析和安全控制。\n\
