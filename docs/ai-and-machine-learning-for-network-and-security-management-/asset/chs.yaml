  \n[content]\n\n# 5 网络流量分类中的概念偏移检测\n\n## 5.1 数据流处理中的机器学习相关概念\n\n### 5.1.1 假设与局限性\n\
  \n## 注意\n\n1. 本章基于我们之前的出版物（Cheng 等，2021）编写。\n\n\n\n\n\n随着网络和信息技术的快速发展，流量分类引起了广泛关注，并在入侵检测（Roshan\
  \ 等，2017, Zhang 等，2021, Wang 等，2021)）、流识别（Zou 等，2018, Lotfollahi 等，2017)）等领域中发挥着重要作用，等等。\n\
  \n然而，标准的机器学习框架通常以离线方式处理数据，由于可用数据呈指数级增长，它们在网络流量处理方面变得具有局限性。为了处理海量数据，越来越多的研究开始探索将网络数据作为流进行处理，并使用机器学习方法对流量进行在线分类。在机器学习方面，可以识别出几类与数据以及要学习的概念类型相关的假设和约束。\n\
  \n在本章的剩余部分，![x](img/c05-i0001.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>x</mi></mrow></math>,\
  \ ![y](img/c05-i0002.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>y</mi></mrow></math>,\
  \ 以及 ![upper P left-parenthesis x comma y right-parenthesis](img/c05-i0003.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mi>P</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo\
  \ stretchy=\"false\">)</mo></math> 分别表示给定的输入特征、给定标签以及概念（即数据分布）（Lemaire 等，2015）。\n\
  \n#### 5.1.1.1 学习示例的可用性\n\n在本章背景下，模型是从来自分类问题的代表性示例中学习的。在实践中，这些示例的可用性和访问性可能有所不同，例如：所有示例都存储在数据库中、所有示例存储在内存中、示例部分存储在内存中、示例以流的形式逐个可用。文献中报道了针对不同示例可用性的几类算法（Lemaire\
  \ 等，2015）。\n\n然而，在网络流量分类等领域，数据从数据流中持续可用，随着时间的推移，数据量将变得大到无法存储。根据“数据流”范式，代表性示例只能看到一次，且按照其到达顺序（不进行存储）（Lemaire\
  \ 等，2015）。在这种情况下，由于数据流的数据到达率可能很高，学习算法必须是增式的，并且需要具有高效的处理能力。\n\n#### 5.1.1.2 模型可用性\n\
  \n数据挖掘有两个步骤：(1) 训练并学习模型，(2) 部署模型对新数据进行预测。在普通的批量学习情况下，这两个步骤按顺序执行。但在增量算法情况下，一旦新示例到达，就会触发训练和学习阶段。在对时间敏感的应用中，训练和学习步骤需要低延迟算法（即具有低时间度的算法）。\n\
  \n### 5.1.1.3 要学习的概念\n\n要学习的概念是联合概率 ![upper P left-parenthesis x comma y right-parenthesis](img/c05-i0004.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mi>P</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo\
  \ stretchy=\"false\">)</mo></math>其中 ![x](img/c05-i0005.png)<math display=\"inline\"\
  \ overflow=\"scroll\"><mrow><mi>x</mi></mrow></math> 和 ![y](img/c05-i0006.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>y</mi></mrow></math> 分别是给定的输入特征和给定标签。\n\
  \n传统的流量分类通过学习底层数据分布 ![upper P left-parenthesis x comma y right-parenthesis](img/c05-i0007.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mi>P</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo\
  \ stretchy=\"false\">)</mo></math> 从静态数据集来实现。然而，在真实的网络环境中，概念（即联合概率）随用户兴趣和网络状态的变化而改变。在本章中，我们主要考虑流量分类中的概念漂移问题，流量标记受到其流性的严重限制。\n\
  \n### 5.1.2 概念漂移及其解决方案\n\n概念的变化被称为“概念漂移”。虽然基于机器学习的网络分类算法可以缓解传统技术的限制，但大多数算法仍然无法解决概念漂移（Qu\
  \ 等，2019），这对分类器的性能带来毁灭性的打击。例如，在入侵检测领域，当流量分布（即概念）发生时，人工神经网络 (`ANN`) 的 F1 分数会从 99.24%\
  \ 降到 9.59%（Al-Riyami 等，2018）。因此，为了进行在线流量分类，对概念漂移进行深入研究至关重要。根据漂移的速度，概念漂移可以是突发的（当概念突然改变时）或渐进的（当概念随时间缓慢演变时）（Wang\
  \ 等，2018）。此外，根据“概念”的定义，即 ![upper P left-parenthesis x comma y right-parenthesis\
  \ equals upper P left-parenthesis x right-parenthesis asterisk upper P left-parenthesis\
  \ y-bar x right-parenthesis equals upper P left-parenthesis y right-parenthesis\
  \ asterisk upper P left-parenthesis x-bar y right-parenthesis](img/c05-i0008.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mi>P</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo\
  \ stretchy=\"false\">)</mo><mo>=</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo\
  \ stretchy=\"false\">)</mo><mo>&#42;</mo><mi>P</mi><mo stretchy=\"false\">(</mo><mi>y</mi><mo\
  \ stretchy=\"false\">&#124;</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>P</mi><mo\
  \ stretchy=\"false\">(</mo><mi>y</mi><mo stretchy=\"false\">)</mo><mo>&#42;</mo><mi>P</mi><mo\
  \ stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">&#124;</mo><mi>y</mi><mo\
  \ stretchy=\"false\">)</mo></math>概念漂移可以表现为对应贝叶斯定理四个主要变量的四种基本变化形式（Wang 等，2018）。为了解决概念漂移引起的分类器性能下降问题，提出了两种解决方案：根据是否显式，被动方法与主动方法，取决于是否\n\
  \n\n\n\n\n采用了漂移检测机制（Wang et al., 2018, Singh et al., 2015）。被动方法（也称为自适应分类器）指的是没有显式触发报告漂移的情况下对分类器进行持续训练。主动方法的主要过程如图图\
  \ 5.1）。作为主动方法的核心组件，概念漂移检测已成为主要研究课题（Wang et al., 2018, Hu et al., 2020）。现有的概念漂移检测方法根据数据标签的可用性假设了三种情况之一（Hu\
  \ et al., 2020），包括对数据流标签的完全访问、无访问和有限访问。它们分别对应监督学习、无监督学习和半监督学习方法。半监督学习机制是标签成本与检测率之间的折中。虽然监督检测器可以检测所有类型的漂移，但由于网络流量的流式特性，对每个网络流量进行标记是不现实的。因此，在真实的网络环境中，一种合理的半监督概念漂移检测方案更加实用且高效。为了获取漂移指标，当前的半监督概念漂移检测方案主要需要衡量和评估分类器的置信度（Kim\
  \ and Park, 2017, Sriwatanasakdi et al., 2017, Haque et al., 2016a,b）或准确率（Lughofer\
  \ et al., 2016）。然而，基于置信度的方法（Kim and Park, 2017, Sriwatanasakdi et al., 2017, Haque\
  \ et al., 2016a,b）只关注决策边界的变化，即 ![upper P left-parenthesis y vertical-bar x right-parenthesis](img/c05-i0009.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mi>P</mi><mo stretchy=\"false\">(</mo><mi>y</mi><mo\
  \ stretchy=\"false\">&#124;</mo><mi>x</mi><mo stretchy=\"false\">)</mo></math>。因此，只能检测到所有概念漂移类型中的一部分（Hu\
  \ et al., 2020）。虽然基于准确率的指标无法检测决策边界的变化，但 Lughofer 等人（2016）提出的漂移分析方法假设之前获取的指标遵循高斯分布，这并不总是如此。为了高效检测突发性漂移和渐进性漂移，Zhang\
  \ 等人（2020）提出了一种集成漂移分析方法。然而，该方法需要对真实漂移进行标记，这在现实环境中是非常难实现的。为了在半监督学习下高效地完成概念漂移检测，我们提出了一种基于\
  \ `CVAE` 的概念漂移检测器，该方法在第 5.3 节中进行了详述。\n\n## 5.2 使用主动方法解决入侵检测领域的概念漂移\n\n为了更直观地展示概念漂移检测的过程，我们使用一个入侵检测的示例来作说明。\n\
  \n### 5.2.1 应用背景\n\n计算机系统和网络的爆炸式增长使得保护它们免受攻击或入侵的重要性日益提高。作为重要的网络安全技术之一，入侵检测系统（IDS）持续收集有关操作系统调用和网络流量的不同类型数据，这些数据可能显示出由恶意攻击或违反策略引起的异常情况。为了克服传统\
  \ IDS 的缺点（如耗时长和对新出现的入侵类型不敏感），更多的研究人员致力于利用机器学习和数据挖掘技术来自动检测和分类异常。然而，现实网络是一个非稳态环境，其中连续数据流的特征随时间变化，更重要的是，各种新类型的网络不断涌现。在这种情况下，当分类器与当前概念不匹配时（即发生概念漂移），有必要重新训练分类器。在本节中，我们使用入侵检测领域的两个真实数据集，即\
  \ `Gure–KDD` 和 `NSL–KDD` 来模拟概念漂移。`NSL–KDD` 是 `KDD99` 的改进版本，后者是第三届国际知识发现与数据挖掘工具竞赛用于构建网络入侵检测器的数据集。`NSL–KDD`\
  \ 和 `Gure–KDD` 都包含 5 类攻击和 41 维输入特征。在这种场景下，我们使用 `NSL–KDD` 的完整训练集来训练分类器。测试集由 `NSL–KDD`\
  \ 的测试集和 `Gure–KDD` 的完整集合组成，比例为 1:7。一旦检测到概念漂移，我们使用 5000 条标记数据在线训练分类器。\n\n### 5.2.2\
  \ 系统工作流\n\n\n\n\n\n如图 5.1 所示，在对未标记的流式数据 ![x](img/c05-i0010.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mi>x</mi></mrow></math> 进行分类后，检测器将新的 ![x](img/c05-i0011.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>x</mi></mrow></math> 作为输入，以判断是否发生了概念偏移（concept\
  \ drift）。半监督检测器的详细操作过程如图 5.2 所示。对于在线流量分类，让专家持续地对数据进行及时且可靠的标注是不现实的。在实践中，如图 5.2 所示，只有通过`主动学习`（Active\
  \ Learning）方法选出的极少数样本可以由专家（Oracle）进行标注（Lughofer 等人，2016）。专家可以处理选定的输入特征 ![bold upper\
  \ X](img/c05-i0012.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi mathvariant=\"\
  bold\">X</mi></mrow></math>并获取其真实标签 ![bold upper Y](img/c05-i0013.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mi mathvariant=\"bold\">Y</mi></mrow></math>，然后将\
  \ ![left-bracket bold upper X comma bold upper Y right-bracket](img/c05-i0014.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mfenced open=\"\\[\" close=\"\\]\" separators=\"\
  \"><mrow><mi:=\"bold\">X</mi><mo>,</mo><mi mathvariant=\"bold\">Y</mi></mrow></mfenced></math>作为`偏移指示器`（Drift\
  \ Indicator）的输入，计算损失函数的当前值作为指标。随后，`偏移分析器`（Drift Analyzer）会分析损失并生成信号，以判断是否发生了概念偏移。由于本研究的创新点主要体现在`偏移指示器`和`偏移分析器`上，下文我们将重点介绍这两个部分。在本章的剩余部分中，`主动学习`方法使用了采样率为\
  \ ![r](img/c05-i0015.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>r</mi></mrow></math>的随机采样。我们使用最直观的值，即分类器的准确率作为检测器的指标。然后，将采样率设置为\
  \ ![r equals 1](img/c05-i0016.png)<math display=\"inline\" overflow=\"scroll\"><mi>r</mi><mo>=</mo><mn>1</mn></math>并使用\
  \ Gama 等人（2004 所示。从图中可以看到，如果不处理概念偏移问题，分类器的准确率将会剧降。然而，如果我们使用偏移检测器并在每次发生偏移时重新训练分类器，分类器将获得更好的性能。通过这种，概念偏移问题可以得到解决。接下来，我们将描述如何在半监督学习下，基于\
  \ CVAE 以更低的采样率实现更好的概念偏移检测器性能。\n\n![图 5.2 半监督方法论概述。](img/c05f002.png)\n\n**图 5.2**\
  \ 半监督方法论概述。\n\n![图 5.3 解决概念偏移的主动方法结果。](img/c05f003.png)\n\n**图 5.3** 解决概念偏移的主动方法结果。\n\
  \n## 5.3 基于 CVAE 的概念偏移检测器\n\n根据第 5.2 节，概念偏移检测器包含两个主要组件，即`偏移指示器`和`偏移分析器`。在下文中，我们将详细介绍如何基于\
  \ CVAE 完成这两个部分的构建。\n\n![图 5.4 CVAE 的结构。](img/c05f004.png)\n\n**图 5.4** CVAE 的结构。\n\
  \n### 5.3.1 基于 CVAE 的偏移指示器\n\n作为一种生成式神经网络，变分自编码器（VAE）能够对观测数据的分布建模，即 ![upper P left-parenthesis\
  \ bold upper X right-parenthesis](img/c05-i0017.png)<math display=\"inline\" overflow=\"\
  scroll\"><mi>P</mi><mo stretchy=\"false\">(</mo><mi mathvariant=\"bold\">X</mi><mo\
  \ stretchy=\"false\")</mo></math。CVAE 通过引入标签扩展了 VAE，旨在建模特征与标签之间的关系，这意味着 CVAE 的损失与当前概念\
  \ ![upper P left-parenthesis bold upper X comma bold upper Y right-parenthesis](img/c05-i0018.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mi>P</mi><mo stretchy=\"false\">(</mo><mi:=\"\
  bold\">X</mi><mo stretchy=\"false\")</mo></math> 高度相关。CVAE 的结构见图 5.4。可见 CVAE 由一个编码器和一个解码器组成。编码器接收\
  \ ![left-bracket bold upper X comma bold upper Y right-bracket](img/c05-i0019.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mfenced open=\"\\[\" close=\"\\]\" separators=\"\
  \"><mrow><mi:=\"bold\">X</mi><mo>,</mo><mi:=\"bold\">Y</mi></mrow></mfenced></math>\
  \ 作为输入以生成变量 ![bold z](img/c05-i0020.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mrow><mi:=\"bold\">z</mi></mrow>。从形式上看，编码器的目标是估计隐数据分布 ![q-parenthesis bold upper\
  \ X comma bold upper Y right-parenthesis](img/c05-i0021.png)<math display=\"inline\"\
  \ overflow=\"scroll\"><mi>q</mi><mo stretchy=\"false\">(</mo><mi:=\"bold\">z</mi><mo\
  \ stretchy=\"false\">&#124|</mo><mi:=\"bold\">X</mi><mo>,</mo><mi:=\"bold\">Y</mi><mo\
  \ stretchy=\"false\")</mo></math>以近似隐向量的先验分布 ![p-parenthesis bold upper Y right-parenthesis](img/c05-i0022.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mi>p</mi><mo stretchy=\"false\">(</mo><mi:=\"\
  bold\">z</mi><mo stretchy=\"false\">&#124|</mo><mi:=\"bold\">Y</mi><mo stretchy=\"\
  false\")</mo></math。解码器以 ![bold upper Y](img/c05-i0023.png)<math display=\"inline\"\
  \ overflow=\"scroll\"><mrow><mi:=\"bold\">Y</mi></mrow></math> 为输入，从近似分布中采样 ![bold\
  \ z](img/c05-i0024.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi:=\"\
  bold\">z</mi></mrow></math> 并尝试重建原始特征 ![bold upper X](img/c05-i0025.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mi:=\"bold\">X</mi></mrow></math，即使用解码器输出 ![f-parenthesis\
  \ bold z comma bold upper Y right-parenthesis](img/c05-i0026.png)<math display=\"\
  inline\" overflow=\"scroll\"><mi>f</mi><mo stretchy=\"false\">(</mo><mi:=\"bold\"\
  >z</mi><mo>,</mo><mi:=\"bold\">Y</mi><mo stretchy=\"false\")</mo></math> 来近似输入 ![bold\
  \ upper X](img/c05-i0027.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi:=\"\
  bold\">X</mi></mrow></math。编码器和解码器的参数均可使用深度学习框架进行训练（Agrawal 和 Ganapathy，2019）。\n\
  \n\n\n\n\n如果输入特征 `X` 是从分布 `p(X|z, Y)` 重构的，CVAE 的目标函数可以由公式 (5.1) 表示，其中 `D(.)` 是 Kullback–Leibler\
  \ 散度。\n\n(5.1)\n```\nL=D(q(z|X,Y)||p(z|Y)) +∫E_{z~q(z|X,Y)}(log p(X|z,Y))\n```\n\
  \n通常，隐向量先验分布 `p(z|Y)` 被假设为标准正态分布，而 `q(z|X,Y)` 被假设为均值为 `μ(X,Y)`、方差为 `σ(X,Y)` 的正态分布（Doersch,2016）。此外，公式\
  \ (5.1) 中的第二项可以用均方误差 (MSE) 的负值代替（Agrawal and Ganapathy,2019）。最后，每个样本的 CVAE 损失函数可以重写为公式\
  \ (5.2)。\n\n(5.2)\n```\nLC=D(q(z|X,Y)||N(0,I)) + |f(z,Y)-X|²\n```\n\n可以使用随机梯度下降技术来最小化公式\
  \ (5.2)。在 CVAE 训练完成后，**基于 CVAE 的漂移指标**将第 `k` 个样本 `[X_k, Y_k]`（其中 `k=1, 2, 3, ...`）作为输入，根据公式\
  \ (5.2) 输出损失函数值 `l_k`。\n\n### 5.3.2 漂移分析器\n\n基于**基于 CVAE 的漂移指标**的输出值，我们可以使用以下定理来确定是否发生了概念漂移。\n\
