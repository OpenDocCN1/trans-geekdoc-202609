  ```\n\n\n\n其中 $P(\\mu_c, \\upsilon_c)$ 可以是任何概率分布模型。在下，它们被简单地讨论为多项分布。公式如下：\n\n(3.12)\
  \ $P(\\mu_c, \\upsilon_c) = Multinomial(\\mu_c, \\upsilon_c; \\theta_{\\mu_c})$\n\
  \n其中 $\\theta_{\\mu_c}$ 是概率模型的参数向量。\n\n### 3.3.1.4 讨论\n\n在前面的部分中，我们通过三个例子来讨论了意图符号的设计，这些符号表达了网络和业务运营商对网络某些方面的需求。为了给符号赋予语义，有为每个符号赋予随机向量以表示某些概念和关系。意图的具体语义是从数据中推断出的随机向量的采样值或期望。在推理过程中获得的这些符号将转换为网络策略并自动部署到网络中。\n\
  \n### 3.3.2 符号化结构推理 (SSI)\n\n符号 $A$、$B$ 和 $C$ 可以被视为原子意图，表示网络在某一方面的能力。它们需要被组合成一个结构以表达准确的业务意图。例如，最短路径包含了连通性意图、最短长度意图和无死锁意图。只有这三个意图的组合才能表达应用程序希望网络提供最短路径的意图。然而，开发一种确保流表项同时满足所有意图的机制是一项重要挑战。如图图\
  \ 3.7\n\n**图 3.7**](#c03.xhtml#R_c03-fig-0007) 满足最短意图的“路径”。\n\n这两个情况表明原子意图之间存在优先级，而不是简单的并行关系。符号化结构基于意图之间的优先级。确定意图符号之间的优先级是一个重要步骤。这一步被称为\
  \ SSI。\n\nSSI 的目的是确定意图符号之间的优先顺序。首先，获取满足高优先级意图的路径集，然后在集合上进一步过滤满足低优先级意图的路径。意图符号之间的优先级有三种模式，如图图\
  \ 3.9\n\n**图 3.8**](#c03.xhtml#R_c03-fig-0008) 满足连通性意图的路径。\n\n![图 3.9 意图符号的三种优先级模式。](img/c03f009.png)\n\
  \n**图 3.9**](#c03.xhtml#R_c03-fig-0009) 意图符号的三种优先级模式。\n\n## 3.4 实验\n\n进行了两个特定实验来验证上述框架的可行性。它们是\
  \ SSL 和 SSI。然后，我们将学习到的符号化结构迁移到四个具有不同网络拓扑的新网络中，并让它寻找所有节点对之间的最短路径和负载均衡路径。这是为了验证符号化结构跨不同网络迁移知识的能力。\n\
  \n### 3.4.1 数据集\n\n实验分为训练阶段和测试阶段。在训练阶段，我们在具有给定拓扑的网络中实现经典的最短路径路由算法，以收集任意两个节点对之间的目标路径。\n\
  \n### 3.4.2 符号语义学习实验\n\n为了评估所提的意图符号语义三角形理论在自主实现路径选择任务意图方面的有效性，我们进行了大量的实验，以验证在意图符号上的学习性能。上一节提到了三种不同的意图，即用于连通性的符号\
  \ $A$、用于无死锁的符号 $B$ 以及用于路径性能的符号 $C$。\n\n关于符号 $A$ 的实验，$A(\\mu_a, \\upsilon_a, \\eta_a)$\
