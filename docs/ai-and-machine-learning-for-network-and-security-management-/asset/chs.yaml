  \n\n\n\n\n*   Lughofer 等人 (2016) 提出的漂移检测器是基于 Faded Page–Hinkley 测试（在本章的后续部分称为 `PH_test`）。与我们提出的解决方案类似，它对类别标签的访问有限。`PH_test`\
  \ 的漂移指示器基于分类器的准确率得分。然而，漂移分析方法（即 Faded Page–Hinkley 测试）假设指示器服从高斯分布，这在许多真实世界的设置中并不总是现实的。\n\
  \n*   基于 Hoeffding's Bound 的漂移检测方法（下文称为 `HDDM`）由 Frías‐Blanco 等人 (2015) 提出。尽管 `HDDM`\
  \ 的假设可以完全访问类别标签，但为了使其与我们提出的方案具有可比性，我们限制了采样率，并在样本标签访问有限的情况下测量了监督概念漂移检测方案的性能。我们使用\
  \ `CVAE‐based drift indicator` 的输出作为 `HDDM` 的漂移指示器。\n\n*   基于受限玻尔兹曼机 (RBM) 的漂移指示器由\
  \ Jaworski 等人 (2018) 提出。为了与基于其他生成模型（如 `RBM`）的指示器进行比较，我们修改了 Jaworski 等人 (2018) 提出的漂移分析方法，并将其整合到我们在\
  \ Section 5.3.2 中提出的方法中。\n\n![表 5.1  数据库描述。](img/c05-i0063.png)\n\n`表 5.1`  数据库描述。\n\
  \n### 5.3.3.2 实验设置\n\n在本节中，采用了著名的人工数据生成器 `SINE` (Wang 等人，2018)。在 `SINE` (Wang 等人，2018)\
  \ 中，每个生成点都有两个特征 ![左括号 x 1 逗号 x 2 右括号](img/c05-i0066.png)<math display=\"inline\"\
  \ overflow=\"scroll\"><mo stretchy=\"false\">(</mo><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><msub><mi>x</mi><mn>2</mn></msub><mo\
  \ stretchy=\"false\">)</mo></math> 和一个标签 ![y](img/c05-i0067.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mi>y</mi></mrow></math>。特征均匀分布在 [0, 1]。从第一个数据开始，每\
  \ 100 个数据发生一次概念漂移。人工数据集中共生成了 99 次漂移。为了衡量所提方案在概念渐变漂移背景下的性能，我们生成了 `SINEg` 数据集。生成的数据集的详情见\
  \ 表 5.1。在本节中，`CVAE` 的隐藏层由 10 个神经元组成，![粗体 z](img/c05-i0068.png)<math display=\"inline\"\
  \ overflow=\"scroll\"><mrow><mi mathvariant=\"bold\">z</mi></mrow></math> 的维度为 2。为了提高所提方法的鲁棒性，我们设置了预定义值\
  \ ![m 等 0.25](img/c05-i0069.png)<math display=\"inline\" overflow=\"scroll\"><mi>m</mi><mo>=</mo><mn>0.25</mn></math>。此外，窗口大小\
  \ ![上 M](img/c05-i0070.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>M</mi></mrow></math>\
  \ 设置为 10。考虑以下广泛使用的性能指标来评估我们提出的方案 (Wang 等人，2018)：\n\n*   真检测率 (TDR)：它是检测到真实概念漂移的概率，如公式\
  \ (5.8) 所示，其中 ![上 N 下标 p](img/c05-i0071.png)<math display=\"inline\" overflow=\"\
  scroll\"><msub><mi>N</mi><mi>p</mi></msub></math> 是真实概念漂移的数量，而 ![上 D 下标 p](img/c05-i0072.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msub><mi>D</mi><mi>p</mi></msub></math>\
  \ 是检测到的真实漂移的数量。在本节中，我们定义漂移被检测为 ![存在上标 C 下标 e Baseline 小于 i 小于或等于上标 C 下标 e Baseline\
  \ 逗号，s 下标 i 等 1](img/c05-i0073.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mo>&#8707;</mo><msub><mi>C</mi><mn>e</mn></msub><mo>&lt;</mo><mi>i</mi><mo>&le;</mo><msub><mi>C</mi><mn>e'</mn></msub><mo>,</mo><msub>s</mi><mn>i</mn></msub><mo>=</mo><mn>1</math>\n\
  *   误报率 (FAR)：它是报告不存在漂移的概率，如公式 (5.9) 所示，其中 ![上 N](img/c05-i0076.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow>N</mi></mrow></math> 是样本的数量，而 ![上 R](img/c05-i0077.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow>R</mi></mrow></math> 是误报的数量。![s 下标\
  \ i 等 1](img/c05-i0078.png)<math display=\"inline\" overflow=\"scroll\"><msub>s</mi><mn>i</mn></msub><mo>=</mo><mn>1</math>\
  \ 是误报，如果 `C_e` 不存在。`上 `T R 等于 D 下标 p 除以 N 下标 p` (c05.xhtml-disp-0008)。\n\n我们使用由\
  \ `Scipy` 实现的逻辑回归对数据进行分类，并对数据流 ![上 S](img/c05-i0079.png)<math display=\"inline\"\
  \ overflow=\"scroll\"><mrow>S</mrow></math> 以特定的采样率 ![r](img/c05-i0080.png)<math\
