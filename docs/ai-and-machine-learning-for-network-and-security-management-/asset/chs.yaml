  \ | 用于 Java、C、C++ 和 Objective-C 的静态分析器 |\n| Brakeman | Ruby | [`github.com/presidentbeef/brakeman`](https://github.com/presidentbeef/brakeman)\
  \ | 针对 Ruby on Rails 的静态分析安全漏洞扫描器 |\n| Dependency-Check | Java | [`github.com/jeremylong/DependencyCheck`](https://github.com/jeremylong/DependencyCheck)\
  \ | OWASP dependency-check 是一个软件成分分析工具，用于检测应用程序依赖中公开的漏洞 |\n| rhizobia\\_J | Java\
  \ | [`github.com/momosecurity/rhizobia_J`](https://github.com/momosecurity/rhizobia_J)\
  \ | Java 安全编码标准和 JAVA 安全 SDK |\n| rhizobia\\_P | PHP | [`github.com/momosecurity/rhizobia_P`](https://github.com/momosecurity/rhizobia_P)\
  \ | PHP 安全编码标准和 JAVA 安全 SDK |\n| RIPS | PHP | [`github.com/ripsscanner/rips`](https://github.com/ripsscanner/rips)\
