  \n7.4.4.2 单日志日志异常检测\n\n\n\n\n为了检测单个日志的异常，我们需要对单条日志进行半监督学习。我们首先根据表 7.1 将 BGL 数据集转换为二进制数据集。为了使我们的方法能够更好地处理新出现的日志数据，我们过滤了\
  \ BGL 数据集中的重复日志，处理后的数据集命名为 `BGL‐Raw`。`BGL‐Raw` 训练集的数据分布如图图 7.19 所示。`BGL‐Raw` 训练集仅包含\
  \ 150 条日志，不足以拟合深度神经网络。由于 `EDA` 简单且有效，我们使用它将“正常”样本和“异常”样本都扩展了 10 倍。扩展后的数据集被称为 `BGL‐Imbalance`。由于“正常”样本的数量是“异常”样本的\
  \ 3.4 倍，`BGL‐Imbalanced` 训练集是不平衡的。`BGL‐Imbalanced` 训练集的数据分布如图图 7.20 所示。我们使用 6![percent-sign](img/c07-i0095.png)<math\
