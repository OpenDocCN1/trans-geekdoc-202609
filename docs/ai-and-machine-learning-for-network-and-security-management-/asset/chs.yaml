  \ 的实验结果。\n\n\n\n\n\n我们为 HDFS 训练数据集选取了四种“正常”样本数量与“异常”样本数量的比例：2:1、3:1、4:1 和 5:1。我们分别在\
  \ 1500、3000 和 8000 个样本上训练了 `AllRobust` 和 `LogRobust`。`AllRobust` 的结果如图图 7.16 所示。当“正常”样本数量与“异常”样本数量的比例从\
  \ 2:1 增加到 5:1 时，`AllRobust-8000`（即在 8000 个样本上训练的 `AllRobust`）所取得的准确率仅从 0.99 下降到\
  \ 0.94，而 `LogRobust-8000`（即在 8000 个样本上训练的 `LogRobust`）的准确率则从 0.89 下降到 0.74。实验结果显示，`AllRobust`\
