  \ LSTM 的结构。](img/011)\n\n图 7.11 注意力 LSTM 的结构。\n\n最后，我们根据 ![a](img/c07-i048.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>a</mi></mrow></math> 的所有值对隐藏状态进行求和，并构建\
