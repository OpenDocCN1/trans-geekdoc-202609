  \n### 8.3.3 训练流程\n\n与传统的深度学习方法不同，OpenLog 有一个特殊的二阶段训练流程。第一阶段是表示学习阶段，类似于预训练。该阶段的模型结构由编码器模块和原型模块组成。我们应用了基于回合（episode-based）的元训练（Geng\
  \ et al., 2019）。表示学习阶段是一种基于回合的元训练，OpenLog 旨在通过多个元任务来训练编码器模块。我们选择预处理后的辅助数据集的一部分作为训练数据集\
  \ ![upper T](img/c08-i0106.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>T</mi></mrow></math>\
  \ 和验证集。\n\n在每个回合中，OpenLog 从训练集中随机选择类别和样本 ![upper T](img/c08-i0107.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mi>T</mi></mrow></math> 来训练模型。例如，它从训练集中随机选择\
  \ ![upper C](img/c08-i0108.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>C</mi></mrow></math>\
  \ 个类，在每个类中选择 ![upper K](img/c08-i0109.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mrow><mi>K</mi></mrow></math> 个样本作为样本数据集 ![upper S](img/c08-i0110.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mi>S</mi></mrow></math>，并在每个类中选择 ![upper Q](img/c08-i0111.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math> 个样本作为查询数据集\
  \ ![upper Q](img/c08-i0112.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>。这被称为\
  \ ![upper C](img/c08-i0113.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>C</mi></mrow></math>\
  \ 类路-![upper K](img/c08-i0114.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>K</mi></mrow></math>\
  \ 样本-![upper Q](img/c08-i0115.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>\
  \ 查询元训练设置（Sung et al., 2018），其中 ![upper C](img/c08-i0116.png)<math display=\"inline\"\
  \ overflow=\"scroll\"><mrow><mi>C</mi></mrow></math>、![upper K](img/c08-i0117.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>K</mi></mrow></math> 和 ![upper\
  \ Q](img/c08-i0118.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>\
  \ 的值是手动设置的。`C`、`K` 和 `Q` 的值手动设置。原型模块的结果通过反向传播连续调优编码器模块，这与普通学习相同。第二阶段是关系学习。该阶段的模型结构由编码器模块和原型模块组成。我们应用了类似但不同的训练策略。我们将剩余的辅助数据集聚合为集合\
  \ ![upper M](img/c08-i0119.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>M</mi></mrow></math>。\n\
  \nOpenLog 从 ![upper M](img/c08-i0120.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mrow><mi>M</mi></mrow></math> 中随机选择类别子集，与前阶段相似。与前阶段的区别在于，在每个回合中，我们选择具有正标签和负标签的对而不是多个标签，以指示它们属于同一类。此外，如果每个类中的样本更多，我们还可以使用\
  \ Xu (2019) 中提到的方法，从 ![upper M](img/c08-i0120.png)<math display=\"inline\" overflow=\"\
