  - `VR`: 虚拟现实\n- `VXLAN`: 虚拟扩展局域网\n- `ZTN`: 零信任网络\n\n# 1 引言\n\n## 1.1 引言\n\n由于 `5G`\
  \ (Cheng et al., 2018, 2020b, Wu et al., 2021b)、物联网 (`IoT`) (Wu et al., 2021c, Wu,\
  \ 2021)、云/边缘计算 (Zhang et al., 2020, Wu, 2020) 以及工业 4.0 (Wu et al., 2021a, Turner\
  \ et al., 2021) 的快速发展，网络系统近年来经历了飞速进步。一方面，已经开发了许多先进网络技术，例如软件定义网络 (`SDN`) (Miao et\
  \ al., 2016)、网络功能虚拟化 (`NFV`) (Wang et al., 2019, 2020) 以及网络切片 (Wang et al., 2019)。另一方面，由于系统暴露面的增加，网络安全成为网络系统的主要关注点\
  \ (Wu et al., 2020)。许多安全机制，例如入侵检测、流量分类和异常检测已被为了保障网络安全 (Huang et al., 2017, 2018)。\n\
  \n\n\n\n\n为了将 AI 和 ML 技术充分应用到网络和安全管理领域，需要考虑许多现实世界的条件和挑战。例如，网络意图是实现自主网络管理的关键信息（Lin\
  \ 等，2021）。如何从网络大数据中获取准确的网络意图，以及如何确保所学习的网络意图能够在不同的网络环境中快捷使用，这绝非易事。强化学习（RL）是自主网络管理的有效工具（Yan\
  \ 等，2020）。在各种网络管理任务中成功应用 RL 具有挑战性。在许多现实世界场景下（如 IoT/IIoT），需要轻量级学习模型（Cheng 等，2020a）。如何在保持模型性能的同时设计出此类模型，对于网络和安全管理领域仍然值得研究。此外，由于《通用数据保护条例》（GDPR）等数据法规强制执行此类流量的增加，从加密数据（例如加密流量）中学习变得至关重要（Liu\
  \ 等，2020）。此外，由于现实世界网络系统的状况不断变化，网络数据在许多情况下并不理想。它们通常是演进的、变化的且不平衡的，并且可能会不断出现未见过的新数据。此外，网络数据通常难以标记，导致少样本（few-shot）问题。如何从这些“噪声”数据中有效学习有用信息，对于确保\
  \ AI 支持的网络和安全管理的成功至关重要（Sun 等，2020）。\n\n在本书中，我们针对上述问题和挑战提供了见解和潜在解决方案，并考虑了网络和安全管理的各种应用，包括自主网络、资源分配、流量处理、流量分类、异常检测、异常分类以及零信任网络（ZTNs）。在第\
  \ 1.2 节中，我们将解释书中章节安排的原理。\n\n## 1.2 本书的结构\n\n本书包含两个线索。第一条线索位于第 2 章，在其中我们对用于网络和安全管理的潜在\
  \ AI 和 ML 技术、现有的行业产品、标准、项目和概念验证进行了全面回顾。第二条线索跨越第 3 章–第 9 章，我们详述了 AI 和 ML 技术在各种网络和安全管理任务中的应用。在第\
  \ 10 章中，我们详细说明了一种智能网络管理和运行系统，并讨论了书中提解决方案的部署。在第 11 章中，我们总结了本书，并提供了该领域未来研究有用的潜在挑战和开放性问题。图\
  \ 1.1 展示了本书的章节结构。下我们将简要介绍每一章，以便读者理解本书的内容。\n\n*   第 2 章。本章讨论了当前网络和安全管理的现状与局限性，并提出了一种赋驱动的网络安全管理架构。回顾并讨论了对网络和安全管理有用的常用\
  \ AI 和 ML 技术。我们还研究了现有的网络安全管理行业产品、标准和概念验证。\n\n*   第 3 章。网络自主性的实现需要网络知识来管理网络。网络管理任务的抽象意图可以被视为网络知识的一部分。在本章中，我们将网络管理任务的抽象意图视为符号的复合结构。每个符号表示网络管理任务在特定某个方面的意图。代表网络管理任务的符号组合能够在不同的网络之间进行传输和实现。为此，我们设计了一种参考机制，用于从网络数据中学习意图符号及其结构。以路径选择举例，我们详细描述了如何实现这一机制以获取路径选择任务的意图结构。实验证明，所提解决方案学习到的知识可以在不同的网络环境中进行迁移并被有效利用。\n\
  \n*   第 4 章。由于自动探索和快速开发的卓越性能，RL 方法已应用于虚拟网络嵌入（VNE）问题。在本章中，我们发现主动式 VNE 算法可以受益于分层强化学习（HRL）。在这一算法中，双层智能体负责执行\
  \ VNE 任务，同时考虑长期影响和短期影响。在高层，智能体从批次中选择一个可行请求，旨在最大化长期收益。在低层，智能体负责以最小成本嵌入所选请求。\n\n*\
  \   第 5 章。虽然基于机器学习的网络流量分类算法可以缓解传统技术的局限性，但它们大多数是通过从静态数据集学习底层概念（即数据分布）。由于可用网络数据的指数级增长，对流式处理网络数据已引起广泛关注。在这种场景下，由于网络中不可预见的情况，概念漂移会降低分类器的性能。在本章中，在衡量了漂漂移对流量分类器的影响后，我们提出了一种基于条件自动编码器（VAE）的半监督学习概念漂移检测器。此外，我们在现实环境中部署了该检测器，结果显示该算法在稳定分类器性能方面发挥了巨大作用。\n\
  \n*   第 6 章。加密流量的激增和加密流量的不透明导致高效网络管理的计算开销巨大。在本章中，我们引入了一种轻量级的在线流量分类方法，该方法采用了多头注意力机制和卷积神经网络。由于所有数据包之间的单步交互和并行计算，多头注意力机制可以显著减少参数数量和运行时间。此外，卷积神经网络在流量分类中的有效性和效率已得到证明。\n\
  \n*   第 7 章。随着网络系统规模的扩大，产生的日志数量巨大。本章提出了一种健壮的环境感知日志异常检测方法。它结合了词嵌入和区域嵌入来进行日志向量化。这种丰富的语义信息使得所提方法能够处理未见的日志数据，并更深入地理解不平衡的日志数据。所提方法结合半监督学习，充分利用标记数据和未标记数据。\n\
  \n\n\n\n\n* 第 8 章。基于机器学习的日志异常分类方法已被广泛研究，以确保大规模系统的稳定性和可靠性。本章通过示例简要介绍了日志分析中的特征提取和少样本学习问题。随后，我们提出了\
  \ `OpenLog`，这是一种基于元学习的异常分类方法。`OpenLog` 使用双层语义编码器来简化复杂的特征工程。它采用元学习策略，通过使用充分的辅助数据集来训练模型以增强其性能。`OpenLog`\
  \ 将多分类任务转换为二分类任务，能够在无需重新训练的情况下对未见的异常进行分类。\n\n* 第 9 章。近年来，企业内部网络发生了许多高级持续攻击（APT）。传统的基于边界的安全防御技术（如防火墙）假设网络内部的用户和设备是安全且可信的，已无法提供足够的安全防护。因此，提出了\
  \ `ZTN`（零信任网络）。在 `ZTN` 中，每一个请求无论是来自内部网络还是外部网络，在访问资源之前必须经过身份验证和授权。在本章中，我们简介绍 `ZTN`，包括其概念、架构以及目前的实现方案，例如基于访问代理、基于软件定义边界（SDP）、基于微隔离的解决方案等。由于\
  \ `ZTN` 需要对请求进行认证和授权，有必要考虑尽可能多的设备、用户和环境信息以做出决策。由于企业内网存在大量的服务、流量和设备日志，基于机器学习的信息融合和决策方法可能会提高认证和授权的性能。因此，在本章中，我们评估了在\
  \ `ZTN` 中机器学习机器学习。\n\n* 第 10 章。尽管各种基于深度学习的智能运维技术正在开发中，但如何将它们有效地应用到现实产品中是深度学习面临的核心挑战之一。在本章中，我们介绍了运维管理和安全领域的各种开源工具、框架和特性。此外，我们分析了现有的基于深度学习的安全运营管理系统。最后，我们提出了基于网络大数据的智能运维安全框架，并描述了该框架中的核心功能和接口。\n\
