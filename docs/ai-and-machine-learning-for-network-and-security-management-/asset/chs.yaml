  \ (d) SINE\\_g 中的 FAR\n\n## 5.4 真实网络中的部署与实验\n\n在本节中，我们系统地描述网络流识别领域数据采集、特征提取等步骤的部署方法，以及概念漂移检测的结果。\n\
  \n### 5.4.1 数据采集与特征提取\n\n为了收集流量数据，我们部署了图 5.6 所示的网络拓扑结构。如图所示，我们在服务器上生成网络流量。为了生成直播流量，我们使用\
  \ `streamlink` 从花界下载直播。![图 5.6 实验中的网络拓扑结构](img/c05f006.png)\n\n图 5.6 实验中的网络拓扑结构。\n\
  \n表 5.2 特征选择。\n\n| 特征 | 说明 |\n| --- | --- |\n| `pkt_len_mean` | 包的平均大小 |\n| `fwd_pkt_len_mean`\
  \ | 正向包的平均大小 |\n| `bwd_pkt_len_mean` | 反向包的平均大小 |\n| `flow_rate` | 平均速率 |\n| `fwd_flow_rate`\
  \ | 正向平均速率 |\n| `bwd_flow_rate` | 反向平均速率 |\n| `flow_pit` | 包间隔时间的平均值 |\n| `fwd_flow_pit`\
  \ | 正向包间隔时间的平均值 |\n| `bwd_flow_pit` | 反向包间隔时间的平均值 |\n\n### 5.4.2 数据分析与参数设置\n\n上午\
  \ 9 点到晚上 9 点之间收集的流量是工作时间数据集（简称“工作数据集”），而晚上 9 点到次日上午 9 点之间收集的流量是下班时间数据集（简称“放松数据集”）。此外，我们还将工作数据集进一步划分为两个子数据集：训练数据集（“working-train”）和测试数据集（“working-test”），比例设定为\
  \ 3:1。我们使用 Jensen–Shannon 散度来衡量三个数据集（working-train、working-test 和放松数据集）之间的差异。working-train\
  \ 与 working-test 之间的分布差距最大值为 0.0368，working-train 与放松数据集之间的分布差距最大值为 0.4659，这意味着\
  \ working-train 数据集与放松数据集之间存在概念漂移。\n\n在这种场景下，我们使用 `working-train` 作为训练数据集。`working-test`\
  \ 以及放松数据集被用测试数据集。一旦检测到概念漂移，我们使用 2500 条标记数据来在线训练分类器。`CVAE` 的隐藏层由 20 个神经元组成，`![bold\
  \ z](img/c05-i0086.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi mathvariant=\"\
  bold\">z</mi></mrow></math>` 的维度为 5。此外，窗口大小为 `![upper M equals 20](img/c05-i0087.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mi>M</mi><mo>=</mo><mn>20</mn></math>`，我们将定义值\
  \ `![m](img/c05-i0088.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>m</mi></mrow></math>`\
  \ 设置为 1。\n\n### 5.4.3 结果分析\n\n由于目前没有专门用于概念漂移检测领域的真实数据集，在真实数据集上进行测试时，漂移检测方案的性能受到分类器准确性的间接影响。也就是说，一个良好的概念漂移检测方案应该及时发现概念漂移，并让分类器在数据上训练以提高其准确性。\n\
  \n我们将自适应分类器（下文称为 `Online Learner`）作为上限，因为它们直接在线训练数据模型，无需概念漂移检测即可获得结果。\n\n\n\n\n\
  基于半监督假设的概念漂移检测方案需要在概念检测性能和标注成本之间寻求平衡。因此，为了找到具有最高标注价值的数据，主动学习（该方法假设存在大量未标注数据，但只有一小部分可以通过人力进行标注）需要经过更仔细的设计，以便能够用尽可能少的标注数据发现概念漂移。\n\
  \n## 5.6 结论\n\n在本章中，我们简要介绍了数据流处理和概念漂移的概念。此外，我们实现了一种基于 `CVAE` 的概念漂移检测器。通过实验，我们可以证明我们的概念漂移检测器更加高效。然而，由于传统的\
  \ `CVAE` 只能进行离线训练，不具备在线训练的能力，难以实时适应当前概念。我们的解决方案仍有改进空间。\n\n## 参考文献\n\n1. Purvi Agrawal\
