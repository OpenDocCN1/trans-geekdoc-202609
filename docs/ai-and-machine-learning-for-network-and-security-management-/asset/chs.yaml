  \ 中有限的隐藏单元结构无法高效地展示高阶特征的可解释性。因此，我们提议探索一种能够高效发现意义的高阶交互特征的方法，同时所有数据包特征可以投影到许多子空间中，每个数据包可以一步与所有数据包进行交互。\n\
  \n## 6.4 提出的轻量级模型\n\n如图 6.1 所示，本节将阐述所提出的模型。该模型的输入来自路由器上捕获的在线或离线流量轨迹。预处理后，捕获流中的连续\
  \ ![upper N](img/c06-i0016.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>N</mi></mrow></math>\
  \ 个数据包。然后提取每个数据包的初始特征并将其嵌入向量，拼接以表示流。使用注意力编码器提取局部和全局特征。最后，使用带有 `softmax` 的全连接层输出标签的概率分布。为了增强轻量级模型的稳定性，采用了一系列训练优化方法，包括\
  \ `ResNet`（He 等，2016）、层归一化（Ba 等，2016）和学习率预热（He 等，2016）。\n\n![图 6.1 LightNet 的预处理和架构。嵌入层和注意力编码层的结构是固定的，全连接层的结构随不同任务而变化。](img/c06f001.png)\n\
  \n`图 6.1` LightNet 的预处理和架构。嵌入层和注意力编码层的结构是固定的，全连接层的结构随不同任务而变化。\n\n### 6.4.1 预处理\n\
  \n作为网络管理的一项关键加密技术，基于安全套层的超文本传输协议（`HTTPS`）基于传输控制协议（`TCP`）（Naylor 等，2014<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mi>N</mi></mrow></math> 个原始数据包被提取为模型的唯一输入。\n\
  \n### 6.4.2 特征提取\n\n#### 6.4.2.1 嵌入\n\n嵌入层用于提取数据包的浅层特征。在本章中，利用流级和包级特征。因此，每个数据包的特征表示统一在相同的格式中，包含了模型中的多个特征字段。\n\
