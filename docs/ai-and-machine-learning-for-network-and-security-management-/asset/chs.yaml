  \n### 7.3.4.1 SSL 的实现\n\n如上述，基于深度学习的方法（例如 `CNN` 和 `Bi‐LSTM`）已广泛应用于日志异常检测领域。然而，它们需要大量的标注数据来进行训练。由于标签的获取通常需要大量人力，因此在大规模标注数据上训练带来的性能提升将耗费巨大。特别是当标签只能由专家标注时，成本会更高。半监督学习（`SSL`）可以使用一部分标注数据和剩余的未标注数据来训练模型。\n\
  \n\n\n\n一致性正则化（Sajjadi et al., 2016; Laine and Aila, 2017)）和伪标签（Lee et al., 2013\
  \ 所示，其中`α(μ_i)` 是样本`μ_i`的扰动版本，函数`p_m` 输出模型的预测。`α` 和 `p_m` 都是随机函数，因此它们输出两个不同的值。它使用模型两个预测值之间的平方\
  \ `l²` 损失作为代价函数。\n\n伪标签法（Lee et al., 2013 所示，其中`q_i = argmax(q_i)`产生一个有效的“独热”概率分布，`q_i\
  \ = p_m(y|u_i)`，`τ` 是阈值超参数。\n\n```\n(7.7) ∑_{i=1}^B ||p_m(y|α(u_i)) - p_m(y|α(u_i))||²\n\
  ```\n\n```\n(7.8) 1/B ∑_{i=1}^B [max(q_i) ≥ τ] H(q_i)\n```\n\nFixMatch 使用一致性正则化和伪标签法的结合来生成标签。为了充分利用标记数据和无标记数据，FixMatch\
  \ 重新定义了损失函数。该损失函数是监督损失和无监督损失的加权和。监督损失项是模型预测值与数据标签之间的偏差。监督损失 `l_s` 的定义如公式 7.9 所示。`x_i`\
  \ 是标记样本，`α` 是 `x_i` 的弱增强版本。`p_i` 是 `x_i` 标签的有效“独热”版本。函数 `p_m` 是模型的预测分布，`H` 是交叉熵函数。\n\
