  ### 4.3.3 分层强化学习\n\n分层强化学习（HRL）已成功应用于许多领域，例如机器人和游戏（Sutton et al., 1999）。通常，为了解决长周期任务，HRL\
  \ 被实现为一个高层智能体，定期为低层智能体分配子目标。事实证明，不同抽象层次具有不同的性能。*选项（options）*框架（Sutton et al., 1999）是最流行的架构之一，其中马尔可夫决策过程被扩展为半马尔可夫过程（SMDP）（Du\
  \ et al., 2020）。在层次结构的高层，智能体根据高层策略选择选项直到终止。在层次结构的低层，低层智能体根据低层策略选择一组动作以完成所选选项的任务。\n\
  \n\n\n\n根据层次强化学习（HRL）的定义，我们将 VNE 问题建模为半马尔可夫决策过程（SMDP）。首先，我们将 VNRs 和 SN 的状态编码为环境状态，智能体将根据该状态做出决策。对于每个过程，高层智能体根据高层策略选择一个可行的选项（即从基于窗口的批处理中选择一个\
  \ VNR），该选项具有最大的长期奖励。高层智能体并非同等且独立地对待所有 VNRs，上述描述的高层智能体（HEA）过程确保了算法具有前瞻性。然后，低层智能体根据低层策略执行一系列动作，以对\
  \ VN 进行嵌入。当一个选项或动作完成后，环境将给出反馈（即奖励），以鼓励智能体改进策略。接下来，更新环境状态。此过程重复，直到所有 VNRs 都处理完毕。基于上述设置，我们提出了一种新的基于\
  \ HRL 的 VNE 框架，如图图 4.3<math display=\"inline\" overflow=\"scroll\"><msup><mi>S</mi><mi>H</mi></msup></math>:\
  \ 高层状态 ![s Superscript h Baseline element-of upper S Superscript upper H](img/c04-i0060.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msup><mi>s</mi><mi>h</mi></msup><mo>&#8712;</mo><msup><mi>S</mi><mi>H</mi></msup></math>\
  \ 是表示高层环境状态的隐藏向量，它从窗口内的 VNRs 和底层 SN 中提取。\n*   **低层状态空间** ![upper S Superscript upper\
