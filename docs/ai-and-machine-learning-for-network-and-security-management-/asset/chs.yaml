  \ >#2 实验结果与分析\n\n我们通过多种实验评估了 OpenLog，包括使用未知类别数据的异常分类实验、使用不平衡数据的异常分类实验，以及使用少样本数据的异常分类实验。我们使用了两种现有的重要方法作为基准：基于\
  \ `Bi-LSTM` 和自注意力机制的深度学习方法 `LogRobust`（Zhang 等人，2019），以及基于 `SVM` 的传统机器学习方法 `LogClass`（Meng\
  \ 等人，2018）。在下文中，我们将介绍实验中使用的数据集、实验设置细节，并对实验结果进行分析。\n\n### ### 实验设计\n\n#### #### 基准方法\n\
  \n![图 8.11 基准方法。(a) LogRobust 和 (b) LogClass.](img/c08f011.png)\n\n**图 8.11** 基准方法。(a)\
  \ `LogRobust` 和 (b) `LogClass`。\n\n### ### 评估指标\n\n我们使用准确率（accuracy）、召回率（recall）、精确率（precision）和宏-F1\
  \ 分作为评估指标，衡量 OpenLog 在将已知异常进行多分类分类方面的性能。在二分类中，评估指标取决于真阳性（`TP`，表示预测正确的正样本数量）、真阴性（`TN`，表示预测正确的负样本数量）、假阳性（`FP`，表示预测错误的正样本数量）和假阴性（`FN`，表示预测错误的负样本数量）：\n\
