- "# 网络与安全管理中的人工智能与机器学习 (IEEE 网络与服务管理系列)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n8. 图 10.8 基于机器学习的监控和管理...\n\n# 指南\n\n1. ii\n2. iii\n3. iv\n\
  4. xiii\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n封面图片：© Bill Donnelley\n\n# 作者简介\n\n\
  `Yulei Wu` 是英国埃克塞大学环境、科学与经济学院计算机科学系的高级讲师。他的研究重点是网络、物联网、边缘智能、信息安全和伦理 AI。他担任 *IEEE\
  \ Transactions on Network and Service Management* 和 *IEEE Transactions on Network\
  \ Science and Engineering* 的副编辑，并担任 *Computer Networks*、*Future Generation Computer\
  \ Systems* 以及 Nature Portfolio 旗下 *Nature Scientific Reports* 的编辑委员会成员。他是 IEEE 和\
  \ ACM 的高级会员，以及 HEA（高等教育学院）会士。\n\n`Jingguo Ge` 现任中国科学院（CAS）信息工程学院教授，同时是中国中国大学网络安全学院教授。他的研究重点是未来网络架构、5G/6G、软件定义网络（SDN）、云原生网络、零信任架构。他已发表了\
  \ 60 多篇研究论文，拥有 28 项专利。他参与了 3 项关于 IMT2020 的 ITU 标准制定。\n\n`Tong Li` 现任中国科学院（CAS）信息工程学院高级工程师。他的研究和工程重点是计算机网络、云计算、软件定义网络（SDN）以及分布式网络和安全管理。他参与了\
  \ 2 项关于 IMT2020 的 ITU 标准，并在 SDN、网络管理和编排方面开发了许多大规模软件系统。\n\n# 前言\n\n随着网络技术的快速发展，通信网络已经历了四代，并在全球范围内部署第五代系统（5G）。5G\
  \ 的独特特征是能够在共享基础设施上容纳多样化的服务。这些服务不仅包括我们日常生活中使用的电信业务，还涵盖了支持许多重要垂直行业的广泛服务，包括能源、医疗、水务、制造业、环境等。这些服务主要分为三大类：增强型移动宽带（eMBB）、高可靠低延通信（URLLC）和海量机器类通信（mMTC）。全球范围内已经开始支持\
  \ eMBB 服务的 5G 部署，支持 URLLC 和 mMTC 的部署将在可预未来开始。同时，下一代通信系统（即超越 5G，B5G 或 6G）的研究已在全球范围内许多研究中心和小组启动。\n\
  \n为了满足运行在 5G/B5G/6G 基础设施上的多样服务的需求，许多网络和计算技术被纳入通信系统，包括可重构智能表面、毫米波/太兹链路、高容量回传连接、云原生、机器通信、边缘智能、区块链和量子计算。这立即导致了现代网络和通信系统复杂性的增加，其规模和范围是我们以前所未过的。这也显著提高了网络和服务的管理标准。由于网络安全是网络管理不可或缺的一部分，对网络管理的广泛理解应涵盖网络管理和安全管理。过去\
  \ 20 年里，为单个协议、应用和系统创建的闭式模型在网络和安全管理方面取得了成功。然而，如今的网络系统过于复杂，无法进行闭式分析。\n\n社区正在追求网络自动化，以促进网络和安全管理。人工智能（AI）和机器学习（尤其是深度学习）已广泛应用于许多领域，例如图像识别、计算机视觉以及自然语言处理，以增强相关任务的自动化。近年来，网络社区开始采用\
  \ AI 和机器学习技术以实现网络自动化的目标。由于今天网络系统的复杂性，要建立一个完全自主的系统是非常困难的。目前的领先水平在开发 AI 和机器学习模型以自动化网络和安全管理的某些任务方面取得了前景性的进展，包括网络规划和路由、资源分配和调度、加密流量分类、异常检测、零信任网络和安全运营。\n\
  \n本书涵盖了网络和安全管理的关键任务，并阐述了先进 AI 和机器学习如何改进网络自动化。它不仅从计算的角度解决问题，还探索了认知手段（如知识迁移）如何帮助网络和安全管理。网络自动化已成为网络和安全领域的紧迫问题。这本书对于网络工程师解决网络自动化问题非常有用，也可以作为大学教育的良好教材。这本书还可以帮助政策制定者理解网络自动化如何在网络和安全领域工作。\n\
