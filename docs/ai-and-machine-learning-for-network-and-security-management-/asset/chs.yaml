  \n# 11 结论与研究问题\n\n## 11.1 结论\n\n随着 5G、物联网（IoT）、工业物联网、云边缘计算以及工业 4.0 的快速发展，系统的复杂性、动态性和安全性显著增加。人工智能（AI）和机器学习（ML）在许多领域得到了应用。本书从三个维度对这一主题进行了深入探讨。\n\
  \n首先，在第 2 章中，我们阐述了机器学习赋能的网络和安全管理架构。在该架构下，我们研究了监督学习、无监督学习和强化学习等能够实现网络和安全自动化的潜在人工智能和机器学习技术。此外，我们调研了网络和安全管理的现有行业产品、标准和概念验证，以便读者有一个更好的视角。\n\
  \n其次，我们针对特定的网络和安全任务提出了一系列典型的 AI 机器学习解决方案，包括第 3 章的自主网络意图学习、第 4 章的基于层次强化学习的虚拟网络嵌入、第\
  \ 5 章的流量分析、第 6 章基于轻量化网络的加密流量分类、第 7 章上下文感知的鲁棒异常检测，第 8 章针对未知、不平衡和少标记数据的异常分类，以及第 9\
  \ 章的零信任网络。\n\n最后，在第 10 章中，我们展示了一个智能网络管理运营系统，并说明了如何采用人工智能和机器学习技术。\n\n## 11.2 研究挑战\n\
  \n在本节中，我们将提供并讨论网络和安全自动化领域的研究挑战和开放问题。\n\n### 11.2.1 自主网络\n\n*   如何统一不同任务推导出的意图表达是一个重要问题。某些意图适合从约束（如连通性）的角度表达，而其他任务则可能从性能（如\
  \ QoS）的角度描述。\n\n*   随着意图符号数量的增加，如何从巨大的符号空间中高效搜索符号结构将成为挑战。枚举所有结构是不现实的。通过结合先验分布和随机搜索可以缓解这个问题。先验分布用于优先尝试历史结构，随机搜索则用于采样而非尝试所有结构。\n\
  \n\n\n\n用户意图的表达接近自然语言，而如何将其自动翻译为相应的意图符号结构是一个挑战。随着从数据中学习和积累的意图符号结构越来越多，它们被存储在智能体的网络知识库中。当用户提出特定意图来执行任务时，智能体应该能够识别用户的意图并调用相应的符号结构，或使用现有的符号形成新的任务结构。这个问题可能涉及自然语言处理方法，例如序列到序列（sequence-to-sequence）方法。输入是用户的意图语言序列，输出是实现从用户意图语言到符号结构的意图符号序列。\n\
  \n### 11.2.2 强化学习驱动的解决方案\n\n强化学习（`RL`）已广泛应用于网络自动化。在本节中，我们将虚拟网络嵌入（`VNE`）作为一个典型示例来说明潜在的挑战。\n\
  \n*   `RL`的奖励函数很难定义。在`RL`中，智能体根据返回的奖励改进其策略，奖励函数通常是手动定义的。大多数现有工作（Yan 等，2020，Wang\
  \ 等，2019，2018b）。建立真实网络的资源消耗过大，且互联网服务商（`ISP`）不愿在整个生产网络中使用所提算法。这个问题取决于现实情况和客观条件，迫切需要一个结合现实与仿真环境的令人信服的框架。此外，所提算法还需要更多考虑实现细节以增强其部署性能。\n\
  \n*   基于`RL`的算法（如`VNE`算法）尚未得到详细的验证。例如，基于`RL`的算法通常在仿真用例的中型`ISP`中进行验证（Yan 等，2020）。由于`VNE`问题的复杂性，缺乏用于验证的大型`ISP`仿真环境。有少数工作（Yan\
  \ 等，2020）提出了自动方法，但其有效性无法得到验证。一个令人信服的数据集是迫切需求，其有效性也应该通过详细的方式进行验证。这样就可以用更合适比较不同的算法，并轻松识别它们的优缺点。\n\
  \n*   现有的流量分类方法缺乏对现实情况的考虑。在基于`AI`的模型中，分类标签是固定的，这在现实世界中并不适用，因为总是存在未知的流量类别。一方面，应该尽早识别未知流量；另一方面，应该对未知流量进行正确的分类标记。Zhang\
  \ 等（2020）提出了一种分类未知流量的模型，但未能确定真实流量的标签。具体来说，该模型首先识别未知流量，然后使用`![k](img/c11-i0001.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>k</mi></mrow></math`-means 方法对其进行聚类。然而，类别的数量和具体类别是未知的。因此，应该详细地利用一种更具体的未知流量分类模型，将未知流量分类到正确的类别中。\n\
  \n*   细粒度流量分类尚未得到妥善解决。例如，存在应用层分类方法，但应用内部的流量分类（例如应用的不同功能）尚未开发。通常，流量分类是基于以下因素的：（1）协议（例如`HTTP`、`SSL`、`SMTP`、`DNS`或`QUIC`）；2）流量类型（例如视频、聊天或浏览）；3）应用（例如`Amazon`、`Apple`、`Microsoft`或`Google`）；以及（4）网站。需要更精细的分类来进一步提高`QoS`。\n\
  \n### 11.2.4 异常检测可以使用多种类型的数据，包括时间数据、空间数据、时空数据和图数据。日志数据作为时空数据的典型示例，已广泛应用于系统的异常检测。在接下来，我们主要提供关于利用日志数据进行异常检测的一些挑战。\n\
  \n*   日志解析负责从日志中提取参数并将每条日志消息转换为日志事件。它可以实现日志分析的自动化。然而，大多数现有日志异常检测方法丢弃了提取的参数。如果能合理利用这些参数，异常检测可以得更准确。\n\
  \n*   日志异常检测的研究侧重于训练一个在多个数据集上表现良好的模型。然而，在真实的生产环境中，操作者倾向于在特定的数据集上表现更好。为了实现这一点，我们可以结合不同的方法进行异常检测，而不是使用单一方法。例如，我们可以结合阈值设置、正则表达式匹配、机器学习和深度学习方法来进行异常检测。\n\
  \n*   日志向量化是异常检测中的一个重要过程。通常，我们使用现成的词嵌入矩阵或在模型训练的同时训练词嵌入矩阵。然而，在真实的生产环境中，加载词嵌入文件需要大量的时间内存空间。在模型训练的同时训练词嵌入矩阵会增加总训练时间并可能导致过拟合。我们可以考虑使用压缩技术减少内存消耗，并使用分布式技术提高加载速度，解决单节点内存限制的问题。\n\
  \n### 11.2.5 零信任网络\n\n\n\n\n\n*   在执行授权和认证时为了做出最全面的决策，零信任网络中需要收集大量的服务、流量和设备日志。因此，设计合理的数据收集机制至关重要。然而，目前的数据方案仍存在许多问题。例如，在收集网络流量时，许多方案无法保证高高速流量采集的丢包率。此外，当零信任网络需要在联邦环境中从其他组织获取信息时，如何确保数据隐私也需要进一步考虑。在收集数据后，如何高效、安全且去冗地管理这些数据也至关重要。\n\
  \n*   认证和授权是零信任网络的核心。然而，传统的认证和授权方案仅在用户登录阶段执行，并不适用于零信任网络，因为用户的状态和环境可能会随时变化，原本安全的环境可能会变得不安全。因此，有必要设计持续认证和授权机制。同时，为了减少认证授权过程中的计算开销和延迟，持续认证算法应尽可能轻量且易于部署。\n\
  \n*   在收集信息并捕访问请求后，零信任网络中的策略引擎必须对主体是否有权访问对象做出决策。基于机器学习的策略引擎必须仔细设计。例如，为了克服网络中不确定的噪声和抖动，应该在确保安全的基础上提高模型的鲁棒性。此外，为了维持系统的可用性，还应该仔细分析错误拦截的数量和原因。\n\
