  | NetworkML | IQTLabs | 节点识别 | 322 |\n| Credential‐Digger | SAP | 数据保护 | 156 |\n\
  | ART | Trusted‐AI | ML 安全 | 2500 |\n\n### 2.8.1 Poseidon\n\n为了提高识别节点身份（基于捕获的 IP\
  \ 头部数据）的准确性，并为 SDN 环境下的其他用例提供 `ML` 技术，引入了 Poseidon。\n\n`Poseidon` 是一个可以基于 `python`\
  \ 实现轻松扩展的平台。它可以为网络中添加或删除的项目和流量提供上下文感知能力。它利用 `ML` 技术检查网络上的交互活动，通过学习来跟踪和阻止各种与恶意活动相关的行为。在初步测试中，`Poseidon`\
  \ 的恶意活动检测率达到了 84%，而误报率仅为 2.2%。\n\n![图 2.5 Poseidon 的处理流程。](img/c02f005.png)\n\n\
  `图 2.5` Poseidon 的处理流程。\n\n![图 2.6 NetworkML 的处理流程。](img/c02f006.png)\n\n`图 2.6`\
  \ NetworkML 的处理流程。\n\n### 2.8.2 NetworkML\n\n为了将每个设备分类到特定的功能角色，`IQTLabs` 实现了 `NetworkML`。\n\
  \n如图 2.6 所示，以单个设备的网络流量作为输入，`NetworkML` 使用来自 `scikit‐learn‐package` 的前馈神经网络来预测网络连接设备的功能角色。使用单个设备的网络流量意味着意味着该设备在给定时间段发送和接收的所有包。此外，在默认配置中，`NetworkML`\
  \ 具有 11 种角色：活动目录控制器、管理员服务器、管理员工作站、confluence 服务器、开发者工作站、分布式文件共享、exchange 服务器、图形处理器单元（GPU）笔记本电脑、github\
  \ 服务器、公钥基础设施（PKI）服务器和打印机。\n\n该项目中的 `NetworkML` 可以通过 `Docker` 或在 `Linux` 主机上独立运行。此外，为了避免与数据隐私相关的问题，`NetworkNL`\
  \ 只使用包头来预测功能角色。\n\n### 2.8.3 Credential‐Digger\n\n在数据保护领域，最关键的威胁之一是开源项目中的硬编码（或明文）凭据。虽然已经有多种工具可以检测开源平台上的泄露，但凭据的多样性（取决于多个因素，如编程语言、代码开发规范或开发者个人习惯）是这些工具有效性的瓶颈。由于缺乏精度，导致大量代码被错误地检测为泄露的密钥。被错误检测为泄露的数据被称为误报数据，构成了目前可用工具检测数据的绝大部分。因此，`SAP`\
  \ 实现了 `Credential‐Digger`。\n\n如图 2.7 所示，`Credential‐Digger` 以代码路径作为输入，确定代码中是否存在证书或密码泄露。它首先使用包含\
  \ `regex` 的规则来寻找所有可能的泄露，然后使用 `ML` 模型进行误报检测。它有三种模型，即路径模型、片段模型和相似性模型。\n\n*   `路径模型\
  \ (Path models)`。`路径模型` 根据文件路径将文件分类为误报。`路径模型` 首先处理文件路径以提取路径中包含的所有单词。然后，将每个单词转换为其词根。最后，使用单词词根进行\
  \ `ML` 分类。\n*   `片段模型 (Snippet model)`。`片段模型` 根据其代码片段（即提交中检测为可能泄露的代码行）将发现结果分类为误报。`片段模型`\
  \ 的目标是分类误报密码（它也可以用于令牌，但其精度较低）。\n*   `相似性模型 (Similarity model)`。无论分类器有多健壮，分类错误的片段实例将始终是一个现实。因此，在片段模型处理文件后，审核人员将验证代码片段是否分类正确。通常，这些分类错误的片段彼此之间存在相似性。在手动将某个片段更新为新状态后（例如从“泄露”到“误报”），`相似性模型`\
  \ 能够自动检测仓库中的相似片段并相应更新其状态，这为用户节省了大量时间。\n\n除了本地文件和目录，`Credential‐Digger` 还支持扫描在线本地仓库。此外，该项目非常容易扩展，我们可以根据需要添加规则和模型。\n\
  \n![图 2.7 Credential‐Digger 的处理流程。](img/c02f007.png)\n\n`图 2.7` `Credential‐Digger`\
  \ 的处理流程。\n\n### 2.8.4 Adversarial Robustness Toolbox\n\n对抗鲁棒性工具箱 (`ART`)\n\n尽管该项目没有专门用于网络安全和管理领域，但由于网络中大量的噪声样本导致数据难以保证，该项目仍然可以在网络安全领域发挥巨大作用。事实上，许多研究人员已开始研究网络入侵领域的恶意样本（Madani\
  \ and Vlajic, 2018）。\n\n除了上述项目，还有一些项目支持 `ML` 技术在网络中的应用，例如 MIST。\n\n## 2.9 网络与安全管理的概念验证\n\
  \n随着 `ML` 技术的不断发展，越来越多的研究人员开始使用它们来解决网络安全和网络管理问题。同时，他们经常会将实验代码作为概念验证开源。\n\n### 2.9.1\
  \ 分类\n\n如图 2.8 所示，分类系统可以根据特征对各种数据源进行分类。在网络安全和网络管理领域，数据源可以是数据包、主机日志、流量信息等。分类模型可以作为恶意\
  \ URL 检测、恶意 DAG 检测、入侵检测和流量分类系统的核心。\n\n![图 2.8 分类的处理流程。](img/c02f008.png)\n\n`图 2.8`\
  \ 分类的处理流程。\n\n\n\n\n随着网络攻击技术的不断更新，传统的基于规则的入侵检测系统中的规则数量变得越来越繁杂。此外，在零日攻击检测方面，基于规则的入侵检测系统具有天然劣势。因此，近年来，越来越多的研究人员尝试使用基于机器学习（ML）的入侵检测系统进行安全防护。\n\
  \n在网络入侵检测系统中，\n\n在 Web 攻击检测系统中，\n\n### 2.9.2 主动学习\n\n在监督和半监督学习过程中，需要对训练数据进行标注。然而，在许多实际领域，标注所有数据将产生巨大的成本并导致人力浪费。例如，在异常检测领域，安全专家通常只对一小部分异常数据感兴趣。Anaël\
  \ 等人在 Beaugnon 等人 (2017) 中提出了 `ILAB: An Interactive Labelling Strategy for Intrusion\
  \ Detection`（入侵检测交互式标注策略），并提供了一个开源实现![图 2.9 主动学习的处理流程。](img/c02f009.png)\n\n图 2.9\
  \ 主动学习的处理流程。\n\n主动学习的工作流如图图 2.9 所示。首先，通过初始标注数据训练检测模型。之后，系统开始工作，未标注的数据被放入未标注池。然后，通过主动学习从未标注池中选择具有代表性的样本并提供给专家进行标注。最后，在专家完成对选定数据的标注后，标记数据将用于训练检测模型。\n\
  \n为了克服采样偏差问题，`ILAB` 在选择数据时同时考虑了不确定性和稀有性。因此，`ILAB` 能够找到那些稀有的恶意样本。结果，与其他方案相比，`ILAB`\
  \ 可以选择具有更高训练价值的样本。\n\n### 2.9.3 概念漂移检测\n\n随着网络和信息技术的快速发展，流量分类受到了广泛关注，并在入侵检测、流识别等领域起着重要作用。在标准的机器学习框架中，数据通常以离线方式进行处理。由于网络流量、日志和数据包通常是持续生成的，网络领域的数据通常被视为流。因此，底层数据分布可能会发生变化，并严重降低机器学习模型的性能，这被称为概念漂移。\n\
  \n为了克服概念漂移的发生并保持机器学习模型的性能，研究人员提出了许多概念漂移检测器。如图图 2.10 所示，一旦检测到概念漂移，就会触发模型更新阶段。在名为“概念漂移”的原型系统中，![图\
  \ 2.10 克服概念漂移的处理流程。](img/c02f010.png)\n\n图 2.10 克服概念漂移的处理流程。\n\n## 2.10 结论\n\n本章介绍了学术界和工业界网络及安全管理的现状。我们提供了人工智能（AI）和机器学习（ML）的基本分类，并简要介绍了不同类型的机器学习技术如何赋能网络和安全管理。最后，我们总结了网络与安全管理中\
  \ AI 和机器学习的相关产品、标准和概念验证。\n\n## 参考文献\n\n1. Anaël Beaugnon, Pierre Chifflier, and\
