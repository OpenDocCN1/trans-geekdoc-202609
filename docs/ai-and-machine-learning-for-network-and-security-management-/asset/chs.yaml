  \n### 6.5.2 基准测试\n为了验证我们模型的有效性，我们从准确率、精确率、召回率和 F1 分数方面将该模型与以下基准进行比较。对于模型效率，我们与基准模型在平均训练时间和平均测试时间上对我们的模型进行了了比较。\n\
  \n\n\n\n*   1D‐CNN 模型：该模型由 Wang 等（2017c）提出。该方法将特征选择、特征提取和分类器集成到一个基于 1D‐CNN 的统一端到端框架中，旨在自动学习原始输入与预期输出之间的非线性关系。据我们所知，这是首次用于加密流量分类的端到端方法。\n\
  \n*   带有 LSTM 的 CNN 模型：该模型在 Zou 等（2018）中引入，并用于比较多头注意力机制和 RNN 在流特征提取方面的有效性。需要注意的是，在\
  \ Zou 等（2018）中，卷积网络被用于提取单个数据包的包特征。长短期记忆（LSTM）单元被训练用于提取流特征，且模型还将一个流的三个连续数据包作为输入。\n\
  \n*   带有迁移学习的 Bi‐GRU 模型：该工作在 Liu 等（2020）中展示，其利用双向门控循环单元（Bi‐GRU）对包交互进行建模。在输入方面，模型选择了流中的三个数据包，每个数据包包含\
  \ 900 字节。此外，采用注意力机制根据特征对分类的贡献为特征分配权重。Liu 等（2020）中的 Bi‐GRU 网络已被证明是加密流量分类的最先进深度学习方法。\n\
  \n### 6.5.3 数据集\n\n使用了两个数据集来验证 LightNet 的性能。数据集 A 包含所有方向的流（即从客户端到服务器以及从服务器到客户端）。数据集\
  \ B 仅包含从客户端到服务器的流。\n\n*   数据集 A（Shbair, 2016）由洛林大学发布，通过爬取两个周的 HTTPS 网站构建。数据集 A 的详情所示于\
  \ 表 6.1。该数据集包含通过 Google Chrome 和 Mozilla Firefox Web 浏览器访问的前 779 个 HTTPS 网站的 PCAP\
  \ 文件。为了简化训练过程，我们删除了特殊字符（例如破折号和数字）。最后，选择了流数量超过 1000 个应用程序用于实验，包含 47 个类和 84,245 条流。\n\
