  \ 年。doi: 10.1109/TCCN.2020.296615。\n\n# 8 针对未知、不平衡和少标记数据的异常分类\n\n## 8.1 引言\n\n随着物联网、5G\
  \ 和云计算的发展，系统规模正在迅速增长。在这种背景下，异常变得更容易出现，并会影响服务质量和系统的稳定性。为了维持系统性能，网络运营商采用各种异常分类技术来监控系统状态、识别异常，并增强系统可靠性。\n\
  \n有效的异常分类方法需要依赖于丰富的系统数据。与其它数值数据（如系统性能指标 `KPI`，例如 CPU 利用率和内存利用率）相比，日志为异常分类提供了更有有用的描述性信息。例如，当\
  \ CPU 利用率急剧上升时，系统可能出现了异常。然而，`KPI` 值不足以判断是否存在异常。因此，日志可以帮助发现影响 CPU 利用率的特定事件。此外，日志是自然语言序列，它们不仅可以表示单点异常，还能显示集体异常。\n\
  \n随着 AI 科技的发展和大数据平台的推广，开发了许多基于机器学习技术的日志异常分类方法。Lin 等人（2016）提出了一种基于凝聚层次聚类（AHC）算法的无监督日志识别方法\
  \ LogCluster，并将其应用于真实的在线服务系统。Pande 和 Ahuja（2017）提出了一种基于跳字模型（SG）和词袋模型（CBOW）的异常分类词嵌入方法\
  \ WEAC。Meng 等人（2018）提出了一种基于正样本-未标记（PU）学习和支持向量机（SVM）的数据驱动系统 LogClass，以解决设备无关词汇和部分标记的问题。Zhang\
  \ 等人（2019）提出了一种基于词嵌入和长短期记忆网络（LSTM）的日志分析方法 LogRobust，使其具有鲁棒性。\n\n然而，现有的基于日志的异常分类方法仍然存在局限性。下文详细说明这些局限性。\n\
  \n首先是特征提取的局限性。某些现有方法需要从训练数据集中提取日志事件（日志消息模板）和日志序列（记录特定执行流的一系列日志事件）来构建分类模型。其他方法需要预建立词典，然后通过统计词频率构造特征向量。它们无法处理未见的日志事件和序列。然而，真实的日志是不稳定的，由于系统升级，经常会出现新的相似日志事件和序列。\n\
  \n其次是少样本问题的局限性。大多数基于机器学习的异常分类方法依赖于大规模、平衡且带标签的训练数据集，这在真实系统中很难构建。一方面，在真实系统中获取此类数据需要巨大的精力；另一方面，与正常系统运行日志相比，异常日志的发生频率较低。某些异常只发生几次且难以复制。我们可能会面临少样本问题，即每个类别仅包含极少数样本，这使得机器学习模型的训练变得困难。\n\
  \n## 注：本章基于我们先前的发表成果编写。\n\n\n\n\n\n第三，闭世界假设的局限性（Fei and Liu, 2016）。大多数基于机器学习的异常分类方法都遵循闭世界假设，专注于在实验假设下设计准确的分类器。基于日志的异常分类方法中的闭世界假设包括数据类别、数据规模和数据平衡的“封闭”。闭合”数据类别意味着所有测试类别在训练时都是已知的。“闭合”数据规模是指目标系统包含足够的训练数据。“闭合”数据平衡意味着训练数据集中的每个数据类别包含相似数量的样本。然而，基于日志的异常分类是一个开放世界问题（Xu\
  \ et al., 2019）。理想的模型不仅需要面对少量的不平衡数据，还需要在不重新训练的情况下增量地学习未知类别。然而，监督机器学习模型具有固定的结构和参数。它们对数据敏感，会将未知的异常数据归类为错误的已知类别。\n\
  \n为了解决上述问题，本章提出的 OpenLog 方法包含了一些探索性工作。针对特征提取的局限性，我们使用了多级语义模型，挖掘日志的语义、结构和序列信息。针对少样本问题的局限性，我们对从其他系统获取的辅助数据集使用多任务训练策略，以增强分类模型的性能，使其具备处理小样本的能力。针对闭世界假设的局限性，我们尝试将多分类任务转换为学习样本间深度关系的二分类任务，以便模型能够检测并分类新类别。\n\
  \n我们将具有不断增加类别且样本较少的不平衡数据称为“开放”数据，并使用此类数据验证 OpenLog。我们通过三种实验将 OpenLog 与两种先进的异常分类方法\
  \ LogRobust 和 LogClass 进行对比，以证明 OpenLog 的优越性。\n\n本章其余部分的结构如下：在 8.2 节中，我们将介绍日志分析中不同的特征提取方法、少样本问题以及示例学习策略策略以帮助读者更好地理解这些概念。在\
  \ 8.3 节中，我们将描述提出的 OpenLog 框架，包括问题定义、数据预处理和我们方法的架构。在 8.4 节中，我们将详细描述我们的实验并分析结果。在 8.5\
  \ 节中，我们将讨论所提方法的缺点和进一步展望。在 8.6 节中，我们将总结本章。\n\n## 8.2 示例\n\n### 8.2.1 日志分析的特征提取\n\n\
  如图 8.1 和 8.2 所示，日志是由日志语句生成的半结构化自然语言序列，用于描述系统的状态和行为。一个日志由日志头和日志内容组成。日志头是固定的具有特定格式，包括时间戳、级别、组件等。日志内容是由人员编写的灵活文本，包括描述文本和变量。日志通常由大数据平台收集，例如\
  \ Kafka ![图 8.1 日志的组成部分.](img/c08f001.png)\n\n`图 8.1` 日志的组成部分。\n\n不同的日志分析任务对日志的组件有不同的要求。例如，传统的基于搜索的日志分析方法可以通过在大规模数据中搜索日志级别来关注特定的特定的系统事件并忽略其他无关或冗余的事件（Gulcu,\
  \ 2003）。大多数基于机器学习的日志分析方法需要日志内容的描述文本来分析系统行为、检测并预测异常（Zhang et al., 2019）。\n\n![图 8.2\
  \ 日志记录与日志收集。](img/c08f002.png)\n\n`图 8.2` 日志记录与日志收集。\n\n为了适应不同的日志分析任务，日志的特征提取非常重要。近年来，日志分析中常见的日志特征提取分为统计特征提取和语义特征提取。\n\
  \n#### 8.2.1.1 统计特征提取\n\n日志由人员编写的日志语句生成，用于记录重要的行为和事件。日志中的描述文本是固定部分，我们称为 `log event`\
  \ 或 `log template`。日志分析的统计提取方法之一是创建计数矩阵（He et al., 2016）。如图 8.3 所示，首先我们需要将原始日志切分成一组日志序列。有切分策略，包括\
  \ `fixed window`、`sliding window` 和 `session window`。然后，对于窗口中的每个日志序列生成一个计数向量，表示每个事件出现的次数。所有特征向量共同构成一个特征矩阵，即计数矩阵。\n\
  \n![图 8.3 创建计数矩阵的流程。](img/c08f003.png)\n\n`图 8.3` 创建计数矩阵的流程。\n\n另一种统计特征提取方法基于词袋模型（Wu\
  \ et al., 2008）。每个向量组件被分配一个与日志单词估计重要性（称为权重）相关的值（Soucy and Mineau, 2005）。其中，最常用的权重表达式是词频-逆文档频率\
  \ (`TF-IDF`)。`TF` 表示单词在文档中的频率。`IDF` 显示单词在所有文档中的稀有程度。`TF-IDF` 的数学表达式如下：\n\n(8.1)![upper\
  \ T upper F minus upper I D upper F equals t f Subscript i comma j Baseline times\
  \ l o g left-parenthesis StartFraction upper N Over d f Subscript i Baseline EndFraction\
  \ right-parenthesis](img/c08-math-0001.png)\n```\n<math display=\"block\" overflow=\"\
  scroll\">\n<mi>T</mi><mi>F</mi><mo>&#8722;</mo><mi>I</mi><mi>D</mi><mi>F</mi><mo>=</mo><mi>t</mi><msub><mrow><mi>f</mi></mrow><mrow><mi>i</mi><mo>,</mo><mi>j</mi></mrow></msub><mo>&#215;</mo><mi>l</mi><mi>o</mi><mi>g</mi><mo\
  \ stretchy=\"false\">(</mo><mfrac><mrow><mi>N</mi></mrow><mrow><mi>d</mi><msub><mrow><mi>f</mi></mrow><mrow><mi>i</mi></mrow></msub></mrow></mfrac><mo\
  \ stretchy=\"false\">)</mo>\n</math>\n```\n\n\n\n\n其中 $f_{i,j}$ 是单词 $i$ 在文档 $j$\
  \ 中的出现次数，$d_i$ 是包含单词 $i$ 的文档数量，$N$ 是文档总数。\n\n### 8.2.1.2 语义特征提取\n\n统计特征提取具有某些局限性。例如，为了创建事件计数矩阵，我们需要提前切分日志序列并固定日志事件的数量；为了创建加权特征矩阵，我们需要提前构建字典并统计词频。这种特征提取方法对于之前未过的日志事件和日志序列失效。随着自然语言处理（NLP）的发展，基于词嵌入的语义特征提取已被广泛使用。词嵌入是一种基于大量预训练的特征提取方法。常见的词嵌入方法包括\
  \ word2Vec（Mikolov et al., 2013）、GloVe（Pennington et al., 2014）、Bert（Vaswani et\
  \ al., 2017a）等。词嵌入通过在大规模语料库上学习，为每个单词提供向量表示。语义相似的单词彼此距离较近，而不相似的单词则更容易被区分。在此基础上，日志由所有单词的平均/加权平均语义向量表示，或者通过固定维度的所有单词向量拼接表示，这不会随日志事件和日志序列而改变。\n\
  \n### 8.2.2 少样本问题\n\n机器学习模型的目标是最小化预测误差，预测误差是根据假设函数 $h$ 的预测值与真实值之间的差距。通常，可以通过在大量示例\
  \ $I$ 上进行训练并学习合适的 $h$ 来减少误差，如图 8.4(a)所示，其中 $\\hat{h}$ 是一个最小化所有数据（包括训练数据、验证数据和测试数据）预测值与真实值差距的假设函数。$h^*$\
  \ 是假设空间中的一个函数，最小化所有数据预测值与真实值的差距。$h_I$ 是假设空间中的一个函数，最小化训练数据预测值与真实值的差距。因此，机器学习模型的目标是在训练数据上学习尽可能接近\
  \ $h^*$ 的 $h_I$。然而，当机器学习模型遇到少样本问题时，可用示例 $I$ 的数量很少。此时很难学习到合适的假设函数并获得可接受的误差，如图 8.4(b)所示。\n\
  \n![图 8.4 充足样本与少样本训练的学习对比。(a) 大 $I$ 和 (b) 小 $I$。](img/c08f004.png)\n\n**图 8.4**\
  \ 充足样本与少样本训练的学习对比。(a) 大 $I$ 和 (b) 小 $I$。\n\n为了解决由训练样本少导致的少样本问题，提出了基于先验知识的少样本学习。少样本学习通常从图\
  \ 8.5 所示的三个方面缓解少样本问题，包括数据、模型和算法。\n\n![图 8.5 少样本学习解决少样本问题的不同策略。(a) 数据、(b) 模型和(c)\
  \ 算法。](img/c08f005.png)\n\n**图 8.5** 少样本学习解决少样本问题的不同策略。(a) 数据、(b) 模型和(c) 算法。\n\n\
  *   数据。基于数据的策略利用先验知识来增强训练数据，如图 8.5(a)所示。常见方法包括数据增强（Kozerawski and Turk, 2018），Santoro\
  \ et al., 2016）和数据转换（Pfister et al., 2014），Liu et al., 2018）。\n*   模型。基于模型的策略利用先验知识来约束假设空间的复杂度，如图\
  \ 8.5(b)所示。例如，灰色区域不考虑优化，因为根据先验知识，它们不太包含最优假设函数。常见方法包括多任务学习（Hu et al., 2018），Luo et\
  \ al., 2017）和嵌入学习（Triantafillou et al., 2017）。\n*   算法。基于算法的策略利用先验知识来搜索参数最佳假设函数的参数集，如图\
  \ 8.5(c)所示。先验知识通过提供良好的初始化或引导搜索步骤来改变搜索策略。\n\n## 8.3 方法论\n\n### 8.3.1 数据预处理\n\n日志是非结构化数据，具有不同类型的组件，包括*文本*（常量字符串）、*数值*（如\
  \ IP 地址和端口号等变量）以及其他*特殊结构*，如驼峰命名变量（如 `isCommittable`）。因此，在进行日志分析之前，我们需要执行数据预处理以获取结构化的日志信息。\n\
  \n![图 8.6 使用深度为 3 的 Drain 的日志解析树](img/c08f006.png)\n\n**图 8.6** 使用深度为 3 的 Drain\
  \ 的日志解析树。\n\n#### 8.3.1.1 日志解析\n\n\n\n\n\n日志解析可以将每条日志消息转换为与关键参数相关的特定日志模板。在解析后的日志模板中，自然语言文本表示常量标记，即一个日志事件。OpenLog\
  \ 采用了日志解析器 `Drain`（一种基于在线日志解析方法的固定深度树）（He 等人，2017）来进行日志解析。`Drain` 是一种具有固定深度树的在线日志解析器，它为解析编码了专门设计的规则，如图\
  \ 8.6 所示。基于解析树的日志解析过程如下：\n\n1. **日志分段**。通过预定义的正则表达式，提取原始日志信息并将其分为不同的组件，包括时间戳、级别、组件等。\n\
  2. **按长度搜索**。解析树的第一层节点代表日志消息长度不同的日志组。例如，原始日志“PacketResponder for block blk\\_123”的长度为\
  \ 4，它应该遍历到内部节点“Length: 4”。\n3. **按前缀标记搜索**。这一步基于这样一个假设：日志消息起始位置的标记更有可能是常量。例如，对于日志消息“Receive\
  \ from node 4”，`Drain` 从第一层节点“Length: 4”遍历到第二层节点“Receive”，因为日志消息第一个位置的标记是“Receive”。\n\
  4. **按标记相似性搜索**。在此步之前，`Drain` 已经遍历到了叶子节点，该节点包含一个日志组列表。在此步中，`Drain` 通过标记相似性从日志组列表中选择最合适的日志组。\n\
  5. **更新解析树**。如果新日志发现了合适的日志组，则将更新相应的日志模板。`Drain` 扫描日志消息和日志模板相同位置的标记。如果两个标记相同，则我们不修改该位置的标记。否则，我们在日志模板中用\
  \ `*` 更新该位置的标记。如果日志没有找到合适的日志组，则根据日志创建一个新的日志组。该日志组的日志模板就是日志本身。\n\n`Drain` 的在线版本用于解析原始日志消息。也就是说，它处理的是日志条目而不是日志文件，因此同一个日志事件在不同的可能会有不同的解析结果，这在某种程度上可以模拟由于系统升级或处理噪声导致的日志演变和变化。我们将解析后的日志事件视为一个句子\
