  \ | Arkime（原名 Moloch）是一个开源的大规模全数据包捕获、索引和数据库系统 |\n\n### 10.3.2.3 渗透测试\n\n渗透测试是一种通过模拟恶意黑客的攻击方法来评估计算机网络系统安全性的方法。该过程涉及对系统中任何弱点、技术缺陷或漏洞进行主动分析，这些攻击者可能从这些位置进入并主动利用漏洞。渗透测试是指渗透人员通过各种手段对不同位置（例如内部网络、外部网络）的特定网络进行测试，以发现并挖掘系统漏洞，然后输出渗透测试报告并提交给网络所有者。根据渗透者提供的渗透测试报告，网络所有者可以清楚地了解系统中存在的安全风险和问题。各种渗透测试开源工具列在表\
  \ 10.4 中。\n\n**[表 10.4]](#c10.xhtml#R_c10-tbl-0004)** 渗透测试相关工具。\n\n| 名称 | 语言 | 链接\
  \ | 描述 |\n| --- | --- | --- | --- |\n| DockerSecurityPlayground | JavaScript | [`github.com/giper45/DockerSecurityPlayground`](https://github.com/giper45/DockerSecurityPlayground)\
  \ | 一个用于研究网络安全和渗透测试技术的微服务框架 |\n| RouterSploit | Python | [`github.com/threat9/routersploit`](https://github.com/threat9/routersploit)\
  \ | RouterSploit 框架是一个专门用于嵌入式设备的开源利用框架 |\n| Astra | Python | [`github.com/flipkart-incubator/Astra`](https://github.com/flipkart-incubator/Astra)\
  \ | 由于现有 API 和新添加 API 的持续变化，REST API 渗透测试非常复杂 |\n| OWTF | Python, js | [`github.com/owtf/owtf`](https://github.com/owtf/owtf)\
  \ | 攻击性 Web 测试框架 (OWTF) 是一个试图整合优秀工具并使渗透测试更高效的框架 |\n| BeEF | Js,ruby | [`github.com/beefproject/beef`](https://github.com/beefproject/beef)\
  \ | BeEF 是浏览器利用框架的缩写。它是一个专注于 Web 浏览器的渗透测试工具 |\n| DELTA | Java | [`github.com/seungsoo-lee/DELTA`](https://github.com/seungsoo-lee/DELTA)\
  \ | DELTA 是一个渗透测试框架，为各种测试用例重新生成已知的攻击场景 |\n| ShuoGuang | Java | [`github.com/iSafeBlue/TrackRay`](https://github.com/iSafeBlue/TrackRay)\
  \ | 数字光（ShuoGuang）是一个集成了已知安全工具的开源框架\n\n###10.2.4 漏洞扫描\n\n漏洞扫描是基于漏洞数据库（渗透攻击）对指定的远程或本地计算机系统进行安全检查的重要手段，通过防火墙和入侵检测系统有效地发现安全漏洞。网络所有者根据扫描结果修复安全漏洞并防止黑客攻击。通过漏洞扫描技术可以在黑客攻击发生前采取预防措施。表\
  \ 10.5 提供了与漏洞扫描相关的安全工具。\n\n**[表 10.5]](#c10.xhtml#R_c10-tbl-0005)** 漏洞检测相关工具。\n\n\
  | 名称 | 语言 | 链接 | 描述 |\n| --- | --- | --- | --- |\n| XunFeng | Python | [`github.com/ysrc/xfeng`](https://github.com/ysrc/xfeng)\
  \ | 迅风是一个用于企业内网的快速应急响应扫描系统 |\n| Nikto | Perl | [`github.com/sullo/nikto`](https://github.com/sullo/nikto)\
  \ | Nikto 是一个开源 Web 服务器扫描器 |\n| OWASP JoomScan | Perl | [`github.com/OWASP/joomscan`](https://github.com/OWASP/joomscan)\
  \ | OWASP Joomla! 漏洞扫描器 是一个开源项目，旨在实现 Joomla 部署的漏洞检测和可靠性保障 |\n| Archery | Python\
  \ | [`github.com/archerysec/archery`](https://github.com/archerysec/archery) | Archery\
  \ 是开源漏洞评估管理工具，帮助开发人员和渗透人员进行扫描和漏洞管理 |\n| EKTotal | PHP | [`github.com/nao-sec/ektotal`](https://github.com/nao-sec/ektotal)\
  \ | EKTotal 是一个可以自动分析驱动攻击流量的集成分析工具 |\n| Insight | js | [`github.com/creditease-sec/insight`](https://github.com/creditease-sec/insight)\
  \ | Insight 是安全部门用于对公司系统漏洞进行在线全生命周期管理的平台 |\n| Metasploit | Ruby | [`github.com/rapid7/metasploit-framework`](https://github.com/rapid7/metasploit-framework)\
  \ | Metasploit 是一个开源安全漏洞检测工具 |\n| OpenVAS | C | [`github.com/greenbone/openvas-scanner`](https://github.com/greenbone/openvas-scanner)\
  \ | 这是 Greenbone 漏洞管理 (GVM) 解决方案的开放漏洞扫描器 (OpenVAS) |\n\n\n\n\n\nCI/CD 是一种通过在应用程序开发阶段引入自动化向客户频繁交付应用程序的方法。CI/CD\
  \ 的核心概念是持续集成、持续交付和持续部署（Poth et al., 2018）。作为开发和运维团队的解决方案，CI/CD 解决了集成新代码时出现的问题。具体而言，CI/CD\
  \ 实现了整个应用程序生命周期（从集成和测试阶段到交付和部署）的持续自动化和监控。\n\n然而，CI/CD 也有其安全影响。传统的 CI/CD 流线使用了大量工具，因此不可避免地存在某些漏洞，这些漏洞成为了网络攻击的入口。由于开发人员的疏忽，代码中也存在潜在的缺陷。代码开发应遵循某些规范，以防止敏感信息和敏感文件的泄露。企业需要定期审计管道和代码，以始终保持高水平的安全防护。这些努力可以通过降低网络攻击的概率。为了确保代码安全并防止敏感信息泄露，表\
  \ 10.6 列出了若干开源安全工具。\n\n表 10.6 CI/CD 相关工具。\n\n| 名称 | 语言 | 链接 | 描述 |\n| --- | ---\
