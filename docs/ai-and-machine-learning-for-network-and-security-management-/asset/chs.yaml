  \ 4.3.1.3 节。\n\n### 4.4.3 底层智能体\n\n在 HEA 在高层选择选项（即 VNR）后，底层智能体（LEA）根据底层策略 ![pi](img/c04-i0090.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>&#960;</mi></mrow></math> 执行一系列操作来嵌入\
  \ VN。然而，随着节点数量的增加，图中数量指数增长。将每个子图视为嵌入操作是不可能的，因为动作空间将是巨大的。因此，让强化学习智能体搜索 SN 中所有可能的子图来托管\
  \ VN 是并不合适的。在这项工作中，VNR 嵌入过程被分解为一系列虚拟节点嵌入，遵循工作（Yao 等人，2018a）。\n\n\n\n\n\n虚拟节点的嵌入过程包含了节点映射和链路映射。对于节点映射，LEA\
  \ 选择一个特定的底层网络（SN）节点来托管虚拟网络节点。选择过程涉及两个步骤：(1) 通过状态编码器提取低层状态特征对环境状态进行编码；(2) 根据编码后的状态，LEA\
  \ 通过多层神经网络估计所有动作的长期奖励，并执行 `ε`-soft 策略选择一个底层节点来托管当前的虚拟网络节点（VNR）。如果所选的底层节点为当前虚拟节点提供了足够的空闲资源，我们将在当前虚拟节点与其他已嵌入的虚拟节点之间映射虚拟链路。然而，要从虚拟链路到一组底层路径寻找最优映射是一个\
  \ NP 困难（NP-hard）问题（Kolliopoulos and Stein, 1997）。因此，对于每个虚拟链路，通过增加 `k` 值来搜索 `k`-最短路径，直到找到一条具有足够带宽以嵌入相应虚拟链路的底层路径。在具有\
  \ `n` 个节点和 `m` 条链路的 SN 中，`k`-最短路径算法可以在 `O(m+n log n + k)` 时间内求解（Eppstein, 1998）。考虑到计算效率，`k`\
  \ 应该保持较小值。\n\n接下来，将说明状态编码器、估计的长期累积奖励以及短期低层奖励的细节。\n\n### 4.4.3.1 LEA 状态编码器\n\n低层环境状态包括当前虚拟节点和底层\
  \ SN。因此，局部状态可以通过相加当前虚拟节点和 SN 的向量来公式化如下：\n\n(4.13) $s^l = e_{selected}^V + E^S$\n\
  \n其中 $e^V$ 和 $E^S$ 已经在 第 4.4.2.1 节 中声明。\n\n### 4.4.3.2 估计长期累积奖励\n\n通常使用参数为 `ξ` 的多层神经网络来估计动作的长期累积奖励。给定一个\
  \ `n`-维状态 $s^l$，它会输出一个估计的长期奖励向量。在 LEA 中，我们应用双层全连接网络，估计的长期累积奖励 $R_l$ 可以公式化为：\n\n\
  (4.14) $R_l(s^l; \\xi) = FullyConnected²(s^l; \\xi)$\n\n其中 $s^l$ 是等式 (4.13) 中定义的编码局部状态。因此，我们获得了每个底层节点的估计长期奖励。根据结果，我们可以以\
  \ `1-ε` 的概率选择估计长期奖励最大的动作，或者以 `ε` 的概率随机选择一个动作。然后，我们使用上述 `k`-最短路径进行链路映射。\n\n### 4.4.3.3\
  \ 短期低层奖励\n\n低层奖励揭示了动作 `a_t` 的真实短期反馈。如果所选的底层节点托管了当前虚拟节点，则返回正奖励，否则返回负奖励。为了确保 SN 的可用性，LEA\
  \ 应以成本效益的方法嵌入每个虚拟节点并使资源利用最大化。因此，低层奖励可以表示为：\n\n(4.15) $r_l = \\begin{cases} 10 \\\
  times \\frac{Cost_t(GV)-1}{Cost_t(GV)} & a_t \\text{ 成功} \\\\ -10 \\times \\rho_t\
  \ & \\text{否则} \\end{cases}$\n\n\n\n\n其中 ![rho Subscript t](img/c04-i0110.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msub><mi>&#961;</mi><mi>t</mi></msub></math>\
  \ 是折减因子，它逐渐从 ![StartFraction 1 Over upper S i z e left-parenthesis upper N Superscript\
  \ upper V Baseline right-parenthesis EndFraction](img/c04-i0111.png)<math display=\"\
  inline\" overflow=\"scroll\"><mfrac><mn>1</mn><mrow><mi>S</mi><mi>i</mi><mi>z</mi><mi>e</mi><mo\
  \ stretchy=\"false\">(</mo><msup><mi>N</mi><mi>V</mi></msup><mo stretchy=\"false\"\
  >)</mo></mrow></mfrac></math> 到 1。这意味着嵌入末端的虚拟节点更为重要，最后几个节点的嵌入失败将导致更大的损失。\n\n###\
  \ 4.4.4 训练方法\n\n在本文中，我们利用具有一组可训练参数的神经网络进行特征提取和策略生成。为了获得最优策略，我们需要迭代优化神经网络。在这里，为了降低训练过程中出现发散或震荡的可能性，我们采用了一种双策略学习方法，称为\
  \ `DDQN`（Van Hasselt 等，2016），它通过梯度下降高效地更新参数。\n\n## 4.5 案例研究\n\n### 4.5.1 实验设置\n\n\
  为了验证所提模型的有效性，我们建立了一个仿真环境，正如大多数之前的工作（Yao 等，2018a,2020, Yan 等，2020b）。我们生成了一个包含 100\
  \ 个节点和约 500 条链路的 `SN`，这可以代表一个中等规模的 ISP。底层节点的 CPU 满足 50 到 100 单位的均匀分布，而链路带宽满足 20\
  \ 到 50 单位的均匀分布。预期到达率为每 100 个时间单位 4 个 `VNRs`。每个 `VNR` 具有指数分布的寿命，平均为 500 个时间单位。遵循许多之前的工作（Yao\
  \ 等，2020, Yan 等，2020b），每个 `VNR` 拥有 2–10 个节点，每对虚拟节点有 50% 的概率形成链路。`VNR` 中的初始虚拟节点和链路资源在\
  \ 0 到 40 单位之间均匀分布。一个时间窗口包含 500 个时间单位和约 20 个 `VNRs`，这有利于代理进行处理而不会消耗大量的计算资源，并实现主动性能。此外，时间窗口长度和请求队列长度分别设置为\
  \ 25 和 10。在测试阶段，我们构建了一个长度为 50,000 个时间单位的时间线，这意味着每个回合（episode）持续 50,000 个时间单位，并生成约\
  \ 2000 个 `VNRs`。\n\n### 4.5.2 对比方法\n\n在评估中，`VNE-HRL` 算法将与四个选定的算法进行比较，包括 `NodeRank`（Cheng\
  \ 等，2011）、`MCViNE`（Haeri 和 Trajković，2017）和 `seq2seqRL`（Yao 等，2020）。`NodeRank` 是一种传统算法，基于混合整数规划和\
  \ `PageRank`（Page 等，1999）。此外，`MCViNE` 和 `seq2seqRL` 是两种基于强化学习算法，分别通过蒙特卡洛树搜索和循环神经网络实现。我们利用公共的\
  \ VNE 仿真器 `VNE-Sim`（Haeri 和 Trajković，2016）来收集这些算法的性能。\n\n### 4.5.3 评估结果\n\n在测试阶段，通过\
  \ `HEA` 从窗口批中选择具有最大长期收益的 `VNRs` 并通过 `LEA` 进行嵌入。为了评估算法性能，根据第 4.3.1 节所示的评估指标与其他算法进行对比实验。此外，为了避免神经网络初始化的干扰，`seq2seqRL`\
  \ 和 `VNE-HRL` 算法需要在 15 种不同的初始化设置下运行，并添加误差棒表示。\n\n#### 4.5.3.1 随时间的变化\n\n对于第一组测试，我们评估了四种算法随时间变化的性能。从图\
  \ 4.4 中可以看出，早期的长期平均收益和接受率较高，因为开始时资源较多。随着测试持续，更多的 `VNRs` 被嵌入，资源被占用，导致长期收益和接受率下降。然而，`VNE-HRL`\
  \ 保持领先，它能够准确识别当前 `VNR` 的长期利益、嵌入底层，并为后续 `VNRs` 留出充足空间。长期收益成本比在仿真过程中没有出现显著波动，表明该指标与可用资源无关。最后，如图\
  \ 4.4a 和 4.4c 所示，`VNE-HRL` 优于 `NodeRank`、`MCViNE` 和 `seq2seqRL`，在平均收益上领先了 26.78%、21.42%\
  \ 和 14.69%，在平均接受率上领先了 6.62%、5.19% 和 3.73%。显著的是，在图 4.4b 中，传统算法（即 `NodeRank`）与另外三种（即\
  \ `MCViNE`、`seq2seqRL` 和 `VNE-HRL`）之间存在巨大差距，这表明强化学习代理在低成本自动探索嵌入策略方面表现良好。根据指标图表和误差棒，我们可以得出结论：由于主动规划，`VNE-HRL`\
  \ 算法在长期内保持了较好的性能。\n\n\n\n\n对于第二组测试，我们观察了这四种算法在各种资源请求模式下的性能。由于资源需求的差异，虚拟网络请求（VNRs）可以分为两类：计算密集型和通信密集型。为了模拟这些情况，节点资源请求分布从\
  \ ![0, 40<math display=\"inline\" overflow=\"scroll\"><mo stretchy=\"false\">\\\
  [</mo><mn>0</mn><mo>,</mo><mn>40</mn><mo stretchy=\"false\">\\]</mo></math> 均匀分布到\
  \ ![0, 100<math display=\"inline\" overflow=\"scroll\"><mo stretchy=\"false\">\\\
  [</mo><mn>0</mn><mo>,</mo><mn>100</mn><mo stretchy=\"false\">\\]</mo></math> 均匀分布，较高的上限表示更为密集的计算模式。在每一步中，我们将上界增加\
  \ 10。根据图 4.5 所示的结果，`VNE-HRL` 算法在平均收益上优于 `NodeRank`、`MCViNE` 和 `seq2seqRL`，分别领先 43.84%、33.48%\
  \ 和 29.58%；在接受率上分别领先 14.84%、15.91% 和 4.47%。此外，随着 VNRs 资源请求的增加，每个算法的接受率都会下降。这是因为\
  \ `SN` 组件逐渐变得难以托管虚拟网络，而大资源请求的 VNR 可能会在嵌入步骤中失败。此外，这些算法的平均收益先升后降。这是因为大资源请求的 VNR 可以带来更高的收益。然而，随着\
  \ VNR 的资源需求增大，由于这些 VNR 接受率的快速下降，平均收益随之下降。通过对比，我们可以得出，`VNE-HRL` 方法在广泛不同的资源请求分布下再次优于其他算法。\n\
  \n## 4.6 相关工作\n\n对 VNE 问题的研究引起了巨大的关注。在本节中，我们将介绍传统方法（第 4.6.1 节）。\n\n### 4.6.1 传统方法\n\
  \n由于优化策略的差异，传统的 VNE 算法通常分为类：精确算法和启发式算法。\n\n对于精确算法，每个 VNR 都通过精确优化策略（Wolsey, 1998）进行嵌入，例如\
  \ `ILP`（Schrijver, 1998）和 `MILP`（Bénichou 等，1971）。Shahriar 等（2018）将 VNE 转换为一个 `ILP`\
  \ 问题，共同优化了空闲容量的位置和请求存活性。尽管提出了一种辅助算法来优化执行时间，但由于节点映射算法的高计算复杂度，嵌入 VNR 仍然是不可接受的。Chowdhury\
  \ 等（2011）通过 `SN` 增强将 VNR 问题公式化为 `MILP`，通过松弛整数约束获得线性规划，并设计了两种嵌入算法。然而，这种方法面临着线性规划求解需要大量计算资源的问题。总而言之，精确算法旨在实现最优嵌入方案，但具有高计算复杂度，仅能用于解决小规模的\
  \ VNE 问题。\n\n启发式方法能够在较短的执行时间内找到可行的 VNR 嵌入方案（Cormen 等，2009）。受到 `Pagerank` 算法（Page\
  \ 等，1999，Cheng 等，2011）的启发，该算法根据资源和拓扑属性对网络节点进行排序，并根据排名将虚拟节点映射到底层节点。然而，由于节点排名是固定的，嵌入策略难以优化。Haeri\
  \ 和 Trajković（2017）提出了一种多商品流和最短路径方法将 VNRs 嵌入到 `SNs` 中，以最大化基础设施提供者的利润。然而，他们没有考虑未来的资源需求和历史信息，导致利润最大化在某种程度上受到限制。总而言之，启发式方法通常受到局部最优问题的影响，这可能远离全局最优。\n\
  \n### 4.6.2 基于机器学习的算法\n\n最近，几项研究工作探索了机器学习在 VNE 问题中的应用。Xiao 等（2019）引入了马尔可夫决策过程（`MDP`）模型来捕捉动态网络状态并自动为请求部署服务链。然而，这项工作没有考虑准入控制，在不可行的\
  \ VNR 上浪费了大量资源，并忽略了 VNR 的长期影响。基于 Hopfield 神经网络，He 等（2021）建立了一个高效的虚拟网络嵌入模型，为虚拟网络嵌入提供候选集。在\
  \ Alsarhan 等（2017）中，基于 `RL` 的框架自动适应系统变化，如服务成本、资源能力和资源请求。然而，它仅旨在满足服务水平协议（`SLA`）的需求，但对所有\
  \ VNR 一视同仁。Yao 等（2018b）将基于策略的带有历史数据的 `RL` 应用于节点映射，其总体目标是通过卷积神经网络嵌入节点和链路来实现收益最大化。总而言之，大多数现有的基于机器学习的方法关注当前的\
  \ VNR 并对所有 VNR 一视同仁，这在不可行的 VNR 出现时会浪费资源，并忽略嵌入的长期影响。\n\n## 4.7 结论\n\n在本章中，我们提出了一种依赖\
  \ `HRL` 的主动 VNE 算法，该算法考虑了 VNR 嵌入的长期影响。在 `VNE-HRL` 框架内，一系列 VNRs 的嵌入任务由双级代理体完成。对于每个过程，高层代理体旨在选择具有最大长期奖励的可行\
  \ VNR，而低层代理体负责将选定的 VNR 嵌入到底层网络。大量的仿真结果表明，当 VNR 类型发生变化时，`VNE-HRL` 算法具有良好的有效健棒性。\n\
