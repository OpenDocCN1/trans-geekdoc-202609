  \ Expert Systems with Applications, 42(22):860.\n\n# 6 基于轻量化神经网络的在线加密流量分类\n\n##\
  \ 6.1 引言\n\n作为网络管理的关键工具，流量分类在拥塞控制和服务质量（QoS）保障中起着重要作用（Dai 等人 2019, Liu 等人 2020, Yao\
  \ 等人 2020, Zou 等人 2018）。如今，由于对隐私和安全的日益关注，许多应用程序已采用了各种加密技术。\n\n## 6.2 动机\n\n\n\n\
  现有的流量分类方法为了保证分类结果的高精度，往往牺牲了效率。大多数现有的机器学习（ML）方法基于手工构造的统计特征提取（Niu 等人，2019, Meng 等人，2015,\
  \ Alshammari 和 Zincir-Heywood，2015），例如平均数据包长度、流持续时间和数据包的平均到达间隔时间。为了获得这些统计特征，必须观测整个或流的大部分部分。因此，这些方法仅适用于离线场景。虽然基于深度学习（DL）的流量分类方法可以消除人工特征构建的缺点，但仍然存在一些问题。例如，大多数现有的研究要么使用包级特征，要么使用流级特征，忽略了重要信息（即这两种特征没有被结合使用）。同时，大多数现有的模型缺乏对模型效率的考虑，复杂神经网络中巨大的内存和运行开销会导致高能耗（Rezaei\
  \ 和 Liu，2019, Cheng 等人，2020, 2021）。\n\n为了解决上述问题，在本章中，我们提出了一种在线加密流量分类的轻量级神经网络，它将流中随机位置的三个连续数据包作为输入。明确来说，我们将模型称为\
  \ `LightNet`。基于“薄模块复用最大化”的原则，通过薄模块提取全局（流）和局部（包）级别的特征，该模块采用了多头注意力机制和一维卷积神经网络（`1D-CNNs`）。通常，全局特征来自流中数据包之间的交互，局部特征包含几个原始数据包中的字节。在全局层面，通过多头注意力机制，每个数据包在一步内与其他所有数据包交互，通过矩阵相乘计算数据包权重，极大减少了参数数量和运行时间。此外，数据包被投影到多个子空间，因此多头注意力机制可以并行捕获不同子空间中的不同特征交互。因此，多头注意力的参数主要来自投影矩阵，且通常较低。在局部层面，`1D-CNN`\
  \ 专注于数据包字节并用于提取包级特征，这在流量分类中已被证明具有很高的有效效率（Rezaei 和 Liu，2018）。\n\n本章其余部分的结构如下：基础知识在第\
  \ 6.3 节中介绍，提出的模型 `LightNet` 在第 6.4 节中详细阐述。第 6.5 节对实验结果进行分析。第 6.6 节展示了流量分类的相关工作。最后，第\
  \ 6.7 节对本章得出结论。\n\n## 6.3 基础知识\n\n### 6.3.1 问题定义\n\n本章旨在解决的问题是以有效且高效的方法将加密流量分类到相应的应用程序。在该领域，工业界和学术界通常使用两种粒度：数据包和流（Zou\
  \ 等人，2018）。在本章中，我们选择流粒度，它可以同时包含包信息和流信息。流是指所有五元组字段值相同的数据包，\n\n(6.1)![left-bracket\
