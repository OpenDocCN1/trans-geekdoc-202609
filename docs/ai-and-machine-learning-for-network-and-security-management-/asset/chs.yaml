  该层旨在加速训练并防止模型的网络退化。add & norm 模块包含了残差网络（ResNet）和层归一化（layer normalization），其中“add”对应\
  \ ResNet，“norm”对应层归一化。\n\n如 ![y equals upper F left-parenthesis x right-parenthesis\
  \ plus x](img/c06-i0057.png)<math display=\"inline\" overflow=\"scroll\"><mi>y</mi><mo>=</mo><mi>F</mi><mo\
