  \ display=\"inline\" overflow=\"scroll\"><msup><mi>s</mi><mi>l</mi></msup><mo>&#8712;</mo><msup><mi>S</mi><mi>L</mi></msup></math>\
  \ 是表示低层环境状态的隐藏向量，它从选定的 VNR 和底层 SN 中提取。\n*   **选项空间** ![script upper O](img/c04-i0063.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi mathvariant=\"script\">O</mi></mrow></math>:\
  \ 选项 ![o element-of script upper O](img/c04-i0064.png)<math display=\"inline\" overflow=\"\
  scroll\"><mi>o</mi><mo>&#8712;</mo><mi mathvariant=\"script\">O</mi></math>是从基于窗口的批处理中选择的\
