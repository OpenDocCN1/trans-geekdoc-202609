  \ stretchy=\"false\">&#125;</mo></math>\n\n\n\n其中 $M$ 是特征字段的数量，$x_{i,j}$ 是第 $j$\
  \ 个字段的特征值。例如，$x_{i,1}$ 代表数据包位置（例如 $1, 2, \\dots, N$），$x_{i,2}$ 可以表示数据包长度，而 $x_{i,3}$\
  \ 可以是移除以太网头部后的前 784 个字节。上述特征的有效性在许多工作中得到了验证（Wang et al., 2017c），（Lotfollahi et al.,\
  \ 2020）。值得注意的是，即使对于加密流量，数据包头部中的信息也可以用于流量分类（Rezaei and Liu, 2019）。我们不仅利用了数据包头部，还使用了部分数据包载荷。对于数据包字节数，通过除以\
  \ 255 将特征归一化为 $[0,1]$，其中原始字节的范围从 0 到 255。然后，我们统一了这些特征。对于向量特征 $x_{i,j}$，维度变化可以表示如下：\n\
  \n(6.6) $e_{i,j} = U_j x_{i,j}$\n\n其中 $i$ 代表一个数据包，$j$ 表示一个特征字段。$U_j$ 是字段 $j$ 的嵌入矩阵，可以是预定义的也可以是训练的。否则，对于标量特征\
  \ $x_{i,j}$，维度变化可以表示为：\n\n(6.7) $e_{i,j} = u_j x_i$\n\n其中 $u_j$ 是字段 $j$ 的嵌入向量。上述处理适用于每个数据包中的所有字段。值得注意的是，参数\
  \ $U_j$ 和 $u_j$ 都是可训练的。\n\n随后，将向量特征和标量特征转换为统一表示，数据包向量 $e_i$（以数据包 $i$ 为例）可以表示如下：\n\
  \n(6.8) $e_i = W_{map} [e_{i,1}, e_{i,2}, \\dots, e_{i,M}]$\n\n\n\n其中 `![images/c06-i0039.png](img/math)`\
  \ 是映射矩阵。因此，数据包可以表示为 `![images/c06-i0041.png](img/math)` 维的向量。通过堆叠数据包向量，流可以表示为形状为\
