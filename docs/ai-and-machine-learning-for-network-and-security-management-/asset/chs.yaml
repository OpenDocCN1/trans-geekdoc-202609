  \ | 企业 SSH 登录双因子认证系统 |\n\n### 10.3.2.2 安全审计与入侵检测\n\n\n\n\n\n## 安全审计与入侵检测\n\n安全审计与入侵检测通过收集和分析系统信息，来检查系统是否受到攻击或正受到攻击。安全审计是指专业审计人员根据相关法律法规、财产所有者的委托以及管理部门的授权，对计算机网络环境中的相关活动或行为进行系统性、独立的检查和验证，并进行相应的评估。安全审计主要用于识别、记录、存储和分析系统中与安全相关的活动信息，检查网络中发生了哪些安全相关活动，以及是由谁（哪个用户）负责的这些活动。\n\
  \n入侵检测是防火墙的合理补充。它帮助系统处理网络攻击，扩展系统管理员的安全管理能力（包括安全审计、监控、攻击识别和响应），并提高信息安全基础设施的完整性（Denning,\
  \ 1986）。它从计算机网络系统的多个关键点收集信息并对其进行分析，以查看是否存在安全策略违反和攻击迹象。入侵检测被认为是防火墙之后的第二道安全防线，可以在不影响网络性能的情况下监控网络，从而对内部攻击、外部攻击和误操作提供实时保护。\n\
  \n## 比较\n\n安全审计侧重于后审计。它检测系统中是否发生了不安全行为并对其进行分析和溯源。入侵检测侧重于实时分析或提前分析，以检测系统中是否发生安全异常，提前识别并限制对象的活动，防止攻击的发生或扩散。开源工具总结在表\
