  流量分类任务是将加密网络流量归类到相应的类别中。首先，应该明确定义流量分类的目标。总体目标包括服务质量（QoS）提供、入侵检测、恶意软件检测、资源使用规划等。为了实现这些目标，流量分类通常基于：(i)\
  \ 协议（例如 HTTP、SSL、SMTP、DNS 或 QUIC）、(ii) 流量类型（例如视频、聊天或网页浏览）、(iii) 应用（例如 Amazon、Apple、Microsoft\
  \ 或 Google）以及 (iv) 网站。对于上述四种情况，为每个流（flow）标记相应的流量类别是很有的。在我们的工作中，我们识别流的所属应用程序。其次，需要一个大型且具有代表性的数据集。尽管有几个公开的数据集可供研究，但在流量分类领域尚还没有一个公认的通用数据集（Rezaei\
  \ and Liu, 2019）。\n\n![表 6.2 现有流量分类方法总结](img/c06-i0069.png)\n\n表 6.2 现有流量分类方法总结。\n\
  \n### 6.6.2 基于包的方法\n\n基于包的流量分类方法直接将数据包的字节作为输入。包字节包含了数据包头（header）信息和有效负载（payload）数据。表\
  \ 6.2 显示了基于包的方法总结。对于包头，第 3 层和第 4 层的信息对于非加密流量是有用的（Rezaei and Liu, 2019）。在深度学习时代之前，端口号、协议和包长度等字段被领域专家仔细选择作为代表性特征。在最近的一些方法中，整个数据包被用作输入。对于有效负载数据，第\
  \ 4 层头部之上的信息可以用于流量分类。在 Lotfollahi 等人的工作中（2020），在经过初始预处理阶段后，数据包被输入到堆叠自动编码器和 CNN 模型中以对网络流量进行分类。Liang\
  \ 等人（2019）提出了一种深度强化学习方法来解决包分类问题。Liang 等（2019）的方法使用了简洁的表示来编码状态和动作空间，并高效地探索候选决策树以优化全局目标。Finamore\
  \ 等人（2010）提出了一种通过提取有效负载签名来利用有效负载统计特征的分类方法。然而，基于包的方法关注少数数据包的详细信息，缺乏对全局特征的关注。在我们的模型中，同时考虑了包级特征和流级特征，使得模型既高效又有效。\n\
  \n### 6.6.3 基于流的方法\n\n基于流的方法需要选择流特征，然后将这些特征输入分类器。表 6.2 也显示了基于流的方法总结。通常，分为两大类：基于传统机器学习的和基于深度学习的。\n\
  \n#### 6.6.3.1 基于传统机器学习的方法\n\n基于复杂的分类特征，现有的基于传统机器学习的流级流量分类方法具有其局限性。Zhu 和 Zheng（2019）研究了使用包长度和\
  \ TCP 标志通过支持向量机（SVM）分类网络流量的应用，通过核函数将实际问题转换为高维特征空间。Fu 等人（2016）构建了隐马尔可夫模型（HMMs），通过联合建模用户行为模式、网络特征和时间依赖性对移动消息\
  \ App 的服务进行分类。沿着这条路线，Fu 等（2016）的作者首先以分层的方式将互联网流量从流量流分成具有多个对话的会话，并使用了包长度和时间延迟两个特征。根据时间和数据包大小的分布，Yao\
  \ 等人（2020）的作者使用高斯混合模型和 HMM 对混淆流量进行分类，建立了包内时间与包大小之间的联系，以提高流特征描述的准确性。然而，这些分类器必须观察整个流或流中的大多数数据包才能获得这些特征，这更适用于离线分类。在本章中，仅以几个连续数据包作为输入，所提模型可以满足在线流量分类领域的实时需求。\n\
  \n#### 6.6.3.2 基于深度学习的方法\n\n深度学习方法已广泛应用于流量分类。在 Liu 等人（2020）中，使用 `Bi-GRU` 提取流中字节序列的正向和反向特征。Liu\
  \ 等（2019）的作者使用 `Bi-GRU` 提取流中字节序列的正向和反向特征。在 Wang 等（2017）中，将几个连续数据包作为 `1D-CNN` 的输入，首次应用端到端方法达到了\
  \ 85.8%。为了获取空间和时间特征，Wang 等（2017b）使用了 `CNN` 和 `RNN`。在 Wang 等（2017b）的研究中，首先学习空间特征，然后使用循环网络学习时间特征。Zou\
  \ 等人（2018）的作者提出了一种使用 `2D-CNN` 和 `LSTM` 的模型，接受几个连续数据包作为输入。在 Zou 等（2018）中，使用 `CNN`\
  \ 提取单个包的特征，并训练 `LSTM` 以提取流特征。上所示，纯 `CNN` 缺乏提取交互信息的能力，导致 `CNN` 经常结合 `RNN` 来提取流特征。在我们的方法中，所有数据包的交互通过多头注意力机制来实现。\n\
  \n## 6.7 结论\n\n由于加密流量的广泛采用，对流量分类的效率提出了要求。在本章中，提出了一种名为 `LightNet` 的轻量级模型，以减少资源消耗。“最大化轻量模块的重用”是我们的设计原则。轻量模块已应用于多头注意力和\
  \ `1D` 卷积网络。得于所有数据包的一步交互和多头注意力机制的并行计算，`LightNet` 的参数数量以及训练和测试时间显著减少。\n\n\n\n\n3.\
