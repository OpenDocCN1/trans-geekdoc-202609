  \ 10.1109/TCCN.2020.2966615.\n\n# 2 当网络与安全管理遇到人工智能与机器学习\n\n## 2.1 引言\n\n随着云计算、物联网（IoT）和新一代移动通信技术的快速发展（Wu,\
  \ [2021], Wu 等., [2022], Cheng 等., [2020b]），网络服务和系统正呈指数级增长。网络技术的进步带来了社会进步、业务创新和生活便利，但同时也不可避免地导致了网络管理和安全管理复杂性的增加。在这种背景下，人工执行或依赖自动化规则的网络与安全管理已力不从心，迫切需要新兴人工智能技术的帮助（Wu\
  \ 等., [2021]）。在本章中，我们将讨论人工智能技术为何、如何以及在何处赋能网络与安全管理。\n\n采用人工智能（AI）和机器学习（ML）赋能网络与安全管理。在本章中，我们将讨论人工智能技术为何、如何以及在何处赋能网络与安全管理。采用人工智能（AI）和机器学习（ML）赋能网络与安全管理。在本章中，我们将讨论人工智能技术为何、如何以及在何处赋能网络与安全管理。\n\
  \n采用人工智能（AI）和机器学习（ML）赋能网络与安全管理。在本章中，我们将讨论人工智能技术为何、如何以及在何处赋能网络与安全管理。采用人工智能（AI）和机器学习（ML）赋能网络与安全管理。在本章中，我们将讨论人工智能技术为何、如何以及在何处赋能网络与安全管理。\n\
  \n## 2.2 机器学习赋能的网络与安全管理架构\n\n如今，网络安全管理严重依赖人工经验和技能。在沉重的历史负担下，电信网络正变得日益复杂。特别是随着 5G\
  \ 和云边计算的出现，网络规模扩大了十倍，网络流量表现出巨大的不确定性，已经超过了人类专业知识的能力范围。面对未来，大量实时业务超出了人类的速度。与此同时，网络服务质量不断提高。例如，业务可以快速接入，网络故障可以及时消除，并保障端到端（E2E）的服务质量。因此，行业对网络智能化提出了明确要求。以设备为中心的网络运维模式难以有效实现上述目标。只有构建真正以用户体验为中心的网络，才能有效满足终端用户的需求，并支持网络提供商的商业成功。\n\
  \n\n\n\n## 引言\n智能脑层旨在实现网络的智能化管理与控制。它接收运营者的业务意图，并将意图准确转换为网络策略。智能脑自动对策略进行验证并落实到物理网络中。它能够实时感知物理网络的状态，检测异常并及时发布预警，为处理异常提供建议，并确保网络符合业务意图。它能够根据遥测数据和经验知识图谱数据库快速排除异常故障或优化网络性能。通过持续建模和网络行为学习，它可以提前识别（例如）可能发生的短期拥堵点，并迁移重要业务或改进调度策略。\n\
  \n智能脑层包含五个功能模块，包括意图引擎、策略自动化部署引擎、数据与行为分析引擎、知识图谱引擎和安全监控引擎。`intent` 引擎负责接收并将业务意图翻译为网络策略，并对网络策略进行仿真和验证。`strategy\
  \ automation deployment engine` 将网络策略转换为特定的网络命令，并通过标准接口自动交付到网络设备。`data and behavior\
  \ analysis engine` 根据实时遥测技术收集并分析网络数据及行为。通过 AI 技术验证当前网络是否符合用户意图。这些分析结果也用于构建知识图谱。`knowledge\
  \ graph engine` 持续完善网络知识的经验图谱数据库。利用知识图谱，它可以帮助意图引擎持续优化意图翻译能力。基于实时网络数据和知识图谱预测风险事件并给出相应的缓解建议。`security\
  \ monitoring engine` 负责根据网络行为数据进行安全威胁分析，识别异常网络流量并监控网络的全生命周期。\n\n智能脑层是网络的枢神经系统。它以自上而下的方式实现用户意图的数据采集、验证、翻译和发布，以构建以用户为中心的自动化智能网络。自下而上的通道是利用\
  \ AI 技术分析网络全生命周期的测量数据和服务行为，以实现自动化智能化网络安全管理。\n\n网络基础设施层是基石。它需要满足 4K/虚拟现实（VR）及其他超高清视频、5G\
  \ 以及自动驾驶等新业务带来的高带宽需求。网络架构不断进行重构和优化。网络可以为未来的 5G 服务和工业特殊应用提供弹性扩展、即插可用以及确定性低延迟，以服务不同的业务需求。\n\
  \n## 2.3 监督学习\n监督学习利用一组已知标签的样本来学习适当参数并构建学习器的过程。因此，学习器可以将新到达的无标签数据映射到其所属的类别（标签）。监督学习的核心是对数据进行标注，即从历史经验中学习。典型的监督机器学习应用示例所示表\
  \ 2.1。\n\n### 2.3.1 分类\n分类是一种典型的监督学习过程。基于已知类别，分类需要做的工作是将每个无标签数据归类到相应的类别中。每个类别的信息必须预先已知，所有待分类的数据项默认都有相应的类别。因此，分类算法对于是否能满足上述条件具有局限性。常见的分类算法包括决策树、支持向量机（`SVM`）、K\
  \ 近邻（`KNN`）和神经网络等。\n\n**表 2.1** 监督机器学习应用示例。\n\n| 应用 | 作品 | 特性 |\n| --- | --- | ---\
  \ |\n| 流量分析 | Peng 等 (2016) 以及 Soysal 和 Schmidt (2010) | 应用于分类的分类器 |\n| 威胁识别 | Goseva-Popstanova\
  \ 等 (2014) | 暴露 Web 中的常见威胁 |\n| 入侵检测 | Belavagi 和 Muniyal (2016) | 用于检测的机器学习分类器\
  \ |\n| 异常检测 | Liu 等 (2015) | 自动选择合适的检测器组合和阈值 |\n| 日志分析 | Liang 等 (2007) | 用于日志预测的分类器\
  \ |\n| 异常检测 | Zhang 等 (2019) | 自动学习不同日志事件的重要性 |\n| 异常检测 | Li 等 (2018a) | 为新增的日志语句建议合适的水平\
  \ |\n| 云资源 | Farshchi 等 (2015) | 发现操作活动对云资源的影响 |\n| 系统退化 | He 等 (2018) | 检测系统退化的原因\
  \ |\n\n决策树的思想是使用树形结构进行分类。以二分类为例，期望从给定标签数据集学习的模型可以对新数据进行分类。这种样本分类任务可以看作是对“当前样本是否？”的`decision`。本质上，决策树的决策过程是对样本特定属性的`decision`。由于可视化的结构，决策树具有很强的解释性且对训练数据规模的要求较低。然而，决策树算法可能会生成复杂的树模型，且决策树通常基于启发式算法，因此可能是不稳定的。常用的决策树算法包括迭代二叉树（`ID3`）（Quinlan,\
  \ 1986）、`C4.5`（Quinlan, 1993）、分类回归树（`CART`）（Breiman 等，1984）等。\n\n分类的思想之一是基于标签训练数据集在样本空间中寻找一个划分平面以分离不同类别的样本。`SVM`的思想是寻找具有最佳容限的最大间隔超平面。`SVM`的分类思想简单，性能通常良好。`SVM`利用核函数可以解决非线性分类问题，适用于训练数据较少的分类任务。\n\
  \n`KNN`的思想简单，即每个样本都可以由`KNN`样本表示。如果大多数`KNN`样本属于某个类别，则该样本也属于该类别。`KNN`使用欧几里得距离作为衡量两个样本的距离量。`KNN`简单且易于使用和实现，但容易受到参数配置的影响。\n\
  \n\n\n\n通常，神经网络指的是人工神经网络，它是一种模仿动物神经网络行为特征并执行分布式并行信息处理的算法数学模型。这类网络依赖系统的复杂性，通过调整大量内部节点之间的连接来实现处理信息的目的。神经网络算法基于一组相互连接的输入和输出单元，每个单元之间的每个连接都关联着一个权重。在学习阶段，神经网络算法通过调整权重来实现输入样本与其所属类别之间的对应关系。神经网络分类算法准确且灵活，能够适应各种类型的数据，但相应地，神经网络的时间和空间开销远大于其他类型的分类算法。\n\
  \n分类已广泛应用于网络和安全管理的各种场景和任务中，例如异常检测（Liu 等，2015, Wu 等，2022, Guo 等，2021, Huang 等，2022,\
  \ 2018），流量分类（Rezaei and Liu，2019b, Soysal and Schmidt, 2010, Cheng 等，2020a–2021,\
  \ Liu 等，2020)），日志分类（Liang 等，2007, Zhang 等，2019, Sun 等，2020, Zuo 等，2020）等。\n\nPeng\
  \ 等（2016）和 Soysal and Schmidt（2010）的工作比较了应用于流量分类的机器学习分类器。对于异常或恶意流量检测，Goseva-Popstojanova\
  \ 等（2014）暴露了需要识别的 Web 常见威胁。Belavagi 和 Muniyal（2016）比较了若干用于入侵检测的监督机器学习分类器。对于 KPI（关键性能指标）异常检测，Liu\
  \ 等（2015）提出了一种名为 Opprentice 的新型监督方法，并训练了一个随机森林分类器来自动选择合适的检测器-参数组合和阈值。对于日志分析，Liang\
  \ 等（2007）训练了 `Ripper`、`SVM` 和 `KNN` 三种分类器来预测新到达的日志是 `FATAL` 还是 `FAILURE` 级别，从而实现异常检测的目的。Zhang\
  \ 等（2019）提出了 `LogRobust`，它使用神经网络算法长短期记忆（`LSTM`）来充分挖掘日志序列的上下文、语义、句法和结构特征，并自动学习不同日志事件对检测目标的重要性。\n\
  \n### 2.3.2 回归\n\n最经典的回归算法是线性回归。它假设线性函数可以拟合目标数据，然后使用某些误差分析来确定最拟合目标数据的函数。非线性问题可以通过将变量转换为线性回归问题来解决。曲线回归算法也称为多项式回归，是指使用连续曲线来近似描述平面上一组离散点表示的坐标之间的函数关系。这是一种解析表达式近似离散数据的方法。第\
  \ 2.3.1 节 中提到的决策树算法 `CART` 也可以用作回归算法。与基于基尼指数的支持分类 CART 不同，支持回归的 CART 是基于平方误差最小化准则进行特征选择并生成二叉树。在回归树叶节点包含的样本中，输出变量的平均值就是预测结果。\n\
  \n在网络和安全管理中，回归分析可以用于事件挖掘，收集各种数据并执行事件关联分析。对于日志分析，Li 等（2018a）利用序数回归模型为新添加的日志语句自动建议合适的级别，以进行异常检测和故障定位。Farshchi\
  \ 等（2015）提出了一种基于回归的方法来发现日志与操作活动对云资源影响的相关性。He 等（2018）基于级联聚类算法和多元线性回归提出了 `Log3C` 来检测系统性能下降的原因。\n\
  \n## 2.4 半监督学习与无监督学习\n\n监督学习已经引导并解决网络和安全管理中的许多问题。然而，在许多现实场景中，我们不可避免地遇到监督学习标签获取困难、标注成本高以及先验知识和经验不足的问题。无监督学习和半监督学习可以在范围内解决这些挑战。无监督学习不需要标记数据，仅依赖样本间的差异或提取某些相似模式来实现学习。常见的无监督学习方法包括聚类、降维等。半监督学习不同于监督和无监督。它不仅使用大量的未标记数据，还使用标记数据来实现学习。半监督学习对标记数据的要求较低，同时也能获得高准确性。因此，它正获得越来越多的关注。半/无监督机器学习应用的典型示例见表\
  \ 2.2。\n\n### 2.4.1 聚类\n\n聚类是指将样本集划分为相似样本组成的簇的过程。良好的聚类方法可以让簇内样本尽可能相似，不同簇之间的样本尽可能不同。\n\
  \n![upper K](img/c02-i0002.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>K</mi></mrow></math>-均值法（Macqueen，1966）是最简单且流行的聚类算法之一。它基于距离，并期望两个目标之间的距离越近，相似性越大。它从\
  \ ![upper K](img/c02-i0003.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>K</mi></mrow></math>\
  \ 个随机聚类中心开始，并计算样本集中剩余样本到这 ![mi>K</mi> \\text{ 个 ![upper K](img/c02-i0004.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>K</mi></mrow></math> 个聚类中心的距离。然后将它们分配到距离最近的聚类中心对应的簇中。\n\
  \n\n\n\n基于噪声的密度空间聚类算法（DBSCAN）（Ester 等人，1996）是一种基于密度的聚类算法。与 `K`-means 不同，DBSCAN 不需要预先聚类数量，因此最终的聚类数量也是不定的。它根据预设参数\
  \ `Eps`（距离）和 `MinPts`（最小点数）将样本点分为核心点、边界点和噪声点。核心点是指在 `Eps` 半径内包含多于 `MinPts` 个点的。边界点是指在\
  \ `Eps` 半径内点数少于 `MinPts` 但处于核心点邻域的点。噪声点是指既不是核心点也不是边界点的点。DBSCAN 删除噪声点，然后在 `Eps` 范围内的所有核心点之间分配一条边。每组相连的核心点形成一个簇，每个边界点被分配到与其相关的核心点所在簇中。\n\
  \n在网络和安全管理中，聚类可以用于流量分类、问题识别和日志分类等。Shaikh 等人（2013）和 Namdev 等人（2015）使用 `K`-means 和\
  \ DBSCAN 算法对网络流进行了分类。Mu 等人（2013）提出了一种基于 `K`-means 的深度包检测（DPI）方法来净化流量流。Botta 等人（2012）分析流量行为以识别\
  \ P2P 流量，第一步是使用 `K`-means 对相似流进行聚类，然后用流量色散图（TDG）表示簇。在日志分析领域，日志键提取（LKE）（Fu 等人，2009）、LogMine（Hamooni\
  \ 等人，2016）和 LenMa（Shima，2016）是遵循聚类思想提出的日志解析器。Lin 等人（2016）提出了 LogCluster，它基于凝聚层次聚类（AHC）对日志进行聚类以进行问题识别。\n\
  \n### 2.4.2 降维\n\n机器学习领域的降维是指使用特定的映射方法将原始高维空间中的数据点映射到低维空间。在原始高维空间中，数据包含冗余和噪声信息，这在实际应用中可能会导致误差并降低准确性。通过降维，我们希望减少冗余信息引起的误差并提高任务准确性，并通过降维算法发现数据的内在结构特征。在许多算法中，降维已成为数据处理的一部分。\n\
  \n最常用的降维算法是主成分分析（PCA）。PCA 的目标是通过特定的线性投影将高维数据映射到低维空间表示，并期望数据在投影维度上的方差最大，以便在保留多个原始数据点较大特征的同时使用较少的数据维度。在\
  \ Fahad 等人（2013）的流量分类工作中，PCA 被用流特征选择技术。Xu 等人（2009）提出了一种基于频繁模式过滤和 PCA 的异常检测方法。\n\n\
  ### 2.4.3 半监督学习\n\n半监督学习根据应用场景可以分为半监督分类、半监督回归、半监督聚类、半监督降维和其他相关算法。从理论上来说，它也可以被分为直推式（transductive）半监督学习和归纳式（inductive）半监督学习。作为一个宽泛的概念，半监督可以应用于传统的机器学习算法（如\
  \ SVM、聚类）和深度学习模型（如 CNN、LSTM）。\n\n在流量分类领域，Rezaei 和 Liu（2019a）提出了一种基于一维 CNN 的半监督加密流量分类方法。该模型通过大型未标记数据集从少量采样包中训练以预测整个流的统计特征。在网络预测中，Gwon\
  \ 和 Kung（2014）提出了一种半监督模型来分类接收到的帧/包并推断 Wi-Fi 网络中的流属性。Meng 等人（2018）提出了 LogClass，一种基于半监督学习算法的数据驱动异常检测系统，以解决设备无关词汇和部分标签的问题。\n\
  \n表 2.2 半监督和无监督机器学习的应用。\n\n| 应用 | 工作 | 功能 |\n| --- | --- | --- |\n| 流量分析 | Shaikh\
  \ 等人（2013）和 Namdev 等人（2015） | 网络流分类 |\n| 流量分析 | Mu 等人（2013） | 深度包检测净化流量流 |\n| 流量分析\
  \ | Botta 等人（2012） | 分析流量行为识别 P2P 流量 |\n| 流量分析 | Fahad 等人（2013） | 使用 PCA 进行流量分类\
  \ |\n| 流量分析 | Rezaei 和 Liu（2019a） | 半监督流量分类方法 |\n| 网络预测 | Gwon 和 Kung（2014） | 半监督模型分类接收到的帧/包并推断\
  \ Wi-Fi 网络流属性 |\n| 日志分析 | Fu 等人（2009）、Hamooni 等人（2016）和 Shima（2016） | 基于聚类的日志解析器\
  \ |\n| 日志分析 | Lin 等人（2016） | 基于凝聚层次聚类的问题识别 |\n| 日志分析 | Meng 等人（2018） | 基于半监督学习算法的数据驱动异常检测系统\
  \ |\n\n## 2.5 强化学习\n\n\n\n\nRL（强化学习）是 ML（机器学习）的一个子类，智能体从周围环境中提取知识，旨在最大化长期累积奖励。由于自动探索机制，RL\
  \ 适用于复杂且令人困惑的环境。图 2.2 显示了 RL 的基本工作流程。在 RL 中，智能体从零开始，通过自动探索外部环境逐渐学习理想的行为（例如策略）。获取环境状态后，智能体将状态转换为高级特征并生成动作。环境执行动作并向智能体返回奖励。根据当前奖励，智能体可以估计长期累积奖励并优化其策略，以最大化该奖励。与传统的\
  \ ML 方法不同，RL 的目标是优化策略以获得未来更好的性能。使用优化后的策略，智能体根据新环境生成另一个动作。随着优化迭代的进行，智能体最终收敛到一种无需显式目标函数和目标即可实现长期奖励最大化的策略。智能体完成训练后，只需要提取环境状态并生成动作。显而易见，智能体策略的优化可以通过预定义的训练程序自动完成，无需过多的人力投入。\n\
  \n![图 2.2 强化学习的框架。](img/c02f002.png)\n\n`图 2.2` 强化学习的框架。\n\nRL 在处理一系列复杂任务（如围棋）方面展现了巨大潜力。由于强大的探索能力，RL\
  \ 已广泛应用于网络管理领域的控制任务，例如虚拟网络嵌入（VNE）、软件定义网络（SD）和区块链。\n\n### 1. 基于 RL 的 VNE\nVNE 是网络虚拟化的主要挑战，旨在将底层网络（SN）资源有效分配给虚拟网络。如图\
  \ 2.3 和深度强化学习）已成功应用于 VNE 任务。\n\n![图 2.3 VNE 过程的描述。](img/c02f003.png)\n\n`图 2.3`\
  \ VNE 过程的描述。\n\n### 2. 基于 RL 的 SDN\nSDN 促进组织部署应用程序并实现灵活交付。在传统的网络基础设施中，控制面和数据面紧密耦合，网络元素的种异性和复杂性使得其维护成本高昂，且在部署新服务时，底层基础设施的灵活性较低。因此，SDN\
  \ 提出了一种新方法来增加网络的灵活性和可控性。在 SDN 中，控制操作集中在控制器中，负责发布网络策略，如网络切片、负载均衡、路由和流量工程。然而，大多数操作都是\
  \ NP-hard 的，这对 SDN 技术构成了巨大挑战。最近，基于 RL 的 SDN 控制器凭借卓越的自动探索性能显著优化了 SDN 功能。在 SDN 问题中，动作可以定义为发布的控制策略。环境状态由控制面和数据面的状态组成。奖励的定义考虑了负载均衡、流量工程等。\n\
  \n### 3. 基于 RL 的区块链\n作为一种革命性技术，区块链由于透明性、去中心化加密对现代社会产生了巨大影响。自加密货币出现以来，区块链受到了广泛关注。区块链被定义为相互连接的数字块链作为开放账本。许多应用受益于区块链保护其信息交换。通过结合区块链和\
  \ RL 的优点，许多基于 RL 的区块链技术已应用于网络安全管理。一方面，区块链的应用可以确保管理的安全隐私；另一方面，RL 的使用可以在无需过多人力的情况下优化管理策略。\n\
  \n通常，根据优化目标，RL 分为基于策略（policy-based）和基于价值（value-based）两类。两者已在网络和安全管理中得到广泛应用。接下来，我们将以更通用的方式介绍\
  \ RL 在网络管理和安全中的应用。\n\n### 2.5.1 基于策略的\n\n基于策略的 RL 方法直接优化累积长期奖励，同时保持相对稳定并在较小的学习率下改进。在每个\
  \ epoch（epoch）中，策略梯度是从单条轨迹估计的，由于样本效率低，其方差极大。我们将以 MCTS 算法为例来说基于策略的 RL 的流程。该算法的想法是创建一个轨迹树，而不是探索所有轨迹，其中在每个\
  \ epoch 中只选择最有前景的轨迹。该算法包含四个步骤，并多次执行，如图图 2.4 所示。\n\n(i) *选择*。RL 智能体从根节点开始，向胜利概率最高的子节点移动。(ii)\
  \ *扩展*。在选择合适的节点后，应用扩展通过扩展所选节点并创建许多子节点来进一步扩展动作。(iii) *模拟*。智能体进行一次或多次模拟，并为每次模拟累积奖励。(iv)\
  \ *回溯*。由于奖励的存在，需要通过逐个回溯树节点来更新其父节点的总奖励。最后，树的状态会发生改变，并影响未来选择过程的节点。\n\n\n\n\n由于在收敛性和高维动作空间中的卓越性能，基于策略的方法（policy-based\
  \ methods）被广泛应用于网络和安全管理。网络和安全管理中的一些相关工作如表 2.3 所示。Haeri 和 Trajković (2017) 使用马尔可夫决策过程（MDP）将虚拟节点映射问题形式化，并使用\
  \ `MCTS` 算法为所提的 MDP 设计了动作策略，通过缩短计算时间改进了嵌入解决方案。在 Zheng 等人 (2020) 的工作中，`MCTS` 与节点重要性的结合加速了领域特定知识的提取。Zhang\
  \ 等人 (2020) 提出了一种基于强化学习（RL）的流量重路由方法，该方法学习了一种自动选择关键流的策略，以平衡链路利用率。\n\n![图 2.4 MCTS\
  \ 的框架。](img/c02f004.png)\n\n图 2.4 `MCTS` 的框架。\n\n表 2.3 基于策略的强化学习应用示例。\n\n| 应用 |\
  \ 工作 | 功能 |\n| --- | --- | --- |\n| VNE | Haeri 和 Trajković (2017) | 使用 `MCTS` 解决虚拟节点映射\
  \ |\n| --- | --- | --- |\n| Soualah 等人 (2015) | 提出一种基于 `MCTS` 的批量嵌入策略 |\n| Xiao\
  \ 等人 (2019) | 采用基于策略梯度的方法提高效率 |\n| Zheng 等人 (2020) | 提出一种基于 `MCTS` 的批量嵌入策略 |\n|\
  \ SDN | Zhang 等人 (2020) | 使用基于策略的方法平衡链路利用率 |\n| Li 等人 (2018b) | 实现全局最优负载均衡 |\n\n\
  ### 2.5.2 基于价值\n\n基于价值（Value-based）的强化学习方法可以从从同一环境中采样的许多轨迹中学习。在基于价值的方法中，首先选择价值函数，然后根据不同的轨迹寻找新的价值函数。该过程将重复，直到找到最优价值函数。根据价值函数，智能体可以始终选择值最高的动作。例如，![upper\
  \ Q](img/c02-i0011.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>-学习（Q-learning）是一种代表性的基于价值的强化学习算法，旨在在给定当前状态下寻找要采取的最佳动作。“![upper\
  \ Q](img/c02-i0012.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>”在\
  \ ![upper Q](img/c02-i0013.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>-学习中代表了给定动作在积累某些未来奖励的用处。一方面，![upper\
  \ Q](img/c02-i0014.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>-值可以通过深度学习来学习，这被称为深度\
  \ ![upper Q](img/c02-i0015.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>-学习。另一方面，![upper\
  \ Q](img/c02-i0016.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>-值可以定义在表格中，命名为表格型\
  \ ![upper Q](img/c02-i0017.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>-学习。\n\
  \n由于具有高样本效率和低方差，基于价值的方法被广泛应用于网络和安全管理。一些相关工作如表 2.4 所示。Yan 等人 (2020) 首次将网络与深度 ![upper\
  \ Q](img/c02-i0018.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>-学习结合以解决\
  \ VNE，提高了了接受率。Yao 等人 (2018) 基于基于价值的强化学习动态优化了性能。为了解决扩展性问题，Sun 等人 (2021) 使用了 ![upper\
  \ Q](img/images0019.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>-学习技术用于\
  \ SDN。Guo 等人 (2019) 考虑了状态并获得了更高的比例。Chen 等人 (2020) 显示了路由可以获得奖励。He 等人 (2020) 阐述了安全和隐私问题。Feng\
  \ 等人 (2019) 联合设计并优化了资源，使用了一种深度 ![upper Q](img/images0020.png)<math display=\"inline\"\
  \ overflow=\"scroll\"><mrow><mi>Q</mi></mrow></math>-学习方法。\n\n![表 2.4 基于价值的强化学习应用示例。](img/c02-i009.png)\n\
  \n## 2.6 网络和安全管理的行业产品\n\n### 2.6.1 网络管理\n\n网络管理的概述如表 2.5 所示。\n\n#### 2.6.1.1 Cisco\
  \ DNA Center\n\nCisco DNA Center 是一个基于意图的网络管理控制平台。Cisco DNA Center 软件运行在 Cisco DNA\
  \ Center 设备上并控制所有的物理设备。以下是 AI 在 Cisco DNA Center 中的应用：\n\n*   Cisco DNA Center 将业务意图翻译为网络策略并在整个有线和无线基础设施中应用这些策略，例如访问控制、流量路由和\
  \ QoS。基于策略的访问控制和网络分段是基于 Cisco DNA Center 和身份服务引擎（ISE）构建的 Cisco 软件访问（SD-Access）解决方案的关键功能。在\
  \ Cisco DNA Center 中的 AI Network Analytics 和 Group Policy Analytics 识别端点、将相似端点分组并确定组通信行为。Cisco\
  \ DNA Center 然后促进创建允许组成员之间和组内通信的策略。ISE 然后激活底层基础设施并分段网络，创建虚拟覆盖层以遵循这些策略。这种分段在工作场所实施了零信任安全，降低了风险，包含了威胁，并通过为端点提供所需的访问权限帮助验证监管合规性。\n\
  \n*   Cisco DNA Assurance 使用 AI/ML 使网络上的每一点都成为传感器，实时发送应用程序性能和用户连接的持续流遥测数据。简洁直观的仪表板显示详细的网络健康状况并标记问题。然后，引导式修复自动解决问题，使网络保持在最佳状态，减少了琐碎的故障排除工作。结果是一致的体验和主动的网络优化，减少了在故障排除任务上花费的时间。\n\
  \n\n\n\nAI 安全公告使用机器推理引擎（`MRE`）来识别网络中的潜在漏洞。`MRE` 可以从机器推理知识库动态更新，以发现新的安全问题。Cisco DNA\
  \ Center 支持的交换机和路由器可以进行扫描，以识别带有安全公告的软件镜像。\n\nTable 2.5 网络管理产品摘要。\n\n| 公司 | 产品 |\
  \ 类型 |\n| --- | --- | --- |\n| Cisco | DNA center | 基于意图设备 |\n| Loom systems | Sophie\
  \ | 基于日志的监控软件 |\n| Juniper | Ex4400 交换机 | 安全交换机 |\n| Juniper | SRX 系列服务网关 | SD-WAN\
  \ 安全路由器 |\n| 华为 | SeerAnalyzer | 智能分析软件 |\n\n### 2.6.1.2 Sophie\n\nSophie 是一款由 AIOps\
  \ 驱动的 IT 监控工具。它可以在客户受影响之前防止 IT 事件并提供相应的解决方案。Sophie 自动解析并分析所有网络设备的日志，学习环境基准，并对已知和未知问题发出警报。通过通过根因和见察丰富警报，Sophie\
  \ 使用户能够变得主动，并将平均解决时间（`MTTR`）缩短 45%![percent-sign](img/c02-i0021.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mo>&#37;</mo></mrow></math>。\n\n#### 2.6.1.3\
  \ Juniper EX4400 交换机\n\nEX4400 交换机可以为 Mist AI 引擎提供真实 AIOps 所需丰富流数据和元数据。通过在 EX4400\
  \ 交换机中引入 Mist AI 驱动的 Wired Assurance 和 Marvis VNA，操作人员可以轻松发现“微小”问题，例如电缆故障和 VLAN\
  \ 配置错误，并使用简单的查询获取有线交换域的见察。\n\n#### 2.6.1.4 Juniper SRX 系列服务网关\n\nJuniper SRX 系列服务网关是软件定义广域网（SD-WAN）安全路由器领域的旗舰产品，集成了高级安全防火墙。Mist\
  \ AI 于 2020 年扩展到 SRX 系列服务网关。它允许客户设置并实施服务级别，确保跨 WAN 的良好用户体验，客户可以使用 Marvis VNA 进行简单的故障排除并获取见察。通过从\
  \ Session Smart 路由器提取遥测数据到 Mist AI 引擎中，客户现在可以在 WAN 范围内设置、监控和实施服务级别，主动监控异常情况和其他边缘事件，并进一步增强对\
  \ WAN 情况的理解，以确保卓越的用户体验。此外，Marvis 虚拟网络助手（由 Mist AI 驱动）可以使用自然语言查询对 Session Smart SD-WAN\
  \ 环境进行故障排除，并在用户受影响之前采取主动措施纠正问题。\n\n### 2.6.1.5 华为 SeerAnalyzer\n\n华为 SeerAnalyzer\
  \ 是一种支持大数据和 AI 的新一代网络智能分析系统。SeerAnalyzer 使用遥测等技术收集实时、全量的网络运行状态数据，利用大数据技术高效地预处理和存储这些数据，并使用大数据分布式计算引擎对海量数据进行实时和离线计算。算法智能地分析复杂数据，获取对整个网络健康状况和问题的见察，结合专家知识和相关算法定位问题根因，并对关键故障进行\
  \ AI 预测。SeerAnalyzer 收集和分析的结果数据提供开放 API 接口，便于上层应用系统的集成。以下是 AI 在华为 SeerAnalyzer 中的应用。\n\
  \n*   SeerAnalyzer 使用 `Spark` 和 `Flink` 等分布式计算引擎通过集群能力提供高可靠性，并使用 AI 算法完成数据在线/离线分析任务，以满足各种场景下的智能运维分析需求。它可以支持每分钟数百万级的数据流分析能力。\n\
  *   它通过收集网络设备状态数据、协议消息数据、流量转发数据、用户接入流程数据、日志数据等实现全网状态感知，并使用 ML 算法和专家系统实现网络故障的实时感知和智能故障根因定位。它还为运维人员提供修复建议。\n\
  *   它利用对海量数据的 AI 分析评估网络质量、用户体验、应用等，并提供网络优化和关键保障能力。\n*   它利用高性能采集、实时专家系统和 AI 算法计算完成故障环境验证、故障检测、影响验证和隔离推送。\n\
  *   SeerAnalyzer 使用智能算法持续分析网络积累的历史数据，从而预测网络故障和性能瓶颈，为运维人员的预干预和规划提供依据。\n\n### 2.6.2\
  \ 安全管理\n\n安全管理产品摘要所示 Table 2.6。\n\n### 2.6.2.1 SIEM, IBM QRadar Advisor with Watson\n\
  \nIBM QRadar Advisor with Watson 是一款 SIEM（安全信息和事件管理）工具，其内置 AI 解决方案集成了日志分析、网络流量分析和自动安全运营中心（SOC）任务生成功能。认知计算是一种先进的\
  \ AI，使用各种形式的 AI（包括机器学习算法和深度学习网络）随时间不断增强和提高智能水平。Watson 是 IBM 的认知 AI 技术，可以通过每次交互进行学习，发现威胁之间的联系并提供实用的见察。最终，用户将更有信心并更快地响应威胁。IBM\
  \ QRadar Advisor with Watson 可以自动生成每日 SOC 任务，发现调查中的共同点，并为分析师提供实用反馈，让他们有更多时间关注调查中更重要的因素，同时提高分析师的效率。\n\
  \n### 2.6.2.2 FortiSandbox\n\n当的恶意软件包含了利用漏洞等新技术。利用合法应用程序中的漏洞会导致异常行为，攻击者可以利用这种行为来破坏计算机系统。利用未知软件漏洞的攻击被称为零日攻击，在引入沙箱之前，没有有效的手段可以阻止它。计算机安全背景下的恶意软件沙箱是将应用程序（如打开\
  \ Word 文档）的行为限制在隔离环境中。在这个安全环境中，沙箱分析对象的动态行为及其在伪用户环境中的各种交互，并发现任何恶意意图。因此，如果发生意外情况，只会影响沙箱而不会影响网络上的计算机和其他设备。与此同时，任何恶意意图都会捕获，生成警报和相关的威胁情报以阻止这种零日攻击。FortiSandbox\
  \ 是一款 AI 驱动、顶级的且集成的沙箱。以下是 FortiSandbox 的解决方案：\n\n| 公司 | 产品 | 类型 |\n| --- | --- |\
  \ --- |\n| IBM | QRader Advisor with Wastom | SIEM |\n| Fortinet | FortiSIEM | SIEM\
  \ |\n| Fortinet | FortiSandbox | 沙箱 |\n| Fortinet | FortiEDR | 终端检测与响应软件 |\n| Fortinet\
  \ | FortiClient | 终端软件 |\n\n\n\n\n\n# H3C SecCenter CSAP: 威胁发现与运营管理平台\n\n*   行业首创专利申请基于\
  \ ML 的静态分析和基于 ML 的动态分析。\n*   基于 MITRE ATT&CK 标准的报告。\n*   通过集成 Fortinet 和非 Fortinet\
  \ 解决方案，实现自动化零日漏洞防护。\n\n### 2.6.2.3 FortiSIEM\n\n随着数字化转型席卷每一个行业，攻击面急剧（且不断）扩大，这使得安全管理变得日益困难。安全团队在应对由大量安全设备产生的海量告警和其他信息时感到力不从心。网络安全人才的短缺让这种情况变得更加困难。基础设施、应用程序和终端（包括\
  \ IoT 设备）都必须确保安全。这需要对所有设备和所有基础设施实现实时可见性。组织还需要知道哪些设备代表威胁以及威胁出现在何处。\n\n`FortiSIEM\
  \ UEBA` 利用 `ML` 和统计学方法建立正常行为的基准，并将针对业务关键数据的异常用户行为纳入实时的、可操作的洞察。通过结合从终端传感器、网络设备流、服务器和应用程序日志以及云\
  \ API 获取的遥测数据，`FortiSIEM` 能够构建用户、同类组、终端、应用程序、文件和网络的全面画像。`FortiSIEM UEBA` 行为异常检测是一种低开销但高保真的方法，可以获得从终端到本地服务器、从网络活动到云应用的端到端活动可见性。\n\
  \n### 2.6.2.4 FortiEDR\n\n高级攻击可能只需要几分钟甚至几秒钟就能破解终端。第一代终端检测与响应 (`EDR`) 工具根本无法处理这种攻击。它们需要人工进行分类和响应。面对瞬息变化的威胁，这种方法不仅效率低下，而且产生大量的指标，对于已经精于不堪的安全团队来说无疑雪上加霜。此外，传统的\
  \ `EDR` 工具会增加安全运营成本并降低运营效率，对业务产生负面影响。`FortiEDR` 使用 `ML` 驱动的反病毒引擎防止恶意软件预执行。这种跨操作系统的下一代反病毒\
  \ (`NGAV`) 功能可以被配置并构建到单个轻量级代理中，允许用户无需额外安装即可为任何终端组提供恶意软件防护。\n\n### 2.6.2.5 FortiClient\n\
  \n`FortiClient` 是一个 `Fabric Agent`，在单一、模块化的轻量级客户端中提供防护、合性和安全访问。`Fabric Agent` 是一种运行在终端（如笔记本电脑或移动设备）上的终端软件，它与\
  \ `Fortinet Security Fabric` 通信，为该设备提供信息、可见性和控制。它还实现了到 `Security Fabric` 的安全远程连接。`FortiClient`\
  \ 的 `EPP/APT Edition` 通过增加基于 `AI` 的 `NGAV`、终端隔离和应用程序防火墙，以及对云沙箱的支持，扩展了 `Zero Trust\
  \ Network Access Edition`的功能。\n\n### 2.6.2.6 H3C SecCenter CSAP\n\n`H3C SecCenter\
  \ CSAP` 是一个安全威胁发现与运营管理平台。它引入了基于 `AI` 的智能威胁分析。以下是其特性：\n\n*   根据不同的使用场景，它主动调整模型算法参数，使安全分析结果更符合实际网络状况。\n\
  *   基于现有的安全事件，它依赖攻防专家的经验，关联资产和多维度信息，提供“专家级”分析。\n*   它引入了如监督学习和 `RL` 等 `AI` 算法，利用“专家脑”检测已知和未知类型。\n\
  *   它建立了行为基准，并根据网络流量判断各种行为。\n\n## 2.7 网络管理标准\n\n### 2.7.1 网络管理\n\n`ETSI` 行业利益小组\
  \ (`ENI`) 规定了一套用于通用网络辅助系统架构的用例和派生需求。相关规范详见表 `2.7`。\n\n| 标准化机构 | 工作组/项目 | 发布日期 |\n\
  | :--- | :--- | :--- |\n| `ETSI` | `网络智能 (ENI)` `ISG` 系列认知管理规范 | 2021.03 |\n| `NGMN`\
  \ | `端到端 (E2E)` | 2020.10 |\n| `ONF` | `软件定义无线网络 (SDRAN)` | 2020.08 |\n| `ITU` |\
  \ `ITU-T 研究组 13` `建议 ITU-T Y.3172` | 2019.06 |\n\n#### 2.7.1.1 认知网络管理\n\n`ETSI`\
  \ 行业利益小组 (`ENI`) 开发`认知网络管理`规范，旨在利用 `ML` 和 `推理` 等 `AI` 技术随时间提升运营商体验。`ENI` 规范详见表 `2.8`。\n\
  \n| 名称 | 主题 | 发布日期 |\n| :--- | :--- | :--- |\n| `ETSI GR ENI 008` | `意图感知自治 (ITANA)`\
  \ | 2021.03 |\n| `ETSI GR ENI 010` | `AI 应用网络评估` | 2021.03 |\n| `ETSI GR ENI 001`\
  \ | `ENI 用例` | 2020.12 |\n| `ETSI GR ENI 002` | `ENI 需求` | 2020.12 |\n| `ETSI GR\
  \ ENI 006` | `概念验证框架` | 2020.05 |\n| `ETSI GR ENI 007` | `AI 应用网络定义` | 2019.11 |\n\
  | `ETSI GR ENI 004` | `ENI 核心术语` | 2019.10 |\n| `ETSI GR ENI 001` | `ENI 用例` | 2019.09\
  \ |\n| `ETSI GR ENI 005` | `系统架构` | 2019.09 |\n| `ETSI GR ENI 002` | `ENI 需求` |\
  \ 2019.09 |\n\n`ISG ENI` 的方法采用“观察-调整-决策-行动” (OODA) 控制模型，使系统能够根据用户需求、环境条件和业务目标的变化调整提供的服务。`SDN`、`NFV`\
  \ 和`网络切片`等技术的引入意味着网络变得更加灵活、强大且可配置。`ISG ENI` 将使部署更加智能和高效。\n\n#### 2.7.1.2 端到端 5G\
  \ 及以后\n\n\n\n\n\n下一代移动网络联盟（NGMN）于 2020 年 11 月发布了 5G 端到端（E2E）架构框架的最新需求。其目标是推进 5G\
  \ 生态系统，实现异构接入、虚拟化、自治能力、前瞻性服务赋能以及支持 5G 全潜力的新兴应用场景。本出版物的内容基于第一份 NGMN 5G 白皮书及其他相关的\
  \ NGMN 出中描述的架构概念和方向。对于演进中的 5G 生态系统至关重要，NGMN 的最新需求描述了推进前瞻性技术和用例所需的后续步骤，这将使网络服务供应商能够提供新能力并增强客户体验。由于有许多新的\
  \ 5G 用例需要交付，从端到端的视角来看，多样化的服务部署是一项挑战。NGMN 通过将敏捷服务部署视为认知平台即服务（PaaS）的目标之一来解决这一问题，并关注\
  \ AI 和 ML 数据模型。\n\n本白皮书从实体和功能方面概述了表征 E2E 框架能力的需求。架构视角和考量强调了 E2E 框架需求的定义。这与 5G 预想的服务类别——增强移动宽带、大规模物联网和高可靠低延迟通信相辅相。此外，文档详细分析了自治网络，它为系统级自动化提供了一个可扩展、可定制和自组织的模型。在这里，虚拟化和可编程以端到端的方式采用。自组织是自治网络自动化的不可或缺的一部分，能够动态学习并适应系统及其环境不断变化，同时满足服务\
  \ KPI 和 QoS 体验。\n\n### 2.7.1.3 软件定义无线接入网络\n\n2020 年 8 月，开放网络基金会（ONF）宣布成立 `SD-RAN`\
  \ 项目（软件定义无线接入网络），旨在为移动 4G 和 5G RAN 部署创建开源软件平台和多供应商解决方案。起初，该项目专注于构建一个与 `O-RAN` 架构兼容的开源近实时\
  \ RAN 智能控制器（`nRT-RIC`）。新的 `SD-RAN` 项目由领先运营商以及对齐的技术公司和组织组成的财团支持，他们共同致力于创建一个真正的开放\
  \ RAN 生态系统。创始成员包括 AT&T、中国移动、中国联通、德国电信、Facebook、Google、Intel、NTT、Radisys 和中兴。\n\n\
  ONF 在构建部署在全球各级运营商网络中的开源平台方面拥有良好记录。ONF 的云原生解决方案均利用解构和白盒硬件，利用 `SDN`、`NFV` 和最新的云技术来构建灵活、高性能、高可用的解决方案，将智能和控制从专有的特定设备移动到云端。迄为止，ONF\
  \ 已经处理了广泛的运营商用例，包括数据中心、固定接入、回传、光传输和移动核心域。移动 RAN 是最具挑战性的用例之一，它还尚未从解构、多供应商互操作性和 `SDN-化`\
  \ 中获益。现在，行业正围绕 `O-RAN ALLIANCE` 指定的开放架构和接口达成一致，`SD-RAN` 社区已经成立，以帮助将 ONF 独特方法的完整收益带到\
  \ RAN 领域。`SD-RAN Community` 正在构建与 `O-RAN` 架构兼容的开源 RIC 控制器和 ML/AI 驱动的 `xApps`。\n\n\
  ### 2.7.1.4 未来网络中 ML 的架构框架\n\nML 在增强网络管理和编排方面具有巨大前景。通过从网络产生的数据中获取洞察，ML 可以产生预测以支持网络运营和维护的优化。随着网络复杂度增加以支持多种信息通信技术（ICT）服务的共存，这种优化变得越来越具有挑战性，也越来越重要。网络运营商旨在通过与多种技术和网络层次相关的数据来为\
  \ ML 模型提供燃料。他们需要能够使其对 ML 投资具有“未来保障”的部署机制。他们需要接口在网络多个层级的 ML 功能之间传输数据和训练好的 ML 模型。建议\
  \ `ITU Y.3172` 规定了满足这些要求的架构框架。`ITU Y.3172` 于 2019 年 6 月提出，由 `ITU-T 研究组 13` 负责。`ITU\
  \ Y.3172` 为 ML 高效益地集成到 5G 和未来网络奠定了基础。\n\n### 2.7.2 安全管理\n\n近年关于安全管理的标准主要旨在保护 AI。它们如表\
  \ 2.9 | 行业小组 (ISG) | 问题说明 (`ETSI GR SAI 004 v1.1`) | 2020-12 |\n| ETSI | 人工智能安全\
  \ (SAI) | 行业小组 (ISG) | 缓解策略报告 (`ETSI GR SAI 005 v1.1`) | 2021-03 |\n\n#### 2.7.2.1\
  \ 保护 AI\n\nAI 快速扩展到具有新利益相关者的新行业，加上变化的威胁格局，给安全带来了严峻挑战。AI 每天影响着我们的生活，从手机上的本地 AI 系统到使用\
  \ AI 改进工业流程的大厂家。如果没有高质量的标准，AI 可能会产生新的攻击并恶剧安全问题。\n\nETSI 人工智能安全小组 (`SAI`) 关注三个关键领域：使用\
  \ AI 增强安全、缓解利用 AI 的攻击以及保护 AI 本身。ETSI `SAI` 在 AI 巨大增长的背景下工作，创建保护和改进 AI 安全的标准。\n\n\
  `ETSI GR SAI 004 v1.1` 于 2020 年 12 月发布。它描述了基于 AI 的系统的安全问题和解决方案，重点关注 ML，以及 ML 生命周期中每个阶段阶段涉及机密性、完整性和可用性的挑战。它还描述了\
  \ AI 的一些更广泛的挑战，包括偏见、伦令和可解释性。描述了多种不同的攻击向量，以及若干真实的用例和攻击。\n\n`ETSI GR SAI 005 v1.1`\
  \ 于 2021 年 3 月发布。它总结并分析了 `ETSI GR SAI 004 v1.1` 中讨论的针对 AI 系统的现有和潜在缓解措施。目标是为缓解引入\
  \ AI 带来的威胁提供技术综述。该技术综述介绍了通过缓解已知或潜在安全威胁来保护基于 AI 系统的现有。它还针对在某些潜在用例中采用基于 AI 缓解措施的安全能力、挑战和局限性。\n\
