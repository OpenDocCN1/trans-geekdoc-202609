  \ 0.2 时，`Oracle` 只标记了 20% 的数据。图 5.5 展示了我们提出的方案（用 `CVAE` 表示）与其他相关方案获得的 TDR 和 FAR\
  \ 结果，使用了两个人工数据集 ![上 S I N E](img/c05-i0082.png)<math display=\"inline\" overflow=\"\
