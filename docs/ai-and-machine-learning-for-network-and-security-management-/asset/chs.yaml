  \ algorithm` 应用于 `LogRobust`）以及 `SMOTE2‐LogRobust`（将 `Borderline‐SMOTE2 algorithm`\
  \ 应用于 `LogRobust`）。这些模型实现的召回率如图图 7.22 所示。`Cosen–LogRobust` 的召回率低于 `ADASYN'LogRobust`\
  \ 和 `SMOTE2‐LogRobust`，因为 `cost ‘‘sensitive learning` 只赋予不同的分类权重，而过采样算法会生成新样本来平衡训练数据。虽然解决日志不平衡问题的传统算法是有效的，但它们实现的召回率低于\
  \ `AllRobust`。当比例从 2:1 增加到 5:1 时，`AllRobust` 实现的召回率为 97%，仅下降了 9![percent-sign](img/c07-i0119.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>%</mi></mrow></math>。因此，`AllRobust`\
  \ 对日志数据的平衡比例具有鲁棒性。\n\n![图 7.22 在 HDFS 训练集上使用 24% 标签训练后实现的召回率](img/c07f022.png)\n\
  \n## 7.5 讨论\n\n\n\n\n# 引言\n\n传统的日志异常检测方法（Lou 等人，2010; Xu 等人，2009; He 等人，2018a; Liang\
  \ 等人，2007; Meng 等人，2018; He 等人，2018b; Zhang 等人，2016; Du 等人，2017; Vinayakumar 等人，2017)）使用独热编码或日志计数向量来表示单条日志或基于日志的序列。它们忽略了日志中包含的语义信息。在之前的日志数据上训练后，它们对新出现的日志表现不佳。\n\
  \n随后，人们提出了基于词嵌入和注意力机制的工作（Bertero 等人，2017; Brown 等人，2018; Zhang 等人，2019）。这些工作专注于从日志中提取语义信息。`LogRobust`（Zhang\
  \ 等人，2019）是文献中最先进的方法。尽管这些基于词嵌入的方法对新出现的日志具有鲁棒性，但它们在处理不平衡日志数据方面仍然不够鲁健。在不平衡的日志数据上训练会使分类器偏于多数类，分类器很难学习到正确检测异常。\n\
  \n虽然在最先进的 `LogRobust`（Zhang 等人，2019）上应用传统的过采样或代价敏感学习算法可以解决这个问题，但它们的性能不如我们提出的 `AllRobust`\
  \ 方法。与它们不同，`AllRobust` 结合词嵌入和区域嵌入来表示日志。这种丰富的语义信息使得 `AllRobust` 对不平衡数据具有鲁棒性。基于深度学习的日志异常检测方法需要大量的标记日志来进行训练。然而，获取标签需要大量的人力，相应的成本很高。因此，我们将\
  \ `FixMatch` 应用于训练阶段，将之前用于图像数据的两种数据增强方法替换为广泛用于文本数据的 `EDA` 和回译法。\n\n## 7.6 结论\n\n\
  在本章中，我们首先介绍了真实系统中新出现日志的现状。大多数日志异常检测方法在之前的日志数据上训练后，对新出现的日志表现不佳。在不平衡的日志数据上训练很容易让分类器偏向日志数量较多的类别。然后我们介绍了解决此问题的典型方法，包括代价敏感学习和重采样（例如\
  \ `SMOTE` 和 `ADASYN`）。\n\n我们提出了用于日志异常的 `AllRobust`，包括日志解析、日志向量化和异常检测。训练后，`AllRobust`\
  \ 能够检测单条日志和基于日志的序列的异常。在日志向量化阶段，它利用词嵌入和区域嵌入用向量来表示日志，该向量包含了足够的上下文信息。因此，`AllContext`\
  \ 对新出现的日志具有鲁棒性，因为它可以理解异常的上下文。与传统方法不同，`AllRobust` 依赖于这种丰富的上下文信息来解决由不平衡日志数据引起的问题。我们将\
  \ `AllRobust` 与之前的先进方法 `LogRobust` 进行了比较。所提出的 `AllRobust` 的准确率是 `LogRobust` 的两倍。为了评估对新出现日志的鲁棒性，我们在不平衡的\
  \ `Thunderbird` 数据集上评估了 `AllContext`，测试数据集中的所有样本在训练集中不存在，`AllRobust` 实现的准确率达到了 97%。实验表明，`AllRobust`\
  \ 在不平衡的日志数据上训练后，对新出现的日志数据具有鲁棒性。\n\n在真实的生产环境中，标签的获取需要大量人力，特别是当数据只能由专家正确标记时。`FixMatch`\
  \ 算法由 Google Research 于 2020 年提出。它使用伪标签和一致性正则化来生成人工标签。它设置了一个阈值，除非预测值高于阈值，否则不会保留样本。尽管有效，但这些数据增强方法（即弱增强和强增强）是用于图像数据的，而不是属于文本数据的日志数据。我们研究了现有的文本增强方法，包括\
  \ `EDA` 和回译。我们通过设置较小的 `alpha` 将 `EDA` 视为我们的弱增强方法，并将回译视为我们的强增强。结果显示，`AllRobust` 仍然优于传统方法。\n\
