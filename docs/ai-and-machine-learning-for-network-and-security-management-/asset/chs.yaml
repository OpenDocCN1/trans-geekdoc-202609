  \n#### 8.3.1.2 日志增强\n\n我们设置了三个实验来评估我们的方法，分别使用未知类别数据、不平衡数据和少样本数据。为了确保变量的唯一性，在未知类别数据和少样本实验中我们需要平衡的数据集。因此，我们通过简单数据增强（EDA）（Wei\
  \ 和 Zou，2019）来增强数据集。对于训练数据集中的给定日志，EDA 随机选择并执行以下操作之一：\n\n* **同义词替换**：从句子中随机选择 `n`\
  \ 个连续词，并将每个词替换为随机选择的同义词。\n* **随机插入**：从句子中随机选择一个词，并随机选择它的同义词将其插入到句中的随机位置。重复操作 `n`\
  \ 次。\n* **随机交换**：在日志中随机选择两个单词并交换它们的位置。重复操作 `n` 次。\n* **随机删除**：以概率随机删除句子中的每个单词。\n\
  \n通过上述四种操作，一个日志条目可以被增强为多个相似但不同的日志条目。样本较少的类别可以被增强到与样本较多的类别平衡。\n\n#### 8.3.1.3 日志向量化\n\
  \n\n\n\n为了提取日志的语义信息，并实现相似含义的日志事件具有相似向量表示的目的，我们采用了广泛使用的词嵌入方法，将日志事件向量化为通过 `GloVe`\
  \ 预训练的日志向量表示。日志事件中的每个标记（token）均被转换为对应的 `d` 维语义向量，在我们的设置中 `d=200`。对于未知词，我们用唯一的标记\
  \ “UNK” 替换它们，并将其嵌入固定为零向量。向量化之后，日志事件 `S` 被转换为嵌入矩阵 `s = [e_1, e_2, ..., e_N]`，其中 `e_i`、`i\
  \ \\in [1, N]` 是列表中的第 `i` 个词向量，`N` 是日志句子中标记的数量。\n\n### 8.3.2 OpenLog 的架构\n\nOpenLog\
  \ 的整体架构如图 8.7 所示，由三个模块组成：`Encoder Module`（编码模块）、`Prototypical Module`（原型模块）和 `Relation\
  \ Module`（关系模块）。此外，还有一个重要的知识库，可以动态添加和删除日志数据，以实现无需重新训练的类别增的目的。我们将在后续章节中详细阐述这些组件。\n\
  \n![Figure 8.7 The architecture of OpenLog.](img/c08f007.png)\n\n**图 8.7**](#c08.xhtml#R_c08-fig-0007)\
  \ OpenLog 的架构。\n\n#### 8.3.2.1 Encoder Module（编码模块）\n\n日志预处理后，我们需要将日志事件序列样本 `d_i`\
  \ 编码为低维数值特征向量，以便应用分类器。通过这种方式，相似样本彼此靠近，而不同样本可以被区分开。OpenLog 中的编码模块由基于`卷积神经网络`（`CNN`）的词编码器和带自注意力机制的`双向短期记忆`（`LSTM`）句子编码器组成，如图\
  \ 8.8 所示。\n\n图 8.8 编码器 (a) 词级 (b) 句级。\n\n#### 8.3.2.2 Prototypical Module（原型模块）\n\
  \n我们在该模块中应用了原型网络（`Snell et al., 2017`），如图 8.9 所示，这是一种少样本分类的嵌入方法。它学习一个可以进行分类的度量空间。原型网络的分类部分是一个非参数化模型。给定日志序列的编码特征表示\
  \ `x`，`x` 的大小为 `d`。该模块将计算每类样本的原型 `p_k`，其中 `k` 是支持集中的第 `k` 类。每个原型是属于其类别的嵌入表示的平均向量。`p_k`\
  \ 可以表示如下：\n\n```\np_k = \\frac{1}{|S_k|} \\sum_{i \\in S_k} x_i\n```\n\n\n\n其中 `S_k`\
  \ 是类 `k` 的样本集。然后我们选择一个距离函数，即平方欧几里得距离 `d:R^{d_s} \\times R^{d_s} \\to [0, +\\infty)``，来计算原型网络中两点之间的距离，\n\
  \n```\nd(x, p_k) = \\sqrt{(x_1 - p_{k1})² + (x_2 - p_{k2})² + \\dots + (x_{d_s}\
  \ - p_{kd_s})²}\n= \\sqrt{\\sum_{i=1}^{d_s} (x_i - p_{ki})²}\n```\n\n其中 `d(x, p_k)`\
  \ 是查询点 `x` 与类 `k` 原型之间的平方距离。随后，原型网络基于 softmax 函数产生概率分布，\n\n```\nP(y=k|x) = \\frac{e^{-d(x,\
  \ p_k)}}{\\sum_{k'} e^{-d(x, p_{k'})}}\n```\n\n其中 `P(y=k|x)` 是点 `x` 属于类 `k` 的概率。\n\
  \n#### 8.3.2.3 关系模块\n\n\n\n\n\n该模块通过深度学习网络学习比较编码后的测试样本与来自标记支持集及无标记测试集的原型对，并输出它们的关系分值。图\
