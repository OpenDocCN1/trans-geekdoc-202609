  *   **高层奖励** ![r Superscript h](img/c04-i0067.png)<math display=\"inline\" overflow=\"\
  scroll\"><msup><mi>r</mi><mi>h</msup></math>: 高层奖励 ![r Superscript h](img/c04-i0068.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msup><mi>r</mi><mi>h</msup></math>是返回给\
  \ `HEA` 的标量，也称为外源奖励，用于用于评估一个选项的短期收益。\n*   **低层奖励** ![r Superscript l](img/c04-i0069.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msup><mi>r</mi><mi>l</msup></math>: 低层奖励\
