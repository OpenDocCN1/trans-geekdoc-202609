  ><msup><mi>r</mi><mi>l</msup></math>是返回给 `LEA` 的标量，也称为内源奖励，用于评估动作的短期收益。\n*   **折扣因子**\
  \ ![gamma](img/c04-i0071.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>gamma</mi></mrow></math>:\
  \ `gamma` $[[0,1]$](images/c04-i0072.png)<math display=\"inline\" overflow=\"scroll\"\
  ><mi>gamma</mi><mo>&#8712;</mo><mo stretchy=\"false\">\\[</mn>0</mn><mo,><mn>1</mn><mo\
  \ stretchy=\"false\">\\]</math>定义了衡量未来奖励的折扣因子。\n\n### 4.4.2 高层智能体\n\nHEA 的目标根据高层策略选择一个具有最大长期奖励的可行选项（即从基于窗口的批处理中选择一个\
  \ VNR）。并非同等且独立地对待所有 VNRs，上述高层智能体过程确保了算法具有前瞻性。包括两个步骤：\n1. 通过状态编码器编码环境状态。\n2. 根据编码后的状态，HEA\
  \ 估计长期累计奖励并执行 $\\epsilon$-策略（images/c04-i0073.png)<math display=\"inline\" overflow=\"\
  scroll\"><mrow>\\epsilon</mi></math>（Bacon 等）工作的启发，我们应用图卷积网络（GCN）来提取 VN 和 SN 的空间特征。SN\
  \ 的状态可以编码如下：\n\n(4.7) ![Start 1st Row E Superscript upper S equals upper G C N left-parenthesis\
  \ upper S right-parenthesis](img/c04-math-0007.png)<math display=\"block\" overflow=\"\
