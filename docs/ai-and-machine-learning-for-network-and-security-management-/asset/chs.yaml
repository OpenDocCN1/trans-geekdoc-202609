  \n### 7.3.3 向量化\n\n日志解析后，我们从日志事件获得一个向量。给定上述处理，有一些标记：`Midplane`、`Switch` 和 `Controller`。我们需要对它们进行分割。例如，`n`\
  \ (images/c07f002.png) 是。\n\n独热编码是单词向量化的基础方法，但它忽略了文本包含的语义信息。索引位置的值 1，其他位置为 0。这种向量是稀疏且高维的。词嵌入也是一种方法。它使用低维分布向量表示单词，包含了语义信息。词嵌入可以在语言模型或相关任务中训练。基于\
  \ Word2Vec 的方法（Mikolov et al., 2013a, 2013b）通过中心词及其周围单词的语言模型构建词矩阵。矩阵的每一列对应一个词向量。Glove（Pennington\
  \ et al., 2014）根据共现矩阵学习词向量。FastText（Joulin et al., 2017）是一种可以快速分类文本的分类器。它还可以高效地进行特征提取。FastText\
  \ 通过词向量平均来表示文档，并使用全连接层作为分类器。可以在特殊任务中获得词嵌入向量。为了利用单词顺序信息，它添加了一些手动选择的特征。FastText 的输入可以是单词序列、句子或段落。FastText\
  \ 从上下文中提取特征并将其转换为向量。向量通过线性变换传递到隐藏层，隐藏层再次转换以输出每个类别的概率。FastText 通过多层分类器解决了由于类别过多导致的分类缓慢问题。FastText\
  \ 的结构如图 Figure 7.8 所示。\n\nJohnson 和 Zhang (2015) 使用区域嵌入来提取文本中区域的上下文信息。他们的方法学习了三种区域嵌入向量，并将其作为卷积神经网络（CNN）的额外输入。与之前的方法相比，它可以显著降低错误率。Qiao\
  \ 等（2018）学习了一个张量。张量中的每个单词都有一个局部上下文矩阵，对应单词的区域嵌入通过嵌入向量和单词的局部上下文矩阵生成。该结构的性能优于包含 29\
  \ 层 CNN 的优秀结构，但仍然有改进空间。\n\n\n\n\n\n* 首先，一旦学习了词的嵌入向量和局部上下文单元矩阵，它们就是固定的。在预测期间，可以通过词索引来检索它们。然而，即使在不同的语境下，生成的词嵌入向量和局部上下文单元矩阵也是相同的。这导致对区域语义信息的表示不准确。\n\
  * 其次，这种方法表达语义信息的能力仍然有限。局部上下文单元矩阵只考虑固定长度的区域，忽略了该区域之外的部分。\n* 最后，该方法学习的参数数量也非常大，导致了较高的空间复杂度。\n\
  \n自适应区域嵌入（Adaptive Region Embedding，Xiang 等人，2019）的嵌入向量区域是根据不同的上下文动态生成的。虽然区域大小是固定的，但它的输入是整个序列，只需要学习滤波器的参数。自适应区域嵌入首先从文本中提取区域语义信息\
  \ `ACU`（即自适应上下文单元）。然后将其与词嵌入结合，生成词的最终向量表示。鉴于它的成功，我们利用它将每个日志事件转换为固定维的语义向量。`ACU` 的生成过程如图图\
  \ 7.9 所示。\n\n首先，我们使用 FastText 预训练的词嵌入向量将词转换为向量 ![w v Subscript i element-of upper\
