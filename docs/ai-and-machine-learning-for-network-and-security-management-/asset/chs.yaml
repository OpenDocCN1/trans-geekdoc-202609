  \n### 10.2.1.1 手工运维\n\n几十年前，IT 系统的规模较小，运维问题基本上是通过人工方式完成的。在此期间，问题相对简单，大多数集中在硬件、网络和系统层面。具有某些操作系统或网络维护经验的人员可以解决这些问题，他们通常依赖自己的经验和可用技术来手动排查问题。当时，系统运维工具和操作指南并不广为人。随着系统变得日益复杂，组件增多，用户流增加，公司不得不聘用更多的操作人员来处理日益增长的事件。运维成本变得越来越高昂。\n\
  \n### 10.2.1.2 基于工具的运维\n\n在手工运维阶段存在大量重复且单调的操作。随后，人们开始使用脚本来批量执行这些操作，而不是每次都重复相似的命令。操作人员开始使用各种操作工具，并出现了许多不同的脚本来处理不同类型的运维问题。但每个团队都有自己的工具，每当运维需求发生变化时都需要进行调整。这主要是由于运维环境的规范不足，导致编程处理能力较弱。在这种情况下，一些脚本工具和脚本语言开始出现，一些工具的标准文档也开始产生。在早期，操作人员主要使用各种\
  \ shell。后来，`Perl`、`Ruby` 和 `Python` 等知名的动态语言也被广泛应用于脚本工具的实现中，特别是对于复杂的逻辑和场景的自动化实现。\n\
  \n### 10.2.1.3 平台运维\n\n当一些复杂的操作通过脚本封装后，效率得到了提高。然而，随着业务场景的日益复杂、用户和设备数量的增加以及部署服务的多元化，仅仅依靠脚本执行是完全不够的。运维人员需要面对更复杂场景的实现。需要一个流程来连接多个脚本函数，并验证和判断脚本的执行结果。同时，电信领域的产品升级和变更有标准的操作规范和流程。在此阶段，对运维的效率和误操作率有了更高的要求。运维平台开始引入，通过标准和流程释放人力并提高运维效率。平台还抽象了服务变更动作，形成了运维方法、服务目录环境和业务运行模式的统一标准。\n\
  \n### 10.2.1.4 DevOps\n\n随着运维流程的发展，运维人员负责的工作越来越多。除了系统运维（`SYS`），他们还负责应用运维（`SRE`）、运维研发（`DEV`）、数据库运维（`DBA`）以及运维安全（`SEC`）。运维人员与开发人员之间的通信日益增加，运维人员的工作也提前到了产品设计阶段，协助研发人员将服务集成到自动化运维系统中。随着在线化程度的加深，大型企业开始意识到系统运维对企业的效率、稳定性和成本起着决定性作用，他们对运维的需求和要求也越来越高。企业希望能够自动完成与周边运维系统（如监控系统、日志系统、备份系统等）的联动，以减少重复性工作，降低知识传递成本，使运维交付更加高效、安全，并使产品运行更加平稳。\n\
  \n### 10.2.1.5 AIOps\n\n随着机器学习技术的突破以及 `GPU` 和 `CPU` 计算能力的提升，海量数据带来了 AI 革命。AIOps\
  \ 将 AI 应用于运维领域。基于现有的运维数据（例如日志、监控信息、应用信息），AIOps 通过先进的机器学习技术进一步解决了此前阶段运维工具和平台无法解决的问题，提升了系统的预测能力和稳定性，降低了成本并提升了企业的竞争力。在自动化运维的基础上，AIOps\
  \ 加入了一个基于机器学习的“大脑”。指令和监控系统收集决策所需的数据，进行分析决策，并指导自动化脚本执行大脑的决策，从而实现运维系统的总体目标。AIOps 不依赖人工指定的规则，而是倡导机器学习算法从海量运维数据中自动学习，不断完善和总结规则。\n\
  \n### 10.2.2 开源运维系统\n\n本节调研开源运维系统，如表 10.1](#c10.xhtml#c10-tbl-0001）所示。一个完整的运维系统通常包括：\n\
  \n-   **采集**：定期获取监控指标的相关数据。\n-   **存储**：将采集的数据存储在指定的系统中。\n-   **展示**：数据采集后，为了向用户直观地展示，可以对采集的数据进行处理并在看板上显示。\n\
  -   **告警**：当监控指标异常时，监控系统可以自动发送告警信息，甚至可以在告警后自动完成修复。\n\n![表 10.1 开源运维系统](img/c10-i0001.png)\n\
  \n表 10.1 开源运维系统。\n\n#### 10.2.2.1 Nagios\n\n\n\n\n\nNagios (Nagios, 2022) 是一款开源计算机系统和网络监控工具，能够有效监控\
  \ Windows、Linux 和 Unix 宿主机、交换机、路由器和其他网络设备、打印机等的状态。当系统或服务状态异常时，它会发送电子邮件或短信报警，以便在第一时间通知网站运维人员，并在状态恢复后发送正常的电子邮件或短信通知。Nagios\
  \ 在结构上分为两个部分：核心（core）和插件（plug-in）。Nagios 核心提供的监控功能非常少，其余部分通过插件集成到系统中。Nagios 的整体框架如图\
  \ 10.1 所示。\n\n![Figure 10.1 The Nagios structure.](img/c10f001.png)\n\n`图 10.1`\
  \ Nagios 结构。\n\nNagios 由以下部分组成：\n\n*   `NRPE` (Nagios Remote Plugin Executor) 远程执行插件尽可能透明地在远程宿主机上执行。该插件由\
  \ `NRPE` 和 `check_nrpe` 两部分组成。`NRPE` 作为后台进程运行在远程宿主机上，处理来自 Nagios 宿主机 `check_nrpe`\
  \ 插件的命令执行请求。收到授权主机的插件请求后，它会执行与收到的命令名相关的命令行，并将程序输出和返回码传回 `check_nrpe` 插件。`Check_nrpe`\
  \ 是运行在 Nagios 宿主机上的插件，用于与远程宿主机上的 `NRPE` 进程通信。该插件请求在远程主机上执行插件，并等待 `NRPE` 进程执行插件并返回结果。然后，该插件使用远程主机插件执行的输出和返回码作为自身的输出和返回码。\n\
  \n*   `NCPA` (Nagios cross-platform agent) 是一个 Nagios 跨平台代理——一个安装在所有主流操作系统上的单一监控代理。NCPA\
  \ 允许通过 `check_NCPA.py` 进行主动检查，通过 `NRDP` 进行被动检查。NCPA 自带内置的 Web GUI、文档、websocket 图形，并默认受\
  \ ssl 保护。\n\n*   `NRDP` (Nagios remote data processor) 用于 Nagios，是一个基于 PHP 的简单被动结果收集器。它被设计为一种灵活的数据传输机制和处理器，架构简单强大，易于扩展和自定义以满足个人用户的需求。默认情况下，`NRDP`\
  \ 具有允许远程代理、应用程序和 Nagios 实例向 Nagios 服务器提交命令以及主机检查和服务检查的功能。这使得 Nagios 管理员能够使用 `NRDP`\
  \ 快速高效地配置 Nagios 实例的分布式监控、被动检查和远程控制。可以通过开发其他 `NRDP` 插件来扩展 `NRDP`的功能。\n\n*   `NSCA`\
  \ (Nagios service check acceptor) 由 `NSCA` 程序和 `send_nsca` 组成。`NSCA` 程序作为守护进程运行在运行\
  \ Nagios 的中央服务器上。它监听来自远程机器的主机和服务检查结果（使用下文描述的 `send_NSCA` 程序发送）。一旦从远程客户端接收数据，守护进程将尝试验证从客户端接收的数据。这是通过使用\
  \ `nsca.cfg` 文件中存储的密码对数据进行解密完成的。如果解密数据看起来正常（即它是由 `send_NSCA` 程序使用相同密码加密的），守护进程将在\
  \ Nagios 外部命令文件中创建一个条目，告诉 Nagios 处理主机和服务检查结果。`Send_NSCA` 是用于从远程机器将服务检查信息发送到运行 Nagios\
  \ 的中央机器上的 `NSCA` 守护进程的客户端程序。`reads` 服务以 TAB 分隔符格式从标准输入读取服务检查信息。\n\n*   `NSTI` (The\
  \ Nagios SNMP trap interface) 被设计为智能用户界面和组织良好的数据库，能够满足你所有的 SNMP 要求。\n\n随着时间的推移，运维中需要监控的设备越来越多。由于客户端的扩展，Nagios\
  \ 主动监控模式已成为瓶颈。因此，Nagios 在 4.0 版本中停止维护主动监控插件，并默认启用被动监控模式。在被动监控模式下，服务器只接收来自代理收集的信息，这极大地节省了服务器占用的资源，将更多消耗资源的任务转移给代理，并极大地增加了服务器监控的主机数量。Nagios\
  \ 的整体功能主要由插件模式提供。核心框架保持简单并具有良好的扩展性。用户只需根据不同需求安装不同的插件即可实现特定功能。然而，随着运维的精细化，Nagios\
  \ 插件模式的操作相对复杂。运维人员需要安装大量插件，因为需要许多功能。同时，Nagios 配置信息只能以配置的形式修改，这不利于操作和扩展。Nagios 不支持可视化，因此用户需要安装其他工具来提供此功能。默认是使用“Cacti+Nagios”来实现完整的监控系统。\n\
  \n#### 10.2.2.2 Zabbix\n\nZabbix (ZABBIX, 2022) 是一种企业级分布式开源监控解决方案，能够监控许多网络参数和服务器的健康和完整性。Zabbix\
  \ 使用灵活的报警机制，允许用户为几乎任何事件配置基于电子邮件的报警，基于存储的数据提供优秀的报告和数据可视化。Zabbix 主要由以下功能组件组成：服务器、数据库、Web、代理（proxy）和代理（agent）。Zabbix\
  \ 的整体框架如图 10.2 所示。\n\n*   Zabbix 服务器是 Zabbix 软件的核心组件，代理（agent）向其报告可用性和系统完整性信息。服务器也是所有配置信息、统计信息的仓库。\n\
  \n*   所有配置信息以及 Zabbix 收集的数据存储在数据库中。\n\n*   Web 界面允许从任何地方、任何平台访问 Zabbix。该界面是 Zabbix\
  \ 服务器的一部分，通常（但不一定）在与 Zabbix 服务器同一台物理机器上。\n\n*   Zabbix 代理（proxy）可以替代 Zabbix 服务器收集性能和可用性数据。Zabbix\
  \ 代理部署是可选的。然而，代理部署可以分担单个 Zabbix 服务器的负载。\n\n*   Zabbix agent 部署在目标上，用于主动监控本地资源和应用程序，并将收集的数据发送到\
  \ Zabbix 服务器。\n\n作为企业级分布式开源监控解决方案，Zabbix 支持分布式、高可用、灵活报警机制且功能相对完善。然而，Zabbix 集成了许多功能，但\
  \ API 介绍粗糙，数据库条目复杂，因此二次开发并不简单。同时，系统本身庞大且功能众多，因此对轻量化版本的需求很高。Zabbix 配置并非完全文本化，某些配置需要界面操作，难以自动化。\n\
  \n![Figure 10.2 The Zabbix structure.](img/c10f002.png)\n\n`图 10.2` Zabbix 结构。\n\
  \n\n\n\nPrometheus (Prometheus, 2022) 是云原生计算基金会的项目，是一个系统和服务监控系统。它在给定的时间间隔内从配置的目标收集指标，评估正则表达式，显示结果并在观测到指定条件时触发告警。\n\
  \n与传统的 Zabbix 和 Nagios 相比，Prometheus 监控的对象发生了变化。Zabbix 是 1998 年创建的监控软件。那时，大多数服务器仅通过\
  \ IP 地址或主机名来识别，因此 Zabbix 的特点是所有数据必须“属于”某一台主机。随着云计算、弹性计算、容器技术、SaaS 以及其他 IT 形式的出现，像\
  \ Zabbix 这样的运维系统已无法满足监控需求，或者只能以兼容的方式进行监控。然而，Prometheus 并不针对主机或 IP 地址；它只针对指标，并提供固定的数据格式，允许以正确的格式访问系统，提供了更大的覆盖范围和灵活性。\n\
  \nPrometheus 的整体框架如图 10.3 所示。它主要由以下部分组成，即 server、exporter、push gateway、alert manager\
  \ 和 webui。\n\n*   **Server**。Server 是 Prometheus 的核心部分，负责获取、存储和查询监控数据。服务器可以静态地配置监控目标，还可以提供服务发现。服务器本身是一个序列数据库，并提供\
  \ `PromQL` 查询语言用于对存储的数据进行查询和分析。\n*   **Exporter**。Exporter 通过 HTTP 将监控数据采集端点导出到\
  \ Prometheus Server，并以 Prometheus 支持的格式将监控信息导回 Prometheus。采集被分为直接采集和间接采集。作为监控目标的内置功能，直接采集支持\
  \ Prometheus 的实现，并直接向 Prometheus 暴露相关数据。间接采集的 exporter 是监控目标且不支持 Prometheus。因此，必须有一个\
  \ agent 与监控目标兼容，由 exporter 收集指标并暴露 Prometheus。\n*   **AlertManager**。Prometheus\
  \ Server 支持根据 `PromQL` 创建告警规则。如果满足 `PromQL` 定义的规则，则会生成告警。在接收到 Prometheus 服务器的告警后，AlertManager\
  \ 会剔除重复数据、对告警分组、将告警路由到接收模式并生成告警。\n*   **PushGateway**。PushGateway 用于短时间任务。由于此类任务运行时间短，它们可能在\
  \ Prometheus 来拉取之前就已经消失了。为了实现这一点，任务可以将指标直接推送到 Prometheus 中间网关。这种方法主要用于服务级指标，而机器级指标则需要\
  \ node exporter。\n*   **Webui**。Prometheus 为用户提供了一个简单的图形用户界面，用于配置系统或检索数据。\n\n![图\
  \ 10.3 Prometheus 结构 (https://prometheus.io/docs/introduction/overview/). ¶ Source:\
  \ Prometheus/CC BY 4.0.](img/c10f003.png)\n\n**图 10.3** Prometheus 结构 ([`prometheus.io/docs/introduction/overview/`](https://prometheus.io/docs/introduction/overview/))。¶\
  \ Source: Prometheus/CC BY 4.0.\n\nPrometheus 提供了多维数据模型和灵活的查询方法。它可以向多个标签添加监控信息，在维度的任意组合中使用这些标签，并通过\
  \ `PromQL` 查询语言处理数据，使得数据的处理和使用变得简单。Prometheus 支持对各种类型对象的监控，这是监控容器等流行的云基础设施的良好方法。它支持拉取和推送模式的数据采集，灵活响应多种监控场景。Prometheus\
  \ 还支持服务发现、分区采样、数据联邦部署以及大规模集群监控。Prometheus 在数据采集和处理方面做得很好，但它不提供持久的长期存储、异常检测、自动水平扩展或用户管理，并且显示面板较为粗糙，需要\
  \ Grafana 等可视化工具。虽然 Prometheus 本身已经成熟，但它缺少一些常见的运维功能，对这些功能的支持需要运维人员进行额外的配置和开发。\n\n\
  ### 10.2.3 总结\n\n本节总结了传统的运维系统并简介绍了三个常用的运维工具。与 Zabbix 和 Nagios 相比，Prometheus 是一种新兴解决方案，解决了其他当前运维系统难以解决的容器监控问题。可以看出，传统的运维系统在经过近\
  \ 20 年的发展后变得日益成熟和完善。但随着互联网的快速发展，越来越多的新概念被提出，监控系统需要随着业务的发展而演进。当前时代处于运维自动化的阶段。尽管有很多成熟的自动运维系统，但系统仍在不断地迭代和优化中。\n\
  \n我们可以看到基于虚拟化技术的平台快速发展，以及近期融合云或混合云的发展，旨在整合云资源，提供更大的平台来支持大数据、AI 智能、系统操作和管理。这是未来几年业务发展的一个大趋势。运维系统也需要遵循这些变化的业务目标。同时，数据正在从传统的关系型数据转向时序数据。智能化运维被添加到传统的运维系统中。数据正成为运维系统的核心，因此数据存储和处理的发展变得越来越重要。高效的标准查询语言、数据处理方法等正在不断增长和发展。\n\
  \n## 10.3 安全运维\n\n### 10.3.1 引言\n\n随着业务规模的不断扩大，互联网公司越成熟，运维工作的分工就越详细。目前，许多大型互联网公司在初始阶段只有系统运维。随着对服务规模和服务质量的要求，他们逐渐划分了工作。如今的运维工作主要分为四个部分：系统、应用、数据库运维和安全运维。在运维过程中，服务系统的安全是运维人员的一个重点。随着\
  \ IT 技术和业务的发展，以及各种安全漏洞的出现，运维与安全日益融合，人们更加关注安全运维，出现了一个名为“安全运维”的新交叉领域。安全运维负责网络、系统和服务的安全加固，进行常规的安全扫描和渗透测试，开发安全工具和系统，以及处理安全事件。\n\
  \n\n\n\n安全运维不仅是企业网络和信息安全的保障，更是企业生存和快速发展的基石。近年来，安全问题变得日益突出，例如 `struts2` 远程代码执行漏洞、`OpenSSL`\
  \ 心心血漏洞、`bash` Shell 注入漏洞等，这些问题给互联网企业造成了不可估量的损失。与 Web 安全、移动安全或服务安全相比，运维安全问题往往更为严重。一方面，运维中的安全漏洞非常严重。运维服务处于底层，涉及服务器、网络设备、基础应用等。一旦发生安全问题，服务器的安全性将直接受到影响。另一方面，运维漏洞通常反映了企业在安全规范和流程上的问题，或者是这些规范和流程在执行上的问题。在这种情况下，许多服务器可能存在此类安全问题，或者服务可能存在其他的运维安全问题。企业在安全运维方面的投入迅速增加，各种运维问题引起了广泛关注。直到今天，安全运维已成为企业安全建设的重中之重。\n\
  \n### 10.3.2 开源安全工具\n\n本节介绍了多种开源安全工具，并按功能将其分为以下几类。\n\n### 10.3.2.1 访问控制\n\n访问控制是指系统根据用户的身份及其所属的预定义策略组，限制其使用数据资源的手段（Butun\
  \ and Österberg, 2021）。访问控制的主要目的是限制访问主体对对象的访问，以确保数据资源在合法范围内得到有效使用和管理。对于安全运维，有很多实现访问控制的方法。网络安全域隔离是网络安全防护重要且基础的方法之一，也是构建企业数据中心和信息系统时首要考虑的基础问题。安全域内可以实施宽松的安全策略，并在域边界集中管理访问权限。在发生入侵时，可以尽可能地在域内限制异常，以减少系统的整体损害。在域边界，可以使用安全网关、防火墙和堡垒机等一系列设备监控并控制访问信息。一旦建立了统一网关，每个安全区域都可以从外部屏蔽敏感端口的访问，并在内部限制入站流量，这在缓解风险和阻止攻击方面非常有效。几种可应用于访问控制的网关、防火墙和堡垒机开源安全工具列于表\
