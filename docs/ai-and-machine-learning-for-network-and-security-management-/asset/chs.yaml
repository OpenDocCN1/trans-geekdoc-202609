  \ Computing Surveys，53(3):63,2020。\n\n\n\n\n\n*   移动办公已成为未来趋势。随着智能终端的日益普及，越来越多的员工携带个人移动设备（Hatakeyama\
  \ 等人，2021）（包括手机、平板电脑等）。此外，这些移动设备通常不受公司的控制，并且可能不可信。根据 Feng 和 Li (2016) 的研究，这些不可信的设备可能受到来自应用服务、终端软件或硬件资源管理以及数据存储的威胁。\n\
  \n*   云端的大规模使用。云计算的发展为当前的业务模式带来了变革。云负载通常分散在几个不同的地理位置和环境中，使得定义边界变得困难（Bharadwaj 等人，2018;\
  \ DeCusatis 等人，2017; Singh 和 Chatterjee，2016）。\n\n*   虚拟专用网络（VPN）的广泛使用。随着员工对远程访问公司内网的需求增加，VPN\
  \ 已被各种企业广泛使用和部署。结果是此类系统的安全性变得日益困难。允许它们连接 VPN 可能会破坏边界安全，并可能使网络受到外部攻击（Schulz 和 Sadeghi，2009）。\n\
  \n总之，我们可以发现传统的基于边界的防御模型的关键假设已不再有效：边界内的一切都不再被信任。此外，随着数据中心内部流量（即东西向流量）的快速增长，由于缺乏内部网络安全防护，企业内部的安全问题变得更加严重（Zaheer\
  \ 等人，2019）。为了适应当前的新的互联网趋势，研究人员尝试放弃特权企业网络，并提出了**零信任网络**的概念（Ward 和 Beyer，2014）。\n\n\
  ### 9.1.2 零信任网络\n\n与传统的网络防御模型不同，零信任网络对任何实体（例如设备、应用程序、数据包和用户）都不提供默认信任，无论其类型如何或是否与企业网络相关（Puthal\
  \ 等人，2017）。基于“所有网络流量均不可信”的假设，零信任网络对特权访问执行“从不信任，始终验证，并强制执行最小权限原则”。如图 9.1）。无论访问者在任何位置使用何种互联网接入方法，都需要身份验证和授权。因此，所有的访问请求都需要经过检查，对访问主体进行持续的信任评估，并根据信任程度动态调整权限（Yao\
  \ 等人，2020）。\n\n![图 9.1 零信任网络的核心逻辑组件](img/c09f001.png)\n\n图 9.1 零信任网络的核心逻辑组件。\n\n\
  根据 Rose 等人 (2020) 的研究，零信任网络的逻辑组件如图 9.1 所示。因此，零信任网络需要实现以下功能：\n\n*   策略执行点（PEP）。`PEP`\
  \ 负责启用、监控并最终终止主体与企业资源之间的连接。它可能被分为两个不同的组件：客户端（例如用户笔记本电脑上的代理）和资源端（例如位于资源前控制访问的网关组件）。或者，它也可以作为通信路径的门卫（例如访问代理）的单一组件。\n\
  \n*   策略引擎（PE）。该组件负责做出是否授予特定主体访问某资源的最终决策。`PE` 使用企业策略以及来自外部源（例如 `CDM` 系统）的数据作为信任算法的输入，以授予、拒绝或撤销对资源的访问。`PE`\
  \ 与策略管理员组件配对。`PE` 做出并记录决策，而由策略管理员执行决策。\n\n*   策略管理员。该组件负责建立和/或关闭主体与资源之间的通信。它会生成客户端使用的任何身份验证令牌或凭据。它与\
  \ `PE` 紧密结合，并依赖其决策来允许或拒绝会话。`PA` 在创建通信路径时与 `PEP` 通信。\n\n### 9.2 零信任网络解决方案\n\n现有研究主要基于访问代理、软件定义边界（`SDP`）和微隔离来完成零信任网络的构建（Yao\
  \ 等人，2020）。\n\n#### 9.2.1 基于访问代理的零信任网络\n\n在 2009 年遭受高度复杂的高级持续性威胁（`APT`）攻击后，Google\
  \ 开始重新设计一种不再需要特权企业网络的安全模型。相反，Google 提出了 BeyondCorp（Ward 和 Beyer，2014; Beyer 等人，2016;\
  \ Saltonstall 等人，2016），一种基于访问代理的零信任网络，旨在对企业的所有访问进行完全认证、完全授权和完全加密。BeyondCorp 的主要组件如图\
  \ 9.2\n\n图 9.2 BeyondCorp 的组件和访问流程。\n\n组件的简要介绍如下（Ward 和 Beyer，2014):\n\n*   访问代理。Google\
  \ 扩展了 Google Frontend（`GFE`，一组 HTTP/HTTPS 反向代理）以提供其他功能，包括自服务配置、身份验证、授权和集中日志。扩展后的\
  \ GFE 称为访问代理（`AP`）（Spear 等人，2016）。Google 的所有应用程序都通过面向互联网的访问代理面向外部和内部客户端，该代理执行客户端与应用程序之间的加密。此外，访问代理内部的`访问控制引擎`\
  \ 根据要求为应用程序提供服务级授权。访问检查完成后，代理会将请求委托给后端应用程序。\n\n*   托管设备。为了安全地识别设备，BeyondCorp 使用“托管设备”的概念，即由企业采购并积极管理的设备。只有托管设备才能访问应用程序。为了完成设备识别，使用了存储在硬件或软件可信平台模块（TPM）或合格证书库中的设备证书。此外，Google\
  \ 会跟踪设备的变化并将这些信息存储在 `设备清单数据库` 中，以便实时监控设备和证书的安全。由于 Google 拥有多个数据库，因此使用元数据库来对这些多个源的设备信息进行合并和归一化。有了这个元数据库，Google\
  \ 就掌握了所有需要访问企业的设备。\n\n\n\n\n\n- **单点登录 (Single Sign-on)**。单点登录（SSO）系统是一个集中的用户身份验证门户，用于对请求访问企业资源的用户验证第一和第二因子凭据。在通过用于跟踪和管理所有用户的\
  \ `User Database and Group Database`（用户数据库和组数据库）验证后，SSO 系统会生成临时令牌，这些令牌可以作为特定资源授权过程的一部分。\n\
  \n- **流水线 (Pipeline)**。为了动态推断分配给设备或用户的信任级别，流水线提取了用于访问决策的信息。除其他因素外，这些信息包括证书白名单、设备和用户的信任级别，以及关于设备和用户的资产清单详情。最后，这些信息被提供给\
  \ `Access Control Engine`（访问控制引擎），以便做出适当的访问决策。\n\n正如我们在图 9.2 所示，BeyondCorp 仅向外部访问暴露\
  \ `Access Proxy`（访问代理）和 `SSO` 组件，因此其攻击面非常有限。此外，客户端发起连接的位置不再是身份验证和授权的必要因素，这意味着所有访问请求都需要通过逻辑上集中的访问代理进行身份验证和授权。在身份验证和授权之后，访问代理将作为中介在用户和服务之间之间转发数据。\n\
  \n然而，正如我们之前描述的，BeyondCorp 原生仅支持基于 HTTP/HTTPS 协议的应用程序，并且只能管理和授权托管设备，这限制了扩展性以及与第三方软件的兼容性。\n\
  \n### 9.2.2 基于 SDP 的零信任网络\n\nSDP 的概念建立在赋予应用/服务所有者根据需要部署边界（即动态网关）功能的基础上，以保护其服务器（Kumar\
  \ 等人，2019；Singh 等人，2020）。这是通过逻辑组件代替任何物理设备实现的（Moubayed 等人，2019）。SDP 由以下三个主要组件组成：\n\
  \n- **SDP 控制器 (SDP controller)**。SDP 控制器是 SDP 框架中的核心元素（云安全联盟，2022）。它负责作为发起 SDP 主机（见下文）与后端安全控制之间的信任中介，处理所有交换的控制消息。在确定了每个发起主机被授权访问的服务后，控制器会帮助实时配置\
  \ SDP 发起主机和接收主机，以创建相互 TLS 隧道。\n\n- **SDP 客户端/发起主机 (SDP client/Initiating Host(IH))**。SDP\
  \ IH 是支持 SDP 的客户端，它们提交连接到服务器或应用程序的请求。该请求提交给 SDP 控制器，控制器将通过请求 IH 内部的硬件或软件信息来验证 IH。一旦使用之前颁发的证书完成身份验证，将创建一个相互\
  \ TLS 隧道，将 IH 连接到其已授权的服务器或应用程序。\n\n- **SDP 接收主机 (SDP Accepting Hosts (AH))**：SDP\
  \ AH 是接受授权的服务或应用程序的设备，即 AH 通常包括 `Gateway`（网关）和受保护的服务器。它最初被设置为拒绝来自 SDP 控制器之外的所有主机的所有入数据包和请求。在\
  \ SDP 控制器为网关提供经过验证和认证的 IH 的 IP 地址及证书后，`Gateway` 将允许连接请求通过，从而进行客户端与服务器之间的数据传输。\n\n\
  ![图 9.3 SDP 的访问流。](img/c09f003.png)\n\n**图 9.3** SDP 的访问流。\n\nSDP 的访问流如图图 9.3 所示。与基于访问代理的不同，如图\
  \ 9.2 所示，SDP 分离了控制平面和数据平面。相对于 BeyondCorp，SDP 不仅支持 HTTP/HTTPS 协议，还支持 TCP/UDP 协议。\n\
  \n### 9.2.3 基于微隔离的零信任网络\n\n微隔离（Microsegmentation），也称为安全隔离，根据某些原则将数据中心划分为组，然后根据分组部署流量控制策略。在实践中，微隔离可以克服传统\
  \ VLAN 配置复杂的缺点（华为技术有限公司，2020）。这里有两个核心概念：\n\n- **端点组 (End Point Group, EPG)**：指的是端点的分组。\n\
  \n- **组策略 (Group Based Policy, GBP)**：指的是基于组的流量控制。源 VTEP 通过 VXLAN 报头中的 G 位传输微隔离信息。如图图\
  \ 9.4 所示，该位默认为 0。当此位为 1 时，意味着源服务器所属的 EPG 组包含在组策略字段中。\n\n![图 9.4 VXLAN 报头中的微隔离信息。](img/c09f004.png)\n\
  \n**图 9.4** VXLAN 报头中的微隔离信息。\n\n以下以 Server1 访问 Server2 为例，在图 9.5 中介绍了三层数据包本地转发时的微隔离工作机制。\n\
  \n![图 9.5 VXLAN 网络示例。](img/c09f005.png)\n\n**图 9.5** VXLAN 网络示例。\n\n\n\n\n\n我们可以发现，每一个数据包都将根据访问策略进行转发。与\
  \ BeyondCorp 和 SDP 不同，微隔离机制主要关注东西向流量（East–West traffic），且微隔离的实现更关注网络的底层，即网络的 IP\
  \ 层和 MAC 层。\n\n## 9.3 机器学习驱动的零信任网络\n\n如图 9.1 所示，零信任网络与传统网络的主要区别在于，零信任网络将所有流量视为不可信的，这意味着网络上的每一次访问请求都需要被捕获并授权。得益于不同的零信任网络解决方案（即基于访问代理的、基于\
  \ SDP 的、基于微隔离的），所有流量都可以由零信任架构组件进行审查。下一个问题是如何准确且高效地授权用户/设备，即设计一种适用于零信任网络的信任算法。\n\n\
  ![图 9.6 零信任网络中的信任算法过程。](img/c09f006.png)\n\n**图 9.6** 零信任网络中的信任算法过程。\n\n信任算法（`TA`）的过程如图\
  \ 9.6 所示。信任算法从多个源获取输入，最终授予或拒绝请求的访问权限。图 9.6 中的主要主要组件描述如下：\n\n*   访问请求。这是来自主体的实际请求。被请求的资源是使用的主要信息，但也会使用请求者的信息。这可能包括操作系统版本、使用的应用程序和补丁级别。根据这些因素和资产的安全态势，对资产的访问可能会被限制或拒绝。\n\
  *   多源信息。为了确保网络安全，`TA` 应该考虑尽可能多的信息。例如，用户的身份标识和属性（即请求主体）、资产的可观测状态（即请求设备）、资源的访问需求以及威胁情报的警报，都可以由\
  \ `TA` 获取并融合，以便更全面地评估访问请求是否可以被授权。\n*   信任算法。以多源信息和访问请求为输入，`TA` 做出最终决策并将访问决策传递给 `PA`\
  \ 执行。根据 `TA` 的输出是基于二进制的决策还是置信度，`TA` 可以分为基于标准的和基于评分的算法。基于评分的 `TA` 计算置信度，如果置信度大于配置的阈值，则授予访问权限。此外，根据\
  \ `TA` 是否考虑用户/应用程序的历史，`TA` 可以分为单一算法和上下文相关算法。虽然单一算法的评估速度比上下文相关算法快，但如果攻击保持在用户允许的角色范围内，则存在无法检测到攻击的风险。\n\
  \n![图 9.7 零信任网络中的授权系统。](img/c09f007.png)\n\n**图 9.7** 零信任网络中的授权系统。\n\n在本节中，我们将零信任网络中的授权系统抽象为三个解耦的层：信息融合层、访问决策层和控制层，如图\
  \ 9.7 所示。这些组件的简要描述如下：\n\n*   传感器是部署在零信任网络中的信息提供者，例如 `Snort`、`Snmp`、`Netflow analyzer`\
  \ 等。它们可以并行收集和处理用户与资产信息、服务运行状态以及威胁情报。\n*   融合是一种合并来自多个传感器的数据技术，以获得比原始原始数据更一致、信息量丰富且准确的信息，原始数据大多是不确定、不精确、不一致、冲突的（Meng\
  \ 等人，2019）。作为具有强大数据计算和分类能力的技术，机器学习被寄予提高数据融合算法性能。\n*   决策是制定访问策略的过程，其中包含一组访问策略。\n\
  *   控制是为网络设备生成命令的过程。在此层中，应该生成不同的命令。\n*   执行器。执行命令的设备，如 `firewall`、`access proxy`\
  \ 和 `gateway`。\n\n在本节的剩余部分中，我们主要介绍机器学习在“授权系统大脑”中的应用：信息融合层和决策层。\n\n### 9.3.1 信息融合\n\
  \n根据 Meng 等人 (2019)，数据融合最重要的元素列如下：\n\n*   数据源：涉及来自不同位置和不同时间点的单源或多数据源的数据融合。\n*  \
  \ 需要一种数据组合操作，可以描述为“转换”。\n*   目的：以获得检测或预测中错误可能性更小的改进后的信息为融合的目标。实际应用的示例目的包括决策、实体识别等。\n\
  \n根据输入数据的模式（即数据源），信息融合算法可以分为三个层次：信号层、特征层和决策层。在信号层，从传感器获取的原始数据直接输入融合模型进行组合，这些模型有时被称为低级融合或原始数据融合。在特征层，传感器数据通常被预处理为特定的特征，然后这些提取的特征参与融合过程。特征层融合也被称为中级融合。决策层数据融合是指处理从传感器数据精炼出的决策。\n\
  \n在决策层，网络安全领域已经开发了许多方案。为了通过 `IDS`、`firewall`、`antivirus software` 和`人工判读`等多个传感器充分检测网络安全事件，Xiao\
  \ 等人 (2006) 使用 `RBF 神经网络` 根据安全设备的输出决策预测网络安全状态。然而，这是一项初步工作，作者没有考虑数据冲突的情况，因此该方案的有效性不可靠。Xl\
  \ 等人 (2019) 使用 `Dempster–Shafer 证据理论` 来融合安全设备的判定。为了消除不一致的证据（即不同传感器之间不一致的判定），使用距离的指标来评估两个证据之间的冲突程度，算法将只融合一致的证据。此外，为了处理异构检测器对最终融合结果重要性不同的网络环境，使用\
  \ `粒子群优化 (PSO)` 在信息融合过程中为不同的数据源分配权重。值得注意的是作者以无监督的方式完成了权重训练，这可以大大减少人工成本。\n\n\n\n\n\
  \n## 特征融合\n\n特征级融合和信号级融合可以获取更全面的数据，而不是仅仅依赖数据源的独立决策。Zhang 等人（2021）在从原始数据中手动提取出 `m`\
  \ ![images/c09-i0001.png)<math display=\"inline\" overflow=\"scroll\"><mrow><mi>m</mi></mrow></math>\
  \ 基础特征集后，作者使用排列组合方法融合了 `n` ![images/c09-i0002.png)<math display=\"inline\" overflow=\"\
  scroll\"><mrow><mi>n</mi></mrow></math> 组特征，生成了 `C_m^n` ![images/c09-i0003.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><msubsup><mrow><mi>C</mi></mrow><mrow><mi>m</mi></mrow><mrow><mi>n</mi></mrow></msubsup></math>\
  \ 个综合数据集。然而，它无法自动生成特征，故障特征需要专家手动设计，这意味着需要大量的预分析和比较过程。为了克服这些缺点，Han 等人（2020）提出了一个框架，如图图\
  \ 9.8）提出了一个框架，如图图 9.9<math display=\"inline\" overflow=\"scroll\"><msub><mrow><mi>W</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><msub><mrow><mi>W</mi></mrow><mrow><mn>2</mn></mrow></msub></math>来融合由双向自编码器（Bi-AE）和图卷积网络（GCN）提取的特征。在融合了传感器采集的数据、特征和决策后，决策算法将在融合结果上运行以生成访问控制策略。![图\
  \ 9.9 Guo 等人（2021）提出的特征融合框架。](img/c09f009.png)\n\n**图 9.9**](#c09.xhtml#R_c09-fig-0009)\
  \ Guo 等人（2021）提出的特征融合框架。\n\n### 9.3.2 决策\n\n决策是制定访问策略的过程，其中包含一组访问规则，用于确定是否允许请求访问资源。目前，访问控制策略已得到广泛研究，特别是基于属性的访问控制（ABAC），它可以生成细粒度、表达力强的访问控制策略。然而，大多数之前的工作假设访问控制策略是由网络管理员根据其对网络的知识定义的，未能考虑网络的动态环境。\n\
  \n为了不再依赖人类的先验知识来设置访问控制策略，研究人员尝试使用机器学习技术来分析各种信息。Li 等人（1019）提出了一种基于异常检测结果的策略生成方案。在提取流量特征后，作者使用回归模型来近似异常检测的局部边界，如\
  \ Guo 等人（2018）所示，以确定每个特征对输入预测的贡献。然后根据重要性对特征进行排序。最后选择前`k` ![images/c09-i005.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>k</mi></mrow></math> 个特征来辅助访问控制。\n\
  \n尽管 Guo 等人（2018）提出的方案可以在 IDS 帮助生成网络访问控制策略，但它没有实现完全自动化，并且需要手动提取特征。为了自动学习访问控制规则，Alkhresheh\
  \ 等人（2020）提出了 LAD 框架，其中关联规则挖掘算法（如算法和 FP-增长）被用于发现哪些属性经常一起出现以允许访问。\n\n然而，在高度动态的网络环境中，用户的访问权限经常变化，因此策略需要在线调整。Alkhresheh\
  \ 等人（[2020]）使用了两个子组件：（1）访问分类器和（2）访问调整器。第一个子组件获取访问以判断行为是否异常。然后在第二个子组件中，作者计算属性 `R_A`\
  \ ![images/c09-i007.png)<math display=\"inline\" overflow=\"scroll\"><msub><mrow><mi>R</mi></mrow><mrow><mi>A</mi></mrow></msub></math>是否大于阈值\n\
  \n## 9.4 总结\n\n在本章中，我们首先介绍了零信任的背景和设计原则，即“从不信任，始终验证”。然后，我们详细介绍了零信任的实施案例，即 BeyondCorp、SDP\
  \ 和华为云引擎 1280。最后，简要讨论了机器学习如何改进信息融合层和决策层。\n\n\n\n\n\n8. Zhiwei Guo, Yu Shen, Ali\
