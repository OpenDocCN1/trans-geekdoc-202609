  \n# 7 用于鲁棒异常检测的感知学习\n\n## 7.1 引言\n\n随着互联网的快速发展，各种软件系统需要为用户提供不中断的服务（例如社交网络和媒体娱乐）。这些系统产生的日志供开发者或运维人员定位和诊断系统异常。随着系统规模的扩大，产生的日志数量快速增长。人工审查和分析如此大量的日志已成为一项耗时且容易出错的工作。目前已经提出了许多基于机器学习或深度学习的日志异常检测方法（Guo\
  \ et al., 2021; Sun et al., 2020; Zuo et al., 2020）。然而，大多数方法都忽略了以下三个重要问题。\n\n首先，随着系统的升级，产生的系统日志也会发生演变。开发者可能会更改源代码中的日志语句，从而改变输出的日志。正如\
  \ Kabinna 等人（(2018)）观察到的那样，他们研究的项目中，大约有 20![百分比号](img/c07-i0002.png)<math display=\"\
  inline\" overflow=\"scroll\"><mrow><mi>%</mi></mrow></math> ![波浪号](img/c07-i0003.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mo>&#8764;</mo></mrow></math>45![百分比号](img/c07-i0004.png)<math\
  \ display=\"inline\" overflow=\"scroll\"><mrow><mi>%</mi></mrow></math> 的日志语句在其寿命发生了变化。据报道，Google\
  \ 的系统每月产生多数千条新的日志语句（Xu, 2010a）。许多以前未见的日志是由不断变化的日志语句生成的。日志的变化可能是对现有日志中某些词的插入、添加、删除和替换。一种可能的更改在图\
  \ 7.1 中所示。大多数现有异常检测方法无法在处理完历史日志数据后处理新日志。\n\n其次，在大多数真实世界的分类任务中，收集到的数据遵循长尾分布，即大多数数据属于少数类别（Khan\
  \ et al., 2016），因此它们属于不平衡数据。不平衡数据的分布会导致异常分类器偏向多数类（即正常数据）。这将导致异常分类器无法正确检测异常，导致召回率较低。因此，不平衡日志数据对日志异常检测具有显著的负面影响。\n\
  \n![图 7.1 日志演变的示例](img/c07f001.png)\n\n**图 7.1** 日志演变的示例。\n\n第三，在日志异常检测的研究中，标签获取高成本的问题通常被忽略了。通常，在大量训练数据上训练后，基于深度学习的方法可以获得良好的预测结果。然而，标记所有数据需要耗巨大的人力，特别是当日志只能由专家正确标记时（例如来自医疗应用程序的日志）。因此，如果标记数据不足，如何利用部分标记数据和剩余的未标记数据进行训练已成为日志异常检测领域的一个迫待解决的问题。\n\
  \n\n\n\n在过去的几年里，开发了许多基于机器学习的异常检测方法（Lou et al., 2010; Xu et al., 2009; He et al.,\
  \ 2018a; Liang et al., 2007; Huang et al., 2017, 2018; Cao et al., 2021)）。他们使用时间窗口对基于日志的序列进行建模。首先，他们将序列转换为日志计数向量，然后构建监督和无监督方法来检测异常。Lou\
  \ 等人 (2010) 提出了一种名为 `IM`（即不变性挖掘）的方法，该方法从日志计数向量中挖掘不变性。如果基于日志的序列违反了线性关系，则被视为异常。Xu\
  \ 等人 (2009) 提出了一种基于主成分分析 (`PCA`) 的无监督方法，它为基于日志的序列构建正常和异常空间以检测异常。He 等人 (2018a) 训练了基于\
  \ `SVM` 的分类器，Liang 等人 (2007) 训练了基于逻辑回归的分类器来检测异常。Meng 等人 (2018) 使用 `PU-Learning`\
  \ 来解决标签不足的问题。他们将传统的分类器转换为 `PU-Learning` 分类器，并使用词包模型和 `TF-IDF` 计算每条日志的向量表示。He 等人\
  \ (2018b) 将系统的 KPI 与 `TF-IDF` 结合计算日志表示。然后通过级联聚类对向量进行分类，这是一个迭代过程。该过程一直持续到所有向量被分类。最后，进行了相关性分析。与\
  \ KPI 相关的事件发生越频繁，KPI 下降越严重。也就是说，与 KPI 相关的簇越大，KPI 下降越严重。近年来，基于深度学习的日志异常检测方法发展迅速。（Zhang\
  \ et al., 2016; Du et al., 2017; Vinayakumar et al., 2017) 的输入是经过 one-hot 编码的向量。Zhang\
  \ 等人 (2016) 通过日志中的关键词训练了长短期记忆 (`LSTM`) 分类器来检测异常。Du 等人 (2017) 使用 `LSTM` 预测下一条日志，并将预测日志与原始日志进行比较。如果日志与预测日志不同，则意味着发生了异常。Vinayakumar\
  \ 等人 (2017) 训练了堆叠 `LSTM` 来检测异常。然而，上述基于机器学习或深度学习的方法没有利用日志的语义信息，并且当新日志出现时，它们需要改变向量维度并重新训练模型。它们在实践中对于以前未见过的日志不够健壮。Bertero\
  \ 等人 (2017) 使用 `word2vec` 和经典分类器（例如 `SVM` 或决策树）来判断日志是否正常。Brown 等人 (2018) 将注意力机制与\
  \ `word2vec` 结合来检测异常。然而，Bertero 等人 (2017) 和 Brown 等人 (2018) 提出的方法无法模拟基于日志的序列。Zhang\
  \ 等人 (2019) 提出了 `LogRobust`，它结合了词嵌入和 `TF-IDF` 来表示日志，向量表示包含了上下文信息。因此，`LogRobust`\
  \ 对以前未见过的日志是健壮的，但它仍然难以解决上述后两个问题。\n\n对于第二个问题，重采样和代价敏感学习是处理不平衡数据的传统方法。过采样（Chawla et\
  \ al., 2002; Han et al., 2005）。过采样（Chawla et al., 2002; Han et al., 2005)和欠采样（Prusa\
  \ et al., 2015)是两种不同的重采样方法。`SMOTE`（Chawla et al., 2002)通过合成新样本来平衡数据。`Borderline-SMOTE`（He\
  \ et al., 2008)是 `SMOTE` 的改进算法。它们将少数样本分为三类：“安全”、“危险”和“噪声”，其中没有任何是新样本。`ADASYN`（He\
  \ et al., 2008)是 `Borderline-SMOTE` 的改进算法。首先，它根据用户设置的扩展比例计算需要生成的少数样本，然后进行合成。代价敏感学习基于代价敏感理论，认为分类代价是不同的。它更关注高代价类别，并通过最小化总代价来处理不平衡数据。\n\
  \n对于最后一个问题，一种可行的方案 (Zhang et al., 2016; Du et al., 2017; Vinayakumar et al., 2017)\
  \ 是半监督学习，它利用少量标记数据和大部分未标记数据来训练模型。由于获取未标记数据并不消耗过多，`SSL` 带来的性能提升通常较低。因此，人们提出了许多半监督学习方法并应用于深度学习模型。半监督学习方法本质上可以被为每个未标记样本生成伪标签，然后将其作为输入的一部分。伪标签\
  \ (Lee et al., 2013) 将模型的预测视为标签。同样，一致性正则化 (Sajjadi et al., 2016; Laine and Aila,\
  \ 2017) 修改输入数据并使用模型进行预测，从而获得模型生成的标签。`FixMatch` (Sohn et al., 2020) 是 Google Research\
  \ 在 2020 年提出的半监督学习算法。它结合了伪标签和一致性正则化算法来生成标签。`FixMatch` 的原理如图 7.2 所示。训练数据由两部分组成（即标记数据和未标记数据），每部分包含多个批次。`FixMatch`\
  \ 接收未标记数据的弱增强版本作为输入，并将模型的预测视为生成的标签。然后它对原始未标记数据进行强增强，并使用增强数据和生成的标签来训练模型。受 Sajjadi\
  \ 等人 (2016) 的启发，`FixMatch` 在模型预测值大于特定阈值之前不会保留生成的标签。\n\n为了解决上述关键问题并提出更健壮的方法，在本章中，我们主要做了以下贡献：\n\
  \n\n\n\n\n-   我们提出了一种名为 `AllRobust` 的上下文感知方法用于日志异常检测。与 `LogRobust` 采用的日志向量化方法相比，我们的方法能够更强大捕捉日志事件中的动态语义信息。词嵌入（Word\
  \ embedding）包含了单词的语义信息，区域嵌入（region embedding）包含了单词周围的语义。它们被广泛应用于自然语言处理。`AllRobust`\
  \ 对日志事件中的每个单词同时利用这两者来进行日志向量化。这种充分的语义信息使得 `AllRobust` 对新出现的日志具有鲁棒性，并使 `AllRobust`\
  \ 能够在不平衡日志数据上进行训练。与重采样方法和代价敏感学习不同，`AllRobust` 通过优化日志向量化表示来处理不平衡日志数据。\n\n-   `FixMatch`\
  \ 是过去应用于图像识别领域的最先进半监督学习方法。为了对没有足够标签的日志数据进行训练，我们将 `FixMatch` 的弱增强和高级增强方法替换为简单的数据增强（EDA）（Wei\
  \ and Zou, 2019）以及相应的回译，因为原始方法是用于增强图像数据而非文本数据的。通过半监督学习，`AllRobust` 可以使用少量标记数据和其余的未标记数据进行训练。\n\
  \n-   `AllRobust` 将每条日志解析为日志事件，并将每个日志事件转换为向量表示。为了基于单个日志检测异常，它直接利用向量表示来训练 softmax\
  \ 分类器。为了基于日志的序列检测异常，它采用基于注意力机制的双向长短期记忆（Bi-LSTM）神经网络来计算该序列的向量表示，然后利用计算出的表示来训练 softmax\
  \ 分类器。\n\n本章的其余部分结构如下：在第 7.2 节 中，我们通过示例和架构图介绍日志异常检测。在第 7.3 节 中，我们详尽阐述我们的鲁棒日志异常检测方法——`AllRobust`，包括日志解析、日志向量化和异常检测。我们方法的评估在第\
  \ 7.4 节 中进行。在第 7.5 节 中，我们解释了我们的方法与传统方法相比的，然后解释我们方法的缺点。最后，第 7.6 节 对本章进行总结。\n\n##\
  \ 7.2 代词\n\n通常，软件系统产生的日志包含几个固定部分（例如：标签、时间戳、组件、级别和日志内容）。图 7.3 显示了由真实系统生成的一些日志。日志内容部分记录了系统的运行状态和重要事件；因此，我们需要提取每条原始日志的日志内容。正则表达式是实现该操作的好方法，它被广泛用于从文本中提取固定部分。图\
  \ 7.3 中的日志内容部分用红色方框标记。前两条日志的日志为“generating core.5307”和“generating core.7192”，它们除核心索引外完全相同。核心索引可以被视为一个参数，可能会阻碍自动化日志分析。因此，我们用通配符\
  \ `*` 替换它，得到了日志事件“generating core *”。同样，如果其他日志中存在不重要的参数，我们用通配符 `*` 替换它们。在替换无关参数后，我们得到了原始日志的日志事件。\n\
  \n机器学习，尤其是深度学习已广泛用于自动数据分析，但它只接受向量而非日志事件作为输入；因此我们需要将日志转换为向量。现有的日志异常检测模型是单个日志或基于日志的序列。对于前者，我们需要为单个日志事件计算向量作为输入的一部分。对于后者，我们需要对基于日志的序列进行建模并为该序列计算向量。日志异常检测的过程如图\
  \ 7.4 所示。日志被分成不同的批次进行传输和处理。训练完成后，模型能够对单个日志或基于日志的序列执行异常检测。\n\n![图 7.3 日志示例。](img/c07f003.png)\n\
  \n图 7.3 日志示例。\n\n![图 7.4 日志异常检测的过程。](img/c07f004.png)\n\n图 7.4 日志异常检测的过程。\n\n##\
  \ 7.3 提出的方法 – AllRobust\n\n### 7.3.1 问题描述\n\n无论是机器学习还是基于深度学习的模型，它们分批接收输入数据，并且只能处理向量而非文本。以下语句描述了针对单个日志和基于日志序列的日志异常检测。\n\
  \n-   关于单个日志的异常检测，我们需要用向量表示日志事件，并将该向量视为批输入的一部分。给定一组原始日志，我们首先提取日志消息，其包含了运行状态和重要事件。通过*日志解析*，将日志消息转换为日志事件。这些日志事件经过*日志向量化*后，我们得到的可以作为模型的批输入。训练后，模型可以对单个日志进行异常检测。\n\
  \n\n\n\n对于基于日志的序列进行异常检测，我们需要用一个向量表示 `N` (images/c07-i0009.png)（即序列大小）个日志事件并将并将向量视为批处理输入的一部分。给定一组包含\
  \ `N \\times b` (images/c07-i0010.png) 个日志的批，我们首先使用正则表达式提取 `N \\times b` (images/c07-i0011.png)\
  \ 个日志内容，这些内容包含了运行时状态和重要事件。在执行 `log parsing` 后，日志消息被转换为日志事件 `[T1, T2, ..., TNb]`\
  \ (images/c07-i0012.png)。在 `log vectorization` 阶段，我们需要用一个向量表示长度为 `N` (images/c07-i0013.png)\
  \ 的基于日志的序列，并将该向量视为批处理输入的一部分。训练完成后，模型可以对基于日志的序列进行异常检测。\n\n### 7.3.2 日志解析 (Log Parsing)\n\
  \n日志记录了软件系统的运行状态和重要事件。因此，进行日志分析对于软件系统的维护至关重要。原始日志由标签、时间戳、组件、级别、日志消息等组成。日志内容是原始日志的主体，我们需要从每条原始日志中提取它。日志内容包含许多阻碍自动日志分析的无关紧要参数。因此，我们需要执行\
  \ `log parsing`，将每条原始日志转换为日志事件。传统的日志解析方法通常使用正则表达式进行匹配。这些方法并不适用于现代软件系统，原因如下：\n\n\
  *   首先，正则表达式是人工维护的，耗时耗力。\n*   其次，现代软件系统生成的日志增长迅速且不断演变。一个大型服务系统每小时可以产生 50 GB 的日志（Xu,\
  \ 2010b）。\n*   一个开源 Web 服务通常有数百名开发者。很难编写出合适的正则表达式，因为他们并不知道编写日志语句的开发者的意图。\n\n大多数现有的日志解析方法都是离线和批处理的。Xu\
  \ 等人 (2009) 提出了一种根据源代码自动生成正则表达式的方法，但在实践中源代码往往是不可用的。过去几年中，人们提出了许多数据驱动的日志解析方法（Fu et\
  \ al., 2009; Makanju et al., 2012），它们可以直接从原始日志内容中获取日志事件。然而，它们是离线的，且性能受限于单个服务器的内存。日志只能在收集后进行分析，非常耗时。\n\
  \nHe 等人 (2017) 设计了一种名为 `Drain` 的在线日志解析器，能够以流的形式准确高效地解析原始日志内容。图 7.5 显示了一个深度为 3 的\
  \ `Drain` 解析树。根节点位于解析树的顶层，叶节点位于底层。树中的其他节点是内部节点。根节点和内部节点编码了特殊设计的规则以指导搜索过程。解析树中的路径以叶节点结束，叶节点存储了日志组列表。一个日志组包含两个部分：日志事件和日志\
  \ ID。日志事件是最好描述该组日志内容的模板，由日志内容的固定部分组成。日志 ID 记录该组内日志内容的 ID。Zhu 等人 (2019) 使用 16 个数据集评估了\
  \ 13 种日志解析器，发现 `Drain` 达到了领先性能。`Drain` 的工作步骤如下：\n\n1.  首先，我们需要为提取原始日志的每个部分（例如标签、时间戳、组件、级别和日志内容）提供一个正则表达式。\n\
  2.  其次，我们需要提供正则表达式，用于过滤日志内容中的常用参数（例如 IP 地址、文件路径）和特殊符号（例如逗号、分号）。\n3.  第三，我们需要配置 `depth`（深度）、`similarity\
  \ threshold`（相似性阈值）和 `maxChild`。叶节点的固定 `depth` 了 `Drain` 在搜索过程中访问的节点数量，这大大提高了它的效率。`similarity\
  \ threshold` 用于日志匹配。如果日志内容与日志事件的相似性值 `simValue` 大于 `similarity threshold`，则日志内容与日志事件匹配。`simValue`\
  \ 的计算如等式 7.1 所示，其中 `l(i)` (images/c07-i0014.png) 是日志内容中的第 `i` (images/c07-i0015.png)\
  \ 个单词，而 `t(i)` (images/c07-i0016.png) 是日志事件中的第 `i` (images/c07-i0017.png) 个单词。日志消息的长度为\
  \ `L` (images/c07-i0018.png)。`eq` (images/c07-i0019.png) 的函数由等式 7.2 定义，`t1` (images/c07-i0020.png)\
  \ 和 `t2` (images/c07-i0021.png) 是两个单词。此外，为了避免树分支爆炸，参数 `maxChild` 限制了节点的最大子节点数量。\n\
  \n\n\n\n4. 最后，如果匹配成功，`Drain` 将扫描日志内容和日志事件。如果日志事件中的单词与日志内容中相同位置的单词不同，则会将日志内容中的单词替换为\
  \ `*`。如果无法匹配日志组，则将为该日志内容创建一个新的日志组，并将该日志内容视为该新日志组的日志事件。(7.1)![s i m upper V a l u\
