  \ 解析树。\n\n以下通过一个示例描述了日志解析。开始时，解析树只有一个根节点。我们将 `similarity threshold` 设置为 0.50。我们从一个\
  \ ID 为 1 的原始日志中提取日志内容，并获得 `CE sym 20, at 0x01228120, mask 0x10.`。在过滤掉不重要的参数后，我们得到了日志事件\
  \ `CE sym \\*, at \\*, mask \\*.`。原始解析树如图 Figure 7.6 所示。然后，我们从一个新的原始日志（ID 为 2）中提取日志内容，得到\
  \ `CE sym 5, at 0x11042a80, mask 0x04.`。新日志内容的长度为 7。我们搜索现有的解析树并到达叶子节点。叶子节点包含一个日志组。在新日志内容与日志组中现有日志事件相同的位置，相同单词的数量为\
  \ 4。计算出的 `simValue` 0.57 大于 `similarity threshold` 0.50；因此，匹配成功。我们将新日志内容的 ID 添加到\
  \ `Log ID` 中，更新后的解析树如图 Figure 7.7 所示。\n\n![Figure 7.6 原始解析树。](img/c07f006.png)\n\
