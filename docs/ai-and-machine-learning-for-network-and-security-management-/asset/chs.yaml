  \ 基于分层强化学习的虚拟网络嵌入¹\n\n## 4.1 引言\n\n作为未来互联网最有前景的技术之一，网络虚拟化将虚拟网络服务从底层底层网络解耦，这为评估新的协议和服务提供了很好的解决方案（Anderson\
  \ et al., 2005, Cheng et al., 2018)）。此外，网络虚拟化技术已广泛应用于许多研究测试平台，例如 4WARD（Feamster\
  \ et al., 2007)）和 CABO（Endo et al., 2011)）。今天，作为 5G 网络软件化的关键使技术（Cheng et al., 2018,\
  \ 2020)），网络虚拟化已成功在电信市场中使用。可以以 OpenFlow（McKeown et al., 2008)）为例，它得到了开放网络基金会（Open\
  \ Networking Foundation, 2010)）内行业的支持。总的来说，将虚拟网络嵌入到底层网络的过程被称为虚拟网络嵌入（VNE）（Cheng et\
  \ al., 2021, Yan et al., 2020a)）。\n\n如今，一种被称为基础设施即服务（IaaS）的业务模型（Bhardwaj et al.,\
  \ 2010 虚拟网络（VN）提供者，将虚拟资源挂接到 InP；(2) VN 运营商，根据请求管理 VN；(3) 通过抽象定制服务的用户服务提供者。通过将虚拟资源动态嵌入物理网络中，ISP\
  \ 可以通过有效的 VNE 算法获得巨大收益，这些算法旨在优化资源分配并提供各种端端定制服务。（等等，让我重新读一下流程）。在实践中，VNE 算法的衡量标准涵盖了许多目标，包括服务质量（QoS）、经济利润、资源成本、嵌入效率和能效。\n\
  \n![图 4.1 IaaS 业务模式](img/c04f001.png)\n\n**图 4.1** IaaS 业务模式。\n\n\n\n\n请记住，由于底物网络巨大的搜索空间，VNE\
  \ 问题被证明是 `NP-hard`（NP 困难的）。传统的 VNE 算法分为两类：精确解和启发式解。使用精确优化策略的方法旨在通过整数线性规划（`ILP`）和混合整数线性规划（`MILP`）等寻找最优。由于复杂性较高，此类精确方法在计算可行解上需要花费大量时间，这意味着它们只能用于解决小规模的\
  \ VNE 问题实例。启发式解并不执于获取最优嵌入方案，而是能够以较低的执行时间找到可行解。然而，启发式方法的问题之一是它们容易陷入局部最优，而该局部最优可能距离全局最优很远。显然，在实践中，由于底物网络的不可预测性和通用的巨大搜索空间，传统的在线问题求解技术是不行的。\n\
  \n随着人工智能（`AI`）的快速发展，机器学习（`ML`）和深度学习（`DL`）已被 VNE 领域。由于具有高拟合能力和灵活的网络参数调整能力，基于 `AI`\
  \ 的算法可以获得全局最优解，并在接受的时间内制定嵌入策略。此外，由于自动探索和快速发展的卓越性能，强化学习（`RL`）也被纳入考虑。在 `RL` 中，智能体从零开始，通过探索外部环境逐渐学习最优的\
  \ VNE 策略，以最大化累积奖励。然而，现有的基于 `RL` 方法存在三个主要缺点。首先，现有方法使嵌入算法关注当前的虚拟网络请求（`VNR`），这可能会在嵌入不可行的\
  \ `VNRs` 上浪费资源。其次，现有方法平等且独立地对待所有 `VNRs`，这丢失了长远视野。第三，在真实场景中，外部奖励通常是稀疏的，只有当一个 `VNR`\
  \ 被完全嵌入时才会返回。然而，现有方法以隐式的方式分解外部奖励，无法确保全局最优解。\n\n分层强化学习（`HRL`）已被证明在加速学习过程以及解决围棋和 Atari\
  \ 游戏等长期任务方面表现出色。通常，为了获得长期视野，`HRL` 被实现为一个高层智能体，周期地向低层智能体分配子目标，低层智能体同时在不同的时间抽象级别从经验中学习。此外，通过将奖励分为外部奖励和内部奖励，与通用强化学习（`RL`）相比，`HRL`\
  \ 在稀疏奖励问题上运行良好。\n\n在本章中，基于 `HRL` 提出了一种主动 VNE 算法，该算法同时考虑了 `VNR` 的长期影响和嵌入动作的短期效果。我们将这种主动算法称为\
  \ `VNE-HRL`。在该算法中，高层智能体首先从基于窗口的批量选择具有最大长期回报的可行 `VNR`，以确保长期利益。然后，低层智能体根据低层策略将所选的\
  \ `VNR` 嵌入底物网络，该策略将 `VNR` 嵌入视为一系列虚拟节点嵌入。同时，外部奖励和内部奖励分别返回给高层和低层智能体，这鼓励智能体改进嵌入策略，以便在未来获得更好的性能，而不是最大化当前收益。高低层策略均使用双双深度\
  \ Q 网络（`DDQN`）算法训练，可以实现稳定收敛。在 `DDQN` 的帮助下，智能体可以从零逐渐优化策略，无需大量的人工干预。\n\n本章其余部分的结构如下：`第\
  \ 4.3 节` 介绍了工作基础，包括 VNE、`RL` 和 `HRL` 的定义和数学描述。模型框架在 `第 4.4 节`中给出。性能评估结果在 `第 4.5\
  \ 节`中展示并分析。`第 4.6 节` 相关工作。最后，`第 4.7 节` 总结本章。\n\n## 4.3 基础与符号\n\n在本节中，我们将介绍以下内容：VNE\
  \ 问题的数学公式（`第 4.3.1 节`）、强化学习（`第 4.3.2 节`）以及分层强化学习（`第 4.3.3 节`）。\n\n### 4.3.1 虚拟网络嵌入\n\
