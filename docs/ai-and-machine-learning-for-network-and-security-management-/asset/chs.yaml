  \ Thunderbird 数据集中所有的重复样本。然后，根据表 7.2 将 Thunderbird 数据集转换为二进制数据集。训练数据集中的所有样本在测试集中均不存在。在\
  \ Thunderbird 训练集中，“正常”样本数量与“异常”样本数量的比例为 17:1。因此，Thunderbird 训练数据集是不平衡的。作为一种重采样方法，我们使用\
  \ `SMOTE` 来解决由不平衡日志数据引起的问题。我们将其应用于 `LogRobust`，并称之为 `SMOTE-LogRobust`。实验结果如图图 7.17\
  \ 所示。尽管 `AllRobust` 和 `LogRobust` 取得的准确率相似，但 `LogRobust` 取得的精确率、召回率和 `F1-Score`\
  \ 值非常低。日志向量化阶段的最大池化操作有助于我们的方法关注更重要的语义信息，便于我们的方法从之前的样本中抽象出每个类的模式。与 `LogRobust` 相比，`SMOTE-LogRobust`\
  \ 取得的准确率、精确率、召回率和 `F1-Score` 显著提升，因为 `SMOTE-LogRobust` 对不平衡日志数据的整体性能得到了改进。因此，重采样对于提高\
  \ `LogRobust` 在不平衡日志上的性能是有效的。然而，`AllRobust` 的性能仍然优于 `SMOTE-LogRobust`。我们得出结论，`AllRobust`\
  \ 对新日志具有鲁棒性，并在这种情况下实现了先进的性能。\n\n![图 7.17 LogRobust、SMOTE-LogRobust 和 AllRobust 在\
