  \ 前馈层和 (iv) 扁平化层。下文将解释每个组件的详细设计。\n\n![图 6.2 注意力编码器的结构。](img/c06f002.png)\n\n图 6.2\
  \ 注意力编码器的结构。\n\n**多头注意力 (Multihead Attention)**\n\n多头注意力块被用于提取流级特征，因为它能够建模数据包之间的交互。在流量分类领域，多头注意力的有效性尚未经过验证。我们发现它是提取流级特征最有效且高效的块之一，如第\
  \ 6.5.4 节所示实验所示。在多头注意力的帮助下，每个数据包允许一步内与其他所有数据包进行交互，如 (6.9)，大大减少了参数数量并缩短了运行时间。此外，数据包被投影到多个子空间，因此多头注意力可以捕捉不同子空间中的不同特征交互。通过堆叠带有多头注意力的模块，我们可以建模不同阶的特征交互。\n\
