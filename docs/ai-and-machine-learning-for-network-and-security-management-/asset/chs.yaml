  \ 块可以用较少的参数防止网络退化。在多头注意力层和前馈层之后，我们添加了一个标准的 ResNet 来保存原始信息和之前学习的信息。\n\n此外，层归一化是一种用于化中间层分布的技术，它能够实现更平滑的梯度、更快的训练速度以及更好的泛化准确率（Xu\
  \ 等人，2019）。\n\n### Feed Forward Layer（前馈层）\n在前馈层中，1D-CNN 的部署有助于提取数据包级特征，因为它关注单个数据包。在我们的工作中，应用了卷积核为\
