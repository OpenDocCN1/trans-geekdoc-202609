    Python `Iterator` 是一个包含多个整数值的容器。利用 `Iterators`，可以遍历容器中的值——特别是列表。除了遍历之外，`Iterators`
    通常还提供对容器中数据元素的访问。尽管如此，它们本身并不执行迭代，也就是说，如果不考虑对无意义术语使用的定义，它们并不具备实质性的灵活性。实际操作中的 `Iterator`
    几乎等于数据库中的指针。这里是对 Python `Iterator` 的一种简单描述：![](img/Image00024.jpg) `Iterator`
    是任何可以使用 `for in loop` 的 Python 形式。每个用作 `Iterator` 的对象都应该具备以下两个方法：


    - `__iter__()`: 它基于 `Iterator` 进行初始化。它将返回一个具有 `next` 方法的对象，或返回 `next`。

