  trans: '


    # 嵌套循环


    * 嵌套循环

    * for 循环的使用

    * while 循环的使用


    让我们花一点时间来探索一下这些内容，并弄清楚你何时以及何需要它们。


    ## 4.4 While 循环


    我们将开始查看的第一种循环是 `while` 循环。它是一个非常有用的工具，如果你只需要让脚本按指定的次数执行某些操作的话。调节表达式 `< expr >`
    通常需要一个或多个参数，这些参数在开始循环之前会在循环函数中进行配置和更新。如果在布尔作用域中发现某个循环，将首先检查 `< expr >`。如果有效，则执行循环结构。此时，`<
    expr >` 会再次被验证，但如果仍然为真，将再次执行循环体。它会一直持续，除非 `< expr >` 不正确，因为程序是从循环框架之外的第一个声明开始的。在本例中就是如此：最初，`n`
    为 5。第 2 项 `while` 头部中的短语是 `n > 0`，循环体执行。在第 3 行，`n` 在循环框架内减小 1 变为 4，然后打印出来。每当循环结构结束时，程序都会在轨迹末尾执行第
    2 项。这仍然有效，但循环体再次运行，并打印出三个。此过程一直持续，直到 `n` 变为 0。一旦语句被评估为错误，循环就会停止。活动将从循环结束后的第一个语句开始，但在这种情况下没有这样的语句。请记住，在发生其他事情之前，`while`
    循环的控制语句将首先被检查。如果开始时为错误，则循环体将永远不会执行。


    ### Continue 与 Break 语句


    在目前为止看到的每个示例中，每次迭代都会执行 `while` 循环的完整体。Python 提供了两个可以不必要地结束循环阶段的关键：


    * Python 的 `break` 语句会立即结束循环。程序将引导至循环结束后的第一个声明。

    * Python 的 `continue` 语句（继续）会立即完成当前不连续的迭代。实现将跳转到循环的顶部，并重新评估控制表达式以决定循环是再次开始还是停止。


    `break` 和 `continue` 之间的区别见流程图：


    ### else 条件


    在 `while` 序列结束时，Python 提供了一个间接的技术部分。它是 Python 的特殊功能，在任何其他语言中都不存在。可以看到以下语法：每当 `while`
    循环结束时，在其他定义的 `< additional_statement(s) >` 将被执行。


    ## 4.5 嵌套 while 循环


    Python 的控制机制可以根据你喜欢的任何程度相互交织。这本应该是这样的。想象一下，如果有意料之外的限制，例如“如果语句中不能包含 while 循环”或“循环最多只能彼此嵌套四层”，将有多么困难。糟糕编程语言架构的证据往往是随机的数值或概念限制。幸运的是，在
    Python 中，你不会发现很多。同样，在此所示的`while` 循环可以在 `while` 序列内部：


    单行 While 循环


    与 `if` 声明一样，某些循环可以在单行内。如果块包含多个语句，可以用分号（`;`）进行分隔。


    ## 4.6 “for” 循环


    可以使用 `for` 循环来遍历项目。它比 `while` 循环更高效，因为它会自动处理迭代过程。它通常用于处理列表、元组或字符串等集合。


