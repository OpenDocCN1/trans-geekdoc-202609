    # 增强父类能力


    由于不同品种的狗有其独特的叫声，为了特定技术的音效考虑，你希望设置默认参数。为此，你必须在类描述的每个种族中重写 `speak()`。你通过在子类中识别具有相同标签的函数，来规避父类中的赋值场景。


    这就是 `JackRussellTerrier` 类的样子，例如：因为在这个 `JackRussellTerrier` 类中，`speak()` 被配置为“Arf”，这与标准的声音语句不同。使用最新的类
    `JackRussellTerrier` 编辑 `dog.py`，并点击 `F5` 保存并执行程序。现在，我们可以在 `JackRussellTerrier`
    的实例中向 `sound` 添加语句的同时调用 `speak()`：通常情况下，狗会发出许多声声叫声，但如果 Miles 感到不悦并呻吟，你也可以经常调用
    `speak()` 另一种音调。


    需要注意的一个因素是，父类中的调整会立即扩展到子类。这通常发生在子类中修改的元素或方法没有被覆盖时。例如，在程序窗口中修改 `Dog` 类中由 `speak()`
    获取的字符串：完全跳过父类的某个过程也是重要的。然而，在这种情况下，我们不希望 `JackRussellTerrier` 类遗漏任何对 `Dog.speak()`
    输出字符串布局的修改。为了实现此类操作，必须为子类 `JackRussellTerrier` 也指定 `speak()` 函数。与其直接指定结果字符串，你将在子类
    `speak()` 中调用 `Dog.speak()` 类，并使用与放入 `JackRussellTerrier.speak()` 中相同的参数。


    从子类方法内部，你甚至可以通过 `super()` 获取父类。如果你在 `JackRussellTerrier` 中调用 `super().speak()`，Python
    会整个父类 `Dog` 中查找 `speak()` 函数。编辑 `dog.py` 以获取最新的类 `JackRussellTerrier`。保存目录并按 `F5`
