    - 陈述断言还可以包含一个额外的错误消息和说明。当标准不符合时，`assert` 会中断程序并发送错误代码以及 `AssertionError`。


    让我们来看一个例子，我们有一个功能将测量用户传输的平均值，结果不应该是一个空数字。为了测试参数，我们必须使用 `assert` 语句，如果传输列表的长度为零，程序将结束。


    #### 示例 1：使用不带错误的断言消息


