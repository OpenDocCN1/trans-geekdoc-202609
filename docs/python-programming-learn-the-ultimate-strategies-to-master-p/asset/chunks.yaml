    ## 8.8 什么是感知机？


    `Perceptron`（感知机）的理论与大脑中央处理单元——`Neuron`（神经元）的工作原理相似。一个`Neuron`由神经元产生的多个输入信号、细胞体或通过`Neuron`传输的一个输出信号。。当达到特定阈值时，`Neuron`会发出干预信号。无论此动作发生与否，都不存在所谓的“弱”神经元爆发。同样，`Perceptron`具有多个输入，并馈入一个处理单元以生成一个二值输出（通常称为设备）。因此，感知机可以用于解决分类问题，即主体被归类为两个已知类别之一。


    ### 算法

    由于`Perceptron`是二分类分类器（0/1），它们的计算可以描述为：![](img/Image00044.jpg)请记住，两个长度为`n`的向量（内积）的点积为![](img/Image00045.jpg)


    `f(x) =b+w.x` 函数是向量权重与元素的线性组合。那么，`Perceptron`是一种分类算法——一种使用线性预测函数进行预测的算法。权重显示了`xi`在`x`函数对对象作用的效力。函数`xi`的权重`wi`越大，对性能的影响就越高。另一方面，`b`倾向类似于线性方程的截距。它是一个常数，有助于以最匹配数据的方式改变模型。`bias`（偏置）一词意味着任意输入函数的系数`x0=1`。该模型可以使用以下算法进行训练：![](img/Image00046.jpg)


    ### 实现

    我们为`Perceptron`实现找到的数据集是`Iris`（鸢尾花）数据集。该数据集包含了定义花卉并将其归为三组之一的四个函数。我们删除了数据集中属于`Iris-virginica`类的最后
    50 行，然后使用`Iris-setosa`和`Iris-versicolor`两组，因为这些组别是线性可分的，且算法通过最终确定理想权重来收敛到极小局部。![](img/Image00047.jpg)


    通过观察具有 2 个特征的数据集，我们可以看到通过在它们之间画一条直线，就可以轻松区分数据集。我们的目标是编写一种算法，能够定位于这条线并准确地描述所有这些数据点![](img/Image00048.jpg)


    我们现在直接应用上述算法，并观察它的运行情况。我们有与每个类别相关的四个特征，因此有四个权重。注意我们建立了一个偏置项`w0`，这意味着`x0=1`使得总共有
    5 个权重。我们指定了迭代次数为十次。这是超参数之一，与算法已知的机器参数（如`w`）相比。算法确定每个阶段所有数据点的评分（0 或 1），并为每次错误分类更改权重。如果测量值被错误分类，那么`delta`将改变权重，使其向反方向移动。而如果你想再次识别研究，答案是“准确性较低”。我们将所有其他标记为''1''（Iris-versicolor，变色鸢尾）的标记为''0''（Iris-setosa，花尾）。现在，让我们为每次迭代的错误分类样本数量绘制图表。在第
    4 次迭代中，我们可以看到算法收敛了。这意味着在结果的第四次通过时，所有样本都被正确识别。![](img/Image00049.jpg)


    ### 局限性

    * 单层感知机仅在数据集是线性可分时运行。

    * 该算法主要用于二分类问题。尽管如此，通过每类添加一个`Perceptron`，我们可以改进算法来解决多分类问题。


    ## 8.9 机器学习导论


    机器学习是人工智能（AI）的一个分支。那么人工智能是什么呢？卡内基梅隆大学科学学院院长 Andrew Moore 曾将其描述为：“人工智能是让机器以人类方式行为的科学。”对于“人工智能是什么？”这个问题，依赖于更广泛的主题回答，这非常困难。为了回答之前的问题，我们将
    AI 分为块：弱 AI 和强 AI。


    ### 弱人工智能

    * 解决常见问题

    * 在其他环境中鼓励人类

    * 能够训练子领域

    * 无感知


    ### 强人工智能

    * “人类智能”（推理、战术使用、模糊决策）相对于人类智能，可能并不精确

    * 安排

    * 正常语言理解能力

    * 心灵？

    * 情感？

    * 自意识？


    我们现在知道人工智能以及强弱 AI，但机器学习是什么呢？让我们继续看 IBM 创始人 Arthur Samuel 对一个非常晚的尝试定义：“机器学习是计算机在不需要显式编程的情况下学习的研究领域。”这是一个很好的尝试，但仍有许多未解决的问题。近
    40 年后，1998 年，Tom Mitchell 提出了以下“良好的学习问题”：“如果一个计算机程序在任务上的成功（通过 P 衡量）随着经验 E 的增加而提高，那么它对于任务
    T 和指标 P 学习。”


    注释：如果满足以下条件，则数学问题被正确命名（也称为良好的、恰当的）：

    * 有答案（存在性）。

    * 该解决方案被显式描述（区别性）。

    * 答案的行为随原始数据（灵活性）连续变化。


    '
