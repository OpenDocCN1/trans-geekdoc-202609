    ## 7.4 Python 中的命名空间


    命名空间是一组符号名称。你应该将命名空间考虑为一个字典，其中键是名称，值是它们指向的对象。


    共有四种命名空间：


    *   内置（Built-in）

    *   本地（Local）

    *   闭包（Enclosing）

    *   全局（Global）


    ### 内置

    内置命名空间包含了所有内置制品。这些在 Python 启动时总是可用的。通过以下命令可以查看内置命名空间：


    ### 全局

    全局命名空间包括主脚本阶段的所有初始化。Python 在程序启动时会生成全局命名空间，它一直持续到程序关闭。


    ### 本地

    此命名空间包含正则表达式。Python 为脚本中的每个函数提供命名空间。它一直运行到函数返回。


    ### 对象范围

    范围是指从单个对象访问的代码区域。因此，从脚本的任何地方都无法访问单个实体；必须由对象的上下文允许。


    ## 7.5 Python 对象的深拷贝与浅拷贝


    Python 中的赋值语句并不构建对象克隆；它们只附加对象名称。对于不可变对象，通常不会创建更改。但你可能正在寻找某种方法为此类对象创建“真正的克隆”或“复制品”，以便于声明式对象或声明式项目的操作。基本上，你还希望在更改实际内容的同时拥有备份。我们将为你描述如何在
    Python 3 中复制或“拷贝”制品，甚至是本文中包含的一些说明。在复制对象时，Python 2 和 3 之间没有差异。我们应该在有差异的文档查找。让我们继续如何复制
    Python 的内置集合。Python 实现的可变对象如 `lists`、`dicts` 和 `sets` 可以通过它们的工厂函数转移到现有集合：这种方法对于自定义对象并不适用，只能产生浅拷贝。对于包括列表、字典和集合的复合项目，浅拷贝和深拷贝之间似乎有一个有趣的点：


    *   浅拷贝是一个新的集合对象，而不是与其包含的子项目的关联。浅拷贝实际上只有一层深。复制阶段不会真正再次出现，也不会产生子对象的克隆。


    *   深拷贝重复复制周期。这涉及到首先创建一个新的集合对象，然后迭代地补充初始对象中子对象的克隆。这确保了整个实体树移动并构建对象表面及其所有子对象的独立副本。


