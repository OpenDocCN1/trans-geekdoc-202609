    ### 7.1 Python 中的递归


    递归函数是用自指性词汇描述的函数。它意味着方法在重复其动作的同时不断命名自己，直到这些术语被满足以产生响应。递归函数都具有标准的二部分框架：基础情况（base
    case）和递归情况（recursive case）。


    为了显示这种结构，让我们编写一个递归度量函数 `n!`：

    1. 将当前问题分解为简化示例。这就是递归情况：

