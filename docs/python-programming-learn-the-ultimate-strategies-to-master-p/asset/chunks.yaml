    如所述，可以使用机器学习分类器来引入垃圾邮件过滤器。从数据中实现决策自动化的是机器学习的核心，而无需消费者为如何做出决策定义特定的指南。在处理邮件时，接收者并不拥有一份令其感到困扰的术语或属性列表。相反，接收者应该拥有被分类为垃圾邮件和非垃圾邮件的示例。这种过程被称为“学习”（schooling）。


    机器学习算法的目标是预测新的、此前未见过的结果。我们并不感兴趣在特定的查询中将邮件已标记的邮件标记为垃圾邮件或否。我们希望通过自动对新收到的邮件进行分类，让消费者变得更加方便。


    算法随后了解或训练此类示例：我们必须在学习过程中对分类器进行测试。它们会寻找已分类的测试数据以及未学习的学习结果：如果我们对结果满意，分类器将能够识别完全全新的文档：


    数据通常以二维数字序列（或矩阵）的形式提供给算法。我们想要从中学习或对其做出决策的数据点（也称为样本或训练实例）被定义为数字列表，即所谓的`Feature
    vector`（特征向量），其对应的特征代表了该点的属性。


    ## 结论


    本文应该包含了你进入最深技术 Python 领域所需的所有资源。如果你看到这本书，说明你已经有一定的 Python 实践经验，无论你是想做更多技术性的工作，还是想作为一个初学者开始，你都会很快找到所需的解决方案。


    所以，请翻阅本指南并阅读你需要了解的内容：利用 Python 编程获取一些酷炫的密码。我们假设你可以理解书中 Python 的基础知识：简单的脚本编写。我们相信你现在可以创建实用且功能强大的计划，这些计划可以简化家庭和工作中的许多日常任务。下一步是学习专门的
    Python 程序，帮助你开发非常强大的程序。

