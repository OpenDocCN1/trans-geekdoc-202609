    ## 管道中的生成器


    每个生成器可以使用多个生成器对一组操作进行流水线处理。对这一点最好的解释是使用插图。


    假设我们有一个生成斐波那契数列数字的生成器。我们还有另一个平方数生成器。当我们想要计算斐波那契数列中平方数之和时，可以通过将 `generator` 函数的输出进行流水线连接来实现。输出：![](img/Image00027.jpg)
    这种流水线操作既高效又易于阅读（而且，，酷多了！）。


    ## 8.4 正则表达式


    正则表达式是一系列独特的指令，帮助你使用模式中持有的特定语法来比较或查找其他序列或字符串集。在 `UNIX` 系统中，正则表达式被广泛使用。`Python`
    框架支持类似于 Perl 风格的正则表达式，如果在编译或使用正则表达式时发生错误，`re` 模块会创建一个 `re.error` 异常。我们将介绍两个用于管理正则表达式的主要特征。不过，首先有一点：某些字符在正则表达式中使用时具有特定的重要性。我们将使用原始字符串（Raw
    Strings）即 `r''expression''` 来消除处理正则表达式时的歧义。


    ### 匹配函数 (Match Function)


    此函数尝试使用可选标志将 `RE` 模式匹配到字符串![](img/Image00028.jpg) 该函数的结构如下![](img/Image00029.jpg)
    `re.match` 特性成功时输出匹配实体，失败时输出 None。我们使用 `match` 对象的 `group(num)` 或 `group()` 特来获取相关的短语。执行上述代码后将得到下面的结果。


    ### 搜索函数 (Search Function)


    此函数在字符串中带有可选标志寻找 `RE` 模式的首次出现。该函数的结构如下![](img/Image00030.jpg) 以下是这些参数的解释——`re.search`
    方法成功时产生匹配对象，失败时返回零。要获取匹配短语，我们使用 `match` 对象的 `group(num)` 或 `group()` 方法。


    ## 8.5 Python 闭 (closures)


    Python 函数是一等公民。这意味着函数具有与其他 `Python` 对象相同的地位。函数可以被分配给列表中的变量、动态生成并丢弃，或者作为参数传递。嵌套函数（也称为内部函数）是在另一个函数内部定义的函数。`build_message()`
    是嵌套形式中的一个特征。它定义在外部函数 `main()` 内部并被引用。


    ### Python 闭


    闭是一个嵌套函数，它可以访问已经完成实现的的外部函数的自由变量。一个 `Python` 闭具有三个要素：


    - 该特征是嵌套的。

    - 从外部看，它可以访问一个自由变量。

    - 它返回封装的函数。


    自由变量是不包含在局部作用域内的变量。当函数用于数字和序列等静态变量时，我们将在闭中使用 `nonlocal` 终端。`Python` 闭防止了未来对全局值的使用，并提供了某种类型的数据隐藏。它们被用于
    `Python` 装饰器中。


    ### Python：闭的简单示例


    以下是对 Python 闭的清晰描述。在插图中，我们有一个方法 `make_printer()`，它可以生成并提取一个文件。嵌套 `printer()` 的特征是闭。`myprinter
    = make_printer("Hello there")` `make_printer()` 函数返回一个 `printer()` 函数并将其赋值给参数
    `myprinter`。到此为止它已完成实现。然而，`printer()` 的终止也与向量消息链接![](img/Image0031.jpg) 这是结果。


    ### 使用 nonlocal 关键字的 Python 闭


    `nonlocal` 关键字帮助更改持久形式变量的外部函数上下文。通过示例生成了一个计数器。`count` 向量通过使用 `nonlocal` 关键字变成了一个自由变量。现在我们可以更改它![](img/Image0032.jpg)
    这是结果。


    ### Python 闭 vs 类


    `Python` 中的闭可以作为微型类的替代方案。我们有一个 `summer` 类，它求和传递给单元的值![](img/Image00033.jpg) 数据包含在
    `object` 的元素中，该元素是在编译器中生成的。每当识别出一个表达式时，值就会更新，并测量和检索和。`Python 闭` 的替代方案如下。我们提供了一个具有相同特征的
    `Python 闭`。由于数据是声明式数组，我们不需要使用 `nonlocal` 关键字。


    ## 8.6 Python 属性装饰器


    `@property` 是内置装饰器。每个装饰器的基本目标都是更改类方法或特征，使得你的对象用户无需对其代码进行任何修改。假设分割以下类：结果如下![](img/Image0034.jpg)
