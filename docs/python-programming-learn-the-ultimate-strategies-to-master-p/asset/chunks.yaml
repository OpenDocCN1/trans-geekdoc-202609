    Python Shell 为用户提供了一个方便且快速使用的 GUI，支持屏幕向下划动以及实用的编辑自定义功能。与命令行设计相比，Python Shell 提供了许多额外功能。它可以用于运行程序，也可以与
    Python 进行动态交互。只需输入一段转录或断言即可。


    ### 文本编辑器

    在你的电脑上没有文本编辑器的情况下，你无法编写 Python 程序。如果你使用的是 Windows 系统，记事本（Notepad）功能可以很好地工作。请确保不要使用
    Word，因为它不是编辑器，因此程序无法在机器上正确保存。当你尝试使用记事本进行编辑时，你会发现 Windows 上最易用的是 `Notepad++`，而
    Mac 上则使用 `Text Wrangler` 文本应用程序。请执行以下步骤将其配置到位：


    - **Microsoft Windows**: 导入 `Notepad++` 并启动它。点击 `Language Menu`（语言菜单）进入 Tab 标签设置。勾选
    `Expand Buttons`（展开按钮）旁边的复选框。请确保值为 `Four`。点击 `Close`。

    - **Mac**: 安装 `Text Wrangler` 并加载它。安装应用时不需要签名，如果弹出询问此事的窗口，只需按 `Cancel` 即可。否则，执行其他提供的指令。一旦软件进入你的桌面，这确实是一个学习脚本知识的好机会，你可以非常珍惜这些
    Python 应用。


    ### 2.2 如何编写 Python 代码

    现在是时候更多地了解 Python 编码及其方法了。你应该让程序运行起来。你必须学习一些 Python 自带的各种关键字和参数，以便你能够写下想要让程序以各种方式运行的词汇。需要了解一些编程技能的基础知识，以便你能直接运行新代码。


    ### 2.3 关键字

    用户将关注一种新的计算机编码系统。记住，某些关键字在任何编程语言中都是可用的。这些是用于语言中特定命令或函数的词，你必须避免在其他地方使用它们。当你使用这些表达式时，可能会遇到错误警告，或者代码可能无法正常工作。


    Python 保留了关键字来描述其语言的语法和形式。在选择数据点、特征、对象、组等时，你也不应该将它们作为标准 ID。请注意下方 33 个关键字，并避免将它们作为标识符使用以消除错误或异常。


    ### 2.4 标识符

    当你创建一个新的 Python 应用时，你可以对其进行开发，创建多个对象并合并函数、类和变量。这些每一个都被分配了一个有时被称为标识符的名字。在创建 Python
    标识符时，你必须遵守一些规则：


    - 它可以包含字母（大写或小写）或数字与下划线的组合。  内部不能有空格。

    - 标识符不能以数字开头。

