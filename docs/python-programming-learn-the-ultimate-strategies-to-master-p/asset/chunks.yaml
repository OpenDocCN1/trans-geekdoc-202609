    # Python 编码标准


    ## 全局变量

    全局变量标签仅使用小写字母。对于由两个或多个单词组成的全局变量，必须使用下划线 `_` 进行区分。这些基本规则与任何其他 Python 项目都有所不同。请理解这一点，并将其作为每次学习体验的对比。


    ## 类命名

    如果对一个部分进行命名，请使用`大驼峰命名法`（Upper Case Camel Case）规则。相比之下，包含的类通常使用小写字母编写。偏离这些通常会导致“异常”（Exception）。


    ## 实例

    标记由多个单词组成的实例变量时，必须在小写字母之间使用下划线 `_` 分隔；然后编写名称。非公共实例属性标识以单下划线 `_` 开头。涉及修改的实例名称以双下划线
    `__` 结尾。


    ## 包与模块

    所有模块标题必须是小写字母。模块名称理想情况下应该是简洁的单词。而且在禁止的情况下，如果需要为了语法高亮，可以使用多个短语。可以通过单个下划线 `_` 来区分它们。


    ## 函数命名

    函数的标题必须采用小写形式。当你使用多个单词作为函数名以增加可读性时，应该用下划线 `_` 进行区分。


    ## 参数命名

    在特定的方法中，你仍然可以使用 `self` 作为第一个参数，使用 `cls` 作为初始类方法语句。通常，如果你想将语句名称与分配的关键字隔离开，则倾向于使用简单的前下划线
    `_` 用于缩写或名称区分。


    ## 常命名

    常量由全大写字母组成，以区分多个单词。例如：`TOTAL_MinUnderflow 2.5`


    ## 控制流

    当你操作 Python 编程语言时，你可以编写 `List` 类型句子，就像填写购物清单一样。机器从函数之前的第一条命令开始，其方式就像你在图表上让它们看起来的一样。而且你必须这样做。系统在完成执行指令之前不会停止读取此文档。这被称为控制流（control
    flow）。这是一个重要的起点。你希望确保计算机调节的流程是平衡且无缝读取的。这将简化操作，让系统执行你想要的任何操作而没有太多的复杂性，并确保机器不会陷入、触发问题或发生其他其他故障。


    ## 2.6 分号与缩进

    当你检查其他一些编程语言时会注意到，使用了许多括号来组织各种源代码或开始和结束句子。它帮助你在这种环境中保持代码的视觉块，以便于阅读文本，而设备即使在没有缩进的情况下读取各种脚本。


    反引号用于定义字面量字符串。可以使用单引号（`''` `）、双引号（`"`）或三引号（`''''''`），但必须使用通用的引号标记开始和结束字符串以保持连续性。其中一种编码风格将非常难以阅读。


