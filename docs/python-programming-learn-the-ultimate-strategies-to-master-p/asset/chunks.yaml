    4. 现在，`1!`！这确实是我们的基础情况，所以它等于 1。


    由 Python 实现的递归近似函数 `n!`：在幕后，在到达特定情况之前，请求栈中插入了一个特定的基准（通常包含所使用的资源）。因此，随着每次调用产生其结果，栈会继续释放。


    #### 状态管理


    请记住，在与递归函数交互时，每一次递归调用都有其自己的实现背景，你必须在整个递归过程中保持状态：


    - 通过状态链接每一次递归调用，使得当前实例化位于当前调用的运行上下文中

    - 持有全局空间


