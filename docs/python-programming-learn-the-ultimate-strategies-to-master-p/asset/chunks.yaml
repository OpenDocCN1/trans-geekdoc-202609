    # 第一章：Python 编程的历史与基础


    Python 是一种高级、动态、面向对象、结构化且通函数语言。Python 脚本是一种高级脚本语言，易于理解。代码几乎使用近标准英语编写，并带有易懂的语法、描述性的协议和短语，非常美观。它是一个促进标准化、实用、面向方面编码的框架，包括编码中的面向对象风格。它展示了结构化函数与过程化语言相比的使用。它有助于用户定义类。


    ## 1.1 Python 的起源

    Python 的现代编程始于 1989 年 12 月。该计划由 Guido·范罗姆（Guido van Rossum）提出。当时，范罗姆正在专注于一项后来在荷兰国立科学研究学会（CWI）完成的任务。范罗姆可能使用了这种名为
    ABC 的现代语言的任何概念，并在 Python 上运行。整个语言最大的特点是易于掌握，使其变得更加复杂或直观，并且可能支持多个操作系统。在计算机成为主流的时代，这些都是至关重要的。在引入各种文件格式和仓库的
    Python 后，它也取得了成功。自创建以来，Python 经历了一定的演变，可用资源也更多，引入了更多的编程功能。除了让 Python 易用之外，范罗姆还开发了支持所有人的编码技术的程序，而不仅仅是少数人。使用
    Python 编程可以让体验更顺畅，并缓解那些担忧。强力的编程代码链接在一起，看起来并不那么可怕。在过去的多年里，范罗姆计划将 Python 开源。这意味着授权了所有访问，并且如果范罗姆发生了任何情况，对
    Python 进行改进，任何都不会丢失。得益于 2000 年开发的 Python 2.0 开源，它的发布使其更加流行，其创作阶段集中且直接。虽然包含了一些新的
    Python 2.0 迭代，但 Python 3 横扫了整个环境。Python 3 版本于 2008 年发布。它不是对工具包的升级，而是对其进行的巨大更改。然而，这个版本带有许多奇的函数，它没有兼容性问题，因此你可以在
    Python 2.0 和 Python 3 之间进行选择。为了更方便地操作，程序员在软件显示上做了一个小标记，以便在两个程序之间随时修改正在上传的内容。


    ## 1.2 为什么考虑 Python？

    正如你所想象的，对于应用程序你可能会选择一些机器码。然而，对于其他软件，Python 是其他最佳方法之一。它简单易用，你有很多选择，但它也可以在不更改任何内容的情况下运行在各种系统上。你在
    Python 中喜欢的某些属性是：可读性。Python 的开发是为了与英语语言结合，这使得阅读非常方便。此外，句子结构有清晰的规则，你不只是盯着括号。Python
    通过一套规则保证了如何构建一切，创建出其他人可以快速适应的脚本。Python 已使用了几十年，是最易于理解和判断何时使用的代码之一；产生了许多不同的代码。很棒的是，这个系统向公众开放，任何开发者都可以使用。无论你是否使用代码来开始或编写你自己的代码，库都是易于使用的。你喜欢的代码存放在库中，因为系统中有长期的联系，它们将涵盖你想要简化主机的几乎任何内容。由于
    Python 广为人知，Python 社区非常大。有很多工作坊以及大量的线下和在线场所供探索或阅读更多关于程序的信息。也许你喜欢交流。如果你是新手，可以看看这些网站，你可以了解更多并结识新的人。如果你想开始编程，Python
    是最棒的选择之一。它很容易设置，因为它确实有效。你当然会在个人电脑或多个系统上工作，因为它易于阅读；你会发现编程并不是至关重要的；你应该建立你自己的，而不是从别人那里学习。


    ## 1.3 Python 的优势

    Python 是目前你可以选择的最简单语言之一。初学者会喜欢这个系统触发是如此简单，不需要专业知识就能编写你的第一行代码，如果你是专家或高素质人才，还有很多可以做。如果你从
    Python 开始，有一些益处：使用时易于阅读，几乎没有比它更方便的语言了。像计算机语言之类的语言充满了 Bug，看起来很笨拙。它们有大量的括号，甚至是你甚至不会注意到的短语。这对于足够让不习惯编程的人感到恐惧，因为这两个词看起来都非常令人生畏。这在
    Python 中有点不寻。Python 没有使用所有疯狂的括号，而是使用缩进，使得页面易于阅读，这不是什么问题。而不是你无法理解的单词，它包含了英语。其他独特特征也保持简单，这样你就不会觉得在盯着源代码看很久，否则最后你会感到沮丧。它是编程最简单的工具之一。网站上的一切看起来都很好，并在可能的情况下使用几空行，以促进如果一个过程对你来说太困惑，你可以获得清晰度。总的来说，它是用于前进或学习编码的最简单语言之一。由于这个框架以英语为中心，它非常易于阅读。通常没有太多你无法理解的词，你不需要花时间试图弄清它在说什么。代码全部是英语，你会发现事情可以变得如此简单。目前在某些机器上，Python
    在某些情况下已经存在于你的 PC 上了。在 Mac OS X 和安装了 Ubuntu 的系统上，Python 已经预装了。你只需要一个文本解释器就可以开始。考虑到在
    Windows 电脑上你需要做的事情就是安装该程序。Python 适用于所有这些系统，尽管它们没有立即安装。从一开始就可以与其他语言一起工作，你显然只会单独使用
    Python。使用该程序进行训练和开发是一个很棒的主意。然而，随着时间的推移，你可以决定是否可以做一些 Python 自身无法做的事情。幸运的是，Python
    能够与许多其他计算机语言交互，包括 `C++` 或 `JavaScript`，这样你可以尝试、了解更多，并获得你寻求的编码，尽管 Python 并不能完成所有工作。通过解释器评估，当你安装
    Python 时必须下载一个文本解释器。它将涉及学习更简单的 Python 数据。你可能经常使用手已有的简单产品，包括 `Windows Notepad`，或者搜索另一个稍微快一点的解释器。当你选择了想要使用的翻译器时，就是开始编写脚本的工作了。任何最新的编码者可能都会担心如何处理。


    ## 1.5 Python 中的常见术语

    在你深入学习编程技能之前，识别一些有助于编码的词汇是至关重要的。


