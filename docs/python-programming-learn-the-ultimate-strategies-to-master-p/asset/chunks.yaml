    # 函数的退出


    在一个函数内部，`return` 类型往往会导致 Python 函数立即离开，并将执行权移交给调用者：此实例中的整个 `return` 语句——绝对没有必要。当调用处理程序开始销毁时，函数会返回到调用者——这是在最后一条函数执行段语句执行完毕之后。因此，即使没有
    `return` 语句，整个函数的行为也将是相同的。


    ## 调用者数据


    在退出任务方面，`return` 被用于将数据返回给调用者。如果函数内部的 `return` 语句之后有一个元素，则请求上下文中中的调用函数将决定该表达式的值：在这里，第
    5 行的 `f()` 表示为 `''foo''`，然后它被分配给变量 `s`。每一个对象都可以由函数返回，这意味着几乎所有内容都行。在整个调用上下文中，函数调用可以以某种符合方法返回的对象实例意义的方式使用。例如，`f()`
    在该脚本中返回一个字典。`f()` 术语在调用上下文中反映了一个字典，因此 `f()[''baz'']` 是该字典中一个合法的主链接：![](img/Image00009.jpg)


    ## 元组包


    如果在 Python 函数规范中参数标识符之前有一个星号（`*`），它意味着这是一个元组包参数。调用函数中的任何后续参数都将封装成某种元组，可以通过该参数的前名进行引用。这里是另一个例子：整个
    `f(definition)` 中的整个参数定义 `*args` 意味着元组包。在每次调用 `f` 时，参数都会被封装成某种元组（该方法可能会通过 `args`
    标签对此做出响应）。然而，可以使用任何标题，但 `args` 被选择得如此频繁，以至于它几乎成了一种常态。


    ## 字典包


    Python 确实有一个相关的工具，即双星号（`**`），可用于使用函数参数和参数描述并解包字典包。在 Python 函数定义中，在变量之前通过星号（`**`），必须将一个
    `key = value` 键对加载到此类字典中，并带有相应的断言：在整个案例中，断言 `foo=1`、`bar=2` 和 `baz=3` 被封装在一个字典中，供函数
    `kwargs` 引用。每个标题可能都可以使用，但 `kwargs`（`args` 的缩写）几乎是常态。你不需要致力于它，但如果你在这样做，理解 Python
    编程安排的人会本能地知道他们在说什么。


    ## 5.2 文档字符串（Docstring）的作用


    在紧接顶角之后的第一个字符串被看作函数中可以命名的 docstring，它是数据字符串来说更短的。即信息字符串。它可以用于脚本中以清楚 `Function`
    似乎在做什么。它是一个额外的配件，但它是建议的。如果你正在或将开始使用某些行，你应该使用三引号。


    ## 实现流程


    断言的实现也必须立即从脚本中的第一个声明开始。你的声明只能一次进行，以防止在确保系统尽可能无缝时产生不确定性。


    ## 脸


    执行将始终从头到尾，你将确保将它们放在正确的位置。然后你必须确保在计划命名它们之前，对 `Functions` 的描述具有正确的顺序。


    ## 匿名功能


    开发者可以使用 Python 构建匿名函数。那些是在初始化时不会被分配给标题的特征，你将不得不使用 `lambda`，它是一个构建此类特征的运算符。本质上，在角色所在的地方，你想构建它们并丢弃，或者就在在创建的地方，有几个
    `Lambda` 函数运行的特征，分别是 `reduce()`、`map()` 和 `filter()`。


    ## map 函数


    `map()` 函数指的是任何迭代器的表示形式，或者列表中的那些。你可能会使用匿名单行来让这种情况发生，尽管它是你所有 `Functions` 内部都可以使用的。而且你将处理一个列表，该列表在你的应用程序代码中本该是安全的。


    ## Filter 函数


    `filter` 函数将是列表上的下一个。即使你从标题中推断 `filter`，它也会移除函数返回有效集的项。其余部分被忽略。这意味着应该创建一个系列来将每个项带入函数，无论有效还是错误。如果模式具有某些会被
    `filter` 函数选择的选项。另一方面，如果它们两者都符合，那么你将发现那些项没有被处理，或者某些项是不真实的。


    ## 归约函数


    `reduction` 函数有点独特。它需要向模式获取许多值，并将其处理为唯一的一个值，而不是你拥有的大列表。它是根据情况移动的。


    ## 第 6 章：面向对象编程


    面向对象编程是一种编码框架，它始终提供机制将特征组合到特定对象。例如，一个对象可以描述某个人，具有类似于姓名、性别以及行走、进食和跑步等活动的属性。或者，一封电子邮件可能包含资产，如主题列表和文本，以及如附件和提交等活动。换句话说，面向对象编程是真实现实对象的模拟方法，例如车辆以及对象之间的连接，例如学生和父母等等。OOP
    将真实世界对象视为具有此类细节的数字结构，但可以执行某些函数。编码的进一步理论可以在模式中找到，它通过提供一系列移动来构建一个像模式一样的程序，这些移动在函数类型和代码段中并发流，以完成项目。主要的接管是对象是面向对象编程的核心部分。


