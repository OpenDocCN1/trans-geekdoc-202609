    # 如何进行浅拷贝


    对于给定的描述，我们必须创建一个新的嵌套列表，然后使用工厂函数 `list()` 将其拷贝：`ys` 仍然保留了对 `xs` 中包含的初始对象的链接，因为我们只创建了实际集合的浅拷贝。这些子元素没有被复制。我们只是在复制的列表中对它们进行了引用。每当你更改
    `xs` 中的其中一个子项时，`ys` 也会反映这一变化，因为这两个列表包含完全相同的子产物。这种拷贝是浅层次的、单层级的版本。


    # 如何进行深拷贝？


    让我们重新回顾之前的列表复制案例，尽管有一个重大变化。这次，我们将构造一个使用拷贝框架 `deepcopy()` 函数的深拷贝：尽管如此，但如果你对其中一个子产物
    (`xs`) 进行调整，深拷贝 (`zs`) 将不会受到此更改的影响。所有的初始产物和副本产物都是完全不同的。`xs` 已被递归地复制，连同它所有的子产物。


    ## 需要牢记


    - 将对象设为浅拷贝不会复制子对象。因此，拷贝与源并不完全不同。

    - 元素的深拷贝会递归地复制子对象。副本与源是完全独立的，尽管构建一个深副本的速度很慢。

    - 你可以使用拷贝功能拷贝随机对象（例如自定义类）。


    # 测试代码


    如果你想更深入地学习其他高级或中级水平的 Python 优化算法，请尝试这个可选的激励措施：7.6 测试代码。Python 编程是一门主要学科，可能会带来很多困难，但它并不得得复杂。通过几个快速步骤，你就可以开始为项目构建基础示例，然后对其进行扩展。棒的一点是，尽管你已经知道结果，但你实际上产生了一次检查。你能在运行和使用代码之前就知道结果吗？你是否测试并玩过这些功能了？它被归类为测试过程，这是一种手动检查。探索性测试是一种没有任何计划的测试类型。你也在探索性研究中测试框架。你必须做的是列出你提交的规范、你将考虑的各种类型输入以及预期的结果，以完成一系列手动测试。目前，每当你尝试修改文件时，都必须检查该列表中的每个对象。这听起来是不是很有趣？这就是软件处理进行的地方。算法测试确保了测试过程将由代码而非人类执行（你想要测试的规范部分、你想要测试的顺序以及预测的反应）。Python
    还提供了系列框架和函数来帮助你开发自动化测试。


    # 单元测试 vs 集成测试


    科学领域并不缺乏术语，但既然你已经意识到了计算机化测试结果之间的差异，是时候探索它了。谈谈你如何检查汽车的灯。你也会打开灯（考试步骤），然后离开汽车或找一个朋友来验证灯可能已经亮了（这被称为测试注释）。多组件模式被视为集成测试。假设为了在基本事物中获得正确的结果，需要正常工作的一切。这些元素都是你编写的所有组、函数和模块。集成测试是一个大问题，即集成测试没有提供正确的结果。通过孤立系统哪个部分故障来诊断问题是非常困难的。当灯没有打开时，灯泡可能坏了。是电池没电了吗？替代方案是什么？汽车的机器故障了吗？如果你有一辆漂亮的新车，白炽灯熄灭时它会告诉你。这是通过单元测试完成的。单元测试是一种更简单的测量，用于测试特定部分是否执行正常。单元检查将帮助你更容易地发现和修复代码中的错误。你还看到了两种测试：集成测试测试元素是否良好地适配程序；单元测试针对特定部分测试应用程序。所有的集成测试（包括单元测试）都可以用
    Python 编写，为内置的 `sum()` 编写单元测试，针对指定的输出测试 `sum()` 的值。例如，这就是如何测试数字的 `sum()` 是否为 6
    `(1, 5)`。你能在运行和使用代码之前就知道结果吗？你是否测试并玩过这些功能了？它被归类为测试过程，这是一种手动检查。探索性测试是一种没有任何计划的测试类型。你也在探索性研究中测试框架。你必须做的是列出你提交的规范、你将考虑的各种类型输入以及预期的结果，以完成一系列手动测试。目前，每当你尝试修改文件时，都必须检查该列表中的每个对象。这听起来是不是很有趣？这就是软件处理进行的地方。算法测试确保了测试过程将由代码而非人类执行（你想要测试的规范部分、你想要测试的顺序以及预测的反应）。Python
    还提供了系列框架和函数来帮助你开发自动化测试。


