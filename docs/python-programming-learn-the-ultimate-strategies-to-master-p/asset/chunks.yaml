    为 `Pytest` 创建示例 `TestSum` 测试用例如下：


    ## 7.8 Python 调试器

    Python 调试器是一种高级的 Python 软件调试器。它可以在源代码行阶段设置基准和特定步骤。它还允许堆栈帧检查、源代码命名以及对堆栈中的每个元素进行条件
    Python 代码分析。此外支持事后调试（Post-mortem debugging）。为了帮助我们实现目标，我们拥有 `pdb` 模块。我们需要导入它。


    我们将从一个插图开始，并继续演示 Python 调试器正在做什么。我们进入桌面并构建一个包含所需信息的 `demopdb.py` 文件：让我们真正看看代码能提供什么。我们第一次加载
    `pdb`。然后可能指定一个值为特定数值的参数 `x`。接下来，我们设置一个“自幂”函数，它可以将整数恢复为其相同的幂。然后我们移动到断点处的代码中；我们在调试器中输入。下一个参数是针对七个参数的“自幂”请求，将返回结果存储在
    `seven` 变量中。此时，我们打印 `seven` 的名称。最后，我们将自幂 (3) 返回的结果放在 `three` 字段中并打印出来。


    ## 7.9 用于练习学习的简单 Python 项目

    学习如何工作对于提高你作为软件开发人员的生活非常重要。你使用所学的知识。你必须开发可以在网络上运行的应用程序，以便没有某些技术知识的用户也能使用你的程序。云、移动端和控制线是你想要构建程序的三个主要渠道。


    ### 内容聚合器

    内容为王。它在互联网上随处可见，从论坛到社交网络网站。为了保持跟前，你必须主动在互联网上寻找新知识。保持更新的方法之一是定期搜索所有研究的新进展。然而，这耗时且非常累。


    Web 聚合器在这里派上用场：Web 聚合器从在线的各种位置收集数据并将所有数据存储在一个站点。你不需要访问很多地方即可获取最新信息：一个网站就足够了。所有的数据都可以通过聚合所有网页的
    Web 聚合器从单一来源提供。人们看到吸引他们的帖子并想要更多，而无需处处奔波。


    ### 技术细节

    该提议项目的主要目标是整合内容。其次，你将从需要网络聚合器获取网页的地方进行学习。然后你可以使用 `HTTP requests` 和 `BeautifulSoup`
    等资源来搜索并从网页中提取材料。作为上下文，框架将强制执行聚合。`celery` 或 `apscheduler` 等库可以提供支持。你可以尝试使用 `apscheduler`。它非常适合没有后台的小型系统。在从不同网站下载内容后，你需要将其存储在某处。然后你将使用文件夹来存储提取出的信息。


    ### 短链接

    URL 可能会非常长且不利于使用。当人们交换链接或尝试回忆 URL 时，这很困难，因为大多数 URL 包含复杂的字符且没有显示清晰的单词。这就是短链接生成器的用武之地。URL
    缩器通过减少 URL 中的字母或短语，使阅读和记忆变得更容易。像 `sghq xyz.com/wwryb78&svnhkn? Sfiyh` 这样的数字 URL
    可以切分为 `xyz.com/pioj`。以下是几个短链接接口：

    * Bitly

    * Quick Me


    ### 细节

    此概念提案旨在简化 URL。程序的主要目的是缩短 URL，并在在使用简化 URL 后引导用户回到原始 URL。客户端必须输入现有 URL，从而生成新的简化的
    URL。然而，你可以为消费者提升结果。生成带有随机字符的缩写 URL 意味着一个比平均水平更强的 URL。自定义的 `xyz.com/mysite` 现在毫无疑问优于平均水平修改后的
    URL。


    ## 第 8 章：高级 Python 编程

    在整个章节中，我们将讨论与 Python 编程相关的一些最高级主题。


    ### 8.1 文件管理：通用文件

    在 21 世纪，不可能找到一个不知道什么是电脑的人。例如，当我们提到文件时，我们指的是设备上的文件。可能有些人不再知道用来按正确顺序存储文档的“盒子”了，比如抽屉或文件夹。这种东西的数字版本就是设备上的文件。它是知识的汇编，计算机算法可以查看并使用。文件通常保留在永久存储空间中。稳固意味着数据是永久的；即在生成或修改它的程序终止后，它可以被其他程序使用。电子文件控制是指对自动记录以及单个或多个文件文件中信息的处理。虽然大家都认识“纸”这个词，但我们仍然提供了一个特定的描述：文件或系统文件是一组相互关联的数据或信息的块，计算机软件可以利用。文件通常放置在固定存储设备上，例如硬盘驱动器。人类在应用程序和代码中使用文件名和路径，为了出于读取和更改的原因查看文件。


    '
