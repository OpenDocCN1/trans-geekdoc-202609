    ### 8.7 Python 断言语句 (Assert Statement)


    断言（Assertions）是显式声称或陈述计划事实的声明。例如，当你编写一个除法功能时，你确定除数不应该为 0，你是在主张除数不零。断言本质上是布尔表达式，用于测试返回的结果是否为真。如果有效，软件将什么都不做并继续执行下一段代码。但如果出错，代码将暂停并抛出异常。这这也是一种诊断方法，因为它在发生任何错误时都会中断程序并指示错误发生的位置。查看下方的图表将非常清晰：Python
    assert 语句


    #### Python assert


    Python 内置了断言声明，用于在代码中使用断言语句。参数论点有一个必须始终有效的要求或短语。当虚假的陈述状态阻止代码执行时，它会给出一个 `AssertionError`
    错误。


