    # 第 4 章：控制结构与循环


    在生活中有很多时刻，你必须根据周围的一系列情况来做出选择。也许某天，你突然决定出去兜风，但天气开始大雨倾盆。而你只能呆在那里，没有任何办法可以帮助你？不，你可能会起来，想开车出发。你可能想干脆留在家里读读书。你可能会做出不同的决定，尽管人们并不会根据你的处境来衡量。这在与
    Python 交互方面在想法上大同小异。


    到为止，我们提供的软件在当时只提供了一项待执行的任务。如果条件不完全一致，你似乎真的无法通过主动性获得任何好处。它对其他人来说根本不起作用，特别是当其他人可以选择几个不同的答案时。决策结构是你可以选择几个其他选项的组件。在某些情况下，如果第一个决策并没有真正起作用，大多数情况下，这些会导致真或假的结果。你应该弄清楚你想考虑采取哪些主动措施，以及如果结果为真或假，你将执行哪些程序声明。


    在 Python 中，每个非空或非零值都被解释为真（true），空或零被视为假（false）。Python 系统中的 `if` 表达式就是你允许此类操作的方式。它允许根据表达式的含义条件地渲染一个语句或一组语句。为了充分理解，许多这些尝试了以下内容：


    - **If 语句** — 该语句必须由一个布尔值以及紧随其后的一个或多个语句组成，如果答案匹配则执行。

    - **If else 语句** — 这种备选方案用于“If”语句为真的情况；然而，除非布尔表达式为假，否则会有一个类似的参数可以执行。

    - **嵌套 if 语句** —— 可以根据需要将 `if` 语句和 `if-else` 语句用于另一个语句内部。


    ## 4.1 If 语句


    `if` 参数将告诉解析器你提交的是一个决策方向。其关键字背后的条件，无论它是否在括号内。如果你需要执行脚本，条件必须为真，即使在这种情况下该参数是不准确的，它只会被忽略，并继续执行你提供的下一条指令。


    但另一方面，可以创建一个 `if ... else` 语句。如果情况有效，它将演示原始语句；但如果情况不正确，它将最终执行第二个点。这可以帮助确保无论其他人发送了什么，你都获得了正确的消息，并防止解释器完全漏掉这个过程。


    接下来你可能提出的问题是，如何判断断言真假？必须使用所有的关系运算符来允许。这是因为两个值可以匹配它们是否相等、不相等或不同的替代方案。现在我们将查看在几个句子中包含
    `if` 语句的情况。在一个句子中考虑两个或三个语句并在所有它们都满足时继续执行，这并不稀奇。当你编写这些语句时，你应该确保正确地缩进所有内容。让我们看看如何实现这一点。请确保你找到你的翻译器，并练习如何编码以及
    `if` 语句的工作原理。


    由于 `if` 语句大于 2，你可以认为祝贺的消息将被输出。然而，如果数量小于二，将没有语句，因为并不是所有语句都已满足。


    一切关于缩进。Python 实现了一种名为“离旁规则”（off-side law）的原则，该原则由英国软件工程师 Peter J. Landin 发明（该词源于联邦术语中遵循缩进的离旁规则）。Python
    是遵循离旁规则的少数语言之一。从 Python 中理解到，缩进在 Python 脚本中具有特定的值。现在你理解了某些缩进如何用于描述复合或区域。在同一阶段缩进的相邻语句在
    Python 系统被视为同一个单元。因此复合 if 语句所示：与缩进同级（第 2-5 行）的所有符号都被认为包含在同一个链中。整个块在 `if <expr>`
    为真或 `if <expr>` 为假时执行。无论如何，执行通过后续语句（第 6 行）继续。


    看看这段代码 `foo.py`：


    ```python

    # rows 2-5

    print()

    # row 6

    ```


    每个缩进都决定了一个新结构，任何取消缩进（outdent）都会结束上一个块。结果的方法非常简单、连贯且符合逻辑。有什么好处？光明的一面：Python 对缩进的使用简单、简洁且清晰。在没有离旁规则的脚本语言中，缩进与块的概念和脚本函数完全分离。以一种并不真正符合代码运行良好程度的方式实现代码是可以接受的，但如果人类只看它，会产生错误的印象。在
    Python 中，这种错误几乎不会发生。通过使用缩进来描述块允许你保留实际上应该使用的文件规范。大多数编码员都无法忍受必须做某些事情。那些对什么听起来好、什么不好敏感的人，真的不喜欢被挑选。许多编辑器在缩进行左侧引入空格和制表符组合，导致无法知道
    Python 解释器的缩进标准。但另一方面，编辑器通常可以编程不这样做。此外，无论什么语言，代码中制表符和空格的组合都被认为是不恰当的。无论用户是否喜欢，在
    Python 中编写代码时都要遵循离旁规则。许多最初使用非常传统的方法定义块的开发者都适应了 Python 的路径，但对此感到自在，甚至开始喜欢它。


    ## 4.2 “if-else”语句


    到为止，我们已经思考了许多 `if` 语句。这些语句直到你可以看到语句输出之前都是有效的。如果事情结果为假，则没有任何语句执行。现在它偶尔有效，但在其他情况下例外。你可能希望提出一些不同的语句，例如。对于
    `if else` 语句，你可以选择两个，并且根据结果通常会有更多语句出现。如果结果是有效的，你将第一个断言出现，因此如果结果不正确，你可以选择另一个。这意味着无论结果如何，你都会得到一个回复，从而让软件揭示任何不同的内容。你只需要在编写
    `else` 时确保包含你的 `if` 语句，而是将其放在你想要的语句中。为了工作，一切应该随时完成，但对于你的脚本，它带来了许多其他不同的方式来确保一切都平衡并看起来完美。


    ### elif 语句


    `elif` 语句是你为语句可以做的另一种选择。通过使用它，你可以检查几个短句是否准确，而不仅仅是一个短句，这样只有当其中一个情况证明是真实的。这确实是有效的，但优势在于可以在
    `if` 之后定义任何 `elif` 声明。


    ### Python PASS 语句


    有时，你可能觉得想创建一个代码存根：一个你最终可以添加代码行的替代方案。对于像 Perl 和 C 那样用大括号定义块的环境，可以使用空边界来描述代码存根。这种描述例如是合法的
    Perl 或 C 代码：


    ```

    # Python is my favorite If (x) { }

    ```


    这里的空括号描述了一个块。Perl 或 C 测试语句 `x`，但相反没有采取任何行动，尽管它是有效的。

