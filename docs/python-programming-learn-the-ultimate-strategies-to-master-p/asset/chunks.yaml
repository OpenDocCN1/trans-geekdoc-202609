  trans: "\n\n# 第 5 章：函数\n\n函数是 Python 教学和学习过程中的另一个重要方面。它们本质上是脚本片段，是自包含的，并且可以在脚本内部执行一致的操作。我们可以定义函数的标题，甚至是语句链。然后，你应该通过其标题来标记该函数。\n\
    \n你可能对函数的数学方程非常熟悉。函数是一个（甚至是多个）源与一系列结果之间的链接。在数学中，这通常确实是一个函数：![](img/Image00006.jpg)因此，`f`\
    \ 确实是一个作用于 `x` 和 `y` 参数的函数。函数的产出是 `z`。然而，脚本特征比这要常见且灵活得多。尽管如此，包括使用函数在内的正确解释对于软件的正确创建至关重要，几乎每种现代脚本语言都包含了内置函数和用户定义函数。\n\
    \n对于编码来说，函数是一个独立的代码块 `id()`，它体现了特定的活动或特定的项目。`len()` 显示传递给它的参数长度：`Any()` 接受一个迭代对象作为参数，如果该迭代对象中的一个元素是有效的，则响应\
    \ `Valid`，否则响应 `false`：这些内置函数中的每一个都执行特定的工作。某处是完成该任务的脚本，因此我们不需要学习脚本何时以及如何运行。你只需要学习的所有内容都是函数的布局：\n\
    \n*   需要哪些（如果有的话）参数\n*   它产生什么（如果有的话）值\n\n然后调用函数并提供正确的参数。脚本的实现将移动到分配的脚本主体并使其变得可用。一旦操作完成，操作将返回到代码。正如上面描述的那样，函数将返回数据供脚本使用，或者不返回。如果你创建自己的\
    \ Python 函数，它的工作方式是这样的。你从脚本的其他地方调用 Python 函数，因此执行流将传递给构成此函数的代码结构。操作完成后，它将移动到调用任务的位置。根据你如何构建该功能，在调用函数时可以传输数据，并且在函数结束后可以传回传递的值。\n\
    \n由于 Python 函数的显著性，几乎所有当今使用的框架（frameworks）都允许某种类型的用户定义函数，而函数并不一定被标记了标签。为什么要费力描述函数呢？对此似乎有几个非常合理的解释。让我们来看其中几个。\n\
    \n## 延推与重新处理\n\n### 5.1 用户定义函数\n\n假设你编写了一个有价值的脚本。随着你的进步，你会发现该脚本执行的函数是你你在几个不同地方经常需要的。你该怎么做呢？好了，你可以通过编辑器的复制和粘贴功能重复地生成该脚本。最终，你通常必须修改该脚本。要么你会发现它存在一个需要修复的问题，要么你可能决定更改它。如果脚本的副本分布在整个项目的各个地方，你必须在所有地方进行必要的调整。\n\
