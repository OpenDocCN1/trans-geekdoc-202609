    \ `45` 转换为相应的八进制、十六进制和二进制形式：\n\n## 浮点数 (Floats)\n\n浮点数表示真实的小数点。例如：`0.40`、`50.10`、`1030.34`、`3.2`。相反，浮点数在数学符号中使用字母“e”来表示\
    \ 10 的幂次。\n\n## 复数\n\n复数是虚数或实数的组合。其形式为 `a + bJ` 或 `a + bj`，其中实数是左侧的操作符，右侧节点是一个浮点数（`b`）和一个虚数（`J`）。大小写的\
    \ `J` 或 `j` 对应 -1 的平方根。\n\n## 算术运算符和数字\n\nPython 的算术运算符允许程序员构建实际用途并将常规活动计算机化。Python\
    \ 支持七种算术运算符：\n\n### 加法 (`+`)\n加法运算符将输入连接到操作的每一侧：\n```\n>>> 10 + 14\n24\n``` \n\
    \n### 减法 (`-`)\n它从左侧输入中减去右侧输入的值：\n```\n>>> 40 - 10\n30\n``` \n\n### 乘法 (`*`)\n\
    该运算符将运算符两侧的部分相乘：\n```\n>>> 3 * 3\n9\n``` \n\n### 除法 (`/`)\n该命令将左输入的值除以右输入的值的值：\n\
    ```\n>>> 16 / 4\n4.0\n```\n请注意，根据定义，无论输入数据的类型，除法运算符都会产生浮点数。如果你想获得整数系数，可以使用 `int()`。\n\
    \n## 显示非数值的数据类型\n\n例如，如果你需要整数输出，而除法表达式产生的结果是浮点数，你可以通过 `int()` 将其强制转换为整数。相反，你可以使用\
    \ `float()` 将方括号内的表达式转回为浮点数。\n\n### 幂运算 (`**`)\n幂运算符将第一个输入提升到右输入指定的次方：\n```\n\
    >>> 3 ** 4\n81\n```\n\n### 取模 (`%`)\n取模运算符 `%` 在左输入除以右输入后返回余数：\n```\n>>> 3 % 7\n\
    4\n```\n\n## Python 中的运算符\n\n### 比较\n此类运算符比较每一侧的结果。它们通常被称为关系运算符。\n\n### Python\
    \ 中的赋值运算符\n\n位运算符按位执行。假设 `a = 60` 且 `b = 13`；它们的二进制值分别是 `00111100` 和 `00001101`。下表总结了支持的位运算符。\n\
    \n### Python 中的逻辑运算符\nPython 语言支持各种逻辑运算符。\n\n## 列表\n\n列表是 Python 中最灵活的数据类型之一。`List`\
    \ 各种元素，使用方括号 `[]`。它们与 `C` 语言中的数组相同，唯一的区别是列表中的元素可以是各种数据类型。\n\n`List` 中包含的属性可以通过切片运算符获取。从\
    \ `0` 开始到 `-1` 的属性也可以通过切片运算符获取。加号 `+` 是重复运算符；你应该使用星号 `*`。\n\n### 列表操作\nPython\
    \ 允许序列数据结构，包括索引、切片、添加和成员。索引是最常用的形式之一。理论上，列表应该包含任何形式（字符串、浮点数、数字等）。它可以包含一个或多个数据类型。数字可以更新。你就可以添加、删除或更改组件。列表的构建只需通过逗号区分对象序列，此时对象使用方括号。\n\
    \n### 访问列表\n要查看列表中的值，使用方括号 `[]` 配合索引。\n\n### 编辑列表\n通过等号左侧，用户可以刷新简单或复杂的组件，并使用 `append()`\
    \ 函数插入列表。\n\n### 删除元素\n一旦你确定了要删除的元素（s），可以使用 `del` 表达式；如果不确定，可以使用 `remove()` 方法。\n\
    \n## 元组\n\n我们需要理解的进一步步骤是关于元组（tuple）。它与列表非常相似，并且都使用符号。最大的区别是列表使用大括号和组件，且长度也可以更改。另一方面，元组仅使用括号，你永远被允许保持它们。元组的一个很好的特性是它们表现为只读页面。只要你不试图对元组进行调整，你就可以以列表的方式使用它。\n\
    \n元组是一组有序且不可变的元素。元组与列表非常相似，元组和列表的区别在于元组不能像列表那样修改，而元组使用括号。开发元组只需放入多个逗号分隔的数字。或者，此类逗号分隔的数量也可以放在括号中。\n\
    \n### 访问值\n要查看元组数字，使用方括号通过索引或索引获取索引的值。\n\n### 更新元组\n例如，对于更新，元组是不可变的，这意味着元组元素的属性不能更新或修改。你可以使用现有元组的部分来构建新元组，如下所示。\n\
    \n### 删除元组元素\n无法消除特定的元组元素。构建另一个删除了不需要元素的元组是没有问题的。使用 `del` 表达式可以直接删除整个元组。\n\n###\
    \ 基本操作\n元组非常像 `+` 和 `*` 运算符的字符串；它们也意味着连接和复制，尽管结果是一个新元组，而不是字符串。元组对所有序列操作都有响应。\n\
    \n## 字典\n\n字典是你与 Python 交互时的一种特殊工具。它们更像哈表模型的结果，功能类似于你在 `C` 或 `Perl` 等许多语言中使用的哈希或哈希数组。这些内容大部分由键值对组成，而键可以是任何类型。在\
    \ Python 中，你会发现它通常是数字字符串。\n\n### 创建字典\n被称为关联数组。字典也可以使用内置的 `dict()` 方法创建。`dict()`\
    \ 语句将是一个键值对列表。元组集合非常适合该需求。\n\n### 字典更新\n你可以引入一个新项或当前的键值对来更新字典，替换现有的条目或移除已有的条目，如下面的简单类比所示。\n\
    \n通过在花括号 `{}` 中添加逗号分隔的键属性值列表（等等，字典使用花括号），你可以构造字典。冒号 `:` 分隔每个键的取值。\n\n### 删除字典组件\n\
    用户可以删除单个字典项，也可以移除字典的完整集合。通过一次事务，你甚至可以卸载整个词汇。要直接删除整个词汇，只需使用 `del` 表达式。\n\n"
