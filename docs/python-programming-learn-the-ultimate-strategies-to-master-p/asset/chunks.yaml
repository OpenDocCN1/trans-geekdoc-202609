    如果我们运行上面的代码，结果如下：![](img/Image00042.jpg)当我们向断言声明传输一个空列表 `mark1` 时，我们得到了错误，条件变为假，假设程序停止并给出了
    `AssertionError`。现在让我们移动另一个符合陈述声明的列表，看看我们的结果会是什么。


    #### 示例 2：使用带错误的陈述消息


    如果我们运行上面的程序，输出将将是：![](img/Image00043.jpg)我们向 `avg()` 函数传输了一个非空数组 `mark2` 和一个空列表
    `mark1`，我们得到了 `mark2` 列的输出，但之后，我们得到了一个错误 `AssertionError: Column is empty`。在开始运行时，陈述要求通过
    `mark2` 列表和系统得到了。`mark1` 仍然不满足标准，因此提供了 `AssertionError`。


    ### 必须记忆的关键点


    - 断言是状态或布尔语句，它们在语言中应该始终有效。

    - 陈述断言需要额外的消息和短语。

    - `Assert Statements` 用于验证形式、参数值和函数输出。

    - `assert statement` 在程序在发生错误的阶段中断时用作调试方法。


