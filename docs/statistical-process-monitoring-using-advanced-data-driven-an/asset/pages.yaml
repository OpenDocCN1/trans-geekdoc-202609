    # 3.2.2 Iterative traditional isolation


    Some of the first approaches to fault isolation were to apply a separate procedure
    after a control chart signaled a fault. These procedures require a decomposition
    of the \(T^2\) statistic or similar step-down procedures. A few popular approaches
    are reviewed here [25]. Nearly all of these approaches first require that an OC
    signal has been issued by the fault detection method. In particular, the first
    two approaches presented assume that \(\mathbf{x}_i \sim N_p(\boldsymbol{\mu},
    \boldsymbol{\Sigma})\), and the \(T^2\) statistic is of course \(T^2 = (\mathbf{x}_i
    - \bar{\mathbf{x}})''\mathbf{S}^{-1}(\mathbf{x}_i - \bar{\mathbf{x}})\). When
    \(\mathbf{x}_i\) is independent of \(\bar{\mathbf{x}}\) and **S**, then the distribution
    of \(T^2\) is


    ```

    \(\frac{n(n-p)}{p(n+1)(n-1)}T^2 \sim F_{p,n-p}.\)

    ```


    and the upper control limit (UCL) uses the upper \(\alpha\) quantile of the \(F_{p,n-p}\)
    distribution.


    # 3.2.2.1 Mason-Young-Tracy method


    The Mason-Young-Tracy method (MYT) is a widely used approach that decomposes the
    \(T^2\) statistic into its orthogonal components, which represent the contribution
    of each individual variable to the overall \(T^2\) [26,27]. For \(p\) variables,
    \(T^2\) can be rewritten as follows:


    ```

    \(T^2 = T_1^2 + T_{2,1}^2 + T_{3,1,2}^2 + \cdots + T_{p,1,2,\dots,p-1}^2.\) (3.3)

    ```'
