  md: 'As the concentration of ozone pollutants is increasing in industrial countries,
    such as those in Europe, and is frequently surpassing safe limits, particularly
    in the summer, it is crucial to monitor these pollutants to avoid harmful effects
    on human health. Shallow methods achieve unsatisfactory accuracy when used to
    predict pollution [64,65]. Therefore, as discussed above, deep learning models
    are essential for modeling and anomaly detection purposes, as they can effectively
    extract useful features from multivariate processes. To overcome the limitations
    of shallow methods regarding the detection of abnormal ozone measurements, we
    suggest using a deep learning model combined with an unsupervised binary detector.
    In our study, DBNs, which are efficient for dimensionality reduction and feature
    extraction, are used to model multivariate time series ozone measurements. This
    model is trained using greedy layerwise pretraining, and it is employed to learn
    features of the ozone level. To detect anomalies, the DBN model is coupled with
    a one-class support vector machine (OCSVM). This method benefits from both DBN''s
    capability to extract features from high-dimensionality data and OCSVM''s capacity
    to discriminate between normal and atypical features. OCSVM is a preferred algorithm
    for anomaly detection due to its flexibility to discriminate between linear and
    nonlinear features without constraints related to the distribution of data. In
    the detection methodology applied in this case study, ozone concentration measurements
    were collected from one monitoring site of the Isère monitoring network. Then,
    we compared the performance of DBN-based methods to DSA- and RBM-based clustering
    methods.


    Section 8.3.2 presents a brief description of the ozone data we used. Section
    8.3.3 introduces the main idea underlying the DBN-OCSVM detection approach. In
    Sect. 8.3.4, we apply and illustrate the used methodology using real ozone datasets.
    Then, we provide some concluding remarks.


