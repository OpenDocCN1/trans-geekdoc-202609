    # ## 5.3 Multiscale filtering using wavelets


    Eliminating or reducing noise from collected data by keeping the maximum of underlying
    process information is an essential task and is usually termed as data filtering
    or denoising. This section offers an introduction to multiscale filtering, which
    is designed based on a multiscale representation.


    # ### 5.3.1 Single scale filter method


    In general, single scale linear filters are built by calculating the weighted
    sum of past data in a window size of finite or infinite length. These conventional
    denoising methods, such as the mean and exponential filters, are known as finite
    impulse response (FIR) and infinite impulse response (IIR) filters. The commonly
    used linear filter is expressed by


    ```

    \(\hat{y}_k = \sum_{i=0}^{N-1} w_i y_{k-i},\) (5.5)

    ```'
