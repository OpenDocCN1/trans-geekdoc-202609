  md: '# 4.3.3 Kernel PCA


    Here, we introduce one of the well-known nonlinear input-space models, KPCA, which
    we use in this work. First, the basic idea behind KPCA and how it is used to model
    multivariate nonlinear processes is introduced. Lastly, the commonly used conventional
    monitoring techniques (i.e., SPE and T^2) with the KPCA model for anomaly detection
    are presented, along with a recently KPCA-based one-class SVM for process monitoring.


    # 4.3.4 Kernel principal components analysis (KPCA) model


    As discussed above, most environmental and engineering processes possess nonlinear
    features, and linear PCAs are not effective in extracting important information
    in the nonlinear processes.


    To overcome this problem, nonlinear PCA methods, such as KPCA, provide the possibility
    to learn process nonlinearity in the data [13,30,29]. Generally speaking, the
    KPCA method stands out from the other existing nonlinear PCA methods in the literature
    due to its flexibility and simplicity [13]. KPCA can be viewed as a reformulation
    of the linear PCA in a high-dimensional space via kernel function to reveal nonlinear
    correlations among variables. It has been primarily used in anomaly detection
    for avoiding the complexity generated by nonlinear optimization in nonlinear PCA
    algorithms with neural networks [30]. The core concept of KPCA consists of projecting
    the data in the input space to a high-dimensional feature space (the kernel space)
    where data becomes more linear. This transformation is performed using a kernel
    function. Then, the linear PCA algorithm can be performed in the feature space,
    and the costly nonlinear optimization is avoided. The conceptual schematic of
    the idea behind KPCA is sketched in Fig. 4.6. Despite the fact that the KPCA learns
    linear features in the kernel space, these features are related to nonlinear features
    in the original space (before transformation) as displayed in Fig. 4.6. The original
    data can be reconstructed by projecting the features in kernel space onto a low-dimensional
    space, spanned by the eigenvectors that caught most of the variability. KPCA


    ![](img/aa2f42c739937b682075082233e335bb_141_0.png)


    FIGURE 4.6 Basic concept of KPCA mapping.'
