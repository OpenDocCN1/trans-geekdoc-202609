    state that is no longer required (when the output is 0, otherwise it will keep
    it). In other words, the forget gate overcomes the weakness of LSTM models by
    preventing them from processing continuous input streams [32]. By scaling the
    content of block memory, it forgets the cell''s memory content in an adaptive
    way.'
