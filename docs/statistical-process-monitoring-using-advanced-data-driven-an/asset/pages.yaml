    # 8.2 Stereovision


    In recent years, there have been great improvements in image processing tools,
    computer vision, and vision sensors. For instance, multiple views can be used
    to obtain 3D information to estimate the depth and thus determine the distance
    of an object from cameras mounted on moving vehicles. Using two views for 3D perception,
    which is commonly called stereoscopic vision, or simply stereo-vision, has proven
    especially useful in applications such as autonomous mobile robots. Stereovision
    requires left and right rectified images, which are processed by applying the
    epipolar geometry constraint to align the y-axis of the two images [4, 6]. Thus,
    stereovision can be defined as a procedure that computes depth information by
    comparing two rectified images from the same scene. The extracted information
    is usually called a disparity map, which encodes deviation in the horizontal coordinates
    of corresponding image pairs. In other words, disparity maps point out disparities
    that represent the difference in an object’s position in two corresponding rectified
    images.


    The value of the disparity expresses the distance of an object from the camera.
    Small values indicate little distance between the object and camera, while larger
    values indicate a greater distance. The disparity map is a matrix of the distances
    between two corresponding pixels in the image pair (left and right). It is computed
    for every image pair to construct 3D data. Numerous techniques have been developed
    in the literature for computing disparity maps, D, based on matching correlation
    metrics, including absolute differences, squared differences, the sum of absolute
    differences (SAD), and normalized cross-correlation [4, 6, 35, 36]. The SAD (defined
    in Eq. (8.1)) is one of the most frequently used metrics to compute disparity
    maps due to the simplicity of implementing it in real time [37, 38]. The SAD measures
    the absolute difference between the intensity of each pixel in the left image,
    Ileft, and the corresponding'
  merge: -1
  img_proc: true
