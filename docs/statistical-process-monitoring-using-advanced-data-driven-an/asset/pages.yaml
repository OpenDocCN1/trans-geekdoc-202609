  md: 'Monitoring multivariate nonlinear processes is obviously more challenging than
    monitoring linear processes, and anomaly may get smeared in the inspected process.
    Since most of the gathered data from environmental and industrial processes are
    inherently nonlinear, nonlinear LVR methods with the needed flexibility to represent
    any nonlinear relationships are required. Recently, nonlinear LVR-based anomaly
    detection techniques have gained considerable attention by researchers and engineers
    for the monitoring of complex processes. This is because of the high capability
    of nonlinear LVR models to extract both linear and nonlinear correlations among
    process variables. Generally, for process monitoring purposes, nonlinear LVR,
    such as nonlinear PLS and PCA methods, are first constructed based on nominal
    measurements from the monitored process running under normal conditions. This
    makes it possible to design a reference model reflecting the nominal behavior
    of the inspected process that can be used to detect potential anomalies. After
    that, anomalies are flagged if the measurements diverge from the nominal operating
    region in the latent space or in the residual space. Indeed, different fault detection
    schemes can be used to check generated residuals including SPE, $T^2$, univariate
    monitoring techniques, or binary clustering algorithms.


    Here, we review the basic problem formulation and algorithm of the nonlinear PLS
    method. For a better understanding of NLPLS, two forms of nonlinear PLS algorithms
    (polynomial and ANFIS) are presented. For the input-space model, we present a
    KPCA method that can be used to model and monitor nonlinear processes. This chapter
    provides a detailed case study comparing the advantages of the KPCA method over
    the PCA method for monitoring nonlinear processes. Data from an actual WWTP are
    used for comparison. In addition, simulated plug flow reactor data are used to
    show the performance of NLPLS for detecting various fault types. This chapter
    concludes with a presentation of a set of firmly established conclusions and a
    list of topics of interest for future research.


    # 4.2 Limitations of linear LVR methods for process monitoring


    For large-scale systems, such as wastewater treatment and petrochemical plants,
    the design of model-based monitoring approaches requires significant effort. Data-based
    techniques, such as LVR methods, provide a better, easier alternative. Techniques
    based on dimensionality reduction, such as PCA and PLS, have received considerable
    attention. Generally speaking, the successful application of a monitoring method
    relies on the quality of the data and the used extracted features from the measured
    data. The well-known LVR methods have been successfully used to capture the information
    of the system. Basically, LVR models project the original data space into a latent
    space, thus reducing the dimension of the original data space while considering
    the correlation among attributes. This helps predict the output variable in the
    reduced latent space and results in an improved prediction ability of the model.
    The main drawback of the linear'
