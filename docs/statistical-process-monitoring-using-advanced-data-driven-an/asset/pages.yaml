- pgno: 30
  md: '# Linear latent variable regression (LVR)-based process monitoring


    # 2.1 Introduction


    With the advancement in instrumentation, data acquisition, and rapid development
    in the “Internet-of-Things” technology, which connects a large number of digital
    devices, enormous amounts of information have become available from anywhere at
    any time, from a multitude of smart devices. Indeed, large datasets are produced
    by the collection of large number of measurements from modern engineering and
    environmental processes. Exploiting these measurements with a certain level of
    redundancy, it becomes feasible to detect abnormal change and locate its sources
    in the inspected process. However, in the absence of effective tools, the information
    in these datasets cannot be suitably extracted and exploited for inference and
    process monitoring.


    Over the past decade, the necessity for prediction and fault-detection tools has
    resulted in the design of several fault-detection mechanisms, which belong to
    either model-based (or analytical) or data-driven methods [1,2]. Analytical models,
    based on ideal hypotheses that utilize first principles, could theoretically explain
    a system’s behavior; however, they need prior calibration of model parameters,
    which is challenging and costly in high-dimensional cases and may result in ill-conditioning
    problems [3]. Data-driven approaches can perform systematic and objective exploration,
    visualization, and interpretation of data, can identify essential factors, features,
    or patterns, and can endorse and optimize data-supported decision-making [4].
    Data-based techniques can carry information on faults by extracting relevant features
    from data. Data-driven approaches are more currently commonly applied in engineering
    and petrochemical processes [5]. For instance, in the petrochemical industry where
    soft-sensors are widely used, billions of dollars were once lost annually because
    of the occurrence of faults [6]. Environmental data have been exploited by data-driven
    approaches for anomaly detection in, for example, meteorological signals [7] or
    monitoring of sludge bulking in wastewater treatment plants (WWTPs) [8]. For instance,
    fault detection in chemical process industries is challenging due to the large
    number of variables involved, the dynamic characteristics and noisy measurements
    that occur in these processes. Indeed, a large number of variables leads to collinearity,
    which increases the uncertainty about the model parameter estimates. The latent
    variable regression (LVR) model is a commonly used'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'modeling framework to remedy such problems. The LVR model can deal with collinearity
    among variables, by constructing a model from a reduced number of variables (which
    are a linear combination of the original variables) called latent variables or
    principal components. This approach results in well-conditioned models [9,10].
    LVR model estimation techniques include principal component regression (PCR) [11,9]
    and partial least squares (PLS) [12,13].


    The organization of this chapter is as follows. In Sect. 2.2, we present a brief
    introduction to inferential modeling methods, including full rank models and latent
    variable regression (LVR) techniques. The presented full rank modeling techniques
    include ordinary least squares (OLS) regression and ridge regression (RR), while
    the latent variable regression techniques include PCR and PLS. Since the conventional
    LVR models are static and more appropriate for handling steady-state processes,
    the dynamic version of the LVR models is also briefly presented. Section 2.3 is
    devoted to an overview of some common statistical techniques that are applied
    in statistical process monitoring. Specifically, this section presents the basic
    univariate monitoring schemes, namely Shewhart, exponentially-weighted moving
    average (EWMA), cumulative sum (CUSUM), generalized likelihood ratio (GLR), and
    distribution-based algorithms, and we discuss their limitations. Section 2.4 presents
    the general framework of fault detection based on LVR approaches. In Sect. 2.5,
    we discuss one of the commonly used fault isolation approaches, namely contribution
    plots. We also present an innovative method that uses the radial visualization
    RadViz to perform root cause diagnosis in Sect. 2.5. The main objective of this
    chapter is to investigate these multivariate monitoring schemes (PCA and PLS)
    and their practical applications. In Sect. 2.6, we assess the performances of
    the developed inferential modeling technique using simulated and practical examples.
    In addition, we evaluate the method of using PCA-based anomaly detection by importing
    seven years of influent characteristics (ICs) data from a coastal municipal WWTP
    where multiple abnormal events occurred. The chapter concludes with a discussion
    and remarks in Sect. 2.7.


    # 2.2 Development of linear LVR models


    Measurements from engineering and industrial processes are usually massive and
    include a large number of (high-dimensional) variables because of the complexity
    of the processes involved. Using traditional regression models like least squares
    are unsuited to provide reliable predictions due to high colinearity and ill-conditioning
    issues. There are a large variety of estimation techniques to address this modeling
    problem, including full-rank methods and latent variable regression methods. In
    this section, we present the basic theoretical perspective of some commonly used
    linear regression models that are used to design process monitoring algorithms,
    namely, OLS, RR, PCR, and PLS. In this section, we review the traditional linear
    correlation models for multivariate data that are the basis for designing fault
    detection methods. The basic concepts of each approach and discussion on their
    advantages and weaknesses are presented.'
