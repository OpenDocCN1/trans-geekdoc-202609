  md: 'RNN models. This section presents some hybrid deep learning models that combine
    variants of recurrent neural networks for temporal modeling and shallow or deep
    probabilistic and generative models to learn complex and hierarchical features
    with a high level of representation. Specifically, we discuss three flexible and
    efficient models to capture temporal dependencies in a multivariate setting: RNN-RBM,
    LSTM-RBM, and LSTM-DBN architectures. These architectures were first designed
    in the context of polyphonic music generation and transcription [33–36].


    # 7.3.1 RNN-RBM


    Accurate modeling of sequences plays a core role in several real applications
    where collected data is inherently sequential, such as text, speech, and videos.
    Extracting the relevant features from these data sources is useful for solving
    discrimination prediction and anomaly detection tasks. Indeed, since an anomaly
    is a deviation from the expected value from the reference model, good modeling
    facilitates the anomaly detection.


    As hybrid deep models, the recurrent temporal RBM (RTRBM), RNN-RBM and LSTM-RBM
    and DBN have proven their ability to learn dependency in temporal patterns. Before
    we go into details of hybrid models, let us first present the most simple one,
    i.e., RTRBM model, which is a probabilistic model. The structure of this hybrid
    model is displayed in Fig. 7.11, where in each RNN time step, the internal feedback
    is passed to the RBM in order generate an output that feeds the next cycle of
    the model. Generally speaking, RTRBM is a succession of conditional RBMs (Fig.
    7.11), and each RBM contains a hidden state that is obtained from the precedent
    RBM and employed to modulate its hidden units bias [33]. At every time point,
    the learning algorithm tries to extract relevant features through a conditional
    RBM using the contrastive divergence (CD) learning approach. RTRBM has shown a
    good ability in describing complex probability distributions over high-dimensional
    sequences [33].


    In the RTRBM model, the parameters are time dependent. The RTRBM parameters are
    $b_v, b_h, W^{(t)}$, and


    ```

