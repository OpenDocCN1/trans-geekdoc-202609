    \(\mathcal{D}_{SAD}(i, j, d) = \sum_{u=-\omega}^{\omega} \sum_{u=-\omega}^{\omega}
    \left| I_{left}(i+u, j+v) - I_{right}(i+u, j-d+v) \right| \quad (8.1)\)


    where \( d \) represents the disparity interval \( [d_{min}, d_{max}] \), which
    is delimited between the minimum and maximum disparity values (\( d_{min} \) and
    \( d_{max} \), respectively), and \( i \), \( j \) are the coordinates (rows and
    columns, respectively) of the center pixel of the SAD. Differences are summed
    over the support window, \( \omega \), to obtain a disparity map.


    Estimating the position of the road profile is helpful for identifying obstacles
    that are standing in the monitored scene. After generating the disparity map,
    it is essential to compute the U-disparity and V-disparity maps [39]. V-Disparity
    maps that effectively estimate a road''s profile using transform and depth estimation
    have been developed [4, 6]. These maps have shown a good ability to provide information
    about obstacles'' height and position in reference to the ground [4, 6]. For illustration
