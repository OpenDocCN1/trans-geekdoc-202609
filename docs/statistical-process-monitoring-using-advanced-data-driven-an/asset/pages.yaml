  md: '![](img/aa2f42c739937b682075082233e335bb_73_0.png)


    FIGURE 2.18 RadViz of IMs datasets with anomalies.


    It has been shown in [148] that the PCA-based fault detection can be further improved
    by using k-nearest neighbors (kNN) algorithm to separate between normal and abnormal
    features in IMs dataset. The use of kNN is motivated by its remarkable success
    in quantifying the similarity between normal and abnormal features due to its
    capability to deal with nonlinear features, and does not involve assumptions on
    the underlying data distribution.


    It should be clear that the PCA-based monitoring schemes are affected by the prediction
    quality of the designed model. The detection results in this application highlight
    that building a nonlinear PCA model may enhance the detection abilities.


    Fig. 2.18 displays a RadViz visualization of IMs datasets with their scores on
    principal components set as anchors. Here, the dimensionality reduction benefits
    of PCA and the desirable properties of multivariate data visualization via RadViz
    have been combined. Moreover, prior knowledge of PCs composition from Fig. 2.15
    provided a clear interpretation and diagnosis of detected anomalies. Observations
    without anomalies (in gray) are scattered in the center region, and numerous anomalies
    from the second to the sixth PC surrounded them in a “V” shape manner. RadViz
    is used here to assist analysis of detected anomalies and identifying their possible
    sources. From Fig. 2.15, it can be seen that anomalies generated by “discharge
    from construction area” and “TDS over the limit” are close to the second and third
    anchors, exactly matching their roles as “TDS” and “Inflow” block-indicators.
    Also, we can see that observations from “Rainfall”, “Internal circulation”, and
    “Lift station flushing” are near to the “Inflow” and the PC5 which is dominated
    by FOG and recycled flow. IM abnormalities caused by “Lime dumping from RO plant”,
    “pH over the limit”, “Total alkalinity over the limit”, and “Water supply shutdown”
    are closer to PC6, which is dominated by'
