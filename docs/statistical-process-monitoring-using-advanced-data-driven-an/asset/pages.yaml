    # 2.5.1.1 Hotelling''s $T^2$ statistic


    The LVR methods (e.g., PCA and PLS) are usually followed by fault detection methods
    using SPE and $T^2$ statistics. Abnormalities in the process can be detected by
    checking whether the measurements are not beyond the region of the normal operation
    in the PCs subspace or in the residuals subspace. The $T^2$ statistic computes
    the fluctuations in the PCs alone at each time instance. More specifically, the
    $T^2$ value is defined as the sum of the squares of the retained PCs divided by
    the corresponding eigenvalue calculated from fault-free data characterizing normal
    operation as [25]


    ```

    $$T^2 = x^T \widehat{P} \widehat{\Lambda}^{-1} \widehat{P}^T x = \sum_{i=1}^l
    \frac{t_i^2}{\lambda_i},$$ (2.67)

    ```


    where $\lambda_i$ is the eigenvalue (variance) of the PC $t_i$. If the actual
    covariance matrix is determined from the sample matrix, the control limit of the
    $T^2$ scheme is given by [25]


    ```

    $$T^2_{l, n, \alpha} = \frac{l(n-1)}{n-l} F_{l, n-l, \alpha},$$ (2.68)

    ```


    where $\alpha$ is the level of significance, and $F_{l,n-l}$ is the Fisher F distribution
    with $l$ and $n-l$ degrees of freedom. In the case of multivariate Gaussian distributed
    data X, and if the size of the sample is large enough, the $T^2$ statistic threshold'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'can be computed from $T_\alpha^2 = \chi_{l, \alpha}^2$. The decision threshold
    value is computed using fault-free data.


    # 2.5.1.2 Q statistic or squared prediction error (SPE)


    To detect faults in the residual subspace, the SPE (also called Q statistic) is
    usually used [22],


    ```

    $Q = \mathbf{e}^T \mathbf{e}.$

    ```


    The decision threshold of the Q statistic is defined as [126]


    ```

    $Q_\alpha = \varphi_1 \left[ \frac{h_0 c_\alpha \sqrt{2\varphi_2}}{\varphi_1}
    + 1 + \frac{\varphi_2 h_0(h_0 - 1)}{\varphi_1^2} \right],$

    ```


    where $c_\alpha$ is the value of the normal distribution with $\alpha$ level of
    significance, \(\varphi_i = \sum_{j=l+1}^m \lambda_j^i\) for \(i = 1, 2, 3\),
    and \(h_0 = 1 - \frac{2\varphi_1 \varphi_3}{3\varphi_2^2}\).


    It should be noted that the Q scheme is sensitive to modeling errors and its detection
    quality mainly relies on the number of retained PCs [22].


    Fig. 2.8 illustrates an example of a data point “b” with a large \(T^2\) value
    representing the (horizontal) distance between the center of the PC plane and
    this point. Also, Fig. 2.8 shows another point with a significant Q value, which
    represents the vertical distance between the PC plan and this atypical data point
    “a”. Generally speaking, the Q indicates the mismatch between the data sample
    and the model.


    ![](img/aa2f42c739937b682075082233e335bb_60_0.png)


    FIGURE 2.8 Projected measurements (blue [dark gray in print version]) and two
    observations “a” and “b” with values of their corresponding \(T^2\) and Q statistics.


    To conclude this section, note that the decision thresholds of Q and \(T^2\) schemes
    are derived based on the fact that the data are uncorrelated and normally distributed.
    To remedy this limitation, an alternative solution based on'
  merge: -1
