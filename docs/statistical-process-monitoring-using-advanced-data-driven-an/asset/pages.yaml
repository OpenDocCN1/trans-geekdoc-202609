    ate standardized data, the strength of the shift in $\mathbf{y}_2$ is dampened,
    and a shift in $\mathbf{y}_1$ also appears. On the other hand, the univariate
    standardization preserves the fault and its strength in $\mathbf{y}_2$. Thus,
    if fault isolation is a primary goal, caution must be taken to ensure that the
    shifted variables are not distorted by the standardization.


    In fact for the multivariate standardization, when the unique symmetric square-root
    is computed with the eigenvector-eigenvalue decomposition, it makes $\hat{\Sigma}^{-1/2}$
    dense, so a fault affecting only one variable in the original data shifts the
    mean of all the variables. If the Cholesky factorization is used, a fault affecting
    variable $k$ shifts the mean of variables $k, k+1, ..., p$. Either way, the fault
    is not preserved in the original variable unless the fault occurs in only variable
    $p$, and the Cholesky factorization is used to obtain $\hat{\Sigma}^{-1/2}$.'
