- pgno: 52
  md: 'From (2.50) we can see that the second term is strictly positive for any \(\sigma_0
    \neq \sigma_1\). We conclude that in the case of faults simultaneously affecting
    the mean and variance of the monitored Gaussian variable the value of KLD is larger
    than its value in the case of a change in the mean alone. Therefore, it is also
    clear that detecting anomalies in the mean and variance of process measurements
    simultaneously using the KLD is easier than detecting anomalies that occur in
    the process mean alone.


    If we use KLD to characterize closeness of distributions \(p_1(x)\) and \(p_2(x)\),
    it turns out that its value becomes close to zero when the two distributions are
    similar; otherwise it deviates significantly from zero. Thus, KLD can be utilized
    for anomaly detection. The KLD-based test to choose between the null hypothesis
    \(\mathcal{H}_0\) and the alternative \(\mathcal{H}_1\) is given by


    ```

    \(\delta(Y) = \begin{cases} \mathcal{H}_0 \text{ if } KLD(p_1 \\ p_2) < H_D, \\
    \mathcal{H}_1 \text{ else.} \end{cases} \quad (2.52)\)

    ```


    From the distribution of the decision statistic, KLD, the threshold of the KLD
    mechanism can be computed nonparametrically as the \((1 - \alpha)\)th quantile
    of the approximated distribution of KLD statistic obtained by kernel density estimation
    (KDE). The nonparametric threshold is computed using anomaly-free data. We declare
    an anomaly when the KLD statistic exceeds the decision threshold.


    # 2.4.2.2 Hellinger-based monitoring scheme


    The test statistic considered here is based on the Hellinger distance (HD) metric.
    It was introduced by Ernst Hellinger and can be adapted to measure the similarity
    among two different probability vectors [95–97]. As with KLD, HD distance also
    plays a central role in several problems of mathematical statistics [98,96, 97].
    The HD measure has been widely exploited in numerous disciplines, including pattern
    recognition [99], image processing [100], classification [101] and anomaly detection
    [102,97,103]. Additionally, the HD metric has been exploited in different applications
    including cybersecurity [103] and fraud detection in insurance [104].


    **Definition 2.2** (Hellinger distance). *The HD between two PDFs \(p_1(x)\) and
    \(p_2(x)\) is the value*


    ```

    \(H D^2(p_1, p_2) = \frac{1}{2} \sum (\sqrt{p_1(x)} - \sqrt{p_2(x)})^2. \quad
    (2.53)\)

    ```


    We can see that HD is the Euclidean norm of the difference between the square
    root vectors:


    ```

    \(H D^2(p_1, p_2) = \frac{1}{\sqrt{2}} \| \sqrt{p_1} - \sqrt{p_2} \|_2. \quad
    (2.54)\)

    ```'
