    # 4.5.1.2 Detection results


    After identifying the reference NLPLS model, we used it to detect anomalies in
    the PFR process. Three monitoring techniques were considered here based on the
    identified NLPLS model: the conventional NLPLS-Q scheme and NLPLS-based Hellinger
    distance (HD) using unfiltered residuals and filtered residuals. In the NLPLS-HD
    scheme, the HD was used as an indicator of fault by computing the deviation between
    probability distributions of actual residuals and residuals obtained using fault-free
    data. Here, the 3-sigma rule was used to set up the detection threshold for NLPLS-HD.
    To improve the robustness of the NLPLS-HD measurement noise, we applied HD on
    the filtered residuals with a wavelet-based filter to reduce the noise in the
    data and improve the robustness to measurement noise. The residuals, which show
    a mismatch between the output of the reference NLPLS model and the measurements,
    are filtered via a wavelet-based filter and used as the input for the NLPLS-HD
    scheme.'
