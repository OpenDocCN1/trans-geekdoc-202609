    time points cannot guarantee a good prediction of the expected value at the next
    time point. With such high-dimensional objects, using RNNs alone to uncover correlated
    patterns would be very expensive. To overcome this issue, energy-based models
    such as the Boltzmann machine (RBM) are integrated into'
