    data with nonlinearity can lead to the loss of important information, resulting
    in poor model prediction and misleading analysis. The major limitation of LVR-based
    approaches is their ability to extract only linear features from the data; they
    also fail to describe the actual behavior. To alleviate this drawback, numerous
