  md: 'Incorporating these into the adaptive lasso estimation yields the following
    objective function:


    \(\mu^* = \text{argmin}_\mu \left( (\tilde{\mathbf{y}}_i - \tilde{\mathbf{A}}\mu)''(\tilde{\mathbf{y}}_i
    - \tilde{\mathbf{A}}\mu) + \gamma \sum_{j=1}^p \frac{1}{\tilde{x}_j} |\mu_j| \right)
    .\)


    Ebrahimi et al. [55] test their method in simulation with values of \(p\) ranging
    from 100 to 10,000, so they are able to test very high-dimensional settings. In
    IC settings, the percentage of false detections is reported, and this reaches
    the nominal setting of \(\alpha = 0.05\) when \(p \ge 5000\). The ARL is computed
    for OC settings for varying shift magnitudes, and the APC strongly approach outperforms
    the benchmark comparison methods. The ability of the PCSR method to isolate shifted
    variables is also evaluated via several metrics, including


    +   - false negative percentage (FN%)—the percentage of shifted variables not
    detected out of the total number of shifted variables;

    +   - false positive percentage (FP%)—the percentage of the nonshifted variables
    identified out of the total number of nonshifted variables; and

    +   - parameter selection score (PSS)—total number of variables incorrectly classified
    (either as shifted or nonshifted).


    While the FN% is relatively low across multiple shift sizes and simulation settings,
    the FP% and PSS can be large for small shifts, but both decline rapidly as the
    shift size increases. PCSR performs similarly to [3], another lasso-based fault
    isolation method, for processes with nonsparse covariance matrices. However, PCSR
    is better if the process has a sparse covariance matrix, and the authors of [55]
    argue that such settings are common in practice since variables are usually only
    correlated with a small subset of the total monitored variables. Thus, APC-PCSR
    is a promising method to apply in high-dimensional settings, and its use is illustrated
    in a case study in Sect. 3.5.2. Jiang et al. [56] also reduce variables for use
    in PCA-based monitoring but with an optimization algorithm.


    # Additional Phase II Fault Isolation Methods.


    Many methods for Phase II fault isolation have been proposed for specific purposes.
    Jiang et al. [6] propose a variable selection multivariate EWMA (VS-MEWMA) chart
    that continues to use the \(L_0\) penalty of the VS-MSPC chart of [2]. Yan et
    al. [57] propose a VS-based control chart for high-dimensional Gaussian mixture
    models. Kuang et al. [58] incorporate VS into discriminant analysis for multivariate
    fault isolation. Various types of Kalman filters are used in [59] and [60] to
    detect and isolate sensor faults.


    The Phase II VS-based control charts described herein assume that the mean and
    covariance matrix are known, so Li et al. [61] introduce a robust self-starting
    approach that reduces the number of IC observations needed to initiate the VS-MEWMA
    chart. Liang et al. [62] propose a version of the LEWMA [16] that can be applied
    to any continuous process generated within the family of elliptical distributions,
    performing better for heavy-tailed and skewed multivariate'
