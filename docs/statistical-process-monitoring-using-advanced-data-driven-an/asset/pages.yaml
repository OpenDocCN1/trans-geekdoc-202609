    # 4.3.5 KPCA-based fault detection procedures


    KPCA monitoring is performed in two broad phases: model development and anomaly
    detection. The decision statistics (e.g., Hotelling''s \(T^2\) and \(Q\)) and
    their detection thresholds are computed in the offline modeling phase. In the
    anomaly detection phase, the monitoring statistics are calculated based on the
    new testing measurements and compared with the previously established decision
    thresholds to verify the status of the process. An anomaly is flagged if a test
    statistic is above its detection threshold.


    For anomaly-detection purposes, the \(T^2\) and SPE (squared prediction error)
    monitoring schemes can be computed by testing online measurements. To monitor
    the variation in the KPCA model, \(T^2\) scheme, which uses normalized squared
    scores, is employed. Its statistic is computed as


    \(T_f^2 = [t_1, \dots, t_p] \, \Lambda^{-1} [t_1, \dots, t_p]^T, \quad (4.30)\)


    where \(t_k \ (k=1, 2, \dots, p)\) are the retained \(p\) PCs, and \(\Lambda^{-1}\)
    is the inverse of the matrix of eigenvalues corresponding to the retained PCs.


    The detection threshold for \(T^2\) is computed from the \(F\) distribution as


    \(T_\alpha^2 = \frac{p(m-1)}{(m-p)} F_{p, m-p, \alpha}, \quad (4.31)\)


    where \(F_{p, m-p, \alpha}\) is an F-distribution with \(p\) and \(m-p\) degrees
    of freedom and having a significance level of \(\alpha\).


    The variations in the smallest \(m-p\) PCs can be monitored using the \(Q\) statistic.
    Indeed, the \(Q\) statistic is relevant to indicate the variability not described
    by the maintained PCs in the KPCA model:


    \(Q_f = \|\Phi(\mathbf{x}) - \Phi_p(\mathbf{x})\|^2 = \sum_{j=1}^m t_j^2 - \sum_{j=1}^p
    t_j^2. \quad (4.32)\)'
