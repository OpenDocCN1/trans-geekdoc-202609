    details, refer to [35,36, 34,12].


    The first pair of latent variable vectors is calculated so that the following
    covariance:


    ```

    \(\underset{p_i, q_i}{\text{arg max }} \text{cov}(\mathbf{t}_1, \mathbf{u}_1)
    = \mathbf{t}_1^T \mathbf{u}_1 = \mathbf{p}_1^T \mathbf{X}^T \mathbf{Y} \mathbf{q}_1\)
    (2.24)

    ```


    can be maximized with constraints \(\mathbf{p}_i^T \mathbf{p}_i = 1\) and \(\mathbf{q}_i^T
    \mathbf{q}_i = 1\).


    The first pair \( (p_1, q_1) \) of loading vectors, which represents the dominant
    direction, is computed so that the covariance between \(\mathbf{X}\) and \(\mathbf{Y}\)
    is maximized. Then, the first set of latent variable vectors (\( t_1 = \mathbf{X}
    p_1; u_1 = \mathbf{Y} q_1 \)) is obtained by projecting \(\mathbf{X}\) data on
    \( p_1 \) and \(\mathbf{Y}\) data on \( q_1 \) (the outer model). After that,
    the inner model can be established between \( t_1 \) and \( u_1 \) (\( \widehat{u}_1
    = t_1 b_1 \)).


    After the first set of scores and loadings are computed, the residuals of the
    input and output variables are calculated as


    ```

    \(\left\{ \begin{array}{l} \mathbf{E}_1 = \mathbf{X} - t_1 p_1, \\ \mathbf{F}_1
    = \mathbf{Y} - u_1 q_1 = \mathbf{Y} - t_1 b_1 q_1. \end{array} \right.\) (2.25)

    ```


