- pgno: 57
  md: 'attribution of weight \(0 < \gamma \le 1\) that is utilized to allocate importance
    to observations; \(Z_i\) is the \(i\)th EWMA vector, and \(X_i\) is the \(i\)th
    observation vector, \(i = 1, 2, \dots, n\). We see that if \(\Gamma = \mathbf{I}\),
    then the MEWMA scheme becomes equal to the \(T^2\) scheme. Very often, in practice,
    in the absence of prior reason to assign a different weight for each component,
    for simplicity it is convenient to assume \(\gamma_1 = \gamma_2 = \cdots = \gamma_m
    = \gamma\). Thus (2.63) can be written as


    \(\mathbf{Z}_t = \gamma \mathbf{X}_t + (1-\gamma)\mathbf{Z}_{t-1}.\) (2.64)


    For constructing the MEWMA chart, the MEWMA statistic can be computed recursively
    as [115]


    \(\mathbf{V}_t^2 = \mathbf{Z}_t^T \Sigma_{\mathbf{Z}_t}^{-1} \mathbf{Z}_t,\) (2.65)


    where \(\Sigma_{\mathbf{Z}_t}\) is the variance-covariance matrix of \(\mathbf{Z}_t\),


    \(\Sigma_{\mathbf{Z}_t} = \frac{\gamma}{(2-\gamma)}[1-(1-\gamma)^{2n}]\Sigma,\)
    (2.66)


    where \(\Sigma\) is the covariance matrix of the input data. For large \(t\),
    the covariance matrix converges to \(\Sigma_{\mathbf{Z}_t} = (\frac{\gamma}{(2-\gamma)})\Sigma\).


    Under the hypothesis of no change, the MEWMA statistic is Gaussian distributed
    with variance-covariance matrix \(\Sigma_{Z_i}, Z \sim \mathcal{N}(0, \Sigma_{Z_i})\).
    In the presence of mean shift, \(\mu_1\), the distribution of MEWMA statistic
    is \(Z \sim \mathcal{N}\left(\gamma \sum_{j=1}^n \left[1-(1-\gamma)^{n-j}\theta\right],
    \Sigma_{Z_i}\right)\). Hence, it follows that \(\mathbf{V}_t^2\) is distributed
    as a \(\chi^2\) with \(P\) degrees of freedom in the absence of change. However,
    since the variables \(\mathbf{V}_t^2, t=1, 2, \dots\), are correlated, the decision
    threshold of the MEWMA scheme cannot directly be chosen as the \((1-\alpha)\)th
    quantile of the \(\chi_P^2\) distribution. Numerous procedures have been suggested
    in the literature to compute the decision threshold \(h\) with respect to the
    parameters \(\gamma, p,\) and \(\alpha\), such as Monte Carlo simulation and Markov
    chain approximation [77, 119]. In [120], a procedure implemented in Fortran to
    compute the MEWMA threshold is given to achieve a fixed number of false alarms
    and a given \(\gamma\). Also, in [121] a method to compute the optimal \(\gamma\)
    and corresponding threshold \(h\) for a selected combination of \(p\), the magnitude
    of the shift to be detected, and the targeted ARL0 is developed.


    Let us comment further on weighting matrix \(\Gamma\). In [122], it has been shown
    that the detection performance of the MEWMA scheme can be enhanced when using
    \(\Gamma\) with nonzero off-diagonal elements compared to using a single weighting
    parameter \(\gamma\). However, in this case, the construction of the MEWMA scheme
    is not an easy task, in particular, to properly select the weighting matrix parameters.
    This is mainly due to the fact that fault direction and the correlation among
    the process variables should be considered in the design of the MEWMA.


    Furthermore, to use the MEWMA monitoring schemes to detect anomalies in the process
    covariance matrix, there have been several MEWMA extensions in the literature;
    we refer to [123–125].'
