    It should be noted that KPCA can be performed without straightforward knowledge
    of the mapping function \(\Phi\) or the feature space \(F\). As an alternative,
    computation is done on the inner product of pairs of points that are saved in
    a kernel matrix. This procedure is called “the kernel trick”, which is a core
    part of the KPCA approach.


    As indicated before, KPCA provides the possibility of transforming nonlinear features
    into linear separable features from the input space to feature space \(\mathfrak{F}\)
    via kernel mapping and then apply the conventional PCA in the feature space. Let
    us consider the training dataset \(\mathbf{x}_1, \mathbf{x}_2, \dots, \mathbf{x}_n
    \in \mathbb{R}^m\), where \(m\) is the dimension of the variable and \(n\) is
    the number of available measurements. The original data is mapped from the input
    space to features space via a nonlinear-mapping function, \(\Phi(\cdot)\), defined
    as


    ```

    \(\mathbb{R}^m \xrightarrow{\Phi(\cdot)} \mathbb{F}^h,\quad (4.12)\)

    ```


    where \(h\) is the dimension of the feature space. Thereby, \(\Phi(\mathbf{x}_i)\)
    is the image of the observation \(\mathbf{x}_i \in \mathbb{R}^m\) in the feature
    space.'
