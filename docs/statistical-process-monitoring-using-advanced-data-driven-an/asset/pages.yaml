    # ## 5.7 Results and discussions


    # ### 5.7.1 Application with synthetic data


    Now, the prediction capability of the above multiscale LVR models is assessed
    and compared with both conventional LVR modeling models and models obtained from
    single-scale filtering methods. The comparison is performed on two case studies
    based on simulated synthetic data and simulated distillation column data. The
    model parameters are optimized for both case studies, using a cross-validation
    approach; the mean squared error (MSE) is reported, using testing data set, and
    computed as follows:


    \(\text{MSE} = \frac{1}{N} \sum_{k=1}^{n} (y(k) - \hat{y}(k))^2, \quad (5.11)\)


    where \(\hat{y}(k)\) is model prediction, \(y(k)\) is the gathered output at time
    instant \(k\), and \(n\) is the length of testing samples.


