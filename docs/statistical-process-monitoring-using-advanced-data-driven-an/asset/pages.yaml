    # 2.5.2.2 Fault diagnosis using RadViz visualizer


    RadViz visualization was first proposed by Patrick Hoffman et al. in [142,143]
    as a multivariate data visualization tool to classify DNA sequences. Indeed, RadViz
    enables nonlinear projecting of high dimensional data into a 2-dimensional space
    and allows direct interpretation of the position of the observation in the space.
    It can visualize high dimensional data comprising three or more variables in a
    2-dimensional space. RadViz has been widely used to visualize, interpret, and
    cluster high dimensional datasets like microarray data and stock exchange trends.


    Generally speaking, RadViz reaps the benefits of the dimensionality-reduction
    methods with scatterplots, where the value of each observation could be indicated
    from the distance to the anchors [144]. The anchor points are the visualized variables
    uniformly spaced in the circumference of a unit circle. Fig. 2.9 gives an illustrative
    example showing the basic concept of a RadViz Visualizer. In this method, each
    point is linked to every anchor by a virtual spring. Here, the position of each
    observation in the circle is calculated based on its relative influence by the
    anchors (i.e., spring force for each spring). The coordinates of each observation
    are at the point where the system of spring forces attains equilibrium. The influence
    of each anchor on the projected observation is relative to the amplitude of the
    coordinate for that anchor. The coordinates of each observation in RadViz are
    computed as


    $x_i = \frac{\sum_{i=1}^d x_i \cos \theta_j}{\sum_{i=1}^d x_i}, \quad (2.75)$


    $y_i = \frac{\sum_{i=1}^d x_i \sin \theta_j}{\sum_{i=1}^d x_i}, \quad (2.76)$


    where x_i and y_i are the coordinate of the projected observation, and θ_j denotes
    the angular position on the circle for the anchor j; a_i,j represents the value
    for dimension j for the observation i; d is the number of dimensions; and n the
    number of observations.


    The main characteristics of RadViz method can be summarized as follows. In this
    2D space, observations in the center have approximately equal dimensional'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/aa2f42c739937b682075082233e335bb_64_0.png)


