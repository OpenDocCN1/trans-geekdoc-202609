  md: '# 6.2.2.2 Agglomerative clustering


    Hierarchical clustering procedures generate a nested sequence of clusters that
    can be visualized as a hierarchical tree [32]. The agglomerative hierarchical
    scheme is a nonparametric clustering that does not require the number of the clusters
    as input. The essence of this scheme is to merge clusters that are similar. The
    procedure is repeated until the intended number of clusters is achieved or the
    distance between the two closest clusters exceeds a certain threshold distance
    (see Fig. 6.2). The basic procedure of agglomerative clustering is outlined as
    follows:


    ![](img/aa2f42c739937b682075082233e335bb_207_0.png)


    FIGURE 6.2 Illustrative example of agglomerative clustering (dendrogram).


    +   - Consider each data point as a cluster and compute the proximity matrix

    +   - Compute similarity/dissimilarity between each pair of data points

    +   - Based on linkage function, group data points into a hierarchical cluster
    tree

    +   - Combine closer clusters and update the proximity matrix


    # 6.2.3 Density-based approach


    The essence of the density-based clustering is to consider the data in a zone
    with a high density of the data points to be in the same cluster [33]. Thus, clustering
    procedures based on density possess the ability to uncover clusters with arbitrary
    shape and have the advantage of making less assumptions about the data without
    needing the number of clusters to be provided a priori. There are several clustering
    procedures in the literature designed using the density-based concept, such as
    DBSCAN [34], OPTICS [35], and mean-shift [36,37]. For further details on density-based
    clustering, we refer to [33,37,38]. The key benefit of this type of clustering
    is the greater capability to cluster data points with arbitrary shape. But, this
    approach achieves low clustering efficiency in the case when the density of data
    space isn’t uniform. Its additional disadvantage is that it requires big memory
    when the volume of the data is large, and the clustering outcome is largely sensitive
    to the parameters.


    Mean shift clustering is one of the commonly used density-based clustering procedures
    that will be briefly introduced next.'
