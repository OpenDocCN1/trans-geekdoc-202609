    # 8.4 Monitoring of a wastewater treatment plant using deep learning


    # 8.4.1 Introduction


    Treating wastewater by removing pollutants is crucial for ensuring the health
    of communities and the environment. Treated wastewater can be safely discharged
    or reused for cleaning, irrigation, and industrial purposes [88]. Practically,
    it is more advantageous to recycle and reuse treated wastewater instead of discharging
    it [89]. In water-stressed countries, reusing wastewater is vital, as it is a
    substantial source of water and is associated with a lower cost than desalting
    seawater [90,91]. Recently, monitoring WWTPs using data-driven methods, such as
    computational intelligence and machine learning techniques, has gained attention
    among researchers and engineers.


    To guarantee the effective running of WWTPs, several important variables, including
    pH, dissolved oxygen, and nitrogen, must be continuously monitored [92,93]. To
    ensure efficient monitoring, a good model that describes the dynamics and variability
    of WWTP data is indispensable. However, as the WWTP process is complex and uncertain
    due to changes in physical features, developing a model that produces reliable
    and accurate descriptions of variability in WWTP data is very challenging. Many
    methods for understanding'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'wastewater processes, including ASM1, ASM2, first principals can describe linear
    and nonlinear variation and reveal important process features, but it is challenging
    to construct a realistic model because it requires prior parameters for calibration
    and incurs a great time cost, especially for complex processes such as WWTPs [94–96].
    For instance, in the ASM1 model, there are 13 nonlinear differential equations
    involving 19 parameters that are not easy to predict [97]. Generally speaking,
    analytical models based on first principals could describe linear and nonlinear
    variation, reveal important process features, but there is a major challenge in
    constructing a realistic model because it demands prior parameters for calibration
    and time-costly in particular for complex processes such as WWTPs. The computational
    complexity of these models constitutes an obstacle to the simulation and design
    process [98].


    Although WWTPs utilize advanced technologies, they are exposed to anomalies and
    failures that limit their capability and productivity. Misdetected anomalies in
    WWTPs could seriously affect the health of a WWTP and may result in safety issues.
    Therefore, accurately detecting anomalies is required to ensure normal operating
    conditions and achieve the desired performance [99–101]. Much prior research has
    focused on developing improved anomaly detection methods for monitoring WWTPs
    [102,103]. Recently, monitoring WWTPs using data-driven methods, such as computational
    intelligence and machine learning, has gained special attention from researchers
    and engineers. In data-driven methods, measurements from the WWTPs devoid from
    anomalies are used to construct an empirical model that is used to verify new
    measurements.


    In the literature, several data-based anomaly detection methods are designed using
    dimensionality reduction techniques, such as In the literature, several data-based
    anomaly detection methods have been designed using dimensionality reduction techniques,
    such as PCA [104], PLS [105], linear discriminant analysis (LDA) [106] and locally
    linear embedding (LLE) [93]. Kernel extensions of some linear dimensionality reduction
    algorithms, such as kernel PCA and kernel PLS, have been considered for nonlinear
    process monitoring because of their ability to extract linear and nonlinear features
    from nonlinear processes like WWTPs [93,107–112]. For instance, in [102] a method
    combining PCA and multiple regression was introduced for modeling a WWTP. In addition,
    the method described in [104] integrated PCA with kNN to monitor influent measurements
    in a coastal municipal WWTP. In [113], a PLS-based method was applied to monitor
    effluent quality and filamentous bulking in an activated sludge process. In recent
    years, numerous machine learning methods have been designed to model and monitor
    WWTPs [114,115,103,116]. For example, the method described in [103] coupled an
    ANN with neural fuzzy models to monitor WWTPs. Also, in [116], a neural ANN model
    was used to monitor an anaerobic WWTP. In [117], a hybrid method using multiple
    linear regression and ANNs was developed to predict the influence of biochemical
    oxygen demand, which is costly and challenging to measure. In [118], kernel PCA
    was'
