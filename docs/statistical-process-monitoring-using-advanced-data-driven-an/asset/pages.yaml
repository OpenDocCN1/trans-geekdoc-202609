  md: 'From now on, we consider that autoscaled data is zero-mean centered with unit
    variance,


    ![](img/aa2f42c739937b682075082233e335bb_35_0.png)


    The scaled data **X** can be expressed using singular value decomposition (SVD)
    as a product of two factors:


    X = t_1 w_1^T + t_2 w_2^T + \cdots + t_m w_m^T = T W^T , \quad (2.10)


    where T ∈ R^{n×m} represents a matrix of the principal components (PCs) and W
    ∈ R^{m×m} is the loading matrix. The PCs are linear combinations of the original
    data, and each PC is not correlated with the others. The loading matrix is frequently
    calculated through SVD of the covariance matrix S of the data X:


    S = \frac{1}{n-1} X^T X = W \Lambda W^T \quad \text{with} \quad W W^T = W^T W
    = I_n , \quad (2.11)


    where, Λ = diag(σ_1^2, ..., σ_m^2) is a matrix comprising eigenvalues of S arranged
    diagonally in decreasing magnitude. The eigenvalues λ_i are equal to the variance
    of the PC t_i, σ_i^2 (i.e., var(w_i^T X) = λ_i).


    In the presence of cross-correlated multivariate data, X, the first l PCs (where
    k < m) are sufficient for preserving relevant information in the original data.
    One important step in PCA model development is to select the number of PCs.


    # Criteria for selecting the number of principal components to use


    A core step in designing LVR approaches is selecting by the number of LVs, l,
    to appropriately extract relevant information from the received data. In other
    words, the prediction performance of the designed LVR model is influenced by the
    choice of the number of LVs, l. Accordingly, an appropriate estimation of the
    number of LVs is necessary to avoid the problem of the model underfitting or overfitting
    the data. Some of these techniques are briefed below:


    +   * **The scree test.** The scree plot displays the variance caught by every
    PC against the number of the PCs [31]. Then, the number of PCs to retain are obtained
    by finding the value of the eigenvalue λ corresponding to the profile with an
    elbow shape (i.e., the profile is no longer linear). This identification procedure
    is easy to visualize but it could be not easy for automatic implementation.


    +   * **Parallel analysis.** Parallel analysis compares the variance profile to
    that obtained by assuming independent variables, to determine the number of PCs.
    Specifically, l is determined at the point where the two profiles cross [31, 32].


    +   * **The cumulative percentage variance (CPV) procedure.** The CPV procedure
    has been commonly employed to find the number of PCs explaining a certain'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'percentage of the total variance (e.g., 90%) [31]:


    \( CPV(l) = \frac{\sum_{i=1}^l \lambda_i}{\sum_{i=1}^m \lambda_i} \times 100.
    \) (2.12)


    This procedure is attractive since it is intuitive and easy to implement [31].


    +   • Cross-validation. Basically, the key concept of the cross-validation mechanism
    is splitting the data in training datasets for model construction and testing
    datasets for model validation [33]. The model is verified using the test data,
    and residuals are generated by comparing the estimated values to the measured
    values. In the CV approach, the optimum number of PCs is determined by using Predictive
    Sum of Squares (PRESS) statistics [33],


    \( PRESS_l = \sum_{i=1}^n (X_i - \hat{X}_i^l)^2, \) (2.13)


    where \( l \) is the number of PCs vectors retained to calculate \( \hat{X} \),
    i.e., the dimension of the PCs. The dimensionality is determined by finding the
    number of PCs corresponding to the minimum of the PRESS [33].


    Based on the PCA model, after selecting the appropriate number of PCs to include
    in the model, the data matrix **X** can be expressed as a sum of the approximated
    matrix, \( \widehat{\mathbf{X}} \), and residual data, **E** (Fig. 2.1),


    \( \mathbf{X} = \mathbf{T}\mathbf{W}^T = \sum_{i=1}^k t_i w_i^T + \sum_{i=k+1}^m
    t_i w_i^T = \widehat{\mathbf{X}} + \mathbf{E}, \) (2.14)


    where \( \mathbf{T} \in \mathbb{R}^{n \times m} \) represents a matrix of the
    principal components (PCs) and \( \mathbf{W} \in \mathbb{R}^{m \times m} \) is
    the loading matrix.


    ![](img/aa2f42c739937b682075082233e335bb_36_0.png)


    # FIGURE 2.1 Schematic representation of PCA model.'
