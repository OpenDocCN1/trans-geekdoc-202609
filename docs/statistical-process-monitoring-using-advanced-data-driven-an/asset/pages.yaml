    based on faultless datasets. Then, the decision threshold is set to the corresponding
    \((1-\alpha)\)th quantile. Results in [64] claim that KPCA with non-parametric
    thresholds outperforms empirical PCA''s \(Q\) and \(T^2\) statistics based on
    the Gaussian distribution for effective fault detection in nonlinear processes.
