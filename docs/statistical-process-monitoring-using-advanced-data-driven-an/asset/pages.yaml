  md: '# 6.4.3.1 Deep belief networks


    DBNs are among the first introduced nonconvolutional models addressing the training
    of deep structures [78,79]. DBNs are efficient learning models that combine the
    advantages of dimensionality reduction and data representation, without imposing
    assumptions on the underlying data structures. Basically, DBNs are multilayer
    probabilistic generative models that are designed by the stacking of several RBMs
    (Fig. 6.13), in which each hidden layer (RBM) is a Markov random field. From Fig.
    6.13, the first RBM (RBM1) is built up from the input layer and the first hidden
    layer, and the second RBM (RBM2) consists of the first and the second hidden layers,
    and the third RBM (RBM3) is formed based on the second and the third hidden layers.
    That is, a DBN model possesses multiple hidden layers, **h**<sub>1</sub>, ...,
    **h**<sub>ℓ</sub> and a single visible layer **v**. Here, we denote by **W**_<sub>j</sub>_
    the weight matrix between the previous layer _j_ - 1 and the actual layer _j_.


    DBN layers consist of stochastic binary variables (called latent variables) having
    weighted connections that play a role of feature detectors. The DBN’s visible
    units could be binary or real. Notice that there are no connections between units
    in the same layer as in RBM. In addition, there are connections between units
    in successive separate layers of DBNs (Fig. 6.13). This allows constructing more
    sparse connected DBNs. Moreover, the DBN is characterized by its hybrid nature
    that involves directed and undirected connections. Specifically, undirected connections
    are used between the top two layers and directed connections are between all other
    layers.


    ![](img/aa2f42c739937b682075082233e335bb_223_0.png)


    Essentially, a DBN that possesses ℓ hidden layers comprises ℓ weight matrices
    (**W**<sub>1</sub>, ..., **W**<sub>ℓ</sub>). It comprises also ℓ + 1 bias vectors,
    **b**<sub>0</sub>, ..., **b**<sub>ℓ</sub>, where **b**<sub>0</sub> represents
    the biases from the visible layer.


    Hence, for the DBN, the joint distribution of the observed vector **x** and ℓ
    hidden layers **h**_<sub>k</sub>_ (_k_ = 1, ..., ℓ) is calculated as [78]


    ```

    P(**x**, **h**<sub>1</sub>, ..., **h**<sub>ℓ</sub>) = \(\left( \prod_{k=0}^{\ell-2}
    P(\mathbf{h}_k|\mathbf{h}_{k+1}) \right) \cdot P(\mathbf{h}_{\ell-1}, \mathbf{h}_\ell).\quad
    (6.31)\)

    ```'
